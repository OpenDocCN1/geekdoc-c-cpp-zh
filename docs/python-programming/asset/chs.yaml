  | :--- | :--- | :--- |\n| 6 | | |\n\n除了列表之外，元组（Tuples）也是 Python 中高效的序列。列表是可变对象，而元组是不可变对象。因此，元组不允许进行更新和删除操作。本章详细讨论了元组。\n\
  \n### 6.1 元组的必要\n\n元组与列表相似，不同在于它是不可变的。这意味着一旦在元组中定义了数据，就不允许对数据进行更改。不可变性的优势列如下：\n\n\
  - 在不可变对象进行复制操作期间，其效率比可变对象高。\n- 在不可变对象进行比较操作期间，其效率比可变对象高。\n- 对于任何不可变对象的值，只能存储一个副本。\n\
  - 在并发代码中，不需要对不可变对象进行同步访问的开发。\n- 支持常量正确性（const correctness）特性。\n- 列表用于维护动态数据，而元组用于维护固定大小的数据。\n\
  - 对于元组，不能添加新元素。\n- 对于元组，不能移除现有元素。\n- 元组通过限制添加和删除功能来维护数据。元组仅允许访问元素。\n- 通常情况下，可以使用元组维护常量值。\n\
  - 元组的执行速度比列表快。\n- 元组可以作为字典的键，而列表是不允许的。\n- 列表的移植性高于元组。\n\n元组的声明与列表相似，区别是它使用 `()`。\n\
  \n```python\n>>> a=(4,”t”,6.5)\n>>> a\n(4, ‘t’, 6.5)\n>>> type(a)\n<class ‘tuple’>\n\
  ```\n\n可以使用 `tuple()` 函数将任何对象转换为元组。\n\n```python\na=[10,20]\nprint(a)\nprint(type(a))\n\
  b=tuple(a)\nprint(b)\nprint(type(b))\n```\n输出：\n```\n[10, 20]\n<class ‘list’>\n\
  (10, 20)\n<class ‘tuple’>\n```\n\n在元组对象中，索引从 0 开始。索引 -1 表示从最高索引开始的索引。\n\n```python\n\
  >>> a[0]\n4\n>>> a[1]\n‘t’\n>>> a[2]\n6.5\n>>> a[-1]\n6.5\n>>> a[3]\nTraceback (most\
  \ recent call last):\nFile “<stdin>”, line 1, in <module>\nIndexError: tuple index\
  \ out of range\n```\n\n在上面的示例代码中，元组的长度为 3。因此，索引范围是 0 到 2。对于索引值=3，它返回了错误。元组是不可变的。因此，更改元组对象元素的任何值都会产生错误。\n\
  \n```python\n>>> a[0]=10\nTraceback (most recent call last):\nFile “<stdin>”, line\
  \ 1, in <module>\nTypeError: ‘tuple’ object does not support item assignment\n>>>\
  \ a[1]=’e’\nTraceback (most recent call last):\nFile “<stdin>”, line 1, in <module>\n\
  TypeError: ‘tuple’ object does not support item assignment\n```\n\n我们可以在另一个元组内部声明元组；这被称为嵌套元组（Nested\
  \ Tuples）。\n\n```python\n>>> a=(2,”b”,3.2,10,(4,2))\n>>> a\n(2, ‘b’, 3.2, 10, (4,\
  \ 2))\n>>> a[0]\n2\n>>> a[1]\n‘b’\n>>> a[2]\n3.2\n>>> a[3]\n10\n>>> a[4]\n(4, 2)\n\
  >>> a[4][0]\n4\n>>> a[4][1]\n2\n```\n\n### 6.2 序列解包\n\n序列解包允许同时赋值多个值。解包将取元组元素并赋值给单个变量。嵌套序列允许将子元组赋值给单个变量。对于这使用\
  \ `()`。\n\n```python\n>>> i1,i2,i3,i4,i5=(2,”b”,3.2,10,(4,2))\n>>> i1\n2\n>>> i2\n\
  ‘b’\n>>> i3\n3.2\n>>> i4\n10\n>>> i5\n(4, 2)\n```\n\n序列解包也适用于循环。在这种情况下，范围可以解包到多个变量。对于这种解包类型，应该使用元组。\n\
  \n```python\nfor x,y in [(10,20)]:\n```\n输出：\n如果没有使用元组，值无法解包到多个变量。在这种情况下，会产生错误。\n\
  \n```python\nfor x,y in (10,20):\n    print(x,y)\n```\n输出：\n```\n10 20\n```\n\n\
  Python 中打包和解包的益处如下：\n\n- 验证函数参数\n- 定义位置参数\n- 允许创建不同的适配\n- 维护函数调用\n- 帮助开发\n\n解包期间，左侧包含变量，右侧包含值。变量的数量应与右侧提供的数量匹配。否则将出错。\n\
  \n```python\n>>> (a1,a2,a3)=(20,”b”)\nTraceback (most recent call last):\nFile “<stdin>”,\
  \ line 1, in <module>\nValueError: not enough values to unpack (expected 3, got\
  \ 2)\n```\n\n### 6.3 方法\n\n通过不提供值创建一个空元组。可以使用 `,` 创建单值元组。如果提供的单个值没有 `,`，它会被视为字符串。\n\
  \n```python\n>>> t1=()\n>>> type(t1)\n<class ‘tuple’>\n>>> t1\n()\n```\n\n多个值也可以用\
  \ `,` 分隔。元组的索引从 0 开始。\n\n```python\n>>> t1=(‘a’,’b”)\n>>> type(t1)\n<class ‘tuple’>\n\
  >>> t1\n('a’, ‘b’)\n>>> t1[0]\n‘a’\n>>> t1[1]\n‘b’\n```\n\n`del` 关键字用于删除整个元组。一旦删除了元组对象，为其分配的内存也会释放。不允许从元组中移除单个元素。\n\
  \n```python\n>>> t1=(“ad”,”adfd”,”er”,23,5656)\n>>> t1\n('ad’, ‘adfd’, ‘er’, 23,\
  \ 5656)\n>>> del(t1[0])\nTraceback (most recent call last):\nFile “<stdin>”, line\
  \ 1, in <module>\nTypeError: ‘tuple’ object doesn’ support item deletion\n>>> del\
  \ t1\n>>> t1\nTraceback (most recent call last):\nFile “<stdin>”, line 1, in <module>\n\
  NameError: name ‘t1’ is not defined\n```\n\n元组的各种基本操作列如下：\n\n- `len()` 函数用于返回元组的长度。\n\
  ```python\na=(30,”a”,40.67)\nprint(“Type of a: “,type(a))\nprint(“Elements of a:\
  \ “,a)\nprint(“The length of a: “,len(a))\n```\n输出：\n```\nD:\\PythonPrograms>python\
  \ a1.py\nType of a: <class ‘tuple’>\nElements of a: (30, ‘a’, 40.67)\nThe length\
  \ of a: 3\n```\n\n- `count()` 函数用于计算输入元组中元素出现的频率。\n\n```python\na=(30,”a”,40.67,30,50,30)\n\
  print(“Elements of a: “,a)\nfor i in a:\n    print(“The count of “,i,” is= “,a.count(i))\n\
  ```\n输出：\n```\nD:\\PythonPrograms>python a1.py\nElements of a: (30, ‘a’, 40.67,\
  \ 30, 50, 30)\nThe count of 30 is= 3\nThe count of a is= 1\nThe count of 40.67 is=\
  \ 1\nThe count of 30 is= 3\nThe count of 50 is= 1\nThe count of 30 is= 3\n```\n\n\
  - `+` 运算符用于连接多个元组。\n```python\na=(30,”a”,40.67)\nprint(“Type of a: “,type(a))\n\
  ```\n\n\n\n\n\n```python\nprint(“Elements of a: “,a)\nprint(“The length of a: “,len(a))\n\
  b=(15,25.3+4j)\nprint(“Type of b: “,type(b))\nprint(“Elements of b: “,b)\nprint(“The\
  \ length of b: “,len(b))\nc=a+b\nprint(“Type of c: “,type(c))\nprint(“Elements of\
  \ c: “,c)\nprint(“The length of c: “,len(c))\n```\n**Output**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nType of a: <class ‘tuple’>\nElements of a: (30, ‘a’, 40.67)\nThe length\
  \ of a: 3\nType of b: <class ‘tuple’>\nElements of b: (15, (25.3+4j))\nThe length\
  \ of b: 2\nType of c: <class ‘tuple’>\nElements of c: (30, ‘a’, 40.67, 15, (25.3+4j))\n\
  The length of c: 5\n```\n\n- `zip()` 函数接收两个列表输入并将它们合并为一个 `Tuple`（元组）对象。\n\n```python\n\
  a=[30,40,50]\nb=[‘a’,’b’,’c’]\nc=set(zip(a,b))\nprint(“Elements of a: “,a)\nprint(“Elements\
  \ of b: “,b)\nprint(“Result of zip(): “,c)\n```\n**Output**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nElements of a: [30, 40, 50]\nElements of b: [‘a’, ‘b’, ‘c’]\nResult of\
  \ zip(): {(30, ‘a’), (50, ‘c’), (40, ‘b’)}\n```\n\n- `*` 运算符用于重复元组中的元素。\n\n```python\n\
  a=(30,”a”,40.67)\nprint(“Type of a: “,type(a))\nprint(“Elements of a: “,a)\nprint(“The\
  \ length of a: “,len(a))\nb=(15,25.3+4j)\nprint(“Type of b: “,type(b))\nprint(“Elements\
  \ of b: “,b)\nprint(“The length of b: “,len(b))\nc=(a*2)+(b*3)\nprint(“Type of c:\
  \ “,type(c))\nprint(“Elements of c: “,c)\nprint(“The length of c: “,len(c))\n```\n\
  **Output**\n```\nD:\\PythonPrograms>python a1.py\nType of a: <class ‘tuple’>\nElements\
  \ of a: (30, ‘a’, 40.67)\nThe length of a: 3\nType of b: <class ‘tuple’>\nElements\
  \ of b: (15, (25.3+4j))\nThe length of b: 2\nType of c: <class ‘tuple’>\nElements\
  \ of c: (30, ‘a’, 40.67, 30, ‘a’, 40.67, 15, (25.3+4j), 15, (25.3+4j), 15, (25.3+4j))\n\
  The length of c: 12\n```\n\n- 成员运算符和迭代运算符可以应用于元组。\n\n```python\na=(30,”a”,40.67)\n\
  #iteration operator\nfor z in a:\n    print(z)\n#membership operator\nif 40.67 in\
  \ a:\n    print(“40.67 is in Tuples”)\nif 100 in a:\n    print(“100 is in Tuples”)\n\
  else:\n    print(“100 is not in Tuples”)\n```\n**Output**\n```\nD:\\PythonPrograms>python\
  \ a1.py\n30\na\n40.67\n40.6 is in Tuples\n100 is not in Tuples\n```\n\n- 元组允许进行切片操作。切片运算符将选择元组的子元素。为此，我们需要提供起始索引、结束索引和索引增量值。起始索引的默认值为\
  \ 0；结束索引是元组的长度。索引增量值的默认值为 1。\n\n```python\n>>> a=(45,65,95)\n>>> b=a[]\nFile “<stdin>”,\
  \ line 1\nb=a[]\n^\nSyntaxError: invalid syntax\n>>> b=a[:]\n>>> b\n(45, 65, 95)\n\
  ```\n如果不使用切片运算符，它将把 `a` 视为数组并产生错误。为了解决这个问题，使用了切片运算符 `:`。在上面的示例中，切片运算符没有提供任何值。因此，它将元组\
  \ `a` 中的所有值复制到 `b`。索引值始终从 0 开始。\n\n```python\n>>> a=(45,65,95)\n>>> a\n(45, 65,\
  \ 95)\n>>> c=a[1:]\n>>> c\n(65, 95)\n```\n在这个示例中，切片运算符的起始索引为 1。因此，从索引 1 开始的元素将被复制到元组\
  \ `c` 中。\n\n```python\n>>> a=(45,”mhj”,”nfhg”,76.34,89.45,6+jh)\n>>> b=a[:5]\n>>>\
  \ b\n(45, ‘mhj’, ‘nfhg’,76.34,89.45)\n```\n在这个示例中，切片运算符的结束索引为 5。因此，从索引 0 到 5 的元素将复制到\
  \ `c` 中。\n\n```python\n>>> c=a[2:5]\n>>> c\n(‘nfhg’,76.34,89.45)\n```\n在这个示例中，从索引\
  \ 2 到 5 的索引用于选择 `a` 中的元素。\n\n```python\n>>> c=a[2:6]\n```\n...索引增加了 1。\n\n- `==`\
  \ 运算符用于比较给定的元组。\n\n```python\n>>> a=(3,4,5)\n>>> b=(4,5,6)\n>>> a==b\nFalse\n>>>\
  \ b=(3,4,5)\n>>> a==b\nTrue\n```\n\n- `max()` 函数返回元组的最大值，`min()` 返回元组的最小值。\n\n```python\n\
  >>> a=(3,4,5)\n>>> max(a)\n5\n>>> min(a)\n3\n```\n\n- 元组的元素不能更改。但对象可以更改。\n\n```python\n\
  >>> a=(10,20,30,(40,50))\n>>> a\n(10, 20,3, 30)\n>>> a[0]=100\nTraceback (most recent\
  \ call last):\nFile “<stdin>”, line 1\nTypeError: ‘tuple’ object does not support\
