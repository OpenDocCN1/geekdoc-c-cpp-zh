  \ → python Hello.py\n![image](img/9789386235633_12.png)\n\n## 2.6 Python 虚拟机\n\n\
  Python 虚拟机 (`PVM`）用于在开发应用程序时提供平台无关性。`PVM` 是 Python 解释器的一部分，有助于理解源 Python 程序的预编译或字节码。编译后的字节码存储在\
  \ `.pyc` 文件中。该文件包含一个魔数标记（magic tag）和一个修改时间戳标记。每个标记的长度为 4 字节。`.pyc` 文件简单且可以传输。它的加载能力高且提供了更高的安全性。这些文件在不同的\
  \ Python 版本之间是不兼容的。\n\n## 2.7 冻结二进制文件\n\n对于任何 Python 程序，都可以使用各种组件创建冻结二进制文件，例如源程序的字节码、解释器或\
  \ `PVM` 以及相应的支持文件。所有这些文件都被封装成一个可执行的单一二进制文件。`py2exe`、`PyInstaller` 和 `freeze` 用于创建冻结二进制。\n\
  \n## 2.8 Python 中的内存管理\n\n在 Python 中，内存被视为私有堆。所有的 Python 对象都仅通过私有堆创建。Python 内存管理器负责为对象分配和释放内存。原始内存分配器（raw\
  \ memory allocator）直接与操作系统交互并可以管理所有 Python 数据。特定对象分配器用于管理特定的对象数据。\n\n- `PyMem_RawMalloc()`、`PyMem_RawCalloc()`、`PyMem_RawRealloc()`\
  \ 和 `PyMem_RawFree()` 函数由原始内存分配器使用。\n- `PyMem_GetAllocator()`、`PyMem_SetAllocator()`\
  \ 和 `PyMem_SetupDebugHooks()` 函数由特定对象分配器使用。\n\n## 2.9 C 和 Python 的比较\n\n- 用 C 开发代码很复杂；而在\
  \ Python 中非常简单。\n- 在 C 中，缩进不是强制的；而在 Python 中，缩进是强制的。\n- 在 C 中，每个变量都需要声明；而在 Python\
  \ 中，变量不需要声明。\n- C 支持内联赋值；而在 Python 中不支持。\n- 在 C 中，可以使用指针；而在 Python 中不使用指针。\n- 在\
  \ C 中不使用垃圾回收器；而在 Python 中使用了垃圾回收器。\n- 在 C 中，没有自动内存管理工具；而在 Python 中有自动内存管理工具。\n-\
  \ 在 C 中，使用分号结束语句；而在 Python 中，语句以换行符结束。\n\n## 2.10 Java 和 Python 的比较\n\n- 用 Java\
  \ 开发代码很复杂；而在 Python 中非常简单。\n- 在 Java 中，缩进不是强制的；而在 Python 中，缩进是强制的。\n- 在 Java 中，每个变量都需要声明；而在\
  \ Python 中，变量不需要声明。\n- 在 Java 中，类可以有多个构造函数；而在 Python 中，一个类只允许一个构造函数。\n- 在 Java 中，字符串处理较弱；而在\
  \ Python 中字符串处理很强。\n- Java 使用静态类型；而 Python 使用动态类型。\n- Java 的执行速度高于 Python。\n\n##\
  \ 2.11 Python 与类似工具\n\n下面列出了其他各种 Python 的类似工具：\n- SAS\n- R 语言\n- MATLAB\n\nSAS 包含了许多用于统计操作的函数。但\
  \ SAS 不是开源的。为了克服这个问题，引入了 R 语言。它是可以分给任何人的开源软件。Python 提供了各种用于统计操作和其他操作的函数。MATLAB 也是流行且广泛使用的软件，但它不是源码。\n\
  \n## 2.12 Python 关键字\n\nPython 中的各种关键字列于表 2.1。\n\n表 2.1 Python 中的关键字\n\n| FALSE\
