  \ defined`\n\n| 章节 | | Tkinter |\n| :--- | :--- | :--- |\n| 16 | | |\n\nPython 通过\
  \ wxPython、JPython 和 Tkinter 支持图形用户界面 (GUI)。在这些之中，本章讨论了基于 Tkinter 的 GUI。`tkinter`\
  \ 模块包含了用于支持控件的各种类。\n\n## 16.1 简介\n\n本书书的前几章节讨论了 Python 中的命令行界面参数。然而，Python 编程同时支持命令行界面和图形用户界面\
  \ (GUI)。Python 通过三种方式支持 GUI，即 `wxPython`、`JPython` 和 `Tkinter`。\n\n- `wxPython`\
  \ 是一个用于支持 Python GUI 的平台无关工具包。使用该工具包实现 GUI 非常简单，但由于 `wxPython` 更新频繁，因此新功能请求需要频繁的补丁更新。\n\
  - `JPython` 支持与 Java 平台集成的 GUI。它主要用于嵌入式脚本编写、交互式解释器和快速应用开发。\n- `Tkinter` 也称为 Tk 接口。它是\
  \ Python 中 GUI 的标准工具包。它将 Tk 控件绑定到 Python 对象。要使用它需要一个运行的 Tcl/Tk 系统。Tkinter 的优点是比其他\
  \ GUI 工具包更具移植性。\n\n在 Python 3 中，`tkinter` 模块负责处理 GUI 的各种操作。它为在 Python 中创建 GUI 提供了简单的方法。在使用此工具包时，应包含\
  \ `from tkinter import *` 语句。这样，`tkinter` 模块的所有属性在当前程序中都可用。导入后，创建一个 GUI 应用程序的主窗口。对于这一点，使用\
  \ `Tk()` 方法。然后为主窗口添加所需的控件。最后，调用 `mainloop()` 方法执行事件。\n\n```python\nfrom tkinter\
  \ import *\n\na = Tk()\n\na.title(‘First Tkinter program’)\na.mainloop()\n```\n\n\
  **输出：**\n```\nD:\\PythonPrograms>python a1.py\n```\n![image](img/9789386235633_35.png)\n\
  \n## 16.2 控件\n\nTkinter 控件代表 GUI 的对象。对于每个组件，都维护一个对象。各种控件如下\n- 按钮\n- 画布\n- 组合框\n\
  - 输入框\n- 框架\n- 标签\n- 列表框\n- 菜单\n- 进度条\n- 单选按钮\n- 滚动条\n- 文本框\n- 树视图\n\n放置控件的方法：\n\
  - `pack()`\n- `grid()`\n- `place()`\n\n## 16.3 标签\n\n标签控件用于向 GUI 窗口添加文本。对于这一点，使用了标签类。\n\
  \n```python\nfrom tkinter import *\n\na = Tk()\n\nl = Label(a, text=\"This is a\
  \ label\")\nl.pack()\n\na.mainloop()\n```\n\n除了文本，标签控件也用于添加图像。对于这一点，，应该使用 `PhotoImage`\
  \ 方法。\n\n```python\nfrom tkinter import *\n\na = Tk()\ni=PhotoImage(file=”index.gif”)\n\
  l2=Label(a,image=i)\n\na.mainloop()\n```\n![image](img/9789386235633_36.png)\n\n\
  ## 16.4 按钮\n\n按钮控件用于在 GUI 窗口中添加按钮。对于这一点，使用了按钮类。\n\n```python\nfrom tkinter import\
  \ *\n\ndef abc():\n    print(“button clicked”)\n\na = Tk()\nb1=Button(a, text=\"\
  OK\", command=abc)\n\na.mainloop()\n```\n\n在按钮的情况下，可以使用 `lambda` 表达式向命令传递参数。\n\n\
  ```python\nfrom tkinter import *\n\ndef abc(number):\n    print(number, “button\
  \ clicked”)\n\na = Tk()\nb1=Button(a, text=\"OK\", width=30, command=lambda:abc(1))\n\
  b2=Button(a, text=\"RESET\", width=30, command=lambda:abc(2))\n\na.mainloop()\n\
  ```\n\n在上面的示例代码中，按钮的命令是一个函数。除了函数，还可以方法来表示命令。这些方法被称为“绑定方法”。它们应该定义在类内部。在使用绑定方法时，应该重写\
  \ `__init__` 方法。\n\n```python\nfrom tkinter import *\n\nclass xyz:\n    def abc(self,\
  \ number):\n        print(number, “button clicked”)\n\na = Tk()\nobj = xyz()\nb1=Button(a,\
  \ text=\"OK\", width=30, command=lambda:obj.abc(1))\nb2=Button(a, text=\"RESET\"\
  , width=30, command=lambda:obj.abc(2))\n\na.mainloop()\n```\n![image](img/9789386235633_40.png)\n\
  \n## 16.5 复选框\n\n`Checkbutton` 控件用于在 GUI 窗口中添加复选框。它允许对选项进行多次选择。\n\n```python\nfrom\
