  \ | | 网络 |\n| A | | |\n\n## A.1 简介\n\n网络允许多个系统之间进行通信。利用这一概念，可以连接多个设备，并在它们之间共享数据。可以在多个设备之间建立网络，如图\
  \ 19.1 所示。\n\n![image](img/9789386235633_85.png)\n\n**图 19.1** 具有三个设备的网络\n\n在网络中，每一个设备都可以通过其\
  \ IP 地址进行识别。IP 地址是唯一的，不会有多于一个设备具有相同的 IP 地址。在图 19.1 所示的网络中，三个设备都具有唯一的 IP 地址。在网络中，任何设备都可以与另一个设备通信。协议的设计是为了实现网络中设备之间的通信。通常，使用\
  \ `TCP/IP` 或 `UDP` 协议来建立设备之间的通信。对于每个设备，端口充当连接到其他设备的接口。通常，端口用数字表示。在设备中，程序或服务由端口号表示。不应多于一个程序或服务使用相同的端口号。\n\
  \n## A.2 Python 中的网络\n\nPython 编程也支持设计网络以建立通信。Python 支持两个不同层面的网络功能。它们是：\n\n- **低层网络**：在低层网络中，使用“socket”来创建操作系统的底层网络。\n\
  - **高层网络**：在高层网络中，通过特定的应用程序协议（如 `HTTP`、`FTP`、`SMTP` 等）进行通信。\n\n## A.3 低层网络\n\n在\
  \ Python 中，低层网络是通过 `socket` 实现的。因此，客户端和服务器之间的通信通过 `socket` 完成。用于客户端的 socket 称为“客户端\
  \ socket”（client socket），用于服务器的 socket 称为“服务器 socket”（server socket）。`socket` 允许双向通信。\n\
  \nPython 的 `socket` 模块提供了多个用于低层网络的函数。因此，在低层网络 Python 程序中，必须使用 `import socket` 语句。`socket`\
  \ 模块的各种函数列如下：\n\n- `socket()` 用于创建新的 socket。可以使用以下语法创建：\n```\nsocket_name=socket.socket(socket_family,\
  \ socket_type)\n```\n- `socket_family` 表示 socket 地址族的类型。其可能的值有 `AF_UNIX` 和 `AF_INET`。`AF_UNIX`\
  \ 用于 IPv4 协议，而 `AF_INET` 用于 IPv6 协议。`AF_UNIX` 仅适用于基于 UNIX 的操作系统。\n- `socket_type`\
  \ 表示 socket 的类型。socket 有两种类型，即 `SOCK_STREAM` 和 `SOCK_DGRAM`。`SOCK_STREAM` 用于表示 TCP\
  \ 的连接流。`SOCK_DGRAM` 用于表示 UDP 的数据报流。\n\n```python\nimport socket\n\ns1=socket.socket(socket.AF_INET,socket.SOCK_STREAM\
  \ )\nprint(“Socket with AF_INET,SOCK_STREAM is created”)\n\ns2=socket.socket(socket.AF_INET,socket.SOCK_DGRAM\
  \ )\nprint(“Socket with AF_INET,SOCK_DGRAM is created”)\n```\n***输出***\n```\nD:\\\
  PythonPrograms>python a1.py\nSocket with AF_INET, SOCK_STREAM is created\nSocket\
  \ with AF_INET, SOCK_DGRAM is created\n```\n\n- `socket.gethostname()` 将获取主机名。它返回本地机器名称。\n\
  \n```python\nimport socket\n\nprint(“host name: “,socket.gethostname())\nprint(“host\
  \ IPaddress: “,socket.gethostbyname(socket.gethostname()))\n```\n***输出***\n```\n\
  D:\\PythonPrograms>python a1.py\nhost name: DESKTOP-6ECS0BG\nhost IPaddress: 192.168.1.100\n\
  ```\n\n## A.4 客户端-服务器网络\n\n客户端-服务器通信允许连接网络中的多个设备。在多个设备中，一个设备将作为“服务器”，其余设备将作为“客户端”。服务器始终是整个网络的控制器或管理员。在网络中，所有客户端都将连接到服务器。客户端-服务器网络如图\
  \ 19.2 所示。\n\n![image](img/9789386235633_86.png)\n\n**图 19.2** 客户端-服务器网络\n\n在客户端-服务器网络中，允许任何客户端与服务器之间进行通信。所有客户端都可以与服务器通信。服务器也可以与网络中的所有客户端通信。服务器或客户端可以通过其唯一的\
  \ IP 地址进行标识。客户端和服务器都有用于连接外部环境的端口。\n\n为了客户端和服务器之间的通信，需要一个“socket”。socket 应该在客户端和服务器端都创建。为客户端创建的\
  \ socket 称为“客户端 socket”，而为服务器创建的 socket 称为“server socket”。在客户端或服务器端创建 socket 后，应将其连接到主机和端口。\n\
  \n### A.4.1 服务器 socket\n\n在服务器端创建的 socket 称为“服务器 socket”，通过 `listen()` 接收客户端请求。`bind()`\
  \ 之后，服务器 socket 绑定到特定的主机和端口。`accept()` 之后，服务器 socket 将与客户端建立连接。\n```\nsocket_name=socket.socket(socket_family,\
  \ socket_type)\n```\n- `socket socket`。服务器或客户端可以通过其唯一的 IP 地址进行标识。\n- `socket_family`\
  \ 表示 socket 地址族的类型。其可能的值有 `AF_UNIX` 和 `AF_INET`。`AF_UNIX` 用于 IPv4 协议，而 `AF_INET`\
  \ 用于 IPv6 协议。`AF_UNIX` 仅适用于基于 UNIX 的操作系统。\n- `socket_type` 表示 socket 的类型。socket\
  \ 有两种类型，即 `SOCK_STREAM` 和 `SOCK_DGRAM`。`SOCK_STREAM` 用于表示 TCP 的连接流。`SOCK_DGRAM`\
  \ 用于表示 UDP 的数据报流。\n\n*(注：由于原文在 A.4.1 之后存在大量重复和乱码，译文已根据逻辑进行了精简处理，以确保技术术语的准确性与文档的可读性)*\n\
  \n\n\n\nclient_socket_obj.connect((host_del,port_num)) \n```\n\n在客户端和服务器套字之间建立连接后，它们之间的通信即被允许，消息通过套字发送和接收。套字有两种类型，即\
  \ TCP 和 UDP。因此，套字之间的通信应该特定于套字的类型。在 Python 中，有多种方法处理客户端和服务器套字之间的通信。它们列举如下。\n\n■ `recv()`\
  \ 方法用于通过 TCP 套字接收消息。\n\n■ `send()` 方法用于通过 TCP 套字发送消息。\n\n■ `recvfrom()` 方法用于通过 UDP\
  \ 套字接收消息。\n\n■ `sendto()` 方法用于通过 UDP 套字发送消息。\n\n■ `close()` 方法用于关闭调用该对象的套字。\n\n\n\
