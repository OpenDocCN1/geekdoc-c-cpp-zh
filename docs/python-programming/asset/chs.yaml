  \n## 术表\n- 测试过程评估开发出的产品是否满足所有给定的需求。\n- 手动测试允许用户手动执行测试过程。\n- 单元测试允许 Python 执行测试过程。\n\
  \n## 总结\n- 测试是验证所开发的软件产品的一个重要步骤。\n- 测试程序可以是手动的，也可以是基于计算机的。\n- 基于计算机的测试程序被称为单元测试。\n\
  - Python 编程支持单元测试功能。\n- Python 中的 `unittest` 模块支持单元测试。\n- 可以为单元测试过程创建新的测试用例并对其进行评估。\n\
  - 测试用例的结果可以是 OK、FAILED（失败）或 ERROR（错误）。\n\n## 多选题\n**1. 以下哪一个模块提供了 Python 测试功能？**\n\
