  \ __main__\nEnter the first number: 200\nEnter the second number: 4\nThe result\
  \ of div(): 50.0\n```\n\n### 程序 3：编写一个 Python 程序，使用模块打印数字阶阶。\n\n#### `fact.py`\n\
