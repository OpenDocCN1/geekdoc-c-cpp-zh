  7. `SyntaxError: invalid syntax`\n\n## 创建字典\n\nPython 支持用于结构的内置数据类型。有三种创建字典的方法，所示：\n\
  \n### i. 使用字面量字典 `{` 和 `}`\n\n有两种字面量用于字典。即 `{` 和 `}`。使用这些，可以创建一个新字典。\n\n```python\n\
  >>> d1={}\n>>> type(d1)\n<class ‘dict’>\n>>> d1\n{}\n```\n在上面的示例中，在没有任何键值对的情况下创建了字典\
  \ `d1`。它是空字典。我们也可以提供键值对。\n\n```python\n>>> d1={10:20}\n>>> d1\n{10: 20}\n>>> d1[10]\n\
  20\n```\n在上面的示例中，使用单个键值对创建了字典 `d1`。键和值通过 `:` 运算符分隔。`:` 的左侧视为键，右侧视为值。创建字典后，通过指定相应的键访问值。这应该使用\
  \ `[]`。\n\n如果只指定值而没有赋值键，它将被视为集合类型。\n\n```python\n>>> d2={10}\n>>> d2\n{10}\n>>>\
  \ type(d2)\n<class ‘set’>\n```\n字典是可变对象；因此我们可以向现有字典添加多个键值对。\n\n```python\n>>> a={}\n\
  >>> a\n{}\n>>> a[\"one\"]=1\n>>> a[2]=10\n>>> a[3.5]=30\n>>> a\n{'one': 1, 2: 10,\
  \ 3.5: 30}\n>>> a['one']\n1\n>>> a[2]\n10\n>>> a[3.5]\n30\n```\n在字典内部，可以使用 `,` 指定多个键值对。\n\
  \n```python\n>>> b={1:100,2:200,3:300}\n>>> b\n{1: 100, 2: 200, 3: 300}\n>>> b[1]\n\
  100\n>>> b[2]\n200\n>>> b[3]\n300\n>>> b[4]\nTraceback (most recent call last):\n\
  \  File \"<stdin>\", line 1, in <module>\nKeyError: 4\n```\n在上面的示例代码中，字典包含键 `{1,2,3}`。使用错误的键\
  \ `\"4\"` 访问字典将产生错误。\n\n### ii. 使用元组列表\n\n字典也可以如下所示从多个元组列表构建。它使用了 `dict` 关键字。\n\n\
  ```python\n>>> d=dict([(\"x\",50)])\n>>> type(d)\n<class ‘dict’>\n>>> d\n{'x': 50}\n\
  >>> d[\"x\"]\n50\n```\n这种类型的字典创建适用于动态元素列表。\n\n### iii. 使用并行列表\n\n这与之前的字典创建方法相似，区别在于，这里可以使用多个元组列表来创建字典。\n\
  \n```python\n>>> a=(\"x\",50)\n>>> b=(\"y\",60)\n>>> c=[a,b]\n>>> a\n('x', 50)\n\
  >>> b\n('y', 60)\n>>> c\n[('x', 50), ('y', 60)]\n>>> d=dict(c)\n>>> d\n{'x': 50,\
  \ 'y': 60}\n```\n\n## 7.2 基本操作\n\n■ 字典值可以通过为现有字典中的现有键提供新值来更新。\n\n```python\n>>>\
  \ x={1:\"a\",2:\"b\"}\n>>> x\n{1: 'a', 2: 'b'}\n>>> type(x)\n<class ‘dict’>\n>>>\
  \ x[1]=”c”\n>>> x\n{1: 'c', 2: 'b'}\n```\n\n\n\n\n\n- 在字典中，不允许出现重复的键。如果出现重复键，字典将只保留最后一个值。\n\
  \n```python\n>>> q={1:100,1:200}\n>>> q\n{1: 200}\n```\n\n- 在字典中，键可以是任何基础内置数据类型。除此外，`tuple`\
  \ 对象也可以被视为键。但不允许使用 `list` 对象作为键。\n\n```python\n>>> q1={‘key’):100}\n>>> q1\n{‘key’:\
  \ 100}\n>>> q1={[‘key’]:100}\nTraceback (most recent call last):\nFile “<stdin>”,\
  \ line 1, in <module>\nTypeError: unhashable type: ‘list’\n```\n\n- `==` 运算符用于比较给定的两个字典。如果它们都相同，则返回\
  \ TRUE；否则返回 FALSE。\n\n```python\n>>> d={1.0:”abc”,2.0:”def”}\n>>> d1={1:”abc”,2:”def”}\n\
  >>> d2={“a”:100,”b”:500.30}\n>>> d1\n{1: ‘abc’, 2: ‘def’}\n>>> d2\n{‘a’: 100, ‘b’:\
  \ 500.3}\n>>> d\n{1.0: ‘abc’, 2.0: ‘def’}\n>>> d1==d\nTrue\n>>> d1==d2\nFalse\n\
  >>> d2==d\nFalse\n```\n\n- `str()` 函数将将输入的字典转换为字符串。\n\n```python\n>>> d={1:”hai”}\n\
  >>> d\n{1: ‘hai’}\n>>> str(d)\n“{1: ‘hai’}”\n```\n\n- `len()` 函数将返回字典的长度。\n\n```python\n\
  >>> d1\n{1: ‘abc’, 2: ‘def’}\n>>> len(d1)\n2\n```\n\n- `del()` 函数用于从字典中删除元素。在字典内部，要删除某个值，应提供对应的键。\n\
  \n```python\n>>> d1\n{1: ‘abc’, 2: ‘def’}\n>>> del(d1[1])\n>>> d1\n{2: ‘def’}\n\
  ```\n\n- `del()` 也用于删除整个字典对象。\n\n```python\n>>> d1\n{2: ‘def’}\n>>> del(d1)\n>>>\
  \ d1\nTraceback (most recent call last):\nFile “<stdin>”, line 1, in <module>\n\
  NameError: name ‘d1’ is not defined\n```\n\n## 7.3 字典操作\n\n字典包含键和值。可以通过 `dict` 类的各种内置方法确定字典的详情。它们列如下。\n\
  \n- 使用 `keys()` 方法列出字典中可用的键列表。\n\n```python\n>>> d1={1:”a”,2:”b”,3:”c”,4:”d”}\n\
  >>> d1\n{1: ‘a’, 2: ‘b’, 3: ‘c’, 4: ‘d’}\n>>> d1.keys()\ndict_keys([1, 2, 3, 4])\n\
  ```\n\n- 使用 `values()` 方法列出字典中可用的值列表。\n\n```python\n>>> d1={1:”a”,2:”b”,3:”c”,4:”d”}\n\
  >>> d1\n{1: ‘a’, 2: ‘b’, 3: ‘c’, 4: ‘d’}\n>>> d1.values()\ndict_values([‘a’, ‘b’,\
  \ ‘c’, ‘d’])\n```\n\n- 使用 `clear()` 方法可以清空字典中的元素。这将输入的字典创建一个空字典。\n\n```python\n\
  >>> d1={1:”a”,2:”b”,3:”c”,4:”d”}\n>>> d1\n{1: ‘a’, 2: ‘b’, 3: ‘c’, 4: ‘d’}\n>>>\
  \ d1.clear()\n>>> d1\n{}\n```\n\n- 字典可以通过两种方式复制，即浅拷贝或深拷贝。在深拷贝中，复制的对象将与原始对象共享相同的内存位置。因此，在一个对象上进行的更改将反映在另一个对象上。在浅拷贝中，将为复制的对象分配内存。因此，在一个对象上进行的更改将不会反映在另一个对象上。`copy()`\
  \ 方法将将一个字典对象浅拷贝到另一个对象。\n\n```python\n>>> d1={1:100.50, 2:”abc”, 3:”5+9j”}\n>>> d1\n\
  {1: 100.5, 2: ‘abc’, 3: ‘5+9j’}\n>>> type(d1)\n<class ‘dict’>\n>>> d2=d1.copy()\n\
  >>> d2\n{1: 100.5, 2: ‘abc’, 3: ‘5+9j’}\n>>> type(d2)\n<class ‘dict’>\n>>> d1[1]=986\n\
  >>> d1\n{1: 986, 2: ‘abc’, 3: ‘5+9j’}\n>>> d2\n{1: 100.5, 2: ‘abc’, 3: ‘5+9j’}\n\
  ```\n\n- `fromkeys()` 方法用于创建一个字典，通过提供键来初始化字典。对于新字典，用户可以指定值。如果不提供值，则会自动初始化为值。\n\n\
  ```python\n>>> d1={1:”a”,2:”b”,3:”c”,4:”d”}\n>>> d1\n{1: ‘a’, 2: ‘b’, 3: ‘c’, 4:\
  \ ‘d’}\n>>> d1.keys()\ndict_keys([1, 2, 3, 4])\n```\n\n- `setdefault()` 方法用于设置字典中的键的默认值。如果字典中不存在该键，则设置该键及其值。如果键已存在，则返回其值。\n\
  \n```python\n>>> d1={1:”a”,2:”b”,3:”c”,4:”d”}\n>>> d1\n{1: ‘a’, 2: ‘b’, 3: ‘c’,\
  \ 4: ‘d’}\n>>> d1.keys()\ndict_keys([1, 2, 3, 4])\n```\n\n- `get()` 方法用于查找字典中的键并返回对应的值。如果键不存在，则返回\
  \ None。如果提供了第二个参数，则返回该默认值。\n\n```python\n>>> d1={1:”a”,2:”b”,3:”c”,4:”d”}\n>>> d1\n\
  {1: ‘a’, 2: ‘b’, 3: ‘c’, 4: ‘d’}\n>>> d1.keys()\ndict_keys([1, 2, 3, 4])\n```\n\n\
  - `items()` 方法列出字典中的键-值对。\n\n```python\n>>> d1={1:”a”,2:”b”,3:”c”,4:”d”}\n>>> d1\n\
  {1: ‘a’, 2: ‘b’, 3: ‘c’, 4: ‘d’}\n>>> d1.keys()\ndict_keys([1, 2, 3, 4])\n```\n\n\
  - `update()` 方法用于通过添加另一个字典来更新字典对象。\n\n```python\n>>> d1={1:”a”,2:”b”,3:”c”,4:”d”}\n\
  >>> d1\n{1: ‘a’, 2: ‘b’, 3: ‘c’, 4: ‘d’}\n>>> d1.keys()\ndict_keys([1, 2, 3, 4])\n\
  ```\n\n- `pop()` 方法从字典对象中返回元素。该方法接受两个参数：\n  i. 第一个参数指定要搜索的键。\n  ii. 第二个参数指定在未找到键时返回的默认值。\n\
  \n```python\n>>> d1={1:10,2:”a”,3:55.43,4:”c”,5:”d”}\n>>> d1\n{1: 10, 2: ‘a’, 3:\
  \ 55.43, 4: ‘c’, 5: ‘d’}\n>>> d1.pop(2)\n‘a’\n>>> d1\n{1: 10, 3: 55.43, 4: ‘c’,\
  \ 5: ‘d’}\n>>> d1.pop(10)\nTraceback (most recent call last):\nFile “<stdin>”, line\
  \ 1, in <module>\nKeyError: 10\n>>> d1.pop(10,”no key found”)\n‘no key found’\n\
  ```\n\n- `popitem()` 方法从字典对象中移除顶项。`popitem()` 方法不接受参数。\n\n```python\n>>> d1={1:100.50,\
  \ 2:”abc”, 3:”5+9j”}\n>>> d1\n{1: 100.5, 2: ‘abc’, 3: ‘5+9j’}\n>>> popresult = d1.popitem()\n\
  >>> d1\n{1: 100.5, 2: ‘abc’}\n```\n\n- 字典推导式是一种使用表达式创建新字典的技术。该表达式由一对键值对组成。在大括号内，表达式后跟\
  \ for 循环将用于迭代表达式。\n\n```python\n>>> stack = {y: y*2 for y in range(10)}\n```\n\n\
  \n\n\n\n集合是一个无序元素列表。它是一个可变对象。因此，允许集合元素发生变化。\n\n```\n>>> s=set(“hai”)\n>>> s\n{‘h’,\
  \ ‘a’, ‘i’}\n>>> type(s)\n<class ‘set’>\n```\n\n- 可以使用 `set()` 创建一个空集合。\n\n```python\n\
  >>> s1=set()\n>>> type(s1)\n<class ‘set’>\n```\n\n- 可以使用 `()` 在集合中提供多个元素。在 `()`\
  \ 内部，每个值可以使用 `,` 分隔。\n\n```python\n>>> se2=set((1,2,3,))\n>>> se2\n{1, 2, 3}\n>>>\
  \ type(se2)\n<class ‘set’>\n```\n\n- 可以使用 `add()` 方法向集合添加新元素。\n\n```python\n>>>\
  \ se1.add(50)\n>>> se1\n{1, 2, 3, 50}\n>>> se1.add((100,200))\n>>> se1\n{1, 2, 3,\
  \ (100, 200), 50}\n```\n\n- 集合中不允许重复值。\n\n```\n>>> s1=set((10,20,10))\n>>> s1\n\
  {10, 20}\n```\n\n- 在集合中，不能通过索引访问元素。\n- 向集合添加可迭代元素会导致错误。为了解决这个问题，可以使用 `update()`\
  \ 方法。\n\n```python\n>>> s1\n{10, 20}\n>>> s1.add([40,50])\nTraceback (most recent\
  \ call last):\nFile “<stdin>”, line 1, in <module>\nTypeError: unhashable type:\
  \ ‘list’\n>>> s1.update([40,50])\n>>> s1\n{40, 10, 20, 50}\n```\n\n- `discard()`\
  \ 和 `remove()` 方法用于从集合中删除元素。如果指定的元素未找到，则 `remove()` 将产生错误。\n\n```\n>>> s1\n{40,\
  \ 10, 20, 50}\n>>> s1.remove(10)\n>>> s1\n{40, 20, 50}\n>>> s1.discard(20)\n>>>\
  \ s1\n{40, 50}\n>>> s1.remove(100)\nTraceback (most recent call last):\nFile “<stdin>”,\
  \ line 1, in <module>\nKeyError: 100\n>>> s1.discard(100)\n>>> s1\n{40, 50}\n```\n\
  \n- `clear()` 方法用于清除集合中的所有元素，使当前集合变为空集合。\n\n```python\n>>> se1\n{1, 2, 3, 50}\n\
  >>> se1.clear()\n>>> se1\nset()\n```\n\n- `pop()` 方法将从当前集合中弹出元素。\n\n```\n>>> s1\n\
  {‘a’, 40, 10, 20, ‘b’, 30}\n>>> s1.pop()\n‘a’\n```\n\n- `|` 运算符用于执行集合并集操作。\n\n```\n\
  >>> s1\n{40, 10, 20, ‘b’, 30}\n>>> s2\n{10, 300, 400, 20, 500}\n>>> s3=s1|s2\n>>>\
  \ s3\n{40, 10, 300, 400, 20, 500, ‘b’, 30}\n```\n\n- `intersection()` 方法用于查找集合交集结果（注：原文为\
  \ `intersection()()` 为笔误）。\n\n```\n>>> s4=s1.intersection(s2)\n>>> s4\n{10, 20}\n\
  ```\n\n- `-` 用于执行集合差集操作。\n\n```\n>>> s5=s1-s2\n>>> s5\n{40, ‘b’, 30}\n```\n\n- `len()`\
  \ 函数返回集合的长度。\n- `all()` 函数在集合所有元素都为真时返回 TRUE；否则返回 FALSE。\n- `any()` 函数在集合中任一元素为真时返回\
  \ TRUE；否则返回 FALSE。\n\n```python\n>>> s1\n{40, 10, 20, ‘b’, 30}\n>>> len(s1)\n5\n\
  >>> all(s1)\nTrue\n>>> any(s1)\nTrue\n```\n\n- `max()` 和 `min()` 函数返回输入集合中的最大值和最小值。\n\
  \n```\n>>> s1=set([10, 20, 30, 40])\n>>> s1\n{40, 10, 20, 30}\n>>> max(s1)\n40\n\
  >>> min(s1)\n10\n```\n\n## 7.5 迭代器与生成器\n\n在 Python 编程中，迭代器用于表示对象。通过迭代器，可以使用 `next()`\
  \ 方法访问元素序列。`iter()` 接收可迭代对象并返回迭代器。如果没有后续元素，它将抛出 `StopIteration` 异常。\n\n```python\n\
  st1=”hello”\ni=iter(st1)\nprint(next(i))\nprint(next(i))\nprint(next(i))\nprint(next(i))\n\
  print(next(i))\n```\n**输出**\n```\nD:\\PythonPrograms>python s1.py\nh\ne\nl\no\n\
  Traceback (most recent call last):\nFile “s1.py”, line 8, in <module>\nprint(next(i))\n\
  StopIteration\n```\n\n生成器是一种控制循环迭代的迭代器。在循环迭代期间，`yield` 语句和生成器对象返回值序列。\n\n```python\n\
  def fun():\n    a,b,c=1,2,3\n    yield a\n    yield b\n    yield c\n\ngen1 = fun()\n\
  print(next(gen1))\nprint(next(gen1))\nprint(next(gen1))\n```\n**输出**\n```\n1\n2\n\
  3\n```\n\n## 7.6 示例程序\n\n### 示例 1：编写一个 Python 程序，从控制台读取字典元素并显示。\n编程提示：字典是映射对象。\n\
