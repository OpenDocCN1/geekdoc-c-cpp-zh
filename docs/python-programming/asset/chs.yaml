  \ 函数可以获取本地对象信息。\n\n```python\nimport threading\n\nx=threading.local()\n\nprint(“Local\
  \ Thread Object: “,x)\n```\n\n***Output***\n```\nD:\\PythonPrograms>python a1.py\n\
  \nLocal Thread Object: <_thread._local object at 0x03887AB0>\n```\n\n- 在 Python\
  \ 的早期版本中，有两个模块 `thread` 和 `threading` 可用。但在 Python3 中，可以使用 `_thread` 和 `threading`\
  \ 模块。所有的线程功能都可以在 `threading` 模块中使用。\n\n```python\n>>> import thread\nTraceback (most\
  \ recent call last):\nFile “<stdin>”, line 1, in <module>\nModuleNotFoundError:\
  \ No module named ‘thread’\n\n>>> import _thread\n>>>\n```\n\n- 在 Python 编程中，可以通过两种方式创建新线程。它们是：\n\
  \    - 使用 `_thread` 模块\n    - 使用 `threading` 模块\n\n- 在 `_thread` 模块的情况下，可以通过在函数中定义线程的行为来创建新线程。语法如下：\n\
  \n`_thread.start_new_thread(function_name_obj,(arg1,arg2...))`\n\n```python\nimport\
  \ _thread\n\ndef abc(arg1):\n    print(“Thread Name: “,arg1)\n\n_thread.start_new_thread(abc,(“Thread1”,))\n\
  _thread.start_new_thread(abc,(“Thread2”,))\n_thread.start_new_thread(abc,(“Thread3”,))\n\
  _thread.start_new_thread(abc,(“Thread4”,))\n_thread.start_new_thread(abc,(“Thread5”,))\n\
  _thread.start_new_thread(abc,(“Thread6”,))\n\nwhile True:\n    pass\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python a1.py\n\nThread Name: Thread1\nThread Name: Thread6\n\
  Thread Name: Thread5\nThread Name: Thread2\nThread Name: Thread3\nThread Name: Thread4\n\
  ```\n\n- 使用 `_thread` 模块创建线程是低级线程操作。\n- 在使用 `threading` 模块创建子线程时，遵循以下步骤：\n    -\
  \ 从 `threading` 模块的 `Thread` 类中定义新的子类。\n    - 重写 `__init__()` 方法以为子线程提供新参数。\n  \
  \  - 重写 `run()` 方法以提供线程的行为。\n\n```python\nimport threading\n\nclass newthread(threading.Thread):\n\
  \    def __init__(self,tname):\n        threading.Thread.__init__(self)\n      \
  \  self.name=tname\n\nt1=newthread(“t1”)\nprint(“t1 thread is created”)\n\nt2=newthread(“t2”)\n\
  print(“t2 thread is created”)\n```\n\n***Output***\n```\nD:\\PythonPrograms>python\
  \ a1.py\n\nt1 thread is created\nt2 thread is created\n```\n\n- `threading` 模块包含一个名为\
  \ `Thread` 的类。`Thread` 类包含了列出的方法：\n    - 使用 `start()` 方法启动线程活动。\n\n```python\nimport\
  \ threading\n\nclass newthread(threading.Thread):\n    def __init__(self,tname):\n\
  \        threading.Thread.__init__(self)\n        self.name=tname\n    print(“Name\
  \ in __int__: “,self.name)\n\nt1=newthread(“t1”)\nt2=newthread(“t2”)\nt1.start()\n\
  t2.start()\n```\n\n***Output***\n```\nD:\\PythonPrograms>python a1.py\n\nName in\
  \ __int__: t1\nName in __int__: t2\n```\n\n- `run()` 方法将执行线程的执行。每当创建一个新线程时，都可以通过重写方法为\
  \ `run()` 方法提供新定义。\n\n```python\nimport threading\n\nclass newthread(threading.Thread):\n\
  \    def __init__(self,tname):\n        threading.Thread.__init__(self)\n      \
  \  self.name=tname\n    def run(self):\n        print(self.name，“ thread is running”)\n\
  \nt1=newthread(“t1”)\nt2=newthread(“t2”)\nt1.start()\nt2.start()\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python a1.py\n\nt1 thread is running\nt2 thread is running\n\
  ```\n\n- `run()` 方法将执行线程的实际操作。\n\n```python\nimport threading\n\nclass newthread(threading.Thread):\n\
  \    def __init__(self,tname):\n        threading.Thread.__init__(self)\n      \
  \  self.name=tname\n    def run(self):\n        print(self.name，“ thread is running”)\n\
  \nt1=newthread(“t1”)\nt2=newthread(“t2”)\nt1.start()\nt2.start()\n```\n\n- `getname()`\
  \ 方法用于返回线程名称。\n\n```python\nimport threading\n\nclass newthread(threading.Thread):\n\
  \    def __init__(self,tname):\n        threading.Thread.__init__(self)\n      \
  \  self.name=tname\n    def run(self):\n        print(self.name,” thread is running”)\n\
  \nt1=newthread(“t1”)\nt2=newthread(“t2”)\nt1.start()\nt2.start()\n```\n\n- `is_alive()`\
  \ 方法用于检查线程是否存。\n\n```python\nimport threading\n\nclass newthread(threading.Thread):\n\
  \    def __init__(self,tname):\n        threading.Thread.__init__(self)\n      \
  \  self.name=tname\n    def run(self):\n        print(self.name,” thread is running”)\n\
  \nt1=newthread(“t1”)\nt2=newthread(“t2”)\nt1.start()\nt2.start()\n```\n\n- `join()`\
  \ 方法处理等待线程终止。\n- `isDaemon()` 方法用于检查输入线程是否为守护线程。\n- `setDaemon()` 方法用于将线程设置为守护线程。\n\
  \n- 在 Python 编程中，通过锁来实现同步。如果一个线程锁定了，其他线程将等待锁打开。因此，锁是支持线程同步的高效方法。线程锁处于以下两种状态之一：\n\
  \    - 已锁定\n    - 未锁定\n\n当为线程创建锁时，默认状态为“未锁定”。可以使用 `threading` 模块中的 `lock()` 函数创建新锁。在线程锁上，可以使用两个函数：\n\
  \    - `acquire()`：如果锁处于未锁定状态，任何线程都可以通过 `acquire()` 方法获取锁。\n    - `release()`：如果锁处于“锁定”状态，则对应的线程可以使用\
  \ `release()` 方法释放锁。\n\n```python\nimport threading\n\nclass newthread(threading.Thread):\n\
  \    def __init__(self,tname,l):\n        threading.Thread.__init__(self)\n    \
  \    self.name=tname\n        self.lock=l\n    def run(self):\n        print(self.name,”\
  \ thread is running”)\n    def x(self):\n        self.lock.acquire()\n        print(self.name,\
  \ “is locked”)\n    def y(self):\n        self.lock.release()\n        print(self.name,\
  \ “is released”)\n\nl=threading.Lock()\nt1=newthread(“t1”,l)\nt2=newthread(“t2”,l)\n\
  \nt1.start()\nt2.start()\n\nt1.x()\nt1.y()\nt2.x()\nt2.y()\n```\n\n\n\n\n`Lock()`\
  \ 方法允许线程获取一个锁。锁只有在另一个线程释放后才能被获取。\n\n```python\nimport threading\n\nclass newthread(threading.Thread):\n\
  \    def __init__(self,tname,l):\n        super().__init__(self)\n        self.name=tname\n\
  \        self.lock=l\n\n    def run(self):\n        print(self.name, “正在运行”)\n\n\
  \    def x(self):\n        self.lock.acquire()\n        print(self.name, “已锁定”)\n\
  \n    def y(self):\n        self.lock.release()\n        print(self.name, “已释放”)\n\
  \nl=threading.Lock()\nt1=newthread(\"t1\",l)\nt2=newthread(\"t2\",l)\n\nt1.start()\n\
  t2.start()\nt1.x()\nt2.x()\n```\n\n**输出**\n```\nD:\\PythonPrograms>python a1.py\n\
  t1 正在运行\nt2 正在运行\nt1 已锁定\nt2 已锁定\n```\n\n为了解决这个问题，使用 `RLock()` 方法创建了锁。这些锁被称为重入锁。\n\
  \n```python\nimport threading\n\nclass newthread(threading.Thread):\n    def __init__(self,tname,l):\n\
  \        super().__init__(self)\n        self.name=tname\n        self.lock=l\n\n\
  \    def run(self):\n        print(self.name, “正在运行”)\n\n    def x(self):\n    \
  \    self.lock.acquire()\n        print(self.name, “已锁定”)\n\n    def y(self):\n\
  \        self.lock.release()\n        print(self.name, “已释放”)\n\nl=threading.RLock()\n\
  t1=newthread(\"t1\",l)\nt2=newthread(\"t2\",l)\n\nt1.start()\nt2.start()\nt1.x()\n\
  t2.x()\n```\n\n**输出**\n```\nD:\\PythonPrograms>python a1.py\nt1 正在运行\nt2 正在运行\n\
  t1 已锁定\nt2 已锁定\n```\n\n## 15.5 示例\n\n**程序 1:** 使用 `_thread` 模块退出线程。\n\n```python\n\
  import _thread\n\ndef abc(arg1):\n    print(“启动线程名称: “,arg1)\n    print(“线程 1 正在退出”)\n\
  \    _thread.exit()\n\n_thread.start_new_thread(abc(\"Thread1\",))\n\nwhile True:\n\
  \    pass\n```\n\n**输出**\n```\nD:\\PythonPrograms>python a1.py\n启动线程名称: Thread1\n\
  线程 1 正在退出\n```\n\n\n\n\n```python\nthreading.Thread.__init__(self)\n\nself.name=tname\n\
  \nt1=newthread(“t1”)\n\nt1.start()\n\nprint(“List of Alive Threads: “,threading.enumerate())\n\
  ```\n\n# 寻找错误\n\n1. `import Threading`\n```python\nprint(“Current Thread Object:\
