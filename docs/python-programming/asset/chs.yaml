  - `w` 模式用于创建一个新文件并仅执行写入操作。如果文件已存在，则会覆盖该文件。在这种情况下，文件指针始终置于文件的起始位置。\n- `wb` 模式用于创建一个新文件并以二进制格式仅执行写入操作。如果文件已存在，则会覆盖该文件。在这种情况下，文件指针始终置于文件的起始位置。\n\
  - `wb+` 模式用于创建一个新文件并以二进制格式同时执行读取和写入操作。如果文件已存在，则会覆盖该文件。在这种情况下，文件指针始终置于文件的起始位置。\n\n\
  ### `abc.text` 的内容\n\n这是 `abc` 的第一行。\n\n```python\nf=open(“abc.txt”,”w+”)\nf.write(“This\
  \ is second line abc.txt”)\n```\n\n**输出**\n```\nContent of abc.text\nThis is second\
  \ line abc.txt\n```\n\n在这个示例中，文件 `abc.txt` 已经可用。因此，`w+` 模式用给定内容覆盖现有文件。如果文件不可用，则会创建一个新文件。\n\
  \n## 13.2.3 追加模式 (append mode)\n\n追加模式用于在文件末尾追加数据。如果文件已可用，则数据将追加到文件末尾；否则，将创建一个新文件并将内容追加到新文件中。\n\
  \n- `a` 模式用于仅以追加目的打开文件。在这种情况下，文件指针始终置于文件的末尾。\n- `a+` 模式用于打开文件以执行读取和追加操作。在这种情况下，文件指针始终置于文件的末尾。\n\
  - `ab` 模式用于以二进制格式打开文件进行追加。在这种情况下，文件指针始终置于文件的末尾。\n- `ab+` 模式用于仅以二进制格式打开文件以执行读取和追加操作。在这种情况下，文件指针始终置于文件的末尾。\n\
  \n### `abc.text` 的内容\n\n这是 `abc.txt` 的第二行\n\n```python\nf=open(“abc.txt”,”a”)\n\
  f.write(“\\nThis is third line abc.txt”)\n```\n\n**输出**\n```\nContent of abc.text\n\
  This is second line abc.txt\nThis is third line abc.txt\n```\n\n### 13.3 文件的读取/写入操作\n\
  \n`open()` 函数用于打开文件。打开文件的模式决定了在文件中执行何种操作。在文件中，我们可以执行两种操作。它们是：\n\n- 读取\n- 写入\n\n\
  ### 13.3.1 读取操作\n\n**1.** 读取操作通过 `read()` 方法执行。`read()` 方法应配合文件流对象使用。\n\n```python\n\
  f=open(“abc.txt”)\ns=f.read()\nprint(s)\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nThis is second line abc.txt\nThis is third line abc.txt\n```\n\n`read()`\
  \ 方法从文件开头开始读取数据。它读取数据并作为字符串对象返回。对于 `read()` 方法，我们也可以指定读取的数据大小限制。\n\n```python\n\
  f=open(“abc.txt”)\ns=f.read(6)\nprint(s)\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nThis i\n```\n在上面的示例中，`read()` 方法从 `abc.txt` 返回了 6 个字符串（字符）。\n\n**2.** `readline()`\
  \ 方法用于从文件中逐行返回数据。\n\n```python\nf=open(“abc.txt”)\ns=f.readline()\nprint(s)\n```\n\
  \n**输出**\n```\nD:\\PythonPrograms>python a1.py\nThis is second line abc.txt\n```\n\
  \n**2.** `readlines()` 方法用于从文件中返回所有行数据。\n\n```python\nf=open(“abc.txt”)\ns=f.readlines()\n\
  print(s)\n```\n\n**输出**\n```\nD:\\PythonPrograms>python bb.py\n['This is second\
  \ line abc.txt\\n', '......']\n```\n\n### 13.3.2 写入操作\n\n**1.** 与 `read()` 方法类似，`write()`\
  \ 方法用于将数据写入文件。如果以 `write` 模式打开文件，则 `write()` 方法从文件开头开始写入；否则，`write()` 方法从文件末尾开始写入。\n\
  \n### `abc.text` 的内容\n\n这是 `abc.txt` 的第二行\n这是 `abc.txt` 的第三行\n\n```python\nf=open(“abc.txt”,”w”)\n\
  s=”This is a book”\nf.write(s)\n```\n\n**输出**\n```\nContent of abc.text\nThis is\
  \ a book\n```\n\n**2.** `writelines()` 方法用于一次向文件写入多行数据。如果以 `write` 模式打开文件，则 `writelines()`\
  \ 方法从文件开头开始写入；否则，`writelines()` 方法从文件末尾开始写入。\n\n### `abc.text` 的内容\n\n这是 `abc.txt`\
  \ 的第二行\n这是 `abc.txt` 的第三行\n\n```python\nf=open(“abc.txt”,”w”)\ns=[\"This is a book”\\\
  n\",\"This is file chapter\"]\nf.writelines(s)\n```\n\n**输出**\n```\nContent of abc.text\n\
  This is a book\nfile chapter\n```\n\n## 13.4 其他文件操作\n\n除了读取和写入操作外，还允许各种其他操作。它们如下：\n\
  \n- `close()` 方法用于关闭已经创建的文件对象。\n\n```python\nf1=open(“abc.txt”)\ns2=f1.read()\n\
  print(“The data from file:”)\nprint(s2)\nf1.close()\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nThe data from file:\nThis is second line...\n```\n\n- `rename()` 方法用于将现有文件名重名为新文件名。该方法在\
