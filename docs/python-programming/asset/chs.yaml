  print(“Opening with new name”)\nf1=open(“h1.txt”)\nprint(“Name of the file: “,f1.name)\n\
  f1.close()\nprint(“Opening with old name:”)\nf1=open(“abc.txt”)\nprint(“Name of\
  \ the file: “,f1.name)\nf1.close()\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nName of the file: abc.txt\nOpening with new name\nName of the file: h1.txt\n\
  Opening with old name:\nTraceback (most recent call last):\nFile “a1.py”, line 15,\
  \ in <module>\nf1=open(“abc.txt”)\nFileNotFoundError: [Errno 2] No such file or\
  \ directory: ‘abc.txt’\n```\n\n- `os` 模块还包含 `remove()` 函数。该函数删除输入文件。使用此函数应导入 `os`\
  \ 模块。\n\n```python\nimport os\nprint(“Opening with new name”)\nf1=open(“h1.txt”)\n\
