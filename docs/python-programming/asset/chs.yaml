  \ 语句的问题在于，当条件为假时，没有任何语句块会被执行。为了解决这个问题，使用了 `if..else` 语句。\n\n![image](img/9789386235633_15.png)\n\
  \n**图 4.2** if-else 语句的流程图\n\n`if-else` 语句的流程图在图 4.2 中所示。对于 `if-else` 语句，只允许一个条件。当控制流到达\
  \ `if-else` 语句时，将评估 `if-else` 语句中的给定条件。如果条件的评估结果为假，控制流将进入 FALSE 块并执行第 1 语句，然后继续执行第\
  \ 3 语句。如果条件的评估结果为真，控制流将进入 TRUE 块并执行第 2 语句，然后继续执行第 3 语句。因此，无论 `if-else` 语句的条件如何，只会执行一个块（即\
  \ TRUE 块或 FALSE 块），最后将执行第 3 语句。\n\n在 `if..else` 语句中，可以使用两个语句块（TRUE 块和 FALSE 块）。条件在\
  \ `if` 语句中指定。最初将评估条件，如果条件为真，则评估 TRUE 块；如果条件为假，则评估 FALSE 块。其语法如下\n\n```python\nif(condition):\n\
  \    # TRUE 块语句\nelse:\n    # FALSE 块语句\n```\n\n示例为：\n\n```python\na=int(input(“Enter\
  \ the number:”))\nif(a>0):\n    print(“The given number is positive”)\nelse:\n \
