  | and | global | del | not | |\n| as | if | yield | elif | or |\n| assert | import\
  \ | else | pass | |\n| break | in | except | raise | |\n\n## 2.13 Python 标识符\n\n\
  标识符代表 Python 程序中使用的名称。标识符的长度可以视而异。验证标识符的规则如下：\n- 标识符可以是各种元素的组合，即大写字母、小写字母、数字和下划线。\n\
  - 不允许任何关键字作为标识符。\n- 标识符的第一个字母不应该是数字。\n- 特殊字母如 `!`、`#` 等等也不允许作为标识符的一部分。\n\n## 2.14\
  \ Python 语句\n\n下面列出了各种 Python 语句：\n- 简单语句\n- 表达式语句\n- 赋值语句\n- 断言语句\n- Pass 语句\n\
  - Del 语句\n- Return 语句\n- Yield 语句\n- Raise 语句\n- Break 语句\n- Continue 语句\n- 导入语句\n\
  - 全局语句\n- 非局部语句\n\n## 2.15 Python 缩进\n\n在 Python 编程语言中，一组代码或语句被安排在一个独立的块中。每个块之间可以通过缩进来分隔。如图\
  \ 2.1 所示：\n![image](img/9789386235633_13.png)\nPython 中的缩进结构。\n\n## 2.16 Python\
  \ 中的注释\n\n在 Python 中，注释可以通过以下两种方式指定：\n- `#` 用于单行注释。\n- 多行注释以 `'''` 开始并结束。\n\n##\
  \ 2.17 Python 2.x 和 3.x 的差异\n\n- 在 Python 2.x 中使用 `print` 语句；而在 3.x 中使用 `print()`\
  \ 函数。\n- 在 2.x 中，整数除法返回整数；而在 3.x 中它可以返回浮点数。例如，对于 `3/2` 操作，2.x 的结果是 `1`，3.x 的结果是\
  \ `1.5`。\n- 3.x 的 `input()` 函数相当于 2.x 的 `raw_input()` 函数。\n- 在 2.x 中使用 `file` 命令打开文件；而在\
  \ 3.x 中使用 `open()` 函数。\n- 2.x 的 `xrange()` 函数相当于 3.x 的 `range()` 函数。\n- 在 2.x 中，隐式字符串类型是\
  \ ASCII；而在 3.x 中是 Unicode。\n- 在 3.x 中，需要额外的 `as` 关键字来处理异常；而在 2.x 中不需要。\n- 需要 `future_module`\
  \ 来从 Python 2.x 升级到 3.x。\n\n## 2.18 Python 中的编码风格\n\nPython 中有四种不同的编码风格。它们是：\n-\
  \ 函数式\n- 命令式\n- 过程式\n- 面向对象\n\n### 函数式\n\n在这种编码风格中，给定的问题被分解为各种函数。它被广泛用于 Lambda 演算。\n\
  \n**编程提示：**\n在 Python 中，`print()` 用于在显示器上打印输入。\n\n```python\nimport functools\n\
  M = [10, 20, 30, 40, 50]\nres = functools.reduce(lambda a, b: a + b, M)\nprint(\"\
  result=\",res)\n```\n输出：\n```\nD:\\PythonPrograms>python s1.py\nresult=150\n```\n\
  \n\n\n在这种编码风格中，重点在于代码。给定的问题通过指令列表来描述。通过多个函数对代码进行高效处理。它使用迭代、模块化等方法来避免代码冗余。\n\n```python\n\
  def su(N):\n    res = 0\n    for a in N:\n        res=res+a\n    return(res)\n\n\
  M = [10, 20, 30, 40, 50]\nprint(\"result=\",su(M))\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ s1.py\nresult= 150\n```\n\n### 面向对象\n在这种编码风格中，重点在于数据。数据被视为一个实时对象。与对象数据一起工作的代码被成一个单一实体，并被称为“类”。类包含成员和方法。一些面向面向对象的原则包括：\n\
  \n### 抽象\n抽象允许程序员在不了解对象具体细节的情况下使用该对象。\n\n### 继承\n继承允许一个类派生另一个类的属性。通过这种方式，基类的属性被派生到子类中。\n\
  \n### 封装\n封装将所有属性（即成员和方法）绑定到一个名为“类”的单一实体中。\n\n### 多态\n多态允许同一个实体以不同的形式使用。有两种多态：i)\
  \ 编译时多态和 ii) 运行时多态。\n\n```python\nclass X:\n    def su(self,x,y):\n        return(x+y)\n\
  \ny=X()\nprint(\"result=\",y.su(10,20))\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ s1.py\nresult= 30\n```\n\n在上面的示例代码中，类 `X` 包含方法 `su()`。对于类 `X`，创建了一个对象 `y`。\n\n\
