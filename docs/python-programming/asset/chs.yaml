  \n```python\nif(condition):\n    # 当条件为真时执行的语句集合\n```\n\n示例为：\n\n```python\na=int(input(“Enter\
  \ the number:”))\nif(a>0):\n    print(“The given number is positive”)\n```\n\n***Output***\n\
