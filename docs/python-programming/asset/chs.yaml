  \n## 术语表\n- `Dictionary`（字典）是一种可变对象，用于维护异构元素。\n- `Dictionary`（字典）是一种映射对象，用于映射键值对。\n\
  - `Dictionary comprehension`（字典推导式）是一种使用表达式创建新字典的技术。\n\n## 总结\n- 有三种不同的方法创建字典对象。\n\
  - 字典对象中的元素可以被更新和删除。\n- 对于字典中的每个值，都应该维护一个键。\n- 可以通过关联的键值访问字典对象的值。\n- `Set`（集合）是字典的子集。\n\
