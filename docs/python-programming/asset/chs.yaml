  \n## 第 8 章：函数\n\n| 章节 | | 函数 |\n| :--- | :--- | :--- |\n| 8 | | |\n\n在本章中，我们将讨论\
  \ Python 中的用户定义函数。在 Python 中有内置函数和用户定义函数。内置函数定义在 Python 程序内部，而用户定义函数由用户定义。\n\n##\
  \ 8.1 引言\n\n在 Python 编程中，函数用于减少代码。函数代表代码的某部分，只有在需要时才执行。函数主要用于执行特定任务。函数的各种优点包括：\n\
  \n- 可以减少程序中的重复代码。\n- 可以将复杂代码分成更小的部分。\n- 提高代码效率。\n- 代码可以重用。\n- 提供了额外的灵活性。\n- 提高了模块化。\n\
  - 一个函数中包含的信息可以对其他函数隐藏。\n\n在 Python 编程中，函数类似于基本数据类型对象。函数有两种：i) 内置函数和 ii) 用户定义函数。\n\
  \n内置函数定义在 Python 编程语言中。在任何 Python 程序中，程序员都可以不提供定义而调用这些函数。\n\n```python\nx=input(\"\
  Enter the data:\")\nprint(\"The Entered Data is: \",x)\n```\n******\nD:\\PythonPrograms>python\
  \ a1.py\n\nEnter the data: 10\n\nThe Entered Data is:  10\n\n在上面的示例代码中使用两个内置函数。它们是\
  \ `print()` 和 `input()`。在程序中，用户没有提供这两个函数的定义。这些定义在 Python 中可用。通过这些预定义，`input()` 函数从控制台\
  \ I/O 读取数据，`print()` 函数在控制台 I/O 显示数据。在程序中，每当调用函数时，控制权会自动转移到用户定义的函数定义并执行，如果有需要，结果将如图\
  \ 8.1（ch08.xhtml_fig8.1）所示。\n\n## 8.2 定义函数\n\n在 Python 中，可以使用 `def` 定义用户定义函数。函数定义允许在类、模块另一个用户定义函数内部。用户定义函数的语法为：\n\
  \n```python\ndef user_defined_function_name(list_of_arguments):\n```\n\n\n\n\n\n\
  ### 用户定义函数的体\n\n下面是一个用户定义函数的示例。\n\n```python\nprint(“hello”)\nprint(“this is first\
  \ prg”)\nprint(“hello”)\nprint(“this is first prg”)\nprint(“hello”)\nprint(“this\
  \ is first prg”)\nprint(“hello”)\nprint(“this is first prg”)\n```\n\n在上面的示例代码中，有两个语句被重复了。因此，通过这组重复的语句，代码长度变成了\
  \ 8 行。为了减少这种情况，可以使用用户定义函数。下面显示了减少后的 4 行代码。\n\n![image](img/9789386235633_26.png)\n\
  \n## 8.3 调用函数\n\n在 Python 程序中，用户定义函数将减少数据的重复。在上面的示例代码中，由于用户定义函数的帮助，8 行重复的代码被减少到了\
  \ 4 行。用户定义函数应该使用 `def` 关键字进行定义。在程序中，每当需要执行用户定义函数时，就应该调用该函数。调用用户定义函数的语法如下。\n\n`user_defined_function_name(list_of_arguments)`\n\
  \n下面是一个调用用户定义函数的示例代码。\n\n```python\ndef f1():\nprint(“hello”)\nprint(“this is first\
  \ prg”)\n\nf1()\nf1()\nf1()\n```\n\n***输出***\n```\nD:\\PythonPrograms>python a1.py\n\
  hello\nthis is first prg\nhello\nthis is first prg\nhello\n```\n\n在上面的代码中，`f1()`\
  \ 是一个用户定义函数。`f1()` 的定义在程序给出（print “hello” 和 “this is first prg”）。在程序中，使用“f1()”语句来调用用户定义函数。该语句将调用用户定义函数\
  \ `f1()`，执行其体语句并返回到调用发生语句。可以使用循环以重复的方式进行函数调用。\n\n```python\ndef f1():\nprint(“hello”)\n\
  print(“this is first prg”)\nfor i in range(5):\nf1()\n```\n\n***输出***\n```\nD:\\\
  PythonPrograms>python a1.py\nhello\nthis is first prg\nhello\nthis is first prg\n\
  hello\nthis is first prg\nhello\nthis is first prg\nhello\nthis is first prg\n```\n\
  \n在上面的示例代码中，函数 `f1()` 被调用了 5 次。在下一个示例代码中，有两个用户定义函数，`f1()` 和 `f2()`。如果值是偶数，程序将从用户读取整数值；否则将调用\
  \ `f1()` 函数，否则调用 `f2()` 函数。\n\n```python\ndef f1():\nprint(“Function is called for\
  \ even number”)\ndef f2():\nprint(“Function is called for odd number”)\n\nn=int(input(“Enter\
  \ the value of n: “))\nif((n%2)==0):\nf1()\nelse:\nf2()\n```\n\n***输出***\n```\n\
  D:\\PythonPrograms>python a1.py\nEnter the value of n: 5\nFunction is called for\
  \ odd number\nD:\\PythonPrograms>python a1.py\nEnter the value of n: 8\nFunction\
  \ is called for even number\n```\n\n## 8.4 传递参数\n\n当调用用户定义函数时，值从调用函数传递到被调用函数。这些值被称为参数。在\
  \ Python 编程中，有四种类型的参数：\ni. 必需参数\nii. 关键字参数\niii. 默认参数\niv. 可变长度参数\n\n参数列表为空。因此，用户定义函数也可以没有参数。必需参数是从调用函数传递到被调用函数的值。在这种类型中，函数调用和函数定义中的参数数量应该匹配。否则，将会产生错误。\n\
  \n```python\ndef f1(x):\nprint(“The value of x: “,x)\nx=input(“Enter the value of\
  \ argument: “)\nf1(x)\n```\n\n***输出***\n```\nD:\\PythonPrograms>python a1.py\nEnter\
  \ the value of argument: abcd\nThe value of x: abcd\n```\n\n在上面的示例代码中，函数 `f1()`\
  \ 包含一个参数。因此，在函数调用期间，“x”作为参数传递给 `f1()`。它与 `f1()` 定义中的参数数量匹配。如果函数调用和函数定义中的参数数量不匹配，它将抛出错误。\n\
  \n```python\ndef f1(x,y):\nprint(“The value of x,y: “,x,y)\nx=input(“Enter the value\
  \ of argument: “)\nf1(x)\n```\n\n***输出***\n```\nD:\\PythonPrograms>python a1.py\n\
  Enter the value of argument: 5\nTraceback (most recent call last):\nFile “a1.py”,\
  \ line 5, in <module>\nf1(x)\nTypeError: missing 1 required argument: ‘y’\n```\n\
  \n## 8.5 关键字参数\n\n参数也可以分类为关键字参数。关键字参数根据关键字识别。这些参数不遵循它们的位置。也就是说，参数的位置可以改变。当具有许多参数且只需要指定其中一些时，使用关键字参数。\n\
  \n```python\ndef add(x,y):\ns=x+y\nprint(“Function is called for even number”)\n\
  print(“Function is called for odd number”)\nprint\nFunction is for odd number\n\n\
