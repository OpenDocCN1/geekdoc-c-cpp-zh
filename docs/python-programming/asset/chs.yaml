  1 2 3 4 5\nOdd numbers:\n1 3 5\nEven numbers:\n2 4\n```\n\n### 词表\n- 模块是一个带有多个定义的单个程序。模块允许访问程序外部的代码。\n\
  - 导入模块表示授予了对模块内容的访问。\n- `__name__` 是用于表示当前模块名称的变量。\n\n## 总结\n- 在 Python 中，通过模块和包极大地实现了代码的可重用。\n\
  - 模块是一个用于分组多个定义和可执行代码的单个文件。\n- 模块可以被导入另一个 Python 文件并访问模块的元素。\n\n## 单选题\n\n**1.**\
