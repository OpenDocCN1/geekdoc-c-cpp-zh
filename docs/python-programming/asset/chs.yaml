  (c) a 和 b 都是\n(d) 以上都不是\n\n**5.** 下列哪项不是序列对象？\n(a) `List`（列表）\n(b) `Tuple`（元组）\n\
  (c) `Dictionary`（字典）\n(d) 以上都不是\n\n**6.** 字典可以通过多少种方式创建？\n(a) 1\n(b) 2\n(c) 3\n\
