    11 Sometimes, argument values that do not correspond precisely to the parameter
    types in the function prototype can be converted by the compiler to the proper
    type before the function is called. These conversions occur as specified by C++’s
    `promotion rules`, which indicate the implicit conversions allowed between fundamental
    types. An `int` can be converted to a `double`. A `double` can also be converted
    to an `int`, but this narrowing conversion truncates the `double`’s fractional
    part—recall from Section 3.8.3 that C++11 list initializers do not allow narrowing
    conversions. Keep in mind that `double` variables can hold numbers of much greater
    magnitude than `int` variables, so the loss of data in a narrowing conversion
    can be considerable.


    Values might also be modified when converting large integer types to small integer
    types (e.g., `long` to `short`), signed to unsigned, or unsigned to signed. Variables
    of `unsigned` integer types can represent values from 0 to approximately twice
    the positive range of the corresponding signed integer types. The `unsigned` types
    are used primarily for bit manipulation ([Chapter 22](#ch22.xhtml_ch22)). They
    should not be used to ensure that a value is non-negative.


    [5](#ch03.xhtml_rch0fn5). C++ Core Guidelines. Accessed May 11, 2020. [`https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Ri-expects`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Ri-expects).


    The promotion rules also apply to expressions containing values of two or more
    data types—that is, `mixed-type expressions`. Each value’s type in a mixed-type
    expression is promoted to the expression’s “highest” type (actually a temporary
    copy of each value is created and used—the original values remain unchanged).
    The following table lists the arithmetic data types in order from “highest type”
    to “lowest type.”


    ![Images](Images/f0114-01.jpg)


    ### Conversions Can Result in Incorrect Values


    Converting values to lower fundamental types can cause errors due to narrowing
    conversions. Therefore, a value can be converted to a lower fundamental type only
    by explicitly assigning the value to a variable of lower type (some compilers
    will issue a warning in this case) or by using a cast operator. Function argument
    values are converted to the parameter types in a function prototype as if they
    were being assigned directly to variables of those types. If a `square` function
    with an `int` parameter is called with a `double` argument, the argument is converted
    to `int` (a lower type and thus a narrowing conversion), and `square` could return
    an incorrect value. For example, `square(4.5)` would return `16`, not `20.25`.
    Some compilers warn you about the narrowing conversion. For example, Microsoft
    Visual C++ issues the warning,


    ```

    ''argument'': conversion from ''double'' to ''int'', possible loss of data

    ```


    ### Narrowing Conversions with the Guidelines Support Library


    If you must perform an explicit narrowing conversion, the C++ Core Guidelines
    recommend using a `narrow_cast` operator from the `Guidelines Support Library
    (GSL)`—we’ll use this in [Figs 5.5](#ch05.xhtml_fig5_5) and [5.6](#ch05.xhtml_fig5_6).
    This library has several implementations. Microsoft provides an open-source version
    that has been tested on numerous platform/compiler combinations, including our
    three preferred compilers and platforms. You can download their GSL implementaton
    from:


    ```

    https://github.com/Microsoft/GSL

    ```


    [6](#ch03.xhtml_rch0fn6). C++ Core Guidelines. Accessed May 10, 2020. [`http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines/Res-narrowing`](http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Res-narrowing).


    For your convenience, we provided the GSL.


    The GSL is a header-only library, so you can use it simply by including `gsl/gsl`.
    The following statement uses `narrow_cast` (from namespace `gsl`) to convert the
    double `7.5` to the `int`:


    ```

    gsl::narrow_cast<int>(7.5)

    ```


    ## 5.7 C++ Standard Library Headers


    The C++ Standard Library is divided into many portions, each with its own header.
    The headers contain the function prototypes for the related functions that form
    each portion. The headers also contain definitions of various class types and
    functions, as well as constants needed by those functions. A header “instructs”
    the compiler on how to interface with library and user-written components.


    The following table lists common C++ Standard Library headers, many of which are
    discussed later in this book. The term “macro” that’s used several times is discussed
    in detail in [Appendix E](#app05.xhtml_app05), Preprocessor. For a complete list
    of the 96 C++20 standard library headers, visit


    ```

    https://en.cppreference.com/w/cpp/header

    ```


    On that page, you’ll see approximately three dozen additional headers that are
    marked as either deprecated or removed. Deprecated headers are ones you should
    no longer use, and removed headers are no longer included in the C++ standard
    library.


