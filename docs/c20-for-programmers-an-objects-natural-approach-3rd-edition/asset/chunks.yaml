    编程语言社区正处于激动人心的时代，每种主流语言都在努力跟上引人注目的新编程技术。ISO C++ 标准委员会现在每三年发布一个新标准，编译器供应商也会迅速实现这些新特性。《面向程序员的
    C++20》基于新的 C++20 标准。


    ### 现场代码方法


    本书的核心是 Deitel 标志性的“现场代码”（live-code）方法。我们在完整运行程序的上下文中介绍大多数概念，并附带一个或多个示例执行。请阅读本前言之后的“**开始之前**”章节，了解如何配置您的
