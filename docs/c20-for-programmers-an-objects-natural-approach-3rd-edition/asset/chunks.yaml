  trans: "\n早些时候我们引入了 `for` 迭代语句。在 `for` 头部的初始化部分，我们声明并初始化了一个控制变量，这使得该变量的作用范围限制在 `for`\
    \ 语句中。C++17 的**带初始化器的选择语句**（`selection statements with initializers`）允许您在 `if`\
    \ 或 `if…else` 语句的条件之前，以及 `switch` 语句的控制表达式之前包含变量初始化器。与 `for` 语句一样，这些变量仅在声明它们的语句中是可知的。图\
    \ 4.7 显示了带有初始化器的 `if…else` 语句。我们将在图 5.5 中同时使用带有初始化器的 `if…else` 和 `switch` 语句，实现一个流行的赌场骰子游戏。\n\
    \n![Images](img/04fig07.jpg)\n\n**图 4.7** C++17 带有初始化器的 `if` 语句。\n\n## 带初始化器的选择语句的语法\n\
    \n对于 `if` 或 `if…else` 语句，您将初始化器放在条件括号的第一个。对于 `switch` 语句，您将初始化器放在控制表达式括号的第一个。初始化器必须以分号（`;`）结束，如第\
    \ 7 行和第 14 行所示。初始化器可以在用逗号分隔的列表中声明多个相同类型的变量。\n\n## 初始化器中声明的变量的作用域\n\n在 `if`、`if…else`\
    \ 或 `switch` 语句初始化器中声明的任何变量都可以在语句的剩余部分中使用。在第 7–12 行中，我们使用变量 `value` 来确定执行 `if…else`\
    \ 语句的哪个分支，然后在两个分支的输出语句都使用了 `value`。当 `if…else` 语句结束时，`value` 不再存在，因此我们可以在第二个 `if…else`\
    \ 语句中再次使用该标识符来声明一个仅在该语句中可知的新变量。\n\n为了证明 `value` 在 `if…else` 语句之外是不可访问的，我们提供了该程序的第二个版本（`fig04_07_with_error.cpp`），它尝试在第二个\
    \ `if…else` 语句之后（即在其作用域之外）访问变量 `value`。这在我们的三个编译器中产生了以下编译错误：\n\n- Visual Studio:\
    \ `'value': undeclared identifier`\n- Xcode: `error: use of undeclared identifier\
    \ 'value'`\n- GNU g++: `error: 'value' was not declared in this scope`\n\n## 4.10\
    \ `break` 和 `continue` 语句\n\n除了选择和迭代语句外，C++ 还提供了 `break` 和 `continue` 语句来改变控制流。前面的章节展示了如何使用\
    \ `break` 来终止 `switch` 语句的执行。本节讨论了如何在迭代语句中使用 `break`。\n\n### `break` 语句\n\n`break`\
    \ 语句在 `while`、`for`、`do…while` 或 `switch` 中执行时，会导致立即退出该语句——执行从控制语句之后的第一条语句继续。`break`\
    \ 的常见用途包括提前退出循环或退出 `switch`（如图 4.6 所示）。图 4.8 展示了 `break` 语句提前退出 `for` 循环。\n\n\
    ![Images](img/04fig08.jpg)![Images](img/04fig08a.jpg)\n\n**图 4.8** `break` 语句退出\
    \ `for` 语句。（部分/部分。）\n\n当嵌套在 `for` 语句第 10–12 行的 `if` 语句（第 9–15 行）检测到 `count` 为\
    \ `5` 时，第 11 行的 `break` 语句执行。这终止了 `for` 语句，程序继续执行第 17 行（紧接 `for` 语句），显示指示循环终止时控制变量的值的消息。循环体仅完全执行了四次，而不是十次。\n\
    \n### `continue` 语句\n\n`continue` 语句在 `while`、`for` 或 `do…while` 中执行时，会跳过循环体中的剩余语句并进入循环的下次迭代。在\
    \ `while` 和 `do…while` 语句中，程序在 `continue` 语句执行后立即评估循环继续测试。在 `for` 语句中，先执行增量表达式，然后程序评估循环继续测试。\n\
    \n![Images](img/04fig09.jpg)\n\n**图 4.9** `continue` 语句终止 `for` 语句的一次迭代。\n\n图\
    \ 4.9 使用 `continue`（第 9 行）在嵌套的 `if` 确定 `count` 的值为 `5` 时跳过第 12 行的语句。当 `continue`\
    \ 语句执行时，程序控制继续执行 `for` 语句中控制变量的增加（第 7 行）。\n\n某些程序员认为 `break` 和 `continue` 违反了结构化编程。由于可以通过结构化编程技术实现相同的效果，这些程序员不使用\
    \ `break` 或 `continue`。\n\n![Images](img/common01.jpg)  实现高质量软件工程与实现最佳性能软件之间存在张力。有时，其中一个目标的实现是以另一个为代价的。对于除性能密集之外的所有情况，您应该先让代码简单，然后让它快速。\n\
    \n## 4.11 逻辑运算符\n\n`if`、`if…else`、`while`、`do…while` 和 `for` 语句都需要一个条件来决定如何继续。到为止，我们只研究了简单条件，如\
    \ `count <= 10`、`number != sentinelValue` 和 `total > 100`。有时控制语句需要复杂的条件来进行决策。逻辑运算符有\
    \ `&&`（逻辑与）、`||`（逻辑或）和 `!`（逻辑非）。\n\n### 4.11.1 逻辑与 (`&&`) 运算符\n\n假设我们希望在程序的某处确保两个条件都为真，然后选择特定的执行路径。在这种情况下，可以使用\
    \ `&&`（逻辑与）运算符，如下：\n\n```cpp\nif (gender == FEMALE && age >= 65) {\n   ++Females;\n\
    }\n```\n\n此 `if` 语句包含两个简单条件。`gender == FEMALE` 将 `gender` 与常量 `FEMALE` 比较以判断是否为女性。`age\
    \ >= 65` 可能被评估以判断是否为老年人。`if` 语句考虑复合条件\n\n```\ngender == FEMALE && age >= 65\n\
    ```\n\n仅当两个简单条件都为真时，该条件才为真。在这种情况下，`if` 语句体将 `Females` 加 1。如果一个或两个简单条件为假，程序将跳过加操作。某些程序员发现，添加冗余括号会让上述复合条件更具可读性，例如\n\
    \n```cpp\n(gender == FEMALE) && (age >= 65)\n```\n\n下表总结了 `&&` 运算符，显示了 `expression1`\
    \ 和 `expression2` 的 `bool` 值 `false` 和 `true` 的所有可能组合：\n\n![Images](img/f0128-01.jpg)\n\
    \n此类表格被称为**真表**（truth tables）。C++ 对包含关系运算符、相等运算符或逻辑运算符的所有表达式求值为零（假）或非零（真）。\n\n\
    ### 4.11.2 逻辑或 (`||`) 运算符\n\n现在假设我们希望在选择特定的执行路径之前，确保两个条件中至少有一个或两个都为真。在这种情况下，我们使用\
    \ `||`（逻辑或）运算符，如下程序段所示：\n\n```cpp\nif ((semesterAverage >= 90) || (finalExam >=\
    \ 90)) {\n   cout << \"Student grade is A\\n\";\n}\n```\n"
- fmt: "\nThis statement also contains two simple conditions. The condition `semesterAverage\
    \ >= 90` determines whether the student deserves an A in the course for a solid\
    \ performance throughout the semester. The condition `finalExam >= 90` determines\
    \ whether the student deserves an A in the course for an outstanding performance\
    \ on the final exam. The `if` statement then considers the combined condition\n\
    \n```\n(semesterAverage >= 90) || (finalExam >= 90)\n```\n\nand awards the student\
    \ an A if either or both of the simple conditions are true. The only time the\
    \ message `\"Student grade is A\"` is not printed is when both of the simple conditions\
    \ are false. The following is the truth table for the operator logical OR (`||`):\n\
    \n![Images](Images/f0128-02.jpg)\n\nOperator `&&` has higher precedence than operator\
    \ `||`. Both operators group left-to-right.\n\n#### 4.11.3 Short-Circuit Evaluation\n\
    \nThe parts of an expression containing `&&` or `||` operators are evaluated only\
    \ until it’s known whether the condition is true or false. Thus, evaluation of\
    \ the expression\n\n```\n(gender == FEMALE) && (age >= 65)\n```\n\nstops immediately\
    \ if `gender` is not equal to `FEMALE` (i.e., the entire expression is false)\
    \ and continues if `gender` is equal to `FEMALE` (i.e., the entire expression\
    \ could still be true if the condition `age >= 65` is true). This feature of logical\
    \ AND and logical OR expressions is called `short-circuit evaluation`.\n\nIn expressions\
    \ using operator `&&`, a condition—we’ll call this the dependent condition—may\
    \ require another condition to be true for the evaluation of the dependent condition\
    \ to be meaningful. In this case, the dependent condition should be placed after\
    \ the `&&` operator to prevent errors. Consider the expression `(i != 0) && (10\
    \ / i == 2)`. The dependent condition `(10 / i == 2)` must appear after the `&&`\
    \ operator to prevent the possibility of division by zero.\n\n#### 4.11.4 Logical\
    \ Negation (`!``) Operator\n\nThe `!` (`logical negation`, also called `logical\
    \ NOT` or `logical complement`) operator “reverses” the meaning of a condition.\
    \ Unlike the logical operators `&&` and `||`, which are binary operators that\
    \ combine two conditions, the logical negation operator is a unary operator that\
    \ has only one condition as an operand. To execute code only when a condition\
    \ is false, place the logical negation operator *before* the original condition,\
    \ as in the program segment\n\n```\nif (!(grade == sentinelValue)) {\n\n   cout\
    \ << \"The next grade is \" << grade << \"\\n\";\n\n}\n```\n\nwhich executes the\
    \ body statement only if `grade` is *not* equal to `sentinelValue`. The parentheses\
    \ around the condition `grade == sentinelValue` are needed because the logical\
    \ negation operator has higher precedence than the equality operator.\n\nIn most\
    \ cases, you can avoid using logical negation by expressing the condition differently\
    \ with an appropriate relational or equality operator. For example, the previous\
    \ statement may also be written as follows:\n\n```\nif (grade != sentinelValue)\
    \ {\n\n   cout << \"The next grade is \" << grade << \"\\n\";\n\n}\n```\n\nThis\
    \ flexibility can help you express a condition more conveniently. The following\
    \ is the truth table for the logical negation operator:\n\n![Images](Images/f0129-01.jpg)\n\
    \n#### 4.11.5 Example: Using the Logical Operators to Produce Their Truth Tables\n\
    \n[Figure 4.10](#ch04.xhtml_fig4_10) uses logical operators to produce the truth\
    \ tables discussed in this section. The output shows each expression that’s evaluated\
    \ and its `bool` result. By default, `bool` values `true` and `false` are displayed\
    \ by `cout` and the stream insertion operator as `1` and `0`, respectively. The\
    \ sticky `stream manipulator` `boolalpha` (line 8) specifies that each `bool`\
    \ expression’s value should be displayed as the word “true” or the word “false.”\
    \ Lines 8–12, 15–19 and 22–24 produce the truth tables for `&&`, `||` and `!`,\
    \ respectively.\n\n![Images](Images/04fig10.jpg)![Images](Images/04fig10a.jpg)\n\
    \n**Fig. 4.10** Logical operators. (Part 1 of 2.)\n\n##### Precedence and Grouping\
    \ of the Operators Presented So Far\n\nThe following table shows the precedence\
    \ and grouping of the C++ operators introduced so far—from top to bottom in decreasing\
    \ order of precedence:\n\n![Images](Images/f0131-01.jpg)\n\n#### 4.12 Confusing\
    \ the Equality (`==`) and Assignment (`=`) Operators\n\nThere’s one error that\
    \ C++ programmers, no matter how experienced, tend to make so frequently that\
    \ we feel it requires a separate section. That error is accidentally swapping\
    \ the operators `==` (equality) and `=` (assignment). What makes this so damaging\
    \ is that it ordinarily does not cause syntax errors. Statements with these errors\
    \ tend to compile correctly and run to completion, often generating incorrect\
    \ results through runtime logic errors. Some compilers issue a warning when `=`\
    \ is used in a context where `==` is expected.\n\nTwo aspects of C++ contribute\
    \ to these problems. One is that any expression that produces a value can be used\
    \ in the decision portion of any control statement. If the expression’s value\
    \ is zero, it’s treated as `false`. If the value is nonzero, it’s treated as `true`.\
    \ The second is that assignments produce a value—namely, the value assigned to\
    \ the variable on the left side.\n\n##### lvalues and rvalues\n\nYou can prevent\
    \ the preceding problem with a simple trick. First, it’s helpful to know what’s\
    \ allowed to the left of an assignment operator. Variable names are said to be\
    \ `lvalues` (for “left values”) because they can be used on an assignment operator’s\
    \ left side. Literals are said to be `rvalues` (for “right values”) because they\
    \ can be used on an assignment operator’s right side. *Lvalues* also can be used\
    \ as *rvalues* on the right side of an assignment, but not vice versa.\n\nProgrammers\
    \ normally write conditions such as `x == 7` with the variable name (an *lvalue*)\
    \ on the left and the literal (an *rvalue*) on the right. Placing the literal\
    \ on the left, as in `7 == x` (which is syntactically correct), enables the compiler\
    \ to issue an error if you accidentally replace the `==` operator with`.\n\n#####\
    \ Using `==` in Place of =\n\nThere’s another equally unpleasant situation. Suppose\
    \ you want to assign a value to a variable with a simple statement like\n\n```\n\
    x = 1;\n```\n\nbut instead write\n\n```\nx == 1;\n```\n\nHere, too, this is not\
    \ a syntax error. Rather, the compiler simply evaluates the expression. If `x`\
    \ is equal to `1`, the condition is true, and the expression evaluates to a nonzero\
    \ (true) value. If `x` is not equal to `1`, the condition is false and the expression\
    \ evaluates to 0\\. Regardless of the expression’s value, there’s no assignment,\
    \ so the value is lost. The value of `x` remains unaltered, probably causing an\
    \ execution-time logic error. Using operator `==` for assignment and using operator\
    \ `=` for equality are logic errors. Use your text editor to search for all occurrences\
    \ of `=` in your program and check that you have the correct assignment. relational\
    \ or equality operator in each place.\n\n### 20 4.13 C++20 Feature Mock-Up: `[[likely]]`\
    \ and `[[unlikely]]` Attributes\n"
