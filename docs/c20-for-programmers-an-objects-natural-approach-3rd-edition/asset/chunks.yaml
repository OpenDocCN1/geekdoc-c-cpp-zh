    folder location between the `:` and `#`.


    ### Changing to the `ch01` Folder in the Docker Container


    The `docker run` command specified above attaches your `examples` folder to the
    containers `/usr/src` folder. In the docker container, use the `cd` command to
    change to the `ch01` sub-folder of `/usr/src`:


    ```

    root@01b4d47cadc6:/# cd /usr/src/ch01


    root@01b4d47cadc6:/usr/src/ch01#

    ```


    To compile, run and interact with the `GuessNumber` application in the Docker
    container, follow `Steps 2–7` of Section 1.2.3’s GNU C++ Test-Drive.


    ### Terminating the Docker Container


    You can terminate the Docker container by typing `Ctrl + d` at the container’s
    prompt.


    ## 2. Intro to C++ Programming


    ![Images](Images/ch02.jpg)


    ### Objectives


    In this chapter, you’ll:


    - Write simple C++ applications.

    - Use input and output statements.

    - Use fundamental data types.

    - Use arithmetic operators.

    - Understand the precedence of arithmetic operators.

    - Write decision-making statements.

    - Use relational and equality operators.

    - Begin appreciating the “objects natural” learning approach by creating and using
    objects of the C++ standard library’s `string` class before creating your own
    custom classes.


    ### Outline


    - [2.1 Introduction](#ch02.xhtml_ch02lev1sec1)

    - [2.2 First Program in C++: Displaying a Line of Text](#ch02.xhtml_ch02lev1sec2)

    - [2.3 Modifying Our First C++ Program](#ch02.xhtml_ch02lev1sec3)

    - [2.4 Another C++ Program: Adding Integers](#ch02.xhtml_ch02lev1sec4)

    - [2.5 Arithmetic](#ch02.xhtml_ch02lev1sec5)

    - [2.6 Decision Making: Equality and Relational Operators](#ch02.xhtml_ch02lev1sec6)

    - [2.7 Objects Natural: Creating and Using Objects of Standard Library Class `string`](#ch02.xhtml_ch02lev1sec7)

    - [2.8 Wrap-Up](#ch02.xhtml_ch02lev1sec8)


    ### 2.1 Introduction


    This chapter presents several code examples that demonstrate how your programs
    can display messages and obtain data from the user for processing. The first three
    display messages on the screen. The next obtains two numbers from a user at the
    keyboard, calculates their sum and displays the result—the accompanying discussion
    introduces C++’s arithmetic operators. The fifth example demonstrates decision
    making by showing you how to compare two numbers, then display messages based
    on the comparison results.


    #### “Objects Natural” Learning Approach


    In your programs, you’ll create and use many objects of carefully-developed-and-tested
    preexisting classes that enable you to perform significant tasks with minimal
    code. These classes typically come from:


    - the C++ standard library,

    - platform-specific libraries (such as those provided by Microsoft for creating
    Windows applications or by Apple for creating macOS applications) and

    - free third-party libraries often created by the massive open-source communities
    that have developed around all major contemporary programming languages.


    To help you appreciate this style of programming early in the book, you’ll create
    and use objects of preexisting C++ standard library classes before creating your
    own custom classes. We call this the “objects natural” approach. You’ll begin
    by creating and using `string` objects in this chapter’s final example. In later
    chapters, you’ll create your own custom classes. You’ll see that C++ enables you
    to “craft valuable classes” for your own use and that other programmers can reuse.


    #### Compiling and Running Programs


    For instructions on compiling and running programs in Microsoft Visual Studio,
    Apple Xcode and GNU C++, see the test-drives in [Chapter 1](#ch01.xhtml_ch01)
    or our video instructions at


    ```

    http://deitel.com/c-plus-plus-20-for-programmers

    ```


    #### “Rough-Cut” E-Book for O’Reilly Online Learning Subscribers


    You are viewing an early-access “rough cut” of `C++20 for Programmers`. We prepared
    this content carefully, but it has not yet been reviewed or copy edited and is
    subject to change. As we complete each chapter, we’ll post it here. Please send
    any corrections, comments, questions and suggestions for improvement to `paul@deitel.com`
    and I’ll respond promptly. Check here frequently for updates.


    #### “Sneak Peek” Videos for O’Reilly Online Learning Subscribers


    As an O’Reilly Online Learning subscriber, you also have access to the “sneak
    peek” of our new `C++20 Fundamentals LiveLessons` videos at:


    ```

    https://learning.oreilly.com/videos/c-20-fundamentals-parts/9780136875185

    ```


    Co-author Paul Deitel immediately records each video lesson as we complete each
    rough-cut e-book chapter. Lessons go live on O’Reilly Online Learning a few days
    later. Again, check here frequently for updates.


    ### 2.2 First Program in C++: Displaying a Line of Text


    Consider a simple program that displays a line of text ([Fig. 2.1](#ch02.xhtml_fig2_1)).


    ![Images](Images/ch02.jpg)


    **Fig. 2.1** Text-printing program.


    #### Comments


    Lines 1 and 2


    ```cpp

    // ch01.cpp

    ```


    each begin with `//`, indicating that the remainder of the line is a comment.
    In each of our programs, the first line describes the program. A comment terminates
    at the end of current line. You can create multiline comments by enclosing them
    in `/*` and `*/`, as in


    ```cpp

    /*-printing program. */

    ```


    #### #include Preprocessing Directive


    Line 3


    ```cpp

    #include <iostream> // enables program to output data

    ```


    is a preprocessing directive—that is, a message to the C++ preprocessor, which
    the compiler invokes before compiling the program. This line notifies the preprocessor
    to include in the program the contents of `iostream`. This header is a file the
    compiler requires when compiling any program that outputs data to the screen.
    [Chapter 5](#ch05.xhtml_ch05) discusses headers in more detail, and [Chapter 15](#ch15.xhtml_ch15)
    explains the contents of `<iostream>` in more detail.


    #### Blank Lines and White Space


    Line 4 is simply a blank line. You use blank lines, spaces and tabs to make programs
    easier to read. Together, these characters are known as white space—they’re normally
    ignored by the compiler.


    #### The main Function


    Line 6


    ```cpp

    int main() {

    ```


    is a part of every C++ program. The parentheses after `main` indicate that it’s
    a function. C++ programs typically consist of one or more functions and classes.
    Exactly one function in every program must be named `main`. [Figure 2.1](#ch02.xhtml_fig2_1)
    contains only one function. C++ programs begin executing at function `main`. The
    keyword `int` to the left of `main` indicates that after `main` finishes executing,
    it “returns” an integer (whole number) value. Keywords are reserved by C++ for
    a specific use. We show the complete list of C++ keywords in [Chapter 3](#ch03.xhtml_ch03).
    We’ll explain what it means for a function to “return a value” when we demonstrate
    how to create your own functions in [Chapter 5](#ch05.xhtml_ch05). For now, simply
    include the keyword `int` to the left of `main` in each of your programs.


    The left brace, `{`, (end of line 6) must begin each function’s body, which contains
    the instructions the function performs. A corresponding right brace, `}` (line
    10) must end each function’s body.


    #### An Output Statement


    Line 7


    ```cpp

    std::cout << "Welcome to C++!\n"; // display message

    ```

