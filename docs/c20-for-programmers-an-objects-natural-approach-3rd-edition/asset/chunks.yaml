    \ then `cout << \"Passed\"``; otherwise, `cout << \"Failed\"`.” This is comparable\
    \ to an `if…else` statement. Conditional expressions can appear in some program\
    \ locations where `if…else` statements cannot.\n\n### 3.5 `while` Iteration Statement\n\
    \nAn iteration statement allows you to specify that a program should repeat an\
