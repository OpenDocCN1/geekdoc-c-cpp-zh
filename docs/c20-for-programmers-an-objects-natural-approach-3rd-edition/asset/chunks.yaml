    ### 3.13 C++20 Feature Mock-Up—Text Formatting with Function `format`


    20 C++20 introduces powerful new string formatting capabilities via the **`format`**
    **function** (in header **`<format>`**). These capabilities greatly simplify C++
    formatting by using a syntax similar to that used in Python, Microsoft’s .NET
    languages (like C# and Visual Basic) and the up-and-coming newer language Rust.^([10](#ch03.xhtml_ch0fn10))
    You’ll see throughout the book that the C++20 text-formatting capabilities are
    more concise and more powerful than those in earlier C++ versions. In [Chapter
    14](#ch14.xhtml_ch14), we’ll also show that these new capabilities can be customized
    to work with your own new class types. We’ll show both old- and new-style formatting
    because in your career you may work with software that uses the old style.


    [10](#ch03.xhtml_rch0fn10). [`http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p0645r10.html`](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p0645r10.html).


    ##### C++20 String Formatting Is Not Yet Implemented


    At the time of this writing (April 2020), the C++ standard was about to be approved
    (May 2020) and C++ compilers had not yet fully implemented many of C++20’s features,
    including text formatting. However, the `{fmt}` library at


    ```

    https://github.com/fmtlib/fmt

    ```


    provides a full implementation of the new text-formatting features.^([11](#ch03.xhtml_ch0fn11)),^([12](#ch03.xhtml_ch0fn12))
    So, we’ll use this library until the C++20 compilers implement text formatting.^([13](#ch03.xhtml_ch0fn13))
    For your convenience, we included the complete download in the `examples` folder’s
    `libraries` subfolder, then included only the required files in the `fig03_06`
    folder. Be sure to read the library’s license terms included in the provided `format.h`
    file.


    [11](#ch03.xhtml_rch0fn11). According to [`http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p0645r10.html`](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p0645r10.html),
    which is the C++ standard committee proposal for C++20 text formatting.


    [12](#ch03.xhtml_rch0fn12). C++20’s text formatting features are a subset of the
    features provided by the `{fmt}` library.


    [13](#ch03.xhtml_rch0fn13). Some of our C++20 Feature Mock-Up sections present
    code that does not compile or run. Once the compilers implement those features,
    we’ll retest the code, update our digital products and post updates for our print
    products at [`https://deitel.com/c-plus-plus-20-for-programmers`](https://deitel.com/c-plus-plus-20-for-programmers).
    The code in this example runs, but uses the `{fmt}` open-source library to demonstrate
    features that C++20 compilers will support eventually.


    ##### Format String Placeholders


    The `format` function’s first argument is a **format string** containing **placeholders**
    delimited by curly braces (`{` and `}`). The function replaces the placeholders
    with the values of the function’s other arguments, as demonstrated in [Fig. 3.6](#ch03.xhtml_fig3_6).


    ![Images](Images/03fig06.jpg)![Images](Images/03fig06a.jpg)


    **Fig. 3.6** C++20 string formatting.


    ##### Placeholders Are Replaced Left-to-Right


    The `format` function replaces its format string argument’s placeholders left-to-right
    by default. So, line 11’s `format` call inserts into the format string


    ```

    "{}''s grade is {}"

    ```


    `student`’s value (`"Paul"`) in the first placeholder and `grade`’s value (`87`)
    in the second placeholder, then returns the string


    ```

    "Paul''s grade is 87"

    ```


    ##### Compiling and Running the Example in Microsoft Visual Studio


    The steps below are the same as those in Section 3.12 with the following changes:


    • In Step 3, navigate to the `fig03_06` folder, add both the files `fig03_06.cpp`
    and `format.cc` to your project’s Source Files folder.'
