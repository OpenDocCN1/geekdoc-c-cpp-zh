- fmt: "\nEarlier, we introduced the `for` iteration statement. In the `for` header’s\
    \ initialization section, we declared and initialized a control variable, which\
    \ limited that variable’s scope to the `for` statement. C++17’s `selection statements\
    \ with initializers` enable you to include variable initializers before the condition\
    \ in an `if` or `if…else` statement and before the controlling expression of a\
    \ `switch` statement. As with the `for` statement, these variables are known only\
    \ in the statements where they’re declared. [Figure 4.7](#ch04.xhtml_fig4_7) shows\
    \ `if…else` statements with initializers. We’ll use both `if…else` and `switch`\
    \ statements with initializers in [Fig. 5.5](#ch05.xhtml_fig5_5), which implements\
    \ a popular casino dice game.\n\n![Images](Images/04fig07.jpg)\n\n**Fig. 4.7**\
    \ C++17 `if` statements with initializers.\n\n## Syntax of Selection Statements\
    \ with Initializers\n\nFor an `if` or `if…else` statement, you place the initializer\
    \ first in the condition’s parentheses. For a `switch` statement, you place the\
    \ initializer first in the controlling expression’s parentheses. The initializer\
    \ must end with a semicolon (`;`), as in lines 7 and 14. The initializer can declare\
    \ multiple variables of the same type in a comma-separated list.\n\n## Scope of\
    \ Variables Declared in the Initializer\n\nAny variable declared in the initializer\
    \ of an `if`, `if…else` or `switch` statement may be used throughout the remainder\
    \ of the statement. In lines 7–12, we use the variable `value` to determine which\
    \ branch of the `if…else` statement to execute, then use `value` in the output\
    \ statements of both branches. When the `if…else` statement terminates, `value`\
    \ no longer exists, so we can use that identifier again in the second `if…else`\
    \ statement to declare a new variable known only in that statement.\n\nTo prove\
    \ that `value` is not accessible outside the `if…else` statements, we provided\
    \ a second version of this program (`fig04_07_with_error.cpp`) that attempts to\
    \ access variable `value` after (and thus outside the scope of) the second `if…else`\
    \ statement. This produces the following compilation errors in our three compilers:\n\
    \n- Visual Studio: `'value': undeclared identifier`\n- Xcode: `error: use of undeclared\
    \ identifier 'value'`\n- GNU g++: `error: 'value' was not declared in this scope`\n\
    \n## 4.10 `break` and `continue` Statements\n\nIn addition to selection and iteration\
    \ statements, C++ provides statements `break` and `continue` to alter the flow\
    \ of control. The preceding section showed how `break` could be used to terminate\
    \ a `switch` statement’s execution. This section discusses how to use `break`\
    \ in iteration statements.\n\n### `break` Statement\n\nThe `break` statement,\
    \ when executed in a `while`, `for`, `do…while` or `switch`, causes immediate\
    \ exit from that statement—execution continues with the first statement after\
    \ the control statement. Common uses of `break` include escaping early from a\
    \ loop or exiting a `switch` (as in [Fig. 4.6](#ch04.xhtml_fig4_6)). [Figure 4.8](#ch04.xhtml_fig4_8)\
    \ demonstrates a `break` statement exiting a `for` early.\n\n![Images](Images/04fig08.jpg)![Images](Images/04fig08a.jpg)\n\
    \n**Fig. 4.8** `break` statement exiting a `for` statement. (Part 1 of 2.)\n\n\
    When the `if` statement nested at lines 10–12 in the `for` statement (lines 9–15)\
    \ detects that `count` is `5`, the `break` statement at line 11 executes. This\
    \ terminates the `for` statement, and the program proceeds to line 17 (immediately\
    \ after the `for` statement), which displays a message indicating the value of\
    \ the control variable when the loop terminated. The loop fully executes its body\
    \ only four times instead of 10.\n\n### `continue` Statement\n\nThe `continue`\
    \ statement, when executed in a `while`, `for` or `do…while`, skips the remaining\
    \ statements in the loop body and proceeds with the next iteration of the loop.\
    \ In `while` and `do…while` statements, the program evaluates the loop-continuation\
    \ test immediately after the `continue` statement executes. In a `for` statement,\
    \ the increment expression executes, then the program evaluates the loop-continuation\
    \ test.\n\n![Images](Images/04fig09.jpg)\n\n**Fig. 4.9** `continue` statement\
    \ terminating an iteration of a `for` statement.\n\n[Figure 4.9](#ch04.xhtml_fig4_9)\
    \ uses `continue` (line 9) to skip the statement at line 12 when the nested `if`\
    \ determines that `count`’s value is `5`. When the `continue` statement executes,\
    \ program control continues with the increment of the control variable in the\
    \ `for` statement (line 7).\n\nSome programmers feel that `break` and `continue`\
    \ violate structured programming. Since the same effects are achievable with structured-programming\
    \ techniques, these programmers do not use `break` or `continue`.\n\n![Images](Images/common01.jpg)\
    \ PERF There’s a tension between achieving quality software engineering and achieving\
    \ the best-performing software. Sometimes one of these goals is achieved at the\
    \ expense of the other. For all but the most performance-intensive situations,\
    \ you should first make your code simple, then make it fast.\n\n## 4.11 Logical\
    \ Operators\n\nThe `if`, `if…else`, `while`, `do…while` and `for` statements each\
    \ require a condition to determine how to continue. So far, we’ve studied only\
    \ simple conditions, such as `count <= 10`, `number != sentinelValue` and `total\
    \ > 100`. Sometimes control statements require more complex conditions to determine\
    \ a decision. The logical operators are `&&` (logical AND), `||` (logical OR)\
    \ and `!` (logical negation).\n\n### 4.11.1 Logical AND (`&&`) Operator\n\nSuppose\
    \ we wish to ensure at some point in a program that two conditions are both true\
    \ before we choose a certain path of execution. In this case, we can use the `&&`\
    \ (logical AND) operator, as follows:\n\n```cpp\nif (gender == FEMALE && age >=\
    \ 65) {\n   ++Females;\n}\n```\n\nThis `if` statement contains two simple conditions.\
    \ The condition `gender == FEMALE` compares `gender` to the constant `FEMALE`\
    \ to determine whether a person is female. The condition `age >= 65` might be\
    \ evaluated to determine whether a person is a senior citizen. The `if` statement\
    \ considers the combined condition\n\n```\ngender == FEMALE && age >= 65\n```\n\
    \nwhich is true if and only if both simple conditions are true. In this case,\
    \ the `if` statement’s body increments `Females` by `1`. If either or both of\
    \ the simple conditions are false, the program skips the increment. Some programmers\
    \ find that the preceding combined condition is more readable when redundant parentheses\
    \ are added, as in\n\n```cpp\n(gender == FEMALE) && (age >= 65)\n```\n\nThe following\
    \ table summarizes the `&&` operator, showing all possible combinations of the\
    \ `bool` values `false` and `true` values for `expression1` and `expression2`:\n\
    \n![Images](Images/f0128-01.jpg)\n\nSuch tables are called **truth tables**. C++\
    \ evaluates to zero (false) or nonzero (true) all expressions that include relational\
    \ operators, equality operators or logical operators.\n\n### 4.11.2 Logical OR\
    \ (`||`) Operator\n\nNow suppose we wish to ensure that either or both of two\
    \ conditions are true before we choose a certain path of execution. In this case,\
    \ we use the `||` (logical OR) operator, as in the following program segment:\n\
    \n```cpp\nif ((semesterAverage >= 90) || (finalExam >= 90)) {\n   cout << \"Student\
    \ grade is A\\n\";\n}\n```\n"
