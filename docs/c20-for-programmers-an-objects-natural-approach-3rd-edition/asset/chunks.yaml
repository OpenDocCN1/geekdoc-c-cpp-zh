    第 8、9、14 和 21 行分别声明了 `int` 变量 `total`、`gradeCounter`、`grade` 和 `average`。变量 `grade`
    存储了用户的输入。在函数体内部声明的变量是局部变量。它只能从声明它的行到该变量所在块的结束右大括号之间使用。局部变量的声明必须在变量使用之前出现。变量 `grade`——在
    `while` 循环体内部声明——只能在该块内使用。


    ### 初始化变量 `total` 和 `gradeCounter`


    第 8–9 行声明并初始化 `total` 值为 `0`，将 `gradeCounter` 值为 `1`。这些初始化发生在变量在计算中使用它们之前。


    ### 从用户处读取 10 份成绩


    `while` 语句（第 12–18 行）只要 `gradeCounter` 的值小于或等于 10，循环就会继续迭代。第 13 行显示提示信息 `"Enter
    grade: "`。第 15 行输入用户输入的成绩并将其赋值给变量 `grade`。然后第 16 行将用户输入的新 `grade` 加到 `total` 中，并将结果赋值给
    `total`，替换其原有值。第 17 行将 `gradeCounter` 加 1，表示程序已处理了一个成绩，并准备从用户处输入下一个成绩。`gradeCounter`
    的增加会导致其超过 10，从而终止循环。


    ### 计算并显示班平均分


    循环结束时，第 21 行在 `average` 变量的初始化器中执行平均计算。第 24 行显示文本 `"Total of all 10 grades is
    "` 随后是变量 `total` 的值。然后，第 25 行显示文本 `"Class average is "` 以及 `average` 的值。当执行到第
    26 行时，程序终止。


    ### 3.6.2 整数除法与截断


    此示例的平均计算产生一个整数结果。程序的输出表明，示例执行中成绩值的总和为 846，当除以 10 时，应该得到 84.6。像 84.6 这样包含小数点的数字是`浮点数`。然而，在平均分程序中，由于
    `total` 和 `10` 都是整数，`total / 10` 的结果是整数 84。两个整数相除会导致`整数除法`——计算中的任何分数部分都会截断。在下一节中，我们将看到如何从平均计算中获得浮点结果。


    假设整数除法的四舍五入（而非截断）会导致错误的结果。例如，`7 / 4` 在常规算术中得到 1.75，在整数算术中被截断为 1，而不是四舍五入为 2。


    ### 3.7 哨兵迭代


    让我们将 3.6 节的平均分问题泛化。考虑以下问题：


    *编写一个平均分程序，每次运行时都能处理任意数量学生的的成绩。*


    在之前的平均分示例中，问题描述指定了学生人数，因此成绩数量（10 份）是预先知的。在这个示例中，没有指示用户在程序执行期间将输入多少份成绩。程序必须处理*任意*数量的成绩。


    解决此问题的一种方法是使用一个特殊的值称为`哨兵值`（也称为信号值、虚拟值或标志值），来指示“数据输入结束”。用户不断输入成绩，直到所有合法成绩都输入完毕。然后用户输入哨兵值以表示不再输入更多成绩。


    你必须选择一个不会与可接受输入值混淆的哨兵值。测验成绩是非负整数，因此 –1 是该问题的一个可接受的哨兵值。因此，运行平均分程序可能会处理一组诸如 95,
    96, 75, 74, 89 和 –1 的输入流。程序随后将计算并打印 95, 96, 75, 74 和 89 成绩的班平均分；由于 –1 是哨兵值，它不应进入平均值计算。


    用户可能在输入成绩之前就输入 –1，在这种情况下成绩数量将为零。我们必须在计算班平均分之前测试此情况。根据 C++ 标准，浮点算术中除以零的结果是未定义的。在执行右侧操作数可能为
    0 的除法（/`）或取模（%`）计算时，应对此进行测试并处理（例如，显示错误消息），而不是允许计算继续。


    #### 3.7.1 实现哨兵迭代


    在图 3.2 中，`main` 函数实现了哨兵控制迭代。虽然用户输入的每个成绩都是整数，但平均计算可能会产生一个浮点数。`int` 类型无法表示这样的数字。C++
    提供了 `float` 和 `double` 数据类型来在内存中存储浮点数。这些类型之间的主要区别是 `double` 变量通常存储数值更大、更精细的数字——即小数点后有更多数字，这称为数字的`精度`。C++
    还支持用于浮点数的 `long double` 类型。


    ![Images](img/03fig2.jpg)

    ![Images](img/03fig2a.jpg)

    **图 3.2** 使用哨兵迭代解决平均分问题。（部分 1/2）


    回想一下整数除法产生整数结果。此程序引入了`强制转换运算符`来强制平均计算产生浮点结果。此程序还堆叠了控制语句——`while` 语句（第 19–26 行）后面跟着一个
    `if…else` 语句（第 30–42 行）。此程序中的大部分代码与图 3.1 相同，因此我们将在第 4 章中介绍介绍浮点类型。


    ##### 哨兵迭代与计数迭代的程序逻辑


    第 10 行将 `gradeCounter` 初始化为 `0`，因为还没有输入成绩。记住此程序使用哨兵迭代输入成绩。只有当用户输入有效成绩时，程序才会增加
    `gradeCounter`。第 32 行声明 `double` 变量 `average`，以浮点数形式存储计算出的班平均分。


    将此程序的哨兵迭代程序逻辑与图 3.1 中的计数迭代逻辑进行比较。在计数迭代中，`while` 语句（图 3.1 第 12–18 行）的每次迭代都会从用户处读取一个值，持续指定的次数。在哨兵迭代中，程序在到达
    `while` 之前会提示并读取第一个值（图 3.2 第 14 和 16 行）。该值决定了控制流是否应该进入 `while` 体。如果条件为假，说明用户输入了哨兵值，因此没有输入成绩，体不执行。如果条件为真，体开始执行，循环将
    `grade` 值加到 `total` 并增加 `gradeCounter`。


