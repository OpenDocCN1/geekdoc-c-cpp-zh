    #### `static_cast` 算符


    为了在本示例中对整数进行浮点数计算，你首先使用 `static_cast` 算符创建临时浮点值。第 32 行将括号中其操作数（`total`）的临时拷贝转换为角括号中的类型（`double`）。存储在原始
    `int` 变量 `total` 中的值仍然是整数。像这样使用转换操作符被称为**显式转换**（`explicit conversion`）。`static_cast`
    是我们将讨论的几种转换算符之一。


    #### 提升（Promotions）


    在转换操作之后，计算由 `total` 的临时 `double` 拷贝除以整数 `gradeCounter`。对于算术运算，编译器只如何求值所有操作数类型完全相同的表达式。为了确保这一点，编译器会对选定的操作数执行一种称为**提升**（`promotion`，也称为隐式转换）的操作。在包含
    `int` 和 `double` 数据类型值的表达式中，C++ 将 `int` 操作数**提升**为 `double` 值。因此，在第 32 行中，C++
    将 `gradeCounter` 值的临时拷贝提升为 `double` 类型，然后执行除法。最后，`average` 用浮点结果进行初始化。第 5.5 节讨论了允许的基本类型提升。


    #### 适用于任何类型的转换算符


    转换算符适用于每种基本类型，也适用于其他类型，正如你从第 9 章 开始看到的那样。只需在 `static_cast` 关键字后的角括号（`<` 和 `>`）中指定类型即可。它是一个**一元算符**（`unary
