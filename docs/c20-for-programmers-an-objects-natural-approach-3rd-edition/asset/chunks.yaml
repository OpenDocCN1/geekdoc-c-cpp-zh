    ### Step 4: Configuring the Project to Using C++20

    The Clang compiler in Xcode supports several versions of the C++ standard. For
    this book, we use C++20, which we must configure in our project’s settings:


    **1.** In the Project navigator, select your project’s name (`cpp20_test`).


    **2.** In the Editors area’s left side, select `TARGET`.


    **3.** At the top of the Editors area, click `Build Settings`, and just below
