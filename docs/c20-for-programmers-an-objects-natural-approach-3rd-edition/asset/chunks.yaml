    function (in header `<format>`). These capabilities greatly simplify C++ formatting
    by using a syntax similar to that used in Python, Microsoft’s .NET languages (like
    C# and Visual Basic) and the up-and-coming newer language Rust.([10](#ch03.xhtml_ch0fn10))
    You’ll see throughout the book that C++20 capabilities are more concise and powerful
