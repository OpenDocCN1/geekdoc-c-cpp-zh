    \ `750`：\n\n![Images](img/01unfig17.jpg)\n\n应用程序显示“Too low. Try again.”，因为你输入的值再次小于正确答案。\n\
    \n### 第 10 ：输入额外的猜测\n\n继续输入数值玩游戏，直到你猜中正确的数字。当你猜对时，应用程序会显示“Excellent! You guessed\
    \ the number.”（太棒了！你猜中数字了）：\n\n![Images](img/01unfig18.jpg)\n\n### 再次游戏或退出应用程序\n\
    \n猜中正确数字后，应用程序会询问你想不想再玩一次游戏。在“Would you like to play again (y or n)?”提示处，输入 `y`\
    \ 会导致应用程序选择一个新数字并开始新游戏。输入 `n` 则终止应用程序。每次从头执行此应用程序（第 7 步），它都会为你选择相同的数字供你猜测。\n\n\
    ### 复用此项目用于后续示例\n\n你可以按照本节的步骤为书中的每个应用程序创建一个单独的项目。不过，对于我们的示例，你可能会发现先从项目中删除当前程序再添加新程序更方便。要从项目中删除文件（但不从系统中删除），请在项目导航器中右键点击该文件并选择\
    \ `Delete`。在出现的对话框中，选择 `Move to Trash`（移动到废纸）。然后你可以重复 `第 6 步` 将不同的程序添加到项目中。\n\n\
    ### 1.2.3 在 Linux 上使用 GNU C++ 编译和运行 C++20 \n\n对于本次测试，我们假设你已经阅读了“开始之前”部分，并将下载的示例放在了用户账户的\
    \ `Documents` 文件夹中。\n\n### 第 1 步：切换到 `ch01` 文件夹\n\n在 Linux shell，使用 `cd` 命令切换到书籍\
    \ `examples` 文件夹下的 `ch01` 子文件夹：\n\n```\n~$ cd ~/Documents/examples/ch01\n\n~/Documents/examples/ch01$\n\
    ```\n\n在本节的图中，我们使用**粗体**来高亮你输入的文本。我们 Ubuntu Linux shell 中的提示使用波号（`~`）表示主目录。每个提示都以美元符号（`$`）结束。提示在你的\
    \ Linux 系统上可能不同。\n\n### 第 2 步：编译应用程序\n\n在运行应用程序之前，你必须先编译它：\n\n```\n~/Documents/examples/ch01$\
    \ g++ -std=c++2a GuessNumber.cpp -o GuessNumber\n\n~/Documents/examples/ch01$\n\
    ```\n\n`g++` 命令编译应用程序：\n\n• `-std=c++2a` 选项表示我们正在使用 C++20——`c++2a` 在未来的 GNU C++\
    \ 版本中将变为 `c++20`。\n\n• `-o` 选项指定了用于运行程序的可执行文件名称（`GuessNumber`）。\n\n### 第 3 步：运行应用程序\n\
    \n在提示符处输入 `./GuessNumber` 并按 `Enter` 运行程序：\n\n```\n~/Documents/examples/ch01$\
    \ ./GuessNumber\n\nI have a number between 1 and 1000.\n\nCan you guess my number?\n\
    \nPlease type your first guess.\n\n?\n```\n\n`./`  Linux 从当前目录运行文件，并用于指示 `GuessNumber`\
    \ 是一个可执行文件。\n\n### 第 4 步：输入你的第一个猜测\n\n应用程序显示“Please type your first guess.”，然后在下一行显示问号（`?`）作为提示。在提示处输入\
    \ `500`——注意输出可能会根据你使用的编译器而异：\n\n```\n~/Documents/examples/ch01$ ./GuessNumber\n\
    \nI have a number between 1 and 1000.\n\nCan you guess my number?\n\nPlease type\
    \ your first guess.\n\n? 500\n\nToo high. Try again.\n\n?\n```\n\n应用程序显示“Too high.\
    \ Try again.”（太小，请试一次），意味着你输入的值大于应用程序选择的正确数字。\n\n### 第 5 步：输入另一个猜测\n\n在下一个提示下，输入\
    \ `250`：\n\n```\n~/Documents/examples/ch01$ ./GuessNumber\n\nI have a number between\
    \ 1 and 1000.\n\nCan you guess my number?\n\nPlease type your first guess.\n\n\
    ? 500\n\nToo high. Try again.\n\n? 250\n\nToo low. Try again.\n\n?\n```\n\n这一次应用程序显示“Too\
    \ low. Try again.”（太小，请试一次），因为你输入的值小于正确答案。\n\n### 第 6 步：输入额外的猜测\n\n继续输入数值玩游戏，直到你猜中正确的数字。当你猜对时，应用程序会显示“Excellent!\
    \ You guessed the number.”：\n\n```\n~/Documents/examples/ch01$ ./GuessNumber\n\
    \nI have a number between 1 and 1000.\n\nCan you guess my number?\n\nPlease type\
    \ your first guess.\n\n? 500\n\nToo high. Try again.\n\n? 250\n\nToo low. Try\
    \ again.\n\n?\n```\n\n### 第 7 步：再次游戏或退出应用程序\n\n猜中正确数字后，应用程序会询问你想不想再玩一次游戏。在“Would\
    \ you like to play again (y or n)?”提示处，输入 `y` 会导致应用程序选择一个新数字并开始新游戏。输入 `n` 则终止应用程序。每次从头执行此应用程序（第\
    \ 7 步），它都会为你选择相同的数字供你猜测。\n\n### 1.2.4 在 Windows、macOS 和 Linux 上使用 GNU C++ 原生编译和运行\
    \ C++20 \n\n在编写时，GNU C++ 实现了 C++20。因此，你可能想使用它。一种方便的跨平台方法是使用 GNU  Collection (GCC)\
    \ Docker。本节假设你已经安装了 Docker Desktop (Windows 或 macOS) 或 Docker Engine (Linux)。\n\
    \n### 执行 GNU  Collection (GCC) Docker 容器\n\n打开命令行 (Windows)、终端 (macOS/Linux) 或\
    \ shell (Linux)，然后执行以下步骤启动 GCC 容器：\n\n**1.** 使用 `cd` 命令导航到包含本书示例的文件夹。\n\n**2.**\
    \ Windows 用户：使用以下命令启动 gcc 容器：\n\n```\ndocker run --rm -it -v \"%CD%\":/usr/src\
    \ gcc:latest\n```\n\n**3.** macOS/Linux 用户：使用以下命令启动 gcc 容器：\n\n```\ndocker run\
    \ --rm -it -v \"$(pwd)\":/usr/src gcc:latest\n```\n\n在上述命令中：\n\n--rm 在你关闭容器时清理资源。\n\
    \n-it 以交互模式运行容器，以便你可以输入命令切换文件夹并使用 C++ 编译器编译程序。\n\n-v \"%CD%\":/usr/src (Windows)\
    \ 或 -v \"$(pwd)\":/usr/src (macOS/Linux) 允许 Docker 容器访问你执行 `docker run` 命令时的本地系统文件。在\
    \ Docker 容器中，你将使用 `cd` 命令进入 `/usr/src` 的子目录来编译和运行 C++ 代码。\n\ngcc:latest 是容器名称。`:latest`\
    \ 指定你想使用最新版本的 `gcc` 容器。每次你执行上述 `docker run` 命令时，Docker 都会检查你是否拥有最新的 `gcc` 容器版本。如果没有，Docker\
    \ 会执行容器前下载它。\n\n一旦容器运行，你会看到类似下面的提示符：\n\n```\nroot@67773f59d9ea:/#\n```\n"
