    `operand`）会被插入输出流中。注意，`<<` 运算符指向数据的去向。字符串的字符通常按照在双引号中输入的方式精确显示。然而，字符 `\n` 并不会图
    2.1 的示例输出中显示。反斜杠（`\`）被称为 `escape character`（转义字符）。它表示输出一个“特殊”字符。当字符串中遇到反斜杠时，下一个字符将与反斜杠结合形成
    `escape sequence`（转义序列）。转义序列 `\n` 表示 `newline`（换行）。它导致 `cursor`（即当前屏幕位置指示器）移动到屏幕下一行的开头。下表显示了一些常见的转义序列：


    ![Images](img/p0111-01.jpg)


    ### `return` 语句


    第 9 行


    ```

    return 0; // 表示程序成功结束

    ```


    这是我们将用于 `exit a function`（退出函数）的几种手段之一。在 `main` 结尾的这个 `return` 语句中，值 `0` 表示程序成功终止。如果程序执行到
    `main` 结束而没有遇到 `return` 语句，C++ 会假设程序成功终止。因此，在后续成功终止的程序中，我们省略 `main` 结尾的 `return`
    语句。


