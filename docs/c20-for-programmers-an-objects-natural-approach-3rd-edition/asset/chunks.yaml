- fmt: "\nTo specify that a reference parameter should not be allowed to modify the\
    \ corresponding argument in the caller, place the `const` qualifier before the\
    \ type name in the parameter’s declaration. For example, consider a `displayName`\
    \ function:\n\n```\nvoid displayName(std::string name) {\n   std::cout << name\
    \ << std::endl;\n}\n```\n\nWhen called, it receives a copy of its `string` argument.\
    \ Since `string` objects can be large, this copy operation could degrade an application’s\
    \ performance. For this reason, `string` objects (and objects in general) should\
    \ be passed to functions by reference.\n\nAlso, the `displayName` function does\
    \ not need to modify its argument, so following the principle of least privilege,\
    \ we’d declare the parameter as\n\n```cpp\nconst std::string& name\n```\n\n![Images](Images/common01.jpg)\
    \ Perf ![Images](Images/common02.jpg) Security Reading this from right-to-left,\
    \ the `name` parameter is a reference to a `string` constant. We get the performance\
    \ of passing the `string` by reference. Also, `displayName` treats the argument\
    \ as a constant, so `displayName` cannot modify the value in the caller—so we\
    \ get the security of pass-by-value.\n\n### Returning a Reference to a Local Variable\n\
    \nFunctions can return references to local variables, but this can be dangerous.\
    \ When returning a reference to a local non`static` variable, the reference refers\
    \ to a variable that’s discarded when the function terminates. An attempt to access\
    \ such a variable yields undefined behavior, often crashing the program or corrupting\
    \ data.^([16](#ch05.xhtml_ch0fn16)) References to undefined variables are called\
    \ **dangling references**. This is a logic error for which compilers typically\
    \ issue a warning. Software-engineering teams often have policies requiring that\
    \ before code can be deployed, it must compile without warnings.\n\n[16](#ch05.xhtml_rch0fn16).\
    \ C++ Core Guidelines. Accessed May 11, 2020\\. [`https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rf-dangle`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rf-dangle).\n\
    \n### 5.14 Default Arguments\n\nIt’s common for a program to invoke a function\
    \ repeatedly with the same argument value for a particular parameter. In such\
    \ cases, you can specify that such a parameter has a **default argument**, i.e.,\
    \ a default value to be passed to that parameter. When a program omits an argument\
    \ for a parameter with a default argument in a function call, the compiler rewrites\
    \ the function call, inserting the default value of that argument.\n\n#### `boxVolume`\
    \ Function with Default Arguments\n\n[Figure 5.10](#ch05.xhtml_fig5_10) demonstrates\
    \ using default arguments to calculate a box’s volume. The function prototype\
    \ for `boxVolume` (line 7) specifies that all three parameters have default values\
    \ of `1` by placing `= 1` to the right of each parameter.\n\n![Images](Images/05fig10.jpg)![Images](Images/05fig10a.jpg)\n\
    \n**Fig. 5.10** Using default arguments. (Part 1 of 2.)\n\nThe first call to `boxVolume`\
    \ (line 11) specifies no arguments, thus using all three default values of 1\\\
    . The second call (line 15) passes only a `length` argument, thus using default\
    \ values of 1 for the `width` and `height` arguments. The third call (line 19)\
    \ passes arguments for only `length` and `width`, thus using a default value of\
    \ 1 for the `height` argument. The last call (line 23) passes arguments for `length`,\
    \ `width` and `height`, thus using no default values. Any arguments passed to\
    \ the function explicitly are assigned to the function’s parameters from left\
    \ to right. Therefore, when `boxVolume` receives one argument, the function assigns\
    \ the value of that argument to its `length` parameter (i.e., the leftmost parameter\
    \ in the parameter list). When `boxVolume` receives two arguments, the function\
    \ assigns the values of those arguments to its `length` and `width` parameters\
    \ in that order. Finally, when `boxVolume` receives all three arguments, the function\
    \ assigns the values of those arguments to its `length`, `width` and `height`\
    \ parameters, respectively.\n\n#### Notes Regarding Default Arguments\n\nDefault\
    \ arguments must be the rightmost (trailing) arguments in a function’s parameter\
    \ list. When calling a function with two or more default arguments, if an omitted\
    \ argument is not the rightmost argument, then all arguments to the right of that\
    \ argument also must be omitted. Default arguments must be specified with the\
    \ first occurrence of the function name—typically, in the function prototype.\
    \ If the function prototype is omitted because the function definition also serves\
    \ as the prototype, then the default arguments should be specified in the function\
    \ header. Default values can be any expression, including constants, global variables\
    \ or function calls. Default arguments also can be used with `inline` functions.\
    \ Using default arguments can simplify writing function calls, but some programmers\
    \ feel that explicitly specifying all arguments is clearer.\n\n### 5.15 Unary\
    \ Scope Resolution Operator\n\nC++ provides the **unary** **scope resolution operator\
    \ (`::`)** to access a global variable when a local variable of the same name\
    \ is in scope. The unary scope resolution operator cannot be used to access a\
    \ local variable of the same name in an outer block. A global variable can be\
    \ accessed directly without the unary scope resolution operator if the name of\
    \ the global variable is not the same as that of a local variable in scope.\n\n\
    [Figure 5.11](#ch05.xhtml_fig5_11) shows the unary scope operator with local and\
    \ global variables (lines 6 and 9).\n\n![Images](Images/05fig11.jpg)\n\n**Fig.\
    \ 5.11** Unary scope operator\n\nAlways use the scope resolution operator (`::`)\
    \ to refer to global variables (even if there is no collision with local-variable\
    \ name). This makes it clear that you’re accessing a global variable rather than\
    \ a local variable. It also makes programs easier to modify by reducing the risk\
    \ of collisions. Avoid using variables of the same name for different purposes.\n\
    \n### 5.16 Function Overloading\n\nC++ enables several functions of the same name\
    \ to be defined, as long as they have different signatures. This is called **function\
    \ overloading**. The C++ compiler selects the proper function to call by examining\
    \ the number, types and order of the arguments in the call. Function overloading\
    \ is used to create several functions of the same name that perform similar tasks\
    \ but on data of different types. For example, many functions in the math library\
    \ are overloaded for different numeric types—the C++ standard requires `float`,\
    \ `double` and `long double` overloaded versions of the math library functions\
    \ in Section 5.3\\. Overloading functions that perform closely related tasks can\
    \ make programs clearer.\n\n#### Overloaded `square` Functions\n\n[Figure 5.12](#ch05.xhtml_fig5_12)\
    \ uses overloaded `square` functions to calculate the square of an `int` (lines\
    \ 7–10) and the square of a `double` (lines 13–16). Line 19 invokes the `int`\
    \ version of function `square` by passing the literal value `7`. C++ treats whole-number\
    \ literal values as type `int`. Similarly, line 21 invokes the `double` version\
    \ of function `square` by passing the literal value `7.5`, which C++ treats as\
    \ a `double`. In each case, the compiler chooses the proper function to call,\
    \ based on the type of the argument. The output confirms that the proper function\
    \ was called in each case.\n\n![Images](Images/05fig12.jpg)![Images](Images/05fig12a.jpg)\n\
    \n**Fig. 5.12** Overloaded `square` functions. (Part 1 of 2.)\n\n##### How the\
    \ Compiler Differentiates Among Overloaded Functions\n"
