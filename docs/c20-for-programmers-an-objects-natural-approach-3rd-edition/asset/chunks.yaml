    ##### Including a Header That Is Not in the C++ Standard Library


    In an `#include` directive, headers that are not from the C++ Standard Library
    typically are placed in double quotes (`""`), rather than the angle brackets (`<>`).
    The double quotes tell the compiler that header is in your application’s folder
    or another folder that you specify.


    ##### What Happens When You Exceed the Maximum `long long` Integer Value?


    Line 9 initializes the variable `value1` with the maximum `long long` value on
    our system:^([9](#ch03.xhtml_ch0fn9))


    ```

    long long value1{9''223''372''036''854''775''807LL}; // max long long value

    ```


    [9](#ch03.xhtml_rch0fn9). The platforms on which we tested this book’s code each
    have as their maximum `long long` integer value 9,223,372,036,854,775,807\. You
    can determine this value programmatically with the expression `std::numeric_limits<long
    long>::max()`, which uses class `numeric_limits` from the C++ standard library
    header `<limits>`. The `<>` and `::` notations used in this expression are covered
    in later chapters, so we used the literal value 9,223,372,036,854,775,807 in [Fig.
    3.5](#ch03.xhtml_fig3_5).


    20 Typing numeric literals with many digits can be error prone. To make such literals
    more readable and reduce errors, C++14 introduced the **digit separator** **`''`**
    (a single-quote character), which you insert between groups of digits in numeric
    literals—we used it so separate groups of three digits. Also, note the **`LL`**
    (“el el”) at the end of the literal value—this indicates that the literal is a
    `long long` integer.


    Line 10 displays `value1`, then line 11 subtracts one from it to demonstrate a
    valid calculation. Next, we attempt to add `1` to `value1`, which already contains
    the maximum `long long` value. All our compilers displayed as the result the *minimum*
    *`long long`* *value*. The C++ standard actually says the result of this calculation
    is **undefined behavior**. Such behaviors can differ between systems—ours displayed
    an incorrect value but other systems could terminate the program and display an
    error message. This is another example of why the fundamental integer types are
    not portable.


    ##### Performing the Same Operations with a `BigNumber` Object


    Lines 15–18 use a `BigNumber` object to repeat the operations from lines 9–12\.
    We create a `BigNumber` object named `value2` and initialize it with `value1`,
    which contains the maximum value of a `long long` integer:


    ```

    BigNumber value2{value1};

    ```'
