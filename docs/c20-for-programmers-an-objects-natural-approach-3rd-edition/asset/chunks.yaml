    \ condition is false, the output statement is ignored, and the next statement\
    \ in order is performed. The indentation of the second line of this selection\
    \ statement is optional, but recommended for program clarity.\n\n##### `bool`\
    \ Data Type\n\nIn [Chapter 2](#ch02.xhtml_ch02), you created conditions using\
    \ the relational or equality operators. Actually, any expression that evaluates\
    \ to zero or nonzero can be used as a condition. Zero is treated as false, and\
    \ nonzero is treated as true. C++ also provides the data type **`bool`** for Boolean\
    \ variables that can hold only the values **`true`** and **`false`**—each of these\
    \ is a C++ keyword.\n\nFor compatibility with earlier versions of C, which used\
    \ integers for Boolean values, the `bool` value `true` also can be represented\
    \ by any nonzero value (compilers typically use 1), and the `bool` value `false`\
    \ also can be represented as zero.\n\n##### UML Activity Diagram for an `if` Statement\n\
    \nThe following diagram illustrates the single-selection `if` statement.\n\n![Images](Images/03unfig02.jpg)\n\
    \nThis figure contains the most important symbol in an activity diagram—the diamond,\
    \ or **decision symbol**, which indicates that a decision is to be made. The workflow\
    \ continues along a path determined by the symbol’s associated **guard conditions**,\
    \ which can be true or false. Each transition arrow emerging from a decision symbol\
    \ has a guard condition (specified in square brackets next to the arrow). If a\
    \ guard condition is true, the workflow enters the action state to which the transition\
    \ arrow points. The diagram shows that if the grade is greater than or equal to\
    \ 60 (i.e., the condition is true), the program prints “Passed,” then transitions\
    \ to the activity’s final state. If the grade is less than 60 (i.e., the condition\
    \ is false), the program immediately transitions to the final state without displaying\
    \ a message. The `if` statement is a single-entry/single-exit control statement.\n\
    \n### 3.4 `if…else` Double-Selection Statement\n\nThe `if` single-selection statement\
    \ performs an indicated action only when the condition is true. The **`if`****…****`else`**\
