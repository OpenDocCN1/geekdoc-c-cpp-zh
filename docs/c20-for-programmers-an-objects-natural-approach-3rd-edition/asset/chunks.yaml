    Function `useStaticLocal` declares `static` variable `x` and initializes it to
    `50`. Local variables declared as `static` retain their values even when they’re
    out of scope (i.e., the function in which they’re declared is not executing).
    When line 28 in `main` calls `useStaticLocal`, the function prints its local `x`,
    increments it and prints it again before the function returns program control
    to its caller. In the next call to this function (line 31), `static` local variable
    `x` contains the value `51`. The initialization in line 50 occurs only the first
    time `useStaticLocal` is called (line 28).


    ```

    46   // useStaticLocal initializes static local variable x only the

    47   // first time the function is called; value of x is saved

    48   // between calls to this function

    49   void useStaticLocal() {

    50      static int x{50}; // initialized first time useStaticLocal is called

    51

    52      cout << "\nlocal static x is " << x << " on entering useStaticLocal"

    53         << endl;

    54      ++x;

    55      cout << "local static x is " << x << " on exiting useStaticLocal"

    56         << endl;

    57   }

    58

    ```


    ### Function `useGlobal`


    Function `useGlobal` does not declare any variables. Therefore, when it refers
    to variable `x`, the global `x` (line 10, preceding `main`) is used. When `main`
    calls `useGlobal` (line 29), the function prints the global variable `x`, multiplies
    it by 10 and prints it again before the function returns to its caller. The next
    time `main` calls `useGlobal` (line 32), the global variable has its modified
    value, `10`.


    ```

    59   // useGlobal modifies global variable x during each call

    60   void useGlobal() {

    61      cout << "\nglobal x is " << x << " on entering useGlobal" << endl;

    62      x *= 10;

    63      cout << "global x is " << x << " on exiting useGlobal" << endl;

    64   }

    ```


    ### 5.12 Inline Functions


    Implementing a program as a set of functions is good from a software engineering
    standpoint, but function calls involve execution-time overhead. C++ provides `inline
    functions` to help reduce function-call overhead. Placing `inline` before a function’s
    return type in the function definition advises the compiler to generate a copy
    of the function’s body code in every place where the function is called (when
    appropriate) to avoid a function call. This often makes the program larger. The
    compiler can ignore the `inline` qualifier. Reusable `inline` functions are typically
    placed in headers so that their definitions can be inlined in each source file
    that uses them.


    If you change an `inline` function’s definition, you must recompile any code that
    calls that function. Though compilers can inline code for which you have not explicitly
    used `inline`, the ISO’s C++ Core Guidelines indicate that you should declare
    “small and time-critical” functions `inline`. ISO also provides an extensive FAQ
    on the subtleties of using inline functions:


    ```

    https://isocpp.org/wiki/faq/inline-functions

    ```


    [14](#ch04.xhtml_ch0fn14). C++ Core Guidelines. Accessed May 11, 2020. [`https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rf-inline`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rf-inline).


    [Figure 5.8](#ch05.xhtml_fig5_8) uses `inline` function `cube` (lines 9–11) to
    calculate the volume of a cube.)


