    ### 2.4 Another C++ Program: Adding Integers


    Our next program obtains two integers by a user, computes their sum and outputs
    the result using `std::cout`. [Figure 2.4](#ch02.xhtml_fig2_4) shows the program
    and sample inputs. In the sample execution, the user’s input is in bold.


    ![Images](Images/02fig04.jpg)


    **Fig. 2.4** Addition program that displays two integers.


    #### Variable Declarations and List Initialization


    Lines 8–10


    ```

    int number1{0}; // first integer to add (0)


    int number2{0}; // second integer to add (0)


    int sum{0}; // sum of number1 and number2 (0)

    ```


    are `declarations`—`number1`, `number2` and `sum` are the names of variables.
    These declarations specify that the variables `number1`, `number2` and `sum` are
    data of type `int`, meaning that these variables will hold integer (whole number)
    values. All variables must be declared with a name and a data type. Lines 8–10
    initialize each variable to `0` by placing a value in braces (`{` and `}`) immediately
    following the variable’s name—this is known as list initialization, which was
    introduced in C++11. Although it’s not always necessary to initialize every variable,
    doing so will help you avoid many kinds of problems. Prior to C++11, lines 8–10
    would have been written as:


    ```

    int number1 = 0; // first integer to add (0)


    int number2 = 0; // second integer to add (0)


    int sum = 0; // sum of number1 and number2 (0)

    ```


    If you work with legacy C++ programs, you’re likely to encounter initialization
    statements using this older C++ coding style. In subsequent chapters, we’ll discuss
    various list initialization benefits.


    #### Declaring Multiple Variables at Once


    Several variables of the same type may be declared in one declaration—for example,
    we could have declared and initialized all three variables in one declaration
    using a comma-separated list as follows:


    ```

    int number1{0}, number2{0}, sum{0};

    ```


    But, this makes the program less readable and makes it awkward to provide comments
    that describe each variable’s purpose.


    #### Fundamental Types


    We’ll soon discuss the type `double` for specifying real numbers and the type
    `char` for specifying character data. Real numbers are numbers with decimal points,
    such as 3.4, 0.0 and –11.19. A `char` variable may hold only a single lowercase
    letter, uppercase letter, digit or special character (e.g., `$` or `*`). Types
    such as `int`, `double` and `char` are called fundamental types. Fundamental-type
    names consist of one or more keywords and must appear in all lowercase letters.
    For a complete list of C++ fundamental types and their typical ranges, see

