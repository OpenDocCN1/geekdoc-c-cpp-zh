    ## 5.6.2 参数强制类型转换（Argument Coercion）


    函数原型的一个重要特性是`参数强制类型转换`（argument coercion）——即强制将参数转换为声明中指定的适当类型。例如，程序可以使用整数参数调用函数，即使该函数原型指定了
    `double` 参数——只要这不是窄化转换，函数仍能正常工作（窄转换在第 3.8.3 节中讨论）。如果函数调用中的参数无法隐式转换为函数原型中指定的预期类型，则会发生编译错误。


    ## 5.6.3 参数提升规则与隐式转换


    参见 4。提升和转换是 C++ 标准文档第 7.3 节和 7.4 节中讨论的复杂话题。“Working Draft, Standard for Programming
    Language C.” 访问 2020 年 5 月 11 日访问[`http://open-std.org/JTC1/SC22/WG21/docs/papers/2020/n4861.pdf`](http://open-std.org/JTC1/SC22/WG21/docs/papers/2020/n4861.pdf)。


    11 有时，与函数原型中的参数类型不精确对应的参数值可以在调用函数之前由编译器转换为适当类型。这些转换按照 C++ 的`提升规则`（promotion rules）进行，该规则规定了基本类型之间允许的隐式转换。`int`
    可以转换为 `double`。`double` 也可以转换为 `int`，但这种窄化转换会截断 `double` 的小数部分——回想第 3.8.3 节，C++11
    列表初始化不允许窄化转换。请记住，`double` 变量可以存储比 `int` 变量大得多的数字，因此窄化转换中的数据丢失可能是巨大的。


    在将大整数类型转换为小整数类型（例如从 `long` 到 `short`）、从有符号转换为无符号，或从无符号转换为有符号时，值可能会发生变化。`unsigned`
    整数类型的变量可以表示从 0 到大约对应有符号整数类型正范围两倍的值。`unsigned` 类型主要用于位操作（第 22 章）。它们不应被用于确保值非负。


