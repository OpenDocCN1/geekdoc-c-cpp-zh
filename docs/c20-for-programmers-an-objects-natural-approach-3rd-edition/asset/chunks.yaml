    The `switch` statement (lines 29–50) determines which counter to increment. We
    assume that the user enters a valid grade in the range 0–100\. A grade in the
    range 90–100 represents A, 80–89 represents B, 70–79 represents C, 60–69 represents
    D and 0–59 represents F. The `switch` statement’s block contains a sequence of
    `case` labels and an optional `default` case, which can appear anywhere in the
    `switch`, but normally appears last. These are used in this example to determine
    which counter to increment based on the grade.


    11 When the flow of control reaches the `switch`, the program evaluates the controlling
    expression in the parentheses (`grade / 10`) following keyword `switch`. The program
    compares this expression’s value with each `case` label. The expression must have
    a signed or unsigned integral type—`bool`, `char`, `char16_t`, `char32_t`, `wchar_t`,
    `int`, `long` or `long long`. The expression can also use the C++11 signed or
    unsigned integral types, such as `int64_t` and `uint64_t`—see the `<cstdint>`
    header for a complete list of these type names.


    The controlling expression in line 29 performs integer division, which truncates
    the fractional part of the result. When we divide a value from 0 to 100 by 10,
    the result is always a value from 0 to 10. We use several of these values in our
    `case` labels. If the user enters the integer `85`, the controlling expression
    evaluates to 8. The `switch` compares `8` with each `case` label. If a match occurs
    (`case 8:` at line 35), that `case`’s statements execute. For `8`, line 36 increments
    `bCount`, because a grade in the 80s is a B. The `break` statement (line 37) exists
    the `switch`. In this program, we reach the end of the `while` loop, so control
    returns to the loop-continuation condition in line 24 to determine whether the
    loop should continue executing.


    The `case`s in our `switch` explicitly test for the values `10`, `9`, `8`, `7`
    and `6`. Note the cases at lines 30–31 that test for the values `9` and `10` (both
    of which represent the grade A). Listing cases consecutively in this manner with
    no statements between them enables the cases to perform the same set of statements—when
    the controlling expression evaluates to `9` or `10`, the statements in lines 32–33
    execute. The `switch` statement does not provide a mechanism for testing ranges
    of values, so every value you need to test must be listed in a separate `case`
    label. Each `case` can have multiple statements. The `switch` statement differs
    from other control statements in that it does not require braces around multiple
    statements in a `case`.


    ### `case` without a `break` Statement


    Without `break` statements, each time a match occurs in the `switch`, the statements
    for that case and subsequent cases execute until a `break` statement or the end
    of the `switch` is encountered. This is often referred to as “falling through”
    to the statements in subsequent `case`s. This feature is perfect for writing a
    concise program that displays the iterative song “The Twelve Days of Christmas.”
    As an exercise, you might write the program, then use one of the many free, open-source
    text-to-speech programs to speak the song. You might also tie your program to
    a free, open-source MIDI (“Musical Instrument Digital Interface”) program to create
    a singing version of your program accompanied by music.


    ### C++17: `[[fallthrough]]` Attribute


    17 Forgetting a `break` statement when one is needed is a logic error. To call
    your attention to this possible problem, many compilers issuing a warning when
    a `case` does not contain a `break` statement. For instances in which “falling
    through” is the desired behavior, C++17 introduced the `[[fallthrough]]` attribute.
    This enables you to tell the compiler when “falling through” is correct so that
    warning will not be generated.


    In [Fig. 4.6], for `case 9:` (line 30), we want the `switch` to fall through (without
    a compiler warning) and execute the statements for `case 10:`—this allows both
    `case`s to execute the same statements. We can indicate the desired behavior by
    writing line 30 as:


    ```

    case 9: [[fallthrough]];

    ```


    ### The `default` Case


    If no match occurs between the controlling expression’s value and any of the `case`
    labels, the `default` case (lines 47–49) executes. We use the `default` case in
    this example to process all controlling-expression values that are less than `6`—that
    is, all failing grades. If no match occurs and the `switch` does not contain a
    `default` case, program control simply continues with the first statement after
    the `switch`. In a `switch`, it’s good practice to test for all possible values
    of the controlling expression.


    ### Displaying the Grade Report


    Lines 54–73 output a report based on the grades entered. Line 60 determines whether
    the user entered at least one grade—this helps us dividing by zero. If so, line
    62 calculates the average of the grades. Lines 65–69 then output the total of
    all the grades, the class average and the number of students who received each
    letter grade. If no grades were entered, line 72 outputs an appropriate message.
    The output in 4.6 shows a sample grade report based on 10 grades.


    ### `switch` Statement UML Activity Diagram


    The following is the UML activity diagram for the general `switch` statement:


    ![Images](Images/04unfig04.jpg)


    Most `switch` statements use a `break` in each `case` to terminate the `switch`
    after processing the `case`. The diagram emphasizes this by including `break`
    statements and showing that the `break` at the end of a `case` causes control
    to exit the `switch` immediately.


    The `break` statement is not required for the `switch`’s last case (or the optional
    `default` case, when it appears last), because execution continues with the next
    statement after the `switch`. Provide a `default` case in every `switch` statement
    to focus you on processing conditions. Notes on `case`s


    Each `case` in a `switch` statement must contain a constant integral expression—that
    is, any combination of integer constants that evaluates to a constant integer
    value. An integer constant is simply an integer value. You also can use `enum`
    constants (introduced in Section 5.8) and character constants—specific characters
    in single quotes, such as `''A''`, `''7''` or `''$''`, which represent the integer
    values of characters. (Appendix B shows the integer values of the characters in
    the ASCII character set, which is a subset of the Unicode character set.)


    The expression in each `case` also can be a constant variable—a variable containing
    a value that does not change for the entire program. Such a variable is declared
    with `const` (discussed in Chapter 5).


    In Chapter 13, Object-Oriented Programming: Polymorphism, we present a more elegant
    way to implement `switch` logic. We use a technique called polymorphism to create
    programs that are often clearer, easier to maintain and easier to extend than
    programs using `switch` logic.

