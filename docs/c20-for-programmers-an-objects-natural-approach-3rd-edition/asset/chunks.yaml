    passes += 1;


    failures += 1;


    studentCounter += 1;

    ```


    with prefix increment operators as


    ```

    ++passes;


    ++failures;


    ++studentCounter;

    ```


    or with postfix increment operators as


    ```

    passes++;


    failures++;


    studentCounter++;

    ```


    When incrementing or decrementing a variable in a statement by itself, the prefix
    increment and postfix increment forms have the same effect, and the prefix decrement
    and postfix decrement forms have the same effect. Only when a variable appears
    in the context of a larger expression does preincrementing or postincrementing
    the variable have a different effect (and similarly for predecrementing or postdecrementing).


    Attempting to use the increment or decrement operator on an expression other than
    one to which a value can be assigned is a syntax error. For example, writing `++(x
    + 1)` is a syntax error, because `(x + 1)` is not a variable.


