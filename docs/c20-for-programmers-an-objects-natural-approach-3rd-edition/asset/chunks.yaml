    提升规则也适用于包含两个或多个数据类型值的表达式——即`混合类型表达式`（mixed-type expressions）。混合类型表达式中每个值的类型都被提升为表达式的“最高”类型（实际上创建并使用了了每个值的临时副本——原始值保持不变）。下表列出了从“最高类型”到“最低类型”的算术数据类型。


