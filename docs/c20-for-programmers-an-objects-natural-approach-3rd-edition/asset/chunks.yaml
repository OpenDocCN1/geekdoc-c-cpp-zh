    The range of values produced directly by the function `rand` often is different
    than what a specific application requires. For example, a program that simulates
    coin tossing might need only 0 for “heads” and 1 for “tails.” A program that simulates
    rolling a six-sided die would require random integers in the range 1 to 6. A program
    that randomly predicts the next type of spaceship (out of four possibilities)
    that will fly across the horizon in a video game might require random integers
    in the range 1 through 4.


    ### 5.8.1 Rolling a Six-Sided Die


    To demonstrate `rand`, [Fig. 5.2](#ch05.xhtml_fig5_2) simulates ten rolls of a
    six-sided die and displays the value of each roll. The function prototype for
    the `rand` function is in `<cstdlib>`. To produce integers in the range 0 to 5,
    we use the remainder operator (`%`) with `rand` as follows:


    ```

    rand() % 6

    ```


    This is called `scaling`. The number 6 is called the `scaling factor`. We then
    `shift` the range of numbers produced by adding 1 to our previous result. [Figure
    5.2](#ch05.xhtml_fig5_2) confirms that the results are in the range 1 to 6. If
    you execute this program more than once, you’ll see that it produces the same
    “random” values each time. We’ll show how to fix this in [Figure 5.4](#ch05.xhtml_fig5_4).


    ![Images](Images/05fig02.jpg)![Images](Images/05fig02a.jpg)


    **Fig. 5.2** Shifted, scaled integers produced by `1 + rand() % 6`. (Part 1 of
    2.)


