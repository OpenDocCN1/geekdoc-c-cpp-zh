    We then present C++’s scope rules, which determine where identifiers can be referenced
    in a program. We discuss features that help improve program performance—inline
    functions that can eliminate the overhead of a function call and reference parameters
    that can be used to pass large data items to functions efficiently.


    Many of the applications you develop will have more than one function of the same
    name. This technique, called function overloading, is used to implement functions
    that perform similar tasks for arguments of different types or different numbers
    of arguments. We consider function templates—a mechanism for concisely defining
    a family of overloaded functions. We introduce recursive functions that call themselves,
    either directly, or indirectly through another function.


    We present C++17’s `[[nodiscard]]` attribute for indicating that a function’s
    return value should not be ignored. This helps compilers warn you when the return
    value is not used in your program. We also discuss C++20’s `[[nodiscard]]` enhancement
    that allows you to specify a reason why the return value should not be ignored.
