    decimal point (e.g., 92.37). `setprecision` is a **parameterized stream manipulator**
    because it requires an argument (in this case, `2`) to perform its task. Programs
    that use parameterized stream manipulators must include the header **`<iomanip>`**.
    The manipulator `endl` (lines 38 and 41) from `<iostream>` is a **nonparameterized
    stream manipulator** because it does not require an argument.


    ##### `fixed` Nonparameterized Stream Manipulator


    The stream manipulator **`fixed`** (line 37) indicates that floating-point values
    should be output in **fixed-point format**. This is as opposed to **scientific
    notation**^([4](#ch02.xhtml_ch0fn4)), which displays a number between the values
    of 1.0 and 10.0, multiplied by a power of 10\. So, in scientific notation, the
    value 3,100.0 is displayed as `3.1e+03` (that is, 3.1 × 10³). This format is useful
    for displaying very large or very small values.


    [4](#ch02.xhtml_rch0fn4). Formatting using scientific notation is discussed further
    in [Chapter 15](#ch15.xhtml_ch15).


    Fixed-point formatting forces a floating-point number to display without scientific
    notation. Fixed-point formatting also forces the decimal point and trailing zeros
    to print, even if the value is a whole-number amount, such as 88.00\. Without
    the fixed-point formatting option, 88.00 prints as 88 without the trailing zeros
    and decimal point.


    The stream manipulators `setprecision` and `fixed` perform **sticky settings**.
    Once they’re specified, all floating-point values formatted in your program will
    use those settings until you change them. [Chapter 15](#ch15.xhtml_ch15) shows
    how to capture the stream format settings before applying sticky settings, so
    you can restore the original format settings later.


    ##### Rounding Floating-Point Numbers


    When the stream manipulators `fixed` and `setprecision` are used, the printed
    value is **rounded** to the number of decimal positions specified by the current
    precision. The value in memory remains unaltered. For a precision of `2`, the
    values 87.946 and 67.543 are rounded to 87.95 and 67.54, respectively.^([5](#ch03.xhtml_ch0fn5))


    [5](#ch03.xhtml_rch0fn5). In [Fig. 3.2](#ch03.xhtml_fig3_2), if you do not specify
    `setprecision` and `fixed`, C++ uses four digits of precision by default. If you
    specify only `setprecision`, C++ uses six digits of precision.


    Together, lines 37 and 38 of [Fig. 3.2](#ch03.xhtml_fig3_2) output the class average
    rounded to the nearest hundredth and with exactly two digits to the right of the
    decimal point. The three grades entered during the execution of the program in
    [Fig. 3.2](#ch03.xhtml_fig3_2) total 257, which yields the average 85.666… and
    displays the rounded value 85.67.


