    ### 第一次投掷的胜负


    后续 `switch` 决定玩家在第一次投掷中胜或输：


    ```cpp

    21    // 根据第一次投掷的结果决定状态


    22    switch (const int sumDice{rollDice()}) {


    23       case 7: // 掷出 7 赢


    24       case 11: // 掷出 11 赢


    25          gameStatus = Status::won;

    26          break;

    27       case 2: // 掷出 2 输


    28       case 3: // 掷出 3 输


    29       case 12: // 掷出 12 输

    30          gameStatus = Status::lost;

    31          break;

    32       default: // 其他点数成为点数


    33          myPoint = sumDice;

    34          gameStatus = Status::keepRolling;

    35    }

    36

    ```


    ### 继续投掷


    在第一次投掷后，如果 `gameStatus` 为 `Status::keepRolling`，执行以下 `while` 语句：


    ```cpp

    38     // 游戏未完成


    39     while (Status::keepRolling == gameStatus) { // 未胜负


    40        // 掷骰子并决定状态


    41        if (const int sumDice{rollDice()}; sumDice == myPoint) { // 命中点


    42           gameStatus = Status::won;

    43        }

    44        else {


    45           if (sumDice == 7) { // 在命中点数前掷出 7 输


    46              gameStatus = Status::lost;

    47           }

    48        }

    49     }

    ```


    ### 显示玩家的胜负


    当上述循环结束，程序执行以下 `if…else` 语句，如果 `gameStatus` 为 `Status::won` 则打印 `"Player wins"`，如果
    `gameStatus` 为 `Status::lost` 则打印 `"Player loses"`：


    ```cpp

    51      // 显示胜负消息


    52      if (Status::won == gameStatus) {


    53         cout << "Player wins" << endl;


    54      }


    55      else {


    56         cout << "Player loses" << endl;


    57      }


    58   }

    ```


    ### `rollDice` 函数


    为了投掷骰子，函数 `rollDice` 使用之前显示的骰子计算初始化变量 `die1` 和 `die2`，然后计算它们的 `sum`。第 67–68 行显示
    `die1` 的值、`die2` 的值和 `sum` 的值，最后第 69 行返回 `sum`。


    '
