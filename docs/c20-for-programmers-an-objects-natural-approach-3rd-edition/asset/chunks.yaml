    ### 3.1 Introduction


    In this chapter and the next, we present the theory and principles of structured
    programming. The concepts presented here are crucial in building classes and manipulating
    objects. We discuss C++’s `if` statement in additional detail and introduce the
    `if…else`


    and `while` statements. We also introduce the compound assignment operators and
    the increment and decrement operators.


    20 We discuss why C++’s fundamental types are not portable. We continue our object
    natural approach with a case study on arbitrary sized integers that support values
    beyond the ranges of integers supported by computer hardware.


    We begin introducing C++20’s new text-formatting capabilities, which are based
    on those in Python, Microsoft’s .NET languages (like C# and Visual Basic) and
    Rust.^([1](#ch01.xhtml_ch0fn1)) The C++20 capabilities are more concise and more
    powerful than those in earlier C++ versions. In [Chapter 14](#ch14.xhtml_ch14),
    you’ll see that these new capabilities are extensible, so you can use them to
    format objects of custom class types.


    [1](#ch01.xhtml_rch0fn1). [`http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p0645r10.html`](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p0645r10.html).


