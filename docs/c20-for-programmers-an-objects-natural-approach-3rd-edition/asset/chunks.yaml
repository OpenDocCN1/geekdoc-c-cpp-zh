    `switch` 语句（第 29–50 行）决定递增哪个计数器。我们假设用户输入了 0–100 范围内的有效成绩。90–100 范围内的成绩代表 A，80–89
    代表 B，70–79 代表 C，60–69 代表 D，0–59 代表 F。`switch` 语句的块包含一系列 `case` 标签和一个可选的 `default`
    分支，该 `default` 分支可以出现在 `switch` 的任何位置，但通常出现在最后。在例例中，这些标签被用于根据成绩确定递增哪个计数器。


    11 当控制流到达 `switch` 时，程序会评估关键字 `switch` 之后括号中的控制表达式（`grade / 10`）。程序将此表达式的值与每个
    `case` 标签进行比较。该表达式必须具有有符号或无符号的整数类型——`bool`、`char`、`char16_t`、`char32_t`、`wchar_t`、`int`、`long`
    或 `long long`。该表达式也可以使用 C++11 有符号或无符号整数类型，如 `int64_t` 和 `uint64_t`——请参见 `<cstdint>`
    头文件获取这些类型的完整列表。


    第 29 行中的控制表达式执行整数除法，会截断结果的小数部分。我们将 0 到 100 之间的值除以 10 时，结果始终是 0 到 10 之间的值。我们在 `case`
    标签中使用了这些值。如果用户输入整数 `85`，控制表达式的值为 8。`switch` 将 `8` 与每个 `case` 标签进行比较。如果发生匹配（第 35
    行的 `case 8:`），则执行该 `case` 的语句。对于 `8`，第 36 行递增了 `bCount`，因为 80 多分的成绩是 B。`break`
    语句（第 37 行）退出 `switch`。在该程序中，我们到达 `while` 循环的结束，因此控制返回到第 24 行的循环继续条件，以确定循环是否应该继续执行。


    我们 `switch` 中的 `case` 显式地测试值 `10`、`9`、`8`、`7` 和 `6`。注意第 30–31 行测试值 `9` 和 `10`
    的情况（两者都代表成绩 A）。以这种方式连续列出 case 且之间没有语句，可以使这些 case 执行同一组语句——当控制表达式求值为 `9` 或 `10`
    时，执行第 32–33 行的语句。`switch` 语句没有提供测试值范围的机制，因此你需要测试的每个值都必须在单独的 `case` 标签中列出。每个 `case`
    可以有多条语句。`switch` 语句与其他控制语句的区别在于，它不需要在 `case` 中的多个语句周围使用大括号。


    ### 无 `break` 语句的 `case`


    在没有 `break` 语句的情况下，每当 `switch` 中发生匹配时，该 case 以及后续 case 的语句都会执行，直到遇到 `break` 语句或
    `switch` 结束。这通常被称为“贯穿（falling through）”到后续 `case` 中的语句。这一特性对于编写一个显示迭代歌曲《圣诞的十二天》的简洁程序非常完美。作为一个练习，你可以编写该程序，然后使用许多免费、开源的文本转语音程序来朗读这首歌。你还可以将你的程序与免费、开源的
    MIDI（乐器数字接口）程序绑定，创建一个带有音乐的程序歌唱版本。


    ### C++17: `[[fallthrough]]` 属性


    17 在需要时忘记写 `break` 语句是一个逻辑错误。为了引起你注意这个可能的问题，许多编译器在 `case` 不包含 `break` 语句时会发出警告。对于那些“贯穿”是预期行为的情况，C++17
    引入了 `[[fallthrough]]` 属性。这允许你告诉编译器何时“贯穿”是正确的，这样就不会生成警告。


    在 [图 4.6] 中，对于 `case 9:`（第 30 行），我们希望 `switch` 发生贯穿（且不产生编译器警告）并执行 `case 10:` 的语句——这允许两个
    `case` 都执行相同的语句。我们可以通过将第 30 行写为来指示期望的行为：


    ```

    case 9: [[fallthrough]];

    ```


    ### `default` 分支


    如果控制表达式的值与任何 `case` 标签之间都没有匹配，则执行 `default` 分支（第 47–49 行）。我们在本例中使用 `default` 分支来处理所有小于
    `6` 的控制表达式值——即所有不及格的成绩。如果没有发生匹配且 `switch` 不包含 `default` 分支，程序控制将继续执行 `switch`
    之后的第一条语句。在 `switch` 中，测试控制表达式的所有可能值是一个良好的习惯。


    ### 显示成绩单


    第 54–73 行根据输入的成绩输出报告。第 60 行确定用户是否输入了至少一个成绩——这有助于我们避免除零。如果是，第 62 行计算成绩的平均值。第 65–69
    行输出所有成绩的总和、班级平均分以及获得每个字母等级的学生数。如果没有输入成绩，第 72 行输出适当的消息。4.6 中的输出显示了基于成绩的示例成绩单。


