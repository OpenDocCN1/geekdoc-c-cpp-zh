  trans: "\n\n该语句还包含两个简单条件。条件 `semesterAverage >= 90` 决定了学生是否因整个学期的表现良好而获得课程 A 等。条件\
    \ `finalExam >= 90` 决定了学生是否因期末考试表现优而获得课程 A 等。随后，`if` 语句考虑组合条件：\n\n```\n(semesterAverage\
    \ >= 90) || (finalExam >= 90)\n```\n\n如果这两个简单条件中任一个或两个都为真，则授予学生 A 等。只有当两个简单条件都为假时，才不打印消息\
    \ `\"Student grade is A\"`。以下是逻辑或运算符（||`）的真值表：\n\n![Images](img/f0128-02.jpg)\n\
    \n运算符 `&&` 的优先级高于运算符 `||`。两个运算符都从左到右分组。\n\n#### 4.11.3 短路求值\n\n包含 `&&` 或 `||`\
    \ 运算符的表达式部分只求值，直到确定条件是真是假为止。因此，表达式\n\n```\n(gender == FEMALE) && (age >= 65)\n\
    ```\n\n如果 `gender` 不等于 `FEMALE`（即整个表达式为假），则立即停止评估；如果 `gender` 等于 `FEMALE`，则继续（即如果条件\
    \ `age >= 65` 为真，则整个表达式可能为真）。这种逻辑与和逻辑或表达式的特性被称为 `短路求值`。\n\n在运行运算符 `&&` 的表达式中，某个条件——我们称之为依赖条件——可能需要另一个条件为真，该依赖条件的求值才有意义。在这种情况下，依赖条件应该放在\
    \ `&&` 运算符之后以防止错误。考虑表达式 `(i != 0) && (10 / i == 2)`。依赖条件 `(10 / i == 2)` 必须出现在\
    \ `&&` 运算符之后，以防止除以零的发生。\n\n#### 4.11.4 逻辑取反 (`!`) 运算符\n\n`!` (`逻辑取反`，也称为 `逻辑非`\
    \ 或 `逻辑补码`）运算符“反转”条件的含义。与组合两个条件的二元运算符 `&&` 和 `||` 不同，逻辑取反运算符是一个一元运算符，只有一个条件作为操作数。为了仅在条件为假时执行代码，将逻辑取反运算符放在原始条件*之前*，如程序段所示：\n\
    \n```\nif (!(grade == sentinelValue)) {\n\n   cout << \"The next grade is \" <<\
    \ grade << \"\\n\";\n\n}\n```\n\n只有当 `grade` *不*等于 `sentinelValue` 时，才会执行体语句。条件\
    \ `grade == sentinelValue` 外围的括号是必要的，因为逻辑取反运算符的优先级高于相等运算符。\n\n在大多数情况下，可以通过使用适当的关系运算符或相等运算符不同的表达条件来避免使用逻辑取反。例如，前述语句也可以写如下所示：\n\
    \n```\nif (grade != sentinelValue) {\n\n   cout << \"The next grade is \" << grade\
    \ << \"\\n\";\n\n}\n```\n\n这种灵活性可以帮助你更方便地表达条件。以下是逻辑取反运算符的真值表：\n\n![Images](img/f0129-01.jpg)\n\
    \n#### 4.11.5 示例：使用逻辑运算符产生真值表\n\n图 4.10 使用逻辑运算符生成本节讨论的真值表。输出显示了每个求值的表达式及其 `bool`\
    \ 结果。默认情况下，`bool` 值 `true` 和 `false` 被 `cout` 和流插入运算符分别显示为 `1` 和 `0`。粘性`流操纵符`\
    \ `boolalpha`（第 8 行）指定每个 `bool` 表达式的值应显示为单词“true”或“false”。第 8–12 行、15–19 行和 22–24\
    \ 行分别产生 `&&`、`||` 和 `!` 的真值表。\n\n![Images](img/04fig10.jpg)![Images](img/04fig10a.jpg)\n\
    \n**图 4.10** 逻辑运算符。（部分部分的部分。）\n\n##### 截至为止介绍的运算符的优先级和分组\n\n下表显示了目前为止介绍的 C++ 运算符的优先级和分组——按优先级从高到低排列：\n\
    \n![Images](img/f0131-01.jpg)\n\n#### 4.12 混淆相等 (`==`) 和赋值 (`=`) 运算符\n\nC++ 程序员无论经验多么丰富，都往往会频繁犯的一个错误，以至于我们认为需要单独的章节。那个错误就是不小心交换了运算符\
    \ `==`（相等）和 `=`（赋值）。这种错误之所以破坏性大，是因为它通常不会导致语法错误。带有这些错误的语句往往可以正确编译并运行完成，通常通过运行时逻辑错误产生错误的结果。某些编译器在预期为\
    \ `==` 的语文中使用 `=` 时会发出警告。\n\nC++ 的两个方面导致了这些问题。其一是，任何产生值的表达式都可以用于任何控制语句的决策部分。如果表达式的值为\
    \ 0，则被视为 `false`。如果值非零，则被视为 `true`。其二是赋值会产生一个值——即赋值给左侧变量的值。\n\n##### 左值 (lvalues)\
    \ 和 右值 (rvalues)\n\n你可以通过一个简单的技巧防止上述问题。首先，了解什么位于赋值运算符的左侧是有用的。变量名被称为 `lvalues`（左值），因为它们位于赋值运算符的左侧。字面量被称为\
    \ `rvalues`（右值），因为它们位于赋值运算符的右侧。*左值* 也可以作为 *右值* 位于赋值运算符的右侧，但反之则不然。\n\n程序员通常编写如\
    \ `x == 7` 的条件，将变量名（左值）放在左侧，将字面量（右值）放在右侧。将字面量放在左侧（如 `7 == x`，在语法上是正确的）可以让编译器在你不小心替换\
    \ `==` 运算符时报错。\n\n##### 用 == 代替 =\n\n另一种同样糟糕的情况。假设你想用简单的语句给变量赋值，例如\n\n```\nx =\
    \ 1;\n```\n\n但写成了\n\n```\nx == 1;\n```\n\n在这里，这不是语法错误。相反，编译器仅仅评估该表达式。如果 `x` 等于\
    \ `1`，条件为真，表达式求值为非零（真值）。如果 `x` 不等于 `1`，条件为假，表达式求值为 0。无论表达式的值如何，都没有赋值，因此值丢失了。`x`\
    \ 的值保持不变，可能导致执行时逻辑错误。使用运算符 `==` 进行赋值以及使用运算符 `=` 进行相等比较都是逻辑错误。使用你的文本编辑器搜索程序中所有\
    \ `=` 的出现处，并检查每个地方是否都有正确的赋值、关系或相等运算符。\n\n### 20 4.13 C++20 特性模拟：`[[likely]]` 和\
    \ `[[unlikely]]` 属性\n\n"
- fmt: "\n![Images](Images/common01.jpg) PERF Today’s compilers use sophisticated\
    \ optimization techniques to tune your code’s performance. C++20 introduces the\
    \ attributes `[[likely]]` and `[[unlikely]]` that enable you to provide additional\
    \ hints to help compilers optimize `if`, `if…else` and `switch` statement code\
    \ for better performance. These attributes indicate paths of execution that are\
    \ likely or unlikely to be taken. Many of today’s compilers already provide mechanisms\
    \ like this, so `[[likely]]` and `[[unlikely]]` standardize these features across\
    \ compilers.\n\n- [3]. “Optimizing Compiler.” Wikipedia. Wikimedia Foundation,\
    \ April 7, 2020. [https://en.wikipedia.org/wiki/Optimizing_compiler#Specific_techniques](https://en.wikipedia.org/wiki/Optimizing_compiler#Specific_techniques).\n\
    - [4]. Note to reviewers: At the time of this writing, these attributes were not\
    \ implemented by our preferred compilers. We searched for insights as to why and\
    \ how you’d use this feature to produce better optimized code. Even though the\
    \ standard is about to be accepted in May, there is little information at this\
    \ point other than the proposal document “Attributes for Likely and Unlikely Statements\
    \ (Revision 2)” ([https://wg21.link/p0479r2](https://wg21.link/p0479r2)). Section\
    \ 3, Motivation and Scope, suggests who should use these features and what they\
    \ should be used for.\n- [5]. Sutter, Herb. “Trip Report: Winter ISO C Standards\
    \ Meeting (Jacksonville).” Sutter's Mill, April 3, 2018. [https://herbsutter.com/2018/04/](https://herbsutter.com/2018/04/).\
    \ Herb Sutter is the Convener of the ISO C++ committee and a Software Architect\
    \ at Microsoft.\n\nTo use these attributes, place `[[likely]]` or `[[unlikely]]`\
    \ before the body of an `if` or `else`, as in\n\n```\nif (condition) [[likely]]\
    \ {\n\n   // statements\n\n}\n\nelse {\n\n   // statements\n}\n```\n\nor before\
    \ a `case` label in a `switch`, as in\n\n```cpp\nswitch (controllingExpression)\
    \ {\n\n   case 7:\n\n      // statements\n\n      break;\n\n   [[likely]] case\
    \ 11:\n\n      // statements\n\n      break;\n\n   default:\n\n      // statements\n\
    \n      break;\n}\n```\n\n![Images](Images/common01.jpg) PERF There are subtle\
    \ issues when using these attributes. Using too many `[[likely]]` and `[[unlikely]]`\
    \ attributes in your code could actually reduce performance. The document that\
    \ proposed adding these to the language says for each, “This attribute is intended\
    \ for specialized optimizations which are implementation specific. General usage\
    \ of this attribute is discouraged.” For a discussion of other subtleties, see\
    \ the proposal document at:\n\n```\nhttps://wg21.link/p0479r2\n```\n\n- [6]. Section\
    \ 9.12.6, “Working Draft, Standard for Programming Language.” ISO/IEC, April 3,\
    \ 2020. [https://github.com/cplusplus/draft/download/n4861/n4861.pdf](https://github.com/cplusplus/draft/download/n4861/n4861.pdf).\n\
    - [7]. “Attributes for Likely and Unlikely Statements (Revision 2).” [https://wg21.link/p0479r2](https://wg21.link/p0479r2).\
    \ Section VIII, Technical Specifications.\n\nIf’re working on systems with strict\
    \ performance requirements you may want to investigate these attributes.\n\n###\
    \ 4.14 Natural Case Study: Using the `miniz-cpp` Library to Write and Read ZIP\
    \ files\n\n![Images](Images/common01.jpg) PERF Data compression reduces the size\
    \ of data—typically to save memory, to save secondary storage space or to transmit\
    \ data over the Internet. Lossless data-compression algorithms compress data in\
    \ a manner that does not lose information—the data can be uncompressed and restored\
    \ to its original form. Lossy data-compression algorithms permanently discard\
    \ information. Such algorithms are often used to compress audio and video. For\
    \ example, when you watch video online, the video is often compressed using a\
    \ lossy algorithm to minimize the total bytes over the Internet. Though some of\
    \ the video data is discarded, a lossy algorithm compresses the data in a manner\
    \ that most people do not notice the removed information as they watch the video.\
    \ The video quality is still “pretty good.”\n\n#### ZIP Files\n\nYou’ve probably\
    \ used ZIP files—if not, you almost certainly will. The ZIP file format is a lossless\
    \ compression format that has been in use for over 30 years. Lossless compression\
    \ algorithms use various techniques for compressing data—such as:\n\n* replacing\
    \ duplicate patterns, such as text strings in a document or pixels in an image,\
    \ with references to a single copy,\n* replacing a group of image pixels that\
    \ have the same color with one pixel of that color and a count.\n\n- [9]. “Zip\
    \ (File Format).” Wikipedia. Wikimedia Foundation, April 23, 2020. [https://en.wikipedia.org/wiki/Zip_(file_format)](https://en.wikipedia.org/wiki/Zip_(file_format)).\n\
    - [10]. “Data Compression.” Wikipedia. Wikimedia Foundation, April 16, 2020. [https://en.wikipedia.org/wiki/Data_compression#Lossless](https://en.wikipedia.org/wiki/Data_compression#Lossless).\n\
    \nZIP is used to compress files and directories into a single file, known as an\
    \ archive file. ZIP files are often used to distribute software faster over the\
    \ Internet. Today’s operating systems typically have built-in support for creating\
    \ ZIP files and extracting their contents.\n\n#### Open-Source `miniz-cpp` Library\n\
    \nMany open-source libraries support programmatic manipulation of ZIP archive\
    \ files and other archive-file formats, such as TAR, RAR and 7-Zip. Figure 4.11\
    \ continues our objects natural presentation by using objects of the open-source\
    \ `miniz-cpp` library’s class `zip_file` to create and read ZIP files. The `miniz-cpp`\
    \ library is a “header-only library”—it’s defined in header file `zip_file.hpp`\
    \ that you can simply include in your project (line 5). We provide the library\
    \ in the `examples` folder’s `libraries/minizcpp` subfolder. Header files are\
    \ discussed in depth in Chapter 10.\n\n- [11]. “List of Archive Formats.” Wikipedia.\
    \ Wikimedia Foundation, March 19, 2020. [https://en.wikipedia.org/wiki/List_of_archive_formats](https://en.wikipedia.org/wiki/List_of_archive_formats).\n\
    - [12]. [https://github.com/tfussell/miniz-cpp](https://github.com/tfussell/miniz-cpp).\n\
    - [13]. The miniz-cpp library provides nearly identical capabilities to the Python\
    \ standard library’s `zipfile` module ([https://docs.python.org/3/library/zipfile.html](https://docs.python.org/3/library/zipfile.html)),\
    \ so the miniz-cpp GitHub repository refers you to that documentation page for\
    \ the list of features.\n\n![Images](Images/04fig11.jpg)\n\n**Fig. 4.11** Using\
    \ the miniz-cpp header-only library to write and read a ZIP file.\n\n##### Inputting\
    \ a Line of Text from the User with `getline`\n\nThe `getline` function call reads\
    \ all the characters you type until you press Enter:\n\n```cpp\n 8 int main()\
    \ {\n\n 9    cout << \"Enter a ZIP file name: \";\n\n10    string zipFileName;\n\
    \n11    getline(cin, zipFileName); // inputs a line of text\n\n12\n```\n\n```\n\
    Enter a ZIP file name: c:\\users\\useraccount\\Documents\\test.zip\n```\n\nHere\
    \ we use `getline` to read from the user the location and name of a file, and\
    \ store it in the `string` variable `zipFileName`. Like class `string`, `getline`\
    \ requires the `<string>` header and belongs to namespace `std`.\n\n##### Creating\
    \ Sample Content to Write into Individual Files in the ZIP File\n"
