  trans: "\n\n活动图顶部的 `solid circle` 代表 `initial state`（初始状态）——即程序执行所建模动作之前的工作流起点。图表底部的\
    \ `solid circle surrounded by a hollow circle` 代表 `final state`（结束状态）——即程序执行完其动作后工作流的结束。\n\
    \n序列结构活动图还包括右上角折叠的矩形。这些是 UML `notes`（注释，类似于 `C++` 中的注释）——用于描述图中符号用途的解释性备注。`dotted\
    \ line`（虚线）将每个注释与其所描述的元素连接起来。我们在这里使用 UML `notes` 来说明图表与每个动作状态对应的 C++ 代码之间的关系。活动图通常不显示\
    \ C++ 代码。\n\n### 3.2.2 选择语句\n\nC++ 有三种类型的 `selection statements`（选择语句）。`if` 语句在条件为真时执行（选择）一个动作（或一组动作），在条件为假时则跳过它。`if…else`\
    \ 语句在条件为真时执行一个动作（或一组动作），在条件为假时执行另一个动作（或一组动作）。`switch` 语句（第 4 章）根据表达式的值执行多个不同动作（或一组动作）中的一种。\n\
    \n`if` 语句被称为 `single-selection statement`（单分支选择语句），因为它选择或忽略单个动作（或一组动作）。`if…else`\
    \ 语句被称为 `double-selection statement`（双分支选择语句），因为它在两个不同的动作（或一组动作）之间进行选择。`switch`\
    \ 语句被称为 `multiple-selection statement`（多分支选择语句），因为它在许多个不同的动作（或一组动作）中进行选择。\n\n\
    ### 3.2.3 迭代语句\n\nC++ 提供了四种 `iteration statements`（迭代语句——也称为 `repetition statements`\
    \ 重复语句或 `looping statements` 循环语句），用于在 `loop-continuation condition`（循环条件）保持真时重复执行语句。迭代语句分别是\
    \ `while`、`do`…`while`、`for` 和基于范围 `for`。`while` 和 `for` 语句执行其体内的动作（或一组动作）零次或多次。如果循环条件初始为假，则不执行该动作（或一组动作）。`do`…`while`\
    \ 语句执行其体内的动作（或一组动作）一次或多次。第 4 章 介绍了 `do`…`while` 和 `for` 语句。第 6 章 介绍了基于范围 `for`\
    \ 语句。\n\n#### 关键字\n\n`if`、`else`、`switch`、`while`、`do` 和 `for` 的每一个单词都是 C++ 关键字。关键字不能作为标识符（如变量名），且必须全小写字母。下表显示\
    \ C++ 关键字的完整列表：\n\n![Images](img/f0075-01.jpg)\n\n#### 其他特殊标识符\n\nC++20 标准指出不要在代码中使用以下标识符，因为它们在某些范围内具有特殊含义，或者可能是未来成为关键字的标识符：\n\
    \n- 具有特殊含义的非关键字标识符——`final`、`import`、`module`、`override`、`transaction_safe`\n\
    - 实验性关键字——`atomic`、`commit`、`synchronized`。\n\n### 3.2.4 控制语句总结\n\nC++ 有三种控制结构：选择、迭代和分支。选择结构允许程序在不同路径之间进行选择。迭代结构允许程序重复一系列语句。分支结构允许程序跳转到代码的另一部分。\n\
    \n`if` 语句是 `single-selection statement`，因为它选择或忽略单个动作（或一组动作）。`if…else` 语句被称为 `double-selection\
    \ statement`，因为它在两个不同的动作（或一组动作）之间进行选择。`switch` 语句被称为 `multiple-selection statement`，因为它在许多个不同的动作（或一组动作）中进行选择。\n\
    \n迭代语句是 `while`、`do`…`while`、`for` 和基于范围 `for`。`while` 和 `for` 语句执行其体内的动作（或一组动作）零次或多次。如果循环条件初始为假，则不执行该动作（或一组动作）。`do`…`while`\
    \ 语句执行其体内的动作（或一组动作）一次或多次。\n\n### 3.3 `if` 单选择语句\n\n`if` 单分支选择语句仅在条件为真时执行指定的动作。例如，C++\
    \ 语句\n\n```cpp\nif (grade >= 60) {\n   cout << \"Passed\";\n}\n```\n\n判断 `grade\
    \ >= 60` 是否为真。如果是，则打印 `\"Passed\"`，然后按顺序执行下一条语句。如果条件为假，则忽略输出语句。\n\n#### `bool`\
    \ 数据类型\n\n在早期的 C 版本中使用整数表示布尔值，C++ 提供了 `bool` 类型用于布尔变量，它只能存储 `true` 和 `false` 值。任何求值为零的表达式都被视为假，非零值被视为真。\n\
    \n#### `if` 语句的 UML 活动图\n\n下图说明了单分支选择的 `if` 语句：\n\n![Images](img/03unfig02.jpg)\n\
    \n该图包含活动图中最重要的符号——菱形，即 `decision symbol`（决策符号），它表示需要做出决策。工作流根据符号 `guard conditions`（保护条件）决定的路径继续，这些条件可以是真也可以是假。从决策符号发出的每个箭头都有一个保护条件（在方括号内）。如果保护条件为真，工作流进入箭头指向的动作状态。图显示，如果分数大于或等于\
    \ 60（即条件为真），程序打印“Passed”，然后转换到活动的结束状态。如果分数小于 60（即条件为假），程序直接转换到结束状态而不显示任何消息。\n\n\
    ### 3.4 `if…else` 双选择语句\n\n`if` 单分支选择语句仅在条件为真时执行指定的动作。`if…else` 双分支选择语句允许你指定条件为真时执行的动作以及条件为假时执行的另一个动作。例如，C++\
    \ 语句\n\n```cpp\nif (grade >= 60) {\n   cout << \"Passed\";\n}\nelse {\n   cout\
    \ << \"Failed\";\n}\n```\n\n如果 `grade >= 60`，则打印 `\"Passed\"`；如果小于 60，则打印 `\"\
    Failed\"`。在任何情况下，打印完成后，都会按顺序执行下一条语句。\n\n`else` 的体也进行了缩进。无论选择何种缩进规则，都应在整个程序中保持一致。\n\
    \n#### `if…else` 语句的 UML 活动图\n\n下图说明了上述 `if…else` 语句的控制流：\n\n![Images](img/03unfig03.jpg)\n\
    \n"
- fmt: "\nA program can test multiple cases by placing `if…else` statements inside\
    \ other `if…else` statements to create nested `if…else` statements. For example,\
    \ the following nested `if…else` prints `\"A\"` for exam grades greater than or\
    \ equal to 90, `\"B\"` for grades 80 to 89, `\"C\"` for grades 70 to 79, `\"D\"\
    ` for grades 60 to 69 and `\"F\"` for all other grades. We use shading to highlight\
    \ the nesting.\n\n![Images](Images/03unfig04.jpg)\n\nIf variable `studentGrade`\
    \ is greater than or equal to 90, the first four conditions in the nested `if…else`\
    \ statement will be true, but only the statement in the `if`-part of the first\
    \ `if…else` statement will execute. After that statement executes, the `else`-part\
    \ of the “outermost” `if…else` statement is skipped. The preceding nested `if…else`\
    \ statement also can be written in the following form, which is identical except\
    \ for the spacing and indentation that the compiler ignores:\n\n```\nif (studentGrade\
    \ >= 90) {\n   cout << \"A\";\n}\nelse if (studentGrade >= 80) {\n   cout << \"\
    B\";\n}\nelse if (studentGrade >= 70) {\n   cout << \"C\";\n}\nelse if (studentGrade\
    \ >= 60) {\n   cout << \"D\";\n}\nelse {\n   cout << \"F\";\n}\n```\n\nThis form\
    \ avoids deep indentation of the code to the right, which can force lines to wrap.\
    \ Throughout the text, we always enclose control statement bodies in braces (`{`\
    \ and `}`), which avoids a logic error called the “dangling-`else`” problem.\n\
    \n#### 3.4.2 Blocks\n\nThe `if` statement expects only one statement in its body.\
    \ To include several statements in its body (or the body of an `else` for an `if…else`\
    \ statement), enclose the statements in braces. It’s good practice always to use\
    \ the braces. Statements contained in a pair of braces (such as the body of a\
    \ control statement or function) form a block. A block can be placed anywhere\
    \ in a function that a single statement can be placed.\n\nThe following example\
    \ includes a block of multiple statements in the `else` part of an `if…else` statement:\n\
    \n```\nif (grade >= 60) {\n   cout << \"Passed\";\n}\nelse\n{\n   cout << \"Failed\\\
    n\";\n   cout << \"You must retake this course.\";\n}\n```\n\nIn this case, if\
    \ `grade` is less than 60, the program executes both statements in the body of\
    \ the `else` and prints:\n\n```\nFailed\nYou must retake this course.\n```\n\n\
    Without the braces surrounding the two statements in the `else` clause, the statement\n\
    \n```\ncout << \"You must retake this course.\";\n```\n\nwould be outside the\
    \ body of the `else` part of the `if…else` statement and would execute regardless\
    \ of whether the grade was less than 60—a logic error.\n\n#### Empty Statement\n\
    \nJust as a block can be placed anywhere a single statement can be placed, it’s\
    \ also possible to have an empty statement, which is represented by placing a\
    \ semicolon (`;`) where a statement typically would be.\n\n#### 3.4.3 Conditional\
    \ Operator (`?:`)\n\nC++ provides the conditional operator (`?:`) that can be\
    \ used in place of an `if…else` statement. This can make your code shorter and\
    \ clearer. The conditional operator is C++’s only ternary operator (i.e., an operator\
    \ that takes three operands). Together, the operands and the `?:` symbol form\
    \ a conditional expression. For example, the statement\n\n```\ncout << (studentGrade\
    \ >= 60 ? \"Passed\" : \"Failed\");\n```\n\nprints the value of the conditional\
    \ expression. The operand to the left of the `?` is a condition. The second operand\
    \ (between the `?` and `:`) is the value of the conditional expression if the\
    \ condition is true. The operand to the right of the `:` is the value of the conditional\
    \ expression if the condition is false. The conditional expression in this statement\
    \ evaluates to the string `\"Passed\"` if the condition\n\n```\nstudentGrade >=\
    \ 60\n```\n\nis true and to the string `\"Failed\"` if it’s false. Thus, this\
    \ statement with the conditional operator performs essentially the same function\
    \ as the first `if…else` statement in Section 3.4. The precedence of the conditional\
    \ operator is low, so the entire conditional expression is normally placed in\
    \ parentheses.\n\nThe values in a conditional expression also can be actions to\
    \ execute. For example, the following conditional expression also prints `\"Passed\"\
    ` or `\"Failed\"`:\n\n```\ngrade >= 60 ? cout << \"Passed\" : cout << \"Failed\"\
