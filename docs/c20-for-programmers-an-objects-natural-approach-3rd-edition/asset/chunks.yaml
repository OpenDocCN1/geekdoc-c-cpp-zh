  trans: "\n\n重载函数通过其签名（signature）来区分。签名是函数名及其参数类型（按顺序）的组合。`类型安全链接`（Type-safe linkage）确保了调用正确的函数，并且参数的类型符合参数类型。为了实现类型安全链接，编译器在内部会将每个函数标识符与其参数类型进行编码——这一过程被称为`名称修饰`（name\
    \ mangling）。这些编码方式因编译器而异，因此为特定平台创建可执行文件时需要链接的所有内容都必须使用该平台的相同编译器进行编译。图 5.13 是使用\
    \ GNU C++ 编译的^(17)。我们没有像通常那样显示程序的执行输出，而是展示了 GNU C++ 在汇编语言中生成的修饰后的函数名.^(18)\n\n\
    17。空的 `main` 函数确保了我们在编译此代码时不会遇到链接器错误。\n\n18。命令 `g++ -S fig05_13.cpp` 生成了汇编文件 `fig05_14.s`。\n\
    \n![Images](img/05fig13.jpg)![Images](img/05fig13a.jpg)\n\n**图 5.13** 用于实现类型安全链接的名称修饰。（2\
    \ 部分中的第 1 部分。）\n\n对于 GNU C++，每个修饰后的名称（`main` 除外）以下划线（`_`）开头，随后是字母 `Z`、一个数字和函数名。`Z`\
    \ 之后的数字指定了函数名中的字符数。例如，函数 `square` 的名称有 6 个字符，因此其修饰名称的前缀为 `_Z6`。紧随函数名之后的是参数列表的编码：\n\
    \n* 对于接收 `int` 的函数 `square`（第 5 行），`i` 代表 `int`，如输出的第一行所示。\n* 对于接收 `double` 的函数\
    \ `square`（第 10 行），`d` 代表 `double`，如输出的第二行所示。\n* 对于函数 `nothing1`（第 16 行），`i` 代表\
    \ `int`，`f` 代表 `float`，`c` 代表 `char`，`Ri` 代表 `int&`（即对 `int` 的引用），如输出的第三行所示。\n\
    * 对于函数 `nothing2`（第 20 行），`c` 代表 `char`，`i` 代表 `int`，`Rf` 代表 `float&`，`Rd` 代表\
    \ `double&`。\n\n编译器通过参数列表区分两个 `square` 函数——一个指定 `i` 为 `int`，另一个指定 `d` 为 `double`。函数的返回类型没有在修饰后的名称中指定。重载函数可以有不同的返回类型，但如果有，它们也必须具有不同的参数列表。函数名修饰是特定编译器的。例如，Visual\
    \ C++ 为第 5 行的 `square` 函数生成名称 `square@@YAHH@Z`。GNU C++ 编译器没有修饰 `main` 的名称，但某些编译器会这样做。例如，Visual\
    \ C++ 使用 `_main`。\n\n创建具有相同参数列表但不同返回类型的重载函数会导致编译错误。编译器仅使用参数列表来区分重载函数。此类函数不需要具有相同数量的参数。\n\
    \n省略了默认参数的函数调用方式可能与另一个重载函数相同；这会导致编译错误。例如，如果程序中同时包含一个显式不接受任何参数的函数和一个同名但包含所有默认参数的函数，当尝试在不传递参数的调用中使用该函数名时，会导致编译错误。编译器无法无歧地确定选择哪个版本的函数。\n\
    \n#### 重载运算符\n\n在第 14 章中，我们讨论了如何重载运算符，以定义它们如何在用户定义的数据类型的对象上进行操作。（事实上，到目前为止我们已经使用了许多重载运算符，包括流插入运算符\
    \ `<<` 和流提取运算符 `>>`。这些运算符对所有基本类型都进行了重载。我们将在第 14 章中更详细地介绍如何通过重载 `<<` 和 `>>` 来处理用户定义类型的对象对象。）\n\
    \n### 5.17 函数模板\n\n重载函数通常用于对不同数据类型执行涉及不同程序逻辑的相似操作。如果每个数据类型的程序逻辑和操作是相同的，则可以通过`函数模板`更紧凑、更方便地执行重载。你只需要写一个函数模板定义。根据调用此函数时提供的参数类型，C++\
    \ 会自动生成单独的`函数模板特化`来适当处理每种类型的调用。因此，定义单个函数模板本质上定义了一整族重载函数。\n\n##### `maximum` 函数模板\n\
    \n图 5.14 定义了一个 `maximum` 函数模板，用于确定三个值中的最大值。所有函数模板定义都以 `template` 关键字开头（第 3 行），随后跟着用角括号（`<`\
    \ 和 `>`）括起的`模板参数列表`。模板参数列表中的每个参数前面都有关键字 `typename` 或关键字 `class`（它们在这种语境下是同义词）。\n\
    \n![Images](img/05fig14.jpg)\n\n**图 5.14** 函数模板 `maximum`。\n\n该函数模板声明了一个单一类型参数\
    \ `T`（第 3 行），作为待测试数据类型的占位符。类型参数的名称在特定模板的模板参数列表中必须唯一。当编译器在源码中遇到对 `maximum` 的调用时，会在模板定义中替换\
    \ `T`，从而为指定的类型创建一个完整的函数特化。\n\n##### 使用函数模板 `maximum`\n\n图 5.15 使用 `maximum` 函数模板分别确定三个\
    \ `int` 值、三个 `double` 值和三个 `char` 值的最大值（分别为第 15、24 和 33 行）。由于每次调用使用的类型不同，编译器在“后台”为每种类型创建一个单独的函数定义——一个接收三个\
    \ `int` 值，一个接收三个 `double` 值，一个接收三个 `char` 值。\n\n![Images](img/05fig13.jpg)![Images](img/05fig15a.jpg)\n\
    \n**图 5.15** 函数模板 `maximum` 测试程序。（2 部分中的第 1 部分。）\n\n##### `int` 类型的 `maximum`\
    \ 函数模板特化\n\n为 `int` 类型创建的函数模板特化将每个出现的 `T` 替换为 `int`，如下：\n\n```\nint maximum(int\
    \ value1, int value2, int value3) {\n   int maximumValue{value1}; // 假设 value1\
    \ 是最大的\n\n   // 确定 value2 是否大于 maximumValue\n   if (value2 > maximumValue) {\n\
    \      maximumValue = value2;\n   }\n\n   // 确定 value3 是否大于 maximumValue\n   if\
    \ (value3 > maximumValue) {\n      maximumValue = value3;\n   }\n\n   return maximumValue;\n\
    \n}\n```\n\n### 5.18 递归\n\n"
- fmt: "\nFor some problems, it’s useful to have functions call themselves. A `recursive\
    \ function` is a function that calls itself, either directly or indirectly (through\
    \ another function). This section and the next present simple examples of recursion.\
    \ Recursion is discussed at length in upper-level computer science courses.\n\n\
    ## Recursion Concepts\n\nWe first consider recursion conceptually, then examine\
    \ programs containing recursive functions. Recursive problem-solving approaches\
    \ have several elements in common. A recursive function is called to solve a problem.\
    \ The function knows how to solve only the simplest case(s), or so-called `base\
    \ case(s)`. If the function is called with a base case, the function simply returns\
    \ a result. If the function is called with a more complex problem, it typically\
    \ divides the problem into two conceptual pieces—a piece that the function knows\
    \ how to do and a piece that it does not know how to do. To make recursion feasible,\
    \ the latter piece must resemble the original problem, but be a slightly simpler\
    \ or smaller version. This new problem looks like the original, so the function\
    \ calls a copy of itself to work on the smaller problem—this is referred to as\
    \ a `recursive call` and is also called the `recursion step`. The recursion step\
    \ often includes the keyword `return`, because its result will be combined with\
    \ the portion of the problem the function knew how to solve to form the result\
    \ passed back to the original caller, possibly `main`.\n\nOmitting the base case\
    \ or writing the recursion step incorrectly so that it does not converge on the\
    \ base case causes an infinite recursion error, typically causing a stack overflow.\
    \ This is analogous to the problem of an infinite loop in an iterative (nonrecursive)\
    \ solution. Accidentally having a nonrecursive function call itself, either directly\
    \ or indirectly through another function, also causes an infinite recursion.\n\
    \nThe recursion step executes while the original call to the function is still\
    \ “open,” i.e., it has not yet finished executing. The recursion step can result\
    \ in many more such recursive calls, as the function keeps dividing each new subproblem\
    \ with which the function is called into two conceptual pieces. For the recursion\
    \ to eventually terminate, each time the function calls itself with a slightly\
    \ simpler version of the original problem, this sequence of smaller and smaller\
    \ problems must eventually converge on the base case. At that point, the function\
    \ recognizes the base case and returns a result to the previous copy of the function.\
    \ Then, a sequence of returns ensues up the line until the original call eventually\
    \ returns the final result to `main`. This sounds quite exotic compared to the\
    \ kind of problem-solving we’ve been using to this point. As an example of these\
    \ concepts at work, let’s write a recursive program to perform a popular mathematical\
    \ calculation.\n\nThe C++ standard document indicates that `main` should not be\
    \ called within a program (Section 6.9.3.1) or recursively (Section 7.6.1.2).\
    \ Its sole purpose is to be the starting point for program execution.\n\n## Factorial\n\
    \nThe factorial of a non-negative integer `n`, written `n!` (pronounced “`n` factorial”),\
    \ is the product\n\n`n · (`n` – 1) · (`n` – 2) · … · 1`\n\nwith `1!` equal to\
    \ 1, and `0!` defined to be 1. For example, `5!` is the product `5 · 4 · 3 · 2\
    \ · 1`, which is equal to 120.\n\n## Iterative Factorial\n\nThe factorial of an\
    \ integer, `number`, greater than or equal to 0, can be calculated `iteratively`\
    \ (nonrecursively) by using a `for` statement as follows:\n\n```\nint factorial{1};\n\
    \nfor (int counter{number}; counter >= 1; --counter) {\n   factorial *= counter;\n\
    }\n```\n\n## Recursive Factorial\n\nA recursive definition of the factorial function\
    \ is arrived at by observing the following algebraic relationship:\n\n`n! = n\
    \ · (`n` – 1)!`\n\nFor example, `5!` is clearly equal to `5 * 4!` as is shown\
    \ by the following:\n\n`5! = 5 · 4 · 3 · 2 · 1`\n`5! = 5 · (4 · 3 · 2 · 1)`\n\
    `5! = 5 · (4!)`\n\n## Evaluating 5!\n\nThe evaluation of `5!` would proceed as\
    \ shown in the following diagram, which illustrates how the succession of recursive\
    \ calls proceeds until `1!` is evaluated to be 1, terminating the recursion. Part\
    \ (b) of the diagram shows the values returned from each recursive call to its\
    \ caller until the final value is calculated and returned.\n\n![Images](Images/05unfig01.jpg)\n\
    \n## Using a Recursive `factorial` Function to Calculate Factorials\n\nFigure\
    \ 5.16 uses recursion to calculate and print the factorials of the integers 0–10.\
    \ The recursive function `factorial` (lines 18–25) first determines whether the\
    \ terminating condition `number <= 1` (i.e., the base case; line 19) is true.\
    \ If `number` is less than or equal to 1, the `factorial` function returns 1 (line\
    \ 20), no further recursion is necessary and the function terminates. If `number`\
    \ is greater than 1, line 23 expresses the problem as the product of `number`\
    \ and a recursive call to `factorial` evaluating the factorial of `number - 1`,\
    \ which is a slightly simpler problem than the original calculation `factorial(number)`.\n\
    \n![Images](Images/05fig16.jpg)![Images](Images/05fig16a.jpg)\n\n**Fig. 5.16**\
    \ Recursive function `factorial`. (Part 1 of 2.)\n\n## Factorial Values Grow Quickly\n\
    \nFunction `factorial` receives a parameter of type `long` and returns a result\
    \ of type `long`. Typically, a `long` is stored in at least four bytes (32 bits);\
    \ such a variable can hold a value in the range –2,147,483,647 to 2,147,483,647.\
    \ Unfortunately, the function `factorial` produces large values so quickly that\
    \ type `long` does not help us compute many values. For larger integer values,\
    \ we could use type `long long` (Section 3.11) or a class that represents arbitrary\
    \ sized integers (such as the open-source `BigNumber` class we introduced in 3.12).\n\
    \n### Using Recursion: Fibonacci Series\n\nThe Fibonacci series\n\n0, 1, 1, 2,\
    \ 3, 5, 8, 13, 21, …\n\nbegins with 0 and 1 and has the property that each subsequent\
    \ Fibonacci number is the sum of the previous two Fibonacci numbers.\n\nThe series\
    \ occurs in nature and, in particular, describes a form of a spiral. The ratio\
    \ of successive Fibonacci numbers converges on a constant value of 1.618…. This\
    \ number frequently occurs in nature and has been called the `golden ratio` or\
    \ the `golden mean.` Humans tend to find the golden mean aesthetically pleasing.\
    \ Architects often design windows, rooms and buildings whose length and width\
    \ are in the ratio of the golden mean. Postcards are often designed with a golden\
    \ mean length/width ratio. A web search for “Fibonacci in nature” reveals many\
    \ interesting examples, including flower petals, shells, spiral galaxies, hurricanes\
    \ and more.\n\n## Recursive Fibonacci Definition\n\nThe Fibonacci series can be\
    \ defined recursively as follows:\n\n`fibonacci(0) = 0`\n`fibonacci(1) = 1`\n\
    `fibonacci(n) = fibonacci(n – 1) + fibonacci(n – 2)`\n\nThe program of Fig. 5.17\
    \ calculates the nth Fibonacci number recursively by using function `fibonacci`.\
    \ Figure 5.17 shows the execution of the program, which displays the Fibonacci\
    \ values for several numbers.\n\n![Images](Images/05fig17.jpg)![Images](Images/05fig17a.jpg)\n\
    \n**Fig. 5.17** Recursive function `fibonacci`. (Part 1 of 2.)\n"
