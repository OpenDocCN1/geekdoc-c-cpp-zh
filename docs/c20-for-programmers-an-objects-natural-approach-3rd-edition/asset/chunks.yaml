    ### 4.2 Essentials of Counter-Controlled Iteration


    This section uses the `while` iteration statement introduced in [Chapter 3](#ch03.xhtml_ch03)
    to formalize the elements of counter-controlled iteration:


    **1.** a **control variable** (or loop counter)


    **2.** the control variable’s **initial value**


    **3.** the control variable’s **increment** that’s applied during each iteration
    of the loop


    **4.** the **loop-continuation condition** that determines if looping should continue.


    Consider the application of [Fig. 4.1](#ch04.xhtml_fig4_1), which uses a loop
    to display the numbers from 1 through 10.


