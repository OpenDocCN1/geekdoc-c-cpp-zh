    You’ve already worked with C++ objects—specifically the `cout` and `cin` objects,
    which encapsulate the mechanisms for output and input, respectively. These objects
    were created for you behind the scenes using classes from the header `<iostream>`.
    In this section, you’ll create and interact with objects of the C++ standard library’s
    `string` class^([2](#ch01.xhtml_ch0fn2)).


    [2](#ch01.xhtml_rch0fn2). You’ll learn additional `string` capabilities in subsequent
    chapters. [Chapter 8](#ch08.xhtml_ch08) discusses class `string` in detail, test-driving
    many more of its member functions.


    ### Test-Driving Class `string`


    Classes cannot execute by themselves. A `Person` object can drive a `Car` object
    by telling it what to do (go faster, go slower, turn left, turn right, etc.)—without
    knowing how the car’s internal mechanisms work. Similarly, the `main` function
    can “drive” a `string` object by calling its member functions—without knowing
    how the class is implemented. In this sense, `main` in the following program is
    referred to as a **driver program**. [Figure 2.6](#ch02.xhtml_fig2_6)’s `main`
    function test-drives several `string` member functions.


    ![Images](Images/02fig06.jpg)![Images](Images/02fig06a.jpg)


    **Fig. 2.6** Standard Library `string` class test program. (Part 1 of 2.)


    ### Instantiating Objects


    Typically, you cannot call a member function of a class until you create an object
    of that class^([3](#ch01.xhtml_ch0fn3))—also called instantiating an object. Lines
    8–10 create three `string` objects:


    * `s1` is initialized with the string literal `"happy"`,

    * `s2` is initialized with the string literal `" birthday"` and

    * `s3` is initialized by default to the empty `string` (that is, `""`).


    [3](#ch01.xhtml_rch0fn3). You’ll see in Section 11.15 that you can call a class’s
    `static` member functions without creating an object of that class.


    When we declare `int` variables, as we did earlier, the compiler knows what `int`
    is—it’s a fundamental type that’s built into C++. In lines 8–10, however, the
    compiler does not know in advance what type `string` is—it’s a class type from
    the C++ standard library.


    When packaged properly, classes can be reused by other programmers. This is one
    of the most significant benefits of working with object-oriented programming languages
    like C++ that have rich libraries of powerful prebuilt classes. For example, you
    can reuse the C++ standard library’s classes in any program by including the appropriate
    headers—in this case, the `<string>` header (line 4). The name `string`, like
    the name `cout`, belongs to namespace `std`.


    ### C++20 `string` Member Function `length`


    20 Lines 13–15 output each `string` and its length. The `string` class’s `length`
    member function (new in C++20) returns the number of characters stored in a particular
    `string` object. In line 13, the expression


    ```

    s1.length()

    ```


    returns `s1`’s length by calling the object’s `length` member function. To call
    this member function for a specific object, you specify the object’s name (`s1`),
    followed by the dot operator (`.`), then the member function name (`length`) and
    a set of parentheses. Empty paren-theses indicate that `length` does not require
    any additional information to perform its task. Soon, you’ll see that some member
    functions require additional information called arguments to perform their tasks.


    From `main`’s view, when the `length` member function is called:


    1. The program transfers execution from the call (line 13 in `main`) to member
    function `length`. Because `length` was called via the `s1` object, `length` “knows”
    which object’s data to manipulate.

    2. Next, member function `length` performs its task—that is, it returns `s1`’s
    length to line 13 where the function was called. The `main` function does not
    know the details of how `length` performs its task, just as the driver of a car
    doesn’t know the details of how engines, transmissions, steering mechanisms and
    brakes are implemented.

    3. The `cout` object displays the number of characters returned by member function
    `length`, then the program continues executing, displaying the `string`s `s2`
    and `s3` and their lengths.


    ### Comparing `string` Objects with the Equality Operators


    Like numbers, `string`s can be compared with one another. Lines 18–20 show the
    results of comparing `s2` to `s1` using the equality operators—`string` comparisons
    are case sensitive.^([4](#ch02.xhtml_ch0fn4)).


    [4](#ch02.xhtml_rch0fn4). In [Chapter 8](#ch08.xhtml_ch08), you’ll see that strings
    perform lexicographical comparisons using the numerical values of the characters
    in each string.


    Normally, when you output a condition’s value, C++ displays `0` for false or `1`
    for true. The stream manipulator `boolalpha` (line 18) tells the output stream
    to display `false` or `true`.


    ### `string` Member Function `empty`


    25 Line 25 calls `string` member function `empty`, which returns `true` if the
    `string` is empty; otherwise, it returns `false`. The object `s3` was initialized
    by default to empty, so the body of the `if` statement will execute.


    ### `string` Concatenation and Assignment


    27 Line 27 assigns a new value to `s3` by “adding” the strings `s1` and `s2`—this
    is known as concatenation. After the assignment, `s3` contains the characters
    of `s1` followed by the characters of `s2`.


    ### `string` Member Functions `starts_with` and `ends_with`


    32 Lines 32–35 demonstrate new member functions `starts_with` and `ends_with`,
    which return `true` if the string starts or ends with a specified substring, respectively;
    otherwise, they return `false`.


    ### 2.8 Wrap-Up


    We presented many important basic features of C++ in this chapter, including displaying
    data on the screen, inputting data from the keyboard and declaring variables.
    In particular, you learned to use the output stream object `cout` and the input
    stream object `cin` to build simple interactive programs. We declared and initialized
    variables and used arithmetic operators to perform calculations. We discussed
    the order in which C++ applies operators (i.e., the rules of operator precedence),
    as well as the grouping of the operators. You saw how C++’s `if` statement allows
    a program to make decisions. We introduced the equality and relational operators,
    which we used to form conditions in `if` statements.


    Finally, we introduced the notion of “objects natural” learning by creating objects
    of the C++ standard library class `string` and interacting with them using equality
    operators and `string` member functions. In subsequent chapters, you’ll create
    and use many objects of existing classes to accomplish significant tasks with
    minimal amounts of code. Then, in Chapters 10](#ch10.xhtml_ch10)–[14](#ch14.xhtml_ch14),
    you’ll create your own custom classes. You’ll see that C++ enables you to “craft
    valuable classes.” In the next chapter, we begin our introduction to control statements,
    which specify the order in which a program’s actions are performed.


    ## 3. Control Statements: Part 1


    ![Images](Images/ch03.jpg)


    ### Objectives


    In this chapter, you’ll:


    * Use the `if` and `if…else` selection statements to choose between alternative
    actions.

    * Use the `while` iteration statement to execute statements in a program repeatedly.

    * Use counter-controlled iteration and sentinel-controlled iteration.

    * Use nested control statements.

    * Use the compound assignment operators and the increment and decrement operators.

    * Learn why fundamental data types are not portable.

