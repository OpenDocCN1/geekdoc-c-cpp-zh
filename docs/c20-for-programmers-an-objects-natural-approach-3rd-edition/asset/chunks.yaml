  raw: '• Member function `encrypt` receives `string`s representing the plain text
    to encrypt and the secret key, uses the Vigenère cipher to encrypt the text, then
    returns a `string` containing the ciphertext.


    • Member function `decrypt` receives `string`s representing the ciphertext to
    decrypt, reverses the Vigenère cipher to decrypt the text, then returns a `string`
    containing the plain text.


    The program first asks you to enter text to encrypt and a secret key. Line 17
    creates the `Cipher` object. Lines 20–21 encrypt the text you entered and display
    the encrypted text. Then, lines 24–25 decrypt the text to show you the plain-text
    string you entered.


    Though the last Objectives bullet in this chapter, the last sentence of Section
    5.1 and this section’s title look like gibberish, they’re each ciphertext that
    we created with our `Cipher` class and the secret key


    ```

    XMWUJBVYHXZ

    ```


    Line 28–29 prompt for and input existing ciphertext, then lines 30–31 decrypt
    the ciphertext and display the original plain text that we encrypted.


    ### 5.23 Wrap-Up


    In this chapter, we presented function concepts, including function prototypes,
    function signatures, function headers and function bodies. We overviewed the math
    library functions and new math functions and constants added in C++20, C++17 and
    C++11.


    You learned about argument coercion—forcing arguments to the appropriate types
    specified by the parameter declarations of a function. We presented an overview
    of the C++ Standard Library’s headers. We demonstrated how to use functions `rand`
    and `srand` to generate random numbers that can be used for simulations, then
    presented C++11’s nondeterministic capabilities for producing more secure random
    numbers. We introduced C++14’s digit separators for more readable large numeric
    literals. We defined sets of constants with scoped `enum`s and introduced C++20’s
    `using enum` declaration.


    You learned about the scope of variables. We discussed two ways to pass arguments
    to functions—pass-by-value and pass-by-reference. We showed how to implement inline
    functions and functions that receive default arguments. You learned that overloaded
    functions have the same name but different signatures. Such functions can be used
    to perform the same or similar tasks, using different types or different numbers
    of parameters. We demonstrated using function templates to conveniently generate
    families of overloaded functions. You then studied recursion, where a function
    calls itself to solve a problem.


    We presented C++17’s `[[nodiscard]]` attribute for indicating that a function’s
    return value should not be ignored and discussed C++20’s `[[nodiscard]]` enhancement
    for specifying a reason why the return value should not be ignored. Finally, our
    objects-natural case study introduced secret key substitution ciphers for encrypting
    and decrypting text.


    In [Chapter 6](#ch06.xhtml_ch06), you’ll learn how to maintain lists and tables
    of data in arrays and object-oriented `vector`s. You’ll see a more elegant array-based
    implementation of the dice-rolling application.


