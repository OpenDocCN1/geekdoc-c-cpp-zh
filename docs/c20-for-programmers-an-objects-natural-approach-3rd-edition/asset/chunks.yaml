    ### 4.5 Application: Summing Even Integers


    The application in [Fig. 4.3](#ch04.xhtml_fig4_3) uses a `for` statement to sum
    the even integers from 2 to 20 and store the result in `int` variable `total`.
    Each iteration of the loop (lines 10–12) adds control variable `number`’s value
    to variable `total`.


    ![Images](Images/04fig03.jpg)![Images](Images/04fig03a.jpg)


    **Fig. 4.3** Summing integers with the `for` statement. (Part 1 of 2.)


    A `for` statement’s initialization and increment expressions can be comma-separated
    lists containing multiple initialization expressions or multiple increment expressions.
    Although this is discouraged, you could merge the `for` statement’s body (line
    11) into the increment portion of the `for` header by using a comma operator as
    in


    ```

    total += number, number += 2

    ```


    The comma between the expressions `total += number` and `number += 2` is the **comma
    operator**, which guarantees that a list of expressions evaluates from left to
    right. The comma operator has the lowest precedence of all C++ operators. The
    value and type of a comma-separated list of expressions is the value and type
    of the rightmost expression. For example, assuming `x` is an `int` and `y` is
    a `double`, the value of the comma-separated list of expressions


    ```

    x = 5, y = 6.4;

    ```


    is `6.4` and the type is `double`.


    The comma operator is often used in `for` statements that require multiple initialization
    expressions or multiple increment expressions.


    ### 4.6 Application: Compound-Interest Calculations


    Let’s compute compound interest with a `for` statement. Consider the following
    problem:


    *A person invests $1,000 in a savings account yielding 5% interest. Assuming all
    interest is left on deposit, calculate and print the amount of money in the account
    at the end of each year for 10 years. Use the following formula to determine the
    amounts:*


    *a = p* (1 + *r*)^(*n*)*


    *where*


    *p* is the original amount invested (i.e., the principal)


    *r* is the annual interest rate (e.g., use 0.05 for 5%)


    *n* is the number of years


    *a* is the amount on deposit at the end of the *n*th year.


    The solution to this problem ([Fig. 4.4](#ch04.xhtml_fig4_4)) involves a loop
    that performs the indicated calculation for each of the 10 years the money remains
    on deposit. We use `double` values here for the monetary calculations. Then we
    discuss the problems with using floating-point types to represent monetary amounts.
    In [Chapter 10](#ch10.xhtml_ch10), we’ll develop a new `Dollar-Amount` class that
    uses large integers to precisely represent monetary amounts. As you’ll see, the
    class performs monetary calculations using only integer arithmetic.


    ![Images](Images/04fig04.jpg)![Images](Images/04fig04a.jpg)


    **Fig. 4.4** Compound-interest calculations with `for`. (Part 1 of 2.)


    Lines 12–13 declare `double` variables `principal` and `rate`, and initialize
    `principal` to `1000.00` and `rate` to `0.05`. C++ treats floating-point literals
    like `1000.00` and `0.05` as type `double`. Similarly, C++ treats whole-number
    literals like `7` and `-22` as type `int`.^([1](#ch01.xhtml_ch0fn1)) Lines 15–16
    display the initial principal and the interest rate.


    [1](#ch01.xhtml_rch0fn1). Section 3.12 showed that C++’s integer types cannot
    represent all integer values. Choose the correct type for the range of values
    you need to represent. You may designate that an integer literal has type `long`
    or `long long` by appending `L` or `LL`, respectively, to the literal value.


    #### Formatting with Field Widths and Justification


    Line 10 before the loop and line 27 in the loop combine to print the `year` and
    `amount` values. We specify the formatting with the parameterized stream manipulators
    `setprecision` and `setw` and the nonparameterized stream manipulator `fixed`.
    The stream manipulator `setw(4)` specifies that the next value output should appear
    in a **field width** of 4— i.e., `cout <<` prints the value with at least four
    character positions. If the value to be output is fewer than four character positions,
    the value is right-aligned in the field by default. If the value to be output
    is more than four character positions, C++ extends the field width to the right
    to accommodate the entire value. To left-align values, output nonparameterized
    stream manipulator `left` (found in header `<iostream>`). You can restore right-alignment
    by outputting nonparameterized stream manipulator `right`.


    The other formatting in the output statements displays variable `amount` as a
    fixed-point value with a decimal point (`fixed` in line 10) right-aligned in a
    field of 20 character positions (`setw(20)` in line 27) and two digits of precision
    to the right of the decimal point (`setprecision(2)` in line 10). The stream manipulator
    `setw(4)` specifies that the next value output should appear in a **field width**
    of 4— i.e., `cout <<` prints the value with at least four character positions.
    If the value to be output is fewer than four character positions, the value is
    right-aligned in the field by default. If the value to be output is more than
    four character positions, C++ extends the field width to the right to accommodate
    the entire value. To left-align values, output nonparameterized stream manipulator
    `left` (found in header `<iostream>`). You can restore right-alignment by outputting
    nonparameterized stream manipulator `right`.


    ##### Performing Interest Calculations with Standard Library `pow`


    The `for` statement (lines 22–28) iterates 10 times, varying the `int` control
    variable `year` from 1 to 10 in increments of 1. C++ does not include an exponentiation
    operator, so we use the **standard library function** `pow` (line 24) from the
    header `<cmath>` (line 5). The call `pow(x, y)` calculates the value of *x* raised
    to the *y*th power. The function receives two `double` arguments and returns a
    `double` value.


    ##### Floating-Point Number Precision and Memory Requirements


    Variables of type `float` represent **single-precision floating-point numbers**.
    Most of today’s systems store these in four bytes of memory with approximately
    seven significant digits. Variables of type `double` represent **double-precision
    floating-point numbers**. Most of today’s systems store these in eight bytes of
    memory with approximately 15 significant digits—approximately double the precision
    of `float` variables. Most programmers represent floating-point numbers with type
    `double`. C++ treats floating-point numbers like 3.14159 in a program’s source
    code as `double` values by default. Such values in the source code are known as
    **floating-point literals**.


    Though most systems store `float`s in four bytes and `double`s in eight bytes,
    the C++ standard indicates that type `double` provides at least as much precision
    as `float`. There is also type `long double`, which provides at least as much
    precision as `double`. For a complete list of C++ fundamental types and their
    typical ranges, see


    ```

    https://en.cppreference.com/w/cpp/language/types

    ```

