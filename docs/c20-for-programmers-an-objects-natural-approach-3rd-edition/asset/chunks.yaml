  trans: "\n\n![Images](img/common01.jpg) PERF 今天的编译器使用复杂的优化技术来调整你代码的性能。C++20 引入了\
    \ `[[likely]]` 和 `[[unlikely]]` 属性，允许你提供额外的提示，帮助编译器优化 `if`、`if…else` 和 `switch`\
    \ 语句代码以获得更好的性能。这些属性指示了可能执行或可能不执行的执行路径。今天的许多编译器已经提供了此类机制，因此 `[[likely]]` 和 `[[unlikely]]`\
    \ 在不同编译器之间标准化了这些功能。\n\n- [3]. “Optimizing Compiler.” Wikipedia. Wikimedia Foundation,\
    \ 2020 年 4 月 7 日. [`en.wikipedia.org/wiki/Optimizing_compiler#Specific_techniques`](https://en.wikipedia.org/wiki/Optimizing_compiler#Specific_techniques)。\n\
    - [4]. 给评审者的备注：在本文编写期间，我们首选编译器尚未实现这些属性。我们搜索了关于为什么以及你如何使用此功能来生成更优代码的见解。尽管该标准即于\
    \ 5 月接受，但目前除了建议文档“Attributes for Likely and Unlikely Statements (Revision 2)”\
    \ ([`wg21.link/p0479r2`](https://wg21.link/p0479r2)) 之外几乎没有信息。第 3 节“动机与范围”建议了谁应该使用这些功能以及它们的用途。\n\
    - [5]. Sutter, Herb. “Trip Report: Winter ISO C Standards Meeting (Jacksonville).”\
    \ Sutter's Mill, 2018 年 4 月 3 日. [`herbsutter.com/2018/04/`](https://herbsutter.com/2018/04/)。Herb\
    \ Sutter 是 ISO C++ 委员会召召人，微软的软件架构师。\n\n要使用这些属性，将 `[[likely]]` 或 `[[unlikely]]`\
    \ 放在 `if` 或 `else` 体之前，如下：\n\n```\nif (condition) [[likely]] {\n\n   // statements\n\
    \n}\n\nelse {\n\n   // statements\n}\n```\n\n或者放在 `switch` 中的 `case` 标签之前，如下：\n\
    \n```cpp\nswitch (controllingExpression) {\n\n   case 7:\n\n      // statements\n\
    \n      break;\n\n   [[likely]] case 11:\n\n      // statements\n\n      break;\n\
    \n   default:\n\n      // statements\n\n      break;\n}\n```\n\n![Images](img/common01.jpg)\
    \ PERF 使用这些属性时存在细微的问题。在代码中使用过多的 `[[likely]]` 和 `[[unlikely]]` 属性实际上可能会降低性能。提议将这些属性添加到语言中的文档指出，对于每一项属性：“此属性用于特定于实现的特殊优化。不建议通用使用此属性。”关于其他细微之处的讨论，请参阅建议文档：\n\
    \n```\nhttps://wg21.link/p0479r2\n```\n\n- [6]. Section 9.12.6, “Working Draft,\
    \ Standard for Programming Language.” ISO/IEC, 2020 年 4 月 3 日. [`github.com/cplusplus/draft/download/n4861/n4861.pdf`](https://github.com/cplusplus/draft/download/n4861/n4861.pdf)。\n\
    - [7]. “Attributes for Likely and Unlikely Statements (Revision 2).” [`wg21.link/p0479r2`](https://wg21.link/p0479r2)。第\
    \ VIII 节，技术规范。\n\n如果你正在处理对性能有严格要求的系统，你可能想要研究这些属性。\n\n### 4.14 实际案例研究：使用 `miniz-cpp`\
    \ 库读写 ZIP 文件\n\n![Images](img/common01.jpg) PERF 数据压缩减小数据的大小——通常是为了节省内存、节省辅助存储空间或通过互联网传输数据。无损数据压缩算法以不丢失信息的方式压缩数据——数据可以被解压并恢复到原始形式。有损数据压缩算法永久地丢弃信息。此类算法常用于音频和视频。例如，当你在线观看视频时，视频通常使用有损算法压缩，以尽量减少互联网上的总字节数。尽管部分视频数据被丢弃了，但有损算法压缩数据的方式让大多数人在看视频时察觉不到被移除的信息。视频质量仍然“相当不错”。\n\
    \n#### ZIP 文件\n\n你可能用过 ZIP 文件——如果没有用过，你几乎肯定会用。ZIP 文件格式是一种已使用 30 多年的无损压缩格式。无损压缩算法使用各种技术来压缩数据——例如：\n\
    \n* 将重复的模式（例如文档中的文本字符串或图像中的像素）替换为指向单个副本的引用，\n* 将一组具有相同颜色的图像像素替换为该颜色的一个像素和一个计数。\n\
    \n- [9]. “Zip (File Format).” Wikipedia. Wikimedia Foundation, 2020 年 4 月 23 日.\
    \ [`en.wikipedia.org/wiki/Zip_(file_format)`](https://en.wikipedia.org/wiki/Zip_(file_format))。\n\
    - [10]. “Data Compression.” Wikipedia. Wikimedia Foundation, 2020 年 4 月 16 日.\
    \ [`en.wikipedia.org/wiki/Data_compression#Lossless`](https://en.wikipedia.org/wiki/Data_compression#Lossless)。\n\
    \nZIP 用于将文件和目录压缩成单个文件，称为存档文件。ZIP 文件常用于互联网更快地分发软件。操作系统通常支持创建 ZIP 文件并提取其内容。\n\n\
    #### 开源库 `miniz-cpp`\n\n许多开源库支持对 ZIP 存档文件和其他文件格式（如 TAR、RAR 和 7-Zip）进行程序化操作。图 4.11\
    \ 使用开源 `miniz-cpp` 库的 `zip_file` 类创建和读取 ZIP 文件，继续了我们的自然演示。`miniz-cpp` 库是一个“头文件库”——它定义在\
    \ `zip_file.hpp` 中，你可以将其包含在项目中。我们在 `examples` 文件夹的 `minizcpp` 子文件夹提供了该库。头文件将在第\
    \ 10 章深入讨论。\n\n- [11]. “List of Archive Formats.” Wikipedia. Wikimedia Foundation,\
    \ 2020 年 3 月 19 日. [`en.wikipedia.org/wiki/List_of_archive_formats`](https://en.wikipedia.org/wiki/List_of_archive_formats)。\n\
    - [12]. [`github.com/tfussell/miniz-cpp`](https://github.com/tfussell/miniz-cpp)。\n\
