    ## 5.8 Case Study: Random-Number Generation


    We now take a brief and hopefully entertaining diversion into a popular programming
    application, namely simulation and game playing. In this and the next section,
    we develop a game-playing program that includes multiple functions.


    ### The `rand` Function


    The element of chance can be introduced into computer applications by using the
    C++ Standard Library function `rand`. Consider the following statement:


    ```

    i = rand();

    ```


    The function `rand` generates an integer between 0 and `RAND_MAX` (a symbolic
    constant defined in the `<cstdlib>` header). You can determine the value of `RAND_MAX`
    for your system simply by displaying the constant. If `rand` truly produces integers
    at random, every number between 0 and `RAND_MAX` has an equal chance (or probability)
    of being chosen each time `rand` is called.

