    ## Format Details

    The `format` calls in lines 13 and 14 each use the placeholder `{:>7.2f}` to format
    the values of `principal` and `rate`. A colon (`:`) in a placeholder introduces
    a **format specifier** that indicates how a corresponding value should be formatted.
    The format specifier `>7.2f` is for a floating-point number (`f`) that should
    be **right-aligned (`>`)** in a field width of `7` position with two digits of
    precision (`.2`)—that is, two positions to the right of the decimal point. Unlike
    `setprecision` and `fixed` shown earlier, format settings specified in placeholders
    are not “sticky”—they apply only to the value that’s inserted into that placeholder.


    The value of `principal` (`1000.00`) requires exactly seven characters to display,
    so no spaces are required to fill out the field width. The value of `rate` (`0.05`)
    requires only four total character positions, so it will be right-aligned in the
    field of seven characters and filled from the left with leading spaces, as in


    ![Images](Images/04unfig06.jpg)


    Numeric values are right aligned by default, so the `>` is not required here.
    You can **left-align** numeric values in a field width via `<`.


    ### Formatting the Year and Amount on Deposit Column Heads

    In line 17’s format string


    ```

    "\n{}{:>20}\n"

    ```


    `"Year"` is simply placed at the position of the first placeholder, which does
    not contain a format specifier. The second placeholder indicates that `"Amount
    on Deposit"` (17 characters) should be right-aligned (`>`) in a field of `20`
    characters—`format` inserts three leading spaces to right-align the string. Strings
    are left-aligned by default, so the `>` is required here to force right-alignment.


    ### Formatting the Year and Amount on Deposit Values in the `for` Loop

    The format string in line 22


    ```

    "{:>4d}{:>20.2f}\n"

    ```


    uses two placeholders to format the loop’s output. The placeholder `{:>4d}` indicates
    that `year`’s value should be formatted as an integer (`d`) right-aligned (`>`)
    in a field of width `4`. This right-aligns all the year values under the `"Year"`
    column.


    The placeholder `{:>20.2f}` formats `amount`’s value as a floating-point number
    (`f`) right-aligned (`>`) in a field width of `20` with a decimal point and two
    digits to the right of the decimal point (`.2`). Formatting the `amount`s this
    way *aligns their decimal points vertically*, as is typical with monetary amounts.
    The field width of 20 right-aligns the `amount`s under `"Amount on Deposit"`.


    ### 4.16 Wrap-Up

    In this chapter, we completed our introduction to all but one of C++’s control
    statements, which enable you to control the flow of execution in member functions.
    [Chapter 3](#ch03.xhtml_ch03) discussed `if`, `if…else` and `while`. [Chapter
    4](#ch04.xhtml_ch04) demonstrated `for`, `do…while` and `switch`. We showed C++17’s
    enhancements that allow you to initialize a variable in the header of an `if`
    and `switch` statement. You used the `break` statement to exit a `switch` statement
    and to terminate a loop immediately. You used a `continue` statement to terminate
    a loop’s current iteration and proceed with the loop’s next iteration. We introduced
    C++’s logical operators, which enable you to use more complex conditional expressions
    in control statements. We showed C++20’s attributes `[[likely]]` and `[[unlikely]]`
    for hinting to the compiler which paths of execution are likely or unlikely to
    execute in selection statements. In our objects-natural case study, we used the
    miniz-cpp open-source library to create and read compressed ZIP archive files.
    Finally, we introduced more of C++20’s powerful and expressive text-formatting
    features. In [Chapter 5](#ch05.xhtml_ch05), you’ll create your own custom functions.


