  trans: "\n\n对于某些问题，让函数调用自身是非常有用的。`recursive function`（递归函数）是指一个调用自身的函数，可以是直接调用或间接调用（通过另一个函数）。本节和下一节将介绍递归的简单示例。高级计算机科学课程会详细讨论递归。\n\
    \n## 递归概念\n\n我们首先从概念上考虑递归，然后检查包含递归函数的程序。递归问题的解决方法有几个共同点。调用一个递归函数来解决问题。该函数只知道如何解决最简单的情况，所谓的\
    \ `base case(s)`（基准情况）。如果调用函数时提供的是基准情况，函数将直接返回结果。如果调用函数时提供的是更复杂的问题，它通常会将问题分为两个概念部分：一个函数知道如何处理的部分，以及一个它不知道如何处理的部分。为了使递归可行，后一个部分必须与原始问题相似，但是一个稍微简单或更小的版本。这个新问题看起来与原始问题相似，因此函数调用它自己的副本来处理较小的问题——这被称为\
    \ `recursive call`（递归调用），也称为 `recursion step`（递归步）。递归步通常包含关键字 `return`，因为它的结果将将与函数已知如何解决的问题部分结合，形成传回给原始调用者（可能是\
    \ `main`）的结果。\n\n省略基准情况或错误地编写递归步导致无法收敛到基准情况，会导致无限递归错误，通常会导致栈溢出（stack overflow）。这比比迭代（非递归）解决方案中的无限循环问题。无意中让非递归函数调用自身（直接调用或通过另一个函数间接调用）也会导致无限递归。\n\
    \n递归步在原始函数调用仍处于“打开”状态（即尚未完成执行）时继续执行。递归步可能会产生更多这样的递归调用，因为函数会不断地将调用该函数的每个新子问题划分为两个概念部分。为了让递归最终终止，每当函数带着原始问题的稍微简单版本再次调用自身时，这一系列由大到小的问题必须最终收敛到基准情况。在那个点，函数识别出基准情况，并将结果返回给函数的上一个副本。然后，会发生一系列返回操作，一直向上，直到原始调用最终将最终结果返回给\
    \ `main`。与我们在此为止所使用的解决问题的方法相比，这听起来相当奇特。作为这些概念应用的示例，让我们写一个递归程序来执行一种流行的数学计算。\n\n\
    C++ 标准文档表明，程序内部不应调用 `main`（第 6.9.3.1 节）或递归调用（第 7.6.1.2 节）。它的唯一目的是作为程序执行的起点。\n\n\
    ## 阶\n\n非负整数 `n` 的阶写作 `n!`（读作“`n` factorial”），是乘积\n\n`n · (`n` – 1) · (`n` – 2)\
    \ · … · 1`\n\n其中 `1!` 等于 1，且 `0!` 定义为 1。例如，`5!` 是乘积 `5 · 4 · 3 · 2 · 1`，等于 120。\n\
    \n## 迭代阶\n\n大于或等于 0 的整数 `number` 的阶可以使用 `for` 语句通过 `iteratively`（迭代/非递归）方式计算：\n\
    \n```cpp\nint factorial{1};\n\nfor (int counter{number}; counter >= 1; --counter)\
    \ {\n   factorial *= counter;\n}\n```\n\n## 递归阶\n\n通过观察以下代数关系，可以得到阶函数的递归定义：\n\n\
    `n! = n · (`n` – 1)!`\n\n例如，`5!` 显然等于 `5 * 4!`，如下所示：\n\n`5! = 5 · 4 · 3 · 2 ·\
    \ 1`\n`5! = 5 · (4 · 3 · 2 · 1)`\n`5! = 5 · (4!)`\n\n## 计算 5!\n\n`5!` 的求值将如下图所示进行，该图说明了连续递归调用如何进行，直到\
    \ `1!` 求值为 1，从而终止递归。图的 (b) 部分显示了每个递归调用返回给调用者的值，直到最终值被计算并返回。\n\n![Images](img/05unfig01.jpg)\n\
    \n## 使用递归 `factorial` 函数计算阶\n\n图 5.16 使用递归来计算并打印整数 0–10 的阶。递归函数 `factorial`（第\
    \ 18–25 行）首先确定终止条件 `number <= 1`（即基准情况；第 19 行）是否为真。如果 `number` 小于或等于 1，`factorial`\
    \ 函数返回 1（第 20 行），不再需要进一步递归，函数终止。如果 `number` 大于 1，第 23 行将问题表示为 `number` 与递归调用 `factorial`\
    \ 计算 `number - 1` 的阶的积，这是一个比原始计算 `factorial(number)` 稍微简单的问题。\n\n![Images](img/05fig16.jpg)![Images](img/05fig16a.jpg)\n\
    \n**图 5.16** 递归函数 `factorial`。（两部分中的第一部分。）\n\n## 阶的值增长迅速\n\n函数 `factorial` 接收类型为\
    \ `long` 的参数并返回类型为 `long` 的结果。通常，`long` 至少占用四个字节（32 位）；此类变量可以存储 -2,147,483,647\
    \ 到 2,147,483,647 之间的值。遗憾的是，`factorial` 函数产生大值的速度非常快，`long` 类型无法帮助我们计算许多值。对于更大的整数值，可以使用\
    \ `long long` 类型（3.11）或表示任意大小整数的类（例如我们在 3.12 中引入的开源 `BigNumber` 类）。\n\n### 使用递归：斐波那契数列\n\
    \n斐波那契数列\n\n0, 1, 1, 2, 3, 5, 8, 13, 21, …\n\n从 0 和 1 开始，具有每个后续斐波那契数都是前两个数之和的特性。\n\
    \n该数列存在于自然界中，特别是描述了一种螺旋形状。相邻斐波那契数之间的比值收敛于 1.618…… 这个常数。这个数字在自然界经常出现，被称为 `golden\
    \ ratio`（黄金分割）或 `golden mean`（黄金比例）。人类倾向于认为黄金比例具有美感。建筑师经常设计长宽比例为黄金比例的窗户、房间和建筑。搜索“自然中的\
    \ Fibonacci”可以发现许多有趣的例子，包括花瓣、贝壳、螺旋星系、飓风等。\n\n## 递归斐波那契定义\n\n斐波那契数列可以如下递归定义：\n\n\
    `fibonacci(0) = 0`\n`fibonacci(1) = 1`\n`fibonacci(n) = fibonacci(n – 1) + fibonacci(n\
    \ – 2)`\n\n图 5.17 中的程序通过使用 `fibonacci` 函数递归地计算 n 个斐波那契数。图 5.17 显示了程序的执行情况，显示了几个数字的斐波那契值。\n\
    \n![Images](img/05fig17.jpg)![Images](img/05fig17a.jpg)\n\n**图 5.17** 递归函数 `fibonacci`。（两部分中的第一部分。）\n\
    \n"
