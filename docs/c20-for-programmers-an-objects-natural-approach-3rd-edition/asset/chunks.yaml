    \nelse {\n\n   cout << \"F\";\n\n}\n```\n\nThis form avoids deep indentation of\
    \ the code to the right, which can force lines to wrap. Throughout the text, we\
    \ always enclose control statement bodies in braces (`{` and `}`), which avoids\
    \ a logic error called the “dangling-`else`” problem.\n\n#### 3.4.2 Blocks\n\n\
