    In this section, we create a user-defined function called `maximum` that returns
    the largest of its three `int` arguments. When the application in [Fig. 5.1](#ch05.xhtml_fig5_1)
    executes, the `main` function first reads three integers from the user. Then,
    the output statement (lines 15–16) calls `maximum`, which is defined in lines
    20–34. In line 33, function `maximum` returns the largest value to the point of
    the `maximum` call (line 16), which is an output statement that displays the result.
    The sample outputs show that `maximum` determines the largest value regardless
    of whether it’s the first, second or third argument.


    ![Images](Images/05fig01.jpg)


    **Fig. 5.1** `maximum` function with a function prototype.


    ## Function `maximum`


    Typically, a function definition’s first line specifies its return type, function
    name and parameter list, which is enclosed in required parentheses. The parameter
    list specifies additional information that the function needs to perform its task.
    The function’s first line is also known as the function’s header. A parameter
    list may contain zero or more parameters, each declared with a type and a name.
    Two or more parameters are specified using a comma-separated list of parameters.
    Function `maximum`’s header indicates that the function has three `int` parameters
    named `x`, `y` and `z`. When you call a function, each parameter receives the
    corresponding argument’s value from the function call.


    Function `maximum` first assumes that parameter `x` has the largest value, so
    line 21 initializes local variable `maximumValue` to parameter `x`’s value. Of
    course, parameter `y` or `z` may contain the actual largest value, so each of
    these must be compared with `maximumValue`. Lines 24–26 determine whether `y`
    is greater than `maximumValue` and, if so, assign `y` to `maximumValue`. Lines
    29–31 determine whether `z` is greater than `maximumValue` and, if so, assign
    `z` to `maximumValue`. At this point, the largest value is in `maximumValue`,
    so line 33 returns that value to the caller.


    ## Function Prototype for `maximum`


    You must either define a function before using it or declare it, as in line 7:


    ```

    int maximum(int x, int y, int z); // function prototype

    ```


    This function prototype describes the interface to the `maximum` function without
    revealing its implementation. A function prototype tells the compiler the function’s
    name, return type and the types of its parameters. Line 7 indicates that `maximum`
    returns an `int` and requires three `int` parameters to perform its task. The
    types in the function prototype should be the same as those in the corresponding
    function definition’s header (line 20). The function prototype ends with a required
    semicolon. We’ll see that the names in the function prototype’s parameters do
    not need to match those in the function definition.


    ### Parameter Names in Function Prototypes


    Parameter names in function prototypes are optional (the compiler ignores them),
    but it’s recommended that you use these names for documentation purposes.


    ### What the Compiler Does with `maximum`’s Function Prototype


    When compiling the program, the compiler uses the prototype to:


    - Ensure that `maximum`’s first line (line 20) matches its prototype (line 7).

    - Check that the call to `maximum` (line 16) contains the correct number and types
    of arguments, and that the types of the arguments are in the correct order (in
    this case, all the arguments are of the same type).

    - Ensure that the value returned by the function can be used correctly in the
    expression that called the function—for example, a function that does not return
    a value (declared with the `void` return type) cannot be called on the right side
    of an assignment.

    - Ensure that each argument is consistent with the type of the corresponding parameter—for
    example, a parameter of type `double` can receive values like 7.35, 22 or –0.03456,
    but not a string like `"hello"`. If the arguments passed to a function do not
    match the types specified in the function’s prototype, the compiler attempts to
    convert the arguments to those types. Section 5.6 discusses this conversion process
    and what happens if the conversion is not allowed.


    Compilation errors occur if the function prototype, header and calls do not all
    agree in the number, type and order of arguments and parameters, and in the return
    type. For calls, the compiler checks whether the function’s return value (if any)
    can be used where the function was called.


    ### Returning Control from a Function to Its Caller


    When a program calls a function, the function performs its task, then returns
    control (and possibly a value) to the point where the function was called. In
    a function that does not return a result (i.e., it has a `void` return type),
    control returns when the program reaches the function-ending right brace. A function
    can explicitly return control (and no result) to the caller by executing


    ```

    return;

    ```


    anywhere in the function’s body.


    ## 5.5 Order of Evaluation of a Function’s Arguments


    Multiple parameters are specified in function prototypes, function headers and
    function calls as comma-separated lists. The commas in line 16 of [Fig. 5.1](#ch05.xhtml_fig5_1)
    that separate function `maximum`’s arguments are not comma operators. The comma
    operator guarantees that its operands evaluate left-to-right. The order of evaluation
    of a function’s arguments, however, is not specified by the C++ standard. Thus,
    different compilers can evaluate function arguments in different orders.


    Sometimes when a function’s arguments are expressions, such as calls to other
    functions, the order in which the compiler evaluates the arguments could affect
    the values of one or more the arguments. If you have doubts about the order of
    evaluation of arguments and whether the order would affect the values, assign
    the arguments to variables before the call, then pass those variables to the function.


    ## 5.6 Function-Prototype and Argument-Coercion


    A function prototype is required unless the function is defined before it is used.
    When you use a standard library function like `sqrt`, you do not have access to
    the function’s definition, so it cannot be defined in your code before you call
    the function. Instead, you must include its corresponding header (in this case,
    `<cmath>`), which contains the function’s prototype.


    If a function is defined before it’s called, then its definition also serves as
    the function’s prototype, so a separate prototype is unnecessary. If a function
    is called before it’s defined, and that function does not have a function prototype,
    a compilation error occurs.


    Always provide function prototypes, even though it’s possible to omit them when
    functions are defined before they’re used. Providing the prototypes avoids tying
    the code to the order in which functions are defined (which can easily change
    as a program evolves).


    ### 5.6.1 Function Signatures and Function Prototypes


    A function’s name and its argument types together are known as the function signature
    or simply the signature. The function’s return type is not part of the function
    signature. The scope of a function is the region of a program in which the function
    is known and accessible. Functions in the same scope must have unique signatures.
    We’ll say more about scope in Section 5.11.


    In [Fig. 5.1](#ch05.xhtml_fig5_1), if the function prototype in line 7 had been
    written


    ```

    void maximum(int x, int y, int z);

    ```


    the compiler would report an error, because the `void` return type in the function
    prototype would differ from the `int` return type in the function header. Similarly,
    such a prototype would cause the statement


    ```

    cout << maximum(6, 7, 0);

    ```

