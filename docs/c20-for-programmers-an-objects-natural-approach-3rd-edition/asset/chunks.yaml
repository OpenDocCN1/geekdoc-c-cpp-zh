    ##### Playing the Game Again or Exiting the Application


    After you guess the correct number, the application asks if you’d like to play
    another game. At the `"Would you like to play again (y or n)?"` prompt, entering
    **`y`** causes the application to choose a new number and start a new game. Entering
    **`n`** terminates the application. Each time you execute this application from
    the beginning (*Step 7*), it will choose the same numbers for you to guess.


    ##### Reusing This Project for Subsequent Examples


    You can follow the steps in this section to create a separate project for every
    application in the book. However, for our examples, you may find it more convenient
    to remove the current program from the project then add a new one. To remove a
    file from your project (but not your system), right-click the file in the Project
    navigator and select Delete. In the dialog that appears, select Move to Trash.
    You can then repeat *Step 6* to add a different program to the project.


    #### 1.2.3 Compiling and Running a C++20 Application with GNU C++ on Linux


    For this test drive, we assume that you read the Before You Begin section and
    that you placed the downloaded examples in your user account’s `Documents` folder.


    ##### Step 1: Changing to the `ch01` Folder


    From a Linux shell, use the `cd` command to change to the `ch01` subfolder of
    the book’s `examples` folder:


    ```

    ~$ cd ~/Documents/examples/ch01


    ~/Documents/examples/ch01$

    ```


    In this section’s figures, we use **`bold`** to highlight the text that you type.
    The prompt in our Ubuntu Linux shell uses a tilde (`~`) to represent the home
    directory. Each prompt ends with the dollar sign (`$`). The prompt may differ
    on your Linux system.


    ##### Step 2: Compiling the Application


    Before running the application, you must first compile it:


    ```

    ~/Documents/examples/ch01$ g++ -std=c++2a GuessNumber.cpp -o GuessNumber


    ~/Documents/examples/ch01$

    ```


    The `g++` command compiles the application:


    • The `-std=c++2a` option indicates that we’re using C++20—`c++2a` will become
    `c++20` in a future GNU C++ release.


    • The `-o` option names the executable file (`GuessNumber`) that you’ll use to
    run the program.


    ##### Step 3: Running the Application


    Type `./GuessNumber` at the prompt and press *Enter* to run the program:


    ```

    ~/Documents/examples/ch01$ ./GuessNumber


    I have a number between 1 and 1000.


    Can you guess my number?


    Please type your first guess.


    ?

    ```


    The `./` tells Linux to run a file from the current directory and is required
    to indicate that `GuessNumber` is an executable file.


    ##### Step 4: Entering Your First Guess


    The application displays `"Please type your first guess."`, then displays a question
    mark (`?`) as a prompt on the next line. At the prompt, enter **`500`**—note that
    the outputs may vary based on the compiler you’re using:


    ```

    ~/Documents/examples/ch01$ ./GuessNumber


    I have a number between 1 and 1000.


    Can you guess my number?


    Please type your first guess.


    ? 500


    Too high. Try again.


    ?

    ```


    The application displays `"Too high. Try again."`, meaning that the value you
    entered is greater than the number the application chose as the correct guess.


    ##### Step 5: Entering Another Guess


    At the next prompt, enter **`250`**:


    ```

    ~/Documents/examples/ch01$ ./GuessNumber


    I have a number between 1 and 1000.


    Can you guess my number?


    Please type your first guess.


    ? 500


    Too high. Try again.


    ? 250


    Too low. Try again.


    ?

    ```


    This time the application displays `"Too low. Try again."`, because the value
    you entered is less than the correct guess.


    ##### Step 6: Entering Additional Guesses


    Continue to play the game by entering values until you guess the correct number.
    When you guess correctly, the application displays `"Excellent! You guessed the
    number."`:


    ```

    Too low. Try again.


    ? 375


    Too low. Try again.


    ? 437


    Too high. Try again.


    ? 406


    Too high. Try again.


    ? 391


    Too high. Try again.


    ? 383


    Too low. Try again.


    ? 387


    Too high. Try again.


    ? 385


    Too high. Try again.


    ? 384


    Excellent! You guessed the number.


    Would you like to play again (y or n)?

    ```


    ##### Step 7: Playing the Game Again or Exiting the Application


    After you guess the correct number, the application asks if you’d like to play
    another game. At the `"Would you like to play again (y or n)?"` prompt, entering
    **`y`** causes the application to choose a new number and start a new game. Entering
    **`n`** terminates the application and returns you to the shell. Each time you
    execute this application from the beginning (*Step 3*), it will choose the same
    numbers for you to guess.


    #### 1.2.4 Compiling and Running a C++20 Application with GNU C++ in the GCC Docker
    Container in Docker Running Natively Over Windows 10, macOS and/or Linux


    At the time of this writing, GNU C++ implements the most C++20 features. For this
    reason, you may want to use the latest GNU C++ compiler on your system. One of
    the most convenient cross-platform ways to do this is by using the GNU Compiler
    Collection (GCC) Docker container. This section assumes you’ve already installed
    Docker Desktop (Windows or macOS) or Docker Engine (Linux).


    ##### Executing the GNU Compiler Collection (GCC) Docker Container


    Open a Command Prompt (Windows), Terminal (macOS/Linux) or shell (Linux), then
    perform the following steps to launch the GCC Docker Container:


    **1.** Use the `cd` command to navigate to the `examples` folder containing this
    book’s examples.


    **2.** Windows users: Launch the GCC docker container with the command


    ```

    docker run --rm -it -v "%CD%":/usr/src gcc:latest

    ```


    **3.** macOS/Linux users: Launch the GCC docker container with the command


    ```

    docker run --rm -it -v "$(pwd)":/usr/src gcc:latest

    ```


    In the preceding commands:


    • `--rm` cleans up the container’s resources when you eventually shut it down.


    • `-it` runs the container in interactive mode, so you can enter commands to change
    folders and to compile and run programs using the GNU C++ compiler.


    • `-v "%CD%":/usr/src` (Windows) or `-v "$(pwd)":/usr/src` (macOS/Linux) allows
    the Docker container to access your local system files in the folder from which
    you executed the `docker run` command. In the Docker container, you’ll navigate
    with the `cd` command to subfolders of `/usr/src` to compile and run the C++ code.


    • `gcc:latest` is the container name. The `:latest` specifies that you want to
    use the most up-to-date version of the `gcc` container. Each time you execute
    the preceding `docker run` commands, Docker checks whether you have the latest
    `gcc` container version. If not, Docker downloads it before executing the container.


    Once the container is running, you’ll see a prompt like:


    ```

    root@67773f59d9ea:/#

    ```'
