  trans: "\n\n要指定引用参数不允许修改调用者中对应的参数，请在参数声明的类型名之前放置 `const` 修饰符。例如，考虑一个 `displayName`\
    \ 函数：\n\n```\nvoid displayName(std::string name) {\n   std::cout << name << std::endl;\n\
    }\n```\n\n调用时，它接收的是其 `string` 参数的拷贝。由于 `string` 对象可能很大，这种拷贝操作可能会降低应用程序的性能。因此，`string`\
    \ 对象（以及普通对象）应该通过引用方式传递给函数。\n\n此外，`displayName` 函数不需要修改其参数，因此根据最小权限原则，我们将参数声明为：\n\
    \n```cpp\nconst std::string& name\n```\n\n![Images](img/common01.jpg) 性能 ![Images](img/common02.jpg)\
    \ 安全 从右到左读这段代码，`name` 参数是指向一个 `string` 常量的引用。我们获得了通过引用传递 `string` 的性能优势。同时，`displayName`\
    \ 将参数视为常量，因此 `displayName` 修改调用者中的值——因此我们获得了按值传递的安全性。\n\n### 返回局部变量的引用\n\n函数可以返回局部变量的引用，但这是危险的。当返回非\
    \ `static` 局部变量的引用时，该引用指向一个在函数终止时会被弃的变量。访问此类变量会导致未定义行为，通常会导致程序崩溃或数据损坏.^(16) 对未定义变量的引用被称为**悬空引用\
    \ (dangling references)**。这是一种逻辑错误，编译器通常会发出警告。软件工程团队通常有策略要求代码在部署之前必须在无警告的情况下编译。\n\
    \n16. C++ Core Guidelines. 访问于 2020 年 5 月 11 日 [`https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rf-dangle`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rf-dangle)。\n\
    \n### 5.14 默认参数\n\n程序经常会对特定参数使用相同的参数值反复调用函数。在这种情况下，你可以指定该参数具有**默认参数**，即传递给该参数的默认值。当程序在函数调用中省略具有默认参数的参数时，编译器会重写函数调用，插入该参数的默认值。\n\
    \n#### 带有默认参数的 `boxVolume` 函数\n\nFigure 5.10 展示了使用默认参数计算箱体体积。`boxVolume` 的函数原型（第\
    \ 7 行）通过在每个参数的右侧放置 `= 1`，指定了三个参数的默认值均为 `1`。\n\n![Images](img/05fig10.jpg)![Images](img/05fig10a.jpg)\n\
    \n**图 5.10** 使用默认参数。（部分 1，共 2 部分。）\n\n对 `boxVolume` 的第一次调用（第 11 行）未指定参数，因此使用了三个默认值，均为\
    \ 1。第二次调用（第 15 行）只传递了 `length` 参数，因此 `width` 和 `height` 参数使用默认值 1。第三次调用（第 19 行）仅传递了\
    \ `length` 和 `width` 参数，因此 `height` 参数使用默认值 1。最后一次调用（第 23 行）传递了 `length`、`width`\
    \ 和 `height` 参数，因此不使用默认值。任何显式传递给函数的参数都会从左到右分配给函数的参数。因此，当 `boxVolume` 接收一个参数时，函数将该参数的值赋值给其\
    \ `length` 参数（即参数列表中最左侧的参数）。当 `boxVolume` 接收两个参数时，函数按顺序将这些参数的值赋值给其 `length` 和\
    \ `width` 参数。最后，当 `boxVolume` 接收三个参数时，函数分别将这些参数的值赋值给其 `length`、`width` 和 `height`\
    \ 参数。\n\n#### 关于默认参数的注意事项\n\n默认参数必须是函数参数列表中最右侧（尾随）的参数。调用带有两个以上默认参数的函数时，如果省略的不是最后一个，那么该参数右侧的所有参数也必须省略。默认参数必须在函数名第一次出现时指定——通常在函数原型中。如果因为函数定义同时也作为原型而省略了函数原型，则默认参数应在函数头中指定。默认值可以是任何表达式，包括常量、全局变量或函数调用。默认参数也可以用于\
    \ `inline` 函数。使用默认参数可以简化函数调用的编写，但某些程序员认为显式指定所有参数更加清晰。\n\n### 5.15 一元作用域解析运算符\n\
    \nC++ 提供了**一元作用域解析运算符 (`::`)**，用于在作用范围内存在同名局部变量时访问全局变量。一元作用域解析运算符不能用于访问外部代码块中同名的局部变量。如果全局变量名与作用域内的局部变量名不同，则可以直接访问全局变量而无需一元作用域解析运算符。\n\
    \nFigure 5.11 显示了带有局部和全局变量的一元作用域运算符（第 6 和第 9 行）。\n\n![Images](img/05fig11.jpg)\n\
    \n**图 5.11** 一元作用域运算符\n\n始终使用作用域解析运算符 (`::`) 来引用全局变量（即使与局部变量名没有冲突）。这可以清楚地表明你正在访问全局变量而非局部变量。它还通过降低冲突风险使程序更容易修改。避免为不同目的使用同名的变量。\n\
    \n### 5.16 函数重载\n\nC++ 允许定义多个同名的函数，只要它们的签名不同。这被称为**函数重载**。C++ 编译器通过检查调用中参数的数量、类型和顺序来选择要调用的正确函数。函数重载用于创建多个执行相似任务但处理不同类型数据的同名函数。例如，数学库中的许多函数针对不同的数值类型进行了重载——C++\
    \ 标准要求第 5.3 节中的数学库函数具有 `float`、`double` 和 `long double` 重载版本。重载执行密切相关的任务可以让程序更加清晰。\n\
    \n#### 重载的 `square` 函数\n\nFigure 5.12 使用重载的 `square` 函数计算 `int` 的平方（第 7-10 行）和\
    \ `double` 的平方（第 13-16 行）。第 19 行通过传递字面量 `7` 调用 `square` 的 `int` 版本。C++ 将整数字面量视为\
    \ `int` 类型。同样，第 21 行通过传递字面量 `7.5` 调用 `square` 的 `double` 版本，C++ 将 `7.5` 视为 `double`。在每情况下，编译器根据参数的类型选择正确的函数。输出证实了在每情况下都调用了正确的函数。\n\
    \n![Images](img/05fig12.jpg)![Images](img/05fig12a.jpg)\n\n**图 5.12** 重载的 `square`\
    \ 函数。（部分 1，共 2 部分。）\n\n##### 编译器如何区分重载函数\n\n"
- fmt: "\nOverloaded functions are distinguished by their signatures. A signature\
    \ is a combination of a function’s name and its parameter types (in order). `Type-safe\
    \ linkage` ensures that the proper function is called and that the types of the\
    \ arguments conform to the types of the parameters. To enable type-safe linkage,\
    \ the compiler internally encodes each function identifier with the types of its\
    \ parameters—a process referred to as `name mangling`. These encodings vary by\
    \ compiler, so everything that will be linked to create an executable for a given\
    \ platform must be compiled using the same compiler for that platform. [Figure\
    \ 5.13](#ch05.xhtml_fig5_13) was compiled with GNU C++.^([17](#ch05.xhtml_ch0fn17))\
    \ Rather than showing the execution output of the program as we normally would,\
    \ we show the mangled function names produced in assembly language by GNU C++.\
    \ ^([18](#ch05.xhtml_ch0fn18))\n\n[17](#ch05.xhtml_rch0fn17). The empty-bodied\
    \ `main` function ensures that we do not get a linker error if we compile this\
    \ code.\n\n[18](#ch05.xhtml_rch0fn18). The command `g++ -S fig05_13.cpp` produces\
    \ the assembly language file `fig05_14.s`.\n\n![Images](Images/05fig13.jpg)![Images](Images/05fig13a.jpg)\n\
    \n**Fig. 5.13** Name mangling to enable type-safe linkage. (Part 1 of 2.)\n\n\
    For GNU C++, each mangled name (other than `main`) begins with an underscore (`_`)\
    \ followed by the letter `Z`, a number and the function name. The number that\
    \ follows `Z` specifies how many characters are in the function’s name. For example,\
    \ function `square` has 6 characters in its name, so its mangled name is prefixed\
    \ with `_Z6`. Following the function name is an encoding of its parameter list:\n\
    \n* For function `square` that receives an `int` (line 5), `i` represents `int`,\
    \ as shown in the output’s first line.\n* For function `square` that receives\
    \ a `double` (line 10), `d` represents `double`, as shown in the output’s second\
    \ line.\n* For function `nothing1` (line 16), `i` represents an `int`, `f` represents\
    \ a `float`, `c` represents a `char`, and `Ri` represents an `int&` (i.e., a reference\
    \ to an `int`), as shown in the output’s third line.\n* For function `nothing2`\
    \ (line 20), `c` represents a `char`, `i` represents an `int`, `Rf` represents\
    \ a `float&`, and `Rd` represents a `double&`.\n\nThe compiler distinguishes the\
    \ two `square` functions by their parameter lists—one specifies `i` for `int`\
    \ and the other `d` for `double`. The return types of the functions are not specified\
    \ in the mangled names. Overloaded functions can have different return types,\
    \ but if they do, they must also have different parameter lists. Function-name\
    \ mangling is compiler-specific. For example, Visual C++ produces the name `square@@YAHH@Z`\
    \ for the square function at line 5. The GNU C++ compiler did not mangle `main`’s\
    \ name, but some compilers do. For example, Visual C++ uses `_main`.\n\nCreating\
    \ overloaded functions with identical parameter lists and different return types\
    \ is a compilation error. The compiler uses only the parameter lists to distinguish\
    \ between overloaded functions. Such functions need not have the same number of\
    \ parameters.\n\nA function with default arguments omitted might be called identically\
    \ to another overloaded function; this is a compilation error. For example, having\
    \ a program that contains both a function that explicitly takes no arguments and\
    \ a function of the same name that contains all default arguments results in a\
    \ compilation error when an attempt is made to use that function name in a call\
    \ passing no arguments. The compiler cannot unambiguously determine which version\
    \ of the function to choose.\n\n#### Overloaded Operators\n\nIn [Chapter 14](#ch14.xhtml_ch14),\
    \ we discuss how to overload operators to define how they should operate on objects\
    \ of user-defined data types. (In fact, we’ve been using many overloaded operators\
    \ to this point, including the stream insertion `<<` and the stream extraction\
    \ `>>` operators. These are overloaded for all the fundamental types. We say more\
    \ about overloading `<<` and `>>` to be able to handle objects of user-defined\
    \ types in [Chapter 14](#ch14.xhtml_ch14).)\n\n### 5.17 Function Templates\n\n\
    Overloaded functions are normally used to perform similar operations that involve\
    \ different program logic on different data types. If the program logic and operations\
    \ are identical for each data type, overloading may be performed more compactly\
    \ and conveniently by using `function templates`. You write a single function\
    \ template definition. Given the argument types provided in calls to this function,\
    \ C++ automatically generates separate `function template specializations` to\
    \ handle each type of call appropriately. Thus, defining a single function template\
    \ essentially defines a whole family of overloaded functions.\n\n##### `maximum`\
    \ Function Template\n\n[Figure 5.14](#ch05.xhtml_fig5_14) defines a `maximum`\
    \ function template that determines the largest of three values. All function\
    \ template definitions begin with the `template` keyword (line 3) followed by\
    \ a `template parameter list` enclosed in angle brackets (`<` and `>`). Every\
    \ parameter in the template parameter list is preceded by keyword `typename` or\
    \ keyword `class` (they are synonyms in this context).\n\n![Images](Images/05fig14.jpg)\n\
    \n**Fig. 5.14** Function template `maximum` header.\n\nThis function template\
    \ declares a single type parameter `T` (line 3) as a placeholder for the type\
    \ of data to be tested. The name of a type parameter must be unique in the template\
    \ parameter list for a particular template. When the compiler encounters a call\
    \ to `maximum` in the program source, the compiler substitutes the argument types\
    \ for `T` throughout the template definition, creating a complete function specialization\
    \ for the specified type.\n\n##### Using Function Template `maximum`\n\n[Figure\
    \ 5.15](#ch05.xhtml_fig5_15) uses the `maximum` function template to determine\
    \ the largest of three `int` values, three `double` values and three `char` values,\
    \ respectively (lines 15, 24 and 33). Because each call uses arguments of a different\
    \ type, “behind the scenes” the compiler creates a separate function definition\
    \ for each—one expecting three `int` values, one expecting three `double` values\
    \ and one expecting three `char` values, respectively.\n\n![Images](Images/05fig15.jpg)![Images](Images/05fig15a.jpg)\n\
    \n**Fig. 5.15** Function template `maximum` test program. (Part 1 of 2.)\n\n#####\
    \ `maximum` Function Template Specialization for Type `int`\n\nThe function template\
    \ specialization created for type `int` replaces each occurrence of `T` with `int`\
    \ as follows:\n\n```\nint maximum(int value1, int value2, int value3) {\n   int\
    \ maximumValue{value1}; // assume value1 is maximum\n\n   // determine whether\
    \ value2 is greater than maximumValue\n   if (value2 > maximumValue) {\n     \
    \ maximumValue = value2;\n   }\n\n   // determine whether value3 is greater than\
    \ maximumValue\n   if (value3 > maximumValue) {\n      maximumValue = value3;\n\
    \   }\n\n   return maximumValue;\n\n}\n```\n\n### 5.18 Recursion\n"
