    ### 4.1 Introduction


    17 20 This chapter introduces all but one of the remaining control statements—the
    `for`, `do…while`, `switch`, `break` and `continue` statements. We explore the
    essentials of counter-controlled iteration. We use compound-interest calculations
    to begin investigating the issues of processing monetary amounts. First, we discuss
    the representational errors associated with floating-point types. We use a `switch`
    statement to count the number of A, B, C, D and F grade equivalents in a set of
    numeric grades. We show C++17’s enhancements that allow you to initialize one
    or more variables of the same type in the headers of `if` and `switch` statements.
    We discuss the logical operators, which enable you to combine simple conditions
    to form compound conditions. We show C++20’s attributes `[[likely]]` and `[[unlikely]]`,
    which can help the compiler optimize selection statements by knowing which paths
    of execution are likely or unlikely to execute. In our objects-natural case study,
    we continue using objects of pre-existing classes with the miniz-cpp open-source
    library for creating and reading compressed ZIP archive files. Finally, we introduce
    more of C++20’s powerful and expressive text-formatting features.


