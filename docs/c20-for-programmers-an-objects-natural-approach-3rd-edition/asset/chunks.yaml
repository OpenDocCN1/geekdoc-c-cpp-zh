    \ of `std::cin`) because of line 7\\. First, a value is read into `number1`, then\
    \ a value is read into `number2`.\n\n##### Comparing Numbers\n\nThe `if` statement\
    \ in lines 18–20\n\n```\nif (number1 == number2) {\n\n   cout << number1 << \"\
    \ == \" << number2 << endl;\n\n}\n```\n\ndetermines whether the values of variables\
    \ `number1` and `number2` are equal. If so, the `cout` statement displays a line\
    \ of text indicating that the numbers are equal. For each condition that is `true`\
    \ in the remaining `if` statements starting in lines 22, 26, 30, 34 and 38, the\
    \ corresponding `cout` statement displays an appropriate line of text.\n\n#####\
    \ Braces and Blocks\n\nEach `if` statement in [Fig. 2.5](#ch02.xhtml_fig2_5) contains\
    \ a single body statement that’s indented to enhance readability. Also, notice\
    \ that we’ve enclosed each body statement in a pair of braces, `{ }`, creating\
    \ what’s called a **compound statement** or a **block**.\n\nYou don’t need to\
    \ use braces, `{ }`, around single-statement bodies, but you must include the\
    \ braces around multiple-statement bodies. Forgetting to enclose multiple-statement\
    \ bodies in braces leads to errors. To avoid errors, as a rule, always enclose\
    \ an `if` statement’s body statement(s) in braces.\n\n##### Common Logic Error:\
    \ Placing a Semicolon After a Condition\n\nPlacing a semicolon immediately after\
    \ the right parenthesis of the condition in an `if` statement is often a logic\
    \ error (although not a syntax error). The semicolon causes the body of the `if`\
    \ statement to be empty, so the `if` statement performs no action, regardless\
    \ of whether or not its condition is true. Worse yet, the original body statement\
    \ of the `if` statement now becomes a statement in sequence with the `if` statement\
    \ and always executes, often causing the program to produce incorrect results.\n\
    \n##### Splitting Lengthy Statements\n\nA lengthy statement may be spread over\
    \ several lines. If a statement must be split across lines, choose meaningful\
    \ breaking points, such as after a comma in a comma-separated list, or after an\
    \ operator in a lengthy expression. If a statement is split across two or more\
    \ lines, indent all subsequent lines and left-align the group of indented lines.\n\
    \n##### Operator Precedence and Grouping\n\nWith the exception of the assignment\
    \ operator `=`, all the operators presented in this chapter group from left-to-right.\
    \ Assignments (`=`) group from right-to-left. So, an expression such as `x = y\
    \ = 0` evaluates as if it had been written `x = (y = 0)`, which first assigns\
    \ `0` to `y`, then assigns the result of that assignment (that is, `0`) to `x`.\n\
    \nRefer to the complete operator precedence chart in [Appendix A](#app01.xhtml_app01)\
    \ when writing expressions containing many operators. Confirm that the operators\
    \ in the expression are performed in the order you expect. If you’re uncertain\
    \ about the order of evaluation in a complex expression, break the expression\
    \ into smaller statements or use parentheses to force the order of evaluation,\
    \ exactly as you’d do in an algebraic expression.\n\n### 2.7 Objects Natural:\
    \ Creating and Using Objects of Standard Library Class `string`\n\nThroughout\
    \ this book, we emphasize using preexisting valuable classes from the C++ standard\
    \ library and various open-source libraries from the C++ open-source community.\
    \ You’ll focus on knowing what libraries are out there, choosing the ones you’ll\
    \ need for your applications, creating objects from existing library classes and\
    \ making those objects exercise their capabilities. By Objects Natural, we mean\
    \ that you’ll be able to program with powerful objects before you learn to create\
    \ custom classes"
