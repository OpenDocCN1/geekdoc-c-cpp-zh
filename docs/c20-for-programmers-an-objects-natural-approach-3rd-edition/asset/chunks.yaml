    - 成员函数 `encrypt` 接收代表明文的 `string` 和密钥，使用维吉尼亚密码对对文进行加密，然后返回一个包含密文的 `string`。

    - 成员函数 `decrypt` 接收代表密文的 `string`，通过反向维吉尼亚密码对文本解密，然后返回一个包含明文的 `string`。


    程序首先要求你输入要加密的文本和密钥。第 17 行创建了 `Cipher` 对象。第 20–21 行加密你输入的文本并显示加密后的文本。然后，第 24–25
    行解密文本以向你展示输入的明文字符串。


    尽管本章的最后一个“目标”项目符号、第 5.1 节的最后一句以及本节的标题看起来像乱码，但它们都是我们用 `Cipher` 类和密钥创建的密文。


    ```

    XMWUJBVYHXZ

    ```


    第 28–29 行提示并输入现有的密文，然后第 30–31 行解密密文并显示我们之前加密的原始明文。


    ### 5.23 总结


    在本章中，我们介绍了函数概念，包括函数原型、函数签名、函数头和函数体。我们概述了数学库函数，以及 C++20、C++17 和 C++11 中新增的数学函数和常量。


    你学习了参数强制转换——将参数强制转换为函数参数声明中指定的适当类型。我们介绍了 C++ 标准库头文件的概述。我们演示了如何使用函数 `rand` 和 `srand`
    生成可用于模拟的随机数，然后介绍了 C++11 的非确定性能力，用以产生更安全的随机数。我们引入了 C++14 的数字分隔符，以提高大数值字面量的可读性。我们使用作用作用的
    `enum` 定义了常量集，并引入了 C++20 的 `using enum` 声明。


    你学习了变量的作用范围。我们讨论了向函数传递参数的两种方法——值传递和引用传递。我们展示了如何实现内联函数和接收默认参数的函数。你了解到重载函数具有相同的名称但不同的签名。此类函数可以使用不同的类型或不同数量的参数执行相同或相似的任务。我们演示了如何使用函数模板方便地生成一系列重载函数。接着你学习了递归，即函数通过调用自身来解决问题。


    我们介绍了 C++17 的 `[[nodiscard]]` 属性，用于指示函数的返回值不被忽略，并讨论了 C++20 中 `[[nodiscard]]` 的增强，用于指定不应忽略返回值的原因。最后，我们的面向对象案例介绍了用于加密和解密文本的密钥替换密码。


    在第 6 章中，你将学习如何在数组和面向对象的 `vector` 中维护数据列表和表格。你将看到更优雅的基于数组的骰子应用实现。


