    Dialect.


    ### Step 5: Deleting the `main.cpp` File from the Project

    By default, Xcode creates a `main.cpp` source-code file containing a simple program
    that displays `"Hello, World!"`. You won’t use `main.cpp` in this test-drive,
    so you should delete the file. In the Project navigator, right-click the `main.cpp`
    file and select `Delete`. In the dialog that appears, select `Move to Trash`.
    The file will not be removed from your system until you empty your trash.


    ### Step 6: Adding the `GuessNumber.cpp` File into the Project

    In a Finder window, open the `ch01` folder in the book’s `examples` folder, then
    drag `GuessNumber.cpp` onto the `Guess Number` folder in the Project navigator.
    In the dialog that appears, ensure that `Copy items if needed` is checked, then
    click `Finish`.

