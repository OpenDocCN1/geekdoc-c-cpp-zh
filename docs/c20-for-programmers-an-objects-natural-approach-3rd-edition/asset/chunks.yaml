- fmt: "\nIn conventional arithmetic, floating-point numbers often arise as a result\
    \ of division— when we divide 10 by 3, the result is 3.3333333…, with the sequence\
    \ of 3s repeating infinitely. The computer allocates only a fixed amount of space\
    \ to hold such a value, so the stored floating-point value can be only an approximation.\
    \ As you can see, `double` suffers from what is referred to as representational\
    \ error. Assuming that floating-point numbers are represented exactly (e.g., using\
    \ them in comparisons for equality) can lead to incorrect results.\n\nFloating-point\
    \ numbers have numerous applications, especially for measured values. For example,\
    \ when we speak of a “normal” body temperature of 98.6 degrees Fahrenheit, we\
    \ do not need to be precise to a large number of digits. When we read the temperature\
    \ on a thermometer as 98.6, it actually might be 98.5999473210643. Calling this\
    \ number 98.6 is fine for most applications involving body temperatures. Generally,\
    \ type `double` is preferred over type `float`, because `double` variables can\
    \ represent floating-point numbers more precisely. We use `double` throughout\
    \ the book.\n\n### A Warning about Displaying Rounded Values\n\nWe declared variables\
    \ `amount`, `principal` and `rate` to be of type `double` in this example. We’re\
    \ dealing with fractional parts of dollars and thus need a type that allows decimal\
    \ points in its values. Unfortunately, floating-point numbers can cause trouble.\
    \ Here’s a simple explanation of what can go wrong when using floating-point numbers\
    \ to represent dollar amounts that are displayed with two digits to the right\
    \ of the decimal point. Two calculated dollar amounts stored in the machine could\
    \ be 14.234 (rounded to 14.23 for display purposes) and 18.673 (rounded to 18.67\
    \ for display purposes). When these amounts are added, they produce the internal\
    \ sum 32.907, which would typically be rounded to 32.91 for display purposes.\
    \ Thus, your output could appear as\n\n```\n 14.23\n+ 18.67\n  32.91\n```\n\n\
    but a person adding the individual numbers as displayed would expect the sum to\
    \ be 32.90. You’ve been warned!\n\n### Even Common Dollar Amounts Can Have Representational\
    \ Error in Floating Point\n\nEven simple dollar amounts, such as those you might\
    \ see on a grocery or restaurant bill, can have representational errors when they’re\
    \ stored as `double`s. To see this, we created a simple program with the declaration\n\
    \n```\ndouble d = 123.02;\n```\n\nthen displayed variable `d`’s value with many\
    \ digits of precision to the right of the decimal point. The resulting output\
    \ showed 123.02 as 123.0199999…, which is another example of a representational\
    \ error. Though some dollar amounts can be represented precisely as `double`,\
    \ many cannot. This is a common problem in many programming languages. Later in\
    \ the book, we create and use classes that handle monetary amounts precisely.\n\
    \n### 4.7 do…while Iteration Statement\n\nThe `do…while` iteration statement is\
    \ similar to the `while` statement. In a `while` statement, the program tests\
    \ the loop-continuation condition at the beginning of the loop, before executing\
    \ the loop’s body. If the condition is false, the body never executes. The `do…while`\
    \ statement tests the loop-continuation condition after executing the loop’s body;\
    \ therefore, the body always executes at least once. When a `do…while` statement\
    \ terminates, execution continues with the next statement in sequence. [Figure\
    \ 4.5](#ch04.xhtml_fig4_5) uses a `do…while` to output the numbers 1–10.\n\n![Images](Images/04fig05.jpg)\n\
    \n**Fig. 4.5** `do…while` iteration statement.\n\nLine 7 declares and initializes\
    \ control variable `counter`. Upon entering the `do…while` statement, line 10\
    \ outputs `counter`’s value and line 11 increments `counter`. Then the program\
    \ evaluates the loop-continuation test at the bottom of the loop (line 12). If\
    \ the condition is true, the loop continues at the first body statement (line\
    \ 10). If the condition is false, the loop terminates, and the program continues\
    \ at the next statement after the loop.\n\n### UML Activity Diagram for the do…while\
    \ Iteration Statement\n\nThe UML activity diagram for the `do…while` statement\
    \ in [Fig. 4.5](#ch04.xhtml_fig4_5) makes it clear that the loop-continuation\
    \ condition is not evaluated until after the loop performs the action state at\
    \ least once:\n\n![Images](Images/04unfig03.jpg)\n\n### 4.8 switch Multiple-Selection\
    \ Statement\n\nC++ provides the `switch` multiple-selection statement to choose\
    \ among many different actions based on the possible values of a variable or expression.\
    \ Each action is associated with the value of an integral constant expression\
    \ (i.e., any combination of character and integer constants that evaluates to\
    \ a constant integer value).\n\n### Using a switch Statement to Count A, B, C,\
    \ D and F Grades\n\n[Figure 4.6](#ch04.xhtml_fig4_6) calculates the class average\
    \ of a set of numeric grades entered by the user. The `switch` statement determines\
    \ each grade’s letter equivalent (A, B, C, D or F) and increments the appropriate\
    \ grade counter. The program also displays a summary of the number of students\
    \ who received each grade.\n\n![Images](Images/04fig06.jpg)![Images](Images/04fig06a.jpg)![Images](Images/04fig06b.jpg)\n\
    \n**Fig. 4.6** Using a `switch` statement to count letter grades. (Part 1 of 3.)\n\
    \nThe `main` function ([Fig. 4.6](#ch04.xhtml_fig4_6)) declares local variables\
    \ `total` (line 8) and `gradeCounter` (line 9) to keep track of the sum of the\
    \ grades entered by the user and the number of grades entered, respectively. Lines\
    \ 10–14 declare and initialize to 0 counter variables for each grade category.\
    \ The `main` function has two key parts. Lines 24–51 input an arbitrary number\
    \ of integer grades using sentinel-controlled iteration, update variables `total`\
    \ and `gradeCounter`, and increment an appropriate letter-grade counter for each\
    \ grade entered. Lines 54–73 output a report containing the total of all grades\
    \ entered, the average grade and the number of students who received each letter\
    \ grade.\n\n### Reading Grades from the User\n\nLines 16–19 prompt the user to\
    \ enter integer grades or type the end-of-file indicator to terminate the input.\
    \ The end-of-file indicator is a system-dependent keystroke combination used to\
    \ indicate that there’s no more data to input. In [Chapter 9](#ch09.xhtml_ch09),\
    \ File Processing, you’ll see how the end-of-file indicator is used when a program\
    \ reads its input from a file.\n\nThe keystroke combinations for entering end-of-file\
    \ are system dependent. On UNIX/Linux/macOS systems, type the sequence `<Ctrl>\
    \ d` on a line by itself. This notation means to press both the *Ctrl* key and\
    \ the *d* key simultaneously. On Windows systems, type `<Ctrl> z` On some systems,\
    \ you must press *Enter* after typing the end-of-file key sequence. Also, Windows\
    \ typically displays the characters `^Z` on the screen when you type the end-of-file\
    \ indicator, as shown in the output of [Fig. 4.6](#ch04.xhtml_fig4_6).\n\nThe\
    \ `while` statement (lines 24–51) obtains the user input. Line 24\n\n```\nwhile\
    \ (cin >> grade) {\n```\n\nperforms the input in the `while` statement’s condition.\
    \ In this case, the loop-continuation condition evaluates to true if `cin` successfully\
    \ reads an `int` value. If the user enters the endof-file indicator, the condition\
    \ evaluates to false.\n\nIf the condition evaluates to true, line 25 adds `grade`\
    \ to `total` and line 26 increments `gradeCounter`. These variables are used to\
    \ compute the average of the grades. Next, lines 29–50 use a `switch` statement\
    \ to increment the appropriate letter-grade counter based on the numeric grade\
    \ entered.\n\n##### Processing the Grades\n"
