    ## 3.11 Fundamental Types Are Not Portable


    You can view the complete list of C++ fundamental types and their typical ranges
    at:


    ```

    https://en.cppreference.com/w/cpp/language/types own```


    In C and C++, an `int` on one machine might be represented by 16 bits (2 bytes)
    of memory, on a second machine by 32 bits (4 bytes), and on another machine by
    64 bits (8 bytes). For this reason, code using integers is not always portable
    across platforms. You could write multiple versions of your programs to use different
    integer types on different platforms. Or you could use techniques to achieve various
    levels of portability.([7](#ch03.xhtml_ch0fn7)) In the next section, we’ll show
    one way to achieve portability.


    [7](#ch03.xhtml_rch0fn7). The integer types in the header `<cstdint>` ([`https://en.cppreference.com/w/cpp/types/integer`](https://en.cppreference.com/w/cpp/types/integer))
    can be used to ensure that integer variables are correct size for your application
    across platforms.


    PERF Among C++’s integer types are `int`, `long` and `long long`. The C++ standard
    requires type `int` to be at least 16 bits, type `long` to be at least 32 bits
    and type `long long` to be at least 64 bits. The standard also requires that an
    `int`’s size be less than or equal to a `long`’s size and that a `long`’s size
    be less than or equal to a `long long`’s size. Such “squishy” requirements create
    portability challenges, but allow compiler implementers to optimize performance
    by matching fundamental types sizes to your machine’s hardware.


    ## 3.12 Objects Natural Case Study: Arbitrary Sized Integers


    The range of values an integer type supports depends on the number of bytes used
    to represent the type on a particular computer. For example, a four-byte `int`
    can store 2^(32) possible values in the range –2,147,483,648 to 2,147,483,647.
    On most systems, a `long long` integer is 8 bytes and can store 2^(64) possible
    values in the range –9,223,372,036,854,775,808 to 9,223,372,036,854,775,807.


    ### Some Applications Need Numbers Outside a `long long` Integer’s Range


    Consider factorial calculations. A factorial is the product of the integers from
    1 to a given value. The factorial of 5 (written 5!) is 1 * 2 * 3 * 4 * 5, which
    is 120. The highest factorial value we can represent in a 64-bit integer is 20!,
    which is 2,432,902,008,176,640,000. Factorials quickly grow outside the range
    representable by a `long long` integer. With big data getting bigger quickly,
    an increasing number of real-world applications will exceed the limitations of
    `long long` integers.


    ![Images](Images/common02.jpg) SECURITY Another application requiring extremely
    large integers is cryptography—an important aspect of securing data that’s transmitted
    between computers over the Internet. Many cryptography algorithms perform calculations
    using 128-bit or 256-bit integer values—far larger than we can represent with
    C++’s fundamental types.


    ### Arbitrary Precision Integers with Class `BigNumber`


    Any application requiring integers outside `long long`’s range requires special
    processing. Unfortunately, the C++ standard library does not (yet) have a class
    for arbitrary precision integers. So, for this example, we’ll dive into the vast
    world of open-source class libraries to demonstrate one of the many C++ classes
    that you can use to can create and manipulate arbitrary precision integers. We’ll
    use the class `BigNumber` from:


    ```

    https://github.com/limeoats/BigNumber

    ```


    For your convenience, we included the download in this example’s `fig03_05` folder.
    Be sure to read the license terms included in the provided `LICENSE.md` file.


    To use `BigNumber`, you don’t have to understand how it’s implemented.([8](#ch03.xhtml_ch0fn8))
    You simply include its header file (`bignumber.h`), create objects of the class
    then use them in your code. [Figure 3.5](#ch03.xhtml_fig3_5) demonstrates `BigNumber`
    and shows a sample output. For this example, we’ll use the maximum `long long`
    integer value to show that we can create an even bigger integer with `BigNumber`.
    At the end of this section, we show how to compile and run the code.


    [8](#ch03.xhtml_r0fn8).

