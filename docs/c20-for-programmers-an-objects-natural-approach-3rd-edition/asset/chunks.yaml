    ### 5.1 介绍

    在本章中，我们将介绍自定义函数。我们将概述 C++ 标准库的部分数学函数，并介绍 C++20、C++17 和 C++11 中新增的函数和常量。我们引入了函数原型，并讨论了编译器在必要时如何使用它们将函数调用中的参数类型转换为函数参数列表中指定的类型。我们还展示了
    C++ 标准库头文件的概述。


    接下来，我们将演示随机数生成的模拟技术。我们将开发一个流行的赌场游戏的版本，该游戏使用了我们目前为止介绍的大部分 C++ 功能。在游戏中，我们展示了如何在作用域
    `enum` 中声明常量，并讨论了使用 `using enum` 声明直接访问作用域 `enum` 常量而无需其类型名。

