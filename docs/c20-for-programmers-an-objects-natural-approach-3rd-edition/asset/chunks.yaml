  trans: "\n\n```cpp\n60  // roll dice, calculate sum and display results\n\n61  int\
    \ rollDice() {\n\n62     const int die1{1 + rand() % 6}; // first die roll\n63\
    \     const int die2{1 + rand() % 6}; // second die roll\n64     const int sum{die1\
    \ + die2}; // compute sum of die values\n\n65\n\n66  // display results of this\
    \ roll\n\n67       cout << \"Player rolled \" << die1 << \" + \" << die2\n68 \
    \         << \" = \" << sum << endl;\n69       return sum;\n\n70    }\n```\n\n\
    使用类型名和 `::` 对 `enum class` 常量进行限定限定，可以显式地标识该常量位于指定的 `enum class` 作用范围内。如果另一个 `enum\
    \ class` 包含相同的标识符，由于要求使用类型名和 `::`，因此始终很清楚在使用的是哪个常量。通常情况下，你应该为 `enum` 常量使用唯一的值，以帮助防止难以发现的逻辑错误。\n\
    \n另一个流行的作用域枚举是：\n\n```cpp\nenum class Months {jan = 1, feb, mar, apr, may, jun,\
    \ jul, aug,\n   sep, oct, nov, dec};\n```\n\n这创建了一个用户定义的 `enum class` 类型 `Months`，其枚举常量代表一年中的月份。上述枚举中的第一个值被显式地设置为\
    \ `1`，因此剩余的值从 `1` 开始递增，产生 `1` 到 `12` 的值。在枚举定义中，可以为任何枚举常量分配整数值。随后的每个枚举常量都比前一个常量大\
    \ 1，直到遇到下一次显式设置。\n\n### C++11 之前的枚举类型\n\n枚举也可以通过关键字 `enum` 后面跟一个类型名和一组由标识符表示的整数常量来定义，如下：\n\
    \n```cpp\nenum Status {keepRolling, won, lost}; own\n```\n\n此类 `enum` 中的常量是不带作用域的——你你可以直接通过它们的名称\
    \ `keepRolling`、`won` 和 `lost` 来引用它们。如果两个或多个不带作用域的 `enum` 包含相同的常量，可能会导致命名冲突和编译错误。\n\
    \n### 11 C++11—指定 `enum` 常量的类型\n\n枚举的常量具有整数值。不带作用域的 `enum` 的底层类型取决于其常量的值，并保证足够大以存储其常量的值。带作用域\
    \ `enum` 的底层整数类型是 `int`，但你可以通过在类型名后跟一个冒号（`:`）和整数类型来指定不同的类型。例如，我们可以指定 `enum class\
    \ Status` 中的常量应具有 `long` 类型，如下：\n\n```cpp\nenum class Status : long {keepRolling,\
    \ won, lost};\n```\n\n### 20 C++20—使用 `enum` 声明\n\n如果 `enum class` 常量的类型根据其被使用的上下文是显而易见的——例如在我们的骰子示例中——C++20\
    \ 的 `using enum` 声明允许你在不使用类型名和作用域解析运算符（`::`）的情况下引用 `enum class` 的常量。例如，在 `enum\
    \ class` 声明后添加以下语句：\n\n```cpp\nusing enum Status;\n```\n\n将允许程序的其余部分使用 `keepRolling`、`won`\
    \ 和 `lost`，而不是分别使用 `Status::keepRolling`、`Status::won` 和 `Status::lost`。你也可以通过如下形式的声明使用单个\
    \ `enum class` 常量：\n\n```cpp\nusing enum Status::keepRolling;\n```\n\n这将允许你的代码在没有\
    \ `Status::` 限定符的情况下使用 `keepRolling`。\n\n### 11 5.10 C++11 更安全的非确定随机数\n\n安全函数\
    \ `rand`——从 C 标准库继承到 C++ 中——没有“良好的统计特性”且是可以被预测的。这使得使用 `rand` 的程序不安全。C++11 提供了一个更安全的随机数能力库，可以产生`非确定随机数`——一组无法预测的随机数。此类随机数生成器用于在预测性是不理想的仿真和安全场景中。这些功能位于\
    \ C++ 标准库的 `<random>` 头文件中。\n\n##### 掷六面骰\n\n图 5.6 使用 `default_random_engine`\
    \ 和 `uniform_int_distribution` 来掷一个六面骰。第 14 行创建了一个名为 `engine` 的 `default_random_engine`\
    \ 对象。它的构造函数用当前时间为随机数生成器种子。如果你不向构造函数传递值，则将使用默认种子，程序每次执行时都会产生相同的数字序列。第 15 行创建了 `randomInt`——这是一个\
    \ `uniform_int_distribution` 对象，它产生 1 到 6 范围（由初始化器 `{1, 6}` 指定）内的 `int` 值（由 `<int>`\
    \ 指定）。表达式 `randomInt(engine)`（第 20 行）返回 1 到 6 范围内的一个 `int`。\n\n第 15 行中的符号 `<int>`\
    \ 表示 `uniform_int_distribution` 是一个类模板。在这种情况下，可以在角括号（`<` 和 `>`）中指定任何整数类型。在第 19\
    \ 章中，我们讨论了如何创建类模板，其他多个章节展示了如何使用 C++ 标准库中现有的类模板。目前，你可以通过模仿示例中的语法使用类模板 `uniform_int_distribution`。\n\
    \n"
- fmt: "\nIdentifiers declared inside a block have `block scope`, which begins at\
    \ the identifier’s declaration and ends at the terminating right brace (`}`) of\
    \ the enclosing block. Local variables have `block scope`, as do function parameters\
    \ (even though they’re declared outside the block’s braces). Any block can contain\
    \ variable declarations. When blocks are nested and an identifier in an outer\
    \ block has the same name as an identifier in an inner block, the one in the outer\
    \ block is “hidden” until the inner block terminates. The inner block “sees” its\
    \ own local variable’s value and not that of the enclosing block’s identically\
    \ named variable.\n\nAccidentally using the same name for an identifier in an\
    \ inner block that’s used for an identifier in an outer block when, in fact, you\
    \ want the identifier in the outer block to be active for the duration of the\
    \ inner block, is typically a logic error. Avoid variable names in inner scopes\
    \ that hide names in outer scopes. Most compilers will warn you about this.\n\n\
    Local variables also may be declared `static`. Such variables also have `block\
    \ scope`, but unlike other local variables, a `static` local variable retains\
    \ its value when the function returns to its caller. The next time the function\
    \ is called, the `static` local variable contains the value it had when the function\
    \ last completed execution. The following statement declares `static` local variable\
    \ `count` and initializes to 1:\n\n```\nstatic int count{1};\n```\n\nBy default,\
    \ all `static` local variables of numeric types are initialized to zero. The following\
    \ statement declares `static` local variable `count` and initializes it to `0`:\n\
    \n```\nstatic int count;\n```\n\nDefault initialization of non-fundamental-type\
    \ variables depends on the type—for example, a `string`’s default value is the\
    \ empty string (`\"\"`). We’ll say more about default initialization in later\
    \ chapters.\n\n### Global Namespace Scope\n\nAn identifier declared outside any\
    \ function or class has `global namespace scope`. Such an identifier is “known”\
    \ to all functions after its declaration in the source-code file. Function definitions,\
    \ function prototypes placed outside a function, class definitions and global\
    \ variables all have `global namespace scope`. `Global variables` are created\
    \ by placing variable declarations outside any class or function definition. Such\
    \ variables retain their values throughout a program's execution.\n\nDeclaring\
    \ a variable as global rather than local allows unintended side effects to occur\
    \ when a function that does not need access to the variable accidentally or maliciously\
    \ modifies it. Except for truly global resources such as `cin` and `cout`, you\
    \ should avoid global variables. This is an example of the `principle of least\
    \ privilege`, which is fundamental to good software engineering. It states that\
    \ code should be granted only the amount of privilege and access that it needs\
    \ to accomplish its designated task, but no more. An example of this is the scope\
    \ of a local variable, which should not be visible when it’s not needed. A local\
    \ variable is created when the function is called, used by that function while\
    \ it executes then goes away when the function returns. The principle of least\
    \ privilege makes your programs more robust by preventing code from accidentally\
    \ (or maliciously) modifying variable values that should not be accessible to\
    \ it.\n\nIn general, variables should be declared in the narrowest scope in which\
    \ they need to be accessed. Variables used only in a particular function should\
    \ be declared as local variables in that function rather than as global variables.\n\
    \n### Scope Demonstration\n\n[Figure 5.7](#ch05.xhtml_fig5_7) demonstrates scoping\
    \ issues with global variables, local variables, `static` variables and `main`.\
