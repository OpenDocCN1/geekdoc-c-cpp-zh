    \ `{fmt}` 库的背景下介绍了 C++20 新文本格式化。在第 4 章中，我们将继续讨论控制语句，引入 `for`、`do`…`while` 和 `switch`\
    \ 语句，并介绍用于创建复合条件的逻辑运算符。\n\n## 4. 控制语句（第二部分）\n\n![Images](img/ch04.jpg)\n\n###\
    \ 目标\n\n在本章中，你将：\n\n- 使用 `for` 和 `do`…`while` 迭代语句。\n\n- 使用 `switch` 选择语句执行多选。\n\
