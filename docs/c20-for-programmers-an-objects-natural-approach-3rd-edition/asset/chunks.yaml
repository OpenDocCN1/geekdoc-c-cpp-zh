  trans: "\n\n程序可以通过在其他 `if…else` 语句内部放置 `if…else` 语句来创建嵌套的 `if…else` 语句，从而测试多个情况。例如，下面的嵌套\
    \ `if…else` 语句对于成绩大于或等于 90 的情况打印 \"A\"，80 到 89 分的打印 \"B\"，70 到 79 分的打印 \"C\"，60\
    \ 到 69 分的打印 \"D\"，所有其他情况打印 \"F\"。我们使用阴影来突出嵌套结构。\n\n![Images](img/03unfig04.jpg)\n\
    \n如果变量 `studentGrade` 大于或等于 90，则嵌套 `if…else` 语句中的前四个条件都为真，但只有第一个 `if…else` 语句中\
    \ `if` 部分的语句会执行。在该语句执行后，“最外层” `if…else` 语句的 `else` 部分将被跳过。之前的嵌套 `if…else` 语句也可以写成以下形式，除了编译器忽略的空格和缩进外，这种形式是完全相同的：\n\
    \n```\nif (studentGrade >= 90) {\n   cout << \"A\";\n}\nelse if (studentGrade\
    \ >= 80) {\n   cout << \"B\";\n}\nelse if (studentGrade >= 70) {\n   cout << \"\
    C\";\n}\nelse if (studentGrade >= 60) {\n   cout << \"D\";\n}\nelse {\n   cout\
    \ << \"F\";\n}\n```\n\n这种形式避免了代码向右的深度缩进，深度缩进会导致强制换行。在整个范围内，我们始终将控制语句体包含在大括号（`{`\
    \ 和 `}`）中，这避免了被称为“悬空 `else`”问题的逻辑错误。\n\n#### 3.4.2 块 (Blocks)\n\n`if` 语句的体部分只期望一个语句。要在语句体中（或\
    \ `if…else` 语句的 `else` 体中）包含多个语句，请将这些语句用括号括起来。始终使用括号是一个良好的习惯。包含在一对括号中的语句（例如控制语句或函数的体）形成一个“块”。块可以放置在函数中任何单语句可以放置的地方。\n\
    \n以下示例在 `if…else` 语句的 `else` 部分包含了一个包含多个语句的块：\n\n```\nif (grade >= 60) {\n   cout\
    \ << \"Passed\";\n}\nelse\n{\n   cout << \"Failed\\n\";\n   cout << \"You must\
    \ retake this course.\";\n}\n```\n\n在这种情况下，如果 `grade` 小于 60，程序将执行 `else` 体中的两个语句，并打印：\n\
    \n```\nFailed\nYou must retake this course.\n```\n\n如果没有在 `else` 子句的两个语句周围加上括号，那么语句\n\
    \n```\ncout << \"You must retake this course.\";\n```\n\n将位于 `if…else` 语句 `else`\
    \ 体之外，并且无论成绩是否小于 60，它都会执行——这是一个逻辑错误。\n\n#### 空语句 (Empty Statement)\n\n正如块可以放置在任何单语句可以放置的地方一样，也可以有一个空语句，它通过在通常放置语句的地方放置一个分号（`;`）来表示。\n\
    \n#### 3.4.3 条件运算符 (`?:`)\n\nC++ 提供了条件运算符（`?:`），它可以替代 `if…else` 语句。这可以使你的代码更短、更清晰。条件运算符是\
    \ C++ 唯一的三元运算符（即接受三个操作数的运算符）。操作数与 `?:` 符号共同构成一个条件表达式。例如，以下语句\n\n```\ncout << (studentGrade\
    \ >= 60 ? \"Passed\" : \"Failed\");\n```\n\n打印条件表达式的值。`?` 左侧的操作数是一个条件。第二个操作数（在\
    \ `?` 和 `:` 之间）是当条件为真时条件表达式的值。`:` 右侧的操作数是当条件为假时条件表达式的值。该语句中的条件表达式，如果条件\n\n```\n\
    studentGrade >= 60\n```\n\n为真，则求值为字符串 `\"Passed\"`；如果为假，则求值为字符串 `\"Failed\"`。因此，这个带有条件运算符的语句执行的功能与第\
    \ 3.4 节中的第一个 `if…else` 语句基本相同。条件运算符的优先级较低，因此整个条件表达式通常放在括号中。\n\n条件表达式中的值也可以是待执行的操作。例如，下面的条件表达式也会打印\
    \ \"Passed\" 或 \"Failed\"：\n\n```\ngrade >= 60 ? cout << \"Passed\" : cout <<\
    \ \"Failed\";\n```\n\n上述代码的含义是：“如果 `grade` 大于或等于 `60`，则执行 `cout << \"Passed\"\
    `；否则执行 `cout << \"Failed\"`。” 这相当于一个 `if…else` 语句。条件表达式可以出现在 `if…else` 语句不能出现的程序位置。\n\
    \n### 3.5 `while` 迭代语句\n\n迭代语句允许你指定程序在某个条件保持为真时重复某个操作。\n\n作为 C++ `while` 迭代语句的示例，考虑一个寻找大于\
    \ 100 的第一个 3 的幂的程序段。在执行以下 `while` 语句后，变量 `product` 包含结果：\n\n```\nint product{3};\n\
    \nwhile (product <= 100) {\n   product = 3 * product;\n}\n```\n\n`while` 语句的每次迭代都会将\
    \ `product` 乘以 3，因此 `product` 取的值分别为 9、27、81 和 243。当 `product` 变为 243 时，`product\
    \ <= 100` 为假。这终止了迭代，因此 `product` 为 243。此时，执行继续进行 `while` 语句之后的下一个语句。\n\n#####\
    \ `while` 语句的 UML 活动图\n\n上述 `while` 语句的 UML 图引入了 UML 的合并符号：\n\n![Images](img/03unfig05.jpg)\n\
    \nUML 将合并符号和决策符号都表示为菱形。合并符号合并两个流，因此它们都进入判断是否应该开始（或继续）执行循环的决策。\n\n可以通过输入和输出箭头的数量来区分决策和合并符号。决策符号有一个箭头指向菱形，有两个或多个箭头从它指向，表示从该点开始可能的转换。此外，从决策符号引出的每个箭头都有一个守护条件。合并符号有两个或多个箭头指向菱形，但只有一个箭头从它指向，表示多个流合并以继续活动。与合并符号相关的任何箭头都没有守护条件。\n\
    \n"
