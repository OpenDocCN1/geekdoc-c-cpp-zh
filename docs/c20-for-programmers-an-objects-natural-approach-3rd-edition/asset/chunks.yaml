  trans: "\n\n# Harvey Deitel 博士\n\nDeitel & Associates, Inc. 的主席兼首席战略官，在计算机领域拥有超过\
    \ 50 年的经验。Deitel 博士在马萨诸塞理工学院（MIT）获得电气工程学学士和硕士学位，并在波士顿大学获得数学博士学位。他拥有丰富的大学教学经验，在\
    \ 1991 年与儿子 Paul 共同创立 Deitel & Associates, Inc. 之前，曾在波士顿学院获得终身教授并担任计算机科学系主任。Deitel\
    \ 家族的著作获得了国际认可，译文涵盖日语、德语、俄语、西班牙语、法语、波兰语、意大利语、简体中文、繁体中文、韩语、葡萄牙语、希腊语、乌尔都语和土耳其语。Deitel\
    \ 博士曾为企业、学术界、政府和军事客户提供数百门编程课程。\n\n# 程序员的 Deitel® 使用 C++20、C++ 标准库、开源库及更多技术的现代\
    \ C++ 指南\n\nC++ 编程语言因开发系统软件、嵌入式系统、操作系统、实时系统、游戏、通信系统和其他高性能计算机应用而广受欢迎。`C++20 for\
    \ Programmers` 是一本从入门到中级的现代 C++ 教程，涵盖了四个最新的 C++ 标准：`C++11`、`C++14`、`C++17` 和 `C++20`。\n\
    \n这本书专为具有其他高级语言背景的程序员编写，采用了 Deitel 招牌的`实战代码教学法`（`live-code approach`）来教授现代 C++，并深入探索了\
    \ `C++20 语言和库`。书中通过经过充分测试的程序展示各个概念，并配有代码详解、语法着色、代码高亮和程序输出。它包含数百个完整的 C++20 程序，涉及数千行经过验证的代码，以及数百条软件开发技巧，并特别关注性能和安全性，将帮助你构建稳健的应用程序。\n\
    \n从 C++ 基础知识开始，学习 Deitel 家族对面向对象编程的经典处理——类、继承、多态、运算符重载和异常处理。然后将探索其他主题，包括：\n\n\
    • 函数式编程和 lambdas\n• 用于优化多核和大数据性能的并发与并行性\n• 升级到 `C++20` 的标准模板库容器、迭代器和算法\n• 文本文件、CSV\
    \ 文件、JSON 序列化\n• 定义自定义函数模板和类模板\n\n在此过程中，你将学习引人入目的新 `C++20` 特性，包括`模块`（modules）、`概念`（concepts）、`ranges）、`协程`（coroutines）以及\
