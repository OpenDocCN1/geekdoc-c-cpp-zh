    Lines 8, 9, 14 and 21 declare `int` variables `total`, `gradeCounter`, `grade`
    and `average`, respectively. Variable `grade` stores the user input. A variable
    declared in a function body is a local variable. It can be used only from the
    line of its declaration to the closing right brace of the block in which the variable
    is declared. A local variable’s declaration must appear before the variable is
    used. Variable `grade`—declared in the body of the `while` loop—can be used only
    in that block.


    ### Initializing Variables `total` and `gradeCounter`


    Lines 8–9 declare and initialize `total` to `0` and `gradeCounter` to `1`. These
    initializations occur before the variables are used in calculations.


    ### Reading 10 Grades from the User


    The `while` statement (lines 12–18) continues iterating as long as `gradeCounter`’s
    value is less than or equal to 10. Line 13 displays the prompt `"Enter grade:
    "`. Line 15 inputs the grade entered by the user and assigns it to variable `grade`.
    Then line 16 adds the new `grade` entered by the user to the `total` and assigns
    the result to `total`, replacing its previous value. Line 17 adds `1` to `gradeCounter`
    to indicate that the program has processed a grade and is ready to input the next
    grade from the user. Incrementing `gradeCounter` eventually causes it to exceed
    10, which terminates the loop.


    ### Calculating and Displaying the Class Average


    When the loop terminates, line 21 performs the averaging calculation in the `average`
    variable’s initializer. Line 24 displays the text `"Total of all 10 grades is
    "` followed by variable `total`’s value. Then, line 25 displays the text `"Class
    average is "` followed by `average`’s value. When execution reaches line 26, the
    program terminates.


    ### 3.6.2 Integer Division and Truncation


    This example’s averaging calculation produces an integer result. The program’s
    output indicates that the sum of the grade values in the sample execution is 846,
    which, when divided by 10, should yield 84.6. Numbers like 84.6 that contain decimal
    points are `floating-point numbers`. In the class-average program, however, the
    result of `total / 10` is the integer 84, because `total` and `10` are both integers.
    Dividing two integers results in `integer division`—any fractional part of the
    calculation is truncated. In the next section, we’ll see how to obtain a floating-point
    result from the averaging calculation.


    Assuming that integer division rounds (rather than truncates) can lead to incorrect
    results. For example, `7 / 4`, which yields 1.75 in conventional arithmetic, truncates
    to 1 in integer arithmetic, rather than rounding to 2.


    ### 3.7 Sentinel-Controlled Iteration


    Let’s generalize Section 3.6’s class-average problem. Consider the following problem:


    *Develop a class-averaging program that processes grades for an arbitrary number
    of students each time it’s run.*


    In the previous class-average example, the problem statement specified the number
    of students, so the number of grades (10) was known in advance. In this example,
    no indication is given of how many grades the user will enter during the program’s
    execution. The program must process an *arbitrary* number of grades.


    One way to solve this problem is to use a special value called a `sentinel value`
    (also called a `signal value`, a `dummy value` or a `flag value`) to indicate
    “end of data entry.” The user enters grades until all legitimate grades have been
    entered. The user then types the sentinel value to indicate that no more grades
    will be entered.


    You must choose a sentinel value that cannot be confused with an acceptable input
    value. Grades on a quiz are nonnegative integers, so –1 is an acceptable sentinel
    value for this problem. Thus, a run of the class-averaging program might process
    a stream of inputs such as 95, 96, 75, 74, 89 and –1. The program would then compute
    and print the class average for the grades 95, 96, 75, 74 and 89; since –1 is
    the sentinel value, it should not enter into the averaging calculation.


    It’s possible that the user could enter –1 before entering grades, in which case
    the number of grades will be zero. We must test for this case before calculating
    the class average. According to the C++ standard, the result of division by zero
    in floating-point arithmetic is undefined. When performing division (`/`) or remainder
    (`%`) calculations in which the right operand could be zero, test for this and
    handle it (e.g., display an error message) rather than allowing the calculation
    to proceed.


    #### 3.7.1 Implementing Sentinel-Controlled Iteration


    In [Fig. 3.2](#ch03.xhtml_fig3_2), the `main` function implements sentinel-controlled
    iteration. Although each grade entered by the user is an integer, the averaging
    calculation is likely to produce a floating-point number. The type `int` cannot
    represent such a number. C++ provides data types `float` and `double` to store
    floating-point numbers in memory. The primary difference between these types is
    that `double` variables typically store numbers with larger magnitude and finer
    detail—that is, more digits to the right of the decimal point, which is also known
    as the number’s `precision`. C++ also supports type `long double` for floating-point
    numbers.


    ![Images](Images/03fig2.jpg)

    ![Images](Images/03fig2a.jpg)

    **Fig. 3.2** Solving the class-average problem using sentinel-controlled iteration.
    (Part 1 of 2.)


    Recall that integer division produces an integer result. This program introduces
