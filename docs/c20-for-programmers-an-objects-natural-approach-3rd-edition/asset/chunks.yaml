    - **4.14 案例研究：使用 `miniz-cpp`**\n- **4.15 总结**\n\n#### 4.1 引言\n\n本章介绍了除一个之外的所有控制语句——`for`、`do`…`while`、`switch`、`break`\
    \ 和 `continue`。我们讨论了逻辑运算符，它允许你组合简单条件。我们展示了 C++20 的属性 `[[likely]]` 和 `[[unlikely]]`，它们可以通过了解哪些执行路径可能或不太可能来帮助编译器优化选择语句。在我们面向对象的案例研究中，我们使用开源库创建和读取\
    \ ZIP 文件。最后，我们介绍了更多 C++20 强大的格式化功能。\n\n#### 4.2 计数器控制迭代的要素\n\n本节使用第 3 章引入的 `while`\
    \ 迭代语句来规范计数器控制迭代的要素：\n\n1. 一个**控制变量**（或循环计数器）。\n\n2. 控制变量的**初始值**。\n\n3. 在循环每次迭代中应用的控制变量的**增量**。\n\
    \n4. 决定循环是否继续的**循环继续条件**。\n\n考虑图 4.1 的应用，该图使用循环显示从 1 到 10 的数字。\n\n![Images](img/04fig01.jpg)\n\
