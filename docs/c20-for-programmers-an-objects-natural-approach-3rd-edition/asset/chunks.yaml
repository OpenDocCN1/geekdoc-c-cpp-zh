    ## 标识符


    变量名（例如 `number1`）是任何不是关键字的有效`identifier`。标识符是由字母、数字和下划线（`_`）组成的字符序列，且不以数字开头。C++是`case
    sensitive`（大小写敏感）——大写和小写字母是不同的，因此 `a1` 和 `A1` 是不同的标识符。


    C++ 允许任意长度的标识符，但某些 C++ 实现可能会限制标识符的长度。不要使用以下划线和双下划线头的标识符，因为 C++ 编译器内部使用此类名称。


    ## 变量声明的位置


    变量声明可以放在程序的任何位置，但必须在变量使用之前出现。例如，第 8 行的声明


    ```

    int number1{0}; // 第一个要加的整数（初始化为 0）

    ```


    可以放在第 13 行之前：


    ```

    std::cin >> number1; // 从用户处读取第一个整数到 number1

    ```


    第 9 行的声明


    ```cpp

    int number2{0}; // 第二个要加的整数（初始化为 0）

    ```


    可以放在第 16 行之前：


    ```cpp

    std::cin >> number2; // 从用户处读取第二个整数到 number2

    ```


    第 10 行的声明


    ```cpp

    int sum{0}; // number1 和 number2 的和（初始化为 0）

    ```


    可以放在第 18 行之前：


    ```cpp

    sum = number1 + number2; // 数字相加；将结果存储在 sum 中

    ```


    事实上，第 10 行和第 18 行可以合并为以下声明并放在第 20 行之前：


    ```cpp

    int sum{number1 + number2}; // 用 number1 + number2 初始化 sum

    ```


    ## 从用户处获取第一个值


    第 12 行


    ```cpp

    std::cout << "Enter first integer: "; // 提示输入数据

    ```


    显示 `Enter first integer:` 后跟一个空格。此消息被称为 `prompt`（提示），因为它引导用户执行特定操作。第 13 行


    ```cpp

    std::cin >> number1; // 从用户处读取第一个整数到 number1

    ```


    使用了属于 `std` 命名空间的`standard input stream object` `cin` 和 `stream extraction operator`
    `>>` 来从键盘获取值。


    当执行前述语句时，计算机会会等待用户为变量 `number1` 输入一个值。用户通过输入整数（作为字符输入），然后按下 `Enter` 键（有时称为 `Return`
    键）将字符发送给计算机。计算机将数字的字符表示转换为整数值，并将此值赋予变量 `number1`。按下 `Enter` 还会导致光标移动到屏幕下一行的开头。


    当你的程序等待用户输入整数时，用户可能会输入字母字符、特殊符号（如 `#` 或 `@`）或带有小数点的数字（如 `73.5`）等。在这些早期程序中，我们假设用户输入有效数据。稍后我们将介绍处理数据输入问题的各种技术。


    ## 从用户处获取第二个值


    第 15 行


    ```cpp

    std::cout << "Enter second integer: "; // 提示输入数据

    ```


    在屏幕上显示 `Enter second integer:`，提示用户采取行动。第 16 行


    ```cpp

    std::cin >> number2; // 从用户处读取第二个整数到 number2

    ```


    从用户处获取变量 `number2` 的值。


    ## 计算用户输入值的和


    第 18 行的赋值语句


    ```cpp

    sum = number1 + number2; // 数字相加；将结果存储在 sum 中

    ```


    将变量 `number1` 和 `number2` 的值相加，并使用 `assignment operator` `=` 将结果赋值给变量 `sum`。大多数计算都在赋值语句中完成。`=`运算符`+`运算符是
    `binary operators`（二元运算符），因为每个都有两个操作数。对于 `+` 运算符，两个操作数是 `number1` 和 `number2`。对于之前的
    `=` 运算符，两个操作数是 `sum` 和表达式 `number1 + number2` 的值。在二元运算符两侧加上空格可以让运算符突出并使程序更具读性。


    ## 显示结果


    第 20 行


    ```cpp

    std::cout << "Sum is " << sum << std::endl; // 显示和；换行

    ```


    显示字符串 `"Sum is"`，随后是变量 `sum` 的数值值，最后是 `std::endl`——一个 `stream manipulator`（流操纵符）。`endl`
    是“end line”的缩写，属于 `std` 命名空间。`std::endl` 流操纵符输出换行，然后“刷新输出缓冲区”。这简单意味着，在某些系统中，输出会在机器中累积直到多到“值得”显示在屏幕上，`std::endl`
    会强制将任何积累的输出在此时显示。当输出在提示用户执行操作（例如输入数据）时，这非常重要。


    前面的语句输出了不同类型的多个值。流插入运算符“知道”如何输出每类型的数据。在单个语句中使用多个流插入运算符 (`<<`) 被称为 `concatenating`（连接）、`chaining`（链）或
    `cascading stream insertion operations`（级联流插入操作）。


    计算也可以在输出语句中进行。我们可以将第 18 行和第 20 行的语句合并为


    ```cpp

    std::cout << "Sum is " << number1 + number2 << std::endl;

    ```


    C++ 的一个显著特性是你可以创建自己的数据类型称为类（我们在第 10 章讨论，并在第 11 章深入探讨)。然后你可以使用 `>>` 和 `<<` 运算符“教”
    C++ 如何输入输出这些数据类型。这被称为 `operator overloading`（运算符重载），我们在第 14 章探索。


    ## 2.5 算术


    下表总结了 `arithmetic operators`（算术运算符）：


    ![Images](img/arithmetic.jpg)


    注意代数中未使用的各种符号。星号 `*` 表示乘法，百分号 `%` 是余运算符，我们稍后讨论。这些算术运算符都是二元运算符。


    ### 整数除法


    分子和分都是整数的`Integer division`产生整数商。例如，表达式 `7/4` 值为 `1`，表达式 `17 / 5` 值为 `3`。整数除法结果中的任何部分都会截断——不会发生舍入。


    ### 余运算符


    余运算符 `%` 返回整数除法后的余数，只能用于整数操作数——`x % y` 返回 `x` 除以 `y` 的余数。因此 `7%4` 结果为 `3`，`17
    % 5` 结果为 `2`。


    ### 用于分组子表达式的括号


    括号在 C++ 表达式中的用法与代数相同。例如，为了将 `a` 乘以 `b + c`，我们写成 `a * (b + c)`。


    ### 运算符优先级规则


    C++ 按照由 `rules of operator precedence` 确定的精确顺序应用运算符，这些规则通常与代数相同：


    1. 首先计算括号中的表达式。括号被称为“最高优先级”。对于嵌套或嵌入的括号，例如


    ```

    (a * (b + c))

    ```


    最内层括号中的表达式首先计算。


    2. 执行乘法、除法和余数运算。如果表达式包含多个乘法、除法和余数运算，将从左到右应用。这三个运算符被认为处于同一优先级。


