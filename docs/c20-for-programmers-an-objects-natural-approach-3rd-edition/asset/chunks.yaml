    ### 1.1 Introduction


    Welcome to C++—one of the world’s most widely used, high-performance, computer-programming
    languages—and its current version `C++20`.


    If you’re reading this, you’re on the O’Reilly Online Learning platform (formerly
    called Safari) viewing an early-access Rough Cut of our forthcoming book *C++20
    for Programmers*, scheduled for publication this summer. **We have prepared this
    content carefully, but it has not yet been peer reviewed or copy edited and is
    subject to change.** When we complete this chapter, we’ll post the reviewed and
    copy edited version here.


    Please send any corrections, comments, questions and suggestions for improvement
    to [`paul@deitel.com`](mailto:paul@deitel.com) and I’ll respond promptly. Check
    for updates here and on the book’s web page:


    ```

    https://deitel.com/c-plus-plus-20-for-programmers

    ```


    This book is written for developers using one or more of the following popular
    desktop platforms—Microsoft Windows 10, macOS and Linux. We tested every program
    on three popular free compilers:


    • `Visual C++` in Microsoft Visual Studio Community edition on Windows 10,

    • `Clang` in `Xcode` on macOS, and

    • `GNU C++` on Linux and in the `GNU Compiler Collection` (`GCC`) Docker container.


    At Deitel, we use current, powerful multicore Apple Mac computers that enable
    us to run macOS natively, and Windows 10 and Linux through virtual machines in
    `VMWare Fusion`. Docker runs natively on Windows, macOS and Linux systems.


    This early-access version of [Chapter 1](#ch01.xhtml_ch01) contains test-drives
    demonstrating how to compile and run a C++20 application using these compilers
    and platforms. The published version of this chapter will contain additional introductory
    material.


    At the time of this writing, some `C++20` features are fully implemented in all
    three compilers, some are implemented in a subset of the three and some are not
    implemented at all. We point out these issues as appropriate and will update our
    online content as the compiler vendors implement the rest of `C++20`’s features.
    `C++20` compiler support for many more compilers is tracked at:


    ```

    https://en.cppreference.com/w/cpp/compiler_support

    ```


    #### “Sneak Peek” Videos for O’Reilly Online Learning Subscribers


    As an O’Reilly Online Learning subscriber, you also have access to the “sneak
    peek” of our new *C++20 Fundamentals LiveLessons* videos at:


    ```

    https://learning.oreilly.com/videos/c-20-fundamentals-parts/9780136875185

    ```


    Co-author Paul Deitel immediately records each video lesson as we complete the
    corresponding chapter. Lessons go live on O’Reilly Online Learning a few days
    later. Again, check here frequently for updates.


    ### 1.2 Test-Driving a C++20 Application


    In this section, you’ll compile, run and interact with your first C++ application—a
    guess-the-number game, which picks a random number from 1 to 1000 and prompts
    you to guess it. If you guess correctly, the game ends. If you guess incorrectly,
    the application indicates whether your guess is higher or lower than the correct
    number. There’s no limit on the number of guesses you can make.


    Usually, this application randomly selects the correct answer as you execute the
    program. We’ve disabled that aspect of the application so that it uses the same
    correct answer every time the program executes (though this may vary by compiler).
    So, you can use the same guesses we use and see the same results.


    #### Summary of the Test-Drives


    We’ll demonstrate running a C++ application using:


    • Microsoft Visual Studio 2019 Community edition for Windows (Section 1.2.1)

    • `Clang` in `Xcode` on macOS (Section 1.2.2).

    • `GNU C++` in a shell on Linux (Section 1.2.3)

    • `GNU C++` in a shell running inside the `GNU Compiler Collection` (`GCC`) Docker
    container. This requires Docker to be installed and running.


    You need to read only the section that corresponds to your platform. At the time
    of this writing, `GNU C++` supports the most `C++20` features of the three compilers
    we use.


    #### 1.2.1 Compiling and Running a C++20 Application with Visual Studio 2019 Community
    Edition on Windows 10


    In this section, you’ll run a C++ program on Windows using Microsoft Visual Studio
    2019 Community edition. There are several versions of Visual Studio available—on
    some versions, the options, menus and instructions we present might differ slightly.
    From this point forward, we''ll simply say “Visual Studio” or “the IDE.”


    ##### Step 1: Checking Your Setup


    If you have not already done so, read the Before You Begin section of this book
    for instructions on installing the IDE and downloading the book’s code examples.


    ##### Step 2: Launching Visual Studio


    Open Visual Studio from the Start menu. The IDE displays the following Visual
    Studio 2019 window containing:


    ![Images](Images/01unfig01.jpg)


    Close this window for now by clicking the X in its tab—you can access this window
    any time by selecting `File > Start Window`. We use the `>` character to indicate
    selecting a menu item from a menu. For example, the notation `File > Open` indicates
    that you should select the `Open` menu item from the `File` menu.


    ##### Step 3: Creating a Project


    A **project** is a group of related files, such as C++ source files that compose
    an application. Visual Studio organizes applications into projects and **solutions**,
    which contain one or more projects. Multiple-project solutions are used to create
    large-scale applications. Each application in this book requires only a single-project
    solution.


    To work code examples, you’ll begin with an Empty Project and add files to it.
    To create a project:


    1. Select `File > New > Project...` to display the Create a New Project dialog:


    ![Images](Images/01unfig02.jpg)


    2. In the preceding dialog, select the `Empty Project` template with the tags
    `C++`, `Windows` and `Console`. This template is for programs that execute at
    the command line in a Command Prompt window. Depending on the version of Visual
    Studio you’re using and the options you have installed, there may be many project
    templates installed. You can narrow down your choices using the `Search for templates`
    textbox and the drop-down lists below it. Click Next to display the Configure
    your project dialog:


    ![Images](Images/01unfig03.jpg)


    3. Provide a Project name and Location for your project. For the Project name,
    we specified `cpp20_test`. For the Location, we selected the `examples` folder.
    Click Create to open your new project.


    At this point, the Visual Studio creates your project, places its folder in `C:\Users\*YourUserAccount*\Documents\examples`
    (or the folder you specified) and opens the main window:


    ![Images](Images/01unfig04.jpg)


    This window displays editors as tabbed windows (one for each file) when you’re
    editing code. On the left side is the Solution Explorer for viewing and managing
    your application’s files. In this book’s examples, you’ll typically place each
    program’s code files in the `Source Files` folder. If the Solution Explorer is
    not displayed, you can display it by selecting `View > Solution Explorer`.


    ##### Step 4: Adding the `GuessNumber.cpp` File into the Project


    Next, you’ll add `GuessNumber.cpp` to the project you created in *Step 3*. In
    the Solution Explorer:


    1. Right-click the `Source Files` folder and select `Add > Existing Item...`.

    2. In the dialog that appears, navigate to the `ch01` subfolder of the book’s
    `examples` folder, `GuessNumber.cpp` and click `Add`.


    For the multiple source-code-file programs that you’ll see in later chapters,
    select all the files for a given program. When you begin creating programs yourself,
    you can right click the `Source Files` folder and select `Add > New Item...` to
    display a dialog for adding a new file.


    ##### Step 5: Configuring Your Project to Use C++20

