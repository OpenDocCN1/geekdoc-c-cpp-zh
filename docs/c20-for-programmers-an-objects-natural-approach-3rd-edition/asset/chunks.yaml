    ### 2.2 第一个 C++ 程序：显示一行文本


    考虑一个显示一行文本的简单程序（图 2.1）。


    ![Images](img/ch02.jpg)


    **图 2.1** 文本打印程序。


    #### 注释


    第 1 和 2 行


    ```cpp

    // ch01.cpp

    ```


    均以 `//` 开头，表示行的其余部分是注释。在我们的程序中，第一行描述了程序。注释在行尾结束。你可以通过封装 `/*` 和 `*/` 创建多行注释，例如：


    ```cpp

    /*打印程序. */

    ```


    #### #include 预处理指令


    第 3 行


    ```cpp

    #include <iostream> // 使程序输出

    ```


    是一个预处理指令——即给 C++ 预处理器的消息，编译器在编译程序之前调用它。该行通知预处理器在程序中包含 `iostream`。该头文件是编译任何输出数据到屏幕的程序时所需的。第
    5 章将详细讨论头文件，第 15 章](#ch15.xhtml_ch15)将详细解释 `<iostream>` 的内容。


    #### 空行与空白


    第 4 行是一个空行。你使用空行、空格和制表符使程序更易读。这些字符统被称为空白——编译器通常忽略它们。


    #### main 函数


    第 6 行


    ```cpp

    int main() {

    ```


    是每个 C++ 程序的一部分。`main` 后面的括号表示它是一个函数。C++ 程序由一个或多个函数和类组成。每个程序必须有一个函数命名为 `main`。图
    2.1 包含一个函数。C++ 程序从 `main` 函数开始执行。`main` 左侧的 `int` 关键字表示 `main` 执行完成后，它会“返回”一个整数（全数）值。关键字被
    C++ 保留用于特定用途。我们在第 3 章](#ch03.xhtml_ch03)中显示 C++ 关键字的完整列表。在第 5 章](#ch05.xhtml_ch05)演示如何创建自己的函数时，将解释函数返回值的含义。现在，只需在每个程序的
    `main` 左侧包含 `int` 关键字即可。


    左括号 `{`（第 6 行结束）必须开始每个函数体，包含函数执行的指令。相应的右括号 `}`（第 10 行）必须结束每个函数体。


    #### 输出语句


    第 7 行


    ```cpp

    std::cout << "Welcome to C++!\n"; // 显示消息

    ```

    '
- fmt: '

    displays the characters contained between the double quotation marks. Together,
    the quotation marks and the characters between them are called a `string`, a `character
    string` or a `string literal`. We refer to characters between double quotation
    marks simply as strings. White-space characters in strings are not ignored by
    the compiler.


    The entire line 7—including `std::cout`, the `<<` operator, the string `"Welcome
    to C++!\n"` and the `semicolon` (`;`)—is called a `statement`. Most C++ statements
    end with a semicolon. Omitting the semicolon at the end of a C++ statement when
    one is needed is a syntax error. Preprocessing directives (such as `#include`)
    are not C++ statements and do not end with a semicolon.


    Typically, output and input in C++ are accomplished with `streams` of data. When
    the preceding statement executes, it sends the stream of characters `Welcome to
    C++!\n` to the `standard output stream object` (`std::cout`), which is normally
    “connected” to the screen.


    ### Indentation


    Indent the body of each function one level within the braces that delimit the
    function’s body. This makes a program’s functional structure stand out, making
    the program easier to read. Set a convention for the size of indent you prefer,
    then apply it uniformly. The tab key may be used to create indents, but tab stops
    may vary. We prefer three spaces per level of indent.


    ### The `std` Namespace


    The `std::` before `cout` is required when we use names that we’ve brought into
    the program by preprocessing directives like `#include <iostream>`. The notation
    `std::cout` specifies that we are using a name, in this case `cout`, that belongs
    to namespace `std`. The names `cin` (the standard input stream) and `cerr` (the
    standard error stream)—introduced in [Chapter 1](#ch01.xhtml_ch01)—also belong
    to namespace `std`. We discuss namespaces in Chapter 23, Other Topics. For now,
    you should simply remember to include `std::` before each mention of `cout`, `cin`
    and `cerr` in a program. This can be cumbersome—we’ll soon introduce `using` declarations
    and the `using` directive, which will enable you to omit `std::` before each use
    of a name in the `std` namespace.


    ### The Stream Insertion Operator and Escape Sequences


    In a `cout` statement, the `<<` operator is referred to as the `stream insertion
    operator`. When this program executes, the value to the operator’s right (the
    right `operand`) is inserted in the output stream. Notice that the `<<` operator
    points toward where the data goes. A string’s characters normally display exactly
    as typed between the double quotes. However, the characters `\n` are not displayed
    in [Fig. 2.1](#ch02.xhtml_fig2_1)’s sample output. The backslash (`\`) is called
    an `escape character`. It indicates that a “special” character is to be output.
    When a backslash is encountered in a string, the next character is combined with
    the backslash to form an `escape sequence`. The escape sequence `\n` means `newline`.
    It causes the `cursor` (i.e., the current screen-position indicator) to move to
    the beginning of the next line on the screen. Some common escape sequences are
    shown in the following table:


    ![Images](Images/p0111-01.jpg)


    ### The `return` Statement


    Line 9


    ```

    return 0; // indicate that program ended successfully

    ```


    is one of several means we’ll use to `exit a function`. In this `return` statement
    at the end of `main`, the value `0` indicates that the program terminated successfully.
    If program execution reaches the end of `main` without encountering a `return`
    statement, C++ assumes that the program terminated successfully. So, we omit the
    `return` statement at the end of `main` in subsequent programs that terminate
    successfully.


