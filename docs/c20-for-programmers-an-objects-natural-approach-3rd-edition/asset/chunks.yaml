    ##### Step 8: Entering Your First Guess


    Click in the Debug area, then type **`500`** and press *Return*


    ![Images](Images/01unfig16.jpg)


    The application displays `"Too low. Try again."`, meaning that the value you entered
    is less than the number the application chose as the correct guess.


    ##### Step 9: Entering Another Guess


    At the next prompt, enter **`750`**:


    ![Images](Images/01unfig17.jpg)


    The application displays `"Too low. Try again."`, because the value you entered
    once again is less than the correct guess.


    ##### Step 10: Entering Additional Guesses


    Continue to play the game by entering values until you guess the correct number.
