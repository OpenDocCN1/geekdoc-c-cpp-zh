    ## 3.11 基本类型不是可移植的


    你可以在此处查看 C++ 基本类型的完整列表及其典型范围：


    ```

    https://en.cppreference.com/w/cpp/language/types own

    ```


    在 C 和 C++ 中，一台机器上的 `int` 可能由 16 位（2 字节）内存表示，在另一台机器上由 32 位（4 字节）表示，而在另外一台机器上则由
    64 位（8 字节）表示。出于此原因，使用整数的代码并不总是跨平台可移植的。你可以编写程序的多个版本，以便在不同平台上使用不同的整数类型。或者，你也可以使用某些技术来实现不同程度的可移植性。(7)在下一节中，我们将展示一种实现可移植性的方法。


    7。头文件 `<cstdint>` 中的整数类型（[`https://en.cppreference.com/w/cpp/types/integer`](https://en.cppreference.com/w/cpp/types/integer)）可以确保整数变量在跨平台上对于你的应用程序具有正确的大小。


    PERF C++ 的整数类型包括 `int`、`long` 和 `long long`。C++ 标准要求类型 `int` 至少为 16 位，类型 `long`
    至少为 32 位，类型 `long long` 至少为 64 位。标准还要求 `int` 的大小小于或等于 `long` 的大小，且 `long` 的大小小于或等于
    `long long` 的大小。这种“松散”的要求带来了可移植性挑战，但允许编译器实现者通过将基本类型的大小与你机器的硬件来优化性能。


    ## 3.12 对象自然案例研究：任意大小的整数


    整数类型支持的值范围取决于在特定计算机上表示该类型所使用的字节数。例如，一个四字节的 `int` 可以存储 2³² 个可能的值，范围从 -2,147,483,648
    到 2,147,483,647。在大多数系统上，`long long` 整数是 8 字节，可以存储 2⁶⁴ 个可能的值，范围从 -9,223,372,036,854,775,808
    到 9,223,372,036,854,775,807。


    ### 某些应用需要 long long 整数范围之外的数字


    考虑阶乘计算。阶乘是从 1 到给定值的整数的乘积。5 的阶乘（写作 5!）是 1 * 2 * 3 * 4 * 5，结果为 120。我们在 64 位整数中能表示的最大阶乘值是
    20!，即 2,432,902,008,176,640,000。阶乘增长迅速，很快就会超出 `long long` 整数的可范围。随着大数据变得越来越大，越来越多的现实世界应用将超出
    `long long` 整数的局限性。


    ![Images](img/common02.jpg) SECURITY 另一个需要极大整数的应用是密码学——这是确保互联网上计算机间传输数据的安全的重要方面。许多加密算法使用
    128 位或 256 位整数值进行计算——这些值远大于我们用 C++ 基本类型能表示的范围。


    ### 使用类 `BigNumber` 实现任意精度整数


    任何需要 `long long` 范围之外整数的应用都需要特殊处理。遗憾的是，C++ 标准库（尚未）拥有用于任意精度整数的类。因此，在本示例中，我们将深入开源类库的广阔世界，展示你可以用来创建和操作任意精度整数的许多
    C++ 类之一。我们将使用来自以下地址的 `BigNumber` 类：


    ```

    https://github.com/limeoats/BigNumber

    ```


    为了方便起见，我们在示例的 `fig03_05` 文件夹中包含了下载内容。请务必阅读提供的 `LICENSE.md` 文件中包含的许可条款。


    要使用 `BigNumber`，你不需要理解它是如何实现的(8)你只需要包含它的头文件（`bignumber.h`），创建类的对象然后在代码中使用它们。图
    3.5 展示了 `BigNumber` 并显示了示例输出。对于本示例，我们将使用最大的 `long long` 整数值来展示我们可以使用 `BigNumber`
    创建更大的整数。在本节末尾，我们将展示如何编译和运行代码。


