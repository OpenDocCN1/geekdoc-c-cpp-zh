    ### 4.5 应用：偶数求和


    图 4.3 中的应用使用了 `for` 语句来对 2 到 20 的偶数求和，并将结果存储在 `int` 变量 `total` 中。循环的每次迭代（第 10–12
    行）将控制变量 `number` 的值加到变量 `total`。


    ![Images](img/04fig03.jpg)![Images](img/04fig03a.jpg)


    **图 4.3** 使用 `for` 语句求和。（2/2 部分。）


    `for` 语句的初始化表达式和增量表达式可以是包含多个初始化表达式或多个增量表达式的逗号分隔列表。虽然这种做法不推荐，但你可以通过使用逗号运算符将 `for`
    语句的体（第 11 行）合并到 `for` 头部增量部分，例如：


    ```

    total += number, number += 2

    ```


    表达式 `total += number` 和 `number += 2` 之间的逗号是**逗号运算符**，它保证了表达式列表从左到右求值。逗号运算符是所有
    C++ 运算符中优先级最低的。逗号分隔表达式列表的值和类型是右侧表达式的值和类型。例如，假设 `x` 是 `int` 且 `y` 是 `double`，则逗号分隔表达式列表


    ```

    x = 5, y = 6.4;

    ```


    的结果的值为 `6.4`，类型为 `double`。


    逗号运算符常用于需要多个初始化表达式或多个增量表达式的 `for` 语句。


    ### 4.6 应用：复利计算


    让我们用 `for` 语句计算复利。考虑以下问题：


    *某人在储蓄账户中投资了 1,000 美元，利率为 5%。假设所有利息都留在账户中，计算并打印 10 年内每年末账户中的金额。请使用以下公式确定金额：*


    *a = p* (1 + *r*)^(*n*)*


    *其中：*


    *p* 是原始投资金额（即本金）


    *r* 是年利率（例如，5% 使用 0.05）


    *n* 是年数


    *a* 是第 *n* 年末的存款金额。


    该问题的解决方案（图 4.4）涉及一个循环，在资金留在账户的 10 年中，每年都执行一次指定的计算。我们在此处使用 `double` 类型进行货币计算。然后，我们将讨论使用浮点类型表示货币金额时的问题。在第
    10 章中，我们将开发一个新的 `Dollar-Amount` 类，它使用大整数来精确表示货币金额。正如你所看到的，该类仅使用整数算术进行货币计算。


    ![Images](img/04fig04.jpg)![Images](img/04fig04a.jpg)


    **图 4.4** 使用 `for` 进行复利计算。（2/2 部分。）


    第 12–13 行声明了 `double` 变量 `principal` 和 `rate`，并将 `principal` 初始化为 `1000.00`，将
    `rate` 初始化为 `0.05`。C++ 将像 `1000.00` 和 `0.05` 这样的浮点字面量视为 `double` 类型。同样，C++ 将像
    `7` 和 `-22` 这样的整数字面量视为 `int` 类型^1。第 15–16 行显示了初始本金和利率。


    1。第 3.12 节表明 C++ 的整数类型无法表示所有的整数值。请为你需要表示的值范围选择正确的类型。你可以通过分别在字面值后附加 `L` 或 `LL`
    来指定整数字面量为 `long` 或 `long long`。


    #### 使用字段宽度和对齐格式化


    循环前的第 10 行和循环内的第 27 行合并打印 `year` 和 `amount` 值。我们使用带参数流操纵符 `setprecision` 和 `setw`
    以及非参数流操纵符 `fixed` 来指定格式。流操纵符 `setw(4)` 指定下一个输出值应该出现在宽度为 4 的**字段宽度**中——即 `cout
    <<` 打印的值至少占据四个字符位置。如果要输出的值少于四个字符位置，则默认该值在字段中右对齐。如果要输出的值超过四个字符位置，C++ 将向右扩展字段宽度以容纳整个值。要使值左对齐，请输出非参数流操纵符
    `left`（在头文件 `<iostream>` 中找到）。你可以通过输出非参数流操纵符 `right` 来恢复右对齐。


    输出语句中的其他格式化将变量 `amount` 显示为带有小数点的固定点值（第 10 行中的 `fixed`），它在 20 个字符位置宽的字段中右对齐（第
    27 行的 `setw(20)`），并在小数点右侧保留两位精度（第 10 行的 `setprecision(2)`）。流操纵符 `setw(4)` 指定下一个输出值应该出现在宽度为
    4 的**字段宽度**中——即 `cout <<` 打印的值至少占据四个字符位置。如果要输出的值少于四个字符位置，则默认该值在字段中右对齐。如果要输出的值超过四个字符位置，C++
    将向右扩展字段宽度以容纳整个值。要使值左对齐，请输出非参数流操纵符 `left`（在头文件 `<iostream>` 中找到）。你可以通过输出非参数流操纵符
    `right` 来恢复右对齐。


    ##### 使用标准库 pow 进行利率计算


    `for` 语句（第 22–28 行）迭代 10 次，使 `int` 控制变量 `year` 从 1 变为 10，每次递增 1。C++ 不包含幂运算符，因此我们使用来自
    `<cmath>`（第 5 行）的标准库函数 `pow`（第 24 行）。调用 `pow(x, y)` 计算 *x* 的 *y* 次方。该函数接收两个 `double`
    参数并返回 `double` 值。


    ##### 浮点数精度和内存需求


    `float` 类型的变量表示**单精度浮点数**。大多数现代系统将其存储在四字节内存中，约有 7 位有效数字。`double` 类型的变量表示**双精度浮点数**。大多数现代系统将其存储在八字节内存中，约有
    15 位有效数字——大约是 `float` 变量精度的倍。大多数程序员使用 `double` 类型表示浮点数。C++ 默认将程序源码中的 3.14159 等浮点数视为
    `double` 值。此类源码中的值被称为**浮点字面量**。


    尽管大多数系统将 `float` 存储为四字节并将 `double` 存储为八字节，但 C++ 标准表明 `double` 类型提供的精度至少与 `float`
    同。还有 `long double` 类型，其精度至少与 `double` 同。有关 C++ 基本类型及其典型范围的完整列表，请参见


    ```

    https://en.cppreference.com/w/cpp/language/types

    ```


