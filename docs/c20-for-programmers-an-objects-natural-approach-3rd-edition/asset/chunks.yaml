    Next, we display the `BigNumber` then subtract one from it and display the result.
    Line 18 adds one to `value2`, which contains the maximum value of a `long long`.
    `BigNumber` handles arbitrary precision integers, so `correctly performs this
    calculation`. The result is a value that C++’s fundamental integer types cannot
    handle on our systems.


    `BigNumber` supports all the typical arithmetic operations, including `+` and
    `-` used in this program. The compiler already knows how to use arithmetic operators
    with fundamental numeric types, but it has to be taught how to handle those operators
    for class objects. We discuss that process—called operator overloading—in [Chapter
    14](#ch14.xhtml_ch14).


    ### Powers of 100,000,000 with `long long` Integers


    Lines 21–30 calculate powers of 100,000,000 using `long long` integers. First,
    we create the variable `value3` and display its value. Lines 26–30 loop five times.
    The calculation


    ```

    value3 *= 100''000''000; // quickly exceeds maximum long long value

    ```


    multiples `value3`’s current value by 100,000,000 to raise `value3` to the next
    power. As you can see in the program’s output, only the loop’s first iteration
    produces a correct result.


    ### Powers of 100,000,000 with `BigNumber` Objects


    To demonstrate that `BigNumber` can handle significantly larger values than the
    fundamental integer types, lines 33–42 calculate powers of 100,000,000 using a
    `BigNumber` object. First, we create `BigNumber value4` and display its initial
    value. Lines 38–42 loop five times. The calculation


    ```

    value4.pow(counter)

    ```


    calls `BigNumber` member function `pow` to raise `value4` to the power `counter`.
    `BigNumber` correctly handles each calculation, producing massive values that
    are far outside the ranges supported by our Windows, macOS and Linux systems’
    fundamental integer types.


    ![Images](Images/common01.jpg) Though a `BigNumber` can represent any integer
    value, it does not match your system’s hardware. So you’ll likely sacrifice some
    performance in exchange for the flexibility `Big-Number` provides.


    ### Compiling and Running the Example in Microsoft Visual Studio


    In Microsoft Visual Studio:


    1. Create a new project, as described in Section 1.9.

    2. In the Solution Explorer, right-click the project’s Source Files folder and
    select Add > Existing Item….

    3. Navigate to the `fig03_05` folder, select `fig03_05.cpp` and click Add.

    4. Repeat Steps 2–3 for `bignumber.cpp` from the `fig03_05\BigNumber\src` folder.

    5. In the Solution Explorer, right-click the project’s name and select Properties….

    6. Under Configuration Properties, select C/C++, then on the right side of the
    dialog, add to the Additional Include Directories the full path to the `BigNumber\src`
    folder on your system. For our system, this was


    `C:\Users\account\Documents\examples\ch03\fig03_05\BigNumber\src`


    7. Click OK.

    8. Type `Ctrl + F5` to compile and run the program.


    ### Compiling and Running the Example in GNU g++


    For GNU g++ (these instructions also work from a Terminal window on macOS):


    1. At your command line, change to this example’s `fig03_05` folder.

    2. Type the following command to compile the program—the `-I` option specifies
    additional folders in which the compiler should search for header files:


    ```

    g++ -std=c++2a -I BigNumber/src fig03_05.cpp \


    BigNumber/src/bignumber.cpp -o fig03_05

    ```


    3. Type the following command to execute the program:


    ```

    ./fig03_05

    ```


    ### Compiling and Running the Example in Apple Xcode


    In Apple Xcode:


    1. Create a new project, as described in Section 1.9, and delete `main.cpp`.

    2. Drag `fig03_05.cpp` from the `fig03_05` folder in the Finder onto your project’s
    source code folder in Xcode, then click Finish in the dialog that appears.

    3. Drag `bignumber.h` and `bignumber.cpp` from the `fig03_05/BigNumber/src` folder
    onto your project’s source code folder in Xcode, then click Finish in the dialog
    that appears.

    4. Type ![Images](Images/common08.jpg) + `R` to compile and run the program.


