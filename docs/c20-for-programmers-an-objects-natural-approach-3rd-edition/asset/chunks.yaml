    ### 3.8.3 使用 C++11 列表初始化防止窄转换


    考虑 [图 3.3] 中第 10 行的 C++11 列表初始化：


    ```

    int studentCounter{1};

    ```


    在 C++11 之前，你会将其写为：


    ```

    int studentCounter = 1;

    ```


    对于基本类型变量，列表初始化语法可以防止导致 `data loss` 的 `narrowing conversions`（窄转换）。例如，声明：


    ```

    int x = 12.7;

    ```


    尝试将 `double` 值 `12.7` 赋值给 `int` 变量 `x`。在这里，C++ 通过截断浮点数部分（`.7`）将 `double` 值转换为
    `int`。这是一种丢失数据的窄转换。因此，该声明将 `12` 赋值给 `x`。编译器通常会对此发出警告，但仍会编译代码。


    然而，使用列表初始化，如：


    ```cpp

    int x{12.7};

    ```


    会产生 `compilation error`，帮助你避免潜在的细微逻辑错误。如果你指定一个整数的 `double` 值，如 `12.0`，你仍然会得到编译错误。初始化器的类型（`double`）而不是它的值（`12.0`）决定了是否发生编译错误。


    C++ 标准文档没有规定错误信息的措。对于前面的声明，Apple 的 Xcode 编译器给出错误：


    ```

    Type ''double'' cannot be narrowed to ''int'' in initializer list

    ```


    Visual Studio 给出错误：


    ```

    conversion from ''double'' to ''int'' requires a narrowing conversion

    ```


    而 GNU C++ 给出错误：


    ```

    type ''double'' cannot be narrowed to ''int'' in initializer list


    [-Wc++11-narrowing]

    ```


    我们将在后面的章节中讨论额外的列表初始化器特性。


    #### 回顾 [图 3.1]


    你可能认为 [图 3.1] 中的以下语句：


    ```

    int average{total / 10}; // int 除法产生 int 结果

    ```


    包含窄转换，但 `total` 和 `10` 都是 `int` 值，因此初始化器的值是 `int`。如果在前面的语句中 `total` 是一个 `double`
    变量，或者我们使用 `double` 字面量 `10.0` 作为分母，那么初始化器的值类型将是 `double`，编译器会对窄转换发出错误信息。


    ### 3.9 复合赋值运算符


    你可以将语句


    ```

    c = c + 3;

    ```


    使用加复合赋值运算符 `+=` 简写为：


    ```

    c += 3;

    ```


    `+=` 运算符将右侧表达式的值加上左侧变量的值，并将结果存储在左侧变量中。因此，赋值表达式 `c += 3` 将 `3` 加到 `c`。下表了所有的算术复合赋值运算符、示例表达式以及运算符作用的解释：


    ![Images](img/f0091-01.jpg)


    稍后我们将讨论其他类型的复合赋值运算符。


    ### 3.10 递增和递减运算符


    下表总结了 C++ 用于将数值变量的值加 1 或减去 1 的两个单元运算符——这些是单元`递增运算符` `++` 和单元`递减运算符` `--`：


    ![Images](img/f0091-02.jpg)


    前置于（放在变量之前）的递增或递减运算符分别称为前置递增运算符或前置递减运算符。后置于（放在变量之后）的递增或递减运算符分别称为后置递增运算符或后置递减运算符。


    使用前置递增（或递减）运算符对变量 `preincrements`（或 `predecrements`）加 1（或减 1）。


    #### 前置递增 vs 后置递增


    [图 3.4] 展示了 `++` 运算符的前置版本和后置版本的区别。递减运算符（`--`）原理类似。


    ![Images](img/03fig04.jpg)


    **图 3.4** 前置递增和后置递增


    第 8 行将 `c` 初始化为 `5`，第 9 行输出 `c` 的初始值。第 10 行输出表达式 `c++` 的值。该表达式是后置递增了变量 `c`，因此输出
    `c` 的原始值（`5`），然后 `c` 的值增加到 6。因此，第 10 行再次输出 `c` 的初始值（`5`）。第 11 行输出 `c` 的新值（`6`），证明值确实增加了。


    第 16 行将 `c` 的值重置为 `5`，第 17 行输出 `c` 的值。第 18 行输出表达式 `++c` 的值。该表达式是前置递增 `c`，因此其值增加；然后输出新值（6）。第
    19 行再次输出 `c` 的值，以显示在执行第 18 行后 `c` 的值仍为 6。


    #### 使用算术复合赋值、递增递减运算符简化语句


    算术复合赋值运算符递增递减运算符可以简化程序语句。例如，[图 3.3] 中的三个赋值语句（第 21、24 和 28 行）


    ```

    passes = passes + 1;


    failures = failures + 1;


    studentCounter = studentCounter + 1;

    ```


    可以使用复合赋值运算符更简洁地写为：


    ```

    passes += 1;


    failures += 1;


    studentCounter += 1;

    ```


    使用前置递增运算符：


    ```

    ++passes;


    ++failures;


    ++studentCounter;

    ```


    或使用后置递增运算符：


    ```

    passes++;


    failures++;


    studentCounter++;

    ```


    当单独语句中对变量递增或递减时，前置递增和后置递增的效果相同，前置递减和后置递减的效果也相同。只有当变量出现在更大的表达式上下时，前置递增或后置递增变量才有不同的效果（前置递减或后置递减亦如此）。


    对无法赋值的表达式尝试使用递增或递减运算符是语法错误。例如，编写 `++(x + 1)` 是语法错误，因为 `(x + 1)` 不是变量。


