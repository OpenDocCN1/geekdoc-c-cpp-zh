    \n##### Scope Demonstration\n\n[Figure 5.7](#ch05.xhtml_fig5_7) demonstrates scoping\
    \ issues with global variables, local variables and `static` local variables.\
    \ We show portions of the program with their corresponding outputs for discussion\
    \ purposes. Line 10 declares and initializes global variable `x` to 1\\. This\
    \ global variable is hidden in any block (or function) that declares a variable\
    \ named `x`.\n\n![Images](Images/05fig07.jpg)\n\n**Fig. 5.7** Scoping example.\n\
    \n##### Function `main`\n\nIn `main`, line 13 displays the value of global variable\
    \ `x`. Line 15 initializes local variable `x` to `5`. Line 17 outputs this variable\
    \ to show that the global `x` is hidden in `main`. Next, lines 19–23 define a\
    \ new block in `main` in which another local variable `x` is initialized to `7`\
    \ (line 20). Line 22 outputs this variable to show that it hides `x` in the outer\
    \ block of `main` as well as the global `x`. When the block exits, the variable\
    \ `x` with value `7` is destroyed automatically. Next, line 25 outputs the local\
    \ variable `x` in the outer block of `main` to show that it’s no longer hidden.\n\
    \n```\n12    int main() {\n\n13       cout << \"global x in main is \" << x <<\
    \ endl;\n\n14\n\n15       const int x{5}; // local variable to main\n\n16\n\n\
    17       cout << \"local x in main's outer scope is \" << x << endl;\n\n18\n\n\
    19       { // block starts a new scope                                 \n\n20\
    \          const int x{7}; // hides both x in outer scope and global x\n\n21 \
    \                                                                    \n\n22  \
    \        cout << \"local x in main's inner scope is \" << x << endl;  \n\n23 \
    \      }\n\n24\n\n25       cout << \"local x in main's outer scope is \" << x\
    \ << endl;\n\n26\n```\n\n```\nglobal x in main is 1\n\nlocal x in main's outer\
    \ scope is 5\n\nlocal x in main's inner scope is 7\n\nlocal x in main's outer\
    \ scope is 5\n```\n\nTo demonstrate other scopes, the program defines three functions—`useLocal`,\
    \ `useStaticLocal` and `useGlobal`—each of which takes no arguments and returns\
    \ nothing. The rest of `main` (shown below) calls each function twice in lines\
    \ 27–32\\. After executing functions `useLocal`, `useStaticLocal` and `useGlobal`\
