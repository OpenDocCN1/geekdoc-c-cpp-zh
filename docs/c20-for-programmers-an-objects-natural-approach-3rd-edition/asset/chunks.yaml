- fmt: "\n# Dr. Harvey Deitel\n\nChairman and Chief Strategy Officer of Deitel & Associates,\
    \ Inc., has over 50 years of experience in the computer field. Dr. Deitel earned\
    \ B.S. and M.S. degrees in Electrical Engineering from MIT and a Ph.D. in Mathematics\
    \ from Boston University. He has extensive college teaching experience, including\
    \ earning tenure and serving as the Chairman of the Computer Science Department\
    \ at Boston College before founding Deitel & Associates, Inc., in 1991 with his\
    \ son, Paul. The Deitels’ publications have earned international recognition,\
    \ with translations published in Japanese, German, Russian, Spanish, French, Polish,\
    \ Italian, Simplified Chinese, Traditional Chinese, Korean, Portuguese, Greek,\
    \ Urdu and Turkish. Dr. Deitel has delivered hundreds of programming courses to\
    \ corporate, academic, government and military clients.\n\n# The Professional\
    \ Programmer’s Deitel^® Guide to Modern C++ Using C++20, the C++ Standard Library,\
    \ Open-Source Libraries and More\n\nThe C++ programming language is popular for\
    \ developing systems software, embedded systems, operating systems, real-time\
    \ systems, games, communications systems and other high-performance computer applications.\
    \ `C++20 for Programmers` is an introductory-through-intermediate-level, tutorial\
    \ presentation of Modern C++, which consists of the four most recent C++ standards:\
    \ `C++11`, `C++14`, `C++17` and `C++20`.\n\nWritten for programmers with a background\
    \ in another high-level language, `C++20 for Programmers` applies the Deitel signature\
    \ `live-code approach` to teaching Modern C++ and explores the `C++20 language\
    \ and libraries` in depth. The book presents concepts in fully tested programs,\
    \ complete with code walkthroughs, syntax coloring, code highlighting and program\
    \ outputs. It features hundreds of complete C++20 programs with thousands of lines\
    \ of proven code, and hundreds of software-development tips with a special focus\
    \ on performance and security, that will help you build robust applications.\n\
    \nStart with C++ fundamentals and the Deitels’ classic treatment of object-oriented\
    \ programming—classes, inheritance, polymorphism, operator overloading and exception\
    \ handling. Then discover additional topics, including:\n\n• Functional-style\
    \ programming and lambdas\n• Concurrency and parallelism for optimal multi-core\
    \ and big data performance\n• The Standard Template Library’s containers, iterators\
    \ and algorithms, upgraded to `C++20`\n• Text files, CSV files, JSON serialization\n\
    • Defining custom function templates and class templates\n\nAlong the way, you’ll\
    \ learn compelling new `C++20` features, including `modules`, `concepts`, `ranges`,\
    \ `coroutines` and Python-style `text formatting`. When you’re finished, you’ll\
    \ have everything you need to build industrial-strength, object-oriented C++ applications.\n\
    \n# Keep in Touch with the Authors\n\n• Contact the authors at: `deitel@deitel.com`\n\
    • Join the Deitel social media communities:\n  - LinkedIn® at `https://bit.ly/DeitelLinkedIn`\n\
    \  - Facebook® at `https://facebook.com/DeitelFan`\n  - Twitter® at `https://twitter.com/deitel`\n\
    \  - YouTube™ at `https://youtube.com/DeitelTV`\n• For source code and updates,\
    \ visit: `https://deitel.com/c-plus-plus-20-for-programmers`\n"
  raw: '**Dr. Harvey Deitel**, Chairman and Chief Strategy Officer of Deitel & Associates,
    Inc., has over 50 years of experience in the computer field. Dr. Deitel earned
    B.S. and M.S. degrees in Electrical Engineering from MIT and a Ph.D. in Mathematics
    from Boston University. He has extensive college teaching experience, including
    earning tenure and serving as the Chairman of the Computer Science Department
    at Boston College before founding Deitel & Associates, Inc., in 1991 with his
    son, Paul. The Deitels’ publications have earned international recognition, with
    translations published in Japanese, German, Russian, Spanish, French, Polish,
    Italian, Simplified Chinese, Traditional Chinese, Korean, Portuguese, Greek, Urdu
    and Turkish. Dr. Deitel has delivered hundreds of programming courses to corporate,
    academic, government and military clients.


    **The Professional Programmer’s Deitel^® Guide to Modern C++ Using C++20, the
    C++ Standard Library, Open-Source Libraries and More**


    The C++ programming language is popular for developing systems software, embedded
    systems, operating systems, real-time systems, games, communications systems and
    other high-performance computer applications. ***C++20 for Programmers*** is an
    introductory-through-intermediate-level, tutorial presentation of Modern C++,
    which consists of the four most recent C++ standards: C++11, C++14, C++17 and
    C++20.


    Written for programmers with a background in another high-level language, *C++20
    for Programmers* applies the Deitel signature **live-code approach** to teaching
    Modern C++ and explores the **C++20 language and libraries** in depth. The book
    presents concepts in fully tested programs, complete with code walkthroughs, syntax
    coloring, code highlighting and program outputs. It features hundreds of complete
    C++20 programs with thousands of lines of proven code, and hundreds of software-development
    tips with a special focus on performance and security, that will help you build
    robust applications.


    Start with C++ fundamentals and the Deitels’ classic treatment of object-oriented
    programming—classes, inheritance, polymorphism, operator overloading and exception
    handling. Then discover additional topics, including:


    • Functional-style programming and lambdas


    • Concurrency and parallelism for optimal multi-core and big data performance


    • The Standard Template Library’s containers, iterators and algorithms, upgraded
    to C++20


    • Text files, CSV files, JSON serialization


    • Defining custom function templates and class templates


    Along the way, you’ll learn compelling new **C++20** features, including **modules**,
    **concepts**, **ranges**, **coroutines** and Python-style **text formatting**.
    When you’re finished, you’ll have everything you need to build industrial-strength,
    object-oriented C++ applications.


    **Keep in Touch with the Authors**


    • Contact the authors at: **[deitel@deitel.com](mailto:deitel@deitel.com)**


    • Join the Deitel social media communities:


    LinkedIn® at **[https://bit.ly/DeitelLinkedIn](https://bit.ly/DeitelLinkedIn)**


    Facebook® at **[https://facebook.com/DeitelFan](https://facebook.com/DeitelFan)**


    Twitter® at **[https://twitter.com/deitel](https://twitter.com/deitel)**


    YouTube™ at **[https://youtube.com/DeitelTV](https://youtube.com/DeitelTV)**


    • For source code and updates, visit: **[https://deitel.com/c-plus-plus-20-for-programmers](https://deitel.com/c-plus-plus-20-for-programmers)**'
