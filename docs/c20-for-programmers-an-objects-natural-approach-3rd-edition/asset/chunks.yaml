    details in a single line of code. [Figure 4.2](#ch04.xhtml_fig4_2) reimplements
    the application of [Fig. 4.1](#ch04.xhtml_fig4_1) using a `for` statement.


    ![Images](Images/04fig02.jpg)


    **Fig. 4.2** Counter-controlled iteration with the `for` iteration statement.


    When the `for` statement (lines 9–11) begins executing, the control variable `counter`
    is declared and initialized to `1`. Next, the program checks the loop-continuation
    condition, `counter <= 10`, which is between the two required semicolons. Because
    `counter`’s initial value is `1`, the condition is true. So, the body statement
    (line 10) displays `counter`’s value (`1`). After executing the loop’s body, the
    program increments `counter` in the expression `++counter`, which appears to the
    right of the second semicolon. Then the program performs the loop-continuation
    test again to determine whether to proceed with the loop’s next iteration. At
    this point, `counter`’s value is `2`, so the condition is still true, so the program
    executes the body statement again. This process continues until the loop has displayed
    the numbers 1–10 and `counter`’s value becomes `11`. At this point, the loop-continuation
    test fails, iteration terminates, and the program continues executing at the first
    statement after the `for` (line 13).


    ##### A Closer Look at the `for` Statement’s Header


    The following diagram takes a closer look at the `for` statement in [Fig. 4.2](#ch04.xhtml_fig4_2):


    ![Images](Images/04unfig01.jpg)


    The first line—including the keyword `for` and everything in the parentheses after
    `for` (line 9 in [Fig. 4.2](#ch04.xhtml_fig4_2))—is sometimes called the **`for`**
    **statement header**. The `for` header “does it all”—it specifies each item needed
    for counter-controlled iteration with a control variable.


    ##### General Format of a `for` Statement


    The general format of the `for` statement is


    `for` `(`*initialization*`;` *loopContinuationCondition*`;` *increment*`) {`


         *statement*


    `}`


    where


    • the *initialization* expression names the loop’s control variable and provides
    its initial value,


    • the *loopContinuationCondition* determines whether the loop should continue
    executing and


    • the *increment* modifies the control variable’s value so that the loop-continuation
    condition eventually becomes false.


    The two semicolons in the `for` header are required. If the loop-continuation
    condition is initially false, the program does not execute the `for` statement’s
    body. Instead, execution proceeds with the statement following the `for`.


    ##### Scope of a `for` Statement’s Control Variable


    If the *initialization* expression in the `for` header declares the control variable,
    it can be used only in that `for` statement—not beyond it. This restricted use
    is known as the variable’s **scope**, which defines where it can be used in a
    program. For example, a variable’s scope is from its declaration point to the
    right brace that closes the block. We discuss scope in detail in [Chapter 5](#ch05.xhtml_ch05).


    ##### Expressions in a `for` Statement’s Header Are Optional


    All three expressions in a `for` header are optional. If you omit the *loopContinuationCondition*,
    the condition is always true, thus creating an infinite loop. You might omit the
    *initialization* expression if the program initializes the control variable before
    the loop. You might omit the *increment* expression if the program calculates
    the increment in the loop’s body or if no increment is needed.


    The increment expression in a `for` acts like a standalone statement at the end
    of the `for`’s body. Therefore, the increment expressions


    ```

    counter = counter + 1


    counter += 1


    ++counter


    counter++

    ```


    are equivalent in a `for` statement. Many programmers prefer `counter++` because
    it’s concise and because a `for` loop evaluates its increment expression after
    its body executes, so the postfix increment form seems more natural. In this case,
    the increment expression does not appear in a larger expression, so preincrementing
    and postincrementing have the same effect. We prefer preincrement. In [Chapter
    14](#ch14.xhtml_ch14)’s operator overloading discussion, you’ll see that preincrement
    can have a performance advantage.


    ##### Using a `for` Statement’s Control Variable in the Statement’s Body


    Programs frequently display the control-variable value or use it in calculations
    in the loop body, but this use is not required. The control variable is commonly
    used to control iteration without being mentioned in the body of the `for`.


    Although the value of the control variable can be changed in a `for` loop’s body,
    avoid doing so, because this practice can lead to subtle errors. If a program
    must modify the control variable’s value in the loop’s body, use `while` rather
    than `for`.


    ##### UML Activity Diagram of the `for` Statement


    Below is the UML activity diagram of the `for` statement in [Fig. 4.2](#ch04.xhtml_fig4_2):


    ![Images](Images/04unfig02.jpg)


    The diagram makes it clear that initialization occurs only once—before testing
    the loop-continuation condition the first time. Incrementing occurs each time
    through the loop after the body statement executes.


    ### 4.4 Examples Using the `for` Statement


    The following examples show techniques for varying the control variable in a `for`
    statement. In each case, we write only the appropriate `for` header. Note the
    change in the relational operator for the loops that decrement the control variable.


    a) Vary the control variable from `1` to `100` in increments of `1`.


    ```

    for (int i{1}; i <= 100; ++i)

    ```


    b) Vary the control variable from `100` *down* to `1` in *decrements* of `1`.


    ```

    for (int i{100}; i >= 1; --i)

    ```


    c) Vary the control variable from `7` to `77` in increments of `7`.


    ```

    for (int i{7}; i <= 77; i += 7)

    ```


    d) Vary the control variable from `20` *down* to `2` in *decrements* of `2`.


    ```

    for (int i{20}; i >= 2; i -= 2)

    ```


    e) Vary the control variable over the values `2`, `5`, `8`, `11`, `14`, `17`,
    `20`.


    ```

    for (int i{2}; i <= 20; i += 3)

    ```


    f) Vary the control variable over the values `99`, `88`, `77`, `66`, `55`, `44`,
    `33`, `22`, `11`, `0`.


    ```

    for (int i{99}; i >= 0; i -= 11)

    ```


    Do not use equality operators (`!=` or `==`) in a loop-continuation condition
    if the loop’s control variable increments or decrements by more than `1`. For
    example, in the `for` statement header


    ```

    for (int counter{1}; counter != 10; counter += 2)

    ```


    `counter != 10` never becomes false (resulting in an infinite loop) because `counter`
    increments by 2 after each iteration, producing only the odd values (3, 5, 7,
    9, 11, …).'
