  trans: "\n在常规算术中，浮点数通常是除法产生的结果——当我们将 10 除以 3 时，结果是 3.3333333…，其中 3 的序列无限重复。计算机只分配固定长度的空间来存储此类值，因此存储的浮点值只能是一个近似值。如你所见，`double`\
    \ 遭受了所谓的**表示误差**。假设浮点数是精确表示的（例如，在相等性比较中使用它们）可能会导致错误的结果。\n\n浮点数有许多应用，特别是对于测量值。例如，当我们谈到\
    \ 98.6 华华氏的“正常”体温时，我们不需要精确到很多位小数数字。当我们从温度计上读到温度为 98.6 时，它的实际值可能是 98.5999473210643。对于大多数涉及体温的应用来说，将这个数字称为\
    \ 98.6 是可以的。通常情况下，`double` 类型优于 `float` 类型，因为 `double` 变量可以更精确地表示浮点数。我们在本书中全程使用\
    \ `double`。\n\n### 关于显示舍入值的警告\n\n在这个示例中，我们声明变量 `amount`、`principal` 和 `rate` 为\
    \ `double` 类型。我们处理的是美元的小数部分，因此需要一种可以在其值中允许小数点的类型。遗憾的是，浮点数可能会引起麻烦。以下是使用浮点数表示显示为小数点后两位的美元金额时可能出现问题的简单解释。机器中存储的两个计算美元金额可能是\
    \ 14.234（为了显示而舍入为 14.23）和 18.673（为了显示而舍入为 18.67）。当这些金额相加时，它们产生内部和 32.907，该和通常会被舍入为\
    \ 32.91 用于显示。因此，你的输出可能显示为\n\n```\n 14.23\n+ 18.67\n  32.91\n```\n\n但按显示的单个数字进行相加的人会预期总和为\
    \ 32.90。你已经收到警告了！\n\n### 即使是常见的美元金额在浮点中也存在表示误差\n\n即使是简单的美元金额（例如你可能在购物或餐厅账单上看到的），当它们被存储为\
    \ `double` 时也可能存在表示误差。为了看到这一点，我们创建了一个简单的程序，声明如下：\n\n```\ndouble d = 123.02;\n\
    ```\n\n然后用小数点右侧的许多位精度显示变量 `d` 的值。产生的输出将 123.02 显示为 123.0199999…，这是表示误差的另一个例子。虽然某些美元金额可以作为\
    \ `double` 精确表示，但许多并不能。这是许多编程语言中的共同问题。在书的后后部分，我们将创建并使用能够精确处理货币金额的类。\n\n### 4.7\
    \ do…while 迭代语句\n\n`do…while` 迭代语句与 `while` 语句相似。在 `while` 语句中，程序在循环开始处、执行循环体之前测试循环继续条件。如果条件为假，则循环体永远不会执行。`do…while`\
    \ 语句在执行循环体后测试循环继续条件；因此，循环体至少执行一次。当 `do…while` 语句终止时，执行将继续执行序列中的下一个语句。图 4.5 使用\
    \ `do…while` 输出数字 1–10。\n\n![Images](img/04fig05.jpg)\n\n**图 4.5** `do…while`\
    \ 迭代语句。\n\n第 7 行声明并初始化了控制变量 `counter`。进入 `do…while` 语句后，第 10 行输出 `counter` 的值，第\
    \ 11 行递增 `counter`。然后程序评估底部的循环继续测试（第 12 行）。如果条件为真，循环在第一个体语句（第 10 行）继续。如果条件为假，循环终止，程序继续执行循环后的下一个语句。\n\
    \n### do…while 迭代语句的 UML 活动图\n\n图 4.5 中 `do…while` 语句的 UML 活动图清楚地表明，在循环至少执行一次动作状态之前，不会评估循环继续条件：\n\
    \n![Images](img/04unfig03.jpg)\n\n### 4.8 switch 多路选择语句\n\nC++ 提供了 `switch` 多路选择语句，根据变量或表达式可能在许多不同动作之间进行选择。每个动作都与整数常量表达式的值（即任何字符和整数常量的组合，其结果为常量整数值）相关联。\n\
    \n### 使用 switch 语句统计 A, B, C, D 和 F 等级\n\n图 4.6 计算用户输入的一组数字成绩的班级平均分。`switch` 语句确定每个成绩对应的字母等效值（A,\
    \ B, C, D 或 F），并递增相应的等级计数器。该程序还显示了获得每个等级的学生数摘要。\n\n![Images](img/04fig06.jpg)![Images](img/04fig06.jpg)\n\
    \n**图 4.6** 使用 `switch` 语句统计等级。（第 1 部分，共 3 部分）\n\n`main` 函数（图 4.6](#ch04.xhtml_fig4_6））声明局部变量\
    \ `total`（第 8 行）和 `gradeCounter`（第 9 行），分别跟踪输入成绩的总和和成绩数量。\n\n### 从用户读取成绩\n\n第\
    \ 16–19 行提示用户输入整数成绩或输入文件结束符以终止输入。文件结束符是取决于系统的按键组合。在第 9 章文件处理中，你将看到从文件读取输入时如何使用文件结束符。\n\
    \n输入文件结束符的按键组合取决于系统。在 UNIX/Linux/macOS 系统上，单独起一行输入 `<Ctrl> d`。这种表示法意味着同时按下 *Ctrl*\
    \ 键和 *d* 键。在 Windows 系统上，输入 `<Ctrl> z`。某些系统在输入文件结束符键序列后必须按下 *Enter*。此外，当你输入文件结束符时，Windows\
    \ 通常会在屏幕上显示 `^Z`，如图 4.6](#ch04.xhtml_fig4_6) 的输出所示。\n\n`while` 语句（第 24–51 行）获取用户输入。第\
    \ 24 行\n\n```\nwhile (cin >> grade) {\n```\n\n在 `while` 语句中执行输入。在这种情况下，如果 `cin`\
    \ 成功读取一个 `int` 值，则循环继续条件评估为真。如果用户输入文件结束符，则条件评估为假。\n\n如果条件评估为真，第 25 行将 `grade`\
    \ 加到 `total`，第 26 行递增 `gradeCounter`。这些变量用于计算平均分。接下，第 29–50 行使用 `switch` 语句根据输入的数字成绩递增相应的等级计数器。\n\
    \n##### 处理成绩\n\n"
