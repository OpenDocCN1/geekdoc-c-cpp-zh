    by explicitly assigning the value to a variable of lower type (some compilers
    will issue a warning in this case) or by using a cast operator. Function argument
    values are converted to the parameter types in a function prototype as if they
    were being assigned directly to variables of those types. If a `square` function
    with an `int` parameter is called with a `double` argument, the argument is converted
    to `int` (a lower type and thus a narrowing conversion), and `square` could return
    an incorrect value. For example, `square(4.5)` would return `16`, not `20.25`.
    Some compilers warn you about the narrowing conversion. For example, Microsoft
    Visual C++ issues the warning,


    ```

    ''argument'': conversion from ''double'' to ''int'', possible loss of data

    ```


    ##### Narrowing Conversions with the Guidelines Support Library


    If you must perform an explicit narrowing conversion, the C++ Core Guidelines
    recommend using a **`narrow_cast`** **operator**^([6](#ch03.xhtml_ch0fn6)) from
    the **Guidelines Support Library (GSL)**—we’ll use this in [Figs. 5.5](#ch05.xhtml_fig5_5)
    and [5.6](#ch05.xhtml_fig5_6). This library has several implementations. Microsoft
    provides an open-source version that has been tested on numerous platform/compiler
    combinations, including our three preferred compilers and platforms. You can download
    their GSL implementaton from:


    ```

    https://github.com/Microsoft/GSL

    ```


    [6](#ch03.xhtml_rch0fn6). C++ Core Guidelines. Accessed May 10, 2020\. [`http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Res-narrowing`](http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Res-narrowing).


    For your convenience, we provided the GSL library with this book’s code examples
    in the subfolder `libraries/GSL`.


    The GSL is a header-only library, so you can use it in your programs simply by
    including the header `"gsl/gsl"`. You must point your compiler to the `GSL` folder’s
    `include` sub-folder, so the compiler knows where to find the include file, as
    you did when you used class `BigNumber` at the end of Section 3.12\. The following
    statement uses the `narrow_cast` operator (from namespace `gsl`) to convert the
    double value `7.5` to the `int` value `7`:


    ```

    gsl::narrow_cast<int>(7.5)

    ```


    As with the other named cast operators, like `static_cast`, the value in parentheses
    is converted to the type in angle brackets, `<>`.


    ### 5.7 C++ Standard Library Headers


    The C++ Standard Library is divided into many portions, each with its own header.
    The headers contain the function prototypes for the related functions that form
    each portion of the library. The headers also contain definitions of various class
    types and functions, as well as constants needed by those functions. A header
    “instructs” the compiler on how to interface with library and user-written components.


    The following table lists some common C++ Standard Library headers, many of which
    are discussed later in this book. The term “macro” that’s used several times is
    discussed in detail in [Appendix E](#app05.xhtml_app05), Preprocessor. For a complete
    list of the 96 C++20 standard library headers, visit


    ```

    https://en.cppreference.com/w/cpp/header

    ```


    On that page, you’ll see approximately three dozen additional headers that are
    marked as either deprecated or removed. Deprecated headers are ones you should
    no longer use, and removed headers are no longer included in the C++ standard
    library.


    ![Images](Images/f0154-01.jpg)![Images](Images/f0154-01a.jpg)![Images](Images/f0154-01b.jpg)![Images](Images/f0154-01c.jpg)


    ### 5.8 Case Study: Random-Number Generation


    We now take a brief and hopefully entertaining diversion into a popular programming
    application, namely simulation and game playing. In this and the next section,
    we develop a game-playing program that includes multiple functions.


    ##### The `rand` Function


    The element of chance can be introduced into computer applications by using the
    C++ Standard Library function **`rand`**. Consider the following statement:


    ```

    i = rand();

    ```


    The function `rand` generates an integer between 0 and `RAND_MAX` (a symbolic
    constant defined in the `<cstdlib>` header). You can determine the value of `RAND_MAX`
    for your system simply by displaying the constant. If `rand` truly produces integers
    at random, every number between 0 and `RAND_MAX` has an equal chance (or probability)
    of being chosen each time `rand` is called.'
