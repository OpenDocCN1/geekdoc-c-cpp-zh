    #### 变量声明和列表初始化


    第 8–10 行


    ```

    int number1{0}; // 第一个加数 (0)


    int number2{0}; // 第二个加数 (0)


    int sum{0}; // number1 和 number2 的和 (0)

    ```


    这些是 `declarations`（声明）——`number1`、`number2` 和 `sum` 是变量名。这些声明指定变量 `number1`、`number2`
    和 `sum` 是 `int` 类型的数据，这意味着这些变量将持有整数（全数）值。所有变量必须使用名称和数据类型进行声明。第 8–10 行通过在紧随变量名的大括号（`{`
    和 `}`）中放置值，将每个变量初始化为 `0`——这种方法被称为列表初始化（list initialization），它是 C++11 引入的。虽然并非总是需要初始化变量，但这样做可以帮助你避免许多问题。在
    C++11 之前，第 8–10 行会写为：


    ```

    int number1 = 0; // 第一个加数 (0)


    int number2 = 0; // 第二个加数 (0)


    int sum = 0; // number1 和 number2 的和 (0)

    ```


    如果你处理旧的 C++ 程序，可能会遇到这种旧代码风格的初始化语句。在随后的章节中，我们将讨论列表初始化的各种。


    #### 一次性声明多个变量


    相同类型的多个变量可以在一个声明中声明——例如我们可以使用逗号分隔列表一次性声明并初始化所有三个变量：


    ```

    int number1{0}, number2{0}, sum{0};

    ```


    但这会降低程序的可读性，并使得为每个变量提供描述注释变得很笨拙。


    #### 基本类型


    我们将很快讨论用于指定实数的 `double` 类型和用于指定字符数据的 `char` 类型。实数是带有小数点的数字，例如 3.4、0.0 和 –11.19。`char`
    变量可以仅持有单个小写字母、大写字母、数字或特殊字符（例如 `$` 或 `*`）。如 `int`、`double` 和 `char` 等类型被称为基本类型。基本类型名称由一个或多个关键字组成，且必须全部小小写。有关
    C++ 基本类型的完整列表及其典型范围，请参阅


