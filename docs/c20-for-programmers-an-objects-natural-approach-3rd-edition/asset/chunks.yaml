    # 5.9 Case Study: Game of Chance; Introducing Scoped `enum`s


    One of the most popular games of chance is a dice game known as “craps,” which
    is played in casinos and back alleys worldwide. The rules of the game are straightforward:


    *A player rolls two dice. Each die has six faces. These faces contain 1, 2, 3,
    4, 5 and 6 spots. After the dice have come to rest, the sum of the spots on the
    two upward faces is calculated. If the sum is 7 or 11 on the first roll, the player
    wins. If the sum is 2, 3 or 12 on the first roll (called “craps”), the player
    loses (i.e., the “house” wins). If the sum is 4, 5, 6, 8, 9 or 10 on the first
    roll, then that sum becomes the player’s “point.” To win, you must keep rolling
    the dice until you “make your point.” The player loses by rolling a 7 before making
    the point.*


    In the rules, notice that the player must roll two dice on the first roll and
    all subsequent rolls. We will define a `rollDice` function to roll the dice and
    compute and display their sum. The function will be defined once, but may be called
    multiple times—once for the game’s first roll and possibly many more times if
    the player does not win or lose on the first roll. Below are the outputs of several
    sample executions showing:


    • winning on the first roll by rolling a 7,

    • losing on the first roll by rolling a 12,

    • winning on a subsequent roll by “making the point” before rolling a 7, and

    • losing on a subsequent roll by rolling a 7 before “making the point.”


    ```

    Player rolled 2 + 5 = 7


    Player wins

    ```


    ```

    Player rolled 6 + 6 = 12


    Player loses

    ```


    ```

    Player rolled 3 + 3 = 6


    Point is 6


    Player rolled 5 + 3 = 8


    Player rolled 4 + 5 = 9


    Player rolled 2 + 1 = 3


    Player rolled 1 + 5 = 6


    Player wins

    ```


    ```

    Player rolled 1 + 3 = 4


    Point is 4


    Player rolled 4 + 6 = 10


    Player rolled 2 + 4 = 6


    Player rolled 6 + 4 = 10


    Player rolled 2 + 3 = 5


    Player rolled 2 + 4 = 6


    Player rolled 1 + 1 = 2


    Player rolled 4 + 4 = 8


    Player rolled 4 + 3 = 7


    Player loses

    ```


    ## Implementing the Game


    The craps program ([Fig. 5.5](#ch05.xhtml_fig5_5)) simulates the game using two
    functions—`main` and `roll-Dice`—and the `switch`, `while`, `if…else`, nested
    `if…else` and nested `if` statements. Function `rollDice`’s prototype (line 9)
    indicates that the function takes no arguments (empty parentheses) and returns
    an `int` (the sum of the dice).


    ![Images](Images/05fig05.jpg)


    **Fig. 5.5** Craps simulation.


    ## C++11: Scoped `enum`s


    The player may win or lose on the first roll or any subsequent roll. The program
    tracks this with the variable `gameStatus`, which line 19 declares to be of the
    new type `Status`. Line 13 declares a user-defined type called a **scoped** **enumeration**
    which is introduced by the keywords `enum class`, followed by a type name (`Status`)
    and a set of identifiers representing integer constants:


    ```cpp

    12    // scoped enumeration with constants that represent the game status


    13    enum class Status {keepRolling, won, lost}; // all caps in constants


    14


    15    // randomize random number generator using current time


    16    srand(gsl::narrow_cast<unsigned int>(time(0)));


    17


    18    int myPoint{0}; // point if no win or loss on first roll


    19    Status gameStatus{Status::keepRolling}; // game is not over


    20

    ```


    The underlying values of these **enumeration constants** are of type `int`, start
    at `0` and increment by `1`, by default (you’ll soon see how to change this).
    In the `Status` enumeration, the constant `keepRolling` has the value 0, `won`
    has the value 1, and `lost` has the value 2. The identifiers in an `enum class`
    must be unique, but separate enumeration constants can have the same value. Variables
    of user-defined type `Status` can be assigned only the constants declared in the
    enumeration.


    By convention, you should capitalize the first letter of an `enum class`’s name
    and the first letter of each subsequent word in a multi-word `enum class` name
    (e.g., `ProductCode`). The constants in an `enum class` should use the same naming
    conventions as variables.


    [9](#ch03.xhtml_rch0fn9). C++ Core Guidelines. Accessed May 11, 2020. [`https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Renum-caps`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Renum-caps).


    [10](#ch03.xhtml_rch0fn10). In legacy C++ code, you’ll commonly see `enum` constants
    in all uppercase letters—that practice is now deprecated.


    To reference a scoped `enum` constant, qualify the constant with the scoped `enum`’s
    type name (in this example, `Status`) and the scope-resolution operator (`::`),
    as shown in line 19, which initializes `gameStatus` to `Status::keepRolling`.
    For a win, the program sets `gameStatus` to `Status::won`. For a loss, the program
    sets `gameStatus` to `Status::lost`.


    ### Winning or Losing on the First Roll


    The following `switch` determines whether the player wins or loses on the first
    roll:


    ```cpp

    21    // determine game status and point (if needed) based on first roll


    22    switch (const int sumOfDice{rollDice()}; sumOfDice) {


    23       case 7: // win with 7 on first roll


    24       case 11: // win with 11 on first roll


    25          gameStatus = Status::won;

    26          break;

    27       case 2: // lose with 2 on first roll


    28       case 3: // lose with 3 on first roll


    29       case 12: // lose with 12 on first roll


    30          gameStatus = Status::lost;

    31          break;

    32       default: // did not win or lose


    33          myPoint = sumOfDice;


    34          cout << "Point is " << myPoint << endl;

    35          break;

    36    }

    ```


    17 The `switch`’s initializer (line 22) creates the variable `sumOfDice` and initializes
    it by calling `rollDice`. If the roll is `7` or `11`, line 25 sets `gameStatus`
    to `Status::won`. If the roll is `2`, `3`, or `12`, line 30 sets `gameStatus`
    to `Status::lost`. For other values, `gameStatus` remains (`Status::keepRolling`),
    line 33 saves `sumOfDice` in `myPoint`, and line 34 displays the `myPoint`.


    ### Continuing to Roll


    After the first roll, if `gameStatus` is `Status::keepRolling`, execution proceeds
    with the following `while` statement:


    ```cpp

    38     // while game is not complete


    39     while (Status::keepRolling == gameStatus) { // not won or lost


    40        // roll dice and determine game status


    41        if (const int sumOfDice{rollDice()}; sumOfDice == myPoint) {


    42           gameStatus = Status::won;


    43        }


    44        else {


    45           if (sumOfDice == 7) { // lose by 7 before point


    46              gameStatus = Status::lost;

    47           }

    48        }


    49     }

    ```


    17 In each iteration of the `while`, the `if` statement’s initializer (line 41)
    calls `rollDice` to produce a new `sumOfDice`. If `sumOfDice` matches `myPoint`,
    the program sets `gameStatus` to `Status::won` (line 42), and the loop terminates.
    If `sumOfDice` is `7`, the program sets `gameStatus` to `Status::lost` (line 46),
    and the loop terminates. Otherwise, the loop continues executing.


    ### Displaying Whether the Player Won or Lost


    When the preceding loop terminates, the program proceeds to the following `if…else`
    statement, which prints `"Player wins"` if `gameStatus` is `Status::won` or `"Player
    loses"` if `gameStatus` is `Status::lost`:


    ```cpp

    51      // display won or lost message


    52      if (Status::won == gameStatus) {


    53         cout << "Player wins" << endl;


    54      }


    55      else {


    56         cout << "Player loses" << endl;


    57      }


    58   }

    ```


    ### Function `rollDice`


    To roll the dice, function `rollDice` uses the die-rolling calculation shown previously
    to initialize variables `die1` and `die2`, then calculates their `sum`. Lines
    67–68 display `die1`’s, `die2`’s and `sum`’s values before line 69 returns `sum`.

    '
