    #### 14 C++14 Digit Separators for Numeric Literals


    Before C++14, you’d represent the integer value 60,000,000 as `60000000` in a
    program. Typing numeric literals with many digits can be error-prone. To make
    numeric literals more readable and help reduce errors, you can use C++14’s `digit
    separator` `''` (a single-quote character) between groups of digits—`60''000''000`
    (line 17) represents the integer value 60,000,000. You might wonder why single-quote
    characters are used rather than commas. If we use `60,000,000` in line 17, C++
    treats the commas as comma operators, and the value of `60,000,000` would be the
    rightmost expression (`000`). The loop-continuation condition would immediately
    be false—a logic error in this program.


