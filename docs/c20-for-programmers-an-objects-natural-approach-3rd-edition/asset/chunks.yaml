  raw: "A program can test multiple cases by placing `if…else` statements inside other\
    \ `if…else` statements to create **nested** **`if`****…****`else`** **statements**.\
    \ For example, the following nested `if…else` prints `\"A\"` for exam grades greater\
    \ than or equal to 90, `\"B\"` for grades 80 to 89, `\"C\"` for grades 70 to 79,\
