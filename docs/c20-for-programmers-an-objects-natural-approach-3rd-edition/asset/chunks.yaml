    ## Identifiers


    A variable name (such as `number1`) is any valid `identifier` that is not a keyword.
    An identifier is a series of characters consisting of letters, digits and underscores
    (`_`) that does not begin with a digit. C++ is `case sensitive`—uppercase and
    lowercase letters are different, so `a1` and `A1` are different identifiers.


    C++ allows identifiers of any length, but some C++ implementations may restrict
    identifier lengths. Do not use identifiers that begin with underscores and double
    underscores, because C++ compilers use names like that for their own purposes
    internally.


    ## Placement of Variable Declarations


    Variable declarations can be placed almost anywhere in a program, but they must
    appear before the variables are used. For example, the declaration in line 8


    ```

    int number1{0}; // first integer to add (initialized to 0)

    ```


    could have been placed immediately before line 13


    ```

    std::cin >> number1; // read first integer from user into number1

    ```


    the declaration in line 9


    ```

    int number2{0}; // second integer to add (initialized to 0)

    ```


    could have been placed immediately before line 16


    ```

    std::cin >> number2; // read second integer from user into number2

    ```


    and the declaration in line 10


    ```

    int sum{0}; // sum of number1 and number2 (initialized to 0)

    ```


    could have been placed immediately before line 18


    ```

    sum = number1 + number2; // add the numbers; store result in sum

    ```


    In fact, lines 10 and 18 could have been combined into the following declaration
    and placed just before line 20:


    ```

    int sum{number1 + number2}; // initialize sum with number1 + number2

    ```


    ## Obtaining the First Value from the User


    Line 12


    ```

    std::cout << "Enter first integer: "; // prompt user for data

    ```


    displays `Enter first integer:` followed by a space. This message is called a
    `prompt` because it directs the user to take a specific action. Line 13


    ```

    std::cin >> number1; // read first integer from user into number1

    ```


    uses the `standard input stream object` `cin` (of namespace `std`) and the `stream
    extraction operator` `>>`, to obtain a value from the keyboard.


    When the preceding statement executes, the computer waits for the user to enter
    a value for variable `number1`. The user responds by typing an integer (as characters),
    then pressing the `Enter` key (sometimes called the `Return` key) to send the
    characters to the computer. The computer converts the character representation
    of the number to an integer value and assigns this value to the variable `number1`.
    Pressing `Enter` also causes the cursor to move to the beginning of the next line
    on the screen.


    When your program is expecting the user to enter an integer, the user could enter
    alphabetic characters, special symbols (like `#` or `@`) or a number with a decimal
    point (like `73.5`), among others. In these early programs, we assume that the
    user enters valid data. We’ll present various techniques for dealing with data-entry
    problems later.


    ## Obtaining the Second Value from the User


    Line 15


    ```

    std::cout << "Enter second integer: "; // prompt user for data

    ```


    displays `Enter second integer:` on the screen, prompting the user to take action.
    Line 16


    ```

    std::cin >> number2; // read second integer from user into number2

    ```


    obtains a value for variable `number2` from the user.


    ## Calculating the Sum of the Values Input by the User


    The assignment statement in line 18


    ```

    sum = number1 + number2; // add the numbers; store result in sum

    ```


    adds the values of variables `number1` and `number2` and assigns the result to
    variable `sum` using the `assignment operator` `=`. Most calculations are performed
    in assignment statements. The `=` operator and the `+` operator are `binary operators`
    because each has two operands. For the `+` operator, the two operands are `number1`
    and `number2`. For the preceding `=` operator, the two operands are `sum` and
    the value of the expression `number1 + number2`. Placing spaces on either side
    of a binary operator makes the operator stand out and makes the program more readable.


    ## Displaying the Result


    Line 20


    ```

    std::cout << "Sum is " << sum << std::endl; // display sum; end line

    ```


    displays the character string `"Sum is"` followed by the numerical value of variable
    `sum` followed by `std::endl`—a `stream manipulator`. The name `endl` is an abbreviation
    for “end line” and belongs to namespace `std`. The `std::endl` stream manipulator
    outputs a new-line, then “flushes the output buffer.” This simply means that,
    on some systems where outputs accumulate in the machine until there are enough
    to “make it worthwhile” to display them on the screen, `std::endl` forces any
    accumulated outputs to be displayed at that moment. This can be important when
    the outputs are prompting the user for an action, such as entering data.


    The preceding statement outputs multiple values of different types. The stream
    insertion operator “knows” how to output each type of data. Using multiple stream
    insertion operators (`<<`) in a single statement is referred to as `concatenating`,
    `chaining` or `cascading stream insertion operations`.


    Calculations can also be performed in output statements. We could have combined
    the statements in lines 18 and 20 into


    ```

    std::cout << "Sum is " << number1 + number2 << std::endl;

    ```


    The signature feature of C++ is that you can create your own data types called
    classes (we discuss this in Chapter 10) and explore it in depth in Chapter 11).
    You can then “teach” C++ how to input and output values of these data types using
    the `>>` and `<<` operators, respectively. This is called `operator overloading`,
    which we explore in Chapter 14.


    ## 2.5 Arithmetic


    The following table summarizes the `arithmetic operators`:


    ![Images](Images/p116-01.jpg)


    Note the use of various symbols not used in algebra. The asterisk `*` indicates
    multiplication and the percent sign `%` is the remainder operator, which we’ll
    discuss shortly. These arithmetic operators are all binary operators.


    ### Integer Division


    `Integer division` in which the numerator and the denominator are integers yields
    an integer quotient. For example, the expression `7/4` evaluates to `1`, and the
    expression `17 / 5` evaluates to `3`. Any fractional part in the result of integer
    division is truncated—no rounding occurs.


    ### Remainder Operator


    The `remainder operator`, `%`, yields the remainder after integer division and
    can be used only with integer operands—`x % y` yields the remainder after dividing
    `x` by `y`. Thus, `7%4` yields `3` and `17 % 5` yields `2`.


    ### Parentheses for Grouping Subexpressions


    Parentheses are used in C++ expressions in the same manner as in algebraic expressions.
    For example, to multiply `a` times the quantity `b + c` we write `a * (b + c)`.


    ### Rules of Operator Precedence


    C++ applies the operators in arithmetic expressions in a precise order determined
    by the following `rules of operator precedence`, which are generally the same
    as those in algebra:


    1. Expressions in parentheses evaluate first. Parentheses are said to be at the
    “highest level of precedence.” In cases of nested or embedded parentheses, such
    as


    ```

    (a * (b + c))

    ```


    expressions in the innermost pair of parentheses evaluate first.


    2. Multiplication, division and remainder operations evaluate next. If an expression
    contains several multiplication, division and remainder operations, they’re applied
    from left-to-right. These three operators are said to be on the same level of
    precedence.

