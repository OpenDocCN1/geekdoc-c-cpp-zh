    ## 2. C++ 编程简介


    ![Images](img/ch02.jpg)


    ### 目标


    在本章中，你将：


    - 编写简单的 C++ 程序。

    - 使用输入输出语句。

    - 使用基本数据类型。

    - 使用算术运算符。

    - 理解算术运算符的优先级。

    - 编写决策语句。

    - 使用关系运算符和相等运算符。

    - 在创建自己的自定义类之前，通过创建和使用 C++ 标准库 `string` 类的对象，开始理解“对象自然”的学习方法。


    ### 大纲


    - 2.1 简介

    - 2.2 第一个 C++ 程序：显示一行文本

    - 2.3 修改我们的第一个 C++ 程序

    - 2.4 另一个 C++ 程序：整数相加

    - 2.5 算术

    - 2.6 决策：相等运算符和关系运算符

    - 2.7 对象自然：创建和使用标准库类 `string` 的对象

    - 2.8 总结


    ### 2.1 简介


    本章介绍了几个代码示例，演示了程序如何显示消息以及从用户处获取数据进行处理。前三个示例在屏幕上显示消息。下一个示例从键盘用户获取两个数字，计算它们的和并显示结果——随后的讨论引入了
    C++ 的算术运算符。第五个示例通过展示如何比较两个数字，然后根据比较结果显示消息，演示了决策。


    #### “对象自然”学习方法


    在你的程序中，你将创建并使用许多经过仔细开发和测试的预定义类的对象，让你让你用最少的代码完成重要任务。这些类通常来自：


    - C++ 标准库，

    - 特定平台的库（例如微软提供的用于创建 Windows 应用，或 Apple 提供的用于创建 macOS 应用），以及

    - 由围绕所有主流现代编程语言的大型开源社区经常创建的免费第三方库。


    为了帮助你在书中早期理解这种编程风格，你将在创建自己的自定义类之前，先创建并使用预定义 C++ 标准库类的对象。我们称这为“对象自然”方法。你将在本章的最后一个示例中开始创建并使用
    `string` 对象。在后面的章节中，你将创建自己的自定义类。你会发现 C++ 允许你“打造有价值的类”供自己使用，其他程序员也可以复用。


