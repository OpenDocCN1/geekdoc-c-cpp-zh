  trans: "\n\n在图 4.1 中，第 7、9 和 11 行定义了计数控制循环的元素。第 7 行将控制变量 `counter` 声明为 `int`，在内存中为其预留空间并将其初始值设置为\
    \ `1`。需要初始化的声明是可执行的语句。在 C++ 中，将同样预留内存的变量声明称为“定义”（definition）更为准确。由于定义也是声明，除非这种区分非常重要，否则我们通常会使用“声明”（declaration）一词。\n\
    \n第 10 行在循环的每次迭代中显示一次 `counter` 的值。第 11 行在循环每次迭代时将控制变量加 1。`while` 的循环继续条件（第 9\
    \ 行）测试控制变量的值是否小于等于 `10`（该条件为真的最后一个值）。即使控制变量为 `10`，程序也会执行 `while` 的循环体。当控制变量超过\
    \ `10` 时，循环终止。\n\n浮点值是近似的，因此使用浮点变量控制计数循环可能会导致计数值不精确以及终止测试不准确。出于如此，请始终使用整数值控制计数循环。\n\
    \n### 4.3 `for` 迭代语句\n\nC++ 还提供了 `for` 迭代语句，它可以在单行代码中指定计数控制迭代的细节。图 4.2 使用 `for`\
    \ 语句重新实现了图 4.1 的应用。\n\n![Images](img/04fig02.jpg)\n\n**图 4.2** 使用 `for` 迭代语句的计数控制循环。\n\
    \n当 `for` 语句（第 9–11 行）开始执行时，会声明控制变量 `counter` 并将其初始化为 `1`。接下来，程序检查循环继续条件 `counter\
    \ <= 10`，它位于两个所需的分号之间。由于 `counter` 的初始值为 `1`，因此该条件为真。于是，体语句（第 10 行）显示 `counter`\
    \ 的值（`1`）。在执行完循环体后，程序在表达式 `++counter` 中增加 `counter`，该表达式出现在第二个分号的右侧。然后，程序再次执行循环继续测试，以确定是否继续循环的下次迭代。此时，`counter`\
    \ 的值为 `2`，因此条件仍然为真，程序再次执行体语句。这个过程一直持续，直到循环显示了数字 1–10 且 `counter` 的值变为 `11`。此时，循环继续测试失败，迭代终止，程序继续执行\
    \ `for` 之后的第一条语句（第 13 行）。\n\n#### 深入观察 `for` 语句的头部\n\n下面的图详细查看了图 4.2 中的 `for`\
    \ 语句：\n\n![Images](img/04unfig01.jpg)\n\n第一行——包括关键字 `for` 以及 `for` 之后括号内的所有内容（图\
    \ 4.2 中的第 9 行）——有时被称为 `for` 语句头部。`for` 头部“包揽了一切”——它指定了使用控制变量进行计数控制迭代所需的每一项。\n\n\
    #### `for` 语句的通用格式\n\n`for` 语句的通用格式为\n\n```\nfor (initialization; loopContinuationCondition;\
    \ increment) {\n    statement\n}\n```\n\n其中\n\n-• `initialization` 表达式命名了循环的控制变量并提供了其初始值，\n\
    -• `loopContinuationCondition` 决定循环是否应该继续执行，\n-• `increment` 修改控制变量的值，使得循环继续条件最终变为假。\n\
    \n`for` 头部中的两个分号是必须的。如果循环继续条件初始为假，程序将不执行 `for` 语句的循环体。相反，执行将继续进行 `for` 之后的语句。\n\
    \n#### `for` 语句控制变量的作用域\n\n如果在 `for` 头部中的 `initialization` 表达式声明了控制变量，则它只能在该 `for`\
    \ 语句中使用——不能在它之外使用。这种限制的使用被称为变量的作用域（scope），它定义了变量在程序何处可以使用。例如，变量的作用域是从它的声明点到关闭代码块的右括号。我们将在第\
    \ 5 章中详细讨论作用域。\n\n#### `for` 语句头部的表达式是可选的\n\n`for` 头部中的三个表达式都是可选的。如果你省略了 `loopContinuationCondition`，条件将始终为真，从而创建一个无限循环。如果程序在循环之前初始化了控制变量，你可以省略\
    \ `initialization` 表达式。如果程序在循环体内计算了增量，或者不需要增量，你可以省略 `increment` 表达式。\n\n`for`\
    \ 中的增量表达式的作用类似于 `for` 循环体末尾的独立语句。因此，增量表达式\n\n```\ncounter = counter + 1\ncounter\
    \ += 1\n++counter\ncounter++\n```\n\n在 `for` 语句中是等价的。许多程序员更喜欢 `counter++`，因为它更简洁。在第\
    \ 14 章中，你会发现预增可以具有性能优势。\n\n#### `for` 语句的体\n\n程序经常显示控制变量的值或在计算中使用它，但这种使用并非强制。如果程序必须在体内修改控制变量，请使用\
    \ `while` 而不是 `for`。\n\n#### `for` 语句的 UML 活动图\n\n下面是 `for` 语句的 UML 活动图：\n\n![Images](img/04fig02)\n\
    \n图清晰地表明初始化只发生一次——在第一次测试循环继续条件之前。增量每次通过体发生。\n\n### 4.4 使用 `for` 语句的示例\n\n以下示例展示了\
    \ `for` 语句中改变控制变量的技术。在每个情况下，我们只编写适当的 `for` 头部。注意递减控制变量循环的关系运算符。\n\na) 以增加 1 的方式将控制变量从\
    \ 1 变为 100。\n\n```\nfor (int i{1}; i <= 100; ++i)\n```\n\nb) 以递减 1 的方式将控制变量从 100\
    \ 变为 1。\n\n```\nfor (int i{100}; i >= 1; --i)\n```\n\nc) 以增加 7 的方式将控制变量从 7 变为\
    \ 77。\n\n```\nfor (int i{7}; i <= 77; i += 7)\n```\n\nd) 以递减 2 的方式将控制变量从 20 变为\
    \ 2。\n\n```\nfor (int i{20}; i >= 2; i -= 2)\n```\n\ne) 使控制变量在值 2, 5, 8, 11, 14,\
    \ 17, 20 之间变化。\n\n```\nfor (int i{2}; i <= 20; i += 3)\n```\n\nf) 使控制变量在值 99,\
    \ 88, 77, 66, 55, 44, 33, 22, 11, 0 之间变化。\n\n```\nfor (int i{99}; i >= 0; i -=\
    \ 11)\n```\n\n如果循环的控制变量增加或递减超过 1，不要在循环继续条件中使用相等运算符（`!=` 或 `==`）。例如，在 `for` 语句头部\n\
    \n```\nfor (int counter{1}; counter != 10; counter += 2)\n```\n\n`counter != 10`\
    \ 永远不会变为假（导致无限循环），因为 `counter` 在每次迭代后增加 2，只产生奇数（3, 5, 7, 9, 11, …）。\n\n"
