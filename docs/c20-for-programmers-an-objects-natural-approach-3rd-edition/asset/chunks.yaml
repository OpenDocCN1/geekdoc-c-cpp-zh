    ### 5.2 Program Components in C++


    You typically write C++ programs by combining


    * prepackaged functions and classes available in the C++ Standard Library,

    * functions and classes available in a vast array of open-source and proprietary
    third-party libraries, and

    * new functions and classes you and your colleagues write.


    The C++ Standard Library provides a rich collection of functions and classes for
    math, string processing, regular expressions, input/output, file processing, dates,
    times, containers (collections of data), algorithms for manipulating containers,
    memory management, concurrent programming, asynchronous programming and many other
    operations.


    Functions and classes allow you to separate a program’s tasks into self-contained
    units. You’ve used a combination of C++ Standard Library features, open-source
    library features and the `main` function in every program so far. In this chapter,
    you’ll begin defining custom functions, and starting in [Chapter 10](#ch10.xhtml_ch10),
    you’ll define custom classes.


    There are several motivations for using functions and classes to create program
    components:


    * Software reuse. For example, in earlier programs, we did not have to define
    how to create and manipulate `string`s or how to read a line of text from the
    keyboard—C++ provides these capabilities via the `<string>` header’s `string`
    class and `getline` function, respectively.

    * Avoiding code repetition.

    * Dividing programs into meaningful functions and classes makes programs easier
    to test, debug and maintain.


    To promote reusability, every function should perform a single, well-defined task,
    and the function’s name should express that task effectively. We’ll say lots more
    about software reusability in our treatment of object-oriented programming. C++20
    introduces another program component called modules, which we will discuss in
    later chapters.


    ### 5.3 Math Library Functions


    In our objects-natural case study sections, you’ve created objects of interesting
    classes then called their member functions to perform useful tasks. Functions
    like `main` that are not member functions are called global functions.


    The `<cmath>` header provides many global functions for common mathematical calculations.
    For example,


    ```

    sqrt(900.0)

    ```


    calculates the square root of `900.0` and returns the result, `30.0`. Function
    `sqrt` takes a `double` argument and returns a `double` result. There’s no need
    to create any objects before calling function `sqrt`. All functions in the `<cmath>`
    header are global functions in the `std` namespace. Each is called simply by specifying
    the function name followed by parentheses containing the arguments.


    Function arguments may be constants, variables or more complex expressions. Some
    popular math library functions are summarized in the following table, where the
    variables `x` and `y` are of type `double`.


    ![Images](Images/f0147-01.jpg)


    #### C++11 Additional Math Functions


    11 17 C++11 added dozens of new math functions to the `<cmath>` header. Some were
    entirely new, and some were additional versions of existing functions for use
    with arguments of type `float` or `long double`, rather than `double`. The two-argument
    `hypot` function, for example, calculates the hypotenuse of a right triangle.
    C++17 added a three-argument version of `hypot` to calculate the hypotenuse in
    three-dimensional space. For a complete list of all the `<cmath>` header’s functions,
    see


    ```

    https://en.cppreference.com/w/cpp/numeric/math

    ```


    or Section 26.8.1 of the C++ standard document


    ```

    https://open-std.org/JTC1/SC22/WG21/docs/papers/2020/n4861.pdf

    ```


    #### 20 C++20—New Mathematical Constants and the <numbers> Header


    Though C++ has always had common mathematical functions, the C++ standard did
    not define mathematical constants. Some C++ implementations defined `M_PI` (for
    *p*) and `M_E` (for *e*) and other mathematical constants via preprocessor macros
    ([1](#ch01.xhtml_chfn1)). When the preprocessor executes in those implementations,
    it replaces these macro names with corresponding `double` floating-point values.
    Unfortunately, these preprocessor macros were not present in every C++ implementation.
    C++20’s new `<numbers>` header ([2](#ch01.xhtml_chfn2)) standardizes the following
    mathematical constants commonly used in many scientific and engineering applications:


    ![Images](Images/f0147-02.jpg)


    [1](#ch01.xhtml_rchfn1). We discuss the preprocessor and macros in [Appendix E](#app05.xhtml_app05).


    [2](#ch01.xhtml_rchfn2). [`http://wg21.link/p0631r8`](http://wg21.link/p0631r8).


    #### 17 C++17 Mathematical Special Functions


    For the engineering and scientific communities and other mathematical fields,
    C++17 added scores of mathematical special functions to the `<cmath>` header.
    You can see the complete list and brief examples of each at:


    ```

    https://en.cppreference.com/w/cpp/numeric/special_functions

