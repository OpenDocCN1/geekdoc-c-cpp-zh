    ### 3.14 Wrap-Up


    Only three types of control statements—sequence, selection and iteration—are needed
    to develop any algorithm. We demonstrated the `if` single-selection statement,
    the `if…else` double-selection statement and the `while` iteration statement.
    We used control-statement stacking to total and compute the average of a set of
    student grades with counter- and sentinel-controlled iteration, and we used control-statement
    nesting to analyze and make decisions based on a set of exam results. We introduced
    C++’s compound assignment operators and its increment and decrement operators.
    We discussed why C++’s fundamental types are not portable, then used objects of
    the open-source class `BigNumber` to perform integer arithmetic with values outside
    the range supported by our systems. Finally, we introduced C++20’s new text formatting
    in the context of the open-source `{fmt}` library. In [Chapter 4](#ch04.xhtml_ch04),
    we continue our discussion of control statements, introducing the `for`, `do`…`while`
    and `switch` statements, and we introduce the logical operators for creating compound
    conditions.


    ## 4\. Control Statements, Part 2


    ![Images](Images/ch04.jpg)


    Objectives


    In this chapter, you’ll:


    ■ Use the `for` and `do`…`while` iteration statements.


    ■ Perform multiple selection using the `switch` selection statement.


    ■ Use C++17’s `[[fallthrough]]` attribute in `switch` statements.


    ■ Use C++17’s selection statements with initializers.


    ■ Use the `break` and `continue` statements to alter the flow of control.


    ■ Use the logical operators to form compound conditions in control statements.


    ■ Understand the representational errors associated with using floating-point
    data to hold monetary values.


    ■ Use C++20’s `[[likely]]` and `[[unlikely]]` attributes to help the compiler
    optimize selection statements by knowing which paths of execution are likely or
    unlikely to execute.


    ■ Continue our objects-natural approach with a case study that uses an open source
    ZIP compression/decompression library to create and read ZIP files.


    ■ Use more C++20 text-formatting capabilities.


