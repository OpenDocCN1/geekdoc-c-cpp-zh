    post updates for our print products at [`https://deitel.com/c-plus-plus-20-programmers`](https://deitel.com/c-plus-plus-20-programmers).
    At the time of this writing (April 2020), the C++ standard was about to be approved
    and C++ compilers had not yet fully implemented many of its features. However,
    we use the `{fmt}` library to demonstrate features that C++20 compilers will support.

