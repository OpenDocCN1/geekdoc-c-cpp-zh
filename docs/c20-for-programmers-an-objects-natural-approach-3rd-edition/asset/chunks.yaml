    ### 转换可能导致错误值


    将值转换为较低的基本类型可能会因为窄化转换导致错误。因此，只有通过将值显式赋值给较低类型的变量（在这种情况下某些编译器会发出警告）或通过使用转换运算符，才能将值转换为较低的基本类型。函数参数值转换为函数原型中的参数类型，就像它们被直接赋值给这些类型的变量一样。如果使用
    `double` 参数调用一个带有 `int` 参数的 `square` 函数，则该参数被转换为 `int`（一种较低的类型，因此是窄化转换），`square`
    可能会返回错误的值。例如，`square(4.5)` 将返回 `16` 而不是 `20.25`。某些编译器会就窄化转换发出警告。例如，Microsoft Visual
    C++ 会发出以下警告：


    ```

    ''argument'': conversion from ''double'' to ''int'', possible loss of data

    ```


    ### 使用指南支持库进行窄化转换


    如果你必须执行显式的窄化转换，C++ Core Guidelines 建议使用来自`Guidelines Support Library (GSL)` 的
    `narrow_cast` 运算符——我们将在图 5.5 和 5.6 中使用它。该库有多种实现。微软提供了一个开源版本，已经在许多平台/编译器组合上经过测试，包括我们首选的三个编译器和平台。你可以从此处下载他们的
    GSL 实现：


    ```

    https://github.com/Microsoft/GSL

    ```


    参见 6。C++ Core Guidelines。访问 2020 年 5 月 10 日访问[`http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines/Res-narrowing`](http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Res-narrowing)。


    为了方便起见，我们提供了 GSL。


    GSL 是一个头文件库，因此你只需包含 `gsl/gsl` 即可使用它。以下语句使用 `narrow_cast`（来自命名空间 `gsl`）将 double
    `7.5` 转换为 `int`：


    ```

    gsl::narrow_cast<int>(7.5)

    ```


    ## 5.7 C++ 标准库头文件


    C++ 标准库分为许多部分，每个部分都有自己的头文件。头文件包含了该部分相关函数的原型。头文件还包含了这些函数所需的类定义和常量。头文件“指示”编译器如何与库和用户编写的组件交互。


    下表列出了常用的 C++ 标准库头文件，其中许多在本书后面的部分会讨论。多次提到的“宏”一词在附录 E


    ## 5.8 案例研究：随机数生成


    我们现在转向一个流行的编程应用，即模拟和游戏。在本节和下一节中，我们将开发一个包含多个函数的游戏程序。


    ### `rand` 函数


    可以使用 C++ 标准库函数 `rand` 为计算机应用程序引入偶然元素。考虑以下语句：


    ```

    i = rand();

    ```


    `rand` 函数生成一个 0 到 `RAND_MAX` 之间的整数（这是在 `<cstdlib>` 头文件中定义的符号常量）。你只需显示该常量即可确定你系统中
    `RAND_MAX` 的值。如果 `rand` 确实产生随机整数，则每次调用 `rand` 时，0 到 `RAND_MAX` 之间的每个数字都有相同的概率被选中。


