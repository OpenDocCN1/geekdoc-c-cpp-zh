    ### 5.2 C++ 中的程序组件


    你通常通过组合以下内容来编写 C++ 程序：


    *   C++ 标准库中提供的预封装函数和类，

    *   大量开源和专有第三方库中提供的函数和类，

    *   你以及你的同事编写的新函数和类。


    C++ 标准库提供了丰富的函数和类集合，用于数学、字符串处理、正则表达式、输入/输出、文件处理、日期、时间、容器（数据集合）、操作容器的算法、内存管理、并发编程、异步编程以及许多其他操作。


    函数和类允许你将程序的任务拆分为自包含的单元。到目前为止，你在每个程序中都已已使用了 C++ 标准库特性、开源库特性以及 `main` 函数的组合。在本章中，你将开始定义自定义函数，并且从第
    10 章开始，你将定义自定义类。


    使用函数和类来创建程序组件有几个主要动机：


    *   **软件重用**。例如，在早期的程序中，我们不需要定义如何创建和操作 `string`s，或如何从键盘读取一行文本——C++ 分别通过 `<string>`
    头文件中的 `string` 类和 `getline` 函数提供了这些功能。

    *   **避免代码重复**。

    *   将程序划分为有意义的函数和类使得程序更容易测试、调试和维护。


    为了提高可用性，每个函数都应该执行单一的、定义良好的任务，并且函数名应该有效地表达该任务。我们在处理面向对象编程时会更多地讨论软件重用。C++20 引入了另一种名为模块（modules）的程序组件，我们将在后面的章节中讨论。


