    The next `grade` is always input from the user immediately before the `while`
    condition is tested. This allows the program to determine whether the value just
    input is the sentinel value before the program processes that value (i.e., adds
    it to the `total`). If the sentinel value is input, the loop terminates, and the
    program does not add `-1` to the `total`.


    After the loop terminates, the `if…else` statement at lines 30–42 executes. The
    condition at line 30 determines whether any grades were input. If none were input,
    the `if…else` statement’s `else` part executes and displays the message `"No grades
    were entered"`. After the `if…else` executes, the program terminates.


    ### 3.7.2 Converting Between Fundamental Types Explicitly and Implicitly


    If at least one grade was entered, line 32 of [Fig. 3.2](#ch03.xhtml_fig3_2)


    ```

    double average{static_cast<double>(total) / gradeCounter};

    ```


    calculates the average. Recall from [Fig. 3.1](#ch03.xhtml_fig3_1) that integer
    division yields an integer result. Even though variable `average` is declared
    as a `double`, if we had written line 32 as


    ```

    double average{total / gradeCounter};

    ```


    it would lose the fractional part of the quotient before the result of the division
    was used to initialize `average`.


    #### `static_cast` Operator


    To perform a floating-point calculation with integers in this example, you first
    create temporary floating-point values using the `static_cast` operator. Line
    32 converts a temporary copy of its operand in parentheses (`total`) to the type
    in angle brackets (`double`). The value stored in the original `int` variable
    `total` is still an integer. Using a cast operator in this manner is called `explicit
    conversion`. `static_cast` is one of several cast operators we’ll discuss.


    #### Promotions


    After the cast operation, the calculation consists of the temporary `double` copy
    of `total` divided by the integer `gradeCounter`. For arithmetic, the compiler
    knows how to evaluate only expressions in which all the operand types are identical.
    To ensure this, the compiler performs an operation called `promotion` (also called
    `implicit conversion`) on selected operands. In an expression containing values
    of data types `int` and `double`, C++ `promotes` `int` operands to `double` values.
    So in line 32, C++ promotes a temporary copy of `grade-Counter`’s value to type
    `double`, then performs the division. Finally, `average` is initialized with the
    floating-point result. Section 5.5 discusses the allowed fundamental-type promotions.


    #### Cast Operators for Any Type


    Cast operators are available for use with every fundamental type and for other
    types, as you’ll see beginning in [Chapter 9](#ch09.xhtml_ch09). Simply specify
    the type in the angle brackets (`<` and `>`) that follow the `static_cast` keyword.
    It’s a `unary operator`—that is, it has only one operand. Other unary operators
    include the unary plus (`+`) and minus (`-`) operators for expressions such as
    `-7` or `+5`. Cast operators have the second highest precedence.


    ### 3.7.3 Formatting Floating-Point Numbers


    The formatting capabilities in [Fig. 3.2](#ch03.xhtml_fig3_2) are introduced here
    briefly and explained in depth in [Chapter 15](#ch15.xhtml_ch15).


    #### `setprecision` Parameterized Stream Manipulator


    Line 37’s call to `setprecision`—`setprecision(2)`—indicates that floating-point
    values should be output with two digits of precision to the right of the decimal
    point (e.g., 92.37). `setprecision` is a `parameterized stream manipulator` because
    it requires an argument (in this case, `2`) to perform its task. Programs that
    use parameterized stream manipulators must include the header `<iomanip>`. The
    manipulator `endl` (lines 38 and 41) from `<iostream>` is a `nonparameterized
    stream manipulator` because it does not require an argument.


    #### `fixed` Nonparameterized Stream Manipulator


    The stream manipulator `fixed` (line 37) indicates that floating-point values
    should be output in `fixed-point format`. This is as opposed to `scientific notation`^[4](#ch02.xhtml_ch0fn4)),
    which displays a number between the values of 1.0 and 10.0, multiplied by a power
    of 10\. So, in scientific notation, the value 3,100.0 is displayed as `3.1e+03`
    (that is, 3.1 × 10³). This format is useful for displaying very large or very
    small values.


    [4](#ch02.xhtml_rch0fn4). Formatting using scientific notation is discussed further
    in [Chapter 15](#ch15.xhtml_ch15).


    Fixed-point formatting forces a floating-point number to display without scientific
    notation. Fixed-point formatting also forces the decimal point and trailing zeros
    to print, even if the value is a whole-number amount, such as 88.00\. Without
    the fixed-point formatting option, 88.00 prints as 88 without the trailing zeros
    and decimal point.


    The stream manipulators `setprecision` and `fixed` perform `sticky settings`.
    Once they’re specified, all floating-point values formatted in your program will
    use those settings until you change them. [Chapter 15](#ch15.xhtml_ch15) shows
    how to capture the original settings before applying them.


    ##### Rounding Floating-Point Numbers


    When the stream manipulators `fixed` and `setprecision` are used, the printed
    value is rounded to the number of positions specified by the precision. The value
    in memory remains unaltered. For a precision of `2`, the values 87.946 and 67.543
    are rounded to 87.95 and 67.54, respectively.^[5](#ch03.xhtml_ch0fn5))


    [5](#ch03.xhtml_rch0fn4). See Section 15 for more details.


    ### 3.8 Nested Control Statements


    We’ve seen that control statements can be stacked on top of another (in sequence).
    In this case study, we examine the only other structured way control statements
    can be connected—namely, by nesting one control statement within another.


    #### 3.8.1 Problem Statement


    Consider the following problem statement:


    *A college offers a course that prepares students for the state licensing exam
    for brokers. Last year, 10 of the students who completed this course took the
    exam. The college wants to know how well its students did. You’ve been asked to
    write a program to summarize the results. You’ve been given a list of these 10
    students. Next to each name is written a 1 if the student passed the exam or a
    2 if the student failed.*


    *Your program should analyze the results of the exam as follows:*


    *1. Input each test result (i.e., a 1 or a 2). Display the message “Enter result”
    on the screen each time the program requests another test result.*


    *2. Count the number of test results of each type.*


    *3. Display a summary of the test results, indicating the number of students who
    passed and the number who failed.*


    *4. If more than eight students passed the exam, print “Bonus to instructor!”*


    #### 3.8.2 Implementing the Program


    [Figure 3.3](#ch03.xhtml_fig3_3) implements the program with counter-controlled
    iteration and shows two sample executions. Lines 8–10 and 16 of `main` declare
    the variables that are used to process the examination results.


    ![Images](Images/03fig03.jpg)![Images](Images/03fig03a.jpg)


    **Fig. 3.3** Analysis of examination results using nested control statements.
    (Part 1 of 2.)

