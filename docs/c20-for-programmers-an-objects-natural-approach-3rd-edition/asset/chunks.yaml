    你已经使用过 C++ 对象了——具体来说就是 `cout` 和 `cin` 对象，它们分别封装了输出输出机制。这些对象是系统在后台使用 `<iostream>`
    头文件中的类为为你自动创建的。在本节中，你将创建并与 C++ 标准库中 `string` 类的实例对象进行交互^(2)。


    2。你将在后续章节中学习到更多的 `string` 功能。第 8 章将详细讨论 `string` 类，并对其中许多成员函数进行测试驱动。


    ### 测试驱动类 `string`


    类本身是不能执行的。一个 `Person`（人）对象可以通过告诉 `Car`（汽车）对象要做什么（开快点、开慢点、左转、右转等）来“驱动”一个 `Car`
    对象——而无需知道汽车的内部机制是如何工作的。同样地，`main` 函数可以通过调用其成员函数来“驱动”`string` 对象——而无需知道该类是如何实现的。从这个意义上说，后续程序中的
    `main` 被称为**驱动程序**。图 2.6 中的 `main` 函数测试驱动了几个 `string` 成员函数。


    ![Images](img/02fig06.jpg)![Images](img/02fig06a.jpg)


    **图 2.6** 标准库 `string` 类测试程序。（2 部分中的第 1 部分。）


    ### 实例化对象


    通常，在创建该类的对象^(3)之前，你无法调用该类的成员函数——这也被称为实例化对象。第 8–10 行创建了三个 `string` 对象：


    * `s1` 使用字符串字面量 `"happy"` 初始化，

    * `s2` 使用字符串字面量 `" birthday"` 初始化，

    * `s3` 默认初始化为空字符串 `string`（即 `""`）。


    3。你将在第 11.15 节看到，可以在不创建该类对象的情况下调用该类的 `static` 成员函数。


    当我们声明 `int` 变量时（如我们之前所做），编译器知道 `int` 是什么——它是内置于 C++ 的基本类型。然而，在第 8–10 行中，编译器并不知道
    `string` 是什么类型——它是 C++ 标准库中的一个类类型。


    如果封装得当，类可以被其他程序员复用。这是使用像 C++ 这样拥有丰富强大内置类库的面向对象编程语言的最大优势之一。例如，你可以通过包含适当头文件在任何程序中复用
    C++ 标准库的类——在这种情况下是 `<string>` 头文件（第 4 行）。`string` 的名称和 `cout` 一样属于 `std` 命名空间。


    ### C++20 `string` 成员函数 `length`


    20 第 13–15 行输出每个 `string` 及其长度。`string` 类的 `length` 成员函数（C++20 新增）返回存储在特定 `string`
    对象中的字符数。在第 13 行中，表达式


    ```

    s1.length()

    ```


    通过调用对象的 `length` 成员函数返回 `s1` 的长度。要为特定对象调用此成员函数，你需要指定对象的名称（`s1`），后跟点运算符（`.`），然后是成员函数名（`length`）和一组括号。空括号表示
    `length` 不需要任何额外信息即可完成其任务。很快你会发现，某些成员函数需要被称为“参数”的额外信息来执行其任务。


    从 `main` 的视角来看，当调用 `length` 成员函数时：


    1. 程序将执行流从调用处（`main` 中的第 13 行）转移到成员函数 `length`。由于 `length` 是通过 `s1` 对象调用的，因此 `length`
    “知道”应该操作哪个对象的数据。

    2. 接下来，成员函数 `length` 执行其任务——即将 `s1` 的长度返回到调用该函数的第 13 行。`main` 函数不知道 `length` 如何执行任务的细节，正就像汽车的驾驶员不知道引擎、变速箱、转向机制和刹车的具体实现细节一样。

    3. `cout` 对象显示成员函数 `length` 返回的字符数，然后程序继续执行，显示字符串 `s2` 和 `s3` 及其长度。


    ### 使用相等运算符比较 `string` 对象


    像数字一样，`string` 之间也可以相互比较。第 18–20 行显示了使用相等运算符比较 `s2` 和 `s1` 的结果——string` 比较是大小敏感的^(4)。


    4。在第 8 章中，你会看到字符串使用每个字符串中字符的数值进行字典序比较。


    通常情况下，当你输出条件的值时，C++ 为假显示 `0`，为真显示 `1`。流操纵符 `boolalpha`（第 18 行）告诉输出流显示 `false`
    或 `true`。


    ### `string` 成员函数 `empty`


    25 第 25 行调用 `empty` 成员函数，如果字符串为空则返回 `true`；否则返回 `false`。由于 `s3` 默认初始化为空，因此 `if`
    语句体将执行。


    ### `string` 拼接与赋值


    27 第 27 行通过“添加”`s1` 和 `s2` 给 `s3` 赋新值——这被称为拼接。赋值后，`s3` 包含了 `s1` 的字符以及 `s2` 的字符。


    ### `string` 成员函数 `starts_with` 和 `ends_with`


    32 第 32–35 行演示了新的成员函数 `starts_with` 和 `ends_with`，它们分别在字符串以指定字符串开头或结尾时返回 `true`；否则返回
    `false`。


    ### 2.8 总结


    我们在本章介绍了许多++的基本功能，包括显示数据、从键盘输入数据以及声明变量。特别是你学习了如何使用输出流对象 `cout` 和输入流对象 `cin` 构建简单的交互程序。我们声明并初始化变量，并使用算术运算符计算。我们讨论了运算符的操作顺序（即优先级规则），以及运算符的分组。你看到了
    C++ 的 `if` 语句允许程序做出决策。我们介绍了相等运算符和关系运算符，用它们来构造 `if` 语句的条件。


    最后，我们通过创建 `string` 类对象并使用相等运算符和 `string` 成员函数与之交互，引入了“对象自然”学习的概念。在后续章节中，你将创建许多现有类的对象，用少的代码完成重大任务。然后，在第
    10](#ch10.xhtml_ch10)到第 14](#ch14.xhtml_ch14)章中，你将创建自己的自定义类。你会发现 C++ 让你能够“制作价值的类”。下一章，我们将开始介绍控制语句，它们规定了程序执行的顺序。


    ## 3. 控制语句：第一部分


    ![Images](img/ch03.jpg)


    ### 目标


    在本章中，你将：


    * 使用 `if` 和 `if...else` 选择语句选择替代方案。

    * 使用 `while` 迭代语句重复执行程序中的语句。

    * 使用计数器控制迭代和哨兵值控制迭代。

    * 使用嵌套控制语句。

    * 使用复合赋值运算符和增/减运算符。

    * 学习为什么基本数据类型是不可移植的。

