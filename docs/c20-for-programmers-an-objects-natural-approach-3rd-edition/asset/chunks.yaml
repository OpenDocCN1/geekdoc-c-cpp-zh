    The application begins with a loop that calculates and displays the Fibonacci
    values for the integers 0–10 and is followed by three calls to calculate the Fibonacci
    values of the integers 20, 30 and 35 (lines 15–17). The calls to `fibonacci` in
    `main` (lines 12 and 15–17) are not recursive calls, but the calls from line 26
    of `fibonacci` are recursive. Each time the program invokes `fibonacci` (lines
    21–28), the function immediately tests the base case to determine whether `number`
    is equal to `0` or `1` (line 22). If this is true, line 23 returns `number`. Interestingly,
    if `number` is greater than 1, the recursion step (line 26) generates two recursive
    calls, each for a slightly smaller problem than the original call to `fibonacci`.


    ### Evaluating `fibonacci(3)`


    The following diagram shows how function `fibonacci` would evaluate `fibonacci(3)`.
    This figure raises some interesting issues about the order in which C++ compilers
    evaluate the operands of operators. This is a separate issue from the order in
    which operators are applied to their operands, namely the order dictated by the
    rules of operator precedence and grouping. The following diagram shows that evaluating
    `fibonacci(3)` causes two recursive calls, namely `fibonacci(2)` and `fibonacci(1)`.
    In what order are these calls made?


    ![Images](Images/05unfig02.jpg)


    ### Order of Evaluation of Operands


    Most programmers simply assume that the operands are evaluated left to right,
    which is the case in some programming languages. C++ does not specify the order
    in which the operands of many operators (including `+`) are to be evaluated. Therefore,
    you must make no assumption about the order in which these calls execute. The
    calls could, in fact, execute `fibonacci(2)` first, then `fibonacci(1)`, or `fibonacci(1)`
    first, then `fibonacci(2)`. In this program and in most others, it turns out that
    the final result would be the same. However, in some programs, the evaluation
    of an operand can have side effects (changes to data values) that could affect
    the final result of the expression.


    ### Operators for which Order Of Evaluation Is Specified


    Before C++17, C++ specified the order of evaluation of the operands of only the
    operators `&&`, `||`, comma (`,`) and `?:`. The first three are binary operators
    whose two operands are guaranteed to be evaluated left to right. The last operator
    is C++’s only ternary operator— its leftmost operand is always evaluated first;
    if it evaluates to true, the middle operand evaluates next and the last operand
    is ignored; if the leftmost operand evaluates to false, the third operand evaluates
    next and the middle operand is ignored.


    As of C++17, C++ now also specifies the order of evaluation of the operands for
    various other operators. For the operators dot (`.`), `[]` ([Chapter 6](#ch06.xhtml_ch06)),
    `->` ([Chapter 7](#ch07.xhtml_ch07)), parentheses (of a function call), `<<`,
    `>>` and `->*`, the compiler evaluates the operands left-to-right. For a function
    call’s parentheses, this means that the compiler evaluates the function name before
    the arguments. The compiler evaluates the operands of assignment operators right-to-left.


    Writing programs that depend on the order of evaluation of the operands of other
    operators can lead to logic errors. For other operators, to ensure that side effects
    are applied in the correct order, break complex expressions into separate statements.
    Recall that the `&&` and `||` operators use short-circuit evaluation. Placing
    an expression with a side effect on the right side of the `&&` or `||` operator
    is a logic error if that expression should always be evaluated.


    ### Exponential Complexity


    A word of caution is in order about recursive programs like the one we use here
    to generate Fibonacci numbers. Each level of recursion in function `fibonacci`
    has a doubling effect on the number of function calls; i.e., the number of recursive
    calls that are required to calculate the *n*th Fibonacci number is on the order
    of `2^(*n*)`. This rapidly gets out of hand. Calculating only the 20th Fibonacci
    number would require on the order of `2^(20)` or about a million calls, calculating
    the 30th Fibonacci number would require on the order of `2^(30)` or about a billion
    calls, and so on. Computer scientists refer to this as exponential complexity.
    Problems of this nature can humble even the world’s most powerful computers as
    *n* becomes large. Complexity issues in general, and exponential complexity in
    particular, are discussed in detail in the upper-level computer science course
    typically called Algorithms. Avoid Fibonacci-style recursive programs that result
    in an exponential “explosion” of calls.


    ### 5.20 Recursion vs. Iteration


    In the two prior sections, we studied two recursive functions that can also be
    implemented with simple iterative programs. This section compares the two approaches
    and discusses why you might choose one approach over the other in a particular
    situation.


    * Both iteration and recursion are based on a control statement: Iteration uses
    an iteration statement; recursion uses a selection statement.

    * Both iteration and recursion involve iteration: Iteration explicitly uses an
    iteration statement; recursion achieves iteration through repeated function calls.

    * Iteration and recursion each involve a termination test: Iteration terminates
    when the loop-continuation condition fails; recursion terminates when a base case
    is recognized.

    * Counter-controlled iteration and recursion each gradually approach termination:
    Iteration modifies a counter until the counter assumes a value that makes the
    loop-continuation condition fail; recursion produces simpler versions of the original
    problem.

    * Both iteration and recursion can occur infinitely: An infinite loop occurs with
    iteration if the loop-continuation test never becomes false; infinite recursion
    occurs if the recursion step does not reduce the problem during each call in a
    manner that converges on the base case.


    #### Iterative Factorial Implementation


    To illustrate the differences between iteration and recursion, let’s examine an
    iterative solution to the factorial problem ([Fig. 5.18](#ch05.xhtml_fig5_18)).
    Lines 22–24 use an iteration statement rather than the selection statement of
    the recursive solution (lines 19–24 of [Fig. 5.16](#ch05.xhtml_fig5_16)). Both
    solutions use a termination test. In the recursive solution, line 19 ([Fig. 5.16](#ch05.xhtml_fig5_16))
    tests for the base case. In the iterative solution, line 22 ([Fig. 5.18](#ch05.18))
    tests the loop-continuation condition— if the test fails, the loop terminates.
    Finally, instead of producing simpler versions of the original problem, the iterative
    solution uses a counter that’s modified until the loop-continuation condition
    becomes false.


    ![Images](Images/05fig18.jpg)


    **Fig. 5.18** Iterative function `factorial`.


    #### Negatives of Recursion


    Recursion has negatives. It repeatedly invokes the mechanism, and consequently
    the overhead, of function calls. This can be expensive in both processor time
    and memory space. Each recursive call causes another copy of the function variables
    to be created; this can consume considerable memory. Iteration normally occurs
    within a function, so the overhead of repeated function calls and extra memory
    assignment is omitted. So why choose recursion?


    #### When to Choose Recursion vs. Iteration

