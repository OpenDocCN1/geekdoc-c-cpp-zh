    ### 1.1 引言


    欢迎学习 C++——世界上使用最广泛、高性能的计算机编程语言之一——及其当前版本 `C++20`。


    如果你正在阅读这些内容，说明你正在 O’Reilly Online Learning 平台（原名为 Safari）查看我们即将出版的书籍 *C++20 for
    Programmers* 的早期访问预览初稿，该书计划于今年夏天出版。**我们仔细准备了这些内容，但它们尚未经过同行评审或校对，可能会发生更改。** 当我们完成本章后，将在这里发布经过评审和校对的版本。


    请将任何更正、意见、问题和改进建议通过邮件发送至 `paul@deitel.com`，我会及时回复。请在此处以及书籍的网页上检查更新：


    ```

    https://deitel.com/c-plus-plus-20-for-programmers

    ```


    本书为使用以下一个或多个流行的桌面平台的开发者编写——Microsoft Windows 10、macOS 和 Linux。我们在三个流行的免费编译器上测试了每个程序：


    • Windows 10 上使用 Microsoft Visual Studio 社区版的 `Visual C++`，

    • macOS 上使用 `Xcode` 中的 `Clang`，

    • Linux 以及 `GNU Compiler Collection` (`GCC`) Docker 容器中的 `GNU C++`。


    在 Deitel，我们使用当前的、多核 Apple Mac 计算机，这使我们能够原生运行 macOS，并通过 `VMWare Fusion` 虚拟机运行 Windows
    10 和 Linux。Docker 在 Windows、macOS 和 Linux 系统上原生运行。


    此 第 1 章 的早期访问版本包含了测试驱动，演示了如何使用这些编译器和平台编译并运行 C++20 应用程序。本章的出版版本将包含额外的介绍材料。


    在编写时，某些 `C++20` 特性在三个编译器中已完全实现，某些在三个编译器的子集中已实现，某些则完全未实现。我们会根据情况指出这些问题，并在编译器厂商实现其余
    `C++20` 特性时更新我们的在线内容。`C++20` 对更多编译器的支持情况请查看此处：


    ```

    https://en.cppreference.com/w/cpp/compiler_support

    ```


    #### 为 O’Reilly Online Learning 订阅者提供的“抢先”视频


    作为 O’Reilly Online Learning 的订阅者，你还可以访问我们新的 *C++20 Fundamentals LiveLessons* 视频的“抢预览”，地址如下：


    ```

    https://learning.oreilly.com/videos/c-20-fundamentals-parts/9780136875185

    ```


    合作者 Paul Deitel 在我们完成相应章节时立即录制每个视频课程。课程会在几天后在 O’Reilly Online Learning 上线。再次提醒，请频繁检查此处的更新。


    ### 1.2 测试 C++20 应用程序


    在本节中，你将编译、运行并交互你的第一个 C++ 应用程序——一个猜数字游戏，它会从 1 到 1000 之间选取一个随机数并提示你猜。如果你猜对了，游戏将结束。如果你猜错了，应用程序将指示你的猜测比正确数字大还是小。猜数字次数没有限制。


    通常情况下，该应用程序在你执行程序时随机选择正确答案。我们禁用了应用程序的这一特性，以便程序每次执行时都使用相同的正确答案（尽管这可能随编译器而异）。因此，你可以使用与我们相同的猜测并看到相同的的结果。


    #### 测试驱动总结


    我们将演示使用以下工具运行 C++ 应用程序：


    • 用于 Windows 的 Microsoft Visual Studio 2019 社区版（第 1.2.1 节）

    • macOS 上 `Xcode` 中的 `Clang`（第 1.2.2 节）。

    • Linux Shell 中的 `GNU C++`（第 1.2.3 节）。

    • 运行在 `GNU Compiler Collection` (`GCC`) Docker 容器内部 Shell 中的 `GNU C++`。这需要安装并运行
    Docker。


    你只需要阅读与你平台对应的章节。在编写时，`GNU C++` 在我们使用的三个编译器中支持最多的 `C++20` 特性。


    #### 1.2.1 在 Windows 10 上使用 Visual Studio 2019 社区版编译并运行 C++20 应用程序


    在本节中，你将使用 Microsoft Visual Studio 2019 社区版在 Windows 上运行 C++ 程序。Visual Studio 有多个版本可用——在某些版本中，我们呈现的选项、菜单和指令可能会略有不同。从现在起，我们将简单地称为“Visual
    Studio”或“IDE”。


    ##### 第 1 步：检查你的环境设置


    如果你尚未执行，请阅读本书的“在开始之前”（Before You Begin）部分，获取安装 IDE 和下载书籍代码示例的说明。


