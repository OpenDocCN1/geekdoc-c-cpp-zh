    \ meanings in some contexts or are identifiers that may become keywords in the\
    \ future:\n\n• Non-keyword identifiers with special meaning—`final`, `import`,\
    \ `module`, `override`, `transaction_safe` and `transaction_safe_dynamic`.\n\n\
    • Experimental keywords—`atomic_cancel`, `atomic_commit`, `atomic_noexcept`, `reflexpr`\
    \ and `synchronized`.\n\n#### 3.2.4 Summary of Control Statements\n\nC++ has only\
    \ three kinds of control structures, which from this point forward, we refer to\
    \ as control statements—the sequence statement, selection statements (three types)\
    \ and iteration statements (four types). Every program is formed by combining\
    \ these statements as appropriate for the algorithm the program implements. We\
    \ can model each control statement as an activity diagram. Each diagram contains\
    \ an initial state and a final state that represent a control statement’s entry\
    \ point and exit point, respectively. **Single-entry/single-exit control statements**\
    \ make it easy to build programs—we simply connect the exit point of one to the\
    \ entry point of the next using **control-statement stacking**. There’s only one\
    \ other way in which you may connect control statements—**control-statement nesting**\
    \ in which one control statement appears inside another. Thus, algorithms in C++\
    \ programs are constructed from only three kinds of control statements, combined\
    \ in only two ways. This is the essence of simplicity.\n\n### 3.3 `if` Single-Selection\
    \ Statement\n\nWe introduced the `if` single-selection statement briefly in Section\
    \ 2.6\\. Programs use selection statements to choose among alternative courses\
    \ of action. For example, suppose that the passing grade on an exam is 60\\. The\
    \ C++ statement\n\n```\nif (studentGrade >= 60) {\n\n   cout << \"Passed\";\n\n\
    }\n```\n\ndetermines whether the condition `studentGrade >= 60` is true. If so,\
