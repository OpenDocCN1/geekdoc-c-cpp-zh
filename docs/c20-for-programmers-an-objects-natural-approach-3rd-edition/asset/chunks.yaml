    \ the condition is true and another action when the condition is false. For example,\
    \ the C++ statement\n\n```\nif (grade >= 60) {\n\n   cout << \"Passed\";\n\n}\n\
    \nelse {\n\n   cout << \"Failed\";\n\n}\n```\n\nprints `“Passed”` if `grade >=\
    \ 60`, but prints `“Failed”` if it’s less than 60\\. In either case, after printing\
    \ occurs, the next statement in sequence is performed.\n\nThe body of the `else`\
