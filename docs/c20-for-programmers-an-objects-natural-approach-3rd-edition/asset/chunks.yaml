    ### 3.2 Control Structures


    During the 1960s, it became clear that the indiscriminate use of transfers of
    control was the root of many problems experienced by software development groups.
    The blame was pointed at the **`goto`** **statement** (used in most programming
    languages of the time), which allows you to specify a transfer of control to one
    of a wide range of destinations in a program.


    The research of Bohm and Jacopini^([2](#ch01.xhtml_ch0fn2)) had demonstrated that
    programs could be written without any `goto` statements. The challenge for programmers
    of the era was to shift their styles to “`goto`-less programming.” The term **structured
    programming** became almost synonymous with “`goto` elimination.” The results
    were impressive. Software development groups reported shorter development times,
    more frequent on-time delivery of systems and more frequent within-budget completion
    of software projects. The key to these successes was that structured programs
    were clearer, easier to debug and modify, and more likely to be bug-free in the
    first place.


    [2](#ch01.xhtml_rch0fn2). C. Bohm and G. Jacopini, “Flow Diagrams, Turing Machines,
    and Languages with Only Two Formation Rules,” *Communications of the ACM*, Vol.
    9, No. 5, May 1966, pp. 336–371.


    Bohm and Jacopini’s work demonstrated that all programs could be written in terms
    of only three control structures—the **sequence structure**, the **selection structure**
    and the **iteration structure**. We’ll discuss how C++ implements each of these.


    #### 3.2.1 Sequence Structure


    The sequence structure is built into C++. Unless directed otherwise, the computer
    executes C++ statements one after the other in the order in which they appear
    in the program—that is, in sequence. The following UML^([3](#ch01.xhtml_ch0fn3))
    **activity diagram** illustrates a typical sequence structure in which two calculations
    are performed in order:


    ![Images](Images/03unfig01.jpg)


    [3](#ch01.xhtml_rch0fn3). We use the UML in this chapter and [Chapter 4](#ch04.xhtml_ch04)
    to show the flow of control in control statements, then use UML again in [Chapters
    10](#ch10.xhtml_ch10)–[13](#ch13.xhtml_ch13) when we present custom class development.


    C++ lets you have as many actions as you want in a sequence structure. As you’ll
    soon see, anywhere you may place a single action, you may place several actions
    in sequence.


    An activity diagram models the **workflow** (also called the **activity**) of
    a portion of a software system. Such workflows may include a portion of an algorithm,
    like the sequence structure in the preceding diagram. Activity diagrams are composed
    of symbols, such as **action-state symbols** (rectangles with their left and right
    sides replaced with outward arcs), **diamonds** and **small circles**. These symbols
    are connected by **transition** **arrows**, which represent the flow of the activity—that
    is, the order in which the actions should occur.


    The preceding sequence-structure activity diagram contains two **action states**,
    each containing an **action expression**—for example, “add grade to total” or
    “add 1 to counter”—that specifies a particular action to perform. The arrows in
    the activity diagram represent **transitions**, which indicate the order in which
    the actions represented by the action states occur.'
