    ### 3. 加法和减法运算最后求值。如果表达式包含多个加法和减法运算，它们从左到右应用。加法和减法具有相同的优先级。


    附录 A 包含了完整的运算符优先级表。**注意：** 如果你有一个类似于 `(a + b) * (c - d)` 的表达式，其中两组括号没有嵌套，而是显示在“同一级别”，C++
    标准没有规定这些带括号子表达式的求值顺序。


    #### 运算符分组


    当我们说 C++ 从左到右应用某些运算符时，我们指的是运算符的**分组**。例如，在表达式中：


    ```

    a + b + c

    ```


    加法运算符（`+`）从左到右分组，就像我们对表达式加了括号 `(a+b)+ c` 一样。大多数具有相同优先级的 C++ 运算符都从左到右分组。我们将看到某些运算符是从右到左分组的。


    #### 2.6 决策：等价运算符和关系运算符


    我们现在介绍 C++ 的 `if` 语句，它允许程序根据**条件**为真或假采取替代操作。`if` 语句中的条件可以使用下表中的**关系运算符**和**等价运算符**形成：


    ![Images](img/p0118-01.jpg)


    所有关系运算符的优先级相同，并从左到右分组。两个等价运算符的优先级相同，但低于关系运算符的优先级，并且从左到右分组。


    反转运算符 `!=`、`>=` 和 `<=` 中符号对的顺序（分别写为 `=!`、`=>` 和 `=<`）通常会导致一个语法错误。在某些情况下，将 `!=`
    写为 `=!` 将不是语法错误，但几乎肯定会在执行运行时产生影响的逻辑错误。当我们在第 4 章介绍逻辑运算符时你就会理解为什么。


    ##### 混淆 `==` 和 `=`


    将等价运算符 `==` 与赋值运算符 `=` 混淆会导致逻辑错误。我们喜欢将等价运算符读作“等于”或“双等号”，将赋值运算符读作“获取”或“获取值”或“被赋值值”。正如你在第
    4.12 节中看到的，混淆这些运算符并不一定会导致容易识别的语法错误，但可能会引起细微的逻辑错误。


    ##### 使用 `if` 语句


    图 2.5 使用六个 `if` 语句来比较用户输入的两个整数。如果给定 `if` 语句的条件为真，则执行该 `if` 语句体内的输出语句。如果条件为假，则执行体内的输出语句。


    ![Images](img/02fig05.jpg)![Images](img/02fig05a.jpg)


    **图 2.5** 使用 `if` 语句、关系运算符和等价运算符比较整数。（2 部分中的第 1 部分。）


    ##### `using` 声明


    第 6–8 行


    ```

    using std;

    ```


