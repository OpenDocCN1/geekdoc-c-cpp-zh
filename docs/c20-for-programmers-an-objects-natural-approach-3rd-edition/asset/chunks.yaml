  trans: "\nVisual Studio 中的 Visual C++ 编译器支持多个版本的 C++ 标准。对于本书，我们使用 C++20，我们必须在项目设置中对其进行配置：\n\
    \n**1.** 在解决方案管理器中，右键点击项目节点—![Images](img/common03.jpg)—并选择“属性”(Properties)，显示项目的\
    \ `cpp20_test` 属性页对话框：\n\n![Images](img/01unfig05.jpg)\n\n**2.** 在左侧列中，展开 `C/C++`\
    \ 节点，然后选择“语言”(Language)。\n\n**3.** 在右侧列中，点击 C++ 标准右侧的字段，点击向下箭头，然后选择“Preview -\
    \ Features from the Latest C++ Working Draft (`/std:c++latest`)”，并点击确定。在 Visual\
    \ Studio 的未来版本中，微软将此选项更改为“ISO C++20 Standard (`/std:c++20`)”。\n\n### 第 6 步：编译并运行项目\n\
    编译并运行项目以测试应用程序，选择“调试(Debug) > 无调试启动(Start without debugging)”或输入 `Ctrl` + `F5`。如果程序编译正确，Visual\
    \ Studio 将打开一个命令提示符窗口并执行程序。为了可读性，我们更改了命令提示符的配色和字体大小：\n\n![Images](img/01unfig06.jpg)\n\
    \n### 第 7 步：输入你的第一个猜测\n在 `?` 提示处，输入 `500` 并按 `Enter`。应用程序显示“太大了。请重试。(Too high.\
    \ Try again.)”，表示你输入的数值大于应用程序选择的正确数字：\n\n![Images](img/01unfig07.jpg)\n\n### 第\
    \ 8 步：输入另一个猜测\n在下一个提示处，输入 `250` 并按 `Enter`。应用程序再次显示“太大了。请重试。”，因为你输入的值再次大于正确猜测：\n\
    \n![Images](img/01unfig08.jpg)\n\n### 第 9 步：输入额外的猜测\n继续输入数值玩游戏，直到你猜中正确数字。当你猜对时，应用程序显示“太棒了！你猜中了数字！(Excellent!\
    \ You guessed the number!)”：\n\n![Images](img/01unfig09.jpg)\n\n### 第 10 步：再次玩游戏或退出应用程序\n\
    猜中正确数字后，应用程序会询问你是否想玩另一个游戏。在“Would you like to play again (y or n)?”提示处，输入 `y`\
    \ 会导致应用程序选择新数字并开始新游戏。输入 `n` 则终止应用程序。每当你从头开始执行此应用程序（第 6 步）时，它将为你选择相同的数字供你猜测。\n\n\
    ### 重用此项目用于后续示例\n你可以遵循本节中的步骤为书中的每个应用程序创建一个单独的项目。但是，对于我们的示例，你可能会发现从项目中删除当前程序然后添加新程序更方便。要从项目中删除文件（但不从系统中删除），请在解决方案管理器中选择它，然后按\
    \ `Del`（或 `Delete`）。然后你可以重复第 4 步将不同的程序添加到项目。。\n\n## 1.2.2 在 macOS 上使用 Xcode 编译和运行\
    \ C++20 \n在本节中，你将使用 Apple Xcode IDE 中的 Clang 编译器在 macOS 上运行 C++ 程序。\n\n### 第 1\
    \ 步：检查你的设置\n如果你还没有这样做，请阅读本书的“开始之前”(Before You Begin)部分，获取安装 IDE 和下载书籍代码示例的说明。\n\
    \n### 第 2 步：启动 Xcode\n打开 Finder 窗口，选择“应用程序”(Applications)并双击 Xcode 图标(![Images](img/common04.jpg))。这是你第一次运行\
    \ Xcode，将出现“Welcome to Xcode”窗口：\n\n![Images](img/01unfig10.jpg)\n\n点击左上角的 X 关闭此窗口——你可以通过选择“窗口(Window)\
    \ > Welcome to Xcode”随时访问它。我们使用 `>` 字符表示从菜单中选择菜单项。例如，`File > Open…` 符号表示你应该从 `File`\
    \ 菜单中选择 `Open…` 菜单项。\n\n### 第 3 步：创建项目\n**项目**(project) 是一组相关文件，例如组成应用程序的 C++\
    \ 源代码文件。我们为本书示例创建的 Xcode 项目是“命令行工具”(Command Line Tool) 项目，你将直接在 IDE 中执行它们。要创建一个项目：\n\
    \n**1.** 选择 `File > New > Project…`。\n\n**2.** 在“为新项目选择模板”(Choose a template for\
    \ your new project)对话框的顶部，点击 `macOS`。\n\n**3.** 在“应用程序”(Application)下，点击 `Command\
    \ Line Tool` 并点击“Next”。\n\n**4.** 对于“产品名称”(Product Name)，为你的项目输入一个名称——我们指定为 `cpp20_test`。\n\
    \n**5.** 在语言(Language)下拉列表中，选择 `C++` 然后点击“Next”。\n\n**6.** 指定你想保存项目的位置。我们选择了包含本书代码示例的\
    \ `examples` 文件夹。\n\n**7.** 点击“Create”。\n\nXcode 创建你的项目并最初显示**工作区窗口**(workspace\
    \ window)，显示了三个区域——导航器区域**(Navigator **area**)、编辑器区域**(Editor **area**) 和工具区区域**(Utilities\
    \ **area**：\n\n![Images](img/01unfig11.jpg)\n\n左侧导航器区域顶部有可以显示在该处的导航器(navigators)\
    \ 图标。对于本书，你将主要使用：\n\n• 项目(Project)(![Images](img/common05.jpg))——显示项目中的所有文件和文件夹。\n\
    \n• 问题(Issue)(![Images](img/common06.jpg))——向你显示警告和错误。\n\n（注：此处原文存在大量重复内容，已根据要求清理并保留核心功能说明）\n\
    \n### 第 4 步：配置项目使用 C++20\nXcode 中的 Clang 编译器支持多个版本的 C++ 标准。对于本书，我们使用 C++20，我们必须在项目设置中对其进行配置：\n\
    \n**1.** 在项目导航器中，选择你的项目名称 (`cpp20_test`)。\n\n**2.** 在编辑器区域的左侧，选择 `TARGET`。\n\n\
    **3.** 在编辑器区域顶部，点击“构建设置”(Build Settings)，并在下方点击“全部”(All)。\n\n**4.** 滚动到“Apple\
    \ Clang - 语言”(Apple Clang - Language)部分。\n\n**5.** 点击 C++ 语言右侧的值并选择“Other....”。\n\
    \n**6.** 在弹出区域，将当前设置替换为 `c++2a` 并按 `Enter`。在未来的 Xcode 版本中，Apple 将为 C++ 语言提供 C++20\
    \ 。\n\n### 第 5 步：从项目中删除 main.cpp 文件\n默认情况下，Xcode 会创建一个 `main.cpp` 源代码文件，包含一个显示“Hello,\
    \ World!”的简单程序。在本次测试中不会使用 `main.cpp`，所以你应该删除该文件。在项目导航器中，右键点击 `main.cpp` 文件并选择“删除”(Delete)。在弹出的对话框中，选择“移到垃圾篓”(Move\
    \ to Trash)。在清空垃圾篓之前，文件不会从系统中删除。\n\n### 第 6 步：将 GuessNumber.cpp 文件添加到项目\n在 Finder\
    \ 窗口中，打开书籍 `examples` 文件夹下的 `ch01` 文件夹，将 `GuessNumber.cpp` 拖到项目导航器中的 `Guess Number`\
    \ 文件夹上。在弹出的对话框中，确保勾选“需要时复制”(Copy items if needed)，然后点击“完成”(Finish)。\n\n"
- fmt: "\nTo compile and run the project so you can test-drive the application, simply\
    \ click the run (![Images](Images/common07.jpg)) button on Xcode’s toolbar. If\
    \ the program compiles correctly, Xcode opens the Debug area and executes the\
    \ program in the right half of the Debug area:\n\n![Images](Images/01unfig15.jpg)\n\
    \nThe application displays `\"Please type your first guess.\"`, then displays\
    \ a question mark (`?`) as a prompt on the next line.\n\n### Step 8: Entering\
    \ Your First Guess\n\nClick in the Debug area, then type `500` and press `Return`\
    \ \n\n![Images](Images/01unfig16.jpg)\n\nThe application displays `\"Too low.\
    \ Try again.\"`, meaning that the value you entered is less than the number the\
    \ application chose as the correct guess.\n\n### Step 9: Entering Another Guess\n\
    \nAt the next prompt, enter `750`:\n\n![Images](Images/01unfig17.jpg)\n\nThe application\
    \ displays `\"Too low. Try again.\"`, because the value you entered once again\
    \ is less than the correct guess.\n\n### Step 10: Entering Additional Guesses\n\
    \nContinue to play the game by entering values until you guess the correct number.\
    \ When you guess correctly, the application displays `\"Excellent! You guessed\
    \ the number.\"`:\n\n![Images](Images/01unfig18.jpg)\n\n### Playing the Game Again\
    \ or Exiting the Application\n\nAfter you guess the correct number, the application\
    \ asks if you’d like to play another game. At the `\"Would you like to play again\
    \ (y or n)?\"` prompt, entering `y` causes the application to choose a new number\
    \ and start a new game. Entering `n` terminates the application. Each time you\
    \ execute this application from the beginning (`Step 7`), it will choose the same\
    \ numbers for you to guess.\n\n### Reusing This Project for Subsequent Examples\n\
    \nYou can follow the steps in this section to create a separate project for every\
    \ application in the book. However, for our examples, you may find it more convenient\
    \ to remove the current program from the project then add a new one. To remove\
    \ a file from your project (but not your system), right-click the file in the\
    \ Project navigator and select `Delete`. In the dialog that appears, select `Move\
    \ to Trash`. You can then repeat `Step 6` to add a different program to the project.\n\
    \n### 1.2.3 Compiling and Running a C++20 Application with GNU C++ on Linux\n\n\
    For this test drive, we assume that you read the Before You Begin section and\
    \ that you placed the downloaded examples in your user account’s `Documents` folder.\n\
    \n### Step 1: Changing to the `ch01` Folder\n\nFrom a Linux shell, use the `cd`\
    \ command to change to the `ch01` subfolder of the book’s `examples` folder:\n\
    \n```\n~$ cd ~/Documents/examples/ch01\n\n~/Documents/examples/ch01$\n```\n\n\
    In this section’s figures, we use `bold` to highlight the text that you type.\
    \ The prompt in our Ubuntu Linux shell uses a tilde (`~`) to represent the home\
    \ directory. Each prompt ends with the dollar sign (`$`). The prompt may differ\
    \ on your Linux system.\n\n### Step 2: Compiling the Application\n\nBefore running\
    \ the application, you must first compile it:\n\n```\n~/Documents/examples/ch01$\
    \ g++ -std=c++2a GuessNumber.cpp -o GuessNumber\n\n~/Documents/examples/ch01$\n\
    ```\n\nThe `g++` command compiles the application:\n\n• The `-std=c++2a` option\
    \ indicates that we’re using C++20—`c++2a` will become `c++20` in a future GNU\
    \ C++ release.\n\n• The `-o` option names the executable file (`GuessNumber`)\
    \ that you’ll use to run the program.\n\n### Step 3: Running the Application\n\
    \nType `./GuessNumber` at the prompt and press `Enter` to run the program:\n\n\
    ```\n~/Documents/examples/ch01$ ./GuessNumber\n\nI have a number between 1 and\
    \ 1000.\n\nCan you guess my number?\n\nPlease type your first guess.\n\n?\n```\n\
    \nThe `./` tells Linux to run a file from the current directory and is required\
    \ to indicate that `GuessNumber` is an executable file.\n\n### Step 4: Entering\
    \ Your First Guess\n\nThe application displays `\"Please type your first guess.\"\
    `, then displays a question mark (`?`) as a prompt on the next line. At the prompt,\
    \ enter `500`—note that the outputs may vary based on the compiler you’re using:\n\
    \n```\n~/Documents/examples/ch01$ ./GuessNumber\n\nI have a number between 1 and\
    \ 1000.\n\nCan you guess my number?\n\nPlease type your first guess.\n\n? 500\n\
    \nToo high. Try again.\n\n?\n```\n\nThe application displays `\"Too high. Try\
    \ again.\"`, meaning that the value you entered is greater than the number the\
    \ application chose as the correct guess.\n\n### Step 5: Entering Another Guess\n\
    \nAt the next prompt, enter `250`:\n\n```\n~/Documents/examples/ch01$ ./GuessNumber\n\
    \nI have a number between 1 and 1000.\n\nCan you guess my number?\n\nPlease type\
    \ your first guess.\n\n? 500\n\nToo high. Try again.\n\n? 250\n\nToo low. Try\
    \ again.\n\n?\n```\n\nThis time the application displays `\"Too low. Try again.\"\
    `, because the value you entered is less than the correct guess.\n\n### Step 6:\
    \ Entering Additional Guesses\n\nContinue to play the game by entering values\
    \ until you guess the correct number. When you guess correctly, the application\
    \ displays `\"Excellent! You guessed the number.\"`:\n\n```\n~/Documents/examples/ch01$\
    \ ./GuessNumber\n\nI have a number between 1 and 1000.\n\nCan you guess my number?\n\
    \nPlease type your first guess.\n\n? 500\n\nToo high. Try again.\n\n? 250\n\n\
    Too low. Try again.\n\n?\n```\n\n### Step 7: Playing the Game Again or Exiting\
    \ the Application\n\nAfter you guess the correct number, the application asks\
    \ if you’d like to play another game. At the `\"Would you like to play again (y\
    \ or n)?\"` prompt, entering `y` causes the application to choose a new number\
    \ and start a new game. Entering `n` terminates the application. Each time you\
    \ execute this application from the beginning (`Step 7`), it will choose the same\
    \ numbers for you to guess.\n\n### 1.2.4 Compiling and Running a C++20 Application\
    \ with GNU C++ Natively Over Windows, macOS and Linux\n\nAt the time of writing,\
    \ GNU C++ implements the most C++20. For this reason, you may want to use the\
    \ latest GNU C++. One of the most convenient cross-platform ways to do this is\
    \ by using the GNU Compiler Collection (GCC) Docker. This section assumes you’ve\
    \ already installed Docker Desktop (Windows or macOS) or Docker Engine (Linux).\n\
    \n### Executing the GNU Compiler Collection (GCC) Docker Container\n\nOpen a Command\
    \ Prompt (Windows), Terminal (macOS/Linux) or shell (Linux), then perform the\
    \ following steps to launch the GCC Container:\n\n**1.** Use the `cd` command\
    \ to navigate to the `examples` folder containing this book’s examples.\n\n**2.**\
    \ Windows users: Launch the gcc container with the command\n\n```\ndocker run\
    \ --rm -it -v \"%CD%\":/usr/src gcc:latest\n```\n\n**3.** macOS/Linux users: Launch\
    \ the gcc container with the command\n\n```\ndocker run --rm -it -v \"$(pwd)\"\
    :/usr/src gcc:latest\n```\n\nIn the preceding commands:\n\n• `--rm` cleans up\
    \ the container’s resources when you eventually shut it down.\n\n `-it` runs the\
    \ container in interactive mode, so you can enter commands to change folders and\
    \ to compile and run programs using the GNU C++ compiler.\n\n• `-v \"%CD%\":/usr/src`\
    \ (Windows) or `-v \"$(pwd)\":/usr/src` (macOS/Linux) allows the Docker container\
    \ to access your local system files in the folder from which you executed the\
    \ `docker run` command. In the Docker container, you’ll navigate with the `cd`\
    \ command to subfolders of `/usr/src` to compile and run the C++ code.\n\n• `gcc:latest`\
    \ is the container name. The `:latest` specifies that you want to use the most\
    \ up-to-date version of the `gcc` container. Each time you execute the preceding\
    \ `docker run` commands, Docker checks whether you have the latest `gcc` container\
    \ version. If not, Docker downloads it before executing the container.\n\nOnce\
    \ the container is running, you’ll see a prompt like:\n\n```\nroot@67773f59d9ea:/#\n\
    ```\n"
