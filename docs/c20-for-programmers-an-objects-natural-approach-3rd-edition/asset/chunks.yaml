    \ can also be solved iteratively (nonrecursively). A recursive approach is normally\
    \ chosen when the recursive approach more naturally mirrors the problem and results\
    \ in a program that’s easier to understand and debug. Another reason to choose\
    \ a recursive solution is that an iterative solution may not be apparent when\
    \ a recursive solution is. If possible, avoid using recursion in performance situations.\
    \ Recursive calls take time and consume additional memory.\n\n### 5.21 C++17 and\
    \ C++20: `[[nodiscard]]` Attribute\n\nSome functions return values that you should\
    \ not ignore. For example, Section 2.7 introduced the `string` member function\
    \ `empty`. When you want to know whether a `string` is empty you must not only\
    \ call `empty()`, but also check its return value in a condition, such as:\n\n\
    ```cpp\nif (s.empty()) {\n   // do something because the string s is empty\n}\n\
    ```\n\nAs of C++17, `string`’s `empty` function is declared with the `[[nodiscard]]`\
    \ attribute^([20](#ch05.xhtml_ch0fn20)) to tell the compiler to issue a warning\
    \ when the return value is not used by the caller. Since C++17, many C++ Standard\
    \ Library functions have been enhanced with `[[nodiscard]]` so the compiler can\
    \ help you write correct code.\n\n[20](#ch05.xhtml_rch0fn20). Section 9.12.8 of\
    \ the ISO/IEC C++20 standard document. [`https://wg21.link/n4849`](https://wg21.link/n4849).\n\
    \nYou may also use this attribute on your own function definitions. [Figure 5.19](#ch05.xhtml_fig5_19)\
    \ shows a `cube` function declared with `[[nodiscard]]`, which you place before\
    \ the return type— typically on a line by itself (line 4).\n\n![Images](Images/05fig19.jpg)\n\
    \n**Fig. 5.19** C++17 `[[nodiscard]]` attribute.\n\nLine 10 calls `cube()`, but\
    \ does not use the returned value. When you compile this program our preferred\
    \ compilers, they issue the following warnings:\n\n• Microsoft Visual C++: `\"\
    discarding return value of function with 'nodis-card' attribute\"`\n• Clang in\
    \ Xcode: `\"Ignoring return value of function declared with 'nodis-card' attribute`\n\
    • GNU C++: `\"ignoring return value of 'int cube(int)', declared with attribute\
    \ nodiscard\"`\n\nHowever, these are just warnings, so the program still compiles\
    \ and runs.\n\n### 5.20 C++20’s `[[nodiscard(\"with reason\")]]` Attribute\n\n\
    One problem with C++17’s `[[nodiscard]]` attribute is that it did not provide\
    \ any insight into why you should not ignore a given function’s return value.\
    \ So, in C++20, you can now include a message^([21](#ch05.xhtml_ch0fn21)) that\
    \ will be displayed as part of the compiler warning, as in:\n\n```cpp\n[[nodiscard(\"\
    Insight into why return value should not be ignored\")]]\n```\n\n[21](#ch05.xhtml_rch0fn21).\
