    ## 5.6.2 Argument Coercion


    An important feature of function prototypes is `argument coercion`—i.e. forcing
    arguments to the appropriate types specified by the parameter declarations. For
    example, a program can call a function with an integer argument, even though the
    function prototype specifies a `double` parameter—the function will still work
    correctly, provided this is not a narrowing conversion (discussed in Section 3.8.3).
    A compilation error occurs if the arguments in a function call cannot be implicitly
    converted to the expected types specified in the function’s prototype.


    ## 5.6.3 Argument-Promotion Rules and Implicit Conversions


