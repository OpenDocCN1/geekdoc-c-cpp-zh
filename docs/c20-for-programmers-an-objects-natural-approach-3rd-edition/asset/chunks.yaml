    \ die2}; // compute sum of die values\n\n65\n\n66  // display results of this\
    \ roll\n\n67       cout << \"Player rolled \" << die1 << \" + \" << die2\n\n68\
    \          << \" = \" << sum << endl;\n\n69       return sum;\n\n70    }\n```\n\
    \n##### Additional Notes Regarding Scoped `enum`s\n\nQualifying an `enum class`’s\
    \ constant with its type name and `::` explicitly identifies the constant as being\
    \ in the scope of the specified `enum class`. If another `enum class` contains\
    \ the same identifier, it’s always clear which constant is being used because\
    \ the type name and `::` are required. In general, you should use unique values\
    \ for an `enum`’s constants to help prevent hard-to-find logic errors.\n\nAnother\
    \ popular scoped enumeration is\n\n```\nenum class Months {jan = 1, feb, mar,\
    \ apr, may, jun, jul, aug,\n\n   sep, oct, nov, dec};\n```\n\nwhich creates user-defined\
    \ `enum class` type `Months` with enumeration constants representing the months\
    \ of the year. The first value in the preceding enumeration is explicitly set\
    \ to `1`, so the remaining values increment from `1`, resulting in the values\
    \ `1` through `12`. Any enumeration constant can be assigned an integer value\
    \ in the enumeration definition. Subsequent enumeration constants each have a\
    \ value 1 higher than the preceding constant until the next explicit setting.\n\
    \n##### Enumeration Types Before C++11\n\nEnumerations also can be defined with\
    \ the keyword **`enum`** followed by a type name and a set of integer constants\
    \ represented by identifiers, as in\n\n```\nenum Status {keepRolling, won, lost};\n\
    ```\n\nThe constants in such an `enum` are unscoped—you can refer to them simply\
    \ by their names `keepRolling`, `won` and `lost`. If two or more unscoped `enum`s\
    \ contain constants with the same names, this can lead to naming conflicts and\
    \ compilation errors.\n\n##### 11 C++11—Specifying the Type of an `enum`’s Constants\n\
    \nAn enumeration’s constants have integer values. An unscoped `enum`’s underlying\
    \ type depends on its constants’ values and is guaranteed to be large enough to\
    \ store its constants’ values. A scoped `enum`’s underlying integral type is `int`,\
    \ but you can specify a different type by following the type name with a colon\
    \ (`:`) and the integral type. For example, we can specify that the constants\
    \ in the `enum class Status` should have type `long`, as in\n\n```\nenum class\
    \ Status : long {keepRolling, won, lost};\n```\n\n##### 20 C++20—`using enum`\
    \ Declaration\n\nIf the type of an `enum class`’s constants is obvious, based\
    \ on the context in which they’re used—such as in our craps example—C++20’s **`using\
    \ enum`** **declaration**^([11](#ch03.xhtml_ch0fn11),[12](#ch03.xhtml_ch0fn12))\
    \ allows you to reference an `enum class`’s constants without the type name and\
    \ scope-resolution operator (`::`). For example, adding the following statement\
    \ after the `enum class` declaration:\n\n```\nusing enum Status;\n```\n\n[11](#ch03.xhtml_rch0fn11).\
    \ [`http://wg21.link/p1099r5`](http://wg21.link/p1099r5).\n\n[12](#ch03.xhtml_rch0fn12).\
    \ At the time of this writing, this feature works only in Microsoft’s Visual C++\
    \ compiler.\n\nwould allow the rest of the program to use `keepRolling`, `won`\
    \ and `lost`, rather than `Status::keepRolling`, `Status::won` and `Status::lost`,\
    \ respectively. You also may use an individual `enum class` constant with a declaration\
    \ of the form\n\n```\nusing enum Status::keepRolling;\n```\n\nThis would allow\
    \ your code to use `keepRolling` without the `Status::` qualifier.\n\n### 11 5.10\
    \ C++11’s More Secure Nondeterministic Random Numbers\n\n![Images](Images/common02.jpg)\
    \ Security Function `rand`—which was inherited into C++ from the C Standard Library—does\
    \ not have “good statistical properties” and can be predictable.^([13](#ch03.xhtml_ch0fn13))\
    \ This makes programs that use `rand` less secure. C++11 provides a more secure\
    \ library of random-number capabilities that can produce **nondeterministic random\
    \ numbers**—a set of random numbers that can’t be predicted. Such random-number\
    \ generators are used in simulations and security scenarios where predictability\
    \ is undesirable. These capabilities are located in the C++ Standard Library’s\
    \ `<random>` header.\n\n[13](#ch03.xhtml_rch0fn13). “Do not use the `rand()` function\
    \ for generating pseudorandom numbers.” Accessed May 9, 2020\\. [`https://wiki.sei.cmu.edu/confluence/display/c/MSC30-C.+Do+not+use+the+rand%28%29+function+for+generating+pseudorandom+numbers`](https://wiki.sei.cmu.edu/confluence/display/c/MSC30-C.+Do+not+use+the+rand%28%29+function+for+generating+pseudorandom+numbers).\n\
    \nRandom-number generation is a sophisticated topic for which mathematicians have\
    \ developed many algorithms with different statistical properties. For flexibility\
    \ based on how random numbers are used in programs, C++11 provides many classes\
    \ that represent various **random-number generation engines and distributions**.\
    \ An engine implements a random-number generation algorithm that produces pseudorandom\
    \ numbers. A distribution controls the range of values produced by an engine,\
    \ the value’s types (e.g., `int`, `double`, etc.) and the value’s statistical\
    \ properties. We’ll use the default random-number generation engine—**`default_random_engine`**—and\
    \ a **`uniform_int_distribution`**, which evenly distributes pseudorandom integers\
    \ over a specified value range. The default range is from 0 to the maximum value\
    \ of an `int` on your platform.\n\n##### Rolling a Six-Sided Die\n\n[Figure 5.6](#ch05.xhtml_fig5_6)\
    \ uses the `default_random_engine` and the `uniform_int_distribution` to roll\
    \ a six-sided die. Line 14 creates a `default_random_engine` object named `engine`.\
    \ Its constructor argument seeds the random-number generation engine with the\
    \ current time. If you don’t pass a value to the constructor, the default seed\
    \ will be used, and the program will produce the same sequence of numbers each\
    \ time it executes—this is useful for testing purposes. Line 15 creates `randomInt`—a\
    \ `uniform_int_distribution` object that produces `int` values (specified by `<int>`)\
    \ in the range 1 to 6 (specified by the initializer `{1, 6}`). The expression\
    \ `randomInt(engine)` (line 20) returns one `int` in the range 1 to 6.\n\n![Images](Images/05fig06.jpg)![Images](Images/05fig06a.jpg)\n\
    \n**Fig. 5.6** Using a C++11 random-number generation engine and distribution\
    \ to roll a six-sided die more securely. (Part 1 of 2.)\n\nThe notation `<int>`\
    \ in line 15 indicates that `uniform_int_distribution` is a class template. In\
    \ this case, any integer type can be specified in the angle brackets (`<` and\
    \ `>`). In [Chapter 19](#ch19.xhtml_ch19), we discuss how to create class templates,\
    \ and various other chapters show how to use existing class templates from the\
    \ C++ Standard Library. For now, you can use class template `uniform_int_distribution`\
    \ by mimicking the syntax shown in the example.\n\n### 5.11 Scope Rules\n\nThe\
    \ portion of a program where an identifier can be used is known as its scope.\
    \ For example, when we declare a local variable in a block, it can be referenced\
    \ only\n\n• from the point of its declaration in that block and\n\n• in nested\
    \ blocks that appear within that block after the variable’s declaration.\n\nThis\
    \ section discusses block scope and global namespace scope. Parameter names in\
    \ function prototypes have **function-prototype scope**—they’re known only in\
    \ the prototype in which they appear. Later we’ll see other scopes, including\
    \ **class scope** in [Chapter 11](#ch11.xhtml_ch11), and **function** **scope**\
    \ and **namespace scope** in Chapter 23.\n\n##### Block Scope"
