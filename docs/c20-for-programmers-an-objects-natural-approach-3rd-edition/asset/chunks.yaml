    \ Online Learning 订阅者的“粗稿”电子书\n\n你正在查看 *C++20 for Programmers* 的早期访问“粗稿”。我们仔细地准备了这些内容，但它们尚未经过审核并可能会发生变化。在我们完成每一章时，请发送任何更正、意见或建议。\n\
    \n#### O’Reilly Online Learning 的“抢先预览”\n\n作为 O’Reilly 订阅者，你还可以访问我们新视频的预览。\n\n\
    ### 3.2 控制结构\n\n在 20 世纪 60 年代，很明显盲目使用 `goto` 是许多问题的根源。Bohm 和 Jacini 的研究证明，可以在不使用任何\
    \ `goto` 语句的情况下编写程序。结果令人深刻：结构化程序更加清晰、更容易调试，并且更有可能没有错误。**结构化编程**这一术语几乎与“无 goto\
    \ 编程”成为同义。\n\nBohm 和 Jacini 的工作证明，所有程序都可以用三种结构来编写：序列结构、选择结构和迭代结构。我们将讨论 C++ 如何实现每种结构。\n\
    \n#### 3.2.1 序列结构\n\n序列结构是内置在 C++ 中的。除非另有指示，否则计算机按照 C++ 语句在程序中出现的顺序逐条执行——即按顺序执行。以下\
    \ UML 展示了一个典型的序列结构，其中执行了两个计算：\n\n```\n```\n\n在本章和第 4 章中使用 UML 来显示控制语句的控制流，然后在第\
    \ 10-13 章介绍自定义类开发时再次使用 UML。\n\nC++ 允许你在序列结构中拥有任意数量的动作。正如你很快就会看到的，在任何可以放置单个动作的地方，你都可以顺序放置多个动作。\n\
    \n活动图是软件系统的部分**工作流**（也称为**活动**）。此类工作流可能包含算法的一部分，例如前面图中的序列结构。活动图由各种符号组成，如**动作状态符号**（左右侧替换为向外弧形的矩形）、**菱形**和**小圆圈**。这些符号通过**转换****箭头**连接，代表活动的流向。\n\
    \n前面的序列结构活动图包含两个**动作状态**，每个状态包含一个**动作表达式**——例如“将分数加到总和”或“计数器加 1”——指定要执行的特定动作。活动图中的箭头表示**转换**，指示动作状态所代表的动作发生的顺序。\n\
    \n"
- fmt: "\nThe `solid circle` at the top of the activity diagram represents the `initial\
    \ state`—the beginning of the workflow before the program performs the modeled\
    \ actions. The `solid circle surrounded by a hollow circle` at the bottom of the\
    \ diagram represents the `final state`—that is, the end of the workflow after\
    \ the program performs its actions.\n\nThe sequence structure activity diagram\
    \ also includes rectangles with the upper-right corners folded over. These are\
    \ UML `notes` (like comments in `C++`)—explanatory remarks that describe the purpose\
    \ of symbols in the diagram. A `dotted line` connects each note with the element\
    \ it describes. We used the UML `notes` here to illustrate how the diagram relates\
    \ to the C++ code for each action state. Activity diagrams usually do not show\
    \ the C++ code.\n\n### 3.2.2 Selection Statements\n\nC++ has three types of `selection\
    \ statements`. The `if` statement performs (selects) an action (or group of actions)\
    \ if a condition is true, or skips it if the condition is false. The `if…else`\
    \ statement performs an action (or group of actions) if a condition is true and\
    \ performs a different action (or group of actions) if the condition is false.\
    \ The `switch` statement ([Chapter 4](#ch04.xhtml_ch04)) performs one of many\
    \ different actions (or group of actions), depending on the value of an expression.\n\
    \nThe `if` statement is called a `single-selection statement` because it selects\
    \ or ignores a single action (or group of actions). The `if…else` statement is\
    \ called a `double-selection statement` because it selects between two different\
    \ actions (or groups of actions). The `switch` statement is called a `multiple-selection\
    \ statement` because it selects among many different actions (or groups of actions).\n\
    \n### 3.2.3 Iteration Statements\n\nC++ provides four `iteration statements`—also\
    \ called `repetition statements` or `looping statements`—for performing statements\
    \ repeatedly while a `loop-continuation condition` remains true. The iteration\
    \ statements are the `while`, `do`…`while`, `for` and range-based `for`. The `while`\
    \ and `for` statements perform the action (or group of actions) in their bodies\
    \ zero or more times. If the loop-continuation condition is initially false, the\
    \ action (or group of actions) does not execute. The `do`…`while` statement performs\
    \ the action (or group of actions) in its body one or more times. [Chapter 4](#ch04.xhtml_ch04)\
    \ presents the `do`…`while` and `for` statements. [Chapter 6](#ch06.xhtml_ch06)\
    \ presents the range-based `for` statement.\n\n#### Keywords\n\nEach of the words\
    \ `if`, `else`, `switch`, `while`, `do` and `for` are C++ keywords. Keywords cannot\
    \ be used as identifiers, such as variable names, and must contain only lowercase\
    \ letters. The following table shows the complete list of C++ keywords:\n\n![Images](Images/f0075-01.jpg)\n\
    \n#### Other Special Identifiers\n\nThe C++20 standard indicates that the following\
    \ identifiers should not be used in your code because they have special meanings\
    \ in some contexts or are identifiers that may become keywords in the future:\n\
    \n- Non-keyword identifiers with special meaning—`final`, `import`, `module`,\
    \ `override`, `transaction_safe` and `transaction_safe`\n- Experimental keywords—`atomic`,\
    \ `commit`, `synchronized`.\n\n### 3.2.4 Summary of Control Statements\n\nC++\
    \ has three kinds of control structures: selection, iteration, and branching.\
    \ Selection structures allow the program to choose between different paths. Iteration\
    \ structures allow the program to repeat a sequence of statements. Branching structures\
    \ allow the program to jump to another part of the code.\n\nThe `if` statement\
    \ is a `single-selection statement` because it selects or ignores a single action\
    \ (or group of actions). The `if…else` statement is called a `double-selection\
    \ statement` because it selects between two different actions (or groups of actions).\
    \ The `switch` statement is called a `multiple-selection statement` because it\
    \ selects among many different actions (or group of actions).\n\nThe iteration\
    \ statements are the `while`, `do`…`while`, `for` and range-based `for`. The `while`\
    \ and `for` statements perform the action (or group of actions) in their bodies\
    \ zero or more times. If the loop-continuation condition is initially false, the\
    \ action (or group of actions) does not execute. The `do`…`while` statement performs\
    \ the action (or group of actions) in its body one or more times.\n\n### 3.3 `if`\
    \ Single-Selection Statement\n\nThe `if` single-selection statement performs an\
    \ indicated action only when the condition is true. For example, the C++ statement\n\
    \n```cpp\nif (grade >= 60) {\n   cout << \"Passed\";\n}\n```\n\ndetermines whether\
    \ `grade >= 60` is true. If so, `\"Passed\"` is printed, then the next statement\
    \ in order is performed. If the condition is false, the output statement is ignored.\n\
    \n#### `bool` Data Type\n\nIn earlier versions of C, which used integers for Boolean\
    \ values, C++ provides the `bool` type for Boolean variables that can hold only\
    \ the values `true` and `false`. Any expression that evaluates to zero is treated\
    \ as false, and nonzero is treated as true.\n\n#### UML Activity Diagram for an\
    \ `if` Statement\n\nThe following diagram illustrates the single-selection `if`\
    \ statement:\n\n![Images](Images/03unfig02.jpg)\n\nThis figure contains the most\
    \ important symbol in an activity diagram—the diamond, or `decision symbol`, which\
    \ indicates that a decision is to be made. The workflow continues along a path\
    \ determined by the symbol’s `guard conditions`, which can be true or false. Each\
    \ transition arrow emerging from a decision symbol has a guard condition (specified\
    \ in square brackets). If a guard condition is true, the workflow enters the action\
    \ state to which the arrow points. The diagram shows that if the grade is greater\
    \ than or equal to 60 (i.e., the condition is true), the program prints “Passed,”\
    \ then transitions to the activity’s final state. If the grade is less than 60\
    \ (i.e., the condition is false), the program immediately transitions to the final\
    \ state without displaying a message.\n\n### 3.4 `if…else` Double-Selection Statement\n\
    \nThe `if` single-selection statement performs an indicated action only when the\
    \ condition is true. The `if…else` double-selection statement allows you to specify\
    \ an action to perform when the condition is true and another action when the\
    \ condition is false. For example, the C++ statement\n\n```cpp\nif (grade >= 60)\
    \ {\n   cout << \"Passed\";\n}\nelse {\n   cout << \"Failed\";\n}\n```\n\nprints\
    \ `“Passed”` if `grade >= 60`, but prints `“Failed”` if it’s less than 60. In\
    \ either case, after printing occurs, the next statement in sequence is performed.\n\
    \nThe body of the `else` is also indented. Whatever indentation convention you\
    \ choose should be applied consistently throughout your programs.\n\n#### UML\
    \ Activity Diagram for an `if…else` Statement\n\nThe following diagram illustrates\
    \ the flow of control in the preceding `if…else` statement:\n\n![Images](Images/03unfig03.jpg)\n"
