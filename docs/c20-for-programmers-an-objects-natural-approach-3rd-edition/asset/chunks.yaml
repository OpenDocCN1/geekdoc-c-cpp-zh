    # 5.9 案例研究：骰子游戏；引入作用域 `enum`


    最受欢迎的博弈游戏之一是一种被称为“骰点”（craps）的骰子游戏，在世界各地的赌场和后巷中都在玩。游戏的规则非常简单：


    *玩家投掷两枚骰子。每个骰子有六个面。这些面上有 1, 2, 3, 4, 5 和 6 个点数。在骰子停止后，计算两个朝上面的点数之和。如果第一次投掷的总和为
    7 或 11，玩家获胜。如果第一次投掷的总和为 2、3 或 12（称为“骰点”），玩家输掉（即“庄家”获胜）。如果第一次投掷的总和为 4、5、6、8、9 或
    10，则该总和将成为玩家在该场轮的“点数”（point）。要获胜，你必须继续投掷骰子，直到你“命中你的点数”。如果在命中该点数之前掷出 7，玩家则输。*


    在规则中，请注意玩家在第一次投掷以及所有后续投掷中必须投掷两枚骰子。我们将定义一个 `rollDice` 函数来投掷骰子并计算和显示它们的和。该函数将定义一次，但可能会被多次调用——一次用于游戏的第一次投掷，如果玩家在第一次投掷中没有赢或输，则可能会调用更多次。以下是几次示例执行的输出，显示了：


    • 第一次投掷掷出 7 赢，

    • 第一次投掷掷出 12 输，

    • 在后续投掷中在掷出 7 之前“命中点数”赢，

    • 在后续投掷中在“命中点数”之前掷出 7 输。


    ```

    Player rolled 2 + 5 = 7


    Player wins

    ```


    ```

    Player rolled 6 + 6 = 12


    Player loses

    ```


    ```

    Player rolled 3 + 3 = 6


    Point is 6


    Player rolled 5 + 3 = 8


    Player rolled 4 + 5 = 9


    Player rolled 2 + 1 = 3


    Player rolled 1 + 5 = 6


    Player wins

    ```


    ```

    Player rolled 1 + 3 = 4


    Point is 4


    Player rolled 4 + 6 = 10


    Player rolled 2 + 4 = 6


    Player rolled 6 + 4 = 10


    Player rolled 2 + 3 = 5


    Player rolled 2 + 4 = 6


    Player rolled 1 + 1 = 2


    Player rolled 4 + 4 = 8


    Player rolled 4 + 3 = 7


    Player loses

    ```


    ## 实现游戏


    骰点程序 (Fig. 5.5) 使用两个函数——`main` 和 `roll-Dice` 以及 `switch`、`while`、`if…else`、嵌套
    `if…else` 和嵌套 `if` 语句来模拟游戏。函数 `rollDice` 的原型（第 9 行）表明该函数不接受参数（空括号）并返回一个 `int`（骰子的和）。


    ![Images](img/05fig05.jpg)


