    在块内部声明的标识符具有`block scope`（块作用域），它从标识符声明处开始，到所在块的结束右括号（`}`）结束。局部变量具有`块作用域`，函数参数也是如此（尽管它们是在块的大括号之外声明的）。任何块都可以包含变量声明。当块嵌套，且外层块中的标识符与内层块中的标识符同名时，外层块中的那个会被“隐藏”，直到内层块结束。内层块会“看到”它自己的局部变量的值，而不是包含它的块中同名变量的值。


    无意中在内层块中的标识符与外层块中使用的标识符使用相同的名称，而实际上你希望外层块的标识符在整个内层块持续期间保持激活，这通常是一个逻辑错误。避免在内层作用域中使用隐藏外层作用域名称的变量名。大多数编译器都会对此你发出警告。


    局部变量也可以声明为 `static`。此类变量也具有`块作用域`，但与其他局部变量不同，`static` 局部变量在函数返回给调用者时会保留它的值。当函数下次被调用时，`static`
    局部变量包含它上一次函数完成执行时的值。以下语句声明了 `static` 局部变量 `count` 并初始化为 1：


    ```

    static int count{1};

    ```


    默认情况下，所有数值类型的 `static` 局部变量都初始化为 0。以下语句声明了 `static` 局部变量 `count` 并将其初始化为 0：


    ```

    static int count;

    ```


    非基本类型变量的默认初始化取决于类型——例如，`string` 的默认值是空字符串（`""`）。我们将在后面的章节中介绍关于默认初始化的内容。


    ### 全局命名空间作用域


    在任何函数或类之外声明的标识符具有`global namespace scope`（全局命名空间作用域）。该标识符在源文件中声明后对所有函数都是“可见的”。函数定义、放在函数之外的函数原型、类定义和全局变量都具有`全局命名空间作用域`。`全局变量`通过在任何类或函数定义之外放置变量声明创建。这些变量在整个程序执行过程中都会保留其值。


    将变量声明为全局而非局部，会导致当不需要访问该变量的函数意外或恶意修改它时产生预期之外的副作用。除了像 `cin` 和 `cout` 这样真正的全局资源外，你应该避免使用全局变量。这是“最小权限原则”（principle
    of least privilege）的一个示例，它是良好软件工程的基础。该原则规定代码应该只获得完成其指定任务所需的权限和访问权限，而更多。这的一个例子是局部变量的作用域，它在不需要时不应该是应该是可见的。局部变量在函数被调用时创建，在函数执行期间使用，并在函数返回时消失。最小权限原则通过防止代码意外（或恶意）修改其不应能访问的变量值，使你的程序更加健壮。


    通常情况下，变量应该在需要访问它们的最窄作用域内声明。仅在特定函数使用的变量应该声明为该函数中的局部变量，而不是全局变量。


    ### 作用域演示


    图 5.7 展示了全局变量、局部变量、`static` 变量和 `main` 函数的作用域问题。

