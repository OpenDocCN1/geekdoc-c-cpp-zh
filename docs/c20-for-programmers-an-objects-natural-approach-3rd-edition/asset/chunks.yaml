    该程序从一个循环开始，计算并显示 0–10 整数的斐波那契值，随后通过三次调用计算整数 20、30 和 35 的斐波那契值（第 15–17 行）。`main`
    中对 `fibonacci` 的调用（第 12 行和 15–17 行）不是递归调用，但 `fibonacci` 中第 26 行的调用是递归的。程序每次调用
    `fibonacci`（第 21–28 行）时，函数会立即测试基础情况以确定 `number` 是否等于 `0` 或 `1`（第 22 行）。如果为真，第
    23 行返回 `number`。有趣的是，如果 `number` 大于 1，递归步骤（第 26 行）会产生两个递归调用，每个调用处理的比原始 `fibonacci`
    调用稍小一点的问题。


    ### 评估 `fibonacci(3)`


    下图显示了函数 `fibonacci` 如何评估 `fibonacci(3)`。该图引发了关于 C++ 编译器评估运算符操作数顺序的一些有趣问题。这与运算符应用于其操作数的顺序是两个不同的问题，后者是由运算符优先级和分组规则决定的顺序。下图显示，评估
    `fibonacci(3)` 会导致两个递归调用，即 `fibonacci(2)` 和 `fibonacci(1)`。这些调用是按什么顺序执行的？


    ![Images](img/05unfig02.jpg)


    ### 操作数的评估顺序


    大多数程序员简单地假设操作数是从左到右评估的，这在某些编程语言中确实如此。C++ 并没有规定许多运算符（包括 `+`）的操作数的评估顺序。因此，你不能对这些调用的执行顺序做任何假设。事实上，调用可能会先执行
    `fibonacci(2)` 后执行 `fibonacci(1)`，也可以先执行 `fibonacci(1)` 后执行 `fibonacci(2)`。在程序程序和大多数其他程序中，事后证明最终结果将是相同的。然而，在某些程序中，操作数的评估可能会产生副作用（数据值的更改），这可能会影响表达式的最终结果。


    ### 指定了评估顺序的运算符


    在 C++17 之前，C++ 仅规定了运算符 `&&`、`||`、逗号 (`,`) 和 `?:` 操作数的评估顺序。前三个是二元运算符，保证其两个操作数从左到右评估。最后一个运算符是
    C++ 唯一的三元运算符——其最左侧的操作数总是先评估；如果结果为真，接着评估中间的操作数并忽略最后一个操作数；如果最左侧的操作数为假，则评估第三个操作数并忽略中间的操作数。


    从 C++17 开始，C++ 现在还规定了其他各种运算符的操作数评估顺序。对于点 (`.`)、`[]` (第 6 章)、`->` (第 7 章)、括号（函数调用）、`<<`、`>>`
    和 `->*`，编译器从左到右评估操作数。对于函数调用的括号，这意味着编译器在评估参数之前评估函数名。编译器从右到左评估赋值运算符的操作数。


    编写依赖其他运算符操作数评估顺序的程序可能会导致逻辑错误。对于其他运算符，为了确保副作用按正确的顺序应用，请将复杂的表达式拆分为单独的语句。记住 `&&`
    和 和 `||` 运算符使用短路评估。如果一个带有副作用的表达式放在 `&&` 或 `||` 运算符的右侧，而该表达式应该始终被评估，那就是逻辑错误。


    ### 指数级复杂度


    对于我们这里使用的生成斐波那契数的递归程序，需要注意：`fibonacci` 函数中的每层递归都会对函数调用次数产生倍增效应；即计算第 *n* 个斐波那契数所需的递归调用次数处于
    `2^(*n*)` 数量级。这会迅速失控。仅计算第 20 个斐波那契数就需要大约 `2²⁰` 次约百万次调用，计算第 30 个斐波那契数需要大约 `2³⁰`
    次约十亿次调用，依此类推。计算机科学家将此称为指数级复杂度。随着 *n* 变得很大，这类问题即使是让世界上强大的计算机也力不从心。复杂的复杂度问题特别是指数级复杂度，通常在被称为“算法”的高级计算机课程中详细讨论。避免使用导致调用指数级“爆炸”的斐波那契式递归程序。


    ### 5.20 递归与迭代


    在之前的两个节中，我们学习了两个可以使用简单的迭代程序实现的递归函数。本节比较了两种方法，并讨论了为什么在特定情况下你可能会选择一种方法而不是另一种。


    * 迭代和递归都基于控制语句：迭代使用迭代语句；递归使用选择语句。

    * 迭代和递归都涉及迭代：迭代显式使用迭代语句；递归通过重复函数调用实现迭代。

    * 迭代和递归各涉及一个终止测试：迭代在循环继续条件失败时终止；递归在识别出基础情况时终止。

    * 计数控制的迭代和递归都逐渐接近终止：迭代修改计数器，直到计数器的取值使循环继续条件失败；递归产生原始问题的更简单版本。

    * 迭代和递归都可以无限发生：如果循环继续测试永远不为假，迭代会导致无限循环；如果递归步骤在每次调用期间未能以收敛于基础情况的方式缩小问题，则会导致无限递归。


    #### 迭代阶乘实现


    为了说明迭代和递归的区别，让我们查看阶乘问题的迭代解决方案 (图 5.18）。第 22–24 行使用了迭代语句，而不是递归解决方案（图 5.16 第 19–24
    行）的选择语句。两种解决方案都使用了终止测试。在递归解决方案中，第 19 行 ([图 5.16]) 测试基础情况。在迭代解决方案中，第 22 行 (图 5.18)
    测试循环继续条件——如果测试失败，循环终止。最后，迭代解决方案不是产生原始问题的更简单版本，而是使用一个计数器，直到循环继续条件变为假。


    ![Images](img/05fig18.jpg)


    **图 5.18** 迭代函数 `factorial`。


    #### 递归的缺点


    递归有其缺点。它反复调用函数调用的机制以及随之而来的开销。这在处理器时间和内存空间上都是昂贵的。每次递归调用都会创建函数变量的副本；这会消耗大量的内存。迭代通常发生在函数内部，因此省略了重复函数调用和额外内存分配的开销。那么，为什么选择递归呢？


    #### 何时选择递归与迭代


