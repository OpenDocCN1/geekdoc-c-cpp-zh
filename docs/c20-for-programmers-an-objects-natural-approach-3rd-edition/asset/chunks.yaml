- fmt: "\nIn [Fig. 4.1](#ch04.xhtml_fig4_1), lines 7, 9 and 11 define the elements\
    \ of counter-controlled iteration. Line 7 declares the control variable `counter`\
    \ as an `int`, reserves space for it in memory and sets its initial value to `1`.\
    \ Declarations that require initialization are executable statements. In C++,\
    \ it’s more precise to call a variable declaration that also reserves memory a\
    \ `definition`. Because definitions are declarations, too, we’ll generally use\
    \ the term “declaration” except when the distinction is important.\n\nLine 10\
    \ displays `counter`’s value once per iteration of the loop. Line 11 increments\
    \ the control variable by 1 for each iteration of the loop. The `while`’s loop-continuation\
    \ condition (line 9) tests whether the value of the control variable is less than\
    \ or equal to `10` (the final value for which the condition is true). The program\
    \ performs the `while`’s body even when the control variable is `10`. The loop\
    \ terminates when the control variable exceeds `10`.\n\nFloating-point values\
    \ are approximate, so controlling counting loops with floating-point variables\
    \ can result in imprecise counter values and inaccurate tests for termination.\
    \ For that reason, always control counting loops with integer values.\n\n### 4.3\
    \ `for` Iteration Statement\n\nC++ also provides the `for` iteration statement,\
    \ which specifies the counter-controlled-iteration details in a single line of\
    \ code. [Figure 4.2](#ch04.xhtml_fig4_2) reimplements the application of [Fig.\
    \ 4.1](#ch04.xhtml_fig4_1) using a `for` statement.\n\n![Images](Images/04fig02.jpg)\n\
    \n**Fig. 4.2** Counter-controlled iteration with the `for` iteration statement.\n\
    \nWhen the `for` statement (lines 9–11) begins executing, the control variable\
    \ `counter` is declared and initialized to `1`. Next, the program checks the loop-continuation\
    \ condition, `counter <= 10`, which is between the two required semicolons. Because\
    \ `counter`’s initial value is `1`, the condition is true. So, the body statement\
    \ (line 10) displays `counter`’s value (`1`). After executing the loop’s body,\
    \ the program increments `counter` in the expression `++counter`, which appears\
    \ to the right of the second semicolon. Then the program performs the loop-continuation\
    \ test again to determine whether to proceed with the loop’s next iteration. At\
    \ this point, `counter`’s value is `2`, so the condition is still true, so the\
    \ program executes the body statement again. This process continues until the\
    \ loop has displayed the numbers 1–10 and `counter`’s value becomes `11`. At this\
    \ point, the loop-continuation test fails, iteration terminates, and the program\
    \ continues executing at the first statement after the `for` (line 13).\n\n####\
    \ A Closer Look at the `for` Statement’s Header\n\nThe following diagram takes\
    \ a closer look at the `for` statement in [Fig. 4.2](#ch04.xhtml_fig4_2):\n\n\
    ![Images](Images/04unfig01.jpg)\n\nThe first line—including the keyword `for`\
    \ and everything in the parentheses after `for` (line 9 in [Fig. 4.2](#ch04.xhtml_fig4_2))—is\
    \ sometimes called the `for` statement header. The `for` header “does it all”—it\
    \ specifies each item needed for counter-controlled iteration with a control variable.\n\
    \n#### General Format of a `for` Statement\n\nThe general format of the `for`\
    \ statement is\n\n```\nfor (initialization; loopContinuationCondition; increment)\
    \ {\n    statement\n}\n```\n\nwhere\n\n-• the `initialization` expression names\
    \ the loop’s control variable and provides its initial value,\n-• the `loopContinuationCondition`\
    \ determines whether the loop should continue executing and\n-• the `increment`\
    \ modifies the control variable’s value so that the loop-continuation condition\
    \ eventually becomes false.\n\nThe two semicolons in the `for` header are required.\
    \ If the loop-continuation condition is initially false, the program does not\
    \ execute the `for` statement’s body. Instead, execution proceeds with the statement\
    \ following the `for`.\n\n#### Scope of a `for` Statement’s Control Variable\n\
    \nIf the `initialization` expression in the `for` header declares the control\
    \ variable, it can be used only in that `for` statement—not beyond it. This restricted\
    \ use is known as the variable’s `scope`, which defines where it can be used in\
    \ a program. For example, a variable’s scope is from its declaration point to\
    \ the right brace that closes the block. We discuss scope in detail in [Chapter\
    \ 5](#ch05.xhtml_ch05).\n\n#### Expressions in a `for` Statement’s Header Are\
    \ Optional\n\nAll three expressions in a `for` header are optional. If you omit\
    \ the `loopContinuationCondition`, the condition is always true, thus creating\
    \ an infinite loop. You might omit the `initialization` expression if the program\
    \ initializes the control variable before the loop. You might omit the `increment`\
    \ expression if the program calculates the increment in the loop’s body or if\
    \ no increment is needed.\n\nThe increment expression in a `for` acts like a standalone\
    \ statement at the end of the `for`’s body. Therefore, the increment expressions\n\
    \n```\ncounter = counter + 1\ncounter += 1\n++counter\ncounter++\n```\n\nare equivalent\
    \ in a `for` statement. Many programmers prefer `counter++` because it is concise.\
    \ In [Chapter 14](#ch14.xhtml_ch14), you’ll see that preincrement can have performance\
    \ advantage.\n\n#### Using a `for` Statement’s Body\n\nPrograms frequently display\
    \ the control variable value or use it in calculations, but this use is not required.\
    \ If a program must modify the control variable in body, use `while` rather than\
    \ `for`.\n\n#### UML Activity Diagram of the `for` Statement\n\nBelow is the UML\
    \ activity diagram of the `for` statement:\n\n![Images](04fig02)\n\nThe diagram\
    \ makes it clear that initialization occurs only once—before testing the loop-continuation\
    \ condition the first time. Increment occurs each time through the body.\n\n###\
    \ 4.4 Examples Using the `for` Statement\n\nThe following examples show techniques\
    \ for varying the control variable in `for` statement. In each case, we write\
    \ only the appropriate `for` header. Note the change in the relational operator\
    \ for the loops that decrement the control variable.\n\na) Vary the control variable\
    \ from `1` to `100` in increments of `1`.\n\n```\nfor (int i{1}; i <= 100; ++i)\n\
    ```\n\nb) Vary the control variable from `100` down to `1` in decrements of `1`.\n\
    \n```\nfor (int i{100}; i >= 1; --i)\n```\n\nc) Vary the control variable from\
    \ `7` to `77` in increments of `7`.\n\n```\nfor (int i{7}; i <= 77; i += 7)\n\
    ```\n\nd) Vary the control variable from `20` down to `2` in decrements of `2`.\n\
    \n```\nfor (int i{20}; i >= 2; i -= 2)\n```\n\ne) Vary the control variable over\
    \ the values `2`, `5`, `8`, `11`, `14`, `17`, `20`.\n\n```\nfor (int i{2}; i <=\
    \ 20; i += 3)\n```\n\nf) Vary the control variable over the values `99`, `88`,\
    \ `77`, `66`, `55`, `44`, `33`, `22`, `11`, `0`.\n\n```\nfor (int i{99}; i >=\
    \ 0; i -= 11)\n```\n\nDo not use equality operators (`!=` or `==`) in a loop-continuation\
    \ condition if the loop’s control variable increments or decrements by more than\
    \ `1`. For example, in the `for` statement header\n\n```\nfor (int counter{1};\
    \ counter != 10; counter += 2)\n```\n\n`counter != 10` never becomes false (resulting\
    \ in an infinite loop) because `counter` increments by 2 after each iteration,\
    \ producing only the odd values (3, 5, 7, 9, 11, …).\n"
