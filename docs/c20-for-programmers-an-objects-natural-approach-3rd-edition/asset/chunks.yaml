    `rand` 函数直接产生的数值范围通常与特定应用程序的要求不同。例如，一个模拟掷硬币的程序可能只需要 0 表示“正面”，用 1 表示“反面”。一个模拟掷六面骰的程序需要
    1 到 6 之间的随机整数。一个在视频游戏中随机预测下一种将飞过平线的飞船类型（共四种种可能）的程序，可能需要 1 到 4 之间的随机整数。


    ### 5.8.1 掷六面骰


    为了演示 `rand`，图 5.2 模拟了十次掷六面骰，并显示了每次掷出的值。`rand` 函数的原型定义在 `<cstdlib>` 中。为了产生 0 到
    5 之间的整数，我们如下使用取模运算符（`%`）配合 `rand`：


    ```

    rand() % 6

    ```


    这被称为 `scaling`（缩放）。数字 6 被称为 `scaling factor`（缩放因子）。然后我们通过在之前的结果上加 1 来 `shift`（偏移）产生数字的范围。图
    5.2 证实结果在 1 到 6 范围内。如果你多次执行此程序，你会发现它每次产生相同的“随机”值。我们将在 图 5.4 中展示如何修复这个问题。


    ![Images](img/05fig02.jpg)![Images](img/05fig02a.jpg)


    **图 5.2** 由 `1 + rand() % 6` 产生的偏移且缩放后的整数。（两部分中的第一部分。）


    ### 5.8.2 掷 60,000,000 次六面骰


    为了证明 `rand` 产生的数值出现概率大致相等，图 5.3 模拟了 60,000,000 次掷骰子。(7) 1 到 6 之间的每个整数应该出现大约 10,000,000
    次（掷骰总数的六分之一）。程序的输出证实了这一点。`switch` 初始化器（第 19 行）中 `face` 变量的定义前面有 `const`。对于任何初始化后不应改变的变量，这是一个良好的做法——这使得编译器能够在你不小心修改变量时报告错误。


    7。当共同作者 Harvey Deitel 在 1976 年首次为他的课程实现这个示例时，他只进行了 600 次掷骰子——6000 次需要太太了。在我们的系统上，该程序大约花了五秒钟完成了
    60,000,000 次掷骰子！600,000,000 次掷骰子大约需要一分钟。掷骰子是顺序发生的。在并发章节中，我们将探索如何并行化此应用程序，以利用当今的多核计算机。


    ![Images](img/05fig03.jpg)![Images](img/05fig03a.jpg)


    **图 5.3** 掷 60,000,000 次六面骰。（两部分中的第一部分。）


    如输出所示，我们可以通过缩放和偏移 `rand` 产生的值来模拟掷六面骰。`switch` 中的默认情况（第 38–39 行）永远不会执行，因为 `switch`
    的控制表达式（`face`）的值始终在 1–6 范围内。在我们学习 第 6 章 的数组之后，我们将展示如何用一条单行语句优雅地替换 图 5.3 中的整个 `switch`
    语句。许多程序员在每个 `switch` 语句中提供 `default` 情况以捕获错误，即使他们确信程序没有错误。


    #### 14 C++14 用于数值字面量的数字分隔符


    在 C++14 之前，你在程序中将整数值 60,000,000 表示为 `60000000`。输入许多数字的数值字面量容易出错。为了使数值字面量更具可读性并减少错误，你可以在数字组之间使用
    C++14 的 `digit separator` `''`（一个单引号字符）——`60''000''000`（第 17 行）表示整数值 60,000,000。你可能会奇怪为什么使用单引号而不是逗号。如果在第
    17 行使用 `60,000,000`，C++ 会将逗号视为逗号运算符，`60,000,000` 的值将是最右侧表达式（`000`）。循环继续条件将立即为假——这是程序中的一个逻辑错误。


    ### 5.8.3 使用 `srand` 初始化随机数生成器


    再次执行 图 5.2 中的程序会产生


    ```

    6 6 5 5 6 5 1 1 5 3

    ```


    这是 `rand` 产生的相同序列。这是 图 5.2 中显示的相同序列。这些如何是随机的？我们使用 `srand` 为随机数生成器设置种子。`rand` 的原型定义在
    `<cstdlib>` 中。为了产生 0 到 5 之间的整数，我们如下使用取模运算符（`%`）配合 `rand`：


    ```

    rand() % 6

    ```


    这被称为 `scaling`（缩放）。数字 6 被称为 `scaling factor`（缩放因子）。然后我们通过在之前的结果上加 1 来 `shift`（偏移）产生数字的范围。图
    5.2 证实结果在 1 到 6 范围内。如果你多次执行此程序，你会发现它每次产生相同的“随机”值。我们将在 图 5.4 中展示如何修复这个问题。


