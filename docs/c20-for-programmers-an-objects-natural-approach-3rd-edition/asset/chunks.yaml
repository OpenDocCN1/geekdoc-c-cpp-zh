    while (cin >> grade) {\n```\n\nperforms the input in the `while` statement’s condition.\
    \ In this case, the loop-continuation condition evaluates to true if `cin` successfully\
    \ reads an `int` value. If the user enters the endof-file indicator, the condition\
    \ evaluates to false.\n\nIf the condition evaluates to true, line 25 adds `grade`\
    \ to `total` and line 26 increments `gradeCounter`. These variables are used to\
    \ compute the average of the grades. Next, lines 29–50 use a `switch` statement\
    \ to increment the appropriate letter-grade counter based on the numeric grade\
    \ entered.\n\n##### Processing the Grades"
