    stream manipulator **`left`** (found in header `<iostream>`). You can restore
    right-alignment by outputting nonparameterized stream manipulator **`right`**.


    The other formatting in the output statements displays variable `amount` as a
    fixed-point value with a decimal point (`fixed` in line 10) right-aligned in a
    field of 20 character positions (`setw(20)` in line 27) and two digits of precision
    to the right of the decimal point (`setprecision(2)` in line 10). We applied the
    stream manipulators `fixed` and `setprecision` to the output stream `cout` before
    the `for` loop because these format settings remain in effect until they’re changed—such
    settings are called **sticky settings**, and they do not need to be applied during
    each iteration of the loop. However, the field width specified with `setw` applies
    only to the next value output. [Chapter 15](#ch15.xhtml_ch15) discusses `cin`’s
    and `cout`’s formatting capabilities in detail. We continue discussing C++20’s
    powerful new text-formatting capabilities in Section 4.15.


    ##### Performing the Interest Calculations with Standard Library Function `pow`


    The `for` statement (lines 22–28) iterates 10 times, varying the `int` control
    variable `year` from 1 to 10 in increments of 1\. Variable `year` represents *n*
    in the problem statement.


    C++ does not include an exponentiation operator, so we use the **standard library
    function** **`pow`** (line 24) from the header `<cmath>` (line 5). The call `pow(x,
    y)` calculates the value of *x* raised to the *y*th power. The function receives
    two `double` arguments and returns a `double` value. Line 24 performs the calculation
    *a* = *p*(1 + *r*)^(*n*), where *a* is `amount`, *p* is `principal`, *r* is `rate`
    and *n* is `year`.


    ![Images](Images/common01.jpg) PERF The body of the `for` statement contains the
    calculation `1.0 + rate` as `pow`’s first argument. This calculation produces
    the same result each time through the loop, so repeating it in every iteration
    of the loop is wasteful. In loops, avoid calculations for which the result never
    changes. Instead, place such calculations before the loop. To improve program
    performance, many of today’s optimizing compilers place such calculations before
    loops in the compiled code.


    ##### Floating-Point Number Precision and Memory Requirements


    Variables of type `float` represent **single-precision floating-point numbers**.
    Most of today’s systems store these in four bytes of memory with approximately
    seven significant digits. Variables of type `double` represent **double-precision
    floating-point numbers**. Most of today’s systems store these in eight bytes of
    memory with approximately 15 significant digits—approximately double the precision
    of `float` variables. Most programmers represent floating-point numbers with type
    `double`. C++ treats floating-point numbers like 3.14159 in a program’s source
    code as `double` values by default. Such values in the source code are known as
    **floating-point literals**.


    Though most systems store `float`s in four bytes and `double`s in eight bytes,
    the C++ standard indicates that type `double` provides at least as much precision
    as `float`. There is also type `long double`, which provides at least as much
    precision as `double`. For a complete list of C++ fundamental types and their
    typical ranges, see


    ```

    https://en.cppreference.com/w/cpp/language/types

    ```


    ##### Floating-Point Numbers Are Approximations'
