    ### 5.13 References and Reference Parameters


    ![Images](Images/common01.jpg) Perf Two ways to pass arguments to functions in
    many programming languages are `pass-by-value` and `pass-by-reference`. When an
    argument is passed by value, a copy of the argument’s value is made and passed
    to the called function. Changes to the copy do not affect the original variable’s
    value in the caller. This prevents the accidental side effects that so greatly
    hinder the development of correct and reliable software systems. So far, each
    argument in the book has been passed by value. One disadvantage of pass-by-value
    is that, if a large data item is being passed, copying that data can take a considerable
    amount of execution time and memory space.


    #### Reference Parameters


    This section introduces reference parameters—the first of the two means C++ provides
    for performing pass-by-reference. When a variable is passed by reference, the
    caller gives the called function the ability to access that variable in the caller
    directly and to modify the variable.


    [15](#ch05.xhtml_rch0fn15). [Chapter 7](#ch07.xhtml_ch07) discusses pointers,
    which enable an alternate form of pass-by-reference in which the style of the
    function call clearly indicates pass-by-reference (and the potential for modifying
    the caller’s arguments).


    ![Images](Images/common01.jpg) Perf Pass-by-reference is good for performance
    because it can eliminate the pass-by-value overhead of copying large amounts of
    data. But pass-by-reference can weaken security—the called function can corrupt
    the caller’s data. After this section, we’ll show how to achieve the performance
    advantage of pass-by-reference while simultaneously achieving the software engineering
    advantage of protecting the caller’s data.


    A `reference parameter` is an alias for its corresponding argument in a function.
    To indicate a function parameter is passed by reference, simply follow the parameter’s
    type in the function prototype by an ampersand (`&`); For example, the parameter
    declaration


    ```

    int& number

    ```


    when reading from right to left is pronounced “`number` is a reference to an `int`.”
    As always, the function prototype and header must agree. In the function call,
    simply mention a variable by name to pass it by reference. In the called function’s
    body, the reference parameter (e.g., `number`) refers to the original variable,
    which can be modified.


    #### Passing Arguments by Value and Reference


    [Figure 5.9](#ch05.xhtml_fig5_9) compares pass-by-value and pass-by-reference
    with reference parameters. The “styles” of the arguments in the calls to `squareByValue`
    and `squareByReference` are identical—both variables are simply mentioned by name
    in the calls. The compiler checks the function prototypes and definitions to determine
    whether to use pass-by-value or pass-by-reference.


    ![Images](Images/05fig09.jpg)![Images](Images/05fig09a.jpg)


    **Fig. 5.9** Passing arguments by value and reference. (Part 1 of 2.)


    #### References as Aliases within a Function


    References can also be used as aliases for other variables within a function (although
    they typically are used with functions as shown in [Fig. 5.9](#ch05.xhtml_fig5_9)).
    For example, the code


    ```

    int count{1}; // declare integer variable count


    int& cRef{count}; // create cRef as an alias for count


    ++cRef; // increment count (using its alias cRef)

    ```


    increments variable `count` by using its alias `cRef`. Reference variables must
    be initialized in their declarations and cannot be reassigned as aliases to other
    variables. In this sense, references are constant. All operations performed on
    the alias (i.e., the reference) are actually performed on the original variable.
    The alias is simply another name for the original variable. Unless it’s a reference
    to a constant (discussed below), a reference’s initializer must be an *lvalue*—something
    that can appear on the left side of an assignment, like a variable name. A reference
    may not be initialized with a constant or *rvalue* expression—that is, something
    might appear on the right side of an assignment, such as the result of a calculation.


    ##### `const` References

