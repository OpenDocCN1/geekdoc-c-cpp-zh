    ## 格式详情

    第 13 和 14 行中的 `format` 调用分别使用占位符 `{:>7.2f}` 来格式化 `principal` 和 `rate` 的值。占位符中的冒号（`:`）引入了**格式说明符**（format
    specifier），它指示了如何格式化对应的值。格式说明符 `>7.2f` 用于浮点数（`f`），该数应在字段宽度为 `7` 个位置的字段中**右对齐（`>`）**，并保留两位小数精度（`.2`）——即小数点后右侧两位。与之前展示的
    `setprecision` 和 `fixed` 不同，在占位符中指定的格式设置不是“粘性的”（not sticky）——它们只作用于插入到该占位符的值。


    `principal` 的值（`1000.00`）恰好需要七个字符显示，因此不需要额外的空格来填充字段宽度。`rate` 的值（`0.05`）总共只需要四个字符位置，因此它将在七个字符的字段中右对齐，并在左侧填充前导空格，如下


    ![Images](img/04unfig06.jpg)


    数值默认是右对齐的，因此这里不需要 `>`。你可以通过 `<` 在字段宽度内对数值进行**左对齐**。


    ### 格式化存款列表头的年份和金额

    在第 17 行的格式字符串中


    ```

    "\n{}{:>20}\n"

    ```


    `"Year"` 简单地被放置在第一个占位符的位置，该占位符不包含格式说明符。第二个占位符表示 `"Amount on Deposit"`（17 个字符）应在
    `20` 个字符的字段中右对齐（`>`）——`format` 插入三个前导空格以使字符串右对齐。字符串默认是左对齐，因此这里需要 `>` 来强制右对齐。


    ### 格式化 `for` 循环中存款值的年份和金额

    第 22 行的格式字符串


    ```cpp

    "{:>4d}{:>20.2f}\n"

    ```


    使用了两个占位符来格式化循环的输出。占位符 `{:>4d}` 表示 `year` 的值应格式化为整数（`d`），并在宽度为 `4` 的字段中右对齐（`>`）。这使得所有年份值在
    `"Year"` 列下右对齐。


    占位符 `{:>20.2f}` 将 `amount` 的值格式化为浮点数（`f`），在宽度为 `20` 的字段中右对齐（`>`），并带有小数点及两位小数（`.2`）。以这种方式格式化
    `amount` 可以使其**小数点垂直对齐**，这是金额的典型做法。20 的字段宽度使 `amount` 在 `"Amount on Deposit"`
    列下右对齐。


    ### 4.16 总结

    在本章中，我们完成了对 C++ 除一个外之外所有控制语句的介绍，这些语句允许你控制成员函数的执行流。第 3 章 讨论了 `if`、`if…else` 和 `while`。第
    4 章 演示了 `for`、`do…while` 和 `switch`。我们展示了 C++17 的增强，允许你在 `if` 和 `switch` 语句的头部初始化变量。你使用了
    `break` 语句退出 `switch` 语句并立即终止循环。你使用了 `continue` 语句终止循环的当前迭代并继续循环的下一次迭代。我们引入了 C++
    的逻辑运算符，允许你在控制语句中使用更复杂的条件表达式。我们展示了 C++20 的属性 `[[likely]]` 和 `[[unlikely]]`，用于提示编译器选择语句中哪些执行路径更有可能或不太可能执行。在我们的对象自然型案例研究中，我们使用了
    `miniz-cpp` 开源库来创建和读取压缩的 ZIP 归档文件。最后，我们引入了更多 C++20 强大且表现力丰富的文本格式化功能。在第 5 章中，你将创建自己的自定义函数。


