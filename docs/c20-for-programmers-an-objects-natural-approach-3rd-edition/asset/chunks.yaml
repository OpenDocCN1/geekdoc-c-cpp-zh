    #### 5.8.3 Randomizing the Random-Number Generator with `srand`


    Executing the program of [Fig. 5.2](#ch05.xhtml_fig5_2) again produces


    ```

    6 6 5 5 6 5 1 1 5 3

    ```


    This is the same sequence of values shown in [Fig. 5.2](#ch05.xhtml_fig5_2). How
    can these be random numbers?


    Function `rand` actually generates **pseudorandom numbers**. Repeatedly calling
    `rand` produces a sequence of numbers that appears to be random. However, the
    sequence repeats itself each time the program executes. When debugging a simulation
    program, random-number repeatability is essential for proving that corrections
    to the program work properly. Once a program has been thoroughly debugged, it
    can be conditioned to produce a different sequence of random numbers for each
    execution. This is called **randomizing** and can be accomplished with the C++
    Standard Library function **`srand`** from the header `<cstdlib>`. Function `srand`
    takes an `unsigned` integer argument and **seeds** the `rand` function to produce
    a different sequence of random numbers for each execution.


    ##### Using `srand`


    [Figure 5.4](#ch05.xhtml_fig5_4) demonstrates function `srand`. The program produces
    a different sequence of random numbers each time it executes, provided that the
    user enters a different seed. We used the same seed in the first and third sample
    outputs, so the same series of 10 numbers is displayed in each of those outputs.


    ![Images](Images/common02.jpg) Security For security, ensure that your program
    seeds the random-number generator differently (and only once) each time the program
    executes; otherwise, an attacker would easily be able to determine the sequence
    of pseudorandom numbers that would be produced.


    ![Images](Images/05fig04.jpg)![Images](Images/05fig04a.jpg)


    **Fig. 5.4** Randomizing the die-rolling program. (Part 1 of 2.)


    #### 5.8.4 Seeding the Random-Number Generator with the Current Time


    To randomize without having to enter a seed each time, we can use a statement
    like


    ```

    srand(gsl::narrow_cast<unsigned int>(time(0)));

    ```


    This causes the computer to read its clock to obtain the value for the seed. Function
    **`time`** (with the argument `0` as written in the preceding statement) typically
    returns the current time as the number of seconds since January 1, 1970, at midnight
    Greenwich Mean Time (GMT). This value (which is of type `time_t`) is converted
    to `unsigned int` and used as the seed to the random-number generator. The `narrow_cast`
    (from the Guidelines Support Library) in the preceding statement eliminates a
    compiler warning that’s issued if you pass a `time_t` value to a function that
    expects an `unsigned int`.^([8](#ch03.xhtml_ch0fn8)) The function prototype for
    `time` is in `<ctime>`.


    [8](#ch03.xhtml_rch0fn8). Our code originally used a `static_cast` rather than
    a `narrow_cast`. The C++ Core Guidelines checker in Microsoft Visual C++ reported
    that narrowing conversions should be performed with `narrow_cast` operators.


    #### 5.8.5 Scaling and Shifting Random Numbers


    Previously, we simulated rolling a six-sided die with the statement


    ```

    int face{1 + rand() % 6};

    ```


    which always assigns an integer (at random) to variable `face` in the range 1
    ≤ `face` ≤ 6\. The width of this range (i.e., the number of consecutive integers
    in the range) is 6, and the starting number in the range is 1\. Referring to the
    preceding statement, we see that the width of the range is determined by the number
    used to scale `rand` with the remainder operator (i.e., 6), and the starting number
    of the range is equal to the number (i.e., 1) that is added to the expression
    `rand % 6`. We can generalize this result as


    `int` *variableName*`{`*shiftingValue* `+ rand() %` *scalingFactor*`};`


    where the *shiftingValue* is equal to the first number in the desired range of
    consecutive integers, and the *scalingFactor* is equal to the width of the desired
    range of consecutive integers.'
