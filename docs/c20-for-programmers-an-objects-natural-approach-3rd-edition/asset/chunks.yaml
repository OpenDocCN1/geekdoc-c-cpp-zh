    ##### Empty Statement\n\nJust as a block can be placed anywhere a single statement\
    \ can be placed, it’s also possible to have an **empty statement**, which is represented\
    \ by placing a semicolon (`;`) where a statement typically would be.\n\n#### 3.4.3\
    \ Conditional Operator (`?:`)\n\nC++ provides the **conditional operator** (**`?:`**)\
    \ that can be used in place of an `if…else` statement. This can make your code\
    \ shorter and clearer. The conditional operator is C++’s only **ternary operator**\
    \ (i.e., an operator that takes three operands). Together, the operands and the\
    \ `?:` symbol form a **conditional expression.** For example, the statement\n\n\
    ```\ncout << (studentGrade >= 60 ? \"Passed\" : \"Failed\");\n```\n\nprints the\
    \ value of the conditional expression. The operand to the left of the `?` is a\
    \ condition. The second operand (between the `?` and `:`) is the value of the\
    \ conditional expression if the condition is true. The operand to the right of\
    \ the `:` is the value of the conditional expression if the condition is false.\
    \ The conditional expression in this statement evaluates to the string `\"Passed\"\
    ` if the condition\n\n```\nstudentGrade >= 60\n```\n\nis true and to the string\
    \ `\"Failed\"` if it’s false. Thus, this statement with the conditional operator\
    \ performs essentially the same function as the first `if…else` statement in Section\
    \ 3.4\\. The precedence of the conditional operator is low, so the entire conditional\
    \ expression is normally placed in parentheses.\n\nThe values in a conditional\
    \ expression also can be actions to execute. For example, the following conditional\
    \ expression also prints `\"Passed\"` or `\"Failed\"`:\n\n```\ngrade >= 60 ? cout\
    \ << \"Passed\" : cout << \"Failed\";\n```\n\nThe preceding is read, “If `grade`\
    \ is greater than or equal to `60`, then `cout << \"Passed\"`; otherwise, `cout\
    \ << \"Failed\"`.” This is comparable to an `if…else` statement. Conditional expressions\
    \ can appear in some program locations where `if…else` statements cannot.\n\n\
    ### 3.5 `while` Iteration Statement\n\nAn iteration statement allows you to specify\
    \ that a program should repeat an action while some condition remains true.\n\n\
    As an example of C++’s **`while`** **iteration statement**, consider a program\
    \ segment that finds the first power of 3 larger than 100\\. After the following\
    \ `while` statement executes, the variable `product` contains the result:\n\n\
    ```\nint product{3};\n\nwhile (product <= 100) {\n\n   product = 3 * product;\n\
    \n}\n```\n\nEach iteration of the `while` statement multiplies `product` by 3,\
    \ so `product` takes on the values 9, 27, 81 and 243 successively. When `product`\
    \ becomes 243, `product <= 100` becomes false. This terminates the iteration,\
    \ so the final value of `product` is 243\\. At this point, program execution continues\
    \ with the next statement after the `while` statement.\n\n##### UML Activity Diagram\
    \ for a `while` Statement\n\nThe UML activity diagram for the preceding `while`\
    \ statement introduces the UML’s **merge symbol**:\n\n![Images](Images/03unfig05.jpg)\n\
    \nThe UML represents both the merge symbol and the decision symbol as diamonds.\
    \ The merge symbol joins two flows of activity into one. In this diagram, the\
    \ merge symbol joins the transitions from the initial state and from the action\
    \ state, so they both flow into the decision that determines whether the loop\
    \ should begin (or continue) executing.\n\nYou can distinguish the decision and\
    \ merge symbols by the number of incoming and outgoing transition arrows. A decision\
    \ symbol has one transition arrow pointing to the diamond and two or more pointing\
    \ out from it to indicate possible transitions from that point. In addition, each\
    \ transition arrow pointing out of a decision symbol has a guard condition next\
    \ to it. A merge symbol has two or more transition arrows pointing to the diamond\
    \ and only one pointing from the diamond, to indicate multiple activity flows\
    \ merging to continue the activity. None of the transition arrows associated with\
    \ a merge symbol has a guard condition.\n\n### 3.6 Counter-Controlled Iteration\n\
    \nConsider the following problem statement:\n\n*A class of ten students took a\
    \ quiz. The grades (integers in the range 0–100) for this quiz are available to\
    \ you. Determine the class average on the quiz.*\n\nThe class average is equal\
    \ to the sum of the grades divided by the number of students. The program must\
    \ input each grade, keep track of the total of all grades entered, perform the\
    \ averaging calculation and print the result.\n\nWe use **counter-controlled iteration**\
    \ to input the grades one at a time. This technique uses a counter to control\
    \ the number of times a set of statements will execute. In this example, iteration\
    \ terminates when the counter exceeds 10.\n\n#### 3.6.1 Implementing Counter-Controlled\
    \ Iteration\n\nIn [Fig. 3.1](#ch03.xhtml_fig3_1), the `main` function implements\
    \ the class-averaging algorithm with counter-controlled iteration. It allows the\
    \ user to enter 10 grades, then calculates and displays the average.\n\n![Images](Images/03fig01.jpg)![Images](Images/03fig01a.jpg)\n\
    \n**Fig. 3.1** `S`olving the class-average problem using counter-controlled iteration.\
    \ (Part 1 of 2.)\n\n##### Local Variables in `main`"
