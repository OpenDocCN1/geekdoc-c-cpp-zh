    ### 3.8.3 Preventing Narrowing Conversions with C++11 List Initialization


    Consider the C++11 list initialization in line 10 of [Fig. 3.3]:


    ```

    int studentCounter{1};

    ```


    Prior to C++11, you would have written this as


    ```

    int studentCounter = 1;

    ```


    For fundamental-type variables, list-initialization syntax prevents `narrowing
    conversions` that could result in `data loss`. For example, the declaration


    ```

    int x = 12.7;

    ```


    attempts to assign the `double` value `12.7` to the `int` variable `x`. Here,
    C++ converts the `double` value to an `int` by truncating the floating-point part
    (`.7`). This is a narrowing conversion that loses data. So, this declaration assigns
    `12` to `x`. Compilers typically issue a warning for this, but still compile the
    code.


    However, using list initialization, as in


    ```

    int x{12.7};

    ```


    yields a `compilation error`, helping you avoid a potentially subtle logic error.
    If you specify a whole-number `double` value, like `12.0`, you’ll still get a
    compilation error. The initial-izer’s type (`double`), not it’s value (`12.0`),
    determines whether a compilation error occurs.


    The C++ standard document does not specify the wording of error messages. For
    the preceding declaration, Apple’s Xcode compiler gives the error


    ```

    Type ''double'' cannot be narrowed to ''int'' in initializer list

    ```


    Visual Studio gives the error


    ```

    conversion from ''double'' to ''int'' requires a narrowing conversion

    ```


    and GNU C++ gives the error


    ```

    type ''double'' cannot be narrowed to ''int'' in initializer list


    [-Wc++11-narrowing]

    ```


    We’ll discuss additional list-initializer features in later chapters.


    #### A Look Back at [Fig. 3.1]


    You might think that the following statement from [Fig. 3.1]:


    ```

    int average{total / 10}; // int division yields int result

    ```


    contains a narrowing conversion, but `total` and `10` are both `int` values, so
    the initializer value is an `int`. If in the preceding statement `total` were
    a `double` variable or if we used the `double` literal value `10.0` for the denominator,
    then the initializer value would have type `double` and the compiler would issue
    an error message for a narrowing conversion.


    ### 3.9 Compound Assignment Operators


    You can abbreviate the statement


    ```

    c = c + 3;

    ```


    with the `addition compound assignment operator`, `+=`, as


    ```

    c += 3;

    ```


    The `+=` operator adds the value of the expression on its right to the value of
    the variable on its left and stores the result in the variable on the left. Thus,
    the assignment expression `c += 3` adds `3` to `c`. The following table shows
    all the arithmetic compound assignment operators, sample expressions and explanations
    of what the operators do:


    ![Images](Images/f0091-01.jpg)


    Later, we’ll discuss other types of compound assignment operators.


    ### 3.10 Increment and Decrement Operators


    The following table summarizes C++’s two unary operators for adding 1 to or subtracting
    1 from the value of a numeric variable—these are the unary `increment operator`,
    `++`, and the unary `decrement operator`, `--`:


    ![Images](Images/f0091-02.jpg)


    An increment or decrement operator that’s prefixed to (placed before) a variable
    is referred to as the `prefix increment` or `prefix decrement operator`, respectively.
    An increment or decrement operator that’s postfixed to (placed after) a variable
    is referred to as the `postfix increment` or `postfix decrement operator`, respectively.


    Using the prefix increment (or decrement) operator to add 1 to (or subtract 1
    from) a variable `preincrements` (or `predecrements`).


    #### Prefix Increment vs. Postfix Increment


    [Figure 3.4] demonstrates the difference between the prefix increment and postfix
    versions of the `++` operator. The decrement operator (`--`) works similarly.


    ![Images](Images/03fig04.jpg)


    **Fig. 3.4** Prefix increment and postfix increment


    Line 8 initializes `c` to `5`, and line 9 outputs `c`’s initial value. Line 10
    outputs the value of the expression `c++`. This expression postincrements the
    variable `c`, so `c`’s original value (`5`) is output, then `c`’s value is incremented
    (to 6). Thus, line 10 outputs `c`’s initial value (`5`) again. Line 11 outputs
    `c`’s new value (`6`) to prove that the value was indeed incremented.


    Line 16 resets `c`’s value to `5`, and line 17 outputs `c`’s value. Line 18 outputs
    the value of the expression `++c`. This expression preincrements `c`, so its value
    is incremented; then the new value (`6`) is output. Line 19 outputs `c`’s value
    again to show that the value of `c` is still `6` after line 18 executes.


    #### Simplifying Statements with the Arithmetic Compound Assignment, Increment
    and Decrement Operators


    The arithmetic compound assignment operators and the increment and decrement operators
    can be used to simplify program statements. For example, the three assignment
    statements in [Fig. 3.3] (lines 21, 24 and 28)


    ```

    passes = passes + 1;


    failures = failures + 1;


    studentCounter = studentCounter + 1;

    ```


    can be written more concisely with compound assignment operators as


    ```

    passes += 1;


    failures += 1;


    studentCounter += 1;

    ```


    with prefix increment operators as


    ```

    ++passes;


    ++failures;


    ++studentCounter;

    ```


    or with postfix increment operators as


    ```

    passes++;


    failures++;


    studentCounter++;

    ```


    When incrementing or decrementing a variable in a statement by itself, the prefix
    increment and postfix increment forms have the same effect, and the prefix decrement
    and postfix decrement forms have the same effect. Only when a variable appears
    in the context of a larger expression does preincrementing or postincrementing
    the variable have a different effect (and similarly for predecrementing or postdecrementing).


    Attempting to use the increment or decrement operator on an expression other than
    one to which a value can be assigned is a syntax error. For example, writing `++(x
    + 1)` is a syntax error, because `(x + 1)` is not a variable.

