    ## 4.2. 在 GBH 内分泌模式后 E2/P4 比例增加中观察到的激素失调


    雌激素在生殖组织激素依赖功能的发病中起着关键作用。在啮动物中，激素失调导致的 E2/P4 比例持续增加被认为是激素性癌症的风险因素（Okono 等人，2010；Yoon
    等人，2010）。为了评估 GBH 的作用，我们试图评估年轻雌鼠各阶段的卵巢类固醇水平。暴露于 GBH 的动物在 4 月大显示周期异常，特征是雌期延长和发卵期缩短。E2
    和 P4 的血清浓度导致 E2/P4 比例增加，产生类似于高 E2 的状态。我们的发现与 Mansery 等人 (2019) 一致，他们在一项初步研究中报告没有


    ## 4.3. 发育暴露于 GBH 增加易感性


    如前所述， EDC 的发育重编程和激素环境的变化可能促进晚期疾病。根据在暴露于 GBH 的雌鼠中观察到的发育和内分泌干扰影响，我们评估了其对老年雌鼠肿瘤或肿瘤病变发育的影响。总存活率在对照组和
    GBH 组之间没有显著差异。暴露于 GBH 的子宫组织病学显示激素依赖性病变的发生率增加。这些病变包括良性、癌前和恶性肿瘤，以及肌瘤、腺体、子宫内增生和子宫平滑肌瘤。根据我们的结果，暴露于
    EDC 与子宫发育风险的增加有关，这在出生前暴露于 DES (Newbold 等人，1990) 和 BPA (Bowa 等人，2007) 的老年鼠子宫中被检测到。有趣的是，暴露于甘糖膦的雄鼠子宫中也报告腺增生发生率增加。总之，我们的发现表明，发育暴露于
    GBH 与激素干扰性肿瘤的易感性增加有关。


    如所述，在本研究中我们使用了甘糖膦配剂（Roundup），含有活性成分。其显示比 GBH 更强。


    ## 5. 结论


    总结来说，早期暴露于 GBH 干扰了 Hox10 的发育程序和 E2/P4 比例。需要进一步的研究确定人类和动物暴露的潜在机制。


