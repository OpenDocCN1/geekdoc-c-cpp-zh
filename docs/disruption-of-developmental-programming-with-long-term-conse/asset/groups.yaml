    The exposure to endocrine disruptors (EDCs) can disrupt normal reproductive development
    in a process known to be irreversible. Numerous studies show that exposure to
    EDCs found permanent, causing permanent alterations in the female reproductive
    tract, morphology, hormone levels and gene expression, which give rise to disease
    and cancer (Palmer et al., 2006; Schug et al., 2012; Wang et al., 2012).


    The potential of glyphosate and concluded that ''it is likely to be carcinogenic
    to humans'' (U.S. EPA, 2018). Differences over carcinogenicity are attributed
    to the toxic properties of the full forms (Porter et al., 2016; Tanaka et al.,
    2017; Vandenberg et al., 2017). These data suggest that glyphosate-mediated detoxification
    are not sufficient to eliminate the significance of human exposures to glyphosate
    (Vanderberg et al., 2019).


    In vitro studies have revealed that glyphosate promotes the elimination of endocrine
    disruptors (Savage et al., 2017; Thongsaka et al., 2013) and estrogen receptor
    (ERα) (Sritana et al., 2018). Similarly, by using an in vitro model to evaluate
    estrogenic activity, we demonstrated that glyphosate is able to mitigate the expression
    of estrogen-sensitive genes in rat (Varsay et al., 2017). We also showed that
    glyphosate exposure affect pre- and pubertal sexual maturation of male and female
    rats, with alterations in reproductive development and 17β-estosterone (Gomez
    et al., 2020). Endocrine-related effects in rodents include alterations of testicular
    function and morphology (Cassier-Meyer, 2014; Dellegrave et al., 2017), disruption
    of male gamogenesis (Dantario et al., 2010), and impaired reproductive function
    (Ingram et al., 2018; Gomez et al., 2019; Levisz et al., 2017; Mileis et al.,
    2020).


    ## 2. Materials and methods


    ### 2.1. Chemicals


    The GBH used in this study was Roundup Full, soluble in water contains 66.2% glyphosate
    sulfate salt, with an equivalent to 54% glyphosate acid. As many GBHs, this formula
    contains adjuvants and ingredients not specified in the herbicide label.


    ### 2.2. Animals


    All protocols used in this study were approved by the Institutional Ethics Committee
    of the School of Biology and Biochemistry at the National University of Litoral
    (UNL, San Fe, Argentina) and by the Ethics Committee of Laboratory Animals used
    by the U.S. National Academy of Sciences.


    Rats of Wistar-Dawley were bred at the Department of Human Physiology of the School
    of Biology and Biochemistry at the National University of Litoral (UNL, San Fe,
    Argentina). The rats used in the study (25±30 days old, weighing 200±20 g) were
    randomly assigned to five groups:

    - 1) control group receiving saline solution (n=8)

    - 2) group receiving GBH full diluted in saline (2 mg/kg body weight/day).


    Alters the expression of environmental molecules that regulate differentiation
    (Guerero Schimp et al., 2017). In addition, using estrogenic pregnancy treatment
    in ovariectomized mice, we detected that GBH exposure enhances the uterine sensitivity
    to E2 (Guerero Schimp et al., 2017). We suggest that these effects cause alterations
    of the uterine epithelium in later life. By using the same model of exposure,
    in this study we sought to evaluate:

    - i) short-term effects on developmental development of the uterus using GBH as
    a key molecule in utero;

    - ii) its effects on estrogen and ovarian steroid levels as possible promoters
    of tumorigenesis, and

    - iii) long-term adverse effects on the incidence of pregnancy preterm birth/neoplastic
    lesions in aged rats.


    Pups were obtained from timed-pregnant rats housed singly. After delivery (PND0),
    pups were weighed and cross-fed by mothers to ensure the use of siblings (Guerero
    Schimp et al., 2017). Each litter was then assigned to one of the following groups:

    - 1) control group receiving saline solution (n=8)

    - 2) group receiving GBH full/ diluted in saline (2 mg/kg body weight/day).


    Animals were administered via the recess of the neck from 48 h to PND8. Each day,
    a treatment solution was given by oral gavage The concentration of glyphosate
    acid and the body weight of the pups. The GBH used in this study is in the order
    of the magnitude of the effects reported in previous studies (U.S. EPA, 2017).
    In addition, the dose used is in the order of the magnitude of the glyphosate
    residue levels found in different environments in our country, such as: soil,
    open-reservoir water and test soybeans grown in (Testimon et al., 2013; Primonus
    et al., 2017).


    Hox10, a member of the Hox cluster, is highly and dynamically expressed in the
    uterus and endometrium. Hox10 is required for proper organization and growth of
    smooth muscle layers during uterine development (Everington et al., 2013) and
    it is essential for uterine development under endocrine disruptors (Dallegrave
    et al., 2015). Expression of GBH has been associated with defects in uterine agenesis
    and interference (Block et al., 2000). We have previously shown that GBH exposure
