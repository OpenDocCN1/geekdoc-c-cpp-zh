    ## 4.3. Developmental exposure to GBH increases susceptibility in adulthood


    As stated before, developmental reprogramming of exposure EDC and altered hormonal
    milieu can promote disorders later in life. Based on the developmental and endocrine-disrupting
    effects observed in female rats exposed to GBH, we evaluated the effects on the
    development of neoplastic or neoplastic lesions in aged female rats. Overall survival
    showed no significant difference between control and GBH groups. The histopathology
    of the uterus exposed to GBH showed an increased incidence of hormone-dependent
    lesions. These lesions included benign, preclinical and malignant tumors, as well
    as myroids, glands, endometrial hyperplasia and uterine leiomyoma. With our results,
    exposure to EDCs is associated with increased risk of uterine development, which
    was detected in the uterus of aged mice after prenatal exposure to DES (Newbold
    et al., 1990) and BPA (Bowa et al., 2007). Interestingly, an increased incidence
    of glandular hyperplasia was also reported in the uterus of male mice exposed
    to glyphosate. Together, our findings indicate that developmental exposure to
    GBH is associated with increased susceptibility to hormone-disrupting tumors.


    As previously mentioned, in this study we used a formulation of glyphosate (Round
    UP), containing active ingredients added to the herbicide. It has been shown more
    than that GBH, although under our experimental conditions.


    ## 5. Conclusions


    In summary, early exposure to GBH disrupted developmental programming of Hox10
    and E2/P4 ratio. Additional studies are needed to determine the potential mechanisms
    for human and animal exposures.


