    组蛋白翻译后修饰 (PTMs) 通过染色质重塑或通过有助于调节因子的调节来调节基因表达。染色质标记与转录沉默有关（Zhang 等人，2015）。若干报告表明两种组蛋白标记是互斥的，且一些
    ChIP 测序研究显示 H3K9me3 可参与基因发育（Liu 等人，2011；Hawkins 等人，2010）。鉴于两种组蛋白标记都与基因表现（表达）有关，有研究认为它们可能相互作用，作为细胞命运的调节因子。在这项研究中，我们发现
    GBH 组 H3K27me3 的异常丢失与基因表达相关。在 GBH 暴露后，Hox10a 位点内的所有位点的 H3K27me3 都被删除。有趣的是，子宫上皮和子腺中的某些位点保持正常。正常且伴随的背景产生
