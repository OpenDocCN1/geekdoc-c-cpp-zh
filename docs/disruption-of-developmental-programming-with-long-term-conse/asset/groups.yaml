    内分泌干扰物（EDCs）的暴露会干扰不可逆的生殖发育。许多研究表明，暴露于 EDC 会导致生殖道、形态、激素水平和基因表达的永久改变，从而引发疾病和癌症（Palmer
    et al., 2006; Schug et al., 2012; Wang et al., 2012）。


    草甘膦的潜力被认为“很可能对人类致癌”（U.S. EPA, 2018）。致癌性的差异归因于草甘膦形式的毒性（Porter et al., 2016; Tanaka
    et al., 2017）。这些数据表明，草甘膦介导的解毒不足以消除人类对草甘膦的暴露（Vanderberg et al., 2019）。


    体外研究显示草甘膦促进了内分泌干扰物（Savage et al., 2017; Thongsaka et al., 2013）和雌激素受体（ERα）（Sritana
    et al., 2018）。同样，通过体外模型评估雌激素活性，我们证明草甘膦能够减轻大鼠雌激素敏感基因的表达（Varsay et al., 2017）。我们还显示草甘膦暴露影响雄雌鼠的青春期性成熟，导致
    17β-雌酮的改变（Gomez et al., 2020）。啮齿类相关的效应包括睾功能和形态的改变（Cassier-Meyer, 2014; Dellegrave
    et al., 2017）、精子发生干扰（Dantario et al., 2010）以及生殖功能障碍（Ingram et al., 2018; Gomez
    et al., 2019; Levisz et al., 2017）。


    ## 2. 材料与方法


    ### 2.1. 化学品


    本研究使用的 GBH 是水溶性的 Roundup Full，含有 66.2% 的草甘膦硫酸盐，相当于 54% 的草甘膦酸。与许多 GBHs 一样，该配方含有除草剂标签上未指定的助剂。


    ### 2.2. 动物


    本研究使用的所有方案均已获得拉普托尔国立大学生物与生物科学学院（UNL, San Fe, Argentina）机构伦理委员会以及美国国家科学学院实验室动物伦理委员会的批准。


    Wistar-Dawley 大鼠在拉普托尔国立大学生物与生物科学学院（UNL, San Fe, Argentina）的人体生理系饲养。研究使用的大鼠（25±30天，体重200±20
    g）被随机分为五组：

    - 1）接受生理盐水的对照组（n=8）

    - 2）接受生理盐水稀释 GBH 的组（每天2 mg/kg体重）。


    改变调节分的环境分子的表达（Guerero Schimp et al., 2017）。此外，通过对去卵巢小鼠进行雌激素妊娠治疗，我们检测到 GBH 暴露增强了子宫对
    E2 的敏感性（Guerero Schimp et al., 2017）。我们认为这些效应会导致后期生活中子宫上皮的改变。通过使用相同的暴露模型，本研究旨在评估：

    - i) 使用 GBH 作为宫内关键分子对子宫发育的短期影响；

    - ii) 它对雌激素和卵巢类固醇水平作为肿瘤形成可能促进因素的影响；

    - iii) 对老年大鼠妊娠早产/肿瘤性病变发生率的长远不良影响。


    幼鼠来自单饲养的定时妊娠大鼠。出生后（PND0），对幼鼠进行体重并由母体交叉喂养以确保使用同胎（Guerero Schimp et al., 2017）。然后每个窝被分配到以下组之一：

    - 1）接受生理盐水的对照组（n=8）

    - 2）接受生理盐水稀释 GBH 的组（每天2 mg/kg体重）。


    动物从 48 小时到 PND8 通过颈部凹陷给药。每天通过口胃胃给药处理溶液，浓度取决于草甘膦酸浓度和幼鼠体重。本研究使用的 GBH 处于相当于以往研究报告的效应数量级（U.S.
    EPA, 2017）。此外，使用的剂量处于我国不同环境中发现的草甘膦残留水平数量级，例如：土壤、开放水库水和在……生长的测试大豆（Testimon et al.,
    2013; Primonus et al., 2017）。


    Hox10 是 Hox 簇的成员，在子宫和内膜中高水平且动态表达。Hox10 对于子宫发育过程中平肌层的良好组织和生长是必要的（Everington et
    al., 2013），并在内分泌干扰物下对子宫发育至关重要（Dallegrave et al., 2015）。GBH 的表达与子宫发育不全缺陷有关（Block
