    ## 文章信息


    ## 摘要


    处理编辑：Jose Luis Domingo 博士


    关键词：

    - Hox10a

    - 表观遗传重编程

    - 子宫发育

    - 内分泌干扰物


    糖醇酸基�hydraz类（GBHs）与对生殖器官的绪干扰作用有关。我们研究了暴露于 GBH 是否会影响子宫并产生长远后果。雌性幼从从出生后天（PND）开始接受车辆（对照组）或
    GBH（每天 2 mg 糖醇酸），直到子宫对内分泌干扰高度敏感的时期。我们观察到新生雌鼠（PND8）的子宫出现增生和水肿。DNA 甲基化、形态发生基因调节区域的
    H3K27me 富集以及血清孕酮（P4）下降，导致了经周期改变。暴露于 GBH 的成年雌鼠（PND 60）在出生时表现出导管增生和腺肿，阴道上皮减少，子宫发育期内
    Hox10 基因表达改变及高甲基甲基化增加，且小鼠水平的 E2/P4 血清比例升高。我们认为，子宫 Hox10a 的表观遗传重编程解释了 GBH 暴露大鼠中产生长远不良影响的可能机制。


    ## 1. 引言


    糖醇酸（N-磷酸甘酸）是市售广谱除草剂�hydraz类化合物（GBHs）的酯。目前，GBHs 因其使用以及对人类健康多样且广泛的影响引起了极大关注。糖醇酸及其代谢物已在清洁剂、土壤、水和空气等各种环境中中检测出（Bonminas
    et al., 2017; Primot et al., 2017; Ronco et al., 2016; Van Brogen et al., 2018），并在人类摄中发现（Riro
    and Onvestrous Ora and Diaz-Canal, 2017; Rodrigues and de Souza, 2016）。


    如今，糖醇酸的致癌潜力存在争议。国际癌症研究（ARC，世界卫生组织）认定糖醇酸为“可能的人致癌物”（2A）。这是基于对胰腺癌和胰腺岛细胞腺癌、血管瘤、管状癌和胃癌风险的病例流行病学研究的有限证据，但在其基因毒性和氧化应激方面有有力证据（ARC,
    2017）。然而，欧洲食品安全局（EFSA）认定糖醇酸“不太可能对人类产生致癌危害”（EFSA, 2015）。美国环保署（EPA）审查了


