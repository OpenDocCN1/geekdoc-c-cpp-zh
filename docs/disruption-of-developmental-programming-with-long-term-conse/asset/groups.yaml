    # 大鼠模型中暴露于糖醇酸基脂质对发育编程的干扰及其长远影响


    Marlise Guerrero Schimpf,b, María M. Milesia,b, María Victoria Zanardia,b Jorgelina
    Varayoua,b


    * * a 沿岸健康与环境研究所 (ISAL, UNL-CONCONICET), 生物与生物科学学院，拉普托尔国立大学，圣塔菲罗，阿根廷

