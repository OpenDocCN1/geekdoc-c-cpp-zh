    the course of experiment (8–10 a.m.). The estrus cycle length and percentage of
    time spent in estrus stages were evaluated. Blood from tail was collected in estral
    sinus in order for further hormone analysis. Serum levels were measured using
    the ultra-sensitive radioimmunoassay (Immotech, Beckman, Czech Republic) and enzyme-linked
    immunosunoassay (Adis Scientific, Inc., 104351). All samples were run in triplicate,
    following the manufacturer''s instructions. The E2/P4 ratio was calculated by
    dividing E2 (pg/ml) to P4 levels (ng/ml) from each animal.


