    ## 4.2. Hormone imbalance observed in increased E2/P4 ratio after endocrine mode
    of GBH


    Estrogens play a crucial role in the pathogenesis of hormone dependent functions
    of the reproductive tissue. In rodents, continuous increase in E2/P4 ratio due
    to hormone imbalance is considered a risk factor for hormonal cancers (Okono et
    al., 2010; Yoon et al., 2010). To evaluate the action of GBH, we sought to evaluate
    estrogen and ovarian steroid levels at each stage in young females. GBH-exposed
    animals displayed irregular estrous cycles at 4 months of age, characterized by
    increased duration of estrogen phase and decreased time in estrus. Serum concentrations
    of E2 and P4 led to an increase in the E2/P4 ratio, resulting in a similar state
    to that of high E2. Our findings are with Mansery et al. (2019) who reported in
