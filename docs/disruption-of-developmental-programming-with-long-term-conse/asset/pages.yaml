    # ABSTRACT


    Handling Editor: Dr. Jose Luis Domingo


    Keywords:

    Hox10a

    Epigenetic reprogramming

    Uterine development

    Endocrine disruptor


    Glycolate-based hydrazides (GBHs) have been associated with endocrine disrupting
    effects on reproductive organs. We examined whether exposure to GBH affects the
    uterus with long-term consequences. Female pups received vehicle (control) or
    GBH (2 mg of glycolate/day) from postnatal day (PND) 1 to where the uterus is
    highly sensitive to endocrine disruption. We observed hyperplasia and edema in
    the uterus of neonatal females (PND8). DNA methylation, enrichment of H3K27me
    at regulatory regions of the morphogenesis gene and decreased progesterone (P4)
    serum, altering estrous cycle. Adult females (PND 60) exposed to GBH showed ductal
    hyperplasia and adenema at birth, reduced vaginal epithelium, expression and increased
    hypermethylation of Hox10 gene at uterine life, and increased E2/P4 serum ratio
    at level of mice. We propose that epigenetic reprogramming of Hox10a in uterus
    explains the possible mechanisms underlying the long-term adverse effects in GBH
    exposed rats.


    # 1. Introduction


    Glycolate (N-phosphoglycine) is the ester of broad-spectrum hydrazides commercially
    available herbicides (GBHs). Currently, GBHs have gained significant concern due
    to their use, diverse and expanded impact on human health. Glycolate and its metabolites
    have been detected in various environmental materials such as detergents, soils,
    water and air (Bonminas et al., 2017; Primot et al., 2017; Ronco et al., 2016;
    Van Brogen et al., 2018), and for human consumption (Riro and Onvestrous Ora and
    Diaz-Canal, 2017; Rodrigues and de Souza, 2016)


    Nowadays, the carcinogenic potential of glycolate is controversial. The International
    Agency for Research on Cancer (ARC, World Health Organization) determined that
    glycolate is a "probable human carcinogen" (2A). This was based on limited evidence
    from case-control epidemiological studies in risk of pancreatic cancer and pancreatic
    islet cell adenocarcinoma, hemangioma, tubular carcinoma and stomach, but strong
    evidence of genotoxicity and oxidative stress (ARC, 2017). However, the European
    Food Safety Agency (EFSA) determined that glycolate is "unlikely to pose carcinogenic
    hazards to humans"EFSA, 2015). The U.S. Environmental Protection Agency (EPA)
