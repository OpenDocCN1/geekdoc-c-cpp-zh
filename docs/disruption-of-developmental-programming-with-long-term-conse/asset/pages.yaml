    # 2.8. Estrus cycle and hormone analysis


    From PND10 and 20 consecutive days, vaginal smears were collected from the animals
    according to the female status as described (Zanardi et al., 2020). To regulate
    variability, cycle status was measured by vaginal leakage at the same time of
    the day over the course of the experiment (8–10 a.m.). The estrus cycle length
    and percentage of time spent in estrus stages were evaluated. Blood from tail
    was collected in estral sinus in order for further hormone analysis. Serum levels
    were measured using the ultra-sensitive radioimmunoassay (Immotech, Beckman, Czech
    Republic, ELD4850) and enzyme-linked immunosunoassay Elgen4 kit (Adis Scientific,
    Inc., 1104351). All samples were run in triplicate, following the manufacturer''s
    instructions. The E2/P4 ratio was calculated by dividing E2 (pg/ml) to P4 levels
    (ng/ml) from each animal.


    # 2.9. Necropy


    Animals from the adult group were sacrificed by decapitation in the morning of
    the day 20 days after birth (PND0). In cases of possible suffering from the animal,
    the sacrifice was performed during the course of study according to ethical rules.
    In each case, organs were carefully examined for visible lesions. Other tissues
    collected at sacrifice were fixed in 10% (v/v) buffered formalin and embedded
    in paraffin study (morphohistology and immunohistochemistry analysis).


    # 2.10. Histological analysis


    All tissues collected were cut (5 µm thick) and stained with hematoxylin and eosin
    for microscopic examination. Tissue morphometry was performed on all samples on
    PND8 as previously described (Gourney Schmidt al., 2008). Specifically, images
