    # 4. Discussion


    In rodents, the myogenic development and differentiation of the reproductive tract
    persists and continues during the first postnatal weeks, hormonal cellular, and
    molecular mechanisms establish pathways that direct differentiation of the uterine
    epithelium. The study showed that the uterine development was disrupted (Yoshida
    et al., 2012).


    Incidence of developmental epithelium can cause permanent changes in the structure
    and function of tissues and profound impact on fertility. Our present study provides
    compelling evidence that transient disruption of the normal development by GB
    group has long-term consequences for reproductive health in female rats.


    # 4.1. Epigenetic regulation of the Hoxa10 locus is associated with GB induction
    of uterine hyperplasia


    In this study, we first to determine whether GB induces developmental reprogramming
    of uterine epithelium by short-term effects on morphology and epigenetic changes
    of the Hoxa10 locus. We found that the morphogenesis of the development is profoundly
    affected after exposure to GB. On PND210, the morphology and differentiation patterns
    of cells, including early and late growth, epithelial, and stromal mesenchymal
    cells were found in as.


