  md: '# 3.2. Mid-term: ovarian estrous levels and estrous cycle


    Alterations of estrous levels and estrous cycle could also be promoting factors
    of hormonal carcinogenesis (Yoshida et al. 2015). Serum ovarian hormone levels
    and estrous cycle duration of estrus phase were evaluated in control and GB-treated
    animals on PND210. Exposure to GB resulted in increased CON (28.9 ± 1.3 pg/ml;
    GB: 33.4 ± 3.2 pg/ml; p < 0.05 Mann-Whitney test) and noted decrease in perimeter
    of estrus (CON: 4.2 ± 0.4 days; GB: 3.8 ± 0.5 days; Mann-Whitney test). Alterations
    also led to a increase in E2/P4 ratio (CON: 2.64 ± 0.12; GB: 7.73 ± 0.4, p < 0.001
    Mann-Whitney test).


    # 3. Long-term effects: body weight and pre-neoplastic and neoplastic lesions


    All animals were constantly monitored during the experiment for body weight gain,
    behavior, and appearance time. Body weight of GB-treated animals was within 10%
    of birth to adulthood, showing no differences between groups (Table 3). All animals
    survived until the end of the study. However, at 6 months after birth (PND660),
    one of GB-treated animals (24%) died for necrosis at 18 months of age. In addition,
    two GB-treated animals were sacrificed at 17 months due to uterine bleeding or
    presence of macroscopic/multilocular lesions.


    # 3.3. Incidence of uterine pre-neoplastic and neoplastic lesions after GB exposure


    Considering that developing epithelium can cause disease and uterine hyperplasia
    may act as promoting factor of hormonal carcinogenesis, we evaluated the incidence
    of pre-neoplastic and neoplastic lesions in GB-treated animals on PND660 (Table
    4). The uterine epithelium showed squamous hyperplasia, glandular hyperplasia,
    and endometrial stromal hyperplasia were found at the same frequency in both groups
    (Data not show). The incidence of uterine lesions with glands, epithelium, and
    cells was significantly higher in the GB group (CON: 1/24, 4%; GB: 10/25, 40/10),
    although the increase in frequency was not statistically significant (p = 0.064;
    Table 2). And B-adenocarcinoma, characterized by invasion of the myometrium, was
    found in two GB-treated animals, while no such lesions were found at 6 months
    after birth (Table 3). The epithelium was morphologically composed of complex
    type and was found in the glandular and luminal


