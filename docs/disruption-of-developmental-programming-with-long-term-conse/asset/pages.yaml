    # 3. Results


    # 3.1. Short-term effects: alteration of developmental pregnancy


    In order to determine the short-term effects of early postnatal exposure to GBH,
    we evaluated uterine morphology in samples collected shortly after the exposure
    period (PND8). Result showed pronounced morphometric changes observed by a clear
