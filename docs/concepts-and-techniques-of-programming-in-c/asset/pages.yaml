  md: '# 1.6 PROBLEM SOLVING


    # 1.6.1 Problem Solving Methods


    The different types of problem solving methods are:


    +   1. Understand the problem

    2. Making the plan of solution

    3. Carrying out the plan

    4. Looking back, i.e., verifying


    # EXPLANATION:


    # 1. Understanding the Problem


    If a person does not understand the problem then he cannot solve it. And it is
    true that if the person understands the problem definitely he can solve it. To
    understand the problem one can extract the important features or part or points
    of the problem.


    # 2. Making a Plan for Solution


    Think about the principal part, i.e., unknown, data, conditions for finding the
    problem and hypothesis and conclusion to solve the solution of the problem. After
    identifying the principal part and understanding it one can find the facts related
    to the problem and refine the facts to get relevant similar to the given problem.
    Lastly, search another idea which is helpful for solving the problem in a better
    way. Even an incomplete idea should be considered. Go with the new situation and
    repeat the same process.


    # 3. Carrying out the Plan


    It means to continue the plan until you do not get the result.


    # 4. Looking Back, i.e., verifying


    It means reverse engineering to verify the solution process.


    # SUMMARY


    +   1. A computer is an electronic device or machine which can accept data as
    input and processes it to give expected output and store in a secondary unit permanently.

    2. The computer system which consists of different equipment or parts is called
    hardware.

    3. The computer program which tells the hardware what to do is called software.

    4. Application software is a computer program designed for end users is called
    application software, for example, Microsoft Office, Excel, Google Chrome, Mozilla
    Firefox, Skype and others.'
