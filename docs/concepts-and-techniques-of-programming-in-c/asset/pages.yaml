    # 7.2.7 Concepts of else-if Statement/Ladder


    The else-if statement is used to check the condition in sequential order, i.e.,
    one statement after another. When any condition among the list of conditions becomes
    true, it does not require to check the next condition. When the first condition
    becomes false, the it checks for all conditions one after one until it becomes
    true. When all conditions become false the else block is the default to execute.


    > The syntax of else-if statement is:

    if (condition1)

    Statement block1;

    else if(condition2)

    Statement block2;

    elelse if(condition-n)

    Statement block-n;

    else

    Default statement;

    Next statement;'
