    # File


    #  15.1 INTRODUCTION


    In console oriented programming every time beginner is given the input value and
    it display the output on the computer screen because when the power is turned
    off or when the program is closed its data is lost. In real-time storing of large
    amount of data, it is difficult to handle/maintain using console oriented programming.
    To solve that situation we can use the concept file. A file is a place on the
    computer hard drive where the set of related data is stored. The advantage of
    file is that loss data is not possible. Generally, in computer hard drive, all
    data is stored in binary file. Let''s see how data is stored in computer hard
    drive.


