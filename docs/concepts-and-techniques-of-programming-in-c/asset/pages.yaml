    \ functions. In the called function declared the third variable as z. First the\
    \ x value(2 ) is assigned to the third variable, i.e., memory of x becomes blank\
    \ value of y (3) is assigned to x, i.e., x becomes 3 and then y becomes blank.\
    \ Then z (2) is assigned to variable e.g. becomes 2. Finally x becomes 3 and y\
    \ becomes 2."
