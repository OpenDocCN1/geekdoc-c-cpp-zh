    # 8.2.5 Concepts for Loop


    For loop is similar to the while and do while loop. For loops are generally used
    when the set of statements which are to be executed a specific number of times,
    i.e., until condition does not become false.


    The syntax of loop is:


    ```

    for(initialization; condition; increment/decrement);

    {

    Statement block

    }

    ```


    EXPLANATION:

    The above declaration consists of three parts, i.e., initialization, condition
    and increment/decrement. In the initialization part, values are assigned to the
    variables and in the condition part, if the condition is true then statement block
    of the loop will be executed otherwise it will terminate. When the statement block
    of the loop is executed at first iteration, at that time program control moves
    to the increment part of the for loop. In the second iteration, the variable''s
    value increases and again the condition, if again becomes true then statement
    block of the loop is executed and it continues until the condition become true.'
