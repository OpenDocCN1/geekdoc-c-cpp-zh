    OCR (Optical Character Recognizer), OMR (Optical Mark Reader), MICR (Magnetic
    Ink Character Recognizer), BIOMETRIC sensors, Web Camera, Smart Card Reader, Graphics
    Tablets, Touch Screen, Joystick, Scanner, Pen Drive. Some of are are explained
    below.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_17_0.png)


    Fig. 1.1 Block diagram of a computer


    # (a) Keyboard


    The keyboard is the set of keys and it is one of the primary input devices used
    by computers. The keyboard design is same as typewriter keyboard which arranges
    letters and numbers in such way that it prevents type bar from getting jammed
    when typing quickly.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_17_1.png)


    Fig. 1.2 Block diagram of keyboard


    # (b) Pen Drive


    A pen drive or a USB flash drive is a portable data storage device. Pen drive
    is popular and familiar among the consumer because it is light, micro and handy
    and can be carried easily from one location to another and its storage capacity
    ranges from 1 GB to 32 GB or more which is used to contain music file, video,
    photo, document, etc.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_17_2.png)


    Fig. 1.3 Block diagram of pen drive'
