    # # Looping


    # ## 8.1 INTRODUCTION


    # ### 8.1.1 When is Looping Required?


    Loops are very useful and basic needs to programmers. When he/she wants to execute
    any block of statements repeatedly and can be controlled by giving the condition.
    The advantage of looping is that it saves time as well as writing the same programming
    code multiple times. Suppose beginner wants to write a C program to print your
    name and address 20 (or more) times. So, it creates headache for beginner to write
    20 printf statements to display the name and address. To solve this problem he
    tries to use looping In looping he uses any one among three looping statements
    (e.g., while, do and for) and a printf statement is used inside the loop to print
    the name and address 20 times.


    # ## 8.2 CONCEPT OF LOOPING


    The loop describes the process of executing a set of programming statements in
    the act of following their order until the condition of the loop is not reached
    for stopping. Alternatively, we can say that loop iterates the programming statements
    for a specific number of times. If the loop does not execute properly then it
    makes the computer slow and sometimes it may give infinite output. The looping
    of the program generally consists of two parts, i.e., looping body part and control
    statement. The basic work of control statement is to make a test for each condition
    at the beginning or at the end. When that condition becomes true then the set
    of statements executes for fixed number of times contained inside the curly braces.
    That set statements enclosed with the curly braces is called looping body part.
    The statements are examined before beginning or starting the execution of loop
    (or before entering into the loop) is called entry controlled'
