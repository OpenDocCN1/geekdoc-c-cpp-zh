  md: '# 34 Concepts and Techniques of Programming in C


    # 3.2.2 Program


    Program is the set of instructions.


    # 3.2.3 Software


    Software is the set of programs.


    # 3.2.4 High Level Language


    It is a machine independent language. High level languages are generally English-like
    language. It is easy to write and understand. Examples are FORTRAN, COBOL, BASIC,
    C, C++, Java, C#, small talk, etc.


    # 3.2.5 Low Level Programming Languages


    Machine languages and assembly level languages are low level programming languages.
    Machine level language means binary languages, i.e., 0 and 1 that the computer
    understands. Writing machine level code is difficult because it is not easy to
    write programs using binary code.


    Assembly level language is the modified version of machine level language. In
    assembly level language instructions are written in English like words ADD, MOV
    and SUB, etc. It is easy to write and understand assembly level language.


    # 3.2.6 Compiler


    A compiler is a system software which is used to translate the entire program
    written in high level language into machine language. The basic work of a compiler
    is detecting the syntax errors in the entire program if any; otherwise it translates
    into object file. When compiling the entire program its runtime increases and
    its execution speed slows down. Because the compiler occupies large amounts of
    memory space it reads the entire program at a time and converts it into the machine
    code only once. If a compiler runs on a computer and produces the machine code
    for the same computer then it is called a self compiler. If a compiler runs on
    a computer and produces the machine code for some other computer then that is
    called a cross compiler.


    # 3.2.7 Interpreter


    The interpreter is the system software which is used to execute the entire programming
    statements by interpreting line by line. The interpreter does not check the error
    in the entire program once at a time but it would interpret line by line multiple
    times. We can again say that it is easy to write and translates it into machine
    code and executes it. Then it reads next statement of the program and translates
    it to machine code and executes until it reaches the end of the program.'
