  md: "# 210 Concepts and Techniques of Programming in C\n\nThe goto statements needs\
    \ a label in order to search the location where the branching is to be made. A\
    \ label is a variable and it must be followed by a colon. The label can be placed\
    \ in any position in the program. Basically, it may be placed before the goto\
    \ label statement or after the goto label statements. When the label is placed\
    \ before the goto label statement then loop will be generated and the set of statements\
    \ will be executed repeatedly. Such jump is called a backward jump. If the label\
    \ is placed after the goto statement then some statements will be skipped and\
    \ the jump is known as forward jump.\n\nForward jump\ngoto label;\nblock of statements;\n\
    label:\nstatement-1;\n\nBackward jump\nlabel:\nstatement-1;\nblock of statements;\n\
    goto label;\n\n![](img/15f2d3c4e623a0624f0481e94908bbcb_225_0.png)\n\nIn case\
    \ of forward jump, the cursor directly comes to statement-1 after goto label statement\
    \ and skips the block of statements. In case of backward jump, statement-1 and\
    \ block of statements will be executed repeatedly.\n\n> TIPS TO REMEMBER\\Do not\
    \ use goto statement in programming. It can be used if any program is difficult\
    \ to debug.\n\n# Q2 C Program to Display the Numbers from 1 to 15 using goto Statement.\n\
    \nSolution:\n\n********************************************************************\n\
    FILE NAME: unc2c\nAUTHOR DETAILS: Mr. x, 1ST SEM, COMP.SC6 ENGG., ABC COLLEGE\
    \ OF ENGG.\nDATE OF PROGRAM EXECUTION: 5/8/2015\nNAME OF THE PROGRAM: c program\
    \ to display the numbers from 1 to 15 using\ngoto statement\n********************************************************************\n\
    \n```\n#include<stdio.h>\nvoid main(void)\n{\n    int x=0;\n    y:\n    x++;\n\
    \    printf(\"%d\\t\",x);\n    if(x<=15)\n        goto y;\n}\n```"
