    # 4.6.1 Numeric Constant


    (A) Integer Constant


    Integer constants are constants which do not have any decimal part/fractional
    part, i.e., (.). There are three types of integer constants, i.e., decimal integer
    constants, octal integer constants, hexadecimal integer constants.'
