    # # Function


    # ## 10.1 INTRODUCTION


    When a person faces a complex problem then to solve that problem is not an easy
    task immediately. It takes some time to solve it. Then one of the easiest methods
    to solve that problem is divide and conquer principle. This principle divides
    the logic of the problem into smaller problems and later then adds these solutions
    of smaller problems to get the final solution. Like that in programming concept,
    a complex program is divided into different sub-programs and then each sub-program
    is executed separate and sends the result to the calling function. Such seperate
    parts of sub-programs is called subroutine or function or user-defined function
    or module. Thus, a function contains block of statements that does a particular
    work/task. A function is also called black box because all the inner operations
    inside the user-defined function are invisible to the rest of the program and
    return the value to the calling function placed inside the main function. From
    the above statements we can differentiate monolithic programming with modular
    programming.


    # ### 10.1.1 Monolithic Program Vs. Modular Program


    **In monolithic programming** instead of dividing a larger program into smaller
    programs, a single function contains a larger program. It is difficult to maintain
    the programming code when program code increases.


    The disadvantages are:


    +   1. It is difficult to detect the syntax error because program size is bigger.

    2. It is difficult to maintain.

    3. The programming code cannot be reused further.


    **In modular programming** the larger program or software is divided into sub-parts
    called modules. The programmer can change, modify or remove some of the programming'
