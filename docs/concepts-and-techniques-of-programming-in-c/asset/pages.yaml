    # SUMMARY


    +   1. A function is a self-contained block of statements that performs a particular
    task.

    2. There are two types of function: library function and user-defined function.

    3. Examples of library functions are sqrt, printf, scanf and example of user defined
    functions are main and any function created by user.

    4. There are three basic things a programmer should know before using the user-defined
    function. These are function declaration, function call and function definition.

    5. Function declaration is also known as prototyping.

    6. Function prototyping gives the information to the C compiler about the function
    name, return type and list of parameters.

    7. In function call we pass the values.

    8. In function definition we define our logic of the program and the value should
    return to the calling function.

    9. The values used in function call are actual parameters and the variables used
    in function header of the user defined function are formal parameter.

    10. Local variables are declared inside the function, i.e, it may be placed in
    the main function or any user defined functions. Local variables declared inside
    the function are not used by other functions. But once we declare the variable
    global then any function can use the same variable in multiple functions.

    11. In pass by value, values are passed from calling function to called function.
    Any changes made at the called function do not affect the calling function.

    12. In pass by reference instead of passing values address of variables are passed
    from calling function to called function. Any changes made at called function
    affect the calling function.'
