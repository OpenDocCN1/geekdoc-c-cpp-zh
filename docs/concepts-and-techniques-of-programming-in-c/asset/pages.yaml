  md: '# 278 Concepts and Techniques of Programming in C


    > TIPS TO REMEMBER

    When the array is declared the elements of the array contain garbage values at
    that time.

    Size used in array may be a numeric constant or a symbolic constant.


    # 11.2.2 One-Dimensional Array Initialization


    The programmer can assign values to an array and it is called array initialization.

    Array initialization can be done in two ways: at compile time initialization and
    runtime initialization.

    Compile time initialization is simple, like initialization of time to normal values.

    But in runtime initialization the programmer initializes the array.


    The syntax of one-dimensional array initialization/compile time initialization
    is:


    ```

    datatype array_name[size]=value1,value2----valueN;

    ```


    Example 2:


    ```

    int marks[4]={40,45,50,55};

    ```


    EXPLANATION:


    This declaration tells that the variable marks as an array of size 4 and thus
    the values 40, 45, 50, 55 are stored in each variable or an array element. Let''s
    see how the initialized values are stored in consecutive memory location of array
    marks. Suppose the base address of array is int100 then each location will take
    2 bytes of memory. Because array name is of int type which size 2 bytes. So memory
    addresses are 100, 102, 104, 106.


    | marks[0] | marks[1] | marks[2] | marks[3] |

    | --- | --- | --- | --- |

    | 40 | 45 | 50 | 55 |

    | 100 | 102 | 104 | 106 |


    Example 3:


    ```

    int marks[4]={40,45};

    ```


    EXPLANATION:


    In the above example marks creates 4 memory locations. But two values are initialized.
    So the first elements are stored in the first memory locations and the second
    element is stored in the second memory locations and the remaining values are
    stored in other memory locations. Third memory and fourth memory locations will
    automatically store the value zero. Let us see the above example in tabular form.'
