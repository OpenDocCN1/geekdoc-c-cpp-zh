    +   1. Loops are used when a part of the program is executed several times.

    2. In while loop condition is tested before entering the loop. When the condition
    becomes false at the starting stage then the loop statements are not executed.
    It is called entry-control loop.

    3. In while loop condition is tested at the end of the loop. When the condition
    becomes false the statements are executed at least once. It is called exit-control
    loop.

    4. The for loop consists of initialization, test condition and increment/decrement
    in a single statement. So it is more preferable than while and do loops.


