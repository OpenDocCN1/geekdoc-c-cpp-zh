    # 11.4 THREE-DIMENSIONAL ARRAYS (3D-ARRAY)


    We studied in the previous section that a two-dimensional array is an array of
    array. A three-dimensional array is nothing but a collection of two-dimensional
    arrays. We can alternatively say that a three-dimensional array is an array of
    array. The 3-D array consists of three subscripts, first subscript specifies the
    number of matrix and second for row and third for column.


    # 11.4.1 Declaration of Three-Dimensional Arrays


    ```

    The syntax of three dimensional arrays

    Data_type array_name[table_number][row][column];

    ```


    This syntax described that the first subscript of the array contains number of
    tables and second number of rows and third number of column.


    Example:

    int a[3][2][2];


    EXPLANATION:

    Here it specified that is the data type, a is the name of the array, inside the
    first subscript 3 is the number of tables, second 2 is the number of rows, third
    2 is the number of columns. This array contains 12 elements and the number of
    elements is calculated by multiplying size inside each subscript. Therefore, size
    of array a is: 3*2*2=12.


    # 11.4.2 Initialization of Three-Dimensional Array


    Assigning values to a three-dimensional array is called initialization of the
    three-dimension array.'
