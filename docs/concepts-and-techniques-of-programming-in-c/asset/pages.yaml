  md: '# What are the Major Areas Arrays that can be Implemented?


    Solution:

    Arrays can be implemented when large number of data of same type are required
    to store. Suppose examples: 1) The customer name and their account details e.g.
    account no, account type and contact mobile phone numbers stored in a bank. 2)
    The list of employees working in a particular branch. 4) The temperature recorded
    in different place of India and abroad in daily, monthly and yearly. 5) The rain
    recorded data in different centers in India or abroad daily, monthly, yearly by
    metrological dept.


    Instead of storing series of values in array we can also store tables of data
    in two, three and more dimensions. So the array can be different types. They are


    +   (a) One-dimensional array

    (b) Two-dimensional array

    (c) Three-dimensional arrays (3-D Array)


    # 11.2 ONE-DIMENSIONAL ARRAY


    # 11.2.1 Declaration of One-Dimensional Array


    ```

    The syntax of one-dimensional array is:

    datatype variable_name[size];

    ```


    EXPLANATION:

    In the above syntax data type determines the type of elements/values that the
    array will store. It will be integer, float, char or double type. The variable_name
    is the name of the array and last size specifies the maximum number of elements
    that the array can store.


    Example 1:

    int marks[50];


    EXPLANATION:

    This declaration specifies that marks variable stores 50 student''s marks of a
    particular subject. The individual element/value of marks is called array elements,
    e.g., marks[0] will store one values and marks[1] stores another values till marks[49].


    Here ints specifies type of the array, marks is the name of the array, [50] represents
    the size of the array is 50. The symbol square bracket [] used in array is called
    indices or subscript.'
