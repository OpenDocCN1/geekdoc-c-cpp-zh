    # 13.5 ACCESSING A VARIABLE BY USING THE POINTER CONCEPT


    To access the variable''s value through pointer concept then the programmer should
    use the operator asterisk (*).The asterisk is usually known as indirection operator.
    Another name of the indirection operator is dereferencing operator.


    # Q3. Example of Dereferencing Pointer.


    Solution:


    ```

    ************************************************

    FILE NAME: pointer3.c

    AUTHOR DETAILS: Mr. x, 1ST SEM, COMP.SC& ENGG., ABC COLLEGE OF ENGG.

    DATE OF PROGRAM EXECUTION: 10/8/2015

    NAME OF THE PROGRAM: Example of dereferencing pointer.

    ************************************************

    ```


    ```

    #include<stdio.h>

    void main(void) {

    int x=5;

    int *y;

    y=\&x;

    printf("value of x is:%d\n", x);

    printf("value of x is:%d\n", *x);

    printf("value of x is:%d\n", (*x));

    printf("value of x is:%d\n", *y);

    }

    ```


    Output:

    Value of x is: 5

    Value of x is: 5

    Value of x is: 5


    Value of x is: 5


    # EXPLANATION:


    From the above printf statements in the program that prints the value of x in
    different ways. First is printing the value of variable x then second, third,
    fourth printf statements are the same for printing the value of x through pointer
    concept.'
