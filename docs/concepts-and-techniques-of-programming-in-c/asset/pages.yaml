    \ on the place of declaration: (a) local variable and (b) global variable\n\n\
    # 10.9.1 Local Variable\n\nInternal/Local variables are those which are declared\
    \ within a particular function. Their scope is only within the function in which\
    \ they are declared. If the variable is declared within the main function then\
    \ variable is local to main function. If the variable is declared with the particular\
    \ user defined function created by the programmer then variable is local to user\
    \ defined function. The local variables cannot be accessed outside the function.\
    \ The local variables by default are initialized to garbage value.\n\n/Example\
    \ of Local Variable*/\n\n```\n#include <stdio.h>\nvoid main(void)\n{\n    int\
    \ x,y,z; /*x,y,z are local variables*/\n    x=5;\n    y=10;\n    z=x+y;\n    printf(\"\
