  md: '# Decision Making Statements

    (Conditional Statements)


    # 7.1 INTRODUCTION


    When a beginner starts writing a C program, he tries to write the programming
    statements which are generally executed in one sentence after another because
    he /she does not know about selection or looping statements and these programming
    sentences are called sequential programming. But practically all real-time programs
    are not always executed in sequential order. There are some programming statements
    which require to give condition. These statements are called decision making statements
    or selection statements or branching statements or conditional statements. And
    there are some other programming statements called iteration statements or looping
    statements. The statements which require to be executed a number of times and
    these statements are going examples of conditional statements are: / if the weather
    is sunny then probably T20 match may be played otherwise or it will be cancelled.
    Other condition is, if the bowler fult then it may be six/four otherwise he may
    be out.


    There are three selection statements present in C programming. They are: 1) if
    statement, 2) switch statement, 3) conditional operator.


    In the above decision making or selection statements, if the statement is a two-way
    branching statement whereas switch statement is a multiway branching statement.
    Another decision making statement named conditional operator is explained in chapter
    on operator.


    # TIPS TO REMEMBER


    From the above statements we conclude that decision making statements mean that
    it is a subset of control statements which decide some statements are going to
    execute based on condition and other statements are going to execute based on
    other condition.


    Let''s discuss one of the decision statements, i.e., if statements first.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '124 Concepts and Techniques of Programming in C


    # 7.2 if STATEMENTS


    The if statements are broadly categorized into different forms; e.g.


    +   (a) simple if statement,

    (b) if---else statement,

    (c) nested if----else statement,

    (d) else---if statement.


    # BRIEF DESCRIPTION OF IF STATEMENT


    # 7.2.1 Concepts of Simple If Statement


    The simple statement is a decision making or selection statement which is used
    to make a test for each/individual/separate condition. If the condition becomes
    true then the set of statement block inside the curly braces will be executed.
    If the condition does not become true then the statement block will not execute
    and the control will jump (move) to the next statements of if condition. If the
    statement block contains single statement then it is mandatory to give curly braces,
    it is optional, e.g., you may give curly braces or not may. If the statement block
    contains multiline statements then it is compulsory to use the curly brace. Let''s
    see the different forms of simple if statements.


    ```

    The syntax of if statement is

    if (condition)

    {

    Set of statement block;

    next statement;

    ```


    ```

    The other syntax of if statement is:

    if(condition)

    statement1;

    Or

    if(condition)

    {

    statement1;

    }

    ```


    TIPS TO REMEMBER ABOUT IF STATEMENT

    When the condition of if statement becomes true then both the statement block
    as well as next statements are executed in sequential manner.'
