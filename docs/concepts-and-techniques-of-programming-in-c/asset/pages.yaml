  md: '# (c) Scanner


    A scanner is a device used for capturing the images from photographic prints,
    magazine pages, answer sheet of exams and other sources for computer editing and
    display. The scanner comes in hand-held, feed-in types and for scanning color
    or black and white. High resolution scanners give high quality output.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_18_0.png)


    Fig. 1.4 Block diagram of scanner


    # (d) Mouse


    It is an input device used to control the movement of insertion point on the computer
    screen.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_18_1.png)


    Fig. 1.5 Block diagram of mouse


    # 1.2.2 Storage Unit


    The storage unit consists of two parts, i.e., secondary memory and primary memory.
    The secondary memory is also known as auxiliary memory, auxiliary storage, secondary
    storage or external memory. It is a non-volatile memory, i.e., when power is off
    it does not lose its data. The examples are floppy disk and hard disk. The floppy
    disk is an oxide-coated plastic piece that is used to store data as magnetic sport.
    In hard disk it is made of a stack of rotating disks platters. The data is recorded
    in the series of tracks called sectors.


    The primary memory is volatile in nature, i.e., when power is turned off all the
    data is lost. The alternative names of primary memory are primary storage or main
    memory. The examples of primary memory are RAM, ROM, and Cache Memory.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 4 Concepts and Techniques of Programming in C


    # 1.2.3 Central Processing Unit (CPU)


    The CPU is the heart of a computer which contains electronic circuits that cause
    the computer to follow instructions from ROM or RAM. The CPU consists of three
    parts: a) arithmetic unit, and b) control unit.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_19_0.png)


    # (a) Arithmetic Logic Unit (ALU)


    The ALU is a part of CPU which performs arithmetic and logic operations on data
    which is retrieved from the storage unit. After processing the operation the result
    is stored in the storage unit.


    # (b) Control Unit (CU)


    The control unit (CU) acts as a supervisor and its role is coordinating the different
    operations using timing diagram. The control unit determines the sequence of instructions
    and program execution.


    # 1.2.4 Output Device


    The output device is used to display the message or information on the computer
    screen. The examples of output devices are Monitor/VDU, LED/LCD screen, printers
    (inkjet/bubble jet printer, laser printer), plotter, and speaker. Some of these
    are explained below.


    # (a) Monitor


    It is an electronic device used for displaying picture on computer screen.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_19_1.png)


    # (b) Printer


    Printer is a device which accepts inputs from computer in the form of text and
    graphics and transfers the information on paper. Printers vary in speed, size
    and cost.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The printers are categorised into two types: one is impact printer and the
    other is non-impact printer. The impact printer works an automatic typewriter
    with a key striking an inked impression on the paper for each printed character,
    for example, a dot matrix printer. The non-impact printers are jet printers which
    spray ink from an ink reflected from a mirror to attracted ink (tonner) to selected
    printer area on the sheet rolls a drum. The example of non-impact printer is laser
    printer.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_20_0.png)


    Fig. 18 Shows the block diagram of printer


    # 1.3 BITS AND BYTES


    The following are memory related terms.


    +   * Bit

    Bit stands for binary digits and it is the smallest unit of data in a computer
    memory. A bit holds the binary value, i.e., either 0 or 1. Binary means can hold
    two logical states, i.e., either true or false, either on or off. Hard disk the
    binary value reflects when the bit is on in the magnetic or off not in the magnetic.


    +   * Byte

    Byte consists of eight binary digits, i.e., it consists of eight 0 or 1 combinations
    .In byte the values of byte is stored on the computer hard drive.


    +   * Nibble

    The combination of four (4) bits is called nibble.


    +   * KB (Kilobyte)

    A kiloby (KB) consists of 1024 bytes.


    +   * MB (Megabyte)

    A megabyte (MB) consists of 1024 kilobyte (KB).


    +   * GB (Gigabyte)

    A gigabyte consists of 1024 megabyte (MB).


    +   * TB (Terabyte)

    T terabyte consists of 1024 gigabytes.


    +   * PB (Pet byte)

    A pet byte consists of 1024 terabytes.


    +   * EB (Exabyte)

    An exabyte consists of 1024 pet bytes.


    +   * ZB (Zeta byte)

    A zeta byte consists of 1024 exabytes.


    +   * YB (Yotta byte)

    A yotta byte consists of 1024 zeta bytes.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 6 Concepts and Techniques of Programming in


    # 1.4 MEMORY


    The computer memory is like a human brain. Its work is to store the data and instructions.
    It is the storage space in a computer where data is processed and instructions
    required for processing are stored. The memory unit consists of a large number
    of small memory units called memory cells. Each cell or location has specific
    address which varies from 0 to memory minus one. If the computer has 64k words,
    then the memory unit has 64*1024=65536 memory cells. The address of memory cells
    varies from 0 to 65535. There are three types of memory:


    +   1. Primary memory/main memory

    2. Cache memory

    3. Secondary memory


    # EXPLANATION:


    # 1.4.1 Primary Memory/Main Memory


    The primary memory holds the instructions and data on the computer when it is
    working. It limited capacity to hold the data and when power is switched off all
    the data is lost. The primary memory is made of semiconductor device. The primary
    memory is again divided into two types, i.e., RAM, and ROM.


    # 1.4.1.1 RAM (Random Access Memory)


    RAM stands for Random Access Memory. It is a temporary memory area/place in a
    computer where application programs, operating system, data are kept, so that
    they can reach to the processor quickly. RAM reads and writes data much faster
    than other storage devices like hard disk drive, CD-ROM and floppy disk. In RAM,
    data stays there until the computer is working and when the computer is turned
    off all data in RAM is lost. When we turn on the computer again, operating system,
    data and other files are loaded into the RAM from the hard drive.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_21_0.png)


    Fig. 1.9 Block diagram of a RAM


    # 1.4.1.2 ROM (Read Only Memory)


    ROM stands for Read Only Memory. It is a non-volatile and permanent memory. Nonvolatile
    means when power is off data is not lost. ROM contains the programming code and
    software instructions which starts the computer. It is helpful to booting.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 1.4.2 Cache Memory


    Cache memory is a memory which is used for retrieving data from memory faster.
    It is placed between the CPU and the main memory. Without cache memory when CPU
    requests data to memory then it sends back the result by system bus to CPU. If
    the same data is accessed multiple times then cache memory stores that frequently
    used data. It responds faster to CPU.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_22_0.png)


    # 1.4.3 Secondary Memory


    Secondary memory is the permanent storage memory, i.e., it is a non-volatile memory.
    It is the slowest and cheapest form of memory. The CPU cannot directly access
    the secondary memory. First the required data accessed by CPU is copied to primary
    memory, i.e., RAM, ROM and then CPU uses it. The examples of secondary memories
    are hard disk, floppy disk, CD, CDROM and magnetic tape.


    # 1.4.1 Hard Disk


    Hard disk is also known as disk drive, hard drive or hard disk drive. It is a
    non-volatile hardware device that stores and retrieves the data permanently. For
    desktop the size of hard disk is 3.5” and for laptop the size is 2.5”. A hard
    drive contains of one or more platters to which data is written using a magnetic
    head.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_22_1.png)


    # 1.4.3.2 Floppy Disk


    A floppy disk consists of a thin, flexible magnetic disk sealed in a square plastic
    carrier. To use the floppy disk the computer system should have a floppy disk.
    It is used to take the software, transfer files and create back-up copies of the
    data.


    # 1.4.3.3 CD


    CD (compact disk) is a flat, round, small, portable, round medium made of molded
    polymer for electronic recording, storing and playing audio, video, text and other
    information in digital form.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_22_2.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 8 Concepts and Techniques of Programming in C


    # 1.4.3.4 CD-ROM


    CD-ROM stands for compact disk-read only memory is an optical disk which contains
    audio or software data whose memory is read only.


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_23_0.png)


    # 1.5 NUMBER SYSTEM REPRESENTATION


    # 1.5.1 Decimal Representation


    In our daily life we use the arithmetic operations we use the decimal number system.
    The decimal number system uses ten digits from 0 to 9 and the coefficients are
    multiplied by power of 10. Suppose the decimal number is 125 then it represents
    as one hundred 2 tens plus 5. The thousand, hundred, ten, units are power of 10
    multiplied by the position of the coefficients. Precisely, this 125 number is:
    1*10²+2*10¹+5*10⁰.


    To form a decimal number system there are 1''s column, 10''s form, 100''s form
    and so on. The tabular form of decimal system is:


    | 10⁵ | 10⁴ | 10³ | 10² | 10¹ | 10⁰ |

    |---|---|---|---|---||

    | 100000 | 10000 | 1000 | 100 | 10 | 1 |


    Again to represent the number 201 in base 10 we know that the position of 1 is
    1''s column, the position of 0''s column and position of 2 is 100''s column. The
    tabular form of 201 whose base 10 is given below.


    | 10² | 10¹ | 10⁰ |

