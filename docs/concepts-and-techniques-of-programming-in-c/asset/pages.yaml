  md: '# 2.2 FLOWCH


    A flowchart is a diagrammatic/graphical representation of algorithm and it describes
    the flow of the solution process. The solution process works by breaking up the
    problem into smaller steps or sub/problems and binds them to describe the flow.
    The last step of a flowchart gives the solution. Each step of the solution process
    is represented by different symbols and contains the description of the processing
    steps. The flowchart symbols are connected with arrow symbols displaying the process
    flow direction. A flowchart shows the flow of data in a process and its operations
    in details by a pictorial format. A flowchart can be called to drawing the blueprint
    of the building. Flowcharts are used in designing, analyzing, documenting a process
    or the program in various fields.


    # When Flow Chart is Required?


    In writing a small program if its logic is simple then flowchart is not required.
    But in real-time problem, e.g., the project done by company then flowchart is
    necessary. Flowchart is briefly described as:


    +   1. To plan the beginning of a new project.

    2. Flowchart gives a clear understanding to the team members of the project to
    identify the input and output collection to increase the efficiency of the project.

    3. It is useful for understanding the logic of the process.


    # 2.2.1 Advantages of Flowchart


    +   1. Effective Analysis: Using flowchart, problem can be analyzed in an efficient
    way.

    2. Communication: It means flowcharts are best way of representing the logic of
    a program.

    3. Proper Documentation: Program flowcharts serve as documentation of the program
    which is required for various purposes.

    4. Efficient Coding: During systems analysis and program development phase, flowchart
    plays the role of a guide or blueprint.

    5. Proper Debugging: It helps in debugging the process.

    6. Efficient Program Maintenance: The maintenance of operating program becomes
    easy using the flowchart.


    # 2.2.2 Disadvantages of Flowcharts


    There are a few disadvantages of using flowcharts:


    +   1. Complex Logic: When the program logic becomes complicated, then the flowchart
    becomes complex and clumsy.'
