  md: '# 46 Concepts and Techniques of Programming in C


    # 1. Source Program


    While writing a C program language used in the editor is called the source program
    (code) and after writing it, again it is stored as x.c. Then it is further expanded
    by the preprocessor direct, e.g., #include and store in the intermediate code
    with the file extension. i example: x.i. The expanded source program x.i is the
    C language. The extension .i varies from compiler to compiler.


    # 2. Role of Complier


    The compiler then finds the syntax error, i.e., comma (,), semicolon (;) etc,
    of the expanded source code. If the expanded source code/program is an error-free
    program the role of the compiler is to convert the expanded source program into
    assembly programming language. The assembly programming language is stored with
    an extension .asm in the file e.g. x.i is converted into x.asm.


    # 3. Role of Assembler


    The assembler converts the source code x.asm into x.obj file. The object file
    is the combination of machine instruction, data and information and it is required
    to place proper place of the memory.

    The format of object file is


    # Table 3.2 Format of object file


    | Object file header | Text segment | Data segment | Relocation information |
    Symbol table | Dubbing information |

    | --- | --- | --- | --- | --- | --- |


    The object file header describes the size and position of the other pieces of
    the file. Text segment holds the machine instructions and it is same as expanded
    source program. Data segment holds binary representation of data in assembly file.
    Relocation information identifies instructions and data that depend on absolute
    addresses. Symbol table associates addresses with external labels and lists unresolved
    references.


    # 4. Role of Linker


    The linker links the object code with library function to form each file. Generally,
    the linker detects the errors like miss spelled library function name in the source
    program. If the linker does not find the error it searches the memory locations
    that code from each module will occupy and relocates its instructions by adjusting
