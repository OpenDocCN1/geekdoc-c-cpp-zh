  md: '# Computer Fundamentals


    # 1.1 INTRODUCTION


    A computer is an electronic device or machine (consisting of monitor, central
    processing unit, keyboard, mouse, printer and modem) which can accept data as
    input and processes it to give expected output and store in a secondary storage
    unit permanently. Processing of input data is done by software applied on hardware.
    The computer has three main parts or components, e.g., hardware, software and
    people. The computer system which consists of different equipment or parts is
    called hardware, for example, keyboard, mouse, monitor, hard disk, mother board
    and disk drives. The computer program which tells what to do is called software.
    The software is again divided into two types, e.g., system software and application
    software. The system software is a computer program designed to run hardware and
    application programs. It is the interface between the hardware and user applications.
    Examples of system software is operating system, BIOS (Basic Input Output System),
    assembler, compiler, device, driver. Application software is a computer program
    designed for end users, for example, Microsoft Office, Excel, Google Chrome, Mozilla
    Firefox, Skype and others are an important part of computer system who can use
    the computer for their requirements.


    # 1.2 BLOCK DIAGRAM OF A COMPUTER


    The different parts of a computer are: input device, storage unit, central processing
    unit (CPU) and output.


    # 1.2.1 Input Device


    It is a hardware device through which the user can input the data into the computer.
    The examples of input devices are mouse, keyboard, light pen, BCR (Bar Code Recognizer),'
  merge: -1
  pgno: 16
