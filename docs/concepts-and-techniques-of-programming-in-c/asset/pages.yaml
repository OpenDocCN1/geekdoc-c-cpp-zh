  md: "# 13.9 ADDRESS (POINTER) ARITHMETIC\n\nPointer arithmetic means the arithmetic\
    \ operations done on pointer variable, e.g., addition, subtraction, multiplication\
    \ or division. But there are certain rules of pointer arithmetic.\n\nSome valid\
    \ pointer arithmetic operations are:\n\n+   1. Addition of integer numbers with\
    \ pointer variable\n2. Subtraction of integer numbers from pointer variable\n\
    3. Subtract one pointer variable from other pointer variable\n4. Comparison of\
    \ pointer variable using relational operator.\n\nThe invalid pointer arithmetic\
    \ operations are:\n\n+   1. Addition of one pointer variable with another pointer\
    \ variable\n2. Division of one pointer variable with another pointer variable\n\
    3. Multiplication of one pointer variable with another pointer variable\n\nPointer\
    \ arithmetic is different from general arithmetic. In pointer arithmetic all the\
    \ operations are done on the base address of the corresponding data type.\nSuppose\
    \ p is an integer data type which holds the address 100 then if we write p++ or\
    \ p-1 then it will display the value 102 instead of 101. Because its corresponding\
    \ data type is 2bytes when increment is done then the result becomes 100+2=102.\n\
    \n# Q17. C Program of Addition of Two Dereferencing Pointer Variable.\n\nSolution:\n\
    \n```\n********************************************************************\n\
    FILE NAME: pointer7.c\nAUTHOR DETAILS: Mr. x, 1ST SEM, COMP.SC& ENGG., ABC COLLEGE\
    \ OF ENGG.\nDATE OF PROGRAM EXECUTION: 10/8/2015\nNAME OF THE PROGRAM: c program\
    \ of addition of two dereferencing pointer variable.\n********************************************************************\n\
    \n#include<stdio.h>\nvoid main(void)\n{\n    int x=10,y=20,z;\n    int *p1,*p2;\n\
    \    p1=&x;\n    p2=&y;\n    z=*p1+p2;\n    printf(\"%d\",z);\n}\n```"
