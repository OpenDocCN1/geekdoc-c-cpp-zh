  md: "248 Concepts and Techniques of Programming in C\n\n# 10.8 PARAMETER PASSING\
    \ TECHNIQUE\n\nThe technique which is used to pass data values from one function\
    \ to another function is called passing technique. Or we can say that when a function\
    \ is called and if the function accepts some parameters there are two different\
    \ ways by which the function receives the parameters. This is discussed below.\n\
    \n# 10.8.1 Pass by Value/Call by Value\n\nIn pass by value, the copied values\
    \ of calling/actual parameters are sent to the variables in the parameter (argument)\
    \ list of the called function (formal parameters). The called function (formal\
    \ parameter) does not work on the original values of actual parameter rather it\
    \ works only on the copied values of actual parameter which are passed from the\
    \ calling function. Any changes done at function (formal parameter) do not affect\
    \ the actual parameter. Because the formal and actual parameter values are stored\
    \ in two memory locations. There is no connection between these. This ensures\
    \ that the original value in the calling function does not change.\n\n```\n/*C\
    \ Program of Pass by Value*/\n#include<stdio.h>\nvoid swap_int(int x, int y);\
    \ /*function declaration*/\nvoid main(void)\n{\n    int x,y,z;\n    printf(\"\
    This is the example of numbers by value\\n\");\n    printf(\"Input the two integer\
    \ numbers which is to swapped:\\n\");\n    scanf(\"%d%d\",&x,&y);\n    printf(\"\
    Before swapping the inputted numbers are:%d %d\\n\",x,y);\n    swap_int(x,y);\
    \ /*function call*/\n    printf(\"After swapping the inputted numbers are:%d %d\\\
    n\",x,y);\n    printf(\"\\nThis is the end of the program\\n\");\n}\n\n```\n\n\
    ```\nvoid swap_int(int x, int y)    /*function definition*/\n{\n    int z;\n \
    \   z=x;\n    x=y;\n    y=z;\n}\n```\n\nOutput:\n\nThis is the example of pass\
    \ by value\nInput the two integer numbers which are to be swapped: 7 8\nBefore\
    \ swapping the input numbers are: 7 8\nAfter swapping the input numbers are: 7\
    \ 8\nThis is the end of the program."
