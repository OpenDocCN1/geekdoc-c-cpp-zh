  md: '# Pointer 349


    The C programming language consists of set of local variable, global variable
    and program instruction. Among the three generally local variables are stored
    in stack region. Program instruction and global variable are stored in computers
    permanent storage region. Heap region is the dynamic memory allocation. The size
    of the heap when program function is executed due to creation and deleted.


    | Variable Name | Memory Name |

    | Local Variable | Stack Memory |

    | Program Instruction, Global Variable | Permanent Memory |

    | Dynamic Memory Allocation | Heap Memory |


    # 13.14.1 malloc() Function


    This is a function that allocates a single block of memory dynamically.

    The general form is


    ```

    p=(data_type*)malloc(size specified);

    ```


    Here specified size means the number of bytes to be allocated, p is a pointer
    of type data-type, malloc returns a pointer of data to an area of memory with
    specified size.


    Example:


    ```

    int *p;

    p=(int*)malloc(20);

    ```


    This function creates 20 bytes of memory base address is stored in pointer variable
    p. Since p is integer pointer it creates 10 memory location whose size is 2 bytes.
    Another form of declaration is


    ```

    p=(data_type*)malloc(number of space*sizeof(data_type));

    ```


    Example:


    ```

    int *p;

    p=(int*)malloc(10*sizeof(int));

    ```


    Here it creates 10 memory locations to store integer values.

    The malloc function allocates a continuous block of memory. If the heap memory
    is not sufficient then the allocation fails. If fails, it returns a NULL.


    # 13.14.2 calloc() Function


    This function is the another memory allocation function which is used to allocate
    multiple blocks of memory of each size and sets all bytes to zero. This function
    is used for allocating memory space dynamically for storing derived types such
    as structure and arrays.'
