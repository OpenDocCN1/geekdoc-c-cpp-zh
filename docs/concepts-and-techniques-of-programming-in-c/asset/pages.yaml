    # 6.8 FORMATTED INPUT


    Formatted input refers to reading of an input data through the keyboard arranged
    in a specific format.


    Example:


    20.0 45 dhaball


    The above sentence consists of three data, i.e., 20.0 45 and dhaball that are
    arranged in a sequential order. The data has to be read the format as it appears.
    20.0 will be read through the variable of type float, 45 will be read through
    the variable of type integer and dhaball will be read through the variable of
    type char.

    Reading the formatted input through scanf() function.


    ```

    The syntax of scanf function is

    scanf("control string",address1,address2------address-N);

    ```


    The control string which contains the conversion specification character/format
    identifiers and it should be within double quotes. The conversion specification
    character may be one or more. Address1,address2---address-N is the address of
    location where data is stored. Control strings and address variable are separated
    by comma.


    # 6.8.1 Inputting Integer Numbers


    The field specification for reading an integer number is:

    %wd'
