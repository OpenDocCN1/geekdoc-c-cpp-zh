    # 13.15 COMMAND-LINE ARGUMENTS


    Like user-defined function takes arguments, the main function also takes the arguments
    by default. But we do not mention the arguments in writing the program. The main
    is also a derived function which takes two arguments called argument counter as
    argc and other argument vector abbreviated as argv.

    The variable argument counters (argc) count the number of arguments on the command
    line. The argv represents an array of character pointer that points to the command
    line arguments. The argc is the size of the array.


    In order to access the command line arguments, we must declare the main function
    and its parameters are


    ```

    void main(int argc, char *argv[])

    {

    }

    ```


    In the above declaration argv[0] hold the name of the program and *argv[1] is
    pointer to the first command line argument supplied and *argv[n] is the last argument.
    If no arguments are supplied, argc will be one, otherwise and if you pass one
    argument then argc is set at 2.


