    # 11.2.4 Passing One-Dimensional Array Elements as an Argument in Function


    Generally, till now we passed one variable or multiple variables as an argument
    in function. Now we can pass the array elements as an argument or the entire array.
    Passing one-dimensional array elements as an argument to function in different
    forms. They are: passing individual array elements by using pass by value, passing
    individual array elements using pass by reference, passing the entire array as
    an argument in function by pass by value, passing the entire array as an argument
    in function by pass by reference.


    # 11.2.4.1 Passing Individual Array Elements Using Pass by Value


    Here in this method the user can pass the individual array element instead of
    all the elements as an argument to function.


