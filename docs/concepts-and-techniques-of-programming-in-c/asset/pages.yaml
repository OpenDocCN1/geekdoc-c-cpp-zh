    # 13.1.1 What is Pointer Variable?


    A pointer variable is a variable which holds an address of another variable stored
    in computer memory.


    # 13.1.2 Pointer Variable Declaration


    | The syntax of pointer variable declaration datatype *variable_name; |


    EXPLANATION:

    In the above declaration data type determines what type of data value of the pointer
    will hold by using fundamental data type (e.g., int, char, float, double) and
    then * in front of variable_name identified that variable_name is a pointer variable.


    | TIPS TO REMEMBER

    The pointer variable declaration works when it gives the information/report to
    the C compiler about three basic things about pointer variable. First thing is
    that, asterisk (*) placed in front of pointer variable identify that it is a pointer
    variable. Second thing pointer variable requires is a memory location where it
    will contain address of another variable and the third pointer variable should
    point to a variable of same data type. |


    Let''s see the examples of pointer variable declarations with their respective
    data types.


    # Examples of Pointer Variable Declaration by using Fundamental Data Types


    +   1. int *x;

    2. float *x;

    3. char *x;

    4. double *x;


    EXPLANATION OF EXAMPLE 1 TO 4


    +   1. int *x;'
