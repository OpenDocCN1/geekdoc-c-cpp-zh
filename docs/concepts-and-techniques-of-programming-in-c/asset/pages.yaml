  md: '# # CONCEPTS AND TECHNIQUES OF

    # PROGRAMMING IN C


    The C programming language is one of the most widely offered courses in the undergraduate
    programmes (all branches of BTech, BSc Computer Science, and BCA) as well as various
    postgraduate programmes (MCA, MSc Computer Science and others). The book deals
    with the fundamentals of computers, algorithms and flowcharts, error handling,
    different data types, variables, operators, input/output operations, decision
    statements, looping, unconditional statements, functions, arrays, strings, pointers,
    dynamic memory management, structure and union, file and file handling, and preprocessor
    directives.


    Apart from students, the book will also be useful for aspirants of various competitive
    examinations and budding programmers.


    # ### Salient Features


    +   - Systematic treatment of the subject, with coverage of all essential topics
    of the C programming language.

    - Includes program codes for every topic for developing programming aptitude.

    - Contains "important tips to remember" which will address the students'' specific
    requirements.

    - Learning aids include Summary, Short Questions, Long Questions, and Objective
    Questions with Answers.


