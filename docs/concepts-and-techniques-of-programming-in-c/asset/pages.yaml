  md: '# 16


    # # Preprocessor Directive


    # ## 16.1 INTRODUCTION


    The preprocessor directive instructs the compiler to preprocess the information
    before the compilation starts. That is, C preprocessor modifies the programming
    code before compilation by allowing the conditional compilation using #ifdef,
    defining the constant value by using #define, including the header file #include
    directive. The preprocessor directives are not statements file by semicolon (;)
    is not required at the end. The preprocessor directive is usually placed at the
    top of the source code with starting character"# followed by directive name and
    an optional white space before and after it.


    They are macro subst directives, Header inclusion directive, conditional compilation
    directive, and other directive.


    # ## 16.2 DIFFERENT TYPES OF PREPROCESSOR DIRECTIVES


    There are different types of preprocessor directives in c. They are macro substation
    directive, header file inclusion directive, conditional compilation directive,
    and other directives.


    # ### 16.2.1 Macro Substation Directive


    Macro substation is the process where the identifier is substituted by a predefined
    string which consists of one or more tokens. The syntax of macro substition is:


    ```

    #define identifier string

    ```


    There are different types of macro substitution directives, i.e., simple macro
    substitution directive, argument macro substitution directive and nested macro
    substitution directive.


    The simple macro defines constant value and can be any of the basic fundamental
    data types.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '392 Concepts and Techniques of Programming in C


    Example:

    #define PI 3.14


    # 16.2.2 Header File Inclusion Directive


    The source code of the file "file_name" is included in the main program at the
    specified place, i.e., #include along with the file name, e.g., library file which
    consists of different categories of functions.


    We can declare the header file in two different ways:


    +   (a) #include<filename>

    (b) #include"filename"


    Example:

    #include<stdio.h>

    #include"stdio.h"

    stdio.h means standard input output .header file.


    # 16.2.3 Conditional Compilation Directive


    The syntax of conditional compilation is: #ifdef, #endif, #if, #else, #ifndef

    Set of commands are included or excluded in source program before compilation
    with respect to the condition.


    # 16.2.4 Other Directives


    The syntax of other directive is: #undef, #pragma

    #undef is used to undef a defined macro variable. #Pragma is used to call a function
    before and after the main function in a C program.


    +   1. The preprocessor directs the compiler to preprocess the information before
    compilation starts.

    2. There are different types of preprocessor directives in C. They are macro substation
    directive, header inclusion directive, conditional compilation directive, and
    other directives.

    3. Macro substation is the process where the identifier is substituted by a predefined
    string which consists of one or more tasks.

    4. The source code of the file "file_name" is included in the main program at
    the specified place.'
