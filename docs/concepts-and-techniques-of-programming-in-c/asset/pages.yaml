  md: '# 3.2.8 Assembler


    Assembler is a system software which is used to translate assembly level language
    into machine level language. The assembler is classified into two types, i.e.,
    one pass assembler and two pass assemblers. In one assembler memory address is
    assigned to the variables and it translates the source code to the machine code
    in the first pass simultaneously. In two-pass assembler reads the source code
    twice, i.e., in the first pass, it reads all the variables and creates the memory
    location. In the second pass, it reads the source code and translates the source
    code into object code.


    # 3.2.9 Linker


    Linker is the last step of the compilation process. It links the object file with
    library to create .exe file. The library file is the predefined functions which
    are essential for executing the program. If the linker does not find the library
    functions used in the source program then it informs the compiler and generates
    an error. Example of linking error is variable or function used, but not defined
    anywhere in the program.


    # 3.2.10 Loader


    Loader is the part of the operating system that loads the machine codes of a program
    into the system memory and brings the execution file from system memory into primary
    memory (e.g. RAM) and starts it running.


    # 3.2.11 Source Code


    The source codes are the programming codes that are written in English type language
    by the programmer using a text editor and then saved in a file with their extension.


    # 3.2.12 Object Code


    When the source code gets compiled with a C compiler and the resulting compiled
    file is object file. The object file contains which the sequence of instructions
    that the pre-processor can understand.


    # 3.2.13 Executable Code


    An executable file is a computer program which contains machine code, i.e., 1''s
    and 0''s from the instruction that can be run directly by an operating system.
    The file consists of table of contents, a number of code blocks and data blocks.
    The operating system can run an executable file or less by loading blocks of code
    and data at the indicated address.


