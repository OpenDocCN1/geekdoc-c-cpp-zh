  md: 'Looping 161


    loop. If the condition is true body of the loop is executed otherwise it becomes
    false and control goes out from the loop. But in exit controlled loop, the conditional
    statements are examined at the end of the loop. When the condition becomes false
    then body of the loop executes at least once.


    The important things done by each programmer in looping are: first initialize
    the conditional variable, second make a test for each conditional variable, third
    to use curly brace because those statements require executing number of times
    then they put these inside curly braces, forth is to increment and decrement the
    conditional variable.


    There are three types of looping operations working in C programming. They are:
    (a) while loop, (b) do loop, (c) for loop.


    # 8.2.1 Concepts of While Loop


    The syntax of while loop:

    while (condition)

    {

    Statement block

    }

    Next statements


    EXPLANATION:

    A while loop is a control structure which is used to check the condition and the
    condition is kept inside the parentheses preceded by using the keyword while at
    the beginning of the loop. Generally, the conditions are numeric or alphanumeric.
    When the condition becomes true then the statement block is executed inside the
    curly braces repeatedly. When the condition is false, the while loop is stopped.
    After stopping the loop, the program control moves to the next statements immediately
    after skipping the body of the loop. This loop is also called an entry-controlled
    loop because the beginning condition is checked and if it is true, the statements
    inside the curly braces are executed.


    TIPS TO REMEMBER

    * This is a good looping process while with numeric applications.

    * The programmer uses while loop when he does not know the number of iterations
    required.'
