  md: "# 10.9.2 Global Variable\n\nExternal/global variables are those variables which\
    \ are declared outside the main() function. The global variables can be accessed\
    \ by any function anywhere in the program. These are by default initialized to\
    \ zero.\n\n```\n/*Example of Global Variable*/\n#include<stdio.h>\nint x=12,y=8;\
    \ /*x, y, z are global variables*/\nvoid main(void) {\n z=x++y;\n printf(\"This\
    \ is the example of global variable\\n\");\n printf(\"Sum of x:%d and y:%d are\
    \ %d\\n\",x,y,z);\n printf(\"\\nThis is the end of the program\\n\");\n}\n```\n\
    \nOutput:\nThis is an example of global variable\nSum of x: 12 and y: 8: 20\n\
    This is the end of the program.\n\n> TIPS TO REMEMBER\nThe benefit of global variable\
    \ is once the variable is declared never again declared.\nBut local variable are\
    \ local to each function.\n\n# 10.10 RECURSION\n\nRecursion is the process, where\
    \ a function calls itself, that is, the same function statement is within function,\
    \ which calls itself until it terminates. To terminate the recursion function\
    \ there should be a base condition. If the condition is wrong recursion function\
    \ will never end and that function leads stack overflow error. Therefore, recursion\
    \ works on the principle of stack. Stack is the collection of elements where insertion\
    \ and deletion are done at a single end. The top is the pointer variable through\
    \ push and pop operations are done. The examples of recursion are evaluations\
    \ of factorial of a number, Fibonacci sequence, GCD of two numbers and more.\n\
    The factorial of a number is calculated as\n\n```\nfact(n)= (n-1)*(n-2)--------\n\
    For example\nFactorial of 5=5*4*3*2*1=120\nFrom programming concept of recursion\
    \ is\nfact=n*factorial(n-1);\nIf n=5 e.g fact=5*factorial(4); will be evaluated.\n\
    ```"
