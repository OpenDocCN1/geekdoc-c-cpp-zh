    \ as structure, but the keyword union is used instead of struct. The major difference\
    \ between a structure and union is that, in structure each member has its own/individual\
    \ memory location; whereas in case of union all the members have the same memory\
    \ location, e.g., a union contains members of different data types and can handle\
    \ one member at a time.\n\n# 14.11.1 Union Declaration\n\nThe syntax of union\
    \ is\n\n```\nunion union_name {\n  datatype member1;\n  datatype member2;\n}variable_name;\n\
    ```\n\nExample:\n\n```\nunion student {\n  char name;\n  int regno;\n  float marks;\n\
