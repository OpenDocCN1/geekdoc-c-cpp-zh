  md: '# 5.3 TYPE CONVERSION/TYPE CASTING


    Type casting refers to the conversion of one data type into another data type.
    There are two types of type casting. They are 1) implicit type casting, and 2)
    explicit type casting.


    # 5.3.1 Implicit Type Casting


    In some situations the compiler will automatically convert one data type into
    another data type. This is called implicit type casting/automatic conversion.


    Example 1 of Implicit Type Casting


    ```

    float x=98.92;

    int y=/*automatic type casting*/

    ```


    EXPLANATION:


    In the following Example 1 will give the result 98. Since the variable y is an
    integer it holds the value 98.

    Let''s convert it into programming.


    /*Programming Conversion of Example 1*/


    ```

    #include <stdio.h>

    void main()

    {

    float x=98.92;

    int y=/*automatic type casting*/;

    printf("Value of x is:%f and value of y is:%d", x, y);

    }

    ```


    Output:


    Value of x is: 98.920000 and value of y is: 98


    # Example 2 of Implicit Type Casting


    ```

    float y;

    y=9/2;

    ```


    EXPLANATION:


    In the above Example 2 will give the result 4.0 instead of 4.5. Because 9/2 is
    taken as an integer division and its result is integer type. To get the floating
    type value the expression should like this:


    ```

    y=9.0/2;

    or

    y=9.0/2.0;

    or

    y=9/2.0;

    ```


    The above expression can give the result 4.5.'
