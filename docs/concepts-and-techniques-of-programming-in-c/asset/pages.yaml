  md: "# 10.7 FORMAL PARAMETERS VS. ACTUAL PARAMETERS\n\nThe variables declared in\
    \ function definition/function header and function prototype are called formal\
    \ parameters (arguments).The variables used inside the function call are called\
    \ actual parameters. The actual parameter uses the constants, variables or expressions.\
    \ The formal parameter and actual parameter should match in data type, order and\
    \ number. Their names do not need to match. It is optional, e.g., may name or\
    \ not.\n\n/Examples of Formal Parameter vs. Actual Parameter*/\n\n```\n#include<stdio.h>\n\
    void z(int a, int b)\nvoid main() {\n  int x,y;\n  printf(\"Input the two integer\
    \ numbers:\");\n  scanf(\"%d%d\", &x,&y);\n  z(x,y); /*Here x and y variables\
    \ are actual parameter*/\n  printf(\"\\nThis is the end of the program\");\n}\n\
    /*user-defined function section/\nvoid z(int a, int b) /*Here a and b variables\
    \ are formal parameter*/\n  a+=30;\n  b+=20;\n  printf(\"After modification the\
    \ inputted numbers a and b become:%d,%d\",a,b);\n}\n```\n\n# Output\n\nInput the\
    \ two integer numbers: 10 20\nAfter modification the input numbers: a=40, b=40\n\
    This is the end of the program.\n\n# EXPLANATION:\n\nIn the above program, calling\
    \ function takes variables x and y as arguments are called actual parameter and\
    \ in function header variable a and b are called formal parameter. The actual\
    \ parameter variable and formal parameter may be same or different but their data\
    \ type should be same. The input 10 and 20 are passed from calling function alter(10,20)\
    \ to called function void alter(10,20) function then 30 is added with 10 and 20\
    \ and updated results are printed through printf.\n\nTIPS TO REMEMBER\nThe actual\
    \ parameter and formal parameter names may be same or different.\nThe data type,\
    \ order and number of actual and formal parameter list must be always same."
