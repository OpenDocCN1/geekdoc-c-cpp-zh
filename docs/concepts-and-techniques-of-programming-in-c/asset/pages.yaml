  md: '# 380 Concepts and Techniques of Programming in C


    Binary files are the collection of bytes. Programs are converted into binary files
    and stored in computer hard disk. The binary files are the combinations of binary
    digit 0 and 1. Examples of binary files are program.exe or music stored in wave
    files or pictures stored in graphic files.


    # 15.3 FILE I/O OPERATION


    Different operations done with the concept of file in C programming


    +   1. Creating/declaring a file

    2. Opening a file

    3. Reading a file

    4. Writing a file

    5. Moving a file to a specified location

    6. Closing a file


    # DESCRIPTION ABOUT FILE OPERATION


    1, 2) Creating/Declaring a file and opening a file

    To read data from a file or write data to a file on the computer hard disk we
    have to first declare the file and then open it. To open the file use the function
    fopen() along with file operation mode, i.e., read mode or write mode etc.


    > The syntax of declaring and opening a file is:

    FILE *; /* syntax of declaring a file*/nfopen("filename","mode"); /*syntax of
    opening a file*/


    EXPLANATION:

    In the two lines, the first line: FILE *x; specifies that x is the pointer value
    of data type file.

    The second line: x=fopen("filename","mode"); the fopen() function connects of
    two parameters. The first parameter "filename" is the specified path where the
    data was stored and it is represented in the form of strings. The second parameter
    "mode" means to place the file, i.e., read, write or append, etc. The fopen()
    function assigns the value to the file pointer x and searches the location on
    the computer hard disk where it will store the data and to be opened. Then it
    loads the data from the specified location in temporary memory placed buffer.
    Then it points the first character of buffer.


    # 6) Closing a File


    If the file reading from hard drive is finished then we need to close it. This
    can be done using the function fclose().'
