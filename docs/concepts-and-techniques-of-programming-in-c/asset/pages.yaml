    \nFollow the same principle of above else if condition.\n\n# 7.3 CONCEPTS OF switch\
    \ STATEMENT\n\nThe switch statement is another selection control statement. It\
    \ is also known as multi-decision making statement. It is the alternative of many\
    \ if statements and has many conditions. It runs faster than if statement. The\
    \ switch statement is used to select a choice from a larger number of choices.\
    \ When any one choice matches the series of choices block of statements with that\
    \ case is executed otherwise default statement is the optional case to execute,\
    \ i.e., when any case does not match with given input values then default statement\
    \ will be executed.\n\nThe break statement is used in each case statement to stop\
    \ a particular case statement and the control moves from switch statement to the\
    \ next statement. If we do not write break statement in each case the result of\
    \ the program will be unexpected, e.g., if we select one case among the list then\
    \ it will display the selected case along with the rest of the cases in the list.\n\
    \n```\nThe syntax of switch case statement is\nwitch (variable or expression)\n\
    {\ncase constant1:\n    statements;\n    break;\ncase constant2:\n    statements;\n\
    \    break;\ncase constant3:\n    statements;\n    break;\n-------------------\n\
    default:\n    statements;\n    break;\n}\nNext statements;\n```"
