    # 3.3 TYPES OF ERRORS IN C PROGRAMMING


    # 3.3.1 Syntax Error


    A syntax error is an error that is detected in the source program. Generally,
    syntax errors are the common grammatical mistakes done by the programmer and during
    compilation process of a program. Examples of syntax errors are: missing comma
    among variables, missing semicolon at the end of a line or extra bracket at the
    end of a function may create a syntax error.


    # 3.3.2 Runtime Error


    The runtime error is an error occurring while executing a program. The different
    types of runtime errors are: overflow; divide by zero, memory errors and uninitialized
    data access. Overflow means numeric calculation produces the result which is too
    large. Divide by zero means dividing a numeric value by zero. Memory errors mean
    to access a memory which produces undefined result, i.e., array outside of bounds.
    Uninitialized data access accessing memory before the memory has been initialized.


    # 3.3.3 Logical Error


    Logical errors are difficult to find and fix in a program because there is no
    indication of an error. A again we are told in logical programming, programs run
    successfully but do not give the output of the program correctly. The causes of
    logical errors are: writing a program without understanding the logic of the program.
    Some beginner carefully wrote the program and made mistake.'
