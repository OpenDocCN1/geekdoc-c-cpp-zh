  md: '# 72 Concepts and Techniques of Programming in C


    # 4.13 TYPES OF DATA TYPES


    C programming supports three categories of data types. These are:


    +   1. Fundamental data types or primary data types (int, char, float and double).

    2. Derived data types (e.g. arrays, functions, structure and pointers).

    3. User-defined data types (e.g. typedef and enum).


    ![](img/15f2d3c4e623a0624f0481e94908bbcb_87_0.png)


    # 4.13.1 Explanation of Data Types


    The fundamental data types are of four types, e.g., integer, character, float
    and double type. The data type integer is represented as int, char is, float is,
    double is.


    Table 4.3 Different types of fundamental data types and its sizes


    | | |

    |---||

    | int --->These data type stores the integer value whose size is --->2 bytes (16-bit
    compiler) |

    | char-->These data types stores the single character values whose size is------→1
    byte. (16-bit compiler) |

    | float -->These data types stores floating point numbers whose size is --->4
    bytes. (16-bit compiler) |

    | double-->These data type stores double precision point numbers whose size is
    --->8 bytes. (16-bit compiler) |

    | long double -->These data types whose size is --->10 bytes. (16-bit compiler)
    |


    Two types of qualifiers are used in the above fundamental data type, i.e., sign
    qualifier and size qualifier. Sign qualifier is aware of two types, i.e., signed
    and unsigned. When signed qualifier is used before an integer it means that the
    integer may be a positive number or negative number. Unsigned integer means only
    positive integer numbers. When no qualifier is mentioned, its default is signed.
    The size of data types is a machine dependent. In some platform int types occupy
    two bytes of memory whereas in some other platform it may occupy four bytes of
    memory.'
