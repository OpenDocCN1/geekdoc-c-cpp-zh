    # # C Programming


    # ## 3.1 INTRODUCTION


    C program is a structured, high level and machine independent language. The structured
    oriented programming means it divide a larger problem in top down manner as smaller
    modules which are called functions or procedures and each of the function does
    its own calculation. The structured programming uses three control statements
    sequence, selection and iteration or looping. It restricts the use of GOTO statement.
    High level language means it is a language which is written in English language.
    Machine independent language means the language which can run in any platform
    (operating system) with small modification or no modification.


    C programming language was developed from the disadvantages of ALGOL, BCPL and
    B programming language. It was developed by Dennis Richie at Bell Laboratories
    in 1972. The C programming language uses the concepts of data types and many additional
    features. Preliminarily C programming language was associated with UNIX operating
    systems. The UNIX operating system was developed using the C programming. The
    ALGOL was the first programming language introduced in 1960. BCPL (Basic Combined
    Programming Language) was written by Martin Richards in 1967. In 1970 B programming
    language was developed by Ken Thompson who was the improved version of BCPL. Then
    C programming language came in 1978 by Brian Kerninghan and Dennis Richie. Then
    ANSI C came in 1989 by American National Standard Institute (ANSI). In 1990, C++
    programming language came based on C programming with a number of changes called
    a true object-oriented programming. The applications of C programming languages
    are development of Operating Systems, Compilers, Assemblers, Text Editors, Print
    Spoolers, Network Drivers, Modern Programs, Databases, Interpreters, etc.'
