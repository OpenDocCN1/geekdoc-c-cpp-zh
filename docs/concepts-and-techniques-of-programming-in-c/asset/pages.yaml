    # 14.8 STRUCTURE AND FUNCTION OR PASSING STRUCTURE AS AN ARGUMENT IN FUNCTION


    In structure and function, the structure variable is passed as an argument to
    user-defined function. There are three different ways the values of structure
    variable are passed from calling function to called function. First individual
    members of the structure are passed as an actual argument in the function call;
    second passing entire structure variable as an argument by value method and third
    by passing the address of structure variable by pass reference. In pass by value
    of entire structure variables is passed to the called function. Any change happens
    with structure members within the function does not reflect the original value
    of structure.

    But using reference address of structure members are passed as an argument to
    the called function and any changes happen with structure members inside the user
    defined they reflect the original value of calling function.


    # 14.8.1 Passing Structure Member Individual as an Argument in Function


    Here instead of sending structure variable we can pass each member as an argument
    inside function call to called function.

    The syntax of structure individual member as an argument in the calling function
    is:


    ```

    Function_name (variable.member_name, variable.mememe_name2.......,variable.member_nameN);

    ```'
