    the different variables of different types than struct_name is the name of the
    structure and it also called structure tag. The variables declared inside the
    curly braces are called structure elements or structure members. These are not
    called structure variables. Each member belongs to different data type. At the
    end of the structure definition semicolon is given to terminate it. Let''s see
    the example:


    ```

