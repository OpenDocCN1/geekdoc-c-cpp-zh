    # ## 2.1 INTRODUCTION


    The word algorithm derives from the phonetic pronunciation of Arabic mathematician
    Abu Jafar Mohammad Ibn Musa al-Kowarizmi who invented a set of rules for doing
    the arithmetic operations, e.g., addition, subtraction, division and multiplication
    on decimal number systems. Thus, an algorithm is the formula or step-by-step methods
    for solving a particular problem. Algorithms are used for the logical analysis
    of the program.


    # ### 2.1.1 Properties of Algorithm


    | Table 2.1 Properties of algorithm |

    |---||

    | 1. Finiteness

    It means the algorithm should stop in a finite number of steps. |

    | 2. Definiteness

    Definiteness means each step of the algorithm should be clearly defined. |

    | 3. Input

    The input of the algorithm is given by the user. |

    | 4. Output

    The algorithm should have the correct output. |

    | 5. Effectiveness

    Effectiveness means the algorithm should be developed using basic operations and
    it should be complete in a finite amount of time by a person by drawing the paper
    and pencil. |


    # ### 2.1.2 Advantages of Algorithm


    +   1. Easy to develop the program.

    2. Easy to convert into the program.'
