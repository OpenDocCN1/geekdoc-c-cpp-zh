    \ numbers using third\nvariable by function\\n\");\n    printf(\"Input the two\
    \ numbers: \");\n    scanf(\"%d%d\", &x,&y);\n    printf(\"Before swapping the\
    \ inputted numbers is:%d %d\\n\",x,y);\n    swap_intnum(x,y); /*function call*/\n\
    \    printf(\"nThis is the end of the program\\n\");\n}\nvoid swap_intnum(int\
    \ x, int y) /*function definition*/\n{\n    int z;\n    z=x;\n    x=y;\n    y=z;\n\
    \    printf(\"After swapping the inputted numbers is:%d %d\\n\",x,y);\n}\n```\n\
