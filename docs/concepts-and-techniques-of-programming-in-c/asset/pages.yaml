    # 5.2.3 Increment/Decrement Operator


    There are two useful operators which are used in C programming language incrementing
    and decrementing the variable. They are ++ and -- operators. The ++ operator is
    called increment operator and -- operator is called decrement operators. These
    operators increment or decrement the variable''s value by 1. These operators (++
    and --) are called unary operators because they are applied to only one operand
    for operation. These operators are also called prefix and postfix operators because
    it depends on where the operators will be used.


    The syntax of increment/decrement operator applied in single operand is:


    +   1. ++variable;--variable;

    2. variable++;--;variable--;


    +   (a) ++x; /* prefix operator with operand*/

    Or

    x++; /*postfix operator with operand*/

    (b) --x; /*prefix decrement operator with operand*/

    Or

    x--; /*/postfix decrement operator with operand*/

    (c) ++x is same as x+1 or x=1

    (d) --x is same as x-1 or x=1


    Generally, these operators are used in loop and while loop.


    | What is the difference between prefix operators applied to single operand vs.
    postfix operator applied to single operand |

    | Answer: When the operator is applied to single operand, e.g., ++x and ++x, then
    the result will be same. But when it applies in an expression of right side of
    assignment operator then the result will be different |


