    MSVC compiler, debugger, and CMake. Alternatively, you can set up environments
    like MinGW or Windows Subsystem for Linux (WSL) to use GCC or Clang. Package managers
    like vcpkg or Conan can help manage external libraries.


    ​● ​macOS: Xcode provides Clang, LLDB, and other development tools via the Command
