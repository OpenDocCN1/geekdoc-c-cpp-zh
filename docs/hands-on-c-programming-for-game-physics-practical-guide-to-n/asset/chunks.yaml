  trans: "\n\n这种结构提供了清晰的接口（`public`），同时保护了内部状态（`private`），使得 `RigidBody` 更容易正确使用且难以被误用。\n\
    \n# 运算符重载：编写直观的数学代码\n\n物理学本质上是数学。我们不断对向量和矩阵执行操作：相加力、计算点积、变换点、矩阵矩阵。C++ 允许你定义标准运算符（`+`、`-`、`*`、`/`、`==`\
    \ 等）如何作用自定义类型（如 `Vector3`、`Matrix3x3`、`Quaternion`）。这就是运算符重载。\n\n如果使用得当，运算符重载可以让物理代码变得极其易读且直观，紧密匹配标准的数学符号。比较以下两种相加力：\n\
    \n```cpp\n// 没有运算符重载\nVector3 totalForce = Vector3::add(gravityForce, windForce);\n\
    totalForce = Vector3::add(totalForce, impulseForce);\n\n// 使用运算符重载 (+)\nVector3\
    \ totalForce = gravityForce + windForce + impulseForce;\n```\n\n第二个版本不可否认地更简洁，并直接反映了向量相加的数学概念。同样，用标量缩放向量：\n\
    \n```cpp\n// 没有运算符重载\nVector3 scaledVelocity = Vector3::multiply(currentVelocity,\
    \ dampingFactor);\n\n// 使用运算符重载 (*)\nVector3 scaledVelocity = currentVelocity\
    \ * dampingFactor; // 或者 dampingFactor * currentVelocity\n```\n\n物理类型需要重载的关键运算符包括：\n\
    \n- `Vector3`: `+`（加法）、`-`（减法、取反）、`*`（标量乘法、点积 - 有时使用函数 `dot()` 更清晰）、`/`（标量除法）、`==`、`!=`。可能还有\
    \ `*=`、`+=`、`-=`、`/=`。\n- `Matrix3x3/4x4`: `*`（矩阵乘、矩阵向量乘）、`+`、`-`、`==`、`!=`。\n\
    - `Quaternion`: `*`（用于组合旋转的四元数乘、用于旋转向量的四元数向量乘）、`==`、。\n\n关键是以符合数学习惯且直观的方式重载运算符。避免为运算符分配令人意料的语义。当谨慎使用时，运算符重载是编写表达丰富且可维护物理代码的强大工具。\n\
    \n# 模板：编写通用、可重用的代码\n\n物理算法通常独立于使用的特定数值类型（例如 `float` 与 `double`）。无论你使用单精度还是双精度浮点数，数值积分、向量操作或碰撞检测逻辑可能是相同的。C++\
    \ 模板允许你编写一次代码，即可在不同数据类型上运行，而无需重复。\n\n你可以创建模板函数或模板类。例如，一个通用的向量相加函数：\n\n```cpp\n\
    template <typename T> // T 可以是 float、double 等\nVector3<T> addVectors(const Vector3<T>&\
    \ a, const Vector3<T>& b) {\n    return Vector3<T>(a.x + b.x, a.y + b.y, a.z +\
    \ b.z);\n}\n\n// 假设 Vector3 本身是一个模板类：\ntemplate <typename T>\nstruct Vector3 {\n\
    \    T x, y, z;\n    // 构造函数、方法、运算符重载...\n    // 模板类内部的运算符重载示例：\n    Vector3<T>\
    \ operator+(const Vector3<T>& other) const {\n        return Vector3<T>(x + other.x,\
    \ y + other.y, z + other.z);\n    }\n};\n\n// 使用：\nVector3<float> forceF = gravityF\
    \ + windF;\nVector3<double> positionD = initialPosD + velocityD * timeStepD;\n\
    ```\n\n模板在 C++ 标准库（STL）中被广泛使用，特别是容器（`std::vector<T>`、`std::map<K, V>`）和算法（`std::sort`、`std::find`）。在物理中，虽然你可能不会编写复杂的模板元编程，但将模板用于基础数学类型（`Vector3<T>`、`Matrix<Rows,\
    \ Cols, T>`）或简单算法可以提高代码复用和灵活性，允许通过更改模板参数轻松切换精度（例如，对性能敏感的游戏模拟使用 `float`，对高精度的离线计算或测试使用\
    \ `double`）。\n\n# Const 正确性：传递意图并防止错误\n\nC++ 中的 `const` 关键字是一个承诺。当你声明一个变量为 `const`\
    \ 时，你承诺不改变它的值。当你声明一个成员函数为 `const`（例如 `Vector3 getPosition() const;`），你承诺承诺调用此函数不会修改对象的观测状态。\n\
    \n正确使用 `const` 有许多好处：\n\n1. **编译器强制执行**：编译器帮助执行你的承诺。如果你尝试修改 `const` 变量或对 `const`\
    \ 对象调用非 const 成员函数，编译器将生成错误。这可以及早捕捉意外修改。\n2. **意图清晰**：它充当了文档。看到 `const` 会告诉读者（包括未来的你自己）某些数据不应更改，或者某个函数只检查状态，使代码更容易理解。\n\
    3. **启用优化**：当编译器知道数据不会改变时，有时可以执行更好的优化。\n4. **接口设计**：它允许你通过常量引用传递对象（`const Vector3&`），这在避免昂贵拷贝的同时，保证了函数不会修改原始对象。这在向量和矩阵频繁传递的物理代码中非常常见且对性能很重要。\n\
    \n```cpp\n// 良好实践：通过常量引用传递，将访问器标记为 const\nfloat calculateKineticEnergy(const RigidBody&\
    \ body) {\n    // 如果我们尝试：body.setPosition(...) 编译器将报错\n    Vector3 velocity =\
    \ body.getLinearVelocity(); // 如果 getLinearVelocity() 是 const\n    float mass\
    \ = body.getMass(); // 如果 getMass() 是 const\n    return 0.5f * mass * velocity.dot(velocity);\
    \ // 假设 dot() 是 const\n}\n\nclass RigidBody {\n    // ... 私有成员 ...\npublic:\n\
    \    // 访问器标记为 const - 承诺不改变 RigidBody\n    Vector3 getLinearVelocity() const\
    \ { return linearVelocity; }\n    float getMass() const { return mass; }\n   \
    \ // 修改器 - 不是 const\n    void applyForce(const Vector3& force, const Vector3&\
    \ worldPoint);\n};\n```\n\n在代码中追求 const 正确性。将不改变的变量标记为 `const`。将不修改对象的成员函数标记为\
    \ `const`。当需要读取访问时，通过 `const&` 传递对象。\n\n# 移动语义：高效处理临时对象\n\n物理计算经常创建临时对象。考虑 `Vector3\
    \ result = (a + b) * scale;`。`a + b` 的结果是一个临时的 `Vector3` 对象，然后被乘以 `scale` 产生另一个临时\
    \ `Vector3`，最后用于初始化 `result`。在旧的 C++ 中，创建和拷贝这些临时对象可能涉及巨大的开销，特别是对于较大的对象（尽管对于简单的\
    \ Vector3 并非如此）。\n\nC++11 引入了移动语义（右值引用 `&&`、`std::move`、移动构造函数、移动赋值运算符）来优化这些场景。移动语义允许将资源（如指向分配内存的指针，或者可能是简单类型的数据成员）从临时对象“夺取”或“移动”到目标对象，让临时对象处于有效但未指定的状态（通常为空）。这避免了冗余的拷贝和分配。\n\
    \n虽然你可能不需要经常为 Vector3 等简单类型手动编写移动构造函数（编译器可能会生成高效的版本），但在处理资源管理类或标准库容器（如 `std::vector`）时，理解移动语义很重要。返回大型对象的函数以及在容器中重排元素的算法从正确实现的移动语义中受益匪。对于性能敏感的物理代码，确保昂贵的资源被移动而非拷贝可以带来显著的收益。\n\
    \n"
- fmt: "\nThe C++ Standard Library (STL) provides a suite of well-tested, efficient\
    \ container classes. For physics programming, `std::vector` is often the most\
    \ useful. It's a dynamic array that handles its own memory management (using `RAII`).\n\
    \nUse `std::vector` for:\n- Storing lists of physics objects (particles, rigid\
    \ bodies, constraints).\n- Holding collision contact points generated during a\
    \ frame.\n- Implementing spatial partitioning structures (e.g., a grid where each\
    \ cell contains a `std::vector` of object indices).\n\n```cpp\n#include <vector>\n\
    #include \"RigidBody.h\" // Assuming RigidBody class exists\n\nstd::vector<RigidBody>\
    \ bodies;\n\n// Add bodies...\nbodies.push_back(RigidBody(/*...*/));\nbodies.push_back(RigidBody(/*...*/));\n\
    \n// Iterate and update\nfloat deltaTime = 0.016f;\n\nfor(RigidBody& body : bodies)\
    \ { // Use reference to modify\n    body.clearAccumulators();\n    // ... apply\
    \ forces ...\n    body.integrate(deltaTime);\n}\n\n// Efficiently remove elements\
    \ (e.g., using erase-remove idiom)\n```\n"
