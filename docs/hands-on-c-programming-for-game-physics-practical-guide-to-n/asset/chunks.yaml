  trans: "\n\n# 物理引擎开发：从运动学到刚体动力\n\n`std::vector` 提供了高效的连续存储（利于缓存性能）、快速的随机访问（使用 `operator[]`）以及末尾的摊均常时间插入（`push_back`）。请注意，在中间插入/删除可能会很慢，且调整大小可能涉及重新分配内存和移动元素（如果可用，则利用移动语义）。`std::array`\
    \ 是在编译时已知的固定大小数组的替代方案。\n\n利用这些 C++ 特性——用于资源安全的 RAII、用于组织结构的类、用于增强表达能力的运算符重载、用于泛型的模板、用于确保正确性的\
    \ `const`、用于性能优化的移动语义，以及用于常用数据结构的 STL 容器——为构建复杂的物理模拟提供了坚实的基础。\n\n## 运动的语言：掌握 3D\
    \ 空间中的向量和点\n\n为了构建物体能够真实移动和交互的仿真，我们首先需要正确的工具来描述它们在 3D 世界中的状态。3D 图形和物理学中这些基本构建单元是点和向量。\n\
    \n### 点与 向量\n点仅仅是 3D 空间中的一个位置。它是一个标记特定位置的坐标 `(x,y,z)`。点没有固有的大小或方向；它只定义了物体所在。\n\
    \n相反，向量表示一个同时具有量级（大小或长度）和方向的量。它描述了位移、速度、加速度或力。当我们把向量存储为 `(vx,vy,vz)` 时，这些分量告诉我们沿主轴的影响或运动情况。\n\
    \n### 数学相互作用\n- **差值**：寻找两点之间的差值可以得到连接它们的向量。如果从点 `P2` 减去点 `P1` 的坐标，结果就是表示方向和距离的向量。\n\
    - **加法**：给点加上一个向量会得到一个新的点。这就是我们如何根据速度逐帧更新物体位置的方法。\n\n### C++ 实现：Vector3 类\n在 C++\
    \ 中，我们通常使用单个类（通常命名为 `Vector3` 或 `Vec3`）来同时表示两者。\n\n```cpp\n#include <cmath> //\
    \ 用于 std::sqrt, std::abs\n#include <cassert> // 用于 assert\n\nstruct Vector3 {\n\
    \    float x, y, z;\n\n    // --- 构造函数 ---\n    Vector3() : x(0.0f), y(0.0f),\
    \ z(0.0f) {}\n    Vector3(float xVal, float yVal, float zVal) : x(xVal), y(yVal),\
    \ z(zVal) {}\n\n    // --- 核心向量操作 ---\n    float magnitude() const {\n       \
    \ return std::sqrt(x*x + y*y + z*z);\n    }\n\n    float magnitudeSquared() const\
    \ {\n        return x*x + y*y + z*z;\n    }\n\n    void normalize() {\n      \
    \  float mag = magnitude();\n        constexpr float epsilon = 1e-6f;\n      \
    \  if (mag > epsilon) {\n            float invMag = 1.0f / mag;\n            x\
    \ *= invMag;\n            y *= invMag;\n            z *= invMag;\n        } else\
    \ {\n            x = 0.0f; y = 0.0f; z = 0.0f;\n        }\n    }\n\n    Vector3\
    \ normalized() const {\n        Vector3 copy = *this;\n        copy.normalize();\n\
    \        return copy;\n    }\n\n    // --- 运算符重载 ---\n    Vector3 operator+(const\
    \ Vector3& other) const { return {x + other.x, y + other.y, z + other.z}; }\n\
    \    Vector3 operator-(const Vector3& other) const { return {x - other.x, y -\
    \ other.y, z - other.z}; }\n    Vector3 operator-() const { return {-x, -y, -z};\
    \ }\n    Vector3 operator*(float scalar) const { return {x * scalar, y * scalar,\
    \ z * scalar}; }\n    Vector3 operator/(float scalar) const {\n        assert(std::abs(scalar)\
    \ > 1e-9f && \"Division by zero!\");\n        float invScalar = 1.0f / scalar;\n\
    \        return {x * invScalar, y * invScalar, z * invScalar};\n    }\n\n    Vector3&\
    \ operator+=(const Vector3& other) { x += other.x; y += other.y; z += other.z;\
    \ return *this; }\n    Vector3& operator-=(const Vector3& other) { x -= other.x;\
    \ y -= other.y; z -= other.z; return *this; }\n    Vector3& operator*=(float scalar)\
    \ { x *= scalar; y *= scalar; z *= scalar; return *this; }\n    Vector3& operator/=(float\
    \ scalar) {\n        assert(std::abs(scalar) > 1e-9f && \"Division by zero!\"\
    );\n        float invScalar = 1.0f / scalar;\n        x *= invScalar; y *= invScalar;\
    \ z *= invScalar;\n        return *this;\n    }\n\n    bool operator==(const Vector3&\
    \ other) const {\n        constexpr float epsilonSq = 1e-5f;\n        float dx\
    \ = x - other.x;\n        float dy = y - other.y;\n        float dz = z - other.z;\n\
    \        return (dx*dx + dy*dy + dz*dz) < epsilonSq;\n    }\n    bool operator!=(const\
    \ Vector3& other) const { return !(*this == other); }\n};\n\ninline Vector3 operator*(float\
    \ scalar, const Vector3& vec) {\n    return vec * scalar;\n}\n\ninline float dot(const\
    \ Vector3& a, const Vector3& b) {\n    return a.x * b.x + a.y * b.y + a.z * b.z;\n\
    }\n\ninline Vector3 cross(const Vector3& a, const Vector3& b) {\n    return {\n\
    \        a.y * b.z - a.z * b.y,\n        a.z * b.x - a.x * b.z,\n        a.x *\
    \ b.y - a.y * b.x\n    };\n}\n```\n\n## 第 2 章：赋予物体生命：运动学与积分\n\n运动学是在不考虑引起运动的力量的情况下研究运动。为了模拟运动，我们描述三个关键属性：**位置**、**速度**和**加速度**。\n\
    \n### 核心概念\n1. **位置**：物体在 3D 空间中的地方。\n2. **速度**：位置变化的快慢和方向。\n3. **加速度**：速度变化的快慢。\n\
    \n###  积分方法\n在游戏循环中，我们随时间步 `dt` 更新这些属性。\n- **前向欧拉**：最简单的方法。`velocity += acceleration\
    \ * dt`；`position += velocity * dt`。\n- **半隐式欧拉**：先更新速度，再更新位置。物理系统更稳定。\n\n## 第\
    \ 5 章：碰撞检测（宽阶段）\n\n碰撞检测的宽阶段快速排除明显没有碰撞的物体对。\n\n### 边界\n- **球体**：由中心和半径定义。测试最快，但对于长条物体拟合度差。\n\
    - **AABB（轴对齐边界框）**：与世界轴对齐的矩形。测试快速，但在物体旋转时需要重新计算。\n- **OBB（旋转边界框）**：随物体旋转的箱体。提供最紧密的拟合，但需要使用昂贵的**分离轴定理\
    \ (SAT)**。\n\n## 第 6 章：碰撞检测（窄阶段）\n\n窄阶段确定精确的接触点、法线和穿深度。\n\n### 球体与球体碰撞\n当球心距离小于半径之和时，会发生碰撞。\n\
    \n```cpp\nContactInfo testSphereSphere(const SphereCollider& a, const SphereCollider&\
    \ b) {\n    ContactInfo result;\n    Vector3 offset = b.center - a.center;\n \
    \   float distSq = offset.magnitudeSquared();\n    float sumRadii = a.radius +\
    \ b.radius;\n    \n    if (distSq <= sumRadii * sumRadii) {\n        float distance\
    \ = std::sqrt(distSq);\n        result.colliding = true;\n        result.normal\
    \ = offset / distance;\n        result.penetrationDepth = sumRadii - distance;\n\
    \        result.contactPoint = a.center + result.normal * a.radius;\n    }\n \
    \   return result;\n}\n```\n\n## 第 7 章：反弹：碰撞解决\n\n### 恢复系数 (`e`)\n该值衡量了碰撞的“弹性”。\n\
    - `e = 0`：完全非弹性（物体粘合在一起）。\n- `e = 1`：完全弹性（能量守恒）。\n- `0 < e < 1`：真实的非弹性碰撞。\n\n\
    ### 基于冲量的解决\n为了解决碰撞，我们应用一个冲量 `J`。冲量大小的公式为：\n`j = -(1 + e) * (relativeVelocity\
    \ dot normal) / (invMassA + invMassB)`\n\n产生的冲量为 `J = j * normal`。将其应用于物体上以更新它们的速度。\n\
    \n"
