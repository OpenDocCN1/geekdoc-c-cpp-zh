    # 第一部分：运动与模拟的基础


    ***


    ## 第 1 章：搭建舞台：C++ 与数学基础


    ### 准备工作：用于物理模拟的 C++ 开发环境


    让我们奠定基础。在我们开始操作向量或计算轨迹之前，我们需要一个坚实的工作坊——一个支持我们工作而非阻碍我们的开发环境。为物理模拟编写高效、复杂的 `C++`
    代码需要的不仅仅是一个文本编辑器和祈祷。从一开始就选对工具可以节省未来无数小时的挫败感，并让你专注于物理编程中有趣的挑战。将此比作在开始一个复杂的机械项目之前布置一个组织整齐的工作台；正确的工具、触手可及，会让一切截然不同。


    #### 基石：你的 C++ 编译器


    任何 `C++` 开发的核心都是编译器——将你人类可读的 `C++` 代码翻译成计算机可以执行的机器指令的工具。对于现代 `C++` 开发，特别是在游戏物理等对性能敏感的领域，你希望使用一个完全支持至少
    `C++17` 标准的编译器，最好是 `C++20` 或更高版本。这些新标准提供了显著提高代码清晰度、安全潜在性能的特性——例如结构化绑定、`if constexpr`、概念（在
    `C++20` 中）以及许多库增强，如用于计时的 `<chrono>` 或用于生成可预测随机数的 `<random>`，这些在某些模拟场景中可能惊奇地有用。


    编译器领域的主要竞争者有 `GCC`（GNU 编译器集合）、`Clang` 和 `MSVC`（Microsoft Visual C++）。


    *   `GCC`：开源世界的骨干力量，在 Linux 和 macOS 上广泛可用，并可以通过 `MinGW` 或 `Cygwin` 等环境在 Windows
    上使用。它以广泛的平台支持和强大的优化能力而闻名。

    *   `Clang`：通常因更快的编译速度和极其清晰、可操作的错误及警告信息受到赞誉（归功于其基于 `LLVM` 后端的设计）。它是 macOS 的默认编译器（通过
    `Apple Clang`），也是 Linux 及其他平台上的流行选择。它的工具生态系统（包括 `Clang-Tidy` 等静态分析工具）是一个巨大的优势。

    *   `MSVC`：Windows 开发的主要编译器，与 `Visual Studio` IDE 紧密集成。它在最新版本中提供了卓越的性能、对 `C++`
    标准的强力合规性，以及在其原生环境中顶尖的调试支持。


    你应该选择哪一个？坦率地说，对于学习和实现本书中的概念而言，只要支持 `C++17` 或更高版本，这些现代编译器中的任何一个都能胜任。选择通常取决于你的操作系统或特定的
    IDE 集成。许多专业游戏工作室维护着可以使用多个编译器的构建系统，以确保跨平台兼容性并利用各自的优势。关键是要确保你安装了最新版本并了解如何调用它，无论是直接调用还是更常见的通过构建系统调用。不要在这里马虎；使用老旧、过时的编译器就像用生锈的工具造赛车。

