- fmt: '

    Have you ever marveled at the satisfying crash of objects in a game, the realistic
    drape of a character''s cloak, the believable tumble of debris after an explosion,
    or the precise arc of a projectile hitting its mark? Behind these dynamic and
    immersive moments lies the fascinating world of physics simulation – a blend of
    physics principles, mathematical techniques, and clever programming that brings
    virtual worlds to life.


    If you''ve ever wanted to pull back the curtain and understand how these systems
    work, or better yet, build them yourself, then you''ve come to the right place.
    Welcome to "Hands-on C++ programming for Game Physics"


    The idea of programming physics can seem daunting. Terms like quaternions, inertia
    tensors, collision manifolds, constraint solving, and numerical integration might
    sound complex, and indeed, there''s depth to explore. But the core concepts, when
    approached systematically and practically, are well within your grasp. This book
    is designed to be your guide on this journey, taking you step-by-step from the
    fundamental building blocks to implementing sophisticated physics interactions.


    Our approach is firmly "hands-on." We won''t just talk about theory; we''ll translate
    it directly into `C++` code. We''ll start by setting up our development environment
    and mastering the essential mathematical tools – vectors and points. From there,
    we''ll build up our understanding layer by layer:


    *   **Bringing Objects to Life**: We''ll explore kinematics, understanding position,
    velocity, and acceleration, and learn how to move objects through time using numerical
    integration.

    *   **Forces and Motion**: We''ll dive into Newton''s laws, applying forces like
    gravity and drag, understanding the crucial role of mass and inertia, and harnessing
    the power of impulses for instantaneous changes.

    *   **Adding Spin**: We''ll tackle rotational dynamics, learning about torque,
    angular velocity, and how to represent and integrate orientation using robust
    methods like quaternions.

    *   **Collision Detection**: We''ll unravel the complexities of figuring out when
    objects touch, starting with efficient broad-phase techniques using bounding volumes
    and spatial partitioning, and moving to precise narrow-phase tests like `SAT`
    and `GJK/EPA`.

    *   **Bouncing Back**: We''ll learn how to make objects react realistically to
    collisions using impulse-based resolution, considering factors like restitution
    and friction, and tackling the challenges of stable resting contact.

    *   **Connecting the Pieces**: We''ll go beyond independent objects by exploring
    constraints and joints – the hinges, ball-sockets, and distance constraints that
    let us build articulated characters, vehicles, and complex mechanisms.

    *   **Pushing the Boundaries**: We''ll even take introductory steps into advanced
    topics like soft body dynamics (making things bend and stretch) and particle-based
    fluid simulation (making things splash).


    Throughout this process, we''ll focus on clarity, practical implementation, and
    building intuition. We''ll use `C++` as our tool, focusing on code structure,
    common techniques, and performance considerations relevant to real-time simulations.
    We''ll also discuss the vital skills of debugging physics systems and optimizing
    them for speed.


    This book is for aspiring game developers, simulation programmers, students, or
    anyone curious about the code that makes virtual objects move and interact in
    believable ways. Whether your goal is to build your own physics engine from scratch,
    contribute to existing ones, or simply use physics engines more effectively in
    your projects, the principles and techniques covered here will provide a solid
    foundation.


    So, roll up your sleeves, fire up your compiler, and get ready to build worlds
    that obey the laws of motion – or perhaps bend them in interesting ways! It''s
    going to be a challenging, rewarding, and ultimately fun journey. Let''s get started!


    ***


    # Part 1: Foundations of Motion and Simulation


    ***


    ## Chapter 1: Setting the Stage: C++ and Math Essentials


    ### Gearing Up: Your C++ Development Environment for Physics


    Let''s lay the groundwork. Before we start manipulating vectors or calculating
    trajectories, we need a solid workshop – a development environment that supports
    our efforts rather than hindering them. Writing performant, complex `C++` code
    for physics simulations demands more than just a text editor and a prayer. Getting
    your tools right from the beginning saves countless hours of frustration down
    the line and lets you focus on the interesting challenges of physics programming.
    Think of it as setting up a well-organized workbench before starting a complex
    mechanical project; the right tools, easily accessible, make all the difference.


    #### The Cornerstone: Your C++ Compiler


    At the heart of any `C++` development is the compiler – the tool that translates
    your human-readable `C++` code into machine instructions that the computer can
    execute. For modern `C++` development, especially in performance-sensitive areas
    like game physics, you''ll want a compiler that fully supports at least the `C++17`
    standard, and preferably `C++20` or later. These newer standards offer features
    that significantly improve code clarity, safety, and potential performance – think
    structured bindings, `if constexpr`, concepts (in `C++20`), and numerous library
    enhancements like `<chrono>` for timing or `<random>` for generating predictable
    random numbers, which can be surprisingly useful in certain simulation scenarios.


    The main contenders in the compiler world are `GCC` (GNU Compiler Collection),
    `Clang`, and `MSVC` (Microsoft Visual C++).


    *   `GCC`: A stalwart of the open-source world, widely available on Linux and
    macOS, and usable on Windows via environments like `MinGW` or `Cygwin`. It''s
    known for its broad platform support and robust optimization capabilities.

    *   `Clang`: Often praised for its faster compile times and exceptionally clear,
    actionable error and warning messages (thanks to its design based on the `LLVM`
    backend). It''s the default compiler on macOS (via `Apple Clang`) and is a popular
    choice on Linux and other platforms. Its tooling ecosystem, including static analysis
    tools like `Clang-Tidy`, is a significant advantage.

    *   `MSVC`: The primary compiler for Windows development, tightly integrated with
    the `Visual Studio` IDE. It offers excellent performance, strong `C++` standard
    compliance in recent versions, and top-tier debugging support within its native
    environment.


    Which one should you choose? Honestly, for the purposes of learning and implementing
    the concepts in this book, any of these modern compilers will serve you well,
    provided they support `C++17` or higher. The choice often comes down to your operating
    system preference or specific IDE integration. Many professional game studios
    maintain build systems capable of using multiple compilers to ensure cross-platform
    compatibility and leverage the strengths of each. The key takeaway is to ensure
    you have a recent version installed and understand how to invoke it, either directly
    or (more commonly) through a build system. Don''t skimp here; using an old, outdated
    compiler is like trying to build a race car with rusty tools.

