  - Minecraft：数百万人的连接游戏
- - '##'
  - 然而，在 2009 年，很少有人能想象到 `Minecraft` 会成为如今的全球性现象。这款基于 Java 开发的游戏是由瑞典程序员马库斯·“Notch”·佩尔森本质上作为一个侧项目创建的，并在完全没有任何营销计划的情况下向公众发布的。其游戏玩法并非人们对典型视频游戏所预期的那样。`Minecraft`
    被称为“沙盒”游戏，不受单一任务驱动，而是作为一个巨大的虚拟世界存在，玩家可以在其中自由地建造和采集一个符合自己喜好的世界。与典型的视频游戏不同（后者的动作序列通常是高度线性的，并由游戏引擎按照精心策划的顺序引导），`Minecraft`
    允许玩家自由、随心所欲地游戏。虽然在应该战斗谁、救助谁或如何获胜方面没有指令要求，但 `Minecraft` 为玩家提供了一个核心动力，那就是创造。
