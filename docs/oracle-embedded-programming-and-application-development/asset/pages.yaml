    better business benefit by way of a least time-to-deliver application solution
    that addresses the needs of a rich Web presence, usability, and intelligence coupled
    with the flexibility to enhance/adapt to on-demand changes in business, and optimize
    on the business results to evolve/innovate into a better customer-centric business
    solution. The corresponding imperatives on the development and deployment of technologies
    and methodologies to arrive at such a solution is multifold, irrespective of its
    business-use—transactional, analytical, or a combination of:


    +   - A customer-focused solution that is business process-driven and services-oriented,
    to ensure seamless and transparent collaboration between business operations and
    IT operations across the enterprise

    - A standards-based solution that enables a flexible architecture capable of self-optimization,
    self-manageability, and self-service user interactivity, providing consistent
    business operations and information management across the enterprise

    - A unified view of the user experience and business results, based on a centralized
    and correlated analysis of business and technology specific attributes that contributed
    to the same


    > >> The key indicator for implementing such a framework is the rapid prototyping
    of the so-designed application architecture as a demonstrated business use case,
    and its provisioning as a click-and-go application development infrastructure
    service by way of Web Services and automation for fast, secure, efficient, and
    cost-effective application development and deployment. Using Oracle ADF for the
    design methodology with Oracle APEX, Oracle JDeveloper, or Oracle Developer Tools
    for .NET for the corresponding integrated development and runtime platforms, a
    personalized customer-centric application development framework (ADF) for an Oracle-based
    embedded programming solution can be put into practice. For the purposes of this
    book, this custom framework is abbreviated as OEP-ADF.'
