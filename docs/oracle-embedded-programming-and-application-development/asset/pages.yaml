  md: '# Foreword


    As an IT professional living in the real world, I am always struggling to get
    the various application layers to work well with each other, providing the required
    functionality without errors or performance issues. I am sure I am not the only
    one struggling with this conundrum – whether you are a developer, DBA, Architect
    or support person, all of us in the IT industry face such challenges every day.


    This is where an experienced professional like Lakshman Bulusu steps in to help
    us all with with this book. With almost two decades of experience in software
    management, design, and development using Oracle and related technologies backing
    him up, Lakshman has distilled this knowledge of embedded programming and application
    development using Oracle into the various chapters. Taking an Oracle-centric approach,
    Lakshman fully guides you through the maze of popular programming languages and
    environments including .NET, C/C++, Perl, PHP, Java and even SQL and PL/SQL –
    not only showing how they interact with Oracle but also which language is the
    best for a given situation. In my early days as a programmer, many moons ago,
    I was enamored with specific features of a language or technique and allowed this
    to override the fact that my choice may not be the ideal one for that application.
    Lakshmi is well aware of this common issue, and makes a strong case to allow application
    architecture requirements moderate the argument about which feature and which
    language is best for that application. The book is also replete with application
    development and code design frameworks and best practices in these various languages
    that will help you move in the right direction.


    A separate chapter is devoted to best practices for constructing architecture
    and code design methodologies using these languages, and how they can be used
    for a generalized and standardized approach to application development. Lakshman
    also knows that troubleshooting applications does'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'not depend on luck or arcane skills that only few gurus possesses—it depends
    on understanding, observation, and interpretation of logs from the application
    itself. In Chapter 8, he deals exclusively with frameworks that can be used for
    common requirements such as auditing, error logging, performance tuning and debugging.
    Implementing this very practical and useful set of frameworks will greatly assist
    everyone in the stack—from the programmer and the DBA down to the support person
    who has to debug the issue in production.


    I can say much more, but I will stop here and allow you to dive in head first
    into this book!


    Best regards,

    John Kanagaraj

    Executive Editor, IOUG SELECT Journal'
