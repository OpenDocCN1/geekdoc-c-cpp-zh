    # 2.3.3 Tracking the Error Line


    Oracle 10g PL/SQL offers an elegant way of knowing the actual line number in the
    execution of which exception was raised. Before Oracle 10g, it was possible to
    know only the error number, the error message text, and the error stack in a PL/SQL
    program by calling the packaged function DBMS_UTILITY.FORMAT_ERROR_STACK. In Oracle
    10g PL/SQL, you can obtain the actual line number by calling the packaged function
    DBMS_UTILITY.FORMAT_ERROR_BACKTRACE. This functionality is new in Oracle 10g and
    returns the error backtrack stack of the raised error, which includes the program
    owner, program name, and actual line number where the error occurred, but without
