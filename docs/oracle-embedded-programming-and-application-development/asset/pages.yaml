  md: '# Fine-Grained Dependency Tracking (FGD)


    This feature reinvents the implicit invalidation and re-compilation of data-level
    objects in the dependency-chain subprogram hierarchy. Before Oracle 1g, a single
    invalidation in a particular subprogram invalidated all the subprograms in the
    tree up to the level of the single subprogram. With FGD, only database objects
    that are relevant to the particular (single) program being executed are invalidated,
    eliminating the cascade effect, which helps avoid excessive recompations (think
    efficiency). Examples are when columns are added to underlying tables, or when
    the package specification has new cursors or procedures added. In these cases,
    the dependent objects are not invalidated or recompiled.


    # Dynamic SQL Enhancements


    Dynamic SQL is optimized for faster execution and enhanced functionality. In terms
    of native dynamic SQL, string length is now unrestricted to accept Character Large
    Object (CLOB) input. EXECUTE IMMEDIATE AND DBMS_SQL (DBMS_SQL_PARSE) can accept
    a CLOB () input. A more powerful enhancement in this respect is the interoperability
    of DBMS_SQL and REF CURSORS. This means you can code a dynamic SELECT statement
    using a DBMS_SQL cursor, parse and execute it using DBMS_SQL, and then process
    the result set using native SQL using a REF CURSOR. This is extremely useful for
    embedded programming languages, as REF CURSOR is the most efficient structure
    for sharing data sets between Oracle and the application.


    Moreover, this interoperability can take advantage of bulk operations. The API
    transforms DBMS_SQL to REF CURSOR, using the DBMS_SQL_TO_REF_CURSOR function.
    The reverse is also possible, using the API DBMS_SQL_TO_CURSOR_NUMBER. Finally,
    DBMS_SQL now supports user-defined types as well as dynamic operations over these
    types.


    # PL/SQL Triggers Enhancements


    The ability to order the trigger execution and the new compound trigger that enables
    the use of sections in a single trigger for multiple triggers are useful in cases
    in which the application code needs to be implemented for data integrity in a
    transparent manner. This is for transparent data integrity is felt more when the
    data input/output (I/O) is tied to an embedded language that is non-Oracle based.
    All comes with performance, too; compound triggers have a common state and preserve'
