    Use parameter passing by reference using NOCOPY when passing huge sets of data
    as parameters and boosts performance.


    Make use of dynamism in cursor variables by reusing the same cursor for opening
    multiple queries or assigning different queries to the same cursor variable depending
    on runtime conditions. Make use of cursor expressions to facilitate retrieval
    of multi-row data for a join which is too complex or will not suffice at all (such
    as with data combining independent m:n relationships). This, however, comes at
    an execution cost involving additional logical I/O, use of recursion internally
    and avoidance of implicit array processing.


    Use embedded language–based stored procedures in the database for optimizing compute-intensive
    tasks that require database access and for extending database functionality not
    available in PL/SQL. The embedded language specific features, such as safer type
    system, automatic garbage collection, polymorphism, inheritance, multithreading,
    and the like, and Oracle’s corresponding implementation of the same as DB-specific
    native driver API, ensure a high degree of compatibility between the two.


    Use fine-grained access when accessing resources outside the database, such as
    operating system files from embedded language procedures.


    Use PL/SQL within HTML to seamlessly integrate an HTML-intensive application with
    the database. Using e-mail functionality from within PL/SQL eliminates the need
