  md: '# Using Bulk Binds


    Bulk binding involve the following steps:


    +   1. Use BULK COLLECT with the LIMIT clause in a loop to read the source data
    from the intermediate tables into a PL/SQL array.


    +   2. Read the collection elements and perform the data transformations and any
    other processing.


    +   3. Use the FORALL statement to load the transformed data into the target tables.


    Here''s a code snippet to illustrate these steps:


    ```

    CREATE OR REPLACE PROCEDURE p_insert(

    p_src_data SYS_REFCURSOR)

    IS

    TYPE arr IS TABLE OF src_tab%ROWTYPE INDEX BY

    BINARY_INTEGER;

    arr arr;

    BEGIN

    LOOP

    FETCH p_src_data BULK COLLECT INTO arr1 LIMIT 100;

    EXIT WHEN arr1.COUNT = 0;

    /* Perform some processing on the input rows in arr1

    */

    FORALL i IN 1..arr1.COUNT

    INSERT INTO target_tab VALUES arr1(i);

    COMMIT;

    END LOOP;

    /

    ```


    # Using Pipelined Table Functions


    Using pipelined table functions involves the following steps:


    +   1. Define an object type with a structure equivalent to the source data record
    and a collection type of this object type at the schema level.


    +   2. Create a pipelined table function in a package that returns the collection
    type. This function must have an input parameter of'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'type REF CURSOR to have the source data pumped into it.

    Also, define the function with the PARALLEL_ENABLE clause.


    Using a table function accomplishes the following:


    +   - It reduces the memory bottleneck to materialize the entire set of rows returned
    by the function in memory.

    - It increases efficiency by not waiting for the function to execute completely.

    - It enables parallel processing to be used, thus further increasing speed by
    means of parallel query execution. This is a trade-off between the resources used
    to create the slave processes and the time taken to execute the function.


    Here''s a code snippet to illustrate pipelined functions:


    ```

    CREATE OR REPLACE FUNCTION f_process(p_src_data

    SYS_RECURSOR)

    PIPELINED

    IS

    TYPE arr IS TABLE OF src_tab%ROWTYPE INDEX BY

    BINARY_INTEGER;

    arr1 arr;

    BEGIN

    LOOP

    FETCH p_src_data BULK COLLECT INTO arr1 LIMIT 100;

    EXIT WHEN arr1.COUNT = 0;

    /* Perform some processing on the input rows in arr1 */

    FOR i IN 1..arr1.COUNT LOOP

    /* Populate src_row_obj which is an element of a

    collection of objects corresponding to src_tab

    and defined in the database with input data read

    in the array arr1*/

    PIPE ROW (src_row_obj);

    /* Use multiple PIPE statements to fan multiple

    records from a single source row */

    END LOOP;

    END LOOP;

    ```'
