    # 8.5 Debugging Framework


    Debugging involves tracing the source and cause of any errors that occur during
    runtime. Debugging differs from error-handling, which consists of trapping these
    errors. This section describes a framework for debugging application code.


    Debugging comes into picture after the code has run and in troubleshooting the
    application. Runtime errors can occur due to exceptions raised by the Oracle Server
    (due to failure of SQL and/or PL/SQL code) or by logical errors that affect the
    functionality of the application. Exceptions raised by the Oracle Server are more
    visible in the sense that they are thrown to the calling environment in the form
    of error messages trapped by the code and customized or in unhandled format. Logical
    errors are less visible because they are inherent or dependent on the data or
    results from the application. Only after careful analysis can logical errors reveal
    a functional glitch in the application and hence in the underlying code.


    Debugging and error-handling go hand in hand, in fact, complete each other. An
    efficient error-handling mechanism in place enables easy, smart, and quick debugging.
    However, not all errors can be debugged using error-handlers alone. There are
    certain scenarios where the execution of the SQL/PL/SQL code and/or embedded language
    code needs to traced line-by-line to determine the location of an error or its
    cause. This is true in the case of unhandled exceptions and logical errors. In
    certain situations, the actual error occurring in a production system needs to
    be simulated in a test environment to determine the real problem. This turn depends
    on the input dataset, which might vary from production to test environments, and
    the so-called simulation might not be possible. However, simulating the test data
    first, per production, can help solve this problem in most cases.


    Whatever the scenario, implementation of a debugging framework helps enable efficient
    debugging. Retaining the implemented debugging framework (along with the code
    for debug message logging) while deploying the code in production environments
    is recommended, as it ensures a fairly and efficient way of troubleshooting a
    live problem that can'
