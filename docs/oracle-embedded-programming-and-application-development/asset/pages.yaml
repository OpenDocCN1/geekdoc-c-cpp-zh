  md: '# 7.2.1 Code Accelerator Design Pragmatics


    Here''s a breakdown of the same in terms of a best-fit scenario for business operational
    efficiency as well as architectural efficiency:


    +   Oracle-DB native compatibility—The code included in the accelerator must have
    Oracle-native compatibility in addition to the native embedded-language compatibility.
    This is an essential design practice that goes a long way in ensuring the compile-time
    and run-time performance of the code; and also reduces the complexity in modification
    of the same line.


    +   Let SQL do all the (implicit) data management that it can. Make PL/SQL the
    first choice to write custom code, as it integrates seamlessly with SQL for in-memory
    processing and as well as read-only, random access in Oracle lg. All of the embedded
    programming languages have Oracle-native API for the data layer that can call
    the SQL-PL/SQL—stored code modules for augmenting the computation in the Application
    Tier.


    +   Use code to accelerate nondata-based or ineffective-based processing, as object-based
    I/O with the embedded-programming code and the database objects. Typical examples
    fall outside the range of Database Services (such as for rendering, complex aggregation,
    summarization, or consolidation in the Application/UI Tiers, like mash-ups based
    on output queries, non-query based unstructured data etc.)


    +   SQL in combination with PL/SQL can also be used in code accelerators to optimize/automate
    database-based information processes like efficient data integration using virtual
    (in-memory) data views, content queries on unstructured/semistructured data (e.g.,
    XML structures, binary documents, visual content, and the stored in the database),
    caching (at the DB, application, and client Tiers) of database objects, cross-domain
    query caching and cross-query result set caching, in-memory (dynamic) replication
    of data, and so on. Oracle lg supports SQL-based access that allows XQuery and
    XSQL queries on XML data/content.'
