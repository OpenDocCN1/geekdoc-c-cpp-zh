  md: '# Key IT Indicators of Transactional Solution Architecture


    +   - Management of dynamically growing data, especially when the rate of growth
    cannot be predetermined due to high transactional and query throughput


    +   - Horizontal (scale-in) and vertical (scale-out) scaling of the underlying
    database infrastructure to accommodate data growth on demand; this can be addressed
    by using a combination of database clustering and database grid computing using
    data virtualization


    +   - Coherency and consistency of information and business results across the
    distributed enterprise


    +   - Continuous and on-demand database connectivity as the user base increases


    +   - Efficiency, scalability, and unified view of the transactional content across
    the enterprise


    +   - Intelligent database contention resolution and cache coherency management


    # Key Implementation Indicators


    +   - Standardization locking—Oracle11 enables multiversion concurrency


    +   - Optimistic control of transactions by eliminating transactional data contention
    and thereby minimizing locking; this prevents read operations from interfering
    with DML (Data Manipulation Language) write operations and increases the performance
    of transactional Web applications.


    +   - Synchronization (and streamlining)—Implement distributed caching and coherency
    control in the database Tier for data-intensive applications. Note that the cache
    invalidation and synchronization (maintaining a coherent state of frequently changing
    data) are done in the database Tier (using, for example, Oracle in-memory database,
