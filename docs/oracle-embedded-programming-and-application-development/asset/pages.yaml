    # SQL Injection


    SQL Injection is a way of gaining access to unauthorized data for retrieval/modification
    using SQL statements that written to the database. These statements are functionally
    incorrect, but syntactically and semantically correct; when executed, they allow
    granting of unauthorized privileges or performance of unauthorized operations
    on data.


    Direct SQL Injection occurs when logically invalid values are input for login
    credentials, but the value passes to the Oracle DB technicalities. This is especially
    the case when the underlying SQL code involves concatenation of the passed “invalid”
    values to the queries being executed.


    This can also occur when an entire SQL statement is passed as a parameter to a
    stored procedure.'
