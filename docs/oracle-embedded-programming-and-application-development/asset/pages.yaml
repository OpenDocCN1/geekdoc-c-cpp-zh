    Oracle-based Web-enabled applications in PL/SQL, Java, C++, .NET, and PHP, it
    covers application development from concepts to customization, following a pragmatic
    approach to design, coding, testing, deployment, and customization—explaining
    how to maximize embedded programming practices.


    Oracle Embedded Programming and Application Development explains application development
    frameworks using 3GL and 4GL high-level language code as embedded code segments
    across .NET, Java, and Open Source technologies, in conjunction with SQL and PL/SQL
    and the Oracle RDBMS through version 11gr2. It also:


    +   * Features plug code using particular constructs to create code reuse

    * Explains when to use a particular embedded language as a best fit for specific
    applications

    * Highlights design considerations that reduce the probability of errors, enable
    quick resolution, and boost performance in terms of enabling a Fast-Actionable-Synchronized-Tested
    (FAST) solution implementation

    * Provides best practice techniques that can enhance any application development
    code-design methodology for a better, easier, faster, cheaper, and pervasive solution
    that in turn helps a Better Business Benefit (B-B-B)


    This practical guide details techniques for constructing architecture and code
    design methodologies for live application development projects that can be generalized
    and standardized as application development and code design frameworks. To cover,
    the text provides an understanding of how the designed, developed, and deployed
    solutions conform to emerging and next-generation trends. It also discusses the
    conformance and usage of Web 2.0-based RIA functionality and regulatory compliance
    practices involving auditing and security.


