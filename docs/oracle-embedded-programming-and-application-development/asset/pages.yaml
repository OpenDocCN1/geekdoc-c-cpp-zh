    # 8.3 Master Error Management Framework


    # 8.3.1 Error-Logging Framework


    The error-logging framework refers to logging of SQL and/or PL/SQL errors occurring
    during program execution, as well as customary application-specific error messages.
    Here, logging refers to capturing the following information about each error:


    +   - An identifier pertaining to the code block where the error occurred

    - The actual error code and error message

    - The line number where the error occurred, including the error execution stack
    (the sequence of program steps that led to the error)


    Error logging in this manner is not only useful for tracking runtime errors, but
    also helps tremendously in debugging, as well as code correction. Error logging
    should be a must for all applications running interactively, such as OLTP applications.
    In batch mode, error logging can be enabled for programs that do incremental batch
    updates and disabled for those performing one-time massive loads. While you are
    logging errors, to be sure to consider the following factors:'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# 252 Oracle Embedded Programming


    +   - The type of error being logged; is it a critical error, a warning, or an
    informational message?

    - Oracle SQL or PL/SQL errors or application-specific errors (i.e., errors raised
    due to exceptions in embedded language programming code)

    - Execution of same program multiple times, for example, in multiple sessions
    or by multiple programs in a single session


    Taking these factors into consideration, you can control error logging using a
    control table; it can be implemented using the two database tables. The control
    table can have a column to enable/disable error logging, and the implementation
    tables can be designed as an error logging table and lookup table. The error information
    logging table can have additional columns to accommodate the information about
    the application and program being captured. A PL/SQL package provides the API
    for the implementation logic.


    Here''s the framework for such an implementation:


    +   1. Error logging information is recorded in two database tables.

    2. PL/SQL package API is used to program the logging process.

    3. Error logging can be enabled/disabled using an audit control table. This is
    done at the application and/or current program levels. This table will always
    have a row for each application with current_program_name set to a single space.

    4. Additional rows with valid current program names define the granularity of
    enabling/disabling; these rows take precedence over the single row with a blank
    current program name.

    5. Each program is error-logged if error logging is turned on.

    6. Application contexts can be used instead of a control table if the number of
    applications or modules needing error logging is not large. This makes control
    more secure and tightly integrated. An application context is session-concerning
    information stored in secure data cache in UGA (User Global Area also termed Program
    Global Area)or SGA which is the System Global Area); it can be used to incorporate
    access-control mechanisms. A context is specified as a set of attribute, value
    pairs that can be defined, set, and accessed using an associated package. They
    are used to ensure that every data transaction is logged correctly, to turn'
  merge: -1
