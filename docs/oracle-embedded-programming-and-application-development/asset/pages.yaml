    # 1.3.2 Data Sharing Differentiators


    # Bidirectional Exchange of Result Sets


    As regards sharing data between Oracle and the embedded programming application,
    the often-required user-oriented functionality is the bidirectional exchange of
    result sets between Oracle DB and the application. This is achieved by procedural
    functions or sub-programs having SQL-based code for retrieval/or update—and more
    often than not, the subprograms being parameterized. The same issues of data management
    and data structure management as outlined above apply to the parameters as well.
    There are a number of ways to do this, keeping in mind that the Oracle DB is the
    persistent store of the data being shared. The typical ones in an embedded programming
    solution environment are:


    +   - Using REF CURSORS to pass result sets to and from the DB. This again depends
    on the functionality of the embedded language interface with Oracle. Some provide
    for one-way sharing only—from the DB to the application—while allow two-way sharing.

    - Real-time streaming of the data from Oracle DB to the application. This is often
    a requirement in applications that are analysis-intensive and involve only data
    retrieval—high-volume data in real-time speed. This is achieved by pipelined and
    parallel execution of the functions, enabling row-by-row “live” streaming of the
    data to the application. The data is available to the application as the function
    is executing but hasn''t completely finished. This, too, depends on the inherent
    functionality of the embedded language interface involved.


    This process of pipelining can be channelized as a pipeline chain to eliminate
    intermediate processes/data stores to obtain optimal performance gains. However,
    the usability of this special technique is solution-specific.


    +   - Result set caching—Per-SQL query result set, per-function result set on
    the DB side; client-side result set caching of the same; and IMDB Cache on the
    application Tier.'
