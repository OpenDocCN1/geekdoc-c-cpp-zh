    # 8.3.2 DML Auditing Framework


    The DML auditing framework refers to auditing of DML statements (INSERT, UPDATE,
    and DELETE statements) being executed within PL/SQL stored programs.


    Here, auditing refers to capturing the following information about the execution
    or result of execution of each DML statement:


    +   - An identifier about the statement itself

    - The number of rows affected by the statement

    - The success or failure of the statement; this again is a special case of error
    logging and is captured by using the error-logging framework


    Auditing DML statements in this manner is useful in applications that run a multitude
    of transactions using programs numerous INSERT, UPDATE, and DELETE statements.
    The criteria for DML auditing in such situations depends on the following factors:


    +   - The number of DML statements being executed in a single program

    - The same program being executed multiple times—for example, in multiple sessions
    or by multiple programs in a single session

    - Whether to audit DML also depends on where the application is running. If the
    application is mission-critical and is running in'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# 262 Oracle Embedded Programming


    production in high-priority mode, the failure of every DML needs to be trapped.
    In this case, DML auditing needs to be enabled. On the other hand, if the application
    is running in batch mode involving massive bulk loads, each DML operation need
    not to be tracked and DML auditing can be disabled


    Taking these factors into consideration, you can control DML auditing by using
    a similar control table and implement it using the two similar database tables
    in the error-logging framework. The control table can have a column to enable/disable
    DML auditing, the master table can have the same structure as the error-logging
    framework, and the detail table can have additional columns to accommodate the
    DML statistics. The package API changes accordingly to accommodate the DML auditing
    framework.


    Here''s the framework for such an implementation:


    +   - Audit and error logging information recorded in two database tables

    - PL/SQL package API used to program the logging process

    - Auditing, error logging, and DML auditing enabling/disabling done using the
    audit control table

    - This is done at the application and/or current program levels. This table will
    always have a row for each application with current_program_name set to a single
    space. Additional rows with valid current program names define the granularity
    of enabling/disabling, and these rows take precedence over the single row with
    a blank current program name.

    - Each program is audited if at least one DML statement is present and DML auditing
    is on, regardless of the number of rows affected by the DML

    - Application contexts can be used instead of a control table if the number of
    applications or modules needing DML auditing is not large; this makes control
    more secure and tightly integrated


    Here''s the design of the data structures:


    +   - Audit master (AUDIT_MASTER table)—The key information here includes the
    application name, calling program name, current program name, unique session code,
    start and end timestamps, completion status, information identified by a unique
    ID, and miscellaneous comment columns.'
