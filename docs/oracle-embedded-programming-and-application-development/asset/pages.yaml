    # 4.3 Best Practices for Using Heterogeneous Data Structures: Arrays, Array Lists,
    Lists, Maps, Enumerations


    Deciding what kind of data structure to use and when depends on the particular
    solution in context. However, there are generic “rules” across the major embedded
    programming languages that can be put into practice to achieve optimal functionality
    and efficiency. Here''s list of must-haves in regard to what you should and shouldn''t
    do when it comes to using heterogeneous data structures as arrays, array lists,
    enumerations, structures/unions, and the more generic classes to start with:


    +   - Use Oracle''s native data access drivers for each embedded programming language
    implementation. For example, use ODP.NET 11gr2 (version 11.1.0.7.2, as of the
    writing of this book) for database interaction with .NET languages (C# is the
    best choice). This takes care of the Oracle11g inherent optimization for the particular
    language in context. For example, in the case of data structure management, it
    provides transparent syncing between contextual parameterization, binding, deferred
    execution, and so on.


    +   - Choose a data structure that can talk to the Oracle11g database without
    any data loss, type-mismatch, type-conversion overhead, parameterization limitations,
    or SQL injection vulnerabilities. The best fit for this is to leverage the Oracle
    native data type components with the dual data access drivers for Java/J2EE, .NET,
    PHP, and C/C++ programming frameworks, which are maximized for framework-specific
    efficiency and for Oracle DB-centric efficiency. As a use case, arrays or array
    lists can be chosen to consolidate multiple elements of data into a single structure
    that can be used as a “bind” host variable for processing. This gives a huge performance
    gain as well as scalability in handling large data-sets having heterogeneous data
    elements.'
