    they have to be framed on pre-identified data patterns (e.g., regularities/irregularities
    in the data, any peculiarities in the data, temporal effects in the data, etc.).
    This data-driven approach ensures that the policy framework is in line with what
    the data means to the users, who are going to use it, how it is going to be used,
