  md: '# Best Practices for Application Management 193


    availability–security in virtual environments affects the performance of the same.


    In the case of high-volume OLTP solutions, it takes prudence to ensure that in-memory
    replication and application state are one-on-one. This boils down to the fact
    that a disaster recovery mechanism is required to automatically load-balance and
    enable parent failover of VM solutions without losing the transaction or the application
    state. A recommended design practice for such a mechanism is to have a physical-to-virtual
    machine consolidation capacity ratio of 3:4, given an optimal consolidation density.
    Application performance in virtualized environments depends on the impact of virtualized
    applications on business processes, access security, and transactional integrity.
    The functionality required to effectively manage virtual environments is also
    of critical importance.


    Oracle11g enables all of this by way of the application grid, database grid, and
    real application clusters. Data virtualization, alongside replication, using application,
    storage, and database grids contributes towards effective disaster recovery.


    The choice between data virtualization and replication is analogous to the one
    between data federation and replication. Data virtualization is a better solution
    for information unification than physical data consolidation in solutions that
    need real-time data integration across multiple data sources, as it responds efficiently
    to rapidly changing data syncing. Another use case is in systems that run on-demand
    and need to scale in and scale out as data grows and user base increases. It has
    the potential to integrate any type of data defined as business-critical and needs
    to be synchronized. Data replication, on the other hand, is a good choice in distributed
    computing environments, and is often employed to replicate data in-memory for
    ultra-fast access and response to heavy traffic sites.


