    data transformation/processing; data loading; data consolidation; data delivery
    and presentation in a unified format; data manipulation both implicitly (by the
    DB and the application program) and interactively by the end user; and data persistence
    via commit operations.


    Data validation is the primary mechanism to ensure and preserve data integrity
    throughout the database solution. Though each of these processes involves some
    kind of validation, the validation of data is vital to the processes of data loading,
    data transformation/processing, data consolidation, and data manipulation. This
    section highlights the best practices for the same in terms of identifying "bad"
    data and cleansing of the data, data de-identification as a measure to anonymously
    present sensitive data, and various other parameters and procedures encompassing
    the data validation landscape.


