  md: '# Introduction


    +   - Authenticity and authorization (who should use what and in what manner in
    terms of delegation of duties and localization of access control)


    +   - Application output and data protection (within and beyond the enterprise,
    including externalized deployments, those that are remotely accessed, and so forth)


    +   - Securing code and code authenticity, in terms of protecting the misuse of
    code using mechanisms like signing code (digitally) as well as code verification
    and validation procedures (which ensure that code and/or application/solution
    software is genuine and not one that has been intruded, before the code/software
    is used, installed, or deployed).


    +   - Adhering to regulatory compliance standards for GRC and audit-practices


    Although much has changed in programming and program-coding, the core principle
    of code/driven code can still be understood in terms of its primary goal: *usability*.
    The “why, what, and who” of programming is still conspicuously constant.


    Let’s re-examine these facets using an actions-results perspective.


    # Actions


    +   - Passive code to active to proactive code to pre-emptive code


    +   - Code-driven data (data output governed by the way the code runs on it) to
    data-driven code/policy-driven code (using data as the user wants it) to changing
    the way the code can auto-adapt/dynamically output results (again, as the user
    wants it)


    +   - Code outputting data to enable decision support/business insight


    +   - Code-driven user-interaction to user-interaction-driven code (which enables
    dynamic user-interactivity and responsiveness) instead of code driving actions,
    code adapting itself “live” according to user actions


    # Results


    +   - Accuracy


    +   - Simplicity


    +   - Efficiency, including performance and reliability, with the time factor
    calculated based on optimal time-to-deliver, time-to-deploy, time-to-value, time-to-market,
    and the emerging imperative of'
  merge: -1
