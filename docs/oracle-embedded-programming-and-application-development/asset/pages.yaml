    Generally, the parallel pipelined table function approach leads to an order of
    magnitude faster than the bulk-binding approach. However, individual results may
    vary with the number of input records and the database resources available. For
    complex processing requirements, such as fanning multiple rows for each input
    row, the pipelined table approach can prove beneficial, as the bulk-binding approach
    requires FORALL to be used multiple times.


    Always use schema-level types rather than PL/SQL types when defining the collection
    for the table function. This provides declarative control rather than programmatic
    control, in addition to the ability of being stored as database row sets.


    When defining the pipelined table function, always encapsulate it in a PL/SQL
    package. This approach isolates it from database dependencies. Every procedure
    in a package can be used for the bulk-binding approach using FORALL.


    Additional postprocessing primarily involves outputting the processed results
    to a target table or to a different calling environment, such as a data grid on
    a Web page or as an input parameter of REF CURSOR to a calling embedded language
    routine for result set shareability. Here are the techniques involved:


    If the data validation and logic transformation can be moved into SQL itself,
    the logic is simply an INSERT...SELECT into the target table or the REF CURSOR
    parameter. For the former, the DML error-logging facility in Oracle10g Release
    2 can be used, as well as the multitable INSERT and the MERGE features. This can
    be done in direct path to bypass the buffer cache.


