    spanning multiple lines of business and multiple use-case scenarios (transactional/operational,
    analytical, on-demand, predictive and descriptive business intelligence, etc.)

    * Autosynchronization and state-full capabilities for data-in-transit and data-at-rest,
    as well as the Web representational state


    > In nutshell, application consistency maintains the need for active application
    processes that run in real-time, all the time, and asynchronously to ensure a
    transparent consistent state of the end-to-end application that provides the right
    data to the right user at the right time.


    Here’s a recommended list of the practices for the same that are top line:


    +   * Implement cross-transactional consistency in Web-based DML operations using
    distributed in-memory data replication and a “virtual” two-phase commit mechanism.
    A key design indicator for this is to synchronize replication and commit operations
    that can be implemented using policy-based imperatives to manage various commit
    points.

    * Minimize the creation of IT processes by reusing the in-place design to “generate”
    derived processes for extended business needs that can be componentized at an
    individual level or in combination—a huge performance gainer in large-scale solutions.'
