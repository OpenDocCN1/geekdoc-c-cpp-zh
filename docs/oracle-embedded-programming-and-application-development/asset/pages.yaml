  md: '# 8.5.3 Testing of the Application Solution


    This primarily involves end-to-end testing of the application and tracking the
    order of execution of code. You track the count, time, and execution of each individual
    execution unit within the program (this may be a single line or another subprogram
    call); the same statistics for each of the descendant subprograms of the calling
    subprogram and the caller and called subgraph information; and finally the resources
    used in executing the program. A detailed procedure for end-to-end application
    testing has been outlined in the subsection "Application Development Framework:
    A Pragmatic Best-Possible Solution" in this chapter. A detailed procedure for
    monitoring application code has been outlined in the subsection "Performance Tuning
    Framework" in this chapter, as well as in Chapters 4–7 of Part II. Of key importance
    is the Proof-of-Performance benchmarking as part of preemptive performance testing
    described in the section "Code Accelerators for Rapid Application Development:
    Design and Coding Aspects" of Chapter 7. A combination of the techniques presented
    provides a set of tools to test and monitor the code execution profile, with breakup
    of SQL, PL/SQL, and application code executions.


    Monitoring the end-to-end activity of the solution includes end-user activity
    and business activity on the business-functionality side, and the workflow and
    services execution and automation on the IT side. This can be streamlined into
    a workflow-based automated process that comprises a firewall, auditing, and log
    management at the network, database and the Web application levels, using Oracle
    Database Vault, Oracle Audit Vault, Web Application firewall, and Oracle Total
    Recall.


    The debugging framework presented here can be automated by constructing a generic
    debug utility as part of a code library that incorporates this framework. The
    design and coding steps for such a utility can be derived from those built in
    this debugging framework and implemented as an additional automated process in-lined
    into the end-to-end solution workflow.


    # Summary


    This chapter described application development frameworks. It touched upon the
    pragmatics of an application development framework for a best practice transactional
    and reporting and analysis solution; a master error management framework; a master
    auditing framework; a performance-tuning framework; and a debugging framework
    from the perspective of Oracle-based embedded programming application construction
    and development.'
