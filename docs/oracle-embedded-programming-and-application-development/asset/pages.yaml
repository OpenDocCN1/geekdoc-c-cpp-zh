  md: 'Likewise, a particular subprogram can host to a number of such debug messages.
    Any debug logging framework can be devised to generate and log debug messages
    inside areas of code that are identifiable as important and/or critical. A brief
    outline of the steps involved:


    +   1. Create two tables called DEBUG_LOG and

    CUSTOM_DEBUG_MESSAGES (similar to the

    ERROR_LOG and CUSTOM_ERROR_MESSAGES tables as

    described in the Master Message Management Framework). The

    second table defines a master list of all possible debug messages to

    be pooled together; it is optional. If the second table is omitted,

    the first table can serve as the central repository of all debug-

    sages in place.


    +   2. You can flip-flop the logging of the debug messages by using an audit control
    table. The audit control table for error logging can be modified to add another
    column called DEBUG_ON, which turns debugging on and off in a session on an individual
    application/module/program basis. Each program is debug-logged only if logging
    is turned on. Application contexts can be used instead of a control table if the
    number of applications/modules needing debugging is not large so that control
    is more secure and tightly integrated. This table can also be used to control
    on-demand debugging based on external criteria, such as user authentication, in
    addition to at the application/subprogram level. Situations that demand debugging
    be turned off include batch processes (especially when huge number of rows) and
    initial loads to ETL processes.


    +   3. You can implement concurrency control while logging debug messages by capturing
    the unique OS user of the current session, rather than the user login or the database
    user login, in conjunction with the calling/called program information. This allows
    you to log information about users executing a program with maximum accuracy,
    in case the same program is called by multiple sessions or is called multiple
    times in the same session. All of the embedded programming languages provide the
    ability to implement this using CLIENT IDENTIFIER indicators that can be used
    in single-sign-on (SSO) as well as secure proxy authentications.


    Listing 8.7 shows the code for the table structures mentioned.'
