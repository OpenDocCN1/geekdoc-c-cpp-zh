    # 5.2 Best Practices to Reduce the Probability of Errors and Enable Quick Resolution


    The best practices to minimize errors associated with the database, application,
    and presentation layers:


    +   - Leverage Oracle11g DB and solution functionality to implement existing features
    that are both powerful and efficient.

    - Pre-analyze the scope of potential errors and their resolution by conducting
    design reviews, peer code reviews, and improvement of the same.

    - Do an iterative "fire-drill" simulation test of each program/application module,
    beginning in the development phase; this ensures that the solution module in context
    is as error-proof as possible, before it goes to other phases of testing. A good
    way is to capture "live" snapshot of relevant data and inputs to perform the testing.
    This enables Agile Testing by iterative test cycles on an as-basis.

    - Learn from production deployments by capturing the errors and their diagnostics
    and resolution practices, and use these as baselines for error management. This
    enables means of quantifying errors akin to measuring their impact; it can help
    in determining preempt actions for error prevention in future runs or deployments.

    - Take the best practices pragmatics to the next level, creating error instance
    templates (visual and/or categorical) by using the derived baselines and their
    analyzed results.'
