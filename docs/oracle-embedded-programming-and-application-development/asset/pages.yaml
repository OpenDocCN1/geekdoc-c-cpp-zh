    PLW. You can enable and disable these warnings in three ways:


    +   1. At the database level, by setting the plsql_warnings initialization parameter.

    2. At the session level, using the ALTER SESSION SET plsql_warnings command.

    3. Using the DBMS_WARNING package.'
