  md: 'Best Practices for Data Structure Management


    # 4.2.1 Database Implementation


    Oracle1lg is an object-relational database, and its data representation preserves
    the key criteria of a RDBMS by allowing the following:


    +   * All data to be represented in a “flattened” row/column format

    * Row/column values to be atomic

    * Each row to be uniquely identifiable

    * All values in a single column to be of the same (data) type

    * The order of columns to be insignificant by default

    * The order of rows to be insignificant by default

    * Each column to be identifiable by an unique name


    In addition to this representation, Oracle1lg has extended its database semantics
    to support complex data and “object” data in the following ways:


    +   * Non-atomic and heterogeneous data in a single column (non-atomic data includes
    multiple values of the same data type being stored in the single column value)

    * Object support via user-defined types and associated behavior inside the database

    * Multirepresentative data and binary data (such as text documents, audio, video,
    images, and Web-based semantic structures) by means of collections, large objects
    (LOBs), geospatial object types, XML types, and so on


    The object support in the database merges the programming capabilities of OOPLs
    and the DB capabilities of persistent storage of unstructured data in native DB
    format. By using SQL-based language to query/update this data, there is no need
    for a separate API layer to achieve the same.


    This way, all types of data can be stored, accessed, and updated using one seamless,
    standard SQL-based and declarative data definition (via SQL-compliant and efficient
    data structures), manipulation, and control language.'
