  md: '# Best Practices for Application Management


    +   - Timely access to quality information is critical to business success. However,
    building the necessary foundation can seem a daunting task to IT organizations
    faced with more project requests, an increasing number of data sources, growing
    data volumes, and evolving systems.


    +   - Protecting mission-critical data and PII (person identifiable information)—This
    involves determining “critical” hotspots and the segregation of mission-critical
    data and PII across customer/end-user domains, business domains, and end-to-end
    access touch points to protect the data from being compromised in terms of potential
    data leakages, privileged user abuse, and external vulnerabilities like threats,
    hacking, and the like.


    +   - Self-service adaptability—This allows for dynamic user interactivity; superior
    customer experience: easy, effective, and efficient extensibility to future add-functionality;
    transparent integration with external applications; and a collaborative unified
    view of information across the enterprise.


    +   - Solution efficiency—High performance by design, using an optimal architecture,
    and interactive Web 2.0 GUI to deliver a personalized Web presentation dashboard,
    A-A-A availability, and improved analytics enables all this by “live” interoperability
    between the application output and offline Microsoft Excel–based smarts. In addition,
