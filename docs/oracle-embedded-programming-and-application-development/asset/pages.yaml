    Also, exception handling with INDICES OF and VALUES OF is possible.


    # INDICES OF in FORALL


    If you have a sparse collection and want to take advantage of bulk operations,
    you can code a FORALL statement using the INDICES OF and SAVE EXCEPTIONS clauses.


    # VALUES OF in FORALL


    Here, you create a secondary collection whose element values are the indices of
    the primary collection. Then you use this value as the script in the original
    collection, which enables you to bulk process based on subsidiary collections
    that drive the DML being processed. This turn eliminates the duplication or replication
    of the original collection elements to be included as part of the secondary collection,
    which is then used in the FORALL statement.


    # 2.3.5 Conditional Compilation (Oracle 10GR2)


    Conditional compilation allows you to conditionally select or include PL/SQL code
    to be compiled and then executed, for example, based on the version of the Oracle
    database. This is done by specifying certain conditions. The conditions are specified
    using preprocessor directives, inquiry directives, predefined compiler flags,
    PL/SQL expressions (with restrictions), initialization parameters, and predefined
    user-defined package constants. One can draw an analogy of PL/SQL code incorporating
    conditional compilation with that of a UNIX shell script. A very good use of conditional
    compilation is to write code that is database multi-version specific, and to compile
    and execute it on different database versions. This way it enables the same code
    to run on multiple versions of the database. Also, activating debugging and tracing
    code conditionally is possible simply by recompiling.'
