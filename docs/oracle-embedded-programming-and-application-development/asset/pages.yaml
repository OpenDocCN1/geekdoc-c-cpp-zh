  md: '# 4.6 Best Practices for Metaprogramming: Use or Eliminate


    Metaprogramming, from a database and application development standpoint, is all
    about collecting and consolidating functional data element definitions and business
    rules into an unified “superdata” definition and language format, so that the
    end-to-end business users have a single common ground for defining and communicating
    across functional units, each with its own data definition and business interpretation
    of the same.


    To implement metaprogramming, the database needs a meta-data repository or schema
    to be created that subsumes all the different business definitions and business
    rules into one common format that can be stored in the same format as the database
    in context, without compromising logical and physical data independence. This
    metadata layer is a consolidated data definition schema that implements a centralized
    design of all the units of business data definitions and their associated business
    rules and stores them in this schema to provide an integrated definition table.


    ```

    As database progresses from “pure” relational to object-relational and involves
    the embedding SQL andor PL/SQL code in 3GL & OOPL code and vice-versa, metaprogramming
    in terms of the metadata layer on the database side (both data definitions & business
    rules) and meta-program layer on the application side (for additional unified
    code modules that cannot be accommodated in the meta-data layer, especially non-declarative
    and complex rules specific to the embedded programming language and business function
    in context) comes close to becoming a standard definition/programming interface
    for Oracle 1g-based embedded programming solution modeling, design, and development.

    ```


    Figure 4.1 illustrates the importance of having meta-data and metaprogramming.


