    # ### 9.1 Simulating Oracle-Based Datasets: Best Practices for Design and Coding


    This section highlights a technique of streaming result sets over a chain of pipelined
    functions that serve as in-memory staged datasets. Dataset staging is used predominantly
    for in-memory processing, such as applications involving online analytical processing
    (OLAP) that require ultra-fast processing and delivery of query results or for
    extract, transform, and load (ETL) to populate a data warehouse wherein the target
    database needs to be fed with data available in an external source or in a different
    database than the target database that uses the data. It is also employed in OLTP
    applications that demand rapid response times for high-volume transactions such
    as high-traffic Web sites—when the data in an OLTP system changes rapidly and
    thus necessitates real-time streaming and/or replication of the sample.


    Table functions have a tight integration with SQL and hence with the Oracle database.
    Table functions, used in tandem with pipelining and parallelization, provide an
    efficient way to do the processing, federation, and streaming of the result sets
    in-memory in case of OLAP applications; the extract, transform, and load processes
    of ETL; or the complex in-memory transactional processing and distribution of
    OLTP systems. This high-performance technique eliminates the need for intermediate
    dataset temporary tables by virtue of its streaming capabilities.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 298 Oracle Embedded Programming


    To understand where a dataset comes into the picture, let us take the example
    of ETL processing for populating a data warehouse. The outline of what ETL is
    and how it is accomplished can enable a better understanding of how a dataset
    stage can be simulated by means of pipelined table functions. A similar theory
    applies to in-memory processing in OLAP or online transaction processing (OLTP)
    systems.


    # 9.1.1 The In-Memory Processing Framework


    The use of PL/SQL, with its tight integration with SQL and the Oracle database
    and its powerful features, provides an efficient way to perform complex data processing
    by eliminating temporary tables and their resource/CPU utilization and performing
    high-performance processing directly in-memory, using a combination of SQL, PL/SQL
    pipelining, and parallelization.


    When the source data is located in a different source database, an initial load
    from the source can be done, followed by a changed data load (if the source data
    is in an OLTP system). The ideal methods are as follows:


    +   Use a single SQL statement with INSERT...SELECT in the direct path to populate
    the intermediate tables for the initial load. This is faster than writing PL/SQL.


    +   Use CDC (Oracle''s Change Data Capture), primarily asynchronous CDC, to populate
    the changing rows into the intermediate tables on a periodic basis.


    In-memory processing is where most of the logic/transformation/ is done. It involves
    the following steps:


    +   Validating input data before processing as necessary


    +   Performing the required processing in-memory


    +   Additional post-processing as needed


    If the validations or logic transformations are simple, they can be moved into
    SQL statements that will be used by the subsequent process. Otherwise, enhanced
    PL/SQL techniques like bulk array processing (bulk binds) or pipelined table functions
    need to be used.'
