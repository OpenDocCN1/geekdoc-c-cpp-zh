- img_proc: true
  md: 'Monitoring involves tracking the way the application is executing, including
    tracking the count of steps involved and the time taken and number of executions
    for each step.


    Tuning involves tuning the SQL and the PL/SQL. SQL constitutes a significant portion
    of code for PL/SQL applications that are data intensive (and most of them). Tuning
    of SQL queries (this comprises not only SELECTS but also UPDATES and DELETES)
    most results in increased performance.


    There are several factors you need to consider while tuning SQL:


    +   - The size of the table

    - The size of the result set

    - How often the table is updated

    - The number of concurrent queries against the table


    Tuning PL/SQL applies to both data-intensive and computationally intensive applications
    and depends on several factors, including:


    +   - Data structures used

    - Data management methods used

    - How the application routines (mostly consisting of packages, dalalone subprograms,
    and trigger code) are coded

    - How the application code is organized


    These factors (for both SQL and PL/SQL) as a whole in turn depend on the type
    of application environment (such as online transaction processing (OLTP), OLAP,
    and so on) and the resource''s availability.


    This section provides a performance framework in terms of SQL and PL/SQL monitoring
    and tuning from an application development perspective.


    # 8.4.1 Framework for Monitoring and Tuning SQL


    First, let''s discuss a framework for monitoring and tuning SQL. The most common
    performance bottleneck of a PL/SQL application is from the embedded SQL included
    in it. The first step is to monitor how the SQL is running so you can determine
    the cause of the poor performance. Once this is determined, the next step is determining
    how to improve the performance. Oracle, as of release 10g, has provided several
    tools that help in monitoring and tuning SQL. The following steps provide a framework
    for monitoring and tuning SQL.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Monitoring the SQL


    You should monitor the SQL used through tracing, SQL Tuning Advisor (as of Oracle
    10g), SQL Access Advisor (as of Oracle 10g), SQL Performance Analyzer (as of Oracle
    11g), Automatic Workload Repository (AWR) (as of Oracle 10g), and Automatic Database
    Diagnostic Monitor (ADD). Monitoring SQL consists of capturing and analyzing the
    SQL for the following criteria:


    +   - Statistics about the parse, execute, and fetch phases, including the number
    of reads, gets, executions, parse calls, elapsed time, CPU memory, usage, and
    I/O usage for each SQL statement in a single session

    - Execution plan for each SQL statement in a single session

    - Identification of long-running SQL at the session or instance level

    - Identification of problematic SQL at the instance level; this includes statistics
    about the various sessions in an instance, as number of reads (session logical
    reads and physical disk reads), executions, CPU load, long-running SQL, session
    and system events, locked objects, waits, I/O usage, database time, resource-intensive
    SQL (and PL/SQL), and any locked objects.

    Statistics about the parse, execute, and fetch phases can be obtained by using
    tracing. Tracing can be done using SQL Trace, which can be enabled via one of
    the following methods:


    +   - The database parameter SQL_TRACE

    - The packaged procedures DBMS_SESSION.set_sql_trace or DBMS_MONITOR.session_trace_enable
    (as of Oracle 10g); the DBMS_MONITOR package enables tracing on multiple sessions


    Once tracing is enabled and the SQL runs, the performance statistics are output
    to a trace file on the database server that can be formatted and read using utilities
    like the tkprof utility. The trcss utility (as of Oracle 10g) can be used for
    merging trace information from multiple trace files into a single file.


    In addition to the previous statistics, the trace file also contains information
    about session waits.


    Execution plans for each SQL statement can be obtained using EXPLAIN PLAN (that
    can be used at the client level) or the packaged function dbms_xplan.display (as
    of Oracle 11R). The trace file generated'
