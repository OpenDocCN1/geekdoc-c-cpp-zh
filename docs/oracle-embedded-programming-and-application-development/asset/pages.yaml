    # 5.3.1 Tracking Error Information for Database Errors (In Any Tier)


    To delve into the details, complete error information for implicitly raised exceptions
    can be captured using an exception handler and by tracking the error code, the
    error message text, the error line number of the first occurrence, the error execution
    stack, and the call execution stack. The call stack is a superset of the error
    execution stack that aids in tracking execution steps during debugging. The error
    execution stack displays the sequence of program steps that lead to the error
    that originally occurred, including the line number. The technique of obtaining
    complete error info can be implemented using code encapsulation in the form of
    packages (primarily PL/SQL-based) that provide the API for getting the error information
    (which includes all of the previous information listed, excluding the call execution
    stack).


    The steps involved in creating such package are as follows:


    +   1. Define a record type or an object type (for a more robust and unified data
    structure) with global scope that contains the error message text (error code
    is part of this), error line information, and the entire error execution stack.
    The error information contains the program owner, program name, and error line
    number for each line in the stack—where“program” refers to one of the called subprograms
    in the top-level program of the stack hierarchy.'
