    with sparse collections. Before Oracle 10g, too many intermediate deleted elements
    resulted in a performance overhead with the SAVE EXCEPTIONS clause.


    +   Using the VALUES OF clause allows you to create a secondary collection, the
    element values of which are the indices of the primary collection. This is a handy
    alternative to copying'
