    # 10.3 Tuning SQL and PL/SQL Code for Optimality


    In Chapter 8, the section on “Performance Tuning Framework” covered the best practices
    on how to approach SQL and/or PL/SQL tuning from a monitoring and tweaking perspective.
    This section highlights the necessary recommended standards and best practices
    to refactor SQL and/or PL/SQL code for efficient execution when embedded in a
    programming language or as a stored program call.


    +   - Use REF CURSORS when passing data between PL/SQL and embedded language environments.
    Passing a pointer to a result set is more effective than passing the entire row
    set, in this case. This preserves the underlying column iteration, too. Declare
    cur-variables used to return result sets as weakly typed. This ensures that the
    definition of the cursor variable isn''t constrained.'
