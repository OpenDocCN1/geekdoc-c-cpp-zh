    Key aspects to focus on are:


    +   - Page-sectioning and partitioning at run-time can be done with dynamic HTML
    and the dynamic “logic” content inclusion.

    - Passing parameters from the Web client to the database can be done using HTML
    forms or URL links with hard-coded parameter values. The former is a rich and
    more flexible method that enables input validation and user selection.

    - Parameter values can be reused by storing them in non-display elements in the
    HTML form or in cookies. The PL/SQL Web toolkit has API to set and get information.
    An alternative to this is a database solution that involves storing these parameters
    in tables or PL/SQL structures. Concurrency issues must be taken into consideration
    when using this approach.

    - SQL result-sets can be processed dynamically and returned to the Web client
