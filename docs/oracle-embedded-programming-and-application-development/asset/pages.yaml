    a Web Service for multitenancy—that is, a single physical instance of the solution
    can be partitioned into one or more virtual user-centric instances of the same,
    dynamically. Each Web Service can be accessed using a calling API that can be
    embedded in other applications, or via a Web-based interface such as a browser.
    Data Services and Web Services are special cases of Web Services calls that are
    specific to data/content unification and delivery and are Web Services-implemented
    using Java or J2EE technology, respectively.


