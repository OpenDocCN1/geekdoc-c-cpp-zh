    +   - Auto-adaptability for efficient execution—The code should be auto refactorable
    to adapt to changing business needs, optimization, and scalability. This means
    that no recoding is necessary to accelerate the solution efficiency. Efficiency
    can be achieved via a combination of techniques such as dynamic generation of
    code within runtime, pipelined execution (akin to vertical parallelism), parallelization,
    and componentized code modules that enable vector processing based on multiple
    inputs (scalar, set-based, and even processes) using the single packet of code.
    Oracle PL/SQL and the related embedded programming languages all support coding
    in this manner, both in-database and in the application.


    +   - Acceleration via modular design or partitioning across Oracle11g database
    Tier, (Web) Application Server Tier, and end-point UI (i.e. Web browser, mobile
    device, etc.)—This means that the design of such a code accelerator adapts to
    the rule “there is no code design that fits all the Tiers end-to-end.”


    +   - Test-driven development and implementation—Evolving efficiency as well as
    resource utilization, by going through cycles of testing, each iteration resulting
    in an increased performance gain, without any compilation and /or execution overhead.
    This can be implemented by a collaborative testing platform that enables side-by-side
