  md: '# 7.9.2 Web Services


    Implementing best practices as Web Services based on SOA enables multi-tenancy
    of business services by way of deploying and running a single instance of the
    application solution on a dedicated server, and enabling multiple clients (or
    users) to access the solution using copies (or images) of the server-based application
    solution instance. This is done using virtual partitioning of the single server.


    Web Services enable seamless deployment and use of the solution in on-demand (true-hosted
    or cloud-based), on-premise, and hybrid platforms. Access control and management
    can be done via a centralized visual control (e.g., Oracle Enterprise Grid Control)
    or programmatic API. The latter involves called Web Services.


