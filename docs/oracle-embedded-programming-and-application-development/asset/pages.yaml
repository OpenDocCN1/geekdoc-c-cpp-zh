    # 5.5 Techniques for Halting Further Processing on Error Occurrences


    An important aspect of exception handling is what to do when an error occurs.
    This raises three options: Should we halt further execution when an exception
    occurs, ignore the error and continue processing, or let the exception fall through
    and handle elsewhere? Of the three, the execution at a critical error-point is
    of significant relevance. As an example, errors resulting from high-severity validations
    and business rules cannot allow the application to continue processing beyond
    the point of occurrence. Ignoring the error can be useful when it does not impact
    the control flow of the application from one logical point to another. This is
    true even if the error is at the application code level only. The third option,
    letting the exception fall through, should be employed when exception occurring
    is handled at a later point of time, but should not be loose until the outermost
    calling program. This is done by re-raising the exception in each of the enclosing
    codeblocks. If there is a sequence of subprograms calling one another resulting
    in a call stack, the exception that first occurred should be re-raised in each
    and every subprogram and handled by either re-raising in the outermost calling
    program or handling otherwise.


