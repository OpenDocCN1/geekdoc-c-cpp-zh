    takes the level of security beyond the designed set of fine-grained policies and
    access controls, but also provides continuity. This approach is especially useful
    when the data integration needs to expand or the underlying technology is augmented
    with newer technologies to keep pace with the ever-evolving IT landscape.


    Implement using a database activity monitoring and security (DAMS) process as
    part of the solution workflow, automating the security controls as well as the
    user end-to-end session activity. This can take care of provisioning and deprovisioning
