  md: '# Introduction


    THE SINGLE-GOAL-OF-TRUTH IS “RESULTS ARE ALL THAT MATTER”. (NO PUN INTENDED!)


    Programming is program coding and a program is code—all code and nothing but code.


    Oops! Did I state it correctly, or not just correctly but also accurately? The
    answer to this lies in the rollercoaster ride that through from its inception
    to its current state.


    Programming as it stands today extends far beyond blazing-fast computations and
    subcomputations to accommodate so-terminated applications, application platforms,
    and solutions. The fundamentals behind the foundations of programming, from synthesizing
    computations to synthesizing code to hiding code details (referenced via such
    famous terminology as algorithms, subroutines, divide-and-conquer, etc.) and those
    behind its usability (or the results of executing programs for the best accuracy,
    simplicity, and efficiency) still hold as the crux of programming. Programming
    as it evolved from a coding-only paradigm to a solution-oriented. In this process,
    the incorporated high-level (or, next-level) feature set has also evolved from
    code to code patterns and code design patterns which are more tailored towards
    solution design than just pure code. And this emergence in programming encompasses
    multiple dimensions in terms of procedural-to-declarative code modularization,
    object-oriented programming (OOP), practices such as inheritance and code encapsulation
    (which has re-conceptualized the programming paradigm by enabling code to be viewed
    in terms of analogous objects in the real world), code reuse, code archiving,
    best-possible, best-in-time, best-fit, and so on. This breadth has resulted in
    the design of new and proven code structures and more, such as code templates,
    libraries (statically and dynamicallyable), software layers that comprise'
  merge: -1
  pgno: 19
- img_proc: true
  md: "# xx Oracle Embedded Programming\n\ncode-design architectures in addition to\
    \ code, hot-pluggable code (during development as well as at run-time (object\
    \ code libraries)),code dynamism (which includes code that's not fully interpretable\
    \ until execution time as well as code-generating code); managed code and unmanaged\
    \ code; organized code (this is not only the technical aspect but also the documentation\
    \ aspect—code that's well-documented is code that has greater maintainable lifetime\
    \ value); extensible-code; reverse-engineering and re-engineering code (this applies\
    \ especially to code-as-a-solution-platform); code deployment using a multitude\
    \ of implementations, specific to a language and some generic across multiple\
    \ languages; and finally independent code that's portable-cross-hardware, cross-OS,\
    \ and cross-tier (interactivity and integration across multiple tiers or layers\
    \ of the solution architecture); for example: \n\nDatabase Layer -> Middle Layer\
    \ -> Application Layer\n\n+   - Middle Layer: application servers, application\
    \ boosters, application accelerators, Web servers, etc.\n- Application Layer:\
    \ unified presentation layer for end-user access, transparent caches, translucent\
    \ caches (as in mobile access points), disconnected data sources, etc.\n\nThis\
    \ is an exponentially evolving curve—consider the possibilities of code suited\
    \ for an application solution platform that can be used as SaaS (software as a\
    \ service) and regulatory code (Governance, Risk, and Compliance (GRC) guidelines,\
    \ including access and identity management compliance, far beyond its use as just\
    \ an (executable) software program.\n\nBecause programming has so many facets,\
    \ an architectural layer must be designed and implemented well before the actual\
    \ coding can begin. The design and coding process is in turn governed by an established\
    \ set of rules and methodologies, from coding standards to coding standards, and\
    \ from code ethics to software ethics, and solution architecture best practices.\
    \ On close to heels are the administration tasks, in terms of managing the designed\
    \ and coded solution that begin with testing to achieve a tried, tested, and true\
    \ grade level.\n\nAfter the code is ready to be implemented, there's another new\
    \ task, that of configuring the code.\n\nAnd then there is the issue of security,\
    \ which introduces a whole new dimension:"
  merge: -1
