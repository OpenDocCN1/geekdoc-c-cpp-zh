  md: '# 212 Oracle Embedded Programming


    Inlining application security into business IT solution design by process automation
    is probably one of the best practices for security end-to-end, especially when
    the solution in context is custom-built as a new application. It can be achieved
    by architecting the design for security and its management at the solution design
    phase (as opposed to doing it after the build phase, as is generally the case)
    and by integrating with the respective IT processes (vis-à-vis business processes),
    so that IT security becomes part of the arteries of the end-to-end solution. The
    benefits derived are twofold:


    +   1. It is easier to fix the design of the process where a particular violation
    occurred and sync it with the code and the overall Web workflow than to identify
    the same at the testing phase and redo the work completely (including code changes)
    to fix it.


    +   2. It eliminates the need to develop repeatable security fixes that are needed
    for effective and efficient security to be in place.


    To implement this strategy in practice, a code accelerator can be used to enable
    application-aware and policy-aware code design and implementation, which can be
    automated and integrated into the overall process workflow. Any additional rules
    needed to be plugged into the appropriate code accelerator by adding new code
    or an entirely separate code accelerator. These extra rules will surface during
    the iterative test-driven development and deployment before delivering the solution
    to the production environment.


    > Any latency in time-to-delivery caused by this approach can be defied compared
    to the costs required to fix issues in the deployment and post-production stages,
    which of course can be very large.


    For a solution based on embedded programming languages, just designing with in-built
    security policies is not enough. To implement the design for effective use, the
    associated code must be efficient on par with the design. This in turn depends
    on the language-specific coding run-time deployment platforms – to account for
    security lapses due to bad coding practices and level of security supported (or
    rather limited) by the run-time platform.'
