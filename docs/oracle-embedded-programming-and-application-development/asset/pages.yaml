  md: '# Oracle Embedded Programming


    The development of an embedded programming solution based on Oracle11g requires
    the use of application programming interfaces (APIs) to interact and interoperate
    between the different layers or tiers of the solution: namely, the database Tier,
    the intermediate or middle Tier (if any), and/or the application/presentation
    Tier. Also, it might involve interaction with additional URL-identifiable sites.
    This kind of Web interfacing (may also be needed sometimes on-the-fly) can make
    the solution more error-prone, as the solution in context has no control over
    the extraneous Web layer. This situation also holds true for external sources
    interfacing with Oracle11g.


    Runtime errors can be classified into the four broad categories:


    +   Database-related errors—These include errors due to failure of embedded SQL
    statements, errors due to failure of in-database stored logic from the embedded
    SQL program, errors due to failure of transactions or inconsistent transaction
    states, and errors due to uncommon reasons—for example, a system or database crash.
    Most of these errors are implicitly raised, and Oracle handles these situations
    via predefined named exceptions and unnamed DB server exceptions. The Developers''
    role is to trap, resolve, and/or propagate these errors upstream.


    +   Programming language/application-related errors—These include errors due to
    failure of SQL-PL/SQL—and/or programming language-specific code, and errors due
    to failure of application logic, such as application-level validations due to
    improper input/action from the end user or violation of business rules. These
    can be handled using custom routines that translate, transform, or merge the DB-related
    logical error info and the pure language-specific error info. Even customized
    error codes and messages can be used, needed.


    +   Presentation interface-related errors—These include errors due to display
    of information and/or visual components at the end-user UI, inconsistencies between
    Web-exposed browser states, invalid object resolution between Web-enabled application
    services, and/or HTML/Flash-based Web pages.


    +   In addition, errors due to ripple effects, multiple programs losing scope
    and state across the different tiers of the solution, and so on can be raised.'
