    # 1.1 Embedded Programming from an Oracle Perspective: The Primary Indicators
    and the Solution Life Cycle


    Let’s revisit the last paragraph of the Introduction: to put these principles
    into practice in the best possible manner to result in a “best-fit” solution,
    encompassing all possible Oracle-based embedded programming solution scenarios—just
    that and nothing that. This book details the what, when, not, why, and how of
    delivering a best-fit solution in terms of the business/customer perspective,
    the technology perspective and the important (but less-focused on) programmer/developer/technical/solution
    architect/implementer perspective.


    Any application solution is focused on a combination of the business landscape,
    the technology landscape and the user landscape. There is no one-size-fits-all
    single out-of-the-box solution that encompasses the three major landscapes in
    terms of business and user requirements and the technologies, architectures, and
    programming languages involved. The same is true for an Oracle-based embedded
    programming solution. This is because the business needs (functionality and user
    experience combined), the business value (performance and lifecycle), and the
    technologies and methodologies used are like snowflakes—no two are alike. However,
    a solution that is a best-fit is the ideal implementation answer that intersects
    the three landscapes.


    The following list highlights the primary indicators that drive the embedded programming
    solution and the big picture of its end-to-end life cycle, using Oracle11g as
    the primary database:


    +   Alignment of IT and business processes for the life cycle of the business
    to supplement, support, or extend the business side of the solution


    +   Flexibility and adaptability to new and emerging technologies (at least at
    the design level, in terms of solution architecture model, business process model,
    and IT process model), in case the life cycle of the technology involved in the
    IT solution is short compared to the life cycle of the business; this might involve
    extension of the existing technical architecture by adding/changing new technical
    modules and/or submodules to arrive at the same business results (scope, time,
    cost, and quality)'
