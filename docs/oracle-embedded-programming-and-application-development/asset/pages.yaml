    dependency tracking.


    Oracle 11g introduced the concept of a compound trigger. Instead of defining multiple
    triggers, each of a separate type, the compound trigger has sections for BEFORE/AFTER
    and STATEMENT/EACH ROW. This way, the state of the variables can be maintained.
    For example, any variables defined before the BEFORE STATEMENT section persist
