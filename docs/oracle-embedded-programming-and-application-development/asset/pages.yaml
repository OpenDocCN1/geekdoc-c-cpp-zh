  md: '# Best Practices for Application Management 213


    Introduce static code testing and dynamic code testing, which are crucial for
    identifying both code flaws as well as code vulnerabilities. Static or “white
    box” testing enables the detection of semantic errors and other code discrepancies
    that are inherent to the solution, including those that impact execution performance.
    The best way to put static code testing in practice is to use an Oracle-based
    integrated development environment (IDE) (e.g., OracleDeveloper, Oracle APEX,
    Oracle Developer Tools for .NET, etc.) that has in-built “radar detectors” that
    scan for code errors and alert on “as-is” basis during the testing while developing.
    Another intuitive way is to turn on database-level code optimization parameters
    and enable the same at the language-specific level, augmenting them with custom
    code accelerators that scan for code flaws.


    A recommended best practice is to always enable the code optimization parameters
    at the DB as well as the language-specific levels during the development-test
    phases that go-in-hand and/or iterations.


    On the other hand, dynamic code testing, or “black box” testing, is the best practice
    for radar-detection of vulnerabilities such as hacking, attacks, and emerging
    threats like privilege manipulation and escalation, SQL Injection, and cyber-threats.
    The easiest way to implement this is by simulated hacking or penetrating testing
    that is manually done in a “fire-drill” type code. However, the recommended best
    practice is to use a code accelerator that adopts a pre-emptive design using code
    to create the beside (subscribed) solution-code in all possible ways, automated
    and streamlined into the end-to-end-workflow. This comes in handy for scanning
    “out-of-solution” attacks (i.e., those that result from user interaction/exploitation
    and expose vulnerabilities in the code).


    Dynamic code testing needs to be augmented with an overall solution activity monitoring
    module that comprises database activity monitoring and database firewall; Web
    application monitoring and Web application firewall; and network activity monitoring
    and network firewall. By doing this, risk assessment and back-tracing of the source
    code that caused it can be analyzed so the right remediation measures can be taken.
    This is part of the application-solution white-listing and black-listing, in terms
    of isolating its components into “go-ahead” and “no-go” categories. This addresses
    issues that are often not detectable by traditional firewalls and antivirus software.


