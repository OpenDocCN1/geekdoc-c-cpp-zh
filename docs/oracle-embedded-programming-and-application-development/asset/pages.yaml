  md: 'SQL-PL/SQL. In this case, it is important to identify the typical time-out
    in seconds for the embedded language solution in context (i.e., in Java, .NET,
    or PHP/Ajax-based solutions). The average timeout is approximately 25–30 seconds
    (though this parameter can be controlled by a configuration specification). As
    Oracle11g allows the table being updated, updates on multiple columns and huge
    row-sets dramatically impact the performance of the Web-based application, as
    this also increases the size of the transaction log/rollback segment. In this
    scenario, Oracle11g allows to leverage SQL array processing based on an insert/update/delete
    statement so that the data change is done in batches of size n, where n is a reasonable
    positive number to balance the dataset volume being updated, the disk I/O, the
    CPU-intensive metrics involved, and most importantly, the size of the PGA or program
    global area (that is reserved for application code).


    Typical values for n are 100 or 1,000. A value greater than 1,000 can also be
    used, but keep in mind that the larger value, the more PGA resources consumed,
    even if the response time is fast.


    For each update batch, a commit is to be issued so that it resets the rollback
    segment and a scheduled job by event processing can take online backup of the
    transaction logs as the updates are committed for each batch.


    Here is a code snippet that illustrates the same with a batch size of 1,000:


    ```

    BEGIN

    LOOP

    UPDATE appl_tran_tab SET depend_val1 = :1, depend_val2 = :2

    WHERE tran code = :3 AND ROWNUM <= 1000;

    IF SQL%ROWCOUNT = 0 THEN

    EXIT;

    END IF;

    COMMIT;

    END LOOP;

    END;

    ```'
