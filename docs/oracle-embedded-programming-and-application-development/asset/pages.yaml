  md: 'A testing framework that can be used as a “benchmark by design” results in
    a solution that is less error-prone while at the same time enabling quick debugging
    and fixing of any errors that do arise. This framework can be implemented using
    a layered approach to error prevention, detection, debugging, and resolution.


    Any Oracle11g-based embedded programming solution primarily has the following
    n-Tier structure:


    +   - The database Tier, comprising the Oracle11g Database.

    - The intermediate Tier, comprising the middleware software that enables interprocess
    and data communication/collaboration between the database Tier and the presentation
    Tier. This Tier can be optional in certain cases.

    - The presentation Tier, comprising a Web-based user interface (UI) that is both
    user-friendly and business-savvy, enabling both technical and nontechnical users
    to interact with the solution in a seamless manner via push-button actions, click-and-go
    information visualization, Flash-based user action-response, personal search features,
    and the like.


    The key indicator for a robust error prevention, detection, and resolution strategy
    is to architect a framework that seamlessly integrates across each of these Tiers.
    A proactive and pre-emptive framework methodology involves a Fast-Actionable-Synchronized-Tested
    (FAST) validation, monitoring, debugging, and testing architecture that supports
    the multi-cycle, in-stant Agile testing paradigm, and can be implemented using
    built-in code modules, and functionality, in combination with existing Oracle11g-supported
    tools and functionality. After all, the purpose of a solution is to store, access,
    process, and present “data, data everywhere” without “dropping” on the business
    (and hence IT) value of it.


