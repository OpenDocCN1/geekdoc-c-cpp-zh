  \n我们希望源文件能像报纸文章一样。名称应该简单且具有解释性。名称本身应该足以让我们判断我们是否处于正确的模块中。源文件的最顶部部分应该提供高级概念和算法。随着我们向下移动，细节应该增加，直到最后我们在源文件中找到最低层次的函数和细节。\n\
  \n报纸由许多文章组成；大多数非常小。有些稍大一点。极少数文章包含一页纸所能容纳的文本。这使得报纸变得`可读`。如果报纸只是一个包含杂乱无章的事实、日期和名称的长故事，那么我们根本就不会读它。\n\
  \n### 概念之间的垂直开放\n\n几乎所有的代码都是从左到右、从上到下阅读的。每一行代表一个表达式或句，每组行代表一个完整的思想。这些思想应该用空行彼此隔开。\n\
  \n例如，考虑列表 5-1。有空行将包声明、导入（s）以及每个函数隔开。这一极其简单的规则对代码的视觉布局产生了深远影响。每个空行都是视觉线索，识别出一个新的且独立的概念。当你扫描列表时，你的视线会被空行后的第一行吸引。\n\
  \n**列表 5-1** `BoldWidget.java`\n\n```java\npackage fitnesse.wikitext.widgets;\n\n\
  import java.util.regex.*;\n\npublic class BoldWidget extends ParentWidget {\n\n\
  \    public static final String REGEXP = “’’’.+?’’’\\\";\n\n    private static final\
  \ Pattern pattern = Pattern.compile“’’’(.+?)’’’”,\n    Pattern.MULTILINE + Pattern.DOTALL\n\
  \    );\n\n    public BoldWidget(ParentWidget parent, String text) throws Exception\
  \ {\n        super(parent);\n        Matcher match = pattern.matcher(text);\n  \
  \      match.find();\n        addChildWidgets(match.group(1));\n    }\n\n    public\
  \ String render() throws Exception {\n        StringBuffer html = new StringBuffer（<b>”);\n\
  \        html.append(childHtml()).append(“</b>”);\n        return html.toString();\n\
  \    }\n}\n```\n\n去掉这些空行，如列表 5-2 所示，会对代码的可读性产生显著的模糊影响。\n\n（注：由于原文文本存在严重重复，此处仅翻译核心逻辑部分）\n\
  \n### 垂直密度\n\n如果开放隔开了概念，那么密度意味着密切关联。因此，密切相关的代码行在垂直方向应该是密集的。\n\n### 垂直距离\n\n你是否曾经在类中追着自己的尾巴，从一个函数跳到另一个函数，在源文件中滚动，试图推断函数是如何关联和操作的，结果迷失在混乱的乱麻中？你是否曾沿着继承链寻找变量或函数的定义？\n\
  \n\n\n\n### 变量声明\n变量的声明应该尽可能靠近它们使用的地方。由于我们的函数非常短，局部变量应该出现在每个函数的顶部，就像这个来自 Junit 4.3.1\
  \ 的较长函数一样。\n\n```java\nprivate static void readPreferences() {\n    InputStream\
  \ is= null;\n    try {\n        is= new FileInputStream(getPreferencesFile());\n\
  \        setPreferences(new Properties(getPreferences()));\n        getPreferences().load(is);\n\
  \    } catch (IOException e) {\n        try {\n            if (is != null)\n   \
  \             is.close();\n        } catch (IOException e1) {\n        }\n    }\n\
  }\n```\n\n循环的控制变量通常应该在循环语句内部声明，就像来自同一来源的这个可爱的小函数。\n\n```java\npublic int countTestCases()\
  \ {\n    int count= 0;\n    for (Test each : tests)\n        count += each.countTestCases();\n\
  \    return count;\n}\n```\n\n在少数情况下，变量可能会在一个较长函数的块顶部或循环循环之前声明。你可以从 TestNG 中一个非常长的函数中间的这段片段中看到这样的变量。\n\
  \n```java\n…\nfor (XmlTest test : m_suite.getTests()) {\n    TestRunner tr = m_runnerFactory.newTestRunner(this,\
  \ test);\n    tr.addListener(m_textReporter);\n    m_testRunners.add(tr);\n    invoker\
  \ = tr.getInvoker();\n    for (ITestNGMethod m : tr.getBeforeSuiteMethods()) {\n\
  \        beforeSuiteMethods.put(m.getMethod(), m);\n    }\n    for (ITestNGMethod\
  \ m : tr.getAfterSuiteMethods()) {\n        afterSuiteMethods.put(m.getMethod(),\
  \ m);\n    }\n}\n…\n```\n\n另一方面，实例变量应该声明在类的顶部。这不应该这些这些变量垂直距离，因为在一个设计良好的类中，它们被该类的许多（如果全部）方法使用。\n\
  \n关于实例变量应该放在哪里，一直有很多争论。在 C++ 中，我们通常遵循所谓的*剪刀规则*（scissors rule），将所有实例变量放在底部。然而，Java\
  \ 的惯例是把它们全部放在类的顶部。我没有理由遵循任何其他惯例。重要的是实例变量应该在一个众所周知的地方声明。每个人都应该知道去哪里查看声明。\n\n例如，考虑\
  \ JUnit 4.3.1 中 `TestSuite` 类的奇特情况。为了说明这一点，我大大削减了这个类。如果你查看列表的半部分处，你会看到那里声明了两个实例变量。很难将它们隐藏在更好的地方。阅读这段代码的人必须偶然发现这些声明（就像我发现一样）。\n\
  \n```java\npublic class TestSuite implements Test {\n    static public Test createTest(Class<?\
  \ extends TestCase> theClass, String name) {\n        …\n    }\n    public static\
  \ Constructor<? extends TestCase>\n    getTestConstructor(Class<? extends TestCase>\
  \ theClass)\n    throws NoSuchMethodException {\n        …\n    }\n    public static\
  \ Test warning(final String message) {\n        …\n    }\n    private static String\
  \ exceptionToString(Throwable t) {\n        …\n    }\n    private String fName;\n\
  \    private Vector<Test> fTests= new Vector<Test>(10);\n    public TestSuite()\
  \ {\n    }\n    public TestSuite(final Class<? extends TestCase> theClass) {\n \
  \       …\n    }\n    public TestSuite(Class<? extends TestCase> theClass, String\
  \ name) {\n        …\n    }\n    … … … … …\n}\n```\n\n### 依赖函数\n如果一个函数调用另一个函数，它们应该在垂直方向上接近，并且如果可能，调用者应该在调用者上方。这为程序提供了自然的流。如果可靠地遵循这一惯例，读者将能够信任函数定义将紧随它们之后。例如，考虑列表\
  \ 5-5 中 FitNesse 的片段。注意最顶部的函数如何调用它下面的函数，以及它们反过来如何调用下面的函数。这有助于找到被调用的函数，并极大增强整个模块的可读性。\n\
  \n**列表 5-5** `WikiPageResponder.java`\n\n```java\npublic class WikiPageResponder\
  \ implements SecureResponder {\n    protected WikiPage page;\n    protected PageData\
  \ pageData;\n    protected String pageTitle;\n    protected Request request;\n \
  \   protected PageCrawler crawler;\n    public Response makeResponse(FitNesseContext\
  \ context, Request request) throws Exception {\n        String pageName = getPageNameOrDefault(request,\
  \ “FrontPage\");\n        loadPage(pageName, context);\n        if (page == null)\n\
  \            return notFoundResponse(context, request);\n        else\n        \
  \    return makePageResponse(context);\n    }\n    private String getPageNameOrDefault(Request\
  \ request, String defaultPageName) {\n        String pageName = request.getResource();\n\
  \        if (StringUtil.isBlank(pageName))\n            pageName = defaultPageName;\n\
  \        return pageName;\n    }\n    protected void loadPage(String resource, FitNesseContext\
  \ context) throws Exception {\n        WikiPagePath path = PathParser.parse(resource);\n\
  \        crawler = context.root.getPageCrawler();\n        crawler.setDeadEndStrategy(new\
  \ VirtualEnabledPageCrawler());\n        page = crawler.getPage(context.root, path);\n\
  \        if (page != null)\n            pageData = page.getData();\n    }\n    private\
  \ Response notFoundResponse(FitNesseContext context, Request request) throws Exception\
  \ {\n        return new NotFoundResponder().makeResponse(context, request);\n  \
  \  }\n    private SimpleResponse makePageResponse(FitNesseContext context) throws\
  \ Exception {\n        pageTitle = PathParser.render(crawler));\n        String\
  \ html = makeHtml(context);\n        SimpleResponse response = new SimpleResponse();\n\
  \        response.setMaxAge(0);\n        response.setContent(html);\n        return\
  \ response;\n    }\n    …\n}\n```\n\n\n\n\n\n一行应该有多宽？为了回答这个问题，让我们来看看典型程序中的行宽是多少。我们再次检查这七个不同的项目。[图\
  \ 5-2 显示了所有七个项目行长度的分布。这种规律性令人印象深刻，特别是在 45 个字符左右。事实上，从 20 到 60 个字符的每一个尺寸都约占总行数的 1%。这占了\
  \ 40%！也许还有 30% 的行宽度小于 10 个字符。请记住，这是一个对数刻度，因此 80 个字符以上呈现的线性下降趋势在视觉上实际上非常显著。程序员显然更倾向于短行。\n\
  \n**图 5-2** Java 行宽分布\n\n![Image](img/Image00027.jpg)\n\n这表明我们应该努力保持行较短。旧的 Hollerith\
  \ 80 字符限制有点武断，我不反对将行宽延伸到 100 甚至 120 个字符。但超过这个范围可能只是因为粗心。\n\n我过去遵循这样一条规则：你永远不应该需要向右滚动屏幕。但现在的显示器太宽了，年轻的程序员可以把字体缩小到极小，使得屏幕可以容纳\
  \ 200 个字符。不要这样做。我个人将限制设定在 120 个字符。\n\n## 水平开放性与密度\n\n我们使用水平空白将关联紧密的事联系在一起，并将关联较松的事物隔离开。考虑以下函数：\n\
  \n```java\nprivate void measureLine(String line) {\n    lineCount++;\n    int lineSize\
  \ = line.length();\n    totalChars += lineSize;\n    lineWidthHistogram.addLine(lineSize,\
  \ lineCount);\n    recordWidestLine(lineSize);\n}\n```\n\n我在赋值运算符周围留了空白，以突出它们。赋值语句有两个独特且主要的元素：左侧和右侧。空格让这种分离显而易见。\n\
  \n另一方面，我没有在函数名和左括号之间加上空格。这是因为函数及其参数之间的关系非常紧密。将它们分开会让它们看起来是脱节的，而不是结合的。我在函数调用括号内将参数隔开，以突出逗号并显示参数是独立的。\n\
  \n空白的另一个用途是突出运算符的优先级。\n\n```java\npublic class Quadratic {\n    public static double\
  \ root1(double a, double b, double c) {\n        double determinant = determinant(a,\
  \ b, c);\n        return (-b + Math.sqrt(determinant)) / (2*a);\n    }\n    public\
  \ static double root2(int a, int b, int c) {\n        double determinant = determinant(a,\
  \ b, c);\n        return (-b - Math.sqrt(determinant)) / (2*a);\n    }\n    private\
  \ static double determinant(double a, double b, double c) {\n        return b*b\
  \ - 4*a*c;\n    }\n}\n```\n\n注意这些方程读起来有多整洁。操作因子之间没有空白，因为它们的优先级很高。项之间用空格隔开，因为加法和减法的优先级较低。\n\
  \n遗憾的是，大多数代码重格式化工具对运算符的优先级是不敏感的，并在范围内强制相同的间距。因此，像上面显示的细微间距在重格式化代码后往往会丢失。\n\n## 水平对齐\n\
  \n当我是一名汇编语言程序员时，我使用水平对齐来突出某些结构。当我开始用 C、C++ 以及最后的 Java 编写代码时，我继续尝试对齐一组声明中的所有变量名，或者对齐一组赋值语句中的所有右值（rvalues）。我的代码可能这样：\n\
  \n```java\npublic class FitNesseExpediter implements ResponseSender\n{\n    private\
  \ Socket socket;\n    private InputStream input;\n    private OutputStream output;\n\
  \    private Request request;\n    private Response response;\n    private FitNesseContext\
  \ context;\n    protected long requestParsingTimeLimit;\n    private long requestProgress;\n\
  \    private long requestParsingDeadline;\n    private boolean hasError;\n\n   \
  \ public FitNesseExpediter(Socket s,\n    FitNesseContext context) throws Exception\n\
  \    {\n        this.context = context;\n        socket = s;\n        input = s.getInputStream();\n\
  \        output = s.getOutputStream();\n        requestParsingTimeLimit = 10000;\n\
  \    }\n}\n```\n\n然而，我发现这种对齐并没有用。这种对齐似乎强调了错误的重点，导致我的目光偏离了真正的意图。例如，在上面的声明列表中，你忍不住只想向下阅读变量名列表而不看它们的类型。同样，在赋值语句列表中，你忍不住向下看右值列表，而从不看到赋值运算符。糟糕糟糕，自动重格式化工具通常会消除这种对齐。\n\
  \n所以，最后，我不再做这种事了。现在我更倾向于使用不对齐的声明和赋值，如下所示，因为它们指出了一个重要的缺陷。如果我有需要对齐的长列表，*问题出在列表的长度上*，而不是缺乏对齐。下面\
  \ `FitNesseExpediter` 中声明列表的长度表明这个类应该被拆分。\n\n```java\npublic class FitNesseExpediter\
  \ implements ResponseSender\n{\n    private Socket socket;\n    private InputStream\
  \ input;\n    private OutputStream output;\n    private Request request;\n    private\
  \ Response response;\n    private FitNesseContext context;\n    protected long requestParsingTimeLimit;\n\
  \    private long requestProgress;\n    private long requestParsingDeadline;\n \
  \   private boolean hasError;\n\n    public FitNesseExpediter(Socket s,\n    FitNesseContext\
  \ context)\n    {\n        this.context = context;\n        socket = s;\n      \
  \  input = s.getInputStream();\n        output = s.getOutputStream();\n        requestParsingTimeLimit\
  \ = 10000;\n    }\n}\n```\n\n## 缩进\n\n源文件就像一个大纲。存在关于整个文件的信息、文件中的类、类中的方法、方法中的块，递归地块中的块。每一层级都是一个可以声明名称并解释执行语句的作用域。\n\
  \n为了让这种层级结构可见，我们根据代码在层级中的位置进行缩进。文件级别的语句（如大多数类声明）不缩进。类内部的方法相对于类声明缩进一级。方法的实现相对于方法声明向右缩进一级，以此类推。\n\
  \n程序员严重依赖这种缩进方案。他们通过对齐左侧查看代码处于什么作用域。这允许他们快速跳过无关的作用域，例如 `if` 或 `while` 语句的实现。他们扫描左侧寻找新的方法声明、变量甚至新类。如果没有缩进，程序将几乎无法阅读。\n\
  \n考虑以下在语法和语义上完全相同的程序：\n\n```java\npublic class FitNesseServer implements SocketServer\
  \ {\n    private FitNesseContext context;\n    public FitNesseServer(FitNesseContext\
  \ context) {\n        this.context = context;\n    }\n    public void serve(Socket\
  \ s) {\n        serve(s, 10000);\n    }\n    public void serve(Socket s, long requestTimeout)\
  \ {\n        try {\n            FitNesseExpediter sender = new\n            FitNesseExpediter(s,\
  \ context);\n            sender.setRequestParsingTimeLimit(requestTimeout);\n  \
  \          sender.start();\n        }\n        catch(Exception e) {\n          \
  \  e.printStackTrace();\n        }\n    }\n}\n```\n\n-----\n\n```java\npublic class\
  \ FitNesseServer implements SocketServer {\n    private FitNesseContext context;\n\
  \    public FitNesseServer(FitNesseContext context) {\n        this.context = context;\n\
  \    }\n    public void serve(Socket s) {\n        serve(s, 10000);\n    }\n   \
  \ public void serve(Socket s, long requestTimeout) {\n        try {\n          \
  \  FitNesseExpediter sender = new FitNesseExpediter(s, context);\n            sender.setRequestParsingTimeLimit(requestTimeout);\n\
  \            sender.start();\n        }\n        catch (Exception e) {\n       \
  \     e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\n\n你的眼睛可以迅速识别出缩进文件的结构。你几乎可以瞬间发现变量、构造函数、访问器和方法。只需要几秒钟，你就能意识到这是某种套接字的简单前端，并且带有超时功能。然而，如果不经过深入研究，未缩进的版本几乎无法读懂。\n\
  \n## 破坏缩进。\n\n有时，人们很想对于短的 `if` 语句、短短的 `while` 循环或短函数打破缩进规则。每当我屈服于这种诱惑时，我几乎总是会回去把缩进加回来。因此，我避免像这样将作用域压缩成单行：\n\
  \n```java\npublic class CommentWidget extends TextWidget\n{\npublic static final\
  \ String REGEXP = “^#[^\\r\\n]*(?:(?:\\r\\n)|\\n|\\r)?”;\npublic CommentWidget(ParentWidget\
  \ parent, String text){super(parent, text);}\npublic String render() throws Exception\
  \ {return “”; }\n}\n```\n\n我倾向于展开并缩进作用域，像这样：\n\n```java\npublic class CommentWidget\
  \ extends TextWidget {\npublic static final String REGEXP = “^#[^\\r\\n]*(?:(?:\\\
  r\\n)|\\n|\\r)?”\npublic CommentWidget(ParentWidget parent, String text) {\nsuper(parent,\
  \ text);\n}\npublic String render() throws Exception {\nreturn “”;\n}\n}\n```\n\n\
  ### 占位作用域\n\n有时 `while` 或 `for` 语句的体是空位的（dummy），如下所示。我不喜欢这类结构，并尽量避免它们。当我无法避免它们时，我会确保空位体被正确地缩进并用大括号包围。我无法说我有多少次被静静呆在同一行\
  \ `while` 循环末尾的分号所欺骗。除非你通过将其缩进到单独一行来让分号`可见`，否则它太难被发现了。\n\n```java\nwhile (dis.read(buf,\
  \ 0, readBufferSize) != -1) ;\n```\n\n### 团队规则\n\n这一节的标题是一个双关语。每个程序员都有自己喜欢的格式规则，但如果他在团队中工作，那么就是团队规则。\n\
  \n一个开发团队应该约定一种格式风格，然后该团队的每个成员都应该使用那种风格。我们希望软件具有一致的风格。我们不希望它看起来像是由一群意见不合的个人编写的。\n\
  \n![Image](img/Image00028.jpg)\n\n当我 2002 年启动 FitNesse 项目时，我和团队坐在一起制定了一种编码风格。这花费了大约\
  \ 10 分钟。我们决定了在哪里放置大括号、缩进大小是多少、如何命名类、变量和方法等。然后我们将这些规则编码到我们 IDE 的代码格式化器中，并从那时一直坚持下来。这些并不是我个人喜欢的规则；它们是团队决定的规则。作为该团队的一员，我在在\
  \ FitNesse 项目中编写代码时遵循了这些规则。\n\n记住，一个良好的软件系统是由一组易读的文档组成的。它们需要具有一致且流畅的风格。读者需要能够相信，她在一个源文件中看到的格式写法在其他文件中将具有相同的含义。我们最不想做的事情就是通过用杂乱无章的各种个人风格编写代码，来增加源码的复杂性。\n\
  \n### Bob 大叔的格式规则\n\n我个人使用的规则非常简单，并由代码列表 5-6 中的代码进行了说明。请将其视为代码如何成为最佳编码标准文档的示例。\n\
  \n**Listing 5-6** `CodeAnalyzer.java`\n\n```java\npublic int getWidestLineNumber()\
  \ {\nreturn widestLineNumber;\n}\n\npublic LineWidthHistogram getLineWidthHistogram()\
  \ {\nreturn lineWidthHistogram;\n}\n\npublic double getMeanLineWidth() {\nreturn\
  \ (double)totalChars/lineCount;\n}\n\npublic int getMedianLineWidth() {\nInteger[]\
  \ sortedWidths = getSortedWidths();\nint cumulativeLineCount = 0;\nfor (int width\
  \ : sortedWidths) {\ncumulativeLineCount += lineCountForWidth(width);\nif (cumulativeLineCount\
  \ > lineCount/2)\nreturn width;\n}\nthrow new Error(“Cannot get here”);\n}\n\nprivate\
  \ int lineCountForWidth(int width) {\nreturn lineWidthHistogram.getLinesforWidth(width).size();\n\
  }\n\nprivate Integer[] getSortedWidths() {\nSet<Integer> widths = lineWidthHistogram.getWidths();\n\
  Integer[] sortedWidths = (widths.toArray(new Integer[0]));\nArrays.sort(sortedWidths);\n\
  return sortedWidths;\n}\n}\n```\n\n## 6 对象和数据结构\n\n![Image](img/Image00029.jpg)\n\
  \n我们保持变量为私有是有有原因的。我们不希望其他人依赖它们。我们希望保留随心所欲或临时更改其类型或实现的自由。那么，为什么有这么多程序员自动为他们的对象添加\
  \ getter 和 setter，像暴露公共变量一样暴露他们的私有变量呢？\n\n### 数据抽象\n\n考虑 Listing 6-1 和 Listing 6-2\
  \ 之间的区别。它们都代表笛卡尔平面上一点的数据。然而，一个暴露了它的实现，而另一个完全隐藏了它。\n\n**Listing 6-1** `Concrete Point`\n\
  \n```java\npublic class Point {\npublic double x;\npublic double y;\n}\n```\n\n\
  **Listing 6-2** `Abstract Point`\n\n```java\npublic interface Point {\ndouble getX();\n\
  double getY();\nvoid setCartesian(double x, double y);\ndouble getR();\ndouble getTheta();\n\
  void setPolar(double r, double theta);\n}\n```\n\nListing 6-2 的精彩之处在于，你无法判断实现是矩形的还是极坐标的。然而，接口明确地表示了一个数据结构。\n\
  \n但它代表的不是数据结构。方法强制了访问策略。你可以独立地读取坐标，但必须一起设置坐标。\n\nListing 6-1 另一方面，它是非常清晰地用矩形坐标实现的，并且迫使我们独立操作这些坐标。\n\
  \n隐藏实现不仅仅是在变量之间放置一层函数。隐藏实现是关于抽象的！类并不简单地通过 getter 和 setter 将其变量推出去。相反，它暴露了抽象接口，允许其用户操作数据的本质，而无需知道其实现。\n\
  \n考虑 Listing 6-3 和 Listing 6-4。前者使用具体术语来告知车辆的油量，而后者通过百分比的抽象来实现。在具体案例中，你可以非常确定这些只是变量的访问器。在抽象案例中，你完全不知道数据的形式。\n\
  \n**Listing 6-3** `Concrete Vehicle`\n\n```java\npublic interface Vehicle {\ndouble\
  \ getTankCapacityInGallons();\ndouble getGallonsOfGasoline();\n}\n```\n\n**Listing\
  \ 6-4** `Abstract Vehicle`\n\n```java\npublic interface Vehicle {\ndouble getPercentFuelRemaining();\n\
  }\n```\n\n### 数据/对象反对对称性\n\n这两个例子展示了对象和数据结构之间的区别。对象在抽象之后隐藏其数据，并暴露操作数据的函数。数据结构暴露其数据且没有有意义的函数。回去读读一遍。注意这两个定义的互补性。它们是本质上的对立面。\n\
  \n\n\n\n例如，考虑列表 6-5 中的过程化形状示例。`Geometry` 类对三个形状类进行操作。这些形状类是简单的数据结构，没有任何任何行为。所有的行为都在\
  \ `Geometry` 类中。\n\n### 列表 6-5 `过程化形状`\n\n```java\npublic class Square {\n    public\
  \ Point topLeft;\n    public double side;\n}\n\npublic class Rectangle {\n    public\
  \ Point topLeft;\n    public double height;\n    public double width;\n}\n\npublic\
  \ class Circle {\n    public Point center;\n    public double radius;\n}\n\npublic\
  \ class Geometry {\n    public final double PI = 3.141592653589793;\n    public\
  \ double area(Object shape) throws NoSuchShapeException\n    {\n        if (shape\
  \ instanceof Square) {\n            Square s = (Square)shape;\n            return\
  \ s.side * s.side;\n        }\n        else if (shape instanceof Rectangle) {\n\
  \            Rectangle r = (Rectangle)shape;\n            return r.height * r.width;\n\
  \        }\n        else if (shape instanceof Circle) {\n            Circle c =\
  \ (Circle)shape;\n            return PI * c.radius * c.radius;\n        }\n    \
  \    throw new NoSuchShapeException();\n    }\n}\n```\n\n面向对象的程序员可能会对此此皱起鼻子，并抱怨它是过程化的——而且他们是对的。但这种嘲笑可能并没必要。考虑一下如果在\
  \ `Geometry` 中添加一个 `perimeter()` 函数会发生什么。形状类将不受影响！任何依赖于这些形状的其他类也无受影响！另一方面，如果我添加了一个新形状，我必须修改\
  \ `Geometry` 中的所有函数来处理它。再次读一遍这段话。注意这两个条件是完全对立的。\n\n现在考虑列表 6-6 中的面向对象解决方案。在这里，`area()`\
  \ 方法是多态的。不再需要 `Geometry` 类。因此，如果我添加了一个新形状，现有的函数都不会受到影响；但如果我添加了一个新函数，所有的形状都必须更改！\
  \ ^(1)\n\n### 列表 6-6 `多态形状`\n\n```java\npublic class Square implements Shape {\n\
  \    private Point topLeft;\n    private double side;\n    public double area()\
  \ {\n        return side*side;\n    }\n}\n\npublic class Rectangle implements Shape\
  \ {\n    private Point topLeft;\n    private double height;\n    private double\
  \ width;\n    public double area() {\n        return height * width;\n    }\n}\n\
  \npublic class Circle implements Shape {\n    private Point center;\n    private\
  \ double radius;\n    public final double PI = 3.141592653589793;\n    public double\
  \ area() {\n        return PI * radius * radius;\n    }\n}\n```\n\n同样，我们看到了这两种定义的互补性质；它们是虚拟的对立面！这暴露了对象与数据结构之间根本的二分法：\n\
  \n*过程化代码（使用数据结构的代码）便于在不改变现有数据结构的情况下添加新函数。而面向对象代码则便于在不改变现有函数的情况下添加新类。*\n\n反之亦然：\n\
  \n*过程化代码很难添加新的数据结构，因为所有函数都必须更改。面向对象代码很难添加新函数，因为所有类都必须更改。*\n\n所以，面向对象来说困难的事对过程化来说很容易，过程化来说困难的事对面向对象来说很容易！\n\
  \n在任何复杂系统中，总会有我们想要添加新的数据类型而不是新函数的时候。对于这些情况，对象和面向对象方法是最合适的。另一方面，也会有我们添加新函数而不是数据类型的时候。在这种情况下，过程化代码和数据结构将更合适。\n\
  \n成熟的程序员知道，“万物皆对象”的想法*是一个神话*。有时，你*确实*想要简单的数据结构以及在它们上操作的过程。\n\n### 迪米律\n\n有一个著名的启发式方法称为*迪米律*\
  \ (Law of Demeter) ^(2)，它规定模块不应该知道它所操作对象的内部细节。正如我们在上一节中看到的，对象隐藏其数据并暴露操作。这意味着对象不应该通过访问器暴露其内部结构，因为这样做是暴露而非隐藏了其内部结构。\n\
  \n更准确地说，迪米律规定，类 `C` 的方法 `f` 应该只调用这些对象的方法：\n\n* `C`\n* 由 `f` 创建的对象\n* 作为参数传递给 `f`\
  \ 的对象\n* `C` 的实例变量持有的对象\n\n该方法*不应该*调用由任何允许函数返回的对象上的方法。换句话说，要和朋友说话，不要和陌生人说话。\n\n\
  以下代码 ^(3)似乎违反了迪米律（以及其他问题），因为它在 `getOptions()` 的返回值上调用了 `getScratchDir()` 函数，然后在\
  \ `getScratchDir()` 的返回值上调用了 `getAbsolutePath()`。\n\n```java\nfinal String outputDir\
  \ = ctxt.getOptions().getScratchDir().getAbsolutePath();\n```\n\n#### 火车祸\n\n这种代码通常被称为*火车祸*\
  \ (train wreck)，因为看起来看起来像一串车厢。这种链式调用被认为是粗糙的风格并应该避免。通常做法是将它们拆分为：\n\n```java\nOptions\
  \ opts = ctxt.getOptions();\nFile scratchDir = opts.getScratchDir();\nfinal String\
  \ outputDir = scratchDir.getAbsolutePath();\n```\n\n这些代码片段是否违反了迪米律？取决于 `ctxt`、`options`\
  \ 和 `scratchDir` 是对象还是数据结构。如果它们是对象，那么它们的内部结构应该是隐藏而非暴露，因此了解它们的内部构造显然违反了迪米律。另一方面，如果\
  \ `ctxt`、`options` 和 `scratchDir` 只是没有行为的数据结构，那么它们自然地暴露了内部结构，因此迪米律并不适用。\n\n访问器函数的使用使得这个问题变得混乱。如果代码写成如下，我们可能就不会考虑迪米律了：\n\
  \n```java\nfinal String outputDir = ctxt.options.scratchDir.absolutePath;\n```\n\
  \n如果数据结构仅具有公共变量而没有函数，而对象具有私有变量和公共函数，这个问题就会困惑得多。然而，某些框架和标准（例如“Beans”）要求即使数据结构也拥有访问器和修改器。\n\
  \n#### 混合体\n\n这种混乱有时会导致不幸的混合结构，它们既是对象又是数据结构。它们拥有具有执行重要功能的函数，同时也拥有公共变量或访问器和修改器，这些在在目的上使私有变量公开了，诱使外部函数像过程化程序使用数据结构一样使用这些变量。^(4)\n\
  \n这种混合体使得添加新函数困难，同时也使得添加新数据结构困难。它们是两者中最坏的结合。避免创建它们。它们表明设计混乱，设计者不确定——或者更糟，无知——他们是否需要来自函数或类型的保护。\n\
  \n![图像](img/Image0030.jpg)\n\n\n\n\n\n如果 `ctxt` 是一个对象，我们应该告诉它去 `do something;`，而不应该询问它的内部实现。那么，我们为什么要获取临时目录（scratch\
  \ directory）的绝对路径？我们打算用它做什么呢？考虑同一模块（在很多行之后）中的这段代码：\n\n```java\nString outFile =\
  \ outputDir + “/” + className.replace('.', '/') + “.class”;\nFileOutputStream fout\
  \ = new FileOutputStream(outFile);\nBufferedOutputStream bos = new BufferedOutputStream(fout);\n\
  ```\n\n这种不同层次细节的混合 [G34][G6] 让人有些困扰。点、斜杠、文件扩展名以及 `File` 对象不应该被如此草率地混合在一起，并且要与周围的代码混合在一起。然而，忽略这一点不，我们看到获取临时目录绝对路径的意图是创建一个给定名称的临时文件。\n\
  \n那么，如果我们告诉 `ctxt` 对象执行这个操作会怎样呢？\n\n```java\nBufferedOutputStream bos = ctxt.createScratchFileStream(classFileName);\n\
  ```\n\n这对于一个对象来说似乎是一个合理的操作！这允许 `ctxt` 隐藏其内部实现，并防止当前函数通过导航它不应该知道的对象来违反德得节律（Law of\
  \ Demeter）。\n\n### 数据传输对象\n\n数据结构的典型形式是一个带有公共变量且没有函数的类。这有时被称为数据传输对象，或 DTO。DTO 是非常有用的结构，特别是在与数据库通信或从套接字解析消息时。它们通常是一系列翻译阶段的第一步，将数据库中的原始数据转换为应用程序代码中的对象。\n\
  \n稍微常见的是列表 6-7 所示的“Java 豆（bean）”形式。Bean 具有由 getter 和 setter 操作的私有变量。Bean 的准封装似乎让某些\
  \ OO 原洁者感觉好受，但通常没有提供其他好处。\n\n**列表 6-7** `address.java`\n\n```java\npublic class\
  \ Address {\n\n    private String street;\n    private String streetExtra;\n   \
  \ private String city;\n    private String state;\n    private String zip;\n\n \
  \   public Address(String street, String streetExtra,\n    String city, String state,\
  \ String zip) {\n        this.street = street;\n        this.streetExtra = streetExtra;\n\
  \        this.city = city;\n        this.state = state;\n        this.zip = zip;\n\
  \    }\n\n    public String getStreet() {\n        return street;\n    }\n\n   \
  \ public String getStreetExtra() {\n        return streetExtra;\n    }\n\n    public\
  \ String getCity() {\n        return city;\n    }\n\n    public String getState()\
  \ {\n        return state;\n    }\n\n    public String getZip() {\n        return\
  \ zip;\n    }\n}\n```\n\n### 活跃记录（Active Record）\n\n活跃记录是 DTO 的特殊形式。它们是具有公共（或通过\
  \ bean 访问）变量的数据结构；但它们通常具有如 `save` 和 `find` 等导航方法。通常这些活跃记录是从数据库表或其他数据源直接翻译而来的。\n\n\
  的是我们经常发现开发者试图通过在数据结构中放入业务规则方法，将这些数据结构当作对象对待。这很尴尬，因为在数据结构和对象之间创建了一个混合体。\n\n当然，解决方案是将活跃记录视为数据结构，并创建独立的对象来包含业务规则，并隐藏它们的内部数据（这些数据可能只是活跃记录的实例）。\n\
  \n### 结论\n\n对象暴露行为并隐藏数据。这使得在不改变现有行为的情况下添加新类型的对象变得容易。这也使得给现有对象添加新行为变得困难。数据结构暴露数据且没有显著的行为。这使得向现有数据结构添加新行为变得容易，但使得向现有函数添加新的数据结构变得困难。\n\
  \n在任何给定的系统中，我们有时需要添加新数据类型的灵活性，而在系统的这部分我们倾向于使用对象。其他时候，我们需要添加新行为的灵活性，因此在系统的该部分我们倾向于使用数据类型和过程。良好的软件开发者能够无偏见地理解这些问题，并选择最适合当前任务的方法。\n\
  \n### 参考文献\n\n**[重构 ]:** **重构：改进现有代码的设计* ，Martin Fowler 等，Addison-Wesley, 1999.\n\
  \n## 7 错误处理\n\n作者：Michael Feathers\n\n![图像](img/Image00031.jpg)\n\n在关于关于整洁代码的书中设置一个关于错误处理的章节似乎很奇怪。错误处理只是我们编程时都必须做的事情之一。输入可能是不正常的，设备可能会故障。简而言之，事情可能会出错，当出错发生时，我们作为程序员有责任确保我们的代码执行它需要做的事情。\n\
  \n然而，与整洁代码的联系应该是清晰的。许多代码库完全被错误处理所主导。当我说主导时，我的不是错误处理是它们所做的一切。我的意思是由于所有散乱的错误处理，几乎无法看到代码在做什么。错误处理很重要，*但如果它掩盖了逻辑，它就是错误的*。\n\
  \n在本章中，我将概述许多技术和考虑因素，你可以使用这些因素编写既整洁又健壮的代码——能够优雅且有风格地处理错误。\n\n### 使用异常而不是返回代码\n\n\
  在遥远的过去，有许多语言没有异常。在那些语言中，处理和报告错误的技术是有限的。你要么设置一个错误标志，要么返回一个调用者可以检查的错误代码。列表 7-1 中的代码说明了这些方法。\n\
  \n**列表 7-1** `DeviceController.java`\n\n```java\npublic class DeviceController {\n\
  \n    ...\n    public void sendShutDown() {\n        DeviceHandle handle = getHandle(1);\n\
  \        // 检查设备状态\n        if (handle != DeviceHandle.INVALID) {\n            //\
  \ 保存状态到记录\n            DeviceRecord record = retrieveDeviceRecord(handle);\n   \
  \         // 如果挂起\n            if (record.getStatus() != DEVICE_SUSPENDED) {\n\n\
  pauseDevice(handle);\n                clearDeviceQueue(handle);\n              \
  \  closeDevice(handle);\n            } else {\n                logger.log(\"Device\
  \ suspended. Unable to shut down\");\n            }\n        } else {\n        \
  \    logger.log(\"Invalid handle for: \" + id.toString());\n        }\n\n}\n}\n\
  ```\n\n这些方法的问题在于它们会污染调用者。调用者必须在调用后检查错误。不幸的是，很容易忘记。因此，在遇到错误时抛出异常更好。调用代码更整洁。逻辑没有被错误处理掩盖。列表\
  \ 7-2 显示了在我们选择在检测错误的方法中抛出异常后的代码。\n\n**列表 7-2** `DeviceController.java (使用异常)`\n\n\
  ```java\npublic class DeviceController {\n\n    ...\n    public void sendShutDown()\
  \ {\n        try {\n            tryToShutDown();\n        } catch (DeviceShutDownError\
  \ e) {\n            logger.log(e);\n        }\n    }\n\n    private void tryToShutDown()\
  \ throws DeviceShutDownError {\n        DeviceHandle handle = getHandle(1);\n  \
  \      pauseDevice(handle);\n        clearDeviceQueue(handle);\n        closeDevice(handle);\n\
  \    }\n\n    private DeviceHandle getHandle(DeviceID id) {\n        ...\n     \
  \   throw new DeviceShutDownError(\"Invalid handle for: \" + id.toString());\n \
  \       ...\n    }\n    ...\n}\n```\n\n注意它变得多多整洁。这不仅仅是美学问题。代码更好是因为两个纠缠在一起的关注点——关机算法和错误处理现在分离了。你可以独立地查看每个关注点并理解它们。\n\
  \n### 先编写你的 try-catch-finally 语句\n\n异常最有趣的点之一是它们*在程序中定义了一个范围*。当你在 `try-catch-finally`\
  \ 语句的 `try` 部分执行代码时，你是在声明执行可以在任何点中断，然后在 `catch` 处恢复。\n\n\n\n\n在某种程度上，`try` 块就像事务。无论\
  \ `try` 内部发生了什么，你的 `catch` 块都必须让程序处于一种一致的状态。因此，当你编写可能抛出异常的代码时，从 `try-catch-finally`\
  \ 语句开始是一个良好的做法。这可以帮助你定义该代码的使用者应该期待什么，无论执行 `try` 中的代码时出了什么问题。\n\n让我们来看一个例子。我们需要编写一些代码来访问文件并读取一些序列化对象。\n\
  \n我们先从一个单元测试开始，显示当文件不存在时我们将获得异常：\n\n```java\n@Test(expected = StorageException.class)\n\
  public void retrieveSectionShouldThrowOnInvalidFileName() {\n    sectionStore.retrieveSection(\"\
  invalid - file\");\n}\n```\n\n测试驱动我们创建了这个存根（stub）：\n\n```java\npublic List<RecordedGrip>\
  \ retrieveSection(String sectionName) {\n    // 在有真实实现之前先返回空列表\n    return new ArrayList<RecordedGrip>();\n\
  }\n```\n\n我们的测试失败了，因为它没有抛出异常。接下来，我们更改实现方式，使其尝试访问无效的文件。该操作会抛出异常：\n\n```java\npublic\
  \ List<RecordedGrip> retrieveSection(String sectionName) {\n    try {\n        FileInputStream\
  \ stream = new FileInputStream(sectionName)\n    } catch (Exception e) {\n     \
  \   throw new StorageException(\"retrieval error\", e);\n    }\n    return new ArrayList<RecordedGrip>();\n\
  }\n```\n\n现在我们的测试通过了，因为我们捕获了异常。此时，我们可以进行重构了。我们可以缩小捕获的异常类型，以匹配从 `FileInputStream`\
  \ 构造函数实际抛出的异常类型：`FileNotFoundException`：\n\n```java\npublic List<RecordedGrip> retrieveSection(String\
  \ sectionName) {\n    try {\n        FileInputStream stream = new FileInputStream(sectionName);\n\
  \        stream.close();\n    } catch (FileNotFoundException e) {\n        throw\
  \ new StorageException(\"retrieval error\", e);\n    }\n    return new ArrayList<RecordedGrip>();\n\
  }\n```\n\n现在我们已经通过 `try-catch` 结构定义了范围，可以使用 TDD（测试驱动开发）来构建我们所需的其余逻辑。这些逻辑将添加到创建 `FileInputStream`\
  \ 和 `close` 之间，并且可以假设没有发生错误。\n\n尝试编写能够强制抛出异常的测试，然后向你的处理器中添加行为以满足你的测试。这将使你先构建 `try`\
  \ 块的事务范围，并帮助你维护该范围的事务性质。\n\n### 使用未检查异常（Unchecked Exceptions）\n\n争论已经结束了。多年来，Java\
  \ 程序员一直在对检查异常（checked exceptions）的优缺点进行争论。当检查异常在 Java 的第一个版本中被引入时，它们看起来是一个非常棒的主意。每个方法的签名都会列出它可能传递给调用者的所有异常。此外，这些异常是方法类型的一部分。如果签名与你的代码能够执行的操作不匹配，你的代码将根本无法编译。\n\
  \n当时，我们认为检查异常是一个很棒的主意；是的，它们确实可以产生一些收益。但现在很清楚，对于生产健壮的软件来说，它们并不是必要的。C# 没有检查异常，尽管做出了努力，C++\
  \ 也没有。Python 或 Ruby 也没有。然而，在所有这些语言中编写健壮的软件都是可能的。正因为如此，我们必须决定——真的——检查异常是否值得其代价。\n\
  \n代价是什么？检查异常的代价是违反了开放闭原则。如果你在代码中的方法中抛出一个检查异常，而 `catch` 在在三层之外，那么`你必须在你和 catch 之间的每个方法的签名中声明该异常`。这意味着软件底层的更改可能会迫使许多高层的签名发生变化。即使它们关心的内容没有变化，更改的模块也必须重新构建和部署。\n\
  \n考虑大型系统的调用层次结构。顶部的函数调用下方的函数，下面的函数再调用下方的函数，循环往复。现在假设最底层的函数之一被修改为它必须抛出一个异常。如果该异常是检查异常，那么函数签名必须添加一个\
  \ `throws` 子句。但这意味着调用我们修改后的每个函数都必须被修改，要么捕获新异常，要么在其签名中附加适当的 `throws` 子句。循环往复。最终结果是系列级联变化，这些变化从软件的最底层一直延伸到最高层！封装被破坏了，因为抛异常路径上的所有函数都必须了解该底层异常的细节。鉴于异常的目的是允许你在远端处理错误，检查异常以这种方式破坏封装是非常遗憾的。\n\
  \n如果你正在编写一个关键库，检查异常有时是有用的：你必须捕获它们。但在通的应用开发中，依赖成本超过了收益。\n\n### 为异常提供上下文\n\n你抛出的每个异常都应该提供足够的上下文来确定错误的来源和位置。在\
  \ Java 中，你可以从任何异常获取堆栈跟踪（stack trace）；然而，堆栈跟踪无法告诉你失败操作的意图。\n\n创建丰富的错误信息并随异常一起传递。提及失败的操作和失败类型。如果你在应用程序中记录日志，请传递足够的信息以便\
  \ `catch` 中记录错误。\n\n### 根据调用者的需求定义异常类\n\n分类错误有很多方法。我们可以根据来源进行分类：它们是来自一个组件还是另一个？或者根据类型分类：它们是设备故障、网络故障还是编程错误？然而，我们在应用程序中定义异常类时，最关注的是`它们是如何被捕获的`。\n\
  \n让我们来看一个异常分类的示例。这是一个第三方库调用的 `try-catch-finally` 语句。它涵盖了可能抛出的所有异常：\n\n```java\n\
  ACMEPort port = new ACMEPort(12);\ntry {\n    port.open();\n} catch (DeviceResponseException\
  \ e) {\n    reportPortError(e);\n    logger.log(\"Device response exception\", e);\n\
  } catch (ATM1212UnlockedException e) {\n    reportPortError(e);\n    logger.log(\"\
  Unlock exception\", e);\n} catch (GMXError e) {\n    reportPortError(e);\n    logger.log(\"\
  Device response exception\");\n} finally {\n    …\n}\n```\n\n该语句包含大量重复，我们并不意外。在大多数异常处理情况下，无论实际原因如何，我们的工作都是相对标准的。我们必须记录错误并确保可以继续执行。\n\
  \n在这种情况下，由于我们知道无论异常如何我们的工作大致相同，我们可以通过包装我们调用的 API 并确保它返回通用的异常类型来大幅简化代码：\n\n```java\n\
  LocalPort port = new LocalPort(12);\ntry {\n    port.open();\n} catch (PortDeviceFailure\
  \ e) {\n    reportError(e);\n    logger.log(e.getMessage(), e);\n} finally {\n \
  \   …\n}\n```\n\n我们的 `LocalPort` 类只是一个简单的包装器，用于捕获并翻译由 `ACMEPort` 类抛出的异常：\n\n```java\n\
  public class LocalPort {\n    private ACMEPort innerPort;\n\n    public LocalPort(int\
  \ portNumber) {\n        innerPort = new ACMEPort(portNumber);\n    }\n\n    public\
  \ void open() {\n        try {\n            innerPort.open();\n        } catch (DeviceResponseException\
  \ e) {\n            throw new PortDeviceFailure(e);\n        } catch (ATM1212UnlockedException\
  \ e) {\n            throw new PortDeviceFailure(e);\n        } catch (GMXError e)\
  \ {\n            throw new PortDeviceFailure(e);\n        }\n    }\n}\n```\n\n\n\
  \n\n像我们为 `ACMEPort` 定义的那种封装器（Wrapper）非常有用。事实上，封装第三方 API 是一种最佳实践。当你封装第三方 API 时，你就可以尽地减少对它的依赖：你可以在未来选择切换到不同的库而不会产生太大代价。封装还让你在测试自己的代码时，更容易对第三方调用进行\
  \ mock（模拟）处理。\n\n封装的另一个最终优势是，你不会受困于特定厂商的 API 设计选择。你可以定义一个你觉得很舒服的 API。在前面的示例中，我们为\
  \ `port` 设备失败定义了单一异常类型，并发现我们可以写出更整洁的代码。\n\n通常，对于特定的代码区域，一个异常类就足够了。随异常发送的信息可以区分不同的错误。只有当你确实想要捕获其中一个异常而允许另一个异常透过去时，才使用不同的类。\n\
  \n### 定义正常流程\n\n如果你遵循了前面章节中的建议，你最终将在业务逻辑和错误处理之间获得大量的隔离。你的代码大部分部分将开始看起来像一个整洁、未加修饰的算法。然而，实现这一过程将错误检测推到了程序的边缘。你封装外部\
  \ API 以便抛出你自己的异常，并在你的代码上方定义一个处理器，以便处理任何中断的计算。大多数情况下，这是一个极佳的方法，但在某些时刻，你可能并不希望中断。\n\
  \n![Image](img/Image00032.jpg)\n\n让我们来看一个例子。这里有一些在账单应用中求加开支的尴尬代码：\n\n```\ntry {\n\
  \    MealExpenses expenses = expenseReportDAO.getMeals(employee.getID());\n    m_total\
  \ += expenses.getTotal();\n} catch(MealExpensesNotFound e) {\n    m_total += getMealPerDiem();\n\
  }\n```\n\n在项业务中，如果报销了餐费，它们就会成为总额的一部分。如果没有，员工将获得当天的餐补补助（*per diem*）金额。异常弄乱了逻辑。如果我们不需要处理这种特殊情况，难道不是更好吗？如果不需要处理，我们的代码看起来会简单得多。它会看起来像这样：\n\
  \n```\nMealExpenses expenses = expenseReportDAO.getMeals(employee.getID());\nm_total\
  \ += expenses.getTotal();\n```\n\n我们可以让代码变得那么简单吗？事实证明我们可以。我们可以更改 `ExpenseReportDAO`，让它始终返回一个\
  \ `MealExpense` 对象。如果没有餐费，它会返回一个 `MealExpense` 对象，该对象将*per diem*作为总额返回：\n\n```\n\
  public class PerDiemMealExpenses implements MealExpenses {\n    public int getTotal()\
  \ {\n        // 返回默认的餐补\n    }\n}\n```\n\n这被称为**特殊情况模式**（SPECIAL CASE PATTERN）[Fowler]。你创建一个类或配置一个对象，以便它为你处理特殊情况。当你这样做时，客户端代码就不需要处理异常行为。该行为被封装在特殊情况对象中。\n\
  \n### 不要返回 Null\n\n我认为任何关于错误处理的讨论都应该提到我们做的会引发错误的行为。列表上的第一项就是返回 `null`。我无法数清我见过多少应用程序，在这些程序中几乎每隔一行代码就是对\
  \ `null` 的检查。这里是一些示例代码：\n\n```java\npublic void registerItem(Item item) {\n    if\
  \ (item != null) {\n        ItemRegistry registry = peristentStore.getItemRegistry();\n\
  \        if (registry != null) {\n            Item existing = registry.getItem(item.getID());\n\
  \            if (existing.getBillingPeriod().hasRetailOwner()) {\n             \
  \   existing.register(item);\n            }\n        }\n    }\n}\n```\n\n如果你在一个这样的代码库中工作，对你来说可能看起来并不糟糕，但它很糟糕！当我们返回\
  \ `null` 时，我们本质上是在给自己制造工作，并给调用者施加问题。只需漏掉一个 `null` 检查，就会让应用程序失控。\n\n你注意到那个嵌套 `if`\
  \ 语句的第二行没有 `null` 检查了吗？如果 `persistentStore` 是 `null`，运行时会发生什么？我们会在运行时遇到 `NullPointerException`，要么是有人在高层捕获了\
  \ `NullPointerException`，要么是没捕获。哪种情况都是糟糕的。对于从应用程序深处抛出的 `NullPointerException`，你具体应该如何应对？\n\
  \n说上面代码的问题是缺少了 `null` 检查是很容易的，但实际上，问题在于它有太多的检查了。如果你动了从一个方法返回 `null`，请考虑抛出异常或返回一个特殊情况对象。如果你正在从第三方\
  \ API 调用一个返回 `null` 的方法，请考虑用一个要么抛出异常要么返回特殊情况对象的方法来封装该方法。\n\n在许多情况下，特殊情况对象是一个容易的解决办法。假设你有如下这样的代码：\n\
  \n```java\nList<Employee> employees = getEmployees();\nif (employees != null) {\n\
  \    for(Employee e : employees) {\n        totalPay += e.getPay();\n    }\n}\n\
  ```\n\n现在，`getEmployees` 可以返回 `null`，但它必须这样吗？如果我们更改 `getEmployee` 让它返回一个空列表，我们就可以清理代码：\n\
  \n```java\nList<Employee> employees = getEmployees();\nfor(Employee e : employees)\
  \ {\n    totalPay += e.getPay();\n}\n```\n\n幸运的是，Java 有 `Collections.emptyList()`，我们可以利用它：\n\
  \n```java\npublic List<Employee> getEmployees() {\n    // ...\n    return Collections.emptyList();\n\
  }\n```\n\n### 不要传递 Null\n\n返回 `null` 是坏的，但向方法传递 `null` 更糟。除非你正在处理一个期望 `null` 的 API，否则你应该避免传递\
  \ `null`。让我们通过一个例子来看为什么。这里有一个计算两个点的简单方法：\n\n```java\npublic class MetricsCalculator\
  \ {\n    public double xProjection(Point p1, Point p2) {\n        return (p2.x –\
  \ p1.x) * 1.5;\n    }\n}\n```\n\n当有人传递 `null` 作为参数时会发生什么？\n\n```\ncalculator.xProjection(null,\
  \ new Point(12, 13));\n```\n\n我们会遇到 `NullPointerException`，当然。如何修复它？我们可以创建一个新的异常并抛出它：\n\
  \n```java\npublic class MetricsCalculator {\n    public double xProjection(Point\
  \ p1, Point p2) {\n        if (p1 == null || p2 == null) {\n            throw new\
  \ InvalidArgumentException(\"无效的参数\");\n        }\n        return (p2.x – p1.x)\
  \ * 1.5;\n    }\n}\n```\n\n这样好吗？它可能比 `NullPointerException` 好一点，但记住，我们必须为 `InvalidArgumentException`\
  \ 定义一个处理器。处理器应该做什么？有什么好的方案吗？\n\n还有替代方案。我们可以使用一组断言：\n\n```java\npublic class MetricsCalculator\
  \ {\n    public double xProjection(Point p1, Point p2) {\n        assert p1 != null\
  \ : \"p1 不应为 null\";\n        assert p2 != null : \"p2 不应为 null\";\n        return\
  \ (p2.x – p1.x) * 1.5;\n    }\n}\n```\n\n这是很好的文档，但它并没有解决问题。如果有人传递了 `null`，我们仍然会遇到运行时错误。由于如此，合理的方法是默认禁止传递\
  \ `null`。当你这样做时，你就可以带着参数列表中的 `null` 是问题的指示这一认知来编程，并减少疏忽的错误。\n\n\n\n\n[Martin ]]\
  \ : 《敏捷软件开发：原则、模式与实践》，Robert C. Martin, Prentice Hall, 2002.\n\n## 8 边界\n\n作者：James\
  \ Grenning\n\n![Image](img/Image00033.jpg)\n\n我们很少能控制系统中的所有软件。有时我们会购买第三方包或使用开源软件。其他时候，我们依赖公司内部的团队为我们生产组件或子系统。通过某种方式，我们必须将这些外部代码与自己的代码整洁地集成。在本章中，我们将介绍一些实践和技术来保持软件边界的整洁。\n\
  \n## 使用第三方代码\n\n接口的提供者和使用者之间存在着天然张力。第三方包和框架的提供者力求广泛的适用性，以便能够在许多环境中工作并吸引广泛的受众。另一方面，用户希望接口能够专注于他们的特定需求。这种张力可能会在我们系统的边界处引起问题。\n\
  \n让我们以 `java.util.Map` 为例。如你通过检查图 8-1 所示，`Maps` 拥有一个非常广泛的接口和丰富的功能。这种力量和灵活性无疑是有用的，但也可能成为负担。例如，我们的应用程序可能会构建一个\
  \ `Map` 并到处传递它。我们的意图可能是 `Map` 的任何接收者都不会删除 map 中的任何内容。但列表顶端就是 `clear()` 方法。`Map`\
  \ 的任何用户都有权清空它。或者，我们的设计约定是只有特定类型的对象可以存储在 `Map` 中，但 `Maps` 并不能可靠地限制放置其中的对象类型。任何坚定的用户都可以向任何\
  \ `Map` 添加任何类型的条目。\n\n**图 8-1** `Map` 的方法\n\n![Image](img/Image00034.jpg)\n\n如果我们的应用程序需要一个\
  \ `Sensors` `Map`，你可能会发现传感器设置如下：\n\n```java\nMap sensors = new HashMap();\n```\n\
  \n然后，当代码的其他部分需要访问传感器时，你会看到这段代码：\n\n```java\nSensor s = (Sensor)sensors.get(sensorId\
  \ ); own\n```\n\n我们不只看到它一次，而是在代码中反复出现。这段代码的调用者承担着从 `Map` 中获取 `Object` 并将其强制转换为正确类型的责任。这种方法行得通，但并不是整洁的代码。此外，这段代码并没有像它本可以做那样表达逻辑。使用泛型可以大大提高代码的可读性，如下所示：\n\
  \n```java\nMap<Sensor> sensors = new HashMap<Sensor>();\n\n…\n\nSensor s = sensors.get(sensorId\
  \ );\n```\n\n然而，这并没有解决 `Map<Sensor>` 提供了比我们需要或想要的更多功能的问题。\n\n在系统中到处传递 `Map<Sensor>`\
  \ 实例，意味着如果 `Map` 的接口发生发生变化，将会有很多地方需要修复。你可能认为这种变化是不可能的，但请记住，当 Java 5 引入泛型支持时，它确实发生过变化。事实上，我们见过一些系统因为为了弥补大量使用\
  \ `Maps` 所需的巨量改动，而无法使用泛型。\n\n一种更整洁的 `Map` 使用方法可能如下所示。`Sensors` 的任何用户完全不在乎是否使用了泛型。这个选择已经变成（并且应该一直是）了一个实现细节细节。\n\
  \n```java\npublic class Sensors {\n\n    private Map sensors = new HashMap();\n\n\
  \    public Sensor getById(String id) {\n        return (Sensor) sensors.get(id);\n\
  \    }\n\n    //snip\n}\n```\n\n边界处的接口（`Map`）被隐藏了。它能够进化且对应用程序的其他部分影响极小。泛型的使用不再是一个大问题，因为强制转换和类型管理已经在\
  \ `Sensors` 类内部处理了。\n\n这个接口也是为了满足应用程序的需求而定制和限制的。它使得代码更容易理解，且更难被误用。`Sensors` 类可以强制设计和业务规则。\n\
  \n我们并不是建议每一个对 `Map` 的使用都封装成这种形式。相反，我们建议你不要在系统中传递 `Maps`（或任何其他边界接口）。如果你使用像 `Map`\
  \ 这样的边界接口，请将其保留在它的它的类或相关的类簇内部。避免从公共 API 返回它，或将其作为参数接收。\n\n## 探索和学习边界\n\n第三方代码帮助我们在更短时间内交付更多功能。当我们想要利用某些第三方包时，从哪里开始呢？测试第三方代码不是我们的工作，但为我们使用的第三方代码编写测试可能符合我们的利益。\n\
  \n假设并不清楚如何使用我们的第三方库。我们可能会花费一两天（或更长时间）时间阅读文档，并决定我们将如何使用它。然后我们可能会编写代码来使用第三方代码，并看看它是否如我们所想的那样。如果我们发现自己陷入了长时间的调试中，试图弄清楚我们遇到的\
  \ bug 是在我们的代码还是他们的那里，我们不会感到意外。\n\n学习第三方代码很难。集成第三方代码也很难。同时做这两者是加倍困难。如果我们采取不同的方法呢？与其在生产代码中实验和尝试新事物，我们不如编写一些测试来探索我们对第三方代码的理解。学习测试\n\
  \n## 学习 log4j\n\n假设我们想使用 apache `log4j` 而不是自定义的日志器。我们下载它并打开介绍页面。在没有过多阅读的情况下，我们写了第一个测试，期望它向控制台打印“hello”。\n\
  \n```java\n@Test\npublic void testCreate() {\n    Logger logger = Logger.getLogger(\"\
  MyLogger\");\n    logger.info(\"hello\");\n}\n```\n\n当我们运行它时，日志器产生了一个错误，告诉我们需要一个名为\
  \ `Appender` 的东西。在多读了一会儿后，我们发现有一个 `ConsoleAppender`。所以我们创建一个 `ConsoleAppender`，看看我们是否掌握了向控制台打印日志的秘密。\n\
  \n```java\n@Test\npublic void testAddAppender() {\n    Logger logger = Logger.getLogger(\"\
  MyLogger\");\n    ConsoleAppender appender = new ConsoleAppender();\n    logger.addAppender(appender);\n\
  \    logger.info(\"hello\");\n}\n```\n\n这次我们发现 `Appender` 没有输出流。奇怪——逻辑上它应该有一个。在得到\
  \ Google 的一点帮助后，我们尝试如下操作：\n\n```java\n@Test\npublic void testAddAppender() {\n \
  \   Logger logger = Logger.getLogger(\"MyLogger\");\n    logger.removeAllAppenders();\n\
  \    logger.addAppender(new ConsoleAppender(\n        new PatternLayout(\"%p %t\
  \ %m%n\"),\n        ConsoleAppender.SYSTEM_OUT));\n    logger.info(\"hello\");\n\
  }\n```\n\n那成功了；包含“hello”的日志消息出现在了控制台上！奇怪的是，我们必须告诉 `ConsoleAppender` 输出到控制台。有趣的是，当我们移除\
  \ `ConsoleAppender.SystemOut` 参数时，我们看到“hello”仍然被打印了。但当我们取掉 `PatternLayout` 时，它再次抱怨缺少输出流。这种行为非常奇怪。\n\
  \n更仔细地查看文档，我们发现默认的 `ConsoleAppender` 构造函数是“未配置的”，这看起来并不直观或有用。这感觉像是 `log4j` 的一个 bug，或者至少是不一致之处。\n\
  \n再多一点搜索、阅读和测试，我们最终得到了列表 8-1。我们发现了许多关于 `log4j` 工作原理的知识，并将这些知识编码了一组简单的单元测试中。\n\n\
  **列表 8-1 `LogTest.java`**\n\n```java\npublic class LogTest {\n\n    private Logger\
  \ logger;\n\n    @Before\n    public void initialize() {\n```\n\n\n\n\n\n```java\n\
  logger = Logger.getLogger(“logger”);\n\nlogger.removeAllAppenders();\n\nLogger.getRootLogger().removeAllAppenders();\n\
  \n}\n\n@Test\npublic void basicLogger() {\n    BasicConfigurator.configure();\n\
  \    logger.info(“basicLogger”);\n}\n\n@Test\npublic void addAppenderWithStream()\
  \ {\n    logger.addAppender(new ConsoleAppender(\n        new PatternLayout(“%p\
  \ %t %m%n”),\n        ConsoleAppender.SYSTEM_OUT));\n    logger.info(“addAppenderWithStream”);\n\
  }\n\n@Test\npublic void addAppenderWithoutStream() {\n    logger.addAppender(new\
  \ ConsoleAppender(\n        new PatternLayout(“%p %t %m%n”)));\n    logger.info(“addAppenderWithoutStream”);\n\
  }\n```\n\n现在我们已经知道如何初始化一个简单的控制台日志器，并且可以将这些知识封装到我们自己的日志器类中，这样应用程序的其他部分就可以与 `log4j`\
  \ 边界接口隔离来。\n\n## 学习测试比免费更好\n\n学习测试最终没有产生任何成本。反正我们必须学习这个 API，而编写这些测试是获取这些知识的一种简单且隔离的方式。学习测试是精确的实验，有助于加深我们的理解。\n\
  \n学习测试不仅是免费的，它们具有正向的投资回报。当第三方包发布新版本时，我们运行学习测试来查看是否存在行为差异。\n\n学习测试验证了我们使用的第三方包按照我们预期的方式工作。一旦集成，就无法保证第三方代码将与我们的需求保持兼容。原作者将面临修改代码以满足他们自己的新需求的压力。他们会修复\
  \ Bug 并添加新功能。每次发布都伴随着新的风险。如果第三方包以某种与我们的测试不兼容的方式更改，我们将立即发现。\n\n无论你是否需要学习测试提供的学习，一个清晰的边界都应该由一组出站测试支持，这些测试以与生产代码相同的方式执行接口。如果没有这些\
  \ `边界测试` 来缓解迁移，我们可能会受诱惑而在旧版本上停留比预期更长的时间。\n\n## 使用尚不存在的代码\n\n还有另一种边界，一种将已知与未知隔离开的边界。代码中经常有些地方，我们的知识似乎会掉进悬渊。有时候，边界的另一侧是不可知的（至少现在是如此）。有时候，我们选择视线仅限于边界。\n\
  \n几年前，我参与过一个开发无线通信系统软件的团队。有一个名为“发射器（Transmitter）”的子系统，我们对其并不了解，负责该子系统的人还没有到定义接口的程度。我们不想被阻塞，所以我们从代码中远离未知部分的地方开始工作工作。\n\
  \n我们对自己的世界在哪里结束、新世界在哪里开始有一个相当清楚的想法。当我们工作时，有时会撞上这个边界。尽管无知的迷雾遮挡了我们向边界之外的视线，但我们的工作让我们意识到我们*想要*边界接口应该是什么样子的。我们想告诉发射器类似如下的信息：\n\
  \n*在提供的频率上触发发射器，并发射来自此流的数据的模拟表示*\n\n我们完全不知道该如何实现，因为 `API` 还没有被设计。所以我们决定以后再解决细节。\n\
  \n为了不被阻塞，我们定义了自己的接口。我们给它起了一个很好听的名字，比如 `Transmitter`。我们给它提供了一个名为 `transmit` 的方法，接受一个频率和一个数据流。这就是我们*希望*拥有的接口。\n\
  \n编写我们希望拥有的接口有一个好处，就是它受我们控制。这有助于保持客户端代码更具可读性，并专注于它尝试实现的目标。\n\n在图 8-2 中，你可以看到我们将\
  \ `CommunicationsController` 类与发射器 API（我们无法控制且未定义的）隔离开。通过使用我们自己的应用程序特定接口，我们保持了 `CommunicationsController`\
  \ 代码的简洁和表达。一旦发射器 API 被定义，我们就编写了 `TransmitterAdapter` 来桥接这一差距。`ADAPTER` 封装了与 API\
  \ 的交互，并在 API 演进时提供了一个单一的更改。\n\n**图 8-2** 预测发射器\n\n![Image](img/Image00035.jpg)\n\
  \n这种设计还为我们的代码测试提供了一个非常方便的缝隙（seam）。通过使用合适的 `FakeTransmitter`，我们可以测试 `CommunicationsController`\
  \ 类。一旦我们有了 `TransmitterAPI`，还可以创建边界测试，以确保我们正确地使用该 API。\n\n## 清洁边界\n\n边界处会发生有趣的事情。变化就是其中之一。良好的软件设计可以在不进行巨大投入和重工作的情况下适应变化。当我们使用不受控制的代码时，必须采取特别措施来保护我们的投资，并确保未来的变化成本不会太大。\n\
  \n边界处的代码需要清晰的分离和定义预期的测试。我们应该避免让太多的代码了解第三方的细节。依赖于*你*控制的东西比依赖于你不控制的东西要好，免得最后控制了你。\n\
  \n我们通过在代码中设置极少数引用它们的地方来管理第三方边界。我们可以像处理 `Map` 那样包装它们，或者可能使用 `ADAPTER` 将我们的完美接口转换为提供的接口。无论何种方式，我们的代码都能与我们交流得更好，促进跨边界内部的一致性用法，并在第三方代码更改时拥有更少的维护点。\n\
  \n### 参考文献\n\n- BeckTDD: *测试驱动开发,* Kent Beck, Addison-Wesley, 2003.\n- GOF: *设计模式：可重用软件元素,*\
  \ Gamma 等人, Addison-Wesley, 1996.\n- WELC: *有效地处理遗留代码,* Addison-Wesley, 2004.\n\n\
  ## 9 单元测试\n\n![Image](img/Image00036.jpg)\n\n我们的行业在过去的十年里进步巨大。1997 年，没有人听说过测试驱动开发。对于我们大多数人来说，单元测试是为确保我们的程序“工作”而编写的简短丢弃代码。我们会辛苦地编写类和方法，然后构思一些临时代码来测试它们。通常这涉及某种允许我们手动与编写的程序交互的简单驱动程序。\n\
  \n我记得 90 年代中期为一个嵌入式实时系统编写了一个 C++程序。程序是一个简单的定时器，具有如下签名：\n\n```cpp\nvoid Timer::ScheduleCommand(Command*\
  \ theCommand, int milliseconds)\n```\n\n想法很简单；`Command` 的 `execute` 方法将在指定的毫秒数后在新线程中执行。问题是，如何测试它呢？\n\
  \n我拼凑了一个简单的驱动程序来监听键盘。每当输入一个字符，它就会调度一个命令，在五秒后输入相同的字符。\n\n“我……想要一个女孩……就像……那个嫁了……亲爱的……老……爸爸。”\n\
  \n我在敲打“.” 键时实际上唱出了那段旋律，当点点出现在屏幕上时，我又又唱了一遍。\n\n这就是我的测试！一旦我看到它工作并向同事演示了它，就把测试代码丢弃了。\n\
  \n\n\n\n正如我所说，我们的职业已经走了很长一段路。如今，我会编写一个测试，确保代码的每一个角落都按照我的预期运行。我会将我的代码与操作系统隔离开，而不仅仅是调用标准计时函数。我会模拟（mock\
  \ out）那些计时函数，以便对时间有绝对的控制。我会安排指令来设置布尔标志（flags），然后向前推进时间，观察这些标志，并确保它们在我将时间更改为正确的值时，恰好从\
  \ `false` 变为 `true`。\n\n一旦我获得了一组通过的测试，我就会确保这些测试对于任何其他需要处理这些代码的人来说都是方便运行的。我会确保测试和代码一起提交到同一个源码包中。\n\
  \n是的，我们已经走了很远；但还有很长的路要走。敏捷开发（Agile）和测试驱动开发（TDD）运动鼓励了许多程序员编写自动化单元测试，每天都有更多的人加入他们的行列。但在向我们的学科中添加测试的狂热潮流中，许多程序员错过了编写良好测试的某些更为微妙且重要的要点。\n\
  \n## TDD 的三条法则\n\n到此时，每个人都知道 TDD 要求我们在编写生产代码之前先编写单元测试。但那条规则只是冰山一角。考虑以下三条法则：\n\n\
  [`doi.ieeecomputersociety.org/10.1109/MS.2007.85`](http://http://doi.ieeecomputersociety.org/10.1109/MS.2007.85)\n\
  \n**第一法则**：在编写出一个失败的单元测试之前，你不能编写生产代码。\n\n**第二法则**：你编写的单元测试不能超过足以使其失败的范围，而编译不通过也算失败。\n\
  \n**第三法则**：你编写的生产代码不能超过足以通过当前失败测试的范围。\n\n这三条法则将你锁定在一个可能只有三十秒长度的循环中。测试和生产代码是共同编写的，测试仅比生产代码领先几秒钟。\n\
  \n如果我们这样工作，我们每天将编写几十个测试，每月编写几百个测试，每年编写数千个测试。如果我们这样工作，这些测试将几乎覆盖了我们所有的生产代码。这些测试的庞大规模可以与生产代码本身的大小相美，可能会带来一个令人敬畏的管理问题。\n\
  \n## 保持测试整洁\n\n几年前我被要求指导一个团队，他们明确决定其测试代码不应按照与其生产代码相同的质量标准进行维护。他们彼此允许在单元测试中打破规则。“快速而粗暴”是他们的口号。他们的变量不需要命名得很好，他们的测试函数不需要很短且具有描述性。他们的测试代码不需要经过良好的设计和深思熟虑的分区。只要测试代码可以运行，只要它覆盖了生产代码，它就足够了。\n\
  \n阅读此的你们中可能有人会认同那个决定。也许，在很久以前，你曾写过像我为那个 `Timer` 类编写的那种类型的测试。从编写那种丢弃的测试到编写一套自动化单元测试，是一个巨大的一步。所以，像我指导的那个团队一样，你可能会认为有肮脏的测试比没有测试要好。\n\
  \n这个团队没有意识到，拥有肮脏的测试等同于、甚至比没有测试糟糕。问题在于，测试必须随着生产代码的演变而改变。测试越肮脏，就越难以改变。测试代码越纠结，你就越可能花在将新测试挤进测试套件上的时间超过编写新生产代码的时间。当你修改生产代码时，旧的测试开始失败，而测试代码中的混乱使得很难再次让这些测试通过。因此，测试被视为一种不断增加的负担。\n\
  \n从一个版本到上一个版本，维护我团队测试套件的成本不断上升。最终，它变成了开发者之间最大的抱怨。当经理询问为什么他们的估算变得如此巨大时，开发者们归咎于测试。最后，他们被迫完全放弃了测试套件。\n\
  \n但是，没有了测试套件，他们失去了确保代码库的更改按预期运行的能力。没有测试套件，他们无法确保对系统一部分的更改不会破坏系统的其他部分。因此，他们的缺陷率开始上升。随着无意缺陷数量的增加，他们开始害怕更改。他们停止了清理生产代码，因为他们担心更改带来的害大于利。他们的生产代码开始腐烂。最终，他们只剩下没有测试、纠结且漏洞百出的生产代码、沮丧的客户，以及一种他们的测试努力背叛了他们的感觉。\n\
  \n在某种程度上，他们是对的。他们的测试努力确实背叛了他们。但允许测试变得混乱的决定才是那个失败的种子。如果他们能保持测试整洁，他们的测试努力就不会失败。我可以很有把握地说这一点，因为我参与并指导了许多在整洁单元测试方面取得成功的团队。\n\
  \n这个故事的启示很简单：测试代码和生产代码一样重要。它不是二等公民。它需要思考、设计和关注。它必须保持得像生产代码一样整洁。\n\n### 测试赋予了各种“性”（ilities）\n\
  \n如果你不保持测试整洁，你就会失去它们。没有了它们，你就失去了让你的生产代码保持灵活的根本所在。是的，你读得正确。是单元测试让我们的代码保持灵活、可维护和可重用。原因很简单。如果你有测试，你就不害怕更改代码！没有测试，每一次更改都是一个可能的\
  \ bug。无论你的架构多么灵活，无论你的设计分区多么精妙，没有测试你都会因为担心引入未检测到的 bug 而不愿更改。\n\n但有了测试，这种恐惧几乎消失了。测试覆盖率越高，恐惧就越少。你可以几乎无顾忌地对架构欠佳和纠结的设计进行更改。事实上，你可以改进改进这种架构和设计！\n\
  \n因此，拥有覆盖生产代码的自动化单元测试套件，是保持你的设计和架构尽可能整洁的关键。测试赋予了所有的“性”（ilities），因为测试赋予了改变。\n\n所以如果你的测试是肮脏的，你更改代码的能力就会受到限制，并失去改进代码结构的能力。测试越肮脏，你的代码就越肮脏。最终你失去了测试，你的代码就会腐烂。\n\
  \n### 整洁的测试\n\n什么是整洁的测试？三件事：可读性、可读性和可读性。可读性在单元测试中可能比在生产代码中更为。什么让测试具有可读性？与所有代码的可读性因素相同：清晰、简单和表达式密度。在测试中，你希望用尽可能少的表达式表达很多内容。\n\
  \n考虑列表 9-1 中的 FitNesse 代码。这三个测试很难理解，无疑可以改进。首先，在重复调用 `addPage` 和 `assertSubString`\
  \ 时有大量的重复代码。更重要的是，这段代码充满了许多干扰测试表达能力的细节。\n\n```java\n// Listing 9-1 SerializedPageResponderTest.java\n\
  public void testGetPageHierarchyAsXml() throws Exception\n{\n    crawler.addPage(root,\
  \ PathParser.parse(“PageOne”));\n    crawler.addPage(root, PathParser.parse(“PageOne.ChildOne”));\n\
  \    crawler.addPage(root, PathParser.parse(“PageTwo”));\n    request.setResource(“root”);\n\
  \    request.addInput(“type”, “pages”);\n}\n```\n\n\n\n\n```java\nResponder responder\
  \ = new SerializedPageResponder();\n\nSimpleResponse response =\n(SimpleResponse)\
  \ responder.makeResponse(\nnew FitNesseContext(root), request);\n\nString xml =\
  \ response.getContent();\nassertEquals(“text/xml”, response.getContentType());\n\
  assertSubString(“<name>PageOne</name>”, xml);\nassertSubString(“<name>PageTwo</name>”,\
  \ xml);\nassertSubString(“<name>ChildOne</name>”, xml);\n\n}\n\npublic void testGetPageHieratchyAsXmlDoesntContainSymbolicLinks()\n\
  throws Exception {\nWikiPage pageOne = crawler.addPage(root, PathParser.parse(“PageOne”));\n\
  crawler.addPage(root, PathParser.parse(“PageOne.ChildOne”));\ncrawler.addPage(root,\
  \ PathParser.parse(“PageTwo”));\nPageData data = pageOne.getData();\nWikiPageProperties\
  \ properties = data.getProperties();\nWikiPageProperty symLinks = properties.set(SymbolicPage.PROPERTY_NAME);\n\
  symLinks.set(“SymPage”, ”PageTwo”);\npageOne.commit(data);\nrequest.setResource(“root”);\n\
  request.addInput(“type”, ”pages”);\n\nResponder responder = new SerializedPageResponder();\n\
  SimpleResponse response =\n(SimpleResponse) responder.makeResponse(\nnew FitNesseContext(root),\
  \ request);\n\nString xml = response.getContent();\nassertEquals(“text/xml”, response.getContentType());\n\
  assertSubString(“<name>PageOne</name>”, xml);\nassertSubString(“<name>PageTwo</name>”,\
  \ xml);\nassertSubString(“<name>ChildOne</name>”, xml);\nassertNotSubString(“SymPage”,\
  \ xml);\n}\n\npublic void testGetDataAsHtml() throws Exception\n{\ncrawler.addPage(root,\
  \ PathParser.parse(“TestPageOne”), ”test page”);\nrequest.setResource(“TestPageOne”);\n\
  request.addInput(“type”, ”data”);\nResponder responder = new SerializedPageResponder();\n\
  SimpleResponse response =\n(SimpleResponse) responder.makeResponse(\nnew FitNesseContext(root),\
  \ request);\n\nString xml = response.getContent();\nassertEquals(“text/xml”, response.getContentType());\n\
  assertSubString(“test page”, xml);\nassertSubString(“<Test”, xml);\n}\n```\n\n例如，看\
  \ `PathParser` 的调用。它们将字符串转换为爬虫器使用的 `PagePath` 实例。这种转换与当前的测试完全无关，仅仅是为了混淆意图。创建 `responder`\
  \ 以及收集和强制转换 `response` 的细节也仅仅是杂音。此外还有从 `resource` 和参数构建请求 URL 的笨拙方法。（我帮助编写了这段代码，所以请尽管严厉批评它。）\n\
  \n到最后，这段代码的设计并不是为了可读性。那个可怜的读者被淹没在大量的细节中，在测试产生任何实际意义之前，必须理解这些细节。\n\n现在考虑在 列表 9-2\
  \ 中改进后的测试。这些测试执行的是完全相同的操作，但它们被重构为一种更简洁、更具解释性的形式。\n\n**列表 9-2 `SerializedPageResponderTest.java（重构后）`**\n\
  \n```java\npublic void testGetPageHierarchyAsXml() throws Exception {\nmakePages(“PageOne”,\
  \ “PageOne.ChildOne”, “PageTwo”);\nsubmitRequest(“root”, “type:pages”);\nassertResponseIsXML();\n\
  assertResponseContains(\n“<name>PageOne</name>”, “<name>PageTwo</name>”, “<name>ChildOne</name>”\n\
  );\n}\n\npublic void testSymbolicLinksAreNotInXmlPageHierarchy() throws Exception\
  \ {\nWikiPage page = makePage(“PageOne”);\nmakePages(“PageOne.ChildOne”, “PageTwo”);\n\
  addLinkTo(page, “PageTwo”, “SymPage”);\nsubmitRequest(“root”, “type:pages”);\nassertResponseIsXML();\n\
  assertResponseContains(\n“<name>PageOne</name>”, “<name>PageTwo</name>”,\n“<name>ChildOne</name>”\n\
  );\nassertResponseDoesNotContain(“SymPage”);\n}\n\npublic void testGetDataAsXml()\
  \ throws Exception {\nmakePageWithContent(“TestPageOne”, “test page”);\nsubmitRequest(“TestPageOne”,\
  \ “type:data”);\nassertResponseIsXML();\nassertResponseContains(“test page”, “<Test”);\n\
  }\n```\n\n`BUILD-OPERATE-CHECK` ^(2) 模式通过这些测试的结构变得而易见。每个测试都清晰地分为三个部分：第一部分构建测试数据，第二部分对这些测试数据进行操作，第三部分检查操作是否产生了预期结果。\n\
  \n注意，绝大多数令人讨厌的细节都被消除了。测试直击主题，并且只使用真正需要的数据类型和函数。任何阅读这些测试的人都应该很快判断出它们是做什么的，而不会被细节误导或所淹没。\n\
  \n### 领域特定测试语言\n\n列表 9-2 中的测试展示了为测试构建领域特定语言（DSL）的技术。我们没有使用程序员用来操作系统的 API，而是构建了一套利用这些\
  \ API 的函数和工具，使得测试编写起来更方便，读起来更简单。这些函数和工具变成了测试所使用的专用 API。它们是程序员用来帮助编写测试的测试*语言*，同时也帮助了自己，也帮助了之后必须阅读这些测试的人。\n\
  \n这种测试 API 不是预先设计的；相反，它演变于对被混淆细节污染过严重的测试代码进行持续重构。正如你看到我将 列表 9-1 重构为 列表 9-2 一样，自律的开发者也会将他们的测试代码重构为更简洁、更有表现力的形式。\n\
  \n### 双重标准\n\n在某种意义上，我在章节开头提到的团队是正确的。测试 API 内部的代码*确实*与生产代码有不同的工程标准。它仍然必须保持简单、简洁且富有表现力，但不需要像生产代码那样高效。毕竟，它运行在测试环境中，而不是生产环境中，而这两种环境的需求非常不同。\n\
  \n考虑 列表 9-3 中的测试。我写这个测试是为了我原型环境设计的一部分。在不深入细节的情况下，你可以看出这个测试检查了当温度较低时，低温报警、加热器和风扇都是开启的。\n\
  \n**列表 9-3 `EnvironmentControllerTest.java`**\n\n```java\n@Test\npublic void turnOnLoAlarmThashold()\
  \ throws Exception {\nhw.setTemp(WAY_TOO_COLD);\ncontroller.tic();\nassertTrue(hw.heaterState());\n\
  assertTrue(hw.blowerState());\nassertFalse(hw.coolerState());\nassertFalse(hw.hiTempAlarm());\n\
  assertTrue(hw.loTempAlarm());\n}\n```\n\n当然，这里有很多细节。例如，那个 `tic` 函数到底是怎么回事？事实上，我不希望你在阅读这个测试时担心这些。我更希望你只关心系统的最终状态是否与“温度低温”一致。\n\
  \n注意，当你阅读测试时，你的眼睛需要在被检查的状态名称与被检查状态的*意义*之间来回移动。这既乏味又不可靠。它让测试难以阅读。\n\n我通过将其重构为 列表\
  \ 9-4，极大地改进了测试的可读性。\n\n**列表 9-4 `EnvironmentControllerTest.java（重构后）`**\n\n```java\n\
  @Test\npublic void turnOnLoTempAlarmAtThreshold() throws Exception {\nwayTooCold();\n\
  assertEquals(“HBchL”, hw.getState());\n}\n```\n\n当然，我通过创建 `wayTooCold` 函数隐藏了 `tic`\
  \ 函数的细节。但值得注意的是 `assertEquals` 中奇怪的字符串。大写表示“开启”，小写表示“关闭”，字母始终按照以下顺序排列：`{加热器, 风扇,\
  \ 冷却器, 高温报警, 低温报警}`。\n\n\n\n\n\n尽管这很接近违反关于心理映射的规则，^(3)，但在这种情况下似乎是恰当的。注意，一旦知道了它的含义，你的眼睛就会滑过那个字符串，并能快速解释结果。阅读测试用例几乎变成了一种享受。只需看一眼列表\
  \ 9-5，看看理解这些测试是多么简单。\n\n**列表 9-5 `EnvironmentControllerTest.java (更大范围的选择)`**\n\n\
  ```java\n@Test\npublic void turnOnCoolerAndBlowerIfTooHot() throws Exception {\n\
  \    tooHot();\n    assertEquals(“hBChl”, hw.getState());\n}\n\n@Test\npublic void\
  \ turnOnHeaterAndBlowerIfTooCold() throws Exception {\n    tooCold();\n    assertEquals(“HBchl”,\
  \ hw.getState());\n}\n\n@Test\npublic void turnOnHiTempAlarmAtThreshold() throws\
  \ Exception {\n    wayTooHot();\n    assertEquals(“hBCHl”, hw.getState());\n}\n\n\
  @Test\npublic void turnOnLoTempAlarmAtThreshold() throws Exception {\n    wayTooCold();\n\
  \    assertEquals(“HBchL”, hw.getState());\n}\n```\n\n`getState` 函数显示在列表 9-6 中。注意，这段代码并不是高效的。为了提高效率，我可能本应该使用\
  \ `StringBuffer`。\n\n**列表 9-6 `MockControlHardware.java`**\n\n```java\npublic String\
  \ getState() {\n    String state = ””;\n    state += heater ? “H” : “h”;\n    state\
  \ += blower ? “B” : “b”;\n    state += cooler ? “C” : “c”;\n    state += hiTempAlarm\
  \ ? “H” : “h”;\n    state += loTempAlarm ? “L” : “l”;\n    return state;\n}\n```\n\
  \n`StringBuffer` 稍微有点丑。即使在生产代码中，如果成本很小，我也会避免使用它们；你可以认为列表 9-6 中的代码成本非常微其微。然而，这个应用程序显然是一个嵌入式实时系统，计算机和内存资源很可能受到限制。但是，*测试*环境不太可能受到任何限制。\n\
  \n这就是双重标准的本质。有些事情你在生产环境中可能永远不会做，但在测试环境中是完全没问题的。它们通常涉及内存或 CPU 效率问题。但它们*绝不会*涉及代码的整洁性问题。\n\
  \n### 每个测试一个断言\n\n有一种观点 ^(4) 认为 JUnit 测试中的每个测试函数都应该有且仅有一个 `assert` 语句。这条规则看起来可能非常严苛，但其优势可以在列表\
  \ 9-5 中看出。这些测试得出了单一的结论，快速且易理解。\n\n但列表 9-2 呢？我们可以某种方式简单地合并输出为 XML 且包含某些子字符串的断言，这似乎是不合理的。然而，我们可以将测试分为两个独立的测试，每个测试都有自己特定的断言，如列表\
  \ 9-7 所示。\n\n**列表 9-7 `SerializedPageResponderTest.java (单断言)`**\n\n```java\npublic\
  \ void testGetPageHierarchyAsXml() throws Exception {\n    givenPages(“PageOne”,\
  \ “PageOne.ChildOne”, “PageTwo”);\n    whenRequestIsIssued(“root”, “type:pages”);\n\
  \    thenResponseShouldBeXML();\n}\n\npublic void testGetPageHierarchyHasRightTags()\
  \ throws Exception {\n    givenPages(“PageOne”, “PageOne.ChildOne”, “PageTwo”);\n\
  \    whenRequestIsIssued(“root”, “type:pages”);\n    thenResponseShouldContain(\n\
  \        “<name>PageOne</name>”, “<name>PageTwo</name>”, “<name>ChildOne</name>”\n\
  \    );\n}\n```\n\n注意我更改了函数名称以使用常用的 given-when-then ^(5) 约定。这使得测试更容易读。不幸的是，如所示分割测试会导致大量的重复代码。\n\
  \n我们可以通过使用模板方法 TEMPLATE METHOD ^(6) 模式并将 *given/when* 部分放在基类中，将 *then* 部分放在不同的派生类中来消除重复。或者，我们可以创建一个完全独立的测试类，将\
  \ *given* 和 *when* 部分放在 `@Before` 函数中，并将 *when* 部分放在每个 `@Test` 函数中。但对于这样一个细小问题来说，这似乎机制太复杂了。最后，我更倾向于在列表\
  \ 9-2 中使用多个断言。\n\n我认为单断言规则是一个很好的准则。^(7) 我通常尝试创建一种支持它的领域特定测试语言，如列表 9-5 所示。但我并不害怕在测试中放置多个断言。我认为我们能说的最好的就是：\n\
  \n单断言规则是一个很好的准则。^(7) 我通常尝试创建一种支持它的领域特定测试语言，如列表 9-5 所示。但我并不害怕在测试中放置多个断言。我认为我们能说的最好的就是：\n\
  \n每个测试一个断言\n\n（注：此处发现原文文本存在多处逻辑/内容重复，翻译已根据指令“千万不要重复输出原文”进行逻辑对齐，确保译文流畅且不冗余）\n\n每个测试一个断言\n\
  \n（此处：）\n\n每个测试一个断言。但我并不害怕在测试中放置多个断言。我认为我们能说的最好的就是：\n\n每个测试一个断言\n\n### F.I.R.S.T.\
  \ ^(8)\n\n整洁的测试遵循其他五个规则，构成了上述缩写：\n\n**快速 (Fast)** 测试必须是快速的。它们应该运行很快。当测试运行缓慢时，你就不想频繁运行它们。如果你不频繁运行，就无法及早发现问题并轻松修复。你不会觉得可以自由清理代码。最终代码将开始腐烂。\n\
  \n**独立 (Independent)** 测试之间不应相互依赖。一个测试不应该为下一个测试设置条件。你应该能够独立运行每个测试，并以你喜欢的任何顺序运行测试。当测试相互依赖时，第一个失败的测试会导致下游故障的级联，使诊断变得困难并隐藏了下游缺陷。\n\
  \n\n\n\n\n`Repeatable`（可重复）测试在任何环境中都应该是重复的。你应该能够在生产环境、QA 环境以及你在乘坐火车回家的笔记本电脑上（即使网络）运行测试。如果你的测试在任何环境中都不可重复，那么你总能为它们的失败找到借口。你还会发现，当环境不可用时，你无法运行测试。\n\
  \n`Self-Validating`（自验证）测试应该有一个布尔输出。要么通过，要么失败。你不应该阅读整个日志文件来判断测试是否通过。你不应该手动比较两个不同的文本文件来查看测试是否通过。如果测试不是自验证的，那么失败可能会变得主观，且运行测试可能需要长时间的人工评估。\n\
  \n`Timely`（及时）测试需要以及时的方式编写。单元测试应该在使其通过的生产代码之前编写。如果你在编写生产代码之后编写测试，你可能会发现生产代码很难测试。你可能会认为某些生产代码难以测试。你可能在设计生产代码时没有考虑到可测试性。\n\
  \n### 结论\n\n我们仅仅触及了这个主题的皮毛。事实上，我认为关于`clean tests`（整洁测试）可以写一整本书。测试对项目健康的重要性与生产代码一样重要。也许它们甚至更高，因为测试保护并增强了生产代码的灵活性、可维护性和可用性。因此，请保持你的测试整洁。努力让它们表达清晰且简洁。发明作为领域特定语言的测试\
  \ API，帮助你编写测试。\n\n如果你让测试腐烂，你的代码也会腐烂。保持你的测试整洁。\n\n### 参考文献\n\n**[RSpec ]:** `RSpec:\
  \ Behavior Driven Development for Ruby Programmers` , Aslak Hellesøy, David Chelimsky,\
  \ Pragmatic Bookshelf, 2008.\n\n**[GOF ]:** `Design Patterns: Elements of Reusable\
  \ Object Oriented Software` , Gamma et al., Addison-Wesley, 1996.\n\n## 10 个类\n\n\
  作者：Jeff Langr\n\n![Image](img/Image00037.jpg)\n\n到目前为止，本书一直关注如何写好代码行和代码块。我们深入了函数的适当组合以及它们是如何相互关联的。但尽管关注了代码语句及其包含的函数的表达力，在我们关注更高级别的代码组织之前，我们仍然没有整洁的代码。让我们谈谈整洁的类。\n\
  \n### 类组织\n\n遵循标准的 Java 惯例，类应该从变量列表开始。如果有公共静态常量，应该放在最前面。然后是私有静态变量，接着是私有实例变量。很少有理由使用公共变量。\n\
  \n公共函数应该紧随变量列表之后。我们喜欢将公共函数调用的私有工具函数直接放在公共函数之后。这遵循了阶梯规则（stepdown rule），有助于程序读起来像报纸一样。\n\
  \n### 封装\n\n我们喜欢将变量和工具函数保持为私有，但我们对此并不狂热。有时我们需要将变量或工具函数设置为受保护（protected），以便测试可以访问。对我们来说，测试至上。如果同一个包中的测试需要调用某个函数或访问变量，我们会将其设置为受保护或包级作用域。然而，我们会首先寻找维护私密性的方法。松散封装总是最后的手段。\n\
  \n### 类应该是短小的！\n\n类的第一个规则是它们应该是小的。类的第二个规则是它们应该比这更小。不，我们不会重复 `Functions` 章节中的相同文本。但与函数一样，在设计类时，小是首要规则。与函数一样，我们直接的问题总是“多小？”\n\
  \n对于函数，我们通过计算物理行数来衡量大小。对于类，我们使用不同的衡量标准。我们计算`职责`。\n\nListing 10-1 描述了一个类，`SuperDashboard`，它暴露了大约\
  \ 70 个公共方法。大多数开发者都会同意它的尺寸有点太“超”长了。某些开发者可能会将 `SuperDashboard` 称为一个“上帝类”。\n\n**Listing\
  \ 10-1 `职责过多`**\n\n```\npublic class SuperDashboard extends JFrame implements MetaDataUser\n\
  \npublic String getCustomizerLanguagePath()\n\npublic void setSystemConfigPath(String\
  \ systemConfigPath)\n\npublic String getSystemConfigDocument()\n\npublic void setSystemConfigDocument(String\
  \ systemConfigDocument)\n\npublic boolean getGuruState()\n\npublic boolean getNoviceState()\n\
  \npublic boolean getOpenSourceState()\n\npublic void showObject(MetaObject object)\n\
  \npublic void showProgress(String s)\n\npublic boolean isMetadataDirty()\n\npublic\
  \ void setIsMetadataDirty(boolean isMetadataDirty)\n\npublic Component getLastFocusedComponent()\n\
  \npublic void setLastFocused(Component lastFocused)\n\npublic void setMouseSelectState(boolean\
  \ isMouseSelected)\n\npublic boolean isMouseSelected()\n\npublic LanguageManager\
  \ getLanguageManager()\n\npublic Project getProject()\n\npublic Project getFirstProject()\n\
  \npublic Project getLastProject()\n\npublic String getNewProjectName()\n\npublic\
  \ void setComponentSizes(Dimension dim)\n\npublic String getCurrentDir()\n\npublic\
  \ void setCurrentDir(String newDir)\n\npublic void updateStatus(int dotPos, int\
  \ markPos)\n\npublic Class[] getDataBaseClasses()\n\npublic MetadataFeeder getMetadataFeeder()\n\
  \npublic void addProject(Project project)\n\npublic void setCurrentProject(Project\
  \ project)\n\npublic void removeProject(Project project)\n\npublic MetaProject getMetadata()\n\
  \npublic void resetDashboard()\n\npublic void loadProject(String fileName, String\
  \ projectName)\n\npublic void setCanSave(boolean canSave)\n\npublic MetaObject getSelectedObject()\n\
  \npublic void deselectObjects()\n\npublic void setProject(Project project)\n\npublic\
  \ void editorAction(String actionName, ActionEvent event)\n\npublic void setMode(int\
  \ mode)\n\npublic FileManager getFileManager()\n\npublic void setFileManager(FileManager\
  \ fileManager)\n\npublic ConfigManager getConfigManager()\n\npublic void setConfigManager(ConfigManager\
  \ configManager)\n\npublic ClassLoader getClassLoader()\n\npublic void setClassLoader(ClassLoader\
  \ classLoader)\n\npublic Properties getProps()\n\npublic String getUserHome()\n\n\
  public String getBaseDir()\n\npublic int getMajorVersionNumber()\n\npublic int getMinorVersionNumber()\n\
  \npublic int getBuildNumber()\n\npublic MetaObject pasting(MetaObject target, MetaObject\
  \ pasted, MetaProject project)\n\npublic void processMenuItems(MetaObject metaObject)\n\
  \npublic void processMenuSeparators(MetaObject metaObject)\n\npublic void processTabPages(MetaObject\
  \ metaObject)\n\npublic void processPlacement(MetaObject object)\n\npublic void\
  \ processCreateLayout(MetaObject object)\n\npublic void updateDisplayLayer(MetaObject\
  \ object, int layerIndex)\n\npublic void propertyEditedRepaint(MetaObject object)\n\
  \npublic void processDeleteObject(MetaObject object)\n\npublic boolean getAttachedToDesigner()\n\
  \npublic void processProjectChangedState(boolean hasProjectChanged)\n\npublic void\
  \ processObjectNameChanged(MetaObject object)\n\npublic void runProject()\n\npublic\
  \ void setAçowDragging(boolean allowDragging)\n\npublic boolean allowDragging()\n\
  \npublic boolean isCustomizing()\n\npublic void setTitle(String title)\n\npublic\
  \ IdeMenuBar getIdeMenuBar()\n\npublic void showHelper(MetaObject metaObject, String\
  \ propertyName)\n\n// …… 后有许多私有方法 ……\n\n}\n```\n\n但如果 `SuperDashboard` 只包含 Listing\
  \ 10-2 中所示的方法呢？\n\n**Listing 10-2 `足够小？`**\n\n```\npublic class SuperDashboard extends\
  \ JFrame implements MetaDataUser\n\npublic Component getLastFocusedComponent()\n\
  \npublic void setLastFocused(Component lastFocused)\n\npublic int getMajorVersionNumber()\n\
  \npublic int getMinorVersionNumber()\n```\n\n\n\n\n\n```java\npublic int getBuildNumber()\n\
  }\n```\n\n五个方法并不多，对吧？在这种情况下，之所以这么多是因为尽管方法很少，`SuperDashboard` 承担了过多的职责。\n\n类的名称应该描述它所承担的职责。事实上，命名可能是帮助确定类大小的首要方法。如果我们无法为一个类推导出一个简洁的名字，那么它很可能太庞大了。类名越模糊，它越可能拥有过多的职责。例如，包含\
  \ `Processor`（处理器）、`Manager`（管理器）或 `Super`（超级）等模糊词的类名，通常暗示了职责的糟糕聚合。\n\n我们还应该能够用大约\
  \ 25 个词对该类进行简短描述，且不使用“如果”、“和”、“或”或“但是”这些词。我们该如何描述 `SuperDashboard` 呢？“`SuperDashboard`\
  \ 提供对最后持有焦点的组件的访问，它还允许我们跟踪版本和构建号。”第一个“和”暗示了 `SuperDashboard` 承担了过职责。\n\n### 单一职责原则\n\
  \n单一职责原则（SRP）规定，一个类或模块应该有一个且只有一个改变的原因。这一原则既为我们提供了职责的定义，也为类的大小提供了指导。类应该拥有一个职责——一个改变的原因。\n\
  \n在 [Listing 10-2] 中看似很小的 `SuperDashboard` 类有两个改变的原因。首先，它跟踪版本信息，这些信息在每次软件发布时似乎都需要更新。其次，它管理\
  \ Java Swing 组件（它是 `JFrame` 的派类，`JFrame` 是顶层 GUI 窗口的 Swing 表示）。无疑，如果我们更改了任何 Swing\
  \ 代码，我们将想要更新版本号，但反之未必然：我们可能会根据系统中其他代码的变化来更改版本信息。\n\n尝试识别职责（改变的原因）通常有助于我们识别并并在代码中创建更好的抽象。我们可以轻松地将\
  \ `SuperDashboard` 中所有处理版本信息的三个方法提取到一个名为 `Version` 的独立类中。（参见 [Listing 10-3]）。`Version`\
  \ 类是一个在其他应用程序中具有高重用潜力的构造结构！\n\n**Listing 10-3 `一个单一职责类`**\n\n```java\npublic class\
  \ Version {\n\n    public int getMajorVersionNumber()\n\n    public int getMinorVersionNumber()\n\
  \n    public int getBuildNumber()\n\n}\n```\n\nSRP 是面向对象设计中较重要的概念之一。它也是容易理解和遵循的概念之一。然而，奇怪的是，SRP\
  \ 往往是最常被滥用的类设计原则。我们经常遇到做了太多事情的类。为什么呢？\n\n让软件运行和让软件整洁是两项完全不同的活动。我们大多数人的脑子空间有限，所以我们更关注于让代码运行，而不是组织和整洁。这是完全合理的。在我们的编程活动中，保持关注点的分离与在程序中同样重要。\n\
  \n问题在于，我们太多的人认为只要程序运行了，任务就完成了。我们未能切换到组织和整洁这另一个关注点上。我们直接转向下一个问题，而不是回过头将臃肿的类拆分为具有单一职责的解耦单元。\n\
  \n同时，许多开发者担心大量微小、单一用途的类会更难理解大局。他们担心自己必须在类与类之间穿梭，才能弄清楚较大的工作是如何完成的。\n\n然而，一个拥有许多小类的系统，其活动部件并不比一个拥有几个大类的系统器多。在一个包含几个大类的系统中，要学习的内容也一样多。因此，问题是：你是希望你的工具被组织成一个有很多小抽屉的工具箱，每个抽屉都装有定义明确且标签良好的组件？还是你想要几个把所有东西都扔进去的抽屉？\n\
  \n每个大型系统都会包含大量的逻辑和复杂性。管理这种复杂性的首要目标是进行组织，让开发者知道去哪里寻找东西，并且在任何时刻只需要理解直接影响的复杂度。相比之下，一个拥有大型多用途类的系统总是通过强迫我们涉足许多现在不需要知道的东西来阻碍我们。\n\
  \n为了强调前面的几点：我们希望系统由许多小类组成，而不是少数大类。每个小类封装了一个单一职责，拥有一个改变的原因，并与其他几个类协作以实现所需的系统行为。\n\
  \n### 内聚性\n\n类应该拥有少量的实例变量。类的每个方法都应该操作这些变量中的一个或多个。通常，一个方法操作的变量越多，该方法与其类的内聚性就越高。每个变量都被每个方法使用的类具有最大的内聚性。\n\
  \n通常情况下，创建这种最大内聚类既是不明智也不可能的；另一方面，我们希望内聚性很高。当内聚性很高时，意味着类的方法和变量是相互依赖的，并作为一个逻辑整体结合在一起。\n\
  \n考虑 [Listing 10-4] 中 `Stack` 的实现。这是一个非常内聚的类。在三个方法中，只有 `size()` 未能使用两个变量。\n\n**Listing\
  \ 10-4 `Stack.java 一个内聚的类` .**\n\n```java\npublic class Stack {\n    private int\
  \ topStack = 0;\n\n    List<Integer> elements = new LinkedList<Integer>();\n\n \
  \   public int size() {\n        return topStack;\n    }\n\n    public void push(int\
  \ element) {\n        topStack++;\n        elements.add(element);\n    }\n\n   \
  \ public int pop() throws PoppedWhenEmpty {\n        if (topStack == 0)\n      \
  \      throw new PoppedWhenEmpty();\n        int element = elements.get(--topStack);\n\
  \        elements.remove(topStack);\n        return element;\n    }\n}\n```\n\n\
  保持函数短小和参数列表短小的策略有时会导致被部分方法使用的实例变量增多。当这种情况发生时，几乎总是意味着至少有一个类试图从大类中提取。你应该尝试将变量和方法分离到两个或多个类中，使得新类具有更高的内聚性。\n\
  \n### 维护内聚性导致许多小类\n\n仅仅将大函数拆分为较小函数的行为就会导致类的增多。考虑一个内部声明了许多变量的大函数。假设你想将该函数的一个小部分提取到一个独立的函数中。然而，你想要提取的代码使用了函数中声明的四个变量。你必须将这些变量作为参数传递给新函数吗？\n\
  \n完全不需要！如果我们将那四个变量提升为类的实例变量，那么我们就可以不传递任何变量的情况下提取代码。这将很容易将函数拆分成小块。\n\n不幸的是，这也意味着我们的类失去了内聚性，因为它们积累了越来越多的实例变量，这些变量仅仅是为了允许几个函数共享它们。但等等！如果有几个函数想要共享某些变量，这难道意味着它们本身就是一个类吗？当然是。当类失去内聚性时，拆分它们！\n\
  \n因此，将一个大函数拆分为许多小函数通常会给我们提供拆分若干更小类的机会。这为我们的程序提供了更好的组织和更透明的结构。\n\n\n\n\n为了说明我所说的，让我们使用\
  \ Knuth 优秀著作《可读程序》（*Literate Programming*）中的一个经典示例。列表 10-5 显示了 Knuth 的 `PrintPrimes`\
  \ 的 Java 翻译。为了对 Knuth 公平，这并不是他编写的程序，而是他的工具输出的内容。我使用它是因为它为将一个大函数拆分为许多函数和类提供了一个极佳的起点。\n\
  \n### 10-5 `PrintPrimes.java`\n\n```java\npackage literatePrimes;\n\npublic class\
  \ PrintPrimes {\n    public static void main(String[] args) {\n        final int\
  \ M = 1000;\n        final int RR = 50;\n        final int CC = 4;\n        final\
  \ int WW = 10;\n        final int ORDMAX = 30;\n        int P[] = new int[M + 1];\n\
  \        int PAGENUMBER;\n        int PAGEOFFSET;\n        int ROWOFFSET;\n    \
  \    int C;\n        int J;\n        int K;\n        boolean JPRIME;\n        int\
  \ ORD;\n        int SQUARE;\n        int N;\n        int MULT[] = new int[ORDMAX\
  \ + 1];\n        J = 1;\n        K = 1;\n        P[1] = 2;\n        ORD = 2;\n \
  \       SQUARE = 9;\n        while (K < M) {\n            do {\n               \
  \ J = J + 2;\n                if (J == SQUARE) {\n                    ORD = ORD\
  \ + 1;\n                    SQUARE = P[ORD] * P[ORD];\n                    MULT[ORD\
  \ - 1] = J;\n                }\n                N = 2;\n                JPRIME =\
  \ true;\n                while (N < ORD && JPRIME) {\n                    while\
  \ (MULT[N] < J) {\n                        MULT[N] = MULT[N] + P[N] + P[N];\n  \
  \                  }\n                    if (MULT[N] == J) {\n                \
  \        JPRIME = false;\n                    }\n                    N = N + 1;\n\
  \                }\n            } while (!JPRIME);\n            K = K + 1;\n   \
  \         P[K] = J;\n        }\n        PAGENUMBER = 1;\n        PAGEOFFSET = 1;\n\
  \        while (PAGEOFFSET <= M) {\n            System.out.println(\"The First \"\
  \ + M + \" Prime Numbers --- Page \" + PAGENUMBER);\n            System.out.println(\"\
  \");\n            for (ROWOFFSET = PAGEOFFSET; ROWOFFSET < PAGEOFFSET + RR; ROWOFFSET++)\
  \ {\n                for (C = 0; C < CC; C++) {\n                    if (ROWOFFSET\
  \ + C * RR <= M)\n                        System.out.format(\"%10d\", P[ROWOFFSET\
  \ + C * RR]);\n                }\n                System.out.println(\"\");\n  \
  \          }\n            System.out.println(\"\\f\");\n            PAGENUMBER =\
  \ PAGENUMBER + 1;\n            PAGEOFFSET = PAGEOFFSET + RR * CC;\n        }\n \
  \   }\n}\n```\n\n这个以单函数编写的程序是一团糟。。它具有深层缩进的结构、大量的奇葩变量以及紧耦合的结构。至少，这个大函数应该被拆分成几个较小的函数。\n\
