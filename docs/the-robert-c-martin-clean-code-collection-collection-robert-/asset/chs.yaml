  \ RR Donnelley 公司用再生纸印刷。\n第二次印刷，2011 年 8 月\n\n在 1986 年到 2000 年间，我与来自 Teradyne 的同事\
  \ Jim Newkirk 密切合作。他和我对编程和整洁代码充满热情。我们经常一起度过夜晚和周末，一起尝试不同的编程风格和设计技术。我们不断地构思业务想法。最终，我们共同成立了\
  \ Object Mentor, Inc.。在我们共同实施计划的过程中，我从 Jim 那里学到了很多东西。但最重要的之一是他的`工作道德`态度；这是我努力效仿的。Jim\
  \ 是一个专业人士。能与他共事并称他为朋友，我感到非常自豪。\n\n## 前言\n\n你拿起了这本书，所以我假设你是一个软件专业人士。这很好，我也是。既然我引起了你的注意，让我告诉：为什么我会拿起这本书。\n\
  \n这一切始于不久前，发生在一个不远的地方。大幕拉开，灯光亮起，摄像就位，Charley ....\n\n几年前，我在一家销售高度监管产品的中型公司工作。你知道那种类型；我们坐在一栋三层楼的格子间办公室里，总监及以上人员有私人办公室，而要让会议所需的所有人聚在同一个房间里，大约需要一周时间。\n\
  \n当我们在竞争激烈的市场中运营时，政府推出了一项新产品。\n\n突然，我们拥有了一批全新的潜在客户；我们所做的就是让他们购买我们的产品。这意味着我们必须在规定的截止日期向联邦政府提交申请，在另一个日期通过评估审计，并在第三个日期上市。\n\
  \n我们的管理层一次又一次向我们强调这些日期的重要性。稍有疏忽，政府就会将我们排除在市场之外一年；如果客户在第一天无法签约，他们都会去别人那里签约，而我们就会破产。\n\
  \n在这样的环境中，有些人会抱怨，而另一些人则指出“压力造钻石”。\n\n我当时是一名技术项目经理，从开发部门提拔的。我的责任是在上线当天让网站运行，以便潜在客户下载信息，最重要的是报名表。我在这项活动中的伙伴是面向业务的项目经理，我称他为\
  \ Joe。Joe 的角色是负责另一端，处理销售、营销和非技术需求。他也是那个喜欢说“压力造钻石”这种话的人。\n\n如果你在美国企业界做过很多工作，你可能见过互相指责、互相推诿和对工作的逃避，这些都是完全自然的。我们公司针对我和\
  \ Joe 的这个问题有一个有趣的解决方案。\n\n有点像蝙蝠侠和罗宾，我们的工作是把事情办成。我每天在一个角落与技术团队会面；我们每天都会重新制定计划，找出关键路径，然后从该路径中清除所有可能的障碍。如果有人需要软件；我们就去取。如果他们“很想”配置防火墙，但“天哪，该吃午饭了”，\n\
  \n\n\n\n让我们从另一个角度再次审视那个“蝙蝠侠与罗宾”式的技巧。我原以为我是在激励团队发挥出最佳水平，但我怀疑 Joe 在玩游戏，他隐含的假设是技术人员是他的对手。想一下：为什么有必要四处乱跑、踢翻椅子并倚在别人身上呢？\n\
  \n我们难道不应该能够询问员工什么时候能完成，得到一个肯定的答案，相信他们给出的答案，而不是被这种信任所误伤吗？\n\n当然，对于专业人士来说，我们应该……同时，我们又做不到。Joe\
  \ 不信任我们的答案，觉得对技术团队进行微管理很舒服但与此同时，出于某种原因，他信任法律团队，并且不愿意对他们进行微管理。\n\n这到底是怎么回事？\n\n不知为何，法律团队以一种技术团队没有的方式展示了专业性。\n\
  \n不知为何，另一群人说服了 Joe，他们不需要保姆，他们没有在玩游戏，他们需要被视为受尊敬的同辈。\n\n不，我不认为这与挂在墙上的华丽证书或多几年的大学时光有关，尽管那些大学时光可能包含了大量关于如何处世的隐性社交训练。\n\
  \n从多年前的那天起，我一直在想，技术职业需要发生怎样的改变才能被视为专业人士。\n\n噢，我有几个想法。我写过一些博客，读过很多书，成功改善了自己的工作处境并帮助了一些人。然而，我并不知道有哪一本书制定了计划，让这一切变得显性化。\n\
  \n然后有一天，毫无征兆地，我收到了一份审阅书籍初稿的邀请；你现在手里拿的这本书。\n\n这本书将一步步告诉你如何作为一个专业人士来展示自己并进行互动。不是通过陈词滥调，不是通过对几张纸的诉诸，而是通过你能做什么以及如何去做。\n\
  \n在某些情况下，示例是逐字对应的。\n\n其中一些示例有回复、反驳、澄清，甚至还有关于当对方试图“直接忽视你”时该怎么办的建议。\n\n嘿，看那里，Joe 又来了，这次在舞台左侧：\n\
  \n噢，我们又回到了 BigCo，Joe 和我再次在那个大型网站转换项目上。\n\n只是这一次，请想象得稍微有点不同。\n\n技术人员不再逃避承诺，而是真正做出了承诺。技术团队不再逃避估**值或让别人做规划（然后对此抱怨），而是实际上自我组织并做出了真正的承诺。\n\
  \n现在想象一下员工们实际上在共同工作。当程序员被运营部门阻碍时，他们拿起电话，系统管理员真的开始工作了。\n\n当 Joe 过来点火（施压）处理 14321\
  \ 号订单时，他不需要这样做；他可以看到 DBA 正在勤奋工作，而不是在浏览网页。同样，他从员工那里得到的估值似乎完全一致，他并不会觉得项目的优先级在午饭和查看邮件之间摇摆不定。所有的技巧和试图操纵进度的尝试，得到的不是“我们会试试的”，而是“这是我们的承诺；如果你想自己设定目标，请自便”。\n\
  \n过段时间，我怀疑 Joe 会开始将技术团队视为……嗯，专业人士。而且他是对的。\n\n那些将你的行为从技术人员转变为专业人士的步骤？你将在书的其余部分找到它们。\n\
  \n欢迎来到你职业生涯的下一步；我怀疑你会喜欢的。\n\n—Matthew Heusser\n\n*软件过程流程自然主义者*\n\n## 前言\n\n![image](img/Image00121.jpg)\n\
  \n1986 年 1 月 28 日东部时间上午 11:39，在发射后仅 73.124 秒、高度 48,000 英尺处，“挑战者号航天飞机因右侧固体助推器（`SRB`）故障而化为粉碎。七位勇敢的宇航员丧生，其中包括高中教师克里斯托亚·麦考利夫。McAuliffe\
  \ 母亲目睹女儿在九英里上方丧生时的脸部表情至今仍令我挥之不去。\n\n“挑战者号解体是因为故障的 `SRB` 中的热排气气体从壳体分段之间泄漏出来，溅射在外部燃料箱箱体上。主液氢箱底部爆炸，点燃燃料并驱动燃料箱向前，撞击了上方的液氧箱。与此同时，`SRB`\
  \ 从其后支架脱落并绕着其前支架旋转。它的鼻锥刺穿了液氧箱。这些异常的力矢量导致速度远超 `mach 1.5` 的整架飞行器逆着气流旋转。气动力力迅速将一切切成碎片。\n\
  \n在 `SRB` 的圆形分段之间，有两个同心的合成橡胶 O 型圈。当分段被螺栓在一起时，O 型圈被压缩，形成一个严密的密封，排气气体本不应该渗透。\n\n但在发射前的一个晚上，发射发射架的温度降到了\
  \ `17°F`，比 O 型圈规定的最低温度低了 23 度，比之前的任何一次发射都低了 33 度。结果是 O 型圈变得太硬，无法有效阻挡热气体。当 `SRB`\
  \ 点火时，由于热气体迅速积聚，产生了压力脉冲。助推器分段向外膨胀，释放了对 O 型圈的压缩。由于 O 型圈的硬度导致它们无法保持密封，因此部分热气体渗入，并在\
  \ 70 度弧度范围内汽化了 O 型圈。\n\n设计 `SRB` 的 Morton Thiokol 工程师早已知道 O 型圈存在问题，并在七年前就向 Thiokol\
  \ 和 NASA 的管理层报告了这些问题。事实上，以往发射的 O 型圈曾遭受过类似的损坏，尽管尚未达到灾难性的程度。温度最低的一次发射受到的损坏最严重。工程师们对该问题设计了修复方案，但修复方案的实施一直被推迟。\n\
  \n工程师怀疑 O 型圈在低温下会变硬。他们还知道，“挑战者号”发射时的温度比之前的任何发射都低，远低于红线。简而言之，工程师知道风险太高。工程师根据这一认知采取了行动。他们写了备录警告。他们强烈敦促\
  \ Thiokol 和 NASA 管理层不要发射。在发射前几小时举行的最后时刻会议上，这些工程师展示了最好的数据。他们愤怒、劝说、抗议。但最终，管理层忽略了他们。\n\
  \n发射时刻到来时，一些工程师拒绝观看直播，因为他们担心会在发射台上爆炸。但当“挑战者号”优雅地升入天空时，他们开始放松。在毁灭几刻，当他们看到飞行器穿越音速时，其中一人说他们躲了一劫。\n\
  \n尽管工程师有所有的抗议、备录和敦促，管理层仍然认为他们更清楚。他们认为工程师是过度反应。他们不相信工程师的数据或结论。他们发射是因为面临着巨大的财务和政治压力。他们希望一切如常。\n\
  \n这些管理层不仅是愚蠢，更是犯罪的。七位好人的生命，以及一代人对太空旅行的希望，在那个寒冷的早晨幻灭，因为这些管理层将自己的恐惧、希望和直觉置于专家的话之上。他们做出了他们没有权利做的决定。他们剥夺了真正专业的人的权威：工程师们。\n\
  \n\n\n但工程师们呢？工程师们确实做了他们应该做的事。他们告知了经理并为自己的职位努力奋斗。他们通过了适当的渠道并引用了所有正确的规程。他们在系统`within`\
  \ 内尽了所能——但经理们还是否决了他们。因此，工程师们似乎可以毫无其责地离开。\n\n但有时我在想，是否有那些工程师中的某些人在深夜彻夜难眠，被克里斯塔·麦考利夫（Christa\
  \ McAuliffe）母亲的那个形象所困扰，并后悔自己没有给丹·瑞瑟（Dan Rather）。\n\n## 关于这本书\n\n这本书关于软件专业主义的。它包含了许多务实的建议，试图回答以下问题，例如：\n\
  \n• 什么是软件专业人士？\n• 专业人士的行为是怎样的？\n• 专业人士如何处理冲突、紧迫的日程和不合理的经理？\n• 专业人士应该在何时、如何说“不”？\n\
  • 专业人士如何应对压力？\n\n但在书中务实的建议背后，你将发现一种正挣扎突破而出的态度。这是一种诚实、荣誉、自尊和骄傲的态度。这是一种愿意接受作为匠师和工程师的严峻责任的意愿。这种责任包括良好的工作和整洁的工作。它包括良好的沟通和诚实的估计。它包括管理你的时间以及面对困难的风险收益决策。\n\
  \n但那种责任还包括另一件事——一件令人恐惧的事。作为工程师，你对你的系统和项目拥有深度知识，这是任何经理都不可能拥有的。伴随知识而来的是行动（`act`）责任。\n\
  \n### 参考文献\n\n- **[McConnell87]:** Malcolm McConnell, *Challenger ‘A Major Malfunction’*\
  \ , New York, NY: Simon & Schuster, 1987\n- **[Wiki-Challenger]:** “挑战者号航天飞机灾难”，[`en.wikipedia.org/wiki/Space_Shuttle_Challenger_disaster`](http://en.wikipedia.org/wiki/Space_Shuttle_Challenger_disaster)\n\
  \n## 致谢\n\n我的职业是一系列合作与计划。尽管我有许多私人的梦想和抱负，但我似乎总能找到人一起分享。从这个意义上说，我觉得自己有点像西斯，“那里总有两个。”\n\
  \n我第一个可以认为是职业的合作是 13 岁时与 John Marchese 的合作。他和我策划要一起制造计算机。我是大脑，他是体力。我告诉他在哪里焊接电线，他就去焊接。我告诉他在哪里安装继电器，他就去安装。这非常有趣，我们在这上面花费了数百个小时。事实上，我们用继电器、按钮、灯光，甚至电传打字机（Teletypes）制造了许多令人印象深刻的对象。当然，它们没有一个实际上能起任何作用，但它们看起来非常了不起，我们为它们付出了巨大的努力。对约翰：谢谢！\n\
  \n在上中一年级，我在德语课上认识了 Tim Conrad。Tim 很`smart`。当我们组队制造一台计算机时，他是大脑，我是体力。他教我电子学，并让我初次接触了`PDP-8`。他和我实际上用基础元件制造了一个可以运行的电子\
  \ 18 位二进制计算器。它可以进行加、减、乘、除运算。我们花费了整整年的周末以及整个春季、夏季和圣诞假期。我们为此命如疯狂地工作。最后，它运行得非常好。对 Tim：谢谢！\n\
  \nTim 和我学习了如何编写计算机程序。这在 1968 年并不是易事，但我们做到了。我们得到了关于`PDP-8 assembler`、`Fortran`、`Cobol`、`PL/1`等书籍。我们狼吞虎咽了它们。我们写了那些我们没有希望执行的程序，因为我们没有计算机的使用权限。但仅仅出于出于热爱，我们还是写了它们。\n\
  \n我们的高中在二年级时开始了计算机科学课程。他们将一台`ASR-33 Teletype`连接到一个 110 波特的拨号调制调器（modem）他们在他们在伊利诺伊理工学院的`Univac\
  \ 1108`分时系统上有一个账户。Tim 和我立即成为了那台机器的实际操作员。没有其他人能靠近它。\n\n调制调器是通过拿起电话并拨打号码来连接的。当你听到应答调制调器发出的吱叫声时，你就按下电传打字机上的`“orig\"\
  `按钮，导致发送端调制调器发出自己的吱叫声。然后你挂断电话，数据连接就建立了。\n\n电话的拨盘上有一个锁。只有老师有钥匙。但这并不重要，因为我们学会了通过在电话挂钩上敲击电话号码来拨打电话（任何电话）。我是一个鼓手，所以我有很好的节奏感和反应。我可以在锁住的情况下，不到\
  \ 10 秒就拨通那个调制调器。\n\n我们在计算机实验室有两台电传打字机。一台是在线机器，另一台是离线机器。学生们用它们来写程序。学生在电传打字机上输入程序，并开启纸带冲孔器。每一个击键都会孔在纸带上。学生在`IITran`中编写程序，这是一种非常强大的解释型语言。学生会将他们的纸带留在电传打字机旁的一个篮子里。\n\
  \n放学后，Tim 和我会拨通计算机（当然是通过敲击），将纸带加载到`IITran batch system`系统中，然后挂断电话。以每秒 10 个字符的速度，这不是一个快速的过程。大约一小时后，我们会拨回去获取打印输出，同样是每秒\
  \ 10 个字符的速度。电传打字机并没有通过弹出纸张来区分学生的列表。它只是一个接一个地打印。\n\n\n\nJerry Fitzpatrick 也在 Teradyne\
  \ 工作过。我们是在一起玩《地下城》时相识的，但很快就建立了合作。我们在 Commodore 64 上编写了软件来支持《地下城》用户。我们还在 Teradyne\
  \ 启动了一个名为“电子接待员”（The Electronic Receptionist）的新项目。我们在一起工作了几年，他成为了一并一直是我的一位伟大的朋友。感谢你，Jerry！\n\
  \n在 Teradyne 工作期间，我在英国呆了一年。在那里，我和 Mike Kergozou 组成了伙伴。他和我一起策划了各种各样的计划，尽管其中大多数计划都与自行车和酒吧有关。但他是一个极其专注的程序员，非常注重质量和纪律（尽管，也许他本人并不认同）。感谢你，Mike！\n\
  \n1987 年从英国回来后，我开始和 Jim Newkirk 一起奇思妙想。我们都离开了 Teradyne（相隔了几个月），并加入了一家名为 Clear Communications\
  \ 的初创公司。我们在那里共同奋斗了多年，为了那从未到过的百万财富辛勤工作。但我们继续着奇思妙想。感谢你，Jim！\n\n最后，我们共同创立了 Object Mentor。Jim\
  \ 是我有幸工作过的最直率、最有纪律、最专注的人。他教了我许多东西，多到我在这里无法列举。相反，我将这本书献给了他。\n\n还有许多和我一起策划过奇思妙想的人，许多和我合作过的人，以及许多对我职业生涯产生影响的人：Lowell\
  \ Lindstrom, Dave Thomas, Michael Feathers, Bob Koss, Brett Schuchert, Dean Wampler,\
  \ Pascal Roy, Jeff Lang, James Grenning, Brian Button, Alan Francis, Mike Hill,\
  \ Eric Meade, Ron Jeffries, Kent Beck, Martin Fowler, Grady Booch，以及无尽的其他人。感谢大家。\n\
  \n当然，我生命中最大的合作者是我亲爱的妻子 Ann Marie。我在 20 岁时娶了她，在她满 18 岁后的三天。38 年来，她一直是我稳定的伴侣、我的舵和帆、我的爱和我的生命。我期待与她共同度过下一个十年。\n\
  \n现在，我的合作者和计划伙伴是我的孩子们。我与大女儿 Angela 紧密合作，她是我可爱的“老母鸡”和无畏的助手。她让我保持正直，从不让我忘记任何日期或承诺。我与我的儿子\
  \ Micah 一起策划商业计划，内是 `[8thlight.com](http://8thlight.com)` 的创始人。他的商业头脑比我当年的要好得多。我们最新的项目\
  \ `[cleancoders.com](http://cleancoders.com)` 非常令人兴奋！\n\n我的小儿子 Justin 刚刚在 8th Light\
  \ 与 Micah 工作。我的小女儿 Gina 是一个在霍尼韦工作的化学工程师。有了这两个孩子，严肃的策划才刚刚开始！\n\n生命中没有人能教你比你的孩子多。谢谢你们，孩子们！\n\
  \n## 关于作者\n\n![image](img/Image00122.jpg)\n\nRobert C. Martin（“Bob 大叔”）自 1970 年起一直是一名程序员。他是\
  \ Object Mentor, Inc. 的创始人兼总裁，这是一家由经验丰富的软件开发人员和经理组成的国际公司，专门帮助公司完成其项目。Object Mentor\
  \ 为全球大型企业提供流程改进咨询、面向对象的软件设计咨询、培训和技能开发服务。\n\nMartin 在各种行业杂志上发表了数十篇文章，并是国际会议和贸易展览会的常驻演讲者。\n\
  \n他编写并编辑了许多书籍，包括：\n\n- *Designing Object Oriented C++ Applications Using the Booch\
  \ Method*（使用 Booch 方法设计面向对象的 C++ 应用）\n- *Patterns Languages of Program Design 3*（程序设计模式语言\
  \ 3）\n- *More C++ Gems*（更多 C++ 宝石）\n- *Extreme Programming in Practice*（实践实践）\n\
  - *Agile Software Development: Principles, Patterns, and Practices*（敏捷软件开发：原则、模式与实践）\n\
  - *UML for Java Programmers*（Java 程序员的 UML）\n- *Clean Code*（整洁代码）\n\n作为软件开发领域的领军人物，Martin\
  \ 曾担任《C++ Report》总编辑三年，并在敏捷联盟的首任主席。\n\nRobert 还是 Uncle Bob Consulting, LLC 的创始人，并与其儿子\
  \ Micah Martin 共同创立了 The Clean Coders LLC。\n\n## 封底\n\n![image](img/Image00123.jpg)\n\
  \n封面上令人惊叹的图像让人想起萨罗隆之眼，那是 M1——蟹座大云。M1 位于牛户座，位于牛座左角星 Zeta Tauri 右侧约一度处。蟹座云是一颗超新星爆炸的遗迹，它在公元\
  \ 1054 年 7 月 4 日这个相当吉利的日子里将内脏洒满了整个天空。在 6500 光年的距离外，那次爆炸在中国观察者看来像一颗新星，亮度相当于木星。事实上，它在*白天也是可见的*！在接下来的六个月里，它逐渐从肉眼可见消失。\n\
  \n封面图像是可见光和 X 射光的复合。可见光图像由哈勃望远镜拍摄，形成了外壳。看起来像蓝色箭靶的内部物体是由 Chandra X 射线望远镜拍摄的。\n\n\
  可见光图像描述了一个快速膨的尘埃和气体云，其中夹着超新星爆炸留下的重元素。该云现在的直径为 11 光年，重量达 4.5 倍太阳质量，并以每秒 1500 公里的猛烈速度扩张。保守地说，那场古代爆炸的动能令人印象深刻。\n\
  \n目标正中心是一个明亮的蓝色点。那是*脉冲星*所在。正是脉冲星的形成导致了恒星最初的爆炸。注定毁灭的恒星核心几乎一个太阳质量的物质坍缩成了一个球。\n\n##\
  \ 前提介绍\n\n（不要跳过这里，你会用到的。）\n\n![image](img/Image00124.jpg)\n\n我假设你拿起这本书是因为你是一个程序员，并且对专业化的概念感兴趣。你确实应该感兴趣。专业化是我们的行业急需的。\n\
  \n我也是一个程序员。我当程序员 42 年了；在这一段时间里——我告诉你——我见证了一切。我被解雇过，被赞誉过。我担任过团队负责人、经理、基层员工，甚至过 CEO。我与天才程序员合作过，也与庸才合作过。\n\
  \n在本书的书中，我将尝试定义什么是专业程序员。我将描述我认为专业的态度、纪律和行为。\n\n我如何知道这些态度、纪律和行为的？因为我是通过痛苦教训学到的。你看，当我获得第一份程序员工作时，“专业”是你用来描述我的最后一个词。\n\
  \n那是 1969 年。我那时才 17 岁。我父亲催促一家名为 ASC 的本地企业聘佣我做临时兼职程序员。（是的，我父亲能做到那样的。我曾看着他冲到一辆飞驰汽车的车前伸出手命令它“停下！”车停住了。没有人能拒绝我父亲。）公司把我安排在一个存放所有\
  \ IBM 计算机手册的房间里工作。他们让我手册中加入多年的更新。正是在那里，我第一次看到了这句话：“本页特意留白。”\n\n\n\n\n\n在更新了几天说明书后，我的主管要求我写一个简单的\
  \ `Easycoder` 程序。被选中做这件事我非常狂喜。我以前从未为真实的计算机写过程序。然而，我曾“吸入”过大量关于 Autocoder 的书籍，对于如何开始有一个模糊的认识。\n\
  \n这个程序简单来说就是从磁带上读取记录，并将这些记录的 ID 替换为新 ID。新 ID 从 1 开始，每条新记录加 1。带有新 ID 的记录将被写入一条新磁带中。\n\
  \n我的主管向我展示了一个架子，上面放着许多叠红色和蓝色的孔片。想象一下你买了 50 叠扑牌，25 叠红色的，25 叠蓝色的。然后你把这些牌一叠叠在一起。这些卡片看起来就是那样。它们是红蓝相间的条纹，每条纹大约有\
  \ 200 张卡片。每一条纹都包含了程序员通常使用的子程序库源代码。程序员只需从堆的顶端取出一叠，确保只取了红色或蓝色的卡片，然后将其放在自己程序程序牌堆的末尾即可。\n\
  \n我在一些编码表上写了我的程序。编码表是大型矩形纸张，分为 25 行 80 列。每行代表一张卡片。你用大写字母和 #2 号铅笔在编码表上写你的程序。在每行的最后\
  \ 6 列中，你用 #2 号铅笔写一个序列号。通常你会增加序列号 10，以便稍后插入卡片。\n\n编码表被送到打字员那里。这家公司有几十个女性，她们从一个大收件箱中取出编码表，然后将它们“输入”到打孔机中。这些机器非常像打字机，不同之处字符是冲孔在卡片上，而不是打印在纸上。\n\
  \n第二天，打字员通过办公室内邮件将我的程序还给了我。我那小叠孔片是被用我的编码表和一根橡皮筋缠在一起的。我检查了卡片是否有打孔错误。没有。于是我将子程序库牌堆放在程序牌堆的末尾，然后把牌堆带上楼交给计算机操作员。\n\
  \n计算机位于上锁的房间里，房间里有环境控制系统和架空地板（为了所有的电缆）。我敲了敲门，一个操作员冷冷地从我手中拿过牌堆，将其放入计算机房内的另一个收件箱中。当他们轮到时，就会运行我的牌堆。\n\
  \n第二天，我拿回了牌堆。它被包裹在运行结果的清单里，并用橡皮筋固定在一起。（在那个年代，我们用了大量的橡皮筋！）\n\n我打开清单，发现我的编译失败了。清单中的错误信息对我来说非常难以理解，所以我把它带到了我的主管那里。他看了看，嘴里嘟囔着什么，在清单上做了一些快速记录，抓起我的牌堆，然后让我跟着他走。\n\
  \n他带我来到打孔室，坐在一台空闲打孔机前。他一个接一个纠正了错误的卡片，并添加了一两张其他卡片。他很快解释了自己在做什么，但这一切都过得像闪电一样。\n\n\
  他带着新牌堆来到计算机房敲了敲门。他对其中一个操作员说了些魔咒般的话，然后走进了计算机房。他示意我跟上。操作员设置了磁带驱动器并在我们注视下加载了牌堆。磁带旋转，打印机咔哒作响，然后结束了。程序运行成功了。\n\
  \n第二天，我的主管感谢我的帮助，并终止了我的雇佣。显然，ASC 认为他们没有时间培养一个 17 岁的孩子。\n\n但我与 ASC 的联系并没有结束。几个月后，我在\
  \ ASC 获得了一份全职的二班倒工作，负责离线打印机。这些打印机根据存储在磁带上的打印图像打印垃圾邮件。我的工作是给打印机装纸，将磁带装入磁带驱动器，解决卡纸问题，并在其他时候只是看着机器运行。\n\
  \n那是 1970 年。大学对我来说并不是一个选择，也没有任何特别吸引力。越南战争仍在激烈进行，校园一片混乱。我继续“吸入”关于 `COBOL`、`Fortran`、`PL/1`、`PDP-8`\
  \ 和 `IBM 360 Assembler` 的书籍。我的意图是跳过学校，尽我所努力找一份编程工作。\n\n十二 个月后，我实现了那个目标。我被升为 ASC\
  \ 的全职程序员。我和两个好朋友 Richard 和 Tim（也才 19 岁）与其他三名程序员一起工作，为一个卡车司机会编写一个实时会计系统。机器是一台 `Varian\
  \ 620i`。它是一台简单的微型计算机，架构类似于 `PDP-8`，但它有 16 位字长和两个寄存器。语言是汇编语言。\n\n我们编写了系统中的每一行代码。我的意思是每一行。我们写了操作系统、中断处理头、`IO\
  \ drivers`、磁盘的 `file system`、覆盖层交换器，甚至还有可定位链接器。更不用说所有的应用程序代码了。为了赶上地狱般的期限，我们在 8 个月内每周工作\
  \ 70 到 80 小时完成了这一切。我的薪水每年 7,200 美元。\n\n我们交付了那个系统。然后我们辞职了。\n\n我们突然辞职了，而且带着恶意。你知道的，在做了所有工作之后，在获得了一个成功的系统之后，公司只给了我们\
  \ 2% 的加薪。我们感到被欺骗和被虐待了。我们中的几个人找到了其他工作。\n\n然而，我采取了一种不同的、非常不幸的方法。我和一个哥们冲进老板的办公室大声辞职。这在情感上非常解气——持续了一天。第二天我意识到我没有工作了。我\
  \ 19 岁，失业，没有学历。我在姐夫的割草机修理店工作了四个月。不幸的是，我是一个糟糕的割草机修理工。他最终把我开了。我陷入了糟糕的低谷。我每天熬到凌晨 3\
  \ 点吃披萨，在父母的老黑白电视上看怪物电影。只有电影里的鬼魂是真的。我下午 1 点才起床，因为我不想面对那些阴暗的日子。我在当地社区学院上了一门微积分课程并挂格了。我个人都崩溃了。\n\
  \n我妈妈把我拉到一边，告诉我我的生活一团糟，说我在没有新工作的情况下辞职、情绪化地辞职以及和朋友一起辞职有多蠢。她告诉我，你永远不要在没有新工作的情况下辞职，要总是冷静、冷静且独自地离开。她告诉我应该给我的老老板打电话求回我的工作。她说：“你需要吃点闭脸。”\n\
  \n\n\n\n\n你可能认为我已经吸取了教训，认为我现在已经是一个专业人士了。事实并非如此。那只是我需要学习的许多教训中的第一个。在接后的几年里，我曾因为疏忽错过了关键日期而被解雇，还曾因为无意中向客户泄露机密信息差点被开除。我曾主持一个注定会失败的项目，并在没有寻求我明知需要的帮助的情况下任由其走向毁灭。我曾会激进地捍卫自己的技术决策，即使这些决策完全违背了客户的需求。我曾雇用一个完全不合格的人，给我的雇主留下了巨大的待处理麻烦。最糟糕的是，由于我的领导能力不足，导致另外两个人被解雇。\n\
  \n所以，请把这本书看作是我自己的错误目录、我自己的罪行记录，以及一套能让你你避免重蹈我早年覆辙的指南。\n\n## 1. 专业主义\n\n![image](img/Image00125.jpg)\n\
  \n*“噢，笑笑吧，库廷，老兄。这是上帝、命运或自然——随你喜欢称呼——对我们开的一个天大玩笑。但无论是谁或什么力量开了这个玩笑，确实很有幽默感！哈！”*\n\n\
  —*霍华德*，《金山矿藏》\n\n所以，你想成为一个专业的软件开发者，对吧？你想挺起胸膛向世界宣告：“我是一个专业人士！”你希望人们以尊重的目光看待你，并以人的态度对待你。你希望妈妈们指着你告诉他们的孩子要像你一样。你想要这一切。对吧？\n\
  \n### 小心你的要求\n\n“专业主义”（Professionalism）是一个内涵丰富的词。它无疑是荣誉和自豪的勋章，但也是责任和问责的标志。当然，两者是并行的。你无法对一件你无法负责的事情感到自豪和荣誉。\n\
  \n成为一个非专业人士容易得多。非专业人士不需要对他们做的工作负责——他们把这交给雇主。如果一个非专业人士犯了错，雇主会收拾残局。但当一个专业人士犯错时，`he`会亲自收拾残局。\n\
  \n如果你允许一个漏洞溜过模块，并导致公司损失 10,000 美元，会发生什么？非专业人士会耸耸肩说“常有的事”，然后开始编写下一个模块。专业人士会给公司开一张\
  \ 10,000 美元的支票！\n\n是啊，如果是你自己的钱，感觉确实不太一样，不是吗？但这种感觉是专业人士一直有的感受。事实上，这种感觉正是专业主义的本质。因为，你看，专业主义的核心就是承担责任。\n\
  \n### 承担责任\n\n你读了引言，对吧？如果没有读，现在回去读一下吧；它为书中后续的所有内容奠定了背景。\n\n我是通过忍受不承担责任所导致的后果，才学会承担责任的。\n\
  \n1979 年，我在一家名为 `Teradyne` 的公司工作。我是一套软件的“负责工程师”，该软件控制一个基于微型和微型的系统，用于测量电话线路的质量。中心微机通过\
  \ 300 波特的专用或拨号电话线连接到几十个控制测量硬件的卫星微机。代码全部是用汇编语言编写的。\n\n我们的客户是大型电信公司的服务经理。每个人负责 100,000\
  \ 条或更多的线路。我的系统帮助这些服务区域经理在客户察觉之前发现并修复电话线路中的故障和问题。这降低了公用事业委员会衡量的客户投诉率，该率还用于监管电信公司可以收取的资费标准。简而言之，这些系统极其重要。\n\
  \n有一个 `nightly routine`，中心微机会告诉每台卫星微机测试其控制下的每条电话线路。每天早上，中心计算机都会调出故障线路列表及其故障特征。服务区域经理会利用这份报告安排维修人员，在客户投诉之前修复故障。\n\
  \n有一次，我向几十个客户发布了一个新版本。“Ship”（发布）这个词用得很准确。我将软件写在磁带上，并将这些磁带寄给客户。客户加载磁带，然后重启系统。\n\n\
  新版本修复了一些细微缺陷，并添加了客户一直要求的新功能。我们告诉过他们，将在某个日期前提供这个新功能。我费力力通过快递寄出磁带，以确保它们在承诺的日期送达。\n\
  \n两天后，我接到了我们的现场服务经理汤姆的电话。他告诉我，几位客户投诉 `nightly routine` 没有完成，他们没有收到任何报告。我的心沉了半截，因为为了准时交付软件，我忽略了对该例程的测试。我测试了系统的许多其他功能，但测试该例程需要几个小时，而我必须立即发布软件。由于任何一个错误修复程序（bug\
  \ fixes）都不在例程代码中，所以我觉得是安全的。\n\n丢失一份夜间报告是一件 `big deal.`。这意味着维修人员的工作量减少了，但之后他们会过载。这意味着某些客户可能会发现故障并投诉。丢失一天的数据足以让一个服务区域经理给汤姆打电话并痛斥他。\n\
  \n我启动了实验室系统，加载了新软件，然后运行了例程。它花了几个小时，但随后中止了。例程失败了。如果我在发布之前运行过这个测试，服务区域就不会丢失数据。\n\n\
  \n\n\n\n软件开发人员能造成什么伤害？从纯粹软件的角度来看，他或她可能会对软件的功能和结构造成破坏。我们将探讨如何避免这种行为。\n\n## 对功能不造成伤害\n\
  \n显然，我们希望软件能够正常运行。事实上，今天我们大多数人之所以成为程序员，是因为我们曾经让某些东西成功运行过，并且我们想要再次获得那种感觉。但我们并不是唯一希望软件运行的人。我们的客户和雇主也希望它运行。事实上，他们付钱是为了让我们创建出完全按照他们的意运行的软件。\n\
  \n当我们创建 bug 时，我们就损害了软件的功能。因此，为了表现出专业性，我们不能创建 bug。\n\n“等一下！”我听到你抗议道，“这不合理。软件太复杂了，不可能创建出没有\
  \ bug 的。”\n\n当然，你是对的。软件*确实*复杂到无法创建出没有 bug。遗憾的是，这并不能让你免除责任。人体极其复杂，无法完全理解，但医生仍然会下誓不伤害病人。如果他们都不像*那样*推卸责任，我们又怎么能呢？\n\
  \n“你是在告诉我们必须是完美的吗？”我听到你在反对？\n\n不，我是在告诉你，你必须对你的不完美负责。代码中肯定会发生 bug 这一事实并不意味着你不对它们负责。编写完美软件的任务实际上几乎是不可能的，这一事实并不意味着你对不完美不负责。\n\
  \n专业人士的宿命即使错误几乎是必然的也要对错误负责。所以，我志向专业人士的人，你们必须练习的第一件事就是道歉。道歉是必要的，但是不够的。你不能反复地犯同样的错误。随着你职业技能的成熟，你的错误率应该迅速趋向零的渐线。它永远不会变为零，但尽可能接近零是你的责任。\n\
  \n## QA 不应该发现任何问题\n\n因此，当你发布软件时，你应该预期 QA 不要发现任何问题。故意将你明知有缺陷的代码发送给 QA 是极度不专业的行为。你认为哪些代码是有缺陷的呢？任何你不*确定*的代码！\n\
  \n有些人把 QA 当作 bug 捕猎者。他们向 QA 发送没有彻底检查的代码。他们依赖 QA 来发现 bug 并反馈给开发者。事实上，有些公司根据 QA 发现的\
  \ bug 数量给他们发放奖励。bug 越多，奖励越高。\n\n不要管这种行为多么昂贵，它会损害公司和软件。不要管这种行为如何破坏进度，并削弱企业对开发团队的信心。不要管这种行为是纯粹的懒惰和不负责任。发布你不知道是否运行的代码给\
  \ QA 是不专业的。它违反了“不造成伤害”的原则。\n\nQA 会发现 bug 吗？可能，所以准备好道歉——然后弄清楚这些 bug 是如何逃过你的注意的，并采取措施防止它们再次发生。\n\
  \n每当 QA，或者更糟的*用户*发现问题时，你都应该感到惊讶、懊恼，并决心防止它再次发生。\n\n## 你必须*知道*它在运行\n\n你如何能*知道*你的代码运行正常？这很简单。测试它。再测试一遍。向上测试。向下测试。用方方法八门测试一遍！\n\
  \n也许你担心如此反复测试代码会花费太多时间。毕竟你还有进度表和截止日期要遵守。如果你把所有时间都花在测试上，你就永远写不出其他东西了。得好！所以，让你的测试自动化。编写可以随时执行的单元测试，并尽可能地运行这些测试。\n\
  \n代码中有多大比例应该通过这些自动化单元测试来测试？我真的需要回答这个问题吗？全部！每。一。行。\n\n我是在建议 100% 的测试覆盖吗？不，我不是在*建议*。我是在*要求*。你写的每一行代码都应该被测试。此此。\n\
  \n这不切实际吗？当然不是。你写代码是因为你预计它会被执行。如果你预计它会被执行，你就应该*知道*它是运行良好的。知道这一点的唯一方法就是测试。\n\n我是一个开源项目\
  \ `FIT NESSE` 的主要贡献者和提交者。截至此时，`FIT NESSE` 有 6 万行代码（sloc）。这 6 万行中有 26 行是通过 2000 单元测试编写的。Emma\
  \ 报告说那 2000 个测试的覆盖率为 90%。\n\n为什么我的代码覆盖率不高？因为 Emma 看不到所有正在执行的代码行！我相信覆盖率比那高得多。覆盖率是\
  \ 100% 吗？不，100% 是一个渐线。\n\n但有些代码很难测试吗？是的，但那是因为那些代码被*设计*得很难测试。解决办法是设计你的代码使其*易于*测试。而最好的方法是在编写通过测试的代码之前，先写好测试。\n\
  \n这种纪律被称为测试驱动开发（TDD），我们将在后面的章节中详细说明。\n\n## 自动化 QA\n\n`FIT NESSE` 的整个 QA 流程是执行单元测试和验收测试。如果这些测试通过了，我就发布。这意味着我的\
  \ QA 流程大约需要三分钟，我可以随心所欲地执行。\n\n现在，确实如果 `FIT NESSE` 中有一个 bug，没有人会死。也没有人损失数百万。另一方面，`FIT\
  \ NESSE` 有数万名用户，但 bug 列表非常小。某些系统确实如此关键，以至于短时间的自动化测试无法判断是否已就绪。作为开发者，你需要一种相对快速且可靠的机制来确认你写的代码运行且没有干扰系统的其他部分。所以，至少，你的自动化测试应该告诉你系统可以通过\
  \ QA。\n\n## 对结构不造成伤害\n\n真正的专业人士知道，以结构为代价交付功能是徒劳的。正是代码的结构才让它具有灵活性。如果你损害了结构，你就损害了未来。\n\
  \n所有软件项目的基本假设是软件是易更改的。如果你通过创建僵化的结构来违反这一假设，你就破坏了整个行业赖以生存的模式。\n\n简而言之：*你必须能够在不产生巨大成本的情况下进行更改。*\n\
  \n遗憾的是，许多项目陷入了糟糕结构的泥潭。过去几天就能完成的任务变成几周，然后是几个月。管理层为了夺回流失的动力，雇佣了更多开发者来加速。但这些开发者只是在泥上添水，加深了结构的破坏并增加了障碍。\n\
  \n这种哲学有时被称为*无情重构*。我称其为“童子军法则”：在离开一个模块时，要比进入时更干净。每当你看到代码时，都要对其进行一些随机的善举。\n\n\n\n\n\
  \n这完全与大多数人对软件的看法背道而驰。他们认为对运行中的软件进行连续的更改是*危险的*。不！危险的是让软件保持静态。如果你不经常“操练”它，那么当你*真的*需要更改它时，你会发现它变得僵化。\n\
  \n为什么大多数开发者害怕对他们的代码进行持续更改？他们害怕自己会破坏它！为什么他们害怕会破坏它？因为他们没有测试。\n\n这一切都归结于测试。如果你有一套涵盖了几乎\
  \ 100% 代码的自动化测试套件，而且这套测试可以随心所欲快速执行，那么*你根本不会害怕改变代码*。如何证明你不害怕改变代码？你不断在改变它。\n\n专业开发者对自己的代码和测试充满自信，以至于在进行随机的、机会性的更改时表现出一种近乎疯狂的随性。他们会随心所欲更改一个类的名称。他们在阅读一个模块时会注意到一个较长的方法，并理所当然地对其进行重构。他们会将一个\
  \ `switch` 语句转换为多态部署，或将一个继承层次结构压缩为命令链。简而言之，他们对待软件的方式就像雕塑家对待粘土一样——不断地塑造和塑造它。\n\n\
  ## 职业操守\n\n你的职业是*你自己的*的责任。确保你具有市场竞争力不是你雇主的责任。培训你、送你参加会议或为你买书籍也不是雇主的责任。这些事情都是*你自己*的责任。将职业生涯寄托于雇主的软件开发者是不幸的。\n\
  \n有些雇主愿意为你买书并送你参加培训课程和会议。这没关系，他们是在帮你。但永远不要掉入认为这是雇主责任的陷阱。如果你的雇主没有为你做这些事，你应该想办法自己去做。\n\
  \n提供你学习所需的时间也不是雇主的责任。有些雇主可能会提供这些时间。有些雇主甚至要求你花时间学习。但再次，他们是在帮你，你应该给予相应的感激。这种帮助不是你应该预期的。\n\
  \n你欠雇主一定的时间和精力的。为了方便起见，让我们使用美国标准的每周 40 小时。这 40 小时应该花在*雇主*的问题上，而不是*你*的问题上。\n\n你应该计划每周工作\
  \ 60 小时。前 40 小时是给雇主的。剩下的 20 小时属于你自己。在这剩下的 20 小时里，你应该阅读、练习、学习并以其他方式提升你的职业。\n\n我能听到你在想：“但我的家庭呢？我的生活呢？我应该为了你的雇主牺牲他们吗？”\n\
  \n我在这里说的不是你*所有的*空闲时间。我说的是每周额外的 20 小时。大约是每天三小时。如果你利用午休时间阅读，通勤时听播客，每天花 90 分钟学习一门新语言，你就能涵盖这一切。\n\
  \n算算账吧。一周有 168 小时。给雇主 40 小时，给你的职业另外 20 小时。剩下 108 小时。再睡眠 56 小时，剩下 52 小时给其他事情。\n\n\
  也许你不想做出那种承诺。这没关系，但你不应该认为自己是一个专业人士。专业人士会花*时间*来照顾他们的职业。\n\n也许你认为工作应该留在工作场所，你不应该把它带回家。我同意！在那\
  \ 20 小时里，你不应该为你的雇主工作。相反，你应该为你的职业工作。\n\n有时这两者是契合的。有时你为雇主做的工作对你的职业非常有益。在这种情况下，花那 20\
  \ 小时中的部分时间是合理的。但请记住，那 20 小时是给你*你*的。它们是用来让你自己作为一个专业人士更有价值。\n\n也许你认为这是职业倦的配方。相反，这是*避免*职业倦的配方。你之所以成为软件开发者是因为你对软件充满热情，你成为专业人士的渴望受这种热忱驱动。在那\
  \ 20 小时里，你应该去做那些能*强化*这种热忱的事情。这 20 小时应该是*有趣*的！\n\n## 了解你的领域\n\n你知道什么是 Nassi-Schneiderman\
  \ 图吗？如果不知道，为什么？你知道 Mealy 机和 Moore 机的区别吗？你应该知道。你能不查阅就写出一个快速排序吗？你知道“转换分析”（Transform\
  \ Analysis）这个术语的意思吗？你能用数据流图（Data Flow Diagrams）进行功能分解吗？“路过数据”（Tramp Data）这个术语是什么意思？你听过“耦合”（Conascence）这个词吗？什么是\
  \ Parnas 表（Parnas Table）？\n\n思想、学科、技术、工具和术语点缀了我们领域的过去五十年。你对这些了解多少？如果你想成为一个专业人士，你应该了解其中很大一部分，并不断增加这部分的规模。\n\
  \n为什么你应该知道这些东西？毕竟，我们的领域进步不是如此迅速，以至于所有这些旧观念都过时了吗？这个问题的第一个部分表面上显而易见。确实，我们的领域正在以异常迅猛的速度进步。有趣的是，这种进步在许多方面是外围的。确实，我们不再需要等待\
  \ 24 小时来获得编译结果了。确实，我们编写的是 GB 级的系统。另一方面，我们写的还是 50 年前的那些 `if` 和 `while` 语句。很多变化，很多没变。\n\
  \n问题的第二部分并非如此。过去 50 年很少的想法变得过时。有些被边缘化了，这是事实。瀑布开发模式显然不再青睐。但这并不意味着我们不应该了解它。\n\n总来说，过去\
  \ 50 年积累的绝大多数优秀思想在今天仍然具有同样的价值。也许现在更有价值。\n\n记住桑雅塔的格言：“不记得过去的人注定重蹈。”\n\n以下是每个软件专业人士应该掌握的极简列表：\n\
  \n- 设计模式：你应该能够描述 GOF 书中的 24 种模式，并对 POSA 书中的许多模式有工作性的了解。\n- 设计原则：你应该了解 `SOLID` 原则，并对组件原则有良好的理解。\n\
  - 方法：你应该理解 `XP`、`Scrum`、`Lean`、`Kanban`、`瀑布`、结构化分析和结构化设计。\n- 规范：你应该实践 `TDD`、面向对象设计、结构化编程、持续集成和配对编程。\n\
  - 产物：你应该知道如何使用：`UML`、`DFDs`、结构图、`Petri 网`、状态转换图和表、流程图和决策表。\n\n\n\n\n\n阅读书籍、文章、博客、推文。参加会议。加入用户组。参与阅读和学习小组。学习你舒适区之外的知识。如果你是一个\
  \ `.NET` 程序员，去学 Java。如果你是一个 Java 程序员，去学 Ruby。如果你是一个 `C` 程序员，去学 Lisp。如果你真的想挑战一下大脑，就去学\
  \ Prolog 和 Forth 吧！\n\n## 练习\n\n人士会进行练习。真正的专业人士努力保持自己技能的敏锐并随时就绪。仅仅完成你的日常工作并称之为练习是不够的。完成日常工作是表现，而不是练习。练习是你特意在工作表现\
  \ `outside` 锻炼你的技能，唯一目的是为了精炼和增强这些技能。\n\n对于软件开发者来说，练习可能意味着什么呢？起初，这个概念似乎很荒谬。但停下来想一想。考虑音乐家是如何精通技艺的。不是通过表演，而是通过练习。他们是如何练习的呢？除此之外，他们有专门进行的特殊练习。音阶、练习曲和跑指。他们反复进行这些练习，以训练手指和大脑，并保持对技能的精通。\n\
  \n那么软件开发者可以做什么来练习呢？书中有一整章专门介绍不同的练习技术，所以我在这里不会详细阐述。我经常使用的一种技术是重复简单的练习，例如`保龄球游戏`或`质因分解`。我将这些练习称为\
  \ `kata`（型）。有很多这样的 kata 可供选择。\n\nkata 通常以解决一个简单编程问题的形式出现，例如编写一个计算整数质因数的函数。做 kata\
  \ 的意义不在于如何解决问题；你已经知道如何做了了。kata 的意义在于训练你的手指和大脑。\n\n我每天都会做一两个 kata，通常作为进入工作状态的一部分。我可能会用\
  \ `Java`、`Ruby`、`Clojure` 或者其他我想要保持其技能水平的语言来做。我会利用 kata 来磨练特定的技能，例如让手指习惯按快捷键，或使用某些重构方法。\n\
  \n把 kata 想象成早晨 10 分钟的热身运动和傍晚 10 分钟的放松运动。\n\n## 协作\n\n学习的第二种方法是与他人协作。专业的软件开发者会花专门共同编程、共同练习、共同设计和计划。通过这种方式，他们从彼此中学到了很多东西，并且能更快、更准确地完成工作。\n\
  \n这并不意味着你必须花 100% 的时间与他人一起工作。独处时间也非常重要。尽管我很喜欢与他人结对编程，但如果我不能抽空自己待一会儿，我会疯的。\n\n##\
  \ 导师\n\n最好的学习方法是教。没有什么比必须向你负责的人传达事实和价值观更快、更强有力地将它们植入你的脑海了。因此，教学的益处对老师来说是非常有利的。\n\
  \n同样，没有比把新成员引入一个组织更好的方法了，就是和他们坐在一起，向他们展示门道。专业人士对指导后辈负有责任。他们不会让后辈在没有指导的情况下胡乱摸索。\n\
  \n## 了解你的领域\n\n每个软件专业人士都有责任理解他们正在编写的解决方案所属的领域。如果你在写一个会计系统，你应该了解会计领域。如果你在写一个旅游应用程序，你应该了解旅游行业。你不需要成为领域专家，但你应该进行相当的尽职调查。\n\
  \n在一个新领域启动项目时，读一两本关于该主题的书。采访你的客户和用户，了解该领域的基础和基本知识。与专家花些时间，尝试理解他们的原则和价值观。\n\n仅仅在不理解该规格对业务为何意义的情况下就根据规格编写代码，是最糟糕的不专业行为。相反，你对该领域应该足够的了解，以便能够识别并挑战规格中的错误。\n\
  \n## 认同你的雇主/客户\n\n你雇主的问题就是`你`的问题。你需要理解这些问题是什么，并朝着最佳解决方案努力。在开发系统时，你需要把自己放在雇主的位置考虑，并确保你正在开发的功能真的能满足你雇主的需求。\n\
  \n开发者之间互相产生认同很容易。你很容易对你的雇主产生“我们对阵他们”的态度。专业人士不惜一切地避免这一点。\n\n## 谦逊\n\n编程是一种创造行为。当我们编写代码时，我们正在从无中创造有。我们正在大胆地在混乱中建立秩序。我们正在自信地以精确的细节指挥一台否则可能造成不可估损害的机器的行为。因此，编程是一种极度傲慢的行为。\n\
  \n专业人士知道自己是傲慢的，并且并不虚伪。专业人士了解自己的工作，并为自己的工作感到自豪。专业人士对自己的能力充满自信，并基于这种自信采取大胆且经过计算的冒险。专业人士不是胆怯的。\n\
  \n然而，专业人士也知道会有某些他会失败，他的风险计算是错误的，他的能力将不足；他看着镜子，看到一个傲慢的笨蛋在对他微笑。\n\n所以，当一个专业人士发现自己成为笑话时，他会是第一个笑的人。他永远不会嘲笑别人，但在理受时会接受嘲笑，并在不值得时付之一笑。他不会因为别人犯错而贬低他人，因为他知道自己可能是下一个失败的人。\n\
  \n专业人士理解自己极度的傲慢，以及命运最终会注意到并使其平衡。\n\n### 参考文献\n\n**[PPP2001]:** Robert C. Martin,\
  \ *Principles, Patterns, and Practices of Agile Development*, Upper Saddle River,\
  \ NJ: Prentice Hall, 2002.\n\n## 2. 说\n\n![image](img/Image126.jpg)\n\n*“做；不做。没有尝试。”*——*尤达*\n\
  \n\n\n\n当时有十几台 300 波特的半双工终端，将芝加哥的卡车司机总部与我们位于北方 30 英里郊区的机器连接起来。这些终端每隔大约 30 分钟就会锁死一次。我们以前见过这个问题，但当时还没有模拟过工会数据录入员突然涌入我们系统的流量。\n\
  \n更糟糕的是，那些通过 110 波电话线连接到我们系统的 `ASR35` 电打字机打印的样页会在打印过程中卡住。\n\n解决这些卡死的方法就是重启。因此，他们必须让所有终端仍在运行的人完成工作并停止。当大家都停下来后，他们就会打电话让我们重启。那些工作被卡住的人必须重新开始。而这种情况每小时发生好几次。\n\
  \n在这样持续半天之后，卡车司机办公室的经理告诉我们关闭系统，在修好它之前不要再次启动它。与此同时，他们损失了半天的工作，必须使用旧系统重新输入所有内容。\n\n\
  我们在整栋大楼都能听到弗兰克（Frank）的哀嚎和咆哮。这些声音持续了很久、很久。然后，比尔（Bill）和我们的系统分析师贾利尔（Jalil）来到我们这里，问什么时候能让系统稳定下来。我说：“四周。”\n\
  \n他们脸上的表情是惊恐，然后是坚定。“不，”他们说，“它必须在周五之前运行。”\n\n于是我说：“听着，我们上周才刚刚让这个系统勉强运转起来。我们需要排除故障和问题。我们需要四周时间。”\n\
  \n但比尔和贾利尔非常坚决。“不，真的必须在周五。你至少可以试一下吗？”\n\n然后我们的团队负责人说：“好吧，我们会试试的。”\n\n周五是个不错的选择，周末的负载要低得多。我们能够在周一到来之前发现更多问题并纠正它们。尽管如此，这整座纸牌屋几乎再次倒塌了。卡死问题每天仍然会发生一两次。还有其他问题。但逐渐地，在过了几周之后，我们让系统达到了投诉消失的程度，正常的生活似乎真的变得可能。\n\
  \n然后，正如我在引言中告诉你们的那样，我们都辞职了。他们面临着真正的危机。他们不得不招聘一批新程序员来试图处理来自客户那里如潮水般的问题。\n\n我们可以归怪谁的这场溃败？显然，弗兰克的风格是问题所在。他的恐吓让他难以听听真相。无疑，比尔和贾利尔应该比他们所做的更强烈地反驳弗兰克。我们的团队负责人也不应该向周五的要求妥协。而且我本应该继续说“不”，而不是跟在团队负责人的后面。\n\
  \n专业人士向权力说真话。专业人士有勇气对他们的经理说不。\n\n你如何向你的老板说不？毕竟，那是你的 `boss`！难道你不应该听老板的吗？\n\n不。如果你是一个专业人士，不是。\n\
  \n奴隶是不允许说不。劳动者可能会犹豫于说不。但专业人士被`预期`说不。事实上，优秀的经理渴望有胆量说不的人。这是你真正完成任何事情的唯一方法。\n\n###\
  \ 对抗性角色\n\n这本书的评论者之一非常讨厌这一章。他说这一章几乎让他想把书放下。他建立的团队没有对抗关系；团队和谐地工作，在没有冲突的情况下共同努力。\n\
  \n我为这位评论者感到高兴，但我怀疑他的团队是否真的如他想象的那样没有冲突。如果是的话，我怀疑他们是否达到了最高效率。我自己的经验是，艰难的决定通过对抗性角色的冲突来做出是最好的。\n\
  \n经理是有工作要做的人，大多数经理都很清楚如何完成那份工作。那工作的一部分是尽可能积极地追求和维护他们的目标。\n\n同样，程序员也是有工作要做的人，他们中的大多数也知道如何很好地完成那份工作。如果他们是专业人士，他们会以*他们*尽可能积极的方式追求和维护*他们*的目标。\n\
  \n当你的经理告诉你登录页面必须在明天之前准备好时，他正在追求和维护他的目标之一。他正在做他的工作。如果你完全清楚知道明天之前完成登录页面是不可能的，那么当你说“好的，我会试的”时，你并没有在做你的工作。那时，你工作的唯一方法就是说“不，这不可能。”\n\
  \n但难道你不必听你经理的吗？不，你的经理是在依靠你像他维护他的目标一样，积极地维护你的目标。只有这样你们才能获得最好的结果。\n\n最好的结果是你和经理共同的目标。诀窍在于找到那个目标，而这通常需要谈判。\n\
  \n谈判有时可以是愉快的。\n\n迈克：“帕拉，我需要在明天之前完成登录页面。”\n\n帕拉：“噢，哇！那么快吗？嗯，好吧，我会试的。”\n\n迈克：“好的，太棒了。谢谢！”\n\
  \n那是一段不错的小对话。所有的冲突都被避免了。双方离开时带着微笑。真不错。\n\n但双方的行为都不专业。帕拉完全清楚登录页面需要她比一天更的时间，所以她只是在撒谎。\n\
  \n\n\nPaula: “Mike，我可以给你一个登录页的原型，让你能够登录。我已经让它运行起来了。它并不会真的检查你的用户名和密码，也不会向你发送忘记密码的邮件。页面顶部不会有名为‘Times-squaring’的公司新闻横幅，帮助按钮和悬停文本也无法使用。它不会存储\
  \ Cookie 来记住你下次登录，也不会对你设置任何权限限制。但你确实可以登录的。这样行吗？”\n\nMike: “我可以登录吗？”\n\nPaula: “是的，你可以登录的。”\n\
  \nMike: “太棒了，Paula，你真是我的救命星！”（一边走开一边兴奋地挥拳，大喊着“耶！”）\n\n他们取得了最好的可能的结果。他们通过说“不”，然后制定出一个双方都能接受的解决方案来实现这一点。他们的表现得像专业人士。对话虽然有一点对抗性，也有几次令人尴尬的时刻，但当两个人都坚定地追求并不完全一致的目标时，这是预料之中的。\n\
  \n## 至于“为什么”？\n\n也许你认为 Paula 应该解释 `why` 登录页需要这么长时间。我的经验是，“为什么”远没有“事实”重要。事实是登录页需要两周。而为什么需要两周只是一个细节。\n\
  \n尽管如此，知道为什么可能有助于 Mike 理解，并因此接受这个事实。这很合理。在 Mike 拥有理解事实所需的专业知识和性格的情况下，这类解释可能是有用的。另一方面，Mike\
  \ 可能会对结论产生意见。Mike 可能会认为 Paula 全都做错了。他可能会告诉她不需要所有的测试，不需要所有的评审，或者第 12 步可以省略。提供过多的细节会变成邀请进行微观管理的邀请。\n\
  \n## 高风险决策\n\n说“不”最重要的时刻是风险最高的时候。风险越高，“不”这个字就越变得有价值。\n\n这应该是显而易见的。当失败的代价高到你公司的生存取决于此时，你必须下定决心向你的经理们提供你能提供的最佳信息。这通常意味着要说“不”。\n\
  \nDon（开发总监）：：“所以，我们目前对金鹅项目完成时间的估算是从今天起第十二周，误差为正负五周。”\n\nCharles（首席执行官）：（坐在那里盯着十五秒，脸涨红了）“你是想在这里告诉我，我们距离交付可能还有十七周？”\n\
  \nDon：“有这种可能，是的。”\n\nCharles：（站了起来，Don 在一秒后也站了起来）“该死的，Don！这应该在三周前就完成的！Galitron 每天给我打电话，问他们该死的系统在哪。我才\
  \ `不会` 告诉他们还要再等四个月吗？你必须做得更好。”\n\nDon：“Chuck，我 `三个月前` 就告诉过你，在经历了裁员之后，我们还需要四个月。我的意思是，老天啊\
  \ Chuck，你裁减了我百分之二十的员工！你那时告诉 Galitron 我们会迟到了吗？”\n\nCharles：“你很清楚我没有。我们我们输不起那份订单，Don。（Charles\
  \ 停顿了一下，脸变得苍白）如果没有 Galitron，我们真的完蛋了。你清楚的，不是吗？现在有了这个延迟，我恐怕 . . . 我该对董事会说什么？（他慢慢坐回椅子上，努力不崩溃。）Don，你必须做得更好。”\n\
  \nDon：“Chuck，我无能为力了。我们已经讨论过这个问题了。Galitron 不会缩小范围，也不会接受任何中期发布版本。他们想一次性安装好并完事。我简而言无法做得更快。这\
  \ `绝不会` 发生。”\n\nCharles：“该死。我不认为如果告诉你你的工作危在旦夕会有什么用。”\n\n当然，Charles 在三个月前第一次发现新估算时间时，就应该对\
  \ Galitron 说“不”。至少现在通过打电话给他们（以及董事会）做了正确的做法。但如果 Don 没有坚持立场，这些电话可能会被推迟得更久。\n\n## 成为“团队成员”\n\
  \n我们都听过成为一个“团队成员”有多重要。成为团队成员意味着尽可能地完成你的岗位工作，并在队友陷入困境时帮助他们。一个团队成员会频繁沟通，关注他的队友，并尽可能好地执行自己的职责。\n\
  \n团队成员并不是那种总是说“好”的人。考虑一下这个场景：\n\nPaula：“Mike，我给你那些估算了。团队同意我们大约在八周后可以准备好演示，正负一周。”\n\
  \nMike：“Paula，我们已经把演示排在六周后了。”\n\nPaula：“在没先听我们的意见之前？拜托，Mike，你不能把这个推给我们。”\n\nMike：“这已经定好了。”\n\
  \nPaula：（叹气）“好吧，听着，我会回团队看看我们能安全地做什么。”（等等，让我重新检查一下提供的来源。）\n\n\n\n\n`try` 这个词有很多种定义。我在这里反对的定义是“付出额外的努力”。为了准时准备好演示，Paula\
  \ 还能付出什么样的额外努力呢？如果她`确实`可以付出额外的努力，那么她和她的团队之前一定没有付出全部努力。他们一定是保留了一些精力。\n\n承诺会`try`\
  \ 是承认你一直在留手，承认你拥有一个可以付出的额外精力储备。承诺会`try` 是承认通过付出这些额外努力目标是可以实现的；而且，这是一种通过付出额外努力来达成目标的承诺。因此，通过承诺会`try`，你是在承诺会成功。这把负担推到了你身上。如果你的“尝试”没有导致预期的结果，你就失败了。\n\
  \n你是否拥有一个直以来保留的额外能量储备？如果你付出了这些储备，你能实现目标吗？或者，通过承诺会`try`，你仅仅是在为自己的失败埋下伏笔？\n\n通过承诺会`try`，你是在承诺改变你的计划。毕竟，你之前的计划是不够的。通过承诺会`try`，意味着你有一个新计划。那个新计划是什么？你将对自己的行为做出什么改变？因为你现在正在“尝试”，你打算去做哪些不一样的事情？\n\
  \n如果你没有新计划，如果你不对自己的行为做出改变，如果你完全按照你承诺“尝试”之前的一模一样地做每一件事，那么“尝试”意味着什么？\n\n如果你没有保留任何精力，如果你没有新计划，如果你不改变行为，而且你对最初的估算有合理的信心，那么承诺会`try`从根本上说就是不诚实的。你在`撒谎`。你可能这样做是为了留面子并避免冲突。\n\
  \nPaula 的方法好得多。她继续提醒 Mike 团队的估算是不确定的。她总是说“八或九周”。她强调了这种不确定性并且从未退缩。她从未暗示过可能存在额外的努力、某种新计划或某种可以减少这种不确定性的行为改变。\n\
  \n三周后……\n\nMike：“Paula，演示在三周后了，客户要求看到 `FILE UPLOAD` 功能正常运行。”\n\nPaula：“Mike，那不在我们同意好的功能列表里。”\n\
  \nMike：“我知道，但他们要求这样做。”\n\nPaula：“好，这意味着 `SINGLE SIGN-ON` 或者 `BACKUP` 必须从演示中删掉。”\n\
  \nMike：“绝对不行！他们也期待看到那些功能正常工作！”\n\nPaula：“那么，他们期待看到每一个功能都正常工作。你是这么告诉我的吗？我告诉过你那是不会发生的。”\n\
  \nMike：“抱歉，Paula，但客户在这件事上就是不妥协。他们想看到所有的。”\n\nPaula：“那是不会发生的，Mike。就是不会。”\n\nMike：“拜托了\
  \ Paula，你们至少可以`try` 一下吗？”\n\nPaula：“Mike，我可以`try` 悬浮。我可以`try` 把铅变成金。我可以`try` 游过大西洋。你认为我能成功吗？”\n\
  \nMike：“你现在太不讲理了。我要求的又不是`不可能`的事。”\n\nPaula：“是的，Mike，你`确实`是在要求的。”\n\n（Mike 呵呵了一下，点头，转身走开。）\n\
  \nMike：“我对你有信心，Paula；我知道你不会让我失望的。”\n\nPaula：（对着 Mike 的背影说）“Mike，做梦吧。这`不会`有好结果的。”\n\
  \n（Mike 只是挥了挥手没有回头。）\n\n### 被动攻击\n\nPaula 有一个有趣的决策要做出。她怀疑 Mike 没有把她的估算告诉 Don。她可以就让\
  \ Mike 走到悬崖边缘。她可以确保所有相关备忘录副本都存档，这样当灾难发生时，她可以展示她告诉了 Mike `什么`，以及在`什么时候`告诉他的。这就是被动攻击。她只会任由\
  \ Mike 上吊子。\n\n或者，她可以尝试通过与 Don 直接沟通来阻止灾难。这固然有风险，但这正是团队协作精神的意义所在。当一列货运火车向你冲来，而你是唯一能看到它的人，你可以静静地离开轨道看着别人被撞到，或者你可以大喊：“火车！快离开轨道！”\n\
  \n两天后……\n\nPaula：“Mike，你告诉 Don 关于我估算的事了吗？他告诉客户演示中将不会有 `FILE UPLOAD` 功能运行了吗？”\n\n\
  Mike：“Paula，你说过你会帮我把它运行起来的。”\n\nPaula：“没有，Mike，我没有。我告诉过你是不可能。这是我们谈话后发给你的备忘录副本。”\n\
  \nMike：“是，但你还是会`try` 的，对吧？”\n\nPaula：“我们已经讨论过了，Mike。记得吗，黄金和铅？”\n\nMike：（叹气）“听着，Paula，你必须这样做。你只是必须这样做。请尽一切办法，但你必须为我实现这一切。”\n\
  \nPaula：“Mike。你错了。我不需要为你实现这一切。如果你不这样做，我`必须`做的事就是告诉 Don。”\n\nMike：“我感到很遗憾，Paula。”\n\
  \nPaula：“我不觉得遗憾，Mike。我是在告诉你事实。”\n\nMike：“你只是在保护你你自己！”\n\nPaula：“Mike，我是在保护`我们两个`。如果客户期待看到完整的演示而我们交付不了，你能想象吗？”\n\
  \n### 说好的代价\n\n大多数时候我们想说好。事实上，健康的团队会努力找到好的方法。运作良好的团队经理和人员会相互协商，直到达成共识。\n\n但正如我们所见，有时获得`正确`好的唯一方法是不害怕说拒绝。\n\
  \n请考虑以下 John Blanco 发布在博客上的故事。经许可转载于此。在阅读时，请问自己他应该在什么时候以及如何说不。\n\n* *\n\n### 完美的代码可能吗？\n\
  \n当你进入青少年时期，你决定成为一名软件开发者。在高中期间，你学习了使用面向对象的原则编写软件。当你进入大学后，你将学到的所有原则应用于人工智能或 3D 图形领域。\n\
  \n当你进入职业领域后，你开始了无止境的追求，想要编写商业质量、可维护且“完美”的代码。\n\n商业质量。呵。挺幽默的。\n\n我认为自己很幸运，我`喜欢`设计模式。我喜欢研究代码完美的理论。我不反对开始一个一小时的讨论，关于为什么我的\
  \ XP 伙伴选择的继承层次结构是错误的——在很多情况下 `HAS-A` 比 `IS-A` 更好。但最近一直有些困扰着我，我在想些事情 . . .\n\n\n\n\
  \n\n# . . . 在现代软件开发中，编写良好的代码是不可能的吗？\n\n## 典型的项目提案\n\n作为一名全职合同开发人员（兼兼职），我每天的白天（和晚上）都在为客户开发移动应用程序。在多年来的实践中，我学到的是，客户工作的需求让我无法写出我想要的那种真正高质量的应用。\n\
  \n在开始之前，我只想说，这并不是因为我不尝试。我非常热爱清洁代码这个话题。我不认识任何像我这样追求完美软件设计的人。我发现执行起来反而更难捉摸，而且原因并不是你想象的那样。\n\
  \n在这里，让我给你们讲一个故事。\n\n去年年底，一家相当著名的公司发布了一份 RFP（征求书），想要为他们开发一个 App。他们是一家巨大的零售商，但为了匿名起见，我们暂称之为\
  \ Gorilla Mart。他们说他们需要一个 iPhone 版的业务，并希望在黑色星期五之前产出一个 App。陷阱呢？现在已经是 11 月 1 日了。这意味着创建\
  \ App 的时间不到 4 周。哦，而且那个时候 Apple 还需要两周来审核 App。（啊，美好的时光。）所以，等等，这个 App 必须在 . . 两周内写完？？\n\
  \n是的。我们有两周时间写这个 App。不幸的是，我们赢得了投标。（在商业中，客户的重要性至关重要。）这将会发生。\n\n“但没关系，”Gorilla Mart\
  \ 的一号高管说，“App 很简单。只需要向用户展示目录中的几个产品，并让他们搜索商店位置。我们已经在网站上做到了。我们也会把图形提供给你。你也许可以——用什么词来——是的，直接硬编码吧！”\n\
  \nGorilla Mart 的二号高管插话道。“我们只需要几个用户可以在收银台出示的优惠券。这个 App 是一次性的。让我们先把它推出去，然后到了第二阶段，我们将从零开始做更大、更好的东西。”\n\
  \n然后，事情真的发生了。尽管多年来一直被提醒，客户要求的每一个功能写起来总是比解释起来要复杂得多，但你还是付诸行动了。你真的相信这次真的可以在两周内完成。是的！我们可以做到的！这次不一样！这只是几个图形和一个用于获取商店位置的服务调用。XML！没问题。我们可以做到的。我太兴奋了！走吧！\n\
  \n你和现实再次相识仅花了一天。\n\n我：所以，你能给我调用你们商店位置 Web 服务所需的信息吗？\n\n客户：什么是 Web 服务？\n\n我：............\n\
  \n事情正是这样发生的。他们的商店位置服务就在他们网站右上角的本该出现的地方，但并不是一个 Web 服务。它是由 Java 代码生成的。API 根本没戏（Ix-nay）。更糟糕的是，它托管在\
  \ Gorilla Mart 的战略合作伙伴那里。\n\n邪恶的“第三方”登场了。\n\n在客户的术语中，“第三方”类似于安吉莉娜·朱莉。尽管承诺说你可以在一顿大晚餐中进行一次有启发性的对话，并希望之后还能约会……抱歉，没戏。你只能在自己处理业务时对此进行幻想。\n\
  \n在我的情况下，我唯一能从 Gorilla Mart 手里抢出来的东西就是一个 Excel 格式的当前商店列表快照。我必须从零开始编写商店位置搜索代码。\n\n\
  双重打击在当天晚些时候到来：他们希望产品和优惠券数据在线，以便每周更改。硬编码彻底破灭！两周写一个 iPhone App 现在变成了两周要写一个 iPhone\
  \ App、一个 PHP 后端，并将它们整合在一起——什么？他们还要让我负责 QA（质量保证）？\n\n为了补偿额外的工作，代码编写速度必须快一点。忘掉那个抽象工厂吧。用一个大大的\
  \ `for` 循环代替复合模式，没时间了！\n\n良好的代码已经变得不可能了。\n\n## 两周完成\n\n我告诉你们，那两周非常凄惨。首先，其中两天因为我下一个项目的全天会议被排除了。（这进一步强调了这个时间范围是多么么短。）最终，我真的只有八天时间来完成工作。第一周我工作了\
  \ 74 小时，下周 . . . 天 . . 我不记得，它已经从我的突触中被抹除了。也许是件好事。\n\n在这八天里，我疯狂地编写代码。我使用了所有可用的工具来完成任务：复制和粘贴（又可重用代码）、魔数（避免重复定义常量，然后，天呐！重新输入它们），而且绝对没有单元测试！（这种时候谁需要红条啊，那只会消磨我的积极性！）\n\
  \n代码写得很糟，我再也没有时间重构。然而，考虑到时间范围，它其实相当出色，而且毕竟是“一次性”代码，对吧？这些内容听起来熟悉吗？好吧，等一下，精彩在后面。\n\
  \n当我对 App 进行最后的收尾工作时（最后的收尾是编写整个服务器代码），我开始查看代码库，并想这也许值得的。App 最终还是完成了。我活过来了！\n\n“嘿，我们刚刚雇了\
  \ Bob，他非常忙，没法来”\n\n（注：此处原文中存在大量重复的句子，根据指令已在翻译中保留核心逻辑结构）\n\n\n\n\n\n一周周后，苹果开始测试该应用。这通常是一个喜悦的时刻，但此时却变成了一个充满恐惧的时刻。正如所料的，当天晚些时候，应用被拒绝了。不出所料，那天晚些时候拒绝的理由是极其糟糕的：“应用缺少功能。”在功能上，它是完美的。正因为这个原因，Gorilla\
  \ Mart 没有能在黑五之前准备好应用。我非常沮丧。\n\n为了这两个周的冲刺，我牺牲了家庭。但在被拒绝的一小时后，没有人愿意花心创建一个应用。\n\n如果我之前已经很沮丧，那么在拒绝后的那周里，我会变得非常愤怒。你看，他们还没有获得真实的数据。服务器上的产品和优惠券都是虚假的。代码是\
  \ `1234567890`。你知道的，这都是胡言（在那种语境下，Bologna 的意思是胡说八）。\n\n就在那个宿命的早晨，当我检查门户时，应用竟然可以发布了！但数据全是假象！我在极度痛苦中哭出来，打电话给能联系的任何人，大喊道：“我需要数据！”电话那头的女人问我是要开火还是报警，于是我挂了电话拨打了\
  \ `911`。但我又拨打了 Gorilla Mart，说：“我需要数据！”我永远不会忘记那个回复：“噢，嘿，约翰。我们有了新的副总裁，我们决定不发布。在 App\
  \ Store 发布吗？”\n\n最后，事实证明，至少有人在数据库中注册了邮箱地址，这意味着可能有人带着虚假的 iPhone 优惠券进入 Gorilla Mart。天哪，这可能会变得糟糕。\n\
  \n当尘埃落定后，客户一直以来都是对的：代码是废弃之品。唯一的问题是，它压根就没有发布。\n\n## 结果？急于完成，缓慢交付\n\n故事中的教训是，你的利益相关者（无论是外部客户还是内部管理层）会让开发者快速编写代码。有效吗？不。快速？是的。它是这样运作的：\n\
  \n*   **告诉开发者应用很简单。** 这让开发团队陷入了错误的思维。它让开发者更早地开始工作，以便\n*   **通过指责团队没有识别需求来增加功能。**\
  \ 在这种情况下，硬编码的内容需要更改。我怎么可能没有意识到这一点？我意识到了，但早早接受了一个虚假的承诺，这就是为什么。或者客户会雇佣一个“新人”，这是一个明显的遗漏。某一天，客户会说他们刚刚雇了史蒂·乔斯，我们可以增加功能吗？他们会\n\
  *   **反复推迟截止日期。** 开发者以最快、最努力的速度（尽管最容易出错，但谁会在乎呢？）在截止日期前几天赶工。为什么在他们如此高效时进一步推迟日期呢？利用这一点吧！于是，增加了几天，又增加了一周，而你刚刚工作了\
  \ 20 小时来确保万无一失。这就像胡萝卜和驴，只不过你受到的对待不如驴。\n\n这是一个高明的策略。你能责怪他们认为这行可行吗？但他们没有看到那些糟糕的代码。尽管结果如此，这种情况一再发生。\n\
  \n在全球化经济中，企业唯金钱是是，提高股价意味着裁员、员工过度加班和外包，我向你们展示的这种削减开发者成本的策略会让良好的代码过时。作为开发者，如果我们小心，会被要求在一半的时间内写双倍的代码。\n\
  \n## 代码不可能吗\n\n在故事中，当约翰问“良好的代码是不可能的吗？”时，他其实是在问“专业精神是不可能的吗？”毕竟，在他那个功能混乱的故事里，遭受苦的不只是代码。还有他的家庭、他的老板、他的客户以及用户。在这场冒险中，*每个人*都输了。他们是因为不专业。\n\
  \n那么是谁表现得不专业？约翰明确表示，他认为是 Gorilla Mart 的高层。毕竟，他的策略是对他们糟糕行为的有力指控。但他们的行为真的糟糕吗？我不这么认为。\n\
  \nGorilla Mart 的人们希望在黑五期间有一个 iPhone 应用。他们愿意付费获得这个选项。他们找到了愿意提供该选项的人。那么你又怎么能怪他们呢？\n\
  \n是的，确实，存在一些沟通失败。显然，高层并不知道什么是网络服务，而且存在大公司一个部门不知道另一个部门在做什么的所有正常问题。但这一切本应该是可以预料到的。约翰甚至承认了这一点，正如他说的：“尽管多年不断提醒，客户要求的每一个功能写起来总是比解释它们要复杂得多。*\
  \ . . * ”\n\n所以，如果罪祸首不是 Gorilla Mart，那么是谁呢？\n\n也许是约翰的直接雇。约翰没有明确说明这一点，但他在括号里提到时有一个暗示：“在生意中，客户的重要性非常重要。”那么约翰的雇主对\
  \ Gorilla Mart 出了不合理的承诺吗？约翰没有说。\n\n尽管如此，在这一切中，约翰的责任在哪里？我把错误完全归咎于约翰。约翰是接受了最初两周截止日期的人，尽管他很清楚项目通常比听起来要复杂。约翰是接受了\
  \ PHP 服务器的人。约翰是接受了邮件注册和优惠券过期的人。约翰是接受了每天工作 20 小时、每周 90 小时的人。约翰为了赶上截止日期，从自己的家庭和生活中抽离了自己。\n\
  \n\n\n\n这听起来可能很严厉。但这并不是我的本意。在之前的章节中，我描述了我在职业生涯中曾一次又一次犯过同样的错误。那种想要当英雄并“解决问题”的诱惑是巨大的。我们所有人必须意识到，对放弃我们的职业纪律说“好”并不是解决问题的办法。放弃这些纪律才是制造问题的方法。\n\
  \n既然如此，我终于回答 John 最初提出的问题了：\n\n“好的代码是不可能的吗？专业精神是不可能的吗？”\n\n回答：我说不。\n\n## 3. 说出好\n\
  \n![image](img/Image00127.jpg)\n\n你们知道我发明了语音信箱吗？这是真的。事实上，我们有三个人拥有语音信箱的专利。Ken Finder、Jerry\
  \ Fitzpatrick 和我。那是 20 世纪 80 年代初，我们在一家名为 Teradyne 的公司工作。首席执行官委派我们开发一种新产品，于是我们发明了“电子接待员”，简称为\
  \ `ER`。\n\n你们都知道 `ER` 是什么。`ER` 是那种糟糕的机器之一，它们在公司接听电话并你提出各种你必须通过按键来回答的愚蠢问题（“英语请按 1”）。\n\
  \n我们的 `ER` 会为公司接听电话，并让你拨你想联系的人的名字。它会让你读出你的名字，然后拨打那个人。它会宣布来电询问是否接听。如果是，它就会接通并挂断。\n\
  \n你可以告诉 `ER` 你在哪里。你可以给它几个电话号码进行尝试。所以，如果你在别人的办公室里，`ER` 就能找到你。如果你在家，`ER` 也能找到你。如果你在另一个城市，`ER`\
  \ 也能找到你。最后，如果 `ER` 找不到你，它就会留留言。这就是语音信箱出现的地方。\n\n奇怪的是，Teradyne 无法想如何销售 `ER`。该项目耗尽了预算，并变成了我们知道如何销售的东西——`CDS`，即工艺调度系统（The\
  \ Craft Dispatch System），用于派遣电话维修工去下一个工作地点。而且 Teradyne 在在没有告诉我们的情况下放弃了专利。(!) 现在的专利持有者在我们三个月后提交了申请。(!!)\n\
  \n在 `ER` 演变为 `CDS` 很久之后，但在我发现专利被放弃之前很久。我在树上等这家公司的首席执行官。我们在大楼外有一棵大橡树。我爬上去等他的雅虎马车开进来。我在门口见到他并请求了几分钟时间。他同意了。\n\
  \n我告诉他，我们真的需要重新启动 `ER` 项目。我告诉他我确定它能赚钱。他让我惊讶，他说：“好的，Bob，制定一个计划。给我看我如何赚钱。如果你能做到，而且我信了，我就重新启动\
  \ `ER`。”\n\n我没预料到这个。我预料他会说：“你说得对，Bob。我会重新启动项目，并想出如何让它盈利。”但并没有。他把负担推回给了我。这是一个让我感到矛盾纠结的负担。毕竟，我是一个软件人员，不是一个搞钱的人。我想参与\
  \ `ER` 项目，而不是负责利润盈亏。但我不想表现出我的纠结。于是我向他感谢，并带着这句话离开了他的办公室：\n\n“谢谢你，Russ。我会尽力的……我想吧。”\n\
  \n既然如此，让我向你们介绍一下 Roy Osherove，他会告诉你们有多么可怜。\n\n### 承诺的语言\n\n作者：Roy Osherove \n\n\
  说。想。做。\n\n做出承诺有三个部分。\n\n1. 你说你会做。\n2. 你是认真的。\n3. 你做到了。\n\n\n\n\n（技术上来说）没有办法逃避这种口头承诺。你已经说过了你会做，现在只有二元结果是可能的——你要么完成，要么没完成。如果你没有完成，人们可以根据你的承诺来要求你。对于没有做到这一点，你会感到`bad`。当你告诉某人你没做完时，你会感到很`awkward`（如果那个人听过你承诺会做的话）。\n\
  \n很可怕，不是吗？\n\n你正在面对至少一个人的听众，对某事承担全部责任。这不仅仅是你独自站在镜子前或电脑屏幕前。而是你面对另一个人类，说你会去做。这就是承诺的开始。让自己置于一个迫使你去做某事的境地。\n\
  \n你已经将你使用的语言改变为了承诺的语言，这将帮助你度过接下来的两个阶段：诚意承诺和执行到底。\n\n以下是你可能没有`诚意`或没有执行到底的几个原因，以及相应的解决方案。\n\
  \n### 因为我依赖 X 人来完成这项，所以行不通\n\n你只能对你拥有`完全控制权`的事情承诺。例如，如果你的目标是完成一个依赖于另一个团队的模块，你无法承诺在与其他团队完全整合的情况下完成该模块。但你`可以`承诺某些能带你实现目标的特定行动。你可以：\n\
  \n- 与基础设施团队的 `Gary` 坐在一起一小时，以了解你的依赖关系。\n- 创建一个接口，将你的模块对其他团队基础设施的依赖抽象化。\n- 本周至少与\
  \ `build guy` 见三次，以确保你的更改在公司的构建系统中运行良好。\n- 创建你自己的个人构建版本，用于运行该模块的集成测试。\n\n看出区别了吗？\n\
  \n如果最终目标取决于他人，你应该承诺那些能让你更接近最终目标的特定行动。\n\n### 因为我并真的不知道这是否可以完成，所以行不通\n\n如果无法完成，你仍然可以承诺那些能让你更接近目标的行动。弄清楚是否可以完成本身就是可以承诺的行动之一！\n\
  \n与其承诺在发布前修复所有剩余的 25 个漏洞（这可能是不可能的），你可以承诺这些能让你更接近该目标的特定行动：\n\n- 检查所有 25 个漏洞并尝试重现它们。\n\
  - 与发现每个漏洞的 `QA` 坐在一起，查看该漏洞的重现过程。\n- 本周花上所有时间尝试修复每个漏洞。\n\n### 因为我我就是可能做不到，所以行不通\n\
  \n这种情况会发生。可能会发生意想不到的事，这正是生活。但你仍然希望符合预期。在这种情况下，是时候`尽快`改变预期了。\n\n如果你无法履行承诺，最重要的事情是尽快向你承诺过的人发出红色警报。\n\
  \n你越早向所有利益相关者发出信号，团队就越有可能有停下来，重新评估正在采取的行动，并决定是否可以采取或更改某些措施（例如调整优先级）。通过这种方式，你的承诺仍然可以实现，或者你可以改为另一个承诺。\n\
  \n例子如下：\n\n- 如果你和同事约在市中心的一家咖啡馆中午开会，而你堵在车里了，你怀疑自己无法履行准时到达的承诺。当你意识到可能迟到时，可以立即给同事打电话告诉他们。也许你们可以找一个更近的地方见面，或者推迟会议。\n\
  - 如果你承诺解决一个你认为是可以解决的漏洞，但在某个时刻你发现该漏洞比之前想象的要棘得多，你可以发出信号。团队随后可以决定采取什么行动来完成该承诺（结对编程、对潜在解决方案进行调研、头脑风暴），或者更改优先级将你转到另一个简单的漏洞。\n\
  \n这里有一个重要的一点是：如果你不尽快告诉任何人潜在的问题，你就没有给任何人提供帮助你履行承诺的机会。\n\n### 总结\n\n建立承诺的语言听起来可能有点可怕，但它可以帮助解决程序员今天面临的许多沟通问题——估算、截止日期以及面对面交流的失误。你会被视为一个信守承诺的严肃开发者，这是我们在这个行业中可以期待的最美好的事情之一。\n\
  \n### 学习如何说“是”\n\n我请 Roy 贡献那篇文章是因为它引起了我的共鸣。一段时间以来，我一直在推崇学习如何说“不”。但学会如何说“是”同样重要。\n\
  \n### “尝试”的另一面\n\n让我们想象 `Peter` 负责对评分引擎进行一些修改。他私下估算这些修改将花费他五或六天时间。他还认为为这些修改编写文档将花费几个小时。周一早上，他的经理\
  \ `Marge` 询问他进度。\n\nMarge：“Peter，你能在周五前完成评分引擎的修改吗？”\n\nPeter：“我觉得可以。”\n\nMarge：“这包括文档吗？”\n\
  \nPeter：“我会尝试把那个也做了。”\n\n也许 Marge 没有听出 `Peter` 陈述中的优豫不决，但他确实没有做出太大承诺。Marge 问的是需要二元答案的问题，但\
  \ `Peter` 的二元回答是模糊的。\n\n注意对“尝试”一词的滥用。在上一章中，我们使用了 `try` 的定义。在这里，`Peter` 并没有做出太大承诺。Marge\
  \ 问的问题要求二元答案，但 `Peter` 的二元回答是模糊的。\n\n### 带有纪律的承诺\n\nMarge：“Peter，你能在周五前完成评分引擎的修改吗？”\n\
  \n这是 Marge 提的一个完全合理的问题。她有一个维护计划，需要一个二元答案。`Peter` 应该如何回答？\n\nPeter：“在这种情况下，Marge，我说不。我最快`确定`能在周二完成修改修改。”\n\
  \nMarge：“你承诺周二吗？”\n\nPeter：“是的，我周二准备好。”\n\n但如果 Marge 真的需要在周五前拿到修改和文档呢？\n\nMarge：“Peter，周二给我带来大麻烦了。我们的技术作家\
  \ Willy 周一就会到位。他有五天时间完成用户指南。如果我周一早上拿不到评分引擎文档，他永远无法准时完成手册。你能先做文档吗？”\n\nPeter：“不，修改必须先，因为我们是从测试运行的输出生成文档的。”\n\
  \nMarge：“那么，什么办法能让你周一早上之前完成修改和文档吗？”\n\n现在 `Peter` 必须做一个决定了。他很有机会在周五完成评分引擎修改，甚至可能在过周末前完成文档。如果情况比预想的要，他也可以在周六工作几个小时。那么他应该告诉\
  \ Marge 什么呢？\n\nPeter：“听着，Marge，如果我周六多花几个小时，我有很大机会在周一早上之前完成所有工作。”\n\n这解决了 Marge\
  \ 的问题吗？不，它只是改变了概率，这正是 `Peter` 需要告诉她的。\n\nMarge：“那我可以指望周一早上吗？”\n\nPeter：“可能吧，但不确定。”\n\
  \n这对 Marge 来说可能还不够。\n\n\n\n\n\n玛姬（Marge）：“看着，彼得，我真的需要一个明确的答复。你有没有`任何`方法可以保证在周一早上之前完成？”\n\
  \n此时，彼得（Peter）可能很想违背纪律。如果他不写测试，他可能会完成得更快。如果不进行重构，他可能会完成得更快。如果不运行完整的回归测试套件，他可能会完成得更快。\n\
  \n这正是专业人士划分界限的地方。首先，彼得的假设是错误的。如果不写测试，他绝`不会`完成得更快。如果不进行重构，他绝`不会`完成得更快。如果省略完整的回归测试套件，他绝`不会`完成得更快。多年的经验告诉我们，违反纪律只会降低我们的速度。\n\
  \n但其次，作为一名专业人士，他有责任维护某些标准。他的代码需要经过测试，并且需要有测试。他的代码需要是整洁的。而且他必须确保没有破坏系统的其他任何部分。\n\n\
  彼得作为一名专业人士，已经做出了维护这些标准的承诺。他所做的任何其他承诺都应该从于这一承诺。因此，这整套推理都需要终止。\n\n彼得：“不，玛姬，我真的无法确定在周二之前的任何一个日期。如果这打乱了你的计划，我很抱歉，但这就是我们面临的现实。”\n\
  \n玛姬：“该死。我本来真的希望能早点交付这个任务。你确定吗？”\n\n彼得：“我确定可能会晚到周二，是的。”\n\n玛姬：“好吧，我想我得去和威利（Willy）看看他是否能重新安排日程。”\n\
  \n在这种情况下，玛姬接受了彼得的回答并开始寻找其他方案。但如果玛姬所有的方案都用尽了呢？如果彼得是最后的希望呢？\n\n玛姬：“彼得，听着，我知道这是一个巨大的负担，但我真的需要你想办法在周一早上之前完成所有工作。这非常关。。难道没有什么你可以尝试的吗？”\n\
  \n现在彼得开始考虑投入大量的加班时间，可能涵盖整个周末。他需要对自己的体力和储备非常诚实。`说`周末能做很多事情很容易的，但要实际上集齐足够的能量来完成高质量的工作要困难得多。\n\
  \n专业人士知道自己的局限性。他们知道可以有效地加班多久，也知道代价是什么。\n\n在这种情况下，彼得觉得很有信心，周中多加几个小时加上周末的一些时间足够了。\n\
  \n彼得：“好的，玛姬，是这样吧。我会给家里打电话，跟家人商量一下加班。如果他们没意见，我就能在周一早上之前完成这项任务。我甚至会在周一早上来公司，确保威利那边一切顺利。但之后我将回家，直到周三才回来。成交可以吗？”\n\
  \n这是完全公平的。彼得知道，如果他加班，他就能完成修改和文档。他也知道在随后的几天里他将无所事事。\n\n### 结论\n\n专业人士并不被要求对他们的每一个要求说“好”。然而，他们应该努力寻找创造性的方法让“好”成为可能。当专业人士说“好”时，他们使用承诺的语言，这样对于他们承诺的内容就不会有疑问。\n\
  \n## 4. 编码\n\n![image](img/Image00128.jpg)\n\n在之前的一本书 ^(1) 中，我关于`整洁代码整 Clean Code）的结构和本质写了大量内容。这一章讨论的是编码的`行为`，以及围绕该行为的背景。\n\
  \n当我 18 岁时，我的打字速度还算不错，但我必须看键盘。我不能盲打。所以有一个晚上，我在一台`IBM 029`打字机前度过了几个漫长的小时，拒绝看自己的手指，一边打字输入我在几张编码单上写好的程序。我每打完一张卡片后都会检查一遍，并丢弃那些打错的卡片。\n\
  \n起初，我打错了不少。到晚上结束时，我打出的字已经近乎完美了。在那个漫长的夜晚里，我意识到盲打完全取决于`信心`。我的手指知道按键在哪里，我只需要获得自己没有在犯错的信心。帮助这种信心的因素之一，我可以在出错时`感觉`到它。到晚上结束时，如果我犯了错，我几乎能立即发现，并简单地弹出卡片而不看。\n\
  \n能够感知自己的错误真的很重要。不仅是在打字时，在万事万都是如此。拥有错误感意味着你能非常快速地关闭反馈回路，并更快地从错误中学习。自从那天在`029`上之后，我学习并掌握了多门学科。我发现，在每种情况下，精通的关键都是信心和错误感。\n\
  \n这一章描述了我关于编码的一套个人规则和原则。这些规则和原则不是关于代码本身的；而是关于我在编写代码时的行为、情绪和态度。它们描述了我在编写代码时自己的心理、道德和情感背景。这些是我信心和错误感的根源。\n\
  \n你可能不会同意我在这里说的每一句话。毕竟，这些是极度私化的内容。事实上，你可能对其中某些内容表示强烈反对。\n\n### 准备工作\n\n编码是一项极具智力挑战且耗费精力的活动。它所需的专注程度是其他学科要求的。\n\
  \n1. 首先，你的代码必须运行。你必须理解正在解决什么问题，以及如何解决。你必须确保你写的代码是解决方案的忠实体现。你必须管理解决方案的每一个细节。\n2.\
  \ 你的代码必须解决客户的问题。通常客户的需求并没有解决问题。这需要你发现这一点并与客户协商，以确保满足真正的需求。\n3. 你的代码必须与现有系统良好融合。它不应该增加系统的刚性、脆弱性或不透明性。依赖关系必须得到良好的管理。简而言之，你的代码需要遵循可靠的工程原则。(2)\n\
  4. 你的代码必须对其他程序员可读。这不仅仅是写漂亮注释的问题。相反，它要求你以一种揭示意图的方式来编写代码。这很难。事实上，这可能是程序员能掌握的最困难的事情。\n\
  \n兼顾所有这些考虑是很困难的。长时间保持必要的专注和注意力在生理上是困难的。再加上在团队、在组织中工作的问题和干扰，以及日常生活的忧虑和关注。底线是，分心的机会很多。\n\
  \n当你无法充分集中注意力并专注时，你写的代码将是错误的。它会有 Bug。它会有错误的结构。它会变得晦涩且复杂。它无法解决客户真实的问题。简而言之，它将重做或重写。分心状态工作会产生浪费。\n\
  \n如果你感到疲劳或分心，*不要编码*。你只会重做已经做过的事情。相反，找个方法消除干扰并平复心绪。\n\n\n\n\n我写过最糟糕的代码是在凌晨 3 点。那是\
  \ 1988 年，我在的一家名为 Clear Communications 的电信初创公司工作。为了积累“汗水股”，我们所有人都在长时间加班。当然，我们都梦想着大富大财。\n\
  \n在某个非常深夜——或者更准确地说，是一个为了解决某个时序问题的清晨——我让我的代码通过事件分发系统向自己发送消息（我们称之为“发邮件”）。这是一个`错误`的解决方案，但在凌晨\
  \ 3 点，它看起来非常棒。事实上，在连续连续编写了 18 小时代码后（更不用说每周工作 60 到 70 小时），那是我脑子里`唯一`剩下的东西了。\n\n我记得当时对自己工作了这么长时间而感到非常自豪。我记得当时觉得自己很`投入`。我记得当时想，凌晨\
  \ 3 点工作是专业人士该做的事。我错得有多离！\n\n那些代码一次又一次地反噬了我们。它建立了一个缺陷的设计结构，所有人都在使用，但又不得不一直绕过它。它导致了各种奇怪的时序错误和诡异的反馈回路。我们会陷入无限邮件循环，因为一条消息会触发另一条消息的发送，然后周而复始。我们从来没时间重写这堆烂摊（至少我们是这么认为的），但似乎总有时间添加另一个补丁或临时措施来绕过它。垃圾越积越多，让那段凌晨\
  \ 3 点的代码被越来越多的负担和副作用包。多年后，这变成了一个团队的笑话。每当我感到疲惫或沮丧时，他们就会说：“小心！Bob 马上要自己给自己发邮件了！”\n\
  \n这个故事的教训是：不要在疲惫时写代码。投入和专业更多关乎自律，而非时长。确保你的睡眠、健康和生活方式都调整良好，这样你每天才能投入八小时`高质量`的工作。\n\
  \n## 忧虑代码\n\n你是否曾和配偶或朋友发生过大争吵，然后尝试去写代码？你是否注意到大脑中有一个后台进程正在运行，试图解决，或者至少回顾那场争吵？有时你能感到胸口或胃部由于那个后台进程带来的压力。它会让你感到焦虑，就像喝了太多咖啡或无糖可乐一样。它让人分心。\n\
  \n当我担心和妻子的争吵、客户危机或孩子生病时，我无法保持专注。我的注意力在波动。我发现自己眼睛盯着屏幕，手指放在键盘上，却无所事事。处于木直状态。\n\n瘫痪了。灵魂在万万里之外，在后台处理问题，而不是在实际上解决我眼前的编码问题。\n\
  \n有时，我会强迫自己去`思考`代码。我可能会逼自己写一两行。我可能会强迫自己通过一两个测试。但我无法坚持下去。不可避免地，我发现自己陷入了一种麻木的无感状态，睁着双眼什么也看不见，内心却为后台的忧虑翻江倒海。\n\
  \n我学到了，这时候不是写代码的时候。我产生的任何代码都会是垃圾。所以，与其写代码，我需要解决这些忧虑。\n\n当然，有很多忧虑是简单的在一两个小时内无法解决的。而且，我们的雇主不太可能长期容忍我们在解决个人问题时无法工作。诀窍在于学会如何关闭后台进程，或者至少降低它的优先级，让它不再成为持续的干扰。\n\
  \n我通过划分时间来做到这一点。我不会在后台忧虑不断骚扰我时强迫自己写代码，而是会花一段专门的时间（可能是一小时）来处理产生忧虑的问题。如果我的孩子生病了，我会打电话查看情况。如果我和妻子吵了架，我会给她打电话谈谈这些问题。如果我有财务问题，我会花时间思考如何处理这些财务状况。我知道我不可能在这小时内解决所有问题，但我很有可能减轻焦虑并让后台进程安静下来。\n\
  \n理想情况下，与斗个人问题所花费的时间应该是私人时间。在办公室里这样花一小时就太遗憾了。专业开发者分配他们的私人时间，以确保在办公室花费的时间尽可能高效。这意味着你应该专门在家里留出时间来解决焦虑，这样你就不会把它们带到办公室。\n\
  \n另一方面，如果你发现自己在办公室，而后台的焦虑感正在消耗你的生产力，那么花一小时来让它们安静下来，比用蛮力写出你以后注定扔掉（或者更糟，将不得不忍受）的代码要好得多。\n\
  \n## 流状态区\n\n关于被称为“心流”的高效率状态，已经有很多报道。有些程序员称之为“区域（The Zone）”。无论它被称为什么，你可能都很熟悉。它是程序员在写代码时可以进入的一种高度专注、隧道视野般的意识状态。在这种状态下，他们感到`很有成效`。在这种状态下，他们感到`无所不能`。因此，他们渴望达到那种状态，并经常通过自己在该状态下停留的时间来衡量自我价值。\n\
  \n这里有一个经历过并回来的人提供的小贴士：`避开心流`。这种意识状态并不是真正的高效率，也绝不是无所不能。它实际上只是是一种轻微的冥想状态，其中某些理性能力为了换取速度感而被削弱了。\n\
  \n让我明确这一点。你在“心流”中`会`写更多代码。如果你在练习`TDD`（测试驱动开发），你会更快地完成`红/绿/重构`循环。并且你会`感到`一种轻微的欣快或征服感。问题在于，当你处于心流中时，你会丢失全局观，所以你可能会找回来。\n\
  \n现在，当我感到自己滑入“心流”时，我会离开几分钟。我通过回复几封邮件或查看推特来清醒大脑。如果接近中午了，我会去吃午饭。如果我正在团队工作，我会找一个编程伙伴。\n\
  \n结对编程的一个大益处是，两个人几乎不可能进入“心流”。心流是一种不交流的状态，而结对需要密集且持续的交流。事实上，我经常听到关于结对编程的抱怨之一是它阻止了进入“心流”。太好了！心流`不是`你想要待的地方。\n\
  \n好吧，这并不`完全`准确。有些时候，心流正是你想要待的地方。当你`练习`时。但我们将在另一个章节中讨论那个。\n\n## 音乐\n\n70 年代末在 Teradyne\
  \ 时，我有一间私人办公室。我是我们`PDP 11/60`的系统管理员，所以我是少数几个拥有私人终端的程序员之一。那台终端是一个`VT100`，波特率为`9600`，通过`80`英里的`RS232`电缆跨过天花吊板连接到`PDP\
  \ 11`。\n\n我在办公室里有一套音响系统。那是一台旧唱片机、放大器和落地音箱。我有大量的黑胶片收藏，包括披士齐飞、平西德弗洛以及……嗯，你懂的。\n\n\
  我以前会开大音响量然后开始写代码。我以为这有助于我集中注意力。但我错了。\n\n有一天，我回到一个我在听着《墙》（The Wall）的开场曲时正在编辑的模块。该代码中的注释包含了该作品的歌词，以及关于俯冲轰机和婴儿哭的编辑标注。\n\
  \n那时我意识到。作为代码的读者，我学到的关于作者（我）音乐收藏的信息，比学到的这段代码试图解决的问题要多得多。\n\n\n\n我意识到，我在听音乐时根本就写不好代码。音乐并不能帮我集中注意力。事实上，听音乐这个行为似乎消耗了我大脑为了编写整洁且设计良好的代码所需的关键资源。\n\
  \n也许对你来说情况并非如此。也许音乐*能帮助*你写代码。我认识很多人是戴耳机写代码的。我接受音乐可能对他们有帮助，但我怀疑真实发生的情况是音乐帮助他们进入了“心流状态”（The\
  \ Zone）。\n\n## 中断\n\n想象一下你正在工作站前写代码。当有人向你提问时，你会如何反应？你会对他们发火吗？你会瞪他们吗？你的肢体语言是在告诉他们离开，因为你很忙吗？简而言之，你会无礼吗？\n\
  \n或者，你会停止手头的工作，礼貌地帮助陷入困境的人？你会在像自己陷入困境时希望别人那样对待他们吗？\n\n无礼的往往源于“心流状态”。你可能怨恨被拉出心流，或者怨恨别人干扰了你进入心流的尝试。无论哪种，这种无礼通常源于你与心流状态的关系。\n\
  \n然而，有时并不是心流状态的问题，而是因为你正试图理解某些需要高度集中的复杂事物。对此有解决方法。\n\n结对编程（Pairing）是处理中断的一种非常有效的方法。你的结对伙伴可以保持当前问题的上下文，而你则去处理电话或同事的问题。当你回到结对伙伴身边时，他会迅速帮助你重建中断前的心理上下文。\n\
  \n测试驱动开发（TDD）是另一个大助益。如果你有一个失败的测试，那个测试就持有了你目前所在位置的上下文。你可以在中断后返回它，继续让那个失败的测试通过。\n\n\
  最后，当然，*会有中断*分散你的注意力并导致时间浪费。当这些情况发生时，请记住下一次你可能就是那个需要中断别人的人。因此，专业的态度是礼貌且乐意提供帮助。\n\n\
  ## 写作障碍\n\n有时候代码就是写不出来。这种情况在我身上发生过，也见过在别人身上发生。你坐在工作站前，什么也没有发生。\n\n通常你会发现有别的事情要做。你会读邮件。你会读推特。你会翻阅书籍、日程或文档。你会召开会议。你会和其他开启对话。你会做*任何事*，好让你不必面对那个工作站，眼睁睁看着代码拒绝出现。\n\
  \n是什么导致了这种阻塞？我们已经讨论过许多因素。对我来说，另一个主要因素是睡眠。如果我睡眠不足，我就根本无法写代码。对其他人来说是焦虑、恐惧和抑郁。\n\n\
  奇怪的是，这有一个非常简单的解决方案。它几乎总是有效。它很容易做到，并且能为你提供编写大量代码的动力。\n\n解决方案：找一个结对伙伴。\n\n这种方法的有效性令人不可思议。只要你坐在另一个人旁边，阻碍你的问题就消失了。当你与人一起工作时，会发生一种*生理性*的变化。我不知道那是什么，但我确实能感觉到它。我的大脑或身体中发生了某种化学变化，打破了阻塞并让我重新运转起来。\n\
  \n这并不是一个完美的解决方案。有时这种状态会持续一两个小时，紧接着就是极其严重的疲惫，以至于我不得不离开结对伙伴，找个空隙来恢复。有时，即使和某人在一起，我也顶多认同那个人所做的事。但对我来说，结对编程的典型反应是动力的恢复。\n\
  \n## 创意输入\n\n我还会做其他事情来防止阻塞。我很早就学到，创意输出取决于创意输入。\n\n我读很多书，读各种材料。我读软件、政治、生物学、天文学、物理、化学、数学等领域的材料。然而，我发现最能激发创意输出源泉的是科幻小说。\n\
  \n对你来说，可能是其他东西。也许是一本好的推理小说、诗歌，甚至是浪漫小说。我认为真正的问题在于创意产生创造力。其中也包含逃避现实的元素。我远离日常问题的几个小时里，由于受到挑战性且富有创意的想法积极刺激，结果产生了一种几乎无法抵挡的创作压力。\n\
  \n并不是所有形式的创意输入对我都有效。看电视通常不能帮我创作。看电影好一点，但也只有一点。听音乐不能帮我写代码，但能帮我制作演示、演讲和视频。在所有形式的创意输入中，没有比经典的太空歌剧（space\
  \ opera）对我更有效的。\n\n## 调试\n\n我职业生涯中最糟糕的调试之一发生在 1972 年。连接到卡车工人（Teamsters）会计系统的终端每天会死机一两次。没有办法可以强制这种现象发生。错误并不偏好任何特定的终端或特定的应用程序。用户在死机之前在做什么并不重要。这一分钟终端还运行良好，下一分钟它就陷入了彻底死机。\n\
  \n我们花了几周才诊断出这个问题。期间，卡车工人越发不安。每当发生一次死机，终端前的人就必须停止工作，直到他们能协调所有其他用户完成任务。然后他们会给我们打电话，我们进行重启。那是一场噩梦。\n\
  \n我们花了前几周时间，通过访谈经历机机的人来收集数据。我们询问他们当时在做什么，以及之前做了什么。我们询问其他用户在死机发生时，是否在*自己的*终端上注意到过任何异常。这些访谈都是通过电话完成的，因为终端位于芝加哥市中心，而我们在北边\
  \ 30 英里的玉米农田里工作。\n\n我们没有日志，没有计数器，没有调试器。我们访问系统内部的唯一手段是面板上的指示灯和拨动开关。我们可以停止计算机，然后一个字字地窥视内存。但我们不能这样做超过五分钟，因为卡车工人需要系统恢复运行。\n\
  \n我们花几天时间编写了一个简单的实时检查器，可以通过作为控制台的 ASR-33 电字机进行操作。通过它，我们可以在系统运行时窥视并改写内存。我们在关键时刻添加了在电字机上打印的日志信息。我们创建了内存计数器来记录事件并记住状态历史，我们可以通过检查器查看这些内容。当然，所有这些都必须用汇编语言从零编写，并在系统空闲晚上进行测试。\n\
  \n终端是中断驱动的。发送到终端的字符存储在循环缓冲区中。每当串口端口完成发送一个字符时，就会触发一次中断，循环缓冲区中的下一个字符就会准备好发送。\n\n我们最终发现，终端死机是因为管理循环缓冲器的三个变量不同步。我们不知道为什么会发生这种情况，但至少是一个线索。在\
  \ 5 千行（KSLOC）的监控代码中，某个地方有一个错误处理了其中一个指针。\n\n\n\n这项新知识还让我们能够手动解冻终端！我们可以通过检视器（inspector）向那三个变量中注入默认值，终端就会像魔法般重新开始运行。最终，我们写了一个小补丁（hack），它会检查所有计数器，查看它们是否错位并进行修复。起初，每当卡运员（Teamsters）打电话报告死机时，我们通过按下前面板上的一个特殊用户中断开关来启动这个补丁。后来，我们只需每秒钟运行一次修复程序即可。\n\
  \n大约一个月后，对于卡运员来说，死机问题已经消失了。偶尔，他们的某个终端会暂停大约半秒钟，但在每秒 30 个字符的基础速率下，似乎没有人注意到这一点。\n\n\
  ### 但计数器为什么会错位呢？我当时才十九岁，下决心要一个究竟。\n\n监控代码是由理查德（Richard）编写的，他后来已经去上大学了。我们其他人都不熟悉那段代码，因为理查德对它有很强的占有欲。那段代码是**他的**，我们不允许知道它。但现在理查德走了，于是我拿出了那本厚达英寸的代码列表，开始一页页地审阅。\n\
  \n该系统中的循环队列只是 FIFO（先入先出）数据结构，也就是队列。应用程序向队列的一端推入字符，直到队列填满。当打印机准备好接收字符时，中断头会从队列的另一端弹出字符。当队列为空时，打印机就会停止。我们的漏洞导致应用程序认为队列是满的，却让中断头认为队列是空的。\n\
  \n中断头在与所有其他代码不同的“线程”中运行。因此，被中断头和其他代码共同操作的计数器和变量必须免受并发更新的干扰。在我们案例中，这意味着在任何操作那三个变量的代码周围关闭中断。当我坐下来看那段代码时，我知道我正在寻找代码中触碰了变量但没有先禁用中断的地方。\n\
  \n在现在，当然，我们会利用手头的各种强大工具找到代码触碰这些变量的所有位置。在几秒钟内，我们就能知道触碰过它们的每一行代码。在几分钟内，我们就能知道哪些没有禁用中断。但那是\
  \ 1972 年，我没有那样的工具。我拥有的双眼。\n\n我仔细研读了那段代码的每一页，寻找那些变量。不幸的是，这些变量被`处处`使用。几乎每一页都以某种方式的方式触碰了它们。其中许多引用并没有禁用中断，因为它们是只读引用，因此是无害的。问题在于，在那个特定的汇器中，如果不遵循代码逻辑，没有好的方法可以判断引用是否是只读的。每当变量被读取时，它之后都可能被更新和存储。如果这在中断开启的情况下发生，变量就会被损坏。\n\
  \n我花费了几天时间高强度研究，但最终我找到了。就在那里，在代码中间，有一处地方，三个变量之一在中断开启的情况下被更新了。\n\n我做了数学计算。这个漏洞持续的时间大约有两个微秒。有十几个终端都在以\
  \ 30 cps 的速度运行，因此大约每 3 毫秒产生一次中断。考虑到监控器的规模和 CPU 的时钟频率，我们预计这种漏洞每天会导致一或两次死机。抓着了！\n\n\
  当然，我修复了问题，但从未有勇气关闭那个检查并修复计数器的自动补丁。直到今天，我仍然认为不存在另一个漏洞。\n\n## 调试时间\n\n出于某种原因，软件开发人员不把调试时间看作编码时间。他们把调试时间看作是大自然的召唤，是`必须`完成的事情。但调试时间对业务来说和编码时间一样昂贵，因此，我们任何可以避免或减少调试时间的做法都是好的。\n\
  \n现在，我花在调试上的时间比十年前少得多。我没有衡量过这种差异，但我认为大约是十倍。我通过采用测试驱动开发（`TDD`）实践，实现了调试时间的这种根本性减少，我们将在另一个章节讨论它。\n\
  \n无论你采用 `TDD` 还是其他同样行效的规范，^(3)，作为专业人士，你有责任将自己的调试时间减少到尽可能接近零。显然，零是一个渐近目标，但它终究是一个目标。\n\
  \n医生不喜欢重新打开患者身体来修复他们犯的错误。律师不喜欢重审他们搞砸的案件。一个经常行事的医生或律师不会被认为是专业的。同样地，一个产生许多 bug 的软件开发人员其行为是不专业的。\n\
  \n### 掌握节奏\n\n软件开发是一场马拉松，而不是一场短跑。你不能通过从一开始就尝试尽力快跑来赢得比赛。你通过节省资源和掌握节奏来获胜。马拉松运动员在比赛前和`期间`都会细心照顾自己的身体。专业程序员以同样的细心保护着他们的能量和创造力。\n\
  \n#### 知道何时离开\n\n不解决这个问题就不能回家？噢，你可以回家的，而且你可能应该回回去！创造力和智力是转瞬即逝的心境。当你疲惫时，它们就会消失。如果你接着在深夜又深夜地敲击你那不灵的大脑试图解决一个问题，你只会让自己更加疲惫，并减少淋澡或开车帮助你解决问题的机会。\n\
  \n当你卡壳时，当你感到疲惫时，离开一会儿。让你的创造性潜意识去尝试一下这个问题。\n\n#### 回家的路程\n\n我在回家的路上开车时解决了很多问题。开车需要大量的非创造性资源。你必须将眼睛、手和部分大脑投入任务中；因此，你必须从工作中抽离。这种`抽离`能让你的大脑以一种不同且更具创意的方式去寻找解决方案。\n\
  \n#### 洗澡\n\n我在洗澡时解决了过多的问题。也许清晨的那股喷水唤醒了我，让我去回顾我在睡眠时大脑想出的所有解决方案。\n\n当你专注于一个问题时，你有时会离它太近，以至于看不到所有的选项。你错过了优雅的解决方案，因为你的创造力被专注的注意力所抑制了。有时解决问题的最佳方法是回家，吃晚饭，看电视，睡觉，然后在第二天早晨起来洗个澡。\n\
  \n### 迟到\n\n你`会迟到`。这发生在我们每个人身上。发生在我们最投入的人身上。有时我们只是搞砸了估算并导致迟到。\n\n管理迟到的秘诀在于早期检测和透明化。最糟糕的情况是你直到最后时刻都告诉每个人你会准时完成——然后让所有人失望。`不要`这样做。相反，要`定期`根据你的目标衡量你的进度，并给出三个基于事实的\
  \ ^(4)截止日期：最好情况、正常情况和最坏情况。对所有三个日期都要尽可能诚实。向你的团队和利益者展示这三个数字。每天更新这些数字。*不要把希望加入你的估算中！*\n\
  \n#### 期待\n\n\n\n\n\n如果这些数字显示你可能会错过截止日期该怎么办？例如，假设十天后有一个贸易展会，我们需要把产品送到那里。但同时也假设，对于你正在开发的功能，你给出的三点法估值是\
  \ 8/12/20。\n\n不要指望你可以在十天内完成所有工作！希望是项目的杀手。希望会摧毁进度并损害声誉。希望会让你陷入深的困境。如果贸易展在十天后举行，而你的名义估值是\
  \ 12，那么你是无法完成的。确保团队和利益相关者理解这种情况，并且在没有备选方案之前不要松懈。不要让其他人抱有希望。\n\n## 赶工\n\n如果你的经理坐下来要求你尝试赶上截止日期该怎么办？如果你的经理坚持要求你“不惜一切代价”怎么办？坚持你的估值！你最初的估值比你在老板对质你时所做的任何更改都要准确。告诉你的老板，你已经考虑过这些选项（因为你确实考虑过了），改进进度的唯一方法是缩小范围。不要受到赶工的诱惑。\n\
  \n那些在压力下屈服并同意尝试赶上截止日的可怜程序员是不幸的。那个程序员将开始走捷径并加班，徒劳地希望创造奇迹。这是一个灾难的配方，因为它给了你、你的团队和你的利益相关者虚幻的希望。它让每个人都能回避面对问题，并推迟了必要的艰难决策。\n\
  \n没有任何办法可以加速。你无法迫自己写代码得更快。你无法迫自己解决问题得更快。如果你尝试，只会放慢自己的速度，并制造出拖慢所有其他人的混乱。\n\n所以，你必须通过剥夺老板、团队和利益相关者的希望来给他们答。\n\
  \n## 加班\n\n于是你的老板说：“如果你每天多工作两个小时呢？如果你在周六工作呢？拜托，一定有办法挤出足够的时间来按时完成这个功能。”\n\n加班是有效的，而且有时是必要的。有时，你可以通过投入几个每天十小时的工作日以及一两个周六，完成一个原本不可能的日期。但这样做非常有风险。你不太可能通过增加\
  \ 20% 的时长来完成 20% 的工作。而且，如果加班持续超过两三周，肯定会失败。\n\n因此，除非满足以下条件，否则你不应该同意加班：(1) 你个人能负担得，(2)\
  \ 它是短期的，两周或更短，以及(3) 你的老板在加班失败时有一个备选方案。\n\n最后一个标准是决定性的因素。如果你的老板无法向你阐述如果加班尝试失败他将要做，那么你就不应该同意加班。\n\
  \n## 虚假交付\n\n在程序员可能沉溺的所有不专业行为中，也许最糟糕在你知道自己没有完成时却说你已经完成了。有时这只是一个赤裸裸的谎言，这已经够糟糕了。但更隐蔽的情况是，我们成功地为“完成”的新定义提供了合理化理由。我们说服自己已经“做得足够了”，然后转向下一个任务。我们合理化认为，任何剩余的工作都可以以后有更多时间时再处理。\n\
  \n这是一个具有传染性的行为。如果一个程序员这样做，其他人就会看到并效仿。其中某一个会进一步扩大“完成”的定义，其他人都会采纳这个新定义。我见过这种行为走向了可怕的极端。我的其中一个客户实际上将“完成”定义为“已提交”。代码甚至不需要编译。如果什么东西都不需要运行，想要“完成”是非常容易的！\n\
  \n当团队掉入这个陷阱时，经理们听到一切进展顺利。所有的状态报告显示每个人都准时完成。这就像盲人在铁轨上野餐：没有人看到那列载满未完成工作的货运火车正向他们冲来，直到为时已晚。\n\
  \n## 定义“完成”\n\n你通过创建一个独立的“完成”定义来避免虚假交付的问题。最好的方法是让你的业务分析师和测试人员创建自动化验收测试，这些测试在你说自己已完成之前必须通过。这些测试应该用测试语言编写，例如\
  \ `FIT NESSE`、`Selenium`、`RobotFX`、`Cucumber` 等。这些测试应该能让利益相关者和业务人员理解，并且应该频繁运行。\n\
  \n## 帮助\n\n编程是很困难。你越年轻，就越不相信这一点。毕竟，这只是一堆 `if` 和 `while` 语句。但随着经验的增加，你开始意识到你组合那些\
  \ `if` 和 `while` 语句的方式至关重要。你不能只是把它们堆在一起并期待最好。相反，你必须仔细地将系统划分为小的易理解的单元，这些单元之间的关联尽可能少——而这是很难的。\n\
  \n事实上，编程如此困难，以至于一个人的能力无法很好完成。无论你多么熟练，你无疑会从另一个程序员的想法和主意中受益。\n\n### 帮助他人\n\n正因如此，程序员有责任随时互相帮助。将自己隔离在隔间或办公室里拒绝他人的询问是违反职业伦理的行为。你的工作并不重要到以至于你不能抽出一些时间来帮助别人。事实上，作为一名专业人士，你有义务在任何需要时提供这种帮助。\n\
  \n这并不意味着你不需要一些独处的时间。当然，你需要。但你必须对此保持公平和礼貌。例如，你可以让大家知道在上午 10 点到中午 12 点之间不应该打扰，但在下午\
  \ 1 点到 3 点你的门是开放的。\n\n你应该关注同事的状态。如果你看到有人似乎陷入了困难，你应该提供帮助。你可能会对你的帮助所产生的巨大影响感到惊讶。这并不是你比别人聪明得多，而是因为新的视角可以是解决问题的深刻催化剂。\n\
  \n### 被帮助\n\n当有人提议帮助时，要表现出感激。感激地接受帮助，并投入到这种帮助中。不要保护你的领地。不要因为时间紧迫就推开帮助。尝试三十分钟。如果到那时他们并没有提供什么真正的帮助，那么礼貌地离开并表示感谢结束对话。记住，正如你有义务提供帮助一样，你有义务接受帮助。\n\
  \n学会如何寻求帮助。当你被住、困惑或无法理解一个问题时，向寻求帮助。你可以直接坐下来说：“我需要帮助。”否则，使用 yammer、twitter、电子邮件或桌子上的电话。寻求帮助。再次，这是一个职业伦理问题。在帮助易于获得的情况下仍然停滞不前是不专业的。\n\
  \n\n\n\n是的，这是一个刻板印象。是的，这是一个带有许多例外的概括。但事实是，程序员并不倾向于协作。然而，协作对于有效的编程至关重要。因此，由于对于我们许多人来说，协作并非一种本能，我们需要`disciplines`（规范）来驱动我们进行协作。\n\
  \n### 指导\n\n我在书的后面有一章专门讨论这个话题。现在，让我简单地说：培训经验较少的程序员是那些经验丰富者的责任。培训课程是不够的。书籍也不够的。没有什么能比自己的动力以及资深同事的有效指导更快地让一个年轻的软件开发者走向高水平。因此，对于资深程序员来说，花时间带教年轻程序员并指导他们，是一个职业道德问题。同样，那些年轻的程序员也有职业责任向资深同事寻求这种指导。\n\
  \n### 参考文献\n\n- **[Martin09]:** Robert C. Martin, *Clean Code*, Upper Saddle River,\
  \ NJ: Prentice Hall, 2009.\n- **[Martin03]:** Robert C. Martin, *Agile Software\
  \ Development: Principles, Patterns, and Practices*, Upper Saddle River, NJ: Prentice\
  \ Hall, 2003.\n\n## 5. 测试驱动开发\n\n![image](img/Image00129.jpg)\n\n自从测试驱动开发（TDD）在行业首次亮相以来已经十年多年。它是作为极端编程（XP）浪潮的一部分而来的，但从后被\
  \ Scrum 以及几乎所有其他敏捷方法所采用。即使是非敏捷团队也开始实践 TDD。\n\n1998 年，当我第一次听到“测试优先编程”时，我非常怀疑。谁会不怀疑呢？`first`\
  \ 写你的单元测试？谁会做那种愚蠢的事？\n\n但到那时我已经做了职业程序员三十年了，我见证了行业的兴起兴衰。我清楚不应该率率拒绝任何事情，尤其是当像 Kent\
  \ Beck 这样的人说它时。\n\n所以 1999 年，我旅行到了俄勒冈州的梅德福德会见 Kent 并向他学习这种规范。整个经历太令人震惊了！\n\nKent\
  \ 和我坐在办公室里，开始用 `Java` 编写一些简单的小问题。我只想写完那个愚蠢的代码。但 Kent 拒绝了，一步一步引导我完成了整个过程。首先，他写了一小部分单元测试，仅仅勉够算作代码。然后，他只写了足够让该测试通过编译的代码。接着他又多写了一点测试，然后是更多的代码。\n\
  \n周期时间完全超出了我的经验。我习惯在尝试编译或运行代码之前，先写一个多小时的代码。但 Kent 实际上每隔三十秒左右执行一次他的代码。我大开眼界了！\n\n\
  而且，我认出了这种周期时间！那是我多年前在小时候用 `Basic` 或 `Logo` 等解释型语言编写游戏时使用的周期时间。在那些语言中，没有构建时间，所以你只需要添加一行代码然后执行。你非常快速地完成循环。正因如此，在那些语言中你可以变得`very`\
  \ 高效。\n\n但在 `real` 编程中，那种周期时间是荒谬的。在 `real` 编程中，你必须花费大量时间写代码，然后花费更多时间让它编译。再花费更多时间进行调试。*我可是个\
  \ C++ 程序员，该死！* 在 `C++` 中，我们的构建和链接时间需要几分钟，有时甚至是几小时。三十秒的周期是不可想象的。\n\n然而，Kent 就在那里，以三十秒为一个周期不断编写这个\
  \ `Java` 程序，而且没有任何迹象表明他很快会放慢速度。所以，当我坐在 Kent 的办公室里时，我突然意识到，通过使用这种简单的规范，我就可以以 `Logo`\
  \ 的周期时间在真实的语言中编程！我入迷了！\n\n### 判决已经下定\n\n从那些日子起，我了解到 TDD 不仅仅是一个缩短我周期时间的简单技巧。这种规范有一整套好处，我将在接下来的段落中描述。\n\
  \n但首先，我需要说这些：\n\n- 判决已经下定！\n- 争议已经结束了。\n- `GOTO` 是有害的。\n- 而 TDD 是可行的。\n\n是的，多年年来写了很多关于\
  \ TDD 的充满争议的博客和文章，现在仍然如此。在早期，它们是批评和理解的严肃尝试。然而在现在，它们只是发泄。底线是 TDD 是可行的，每个人都必须接受事实。\n\
  \n我知道这听起来很强硬且片面，但考虑到这些事实，我不认为外科医生需要为洗手辩护，我也不认为程序员应该为 TDD 辩护。\n\n如果你不`know` 你的所有代码都能正常工作，你如何认为自己是一个专业人士？如果你在每次更改时都不测试它，你如何知道你所有的代码都能正常工作？如果你没有高覆盖率的自动化单元测试，你如何能在每次更改时都进行测试？如果你不实践\
  \ TDD，你如何获得高覆盖率的自动化单元测试？\n\n最后那句话需要一些说明。到底什么是 TDD？\n\n### TDD 的三条法则\n\n1. 在先写出一个失败的单元测试之前，你不允许编写任何生产代码。\n\
  2. 你不允许编写超过足够导致失败的单元测试——编译不通过也是一种失败。\n3. 你不允许编写超过足够通过测试的生产代码。\n\n这三条法则将你锁定在一个大约三十秒的循环中。你从编写一小部分单元测试开始。但在几秒钟内，你必须提到某个尚未写的类或函数，导致单元测试失败。所以你必须编写让测试通过的生产代码。但你不能写比这更多的，所以你开始编写更多的测试代码。\n\
  \n你就循环往复。为测试代码添加一点。为生产代码添加一点。这两个代码流同时增长，成为互补的组件。测试就像抗体之合抗原。\n\n### 益处的连篇\n\n####\
  \ 确定性\n\n如果你将 TDD 作为一种职业规范，那么你每天会写几十个测试，每周写数百个测试，每年写数千个测试。并且在你每次做出更改时都会运行这些测试。\n\
  \n我是基于 Java 的验收测试工具 FIT NESSE 主要作者和维护者。目前 FIT NESSE 有 64,000 行代码，其中 28,000 行包含在\
  \ 2,200 个独立的单元测试中。这些测试覆盖了至少 90% 的生产代码，运行大约需要 90 秒。\n\n当我修改 FIT NESSE 的任何部分时，只需运行单元测试。如果它们通过了，我几乎确定我做的更改没有破坏任何东西。“几乎确定”有多确定？足够发布了！\n\
  \nFIT NESSE 的 QA 过程就是命令：`ant release`。该命令从零构建 FIT NESSE，然后运行所有的单元测试和验收测试。如果这些测试都通过了，我就发布它。\n\
  \n\n\n\n这并非孤立的现象。已有几份报告 ^(4) 和研究 ^(5) 描述了显著的缺陷减少。从 IBM 到微软，从 Sabre 到 Symantec，一家又一家公司、一个又一个团队都经历过\
  \ 2 倍、5 倍、甚至 10 倍的缺陷减少。这些数字是任何专业人士都不应该忽视的。\n\n## 勇气\n\n为什么你不在在看到糟糕代码时不去修复它呢？当你看到一个杂乱的函数时，你的第一个反应是“这真是一团糟，需要清理。”你的第二个反应是“我可不想动它！”为什么？因为你知道如果你动了它，就有弄坏它的风险；而如果你把它弄坏了，它就变成你的了。\n\
  \n但如果你能 `确定` 你的清理没有弄坏任何东西呢？如果你拥有我刚才提到的那种确定性呢？如果你能点击一个按钮，就能在 90 秒内 `知道` 你的更改没有弄坏任何东西，`而且只做了贡献`呢？\n\
  \n这是 TDD（测试驱动开发）最强大的益处之一。当你拥有一套信任的测试套件时，你就失去了对修改的所有恐惧。当你看到糟糕的代码时，你只需在现场清理它。代码变成了粘土，你可以安全地将其塑造成简单且悦目的结构。\n\
  \n当程序员们失去对清理的恐惧时，他们就会清理！而简洁的代码更容易理解、更容易修改、也更容易扩展。由于代码变得更简单，缺陷发生的概率变得更小。代码库稳步地 `改进`，而不是我们行业所习惯的正常腐烂。\n\
  \n哪个专业程序员会允许腐烂继续下去呢？\n\n## 文档\n\n你曾经用过第三方框架吗？通常，第三方会给你发送一份由技术写作者编写的、格式良好的手册。典型的手册采用\
  \ 27 张八乘十英寸的彩色光面照片，上面画着圆圈和箭头，每张照片背面都有一段文字解释如何配置、部署、操作以及使用该框架。在末尾的附录中，通常有一个很丑的小章节，包含了所有的代码示例。\n\
  \n你去看该手册的第一地方是哪里？如果你是一个程序员，你会去看代码示例。你去看代码是因为你知道代码会告诉你真相。那 27 张带有圆圈和箭头的八乘十英寸彩色光面照片及其文字可能很漂亮，但如果你想知道如何使用代码，你需要阅读代码。\n\
  \n当你遵循三律时编写的每个单元测试都是一个示例，以代码形式编写，描述了系统应该如何被使用。如果你遵循三律，那么将有一个单元测试描述如何创建系统中的每一个对象、这些对象创建的每种方式。将有一个单元测试描述如何以每种有意义的调用方式调用系统中的每一个\
  \ `function`（函数）。对于你任何需要知道该如何做的事情，都会有一个单元测试详细地描述它。\n\n单元测试就是文档。它们描述了系统的底层设计。它们是无歧义的、准确的、用听众能懂的语言编写的，并且正式到可以执行。它们是可能存在的最低级文档。哪个专业人士会不提供这样的文档呢？\n\
  \n## 设计\n\n当你遵循三律并先编写测试时，你面临着一个困境。通常你确切知道想写什么代码，但三律要求你写一个会失败的单元测试，因为那个代码还不存在！这意味着你必须测试你正要写的代码。\n\
  \n测试代码的问题在于你必须隔离这段代码。如果一个 `function` 调用了其他 `functions`，那么测试它通常很困难。为了写那个测试，你必须想办法方法将该\
  \ `function` 与所有其他函数解耦。换句话说，先测试的需求迫使你去思考 `良好的设计`。\n\n如果你不先写测试，就没有力量阻止你将这些 `functions`\
  \ 耦合成一团不可测试的块体。如果你以后再写测试，你可能可以测试整个块体的输入和输出，但测试单个 `functions` 可能会非常困难。\n\n因此，遵循三律并先写测试，创造了一股驱动你迈向更好解耦设计的力量。哪个专业人士会不使用驱动他们迈向更好设计的工具呢？\n\
  \n“但我可以以后再写测试，”你说道。不，你不能。不是真的。噢，你确实可以在以后写 `some`（一些）测试。如果你留心地衡量覆盖率，你甚至可以在以后实现高覆盖率。但你事后写的测试是\
  \ `防御`。你先写的测试是 `进攻`。事后测试是由那些已经投入代码、并已经知道问题是如何解决的人编写的。这些测试绝不可能像先写的测试那样犀利。\n\n###\
  \ 专业人士的选择\n\n这一切的结论是，TDD 是专业人士的选择。它是一项增强确定性、勇气、减少缺陷、文档和设计的规范。有了如此多的优点，不使用它可能被认为是\
  \ `不专业` 的。\n\n### TDD 不是什么\n\n尽管 TDD 有许多优点，但它不是宗教或魔咒。遵循三律并不能保证这些益处。即使你先写测试，你仍然可能写出糟糕的代码。事实上，你可能会写出糟糕的测试。\n\
  \n同样，有些时候遵循三律仅仅是不切实际或不恰当的。这些情况很少，但确实存在。\n\n### 参考文献\n\n（此处为参考文献列表，根据指令要求未翻译英文内容，仅保留格式）\n\
  \n\n\n\n\n在我非常年轻的时候，我在新电脑上编写的第一个程序之一是 `SQINT`，即计算整数的平方。我曾用汇编语言、BASIC、FORTRAN、COBOL\
  \ 以及无数种其他语言写过它。再次，这是一种证明我可以让计算机执行我想让它做的方法。\n\n在 20 世纪 80 年代初，个人电脑开始出现在百货商店里。每当我路过一台电脑，比如\
  \ `VIC-20`、`Commodore-64` 或 `TRS-80` 时，我就会写一个短程序，在屏幕上打印出无限循环的 `\\` 和 `/` 字符。这个程序产生的图案视觉上非常悦目，看起来比生成它们的小程序要复杂得多。\n\
  \n尽管这些小程序确实是练习程序，但总的来说，程序员并不会*练习*。坦率地说，我们从未想过这种事。我们忙于写代码，没时间考虑练习自己的技能。而且，这样做有什么意义呢？在那些年里，编程不需要快速的反应或灵活的手指。直到\
  \ 70 年代后期，我们才开始使用屏幕编辑器。我们花费大量时间等待编译，或者调试冗长而可怕的代码段。我们还没有发明 TDD（测试驱动开发）的这种短周期，因此我们不需要练习能带来的精细调优。\n\
  \n## 二十二个零\n\n但自从编程早期以来，情况已经发生了。有些事情发生了*巨大*的变化。而有些事情却完全没有变化。\n\n我编写程序的第一批机器之一是 `PDP-8/I`。这台机器的周期时间为\
  \ 1.5 微秒。它的核心内存有 4,096 个 12 位的字。它有冰箱那么大，消耗大量的电力。它有一个可以存储 32K 12 位字的磁盘驱动器，我们通过一台每秒\
  \ 10 个字符的电打字机与之通信。我们认为这是一台*非常强大*的机器，并用它创造奇迹。\n\n我刚买了一台新的 `Macbook Pro` 笔记本电脑。它有一有一个\
  \ 2.8GHz 双核处理器、8GB 内存、512GB SSD 和一个 17 英角的 1920 × 1200 LED 屏幕。我把它装在背包里。它放在我的膝盖上。它的功耗不到\
  \ 85 瓦。\n\n我的笔记本电脑速度快八千倍，内存大两百万倍，离线存储大一千六百万倍，耗电仅为 1%，占用空间仅为 1%，价格仅为 `PDP-8/I` 的二分之一。让我们算算账：\n\
  \n```\n8,000 × 2,000,000 × 16,000,000 × 100 × 100 × 25 = 6.4 × 10²²\n```\n\n这个数字非常*大*。我们谈论的是*22\
  \ 个数量级！*从这里到半法马阿尔座之间的距离有多少埃。。一个美元银币里的电子数量有多少。以迈克尔·摩尔为单位的地球质量。这是一个巨大的、巨大的数字。它正坐在我的膝盖上，可能也在你的膝盖上！\n\
  \n那么，面对这种 22 倍的力量提升，我在做什么？我做的操作那台 `PDP-8/I` 时做的事情差不多。我正在写 `if` 语句、`while` 循环和赋值语句。\n\
  \n噢，我有了更好的工具来写这些语句。我也有更好的语言来写这些语句。但在这些时间里，这些语句的本质并没有改变。2010 年的代码对于 1960 年代的程序员来说也是可以识别的。我们所操纵的“粘土”在这四十年里并没有发生太大变化。\n\
  \n## 周转时间\n\n但我们工作的*方式*发生了剧烈的变化。在 60 年代，我可以等上一或两天来看编译结果。在 70 年代后期，一个 50,000 行代码的程序可能需要\
  \ 45 分钟才能编译。即使在 90 年代，漫长的构建时间也是常态。\n\n如今的程序员不再等待编译。现在的程序员指尖拥有如此巨大的力量，他们可以在几秒钟内完成“红-绿-重构”的循环。\n\
  \n例如，我正在处理一个名为 `FIT NESSE` 的 64,000 行 Java 项目。完整的构建（包括*所有*单元测试和集成测试）在不到 4 分钟内完成。如果这些测试通过了，我就可以发布产品了。*所以，从源代码到部署的整个\
  \ QA 过程需要的时间不到 4 分钟。*编译几乎不花费任何可衡量的时间。部分测试只需要*几秒钟*。因此，我实际上可以每分钟运行编译/测试循环*十次*！\n\n\
  运行那么快并不总是明智的。通常情况下，慢下来并*思考*更好。但在其他时候，尽可能快地运行那个循环是*极高*效率的。\n\n快速完成任何事情都需要练习。快速地运行代码/测试循环需要你做出极快的判断。快速做出决定意味着能够识别大量的情况和问题，并简单地*知道*该如何处理它们。\n\
  \n考虑两个正在战斗的武术家。每个人都必须识别对方企图什么，并在毫秒内做出恰当反应。在战斗情况下，你没有奢侈冻结时间、研究位置并权衡恰当的反应。在战斗中，你只需要*反应*。事实上，当你的大脑在思考高层策略时，是你的*身体*在反应。\n\
  \n当你每分钟运行几次代码/测试循环时，是你的*身体*知道该按哪些键。在武术案例和编程案例中，识别情况和问题的是你的身体，并在毫秒内做出相应的反应。\n\n考虑像卡洛斯·桑塔纳这样的吉他手。他脑中的音乐直接从指尖流出。他并不关注手指位置或拨弦技巧。他的大脑在规划高级旋律和和声，而他的身体将这些计划转化为基础手指动作。\n\
  \n但要获得那种熟练程度需要*练习*。音乐家反复练习音阶和练习曲，直到记忆于心。\n\n### 代码道\n\n自 2001 年以来，我一直在演示一个被称为“篮球游戏”的\
  \ TDD 示例。这是一个有趣的 30 分钟练习。它在设计上经历了冲突，达到了高潮，并以惊喜结束。我为这个例子专门写了一个章节。\n\n2005 年，我参加了在英国谢菲尔行的\
  \ XP2005 大。我参加了一个由 Laurent Bossavit 和 Emmanuel Gaillot 主的名为“代码道”的会议。他们让他们打开笔记本电脑，跟随他们一起使用\
  \ TDD 编写康威的《生命游戏》。他们将其称为“Kata”，并将“实用派”戴维·托马斯认为是原始想法。\n\n从此，许多程序员采用了武术比喻来描述他们的练习。“代码道”这个名字似乎流传了下来。有时，一群程序员会聚在一起练习，就像武术家一样。在其他时候，程序员会独自练习，同样像武术家一样。\n\
  \n大约一年前，我正在奥马哈教一组开发人员。午餐时他们邀请我加入他们的代码道。我看着二十名开发者打开笔记本电脑，逐字逐字地跟随正在进行“篮球游戏”Kata 的领导。\n\
  \n道场中会进行各种活动。以下是几种：\n\n\n\n\n在武术中，`kata`（型）是一套精确的编排动作组合，用于模拟战斗的一个侧面。其目标是不断趋近于完美。艺术家努力让自己的身体学会完美地完成每一个动作，并将这些动作组合成流畅的执行。执行得良好的\
  \ `kata` 观赏非常美。\n\n尽管它们很美，但学习 `kata` 的目的并不是为了在舞台上表演它。其目的是训练你的身心在特定的战斗情况下如何做出反应。目标是让这些完美的动作变得自动且本能，以便在需要需要时它们会自然出现。\n\
  \n编程 `kata` 是一套精确的编排击键和鼠标移动，用于模拟解决某些编程问题。你实际上并不是在解决问题，因为你已经知道了解决方案。相反，你是在练习解决问题时涉及的动作和决策。\n\
  \n完美的渐近线再次是目标。你反复重复这项练习，以训练你的大脑和手指如何移动和反应。在练习过程中，你可能会发现自己的动作或解决方案本身有了细微的改进和效率提升。\n\
  \n练习一系列 `katas` 是学习热键和导航惯用法的好方法。它也是学习 `TDD` 和 `CI` 等学科的好方法。但最重要的是，它是将常见的问题/解决方案对引入你潜意识的好方法，这样当你在实际编程面对它们时，只需知道如何解决它们。\n\
  \n就像任何武术家一样，程序员应该掌握几种不同的 `kata` 并定期练习它们，以防它们从记忆中消亡。许多 `kata` 记录在 [`katas.softwarecraftsmanship.org`](http://katas.softwarecraftsmanship.org)\
  \ 。其他的可以在 [`codekata.pragprog.com`](http://codekata.pragprog.com) 找到。我最喜欢的几个是：\n\
  \n* `保龄游戏:`: [`butunclebob.com/ArticleS.UncleBob.TheBowlingGameKata`](http://butunclebob.com/ArticleS.UncleBob.TheBowlingGameKata)\n\
  * `质因数:`: [`butunclebob.com/ArticleS.UncleBob.ThePrimeFactorsKata`](http://butunclebob.com/ArticleS.UncleBob.ThePrimeFactorsKata)\n\
  * `单词换行:`: [`thecleancoder.blogspot.com/2010/10/craftsman-62-dark-path.html`](http://thecleancoder.blogspot.com/2010/10/craftsman-62-dark-path.html)\n\
  \n为了获得真正的挑战，尝试学习一个 `kata` 直到你可以为它配上音乐。要把这件事做好是`困难`的。\n\n## Wasa（位练习）\n\n当我学习柔道时，我们在道场的大部分时间都花在两人一组练习\
  \ `wasa` 上。`wasa` 非常像双人的 `kata`。这些程序被精确地记忆并回放。一个伙伴扮演进攻者的角色，另一个伙伴是防守者。随着练习者交换角色，动作被反复重复。\n\
  \n程序员可以使用一种名为 `ping-pong` 的游戏以类似的方式练习。两个伙伴选择一个 `kata` 或一个简单的问题。一个程序员写单元测试，然后另一个人必须让它通过。然后他们交换角色。\n\
  \n如果伙伴选择一个标准的 `kata`，那么结果是已知的，程序员们是在练习并互相彼此的键盘和鼠标技术，以及他们对 `kata` 的记忆程度。另一方面，如果伙伴选择一个新问题来解决，那么游戏就会变得更有趣。编写测试的程序员对问题的解决方式有过常的控制权。他还有很大的权力来设定限制。例如，如果程序员选择实现一种排序算法，测试编写者可以很容易对速度和内存空间设定限制，挑战他的伙伴。这会让游戏变得非常有竞争性……而且很有趣。\n\
  \n## Randori（自由练）\n\n`Randori` 是自由形式的战斗。在我们的柔道道场，我们会设置各种战斗场景然后执行它们。有时，某人被要求防守，而我们其余每个人都会按顺序攻击他。有时，我们会安排两个或更多攻击者对阵一个防守者（通常是老师，他几乎总是赢的）。有时我们会两对两，以此类推。\n\
  \n模拟战斗不能很好地映射到编程；然而，在许多代码道场中有一种名为 `randori` 的游戏。它非常像双人的 `wasa`，伙伴们正在解决一个问题。然而，它是多人玩的，并且规则有一个花样。当屏幕投影在墙上时，一个人写一个测试然后坐下。下一个人让测试通过，然后写下一个测试。这可以在桌子周围顺序进行，或者人们可以随心情简单排队。无论哪种情况，这些练习都可以很好。\n\
  \n从这些课程中你可以学到这么多，是令人惊讶的。你可以对他人解决问题的方式获得巨大的洞察。这些洞察只能有助于拓宽你自己的方法并提高你的技能。\n\n## 扩展你的经验\n\
  \n专业程序员经常受到他们解决的问题类型缺乏多样性的困扰。雇主通常会强制程序员在单一的语言、平台和领域内工作。如果没有拓宽的影响，这可能导致你的简历和思维发生非常不健康的收缩。这样的程序员发现自己没有为定期横扫行业的变化做好准备，这并不稀奇。\n\
  \n### 开源\n\n要保持领先地位的一种方法是像律师和医生做的那样：通过为开源项目贡献来承担一些公益工作。那里有很多这样的项目，可能没有比实际上处理他人关心的事情更能增加你技能库范围的方法了。\n\
  \n所以，如果你是一个 `Java` 程序员，就为 `Rails` 项目做贡献。如果你为雇主写了大量的 `C++`，就找一个 `Python` 项目并为它贡献。\n\
  \n### 练习伦理\n\n专业程序员在自己的时间练习。帮助你保持技能敏锐不是雇主的工作。帮助你调整简历不是雇主的工作。病人不付钱让医生练习缝合。足球球迷不（通常）付钱看球员穿过轮胎。音乐观众不付钱听音乐家弹音阶。程序员的雇主也不需要为你练习的时间付费。\n\
  \n既然你的练习时间是你自己的时间，你不需要使用与你雇主工作时相同的语言或平台。选择任何你喜欢的语言，并保持你的多语言技能敏锐。如果你在一家 `.NET` 公司工作，就在午餐时间或家里练习一下\
  \ `Java` 或 `Ruby`。\n\n### 结论\n\n无论何种方式，*所有*专业人士都会练习。他们这样做是因为他们关心尽可能做好工作。更重要的是，他们在自己的时间练习，因为他们意识到保持技能敏锐是自己的责任——而不是雇主的。练习是在没有报酬时做的事情。你这样做是为了获得报酬，并且是优厚的报酬。\n\
  \n### 参考文献\n\n**[K&R-C]:** Brian W. Kernighan and Dennis M. Ritchie, *The C Programming\
  \ Language* , Upper Saddle River, NJ: Prentice Hall, 1975.\n\n**[PPP2003]:** Robert\
  \ C. Martin, *Agile Software Development: Principles, Patterns, and Practices* ,\
  \ Upper Saddle River, NJ: Prentice Hall, 2003.\n\n## 7. 验收测试\n\n![image](img/Image00131.jpg)\n\
  \n专业开发人员的角色既是沟通角色，也是开发角色。记住，垃圾进垃圾出也适用于程序员，因此专业程序员会非常确保他们与团队其他成员以及业务部门的沟通是准确且健康的。\n\
  \n### 沟通需求\n\n\n\n程序员与业务部门之间常见的沟通问题之一就是需求。业务人员陈述他们认为需要什么，然后程序员构建出他们认为业务人员所描述的内容。至少理论上它该是这样运作的。但在现实中，需求的沟通极其困难，整个过程充满了错误。\n\
  \n1979 年，当我在 Teradyne 工作时，安装和现场服务经理 Tom 拜访了我。他请我向他演示如何使用 `ED-402` 文本编辑器创建一个简单的故障工单系统。\n\
  \n`ED-402` 是一个为 `M365` 计算机编写的专有编辑器，而那台机器是 Teradyne 的 `PDP-8` 克隆机。作为一款文本编辑器，它非常强大。它内置了一种脚本语言，我们用它处理各种简单的文本应用程序。\n\
  \nTom 并不是一个程序员。但他脑海中的应用很简单，所以他认为我可以很快教会他，然后他就可以自己写这个程序。由于我的天真，我也是这么想的。毕竟，那种脚本语言仅仅是一个用于编辑命令的宏语言，只有非常基础的判断和循环结构。\n\
  \n于是，我们坐在一起，我问他希望他的程序做什么。他从初始输入界面说起。我向他展示了如何创建一个存储脚本语句的文本文件，以及如何向该脚本中输入编辑命令的符号表示。但当我看向他的眼睛时，那里空空如也。我的解释对他来说完全没有意义。\n\
  \n这是我第一次遇到这种情况。对我来说，用符号来表示编辑器命令是一件很简单的事。例如，为了表示 `control-B` 命令（将光标置于当前行开头的命令），你只需在脚本文件中输入\
  \ `^B` 即可。但这对 Tom 来说毫无意义。他无法完成从“编辑一个文件”到“编辑一个能够编辑另一个文件的文件”的跨越。\n\nTom 并不笨。我认为他只是意识到这会比他预想的要复杂得多，他不想投入必要的时间和精力精力去学习像“用编辑器来控制编辑器”这样极其复杂的东西。\n\
  \n于是，我发现自己在一点一点地实现这个程序，而他就坐在那儿看着。在前二十分钟内，很明显，他的重点已经发生了变化：从“学习如何自己做”变成了“确保*我*所做的正是*他*想要的”。\n\
  \n我们花了整整一天时间。他描述一个功能，我在他注视下实现。循环周期是五分钟或更短，所以他没有理由起身去干别的。他会让我做 `X`，在五分钟内我就让 `X` 运行起来了。\n\
  \n通常，他会在草稿纸上画出他想要的东西。他想要的某些功能在 `ED-402` 中很难实现，所以我提议其他方案。我们最终对某个可行的方案达成一致，然后我让它运行起来。\n\
  \n但当我们试用时，他又会改变主意。他会说：“不，那样没有我想要的流畅感。我们换一种方式试试。”\n\n一小时又一小时，我们反复调整、戳弄，直到这个程序成型。我们尝试了一种方案，然后是另一种，再另一种。对我来说非常清楚：*他*是雕塑家，而我是他正在使用的工具。\n\
  \n最后，他得到了想要的程序，但完全不知道如何为自己构建下一个程序。另一方面，我学到了一个关于客户究竟是如何发现自己需求的深刻教训。我学到了他们对功能的愿景在与计算机实际实际接触后，往往无法生存。\n\
  \n## 过早精确 (Premature Precision)\n\n业务人员和程序员都容易陷入“过早精确”的陷阱。业务人员希望在授权项目之前，确切知道他们将得到什么。开发者希望在估算项目之前，确切知道他们应该交付什么。双方都想要一种根本无法实现的精确，并且往往愿意花费巨资来尝试实现这种精确。\n\
  \n### 不确定性原理 (The Uncertainty Principle)\n\n问题在于，事情在纸面上看起来和在运行的系统中看起来是不同的。当业务人员真正看到他们指定的规范在系统中运行时，他们才发现那不是他们想要的。一旦他们看到需求实际运行，他们对自己真正想要有了更好的想法——而那通常不是他们看到的。\n\
  \n这里存在某种观察者效应，或不确定性原理。当你向业务部门演示一个功能时，它提供了比之前更多的信息，而这些新信息会影响他们对整个系统的看法。\n\n最终，你的需求写得越精确，在系统实现时它们就越不相关。\n\
  \n### 估算焦虑 (Estimation Anxiety)\n\n开发者也可能陷入精确陷阱。他们知道必须估算系统，并往往认为这需要精确。其实不然。\n\n\
  首先，即使拥有完美的信息，你的估算也会有巨大的方差。其次，不确定性原理让早期的精确变得毫无意义。需求*会*改变，使得那种精确变得徒劳。\n\n专业开发者理解，估算可以且应该基于低精确度的需求进行，并意识到那些估算仅仅是*估算*。为了强化这一点，专业开发者总会在估算中包含误差范围，以便业务部门理解其中的不确定性。（参见第\
  \ 10 章，“估算”。）\n\n## 延期模糊 (Late Ambiguity)\n\n解决过早精确的方法是尽可能推迟精确。专业开发者在准备开发某个需求之前，不会细化它。然而，这可能导致另一种问题：后期模糊。\n\
  \n利益双方往往产生分歧。当分歧发生时，他们可能发现通过文字游戏来回避问题比解决问题更容易。我曾听过 Tom DeMarco 说：“需求文档中的模糊性代表了利益相关者的争论。”(1)\n\
  \n当然，产生模糊并不需要争论。利益相关有时假设读者知道他们的意思。这在他们的语境下可能是完全清晰的，但对阅读它的程序员来说意味着另一回事。这种语境模糊也发生在客户和程序员面对面交流时。\n\
  \nSam（利益相关者）：“好的，这些日志文件需要备份。”\nPaula：“好的，频率是多少？”\nSam：“每天。”\nPaula：“对，你想保存在哪儿？”\n\
  Sam：“你什么意思？”\nPaula：“你想让我保存在某个子目录里吗？”\nSam：“是的，那样很好。”\nPaula：“我们给它起什么名字？”\nSam：“叫\
  \ `backup` 好吗？”\nPaula：“行，这样可以。所以我们每天都会把日志文件写入 backup 目录。什么时候？”\nSam：“每天。”\nPaula：“不，我是指每天的什么时候写入？”\n\
  Sam：“任何时间。”\nPaula：“中午？”\nSam：“不，交易时段不行。午夜更好。”\nPaula：“好，那就午夜。”\nSam：“太好了，谢谢！”\n\
  Paula：“不客气。”\n\n后来，Paula 告诉同事 Peter 这项任务。“好的，我们需要每天午夜将日志文件复制到名为 `backup` 的子目录中。”\n\
  Peter：“好的，我们用什么文件名？”\nPaula：“`log.backup` 应该可以。”\nPeter：“没问题。”\n\n在另一个办公室，Sam 正在和他的客户通话。\n\
  Sam：“是的，是的，日志文件会被保存的。”\nCarl：“好的，永远不要丢失日志至关重要。我们需要在几个月或甚至几年后，每当发生停机、事件或纠纷时，都能追溯所有的日志文件。”\n\
  \n\n\nSam：“别担心，我刚和 Paula 聊过。她会在每天午夜时将日志保存到一个名为 `backup` 的目录中。”\n\nCarl：“好的，听起来不错。”\n\
  \n我推测你已经发现了其中的歧义。客户期望所有的日志文件都能被保存，而 Paula 仅仅地认为他们想要保存的是昨晚的日志文件。当客户寻找几个月之前的日志文件备份时，他们只会找到昨晚的那个。\n\
  \n在这种情况下，Paula 和 Sam 都失了失子。专业开发者（以及利益相关者）有责任确保消除需求中所有的歧义。\n\n这很`困难`，而且我只知道一种解决方法。\n\
  \n## 验收测试 (Acceptance Tests)\n\n`acceptance test`（验收测试）这个术语被过度使用和误用。一些人认为这些是用户在接受发布之前执行的测试。另一些人则认为这些是\
  \ QA 测试。在本章中，我们将验收测试定义为由利益相关者和程序员合作编写的测试，`目的是定义一个需求何时才算完成`。\n\n## “完成”的定义\n\n作为软件专业人员，我们面临的最常见歧义之一就是“完成（done）”的歧义。当一个开发者说他完成了一项任务时，这意味着什么？是意味着开发者已经准备好充满信心地部署该功能吗？还是意味着他已经准备好交给\
  \ QA 了？或者，他只是写完了代码并运行了一次，但还没有真正进行测试。\n\n我曾与一些团队对“done（完成）”和“complete（完整）”这两个词有不同的定义。一个特定的团队使用了“done”和“done-done（真的完成了）”这两个词。\n\
  \n专业开发者对完成有一个统一的定义：完成意味着`完成`。完成意味着所有代码已写完、所有测试已通过、QA 和利益相关者已接受。完成。\n\n但如何在获得这种“完成度”的同时，并在迭代之间取得快速进展呢？你创建一套自动化测试，当这些测试通过时，就满足了上述所有标准！当你的功能的验收测试通过时，你就`完成`了。\n\
  \n专业开发者将他们需求的定义一直推到自动化验收测试。他们与利益相关者和 QA 协作，确保这些自动化测试是“完成”的完整规范。\n\nSam：“好的，现在这些日志文件需要备份了。”\n\
  \nPaula：“好的，频率多久？”\n\nSam：“每天。”\n\nPaula：“明白。你想把它保存在哪里？”\n\nSam：“你什么意思？”\n\nPaula：“你想让我把它存在某个特定的子目录下吗？”\n\
  \nSam：“是的，那样很好。”\n\nPaula：“我们该叫它什么？”\n\nSam：“叫‘backup’ 怎么样？”\n\nTom（测试员）：“等等，backup\
  \ 这个名字太普通了。你们在这个目录里到底存储的是什么？”\n\nSam：“备份文件。”\n\nTom：“什么的备份？”\n\nSam：“日志文件。”\n\n\
  Paula：“但只有一个日志文件啊。”\n\nSam：“不，有很多。每天一个。”\n\nTom：“你的意思是有一个`active（活跃）`日志文件和很多日志文件备份？”\n\
  \nSam：“当然了。”\n\nPaula：“噢！我以为你只是想要一个临时备份。”\n\nSam：“不，客户想要永远保留它们。”\n\nPaula：“这我第一次听说。好的，很高兴我们澄清了这一点。”\n\
  \nTom：“所以，子目录的名字应该准确地告诉我们里面有什么。”\n\nSam：“它包含了所有旧的非活跃日志。”\n\nTom：“那我们就叫它 `old_inactive_logs`\
  \ 吧。”\n\nSam：“太棒了。”\n\nTom：“那么这个目录什么时候创建？”\n\nSam：“哈？”\n\nPaula：“我们应该在系统启动时创建目录，但前提是该目录不存在。”\n\
  \nTom：“好的，这是我们的第一个测试。我需要启动系统并查看 `old_inactive_logs` 目录是否创建。然后我会向该目录添加一个文件。然后我关闭并重新启动，确保目录和文件都在。”\n\
  \nPaula：“运行那个测试要花你很长时间。系统启动已经需要 20 秒了，而且还在变慢。此外，我真的不想每次运行验收测试时都构建整个系统。”\n\nTom：“你建议怎么做？”\n\
  \nPaula：“我们会创建一个 `SystemStarter` 类。主程序将加载一组 `StartupCommand` 对象到这个启动器中，这些对象将遵循 COMMAND\
  \ 模式。在系统启动期间，`SystemStarter` 只需告诉所有的 `StartupCommand` 对象运行即可。其中一个 `StartupCommand`\
  \ 的派生类将创建 `old_inactive_logs` 目录，但前提是它不存在。”\n\nTom：“噢，好的，那么我只需要测试那个 `StartupCommand`\
  \ 派生类。我可以为它写一个简单的 FIT NESSE 测试。”\n\nTom 走到白板前。“第一部分看起来像这样：”\n\n```\ngiven the command\
  \ LogFileDirectoryStartupCommand\ngiven that the old_inactive_logs directory does\
  \ not exist\nwhen the command is executed\nthen the old_inactive_logs directory\
  \ should exist\nand it should be empty\n```\n\n“第二部分看起来像这样：”\n\n```\ngiven the command\
  \ LogFileDirectoryStartupCommand\ngiven that the old_inactive_logs directory exists\n\
  and that it contains a file named x\nWhen the command is executed\nThen the old_inactive_logs\
  \ directory should still exist\nand it should still contain a file named x\n```\n\
  \nPaula：“是的，这应该涵盖了。”\n\nSam：“哇，这真的需要吗？”\n\nPaula：“Sam，这两个陈述中哪一个是不重要的到不需要指定的？”\n\n\
  Sam：“我的意思是写这些测试看起来工作量很大。”\n\nTom：“确实如此，但比起反复执行手动测试计划，写它们的工作量要少得多。”\n\n## 沟通 (Communication)\n\
  \n验收测试的目的是沟通、清晰和精确。通过这些测试，开发者、利益相关者和测试人员都理解了方案。实现这种清晰度是所有人的责任。专业开发者承担责任，确保所有人都都知道要构建什么。\n\
  \n## 自动化 (Automation)\n\n验收测试应该`始终`是自动化的。在软件生命周期的其他地方有手动测试的位置，但`这些`测试绝不应该是手动的。原因很简单：成本。\n\
  \n考虑图 7-1 中的图像。那只手属于一家大型互联网公司的 QA 经理。他拿着的文件是他的手动测试计划的目录。他在海外有一支手动测试员团队，每六周执行一次该计划。每次都要花费他超过百万美元。他把这个交给我是因为他刚参加完一个会议，经理告诉他需要削减\
  \ 50% 的预算。他的问题是：“我不应该运行哪部分测试？”\n\n**图 7-1. 手动测试计划**\n\n![image](img/Image00132.jpg)\n\
  \n称此为灾难是过于保守了。运行手动测试计划的成本是巨大的，以至于他们决定放弃它，并被迫接受`他们不知道一半产品是否能工作!`的事实。\n\n专业开发者不会让这种情况发生。自动化验收测试的成本与执行手动测试计划的成本相比是微不足道的，因此编写供人类执行的脚本在经济上是不合理的。专业开发者承担责任，确保验收测试是自动化的。\n\
  \n有很多开源和商业工具可以促进验收测试的自动化。FIT NESSE、`Cucumber`、`cuke4duke`、`robot framework` 和 `Selenium`，仅列举例子。所有这些工具都允许你以非编程人员可以阅读、理解甚至编写的形式来指定自动化测试。\n\
  \n\n\nSam 对工作的观点可以理解。编写像这样的验收测试*看起来*确实是很多额外工作。但根据图 7-1，我们可以看到这实际上不是什么额外工作。编写这些测试仅仅是规范系统的工作。在如此详细的层面进行规范是我们作为程序员知道什么是“完成”的唯一方法。在如此详细的层面进行规范是利益者确保他们提供的系统确实符合其需求的唯一方法。在如此详细的层面进行规范是成功自动化测试的唯一方法。所以不要把这些测试看作额外工作。要把它们视为节省大量时间和金钱。这些测试将防止你实现错误的系统，并让你*知道*自己何时完成了。\n\
  \n## 谁来编写验收测试，何时编写？\n\n在理想的世界里，利益者和 QA（质量保证）会协作编写这些测试，由开发者进行评审以保持一致性。在现实世界中，利益者很少有时间或兴趣深入到所需的细节水平。因此，他们通常会将责任委托给业务分析师、QA\
  \ 甚至开发者。如果结果开发者必须编写这些测试，请确保编写测试的开发者与实现被测试功能的开发者不是同一个人。\n\n通常，业务分析师编写测试的“快乐路径”版本，因为这些测试描述了具有业务价值的功能。QA\
  \ 通常编写“非快乐路径”测试、边界条件、异常情况和边缘情况。这是因为 QA 的工作是帮助思考可能出现什么问题。\n\n遵循“后期精确”（late precision）原则，验收测试应该越晚编写越好，通常在功能实现之前的几天编写。在敏捷项目中，测试是在功能被选择进入下一次迭代（Iteration）或冲刺（Sprint）*之后*编写的。\n\
  \n前几个验收测试应该在迭代的第一天准备就绪。每天应该完成更多，直到迭代的中期，那时所有测试都应该准备就绪。如果到迭代中期所有验收测试都没有准备就绪，那么某些开发者就得插手完成它们。如果这种情况频繁发生，就应该为团队增加更多的\
  \ BA 和/或 QA。\n\n## 开发者的角色\n\n当功能的验收测试准备就绪时，该功能的实现工作开始。开发者执行新功能的验收测试并查看它们是如何失败的。然后，他们努力将验收测试连接到系统，然后通过实现所需的功能开始让测试通过。\n\
  \nPaula：“Peter，你能帮我处理这个故事（story）吗？”\n\nPeter：“没问题，Paula，怎么了？”\n\nPaula：“这是验收测试。如你所示，它失败了。”\n\
  \n```\ngiven the command LogFileDirectoryStartupCommand\ngiven that the old_inactive_logs\
  \ directory does not exist\nwhen the command is executed\nthen the old_inactive_logs\
  \ directory should exist\nand it should be empty\n```\n\nPeter：“是的，全红了。一个场景（scenarios）都没写。让我来写第一个。”\n\
  \n|scenario|given the command _|cmd|\n|create command|@cmd||\n\nPaula：“我们已经有 `createCommand`\
  \ 操作了吗？”\n\nPeter：“有的，它在我上周写的写的 `CommandUtilitiesFixture` 里面。”\n\nPaula：“好的，那我们现在运行测试。”\n\
  \nPeter：（运行测试）。“好嘞，第一行是绿色的，我们看下一个。”\n\n不要太担心场景（Scenarios）和固件（Fixtures）。那些只是你为了将测试连接到被测系统而必须编写的一些胶水代码。\n\
  \n只需说明，所有工具都提供了某种方式使用模式匹配来识别和解析测试语句，然后调用函数将测试中的数据输入到被测的系统中。工作量很小，而且场景和固件在许多不同的测试中是可以复用的。\n\
  \n这一切的意义在于，将验收测试连接到系统并让这些测试通过，是开发者的工作。\n\n## 测试谈判与被动攻击\n\n测试作者也是人，会犯错。有时，一旦你开始实现它们，所编写的测试可能并不合理。它们可能太复杂了。它们可能很笨拙。它们可能包含愚蠢的假设。或者它们可能就是错了。如果你是必须让测试通过的开发者，这会非常令人沮丧。\n\
  \n作为一个专业的开发者，你的工作是与测试作者协商以获得更好的测试。你*绝不*应该做的是采取消极攻击的选择，并对自己说：“好吧，测试是这么说的，所以我就这样做。”\n\
  \n记住，作为一名专业人士，你的工作是帮助团队创建他们能创造的最优软件。这意味着每个人都需要留意错误和失误，并共同纠正它们。\n\nPaula：“Tom，这个测试不太对。”\n\
  \n```\nensure that the post operation finishes in 2 seconds.\n```\n\nTom：“在我看来还可以。我们的需求是用户等待时间不超过两秒。有什么问题？”\n\
  \nPaula：“问题是我们，我们只能在统计学意义上做出这种保证。”\n\nTom：“哈？那听起来像废话。需求是两秒。”\n\nPaula：“没错，我们可以在\
  \ 99.5% 的时间内实现这一点。”\n\nTom：“Paula，那不是需求。”\n\nPaula：“但这是事实。我没有其他办法可以提供这种保证。”\n\n\
  Tom：“Sam 会发火的。”\n\nPaula：“不，我已经和他通过通过了。只要正常情况下是两秒，他就没问题。”\n\nTom：“好吧，那该怎么写测试？我不能只说\
  \ post 操作通常是两秒。”\n\nPaula：“你可以统计地说。”\n\nTom：“你是说让我运行一千次操作并确保没有五个超过两秒？这太荒谬了。”\n\n\
  Paula：“不，那将花大部分时间运行。这样怎么样？”\n\n```\nexecute 15 transactions and accumulate times\n\
  ensure that the Z score for 2 seconds is at least 2.57\n```\n\nTom：“哇，什么是 Z score？”\n\
  \nPaula：“一点统计学知识。这里，这样怎么样？”\n\n```\nexecute 15 transactions and accumulate times\n\
  ensure odds are 99.5% that time will be less than 2 seconds.\n```\n\nTom：“是的，这有点可读，大概吧，但我能相信背后的数学逻辑吗？”\n\
  \nPaula：“我会确保在测试报告中显示所有中间计算，这样如果你有疑问时就可以检查公式。”\n\nTom：“好的，这样可以。”\n\n## 验收测试与单元测试\n\
  \n验收测试不是*单元*测试。单元测试是由程序员为程序员编写的。它们是正式的设计文档，描述了代码最底层的结构和行为。受众是程序员，而不是业务方。\n\n\n\n\
  但这些测试并非冗余的真正原因在于它们的首要功能*并不是测试*。它们是测试这一事实只是偶然的。单元测试和验收测试首先是文档，其次才是测试。它们的首要目的是正式地记录系统的设计、结构和行为。虽然它们能够自动验证其所规范的设计、结构和行为，这确实极其有用，但规范才是它们真实目的。\n\
  \n## GUI 以及其他复杂性\n\n在前期就规范好 GUI 是困难的。这可以做到，但很少能做好。原因是美学是主观的，因此是多变的。人们想要对 GUI 进行`调整`。他们想要对它们进行精修和操纵。他们想尝试不同的字体、颜色、页面布局和工作流。GUI\
  \ 是在不断变动中的。\n\n这为为 GUI 编写验收测试带来了挑战。诀窍在于设计系统，让你可以将 GUI 视作一个 API，而不是一组按钮、滑块、网格和菜单。这听起来可能很奇怪，但它实际上是良好的设计。\n\
  \n有一种设计原则被称为单一职责原则（`SRP`）。该原则规定，你应当将那些由于不同原因而变化的事分开，并将那些由于相同原因而变化的事归在一起。GUI 也不例外。\n\
  \nGUI 的布局、格式和工作流会出于审美和效率考虑而改变，但尽管有这些变化，GUI 的底层能力将保持不变。因此，在为 GUI 编写验收测试时，你利用了那些不频繁变化的底层抽象。\n\
  \n例如，一个页面上可能有多个按钮。与其根据它们在页面上的位置来创建点击这些按钮的测试，你可能根据它们的名称来点击它们。更好的是，也许它们每个都有一个你可以使用的唯一\
  \ `ID`。编写一个选择 `ID` 为 `ok_button` 按钮的测试，远比选择控制网格中第 4 行第 3 列的按钮要好得多。\n\n### 通过正确的接口进行测试\n\
  \n更好的方法是编写通过真实的 API 而非 GUI 来调用底层系统功能的测试。这个 API 应该是 GUI 所使用的同一个 API。这并不是什么新鲜事。设计专家们几十年来一直在告诉我们，要将\
  \ GUI 与业务规则分开。\n\n通过 GUI 进行测试总是会有问题的，除非你测试的*仅仅是* GUI 本身。原因是 GUI 可能会改变，导致测试非常脆弱。当每一次\
  \ GUI 改变都导致上千个测试失效时，你要么开始丢弃这些测试，要么停止改变 GUI。这两者都不是好主意。所以，编写业务规则测试时，请通过 GUI 下方的 API\
  \ 进行。\n\n某些验收测试规范了 GUI 本身的行为。这些测试*必须*通过 GUI 进行。然而，这些测试并不测试业务规则，因此不需要将业务规则连接到 GUI。因此，解耦\
  \ GUI 和业务规则，并在测试 GUI 本身时用存根（stubs）替换业务规则是一个好主意。\n\n将 GUI 测试保持在最低。它们是脆弱的，因为 GUI 是多变的。GUI\
  \ 测试越多，你越可能无法保留它们。\n\n## 持续集成\n\n确保你所有的单元测试和验收测试每天在`continuous integration`（持续集成）系统中运行。该系统应该由你的源码控制系统触发。每当有人提交一个模块时，`CI`\
  \ 系统都应该启动构建，然后运行系统中的所有测试。运行结果应该通过邮件发送给团队的每一个人。\n\n### 停工待运\n\n保持 `CI` 测试始终运行是非常重要的。它们永远不应该失败。如果它们失败了，整个团队都应该停止手头的工作，专注于让坏掉的测试重新通过。`CI`\
  \ 系统中的构建失败应该被视为紧急情况，一个“停工待运”的事件。\n\n我曾咨询过那些未能认真对待坏测试的团队。他们“太忙了”而修复坏掉的测试，所以他们把它们置放在一边，承诺以后再修复。在其中一个案例中，团队实际上从构建中移除了那些坏测试，因为看到它们失败太不方便了。后来，在向客户交付后，他们发现自己忘记把那些测试放回构建中了。他们之所以知道这一点，是因为愤怒的客户打来电话报告\
  \ bug。\n\n### 结论\n\n关于细节的沟通是困难的。对于程序员和利益相关者就应用程序细节进行沟通来说更是如此。双方都很容易挥挥手并`假设`另一方理解了。很多时候，双方都同意他们理解了，但离开时脑子里带着完全不同的想法。\n\
  \n我所知的有效消除程序员和利益相关者之间通信错误的唯一方法就是编写自动化验收测试。这些测试是正式到可以执行的。它们完全没有歧义，并且不会与应用程序不同步。它们是完美的需求文档。\n\
  \n## 8. 测试策略\n\n![image](img/Image00133.jpg)\n\n专业开发者会测试他们的代码。但测试不仅仅是编写几个单元测试或几个验收测试那么简单。编写这些测试是好事，但这远不够够。每个专业开发团队需要的是一个良好的`testing\
  \ strategy`。\n\n1989 年，我在 Rational 公司负责 Rose 的第一个版本的发布。每隔一个月左右，我们的 `QA` 经理就会组织一个“Bug\
  \ 猎活动日”。团队中的每一个人，从程序员到经理，从秘书到数据库管理员，都会坐在 Rose 面前并尝试让它崩溃。对于各种类型的 bug 会发放奖励。发现崩溃 bug\
  \ 的人可以赢得双人晚餐。发现最多 bug 的人可能会赢得在蒙特雷（Monterey）度过周末。\n\n### QA 应该什么也发现不了\n\n我以前说过，现在还会说一遍。尽管你的公司可能有一组专门的\
  \ `QA` 组来测试软件，但开发小组的目标应该是让 QA 一无所获。\n\n当然，这个目标不太可能被不断实现。毕竟，当你有一群聪明且决心要发现产品中所有瑕疵和缺陷的人时，他们很可能会发现一些。尽管如此，每当\
  \ QA 发现问题时，开发团队都应该感到惊恐。他们应该反思问题是如何发生的，并采取措施防止未来再次发生。\n\n### QA 是团队的一部分\n\n上一节可能让你觉得\
  \ QA 和开发团队是对立的，他们的关系是敌对的。这并非本意。相反，QA 和开发团队应该合作，确保系统质量。团队中 QA 部分的最佳角色是担任规范者（specifiers）和刻画者（characterizers）。\n\
  \n#### QA 作为规范者\n\nQA 的角色应该是与业务合作，创建自动化验收测试，这些测试将成为系统的真实规范和需求文档。通过迭代，他们从业务端收集需求，并将其转化为描述系统应该如何运行的测试（参见第\
  \ 7 章，“验收测试”）。通常情况下，业务编写核心路径测试，而 QA 编写边界、边界情况和非核心路径测试。\n\n#### QA 作为刻画者\n\nQA 的另一个角色是利用探索性测试的学科\
  \ ^(1) 来刻画运行系统的真实行为，并将该行为反馈给开发和业务部门。在这个角色中，QA *不是*在解释需求。相反，他们正在识别系统的实际行为。\n\n###\
  \ 测试自动化金字塔\n\n\n\n\n\n专业开发人员采用测试驱动开发（TDD）的规范来创建单元测试。专业开发团队使用验收测试来规范他们的系统，并利用持续集成（第\
  \ 7 章，第 110 页）来防止回归。但这些测试只是情况的一部分。拥有一套单元测试和验收测试固然很好，但我们还需要更高级别的测试来确保 QA（质量保证）无法发现任何问题。图\
  \ 8-1 展示了测试自动化金字塔，^(2)它是专业开发组织所需的各种测试的图形化描述。\n\n**图 8-1. 测试自动化金字塔**\n\n![image](img/Image00134.jpg)\n\
  \n### 单元测试\n\n金字塔的底部是单元测试。这些测试由程序员编写、为程序员编写，并使用系统的编程语言编写。这些测试的意图是在最低层面规范系统。开发者在编写生产代码之前编写这些测试，以此来规范他们正要编写的内容。它们作为持续集成的一部分被执行，以确保程序员的意图得到维护。\n\
  \n单元测试提供了在实践尽可能接近 100% 的覆盖率。通常，这个数字应该在 90 左右。而且它应该是*真实*的覆盖，而不是那些只执行代码而不断言其行为的虚假测试。\n\
  \n### 组件测试\n\n这些是前一章提到的某些验收测试。通常，它们是针对系统的单个组件编写的。系统组件封装了业务规则，因此这些组件的测试就是这些业务规则的验收测试。\n\
  \n如图 8-2 所示，组件测试封装了一个组件。它将输入数据传入组件并从中收集输出数据。它测试输出是否与输入匹配。任何其他系统组件都通过适当的模拟（mocking）和测试双胞（test-doubling）技术与测试解耦。\n\
  \n**图 8-2. 组件验收测试**\n\n![image](img/Image00135.jpg)\n\n组件测试由 QA 和业务人员在开发人员的协助下编写。它们在组件测试环境中组合，例如使用\
  \ `FIT NESSE`、`JBehave` 或 `Cucumber`。（GUI 组件使用 `Selenium` 或 `Watir` 等 GUI 测试环境进行测试。）其意图是业务人员能够阅读和解释这些测试，即使不是编写它们。\n\
  \n组件测试覆盖了系统的一半。它们更多地针对正常路径（happy-path）情况以及非常明显的边缘、边界和交替路径案例。绝大多数非正常路径（unhappy-path）案例由单元测试覆盖，在组件测试层面是没有意义的。\n\
  \n### 集成测试\n\n这些测试对于具有许多组件的大型系统才有意义。如图 8-3 所示，这些测试组合了一组组件并测试它们之间的通信情况。系统的其他组件照常通过适当的模拟和测试双胞进行解耦。\n\
  \n**图 8-3. 集成测试**\n\n![image](img/Image00136.jpg)\n\n集成测试是*编排*（choreography）测试。它们不测试业务规则。相反，它们测试组件的组合配合得有多好。它们是*水路*（plumbing）测试，确保组件已正确连接并能够清晰地通信。\n\
  \n集成测试通常由系统的系统架构师或首席设计师编写。这些测试确保系统的架构结构是健全的。在这一层，我们可能会看到性能和吞吐量测试。\n\n集成测试通常使用与组件测试相同的语言和环境编写。它们通常*不*作为持续集成套件的一部分执行，因为它们的运行时间通常较。相反，这些测试根据作者的需要定期（每晚、每周等）运行。\n\
  \n### 系统测试\n\n这些是对整个集成系统执行的自动化测试。它们是终极集成测试。它们不直接测试业务规则。相反，它们测试系统是否连接正确以及各个部分是否按照计划相互操作。我们预计在该套测试中看到吞吐量和性能测试。这些这些测试由系统架构师和技术负责人编写。通常它们使用与\
  \ UI 的集成测试相同的语言和环境编写。取决于时长，它们的执行频率相对较低，但越频繁越好。\n\n系统测试可能覆盖了系统的 10%。这是因为它们的意图不是确保系统行为正确，而是确保系统*构建*正确。底层代码和组件的正确行为已经由金字塔的下层得到了确认。\n\
  \n### 手动探索测试\n\n这是人类手放在键盘上、眼睛盯着屏幕的地方。这些测试既不是自动的，*也不是脚本化的*。这些测试的意图是在确认预期行为的同时，探索系统的意外行为。为了这一目标，我们需要人类的大脑和创造力来工作调查并探索系统。为这种测试编写书面测试计划会违背其初衷。\n\
  \n有些团队会让专家做这项工作。其他团队只需简单地宣布一两天“找虫日”，让尽可能的人（包括经理、秘书、程序员、测试人员和技术撰稿员）对系统进行“猛击”，看是否能让它崩溃。\n\
  \n目标不是覆盖率。我们不会通过这些测试来证明每一个业务规则和每一个执行路径。相反，目标是确保系统在人工操作下运行良好，并创造性地发现尽可能多的“异常”。\n\n\
  ### 结论\n\nTDD 是一种强大的规范，验收测试是表达需求的价值方式。但它们只是测试策略的一部分。为了实现“QA 无法发现任何问题”的目标，开发团队需要与\
  \ QA 密切合作，创建单元、组件、集成和系统测试。这些测试应该尽可能地运行，以保持系统持续整洁。\n\n### 参考文献\n\n**[COHN09]:** Mike\
  \ Cohn, *Succeeding with Agile* , Boston, MA: Addison-Wesley, 2009.\n\n## 9. 时间管理\n\
  \n![image](img/Image00137.jpg)\n\n八小时是一个非常短的时间。它只有 480 分钟或 28,800 秒。作为专业人士，你期望能尽可能高效、有效地利用这些珍贵的秒秒。你可以使用什么策略来确保自己不浪费所拥有的时间？你如何有效地管理你的时间？\n\
  \n1986 年，我住在英国乡村郡的 Little Sandhurst。我在 Bracknell 的 Teradyne 管理一个 15 人的软件开发部门。我的每天充满了电话、临时会议、现场服务问题和干扰。因此，为了完成任何工作，我不得不采取相当激进的时间管理规范。\n\
  \n- 我每天早上 5 点起床， 6 点前骑自行车到达 Bracknell 的办公室。这在一天天的混乱开始之前给了我 ![image](img/Image00138.jpg)\
  \ 小时的安静时间。\n\n- 到达后，我会在板上写下计划。我将时间分为 15 分钟的增量，并填入我在段时间内要执行的活动。\n\n- 我完全填满了该计划的前\
  \ 3 小时。从早上 9 点开始，我开始每小时留出一个 15 分钟的空隙；这样我就可以快速将大部分干扰推入这些空隙中，并继续工作。\n\n\n\n\n\n我没有给午后的时间安排任何计划，因为我知道到那时一切都会陷入混乱，我在这一天剩余下来的时间里都将处于被动模式。在那些混乱没有侵扰的罕见下午时段，我只会处理最重要的事情，直到混乱来临。\n\
  \n这种方案并非总是成功。凌晨 5 点起床并不总是可行，有时混乱会突破我所有周密的策略，并吞噬我的一整天时间。但在大多数情况下，我能够能够游刃有余。\n\n##\
  \ 会议\n\n会议的成本每人每小时约为 200 美元。这考虑了薪水、福利、设施费用等。下次你参加会议时，计算一下成本。你可能会大吃惊讶。\n\n关于会议有两个事实：\n\
  \n1. 会议是必要的。\n2. 会议是巨大的时间浪费。\n\n通常，这两个事实平等地描述了同一场会议。与会者可能可能认为它们无价之；另一些人可能认为它们多余或无用。\n\
  \n专业人士意识到会议的高成本。他们也意识到自己的时间是宝贵的；他们有 `code` 要写，有日程要完成。因此，他们积极拒绝参加没有即时且显著收益的会议。\n\n\
  ### 拒绝\n\n你不需要参加每一场邀请你的会议。事实上，参加过多的会议是不专业的表现。你需要明智地利用你的时间。所以，对于参加哪些会议以及礼貌地拒绝哪些会议，要得非常小心。\n\
  \n邀请你参加会议的人并不负责管理你的时间。只有 `you` 可以做到这一点。所以当你收到会议邀请时，除非该会议的参与对你目前正在的工作是即时且显著必要的，否则不要接受。\n\
  \n有时会议将涉及你感兴趣的话题，但并非迫切需要。你必须选择自己是否付得起这段时间。小心——这类会议多到足以耗尽你的整天时间。\n\n有时会议将涉及你可以贡献的话题，但对你目前的工作没有即时意义。你必须选择对你的项目的损失是否值得他们项目带来的收益。这听起来可能很愤世嫉俗，但你的责任首先是对待\
  \ `your projects`。尽管如此，一个团队帮助另一个团队通常是好事，因此你可能想与你的团队和经理讨论你的参与情况。\n\n有时，权威人士会要求你参加会议，例如另一个项目的非常资深的工程师或另一个不同项目的经理。你必须选择那种权威是否超过了你的工作安排。同样，你的团队和你的主管可以在做该决定时提供帮助。\n\
  \n你的经理最重要的职责之一就是让你远离 `out` 会议。一个好的经理会非常愿意支持你拒绝参加的决定，因为那个经理对你时间的关注程度与你一样。\n\n###\
  \ 离开\n\n会议并不总是按照计划进行。有时你会发现自己坐在一场会议中，如果你早知道更多本会拒绝的。有时会有新话题被加入，或者某人的个人偏好主导了讨论。多年来，我养成了一个简单的规则：当会议变得无聊时，离开。\n\
  \n再次，你有义务管理好自己的时间。如果你发现自己困在一场对你时间没有良好利用的会议中，你需要找到方法礼貌地离开。\n\n显然，你不应该冲出会议并大喊道“这太无聊了！”没必要没礼貌。你可以在恰当的时机询问你的出席是否还有必要。你可以解释你无法投入更多时间，并询问是否有办法可以加快讨论或调整议程。\n\
  \n要意识到的重要点是，留在对你已经变成时间浪费且你无法再做出显著贡献的会议中是不专业的。你有义务明智地花费雇主的时间和金钱，所以选择一个合适的时机协商离开并不是不专业的。\n\
  \n### 拥有议程和目标\n\n我们愿意承担会议成本的原因是，我们有时确实需要参与者聚集在一个房间里以帮助实现某个特定目标。为了明智地利用参与者的时间，会议应该有一个清晰的议程，包括每个主题分配的时间以及陈述的目标。\n\
  \n如果你被要求参加会议，确保你知道桌面上有哪些讨论、每个讨论分配了多少时间以及要实现什么目标。如果你无法就这些问题得到明确回答，请礼貌地拒绝参加。\n\n如果你去会议并发现议程被劫持或遗弃，你应该要求将新话题搁置并遵循议程。如果这种情况没有发生，你应该在可能的情况下礼貌离开。\n\
  \n### 每日会议（Stand-Up Meetings）\n\n这些会议是敏捷规范的一部分。它们的名称源于参与者在会议期间被要求站立。每个参与者轮流回答三个问题：\n\
  \n1. 我昨天做了什么？\n2. 我今天打算做什么？\n3. 有什么阻碍了我？\n\n就这些。每个问题的回答不应超过二十秒，因此每个参与者的时间不应超过一分钟。即使在十人的小组中，这种会议也应该在十分钟过去之前就结束。\n\
  \n### 迭代计划会议\n\n这些是敏捷规范中最难做好的会议。如果做得不好，它们会花费过多的时间。让这些会议顺利进行需要技巧，这种技巧非常值得学习。\n\n\
  迭代计划会议旨在选择将在下一次迭代中执行的 `backlog items`。候选项目应该已经完成了估算。对业务价值的评估也应该已经完成。在非常优秀的组织中，`acceptance/\
  \ tests` 应该已经写好。\n\n会议应该快速进行，每个候选项目经过简短讨论后被选择或拒绝。任何给定项目花费的时间不要超过五到十分分钟。\n\n我的准则是，会议时间应不超过迭代总时间的\
  \ 5%。所以对于一个周的迭代（40 小时），会议应该在两小时内结束。\n\n\n\n\n有些人会表现出消极攻击性（passive-aggressive）。他们为了结束争论而表示同意，然后通过拒绝参与解决方案来破坏结果。他们心里会想：“这就是他们想要的方式，现在他们要得到他们想要的了。”这可能是所有行为中最不专业的表现的一种了。千万、千万不要这样做。如果你同意了，你就\
  \ `must` 参与其中。\n\n你如何获得解决分歧所需的数据？有时你可以进行实验，或者进行一些模拟或建模。但有时，最好的替代方案是简单地掷硬币，在两个争议的路径中选择一条。\n\
  \n如果进展顺利，那么那条路径就是可行的。如果你遇到了麻烦，你可以退出并改走另一条路。明智的做法是还要约定一个时间，以及一套标准，以帮助确定何时放弃所选的路径。\n\
  \n要警惕那些仅仅为了发泄意见以及为一方或另一方集结支持的会议。避免那些只有一个争论者在进行陈述的会议。\n\n如果一个争论必须得到真正的解决，请让每位争论者在五分钟或更短时间内向团队陈述。然后让团队投票。整个会议将花费不到十五分钟。\n\
  \n### 专注曼纳（Focus-Manna）\n如果这一部分看起来有一股新时代玄学，或者是《地下与城》的味道，请原谅我。这只是我思考这个问题的方式。\n\n\
  编程是一项需要长时间专注投入的智力活动。专注是一种稀缺资源，就像曼纳（manna）。^(1)当你耗尽专注曼纳后，你必须通过一小时或更长的非专注活动来充电。\n\n\
  我不知道这种专注曼纳是什么，但我觉得它是一种物理物质（或者是它的缺失），影响着警觉和注意力。无论它是什么，当它存在时你可以 `feel` 到它，当它消失时也能感觉到。专业开发者学会管理时间，以利用他们的专注曼纳。我们在专注曼纳水平高时写代码；在水平不高时，我们做其他效率较低的事情。\n\
  \n专注曼纳也是一种会衰减的资源。如果你在它存在时不使用它，你可能会失去它。这就是为什么会议如此具有破坏性的原因之一。如果你在会议上耗尽所有的专注曼纳，你就没有剩下的精力写代码了。\n\
  \n担忧和分心也会消耗专注曼纳。你昨晚和配偶的争吵，你今天早上给保险杠撞出的凹，或者上周忘记支付的账单，都会迅速从你身上吸走专注曼纳。\n\n#### 睡眠\n\
  我怎么强调这一点都不为过。在良好的睡眠之后，我拥有最多的专注曼纳。七小时的睡眠通常能给我提供相当于八小时的专注曼纳。专业开发者管理他们的睡眠计划，以确保他们在早晨上班时已经补充了专注曼纳。\n\
  \n#### 咖啡因\n毫无疑问，我们中有些人可以通过摄入适量的咖啡因来更有效地利用我们的专注曼纳。但要小心。咖啡因也会给你的专注带来一种奇怪的“抖动”。过量的咖啡因会让你的专注滑向非常奇怪的方向。强效的咖啡因冲动会导致你浪费一整天的时间，过度关注在所有错误的事情上。\n\
  \n咖啡因的使用和耐受性是个人的问题。我的个人偏好是早上早上喝杯浓咖啡，午餐配一瓶健可乐。我有时会将剂量增加一倍，但很少超过此比例。\n\n#### 充电\n\
  通过去专注可以部分恢复专注曼纳。一次良好的长距离散步、与朋友交谈、或者盯着窗外发呆，都能帮助把专注曼纳泵回来。\n\n有些人冥想。有些人抓小睡。还有人会听播客或翻阅杂志。\n\
  \n我发现，一旦曼纳消失了，你就无法强迫自己专注。你仍然可以写代码，但你肯定要在第二天重写，或者忍受一堆烂掉的代码几周或几个月。所以，花三十分钟甚至六十分钟去专注会更好。\n\
  \n#### 肌肉专注\n进行武术、太极或瑜伽等身体训练有一些特别之处。尽管这些活动需要大量的专注，但它与编程的专注是不同的类型。它不是智力的，而是肌肉的。不知为何，肌肉专注有助于为精神专注充电。不过这不仅仅是简单的充电。我发现，定期的肌肉训练会增加我精神专注的能力。\n\
  \n我选择的身体专注形式是骑自行车。我会骑一到两个小时，有时会骑二十或三十英里。我沿着与 Des Plaines 河平行的小径骑行，所以我不需要处理汽车问题。\n\
  \n在骑车时，我会听关于天文学或政治的播客。有时我只是听我最喜欢的音乐。有时我只是关掉耳机倾听大自然。\n\n有些人会花时间动手做手工。也许他们喜欢木工、制作模型或园艺。无论是什么活动，专注于肌肉的活动总有某些东西能增强大脑工作的能力。\n\
  \n#### 输入与输出\n我发现对于专注至关重要的另一件事是平衡输出与适当的输入。编写软件是一项 `creative` 练习。我发现当我接触他人的创造力时，我最有创造力。所以我读了很多科幻小说。那些作者的创造力以某种方式刺激了我的创造力。\n\
  \n#### 时间盒与西茄\n我发现对于专注至关重要的另一件事是用适当的输入平衡我的输出。我用来管理时间和专注的另一种非常有效的方法是使用著名的番茄工作法^(2)也被称为\
  \ `\U0001F345`。基本思想非常简单。你设定一个计时器（通常是西茄形状的）持续 25 分钟。在计时器运行时，让 `nothing` 干扰你正在做的事。如果电话响了，接听并礼貌地请求在\
  \ 25 分钟内回电。如果有人停下来问你问题，礼貌地请求在 25 分钟内回复他们。无论干扰如何，你只需推迟到计时器响。毕竟，很少有干扰是紧急到不能等 25 分钟的！\n\
  \n当西茄计时器响时，`立即` 停止正在做的事。处理西茄期间发生的任何干扰。然后休息五分钟。然后再次设定 25 分钟的计时器开始下一个西茄。每四个西茄你休息 30\
  \ 分钟左右的较假。\n\n关于这种技术有很多介绍，我敦促你阅读一下。然而，上面的描述应该能让你掌握该技术的精髓。\n\n\n\n\n有时候，你的心并没有投入到工作中。这可能是因为需要要做的事情令人恐惧、不安或无聊。也许你认为它会迫使你面对一场冲突，或者带你进入一个无法逃脱的鼠洞。又或许你只是纯粹不想做它。\n\
  \n## 优先级倒置\n\n无论原因何，你都会找到方法逃避真正的工作。你说服自己其他事情更紧急，然后转而去去做那些事。这被称为 `priority inversion`。你提高了某个任务的优先级，以便推后那些具有真正优先级的任务。优先级倒置是我们对自己撒的谎言。我们无法面对必须做的事情，于是说服自己另一项任务更重要。我们知道事实如此，但我们对自己撒了谎。\n\
  \n实际上，我们并没有在对自己撒谎。我们真正所做的，是在为一个谎言做准备——当有人问我们我们在做什么以及为什么要这样做时，我们要撒这个谎。我们正在建立一种防御，来保护自己免受他人的评价。\n\
  \n显然，这是不专业的行为。专业人士会评估每项任务的优先级，忽略个人的恐惧和欲望，并按优先级顺序执行这些任务。\n\n## 死胡同\n\n死胡同是所有软件匠人生活中的事实。有时，你会做出一个决定，并走入一条没有结果的技术路径。你对这个决定的投入越深，在荒野中徘徊得越久。如果你赌上了自己的职业声誉，你将永远徘徊下去。\n\
  \n谨慎和经验会帮助你避免某些死胡同，但你永远无法避免所有的。因此，你需要的真正技能是快速意识到自己何时处于胡同中，并有勇气退出。这有时被称为 `The Rule\
  \ of Holes:`：当你身处其中时，停止挖掘。\n\n专业人士会避免对一个想法投入过深以至于无法放弃并转头离开。他们对其他想法保持开放心态，这样当他们遇到死路时，仍然有其他选择。\n\
  \n## 沼泽、泥沼、沼泽和其他混乱\n\n比死胡同更糟糕的是混乱。混乱会减慢你的速度，但不会停下你的脚步。混乱会阻碍你的进展，但你仍然可以通过纯粹的蛮力取得进展。混乱比死胡同更糟，因为你总是能看到前方的路，而且路看起来总是比回路短（但事实并非如此）。\n\
  \n我曾见过产品因为软件混乱而毁，公司因之而崩溃。我曾见过团队的生产力在短短几个月内从快速舞步变成了哀魂曲。没有什么能比混乱对软件团队的生产力产生更深远或更持久的负面影响了。没有。\n\
  \n问题在于，开始混乱就像走进死胡同一样，是不可避免的。经验和谨慎可以帮助你避免它们，但最终你会做出导致混乱的决定。\n\n这种混乱的演变是隐蔽的。你为一个简单的问题创建一个解决方案，并小心保持代码简单洁。随着问题范围和复杂性的增加，你扩展了该代码库，尽可能保持它的整洁。在某一点，你意识到自己在开始时做了一个错误的设计选择，而且你的代码在需求移动的方向上无法良好扩展。\n\
  \n这就是转折点！你仍然可以回去修复设计。但你也可以继续向前。回去看起来很昂贵，因为你必须重做现有代码，但回去 `never` 不会比现在更容易。如果你继续向前，你将把系统推入一个沼泽，可能永远无法逃脱。\n\
  \n专业人士对混乱的恐惧远胜对死胡同的恐惧。他们总是盯着开始无限制增长的混乱，并会投入所有必要的努力，尽早、尽可能地逃离它们。\n\n在沼泽中向前移动，当你 `know`\
  \ 那是沼泽时，是最糟糕的一种优先级倒置。通过向前移动，你是在对自己撒谎，对你的团队撒谎，对你的公司撒谎，对你的客户撒谎。你告诉他们一切都会好的，但事实上你正走向共同的末日。\n\
  \n### 结论\n\n软件专业人士在管理自己的时间和精力方面非常勤奋。他们理解优先级倒置的诱惑，并将其视为一种荣誉问题来战斗。他们通过对替代方案保持开放心态来保持自己的选择空间。他们永远不会对一个解决方案投入深到无法放弃它。他们总是留意正在增长的混乱，并在识别出它们时立即清理。没有比比一个软件开发人员团队在不断加深的泥泽中徒劳地挣扎更令人悲哀的景象了。\n\
  \n## 10. 估算\n\n![image](img/Image00139.jpg)\n\n估算是软件专业人士面临的最简单也最令人恐惧的活动之一。有如此多的价值取决于此。我们如此多的声誉依赖此。我们如此多的焦虑和失败都是由此造成的。它是在业务人员和开发者之间楔入的主要楔子。它是主宰这种关系的几乎所有不信任的源头。\n\
  \n1978 年，我是一个用汇编语言编写的 32K 嵌入式 Z-80 程序的首席开发人员。该程序被烧录在 32 块 1K × 8 的 EEprom 芯片上。这\
  \ 32 块芯片被插入三块电路板中，每块板上有 12 块芯片。\n\n我们在现场有数百台设备，安装在全美各地的电话交换局。每当我们修复一个漏洞或添加一个功能时，我们就必须派遣现场服务技术人员去每一个单元，让他们更换所有\
  \ 32 块芯片！\n\n这是一场噩梦。芯片和电路板是脆弱的。芯片上的引脚可能会弯曲断裂。电路板的持续弯曲可能会损坏焊点。破碎和错误的风险是巨大的。公司的成本太高了。\n\
  \n我的老板 Ken Finder 来到我这里，要求我修复这个问题。他建议使用函数指针。他想要的是一种不需要更改其他芯片即可进行的方法。\n\n解决方案非常简单。每个芯片都必须与其他芯片解耦。每个芯片都必须变成一个独立的编译单元，可以独立于其他所有芯片进行烧录。\n\
  \n于是我测量了应用程序中所有函数的大小，并写了一个简单的程序，将它们像拼图一样放入每块芯片中，留出大约 100 字节的空间供扩展。在每个芯片的开头放置放置了一个指向该芯片所有函数的表。在启动时，这些指针被移动到内存中。系统的所有代码都被更改，使得函数仅通过这些内存向量调用，而不是直接调用。\n\
  \n是的，你懂了。芯片是对象，带有虚表。所有函数都是多态部署的。而且，是的，这就是我在我知道什么是对象之前学到的某些面向对象设计原则。\n\n\n\n\n\n\
  聚对是在 Teradyne 办公室举办的，那里大部分是开放式实验室空间。大家都很早赶到，随后发生了一场特大暴雪，导致乐队和餐饮人员无法到达。幸运的是，酒充足。\n\
  \n我不记得那个晚的很多事了。而我记得的，我希望自己不记得。但我会和你们分享一个感人的时刻。\n\n我当时盘腿坐在地板上，和 Ken（我的老板，当时他 29 岁，而且并没有醉）一起为我向量化任务花了多久而哭泣。酒精释放了我对估算时间压抑的恐惧和不安全感。我不认为我的头当时靠在他的腿上，但我对这类细节记忆并不清晰。\n\
  \n我确实记得问过他是否在生我的气，是否认为我花了太长时间。尽管那个晚上记忆很模糊，但他的回答在随后的几十年里依然清晰。他说：“是的，我觉得确实花了你很长时间，但我看到你在努力工作，并取得了良好的进展。这是我们确实需要的。所以，不，我不生气。”\n\
  \n## 什么是估算？\n\n问题在于，我们看待估算的方式不同。业务部门喜欢将估算视为**承诺**。开发者则喜欢将估算视为**猜想**。这之间的区别是巨大的。\n\
  \n### 承诺\n\n承诺是你必须实现的事。如果你承诺在某个日期前完成某项工作，那么你就必须在那个日期之前完成它。如果这意味着你每天必须工作 12 小时，周末加班，放弃家庭假期，那么也只能如此。你已经做出了承诺，就必须履行它。\n\
  \n专业人士在确定自己能够实现目标之前，不会做出承诺。事实就是这么简单。如果你被要求承诺一些你不确定能做到的事情，那么你有义务拒绝。如果你被要求承诺一个你知道可以实现、但需要长时间工作、周末加班和放弃家庭假期的日期，那么选择权交在你手中；但你最好愿意付出的任何代价。\n\
  \n承诺关乎**确定性**。其他人会接受你的承诺并据此制定计划。对他们来说，对你的声誉来说，违背承诺的代价是巨大的。违反承诺是一种不诚实的行为，其程度仅比直白的谎言轻一点。\n\
  \n### 估算\n\n估算是一种猜想。它不包含任何承诺。不做出任何保证。未达到估算在任何方面都不算失耻。我们之所以进行估算，是因为我们不知道某事需要多久。\n\
  \n遗憾的是，大多数软件开发者都是糟糕的估算师。这并不是因为有什么估算的秘密技巧——并没有。我们之所以经常估算得这么差，是因为我们不理解估算的真正本质。\n\n\
  估算不是一个数字。估算是一个分布。考虑一下：\n\nMike：“你完成 Frazzle 任务的估算是多少？”\n\nPeter：“三天。”\n\nPeter 真的会在三天内完成吗？这有可能，但概率有多大？答案是：我们完全不知道。Peter\
  \ 是什么意思？Mike 又学到了什么？如果 Mike 三天后回来，发现 Peter 没有完成，他应该感到惊讶吗？他为什么要惊讶呢？Peter 并没有做出承诺。Peter\
  \ 没有告诉他三天相对于四天或五天的概率有多大。\n\n如果 Mike 询问 Peter 他三天估算的成功的概率有多大，会发生什么？\n\nMike：“你能在三天内完成的概率有多大？”\n\
  \nPeter：“很大。”\n\nMike：“你能给出一个具体的数字吗？”\n\nPeter：“百分之五十或六十。”\n\nMike：“所以你很有可能需要四天。”\n\
  \nPeter：“是的，事实上我可能需要五天或六天，尽管我怀疑是那样。”\n\nMike：“你怀疑程度有多少？”\n\nPeter：“噢，我不知道……我百分之九十五确定我会在六天过去之前完成。”\n\
  \nMike：“你的意思是可能需要七天？”\n\nPeter：“嗯，只有在一切都出问题的情况下才会这样。老天，如果一切都出问题了，我可能需要十天甚至十一天。但有这么多问题出错的可能性并不大。”\n\
  \n现在我们开始接近真相了。Peter 的估算是一个**概率分布**。在 Peter 的脑海里，他看到的完成几率如 图 10-1 所示。\n\n**图 10-1.\
  \ 概率分布**\n\n![image](img/Image00140.jpg)\n\n你可以看到为什么 Peter 给出的最初估算是三天。因为它是图表上最高的柱子。所以在\
  \ Peter 的脑海里，这是任务最可能的持续时间。但 Mike 的观点不同。他看着图表的右侧尾部，担心 Peter 可能真的需要十天才能完成。\n\nMike\
  \ 应该担心这个吗？当然应该！墨菲定律 ^(1) 将会作用在 Peter 身上，所以有些事情可能会出问题。\n\n### 隐含承诺\n\n现在 Mike 面临一个问题。他不确定\
  \ Peter 完成任务需要多久。为了将这种不确定性降到最低，他可能会要求 Peter 给出一个承诺。这是 Peter 有能力给出的东西。\n\nMike：“Peter，你能给我一个完成的日期吗？”\n\
  \nPeter：“不，正如我所说的，可能是三天，也许四天。”\n\nMike：“那我们可以说四天吗？”\n\nPeter：“不，可能是五天或六天。”\n\n到目前为止，大家都表现得体。Mike\
  \ 提出了承诺，而 Peter 谨慎地拒绝了。于是 Mike 尝试另一种策略：\n\nMike：“好吧，Peter，但你能尝试不超过六天吗？”\n\nMike\
  \ 的请求听起来很无害，Mike 显然没有恶意。但 Mike 到底在要求 Peter 做什么？“尝试”意味着什么？\n\n我们在第 2 章 过这个问题。“尝试”这个词是一个带有含义的词。如果\
  \ Peter 同意尝试，那么他就是在承诺六天。没有其他解读方式。同意尝试就是同意成功。\n\n专业人士在估算和承诺之间做出明确区分。只有在确定会成功时才做出承诺。他们会避免做出任何隐含承诺。他们尽可能清晰地沟通估算的概率分布，以便管理者制定合理的计划。\n\
  \n## PERT\n\n1957 年，计划评估与评审技术（PERT）为了支持美国海军的极极星潜艇项目而创建。PERT 的要素之一是计算方法。该方案提供了一种非常简单但有效的方法，将估算转换为适用于管理的概率分布。\n\
  \n当你估算一项任务时，提供三个数字。这被称为三变量分析：\n\n**O：乐观估算**。这个数字极其乐观。只有在一切绝对顺利的情况下，你才能如此迅速完成任务。事实上，为了让计算成立，这个数字发生的概率远小于\
  \ 1%。 ^(2) 在 Peter 的案例中，这将一天，如 图 10-1 所示。\n\n**N：名义估算**。这是成功概率最大的估算。如果你画一个柱状图，它将是图中最高的柱子，如\
  \ 图 10-1 所示。它是三天。\n\n\n\n\n\n- **P:** 悲观估计。这仍然是**极度悲观的**。它应该包含除了飓风、核战争、流浪黑洞和其他灾难之外的所有情况。再次，只有当这个数字的成功概率远低于\
  \ 1% 时，数学计算才有效。在彼特的情况下，这个数字已经超出了图表的右侧边界。所以是 12 天。\n\n根据这三个估计值，我们可以这样描述概率分布：\n\n\
  - ![image](img/Image00141.jpg)\n\n`μ` 是任务的预期持续时间。在彼特的情况下，它是 `(1+12+12)/6`，大约是 4.2\
  \ 天。对于大多数任务来说，这是一个相当偏悲观的数字，因为分布的右尾比左尾部更长。^(3)\n\n- ![image](img/Image00142.jpg)\n\
  \n`σ` 是任务概率分布的标准差 ^(4)。它是衡量任务不确定程度的指标。当这个数字很大时，不确定性也很大。对于彼特来说，这个数字是 `(12 – 1)/6`，大约是\
  \ 1.8 天。\n\n根据彼特 `4.2/1.8` 的估计，迈克理解这项任务可能在五天内完成，但也可能需要 6 天甚至 9 天才能完成。\n\n但迈克不仅仅是在管理一个任务。他正在管理一个包含许多任务的项目。彼特有三个任务必须按顺序进行。彼特对这些任务的估计如表\
  \ 10-1 所示。\n\n**表 10-1. 彼特的任务**\n\n![image](img/Image00143.jpg)\n\n那个“beta”任务是怎么是怎么的？看起来彼特对它很有信心，但可能会发生某些问题导致他严重偏离轨道。迈克应该如何解读这一点？迈克应该为彼特完成所有三个任务计划留多久？\n\
  \n事实证明，通过几次简单的计算，迈克可以合并彼特所有的任务，并为整组任务得出一个概率分布。数学原理非常简单：\n\n- ![image](img/Image00144.jpg)\n\
  \n对于任何任务序列，该序列的预期持续时间是序列中所有任务预期持续时间的简单加和。如果彼特有三个任务要完成，它们的估计值分别为 `4.2/1.8`、`3.5/2.2`\
  \ 和 `6.5/1.3`，那么彼特可能在约 14 天完成全部三个任务：`4.2 + 3.5 + 6.5`。\n\n- ![image](img/Image00145.jpg)\n\
  \n序列的标准差是所有任务标准差平方和平方根。因此，彼特三个任务的标准差大约是 3。\n\n```\n(1.8² + 2.2² + 1.3² )^(1/2) =\n\
  (3.24 + 2.48 + 1.69)^(1/2) =\n9.77^(1/2) = ~ 3.13\n```\n\n这告诉迈克，彼特的任务可能需要 14 天，但也很有可能需要\
  \ 17 天（`1σ`），甚至可能需要 20 天（`2σ`）。时间可能更长，但那不太可能。\n\n回看估计表。你能感受到在五天内完成所有三个任务的压力吗？毕竟，最佳情况的估计值是\
  \ 1、1 和 3。即使是名义估计加起来也只有 10 天。我们是如何达到 14 天，并可能达到 17 或 20 天的？答案是，这些任务中的不确定性以一种叠加的方式为计划增加了**现实性**。\n\
  \n如果你是一个拥有多年经验的程序员，你很可能见过那些被估计过于乐观的项目，它们耗时比预期的长了三到五倍。刚刚展示的简单 PERT 方案是帮助防止乐观预期的一种合理方法。尽管面临着`try`\
  \ 快速的压力，软件专业人士非常谨慎地设定合理的预期。\n\n### 估计任务\n\n迈克和彼特犯了一个严重的错误。迈克在问彼特完成他的任务需要多长时间。彼特给出了诚实的三变量答案，但他的队友的意见呢？他们会有不同的想法吗？\n\
  \n你拥有的最重要的估计资源是你周围的人。他们能看到你看不到的东西。他们可以帮助你更准确地估计任务，而不是你自己去估计。\n\n#### 宽带德尔法\n\n20\
  \ 世纪 70 年代，Barry Boehm 向我们介绍了一种名为“宽带德尔法”（wideband delphi）的估计技术。^(5)多年年来有很多变体。有些正式，有些非正式；但它们都有共同点：共识。\n\
  \n该策略很简单。团队成员聚集，讨论任务，估计任务，并反复讨论和估计，直到达成一致。\n\nBoehm 概述的原始方法涉及多次会议和文档，对于我的口味来说，仪式感和开销太大了。我更倾向于简单且低开销的方法，如下：\n\
  \n##### 飞指\n\n大家围坐在桌子旁。逐一个讨论任务。团队成员挑选一张符合他们估计值的卡片，并将其朝外举起，让其他人看不到卡片的值。然后主持人让大家出牌。\n\
  \n剩下的就和`飞指`一样。如果达成一致，则接受该估计值。否则收回卡牌，玩家继续讨论该任务。\n\n#### 计划扑克\n\n2002 年，James Grenning\
  \ 写了一篇非常有趣的论文 ^(6) 描述“计划扑克”（Planning Poker）。这种宽带德尔法的变体非常受欢迎，以至于几家公司已将其作为营销赠品。^(7)甚至有一个名为\
  \ [planningpoker.com](http://planningpoker.com) 的网站，你可以用分布式团队进行计划扑克。\n\n##### Affinity\
  \ 估计\n\n几年前，Lowell Lindstrom 向我展示了一种特别独特的变体。所有任务写在卡片上，不显示任何估计值。估计团队站在桌子旁或墙边，卡片随机散开。团队成员不说话，只是开始对卡片进行排序。耗时更长的任务向右移动。较短的任务向左移动。\n\
  \n\n\n\n\n任何团队成员都可以在任何时间移动任何卡片，即使它已经被其他成员移动过。任何移动超过 η 次的卡片都将被放在一起进行讨论。\n\n最终，无声排序会结束，讨论可以开始。关于卡片排序顺序的分歧将得到探讨。可能会进行一些快速的设计会议或绘制一些快速的手绘线图，以帮助达成共识。\n\
  \n下一步是在代表桶大小的卡片之间画线。这些桶可以以天、周或“点”为单位。使用斐波那契数列 `(1, 2, 3, 5, 8)` 的五个桶是传统做法。\n\n###\
  \ 三值估算法\n\n这些宽带德菲（wideband delphi）技术适用于为一个任务选择单一的名义估值。但正如我们之前提到的，大多数时候我们需要三个估值，以便创建一个概率分布。使用任何宽带德菲的变体都可以非常快速地生成每个任务的乐观值和悲观值。例如，如果你正在使用计划扑克（planning\
  \ poker），只需要求团队举起他们悲观估值的卡片，然后取最高值。对乐观估值也采取同样的操作并取最低值。\n\n### 大数定律\n\n估值充满了误差。这就是为什么它们被称为“估值”的原因。管理误差的方法之一是利用`大数定律`。该法律的影响是，如果你将一个大任务分解成许多小任务并独立地进行估算，那么小任务估值的总和将比大任务的单一估值更准确。准确性提高的原因是小任务中的误差往往会相互抵消。\n\
  \n坦率地说，这是很乐观的。估值误差往往倾向于低估而非高估，因此抵消过程并不完美。尽管如此，将大任务拆分为小任务并独立地估算小任务仍然是一种很好的技术。某些误差确实会相互抵消，而拆分任务是更好地理解任务并发现意外情况的好方法。\n\
  \n### 结论\n\n专业的软件开发人员知道如何为业务提供实用的估值，以便业务部门将其用于规划。他们不会做出无法做到的承诺，也不会做出不确定能够完成的承诺。\n\
  \n当专业人士做出承诺时，他们会提供`hard`性数字，然后实现这些数字。然而，在大多数情况下，专业人士不会做出此类承诺。相反，他们提供概率估值，描述预期的完成时间和可能的方差。\n\
  \n专业开发人员与团队其他成员合作，对提交给管理层的估值达成共识。\n\n本章描述的技术是专业开发人员创建实用估值的某些不同方式的`示例`。这些并不是唯一的技巧，也不一定是最好的。它们只是我发现对我有效的技术。\n\
  \n### 参考文献\n\n**`[McConnell2006]`**: Steve McConnell, `Software Estimation: Demystifying\
  \ the Black Art`, Redmond, WA: Microsoft Press, 2006.\n\n**`[Boehm81]`**: Barry\
  \ W. Boehm, `Software Engineering Economics`, Upper Saddle River, NJ: Prentice Hall,\
  \ 1981.\n\n**`[Grenning2002]`**: James Grenning, “Planning Poker or How to Avoid\
  \ Analysis Paralysis while Release Planning,” April 2002, `http://renaissancesoftware.net/papers/14-papers/44-planing-poker.html`\n\
  \n## 11. 压力\n\n![image](img/Image00146.jpg)\n\n想象你正在经历一种离体体验，观察自己躺在手术台上，一位医生正在对你进行开心脏手术。那位医生正试图救你的命，但时间有限，所以他必须在截止日期前完成——一个`真实`的截止日期。\n\
  \n你希望那位医生如何表现？你希望他看起来冷静沉着吗？你希望他向支持人员下达清晰精确的指令吗？你希望他遵循自己的训练并遵守纪律吗？\n\n还是你希望他汗流浃背、咒骂不断？你希望他摔掷器械？你希望他指责管理层预期不切实际并不断抱怨时间不够？你希望他表现得像个专业人士，还是像个典型的开发者？\n\
  \n专业开发人员在压力下冷静且果断。随着压力的增长，他们遵循自己的训练和纪律，因为他们知道这是满足迫迫他们的截止日期和承诺的最佳方式。\n\n1988 年，我在\
  \ Clear Communications 工作。那是一家从未真正启动过的初创公司。我们耗尽了第一轮融资，不得不寻求第二轮，然后是第三轮。\n\n最初的产品愿景听起来不错，但产品架构似乎永远无法落地。起初产品既有软件也有硬件。然后它变成了纯软件。软件平台从\
  \ PC 变为 Sparcstations。客户群从高端变为低端。最终，随着公司试图寻找能产生收入的东西，甚至产品的原始意图也偏离了。在我在那里工作的近四年时间里，我认为公司没有赚过一分钱收入。\n\
  \n不用说，我们这些软件开发人员面临着巨大的压力。有许多非常长的夜晚，甚至在办公室的终端前度过更长的周末。用`C` 编写的函数长达`3,000 行`。有大吼大叫和互相辱骂的争吵。有阴谋和诡计。有拳头砸墙，有愤怒地向白板扔出的笔，有用铅笔尖在墙上刻下令人讨厌的同事的漫画形象，还有取之不尽的愤怒和压力。\n\
  \n截止日期是由事件驱动的。功能必须为贸易展会或客户演示准备就绪。客户要求的任何东西，无论多么愚蠢，我们都会在下一次演示前准备好。时间总是太短。工作总是落后。进度总是让人不堪应交。\n\
  \n如果你每周工作 80 小时，你可能是一个英雄。如果你为了客户演示临时凑出了一些东西，你可能是一个英雄。如果你做得足够多，你就能升职。如果你没做到，你可能会被解雇。那是一家初创公司——一切都是关于“汗水股权”。在\
  \ 1988 年，我带着近 20 年的经验，我认同了这一切。\n\n我是开发经理，告诉为我工作的程序员他们必须工作得更多、更快。我是那些工作 80 小时的人之一，在凌晨\
  \ 2 点编写 3,000 行的`C` 函数，而孩子们在家里睡觉，家里没有父亲。我是那个扔笔和大叫的人。如果别人表现不好，我就把他们解雇。这太糟糕了。我很糟糕。\n\
  \n直到有一天，我妻子强迫对着镜子好好看一眼自己。我不喜欢我看到的那个。她说我和她相处时并不友好。我必须同意。但我不喜欢那样，于是愤怒地冲出门，开始无目的地走着。我走了大约三十分钟，在大步走时愤愤不已；然后开始下雨了。\n\
  \n我脑子里的某个地方“咔哒”一下。我开始大笑。我笑自己的愚蠢。我笑自己的压力。我笑镜子里的那，那个可怜的笨蛋，为了什么而让自己和别人的生活变得如此痛苦？\n\n\
  那一天一切都改变了。我停止了疯狂加班。我停止了高压的生活方式。我停止了扔笔和编写 3,000 行的`C` 函数。我决定我要通过良好工作来享受我的职业生涯，而不是通过愚蠢地工作。\n\
  \n我尽可能专业地离开了那份工作，成为了一名顾问。从那天起，我再也没有称呼过任何人为“老板”。\n\n\n\n\n\n在压力下保持冷静的最佳方法是避免那些`导致`压力的情况。这种回避可能无法完全消除压力，但对于最小化和缩短高压时期很有帮助。\n\
  \n## 承诺\n\n正如我们在第 10 章中发现的，避免承诺我们无法确定能做到的截止日期是非常重要的。业务部门总是想要这些承诺，因为他们想要消除风险。我们必须做的是确保风险被量化并提交给业务部门，以便他们适当管理。接受不现实的承诺会破坏这一目标，并且对业务和我们自己都不负责。\n\
  \n有时承诺是别人替我们做的。有时我们发现业务部门在没有咨询我们的情况下向客户做出了承诺。当这种情况发生时，我们有义务帮助业务部门找到履行这些承诺的方法。然而，我们`并没有`义务`接受`这些承诺。\n\
  \n这种区别非常重要。专业人士总是会帮助业务部门找到实现目标的方法。但专业人士并不一定接受业务部门为他们做的承诺。到底，如果我们找不到任何满足业务部门所承诺的方法，那么做出承诺的人必须承担责任。\n\
  \n这说起来容易。但当你的业务遭遇失败，你的薪水因为未能履行承诺而延迟时，很难不感到压力。但如果你一直表现得专业，至少在寻找新工作时可以抬头挺胸地。\n\n##\
  \ 保持整洁\n\n快速进展并让截止日期远不可及的方法是保持整洁。专业人士不会屈从于为了快速而制造混乱的诱惑。专业人士意识到“快速且肮脏”是一个自相矛盾的词。肮脏总是意味着慢！\n\
  \n我们可以通过保持系统、代码和设计尽可能整洁来避免压力。这并不意味着我们要花费无尽的时间打磨代码。它仅仅意味着我们不容忍混乱。我们知道混乱会拖慢我们的速度，导致我们错过日期并违背承诺。因此，我们尽所能做好工作，并保持输出尽可能整洁。\n\
  \n## 危机纪律\n\n通过在危机中观察自己，你就知道自己相信什么。如果你在危机中遵循了自己的纪律，那么你真正相信这些纪律。反之，如果你在危机中改变了行为，那么你并不真正相信你的日常行为。\n\
  \n如果你在非危机时期遵循`Test Driven Development`（测试驱动开发）纪律，但在危机期间放弃了它，那么你并不真的信任 `TDD` 是有用的。如果你在正常时间内保持代码整洁，但在危机中制造混乱，那么你并不相信混乱会拖慢你的速度。如果你在危机中进行配对编程但平时不配对，那么你就认为配对比不配对更高效。\n\
  \n选择你觉得在危机中可以从容遵循的纪律。“然后一直遵循它们`。遵循这些纪律是避免陷入危机的最佳方法。\n\n在关键时刻不要改变你的行为。如果你的纪律是工作的最佳方式，那么即使在危机的深渊也应该遵循它们。\n\
  \n## 处理压力\n\n预判、缓解和消除压力都是好的，但有时尽管你付出了最大的意愿和预防，压力还是会到来。有时项目的耗时就是比任何人想象的都要长。有时初始设计本身就是`错误`的。\n\
  \n### 不要恐慌\n\n管理你的压力。当压力巨大时，找另一个处于压力之下的人。当压力巨大时，找另一个处于压力之下的人。\n\n### 沟通\n\n当你看到其他人处于压力之下，提议与他们配对编程。帮助他们跳出`困境`。\n\
  \n### 依靠你的纪律\n\n如果你遵循 `TDD`，就写得更多。这是唯一可行的方法。如果你遵循 `TDD`，就写得更多。\n\n### 寻求帮助\n\n当你看到其他人处于压力之下，提议与他们配对编程。帮助他们跳出他们所处的`困境`。\n\
  \n### 结论\n\n处理压力的技巧是在可以避免时避免它，在无法避免时坚持过去。你通过管理承诺、遵循纪律和保持整洁来避免压力。\n\n## 12. 协作\n\n\
  ![image](img/Image0147.jpg)\n\n大多数软件是由团队创建的。当团队成员协作时，团队最有效。在团队中做一个独行侠或隐世士者是不专业的。\n\
  \n1974 年我 22 岁。我那出色的妻子 Ann Marie 结婚才仅仅六个月。我的第一个孩子 Angela 出生还要一年时间。当时，我在 Teradyne\
  \ 的一个名为 Chicago Laser 的部门工作。\n\n坐在我旁边的是我的高中同学 Tim Conrad。Tim 和我在那段时光里创造过许多奇迹。我们在他的地下室里一起建造电脑。在我的地下室里建造了雅各之梯。我们互相教对方如何编写\
  \ `PDP-8s`，以及如何将集成电路和晶体管接成可以运行的计算器。\n\n我们是程序员，负责的系统使用激光以极高的精度来修剪电阻和电容等电子元件。例如，我们曾修剪过第一只数字手表——`Motorola\
  \ Pulsar` 的晶体。\n\n我们编写的电脑是 `M365`，那是 Teradyne 对 `PDP-8` 的克隆机。我们用 `assembly language`（汇编语言）编写，源代码保存在`磁带盒`上。虽然我们可以在屏幕上编辑，但过程非常复杂，所以我们使用打印列表来进行大部分代码阅读和初步编辑。\n\
  \n初始程序写起来相当简单。它只是读取源磁带，解析汇编器语法，创建符号表，并向条目添加引用。它运行得很好，但速度慢得惊人。处理我们的主运行程序（`MOP`）需要超过一小时。\n\
  \n\n\n\n之所以速度如此缓慢，是因为我们将不断增长的符号表存储在单个内存缓冲区中。每当我们发现一个新的引用时，就会将其插入缓冲区，并将缓冲区的其余部分向下移动几个字节以腾出空间。\n\
  \nTim 和我并不是数据结构和算法方面的专家。我们从未听说过哈希表或二分查找。我们完全不知道如何让算法变快。我们只知道正在做的事情太慢了。\n\n于是我们尝试了一又一种方法。我们尝试过将引用放入链表中。我们尝试在数组中留出间隙，只在间隙填满时才扩展缓冲区。我们尝试过创建间隙的链表。我们尝试了各种疯狂的想法。\n\
  \n我们站在办公室的白板前，绘制数据结构的图表，并进行计算以预测性能。我们每天去办公室时都带着一个新的新想法。我们像疯子一样通合作。\n\n我们尝试的某些方法提高了性能，有些却让它变慢了。这让人抓狂。这是我第一次发现优化软件有多么困难，以及这个过程有多么违反直觉。\n\
  \n最后，我们将时间缩短到了 15 分钟以内，这已经非常接近读取原始磁带所需的时间了。所以我们很满意。\n\n### 程序员 vs 人类\n\n我们成为程序员并不是因为喜欢与人打交道。通常情况下，我们认为人际关系是复杂且不可预测的。我们喜欢我们所编写的机器那种整洁且可预测的行为。当我们独自呆在房间里几个小时，深度专注于某个真正有趣的问题时，我们才是最快乐的。\n\
  \n好了，这是一个极大的以偏概全，有很多例外。有很多程序员擅长与人打交道并享受这种挑战。但群体的平均水平仍然倾向于我所说的方向。我们程序员享受 `focus`\
  \ 时那种轻微的感官剥夺和像茧般的沉浸感。\n\n### 程序员 vs 雇主\n\n在 70 年代和 80 年代在 Teradyne 担任程序员期间，我学会了非常擅长调试。我热爱这种挑战，会充满活力和热情地投入到问题中。没有哪个\
  \ bug 能在我面前躲藏多久！\n\n当我解决一个 bug 时，就像赢得了一场胜利，或者杀掉了烟雾怪兽（Jabberwock）！我会去找我的老板 Ken Finder，手里拿着沃尔波剑（Vorpal\
  \ blade），充满激情地向他描述这个 bug 是多么有趣。有一天，Ken 终于在挫败中爆发了：“bug 不有趣。bug 只需要被修复！”\n\n我那天学到了一些东西。对我们所做的事情充满热情是好的。但关注付钱给你的人所的目标也是好的。\n\
  \n职业程序员的首要责任是满足其雇主的需求。这意味着要与你的经理、业务分析师、测试人员和其他团队成员合作，以深度理解业务目标。这并不意味着你必须变成一个业务专家。它确实意味着你需要理解你为什么要写这些代码，以及雇佣你的业务如何从中受益。\n\
  \n职业程序员能做的最坏的事情，就是陶醉地埋首在技术的坟墓里，而目睁睁地看着业务周围崩塌。你的工作是让业务维持运转！\n\n所以，职业程序员会花时间理解业务。他们与用户交流他们正在使用的软件。他们与销售和营销人员交流他们的问题和困难。他们与经理交流以理解团队的短期和长期目标。\n\
  \n简而言之，他们关注自己正在航行的那艘船。\n\n我唯一一次从编程工作中被解雇是在 1976 年。当时我在 Outboard Marine Corp 工作。我正帮助编写一个工厂自动化系统，该系统使用\
  \ `IBM System/7s` 来监控车间地面上的几十台铝压铸机。\n\n从技术上讲，这是一份具有挑战性且回报丰厚的工作。`System/7` 的架构非常迷人，工厂自动化系统本身也很有趣。\n\
  \n我们还有一个很好的团队。团队领导 John 胜任且有动力。我的两个编程队友很愉快且乐于助人。我们有一个专门用于项目的实验室，我们都在那个实验室工作。业务伙伴非常投入，并和我们待在实验室里。我们的经理\
  \ Ralph 干练、专注且掌控全局。\n\n一切本应该是很完美的。问题出在我身上。我对项目、对技术足够热情，但在 24 岁这个大年纪，我简单根本无法强迫自己去关心业务或其内部政治结构。\n\
  \n我的第一个错误出现在第一天。我出现时没有打领带。我在面试时戴过领带，我也看到其他人都戴领带，但我没能把这种联系联系起来。所以第一天，Ralph 走到我面前，直白地说：“我们这里得带领带。”\n\
  \n我无法告诉你我对此有多么愤恨。它在深层上困扰着我。我每天都戴领带，但我恨它。但为什么呢？我知道自己身处何地。我知道他们采纳的规范。我为什么会如此心不快？因为我是一个自私、自恋的小混蛋。\n\
  \n我就是无法准时上班。而且我觉得这并不重要。毕竟，我正在做“一份不错的工作”。事实也如此，我在写程序方面做得非常好。我轻而易举成为团队中技术最强的程序员。我写代码比比别人更快、更好。我诊断和解决问题也更快。我知道我有价值。所以时间和日期对我来说并没重要。\n\
  \n解雇我的决定是在某天我没能准时到达时做出的。\n\n\n\n\n程序员在与其他程序员密切合作时经常遇到困难。这导致了一些非常糟糕的问题。\n\n## 代码所有权（Owned\
  \ Code）\n\n功能不全团队最糟糕的症状之一，就是每个程序员都在自己的*代码*周围筑起一道墙，并拒绝让其他程序员碰。我去过一些地方，那程序员甚至不允许其他程序员*看到*他们的代码。这简直是灾难的根源。\n\
  \n我曾为一家生产高端打印机的公司提供过咨询。这些机器有许多不同的组件，如进纸器、打印机、堆叠器、订书机、切割机等。业务对这些设备的重视程度各不相同。进纸器比堆叠器重要，而没有什么比打印机更重要了。\n\
  \n每个程序员都负责*自己的设备*。一个人负责为进纸器写代码，另一个人负责为订书机写代码。他们每个人都把技术留给自己，防止任何其他人触碰他们的代码。这些程序员所拥有的政治影响力与业务对该设备的重视程度直接相关。负责打印机的程序员是不可撼动的。\n\
  \n这对于技术来说是一场灾难。作为顾问，我能够看到代码中存在大量的重复，而且模块之间的接口完全是扭曲的。无论我如何争论，都无法说服这些程序员（或业务部门）改变做法。毕竟，他们的薪资评估与他们维护的设备的重要性挂钩。\n\
  \n## 集体所有权（Collective Ownership）\n\n打破所有代码所有权的墙让团队拥有所有代码要好得多。我更倾向于这样的团队：任何团队成员都可以检出任何模块并进行他们认为适当的任何更改。我希望是*团队*拥有代码，而不是个人。\n\
  \n专业的开发者不会阻止他人参与代码中工作。他们不在代码周围筑起所有权的墙。相反，他们尽可能在系统的各个部分共同工作。他们通过在系统的其他部分共同工作来相互学习。\n\
  \n## 结对编程（Pairing）\n\n很多程序员不喜欢结对编程的想法。我觉得这很奇怪，因为大多数程序员在紧急情况下*会结对*。为什么呢？因为这显然是解决问题最高效的方法。这又回到了那句老格言：集思广于单三斗。但如果结对是紧急情况下解决问题最高效的方法，为什么它不是通常解决问题最高效的方法呢？\n\
  \n我不会向你引用一些研究报告，尽管确实有一些可以引用的。我不会给你任何轶事，尽管我有很多可以讲的。我甚至不会告诉你应该多大程度地结对。我只想告诉你，*专业人士会结对*。为什么？因为至少对某些问题来说，这是解决它们最高效的方法。但并不是唯一的理由。\n\
  \n专业人士结对还因为这是他们相互分享知识的最好方式。专业人士不会制造知识孤岛。相反，他们通过结对来学习系统和业务的不同部分。他们意识到，虽然所有团队成员都有自己的职责，但在紧要关，所有团队成员也应该能够胜任另一个职位。\n\
  \n专业人士结对是因为这是审查代码的最佳方式。任何系统都不应该包含未经过其他程序员审查的代码。进行代码审查的方法有很多，但其中大多数都效率低得可怕。审查代码最高效、最有效的方法是在编写时进行协作。\n\
  \n## 小脑（Cerebellums）\n\n2000 年的一个早上，正值互联网泡沫的高峰，我乘火车进入芝加哥。当我从火车走上站台时，一个悬挂在出口门上方的巨大广告牌扑面而来。那是某知名软件公司招募程序员的广告。招牌上写着：*来与顶尖高手比比脑吧*。\n\
  \n我立刻被这种广告牌的极度愚蠢震惊了。这些可怜且无知的广告从业者正试图吸引一群高技术性、高智力且知识渊博的程序员。这类人是特别受不了愚蠢的。广告商们试图勾起与其他高智力人士分享知识的意象。遗憾的是，他们提到的是大脑的一个部分——小脑，那里负责精细的肌肉控制，而不是智力。因此，他们试图吸引的这些人会对这种愚蠢的错误嗤之以鼻。\n\
  \n但那个广告牌还有另一点引起我的兴趣。它让我想了一群试图比比脑的人。由于小脑在大脑的后部，比比脑的最好方式是背对背。我想象了一群坐在隔间里的程序员，他们背对背坐在角落里，戴着耳机盯着屏幕。*那*才是比比脑。那也不是一个团队。\n\
  \n专业人士会*在一起工作*。当你坐在角落里戴着耳机时，是无法一起工作的。因此，我希望你们围坐在桌子旁*面对*对方。我希望你们能闻到彼此的恐惧。我希望你们能听到某人沮丧的咕咕。我希望有偶然的交流，包括口头和肢体语言。我希望你们作为一个整体进行交流。\n\
  \n也许你认为自己独自工作时表现得更好。这可能是事实，但并不意味着当你独自工作时，*团队*会表现得更好。而且，事实上，你独自工作时并不可能真的表现得更好。\n\n\
  有些时候，独自工作是正确的。有时，你只需要对一个问题进行长时间的思考。有时，任务如此微小，让另一个人和你一起工作是一种浪费。但总的来说，与他人紧密协作并与他们结对很大比例的工作是最好的。\n\
  \n### 结论\n\n也许我们进入编程并不是为了和人打交道。那真是倒霉。*编程完全关乎与人打交道*。我们需要与业务合作，也需要相互合作。\n\n13. 团队与项目（Teams\
  \ and Projects）\n\n![image](img/Image00148.jpg)\n\n如果你有很多小项目要完成，你该如何将这些项目分配给程序员？如果你有一个非常大的项目要完成呢？\n\
  \n### 如何融合？（Does It Blend?）\n\n\n\n\n要求一个程序员将一半的时间投入项目 A，另一半的时间投入项目 B，这完全没有意义，尤其是当这两个项目拥有两个不同的项目经理、不同的业务分析师、不同的程序员以及不同的测试员时。到底在鬼地方你怎么能把这样一个怪物称为团队？那不是团队，那是一滩像从\
  \ Waring 搅拌机里搅出来的东西。\n\n## 凝聚良好的团队 (The Gelled Team)\n\n团队的形成需要时间。团队成员开始建立关系。他们学习如何相互协作。他们了解彼此的怪癖、优点和缺点。最终，团队开始变得\
  \ `gel`（凝聚）。\n\n凝聚良好的团队拥拥着某种真正魔力的力量。他们能够创造奇迹。他们彼此预判、互相补、互相支持，并要求彼此做到最好的水平。他们能让事情运转。\n\
  \n一个凝聚良好的团队通常由十左右的人组成。可以多达二十人，也可以只有三人，但最佳人数可能是十二人左右。团队应该由程序员、测试员和分析师组成，并且应该有一个项目经理。\n\
  \n程序员与测试员及分析师的比例可以很大，但 2:1 是一个很不错的数字。因此，一个凝聚良好的十二人团队可能有七个程序员、两名测试员、两名分析师和一个项目经理。\n\
  \n分析师开发需求并为之编写自动化验收测试。测试员也编写自动化验收测试。两者的区别在于视角。他们都是在编写需求。但分析师关注业务价值；测试员关注正确性。分析师编写“正向路径”（happy\
  \ path）用例；测试员则担心可能出现问题的地方，并编写失败和边界用例。\n\n项目经理跟踪团队的进度，并确保团队理解进度安排和优先级。\n\n团队成员之一可能兼任教练（coach）或大师（master）的角色，负责维护团队的流程和纪律。当团队因为进度的压力而倾向于偏离流程时，他们充当团队良知的角色。\n\
  \n### 发酵 (Fermentation)\n\n这样一个团队需要时间来消除分歧、达成共识并真正凝聚在一起。这可能需要六个月时间，甚至可能需要一年。但一旦发生，它就是魔力。一个凝聚良好的团队会共同计划、共同解决问题、共同面对问题，并\
  \ `get things done`（搞定事情）。\n\n一旦这种情况发生，仅仅因为项目结束就将其拆散简直是荒谬的。最好的做法是保持该团队在一起，不断为他们提供项目。\n\
  \n### 是团队还是项目先出现？\n\n银行和保险公司试图围绕项目组建团队。这是一种愚蠢的方法。这些团队根本无法凝聚。个人在项目上的停留时间很短，而且只占他们时间的一比例，因此永远无法学会如何相处。\n\
  \n专业的职业发展组织将项目分配给现有的凝聚良好的团队，而不是围绕项目组建团队。凝聚良好的团队可以同时接受许多项目，并根据他们自己的意见、技能和能力来分配工作。凝聚良好的团队会完成项目。\n\
  \n## 但你如何管理这些？\n\n团队是有速度的（velocity）。团队的速度简单来说就是他们在固定时间内可以完成的工作量。有些团队以每周 `points`（点数）来衡量速度，点是复杂性的单位。他们将正在做的每个项目的特性拆解，并用点数进行估算。然后他们测量每周能完成多少点。\n\
  \n速度是一个统计量。一个团队某周可能完成 38 点，下周完成 42 点，再一周完成 25 点。随着时间的推移，这些会达到平均值。\n\n管理层可以为给团队的每个项目设定目标。例如，如果一个团队的平均速度是\
  \ 50，他们有三个正在处理的项目，那么管理层可以要求团队将精力分成 15、15 和 20。\n\n除了有一个凝聚良好的团队在处理你的项目外，这种方案的优点在于在紧急情况下，业务部门可以说：“项目\
  \ B 陷入危机；在接三周内将 100% 的精力投入到该项目。”\n\n对于那些从搅拌机里出来的团队，要如此快速重新分配优先级几乎是不可能的，但同时处理两个或三个项目的凝聚良好团队可以瞬间转弯。\n\
  \n## 项目所有者的困境 (The Project Owner Dilemma)\n\n对我提倡的方法的反对意见之一是项目所有者失去了某些安全感和权力。拥有专属团队的项目所有可以依靠该团队的努力。他们知道，由于组建和解散团队是一项昂贵的操作，业务部门不会因为短期原因带走团队。\n\
  \n另一方面，如果项目是交给凝聚良好的团队，而且如果这些团队同时承担多个项目，那么业务部门就可以随心所欲改变优先级。这会让项目所有者对未来感到不安全。项目所有者依赖的资源可能会突然被夺走。\n\
  \n坦率地说，我更喜欢后者。业务部门不应该被组建和解散团队的人为难度所束缚。如果业务部门决定一个项目的优先级高于另一个，它应该能够快速重新分配资源。为自己的项目争取是项目所有者的责任。\n\
  \n### 结论\n\n团队比项目更难建立。因此，形成持久性的团队是更好的，让他们从一个项目移动到下一个项目，并能够同时处理多个项目。组建团队的目标是给该团队足够的时间来凝聚，然后保持在一起，作为完成多个项目的引擎。\n\
  \n### 参考文献\n\n**`[RCM2003]`**: Robert C. Martin, *Agile Software Development: Principles,\
  \ Patterns, and Practices*, Upper Saddle River, NJ: Prentice Hall, 2003.\n\n**`[COHN2006]`**:\
  \ Mike Cohn, *Agile Estimating and Planning*, Upper Saddle River, NJ: Prentice Hall,\
  \ 2006.\n\n## 14. 导师、学徒与匠精神 (Mentoring, Apprenticeship, and Craftsmanship)\n\n![image](img/Image0149.jpg)\n\
  \n我对毕业生的质量一直感到失望。并不是这些毕业生不聪明或没才华，而是他们没有被教过编程到底是什么。\n\n### 失败的程度 (Degrees of Failure)\n\
  \n我曾面试过一个在某著名大学读计算机科学硕士的女性。她正在申请夏季实习生职位。我让她写一些代码，她说：“我并不怎么写代码。”\n\n*请重新阅读上一段，然后跳过这一段到下一段。*\n\
  \n我问她为了获得学位上过哪些编程课程。她说她没有上过。\n\n*也许你想从章节的开头开始看，以确保你没有掉进某个平行宇宙，或者刚从一个噩梦中醒来。*\n\n\
  此时，你可能会问自己，一个计算机科学硕士的学生是如何避开编程课程的。我当时也这么想，现在也是如此。\n\n\n\n\n还有另一个问题。即使是最好的计算机科学学位课程，通常也没有为年轻毕业生在工业界将遇到的情况做好准备。这并不是对学位课程的否定，而是几乎所有学科的常态。你在学校学到的和你在工作中发现的往往是两种完全不同的东西。\n\
  \n## 导师指导\n\n我们是如何学习编程的？让我给你讲我接受导师指导的故事。\n\n### Digi-Comp I，我的第一台电脑\n\n1964 年，我妈妈在我十二岁生日时送给我一台小型的塑料电脑。它被称为`Digi-Comp\
  \ I`。它有三个塑料触发器和六个塑料`and`-门。你可以将触发器的输出端连接到`and`-门的输入端。你也可以将`and`-门的输出端连接到触发器的输入端。简而言之，这允许你创建一个三位数的有限状态机。\n\
  \n这套套件带有一份说明书，上面提供了几个可以运行的程序。你通过将小管子（苏打吸管段）插在触发器上突出的小钉上为机器编程。手册明确告诉你在每根管子放在哪里，但并没有告诉这些管子`起什么作用`。我觉得这非常令人沮丧！\n\
  \n我盯着机器看了几个小时，确定了它在最底层是如何运作的；但我无论如何，就是无法弄如何让它执行我想让做的事。手册的最后一页告诉我，寄出一美元，他们就会寄回一份教我如何为机器编程的手册。\n\
  \n我寄出了那美元，带着十二岁孩子的不耐等待着。说明书到达的那天，我把它吞噬了。那是一本关于布尔代数的简单论文，涵盖了布尔方程的基本因式分解、结合律和分配律，以及德·摩根定理。手册展示了如何将一个问题转化为一系列布尔方程。它还描述了如何简化这些方程，以适应\
  \ 6 个`and`-门的容量限制。\n\n我构思了我的第一个程序。我仍然记得它的名字：`Patternson 先生的计算机门电路`。我写下了方程，对它们进行了简化，并将它们映射到机器的管子和钉子上。`它竟然运行了！`\n\
  \n刚才写下这三个字让我感到脊背发凉。同样的寒意在近半世纪年前流过那个十二岁孩子的身上。我入迷了。我的生活从此再也无法回到过去。\n\n你记得你第一个程序运行成功的那个时刻吗？它改变了你的生活，还是让你走上了一条你无法回头的道路？\n\
  \n我并不是我自己弄懂一切的。我得到了`导师指导`。一些非常善良且老练的人（我对他们感激不尽）花时间写了一本让十二岁孩子也能读懂的布尔代数论文。他们将数学理论与这个小塑料电脑的实际操作联系起来，赋予了我让那台电脑执行我想让做的事的力量。\n\
  \n我刚刚取下了那份命运说明书的副本。我把它保在一个拉链袋里。尽管如此，岁月留下了痕迹，让纸张变得发黄变脆。然而，那些文字的力量依然闪闪发光。他们对布尔代数的优雅描述占据了三个稀疏的页面。对每个原始程序方程的逐步说明仍然具有吸引力。这是一部大师之作。这是一部改变了至少一个年轻人的生活的著作。然而，我可能永远不知道那些作者的名字。\n\
  \n### 高中的里的 ECP-18\n\n十五岁时，作为高中的一名大新生，我喜欢呆在数学系。（真不可思议！）有一天，他们推进来一台像台锯一样大的机器。那是一台为高中设计的教育计算机，被称为`ECP-18`。我们学校将获得为期两周的演示。\n\
  \n我站在后面，听老师和技术人员交谈。这台机器有一个 15 位字（`什么是字？）和一个 1024 字的鼓形内存。（那时我知道什么是鼓形内存，但仅限于概念上。）\n\
  \n当他们开启电源时，机器发出类似于喷气式飞机起飞的嗡嗡声。我猜那是鼓轮旋转起来的声音。一旦达到速度，它就安静了。\n\n这台机器非常`漂亮`。它本质上是一张办公桌，顶部凸出一个精妙的控制面板，就像战舰的指挥桥。控制面板上装饰着一排排灯，这些灯也是按钮。坐在那张桌前就像坐在柯克船长的椅子上。\n\
  \n当我看着技术人员按下那些按钮时，我注意到它们在按下时会亮起，再次按下即可关闭。我注意到他们还按了其他按钮；名字像`deposit`（存储）和`run`（运行）之类的按钮。\n\
  \n每一行的按钮被分成五组，每组三个。我的`Digi-Comp`也是三位的，所以当用二进制表示时，我可以读出一个八进制数字。意识到这些仅仅是五个八进制数字并不是什么巨大的飞跃。\n\
  \n当技术人员按下按钮时，我能听到他们自言自语。他们会在`memory buffer`（内存缓冲区）行按下`1, 5, 2, 0, 4`，对自己说：“存储在 204。”他们会按下`1,\
  \ 0, 2, 1, 3`并咕道：“将 213 加载到`accumulator`（累加器）中。”有一排名为`accumulator!`的按钮。\n\n这样过了十分钟后，我十五岁的脑子里就很清楚了：15\
  \ 代表`store`，10 代表`load`，`accumulator`是被存储或加载的内容，而其他数字是 1024 个字之一的编号。\n\n随着技术人员按下按钮，我能听到他们低声自语。他们按下`1,\
  \ 5, 2, 0, 4`，在心里说“存入 204”。他们按下`1, 0, 2, 1, 3`并咕道：“将 213 加载到`accumulator`中。”有一排名为`accumulator!`的按钮。\n\
  \n十分钟后，我这十五岁的脑子里就很清楚了：15 代表`store`，10 代表`load`，`accumulator`是被存储或加载的内容，而其他数字是 1024\
  \ 个字之一的编号。（所以`字`是这么意思的！）\n\n一点一点地（这里并非双关语），我渴望求知的心捕捉了越来越多的指令码和概念。在技术人员离开之前，我已经掌握了这台机器的基本原理。\n\
  \n那天下午，在自习期间，我溜进数学实验室，开始摆弄电脑。我早就学会了先斩后奏比事后请谅要好！我拨入了一个能让`accumulator`乘以 2 并加 1 的小程序。我在`accumulator`中拨入一个`5`，运行程序，在`accumulator`中看到了`13[8]`！它运行成功了！\n\
  \n我又拨入了几个类似的简单程序，它们都按计划运行了。我简直是宇宙的主宰！\n\n几天后，我意识到自己有多愚蠢，又有多幸运。我在数学实验室找到了一张指令表。它展示了所有不同的指令和操作码，其中许多我通过观察技术人员并没有学到。我对正确解释了那些我熟悉的指令感到欣慰，对其他的指令感到兴奋。然而，新指令之一是`HLT`。恰好，`halt`指令是一个全零字。而恰好的是，我在每个程序的末尾都放了一个全零字，以便我可以将其加载到`accumulator`中来清空。我根本没有想过停止的概念。我只是认为程序在完成后就会停止！\n\
  \n我记得有一次坐在数学实验室，看着一个老师努力让一个程序运行起来。他正试图在连接的电打字上输入两个十进制数字，然后打印和。任何尝试在微机上用机器语言编写这种程序的人都知道这绝非易事。你必须读取字符，将其转换为数字，再转换为二进制，相加，然后转换回十进制并编码回字符。而且相信我，当你通过前面面板二进制输入程序时，情况要`糟糕`得多！\n\
  \n我看着他在程序中加入一个`halt`，然后一直运行直到它停止。（噢！这是一个好主意！）这种原始的断点允许他检查寄存器的内容，查看他的程序做了什么。我记得他低声说道：“哇，真快！”老兄，我可什么要告诉他！\n\
  \n\n\n我完全不知道他的算法是什么。那种编程方式对我来说仍然就像魔法一样。而且当我站在他身后观察时，他从没有跟我说过过话。事实上，根本`没有人`人跟我谈过这台电脑的事。我想他们把我当成一个需要被忽略的麻烦，像飞蛾一样在数学实验室里飞来飞去。可以说，当时无论是学生还是老师，都没有培养出高水平的社交技巧。\n\
  \n最后，他让他的程序运行了。看着那个过程简直令人惊叹。他会缓慢地输入两个数字，因为尽管他之前抗议过，那台电脑运行`并不`快（想象一下在 1967 年从旋转鼓上连续读取单词）。当他输入第二个数字并按下回车键后，电脑剧烈地闪烁了一会儿，然后开始打印结果。每个数字大约花费一秒。它打印了除最后一个以外的所有数字，更剧烈地闪烁了五秒，然后打印出最后一个数字并停止了。\n\
  \n为什么在最后一个数字之前会有那个停顿？我从未找到答案。但这让我意识到，解决问题的方法会对用户产生深远的影响。尽管程序得出了正确的答案，但它仍然`还是`有些不对劲。\n\
  \n这就是导师。当然，这并不是我所希望的那种导师。如果那些老师中有一个能收我为徒并和我一起工作，那就太好了。但这并不重要，因为我当时在`观察`他们，并以极快的速度学习。\n\
  \n## 非传统的导师制\n\n我告诉你们这这两个故事，是因为它们描述了两种非常不同的导师形式，而这两种都不是这个词通常所隐含的含义。在第一种情况下，我从一本写得非常好的手册的作者那里学到了；在第二种情况下，我通过观察那些努力努力忽视我的人来学习。在这两种情况下，我所获得的知识都是深奥且具有基础性的。\n\
  \n当然，我也有其他类型的导师。有一位在 Teletype 公司工作的亲切邻居，他带给我带回一箱 30 个电话继电器让我玩。听我一言，给一个孩子一些继电器和一个电电小火车变压器，他就能征服世界！\n\
  \n还有一位业余无线电爱好者的亲切邻居，他教我如何使用万用表（我很快就弄坏了）。还有一位办公用品店的老板，允许我进去“玩玩”他非常昂贵的可编程计算器。还有数字设备公司（Digital\
  \ Equipment Corporation）的销售办公室，允许我进去“玩玩”他们的`PDP-8`和`PDP-10`。\n\n然后是大 Jim Carlin，他是一个\
  \ BAL 程序员，他通过帮助我调试一个远超出我能力范围的`Cobol`程序，救我在第一份编程工作中没有开雇。他教我如何读取核心转储文件（core dumps），以及如何使用适当空行、星号行和注释来格式化我的代码。他让我向匠心精神迈出了第一步。遗憾的是，一年后老板的不满落在他身上时，我没能报答他的情。\n\
  \n但坦率地说，大概就这些了。在 70 年代初，并没有那么多资深程序员。在我工作过的其他地方，我`都是`资深人员。没有人能帮我理解什么是真正的专业编程。没有榜样来教我如何处事或应该重视什么。这些东西我必须自己学习，而且绝非易事。\n\
  \n## 惨痛教训\n\n正如我之前告诉你们的，我确实在 1976 年被那家工厂自动化公司开雇了。尽管我在技术上非常胜任，但我没有学会关注业务或业务目标。日期和截止日期对我来说毫无意义。我忘记了周一早晨的大型演示，在周五离开时让系统处于崩溃状态，结果周一迟到场时，所有人都愤怒地盯着我。\n\
  \n我的老板给我发了一封信，警告我说我必须立即做出改变，否则就会开雇。这对我来说是一个巨大的警醒。我重新评估了我的生活和职业，并开始在行为上做出一些重大改变——其中一些你已经在书书中读到了。但这为太少、太晚了。势头完全处于错误的方向，而以前无关紧要的小事变得至关重要。所以，尽管我付出了巨大的努力，他们最终还是把我护送出了大楼。\n\
  \n不用说，把那种消息带给怀孕的妻子和两岁的女儿面前并不好玩。但我振作起精神，带着一些深刻的人生教训带到了我的下一份工作中——我在那份工作中干了十五年，它构成了我目前职业的真正基础。\n\
  \n最后，我活了下来并繁荣起来。但必须有更好的方法。如果我有一个真正的导师，一个能教我各种门道的人，对我来说会好得多。一个可以在我帮助他处理小任务时观察的人，并且会评审和指导我的早期工作的人。一个可以作为榜样并教我正确的价值观和反应的人。老师傅。大师。导师。\n\
  \n## 学徒制\n\n医生是做什么的？你认为医院会雇佣医学毕业生并把他们扔进手术室，在他们上班的第一天就做心脏手术吗？当然不。\n\n医学界已经发展出了一套严密的导师制度，这种制度植根于仪式之中，并由传统润滑。医学界监督着大学，确保毕业生获得最好的的教育。这种教育涉及了大约`等量`的课堂学习和在医院里与专业人士合作的临床活动。\n\
  \n毕业后，在获得执照之前，新医生需要进行为期一年的监督实践和培训，被称为`实习`（internship）。这是高强度的岗上培训`实习生`被榜样和老师包围着。\n\
  \n一旦完成`实习`，每个医学专科还需要额外三到五年的进一步监督实践和培训，被称为`住院医师`（residency）。住院医生在高级医生的周围和指导下，通过承担更大的责任来获得信心。\n\
  \n许多专科还需要一到三年的`专科研修`（fellowship），学生继续接受专门培训和监督实践。`然后`他们就有资格参加考试并获得委员会认证。\n\n这种对医学界的描述是理想化的，而且可能完全不准确。但事实是，当风险很高时，我们不会把毕业生送进一个房间，把肉扔进去，然后期待出现好结果。那么，为什么我们在软件领域要这样做呢？\n\
  \n诚然，软件漏洞导致的死亡相对较少。但`存在`巨大的经济损失。公司由于软件开发人员培训不足而损失了巨额资金。\n\n不知为何软件开发行业产生了这样想法：程序员就是程序员，只要你毕业了就能写代码。事实上，公司雇佣刚毕业的学生，把他们组成“团队”，并让他们构建最关键的系统，这简直是疯了！\n\
  \n画家不这样做。水工不这样做。电工不这样做。该死，我甚至认为快餐店员工都不会这样做！在我看来，雇佣计算机科学毕业生的公司对培训的投入应该比麦当劳对服务器的投入更多。\n\
  \n让我们不要自欺欺人，这非常重要。关乎巨大。我们的文明运行在软件之上。正是软件在移动和处理渗透我们生活的各种。软件控制着汽车引擎、变速箱和刹车。软件维护着我们的银行余额，发送账单，接受我们的支付。软件清洗衣服，告诉我们时间。软件在电视上显示图像，发送短信，拨打电话，在我们无聊时提供娱乐。它无处不在。\n\
  \n\n\n\n鉴于我们将软件开发者寄托了生活的方方面面，从细微之处到重大时刻，我认为建议进行合理的培训和监督实践并非不妥的。\n\n## 软件学徒制\n\n\
  那么，软件行业*应该*如何引导毕业生进入专业人士的行列呢？他们应该遵循哪些步骤？他们应该面对哪些挑战？他们应该实现什么目标？让我们反过来推导。\n\n### 大师（Masters）\n\
  \n这些是主导过一个以上重大软件项目的程序员。他们通常拥有 10 年以上的经验，并工作过多种不同的系统、语言和操作系统。他们知道如何领导和协调多个团队，是精明的设计师和架构师，编写代码时可以轻而易过所有人而毫不费力。他们曾获得过管理职位，但要么拒绝了，要么在接受后又逃回来，要么将这些职位与他们主要的技术角色相结合。他们通过阅读、学习、实践、执行和教学来维持这一技术角色。公司会将项目的技术责任分配给这些大师。想一下，“斯科蒂（Scotty）”。\n\
  \n### 技师（Journeymen）\n\n这些是受过训练、能力胜任且充满活力的程序员。在职业生涯的这段，他们将学会很好地与团队合作并成为团队领袖。他们对当前技术了如指，但通常缺乏许多多样系统的经验。他们倾向于熟悉一种语言、一个系统、一个平台；但他们正在学习更多。他们群体中的经验水平差异很大，但平均水平大约五年。在这一平均值的远端，我们有蓬勃发展的大师；在近端，我们有新近入职的学徒。\n\
  \n技师由大师或其他更资深的技师监督。年轻的技师很少被赋予自主权。他们的工作受到密切监督。他们的代码受到严格审查。随着经验的增长，自主权也会增加。监督变得不再那么直接而变得微妙。最终，它转变为同行评审。\n\
  \n### 学徒/实习生（Apprentices/Interns）\n\n毕业生从学徒开始职业生涯。学徒没有自主权。他们受到技师的密切监督。起初他们不承担任何任务，只是为技师提供协助。这应该是非常密集的结对编程时期。这是学习和强化纪律的时期。这是建立价值观的时期。\n\
  \n技师是老师。他们确保学徒了解设计原则、设计模式、纪律和仪式。技师教授 `TDD`、`refactoring`、`estimation` 等。他们给学徒分配阅读任务、练习和实践；他们审查他们的进度。\n\
  \n学徒制应该持续一年。到那个时候，如果技师愿意让学徒进入他们的队伍，他们将向大师们推荐。大师们应该通过面试和审查他们的成就来评估学徒。如果大师们同意，学徒就变成了技师。\n\
  \n## 现实\n\n再次，所有这些这些都是理想化和假设性的。然而，如果你改变一下这些名称并眯起眼看这些文字，你会发现这与我们现在*期待*事物运作的方式并没有太大区别。毕业生由年轻的团队负责人监督，而团队负责人又由项目主管监督，以此类推。问题在于，在大多数情况下，这种监督不是技术性的！在大多数公司里，根本没有技术监督。程序员获得加薪和最终的晋升是因为，嗯，那只是对程序员该做的事。\n\
  \n我们今天所做的与我理想化的学徒制计划之间的区别，在于对技术教学、培训、监督和评审的关注。\n\n区别在于这种观念：专业价值观和技术敏锐度必须被教、培养、滋养、呵护和内化。我们目前这种枯燥方法中缺失的是长辈教导后辈责任。\n\
  \n## 工匠精神（Craftsmanship）\n\n现在我们处于可以定义这个词的位置了：*craftsmanship*（工匠精神）。它到底是什么？为了理解，让我们看看*craftsman*（工匠）这个词。这个词让人联想到技能和质量。它唤起经验和能力。工匠是一个工作速度快但不匆忙的人，他们提供合理的估算并履行承诺。工匠知道什么时候该说不，但会努力说是。工匠是一个专业人士。\n\
  \n工匠精神是工匠所持有的*心态*。工匠精神是一个包含价值观、纪律、技术、态度和答案的模因（meme）。\n\n但工匠是如何采用这种模因的？他们是如何获得这种心态的？\n\
  \n工匠精神模因是从一个人传递给另一个人的。它由长辈教给年轻人。它在同行之间交流。它在长辈观察年轻人时被观察并重新学习。工匠精神是一种传染病，一种精神病毒。你通过观察他人并让模因扎根来感染它。\n\
  \n### 说服人们\n\n你无法说服人们成为工匠。你无法说服他们接受工匠精神模因。论点是无效的。数据是无关紧的。案例研究毫无意义。对模因的接受与其说是理性决定，不如说是感性决定。这是非常*人化*的事情。\n\
  \n那么你如何让人们采用工匠精神模因呢？记住模因是有传染性的，但只有在它可以被观察时如此。所以你要让模因变得*可见*。你要作为一个榜样。你首先成为一个工匠，让你的工匠精神表现出来。然后让模因完成剩下的工作即可。\n\
  \n### 结论\n\n学校可以教计算机编程的理论。但学校不、无法教成为工匠的纪律、实践和技能。这些东西是通过多年的个人教导和指导获得的。我们这些软件行业的人是时候面对事实了：引导下一批软件开发者走向成熟将落在我们身上，而不是大学身上。是时候我们采用一套学徒制、实习和长期指导的计划了。\n\
  \n## 工具\n\n![image](img/Image0150.jpg)\n\n1978 年，我在 Teradyne 工作，处理之前提到的那个电话测试系统。该系统大约有\
  \ 8 万行汇编代码（M365）。我们将源代码保存在磁带上。\n\n磁带类似于 70 年代流行的 8 轨录音带。磁带是无限循环，磁带驱动只能向一个方向移动。带盒有`10′`、`25′`、`50′`和`100′`等长度。磁带越长，“倒带”所需的时间越长，因为磁带驱动只需向前移动直到找到“加载点”。我们谨慎地选择磁带的长度。\n\
  \n\n\n\n\n我们在屏幕上编辑磁带。我们的文本编辑器 `ED-402` 实际上非常好用。它和 `vi` 非常相似。我们会从磁带上读取一个“页”，编辑内容，然后将该页写出，再读取下一页。一页通常是\
  \ 50 行代码。你无法向前查看磁带以看到后面的页面，也无法向后查看磁带以查看已经编辑过的页面。因此，我们使用列表（listings）。\n\n事实上，我们会在代码列表上标记我们想要进行的所有更改，*然后*根据这些标记来编辑文件。*没有任何人*会在终端直接编写或修改代码！那简直是自杀行为。\n\
  \n一旦对所有需要编辑的文件完成了更改，我们就会将这些文件与主文件合并，创建一个可运行的磁带。这就是我们在运行编译和测试时会使用的磁带。\n\n一旦我们完成测试并确定更改有效，我们就会查看白板。如果板上没有新的销子（pins），我们只需将工作磁带重命名为\
  \ `MASTER` 并取下板上的销子即可。如果板上*确实*有新的销子，我们就取出自己的销子，并将工作磁带交给那个板上还有我们销子的人。他们必须完成合并工作。\n\
  \n我们共有三个人，每个人都有自己颜色的销子，所以我们很容易知道谁签领了哪些文件。而且由于我们都在同一个实验室工作，并且一直在交流，所以我们都在脑子里记住了白板的状态。因此，通常白板是多余的，我们经常并不使用它。\n\
  \n### 工具\n今天，软件开发者有广泛的工具可以选择。大多数并不值得投入，但有少数工具是每位软件开发者都必须精通的。这一章描述了我目前的个人工具包。我没有对所有其他工具进行全面调查，因此这不应被视为一份全面的回顾。这只是我使用的工具。\n\
  \n### 源代码控制\n谈及源代码控制，开源工具通常是你的最佳选择。为什么？因为它们是开发者为开发者编写的。开源工具是开发者在需要好用的工具时为自己编写的。\n\
  \n市面上有很多昂贵的商业“企业级”版本控制系统。我发现这些系统与其说是卖给开发者的，不如说是卖给经理、高管和“工具组”的。它们的功能列表令人印象深刻且极具力。遗憾的是，它们往往不具备开发者真正需要的功能。其中最核心的是*速度*。\n\
  \n#### “企业级”源码控制系统\n你的公司可能在某个“企业级”源代码控制系统上投入了巨额资金。如果是这样，我表示哀悼。从政治角度来说，你到处告诉大家“鲍伯叔叔说不要用它”可能是不恰当的。然而，有一个简单的解决方案。\n\
  \n你可以在每次迭代结束时（大约每两周一次）将源代码检入到“企业级”系统，并在每次迭代期间使用开源系统之一。这让每个人都感到开心，不违反任何公司规章，并保持了你的高效率。\n\
  \n#### 悲观锁与乐观锁\n悲观锁在 80 年代看起来是个好主意。毕竟，管理并发更新问题最简单的方法就是将它们串行化。所以，如果*我*正在编辑一个文件，*你*最好不要编辑。事实上，我在\
  \ 70 年代后期使用的彩色销子系统就是悲观锁的一种形式。如果一个文件里插了销子，你就不要去编辑那个文件。\n\n当然，悲观锁也有它的问题。如果我锁定了一个文件然后去度假，其他想编辑该文件的人就都卡住了。事实上，即使我只把文件锁定一两天，也会延迟那些需要进行更改的人。\n\
  \n我们的工具在合并并发编辑的源文件方面已经变得好得多了。如果你仔细想想，这其实非常惊人。工具会查看两个不同的文件以及这两个文件的祖先文件，然后应用多种策略来确定如何整合并发更改。它们做得相当不错。\n\
  \n所以，悲观锁的时代已经结束了。我们不再需要在检出文件时对其进行锁定。事实上，我们根本不再懒得去检出单个文件。我们只需检出整个系统并编辑我们需要的任何文件。\n\
  \n当我们准备好检入更改时，我们会执行“更新”（update）操作。这会告诉我们是否有人在我们之前检入了代码，它会自动合并大多数更改，发现冲突并帮助我们完成剩余的合并。然后我们提交合并后的代码。\n\
  \n在这一章的后面，我将详细阐述自动化测试和持续集成在此过程中所扮演的角色。目前，我们只需说，我们*绝不会*检入没有通过所有测试的代码。*绝不*。\n\n####\
  \ CVS/SVN\n旧的经典源码控制系统是 `CVS`。它在那个时代很好用，但对于今天的项目来说已经有些过时了。尽管它在处理单个文件和目录方面非常好，但在重命名文件或删除目录方面并不理想。至于那个“阁楼”（attic）……好吧，说得少越好。\n\
  \n另一方面，Subversion 运行得非常好。它允许你通过单次操作检出整个系统。你可以轻松地更新、合并和提交。只要你不涉及分支（branching），`SVN`\
  \ 系统的管理非常简单。\n\n##### 分支\n直到 2008 年，我一直避免分支（除了最简单的形式外）。如果一个开发者创建了分支，它必须在迭代结束前回到主线。事实上，在我参与的项目中，由于我非常严格，很少使用分支。\n\
  \n如果你在使用 `SVN`，我仍然认为这种策略是好的。然而，有一些新工具完全改变了游戏。它们是分布式源码控制系统。`git` 是我最喜欢的分布式控制系统。让我来介绍一下它。\n\
  \n##### git\n我从 2008 年底开始使用 `git`，从以后它改变了我使用源码控制的一切。理解为什么这个工具具有如此变革性的意义超出了本书的范围。但对比\
  \ 图 A-1 和 图 A-2 应该值得我在这里没写进去的话。\n\n**图 A-1. 使用 subversion 的 NESSE**\n![image](img/Image0151.jpg)\n\
  \n**图 A-2. 使用 git 的 NESSE**\n![image](img/Image0152.jpg)\n\n\n\n\n\n如果你不理解这些，没关系。`git`\
  \ 在刚开始确实有点让人费脑筋。你必须习惯它的工作方式。但我可以告诉你：`git` 以及此类工具，就是源代码控制的未来。\n\n## IDE/编辑器\n\n作为开发者，我们的大部分时间都花在阅读代码和编辑代码上。在过去的几十年里，我们用于这些目的的工具发生了巨大的变化。有些工具极其强大，而有些工具自\
  \ 70 年代以来几乎没有变动过。\n\n### vi\n\n你可能会认为，使用 `vi` 作为主要开发编辑器的时代早已结束了。如今有很多工具性能远超 `vi`\
  \ 以及其他类似的简单文本编辑器。但事实是，`vi` 由于其简单、易用、速度快且灵活性，在人气上经历了显著的复兴。`vi` 可能没有像 `Emacs` 或 `eclipse`\
  \ 那样强大，但它仍然是一个快速且强大的编辑器。\n\n尽管如此，我不再是一个资深 `vi` 用户了。曾有一段时期，我被誉为 `vi` “神”，但那些日子已经一去不复了。当我需要快速编辑文本文件时，我偶尔会使用\
  \ `vi`。我最近甚至用过它对远程环境下的 Java 源文件进行快速修改。但在过去的 10 年里，我在 `vi` 中完成的真正编码工作微乎其微。\n\n###\
  \ Emacs\n\n`Emacs` 仍然是世界上强大的编辑器之一，并且可能在未来的几十年里继续保持如此。其内部的 lisp 模型保证了这一点。作为一种通用编辑工具，没有其他东西能与之比拟。另一方面，我认为\
  \ `Emacs` 无法真正与现在主导市场的特定用途 IDE 竞争。编辑代码*不是*一项通用的编辑工作。\n\n在 90 年代，我是一个 `Emacs` 狂热分子。我绝不会考虑使用任何其他工具。当时的点点式编辑器简直是笑话般的玩具，没有任何开发者会认真对待。但在\
  \ 01 世纪初，我接触到了 `IntelliJ`，这是我目前的首选 IDE，我从此再也没有回头。\n\n### Eclipse/IntelliJ\n\n我是一个\
  \ `IntelliJ` 用户。我爱它。我用它来编写 `Java`、`Ruby`、`Clojure`、`Scala`、`Javascript` 以及许多其他语言。这个工具是由那些理解程序员在编写代码时需要什么的程序员所编写的。多年来，他们很少让我失望，而且几乎总是让我感到惊喜。\n\
  \n`Eclipse` 在功能和范围上与 `IntelliJ` 类似。在编辑 `Java` 方面，两者都远超 `Emacs`。这一类别中还有其他 IDE，但我在这里不再提，因为我没有直接使用过它们。\n\
  \n这些 IDE 优于 `Emacs` 等工具的功能在于它们帮助你操作代码的方式极其强大。例如在 `IntelliJ` 中，你可以通过一个命令从一个类中提取超类。你可以重命名变量、提取方法以及将继承转换为组合，还有许多其他很棒的功能。\n\
  \n有了这些工具，代码编辑不再仅仅关乎行和字符，而是关乎复杂的操控。与其思考你下一个要输入的几个字符和行，不如思考你下一个需要进行的几次转换。简而言之，这种编程模型截然不同且生产力极高。\n\
  \n当然，这种力量是有代价的。学习曲线很陡峭，项目设置的时间也不容忽视。这些工具*不是*轻量级的。运行它们需要大量的计算资源。\n\n### TextMate\n\
  \n`TextMate` 强大且轻量。它无法做到 `IntelliJ` 和 `Eclipse` 能做到的精彩操作。它没有 `Emacs` 那样强大的 lisp\
  \ 引擎和库。它没有 `vi` 的速度和流畅性。另一方面，它的学习曲线很小，操作非常直观。\n\n我偶尔会使用 `TextMate`，特别是偶尔写 `C++`\
  \ 时。对于大型 `C++` 项目，我会使用 `Emacs`，但对于我那些短小的 `C++` 任务，我太懒得不想去腾 `Emacs` 了。\n\n## 问题跟踪\n\
  \n目前我正在使用 `Pivotal Tracker`。这是一个优雅且易用的系统。它与敏捷/迭代方法非常契合。它允许所有利益相关者和开发者快速交流。我对其非常满意。\n\
  \n对于非常小的项目，我有时会使用 `Lighthouse`。它的设置和使用非常快速快捷。但它的强大程度无法与 `Tracker` 相比。\n\n我也简单地使用过\
  \ `wiki`。`Wikis` 对于内部项目来说很好。它们允许你建立任何你喜欢的方案。你不会被强制要求特定的流程或僵化的结构。它们非常容易理解和使用。\n\n\
  有时，最好的问题跟踪系统其实是一组卡片和一个公告板。公告板被分为“待办”（To Do）”、“进行中”（In Progress）和“已完成”（Done）等列。开发者在适当的时候只需将卡片从一列移动到下一列。事实上，这可能是今天敏捷团队最常用的问题跟踪系统。\n\
  \n给客户的建议是在购买跟踪工具之前，先从像公告板这样的手动系统开始。一旦你精通了手动系统，你就拥有了选择合适工具所需的知识。事实上，合适的选择可能就是继续使用手动系统。\n\
  \n### Bug 计数\n\n开发者团队确实需要一个问题列表。这些问题包括任务、功能以及 Bug。对于任何规模合理的团队（5 到 12 名开发者），该列表的数量应该是几十到数百个*而不是成千*。如果你有成千上万个\
  \ Bug，说明出了问题。如果你有成千上万的功能或任务，说明出了问题。通常情况下可以使用 `wiki`、`Lighthouse` 或 `Tracker` 这类轻量级工具来管理。市面上有一些商业工具看起来不错。我见过客户使用它们，但没有机会直接操作。我不反对使用这类工具，只要问题的数量保持在较小且可管理的范围内。当问题跟踪工具被强制跟踪成千上万个问题时，“跟踪”这个词就失去了意义。它们变成了“问题垃圾桶”（而且闻起来也是）。\n\
  \n## 持续构建\n\n最近我一直在使用 `Jenkins` 作为持续构建引擎。它轻量、简单且几乎没有学习曲线。你下载、运行、进行一些简单的配置，就可以用了。非常好。\n\
  \n我对持续构建的哲学很简单：将其连接到你的源代码控制系统。每当有人提交代码时，它会自动构建并向团队报告状态。\n\n团队必须保持构建运行。如果构建失败，应该是一个“停工”事件，团队应该聚起来解决问题。在任何情况下都不允许故障持续一天以上。\n\
  \n对于 FIT NESSE 项目，我要求每个开发者在提交之前运行持续构建脚本。构建花费不到 5 分钟，所以并不麻烦。如果有问题，开发者会在提交前解决它们。因此自动构建很少出现问题。自动构建失败的最常见源头是环境问题，因为我的自动构建环境与开发者的环境大不同。\n\
  \n### 单元测试工具\n\n每种语言都有其特定的单元测试工具。我喜欢的是 `Java` 的 `JUNIT`、`Ruby` 的 `RSPEC`、`.Net`\
  \ 的 `NUNIT`、`Clojure` 的 `Midje` 以及 `C` 和 `C++` 的 `CPP UTEST`。\n\n无论你选择哪种单元测试工具，它们都应该支持一些基本功能。\n\
  \n1.  运行测试应该是快速方便的。通过 IDE 插件还是简单的命令行工具运行并不重要，只要开发者可以随心所欲运行测试。运行测试的动作应该是简单易举的。\n\n\
  \n\n例如，我在 TextMate 中通过输入 `command-M` 来运行我的 CPP UTEST 测试。我设置了该命令来运行我的 `makefile`，它会自动运行测试并在所有测试通过时打印出一个单行报告。`INTELLI\
  \ J` 同时支持 `JUNIT` 和 `RSPEC`，所以我只需要点击一个按钮即可。对于 `NUNIT`，我使用 `RESHARPER` 插件来提供测试按钮。\n\
  \n2. 该工具应该给你提供清晰的视觉化通过/失败指示。这是一个图形化的绿色条还是一个显示“All Tests Pass（所有测试通过）”的控制台消息并不重要。关键在于，你必须快速且明确地判断所有测试都已通过。如果你必须阅读多行报告，或者更糟糕，比较两个文件的输出来判断测试是否通过，那么你在这一项上失败了。\n\
  \n3. 该工具应该给你提供清晰的视觉化进度指示。无论是图形化的进度条还是点点字符串，只要你能看出进度正在进行、且测试没有停滞或中止，即可。\n\n4. 该工具应该抑制单个测试用例之间的相互通信。`JUNIT`\
  \ 通过为每个测试方法创建测试类的新实例来实现这一点，从而防止了测试使用实例变量进行相互通信。其他工具会随机顺序运行测试方法，这样你就无法依赖于某个测试先于另一个测试。无论采用什么机制，该工具都应该帮助你保持测试之间的独立性。依赖测试是一个你不想掉进去的深层陷阱。\n\
  \n5. 该工具应该让编写测试变得非常容易。`JUNIT` 通过提供一个方便的断言 API 实现了这一点。它还利用反射和 Java 属性来区分测试函数和普通函数。这使得良好的\
  \ IDE 能够自动识别你所有的测试，消除了配置测试套件和创建易错测试列表的麻烦。\n\n## 组件测试工具\n\n这些工具用于在 API 级别测试组件。它们的作用是确保组件的行为是用业务人员和\
  \ QA（质量保证）人员能理解的语言定义的。事实上，理想情况是业务分析师和 QA 使用该工具来`write（编写）`这些规范。\n\n### 完成定义 (Definition\
  \ of Done)\n\n与其他任何工具相比，组件测试工具是我们定义什么是`done（完成）`的手段。当业务分析师和 QA 协作创建一个定义组件行为的规范，并且该规范可以作为一组通过或失败的测试套件执行时，`done`\
  \ 就具有了非常明确的含义：“All Tests Pass（所有测试通过）”。\n\n### FitNesse\n\n我最喜欢的组件测试工具是 `FIT NESSE`。我编写了它的大部分代码，并且我是主要的提交者。所以它是我的心血。\n\
  \n`FIT NESSE` 是一个基于 wiki 的系统，允许业务分析师和 QA 专家以非常简单的表格格式编写测试。这些表格在形式和意图上都与 `Parnas`\
  \ 表格相似。测试可以快速组合成套件，并随地运行这些套件。\n\n`FIT NESSE` 用 `Java` 编写，但可以测试任何语言编写的系统，因为它与一个可以用任何语言编写的底层测试系统通信。支持的语言包括\
  \ `Java`、`C#/.NET`、`C`、`C++`、`Python`、`Ruby`、`PHP`、`Delphi` 等。\n\n`FIT NESSE` 的底层有两个测试系统：`Fit`\
  \ 和 `Slim`。`Fit` 由 `Ward Cunningham` ，是 `FIT NESSE` 及其产品的原始灵感来源。`Slim` 是一个更简单、更具移植性的测试系统，深受如今\
  \ `FIT NESSE` 用户的青睐。\n\n### 其他工具\n\n我知道其他几个可以归类为组件测试的工具。\n\n- `RobotFX` 是由 `Nokia`\
  \ 工程师开发的工具。它使用了与 `FIT NESSE` 类似的表格格式，但不是基于 wiki 的。该工具运行在用 `Excel` 或类似工具准备的平面文件中。工具用\
  \ `Python` 编写，但可以使用适当的桥接测试任何语言的系统。\n- `Green Pepper` 是一个商业工具，与 `FIT NESSE` 有许多相似之处。它基于流行的\
  \ `confluence` wiki。\n- `Cucumber` 是由 `Ruby` 引擎驱动的纯文本工具，但能够测试许多不同的平台。`Cucumber`\
  \ 的语言是流行的 `Given/When/Then` 风格。\n- `JBehave` 与 `Cucumber` 类似，是其逻辑父类。它用 `Java` 编写。\n\
  \n## 集成测试工具\n\n组件测试工具也可以用于许多集成测试，但对于通过 UI 驱动的测试来说并不合适。\n\n通常，我们不想通过 UI 运行很多测试，因为\
  \ UI 是以易变而闻名的。这种易变性使得通过 UI 的测试变得非常脆弱。\n\n尽管如此，某些测试`must（必须）`通过 UI——最重要的就是`of（针对）`UI\
  \ 的测试。此外，一些端到端测试应该通过整个组装系统，包括 UI。\n\n我最喜欢的 UI 测试工具是 `Selenium` 和 `Watir`。\n\n##\
  \ UML/MDA\n\n在 20 世纪 90 年代初，我非常希望 CASE 工具会导致软件开发人员工作方式发生根本性的变化。从那些狂热的日子向前看，我想那时现在每个人都在以更高抽象的级别通过图表进行编码了，而文本代码将成为过去。\n\
  \n天哪，我大错错了。不仅这个梦想没有实现，而且向这个方向移动的尝试都遭遇了惨败的失败。并不是说没有展示潜力的工具和系统；而是这些工具根本没有真正实现这个梦想，而且似乎没有人想使用它们。\n\
  \n梦想是软件开发人员可以抛弃文本代码的细节，在高级别的图表语言中编写系统。事实上，按照这个梦想的说法，我们可能根本不需要程序员。架构师可以从 `UML` 图创建整个系统。引擎——庞大、冷酷且对普通程序员的困境毫无同情——会将这些图表转换为可执行的代码。这就是模型驱动架构\
  \ (`MDA`) 的宏伟梦想。\n\n遗憾的是，这个宏伟梦想有一个微小的缺陷。`MDA` 假设问题是代码。但代码`not（不是）`问题。它从来不是问题。问题是`detail（细节）`。\n\
  \n### 细节\n\n程序员是细节管理者。这就是我们的工作。我们以最微小的细节指定系统的行为。我们恰好使用文本语言（代码）为此，因为文本语言非常方便（例如英语）。\n\
  \n我们管理什么种的细节？\n\n你知道 `\\n` 和 `\\r` 这两个字符之间的区别吗？第一个 `\\n` 是换行符。第二个 `\\r` 是回车符。什么是回车（carriage）？\n\
  \n在 60 年代和 70 年代初，计算机的一种更常用的输出设备之一是电传打字机（TTY）。`ASR33` 型是最常见的。\n\n该设备由一个每秒可以打印十个字符的打印头组成。打印头由一个刻有字符的小圆柱组成。圆柱会旋转并升起，使正确的字符面对纸张，然后一个小锤会撞击圆柱使其接触纸张。圆柱和纸张之间有一个墨带，墨水转移到纸张上形成字符的形状。\n\
  \n打印头安装在一个车架（carriage）上。每有一个字符，车架就会向右移动一个空格，带着打印头一起移动。当车架到达 72 字符行的末尾时，你必须通过发送回车符显式地返回车架（`\\\
  r = 0 × 0D`），否则打印头会在第 72 列继续打印，将其变成一个难看的黑色矩形。\n\n\n\n\n当然，这还远远不够。返回回车并没有让纸张移动到下一行。如果你只返回回车而没有发送换行符（`\\\
  n` = 0 × 0A），那么新行将打印在旧行之上。\n\n因此，对于 ASR33 传字机，行尾序列是 `\\r\\n`。实际上，你必须对此小心，因为回车返回可能超过\
  \ 100 毫秒。如果你发送 `\\n\\r`，下一个字符可能在回车返回时就被打印，从而在行中间产生一个模糊的字符。为了安全起见，我们经常在行尾序列中填充一个或两个擦符\
  \ `^`（`0` × `FF`）。\n\n在 70 年代，随着打字机逐渐淡出，像 UNIX 这样的操作系统将行尾序列简化为简单的 `\\n`。然而，其他操作系统（如\
  \ DOS）继续使用 `\\r\\n` 约定。\n\n你上一次处理使用“错误”标准的文本文件是什么时候？我每年至少遇到一次这个问题。两个相同的源文件无法比较，也无法生成相同的校验和，因为它们使用了不同的行结束符。文本编辑器无法正确自动换行，或者因为行结束符“错误”的而导致文本双倍间距。不期望空行的程序会崩溃，因为它们将\
  \ `\\r\\n` 解释为两行。有些程序识别 `\\r\\n` 但不识别 `\\n\\r`。以此类推。\n\n*这*就是我所说的*细节*。试着在 UML 中编写那套排序行结束符的糟糕逻辑吧！\n\
  \n## 没有希望，没有改变\n\nMDA（模型驱动开发）运动的希望是可以通过使用图表而不是代码来消除大量的细节。到目前为止，这种希望被证明是幻想的。事实证明，代码中嵌入的并没有那么多可以通过图片来消除的额外细节。而且，图片本身包含它们自己的意外细节。图片有自己的语法、句法、规则和限制。所以，最终，细节上的差异并无完胜。\n\
  \nMDA 的希望是图表在抽象层次上比代码更高，就像 Java 的抽象层次高于汇编语言一样。但再次，这种希望到目前为止被证明是错位的。抽象层次的差异充其量是微乎其微。\n\
  \n最后，假设有一天某人发明了一种真正实用的图表语言。画那些图表的将不再是架构师，而是程序员。图表将简单地变成新的代码，而需要程序员来*画*这些代码，因为归根结底，一切关乎细节，而管理这些细节正是程序员。\n\
  \n### 结论\n\n自从我开始编程以来，软件工具已经变得异常强大且丰富。我目前的工具箱只是那个奇珍异兽的一个简单子集。我使用 `git` 进行源码控制，使用\
  \ `Tracker` 进行问题管理，使用 `Jenkins` 进行持续构建，使用 `IntelliJ` 作为我的 IDE，使用 `XUnit` 进行测试，使用\
  \ `FIT NESSE` 进行组件测试。\n\n我的机器是一台 Macbook Pro，2.8Ghz Intel Core i7，17 英寸雾光屏，8GB 内存，512GB\
