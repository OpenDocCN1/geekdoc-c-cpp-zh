  \n![image](img/Image00119.jpg)\n\n## 结语\n\n2005 年，在丹佛参加敏捷会议期间，Elisabeth Hedrickson\
  \ 给了我一个绿色的手环，类似于兰斯·阿姆斯特朗（Lance Armstrong）广为流行的那种。上面写着“痴迷测试”（Test Obsessed）。我乐意地戴上它并自豪地展示着。自从\
  \ 1999 年向 Kent Beck 学习 TDD 以来，我确实痴迷上了测试驱动开发。\n\n但随后发生了一些事情。我发现我无法取下这个手环。不是因为它在物理上卡住了，而是因为它在*道德*上卡住了。这个手环公开表达了我的职业道德。它是我承诺编写出最好代码的视觉化体现。取掉它似乎是对这些准则和这一承诺的背叛。\n\
  \n所以它仍然戴在我的手腕上。当我写代码时，我能在余光中看到它。它不断提醒着我向自己做出的编写洁代码的承诺。\n\n![image](img/Image00120.jpg)\n\
