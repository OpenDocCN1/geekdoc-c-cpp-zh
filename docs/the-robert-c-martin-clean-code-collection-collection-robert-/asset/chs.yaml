  \n\n\n\n这并不是一次重写！我们并没有从零开始重新编写这套程序。事实上，如果你仔细观察这两个不同的程序，你会发现它们使用了相同的算法和机制来完成工作。\n\
  \n这种改变是通过编写一个测试套件实现的，该套件验证了第一个程序的 `precise` 行为。然后，我们一个接一个地进行了许多微小的改动。每次更改后，都会运行程序以确保其行为没有发生变化。通过一步接一步的微小调整，第一个程序被清理并转换成了第二个程序。\n\
  \n### 为了应对变更而进行组织\n\n对于大多数系统来说，变化是持续持续的。每一次变化都让我们面临一种风险，即系统的其余部分可能不再按预期工作。在一个整洁的系统中，我们组织类的方式是为了降低变更的风险。\n\
  \nListing 10-9 中的 `Sql` 类用于根据适当的元数据生成格式正确的 SQL 字符串。它仍处于开发阶段，因此尚未支持如 `update` 语句之类的\
  \ SQL 功能。当需要 `Sql` 类支持 `update` 语句时，我们必须“打开”这个类以进行修改。打开一个类的问题在于它引入了风险。对类的任何修改都可能破坏该类中的其他代码。它必须经过完全测试。\n\
  \n**Listing 10-9 `必须为了变更而打开的类`**\n\n```\npublic class Sql { \n    public Sql(String\
  \ table, Column[] columns)\n\n    public String create()\n\n    public String insert(Object[]\
  \ fields)\n\n    public String selectAll()\n\n    public String findByKey(String\
  \ keyColumn, String keyValue)\n\n    public String select(Column column, String\
  \ pattern)\n\n    public String select(Criteria criteria)\n\n    public String preparedInsert()\n\
  \n    private String columnList(Column[] columns)\n\n    private String valuesList(Object[]\
  \ fields, final Column[] columns)\n\n    private String selectWithCriteria(String\
  \ criteria)\n\n    private String placeholderList(Column[] columns)\n\n}\n```\n\n\
  当我们添加新类型的语句时，`Sql` 类必须发生更改。当我们更改单个语句类型的细节时，它也必须发生更改——例如，如果我们需要修改 `select` 功能以支持子查询。这两个导致变更的理由意味着\
  \ `Sql` 类违反了 SRP（单一职责原则）。\n\n我们可以从一个简单的组织角度发现这种对 SRP 的违反。`Sql` 的方法大纲显示，存在私有方法（如\
  \ `selectWithCriteria`），它们似乎只与 `select` 语句有关。\n\n仅适用于类的一小部分的私有方法行为可以作为发现潜在改进区域的有用启发。然而，采取行动的主要动力应该是系统变更本身。如果\
  \ `Sql` 类被认为在逻辑上是完整的，那么我们就不需要担心分离职责。如果在可预见的未来内不需要 `update` 功能，那么我们应该让 `Sql` 保持现状。但一旦我们发现自己正在打开一个类，就应该考虑修复我们的设计。\n\
  \n如果我们考虑像 Listing 10-10 中那样的解决方案呢？Listing 10-9 之前的 `Sql` 中定义的每个公共接口方法都被重构到它各自的 `Sql`\
  \ 类的派生类中。注意，私有方法（如 `valuesList`）直接移动到了它们需要的地方。通用的私有行为被隔离到一对工具类 `Where` 和 `ColumnList`\
  \ 中。\n\n**Listing 10-10 `一组封闭的类`**\n\n```\nabstract public class Sql {\n    public\
  \ Sql(String table, Column[] columns)\n    abstract public String generate();\n\
  }\n\npublic class CreateSql extends Sql {\n    public CreateSql(String table, Column[]\
  \ columns)\n    @Override public String generate()\n}\n\npublic class SelectSql\
  \ extends Sql {\n    public SelectSql(String table, Column[] columns)\n    @Override\
  \ public String generate()\n}\n\npublic class InsertSql extends Sql {\n    public\
  \ InsertSql(String table, Column[] columns, Object[] fields)\n    @Override public\
  \ String generate()\n    private String valuesList(Object[] fields, final Column[]\
  \ columns)\n}\n\npublic class SelectWithCriteriaSql extends Sql {\n    public SelectWithCriteriaSql(\n\
  \        String table, Column[] columns, Criteria criteria)\n    @Override public\
  \ String generate()\n}\n\npublic class SelectWithMatchSql extends Sql {\n    public\
  \ SelectWithMatchSql(\n        String table, Column[] columns, Column column, String\
  \ pattern)\n    @Override public String generate()\n}\n\npublic class FindByKeySql\
  \ extends Sql {\n    public FindByKeySql(\n        String table, Column[] columns,\
  \ String keyColumn, String keyValue)\n    @Override public String generate()\n}\n\
  \npublic class PreparedInsertSql extends Sql {\n    public PreparedInsertSql(String\
  \ table, Column[] columns)\n    @Override public String generate() {\n        private\
  \ String placeholderList(Column[] columns)\n    }\n}\n\npublic class Where {\n \
  \   public Where(String criteria)\n    public String generate()\n}\n\npublic class\
  \ ColumnList {\n    public ColumnList(Column[] columns)\n    public String generate()\n\
  }\n```\n\n每个类中的代码都变得极其简单。我们理解任何类所需的所需的理解时间减少到几乎为零。一个函数破坏另一个函数的风险变得微乎其微。从测试的角度来看，证明该解决方案中所有逻辑位的工作变成了一项更容易的任务，因为这些类之间都是相互隔离的。\n\
  \n同样重要的是，当需要添加 `update` 语句时，现有的类都不需要更改！我们在 `Sql` 的新派生类 `UpdateSql` 中编写构建 `update`\
  \ 语句的逻辑。重构后的 `Sql` 逻辑代表了最好的结果。它支持 SRP。它还支持另一种面向对象的类设计原则，即开闭原则：4。类应该是对扩展开放的，对修改关闭的。我们重构后的\
  \ `Sql` 类通过子类允许扩展，但我们可以保持其他类关闭。我们只需接入 `UpdateSql` 类即可。\n\n我们希望组织系统，以便在更新新功能时尽可能少地修改。我们通过扩展系统而不是修改现有代码来引入新功能。\n\
  \n### 隔离变更\n\n需求会变，因此代码也会变。我们在 OO 基础中中学过，具体类包含实现细节（代码），而抽象类仅表示概念。依赖具体细节的客户端类在细节更改时面临风险。我们可以引入接口和抽象类来帮助隔离这些细节的影响。\n\
  \n对具体细节的依赖为测试系统带来了挑战。如果我们正在构建 `Portfolio` 类，它依赖于外部 `TokyoStockExchange` API 来推导出组合价值，我们的测试用例就会受到这种波动的影响。当我们每五分钟得到一个不同的答案时，很难编写测试！\n\
  \n与其让 `Portfolio` 直接依赖 `TokyoStockExchange`，不如创建一个接口 `StockExchange`，它声明了一个单独的方法：\n\
  \n```\npublic interface StockExchange {\n    Money currentPrice(String symbol);\n\
  }\n```\n\n我们设计 `TokyoStockExchange` 实现此接口。我们还确保 `Portfolio` 的构造函数接收一个 `StockExchange`\
  \ 引用作为参数：\n\n```\npublic class Portfolio {\n    private StockExchange exchange;\n\
  \    public Portfolio(StockExchange exchange) {\n        this.exchange = exchange;\n\
  \    }\n    // …\n}\n```\n\n\n\n\n现在我们的测试可以创建一个 `StockExchange` 接口的可测试实现，以模拟 `TokyoStockExchange`（东京证券交易所）。这个测试实现将固定测试中使用的任何符号的当前值。如果我们的测试演示了为投资组合购买五股微软股票，我们就编写测试实现，始终为每股微软股票返回\
  \ 100 美元。我们对 `StockExchange` 接口的测试实现简化为了简单的表格查找。然后，我们可以编写一个测试，预期整个投资组合价值 500 美元。\n\
  \n```java\npublic class PortfolioTest {\n\n    private FixedStockExchangeStub exchange;\n\
  \n    private Portfolio portfolio;\n\n    @Before\n    protected void setUp() throws\
  \ Exception {\n        exchange = new FixedStockExchangeStub();\n        exchange.fix(\"\
  MSFT\", 100);\n        portfolio = new Portfolio(exchange);\n    }\n\n    @Test\n\
  \    public void GivenFiveMSFTTotalShouldBe500() throws Exception {\n        portfolio.add(5,\
  \ \"MSFT\");\n        Assert.assertEquals(500, portfolio.value());\n    }\n}\n```\n\
  \n如果一个系统的解耦程度足够可以进行这种方式进行测试，那么它也将更具活性并促进更多的重用。缺乏耦合意味着我们系统的元素彼此之间以及元素与变化之间有了更好的隔离。这种隔离使得理解系统的每个元素变得更加容易。\n\
  \n通过这种方式最小化耦合，我们的类遵循了另一个类类设计原则，即**依赖反转原则**（DIP）。本质上，DIP 说我们的类应该依赖于抽象，而不是依赖于具体的细节。\n\
  \n我们不再依赖于 `TokyoStock-Exchange` 类的实现细节，我们的 `Portfolio` 类现在依赖于 `StockExchange` 接口。`StockExchange`\
  \ 接口代表了请求符号当前价格的抽象概念。这种抽象隔离了获取此类价格的所有特定细节，包括从哪里获取该价格。\n\n### 参考文献 (Bibliography)\n\
  \n- `[[RDD]]`: *Object Design: Roles, Responsibilities, and Collaborations*, Rebecca\
  \ Wirfs-Brock et al., Addison-Wesley, 2002.\n- `[[PPP]]`: *Agile Software Development:\
  \ Principles, Patterns, and Practices*, Robert C. Martin, Prentice Hall, 2002.\n\
  - `[[Knuth92]]`: *Literate Programming*, Donald E. Knuth, Center for the Study of\
  \ language and Information, Leland Stanford Junior University, 1992.\n\n![](img/969895.jpg)\n\
  \n## 11 系统 (Systems)\n\n作者 Kevin Dean Wampler 博士\n\n![Image](img/Image00038.jpg)\n\
  \n*“复杂性杀死一切。它吸走了开发者的生命，让产品变得难以规划、构建和测试。”*\n—Ray Ozzie，微软公司首席技术官\n\n## 你会如何建造一座城市？\n\
  \n你能自己管理所有的细节吗？可能不能。即使是管理一个现有的城市对一个人来说也太重了。然而，城市是可以运行的（大多数时候）。它们之所以运行，是因为城市有团队来管理城市的特定部分：水务系统、电力系统、交通、执法、建筑规范等。其中一些人负责大局，而另一些人关注细节。\n\
  \n城市之所以能够运行，还因为它们演化出了适当的抽象层次和模块化，这使得个人和他们管理的“组件”能够有效地工作，即使在不理解大局的情况下也是如此。\n\n尽管软件团队也是这样组织的，但他们工作的系统通常并不具有相同的关注点分离和抽象层次。整洁的代码帮助我们在较低的抽象层次上实现这一点。在本章中，让我们考虑如何在更高层次的抽象——即*系统*级上保持整洁。\n\
  \n## 将系统的构建与使用分开\n\n首先，考虑构建过程与使用过程是两个完全不同的过程。当我写这些文字时，我从芝加哥的窗外看到有一座新酒店正在施工。今天，它只是一个光裸的混凝土盒子，外面栓着建筑起重机和电梯。那里忙碌的人们都戴着安全帽和工作服。一年后，酒店将完工。起重机和电梯将消失。建筑将变得整洁，包裹在玻璃窗墙和吸引的油漆中。在那里工作和居住的人们看起来也会很多不同。\n\
  \n*软件系统应该将启动过程（应用程序对象被构建以及依赖项被“接线”在一起的过程）与启动后接管的运行时逻辑分离。*\n\n启动过程是任何应用程序必须解决的关注点。这是我们在本章将检查的第一个关注点。关注点分离是我们工艺中最古老且最重要的设计技术之一。\n\
  \n遗憾的是，大多数应用程序并没有分离这个关注点。启动过程的代码是随意的，并且与运行时逻辑混合在一起。这里有一个典型的例子：\n\n```java\npublic\
  \ Service getService() {\n    if (service == null)\n        service = new MyServiceImpl(...);\
  \ // 大多数情况下足够用了？\n    return service;\n}\n```\n\n这是**懒性初始化/评估**（LAZY INITIALIZATION/EVALUATION）模式，它有几个优点。除非我们实际使用该对象，否则就不会产生构建开销，因此我们的启动时间可以更快。我们还确保了不会返回\
  \ `null`。\n\n然而，现在我们对 `MyServiceImpl` 及其构造函数所需的所有内容（我省略了）有了硬编码依赖。在解决这些依赖之前，我们无法编译，即使我们实际上使用了该对象。测试可能会成为问题。如果\
  \ `MyServiceImpl` 是一个重量级对象，我们需要确保在调用此方法之前将一个合适的**测试双胞**（TEST DOUBLE）分配给 service\
  \ 字段。由于我们将构建逻辑与正常处理混合在一起，我们应该测试所有的执行路径（例如 null 块）。同时承担这两项职责意味着该方法在做多件事，所以我们以某种方式违背了单一职责原则。\n\
  \n最糟糕的是，我们不知道 `MyServiceImpl` 在所有情况下是否都是正确的对象。我在注释中暗示了这一点。为什么拥有此方法的类必须知道全局上下文？我们真的能知道这里应该使用的正确对象吗？\n\
  \n当然，出现一次懒性初始化并不是严重的问题。然而，应用程序中通常有很多像这样的小型设置惯用法。因此，全局设置策略（如果有的话）散落在整个应用程序中，缺乏模块化，并且通常有大量的重复代码。\n\
  \n如果我们致力于构建良好且健壮的系统，我们绝不应该让细小的、方便的惯用例导致模块化的崩溃。对象构建和接线的启动过程也不例外。我们应该将此过程与正常的运行时逻辑分开模块化，并确保我们有一个全局一致的策略来解决主要的依赖。\n\
  \n### 主分离 (Separation of Main)\n\n将构建与使用分开的一种方法是将构建的所有方面简单移动到 `main` 或由 `main` 调用的模块中，并在假设所有对象都已恰善构建和接线的情况下设计系统的其他部分。（见图\
  \ 11-1。）\n\n控制流易于遵循。`main` 函数构建系统所需的对象，然后将它们传递给应用程序，应用程序只需使用它们。注意跨越 `main` 和应用程序之间边界的依赖箭头方向。它们都指向一个方向，远离\
  \ `main`。这意味着应用程序对 `main` 或构建过程一无所知。它只需要预期一切都已正确构建。\n\n### 工厂 (Factories)\n\n\n\n\
  当然，有时我们需要让应用程序来负责对象*何时*被创建。例如，在一个订单处理系统中，应用程序必须创建 `LineItem` 实例并将其添加到 `Order`（订单）中。\n\
  \n### 图 11-1 在 `main()` 中分离构造\n![Image](img/Image00039.jpg)\n\n在这种情况下，我们可以使用 `ABSTRACT\
  \ FACTORY`（抽象工厂）模式来让应用程序控制*何时*构建 `LineItems`，但将该构造的细节与应用程序代码分离开来。（参见图 11-2 ）。\n\n\
  ### 图 11-2 使用工厂的分离构造\n![Image](img/Image00040.jpg)\n\n再次注意，所有的依赖关系都从 `main` 指向 `OrderProcessing`\
  \ 应用程序。这意味着应用程序与如何构建 `LineItem` 的细节解耦了。这种能力由 `LineItemFactoryImplementation` 持有，它位于\
  \ `main` 这一侧。尽管如此，应用程序对 `LineItem` 实例何时构建具有完全的控制权，甚至可以提供特定特定的构造函数参数。\n\n#### 依赖注入\n\
  将构造与使用分离的一种强大机制是*依赖注入*（Dependency Injection，DI），即将*控制反转*（IoC）应用于依赖管理。控制反转将次要职责从一个对象转移到专门用于该目的的其他对象，从而支持了*单一职责原则*。在依赖管理的上下文中，一个对象不应该负责自己实例化依赖项。相反，它应该将此责任传递给另一个“权威”机制，从而反转控制。由于设置是一个全局性关注的问题，这个权威机制通常将是“主”例程序，或者是一个专用的*容器*（container）。\n\
  \nJNDI 查找是 DI 的一种“部分”实现，其中对象请求目录服务器提供一个与特定名称匹配的“服务”。\n\n```\nMyService myService\
  \ = (MyService)(jndiContext.lookup(“NameOfMyService”));\n```\n\n调用对象并不控制实际返回的是什么种的对象（当然，只要它实现了相应的接口），但调用对象仍然积极地解析依赖关系。\n\
  \n真正的依赖注入又进了一步。类不采取任何直接步骤来解析其依赖项；它是完全被动的。相反，它提供用于*注入*依赖项的 setter 方法或构造函数参数（或两者都有）。在构造过程中，DI\
  \ 容器会实例化所需的对象（通常是按需），并使用提供的构造函数参数或 setter 方法将依赖项连接起来。实际使用了哪些依赖对象是通过配置文件或在专用的构造模块中通过程序方式指定的。\n\
  \nSpring Framework 为 Java 提供了最著名的 DI 容器。你可以在 XML 配置文件中定义将哪些对象连接在一起，然后在 Java 代码中通过名称请求特定的对象。我们很快会看一个示例。\n\
  \n但 LAZY-INITIALIZATION（懒性初始化）的优点又如何呢？这种惯用法在 DI 中仍然是有用的。首先，大多数 DI 容器在被需要之前不会构造对象。其次，许多此类容器提供了调用工厂或构建代理的机制，这些机制可以用于\
  \ LAZY-EVALUATION（懒性求值）和类似的*优化*。\n\n### 扩展\n城市从小城镇成长，城镇从定居点成长。起初，道路很窄且几乎不存在，然后它们被铺设，随着时间的推移而加宽。较小的建筑和空地被更大的建筑填充，其中一些最终会被摩天大楼取代。\n\
  \n起初没有电力、水务、污水和互联网等服务（天哪！）。这些服务也随着人口和建筑密度的增加而加入。\n\n这种增长并不是没有痛苦的。你曾多少次在通过一个道路“改进”项目时水马龙似地开车，并问自己：“为什么他们第一次没有把它建得足够宽呢！？”但这无法以任何其他方式发生。谁能为一条穿过预见增长的小镇中心的六车道高速公路的开支辩护呢？谁会*想要*在小镇中心修建这样的高速公路？\n\
  \n“为什么他们第一次没有把它建得足够宽呢！？”这种想法认为我们无法一次性做好。相反，我们应该今天实现，通过重构和演进来让系统*增长*。这种*演进的*方法让系统能够工作。这种认为我们无法一次性好的想法是不的。软件系统的这种*可以*可以*增长*。软件系统的这种性质使得这可能。事实上，EJB1\
  \ 和 EJB2 架构没有充分分离关注点。这在关系数据中可见。因此，你需要定义本地接口。列表 11-1 显示了一个可能的本地接口：\n\n### 列表 11-1\
  \ `Bank 的 EJB 本接口`\n```java\npackage com.example.banking;\n\nimport java.util.Collections;\n\
  import javax.ejb.*;\n\npublic interface BankLocal extends javax.ejb.EJB {\n\nString\
  \ getStreet1() throws EJBException;\nString getStreet2() throws EJBException;\n\
  String getCity() throws EJBException;\nString getState() throws EJBException;\n\
  String getZipCode() throws EJBException;\nvoid setStreet1(String street1) throws\
  \ EJBException;\nvoid setStreet2(String street2) throws EJBException;\nvoid setCity(String\
  \ city) throws EJBException;\nvoid setState(String state) throws EJBException;\n\
  void setZipCode(String zip) throws EJBException;\nCollection getAccounts() throws\
  \ EJBException;\nvoid setAccounts(Collection accounts) throws EJBException;\nvoid\
  \ addAccount(AccountDTO accountDTO) throws EJBException;\n\n}\n```\n\n我展示了 `Bank`\
  \ 的几个属性以及它拥有的账户集合，每个账户都由一个独立的 `Account` EJB 处理。列表 11-2 显示了该 `Bank` bean 对应的实现类。\n\
  \n### 列表 11-2 `对应的 EJB Entity Bean 实现`\n```java\npackage com.example.banking;\n\n\
  import java.util.Collections;\nimport javax.ejb.*;\n\npublic abstract class Bank\
  \ implements javax.ejb.EntityBean {\n\n// 业务逻辑……\n\npublic abstract String getStreetAddr1();\n\
  public abstract String getStreetAddr2();\npublic abstract String getCity();\npublic\
  \ abstract String getState();\npublic abstract String getZipCode();\npublic abstract\
  \ void setStreetAddr1(String street1);\npublic abstract void setStreetAddr2(String\
  \ street2);\npublic abstract void setCity(String city);\npublic abstract void setState(String\
  \ state);\npublic abstract void setZipCode(String zip);\npublic abstract Collection\
  \ getAccounts();\npublic abstract void setAccounts(Collection accounts);\n\npublic\
  \ void addAccount(AccountDTO accountDTO) {\n\nInitialContext context = new InitialContext();\n\
  AccountHomeLocal accountHome = context.lookup(”AccountHomeLocal”);\nAccountLocal\
  \ account = accountHome.create(accountDTO);\n\nCollection accounts = getAccounts();\n\
  accounts.add(account);\n\n}\n\n}\n```\n\n\n\n\n```java\npublic abstract void setId(Integer\
  \ id);\n\npublic abstract Integer getId();\n\npublic Integer ejbCreate(Integer id)\
  \ { … }\n\npublic void ejbPostCreate(Integer id) { … }\n\n// The rest had to be\
  \ implemented but were usually empty:\n\npublic void setEntityContext(EntityContext\
  \ ctx) {}\n\npublic void unsetEntityContext() {}\n\npublic void ejbActivate() {}\n\
  \npublic void ejbPassivate() {}\n\npublic void ejbLoad() {}\n\npublic void ejbStore()\
  \ {}\n\npublic void ejbRemove() {}\n\n}\n```\n\n我还没有展示出对应的 `LocalHome` 接口（它本质上是一个用于创建对象的工厂），也没有展示你可能会添加的任何\
  \ `Bank` 查找（查询）方法。\n\n最后，你必须编写一个或多个 XML 部署描述符，用于指定到持久化存储器的对象-关系映射细节、所需的事务行为、安全约束等。\n\
  \n业务逻辑与 EJB2 应用“容器”紧密耦合。你必须对容器类型进行子类化，并且提供容器所需的许多生命周期方法。\n\n由于这种对重量级容器的耦合，隔离的单元测试非常困难。你必须对容器进行\
  \ mock（模拟），这很困难；或者花费大量时间将 EJBs 和测试部署到真实的服务器上。由于这种紧紧的耦合，在 EJB2 架构之外进行复用实际上是不可能的。\n\
  \n最后，即使是面向对象的编程也被破坏了。一个 bean 无法继承另一个 bean。注意添加新账户的逻辑。在 EJB2 bean 中，定义“数据传输对象”（DTOs）是常见的，这些对象本质上是没有任何行为的“结构体”。这通常会导致冗余类型持有本质上相同的数据，并且需要样板代码将数据从一个对象拷贝到另一个对象。\n\
  \n## 横切关注点 (Cross-Cutting Concerns)\n\nEJB2 架构在某些领域接近真正的关注点分离。例如，所需的事务、安全以及某些持久化行为是在部署描述符中声明的，与源代码无关。\n\
  \n请注意，像持久化这样的 `关注点` 往往会横越领域的自然对象边界。你希望使用通常相同的策略来持久化所有对象，例如，使用特定的 DBMS ^(6) 而不是平文件，遵循表和列的某些命名约定，使用一致的事务语义等。\n\
  \n在原则上，你可以以模块化、封装的方式推演你的持久化策略。然而在实践中，你必须将实现持久化策略的本质相同的代码分散到许多对象中。我们使用 `横切关注点`（cross-cutting\
  \ concerns）一术来描述此类关注点。同样，持久化框架可能是模块化的，我们的领域逻辑可能是模块化的。问题在于这些领域之间细粒度的 `交叉`（intersection）。\n\
  \n事实上，EJB 架构处理持久化、安全和事务的方式，“预见”了面向切编程（AOP），^(7) 这是一种用于恢复横切关注点模块化的通用方法。\n\n在 AOP\
  \ 中，称为 `切面`（aspects）的模块化构造体指定了系统中的哪些点应该以某种一致的方式修改其行为，以支持特定的关注点。这种规范是通过简洁的声明式或程序化机制完成的。\n\
  \n以持久化为例，你会声明哪些对象和属性（或其 `模式` [patterns]）应该被持久化，然后将持久化任务委托给你的持久化框架。行为修改是以`非侵入式`（noninvasively）方式进行的\
  \ ^(8)。让我们看看 Java 中的三个切面或类切面机制。\n\n### Java 代理 (Java Proxies)\n\nJava 代理适用于简单的情况，例如在单个对象或类中封装方法调用。然而，JDK\
  \ 提供的动态代理仅对接口有效。要代理类代理，你必须使用字节码操作库，如 CGLIB、ASM 或 Javassist。^(9)\n\n列表 11-3 显示了 JDK\
  \ 代理的骨架，为我们的 `Bank` 应用提供持久化支持，仅涵盖获取和设置账户列表的方法。\n\n**列表 11-3 `JDK 代理示例`**\n\n```java\n\
  // Bank.java (省略包名…)\n\nimport java.utils.*;\n\n// 银行的抽象。\n\npublic interface Bank\
  \ {\n\n    Collection<Account> getAccounts();\n\n    void setAccounts(Collection<Account>\
  \ accounts);\n\n}\n\n// BankImpl.java\n\nimport java.utils.*;\n\n// 实现抽象的“普通 Java\
  \ 对象”（POJO）。\n\npublic class BankImpl implements Bank {\n\n    private List<Account>\
  \ accounts;\n\n    public Collection<Account> getAccounts() {\n        return accounts;\n\
  \    }\n\n    public void setAccounts(Collection<Account> accounts) {\n        this.accounts\
  \ = new ArrayList<Account>();\n        for (Account account: accounts) {\n     \
  \       this.accounts.add(account);\n        }\n    }\n\n}\n\n// BankProxyHandler.java\n\
  \nimport java.lang.reflect.*;\nimport java.util.*;\n\n// 代理 API 需要的“InvocationHandler”。\n\
  \npublic class BankProxyHandler implements InvocationHandler {\n\n    private Bank\
  \ bank;\n\n    public BankHandler (Bank bank) {\n        this.bank = bank;\n   \
  \ }\n\n    // 在 InvocationHandler 中定义的方法\n    public Object invoke(Object proxy,\
  \ Method method, Object[] args)\n    throws Throwable {\n        String methodName\
  \ = method.getName();\n        if (methodName.equals(\"getAccounts”)) {\n      \
  \      bank.setAccounts(getAccountsFromDatabase());\n            return bank.getAccounts();\n\
  \        } else if (methodName.equals(\"setAccounts”)) {\n            bank.setAccounts((Collection<Account>)\
  \ args[0]);\n            setAccountsToDatabase(bank.getAccounts());\n          \
  \  return null;\n        } else {\n            …\n        }\n    }\n\n    // 这里有很多细节：\n\
  \    protected Collection<Account> getAccountsFromDatabase() { … }\n    protected\
  \ void setAccountsToDatabase(Collection<Account> accounts) { … }\n}\n\n// 其他某处…\n\
  \nBank bank = (Bank) Proxy.newProxyInstance(\n    Bank.class.getClassLoader(),\n\
  \    new Class[] { Bank.class },\n    new BankProxyHandler(new BankImpl()));\n```\n\
  \n我们定义了一个接口 `Bank`，它将被代理所*包装*，以及一个实现了业务逻辑的*普通 Java 对象*（POJO）`BankImpl`。（我们稍后会重新回到\
  \ POJO。）\n\n代理 API 需要一个 `InvocationHandler` 对象，它通过调用该对象来实现对代理代理发出的任何 `Bank` 方法。我们的\
  \ `BankProxyHandler` 使用 Java 反射 API 将通用的方法调用映射到 `BankImpl` 中的对应方法，以此此类推。\n\n这里有*大量的*代码，即使对于这个简单的例子也相对复杂。^(10)\
  \ 使用字节码操作库同样具有挑战性。这种代码的“量”和复杂度是代理的两个缺点。它们使得创建干净的代码变得困难！此外，代理没有提供一种指定系统范围内执行“点”的机制，而这对真正的\
  \ AOP 解决方案是需要的。^(11)\n\n### 纯 Java AOP 框架\n\n幸运的是，大多数代理样板代码可以由工具自动处理。代理被内部用于几个 Java\
  \ 框架，例如 Spring AOP 和 JBoss AOP，以便用纯 Java 实现切面。^(12) 在 Spring 中，你将业务逻辑编写为*普通 Java\
  \ 对象*。POJO 纯粹关注其领域。它们没有对企业框架（或任何其他领域）的依赖。因此，它们在概念上更简单，更容易进行测试驱动。这种相对简单性使得更容易确保你正确地实现了相应的用户故事，并为未来的故事维护和演进代码。\n\
  \n\n\n\n你通过声明式配置文件或 API 整合了所需的应用程序基础设施，包括持久化、事务、安全、缓存、故障转移等横切关注点等。在许多情况下，你实际上是在指定\
  \ `Spring` 或 `JBoss` 库的切面（aspects），框架透明地处理使用 Java 代理或字节码库的底层机制。这些声明驱动了依赖注入（DI）容器，由它根据需要实例化主要对象并将它们连接在一起。\n\
  \nListing 11-4 显示了一个典型的 Spring V2.5 配置文件的片段，`app.xml` ^(13)：\n\n**Listing 11-4 Spring\
  \ 2.X 配置文件**\n\n```xml\n<beans>\n…\n<bean id=\"appDataSource\"\n  class=\"org.apache.commons.dbcp.BasicDataSource\"\
  \n  destroy-method=\"close\"\n  p:driverClassName=\"com.mysql.jdbc.Driver\"\n  p:url=\"\
  jdbc:mysql://localhost:3306/mydb\"\n  p:username=\"me\"/>\n<bean id=\"bankDataAccessObject\"\
  \n  class=\"com.example.banking.persistence.BankDataAccessObject\"\n  p:dataSource-ref=\"\
  appDataSource\"/>\n<bean id=\"bank\"\n  class=\"com.example.banking.model.Bank\"\
  \n  p:dataAccessObject-ref=\"bankDataAccessObject\"/>\n…\n</beans>\n```\n\n每个“bean”（bean）都像嵌套的“俄罗斯套娃”中的一部分，一个\
  \ `Bank` 领域对象被一个数据访问对象（DAO）代理（封装），而该 DAO 又被一个 JDBC 驱动数据源所代理。（参见图 11-3。）\n\n**图 11-3**\
  \ 装饰器的“俄罗斯套娃”\n\n![Image](img/Image00041.jpg)\n\n客户端认为它正在一个 `Bank` 对象上调用 `getAccounts()`，但它实际上是在与一组嵌套的\
  \ DECORATOR（装饰器）^(14) 对象进行通信，这些对象扩展了 `Bank` POJO 的基本行为。我们可以为事务、缓存等添加其他装饰器。\n\n在应用程序中，只需要几行代码即可向\
  \ DI 容器请求 XML 文件中指定的系统顶层对象。\n\n```java\nXmlBeanFactory bf = new XmlBeanFactory(new\
  \ ClassPathResource(\"app.xml\", getClass()));\nBank bank = (Bank) bf.getBean(\"\
  bank\");\n```\n\n由于只需要极少数行 Spring 特有的 Java 代码，应用程序几乎完全与 Spring 解耦，消除了诸如 `EJB2` 等系统中所有的紧耦合问题。\n\
  \n虽然 XML 可能会冗长且难以阅读，^(15) 但这些配置文件中指定的“策略”比隐藏在视图并自动创建的复杂代理和切面逻辑要简单。这种架构极具吸引力，以至于\
  \ `Spring` 等框架导致了 `EJB` 标准 3 版本的彻底重写。`EJB3` 在很大程度上遵循了 `Spring` 模型，通过 XML 配置文件和/或\
  \ Java 5 注解声明式地支持横切关注点。\n\nListing 11-5 显示了用 `EJB3` 重写的我们的 `Bank` 对象 ^(16)。\n\n\
  **Listing 11-5 一个 EBJ3 Bank EJB**\n\n```java\npackage com.example.banking.model;\n\
  \nimport javax.persistence.*;\nimport java.util.ArrayList;\nimport java.util.Collection;\n\
  \n@Entity\n@Table(name = “BANKS\")\npublic class Bank implements java.io.Serializable\
  \ {\n    @Id @GeneratedValue(strategy=GenerationType.AUTO)\n    private int id;\n\
  \n    @Embeddable // “内联”在 Bank DB 行中的一个对象\n    public class Address {\n       \
  \ protected String streetAddr1;\n        protected String streetAddr2;\n       \
  \ protected String city;\n        protected String state;\n        protected String\
  \ zipCode;\n    }\n\n    @Embedded\n    private Address address;\n\n    @OneToMany(cascade\
  \ = CascadeType.ALL, fetch = FetchType.EAGER, mappedBy=\"bank\")\n    private Collection<Account>\
  \ accounts = new ArrayList<Account>();\n\n    public int getId() {\n        return\
  \ id;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\n\
  \    public void addAccount(Account account) {\n        account.setBank(this);\n\
  \        accounts.add(account);\n    }\n\n    public Collection<Account> getAccounts()\
  \ {\n        return accounts;\n    }\n\n    public void setAccounts(Collection<Account>\
  \ accounts) {\n        this.accounts = accounts;\n    }\n}\n```\n\n这段代码比原始的 `EJB2`\
  \ 代码清晰得多。一些实体细节仍然在这里，包含在注解中。然而，因为这些信息都不在注解之外，所以代码是整洁、清晰的，因此易于测试驱动、维护等。\n\n如果需要，可以将注解中的部分或全部持久化信息移动到\
  \ XML 部署描述符中，留下一个纯粹的 POJO。如果持久化映射细节不会频繁更改，许多团队可能会保留注解，但与 `EJB2` 相比，其副作用要少得多。\n\n\
  可以将注解中的部分或全部持久化信息移动到 XML 部署描述符中，留下一个纯粹的 POJO。\n\n### AspectJ 切面\n\n最后，通过切面分离关注点的最功能工具是\
  \ `AspectJ` 语言 ^(17)，它是 Java 的扩展，为模块化提供了“原生”支持。`Spring AOP` 和 `JBoss AOP` 提供的纯 Java\
  \ 方法对于 80%–90% 的情况已经足够。然而，接入问题通过最近引入的 Java 5 注解形式得到了部分缓解。此外，`Spring` 框架的许多功能使得缺乏切面经验的团队更容易。\n\
  \n更多信息请参见 [AspectJ ]、[Colyer ] 以及 [Spring ]。\n\n### 测试驱动系统架构\n\n通过切面方法分离关注点的威力不言而喻。如果你能够使用\
  \ POJO 编写应用程序逻辑，并使其在代码层面与任何架构解耦，那么就可以测试驱动你的架构。你可以根据需要采用新技术，使其从简单演变为复杂。没有必要进行*过度设计*（Big\
  \ Design Up Front）^(18) (BDUF)。事实上，BDUF 甚至是有害的，因为它会阻碍对变化的适应，并且由于架构选择会对后续设计产生影响。\n\
  \n建筑师必须进行 BDUF，因为一旦施工开始，对大型物理结构进行激进变革是不行的 ^(19)。尽管软件有其物理特性，但如果软件结构有效地分离了关注点，激进变革在经济上是可行的。这意味着我们可以从一个简单但解耦良好的架构开始软件项目，快速交付运行的用户故事，随着规模扩大增加更多基础设施。世界上一些大型网站通过先进的数据缓存、安全、虚拟化等技术实现了极高的可用性和性能，由于这种耦合设计在每个抽象层次和范围上都是适当简单的，这一切都是高效且灵活的。\n\
  \n\n\n\n早期的 EJB 架构只是许多过度设计且损害了关注点分离的知名 API 之一。即使是设计良好的 API，在并不真正需要时也可能是多余的。一个良好的\
  \ API 在大多数时间里应该尽可能地`消失`在视野之外，这样团队就能将大部分创作精力投入到正在实现的用户故事（user stories）上。否则，架构限制将抑制向客户高效交付最优价值。\n\
  \n回顾一下这次长长的讨论：\n\n*一个理想的系统架构由模块化的关注点领域组成，每个领域都用简单的 Java 对象（Plain Old Java Objects\
  \ 或其他对象）实现。不同的领域通过最小侵入性的切面（Aspects）或类切面工具集成在一起。这种架构可以像代码一样进行测试驱动（TDD）。*\n\n### **优化决策**\n\
  \n模块化和关注点分离使得去中心化的管理和决策成为可能。在一个足够大的系统中，无论是城市还是软件项目，没有任何人能做出所有的决策。\n\n我们都知道，将责任交给最专业的人是最好的。但我们经常忘记，`将决策推迟到最后时刻`也是最好的。这并不是懒惰或不负责任；它让我们能够根据最完善的信息做出明智的选择。过早的决策是基于次优知识做出的决策。如果我们决定得太早，我们将失去相应的客户反馈、对项目的心理反思以及对实现选择的经验。\n\
  \n*模块化关注点的 POJO 系统提供的灵活性，使我们能够根据最新的知识做出最优的、及时的决策。决策的复杂性也随之降低。*\n\n### **谨慎使用标准，当它们能增加证明的价值时**\n\
  \n建筑施工是一项令人赞叹的工程，不仅是因为新建筑建造的速度快（即使在深冬），还因为今天技术能够实现的卓越设计。建筑业是一个成熟的行业，拥有高度优化的部件、方法和标准，这些标准在几个世纪的压力下不断进化。\n\
  \n许多团队使用 EJB2 架构是因为它是标准，即使更轻量、更直接的设计已经足够。我见过有些团队痴迷于各种`被高度炒作`的标准，而丧失了为客户实现价值的焦点。\n\
  \n*标准使得复用构想和组件、招聘具有相关经验的人员、封装优秀的想法以及连接组件变得更加容易。然而，创建标准的流程有时会让行业等待得太久，某些标准也脱离了其旨在服务的采用者的真实需求。*\n\
  \n### **系统需要领域特定语言**\n\n建筑施工与大多数领域一样，已经发展出一套丰富的语言，其词汇、习语和模式能够清晰、简洁地传达关键信息。在软件领域，最近人们对创建`领域特定语言（DSLs）`产生了新的兴趣，这些是独立的、小型脚本语言，或标准语言中的\
  \ API，允许编写代码读起来像领域专家可能编写的结构化散文。\n\n良好的 DSL 最小化了领域概念与实现它的代码之间的“沟通鸿沟”，正如敏捷实践优化了团队内部以及与项目相关者之间的通信。如果你使用与领域专家相同的语言来实现领域逻辑，那么你将领域错误翻译为实现的风险就会降低。\n\
  \nDSL 使用得当时，会将抽象级别提升到代码惯用法和设计模式之上。它们允许开发者在适当的抽象层揭示代码的意图。\n\n*领域特定语言允许应用程序中的所有抽象级别和所有领域都以\
  \ POJO 的形式表达，从高层策略到低层细节。*\n\n### **结论**\n\n系统也必须整洁。侵入性的架构会淹没领域逻辑并影响灵活性。当领域逻辑被模糊时，质量就会受到损害，因为\
  \ Bug 更容易隐藏，故事也变得更难实现。如果灵活性受到损害，生产力就会下降，TDD 的收益也会消失。\n\n在所有抽象级别上，意图都应该是清晰的。只有当你编写\
  \ POJOs 并使用类切面机制来非侵入地整合其他实现关注点时，这种情况才会发生。\n\n无论你是在设计系统还是单个模块，永远不要忘记`使用可行的最简单东西`。\n\
  \n### **参考文献**\n\n**Alexander**：Christopher Alexander, *A Timeless Way of Building,*\
  \ Oxford University Press, New York, 1979.\n\n**AOSD**： Aspect-Oriented Software\
  \ Development port, [`aosd.net`](http://aosd.net)\n\n**ASM**： ASM Home Page, [`asm.objectweb.org/`](http://asm.objectweb.org/)\n\
  \n**AspectJ**： [`eclipse.org/aspectj`](http://eclipse.org/aspectj)\n\n**CGLIB**：\
  \ Code Generation Library, [`cglib.sourceforge.net/`](http://cglib.sourceforge.net/)\n\
  \n**Colyer**： Adrian Colyer, Andy Clement, George Hurley, Mathew Webster, *Eclipse\
  \ AspectJ,* Person Education, Inc., Upper Saddle River, NJ, 2005.\n\n**DSL**： Domain-specific\
  \ programming language\n\n**Fowler**： Inversion of Control Containers and Dependency\
  \ Injection\n\n**Goetz**： *Java Theory and Practice: Decorating with Proxies*\n\n\
  **Javassist**： Javassist Home Page\n\n**JBoss**： JBoss Home Page\n\n**JMock**： JMock—A\
  \ Lightweight Mock Library for Java\n\n**Kolence**： Software physics and computer\
  \ measurements, *Proceedings of the ACM annual conference—Volume 2*, Boston, Massachusetts,\
  \ pp. 1024–1040, 1972.\n\n**Spring**： *The Spring Framework*\n\n**Mezzaros07**：\
  \ *XUnit Patterns*, Gerard Mezzaros, Addison-Wesley, 2007.\n\n\n\n\n\n• 最小化类和方法的数量\n\
  \n规则按重要性顺序给出。\n\n### 简单设计规则 1：运行所有测试\n\n首先，重要的是，一个设计必须产生一个按预期运行的系统。一个系统在纸面上可能有一个完美的设计，但如果没有简单的方法来验证该系统确实按预期运行，那么所有纸面上的努力都是值得怀疑的。\n\
  \n一个经过全面测试并且始终通过所有测试的系统就是可测试的系统。这是一个显而易见的陈述，但非常重要。不可测试的系统是不可验证的。可以说，一个无法验证的系统永远不应该被部署。\n\
  \n幸运的是，使我们的系统具有可测试性会推动我们向类更小且职责单一的设计发展。符合 `SRP` 的类更容易测试。我们编写的测试越多，就越会持续向更易于测试的方向迈进。因此，确保我们的系统完全可测试有助于我们创建更好的设计。\n\
  \n紧耦合会让编写测试变得困难。因此同样，我们编写的测试越多，就越会使用像 `DIP` 的原则以及依赖注入、接口和抽象等工具来尽可能地减少耦合。我们的设计会变得更加完善。\n\
  \n值得注意的是，遵循“我们需要测试并持续运行它们”这一简单而显见的规则，会影响系统对低耦合和高内聚这两个面向对象主要目标的遵循程度。编写测试会带来更好的设计。\n\
  \n### 简单设计规则 2–4：重构\n\n一旦我们有了测试，我们就有能力保持代码和类的整洁。我们通过增量地重构代码来实现这一点。每当我们添加几行代码，我们都会停下来反思新的设计。我们刚才是降低了它的质量吗？如果是，我们就清理它并运行测试，证明我们没有破坏任何东西。拥有这些测试这一事实消除了对清理代码会破坏它的恐惧！\n\
  \n在这一重构步骤中，我们可以应用整个良好软件设计知识库中的任何内容。我们可以增加内聚、减少耦合、分离关注点、将系统关注点模块化、缩小函数和类、选择更好的名称等。这也是我们应用简单设计最后三个规则的地方：消除重复、确保表达性，以及最小化类和方法的数量。\n\
  \n### 不重复\n\n重复是良好设计系统的敌人。它代表了额外的工作、额外的风险和额外不必要的复杂性。重复以多种形式出现。看起来完全相同的代码行当然是重复。相似的代码行通常可以被处理得看起来更相似，以便更容易进行重构。重复也可以以其他形式存在，例如实现的重复。例如，我们可能在一个集合类中有两个方法：\n\
  \n```\nint size() {}\n\nboolean isEmpty() {}\n```\n\n我们可以为每个方法编写单独实现。`isEmpty` 方法可以跟踪布尔值，而\
  \ `size` 可以跟踪计数器。或者，我们可以通过将 `isEmpty` 绑定到 `size` 的定义来消除这种重复：\n\n```java\nboolean\
  \ isEmpty() {\n  return 0 == size();\n}\n```\n\n创建一个整洁的系统需要消除重复的意，即使只有几行代码。例如，考虑以下代码：\n\
  \n```java\npublic void scaleToOneDimension(\n  float desiredDimension, float imageDimension)\
  \ {\n  if (Math.abs(desiredDimension - imageDimension) < errorThreshold)\n    return;\n\
  \  float scalingFactor = desiredDimension / imageDimension;\n  scalingFactor = (float)(Math.floor(scalingFactor\
  \ * 100) * 0.01f);\n  RenderedOp newImage = ImageUtilities.getScaledImage(\n   \
  \ image, scalingFactor, scalingFactor);\n  image.dispose();\n  System.gc();\n  image\
  \ = newImage;\n}\n\npublic synchronized void rotate(int degrees) {\n  RenderedOp\
  \ newImage = ImageUtilities.getRotatedImage(\n    image, degrees);\n  image.dispose();\n\
  \  System.gc();\n  image = newImage;\n}\n```\n\n为了保持这个系统的整洁，我们应该消除 `scaleToOneDimension`\
  \ 和 `rotate` 方法之间少量的重复：\n\n```java\npublic void scaleToOneDimension(\n  float desiredDimension,\
  \ float imageDimension) {\n  if (Math.abs(desiredDimension - imageDimension) < errorThreshold)\n\
  \    return;\n  float scalingFactor = desiredDimension / imageDimension;\n  scalingFactor\
  \ = (float)(Math.floor(scalingFactor * 100) * 0.01f);\n  replaceImage(ImageUtilities.getScaledImage(\n\
  \    image, scalingFactor, scalingFactor));\n}\n\npublic synchronized void rotate(int\
  \ degrees) {\n  replaceImage(ImageUtilities.getRotatedImage(image, degrees));\n\
  }\n\nprivate void replaceImage(RenderedOp newImage) {\n  image.dispose();\n  System.gc();\n\
  \  image = newImage;\n}\n```\n\n当我们在这种微小层面上提取共性时，我们开始意识到对 `SRP` 的违反。因此，我们可能会将新提取的方法移动到另一个类。这提高了它的可见性。团队中的其他人可能会意识到这一机会，进一步抽象该新方法并在不同的上下文中复用它。这种“局部复用”可以使系统复杂性大幅缩小。理解如何实现局部复用对于实现宏观复用至关重要。\n\
  \n`TEMPLATE METHOD` 模式是移除高级别重复的常用技术。例如：\n\n```java\npublic class VacationPolicy\
  \ {\n  public void accrueUSDivisionVacation() {\n    // 根据到目前的工作小时计算假期的代码\n    //\
  \ …\n    // 确保假期符合美国最低标准的代码\n    // …\n    // 将应用到工资单的代码\n    // …\n  }\n\n  public\
  \ void accrueEuropeanVacation() {\n    // 根据到目前的工作小时计算假期的代码\n    // …\n    // 确保假期符合欧盟标准的代码\n\
  \    // …\n    // 将应用到工资单的代码\n    // …\n  }\n}\n```\n\n`accrueUSDivisionVacation`\
  \ 和 `accrueEuropeanVacation` 之间的代码大部分相同，计算最低标准的部分除外。那部分根据员工类型变化。\n\n我们可以通过应用 `TEMPLATE\
  \ METHOD` 模式消除明显的重复。\n\n```java\nabstract class VacationPolicy {\n  public void\
  \ accrueVacation() {\n    calculateVacationHours();\n    alterForLegalMinimums();\n\
  \    applyToPayroll();\n  }\n\n  private void calculateVacationHours() { /* ...\
  \ */ }\n  protected abstract void alterForLegalMinimums();\n  private void applyToPayroll()\
  \ { /* ... */ }\n}\n\nclass USVacationPolicy extends VacationPolicy {\n  @Override\n\
  \  protected void alterForLegalMinimums() { /* 美国逻辑 */ }\n}\n\nclass EUVacationPolicy\
  \ extends VacationPolicy {\n  @Override\n  protected void alterForLegalMinimums()\
  \ { /* 欧盟逻辑 */ }\n}\n```\n\n子类填充了 `accrueVacation` 算法中的“空”，提供了唯一不重复的信息。\n\n### 表达性\n\
  \n我们大多数人都有过处理复杂代码的经历。我们许多人自己也编写过复杂代码。编写我们理解的代码很容易的，因为在我们编写代码时，我们正深陷于要解决的问题之中。代码的其他维护者不会有如此深的理解。\n\
  \n软件项目的大部分成本在长期维护中。为了减少我们在引入更改时产生缺陷的可能性，能够理解系统在做什么至关重要。随着系统变得越来越复杂，开发者理解它们所需的时间越来越多，产生误解的机会也。因此，代码应该清晰地表达作者的意图。作者让代码越清晰，其他人理解的时间就越少。这将减少缺陷并降低维护成本。\n\
  \n你可以通过良好的命名来表达自己。我们希望在听到一个类或函数的名称时，在发现它的职责时不会感到惊讶。\n\n\n\n\n你也可以通过保持函数和类的短小来表达自己。短小的类和函数通常易于命名、编写和理解。\n\
  \n你还可以通过使用标准术语来表达自己。例如，设计模式在很大程度上关于通信和表现力。通过在实现这些模式的类名中使用如 `COMMAND` 或 `VISITOR`\
  \ 等标准模式名称，你可以简洁地向其他开发者描述你的设计。\n\n编写良好的单元测试也具有表现力。测试的首要目标是作为示例文档。阅读我们测试代码的人应该能够快速理解一个\
  \ `class` 的核心内容。\n\n但表达意图最重要的方式是*尝试*（try*）。很多时候，我们只让代码运行起来，就转向下一个问题，而没有花足够的时间如何如何代码对下一个人更容易阅读。记住，最可能阅读这段代码的下一个人你自己。\n\
  \n所以，请对你的工作投入一点自豪感。在每个函数和类上花一点时间。选择更好的名称，将大函数拆分为更小的函数，并且通上 care 一你所创造的东西。关心是一种宝贵的资源。\n\
  \n### 极简类与方法\n\n即使是像消除重复、代码表现力和 `SRP` 这样基础的概念，也可能做得过度。为了让类和方法尽可能小，我们可能会创建过多的微型类和方法。因此，这条规则建议我们也要保持函数和类的数量。\n\
  \n高类和方法数量有时是毫无意义的教条主义的结果。例如，考虑一种坚持为每一个 `class` 创建一个 `interface` 的编码标准。或者考虑那些坚持必须将字段和行为始终分离为数据类和行为类的开发者。这种教条主义应该应该被抵制，并采用更务实的方法。\n\
  \n我们的目标是在保持函数和类短小的同时，保持整个系统的短小。然而，请记住，这条规则是简单设计四条规则中优先级最低的。所以，虽然保持低类和函数数量很重要，但拥有测试、消除重复和表达意图更为重要。\n\
  \n### 结论\n\n是否存在一组可以替代经验的简单实践？显然没有。另一方面，本章和书中描述的实践是作者们几十年来积累的经验的结晶形式。遵循简单设计的实践可以并且确实鼓励并使开发者遵循良好的原则和模式，而这些原则模式在其他情况下可能需要多年时间才能学会。\n\
  \n### 参考文献\n\n- **[XPE ]:** *Extreme Programming Explained: Embrace Change*, Kent\
  \ Beck, Addison-Wesley, 1999.\n- **[GOF]:** *Design Patterns: Elements of Reusable\
  \ Object Oriented Software*, Gamma et al., Addison-Wesley, 1996.\n\n## 13 并发\n\n\
  作者 Brett L. Schuchert\n\n![Image](img/Image00043.jpg)\n\n*“对象是处理的抽象。线程是调度的抽象。”*\n\
  \n—James O. Coplien ^(1)\n\n编写简洁的并发程序是很的——非常困难。编写在单`thread` 中执行的代码要容易得多。编写表面看起来正常但在深层上是错误的多线程代码也很容易。这种代码在系统面临压力之前一直运行良好。\n\
  \n在本章中，我们讨论了并发编程的必要性以及它带来的困难。然后，我们提出了处理这些困难以及编写简洁并发代码的几点建议。最后，我们以与并发代码测试相关的问题结束。\n\
  \n整洁并发是一个复杂的课题，值得单独写一本书。我们在*本*书中的策略是在这里提供一个概述，并在第 317 页的“并发 II”提供更详细的教程。如果你只是对并发好奇，那么这一章对你现在足够了。如果你需要更深入地理解并发，那么你应该阅读教程。\n\
  \n### 为什么要并发？\n\n并发是一种解耦策略。它帮助我们把*做什么*与*什么时候做*解耦来。在单线程应用程序中，*做什么*和*什么时候*耦合得如此紧密，以至于整个应用程序的状态通常可以通过堆栈回溯来确定。调试此类系统的程序员可以设置一个\
  \ `breakpoint`，或一组 `breakpoints`，并通过命中了哪些断点来*知道*系统的状态。\n\n将*做什么*与*什么时候*解耦可以显著提高应用程序的吞吐量和结构。从结构角度来看，应用程序看起来像许多个协作的小计算机，而不是一个巨大的主循环。这可以使系统更容易理解，并提供了一些分离关注点的强大方法。\n\
  \n例如，考虑 Web 标准的“Servlet”模型。这些系统运行在 Web 或 EJB 容器的伞下，容器会*部分*为你管理并发。每当 Web 请求进入时，`servlets`\
  \ 就会异步执行。Servlet 程序员不需要管理所有进入的请求。*原则上*，每个 servlet 执行都存在于自己的小世界中，并与其他所有 servlet 执行解耦。\n\
  \n当然，如果那么简单的话，这一章就没有必要了。事实上，Web 容器提供的解耦远非完美。Servlet 程序员必须非常意识到非常小心，以确保他们的并发程序是正确的。尽管如此，Servlet\
  \ 模型的结构优势是显著的。\n\n但结构不是采用并发的唯一动力。某些系统具有响应时间和吞吐量限制，需要手工编写并发解决方案。例如，考虑一个单线程的信息聚合器，它从许多不同的网站获取信息并将这些信息合并为每日摘要。由于该系统是单线程的，它轮流访问每个网站，在开始下一个之前完成一个。每日运行需要在\
  \ 24 小时内执行。然而，随着越来越多的网站被加入，时间会增长，直到收集所有数据需要超过 24 小时。单线程涉及到在 `sockets` 上大量等待 I/O\
  \ 完成。我们可以通过使用一次访问多个 Web 网站的多线程算法来提高性能。\n\n或者考虑一个一次处理一个用户的系统，每个用户只需要一秒钟。该系统对于少数用户来说响应良好，但随着用户数量的增加，系统的响应时间也会增加。没有用户想排在\
  \ 150 个人后面！我们可以通过并发处理许多用户来提高系统的响应时间。\n\n或者考虑一个解释大型数据集的系统，但在处理完所有数据后才能给出完整的解决方案。也许每个数据集可以在不同的计算机上处理，这样许多数据集就可以并行处理。\n\
  \n### 迷话与误解\n\n因此，采用并发有充分的理由。然而，正如我们之前说的，并发是*困难的*。如果你不小心，可能会创造一些非常糟糕的情况。考虑这些常见的迷话和误解：\n\
  \n- *并发总是提高性能。*并发*有时*可以提高性能，但只有当存在可以在多个线程或多个处理器之间共享大量的等待时间时。这种情况都不是简单的。\n- *编写并发程序时设计不会发生改变。*事实上，并发算法的设计与单线程系统的设计会有显著不同。*做什么*与*什么时候*的解耦通常对系统结构产生巨大影响。\n\
  \n\n\n\n-   在使用如 Web 或 EJB 容器等容器工作时，理解并发问题并不重要。\n\n事实上，你最好了解你的容器到底在做什么，以及如何防止本章后面描述的并发更新和死锁问题。\n\
  \n以下是关于编写并发软件的几条平衡且合理的见解：\n\n-   并发会带来某些开销，既体现在性能上也体现在编写额外的代码上。\n-   正确的并发处理是复杂的，即使对于简单的问题也是如此。\n\
  -   并发 Bug 通常是不可重复的，因此它们往往被忽视为偶发事件 ^(2)，而不是它们本质上的缺陷。\n-   并发通常要求设计策略发生根本性的改变。\n\n\
  ## 挑战\n\n是什么让并发编程如此困难？考虑下面这个极其简单的类：\n\n```java\npublic class X {\n    private int\
  \ lastIdUsed;\n    public int getNextId() {\n        return ++lastIdUsed;\n    }\n\
  }\n```\n\n假设我们创建一个 `X` 的实例，将 `lastIdUsed` 字段设置为 42，然后在两个线程之间共享该实例。现在，假设这两个线程都调用方法\
  \ `getNextId();`，会有三种可能的结果：\n\n-   线程一获取值 43，线程二获取值 44，`lastIdUsed` 为 44。\n-   线程一获取值\
  \ 44，线程二获取值 43，`lastIdUsed` 为 44。\n-   线程一获取值 43，线程二获取值 43，`lastIdUsed` 为 43。\n\n\
  这个令人惊讶的第三种结果 ^(3) 在两个线程相互冲突时发生。这是因为两个线程在通过那行 Java 代码时有许多可能的路径，而其中某些路径会产生错误的结果。到底有多少种不同的路径？要真正回答这个问题，我们需要理解即时编译器（JIT\
  \ Compiler）对生成的字节码做了什么，并理解 Java 内存模型认为什么是原子的。\n\n一个简单的回答（仅基于生成的字节码）是，对于这两个线程在 `getNextId`\
  \ 方法中执行，有 12,870 种不同的可能执行路径 ^(4。如果 `lastIdUsed` 的类型从 `int` 变为 `long`，可能路径的数量会增加到\
  \ 2,704,156。当然，这些路径中的大多数产生有效结果。问题在于，其中某些并不会。\n\n## 并发防御原则\n\n以下是一系列保护你的系统免受并发代码问题影响的原则和技术。\n\
  \n### 单责任原则\n\nSRP ^(5) 规定，给定的方法/类/组件应该只有一个变更理由。并发设计本身就足够复杂，可以作为变更的理由，因此应该从其他代码中分离出来。遗憾的是，并发实现细节直接嵌入到其他生产代码中的情况是非常常见的。以下是几点需要考虑的：\n\
  \n-   与并发相关的代码有自己的开发、更改和调优周期。\n-   与并发相关的代码有自己的挑战，这些挑战与非并发代码不同，且通常更困难。\n-   编写错误的并发代码可能失败的方式之多，已经足够具有挑战性，无需再加上周围应用程序代码的负担。\n\
  \n**建议**：将与并发相关的代码与其他代码分离。 ^(6)\n\n### 推论：限制数据范围\n\n正如我们所见，两个线程修改共享对象的同一个字段可能会相互干扰，导致意外行为。一种解决方案是使用\
  \ `synchronized` 关键字来保护使用共享对象的代码中的关键区域。限制此类关键区域的数量是非常关重要的。共享数据可以被更新的地方越多，就越可能：\n\
  \n-   你会忘记保护其中一个或多个地方——这实际上破坏了所有修改该共享数据的代码。\n-   为了确保所有内容都得到有效保护，需要重复劳动（违反 DRY 原则\
  \ ^(7)）。\n-   确定故障源将变得困难，而故障源本身已经很难寻找了。\n\n**建议**：牢记数据封装；严格限制任何可能共享数据的访问。\n\n避免共享数据的一种方法是在某些情况下复制对象并将其视为只读。在其他情况下，可能复制对象，在这些副本中收集多个线程的结果，然后在单个线程中合并结果。\n\
  \n如果有简单的方法来避免共享对象，生成的代码产生问题的概率将小得多。你可能担心所有额外创建对象的成本。值得实验以找出这是否确实是一个问题。然而，如果使用对象的副本允许代码避免同步，那么避免内建锁（intrinsic\
  \ lock）节省的开销可能会抵消额外的创建和垃圾回收的开销。\n\n### 推论：线程应该尽可能独立\n\n考虑编写你的线程代码，使得每个线程存在于自己的世界中，不与其他任何线程共享任何数据。每个线程处理一个客户端请求，其所需的所有数据都来自非共享源并存储为局部变量。这使得每个线程的行为就像它是世界上唯一的线程一样。例如，继承\
  \ `HttpServlet` 的类接收到的所有信息都是传递给 `doGet` 和 `doPost` 方法的。只要 `Servlet` 中的代码只使用局部变量，`Servlet`\
  \ 就不会引起同步问题。当然，大多数使用 `Servlet` 的应用程序最终都会遇到共享资源。\n\n-   使用提供的安全集合。\n-   使用执行器框架执行任务。\n\
  -   尽可能使用非阻塞解决方案。\n-   某些库类不是线程安全的。\n\n### 安全集合\n\n当 Java 尚年轻时，Doug Lea 写了具有开创意义的著作\
  \ ^(8) 《Java 并发编程》(Concurrent Programming in Java)。在该书的同时，他开发了几个安全集合，这些集合后来成为了 JDK\
  \ `java.util.concurrent` 包的一部分。该包中的集合在多线程情况下是安全的且性能良好。事实上，`ConcurrentHashMap` 的实现在几乎所有情况下都优于\
  \ `HashMap`。它还允许同步并发读写，并提供了常用复合操作的方法，而这些操作通常是不线程安全的。如果部署环境是 Java 5，请从 `ConcurrentHashMap`\
  \ 开始。\n\n还有其他类型的类支持高级并发设计。以下是一些：\n\n![image](img/Image00044.jpg)\n\n**建议**：审查你可以使用的类。对于\
  \ Java 来说，熟悉 `java.util.concurrent`、`java.util.concurrent.atomic` 以及 `java.util.concurrent.locks`。\n\
  \n## 了解你的执行模型\n\n有几种不同的方式来划分并发应用程序的行为。为了讨论这些，我们需要理解一些基本定义。\n\n![image](img/Image00045.jpg)\n\
  \n\n\n\n基于这些定义，我们现在可以讨论并发编程中使用的各种执行模型。\n\n### 生产者-消费者模型\n\n一个或多个生产者线程创建某些工作并将其放入缓冲区或队列中。一个或多个消费者线程从队列中获取这些工作任务并完成它们。生产者和消费者之间的队列是一个\
  \ `bound resource`（有界资源）。这意味着生产者在写入之前必须等待队列有空闲，而消费者则必须等待直到队列中有内容可以消费。通过队列在生产者和消费者之间的协调涉及生产者和消费者之间的信号传递。生产者写入队列并信号队列不再为空；消费者从队列中读取并信号队列不再满。双方都可能等待通知以便继续执行。\n\
  \n### 读者-写者模型\n\n当你有一个共享资源，该资源主要作为读者的信息源，但偶尔会被写者更新时，吞吐量就会成为问题。强调吞吐量可能会导致饥饿和过旧信息的堆积。允许更新会影响吞吐量。协调读者以确保他们不会读取写者正在更新的内容（反之亦然）是一项艰难的平衡工作。写者往往会长时间阻塞许多读者，从而导致吞吐量问题。\n\
  \n挑战在于平衡读者和写者的需求，以满足正确操作、提供合理的吞吐量并避免饥饿。一种简单的策略是让写者等待直到没有读者才允许写者执行更新。然而，如果有持续的读者，写者将导致饥饿。另一方面，如果写者频繁且被赋予优先权，吞吐量将受到损害。找到这种平衡并避免并发更新问题正是这个问题要解决的。\n\
  \n### 哲餐问题\n\n想象许多哲学家坐在一张圆桌旁。每个哲学子的左侧都放着一把叉子。桌子中心有一大碗意大利面。哲学家不饿时花时间思考。一旦饥饿，他们就会拿起两边的叉子开始进。哲学家如果没有拿着两把叉子就无法进。如果他右边或左边的哲学家正在使用他需要的其中一把叉子，他必须等待该哲学家吃完并将叉子放下。哲学家吃完后，他会将两把叉子都放在桌子上，等待直到再次饥饿。\n\
  \n将哲学家替换为线程，将叉子替换为资源，这个问题与许多竞争资源的企业应用程序相似。除非设计设计，否则这样竞争的系统可能会遇到死锁、活锁、吞吐量和效率下降。\n\
  \n你可能会遇到的大多数并发问题都是这三个问题的变体。学习这些算法并尝试自己使用它们编写解决方案，这样当你遇到并发问题时，你会有更好的准备来解决问题。\n\n\
  **建议**：*学习这些基础算法并理解它们的解决方案。*\n\n### 警惕同步方法之间的依赖\n\n同步方法之间的依赖会导致并发代码中出现微妙的错误。Java\
  \ 语言有 `synchronized` 概念，它可以保护单个方法。然而，如果同一个共享类上有多个 `synchronized` 方法，那么你的系统可能被编写得不正确。\n\
  \n**建议**：*避免在共享对象上使用多个方法。*\n\n在某些情况下，你必须在共享对象上使用多个方法。在这种情况下，有三种方法可以让代码变得正确：\n\n\
  - **基于客户端的锁定 (Client-Based Locking)**：让客户端在调用第一个方法之前锁定服务器，并确保锁的范围包含了调用最后一个方法的代码。\n\
  - **基于服务器的锁定 (Server-Based Locking)**：在服务器内部创建一个锁定服务器的方法，调用所有方法，然后解锁。让客户端调用这个新方法。\n\
  - **适配器服务器 (Adapted Server)**：创建一个执行锁定的中间件。这是基于服务器锁的示例，其中原始服务器无法被更改。\n\n### 保持同步区域尽可能小\n\
  \n`synchronized` 关键字引入了锁。由同一锁保护的所有代码段保证在任何给定时间只有一个线程在执行它们。锁是昂贵的，因为它们会产生延迟并增加开销。所以我们不希望在代码中到处都是\
  \ `synchronized` 语句。另一方面，关键区域必须受到保护。因此，我们希望在设计代码时尽可能减少关键区域。\n\n一些笨拙的程序员试图通过让临界区域变得非常大来实现这一点。然而，将同步扩展到最小临界区域之外会增加竞争并降低性能。\n\
  \n**建议**：*让你的同步区域尽可能小。*\n\n### 编写正确的停机代码是困难的\n\n编写一个旨在保持运行并永远持续的系统，与编写一个运行一段时间后优雅关闭的程序是不同的。\n\
  \n优雅关闭可能很难做到正确。常见问题涉及死锁，线程等待一个永远不会来的信号以继续。\n\n例如，想象一个系统有一个父线程，它派生成了几个子线程，并在释放资源并关闭之前等待所有子线程结束。如果启动的线程中有一个发生了死锁会怎样？父线程将永远等待下去，系统将永远不会关闭。\n\
  \n或者考虑一个被 `instructed` 关闭的类似系统。父线程告诉所有启动的子线程放弃任务并完成。但如果有两个子线程作为生产者/消费者对运行呢？假设生产者接收到了来自父线程的信号并迅速关闭。消费者可能一直在等待来自生产者的消息，并阻塞在无法接收信号的状态中。它可能会卡在等待生产者的地方而永远不会完成。\n\
  \n这种情况并不罕见。所以，如果你必须编写涉及关闭的并发代码，请准备好花费大量时间来确保停机的正确发生。\n\n**建议**：*尽早考虑停机并尽早让它工作。花费的时间将比你预期的要长。回顾现有的算法，因为这比你想象的要难。*\n\
  \n\n\n多线程代码会导致那些“绝不会失败”的事情发生故障。大多数开发者对于线程如何与其他代码交互并没有直观的感受（包括作者自己）。多线程代码中的 Bug 可能在数千次或百万次执行中才出现一次症状。尝试重现这些系统可能会让人非常沮丧。这通常导致开发者将失败归咎于宇宙射线、硬件故障或其他偶然的“偶发事件”。最好的方法是假设偶发事件是不存在的。这些“偶发事件”被忽略的时间越长，建立建立在这些潜在错误方法之上的代码就越多。\n\
  \n**建议**：*不要将系统故障视作偶发事件。*\n\n### 先让你的非线程代码运行起来\n\n这可能看起来是显而易见的，但强化这一点并无坏处。确保代码在线程环境之外也能正常工作。通常，这意味着创建由你的线程调用的\
  \ `POJOs`。这些 `POJOs` 不感知线程，因此可以在线程环境之外进行测试。你的系统中越多的部分可以被放在此类 `POJOs` 中，效果就越好。\n\n\
  **建议**：*不要尝试同时追踪非线程 Bug 和多线程 Bug。确保你的代码在线程之外能够正常工作。*\n\n### 让你的多线程代码具有插拔性\n\n编写支持并发的代码，使其能够在多种配置下运行：\n\
  \n- 单线程、多线程、在执行时方式不异。\n- 多线程代码与真实的、也可以是测试双桩（test double）的对象交互。\n- 使用运行速度快、慢、不确定的测试双桩进行执行。\n\
  - 配置测试使其能够运行多次迭代。\n\n**建议**：*让你的基于线程的代码特别具有插拔性，以便你可以在各种配置下运行它。*\n\n### 让你的多线程代码可调优\n\
  \n获得线程的正确平衡通常需要反复尝试。在早期阶段，找到在不同配置下衡量系统性能的方法。允许线程数量易于调整。考虑允许在系统运行时进行更改。考虑根据吞吐量和系统利用率允许自动调优。\n\
  \n### 使用比处理器数量更多的线程运行\n\n当系统在任务之间切换时，事情就会发生。为了鼓励任务交换，请使用比处理器或核心数量更多的线程来运行。任务交换得越频繁，你遇到缺失临界区域或导致死锁的代码概率就越大。\n\
  \n### 在不同的平台上运行\n\n2007 年年中，我们开发了一门关于并发编程的课程。课程开发主要在 OS X 下进行。课程是在运行在虚拟机上的 Windows\
  \ XP 上演示的。用于演示失败条件的测试在 XP 环境下的失败频率并不像在 OS X 上运行时得那么频繁。\n\n在所有情况下，被测试的代码都是已知是错误的。这进一步证实了一个事实：不同的操作系统有不同的线程策略，每种策略都会影响代码的执行。多线程代码在不同环境中的表现不同。你应该在每个潜在的部署环境中运行你的测试。\n\
  \n**建议**：*尽早且频繁地所有目标平台上运行你的多线程代码。*\n\n### 对代码进行插桩以尝试强制失败\n\n并发代码中的缺陷隐藏起来是正常现象。简单的测试往往无法暴露它们。事实上，它们在正常处理期间经常被隐藏。它们可能每隔几小时、几天或几周才出现一次！\n\
  \n线程 Bug 之所以可能频率低、零发且难以重复，是因为在通过脆弱区域成千上万条可能路径中，只有极少数路径会发生失败。因此，进入失败路径的概率可能低得惊人。这使得检测和调试变得非常困难。\n\
  \n你如何增加捕获此类罕见情况的概率？你可以对代码进行插桩，通过添加对 `Object.wait()`、`Object.sleep()`、`Object.yield()`\
  \ 和 `Object.priority()` 等方法的调用，强制其以不同的顺序运行。\n\n这些方法中的每一个都可以影响执行顺序，从而增加检测缺陷的概率。损坏的代码越早、越频繁地失败就越好。\n\
  \n代码插桩有两种方案：\n\n- 手动编码\n- 自动化\n\n### 手动编码\n\n你可以手动在代码中插入对 `wait()`、`sleep()`、`yield()`\
  \ 和 `priority()` 的调用。当你测试一段特别棘手的代码时，这可能是恰当的做法。\n\n以下是这种操作的示例：\n\n```java\npublic\
  \ synchronized String nextUrlOrNull() {\n    if(hasNext()) {\n        String url\
  \ = urlGenerator.next();\n        Thread.yield(); // 为了测试而插入。\n        updateHasNext();\n\
  \        return url;\n    }\n    return null;\n}\n```\n\n插入的 `yield()` 调用将改变代码采取的执行路径，并可能导致代码在之前没有失败的地方失败。如果代码确实崩溃了，并不是因为你添加了\
  \ `yield()` 调用，而是你的代码本身就是坏的，这只是让失败变得显而易见。\n\n这种方法有很多问题：\n\n- 你必须手动找到合适的地方来这样做。\n\
  - 你如何知道在哪里放置调用以及使用哪种调用？\n- 将此类代码留在生产环境中会不必要地减慢代码速度。\n- 这是一种散弹式方法。你可能发现缺陷，也可能发现。事实上，胜算并不在你这边。\n\
  \n我们需要的是一种在测试期间这样做但在生产环境中不这样做的方法。我们还需要在不同运行之间轻松地混合配置，从而在总体上增加发现错误的机会。\n\n显然，如果我们把系统划分为对线程一无所知的\
  \ `POJOs` 和控制线程的类，那么找到合适的插桩位置将变得更容易。此外，我们还可以创建许多调用不同机制的测试。\n\n### 自动化\n\n你可以使用面向面向面的框架（Aspect-Oriented\
  \ Framework）、`CGLIB` 或 `ASM` 等工具对代码进行程序化插桩。例如，你可以使用一个带有单一方法的类：\n\n```java\npublic\
  \ class ThreadJigglePoint {\n    public static void jiggle() {\n    }\n}\n```\n\n\
  你可以在代码中的各个地方添加对它的调用：\n\n```java\npublic synchronized String nextUrlOrNull() {\n\
  \    if(hasNext()) {\n        ThreadJigglePoint.jiggle();\n        String url =\
  \ urlGenerator.next();\n        ThreadJigglePoint.jiggle();\n        updateHasNext();\n\
  \        ThreadJigglePoint.jiggle();\n        return url;\n    }\n    return null;\n\
  }\n```\n\n或者想象 `ThreadJigglePoint` 类有两个实现。第一个实现 `jiggle` 时什么都不做，并用于生产环境。第二个实现生成一个随机数，在睡眠、让出或直接通过之间进行选择。如果你带有随机抖动（jiggle）运行一千次测试，可能会根除一些缺陷。如果测试通过，你至少可以说你已经尽了尽责。虽然有点简单，但作为更复杂工具的替代，这是一个合理的选择。\n\
  \n有一个名为 `ConTest` 的工具由 IBM 开发，可以实现类似的功能，但它的实现要复杂得多。\n\n关键在于对代码进行抖动（jiggle），使得线程以不同的顺序在时间运行。良好的测试与抖动的结合可以大大增加发现错误的概率。\n\
  \n**建议**：*使用抖动策略来发现错误。*\n\n### 结论\n\n并发代码很难写对。当多个线程和共享数据混合时，原本易于理解的代码可能会变成噩梦。如果你面临编写并发代码，你需要严谨地编写清洁代码，否则将面临微妙且罕发的失败。\n\
  \n\n\n首先，遵循单一责任原则。将你的系统拆分为 `POJOs`，将线程感知代码与线程无关代码隔离开来。确保在测试线程感知代码时，你只在测试它本身，而不测试其他任何内容。这意味着你的线程感知代码应该是短小且集中的。\n\
  \n了解并发问题的可能来源：多个线程操作共享数据，或使用公共资源池。边界情况，例如优雅关闭或完成循环迭代，可能会特别棘手。\n\n学习你所使用的库并掌握基础算法。理解库提供的某些功能如何支持解决与基础算法类似的问题。\n\
  \n学习如何找到必须锁的代码区域并对其进行锁定。不要锁定不需要锁的代码区域。避免从一个锁区域调用另一个锁区域。这需要深度理解某些内容是否是共享的。将共享对象的数量和共享范围尽可能地缩小。改变带有共享数据对象的设计以适应客户端，而不是迫使客户端管理共享状态。\n\
  \n问题将会出现。那些没有尽早出现的问题通常被视为一次性事件。这些所谓的“一次性”事件通常只在负载下或看似随机的时间发生。因此，你需要在许多平台上的许多配置中反复、持续地运行与线程相关的代码。遵循\
  \ TDD（测试驱动开发）三大法则自然产生的可测试性意味着某种程度的可插拔性，这为在更广泛配置运行代码提供了必要的支持。\n\n如果你花时间对代码进行监测，将大大提高发现错误代码的机会。你可以手动进行，也可以使用某种自动化技术。尽早投入此。你希望在将线程代码投入生产环境之前，尽可能长时间运行它。\n\
  \n如果你采取整洁的方法，做正确的概率将大幅增加。\n\n### 参考文献\n\n- `[Lea99 ]`: *Concurrent Programming in\
  \ Java: Design Principles and Patterns* ，2d. ed., Doug Lea, Prentice Hall, 1999.\n\
  - `[PPP ]`: *Agile Software Development: Principles, Patterns, and Practices* ，Robert\
  \ C. Martin, Prentice Hall, 2002.\n- `[PRAG ]`: *The Pragmatic Programmer* ，Andrew\
  \ Hunt, Dave Thomas, Addison-Wesley, 2000.\n\n## 14 连续演化\n\n### 命令行参数解析器的案例研究\n\n\
  ![Image](img/Image00046.jpg)\n\n本章是连续演化的一个案例研究。你将看到一个开始良好但无法扩展的模块。然后你将看到该模块是如何被重构和清理的。\n\
  \n我们大多数人时候都不得不解析命令行参数。如果没有方便的工具类，我们就简单地遍历传入 `main` 函数的字符串数组。从各种来源可以找到几个好用的工具类，但没有一个完全符合我的需求。所以，当然，我决定编写自己的一个。我称它为：`Args`。\n\
  \n`Args` 使用非常简单。你只需要使用输入参数和格式字符串来构造 `Args` 类，然后查询 `Args` 实例来获取参数值。考虑以下简单示例：\n\n\
  **列表 14-1 `Args 的简单用法`**\n\n```java\npublic static void main(String[] args) {\n\
  \    try {\n        Args arg = new Args(“l,p#,d*”, args);\n        boolean logging\
  \ = arg.getBoolean(’l’);\n        int port = arg.getInt(’p’);\n        String directory\
  \ = arg.getString(’d’);\n        executeApplication(logging, port, directory);\n\
  \    } catch (ArgsException e) {\n        System.out.printf(“Argument error: %s\\\
  n”, e.errorMessage());\n    }\n}\n```\n\n你可以看到这有多简单。我们只需用两个参数创建 `Args` 类的实例。第一个参数是格式字符串，或模式字符串：`l,p#,d*`。它定义了三个命令行参数。第一个\
  \ `-l,` 是一个布尔参数。第二个 `-p,` 是一个整数参数。第三个 `-d,` 是一个字符串参数。`Args` 构造函数的第二个参数就是传入 `main`\
  \ 的命令行参数数组。\n\n如果构造函数在没有抛出 `ArgsException` 的情况下返回，则输入的命令行已解析，`Args` 实例已准备好查询。`getBoolean`、`getInteger`\
  \ 和 `getString` 等方法允许我们通过名称访问参数值。\n\n如果格式字符串或命令行参数本身存在问题，将会抛出 `ArgsException`。可以从异常的\
  \ `errorMessage` 方法中获取对错误的错误的方便描述。\n\n### Args 实现\n\n`Listing 14-2` 是 `Args` 类的实现。请仔细阅读。我在风格和结构上花费了大量精力，希望它值得效仿。\n\
  \n**列表 14-2 `Args.java`**\n\n```java\npackage com.objectmentor.utilities.args;\n\
  \nimport static com.objectmentor.utilities.args.ArgsException.ErrorCode.*;\n\nimport\
  \ java.util.*;\n\npublic class Args {\n    private Map<Character, ArgumentMarshaler>\
  \ marshalers;\n    private Set<Character> argsFound;\n    private ListIterator<String>\
  \ currentArgument;\n\n    public Args(String schema, String[] args) throws ArgsException\
  \ {\n        marshalers = new HashMap<Character, ArgumentMarshaler>();\n       \
  \ argsFound = new HashSet<Character>();\n        parseSchema(schema);\n        parseArguments(Arrays.asList(args));\n\
  \    }\n\n    private void parseSchema(String schema) throws ArgsException {\n \
  \       for (String element : schema.split(,”)))) {\n            char elementId\
  \ = element.charAt(0);\n            String elementTail = element.substring(1);\n\
  \            validateSchemaId(elementId);\n            if (elementTail.length()\
  \ == 0)\n                marshalers.put(elementId, new BooleanArgumentMarshaler());\n\
  \            else if (elementTail.equals(“*”))\n                marshalers.put(elementId,\
  \ new StringArgumentMarshaler());\n            else if (elementTail.equals(\"#”))\n\
