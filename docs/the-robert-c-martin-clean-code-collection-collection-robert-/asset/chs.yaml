  \n- [[COHN09]](#text00045.html_bib08_01) 第 311–312 页\n\n## 第 9 章\n法力（Manna）是幻想类和如《地下城》等角色扮演游戏中的常见资源。每个玩家都有一定量的法力，这是一种在玩家施放法术时消耗的魔法物质。法术越强大，消耗的玩家法力就越多。法力以缓慢且固定的每日速率恢复。因此，在几次施法过程中很容易就会把它用光。\n\
