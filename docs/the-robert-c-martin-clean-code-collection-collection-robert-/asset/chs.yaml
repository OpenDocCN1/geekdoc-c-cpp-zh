  \n```java\npublic class Args {\n    private String schema;\n    private Map<Character,\
  \ ArgumentMarshaler> marshalers = new HashMap<Character, ArgumentMarshaler>();\n\
  \    private Set<Character> argsFound = new HashSet<Character>();\n    private Iterator<String>\
  \ currentArgument;\n    private List<String> argsList;\n\n    public Args(String\
  \ schema, String[] args) throws ArgsException {\n        this.schema = schema;\n\
  \        argsList = Arrays.asList(args);\n        parse();\n    }\n\n    private\
  \ void parse() throws ArgsException {\n        parseSchema();\n        parseArguments();\n\
  \    }\n\n    private boolean parseSchema() throws ArgsException {\n        for\
  \ (String element : schema.split(\",\")) {\n            if (element.length() > 0)\
  \ {\n                parseSchemaElement(element.trim());\n            }\n      \
  \  }\n        return true;\n    }\n\n    private void parseSchemaElement(String\
  \ element) throws ArgsException {\n        char elementId = element.charAt(0);\n\
  \        String elementTail = element.substring(1);\n        validateSchemaElementId(elementId);\n\
  \        if (elementTail.length() == 0)\n            marshalers.put(elementId, new\
  \ BooleanArgumentMarshaler());\n        else if (elementTail.equals(\"*\"))\n  \
  \          marshalers.put(elementId, new StringArgumentMarshaler());\n        else\
  \ if (elementTail.equals(\"#\"))\n            marshalers.put(elementId, new IntegerArgumentMarshaler());\n\
  \        else if (elementTail.equals(\"##\"))\n            marshalers.put(elementId,\
  \ new DoubleArgumentMarshaler());\n        else\n            throw new ArgsException(ArgsException.ErrorCode.INVALID_FORMAT,\
  \ elementId, elementTail);\n    }\n\n    private void validateSchemaElementId(char\
  \ elementId) throws ArgsException {\n        if (!Character.isLetter(elementId))\
  \ {\n            throw new ArgsException(ArgsException.ErrorCode.INVALID_ARGUMENT_NAME,\
  \ elementId, null);\n        }\n    }\n\n    private void parseArguments() throws\
  \ ArgsException {\n        for (currentArgument = argsList.iterator(); currentArgument.hasNext();)\
  \ {\n            String arg = currentArgument.next();\n            parseArgument(arg);\n\
  \        }\n    }\n\n    private void parseArgument(String arg) throws ArgsException\
  \ {\n        if (arg.startsWith(\"-\"))\n            parseElements(arg);\n    }\n\
  \n    private void parseElements(String arg) throws ArgsException {\n        for\
  \ (int i = 1; i < arg.length(); i++)\n            parseElement(arg.charAt(i));\n\
  \    }\n\n    private void parseElement(char argChar) throws ArgsException {\n \
  \       if (setArgument(argChar))\n            argsFound.add(argChar);\n       \
  \ else {\n            throw new ArgsException(ArgsException.ErrorCode.UNEXPECTED_ARGUMENT,\
  \ argChar, null);\n        }\n    }\n\n    private boolean setArgument(char argChar)\
  \ throws ArgsException {\n        ArgumentMarshaler m = marshalers.get(argChar);\n\
  \        if (m == null)\n            return false;\n        try {\n            m.set(argChar);\n\
  \            return true;\n        } catch (ArgsException e) {\n            e.setErrorArgumentId(argChar);\n\
  \            throw e;\n        }\n    }\n\n    public int cardinality() {\n    \
  \    return argsFound.size();\n    }\n\n    public String usage() {\n        if\
  \ (schema.length() > 0)\n            return \"-[\" + schema + \"]\";\n        else\n\
  \            return \"\";\n    }\n\n    public boolean getBoolean(char arg) {\n\
  \        ArgumentMarshaler am = marshalers.get(arg);\n        boolean b = false;\n\
  \        try {\n            b = am != null && (Boolean) am.get();\n        } catch\
  \ (ClassCastException e) {\n            b = false;\n        }\n        return b;\n\
  \    }\n\n    public String getString(char arg) {\n        ArgumentMarshaler am\
  \ = marshalers.get(arg);\n        try {\n            return am == null ? \"\" :\
  \ (String) am.get();\n        } catch (ClassCastException e) {\n            return\
  \ \"\";\n        }\n    }\n\n    public int getInt(char arg) {\n        ArgumentMarshaler\
  \ am = marshalers.get(arg);\n        try {\n            return am == null ? 0 :\
  \ (Integer) am.get();\n        } catch (Exception e) {\n            return 0;\n\
  \        }\n    }\n\n    public double getDouble(char arg) {\n        ArgumentMarshaler\
  \ am = marshalers.get(arg);\n        try {\n            return am == null ? 0.0\
  \ : (Double) am.get();\n        } catch (Exception e) {\n            return 0.0;\n\
  \        }\n    }\n\n    public boolean has(char arg) {\n        return argsFound.contains(arg);\n\
  \    }\n}\n```\n\n`Args` 类的大部分更改都是删除。大量的代码从 `Args` 移动到了 `ArgsException` 中。很好。我们还将所有的\
  \ `ArgumentMarshaler` 移动到了它们自己的文件中。更棒了！\n\n良好的软件设计很大程度上就是划分——为不同的代码创建适当的地方。这种关注点的分离使得代码更容易理解和维护。\n\
  \n特别值得注意的是 `ArgsException` 的 `errorMessage` 方法。显然，将错误消息格式放在 `Args` 中违反了单一职责原则（SRP），它应该负责处理参数，而不是错误消息的格式。然而，将错误格式代码放在\
  \ `ArgsException` 中真的合理吗？\n\n坦率地说，这是一个折中。不喜欢 `ArgsException` 提供的错误消息的用户将不得不编写自己的。但提供现成的错误消息这种便利性是不容忽视的。\n\
  \n到这里我们应该非常接近章节开头提到的最终解决方案了。我把最后的转换留给你们练习。\n\n### **结论**\n\n代码能够运行是不够的。可以运行的代码往往是损坏的。仅仅满足于代码能运行的程序员是不专业的。他们可能担心没有时间改进代码的结构和设计，但我并不认同。没有什么比糟糕的代码对开发项目产生更深远、更长期的不利影响了。糟糕的进度可以重新安排，糟糕的需求可以重新定义。糟糕的团队动态可以修复。但糟糕的代码会腐烂、发酵，成为永远拖累整个团队的沉负担。\n\
  \n\n\n\n当然，坏代码是可以清理的。但这样做非常昂贵。随着代码腐烂，模块之间会相互渗透，产生许多隐藏的、纠缠的依赖关系。发现并打破旧的依赖关系是一项长期而艰巨的任务。另一方面，保持代码整洁相对容易。如果你在上午的某个模块里弄了一团糟子，下午很容易清理干净。更好的是，如果你在五分钟前刚弄了一团糟子，现在清理它非常容易。\n\
  \n因此，解决方案就是持续保持你的代码尽可能清洁和简单。永远不要让腐烂开始。\n\n## 15 JUnit 内部原理\n\n![Image](img/Image00047.jpg)\n\
  \nJUnit 是所有 Java 框架中最著名的框架之一。在框架中，它的概念简单、定义精确、实现优雅。但代码看起来是什么样子的呢？在本章中，我们将对一个摘自 JUnit\
  \ 框架的示例进行评析。\n\n### JUnit 框架\n\nJUnit 有许多作者，但它始于 Kent Beck 和 Eric Gamma 在飞往亚特兰大的大飞机上。Kent\
  \ 想学习 Java，而 Eric 想学习 Kent 的 Smalltalk 测试框架。“对于两个身处在狭小空间里的极客来说，还有什么比拿出笔记本电脑开始编码更自然的呢？”在经过三个小时的高空工作后，他们写下了\
  \ JUnit 的基础部分。\n\n我们将查看的模块是一段帮助识别字符串比较错误的精明代码。这个模块被称为 `ComparisonCompactor`。给定两个不同的字符串，例如\
  \ `ABCDE` 和 `ABXDE`，它将通过生成类似 `<…B[X]D…>` 的字符串来暴露差异。\n\n我可以进一步解释，但测试用例说明得更好。所以，请看\
  \ `Listing 15-1`，你将深入理解该模块的需求。顺便，请评析一下测试的结构。它们可以更简单或更直观吗？\n\n### Listing 15-1 `ComparisonCompactorTest.java`\n\
