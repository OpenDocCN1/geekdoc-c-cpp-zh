  \ 第 20–22 页；[[COHN2006]](#text00050.html_bib13_02) 查看索引中的速度（velocity）。\n\n## 第 14\
  \ 章\n有很多网站提供这种计算机的模拟器。\n\n我还有这本手册。它在我一个书架上占据着荣誉的位置。\n\n## 附录 A\n这些磁带只能向一个方向移动。因此，当发生读取错误时，磁带驱动器无法后回读取。你必须停止手头的工作，将磁带送回加载点，然后重新开始。这种情况每天发生两或三次。写入错误也很常见，而且驱动器无法检测到它们。因此我们总是成对写入磁带，完成后检查这些配对。如果其中一个磁带坏了，我们会立即制作副本。如果两个都坏了（这非常罕见），我们会重新开始整个操作。那就是\
  \ 70 年代的生活。\n\n- [`en.wikipedia.org/wiki/ASR-33_Teletype`](http://en.wikipedia.org/wiki/ASR-33_Teletype)\n\
