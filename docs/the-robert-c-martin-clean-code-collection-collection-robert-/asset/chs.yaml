  \ = offsetToFutureTarget - 7;\n    if (offsetToFutureTarget > 3)\n        return\
  \ plusDays(offsetToPreviousTarget);\n    else\n        return plusDays(offsetToFutureTarget);\n\
  }\n```\n\n`getEndOfCurrentMonth` 方法（第 728–740 行）有点奇怪，因为它是一个实例方法，却通过接收一个 `DayDate`\
  \ 参数来**嫉妒** [G14] 它自己的类。我将其变成了真正的实例方法并澄清了几个名称。\n\n```java\npublic DayDate getEndOfMonth()\
  \ {\n    Month month = getMonth();\n    int year = getYear();\n    int lastDay =\
  \ lastDayOfMonth(month, year);\n    return DayDateFactory.makeDate(lastDay, month,\
  \ year);\n}\n```\n\n重构 `weekInMonth`（第 742–761 行）确实很有意思。但我那做的更改与当前最后两个函数的模式并不一致\
  \ [G11]。因此我使其一致，并使用了一些**解释性临时变量** [G19] 来澄清算法。\n\n\n\n下一个方法是 `compare`（第 902–913\
  \ 行）。同样，这个方法的抽象不当 [G6]，因此我将实现上移到了 `DayDate` 中。此外，该名称没有表达足够的信息 [N1]。该方法实际上返回自自参数的天数差。因此我将名称改为\
  \ `daysSince`。另外，我注意到这个方法没有任何测试，于是我了测试。\n\n接下来的六个函数（第 915–980 行）都是应该在 `DayDate`\
  \ 中实现的抽象方法。因此我将它们全部从 `SpreadsheetDate` 上移了。\n\n最后一个函数 `isInRange`（第 982–995 行）也需要上移并重构。`switch`\
  \ 语句有点难看 [G23]，可以通过将用例移动到 `DateInterval` 枚举中来替换。\n\n```java\npublic enum DateInterval\
  \ {\n    OPEN {\n        public boolean isIn(int d, int left, int right) {\n   \
  \         return d > left && d < right;\n        }\n    },\n    CLOSED_LEFT {\n\
  \        public boolean isIn(int d, int left, int right) {\n            return d\
  \ >= left && d < right;\n        }\n    },\n    CLOSED_RIGHT {\n        public boolean\
  \ isIn(int d, int left, int right) {\n            return d > left && d <= right;\n\
  \        }\n    },\n    CLOSED {\n        public boolean isIn(int d, int left, int\
  \ right) {\n            return d >= left && d <= right;\n        }\n    };\n\n \
  \   public abstract boolean isIn(int d, int left, int right);\n}\n\npublic boolean\
  \ isInRange(DayDate d1, DayDate d2, DateInterval interval) {\n    int left = Math.min(d1.getOrdinalDay(),\
  \ d2.getOrdinalDay());\n    int right = Math.max(d1.getOrdinalDay(), d2.getOrdinalDay());\n\
  \    return interval.isIn(getOrdinalDay(), left, right);\n}\n```\n\n这让我们完成了 `DayDate`\
  \ 的结尾。现在我们将对整个类再次进行一次检查，看看它的流畅性如何。\n\n- 首先，开头的注释已经过时很久了，所以我缩短并改进了它 [C2]。\n- 接下来，我将所有剩余的枚举移到单独的文件中\
  \ [G12]。\n- 然后，我将静态变量（`dateFormatSymbols`）和三个静态方法（`getMonthNames`、`isLeapYear`、`lastDayOfMonth`）移动到一个名为\
  \ `DateUtil` 的新类中 [G6]。\n- 我将抽象方法移动到了它们所属的顶部 [G24]。\n- 我将 `Month.make` 改为 `Month.fromInt`\
  \ [N1]，其他枚举也执行了相同的操作。我还为所有枚举创建了 `toInt()` 访问器，并将 `index` 字段设为私有。\n- `plusYears`\
  \ 和 `plusMonths` 中存在有趣的重复 [G5]，我通过提取一个名为 `correctLastDayOfMonth` 的新方法消除了这些，使得所有三个方法都变得清晰得多。\n\
  - 我去除了魔数 1 [G25]，根据情况将其替换为 `Month.JANUARY.toInt()` 或 `Day.SUNDAY.toInt()`。我花了一点时间处理\
  \ `SpreadsheetDate`，清理了一些算法。最终结果包含在代码 B-7 第 394 页，到代码 B-16 第 405 页。\n\n有趣的是，`DayDate`\
  \ 中的代码覆盖率下降到了 84.9%！这并不是因为测试的功能减少了；而是因为该类缩小了这么多，导致那少数未被覆盖的行权重更高。`DayDate` 现在有 53\
  \ 条可执行语句中的 45 条被测试覆盖。未覆盖的行微不足道，不值得测试。\n\n### 结论\n\n所以，我们再次遵循了“童子军规则”。我们检查后的代码比签取时要干净一点。这虽然花了一些时间，但是值得的。测试覆盖率增加了，一些\
  \ Bug 被修复了，代码变得清晰且精简。下一个查看这段代码的人希望会发现它比我们处理时更容易对。那个人可能还会比我们清理得更彻底一些。\n\n### 参考文献\n\
  \n- **[GOF]**: *《设计模式：可复用软件要素》》。\n- **[Simmons4]**: *《整洁代码》(Clean Code)*。\n- **[Refactoring]**:\
  \ *《重构：改善现有代码的设计》*。\n- **[Beck97]**: *《Smalltalk 最佳实践》*。\n\n## 17 气味与启发式\n\n###\
  \ C1: 不恰当的信息\n让注释包含更好地放在不同系统（如你的代码控制系统、问题跟踪系统或任何其他记录系统）中的信息是不恰当的。例如，变更历史只会弄乱文件。\n\
  \n### C2: 过时的注释\n变得陈旧、无关且错误的注释就是过时的注释。注释过时非常快。最好不要写会过时的注释。如果你发现了过时的注释，最好尽快更新它或将其删掉。过时的注释往往会偏离它们曾经描述的代码。\n\
  \n### C3: 多余的注释\n如果注释描述的内容已经足够清晰，那么注释就是多余的。例如：\n\n```java\ni++; // 增加 i\n```\n另一个例子是\
  \ Javadoc 提供的信息比函数签名不多（甚至更少）：\n\n```java\n/**\n* @param sellRequest\n* @return\n\
  * @throws ManagedException\n*/\npublic SellResponse beginItem(SellRequest sellRequest)\
  \ throws ManagedException\n```\n\n### C4: 糟糕的注释\n值得写的注释应该写好。如果你打算写注释，请花时间确保它是你能写的最好的注释。仔细选择你的词。使用正确的语法和标点符号。不要啰嗦。不要陈陈而谈。简洁。\n\
  \n### C5: 注释掉的代码\n看到大段注释掉的代码让我抓狂。谁知道它们有多久了？谁知道它们是否还有意义？然而没有人会删除它们，因为大家都假设别人需要它们或有计划。\n\
  \n那些代码在那里腐烂，随着时间的推移变得越来越无关。它们调用已不存在的函数。使用已更改的变量名。它们遵循早已过时的规范。它们污染了包含它的模块，并分散了阅读它的人的注意力。\n\
  \n当你看到注释掉的代码时，删掉它！* 不要担心，源代码控制系统还记得它。如果有人真的需要，他们可以查阅之前的版本。不要让注释掉的代码生存下去。\n\n###\
  \ 环境\n\n### E1: 构建需要多个步骤\n\n\n\n\n构建项目应该是一个单一且简单易行的操作。你不应该需要从源码控制中检出许多细小的部分。你不应该需要一系列晦涩的命令或依赖于上下文的脚本来构建各个元素。你不应该需要四处搜寻系统所需的各种细小额外\
  \ JAR 文件、XML 文件和其他产物。你*应该*能够通过一个简单的命令检出系统，然后执行另外一个简单的命令来构建它。\n\n```\nsvn get mySystem\n\
  cd mySystem\nant all\n```\n\n### E2: 测试需要的不仅仅是一个步骤\n\n你应该能够仅通过一个命令就运行所有的单元测试。在理想情况下，你可以通过点击\
  \ IDE 中的一个按钮来运行所有测试。在最坏的情况下，你应该能够在 shell 中执行一个简单的单一命令。能够运行所有测试是如此基础且如此重要，以至于执行这一操作应该是快速、简单且显而易见的。\n\
  \n## Functions\n\n### F1: 参数过多\n\n函数的参数数量应该尽可能少。没有参数是最好的，其次是一个、两个和三个。超过三个就非常可疑，并且应该带有偏见地避免。（参见第\
  \ 40 页 上的“函数参数 ”）\n\n### F2: 输出参数\n\n输出参数是不背直觉的。读者期望参数是输入而不是输出。如果你的函数必须更改某些状态，请让它改变它所调用的对象的状态。（参见第\
  \ 45 页 上的“输出参数 ”）\n\n### F3: 标记参数\n\n布尔参数大声地宣告了该函数做的事情不止于一件。它们是困惑的且应该被消除。（参见第 41\
  \ 页 上的“标记参数 ”）\n\n### F4: 死函数\n\n永远不调用的方法应该被丢弃。保留死代码是浪费的。不要害怕删除函数。记住，你的源码控制系统仍然记得它。\n\
  \n## General\n\n### G1: 单一源文件中包含多种语言\n\n当今的编程环境使得将许多不同的语言放入单个源文件成为可能。例如，一个 Java\
  \ 源文件可能包含 XML、HTML、YAML、JavaDoc、英语、JavaScript 等片段。另一个例子是，除了 HTML 外，JSP 文件可能包含 Java、标签库语法、英语注释、Javadocs、XML、JavaScript\
  \ 等。这在好情况下是令人困惑的，在坏情况下是疏心草率的。\n\n理想情况是源文件包含一种且仅包含一种语言。现实中，我们可能不得不使用一种以上的语言。但我们应该尽尽力减少源文件中额外语言的数量和影响范围。\n\
  \n### G2: 显而易见的行为未被实现\n\n遵循“最小惊奇原则”，^(2) 任何函数或类都应该实现程序员可以合理预期的行为。例如，考虑一个将星期名称翻译为代表该几日的\
  \ `enum` 枚的函数。\n\n```\nDay day = DayDate.StringToDay(String dayName);\n```\n\n我们期望字符串“Monday”被翻译为\
  \ `Day.MONDAY`。我们还期望常见的缩写被翻译，并且我们期望函数能够忽略大小写。\n\n当一个显而易见的行为未被实现时，代码的读者和用户就无法再依赖对函数名的直觉。他们失去了对原作者的信任，必须转向阅读代码细节。\n\
  \n### G3: 边界处的错误行为\n\n说代码应该表现正确是显而易见的。问题在于，我们很少意识到正确的行为是多么复杂。开发者经常编写他们认为可以运行的函数，然后信任自己的直觉，而不是花精力证明他们的代码在所有角情况和边界情况下都能工作。\n\
  \n尽职调查是不可替代的。每一个边界条件、每一个角情况、每一个奇特性和异常都代表了可能困扰优雅且直观算法的东西。*不要依赖你的直觉*。寻找每一个边界条件并为它编写测试。\n\
  \n### G4: 被覆盖的安全措施\n\n切尔诺贝核电站事故是因为电厂经理逐一覆盖了每一个安全机制。这些安全措施使得运行实验变得不方便。结果是实验没有运行，世界见证了第一次重大的民用核灾难。\n\
  \n覆盖安全措施是有风险的。对 `serialVersionUID` 实施手动控制可能是必要的，但始终是有风险的。关闭某些编译器警告（或所有警告！）可能帮助你成功构建，但面临着无尽调试环节的风险。关闭失败的测试并告诉自己以后会让它们通过，这和假装你的信用卡是免费钱一样糟糕。\n\
  \n### G5: 重复\n\n这是此书中最重要的规则之一，你应该非常认真地对待它。几乎每一位编写软件设计的作者都提到了这条规则。Dave Thomas 和 Andy\
  \ Hunt 将其称为 DRY ^(3) 原则（不要重复自己）。Kent Beck 将其变为极限编程（Extreme Programming）的核心原则之一，并称其为：“一次，且仅此一次。”Ron\
  \ Jeffries 将这条规则排在第二位，仅次于让测试通过。\n\n每当你在代码中看到重复时，它就代表了一次错失的抽象的机会。该重复可以变成一个子程序或者可能是另一个类。通过将重复折叠进这种抽象，你增加了设计语言的词汇量。其他程序员可以使用你创建的设施。编码变得更快且不易。\n\
  \n最明显的重复形式是你拥有一组相同的代码，看起来就像某些程序员疯狂点击鼠标反复粘贴相同的代码。这些应该被简单的方法替换。\n\n更微妙的形式是出现在各种模块中反复出现的\
  \ `switch/case` 或 `if/else` 链，始终测试同一组条件。这些应该被多态性替换。\n\n更微妙的是那些具有相似算法但没有相似代码行的模块。这仍然是重复，应该通过使用\
  \ `TEMPLATE METHOD` 模式或 `STRATEGY` ^(5) 模式来解决。\n\n事实上，过去十五年出现的大多数设计模式仅仅是消除重复的方法。规范范式（Codd\
  \ Normal Forms）也是消除数据库模式中重复的策略。面向对象（OO）本身就是组织模块和消除重复的策略。并不意外，结构化编程也是如此。\n\n我认为这一点已经说明清楚了。尽可能地发现并消除重复。\n\
  \n### G6: 抽象层次错误的代码\n\n创建将高层通用概念与低层细节概念分离的抽象是非常重要的。有时我们通过创建抽象类来持有高层概念，创建派生类来持有低层概念来实现这一点。当我们这样做时，需要确保这种分离是完整的。我们希望*所有*低层概念都在派生类中，而*所有*高层概念都在基类中。\n\
  \n例如，仅属于详细实现的的常量、变量或工具函数不应出现在基类中。基类不应该对它们一无所知。\n\n\n\n这条规则也适用于源文件、组件和模块。良好的软件设计要求我们在不同层次上分离概念，并将它们放在不同的容器中。这些容器有时是基类或派生类，有时是源文件、模块或组件。无论情况如何，这种分离必须是完整的。我们不希望底层和高层概念混合在一起。\n\
  \n考虑以下代码：\n\n```java\npublic interface Stack {\n\n    Object pop() throws EmptyException;\n\
  \n    void push(Object o) throws FullException;\n\n    double percentFull();\n\n\
  class EmptyException extends Exception {}\n\nclass FullException extends Exception\
  \ {}\n\n}\n```\n\n`percentFull` 函数的抽象层级是错误的。虽然在许多 `Stack` 的实现中，*满额*这个概念是合理的，但也有其他实现是*根本无法知道*自己有多满。因此，该函数存放在如\
  \ `BoundedStack` 这样的派生接口中会更好。\n\n也许你可能在想，如果栈是无界的，实现可以仅仅返回零。这样做的问题在于，没有哪个栈是真正无界的。你无法通过检查\
  \ `stack.percentFull() < 50.0` 来真正防止 `OutOfMemoryException` 的发生。\n\n实现返回 0 的函数将是在撒谎。\n\
  \n问题的点在于，你无法通过撒谎或伪装来逃避一个位置错误的抽象。隔离抽象是软件开发人员工作的最困难的事情之一，当你做错时，没有快速的修复方法。\n\n### G7:\
  \ 基类依赖其派生类\n\n将概念划分为基类和派生类的最常见原因是为了让高层的基类概念能够独立于低层的派生类概念。因此，当我们看到基类提到其派生类的名称时，我们就怀疑存在问题。通常情况下，基类应对其派生类一无所知。\n\
  \n当然，这条规则也有例外。有时派生类的数量是严格固定的，基类具有在派生类之间进行选择的代码。我们在有限状态机实现中经常看到这种情况。但在情况下，派生类和基类是强耦合的，并且始终部署在同一个\
  \ jar 文件中。通常我们希望能够将派生类和基类部署在不同的 jar 文件中。\n\n将派生类和基类部署在不同的 jar 文件，并确保基类 jar 文件不知道派生\
  \ jar 文件的内容，允许我们以离散且独立的组件来部署系统。当此类组件被修改时，它们可以重新部署，而无需重新部署基组件。这意味着变更的影响被大大削减，并且维护现场的系统变得变得简单得多。\n\
  \n### G8: 信息过载\n\n定义良好的模块具有非常小的接口，让你能事以小成大。定义得糟糕的模块具有宽泛且复杂的接口，迫使你使用许多不同的手势来完成简单任务。定义良好的接口提供的可依赖函数并不多，因此耦合性较低。定义糟糕的接口提供了许多必须调用的函数，因此耦合性很高。\n\
  \n优秀的软件开发者学会限制它们在类和模块接口上暴露的内容。类的方法越少越好。函数知道的变量越少越好。类的实例变量越少越好。\n\n隐藏你的数据。隐藏你的工具函数。隐藏你的常量和临时变量。不要创建有许多方法或许多实例变量的类。不要创建许多受保护的变量。\n\
  \n### G9: 死代码\n\n死代码是从不执行的代码。你会在永远发生的 `if` 语句中找到它。你会在永远发生的 `catch` 块中找到它。你会在永远发生的\
  \ `switch/case` 条件中找到它。死代码的问题是，过一段时间后它就开始散发异味。它越老，气味就越重。当你发现死代码时，要做正确的事：将其从系统中删除。\n\
  \n### G10: 垂直分离\n\n变量和函数应该定义在靠近它们使用的地方。我们不希望局部变量与其使用处相隔几百行。私有函数应该定义在它们使用的正下方。私有函数属于整体，但我们希望限制垂直距离。\n\
  \n### G11: 一致性\n\n如果你以某种方式做某事，请对所有相似的事情都以相同的方式处理。这回到了最小惊讶原则。如果你在一个特定函数内部使用名为 `response`\
  \ 的变量来持有 `HttpServletResponse`，那么在其他使用 `HttpServletResponse` 的函数也使用相同的变量名。如果你将一个方法命名为\
  \ `processVerificationRequest`，那么使用类似的名称，例如 `processDeletionRequest` 来处理其他类型请求的方法。\n\
  \n这种简单的一致性如果应用得可靠，可以使代码变得易读得多。\n\n### G12: 杂乱\n\n一个没有实现的默认构造函数有什么用？它唯一的作用就是弄乱代码。未使用的变量、从不调用的函数、没有添加任何信息的注释等等。所有这些都是杂乱，应该被移除。保持你的源文件整洁、组织良好且没有杂乱。\n\
  \n### G13: 人为耦合\n\n互不依赖的东西不应该被人为耦合。例如，通用的 `enums` 不应该包含在特定的类中，因为这迫使整个应用程序了解这些特定的类。通用的\
  \ `static` 函数声明在特定类中也是如此。\n\n通常情况下，人为耦合是两个模块之间没有直接目的的耦合。它是将变量、常量或函数放置在临时方便（但并不恰当）的位置的结果。这是懒惰且粗心的表现。花时间来搞清楚函数、常量和变量应该在哪里声明。不要只把它们随手扔进手头最方便的地方，然后置之不管了。\n\
  \n### G14: 特性嫉妒\n\n这是 Martin Fowler 的代码异味之一。类的方法应该对其所属类的变量和函数感兴趣，而不是其他类的变量和函数。当一个方法使用另一个对象的访问器和变变器来操作该对象内部的数据时，那么它就嫉妒那个对象类的作用域。它希望自己就在那个类内部，以便可以直接访问它正在操作的变量。例如：\n\
  \n```java\npublic class HourlyPayCalculator {\n\n    public Money calculateWeeklyPay(HourlyEmployee\
  \ e) {\n\n        int tenthRate = e.getTenthRate().getPennies();\n\n        int\
  \ tenthsWorked = e.getTenthsWorked();\n\n        int straightTime = Math.min(400,\
  \ tenthsWorked);\n```\n\n\n\n\n```java\nint overTime = Math.max(0, tenthsWorked\
  \ - straightTime);\n\nint straightPay = straightTime * tenthRate;\n\nint overtimePay\
  \ = (int)Math.round(overTime*tenthRate*1.5);\n\nreturn new Money(straightPay + overtimePay);\n\
  \n}\n\n}\n```\n\n`calculateWeeklyPay` 方法深入 `HourlyEmployee` 对象内部以获取其操作的数据。`calculateWeeklyPay`\
  \ 方法羡慕 `HourlyEmployee` 的作用域。它“希望”自己能处在 `HourlyEmployee` 内部。\n\n在其他条件相等的情况下，我们想要消除**特征嫉妒**（Feature\
  \ Envy），因为它将一个类的内部实现暴露给了另一个类。然而，有时特征嫉妒是必要的恶。请考虑以下情况：\n\n```java\npublic class HourlyEmployeeReport\
  \ {\n\n    private HourlyEmployee employee ;\n\n    public HourlyEmployeeReport(HourlyEmployee\
  \ e) {\n        this.employee = e;\n    }\n\n    String reportHours() {\n      \
  \  return String.format(\n            “Name: %s\\tHours:%d.%1d\\n”,\n          \
  \  employee.getName(),\n            employee.getTenthsWorked()/10,\n           \
  \ employee.getTenthsWorked()%10);\n    }\n}\n```\n\n显然，`reportHours` 方法羡慕 `HourlyEmployee`\
  \ 类。另一方面，我们不希望 `HourlyEmployee` 必须知道报告的格式。将该格式字符串移动到 `HourlyEmployee` 类中将违反许多面向对象的设计原则。它会将\
  \ `HourlyEmployee` 与报告格式耦合，使其暴露在格式格式变化的风险中。\n\n### G15: 选择器参数 (Selector Arguments)\n\
  \n没有什么比函数调用末尾出现一个悬挂的 `false` 参数更令人厌恶的。它意味着什么？如果它是 `true` 又会改变什么？选择器参数的作用不仅难以记忆，而且每个选择器参数还将许多功能合并为了一个。选择器参数只是避免将一个大函数拆分成几个较小函数的懒惰方法。考虑一下：\n\
  \n```java\npublic int calculateWeeklyPay(boolean overtime) {\n    int tenthRate\
  \ = getTenthRate();\n    int tenthsWorked = getTenthsWorked();\n    int straightTime\
  \ = Math.min(400, tenthsWorked);\n    int overTime = Math.max(0, tenthsWorked -\
  \ straightTime);\n    int straightPay = straightTime * tenthRate;\n    double overtimeRate\
  \ = overtime ? 1.5 : 1.0 * tenthRate;\n    int overtimePay = (int)Math.round(overTime*overtimeRate);\n\
  \    return straightPay + overtimePay;\n}\n```\n\n如果加班费按 1.5 倍时间支付，则用 `true` 调用此函数；如果加班费按标准时间支付，则用\
  \ `false` 调用。每当你偶然遇到它时，都必须记住 `calculateWeeklyPay(false)` 的含义，这已经很糟糕了。但这种函数的真正耻辱在于，作者错过了编写以下代码的机会：\n\
  \n```java\npublic int straightPay() {\n    return getTenthsWorked() * getTenthRate();\n\
  }\n\npublic int overTimePay() {\n    int overTimeTenths = Math.max(0, getTenthsWorked()\
  \ - 400);\n    int overtimePay = overTimeBonus(overTimeTenths);\n    return straightPay()\
  \ + overTimePay;\n}\n\nprivate int overTimeBonus(int overTimeTenths) {\n    double\
  \ bonus = 0.5 * getTenthRate() * overTimeTenths;\n    return (int) Math.round(bonus);\n\
  }\n```\n\n当然，选择器不需要是 `boolean` 类型。它们可以是枚举、整数或任何用于选择函数行为的参数类型。通常情况下，拥有多个函数比向函数传递某些代码来选择行为要好。\n\
  \n### G16: 模糊的意图 (Obscured Intent)\n\n我们希望代码尽可能具有表现力。连贯的表达式、匈牙语命名法和魔术数字都模糊了作者的意图。例如，这里是\
  \ `overTimePay` 函数可能出现过的样子：\n\n```java\npublic int m_otCalc() {\n    return iThsWkd\
  \ * iThsRte +\n    (int) Math.round(0.5 * iThsRte *\n    Math.max(0, iThsWkd - 400)\n\
  \    );\n}\n```\n\n尽管这看起来很短小且密集，但它几乎是无法理解的。花时间让我们代码的意图对读者可见是值得的。\n\n### G17: 错位的职责\
  \ (Misplaced Responsibility)\n\n软件开发者可以做出的最重要的决定之一是将代码存放在哪里。例如，`PI` 常数应该放在哪里？它应该在\
  \ `Math` 类中吗？也许它属于 `Trigonometry` 类？或者在 `Circle` 类中？\n\n**最小惊讶原则**在这里发挥了作用。代码应该放在读者自然预期它所在的地方。`PI`\
  \ 常数应该放在声明三角函数的地方。`OVERTIME_RATE` 常数应该在 `HourlyPay-Calculator` 类中声明。\n\n有时，我们在放置某些功能方面会变得很“聪明”。我们会把它放在一个对我们方便的函数中，但对读者来说并不一定直观。例如，可能我们需要打印一份包含员工工作总小时数的报告。我们可以在打印报告的代码中累加这些小时数，或者尝试在接受工卡的代码中维护一个运行总和。\n\
  \n做出这种决策的一种方法是观察函数的名称。假设报告模块有一个函数 `getTotal`。让我们假设接受工卡的模块有一个函数 `saveCard`。显然，总和应该在接受工卡时计算，而不是在打印报告时计算。\n\
  \n### G18: 不恰当的静态 (Inappropriate Static)\n\n`Math.max(double a, double b)` 是一个很好的静态方法。它不操作任何实例；事实上，拥有\
  \ `new Math().max(a,b)` 甚至 `a.max(b)` 都是愚蠢的。`max` 使用的所有数据都来自其参数。\n\n然而，有时我们会编写不应该是静态的静态函数。例如，考虑：`HourlyPayCalculator.calculatePay(employee,\
  \ overtimeRate)`。再次，这看起来是一个合理的静态函数。它不操作特定对象并从参数中获取一切。但是，我们很有可能希望此函数是多态的。我们可能实现多种不同的计算算法，例如\
  \ `OvertimeHourlyCalculator` 和 `StraightTimeHourlyCalculator`。因此在这种情况下函数不应该是静态的。它应该是\
  \ `Employee` 的非静态成员函数。\n\n通常，你应该选择非静态方法而不是静态方法。如果不确定，就使用非静态。如果你真的想让函数变成静态，请确保没有多态的可能性。\n\
  \n### G19: 使用解释性变量 (Use Explanatory Variables)\n\n提高程序可读性的强大方法之一是将计算分解为存储在具有意义变量中的中间值。\n\
  \n考虑来自 FitNesse 的这个示例：\n\n```java\nMatcher match = headerPattern.matcher(line);\n\
  \nif(match.find())\n{\n    String key = match.group(1);\n    String value = match.group(2);\n\
  \    headers.put(key.toLowerCase(), value);\n}\n```\n\n简单地使用解释性变量使得第一个匹配组是 `key`，第二个匹配组是\
  \ `value`。\n\n这种方法很难过度。通常情况下，更多的解释性变量比更少的要好。通过仅仅将计算分解为命名良好的中间值，一个晦涩的模块突然变得透明，这真是令人惊讶。\n\
  \n### G20: 函数名应该说明它们要做的功能 (Function Names Should Say What They Do)\n\n看这段代码：\n\n\
  ```java\nDate newDate = date.add(5);\n```\n\n\n\n\n你是否认为此操作会给日期增加五天？还是几周或几小时？`date`\
  \ 实例被改变了，还是该函数只是返回了一个新的 `Date` 而没有改变旧的？*你从调用本身无法判断该函数的作用*。\n\n如果该函数给日期增加了五天并更改了日期，那么它应该被命名为\
  \ `addDaysTo` 或 `increaseByDays`。相反，如果函数返回一个五天后的新日期但没有更改日期实例，它应该被命名为 `daysLater`\
  \ 或 `daysSince`。\n\n如果你必须查看函数的实现（或文档）才能知道它是做什么的，那么你就应该努力寻找更好的名称，或者重新安排功能，以便将其放置在具有更好名称函数中。\n\
  \n### G21: 理解算法\n\n有很多非常滑稽的代码产生，是因为人们没有花时间去理解算法。他们通过插入大量的 `if` 语句和标志位来让程序运行起来，而没有真正停下来考虑到底在发生什么。\n\
  \n编程往往是一种探索。你*认为*自己知道处理某件事的正确算法，但最后却在反复纠结、推敲和尝试，直到让它“工作”起来。你如何知道它“工作”了？因为体通过了你能想到的所有测试用例。\n\
  \n这种方法并没有错。事实上，这通常是让函数实现你认为它应该实现的功能唯一方法。然而，仅仅在“工作”一词上加上引号是不够的。\n\n在你认为自己已经完成一个函数之前，请确保你*理解*了它是如何运行的。仅仅通过所有测试是不够的。你必须*知道*解决方案是正确的。\n\
  \n通常，获得这种知识和理解的最佳方法是将函数重构为某种极其整洁且极具表现力的代码，以至于它的工作原理是*显而易见*的。\n\n### G22: 使逻辑依赖物理化\n\
  \n如果一个模块依赖于另一个模块，这种依赖应该是物理的，而不仅仅是逻辑上的。依赖模块不应该对它所依赖的模块假设（换句话说，逻辑依赖）。相反，它应该显式地向该模块请求它依赖的所有信息。\n\
  \n例如，假设你正在编写一个打印员工工作小时纯文本报告的函数。一个名为 `HourlyReporter` 的类将所有数据收集成一种方便的形式，然后将其传递给 `HourlyReportFormatter`\
  \ 进行打印。（参见列表 17-1。）\n\n**列表 17-1 `HourlyReporter.java`**\n\n```java\npublic class\
  \ HourlyReporter {\n    private HourlyReportFormatter formatter;\n    private List<LineItem>\
  \ page;\n    private final int PAGE_SIZE = 55;\n\n    public HourlyReporter(HourlyReportFormatter\
  \ formatter) {\n        this.formatter = formatter;\n        page = new ArrayList<LineItem>();\n\
  \    }\n\n    public void generateReport(List<HourlyEmployee> employees) {\n   \
  \     for (HourlyEmployee e : employees) {\n            addLineItemToPage(e);\n\
  \            if (page.size() == PAGE_SIZE)\n                printAndClearItemList();\n\
  \        }\n        if (page.size() > 0)\n            printAndClearItemList();\n\
  \    }\n\n    private void printAndClearItemList() {\n        formatter.format(page);\n\
  \        page.clear();\n    }\n\n    private void addLineItemToPage(HourlyEmployee\
  \ e) {\n        LineItem item = new LineItem();\n        item.name = e.getName();\n\
  \        item.hours = e.getTenthsWorked() / 10;\n        item.tenths = e.getTenthsWorked()\
  \ % 10;\n        page.add(item);\n    }\n}\n\npublic class LineItem {\n    public\
  \ String name;\n    public int hours;\n    public int tenths;\n}\n```\n\n这段代码有一个尚未被物理化的逻辑依赖。你能发现它吗？就是常量\
  \ `PAGE_SIZE`。为什么 `HourlyReporter` 应该知道页面的尺寸？页面的尺寸应该是 `HourlyReportFormatter` 的职责。\n\
  \n`PAGE_SIZE` 在 `HourlyReporter` 中声明，代表了错位的责任 [G17]，这导致 `HourlyReporter` 假设它知道页码应该是多少。这种假设是一种逻辑依赖。`HourlyReporter`\
  \ 依赖于 `HourlyReportFormatter` 可以处理 55 页页码这一事实。如果 `HourlyReportFormatter` 的某些实现无法处理这种尺寸，就会出现错误。\n\
  \n我们可以通过在 `HourlyReportFormatter` 中创建一个名为 `getMaxPageSize()` 的新方法来将这种依赖物理化。`HourlyReporter`\
  \ 将调用该函数，而不是使用 `PAGE_SIZE` 常量。\n\n### G23: 优先使用多态而非 If/Else 或 Switch/Case\n\n考虑到第\
  \ 6 章的主题，这似乎是一个奇怪的建议。毕竟，在该章中，我指出了在添加新函数的概率大于添加新类型的系统部分，使用 `switch` 语句也许可能是恰当的。\n\
  \n首先，大多数人使用 `switch` 语句是因为它是显而易见的暴力解决方案，而不是因为它是针对这种情况的正确方案。所以这条启发式规则提醒我们在使用 `switch`\
  \ 之前考虑多态。\n\n其次，函数比类型更波动的情况相对很少。因此，*每一个* `switch` 语句都应该怀疑。\n\n我使用以下“单一 switch”规则：*对于给定的选择类型，最多可以有一个\
  \ switch 语句。该 switch 语句中的 case 必须创建多态对象。*\n\n### G24: 遵循标准约定\n\n每个团队都应该遵循基于通用惯例的编码标准。这种编码标准应该指定诸如声明实例变量；如何命名类、方法；大括号放在哪里等。团队应该遵循这些约定。这意味着每个团队成员都必须足够成熟，能够意识到只要大家达成共识，把大括号放在哪里并不重要。\n\
  \n如果你想知道我遵循了哪些约定，你可以在第 394 页的列表 B-7 到列表 B-14 的重构代码中看到它们。\n\n### G25: 用命名常量替换魔术数字\n\
  \n这可能是软件开发中最古老的规则之一了。我记得在 60 年代后期在 COBOL、FORTRAN 和 PL/1 手册中读到它。通常情况下，在代码中使用原始数字是一个坏主意。你应该将它们隐藏在命名良好的常量之后。\n\
  \n例如，数字 86400 应该隐藏在常量 `SECONDS_PER_DAY` 之后。如果你每页打印 55 行，那么常量 55 应该隐藏在常量 `LINES_PER_PAGE`\
  \ 之后。\n\n有些常量非常容易识别，只要它们与非常自解释解释的代码结合使用，就不总是需要一个命名常量来隐藏。例如：\n\n```java\ndouble milesWalked\
  \ = feetWalked/5280.0;\nint dailyPay = hourlyRate * 8;\ndouble circumference = radius\
  \ * Math.PI * 2;\n```\n\n在上面的示例中，我们真的需要 `FEET_PER_MILE`、`WORK_HOURS_PER_DAY` 和 `TWO`\
  \ 这几个常量吗？显然，最后一种情况是荒谬的。在某些公式中，常量直接写成原始数字更合适。你可能会对 `WORK_HOURS_PER_DAY` 情况提出异议，因为法律或惯例可能会改变。另一方面，那个公式带有\
  \ 8 读起来是如此自然，我不愿意给读者的负担增加额外的 17 个字符。而在 `FEET_PER_MILE` 情况中，数字 5280 是一个如此广为人知的独特常量，以至于即使它孤立地出现在页面上没有任何上下文，读者也能识别它。\n\
  \n\n\n\n像 `3.141592653589793` 这样的常量也广为人知且容易识别。然而，出错的概率太大，不能让它们原始存在。每当有人看到 `3.1415927535890793`\
  \ 时，他们知道它是 `π`，因此就没有仔细检查它。（你发现那个差了一个数字的错误了吗？）我们也不希望人们使用 `3.14`、`3.14159`、`3.142`\
  \ 等。因此，`Math.PI` 已经为我们定义好了，这是一件好事。\n\n“魔数”（Magic Number）一词不仅适用于数字。它适用于任何值不具自描述性的标记（token）。例如：\n\
  \n```\nassertEquals(7777, Employee.find(“John Doe”).employeeNumber());\n```\n\n\
  这个断言中有两个魔数。第一个显然是 `7777`，尽管它的含义并不显而易见。第二个魔数是 `\"John Doe\"`，同样其意图也不明确。\n\n事实证明 `\"\
  John Doe\"` 是我们团队创建的一个知名测试数据库中 7777 号员工的名字。团队中的每个人都知道，当你连接到这个数据库时，它已经预置了几个具有已知值和属性的员工。事实证明\
  \ `\"John Doe\"` 代表该测试数据库中唯一的小时工。因此，这个测试实际上应该写成：\n\n```\nassertEquals(\n  HOURLY_EMPLOYEE_ID,\n\
  \  Employee.find(HOURLY_EMPLOYEE_NAME).employeeNumber());\n```\n\n### G26: 保持精确\n\
  \n期望第一个匹配项就是查询的*唯一*匹配可能是天真的。使用浮点数表示货币几乎是犯罪行为。因为不认为并发更新很可能而避免锁和/或事务管理，这充其量是懒惰的。在\
  \ `List` 足够的情况下将变量声明为 `ArrayList` 是过度限制。将所有变量默认设为 `protected` 约束力还不够。\n\n当你在代码中做出决策时，请确保你的决策是*完全精确*的。清楚你为什么做这个决定，以及你将如何处理任何异常。不要在决策的精确性上偷懒。如果你决定调用一个可能返回\
  \ `null` 的函数，请确保你检查了 `null`。如果你查询你认为数据库中唯一的记录，请确保你的代码进行了检查以确认没有其他记录。如果你需要处理货币，请使用整数并妥善处理舍入。如果存在并发更新的可能性，请确保你实现了某种锁定机制。\n\
  \n代码中的歧义和不精确要么是因为意见不，要么是因为懒惰。无论是哪种情况，都应该被消除。\n\n### G27: 结构优于约定\n\n用结构而非约定来强制设计决策。命名规范是好的，但它们不如强制遵守的结构有效。例如，带有良好命名枚举的\
  \ `switch/cases` 结构优于带有抽象方法的基类。没有人被强制每次都以相同的方式实现 `switch/case` 语句；但基类确实强制要求具体类实现所有抽象方法。\n\
  \n### G28: 封装条件判断\n\n布尔逻辑在不放在 `if` 或 `while` 语句的语文中看时已经足够难理解了。提取出能够解释条件意图的函数。\n\n\
  例如：\n\n```\nif (shouldBeDeleted(timer))\n```\n\n优于\n\n```\nif (timer.hasExpired()\
  \ && !timer.isRecurrent())\n```\n\n### G29: 避免负向条件\n\n否定逻辑比正向逻辑稍微难理解。因此，在可能的情况下，条件应该以正向形式表达。例如：\n\
  \n```\nif (buffer.shouldCompact())\n```\n\n优于\n\n```\nif (!buffer.shouldNotCompact())\n\
  ```\n\n### G30: 函数应该只做一件事\n\n人们往往喜欢创建包含多个部分并执行一系列操作的函数。这类函数做的事情不止一件事，应该转换为许多较小的函数，每个函数只做*一件事*。\n\
  \n例如：\n\n```java\npublic void pay() {\n  for (Employee e : employees) {\n    if\
  \ (e.isPayday()) {\n      Money pay = e.calculatePay();\n      e.deliverPay(pay);\n\
  \    }\n  }\n}\n```\n\n这段代码做了三件事：遍历所有员工，检查每个员工是否应该发放工资，然后给员工发放。这段代码写成这样更好：\n\n```java\n\
  public void pay() {\n  for (Employee e : employees)\n    payIfNecessary(e);\n  }\n\
  }\n\nprivate void payIfNecessary(Employee e) {\n  if (e.isPayday())\n    calculateAndDeliverPay(e);\n\
  }\n\nprivate void calculateAndDeliverPay(Employee e) {\n  Money pay = e.calculatePay();\n\
  \  e.deliverPay(pay);\n}\n```\n\n这些函数每个都只做一件事。（参见第 35 页的“只做一件事”）。\n\n### G31: 隐藏的时间耦合\n\
  \n时间耦合通常是必要的，但你不应该隐藏这种耦合。构造函数的参数，使得它们的调用顺序显而易见。考虑以下内容：\n\n```java\npublic class\
  \ MoogDiver {\n  Gradient gradient;\n  List<Spline> splines;\n  public void dive(String\
  \ reason) {\n    saturateGradient();\n    reticulateSplines();\n    diveForMoog(reason);\n\
  \  }\n  …\n}\n```\n\n这三个函数的调用顺序很重要。你必须先饱和梯度，才能处理网格，最后才能执行 moog。遗憾的是，代码没有强制这种时间耦合。另一个程序员可能会在调用\
  \ `saturateGradient` 之前调用 `reticulateSplines`，导致 `UnsaturatedGradientException`。更好的解决方案是：\n\
  \n```java\npublic class MoogDiver {\n  public void dive(String reason) {\n    Gradient\
  \ gradient = saturateGradient();\n    List<Spline> splines = reticulateSplines(gradient);\n\
  \    diveForMoog(splines, reason);\n  }\n}\n```\n\n通过创建接力赛的方式暴露了时间耦合。每个函数都产生下一个函数需要的结果，因此没有理由无序调用它们。\n\
  \n你可能会抱怨这留下了实例变量，我假设它们是私有方法需要的。尽管如此，我希望通过参数来使时间耦合显式化。\n\n### G32: 不要随意\n\n对你组织代码的方式给出一个理由，并确保这个理由通过代码结构传达出来。如果一个结构看起来是随意的，其他人就会觉得可以修改。如果一个结构在整个系统中一致出现，其他人就会使用它并维护约定。例如，我最近在合并\
  \ FitNesse 的更改时，发现我们的一个提交者做了这样的：\n\n```java\npublic class AliasLinkWidget extends\
  \ ParentWidget {\n  public static class VariableExpandingRoot {\n    …\n    …\n\
  \  }\n}\n```\n\n这种做法的问题是 `VariableExpandingRoot` 没有必要在 `AliasLinkWidget` 的作用域内。此外，其他无关类使用了\
  \ `AliasLinkWidget.VariableExpandingRoot`。这些类不需要知道 `AliasLinkWidget`。\n\n也许程序员为了方便把\
  \ `VariableExpandingRoot` 丢进了 `AliasWidget` 中，又也许他认为它确实需要作用在 `AliasWidget` 内部。无论原因如何，结果都是随意的。不是其他类工具的公共类，不应该作用在另一个类内部。约定是让它们在包的顶层公开。\n\
  \n### G33: 封装边界条件\n\n边界条件很难追踪。将它们的处理逻辑放在一个地方。不要让它们渗透到代码中。我们不希望到处散落 `+1` 和 `-1`。考虑这个来自\
  \ FIT 的简单示例：\n\n```java\nif(level + 1 < tags.length) {\n  parts = new Parse(body,\
  \ tags, level + 1, offset + endTag);\n  body = null;\n}\n```\n\n\n\n\n注意 `level+1`\
  \ 出现了两次。这是一个应该封装在命名类似于 `nextLevel` 的变量中的边界条件。\n\n```\nint nextLevel = level + 1;\n\
  \nif(nextLevel < tags.length)\n{\n    parts = new Parse(body, tags, nextLevel, offset\
  \ + endTag);\n    body = null;\n}\n```\n\n#### G34: 函数的抽象层级只下降一层\n\n函数内部的语句应该都写在相同的抽象层级上，而这个层级应该比函数名所描述的操作低一个级。这可能是这些启发式方法中最难解释和遵循的。尽管这个主意本身很易懂，但人类实在太擅长无缝地混合不同层级的抽象了。例如，考虑下面取自\
  \ FitNesse 的这段代码：\n\n```java\npublic String render() throws Exception\n{\n    StringBuffer\
  \ html = new StringBuffer(\"<hr”);\n    if(size > 0)\n        html.append(\" size=\"\
  ).append(size + 1).append(\" \");\n    html.append(\">\");\n    return html.toString();\n\
  }\n```\n\n稍稍研究一下你就能看到发生了什么。这个函数构造了一个横跨页面绘制水平线的 HTML 标签。该水平线的高度由 `size` 变量指定。\n\n\
  现在再次看一遍。这个方法混合了至少两个抽象层级。第一个是“水平线具有尺寸”的概念。第二个是 `HR` 标签本身的语法。这段代码来自 FitNesse 中的 `HruleWidget`\
  \ 模块。该模块检测四条或更多横线组成的行，并将其转换为相应的 HR 标签。横线越多，尺寸就越大。\n\n我按如下重构了这段代码。注意我更改了 `size` 字段的名字以反映它的真实目的。它存储的是额外横线的数量。\n\
  \n```java\npublic String render() throws Exception\n{\n    HtmlTag hr = new HtmlTag(\"\
  hr\");\n    if (extraDashes > 0)\n        hr.addAttribute(\"size\", hrSize(extraDashes));\n\
  \    return hr.html();\n}\n\nprivate String hrSize(int height)\n{\n    int hrSize\
  \ = height + 1;\n    return String.format(\"%d\", hrSize);\n}\n```\n\n这个变化很好地分离了两个抽象层级。`render`\
  \ 函数简单地构造了一个 HR 标签，而不需要知道关于该标签 HTML 语法的任何信息。`HtmlTag` 模块处理了所有棘手的语法问题。\n\n事实上，通过这个更改，我发现了一个细微的错误。原始代码没有按照\
  \ XHTML 标准在 HR 标签上加上结束斜杠。（换句话说，它输出的是 `<hr>` 而不是 `<hr/>`。）`HtmlTag` 模块很久就已经修改为符合\
  \ XHTML 标准了。\n\n分离抽象层是重构最重要的功能之一，也是最难做好的之一。作为一个例子，看下面的代码。这是我第一次尝试分离 `HruleWidget.render\
  \ method` 方法中的抽象层级。\n\n```java\npublic String render() throws Exception\n{\n   \
  \ HtmlTag hr = new HtmlTag(\"hr\");\n    if (size > 0) {\n        hr.addAttribute(\"\
  size\", \"\"+(size+1));\n    }\n    return hr.html();\n}\n```\n\n此时，我的目标是创建必要的分离并让测试通过。我轻松地实现了这个目标，但结果是一个仍然具有混合抽象层级的函数。在这种情况下，混合的层级是\
  \ HR 标签的构造以及对 `size` 变量的解释和格式化。这表明，当你沿着抽象层级拆分函数时，你通常会发现被之前的结构遮蔽的新抽象层级。\n\n#### G35:\
  \ 将可配置数据保持在高层级\n\n如果你有一个在抽象抽象层级上已知且预期的常量（例如默认值或配置值），不要将其埋在低层函数中。将其作为参数暴露给由高层函数调用的那个低层函数。考虑下面来自\
  \ FitNesse 的这段代码：\n\n```java\npublic static void main(String[] args) throws Exception\n\
  {\n    Arguments arguments = parseCommandLine(args);\n    ...\n}\n\npublic class\
  \ Arguments\n{\n    public static final String DEFAULT_PATH = \".\";\n    public\
  \ static final String DEFAULT_ROOT = \"FitNesseRoot\";\n    public static final\
  \ int DEFAULT_PORT = 80;\n    public static final int DEFAULT_VERSION_DAYS = 14;\n\
  \    ...\n}\n```\n\n命令行参数在 FitNesse 的第一个可执行行中被解析。这些参数的默认值定义在 `Argument` 类的顶部。你不需要在系统的低层寻找这样的语句：\n\
  \n```\nif (arguments.port == 0) // 默认使用 80\n```\n\n配置常量位于非常高的层级，很容易更改。它们被传递给应用程序的其他部分。应用程序的低层并不拥有这些常量的值。\n\
  \n#### G36: 避免传递性导航\n\n通常情况下，我们不希望单个模块过多了解它的协作者。更具体地说，如果 `A` 与 `B` 协作，而 `B` 与 `C`\
  \ 协作，我们不希望使用 `A` 的模块知道 `C`。（例如，我们不希望出现 `a.getB().getC().doSomething()`。）\n\n这有时被称为迪米特律（Law\
  \ of Demeter）。务实程序员称之为“编写害羞代码”（Writing Shy Code）。无论哪种情况，都是为了确保模块只了解它们的直接协作者，而不了解整个系统的导航。如果许多模块使用了某种形式的\
  \ `a.getB().getC()`，那么要更改设计以在 `B` 和 `C` 之间引入中间层变得困难。相反我们希望直接协作者提供我们所需的所有服务。我们不应该在对象图中寻找想要调的方法。相反，我们应该简单地说：\n\
  \n```\nmyCollaborator.doSomething().\n```\n\n### Java\n\n#### J1: 使用通配符避免长导入列表\n\
  \n如果你从某个包中使用两个或多个类，则导入整个包：\n\n```\nimport package.*;\n```\n\n长导入列表令读者望而生畏。相反我们希望导入简洁地说明哪些包。\n\
  \n特定的导入是硬依赖，而通配符导入不是。如果你特定的导入一个类，那么该类必须存在。但如果你使用通配符导入包，则不需要特定的类存在。导入语句只是在查找名称时将包添加到路径中。因此这样的导入不会创建真正的依赖。\n\
  \n某些情况下，特定的导入列表是有用的。例如，如果你正在处理遗留代码并想要找出为哪些类构建模拟（mock）和存根（stub），你可以遍历特定的导入以找到所有类的真实限定名，然后放置相应的存根。然而，这种特定导入的使用非常罕见。此外，大多数现代\
  \ IDE 都允许通过一个命令将通配符导入转换为特定的列表。因此即使在遗留情况下，使用通配符通常通常更好。\n\n通配符导入有时会导致命名冲突和歧义。来自不同包的同名类需要被特定的导入，或者至少在使用时进行特定的限定。这可能是一个麻烦，但发生频率足够低，使得使用通配符导入通常优于特定的导入。\n\
  \n#### J2: 不要继承常量\n\n我见过好几次这种情况，每次都让我皱眉。程序员将一些常量放在接口中，然后通过继承该接口来获取这些常量。看看下面的代码：\n\
  \n```java\npublic class HourlyEmployee extends Employee {\n    private int tenthsWorked;\n\
  \    private double hourlyRate;\n}\n```\n\n\n\n\n\n```java\npublic Money calculatePay()\
  \ {\n\n  int straightTime = Math.min(tenthsWorked, TENTHS_PER_WEEK);\n\n  int overTime\
  \ = tenthsWorked - straightTime;\n\n  return new Money(\n\n    hourlyRate * (tenthsWorked\
  \ + OVERTIME_RATE * overTime)\n  );\n\n}\n\n…\n\n}\n```\n\n常量 `TENTHS_PER_WEEK`\
  \ 和 `OVERTIME_RATE` 是从哪里来的？它们可能来自 `Employee` 类；所以让我们来看一眼：\n\n```java\npublic abstract\
  \ class Employee implements PayrollConstants {\n\n  public abstract boolean isPayday();\n\
  \n  public abstract Money calculatePay();\n\n  public abstract void deliverPay(Money\
  \ pay);\n\n}\n```\n\n不，那里没有。那又在哪里呢？仔细观察 `Employee` 类。它实现了 `PayrollConstants`。\n\n\
  ```java\npublic interface PayrollConstants {\n\n  public static final int TENTHS_PER_WEEK\
  \ = 400;\n\n  public static final double OVERTIME_RATE = 1.5;\n\n}\n```\n\n这是一种极其糟糕的做法！常量被隐藏在继承层次结构的顶端。真恶心！不要利用继承来欺骗语言的作用域规则。请使用静态导入。\n\
  \n`import static PayrollConstants.*;`\n\n```java\npublic class HourlyEmployee extends\
  \ Employee {\n\n  private int tenthsWorked;\n\n  private double hourlyRate;\n\n\
  \  public Money calculatePay() {\n\n    int straightTime = Math.min(tenthsWorked,\
  \ TENTHS_PER_WEEK);\n\n    int overTime = tenthsWorked - straightTime;\n\n    return\
  \ new Money(\n\n      hourlyRate * (tenthsWorked + OVERTIME_RATE * overTime)\n \
  \   );\n\n  }\n\n  …\n\n}\n```\n\n### J3: 常量与枚举\n\n既然语言已经添加了 `enum`（Java 5），就去使用它们吧！不要继续使用\
  \ `public static final int` 这种老掉花招了。`int` 的含义可能会丢失。而 `enum` 的含义则不会，因为它们属于一个具具名的枚举。\n\
  \n此外，仔细研究 `enum` 的语法。它们可以拥有方法和字段。这使得它们成为非常强大的工具，提供了比 `int` 多得的表达力和灵活性。考虑这段工资代码的这种变体：\n\
  \n```java\npublic class HourlyEmployee extends Employee {\n\n  private int tenthsWorked;\n\
  \n  private HourlyPayGrade grade;\n\n  public Money calculatePay() {\n\n    int\
  \ straightTime = Math.min(tenthsWorked, TENTHS_PER_WEEK);\n\n    int overTime =\
  \ tenthsWorked - straightTime;\n\n    return new Money(\n\n      grade.rate() *\
  \ (tenthsWorked + OVERTIME_RATE * overTime)\n    );\n\n  }\n\n  …\n\n}\n```\n\n\
  ```java\npublic enum HourlyPayGrade {\n  APPRENTICE {\n    public double rate()\
  \ {\n      return 1.0;\n    }\n  },\n\n  LEUTENANT_JOURNEYMAN {\n    public double\
  \ rate() {\n      return 1.2;\n    }\n  },\n\n  JOURNEYMAN {\n    public double\
  \ rate() {\n      return 1.5;\n    }\n  },\n\n  MASTER {\n    public double rate()\
  \ {\n      return 2.0;\n    }\n  };\n\n  public abstract double rate();\n}\n```\n\
  \n### 命名 (Names)\n\n#### N1: 选择具有描述性的名称\n\n不要太急于选择名称。确保该名称具有描述性。记住，意义往往随着软件的演变而漂移，因此要经常评估你所选名称的合理性。\n\
  \n这不仅仅是一个“感觉良好”的建议。软件中的名称 90% 决定了软件的可读性。你需要花时间明智地选择它们，并保持它们的相关性。名称太重要了，不能草率对待。\n\
  \n考虑下面的代码。它是做什么的？如果我向你展示命名良好的代码，它对你来说将完全清晰，但像现在这样，它只是符号和魔法数字的杂烩。\n\n```java\npublic\
  \ int x() {\n  int q = 0;\n  int z = 0;\n  for (int kk = 0; kk < 10; kk++) {\n \
  \   if (l[z] == 10)\n    {\n      q += 10 + (l[z + 1] + l[z + 2]);\n      z += 1;\n\
  \    }\n    else if (l[z] + l[z + 1] == 10)\n    {\n      q += 10 + l[z + 2];\n\
  \      z += 2;\n    } else {\n      q += l[z] + l[z + 1];\n      z += 2;\n    }\n\
  \  }\n  return q;\n}\n```\n\n这里是代码应该有的写法。这段片段实际上比上面那个不完整。然而，你可以立即推断它正尝试做什么，并且你很可能根据这个推出的含义写出缺失的函数。魔法数字不再是魔法，算法的结构也具有极强的描述性。\n\
  \n```java\npublic int score() {\n  int score = 0;\n  int frame = 0;\n  for (int\
  \ frameNumber = 0; frameNumber < 10; frameNumber++) {\n    if (isStrike(frame))\
  \ {\n      score += 10 + nextTwoBallsForStrike(frame);\n      frame += 1;\n    }\
  \ else if (isSpare(frame)) {\n      score += 10 + nextBallForSpare(frame);\n   \
  \   frame += 2;\n    } else {\n      score += twoBallsInFrame(frame);\n      frame\
  \ += 2;\n    }\n  }\n  return score;\n}\n```\n\n精心选择的名称的威力在于，它们为代码结构过载了描述信息。这种重载设定了读者对模块中其他函数功能的预期。你可以通过查看上面的代码推断出\
  \ `isStrike()` 的实现。当你阅读 `isStrike` 方法时，它将“几乎如你所预期”。\n\n```java\nprivate boolean\
  \ isStrike(int frame) {\n  return rolls[frame] == 10;\n}\n```\n\n#### N2: 在适当的抽象级别选择名称\n\
  \n不要选择传达实现细节名称；要选择反映你所工作的类或函数抽象层级的名称。这很难做到。再次，人们太擅长混合不同层级的抽象了。每当你检查一遍代码时，可能都会发现某些变量的命名级别太低。当你发现它们时，应该利用机会更改这些名称。提高代码的可读性需要对持续改进的投入。考虑\
  \ `Modem` 接口：\n\n```java\npublic interface Modem {\n  boolean dial(String phoneNumber);\n\
  \  boolean disconnect();\n  boolean send(char c);\n  char recv();\n  String getPhoneNumber();\n\
  }\n```\n\n初看这很好。所有函数似乎都很合适。事实上，对于许多应用来说确实如此。但现在考虑一种应用，其中调制器不是通过拨号连接的。相反，它们是硬线连接在一起的（想想为家庭提供互联网访问的电缆调制器）。也许有些是通过\
  \ USB 连接的。显然，电话号码的概念在抽象级别上是错误的。这种情况下更好的命名策略可能是：\n\n```java\npublic interface Modem\
  \ {\n  boolean connect(String connectionLocator);\n  boolean disconnect();\n  boolean\
  \ send(char c);\n  char recv();\n  String getConnectedLocator();\n}\n```\n\n现在名称没有对电话号码做任何承诺。它们仍然可以用于电话号码，也可以用于任何连接策略。\n\
  \n#### N3: 尽可能使用标准术语\n\n如果名称基于现有的习惯或用法，将更容易理解。例如，如果你在使用装饰器模式，你应该在装饰器类的命名中使用包含 `Decorator`\
  \ 一词。例如，`AutoHangupModemDecorator` 可能是一个为 `Modem` 增加了会话结束时自动挂机能力的类名。\n\n模式只是标准的一种。在\
  \ Java 中，例如，将对象转换为字符串表示的通常命名为 `toString`。遵循这些约定比自己发明一套要好。\n\n团队通常会为特定项目发明一套标准的命名系统。埃里克·埃文斯将其称为项目的*通用语言*（ubiquitous\
  \ language）。你的代码应该大量使用这种语言中的术语。简而言之，你越能使用加载了与项目相关的特殊含义的名称，读者越容易知道你的代码在讨论什么。\n\n\
  ### N4: 无歧的名称\n\n选择使函数或变量的工作原理无歧的名称。考虑这个来自 FitNesse 的例子：\n\n```java\nprivate String\
  \ doRename() throws Exception\n{\n  if(refactorReferences)\n    renameReferences();\n\
  \  renamePage();\n  pathToRename.removeNameFromEnd();\n  pathToRename.addNameToEnd(newName);\n\
  \  return PathParser.render(pathToRename);\n}\n```\n\n\n\n\n此函数的名称除了宽泛且模糊的术语外，并没有说明该函数的功能。这一点进一步体现在：在名为\
  \ `doRename` 的函数内部竟然还有一个名为 `renamePage` 的函数！这两个名称能告诉你关于这两个函数之间的差异吗？什么也没告诉你。\n\n\
  该函数更好的名称是 `renamePageAndOptionallyAllReferences`。这似乎很长，确实很长，但它在模块中只被调用了一次，所以它的解释价值超过了它的长度。\n\
  \n### N5: 为长作用域使用长名称\n\n名称的长度应该与其作用域的长度相关。对于极小的作用域可以使用非常短的变量名，但对于作用域应该使用更长的名称。\n\
  \n如果作用域只有五行长，变量名 `i` 和 `j` 完全可以。考虑一下旧标准“保龄球游戏”中的这段代码：\n\n```java\nprivate void rollMany(int\
  \ n, int pins)\n{\n  for (int i=0; i<n; i++)\n    g.roll(pins);\n}\n```\n\n这非常清晰，如果将变量\
  \ `i` 替换为像 `rollCount` 这样令人心烦的东西，代码反而会变得晦涩。另一方面，短名称的变量和函数在长距离范围内会失去它们的意义。因此，名称的作用域越长，名称就应该越长且越精确。\n\
  \n### N6: 避免编码\n\n名称不应包含类型或作用域信息的编码。诸如 `m_` 或 `f` 等前缀在当今的环境中是没用的。此外，项目和/或子系统的编码（如\
  \ `vis_`，用于视觉成像系统）会分散注意力且冗余。同样，当今的环境提供了所有这些信息，而无需扭曲名称。保持你的名称免受“匈牙利污染”。\n\n### N7:\
  \ 名称应该描述副作用\n\n名称应该描述函数、变量或类所是或做的一切。不要用名称来隐藏副作用。不要用一个简单的动词来描述执行了超出该简单动作的函数。例如，考虑\
  \ TestNG 中的这段代码：\n\n```java\npublic ObjectOutputStream getOos() throws IOException\
  \ {\n  if (m_oos == null) {\n    m_oos = new ObjectOutputStream(m_socket.getOutputStream());\n\
  \  }\n  return m_oos;\n}\n```\n\n这个函数做的不仅仅是获取一个“oos”；如果“oos”还没有被创建，它会创建一个“oos”。因此，更好的名称可能是\
  \ `createOrReturnOos`。\n\n### 测试\n\n### T1: 测试不足\n\n一个测试套件中应该包含多少个测试？遗憾的是，许多程序员使用的指标是“这看起来足够了”。只要还有测试未触及的条件，或者有未经过验证的计算，测试套件就是不充分的。\n\
  \n#### T2: 使用覆盖率工具！\n\n覆盖率工具可以报告你测试策略中的遗漏。它们能让你轻松找到测试不充分的模块、类和函数。大多数 IDE 都会提供视觉指示，将已覆盖的行标记为绿色，将未覆盖的行标记为红色。这让你能够快速找到正体未经过检查的\
  \ `if` 或 `catch` 语句。\n\n### T3: 不要跳过琐碎测试\n\n这些测试易于编写，而且它们的文档价值高于生成它们的成本。\n\n####\
  \ T4: 被忽略的测试是对歧义的提问\n\n有时我们对某个行为细节不确定，是因为需求不明确。我们可以将对需求的疑问表达为一个注释掉的测试，或者标记为 `@Ignore`\
  \ 的测试。你选择哪种取决于该歧义是关于是否可以编译的。\n\n#### T5: 测试边界条件\n\n特别注意测试边界条件。我们往往正确处理了算法中间，但误判了边界。\n\
  \n#### T6: 在 Bug 附近进行详尽测试\n\nBug 往往聚集。当你发现函数中有一个 bug 时，对该函数进行详尽测试是明智的。你可能会发现该 bug\
  \ 并非孤立。\n\n#### T7: 失败模式能够揭示问题\n\n有时你可以通过发现测试用例失败的模式来诊断问题。这是让测试用例尽可能完整的另一个理由。以合理方式排序的完整测试用例会揭示模式。\n\
  \n举个简单的例子，假设你注意到所有输入大于五个字符的测试都失败了？或者，如果任何向函数第二个参数传递负数的测试都失败了呢？有时，仅仅看到测试报告上红绿相间的模式，就足以引发“啊！原来如此”的感，从而找到解决方案。回看第\
  \ 267 页，查看 `SerialDate` 示例中这个有趣的例子。\n\n#### T8: 测试覆盖模式可以揭示问题\n\n观察通过性测试所执行或未执行的代码，可以为失败测试为何失败提供线索。\n\
  \n#### T9: 测试应当是快速的\n\n缓慢的测试就是不会被运行的测试。当时间紧迫时，缓慢测试会被从套件中丢弃。所以，*竭尽全力*保持你的测试快速。\n\n\
  ### 结论\n\n这个启发式和代码味道列表很难说是不完全的。事实上，我不确定这样的列表是否*可能*是完全的。但也许完整性不应该是目标，因为这个列表*所做的*实际上是暗示了一种价值体系。\n\
  \n事实上，这套价值体系正是代码的目标和主题。整洁的代码不是通过遵循一套规则写出来的。专业精神和工艺源于价值观。\n\n### 参考文献\n\n- `Refactoring`:\
  \ *Refactoring: Improving Existing Code*, Martin Fowler, Addison-Wesley, 1999.\n\
  - `PRAG`: *The Pragmatic Programmer*, Andrew Hunt, Dave Thomas, Addison-Wesley,\
  \ 2000.\n- `GOF`: *Design Patterns: Elements of Reusable Software*, Gamma et al.,\
  \ Addison-Wesley, 1996.\n- `Beck97`: *Smalltalk Best Practice*, Kent Beck, Prentice\
  \ Hall, 1997.\n- `Beck07`: *Implementation Patterns*, Kent Beck, Addison-Wesley,\
  \ 2008.\n- `PPP`: *Agile Software Development: Principles, Patterns, and Practices*,\
  \ Robert C. Martin, Prentice Hall, 2002.\n- `DDD`: *Domain Driven Design*, Eric\
  \ Evans, Addison-Wesley, 2003.\n\n## 附录 A 并发\n\nBrett Schuchert\n\n本附录支持并加强了第 177\
  \ 页的*并发*章节。它以独立主题的形式编写，你可以按任何顺序阅读。为了方便这种阅读，章节之间存在重复。\n\n## 客户端/服务器示例\n\n想象一个简单的客户端/服务器应用程序。服务器监听端口等待客户端连接。客户端连接并发送请求。\n\
  \n#### 服务器\n\n这是一个服务器应用程序的简化版本。该示例的完整源码从第 343 页开始，*非线程客户端/服务器*。\n\n```java\nServerSocket\
  \ serverSocket = new ServerSocket(8009);\nwhile (keepProcessing) {\n  try {\n  \
  \  Socket socket = serverSocket.accept();\n    process(socket);\n  } catch (Exception\
  \ e) {\n    handle(e);\n  }\n}\n```\n\n这个简单的应用程序等待连接，处理传入的消息，然后再次等待下一个客户端请求。这里是连接到该服务器的客户端代码：\n\
  \n```java\nprivate void connectSendReceive(int i) {\n  try {\n    Socket socket\
  \ = new Socket(\"localhost\", PORT);\n    MessageUtils.sendMessage(socket, Integer.toString(i));\n\
  \    MessageUtils.getMessage(socket);\n    socket.close();\n  } catch (Exception\
  \ e) {\n    e.printStackTrace();\n  }\n}\n```\n\n这个客户端/服务器对性能如何？我们如何正式地描述这种性能？这里有一个断言性能“可接受”的测试：\n\
  \n\n\n\n\n```java\n@Test(timeout = 10000)\n\npublic void shouldRunInUnder10Seconds()\
  \ throws Exception {\n    Thread[] threads = createThreads();\n    startAllThreadsw(threads);\n\
  \    waitForAllThreadsToFinish(threads);\n}\n```\n\n为了保持示例简单，省略了设置部分（请参见第 344 页的“`ClientTest.java`”）。此测试断言它应该在\
  \ 10,000 毫秒内完成。\n\n这是一个验证系统吞吐量的经典示例。该系统应该在十秒内完成一系列客户端请求。只要服务器能够及时处理每个单独的客户端请求，测试就能通过。\n\
  \n如果测试失败会发生什么？除非开发某种事件轮询，否则在单个线程内没有做什么可以让这段代码运行得更快。使用多线程可以解决问题吗？可能可以，但我们需要知道时间花在哪里了。有两种可能：\n\
  \n- I/O——使用套接字、连接数据库、等待虚拟内存交换等。\n- 处理器——数值计算、正则表达式处理、垃圾回收等。\n\n系统通常都包含这两者，但对于特定的操作，通常其中一种会占据主导地位。如果代码是处理器密集型的，更多的处理硬件可以提高吞吐量，使我们的测试通过。但\
  \ CPU 周期是有限的，因此在处理器密集型问题中添加线程不会让它运行更快。\n\n另一方面，如果进程是 I/O 密集型的，那么并发就可以提高效率。当系统的一部分在等待\
  \ I/O 时，另一部分可以使用这段等待时间处理其他事情，从而更有效地利用可用 CPU。\n\n### 添加线程\n\n假设性能测试失败了。我们如何提高吞吐量以使性能测试通过？如果服务器的\
  \ `process` 方法是 I/O 密集型的，这里有一种让服务器使用线程的方法（只需更改 `processMessage`）：\n\n```java\nvoid\
  \ process(final Socket socket) {\n    if (socket == null)\n        return;\n   \
  \ Runnable clientHandler = new Runnable() {\n        public void run() {\n     \
  \       try {\n                String message = MessageUtils.getMessage(socket);\n\
  \                MessageUtils.sendMessage(socket, \"Processed: \" + message);\n\
  \                closeIgnoringException(socket);\n            } catch (Exception\
  \ e) {\n                e.printStackTrace();\n            }\n        }\n    };\n\
  \    Thread clientConnection = new Thread(clientHandler);\n    clientConnection.start();\n\
  }\n```\n\n假设此更改使测试通过；^(1) 代码是完整且正确的吗？\n\n### 服务器观察\n\n更新后的服务器仅略多一秒就成功完成了测试。遗憾的是，这个解决方案有点天真，并引入了一些新问题。\n\
  \n我们的服务器可能会创建多少线程？代码没有设置限制，因此我们可能会达到 Java 虚拟机 (JVM) 的限制。对于许多简单系统，这可能足够了。但如果旨在支持公共网络上的许多用户呢？如果有太多用户同时连接，系统可能会停滞。\n\
  \n但暂且忽略行为问题。所示解决方案在整洁性和结构上存在问题。服务器代码承担多少责任？\n\n- Socket 连接管理\n- 客户端处理\n- 线程策略\n\
  - 服务器关闭策略\n\n不幸的是，所有这些责任都在 `process` 函数中。此外，代码跨越了许多不同的抽象级别。因此，尽管 `process` 函数很小，它也需要重新划分。\n\
  \n服务器有几个理由需要更改；因此，它违反了单一职责原则。为了保持并发系统的整洁，线程管理应该保持在少数几个受控的地方。此外，任何管理线程的代码除了线程管理之外不应做任何事情。为什么？如果仅仅是因为追踪并发问题本身已经足够困难了，还需要同时回溯其他非并发问题。\n\
  \n如果我们为上述列出的每个责任都创建一个单独类（包括线程管理责任），那么当我们更改线程管理策略时，对整体代码的影响就会更小，并且不会污染其他职责。这使得测试所有其他职责变得容易得多，而无需担心线程。以下是一个实现了此点的更新版本：\n\
  \n```java\npublic void run() {\n    while (keepProcessing) {\n        try {\n  \
  \          ClientConnection clientConnection = connectionManager.awaitClient();\n\
  \            ClientRequestProcessor requestProcessor = new ClientRequestProcessor(clientConnection);\n\
  \            clientScheduler.schedule(requestProcessor);\n        } catch (Exception\
  \ e) {\n            e.printStackTrace();\n        }\n    }\n    connectionManager.shutdown();\n\
  }\n```\n\n这现在将所有与线程相关的内容集中在一个地方，即 `clientScheduler`。如果有并发问题，就只有一个地方可以查看：\n\n```java\n\
  public interface ClientScheduler {\n    void schedule(ClientRequestProcessor requestProcessor);\n\
  }\n```\n\n当前的策略易于实现：\n\n```java\npublic class ThreadPerRequestScheduler implements\
  \ ClientScheduler {\n    public void schedule(final ClientRequestProcessor requestProcessor)\
  \ {\n        Runnable runnable = new Runnable() {\n            public void run()\
  \ {\n                requestProcessor.process();\n            }\n        };\n  \
  \      Thread thread = new Thread(runnable);\n        thread.start();\n    }\n}\n\
  ```\n\n将所有线程管理隔离在单个地方后，改变我们控制线程的方式变得容易得多。例如，迁移到 Java 框架涉及编写一个新类并将其插入(示例 A-1)。\n\n\
  **示例 A-1 `ExecutorClientScheduler.java`**\n\n```java\nimport java.util.concurrent.Executor;\n\
  import java.util.concurrent.Executors;\n\npublic class ExecutorClientScheduler implements\
  \ ClientScheduler {\n    Executor executor;\n    public ExecutorClientScheduler(int\
  \ availableThreads) {\n        executor = Executors.newFixedThreadPool(availableThreads);\n\
  \    }\n    public void schedule(final ClientRequestProcessor requestProcessor)\
  \ {\n        Runnable runnable = new Runnable() {\n            public void run()\
  \ {\n                requestProcessor.process();\n            }\n        };\n  \
  \      executor.execute(runnable);\n    }\n}\n```\n\n### 结论\n\n在这个示例中引入并发演示了提高系统吞吐量的方法，以及通过测试框架验证吞吐量的方法。将所有并发代码集中在少数类中是应用单一职责原则的示例。在并发编程的情况下，这尤为重要。\n\
  \n## 执行路径\n\n回顾 `incrementValue` 方法，这是一个没有循环或分支的单行 Java 方法：\n\n```java\npublic class\
  \ IdGenerator {\n    int lastIdUsed;\n    public int incrementValue() {\n      \
  \  return ++lastIdUsed;\n    }\n}\n```\n\n忽略整数溢出并假设只有一个线程访问 `IdGenerator` 实例。在这种情况下，只有一条执行路径和一个单一确定的结果：\n\
  \n- 返回的值等于 `lastIdUsed` 的值，两者都比调用之前增加一。\n\n如果我们使用两个线程并保持方法不变会发生什么？如果每个线程都调用 `incrementValue`，可能的结果是什么？有多少种可能的执行路径？首先是结果（假设\
  \ `lastIdUsed` 初始值为 93）：\n\n- 线程 1 得到 94，线程 2 得到 95，`lastIdUsed` 现在是 95。\n- 线程 1\
  \ 得到 95，线程 2 得到 94，`lastIdUsed` 现在是 95。\n- 线程 1 得到 94，线程 2 得到 94，`lastIdUsed` 现在是\
  \ 94。\n\n最后的结果虽然意外但是可能的。为了理解为什么会有这些不同的结果，我们需要理解可能路径的数量以及 Java 虚拟机是如何执行它们的。\n\n\n\
  \n\n为了计算可能的执行路径数量，我们将从生成的字节码开始。这一行 Java 代码（`return ++lastIdUsed;`）变成了八条字节码指令。这两个线程可能会交替执行这八条指令，就像发牌员在洗牌时交替穿插牌牌一样。即使每只手里只有八张牌，洗牌后的结果数量也多得惊人。\n\
  \n对于这种包含 `N` 条顺序指令、没有循环或条件判断且有 `T` 个线程的简单情况，可能的执行路径总数等于：\n\n![Image](img/Image00050.jpg)\n\
  \n### 计算可能的排序\n\n这源于 Uncle Bob 给 Brett 的一封邮件：\n\n在 `N` 个步骤和 `T` 个线程的情况下，总共有 `T`\
  \ * `N` 个步骤。在每一步之前，都有一次上下文切换，它在 `T` 个线程之间进行选择。因此，每条路径都可以表示为代表上下文切换的数字字符串。给定步骤 `A`\
  \ 和 `B` 以及线程 `1` 和 `2`，六种可能的路径为 1122、1212、1221、2112、2121 和 2211。或者用步骤来表示，即 `A1B1A2B2`、`A1A2B1B2`、`A1A2B2B1`、`A2A1B1B2`、`A2A1B2B1`\
  \ 和 `A2B2A1B1`。对于三个线程，序列为 112233、112323、113223、113232、112233、121233、121323、121332、123132、123123、……\n\
  \n这些字符串的一个特征是，每个 `T` 必须始终出现 `N` 次。因此，字符串 111111 是无效的，因为它有六个 1，而没有 2 和 3。\n\n所以，我们需要的是\
  \ `N` 个 1、`N` 个 2……以及 `N` 个 `T` 的排列。这实际上就是从 `N` * `T` 个元素中取出 `N` * `T` 个元素的排列，即\
  \ (`N` * `T` )!，但要去掉所有重复项。因此，技巧是计算重复的数量并从 (`N` * `T` )! 中减去它。\n\n给定两个步骤和两个线程，有多少个重复？每个四位数字字符串有两个\
  \ 1 和两个 2。这些配对中的每一个都可以交换而不改变字符串的含义。你可以只交换 1，或者只交换 2，或者两者都交换，或者都不交换。所以每个字符串有四种同构体，这意味着有三个重复项。因此四种选项中有三个是重复的；反之，四种排列中有一个不是重复的。4!\
  \ * .25 = 6。所以这个推理似乎是行得通的。\n\n有多少重复？在 `N` = 2 且 `T` = 2 的情况下，我可以交换 1、交换 2，或者两者都交换。在\
  \ `N` = 2 且 `T` = 3 的情况下，我可以交换 1、交换 2、交换 3、交换 1 和 2、交换 1 和 3，或者交换 2 和 3。交换仅仅是 `N`\
  \ 的排列。假设 `N` 有 `P` 种排列。那么安排这些排列的不同方式有 `P` ***T* .。\n\n所以，可能的同构体数量是 `N` !***T*!。因此，路径数量是\
  \ (`T` **`N` )!/(`N` !***T* )。同样，在我们的 `T` = 2, `N` = 2 情况下，我们得到了 6 (24/4)。\n\n对于\
  \ `N` = 2 和 `T` = 3，我们得到 720/8 = 90。\n\n对于 `N` = 3 和 `T` = 3，我们得到 9!/6³ = 1680。\n\
  \n对于我们这单行 Java 代码的简单情况（等同于八行字节码和两个线程），可能的执行路径总数为 12,870。如果 `lastIdUsed` 的类型是 `long`，那么每次读取/写都会变成两次操作而不是一次，可能的排序数量就变成了\
  \ 2,704,156。\n\n如果我们对这个方法进行一项更改会发生什么？\n\n```java\npublic synchronized void incrementValue()\
  \ {\n    ++lastIdUsed;\n}\n```\n\n可能的执行路径数量对于两个线程变为两个，在一般情况下为 `N!`。\n\n### 深入探讨\n\
  \n关于那个令人惊讶的结果：两个线程（在我们添加 `synchronized` 之前）都可能各调用了一次该方法并得到了相同的数值结果？这怎么可能？首先要明确：\n\
  \n什么是原子操作？我们可以将原子操作定义为任何不可中断的操作。例如，在以下代码的第 5 行，将 0 赋值给 `lastid` 是原子的，因为根据 Java 内存模型，对\
  \ 32 位值的赋值是不可中断的。\n\n```\n01: public class Example {\n02: int lastId;\n03:\n04:\
  \ public void resetId() {\n05: lastId = 0;\n06: }\n07:\n08: public int getNextId()\
  \ {\n09: ++lastId;\n10: return lastId;\n11: }\n```\n\n\n\n尽管如此，这个简单的示例说明了有必要足够理解内存模型，以知道什么是安全的，什么是不安全的。一个常见的误区是认为\
  \ `++`（前置或后置增）运算符是原子的，它显然不是。这意味着你需要了解：\n\n- 哪里有共享对象/值\n- 哪些代码可能导致并发读/更新问题\n- 如何防止此类并发问题的发生\n\
  \n## 了解你的库\n\n### Executor 框架\n\n如第 321 页上的 `ExecutorClientScheduler.java`所示，Java\
  \ 5 引入的 `Executor` 框架允许使用线程池进行复杂的执行。这是 `java.util.concurrent` 包中的一个类。\n\n如果你正在创建线程且没有使用线程池，或者在使用手动编写线程池，你应该考虑使用\
  \ `Executor`。它会让你的代码更简洁、更容易追踪且体积更小。\n\n`Executor` 框架会对线程池化、自动调整大小并在必要时重建线程。它还支持\
  \ `futures`，一种常见的并发编程结构。`Executor` 框架与实现了 `Runnable` 的类配合，也可以与实现了 `Callable` 接口的类配合。`Callable`\
  \ 看起来像 `Runnable`，但它可以返回一个结果，这是多线程解决方案中的常见需求。\n\n当代码需要执行多个独立操作并等待两者都完成时，`future`\
  \ 就非常好用：\n\n```java\npublic String processRequest(String message) throws Exception\
  \ {\n    Callable<String> makeExternalCall = new Callable<String>() {\n        public\
  \ String call() throws Exception {\n            String result = \"\";\n        \
  \    // make external request\n            return result;\n        }\n    };\n \
  \   Future<String> result = executorService.submit(makeExternalCall);\n    String\
  \ partialResult = doSomeLocalProcessing();\n    return result.get() + partialResult;\n\
  }\n```\n\n在这个示例中，该方法开始执行 `makeExternalCall` 对象。方法继续进行其他处理。最后一行调用了 `result.get()`，它会阻塞直到\
  \ future 完成。\n\n### 非阻塞解决方案\n\nJava 5 虚拟机利用了现代处理器的设计，这种设计支持可靠的非阻塞更新。例如，考虑一个使用同步（因此是阻塞的）来提供值线程安全更新的类：\n\
  \n```java\npublic class ObjectWithValue {\n    private int value;\n    public void\
  \ synchronized incrementValue() { ++value; }\n    public int getValue() { return\
  \ value; }\n}\n```\n\nJava 5 针对此类情况提供了一系列新类：`AtomicBoolean`、`AtomicInteger` 和 `AtomicReference`\
  \ 是三个例子；还有更多。我们可以如下重写上面的代码以使用非阻塞方法：\n\n```java\npublic class ObjectWithValue {\n\
  \    private AtomicInteger value = new AtomicInteger(0);\n    public void incrementValue()\
  \ {\n        value.incrementAndGet();\n    }\n    public int getValue() {\n    \
  \    return value.get();\n    }\n}\n```\n\n尽管这使用了对象而不是基本类型，并且发送的是类似 `incrementAndGet()`\
  \ 的消息而不是 `++`，但该类的性能几乎总是优于之前的版本。在某些情况下，它只会稍微快一点，但它变慢的情况几乎不存在。\n\n这是如何可能的呢？现代处理器有一种通常被称为\
  \ `比较并交换 (CAS)` 的操作。这种操作类似于数据库中的乐观锁，而 `synchronized` 版本则类似于悲观锁。\n\n`synchronized`\
  \ 关键字总是获取锁，即使第二个线程并没有尝试更新同一个值。尽管内置锁的性能随着版本的更新而提高，但它们仍然是昂贵的。\n\n非阻塞版本的假设是：多个线程修改同一个值的频率通常还不足以产生问题。相反，它会高效地检测是否发生了这种情况，并不断重试直到更新成功。即使在中等到高竞争的情况下，这种检测的成本也几乎比获取锁要低。\n\
  \n虚拟机是如何实现这一点的？`CAS` 操作是原子的。从逻辑上，`CAS` 操作看起来如下：\n\n```java\nint variableBeingSet;\n\
  void simulateNonBlockingSet(int newValue) {\n    int currentValue;\n    do {\n \
  \       currentValue = variableBeingSet\n    } while(currentValue != compareAndSwap(currentValue,\
  \ newValue));\n}\n\nint synchronized compareAndSwap(int currentValue, int newValue)\
  \ {\n    if(variableBeingSet == currentValue) {\n        variableBeingSet = newValue;\n\
  \        return currentValue;\n    }\n    return variableBeingSet;\n}\n```\n\n当方法尝试更新共享变量时，`CAS`\
  \ 操作会验证被设置的变量是否仍为最后已知的值。如果是，则变量被改变。如果不是，则变量不会被设置，因为另一个线程设法插进来。尝试操作的方法（使用 `CAS` 操作）看到更改没有发生，并重试。\n\
  \n### 非线程安全的类\n\n有些类天生就不是线程安全的。以下是几个例子：\n\n- `SimpleDateFormat`\n- 数据库连接\n- `java.util`\
  \ 中的容器\n- Servlets\n\n请注意，某些集合类的单个方法是线程安全的。然而，任何涉及调用一个或多个方法的操作都不是线程安全的。例如，如果你不想在\
  \ `HashTable` 中替换某个内容，因为它已经存在了，你可能会写如下代码：\n\n```java\nif(!hashTable.containsKey(someKey))\
  \ {\n    hashTable.put(someKey, new SomeValue());\n}\n```\n\n每个单独的方法都是线程安全的。但是，另一个线程可能会在\
  \ `containsKey` 和 `put` 调用之间添加一个值。有几种方法可以修复这个问题：\n\n- 首先锁定 `HashTable`，并确保 `HashTable`\
  \ 的所有其他用户都同样这样做——基于客户端的锁定：\n```java\nsynchronized(map) {\n    if(!map.containsKey(key))\n\
  \        map.put(key, value);\n}\n```\n- 将 `HashTable` 封装在自己的对象中并使用不同的 API——使用适配器（ADAPTER）基于服务器锁定：\n\
  ```java\npublic class WrappedHashtable<K, V> {\n    private Map<K, V> map = new\
  \ Hashtable<K, V>();\n    public synchronized void putIfAbsent(K key, V value) {\n\
  \        if (map.containsKey(key))\n            map.put(key, value);\n    }\n}\n\
  ```\n- 使用线程安全的集合：\n```java\nConcurrentHashMap<Integer, String> map = new ConcurrentHashMap<Integer,\
  \ String>();\nmap.putIfAbsent(key, value);\n```\n`java.util.concurrent` 中的集合提供了\
  \ `putIfAbsent()` 等操作来实现此类操作。\n\n## 方法间的依赖会破坏并发代码\n\n这是一个引入方法间依赖关系的简单示例：\n\n```java\n\
  public class IntegerIterator implements Iterator<Integer> {\n    private Integer\
  \ nextValue = 0;\n    public synchronized boolean hasNext() {\n        return nextValue\
  \ < 100000;\n    }\n    public synchronized Integer next() {\n        if (nextValue\
  \ == 100000)\n            throw new IteratorPastEndException();\n        return\
  \ nextValue++;\n    }\n    public synchronized Integer getNextValue() {\n      \
  \  return nextValue;\n    }\n}\n```\n\n这是使用此 `IntegerIterator` 的代码：\n\n```java\n\
  IntegerIterator iterator = new IntegerIterator();\nwhile(iterator.hasNext()) {\n\
  \    int nextValue = iterator.next();\n    // do something with nextValue\n}\n```\n\
  \n如果只有一个线程执行这段代码，将没有问题。但如果两个线程尝试共享同一个 `IntegerIterator` 实例，意图是每个线程处理它们获得的值，但列表中的每个元素只被处理一次，会发生什么？大多数情况下什么都不会发生；线程愉快地共享列表，处理迭代器给给它们的元素并在迭代器完成时停止。然而，有极小的概率在迭代结束时，两个线程会相互干扰，导致其中一个线程超出迭代器范围并抛出异常。\n\
  \n\n\n\n问题在于：线程 1 询问 `hasNext()`，返回为 `true`。线程 1 被抢占，随后线程 2 询问了相同的问题，结果仍然为 `true`。接着线程\
  \ 2 调用了 `next()`，它如预期地返回了一个值，但其副作用是使得 `hasNext()` 返回 `false`。线程 1 再次启动，认为 `hasNext()`\
  \ 仍然为 `true`，然后调用了 `next()`。尽管单个方法是同步的，但客户端使用了**两个**方法。\n\n这是一个真实存在的问题，也是并发代码中经常出现的这类问题的一个例子。在这种特定情况下，这个问题尤为微妙，因为只有当它发生在迭代器的最后一次迭代时，才会导致故障。如果线程的断点时机恰好，那么其中一个线程就可能会越过迭代器的末尾。这种\
  \ Bug 通常在系统运行很长时间之后才会发生，而且很难追踪。\n\n你有三个选择：\n\n*   容忍这种失败。\n*   通过更改客户端来解决问题：基于客户端的锁定\n\
  *   通过更改服务器来解决问题，同时额外更改客户端：基于服务器的锁定\n\n### 容忍失败\n\n有时候你可以设置环境，使得失败不会造成伤害。例如，上面的客户端可以捕获异常并进行清理。坦率地说，这有点草率。这有点像是通过在午夜重启来清理内存泄漏。\n\
  \n## 基于客户端的锁定\n\n为了让 `IntegerIterator` 在多线程环境下正常工作，请按如下方式此客户端（以及其他所有客户端）：\n\n```java\n\
  IntegerIterator iterator = new IntegerIterator();\n\nwhile (true) {\n    int nextValue;\n\
  \    synchronized (iterator) {\n        if (!iterator.hasNext())\n            break;\n\
  \        nextValue = iterator.next();\n    }\n    doSometingWith(nextValue);\n}\n\
  ```\n\n每个客户端都通过 `synchronized` 关键字引入了锁。这种重复违反了 DRY（不要重复）原则，但如果代码使用了非线程安全的第三方工具，这可能是必要的。\n\
  \n这种策略是有风险的，因为所有使用服务器的程序员都必须记住在在使用之前锁定它，并在完成后解锁。很多（非常，多！）年前，我参与过一个在共享资源上采用基于客户端锁定的系统。该资源在代码的数百个不同的地方被使用。一个糟糕的程序员在其中一个地方忘记锁定该资源。\n\
  \n该系统是一个多终端时共享系统，为卡车司机协会 705 分会运行会计软件。计算机位于 705 分会总部以北 50 英处一个架空地板、环境受控的房间内。在总部，有几十名数据录入员在终端上输入工会费公告。终端通过专用电话线和\
  \ 600bps 半双工调制解调器连接到计算机。（这是非常、非常、久以前的事了。）\n\n大约每天一次，其中一个终端就会“死机”。这没有任何规律或理由。死机发生并不偏向特定的终端或特定的时间。就好像有人在掷骰子来选择死机的时间和终端。有时会有多个终端同时死机。有时会过去好几天都没有任何死机情况。\n\
  \n起初，唯一的解决方案是重启。但协调重启非常困难。我们必须打电话给总部，让每个人完成所有终端上正在操作的任务。然后我们就可以关闭并重启。如果有人正在做需要花费一两小时的重要事情，那么死机的终端只能保持死机状态。\n\
  \n在调试几周后，我们发现原因是一个环形缓冲区计数器与指针不同步了。该缓冲区控制到终端的输出。指针值显示缓冲区为空，但由于计数器却说它是满的。因为是空的，所以没有内容显示；但因为又是满的，没有任何内容可以添加到缓冲区中显示在屏幕上。\n\
  \n所以我们知道终端为什么会死机，但我们不知道为什么环形缓冲区会不同步。于是我们添加了一个黑科技方案来绕过这个问题。读取计算机的前面板开关是可能的。（这是非常、非常、非常久以前的事了。）我们写了一个小小的陷阱函数，用于检测这些开关何何时被翻动，然后寻找一个既空又是满的环形缓冲区。如果找到了，我们就将该缓冲区重置为空。*见鬼！*\
  \ 死机的终端开始重新显示了。\n\n所以现在，当终端死机时，我们不需要重启系统了。分会只需给我们打电话，告诉我们发生了死机，然后我们只需走进机房拨一下开关即可。\n\
  \n当然，有时他们会在周末工作，而我们不在。于是我们在调度器中添加了一个函数，每分钟检查一次所有环形缓冲区，并重置任何既空又是满的缓冲区。这使得显示在分会打通电话之前就已经恢复顺畅了。\n\
  \n在找到罪祸首之前，我们又花了几周时间仔细研究了一页又页单体汇编代码。我们进行了数学计算，发现死机的频率与环形缓冲区的一次未受保护的使用是一致的。因此，我们要做的只需找到那一个错误的用法。不幸的是，这已经太久以前了，我们当时没有搜索工具、交叉引用或任何其他类型的自动化帮助。我们只能逐行查看列表。\n\
  \n在 1971 年芝加哥寒冷的冬天，我学到了一个重要的教训。基于客户端的锁定真的很差劲。\n\n## 基于服务器的锁定\n\n通过对 `IntegerIterator`\
  \ 进行以下更改，可以消除重复：\n\n```java\npublic class IntegerIteratorLocked {\n    private Integer\
  \ nextValue = 0;\n    public synchronized Integer getNextNull() {\n        if (nextValue\
  \ < 10000)\n            return nextValue++;\n        else\n            return null;\n\
  \    }\n}\n```\n\n客户端代码也发生了变化：\n\n```java\nwhile (true) {\n    Integer nextValue\
  \ = iterator.getNextNull();\n    if (nextValue == null)\n        break;\n    //\
  \ 对 nextValue 进行操作\n}\n```\n\n在这种情况下，我们实际上更改了类的 API 以感知多线程。客户端需要执行 `null` 检查而不是检查\
  \ `hasNext()`。\n\n通常你应该选择基于服务器的锁定，原因如下：\n\n*   减少重复代码——基于客户端的锁定强制每个客户端正确锁定。通过将锁定代码放入服务器，客户端就可以使用而无需担心锁定代码。\n\
  * 允许更好的性能——在单线程部署的情况下，可以将安全的服务器切换为非安全的，从而避免所有开销。\n* 减少出错的可能性——只需要一个程序员忘记正确锁定。\n\
  * 强制执行单一策略——策略位于一个地方（服务器），而不是多个地方（每个客户端）。\n* 缩小共享变量的作用范围——客户端感知不到它们以及如何锁定它们。这一切都隐藏在服务器中。当出现问题时，需要查找的地方更少。\n\
  \n如果你没有服务器代码怎么办？\n\n*   使用适配器来更改 API 并添加锁定\n```java\npublic class ThreadSafeIntegerIterator\
  \ {\n    private IntegerIterator iterator = new IntegerIterator();\n    public synchronized\
  \ Integer getNextNull() {\n        if(iterator.hasNext())\n            return iterator.next();\n\
  \        return null;\n    }\n}\n```\n\n*   或者更好，使用带有扩展接口的线程安全集合\n\n## 提高吞吐量\n\n\
  假设我们要从网上并从 URL 列表中读取一组页面的内容。当每个页面被读取时，我们将对其进行解析以积累统计数据。一旦所有页面读取完毕，我们将打印一份摘要报告。\n\
  \n以下类根据 URL 返回单个页面的内容。\n\n```java\npublic class PageReader {\n    //…\n    public\
  \ String getPageFor(String url) {\n        HttpMethod method = new GetMethod(url);\n\
  \        try {\n            httpClient.executeMethod(method);\n```\n\n\n\n\n```java\n\
  String response = method.getResponseBodyAsString();\n\nreturn response;\n\n} catch\
  \ (Exception e) {\n\n    handle(e);\n\n} finally {\n\n    method.releaseConnection();\n\
  \n}\n\n}\n\n}\n```\n\n下一个类是迭代器，它根据 URL 迭代器提供页面内容：\n\n```java\npublic class PageIterator\
  \ {\n\n    private PageReader reader;\n    private URLIterator urls;\n\n    public\
  \ PageIterator(PageReader reader, URLIterator urls) {\n        this.urls = urls;\n\
  \        this.reader = reader;\n    }\n\n    public synchronized String getNextPageOrNull()\
  \ {\n        if (urls.hasNext())\n            getPageFor(urls.next());\n       \
  \ else\n            return null;\n    }\n\n    public String getPageFor(String url)\
  \ {\n        return reader.getPageFor(url);\n    }\n}\n```\n\n`PageIterator` 的实例可以在多个线程之间共享，每个线程都使用它自己的\
  \ `PageReader` 实例来读取和解析从迭代器获取的页面。\n\n注意，我们把 `synchronized` 块保持得非常小。它只包含了 `PageIterator`\
  \ 内部深处的关键区域。与尽可能多地同步相比，尽可能少地同步总是更好的。\n\n### 单线程吞吐量计算\n\n现在我们来做一些简单的计算。为了论证，假设如下：\n\
  \n- 获取页面的 I/O 时间（平均）：1 秒\n- 解析页面的处理时间（平均）：0.5 秒\n- I/O 需要 0% 的 CPU，而处理需要 100% 的\
  \ CPU。\n\n对于单线程处理的 `N` 个页面，总执行时间为 `1.5 秒 * N`。图 A-1 显示了 13 个页面或约 19.5 秒的。\n\n**图\
  \ A-1** 单线程\n\n![Image](img/Image00054.jpg)\n\n### 多线程吞吐量计算\n\n如果可以按任何顺序获取页面并独立处理页面，就可以使用多个线程来增加吞吐量。如果我们使用三个线程会发生什么？在相同时间内我们可以获取多少页面？\n\
  \n如图 A-2 所示，多线程解决方案允许受进程限制的页面解析与受 I/O 限制的页面读取重叠。在理想世界中，这意味着处理器被充分利用了。每个一秒的页面读取都与两次解析重叠。因此，我们每秒可以处理两个页面，这是单线程解决方案吞吐量的三倍。\n\
  \n**图 A-2** 三并发线程\n\n![Image](img/Image00055.jpg)\n\n## 死锁\n\n想象一个 Web 应用程序具有两个有限大小的共享资源池：\n\
  \n- 一个用于进程中存储本地作业的数据库连接池\n- 一个连接到主存储的 MQ 连接池\n\n假设该应用程序中有两个操作：创建（create）和更新（update）：\n\
  \n- 创建—获取主存储和数据库的连接。与主存储服务通信，然后将工作存储在本地进程中存储数据库中。\n- 更新—获取数据库连接，然后获取主存储连接。从进程中存储数据库中读取，然后发送到主存储。\n\
  \n当用户数多于池大小时会发生什么？假设每个池的大小为十。\n\n- 十个用户尝试使用创建，因此所有十个数据库连接都被获取，每个线程在获取数据库连接后、但在获取主存储连接之前被中断。\n\
  - 十个用户尝试使用更新，因此所有十个主存储连接都被获取，每个线程在获取主存储后、但在获取数据库连接之前被中断。\n- 现在，这十个“创建”线程必须等待获取主存储连接，而十个“更新”线程必须等待获取数据库连接。\n\
  - 死锁。系统永远无法恢复。\n\n这听起来可能是不可能的，但谁想要一个每隔一周就死锁的系统呢？谁想要调试一个症状难以复现的系统？这就是现场会发生的问题，然后需要几周才能解决。\n\
  \n典型的“解决方案”是引入调试语句来找出发生了什么。当然，调试语句改变了代码，以至于死锁会在不同的情况下发生，并需要几个月才会再次发生。^(4)\n\n要真正解决死锁问题，我们需要理解导致它的原因。死锁的发生需要满足四个条件：\n\
  \n- 互斥（Mutual exclusion）\n- 持有并等待（Lock & wait）\n- 非剥夺（No preemption）\n- 循环等待（Circular\
  \ wait）\n\n### 互斥\n\n当多个线程需要使用相同的资源，且这些资源：\n\n- 无法被多个线程同时使用。\n- 数量有限时。\n\n这种资源的常见例子是数据库连接、打开用于写入的文件、记录锁或信号量。\n\
  \n### 持有并等待\n\n一旦线程获取了资源，在它获取了所有需要的其他资源并完成工作之前，它将不会释放该资源。\n\n### 非剥夺\n\n一个线程不能从另一个线程夺取资源。一旦一个线程持有资源，另一个线程获取它的唯一方法是持有该资源的线程释放它。\n\
  \n### 循环等待\n\n这也被称为“致命拥抱”。想象两个线程 `T1` 和 `T2` 以及两个资源 `R1` 和 `R2`。`T1` 拥有 `R1`，`T2`\
  \ 拥有 `R2`。`T1` 也需要 `R2`，而 `T2` 也需要 `R1`。这就像如图 A-3 所示：\n\n**图 A-3**\n\n![Image](img/Image00056.jpg)\n\
  \n这四个条件必须同时满足才可能发生死锁。破坏其中任何一个条件，死锁就不会发生。\n\n### 破坏互斥\n\n避免死锁的一种策略是避开互斥条件。你可以通过以下方式实现：\n\
  \n- 使用允许同时使用的资源，例如 `AtomicInteger`。\n- 增加资源数量，使其超过竞争线程的数量。\n- 在夺取之前检查所有资源是否已空闲。\n\
  \n遗憾的是，大多数资源数量都是有限的且不允许同时使用。而且第二个资源的身份取决于第一个资源的结果，这并不罕见。但不要气馁；还剩下三个条件。\n\n### 破坏持有并等待\n\
  \n如果你拒绝等待，也可以消除死锁。在夺取每个资源之前检查它，如果遇到一个忙碌的资源，则释放所有资源并重新开始。\n\n这种方法引入了几个潜在问题：\n\n-\
  \ 饥饿（Starvation）—一个线程一直无法获取它需要的资源（可能它拥有一种极少可用的独特资源组合）。\n- 活锁（Livelock）—多个线程可能会同步进行，并且都获取一个资源然后释放一个资源，循环往复。这在简单的\
  \ CPU 调度算法中特别容易（考虑嵌入式设备或简单的手写线程均衡算法）。\n\n这两种情况都会导致吞吐量低下。第一种导致 CPU 利用率低，而第二种导致高且无用的\
  \ CPU 利用率。尽管这种策略听起来效率低下，但比没有要好。它的优点是，如果其他方法都失败，它几乎总是实现的。\n\n### 破坏非剥夺\n\n避免死锁的另一种策略是允许线程从其他线程夺取资源。这通常通过简单的请求机制实现。当线程发现资源忙时，它请求所有者释放它。如果所有者也在等待其他资源，它们将释放所有资源并重新开始。\n\
  \n这类似于之前的方法，但优点是允许线程等待资源。这减少了重新开始的次数。但请注意，管理所有这些请求可能是复杂的。\n\n### 破坏循环等待\n\n\n\n\n\
  这是防止死锁最常见的方法。对于大多数系统，它只需要所有双方达成的一项简单约定即可。\n\n在上面的示例中，`Thread 1` 想要 `Resource 1`\
  \ 和 `Resource 2`，而 `Thread 2` 想要 `Resource 2` 然后是 `Resource 1`。只需强制 `Thread 1` 和\
  \ `Thread 2` 以相同的顺序分配资源，就可以消除循环等待条件。\n\n更通用地说，如果所有线程都能对资源的全局排序达成一致，并且它们都按照该顺序分配资源，那么死锁是不可能的。与其他所有策略一样，这可能会导致问题：\n\
  \n- 获取顺序可能与使用顺序不对应；因此，在开始时的资源可能直到结束才被使用。这会导致资源被锁的时间超过严格需要的时间。\n- 有时你无法对资源的获取实施排序。如果第二个资源的\
  \ `ID` 来自于对第一个资源所执行的操作，那么排序就是不可行的。\n\n所以，避免死锁的方法有很多。有些会导致饥饿，而另一些方法则会消耗大量 CPU 并降低响应速度。天下没有免费的午餐（TANSTAAFL）！^(5)\n\
  \n将解决方案中与线程相关的部分隔离以便进行调优和实验，是获得确定最佳策略所需洞见的有力方法。\n\n## 测试多线程代码\n\n我们如何编写一个测试来证明以下代码是有问题的呢？\n\
  \n```java\npublic class ClassWithThreadingProblem {\n    int nextId;\n\n    public\
  \ int takeNextId() {\n        return nextId++;\n    }\n}\n```\n\n这里是一个可以证明代码有问题的测试描述：\n\
  \n- 记住 `nextId` 的当前值。\n- 创建两个线程，它们都调用一次 `takeNextId()`。\n- 验证 `nextId` 是否比初始值增加了\
  \ 2。\n- 运行此过程，直到我们证明 `nextId` 仅增加了 1 而不是 2。\n\n列表 A-2 显示了这样一个测试：\n\n**列表 A-2 `ClassWithThreadingProblemTest.java`**\n\
  \n```java\npackage example;\n\nimport static org.junit.Assert.fail;\nimport org.junit.Test;\n\
  \npublic class ClassWithThreadingProblemTest {\n    @Test\n    public void twoThreadsShouldFailEventually()\
  \ throws Exception {\n        final ClassWithThreadingProblem classWithThreadingProblem\
  \ = new ClassWithThreadingProblem();\n\n        Runnable runnable = new Runnable()\
  \ {\n            public void run() {\n                classWithThreadingProblem.takeNextId();\n\
  \            }\n        };\n\n        for (int i = 0; i < 50000; ++i) {\n      \
  \      int startingId = classWithThreadingProblem.lastId;\n            int expectedResult\
  \ = 2 + startingId;\n\n            Thread t1 = new Thread(runnable);\n         \
  \   Thread t2 = new Thread(runnable);\n            t1.start();\n            t2.start();\n\
  \            t1.join();\n            t2.join();\n\n            int endingId = classWithThreadingProblem.lastId;\n\
  \n            if (endingId != expectedResult)\n                return;\n       \
  \ }\n\n        fail(\"Should have exposed a threading issue but it did not.\");\n\
  \    }\n}\n```\n\n![Image](img/Image00057.jpg)\n![Image](img/Image00058.jpg)\n\n\
  这个测试确实为并发更新问题设置了条件。然而，问题发生的频率非常低，以至于大多数情况下这个测试无法检测到它。\n\n事实上，为了真正检测到问题，我们需要将迭代次数设置为一百万次以上。即使如此，在循环次数为\
  \ 1,000,000 的十执行中，问题只发生了一次。这意味着我们可能应该将迭代次数设置为远超一亿次才能获得可靠的失败。我们准备等多久呢？\n\n即使我们对测试进行了调优以便在机器上获得可靠的失败，我们可能还需要使用不同的值重新调优测试，以便在另一个机器、操作系统或\
  \ `JVM` 版本上演示失败。\n\n这还是一个*简单*的问题。如果我们不能通过这个问题轻松证明代码是有问题的，我们以后将如何检测到真正复杂的问题呢？\n\n\
  那么，我们可以采取什么方法来演示这种简单的失败？更重要的是，我们如何编写测试来演示更复杂代码中的失败呢？当我们不知道该从哪里寻找时，又如何能够发现代码是否存在故障呢？\n\
  \n这里有几个想法：\n\n- **蒙特卡洛测试。** 让测试具有灵活性，以便进行调优。然后反复运行测试——例如在测试服务器上——随机更改调优值。如果测试任何失败，代码就是问题的。确保尽早开始编写这些测试，以便持续集成服务器尽早运行它们。顺便，确保你仔细记录测试失败的条件。\n\
  - 在每一个目标部署平台上运行测试。反复。持续。测试运行且没有失败的时间越长，就可能：\n    - 生成代码是正确的，或者\n    - 测试不足以暴露问题。\n\
  - 在负载不断变化的机器上运行测试。最隐蔽的问题是那些区域小到十亿分之一才发生一次的问题。\n\n### 基于测试的代码工具支持\n\nIBM 创建了一个名为\
  \ `ConTest` 的工具。^(6) 它对类进行插桩，使得线程安全的代码更容易失败。\n\n我们与 IBM 或开发 `ConTest` 的团队没有直接关系。我们的一个同事向我们推荐了它。我们发现发现线程问题的有了巨大的提升。\n\
  \n以下是使用 `ConTest` 的概述：\n\n- 像上面提到的编写测试和生产代码。\n- 使用 `ConTest` 对代码进行插桩。\n- 运行测试。\n\
  \n当我们使用 `ConTest` 对代码进行插桩后，成功率从大约百万分之一变成了三十分之一。\n\n### 总结\n\n本章是对并发编程这一庞大且危险领域的短暂短游。我们仅仅触及了皮毛。这里的重点是帮助保持并发代码清洁的规范，但如果你打算编写并发系统，还需要学习更多。我们推荐阅读\
  \ Doug Lea 的精彩著作《Concurrent Programming in Java: Design Principles and Patterns》。^(7)\n\
  \n在本章中，我们讨论了并发更新，以及防止它的清洁同步和锁定规范。我们讨论了线程如何提高 I/O 密集系统的吞吐量，并展示了实现此类改进的技巧。我们讨论了死锁以及如何清洁的方式防止。最后，我们讨论了通过对代码进行插桩来暴露问题的策略。\n\
