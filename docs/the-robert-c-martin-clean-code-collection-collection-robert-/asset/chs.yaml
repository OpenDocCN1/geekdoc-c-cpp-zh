- "# 罗伯特 C. Martin 洁净代码集（合集）（Robert C. Martin 系列）\n\n\n\n![](img/Image00155.jpg)\n\
  \n\n![image](img/Image00001.jpg)\n\n\n## 出版说明由两本畅销电子书组成：\n\n- `整洁代码：敏捷软件手艺手册`\n\
  - `整洁的代码者：专业程序员的行为规范`\n\n在本集中，罗伯特·C·马丁（也称为“鲍鲍叔”）提供了一种从一开始就编写更好代码的实用方法。他揭示了将软件工匠与仅仅是“9\
  \ 到 5”程序员区分开来的纪律、技术、工具和实践。本集中包含了你成为真正的软件专业人士所需的工具和方法。\n\n—Prentice Hall 出版与制作团队\n\
