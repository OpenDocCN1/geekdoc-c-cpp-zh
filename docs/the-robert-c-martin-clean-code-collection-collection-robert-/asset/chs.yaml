  \n\n\n\n```java\nreturn (fPrefix > fContextLength ? ELLIPSIS : “”) +\nfExpected.substring(Math.max(0,\
  \ fPrefix - fContextLength),\nfPrefix);\n}\n\nprivate String computeCommonSuffix()\
  \ {\n    int end = Math.min(fExpected.length() - fSuffix + 1 + fContextLength,\n\
  \    fExpected.length());\n    return fExpected.substring(fExpected.length() - fSuffix\
  \ + 1, end) +\n    (fExpected.length() - fSuffix + 1 < fExpected.length() - fContextLength\
  \ ? ELLIPSIS : “”);\n}\n\nprivate boolean areStringsEqual() {\n    return fExpected.equals(fActual);\n\
  }\n\n}\n```\n\n你可能对这个模块有一些意见。这里有一些长长的表达式，以及一些奇怪的 `+1` 等。但总的来说，这个模块写得很好。毕竟，它看起来可能像\
  \ Listing 15-3。\n\n**Listing 15-3 `ComparisonCompator.java (重构后)`**\n\n```java\n\
  package junit.framework;\n\npublic class ComparisonCompactor {\n    private int\
  \ ctxt;\n    private String s1;\n    private String s2;\n    private int pfx;\n\
  \    private int sfx;\n\n    public ComparisonCompactor(int ctxt, String s1, String\
  \ s2) {\n        this.ctxt = ctxt;\n        this.s1 = s1;\n        this.s2 = s2;\n\
  \    }\n\n    public String compact(String msg) {\n        if (s1 == null || s2\
  \ == null || s1.equals(s2))\n            return Assert.format(msg, s1, s2);\n  \
  \      pfx = 0;\n        for (; pfx < Math.min(s1.length(), s2.length()); pfx++)\
  \ {\n            if (s1.charAt(pfx) != s2.charAt(pfx))\n                break;\n\
  \        }\n        int sfx1 = s1.length() - 1;\n        int sfx2 = s2.length()\
  \ - 1;\n        for (; sfx2 >= pfx && sfx1 >= pfx; sfx2--, sfx1--) {\n         \
  \   if (s1.charAt(sfx1) != s2.charAt(sfx2))\n                break;\n        }\n\
  \        sfx = s1.length() - sfx1;\n        String cmp1 = compactString(s1);\n \
  \       String cmp2 = compactString(s2);\n        return Assert.format(msg, cmp1,\
  \ cmp2);\n    }\n\n    private String compactString(String s) {\n        String\
  \ result = “[“ + s.substring(pfx, s.length() - sfx + 1) + “]”;\n        if (pfx\
  \ > 0)\n            result = (pfx > ctxt ? “…” : “”) +\n            s1.substring(Math.max(0,\
  \ pfx - ctxt), pfx) + result;\n        if (sfx > 0) {\n            int end = Math.min(s1.length()\
  \ - sfx + 1 + ctxt, s1.length());\n            result = result + (s1.substring(s1.length()\
  \ - sfx + 1, end) +\n            (s1.length() - sfx + 1 < s1.length() - ctxt ? “…”\
  \ : “”));\n        }\n        return result;\n    }\n}\n```\n\n尽管作者留下的这个模块状态非常完好，但*童子军规则*告诉我们，离开时应该比发现它时更整洁。那么，我们该如何改进\
  \ Listing 15-2 中的原始代码呢？\n\n我不喜欢的是成员变量的 `f` 前缀。今天的环境使得这种作用域编码变得多多的。所以，让我们去掉所有的 `f`。\n\
  \n```java\nprivate int contextLength;\nprivate String expected;\nprivate String\
  \ actual;\nprivate int prefix;\nprivate int suffix;\n```\n\n接下来，我们在 `compact` 函数的开头有一个没有被封装的条件判断。\n\
  \n```java\npublic String compact(String message) {\n    if (expected == null ||\
  \ actual == null || areStringsEqual())\n        return Assert.format(message, expected,\
  \ actual);\n    findCommonPrefix();\n    findCommonSuffix();\n    String expected\
  \ = compactString(this.expected);\n    String actual = compactString(this.actual);\n\
  \    return Assert.format(message, expected, actual);\n}\n```\n\n这个条件判断应该被封装起来，使我们的意图清晰。所以，让我们提取出一个方法来解释方法。\n\
  \n```java\npublic String compact(String message) {\n    if (shouldNotCompact() )\n\
  \        return Assert.format(message, expected, actual);\n    findCommonPrefix();\n\
  \    findCommonSuffix();\n    String expected = compactString(this.expected);\n\
  \    String actual = compactString(this.actual);\n    return Assert.format(message,\
  \ expected, actual);\n}\n\nprivate boolean shouldNotCompact() {\n    return expected\
  \ == null || actual == null || areStringsEqual();\n}\n```\n\n我不怎么喜欢 `compact` 函数中的\
  \ `this.expected` 和 `this.actual` 记法。这是在我们把 `fExpected` 重命名为 `expected` 时发生的。为什么这个函数中的变量和成员变量同名呢？它们不代表其他东西吗？我们应该让命名消除歧义。\n\
  \n```java\nString compactExpected = compactString(expected);\nString compactActual\
  \ = compactString(actual);\n```\n\n`compact` 函数看起来有点难以理解。所以，让我们反转 `if` 头部并反转逻辑。\n\
  \n```java\npublic String compact(String message) {\n    if (!shouldNotCompact())\
  \ {\n        // ... 逻辑\n    }\n}\n```\n\n\n\n```java\nprivate int findCommonSuffix(int\
  \ prefixIndex) {\n    int expectedSuffix = expected.length() - 1;\n    int actualSuffix\
  \ = actual.length() - 1;\n    for (; actualSuffix >= prefixIndex && expectedSuffix\
  \ >= prefixIndex;\n        actualSuffix--, expectedSuffix--) {\n        if (expected.charAt(expectedSuffix)\
  \ != actual.charAt(actualSuffix))\n            break;\n    }\n    return expected.length()\
  \ - expectedSuffix;\n}\n```\n\n我并不对这样做满意。传递 `prefixIndex` 参数有点主观 [G32]。它起起到建立顺序的作用，但并不能解释为什么需要这种顺序。另一个程序员可能会撤销我们所做的工作，因为没有迹象表明该参数是真正需要的。所以，让我们换一种方法吧。\n\
  \n```java\nprivate void compactExpectedAndActual() {\n    findCommonPrefixAndSuffix();\n\
  \    compactExpected = compactString(expected);\n    compactActual = compactString(actual);\n\
  }\n```\n\n```java\nprivate void findCommonPrefixAndSuffix() {\n    findCommonPrefix();\n\
  \    int expectedSuffix = expected.length() - 1;\n    int actualSuffix = actual.length()\
  \ - 1;\n    for (; actualSuffix >= prefixIndex && expectedSuffix >= prefixIndex;\n\
  \        actualSuffix--, expectedSuffix--) {\n        if (expected.charAt(expectedSuffix)\
  \ != actual.charAt(actualSuffix))\n            break;\n    }\n    suffixIndex =\
  \ expected.length() - expectedSuffix;\n}\n```\n\n```java\nprivate void findCommonPrefix()\
  \ {\n    prefixIndex = 0;\n    int end = Math.min(expected.length(), actual.length());\n\
  \    for (; prefixIndex < end; prefixIndex++)\n        if (expected.charAt(prefixIndex)\
  \ != actual.charAt(prefixIndex))\n            break;\n}\n```\n\n我们将 `findCommonPrefix`\
  \ 和 `findCommonSuffix` 还原原来的样子，将 `findCommonSuffix` 重命名为 `findCommonPrefixAndSuffix`，并让它在执行其他操作之前调用\
  \ `findCommonPrefix`。这以一种更戏剧的方式建立了这两个函数的时间顺序。它也指出了 `findCommonPrefixAndSuffix` 是多么丑。现在让我们来清理它。\n\
  \n```java\nprivate void findCommonPrefixAndSuffix() {\n    findCommonPrefix();\n\
  \    int suffixLength = 1;\n    for (; !suffixOverlapsPrefix(suffixLength); suffixLength++)\
  \ {\n        if (charFromEnd(expected, suffixLength) !=\n            charFromEnd(actual,\
  \ suffixLength))\n            break;\n    }\n    suffixIndex = suffixLength;\n}\n\
  \nprivate char charFromEnd(String s, int i) {\n    return s.charAt(s.length()-i);\n\
  }\n\nprivate boolean suffixOverlapsPrefix(int suffixLength) {\n    return actual.length()\
  \ - suffixLength < prefixLength ||\n    expected.length() - suffixLength < prefixLength;\n\
  }\n```\n```\n\n这样好多了。它暴露了 `suffixIndex` 实际上是后缀的长度，而且命名不当。`prefixIndex` 也是如此，尽管在这种情况下，“index”和“length”是同义词。尽管如此，使用“length”更一致。问题在于\
  \ `suffixIndex` 变量不是基于 0 的索引；它是基于 1 的，因此不是一个真正的长度。这也是为什么在 `computeCommonSuffix`\
  \ 中有那么多 `+1` 的原因 [G33]。所以让我们修复它。结果在 Listing 15-4。\n\n**Listing 15-4 `ComparisonCompactor.java\
  \ (interim)`**\n\n```java\npublic class ComparisonCompactor {\n    …\n    private\
  \ int suffixLength;\n    …\n    private void findCommonPrefixAndSuffix() {\n   \
  \     findCommonPrefix();\n        suffixLength = 0;\n        for (; !suffixOverlapsPrefix(suffixLength);\
  \ suffixLength++) {\n            if (charFromEnd(expected, suffixLength) !=\n  \
  \              charFromEnd(actual, suffixLength))\n                break;\n    \
  \    }\n    }\n\n    private char charFromEnd(String s, int i) {\n        return\
  \ s.charAt(s.length() - i - 1);\n    }\n\n    private boolean suffixOverlapsPrefix(int\
  \ suffixLength) {\n        return actual.length() - suffixLength <= prefixLength\
  \ ||\n        expected.length() - suffixLength <= prefixLength;\n    }\n    …\n\
  \    private String compactString(String source) {\n        String result =\n  \
  \      DELTA_START +\n        source.substring(prefixLength, source.length() - suffixLength)\
  \ +\n        DELTA_END;\n        if (prefixLength > 0)\n            result = computeCommonPrefix()\
  \ + result;\n        if (suffixLength > 0)\n            result = result + computeCommonSuffix();\n\
  \        return result;\n    }\n    …\n    private String computeCommonSuffix()\
  \ {\n        int end = Math.min(expected.length() - suffixLength +\n        contextLength,\
  \ expected.length()\n        );\n        return\n        expected.substring(expected.length()\
  \ - suffixLength, end) +\n        (expected.length() - suffixLength <\n        expected.length()\
  \ - contextLength ?\n        ELLIPSIS : “”);\n    }\n}\n```\n\n我们将 `computeCommonSuffix`\
  \ 中的 `+1` 替换为 `charFromEnd` 中的 `-1`（这在它完全合情合理），并在 `suffixOverlapsPrefix` 中使用了两个\
  \ `<=` 运算符（这在它们也合情合理）。这允许我们将 `suffixIndex` 改为 `suffixLength`，极大地提高了代码的可读性。但问题是，`suffixIndex`\
  \ 变量不是基于 0 的；它是基于 1 的，因此不是一个真正的长度。这也是为什么在 `computeCommonSuffix` 中有那么多 `+1` 的原因 [G33]。所以让我们修复它。结果在\
  \ Listing 15-4。\n\n\n\n\n```java\n.append(startingContext())\n.append(DELTA_START)\n\
  .append(delta(s))\n.append(DELTA_END)\n.append(endingContext())\n.append(endingEllipsis())\n\
  .toString();\n}\n\nprivate String startingEllipsis() {\n    return prefixLength\
  \ > contextLength ? ELLIPSIS : \"\";\n}\n\nprivate String startingContext() {\n\
  \    int contextStart = Math.max(0, prefixLength - contextLength);\n    int contextEnd\
  \ = prefixLength;\n    return expected.substring(contextStart, contextEnd);\n}\n\
  \nprivate String delta(String s) {\n    int deltaStart = prefixLength;\n    int\
  \ deltaEnd = s.length() - suffixLength;\n    return s.substring(deltaStart, deltaEnd);\n\
  }\n\nprivate String endingContext() {\n    int contextStart = expected.length()\
  \ - suffixLength;\n    int contextEnd = Math.min(contextStart + contextLength, expected.length());\n\
  \    return expected.substring(contextStart, contextEnd);\n}\n\nprivate String endingEllipsis()\
  \ {\n    return (suffixLength > contextLength ? ELLIPSIS : \"\");\n}\n}\n```\n\n\
  这写得其实非常漂亮。该模块被分为一组分析函数和另一组合成函数。它们经过了拓扑排序，使得每个函数的定义都紧跟在它的使用之后。所有的分析函数都出现在前面，所有的合成函数都出现在最后。\n\
  \n如果你仔细观察，你会发现我反转了在本章早期所做出的几个决定。例如，我将一些提取的方法内联回了 `formatCompactedComparison` 中，并且我改变了\
  \ `shouldNotBeCompacted` 表达式的含义。这很典型。通常，一次重构会导致另一次重构，而后者会导致第一次重构被撤销。重构是一个充满尝试与错误的迭代过程，最终不可避免地收敛到我们认为得起专业水准的结果。\n\
  \n### 结论\n\n这样，我们就满足了“童子军规则”。我们留下的这个模块比我们发现它时稍微整洁一点。并不是说它不整洁，作者们的工作做得非常好。但没有任何一个模块是可以免于改进的，我们每个人都有责任让代码比我们发现它时更好一点。\n\
  \n## 16 重构 `SerialDate`\n\n![Image](img/Image00048.jpg)\n\n如果你访问 `http://www.jfree.org/jcommon/index.php`，你会发现\
  \ JCommon 库。在该库深处有一个名为 `org.jfree.date` 的包。在该包中有一个名为 `SerialDate` 的类。我们将探索这个类。\n\
  \n`SerialDate` 的作者是 David Gilbert。David 显然是一个经验丰富且胜任的程序员。正如我们将会看到的，他在代码中展现了高度的专业水平和纪律。从任何意义上说，这都是“良好的代码”。而我要把它撕得粉碎。\n\
  \n这并不是一种出于恶意的行为。我不认为自己比 David 高出多少，以至于有权对他的代码进行评判。事实上，如果你发现我写的一些代码，我信你也能找到很多可以抱怨的地方。\n\
  \n不，这并不是一种刻薄或傲慢的行为。我即将要做的无非是一次专业的评审。这是我们应该都习惯并乐意做的事。而且当别人为我们做这种事时，我们也应该表示欢迎。只有通过这样的批评，我们才能学习。医生这样做，飞行员也这样做，律师也这样做。我们程序员也需要学会如何这样做。\n\
  \n关于 David Gilbert 的另外一点：David 不仅仅是一个优秀的程序员。David 有勇气和善意将他的代码免费提供给整个社区。他将其公开供所有人看到，并邀请公众使用和接受公众监督。这做得很好！\n\
  \n`SerialDate`（`Listing B-1`，第 `349` 页）是一个表示 Java 中日期的类。既然 Java 已经有了 `java.util.Date`\
  \ 和 `java.util.Calendar` 等类，为什么还需要一个表示日期的类呢？作者写这个类是为了解决我自己经常感受到的某种痛苦。他在开头的 Javadoc\
  \ 注释（第 67 行）中很好地解释了这一点。我们可以对他的意图进行争论，但我确实处理过这个问题，我很欢迎一个专注于“日期”而不是“时间”的类。\n\n###\
  \ 首先，让它运行\n\n在名为 `SerialDateTests` 的类中有些单元测试（`Listing B-2`，第 `366` 页）。这些测试都通过了。遗憾的是，对测试进行快速检查显示，它们并没有测试所有内容\
  \ [T1]。例如，对 `MonthCodeToQuarter` 方法（第 334 行）执行“查找引用”搜索，显示它没有被使用 [F4]。因此，单元测试没有覆盖它。\n\
  \n于是我启动了 Clover 来查看单元测试覆盖了哪些，没覆盖哪些。Clover 报告，单元测试只执行了 `SerialDate` 中 185 条可执行语句中的\
  \ 91 条（约 50%）[T2]。覆盖率图看起来像一块补丁布，类中散落着大块块未执行的代码。\n\n我的目标是完全理解并重构这个类。如果没有更大的测试覆盖率，我无法做到这一点。因此，我写了自己的的一套单元测试（`Listing\
  \ B-4`，第 `374` 页）。\n\n当你查看这些测试时，你会发现其中很多测试被注释掉了。这些测试没有通过。它们代表我认为 `SerialDate` 应该具备的行为。因此，当我重构\
  \ `SerialDate` 时，我将努力让这些测试通过。\n\n即使有些测试被注释掉了，Clover 报告说新的单元测试执行了 185 条可执行语句中的 170\
  \ 条（92%）。这很不错，我认为我们还能把这个数字提高。前几个被注释掉的测试（第 23-63 行）是我个人的自负。程序的设计并没有通过这些测试，但对我来说是显而易见的\
  \ [G2]。\n\n第 153 行和 154 行的测试没有通过。显然，它们应该通过 [G2]。我们可以通过对 `stringToCode` 函数进行以下更改来修复这个问题，以及第\
  \ 163 行到 213 行的测试。\n\n`testWeekdayToString` 方法原本写了，但显然它不应该是大小敏感的。编写这些测试很容易 [T3]。让它们通过更容易；我只需将第\
  \ 259 行和 263 行改为 `equalsIgnoreCase`。\n\n我注释掉了第 32 行和 45 行的测试，因为我不确定是否应该支持“tues”和“thurs”这些缩写。\n\
  \n第 318 行的注释测试暴露了 `getFollowingDayOfWeek` 方法（第 672 行）中的 Bug。2004 年 12 月 25 日是星期六。下一个周六是\
  \ 2005 年 1 月 1 日。然而，当我们运行测试时，看到 `getFollowingDayOfWeek` 返回 12 月 25 日作为 12 月 25 日之后的周六。显然，这是错误的\
  \ [G3], [T1]。我们在第 685 行发现了问题。这是一个典型的边界条件错误 [T5]。它应该读写如下：\n\n```java\nif (baseDOW\
  \ >= targetWeekday) {\n```\n\n有趣的是，这个函数曾是某次早期修复的目标。变更历史（第 43 行）显示 `getPreviousDayOfWeek,\
  \ getFollowingDayOfWeek` 和 `getNearestDayOfWeek` 修复了某些“bug” [T6]。\n\n\n\n\n\n`testGetNearestDayOfWeek`\
  \ 单元测试（第 329 行）测试了 `getNearestDayOfWeek` 方法（第 705 行），它最初并没有现在这样冗长且详尽。我为其添加了很多测试用例，因为我最初的测试用例并没有全部通过\
  \ [T6]。你可以通过查看被注释掉的测试用例发现失败的模式。这种模式揭示了问题 [T7]。它显示如果最近的日期在未来，算法就会失败。显然存在某种边界条件错误\
  \ [T5]。\n\nClover 报告的测试覆盖率模式也趣 [T8]。第 719 行从未被执行过！这意味着第 718 行的 `if` 语句始终为假。果不其然，查看代码发现确实如此。`adjust`\
  \ 变量始终是负数，因此不能大于或等于 4。所以这个算法是错的。\n\n正确的算法所示：\n\n```java\nint delta = targetDOW -\
  \ base.getDayOfWeek();\n\nint positiveDelta = delta + 7;\n\nint adjust = positiveDelta\
  \ % 7;\n\nif (adjust > 3)\nadjust -= 7;\n\nreturn SerialDate.addDays(adjust, base);\n\
  ```\n\n最后，第 417 行和第 429 行的测试可以通过抛出 `IllegalArgumentException` 来通过，而不是从 `weekInMonthToString`\
  \ 和 `relativeToString` 返回错误字符串。\n\n通过这些更改，所有的单元测试都通过了，我相信 `SerialDate` 现在可以正常工作了。现在是时候让它变得“正确”了。\n\
  \n### 然后使其正确\n\n我们将从 `SerialDate` 的顶部一直到底，边走边改进它。虽然你会在讨论中看不到这一点，但在每次修改之后，我都会运行所有的\
  \ `JCommon` 单元测试，包括我改进的 `SerialDate` 单元测试。所以请放心，你在这里看到的每一个更改对整个 `JCommon` 都是有效的。\n\
  \n从第 1 行开始，我们看到大量包含许可信息、版权、作者和变更历史的注释。我承认某些需要处理的法律问题，因此版权和许可必须保留。另一方面，变更历史是 20 世纪\
  \ 60 年代的遗留。我们现在有源代码控制工具来完成这些工作。这段历史应该被删除 [C1]。\n\n从第 61 行开始的导入列表可以通过使用 `java.text.*`\
  \ 和 `java.util.*` 来缩短 [J1]。\n\n我对 Javadoc 中的 HTML 格式（第 67 行）感到不适。在一个源文件中包含一种以上的语言会让我很困扰。这条注释中包含了*四种*\
  \ 语言：Java、英语、Javadoc 和 html [G1]。在使用这么多语言时，很难保持条理。例如，第 71 行和第 72 行精美的布局在生成 Javadoc\
  \ 时丢失了，但谁又想在源代码中看到 `<ul>` 和 `<li>` 呢？更好的策略可能是将整个注释包裹在 `<pre>` 中，这样源代码中明显的格式就能在 Javadoc\
  \ 中保留。\n\n第 86 行是类声明。为什么这个类命名为 `SerialDate`？“serial”（序列）这个词有什么意义？是因为该类派生自 `Serializable`\
  \ 吗？这看起来不像。\n\n我不会让你继续猜的。我知道为什么（或者我想我知道为什么）使用“serial”这个词。线索在第 98 行和第 101 行的常量 `SERIAL_LOWER_BOUND`\
  \ 和 `SERIAL_UPPER_BOUND` 中。更好的线索在从第 830 行开始的注释中。这个类命名为 `SerialDate` 是因为它是使用一个“序号”（serial\
  \ number）实现的，这个数字恰好是自 1899 年 12 月 30 日以来的天数。\n\n我对此有两个意见。首先，“序号”这个术语是不准确的。这可能是一个吹毛求疵，但这种表示更像是一个相对偏移量而不是序号。“序号”一词与产品标识标记有关，而与日期无关。所以我不认为这个名字特别有描述性\
  \ [N1]。一个更有描述性的词可能是“ordinal”（序数）。\n\n第二个问题更为重要。`SerialDate` 这个名字暗示了一种实现方式。这个类是一个抽象类。完全没有暗示任何实现细节。事实上，有充分的理由隐藏实现！我觉得这个名字的抽象层级不对\
  \ [N2]。在我看来，这个类的名字应该简单地称为 `Date`。\n\n遗憾的是，Java 库中已经有很多命名为 `Date` 的类了，所以这可能不是最好的选择。因为这个类完全是关于天而不是时间，我考虑过将其命名为\
  \ `Day`，但这个名字在其他地方也被频繁使用。最后，我选择了 `DayDate` 作为最好的折中方案。\n\n从现在的讨论开始，我将使用 `DayDate`\
  \ 术语。由你记住你正在看到的列表仍然使用 `SerialDate`。\n\n我理解为什么 `DayDate` 继承自 `Comparable` 和 `Serializable`。但它为什么要继承自\
  \ `MonthConstants`？`MonthConstants` 类（第 372 页）只是一堆定义月份的静态常量。继承带有常量类是 Java 程序员使用的一种旧技巧。\n\
  \n```java\npublic abstract class DayDate implements Comparable, Serializable {\n\
  \npublic enum Month {\n    JANUARY(1),\n    FEBRUARY(2),\n    MARCH(3),\n    APRIL(4),\n\
  \    MAY(5),\n    JUNE(6),\n    JULY(7),\n    AUGUST(8),\n    SEPTEMBER(9),\n  \
  \  OCTOBER(10),\n    NOVEMBER(11),\n    DECEMBER(12);\n\n    Month(int index) {\n\
  \        this.index = index;\n    }\n\n    public static Month make(int monthIndex)\
  \ {\n        for (Month m : Month.values()) {\n            if (m.index == monthIndex)\n\
  \                return m;\n        }\n        throw new IllegalArgumentException(\"\
  Invalid month index \" + monthIndex);\n    }\n}\n\npublic final int index;\n}\n\
  ```\n\n将 `MonthConstants` 改为这个 `enum` 强制 `DayDate` 类以及所有用户进行大量更改。我花了一个小时完成这些更改。然而，任何以前接受月份\
  \ `int` 的函数现在接受 `Month` 枚举。这意味着我们可以删除 `isValidMonthCode` 方法（第 326 行），以及 `monthCodeToQuarter`（第\
  \ 356 行）中的代码 [G5]。\n\n接下来是第 91 行的 `serialVersionUID`。这个变量用于控制序列化。如果我们更改了它，旧版本软件写入的\
  \ `DayDate` 将无法读取并导致 `InvalidClassException`。如果你不声明 `serialVersionUID` 变量，编译器会自动为你生成一个，每次你做出更改它都会不同。我知道所有文档都建议手动控制这个变量，但我看来自动控制序列化要安全得多\
  \ [G4]。毕竟，我宁愿调试 `InvalidClassException`，也不愿因为忘记更改 `serialVersionUID` 而导致出现异行为。所以我打算删除这个变量——至少目前如此。\n\
  \n我发现第 93 行的注释是冗余的。冗余的注释只是收集谎言和错误信息的地方 [C2]。所以我要删掉它及其同类。\n\n第 97 行和第 100 行的注释提到了序号，这是我之前讨论过的\
