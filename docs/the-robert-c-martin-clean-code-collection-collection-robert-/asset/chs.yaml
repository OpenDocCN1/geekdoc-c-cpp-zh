  \n## 《洁净程序员》的评价\n\n“Bob Martin 在他的最新书中提高了标准。他解释了对专业程序员在管理交互、时间管理、压力、协作以及工具选择方面的期望。除了\
  \ TDD 和 ATDD，Martin 还解释了每个自认为专业的程序员不仅需要而且必须遵循的内容，以便软件开发这一年轻职业的发展。”\n——Markus Gärtner，高级软件开发工程师\
  \ it-agile GmbH www.itagile.de www.shino.de\n\n“有些技术书籍能启发和教学；有些能带来愉悦和趣味。很少有一本技术书籍能同时这四点。Robert\
  \ Martin 的书对我来说一直如此，而《洁净程序员》也不例外。阅读、学习并践行书中教训，你就可以准确地称自己为专业程序员。”\n——George Bullock，微软高级项目经理\n\
  \n“如果计算机科学学位有一份‘毕业后必读清单’，那就是这一本。在现实世界中，你的糟糕代码不会随着学期结束消失，你不会因为在作业截止前夜通宵编程就获得 A，最糟糕的是，你必须与人打交道。所以，编程大师并不意味着专业。《洁净程序员》描述了通往专业化的历程\
  \ . . 而且它写得非常有趣。”\n——Jeff Overbey，伊利诺伊大学厄巴纳-盛槟分校*\n\n“《洁净程序员》不仅仅是一套规则或指南。它包含了通过多年试错或作为大师工匠的学徒工作获得的、通常需要积累的智慧和知识。如果你称自己为软件专业人士，你就需要这本书。”\n\
