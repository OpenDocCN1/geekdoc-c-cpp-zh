  ### 非线程客户端/服务器\n### 使用线程的客户端/服务器\n\n## 附录 B：`org.jfree.date.SerialDate`\n\n## 附录\
  \ C：启发式交叉引用\n\n## 结语\n\n## 索引\n\n## 脚注\n\n\n\n\n\n# 洁净代码：敏捷手之道手册\n\n***给安·玛丽：我生命中永恒的爱。***\n\
  \n## 前言\n\n在丹麦，我们最喜欢的糖果之一是 Ga-Jol，它浓烈的甘草味气与我们这里潮湿且经常阴冷的天气是绝佳的补充。对于我们丹麦人来说，Ga-Jol\
  \ 的魅力之一在于每个糖果盒盖子翻盖上印的那些明智或幽默的格言。今天早上我买了两包这种美味零食，发现上面印着这句古老的丹麦谚语：\n\n*小事上的诚实绝非小事*。\n\
  \n\n\n\n\n“小事不小。”这是一个良好的预兆，与我在这里想要表达的观点如出一辙。小事关大。这是一本关于卑微关注点的书，但其价值绝非微不足道。\n\n“*细节决定一切*，”建筑师路德维希·密斯·凡·德罗哈曾这样说。这句话让我想起了当代关于架构在软件开发中作用的争论，特别是在敏捷开发领域。Bob\
  \ 和我偶尔会发现自己热烈地参与到这种对话中。是的，密斯·凡·德罗哈确实关注实用性，以及构构成伟大建筑基础的永恒形式。另一方面，他也会亲自为他设计的每一栋房子挑选每一个门把手。为什么？因为小事关大。\n\
  \n### 架构与专业主义的基\n\n在我们关于 `TDD` 的持续“辩论”中，Bob 和我发现，我们认同软件架构在开发中具有重要地位，尽管我们对其具体含义的理解可能不同。然而，这些细微的区别并不重要，因为我们可以理所当然地接受：负责任的专业人士在项目初期会投入*一些*时间进行思考和规划。20\
  \ 世纪 90 年代后期那种*完全*由测试和代码驱动的设计理念早已不复存在。然而，对细节的关注是任何宏大愿景都更重要的专业主义基石。首先，专业人士是通过微观的实践获得宏观实践的熟练和信任的。其次，哪怕是极小的粗糙施工——一个关不严实的门、地板上微歪的瓷砖，甚至是杂乱的办公桌——都会完全消除整体的魅力。这就是整洁代码的意义。\n\
  \n尽管如此，架构只是软件开发的一个比喻，特别是对于那些交付初始*产品*的软件部分，就像建筑师交付一座完美的建筑一样。在如今的 `Scrum` 和敏捷时代，重点是快速将*产品*推向市场。我们希望工厂以最快速度运行生产软件。这些是人类工厂：有思想、有情感的编码人员，根据\
  \ `product backlog` 或 `user story` 进行工作以创建*产品*。这种制造的比喻在这类思维中依然强有力。日本汽车制造以及流水线世界的生产方面，启发了许多\
  \ `Scrum` 理念。\n\n### 维护与 TPM 哲学\n\n然而，即使在汽车行业，大部分工作也不在制造，而在于维护——或避免故障。在软件领域，我们所做工作的\
  \ 80% 或以上被趣地称为“维护”：即修复行为。与其拥抱西方对*生产*优质软件的典型关注，我们应该更像建筑行业中的房屋维修工，或者汽车领域的机械师一样去思考。日本管理学对*这一点*怎么看呢？\n\
  \n大约在 1951 年，一种被称为“全生产维护”（`TPM`）的质量管理方法出现在日本。它的重点是维护而非生产。`TPM` 的主要支柱之一是所谓的 `5S`\
  \ 原则。`5S` 是一套纪律——在这里我“纪律（discipline）”一词具有启发性意义。这些 `5S` 原则实际上是精益（Lean——另一个西方流行的流行词，也是软件领域日益突出的热门词汇）的基础。这些原则并非可选项。正如鲍鲍\
  \ 叔叔在序言中所述的，良好的软件实践需要这种纪律：专注、专心和思考。这并不总是关于执行，关于如何推使工厂设备以最佳速度生产。`5S` 哲学包含了这些概念：\n\
  \n*   `Seiri`，即整理（英文中想成“sort”）。知道东西在哪里——使用如合适的命名等方法——至关重要。你认为命名标识符不重要吗？请阅读后续章节。\n\
  *   `Seiton`，即整洁（英文中想成“systematize”）。有一句美国美国谚言：*万物有其位，各就其位*。一段代码应该出现在你预期找到它的地方——如果没有，你应该通过重构（re-factor）让它回到那里。\n\
  *   `Seiso`，即清洁（英文中想成“shine”）：保持工作场所没有悬挂的电线、油渍、碎片和垃圾。这里的作者如何看待在代码中到处充斥着记录历史或未来愿望的注释以及被注释掉的代码行？把它们删掉。\n\
  *   `Seiketsu`，即标准化：小组对如何保持工作场所清洁达成共识。你认为这本书提到过小组内保持一致的编码风格和实践吗？这些标准从哪里来？请继续。\n\
  *   `Shutsuke`，即纪律（*自*律）。这意味着要有纪律遵循这些实践，并频繁反思自己的工作，且愿意改变。\n\n### 将原则应用于代码\n\n如果你接受了挑战——是的，接受了阅读并应用这本书的挑战——你将能够理解并欣赏最后一点。在这里，我们终于深入到一个本该关注产品生命周期的行业中，负责任专业主义的根源。当我们根据\
  \ `TPM` 维护汽车和其他机器时，事后维护（等待 Bug 出现）是反例。相反，我们提升了一个层次：每天检查机器，在磨损部件损坏之前更换它们，或者进行等同于俗语中“1\
  \ 万公里换油”的操作，以防止磨损。在代码中，要无情地重构。你可以进一步提升一个层次，正如 50 多年前 `TPM` 运动所创新的那样：从源头上就构建更具维护性的机器。让代码具有可读性与使其具有执行性一样重要。1960\
  \ 年左右在 `TPM` 圈子引入的终极实践，是关注引入全新的机器或更换旧机器。正如弗雷德·布鲁克斯告诫的那样，我们可能每七年应该从头开始重做主要的软件模块，以清除积攒的废料。也许我们应该将这个时间频率更新为周或天。这就是细节所在。\n\
  \n\n\n\n正如每个房主所知的，这种关注和不断的改进永无止境。建筑师克里斯托弗·亚历山大（Christopher Alexander——模式和模式语言之父）将设计行为本身视为一种微小的、局部的修复行为。他认为精细结构的工艺是建筑师的唯一职责；而宏观形式可以留给模式以及居住者的应用。设计是一个持续进行的过程，不仅在我们为房屋增加新房间时，还当我们关注重新粉漆、更换旧地毯或升级厨房水槽时。大多数艺术都反映着类似的情感。在寻找那些认为上帝的家在细节之中的人时，我们发现自己与\
  \ 19 世纪的法国作家古斯塔夫·福莱贝尔（Gustav Flaubert）为伍。法国诗人保罗·华勒（Paul Valery）建议我们，诗歌永远没有完成，需要不断重做，而停止创作就是放弃。这种对细节的痴迷是所有卓越事业的共同点。因此，也许这里没什么新意，但在阅读这本书时，你将受到挑战，去拾起那些早已因冷漠或追求随性以及仅仅“应对变化”而放弃的良好准则。\n\
  \n遗憾的是，我们通常不将这些关注视为编程艺术的关键基石。我们过早放弃代码，不是因为代码完成了，而是因为我们的价值体系更关注外表，而不是我们交付的内容。这种不关注最终让我们付出了代价：坏钱总是会出现的。无论在工业界还是学术界，研究都谦卑到了保持代码整洁这一低微的。回到我在贝尔实验室软件生产研究组织（`Production`，确实是生产性的！）工作的日子，我们得到了一些草草率的发现，表明一致的缩进风格是低缺陷密度统计学上最显著的指标之一。我们希望架构、编程语言或其他高深概念应该是质量的源泉；作为那些自认为专业性源于对工具掌握和高深设计方法掌握的人，对于那些工厂车间的机器——程序员——通过简单一致地应用缩进风格所增加的价值，我们感到被侮辱。引用我\
  \ 17 年前的著作，这种风格区分了卓越与平庸。日本的世界观理解了普通劳动者的关键价值，更理解了那些源于这些劳动者简单日常行动的开发系统。质量是百万次无私关注行为的结果——而不是某种从天而降的伟大方法。这些行为虽然简单，并不意味着它们是浅的，也并不意味着它们容易。尽管如此，它们仍然是任何人类事业中伟大、更是美的底蕴。忽视它们还称不上是完全的人。\n\
  \n当然，我仍然是从更广泛视角进行思考的倡导者，特别是植根于深层领域知识和软件易用性的架构方法的价值。这本书并不是关于这些的——至少，它显然不是关于这些。这本书传达了一个更微妙的信息，其深刻不应被低估。它符合像彼得·索默尔拉德（Peter\
  \ Sommerlad）、凯夫林·亨尼（Kevlin Henney）和乔瓦尼·阿斯普尼（Giovanni Asproni）这样真正基于代码的人的共识。“代码即设计”和“简单代码”是他们的格言。虽然我们必须记住界面就是程序，且它的结构对我们的程序结构有很多话要做，但持续采取谦卑的态度，认为设计存在于代码之中是至关重要的。在制造的比喻中，重做会导致成本，而在设计中，重做会导致价值。我们应该将代码视为设计努力的美好表达——设计是一个过程，而不是静态的终点。耦合和内聚的架构指标是在代码中实现的。如果你听拉里·康斯坦丁（Larry\
  \ Constantine）描述耦合和内聚，他谈论的是代码——而不是在 `UML` 中常见的高深抽象概念。理查德·加布里尔（Richard Gabriel）在他的论文《抽象之歌》中建议我们，抽象是恶的。代码是反恶，而整洁的代码或许是神性的。\n\
  \n回到我的 Ga-Jol 小故事，我认为需要注意的一点是，丹麦的智慧建议我们不仅要关注小事，而且要在小事上诚实。这意味着对代码诚实，对同事诚实于代码的状态，最重要的是，对我们自己的代码诚实。我们是否尽力做到“离开营地时比发现时更干净”？我们在提交之前是否重构了代码？这些不是次要考虑，而是正处于敏捷价值核心的问题。在\
  \ `Scrum` 中，一种推荐的实践是将重构作为“完成（Done）”概念的一部分。无论是架构还是整洁代码都不坚持完美，只坚持诚实和尽力而为。人皆有错，恕天由。在\
  \ `Scrum` 中，我们让一切变得可见。我们晾出自己的脏衣服。我们对代码的状态诚实，因为代码永远不会完美。我们变得更加完整，更配得上神性，并更接近细节中的那种伟大。\n\
  \n在我们的行业中，我们迫切需要一切能得到的帮助。如果整洁的车间地面可以减少事故，组织良好的车间工具可以提高生产力，我完全支持。至于这本书，它是我见过的关于将精益原则应用于软件的最务实应用。我对这群实实的思考个体体并无他求，他们多年来共同努力，不仅为了变得更好，还通过你现在手中的这些著作将他们的知识赠给行业。它让世界比我在鲍叔叔（Uncle\
  \ Bob）给我发稿之前变得好了一点。\n\n在完成了这次高深见解的练习后，我去清理我的办公桌了。\n\n**James O. Coplien**\n\n丹麦，Mørdrup\n\
  \n### 引言\n\n![Image](img/Image00003.jpg)\n\n哪扇门代表你的代码？哪扇门代表你的团队或你的公司？我们为什么在这个房间里？这只是普通的代码审查，还是我们发现了一堆即将上线的糟糕问题？我们是否在恐慌中调试，翻看我们认为可以运行的代码？我们如何确保在困难时期进入正确的门？答案是：工艺。\n\
  \n学习手工艺有两个部分：知识和工作。你必须获得手工艺人所掌握的原则、模式、实践和启发式知识，并且必须通过努力工作和练习将这些知识磨进你的手指、眼睛和直觉中。\n\
  \n我可以教你骑自行车的物理学。事实上，经典数学相对简单。重力、摩擦力、角动量、重心等，可以用不到一页的公式演示。通过这些公式，我可以向你证明骑自行车是实用的，并给你让它运转的所有知识。但当你第一次跨上车时，你仍然会摔倒。\n\
  \n编码也同样如此。\n\n\n\n在读这本书时，请做好努力学习的准备。这不是一本你可以在飞机上读并在降落前读完的“读后”书。这本书将让你工作，而且是努力工作。你将要做什么样的工作？你将阅读代码——大量的代码。你将被挑战去思考这些代码中哪些地方是正确的，哪些是错误的。在我们拆解模块并重新组装它们时，请你跟进。这将花费时间和精力的；但我们认为这是值得的。\n\
  \n我们将本书分成了三个部分。前几章描述了编写整洁代码的原则、模式和实践。这些章节中有很多代码，读起来将具有挑战性。它们将为你接下来的第二部分做好准备。如果你在读完第一部分后就放下了书，那祝你好运！\n\
  \n书的第二部分是更艰苦的工作。它由几个复杂度不断增加的案例研究组成。每个案例研究都是一次清理代码的练习——将具有某些问题的转换为问题较少的代码。这一部分的细节非常密集。你将不得不在叙述文字和代码列表之间来回切换。你必须分析并理解我们正在处理的代码，并理解我们做出每项更改的推理过程。请留出时间，因为这可能需要你几天时间。\n\
  \n书的第三部分是回报。它包含一个章节，列出了在创建案例研究时收集的启发式（heuristics）和气味（smells）。当我们引导并清理案例研究中的代码时，我们将每一个理由都记录为启发式或气味。我们试图理解自己对正在阅读和修改的代码的反应，并努力捕捉我们为什么会有那种感受、为什么要做所做的事。结果是一个知识库，描述了我们在编写、阅读和清理代码时的思维方式。\n\
  \n如果你不亲自仔细读完本书第二部分的案例研究，那么这个知识库的价值就非常有限。在那些案例研究中，我们对所做的每个更改都进行了仔细注释，并指向启发式的前向引用。这些前向引用出现在方括号中，例如：`[H22]`。这让你看到这些启发式被应用和编写的上下文！极其宝贵的并非启发式本身，而是这些启发式与我们在清理案例研究代码时所做出的离散决策之间的关系。\n\
  \n为了进一步帮助理解这些关系，我们在书末放置了交叉引用，显示了每个前向引用的页码。你可以用它来查找特定启发式被应用的每一个地方。\n\n如果你读了第一和第三部分并跳过了案例研究，那么你又读了另一本关于编写良好软件的“读后”书。但如果你花时间研究案例研究，遵循每一个微小的步骤、每一个细微的决定——如果你把自己置于我们的位置，强迫自己沿着我们思考的路径思考——那么你将对这些原则、模式、实践和启发式获得丰富丰富的理解。它们将不再是“读后”式的知识。它们将刻在你的骨子里、指尖和心中。它们将成为你的一部分，正如当你学会了骑自行车后，自行车成为了你意志的延伸一样。\n\
  \n### **致谢**（Acknowledgments）**\n\n感谢我的两位艺术家，Jeniffer Kohnke 和 Angela Brooks。Jennifer\
  \ 负责每章开头那些惊艳且富有创意的图片，还负责 Kent Beck、Ward Cunningham、Bjarne Stroustrup、Ron Jeffries、Grady\
  \ Booch、Dave Thomas、Michael Feathers 以及我的肖像。\n\nAngela 负责装饰每章内部的巧妙插画。多年来，她为我画了许多图，包括《敏捷软件开发：原则、模式和实践》中的许多插图。她还是我引以为傲的长女女。\n\
  \n特别感谢我的评审员 Bob Bogetti、George Bullock、Jeffrey Overbey，特别是 Matt Heusser。他们非常严厉。他们很残酷。他们毫不留情面。他们有力地促使我做出必要的改进。\n\
  \n感谢我的出版商 Chris Guzikowski 他的支持、鼓励和和蔼的面容。也感谢 Pearson 的编辑团队，包括 Raina Chrobak 让我保持了诚实和准时。\n\
  \n感谢 Micah Martin 以及 8th Light（`[www.8thlight.com](http://www.8thlight.com)`）的所有同事，他们的评审和鼓励。\n\
  \n感谢所有过去、现在和未来的“对象导师”（Object Mentors），包括：Bob Koss、Michael Feathers、Michael Hill、Erik\
  \ Meade、Jeff Langr、Pascal Roy、David Farber、Brett Schuchert、Dean Wampler、Tim Ottinger、Dave\
  \ Thomas、James Grenning、Brian Button、Ron Jeffries、Lowell Lindstrom、Angelique Martin、Cindy\
  \ Sprague、Libby Ottinger、Joleen Craig、Janice Brown、Susan Rosso 等。\n\n感谢 Jim Newkirk，我的朋友兼业务伙伴，他教给我的比他意识到的要多。感谢\
  \ Kent Beck、Martin Fowler、Ward Cunningham、Bjarne Stroustrup、Grady Booch 以及我所有其他的导师、同伴和竞争对手。感谢\
  \ John Vlissides 在关键时刻的陪伴。感谢 Zebra 的伙伴们允许我喋喋不绝地谈论函数应该有多长。\n\n最后，感谢你阅读这些致谢。\n\n##\
  \ **封底介绍**（On the Cover）** \n\n封面上的图像是 M104：帽织星系（The Sombrero Galaxy）。M104 位于室女座，距离我们仅有\
  \ 3000 万光年。它的核心是一个质量相当于十亿倍太阳的超大质量黑洞。这个图像是否让你想起了克林人卫星普拉克西（*Praxis*）的爆炸？我生地记得《星际大战六》中那一幕，它显示了一个飞散的赤道碎片环。从那个场景开始，赤道环已成为科幻爆炸中的常见元素。它甚至被加入到了《星球大战》第一部电影中阿尔德然的爆炸中。\n\
  \n是什么导致了这个环在 M104 周围形成？为什么它有如此巨大的中心球和如此明亮的内核？在我看来，就像是中心黑洞失去了冷静，在星系中心炸出了一个 3 万光年的洞。对于任何可能处于该干扰路径上的文明来说，那将是不幸。\n\
  \n超大质量黑洞吞噬整个恒星作为午餐，将其相当比例的质量转化为能量。`E = MC²` 提供的杠杆已经足够，但当 `M` 是一个恒星质量时：小心！在那个被填饱之前，有多少颗恒星头朝脑地掉进了那个大口？\n\
  \n\n\n这是一本关于优秀编程的书。它充满了代码。我们将从每一个不同的角度来观察代码。我们将从顶部向下看它，从底部向上看它，并从内部分向外穿透它。当我们完成学习时，我们将对代码有深入的了解。而且，我们能够辨别好代码与坏代码的区别。我们将学会如何编写优秀代码，并学会如何将坏代码转换为优秀代码。\n\
  \n## 代码将永远存在\n\n有人可能会认为，一本关于代码的书某种程度上过时了——代码不再是问题所在；我们应该关注的是模型和需求。事实上，有人甚至我们正接近代码的终结。很快所有的代码都将是生成而非编写。程序员将不再被需要，因为业务人员将直接根据规格生成程序。\n\
  \n胡说八道！我们永远无法摆脱代码，因为代码代表了需求的细节。在某种程度上，这些细节是无法被忽略或抽象的；它们必须被规范。将需求详细描述到机器可以执行的程度，*就是编程*。这种规范*就是代码*。\n\
  \n我预计语言的抽象层次将继续提高。我也预计领域特定语言（DSL）的数量将继续增长。这将是一件好事。但它不会消除代码。事实上，所有在这些高级语言和领域特定语言中编写的规范*都是*代码！它们仍然需要严谨、准确，并且足够正式和详细，以便机器能够理解并执行它们。\n\
  \n那些认为代码有一天会消失的人，就像那些希望有一天发现一种不需要形式化的数学的数学家。他们希望有一天我们能发现一种制造机器的方法，让它们做我们想要的，而不是我们所说的。这些机器必须能够非常理解我们，以至于能将模糊的需求翻译成完美执行的、精确满足这些需求的程序。\n\
  \n这种情况永远不会发生。即使是拥有所有直觉和创造力的人类，也无法从客户模糊的感觉中创造出成功的系统。事实上，如果需求规范这一学科教会了我们任何东西，那就是：良好的需求与代码一样正式，并且可以作为该代码的可执行测试！\n\
  \n记住，代码实际上是我们最终表达需求的语言。我们可能会创建更接近需求的语言。我们可能会创建工具来帮助我们解析并将这些需求组装成正式结构。但我们永远无法消除必要的精确性——因此代码永远存在。\n\
  \n## 坏代码\n\n最近我正在读 Kent·Beck 的书籍《实现模式》（*Implementation Patterns*）的前言。(1) 他说：“……这本书基于一个相当脆弱的假设：优秀代码至关重要……”\
  \ 一个*脆弱*的假设？我不同意！我认为这个假设是我们技艺中所有假设中最稳健、支持最充分且过载最多的假设之一（我认为 Kent 也知道这一点）。我们知道优秀代码至关重要，因为我们长期以来一直在应对它的缺失。\n\
  \n我知道有一家公司在 20 世纪 80 年代后期写了一款*杀手级*应用。它非常受欢迎，很多专业人士购买并使用它。但随后发布周期开始拉长。Bug 从一个版本到下一个版本没有得到修复。加载时间增加，崩溃次数增加。我记得那天，我沮丧地关闭了该产品，再也没有用过它。这家公司在那之后不久就破产了。\n\
  \n![Image](img/Image00006.jpg)\n\n二十年后，我遇到了那家公司的一位早期员工，问他发生了什么。答案证实了我的恐惧。他们急于让产品上市，在代码中制造了一大大乱子。随着他们添加越来越多的功能，代码变得越来越糟，直到他们简单地无法再管理它。*是坏代码导致了公司的倒闭。*\n\
  \n*你*是否曾经被坏代码严重阻碍过？如果你是一个有经验的程序员，那么你已经感受过很多次阻碍。事实上，我们给它起了一个名字。我们称之为*涉水*（wading）。我们在坏代码中涉水。我们在纠缠在一起的灌丛和隐藏的陷阱组成的沼泽中艰难前行。我们挣扎着寻找道路，希望得到一些关于正在发生什么的提示或线索；但我们看到的只是越来越多、越来越多无意义的代码。\n\
  \n当然，你曾被坏代码阻碍过。那么——你为什么要写它呢？\n\n你是想快一点吗？你当时很赶吗？也许吧。也许你觉得你没有时间做好工作；如果你花时间清理你的代码，你的老板会对你发火。也许你只是厌倦了开发这个程序，想让它快点结束。或者你看着堆积的其他你承诺要完成的任务，意识到你需要草草写好这个模块，以便移动到下一个任务。我们都做过这种。\n\
  \n我们都看过自己刚刚制造的烂糟子，然后选择将其留到以后再处理。我们都曾看到自己乱糟糟的程序运行而感到轻松，并决定一个运行中的烂糟子比什么都好。我们都说过以后会回去清理的。当然，在那个时候，我们不知道布兰法则（LeBlanc’s\
  \ law）：*以后等于永远*。\n\n## 维护烂糟子的总成本\n\n如果你成为程序员超过二或三年，你可能被别人的杂乱代码严重地拖慢了。如果你成为程序员超过二或三年，你可能被杂乱代码拖慢过。减慢的程度可能是显著的。在一个或两年的跨度内，在项目初期移动非常快的团队可能会发现自己移动得像蜗牛一样。对代码的任何更改都会破坏另外二三个部分。没有任何更改是微不足道的。对系统的任何添加或修改都需要“理解”纠结、扭曲和结节，以便添加更多的纠结、扭曲和结节。随着时间的推移，烂糟子变得如此巨大、深邃、高大，以至于他们无法清理。完全没有办法。\n\
  \n随着混乱的积累，团队的生产力持续下降，渐近于零。随着生产力下降，管理层采取了他们能做的办法：向项目增加更多员工，以期提高生产力。但那些新员工并不熟悉系统的设计。他们不知道符合设计意图的更改与违背设计意图的更改之间的区别。此外，他们以及团队中的其他人都面临着提高生产力的巨大压力。因此，他们制造了越来越多更多的混乱，使生产力进一步向零趋近。（参见图\
  \ 1-1。）\n\n**图 1-1** 生产力随时间\n\n![Image](img/Image00007.jpg)\n\n### 空中大重构\n\n最终团队反抗了。他们告诉管理层，他们无法在这个恶的代码的基础上继续开发。他们要求重构。管理层不想投入资源对整个项目进行全新的重构，但他们无法否认生产力非常糟糕。最终他们屈服于开发者的要求，批准了空中大重构。\n\
  \n一个新的虎队被选了出来。大家都想加入这个团队，因为这是一个全新的项目。他们可以重新开始并创造真正美的东西。但只有最优秀、最聪明的人被选入虎队。其他人必须继续维护现有系统。\n\
  \n\n\n\n现在，两支团队正处于一场竞赛中。虎队团队必须构建一个新系统，能够实现旧系统的所有功能。不仅如此，他们还必须跟上旧系统不断发生的变化。在新系统能够完成旧系统的所有功能之前，管理层不会替换旧系统。\n\
  \n这场竞赛可能会持续很长一段时间。我见过它耗时 10 年。而当它完成时，虎队团队的原始成员早已离去，而现在的成员却要求重新设计新系统，因为它乱得一团糟。\n\n\
  如果你经历过我刚才讲述的故事中哪怕只是一小部分，那么你已经知道，花时间保持代码整洁不仅具有成本效益，而且关乎职业的生存。\n\n### 态度\n\n你是否曾涉入如此严重的混乱，以至于花费了几周时间才完成本该几小时内就能完成的工作？你是否见过本该只改一行代码的，结果却在几百个不同的模块中进行？这些症状实在太常见了。\n\
  \n为什么代码会发生这种情况？为什么好的代码会如此迅速腐烂成糟糕的代码？我们有很多解释。我们抱怨需求以违背原始设计的方式发生了变化。我们哀叹进度太紧，无法把事情做好。我们胡乱抱怨愚蠢的经理、不宽容的客户、没用的营销人员和电话推销员。但是，亲爱的迪尔伯特，错不在于我们的星宿，而在我们自己。我们不专业。\n\
  \n这可能是一颗难下咽的苦药。这种混乱怎么能是`我们`的错呢？需求呢？进度呢？那些愚蠢的经理和没用的营销人员呢？难道他们不应该承担某些责任吗？\n\n不。经理和营销人员向`我们`获取他们做出承诺和保证时所需的信息；即使他们不向我们寻求，我们也不应该害于告诉他们我们的想法。用户依靠我们来验证需求将如何融入系统。项目经理依靠我们来帮助制定进度表。我们深度参与了项目的规划，并对任何失败共同负着极大的责任；特别是当这些失败与糟糕的代码有关时！\n\
  \n“等一下！”你说，“如果我不听经理的，我就会被开除。” 也许不会吧。大多数经理都想要真相，即使他们表现得不像。大多数经理都想要良好的代码，即使他们正痴迷于进度。他们可能会充满激情地捍卫进度和需求；但那是他们的工作。而`你的`工作是用同样的热情来捍卫代码。\n\
  \n为了强调这一点，假设你是一个医生，有一位患者要求你停止所有准备手术的愚蠢洗手动作，因为这花费了太多时间。显然，患者是老板；然而医生绝对应该拒绝服从。为什么？因为医生比患者更了解疾病和感染的风险。医生如果顺从患者的要求，将是不专业的（更不用说是犯罪了）。\n\
  \n同样，程序员如果屈从于那些不理解制造混乱风险的经理的意愿，也是不专业的。\n\n### 原始困境\n\n程序员面临着一个基本价值观的困境。所有拥有五年以上经验的开发者都清楚他们面临的共同冲突。他们往往被困于编写良好代码的愿望与按时完成任务的压力之间。这种冲突是行业内许多问题的根源。当压力袭来时，首先牺牲的就是代码质量。这导致了一个恶性循环：糟糕的代码使得添加功能变得更加困难，从而导致更大的压力和更糟糕的代码。\n\
  \n打破这一循环的唯一方法是拒绝编写糟糕的代码。这意味着即使在困难的情况下，也愿意为质量发声。这并不容易，但它是产生可维护且持久软件的唯一途径。\n\n\n\n\
  \n\nBjarne 以这样一个断言结尾：整洁代码只良好做好一件事。软件设计中许多原则都可以归纳为这一简单的告诫，这绝非偶然。一位又又一位作家都试图传达这种思想。坏代码试图做太多事情，它的意图混乱，目的模糊。整洁代码是`聚焦`的。每个函数、每个类、每个模块都展现出一种专注的态度，这种态度完全不受周围细节的干扰，也不受其污染。\n\
  \n**Grady Booch，《面向对象软件分析与设计》作者**\n\n![Image](img/Image00009.jpg)\n\n*整洁代码是简单且直接的。整洁代码读起来像优美的散文。整洁代码从不掩盖设计者的意图，而是充满了清晰的抽象和直接的控制流。*\n\
  \nGrady 有一些与 Bjarne 相同的观点，但他从`可读性`的角度出发。我特别喜欢他的观点：整洁代码应该读起来像优美的散文。回想你读过的一本非常好的书。记得那些文字是如何消失并取而代之以图像的吗！感觉就像在看电影，不是吗？更棒！你看到了角色，听到了声音，你体验了忧伤和幽默。\n\
  \n阅读整洁代码永远不会像读《指环王》。尽管如此，这种文学上的比喻并不糟糕。就像一本好小说一样，整洁代码应该清晰地揭示要解决的问题中的张力。它应该将这些张力推向高潮，然后在显而易见的解决方案揭示问题和张力时，给读者那种“啊！难怪！”\n\
  \n发现 Grady 使用“清晰的抽象（crisp abstraction）”这个短语是一个迷人的矛盾修辞法！毕竟“crisp”一词几乎是“具体（concrete）”的同义词。我的\
  \ MacBook 字典对“crisp”有如下定义：*果断、迅速且实事求是的，没有犹豫或不必要的细节。*尽管这在意义上看似并列，但这些词传达了强大的信息。我们的代码应该是实事求是的，而不是推测性的。它应该只包含必要的。我们的读者应该感知到我们是果断的。\n\
  \n**“大”Dave Thomas，OTI 创始人，Eclipse 策略之父**\n\n![Image](img/Image00010.jpg)\n\n*整洁代码可以被阅读，并由原作者以外的开发者增强。它有单元测试和验收测试。它有有意义的名字。它为做一件事提供一种方式而非多种方式。它有极少的依赖，这些依赖被显式定义，并提供清晰且最小的\
  \ API。代码应该是文学化的，因为取决于语言，代码本身无法清晰地表达所有必要信息。*\n\nBig Dave 分了 Grady 对可读性的渴望，但有一个重要的转折。Dave\
  \ 断言，整洁代码让其他其他`人很容易增强它。这似乎是显而易见的，但无论怎么强调都不为过。毕竟，易读的代码和易改的代码之间是有区别的。\n\nDave 将整洁与测试联系在一起！十年前，这会让很多人侧目。但测试驱动开发（TDD）的纪律对我们的行业产生了深远的影响，并成为我们最基本的准则之一。Dave\
  \ 是的。没有测试的代码不是整洁的。无论它多么优雅，无论多么可读和易于理解，如果没有测试，它就不整洁。\n\nDave 使用了两次`minimal（最小）`一词。显然，他看重小代码而不是大代码。事实上，自软件文学诞生以来，这一直是一个常见的反复。越小越好。\n\
  \nDave 还说代码应该是`literate（文学化的）`。这是对 Knuth 的`literate programming（文学编程）`的软引用。^(4)\
  \ 结果是，代码应该以这种形式组织，以便人类阅读。\n\n**Michael Feathers，《有效维护遗留代码》作者**\n\n![Image](img/Image00011.jpg)\n\
  \n*我可以列出所有我在整洁代码中注意到的品质，但有一个贯穿始终的品质导致了所有这些。整洁代码看起来总是像是由一个用心的人写的。你无法做任何显而易见的事来让变得更好。所有这些事情代码的作者都考虑过了，如果你尝试想象改进之处，你会被回到起点，坐着欣赏某人留给你的代码——由一个深爱着这项技艺的人留下的代码。*\n\
  \n一个词：用心（care）。这确实是本书的主题。也许一个合适的副标题应该是`如何照顾代码（How to Care for Code）`。\n\nMichael\
  \ 一中要害。整洁代码是被照顾过的代码。有人花时间保持它的简单和有序。他们对细节付出了合理的关注。他们用心了。\n\n**Ron Jeffries，《极限编程实践》和《C#\
  \ 极限编程之旅》作者**\n\nRon 的职业生涯始于在战略空司令部的 Fortran 语言编程，并且在几乎每种语言和几乎每台机器上写过代码。仔细考虑他的话是有价值的。\n\
  \n![Image](img/Image00012.jpg)\n\n*在最近几年里，我几乎以 Beck 的简单代码规则开始和结束。按优先级排序，简单代码：*\n\
  \n- 运行所有测试；\n- 不包含任何重复；\n- 表达系统中的所有设计思想；\n- 尽量减少此类类、方法、函数等实体的数量。\n\n*在这些点中，我主要关注重复。当同一件事被反复执行时，这说明我们脑海中有一个想法在代码中没有得到良好的体现。*\n\
  \n对我来说，表达性包含了有意义的名字，我可能会多次更改事物的名称。有了现代编码工具（如 Eclipse），重命名是非常便宜的，所以这并不困扰我。然而，表达性不仅限于名字。我还会查看一个对象或方法是否在做多一件事。如果是对象，它可能需要拆分成两个更多的对象。如果是方法，我总是对其使用提取方法重构，产生一个更清晰地说明它在做什么的方法，以及一些说明如何做什么的子方法。\n\
  \n重复和表达性带我进入我所认为的整洁代码的领域，而且通过这两点改进脏代码就能产生巨大的差异。然而，还有另一件事是我意识到自己在做的，这有点难解释。\n\n在工作多年后，在我看来所有程序都由非常类似的元素组成。一个例子是“在集合中查找”。无论是员工记录数据库、键值哈希表还是某种项数组，我们经常需要其中的特定项。当我发现这种情况发生时，我通常会将特定的实现封装在更抽象的方法或类中。这给了我几个有趣的优势。\n\
  \n我现在可以用简单的东西实现功能，比如哈希表，但由于现在所有对该搜索的引用都被我的小抽象覆盖了，我可以随时更改实现。我可以快速前进，同时保留以后更改的能力。\n\
  \n\n\n\n\n沃德·坎宁姆（Ward Cunningham），Wiki 的发明者，Fit 的发明者，极端编程（Xtreme Programming）的联合发明者。设计模式背后的动力。Smalltalk\
  \ 和面向对象思想的领军人物。所有关注代码者的教父。\n\n![Image](img/Image00013.jpg)\n\n*当你读到的每个例程都如你预期的的一样时，你就知道自己正在编写整洁的代码。当代码还让这种语言看起来就像是为了解决该问题而生时，你就可以称之为美代码。*\n\
  \n这样的话是沃德的特点。你读到它，点点头，然后进入下一个话题。它听起来如此合理、如此显而易见，以至于几乎不算什么深刻见解。你可能觉得这完全如你预期的那样。但让我们仔细观察一下。\n\
  \n“……正如你预期的那样。”你上一次看到完全符合你预期的模块是什么时候？难道你看到的模块更有可能是困惑、复杂、纠缠的？误导难道不是常态吗？难道你还不习惯于挣挣扎，试图抓住并握住从整个系统中喷涌出的逻辑线索，并将它们穿插在你正在阅读的模块中吗？你上一次读完某些代码并像你刚才对沃德的话那样点头是在什么时候？\n\
  \n沃德期望当你阅读整洁的代码时，你完全不会感到惊讶。事实上，你甚至不会花费太多精力。你会阅读它，它将完全如你预期的那样。它是显而易见、简单且引人入胜的。每个模块都为下一个模块铺路。每个模块都告诉你下一个将如何编写。*如此*整洁的程序编写得如此出色，以至于你甚至察觉不到。设计者让它看起来荒谬地简单，就像所有卓越的设计一样。\n\
  \n那么沃德关于“美”的概念呢？我们都在抱怨我们的语言并非为我们的问题而设计的这一事实。但沃德的话把责任推回了我们身上。他说，美的代码*让语言看起来就像是为了解决该问题而设计的*！所以，让语言看起来简单是*我们的*责任！到处的语言偏执者们，小心了！不是语言让程序看起来简单，是程序员让语言看起来简单！\n\
  \n### 思想流派\n\n我呢（鲍勃叔叔）？我认为整洁的代码是什么？这本书将以极其详尽细节告诉你我和我的同伴对整洁代码的看法。我们将告诉你们我们认为什么是整洁的变量名、整洁的函数、整洁的类等等。我们将这些意见作为绝对真理呈现，并且不会为我们的直率道歉。对于我们来说，在职业的这个阶段，它们*就是*绝对真理。它们是我们关于整洁代码的*学派*。\n\
  \n![Image](img/Image00014.jpg)\n\n武术家并不都对最好的武术，或某种武术中最好的技术达成共识。通常，武术大师会形成自己的思想流派并招收学生学习。因此，我们看到了由巴西格西家族创立并教授的*格莱西柔术（Gracie\
  \ Jiu Jitsu）*。我们看到了由东京冈山龙凤（Okuyama Ryuho）创立并教授的*合气柔术（Hakkoryu Jiu Jitsu*。我们看到了李小在美国创立并教授的*截拳道（Jeet\
  \ Kune Do](#text00005.html_ch1see2)*。\n\n这些方法的学生沉浸在创始者的教导中。他们致力于学习那位特定大师所教的内容，往往排除了任何其他大师的教导。后来，随着学生在技艺上的进步，他们可能会成为不同大师的学生，以拓宽知识和实践。有些人最终会继续精炼他们的技能，发现新技法并建立自己的流派。\n\
  \n这些不同的流派中没有哪一个是绝对*正确*的。然而在一个特定的流派内，我们*表现得*好像教导和技术*是*正确的。毕竟，练习合气柔术或截拳道确实有正确的方法。但这种流派内的正确性并不能使另一个流派的教导失效。\n\
  \n将这本书视为对*对象导师整洁代码学派（Object Mentor School of Clean Code）*的描述。其中的技术和教导是*我们*实践*我们*艺术的方式。我们愿意声称，如果你遵循这些教导，你将获得我们所享受的好处，并学会编写整洁且专业的代码。但不要犯这样的错误，认为我们在某种绝对意义上是“正确”的。还有其他流派和其他大师，在专业性方面拥有与我们同样的话语权。从他们那里学习也是明智的。\n\
  \n事实上，书中的许多建议都是具有争议的。你可能不同意所有的建议。你可能对其中某些建议表示强烈反对。这没关系。我们不能声称最终权威。另一方面，书中的建议是我们经过深思熟虑的结果。我们通过数十年的经验和反复的尝试错误学会了它们。所以，无论你同意还是不同意，如果你没有看到并尊重我们的观点，将是一种遗憾。\n\
  \n### 我们是作者\n\nJavadoc 中的 `@author` 字段告诉我们我们是谁。我们是作者。关于作者的一点是，他们有读者。事实上，作者*负责*与他们的读者进行良好的交流。下次你写一行代码时，记住你是一个作者，正在为那些将评价你努力的读者而写。\n\
  \n你可能会问：代码到底会被读多少？难道大部分精力不是花在编写它上吗？\n\n你曾经回放过编辑会话吗？在 80 年和 90 年，我们有像 Emacs 这样的编辑器可以记录每一次击键。你可以工作一小时，然后像看电影一样回放整个过程。结果非常迷人。\n\
  \n大部分回放都是滚动和跳转！\n\n鲍进入了模块。\n\n他向下滚动到需要修改的函数。\n\n他停下来，考虑他的选择。\n\n噢，他向上到模块顶部以检查变量的初始化。\n\
  \n现在他回到上方开始输入\n\n哎，他删掉了刚刚输入的内容！\n\n他又输入了一次。\n\n他又删掉了！\n\n他输入了其他东西，但又删掉了！\n\n他向下滚动到另一个调用他正在修改的函数，看看它是如何被调用的\n\
  \n他回到上方，输入刚才删掉的代码。\n\n他停下来。\n\n他又删掉了那段代码！\n\n他弹出一个窗口查看一个子类。那个函数被重写了吗？\n\n你明白意思了。\n\
  \n### 童子军法则\n\n美国童子军有一条简单的规则可以应用到我们的职业中。\n\n*离开营地时比你发现时更干净。^(5)*\n\n\n\n\n\n如果我们每个人在提交代码时都比签出时稍微整洁一点，那么代码根本就不会腐烂。这种清理不需要是什么大动作。比如：把一个变量名改得更合理，拆分一个稍微太大的函数，消除一小处重复，清理一个复合的\
  \ `if` 语句。\n\n你能想象在一个这样的项目中工作吗：代码随着时间的推移而变得越来越好？你认为还有其他任何选择是职业的吗？事实上，持续改进难道不是职业精神的内在组成部分吗？\n\
  \n## 前传与原则\n\n在很多方面，这本书是我 2002 年写的一本名为《敏捷软件开发：原则、模式与实践》（*Agile Software Development:\
  \ Principles, Patterns, and Practices*, *PPP*）的“前传”。`PPP` 关注对象设计的原则以及专业人员使用的许多实践。如果你没有读过\
  \ `PPP`，你可能会发现它延续了这本书所讲述的故事。如果你已经读过了，你会在书中发现书中许多情感在代码层面得到了本书的共鸣。\n\n在书中，你将发现对各种设计原则的零星引用。这些包括单一责任原则\
  \ (`SRP`)、开闭原则 (`OCP`) 和依赖倒转原则 (`DIP`) 等。这些原则在 `PPP` 中有深入的描述。\n\n## 结语\n\n艺术书籍并不承诺能让你成为艺术家。它们能做的只是提供其他艺术家使用过的工具、技术和思维方式。同样，这本书无法承诺让你成为一名出色的程序员。它无法承诺带给你“代码感”。它能做的只是向你展示优秀程序员的思维方式，以及他们使用的技巧、窍门和工具。\n\
  \n就像艺术书籍一样，这本书将充满细节。会有大量的代码。你会看到好代码，也会看到坏代码。你会看到坏代码被转化为好代码。你会看到启发式方法、准则和技术的列表。你会看到一个又一个例子。在此之后，就取决于你了。\n\
  \n还记得那个关于在去演出路上迷路的音乐会小提琴手的手的笑话吗？他在街角拦住一位老头，问他如何去卡内基音乐厅。老头看了看小提琴手以及夹在腋下的小提琴，说：“练习吧，孩子。练习！”\n\
  \n### 参考文献\n\n- **[Beck07 ]:** *Implementation Patterns*, Kent Beck, Addison-Wesley,\
  \ 2007.\n- **[Knuth92 ]:** *Literate Programming*, Donald E. Knuth, Center for the\
  \ Study of Language and Information, Leland Stanford Junior University, 1992.\n\n\
  ## 2 有意义的名字\n\n作者：Tim Ottinger\n\n![Image](img/Image00015.jpg)\n\n### 引言\n\n名字在软件中无处不在。我们为变量、函数、参数、类和包命名。为源文件和包含它们的目录命名。为\
  \ `jar` 文件、`war` 文件和 `ear` 文件命名。我们不断地命名、命名、命名。因为我们做了这么多这类工作，我们最好把它做好。以下是一些创建好名字的简单规则。\n\
  \n### 使用揭示意图的名字\n\n说名字应该揭示意图很容易。我们想要向你传达的是，我们对此是认真的。选择好的名字需要时间，但它节省的时间远超它的付出。所以，请仔细对待你的名字，并在发现更好的名字时修改它们。每一个阅读你代码的人（包括你自己）都会变得更开心。\n\
  \n变量、`function` 或 `class` 的名字应该回答所有大问题。它应该告诉你它为什么存在、做什么以及如何被使用。如果一个名字需要注释，那么这个名字就没有揭示它的意图。\n\
  \n```\nint d; // 以天计算的经过时间\n```\n\n名字 `d` 没有揭示任何信息。它没有引起时间经过的感觉，也没有天的概念。我们应该选择一个指定测量内容以及测量单位的名字：\n\
  \n```\nint elapsedTimeInDays;\nint daysSinceCreation;\nint daysSinceModification;\n\
  int fileAgeInDays;\n```\n\n选择揭示意图的名字可以让理解和修改代码变得容易得多。这段代码的目的是什么？\n\n```java\npublic\
  \ List<int[]> getThem() {\n    List<int[]> list1 = new ArrayList<int[]>();\n   \
  \ for (int[] x : theList)\n        if (x[0] == 4)\n            list1.add(x);\n \
  \   return list1;\n}\n```\n\n为什么很难看出这段代码在做什么？这里没有复杂的表达式。间距和缩进是合理的。只提到了三个变量和两个常量。甚至没有花哨的类或多态方法，仅仅是一个数组列表（至少看起来如此）。\n\
  \n问题不在于代码的简单，而在于代码的隐晦性（借用说法）：即上下文在代码本身并不显式的程度。代码隐含地要求我们知道以下问题的答案：\n\n1. `theList`\
  \ 中包含什么类型的东西？\n2. `theList` 中元素零下标的意义是什么？\n3. 数值 `4` 的意义是什么？\n4. 我该如何使用返回的列表？\n\n\
  这些问题的答案并不在代码示例中，但它们本可以存在。假设我们正在玩一个扫雷游戏。我们发现面板是一个名为 `theList` 的单元格列表。让我们将其重命名为 `gameBoard`。面板上的每个单元格由一个简单的数组表示。我们进一步发现零下标是状态值，而状态值\
  \ `4` 意味着“已标记”。仅仅通过给出这些名字，我们就能改进代码：\n\n```java\npublic List<int[]> getFlaggedCells()\
  \ {\n    List<int[]> flaggedCells = new ArrayList<int[]>();\n    for (int[] cell\
  \ : gameBoard)\n        if (cell[STATUS_VALUE] == FLAGGED)\n            flaggedCells.add(cell);\n\
  \    return flaggedCells;\n}\n```\n\n注意，代码的简单性没有改变。它仍然具有完全相同的操作符和常量，嵌套层也完全相同。但代码已经变得显式多了。\n\
  \n我们可以进一步，为单元格编写一个简单的类，而不是使用 `int` 数组。它可以包含一个揭示意图的函数（称之为 `isFlagged`）来隐藏魔法数字。这产生了一个新版本：\n\
  \n```java\npublic List<Cell> getFlaggedCells() {\n    List<Cell> flaggedCells =\
  \ new ArrayList<Cell>();\n    for (Cell cell : gameBoard)\n        if (cell.isFlagged())\n\
  \            flaggedCells.add(cell);\n    return flaggedCells;\n}\n```\n\n通过这些简单的命名，理解发生了什么并不困难。这就是选择好名字的力量。\n\
  \n### 避免误导信息\n\n程序员必须避免留下模糊代码含义的虚假线索。我们应该避免使用固有含义与我们意图不符的词汇。例如，`hp, aix` 和 `sco`\
  \ 是糟糕的变量名，因为它们是 Unix 平台或变体的名称。即使你正在编写关于斜边的代码，且 `hp` 看起来是个很好的缩写，它也可能是误导性的。\n\n除非账户组实际上是一个\
  \ `List`，否则不要将账户组称为 `accountList`。list 这个词对程序员来说有特定的含义。如果持有账户的容器实际上不是 `List`，可能会导致错误的结论。所以\
  \ `accountGroup` 或 `bunchOfAccounts` 或者直接用 `accounts` 会更好。\n\n小心使用有细微差异的名字。要多久才能发现一个模块中的\
  \ `XYZControllerForEfficientHandlingOfStrings` 与另一个稍远处的 `XYZControllerForEfficientStorageOfStrings`\
  \ 之间的细微区别？这些词的形状惊人地相似。\n\n\n\n\n\n相似的概念使用相似的拼被称为 `information`（信息）。使用不一致的拼写则是 `disinformation`（误导信息）。在现代\
  \ Java 环境中，我们享有自动代码补全。输入名称的几个字母并按下某些热键组合（如果有的话），就能获得该名称可能的补全列表。如果非常相似的事物的名称按字母顺序排序在一起，并且差异非常明显，将非常有帮助，因为开发者很可能会在不看你的详尽注释甚至不看该类提供的方法列表的情况下，仅通过名称选择对象。\n\
  \n误导性命名的一个真正糟糕的例子是使用小写的 `L` 或大写的 `O` 作为变量名，尤其是当两者结合使用时。问题在于，它们看起来几乎完全像常量 1 和 0。\n\
  \n```java\nint a = l;\n\nif ( O == l )\na = O1;\nelse\nl = 01;\n```\n\n读者可能认为这是一种刻意之为，但我们检查过充满此类问题的代码。在一种情况下，代码的作者建议使用不同的字体以使差异更加明显，这种解决方案必须通过口头传统或书面文档传递给所有未来的开发者。而通过简单的重命名，就可以彻底解决这一问题，且不会产生新的工作产物。\n\
  \n### 有意义的区分\n\n![Image](img/Image00016.jpg)\n\n当程序员仅仅为了满足编译器或解释器而编写代码时，他们就是在给自己制造麻烦。例如，由于你不能在同一个作用范围内使用相同的名称指代两个不同的事物，你可能会倾向于任意更改其中一个名称。有时这样做是通过拼错其中一个来实现，导致了令人意料的情况：纠正拼写错误导致无法编译。\n\
  \n仅仅添加数字序列或噪声词是不够的，即使编译器满足了。如果名称必须不同，那么它们也应该具有不同的含义。\n\n数字序列命名 `(a1, a2, .. aN)`\
  \ 是刻意命名的相反面。此类命名并不是误导性的——它们是非信息的；它们没有提供关于作者意图的线索。考虑：\n\n```java\npublic static void\
  \ copyChars(char a1[], char a2[]) {\n    for (int i = 0; i < a1.length; i++) {\n\
  \        a2[i] = a1[i];\n    }\n}\n```\n\n当参数名使用 `source` 和 `destination` 时，这个函数的读性要好得多。\n\
  \n噪声词是另一种无意义的区分。假设有一个 `Product` 类。如果你有另一个类 `ProductInfo` 或 `ProductData`，你只是让名称变得不同，而没有让它们的含义变得不同。`Info`\
  \ 和 `Data` 是模糊的噪声词，就像 `a, an` 和 `the`。\n\n注意，使用像 `a` 和 `the` 这样的前缀约定并没有问题，只要它们是有意义的区分。例如，你可以用\
  \ `a` 表示所有局部变量，用 `the` 表示所有函数参数。当你决定命名变量为 `theZork` 因为你已经有另一个名为 `zork` 的变量时，问题出现了。\n\
  \n噪声词是冗余的。`variable` 这个词永远不应该出现在变量名中。`table` 这个词永远不应该出现在表名中。`NameString` 比 `Name`\
  \ 好在哪里？`Name` 有可能是一个浮点数吗？如果是，它就违反了关于误导信息的早期规则。想象发现一个名为 `Customer` 的类和另一个名为 `CustomerObject`\
  \ 的类。你应该如何理解它们之间的区别？哪一个代表通往客户支付历史的最佳路径？\n\n我们知道有一个应用说明了这一点。我们更改了名称以保护“罪恶者”，但这里是错误的确切形式：\n\
  \n```java\ngetActiveAccount();\ngetActiveAccounts();\ngetActiveAccountInfo();\n\
  ```\n\n这个项目中的程序员如何知道调用这些函数中的哪一个？\n\n在缺乏特定约定的情况下，变量 `moneyAmount` 与 `money` 无法区分，`customerInfo`\
  \ 与 `customer` 无法区分，`accountData` 与 `account` 无法区分，而 `theMessage` 与 `message` 无法区分。区分名称要让读者知道这些差异提供了什么。\n\
  \n### 使用可读的名称\n\n人类擅长单词。我们大脑的大部分专门用于单词概念。而根据定义，单词是可以是可以发音的。如果不利用我们大脑中进化出的处理口语的巨大部分，那就太可惜了。所以，让你的名称是可读的。\n\
  \n如果你读不出它，你在讨论它时听起来就会像个白痴。“嗯，在这里，在 b c r 3 c n t 上，我们有一个 pee ps zee kyew int，看懂吧？”这很重要，因为编程是一项社交活动。\n\
  \n我认识的一家公司有一个 `genymdhms`（生成日期、年、月、日、时、分、秒），所以他们走路时说着“gen why emm dee aich emm ess”。我有一个把所有东西按字母读出来的烦人习惯，所以我开始说“gen-yah-muddahims”。后来，一群设计师和分析师也这样叫它，我们听起来仍然很蠢。但我们知道这个梗的，所以很有趣。无论有趣不有趣，我们都在忍受糟糕的命名。新开发者必须听别人解释变量，然后他们用愚蠢的造词讨论它，而不是使用正式的英语术语。对比一下：\n\
  \n```java\nclass DtaRcrd102 {\n    private Date genymdhms;\n};\n```\n\n对比：\n\n```java\n\
  class Customer {\n    private Date generationTimestamp;\n};\n```\n\n现在可以智能对话了：“嘿，Mikey，看这个！生成时间戳被设置为今天的日期！”\n\
  \n### 使用可搜索的名称\n\n单字母名称和数字常量有一个特殊问题，它们在正文中难以定位。人们可以很容易地搜索 `MAX_CLASSES_STUDENT`，但数字\
  \ 7 可能会更麻烦。搜索可能会发现该数字出现在文件名、其他常量定义以及该值用于意图不同的表达式中。当常量是一个长数字时，有人可能颠倒了数字，从而在创建 bug\
  \ 的同时避开了程序员的搜索。\n\n同样，名称 `e` 对于任何程序员可能需要搜索的变量都是一个糟糕的选择。它是英语中最常见的字母，可能出现在程序的每一段文本中。在这方面，长名称优于短名称，任何可搜索的名称都适用于常量。\n\
  \n我个人的偏好是，单字母名称只能用于短方法内部局部变量。名称的长度应与其作用域的大小对应。如果变量或常量在代码体的多个处被看到或使用，必须给它一个易搜索的名称。再次对比：\n\
  \n```java\nfor (int j=0; j<34; j++) {\n    s += (t[j]*4)/5;\n}\n```\n\n对比：\n\n```java\n\
  int realDaysPerIdealDay = 4;\nconst int WORK_DAYS_PER_WEEK = 5;\nint sum = 0;\n\n\
  for (int j=0; j < NUMBER_OF_TASKS; j++) {\n    int realTaskDays = taskEstimate[j]\
  \ * realDaysPerIdealDay;\n    int realTaskWeeks = (realdays / WORK_DAYS_PER_WEEK);\n\
  \    sum += realTaskWeeks;\n}\n```\n\n注意，上面的 `sum` 并不是一个特别有用的名称，但至少是可搜索的。\n\n\n\n\
  \n\n我们有足够的编码方式来处理问题，不需要再增加我们的负担了。在名称中编码类型或作用域信息只会增加额外的解码负担。要求每位新员工在学习他们将编写的（通常是庞大的）代码库之外，还要学习另一种编码“语言”，这似乎并不合理。在尝试解决问题时，这是一种不必要的心理负担。编码后的名称很少能够发音，而且容易拼错。\n\
  \n### 匈牙利命名法\n\n在过去，当我们在名称长度受限的语言中工作时，我们迫不得地违反了这条规则，并对此感到遗憾。Fortran 强制要求进行编码，让第一个字母成为类型的代码。早期的\
  \ BASIC 版本仅允许一个字母加一个数字。匈牙利命名法（HN）将其推向了一个全新的高度。\n\n在 Windows C API 时代，匈牙利命名法被认为是非常重要的，那时一切东西都是整数句柄、长指针、`void`\
  \ 指针，或者“字符串”的几种实现之一（具有不同的用途和属性）。那时的编译器并不检查类型，所以程序员需要一个拐杖来帮助他们记住类型。\n\n在现代语言中，我们拥有更丰富的类型系统，编译器会记录并强制执行类型。此外，趋势是使用更小的类和更短的函数，人们通常可以看到他们正在使用的每个变量声明的意义。\n\
  \nJava 程序员不需要类型编码。对象是强类型的，而且编辑环境已经先进到可以在你运行编译很久以前检测到类型错误！因此，现在 HN 和其他形式的类型编码仅仅是障碍。它们让更改变量、函数或类的名称或类型变得更加困难。它们让代码变得难以阅读。而且它们存在编码系统误导读者的。\n\
  \n```java\nPhoneNumber phoneString;\n\n// 类型改变时名称没有改变！\n```\n\n### 成员前缀\n\n你不再需要为成员变量添加\
  \ `m_` 前缀了。你的类和函数应该足够小到不需要它们。你应该使用能够高亮或着色成员变量以使其与众不同的编辑环境。\n\n```java\npublic class\
  \ Part {\n    private String m_dsc; // 文本描述\n\n    void setName(String name) {\n\
  \        m_dsc = name;\n    }\n}\n```\n\n```java\npublic class Part {\n    String\
  \ description;\n\n    void setDescription(String description) {\n        this.description\
  \ = description;\n    }\n}\n```\n\n此外，人们会很快学会忽略前缀（或后缀）以查看名称的有意义部分。我们阅读代码越多，看到的前缀就越少。最终，前缀变成了不可见的杂质，成为旧代码的标记。\n\
  \n### 接口与实现\n\n这些有时是编码的特例。例如，假设你正在构构建一个用于创建形状的抽象工厂（ABSTRACT FACTORY）。这个工厂将是一个接口，并由一个具体类实现。你应该如何命名它们呢？`IShapeFactory`\
  \ 和 `ShapeFactory`？我更倾向于让接口不加装饰。在当今遗留代码中常见的前缀 `I`，充其量是分散注意力，最坏的情况下是信息过多。我不希望我的用户知道我正在交给他们一个接口。我只想让他们知道这是一个\
  \ `ShapeFactory`。所以，如果我必须对接口或实现进行编码，我选择实现。将其命名为 `ShapeFactoryImp`，甚至是难看的 `CShapeFactory`，也比编码接口要好。\n\
  \n### 避免心理映射\n\n读者不应该在脑海中将你的名称翻译成他们已经知道的其他名称。这个问题通常源于既没有使用问题领域术语也没有使用解决方案领域术语的选择。\n\
  \n这是一个单字母变量名的问题。如果循环计数器的作用域很小且没有其他名称与其冲突，循环计数完全可以命名为 `i` 或 `j` 或 `k`（但绝不是 `l`！）。这是因为这些循环计数器的单字母名称是传统的。然而，在大多数其他语境下，单字母名称是一个糟糕的选择；它只是一个占位符，读者必须在脑海中将其映射到实际概念。使用名称\
  \ `c` 最糟糕的理由过于因为 `a` 和 `b` 已经被占用了。\n\n通常来说，程序员都是很聪明的人。聪明的人有时喜欢通过展示他们的脑力体操能力来炫耀自己的聪明。毕竟，如果你能可靠地记住\
  \ `r` 是删除了主机和方案的 url 小写版本，那么你显然非常聪明。\n\n聪明程序员和专业程序员之间的区别在于，专业人士理解**清晰性高于一切**。专业人士利用他们的能力行善，并编写他人可以理解的代码。\n\
  \n### 类名\n\n类和对象应该使用名词或名词短语命名，如 `Customer`、`WikiPage`、`Account` 和 `AddressParser`。在类名中避免使用\
  \ `Manager`、`Processor`、`Data` 或 `Info` 等词。类名不应该是动词。\n\n### 方法名\n\n方法应该使用动词或动词短语命名，如\
  \ `postPayment`、`deletePage` 或 `save`。访问器、修改器和谓词应该根据其值命名，并根据 JavaBean 标准带有 `get`、`set`\
  \ 和 `is` 前缀。\n\n```java\nstring name = employee.getName();\n\ncustomer.setName(\"\
  mike”);\n\nif (paycheck.isPosted())…\n```\n\n当构造函数重载时，使用描述参数名称的静态工厂方法。例如，\n\n```java\n\
  Complex fulcrumPoint = Complex.FromRealNumber(23.0);\n```\n\n通常比\n\n```java\nComplex\
  \ fulcrumPoint = new Complex(23.0);\n```\n\n更好。\n\n通过将相应的构造函数设置为私有来强制使用它们。\n\n###\
  \ 不要耍俏\n\n如果名称太聪明了，它们只有那些和作者幽默感相似的人才能记住，而且仅限于这些人记住那个笑话的时间。他们能知道命名为 `HolyHandade`\
  \ 的函数是做什么的吗？当然，它很俏，但也许在这种情况下 `DeleteItems` 可能是个更好的名字。选择清晰性而非娱乐价值。\n\n代码中的俏皮通常以口语或俚语的形式出现。例如，不要使用\
  \ `whack()` 来表示 `kill()`。不要说依赖于文化的笑话，如 `eatMyShorts()` 来表示 `abort()`。\n\n言所言，行所行。\n\
  \n### 每个概念选择一个单词\n\n为一个抽象概念选择一个单词并坚持使用它。例如，在不同的类中使用 `fetch`、`retrieve` 和 `get` 作为等效方法是令人困惑的。你如何记住哪个方法名对应哪个类？遗憾的是，你通常必须记住是哪个公司、小组或个人编写了该库或类，才能记住使用了哪个术语。否则，你将花费大量时间浏览头文件和之前的代码示例。\n\
  \n一致的词汇对必须使用你代码的程序员来说巨大的巨大的。\n\n### **不要双关语**\n\n\n\n\n\n避免将同一个词用于两个用途。对两个不同的概念使用同一个术语本质上是一种“双关游戏”。\n\
  \n如果你遵循“一词一念”的规则，你可能会得到许多拥有相同（例如）`add` 方法的类。只要各种 `add` 方法的参数列表和返回值在语义上是等价的，一切都是正常的。\n\
  \n然而，人们可能会在并没有在相同意义上进行“添加”操作时，决定使用 `add` 这个词来表示“一致性”。假设我们有很多类，其中 `add` 会通过相加或拼接两个现有值来创建一个新值。现在，假设我们正在编写一个新类，它有一个方法可以将其单个参数放入集合中。我们应该将这个方法命名为\
  \ `add` 吗？这看起来是一致的，因为我们有许多其他 `add` 方法，但在这种情况下语义是不同的，因此我们应该使用像 `insert` 或 `append`\
  \ 这样的名称。将新方法命名为 `add` 将是一个双关游戏。\n\n作为作者，我们的目标是让代码尽可能易懂。我们希望代码读起来是快速扫一眼就能，而不是仔细研究。我们希望使用流行的模型，而不是让读者去费力挖掘含义。\n\
  \n### 使用实现领域名称（Solution Domain Names）\n\n记住，阅读你代码的人是程序员。所以，尽管可以使用计算机科学（CS）术语、算法名称、模式名称、数学术语等，从问题领域中提取每一个名称是不明智的，因为我们不希望同事反复往回地询问每个名称的含义，而他们已经通过不同的名称知道了这些概念。\n\
  \n对于熟悉 `Visitor` 模式的程序员来说，`Account` 这个名字意义重大。什么样的程序员不知道 `JobQueue` 是什么意思呢？有很多程序员需要处理的技术事务。为这些事情选择技术性名称通常是合适的。\n\
  \n### 使用问题领域名称（Problem Domain Names）\n\n当你在做什么时，使用来自问题领域的名称。将实现和问题领域概念分开是一个优秀的程序员和设计师的工作。与问题领域相关的代码应该源自问题领域。\n\
  \n### 添加有意义的上下文（Add Meaningful Context）\n\n少数名称本身是有意义的——大多数不是。相反，你需要通过将它们封装在良好的类、函数或命名空间中为读者提供上下文。当其他方法都失败时，添加前缀可能作为最后的最后手段。\n\
  \n假设你有命名为 `firstName`、`lastName`、`street`、`houseNumber`、`city` 和 `zipcode` 的变量。放在在一起很清楚它们构成了一个地址。但如果你只在一个方法中看到\
  \ `state` 变量呢？你会推断它是地址的一部分吗？\n\n你可以通过使用前缀添加上下文：`addrFirstName`、`addrLastName`、`addrState`\
  \ 等。读者至少会理解这些变量是一个结构的一部分。更好的解决方案是创建一个名为 `Address` 的类。这样，甚至编译器都知道这些变量属于一个更大的概念。\n\
  \n考虑 列表 2-1 方法。变量需要更有意义的上下文吗？函数名只提供了部分上下文；剩下的由算法提供。一旦读完函数，你会发现三个变量 `number`、`verb`\
  \ 和 `pluralModifier` 是统计信息的一部分。不幸的是，上下文必须推断。当你第一次看方法时，变量的含义是模糊的。\n\n**列表 2-1 上下不明的变量**\n\
  \n```java\nprivate void printGuessStatistics(char candidate, int count) {\n    String\
  \ number;\n    String verb;\n    String pluralModifier;\n\n    if (count == 0) {\n\
  \        number = \"no\";\n        verb = \"are\";\n        pluralModifier = \"\
  s\";\n    } else if (count == 1) {\n        number = \"1\";\n        verb = \"is\"\
  ;\n        pluralModifier = \"\";\n    } else {\n        number = Integer.toString(count);\n\
  \        verb = \"are\";\n        pluralModifier = \"s\";\n    }\n    String guessMessage\
  \ = String.format(\n        \"There %s %s%s\", verb, number, pluralModifier\n  \
  \  );\n    print(guessMessage);\n}\n```\n\n该函数有点长，而且变量在处处使用。为了将函数拆分，我们需要创建一个 `GuessStatisticsMessage`\
  \ 类，并将三个变量变为该类的字段。这为三个变量提供了清晰的上下文。它们无疑是 `GuessStatisticsMessage` 的一部分。上下文的改进还允许算法变得整洁得多。（参见\
  \ 列表 2-2。）\n\n**列表 2-2 有上下文的变量**\n\n```java\npublic class GuessStatisticsMessage\
  \ {\n    private String number;\n    private String verb;\n    private String pluralModifier;\n\
  \n    public String make(char candidate, int count) {\n        createPluralDependentParts(count);\n\
  \        return String.format(\n            \"There %s %s%s\",\n            verb,\
  \ number, pluralModifier\n        );\n    }\n\n    private void createPluralDependentParts(int\
  \ count) {\n        if (count == 0) {\n            thereNoLetters();\n        }\
  \ else if (count == 1) {\n            thereOneLetter();\n        } else {\n    \
  \        thereManyLetters(count);\n        }\n    }\n\n    private void thereManyLetters(int\
  \ count) {\n        number = Integer.toString(count);\n        verb = \"are\";\n\
  \        pluralModifier = \"s\";\n    }\n\n    private void thereOneLetter() {\n\
  \        number = \"1\";\n        verb = \"is\";\n        pluralModifier = \"\"\
  ;\n    }\n\n    private void thereNoLetters() {\n        number = \"no\";\n    \
  \    verb = \"are\";\n        pluralModifier = \"s\";\n    }\n}\n```\n\n### 不要添加多余的上下文（Don’t\
  \ Add Gratous Context）\n\n在一个名为“加油站”的虚拟应用中，在每个类前加上 `GSD` 前缀是一个坏主意。坦率地说，你是在违背工具。你输入\
  \ `G` 并按下补全键，得到是系统中所有类的超长列表。这明智吗？为什么要让 IDE 帮助你变得困难？\n\n同样，假设你在 `GSD` 的会计模块中发明了一个\
  \ `MailingAddress` 类，并将其命名为 `GSDAccountAddress`。后来，你的客户联系应用需要一个邮寄地址。你会使用 `GSDAccountAddress`\
  \ 吗？它听起来像正确的名称吗？17 个字符中有 10 个是冗余或无关的。\n\n只要清晰，短名称通常比长名称好。不要为名称添加比需要更多的上下文。\n\n`accountAddress`\
  \ 和 `customerAddress` 是 `Address` 类实例的良好名称，但作为类的名称则可能是糟糕的。`Address` 是一个很好的类名称。如果我需要区分\
  \ MAC 地址、端口地址和 Web 地址，我可能会考虑 `PostalAddress`、`MAC` 和 `URI`。生成的名称更精确，这才是所有命名的目的。\n\
  \n### 结语（Final Words）\n\n选择好名称最难的地方在于，它需要描述能力和共同的文化背景。这是一个教学问题，而不是技术、业务或管理问题。结果是，该领域的许多人并没有很好做好这一点。\n\
  \n人们还害怕重命名事物，担心其他开发者会反对。我们并不有这种恐惧，并且发现当名称改变（变得更好）时我们实际上非常感激。大多数时候，我们并不真正记忆类和方法的名字。我们使用现代工具来处理这类细节，以便我们可以关注代码读起来是否像段落和句子，或者至少像表格和数据结构（句子并不总是显示数据的最佳方式）。当你重命名时可能会让某人惊讶，就像进行任何其他代码改进一样。不要让它停下你的脚步。\n\
  \n\n\n\n遵循这些中的某些规则，看看你是否能提高代码的可读性。如果你正在维护他人的代码，请使用重构工具来帮助解决这些问题。在短期内会有回报，从长期来看也将持续受益。\n\
  \n## 3 函数\n\n![Image](img/Image00018.jpg)\n\n在编程的早期，我们用例程和子例程组成系统。然后，在 Fortran 和\
  \ PL/1 时代，我们用程序、子程序和函数组成系统。现如今，只有函数从那些早期幸存了下来。函数是任何程序中组织的第一道线。写好函数是本章的主题。\n\n考虑列表\
  \ 3-1 中的代码。在 FitNesse 中很难找到很长的函数，^(1)，但在搜索了一会儿后，我发现了这。它不仅长，而且包含重复代码、许多奇怪的字符串，以及许多奇怪且不直观的数据类型和\
  \ API。看看在接下来的三分钟内，你能理解它的多少内容。\n\n**列表 3-1 `HtmlUtil.java (FitNesse 20070619)`**\n\
  \n```java\npublic static String testableHtml(\n\nPageData pageData,\n\nboolean includeSuiteSetup\n\
  \n) throws Exception {\n\nWikiPage wikiPage = pageData.getWikiPage();\n\nStringBuffer\
  \ buffer = new StringBuffer();\n\nif (pageData.hasAttribute(\"Test\")) {\n\nif (includeSuiteSetup)\
  \ {\n\nWikiPage suiteSetup =\n\nPageCrawlerImpl.getInheritedPage(\n\nSuiteResponder.SUITE_SETUP_NAME,\
  \ wikiPage\n\n);\n\nif (suiteSetup != null) {\n\nWikiPagePath pagePath =\n\nsuiteSetup.getPageCrawler().getFullPath(suiteSetup);\n\
  \nString pagePathName = PathParser.render(pagePath);\n\nbuffer.append(\"!include\
  \ -setup .\")\n.append(pagePathName)\n.append(\"\\n\");\n\n}\n}\nWikiPage setup\
  \ =\n\nPageCrawlerImpl.getInheritedPage(\"SetUp\", wikiPage);\n\nif (setup != null)\
  \ {\n\nWikiPagePath setupPath =\n\nwikiPage.getPageCrawler().getFullPath(setup);\n\
  \nString setupPathName = PathParser.render(setup);\n\nbuffer.append(\"!include -setup\
  \ .\")\n.append(setupPathName)\n.append(\"\\n\");\n\n}\n}\n\nbuffer.append(pageData.getContent());\n\
  \nif (pageData.hasAttribute(\"Test\")) {\n\nWikiPage teardown =\n\nPageCrawlerImpl.getInheritedPage(\"\
  TearDown\", wikiPage);\n\nif (teardown != null) {\n\nWikiPagePath tearDownPath =\n\
  \nwikiPage.getPageCrawler().getFullPath(teardown);\n\nString tearDownPathName =\
  \ PathParser.render(tearDownPath);\n\nbuffer.append(\"\\n\")\n.append(\"!include\
  \ -teardown .\")\n.append(tearDownPathName)\n.append(\"\\n\");\n\n}\n\nif (includeSuiteSetup)\
  \ {\n\nWikiPage suiteTeardown =\n\nPageCrawlerImpl.getInheritedPage(\n\nSuiteResponder.SUITE_TEARDOWN_NAME,\n\
  \nwikiPage\n\n);\n\nif (suiteTeardown != null) {\n\nWikiPagePath pagePath =\n\n\
  suiteTeardown.getPageCrawler().getFullPath (suiteTeardown);\n\nString pagePathName\
  \ = PathParser.render(pagePath);\n\nbuffer.append(\"!include -teardown .\")\n.append(pagePathName)\n\
  .append(\"\\n\");\n\n}\n\n}\n}\n\npageData.setContent(buffer.toString());\n\nreturn\
  \ pageData.getHtml();\n\n}\n```\n\n在学习三分钟后，你理解这个函数吗？可能没有。里面涉及了太多内容，且处于太多不同的抽象层次。奇怪的字符串和奇特的函数调用与由标志位控制的双重嵌套\
  \ `if` 语句混合在一起。\n\n然而，通过几次简单的方法提取、一些重命名和少量的重构，我能够在列表 3-2 中的九行代码中捕捉函数的意图。看看在接下来的\
  \ 3 分钟内你能否理解*那些*。\n\n**列表 3-2 `HtmlUtil.java (refactored)`**\n\n```java\npublic\
  \ static String renderPageWithSetupsAndTeardowns(\n\nPageData pageData, boolean\
  \ isSuite\n\n) throws Exception {\n\nboolean isTestPage = pageData.hasAttribute(\"\
  Test\");\n\nif (isTestPage) {\n\nWikiPage testPage = pageData.getWikiPage();\n\n\
  StringBuffer newPageContent = new StringBuffer();\n\nincludeSetupPages(testPage,\
  \ newPageContent, isSuite);\n\nnewPageContent.append(pageData.getContent());\n\n\
  includeTeardownPages(testPage, newPageContent, isSuite);\n\npageData.setContent(newPageContent.toString());\n\
  \n}\n\nreturn pageData.getHtml();\n\n}\n```\n\n除非你是 FitNesse 的学生，否则你可能并不所有的细节。尽管如此，你可能理解这个函数的功能：将某些设置和清理页面包含到测试页面中，然后将页面渲染为\
  \ HTML。如果你熟悉 JUnit，^(2)，你可能意识到这个函数属于某种基于 Web 的测试框架。当然，没错。从列表 3-2 中推断这些信息相当容易，但它被列表\
  \ 3-1 掩盖得很好。\n\n### 小函数\n\n函数的第一个规则是它们应该是小的。函数的第二个规则是它们要具有交流性。几十年的经验告诉我，我写过各种尺寸的函数。我写过可怕的\
  \ 3000 行怪物。我也写过大量 100 到 300 行的函数。\n\n## 小\n\n在 80 年代，我们曾说一个函数不应超过一屏。当然，那是在 VT100\
  \ 屏幕只有 24 行 80 列的时代，而且我们的编辑器有 4 行用于管理目的。现在有了缩小的字体和大显示器，你可以在一行内放入 150 个字符。\n\n1999\
  \ 年我去 Kent Beck 家拜访。我们坐下来做了一些编程。他向我展示了一个名为 *Sparkle* 的可爱 Java/Swing 程序。它在屏幕上产生了类似于《灰姑娘》电影中仙女棒的视觉效果。当你移动鼠标时，星星会从光标处滴落，通过模拟重力场落在窗口底部。Kent\
  \ 向我展示代码时，我被所有函数之小震惊了。这个程序中的每个函数只有两、三或四行。每个函数都显而易见。每个函数都在讲述一个故事。并以引人胜的顺序引导你走向下一个。\n\
  \n你的函数应该有多短？它们通常应该比列表 3-2 短！事实上，列表 3-2 真的应该缩短为列表 3-3 。\n\n**列表 3-3 `HtmlUtil.java\
  \ (re-refactored)`**\n\n```java\npublic static String renderPageWith\n\nSetupsAndTeardowns(\n\
  \nPageData pageData, boolean isSuite\n\n) throws Exception {\n\nif (isTestPage(pageData))\n\
  \nincludeSetupAndTeardownPages(pageData, isSuite);\n\nreturn pageData.getHtml();\n\
  \n}\n```\n\n#### 块与缩进\n\n这意味着 `if` 语句、`else` 语句、`while` 语句等内部的块应该是一行长。可能这一行应该是一个函数调用。这不仅保持了闭包函数的较小，还增加了了文档价值，因为块中调用的函数可以有一个具有良好描述性的名称。\n\
  \n\n\n这同时也意味着函数不应该大到能够包含嵌套结构。因此，函数的缩进层级不应超过一或二层。这当然使得函数更易阅读和理解。\n\n### 只做一件事\n\n\
  显而易见，Listing 3-1 所做的远不止一件事。它正在创建缓冲区、获取页面、搜索继承页面、渲染路径、追加晦涩的字符串以及生成 HTML 等。Listing\
  \ 3-1 正忙碌于处理许多不同的事情。另一方面，Listing 3-3 只在做一件简单的事情：它将设置和拆卸工作包含在测试页面中。\n\n以下建议已经以不同形式出现了\
  \ 30 年或更久。\n\n![Image](img/Image00019.jpg)\n\n函数应该只做一件事。它们应该做好这一件事。它们应该只做这一件事。\n\
  \n这句话的问题在于，很难判断到底什么是“一件事”。Listing 3-3 在做一件事吗？很容易论证它其实在做三件事：\n\n1. 判断页面是否为测试页面。\n\
  2. 如果是，则包含设置和拆卸。\n3. 以 HTML 格式渲染页面。\n\n所以到底是哪种？这个函数是在做一件事还是三件事？注意，该函数的三个步骤比其声明的名称低了一个抽象层级。我们可以通过将其描述为一个简短的\
  \ *TO* ^(4) 段落来描述该函数：\n\n*为了 RenderPageWithSetupsAndTeardowns，我们检查页面是否为测试页面，如果是，我们就包含设置和拆卸。在何种情况下，我们都以\
  \ HTML 格式渲染页面。*\n\n如果一个函数只执行比其声明名称低一层的步骤，那么这个函数就是在做一件事。毕竟，我们写函数的目的是是将一个较大的概念（换句话说，即函数名）分解为下一个抽象层次的一系列步骤。\n\
  \n显而易见，Listing 3-1 包含了许多不同抽象层次的步骤。因此它显然在做不止一件事。即使是 Listing 3-2 也有两个抽象层级，我们能够将其收缩的能力证明了这一点。但很难有意义地收缩\
  \ Listing 3-3。我们可以将 `if` 语句提取为一个名为 `includeSetupsAndTeardownsIfTestPage` 的函数，但这仅仅是重述了代码，并没有改变抽象层级。\n\
  \n所以，判断一个函数在做不止“一件事”的另一种方法是：你可以从中提取另一个函数，且其名称不仅仅是对实现的简单重述 [G34]。\n\n### 函数内部的章节\n\
  \n查看第 71 页的 Listing 4-7。注意 `generatePrimes` 函数被分为*声明*、*初始化*和*s 筛*等部分。这是做不止一件事的明显症状。只做一件事的函数是无法合理地划分为章节的。\n\
  \n### 每个函数一个抽象层级\n\n为了确保我们的函数在做“一件事”，我们需要确保函数内部的语句都处于相同的抽象层级。很容易看出 Listing 3-1 是如何违反这一规则的。其中包含一些抽象层很高的概念，如\
  \ `getHtml()`；另一些处于中间抽象层级，如：`String pagePathName = PathParser.render(pagePath)`；还有一些极低级的，例如\
  \ `.append(\"\\n\")`。\n\n在函数内部混合不同抽象层级总是令人困惑的。读者可能无法判断某个表达式是核心概念还是细节。糟糕的是，就像破窗效应，一旦细节与核心概念混合，越来越多的细节往往会在此函数内部堆积。\n\
  \n### 从上到下阅读代码：阶梯规则\n\n我们希望代码读起来像一个从上到下的叙述故事。^(5) 我们希望每个函数后面都紧跟着下一个抽象层级的函数，这样我们在阅读函数列表时，就可以每次下降一个抽象层级来阅读程序。我称之为*阶梯规则*（The\
  \ Step-down Rule）。\n\n换句话说，我们希望能够像读一组 *TO* 段落一样读程序，每个段落都描述当前的抽象层级，并引用下一个抽象层级的后续\
  \ *TO* 段落。\n\n*为了包含设置和拆卸，我们包含设置，然后包含测试页面内容，最后包含拆卸。*\n\n*为了包含设置，如果这是一个套件，我们先包含套件设置，然后包含常规设置。*\n\
  \n*为了包含套件设置，我们在父层级中搜索“SuiteSetUp”页面，并添加带有该页面路径的 include 语句。*\n\n*为了搜索父……*\n\n事实证明，程序员想要遵循这一规则并编写保持单一抽象层级的函数是非常的。但学习这一技巧同样重要。它是保持函数短小并确保它们“做一件事”的关键。让代码读起来像从上到下的\
  \ *TO* 段落。\n\n查看本章末的 Listing 3-7。它展示了根据这里的原则重构的整个 testable 函数。注意每个函数是如何衔接的，每个函数都保持在相同的抽象层级。\n\
  \n### Switch 语句\n\n很难让 `switch` 语句做一件事。^(6) 即使是只有两个分支的 `switch`。遗憾的是，我们无法总是避免 `switch`\
  \ 语句，但我们可以确保每个 `switch` 语句都隐藏在底层类中且不再重复。我们通过多态实现了这一点。\n\n考虑 Listing 3-4。它展示了可能取决于员工类型的操作之一。\n\
  \n```java\n// Listing 3-4 Payroll.java\npublic Money calculatePay(Employee e)\n\
  throws EmployeeType {\n  switch (e.type) {\n    case COMMISSIONED:\n      return\
  \ calculateCommissionedPay(e);\n    case HOURLY:\n      return calculateHourlyPay(e);\n\
  \    case SALARIED:\n      return calculateSalariedPay(e);\n    default:\n     \
  \ throw new InvalidType(e.type);\n  }\n}\n```\n\n这个函数有很多问题。首先，它很大，当添加新的员工类型时，它会增长。其次，它显然在做不止一件事。第三，它违反了单一职责原则\
  \ ^(7) (SRP)，因为它有多个改变原因。第四，它违反了开闭原则 ^(8) (OCP)，因为每当添加新类型时都必须更改。但可能该函数最严重的问题是，存在无限数量的其他函数具有相同的结构。例如，我们可以有：\n\
  \nisPayday(Employee e, Date date),\n\n或者 deliverPay(Employee e, Money pay),\n\n\
  或者许多其他。它们都会具有这种有害的结构。\n\n\n\n\n该问题的解决方案（参见 Listing 3-5 ）是将 `switch` 语句埋藏在一个抽象工厂（ABSTRACT\
  \ FACTORY）的地下室内^(9)并且永远不要让人看到它。工厂将使用 `switch` 语句来创建 `Employee` 派类的适当实例，而各种函数（如 `calculatePay`、`isPayday`\
  \ 和 `deliverPay`）将通过 `Employee` 接口进行多态分发。\n\n我对于 `switch` 语句的通用规则是：如果它们只出现一次、用于创建多态对象，并且隐藏在继承关系之后使得系统的其他部分无法看到它们\
  \ [G23 ]，那么是可以忍受的。当然，每种情况都是独特的，我也有违反该规则中一个或多个部分的时候。\n\n### Listing 3-5 `Employee\
  \ and Factory`\n\n```java\npublic abstract class Employee {\n\n    public abstract\
  \ boolean isPayday();\n\n    public abstract Money calculatePay();\n\n    public\
  \ abstract void deliverPay(Money pay);\n\n}\n```\n\n```java\npublic interface EmployeeFactory\
  \ {\n\n    public Employee makeEmployee(EmployeeRecord r) throws InvalidEmployeeType;\n\
  }\n```\n\n```java\npublic class EmployeeFactoryImpl implements EmployeeFactory {\n\
  \n    public Employee makeEmployee(EmployeeRecord r) throws InvalidEmployeeType\
  \ {\n        switch (r.type) {\n            case COMMISSIONED:\n               \
  \ return new CommissionedEmployee(r);\n            case HOURLY:\n              \
  \  return new HourlyEmployee(r);\n            case SALARIED:\n                return\
  \ new SalariedEmploye(r);\n            default:\n                throw new InvalidEmployeeType(r.type);\n\
  \        }\n    }\n}\n```\n\n### 使用描述性名称\n\n在 Listing 3-7 中，我将示例函数的名称从 `testableHtml`\
  \ 改为 `SetupTeardownIncluder.render`。这是一个更好的名称，因为它更好地描述了函数的功能。我还为每个私有方法分配了同样具有描述性的名称，例如\
  \ `isTestable` 或 `includeSetupAndTeardownPages`。良好名称的价值不可估量。记住 Ward 的原则：“当你发现自己正在编写整洁的代码时，每个例程的结果都与你的预期几乎完全一致。”实现这一原则的一半工作在于为只做一件事的小函数选择良好的名称。函数越小、越集中，就越容易选择一个描述性的名称。\n\
  \n不要害怕名称起得长。一个长描述性名称比一个短而晦涩的名称好。一个长描述性名称也比一个长描述性注释好。使用允许多个单词在函数名中易于阅读的命名规范，然后利用这些多个单词为函数命名一个说明其功能的名称。\n\
  \n不要害怕花时间来选择名称。事实上，你应该尝试几个不同的名称，并在每个名称到位的情况下阅读代码。像 Eclipse 或 IntelliJ 这样的现代 IDE\
  \ 让更改名称变得轻而易举。使用这些 IDE，并尝试不同的名称，直到你找到一个尽可能描述性的名称为止。\n\n选择描述性名称将有助于你在脑海中明确模块的设计，并帮助你改进它。寻找一个佳名称往往会导致代码发生理想的重构，这种情况完全并不罕见。\n\
  \n在命名上要保持一致。在为模块选择的函数名中，使用相同的短语、名词和动词。例如，考虑 `includeSetup-AndTeardownPages`、`includeSetupPages`、`includeSuiteSetupPage`\
  \ 和 `includeSetupPage` 这些名称。这些名称中相似的用词让序列讲述了一个故事。事实上，如果我只给你看上面的序列，你会问自己：“`includeTeardownPages`、`includeSuiteTeardownPage`\
  \ 和 `includeTeardownPage` 怎么了？”这对于符合“……与你的预期几乎一致”怎么样？\n\n### 函数参数\n\n函数理想的参数数量是零（niladic）。其次是一个（monadic），紧紧随其后是两个（dyadic）。尽可能避免三个参数（triadic）。三个以上的参数（polyadic）需要非常特殊的理由——而且即便如此，通常也不应该使用。\n\
  \n![Image](img/Image00020.jpg)\n\n参数是很难处理的。它们消耗大量的概念能力。这就是为什么我从示例中去掉了大部分参数。例如，考虑示例中的\
  \ `StringBuffer`。我们可以将其作为参数传递，而不是将其作为一个实例变量，但这样我们的读者每次看到它时都必须解释它。当你阅读模块所讲述的故事时，`includeSetupPage()`\
  \ 比 `includeSetupPageInto(newPage-Content)` 更容易理解。参数的抽象层次与函数名不同，并迫使你了解一个在该这一点并不重要的细节（换句话说，`StringBuffer`）。\n\
  \n从测试的角度来看，参数更加困难。想象一下，要编写所有测试用例以确保各种参数组合都能正常工作有多么困难。如果没有参数，这轻而易举。如果只有一个参数，也不太难。如果有两个参数，问题就会变得更具挑战性。如果有两个以上的参数，测试每种合适值的组合可能是令人望畏的。\n\
  \n输出参数比输入参数更难理解。当我们阅读一个函数时，我们习惯于信息通过参数进入函数，并通过返回值输出。我们通常不期望信息通过参数输出。因此，输出参数经常让我们停顿。\n\
  \n一个参数是次于零参数的最佳选择。`SetupTeardownIncluder.render(pageData)` 很容易理解。显然，我们要对 `pageData`\
  \ 对象进行渲染。\n\n#### 常见的单参数形式\n\n向函数传递单个参数有两个非常常见的原因。你可能在询问关于该参数的一个问题，如 `fileExists(\"\
  MyFile\")`。或者你可能在对该参数进行操作，将其转换为其他内容并返回。例如，`fileOpen(\"MyFile\")` 将一个文件名 `String`\
  \ 转换为 `InputStream` 返回值。这两种用法是读者在看到函数时的预期。你应该选择能够清晰区分区别的名称，并在一致的上下文中使用这两种形式。（参见下文的查询分离`。谨慎使用这种形式。它应该让读者非常清楚这是一个事件。仔细选择名称和上下文。\n\
  \n尽量避免任何不符合这些形式的单参数函数，例如 `void includeSetupPageInto(StringBuffer pageText)`。使用输出参数而不是返回值来进行转换是令人困惑的。如果一个函数要转换其输入参数，这种转换应该表现为返回值。事实上，`StringBuffer\
  \ transform(StringBuffer in)` 比 `void transform(StringBuffer out)` 好，即使后者的实现只是简单的返回输入参数。至少它仍然符合转换的形式。\n\
  \n#### 标志参数\n\n参数很丑陋。向函数传递一个布尔值是一种非常糟糕的做法。它会立即使方法签名变得复杂，大声宣告这个函数做了不止于一件事。如果标志为真，它做一件事；如果标志为假，它做另一件事！\n\
  \n\n\n\n\n在 Listing 3-7 中我们别无选择，因为调用者已经传递了该标志位，而且我想将重构的范围限制在函数及其内部。尽管如此，`render(true)`\
  \ 这个方法调用对于一个糟糕的读者来说简直让人困惑。将鼠标悬停在调用上看到 `render(boolean isSuite)` 有些帮助，但帮助并不大。我们应该将该函数分成两个：`renderForSuite()`\
  \ 和 `renderForSingleTest()`。\n\n## 二元函数 (Dyadic Functions)\n\n带有两个参数的函数比单元函数（monadic）更理解。例如，`writeField(name)`\
  \ 比 `writeField(output-Stream, name)` 更理解。^(10) 尽管两者的含义都很清楚，但前者一眼就能过，轻松地传达其含义。后者则需要短时间的暂停，直到我们学会忽略第一个参数。而*这*，当然，最终会导致问题，因为我们永远不应该忽略代码的任何部分。我们忽略的部分就是\
  \ Bug 隐藏的地方。\n\n当然，有时两个参数是合适的。例如，`Point p = new Point(0,0);` 是完全合理的。笛卡尔点自然接受两个参数。事实上，如果我们看到\
  \ `new Point(0)`，我们会感到非常惊讶。然而，在这种情况下，这两个参数*是一个单一值的有序组件！*相比之下，`output-Stream` 和 `name`\
  \ 既没有自然的内聚性，也没有自然的顺序。\n\n即使是显而易见的二元函数如 `assertEquals(expected, actual)` 也存在问题。你曾多少次把\
  \ `actual` 放在了 `expected` 应该在的位置？这两个参数没有自然的顺序。`expected, actual` 的顺序是一个需要通过练习才能学会的约定。\n\
  \n二元组并不是坏事，你确实需要编写它们。但是，你应该意识到它们是有代价的，并且应该利用可能对你提供的任何机制将它们转换为单元。例如，你可能让 `writeField`\
  \ 方法成为 `outputStream` 的成员，这样你就可以说 `outputStream. writeField(name)`。或者你可能将 `outputStream`\
  \ 设为当前类的成员变量，这样你就不需要传递它了。或者你可能提取一个新类如 `FieldWriter`，它在构造函数中接收 `outputStream` 并有一个\
  \ `write` 方法。\n\n## 三元函数 (Triads)\n\n接收三个参数的函数比二元函数难理解得多。排序、暂停和忽略的问题增加了一倍以上。我建议你在创建三元函数之前非常仔细地考虑。\n\
  \n例如，考虑接受三个参数的常见 `assertEquals` 重载方法：`assertEquals(message, expected, actual)`。你曾多少次读到\
  \ `message` 却以为它是 `expected`？我曾多次在这个特定的三元元组上绊脚并停顿。事实上，*每当我看到它时*，我都会停下来仔细看一眼，然后学会忽略这个消息。\n\
  \n另一方面，这里有一个并不那么阴险的元元元组：``assertEquals(1.0, amount, .001)`。虽然这仍然需要多看一眼，但这种回看是值得的。经常被提醒一下浮点值的相等性是一个相对性概念，这总是好事。\n\
  \n## 参数对象 (Argument Objects)\n\n当一个函数似乎需要两个或三个以上的参数时，可能是其中一些参数应该被封装在它们自己的类中。例如，考虑以下两个声明之间的区别：\n\
  \n```\nCircle makeCircle(double x, double y, double radius);\nCircle makeCircle(Point\
  \ center, double radius);\n```\n\n通过创建对象来减少参数数量似乎像是在作弊，但并非如此。当一组变量被一起传递时（如上面示例中的\
  \ `x` 和 `y` 那样），它们可能属于一个值得拥有自己名称的概念。\n\n## 参数列表 (Argument Lists)\n\n有时我们想要向函数传递可变数量的参数。例如，考虑\
  \ `String.format` 方法：\n\n```\nString.format(”s worked %.2f hours.”, name, hours);\n\
  ```\n\n如果可变参数都被以完全相同的方式对待，如上面的示例所示，那么它们等同于一个 `List` 类型的单一参数。根据这个推理，`String.format`\
  \ 实际上是二元的。事实上，如下所示的 `String.format` 定义显然是二元的。\n\n```java\npublic String format(String\
  \ format, Object… args)\n```\n\n所以所有的规则都适用。接收可变参数的函数可以是单元的、二元的，甚至是三元的。但如果给它们提供比这更多的参数将是一个错误。\n\
  \n```java\nvoid monad(Integer… args);\nvoid dyad(String name, Integer… args);\n\
  void triad(String name, int count, Integer… args);\n```\n\n## 动词与关键字 (Verbs and\
  \ Keywords)\n\n为函数选择一个好的名称对于解释函数的意图以及参数的顺序和意图有很大帮助。对于单元来说，函数和参数应该形成一对非常好的动词/名词对。例如，`write(name)`\
  \ 很有具联想性。无论这个“name”东西是什么，它正在被“写入”。一个更好的名字可能是 `writeField(name)`，它告诉我们这个“name”东西是一个“字段”。\n\
  \n最后是函数名*关键字*形式的示例。使用这种形式，我们将参数的名称编码到函数名中。例如，`assertEquals` 可能写成 `assertExpectedEqualsActual(expected,\
  \ actual)` 更好。这很大地缓解了必须记忆顺序的问题。\n\n## 不要有副作用 (Have No Side Effects)\n\n副作用是谎言。你的函数承诺做一件事，但它还做了一些*隐藏*的事情。有时它会对它自己的类变量产生意外更改。有时它会对传递的参数或全局变量进行更改。无论何种情况，它们都是欺骗且有害的谎言，通常会导致奇怪的时间耦合。\n\
  \n例如，考虑 Listing 3-6 中看似无函数的函数。它使用标准算法匹配 `userName` 和 `password`。如果匹配则返回 `true`，出现问题时返回\
  \ `false`。但它也有副作用。你能发现吗？\n\n**Listing 3-6 `UserValidator.java`**\n\n```java\npublic\
  \ class UserValidator {\n    private Cryptographer cryptographer;\n    public boolean\
  \ checkPassword(String userName, String password) {\n        User user = UserGateway.findByName(userName);\n\
  \        if (user != User.NULL) {\n            String codedPhrase = user.getPhraseByPassword();\n\
  \            String phrase = cryptographer.decrypt(codedPhrase, password);\n   \
  \         if (\"Valid Password\".equals(phrase)) {\n                Session.initialize();\n\
  \                return true;\n            }\n        }\n        return false;\n\
  \    }\n}\n```\n\n当然，副作用是调用 `Session.initialize()`。`checkPassword` 函数从其名称来看，它是在检查密码。名字并没有暗示它会初始化会话。因此，相信函数名称的调用者在检查用户有效性时，面临无意删除现有会话数据的风险。\n\
  \n这种副作用创建了时间耦合。也就是说，`checkPassword` 可以在特定时间调用（换句话说，在可以初始化会话时）。如果调用顺序错误，会话可能会意外丢失。时间耦合是令人困惑的，尤其是当作为副作用隐藏时。如果你必须有一个时间耦合，你应该在函数名称中明确表示。\n\
  \n## 输出参数 (Output Arguments)\n\n参数最自然的解释方式是函数的*输入*。如果你已经编程了多年，我确信你曾对一个实际上是*输出*而非输入的参数多看一眼。例如：\n\
  \n```\nappendFooter(s);\n```\n\n\n\n\n\n这个函数是将 `s` 作为页脚附加到某个内容上？还是将某个页脚附加到 `s` 上？`s`\
  \ 是输入还是输出？只需一眼函数签名就能看出来：\n\n```java\npublic void appendFooter(StringBuffer report)\n\
  ```\n\n这消除了疑义，但却是以检查函数声明为代价的。任何迫使你去检查函数签名的行为都等同于“反复回看”。这是一种认知上的中断，应该被避免。\n\n在面向对象编程出现之前，有时必须使用输出参数。然而，在面向对象（语言中，对输出参数的大部分需求消失了，因为\
  \ `this` *旨在* 充用作输出参数。换句话说，通过如下方式调用 `appendFooter` 会更好：\n\n```java\nreport.appendFooter();\n\
  ```\n\n通常情况下应该避免使用输出参数。如果你的函数必须更改某些东西的状态，请让它更改其所属对象的状态。\n\n## 命令查询分离 (Command Query\
  \ Separation)\n\n函数要么执行某些操作，要么回答某些问题，但不能两者兼顾。你的函数要么改变对象的状态，要么应该返回关于该对象的信息。两者兼顾往往会导致混惑。例如，考虑以下函数：\n\
  \n```java\npublic boolean set(String attribute, String value);\n```\n\n该函数设置命名属性的值，如果成功则返回\
  \ `true`，如果不存在该属性则返回 `false`。这导致了像这样的奇异语句：\n\n```java\nif (set(”username”, ”unclebob”))…\n\
  ```\n\n从读者的角度想象一下。这是什么意思？是在询问 `username` 属性之前是否被设置为 `unclebob` 吗？还是在询问 `username`\
  \ 属性是否成功地设置为 `unclebob`？从调用处很难推断出含义，因为不清楚 `set` 这个词是动词还是形容词。\n\n作者本意让 `set` 作为动词，但在\
  \ `if` 语句的上下文中，它 *感觉* 像是一个形容词。所以语句读起来像是“如果 `username` 属性之前被设置为 `unclebob`”，而不是“将\
  \ `username` 属性设置为 `unclebob` 如果操作成功了那么……”。我们可以尝试通过将 `set` 函数重命名为 `setAndCheckIfExists`\
  \ 来解决这个问题，但这对 `if` 语句的可读性帮助并不大。真正的解决方案是将命令与查询分离，这样就不会产生歧义。\n\n```java\nif (attributeExists(”username”))\
  \ {\n    setAttribute(”username”, ”unclebob”);\n    …\n}\n```\n\n## 优先使用异常而非返回错误码\n\
  \n从命令函数返回错误码是对命令查询分离的细微违反。它促使命令被用作 `if` 语句谓词词中的表达式。\n\n```java\nif (deletePage(page)\
  \ == E_OK)\n```\n\n这没有导致动词/形容词的混淆，但会导致深层嵌套结构。当你返回错误码时，你就制造了一个调用者必须立即处理错误的问题。\n\n\
  ```java\nif (deletePage(page) == E_OK) {\n    if (registry.deleteReference(page.name)\
  \ == E_OK) {\n        if (configKeys.deleteKey(page.name.makeKey()) == E_OK){\n\
  \            logger.log(\"page deleted\");\n        } else {\n            logger.log(\"\
  configKey not deleted\");\n        }\n    } else {\n        logger.log(\"deleteReference\
  \ from registry failed\");\n    }\n} else {\n    logger.log(\"delete failed\");\n\
  \    return E_ERROR;\n}\n```\n\n另一方面，如果你使用异常而不是返回的错误码，那么错误处理代码就可以从主路径（happy path）代码中分离并简化：\n\
  \n```java\ntry {\n    deletePage(page);\n    registry.deleteReference(page.name);\n\
  \    configKeys.deleteKey(page.name.makeKey());\n}\ncatch (Exception e) {\n    logger.log(e.getMessage());\n\
  }\n```\n\n### 提取 Try/Catch 块\n\n`Try/catch` 块本身就很丑。它们混淆了代码结构，并将错误处理与正常处理混合在一起。因此，将\
  \ `try` 和 `catch` 块的主体提取为独立的函数更好。\n\n```java\npublic void delete(Page page) {\n\
  \    try {\n        deletePageAndAllReferences(page);\n    }\n    catch (Exception\
  \ e) {\n        logError(e);\n    }\n}\n\nprivate void deletePageAndAllReferences(Page\
  \ page) throws Exception {\n    deletePage(page);\n    registry.deleteReference(page.name);\n\
  \    configKeys.deleteKey(page.name.makeKey());\n}\n\nprivate void logError(Exception\
  \ e) {\n    logger.log(e.getMessage());\n}\n```\n\n在上述代码中，`delete` 函数完全关于错误处理。它很容易理解然后忽略。`deletePageAndAllReferences`\
  \ 函数完全关于完全删除一个 `page` 的过程。错误处理可以忽略。这提供了一种良好的分离，使得代码更容易理解和修改。\n\n### 错误处理是一件事\n\n\
  函数应该只做一件事。错误处理是一件事。因此，处理错误的函数不应该做任何其他事情。这意味着（如上面的示例），如果函数中存在 `try` 关键字，它应该是函数中的第一个单词，并且在\
  \ `catch/finally` 块之后不应该有任何内容。\n\n## `Error.java` 依赖磁铁\n\n返回错误码通常意味着有一个类或枚举其中定义了所有的错误码。\n\
  \n```java\npublic enum Error {\n    OK,\n    INVALID,\n    NO_SUCH,\n    LOCKED,\n\
  \    OUT_OF_RESOURCES,\n    WAITING_FOR_EVENT;\n}\n```\n\n这样的类是依赖磁铁；许多其他类都导入并使用它们。因此，当\
  \ `Error` `enum` 发生时，所有其他类都需要重新编译。这给 `Error` 类带来了负面压力。程序员不想添加新错误，而是复用旧的错误码。当你使用异常而不是错误码时，新异常是异常类的\
  \ *派生类*。它们可以添加而无需强制任何重新编译。\n\n## 不要重复自己 (Don’t Repeat Yourself)\n\n仔细查看列表 1，你会注意到有一个算法重复了四次，分别对应\
  \ `SetUp`、`SuiteSetUp`、`TearDown` 和 `SuiteTearDown` 情况。这种重复并不容易发现，因为四个实例与其他代码混合在一起，并且不是统一地重复。尽管如此，重复是一个问题，因为它膨胀了代码，并且如果算法需要更改，将需要四倍的修改。它还提供了四次遗漏错误。\n\
  \n![Image]\n\n这种重复通过列表 7 中的 `include` 方法修复了。再次阅读该代码，注意由于重复的减少，整个模块的可读性得到了增强。\n\n\
  重复可能是软件中一切恶的根源。许多原则和实践都是为了控制或消除它而创建的。例如，考虑所有科德（Codd）数据库范式都是为了消除数据中的重复。再考虑面向对象编程如何将代码集中到原本冗的基类中。结构化编程、面向切面编程、面向组件编程，在某种程度上都是消除重复的策略。似乎自子程序发明以来，软件开发的创新一直是对消除源代码中重复的持续尝试。\n\
  \n### 结构化编程\n\n某些程序员遵循埃德格尔·迪克斯特（Edsger Dijkstra）的结构化编程规则。迪克斯拉说，每个函数以及函数中的每个块都应该有一个入口和一个出口。遵循这些规则意味着函数中只有一个\
  \ `return` 语句，循环中不应该有 `break` 或 `continue` 语句，并且永远、绝对不要使用任何 `goto` 语句。\n\n\n\n\n\
  \n虽然我们对结构化编程的目标和规范表示赞同，但当函数非常短同时，这些规则的用处甚微。只有在较大的函数中，这些规则才能提供显著的益处。\n\n因此，如果你保持函数很小，那么偶尔出现多个\
  \ `return`、`break` 或 `continue` 语句并无大碍，有时它们甚至比“单入口单出口”规则更具表现力。另一方面，`goto` 只在大型函数中才有意义，因此应该被避免使用。\n\
  \n### 你是如何编写这样的函数的？\n\n编写软件就像任何其他形式的写作一样。当你写写论文或文章时，你首先是把想法写下来，然后对其进行润色，直到它读起来顺畅。初稿可能是笨拙且杂乱无章的，所以你对其进行推敲、重构结构并精炼，直到它达到你想要的效果。\n\
  \n当我写函数时，它们写出来的代码通常又长又复杂。它们有大量的缩进和嵌套循环，有很长的参数列表。名称是随意的，而且还有重复的代码。但我有一套单元测试，涵盖了那每一行笨拙的代码。\n\
  \n所以，我会对这些代码进行润色和精炼，拆分函数，更改名称，消除重复。我缩小方法的规模并重新排序。有时我会拆分出整个类，同时始终保持测试通过。\n\n最后，我得到的函数遵循了我在本章中规定的规则。我并不是从一开始就那样写它们的。我认为没有人能直接做到这一点。\n\
  \n### 结论\n\n每个系统都是由程序员设计的、用于描述该系统的领域特定语言（DSL）构建而成的。函数是这种语言的动词，而类是名词。这并不是要回到那种极其糟糕的旧观念——即需求文档中的名词和动词是系统类和函数的初步猜测。相反，这是一个更古老的真理。编程的艺术在过去是、现在也一直是，是语言设计的艺术。\n\
  \n大师级程序员将系统视为要讲述的故事，而不是要编写的程序。他们利用所选编程语言的功能，构建出一种更丰富、更具表现力的语言，用以讲述那个故事。这种领域特定语言的一部分，是描述系统内发生的所有动作的函数层次结构。在一次精妙的递归中，这些动作使用它们自身定义的领域特定语言来讲述它们在故事中的一小部分。\n\
  \n本章主要关于如何写好函数的机制。如果你遵循此处的规则，你的函数将会是短小、命名良好且组织良好的。但永远不要忘记，你的真实目标是讲述系统的故事，而你编写的函数需要整洁地组合成一种清晰精确的语言，以帮助你完成讲述。\n\
  \n### SetupTeardownIncluder\n\n**Listing 3-7 SetupTeardownIncluder.java**\n\n```java\n\
  package fitnesse.html;\n\nimport fitnesse.responders.run.SuiteResponder;\n\nimport\
  \ fitnesse.wiki.*;\n\npublic class SetupTeardownIncluder {\n\n    private PageData\
  \ pageData;\n\n    private boolean isSuite;\n\n    private WikiPage testPage;\n\n\
  \    private StringBuffer newPageContent;\n\n    private PageCrawler pageCrawler;\n\
  \n    public static String render(PageData pageData) throws Exception {\n      \
  \  return render(pageData, false);\n    }\n\n    public static String render(PageData\
  \ pageData, boolean isSuite)\n    throws Exception {\n\n        return new SetupTeardownIncluder(pageData).render(isSuite);\n\
  \    }\n\n    private SetupTeardownIncluder(PageData pageData) {\n        this.pageData\
  \ = pageData;\n        testPage = pageData.getWikiPage();\n        pageCrawler =\
  \ testPage.getPageCrawler();\n        newPageContent = new StringBuffer();\n   \
  \ }\n\n    private String render(boolean isSuite) throws Exception {\n        this.isSuite\
  \ = isSuite;\n        if (isTestPage())\n            includeSetupAndTeardownPages();\n\
  \        return pageData.getHtml();\n    }\n\n    private boolean isTestPage() throws\
  \ Exception {\n        return pageData.hasAttribute(\"Test\");\n    }\n\n    private\
  \ void includeSetupAndTeardownPages() throws Exception {\n        includeSetupPages();\n\
  \        includePageContent();\n        includeTeardownPages();\n        updatePageContent();\n\
  \    }\n\n    private void includeSetupPages() throws Exception {\n        if (isSuite)\n\
  \            includeSuiteSetupPage();\n        includeSetupPage();\n    }\n\n  \
  \  private void includeSuiteSetupPage() throws Exception {\n        include(SuiteResponder.SUITE_SETUP_NAME,\
  \ \"-setup\");\n    }\n\n    private void includeSetupPage() throws Exception {\n\
  \        include(\"SetUp\", \"-setup\");\n    }\n\n    private void includePageContent()\
  \ throws Exception {\n        newPageContent.append(pageData.getContent());\n  \
  \  }\n\n    private void includeTeardownPages() throws Exception {\n        includeTeardownPage();\n\
  \        if (isSuite)\n            includeSuiteTeardownPage();\n    }\n\n    private\
  \ void includeTeardownPage() throws Exception {\n        include(\"TearDown\", \"\
  -teardown\");\n    }\n\n    private void includeSuiteTeardownPage() throws Exception\
  \ {\n        include(SuiteResponder.SUITE_TEARDOWN_NAME, \"-teardown\");\n    }\n\
  \n    private void updatePageContent() throws Exception {\n        pageData.setContent(newPageContent.toString());\n\
  \    }\n\n    private void include(String pageName, String arg) throws Exception\
  \ {\n        WikiPage inheritedPage = findInheritedPage(pageName);\n        if (inheritedPage\
  \ != null) {\n            String pagePathName = getPathNameForPage(inheritedPage);\n\
  \            buildIncludeDirective(pagePathName, arg);\n        }\n    }\n\n   \
  \ private WikiPage findInheritedPage(String pageName) throws Exception {\n     \
  \   return PageCrawler.getInheritedPage(pageName, testPage);\n    }\n\n    private\
  \ String getPathNameForPage(WikiPage page) throws Exception {\n        WikiPagePath\
  \ pagePath = pageCrawler.getFullPath(page);\n        return PathParser.render(pagePath);\n\
  \    }\n\n    private void buildIncludeDirective(String pageName, String arg) {\n\
  \        newPageContent\n            .append(\"\\n!include \")\n            .append(arg)\n\
  \            .append(\" .\")\n            .append(pageName)\n            .append(\"\
  \\n\");\n    }\n}\n```\n\n### 参考文献\n\n[KP78]: Kernighan and Plaugher, *The Elements\
  \ of Programming Style*, 2d. ed., McGraw-Hill, 1978.\n\n[PPP02]: Robert C. Martin,\
  \ *Agile Software Development: Principles, Patterns, and Practices*, Prentice Hall,\
  \ 2002.\n\n[GOF]: *Design Patterns: Elements of Reusable Object Oriented Software*,\
  \ Gamma et al., Addison-Wesley, 1996.\n\n[PRAG]: *The Pragmatic Programmer*, Andrew\
  \ Hunt, Dave Thomas, Addison-Wesley, 2000.\n\n[SP72]: *Structured Programming*,\
  \ O.-J. Dahl, E. W. Dijkstra, C. A. Hoare, Academic Press, London, 1972.\n\n## 4\
  \ 注释\n\n![Image](img/Image0022.jpg)\n\n*“不要注释糟糕的代码——要重写它。”*\n\n——Brian W. Kernighan\
  \ and P. J. Plaugher\n\n一个恰当的注释比任何事情都有用。没有什么比琐碎教条式的注释更浪费模块。没有什么比传播错误和虚假信息的陈旧过时注释更具破坏性。\n\
  \n注释并不是辛德勒的名单。它们不是什么“纯粹的善”。事实上，注释充其量只是一种必要的恶。如果我们的编程语言足够丰富，或者我们有足够的才能巧妙地运用这些语言来表达意图，我们就不那么需要注释——可能完全不需要。\n\
  \n注释的正确用法是补偿我们在代码中表达自我的失败。注意，我使用了“失败”这个词。我是这个意思。注释总是失败。我们必须使用它们是因为我们总是无法在没有注释的情况下表达自己，但它们的使用并不是值得庆祝的。\n\
  \n所以，当你发现自己处于需要编写注释的位置时，深思一下，是否有某种方法可以扭转局面，通过代码表达自己。每当你通过代码表达自己时，你都应该拍拍自己的掌。每当你写注释时，你都应该皱脸并感到自己表达能力的失败。\n\
  \n\n\n为什么我如此反感注释？因为它们会撒谎。并非总是如此，也并非故意的，但频率太高。注释越旧，离它所描述的代码越远，它就越可能纯粹是错误的。原因很简单：程序员现实中无法维护它们。\n\
  \n代码会发生变化和演进。代码块从这里移动到那里。这些块会分叉、复制并再次汇聚形成“奇合体”。遗憾的是，注释并不总是能跟随它们——*无法*总是跟随它们。而且在很多时候，注释会与它们描述的代码分离，变成孤立的、准确性不断下降的零散文字。例如，看看这段注释以及它本打算描述的那行代码发生了什么：\n\
  \n```java\nMockRequest request;\n\nprivate final String HTTP_DATE_REGEXP =\n“[SMTWF][a-z]{2}\\\
  \\,\\\\s[0-9]{2}\\\\s[JFMASOND][a-z]{2}\\\\s”+\n“[0-9]{4}\\\\s[0-9]{2}\\\\:[0-9]{2}\\\
  \\:[0-9]{2}\\\\sGMT”;\n\nprivate Response response;\n\nprivate FitNesseContext context;\n\
  \nprivate FileResponder responder;\n\nprivate Locale saveLocale;\n\n// Example:\
  \ ”Tue, 02 Apr 2003 22:18:49 GMT”\n```\n\n其他后来添加的实例变量被插在了 `HTTP_DATE_REGEXP` 常数及其解释性注释之间。\n\
  \n有人可能会认为程序员应该足够自律，使注释保持在良好的维护状态、相关性和准确性。我同意，他们应该这样做。但我更愿意将这些精力花在让代码变得清晰且富有表现力，以至于根本不需要注释。\n\
  \n不准确的注释比完全没有注释要糟糕得多。它们会误导和欺骗人们。它们设定了永远无法实现的预期。它们制定了不再需要或不应该再继续遵循的旧规则。\n\n## 注释不能弥补糟糕的代码\n\
  \n编写注释的常见动机之一是代码糟糕。我们写了一个模块，并且知道它很困惑且毫无无章。我们知道它是一团糟。于是我们对自己说：“噢，我最好给它加个注释！”不！你最好去清理它！\n\
  \n清晰且富有表现力且注释较少的代码，远优于充斥且复杂且带有大量注释的代码。与其花时间写注释来解释你制造的混乱乱糟，不如花时间去清理那团乱糟。\n\n## 在代码中解释你自己\n\
  \n确实在某些时候，代码并不是解释的良好媒介。遗憾的是，许多程序员将此理解为代码很少（甚至从不是）一种良好的解释手段。这显然是错误的。你更愿意看到哪一个？这个：\n\
  \n```java\n// 检查员工是否符合全额福利\nif ((employee.flags & HOURLY_FLAG) &&\n(employee.age\
  \ > 65))\n```\n\n还是这一个？\n\n```java\nif (employee.isEligibleForFullBenefits())\n\
  ```\n\n在代码中解释你的大部分意图只需要几秒钟思考。在很多情况下，这仅仅是创建一个与你想编写的注释表达相同含义的函数。\n\n## 好的注释\n\n有些注释是有必要的或有益的。我们将看看几个我认为物其所占用比特的注释。然而，请记住，唯一真正好的注释是你找到方法不写出来的那条注释。\n\
  \n### 法律注释\n\n有时我们的公司编码标准迫使我们出于法律原因编写某些注释。例如，版权和作者声明是放在每个源文件开头的注释中必要且合理的内容。\n\n\
  例如，这是我们在 FitNesse 的每个源文件开头放置的标准注释头。我很乐地说，我们的 IDE 通过自动折叠来防止这条注释成为杂乱内容。\n\n```java\n\
  // Copyright (C) 2003,2004,2005 by Object Mentor, Inc. All rights reserved.\n//\
  \ Released under the terms of the GNU General Public License version 2 or later.\n\
  ```\n\n此类注释不应是合同或法律巨著。在可能的情况下，引用标准许可或其他外部文档，而不是将所有条款和条件放入注释中。\n\n### 信息性注释\n\n有时，通过注释提供基本信息是有用的。例如，考虑这段解释抽象方法返回返回的注释：\n\
  \n```java\n// 返回一个正在测试的 Responder 实例。\nprotected abstract Responder responderInstance();\n\
  ```\n\n这样的注释有时是有用的，但更好的做法是尽可能使用函数名来传达信息。例如，在这种情况下，通过重命名函数为 `responderBeingTested`\
  \ 可以使注释变得多余。\n\n这里有一个稍微好一点的例子：\n\n```java\n// format matched kk:mm:ss EEE, MMM dd,\
  \ yyyy\nPattern timeMatcher = Pattern.compile(\n“\\\\d*:\\\\d*:\\\\d* \\\\w*, \\\
  \\w* \\\\d*, \\\\d*”);\n```\n\n在这种情况下，注释告诉我们正则表达式旨在匹配使用指定格式字符串通过 `SimpleDateFormat.format`\
  \ 函数格式化的日期和时间。尽管如此，如果将这段代码移动到一个专门转换日期时间格式的特殊类中，可能会更好、更清晰。那时那条注释可能就是多余的。\n\n### 意图解释\n\
  \n有时注释不仅提供了关于实现的有用信息，还提供了背后的意图。在下面的例子中，我们看到了由注释记录的决策。\n\n```java\npublic int compareTo(Object\
  \ o)\n{\n    if(o instanceof WikiPagePath)\n    {\n        WikiPagePath p = (WikiPagePath)\
  \ o;\n        String compressedName = StringUtil.join(names, \"\");\n        String\
  \ compressedArgumentName = StringUtil.join(p.names, \"\");\n        return compressedName.compareTo(compressedArgumentName);\n\
  \    }\n    return 1;\n}\n```\n\n你可能不同意程序员对问题的解决方案，但至少你知道他想做什么。\n\n```java\npublic\
  \ void testConcurrentAdd() throws Exception {\nWidgetBuilder widgetBuilder = new\
  \ WidgetBuilder(new Class[]{BoldWidget.class});\nString text =’bold text’;\nParentWidget\
  \ parent = new MockRoot();\nAtomicBoolean failFlag = new AtomicBoolean();\nfailFlag.set(false);\n\
  \n//通过创建大量线程获取竞态条件的最佳尝试。\nfor (int i = 0; i < 25000; i++) {\nWidgetBuilderThread\
  \ widgetBuilderThread = new WidgetBuilderThread(widgetBuilder, text, parent, failFlag);\n\
  Thread thread = new Thread(widgetBuilderThread);\nthread.start();\n}\n\nassertEquals(false,\
  \ failFlag.get());\n}\n```\n\n### 澄清\n\n有时将某些晦涩参数或返回值的含义成可读的内容是有用的。通常最好是让该参数或返回值变得清晰；但如果它是标准库的一部分，或者在你无法修改的代码中，那么有帮助的澄清注释是可以有用的。\n\
  \n```java\npublic void testCompareTo() throws Exception\n{WikiPagePath a = PathParser.parse(\"\
  PageA\");\nWikiPagePath ab = PathParser.parse(\"PageA.PageB\");\nWikiPagePath b\
  \ = PathParser.parse(\"PageB\");\nWikiPagePath aa = PathParser.parse(\"PageA.PageA\"\
  );\nWikiPagePath bb = PathParser.parse(\"PageB.PageB\");\nWikiPagePath ba = PathParser.parse(\"\
  PageB.PageA\");\n\nassertTrue(a.compareTo(a) == 0); // a == a\nassertTrue(a.compareTo(b)\
  \ != 0); // a != b\nassertTrue(ab.compareTo(ab) == 0); // ab == ab\nassertTrue(a.compareTo(b)\
  \ == -1); // a < b\nassertTrue(aa.compareTo(ab) == -1); // aa < ab\nassertTrue(ba.compareTo(bb)\
  \ == -1); // ba < bb\nassertTrue(b.compareTo(a) == 1); // b > a\nassertTrue(ab.compareTo(aa)\
  \ == 1); // ab > aa\n}\n```\n\n\n\n\n\n```\nassertTrue(bb.compareTo(ba) == 1); //\
  \ bb > ba\n```\n\n当然，解释性注释存在错误的巨大风险。回顾一下上一个例子，看看要验证这些注释是否正确是多么困难。这既解释了为什么解释性注释是必要的，也解释了为什么它具有风险性。因此，在编写此类注释之前，请确保没有更好的方法，然后要更加仔细地确保它们的准确性。\n\
  \n## 后果警告\n\n有时，对其他程序员警告某些后果是有帮助的。例如，这里有一条注释解释了为什么要关闭某个特定的测试用例：\n\n![Image](img/Image00023.jpg)\n\
  \n```java\n// 除非你有\n// 大把时间可以浪费，否则不要运行。\n\npublic void _testWithReallyBigFile()\n\
  {\n    writeLinesToFile(10000000);\n    response.setBody(testFile);\n    response.readyToSend(this);\n\
  \    String responseString = output.toString();\n    assertSubString(\"Content-Length:\
  \ 1000000000\", responseString);\n    assertTrue(bytesSent > 1000000000);\n}\n```\n\
  \n如今，当然，我们会使用 `@Ignore` 属性配合适当的解释性字符串来关闭测试用例。`@Ignore(”运行太久了”)`。但在 JUnit 4 之前的时代，在方法名前加一个下划线是一种常见的约定。这条注释虽然很轻率，但很好地表达了观点。\n\
  \n这里是另一个更发人心的例子：\n\n```java\npublic static SimpleDateFormat makeStandardHttpDateFormat()\n\
  {\n    // SimpleDateFormat 不是线程安全的，\n    // 所以我们需要独立创建每个实例\n    SimpleDateFormat\
  \ df = new SimpleDateFormat(”EEE, dd MMM yyyy HH:mm:ss z”);\n    df.setTimeZone(TimeZone.getTimeZone(”GMT”));\n\
  \    return df;\n}\n```\n\n你可能会抱怨说有更好的解决这个问题的方法。我可能同意你的观点。但这里给出的注释是完全合理的。它将防止某些过度急切的程序员为了效率而使用静态初始化器。\n\
  \n## TODO 注释\n\n有时，以 `//TODO` 注释的形式留下“待办”事项是合理的。在以下情况下，`TODO` 注释解释了为什么该函数有一个退化的实现，以及该函数的未来应该是怎样的。\n\
  \n```java\n//TODO-MdM 这些是不需要的\n// 我们预计在做结账模型时，这些会消失\nprotected VersionInfo makeVersion()\
  \ throws Exception\n{\n    return null;\n}\n```\n\n`TODO` 是程序员认为应该完成、但由于某些原因目前无法完成的任务。它可能是一个删除弃用特性的提醒，也可能是请求他人查看某个问题的恳求。它可能是一个请求别人想个更好的名字，或者提醒要进行某个依赖于计划内事件的更改。无论\
  \ `TODO` 还是什么，它都不是在系统中遗留糟糕代码的借口。\n\n如今，大多数优秀的 IDE 都提供了特殊的姿势和功能来定位所有的 `TODO` 注释，因此它们不太可能遗失。尽管如此，你也不希望你的代码中充斥着\
  \ `TODO`。因此，请定期扫描它们，并消除那些可以消除的。\n\n## 放大\n\n注释可以被用来放大某些可能看似无关紧要的事的重要性。\n\n```java\n\
  String listItemContent = match.group(3).trim();\n// trim 非常重要。它移除了开头的空格\n// 这些空格可能会导致项目被识别为\n\
  // 另一个列表。\nnew ListItemWidget(this, listItemContent, this.level + 1);\nreturn buildList(text.substring(match.end()));\n\
  ```\n\n## 公共 API 中的 Javadocs\n\n没有什么比一个描述良好的公共 API 更有帮助、更令人满意的。Java 标准库的 java-docs\
  \ 就是一个例子。如果没有它们，编写 Java 程序充其量是困难的。\n\n如果你正在编写公共 API，那么你确实应该为它编写良好的 javadocs。但请记住本章中的其他建议。Javadocs\
  \ 可能与任何其他类型的注释一样具有误导性、非局部性和不诚实。\n\n## 糟糕的注释\n\n大多数注释属于这一类。它们通常是糟糕代码的拐杖或借口，或者是决策不足的辩护，无非程序员的自言自语。\n\
  \n### 喃喃自语\n\n仅仅因为觉得应该写或者因为流程需要就丢进一条注释，这是一种取巧（hack）。如果你决定写注释，请花足够的时间来确保它是你能写出的最好的注释。\n\
  \n在这里，这是我在 FitNesse 中发现的一个案例，在那儿，注释可能确实是有用的。但作者当时很匆忙，或者只是没那么注意。他的喃喃自语留下了一个谜：\n\n\
  ```java\npublic void loadProperties()\n{\n    try\n    {\n        String propertiesPath\
  \ = propertiesLocation + ”/\" + PROPERTIES_FILE;\n        FileInputStream propertiesStream\
  \ = new FileInputStream(propertiesPath);\n        loadedProperties.load(propertiesStream);\n\
  \    }\n    catch(IOException e)\n    {\n        // 没有属性文件意味着加载了所有默认值\n    }\n}\n\
  ```\n\n`catch` 块中的那条注释是什么意思？显然这对作者有某种意义，但这个意义并没有表达得很清楚。显然，如果我们收到 `IOException`，意味着没有属性文件；在这种情况下加载了所有默认值。但是谁加载了所有默认值？它们是在调用之前加载的吗？还是在\
  \ `load` 捕获异常后加载的？还是 `load` 块是空的？\n\n### 冗余注释\n\n`Listing 4-1` 显示了一个简单的函数，它有一个完全冗余的头部注释。阅读注释的时间可能比代码本身还要长。\n\
  \n```java\n// 工具方法，当 this.closed 为 true 时返回。\n// 如果超时则抛出异常\npublic synchronized\
  \ void waitForClose(final long timeout)\nthrows Exception\n{\n    if(!closed)\n\
  \    {\n        wait(timeoutMillis);\n        if(!closed)\n            throw new\
  \ Exception(\"MockResponseSender could not be closed\");\n    }\n}\n```\n\n这条注释起什么作用？它绝不如代码有信息量。它没有证明代码的意图或理由。它并不比代码更易读。事实上，它比代码不精确，引导读者接受这种不精确，而非真正的理解。这就像一个圆滑的二手车销售员向你保证你不需要查看引擎盖。\n\
  \n现在考虑来自 Tomcat 的 `Listing 4-2` 中大量无用且冗余的 javadocs。这些注释只会干扰和模糊代码。它们完全没有文档意义。糟糕的是，我只向你展示了前几个。在这个模块中还有很多。\n\
  \n```java\n// Listing 4-2 ContainerBase.java (Tomcat)\npublic abstract class ContainerBase\n\
  implements Container, Lifecycle, Pipeline,\nMBeanRegistration, Serializable {\n\
  \    /**\n     * 此组件的处理器延迟。\n     */\n    protected int backgroundProcessorDelay\
  \ = -1;\n\n    /**\n     * 此组件的生命周期事件支持。\n     */\n    protected LifecycleSupport\
  \ lifecycle =\n    new LifecycleSupport(this);\n\n    /**\n     * 此容器的事件监听器。\n \
  \    */\n    protected ArrayList listeners = new ArrayList();\n\n    /**\n     *\
  \ 与此容器关联的加载器实现类。\n     */\n    protected Loader loader = null;\n\n    /**\n    \
  \ * 与此容器关联的日志记录器实现类。\n     */\n    protected Logger logger = null;\n```\n\n\n\n\n\
  \n```java\nprotected Log logger = null;\n\n/**\n* 关联的日志器名称。\n */\nprotected String\
  \ logName = null;\n\n/**\n* 此 Container 关联的 Manager 实现。\n */\nprotected Manager\
  \ manager = null;\n\n/**\n* 此 Container 关联的集群。\n */\nprotected Cluster cluster =\
  \ null;\n\n/**\n* 此 Container 的可读名称。\n */\nprotected String name = null;\n\n/**\n\
  * 此 Container 的子节点的父 Container。\n */\nprotected Container parent = null;\n\n/**\n\
  * 在安装 Loader 时要配置的父类加载器。\n */\nprotected ClassLoader parentClassLoader = null;\n\
  \n/**\n* 此 Container 关联的 Pipeline 对象。\n */\nprotected Pipeline pipeline = new StandardPipeline(this);\n\
  \n/**\n* 此 Container 关联的 Realm。\n */\nprotected Realm realm = null;\n\n/**\n* 此\
  \ Container 关联的 resources DirContext 对象。\n */\nprotected DirContext resources =\
  \ null;\n```\n\n### 误导性注释 (Misleading Comments)\n\n有时候，尽管出于良好的意图，程序员在注释中做出的陈述不够精确，无法达到准确性。让我们再想一下我们在\
  \ Listing 4-1 中看到的那个极其冗余但又细微误导的注释。\n\n你发现该注释是如何具有误导性的了吗？该方法并不是在 `this.closed` 变为\
  \ `true` *时*返回。它返回的是 `this.closed` *是否*为 `true`；否则，它会等待一个盲目的超时，如果 `this.closed`\
  \ 仍然不是 `true`，则*抛出*异常。\n\n这种细微的错误信息被包裹在一个比代码主体更难读的注释中，可能会导致另一个程序员轻率地调用此函数，并期望它会在\
  \ `this.closed` 变为 `true` 时立即返回。那个可怜的程序员随后会发现自己陷入了调试中，试图弄清楚为什么他的代码执行得如此缓慢。\n\n###\
  \ 强制性注释 (Mandated Comments)\n\n规定每个函数都必须有 javadoc，或者每个变量都必须有注释，这简直是愚蠢。这样的注释只会弄乱代码、传播谎言，并导致通用的混乱和无组织。\n\
  \n例如，对每个函数都要求 javadoc 会导致诸如 Listing 4-3 这样的畸形。这种杂乱毫无用处，只会模糊代码，并为产生谎言和误导提供可能。\n\n\
  **Listing 4-3**\n\n```java\n/**\n*\n* @param title CD 的标题\n* @param author CD 的作者\n\
  * @param tracks CD 上的轨道数量\n* @param durationInMinutes CD 的时长（分钟）\n*/\npublic void\
  \ addCD(String title, String author,\nint tracks, int durationInMinutes) {\n   \
  \ CD cd = new CD();\n    cd.title = title;\n    cd.author = author;\n    cd.tracks\
  \ = tracks;\n    cd.duration = duration;\n    cdList.add(cd);\n}\n```\n\n### 日记式注释\
  \ (Journal Comments)\n\n有时，人们在每次编辑模块时都会在模块开头添加注释。这些注释累积成为一种日记或日志，记录了发生过的每一次更改。我见过有些模块有几十页这种连续的日记条目。\n\
  \n* 更改（自 2001 年 10 月 11 日）\n* --------------------------\n* 2001 年 10 月 11 日：重新组织了类并将其移动到新包\n\
  * com.jrefinery.date (DG);\n* 2001 年 11 月 05 日：增加了 `getDescription()` 方法，并删除了 NotableDate\n\
  * 类 (DG);\n* 2001 年 11 月 12 日：IBD 需要 `setDescription()` 方法，现在 NotableDate\n* 类已删除\
  \ (DG)更改了 `getPreviousDayOfWeek()`，\n* `getFollowingDayOfWeek()` 和 `getNearestDayOfWeek()`\
  \ 以修复\n* bug (DG);\n* 2001 年 12 月 05 日：修复了 SpreadsheetDate 类中的 bug (DG);\n* 2002\
  \ 年 5 月 29 日：将月份常量移动到独立的接口中\n* (MonthConstants) (DG);\n* 2002 年 8 月 27 日：修复了 `addMonths()`\
  \ 方法中的 bug，感谢 N???levka Petr (DG);\n* 2002 年 10 月 03 日：修复了 Checkstyle 报告的错误 (DG);\n\
  * 2003 年 3 月 13 日：实现了 `Serializable` (DG);\n* 2003 年 5 月 29 日：修复了 `addMonths` 方法中的\
  \ bug (DG);\n* 2003 年 9 月 04 日：实现了 `Comparable`。更新了 `isInRange` 的 javadoc (DG);\n\
  * 2005 年 1 月 05 日：修复了 `addYears()` 方法中的 bug (1096282) (DG);\n\n以前，在每个模块开头创建并维护这些日志条目是有充分理由的。我们没有没有由我们完成这些工作的源码控制系统。然而，现在这些长日记只是增加了模块的杂乱。它们应该被完全删除。\n\
  \n### 噪声注释 (Noise Comments)\n\n有时你会看到一些完全是噪声的注释。它们重述了显而易见的事，没有提供任何新信息。\n\n```java\n\
  /**\n* 默认构造函数。\n */\nprotected AnnualDateRule() {\n}\n```\n\n不，*真的吗？*或者这个怎么样：\n\n\
  ```java\n/** 月份几号。 */\nprivate int dayOfMonth;\n```\n\n然后是这个冗余的范例：\n\n```java\n\
  /** 返回月份几号。\n* @return 月份几号。\n*/\npublic int getOfMonth() {\n    return dayOfMonth;\n\
  }\n```\n\n这些注释噪声太大，导致我们学会忽略它们。当我们阅读代码时，眼睛直接跳过它们。Listing 4-4 中的第一个注释是合理的。但第二个注释是纯粹的噪声。显然程序员对\
  \ `try-catch` 块非常沮丧，以至于需要发泄。\n\n**Listing 4-4 `startSending`**\n\n```java\npublic\
  \ void startSending() {\n    try {\n        doSending();\n    } catch (SocketException\
  \ e) {\n        // 请求停止了。\n    } catch (Exception e) {\n        // 真服！\n    }\n\
  }\n```\n\n与其在无用的注释中发泄，不如程序员应该意识到通过将 `try-catch` 块提取到单独函数可以解决他的沮丧，如 Listing 4-5 所示。\n\
  \n**Listing 4-5 `startSending (重构后)`**\n\n```java\npublic void startSending() {\n\
  \    try {\n        doSending();\n    } catch (SocketException e) {\n        //\
  \ 请求停止了。\n    } catch (Exception e) {\n        addExceptionCloseResponse(e);\n \
  \   }\n}\n\nprivate void addExceptionCloseResponse(Exception e) {\n    // ...\n\
  }\n```\n\n\n\n\n\n# 位置标记\n\n程序员有时喜欢在源文件中标记特定的位置。例如，我最近在查看一个程序时发现了这样的代码：\n\n```\n\
  // Actions //////////////////////////////////\n```\n\n在极少数情况下，将某些函数聚集在这样的横幅下方是有意义的。但通常情况下，它们是应该消除的杂质——尤其是末尾那些杂乱的斜杠。\n\
  \n可以这样想：如果你不经常看到横幅，那么它就会很显眼且明显。因此，请非常节地使用它们，并且仅在收益显著时才使用。如果你过度使用横幅，它们就会变成背景噪音并被忽略。\n\
  \n# 大括号注释\n\n程序员有时会在右大括号上放置特殊的注释，如 Listing 4-6 所示。尽管这对于具有深度嵌套结构的长函数可能有意义，但对于我们青睐的小且封装良好的函数，它只会增加混乱。所以，如果你发现自己想标记右大括号，请尝试缩短你的函数。\n\
  \n**Listing 4-6 `wc.java`**\n\n```java\npublic class wc {\n\n    public static void\
  \ main(String[] args) {\n        BufferedReader in = new BufferedReader(new InputStreamReader(System.in));\n\
  \        String line;\n        int lineCount = 0;\n        int charCount = 0;\n\
  \        int wordCount = 0;\n        try {\n            while ((line = in.readLine())\
  \ != null) {\n                lineCount++;\n                charCount += line.length();\n\
  \                String words[] = line.split(\"\\\\W\");\n                wordCount\
  \ += words.length;\n            } //`while\n            System.out.println(\"wordCount\
  \ = \" + wordCount);\n            System.out.println(\"lineCount = \" + lineCount);\n\
  \            System.out.println(\"charCount = \" + charCount);\n        } //`try\n\
  \        catch (IOException e) {\n            System.err.println(\"Error:\" + e.getMessage());\n\
  \        } //`catch\n    } //main\n}\n```\n\n# 归属与署名\n\n```\n/* Added by Rick */\n\
  ```\n\n源代码控制系统非常擅长记住谁在什么时候添加了什么。没有必要用短小的署名来污染代码。你可能认为这种注释有助于帮助他人知道就该代码找谁说话。但现实是，它们往往会留很多年，变得越来越不准确、越来越不相关。\n\
  \n再次强调，源代码控制系统是存放此类信息的更好地方。\n\n# 注释掉的代码\n\n很少有什么实践像“注释掉代码”这般令人厌恶了。不要这么做！\n\n```java\n\
  InputStreamResponse response = new InputStreamResponse();\nresponse.setBody(formatter.getResultStream(),\
  \ formatter.getByteCount());\n// InputStream resultsStream = formatter.getResultStream();\n\
  // StreamReader reader = new StreamReader(resultsStream);\n// response.setContent(reader.read(formatter.getByteCount()));\n\
  ```\n\n其他看到这些注释代码的人没有勇气删除它们。他们会认为这些存在是有原因的，而且重要到无法删除。因此，注释掉的代码就像坏酒底部的残渣一样聚集在一起。\n\
  \n考虑 apache commons 中的这段：\n\n```java\nthis.bytePos = writeBytes(pngIdBytes, 0);\n\
  //hdrPos = bytePos;\nwriteHeader();\nwriteResolution();\n//dataPos = bytePos;\n\
  if (writeImageData()) {\n    writeEnd();\n    this.pngBytes = resizeByteArray(this.pngBytes,\
  \ this.maxPos);\n}\nelse {\n    this.pngBytes = null;\n}\nreturn this.pngBytes;\n\
  ```\n\n为什么那两行代码被注释掉了？它们重要吗？它们是为了某些即将到来的变化而留下的提醒吗？还是说它们只是某人在年前注释掉的、根本没费心清理的垃圾？\n\n\
  在过去的六十年代，注释掉代码可能是很有用的。但我们拥有良好的源代码控制系统已经有很长一段时间了。这些系统会为我们记住代码。我们不再需要把它们注释掉了。直接删除代码即可。我们不会丢失它的。保证。\n\
  \n# HTML 注释\n\n源代码注释中的 HTML 是一种禁忌，你通过阅读下面的代码就能看出来。它让注释在最应该易读的地方——编辑器/IDE 中变得难以阅读。如果注释需要被某些工具（如\
  \ Javadoc）提取并显示在网页上，那么这应该是工具的责任，而不是程序员去给注释添加适当的 HTML。\n\n```java\n/**\n* 运行拟合测试的任务。\n\
  * 此任务运行 fitnesse 测试并发布结果。\n* <p/>\n* <pre>\n* Usage:\n* &lt;taskdef name=&quot;execute-fitnesse-tests&quot;\n\
  * classname=&quot;fitnesse.ant.ExecuteFitnesseTestsTask&quot;\n* classpathref=&quot;classpath&quot;\
  \ /gt;\n* OR\n* &lt;taskdef classpathref=&quot;classpath&quot;\n* resource=&quot;tasks.properties&quot;\
  \ /gt;\n* <p/>\n* &lt;execute-fitnesse-tests\n* suitepage=&quot;FitNesse.SuiteAcceptanceTests&quot;\n\
  * fitnesseport=&quot;8082&quot;\n* resultsdir=&quot;${results.dir}&quot;\n* resultshtmlpage=&quot;fit-results.html&quot;\n\
  * classpathref=&quot;classpath&quot; /gt;\n* </pre>\n*/\n```\n\n# 非局部信息\n\n如果你必须写注释，请确保它描述的是它附近的代码。不要在局部注释的范围内提供系统级信息。例如，考虑下面的\
  \ javadoc。除了它是冗的之外，\n\n```java\n\n/**\n* fitnesse 运行的端口。默认值为 8082\n*\n* @param fitnessePort\n\
  */\npublic void setFitnessePort(int fitnessePort)\n{\n    this.fitnessePort = fitnessePort;\n\
  }\n```\n\n# 过多信息\n\n不要在你的注释中放入有趣的历史讨论或无关的描述。下面的注释提取自一个用于测试函数是否可以编码和解码 base64 的模块。除了\
  \ RFC 编号之外，\n\n/*\nRFC 2045 - 多用途互联网邮件扩展 (MIME)\n第一部分：互联网消息正文格式\n节 6.8\\. Base64\
  \ 内容传输编码\n编码过程将输入比特的 24 位组表示为 4 个字符的输出\n字符串。从左到右，24 位输入\n组通过连接 3 个 8 位输入组形成。\n这\
  \ 24 位随后被处理为 4 个 6 位组，每个\n组被翻译为 base64 字母表中的一个数字。\n通过 base64 编码位流时，\n必须假设位流是高位优先的。\n\
  也就是说，流中的第一个位将是第一个 8 位\n字节的高位，而第八位将是第一个 8 位\n字节的低位，依此类推。\n*/\n\n# 不显而易见的联系\n\n注释与其描述的代码之间的联系应该是显而易见的。如果你费力写注释，你至少希望读者能够查看注释和代码，并理解注释在说什么。\n\
  \n例如，考虑这段来自 apache commons 的注释：\n\n```java\n/*\n* 启动一个足够大的数组来容纳所有像素\n*（加上过滤器字节），以及额外的\
  \ 200 字节用于头部信息\n*/\nthis.pngBytes = new byte[((this.width + 1) * this.height * 3)\
  \ + 200];\n```\n\n什么是过滤器字节？它和 +1 有关吗？还是和 *3 有关？还是都有关？像素是字节吗？为什么是 200？注释的目的是解释不能自说明的代码。遗憾的是，有时注释需要自己的解释。\n\
  \n# 函数头部\n\n短函数不需要太多描述。对于一个只做件事的小函数，一个良好的名称通常比注释头部更好。\n\n# 非私有代码中的 Javadocs\n\n\n\
  \n\n\n虽然 `javadocs` 对公共 API 很有用，但对于不打算面向公开的代码来说，它们简直是禁忌。为系统内部的类和函数生成 `jav` 页通常没有用，而\
  \ `jav` 注释多余的正式性无非是冗余和分心。\n\n#### **示例**\n\n我在第一次*XP 沉浸体验*（XP Immersion）中编写了列表 4-7\
  \ 中的模块。它本意是作为一个糟糕编码和注释风格的示例。随后，Kent Beck 在几十名热情的学生面前，将这部分代码重构为一种更令人愉悦的形式。后来，我将这个示例改编到我的书籍《敏捷软件开发：原则、模式和实践》中，并作为我在《软件开发》杂志上发表的第一篇*匠人*文章。\n\
  \n我发现这个模块最迷人之处在于，曾有一段段时间，我们中的许多人会认为它是“文档完备”。现在我们将其视为一小团糟。看看你能发现多少种不同的注释问题。\n\n**列表\
  \ 4-7 `GeneratePrimes.java`**\n\n```java\n/**\n* 此类生成到用户指定的最大值的质数。\n* 使用的算法是埃拉托尼筛。\n\
  * <p>\n* 塞琉尼的埃拉托尼，公元前 276 年出生于利比亚塞琉尼——\n* 公元 194 年去世于亚历山大。他是第一个计算\n* 地球周长的人。还因研究带有闰年的历法而闻名，\n\
  并在亚历山大管理图书馆。\n* <p>\n* 该算法非常简单。给定一个从 2 开始的整数数组。\n* 划掉所有 2 的倍数。找到下一个\n* 未被划掉的整数，并划掉它所有的倍数。\n\
  * 重复此过程直到你超过了最大值的平方根。\n*\n* @author Alphonse\n* @version 13 Feb 2002 atp\n*/\nimport\
  \ java.util.*;\n\npublic class GeneratePrimes\n{\n/**\n* @param maxValue 是生成限制。\n\
  */\npublic static int[] generatePrimes(int maxValue)\n{\nif (maxValue >= 2) // 唯一的有效情况\n\
  {\n// 声明\nint s = maxValue + 1; // 数组大小\nboolean[] f = new boolean[s];\nint i;\n\
  // 初始化数组为 true。\nfor (i = 0; i < s; i++)\nf[i] = true;\n// 移除已知的非质数\nf[0] = f[1]\
  \ = false;\n// 筛选\nint j;\nfor (i = 2; i < Math.sqrt(s) + 1; i++)\n{\nif (f[i])\
  \ // 如果 i 未被划掉，则划掉它的倍数。\n{\nfor (j = 2 * i; j < s; j += i)\nf[j] = false; // 倍数不是质数\n\
  }\n}\n// 有多少个质数？\nint count = 0;\nfor (i = 0; i < s; i++)\n{\nif (f[i])\ncount++;\
  \ // 计数加。\n}\nint[] primes = new int[count];\n// 将质数移动到结果中\nfor (i = 0, j = 0; i\
  \ < s; i++)\n{\nif (f[i]) // 如果是质数\nprimes[j++] = i;\n}\nreturn primes; // 返回质数\n\
  }\nelse // maxValue < 2\nreturn new int[0]; // 如果输入无效返回空数组。\n}\n}\n```\n\n在列表 4-8\
  \ 中，你可以看到同一个模块的重构版本。注意注释的使用被显著限制了。整个模块只有两个注释。这两个注释上都是解释性的。\n\n**列表 4-8 `PrimeGenerator.java\
  \ (重构后)`**\n\n```java\n/**\n* 此类生成到用户指定的最大值的质数。\n* 使用的算法是埃拉托尼筛。\n* 给定一个从 2 开始的整数数组：\n\
  * 找到第一个未被划掉的整数，并划掉它所有的\n* 倍数。重复此过程直到数组中没有更多倍数。\n*/\npublic class PrimeGenerator\n\
  {\nprivate static boolean[] crossedOut;\nprivate static int[] result;\npublic static\
  \ int[] generatePrimes(int maxValue)\n{\nif (maxValue < 2)\nreturn new int[0];\n\
  else\n{\nuncrossIntegersUpTo(maxValue);\ncrossOutMultiples();\nputUncrossedIntegersIntoResult();\n\
  return result;\n}\n}\nprivate static void uncrossIntegersUpTo(int maxValue)\n{\n\
  crossedOut = new boolean[maxValue + 1];\nfor (int i = 2; i < crossedOut.length;\
  \ i++)\ncrossedOut[i] = false;\n}\nprivate static void crossOutMultiples()\n{\n\
  int limit = determineIterationLimit();\nfor (int i = 2; i <= limit; i++)\nif (notCrossed(i))\n\
  crossOutMultiplesOf(i);\n}\nprivate static int determineIterationLimit()\n{\n//\
  \ 数组中的每个倍数都有一个质因数\n// 小于或等于数组大小的根，\n// 所以我们不需要划掉大于该根号的数字的倍数。\ndouble iterationLimit\
  \ = Math.sqrt(crossedOut.length);\nreturn (int) iterationLimit;\n}\nprivate static\
  \ void crossOutMultiplesOf(int i)\n{\nfor (int multiple = 2 * i; multiple < crossedOut.length;\
  \ multiple += i)\ncrossedOut[multiple] = true;\n}\nprivate static boolean notCrossed(int\
  \ i)\n{\nreturn crossedOut[i] == false;\n}\nprivate static void putUncrossedIntegersIntoResult()\n\
  {\nresult = new int[numberOfgers()];\nfor (int i = 0, j = 0; i < crossedOut.length;\
  \ i++)\nif (crossedOut[i])\nresult[j++] = i;\n}\nprivate static int numberOfgers()\n\
  {\nint count = 0;\nfor (int i = 0; i < crossedOut.length; i++)\nif (crossedOut[i])\n\
  count++;\nreturn count;\n}\n}\n```\n\n我发现这个模块最迷人之处在于，曾有一段段时间，我们中的许多人会认为它是“文档完备”。现在我们将其视为一小团糟。看看你能发现多少种不同的注释问题。\n\
  \n\n\n让我们从垂直尺寸开始。源文件应该有多大呢？在 `Java` 中，文件的大小与类的大小密切相关。我们会在讨论类时再讨论类的大小。目前，我们只考虑文件大小。\n\
  \n大多数 `Java` 源文件有多大呢？事实证明，它们的大小范围非常大，而且风格上存在显著差异。图 5-1 显示了其中一些差异。\n\n图中描述了七不同的项目：`Junit`、`FitNesse`、`testNG`、`Time\
  \ and Money`、`JDepend`、`Ant` 和 `Tomcat`。穿过方框的线表示每个项目中文件的最小和最大长度。方框表示大约三分之一（一个标准差\
  \ ^(1)）的文件。方框的中间是平均值。因此，`FitNesse` 项目的平均文件大小约为 65 行，大约三分之一的文件在 40 到 100+ 行之间。`FitNesse`\
  \ 中最大的文件约为 400 行，最小的为 6 行。注意，这是一个对数尺度，因此垂直位置上的微小差异意味着绝对尺寸上的巨大差异。\n\n**图 5-1** 文件长度分布对数尺度（方框高度\
  \ = sigma）\n\n![Image](img/Image00025.jpg)\n\n`Junit`、`FitNesse` 和 `Time and Money`\
  \ 由较小的文件组成。没有一个超过 500 行，大多数文件少于 200 行。相反，`Tomcat` 和 `Ant` 有一些长几千行的文件，且接近一半的文件超过\
  \ 200 行。\n\n这对我们意味着什么？看起来可以使用通常为 200 行、上限为 500 行的文件构建大型系统（FitNesse 接近 50,000 行）。虽然这不应该是一条硬性规定，但被认为是非常理想的。小文件通常比大文件更容易理解。\n\
  \n### 报纸比喻\n\n想象一篇编写良好的报纸文章。你垂直地阅读它。在顶部，你期望看到标题，它会告诉你故事关于什么，并让你决定这是你想读的内容。第一段提供了整个故事的摘要，在隐藏所有细节的同时向你提供宽泛的概念。随着你向下阅读，细节不断增加，直到你拥有所有的日期、名称、引用、主张和其他细微末节。\n\
  \n我们希望源文件能像报纸文章一样。名称应该简单且具有解释性。名称本身应该足以让我们判断我们是否处于正确的模块中。源文件的最顶部部分应该提供高级概念和算法。随着我们向下移动，细节应该增加，直到最后我们在源文件中找到最低层次的函数和细节。\n\
