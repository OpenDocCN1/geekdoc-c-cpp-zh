  \ arg) {\n        return argsFound.contains(arg);\n    }\n\n    public boolean isValid()\
  \ {\n        return valid;\n    }\n}\n```\n\n### **所以我停止了**\n\n我至少还有两种参数类型要添加，而且我能感到这会让情况变得糟糕得多。如果我强行推进，也许可以让它们工作，但我会留下一个无法修复的烂摊子。如果这段代码的结构将来还可以维护，现在就是修复它的时候。\n\
  \n\n\n\n\n因此，我停止了添加功能，开始进行重构。在添加完 `String` 和 `integer` 参数后，我意识到每个参数类型都需要在三个主要位置编写新代码。首先，每种参数类型都需要某种方式来解析其\
  \ schema 元素，以便选择该类型的 `HashMap`。其次，每种参数类型都需要在命令行字符串中被解析并转换为其真实类型。最后，每种参数类型都需要一个 `getXXX`\
  \ 方法，以便将其作为真实类型返回给调用者。\n\n许多不同的类型，都具有相似的方法——在在我听起来，这就像一个类。于是，`ArgumentMarshaler`\
  \ 的概念诞生了。\n\n## 增量主义\n\n破坏一个程序最好的方法之一，就是以“改进”的名义对其结构进行巨大的改动。有些程序永远无法从这种“改进”中恢复。。问题在于，你很难让程序的运行方式与在“改进”之前保持一致。\n\
  \n## Args：草稿\n\n为了避免这种情况，我采用了测试驱动开发（TDD）的准则。这种方法的核心准则之一是保持系统始终处于运行状态。换句话说，使用 TDD，我不允许对系统进行任何破坏该系统的更改。我所做的每一个更改都必须保持系统运行方式与之前相同。\n\
  \n为了实现这一点，我需要一套自动化测试套件，我可以随地运行它，并验证系统行为没有改变。对于我创建的 `Args` 类，我在构建那堆“乱糟糟的代码”时创建了一套单元测试和验收测试。单元测试用\
  \ `Java` 编写，并由 `JUnit` 管理。验收测试则写在 `FitNesse` 的 wiki 页面中。我可以随地运行这些测试，如果它们通过了，我就有信心认为系统正按照我指定的逻辑运行。\n\
  \n于是，我开始进行大量微小的更改。每一次更改都让系统结构向 `ArgumentMarshaler` 概念靠拢。然而，每一次更改都保持了系统的正常运行。我做的第一个更改是在那堆混乱代码的末尾添加了\
  \ `ArgumentMarshaller` 的骨架（列表 14-11）。\n\n**列表 14-11 `追加到 Args.java 的 ArgumentMarshaller`**\n\
