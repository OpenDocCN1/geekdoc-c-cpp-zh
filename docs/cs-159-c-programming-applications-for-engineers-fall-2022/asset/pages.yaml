    # Types (of Data)

    ## What is determined by a data type?

    * The amount of memory necessary to store a value of a given type.

    * How a value of a given type is stored in the memory of the computer.

    * Which operations can be performed on the value. Some operations are restricted
    to particular data types.


    An integer (int) type is a number without a fraction part. C supports different
    sizes of the integer data type: short, int, long, and long long.

    * The type of integer you will use depends on the potential range of integer data
    you plan to store. The longer types will require more memory.


    | int range, -2147483648 to 2147483647 | Actual ranges will be system dependent.
    |


    A character (char) is any value that can be represented in the “alphabet” of the
    computer. Each character has a corresponding small integer value. This standard
    table of integer values alongside the equivalent characters is known as the ASCII
    table. You will find the ASCII table in Appendix A of the text.

    * Since a character is stored in memory as an integer representing the ASCII code
    of a character it is possible to perform arithmetic operations on characters!

    # Boolean (bool) values represent logical data (either true or false). Prior to
    the C99 standard of the C language only integers were used to represent truth
    values. The compiler currently used by the course does not recognize the bool
    data type by default.

    * For backward compatibility, nonzero numbers represent true and a zero value
    can be used to represent false.

    * We will not use the bool data type this semester, an integer value can be used
    in its place.'
