- pgno: 9
  md: '# Grading Expectations and Policies


    Our expectation of your lab instructor is that they grade your assignment in a
    timely manner and provides you with adequate feedback for improvement. If you
    feel this is not the case please address your concern to your instructor of the
    course. Typically, your grader should complete grading programming assignments
    4-6 days after it is due.


    To request a re-grade on any assignment you must make your request in writing
    the office hours of the instructor. You have five days to appeal any grade from
    the day the score of the assignment is posted to Brightspace. After that period
    the grades are frozen and no appeal will be considered. A re-grade is not a second
    chance to complete an assignment, neither is it a means to challenge assignment
    requirements, course policies, or programming and documentation standards.


    A re-grade request must include the following:


    +   1. A copy of the original graded assignment (if applicable).

    +   2. An attached reason why you believe a re-grade is warranted.


    # Important Assignment Guidelines


    All assignments must comply with the programming and documentation standards of
    the course. Programs that execute and meet minimum assignment requirements but
    are not logically correct or complete may be considered for partial credit. To
    receive full credit, your program must (1) produce correct results, (2) be well-designed,
    (3) make efficient use of the limited resources of the computer, (4) follow assignment
    requirements, and (5) adhere to course programming and documentation standards.


    An assignment that is not submitted as expected cannot be considered for a grade.
    Only work submitted correctly prior to the assignment deadline can be considered
    for grading. Late work is not accepted.


    Demand for resources and course staff will increase as an assignment deadline
    nears. Waiting until the last minute to work on your programming assignments is
    discouraged! Course policy is NOT to extend deadlines unless official course resources
    are unavailable for an extended period near the deadline for an assignment.


    You are responsible for understanding how to use the technology and tools utilized
    within the course.


    Planning to submit work early will allow sufficient time to seek assistance should
    you experience any difficulties or submitting an assignment.


    # Academic Integrity


    A very detailed set of criteria that is enforced rigorously related to academic
    integrity is applicable to CS 159. The consequences for violating course policies
    are serious both within the course and with the Office of the Dean of Students
    to determine whether you remain eligible to continue to study at Purdue University.


    You are encouraged to discuss any CS 159 topic including high-level ideas about
    how to approach an assignment. But, under no circumstances will exchange of, or
    shared access to, code via written or electronic means be permitted between teams
    for collaborative assignments or individuals for individual assignments.


    It is considered dishonest either to read another solution or to provide anyone
    with access to your work (or that of another student). Be mindful when working
    on code with others on individual assignments as this is discouraged. The work
    you submit must be your own original effort and not the result of unacceptable,
    even if unintentional, collaboration.


    Why enforce academic integrity? Academic integrity violations amount to theft.
    Theft of the work of the individual who developed the solution, theft of that
    individual''s time, and theft of the instructor''s time to conduct an inquiry
    into such matters. It amounts to theft from every student who has come to Purdue
    University, made a significant financial investment in their education, and has
    the expectation that their degree will be valued by employers and other academic
    institutions.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# When is it no longer acceptable to discuss an assignment with another student
    or someone not from my group?


    +   - Discussions with peers are most appropriate during the early phases of solution
    development. Once you begin to design and implement (write code) your solution
    you should be referencing course staff members exclusively for assistance.

    +   - Working closely with another student on a homework assignment may result
    in highly similar work due to collaboration. Collaboration may not have been the
    intended approach to solving the problem but the end result of working closely
    with others for extended periods of time.


    Every student is responsible for protecting their own work. Do not make the assumption
    that roommates, neighbors, significant others, or other “trusted” individuals
    would not take advantage of knowing your password, having access to your computer
    (use a password protected screen saver, log out when done), or taking a picture
    of your work when left on an unattended machine. You are responsible for such
    events that leave your work unprotected.


    Many free on-line compilers, collaborative editors, and file depositories will
    store your work and leave it publicly visible unless you pay for their upgraded
    services. Please understand the policies of any such service before you make use
    of them. See the note above regarding your responsibility to protect your work.


    Do not make the mistake of thinking that superficial changes in a program (such
    as altering comments, changing variable names, interchanging statements, or additional
    white spaces) will avoid detection. If you are unable to complete the work yourself,
    it is unlikely that you will succeed in disguising the work of another as your
    own. We are adamant that violations in any form will not be tolerated. Even the
    most trivial assignment is better not done than if you violate course integrity
    policies to complete it.


    As easy as it is to share an electronic copy of a file, to gain access to a file
    through account sharing, sharing a hard copy of your work, or seeking assistance
    from strangers on the Internet, it is as just as easy to analyze and detect such
    sharing as it results in similar efforts being submitted.


    Internet forums, including premium services that advertise assistance in college
    courses, are monitored by course staff members. Any relevant code found is included
    with student submissions to test for similarity. Searching for and using solutions
    to assignments, requesting assistance on assignments, and the posting of assignments
    in a venue such as these is a violation of course academic integrity policies
    and potentially violations of University copyright.


    Assume that every final submission you make during the semester will be analyzed
    by at least one software similarity service. These services will measure the percentage
    of similarity between your solution and those submitted by others in the course.
    Additionally, these services indicate the number of lines matched among submissions.
    You will be solving problems this semester that have no unique solution and your
    solution is expected to be uniquely yours. Concerns regarding any of our policies
    should be addressed during office hours prior to the deadline of an assignment.


    # Minimum consequences for violating course policies will include:


    +   - First offense, a zero for the assignment, a reduction of one letter grade
    at the end of the semester, AND a referral to the Office of the Dean of Students
    for disciplinary action.

    +   - Second offense, a zero for the assignment, a failing grade for the course,
    AND a referral to the Office of the Dean of Students for disciplinary action.


    # Notable exceptions to the first offense minimum consequences:


    +   - Any violation on an exam will result in a failing grade for the course and
    a Dean of Students referral.

    +   - Acts such as a misrepresentation of identity or location will result in
    a failing grade for the course and a Dean of Students referral.

    +   - Posting to, requesting from, or accessing solutions found on unapproved
    sources, particularly those found on-line, will result in a failing grade for
    the course and a Dean of Students referral.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Collaborative Learning/Teaming/Participating as a Member of a Technical Team


    Here are our expectations of you and your group:


    +   1. **Make time to meet with your group regularly.** There are 168 hours in
    a week, finding some common time for a group to meet should not be difficult.
    It is acceptable for just part of the group to meet some of the time if everyone
    cannot participate in every meeting. It is the responsibility of each individual
    to plan their contribution to the group effort accordingly.

    +      - A group may exclude the name of a member from the lab assignment as a
    means of indicating a lack of satisfactory contribution to the group effort.


    +   2. **Allow everyone an opportunity to express their ideas** on how to approach
    an assignment. One benefit of collaborative teaming is that everyone brings a
    different set of skills to the group and the resulting effort often is a stronger
    one than if it was completed individually.

    +      - When a group member becomes unresponsive to requests to meet or fails
    to update the other members of the group then those contributing members must
    prepare to continue without the unresponsive member.


    +   3. **All group members must be satisfied with the final submission.** It is
    not acceptable for a group to submit an assignment that is not approved by all
    group members. “It is good enough” may be true for you but it is unfair for the
    others in the group who aspire for the highest grade possible.

    +      - Likewise, each group member must be satisfied with their contribution
    to the group effort.


    +   4. **Each group member must fully understand the entire assignment submitted.**
    Do not start your group meetings by trying to delegate the tasks to the different
    group members. Everyone must understand and contribute to every aspect of the
    assignment and its development.

    +      - Assignments are an opportunity for you to demonstrate your knowledge
    of the programming concepts being utilized. Use assignments to serve as a measure
    of what you don’t know and how to focus your future efforts.


    +   5. **Designate who will turn in the assignment, when it will be turned in,
    and how successful submission will be communicated with the rest of the group.**
    Only one person from the group will submit the assignment. Set a goal to submit
    the assignment well in advance of the due date to avoid any last minute problems.


    +   6. **You will work with the group assigned.** Please contact us with concerns
    you may have with your group. Take a professional approach with your group experience
    as similar to what you may experience at an internship or co-op experience.

    +      - Groups will be re-assigned after every four labs.

    +      - Future group assignments may take into consideration lecture attendance
    and assignment completion as an indicator of your interest in participating in
    the course. Active students in the course should not be burdened with partners
    who are not willing to stay current with course content.


    # Nondiscrimination Statement


    Purdue University is committed to maintaining a community which recognizes and
    values the inherent worth and dignity of every person; fosters tolerance, sensitivity,
    understanding, and mutual respect among its members; and encourages each individual
    to strive to reach his or her own potential. In pursuit of its goal of academic
    excellence, the University seeks to develop and nurture diversity. The University
    believes that diversity among its many members strengthens the institution, stimulates
    creativity, promotes the exchange of ideas, and enriches campus life.


    # Students with Disabilities


    Purdue University strives to make learning experiences as accessible as possible.
    If you anticipate or experience physical or academic barriers based on disability,
    you are welcome to inform your instructor to discuss options. You are also encouraged
    to contact the Disability Resource Center at: drc@purdue.edu or by phone: 765-494-1247.


    Students with an existing letter of accommodation are to refer that letter to
    their instructor and follow up with an e-mail to initiate a conversation regarding
    how your accommodations may be implemented in the course.'
