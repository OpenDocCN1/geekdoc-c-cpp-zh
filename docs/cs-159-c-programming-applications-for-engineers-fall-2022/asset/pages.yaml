  md: 'For example, x = x + 3;


    * Consider what is happening above in terms of memory. On the right we retrieve
    the value of x from memory and add three to it and then store the sum back in
    to the memory location represented by x.


    The compound assignment example:


    * x += 3; // SAME AS x = x + 3;


    | Compound Assignment Expression | Equivalent Simple Assignment Expression |

    | :--- | :--- |

    | x += expression | x = x + expression |

    | x -= expression | x = x - expression |

    | x *= expression | x = x * expression |

    | x /= expression | x = x / expression |

    | x %= expression | x = x % expression |


    # Example:


    ```

    int x = 3;

