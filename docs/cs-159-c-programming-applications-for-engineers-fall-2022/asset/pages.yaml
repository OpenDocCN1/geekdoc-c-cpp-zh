  md: "# Symbolic/Defined Constants\n\n+   - THE SELECTION OF IDENTIFIERS FOR SYMBOLIC/DEFINED\
    \ CONSTANTS MUST BE IN ALL CAPS. This standard allows any programmer to differentiate\
    \ between a variable, a function call, and a constant that commonly occur as operands\
    \ in an expression.\n+   - Define all symbolic/defined constants at the top of\
    \ your program immediately following the assignment header.\n+   - Because the\
    \ use of symbolic/defined constants can improve the documentation of a program\
    \ it is a standard of the course that you attempt to **maximize** your use of\
    \ symbolic/defined constants and **minimize** your use of literal constants (see\
    \ chapter 3).\n\n# Commenting\n\nIn the C programming language we have two possible\
    \ implementations of comments:\n\n+   - The single line comment // that will instruct\
    \ the compiler to ignore everything after // to the end of the line.\n+   - The\
    \ multi-line comment /* */ that will instruct the compiler to ignore everything\
    \ between the /* and */. See the headers above for an example of this type of\
    \ comment. Multi-line comments cannot be nested in the C programming language.\n\
    \n# What must be commented?\n\n+   - EVERY variable that you declare must have\
    \ a brief comment to describe its purpose in the program!\n+     - Comment variables\
    \ to the right of where they are declared in the local declaration section of\
    \ a function.\n+   - Within a given function it is expected that the occasional\
    \ complex segment of code be documented in order to inform others regarding that\
    \ logic you are attempting to implement.\n+     - For example: It is recommended\
    \ that you place a line or two of comments before any significant selection or\
    \ repetition construct.\n\n# Indenting\n\nYou must indent all code inside the\
    \ body of a structure **two (additional) spaces**! Rarely should you ever begin\
    \ a line of code in the first column of your editor! Here are some common structures\
    \ properly indented according to our standards:\n\n| for(x = 1; x <= MAX; x++)\
    \ {\n  printf(\"%d\", x);\n} | if (y == 3) {\n  for(g = 0; g > MIN; g--) {\n \
    \   y = y - g;\n  }\n} | do {\n  e = m * c * c;\n  avg = sum/number;\n}while(r\
    \ == 0); |\n\n# More Indenting Examples:\n\n| Correct | Incorrect | Also Incorrect\
    \ |\n|---|---|---|\n| if(x == 3 || y == 2) {\n  z++;\n  a = a - 1;\n} | if(x ==\
    \ 3 || y == 2) {\nz++;\na = a - 1;\n} | if(x == 3 || y == 2) {\nz++;\na = a -\
    \ 1;\n} |\n\nSwitch constructs will be indented as seen in the C text - See page\
    \ 258."
