- pgno: 15
  md: '# Documentation, Programming, and Course Standards


    # Grading Standards


    Every assignment will attempt to provide sufficient detail on all requirements.
    However, because the problems solved in this class have no unique solution, we
    will rely on the general guidelines listed below when determining the appropriate
    evaluation of your work.


    You will always be evaluated on the following aspects of your assignments:


    +   1. Following provided assignment requirements.

    +   2. Developing the appropriate logic to solve the problem, accepting input
    in the order expected, and producing expected output.

    +   3. Implementation of good programming practices.

    +   4. Your solution should be efficiently designed to make good use of the limited
    resources of the computer.

    +   5. Abiding by course documentation standards.


    Aspects of your submission other than the generation of correct output are important
    and can result in a loss of significant points on an assignment.


    # Documentation Standards


    The requirement of good documentation practices is universal among technical professionals;
    the primary motivation of having documentation standards is to make your code,
    which ultimately represents your logic, as easy to understand and for your grader
    to evaluate as possible. The solutions you are in the process of developing must
    be easily interpreted when seeking assistance both in this class and from your
    colleagues, supervisors, and clients in the future.


    These standards are not merely recommendations they are required for the course
    and failure to comply will result in a loss of points.


    +   - The course notes and examples in lecture will attempt to abide by these
    standards as closely as possible to serve as an example. However, to save space
    in the notes and time during lecture, headers and comments may be excluded; this
    is not an option for your assignments.

    +   - Various references, including the required textbook, do not abide by all
    of our standards; please refer to this document for clarification.


    Points on an assignment will be deducted if your code and/or logic is difficult
    for your lab instructor to evaluate because it fails to meet the expectations
    outlined in this document.


    Is there real world relevance for programming standards? Most companies have extensive
    documentation requirements in order to facilitate the transfer of previously developed
    code from one employee to another without the need to invest a great deal of time
    in the effort necessary to comprehend the work of the original developer.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Assignment Headers


    +   - Assignment headers are used in the course to provide a detailed description
    of the logic being implemented in a program or user-defined function.

    +   - There are three total headers we will use this semester. One for labs, one
    for homework, and another for user-defined functions.

    +   - The use of a header MUST NOT interfere with the compilation, execution,
    or submission of your program.


    # Lab Assignment Header


    ```

    /********+-*-*--********-***-*****--*--****--***************-**************

    *

    * Lab #:

    *

    * Academic Integrity Statement:

    *

    * We have not used source code obtained from any other unauthorized source,

    * either modified or unmodified. Neither have we provided access to our code

    * to another. The effort we are submitting is our own original work.

    *

    * Program Description:

    *

    ********+-*-*--********-***-*****--*--****--***************-**************/

    ```


    +   - You must insert the lab assignment header using vi’s :hlb command inside
    Vocareum.

    +   - After each successful submission of a lab assignment, all members of the
    Vocareum team will receive a confirmation e-mail


    # Homework Assignment Header


    ```

    /********+-*-*--********-***-*****--*--****--***************-**************

    *

    * Homework #:

    *

    * Academic Integrity Statement:

    *

