  md: "# Pointer Arithmetic and Arrays (Single Dimension Arrays only)\n\nWhat takes\
    \ place when you attempt to add an integer to an address? The result of arithmetic\
    \ can be used to access and change elements of an array.\n\n```\nvoid changeArray(int\
    \ *y)\n{\n   int i;\n   temp = *y;\n\n   for(i = 1; i < SIZE; i++)\n   {\n   \
    \   *(y + i - 1) = *(y + i);\n   }\n\n   *(y + i - 1) = temp;\n}\n```\n\n```\n\
    #define SIZE 5\n\nvoid printArray(int *);\nvoid changeArray(int *);\n\nint main(void)\n\
    {\n   int x[SIZE] = {3, 5, 7, 9, 10};\n\n   changeArray(x);\n   printArray(x);\n\
    \n   return(0);\n}\n\nvoid printArray(int *y)\n{\n   int i;\n\n   for(i = 0; i\
    \ < SIZE; i++)\n      printf(\"%d\\n\", *(y + i));\n}\n```\n\n```\nOutput Generated:\n\
