    # Error Discussion


    We try not to be able to cover every specific error you may encounter during the
    term, but we will place errors in various categories today and try to mention
    common errors as we work our way through new topics. The goal of this short section
    is to help you better understand the error you are trying to resolve and to communicate
    that with another who may be attempting to provide assistance.


    +   Classification of errors:

    +   1. Syntax error

    +   2. Logical error

    +   Try to answer the following questions whenever you encounter an error:

    +   1. When does the error arise?

    +   2. What did you observe about the error?


    # The syntax error


    You will be made aware of a syntax error when you attempt to compile your C code.
    It may also be said that the syntax error is a compile-time error. Typically,
    this error arises due to a mistake you made that violates the syntax rules of
    the C programming language causing the compiler to stop is work.


    +   * Common syntax errors include misplacing a semicolon, failing to pair all
    quotes, and other typos.

    +   * A warning is feedback provided by the compiler that you have potentially
    made a mistake. All warnings should be remedied before you submit an assignment.
    If you have set up your account correctly you will be compiling utilizing the
    warnings option. Without this option active, or by making use of an alternative
    compiler, you may not be made aware of any warnings.


    # Creation of Executable Files


    A new executable file (a.out) will not be created when the compiler must terminate
    its work due to a syntax error. The keyword here is error and it is commonly included
    as part of the messages created by the compiler. If the compiler reports only
    warnings then it is likely that a new executable file (a.out) will be created.
    When issuing a warning the compiler has detected a potential misuse of the syntax
    which will often appear as a logical error when the program executes.


    # Example Warning Message:


    ```

    test.c: In function ''main'':

    test.c:10: warning: ''ct'' is used uninitialized in this function

    ```'
