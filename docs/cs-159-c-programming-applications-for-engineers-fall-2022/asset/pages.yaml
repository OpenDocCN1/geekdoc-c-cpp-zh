- pgno: 140
  md: '# Chapter 6 - Repetition


    The real power of computers is the ability to rapidly repeat an operation or series
    of operations. The act of such repetition is commonly referred to as looping but
    this term does not incorporate all techniques of repetition.


    # Looping Basics and Terminology


    +   - If this diagram represents the logic of a loop then you might be wondering
    when, how, or if this process stops?


    ![](img/e25602f5611b32eaf448a241a988eedc_140_0.png)


    # First, a few terms:


    +   - loop - One of two possible techniques of repetition, utilizes a construct
    to repeat designated statements under a predetermined set of conditions.

    +   - loop iteration - One execution of the instructions inside the body of the
    loop construct.

    +   - loop control expression - The logical expression to determine whether the
    loop should initiate another iteration.

    +   - loop initialization - Preparation work to be completed before the first
    evaluation of the loop control expression.

    +   - loop update - An executable statement found inside the body of the loop
    that when executed a sufficient number of times will lead to a change in the evaluation
    of the loop control expression.

    +   - loop control variable - The variable that is initialized, part of the loop
    control expression, and the recipient of the update action.'
  merge: -1
  img_proc: true
