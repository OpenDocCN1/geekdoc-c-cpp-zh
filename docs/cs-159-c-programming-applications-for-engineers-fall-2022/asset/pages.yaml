    What does this tell you about the operator precedence of /= and + ?


    The addition operator has precedence over the compound assignment operations.


    # Prefix & Post-fix Operators


    • Within many programs there is a need to count and this is often done in increments
    of +1 or -1. These two notations, prefix and post-fix, provide a shorter alternative
    to the simple or compound equivalents but can also be combined with other expressions
    and it is there where we find that the position of the operators with respect
    to the operand makes a difference.


    # A post-fix expression involves one operand followed by the operator.


    ```

    int x = 0;

    x++; //POSTFIX INCREMENT

    printf("The value of x is: %d\n", x);

    x--; //POSTFIX DECREMENT

    printf("The value of x is %d\n", x);

    ```


    # A prefix expression involves the operator followed by the operand.


    ```

    int x = 0;

    ++x; //PREFIX INCREMENT

    printf("The value of x is: %d\n", x);

    --x; //PREFIX DECREMENT

    printf("The value of x is %d\n", x);

    ```'
