  md: "# Nested Selection\n\nThe if/else can contain any executable statement, including\
    \ another if/else construct. When this occurs we call it nested selection. Often,\
    \ nested selection involves the comparison of two or more different variables.\n\
    \n# Logical Flow of Nested Selection:\n\n![](img/e25602f5611b32eaf448a241a988eedc_130_0.png)\n\
    \n# Code example of nested selection:\n\n```\n```c\nint calcStatus(float gpa,\
    \ int credit_hrs)\n{\n    int status;\n    if (credit_hrs > 120)\n    {\n    \
    \    if (gpa >= 3.50)\n        {\n            status = HONORS;\n        }\n  \
    \      else\n        {\n            status = CANDIDATE;\n        }\n    }\n  \
    \  else\n    {\n        status = NONCANDIDATE;\n    }\n    return(status);\n}\n\
    ```\n```\n\n# Dangling Else Logical Error and Nested if/else\n\n+   - Debugging\
    \ Concern: Please note that the text and many other sources will not always use\
    \ { } with if/else statements that contain only a single statement in their body.\
    \ However, this can lead to a difficult logical problem known as the \"dangling\
    \ else\".\n+   - Because this problem can be so difficult to debug, we will require\
    \ ALL if/else statements to use { } even if the body contains only a single executable\
    \ statement."
