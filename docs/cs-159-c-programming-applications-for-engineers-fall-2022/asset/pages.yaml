    \ contents of strings that ANY value entered would lead to the equal statement\
    \ being printed every time the previous code segment is executed.\nWhat is output?\
    \ None.\nWhat does that tell us about what is being compared when using relational\
    \ or equality operators with two strings?\nThe comparison using the equality operator\
    \ is testing memory addresses and not the string data.\n\n# Alternative - using\
    \ the string.h function strcmp\n\nThis third function from the string.h library\
    \ will accept two strings as parameters and will return an integer indicating\
    \ how the two strings are different. Two strings storing the same data have no\
    \ difference.\n\n| Example | Explanation |\n|---|---|\n| Enter your string ->\
    \ company\\nEnter your string -> corporate\\nCompare result: -5 | In the first\
    \ example it is the third element where the first difference is found. This difference\
    \ value is returned from the strcmp function. The element of the second parameter\
