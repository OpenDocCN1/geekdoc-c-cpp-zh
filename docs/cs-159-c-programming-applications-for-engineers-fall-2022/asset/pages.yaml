  md: "+   A string is a series of characters with the capability to be treated as\
    \ a single unit.\n\nThe C programming language does not have a string data type\
    \ but attempts to provide some capacity to work with string data through the use\
    \ of character arrays.\n\nSimilar to numeric arrays we can declare a string to\
    \ be of any predetermined size. A problem common to character arrays involves\
    \ the number of elements necessary for the string data can vary during the execution\
    \ of the program. For example, a given character array may have a capacity of\
    \ 20 elements and initially stores “Computer” with that data being replaced later\
    \ with “Science”. How do we, and the functions that we use with string data, know\
    \ where the data ends and the unused portion of the array begins?\n\nWe are able\
    \ to identify where the data in a character array ends through the use of a character\
    \ known as a delimiter. This delimiter character ‘\\0’ represents the end of the\
    \ data within a character array. This will be important to many functions that\
    \ operate with strings.\n\n+   Strings in the C programming language are variable-length\
    \ and delimited strings.\n\n+   What is variable-length? The amount of data found\
    \ in the array at a given time.\n\n+   What does it mean to be delimited? A character\
    \ is inserted into the array to separate the data from the unused portion of the\
    \ array.\n\n# Declaring Strings and Accessing String Elements\n\n+   We are able\
    \ to access each individual elements of a character array in a manner similar\
    \ to that of numeric arrays.\n\n```\nExamining the elements of a character array:\n\
    \nint lev;\nchar str[11] = \"Good Day\";\n\nfor (lev = 0; lev < 11; lev++)\n{\n\
    \    printf(\"str[%2d] = %3c %5d\\n, lev, str[lev], str[lev]);\n}\n\nprintf(\"\
    \\n\");\n```\n\n```\nOutput:\nstr[ 0] = G   71\nstr[ 1] = o  111\nstr[ 2] = o\
    \  111\nstr[ 3] =   100\nstr[ 4] = D   32\nstr[ 5] = a   68\nstr[ 6] = y   97\n\
    str[ 7] =   121\nstr[ 8] = 0   32\nstr[ 9] = 0   0\nstr[10] = 0   0\n```\n\n+\
    \   Where is the delimiter? Is it there? Yes! The ASCII value of the delimiter\
    \ is zero and is found properly placed at index 8. The initialization statement\
    \ will add the delimiter to the end of the character array.\n\n+   What is in\
    \ the remaining unused elements (at index 9 and 10) of the character array?\n\n\
    +   Because we initialized the array above the remaining elements are filled with\
    \ zeros."
