    > Warning: In the C programming language, if a single variable is modified more
    than once in an expression, the result is undefined.


    # Mixed and Single Data Type Expressions


    We have seen examples already of expression evaluations that produce results other
    than what we expect if we were in mathematics (or using a calculator, Excel, or
    MATLAB).


    ```

    3 / 2 = 1

    ```


    +   The above example is another one of those situations! What happens here in
    C programming is that the division of two integer values must result in another
    integer!


    However, if we mix the types as seen the statement below the remainder is preserved
    in the sum.


    ```

    3 + 2.1 = 5.1

    ```


    The mixed type expression in the previous example will implicitly convert the
    integer 3 to a floating-point 3.0 such that the expression is evaluated as if
    two floating-point values were present. Do you see any problem converting 3 to
    3.0 before it is added to 2.1?


    +   No, there is no potential loss of data and the implicit conversion is referred
    to as safe.'
