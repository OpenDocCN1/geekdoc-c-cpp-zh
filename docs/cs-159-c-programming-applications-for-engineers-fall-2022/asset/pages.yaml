    | Expression | Evaluation |

    |---|---|

    | 3 / (float) 2 | |

    | (float) 3 / (float) 2 | |

    | (float) (3 / 2) | |


    What do the results of the expressions above say about the precedence of the explicit
    type conversion?


    # Another Math Review: Rounding of numbers is a common task in problem solving.
    You must keep in mind the rules regarding rounding as we program this semester
    or better yet be able to conduct various tests to identify how rounding is taking
    place with your values.


    +   - Sometimes an “extreme” form of rounding takes place called truncation. Truncation
    is removing of the entire decimal value and giving no consideration to rounding
    of the integer that remains.

    +   - The floor function (found in math.h, but also a commonly used function in
    MATLAB and Excel) will remove a remainder and reduce the number to the next smaller
    integer value. Note how its behavior is similar to that of the conversion of float
