    The %s placeholder represents a string and is used in both familiar input and
    output functions.


    # Example of %s placeholder in action:


    ```

    ```c

    char str1[SIZE];

    printf("Enter a string -> ");

    scanf("%s", str1); //NOTICE NO &, WHY IS THIS?!

