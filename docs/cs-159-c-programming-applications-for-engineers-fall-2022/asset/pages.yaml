- pgno: 143
  md: 'In a pretest loop, the loop control expression must be true prior to iterating
    the loop one time. Prior to the start of each iteration, including the first,
    the loop control expression is evaluated and while that expression remains true
    the repetition continues. If the loop control expression is false then no further
    iterations will be conducted.


    Key Point: The minimum number of times the body of a pretest loop will be iterated
    is zero. If the expression is never true, then the loop instructions (body of
    the loop) will never be executed.


    In a post-test loop the instructions of the body of the loop will be executed
    prior to the evaluation of the loop control expression. The loop control expression
    will be evaluated at the end of each iteration to determine whether or not to
    continue with another iteration.


    +   - What is the big difference? The minimum number of times the body of a post-test
    loop will be iterated is one. Regardless if the expression is false the loop will
    iterate once and then test the condition to determine whether iteration continues.


    # Selecting the Wrong Construct


    What signs might indicate that you selected the wrong type of loop, pretest or
    post-test, for a solution? (1) Logic repeated both inside and outside of the body
    of the loop. (2) A “trick” is used to force the loop to iterate at least one time.
    These options might look familiar if you have worked with a language in which
    both pretest and post-test options are not available (MATLAB).'
  merge: -1
