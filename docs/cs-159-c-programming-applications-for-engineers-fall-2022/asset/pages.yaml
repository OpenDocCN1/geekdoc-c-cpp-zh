- pgno: 119
  md: '# # Introduction to Problem Solving Method


    +   1. Specify what is desired of the program.

    +      - In an introductory programming course the specifications are given to
    you by the instructor assigning the problem.

    +      - In the real world you would meet with fellow engineers, scientists, supervisors,
    and/or clients to determine how and what the software must successfully accomplish.

    +      - Recommendation: Get experience working in this area before you graduate
    from college. Try programs such as EPICS, ENTR, and professional experiences.


    +   2. Analyze the problem.

    +      - Factor the tasks as specified by top-down design making use of tools
    such as structure charts.

    +      - This step requires the development of the mathematical formulas necessary
    to solve the problem. Some formulas are very common such as determining the slope
    of a line, the distance between two points, the length of the hypotenuse of a
    right triangle, but other formulas are advanced and specific to your engineering
    or scientific discipline.

    +      - Once you have determined the arithmetic expressions necessary to solve
    the problem, be mindful to consider potential errors that may arise. Examples
    include dividing by zero or dealing with negative values where such is impossible
    (number of people, certain measures of distance and time). Through planning you
    begin to work out potential errors in your logic.


    +   3. Design the software solution.

    +      - The flow chart or pseudo-code representation of the algorithm is developed
    at this point in the process. Both flowcharting and pseudo-coding are techniques
    you can use to design your algorithm to solve the problem at hand.

    +      - Application: When working with teams be sure to represent your logic
    visually so others can comprehend your thinking as you present an idea for a solution.

    +      - As our ability to solve problems becomes more advanced be sure to design
    the solution to each task individually. When you have all of the tasks designed
    the work of implementing those tasks to create a final solution is much easier.


    +   4. Translate the design into code.

    +      - Code only small portions of the solution, usually a single function at
    a time.

    +      - Test each and every change you make!

    +      - Never write an entire program prior to compiling and testing for the
    first time!

    +      - Benefit: Investing time in the previous steps in the process can really
    make this step: (1) shorter in terms of time and (2) a lot less frustrating.


    +   5. Test and debug the implementation.

    +      - When testing, be sure to develop test cases and expected output that
    go beyond those provided on the assignment.

    +      - What tests have you run to ensure that your program handles all reasonable
    input?

    +      - General cases, boundary cases, extreme/stress cases.


    +   6. Refinement of the solution.

    +      - Congratulations, you have a solution! Now, review your solution and make
    sure it is efficient, well-designed, meets all requirements, produces no warnings
    or syntax errors, and satisfies all course documentation and programming standards.

    +      - Your first solution is rarely the best solution. Make every effort to
    refine your algorithm so that it makes the best possible use of the limited resources
    of the computer.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Structured Programming – What is it?


    There are three fundamental ideas in structured programming: selection, repetition,
    and sequence.


    +   - Sequence was the topic of chapter 4 (user-defined functions). The use of
    functions permit the individual instructions of a program to be executed in an
    order other than first statement the last statement and some statements may be
    executed more than once.

    +   - Selection is the topic of chapter 5. Selection constructs will allow instructions
    to be executed based on a given criteria and other instructions to be excluded.
    This is the first point in the semester where not all code in a program may be
    executed in each test case.

    +   - Repetition is the topic of chapter 6. Often a set of instructions needs
    to be repeated while a particular condition is met, or until a condition is met.
    Repetition constructs allow the use of logic to specify conditions and to identify
    those instructions to repeat.


    # Chapter 5 – Selection


    While functions permit us to make modular code and shift control (alter sequence
    of code executed) between functions to accomplish individual tasks, what we need
    next are the abilities to select and repeat code. It is selection that is the
    topic of chapter 5.


    Up to point in the course we have always observed all statements in a program
    being executed at least one time.


    +   - While user-defined functions allow us to alter the sequence at this point
    in the course when we make a function call all of the code in that function is
    executed.

    +   - The idea of selection involves selecting code to execute or exclude based
    on a condition.


    # Logical Data


    A piece of data is called logical if it conveys the value of true or false. Logical
    data is generated by a logical expression. Logical expressions are utilized in
    both selection and repetition constructs. The C programming language did not traditionally
    have a data type specifically for logical data and instead would utilize a numeric
    type to represent true and false.


    > Note: We often use 1 to represent a true value, however, ANY non-zero value
    is considered true.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Logical Operators


    There are three main logical operators. Operands to logical operators are considered
    for their logical status (true or false).


    | Operator | Character(s) | Description | Precedence |

    |---|---|---|---|

    | NOT | ! | Unary operator that changes a true value to false and a false value
    to true. | |

    | AND | && | Binary operator that is true only when both of its operands are true
    and is false in all other cases. | |

    | OR | || | Binary operator that is false only when both of its operands are false
    and is true in all other cases. | |


    # Logical Operators Truth Table:


    | | not | | and | | | or | | |

    |---|---|---|---|---|---|---|---|---|---|

    | | x | !x | x | y | x && y | x | y | x || y |

    | TRUE | TRUE | FALSE | TRUE | TRUE | TRUE | TRUE | TRUE | TRUE |

    | FALSE | FALSE | TRUE | TRUE | FALSE | FALSE | TRUE | FALSE | TRUE |

    | | | | FALSE | TRUE | FALSE | FALSE | TRUE | FALSE |

    | | | | FALSE | FALSE | FALSE | FALSE | FALSE | FALSE |


    # Evaluating Logical Expressions


    +   - That is, evaluating expressions that contain logical operators.

    +   - When evaluating mathematical expressions it would be the rare exception
    that you would not consider every operator.

    +   - How can we evaluate an expression prior to evaluating every operator of
    the expression? With logical expressions there are only two possible results and
    we will see that when the result of the expression can be determined the evaluation
    will stop, or short-circuit, prior to evaluating every operator when doing so
    is unnecessary.'
  merge: -1
  img_proc: true
