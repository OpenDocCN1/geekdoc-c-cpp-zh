- pgno: 148
  md: "# # Why don't we use an \"if loop\" for input validation?\n\n+   - An if construct\
    \ would only permit the user a second opportunity to enter acceptable data. We\
    \ want the user to have an unlimited number of opportunities to enter valid data.\n\
