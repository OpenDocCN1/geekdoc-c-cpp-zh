    Problem: Implement the ROT13 encryption algorithm. ROT13 is not really an encryption
    algorithm but processing text through this method does make it challenging to
    read. To those characters in the first half of the alphabet we add 13 to rotate
    them into the second half. And from those characters in the second half of the
    alphabet we subtract 13 to rotate them into the first half. Characters that are
    not alpha characters will not be changed in the process. It is important to note
    that the process of encryption is the same as decryption.


