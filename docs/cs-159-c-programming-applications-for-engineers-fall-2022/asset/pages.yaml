  md: '# Repetition Flowchart Example #1:


    Write an algorithm to calculate the average, maximum, and minimum of an unknown
    number of exam scores. The scores on the test can range from 0 – 100 and will
    all be integer values.


    # Repetition


    +   - To complete this problem we need the ability to repeat a number of instructions.

    +   - Repetition permits us to identify a segment of code to be repeated while
    a given logical expression is true.


    # Step #1 – What is specified of the program?


    +   - Input – Integers between 0 and 100, inclusive of the end points, until a
    value is entered to signify the end of input.

    +   - We do not need an array (subject of chapter 8) to store the entire data
    set in the memory of the computer. The memory necessary to solve this problem
    will not be dependent on the size of the data set (number of students taking the
    exam).

    +   - Output – Average (floating-point), maximum (integer), and minimum (integer)
    values.


    # Step #2 – Analyze the problem


    +   - What formulas are needed? To calculate the average we need to know the sum
    of all scores and the number of scores. We will have to compare values as they
    are entered to determine their status as the maximum or minimum value.

    +   - We also need to determine how the user will indicate that the input has
    ended.


    # How to approach the terminating input condition?


    +   1. Ask the user to count the exams.

    +   2. Ask the user to input after each value whether they have more scores to
    enter.

    +   3. Ask the user to input a value outside of the range of exam scores when
