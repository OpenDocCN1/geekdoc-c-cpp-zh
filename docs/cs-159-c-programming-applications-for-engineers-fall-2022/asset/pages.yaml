    \ ( )\n{\n    while ( )\n    {\n    }\n}\n```\n\n```\nNested if construct example:\n\
    if ( )\n{\n    if ( )\n    {\n    }\n}\n```\n\nIn the nested loop example provided\
    \ on the previous page the loops are found in two different user-defined functions.\
    \ One is in the main function that counts from the starting point to the ending\
    \ point and the second is found in the function that calculates the factorial\
    \ for each integer in the desired range.\n\nEvery loop typically represents a\
    \ task, or single process, in a program. If you can identify each of these individual\
    \ tasks and factor them into individual user-defined functions you may find the\
    \ complex problem easier to solve and test.\n\n# The Infinite Loop\n\nThe infinite\
    \ loop is a logical error in which the condition of the loop control expression\
    \ will never be false. As a logical error the form in which infinite loops may\
    \ appear while the program is running can vary. One sure sign of an infinite loop\
    \ is the production of infinite output. However, the error can appear in forms\
    \ in which little or no output is generated.\n\n+   You can terminate a program\
    \ at any time by entering CTRL-C from the keyboard.\n\nExample: Allow the user\
    \ to enter integer values until a 1 or 2 is input.\n\n```\nint getInteger(void)\n\
    {\n    int num;\n    do\n    {\n        printf(\"Enter 1 or 2 -> \");\n      \
    \  scanf(\"%d\", &num);\n    }while(num != 1 || num != 2);\n    return(num);\n\
    }\n```\n\n```\nOutput:\nEnter 1 or 2 -> 3\nEnter 1 or 2 -> 2\nEnter 1 or 2 ->\
    \ 1\nEnter 1 or 2 ->\n```\n\nThe control expression may seem logically correct,\
    \ \"accept input while the value entered is not 1 or 2\", but logically it results\
    \ in an infinite loop. There is no single value that cannot be both not 1 and\
    \ not 2 at the same time."
