  md: "# Multi-way Selection switch\n\nA switch construct is used to make a selection\
    \ among possible integer value alternatives. The switch may be favored when the\
    \ possible integer values are well known and few in number.\n\nThe control expression\
    \ that follows the keyword switch is evaluated and then compared with a series\
    \ of cases for equality. Each case represents an expected value of the control\
    \ expression.\n\n+   - Associated with each case is one or more executable statements.\n\
    +   - There should exist one or more possible cases. You should consider an if/else\
    \ if when the number of cases is large or represent a range of values.\n+   -\
    \ A default case is an option to cover all values not represented by the other\
    \ individual cases.\n\n# Note: Each case is compared with the value of the control\
    \ expression for equality.\n\n```\nvoid displayResults(char grade, int score)\n\
    {\n   printf(\"Given score of %d, you will earn a grade of %c in this course.\\\
    n\", score, grade);\n   switch(grade)\n   {\n      case 'A':\n         printf(\"\
    Great job!!\\n\");\n         break;\n      case 'B':\n         printf(\"Well done!\\\
    n\");\n         break;\n      case 'C':\n         printf(\"Mission Accomplished.\\\
    n\");\n         break;\n      case 'D':\n         printf(\"Perhaps you need to\
    \ consider repeating?\\n\");\n         break;\n      default:\n         printf(\"\
    See you next semester?\\n\");\n   }\n}\n```"
