- pgno: 128
  md: "# Two-Way Selection\n\n+   - Logical expressions evaluate to either a true\
    \ or false value.\n+   - If the resulting logical value is true we have one path\
    \ to travel, but if the result is false we will execute alternative (and unique)\
    \ statements found down a second path.\n+   - Two selection constructs are available\
    \ for two-way selection in C programming: if/else and the conditional expression.\n\
    \n# if / else\n\nThe if/else construct, or a very similar variation, exists in\
    \ about every programming language. The idea is that a logical expression is evaluated\
    \ with one set of statements to be executed when the logical expression is true\
    \ and an alternative set of statements to be executed when it is false.\n\n# Diagram\
    \ of Two-Way Logic:\n\n```\nif (logical expression)\n{\n    //TRUE ACTIONS TO\
    \ EXECUTE\n}\nelse\n{\n    //FALSE ACTIONS TO EXECUTE\n}\n```\n\nIf the first\
    \ condition (logical expression) listed is evaluated to be true the statements\
    \ found in the body of the if will be executed, otherwise execute the statements\
    \ found in the body of the else."
  merge: -1
  img_proc: true
