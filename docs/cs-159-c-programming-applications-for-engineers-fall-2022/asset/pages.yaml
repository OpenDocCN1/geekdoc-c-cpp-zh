    Original String: %s\\n\", str1);\n    rot13(str1);\n    printf(\"Rotated String:\
    \ %s\\n\", str1);\n    printf(\"Original String: %s\\n\", str1);\n    return(0);\n\
    }\n```\n\n```\nvoid rot13(char x[])\n{\n    int lcv;\n    for(lcv = 0; lcv < strlen(x);\
    \ lcv++)\n    {\n        if((x[lcv] >= 'a' && x[lcv] <= 'z') || (x[lcv] >= 'A'\
    \ && x[lcv] <= 'Z'))\n        {\n            if((x[lcv] >= 'a' && x[lcv] <= 'm')\
    \ || x[lcv] <= 'M')\n            {\n                x[lcv] += 13;\n          \
    \  }\n            else\n            {\n                x[lcv] -= 13;\n       \
    \     }\n        }\n    }\n}\n```"
