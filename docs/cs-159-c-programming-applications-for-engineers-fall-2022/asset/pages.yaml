- pgno: 21
  md: '# Advance Topics/Implementations


    +   - In all programming assignments we will specify from which chapters you may
    reference when developing your solution.

    +   - We commonly view advanced implementations (material not covered yet in lecture
    or not covered in the course) in code as suspicious in that such work is beyond
    what most students in the course are capable of using and believe that the author
    of the code may be someone not currently in the class.


    # Efficient Design


    +   - One measure regarding the quality of ALL assignments is the implementation
    of efficient design. Students of innovative work in science and engineering should
    anticipate and appreciate that design is critical to the evaluation of any product
    including software.

    +   - We require that you implement an efficient and logically correct algorithm
    as part of your assignment. In some cases this may make the distinction between
    letter grades on the assignment. To receive full credit on an assignment we expect
    correct logic AND good design.


    # Some guidelines related to the efficient use of the limited resources of the
    computer:


    +   - Avoid wasting memory.

    +     - Do not use multiple arrays (or dimensions) when one will do the job.

    +     - Do not declare arrays to be large beyond your data needs (specified by
    the assignment).

    +     - Do not use arrays when they are unnecessary.

    +   - Avoid wasting the CPU''s time.

    +     - Do not write nested loops for tasks that can be done in one (or none).

    +   - Shorter code is usually better. Recognize patterns in your code. Avoid duplication
    of the same, or similar, logic within a program.

    +     - If you find yourself repeating code in several places, create a function
    such that the code only appears once in your program and is called when needed.

    +     - Another common scenario involves several functions have been written that
    do essentially the same thing, or contain a considerable amount of similar code.
    In such cases you should attempt to consolidate as much as possible.

    +   - Use the top-down design. Each function should have a well-defined task and
    not a series of tasks.

    +   - Topics of efficient design will be commented on, where appropriate, in lecture.


    # Syntax Errors and Warnings


    +   - Any assignment submit attempt with a syntax error in the source code will
    be rejected and no consideration given for partial-credit. You are responsible
    for testing your work thoroughly prior to submission.

    +   - Compiler warnings will result in a loss of points and should be remedied
    prior to submission of your final effort.


    # Course Tools and Technologies for Developing Code


    +   1. We DO NOT encourage that you develop, compile, or to test your code in
    ANY editor or compiler other than those found within Vocareum. Not all C programming
    language compilers are fully compatible. You should want to test your work under
    the same conditions that it will be processed and tested by the course.

    +   2. It is your responsibility to thoroughly test your code within Vocareum
    as set up during the first week of the semester prior to making the final submission
    of your work.

    +   3. We will not support compilers, editors, and programming development environments
    other than those found on Vocareum.


    You are advised to leave sufficient time prior to the assignment deadline to seek
    assistance should you encounter a difficulty with assignment submission. No late
    work will be accepted.'
