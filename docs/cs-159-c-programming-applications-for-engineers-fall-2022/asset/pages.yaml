  md: "# Selection via Calculation\n\nWait, this is not the chapter on selection,\
    \ is it? Where are the if/else constructs? How can we simulate selection with\
    \ a calculation? The fundamental idea here is that we can create an expression\
    \ that can be activated or not based on the value of a factor which is multiplied\
    \ by the expression to determine whether it remains an part of the final calculation.\
    \ The factor is often a result of comparing two values to determine which of the\
    \ two is larger. Given that this chapter has placed an emphasis on data types\
    \ it is indeed that idea which plays a major part in the calculation of such a\
    \ factor.\n\n# Example: Given two integers display the larger of the two.\n\n\
    ```\n#include <stdio.h>\n\nint main (void)\n{\n   int x;\n   int y;\n   int max;\n\
    \n   printf (\"Enter two integers: \");\n   scanf (\"%d %d\", &x, &y);\n\n   max\
    \ = x / y * x + y / x * y;\n\n   printf (\"Max value input is: %d\\n\", max);\n\
    \n   return (0);\n}\n```\n\n# Example Executions:\n\nEnter two integers: 5 8\n\
    Max value input is: 8\nEnter two integers: 9 6\nMax value input is: 9\nEnter two\
    \ integers: 10 3\nMax value input is: 30\n\n# Revision to eliminate multiplying\
    \ the larger value by a factor greater than one:\n\n```\nfactor1 = x / y;\nfactor2\
    \ = y / x;\n\nfactor1 = (factor1 + 2) % (factor1 + 1);\nfactor2 = (factor2 + 2)\
    \ % (factor2 + 1);\n\nmax = factor1 * x + factor2 * y;\n```\n\n+   - Two integers\
    \ factor1 and factor2 are introduced to store the values comparing x and y.\n\
    +   - We know the value that is zero represents the smaller of the two values\
    \ and the value greater than zero is the larger.\n+   - The modulus operator is\
    \ used here to scale all non-zero values to 1 while not changing the factor storing\
    \ zero because 2 % 1 is zero.\n\n# Example Executions of Revised Program:\n\n\
    Enter two integers: 10 3\nMax value input is: 10\n\nEnter two integers: 8 8\n\
    Max value input is: 16\n\n+   - We still have a problem when both integer values\
    \ are the same!"
