- pgno: 116
  md: '# Describe the three assignment statement expressions between the two print
    statements in the exchangeValues function:


    +   - `temp = *a;`: Assign the value in the location to which `a` refers to the
    `temp` variable.

    +   - `*a = *b;`: Retrieve the value in the location which `b` refers and assign
    it to the location to which `a` refers.

    +   - `*b = temp;`: Assign the value of `temp` to the location to which `b` refers.


    # When to use pass by address?


    When more than one value needs to be revised and that revision be retained in
    the calling function once the called function terminates.


    AND


    The function continues to meet the definition of being functionally cohesive such
    that it completes only a single fundamental task.


    # Scope


    The scope of an object (think variable or function) is the region of the program
    for which it is defined and in which you can refer to it by its declared identifier.
    Can two or more objects have the same identifier? The answer is yes, if the scope
    of each object does not overlap! In many cases the reuse of an identifier with
    overlapping scope is a compiler error. In other situations it is a poor design
    choice.


    Two levels of scope are used in this course, global and local. All functions will
    be declared globally and all variables will be declared locally.


    # Structure Charts


    A structure chart is the primary design tool for a program. You should complete
    your structure chart for a program before you attempt to develop any flowcharts
    or write any code. A structure chart will represent each user-defined function
    that is present in your program and the order in which they are called. You can
    next create a flowchart for each function after your structure chart is present
    in your program.


    # Structure Chart Rules and Symbols


    | The two symbols to the left are used to indicate function calls. The first symbol
    will represent a function called a single time in a program. The name of the function
    will go inside of the box. | The second symbol contains a “cross-hatch” in the
    lower-right corner. All functions listed with such a cross-hatch indicate that
    it is called more than once in the program. To limit the number of sub-functions
    in a structure chart you only need to list the sub-functions called (if any) by
    this particular function one time (the first time it is used). |'
