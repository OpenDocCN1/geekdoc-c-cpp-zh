  md: "# Searching for a Sub-string\n\nThe final function (strstr) to introduce from\
    \ the string.h library has the capacity to locate a sub-string within a string.\n\
    \nThe strstr function accepts two memory addresses as parameters and returns the\
    \ location of the sub-string within the string. When the sub-string cannot be\
    \ found the value returned is a defined zero known as NULL.\n\nIf the function\
    \ returns an address then to which type of variable would this value be assigned?\
    \ Answer: a character pointer.\n\n# Problem - given a string and sub-string determine\
    \ the number of times the sub-string appears in the string.\n\n+   Enter the string\
    \ -> ATATATA\n+   Enter the substring -> AT\n+   The substring AT appears 3 time\
    \ (s) in the string ATATATA.\n\n+   Enter the string -> ATATATA\n+   Enter the\
    \ substring -> ATA\n+   The substring ATA appears 3 time (s) in the string ATATATA.\n\
    \n# Solution:\n\n```\n#define SUB_INPUT 1\n#define STR_INPUT 2\n#define SUBSTR\
    \ 21\n#define STRING 50\n\nvoid getString(char[], int, int);\nint ctStrings(char[],\
    \ char[]);\n\nint main(void)\n{\n    char sub[SUBSTR];\n    char str[STRING];\n\
    \    int count;\n\n    getString(str, STR_INPUT, STRING);\n    getString(sub,\
    \ SUB_INPUT, SUBSTR);\n    count = ctStrings(str, sub);\n\n    printf(\"The substring\
    \ %s appears %d time(s) in the string %s.\\n\", sub, count, str);\n\n    return(0);\n\
    }\n```"
