  md: '# Determining the Length of a String


    The first function from string.h to introduce is the strlen function which will
    return the number of characters in the string. This function does not count the
    terminal delimiter character, but the value returned does represent the location
    (index) of the delimiter in the array.


    ```

    char str1[SIZE];

    int length;

    getString(str1);

    length = strlen(str1);

    printf("Your string [length %d]: %s\n", length, str1);

    ```


