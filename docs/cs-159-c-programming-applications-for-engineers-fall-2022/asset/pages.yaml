  md: "# Switch Construct Rules\n\n+   1. The control expression must be integral.\n\
    +   2. Each case label is the keyword case followed by a constant expression.\n\
    +   3. No two case labels can represent the same value.\n+   4. Two case statements\
    \ can be associated with the same executable statements.\n+   5. The default label\
    \ is not required.\n+   6. There is a maximum of one default label.\n\nExample\
    \ of Rule #4, the first statement is printed if value of grade 'A' or 'B'\n\n\
    ```\nswitch (grade)\n{\n    case 'A':\n    case 'B':\n        printf(\"Great job!!!\\\
    n\");\n        break;\n    case 'C':\n        printf(\"Mission Accomplished.\\\
    n\");\n        break;\n    case 'D':\n        printf(\"Perhaps you need to consider\
    \ repeating?\\n\");\n        break;\n    default:\n        printf(\"See you next\
    \ semester?\\n\");\n}\n```\n\nRevision of switch above using the ASCII values\
    \ (how to compare integer data within a switch construct):\n\n```\nswitch (grade)\n\
    {\n    case 65:\n    case 66:\n        printf(\"Great job!!!\\n\");\n        break;\n\
    \    case 67:\n        printf(\"Mission Accomplished.\\n\");\n        break;\n\
    \    case 68:\n        printf(\"Perhaps you need to consider repeating?\\n\");\n\
    \        break;\n    default:\n        printf(\"See you next semester?\\n\");\n\
    }\n```"
