    language arrays are zero-based.


    ![](img/e25602f5611b32eaf448a241a988eedc_165_0.png)


    # Declaring and Defining Arrays


    As with other variables we must declare and define arrays before they can be used
    in a function. Declaration and definition inform the compiler of the name of the
    array, the size of the array, and the data type of each element. The C programming
    language provides for two different array types: fixed-length arrays (length is
    known before program is compiled) and variable-length (size is determined when
    program is running).


    Course Standard: All arrays will be static (of fixed-length) until we introduce
    the topic of dynamic memory allocation in chapters 9 and 10. The application of
    variable-length arrays as seen in the example on pages 478-479 will violate course
    standards as it permits the local declarations and executable statements in a
    function to overlap.


    +   - Note: it will be a standard for the course to replace the number (size)
    between [ and ] with a symbolic constant for statically declared arrays.


    ```

    int students[15];

    ```


    ```

    double gpa[50];

