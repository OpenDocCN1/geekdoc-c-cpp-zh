  md: "```\n```c\nvoid bubbleSort(int x[])\n{\n    int numPasses;    //LCV THAT CONTROLS\
    \ # OF PASSES\n    int lcv;          //LOOP CONTROL VARIABLE FOR SORTING\n   \
    \ int temp;         //HOLDS VALUE DURING SWAP\n\n    for(numPasses = 1; numPasses\
    \ < NUMDATA; numPasses++)\n    {\n        for(lcv = 0; lcv < NUMDATA - numPasses;\
    \ lcv++)\n        {\n            if(x[lcv] > x[lcv + 1])\n            {\n    \
    \            temp = x[lcv];\n                x[lcv] = x[lcv + 1];\n          \
    \      x[lcv + 1] = temp;\n            } //END OF IF\n        } //END OF NEIGHBOR\
    \ COMPARING LOOP\n    } //END OF PASSES LOOP\n} //END OF FUNCTION\n```\n```\n\n\
    # Modify the Bubble Sort to work with an array that may not be filled to capacity:\n\
    \n```\n```c\nvoid bubbleSort(int x[], int size)\n{\n    int numPasses;    //LCV\
    \ THAT CONTROLS # OF PASSES\n    int lcv;          //LOOP CONTROL VARIABLE FOR\
    \ SORTING\n    int temp;         //HOLDS VALUE DURING SWAP\n\n    for(numPasses\
    \ = 1; numPasses < size; numPasses++)\n    {\n        for(lcv = 0; lcv < size\
    \ - numPasses; lcv++)\n        {\n            if(x[lcv] > x[lcv + 1])\n      \
    \      {\n                temp = x[lcv];\n                x[lcv] = x[lcv + 1];\n\
    \                x[lcv + 1] = temp;\n            } //END OF IF\n        } //END\
    \ OF NEIGHBOR COMPARING LOOP\n    } //END OF PASSES LOOP\n} //END OF FUNCTION\n\
    ```\n```"
