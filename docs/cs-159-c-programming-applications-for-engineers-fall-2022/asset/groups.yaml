  mdcn: "\n\n隐式是什么意思？计算机在程序员没有明确要求进行转换的情况下就自动完成了！上图说明了隐式数据类型转换的规则。\n\n- 是否存在显式数据类型转换？如果有，如何实现显式类型转换？\n\
    \n需要显式类型转换的示例：我想计算 3 / 2，但我需要答案是 1.5！\n\n在混合类型表达式中，我们看到整数在数据类型层次结构中被隐式提升为浮点数。我们可以在除法表达式的两个操作数之一上明确请求类型转换，强制除法涉及浮点数和整数。商随后将作为浮点数值生成，因为表达式现在是混合类型表达式，第二个操作数（下面示例中的分母）被隐式更改。\n\
    \n```\n(float) 3 / 2 = 1.5\n```\n\n## 尝试以下内容：\n\n| 表达式 | 求值 |\n|------------|------------|\n\
    | 3 / (float) 2 | |\n| (float) 3 / (float) 2 | |\n| (float) (3 / 2) | |\n\n上面表达式的结果说明了显式类型转换的优先级是什么？\n\
    \n## 另一篇数学复习：数字舍入是解决问题中的常见任务。在本学期编程时，你必须牢记有关舍入的规则，或者更好的是，能够进行各种测试以识别你的值是如何进行舍入的。\n\
    \n- 有时会发生一种称为截断的“极端”舍入形式。截断是删除整个小数值，而不考虑剩余整数的舍入。\n- floor 函数（位于 math.h 中，也是 MATLAB\
    \ 和 Excel 中常用的函数）将删除余数并将数字减小到下一个较小的整数值。请注意其行为与 float 到 int 的转换相似。\n\n| 表达式 | 求值\
    \ | 表达式 | 求值 |\n|------------|------------|------------|------------|\n| floor\
    \ (6.99) | | (int) 6.99 | |\n| floor (6.5) | | (int) 6.5 | |\n| floor (6.0) |\
    \ | (int) 6.0 | |\n| floor (6.75 + 0.5) | | (int) (6.75 + 0.5) | |\n\n## 赋值转换：\n\
    \n当赋值表达式右侧表达式的数据类型与赋值运算符左侧变量的数据类型不匹配时，会发生这种类型的转换。\n\n- 赋值表达式右侧表达式的结果将被转换以匹配左侧变量的类型。这种转换可能不安全。\n\
    \n## 示例 - 舍入和截断\n\n```c\nint a = 3;\nint c = 1;\nfloat x = 3.99;\nfloat y = 2.29;\n\
    float z = 8;\nprintf(\"The value of z is %f\\n\", z);\nc = x; //ASSIGNING A FLOAT\
    \ TO AN INT - ASSIGNMENT CONVERSION\nprintf(\"The value of c is %d\\n\", c);\n\
    printf(\"The value of x is %.1f and y is %.1f\\n\", x, y);\nprintf(\"Using mixed\
    \ up placeholders: \\n\");\nprintf(\"x is %d and a is %f\\n\", x, a);\nprintf(\"\
    Using a cast to fix placeholders: \\n\");\nprintf(\"x is %d and a is %f\\n\",\
    \ (int) x, (float) a);\n```\n\n注意：由于转换代码不正确而发出的警告是另一种未定义行为的指示。显示值的确定方式取决于单个处理器。\n\
    \n提醒：应用于变量的显式类型转换**不会**在程序的其余部分更改变量的数据类型。你可以认为类型转换是在从变量分配的内存中检索数据值**之后**应用的。\n\
    \n## 变量值如何更改：\n\n- 赋值运算符有能力更改变量的值。\n- 存储在分配给变量的内存中的内容。\n- 在 scanf 函数调用中使用地址运算符将更改变量在内存中存储的内容。\n\
    - 前缀和后缀递增及递减将更改变量的值。所使用的特定运算符将确定此更改发生的时间。\n\n## 通过计算进行选择\n\n等等，这不是选择章节，对吧？if/else\
    \ 结构在哪里？我们如何通过计算来模拟选择？这里的基本思想是，我们可以创建一个表达式，根据一个因子的值来决定是否激活该表达式，该因子乘以表达式以确定它是否仍然是最终计算的一部分。该因子通常是比较两个值以确定哪个较大的结果。鉴于本章强调了数据类型，确实是这个想法在计算此类因子中起着主要作用。\n\
    \n## 示例：给定两个整数，显示较大的那个。\n\n```c\n#include <stdio.h>\n\nint main (void)\n{\n  \
    \ int x;\n   int y;\n   int max;\n\n   printf (\"Enter two integers: \");\n  \
    \ scanf (\"%d %d\", &x, &y);\n\n   max = x / y * x + y / x * y;\n\n   printf (\"\
    Max value input is: %d\\n\", max);\n\n   return (0);\n}\n```\n\n## 示例执行：\n\nEnter\
    \ two integers: 5 8\nMax value input is: 8\nEnter two integers: 9 6\nMax value\
    \ input is: 9\nEnter two integers: 10 3\nMax value input is: 30\n\n## 修订以消除将较大值乘以大于一的因子：\n\
    \n```\nfactor1 = x / y;\nfactor2 = y / x;\n\nfactor1 = (factor1 + 2) % (factor1\
    \ + 1);\nfactor2 = (factor2 + 2) % (factor2 + 1);\n\nmax = factor1 * x + factor2\
    \ * y;\n```\n\n- 引入两个整数 factor1 和 factor2 来存储比较 x 和 y 的值。\n- 我们知道值为零表示两个值中较小的那个，而大于零的值表示较大的那个。\n\
    - 这里使用模运算符将所有非零值缩放为 1，同时不改变存储零的因子，因为 2 % 1 是零。\n\n## 修订程序的示例执行：\n\nEnter two integers:\
    \ 10 3\nMax value input is: 10\n\nEnter two integers: 8 8\nMax value input is:\
    \ 16\n\n- 当两个整数值相同时，我们仍然存在问题！\n\n## 修订以消除当输入两个值相同时输出重复的问题：\n\n- 只有当因子之和为二时，两个值才相同。在所有其他情况下，因子之和将为一。\n\
    - 在这种情况下，我们只需要将 max 除以因子之和，以消除这种不需要的值翻倍。\n\n```\nfactor1 = x / y;\nfactor2 = y\
    \ / x;\n\nfactor1 = (factor1 + 2) % (factor1 + 1);\nfactor2 = (factor2 + 2) %\
    \ (factor2 + 1);\n\nmax = factor1 * x + factor2 * y;\n\nmax = max / (factor1 +\
    \ factor2);\n```\n\n## 示例：利用我们对数据类型和表达式的了解，给定学期获得的总分，计算获得的字母等级。\n\nEnter total\
    \ points earned: 470\nPoints Earned: 470 Grade Earned: A\n\nEnter total points\
    \ earned: 415\nPoints Earned: 415 Grade Earned: B\n\nEnter total points earned:\
    \ 305\nPoints Earned: 305 Grade Earned: D\n\nEnter total points earned: 304\n\
    Points Earned: 304 Grade Earned: F\n\n## 解决方案：\n\n```\n#define A_MIN 470\n#define\
    \ B_MIN 415\n#define C_MIN 360\n#define D_MIN 305\n```\n\n```\nint totalPoints;\
    \ //TOTAL POINTS EARNED BY STUDENT\nchar courseGrade; //GRADE EARNED BY STUDENT\n\
    \nint gradePoints; //GRADE POINTS EARNED BY STUDENT\n\nprintf(\"Enter total points\
    \ earned: \");\nscanf(\"%d\", &totalPoints);\n\ngradePoints = totalPoints / A_MIN;\n\
    gradePoints += totalPoints / B_MIN;\ngradePoints += totalPoints / C_MIN;\ngradePoints\
    \ += totalPoints / D_MIN;\n\ncourseGrade = 'F' - gradePoints;\ncourseGrade -=\
    \ totalPoints / D_MIN; //TO ACCOUNT FOR 'E'\nprintf(\"Points Earned: %d Grade\
    \ Earned: %c\\n\", totalPoints, courseGrade);\n```\n\n## 为什么使用函数？\n\n## 自顶向下设计\n\
    \n在较大问题中识别较小任务称为因式分解，并导致程序的小型可管理子部分，这些部分将被设计、单独开发然后实现。将任务分解为更可管理的部分的过程称为自顶向下设计。\n\
    \n因式分解何时停止？这种因式分解应继续进行，直到任务“仅由内在理解且无法进一步细分的基本过程组成”（第 150 页，C 语言程序设计教材）\n\n- 简单来说，函数应由单个任务组成。小心不要将任务划分得导致生成的函数是平凡的。例如，输入一个值的操作包括\
    \ printf、scanf 和输入验证。进一步划分此输入任务将导致平凡的函数。\n- math.h 库中可以找到更多“单任务”函数的良好示例。这些函数接受一个或多个值作为输入，并生成一个单一值作为结果。除了这些函数的任务外，不包括输入、输出或进一步计算等附加任务。“单任务”哲学确实提高了函数未来可重用的可能性。\n\
    \n## 何时需要新函数？\n\n- 只完成单个任务的函数被称为功能内聚。我们的目标是开发此类函数，并避免在同一个函数中放置多个不相关的任务。\n- 程序中函数完成的任务背后的逻辑在程序中应只出现一次。这一想法的动机是我们希望消除冗余代码，即出现在程序中不止一处的逻辑。\n\
    - 函数正在完成的任务应能够独立于程序的其余部分单独进行测试。\n\n"
