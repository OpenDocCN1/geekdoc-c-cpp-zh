  mdcn: "\n\n## 高级主题 – 递归\n\n递归是重复的替代技术。递归的定义适用于会调用自身的函数。使用循环解决重复问题的方案称为迭代解法。与循环一样，函数调用不能无限继续。需要进行另一次调用的条件称为递归情况。当不再需要进行调用时，则已到达基例。\n\
    \n请记住，程序的控制权始终从被调用函数返回到调用函数。除了程序控制权之外，还可以返回一个值。\n\n阶乘是演示递归用法时最常见的第一个示例之一。\n\n\
    考虑如何计算数字 n 的阶乘：n * (n - 1) * (n - 2) * ... * 2 * 1\n\n你也可以说，当 n > 1 时，n! 等价于 n\
    \ * (n - 1)!，但当 n = 1 时又如何呢？正是在这一点上，我们找到了基例，即当 n = 1 时，n! = 1 的定义。\n\n以 4! 为例：\n\
    \n- 4! = 4 * 3!\n- 3! = 3 * 2!\n- 2! = 2 * 1!\n- 1! = 1\n\n## 使用递归函数求解阶乘：\n\n\
    ```c\nint factorial (int n)\n{\n    int nFact = 1;\n    if (n > 1)\n    {\n  \
    \      nFact = n * factorial (n - 1);\n    }\n    return (nFact);\n}\n```\n\n\
    当值 4 传递给阶乘函数时，跟踪递归解法。列出每次调用中变量的值。注意随着递归函数调用的进行，程序控制权的推进过程。\n\n## 使用 while 循环求解阶乘：\n\
    \n```c\nint factorial (int n)\n{\n    int nFact = 1;\n    while (n > 0)\n    {\n\
    \        nFact *= n--;\n    }\n    return (nFact);\n}\n```\n\n注意：调用函数与循环的一次迭代不同，循环中的相同代码会被反复执行。每个函数调用都独立于其他函数调用，局部变量占据唯一的内存位置。\n\
    \n## 重复结构与技术回顾\n\n## 递归的局限性\n\n在阶乘示例中，我们看到计算 4! 需要四次函数调用，在每次函数调用中都会创建一组唯一的变量，并且需要“记住”每个函数的状态，以便在被调用函数终止后继续执行。大量的函数调用可能需要比计算机能提供的更多内存。\n\
    \n## 什么时候不应该使用递归？\n\n- 当递归函数调用的数量有可能很大（由计数器控制）或不可预测（由事件控制）时。\n\n## 第 8 章 — 数组\n\
    \n本课程到目前为止介绍的数据类型只能存储单个值。上一章中的重复操作打开了接受和处理大型数据集的可能性。这与我们现有的数据类型如何配合工作？\n\n问题：最近十名学生参加了一次考试，我们想要计算最大值、最小值和平均值。我们从之前的示例中知道，可以在不同时将所有分数存储在变量中的情况下计算最大值、最小值和平均值，但要计算中位数和众数，我们确实需要保留所有值并对这些值进行排序，以帮助进行这些计算。\n\
    \n一种可能性包括为每个要输入的值声明变量。\n\n```c\nint score0;\nint score1;\nint score2;\nint score3;\n\
    int score4;\nint score5;\nint score6;\nint score7;\nint score8;\nint score9;\n\
    ```\n\n对十个单独变量进行输入和输出的任务将需要十个打印和扫描语句，或者一个带有十个占位符的打印和扫描语句，或者调用函数十次或带有十个参数。代码量不应取决于数据集的大小！\n\
    \n也许可以管理少量变量，但如果有 100 名学生呢？或者甚至 1,000 名学生？\n\n- 需要的是一种更实用的方式来存储和访问一组相关的数据项。\n\n\
    数组是一组共享一个名称和数据类型的连续变量。数组的每个变量（或元素）都有一个称为索引值的数字，表示其在数组中的位置。当我们引用数组名称及给定的索引值时，我们指的是存储在该数组中的特定单个值。\n\
    \n请注意，这个十元素数组的索引值范围从零开始，一直到数组大小减一。在 C 编程语言中，数组是从零开始的。\n\n![](img/e25602f5611b32eaf448a241a988eedc_165_0.png)\n\
    \n## 声明和定义数组\n\n与其他变量一样，我们必须在数组用于函数之前声明和定义它们。声明和定义向编译器告知数组的名称、数组的大小以及每个元素的数据类型。C\
    \ 编程语言提供两种不同的数组类型：固定长度数组（在程序编译前已知长度）和可变长度数组（在程序运行时确定大小）。\n\n课程标准：在介绍第 9 章和第 10\
    \ 章的动态内存分配主题之前，所有数组都将是静态的（固定长度）。如第 478-479 页示例中所示的可变长度数组的应用将违反课程标准，因为它允许函数中的局部声明和可执行语句重叠。\n\
    \n- 注意：课程标准将是，对于静态声明的数组，用符号常量替换 [ 和 ] 之间的数字（大小）。\n\n```c\nint students[15];\n\
    ```\n\n```c\ndouble gpa[50];\n```\n\n## 数组的初始化\n\n- 新声明的数组的内存中存储了什么？\n\n数组可以作为其声明语句的一部分进行初始化：\n\
    \n```c\nint data[5] = {9, 5, 1, 4, 2};\n```\n\n如果我们尝试以下初始化会怎样？\n\n```c\nint moreData[500]\
    \ = {1, 2, 3};\n```\n\n注意：如果提供的值的数量少于数组的定义大小，则未分配的元素将填充为零。\n\n## 访问数组中的元素\n\n\
    - 使用索引值来访问数组中的单个元素。\n\n- 索引值必须是整数值，可以是求结果为该类型的表达式。\n\n## 将值赋给数组\n\n编写一个程序，将分数\
    \ 9.5 赋给数组 labScores 的第一个元素。接下来，将该元素打印到屏幕上。\n\n```c\n#define NUMLABS 10\nint main(void)\n\
    {\n    float labScores[NUMLABS];\n    labScores[0] = 9.5;\n    printf(\"First\
    \ lab score: %.2f\\n\", labScores[0]);\n    return(0);\n}\n```\n\n## 将值输入数组\n\n\
    ```c\n#define NUMLABS 10\nint main(void)\n{\n    float labScores[NUMLABS];\n \
    \   printf(\"Enter first lab score -> \");\n    scanf(\"%f\", &labScores[0]);\n\
    \    printf(\"First lab score: %.2f\\n\", labScores[0]);\n    return(0);\n}\n\
    ```\n\n- 为什么上面的 printf 和 scanf 中使用 %f？\n\n- 浮点数组的单个元素是单个浮点值。\n\n如果元素只能通过表示索引值的常量来访问，那么我们就有了数组出现之前的同样问题，即我们需要的代码量取决于要处理的数据量。在处理与数组多个元素相关的许多任务时，更常见的是使用循环。\n\
    \n## 使用循环访问数组元素的示例：\n\n```c\n#define NUMLABS 10\nint main( void )\n{\n   int i;\n\
    \   float labScores[ NUMLABS ];\n   for( i = 0; i < NUMLABS; i++ )\n   {\n   \
    \   printf( \"Enter lab #%d score > \", i + 1 );\n      scanf( \"%f\", &labScores[\
    \ i ] );\n   }\n   // PROCESS DATA\n   for( i = 0; i < NUMLABS; i++ )\n   {\n\
    \      printf( \"Lab #%d score: %.2f\\n\", i + 1, labScores[ i ] );\n   }\n  \
    \ return( 0 );\n}\n```\n\n## 索引范围检查\n\n大小为 NUMLABS 的数组的有效索引值范围是零到 NUMLABS 减一。如果在程序执行时尝试访问此范围之外的索引，会发生什么？\n\
    \n例如，如果我们尝试访问 labScores[ 10 ]，而对于声明大小为 10 的数组，唯一有效的索引值是 0 - 9，会怎样？这里描述的场景意味着这个潜在问题是一个运行时错误。编译器不会，也不能，检测索引范围检查问题。\n\
    \n由于这是一个运行时错误，它可能有几种不同的形式。尝试访问数组边界之外的索引可能会有哪些后果？\n\n"
