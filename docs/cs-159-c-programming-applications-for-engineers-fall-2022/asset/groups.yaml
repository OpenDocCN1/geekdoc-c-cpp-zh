    ### Compound Statements


    It is possible to combine a series of relational and logical operators to form
    what is called a compound statement. The result of such a statement (or expression)
    will be a (true or false) logical value.


    The meaning of some compound logical expressions is clear when they contain only
    a single variable such as x > 0 && x < 10


