    # What is operator binding? How is this related to precedence?


    +   - The level of precedence for an operator can determine in an expression those
    operands that belong bound to it.

    +   - Because the logical AND operator has precedence over the logical OR operator
    the expression y++ >= 2 is the left-hand side of the AND operator and not the
    right-hand side of the OR operator.


    # Example:


    ```

    int x = 7;

