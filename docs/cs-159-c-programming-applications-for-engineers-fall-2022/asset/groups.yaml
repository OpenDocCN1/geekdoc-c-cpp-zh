    \             x[lcv] = x[lcv + 1];\n                x[lcv + 1] = temp;\n     \
    \       } //END OF IF\n        } //END OF NEIGHBOR COMPARING LOOP\n    } //END\
    \ OF PASSES LOOP\n} //END OF FUNCTION\n```\n\n## 修改冒泡排序以适用于可能未填满容量的数组：\n\n```c\n\
    void bubbleSort(int x[], int size)\n{\n    int numPasses;    //LCV THAT CONTROLS\
    \ # OF PASSES\n    int lcv;          //LOOP CONTROL VARIABLE FOR SORTING\n   \
