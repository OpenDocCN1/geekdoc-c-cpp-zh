    ## 数组与函数（函数间通信）\n\n如果数组仅限于声明它们的函数内使用，那么它们对我们的用处将是有限的。与用户定义的函数共享数组数据有两种方法，我们可以发送一个元素，也可以发送整个数组。\n\
