  mdcn: "\n\n## 想要地址吗？\n\n与索引值一样，加到 a 上的值表示相对于 a 所代表的内存地址的偏移量。加法运算会产生一个新的内存地址。不同的数据类型是否需要不同的内存量？是的，但向指针加一会根据数组的类型推进到数组中的下一个元素。在我们服务器上的整数数据中，加一将增加四个字节。\n\
    \n```c\nint main(void)\n{\n    int a[5] = {2, 4, 5, 3, 1};\n    printf(\"Array\
    \ a address: %p\\n\", a);\n    printArray(a);\n    return 0;\n}\nvoid printArray(int\
    \ *y)\n{\n    int i;\n    printf(\"Array y address: %p\\n\", y);\n    for (i =\
    \ 0; i < 5; i++)\n    {\n        printf(\"&y[%d] = %p\\n\", i, y + i);\n    }\n\
    }\n```\n\n![](img/e25602f5611b32eaf448a241a988eedc_200_0.png)\n\n```\nOutput Generated:\n\
    Array a address: 0x7ffd003f7680\nArray y address: 0x7ffd003f7680\n&y[0] = 0x7ffd003f7680\n\
    &y[1] = 0x7ffd003f7684\n&y[2] = 0x7ffd003f7688\n&y[3] = 0x7ffd003f768c\n&y[4]\
    \ = 0x7ffd003f7690\n```\n\n```c\nvoid printArray(int *y)\n{\n    int i;\n    printf(\"\
    Array y address: %p\\n\", y);\n    for (i = 0; i < 5; i++)\n    {\n        printf(\"\
    &y[%d] = %p\\n\", i, y + i);\n    }\n}\n```\n\n## 内存分配函数\n\n在程序编译前声明数组容量存在几个你可能已经考虑过的局限性。首先，我们可能为问题预留的内存不够。其次，我们可能预留了过多内存，限制了留给其他数据的内存。我们进入动态内存分配的探索将提高我们请求问题所需精确内存的能力。\n\
    \n- malloc（内存分配）函数将分配指定数量的字节内存。必须使用指针变量来引用 malloc 函数返回的新分配内存的起始地址。\n\n我们如何知道要请求多少字节的内存？我们可能知道数据的数量，但如何确保总量足以容纳数据集的数据类型？\n\
    \n- `sizeof` 函数接受一个数据类型，并返回存储该类型一个值所需的字节数。\n\n- 传递给 `malloc` 函数的参数将是 `sizeof`\
    \ 函数返回的值与所需数据数量的乘积。\n\n![](img/e25602f5611b32eaf448a241a988eedc_201_0.png)\n\n\
    足以存储二十个整数值的内存。\n\n```c\nint *data;\ndata = (int*)malloc(sizeof(int) * 20);\n```\n\
    \n## 示例 - 询问用户需要存储的整数数据数量。将数据集作为输入并按输入顺序显示它。\n\n```c\nint getQuantity(void);\n\
    void getData(int*, int);\nvoid printData(int*, int);\nint main(void)\n{\n    int\
    \ *data;\n    int quantity;\n    quantity = getQuantity();\n    data = (int*)malloc(sizeof(int)\
    \ * quantity);\n    getData(data, quantity);\n    printData(data, quantity);\n\
    \    return(0);\n}\n```\n\n```c\nint getQuantity(void)\n{\n    int qty;\n\n  \
    \  printf(\"Enter quantity of data -> \");\n    scanf(\"%d\", &qty);\n\n    return\
    \ qty;\n}\n```\n\n```c\nvoid getData(int *data, int size)\n{\n    int i;\n\n \
    \   printf(\"Enter %d integers -> \", size);\n    for (i = 0; i < size; i++)\n\
    \    {\n        scanf(\"%d\", data + i);\n    }\n}\n```\n\n```c\nvoid printData(int\
    \ *data, int size)\n{\n    int i;\n\n    printf(\"\\nContents of data set: \"\
    );\n    for (i = 0; i < size; i++)\n    {\n        printf(\"%d \", *(data + i));\n\
    \    }\n\n    printf(\"\\n\");\n}\n```\n\n注意：为简单起见，我们跳过了确认分配是否成功以及完成后释放内存等重要任务。\n\
    \n- 字符串是一系列字符，能够被视为一个整体。\n\nC 编程语言没有字符串数据类型，但试图通过使用字符数组来提供一些处理字符串数据的能力。\n\n与数值数组类似，我们可以将字符串声明为任何预定大小。字符数组常见的问题是，字符串数据所需的元素数量在程序执行期间可能会变化。例如，给定的字符数组可能有\
    \ 20 个元素的容量，最初存储“Computer”，随后该数据被“Science”替换。我们以及用于处理字符串数据的函数，如何知道数据在哪里结束，数组的未使用部分从哪里开始？\n\
    \n我们可以通过使用称为分隔符的字符来识别字符数组中数据的结束位置。这个分隔符字符 ‘\\0’ 表示字符数组中数据的结束。这对于许多操作字符串的函数非常重要。\n\
    \n- C 编程语言中的字符串是可变长度且带分隔符的字符串。\n\n- 什么是可变长度？给定时间点数组中找到的数据量。\n\n- 什么是带分隔符？在数组中插入一个字符，将数据与数组的未使用部分分开。\n\
    \n## 声明字符串和访问字符串元素\n\n- 我们可以以类似于数值数组的方式访问字符数组的每个单独元素。\n\n```c\nExamining the elements\
    \ of a character array:\n\nint lev;\nchar str[11] = \"Good Day\";\n\nfor (lev\
    \ = 0; lev < 11; lev++)\n{\n    printf(\"str[%2d] = %3c %5d\\n\", lev, str[lev],\
    \ str[lev]);\n}\n\nprintf(\"\\n\");\n```\n\n```\nOutput:\nstr[ 0] = G   71\nstr[\
    \ 1] = o  111\nstr[ 2] = o  111\nstr[ 3] =     32\nstr[ 4] = D   68\nstr[ 5] =\
    \ a   97\nstr[ 6] = y  121\nstr[ 7] =     32\nstr[ 8] = 0   0\nstr[ 9] = 0   0\n\
    str[10] = 0   0\n```\n\n- 分隔符在哪里？它在那里吗？是的！分隔符的 ASCII 值为零，并且正确地位于索引 8 处。初始化语句会将分隔符添加到字符数组的末尾。\n\
    \n- 字符数组中剩余未使用元素（索引 9 和 10）中有什么？\n\n- 因为我们上面初始化了数组，剩余元素被填充为零。\n\n## 字符串输入/输出函数\n\
    \n这里有一个值得思考的问题：如果我们要将数据加载到数组中，是否必须始终一次输入一个元素直到数组填满？这是否意味着为了输入字符串，我们必须一次输入一个字符？\n\
    \n### %s 占位符\n\n%s 占位符表示一个字符串，并用于熟悉的输入和输出函数中。\n\n### %s 占位符的示例：\n\n```c\nchar\
    \ str1[SIZE];\nprintf(\"Enter a string -> \");\nscanf(\"%s\", str1); //NOTICE\
    \ NO &, WHY IS THIS?!\nprintf(\"The string you entered was %s.\\n\", str1);\n\
    ```\n\n```\nOutput of previous code segment\n\nEnter a string -> Purdue\nThe string\
    \ you entered was Purdue.\n```\n\n- scanf 函数只读取数据，直到输入新行 ('\\n') 或任何空白字符。\n\n\
    Enter a string -> Go Purdue\nThe string you entered was Go.\n\n### 解决方案？寻找 scanf\
    \ 的替代品！\n\n```c\nprintf(\"Enter a string -> \");\ngets(str1);\nprintf(\"The string\
    \ you entered was %s.\\n\", str1);\n```\n\n用户输入的 '\\n' 字符会怎样？gets 函数会接受以新行终止的输入，并将其转换为以分隔符结尾的字符串。\n\
    \n## 与 scanf 和 gets 函数相关的问题：\n\n- 我们本学期使用的编译器不再对 gets 函数相关的潜在问题保持沉默。警告：'gets'\
    \ 函数很危险，不应使用。\n\n### 什么使得 gets（出于同样的原因 scanf 也是）“危险”且“不应使用”？\n\n- 当字符数组填充到其定义容量时，这两个函数都不会停止接受输入。\n\
    \n- 超出数组的定义容量将导致与范围检查问题相同的问题。\n\n## 输入的替代（更安全）方法：\n\n```c\nvoid getString(char\
    \ x[])\n{\n    int index = 0;\n    printf(\"Enter your string -> \");\n    do\n\
    \    {\n        x[index++] = getchar();\n    }while(index < SIZE && x[index -\
    \ 1] != '\\n');\n    //REPLACE THE FINAL CHARACTER WITH A DELIMITER CHARACTER\n\
    \    x[index - 1] = '\\0';\n}\n```\n\n- getchar 函数将接受单个字符的输入。\n\n- 上面的 do-while\
    \ 循环将在用户输入新行字符或达到数组的定义大小时终止输入接受。\n\n- 因为 getchar 函数只处理单个字符输入，它不会将分隔符字符放入数组，但它会将新行字符（ASCII\
    \ 值 10）放入数组，必须将分隔符分配给数组，并且将在上述函数中覆盖新行字符。\n\n## 字符串操作函数\n\nC 编程语言为我们提供了一组足够的字符串函数，这些函数可以在\
    \ string.h 库中找到。我们将考虑的函数包括：strcpy、strcmp、strlen，稍后我们会回来看一个使用 strstr 的示例。类似于 printf\
    \ 和 scanf，这些函数将使用数组名称所代表的地址以及其中存储的分隔符来完成它们的任务。\n\n"
