  - '[PAGE 69]


    # Chapter 1 – Introduction to Computers

    Hardware Basics


    +   The four primary components of a computer:

    +   1. A Central Processing Unit

    +   2. Main Memory

    +   3. Input/Output Hardware

    +   4. Systems Interconnection - connecting all of the above


    The following two hardware components of a computer are important to us as programmers:


    +   1. The central processing unit or processor.

    +   2. The main memory storage.


    +   Why these two particular components? An understanding of how the processor
    operates and what role the main memory plays for the programs we will write this
    semester will allow us to better utilize these limited resources of the computer.


    The processor (CPU) is of interest as it is where all of the processing of instructions
    and associated data will take place. The CPU can be described as having four fundamental
    components:


    +   1. Registers - A small amount of memory local to the processor used for temporary
    storage related to the current instruction being executed.

    +   2. Arithmetic and Logic Unit - Hardware responsible for the calculations required
    of an instruction.

    +   3. Control Unit - Coordinates the operations of the processor.

    +   4. Interconnection - connecting all of the above.'
  - '[PAGE 70]


    # Main Memory


    The memory of a computer will store the data and instructions of the programs
    that we will write this semester.


    +   - You may have made the observation that the capacity of primary memory (RAM,
    8-16 GB) on your personal machine is quite small in comparison to the size of
    your secondary memory (hard drive, 1 or more TB).

    +   - Therefore, not every instruction or data associated with the currently executing
    program can be stored in primary memory, but, when instructions or data are needed,
    they must be fetched, or retrieved, from the hard drive and brought in to primary
    memory for use.

    +   - Similar to addresses of homes on a street, the memory of the computer has
    addresses at which instructions and data can be located.

    +   - In our programs we will select names that are meaningful to us as programmers
    rather than referencing a specific address in memory to represent and locate data.'
  - '[PAGE 71]


    # If primary memory is faster then why not grow the capacity of this level and
    eliminate secondary memory?


    +   - The current model is an economic one for consumers.


    # Why is secondary memory slower than primary memory?


    +   - Many secondary devices still have moving or mechanical parts.

    +   - Further physical distance from the CPU (or machine).

    +   - Increased time required to locate specific content in a high capacity device.


    # Processing Instructions


    The CPU executes instructions using a process known as the instruction cycle.


    # Instruction Cycle Diagram:'
  - '[PAGE 72]


    # Natural Languages versus Machine Languages


    +   - When we describe problems that we wish to solve we do so in a natural language.

    +   - Natural languages are spoken and have evolved over centuries in accordance
    with their usage.

    +   - Natural languages are full of attributes that are unfit for use by a computer.


    # The Idea of a Programming Language


    To give instructions to a computer this semester, we will use a programming language,
    in particular, the C programming language. The C programming language is composed
    of keywords that come from a natural language but are used without the ambiguity.
    Initially the C programming language syntax will look foreign to you as a beginner,
    but it is completely unreadable by the computer!


    The computer has its own language, called a machine language that it can interpret
    as instructions specific to the individual machine that will perform the task.
    This machine language is written only in 0s and 1s because the internal circuits
    of a computer are made of switches, transistors, and other electronic devices
    can be in one of two states: off (0) or on (1).


    It didn''t take long for programmers to recognize that coding in a machine language
    is very challenging and the entire process of developing, debugging, and maintaining
    instructions in a machine language is not something most would enjoy doing. A
    process of evolution away from a machine language towards a natural language has
    been ongoing and has resulted in the programming languages of today.'
  - '[PAGE 73]


    # Natural Languages


    # High-Level Languages


    +   - Use natural language elements that are easier to use, understand, and develop.

    +   - Do not rely on specific hardware.


    ![](img/e25602f5611b32eaf448a241a988eedc_73_0.png)


    # Machine Languages


    # Low-Level Languages


    +   - Instructions written specifically for the hardware of one machine cannot
    be used easily on a different machine.

    +   - Requires the programmer to consider the algorithm in small, incremental
    steps.

    +   - Programmer left with the task of managing memory.


    How does the computer understand these high level programming languages if all
    a computer instructions are composed of 0''s and 1''s (binary numbers)?


