    \ the loop control variable: |\n| Identify the type of loop: |\n| Identify how\
    \ the loop control variable is updated: |\n| Is the algorithm logically correct\
    \ when the user enters zero? |\n\n## Event-Controlled and Counter-Controlled Processes\n\
    \nThe factorial problem from the previous page is an example of a counter-controlled\
    \ process. The counter, which is also the loop control variable, controls the\
    \ number of times the body of the loop is to be repeated.\n\nIn an event-controlled\
    \ process, an event takes place that changes the loop control expression from\
    \ true to false and bringing the repetition to a halt. With such a process one\
    \ can determine whether another iteration of the loop will take place but determining\
    \ the number of remaining iterations is not possible. The exam statistics problem\
    \ is an example of an event-controlled process. If you know the most recent input\
    \ then you know if there will be another iteration, but nothing more.\n\n**Key\
    \ Point:** If you can count or calculate the total number of iterations that will\
    \ take place during the execution of a loop, then it is a counter-controlled process,\
    \ otherwise the process is event-controlled.\n\n## Input Validation\n\n- The goal\
    \ of adding code to our input functions is to ensure that before the function\
    \ is allowed to terminate that we have a meaningful value to process in the remainder\
    \ of our program.\n- The task of input validation is commonly found within the\
    \ input function. Going forward from this point input functions will be more than\
    \ print-scan-return statements.\n- You must always provide the user with an unlimited\
    \ number of opportunities to enter meaningful data.\n- Due to its complexity you\
    \ will not validate for particular data types only for acceptable values within\
    \ a specified data type.\n- You will assume that the user will always enter the\
    \ expected data type as input.\n- One important part of input validation is to\
    \ display an appropriate message to the user making them aware of their mistake\
    \ and that input which is desired.\n- Because input validation does make input\
    \ functions more complex it is ill advised to use pass by address in an effort\
