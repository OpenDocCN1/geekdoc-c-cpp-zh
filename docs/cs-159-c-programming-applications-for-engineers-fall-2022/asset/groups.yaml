    \ sections to help \"group\" the code.\n- Balance the use of additional lines\
    \ and failing to place any throughout your code.\n  - There is no need to double\
    \ space all lines of code or to include multiple consecutive blank lines.\n- It\
    \ is a requirement to place a space between operators and operands, such as: `y\
    \ = y - g;`\n\n## Programming Standards\n\nThere are numerous motivations for\
    \ programming standards; in this course the purpose of such standards as described\
    \ here is to help you develop good habits for your future programming endeavors.\
    \ For some students this requirement will require breaking previously developed\
    \ programming habits.\n\n**What makes a habit or programming practice less desirable?**\
    \ Anything that makes programming harder for beginners, increases the vulnerability\
    \ of software to hacking or crashing, unnecessarily creates complex code, or represent\
    \ features of a programming language that are becoming obsolete.\n\n## Keep Local\
    \ Declarations Separate from Executable Statements\n\n- The default settings of\
    \ the `gcc` compiler in this course requires that all variables are declared prior\
    \ to the start of the executable statements. See Figure 2-2 in Chapter 2 of C\
    \ text for more information.\n\n## Scope\n\n- VARIABLES ARE NEVER PERMITTED TO\
    \ HAVE GLOBAL SCOPE.\n- Do you need to share a variable with another function?\
    \ Do you need a variable value to change within a function and to retain that\
    \ change after the function terminates?\n  - You must understand how to pass the\
    \ variables/values to and return them from a user-defined function.\n  - We reserve\
    \ the right to assign a **score of zero** for the implementation of global variables.\n\
    - We expect in this course that all function declarations will have a global scope.\n\
    - Do not reuse an identifier with two objects that have overlapping scope.\n\n\
    ## Symbolic/Defined Constants and other Pre-processor Directives\n\n- All pre-processor\
    \ directives must be placed at the top of your program just below the appropriate\
    \ assignment header of the file.\n- You can read much more about symbolic/defined\
    \ constants in your C programming text (appendix G) but one purpose of a symbolic-defined\
    \ constant is to make your role as programmer easier when the requirements for\
    \ a program are modified in the future.\n\n## The use of { and }\n\n- You may\
    \ observe in the C programming text that it is possible in certain situations\
    \ to omit the braces around the body of structures such as `if`, `for`, and `while`.\
    \ Do not develop or continue this habit! Beginners have a difficult enough time\
    \ pairing up their braces and a misplaced brace can be one of the more challenging\
    \ errors to resolve.\n- We will discuss the **dangling else** problem in chapter\
    \ 5 (page 245 of the C programming text, figure 5-14) as an example of one difficult\
    \ logical error to debug when you omit the braces as we have required. You will\
    \ also encounter the book's lack of { and } when you try to make sense of the\
    \ sorting algorithms coded in chapter 8 of the text.\n\n> For all relevant selection\
    \ and repetition constructs in C the use of { and } is required.\n\n## Proper\
    \ Use of Repetition\n\n- Use `for` loops only with counter-controlled processes.\n\
    - Make use of all three expressions with every `for` loop. Do not leave expressions\
    \ empty or place meaningless statements in any of the expressions such as `x =\
    \ x`.\n- The use of the comma operator is probably unnecessary in `for` loops\
    \ for this class. See page 323 of the C programming text.\n- The use of perpetual\
    \ loops would violate the expectation that control-forcing statements are prohibited.\n\
    - Recursion must only be used with counter-controlled processes.\n\n## Control\
    \ Forcing Statements\n\n- **You may observe control forcing statements being used\
    \ in the text but their use is prohibited within the course.** Often there are\
    \ better ways to direct the control of your program without using one of the following\
    \ statements:\n  - `exit`, `goto`, `break` (permitted only with `switch` structures),\
    \ `continue`\n  - **Multiple return statements in the same function.** A function,\
    \ much like the flowcharts we will discuss in lecture, must have common (only\
    \ one) starting and ending point. Using multiple `return` statements enables multiple\
    \ ending points for a single function (algorithm).\n\n## Standard Libraries and\
    \ Functions\n\n- You are permitted to use many of the functions in the standard\
    \ C libraries introduced in class. **It is your responsibility** for asking a\
    \ course staff member about a function or library we have not discussed in class\
    \ that you would like to use.\n\n## User-Defined Functions\n\nOnce we introduce\
    \ user-defined functions (chapter 4) only the following will be permitted in the\
    \ `main` function of a program:\n\n- Declaration of those variables that need\
    \ to be passed between functions.\n- Functions called by `main`.\n- A minimum\
    \ amount of control structures (loops, selection) to maintain `main` as the control\
    \ center of the program.\n\nThe `main` function is intended to be _the main function_\
    \ of the program and a majority of the function calls should originate in `main`.\
    \ Most of the data defined in the program should be done in `main`.\n\nAccording\
    \ to the definition of a function, each function must only have an individual\
    \ (single) specific task. Failing to make good use of user-defined functions on\
    \ relevant assignments will result in no partial credit.\n\nAll (parameters) variables\
    \ declared in the first line of the function definition must have an explicit\
    \ data type.\n\nPassing individual values by address should meet the following\
    \ criteria:\n\n- When more than one value needs to be revised and that revision\
    \ be retained in the calling function once the called function terminates.\n-\
    \ The function continues to meet the definition of being **functionally cohesive**\
    \ such that it completes only a single fundamental task within the larger problem\
    \ being solved.\n\n## Declaration of Arrays\n\nAll arrays will be **static** (of\
    \ fixed-length) until we introduce the topic of dynamic memory allocation in chapters\
    \ 9 and 10 of the C programming text. The application of variable-length arrays\
    \ as seen in the example on pages 478 – 479 will violate course standards as it\
    \ permits the local declarations and executable statements in a function to overlap.\n\
    \n- It is unacceptable to make use of a variable to represent the size of an array\
    \ in an array declaration.\n- A symbolic/defined constant must be used when declaring\
    \ arrays in all assignments.\n"
