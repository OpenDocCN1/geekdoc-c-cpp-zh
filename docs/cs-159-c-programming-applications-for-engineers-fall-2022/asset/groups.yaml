    # # Formatted I/O (Input and Output)


    The printf function is used to display messages and formatted data to the monitor.


    +   - To print data the printf function needs two things: instructions for formatting
    the data and the actual data to be printed.


    We saw the following in an earlier example to display text only:


    ```

    ```

    printf("Hello World!\n");

    ```

    ```


    It is possible to print the data represented by constants or variables in a printf
    statement:


    ```

    ```

    printf("The year is: %d\n", 2022);

    ```

    ```


    Where %d is a placeholder for the integer literal constant 2022.


    +   - Reminder: The term placeholder is used here in the notes, the book will
    refer to the % as a start token to be followed by a conversion code (in the example
    above a "d" is the conversion code for an integer value).


    The format of a printf statement is: printf( format string, data list );


    +   - Where the format string is everything inside the double-quotes and the variables
    to be printed are after the comma in the data list.


    +   - A data list may contain multiple values that are separated by commas.


    You can print all of the typical C data types with printf by using different conversion
    codes within placeholders:


    +   - int (integer family values) uses %d

    +   - float (floating-point family values) uses %f

    +   - char (single character values) uses %c'
