    \ possibility #2, then upon changing the variable a in the called function we\
    \ will observe the variable x being changed when control is returned to main.\n\
    \nBased on the results of the previous program we are left to conclude that it\
    \ is only a copy of the value of the variable that is passed from calling function\
    \ to the called function. This particular paradigm of passing data to a function\
    \ is commonly called passing by value. The concept of data protection between\
    \ functions finds its basis in pass by value approach. The calling function stores\
    \ the value received in a new memory location and is free to make changes to its\
    \ copy of the value without worry about how such changes may result in a logical\
    \ error back in the calling function.\n\n## Is the outcome of the previous program\
    \ changed if the corresponding variables had the same name AND data type?\n\n\
    - Using the same data type in calling and called function is not what determines\
    \ whether the data is passed by value.\n\n## What roles do the identifiers of\
    \ the variables in the calling and called function play in the pass by value paradigm?\n\
    \n- Using the same identifier in calling and called function is not what determines\
    \ whether a value is passed by value or not.\n\n## Pass by Value (downward communication)\
    \ versus Pass by Address (upward communication)\n\nA few questions that you should\
    \ be pondering at this point are:\n\n- Is it ever possible to \"return\" more\
    \ than one value from a function?\n- Are there alternatives to pass by value?\n\
    \nThe answer to both questions is YES and involves the same idea. What we need\
    \ to be able to do is not pass a copy of the value of a parameter, but rather\
    \ to make a connection between a variable in the called function to a variable\
    \ back in the calling function. To do this, we must pass the memory address of\
    \ the variable to a function rather than passing a copy of that variable's value.\
    \ By passing the memory address of a variable in the calling function to the called\
    \ function we can now make changes to the contents of that memory address and\
    \ making any such changes is permanent and remains available to the calling function\
    \ after the called function terminates.\n\nTo use pass by address we need to know\
    \ a little bit about pointers. We will cover pointers in detail in chapters 9\
    \ and 10, but using them to accomplish pass by address will benefit us now.\n\n\
    ## Pointer Operations\n\n- To pass the address of a single variable we use the\
    \ address (&) operator before the name of that variable.\n- A pointer is a variable\
    \ that stores the memory address of another variable as its value. We need such\
    \ a variable to receive the address being sent from the calling function to the\
    \ called function.\n\n"
  mdcn: "\n\n## 观察：\n\n- 在 calcRemainder 中，创建一个新的局部变量来存储取模运算符的值，然后返回该变量的值。\n- 在 calcQuotient\
    \ 函数中，表达式的结果被直接返回，并在函数中未局部存储。\n- 函数定义列出的顺序无关紧要。但是，main 应该放在第一个！！\n\n## 一个带有参数且不返回值的函数（void）\n\
    \n提示：如果函数不返回值，则它是 void 的。术语“void function”不涉及参数，而仅表示没有返回值。\n\n```c\n//FUNCTION\
    \ DECLARATIONS\nvoid welcome(void);\nint getInput(void);\nint calcRemainder(int\
    \ x, int y);\nvoid displayResults(int, int, int, int);\n\nint main (void)\n{\n\
    //LOCAL VARIABLE DECLARATIONS\n//operand1; //FIRST OPERAND ENTERED BY USER\nint\
    \ operand2; //SECOND OPERAND ENTERED BY USER\nint remain; //REMAINDER GENERATED\
    \ BY MODULUS\nint quotient; //QUOTIENT GENERATED BY DIVISION\n//EXECUTABLE STATEMENTS\n\
    welcome();\noperand1 = getInput();\noperand2 = getInput();\nremain = calcRemainder(operand1,\
    \ operand2);\nquotient = calcQuotient(operand1, operand2);\ndisplayResults(operand1,\
    \ operand2, remain, quotient);\nreturn (0);\n}\n```\n\n## 关于函数声明中标识符的说明：\n\n##\
    \ 关于 main 函数的观察：\n\n```c\n**********************************************************************\n\
    * Function Information\n* Name of Function: displayResults\n* Function Return\
    \ Type: void\n* Parameters (list data type, name, and comment one per line):\n\
    * 1. int op1 - first operand for quotient and modulus calculation\n* 2. int op2\
    \ - second operand for quotient and modulus calculation\n* 3. int rem - result\
    \ of modulus calculation\n* 4. int quo - result of division calculation\n* Function\
    \ Description: Displays final result of calculator program.\n**********************************************************************\n\
    ```\n\n```c\nvoid displayResults(int op1, int op2, int rem, int quo)\n{\n    printf(\"\
    %d / %d = %d\\n\", op1, op2, quo);\n    printf(\"%d %% %d = %d\\n\", op1, op2,\
    \ rem);\n}\n\nint calcRemainder(int op1, int op2)\n{\n    int rem; //TEMPORARY\
    \ STORAGE OF REMAINDER\n    rem = op1 % op2;\n    return(rem);\n}\n\nint calcQuotient(int\
    \ op1, int op2)\n{\n    return(op1 / op2);\n}\n```\n\n- **观察：**\n  - 仅为了在笔记中节省空间，包含了新的\
    \ `displayResults` 函数定义及其头部。\n  - 你定义的每一个用户函数都必须包含一个完整的课程函数头部！\n  - 注意这个新函数的声明。在括号之间列出了函数参数的类型和数量。\n\
    \  - 参数的数量、类型或顺序很重要！但是函数声明中出现的任何参数名称（标识符）都是可选的且不具约束力。\n\n```c\nint getInput(void)\n\
    {\n    //LOCAL DECLARATIONS\n    int op;\n    //EXECUTABLE STATEMENTS\n    printf(\"\
    Enter integer operand -> \");\n    scanf(\"%d\", &op);\n    return(op);\n}\nvoid\
    \ welcome(void)\n{\n    printf(\"\\nWelcome to our calculator program!\\n\\n\"\
    );\n}\n```\n\n## 关键编程标准 - 来自课程标准。\n\n凭借我们实现用户定义函数的能力，main 函数中仅允许以下内容：\n\n- 1.\
    \ 声明要传递给函数的变量。\n- 2. 由 main 调用用户定义的函数。\n- 3. 有限数量的控制结构。（参见第 5 章和第 6 章）以在 main\
    \ 函数中保留前两项任务。\n\n此外，每个用户定义的函数可以在你的大型程序中代表一项任务。未能如这里和课程标准中所述良好利用用户定义的函数，将导致所有要求使用用户定义函数的作业得零分。\n\
    \n## 参数传递\n\n当我们向函数发送数据时，计算机内存中发生了什么？\n\n- 1. 传递给函数的值被存储在表示新的且唯一内存位置的新变量中。结果本质上是对原始值进行副本。\n\
    - 2. 被调用函数中的变量与调用函数中的变量相关联，使它们引用同一内存位置。在被调用函数中对调用函数变量所做的更改。\n\n```c\nvoid exchangeValues(int,\
    \ int);\n\nint main(void)\n{\n    int x = 3;\n    int y = 5;\n    printf(\"Before\
    \ the function: x = %d y = %d\\n\", x, y);\n    exchangeValues(x, y);\n    printf(\"\
    After the function: x = %d\\n\", x, y);\n    return(0);\n}\nvoid exchangeValues(int\
    \ a, int b)\n{\n    int temp;\n    printf(\"Before the exchange: a = %d\\n\",\
    \ a, b);\n    temp = a;\n    a = b;\n    b = temp;\n    printf(\"After the exchange:\
    \ a = %d b = %d\\n\", a, b);\n}\n```\n\n- 如果可能性 #1 成立，那么更改 a 不会更改 x，正如 main 中的最终打印语句所示。\n\
    - 如果可能性 #2，那么在被调用函数中更改变量 a 时，当控制返回到 main 时，我们将观察到变量 x 被更改。\n\n基于前一个程序的结果，我们得出结论：从调用函数传递到被调用函数的只是变量值的副本。这种向函数传递数据的特定范式通常称为按值传递。函数之间数据保护的概念基于按值传递方法。调用函数将接收到的值存储在新的内存位置中，可以自由地对其值的副本进行更改，而无需担心此类更改可能在调用函数中导致逻辑错误。\n\
    \n## 如果相应的变量具有相同的名称和数据类型，前一个程序的结果会改变吗？\n\n- 在调用函数和被调用函数中使用相同的数据类型并不决定数据是否按值传递。\n\
    \n## 在按值传递范式中，调用函数和被调用函数中的变量标识符起什么作用？\n\n- 在调用函数和被调用函数中使用相同的标识符并不决定值是否按值传递。\n\n\
    ## 按值传递（下行通信）与按地址传递（上行通信）\n\n此时你应该思考的几个问题是：\n\n- 从函数中“返回”多个值是否可能？\n- 按值传递有替代方案吗？\n\
    \n这两个问题的答案都是肯定的，并且涉及相同的想法。我们需要能够做的不是传递参数值的副本，而是在被调用函数中的变量与调用函数中的变量之间建立连接。为此，我们必须将变量的内存地址传递给函数，而不是传递该变量值的副本。通过将调用函数中变量的内存地址传递给被调用函数，我们现在可以更改该内存地址的内容，并且任何此类更改都是永久的，并在被调用函数终止后仍可供调用函数使用。\n\
    \n要使用按地址传递，我们需要了解一些指针的知识。我们将在第 9 章和第 10 章详细介绍指针，但现在使用它们来实现按地址传递将对我们有所帮助。\n\n##\
    \ 指针操作\n\n- 要传递单个变量的地址，我们在该变量名称之前使用地址（&）运算符。\n- 指针是存储另一个变量内存地址作为其值的变量。我们需要这样的变量来接收从调用函数发送到被调用函数的地址。\n\
    \n"
