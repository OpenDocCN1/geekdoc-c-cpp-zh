    # Chapters 9 and 10 – Pointers and Pointer Applications


    +   • A pointer is a variable that stores a memory address, typically of another
    variable, and through the memory address the data stored there can be accessed
    and manipulated.


    # Working With Addresses, the & Operator


    We have seen the address operator (&) required in scanf statements and being used
    to pass variables by address to functions, but what does this operator really
    do?


    +   • The address operator (&) will return the address of the memory allocated
    to a variable. In the table below you can see two character variables a and b.
    Both of these variables are given a unique location in the memory of the computer
    to store a character value. The printf statement will display the memory address
    of a and b and does not print the contents of these variables.


    +   • The %p placeholder is commonly used to print the address of a variable.
    The %p conversion code represents a pointer value (memory address).


    +   • It is not necessary to place the & before the name of an array as the name
    of an array already represents a memory address.


    ```

    ```c

    char a = ''X'';

    char b = ''Y'';

    printf ("Address of a = %p\n", &a);

    printf ("Address of b = %p\n", &b);

