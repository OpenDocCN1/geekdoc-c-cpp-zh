    \n### 编译器在寻找什么？\n\n- 用户定义函数的所有三个组件（声明、定义和调用）都保持一致。\n\n### 找不到定义时生成什么错误？\n\nundefined\
    \ reference\n\n### 找不到声明时生成什么错误？\n\nwarning: implicit declaration of function\n\
    \n## 基本函数设计\n\n- 无参数且不返回值的函数。\n- 无参数但返回值的函数。\n- 有参数且返回值的函数。\n- 有参数但不返回值的函数。\n\n\
