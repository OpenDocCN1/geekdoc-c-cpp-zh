  mdcn: "\n## 协作学习/团队合作/作为技术团队成员参与\n\n以下是我们对您和您小组的期望：\n\n- 1. **定期安排时间与小组会面。** 一周有168个小时，为小组找到共同的会面时间不应该很困难。如果不是所有人都能参加每次会议，小组仅部分成员在某些时间会面是可以接受的。每个人都有责任相应地规划自己对小组工作的贡献。\n\
    \  - 小组可以将某成员的姓名从实验作业中排除，以表明其对小组工作缺乏令人满意的贡献。\n\n- 2. **让每个人都有机会表达他们对如何处理作业的想法**\
    \ 协作团队合作的一大好处是，每个人都为小组带来不同的技能，而由此产生的努力通常比个人完成的更强大。\n  - 当小组成员对会面请求无响应或未能更新其他小组成员时，那些做出贡献的成员必须准备好在没有该无响应成员的情况下继续。\n\
    \n- 3. **所有小组成员必须对最终提交感到满意。** 小组提交未经所有小组成员批准的作业是不可接受的。“足够好”对你来说可能是真的，但对小组中渴望获得最高分的其他人来说是不公平的。\n\
    \  - 同样，每个小组成员必须对自己对小组工作的贡献感到满意。\n\n- 4. **每个小组成员必须完全理解提交的整个作业。** 不要在小组会议开始时就试图将任务分配给不同的小组成员。每个人都必须理解并参与作业及其开发的每个方面。\n\
    \  - 作业是您展示所使用编程概念知识的机会。利用作业来衡量您不知道什么，以及如何集中未来的努力。\n\n- 5. **指定谁将提交作业、何时提交，以及如何将提交成功的情况告知小组其他成员。**\
    \ 小组中只有一人将提交作业。设定目标，在截止日期前很早就提交作业，以避免最后一刻的问题。\n\n- 6. **您将与分配的小组合作。** 如果您对小组有任何顾虑，请与我们联系。以专业的态度对待您的小组经历，类似于您在实习或合作教育经历中可能遇到的情况。\n\
    \  - 每四个实验后将重新分配小组。\n  - 未来的小组分配可能会将课堂出勤率和作业完成情况作为您参与课程兴趣的指标。课程中的活跃学生不应被那些不愿意跟上课程内容的合作伙伴所拖累。\n\
    \n## 非歧视声明\n\n普渡大学致力于维护一个社区，该社区认识到并尊重每个人的内在价值和尊严；在成员之间培养宽容、敏感、理解和相互尊重；并鼓励每个人努力实现自己的潜力。为追求学术卓越的目标，大学寻求发展和培养多样性。大学相信，其众多成员之间的多样性增强了机构，激发了创造力，促进了思想交流，并丰富了校园生活。\n\
    \n## 残障学生\n\n普渡大学致力于使学习体验尽可能无障碍。如果您基于残障预期或遇到身体或学术障碍，欢迎通知您的授课教师以讨论选项。您也可以联系残障资源中心：drc@purdue.edu\
    \ 或电话：765-494-1247。\n\n持有现有便利安排信函的学生应将该信函提交给授课教师，并通过电子邮件跟进，以启动关于如何在课程中实施您的便利安排的对话。\n\
    \n## 应急准备\n\n在发生重大校园紧急情况时，课程要求、截止日期和评分比例可能会因修订后的学期日历或其他情况而发生变化。\n\n- 发生校园紧急情况时，请查看\
    \ Brightspace 中的公告。遵循大学发布的所有官方指示。有关更多信息，请参见 https://www.purdue.edu/ehps/emergency_preparedness/。\n\
    \n## 免责声明\n\n- 授课教师保留修改大纲的权利，并将通过多种渠道（如课程录音、Brightspace 公告和电子邮件）发出通知。\n\n## 课程编程和文档标准\n\
    \n编程标准 – 包含良好编程实践的定义以及被视为不良实践的内容。\n\n文档标准 – 格式和文档要求。\n\n请在整个学期中仔细阅读并重温本节内容。\n\n\
    ## 文档、编程和课程标准\n\n### 评分标准\n\n每个作业都会尝试对所有要求提供足够详细的说明。但是，由于本课程解决的问题没有唯一解，我们在确定对您作业的适当评价时将依赖以下列出的一般准则。\n\
    \n您的作业将始终根据以下方面进行评价：\n\n- 1. 遵循提供的作业要求。\n- 2. 开发适当的逻辑来解决问题，按预期顺序接受输入，并生成预期输出。\n\
    - 3. 实施良好的编程实践。\n- 4. 您的解决方案应高效设计，以充分利用计算机的有限资源。\n- 5. 遵守课程文档标准。\n\n除生成正确输出之外的提交方面也很重要，可能会导致作业丢失大量分数。\n\
    \n### 文档标准\n\n良好文档实践的要求在技术专业人员中是普遍的；制定文档标准的主要动机是使您的代码（最终代表您的逻辑）尽可能易于理解和便于评分者评估。您正在开发的解决方案在本课程中寻求帮助，以及将来向同事、主管和客户寻求帮助时，都必须易于解释。\n\
    \n这些标准不仅仅是建议，而是课程要求，不遵守将导致扣分。\n\n- 课程笔记和课堂示例将尽可能遵循这些标准，以作为示例。但是，为了节省笔记空间和课堂时间，标题和注释可能会被排除；这不是您作业的选项。\n\
    - 各种参考资料，包括必修教材，并不遵循我们所有标准；请参阅本文档以获得澄清。\n\n如果您的代码和/或逻辑难以让实验教师评估，因为它未能满足本文档中概述的期望，则将从作业中扣分。\n\
    \n编程标准在现实世界中有相关性吗？大多数公司都有广泛的文档要求，以便促进先前开发的代码从一名员工转移到另一名员工，而无需花费大量时间来理解原开发者的工作。\n\
    \n## 作业标题\n\n### 实验作业标题\n\n```\n/********+-*-*--********-***-*****--*--****--***************-**************\n\
    *\n* Lab #:\n*\n* Academic Integrity Statement:\n*\n* We have not used source\
    \ code obtained from any other unauthorized source,\n* either modified or unmodified.\
    \ Neither have we provided access to our code\n* to another. The effort we are\
    \ submitting is our own original work.\n*\n* Program Description:\n*\n********+-*-*--********-***-*****--*--****--***************-**************/\n\
    ```\n\n- 您必须在 Vocareum 中使用 vi 的 :hlb 命令插入实验作业标题。\n- 每次成功提交实验作业后，Vocareum 团队的所有成员都将收到一封确认电子邮件。\n\
    \n### 家庭作业标题\n\n```\n/********+-*-*--********-***-*****--*--****--***************-**************\n\
    *\n* Homework #:\n*\n* Academic Integrity Statement:\n*\n* I have not used source\
    \ code obtained from any other unauthorized source,\n* either modified or unmodified.\
    \ Neither have I provided access to my code\n* to another. The effort I am submitting\
    \ is my own original work.\n*\n* Program Description:\n*\n********+-*-*--********-***-*****--*--****--***************-**************/\n\
    ```\n\n- 您必须在 Vocareum 中使用 vi 的 :hhw 命令插入家庭作业标题。\n- 每次成功提交家庭作业后，您都将收到一封确认电子邮件。\n\
    \n请确保您的实验和家庭作业标题中以下各项均正确：\n\n- 学术诚信声明将为您提供，并且必须保留在标题中。不要对诚信声明做任何更改。\n- 每个作业标题开头和结尾的交替字符是安全功能的一部分，不应修改。\n\
    - **需要详细的程序描述。** 如果您的实验教师在快速浏览您的代码后无法跟上您的逻辑，那么他们应该能够从您的描述中确定您试图实现的算法。详细的程序描述将意味着代码中所需的注释更少。\n"
