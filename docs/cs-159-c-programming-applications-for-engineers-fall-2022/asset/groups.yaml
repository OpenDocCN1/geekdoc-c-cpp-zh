  - '[PAGE 145]


    # # Event-Controlled and Counter-Controlled Processes


    The factorial problem from the previous page is an example of a counter-controlled
    process. The counter, which is also the loop control variable, controls the number
    of times the body of the loop is to be repeated.


    In an event-controlled process, an event takes place that changes the loop control
    expression from true to false and bringing the repetition to a halt. With such
    a process one can determine whether another iteration of the loop will take place
    but determining the number of remaining iterations is not possible. The exam statistics
    problem is an example of an event-controlled process. If you know the most recent
    input then you know if there will be another iteration, but nothing more.


    **Key Point:** If you can count or calculate the total number of iterations that
    will take place during the execution of a loop, then it is a counter-controlled
    process, otherwise the process is event-controlled.


    # ## Input Validation


    +   - The goal of adding code to our input functions is to ensure that before
    the function is allowed to terminate that we have a meaningful value to process
    in the remainder of our program.

    +   - The task of input validation is commonly found within the input function.
    Going forward from this point input functions will be more than print-scan-return
    statements.

    +   - You must always provide the user with an unlimited number of opportunities
    to enter meaningful data.

    +   - Due to its complexity you will not validate for particular data types only
    for acceptable values within a specified data type.

    +   - You will assume that the user will always enter the expected data type as
    input.

    +   - One important part of input validation is to display an appropriate message
    to the user making them aware of their mistake and that input which is desired.

    +   - Because input validation does make input functions more complex it is ill
    advised to use pass by address in an effort to “return” multiple values from a
    single input function. The syntax associated with pass by address and related
    pointer operations (chapters 9 and 10) make it challenging to apply to input validation.


