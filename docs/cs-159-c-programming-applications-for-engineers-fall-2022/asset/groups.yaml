    # Assignment Conversions:


    This type of conversion occurs when the data type of the expression on the right-hand
    side of an assignment expression does not match the data type of the variable
    on the left-hand side of the assignment operator.


    +   - The result of the expression on the right-hand side of the assignment expression
    will be converted to match that of the variable on the left-hand side. Such a
    conversion has the potential to be unsafe.


    # Example - rounding and truncation


    ```

    ```c

    int a = 3;

    int c = 1;

    float x = 3.99;

    float y = 2.29;

    float z = 8;

    printf("The value of z is %f\n", z);

    c = x; //ASSIGNING A FLOAT TO AN INT - ASSIGNMENT CONVERSION

    printf("The value of c is %d\n", c);

    printf("The value of x is %1.f and y is %.1f\n", x, y);

    printf("Using mixed up placeholders: \n");

    printf("x is %d and a is %f\n", x, a);

    printf("Using a cast to fix placeholders: \n");

    printf("x is %d and a is %f\n", (int) x, (float) a);

    ```

    ```


    Note: The warning issued as a result of incorrect conversion codes is an indication
    of another undefined behavior. How the values displayed are determined is based
    on the individual processor.


    Reminder: An explicit type conversion applied to a variable WILL NOT alter the
    variable''s data type for the remainder of a program. You can consider the type
    conversion is applied AFTER the data value for a variable has been retrieved from
    its allocated memory.


    # How the value of variables are changed:


    +   - The assignment operator has the ability to alter the value of a variable.

    +   - What is stored in the memory assigned to a variable.

    +   - The use of the address operator in a scanf function call will change what
    a variable is storing in memory.

    +   - Prefix and postfix increment and decrement will make a change to the value
    of a variable. The particular operator used will determine when this change will
    take place.'
  - "[PAGE 99]\n\n# Selection via Calculation\n\nWait, this is not the chapter on\
    \ selection, is it? Where are the if/else constructs? How can we simulate selection\
    \ with a calculation? The fundamental idea here is that we can create an expression\
    \ that can be activated or not based on the value of a factor which is multiplied\
    \ by the expression to determine whether it remains an part of the final calculation.\
    \ The factor is often a result of comparing two values to determine which of the\
    \ two is larger. Given that this chapter has placed an emphasis on data types\
    \ it is indeed that idea which plays a major part in the calculation of such a\
    \ factor.\n\n# Example: Given two integers display the larger of the two.\n\n\
    ```\n#include <stdio.h>\n\nint main (void)\n{\n   int x;\n   int y;\n   int max;\n\
    \n   printf (\"Enter two integers: \");\n   scanf (\"%d %d\", &x, &y);\n\n   max\
    \ = x / y * x + y / x * y;\n\n   printf (\"Max value input is: %d\\n\", max);\n\
    \n   return (0);\n}\n```\n\n# Example Executions:\n\nEnter two integers: 5 8\n\
    Max value input is: 8\nEnter two integers: 9 6\nMax value input is: 9\nEnter two\
    \ integers: 10 3\nMax value input is: 30\n\n# Revision to eliminate multiplying\
    \ the larger value by a factor greater than one:\n\n```\nfactor1 = x / y;\nfactor2\
    \ = y / x;\n\nfactor1 = (factor1 + 2) % (factor1 + 1);\nfactor2 = (factor2 + 2)\
    \ % (factor2 + 1);\n\nmax = factor1 * x + factor2 * y;\n```\n\n+   - Two integers\
    \ factor1 and factor2 are introduced to store the values comparing x and y.\n\
    +   - We know the value that is zero represents the smaller of the two values\
    \ and the value greater than zero is the larger.\n+   - The modulus operator is\
    \ used here to scale all non-zero values to 1 while not changing the factor storing\
    \ zero because 2 % 1 is zero.\n\n# Example Executions of Revised Program:\n\n\
    Enter two integers: 10 3\nMax value input is: 10\n\nEnter two integers: 8 8\n\
    Max value input is: 16\n\n+   - We still have a problem when both integer values\
    \ are the same!"
  - '[PAGE 100]


    # Revision to eliminate the duplication of the output when the two values entered
    are the same:


    +   - Only when the sum of the factors is two are both values the same. In all
    other cases the sum of the factors will be one.

    +   - With that being the case we only need to divide the max by the sum of the
    factors to remove this unwanted doubling of the value.


    ```

    factor1 = x / y;

    factor2 = y / x;


    factor1 = (factor1 + 2) % (factor1 + 1);

    factor2 = (factor2 + 2) % (factor2 + 1);


    max = factor1 * x + factor2 * y;


    max = max / (factor1 + factor2);

    ```


    # Example: Using what we know about data types and expressions, given the total
    number of points earned during a semester calculate the letter grade earned.


    ```

    Enter total points earned: 470

    Points Earned: 470 Grade Earned: A


    Enter total points earned: 415

    Points Earned: 415 Grade Earned: B


    Enter total points earned: 305

    Points Earned: 305 Grade Earned: D


    Enter total points earned: 304

    Points Earned: 304 Grade Earned: F

    ```


    # Solution:


    ```

    #define A_MIN 470

    #define B_MIN 415

    #define C_MIN 360

    #define D_MIN 305

    ```


    ```

    int totalPoints; //TOTAL POINTS EARNED BY STUDENT

    char courseGrade; //GRADE EARNED BY STUDENT


    int gradePoints; //GRADE POINTS EARNED BY STUDENT


    print f("Enter total points earned: ");

    scanf("%d", &totalPoints);


    gradePoints = totalPoints / A_MIN;

    gradePoints += totalPoints / B_MIN;

    gradePoints += totalPoints / C_MIN;

    gradePoints += totalPoints / D_MIN;


    courseGrade = ''F'' - gradePoints;

    courseGrade -= totalPoints / D_MIN; //TO ACCOUNT FOR ''E''

    printf("Points Earned: %d Grade Earned: %c\n", totalPoints, courseGrade);

    ```'
  - '[PAGE 101]


    # Why use functions?


    # Top-Down Design


    The identification of smaller tasks within the larger problem is known as factoring
    and results in small manageable sub-parts of a program to be designed and individually
    developed then implemented. This process of factoring tasks into more manageable
    parts is known as top-down design.


    When does the factoring stop? This factoring should continue until the task “consists
    only of elementary processes that are intrinsically understood and cannot be further
    subdivided” (page 150, C Programming text)


    +   In simple terms, a function should consist of a single task. Be careful not
    to divide tasks such that the resulting functions are trivial. For example, the
    act of input of a value includes the printf, scanf, and validation of the input.
    To divide this task of input further would result in functions that are trivial.


    +   More good examples of “single task” functions can be found in the math.h library.
    These functions accept as input one or more values and generate a single value
    as a result. No additional tasks such as input, output, or further calculations
    are included alongside the task of these functions. The “single task” philosophy
    does improve the likelihood that the function can be reused in the future.


    # When is a new function necessary?


    +   A function that accomplishes only a single task is known to be functionally
    cohesive. Our goal is to develop such functions and to avoid placing multiple
    unrelated tasks inside of the same function.


    +   The logic behind the task that a function accomplishes in a program should
    appear only once in the program. The motivation for this idea is that we desire
    to eliminate redundant code, that is logic which appears in more than one place
    in a program.


    +   The task that the function is completing should be testable by itself separate
    of the rest of the program.'
