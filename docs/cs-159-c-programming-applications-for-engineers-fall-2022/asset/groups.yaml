  mdcn: "\n\n示例：一个数的阶乘是从 1 到该数的所有整数的乘积。设计一个函数，给定一个非负整数，计算其阶乘。\n\n阶乘流程图：\n\n| 内容 |\n\
    |---------|\n| 识别循环控制变量： |\n| 识别循环类型： |\n| 识别循环控制变量如何更新： |\n| 当用户输入零时，算法在逻辑上是否正确？\
    \ |\n\n## 事件控制和计数器控制过程\n\n上一页的阶乘问题是计数器控制过程的一个示例。计数器也是循环控制变量，它控制循环体重复的次数。\n\n在事件控制过程中，会发生一个事件，将循环控制表达式从\
    \ true 改为 false，从而使重复停止。通过这种过程，可以确定是否会进行另一次循环迭代，但无法确定剩余迭代的次数。考试统计问题是事件控制过程的一个示例。如果你知道最近的输入，那么你就知道是否会有另一次迭代，但除此之外一无所知。\n\
    \n**关键点：** 如果你能计算或计算出循环执行期间将进行的迭代总数，那么它是计数器控制过程，否则该过程是事件控制。\n\n## 输入验证\n\n- 向输入函数添加代码的目的是确保，在函数被允许终止之前，我们有一个有意义的值可供程序其余部分处理。\n\
    - 输入验证的任务通常位于输入函数中。从这一点开始，输入函数将不仅仅是打印-扫描-返回语句。\n- 必须始终为用户提供无限次机会来输入有意义的数据。\n-\
    \ 由于其复杂性，你不会针对特定数据类型进行验证，只针对指定数据类型中的可接受值进行验证。\n- 你将假设用户始终会输入预期的数据类型作为输入。\n- 输入验证的一个重要部分是向用户显示适当的消息，让他们意识到自己的错误以及所需的输入。\n\
    - 由于输入验证确实使输入函数更加复杂，因此不建议使用按地址传递来尝试从单个输入函数“返回”多个值。与按地址传递和相关指针操作（第 9 章和第 10 章）相关的语法使其应用于输入验证变得具有挑战性。\n\
    \n![](img/e25602f5611b32eaf448a241a988eedc_145_0.png)\n\n## C 语言中的循环\n\nC 语言提供了三种用于重复循环技术的结构。它们是：while、for\
    \ 和 do-while。我们将从相似的 while 和 do-while 结构开始。\n\n### while 循环\n\nwhile 结构是一个预测试循环。与所有循环一样，while\
    \ 使用循环控制表达式来确定循环是否应该开始或继续迭代。作为预测试循环，循环控制表达式在第一次循环迭代之前被求值，然后只要表达式被求值为 true，循环就会完成另一次迭代。\n\
    \n- 只要循环控制表达式为 true，迭代就会继续。当控制表达式求值为 false 时，迭代过程停止。\n\n### while 循环的基本语法\n\n\
    ```\nwhile(loop control expression)\n{\n   //EXECUTABLE STATEMENT DESIGNATED\n\
    \   //FOR REPETITION - BODY OF THE LOOP\n}\n```\n\n> 注意：while 语句的循环控制表达式后面没有分号，因为循环后面跟着一个包含要重复的操作的主体。\n\
    \n### do-while 循环\n\ndo-while 结构是一个后测试循环。与 while 类似，使用循环控制表达式来确定重复是否继续，但在后测试结构的情况下，表达式在主体内指令初始执行之后被求值。\n\
    \n- 与 while 循环相反，do-while 中的关键字 while 后面加有分号。\n\n> 课程标准：缩进构成循环主体的所有语句，额外缩进两个空格。\n\
    \n### Do While 循环的基本语法\n\n```\ndo\n{\n   //EXECUTABLE STATEMENT DESIGNATED\n \
    \  //FOR REPETITION - BODY OF THE LOOP\n}while(loop control expression);\n```\n\
    \n> 课程标准：对于所有循环（和 if 语句），必须使用标记循环主体开始和结束的花括号。\n\n如果循环控制变量的更新发生在循环主体中间，这是否会导致循环在此点立即终止？\n\
    \n- 不会。只有当循环控制表达式被求值并发现为 false 时，循环才会终止。\n- C 语言中没有“中间测试”循环，只有预测试和后测试。\n\n是否有理由担心零值可能会被相乘？\n\
    \n- 不会。循环控制表达式在零相乘之前被求值并为 false。\n\n用户输入的值存储在局部变量 num 中，每次迭代更改 num 如何影响调用函数中正在发生的事情？\n\
    \n- 不会，该变量是按值传递的。\n\n### 阶乘示例\n\n阶乘问题将允许演示带有输入验证的 do-while 和 while 阶乘。\n\n```\n\
    int calcFactorial( int );\nint getInput( void );\nvoid displayResults( int, int\
    \ );\n\nint main( void )\n{\n    int num;\n    int fact;\n\n    num = getInput();\n\
    \    fact = calcFactorial( num );\n    displayResults( num, fact );\n\n    return(\
    \ 0 );\n}\n\nint calcFactorial( int num )\n{\n    int nFact = 1;\n\n    while(\
    \ num > 0 )\n    {\n        nFact = nFact * num;\n        num -= 1;\n    }\n \
    \   return( nFact );\n}\n```\n\n### 为什么不使用“if 循环”进行输入验证？\n\n- if 结构只允许用户第二次输入可接受的数据。我们希望用户有无限次机会输入有效数据。\n\
    \n### “if 循环”这一术语有什么问题？\n\n- if 是选择结构，而不是重复结构。\n\n```c\nint getInput(void)\n{\n\
    \    int num;\n    do\n    {\n        printf(\"Enter n to calculate n! -> \");\n\
    \        scanf(\"%d\", &num);\n        if(num < 0)\n        {\n            printf(\"\
    \\nError! Non-negative values only!!\\n\");\n        }\n    }while(num < 0);\n\
    \    return(num);\n}\n```\n\n```c\nvoid displayResults(int num, int fact)\n{\n\
    \    printf(\"\\n%d!= %d\\n\", num, fact);\n}\n```\n\n### 嵌套循环\n\n### 什么是嵌套循环？\n\
    \n- 嵌套循环，或任何形式的重复，是指一个重复过程位于另一个重复过程之内。\n\n### 该定义如何帮助解决使用嵌套循环的问题？\n\n- 更好的定义是考虑循环解决一个重复过程。那么嵌套循环就是一个位于另一个重复过程之内的重复过程。\n\
    \n### 解决嵌套循环问题的推荐方法是什么？\n\n- 首先，解决并测试嵌套过程，将其放在其自己的用户定义函数中。\n- 接下来，解决将调用嵌套过程的过程。我们必须确保嵌套过程正确，然后再尝试反复使用（调用）它。\n\
    \n### 计算一系列阶乘：而不是计算单个阶乘，用户将指定一系列值，并希望输出该范围内所有整数的阶乘。\n\n例如，如果用户输入 2 和 5，他们希望看到\
    \ 2!、3!、4! 和 5! 的结果。\n\n- 这里有哪两个重复过程？一个是计算单个阶乘，另一个是从起始值计数到结束值。\n- 哪个过程是嵌套过程？计算单个阶乘。我们已经确认能够接受一个整数并计算该数字的阶乘。\n\
    - 接下来，我们需要向现有程序添加功能，以便计算范围从 a 到 b 的所有整数 n 的每个 n!。\n- 需要的新任务或修订：\n  - 获取起始值和结束值，并验证两者，确保结束值不小于起始值。为什么\
    \ getEnd 有参数而 getStart 没有？\n  - 计算并打印 start 和 end 之间每个整数的阶乘（包含两端）。\n\n```cpp\n\
    int calcFactorial( int );\nint getStart( void ); //UNCHANGED FROM PREVIOUS EXAMPLE\n\
    int getEnd( int );\nvoid displayResults( int, int ); //UNCHANGED FROM PREVIOUS\
    \ EXAMPLE\n\nint main( void )\n{\n    int fact;\n    int start;\n    int end;\n\
    \n    start = getStart();\n    end = getEnd( start );\n    while( start <= end\
    \ )\n    {\n        fact = calcFactorial( start );\n        displayResults( start,\
    \ fact );\n        start++;\n    }\n\n    return( 0 );\n}\n```\n\n课程标准说明：main\
    \ 函数中允许有限数量的控制结构（选择、重复），以确保由 main 函数进行程序中大部分函数调用。\n\n"
