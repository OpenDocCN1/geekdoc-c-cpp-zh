    printf(\"Your string [length %d]: %s\\n\", length, str1);\n```\n\n## 示例执行：\n\n\
    | 输入您的字符串 -> Purdue | 输入您的字符串 -> Go Purdue!!! |\n| :--- | :--- |\n| 您的字符串 [长度\
    \ 6]: Purdue | 您的字符串 [长度 13]: Go Purdue!!! |\n\n## 复制字符串，复制单个变量很容易，但字符串呢？我们可以使用赋值运算符吗？\n\
    \n```\nchar str1[SIZE];\nchar str2[SIZE];\ngetString(str1); //SEE USER-DEFINED\
    \ FUNCTION ON PREVIOUS PAGE.\nstr2 = str1;\nprintf(\"The string you entered was\
    \ %s.\\n\", str1);\nprintf(\"The copy of the string you entered is %s.\\n\", str2);\n\
    ```\n\n- 编译器生成的消息是什么？\n- 在上面示例中的表达式 str2 = str1 中，真正被赋值的是什么？\n\n此赋值试图强制 str2 放弃其已分配的内存，并引用与\
    \ str1 相同的内存。如果这是可能的，内存中仍然只会有一个字符串的副本。\n\n## 为什么编译器不批准此特定的赋值表达式？\n\n- 静态声明数组分配的内存在大小和位置上是固定的。\n\
    - 根据上述说法，我们可以说数组所引用的内存地址是常量。\n\n## 替代方案 - 使用 string.h 函数 strcpy\n\nstrcpy 函数将获取第二个参数并将其值复制到第一个参数。在此示例中，str1\
    \ 的内容被复制到 str2。\n\n```\nchar str1[SIZE];\nchar str2[SIZE];\ngetString(str1);\n\
    strcpy(str2, str1);\nprintf(\"Your input: %s\\n\", str1);\nprintf(\"Your output\
    \ copy: %s\\n\", str2);\n```\n\n## 输出：\n\n输入您的字符串 -> Go Purdue!\n您的输入: Go Purdue!\n\
    您的输出副本: Go Purdue!\n\n## 是否存在复制的数据多于内存中预留空间的问题？\n\n- 是的！strcpy 函数将继续复制字符，直到找到分隔符。请验证目标数组具有所需的容量！\n\
    \n## 比较两个字符串\n\n- 正如我们不能将一个字符串赋值给另一个字符串一样，我们也不能使用比较和关系运算符成功比较两个字符串是否相等。\n\n##\
    \ 示例：\n\n```\nchar str1[SIZE];\nchar str2[SIZE];\ngetString(str1);\nstrcpy(str2,\
    \ str1);\nif(str1 == str2)\n{\n    printf(\"The strings are equal\\n\");\n}\n\
    ```\n\n人们可能会假设，如果比较运算符比较字符串的内容，那么输入的任何值都会导致每次执行前面的代码段时都打印相等语句。\n输出是什么？无。\n这告诉我们，在使用关系或相等运算符比较两个字符串时，正在比较什么？\n\
    使用相等运算符的比较测试的是内存地址，而不是字符串数据。\n\n## 替代方案 - 使用 string.h 函数 strcmp\n\nstring.h 库中的这个第三个函数将接受两个字符串作为参数，并返回一个整数，指示两个字符串的不同之处。存储相同数据的两个字符串没有差异。\n\
    \n| 示例 | 说明 |\n|---|---|\n| 输入您的字符串 -> company<br>输入您的字符串 -> corporate<br>比较结果:\
    \ -5 | 在第一个示例中，第一个差异出现在第三个元素。此差异值由 strcmp 函数返回。第二个参数的元素减去第一个参数的元素。 |\n| 输入您的字符串\
    \ -> company<br>输入您的字符串 -> companion<br>输入您的字符串: 16<br>比较结果: 0 | 输入您的字符串 -> ABC123<br>输入您的字符串\
    \ -> ABC123<br>比较结果: 0 |\n| 输入您的字符串 -> ABC123<br>输入您的字符串 -> ABC123<br>比较结果: -18\
    \ | 计算差异时使用的不是差异之和，而是从最低索引到最高索引顺序中的第一个差异。 |\n| 输入您的字符串 -> ABC12<br>输入您的字符串 ->\
    \ ABC123<br>比较结果: -51 | 如果两个字符串的元素数量不同怎么办？ |\n| 输入您的字符串 -> ABC123<br>输入您的字符串 ->\
    \ ABC123<br>比较结果: -32 | 字符大小写有意义吗？ |\n\n```\nThe code:\nchar str1[SIZE];\nchar\
    \ str2[SIZE];\nint compare;\ngetString(str1);\ngetString(str2);\ncompare = strcmp(str1,\
    \ str2);\nprintf(\"Compare result: %d\\n\", compare);\n```\n\n问题：实现 ROT13 加密算法。ROT13\
    \ 实际上并不是一种加密算法，但通过此方法处理文本确实使其难以阅读。对于字母表前半部分的字符，我们加 13 将其旋转到后半部分。对于字母表后半部分的字符，我们减\
    \ 13 将其旋转到前半部分。非字母字符在此过程中不会更改。需要注意的是，加密过程与解密过程相同。\n\n输入您的字符串 -> Go Purdue!!!\n\
    原始字符串: Go Purdue!!!\n旋转后字符串: Tb Cheqhr!!!\n原始字符串: Go Purdue!!!\n\n![](img/e25602f5611b32eaf448a241a988eedc_209_0.png)\n\
    \n![](img/e25602f5611b32eaf448a241a988eedc_209_1.png)\n\n## 解决方案：\n\n```\n#define\
    \ SIZE 51\n\nvoid getString(char[]);\nvoid rot13(char[]);\n\nint main(void)\n\
    {\n    char str1[SIZE];\n    getString(str1);\n    printf(\"Original String: %s\\\
    n\", str1);\n    rot13(str1);\n    printf(\"Rotated String: %s\\n\", str1);\n\
    \    printf(\"Original String: %s\\n\", str1);\n    return(0);\n}\n```\n\n```\n\
    void rot13(char x[])\n{\n    int lcv;\n    for(lcv = 0; lcv < strlen(x); lcv++)\n\
    \    {\n        if((x[lcv] >= 'a' && x[lcv] <= 'z') || (x[lcv] >= 'A' && x[lcv]\
    \ <= 'Z'))\n        {\n            if((x[lcv] >= 'a' && x[lcv] <= 'm') || x[lcv]\
    \ <= 'M')\n            {\n                x[lcv] += 13;\n            }\n     \
    \       else\n            {\n                x[lcv] -= 13;\n            }\n  \
    \      }\n    }\n}\n```\n\n## 搜索子字符串\n\nstring.h 库中要介绍的最后一个函数（strstr）有能力在字符串中定位子字符串。\n\
    \nstrstr 函数接受两个内存地址作为参数，并返回子字符串在字符串中的位置。当找不到子字符串时，返回的值是一个定义的零，称为 NULL。\n\n如果函数返回一个地址，那么该值将被赋给哪种类型的变量？答案：字符指针。\n\
    \n## 问题 - 给定一个字符串和子字符串，确定子字符串在字符串中出现的次数。\n\n- 输入字符串 -> ATATATA\n- 输入子字符串 -> AT\n\
    - 子字符串 AT 在字符串 ATATATA 中出现 3 次。\n\n- 输入字符串 -> ATATATA\n- 输入子字符串 -> ATA\n- 子字符串\
    \ ATA 在字符串 ATATATA 中出现 3 次。\n\n## 解决方案：\n\n```\n#define SUB_INPUT 1\n#define STR_INPUT\
    \ 2\n#define SUBSTR 21\n#define STRING 50\n\nvoid getString(char[], int, int);\n\
    int ctStrings(char[], char[]);\n\nint main(void)\n{\n    char sub[SUBSTR];\n \
    \   char str[STRING];\n    int count;\n\n    getString(str, STR_INPUT, STRING);\n\
    \    getString(sub, SUB_INPUT, SUBSTR);\n    count = ctStrings(str, sub);\n\n\
    \    printf(\"The substring %s appears %d time(s) in the string %s.\\n\", sub,\
    \ count, str);\n\n    return(0);\n}\n```\n\n```\nvoid getString(char x[], int\
    \ option, int size)\n{\n    int index = 0;\n\n    if(option == SUB_INPUT)\n  \
    \  {\n        printf(\"Enter the substring -> \");\n    }\n    else if(option\
    \ == STR_INPUT)\n    {\n        printf(\"Enter the string -> \");\n    }\n\n \
    \   do\n    {\n        x[index++] = getchar();\n    }while(index < size && x[index\
    \ - 1] != '\\n');\n\n    x[index - 1] = '\\0';\n}\n\nint ctStrings(char str[],\
    \ char sub[])\n{\n    int ct = 0;\n    char *ptr;\n\n    ptr = strstr(str, sub);\
    \ //LOOK FOR SUB AT START OF str\n\n    while(ptr != NULL)\n    {\n        ct++;\n\
    \        ptr = strstr(ptr + 1, sub); //PERMITS OVERLAP\n        //ptr = strstr(ptr\
    \ + strlen(sub), sub); //NO OVERLAP\n    }\n\n    return(ct);\n}\n```\n\n"
