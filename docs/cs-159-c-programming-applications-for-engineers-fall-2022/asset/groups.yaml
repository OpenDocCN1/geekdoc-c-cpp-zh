  mdcn: "\n\n## 运行时错误\n\n这是程序运行时发生的任何错误。运行时错误可能导致崩溃。崩溃是导致程序执行意外停止的事件。导致崩溃的两种非常常见的运行时错误是段错误和浮点异常。为什么编译器没有检测到这些错误？编译器可能在代码编译完成且用户输入零作为将用于表达式分母的值之前，都不知道会发生除以零的尝试（浮点异常）。\n\
    \n更难诊断的错误是不会导致崩溃的运行时错误！此类错误通常是因为输出（结果）不符合预期而被发现。\n\n```\nLogical error example,\
    \ determine the average of three numbers:\naverage = x + y + z / 3;\naverage =\
    \ (x + y + z) / 3;\n```\n\n两条语句在语法上都是正确的；第一条语句不会导致崩溃，但会显示错误的值。第二条语句是没有逻辑错误的期望结果。\n\
    \n## 调试\n\n- 解决错误的过程称为调试。本学期我们将探讨调试错误的各种方法，包括：\n  - 在代码中插入诊断打印语句，以验证程序执行过程中特定时间点的预期值。\n\
    \  - 编写小段代码，完成你正在解决的较大问题中的子任务。\n  - 开发代表各种预期输入的测试用例。\n\n## 第 3 章 - C 程序结构\n\n\
    ## 表达式\n\n在 C 编程语言中，表达式始终归约为单个值。\n\n### 表达式术语回顾：\n\n- 运算符 - \"需要采取行动的特定语言语法标记。\"\
    \ 例如：+、-、*、/、/ 以及一些可能对你来说是新的其他运算符。如果从上面的定义中只能记住一件事，请关注\"特定语言\"，因为 C 编程语言使用运算符，它们的含义可能与你在数学或其他编程语言（即\
    \ MATLAB、Python、Excel）中看到的不同。\n- 操作数 - \"接收运算符作用的对象。\" 换句话说，就是被运算符作用的值。根据运算符的不同，评估操作可能需要一个、两个或多个操作数。\n\
    \n你应该以某种形式熟悉的另一个概念是运算符优先级。运算符的优先级决定 (1) 操作数属于哪个运算符，以及 (2) 它在表达式中被求值的顺序。教材的内封面列出了\
    \ C 语言的优先级顺序。\n\n### 打印表达式求值：\n\n```\nint a = 17; //FIRST OPERAND\nint b = 5;\
    \ //SECOND OPERAND\nprintf(\"%d + %d = %d\\n\", a, b, a + b);\nprintf(\"%d / %d\
    \ = %d\\n\", a, b, a / b);\nprintf(\"%d %% %d = %d\\n\", a, b, a % b);\n```\n\n\
    第三个 printf 的格式字符串中为什么有两个 % 字符？\n\n- 因为 % 在 printf 的格式字符串中已经有特殊含义，所以需要两个才能在屏幕上显示一个。\n\
    \n注意：取模运算符的两个操作数必须是整型。\n\n### 赋值表达式\n\n赋值表达式求值赋值运算符 (=) 右侧的操作数，并将该值保存到左侧变量的内存中。\n\
    \n注意：赋值表达式中的左操作数必须是单个变量。\n\n### 简单赋值示例\n\n```\nint x;\nint y = 2;\nx = 3 * 4;\n\
    x = y * 3;\nx = x + y;\n```\n\n课程标准：运算符和操作数之间加空格！\n\n### 复合赋值示例\n\n- 将一个值添加（或应用另一种常见的数学运算）到变量，并将新值存回变量，这是常见的做法。\n\
    \n例如，x = x + 3；\n\n- 从内存角度考虑上面发生的情况。在右侧，我们从内存中检索 x 的值，加上 3，然后将和存回由 x 表示的内存位置。\n\
    \n复合赋值示例：\n\n- x += 3; // SAME AS x = x + 3;\n\n| 复合赋值表达式 | 等效的简单赋值表达式 |\n| :---\
    \ | :--- |\n| x += expression | x = x + expression |\n| x -= expression | x =\
    \ x - expression |\n| x *= expression | x = x * expression |\n| x /= expression\
    \ | x = x / expression |\n| x %= expression | x = x % expression |\n\n### 示例：\n\
    \n```\nint x = 3;\nint y = 5;\nint z = 7;\nfloat a = 2.5;\nfloat b = 5.0;\nx +=\
    \ 4;\ny /= 2;\na *= 2;\nb /= 2;\nz %= 4;\nprintf(\"x = %d y = %d z = %d\\n\",\
    \ x, y, z);\nprintf(\"a = %.2f b = %.2f\\n\", a, b);\n```\n\n### 示例 #2：\n\n```\n\
    int x = 3;\nint y = 5;\nx /= x + y;\nprintf(\"x = %d y = %d\\n\", x, y);\n```\n\
    \n结果是 x = x / x + y 还是 x = x / (x + y)？\n\n答案：在上述情况下，表达式将被解释为：x = x / (x + y)\n\
    \n这告诉你关于 /= 和 + 的运算符优先级的什么信息？\n\n加法运算符的优先级高于复合赋值运算。\n\n## 前缀 & 后缀运算符\n\n在许多程序中都需要计数，这通常以\
    \ +1 或 -1 的增量进行。这两种表示法，前缀和后缀，提供了比简单或复合等价形式更短的替代方案，但也可以与其他表达式结合使用，正是在那里我们发现运算符相对于操作数的位置会产生影响。\n\
    \n### 后缀表达式涉及一个后跟运算符的操作数。\n\n```\nint x = 0;\nx++; //POSTFIX INCREMENT\nprintf(\"\
    The value of x is: %d\\n\", x);\nx--; //POSTFIX DECREMENT\nprintf(\"The value\
    \ of x is %d\\n\", x);\n```\n\n### 前缀表达式涉及一个后跟操作数的运算符。\n\n```\nint x = 0;\n++x;\
    \ //PREFIX INCREMENT\nprintf(\"The value of x is: %d\\n\", x);\n--x; //PREFIX\
    \ DECREMENT\nprintf(\"The value of x is %d\\n\", x);\n```\n\n### 为什么上面的后缀和前缀示例之间没有可识别的差异？\n\
    \n- 当在没有其他表达式的行上使用时，后缀和前缀操作是可互换的。\n- 此外，在相同条件下，简单或复杂的赋值可以替代后缀或前缀操作。\n\n| 后缀结果：\
    \ | 前缀结果： |\n| --- | --- |\n| | |\n\n演示前缀和后缀操作之间差异的示例：\n\n```\nint x = 0;\nprintf(\"\
    The value of ++x is: %d\\n\", ++x);\nx = 0; //RESET x\nprintf(\"The value of x++\
    \ is: %d\\n\", x++);\nprintf(\"The final value of x: %d\\n\", x);\n```\n\n## 单个表达式中的多次修改\n\
    \n```\nint x = 0;\nint y = 0;\nint z = 0;\n\ny = x++ + ++x - --x - x--;\nprintf(\"\
    x: %d y: %d\\n\", x, y);\n```\n\n不同的编译器可能以不同方式解释诸如 y = x++ + ++x - --x - x-- 这样的表达式。一般来说，即使你确定了操作在我们服务器上的精确定义，未定义的操作也不应保留在你的程序中。\n\
    \n> 警告：在 C 编程语言中，如果表达式中对单个变量进行多次修改，结果是未定义的。\n\n## 混合和单一数据类型表达式\n\n我们已经看到过表达式求值的示例，如果在数学中（或使用计算器、Excel\
    \ 或 MATLAB），结果会与我们预期的不同。\n\n```\n3 / 2 = 1\n```\n\n- 上面的示例是另一种情况！在 C 编程中，两个整数值的除法必须得到另一个整数！\n\
    \n但是，如果像下面的语句那样混合类型，余数会保留在和中。\n\n```\n3 + 2.1 = 5.1\n```\n\n前一个示例中的混合类型表达式会将整数\
    \ 3 隐式转换为浮点数 3.0，使得表达式仿佛存在两个浮点数值一样进行求值。在将 3 转换为 3.0 并添加到 2.1 之前，你发现有什么问题吗？\n\n\
    - 不，没有潜在的数据丢失，这种隐式转换被称为安全的。\n\n"
