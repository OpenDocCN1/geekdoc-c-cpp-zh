  mdcn: "\n\n## 基本函数术语\n\n所有编写良好的程序背后都有相同的基本组件，即函数。函数将是先前描述的单个子任务的实现，并包含其解决方案。什么是函数？根据Gilbert和Forouzan的教材，“一个命名的代码块，用于在程序中执行一个过程；一个可执行的代码单元，由标题、函数名和主体组成，旨在在程序中执行一个任务。”\n\
    \n- 当请求函数的服务时，必须调用它。发出调用的函数称为调用函数，被调用的函数称为被调用函数。\n- 调用函数和被调用函数之间通常需要交换数据。\n- 向函数发送（传递）数据的行为称为参数传递。\n\
    - 函数可能完成计算并希望与调用函数共享结果。我们将此称为从函数返回一个值。\n- 在C编程语言中，函数最多只能返回一个值。\n\n```c\n#include<stdio.h>\n\
    \nvoid greeting (void); //FX DECLARATION\n\nint main (void)\n{\n//LOCAL DECLARATIONS\
    \ – NONE\n//EXECUTABLE STATEMENTS\n    greeting ();\n//FX CALL\n    return (0);\n\
    }\n\n//FUNCTION DEFINITION\nvoid greeting (void)\n{\n//LOCAL DECLARATIONS – NONE\n\
    //EXECUTABLE STATEMENTS\n    printf (\"Hello World!\\n\");\n    return;\n}\n```\n\
    \n在上面的示例中，我们观察到一个包含两条语句的main函数，一条语句是调用名为greeting的函数，第二条语句是终止返回 `return (0);` 语句。当main调用函数greeting时，程序控制权离开main。函数greeting将执行其两条语句，将“Hello\
    \ World!”打印到监视器上，然后将程序控制权返回给调用函数main。main函数将从函数调用后中断的地方继续执行，在此例中，main的下一条语句将是终止返回(0)语句。\n\
    \n- 当调用函数时，程序中指令执行的顺序现在会从main跳转到greeting。\n- 会“记住”在main中进行函数调用的位置，以便当被调用函数（greeting）终止时，main中的语句执行将继续执行函数调用之后的语句。\n\
    \n## 用户定义的函数\n\n与变量一样，函数必须既声明又定义。\n\n函数声明将出现在程序的全局声明部分中。\n\n函数声明语句将告诉编译器：\n\n\
