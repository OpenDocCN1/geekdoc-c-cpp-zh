    ```\n\n- 必须在 Vocareum 中使用 vi 的 :hfx 命令插入作业分配标题。\n- 对于函数，在标题中注释参数（函数接收的值）很重要！函数定义的第一行没有足够空间注释参数，必须在此处包含。\n\
    \n## Object Names / Identifiers\n\n- 在本课程中，我们将以下视为对象：**变量**、**函数**、**符号/定义常量**。必须为对象命名，以反映其在程序中的用途。\n\
    \n| int x;<br>int y;<br>int z; | 课程标准：每行仅声明一个变量！ |\n\n- 仅根据变量名，你能确定变量 x、y 和 z\
    \ 在程序中完成什么吗？也许它们存储 3D 点的信息？如果程序不包含 3D 坐标数据，那么将 x、y 和 z 用作变量名是不明确的。\n- 对象的单字符标识符很少有意义。合理的例外是用于简单计数或访问数组元素的循环控制变量。\n\
    - 在本课程中，我们不会使用以下划线开头标识符的做法。\n\n| int numStudents;<br>float objectMass;<br>char\
    \ courseGrade; | 相关变量、常量和函数名称有助于你试图实现的逻辑的文档化和可读性。 |\n\n## Variable Initialization\n\
    \n```\nint numStudents = 0;              //OKAY TO KEEP HERE\nfloat objectMass\
    \ = calcMass(acceleration, velocity); //MOVE TO EXECUTABLES\n```\n\n- 一般来说，在用户定义函数的局部声明部分初始化声明的变量是可以接受的。如果用于初始化变量的表达式比常量赋值更复杂，则最好在函数的可执行语句部分为变量赋予其第一个值。\n\
    \n## Symbolic/Defined Constants\n\n- 符号/定义常量的标识符选择必须全部大写。此标准允许任何程序员区分表达式中常见的操作数的变量、函数调用和常量。\n\
    - 在程序顶部紧接作业标题之后定义所有符号/定义常量。\n- 由于使用符号/定义常量可以改善程序的文档化，课程标准是你应尝试**最大化**使用符号/定义常量并**最小化**使用字面常量（参见第\
    \ 3 章）。\n\n## Commenting\n\n在 C 编程语言中，有两种可能的注释实现：\n\n- 单行注释 // 将指示编译器忽略 // 之后直到行尾的所有内容。\n\
    - 多行注释 /* */ 将指示编译器忽略 /* 和 */ 之间的所有内容。有关此类注释的示例，请参见上面的标题。在 C 编程语言中，多行注释不能嵌套。\n\
    \n## 必须注释的内容？\n\n- 你声明的每个变量都必须有一个简短的注释来描述其在程序中的用途！\n  - 在函数的局部声明部分，在变量声明的右侧添加注释。\n\
    - 在给定函数中，预期会记录偶尔出现的复杂代码段，以告知他人你试图实现的逻辑。\n  - 例如：建议在任何重要的选择或重复结构之前放置一两行注释。\n\n\
    ## 缩进\n\n必须将结构体内的所有代码缩进**两个（额外）空格**！几乎不应该在编辑器的第一列开始一行代码！以下是根据我们的标准正确缩进的一些常见结构：\n\
    \n| for(x = 1; x <= MAX; x++) {<br>  printf(\"%d\", x);<br>} | if (y == 3) {<br>\
    \  for(g = 0; g > MIN; g--) {<br>    y = y - g;<br>  }<br>} | do {<br>  e = m\
    \ * c * c;<br>  avg = sum/number;<br>}while(r == 0); |\n\n## 更多缩进示例：\n\n| 正确 |\
    \ 不正确 | 也不正确 |\n|---|---|---|\n| if(x == 3 || y == 2) {<br>  z++;<br>  a = a -\
    \ 1;<br>} | if(x == 3 || y == 2) {<br>z++;<br>a = a - 1;<br>} | if(x == 3 || y\
    \ == 2) {<br>z++;<br>a = a - 1;<br>} |\n\nSwitch 结构将按 C 文本中的示例缩进 - 参见第 258 页。\n\
    \n## 空格\n\n- 请在各部分之间放置一个额外的行，以帮助“分组”代码。\n- 平衡使用额外行和在代码中不放置任何行。\n  - 不需要对所有代码行进行双倍行距或包含多个连续空行。\n\
    - 要求在运算符和操作数之间放置一个空格，例如：`y = y - g;`\n\n## 编程标准\n\n编程标准有许多动机；在本课程中，此处描述的此类标准的目的是帮助你为未来的编程工作养成良好习惯。对一些学生来说，此要求将需要打破之前养成的编程习惯。\n\
    \n**什么使习惯或编程实践不那么可取？** 任何使初学者编程更加困难、增加软件被黑客攻击或崩溃的脆弱性、不必要地创建复杂代码，或代表编程语言即将过时的功能的事物。\n\
    \n## 保持局部声明与可执行语句分开\n\n- 本课程中 `gcc` 编译器的默认设置要求所有变量都必须在可执行语句开始之前声明。有关更多信息，请参见 C\
    \ 文本第 2 章第 2 章中的图 2-2。\n\n## 作用域\n\n- 变量绝不允许具有全局作用域。\n- 你需要与另一个函数共享变量吗？你需要变量值在函数内更改并在函数终止后保留该更改吗？\n\
    \  - 你必须了解如何将变量/值传递给用户定义函数并从中返回它们。\n  - 我们保留为实现全局变量分配**零分**的权利。\n- 在本课程中，我们期望所有函数声明都将具有全局作用域。\n\
    - 不要重复使用与具有重叠作用域的两个对象的标识符。\n\n## 符号/定义常量和其他预处理器指令\n\n- 所有预处理器指令必须放在程序顶部，紧跟在文件适当的作业标题下方。\n\
    - 你可以在 C 编程教材（附录 G）中阅读更多关于符号/定义常量的内容，但符号定义常量的一个目的是在未来修改程序要求时，使你作为程序员的工作更加容易。\n\
    \n## { 和 } 的使用\n\n- 你可能在 C 编程教材中观察到，在某些情况下，可以省略 `if`、`for` 和 `while` 等结构体周围的花括号。不要养成或继续这种习惯！初学者已经很难配对花括号，而花括号位置错误可能是最难解决的错误之一。\n\
    - 我们将在第 5 章（C 编程教材第 245 页，图 5-14）讨论**悬挂 else** 问题，作为当你像我们要求的那样省略花括号时难以调试的一个困难逻辑错误的示例。当你试图理解教材第\
    \ 8 章中编码的排序算法时，你也会遇到书中缺少 { 和 } 的情况。\n\n> 对于 C 中所有相关的选择和重复结构，要求使用 { 和 }。\n\n##\
    \ 循环的正确使用\n\n- 仅将 `for` 循环用于计数器控制的过程。\n- 每个 `for` 循环都要使用所有三个表达式。不要留空表达式或在任何表达式中放置无意义的语句，例如\
    \ `x = x`。\n- 在本课程的 `for` 循环中，逗号运算符的使用可能是不必要的。请参见 C 编程教材第 323 页。\n- 使用无限循环将违反禁止使用控制强制语句的预期。\n\
    - 递归仅可用于计数器控制的过程。\n\n## 控制强制语句\n\n- **你可能在教材中观察到控制强制语句的使用，但在本课程中禁止使用。** 通常有更好的方法来指导程序的控制，而无需使用以下语句之一：\n\
    \  - `exit`、`goto`、`break`（仅允许与 `switch` 结构一起使用）、`continue`\n  - **同一函数中的多个 return\
    \ 语句。** 函数，就像我们将在讲座中讨论的流程图一样，必须具有共同的（只有一个）起点和终点。使用多个 `return` 语句使单个函数（算法）具有多个终点。\n\
    \n## 标准库和函数\n\n- 你可以使用课堂中介绍的标准 C 库中的许多函数。**你有责任**就你希望使用但课堂中未讨论过的函数或库向课程工作人员咨询。\n\
    \n## 用户定义函数\n\n一旦我们介绍用户定义函数（第 4 章），程序的 `main` 函数中将只允许以下内容：\n\n- 声明需要在函数之间传递的变量。\n\
    - 由 `main` 调用的函数。\n- 最少量的控制结构（循环、选择），以保持 `main` 作为程序的控制中心。\n\n`main` 函数旨在成为程序的\
    \ _主函数_，大多数函数调用应源自 `main`。程序中定义的大多数数据应在 `main` 中完成。\n\n根据函数的定义，每个函数只能有一个单独（单一）的特定任务。在相关作业中未能很好地利用用户定义函数将导致不给予部分学分。\n\
    \n函数定义第一行中声明的所有（参数）变量必须具有显式数据类型。\n\n按地址传递单个值应满足以下条件：\n\n- 当需要修改多个值，并且该修改在被调用函数终止后保留在调用函数中时。\n\
    - 函数继续满足**功能内聚**的定义，即在所解决的较大问题中仅完成单一基本任务。\n\n## 数组声明\n\n在我们介绍 C 编程教材第 9 章和第 10\
    \ 章的动态内存分配主题之前，所有数组都将是**静态**的（固定长度）。应用第 478 – 479 页示例中所示的变长数组将违反课程标准，因为它允许函数中的局部声明和可执行语句重叠。\n\
    \n- 在数组声明中使用变量来表示数组大小是不可接受的。\n- 在所有作业中声明数组时，必须使用符号/定义常量。\n\n"
