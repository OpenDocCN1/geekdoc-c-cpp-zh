    ## Structured Programming – What is it?


    There are three fundamental ideas in structured programming: selection, repetition,
    and sequence.


    - Sequence was the topic of chapter 4 (user-defined functions). The use of functions
    permit the individual instructions of a program to be executed in an order other
    than from the first statement to the last statement, and some statements may be
    executed more than once.

    - Selection is the topic of chapter 5. Selection constructs will allow instructions
    to be executed based on a given criteria and other instructions to be excluded.
    This is the first point in the semester where not all code in a program may be
    executed in each test case.

    - Repetition is the topic of chapter 6. Often a set of instructions needs to be
    repeated while a particular condition is met, or until a condition is met. Repetition
    constructs allow the use of logic to specify conditions and to identify those
    instructions to repeat.


    ## Chapter 5 – Selection


    While functions permit us to make modular code and shift control (alter sequence
    of code executed) between functions to accomplish individual tasks, what we need
    next are the abilities to select and repeat code. It is selection that is the
    topic of chapter 5.


    Up to this point in the course we have always observed all statements in a program
    being executed at least one time.


    - While user-defined functions allow us to alter the sequence at this point in
    the course when we make a function call all of the code in that function is executed.

    - The idea of selection involves selecting code to execute or exclude based on
    a condition.


    ### Logical Data


    A piece of data is called logical if it conveys the value of true or false. Logical
    data is generated by a logical expression. Logical expressions are utilized in
    both selection and repetition constructs. The C programming language did not traditionally
    have a data type specifically for logical data and instead would utilize a numeric
    type to represent true and false.


    > Note: We often use 1 to represent a true value, however, ANY non-zero value
    is considered true.


    ### Logical Operators


    There are three main logical operators. Operands to logical operators are considered
    for their logical status (true or false).


    | Operator | Character(s) | Description | Precedence |

    |---|---|---|---|

    | NOT | ! | Unary operator that changes a true value to false and a false value
    to true. | |

    | AND | && | Binary operator that is true only when both of its operands are true
    and is false in all other cases. | |

    | OR | || | Binary operator that is false only when both of its operands are false
    and is true in all other cases. | |


    ### Logical Operators Truth Table:


    | | NOT | | AND | | | OR | | |

    |---|---|---|---|---|---|---|---|---|---|

    | | x | !x | x | y | `x && y` | x | y | `x || y` |

    | | TRUE | FALSE | TRUE | TRUE | TRUE | TRUE | TRUE | TRUE |

    | | FALSE | TRUE | TRUE | FALSE | FALSE | TRUE | FALSE | TRUE |

    | | | | FALSE | TRUE | FALSE | FALSE | TRUE | FALSE |

    | | | | FALSE | FALSE | FALSE | FALSE | FALSE | FALSE |


    ### Evaluating Logical Expressions


    - That is, evaluating expressions that contain logical operators.

    - When evaluating mathematical expressions it would be the rare exception that
    you would not consider every operator.

    - How can we evaluate an expression prior to evaluating every operator of the
    expression? With logical expressions there are only two possible results and we
    will see that when the result of the expression can be determined the evaluation
    will stop, or short-circuit, prior to evaluating every operator when doing so
    is unnecessary.


    ### The short-circuit method:


    ### Example (similar to) Program 5-1 Form text:


    ```

    int a = 1;

    int b = -1;

    int c = 0;

    printf("%d%d %d %d = %d\n", a, b, a && b);

    printf("%d%d %d %d = %d\n", a, c, a && c);

    printf("%d%d || %d = %d\n", a, b, a || b);

    printf("%d%d || %d = %d\n", a, c, a || c);

    printf("%d%d %d = %d\n", !a, !c, !a || !c);

    printf("%d%d %d = %d\n", !a, !c, !a && !c);

    printf("%d%d %d = %d\n", !a, !c, !(a && !c));

    printf("b++ || ++c = %d\n", b++ || ++c);

    printf("a = %d b = %d c = %d\n", a, b, c);

    ```


