  - "[PAGE 102]\n\n# Basic Function Terminology\n\nBehind ALL WELL-WRITTEN programs\
    \ is the same fundamental component, the function. The function will be the implementation\
    \ and contain the solution of the single sub-task previously described. What is\
    \ a function? According to the Gilbert and Forouzan text, “A named block of code\
    \ that performs a process within a program; an executable unit of code, consisting\
    \ of a header, function name, and a body, that is designed to perform a task within\
    \ the program.”\n\n+   - When the services of a function are requested it must\
    \ be called. The function making the call is known as the calling function and\
    \ the function being called is called function.\n+   - It is common that data\
    \ needs to be exchanged between the calling and called functions.\n+   - The act\
    \ of sending (passing) data to a function is known as parameter passing.\n+  \
    \ - It is possible that the function may complete a calculation and wish to share\
    \ the result with the calling function. We refer to this as returning a value\
    \ from a function.\n+   - In the C programming language, a function is only capable\
    \ of returning at most one value.\n\n```\n#include<stdio.h>\n\nvoid greeting (void);\
    \ //FX DECLARATION\n\nint main (void)\n{\n//LOCAL DECLARATIONS – NONE\n//EXECUTABLE\
    \ STATEMENTS\n    greeting ();\n//FX CALL\n    return (0);\n}\n\n//FUNCTION DEFINITION\n\
    void greeting (void)\n{\n//LOCAL DECLARATIONS – NONE\n//EXECUTABLE STATEMENTS\n\
    \    printf (\"Hello World!\\n\");\n    return;\n}\n```\n\nIn the above example\
    \ we observe a main function that contains two statements, one statement is a\
    \ call to a function named greeting and the second statement is the terminal return\
    \ [return (0); ] statement. When the function greeting is called by main control\
    \ of the program leaves main. The function greeting will execute its two statements\
    \ which will print Hello World! to the monitor and then return control of the\
    \ program to the calling function main. The main function will continue from where\
    \ it left off following the function call, in this case, main’s next statement\
    \ will be the terminal return (0) statement.\n\n+   - The sequence of which instructions\
    \ are executed in the program now jumps from main to greeting when the function\
    \ is called.\n+   - It is “remembered” where in main the function call was made\
    \ so that when the called function (greeting) terminates the execution of statements\
    \ in main will continue with the statement following the function call."
  - '[PAGE 103]


    # User-Defined Functions


    As with variables, functions must be both declared and defined.


    The function declaration will appear in the global declaration section of the
    program.


    The function declaration statement will tell the compiler:


    1. The type of value being returned from the function.

    2. The name of the function.

    3. The data being sent to the function. The number of parameters, type of parameters,
    and order of parameters is determined by the declaration of the function.


    The function definition contains the code needed to complete the task.


    ## What is the compiler looking for?


    * All three components of a user-defined function, (declaration, definition, and
    call) are in agreement.


    ## What is the error generated when the definition cannot be found?


    undefined reference


    ## What is the error generated when the declaration cannot be found?


    warning: implicit declaration of function


    # Basic Function Designs


    1. A function with no parameters that returns no value.

    2. A function with no parameters that returns a value.

    3. A function with parameters that returns a value.

    4. A function with parameters that returns no value.


    ## What is “void” about a void function?


    * Such a function does NOT return a value.


    | | Yes Parameters | No Parameters |

    |---|---|---|

    | Yes Value Returned | | |

    | No Value Returned | | |


    ## What does it mean to describe a function by a data type?


    * Describing a function by a data type is a reference to the type of value that
    it returns.'
