    \ + 1] = temp;\n            } //END OF IF\n        } //END OF NEIGHBOR COMPARING\
    \ LOOP\n    } //END OF PASSES LOOP\n} //END OF FUNCTION\n```\n\n## 总结思考\n\n- 要保证包含\
    \ N 个元素的数组已排序，需要多少次遍历？\n  - 完成排序任务需要 N-1 次遍历。\n\n- 为什么数组可能在保证排序所需的遍历次数之前就达到有序状态？\n\
    \  - 数据的初始状态使得完成任务所需的排序遍历次数少于 N - 1 次。\n\n- 这些排序算法是否经过优化，可在数据达到有序状态时结束？\n  - 不是。它们可以优化吗？可能可以，但我们必须小心，不要添加提前终止的逻辑，因为这可能比完成\
    \ N - 1 次遍历需要更多的努力。\n\n## 对于下面每个算法，6（六）个元素数组的已排序列表中有多少个元素？\n\n| 遍历次数 | 选择 / 冒泡\
