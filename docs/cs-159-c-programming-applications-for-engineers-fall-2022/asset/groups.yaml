    \n- 错误分类：\n- 语法错误\n- 逻辑错误\n- 每当遇到错误时，尝试回答以下问题：\n- 错误何时发生？\n- 你对错误有什么观察？\n\n##\
    \ 语法错误\n\n当你尝试编译 C 代码时，会意识到存在语法错误。也可以说语法错误是编译时错误。通常，此错误是由于你犯了违反 C 编程语言语法规则的错误，导致编译器停止工作。\n\
    \n- 常见的语法错误包括分号位置错误、未配对所有引号以及其他拼写错误。\n- 警告是编译器提供的反馈，表明你可能犯了错误。所有警告都应在提交作业前修复。如果你正确设置了帐户，则将使用警告选项进行编译。如果未启用此选项，或使用备用编译器，你可能不会意识到任何警告。\n\
    \n## 可执行文件的创建\n\n当编译器因语法错误而必须终止工作时，不会创建新的可执行文件 (a.out)。关键字是 error，它通常包含在编译器生成的消息中。如果编译器仅报告警告，那么很可能会创建新的可执行文件\
    \ (a.out)。发出警告时，编译器已检测到语法的潜在误用，这在程序执行时通常会表现为逻辑错误。\n\n## 警告消息示例：\n\n```\ntest.c:\
    \ In function 'main':\ntest.c:10: warning: 'ct' is used uninitialized in this\
    \ function\n```\n\n"
