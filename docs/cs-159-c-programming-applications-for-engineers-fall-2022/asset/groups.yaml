  mdcn: "\n\n编译过程中有一个特别值得我们关注的阶段：\n\n- 预处理器 - 读取源代码并为翻译器做准备。有一种称为预处理指令的特殊指令，你可以将其提供给预处理器，以便为翻译准备源代码。\n\
    \n在我们的服务器上，编译过程的所有步骤都通过一条指令完成，这使得许多步骤对程序员是透明的。\n\n## 代码实现过程\n\n## 程序执行（测试/运行可执行文件）\n\
    \n编译成功后将创建一个可执行文件。默认情况下，该可执行文件的名称为 a.out。要执行或运行程序，只需在 UNIX 提示符下输入 a.out。假设你在测试程序时位于与\
    \ a.out 文件相同的目录中。\n\n每次修改源文件后，都必须重新编译代码并创建一个新的 a.out，以查看源代码中反映的更改。新的可执行文件将替换任何先前存在的文件。在大多数情况下，不希望保留旧的可执行文件。\n\
    \n- 如果程序编译失败，将不会创建新的可执行文件。\n\n- 失败的编译尝试可能不会导致现有的 a.out 文件被删除/移除。\n\n## 程序开发\n\n\
    我们在 CS 159 中的目标：能够以逻辑算法的形式开发解决方案来解决问题，而无需考虑你可能使用的编程语言的任何特定语法。\n\n接触良好的编程实践对于介绍设计“产生正确结果、设计良好、高效且遵循课程文档和编程标准的程序”所需的方法非常重要。\n\
    \n## 结构图\n\n- 大型程序是由许多相互关联的部分组成的复杂结构，必须经过精心设计。\n- 结构图展示了我们将如何将较大的问题分解为逻辑子问题，以及数据将如何在这些模块之间流动。\n\
    \n## 流程图\n\n- 流程图的目的是以可视方式描述单个函数（较大问题的较小任务）的逻辑。\n- 应该为结构图中识别的每个子问题开发一个流程图。\n\n\
    在规划上投入的每一步都将帮助你消除日后解决起来往往非常耗时的逻辑错误。\n\n问题：给定贷款金额、年利率和贷款期限（年），确定每月还款额。\n\n## 步骤\
    \ #1 – 程序规定了什么？\n\n- 输入 – 三个值。贷款金额、年利率和期限。输出 – 每月还款额。\n\n## 步骤 #2 – 分析问题\n\n我们需要哪种数学运算？\n\
    \n| 变量 | 描述 | 表达式 |\n|---|---|---|\n| years | 贷款期限（年）。 | 用户输入 |\n| numMonths |\
    \ 贷款的月数。 | years * 12 |\n| annualRate | 贷款的年利率（百分比）。 | 用户输入 |\n| monthlyRate |\
    \ 月利率（小数）。 | (annualRate / 12) / 100 |\n| loanAmount | 要借款的总金额。 | 用户输入 |\n| P\
    \ | | pow((1 + monthRate), numMonths) |\n| Q | | (P / (P - 1)) |\n| monthPayment\
    \ | 每月还款额。 | loanAmount * monthRate * Q |\n\n## 步骤 #3 – 设计软件解决方案\n\n正是在这里，我们考虑为解决问题必须实现的单个步骤或指令。\n\
    \n## 流程图符号/指令类型\n\n| 符号 | 描述 | 符号 | 描述 |\n| :--- | :--- | :--- | :--- |\n| 终止符\
    \ - 算法的开始和结束 | 条件语句 • 始终标记你的真路径和假路径！ | 课程标准：本课程只允许一个起点和终点（终止符）。所有其他实现都违反标准。 |\
    \ 重复结构 • 始终标记你的真路径和假路径！ |\n| 赋值语句/表达式 • 包括函数调用！ | | 指定输入和/或输出数据 • 不必担心宽度修饰符和转换代码。\
    \ | 连接符 • 因为纸张在任何维度上都不是无限的。 |\n\n你会注意到在 C 语言教材中，接受（读取）输入时没有描述性提示。如果不明显，在 I/O 符号中至少引用变量名称是个好主意。\n\
    \n## 继续编写、保存、编译、测试、修改...\n\n- 流程图在 C 语言教材的附录 C 中有讨论。使用的符号可能适用于任何编程语言。\n\n- 测试。除了所有作业中提供的示例执行外，你或你的小组（针对实验作业）应考虑创建额外的测试用例，以验证解决方案的正确性和效率。\n\
    \n- 改进是问题解决过程中的一个重要但常被忽视的步骤。你的第一个解决方案不一定是最好的，对算法的进一步改进可能提高程序的效率并消除任何先前未观察到的错误。\n\
    \n## 首先处理输入：\n\n![](img/e25602f5611b32eaf448a241a988eedc_78_0.png)\n\n## 继续计算并以输出结束：\n\
    \n![](img/e25602f5611b32eaf448a241a988eedc_78_1.png)\n\n| 预处理器的特殊指令，告诉它如何为编译准备你的程序。\
    \ | 将对程序所有部分可见（可用）的“对象”的声明。 | 课程标准：变量绝不能作为全局变量。 | 最后一部分代表函数。C 程序由一个或多个函数组成，其中一个必须命名为\
    \ main。 | 课程标准：函数的两个部分绝不能重叠！ |\n|---|---|---|---|---|\n\n其他函数将在第 4 章中介绍。\n\n##\
    \ 我们的第一个程序\n\n```\n#include<stdio.h>\nint main(void)\n{\n    printf(\"Hello World!\\\
    n\") ;\n    return(0) ;\n}\n```\n\n不要将 stdio 与 studio 混淆！\n\n## 以上程序的分析\n\n##\
    \ 预处理指令部分\n\n- 唯一的预处理指令语句是 #include<stdio.h>\n- 此特定语句请求包含一个标准库（stdio.h），以允许程序中的标准输入/输出函数（例如\
    \ printf）。\n- stdio.h 库将出现在你本学期编写的所有 C 程序中。其他库，例如 math.h、stdlib.h、ctype.h 和 string.h\
    \ 将在本学期介绍。有关库和可用函数的列表，请参阅 C 语言教材的附录 F。\n\n## 全局声明部分\n\n- 此程序中没有全局声明。\n- 你的程序中绝不会有全局变量声明。\n\
    - main 函数不需要声明，并且由于没有其他用户定义的函数，此部分保持为空。\n\n> 始终记住：声明部分和执行部分绝不能重叠！你必须在可执行语句开始之前完成所有声明。\n\
