    # Advanced Topic – Recursion


    Recursion is the alternative technique of repetition. The definition of recursion
    applies to a function which calls itself. Solutions to repetition problems that
    use loops are referred to as iterative solutions. As with loops the function calls
    cannot continue infinitely. The condition when another call is to be made is the
    recursive case. When no more calls are to be made then the base case has been
    reached.


    Remember, control of a program always returns from the called function to the
    calling function. In addition to the control of the program a value may be returned
    as well.


    The factorial is one of the most common first examples given to demonstrate the
    use of recursion.


    Consider how a factorial for a number n is calculated: n * (n – 1) * (n – 2) *
    ... * 2 * 1


    You could also say that n! is equivalent to n * (n – 1)! for n > 1, but what about
    when n = 1? It is at this point where we find our base case or a definition that
    when n = 1 then n! = 1.


    Let''s take 4! as an example:


    +   4! = 4 * 3!

    +   3! = 3 * 2!

    +   2! = 2 * 1!

    +   1! = 1'
