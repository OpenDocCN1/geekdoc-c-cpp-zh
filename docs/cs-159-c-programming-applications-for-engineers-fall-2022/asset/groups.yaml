    \ | |\n\n## 排序简介\n\n通常数据需要排序才能高效处理。当考虑医疗记录、学生学业记录或银行记录等数据时，这一点显而易见。如果不按某个共同字段（姓氏或身份证号）对数据进行排序，当人数、学生数或银行客户数量变大时，将难以定位和访问所需记录。\n\
    \n在我们开始学习以下简单排序算法之前，请先接受这个免责声明：最简单的排序算法性能较差。我们向初学者介绍它们，因为它们相对容易理解、编写、测试和调试。要获得良好的性能，通常需要更复杂的算法；此类算法需要过于复杂的数据结构，不适合本课程。\n\
    \n## 交换值\n\n- 排序可能需要将数组中顺序错误的值进行交换或互换。例如，交换索引 0 和索引 3 处的两个元素。\n\n```\nint x[8]\
    \ = {12, 17, 11, 9, 21, 13, 19, 16};\n```\n\n```\nx[0] = x[3];\n```\n\n```\nx[3]\
    \ = x[0];\n```\n\n## 数组中交换元素的正确方法：\n\n```\ntemp = x[0];\n```\n\n```\nx[0] = x[3];\n\
    ```\n\n```\nx[3] = temp;\n```\n\n在解释本学期将学习的排序算法之前，我们需要介绍几个常见术语。\n\n- 列表 - 数组将被分为未排序列表和已排序列表。每个算法的目标是将数据从未排序列表移动到已排序列表。\n\
    \n- 遍历 - 将元素从未排序列表移动到已排序列表的过程。对大多数数据集进行排序需要多次遍历。[选择排序和冒泡排序的最后一次遍历将偏离这一一般规则。]\n\
    \n## 选择排序\n\n算法描述：遍历未排序列表以找出最小（或最大）值。将此值与未排序列表中与已排序列表相邻的值交换。重复此过程，直到未排序列表为空。\n\
    \n## 冒泡排序\n\n- 算法描述：遍历未排序列表并比较相邻元素。每当发现一对顺序错误的元素时，交换它们。\n\n一次遍历包括比较未排序列表中所有相邻元素。在选择排序中，单次交换最多涉及两个元素，但在冒泡排序中，单次遍历可能发生多次交换，从而导致数组发生巨大变化。\n\
    \n## 插入排序\n\n- 算法描述：比较未排序列表中与已排序列表相邻的值，并确定它应插入到已排序列表中的哪个位置。\n\n插入排序关注于保持其已排序列表处于有序状态。已放入已排序列表的值在未来的遍历中可能会再次移动。\n\
    \n## 冒泡排序（代码实现）\n\n注意：以下代码是冒泡排序的一个变体，与书中给出的代码不同。\n\n```\n#define NUMDATA 10\n\n\
    void bubbleSort(int []);\n\nvoid printData(int []);\n```\n\n```\nint main(void)\n\
    {\n    int data[NUMDATA]; //ARRAY TO HOLD DATA TO SORT\n\n    getData(data);\n\
    \    printData(data); //PRINT BEFORE STATE\n\n    bubbleSort(data); //PRINT AFTER\
    \ STATE\n\n    printData(data);\n\n    return(0);\n}\n```\n\n```\nvoid printData(int\
    \ x[])\n{\n    for(lcv = 0; lcv < NUMDATA; lcv++)\n    {\n        printf(\"%d\"\
    , x[lcv]);\n    }\n}\n```\n\n```\nvoid getData(int x[])\n{\n    int lcv; //LOOP\
    \ CONTROL VARIABLE TO GET DATA\n    for(lcv = 0; lcv < NUMDATA; lcv++)\n    {\n\
    \        scanf(\"%d\", &x[lcv]);\n    }\n}\n```\n\n```c\nvoid bubbleSort(int x[])\n\
    {\n    int numPasses;    //LCV THAT CONTROLS # OF PASSES\n    int lcv;       \
    \   //LOOP CONTROL VARIABLE FOR SORTING\n    int temp;         //HOLDS VALUE DURING\
