    }\n```\n\n## 用于输入结束值的用户定义函数:\n\n```c\nint getEnd(int start)\n{\n    int num;\n\
    \n    do\n    {\n        printf(\"Enter ending value -> \");\n        scanf(\"\
    %d\", &num);\n\n        if(num < start)\n        {\n            printf(\"\\nError!\
    \ Ending value must be at least %d\\n\\n\", start);\n        }\n    }while(num\
    \ < start);\n\n    return(num);\n}\n```\n\n嵌套循环在哪里？当人们想到嵌套结构时，通常首先会考虑下面的示例。\n\n\
    ```\nNested while loop example:\nwhile ( )\n{\n    while ( )\n    {\n    }\n}\n\
    ```\n\n```\nNested if construct example:\nif ( )\n{\n    if ( )\n    {\n    }\n\
    }\n```\n\n在上一页提供的嵌套循环示例中，循环位于两个不同的用户定义函数中。一个在主函数中，用于从起始点计数到结束点；另一个在计算所需范围内每个整数阶乘的函数中。\n\
    \n每个循环通常代表程序中的一个任务或单个过程。如果你能识别出每个这样的单独任务，并将它们拆分为单独的用户定义函数，你可能会发现复杂问题更容易解决和测试。\n\
    \n## 无限循环\n\n无限循环是一种逻辑错误，其中循环控制表达式的条件永远不会为假。作为一种逻辑错误，无限循环在程序运行时出现的形式可能各不相同。无限循环的一个确定迹象是产生无限输出。但是，该错误也可能出现很少或没有输出的形式。\n\
    \n- 可以随时通过从键盘输入 CTRL-C 来终止程序。\n\n示例：允许用户输入整数值，直到输入 1 或 2。\n\n```c\nint getInteger(void)\n\
    {\n    int num;\n    do\n    {\n        printf(\"Enter 1 or 2 -> \");\n      \
    \  scanf(\"%d\", &num);\n    }while(num != 1 || num != 2);\n    return(num);\n\
    }\n```\n\n```\nOutput:\nEnter 1 or 2 -> 3\nEnter 1 or 2 -> 2\nEnter 1 or 2 ->\
    \ 1\nEnter 1 or 2 ->\n```\n\n控制表达式看起来在逻辑上是正确的，“在输入的值不是 1 或 2 时接受输入”，但在逻辑上会导致无限循环。没有单个值既不等于\
    \ 1 也不等于 2。\n\n## 重复复习 - 三个常见的循环组件\n\n- 1. 循环控制变量的初始化。\n- 2. 循环控制表达式的求值。\n- 3.\
    \ 循环控制变量的更新。\n\n## `for` 循环\n\nC 语言中可用的第三个也是最后一个循环结构是前测 `for` 循环。除了是前测循环结构之外，`for`\
    \ 循环的设计仅用于计数器控制的过程。`for` 循环将初始化、循环控制表达式和更新合并到一行代码中。得益于此，课程标准将始终使用 `for` 循环的所有三个表达式。\n\
    \n## `for` 循环的流程图表示：\n\n## 使用所有三个表达式的 `while` 循环表示：\n\n### 表达式 1（初始化）\n\n表达式 1\
    \ 仅在第一次遇到 `for` 循环时求值。正是在这个表达式中，循环控制变量会被初始化。\n\n### 表达式 2（求值）\n\n- 求值表达式 1 后，我们立即求值表达式\
    \ 2，即循环控制表达式。\n- 如果表达式 2 初始求值为假，则循环不会迭代！`for` 循环是前测结构。\n- 每次迭代完成后，必须重新求值循环控制表达式，以确定是否需要另一次迭代。\n\
    \n### 表达式 3（更新）\n\n- 这个最终表达式在每次迭代结束时以及下一次求值表达式 2 之前求值。\n- 基本上，任何更改循环控制变量的表达式都可作为第三个表达式。\n\
    \n### 语法\n\n- 表达式 1 和 2 之间以及表达式 2 和 3 之间需要分号。\n- 与任何循环结构一样，`for` 循环有一个主体，主体以 {\
    \ 和 } 开始和结束。主体中的指令可以是一条或多条。\n\n### 何时使用 for 循环？\n\n否则... 请考虑使用 while 来满足您的前测迭代需求。\n\
    \n### 转换后的循环：\n\n### 在不更改初始化值的情况下，将 while 循环转换为 for 循环：\n\n```c\nint lov = 1;\n\
    int n = 4;\nint nFact = 1;\nwhile (lov <= n)\n{\n    nFact *= lov;\n    lov++;\n\
    }\n```\n\n### 转换后的循环：\n\n### 在不更改初始化值的情况下，将 while 循环转换为 for 循环：\n\n```c\nint lov;\n\
    int n = 4;\nint nFact = 1;\nlov = n;\nwhile (lov > 0)\n{\n    nFact *= lov;\n\
    \    lov--;\n}\n```\n\n### 下面 for 循环的应用中存在哪些潜在问题？\n\n```c\nint x;\nfor(x = -1;\
    \ x < 0; )\n{\n    printf(\"Enter a non-negative integer: \");\n    scanf(\"%d\"\
    , &x);\n}\n```\n\n## 重排数字中的数字示例：\n\n给定一个整数，重排其数字以创建尽可能大的数字。\n\n### 示例执行：\n\n```\n\
    Enter an integer: 1230789\nThe sorted digit is 9873210\nEnter an integer: 53635\n\
    The sorted digit is 65533\n```\n\n### 步骤 #1 – 程序的要求是什么？\n\n- 我们期望输入一个整数并输出它。\n\
    - 整数输入中的前导 0 没有意义，不会被考虑。\n- 所有输入都将是非负的，并且必须进行验证。\n\n### 步骤 #2 – 分析问题\n\n- 我们如何从数字中提取单个数字？\n\
    - 我们如何做到这一点，然后确定它是否是数字中最大的数字？\n- 一旦我们有了数字中最大的数字，我们该怎么办？\n- 寻找数字中第二大的数字呢？\n\n###\
    \ 步骤 #3 – 设计软件解决方案\n\n该程序的任务是什么？\n\n- 1. 从用户获取输入。\n- 2. 计算非前导零数字的数量，以便可以将它们附加到最后输出的值中。\n\
    - 3. 在输入中找到最大的数字。将其“添加”到一个新数字中。从输入值中“删除”它。\n- 4. 返回步骤 #3，直到所有非零数字（从大到小）都已从输入值移动到正在构建的新整数值中。\n\
    - 5. 将零数字附加到新值的末尾。\n- 6. 输出。\n\n## 解决方案：\n\n```c\nint getInput (void);\nint ctZero\
    \ (int);\nint findMax (int, int*);\nint appendMax (int, int);\nint removeMax (int,\
    \ int, int);\nvoid output (int);\n\nint main (void)\n{\n    int n;\n    int sorted\
    \ = 0;\n    int max;\n    int maxLoc;\n    int zeroCount;\n\n    n = getInput\
    \ ();\n    zeroCount = ctZero (n);\n\n    while (n > 0)\n    {\n        max =\
    \ findMax (n, &maxLoc);\n        sorted = appendMax (sorted, max);\n        n\
    \ = removeMax (n, max, maxLoc);\n    }\n\n    output (sorted * (int)pow (10, zeroCount));\n\
    \    return (0);\n}\n\nint appendMax (int sorted, int max)\n{\n    return (sorted\
    \ * 10 + max);\n}\n\nint removeMax (int n, int max, int maxLoc)\n{\n    return\
    \ (n - max * (int)pow (10, maxLoc));\n}\n```\n\n```c\nint getInput(void)\n{\n\
    \    int n;\n    do\n    {\n        printf(\"Enter an integer to sort: \");\n\
    \        scanf(\"%d\", &n);\n        if (n < 0)\n        {\n            printf(\"\
    \\nError! Non-negative values only!\\n\");\n        }\n    }while(n < 0);\n  \
    \  return(n);\n}\n```\n\n```c\nint ctZero(int n)\n{\n    int ct = 0;\n    while(n\
    \ > 0)\n    {\n        if(n % 10 == 0)\n        {\n            ct++;\n       \
    \ }\n        n = n / 10;\n    }\n    return(ct);\n}\n```\n\n```c\nint findMax(int\
    \ n, int *maxLoc)\n{\n    int max = 0;\n    int loc = 0;\n    while(n > 0)\n \
    \   {\n        if(n % 10 > max)\n        {\n            max = n % 10;\n      \
    \      *maxLoc = loc;\n        }\n        n = n / 10;\n        loc++;\n    }\n\
    \    return(max);\n}\n```\n\n```c\nvoid output(int sorted)\n{\n    printf(\"Sorted\
    \ value: %d\\n\", sorted);\n}\n```\n\n"
