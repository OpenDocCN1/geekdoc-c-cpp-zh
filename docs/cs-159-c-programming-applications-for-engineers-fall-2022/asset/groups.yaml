  - '[PAGE 84]


    A floating point (float) number has a fractional part, such as 3.14159. C supports
    different sizes (smallest to largest) of the floating point data type: float,
    double, and long double. The most common implementations will be double and float.
    The longer types will provide additional precision and require more memory.


    Note: Many programming references will refer to any numeric value that is not
    an integer as a real number. This usage may not be consistent with what you know
    about real and imaginary numbers from mathematics.


    # Variables


    A variable is a named memory location that has a data type.


    Each variable in your program must be declared and defined. In C, a declaration
    is used to name an object (such as a variable) and definitions are used to create
    the object.


    +   - Declaration - gives the variable a name.

    +   - Definition - reserves memory for the variable.


    To create a variable (doing both declaration and definition in one step), you
    first need to list the intended data type of the variable, followed by the selected
    identifier, and a terminal semicolon.


    +   - The selected identifier, and a terminal semicolon.


    You need to know: A variable is defined to represent a particular data type and
    can only store and represent values of that type!


    Course Standard: Declare only a single variable per line.


    Those with previous programming experience in languages similar to C may know
    that it is possible to declare multiple variables in one statement. However, the
    course programming standards do not permit this practice. Organizing the data
    needs of a function can be a challenge and a single declaration per line assists
    with this and improves the documentation and readability of code.


    # Variable Initialization


    It is possible to initialize a variable at the same time it is created.


    ```

    int count = 0;

    ```


    The above will initialize the space in memory reserved for the integer count to
    the value of zero. We cannot assume the memory assigned to a variable has any
    default value unless we initialize the variable. Uninitialized variables will
    be assigned a location in memory that may have existing data from a prior use.
    Such data is referred to as garbage because it has no predictable value for the
    programmer.


    Course Standard: Move complex initialization expressions to the executable statement
    section of a function.'
  - '[PAGE 85]


    # Constants - Literal Constants


    A literal constant is an unmanned value used to specify data. For example, we
    want to calculate the circumference of a circle:


    ```

    circumference = 2 * 3.14159 * radius;

    ```


    +   • The values 2 and 3.14159 are both literal constants in the above expression.
    We may often refer to such values as being "hard coded" when they are not represented
    by a symbol (next topic).


    # Constants - Symbolic/Defined Constants


    The #define preprocessor directive is used to create symbolic constants.


    When this statement appears among the preprocessor directives, all subsequent
    occurrences of symbol will be replaced by replacement value automatically before
    the program is compiled.


    > Note: The replacement will NOT take place inside of quotes.


    # Why use symbolic/defined constants?


    +   • It is difficult to determine what a literal constant value represents in
    an arithmetic expression when the program is long and includes many complex calculations.
    The use of constants helps document the program by giving meaning to operands
    in an expression.


    +   • Another great reason to use constants is to make your program more maintainable.
    For example, perhaps there are 100 students in a course. You might use the value
    100 when loading data or changing the average, however, you might also use 100
    to convert .853 to 85.3%. Now, what if the number of students changes to 105?
    You then need to search your program to determine which of those 100 values that
    occur in the program are related to the number of students in the course and change
    only those to 105.


    > Course Standard: The use of memory constants is discouraged. Why request memory
    for a value that will never change?'
