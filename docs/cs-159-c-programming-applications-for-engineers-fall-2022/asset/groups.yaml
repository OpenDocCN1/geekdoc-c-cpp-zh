    \ g = %d\\n\", g);\n    g = g / 8;\n    printf(\"After g = %d\\n\", g);\n}\n```\n\
    \n上面程序的输出：\n\n从输出中可以看出，数组的单个元素被视为与传递给函数的单个变量相同，也就是说，数组的单个元素是按值传递的。\n\n- 是否可以对数组的单个元素使用按地址传递？\n\
    \n## 示例：通过将两个元素都按地址传递给函数来交换数组的两个元素。\n\n```c\n#define SIZE 10\nvoid swapValues(int\
