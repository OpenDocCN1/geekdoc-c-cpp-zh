    As with other variables we must declare and define arrays before they can be used
    in a function. Declaration and definition inform the compiler of the name of the
    array, the size of the array, and the data type of each element. The C programming
    language provides for two different array types: fixed-length arrays (length is
    known before program is compiled) and variable-length (size is determined when
    program is running).


