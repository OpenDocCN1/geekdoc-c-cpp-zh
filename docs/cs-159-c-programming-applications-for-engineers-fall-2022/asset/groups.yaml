    \ with pass by address and related pointer operations (chapters 9 and 10) make\
    \ it challenging to apply to input validation.\n\n![](img/e25602f5611b32eaf448a241a988eedc_145_0.png)\n\
    \n## Loops in C\n\nThe C programming language provides three constructs for the\
    \ looping technique of repetition. These are; while, for, and do-while. We will\
    \ begin with the similar while and do-while constructs.\n\n### The while Loop\n\
    \nThe while construct is a pretest loop. As with all loops the while makes use\
    \ of a loop control expression to determine whether the loop should begin or continue\
    \ to iterate. Being a pretest loop the loop control expression is evaluated prior\
    \ to the first iteration of the loop, then while the expression is evaluated to\
    \ be true then the loop will complete another iteration.\n\n- The iterations will\
    \ continue WHILE the loop control expression is true. When the control expression\
    \ evaluates to false the iterative process stops.\n\n### Basic Syntax of the While\
    \ Loop\n\n```\nwhile(loop control expression)\n{\n   //EXECUTABLE STATEMENT DESIGNATED\n\
    \   //FOR REPETITION - BODY OF THE LOOP\n}\n```\n\n> Note: There is no semicolon\
    \ after the loop control expression of the while statement, because the loop is\
    \ followed by a body which contains the actions to repeat.\n\n### The do-while\
    \ Loop\n\nThe do-while construct is a post-test loop. Similar to the while a loop\
    \ control expression is used to determine if repetition continues, but is the\
    \ case of a post-test construct the expression is evaluated after the initial\
    \ execution of the instructions inside the body.\n\n- In Contrast to the while\
    \ loop, the keyword while in a do-while is terminated with a semicolon.\n\n> Course\
    \ Standard: Indent all statements that compose the body of a loop two additional\
    \ spaces.\n\n### Basic Syntax of the Do While Loop\n\n```\ndo\n{\n   //EXECUTABLE\
    \ STATEMENT DESIGNATED\n   //FOR REPETITION - BODY OF THE LOOP\n}while(loop control\
    \ expression);\n```\n\n> Course Standard: With all loops (and if statements) the\
    \ braces that mark the start and end of the loop body MUST be used.\n\nWhat happens\
    \ if the update of the loop control variable occurs in the middle of body of the\
    \ loop, will this change the loop to terminate immediately at this point?\n\n\
    - No. The loop will only terminate when the loop control expression is evaluated\
    \ and found to be false.\n- There is no \"mid-test\" loop in the C programming\
    \ language, only pretest and post-test.\n\nIs there reason to be concerned that\
    \ the value of zero may be multiplied?\n\n- No. the loop control expression is\
    \ evaluated and false prior to the multiplication of zero.\n\nThe value entered\
    \ by the user is stored locally in the variable num, how does changing num on\
    \ each iteration influence what is going on back in the calling function?\n\n\
    - No, the variable has been passed by value.\n\n### Factorial Example\n\nThe factorial\
    \ problem will permit a demonstration of both the do-while with input validation\
    \ and the while the factorial.\n\n```\nint calcFactorial( int );\nint getInput(\
    \ void );\nvoid displayResults( int, int );\n\nint main( void )\n{\n    int num;\n\
    \    int fact;\n\n    num = getInput();\n    fact = calcFactorial( num );\n  \
    \  displayResults( num, fact );\n\n    return( 0 );\n}\n\nint calcFactorial( int\
    \ num )\n{\n    int nFact = 1;\n\n    while( num > 0 )\n    {\n        nFact =\
    \ nFact * num;\n        num -= 1;\n    }\n    return( nFact );\n}\n```\n\n###\
    \ Why don't we use an \"if loop\" for input validation?\n\n- An if construct would\
    \ only permit the user a second opportunity to enter acceptable data. We want\
    \ the user to have an unlimited number of opportunities to enter valid data.\n\
    \n### What is wrong with the term \"if loop\"?\n\n- An if is a selection construct\
    \ and not a repetition construct.\n\n```c\nint getInput(void)\n{\n    int num;\n\
    \    do\n    {\n        printf(\"Enter n to calculate n! -> \");\n        scanf(\"\
    %d\", &num);\n        if(num < 0)\n        {\n            printf(\"\\nError! Non-negative\
    \ values only!!\\n\");\n        }\n    }while(num < 0);\n    return(num);\n}\n\
    ```\n\n```c\nvoid displayResults(int num, int fact)\n{\n    printf(\"\\n%d!= %d\\\
    n\", num, fact);\n}\n```\n\n### Nested Loops\n\n### What is a nested loop?\n\n\
    - Nested loops, or any form of repetition, is when one repetitive process is found\
