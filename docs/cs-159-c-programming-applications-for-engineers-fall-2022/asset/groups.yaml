    \n## 提醒：\n\n- 人们很容易下意识地总是为所有选择需求使用 if/else。\n- 考虑在某些情况下使用 switch 或条件表达式可能是更好的选择。结果可能是更简洁、更易读的逻辑。\n\
    \n## 第 6 章 - 重复\n\n计算机的真正威力在于能够快速重复执行一个操作或一系列操作。这种重复行为通常称为循环，但该术语并未涵盖所有重复技术。\n\
    \n## 循环基础与术语\n\n- 如果此图表示循环的逻辑，你可能会想知道这个过程何时、如何或是否会停止？\n\n![](img/e25602f5611b32eaf448a241a988eedc_140_0.png)\n\
    \n## 首先，介绍几个术语：\n\n- 循环 - 两种可能的重复技术之一，利用结构在预定义条件下重复指定语句。\n- 循环迭代 - 循环结构体内指令的一次执行。\n\
    - 循环控制表达式 - 用于确定循环是否应发起另一次迭代的逻辑表达式。\n- 循环初始化 - 在第一次求值循环控制表达式之前需要完成的准备工作。\n- 循环更新\
    \ - 循环体内的一个可执行语句，当执行足够多次后，会导致循环控制表达式求值发生变化。\n- 循环控制变量 - 被初始化、作为循环控制表达式一部分并接收更新操作的变量。\n\
    \n## 重复流程图示例 #1：\n\n编写一个算法，计算未知数量考试成绩的平均值、最大值和最小值。测试成绩范围为 0 – 100，且均为整数值。\n\n\
    ## 重复\n\n- 要完成此问题，我们需要能够重复执行多条指令。\n- 重复允许我们识别一段代码，在给定逻辑表达式为真时重复执行。\n\n## 步骤 #1\
    \ – 程序的要求是什么？\n\n- 输入 – 0 到 100 之间的整数（包含端点），直到输入一个值表示输入结束。\n- 我们不需要数组（第 8 章的主题）来将整个数据集存储在计算机内存中。解决此问题所需的内存不会取决于数据集的大小（参加考试的学生人数）。\n\
    - 输出 – 平均值（浮点数）、最大值（整数）和最小值（整数）。\n\n## 步骤 #2 – 分析问题\n\n- 需要哪些公式？要计算平均值，需要知道所有分数的总和和分数的数量。我们需要在输入值时进行比较，以确定其是最大值还是最小值。\n\
    - 我们还需要确定用户如何指示输入已结束。\n\n## 如何处理终止输入条件？\n\n- 1. 要求用户统计考试数量。\n- 2. 要求用户在输入每个值后说明是否还有更多成绩要输入。\n\
    - 3. 要求用户在完成时输入一个超出考试成绩范围的值。\n\n## 解决方案的结构图：\n\n在前测试循环中，循环控制表达式在循环迭代一次之前必须为真。在每次迭代开始之前（包括第一次），都会对循环控制表达式求值，只要该表达式保持为真，重复就会继续。如果循环控制表达式为假，则不会再进行进一步的迭代。\n\
    \n关键点：前测试循环体被迭代的最少次数为零。如果表达式从不为真，则循环指令（循环体）将永远不会执行。\n\n在后测试循环中，循环体的指令会在对循环控制表达式求值之前执行。循环控制表达式将在每次迭代结束时求值，以确定是否继续进行另一次迭代。\n\
    \n- 最大区别是什么？后测试循环体被迭代的最少次数为一次。无论表达式是否为假，循环都会迭代一次，然后测试条件以确定迭代是否继续。\n\n## 选择错误的结构\n\
    \n有哪些迹象可能表明你为解决方案选择了错误类型的循环（前测试或后测试）？（1）循环体内外都重复了逻辑。（2）使用了一个“技巧”来强制循环至少迭代一次。如果你使用过一种既不提供前测试也不提供后测试选项的语言（MATLAB），这些选项可能看起来很熟悉。\n\
    \n"
