    \ `temp` 的值赋给 `b` 所指向的位置。\n\n## 何时使用按地址传递？\n\n当需要修改多个值，并且在被调用函数终止后，该修改仍需保留在调用函数中时。\n\
    \n且\n\n该函数仍应满足功能内聚的定义，即仅完成单一基本任务。\n\n## 作用域\n\n对象（可视为变量或函数）的作用域是指其定义所在的程序区域，以及你可以通过其声明标识符引用它的区域。两个或多个对象可以拥有相同的标识符吗？答案是肯定的，前提是各对象的作用域不重叠！在许多情况下，重叠作用域中重复使用标识符会导致编译器错误。在其他情况下，这是一种糟糕的设计选择。\n\
    \n本课程使用两种作用域级别：全局和局部。所有函数将在全局声明，所有变量将在局部声明。\n\n## 结构图\n\n结构图是程序的主要设计工具。在尝试开发任何流程图或编写任何代码之前，你应先完成程序的结构图。结构图将表示程序中存在的每个用户定义函数及其调用顺序。待结构图在程序中呈现后，你可接着为每个函数创建流程图。\n\
    \n## 结构图规则与符号\n\n| 第一个符号 | 第二个符号 |\n| --- | --- |\n| 左侧的两个符号用于表示函数调用。第一个符号表示在程序中仅被调用一次的函数。函数名称将放在方框内。\
    \ | 第二个符号右下角包含一个“井号交叉”。所有带有此类井号交叉的函数表示该函数在程序中被调用多次。为限制结构图中子函数的数量，你只需列出特定函数调用的子函数（如果有）一次（即第一次使用时）。\
    \ |\n\n## 如何读取结构图\n\n结构图自上而下、再从左到右阅读。教材在顶部方框应包含什么内容上并不一致，我们建议该方框表示 main 函数。结构图仅显示用户定义函数的调用顺序及交换的数据，不包含任何代码！\n\
    \n- 以下是结构图基本规则的摘要：\n  - 结构图中的每个矩形表示一个用户定义函数。标准 C 函数（stdio.h、math.h）不包括在内。\n  -\
    \ 矩形中的名称应传达函数的用途。它是程序中将使用的名称。\n  - 结构图仅包含函数流程，不指示其他代码。\n  - 常用函数（即在程序中被调用多次的函数）通过矩形右下角的斜线表示。如果此类函数包含其他函数调用，则完整结构只需显示一次。\n\
    \n笔记中演示的计算器问题的结构图：\n\n在某些情况下，列出进入和退出用户定义函数的值可能会有所帮助。左侧符号可用于指定进入和退出函数的此类值。发送到函数的变量应列在线条左侧，从函数出来的变量列在右侧。\n\
    \n![](img/e25602f5611b32eaf448a241a988eedc_117_0.png)\n\n上述结构图的设计如何体现对设计良好程序中\
    \ main 函数角色的预期？\n\n- 一般而言，结构图更倾向于水平（宽）而非垂直（深）。这表明大部分，如果不是全部，用户定义的函数都应在 main 函数内被调用。\n\
    - 如前所述，每个用户定义函数应仅限于完成程序设计要解决的较大问题中的单一任务。\n\n## 有缺陷的设计 #2：\n\n- 对上述设计的担忧：\n  -\
    \ main 函数仅用于启动程序，除此之外不做其他事情。\n  - 对 return 语句或参数传递技术缺乏理解。\n\n## 有缺陷的设计 #1：\n\n\
    - 对上述设计的担忧：\n  - 函数数量不足。\n  且\n  - 一个函数包含程序中的所有任务。\n  - main 函数仅用于启动程序，除此之外不做其他事情。\n\
    \  或\n  - 一个函数包含程序中的一项琐碎任务。\n  - main 函数完成其余任务。\n\n## 问题求解方法简介\n\n- 明确程序的要求。\n\
    \  - 在入门编程课程中，规格由布置问题的教师提供。\n  - 在现实世界中，你将与同行工程师、科学家、主管和/或客户会面，以确定软件必须成功完成什么以及如何完成。\n\
    \  - 建议：在大学毕业前先在这一领域获得经验。尝试 EPICS、ENTR 和专业实践等项目。\n\n- 分析问题。\n  - 采用自顶向下设计，利用结构图等工具对任务进行分解。\n\
    \  - 此步骤需要开发解决问题所需的数学公式。有些公式非常常见，例如确定直线斜率、两点间距离、直角三角形斜边长度，但其他公式则较为高级，且特定于你的工程或科学学科。\n\
    \  - 一旦确定了解决问题所需的算术表达式，请注意考虑可能出现的潜在错误。例如除以零或处理不可能出现的负值（人数、某些距离和时间度量）。通过规划，你开始梳理逻辑中的潜在错误。\n\
    \n- 设计软件解决方案。\n  - 算法的流程图或伪代码表示在此阶段开发。流程图和伪代码都是你可用于设计算法以解决当前问题的技术。\n  - 应用：与团队合作时，请务必以可视化方式表示你的逻辑，以便他人在你展示解决方案构思时能够理解你的思路。\n\
    \  - 随着解决问题能力的提高，请务必分别设计每个任务的解决方案。当所有任务都设计完成后，实现这些任务以创建最终解决方案的工作将容易得多。\n\n- 将设计转换为代码。\n\
    \  - 每次只编写解决方案的小部分，通常一次一个函数。\n  - 测试你所做的每一个更改！\n  - 在首次编译和测试之前，切勿编写完整的程序！\n  -\
    \ 好处：在流程的前几个步骤投入时间，可以使此步骤：(1) 耗时更短，(2) 令人沮丧的情况大大减少。\n\n- 测试和调试实现。\n  - 测试时，请务必开发超出作业提供内容的测试用例和预期输出。\n\
    \  - 你运行了哪些测试以确保程序能处理所有合理输入？\n  - 一般情况、边界情况、极端/压力情况。\n\n- 解决方案的改进。\n  - 恭喜，你有了一个解决方案！现在，审查你的解决方案，确保其高效、设计良好、满足所有要求、不产生警告或语法错误，并符合所有课程文档和编程标准。\n\
    \  - 你的第一个解决方案很少是最佳解决方案。请尽一切努力改进你的算法，使其尽可能充分利用计算机的有限资源。\n\n"
