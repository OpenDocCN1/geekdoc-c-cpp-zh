    ## 结构化程序设计 – 它是什么？


    结构化程序设计有三个基本思想：选择、重复和序列。


    - 序列是第 4 章（用户定义函数）的主题。使用函数允许程序的单个指令按除从第一条语句到最后一条语句以外的顺序执行，有些语句可能会被执行多次。

    - 选择是第 5 章的主题。选择结构将允许根据给定条件执行指令，并排除其他指令。这是学期中第一个点，在此点程序中的所有代码可能不会在每个测试用例中执行。

    - 重复是第 6 章的主题。通常，当满足特定条件或直到满足条件时，需要重复一组指令。重复结构允许使用逻辑来指定条件并识别要重复的指令。


    ## 第 5 章 – 选择


    尽管函数允许我们创建模块化代码并在函数之间转移控制（改变执行的代码序列）以完成单个任务，但接下来我们需要的是选择和重复代码的能力。选择正是第 5 章的主题。


    到目前为止，在本课程中，我们一直观察到程序中的所有语句至少被执行一次。


    - 虽然用户定义函数允许我们在此时改变序列，当我们进行函数调用时，该函数中的所有代码都会被执行。

    - 选择的概念涉及根据条件选择要执行或排除的代码。


    ### 逻辑数据


    如果一段数据传递 true 或 false 的值，则称为逻辑数据。逻辑数据由逻辑表达式生成。逻辑表达式用于选择和重复结构中。C 编程语言传统上没有专门用于逻辑数据的数据类型，而是使用数值类型来表示
    true 和 false。


    > 注意：我们通常使用 1 表示 true 值，但是，任何非零值都被视为 true。


    ### 逻辑运算符


    有三个主要的逻辑运算符。逻辑运算符的操作数根据其逻辑状态（true 或 false）进行考虑。


    | 运算符 | 字符 | 描述 | 优先级 |

    |---|---|---|---|

    | 非 | ! | 一元运算符，将 true 值更改为 false，将 false 值更改为 true。 | |

    | 与 | && | 二元运算符，仅当两个操作数都为 true 时才为 true，在所有其他情况下为 false。 | |

    | 或 | || | 二元运算符，仅当两个操作数都为 false 时才为 false，在所有其他情况下为 true。 | |


    ### 逻辑运算符真值表：


    | | 非 | | 与 | | | 或 | | |

    |---|---|---|---|---|---|---|---|---|---|

    | | x | !x | x | y | `x && y` | x | y | `x || y` |

    | | 真 | 假 | 真 | 真 | 真 | 真 | 真 | 真 |

    | | 假 | 真 | 真 | 假 | 假 | 真 | 假 | 真 |

    | | | | 假 | 真 | 假 | 假 | 真 | 假 |

    | | | | 假 | 假 | 假 | 假 | 假 | 假 |


    ### 求值逻辑表达式


    - 即，求值包含逻辑运算符的表达式。

    - 在求值数学表达式时，不考虑每个运算符的情况极为罕见。

    - 我们如何在求值表达式的每个运算符之前对表达式求值？对于逻辑表达式，只有两种可能的结果，我们将看到，当表达式的结果可以确定时，求值将在不需要求值每个运算符时停止，或短路。


    ### 短路方法：


    ### 示例（类似于）程序 5-1 形式文本：


    ```

    int a = 1;

    int b = -1;

    int c = 0;

    printf("%d%d %d %d = %d\n", a, b, a && b);

    printf("%d%d %d %d = %d\n", a, c, a && c);

    printf("%d%d || %d = %d\n", a, b, a || b);

    printf("%d%d || %d = %d\n", a, c, a || c);

    printf("%d%d %d = %d\n", !a, !c, !a || !c);

    printf("%d%d %d = %d\n", !a, !c, !a && !c);

    printf("%d%d %d = %d\n", !a, !c, !(a && !c));

    printf("b++ || ++c = %d\n", b++ || ++c);

    printf("a = %d b = %d c = %d\n", a, b, c);

    ```


    ### 输出：


    - 1.

    - 2.

    - 3.

    - 4.

    - 5.

    - 6.

    - 7.

    - 8.

    - 9.


    为什么我们会在上面的代码段中观察到最终打印语句的这些值？


    ### 关系（比较）运算符


    C 编程语言中有六个关系运算符。所有这些运算符都是二元运算符，其中两个操作数被求值。关系表达式的结果是一个逻辑（0, 1）值。


    关系运算符（图 5-4，第 236 页）：


    | 类型 | 运算符 | 含义 | 优先级 |

    |---|---|---|---|

    | 关系 | < | 小于 | 10 |

    | | <= | 小于或等于 | |

    | | > | 大于 | |

    | | >= | 大于或等于 | |

    | 比较 | == | 等于（相等） | 9 |

    | | != | 不等于（不相等） | |


    ### 复合语句


    可以将一系列关系和逻辑运算符组合起来，形成所谓的复合语句。此类语句（或表达式）的结果将是一个（true 或 false）逻辑值。


    当某些复合逻辑表达式仅包含单个变量（例如 x > 0 && x < 10）时，其含义是明确的。


    通常，通过包含括号可以使复合语句更易于阅读。你能确定下面哪个表达式与其他两个不同吗？


    ### 示例：


    ```

    int x = 3;

    int y = 2;

    int z = 3;

    ```


    ```

    printf("Result #1 = %d\n", x <= 3 || y >= 2 && z != 3);

    printf("Result #2 = %d\n", x <= 3 || (y >= 2 && z != 3));

    printf("Result #3 = %d\n", (x <= 3 || y >= 2) && z == 3);

    ```


    注意：我们的编译器会发出警告，建议在同一表达式中使用 && 和 || 时使用 ( 和 )。


    ### 扩展前面的示例：


    ```

    int x = 3;

    int y = 2;

    int z = 3;

    printf("Result = %d\n", x++ <= 3 || y++ > 2 && z++ != 3);

    printf("x: %d y: %d z: %d\n", x, y, z);

    ```


    上面程序的输出是什么？


    ### 什么是运算符绑定？这与优先级有何关系？


    - 运算符的优先级可以确定表达式中哪些操作数绑定到它。

    - 因为逻辑 AND 运算符的优先级高于逻辑 OR 运算符，表达式 y++ >= 2 是 AND 运算符的左操作数，而不是 OR 运算符的右操作数。


    ### 示例：


    ```

    int x = 7;

    int y = 9;

    int z = 5;

    int result;

    result = !(++y - 9) || -5 + z++ && x++;

    printf("x: %d y: %d z: %d\n", x, y, z);

    ```


    ### 它是如何求值的？


    ### 补运算


    六个关系运算符中的每一个都是另一个关系运算符的补运算。每当一个逻辑表达式为 true 时，其补运算为 false。每当一个逻辑表达式为 false 时，其补运算为
    true。


    - 例如，x < 3 表示所有小于 3 的数字，其补运算 x >= 3 表示所有其他值。


    ### 关系和比较运算符的补运算：


    ### 逻辑运算符的补运算：


    | 原始表达式： | 补运算： |

    | :--- | :--- |

    | `x > 0 && x < 10` | |

    | `x > 0 && x < 10 || y == 0` | |

    | `!(x == 1 && x != 2)` | 补运算 #1： |

    | `!x && !y` | 补运算 #1： |

    | `x == 0 || y == 0` | 补运算 #1： |


    ### 选择流程图示例 #1：


    询问用户的考试成绩，并根据其成绩告知他们获得的等级（基于 90、80、70、60 的 A、B、C、D、F），并给予适当的祝贺（或不祝贺）消息。


    ### 步骤 #1 – 程序的规范是什么？


    - 输入 – 单个分数。

    - 输出 – 与获得的等级相关的消息和获得的等级。


    ### 步骤 #2 – 分析问题


    - 表示此问题的用户定义函数的结构图。


