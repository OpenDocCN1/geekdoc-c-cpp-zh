  md: "\n## Advanced Topics/Implementations\n\n- In all programming assignments we\
    \ will specify from which chapters you may reference when developing your solution.\n\
    - We commonly view advanced implementations (material not covered yet in lecture\
    \ or not covered in the course) in code as suspicious in that such work is beyond\
    \ what most students in the course are capable of using and believe that the author\
    \ of the code may be someone not currently in the class.\n\n## Efficient Design\n\
    \n- One measure regarding the quality of ALL assignments is the implementation\
    \ of efficient design. Students of innovative work in science and engineering\
    \ should anticipate and appreciate that design is critical to the evaluation of\
    \ any product including software.\n- We require that you implement an efficient\
    \ and logically correct algorithm as part of your assignment. In some cases this\
    \ may make the distinction between letter grades on the assignment. To receive\
    \ full credit on an assignment we expect correct logic AND good design.\n\n##\
    \ Some guidelines related to the efficient use of the limited resources of the\
    \ computer:\n\n- Avoid wasting memory.\n  - Do not use multiple arrays (or dimensions)\
    \ when one will do the job.\n  - Do not declare arrays to be large beyond your\
    \ data needs (specified by the assignment).\n  - Do not use arrays when they are\
    \ unnecessary.\n- Avoid wasting the CPU's time.\n  - Do not write nested loops\
    \ for tasks that can be done in one (or none).\n- Shorter code is usually better.\
    \ Recognize patterns in your code. Avoid duplication of the same, or similar,\
    \ logic within a program.\n  - If you find yourself repeating code in several\
    \ places, create a function such that the code only appears once in your program\
    \ and is called when needed.\n  - Another common scenario involves several functions\
    \ have been written that do essentially the same thing, or contain a considerable\
    \ amount of similar code. In such cases you should attempt to consolidate as much\
    \ as possible.\n- Use the top-down design. Each function should have a well-defined\
    \ task and not a series of tasks.\n- Topics of efficient design will be commented\
    \ on, where appropriate, in lecture.\n\n## Syntax Errors and Warnings\n\n- Any\
