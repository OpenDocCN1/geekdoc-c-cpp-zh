    This page lists C operators in order of precedence (highest to lowest). Their
    associativity indicates in what order operators of equal precedence in an expression
    are applied.


    | Operator | Description | Associativity |

    |---|---|---|

    | () [] ++ -- | Parentheses (function call) Brackets (array subscript) Postfix
    increment/decrement | left-to-right |

    | ++ -- + - ! ~ (type) * & sizeof | Prefix increment/decrement Unary plus/minus
    Logical negation Cast (change type) Dereference Address Determine size in bytes
    | right-to-left |

    | * / % | Multiplication/division/modulus | left-to-right |

    | + - | Addition/subtraction | left-to-right |

    | < <= > >= | Relational less than/less than or equal to Relational greater than/greater
    than or equal to | left-to-right |

    | == != | Relational is equal to/is not equal to | left-to-right |

    | && | Logical AND | left-to-right |

    | || | Logical OR | left-to-right |

    | ?: | Ternary conditional | right-to-left |

    | = += -= *= /= %= | Assignment Addition/subtraction assignment Multiplication/division
    assignment Modulus assignment | right-to-left |

    | , | Comma (separate expressions) | left-to-right |'
