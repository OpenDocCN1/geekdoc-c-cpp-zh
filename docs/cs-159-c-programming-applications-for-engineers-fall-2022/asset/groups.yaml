  mdcn: "\n\n## 高级主题/实现\n\n- 在所有编程作业中，我们将指定在开发解决方案时可以参考哪些章节。\n- 我们通常将代码中的高级实现（讲座中尚未讲授或课程未涵盖的材料）视为可疑，因为此类工作超出了课程中大多数学生的能力范围，并且我们认为代码作者可能不是当前班级的学生。\n\
    \n## 高效设计\n\n- 衡量所有作业质量的一个标准是实现高效设计。从事科学和工程创新工作的学生应当预期并认识到，设计对包括软件在内的任何产品的评价都至关重要。\n\
    - 我们要求你在作业中实现高效且逻辑正确的算法。在某些情况下，这可能决定作业的字母等级。要获得作业满分，我们期望逻辑正确 且 设计良好。\n\n## 关于高效利用计算机有限资源的一些指南：\n\
    \n- 避免浪费内存。\n  - 当一个数组足以完成任务时，不要使用多个数组（或多个维度）。\n  - 不要将数组声明为超出数据需求（由作业指定）的大小。\n\
    \  - 当不需要数组时，不要使用数组。\n- 避免浪费 CPU 时间。\n  - 对于可以用一个（或零个）循环完成的任务，不要编写嵌套循环。\n- 代码越短通常越好。识别代码中的模式。避免程序中重复相同或相似的逻辑。\n\
    \  - 如果发现自己在多个地方重复代码，请创建一个函数，使代码在程序中只出现一次，并在需要时调用。\n  - 另一种常见情况是已经编写了几个函数，它们基本上做同样的事情，或包含大量相似代码。在这种情况下，你应尽可能合并代码。\n\
    - 采用自顶向下设计。每个函数应有一个明确定义的任务，而不是一系列任务。\n- 高效设计的主题将在讲座中，在适当的时候进行评论。\n\n## 语法错误和警告\n\
    \n- 任何源代码中存在语法错误的作业提交尝试都将被拒绝，且不考虑部分得分。你有责任在提交前彻底测试你的工作。\n- 编译器警告将导致扣分，应在提交最终工作前予以纠正。\n\
    \n## 开发代码的课程工具和技术\n\n- 1. 我们不鼓励在 Vocareum 中提供的任何编辑器或编译器之外的任何编辑器或编译器中开发、编译或测试你的代码。并非所有\
    \ C 语言编译器都完全兼容。你应希望在与课程处理和测试你的工作相同的条件下测试你的工作。\n- 2. 在学期第一周设置的 Vocareum 中彻底测试你的代码，并在最终提交工作之前，这是你的责任。\n\
    - 3. 我们将不支持 Vocareum 上提供的编译器、编辑器和编程开发环境之外的任何工具。\n\n建议你在作业截止日期前留出足够的时间，以便在提交作业时遇到困难时寻求帮助。不接受逾期作业。\n\
    \n## 2022 年春季考试及答案\n\n## 考试 #1：\n\n| 1. C | 2. C | 3. B | 4. A | 5. C |\n| 6.\
    \ A | 7. B | 8. C | 9. A | 10. D |\n| 11. A | 12. B | 13. C | 14. A | 15. B |\n\
    | 16. B | 17. B | 18. B | 19. C | 20. D |\n| 21. A | 22. A or D | 23. C | 24.\
    \ C | 25. C |\n| 26. B | 27. A | 28. B | 29. A | 30. D |\n| 31. C | 32. B | 33.\
    \ B | 34. A | 35. D |\n\n## 考试 #2：\n\n| 1. A | 2. A | 3. C | 4. A | 5. B |\n|\
    \ 6. C | 7. C | 8. A | 9. C | 10. A |\n| 11. C | 12. C | 13. B | 14. C | 15. B\
    \ |\n| 16. A | 17. B | 18. D | 19. C | 20. D |\n| 21. B | 22. B | 23. D | 24.\
    \ A | 25. C |\n| 26. B | 27. C | 28. C | 29. D | 30. B |\n| 31. D | 32. C | 33.\
    \ C | 34. A | 35. D |\n\n## 期末考试：\n\n| 1. C | 2. B | 3. D | 4. C | 5. C |\n| 6.\
    \ A | 7. A | 8. B | 9. C | 10. D |\n| 11. A | 12. A | 13. B | 14. A | 15. C |\n\
    | 16. C | 17. D | 18. D | 19. A | 20. A |\n| 21. D | 22. A | 23. C | 24. B | 25.\
    \ D |\n| 26. B | 27. B | 28. A | 29. A | 30. C |\n| 31. C | 32. A | 33. C | 34.\
    \ C | 35. C |\n| 36. A | 37. C | 38. A | 39. C | 40. C |\n| 41. A | 42. D | 43.\
    \ D | 44. C | 45. C |\n| 46. B | 47. B | 48. B | 49. D | 50. D |\n\n## 在备考过程中如何最好地利用旧考试？\n\
    \n- 在学习结束时，你应该尝试做一份旧考试，并在校园内找一个可以模拟考试环境的地点进行。参加考试，给自己的作业评分，并确定在考试日期之前需要进一步复习的科目或题型。\n\
    \n## 在哪里可以找到更多练习题？\n\n- 请参阅 C 语言教材每章末尾的习题。\n- Brightspace 上提供了包含学生下载和解答的出版社网站链接。\n\
    \n## 为什么这些旧考试中的一些代码如此复杂？\n\n- 每份考试都特定于其举行的学期。这不仅包括基于考试时间所涵盖的主题，还包括该学期课程中布置的作业。\n\
    - 许多代码段直接来自之前的作业和实验室编程概念，那些学生对所呈现的问题和逻辑会有一定程度的熟悉。这将使解释代码及其代表的逻辑变得更容易、更快。\n\n##\
    \ 2022 年春季期中考试 #1\n\n2022 年 2 月 23 日，星期三（晚上 8:00 - 9:00，Elliott 音乐厅）\n35 道题目 *\
    \ 每题 3 分 = 105 分\n超过 100 分的部分视为额外学分\n\n- 1. 在答题卡上填写你的姓名和学生身份证号码（填写并涂卡所有要求的信息）。\n\
    \  - 本次考试没有试卷形式或分区。\n  - 学生身份证号码错误将导致本次考试得零分。所有学生身份证号码均以两个零数字开头。这必须在考试答题卡上书写并“涂卡”。\n\
    \  - 你必须在指定座位上才能获得本次考试的学分。\n- 2. 确保你拥有本次考试的全部 35 道题目。你应该回答每道题。所有问题只有一个最佳答案。请在填写答案时小心：任何被教学数据处理部门判定为无法辨认的答案都将被视为错误。评分时只能考虑答题卡上的答案。\n\
    \  - 本试卷背面提供了运算符优先级表和 ASCII 表。\n- 3. 考试期间不回答任何问题。由于在场工作人员有限，我们不会在考试期间回答问题。为我们来说，补救一道有误的试题比回答问题或在考试期间有效发布公告更容易。\n\
    \  - 请相应安排好你的时间！\n- 4. 你必须假设所有 C 程序和代码段都在 Vocareum 上实现，并将使用 gcc 编译器编译。当仅呈现代码段时，你可以假设适当的包含语句已存在，且代码位于一个完全可运行的函数或程序中。\n\
    - 5. 保护你的工作并将注意力集中在自己的考试上。如果你从另一名学生那里抄袭或允许另一名学生从你那里抄袭，将被视为不诚实行为。任何被发现违反课程政策的人将获得课程不及格成绩，并将被转交给学生院长办公室。\n\
    - 6. 考试期间不允许使用任何资源。这包括但不限于：教材、笔记、计算器、手机、音频设备和计算机。如果你的手机在考试期间响铃，你将被要求立即交卷并离开考场。\n\
    - 7. 考试结束后，请前往大厅提交答题表并离开设施。\n  - 在接受你的工作之前，你需要出示带照片的身份证件。\n  - 你将保留这份试卷。\n  -\
    \ 一旦提交考试，你不得返回座位。\n- 8. 你可以预期，分数和官方考试答案将于 2 月 25 日星期五在 Brightspace 上发布。在答案发布之前，请勿就错误（如有）联系课程工作人员。如果你认为答案发布后仍有错误，你可以在\
    \ 3 月 4 日星期五之前提出书面复核申请，并在教师办公时间将其交给你的教师。你的申请必须是纸质副本（不接受电子邮件），并包含详细描述（如适用，使用代码），证明你认为发布的答案不正确的原因。\n\
    - 9. 宣布时间到时，所有书写必须停止。一旦宣布时间到，你不得继续修改考试中的任何答案。\n- 10. 日程更新。明天（2 月 24 日，星期四）有课，本周实验课将继续。3\
    \ 月 8 日（星期二）至 3 月 11 日（星期五）没有实验课，3 月 10 日（星期四）没有课。\n\n## 考试期间不回答任何问题。\n\n"
