    \ = %d\\n\", y[1]);<br>}` | `不要包含以下任何内容：<br>* 函数声明和定义中看到的方括号。<br>* 数组声明中使用的数组大小。<br>*\
    \ 数组的数据类型。我们在函数调用中何时列出过参数的类型？` |\n| | `左侧程序的输出：` |\n| | `结论 – 整个数组是按地址传递的。` |\n\
    \n- 请考虑：如果数组是按值传递的，那么这需要完全复制内存来存储数组的副本。这将是内存使用的一种非常低效的方式。语言传递的不是数组的副本，而是数组的地址。是否有可能按值传递整个数组？不可能。\n\
    - 第 4 章中的用户定义函数调用没有 & 运算符？数组名称已经引用一个内存地址！\n- 数组名称代表哪个内存地址？数组只跟踪它们在内存中的起始位置，而不跟踪结束位置！\n\
