  \ t2)` | 交换线程。 |\n\n你只能对线程 `t` 调用一次 `t.join()` 或 `t.detach()`。如果你尝试多次调用这些方法，将得到异常\
  \ `std::system_error`。`std::thread::hardware_concurrency` 返回核心数，如果运行时无法确定数量则返回 0。`sleep_until`\
  \ 和 `sleep_for` 操作需要一个 `time point` 或 `time duration` 作为参数。线程不能拷贝，但可以移动。交换操作在可能时执行移动。\n\
  \n### 令牌 (Stop Token)\n\n`std::thread` 的额外功能基于 `stop_token`、`stop_callback` 和 `stop_source`。以下程序可以给你提供思路。\n\
  \n```cpp\n// interruptJthread.cpp\n\n...\n#include <thread>\n#include <stop_token\n\
  \nusing namespace std::literals;\n\n...\n\nstd::jthread nonInterruptable([]{ //\
  \ (1)\n    int counter{0};\n    while (counter < 10){\n        std::this_thread::sleep_for(0.2s);\n\
  \        std::cerr << \"nonInterruptable: \" << counter << std::endl; \n       \
  \ ++counter;\n    }\n});\n\nstd::jthread interruptable([](std::stop_token stoken){\
  \ // (2)\n    int counter{0};\n    while (counter < 10){\n        std::this_thread::sleep_for(0.2s);\n\
  \        if (stoken.stop_requested()) return;            // (3)\n        std::cerr\
  \ << \"interruptable: \" << counter << std::endl; \n        ++counter;\n    }\n\
  });\n\nstd::this_thread::sleep_for(1s);\n\nstd::cerr << \"Main thread interrupts\
  \ both jthreads\" << std:: endl;\nnonInterruptable.request_stop();             \
  \           // (4)\ninterruptable.request_stop();\n```\n\n### 中断不可中断和可中断的 `std::jthread`\n\
  \n主程序中启动了线程 `nonInterruptable` 和 `interruptable` ((1) 和 (2))。与线程 `nonInterruptable`\
  \ 不同，`interruptable` 获取了一个 `std::stop_token` 并在 (3) 使用它检查是否被中断：`stoken.stop_requested()`。在中断情况下，lambda\
  \ 函数返回，因此线程结束。调用 `interruptable.request_stop()` (4) 触发了线程的结束。这对于之前的调用 `nonInterruptable.request_stop()`\
  \ 并不成立。\n\n![](img/privat----interruptJthread.png)\n\n### `std::stop_token`、`std::stop_source`\
  \ 和 `std::stop_callback`\n\n`stop_token`、`stop_callback` 或 `stop_source` 允许异步请求执行停止或询问执行是否获取停止信号。停止请求由\
  \ `std::stop_source` 发送。该信号影响所有关联的 `std::stop_token`。这三个类 `std::stop_source`、`std::stop_token`\
  \ 和 `std::stop_callback` 共享关联的停止状态。`request_stop()`、`stop_requested()` 和 `stop_possible()`\
  \ 调用是原子操作。\n\n\n\n\n\n`std::stop_source` 和 `std::stop_token` 组件为停止处理提供了以下属性。\n\n\
  ```\nstop_source();\nexplicit stop_source(std::nostopstate_t) noexcept;\n```\n\n\
  ### `std::stop_source` 的构造函数\n\n默认构造函数 `std::stop_source` 会获取一个停止源（stop-source）。接受\
  \ `std::nostopstate_t` 的构造函数会创建一个没有关联停止状态的空 `std::stop_source`。\n\n### `std::stop_source\
  \ src` 的成员函数\n\n| 成员函数 |get |\n| --- | --- |\n| `src.get_token()` | 如果 `stop_possible()`，则返回关联\
  \ stop-state 的 `stop_token`。否则，返回一个默认构造的（空的）`stop_token`。 |\n| `src.stop_possible()`\
  \ | 如果 `src` 可以停止，则返回 `true`。 |\n| `src.stop_requested()` | 如果 `stop_possible()`\
  \ 且其中一个所有者调用了 `request_stop()`，则返回 `true`。 |\n| `src.request_stop()` | 如果 `stop_possible()`\
  \ 且 `!stop_requested()`，则调用停止请求。否则，该调用没有效果。 |\n\n`src.stop_possible()` 意味着 `src`\
  \ 有关联的 stop-state。`src.stop_requested()` 在 `src` 有关联的 stop-state 且之前被请求停止时返回 `true`。如果\
  \ `src` 有关联的 stop-state 且之前未被请求停止，则 `src.request_stop()` 执行成功并返回 `true`。\n\n调用 `src.get_token()`\
  \ 返回停止令牌 `stoken`。得益于 `stoken`，你可以检查其关联的停止源 `src` 是否已或可以发出停止请求。停止令牌 `stoken` 观察停止源\
  \ `src`。\n\n### `std::stop_token stoken` 的成员函数\n\n| 成员函数 |get |\n| --- | --- |\n\
  | `stoken.stop_possible()` | 如果 `stoken` 有关联的 stop-state，则返回 `true`。 |\n| `stoken.stop_requested()`\
  \ | 如果在关联的 `std::stop_source src` 上调用了 `request_stop()`，则返回 `true`，否则返回 `false`。\
  \ |\n\n默认构造的停止令牌没有关联的 stop-state。`stoken.stop_possible` 在停止请求已经发出时也会返回 `true`。`stoken.stop_requested()`\
  \ 在停止令牌有关联的 stop-state 且已经收到停止请求时返回 `true`。\n\n如果应该临时禁用 `std::stop_token`，你可以用一个默认构造的令牌来替换它。默认构造的令牌没有关联的\
  \ stop-state。下面的代码段显示了如何禁用和启用线程接受停止请求的能力。\n\n```\nstd::jthread jthr([](std::stop_token\
  \ stoken) {\n    ...\n    std::stop_token interruptDisabled; \n    std::swap(stoken,\
  \ interruptDisabled);  // (1)       \n    ...                                  \
  \  // (2)\n    std::swap(stoken, interruptDisabled);       \n    ...\n}\n```\n\n\
  ### 临时禁用停止令牌\n\n`std::stop_token interruptDisabled` 没有关联的 stop-state。这意味着线程 `jthr`\
  \ 在行 (1) 和 (2) 以外的所有行中都可以接受停止请求。\n\n### 共享变量\n\n如果多个线程共享一个变量，你必须协调访问。这是 C++ 中互斥锁（mutex）和锁（lock）的工作。\n\
  \n#### 数据竞态\n\n数据竞态（data race）是指至少两个线程同时访问共享数据，且至少一个线程是写入者的状态。因此，程序具有未定义行为。\n\n\
  如果几个线程写入 `std::cout`，你可以非常清楚地观察到线程的交替执行。在这种情况下，输出流 `std::cout` 就是共享变量。\n\n```cpp\n\
  // withoutMutex.cpp \n...\n#include <thread>\n...\n\nusing namespace std;\n\nstruct\
  \ Worker{\n  Worker(string n):name(n){};\n  void operator() (){\n    for (int i=\
  \ 1; i <= 3; ++i){\n      this_thread::sleep_for(chrono::milliseconds(200));\n \
  \     cout << name << \": \" << \"Work \" << i << endl;\n    }\n  }\nprivate:\n\
  \  string name; \n};\n\nthread herb= thread(Worker(\"Herb\"));\nthread andrei= thread(Worker(\"\
  \ Andrei\"));\nthread scott= thread(Worker (\"    Scott\"));\nthread bjarne= thread(Worker(\"\
  \      Bjarne\"));\n```\n\n对 `std::cout` 的非同步写入\n\n![](img/privat----writeToCout.png)\n\
  \n`std::cout` 上的输出没有经过协调。示例中的 `std::cout` 是共享变量，它应该拥有流的独占访问权。\n\n#### 互斥锁\n\n互斥锁（mutex）`m`\
  \ 保证一次只有一个线程可以访问临界区域。它们需要头文件 `<mutex>`。互斥锁 `m` 通过调用 `m.lock()` 锁定临界区，通过调用 `m.unlock()`\
  \ 解锁它。\n\n```cpp\n// mutex.cpp \n...\n#include <mutex>\n#include <thread>\n...\n\
  \nusing namespace std;\n\nstd::mutex m;\n\nstruct Worker{\n  Worker(string n):name(n){};\n\
  \  void operator() (){\n    for (int i= 1; i <= 3; ++i){\n      this_thread::sleep_for(chrono::milliseconds(200));\n\
  \      m.lock();\n      cout << name << \": \" << \"Work \" << i << endl;\n    \
  \  m.unlock();\n    }\n  }\nprivate:\n  string name; \n};\n\nthread herb= thread(Worker(\"\
  Herb\"));\nthread andrei= thread(Worker(\" Andrei\"));\nthread scott= thread(Worker\
  \ (\"    Scott\"));\nthread bjarne= thread(Worker(\"      Bjarne\"));\n```\n\n###\
  \ 互斥锁变体\n\n| 方法 | mutex | recursive_mutex | timed_mutex | recursive_time_mutex |\
  \ shared_time_mutex |\n| --- | --- | --- | --- | --- | --- |\n| `lock` | yes | yes\
  \ | yes | yes | yes |\n| `unlock` | yes | yes | yes | yes | yes |\n| `try_lock`\
  \ | yes | yes | yes | yes | yes |\n| `try_lock_for` | yes | yes | yes | yes | yes\
  \ |\n| `try_lock_until` | yes | yes | yes | yes | yes |\n\n`std::shared_time_mutex`\
  \ 允许它实现读写锁。需要相对 `time duration` 的 `m.try_lock_for(relTime)` 以及绝对 `time point` 的\
  \ `m.try_lock_until(absTime)`。\n\n#### 死锁\n\n死锁是指两个或多个线程被阻塞的状态，因为每个线程都在等待资源的释放。如果你忘记调用\
  \ `m.unlock()`，你很快就会遇到死锁。例如在 `getVar()` 函数中。\n\n```\nm.lock();\nsharedVar= getVar();\n\
  m.unlock()\n```\n\n错误的顺序锁定两个互斥锁是导致死锁的另一个典型原因。\n\n```cpp\n// deadlock.cpp \n...\n\
  #include <mutex>\n#include <thread>\n#include <iostream>\n\nstruct CriticalData{\n\
  \  std::mutex mut;\n};\n\nvoid deadLock(CriticalData& a, CriticalData& b){\n  a.mut.lock();\n\
  \  std::cout << \"get the first mutex\\n\";\n  std::this_thread::sleep_for(std::chrono::milliseconds(1));\n\
  \  b.mut.lock();\n  std::cout << \"get the second mutex\\n\";\n  a.mut.unlock(),\
  \ b.mut.unlock();\n}\n\nCriticalData c1;\nCriticalData c2;\n\nstd::thread t1([&]{\
  \ deadLock(c1, c2); });\nstd::thread t2([&]{ deadLock(c2, c1); });\n```\n\n一毫秒的短窗口（`std::this_thread::sleep_for(std::chrono::milliseconds(1))`）足以以高概率产生死锁，因为每个线程都在永久等待另一个互斥锁。结果是停滞。\n\
  \n![](img/privat----deadlock.png)\n\n#### 锁\n\n你应该将互斥锁封装在锁中以自动释放互斥锁。锁是 RAII 范式 的实现，因为锁将互斥锁的生命周期与其绑定在一起。C++11\
  \ 分别拥有用于简单场景的 `std::lock_guard` 和用于高级用例的 `std::unique_lock`。两者都需要 `<mutex>`。从 C++14\
  \ C++ 有了 `std::shared_lock`，它与互斥锁 `std::shared_time_mutex` 结合使用，是读写锁的基础。\n\n\n\n\
  \n`std::lock_guard` 仅支持简单的用例。因此，它只能在构造函数中绑定互斥量并在析构函数中释放它。所以，工作示例 的同步被简化为对构造函数的调用。\n\
  \n```cpp\n// lockGuard.cpp \n...\nstd::mutex coutMutex;\n\nstruct Worker{\n  Worker(std::string\
  \ n):name(n){};\n  void operator() (){\n    for (int i= 1; i <= 3; ++i){\n     \
  \ std::this_thread::sleep_for(std::chrono::milliseconds(200));\n      std::lock_guard<std::mutex>\
  \ myLock(coutMutex);\n      std::cout << name << \": \" << \"Work \" << i << std::endl;\n\
  \    }\n  }\nprivate:\n  std::string name;\n};\n```\n\n### 使用 `std::lock_guard`\
  \ 进行同步\n\n### `std::unique_lock`\n\n`std::unique_lock` 的开销比 `std::lock_guard` 更高。相反，`std::unique_lock`\
  \ 可以在没有互斥量的情况下创建，可以显式地锁定或释放其互斥量，也可以延迟对其互斥量的锁定。\n\n下表显示了 `std::unique_lock lk` 的方法。\n\
  \n`std::unique_lock` 的接口\n\n| 方法 | 描述 |\n| --- | --- |\n|   |  � |\n| `lk.lock()`\
  \ | 锁定关联的互斥量。 |\n|   |  � |\n| `std::lock(lk1, lk2, ...)` | 原子地锁定任意数量的关联互斥量。 |\n\
  |   |  � |\n| `lk.try_lock()` 和 | 尝试锁定关联的互斥量。 |\n| `lk.try_lock_for(relTime)` 和\
  \ |  � |\n| `lk.try_lock_until(absTime)` |  � |\n|   |  � |\n| `lk.release()` |\
  \ 释放互斥量。互斥量仍保持锁定状态。 |\n|   |  � |\n| `lk.swap(lk2)` 和 | 交换锁。 |\n| `std::swap(lk,\
  \ lk2)` |  � |\n|   |  � |\n| `lk.mutex()` | 返回关联的互斥量的指针。 |\n|   |  � |\n| `lk.owns_lock()`\
  \ | 检查锁是否拥有互斥量。 |\n\n由以不同顺序获取锁 引起的死锁可以通过 `std::atomic` 轻松解决。\n\n```cpp\n// deadLockResolved.\
  \ cpp \n...\n#include <mutex>\n...\n\nusing namespace std;\nstruct CriticalData{\n\
  \  mutex mut;\n};\n\nvoid deadLockResolved(CriticalData& a, CriticalData& b){\n\
  \  unique_lock<mutex>guard1(a.mut, defer_lock);\n  cout << this_thread::get_id()\
  \ << \": get the first lock\" << endl;\n  this_thread::sleep_for(chrono::milliseconds(1));\n\
  \  unique_lock<mutex>guard2(b.mut, defer_lock);\n  cout << this_thread::get_id()\
  \ << \": get the second lock\" << endl;\n  cout << this_thread::get_id() << \":\
  \ atomic locking\";\n  lock(guard1, guard2);\n}\n\nCriticalData c1;\nCriticalData\
  \ c2;\n\nthread t1([&]{ deadLockResolved(c1, c2); });\nthread t2([&]{ deadLockResolved(c2,\
  \ c1); });\n```\n\n### `std::unique_lock`\n\n由于 `std::unique_lock` 的参数 `std::defer_lock`，`a.mut`\
  \ 和 `b.mut` 的锁定被延迟了。锁定在调用 `std::lock(guard1, guard2)` 时原子地发生。\n\n![](img/privat----deadlockResolved.png)\n\
  \n### `std::shared_lock`\n\n`std::shared_lock` 与 `std::unique_lock` 相同的接口。此外，`std::shared_lock`\
  \ 支持多个线程共享同一个已锁互斥量的情况。对于这种特殊用例，你必须结合使用 `std::shared_timed_mutex` 使用 `std::shared_lock`。然而，如果多个线程在\
  \ `std::unique_lock` 中使用同一个 `std::shared_time_mutex`，则只有一个线程可以拥有它。\n\n```cpp\n#include\
  \ <mutex>\n...\n\nstd::shared_timed_mutex sharedMutex;\n\nstd::unique_lock<std::shared_timed_mutex>\
  \ writerLock(sharedMutex);\n\nstd::shared_lock<std::shared_time_mutex> readerLock(sharedMutex);\n\
  std::shared_lock<std::shared_time_mutex> readerLock2(sharedMutex);\n```\n\n示例展示了典型的读-写锁场景。类型为\
  \ `std::unique_lock<std::shared_timed_mutex>` 的 `writerLock` 只能独占 `sharedMutex`。两个类型为\
  \ `std::shared_lock<std::shared_time_mutex>` 的读锁 `readerLock` 和 `readerLock2` 可以共享同一个互斥量\
  \ `sharedMutex`。\n\n#### 线程安全的初始化\n\n如果你不修改数据，那么以线程安全的方式初始化它们就足够了。C++ 提供了多种实现此的方法：使用常量表达式、使用具有块作用的静态变量。\n\
  \n#### 常量表达式\n\n如果你不修改数据，那么以线程安全的方式初始化它们就足够了。C++ 提供了多种实现此的方法：使用常量表达式、使用具有块作用的静态变量。\n\
  \n### `std::shared_lock`\n\n`std::shared_lock` 与 `std::unique_lock` 相同的接口。此外，`std::shared_lock`\
  \ 支持多个线程共享同一个已锁互斥量的情况。对于这种特殊用例，你必须结合使用 `std::shared_timed_mutex` 使用 `std::shared_lock`。然而，如果多个线程在\
  \ `std::unique_lock` 中使用同一个 `std::shared_time_mutex`，则只有一个线程可以拥有它。\n\n### `std::unique_lock`\n\
  \n由于 `std::unique_lock` 的参数 `std::defer_lock`，`a.mut` 和 `b.mut` 的锁定被延迟了。锁定在调用 `std::lock(guard1,\
  \ guard2)` 时原子地发生。\n\n#### 常量表达式\n\n如果你不修改数据，那么以线程安全的方式初始化它们就足够了。C++ 提供了多种实现此的方法：使用常量表达式、使用具有块作用的静态变量。\n\
  \n### `std::shared_lock`\n\n`std::shared_lock` 与 `std::unique_lock` 相同的接口。此外，`std::shared_lock`\
  \ 支持多个线程共享同一个已锁互斥量的情况。对于这种特殊用例，你必须结合使用 `std::shared_timed_mutex` 使用 `std::shared_lock`。然而，如果多个线程在\
  \ `std::unique_lock` 中使用同一个 `std::shared_time_mutex`，则只有一个线程可以拥有它。\n\n#### 线程安全的初始化\n\
  \n如果你不修改数据，那么以线程安全的方式初始化它们就足够了。C++ 提供了多种实现此的方法：使用常量表达式、使用具有块作用的静态变量。\n\n#### 常量表达式\n\
  \n如果你不修改数据，那么以线程安全的方式初始化它们就足够了。C++ 提供了多种实现此的方法：使用常量表达式、使用具有块作用的静态变量。\n\n\n\n\n发送者和接收者都需要一个锁。对于发送者来说，`std::lock_guard`\
  \ 就足够了，因为它只调用一次锁和解锁。对于接收者来说，`std::unique_lock` 是必要的，因为它通常会频繁对其互斥量进行锁定和解锁。\n\n```cpp\n\
  // conditionVariable.cpp \n...\n#include <condition_variable>\n...\n\nstd::mutex\
  \ mutex_;\nstd::condition_variable condVar;\nbool dataReady= false;\n\nvoid doTheWork(){\n\
  \  std::cout << \"Processing shared data.\" << std::endl;\n}\n\nvoid waitingForWork(){\n\
  \  std::cout << \"Worker: Waiting for work.\" << std::endl;\n  std::unique_lock<std::mutex>\
  \ lck(mutex_);\n  condVar.wait(lck, []{ return dataReady; });\n  doTheWork();\n\
  \  std::cout << \"Work done.\" << std::endl;\n}\n\nvoid setDataReady(){\n  std::lock_guard<std::mutex>\
  \ lck(mutex_);\n  dataReady=true;\n  std::cout << \"Sender: Data is ready.\" <<\
  \ std::endl;\n  condVar.notify_one();\n}\n\nstd::thread t1(waitingForWork);\nstd::thread\
  \ t2(setDataReady);\n```\n\n# 条件变量\n\n![](img/privat----conditionVariable.png)\n\
  \n使用条件变量听起来可能很简单，但存在两个关键问题。\n\n### 信号量\n\n信号量是一种用于控制对共享资源并发访问的同步机制。计数信号量是一种特殊的信号量，它有一个大于零的计数器。计数器在构造函数中初始化。获取信号量会减少计数器，释放信号量会增加计数器。如果线程在计数器为零时尝试获取信号量，该线程将阻塞，直到另一个线程通过释放信号量来增加计数器。\n\
  \nC++20 支持 `std::binary_semaphore`，它是 `std::counting_semaphore<1>` 的别名。在这种情况下，最小最大值为\
  \ 1。\n\n```cpp\nusing binary_semaphore = std::counting_semaphore<1>;\n```\n\n与 `std::mutex`\
  \ 不同，`std::counting_semaphore` 不绑定到特定线程。这意味着 `acquire` 和 `release` 调用可以在不同的线程上发生。下表展示了\
  \ `std::counting_semaphore` 的接口。\n\n信号量 `sem` 的方法\n\n| 方法 | 说明 |\n| --- | --- |\n\
  | |   |\n| `counting_semaphore::max()` | 返回 `counter` 的最大值。 |\n| |   |\n| `sem.release(upd\
  \ = 1)` | 原子性地增加 `counter` 次 `upd`。 |\n| |   |\n| `sem.acquire()` | 执行 `sem.try_acquire`\
  \ 并阻塞直到 `counter` 大于零。 |\n| |   |\n| `sem.try_acquire()` | 原子性地减少 `counter`。 |\n\
  | |   |\n| `sem.try_acquire_for(relTime)` | 在持续时间范围内执行 `sem.try_acquire`。 |\n| |\
  \   |\n| `sem.try_acquire_until(absTime)` | 直到指定的时间点执行 `sem.try_acquire`。 |\n\n\
  方法 `sem.try_lock_for(relTime)` 需要一个相对[时间间隔]；方法 `sem.try_lock_until(absTime)` 需要一个绝对[时间点]。\n\
  \n信号量通常是[条件变量]更安全、更快的替代方案：\n\n```cpp\n// threadSynchronisationSemaphore.cpp\n\n\
  #include <semaphore>\n\n...\n\nstd::counting_semaphore<1> prepareSignal(0);    \
  \        // (1)\n\nvoid prepareWork() {\n\n    myVec.insert(myVec.end(), {0, 1,\
  \ 0, 3});\n    std::cout << \"Sender: Data prepared.\"  << '\\n';\n    prepareSignal.release();\
  \                            // (2)\n}\n\nvoid completeWork() {\n\n    std::cout\
  \ << \"Waiter: Waiting for data.\" << '\\n';\n    prepareSignal.acquire();     \
  \                       // (3)\n    myVec[2] = 2;\n    std::cout << \"Waiter: Complete\
  \ the work.\" << '\\n';\n    for (auto i: myVec) std::cout << i << \" \";\n    std::cout\
  \ << '\\n';\n\n}\n\n...\n\nstd::thread t1(prepareWork);\nstd::thread t2(completeWork);\n\
  \nt1.join();\nt2.join();\n```\n\n### `std::counting_semaphore`\n\n`std::counting_semaphore\
  \ prepareSignal`（第 1 行）可以取值为 0 和 1。在具体的示例中，它被初始化为 0。这意味着调用 `prepareSignal.release()`\
  \ 将值设置为 1（第 2 行），并解除调用 `prepareSignal.acquire()`（第 3 行）。\n\n![](img/privat----threadSynchronisationSemaphore.png)\n\
  \n### 协调类型\n\n倒计时（Latches）和屏障（Barrier）是允许某些线程阻塞直到计数器变为零的协调类型。在 C++20 中，我们有两个版本的倒计时和屏障：`std::latch`\
  \ 和 `std::barrier`。\n\n#### `std::latch`\n\n现在，我仔细查看 `std::latch` 的接口。\n\n`std::latch`\
  \ 的成员函数。\n\n| 成员函数 |  |\n| --- | --- |\n| |   |\n| `count_wait()` | 减少计数器并阻塞直到计数器达到零。\
  \ |\n| `wait()` | 阻塞直到计数器达到零。 |\n| `arrive()` | 原子性地将计数器减一。 |\n| `arrive_and_wait()`\
  \ | 原子性地减少计数器并阻塞直到计数器达到零。 |\n| `count_down(n)` | 原子性地减少计数器 `n` 次。 |\n| `count_down_and_wait(n)`\
  \ | 原子性地减少计数器 `n` 次并阻塞直到计数器达到零。 |\n\n```cpp\n// bossWorkers.cpp\n#include <latch>\n\
  #include <iostream>\n#include <thread>\n#include <vector>\n\nclass Worker {\npublic:\n\
  \    Worker(std::string n) : name(n) {}\n    void operator() {\n        std::cout\
  \ << name << \": working...\" << std::endl;\n        lat.arrive_and_wait(); // 3\n\
  \        std::cout << name << \": done.\" << std::endl;\n    }\nprivate:\n    std::string\
  \ name;\n    static std::latch& lat();\n};\n\nstd::latch& Worker::lat() {\n    static\
  \ std::latch l(2); // 5\n\nreturn l;\n}\n\nint main() {\n    std::cout << \"BOSS:\
  \ starting\" << std::endl;\n    std::thread t1(Worker(\"Herb\")); // 1\n    std::thread\
  \ t2(Worker(\"Scott\")); // 2\n    // ... lat.wait() // 4\n    std::cout << \"BOSS:\
  \ GO HOME!\" << std::endl;\n    t1.join();\n    t2.join();\n    return 0;\n}\n```\n\
  \n\n\n\n| `std::barrier::max` | 实现支持的最大值。 |\n\n`bar.arrive_and_drop()` 调用本质上意味着计数器在下一个阶段将减一。\n\
  \n### 任务 (Tasks)\n\n除了线程之外，C++ 还有任务用于异步执行工作。任务需要 `<future>` 头文件。任务通过一个工作包进行参数化，并由两个关联组件组成：一个\
  \ `promise` 和一个 `future`。两者通过一个数据通道连接。`promise` 执行工作包并将结果放入数据通道；关联的 `future` 则获取结果。两个通信端点都可以在独立的线程中运行。特殊之处在于，`future`\
  \ 可以在稍后获取结果。因此，`promise` 对结果的计算与关联的 `future` 对结果的查询是独立的。\n\n#### 线程与任务\n\n线程与任务非常不同。\n\
  \n在创建线程和被创建线程之间的通信中，必须使用共享变量。任务通过其数据通道进行通信，该通道是隐式保护的。因此，任务不能使用像 mutex 这样的保护机制。\n\
  \n创建线程通过 `join` 调用等待其子线程。`future fut` 使用 `fut.get()` 调用，如果没有结果，该调用将阻塞阻塞。\n\n如果在被创建线程中发生异常，被创建线程将终止，从而导致创建线程和整个进程的终止。相反，`promise`可以将异常发送给\
  \ `future`，由 `future` 必须处理该异常。\n\n`promise` 可以为一个或多个 `future` 服务。它可以发送值、异常或仅发送通知。你可以将任务作为条件变量的安全替代品。\n\
  \n```\n#include <future>\n#include <thread>\n...\n\nint res;\nstd::thread t([&]{\
  \ res= 2000+11;});\nt.join();\nstd::cout << res << std::endl;             // 2011\n\
  \nauto fut= std::async([]{ return 2000+11; });\nstd::cout << fut.get() << std::endl;\
  \       // 2011\n```\n\n子线程 `t` 和异步函数调用 `std::async` 计算 `2000` 和 `11` 之和。创建线程通过共享变量\
  \ `res` 从其子线程 `t` 获取结果。`std::async` 调用在发送者（promise）和接收者（future）之间创建数据通道。`future`\
  \ 通过 `fut.get()` 向数据通道查询计算结果。`fut.get` 调用是阻塞的。\n\n#### `std::async`\n\n`std::async`\
  \ 类似于异步函数调用。该函数调用接收一个 callable 及其参数。`std::async` 是一个变变模板，因此可以接受任意数量的参数。`std::async`\
  \ 的调用返回一个 future 对象 `fut`。这是你通过 `fut.get()` 获取结果的句柄。你可以为 `std::async` 指定启动策略。你可以通过启动策略显式确定异步调用是在在相同线程中执行（`std::launch::deferred`）还是在另一个线程中执行（`std::launch::async`）。\n\
  \n调用 `auto fut= std::async(std::launch::deferred, ... )` 的特殊之处在于 `promise` 不立即执行。`fut.get()`\
  \ 调用延迟启动 `promise`。\n\n```\n// asyncLazyEager.cpp \n...\n#include <future>\n...\n\
  using std::chrono::duration;\nusing std::chrono::system_clock;\nusing std::launch;\n\
  \nauto begin= system_clock::now();\n\nauto asyncLazy= std::async(launch::deferred,\
  \ []{ return system_clock::now(); });\nauto asyncEager= std::async(launch::async,\
  \ []{ return system_clock::now(); });\nstd::this_thread::sleep_for(std::chrono::seconds(1));\n\
  \nauto lazyStart= asyncLazy.get() - begin;\nauto eagerStart= asyncEager.get() -\
  \ begin;\n\nauto lazyDuration= duration<double>(lazyStart).count();\nauto eagerDuration=\
  \ duration<double>(eagerStart).count();\n\nstd::cout << lazyDuration << \" sec\"\
  ;                 // 1.00018 sec.\nstd::cout << eagerDuration << \" sec\";     \
  \           // 0.00015489 sec.\n```\n\n使用 `std::async` 的延迟与急切\n\n程序的输出显示，与 future\
  \ `asyncLazy` 关联的 `promise` 的执行比与 future `asyncEager` 关联的 `promise` 晚了一秒。这一秒正是创建者在\
  \ future `asyncLazy` 请求其结果之前睡眠的时间的时间。\n\n#### `std::packaged_task`\n\n`std::packaged_task`\
  \ 允许你为可调用对象构建一个简单的封装器，之后可以在单独线程上执行。\n\n因此，需要四个步骤：\n\nI. 封装你的工作：\n\n```\n std::packaged_task<int(int,\
  \ int)> sumTask([](int a, int b){ return a+b; });\n```\n\nII. 创建一个 future：\n\n```\n\
  \ std::future<int> sumResult= sumTask.get_future();\n```\n\nIII. 执行计算：\n\n```\n\
  \ sumTask(2000, 11);\n```\n\nIV. 查询结果：\n\n```\n sumResult.get();\n```\n\n你可以在单独线程中移动\
  \ `std::package_task` 或 `std::future`。\n\n```\n // packaged_task.cpp \n#include\
  \ <future>\n#include <thread>\n#include <deque>\n#include <iostream>\n\nusing namespace\
  \ std;\n\nstruct SumUp {\n  int operator()(int beg, int end){\n    sum += end;\n\
  \    return sum;\n  }\nprivate:\n  int beg;\n  int sum{0};\n};\n\nint main() {\n\
  \  packaged_task<int(int, int)> sumTask([](int a, int b){ return a+b; });\n  future<int>\
  \ sumResult= sumTask.get_future();\n  thread t(std::move(sumTask), 2000, 11);\n\
  \  t.join();\n  cout << sumResult.get() << endl;\n  return 0;\n}\n```\n*(注：原文提供的后半部分存在大量重复和损坏字符，已根据逻辑结构进行了清理并完成翻译。)*\n\
  \n\n\n\n\n```cpp\n// promiseFuture.cpp \n...\n#include <future>\n...\n\nvoid product(std::promise<int>&&\
  \ intPromise, int a, int b){\n  intPromise.set_value(a*b);\n}\n\nint a= 20;\nint\
  \ b= 10;\n\nstd::promise<int> prodPromise;\nstd::future<int> prodResult= prodPromise.get_future();\n\
  \nstd::thread prodThread(product, std::move(prodPromise), a, b);\nstd::cout << \"\
  20*10= \" << prodResult.get();                 // 20*10= 200\n```\n\n### Promise\
  \ 和 future\n\npromise `prodPromise` 被移动到另一个线程中并执行计算。future 通过 `prodResult.get()`\
  \ 获取结果。\n\n## 20. 协程 (Coroutines)\n\n我们并没有在 C++20 中得到具体的协程（concrete coroutines），我们得到的是一个用于实现协程的框架。要使用具体的协程，你必须等待\
  \ C++23 或者使用 Lewis Baker 提供的 [cppcoro](https://github.com/lewissbaker/cppcoro) 库。因此，本章仅给你关于协程的大致概念。\n\
  \n协程是在保持其状态的同时可以挂和恢复执行的函数。为了实现这一点，协程由三部分组成：promise 对象、协程句（coroutine handle）和协程帧（coroutine\
  \ frame）。\n\n*   promise 对象在协程内部进行操作，并通过 promise 对象传递其结果。\n*   协程句是一个非所有权的句柄，用于从外部恢复或销毁协程帧。\n\
  *   协程帧是一个内部的、通常分配在堆上的状态。它包含了前面提到的 promise 对象、协程的拷贝参数、挂起点的表示、生命周期在当前挂起点之前结束的局部变量，以及生命周期超过当前挂起点的局部变量。\n\
  \n为了优化协程的分配，需要满足两个条件：\n\n使用 `co_return` 代替 `return`、`co_yield` 或 `co_await` 关键字的函数将隐式成为协程。\n\
  \n这些新关键字通过两个新概念扩展了 C++ 函数的执行。\n\n### `co_yield expression`\n\n允许它编写一个生成器函数（generator\
  \ function）。生成器函数每次返回一个新值。生成器函数是一种可以从中选取值的数据流。该数据流可以是无限的。\n\n```cpp\nGenerator<int>\
  \ getNext(int start = 0, int step = 1) noexcept {\n    auto value = start;\n   \
  \ for (int i = 0;; ++i){\n        co_yield value;\n        value += step;\n    }\n\
  }\n```\n\n### `co_await expression`\n\n挂起并恢复表达式的执行。如果你在函数 `func` 中使用 `co_await expression`，如果函数的结果不可用，则调用\
  \ `auto getResult = func()` 不会阻塞。相反于消耗资源的阻塞，你获得了一种资源友好的等待。该表达式必须是一个可等待表达式（awaitable\
  \ expression），并支持以下三个函数 `await_ready`、`await_suspend` 和 `await_resume`。\n\n```cpp\n\
  Acceptor acceptor{443};\n\nwhile (true){\n    Socket socket= co_await acceptor.accept();\n\
  \    auto request= co_await socket.read();\n    auto response= handleRequest(request);\n\
  \    co_await socket.write(response);\n}\n```\n\n### 协程\n\n在 `co_await expr` 中的可等待表达式\
  \ `expr` 必须实现 `await_ready`、`await_suspend` 和 `await_resume` 函数。\n\n### 可等待对象 (Awaitables)\n\
  \nC++20 标准已经定义了两个基础构建的可等待对象：`std::suspend_always` 和 `std::suspend_never`。\n\n```cpp\n\
  struct suspend_always {\n    constexpr bool await_ready() const noexcept { return\
  \ false; }\n    constexpr void await_suspend(coroutine_handle<>) const noexcept\
  \ {}\n    constexpr void await_resume() const noexcept {}\n};\n\nstruct suspend_never\
  \ {\n    constexpr bool await_ready() const noexcept { return true; }\n    constexpr\
  \ void await_suspend(coroutine_handle<>) const noexcept {}\n    constexpr void await_resume()\
  \ const noexcept {}\n};\n```\n\n### 预定义的等待对象\n\n### 使用 `co_yield` 的无限数据流\n\n以下程序产生了一个无限数据流。协程\
  \ `getNext` 使用 `co_yield` 创建了一个从 `start` 开始并在请求时提供按 `step` 增加下一个值的数据流。\n\n```cpp\n\
  // infiniteDataStream.cpp\n\n...\n\n#include <coroutine>\n\ntemplate<typename T>\n\
  struct Generator {\n\n    struct promise_type;\n    using handle_type = std::coroutine_handle<promise_type>;\n\
  \n    Generator(handle_type h): coro(h) {}                         // (3)\n    handle_type\
  \ coro;\n\n    ~Generator() {\n        if ( coro ) coro.destroy();\n    }\n    Generator(const\
  \ Generator&) = delete;\n    Generator& operator = (const Generator&) = delete;\n\
  \    Generator(Generator&& oth) noexcept : coro(oth.coro) {\n        oth.coro =\
  \ nullptr;\n    }\n    Generator& operator = (Generator&& oth) noexcept {\n    \
  \    coro = oth.coro;\n        oth.coro = nullptr;\n        return *this;\n    }\n\
  \    T getValue() {\n        return coro.promise().current_value;\n    }\n    bool\
  \ next() {                                                // (5)\n        coro.resume();\n\
  \        return not coro.done();\n    }\n    struct promise_type {\n        promise_type()\
  \ = default;\n\n        auto initial_suspend() {                               \
  \ // (4)\n            return suspend_always{};\n        }\n        auto final_suspend()\
  \ {\n            return suspend_always{};\n        }\n        auto get_return_object()\
  \ {                             // (2)\n            return Generator{handle_type::from_promise(*this)};\n\
  \        }\n        void return_void() {\n            return suspend_never{};\n\
  \        }\n\n        auto yield_value(T value) {                             //\
  \ (6)\n            current_value = value;\n            return suspend_always{};\n\
  \        }\n        void unhandled_exception() {\n            std::exit(1);\n  \
  \      }\n        T current_value;\n    };\n\n};\n\nGenerator<int> getNext(int start\
  \ = 0, int step = 1){\n    auto value = start;\n    for (int i = 0;; ++i){\n   \
  \     co_yield value;\n        value += step;\n    }\n}\n\nint main() {\n\n    std::cout\
  \ << std::endl;\n\n     std::cout << \"getNext():\";\n    auto gen = getNext();\n\
  \    for (int i = 0; i <= 10; ++i) {\n        gen.next();\n        std::cout <<\
  \ \" \" << gen.getValue();                      // (7)\n    }\n\n    std::cout <<\
  \ std::endl;\n}\n```\n\n### 无限数据流\n\n`main` 程序创建了协程。协程 `gen` (7) 返回从 0 到 10 的值。\n\
  \n![无限数据流](img/infiniteDataStream.png)\n\n### 无限数据流\n\n`infiniteDataStream.cpp`\
  \ 中的数字代表工作流的步骤。\n\n1.  创建 promise\n2.  调用 `get_return_object()` 并结果保存在局部变量中\n3.\
  \  创建生成器\n4.  调用 `initial_suspend()`。生成器是懒性的，因此会总是挂起。\n5.  请求下一个值，如果生成器被消耗了则返回\n\
  6.  由 `co_yield` 调用触发。之后下一个值变为可用。\n7.  获取下一个值\n\n在后续迭代中，只执行步骤 5 和 6。\n\n## 索引 (Index)\n\
