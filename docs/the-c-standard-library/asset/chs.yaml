  \n### `std::make_tuple`\n\n辅助函数 [`std::make_tuple`](http://en.cppreference.com/w/cpp/utility/tuple/make_tuple)\
  \ 对于创建元组非常方便。你不需要提供类型，编译器会自动推导出它们。\n\n```cpp\n// tuple.cpp\n...\n#include <tuple>\n\
  ...\nusing std::get;\n\nstd::tuple<std::string, int, float> tup1(\"first\", 3, 4.17f);\n\
  auto tup2= std::make_tuple(\"second\", 4, 1.1);\n\ncout << get<0>(tup1) << \", \"\
  \ << get<1>(tup1) << \", \" << get<2>(tup1) << endl;  // first, 3, 4.17\ncout <<\
