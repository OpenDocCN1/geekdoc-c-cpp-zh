  *   `copyable and moveable`（可拷贝可移动）。\n\n值必须是：\n\n*   `default constructible`（默认构造），\n\
  *   `copyable and moveable`（可拷贝可移动）。\n\n与键关联的值构建一个对 `p`，使得你通过成员 `p.first` 获取 `p.second`\
