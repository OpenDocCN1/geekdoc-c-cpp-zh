  // ... move semantic logic ...\n```\n\n#### `std::forward`\n\n定义在头文件 `<utility>`\
  \ 中的函数 [`std::forward`](http://en.cppreference.com/w/cpp/utility/forward) 用于传递转发引用。\n\
  \n```cpp\n// ... forward reference logic ...\n```\n\n#### `std::swap`\n\n使用定义在头文件\
  \ `<utility>` 中的函数 [`std::swap`](http://en.cppreference.com/w/cpp/utility/swap)，你可以交换两个对象。\n\
  \n```cpp\n// swap.cpp\n...\n#include <utility>\n...\ntemplate <typename T>\ninline\
  \ void swap(T& a, T& b) {\n    T tmp(std::move(a));\n    a = std::move(b);\n   \
  \ b = std::move(tmp);\n}\n```\n\n\n\n\n\n[`std::bind_front`](https://en.cppreference.com/w/cpp/utility/functional/bind_front)\
  \ 从一个可调用对象创建一个可调用包装器。调用 `std::bind_front(func, arg ...)` 将所有参数 `arg` 绑定到 `func`\
  \ 的前面，并返回一个可调用包装器。\n\n## `std::function`\n\n[`std::function`](http://en.cppreference.com/w/cpp/utility/functional/function)\
  \ 可以在变量中存储任意的可调用对象。它是一种多态函数包装器。可调用对象可以是 Lambda 函数、函数对象或函数。如果你必须显式地指定可调用对象的类型，则 `std::function`\
  \ 总是必须的，且无法被 `auto` 替换。\n\n```cpp\n// dispatchTable.cpp \n...\n#include <functional>\n\
  ...\nusing std::make_pair;\nusing std::map;\n\nmap<const char, std::function<double(double,\
  \ double)>> tab;\ntab.insert(make_pair('+', [](double a, double b){ return a + b;\
  \ }));\ntab.insert(make_pair('-', [](double a, double b){ return a - b; }));\ntab.insert(make_pair('*',\
  \ [](double a, double b){ return a * b; }));\ntab.insert(make_pair('/', [](double\
  \ a, double b){ return a / b; }));\n\nstd::cout << tab'+';  // 8\nstd::cout << tab'-';\
  \  // -1\nstd::cout << tab'*';  // 15.75\nstd::cout << tab'/';  // 0.777778\n```\n\
  \n使用 `std::function` 的分发表\n\n`std::function` 的类型参数定义了 `std::function` 将接受的可调用对象的类型。\n\
  \n### 返回类型和参数类型\n\n| 函数类型 | 返回类型 | 参数类型 |\n| --- | --- | --- |\n| | | |\n| `double(double,\
  \ double)` | `double` | `double` |\n| | | |\n| `int()` | `int` | |\n| | | |\n| `double(int,\
  \ double)` | `double` | `int, double` |\n| | | |\n| `void()` | | |\n\n## Pairs（对）\n\
  \n通过 [`std::pair`](http://en.cppreference.com/w/cpp/utility/pair)，你可以构建任意类型的对。类模板\
  \ `std::pair` 需要头文件 `<utility>`。`std::pair` 拥有默认构造函数、拷贝构造函数和移动构造函数。对对象可以交换：`std::swap(pair1,\
  \ pair2)`。\n\n对经常被用于 C++ 标准库。例如，函数 `std::minmax` 将其结果作为一个对返回，关联容器](#chap06.xhtml_chapterXXXAssociativeSSSContainers)\
  \ `std::map`、`std::unordered_map`、`std::multimap` 和 `std::unordered_multimap` 以对的形式管理它们的键/值关联。\n\
  \n要获取对 `p` 的元素，你可以直接访问它，也可以通过索引访问。因此，通过 `p.first` 或 `std::get<0>(p)` 获取第一个元素，通过\
  \ `p.second` 或 `std::get<1>(p)` 获取对的第二个元素。\n\n对支持比较运算符 `==`、`!=`、`<`、`>` `<=` 和\
  \ `>=。如果你比较两个对，首先将比较成员 `pair1.first` 和 `pair2.first`，然后比较 `pair1.second` 和 `pair2.second`。其他比较运算符也采用相同的策略。\n\
  \n### `std::make_pair`\n\nC++ 有实用的辅助函数 [`std::make_pair`](http://en.cppreference.com/w/cpp/utility/pair/make_pair)\
  \ 来生成对，而无需指定它们的类型。`std::make_pair` 会自动推导出它们的类型。\n\n```cpp\n// pair.cpp\n...\n#include\
  \ <utility>\n...\nusing namespace std;\n...\npair<const char*, double> charDoub(\"\
  str\", 3.14);\npair<const char*, double> charDoub2= make_pair(\"str\", 3.14);\n\
  auto charDoub3= make_pair(\"str\", 3.14);\n\ncout << charDoub.first << \", \" <<\
  \ charDoub.second;    // str, 3.14\ncharDoub.first=\"Str\";\nget<1>(charDoub)= 4.14;\n\
  cout << charDoub.first << \", \" << charDoub.second;    // str, 4.14\n```\n\n辅助函数\
  \ `std::make_pair`\n\n## Tuples（元组）\n\n你可以使用 [`std::tuple`](http://en.cppreference.com/w/cpp/utility/tuple)\
  \ 创建任意长度和类型的元组。类模板需要头文件 `<tuple>`。`std::tuple` 是 `std::pair` 的泛化。你可以在两个元素的元组和对之间转换。元组像它的小兄弟\
  \ `std::pair` 一样，拥有默认构造函数、拷贝构造函数和移动构造函数。你可以使用函数 `std::swap` 交换元组。\n\n元组 `t` 的第 `i`\
  \ 个元素可以通过函数 `std::get` world：`std::get<i-1>(t)`。`std::get<type>(t)` 可以直接引用 `type`\
  \ 元素。\n\n元组支持比较运算符 `==`、`!=`、`<`、 `<=` 和 `>=。如果你比较两个元组，元组的元素将按字典顺序比较。比较从索引 0 开始。\n\
  \n### `std::make_tuple`\n\n辅助函数 [`std::make_tuple`](http://en.cppreference.com/w/cpp/utility/tuple/make_tuple)\
