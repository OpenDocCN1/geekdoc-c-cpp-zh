  md: "# 9.5. Floating Point Assembly Language Procedures with C/C++ 349\n\n```\n\
    /* C program to provide I/O for quadratic equation solver */\n/* author: R. Detmer\
    \ */\n/* date: 7/2008 */\n\n#include <stdio.h>\n\nvoid roots(float a, float b,\
    \ float c, float* x1, float* x2);\n/* * find roots of quadratic equation *\n\n\
    int main() {\n    float a, b, c;\n    float root1, root2;\n\n    printf(\"please\
    \ enter coefficients: %f\");\n    scanf(\"%f %f %f\", &a, &b, &c);\n    roots(a,\
    \ b, c, &root1, &root2);\n    printf(\"nroot 1 %f\\nroot 2 %f\\n\", root1, root2);\n\
    \    return 0;\n}\n```\n\nFigure 9.26 C test driver for roots procedure\n\nFigure\
    \ 9.26 shows a simple C program to input coefficient values and display results.\
    \ This program and roots are part of the console32 project. Figure 9.27 shows\
    \ a sample run of the program.\n\nIf you prefer C++ to C, you can use the C++\
    \ test driver shown in Figure 9.28, combined in a console32 project with the assembly\
    \ roots procedure in Figure 9.22. The only notable feature of this C+ code is\
    \ the \"C\" specification in the extern directive. This tells the C++ compiler\
    \ to call roots using C linkage conventions. Figure 9.29 shows a sample run.\n\
    \nIn the 32-bit environment a procedure that returns a single integer floating\
    \ point value in the accumulator. We have seen several examples of how floating\
    \ point arguments are passed in a 32-bit environment—basically on the stack as\
    \ integer arguments are passed\n\nWe now take a brief look at how floating point\
    \ arguments are passed in a 64-bit environment. In 64-bit mode, a single floating\
    \ point value is returned in XMM0. The first floating point parameters are passed\
    \ in XMM0, XMM1, XMM2, and XMM3. If floatingpoint and integer parameters are mixed,\
    \ then RCX, RDX, R8, and R9 are used for the integer parameters, and the XMM registers\
    \ are used for the floating point parameters"
