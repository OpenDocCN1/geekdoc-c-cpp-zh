    # 8.5 Chapter Summary


    The word string refers to a collection of consecutive bytes, words, double-words,
    or quadwords in memory. The 80x86 instruction set includes five instructions for
    operating on strings: mov (to move or copy a string to a destination location),
    cmps (to compare two strings), scas (to scan a string for a particular element),
    stos (to store a given value in a string), and lods (to copy a string element
    into the accumulator). Each of these has mnemonic forms ending with b, w, d, or
    q to give the size of the string element.


    A string instruction operates on one string element at a time.'
