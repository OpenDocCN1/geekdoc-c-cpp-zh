  md: 'bytes of physical memory (256 TB), 65,536 times the maximum in a 32-bit system.
    Current PC systems are not designed to hold this much memory.


    Physically a PC''s memory consists of integrated circuits (ICs). Many of these
    chips provide random access memory (RAM) that can be written to or read from by
    program instructions. The contents of RAM chips are lost when the computer''s
    power is turned off. Other ICs are read only memory (ROM) chips that permanently
    retain their contents, and which can be read from but not written to.


    The assembly language programs in this book use a flat memory model. This means
    that the programs actually encode 32-bit addresses to locally reference locations
    in a single memory space where data and instructions are stored.


    The Intel 8086 architecture also provides for a segmented memory model. In the
    8086/8088 CPU, the PC''s memory is visualized as a collection of segments, each
    segment 64-KB long, starting on an address that is a multiple of 16. This means
    that one segment starts at address 00000, (overlapping the first) starts at address
    16 (00010₁₆), another starts at address 32 (00020₁₆), and so on. Note that the
    starting address of a segment ends in 0 when written in hex. The segment number
    of a segment consists of the first four digits of its physical address.


    A program written for the 8086/8088 does not encode a five-digit address. Instead,
    each memory reference depends on its segment number and a 16-bit offset from the
    beginning of the segment. Normally the offset is encoded, and the segment number
    is deduced from context. The offset is the distance from the first byte of the
    segment being addressed. Hex an offset is between 0000 and FFFF₁₆. The notation
    for a segment-offset address is the four-hex-digit segment number followed by
    a colon (:) followed by the four-hex-digit offset.


    As an example, 18A35B27 refers to the byte that is 5B27 from the beginning of
    the segment starting at address 18A30. Add the starting address and the offset
    to get the five-digit address.


    ```

    18A3          starting address of segment 18A3

    + 5B27        offset

    1E557         five-hex-digit address

    ```


    From the 8038 on, 8086 processors had both 16-bit and 32-bit segmented memory
    models available. Segment numbers are still 16-bits long, but they do not directly
    reference a segment in memory. Instead, a segment number is used as an index into
