    Also recall from Figure 4.3 that EBX is encoded as 011, the value in the r/m field
    of both instructions. The 11 in the mod field indicates an immediate operand.


    Now look at the two instructions that have source dbl. You can see this direct
    memory address encoded as 00001C8. The Mod/RM bytes of 05 and 2D for the add and
    sub instructions, respectively, break down into 00 000 101 and 00 101 101. The
    reg fields allow distinguish between addition and subtraction, and the combination
    of 00 in mod and 101 in r/m means direct memory addressing.


    The inc (increment) and dec (decrement) instructions are special-purpose addition
    and subtraction instructions, always using 1 as an implied source. They have the
    forms


    ```

    inc      destination

    ```


    and


    ```

    dec      destination

    ```


    The add and sub instructions, these instructions are paired with respect to allowed
    operands, clock cycles, and bytes of object code. They are summarized together
    in Figure 4.10. Prefix bytes are not shown and are not counted in the bytes of
    object code.


    Notice the 4x opcodes used for single byte inc and dec instructions with register
    16 and 32 registers. These are exactly the bit patterns used for REX prefixes
    in 64-bit mode. In a 64-bit environment the assembler chooses the FF opcode, and
    uses the leg field of the Mod/RM as shown in Figure 4.9 to distinguish between
    inc and dec, and the R/M field to identify the destination register. This 2-byte
    form could be used in 32-bit mode, but the assembler normally chooses the more
    compact 1-byte form.


    The inc and dec instructions treat the value of the destination operand as an
    unsigned integer. They affect the OF, SF, and ZF flags just like addition or subtraction
    of one, but they do not change the carry flag CF. Here are examples showing the
    execution of a few increment and decrement instructions:'
