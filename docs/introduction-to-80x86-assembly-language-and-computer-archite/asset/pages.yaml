    An address like source+4 refers to the location 4 bytes (doubleword) after the
    address of source. Since the four doublewords reserved at source are contiguous
    in memory, source+4 refers to the second doubleword. This code clearly would not
    be in space efficient if you needed to copy 400 or 400 doublewords. In Chapter
    5 you will learn how to set up a loop to copy multiple objects.


    The x86 has a useful xchg instruction that exchanges data in one location with
    another location. It accomplishes this in a single operation that often requires
    three high-level language instructions. Suppose value1 and value2 are being exchanged.
    In a design or a high-level language, this might be done using


    ```

    temp := value1;      // swap value and value2

    value1 := value2;

    value2 := temp;

    ```


    If value1 is stored in the EAX register and value2 is stored in EBX, we might
    use ECX for temp and directly implement this design with


    ```

    mov    ecx, eax      ; swap value and value2

    mov    eax, ebx

    mov    ebx, ecx

    ```


    The xchg instruction makes the code shorter and clearer.


    ```

    xchg    eax, ebx    ; swap value and value2

    ```


    It is much easier to write one instruction than three and the resulting code is
    easier to understand.


    Figure 4.7 lists the various forms of the xchg instruction. Although does not
    show it, the first operand can be a memory operand when the second operand is
    a register; the assembler effectively reverses the order of the operands and uses
    the form shown in the table. The xchg instructions illustrate that the accumulator
    sometimes plays a special role in a computer''s architecture. The instructions
    that swap another register with the accumulator take 1 byte (plus prefix bytes)
    instead of 2. Notice again that the word, doubleword, and quadword instructions
    are the same except for prefix bytes. We will take advantage of this in future
    tables to make them more compact'
