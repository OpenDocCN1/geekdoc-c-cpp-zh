  md: '# 3.6 Input/Output and Data Conversion Macros Defined in IO.H


    The header file io.h included in the windows32 project defines six macros; one
    for input, one for output, and four for conversions between ASCII and 2''s complement
    formats. The I/O macros facilitate input and output in a Windows environment,
    the conversion macros can be used whenever ASCII/integer conversions are needed.
    Both doubleword-size and word-size conversions are available, but recall that
    double integers are the preferred size. The six macros are summarized in Figure
    3.16.


    The job of the input macro is to prompt for a string of characters. The OK for
    the label of the Windows dialog box is put in the


    | Name | Parameter(s) | Action |

    |---|---|--|\| atod | source | Scans the string starting at source for or - followed
    by digits, interpreting these characters as an integer. The corresponding 2''s
    complement number is EAX. |

    | dtoa | destination, source | Converts the word at source (register or memory)
    to an 11-byte-long ASCII string at destination. |

    | atow | source | Similar to atcod, except that the resulting number is placed
    in AX. |

    | wtoa | destination, source | Converts the word at source (register or memory)
    to a 6-byte-long ASCII string at destination. |

    | input | prompt, length | Generates a dialog box with label specified by prompt,
    where prompt references a string in the data segment. When OK is pressed, up to
    length characters are copied from the dialog box to memory at destination. |

    | output | labelMsg, valueMsg | Generates a message box with the label labelMsg,
    and valueMsg in the message area. Each of labelMsg and valueMsg references a string
    in the data segment. |


    Figure 3.16 Macros in IO.H'
