    The ASCII to floating point conversion algorithm is given in Figure 9.15. It is
    similar to the algorithm used for the procedure atproc described in Section 7.3.
    It scans memory at the address given by its parameter, interpreting the characters
    as a floating point number. It looks for a leading minus sign and a decimal point.
    The scan is terminated by a null.


