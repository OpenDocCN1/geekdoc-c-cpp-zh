  md: '# 1.1 Binary and Hexadecimal Numbers


    With the Windows calculator, the Bin radio button can be used to obtain a binary
    result. However, a calculator isn''t needed to convert a hexadecimal number to
    its equivalent binary form. In fact, many binary numbers are too long to be displayed
    on a typical calculator. Instead, simply substitute 4 bits for each hex digit.
    The bits are those in the third column of Figure 1.1. Pad with leading zeros,
    as needed.


    ```

    38E2_{16} = 11 1011 1011 1110 0010_2

    ```


    The subscripts 16 and 2 are used to indicate the base of the system in which a
    number is written; they are usually omitted when there is little chance of confusion.
    The spaces in the binary number are just to make it more readable, vertical bars
    (||) work just as well as separators. Note that the rightmost hex digit 2 was
    converted to 0010, leading zeros. It was not necessary to convert the leading
    3 to 0011, although it would have been correct since leading zeros do not change
    the value of a number.


    To convert binary to hexadecimal, reverse the previous steps: Break the binary
    number into groups of four bits, starting from the right, and substitute the corresponding
    hex digit for each group of 4 bits. For example,


    ```

    1010111010011011111 = 101|1011|1010|0110|1111 = 5BA6F

    ```


    You have seen how to convert a binary to an equivalent decimal number. However,
    instead of converting a long binary number directly to decimal, it is faster to
    convert it to hex, and then convert the hex number to decimal. Again using the
    above 19-bit-long number,


    ```

    1010111010011011111_2

    = 101 1011 1010 1111

    = 5BA6F_{16}

    = 5 × 65536 + 11 × 4096 + 10 × 256 + 6 × 16 + 15 × 1

    = 37547_{10}

    ```


    Figure 1.3 shows an algorithm for converting a decimal number to its hex equivalent.
    It produces the hex digits to the right left. The algorithm is expressed in pseudocode.
    It illustrates some of the pseudocode conventions that will be used for algorithms
    and program designs in this book: := for assignment; for logical equality; repeat-until
    for a post-test loop; semicolons to terminate statements; indentation of loop
    bodies; and liberal use of words. This algorithm can be slightly modified to convert
    a number in any base system to its equivalent in any other base system. Just do
    the arithmetic in the original base system, repeatedly dividing by the new base.'
  merge: -1
  pgno: 20
