  md: '# 3.1 Assembly Language Statements


    Because assembly language programs are far from self-documenting, it is important
    to use an adequate number of comments. A comment can be used on any line. A semicolon
    (;) begins the comment, and the comment then extends until the end of the line.
    An entire line is a comment if the semicolon is in column 1, or a comment can
    follow working parts of a statement. Our example has comments on most lines. As
    important as they are for the human reader, comments are ignored by the assembler.


    There are three types of functional assembly language statements: instructions,
    directives, and macros. An **instruction** is translated by the assembler into
    one or more bytes of object code (machine code) which is executed at run time.
    Each instruction corresponds to one of the operations that the 8086 CPU can perform.
    Our program has five instructions:


    ```

    mov  eax, number

    add  eax, 158

    mov  sum, eax

    mov  eax, 0

    ret

    ```


    The first of these instructions copies the doubleword in memory at the location
    identified by number to the EAX register in the CPU. The second adds a doubleword
    representation of 158 to the current doubleword in the EAX register. The third
    copies the doubleword in the EAX register to the doubleword in memory identified
    by *sum*. The last two instructions exit to the operating system. Much of this
    book describes the formats and uses of 8086 instructions.


    A **directive** tells the assembler to take some action. Such an action generally
    does not result in machine instructions and may not cause object code to be generated.
    In our example, the directive


    .586 tells the assembler to recognize 8086 instructions that use 32-bit operands.
    The directive


    .MODEL FLAT tells the assembler to generate code for flat memory model execution.
    These directives and many others start with a period, but others do not.


    Our example program contains several other directives. The directive .STACK 4096
    tells the assembler to generate a request to the operating system to reserve 4096'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'bytes for the system stack is used at execution time for procedure calls and
    local storage. A stack containing 4096 bytes is large enough for most programs.


    The .DATA directive tells the assembler that data items are about to be defined
    in a data segment Each DWORD directive tells the assembler to reserve memory for
    data, the first identified with the label number and initialized to FFFFF97 (-105_{10}),
    the second identified with the label sum and gives the default initial value of
    0000000. Section 3.3 provides additional information about data definition directives.


    The .CODE directive tells the assembler that the next statements are executable
    instructions in a code section. The PROC directive marks the beginning of a procedure
    and the END directive the end of a procedure. The END directive on the last line
    tells the assembler to stop assembling statements.


    A macro is "shorthand" for a sequence of other statements—directives, or even
    other macros. The assembler expands a macro to the statements it represents, and
    then assembles the resulting statements. Our example program uses no macro. You
    will see several examples of macros in Sections 3.5 and 3.6.


    A statement is more than just a comment almost always contains a mnemonic that
    identifies the purpose of the statement, and may have three other fields: name,
    operand, and comment. These components must be in the following order:


    name          mnemonic        operand(s)      comment


    For example, a program might contain the statement


    ```

    zeroCount: mov ecx, 0 ; initialize count to zero

    ```


    The name field ends with a colon (:) when used with an instruction. However, when
    used with a directive, the name field has no colon. The mnemonic in a statement
    indicates a specific instruction, directive, or macro. Some statements have no
    operand, others have one, others more than one. If there is more than one, operands
    are separated by commas, spaces can also be added. Sometimes a single operand
    has components with spaces between them, making it look more than one operand.


    One use for the name field is to symbolically reference an instruction''s address
    in memory. Other instructions can then easily refer to the labeled instruction.
    The add instruction in the sample program needed to be repeatedly executed in
    a program loop, then it could be coded


    ```

    addLcop: add eax, 158

    ```'
