  md: '# 302 Floating Point Operations


    values. In general, an exponent of 0 bits or all 1 bits is special for each floating
    point format. This means that the largest actual exponent in single format is
    $254-1$, or $127$. The largest fraction is $1.111111111111111111111111_2$, which
    is almost $2.0-2_{10}$. This means that the largest single floating point value
    is approximately $2 \times 2^{127}$ or about $3.40 \times 10^{38}$. Verification
    of other minima and maxima is left to exercises.


    The single format has 24 significant fraction bits, the implied 1 bit but 23 bits
    that are used, for $2^{23}$ distinct patterns. $2^{23} = 8,388,608$, the single
    format has about seven decimal digits of precision. Verification of other precision
    calculations are left as exercises. Figure 9.1 summarizes among the three floating
    point formats


    The formats described above are for normalized representations, ones where binary
    scientific notation mantissa is written starting with 1 and the binary point.
    These are the commonly used representations. Obviously zero cannot be normalized.
    The pattern of all 0 bits represents +0. A 1 followed by 0 bits represents -0.
    The IEEE standards and the 80x86 architecture provide for other non-normalized
    values. The IEEE standards define finite values for +$\infty$ and $-\infty$, and
    NaN (''not a number''), a format that is used when a calculation leads to a nonrepresentable
    value


    Obviously not all real numbers can be represented in any floating point system—there
    are infinitely many real numbers and only a finite number of bit patterns in 32,
    64, or 80 bits. Many decimal numbers, such as our example 73.375 and all numbers
    unless the magnitude is too large, have exact representations. The numbers that
    can be exactly represented are not evenly distributed. On the real line, they
    are very dense around 0.0 and become more sparse as you move toward larger and
    larger values. In other words, for a real number without an exact representation,
    if it is close to 0.0, the floating point approximation will be very close, but
    if it is


