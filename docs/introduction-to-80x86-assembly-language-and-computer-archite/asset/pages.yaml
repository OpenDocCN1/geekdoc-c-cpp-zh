    Figure 8.14 Doubleword to ASCII conversion procedure (continued)


    The procedure then stores the correct "sign" in the CL register. A blank is used
    for a number greater than or equal to zero, and minus character (-) is used for
    a negative number. A negative number is also negated, giving its absolute value
    for subsequent processing.

    Finally the main idea is executed. The divisor 10 is placed in the EBX register.
    The nonnegative number is extended to a doubleword by putting 0 in EDX. Division
    by the 10 in EBX gives a remainder from 0 to 9 in EDX, the last decimal digit
    of the number. This is converted to the corresponding ASCII code by adding 30₁₆—recall
    that the ASCII codes for digits 0 through 9 are 30₁₆ through 39₁₆. The ASCII code
    is then placed in the destination string, and EDI is decremented to the next position
    to the left.

    This process is repeated until the quotient is 0. Finally the "sign" stored in
    CL (blank or --) is copied to the immediate left of the last code for a digit.
    Other positions to the left, if any, were previously filled with blanks.'
