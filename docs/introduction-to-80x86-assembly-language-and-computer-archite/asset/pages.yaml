  md: '# SECOND EDITION


    # INTRODUCTION TO

    80x86 Assembly Language and Computer Architecture


    RICHARD C. DETMER


    Thoroughly revised, the second edition of Introduction to 80x86 Assembly Language
    and Computer Architecture provides readers with a clear and concise introduction
    to the computer''s inner workings and its many levels and functions. Through writing
    real assembly language programs with actual instruction sets, readers will become
    acquainted with the basics of computer architecture. The second edition uses the
    Microsoft Visual Studio® environment, which is widely available to students and
    professionals; this provides a robust environment for editing, assembling, debugging,
    and executing programs. The text continues to emphasize basic architecture, not
    just the 80x86 processor line. The book includes 64-bit operations, but is still
    appropriate for those working with 32-bit computers.


    Programmers are expected to program effectively at any level. Ensure you are up-to-speed
    with Introduction to 80x86 Assembly Language and Computer Architecture, Second
    Edition.


    # KEY FEATURES OF THE SECOND EDITION:


    +   Uses the Microsoft® Visual Studio® environment. All programs in the text have
    been tested using Visual Studio® 2008, Professional Edition.


    +   Updates 64-bit architecture; however, topics are arranged so that 64-bit operations
    can be covered or omitted at the instructor''s discretion.


    +   Includes a revised Windows-oriented I/O package. All I/O macros and program
    examples are available on the text''s website.


