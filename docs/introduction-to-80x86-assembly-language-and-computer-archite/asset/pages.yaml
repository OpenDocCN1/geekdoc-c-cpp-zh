  md: '# 1.2 Character Codes


    Letters, numerals, punctuation marks, and other characters are represented in
    a computer by assigning a numeric value to each character. Several schemes for
    assigning these numeric values have been used. The system commonly used with microcomputers
    is the American Standard Code for Information Interchange (abbreviated ASCII and
    pronounced ASCII-ee).


    The ASCII system uses 7 bits to represent characters, so that values from 000
    0000 to 11 1111 are assigned to characters. This means that 128 different characters
    can be represented using ASCII codes. The ASCII codes are usually given as hex
    numbers from 00 to 7F or as decimal numbers from 0 to 127. There are several extended
    versions of ASCII. One common version assigns characters from 80 to FF, you may
    have seen some of their graphic representations if you tried to display a nonexistent
    font on your screen. The Unicode system uses 16 bits to represent a character,
    with 65,536 making it possible to represent characters most of the written languages
    in the world. ASCII characters are the first 128 Unicode characters, 0000 to 007F,
    formed by simply appending nine leading 0 bits to the ASCII code.


    Appendix A has a complete listing of ASCII codes. Using this table, you can check
    that the message


    Computers are fun.


    can be coded in ASCII, using hex numbers, as


    | 43 6F 6D 70 75 74 65 72 73 20 61 72 65 20 66 75 6E 20 2E |

    | C o m p u t e r s a r e f u n |


    Note that a space, even though it is invisible, has a character code (hex 20).


    Numbers can be represented using character codes. For example, the ASCII codes
    for the date October 21, 1976


    | 4F 63 74 6F 62 65 72 20 32 31 2C 20 31 39 37 36 36 |

    | O c t o b e r 2 1 , 1 9 7 6 |'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'with the number 21 represented ASCII codes 32 31, and the number 1976 represented
    using 31 39 37 36. This is very different from the binary representation in the
    last section, where $21_{10}=10101_2$, and $1976_{10}=11110111000_2$. Computers
    use both of these representations for numbers: ASCII for input and output, and
    for binary computations.


    The ASCII code assignments may seem rather arbitrary, but there are certain patterns.
    The codes for uppercase letters are contiguous, as are the codes for lowercase
    letters. The codes for an uppercase letter and the corresponding lowercase letter
    differ by exactly 1 bit. Bit 5 is 0 for an uppercase letter and 1 for the corresponding
    lowercase letter, while others are the same (In most computer architectures these
    are numbered right to left, starting with 0 for the rightmost bit). For example,


    +   - M codes as $4D_{16}=10010101_2$

    - m codes as $6D_{16}=01101101_2$


    The printable characters are grouped from $20_{16}$ to $7E_{16}$ (A space is considered
    a printable character). Numerals $0, 1, \dots, 9$ have ASCII codes $30_{16}, 31_{16},
    \dots$, respectively.


    The characters from $00_{16}$ to $1F_{16}$, along with $7F_{16}$, are known as
    control characters. For example, the ESC stands for "extra services control" but
    most people use "escape." ESC character is often used in combination with other
    characters to a peripheral device like a printer to turn on a special feature.
    Since such characters are not standardized, they are not covered in this book.


    Carriage return (CR) and line feed (LF) are frequently used ASCII characters.
    The $0D_{16}$ for CR is generated by an ASCII keyboard when the Enter key is pressed.
    When CR is sent to an ASCII display it causes the cursor to move to the beginning
    of the current line, without going down to a new line. When CR is sent to the
    beginning of a line (at least one of order design), it causes the print to move
    to the beginning of a line. The $0A_{16}$ for LF is caused by an ASCII display
    to move the cursor straight down, or a printer to roll the paper up one line,
    in both cases. To display a message and move to the beginning of a new line, it
    is necessary to send the message characters plus CR and LF characters to the screen
    or printer.


    Lesser control characters include form feed ($0C_{16}$), which causes many printers
