  md: '# Basic Instructions


    | Source (divisor) Size | Implicit Operand (dividend) | Quotient | Remainder |

    |---|---|---|--|

    | byte | AX | AL | AH |

    | word | DX:AX | AX | DX |

    | doubleword | EDX:EAX | EAX | EDX |

    | quadword | RDX:RAX | RAX | RDX |


    Figure 4.20 Operands and results for 80x86 division instructions


    and


    div source


    The source operand identifies the divisor. The divisor can be in a register or
    memory not immediate. Both div and idiv use an implicit dividend (the operand
    is dividing into). If source is byte length, then the double-length dividend is
    word size and it must be in the AX register. If source is word length, then the
    dividend is the doubleword in DX:AX, that is, with its high-order 16 bits in the
    DX register and its low-order 16 bits in the AX register. If source is doubleword,
    then the dividend is a quadword (64 bits) in EDX:EAX, that is, with its high-order
    32 bits in the EDX register and its low-order 32 bits in the EAX register. If
    source is quad length, then the dividend is the double quadword (128-bit number)
    in RDX:RAX, that is, with its high-order 64 bits in the RDX register and its low-order
    64 bits in the RAX register.


    The table in Figure 4.20 summarizes the locations of division, quotient, and remainder
    for 8086 division instructions.


    The source operand (the divisor) is not changed by a division instruction. After
    a word in AX is divided by a byte-length dividend, the quotient will be in the
    AL register and the remainder will be in the AH register. After a doubleword in
    DX and AX is divided by a word-length dividend, the quotient will be in the AX
    register and the remainder will be in the DX register. After a quadword in EDX
    and AX is divided by a doubleword-length divisor, the quotient will be in the
    EAX register and the remainder will be in the EDX register. After a 128-bit integer
    in RDX:RAX is divided by a quadword-length divisor, the quotient will be in the
    RAX register and the remainder will be in the R register.


    For all operations the dividend, divisor, quotient, and remainder are defined
    by the equation


    dividend = quotient*divisor + remainder'
