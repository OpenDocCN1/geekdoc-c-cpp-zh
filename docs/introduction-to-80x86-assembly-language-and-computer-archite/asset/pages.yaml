  md: 'Each cmp instruction compares two operands, and sets or resets AF, CF, OF,
    PF, SF, and ZF. The only job of a cmp instruction is to fix flag values; this
    is not just a side effect of some operation. Each has the form


    ```

    cmp operand1, operand2

    ```


    A cmp executes by calculating operand1 minus operand2, exactly like a sub instruction;
    the value of the difference and what happens in performing the subtraction determines
    the flag settings. A cmp instruction is like sub in that the value of the operand1
    location is not changed. The flags that are of most interest in this book are
    CF, OF, SF, and ZF. The carry flag CF is set if there is a borrow for the subtraction
    and reset if no borrow is required. The overflow flag OF is set if there is an
    overflow and reset otherwise. The sign flag SF is set if the difference represents
    a negative 2''s complement number (the leading bit is 1) and is reset if the difference
    is zero or positive. Finally, the zero flag ZF is set if the difference is nonzero.


    Here are a few examples showing how the flags are set or reset when representative
    byte-length numbers are compared. Recall that the subtraction operation is the
    same for signed and unsigned (2''s complement) values. Just as single-bit pattern
    can be interpreted as a signed number or an unsigned number, flag values have
    different interpretations after comparison of signed or unsigned values. The "interpretation"
    columns in the following table show the relationship of the operands under both
    signed and unsigned interpretations.


    | Example | Operand1 | Operand2 | Difference | CF | OF | SF | ZF | Interpretation
    |

    |---|---|---|---|---|---|---|---|---||

    | 1 | 3B | 3B | 00 | 0 | 0 | 0 | 1 | op1=op2 | op1=op2 |

    | 2 | 3B | 15 | 26 | 0 | 0 | 0 | 0 | op1>op2 | op1<op2 |

    | 3 | 15 | 3B | DA | 1 | 0 | 1 | 0 | op1<op2 | op1<op2 |

    | 4 | F9 | F6 | 03 | 0 | 0 | 0 | 0 | op1>op2 | op1<op2 |

    | 5 | F6 | F9 | FD | 1 | 0 | 1 | 0 | op1<op2 | op1<op2 |

    | 6 | 15 | F6 | 1F | 1 | 0 | 0 | 0 | op1>op2 | op1<op2 |

    | 7 | F6 | 15 | E1 | 0 | 0 | 1 | 0 | op1<op2 | op1>op2 |

    | 8 | 68 | A5 | C3 | 1 | 1 | 0 | 0 | op1>op2 | op1<op2 |

    | 9 | A5 | 68 | 3D | 0 | 1 | 0 | 0 | op1<op2 | op1>op2 |'
