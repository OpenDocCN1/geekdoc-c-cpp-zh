    # 6.4 64-Bit Procedures


    This section describes the differences in the 32-bit procedure protocol and the
    64-bit procedure protocol. First we look at the additional push and pop instructions
    available in 64-bit mode. These are shown in Figures 6.21 and 6.22. The entries
    in these tables are very similar to those for 32-bit mode instructions (see Figures
    6.1 and 6.5 in this chapter’s first section). There are entries for all 16 64-bit
    general registers. The REX prefix 41 is used for R8–R15.\ One important difference
    in 32 and 64-bit modes is that you cannot use 32-bit register or memory operands
    with 64-bit push and pop instructions. The available immediate operands for push
    remain byte, word, and doubleword–quadword is not added. Also, the pushad and
    popad instructions in 32-bit mode do not exist in 64-bit mode, nor are there instructions
    to push and pop all 16 64-bit registers.


    | Operand | Opcode | Bytes of Object Code |

    |---|---|--|

    | 64-bit mode | | |

    | RAX or R8 | 50 | 1 |

    | RCX or R9 | 51 | 1 |

    | RDX or R10 | 52 | 1 |

    | RBX or R11 | 53 | 1 |

    | RSP or R12 | 54 | 1 |

    | RBP or R13 | 55 | 1 |

    | RSI or R14 | 56 | 1 |

    | RDI or R15 | 57 | 1 |

    | memory word | FF | 2+ |

    | memory quadword | FF | 2+ |

    | immediate byte | 6A | 2 |

    | immediate word | 68 | 3 |

    | immediate doubleword | 68 | 5 |


    Figure 6.21 64-bit mode push instructions'
