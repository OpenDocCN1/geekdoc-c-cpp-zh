  md: '# 106 Basic Instructions


    Figure 4.8 gives information for both addition and subtraction instructions. For
    each add there is a corresponding sub instruction with exactly the same operand
    types and number of bytes of object code, so that it is redundant to make separate
    tables for add and sub instructions. Also, in the interest of more compact tables,
    prefix bytes are not shown with the opcode and are not counted in the number of
    bytes. Recall that 16-bit instructions will have a prefix byte and instructions
    that only in 64-bit mode will have a 4x prefix. The 64-bit mode do not include
    entries for R8B–R1B which are identical to the register 8 entries except for prefix
    bytes.


    With the 80x86, one memory operand can be encoded. Many computer architectures
    have no instructions for arithmetic when the destination is a memory operand.
    Other processors also use two memory operands for arithmetic operations.


    With add and sub, as with mov, the accumulator again has special instructions,
    this time RAX, EAX, AX, or AL is the destination and the source is immediate.
    These instructions take one less byte of object code than the corresponding instructions
    for other registers.


    The total number of code bytes for instructions with “-” entries in Figure 4.8
    can be calculated once you know the memory operand type. In particular, for direct
    mode, there are 4 additional bytes for the 32-bit address. For register indirect
    mode, no additional object code is required.


    Notice that an immediate source can be a single byte when the destination is a
    word, doubleword, or quadword. Since immediate operands are small, this makes
    the object code more compact. Byte-size operands are sign-extended to the size
    at run time before the addition or subtraction operation. If the original operand
    is negative (viewed as 2''s complement number), it is extended with FF (1 bit)
    to get the corresponding word- or doubleword-length value. A nonnegative operand
    is simply extended with 00 bytes. In both cases this is equivalent to copying
    the original sign bit to the high-order bit positions.


    A similar sign extension takes place in the instructions where the destination
    is a 64-bit register or a memory quadword and the source is an immediate doubleword.
    Addition and subtraction instructions do not permit 64-bit immediate operands.
    If you need to add or subtract a large immediate operand, you could use a mov
    instruction to put it in a register, and then use the register as the source for
    the add or sub.


    It may be surprising that some add and sub instructions have the same opcode.
    In such cases, the reg field in the ModR/B distinguishes between addition and
    subtraction. In fact, these same opcodes are used for additional instructions,
    most of which are covered later in this book. Figure 4.9 shows how the reg field
    is encoded for these opcodes and some others.'
