  md: 'The Visual Studio programming environment uses several other procedure protocols,
    one of which is stdcall. The stdcall protocol is similar to cdecl, the biggest
    differences being that the procedure rather than the caller must remove parameters
    from the stack (which uses the ret instruction with an operand handy!) and the
    text decoration convention is much more complex, involving not only a underscore
    but a trailing at (@) followed by a decimal number that is the number of parameters.
    The fastcall protocol gives another set of conventions. With fastcall, parameters
    are passed in registers. The important point here is that when you are mixing
    assembly language and a high-level language, you must know what protocol the high-level
    language compiler is and follow it carefully.


