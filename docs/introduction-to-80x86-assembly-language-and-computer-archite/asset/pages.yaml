  md: '# 1.5 Other Systems for Numbers


    1.2 and 1.3 presented commonly used systems for representing numbers in computers,
    strings of character codes (often ASCII), binary representation for unsigned integers,
    and 2''s complement representation for signed integers. This section introduces
    three additional schemes: 1''s complement, binary coded decimal (BCD), and floating
    point. The 1''s complement system is an alternative scheme for representing signed
    integers; it is used in a few computer systems, but not the Intel 80x86 family.
    Binary coded decimal can be thought of as halfway between ASCII to binary; while
    there are a few 80x86 instructions designed to operate on BCD representations,
    they are not covered in this book. Floating point forms are used to represent
    noninteger values; they are discussed more fully in Chapter 9. The primary reason
    for introducing 1''s complement, BCD, and floating point here is to illustrate
    that there are many alternative representations for numerical data, each valid
    when used in the correct context.


    The 1''s complement system is similar to 2''s complement. A fixed length is chosen
    and the positive integer is the binary form of the number, padded with one or
    more zeros on the left to get the desired length. To take the negative of number,
    each bit is “complemented”—each zero is changed to one and each one is changed
