    Addition subtraction instructions set the sign flag SF to be the same as the high-order
    bit of the result. Thus, when these instructions are used to add or subtract 2''s
    complement integers, SF=1 indicates a negative result. The zero flag ZF is 1 if
    the result is zero, and 0 if the result is nonzero. The carry flag CF records
    a carry out of the high-order bit with addition, or a borrow with subtraction.
    The overflow flag OF records overflow, discussed in Chapter 1.


    One reason that 2''s complement form is used to represent signed numbers is that
    it does not require special hardware for addition or subtraction—the same circuits
    can be used to add unsigned numbers and 2''s complement numbers. The flag values
    have different interpretations, though, depending on the operand type. For instance,
    if you add two large unsigned numbers and the high-order bit of the result is
    1, then SF will be set to 1, but this does not indicate a negative result, only
    a relatively large sum. For an add with unsigned operands, CF=1 would indicate
    that the result was too large to store in the destination, but with signed operands,
    OF=1 would indicate a size error.'
