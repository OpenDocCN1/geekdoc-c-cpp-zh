  md: '# Representing Data in a Computer


    ```

    repeat

    divide DecimalNumber by 16, getting Quotient and Remainder;

    Remainder (in hex) is the next digit (right to left);

    DecimalNumber := Quotient;

    until DecimalNumber = 0;

    ```


    Figure 1.3 Decimal-to-hex conversion algorithm


    Example

    as an example, the decimal-to-hex algorithm is traced for the decimal number 5876:


    +   * Since a repeat-until loop is a post-test loop structure, the controlling
    condition is not checked until after the body has been executed the first time.

    * Divide 16 into 5876 (DecimalNumber).


    | 367 Quotient | the new value for DecimalNumber |

    | 16 | 5872 |

    | 4 | Remainder the rightmost digit of the answer / Result so far: 4 |


    +   * 367 is not zero. Divide it by 16.


    | 22 Quotient | the new value for DecimalNumber |

    | 16 | 352 |

    | 15 | Remainder the second digit of the answer / Result so far: F4 |


    +   * 22 is not zero. Divide it by 16.


    | 1 Quotient | the new value for DecimalNumber |

    | 16 | 16 |

    | 6 | Remainder the next digit of the answer / Result so far: F64 |'
