    # 6.6 Chapter Summary


    This chapter has discussed protocols for implementing procedures in the 80x86
    architecture. There are three main concepts involved: (1) how to transfer control
    from a calling program to a procedure and back, (2) how to pass parameter values
    to a procedure and results back from the procedure, and (3) how to write procedure
    code that is independent of the calling program. The stack serves several important
    purposes in procedure implementation. When a procedure is called the address of
    the next instruction is stored on the stack before control transfers to the first
    instruction of the procedure. A return instruction retrieves this address from
    the stack in order to transfer control back to the correct point in the calling
    program. Argument values (or their addresses) can be pushed onto the stack to
    pass them to a procedure; when this is done, the base pointer EBP and based addressing
    provide a convenient mechanism for accessing the values in the procedure. The
    stack can be used to provide space for a procedure’s local variables. The stack
    is also used to “preserve the environment”—for example, register contents can
    be pushed onto the stack when a procedure begins and popped off'
