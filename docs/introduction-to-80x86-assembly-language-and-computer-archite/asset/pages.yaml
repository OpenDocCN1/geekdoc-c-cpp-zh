  md: "# 6.3 Additional 32-Bit Procedure Options\n\nVisual Studio C compiler uses\
    \ the cdecl protocol. The windows32 projects that you have been using for programs\
    \ with input and output already do. For example, the file framework.c contains\
    \ the code\n\n```\nint MainProc(void);\n  // prototype for user's main program\n\
    \nint WINAPI WinMain(HINSTANCE hInstance, HINSTANCE\nhPrevInstance,\nLPSTR 1LpcCmdLine,\
    \ int nCmdShow\n{\n  _hInstance = hInstance;\n  return MainProc();\n}\n```\n\n\
    Execution begins with WinMain that basically just calls your assembly language\
    \ procedure MainProc. However, recall, that the name of your procedure is not\
    \ MainProc, but _MainProc: The code generated by the C compiler follows the cdecl\
    \ text decoration convention of adding a leading underscore. In general, to call\
    \ an assembly language procedure from a Visual Studio C program, prototype the\
    \ function to describe it, name the assembly language procedure with the same\
    \ name prefixed with an underscore, and follow the cdecl protocols in the assembly\
    \ language code.\n\nA windows32 project also calls C functions in framework c\
    \ from expansions of the output and input macros. For example, the definition\
    \ for the output macro contains\n\n```\nlea eax,outStr      ; string address\n\
    push eax             ; string parameter on stack\nlea eax,outLbl      ; label\
    \ address\npush eax             ; string parameter on stack\ncall _showOutput\
    \    ; showOutput(outLbl, outStr)\nadd esp, 8           ; remove parameters\n\
    ```\n\nThis is clearly a call to procedure _showOutput, which is showOutput in\
    \ framework.c. The assembly language code must add the underscore to the name\
    \ because the assembler does not decorate the name, but the C compiler will. In\
    \ general, text decoration is only a concern when you are mixing high-level and\
    \ assembly language procedures, not when you are entirely writing in assembly\
    \ language where no text decoration is generated or in C where the compiler takes\
    \ care of text decoration automatically."
