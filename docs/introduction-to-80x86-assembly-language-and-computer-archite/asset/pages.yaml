    \     ; (-b + sqrt(b*b-4*a*c))/(2*a)\n\tmov     eax, [ebp+24]    ; address of\
    \ x2\n\tmov     REAL4 PTR [eax]    ; save and pop stack\n\nendGE:\n\tpop     eax\
