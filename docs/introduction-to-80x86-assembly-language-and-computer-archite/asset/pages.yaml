    # 8.1 Using String Instructions


    There are five 80x86 instructions designed for string manipulation: moves (move
    string), cmps (compare string), scas (scan string), stos (store string), and loads
    (load string). The moves instruction is used to copy a string from one memory
    location to another. The cmps instruction is designed to compare the contents
    of two strings. The scas instruction can be used to search a string for one particular
    value. The stos instruction can store a new value in some position of a string.
    Finally, the loads instruction copies a value out of some position of a string.


    A string in the 80x86 architecture refers to a contiguous collection of bytes,
    words, doubles, or quadwords in memory. Strings are commonly defined in program''s
    data segment using such directives as


    | response | BYTE | 20 DUP (?) |

    | label | BYTE | ''The results are '', 0 |

    | wordString | WORD | 50 DUP (?) |

    | arrayD | DWORD | 60 DUP (0) |

    | qString | QWORD | 40 DUP (?) |


    Note that strings and arrays are actually the same except for a source string,
    a destination string, or both.


    Each string instruction applies to a source string, a destination string, or both.
    The bytes, words, doubles, or quadwords of these strings are processed one at
    a time by the instruction. Register indirect addressing is used to locate the
    individual string elements. The 80x86 instructions access elements of the source
    string using the address in the source index register ESI. Elements in the destination
    string are accessed using the address in the destination index register EDI. In
    64-bit mode, RSI and RDI are used by default; however, the remainder of this chapter
    refers to ESI and EDI.


    Since the source and destination addresses of string elements are always given
    by ESI and EDI, respectively, no operands are needed to identify these locations.
    Without any operand, however, the assembler cannot tell the size of the string
    element to be used. For example, moves by itself could move to a byte, word, double,
    or'
