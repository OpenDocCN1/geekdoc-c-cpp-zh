  md: '# CHAPTER 6


    # Procedures


    The 80x86 architecture implementation of procedures that are similar to those
    in a high-level language. In fact, 80x86 procedures can be called from high-level
    language programs or can call high-level language procedures. There are three
    main concepts involved: (1) how to transfer control from a calling program to
    a procedure and back, (2) how to pass parameter values to a procedure and results
    back from the procedure, and (3) how to write procedure code that is independent
    of the calling program. In addition, a procedure must allocate local variable
    space. The hardware-stack is used to accomplish each of these jobs.


    +   6.1 The 80x86 Stack


    +   6.2 32-Bit Procedures with Value Parameters


    +   6.3 Additional 32-Bit Procedure Options


    +   6.4 64-Bit Procedures


    +   6.5 Macro Definition and Expansion


    This chapter begins with a discussion of the 80x86 stack. Sections 6.1 to 6.3
    cover operations in 32-bit mode only, while Section 6.4 describes differences
    for 64-bit mode. The final section discusses macros, sometimes used to substitute
    for procedure calls, and used by the io.h file in windows32 and windows64 projects
    to call procedures.


    +   6.6 Chapter Summary'
