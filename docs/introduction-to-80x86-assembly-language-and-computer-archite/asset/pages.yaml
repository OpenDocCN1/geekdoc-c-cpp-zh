    the uppercase letter S is $53_{16}$ ($01010011_{2}$) and the code for lowercase
    s is $73_{16}$ ($01110011_{2}$). The instruction


    ```

    xor cl, 01000000b ; change case of letter in CL

    ```


    "flips" the value of bit 5 in the CL register, changing the value to the ASCII
    code for the other letter. Similarly, if CL contains the ASCII code of a letter
    of unknown case, then `or cl,01000000b` will force it to be lowercase, and `or
    cl,11011111b` will force it to be uppercase.


    The 8086 instruction set includes test instructions that function the same as
    and except destination are not changed. This means that the only job of a `test`
    instruction is to set flags. (Remember that a `cmp` instruction is essentially
    a sub instruction that sets flags does not change the destination operand.) One
    application of a `test` instruction is to examine a particular bit of a byte or
    word. The following instructions test bit 13 of the EDX register.


    ```

    test edx,00002000h ; check bit 13

    ```


    Note that 00002000 in hex is the same as 0000 0000 0000 0000 0010 0000 0000 0000
    in binary, with bit 13 set. Often this `test` instruction would be followed by
    a `jz` or `jnz` instruction, and the effect would be to jump to the destination
    if bit 13 were 0 or 1, respectively.


    The `test` instruction can also be used to get information about a value in a
    register. For example,


    ```

    test ecx, ecx ; set flags for value in ECX

    ```


    "ands" the value in the ECX register with itself, resulting in the original value.
    ("Anding" any bit with itself gives the common value.) The flags are set according
    to the value in ECX. The instruction


    ```

    and ecx, ecx ; set flags for value in ECX

    ```


    will accomplish the same goal and is equally efficient. However, using `test`
    makes it clear that the only purpose of the instruction is testing.


    The various forms of the `test` instruction are listed in Figure 7.4. They are
    almost the same as `and`, and `or` instructions. Note that the figure does not
    show a source operand in memory. However, the assembler lets you code a register
    destination with a memory source and transposes the operands to have the memory
    operand first, one of the allowable formats.'
