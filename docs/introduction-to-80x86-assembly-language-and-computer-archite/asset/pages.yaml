  md: '# 36 Parts of a Computer System


    | Bit | Mnemonic | Usage |

    |---|---|--|

    | 0 | CF | carry flag |

    | 2 | PF | parity flag |

    | 6 | ZF | zero flag |

    | 7 | SF | sign flag |

    | 10 | DF | direction flag |

    | 11 | OF | overflow flag |


    Figure 2.2 Selected EFLAGS bits


    The final register is called the flags register. The name EFLAGS refers to this
    register, but this mnemonic is not used in instructions. Some of its 32 bits are
    used to set some characteristic of the 80x86 processor. Other bits, status flags,
    indicate the outcome of execution of an instruction. Some of the flag register''s
    32 bits are named, and the names we use most frequently are given in Figure 2.2.


    Bit 11 is the overflow flag (OF). It is set to 0 following an addition in which
    no overflow occurred and to 1 if overflow did occur. Similarly, the carry flag
    (CF), indi-cates the absence or presence of a carry out from the sign position
    after an addition. Bit 7, the sign flag, contains the left bit of the result after
    some operations. Since the left bit is 0 for a non-negative 2''s complement number
    and 1 for a negative number, SF indi-cates the sign. Bit 6, the zero flag (ZF)
    is set to 1 if the result of an operation is zero, and to 0 if the result is non-zero.
    Bit 2, the parity flag, is based only on the lower-order 8 bits of a result; it
    is set to 1 if an even number of these bits are 1s and to 0 if an odd number of
    these bits are 1s. Other flags will be described later when their uses are clearer.


    An example of how flags are set by instructions, consider again the


    ```

    add eax, 158

    ```


    This instruction affects CF, OF, PF, SF, and ZF. Suppose that EAX contains the
    word FF FF F3 prior to execution of the instruction. Since 158_{10} corresponds
    to the word 00 00 00 9E, this instruction adds FF FF F3 and 00 00 00 9E, putting
    the sum 00 00 91 in the EAX register. It sets the carry flag CF to 1 since there
    is a carry, the over-flow flag OF to 0 since there is no overflow, the sign flag
    SF to 0 (the leftmost bit of the sum 00 00 91), and the zero flag ZF to 0 since
    the sum is not zero. The parity flag PF is set to 0 since 1001 0001 contains 3
    bits, an odd number.'
