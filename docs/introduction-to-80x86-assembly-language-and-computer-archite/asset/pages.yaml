    Each ASCII code is translated to another ASCII code by this program. Upper-case
    letters are translated to lowercase, lowercase letters and digits are unchanged,
    and all other characters are translated to spaces. The difficult part of the program
    is building the translation table. Its construction involves looking at a table
    of ASCII codes (see Appendix A). For this program the translation table is defined
    by


    | table | BYTE | 48 DUP ('' ''), ''0123456789'', 7 DUP ('' '') |

    | | ''abcdefghijklmnopqrstuvwxyz'', 6 DUP ('' '') |

    | | ''abcdefghijklmnopqrstuvwxyz'', 133 DUP ('' '') |


    Careful counting will show that exactly 256 codes are defined. Recall that a BYTE
    directive stores the ASCII code of each character. Each of the first 48 bytes
    of the AL will contain the ASCII code for a space, $20_{16}$. Therefore, if the
    code in the AL registers any of the first 48 characters—a control character, or
    one of the printable characters from $20_{16}$ (space) to $2F_{16}$ (/)—will be
    translated to a space.


    Note that it is legal to translate a character to itself. Indeed, this is what
    will happen for digits; the ASCII $30_{16}$ to $39_{16}$ for digits 0 through
    9 appear at offsets $30_{16}$ to $39_{16}$. The codes for the seven characters
    : @ are next in an ASCII chart; each of these will be translated to a space. The
    next ASCII characters are the uppercase letters and the new entries in the table
    are codes for the lowercase letters. For example, the table contains $61_{16}$
    at offset $41_{16}$, so an uppercase (ASCII code $41_{16}$) will be translated
    to a lowercase (ASCII code $61_{16}$). The next six blanks are at the offsets
    $91_{16}$ (l) through $96_{16}$ (''), each of equal to a blank. The ASCII code
    for lowercase letter is assembled at an offset equal to its value, so each lowercase
    letter is translated to itself. Finally, the translation table contains 133 ASCII
    codes for blanks;'
