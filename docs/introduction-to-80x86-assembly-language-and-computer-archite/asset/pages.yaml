  md: '# 260 Bit Manipulation


    In addition to the shift instructions discussed in this book, there are "double-shift"
    instructions that use a register as a source of fill bits for a register or destination,
    instead of just using 0''s or 1''s to fill. These instructions have mnemonics
    shrd and shld, and syntax


    ```

    sh-d destination, source register, count

    ```


    We don''t need these instructions in this book. Rotate instructions are similar
    to shift instructions With shift instructions the bits that are shifted off one
    end are discarded while vacated space at the other end is filled by 0''s (or 1''s
    for a right arithmetic shift of a negative number). With rotate instructions the
    bits that are shifted off one end of the destination are used to fill the vacated
    space at the other end.


    Rotate instruction formats are the same as single-shift instruction formats. A
    single-bit rotate instruction has the format


    ```

    r-- destination, 1

    ```


    and there are two multiple-bit versions


    ```

    r-- destination, immediatenr-- destination, cl

    ```


    The instructions rol (rotate left) and ror (rotate right) can be used for byte,
    word, doubleword, or quadword operands in a register or memory. As each bit "falls"
    off one end, it is copied to the other end of the destination. In addition, the
    last bit copied to the other end is also copied to the carry flag CF. The overflow
    flag OF is the only flag affected by rotate instructions. It is undefined for
    multi-bit rotates, and familiarity with its definition for single-bit rotate instructions
    is not needed in this book. As an example, suppose that the DX register contains
    D25E and the instruction


    ```

    rol dx, 1

    ```


    is executed. In binary, the operation looks like


    ```

    1 1 0 0 0 0 1 0 0 1 0 1 1 1 1 0

    ```


    resulting in 1010 0100 1011 1101 or A4BD. The carry flag CF is set to 1 since
    a 1 bit rotated from the left end to the right.


    Opcodes and number of bytes for rotate instructions are identical to those for
    shift instructions. They were shown in Figure 7.6.'
