    \ the representation and subtract $2^{-j}$ from $x$; if not, put a 0 in the representation.\
    \ Expand this to a complete pseudocode algorithm.\n\n# 9.2 80x86 Floating Point\
    \ Architecture\n\nThe **floating point unit** (FPU) of an 80x86 microprocessor\
    \ is almost independent of the rest of the chip. It has its internal registers,\
    \ separate from the registers used by integer operations. It executes instructions\
    \ to perform floating point arithmetic operations, including commonplace operations\
    \ such as addition or multiplication, or more complicated operations such as evaluation\
    \ of some transcendental functions like sine or logarithm. Not only can it transfer\
    \ floating point operands to or from memory, it also transfer integer or binary\
    \ coded decimal (BCD) operands to or from the coprocessor, converting between\
    \ formats as part of the transfer.\n\nThe FPU has eight data registers, each 80\
    \ bits long. The extended double-precision floating point format is used for values\
    \ stored in these registers. The registers are organized as a stack—for example,\
    \ when the *FLD* (floating load) instruction is used to transfer a value from\
    \ memory to the floating point unit, the value is loaded into the register at\
    \ the top of the stack, and data stored in the stack top and other registers are\
    \ pushed down one register. However, some instructions can access registers below\
    \ the stack top, so that the organization is not a pure stack.\n\nThe names of\
    \ the eight floating point registers are\n\n+   * ST, the stack top, also called\
    \ ST(0);\n* ST(1), the register just below the stack top;\n* ST(2), the register\
    \ just below ST(1);"
