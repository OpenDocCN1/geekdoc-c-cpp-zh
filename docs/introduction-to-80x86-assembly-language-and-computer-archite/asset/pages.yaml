  md: '# 6.2 32-Bit Procedures with Value Parameters


    dure from the caller or from the procedure to the caller. Reference parameters
    are covered in the next section.


    Our example code in Figure 6.7 has two arguments (number1 and number2) in _MainProc
    that are passed by value parameters (x and y) in fctnl. We now look at how to
    pass parameter values to a procedure and results back from the procedure. The
    second part of this is simple—if the procedure returns a single doubleword value,
    then it puts that value in EAX by using the calling program. Notice that this
    is exactly what fctnl does in the program in Figure 6.7; after some preliminaries
    (explained next), it computes the value in EAX where it is available in _MainProc.
    With the cdecl protocol, only the EAX register may be used for this purpose.


    Doubleword parameters are passed to the procedure by pushing them on the stack.
    With the cdecl protocol, the parameters are pushed on the stack in the opposite
    order in which they appear in the parameter list—the last parameter value is pushed
    first and the first parameter value is pushed last. The code that calls fctnl
    in _MainProc is


    ```

    push number2 ; second parameter

    push number1 ; first parameter

    call fctnl ; fctnl(number1, number2)

    add esp, 8 ; remove parameters from stack

    ```


    The two statements obviously push the argument values on the stack prior to the
    procedure call. The purpose of the last statement is to remove the values from
    the stack returning from the procedure. If the stack is not cleaned up and a program
    repeat-edly calls a procedure, the stack will eventually fill up causing a run-time
    error with modern operating systems. Arguments could be removed using the alternative
    form of the ret statement which specifies an operand, but the cdecl protocol specifically
    leaves the stack cleanup task to the calling program. The arguments could be removed
    by popping the values off the stack, but it is more efficient to simply add the
    number of bytes of parameters to ESP, moving the stack pointer above the values.


    Now, we look at how a procedure retrieves parameter values from the stack. Upon
    entry to the procedure, the stack looks like the left illustration in Figure 6.10.
    The two arguments—now the parameter values—have been pushed on the stack by the
    calling program and the return address has been pushed on the stack by the call
    instruction. The first instructions executed by the procedure are


    ```

    push ebp ; save base pointer

    mov ebp, esp ; establish stack frame

    push ebx ; save EBX

    ```'
