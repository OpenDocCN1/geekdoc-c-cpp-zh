  md: 'Each of the logical instructions has a variety of uses. One application of
    the and is to clear selected bits in a destination. Note that if any bit value
    is "anded" with 1, the result is the original bit. On the other hand, if any bit
    value is "anded" with 0, the result is 0. Because of this, selected bits in a
    destination can be cleared by "anding" the destination with a bit pattern that
    has 1s in positions that are not to be changed and Os in positions that are be
    cleared.


    For example, to clear all but the 4 bits in the EAX register, the following instruction
    can be used.


    ```

    and    0000000fh ; clear high-order 28 bits of EAX

    ```


    ```

    If EAX originally contained 4C81D7B, this and operation yield 0000000B

    0100 1100 1000 0001 1101 0111 0111 4C81D7B

    0000 0000 0000 0000 0000 0000 1111 0000000F

    0000 0000 0000 0000 0000 0000 0011 0000000B

    ```


    Only one of the leading zeros is needed in 0000000fh, but coding the purpose of
    this operand. The trailing hex f corresponds to 1111 in binary, providing the
    1s that will leave the 4 bits in EAX unchanged.


    A value that is used with a logical instruction to alter bit values is often called
    a mask. The assembler accepts numeric values in decimal, hexadecimal, and binary,
    octal formats. Hex and binary are preferred for constants used as masks since
    the bit pattern is obvious for binary values or easy to figure out for hex values.


    As illustrated, the above, and instruction is useful when selected bits of an
    operand need to be set to 1 without changing other bits. The or instruction is
    useful when selected bits of an operand need if the value 1 is combined with either
    a 0 or 1 using the or operation, then the result is 1. However, if the value 0
    is used as one, then the result of an operation is the other operand.


    The exclusive or instruction will complement selected bits of a byte or word without
    changing other bits. This works since 0 xor 1 is 1 and 1 xor 0 is 0, that combining
    any bit using an xor operation results in the opposite of the bit value.


    A second use of logical instructions is to implement high-level language Boolean
    operations. One byte in memory could be used to store other bit values. If such
    a byte is flags, then the statement


    ```

    and flags, 11011101b ; flag5 := false; flag1 := false

    ```'
