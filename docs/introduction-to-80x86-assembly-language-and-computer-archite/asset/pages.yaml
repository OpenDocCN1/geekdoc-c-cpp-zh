    \  { loop body }\nend for;\n```\n\nand\n\n```\nindex := count downto 1 loop\n\
    \  { loop body }\nend for;\n```\n\nEach loop executes count times. If the value\
    \ of index is not needed within the body of the loop, then the loop that counts\
    \ down is equivalent to the loop that counts up, although the design may not be\
    \ as natural. Backward for loops are very easy to implement in 80x86 assembly\
    \ language with the loop instruction.\n\nThe loop instruction has the format\n\
    \n```\nloop statementLabel\n```\n\nwhere statementLabel is the label of a statement\
    \ that is a short displacement (128 bytes backward or 127 bytes forward) from\
    \ the loop instruction. The loop instruction takes two bytes of object code, opcode\
    \ E2 and the byte-size displacement\n\nThe loop instruction causes the following\
    \ actions to take place:\n\n+   * The value in ECX is decremented.\n* If the new\
    \ value in ECX is zero, then execution continues with the statement following\
    \ the loop instruction."
