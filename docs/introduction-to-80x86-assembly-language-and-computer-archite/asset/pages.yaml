  md: '# 8.2 Repeat Prefixes and More String Instructions


    80x86 string instruction operates on one string element at a time. However, the
    80x86 architecture includes three repeat prefixes that change the string instructions
    into versions that repeat automatically, either for a fixed number of iterations
    or until some condition is satisfied. The three repeat prefixes actually correspond
    to two different single-byte codes; these are not themselves instructions, but
    supplement machine codes for the primitive string instructions, making new instructions.


    Figure 8.4 shows two program fragments, each of which copies a fixed number of
    characters from sourceStr to destStr. The number of characters is loaded into
    the ECX register from count. The code in part (a) uses a loop instruction. Since
    the count of characters might be zero, the loop is guarded by a jzcz instruction.
    The body of the loop uses movsb to copy one character at a time. The loop instruction
    takes care of counting loop iterations. The program fragment in part (b) is functionally
    equivalent to the one in part (a). After the count is copied into ECX, it uses
    the repeat prefix rep with a movsb instruction, the rep movsb does the same thing
    as the last four lines in part (a).


    The rep prefix is normally used with mov instructions and with the stos instruction
    (discussed on page 283). It causes the following to be executed.


    | lea esi, sourceStr ; source string |

    | lea edi, destStr ; destination |

    | cld ; forward movement |

    | mov ecx, count ; count of characters to copy |

    | jecxz endCopy ; skip loop if count is zero |

    | copy: movsb ; move 1 character |

    | loop copy ; decrement count and continue |


    (a) movsb iterated in a loop


    | lea esi, sourceStr ; source string |

    | lea edi, destStr ; destination |

    | cld ; forward movement |

    | mov ecx, count ; count of characters to copy |

    | rep movsb ; move characters |


    (b) Repeat prefix with movsb


    ![](img/0a28ab4c74434132c88d9a96aa74f8e4_292_0.png)'
