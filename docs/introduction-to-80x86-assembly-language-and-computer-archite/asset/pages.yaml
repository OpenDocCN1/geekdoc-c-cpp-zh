  md: '# 9.5. Floating Point Assembly Language Procedures with C/C++ 353


    The in-line assembly language code is preceded by the __asm keyword (beginning
    with two underscores), and braces surround the assembly language statements. The
    assembly language statements reference C++ variables declared outside the braces.
    Almost any statements can appear in in-line assembly language, including integer
    instructions, floating point instructions, and statements with labels.


    # Programming Exercises 9.5


    Any of these exercises can be done in a 32-bit or a 64-bit environment.


    +   1. Write a complete program that will prompt for and input a decimal value
    for the radius of a circle, and calculate and display (properly labeled) the circumference
    and the area of the circle. Do the input and output with C or C++. Write two assembly
    language procedures, each with one floating point parameter giving the radius,
    and each returning the appropriate value. Call these procedures from your C/C++
    program to do the floating point calculations.


    +   2. The volume of a pyramid with a square base $b$ units on a side and a height
    $h$ is given by $\frac{1}{3}b^2h$. Write an assembly language procedure $pVolume$
    with two floating point parameters, the base and the height, and returning the
    volume of the pyramid. Call this procedure from a C or C++ driver that inputs
    values for the base and height and outputs the volume.


    ```

    void roots(float a, float b, float c, float* x1, float* x2, int* success)

    ```


    and would return -1 for true and 0 for false. A modified C++ header would look
    like


    ```

    void roots(float a, float b, float c, float* x1, float* x2, bool& success)

    ```


    and the assembly language procedure will treat success as the address of a byte-size
    integer and store 1 for true or 0 for false.'
