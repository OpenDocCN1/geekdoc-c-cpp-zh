  md: '# Representing Data in a Computer


    ber equivalent to –200₁₀ Neither the Windows calculator nor an 80x86 CPU determine
    which is intended; it is up to the user to select the correct interpretation for
    the context.


    Here is a way you can get the correct decimal interpretation for a negative 2''s
    complement number using the Windows calculator. Assume that the calculator is
    in Hex mode, Word length, with FF38 on the display. If you click the +/- key,
    the calculator performs a 2''s complement operation and displays C8. Now click
    Dec, and the calculator displays 200. If you click +/- then you see –200.


    The 2''s complement operation is equivalent to finding the negative of a number;
    that is, it is the negation operation. If you start with a positive number, you
    will get its negative counterpart. (Note: The +/- key triggers the 2''s complement
    operation with many handheld calculators in Hex, but not all.)


    The 2''s complement representation of a negative number can also be found without
    a calculator. One method is to first express the unsigned number 10000₁₆ to get
    the word-length representation. You subtract that number from is, in hex, a 1
    followed by the number of 0''s in the length of the representation, for example,
    100000000₁₆ to get the doubleword-length representation. (What would you use for
    a byte-length 2''s complement representation? For a quadword-length 2''s complement
    representation?) In binary, the number of zeros is the length in binary digits.
    This binary number is a power of 2, and subtraction is sometimes called ‘taking
    the complement,’ so this operation is the source of the term ‘2’s complement’.


    The Word-length 2''s complement representation of the decimal number –76 is found
    by first converting the unsigned number 76 to its hex equivalent 4C, by subtracting
    4C from 10000.


    ```

    1 0 0 0 0

    – 4 C

    ```


    Since you cannot subtract C from 0, you have to borrow 1 from 1000, leaving FFF.


    ```

    F F F 10

    – 4 C

    F F B 4

    ```'
