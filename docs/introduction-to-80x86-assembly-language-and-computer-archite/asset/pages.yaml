  md: 'When a sub instruction is executed, the integer at source is subtracted from
    the integer at destination and the difference replaces the old value at destination.
    For subtraction, it is important to remember that the difference calculated as
    destination - source or "operand 1 minus operand 2." With both add and sub instructions
    the source (second) operand is unchanged. Here are some examples showing how these
    instructions function at execution time.


    # Example


    | Before | Instruction Executed | After |

    | --- | --- | --- |

    | EAX: 00 00 00 75 | add eax, ecx | EAX 00 00 02 17 |

