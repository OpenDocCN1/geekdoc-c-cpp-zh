  md: 'We have noted previously that registers are a scarce resource when programming.
    One use of push and pop instructions is to temporarily save the contents of a
    register on the stack. Suppose, for example, that you are using EDX to store some
    program variable, but need to do a division that requires you to extend a dividend
    in EDX:EAX prior to the operation. One way to avoid losing the value in EDX is
    to push it on the stack.


    ```

    push edx      ; save variable

    cdq            ; extend dividend to quadword

    div divisor    ; divide

    pop             ; restore variable

    ```


    This example assumes that you don''t need the remainder division operation puts
    in EDX. If you do need the remainder, it could be copied somewhere else before
    the saved value back to EDX.


    As the above example shows, push and pop instructions are often used in pairs.
    When we examine how the stack is used to pass parameters to procedures, you will
    see a way to logically discard values from the stack without popping them to a
    destination location.


    In a 32-bit environment the stack is created on a doubleword boundary, that is,
    the address in ESP is a multiple of 4. It is important to keep the stack top on
    a doubleword boundary for certain system calls. Therefore, with few exceptions,
    you should always push doubleword values on the stack, even though the 80x86 architecture
    allows words to be used.


    In addition to the ordinary push and pop instructions, there are special mnemonics
    there are pushf (pushfd for the extended flag register) and popf (popfd for the
    extended flag register). These are summarized in Figure 6.6. They are sometimes
    used in procedure code. Obviously, popf and popfd instructions change flag values;
    these are the only push or pop instructions that change flags.


    | Instruction | Opcode | Bytes of Object Code |

    |---|---|-|

    | pushf/pushfd | 9C | 1 |

    | popf/popfd | 9D | 1 |


    Figure 6.6 pushf and popf instructions'
