    in Figure 4.22.

    The **cbw** (convert to word) instruction extends the 2''s complement number in
    the AL register half to word length in AX. The **cwd** (convert word to double)
    instruction extends the word in AX to doubleword in DX and AX. The **cdq** (convert
    double to quadword) instruction extends the doubleword in EAX to a quadword in
    EDX and EAX. The **cqo** instruction extends the quadword in EAX to a double quadword
    in RDX and RAX Each instruction copies the sign bit of the original number to
    each bit of the high-order half of the result. None of these instructions affect
    flags. Some examples are:


