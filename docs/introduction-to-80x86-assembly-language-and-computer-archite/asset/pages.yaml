  md: '# 9.3 Converting Floating Point and to ASCII 339


    Now we combine code already written into a complete windows32 program that prompts
    for the coefficients of a quadratic equation, solves the equation, and displays
    the roots. Getting each coefficient is a two-part process, first using the input
    macro to get the coefficient as a string of ASCII characters, then using atofproc
    to interpret this string as a floating point number. Display of the roots is similar—ftaproc
    gives the ASCII string corresponding to a root and the output macro displays the
    string.


    Figure 9.21 lists the program. The atofproc and atofproc procedures have been
    put in separate files. The heart of the main program is as the quadratic solver
    in Figure 9.13, with input code and output code after. The inset shows the output
    window from a sample run solving the equation 2x² - x - 15 = 0.


