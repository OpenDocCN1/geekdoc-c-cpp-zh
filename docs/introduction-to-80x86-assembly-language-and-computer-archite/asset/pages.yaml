    jne     EndIfSpecialD    ; if not, normal case

    mov     BYTE PTR [edi],''-''  ; manually put in ASCII codes

    mov     BYTE PTR [edi+1],''2''  ; for -2,147,483,648

    mov     BYTE PTR [edi+2],''1''

    mov     BYTE PTR [edi+3],''4''

    mov     BYTE PTR [edi+4],''7''

