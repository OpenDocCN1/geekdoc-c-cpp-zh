  md: '# 58 Elements of Assembly Language


    A BYTE directive reserves storage for one or more bytes of data. If data is numeric,
    it can be thought of as signed or unsigned. The decimal range of unsigned values
    that can be stored in a single byte is 0 to 255. The decimal range of signed values
    that can be stored in a single byte is -128 to 127. The assembler will generate
    an error message for a BYTE directive with a numeric operand outside the range
    -128 to 255. Here are several examples. The comments in the examples indicate
    the initial values of the bytes that are reserved.


    ```

    byte1  BYTE  255      ; value is FF

    byte2  BYTE  127      ; value is 7F

    byte3  BYTE  91       ; value is 5B

    byte4  BYTE  0        ; value is 00

    byte5  BYTE  -1       ; value is FF

    byte6  BYTE  -91      ; value is A5

    byte7  BYTE  -128      ; value is 80

    ```


    The situation for WORD, DWORD, and QWORD directives is similar. Each operand of
    a WORD directive is stored in a doubleword, DWORD, or QWORD in a quadword. Double
    are usually the best choice for integers. Since 4 bytes can store a signed number
    in the range -2,147,483,648 to 2,147,483,647 or an unsigned number from 0 to 4,294,967,295,
    you must restrict operand values to the range -2,147,483,648 to 4,294,967,295.
    Similarly, each operand for a WORD directive should be restricted to the few words
    from -32,768 to 65,535. The following examples give the initial values reserved
    for a few words. Quadwords are used in a 64-bit environment, but the assembler
    recognizes the QWORD directive in a 32-bit environment.


    ```

    double1 DWORD  4294967295 ; value is FFFFFFFF

    double2 DWORD  4294966296 ; value is FFFFFFFC

    double3 DWORD  0        ; value is 00000000

    double4 DWORD  -1       ; value is FFFFFFFF

    double5 DWORD  -1000     ; value is FFFFFFC

    double6 DWORD  -2147483648 ; value is 80000000

    ```


    ```

    word1  WORD  65535    ; value is FFFF

    word2  WORD  32767    ; value is 7FFF

    word3  WORD  1000     ; value is 03E8

    word4  WORD  0        ; value is 0000

    ```'
