    # 9.5. Floating Point Assembly Language Procedures with C/C++


    Sometimes the power of assembly language makes it possible or easier or efficient
    to code parts of a program in assembly language than in a high-level language.
    These parts may need critical optimization, or may implement low-level algorithms
    that would be difficult or impossible to code in the high-level language. However,
    the bulk of programming is better done in a high-level language. Section 6.3 showed
    some examples of calling an assembly language procedure from a C function, and
    a C function from an assembly language procedure. This section extends the information
    in Section 6.3 to floating point examples.


    First, we take the quadratic equation-solving program and make it into a procedure
    *roots*. The listing of this procedure is in Figure 9.25. The C-style function
    header describes its five parameters, the first being the single-precision floating
    point coefficients $a, b,$ and $c$ of the quadratic equation $ax^2+bx+c=0$, and
    the fourth and fifth being the addresses to the floating point roots. The procedure
    name is decorated with a leading underscore since it will be called from a 32-bit
    C program. The code that finds the roots is exactly what we have seen before in
    this chapter.'
