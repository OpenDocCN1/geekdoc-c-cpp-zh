  md: '# 4.1 Copying Data


    Most computer programs copy data from one location to another. With a high-level
    language, this is the job of a simple assignment statement. With 80x86 machine
    language, copying is done by mov (''move'') instructions. Each mov instruction
    has the form


    ```

    mov destination, source

    ```


    and copies a single byte, word, doubleword, or (in 64-bit mode) quadword value
    from the source operand location to the destination operand location. The value
    stored at the source location is not changed. The destination location is the
    same size as the source. No mov instruction changes any 80x86 flag.


    The C++ or Java assignment statement


    ```

    count = number;

    ```


    might correspond directly to the assembly language instruction


    ```

    mov count, ecx ; count := number

    ```


    assuming the ECX register contains the value of number and that count references
    a doubleword in memory. The analogy between high-level language assignment statements
    and mov instructions cannot be carried too far. For the example, the destination
    location


    ```

    count = 3*number + 1;

    ```


    cannot be coded with a single mov instruction. Several instructions are required
    to evaluate the right-hand expression and the resulting value in the destination
    location.


    One limitation of the 80x86 architecture is that not all "logical" combinations
    of source and destination operands are allowed. In particular, you cannot have
    both source and destination in memory. The instruction


    ```

    mov count, number ; illegal for two memory operands

    ```


    is not allowed if both count and number reference memory locations. In fact, no
    80x86 instruction executes two memory operands.


    All 80x86 mov instructions are coded with the same mnemonic. The assembler selects
    the correct opcode and other bytes of the object code by looking at the operands
    as well as the mnemonic.


    As discussed in Chapter 2, instructions sometimes affect various flag bits in
    the flags register. In general, an instruction may have one of three effects:


    +   - no flags are altered

    - specific flags are given values depending on the results of the instruction

    - some flags may be altered, but their settings cannot be predicted'
