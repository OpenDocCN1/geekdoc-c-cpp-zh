  md: '# 3.4 Instruction Operands 65


    | Memory Mode | Location of Data |

    |---|---|

    | direct | at a memory location whose address is built into the instruction |

    | register indirect | at a memory location whose address is in a register |


    Figure 3.8 Two 80x86 memory addressing modes


    has its 32-bit address built into the instruction. Generally the programmer will
    code a name that appears on a directive that reserves space in the data segment,
    and the assembler will translate this into the address.

    Here is the third code segment line from the Figure 3.6 file:


    ```

    00000000 A3 00000004 R  mov sum, eax ; sum to memory

    ```


    In this instruction, the second operand EAX is obviously register mode. The operand
    sum references memory. In assembly language for a 32-bit environment any memory
    reference coded as a name will be direct. Here we can see exactly how the instruction
    is assembled. It starts with opcode A3, which says to copy a doubleword from EAX
    to the memory location specified in the instruction. The next 4 bytes 00000004
    give the assembly time location of destination. (Recall that sum appears in the
    data segment at assembly time 00000004) The value of sum is not stored at address
    00000004 at execution time. The R following the address in the assembly listing
    says that this address is relocatable—it will be adjusted to the run-time address
    by the linker and loader.


    Our example program has no instruction with a register indirect memory operand.
    Here is what one looks like. The comment gives the object code you would see in
    a listing file.


    ```

    add eax, [edx] ; 03 02

