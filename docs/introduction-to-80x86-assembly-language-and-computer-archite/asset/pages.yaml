  md: '# 6.2 32-Bit Procedures with Value Parameters


    This is known as entry code. The first two instructions will always be the pair
    shown. They preserve EBP so that it can be restored before returning, and EBP
    to point at a fixed place in the stack that can be used to locate parameters.
    The third instruction is needed in this procedure so EBX can be used for computations
    within the procedure and then restored before return; this makes its use in the
    procedure transparent to the calling program. After these three instructions are
    executed, the stack looks like the right illustration in Figure 6.10.


    There are 8 bytes stored between the address stored in EBP and the first parameter
    (x) value. Parameter 1 can be referenced using base addressing by [ebp+8]. The
    second operand (y) value is 4 bytes higher on the stack; it is [ebp+12]. The code


    ```

    mov      eax, [ebp+8]   ; x

    imul     eax, 3        ; 3*x

    mov      ebx, [ebp+12]  ; y

    imul     ebx, 7        ; 7*y

    add      eax, ebx      ; 3*x + 7*y

    ```


    copies the value of the first parameter from the stack into EAX and the value
    of the second parameter from the stack into EBX in order to compare the desired
    result.


    You may wonder why EBP is used at all. Why not use ESP as a base register? The
    principal reason is that ESP is likely to change, but the instruction mov ebp,esp
    loads EBP with a fixed reference point in the stack. This fixed reference point
    will not change as other instructions in the procedure are executed, even if the
    stack is used for other purposes, for example, to push additional registers or
    to call other procedures.


    We now come to the third major concept, how to write procedure code that is independent
    of and preserves the environment for the calling program. You have already seen
    most of the code for this. Basically, the entry code pushes each register that
    will be used by the procedure, and the exit code pops them in the opposite order.
    Obviously, you must not save and restore EAX when a value is returned in EAX.
    The exit code for our example consists of


    ```

    pop      ebx      ; restore EBX

    pop      ebp      ; restore EBP

    ret              ; return

    ```


    EBP is always restored since it is always saved first. This example only used
    EBX for computations, but it is not unusual to save and restore several registers.
    Figure 6.11 summarizes the cdecl protocol.'
