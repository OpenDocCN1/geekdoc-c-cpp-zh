    The stack is now full. No further value can be pushed onto the stack unless some
    value is popped from the stack, or the stack is cleared. The instruction finish
    initializes the floating point unit and clears the contents of all eight registers.
    Often a program that uses the floating point unit will include the statement


    ```

    finish ; initialize the FPU

    ```


    near the beginning of the code. It may be desirable to reinitialize the floating
    point unit at points in the code, but normally this is not required since values
    will be popped from the floating point stack, not allowed to accumulate on the
    stack.


    The debugger lets you trace floating point operations. Floating point register
    contents are shown by right-clicking in the Registers windows and selecting Floating
    Point. Figure 9.3 shows a screen dump following execution of the code shown in
    the fig9-3.asm window. Notice that floating point register contents are shown
    as decimal numbers in an E-format, rather than in hex representing the actual
    bits.'
