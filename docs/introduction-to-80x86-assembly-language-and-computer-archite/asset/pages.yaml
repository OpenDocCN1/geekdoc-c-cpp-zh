    The 80x86 has and, or xor and not instructions that implement the logical operations.
    The formats of these instructions are


    +   - and destination, source

    - or destination, source

    - xor destination, source

    - not destination


    The first three instructions act on bytes, words, doublewords, or quadwords performing
    the logical operations on the bits in corresponding positions from the two operands.
    For example, when the instruction and ebx,ecx is executed, bit 0 from the EBX
    register is "anded" with bit 0 from the ECX register, bit 1 from EBX is "anded"
    with bit 1 from ECX, and so forth to 31 from EBX and 31 from ECX. The results
    of these 32 and operations are put in the corresponding positions in the destination
    EBX.


    The not instruction has only a single operand. It changes 0 bit in operand to
    1 and each 1 to 0. For example, if the AL register contains 10110110 and the instruction
    not al is executed, the result in AL will be 01001001. This is sometimes called
    "taking the 1''s complement" of operand.


    The not instruction does not affect any flag. However, each of the three Boolean
    instructions affects CF, OF, PF, SF, and ZF. The carry flag CF and overflow flag
    OF are both reset to 0. The sign flag SF and the zero flag ZF are set or reset
    according to the value of the operation. For instance, if the result is a pattern
    of all 0 bits, then ZF will be set to 1; if any bit of the result is not 0, then
    ZF will be reset to 0. The parity flag, which we have not used, is set or reset
    corresponding to the parity of just the low-order byte of result.


    The and, and xor instructions accept all the same types of operands and require
    the same number of bytes of object code. They are summarized in Figure 7.2. Information
    about the not instruction is given in Figure 7.3.


