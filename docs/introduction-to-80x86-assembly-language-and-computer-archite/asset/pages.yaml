    at the end of this block of statements is necessary so that the CPU skips the
    statements that correspond to the other cases. If the first conditional jump transfers
    control to elseZero, then the balance must be nonnegative (zero or positive).
    The design checks to see whether the balance is zero; the instruction


    elseZero: jnz elsePos


    jumps to elsePos if the zero flag ZF=0. The last instruction that sets flags is
    the add at the beginning, so the jump occurs if the balance was not zero. The
    code for the (balance=0) case follows this conditional jump and must again end
    with an unconditional jump to endBalanceCheck. Finally, the code that corresponds
    to else in the design is elsePos. Just as in a high-level language, a third check
    is not needed because the only remaining possibility is that balance is positive.
    This last block of code does not need a jump to endBalanceCheck since execution
    will fall through to this point.


    The 8086 above directly corresponds the order of statements in the design. When
    you code in assembly language, you should initially follow a careful design, and
    then, there is a need to make the code really efficient, examine it to see whether
    there are places where you can improve it. This corresponds to what happens in
    many high-level language compilers produce machine language that corresponds to
    the order of the high-level language statements being translated. Some compilers
    may optimize the code, rearranging some statements for efficiency.


    In the previous code, the label BalanceCheck is on a line by itself. Technically
    this label references the address of whatever statement follows it, but it is
    far simpler to treat it as the part of the current design structure without worrying
    about what comes next. It comes when this structure is changed, the code for this
    structure can remain the same. If the next statement requires another label, that
    is perfectly OK—multiple labels can reference the same instruction in memory.
    Labels are not part of object code, so extra labels do not add to the length of
    object code or execution time.


    When writing to mirror a design, you may want to use labels like if, then, else,
    and endif. Unfortunately, IF, ELSE, and ENDIF are assembler directives so that
    they cannot be used as labels. In addition, IF1, IF2, and several other desirable
    labels are reserved for use as directives. One solution like elseZero in the above
    example. No reserved word contains an underscore, another solution is to use labels
    like if_1 and endif_2 that parallel keywords in the original design.


    The terms set a flag and reset flag are used to mean "give the value 1 to a flag
    and "give the 0 to a flag, respectively. (Sometimes the word clear is used instead
    of reset.) As you have seen, there are many instructions that set or reset flags.
    However, a cmp (compare) instruction)''s only job is to set or reset flags, and
    is probable the most common way to establish flag values.'
