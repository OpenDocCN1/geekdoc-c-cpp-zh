  md: '# Unconditional Jumps


    | Type | Opcode | Bytes of Object Code |

    |---|---|--|

    | relative near | E9 | 5 |

    | relative short | EB | 2 |

    | register indirect | FF | 2 |

    | memory indirect | FF | 2+ |


    Figure 5.4 jmp instructions


    included are far jumps that change the code segment register as well as the instruction
    pointer, these are not used with flat memory model programming.


    The object code for each relative jump instruction contains the displacement of
    the target instruction from the jmp itself. This displacement is added to the
    address of the next instruction to find the address of the target. The displacement
    is a signed number, for a forward reference and negative for a backward reference.
    For the short version of the instruction, only a single displacement byte is stored;
    this is sign-extended before addition. The relative near format includes a 32-bit
    displacement. This is simply added to EIP in 32-bit mode, but is sign-extended
    before being added to RIP in 64-bit mode.


    The 8-bit displacement in a relative short jump can serve for a target statement
    up to 128 bytes or 127 bytes before following the object code of the jmp instruction.
    This displacement is measured from the byte itself at the time an instruction
    is being executed, the instruction pointer locally contains the address of the
    next instruction. The 32-bit displacement in a relative near instruction can serve
    for a target statement up to 2,147,483,648 bytes or 2,147,483,647 bytes after
    the jmp instruction.


    There is no difference in the code for a relative short jump and for a relative
    jump. In order to generate more compact code the assembler uses a short jump if
    the target is within the smaller range. A near jump is automatically used if the
    target is more than 128 bytes away.


    The indirect jumps use an address for the target rather than a displacement. However,
    this address is not encoded in the instruction itself. It is either in a register
    or in memory. Thus the format


    ```

    jmp  edx

    ```'
