    You may wonder how an 80x86 CPU can add integers larger than word size. Earlier
    CPUs had instructions to add byte-size integers; how did they handle 16- or 32-bit
    numbers? The answer is in addition to regular addition instructions, CPUs have
    add with carry instructions. These work like regular addition instructions except
