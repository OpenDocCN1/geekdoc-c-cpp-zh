  md: '# 6.2 32-Bit Procedures with Value Parameters


    tion to be executed the one at address that was pushed on the stack by the call.
    There is always at least one ret instruction in a procedure and can be more than
    one. If there is only one ret, it is ordinarily the last instruction in the procedure
    since subsequent instructions would be unreachable without "spaghetti code." Although
    a call instruction must identify its destination, the ret does not—control transfer
    to the instruction following the most recent call. The address of that instruction
    is stored on the 8086 stack


    The syntax of the 8086 call statement is


    ```

    call destination

    ```


    6.8 lists some of the 8086 call instructions. No call instruction modifies any
    flag. All of the procedure calls used in this book will be the first type, near
    relative. For a near relative call, the 5 bytes of the instruction consist of
    the E8 opcode plus the displacement from the next instruction to the first instruction
    of the procedure. The transfer of control when a procedure is called is similar
    to the transfer of a relative jump, except that the contents of EIP are pushed


    Near direct calls encode a 32 or a reference to a doubleword in memory. When the
    call is executed, the contents of that register or doubleword are used as the
    address of the procedure. This makes it possible for a call instruction to go
    to different procedures times


    All far calls provide both new CS contents and new EIP contents. With far direct
    calls, both of these are coded in the instruction, and these 6 bytes plus the
    1 for the opcode seen 7 in Figure 6.8. With indirect calls, these are located
    at a 6-byte memory, and the address of that block is coded in the instruction.
    The extra byte is a ModR/M byte. Far calls were very important when the segmented
    memory model was used.


    | Operand | Opcode | Bytes of Object Code |

    | --- | --- | --- |

    | near relative | E8 | 5 |

    | near indirect using register | FF | 2 |

    | near indirect using memory | FF | 2+ |

    | far direct | 9A | 7 |

    | far indirect | FF | 6+ |


    Figure 6.8 call instructions'
