  md: '# 3.5 A Complete 32-Bit Example Using Windows Input/Output


    The third statement requires little explanation. This mov instruction copies the
    doubleword in EAX to a doubleword in memory at number1.


    Obviously, statements 4 through 6 of _MainProc repeat the task for the second
    number. One thing to notice is that although the final result is copied to a separate
    doubleword, the 40-bit input area is reused–we need each ASCII representation
    only long enough to convert it to a 2''s complement doubleword.


    The two instructions


    ```

    mov     eax, number1      ; first number to EAX

    add     eax, number2      ; add second number

    ```


    just add the doublewords. This is similar to the addition done in the first example
    program, the difference being that the second number added is stored in memory
    instead of an immediate operand built into the instruction. You might notice that
    the second number is already in EAX following the atod macro, so we could simply
    added the first number. This code implements the design element “add the two numbers”
    in the way that is done most often, even though this isn’t the most efficient
    implementation for this particular situation.


    The sum in EAX is in 2''s complement form. It must be converted to an ASCII representation
    for display purposes. The job of the macro is


    ```

    dtoa     sum, eax       ; convert to ASCII characters

    ```


    The "double to ASCII" macro has two operands, specifying a destination string
    and a doubleword source, respectively. The destination string must be exactly
    11 bytes long because the procedure called by the dtoa macro always stores exactly
    11 ASCII bytes at the destination. The destination will often be terminated with
    a null byte in the data segment, have the dtoa macro does not generate a trailing
    null byte.


    The statement


    ```

    output   resultLbl, sum   ; output label and sum

    ```


    is a macro that expands to statements calling a procedure to display a Windows
    message box. The string specified by the first operand is used as a label, and
