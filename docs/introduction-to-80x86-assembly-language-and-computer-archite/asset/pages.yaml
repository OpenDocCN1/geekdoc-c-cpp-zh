  md: 'output results. This section presents a simple example that does I/O macros
    devel-oped for this book. They are described more completely in Section 3.6.


    In addition to adding I/O, this new example serves to emphasize the fact that
    data is represented in multiple forms—we use ASCII characters for input and output
    and 2''s complement doubleword integers for computation. Obviously something is
    necessary to do the conversions from one format to another. We use macros developed
    for this book to do these tasks, too. These macros are introduced here, described
    more fully in Section 3.6, and have their internal workings explained in later
    chapters.


    Here is a design for the program:


    +   prompt for the first number;

    input ASCII characters representing the first number;

    convert the characters to a 2''s complement doubleword;

    store the first number in memory;

    prompt for the second number;

    input ASCII characters representing the second number;

    convert characters to a 2''s complement doubleword;

    store the second number in memory;

    add the two numbers;

    convert the sum to a string of ASCII characters;

    display a label and the characters representing the sum;


    This design is implemented by the complete program shown in Figure 3.10. The parts
    are explained below. This program is already built into the windows32 Visual Studio
    project included with the software for this book.


