  md: '# 4.4 Division Instructions


    For unsigned div operations the dividend, divisor, quotient, and remainder are
    all treated as nonnegative numbers. For signed idiv operations, the sign of the
    quotient is determined by the signs of the dividend and divisor using the ordinary
    rules of signs; the sign of the remainder is always the same as the sign of the
    dividend.


    Division instructions do not set meaningful values. They may change previously
    set values of AF, CF, OF, PF, SF, or ZF flags. Some examples show how the division
    instructions work.


    # Example


    | Before | Instruction Executed | After |

    |---|---|--|

    | EDX: 00 00 00 00 | div ebx ; 100/13 | EDX 00 00 00 09 |

    | EAX: 00 00 00 64 | | EAX 00 00 00 07 |

    | AX: 00 64 | div divisor ; 100/13 | AX 00 07 |


    In both of these examples, the decimal number 100 is divided by 13. Since


    100 = 7 * 13 + 9


    the quotient is 7 and the remainder is 9. For the doubleword-length divisor, the
    quotient is in EAX and the remainder is in EDX. For the byte-length divisor, the
    quotient is in AL and the remainder is in AH.


    For operations where the dividend or divisor is negative, equations analogous
    to the one above are


    ```

    100 = (-7) - (-13) + 9          (100/-13, quotient -7, remainder 9)

    -100 = (-7) * 13 + (-9)      (-100/13, quotient -7, remainder -9)

    -100 = 7 * (-13) + (-9)      (-100/-13, quotient 7, remainder -9)

    ```


    Note that in each case the sign of the remainder is the same as the sign of the
    dividend. The following examples reflect these equations for doubleword-size divisors
    of 13 or -13. In the second and third examples, the dividend -100 is represented
    as the 64-bit number FF FF FF FF FF FF 9C in EDX.EAX.'
