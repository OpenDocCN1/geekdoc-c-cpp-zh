    The octal (base 8) number system is used with some computer systems. Octal numbers
    are written using digits 0 through 7. Most calculators that do arithmetic also
    handle octal values. The Oct radio button on the Windows calculator is used to
    display results in octal. It is easy to convert a binary number to octal by writing
    the octal equivalent for each group of three bits, or to convert from octal to
    binary by replacing each octal digit by three bits. To convert from decimal to
    octal, one can use an algorithm that is the same as the decimal to hex scheme
    except that you divide by 8 instead of 16 each step.


