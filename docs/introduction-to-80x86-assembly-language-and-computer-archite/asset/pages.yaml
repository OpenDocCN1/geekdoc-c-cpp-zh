    Figure 5.3 Program after six loop body iterations


    The jmp in the program in Figure 5.1 transfers control to a point that precedes
    the jmp statement itself. This is called a **backward reference**. The code


    ```

    jmp         quit                ; exit from program


    quit:       mov     ax, 0      ; exit with return code 0

    ```


    illustrates a **forward reference**

    There are several jmp instructions. All work by changing the value in the instruction
    pointer EIP (RIP rather in 64-bit mode) so that the next instruction to be executed
    comes from a new address rather than the address immediately following the current
    instruction. The most common jump instructions are **relative** jumps that change
    the instruction pointer by adding a positive or negative displacement for a forward
    or backward reference, respectively. There are also **indirect** jumps that get
    the new value for the instruction pointer from a register or from memory. We will
    not use indirect jumps in this book, but they are included in Figure 5.4 and discussed
    briefly. Not'
