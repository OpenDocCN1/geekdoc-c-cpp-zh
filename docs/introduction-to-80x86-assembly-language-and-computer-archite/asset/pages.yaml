  md: "# 9.5. Floating Point Assembly Language Procedures with C/C++ 351\n\n![](img/0a28ab4c74434132c88d9a96aa74f8e4_366_0.png)\n\
    \nFigure 9.29 Sample run of C++/assembly program\n\nFor example, if there are\
    \ three parameters, an integer and two floats, in this order, then the integer\
    \ will be passed in RCX, the first float in XMM1, and the second float in XMM2.\
    \ If, on the other hand, the three parameters were a float, an integer, and a\
    \ float, in this order, then the first float will be passed in XMM0, the integer\
    \ in RDX, and the second float in XMM2. Parameters beyond four are passed on the\
    \ stack\n\nFigure 9.30 shows roots implemented as a value-returning procedure\
    \ in a console64 program. Note how the parameters are passed: floating point coefficients\
    \ a XMM0, b in XMM1, and c in XMM2, but the address of x1 in R9 since an address\
    \ is the fifth parameter, the address of x2, is passed on the stack. This procedure\
    \ works with either the C driver shown in Figure 9.26 or the C++ driver shown\
    \ in Figure 9.28—neither requires any change in the source code, although the\
    \ 32-bit and 64-bit C and C++ compilers generate very different code.\n\nSome\
    \ high-level language compilers have the ability to translate a program that includes-inline\
    \ assembly code. This permits most of a program to be written in the high-level\
    \ language, with a few parts written in assembly language. With Visual Studio\
    \ 2008, the 32-bit C++ compiler allows inline assembly, but the 64-bit C++ compiler\
    \ does not. With the 32-bit C++ compiler, the embedded assembly language code\
    \ looks like\n\n```\nasm\n{\n    ; assembly language statements\n    ; that can\
    \ use variables in the C++ program\n}\n```"
