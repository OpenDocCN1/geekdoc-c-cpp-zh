    # 6.2 32-Bit Procedures with Value Parameters


    The word procedure is used in high-level languages to describe a subroutine that
    is almost a self-contained unit. The main program or another subprogram can call
    a procedure by including a statement that consists of the procedure name followed
    by parenthesized list of arguments to be associated with the procedure''s formal
    parameters.


    Many high-level languages distinguish between a procedure that performs an action
    and a function that returns a value. A function is similar to a procedure except
    that it is called by using its name and argument list in an expression. It returns
    a value associated with its name; this value is used in the expression. All subprograms
    in C/C++ are technically functions in this sense, but these languages allow for
    no return.


    In assembly language and in some high-level languages the term procedure is used
    to describe both types of subprograms that return values and those that do not.
    The word procedure is used in both senses in this book.


    Procedures are valuable in assembly language for the same reasons as in high-level
    languages—they divide programs into manageable tasks and they isolate code that
    can be used multiple times within a single program, or can be saved and reused
    in other programs. Sometimes assembly language can be used to write more efficient
    code than is produced by a high-level language compiler and this code can be put
    in a procedure called by a high-level program that does not need to be efficient.


    Recall the major concepts listed in the introduction to this chapter: (1) how
    to transfer control from a calling program to a procedure and back, (2) how to
    pass parameter values to a procedure and results back from the procedure, and
    (3) how to write procedure code that is independent of the calling program. These
    can be handled in many ways in assembly language, and this section describes one
    particular protocol cdecl in Microsoft documentation. It is the default convention
    used in C programs in the Visual Studio environment. 6.7 gives a complete windows32
    program that is used to illustrate aspects of this protocol.'
  merge: -1
