  md: '# 12 Representing Data in a Computer


    Chapter 2 discusses computer hardware, but for now you need to know that memory
    is divided into bytes, each byte containing 8 bits¹. Suppose you want to use ASCII
    codes to represent a number in memory. A single ASCII code is normally stored
    in a byte. Recall that ASCII codes are 7 bits long; the extra (left-hand, or high-order)
    bit is set to 0. To solve the second representation mentioned earlier, you can
    simply include the code for a minus sign. For example, the ASCII codes for the
    four characters -17 are 2D, 38, 31, and 37. To solve the first problem, you could
    always agree to use a fixed number of bytes, perhaps padding on the left with
    ASCII codes for zeros or spaces. Alternatively, you could use a variable number
    of bytes, but agree that the number ends with the last ASCII code for a digit;
    that, terminating with a nondigit. (A null byte 0 is often used for this purpose.)


    Suppose you want to use internal representations for numbers corresponding to
    their binary values. Then you must choose a fixed number of bytes for the representation.
    Most central processing units can do arithmetic on binary numbers having a few
    specific lengths. For the Intel 86 family, these lengths are 8 bits, a byte; 16
    bits, a word²; 32 bits, a double, 64 bits, a quadword.


    As an example, look at the word-length binary representation of 697.


    ```

    697₁₀ = 1010111001₂ = 0000010101011001₂

    ```


    Leading zeros have been added to make 16 bits. Writing this in hex a word, you
    have


    | 02 | B9 |


    This illustrates a convention that is followed in many places in this book. Strips
    of boxes will represent sequences of bytes. The contents of a single byte will
    be represented in hex, with two hex digits in each byte, because a single hex
    digit corresponds to 4 bits. The doubleword representation of 697 simply has more
    leading zeros.


    | 00 | 00 | 02 | B9 |


    +   - Some early computer systems used byte sizes different than 8 bits.

    - Some other computer architectures use a word size different than 16 bits.'
