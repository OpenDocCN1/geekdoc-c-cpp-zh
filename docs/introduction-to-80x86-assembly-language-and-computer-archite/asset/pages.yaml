    generates enough space for 15 quadwords. The bottom part of the reserved space
    is reserved for arguments. If there is a fifth argument, it is copied to [RSP+32],
    a sixth to [RSP+40], and so on. After the return address (8 bytes) is pushed onto
    the stack, the called procedure will then find these values at [RSP+40], [RSP+48],
    and so on. Why start 32 bytes from the bottom? This is to leave space in the stack
    for the first four parameters, even though they are in the registers. The called
    procedure can use this space to copy any of the first argument values.


    Registers can be pushed by entry code and popped by exit code similar to the way
    they are in the 32-bit environment. However, this is usually done before the local
    stack space is reserved. Once the local stack space is established, there should
    be no change to RSP before a subsequent procedure is called. This makes it possible
    to use RSP and based addressing to locate parameters and local variables. However,
    you can use E as a frame pointer if needed.


    RAX is used to return a single quadword value. Microsoft documentation labels
    RAX, RCX, RDX, and R8-R11 as volatile, meaning that the procedure is free to change
    them. Similarly, RBX, RDI, RSI, RSP, and R12-R15 are nonlocal, meaning that a
    called procedure has the responsibility of preserving them. In practice, sometimes
    it is safest to preserve any register that you don''t want destroyed by a called
    procedure. For example, in windows64 the atod macro includes the code


    ```

    mov [rsp+32], rcx      ; save register used to pass parameters

    mov [rsp+40], rbx      ; save registers destroyed by atodproc

    mov [rsp+48], rdx

    lea rcx,source         ; source address to rcx

    call atodproc           ; call atodproc(source)

    ```'
