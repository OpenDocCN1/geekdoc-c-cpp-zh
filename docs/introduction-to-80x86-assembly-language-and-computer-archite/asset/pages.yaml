  md: '# 98 Basic Instructions


    Although there is no mov instruction to copy from a memory source to a memory
    destination, two moves using an intermediate register can do the job. For doubleword-length
    data in memory referenced by count and number the illegal instruction


    ```

    mov count, number      ; illegal for two memory operands

    ```


    can be replaced by


    ```

    mov eax, number        ; count := number

    mov count, eax

    ```


    each using the accumulator EAX and one direct memory operand. Some other register
    than EAX could be used, but each of these instructions using the accumulator requires
    5 bytes, while each of the corresponding instructions using some other register
    6 bytes—EAX is chosen in the interest of compact code.


    Suppose you have numeric data stored in a doubleword in dblSize, but you want
    the byte version at byteSize. Assuming that the high-order 24 bits are not significant,
    you can do this with


    ```

    mov eax, dblSize

    mov byteSize, al

    ```


    Going the other way, if an unsigned or positive value is stored at byteSize and
    we want the doubleword equivalent at dblSize, then


    ```

    mov eax, 0

    mov al, byteSize

    mov dblSize, eax

    ```


    does the job. Notice that the first move ensures that each of the 3 high-order
    bytes in EAX contain 0 rather than unknown values left over from prior operations.
    We will later see instructions to extend the length of a number.


    Suppose that you have source and destination locations declared as


    ```

    source DWORD 4 DUP(?)

    dest   DWORD 4 DUP(?)

    ```


    and that you want to copy all four doublewords from the source to the destination.
    One way to do this is with eight instructions


    ```

    mov eax, source        ; copy first doubleword

    mov dest, eax

    mov eax, source+4     ; copy second doubleword

    ```'
