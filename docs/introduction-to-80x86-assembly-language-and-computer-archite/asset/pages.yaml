    value is passed to the procedure. Reference parameters are used for several purposes,
    two of which are to send a large argument (for example, an array or a structure)
    to a procedure, or to send results back to the calling procedure as argument values.
    This section begins with an example that illustrates both of these uses of reference
    parameters.


