    # 3.4 Instruction Operands


    There are three basic types of instruction operands: (1) constants; (2) CPU register
    design; and (3) references to memory locations. There are several ways of referencing
    memory; two of the simpler ways are discussed in this section, and more complex
    methods will be explained later in this book.


    Many instructions have two operands. In general, the first operand gives the destination
    of the operation, although it may designate a source that will be replaced by
    the result of the operation. The second operand identifies a source for the operation,
    never the destination. For example, when


    ```

    mov  al, ''/''

    ```


    is executed, the byte 2F (the ASCII code for the slash /) will be loaded into
    the AL register, replacing the previous byte. The second operand ''/'' specifies
    the constant source. When


    ```

    add  eax, number1

    ```


    EAX gets the sum of the doubleword in memory referenced by number1 and the old
    contents of EAX. The first operand EAX specifies the source for one doubleword
    as well as the destination for the sum; the second operand number1 identifies
    the memory location for the other of the two doublewords that are added together.


    Figure 3.7 lists the addressing modes used by Intel 80x86 processors, giving the
    location of the data for each mode. For an immediate mode operand, the data to
    be used into the instruction before it is executed; once there it is constant¹
    Normally the data is placed in the instruction by the assembler, although it can
    be


    One can write self-modifying code, that is code that changes its own instructions
    as it executes. This is considered a very poor programming practice.'
