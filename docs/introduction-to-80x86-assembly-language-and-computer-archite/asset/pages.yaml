  md: "# 5.1 Unconditional Jumps\n\nThe 8086 jmp (\"jump\") instruction corresponds\
    \ to goto in a high-level language. As coded in assembly language, jmp usually\
    \ has the form\n\n```\njmp      statementLabel\n```\n\nwhere statementLabel corresponds\
    \ to the name field of some other assembly language statement. Recall that the\
    \ name field is followed by a colon (:) when used to label an executable statement.\
    \ The colon is not used in the jmp instruction itself. As an example, if there\
    \ were alternative conditions under which a program should be terminated, its\
    \ code might contain\n\n```\njmp      ; exit from program\n```\n\n```\nquit: mov\
    \ eax, 0   ; exit with return code 0\nret\n```\n\nFigure 5.1 shows a complete\
    \ example, a program will loop indefinitely, calculating 1+2+...n at the nth loop\
