    Figure 5.6 Conditional jump instructions (compared)


    Conditional jump mnemonics correspond to comparison of the first to second operand
    in a preceding cmp instruction. For example, the instruction jg, "jump if greater"
    means to jump if operand1 > operand2.


    No conditional jump instruction changes any flag value. Each instruction has a
    short version and a near version. Just as with unconditional jump instructions,
    a short conditional jump encodes a single-byte displacement and can transfer 128
    bytes before 127 bytes after the address of the byte following the instruction
    itself. A short conditional jump requires 2 bytes of object code, one for the
    opcode and one for the. A near conditional jump encodes a 32-bit displacement
    in addition to a 2-byte offset, giving a total length of 6 bytes. It can transfer
    control up to 2,147,483,648 bytes backward or 2,147,483,647 forward.


    One more of examples will illustrate the difference between the conditional jumps
    appropriate after comparison of signed and unsigned numbers. Suppose a value is
    stored in EAX and some action needs to be taken when the value is larger than
    100. If the value is unsigned, one might


    ```

    cmp eax, 100

    ja bigger

    ```'
