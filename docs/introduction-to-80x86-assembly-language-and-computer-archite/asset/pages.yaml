    Finally, it is time to present all the details about a string instruction. The
    move instruction **movs** copies one string element (byte, word, doubleword, or
    quad) from a source string to a destination string. The source element at address
    ESI is copied to address EDI. After the string element is copied, both index registers
    are changed by the element size (1, 2, 4, or 8), incremented if direction DF is
    0, or decremented if DF is 1. The **movs** instruction does not affect any flag.
    It comes in **movsb**, **movsw**, **movad** versions; Figure 8.2 gives information
    about each form.


    Figure 8.3 gives an example of a program that uses the **movs** instruction. The
    important part of the example is the procedure `strcpy`. This procedure has two
    parameters that give the destination and source addresses of byte (character)
    strings. The source string is assumed to be null-terminated. Procedure `strcpy`
    produces an exact copy of the source string at the destination location, terminating
    the destination string by a null byte.


    The procedure uses only registers ESI and EDI. The values for ESI and EDI are
    the arguments that were pushed on the stack; the addresses of the first pair of
    source and destination strings. The direction flag is cleared for left-to-right
    copying. Since the procedure must clear the direction flag and the caller may
    depending on it to have the opposite value, the entry code saves the flags register
    in addition to ESI and EDI.


    After initialization the procedure executes this pseudocode design:


    ```

    while next source byte is not null

    copy source byte to destination;

    increment source index;

    increment destination index;

    while;

    put null byte at end of destination string;

    ```'
