    # 2.1 PC Hardware: Memory


    The memory in a computer is logically a collection of "slots," each of which can
    store 1 byte of instructions or data. Each memory byte has a numeric label called
    its physical address. The 32-bit processors use 32-bit labels, each of which can
    be expressed as eight hex digits. The first address is 00000000$_{16}$ and the
    last address can be as large as the unsigned number FFFFFFF$_{16}$. Figure 2.1
    shows a logical picture of the possible memory in a 32-bit PC. Since FFFFFFFF$_{16}
    = 2^{32}$, a 32-bit PC can contain up to 4,294,967,296 bytes of memory, or 4 GB.
    Remember that $2^{10}$ = 1 KB (kilobyte), $2^{20}$ = 1 MB (megabyte), $2^{30}$
    = 1 GB (gigabyte), and $2^{40}$ = 1 TB (terabyte).


    Prior to the 80386, the 8086 family of processors could only directly address
    $2^{20}$ bytes of memory. They used 20-bit physical addresses, often expressed
    as five-hex digits ranging from 00000 to FFFFF.


    The 64-8086 processors such as the Core 2 can operate in either 32-bit or 64-bit
    mode. In 32-bit mode, they use 32-bit addresses just like 32-bit processors. In
    64-bit mode they internally store 64-bit addresses. However, at the time this
    book is written, processors use at most 48 bits of the possible 64. Even with
    this limitation, a 64-bit processor running with a 64-bit operating system could
    address up to $2^{48}$


