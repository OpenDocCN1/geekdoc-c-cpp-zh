  md: 'The "not comparable" alternative can occur if one of the operands is the IEEE
    representation for NaN (not a number), for example.


    If a comparison is made in order to determine program flow, simply setting flags
    in the status word is no help. Conditional jump instructions look at bits in the
    flag register of the 8086, not the status word in the floating point unit. Consequently,
    the status word must be copied to memory or to the AX register before it can be
    examined by an 80x86 instruction, perhaps with a test instruction. There is also
    a sahf instruction (below) that copies AH into the flag register so that conditional
    jump instructions can be used without using AX. The floating point unit has two
    instructions to store the status word; these are summarized in Figure 9.11.


    Here is an example sequence of instructions for floating point numbers:


    ```

    fcom            ; ST > ST1(1)

    fstsw ax      ; copy condition bits to AX

    sahf           ; shift condition bits to flags

    jna            ; skip if not

    ```


    The new instruction here is sahf, which copies AH into the lower-order 8 bits
    of EFLAGS register. Conveniently, it puts C3 (originally 14) in the ZF position
    (bit 6), C2 (bit 10) in the PF position (bit 2), and C0 (bit 8) in the CF position
    (bit 0). Now you can use the conditional jump instructions that examine bits in
    the flags register. Recall the mnemonics listed as appropriate for use after comparison
    of unsigned operands in Figure 5.6. These examine combinations of ZF and CF and
    are the ones to use for floating point comparisons. Since C2 now corresponds to
    PF, you could use jp or jnp to do a "safety check" for a valid comparison.


    The sahf instruction is not valid in 64-bit mode. However, there is another option
    that works in 64-bit mode and later in 32-bit processors. The fcomi instructions
    work just like fcom and fcomp for ST and another stack value,


    | Mnemonic | Operand(s) | Action |

    |---|---|---|

    | fstsw | memory word | copies status register to memory word |

    | fstsw | AX | copies status register to AX |


    Figure 9.11 FPU status word access'
