    Even when provision is made for double-length products, it is useful to tell whether
    the product is the same size as the source, that is, if the high-order half is
    zero. With **mul** instructions, the carry flag CF, and overflow flag OF are cleared
    to 0 if the high-order half of the product is zero, but are set to 1 if the high-order
    half of the product is not zero. These are the only meaningful flag values following
    multiplication operations; previously set values of AF, PF, SF, and ZF flags may
    be destroyed. In Chapter 5 (Branching and Looping), instructions that check flag
    values will be covered; it is possible to check that the high-order half of the
    product can be safely ignored.


