  md: "# 174 Branching and Looping\n\nThe jecxz instruction is 2 bytes long, the opcode\
    \ E3 plus a single-byte displacement. Like the other conditional jump instructions,\
    \ jecxz affects no flag value. In 64-bit mode, there is also a jrcxz instruction\
    \ that checks RCX. It has the same object code as jecxz. The jecxz instruction\
    \ can also be used to code a backward for when the loop body is longer than 127\
    \ bytes, too large for the loop instruction's single-byte displacement. For example,\
    \ the structure\n\n```\nfor counter := 50 downto 1 loop\n  { loop body }\nend\
    \ for;\n```\n\ncould be coded as\n\n```\nmov         ecx, 50      ; number of\
    \ iterations\nforCounter: .               ; loop body\n            .\ndec    \
    \     ecx             ; decrement loop counter\njecxz endFor                ;\
    \ exit if counter = 0\njmp         forCounter     ; otherwise repeat body\nendFor:\n\
    ```\n\nHowever, since the dec instruction sets or resets the zero flag ZF, the\
    \ conditional jump jz endFor can be used just as effectively. It is often convenient\
    \ to use a loop statement to implement a for loop, even when the loop index increases\
    \ and must be used within the body of the loop. The loop statement uses ECX to\
    \ control the number of iterations, while a separate counter serves as the loop\
    \ index. For example, to implement the loop\n\n```\nfor index := 1 to 50 loop\n\
    \  { loop body using index }\nend for;\n```\n\nThe EBX register might be used\
    \ to store index counting from 1 to 50, while the ECX register counts down from\
    \ 50 to 1."
