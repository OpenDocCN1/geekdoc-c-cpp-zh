  md: '# 7.2. Shift and Rotate Instructions


    The rotate instruction

    ror eax, 4 ; shift next digit to right


    could be used instead of the shift instruction in procedure hexToAscii (see Figure
    6.7).

    Since eight 4-bit rotations in all bits being rotated to their original positions
    leaves the value in EAX unchanged at the end. There is no advantage in this particular-program,
    but there could be in similar applications.


    There is an additional pair of rotate instructions, rcl (rotate through carry
    left) and rcr (rotate through carry right). Each of these instructions treats
    the carry flag CF if it were part of the destination. This means that rcl eax,
    1 shifts bits 0 through 30 of EAX left position, copies the old value of 31 into
    CF and copies the old value of CF into 0 of EAX. The rotate through carry instructions
    obviously alter CF; they also affect OF, but no other flag. The opcodes for rotate
    carry instructions are the same as the corresponding shift instructions, and were
    shown in Figure 7.6.


