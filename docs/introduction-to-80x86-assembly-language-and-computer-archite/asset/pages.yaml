    # 1.6 Chapter Summary


    All data are represented in a computer using electronic signals. These can be
    interpreted as patterns of binary digits (bits). These bit patterns can be thought
    of as binary numbers. Numbers can be written in decimal, hexadecimal, or binary
    forms.


    For representing characters, most microcomputers use ASCII codes. One code is
    assigned for each character, including nonprintable control characters.


    Integer values are represented in a predetermined number of bits. An unsigned
    integer is simply the number in binary. Signed integers are stored in 2''s complement
    form; a positive number is stored as a binary number (with at least one leading
    zero to make the required length), and the pattern for a negative number can be
    obtained by subtracting the positive form from a 1 followed by as many 0''s are
    used in the length. A 2''s complement negative number always has a leading 1 bit.
    A hex calculator, used with care, can simplify working with 2''s complement numbers.


    Addition and subtraction are easy with 2''s complement numbers. Since the length
    of a 2''s complement number is limited, there is the possibility of a carry, a
    borrow, or overflow.


    Other formats in which numbers are stored are 1''s complement, binary coded decimal
    (BCD), and floating point.'
