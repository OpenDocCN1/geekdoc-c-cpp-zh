- img_proc: true
  md: '# 6.1 The 80x86 Stack 19


    operand types, omitting segment registers that we will not use. The usual mnemonic
    for push instruction is just push. However, if there is ambiguity about the size
    of the operand (as there would be with a small immediate value) then you can use
    pushw or push mnemonics to specify word-size or doubleword-size operands, respectively.
    The PTR and DWORD PTR operators are used with memory operands when needed.


    When a push instruction is executed for a doubleword-size operand, the stack pointer
    ESP is decremented by 4. Recall that initially ESP contains the address of the
    byte just above the allocated space. Subtracting 4 makes ESP point to the top
    doubleword in the stack. The operand is then stored at the address in ESP, that
    is, at the highmemory end of the stack. Execution is similar for a word-size operand,
    except that ESP is decremented by 2 before the operand is stored.


    # Example


    We show an example of execution of two push instructions. It assumes that ESP
    initially contains 00600200. The first push decrements ESP to and stores the contents
    of EAX at that address. Notice that the low-order and high-order bytes are reversed
    in memory. The second push decrements ESP to 006001F8 and stores FFFFF10(-240_{10})
    at that address.


    | Before | Instructions | After |

    |---|---|--|

    | EAX: B3 B5 47 A2 Stack | | EAX: B3 B5 47 A2 Stack |

    | Stack ← ESP: 0060200 | push eax | 83 |

    | | | B5 |

    | | | 47 |

    | | | A2 ← ESP: 006001FC |

    | | pushd -240 | FF |

    | | | FF |

    | | | FF |

    | | | 10 ← ESP: 006001F8 |'
