  md: '# 278 String Operations


    ```

    while count in ECX > 0 loop

    perform primitive instruction;

    decrement ECX by 1;

    end while;

    ```


    Note that this is a while loop. The primitive instruction is not executed at all
    if ECX contains zero. It is not necessary to guard a repeated string instruction
    as you often must do with an ordinary for implemented with the loop instruction


    The other repeat prefixes are repe (with equivalent mnemonic repz) and repne (as
    repnz). The mnemonic repe stands for "repeat while equal" and repz stands for
    "repeat while zero". Similarly, repne and repz mean "repeat while not equal" and
    "repeat while not zero", respectively. Each of these repeat prefixes is appropriate
    for the use with the two string instructions cmps and scas that affect the zero
    flag ZF.


    The names of these mnemonics partially describe their actions. Each instruction
    works the same as repe, iterating a primitive instruction while ECX is not zero.
    However, also examines ZF after the string instruction is executed. The repe and
    repz continue iterating ZF=1, as it would be following a comparison where two
    operands were different. Each new instruction that is formed with a repeat prefix
    and a primitive string instruction affects flags only as the original primitive
    instruction does does, that is, there is no additional adjustment from the changes
    to ECX. The three repeat prefixes are summarized in Figure 8.5. Note that rep
    and repz (repe) generate exactly the same code.


    The repz and repne prefixes do not produce true while loops with the conditions
    shown in Figure 8.5. The value in ECX is checked during first iteration of the
    primitive instruction, as it should be a while loop. However, ZF is not checked


    | Mnemonic | Loop While | Opcode | Bytes of Code |

    |---|---|---|--|

    | rep | ECX>0 | F3 | 1 |

    | repz/repe | ECX>0 and ZF=1 | F3 | 1 |

    | repnz/repne | ECX>0 and ZF=0 | F2 | 1 |


    Figure 8.5 Repeat prefixes'
