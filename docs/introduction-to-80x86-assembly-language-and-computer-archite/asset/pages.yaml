  md: 'After borrowing, the subtraction is easy. The units digit is


    $10_{16} - C_{16} = 16_{10} - 12_{10} = 4$ (in decimal or hex), and the 16''s
    position is


    $F_{16} - 4 = 15_{10} - 4_{10} = B_{16}$


    It is not necessary to convert the hex digits to subtract them if you learn the
    addition and subtraction tables for single hex digits.


    The process of subtracting a number from 1 followed by an appropriate number of
    0''s is the manual version of the 2''s complement operation. It is equivalent
    to the operation that the Windows calculator performs when you press the +/- key.
    It is a little confusing that ''2''s complement'' refers to a representation system
    and to an operation on numbers in system.(Note: If you actually do the arithmetic
    10000-4C with the Windows calculator, you will have to select Dword or Qword length
    first because 10000 is too large to fit in a word.)


    Note that any time you take the 2''s complement of a number and then take the
    2''s complement of the result, you get back to the original number. For a word-size
    number N, ordinary example gives you


    $N = 10000 - (10000 - N)$


    For example, using the word-length 2''s complement value F39E, $10000 - (10000
    - F39E) = 10000 - C62 = F39E$


    This says again that the 2''s complement operation corresponds to negation. Because
    of this, if you start with a bit pattern representing a negative number, the 2''s
    complement operation can be used to find the positive (unsigned) number corresponding
    to it.


    # Example


    The word-length 2''s complement number E973 represents a negative value since
    the sign bit (leading bit) is 1 (E = 1110). Taking the 2''s complement finds the
    corresponding positive number.


    $10000 - E973 = 168D = 5773_{10}$


    This means that the decimal number represented by E973 is -5773.'
