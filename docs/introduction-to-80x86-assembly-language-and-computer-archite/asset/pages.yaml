    use a w suffix, doubleword string use a d suffix, and quad string instructions
    a q suffix. For example, movsb is used to move strings and movsd is used to move
    doubleword strings. All of these instructions use a mov and none use an operand
    because the assembler knows the element size from the mnemonic.


    The assembler has an alternative way of distinguishing the operand size, which
    is to actually include source and destination operands. These operands are ignored
    except for their size attribute, which can be misleading. We do not use this alternative
    coding style.


    Although a string instruction operates on only one string element at a time, it
    always gets ready to operate on the next element. It does this by changing the
    source register ESI and/or the destination register EDI to contain the address
    of the next element of the string(s). When byte-size elements are used, the registers
    are changed by one; for words, ESI and EDI are changed by two; for doublewords,
    the registers are changed by four; and for quadwords, the registers are changed
    by eight. The x86 can move forward through a string (from lower to higher addresses)
    or backward (from higher to lower addresses). The movement direction is determined
    by the value of the direction flag DF, bit 10 of the flags register. If DF is
    set to 1, then the addresses in ESI and EDI are decremented by string instructions,
    causing right-to-left string operations. If DF is clear (0), then the values in
    ESI and EDI are incremented by string instructions and strings are processed left
    to right.


    The x86 has two instructions whose sole purpose is to reset or set the direction
    flag DF. The cld clears DF to 0 so that ESI and EDI are incremented by string
    instructions and strings are processed left to right. The std instruction sets
    DF to 1 so that ESI and EDI are decremented by string instructions and strings
    are processed backward. Neither instruction affects any flag other than DF. Data
    about these instructions appear in Figure 8.1.


    | Instruction | Opcode | Bytes of Object Code |

    |---|---|---|

    | cld | FC | 1 |

    | std | FD | 1 |


    Figure 8.1 cld and std instructions'
