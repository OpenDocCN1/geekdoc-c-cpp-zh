    initialize two variables. Note that the value 1.0 for divisor ends up in ST(1)
    because it is pushed down by the fldz instruction.


    Other local variables are stored on the stack at the locations shown in the program
    comments. Notice that they are coded using not only [ebp-x] but also with the
    size and type of the operand.


    The design element


    value := 10*value + float(digit);


    is implemented by the code


    ```

    imul DWORD PTR [ebp-4]      ; value := value * 10

    fiadd DWORD PTR [ebp-16]     ; value := value + digit

    ```


    The floating point unit converts the integer 10 to floating point for the multiplication
    and the inverse version of digit to floating point for the addition.


    To implement "multiply divisor by 10," the number to be multiplied must be in
    ST. The instructions


    ```

    fxch                        ; divisor in ST and value in ST(1)

    fimul DWORD PTR [ebp-4]     ; divisor := 10

    fxch                        ; value to ST; divisor back to ST(1)

    ```


    take care of swapping divisor and value, carrying out the multiplication in ST,
    and then swapping back.


    When it is time to execute "value := value / divisor" the instruction


    ```

    fdivr                       ; value := value / divisor

    ```


    pops value from ST and divisor from ST(1), computes the quotient, and pushes it
    back to ST. Note that the fdiv version of this instruction would incorrectly compute
    "divisor/value." The instruction fchs changes the sign of value if a leading minus
    was noted in the ASCII string


