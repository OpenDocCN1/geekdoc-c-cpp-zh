  md: '# Representing Data in a Computer


    It is not as efficient for a computer to do arithmetic with numbers in a BCD-format
    with 2''s complement numbers. It is usually very inefficient to do arithmetic
    on numbers represented using ASCII codes. However, ASCII codes are the only method
    far for representing a number that is not an integer. For example, 78.375 can
    be stored as 38 2E 33 37 35. Floating point representation systems allow for nonintegers
    to be represented, or at least approximated.


    Floating point schemes store numbers in a form that corresponds to scientific
    notation. The example below shows how to convert the decimal number 78.375 into
    IEEE precision format which is 32 bits long (IEEE is the abbreviation for the
    Institute of Electrical and Electronics Engineers). This format was one of several
    sponsored by the Standards Committee of the IEEE Computer Society and approved
    by the IEEE Standards Board and the American Standards Institute (ANSI). It is
    one of the floating point formats used by 8086 processors.


    First 78.375 can be converted to binary. In binary, the positions to the right
    of the binary point (it is not appropriate to say decimal point for the " in a
    binary number) correspond to negative powers of 2 (1/2, 1/4, 1/8, etc.), just
    as they correspond to negative powers of 10 (1/10, 1/100, etc.) in a decimal number.
    Since 0.375 = 3/8 = 1/4 + 1/8 = .01 + .001, $0.375_{10} = .011_2$. The whole part
    78 is 10011110 in binary,


    ```

    $78.375_{10} = 10011110.011_2$

    ```


    Next this is expressed in binary scientific notation with the mantissa written
    with 1 before the binary point.


    ```

    $10011110.011_2 = 1.0011110011 \times 2^6$

    ```


    The exponent is found exactly as it is in decimal scientific notation by counting
    the number of positions the point must be moved to the right or left to produce
    the mantissa. The notation here is really mixed; it would be more proper to write
    $2^6$ as $10^{10}$, but it is more convenient to use the decimal form. Now the
    floating point number can be pierced together:


    +   - left bit 0 for a positive number (1 means negative)

    - 0000 1001 for the exponent. This is the actual exponent of 6, plus a bias of
    127, with the sum, 133, in 8 bits.

    - 100111000000000000000, the fraction expressed with the leading 1 removed and
    padded with zeros on the right to make 23 bits'
