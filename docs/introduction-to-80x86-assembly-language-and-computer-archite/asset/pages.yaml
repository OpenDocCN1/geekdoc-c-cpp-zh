    # 8.3 Character Translation


    Sometimes character data are available in one format but need to be in another
    format for processing. One instance of this occurs when characters are transmitted
    between two computer systems, one normally using ASCII character codes and the
    other normally using EBCDIC character codes. Another time character codes need
    to be altered to transmit them to a device that cannot process all possible codes;
    it is sometimes easier to replace the unsuitable codes by acceptable codes to
    delete them entirely.


    The 8086 instruction set includes the xlat instruction to translate one character
    to another. In combination with other string-processing, it can easily translate
    characters in a string.


    The xlat instruction requires only 1 byte of code, the opcode D7. Prior to execution,
    the character to be translated is in the AL register. The instruction works by
    using a translation table in the data segment to look up the translation of the
    byte in AL. This translation table normally contains 256 bytes of data, for each
    possible 8-bit value in AL. The byte at offset 0 is the character to which 00
    is translated. The byte at offset 1 is the character to which 01 is translated.
    In general, xlat uses the character as a zero-based index into the table, and
    the byte at that index then replaces the character in AL.


    The xlat instruction has no operand. The EBX register must contain the address
    of the translation table (RBX is used in 64-bit mode.)


    Figure 8.12 lists a sort console2 program that translates each character of string
    in place; it replaces each character by its translation using the original location
    in memory. This program again makes use of the strlen procedure that first appeared
    in Figure 8.7. It is in a separately assembled file. The heart of the program
    is the translation table and the sequence of instructions'
