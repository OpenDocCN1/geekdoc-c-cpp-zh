    Recall that an immediate operand is actually assembled into the object code. Each
    of these instructions contains 155 converted to binary in the appropriate length,
    9B in the first instruction, 009B in the second, and 0000009B in the third. The
    first instruction has opcode B0, but both of the other instructions have opcode
    B8. The 66 byte in the second instruction is the prefix byte that tells the assembler
    to switch from 32-bit operand to 16-bit for this instruction.


    A 64-bit 80x86 processor runs in either legacy 32-bit mode, as described previously,
    or 64-bit mode. Different code segments can be in different modes at the same
    time. In 64-bit mode, the default operand size is still 32.


    Figure 4.6 shows the mov instructions with a quadword destination. Obviously these
    are only available in 64-bit processors. The first 16 rows are not surprising,
    showing separate instructions for loading a 64-bit immediate operand in a 64-bit
    register. Each consists only of a REX prefix, the opcode, and the 8 bytes of the
    immediate operand. The next two rows show a feature that we have not seen in previous
    instructions; the immediate value stored in the instruction is a doubleword. A
    sizeof doubleword saves 4 bytes of object code. The immediate doubleword is sign-extended
    to a quadword as it is stored in the destination, that is, the sign bit (bit 31)
    in the source is copied to each of bits 32–63 in the destination. This ensures
    that 2''s complement signed numbers are properly represented, and in rare instances
    could cause a large unsigned number to be incorrectly extended to 64 bits. Also,
    the REX prefix for each of the last five rows is shown as 4x since there is more
    than one possible value in each row.


    Particularly with older processors, instructions that access memory are slower
    than instructions that use data in registers. A programmer should plan to keep
    frequently used data in registers when possible.


