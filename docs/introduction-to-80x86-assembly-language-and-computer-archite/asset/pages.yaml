  md: '# 3.1 Assembly Language Statements


    The instruction can then be the destination of a jmp (jump) instruction, the assembly
    language version of a goto:


    ```

    jmp addLoop ; repeat addition

    ```


    Notice that the colon does not appear at the end of the name addLoop in the jmp
    instruction.


    High-level language loop structures like while or for are not available in machine
    language. However, they can be implemented using jmp or other instructions. You
    will learn how this is done in Chapter 5.


    It is sometimes useful to have a line of source code consisting of just a name,
    for example


    ```

    endWhile:

    ```


    Such a label might mark the end of a while loop. Technically it references the
    address of whatever instruction follows the loop, but you don''t have to know
    what next statement is to complete coding of the while loop.


    Names and other identifiers used in assembly language are formed from letters,
    digits, and special characters. The allowable special characters are underscore
    (_) question mark (?), dollar sign ($) and at sign (@). A name may not begin with
    a digit. An identifier may have up to 247 characters, so that it is easy to find
    meaningful names. The assembler does not allow instruction mnemonics, directive
    mnemonics, register designations, and other words that have a special meaning
    to the assembler to be used as names. Appendix B contains a list of identifiers.


    Assembly language statements can be entered using either uppercase or lowercase-letters.
    Normally the assembler does not distinguish between uppercase and lowercase-case.
    It can be instructed to distinguish within identifiers, but this is only needed
    when you are linking to a program in a language that is case-sensitive. Mixed-case
    code is easier for people to read code in all uppercase or lowercase. All uppercase
    code is especially difficult to read. The convention followed for programs in
    this book is to use mostly lowercase code except for program directives.


    The assembler accepts code that is almost impossible for a person to read. However,
    since your programs will also be read by other people, you should make your code
    as readable as possible. Good program formatting and use of lowercase letters
    will help.


    Recall that assembly language statements can contain name, mnemonic, operand,
    and comment fields. A well-formatted program has these fields aligned as you'
