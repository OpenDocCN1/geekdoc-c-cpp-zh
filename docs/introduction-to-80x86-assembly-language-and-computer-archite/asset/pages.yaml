  md: '# 2.4 PC Software 41


    # # PC Software: The Operating System


    A general-purpose computer system needs an operating system to enable it to run
    other programs. The original IBM PC usually ran the operating system known as
    PC-DOS; compatible systems used the very similar operating systems called MS-DOS.
    DOS stands for **disk operating system**. All of these operating systems were
    developed by Microsoft Corporation; PC-DOS was customized by IBM to work on the
    IBM PC, and the versions of MS-DOS that ran on other computer systems were sometimes
    customized by their hardware manufacturers. Later versions of PC-DOS were produced
    solely by IBM.


    The DOS operating systems provide a **command line interface** DOS displays a
    prompt (such as C>) and waits for the user to type a command. When the user presses
    the Enter (or Return) key, DOS interprets the command. The command may be to perform
    a function that DOS knows how to do (such as displaying the directory of files
    on a disk), or it may be the name of a program to be loaded and executed.


    Many users prefer a **graphical user interface** that displays tasks or files,
    so that the user can make a selection by clicking on an icon with a mouse. Microsoft
    Windows provides a graphical user interface for PCs. The versions through Windows
    3.1 enhanced the operating environment, but still required DOS to run. Windows
    95 included a major revision of the operating system, which was no longer sold
    separately from the graphical user interface. In Windows 95 the graphical user
    interface became the primary user interface, although a command line interface
    was still available. The Windows operating system has continued to evolve and
    is currently available in many versions.


    # # PC Software: Text Editors


    **A text editor** is a program that allows the user to create or modify text files
    that are stored on secondary storage like a hard disk. A text file is a collection
    of ASCII codes. The text files of most interest in this book are assembly language
    source code files—files that contain assembly language statements. A text editor
    is sometimes used to prepare a data file.


    Microsoft Windows includes a text editor called Notepad. This full-screen editor
    uses all or part of the monitor display as a window into the file. The user can
    move the window up or down (or left or right when the window is narrow) to display
    different portions of the file. To make changes to the file, cursor keys or the
    mouse are used to'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'move the cursor to the place to be modified, and the changes are entered. Notepad
    can be used to write or modify assembly language source programs, but we do most
    editing in an integrated development environment, discussed below.


    Word processors are text editors that provide extra services for formatting and
    printing documents. For example, one uses a text editor, usually the Enter key
    must be pressed at the end of each line. However, a word processor usually wraps
    words automatically to the next line as they are typed, so that Enter or some
    other key is used only at the end of a paragraph. The word processor takes care
    of putting the words on each line within specified margins. A word processor can
    sometimes be used as an editor to prepare an assembly language source code file,
    but some word processors store information with the file along with the ASCII
    codes for the text. Such extra information may make the file unsuitable as an
    assembly language source code file, so it is safest to avoid a word processor
    when editing an assembly language source program.


    # PC Software: Language Translators and the Linker


    Language translators are programs that translate a programmer''s source code into
    a form that can be executed by the computer. These are usually not provided with
    an operating system. Language translators can be classified as interpreters, compilers,
    or assemblers.


    Interpreters directly decipher a source program. To execute a program, an interpreter
    looks at a line of source code and follows the instructions of that line. Programs
    written in the Basic or Lisp languages are often executed by an interpreter. Although
    the interpreter itself may be a very efficient program, interpreted programs often
    execute relatively slowly. An interpreter is generally convenient because it allows
    a program to be quickly changed and run. The interpreter itself is sometimes a
    larger program.


    Compilers start with source code and produce object code that consists mostly
    of instructions to be executed by the intended CPU. High-level languages such
    as Fortran, Cobol, C, and C++ are commonly compiled. The object code produced
    by a compiler must be linked or combined with other object code to make a program
    that can be loaded and executed. This requires a utility called a linker, usually
    provided with a compiler. Instead of producing code for a particular CPU, some
    compilers produce intermediate code that can be very efficiently interpreted;
    this is common with Java compilers.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# 2.5 Chapter Summary


    An assembler is used much like a compiler, but translates assembly language rather
    than a high-level language into machine code. The resulting files must normally
    be linked to prepare them for execution. Because assembly language is closer to
    machine code than a high-level language, the job of an assembler is somewhat simpler
    than the job of a compiler. Assemblers historically existed before compilers.


    Using again the assembly language instruction cited in Section 2.2,


    ```

    add eax, 158

    ```


    is translated by the assembler into the 5 object code bytes 05 00 00 00 9E. The
    first byte 05 is the op code (operation code) that says to add the number contained
    in the next 4 bytes to the doubleword already in the EAX register. The doubleword
    00 00 00 9E is the 2''s complement representation of 158_{10}.


    A debugger allows a programmer to control execution of a program, stepping through
    instructions one at a time, or pausing at a preset breakpoint. When the program
    is temporarily stopped, the programmer can examine the contents of variables in
    a high-level language, or registers in assembly language. A debugger is useful
    to find errors and to "see inside" a computer to find out how it executes programs.


    Integrated development environments use a single interface to access an editor,
    a compiler, an assembler, and a linker. They also initiate execution of the program
    being developed, and frequently provide other utilities, such as a debugger. An
    integrated development environment is convenient, but may not be available for
    a particular programming language. You will learn how to use Microsoft''s Visual
    Studio integrated development environment for assembly language programs in Chapter
    3.


    # 2.5 Chapter Summary


    This chapter discussed the hardware and software components that make up a PC
    microcomputer system.


    The major hardware components are the CPU and memory. The CPU executes instructions
    and uses its internal registers for instruction operands and results, and to determine
    addresses of data and instructions stored in memory. Objects in memory can be
    addressed by 32-bit addresses with a 32-bit CPU and 64-bit addresses with a 64-bit
    CPU. In a flat memory model, such addresses are effectively actual addresses.
    In a segmented memory model, addresses are calculated from a starting address
    determined from a segment number, and an offset from the segment.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'Input/output at the hardware level uses a separate collection of addresses
    called "ports." Input/output is usually done through operating systems procedure
