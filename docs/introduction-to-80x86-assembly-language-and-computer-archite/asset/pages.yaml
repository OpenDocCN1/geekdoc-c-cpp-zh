  md: 'The atod macro expands into the following sequence of instructions.


    ```

    lea      eax,source    ; source address to EAX

    push     eax             ; source parameter on stack

    call     atodproc        ; call atodproc(source)

    add      esp, 4         ; remove parameter

    ```


    These instructions simply call procedure atodproc passing a single argument, the
    address of the string of ASCII characters to be scanned. The EAX register is not
    saved by the macro code since the result is to be returned in EAX. The actual
    source identifier is used in the expanded macro, not the name source


    The actual ASCII to 2''s complement integer conversion is done by the procedure
    atodproc whose source code is in the file io.asm in the windows32 package. The
    procedure begins with standard entry code and ends with standard exit. The first
    job of atodproc is to skip leading spaces, and

    atodproc


    ```

    ; atodproc(source)

    ; Procedure to scan data segment starting at source address, interpreting

    ; ASCII characters as an doubleword-size integer returned in EAX.


    ; Leading blanks are skipped. A leading - or sign is acceptable.

    ; Digit(s) must immediately follow the sign (if any).

    ; Memory scan is terminated by any non-digit.

    ```


    ; No error checking is done. If the number is outside the range for a

    ; signed word, then the return value is undefined.


    ```

    atodproc  PROC

    push     ebp             ; save base pointer

    mov      esp, esp      ; establish stack frame

    sub      esp, 4         ; local space for sign

    push     ebx             ; Save registers

    push     edx

    push     esi

    pushfd               ; save flags


    mov      esi,[ebp+8]    ; get parameter (source addr)


    (continues)

    ```


