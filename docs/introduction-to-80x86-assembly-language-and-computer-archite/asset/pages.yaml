    # 6.5 Macro Definition and Expansion


    A macro was defined in Chapter 3 as a statement that is shorthand for a sequence
    of other statements. The assembler expands a macro to the statements it represents,
    and then assembles these new statements. The windows32 and windows64 programs
    in previous chapters have made extensive use of macros defined in the file io.h.
    This section explains how to write macro definitions and tells how the assembler
    uses these definitions to expand macros into other statements.


    A macro definition resembles a procedure definition in a high-level language.
    The first line gives the name of the macro being defined and a list of parameters;
    the main part of the definition consists of a collection of model statements that
    describe the action of the macro in terms of parameters. A macro is called much
    like a high-level language procedure, too—the name of the macro is followed by
    a list of arguments.


    These similarities are superficial. A procedure call in a high-level language
    is compiled into a sequence of instructions to push parameters on the stack followed
    by a call instruction, whereas a macro call actually expands into statements given
    in the macro, with the arguments substituted for the parameters used in the macro
    definition. Code in a macro is repeated every time a macro is called, but there
    is just one copy of the code for a procedure. Macros often execute more rapidly
    than procedure calls since there is no overhead for passing parameters or for
    call and ret instructions, but this is usually at the cost of more bytes of object
    code.


    Every macro definition is bracketed by MACRO and ENDM directives. The format of
    a macro definition is


    ```

    name list of parameters

    assembly language statements

    ENDM

    ```


    The parameters in the MACRO directive are ordinary symbols, separated by commas.
    The assembly language statements may use the parameters as well as registers,
    immediate operands, or symbols defined outside the macro. The statements may even
    include macro calis.'
