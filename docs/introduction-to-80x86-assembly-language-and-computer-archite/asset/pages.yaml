  md: "# 4. The following algorithm approximates the cube root of a real number x.\n\
    \n```\nroot := 1.0;\nuntil (root - oldRoot < smallValue) loop\n  oldRoot := root;\n\
    \  root := (2.0*root + x/(root*root)) / 3.0;\nuntil;\n```\n\nImplement this algorithm\
    \ as a value-returning assembly language procedure cuberoot with two float parameters:\
    \ (1) x and (2) smallValue. Write a C or C++ program to input values for x and\
    \ smallValue, call cuberoot, and display the computed value.\n\n# 9.6 Chapter\
    \ Summary\n\nThe 80x86 uses three formats for floating point numbers, single (32\
    \ bits), double (64 bits), and extended double (80 bits). Each format consists\
    \ of a sign, a biased exponent, and a fraction.\n\nThe 80x86 floating point unit\
    \ (FPU) contains 80-bit data registers, organized as a stack. Each register stores\
    \ an extended real floating point value. The FPU executes a variety of instructions\
    \ from load and store, to simple arithmetic, to complex transcendental functions.\n\
    \nConversion between floating point and ASCII representations is similar to that\
    \ previously described for integers. The easiest ASCII format to scan is a simple\
    \ decimal format. The simplest ASCII format to produce E-notation.\n\nSeveral\
    \ generations of 80x86 processors have included single-instruction multiple-data\
    \ instructions. The streaming SIMD extensions (SSE) add XMM registers and floating\
    \ point instructions that are used in the 64-bit environment.\n\nAssembly language\
    \ procedures can be called from C or C++ programs using standard linkage conventions.\
    \ A single float is returned on the top of the floating point stack in 32-bit\
    \ mode, or in the XMM0 register in 64-bit mode. In 32-bit mode, parameter passing\
    \ is the same for integers and floats. However, in 64-bit mode, float parameters\
    \ are passed in XMM registers."
