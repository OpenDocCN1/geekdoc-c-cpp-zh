  md: '# 1.3 Unsigned and Signed Integers


    What we now have is a good system of representing nonnegative, or unsigned numbers—a
    predetermined length holding a binary representation padded with leading 0 bits,
    if needed. This system cannot represent negative numbers. Also, for any length,
    there is a largest unsigned number that can be represented, for example FF$_{16}$
    or 255$_{10}$ for byte length.


    The 2''s complement system is similar to the above scheme for unsigned numbers,
    but it allows representation of negative numbers. Numbers will be a fixed length,
    so that you may refer to the "doubleword-length 2''s complement representation"
    of a number. The 2''s complement representation for a negative number is almost
    identical to the unsigned representation, that is, you represent the number in
    binary with enough leading zeros to fill the desired length. There is one additional
    restriction—for a positive number, the leftmost bit must be zero. This means,
    for example, that the positive number can be represented in word-size 2''s complement
    form is 0111111111111111$_{2}$, FFFF$_{16}$ or 32,767$_{10}$.


    As you have probably already guessed, the leftmost bit is always 1 in the 2''s
    complement representation of a negative number. You might also guess that the
    rest of the representation is the same as for the corresponding positive number,
    but unfortunately the situation is more complicated than that, you cannot simply
    change the leading bit from 0 to 1 to get the negative value of a number.


    A hex calculator makes it easy to convert a negative number to 2''s complement
    form. For instance, with the Windows calculator, if the decimal display shows
    -200 and the Hex radio button is clicked when Qword length is also selected, the
    display will show FFFFFFFFF. Note that this number has a leading 1 bit because
    the leading hex digit is F (1111). If the Dwarf, or Byte lengths are selected,
    the result will be FFFFF, 38, or respectively. Note that these are the same except
    for the number of leading 1 bits (hex digits). Unfortunately, 38 is not a correct
    answer because the magnitude of -200 is too large to represent as a byte-size
    2''s complement number. One number you can tell that the answer is incorrect is
    38$_{16}$=00111000$_{2}$, a positive number. Later in this section we take a closer
    look at how big a number can be for word-size representations, and the exercises
    about other sizes.


    Let''s concentrate on word-length representations for a while. We just looked
    at converting -200 to 2''s complement. If you use the Windows calculator the Hex
    display gives FF38. Now click the Dec radio button. Instead of going back to -200,
    the display shows 65336! The reason is simple—the word FF38 has interpretations:
    the unsigned number equivalent to 65336$_{10}$ and the signed (2''s complement)
    num-'
