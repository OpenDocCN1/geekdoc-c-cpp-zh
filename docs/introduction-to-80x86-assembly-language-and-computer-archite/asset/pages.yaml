  md: '# 2.2 PC Hardware: The CPU 35


    The EBP register is the base pointer register. Normally the only data item accessed
    in the stack is the one at the top of it. However


    In addition to the eight general-purpose-registers, 32-bit 80x86 CPUs have six
    16-bit segment registers: CS, DS, ES, FS, GS, and SS. In the older 16-segmented
    memory model, the CS register contains the segment number of the code segment,
    the area of memory storing instructions currently being executed. Since a segment
    is 64 KB long, the length of a program''s collection of instructions is often
    limited to 64 KB; a longer program requires that the contents of CS be changed
    while the program is running. Similarly, DS contains the segment number of the
    data segment, the area of memory storing most data. The SS register contains the
    segment number of the stack segment. The ES register contains the segment number
    of the extra data segment that could have multiple uses. The FS and GS registers
    were added with the 80386, and make possible easy access to two additional data
    segments.


    With the flat 32-bit memory model we use, the segment registers become essentially
    irrelevant to the programmer. The operating system gives each of CS, DS, ES, and
    SS values. Recall that each value is a pointer to a table entry that includes
    the actual starting address of the segment. That table also includes the size
    of your program, so that the operating system can identify an error if your program
    accidentally or deliberately attempts to write in another area. However, all of
    this is transparent to the programmer who can think in terms of 32-bit addresses.


    The 32-bit instruction pointer, or EIP register, cannot be directly accessed by
    an assembly language programmer. The CPU fetches instructions to be executed from
    memory, and EIP keeps track of the address of the next instruction to be fetched.
    If this were an older, simpler computer architecture, the next instruction to
    be fetched would also be the next instruction to be executed. However, an 80x86
    CPU actually fetches instructions to be executed later while it is still executing
    prior instructions, making the assumption (usually correct) that the instructions
    to be executed next will follow in memory. If this assumption turns out to be
    wrong, for example, if a procedure call is executed, then the CPU throws out the
    instructions it has stored, sets EIP to contain the address of the procedure,
    and then fetches its next instruction from the new address.


    In addition to prefetching instructions, an 80x86 actually starts execution of
    an instruction before it finishes execution of prior instructions. This use of
    pipelining increases effective processor speed.


    ![](img/0a28ab4c74434132c88d9a96aa74f8e4_50_0.png)'
