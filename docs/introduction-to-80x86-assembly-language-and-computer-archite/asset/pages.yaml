    Figure 7.5 Shift instructions


    An instruction having the format


    s-- destination, 1


    a shift of exactly one position within the destination location. With the format


    s-- destination, immediate8


    an immediate operand of 0 to 255 can be coded. However, most of the 80x86 family
    mask this operand by 00111111₂, that is, reduce it mod 32 before performing the
    shift. (This is 00111111₂ for mod 64 in 64-bit mode) This makes sense because
    you cannot over 32 meaningful shift operations to an operand no longer than a
    doubleword. In the final,


    s-- destination, cl


    the unsigned count operand is in the CL register. Again, 80x86 CPUs reduce the
    count mod 32 or 64 before beginning the shifts

    Arithmetic and logical shifts are identical; the mnemonics sal and shl are synonyms
    that generate the same object code. When a shift is executed, the bits in the
    destination slide to the left and 0 fills in on the right. The bits that fall
    off the right are lost except for the very last one shifted off, it is saved in
    the carry flag CF. The sign SF, zero flag ZF, and parity flag PF are assigned
    values corresponding to the final value in the destination location. The overflow
    CF is undefined for multiple-bit shift; for a single-bit shift (count=1) it is
    reset to 0 if the sign bit of the result is the same as the sign bit of the original
    value, and set to 1 if they are different.

    Arithmetic and logical right shifts are not the same. With both, the bits in the
    destination slide to the right and the bits that fall off the right are lost except
    for the very last shifted off that is saved in CF. For a logical right shift (shr)
    0 fills in on the left. However, with an arithmetic right shift (sar) copies of
    the original sign bit are used to fill


