    \ loops.\n\nA while loop can be indicated by the following pseudocode design.\n\
    \n```\nwhile continuation condition loop\n    { loop body }\nend while;\n```\n\
    \nA while loop is a pretest loop—the continuation condition, a Boolean expression,\
    \ is checked first, if it is true, then the body of the loop is executed. The\
    \ continuation condition is then checked again. Whenever the value of the Boolean\
    \ expression is false, execution continues with the statement following end while.\n\
    \nAn 80x86 implementation of a while loop follows a pattern much like this one.\n\
    \n```\nwhile:\n    ; code to check Boolean expression\n\nbody:\n    ; loop body\n\
    \njmp while ; go check condition again\nendWhile:\n```"
