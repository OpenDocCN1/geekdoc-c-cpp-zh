    The instruction mnemonic is add, the first operand EAX is obviously a register,
    and the second operand 158 is immediate. The number 00000005 is the assembly-time
    address of this instruction. The assembler starts assembling instructions at address
    00000000 so whatever was assembled before this instruction took 5 bytes. Instruction
    also takes 5 bytes, an opcode 05 (in this case to add a doubleword into the instruction
    to (EAX)), and the 4 bytes 0000009E of the doubleword representation of 158. Collected,
    these 5 bytes are called the object code for this instruction. The listing shows
    this object code, and since there is no address to be modified it is exactly the
    machine code that will be executed.


