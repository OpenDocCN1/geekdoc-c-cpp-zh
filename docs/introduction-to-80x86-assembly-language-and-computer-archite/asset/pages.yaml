    When a 64-bit processor is in 32-bit mode, it operates as described in the previous
    paragraph. However, segmented memory is not used in 64-bit mode.


    In reality, the address generated by a program is not necessarily the physical
    address at which an operand stands. There is an additional layer of memory management
    performed by the operating system and the 80x86 CPU. A paging mechanism is used
    to map the program''s addresses into physical addresses. Paging is useful when
    a logical address generated by a program exceeds the maximum address in the physical
    memory actually installed in a computer. It can also be used to swap parts of
    a program from disk when the program is too large to fit into physical memory.
    The memory management mechanism will be transparent to us as we program in assembly
    language.


