  pgno: 133
- img_proc: true
  md: '# 4.3 Multiplication Instructions


    There are fewer variants of mul than imul, so we consider it first. The mul instruction
    has a single operand; its format is


    mul source


    The source operand can be byte-, word-, doubleword-, or quadword-length (quadword
    in 64-bit mode only). It can be in a register or in memory, but cannot be immediate.
    The location of the other number to be multiplied is always the accumulator-AL
    for a byte source, AX for a word source, EAX for a doubleword source, and RAX
    for a quadword source. If source has byte length, then it is multiplied by the
    byte in AL; the product is 16 bits long, destination the AX register. If source
    has word length, then it is multiplied by the word in AX; the product is 32 bits
    long, with its lower-order 16 bits going to the DX register. If source is a doubleword,
    then it is multiplied by the doubleword in EAX; the product is 64 bits long, with
    the EAX and its high-order 32 bits in the EDX register, written EDX:EAX. If source
    is a quadword, then it is multiplied by the quadword in RAX; the product is 128
    bits long, with its lower-order 64 bits in the RAX register and its high-order
    64 bits in the RDX register, written EDX:RAX. For byte multiplication the original
    values in AX and DX are wiped out. For doubleword multiplication the original
    values in AX and EDX are wiped out. Similarly, for quadword multiplication the
    values in RAX and RDX are replaced by the product. In each case the source operand
    is unchanged it is half of the destination location.


    At first glance, it may seem strange that the product is twice the length of each
    factor. However, this also occurs in decimal multiplication—if, for example, two
    4-digit numbers are multiplied, the product will be 7 or 8 digits long. Computers
    that have multiplication operations often put the product in double-length locations
    so that there is no danger the destination location will be too small.


    You may also wonder why the 8086 places a 32-bit product in DX and AX instead
    of EAX. This is because the mul instruction existed in the 8086, 8088, 80186,
    and 80286 processors with 16-bit registers, and when the 80386 introduced 32-bit
    registers it was designed to extend the earlier architecture. Later processors
    continued the compatibility with earlier designs.


    Figure 414 summarizes the allowable operand types for mul instructions. Notice
    that no immediate operand is allowed in a mul.'
  merge: -1
  pgno: 134
