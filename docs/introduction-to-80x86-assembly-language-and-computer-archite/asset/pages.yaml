  md: "# 5.4 for Loops in Assembly Language 173\n\n```\nmov ecx, number ; number of\
    \ iterations\nforIndex:    . ; loop body\n\n            loop forindex repeat body\
    \ number times\n```\n\nThis code gives surprising results if the value stored\
    \ at number is zero. If it is zero, the loop body is executed, the zero value\
    \ is decremented to FFFFFFFF (borrowing to do the subtraction), the loop body\
    \ is executed again, the value FFFFFFFF is decremented to FFFFFFFE, and so forth.\
    \ The loop body of the loop is executed 294 million times before the value in\
    \ ECX gets back down to zero! To avoid this problem, one could code\n\n```\nmov\
    \ ecx, number ; number of iterations\ncmp ecx, 0 ; number = 0\njz endFor ; skip\
    \ loop if number = 0\nforIndex:    . ; loop body\n\n            loop forIndex\
    \ repeat body number times\n\nendFor:\n```\n\nIf number is a signed value and\
    \ might be negative,\n\n```\njle endFor ; skip loop if number <= 0\n```\n\nis\
    \ a more appropriate conditional jump.\nThere is another way to guard a for loop\
    \ so that it is not executed when the value in ECX is zero. The 80x86 architecture\
    \ has a jecxz conditional jump instruction that jumps to its destination if the\
    \ value in the ECX register is zero. Using the jecxz instruction, the previous\
    \ example can be coded as\n\n```\nmov ecx, number ; number of iterations\\jecxz\
    \ endFor ; skip loop if number = 0\nforIndex:    . ; loop body\n\n           \
    \ loop forIndex repeat body number times\n\nendFor:\n```"
