    The Microsoft assembler recognizes several additional directives for reserving
    storage. These include BYTE for a 10-byte integer, REAL4, for reserving a 4-byte
    floating point number, for an 8-byte floating point number, REAL8 and REAL10 for
    a 10-byte floating point number. It also has directives to distinguish signed
    bytes, words, and double from unsigned. We use a few of these directives in Chapter
    9.


    Let us look again at three data section lines from the listing file in Figure
    3.6 (slightly edited to save):


    ```

    00000000         DATA           ; reserve storage

    00000000 FFFFF97 number DWORD      -105

    00000004 00000000 sum      DWORD       ?

    ```


    The first DWORD directive generates a doubleword containing FFFFF97. The second
    DWORD directive generates a doubleword containing 0000000. These values are shown
    in the second column of numbers. The first column of numbers contains addresses.
    The assembler assumes that the data segment starts at address 00000000. (This
    is adjusted when the program is linked and loaded.) Therefore, the assembly address
    associated with number is 00000000. Since number is 4 bytes starting at 00000000,
    the next available space is at address 00000004. This becomes the assembly time
    address of sum. Notice that the length of sum is not needed to tell its starting
    address, but we know if there were a third data item, it would be at address 00000008.
    The next section looks at how these assembly time locations are used in machine
    code.


    Although data definition directives are often coded with a label, this is not
    required. For example, you might code


    ```

    value DWORD ?nDWORD ?

    ```'
