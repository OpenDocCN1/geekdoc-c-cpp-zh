    # 7.2 Shift and Rotate Instructions


    The logical instructions introduced in the previous section enable the language
    programmer to set or clear bits in a word or byte store. Shift and rotate instructions
    enable the programmer to change the position of bits within a doubleword, word,
    or byte. This section describes the shift and rotate instructions and gives examples
    of some ways they are used.


    Shift instructions slide bits in a location given by the destination operand to
    the left or to the right. The direction of the shift can be determined from the
    last character of the mnemonic—*sal* and shl are left shifts; *sar* and *shr*
    are right shifts. Shifts are also categorized as logical or arithmetic—shl and
    *shr* are logical shifts; *sal* and *sar* are arithmetic shifts. The difference
    between logical and arithmetic shifts is explained below. The table in 7.5 summarizes
    the mnemonics.


    The source code of any shift instruction is


    ```

    s-- destination, count

    ```


    There are three versions of the count operand. This operand can be the number,
    another number serving as a byte-size immediate operand, or the register specification
    CL. The original 8086/8088 CPU had only the first and third of these options.'
