    ```

    word5  WORD    -1         ; value is FFFF

    word6  WORD    -1000       ; value is FC18

    word7  WORD    -32768      ; value is 8000


    quad1  QWORD   -1           ; value is FFFFFFFFFFFF

    quad2  QWORD   1000       ; value is 00000000000003E8

    ```


    One the points of these examples is that different operands can result in the
    same stored value. For instance, note that the DWORD directives with operands
    4294967295 and -1 both generate words containing FFFFFFFF. This value can be thought
    of as either the unsigned number 4,294,967,295 or the signed number -1, depending
    on the context in which it is used.


    In addition to numeric operands, the BYTE directive allows character operands
    with a single character or string operands with many characters. Either apostrophes
    ('''') or quotation marks (") can be used to designate characters or delimit strings.
    They must be in pairs; you cannot put an apostrophe on the left and a quotation
    mark on the right. A string delimited with apostrophes can contain quotation marks,
    and one delimited with quotation marks can contain apostrophes, making it possible
    to have strings containing these special characters. Unless there is reason to
    do otherwise, this book follows the convention of putting single characters between
    apostrophes and strings of characters between quotation marks.


    Each of the following BYTE directives are allowable.


    ```

    char1  BYTE ''m''      ; value is 6D

    char2  BYTE 6dh       ; value is 6D

    string1 BYTE "Joe"     ; value is 4A 6F 65

    string2 BYTE "Joe''s"   ; value is 4A 6F 27 73

    ```


    The same values are stored for char1 and char2. As noted before


    BYTE, WORD, DWORD, and QWORD directives may have multiple operands separated by
    commas. The directive


    ```

    dwords DWORD   10, 20, 30, 40

    ```'
