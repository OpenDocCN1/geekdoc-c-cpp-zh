  md: '# 6.1 The 80x86 Stack


    Programs in this book have allocated stacks with the code


    +   . STACK 4096


    This STACK directive tells the assembler to reserve 4096 bytes of uninitialized
    storage. The operating system initializes the stack pointer register ESP to the
    address of the first byte above the 4096 bytes in the stack. A larger or smaller
    stack could be allocated, depending on the anticipated usage in the program.


    The stack is most often used by pushing operands on it, or by popping them off.
    It is also done automatically as part of the execution of call and return instructions
    (see Section 6.2). It is also done manually with push and pop instructions. This
    section covers the mechanics of push and pop instructions, describing how they
    use the stack.


    Source code for a push instruction has the syntax


    ```

    push source

    ```


    The source operand can be a register 16, a register 32, a segment register, a
    word in memory, an immediate byte, an immediate word, or immediate doubleword.
    The only byte-size operand is immediate, and is sign-extended to a word or doubleword
    to get the value actually pushed on the stack. Figure 6.1 lists some allow


    | Operand | Opcode | Bytes of Object Code |

    | --- | --- | --- |

    | EAX or AX | 50 | 1 |

    | ECX or CX | 51 | 1 |

    | EDX or DX | 52 | 1 |

    | EBX or BX | 53 | 1 |

    | ESP or SP | 54 | 1 |

    | EBP or BP | 55 | 1 |

    | ESI or SI | 56 | 1 |

    | EDI or DI | 57 | 1 |

    | memory word | FF | 2+ |

    | memory doubleword | FF | 2+ |

    | immediate byte | 6A | 2 |

    | immediate word | 68 | 3 |

    | immediate doubleword | 68 | 5 |


    Figure 6.1 push instructions'
  merge: -1
