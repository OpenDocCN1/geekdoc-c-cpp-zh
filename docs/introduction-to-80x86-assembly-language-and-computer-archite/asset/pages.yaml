  md: 'When a source string is involved, the source index register ESI contains the
    address of the string element. When a destination string is involved, the destination
    index register EDI contains the address of the string element. An index register
    is incremented or decremented after the string element is accessed, depending
    on whether the direction flag DF is reset to zero or to one; the `cld` and `std`
    instructions are used to give a desired value.


    Repeat prefixes rep (repz) and repne (repnz) are used with some string instructions
    to cause them to automatically repeat. The number of times to execute a primitive
    instruction is placed in the ECX register. The conditional repeat forms use the
    count in ECX but will also terminate instruction execution if the zero flag gets
    a certain value; these are appropriate for use with the `cmps` and `scas` instructions
    which set or reset ZF.


    The xlat instruction is used to translate the characters of a string. It requires
    a 256-byte-long translation table that starts with the destination byte to which
    the source byte 00 is translated and ends with the destination byte to which the
    source byte FF is translated. The xlat instruction can be used for such applications
    as changing ASCII to EBCDIC codes, or for changing the case of letters within
    a given character coding system.


    The cdtoa macro expands to code that calls a procedure dtoaproc. Basically this
    procedure works by repeatedly dividing a nonnegative number by 10, and using the
    remainder to get the rightmost character of the destination string.


    The 8086 microprocessors are classified as complex instruction set computers.
    The string instructions provide good illustrations of why they are CISC machines.'
