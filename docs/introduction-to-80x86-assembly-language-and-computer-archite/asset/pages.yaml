  md: "# 166 Branching and Looping\n\nSuch a while is readily coded in 80x86 assembly\
    \ language.\nan until loop is a posttest loop—the condition is checked after the\
    \ body of the loop is executed. In general, an until loop can be expressed as\
    \ follows in pseudocode.\n\n```\nrepeat\n.. { loop body }\nuntil termination condition;\n\
    ```\n\nThe body of the loop is executed at least once; then the termination condition\
    \ is checked. If it is false, then the body of the loop is executed again; if\
    \ true, execution-continues with the statement following the loop.\nan 80x86 implementation\
    \ of an until loop usually looks like the code fragment.\n\n```\nuntil:      \
    \    ; start of loop body\n                .\nendUntil:      ; code to check termination\
    \ condition\n```\n\nIf the code to check the termination condition determines\
    \ that the value is false, then there will be a jump to until. If it is determined\
    \ that the value is true, then the code will either fall through to endUntil or\
    \ there will be a jump to that label.\n\nOther loops can also be coded in assembly\
    \ language. The forever loop is frequently used. As it appears in pseudocode,\
    \ it almost always has an exit loop-statement to transfer control to the end of\
    \ the loop; this is often conditional, that is, in if statement.\nThis section\
