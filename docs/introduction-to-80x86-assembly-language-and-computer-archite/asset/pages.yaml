  md: 'on. C and C++ compilers normally allocate all local variables on the stack.
    There are severe difficulties with doing this in assembly language, not the least
    of which is remembering where a particular local variable is stored in the stack.


    The two new steps are obviously implemented by sub esp,n and mov esp,ebp, where
    n is the number of bytes of local storage you want to reserve. You may be wondering
    why "deallocation" step isn''t add esp,n. The answer is that it could be, but
    the mov instruction is both simpler and safer. It is safer because it will restore
    the correct value to esp even if the saved registers were not properly popped
    off the stack.


    A recursive procedure or function is one that calls itself, either directly or
    indirectly. It is the best algorithms for manipulating many data structures. It
    is frequently difficult to code certain algorithms in a programming language that
    does not support recursion.


    It is almost as easy to code a recursive procedure in 80x86 assembly language
    as it is to code a non-recursive procedure. If parameters are passed on the stack
    and local variables are stored on the stack, then each call of the procedure gets
    new allocated for its parameters and local variables. There is no danger of the
    arguments passed to one call of a procedure being confused with those for another
    call because each call has its own stack frame. If registers are properly saved
    and restored, then the same registers can be used by each call of the procedure.


    This section gives one example of a recursive procedure in 80x86 assembly language.
    It solves the Towers of Hanoi puzzle, pictured in Figure 6.15 with four disks.
    The object of the puzzle is to move all disks from source spindle A to destination
    spindle B, one at a time, never placing a larger disk on top of a smaller disk.
    Disks can be moved to spindle C, a spare spindle. For instance, if there are only
    two disks, the small disk can be


