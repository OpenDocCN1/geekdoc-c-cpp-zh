    can refer to the lower-order doubleword of RAX as EAX in a 32-bit environment.
    For the new registers R8-R15, you append a D to the lower-order doubleword. For
    example, R9D refers to the lower-32 bits of R9. Similarly, R11W refers to the
    lower-order word (16 bits) of R11, and R15B refers to the lower-order byte of
    R15.


    Recall that in 32-bit architecture, you can also access bits 8-16 of EAX, EBX,
    ECX, and EDX using names AH, BH, CH, and DH, respectively. These bytes cannot
    be accessed by name with 64-bit instructions.


    Index registers ESI and EDI are extended to 64-bit registers RDI and RDI, respectively.
    Low-order doublewords can be referenced as ESI and EDI, low-order words as SI
    and DI, and low-order bytes as SIL and D. ESP and EBP are extended to 64-bit registers
    RSP and RBP.


    Segment registers have not changed in the 64-bit architecture. Recall that they
    are essentially unused when the processor is operating in 64-bit mode.


    In the 64-bit environment, the instruction pointer is the 64-bit register RIP.
    The flags are stored in the 64-bit register RFLAGS. The low-order 32 bits correspond
    exactly to EFLAGS. Intel documentation says that the high-order 32-bits of RFLAGS
    are "reserved."


    Here is an example of an instruction that is legal in a 64-bit program, but not
    in a 32-bit program:


    ```

    add rax, r12

    ```


    This adds the quadword in R12 to the quadword in RAX, replacing the value in


    RAX.


    Figure 2.4 summarizes the basic program execution registers in the 64-bit architecture.
    It does not list floating point, MMX, and XMM registers, the other applications.


