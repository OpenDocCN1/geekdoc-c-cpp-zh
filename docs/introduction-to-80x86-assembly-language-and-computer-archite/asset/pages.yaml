  md: '10. This section showed how to take the 2''s complement of a number by subtracting
    it from an appropriate power of 2. An alternative method is to write the number
    in binary (using the correct bits for the length of the representation), change
    each 0 bit to 1 and each 1 bit to 0 (this is called ''taking the 1''s complement''),
    and then adding 1 to the result (discarding any carry into an extra bit). Show
    that these two methods are equivalent.


    # 1.4 Integer Addition and Subtraction


    One of the reasons that the 2''s complement representation scheme is commonly
    used to store integers in computers is addition and subtraction operations for
    signed integers are identical to the corresponding operations for unsigned integers.
    This means that the CPU does not need separate circuitry for signed and unsigned
    addition or subtraction operations. This section discusses addition and subtraction
    of integers, and introduces the concepts of carry and overflow, which can be used
    to determine if the results of an operation are ''correct''.


    We first give several examples of addition operations. The 80x86 architecture
    uses the same addition instructions for unsigned and signed numbers. Although
    32 bits (doubleword) is the preferred integer size in the 80x86 architecture,
    these examples use word-size numbers in the interest of brevity. The concepts
    illustrated are exactly as for byte-size, word-size, doubleword-size or quadword-size
    operands.


    First, 0AO7 and 01D3 are added. These numbers are positive whether interpreted
    as unsigned numbers or as 2''s complement numbers. The decimal version of the
    addition problem is given on the right.


    ```

    0AO7      2567

    +01D3    + 467

    OBDA      3034

    ```


    The answer is correct since BDA$_{16}$ = 3034$_{10}$


    Next, 0206 and FFB0 are added. These are of, positive as unsigned numbers, but
    interpreted as 2''s complement signed numbers, 0206 is a positive number and FFB0
    is negative. This means that there are two decimal versions of the addition problem.
    The signed one is given first, then the unsigned version.


    ```

    0206      518

    +FFB0    + (-80)  + 6546

    101B      438      65974

    ```'
