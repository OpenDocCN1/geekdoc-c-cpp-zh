    # 5.2 Conditional Jumps, Compare Instructions, and if Structures


    Conditional jump instructions make it possible to implement if structures, other
    selection structures, and loop structures in 80x86 machine language. There are
    many of these instructions. Each has the format


    ```

    j--targetStatement

    ```


    where the last part of the mnemonic (shown here by dashes) identifies the condition
    under which the jump is to be executed. If the condition holds, then the jump
    takes place; otherwise, the next instruction (the one following the conditional
    jump) is executed.


    With one exception (the jczx/jec instruction, covered in Section 5.4), the "conditions"
    considered by the conditional jump instructions are settings of various flags
    in the flag registers. For the example


    ```

    jz endWhile

    ```


    means to jump to the statement with label endWhile if the zero flag ZF is set
    to 1; otherwise, fall through to the next statement. (The mnemonic jz stands for
    "jump if zero.")


    Conditional jump instructions do not modify the flags; they only react to previously
    set flags. Recall how the flags in the flag register get values in the first place.
    Some instructions (like mov) leave unchanged, some (like add) explicitly set some
    flags according to the value of a result, and still others (like div) unpredictably
    alter some flags, leaving them with unknown values.


    Suppose, for example, that the value in the EAX register is added to a sum representing
    an account balance and three distinct treatments are needed, depending'
