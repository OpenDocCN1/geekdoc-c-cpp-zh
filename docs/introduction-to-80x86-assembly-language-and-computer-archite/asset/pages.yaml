    compute the actual address of the memory operand. Segments can be logically useful
    to a program—in the segmented Intel model, the programmer normally assigns different
    memory segments to code, data, and a system stack. The 80x86 flat memory model
    is really a 32-bit segmented model with all segment registers containing the same
