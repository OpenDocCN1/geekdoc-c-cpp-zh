  md: '# 344 Floating Point Operations


    | Mnemonic | Operand 1 (destination) | Operand 2 (source) | Action |

    | :--- | :--- | :--- | :--- |

    | movss | xmmreg or mem32 | xmmreg or mem32 | destination := source (at least
    one operand must be a register) |

    | addss | xmmreg | xmmreg or mem32 | destination := destination + source |

    | subss | xmmreg | xmmreg or mem32 | destination := destination - source |

    | mulss | xmmreg | xmmreg or mem32 | destination := destination * source |

    | divss | xmmreg | xmmreg or mem32 | destination := destination / source |

    | sqrtss | xmmreg | xmmreg or mem32 | destination := sqrt(source) |

    | rcpss | xmmreg | xmmreg or mem32 | destination := 1/source |

    | comiss | xmmreg | xmmreg or mem32 | compare operand1 and operand2; set flags
    |

    | movups | xmmreg or mem128 | xmmreg or mem128 | destination := source (at least
    one operand must be a register) |

    | addps | xmmreg | xmmreg or mem128 | destination := destination + source (four
    additions) |

    | subps | xmmreg | xmmreg or mem128 | destination := destination - source (four
    subtractions) |

    | muls | xmmreg | xmmreg or mem128 | destination := destination * source (four
    multiplications) |

    | divps | xmmreg | xmmreg or mem128 | destination := destination / source (four
    divisions) |


