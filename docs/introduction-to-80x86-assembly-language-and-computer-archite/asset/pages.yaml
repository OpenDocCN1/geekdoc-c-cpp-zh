    We now look at an example of a complete, if unexciting, program that uses these
    new instructions. The program starts with integer values for three numbers x,
    y, and z in memory doublewords, and evaluates the expression (x + y - 2z + 1),
    leaving the result in EAX. The design implemented is


    ```

    result := x;

    add y to result, giving x + y;

    temp := z;

    temp := temp + temp, to get 2*z;

    subtract temp from result, giving x + y - 2*z;

    add 1 to result, giving x + y - 2*z + 1;

    negate result, giving - (x + y - 2*z + 1);

    ```


    To write an assembly language program, you need to plan how registers and memory
    will be used. The problem specifies that the result will be in EAX, so the only
    decision is what to use for temp. Since the “next” general register EBX has no
    assigned use, it is a good choice.'
