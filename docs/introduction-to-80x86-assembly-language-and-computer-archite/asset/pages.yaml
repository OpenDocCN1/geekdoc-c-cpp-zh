    This section concludes by utilizing some of the floating point instructions in
    a complete example. Recall that for the quadratic equation


    ```

    ax^2 + bx + c = 0

    ```


    the quadratic formula gives two roots


    ```

    x = (-b±sqrt(b^2−4ac)) / 2a

    ```


    The following algorithm incorporates the quadratic formula to compute the roots,
    if they exist.


    ```

    disc := b*b - 4*a*c;

    if disc ≥ 0

    then

    x1 := (-b + sqrt(disc))/2*a;

    x2 := (-b - sqrt(disc))/2*a;

    end if;

    ```


    Figure 9.13 lists a console32 program that implements this algorithm. Each of
    the variables a, b, c, disc, x1, and x2 has storage reserved in memory. (The coefficients
    a, b, and c have been coded as aa, bb, and cc partly because they are more visible,
    but mostly because the 32-bit assembler treats c as a reserved word.) The screenshot
    in Figure 9.14 shows this program''s state just before the second root is stored
    and popped'
