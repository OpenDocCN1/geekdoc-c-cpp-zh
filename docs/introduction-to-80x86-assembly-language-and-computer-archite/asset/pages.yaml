    Suppose a program has *dbl* at address 000001C8 in the data section and contains
    the following instructions:


    ```

    add ebx, 1000

    sub ebx, 1000

    add dbl, 1000

    sub dbl, 1000

    add ebx, 10

    ```


    Then the assembly listing will contain


    ```

    81 C3 000003E8 add ebx, 1000

    81 EB 000003E8 sub ebx, 1000

    81 05 000001C8 R add dbl, 1000

    000003E8

    81 2D 000001C8 sub dbl, 1000

    000003E8

    83 C3 0A add ebx, 10

    ```


    Notice the difference between the first and last instructions. Each has the register-32
    immediate operand EBX. The assembler could use the 81 opcode for both and encode
    the immediate operand 10 as 0000000A. However, it chooses the 83 opcode for the
    last instruction in order to generate more compact code. The immediate value 0A
    will be extended to 0000000A when the instruction is executed.'
