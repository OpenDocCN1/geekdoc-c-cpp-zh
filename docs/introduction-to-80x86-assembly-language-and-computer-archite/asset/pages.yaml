- img_proc: true
  md: '# String Operations


    These instructions call procedure dtoaproc passing source and destination arguments
    on the stack. The actual source and destination are used in the expanded macro,
    not the macro parameters source and dest used in the model statements. The user
    does not need to worry about register contents being altered. EBX is initially
    saved on the stack and is restored at the end of the sequence. Other registers
    by dtoaproc are preserved by the procedure itself. There is still a problem if
    the macro call was dtoa dest, ebb a reasonably likely possibility. To avoid this
    problem, the original value in EBX is recovered from the stack before the source
    address is pushed on the stack. Notice that there is no protection for the less
    likely possibility of the macro call dtoa [ebx], source or some other addressing
    using EBX; in this case the macro will not work correctly. The macro could be
    bypassed, using a direct call to dtoaproc.


    The real work of 2''s complement integer to ASCII conversion is done by the procedure
    dtoaproc. The source code, from file io.asm, is shown in Figure 8.14. The procedure
    follows cdecl conventions. The caller preserves the flag register the direction
    flag will be cleared by the body, and the caller may be assuming the opposite
    value.


    The basic idea of the procedure is to build a string of characters right to left
    by repeatedly dividing the number by 10, using the remainder to determine the
    right character. For instance, dividing the number 2895 ($2895_{10}$) by 10 gives
    a remainder of 5 and a quotient of 289 ($289_{10}$), the last digit of the number,
    and a new number to repeat the process. This scheme works nicely for positive
    numbers, but a negative number must be changed to its absolute value before starting
    the division loop. To complicate things, the bit pattern $80000000_{16}$ represents
    the negative number -2,147,483,648$_{10}$, but +2,147,483,648 is represented in
    2''s complement form in doubleword.


    After the entry, the source value parameter is copied to EAX and the destination
    address to EDI. The procedure then checks for the special case 80000000$_{16}$.
    If this is the source, then the ASCII codes for -2147483648 are moved one at a
    time to the destination, using the fact that the destination address is in EDI.
    The location for the minus sign is in the EDI register, so register addressing
    can be used to put this character in the correct memory byte. The location for
    the character 2 is one byte beyond the address contained in EDI; this address
    is referenced by [edi+1]. The remaining nine characters are similarly put in place,
    and the procedure is executed.


    The general case of the procedure starts by putting 10 leading blanks in the 11-byte-length
    destination field. The procedure does this with a rep stos that uses EDI to point
    to successive bytes in the destination field. Note that EDI is left pointing at
    the last byte of the destination field.'
  merge: -1
  pgno: 309
