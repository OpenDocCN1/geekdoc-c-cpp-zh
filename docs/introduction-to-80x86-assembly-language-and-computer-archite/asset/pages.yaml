  md: "# 172 Branching and Looping\n\n+   * If the new value in ECX is nonzero, then\
    \ a jump to the instruction statementLabel takes places.\n\nAlthough the ECX register\
    \ is a general register, it has a special place as a counter in the loop instruction\
    \ and in several other 8086 instructions. No other register can be substituted\
    \ for ECX in these instructions. In practice this often means that when a loop\
    \ is coded, ECX is not used for other purposes. In 64-bit mode, the action is\
    \ exactly the same except that RCX is used instead of ECX.\n\nThe backward for\
    \ loop structure\n\n```\nfor count := 20 downto 1 loop\n  { loop body }\nend for;\n\
    ```\n\ncan be coded as follows in 8086 assembly language using the loop instruction.\n\
    \n```\nmov ecx, 20          ; number of iterations\nforCount:               ;\
    \ loop body\n  loop forCount      ; repeat body 20 times\n```\n\nThe counter in\
    \ the ECX register will be 20 the first time the loop body is executed and decremented\
    \ by 19 by the loop instruction. The value 19 is not zero, so control transfers\
    \ to the start of the loop body at label forCount. The second time the loop body\
    \ is executed, the ECX register will contain 19. The last time the loop body is\
    \ executed, the value in ECX will be 1. ECX will be decremented to zero by the\
    \ loop instruction, the jump to forCount will not be taken, and execution will\
    \ continue with the instruction following the loop instruction.\n\nThe obvious\
    \ label to mark the body of a for loop is for. Unfortunately this is a reserved\
    \ word for the assembler. It is used for a directive that simplifies coding of\
    \ for loops. Since our primary interest is in learning how the computer works\
    \ at the machine level this directive is not used.\n\nNow suppose that the doubleword\
    \ in memory referenced by number contains the number of times a loop body is to\
    \ be executed. The 8086 code to implement a backward for loop could be"
