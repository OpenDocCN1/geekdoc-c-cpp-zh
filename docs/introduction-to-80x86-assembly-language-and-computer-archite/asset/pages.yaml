    value to be converted and (2) the address of the destination string


    After customary procedure entry code, the destination address is copied to EDI
    and the value to be converted to ASCII is copied to ST. Most of the code is a
    straightforward implementation of the design. Once the value is adjusted to be
    at least 1.0 but less 10.0, truncating the value gives the digit that goes before
    the decimal point. This is done with the fst instruction, but it is necessary
    to copy the value first since the truncating integer store doesn''t come in a
    "non-pop" version. This single digit is easily converted to the corresponding
    ASCII code. After subtracting the integer value from the whole value and multiplying
    by 10.0, the process can be repeated to get the next digit. Notice that if the
    number being converted is 0.0, this process simply results in a string of 0 characters.


    ```

    div byteTen               ; convert exponent to 2 digits

    or ax, 3030h             ; convert both digits to ASCII

    mov BYTE PTR [edi], al ; store characters in destination

    mov BYTE PTR [edi]+1, ah

    ```


    Dividing by 10 puts the quotient (the high-order base-10 digit) in AL and the
    remainder (the low-order digit) in AH. These are simultaneously converted to ASCII
    by the or instruction, and then stored in the destination string. This technique
    will work whenever the number being converted is in AX and is 99 or less.


    9.20 shows the debugger''s display of this program right before it exits. The
    memory 1 window shows memory starting at the address of source. You can see the
    result string starting in the fifth byte.'
