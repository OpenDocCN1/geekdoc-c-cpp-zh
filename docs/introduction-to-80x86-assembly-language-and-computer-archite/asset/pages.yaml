    The code segment contains one PROC named _MainProc. The code framework we are
    using is actually a C program whose execution starts with function main. This
    framework is designed to always call _MainProc, so this must be the name of our
    assembly language procedure. Chapter 6 carefully examines procedure calls.


    The statement


    ```

    input prompt1, string, 40 ; read ASCII characters

    ```


    is a macro with three operands. It expands to instructions that call a procedure
    to display a Windows dialog box that looks like


    ![](img/0a28ab4c74434132c88d9a96aa74f8e4_85_0.png)


    The first operand specifies the label that appears in the dialog box for this
    program the string in memory referenced by prompt1. This serves to prompt the
    user for what is expected in the text box. The user should enter a number in the
    text box and then click OK. After OK is clicked, the ASCII codes for whatever
    has been entered in the text box are copied to the destination specified by the
    second operand here, string. The third operand must always be the length of the
    destination string--40 in this case because 40 bytes are reserved for string in
    the data segment. There is nothing special about the choice of 40 in this example
    other than the fact that it provides a longer string than you would expect a.
    In general, you want to be somewhat generous with the size of an input area--you
    might be expecting the user to enter 7, but the user might type several leading
    spaces before 7, or might type the numerically equivalent 000000000007.


    The next statement in _MainProc


    ```

    atod string ; convert to integer

    ```


    is a macro with a single operand. Its name stands for "ASCII to double" and it
    extends to instructions that call a procedure to scan memory starting at the location
    specified by the operand looking for the ASCII representation for a number. It
    converts the ASCII representation to the corresponding 2''s complement doubleword
    integer. This doubleword is always stored in EAX--no destination operand is allowed.'
