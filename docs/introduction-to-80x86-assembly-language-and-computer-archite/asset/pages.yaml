    # 8.4 Converting a 2''s Complement Integer to an ASCII String


    The dtoa macro has been used to convert 2''s complement integers to strings of
    ASCII characters for output. In this section we examine the code for dtoa and
    the dtoaproc procedure it calls. The dtoaproc uses only one instruction, but it
    provides a good example of string manipulation.


    The dtoa macro expands into the following sequence of instructions:


    ```

    push      ebx               ; save EBX

    lea       ebx, dest     ; destination address

    push      ebx               ; destination parameter

    mov       ebx, [esp+4] ; in case source was EBX

    mov       ebx, source  ; source value

    push      ebx               ; source parameter

    call      dtoaproc      ; call dtoaproc(source,dest)

    add       esp, 8          ; remove parameters

    op        ebx               ; restore EBX

    ```


    ![](img/0a28ab4c74434132c88d9a96aa74f8e4_308_0.png)'
