    The first operand EAX obviously is register mode, and the second operand is register
    indirect mode. Notice that there are only 2 bytes of object code, not enough to
    contain a 32-bit memory address. Instead, the second byte contains bits that say
    to use the address in the EDX register to locate the second doubleword operand.
    In other words, the second number is not in EDX, but its bracket notation ([ |])
    indicates indirect addressing in assembly language. Figure 3.9 illustrates how
    register indirect addressing works in this example.'
