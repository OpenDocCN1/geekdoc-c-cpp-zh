    The load instruction **lods** is the final string instruction. This instruction
    copies a source string element to the accumulator. A **lods** instruction sets
    no flag. It is possible to use a **rep** prefix with **lods** but it is not helpful—all
    values except for the last element would be replaced as successive values were
