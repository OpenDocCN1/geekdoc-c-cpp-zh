  md: "```\n; compute roots of quadratic equation\n; author: R. Detmer\n; date: 7/2008\n\
    \n.DATA\nfour REAL4 4.0\ntwo REAL4 2.0\nzero REAL4 0.0\n\n.CODE\n; void roots(float\
    \ a, float b, float c, float* x1, float* x2)\nroots\n  PROC\n      movss xmm3,\
    \ xmm1 ; copy b\n      mulss xmm3, xmm3 ; b*b\n      movss xmm4, four ; 4.0\n\
    \      movss xmm4, xmm0 ; 4*a\n      mulss xmm4, xmm2 ; 4*a*c\n      subss xmm3,\
    \ xmm4 ; b*b-4*a*c >= 0?\n      comiss xmm3, zero ; b*b-4*a*c >= 0?\n      jnae\
    \ endGE ; skip if not\n      sqrtss xmm3, xmm3 ; sqrt(b*b-4*a*c)\n      movss\
    \ xmm4, zero ; 0\n      subss xmm4, xmm1 ; -b\n      addss xmm4, xmm3 ; -b + sqrt(b*b-4*a*c)/a\n\
    \      divss xmm4, xmm0 ; (-b + sqrt(b*b-4*a*c))/(a\n      divss xmm4, two ; (-b\
    \ + sqrt(b*b-4*a*c))/(2*a)\n      movss REAL4 PTR[r9], xmm4 ; store root1\n  \
    \    movss xmm4, zero ; 0\n      subss xmm4, xmm1 ; -b\n      subss xmm4, xmm3\
    \ ; -b - sqrt(b*b-4*a*c)\n      divss xmm4, xmm0 ; (-b - sqrt(b*b-4*a*c))/a\n\
    \      divss xmm4, two ; (-b - sqrt(b*b-4*a*c))/(2*a)\n      mov r9, [rsp+40]\
    \ ; addr of root2\n      movss REAL4 PTR [r9], xmm4 ; store root2\n\nendGE:\n\
    \  ret\nroots\n  ENDP\nEND\n```\n\nFigure 9.30 Quadratic equation-solving procedure\
    \ (64-bit version)"
