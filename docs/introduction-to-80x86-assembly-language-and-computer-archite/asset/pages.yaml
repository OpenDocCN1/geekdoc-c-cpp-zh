    assigns value false to bits 1 and 5, leaving the other values unchanged. (Recall
    that bits are numbered from right to left, starting with zero for the rightmost
    bit.)


    If the byte in memory at flags is being used to store eight Boolean values, then
    an instruction can assign true values to any selected bits. For instance, the
    instruction


    ```

    or flags, 00001100b ; flag3 := true; flag2 := true

    ```


    assigns true values to bits 2 and 3 without changing the other bits.

    If the byte in memory at flags is being used to store eight Boolean values, then
    an xor instruction can negate selected values. For instance, the design statement


    ```

    flag6 := NOT flag6;

    ```


    can be implemented


    ```

    xor flags, 01000000b ; flag6 := not flag6

    ```


    A third application of logical instructions is to perform arithmetic operations.
    Suppose that the EAX register is interpreted as an unsigned integer. The expression
    (value mod 32) could be computed using the following sequence of instructions.


    ```

    mov edx,0 ; extend value to quadword

    mov ebx,32 ; divisor

    div ebx ; divide value by 32

    ```


    Following these instructions, the remainder (value mod 32) will be in the EDX
    register. The following alternative sequence leaves the same result in the EDX
    register without, however, putting the quotient in EAX.


    ```

    mov edx,eax ; copy value to DX

    and edx,0000001fh ; compute value mod 32

    ```


    This choice is more efficient than the first. It works because the value in EDX
    is a binary number, as a sum it is


    ```

    bit31*2³¹ + bit30*2⁰ + ... + bit2*2² + bit1*2¹ + bit0

    ```'
