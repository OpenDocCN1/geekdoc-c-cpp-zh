- img_proc: true
  md: '# 78 Elements of Assembly Language


    produces a word-length 2''s complement in AX. Each has a single operand referencing
    an address in the data segment at which to start scanning. The scan process skips
    spaces. After spaces, if any, there is a plus (+) or minus (-) character. Following
    the sign, if any, there must be ASCII 30 to 39; that is, characters ''0'' through
    ''9''. The value that corresponds to the aggregate of the digits is computed,
    negated if there is a minus sign, and returned in EAX or AX.


    The atod or atow macro code stops scanning memory when it comes to a nondigit
    (except for leading spaces and sign, of course). This often is a null byte. In
    the event that there is no digit, 0 is returned. In the event that there are many
    digits so that the resulting number is too for the destination register, the return
    value is undefined, there is no way to detect this other than unexpected results.


    The dtoa ("double to ASCII") and wtoa ("word to ASCII") perform conversions from
    2''s complement to ASCII representations. They are very similar except dtoa starts
    with a double source and produces an 11-byte-long string, while wtoa starts with
    a word source and produces a 6-byte-long string. In both cases, the operand specifies
    the source; it can be in a register or memory. The first operand specifies the
    destination address in memory. The dtoa macro always produces 11 ASCII codes,
    so the destination area will be 11 bytes long. Similarly, the wtoa macro always
    produces six ASCII codes, so the destination area will be 6 bytes long.


    Let''s look at an example. If EBX contains the 2''s complement number FFF9C3,
    the corresponding decimal value is -13869, with the statement


    ```

    dtoa dest, ebx

    ```


    will produce ASCII 20 20 20 20 20 2D 31 33 36 38 39 starting at dest. Similarly,
    if EBX contains 000000F4, the corresponding decimal value is 244 and the dtoa
    macro will produce 20 20 20 20 20 20 20 32 34 34, padding with leading spaces.
    Notice that no trailing null byte is generated—f—often a destination area in the
    data segment will have a trailing extra null byte defined, for instance


    ```

    dest 11 DUP(0),

    ```


    Sometimes the 11-byte destination area is much longer than necessary for the size
    of the source number. This is particularly true for doubleword values. The extra
    bytes are always left on the left with 20 (space) codes. Why is the dtoa macro
    written to always generate 11 ASCII codes? The answer is to keep it simple. In
    decimal the range of integers that can be stored in 2''s complement form in a
    word is -4,294,967,296 to 4,294,967,295, so for a negative number 11 bytes are
    actually needed, but more. Exercise 3.6.1 asks you to explain why 6 bytes are
    used for wtoa.'
