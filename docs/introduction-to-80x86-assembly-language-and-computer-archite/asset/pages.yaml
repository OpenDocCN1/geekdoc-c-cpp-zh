  md: '# 9.4. Single-Instruction Multiple-Data Instructions


    Single-instruction multiple-data (SIMD) instructions operate on several operands
    at once with a single instruction. The 8086 family has had some form of SIMD instructions
    since the Pentium II, starting with MMX technology and continuing through several
    generations of streaming SIMD instructions (SSE). All current 8086 CPUs include
    these features.


    MMX technology added 64-bit register designations; MMX0 through MM8 These were
    not independent registers—they were physically the same as the registers in the
    floating point card, basically ignoring the high-order 16 bits of each floating
    point register. The contents of a single MMX register can be viewed as byte-size
    integers, word-size integers, double-size integers, or one quadword integer. The
    MMX instruction set includes instructions to pack multiple values into an MMX
    register (pinsrw, for example), or to unpack the parts. These others can simultaneously
    operate on all the components in two operands. For example, after four words are
    loaded into MM0 and MM1, the single instruction adds paddw, mm simultaneously
    adds the four pairs of integers, putting the sums in MM0. MMX technology is not
    further covered in this book.


    SSE first appeared in the Pentium III processor. Its features include eight 128-bit
    registers, XMM0 through XMM7. These are not aliased to any floating point or other
    registers—they are actually new. The 64-bit architecture added eight more XMM
    registers, XMM8 through XMM15. In the original SSE architecture, a single 128-bit
    register could hold four 32-bit floating point numbers, and a typical SSE instruction
    would simultaneously operate on four pairs of floating point numbers. Later SSE
    added other ways of viewing a single XMM register as multiple components, but
    these are not covered in this book.


    Figure 9.2 lists selected instructions. Most of these come in "scalar" (ss) and
    "packed" (ps) versions. The packed versions operate simultaneously on four pairs
    of floating point operands. The scalar versions operate only on the low-order
    operand, ignoring the other three. The scalar instructions are often used in 64-bit
    programming for floating point operations instead of using the floating point
    unit, which is the reason for including SSE in this book


    Programming floating point operations with general registers in the 32-bit or
    64-bit mode. Figure 9.23 shows a console6 program to compute $b^2-4ac$, given
    single-precision floating point values for $a, b,$ and $c$ in memory. The result
    is stored in memory at disc.


    Figure 9.24 is a screenshot showing the program halted before exiting. The XMM
    registers are displayed by right-clicking in the Registers display window and
    then'
