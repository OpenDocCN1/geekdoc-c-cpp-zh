  md: '# 3.3 Data Declarations


    This section explains the formats of operands used in BYTE, WORD, DWORD, and QWORD
    directives. Most of the information below applies to constant operands in instructions
    since simple constants are written the same way in directives and instructions.


    Numeric operands can be expressed in decimal, hexadecimal, binary, or octal notations.
    The assembler assumes that a number is decimal unless the number has a suffix
    indicating another base or a .RADIX directive (not used in this book) changes
    the default base. The suffixes that may be used


    | Suffix | Number | Number System |

    |---|---|---|

    | H | 16 | hexadecimal |

    | B | 2 | binary |

    | O or Q | 8 | octal |

    | none | 10 | decimal |


    Any of these suffixes can be coded in uppercase or lowercase. The letter Q is
    easier to read than O on the rare occasions when you might need to code a constant
    in octal.


    A hexadecimal value must start with a digit. You must, for example, code 0a8h
    instead of a8h to get a constant with value A₁₆. The assembler will interpret
    a8h as a name.


    Now for some examples: The directive


    ```

    byte0 BYTE 01111101b

    ```


    reserves one byte of memory and initializes it to 7D. This is equivalent to any
    of the following directives


    ```

    byte0 BYTE 7dh

    byte0 BYTE 125

    byte0 BYTE 175q

    byte0 BYTE ''{ ''

    ```


    since 1111101₂ = 7D₁₆ = 125₁₀ = 75₈ and 7D₁₆ is the ASCII code for a left brace.
    The choice of number systems should depend on the use planned for the constant.
    A binary value is appropriate when you need to think of the value as a sequence
    of eight separate bits, as in one of the logical operations covered in Chapter
    7. A character in apostrophes is appropriate if you are using the value as a character.'
