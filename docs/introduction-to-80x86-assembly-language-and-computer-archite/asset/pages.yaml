  md: '# PREFACE


    The first edition of Introduction to 80x86 Assembly Language and Computer Architecture
    emphasized computer architecture over assembly language. In the years since it
    was published, assembly language use has declined but the need for a computer
    scientist to understand how the computer works "on the inside" has not. This second
    edition emphasizes basic 80x86 architecture even more than the first. I remain
    convinced that learning a real instruction set and writing assembly programs for
    a real computer are excellent ways to become acquainted with the basics of computer
    architecture.


    # New to the Second Edition


    There are major changes in this edition. For many people the most significant
    will be the use of the Microsoft® Visual Studio® environment instead of stand-alone
    software. Visual Studio is widely used in academic and professional settings,
    and provides a robust environment for editing, debugging, and executing programs.
    The Microsoft® Alliance (http://msdn.microsoft.com/en-us/academic/default.aspx)
    makes Visual Studio and other development software available to academic institutions
    at very low cost. All programs presented in this book have been tested using Visual
    Studio® 2008, Professional Edition.


    The 80x86 microprocessor has expanded considerably in the past few years. This
    book continues to emphasize basic architecture; that is, features that are found
    on most CPUs, not just the 80x86 line. Since 64-bit processors now commonly power
    new PCs, this book includes 64-bit architecture—although at the time of its writing
    64-bit operating systems are not widely used. Much of the time 64-bit instructions
    are just "more of the same," but there are a few major differences. This book''s
    topics are arranged so that 64-bit operations can be covered or omitted at the
    instructor''s discretion. It is impossible in a textbook to provide full coverage
    of all 80x86 instructions.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Intel® provides comprehensive documentation on their website (http://www.intel.com/products/processor/manuals/).


    This edition has decreased emphasis on input/output, with corresponding increased
    emphasis on using the debugger to see what is going on the computer. Macros for
    I/O, macros for converting from an ASCII string to a 2''s complement integer,
    and macros for converting from a 2''s complement integer to an ASCII string are
    included. The macros for I/O now use dialog boxes and message boxes instead of
    console I/O. Additionally, all program examples in this text are provided for
    students on the book''s website at http://www.jbpub.com/catalog/9780763722239.


    Chapter 6, "Procedures," has been changed to focus on the cdecl protocol. Using
    a standard protocol makes it possible to cover assembly language procedures from
    a high-level language or an HLL procedure from assembly language. The very 64-bit
    procedure protocol is also covered.


    Chapter 9, "Floating Point Operations," has major updates. Since all current 8086
    CPUs have floating point units, it no longer discusses how to code floating point
    operations without an FPU. It covers SSE instructions because these are normally
    used instead of the FPU for FP operations in 64-bit mode. It omits inline assembly
    but includes calling assembly language procedures from a high-level language.


    The chapter on binary coded decimal (BCD) has been omitted from this edition,
    although BCD representations are still covered lightly in Chapter 1, "Representing
    Data in a Computer." Chapter 8, "String Operations," has been retained because
    these instructions provide a striking example of the complex instruction set of
    the 8086.


    The first edition listed the number of clock cycles required for each instruction
    on different 8086 CPUs. With pipelined CPUs this information is almost irrelevant,
    and thus has been omitted. The previous chapter-ending "something extra" sections
    have been eliminated, but much of their content has been incorporated in appropriate
    places within the chapters.


    # Instructor and Student Resources


    I always remind my students that they don''t receive answers to exercises in an
    exam or in real life and need to develop confidence in their own answers. However,
    at the request of a few instructors and many students, I have included answers
    to exercises in Appendix C. These exercises are marked with an asterisk (*) within
    the chapters.'
