    separators will work by itself, but we followed the "MS-DOS" convention for separating
    text lines.


    Although the input macro can be used to input any string, commonly we use it to
    input a string that is the ASCII representation of an integer. To use this number
    for arithmetic, it is necessary to convert it to "internal" form. This is the
    job done by the atod ("ASCII to double") or atow ("ASCII to word") macro. They
    work the same way except that atod produces a doubleword-length 2''s complement
    number in EAX, while at'
  merge: -1
