  md: '# 80x86 Floating Point Architecture 305


    +   * ST(3), ST(4), ST(5), ST(6); and

    * ST(7), the register at the bottom of the stack.


    In addition to the eight registers, the floating point unit has several 16-bit
    control registers, one of which is the status word. Some of the status bits are
    assigned values by floating point comparisons, and these bits must be examined
    in order for the 80x86 to execute conditional jump instructions based on floating
    point comparison.


    Before considering the floating point instructions, a few notes are in order.
    Each floating point mnemonic starts with the letter F, a letter that is not used
    as the first character of any non-floating instruction. Most floating point instructions
    act on the stack top, ST and one other operand in floating point register, or
    in memory. No floating point instruction can transfer data between an 80x86 general
    register (such as EAX) and a floating point register—transfers must be made using
    a memory location for intermediate storage. (There is, however, an instruction
    to transfer the status word to AX).


    The floating point instructions are examined in groups, starting with instructions
    to perform operands on the stack. Figure 9.2 lists these mnemonics. This book
    does not include opcodes of bytes of object code for floating point instructions.
    Most of the instructions have 1- or 2-byte opcodes, and no additional bytes of
    object code unless there is a memory operand.


    | Mnemonic | Operand | Action |

    |---|---|---|

    | fld | memory (real) | real value from memory pushed onto stack |

    | fld | memory (integer) | integer value from memory converted to floating point
    and pushed onto stack |

    | fld | st(num) | contents of floating point register pushed onto stack |

    | fld1 | (none) | 1.0 pushed onto stack |

    | fld2 | (none) | 0.0 pushed onto stack |

    | fdpi | (none) | π (pi) pushed onto stack |

    | fld1e | (none) | log₂(e) pushed onto stack |

    | fld12t | (none) | log₁₀(10) pushed onto stack |

    | fld1q2 | (none) | log₁₀(2) pushed onto stack |

    | fldln2 | (none) | log₂(2) pushed onto stack |


