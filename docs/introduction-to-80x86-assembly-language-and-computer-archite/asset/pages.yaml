  md: 'In the previous examples with “incorrect” signed interpretations, overflow
    occurred. Computer hardware can detect overflow as it performs addition, and the
    signed sum will be correct if there is no overflow. The computer actually performs
    addition in binary, of course, and the process is logically a right-to-left pairwise
    addition of bits, very similar to the procedure that humans use for decimal addition.
    As the computer adds a pair of bits, sometimes there is a carry of (1) into the
    next column to the left. This carry is added to the sum of these 2 bits, and so
    on. The column of particular interest is the leftmost one; the sign position.
    There may be a carry into this position and/or a carry out of this position into
    the “extra” (into the extra bit) is what was called just “carry” earlier and was
    seen as the hex 1. Figure 1.4 identifies when overflow does or not occur. The
    table can be summarized by saying that overflow occurs when the number of carries
    into the sign position is different from the number of carries out of the sign
    position.


    Each of the previous addition examples is now shown again, this time in binary.
    Carries are written above the two numbers.


    ```

    111

    0000 0110 0000 0111      0A07

    + 0000 0001 1101 0011      + 01D3

    0000 1011 1101 1010      0BDA

    ```


    This example has no carry into the sign position (bit 15) and no carry out, so
    there is no overflow. The carries into bits 1, 2, and 3 have no significance with
    respect to overflow.


    ```

    1111 11

    0000 0010 0000 0110      0206

    + 1111 1111 1011 0000      + FFB0

    1 0000 0001 0111 0110      101B6

    ```


    | Carry into sign bit? | Carry out of sign bit? | Overflow |

    |---|---|---|

    | no | no | no |

    | no | yes | yes |

    | yes | no | yes |

    | yes | yes | no |


    Figure 1.4 Overflow in addition'
