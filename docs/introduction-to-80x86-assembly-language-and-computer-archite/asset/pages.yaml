    The 80x86 microprocessor has add and sub instructions to perform addition and
    subtraction using byte-, word-, doubleword-, or quadword-length operands. The
    operands can be interpreted as unsigned numbers or 2''s complement signed numbers.
    The 80x86 architecture also has inc and dec instructions to increment (add 1)
    to and decrement (subtract 1 from) a single operand, and a neg instruction that
    negates the 2''s complement of a single operand.


    One difference between the instructions covered in this section and the mov and
    xchg instructions of Section 4.1 is add, sub, inc, dec, and neg all update flags
    in flags register. The SF, ZF, OF, PF, and AF flags are set according to the value
    of the result of the operation. For example, if the result is negative, then the
    sign flag SF will be set to one; if the result is zero, then the zero flag ZF
    will be set to one. The carry flag CF is also given a value by each of these instructions
    except inc and dec. Each add instruction has this form


    ```

    add destination, source

    ```


    When executed, the integer at source is added to the integer at destination and
    the sum replaces the original value at destination. Each sub instruction has the
    form


    ```

    sub destination, source

    ```'
  merge: -1
