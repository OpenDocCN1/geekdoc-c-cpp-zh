    # 4.3 Multiplication Instructions


    The 80x86 architecture has two multiplication instruction mnemonics. Any mul instruction
    treats its operands as signed numbers; the sign of it is determined by the usual
    rules for multiplying numbers. A mul instruction treats its operands as unsigned
    binary numbers; the product is also unsigned.'
