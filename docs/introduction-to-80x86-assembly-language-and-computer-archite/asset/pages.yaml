  md: '# 202 Procedures


    The return instruction ret is used to transfer control from a procedure body back
    to the calling point. Its basic operation is simple; it simply pops the address
    previously stored on the stack and loads it into the instruction pointer EIP.
    Since the stack contains the address of the instruction following the call, execution
    will continue at that point. A near return has just to restore EIP. A far return
    instruction reverses the steps of a far call, restoring EIP and CS; both of these
    values are popped from the stack. The ret instruction changes any flag.


    There are two formats for the ret instruction. The more common form has no operand,
    and is simply coded


    ```

    ret

    ```


    The other version has a single operand, and is coded


    ```

    ret count

    ```


    The operand count is added to the contents of ESP after completion of the other
    steps of the return process (popping EIP and, for a far procedure, CS). This can
    be useful if other values (parameters in particular) have been saved on the stack
    for the procedure call; this is not used with the cdeclf protocol, however. Figure
    6.9 lists the various formats of ret instructions.


    Using a high-level language, a procedure definition often includes parameters
    (sometimes called formal parameters) that are associated with arguments (also
    called actual parameters) when the procedure is called. For the procedure''s pass-by-value
    (in) parameters, values of the arguments (which may be expressions) are copied
    to the parameters when the procedure is called, and these values are then referenced
    in the procedure using their local names (the identifiers used to define the parameters).
    Reference (pass-by-location or in-out) parameters associate a parameter identifier
    with an argument that is a single variable, and can be used to pass a value either
    to the proce


    | Type | Operand | Opcode | Bytes of Object Code |

    |---|---|---|--|

    | near | none | C3 | 1 |

    | near | immediate | C2 | 3 |

    | far | none | CB | 1 |

    | far | immediate | CA | 3 |


    Figure 6.9 ret instructions'
