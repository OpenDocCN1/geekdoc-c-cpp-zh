  md: '# 2.3 PC Hardware: Input/Output Devices


    A CPU and memory make a computer, but without input devices to get data or output
    devices to display or write data the computer is not usable for many purposes.
    Typical I/O devices include a keyboard and a mouse for input, a monitor to display
    output, and a disk drive for data and program storage.


    An assembly language programmer has multiple ways to look at I/O devices. At the
    lowest level, each device uses a collection of addresses or ports in the I/O address
    space. There are 64-KB port addresses in the 8086 architecture, and a typical
    I/O device uses three to eight ports. These addresses are distinct from ordinary
    memory addresses. The programmer uses instructions that output data or commands
    to these ports, or input data or status from them. Such programming is very tedious
    and the resultprograms are difficult to reuse with different computer systems.


    Instead of using separate port addresses, a computer system can be designed to
    use addresses in the regular memory address space for I/O device access. Such
    a design is said to use memory-mapped input/output Although it is possible with
    the 8086, it is not used with most PCs.


    Many operating systems, including Windows XP and Vista, put the CPU in a protected
    mode that does not allow ordinary application programs to directly access I/O
    ports. They provide a variety of input and output procedures that are much easier
    to use than is port-level I/O.


    # Exercises 2.3


    It was stated in this section that there are 64-KB port addresses.


    +   1. How many addresses is this (in decimal)?

    2. Assuming that the first address is 0, what is the last address?

    3. Express the range of port addresses in hex.


    # 2.4 PC Software


    Without software, computer hardware is virtually useless. Software refers to the
    programs or procedures that are executed by the hardware. This section discusses
    different types of software.'
  merge: -1
