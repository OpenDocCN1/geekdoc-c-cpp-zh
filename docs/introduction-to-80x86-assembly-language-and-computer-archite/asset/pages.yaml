    The shift instructions are quite primitive, but they have many applications. One
    of these is to do certain multiplication and division operations in fact, for
    processors without multiplication instructions, shift instructions are a crucial
    part of routines to perform multiplication. Even with the x86 architecture, some
    products may be computed more rapidly with shift operations than multiplication
    instructions


    In a multiplication operation where the multiplier is 2, a single-bit left shift
    of the multiplicand results in the product in the original location. The product
    will be correct unless the overflow flag OF is set. It is easy to see why this
    works for unsigned numbers shifting each bit to the left one position makes the
    coefficient of the next power of 2 in the binary representation of the number.
    A single-bit left shift also correctly doubles a signed operand. In fact, one
    can use multiplication by 2 on a hex calculator to find the result of a single-bit
    left shift.'
