    The program shown in Figure 8.9 inputs a string and a character and uses repne
    scas to locate the position of the first occurrence of the character in the string.
    It then displays the part of the string from the character to the end. The length
    of the string is calculated using the strlen procedure that previously appeared
    in Figure 8.7; this time, we assume that strlen is assembled in a separate file.
    The lea instruction is used to load the offset of the string to search and cld
    ensures a forward search


    After the search, the destination index EDI will be one greater desired since
    a string instruction always increments index registers regardless of whether flags
    were set. If the search succeeded, EDI will contain the address of the character
    following the one that matched with AL, or the address of the character after
    the end of the string if ECX was decremented to zero. The dec edi instruction
    takes care of both cases, backing up to the position of the matching string if
    there were one, or to the null byte at the end of the string otherwise. The string
    length was incremented so the null character would be included in the search.
    The output macro displays the last portion of the string, whose address is in
    EDI.


    The string instruction stos copies a byte, a word, or a doubleword from the accumulator
    to an element of a destination string. A stos instruction affects no flag, so
    only the rep prefix is appropriate for use with it. When repeated with rep, it
    copies the same value into positions of a string. For example, the following code
    will store in the first 30 bytes of string. Information about the stos instructions
    is in Figure 8.10.


    ```

    mov  ecx, 30          ; 30 bytes

    mov  al, '' ''         ; character to store

    lea edi, string      ; address of string

    cld                 ; forward direction

    rep stosb            ; store spaces

    ```'
