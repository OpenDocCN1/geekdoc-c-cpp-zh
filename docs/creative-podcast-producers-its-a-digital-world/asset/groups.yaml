    # 第4章

    在办公室


    播客制作人可以在不同类型的地点和环境下工作。通常情况下，制作人可以在世界上他们想任何地方工作。他们只需要拥有强大的网络连接以及适当的软件和设备。


    许多播客制作人在自己家里工作。其中一些是创业者，负责自己播客的编写、编辑、主持和营销。他们决定想聊的话题并准备自己的内容。没有人告诉他们该做什么或什么时候做。


    ## 数字碎片


    播客听众平均每周收听五个不同的节目。受欢迎的播客类型是喜剧。教育和新闻是次受欢迎的类型。


    其他播客制作人为公司或组织工作。这些制作人创建与公司产品或服务相关的播客。旅游公司可以使用播客讨论观光想法。


    ![](img/a516e536f3fe63e421585585d441f3a8_16_0.png)


    2017年，69%的每月播客听众在手机或平板电脑上收听播客。只有31%在电脑上收听。


    自由职业是播客制作人的另一种工作方式。他们不是为一家公司全职工作，而是按项目逐一完成。自由职业者与雇佣他们制作播客的人员合作。


    # 第6章

    播客的历史


    **无论现在的播客制作人在哪里工作，这份职业只存在了大约15年。** 世界维网网（万维网）于1989年发明。在几年之后，无线广播制作人开始在网络上直播他们的节目。


    1995年，MP3格式被发布。这是一种压缩数字音频的方法，使其占用更少的计算机内存。它使得存储更多数字音频文件成为可能。要创建一个数字（或MP3）文件，计算机将声音转换为数字流。当播放MP3时，计算机将这些数字转换回声音。**博主**和无线电广播员开始在他们的网站上添加MP3文件。听众可以**下载**MP3文件并在电脑上收听。


    第一批数字音频播放器于1998年问。MP3文件可以从电脑传输到数字音频播放器上。这使得人们可以在不受电脑限制的情况下听MP3文件。这些早期的MP3播放器价格昂贵，存储的内容也不多。


    2002年流行的MP3播放器包括（从左到右）SONICblue的Rio Riot、Apple的 iPod以及Creative Labs的Nomad Jukebox
    3。随着时间的推移，技术得到了改进。MP3播放器变得越来越便宜。它们也有更大的内存。


    很快，很多人开始购买MP3播放器。最流行的品牌之一是Apple iPod。MP3播放器主要用于听音乐。但人们开始思考使用MP3文件分享其他类型内容的方法。


    RSS源的发展为新类型的音频共享铺平了道路。RSS是1999年发布的文件格式。RSS使用关键词（或标签）从网站上收集特定主题的内容。然后它将这些内容整合到一个列表中，称为“馈源（feed）”。对该主题感兴趣的人可以订阅该馈源。当网站发布新内容时，新项目会被添加到馈源中。


    2000年，软件开发者Dave Winer在RSS中增加了一个新元素：在RSS馈源中包含MP3音频文件链接的能力。这使用了一种名为“附件”（enclosure）的新类型RSS标签。附件允许RSS馈源链接到音频和视频文件。


    2003年，记者兼电视节目主持人Christopher Lydon制作了一个音频博客，其中包含了对著名科学家和政治家的采访录。Winer利用RSS创建了一个Lydon采访的馈源，听众可以订阅。随着新采访的加入，馈源会更新。尽管当时“podcast”一词还没有被使用，但Lydon的音频博客确实就是如此。它是第一个播客。


    ## 数字碎片


    “podcast”一词是“iPod”和“broadcast（广播）”两个词的结合。记者Ben Hammersley在2004年版的《卫卫报》杂志中首次使用了这个词。


    ![](img/a516e536f3fe63e421585585d441f3a8_20.png)


    Ben Hammersley在2004年版的《卫卫报》杂志中首次使用了这个词。


    # 第6章

    获得流行


    播客多益于Apple而变得流行。2005年，Apple发布了一个包含播客版本的iTunes。这让人们能够更容易找到它们。


    “podcast”一词是“iPod”和“broadcast（广播）”两个词的结合。记者Ben Hammersley在2004年版的《卫卫报》杂志中首次使用了这个词。


    ![](img/a516e536f3fe63e421585585d441f3a8_22.png)


    许多播客多由于Apple而变得流行。2005年，Apple发布了一个包含播客版本的iTunes。这让人们能够更容易找到它们。


    “podcast”一词是“iPod”和“broadcast（广播）”两个词的结合。记者Ben Hammersley在2004年版的《卫卫报》杂志中首次使用了这个词。


    ![](img/a516e536f3fe63e421585585d441f3a8_24.png)


    许多播客多由于Apple而变得流行。2005年，Apple发布了一个包含播客版本的iTunes。这让人们能够更容易找到它们。


    # 第7章

    赚钱


    **对于许多播客制作人来说，成功意味着赚钱。** 播客制作人赚钱的一种方式是收费。然而，这种方法需要非常大的观众群才能盈利。


    播客制作人还可以通过与拥有商店的公司合作赚钱。播客制作人可以加入这些公司的联盟计划。例如，许多播客参与亚马逊计划。


    ## 数字碎片


    播客赞助商可以付费在播客的开头、中间或结尾提到。这些被称为前插（pre-roll）、中插（mid-roll）和后插（post-roll）。中插广告通常比前插或后插更长、更贵。


    亚马逊给每个播客制作人一个特殊的代码或网站链接让他们传给听众。然后，在播客期间，主持人推荐亚马逊销售的产品。


    许多播客在Patreon上开了账户。这是一个播客听众或其他粉丝支持人们业务的网站。当有人使用播客的代码从商店购物时，播客将获得销售金额的一部分。


    '
