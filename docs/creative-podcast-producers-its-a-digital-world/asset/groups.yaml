    # PODCASTS FOR EVERYONE


    Have you ever been on a road trip or a long flight?


    Riding in a car or plane for hours can be really boring. Listening to podcasts
    is a great way to pass the time. Podcasts are digital audio files you can download
    or stream live. You can listen to them on a digital media player or smartphone.
    Most podcasts are similar to radio shows. They feature people talking about different
    subjects or telling stories.


    Podcast producers are the people who make podcasts. They record audio, edit it,
    and then post it on the internet. There are podcasts on just about any topic you
    can think of. Some, such as Tumble, talk about cool science discoveries. Others,
    such as Dream Big, share celebrity interviews and urge kids to follow their dreams.
    Most podcasts have multiple episodes. Podcast producers work hard to make each
    episode interesting and entertaining.


    # CHAPTER 1

    # PODCAST PREPARATION


    **Podcast producers record and edit podcasts to be posted on the internet.** Podcast
    producers have a strong interest in the themes of their podcasts. They may even
    be experts on the topics. Podcasts are a way to share their passion and excitement
    with others.


    Podcast listeners can find information about topics that interest them. For example,
    there aren’t many radio shows just about math. But people who love math can listen
    to the podcast *Math Mutation*. Its episodes are full of fun and weird math facts.


    Most podcast producers have many different skills. Producers need to be well organized.
    They do a lot of different tasks and need to manage their time well. They need
    to have strong communication skills and pay attention to detail. They should also
    be good at solving problems and meeting due dates.


    Podcast producers do not need to have college degrees. In fact, they do not need
    any special training at all. Anyone


    ![](img/a516e536f3fe63e421585585d441f3a8_10_0.png)


    Apple allows podcast producers to track when listeners start stop. Most podcasts
    are similar to radio shows. They feature people talking about different subjects
    or telling stories.


    One of the best tools is is.... to audio,,.........., podcast producers to to
    to...... to to to the.. In cases, podcast producers must keep up with new technologies.


    # CHAPTER 2

    # DOING MANY JOBS


    **Anyone can start a podcast if they have the right tools and equipment.** Even
    kids can do it! Many schools encourage students to prepare podcasts for school
    projects.


    Most new computers come with the basic software and equipment needed to produce
    a podcast. Computers have built-in microphones, or mics. A number of audio editing
    programs, such as GarageBand and Audacity can be downloaded for free. Using programs
    such as these is the most affordable way to get started.


    There are tools people can buy to improve the quality of their podcasts. One of
    the most important pieces of equipment is the microphone. Each mic produces a
    different sound quality. Hosts need to find one that works well for them.


    Another important tool for podcast producers is the audio software. Software programs
    are designed to record, create, edit, and mix podcasts. They are called digital
    audio workstations (DAWs). Examples of DAWs include Pro Tools and Adobe Audition.


    GarageBand can also be used on iPads. Producers can even use this app to create
    their own music for the podcast.


    After a podcast is recorded, the producer saves it as digital audio file, such
    as an MP3 file. Then the producer edits it. He or she can cut out mistakes, add
    special effects, and more.


    When finished, the podcast is posted online. Some podcasts have websites listeners
    can download episodes from. Podcasts are also posted in online stores, such as
    iTunes and Google Play Music. Stitcher, Spotify, and other apps also provide podcasts.


    One of the best promotion tools is ratings. Podcast apps allow users to rate podcasts.
    Higher ratings mean more listeners!


    ![](img/a516e536f3fe63e421585585d441f3a8_12_0.png)


    # CHAPTER 3

    # TOOLS OF THE TRADE


    **Anyone can start a podcast if they have the right tools and equipment.** Even
    kids can do it! Many schools encourage students to prepare podcasts for school
    projects.


    Most new computers come with the basic software and equipment needed to produce
    a podcast. Computers have built-in microphones, or mics. A number of audio editing
    programs, such as GarageBand and Audacity can be downloaded for free. Using programs
    such as these is the most affordable way to get started.


    There are tools people can buy to improve the quality of their podcasts. One of
    the most important pieces of equipment is the microphone. Each mic produces a
    different sound quality. Hosts need to find one that works well for them.


    Another important tool for podcast producers is the audio software. Software programs
    are designed to record, create, edit, and mix podcasts. They are called digital
    audio workstations (DAWs). Examples of DAWs include Pro Tools and Adobe Audition.


    GarageBand can also be used on iPads. Producers can even use this app to create
    their own music for the podcast.


    After a podcast is recorded, the producer saves it as digital audio file, such
    as an MP3 file. Then the producer edits it. He or she can cut out mistakes, add
    special effects, and more.


    When finished, the podcast is posted online. Some podcasts have websites listeners
    can download episodes from. Podcasts are also posted in online stores, such as
    iTunes and Google Play Music. Stitcher, Spotify, and other apps also provide podcasts.


    A successful podcast has many listeners who listen to every episode.


    Blogs and social media posts are common ways producers get the word out about
    podcasts. In most cases, new episodes of a podcast come out the same time each
    week or month. A podcast calendar is sometimes posted on a website so listeners
    can find out upcoming topics and dates.

