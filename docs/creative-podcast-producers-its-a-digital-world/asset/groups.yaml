    # CHAPTER 4

    AT THE OFFICE


    Podcast producers can work in different types of locations and situations. Often,
    producers can work anywhere in the world they want. They just need to have a strong
    internet connection and the proper software and equipment.


    Many podcast producers work from their own homes. Some are entrepreneurs who write,
    edit, host, and market their own podcasts. They decide what they want to talk
    about and prepare their own content. No one tells them what to do or when to do
    it.


    ## DIGITAL BIT


    Podcast listeners listen to an average of five different shows per week. The most
    popular type of podcast is Comedy. Education and news are the next most popular
    types.


    Other podcast producers work for a company or organization. These producers create
    podcasts related to the companies'' products or services. Tour companies may use
    podcasts to talk about ideas for sightseeing.


    ![](img/a516e536f3fe63e421585585d441f3a8_16_0.png)


    In 2017, 69 percent of monthly podcast listeners listened to podcasts on smartphones
    or tablets. Only 31 percent listened on computers.


    Freelancing is another way for podcast producers to work. Instead of working full-time
    for one company, freelancers work on a project-by-project basis. Freelancers work
    with the people who hire them to produce the podcast.


    # CHAPTER 6

    PODCAST PAST


    **No matter where podcast producers work today, the job has only existed for about
    15 years.** The World Wide Web (the web) was invented in 1989. Within a few years,
    radio producers started streaming their programs live on the web.


    In 1995, the MP3 format was released. This was a way to compress digital audio
    so it takes up less computer memory. It made storing more digital audio files
    possible. To create a digital, or MP3, file, the computer turns sound into streams
    of numbers. When the MP3 is played, the computer turns the numbers back into sounds.
    **Bloggers** and radio broadcasters started adding MP3 files to their websites.
    Listeners could **download** the MP3 files and listen to them on their computers.


    The first digital audio players came out in 1998. MP3 files could be transferred
    from computers onto digital audio players. This made it possible for people to
    listen to MP3 files without being tied to their computers. These early MP3 players
    were expensive and couldn''t hold much content.


    Popular MP3 players in 2002 Included (left to right) SONICblue''s Rio Riot, Apple''s
    iPod, and Creative Labs'' Nomad Jukebox 3. Over time, the technology improved.
    MP3 players became less expensive. They also had more memory.


    Soon, many people were buying MP3 players. One of the most popular brands was
    the Apple iPod. MP3 players were mostly used to listen to music. But people started
    thinking of ways to use MP3 files to share other types of content.


    The development of RSS feeds paved the way for new types of audio sharing. RSS
    is a file format released in 1999. RSS uses keywords, or tags, to collect content
    on a specific topic from websites. Then it puts the content together in a list,
    called a feed. People interested in the topic can subscribe to the feed. New items
    are added to the feed when the websites post new content.


    In 2000, software developer Dave Winer added a new element to RSS. the ability
    to include links to MP3 audio files in RSS feeds. This used a new type of RSS
    tag called an enclosure. Enclosures allowed RSS feeds to link to audio and video
    files.


    In 2003, journalist and TV host Christopher Lydon produced an audio blog that
    included recordings of interviews with prominent scientists and politicians. Winer
    used RSS to create a feed of Lydon''s interviews that listeners could subscribe
    to. The feed was updated as new interviews were added. Though the word podcast
    was not in use yet, Lydon''s audio blog was just that. It was the first podcast.


    ## DIGITAL BIT


    The term "podcast" is a combination of the words "iPod" and "broadcast." Journalist
    Ben Hammersley first used the term in a 2004 issue of the Guardian newspaper.


    ![](img/a516e536f3fe63e421585585d441f3a8_20.png)


    Ben Hammersley first used the term in a 2004 issue of the Guardian newspaper.


    # CHAPTER 6

    GAINING POPULARITY


    Podcasts became popular thanks to Apple. In 2005, Apple released a version of
    iTunes that included podcasts. This made it much easier for people to find them.


    The term "podcast" is a combination of the words "iPod" and "broadcast." Journalist
    Ben Hammersley first used the term in a 2004 issue of the Guardian newspaper.


    ![](img/a516e536f3fe63e421585585d441f3a8_22.png)


    Many podcasts became popular thanks to Apple. In 2005, Apple released a version
    of iTunes that included podcasts. This made it much easier for people to find
    them.


    The term "podcast" is a combination of the words "iPod" and "broadcast." Journalist
    Ben Hammersley first used the term in a 2004 issue of the Guardian newspaper.


    ![](img/a516e536f3fe63e421585585d441f3a8_24.png)


    Many podcasts became popular thanks to Apple. In 2005, Apple released a version
    of iTunes that included podcasts. This made it much easier for people to find
    them.


    # CHAPTER 7

    MAKING MONEY


    **For many podcast producers, success meant making money.** One way for podcast
    producers to make money is by charging a fee. However, this method requires a
    very large audience to be profitable.


    Podcast producers can also make money by working with companies that have online
    stores. Podcast producers can sign up for affiliate programs with these companies.
    For example, many podcasters participate in Amazon.


    ## DIGITAL BIT


    A podcast sponsor can pay to be mentioned at the beginning, middle, or end of
    the podcast. These are called pre-roll, mid-roll, and post-roll. Mid-roll mentions
    are usually longer and more expensive than pre-roll or post-roll.


    Amazon gives each podcaster a special code or website link to pass on their listeners.
    Then, during podcasts, the hosts recommend products Amazon sells.


    Many podcasts have accounts on Patreon. This is a website where podcast listeners
    or other fans can support people''s businesses. When someone orders from the store
    using a podcast’s code, the podcast receives a portion of the sale amount.

    '
