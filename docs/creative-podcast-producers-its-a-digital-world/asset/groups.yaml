- md: '

    # DIGITAL SPOTLIGHT

    NPR


    National Public Radio (NPR) is the top podcast producer. It offers dozens of podcasts.
    Some of its podcasts are episodes of radio shows. Others were developed as podcasts.
    Overall, NPR podcasts are downloaded more than 100 million times each month.


    One of NPR''s most popular podcasts is Wow in the World. It is a weekly podcast
    for kids that explores science and technology. It features fun topics, such as
    why onions make people cry and why squirrels hide nuts. The hosts include funny
    stories to draw in listeners and keep them coming back for more. The podcast started
    in May 2017. Since then, its episodes have been downloaded more than five million
    times!


    ![](img/a516e536f3fe63e421585585d441f3a8_26_0.png)


    # CHAPTER B

    PODCASTING TRENDS


    **Podcasts are becoming more and more popular.**

    Between 2008 and 2017, the number of monthly podcast listeners in the US increased
    from 9 percent to 24 percent. In the past, people had to tune into radio and TV
    shows when they were broadcast. Today, the internet and mobile devices allow people
    to choose when to watch and listen to podcasts and other content. They can download
    podcasts and listen to them when they have free time.


    **Technology** and trends are always changing, so podcast producers need to change
    right along with them. As new technologies are invented, producers can use them
    to make new and better podcasts. They need to continue learning about new **software**
    and experimenting with ways to use it.


    Storytelling is one of the biggest podcasting trends. Podcasts are starting to
    use **narrative** to engage listeners. Instead of just talking about a topic,
    they are making it into a story.


    ![](img/a516e536f3fe63e421585585d441f3a8_28_0.png)


    Podcasts are especially popular because people can multitask with them. People
    can clean, work, or do other activities while listening to podcasts.


    > Experts think fictional podcasts will become more popular in the future. These
    include podcasts based on comic books, TV shows, and movies.


    In some cases, the stories are make-believe. One fiction podcast is the children’s
    podcast *The Alien Adventures of Finn Caspian*. Its first episode was produced
    in 2016. In other **narrative** podcasts, the stories are based on true events.


    26


    For example, *The Past & The Curious* explores history through storytelling and
    music.


    Some podcast producers tell a full story in one episode. Others tell only part
    of the story in each episode. They end each episode with a **cliff-hanger**. Listeners
    have to tune in to the next episode if they want to find out how the story ends.


    Another hot trend in podcasting is live video streaming. A live video stream is
    a video posted on the internet as it is being recorded. Some podcast producers
    use live video streaming to interact with their listeners. This allows listeners
    to watch podcasts being recorded. People watching the live video can ask podcast
    producers questions or give them **feedback** about their shows.


    Many podcast producers are finding new ways to use their podcasting skills beyond
    podcasts, such as **narrating** audio books. As podcasts continue to grow, so
    will new opportunities for podcast producers to use their skills. Only time will
    tell other creative ideas podcast producers will come up with!


    # TIMELINE


    ![](img/a516e536f3fe63e421585585d441f3a8_31_0.png)


    # 1989

    The World Wide Web is invented.


    # 1998

    The first digital audio players come out.


    # 2000

    Dave Winer invents RSS enclosures.


    # 1995

    The MP3 file format is released.


    # 1999

    The RSS file format is released.


    ![](img/a516e536f3fe63e421585585d441f3a8_31_1.png)


    # 2003

    Winer and Christopher Lydon create the first podcast.


    # 2004

    Adam Curry starts the podcast The Daily Source Code. Libsyn becomes the first
    podcast service provider.


    # 2005

    The iTunes store starts offering podcasts.


    # 2016

    The first episode of The Alien Adventures of Finn Caspian is produced.


    # 2017

    The first episode of NPR''s Wow in the World is released.


    ![](img/a516e536f3fe63e421585585d441f3a8_32_0.png)


    # GLOSSARY


    **affiliate**–a membership in or association with a company or organization.


    **audience**–a group of readers, listeners, or spectators.


    **blog**–a website that tells about someone''s personal opinions, activities,
    and experiences. A person who writes a blog is a blogger.


    **breakthrough**–a sudden advance or successful development.


    **cliff-hanger**–a story, contest, or situation that is very exciting because
    what is going to happen next is not known.


    **download**–to transfer data from a computer network to a single computer or
    device. Something that can be downloaded is downloadable.


    **entrepreneur**–one who organizes, manages, and accepts the risks of a business
    or an enterprise.


    **feedback**–information or criticism that suggests ways to improve something.


    **market**–to advertise or promote something so people will want to buy it.


    **media**–a form or system of communication, information, or entertainment. It
    includes television, radio, and newspapers.


    **mobile**–capable of moving or being moved.


    **narrate**–to tell a story. A story that is told in full detail is a narrative.


    **online**–connected to the internet.


    **social media**–forms of electronic communication that allow people to create
    online communities to share information, ideas, and messages. Facebook, Instagram,
    and Snapchat are examples of social media.


    **software**–the written programs used to operate a computer.


    **sponsor**–to pay for a program or an activity in return for promoting a product
    or brand. Someone who does this is a sponsor.


    **subscribe**–to agree to receive a publication and pay for it if it is not offered
    for free. Someone who does this is a subscriber.


    **technology** (tehk-NAH-luh-jee)—machinery and equipment developed for practical
    purposes using scientific principles and engineering.


    **upload**–to transfer data from a computer to a larger network.


    **version**–a different form or type of an original.


    ![](img/a516e536f3fe63e421585585d441f3a8_34_0.png)


