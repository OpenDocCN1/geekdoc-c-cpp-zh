    # IT''S A DIGITAL WORLD


    Technology is everywhere! It''s hard to imagine going a whole day without using
    a computer, smartphone, or tablet. But how do these devices work? Do you know
    how your favorite games, websites, podcasts, and apps were created? What''s it
    like to have a career working with computers? Find out the answers to these questions
    and more with It''s a Digital World! Explore the exciting world of computer technology,
    from computer programming and hacking to website development, game design, and
    more. Learn about pioneering programmers and how they created breakthrough apps
    and computer software. Discover what it''s like to have a career as a podcast
    producer or app developer. This series will open the door to an exciting future
    in the digital world!


    # BOOKS IN THIS SERIES


    +   - Amazing App Developers

    - Creative Podcast Producers

    - Dynamic Website Developers

    - Gifted Game Designers

    - Helpful Hackers

    - Master Computer Programmer


