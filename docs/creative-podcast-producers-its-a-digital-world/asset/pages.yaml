  md: '# GLOSSARY


    **affiliate**–a membership in or association with a company or organization.


    **audience**–a group of readers, listeners, or spectators.


    **blog**–a website that tells about someone''s personal opinions, activities,
    and experiences. A person who writes a blog is a blogger.


    **breakthrough**–a sudden advance or successful development.


    **cliff-hanger**–a story, contest, or situation that is very exciting because
    what is going to happen next is not known.


    **download**–to transfer data from a computer network to a single computer or
    device. Something that can be downloaded is downloadable.


    **entrepreneur**–one who organizes, manages, and accepts the risks of a business
    or an enterprise.


    **feedback**–information or criticism that suggests ways to improve something.


    **market**–to advertise or promote something so people will want to buy it.


    **media**–a form or system of communication, information, or entertainment. It
    includes television, radio, and newspapers.


    **mobile**–capable of moving or being moved.


    **narrate**–to tell a story. A story that is told in full detail is a narrative.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'online-connected to the internet.


    social media-forms of electronic communication that allow people to create online
    communities to share information, ideas, and messages. Facebook, Instagram, and
    Snapchat are examples of social media.


    software-the written programs used to operate a computer.


    sponsor-to pay for a program or an activity in return for promoting a product
    or brand. Someone who does this is a sponsor.


    subscribe-to agree to receive a publication and pay for it if it is not offered
    for free. Someone who does this is a subscriber.


    technology (tehk-NAH-luh-jee)—machinery and equipment developed for practical
    purposes using scientific principles and engineering.


    upload-to transfer data from a computer to a larger network.


    version-a different form or type of an original.


    ![](img/a516e536f3fe63e421585585d441f3a8_34_0.png)


    To learn more about podcast production, visit abdobooklinks.com. These links are
    routinely monitored and updated to provide the most current information available.'
