  md: '# CHAPTER 6

    GAINING POPULARITY


    Podcasts started becoming popular thanks to Adam Curry. In 2004, Curry started
    producing a podcast called The Daily Source Code. In the podcast, he played music
    and talked about his life as well as current events.


    The Daily Source Code was the first podcast that was more than a feed of audio
    files. Curry was the first to plan and produce a podcast that was similar to a
    radio show. Curry became known as the "Podfather."


    Also in 2004, Liberated Syndication (Libsyn) became the first podcast service
    provider. Both new and experienced podcasters started using Libsyn to host and
    publish their podcasts. Today, more than 35,000 podcasts are hosted by Libsyn.
    Each month, about 62 million people listen to podcasts by Libsyn hosts.


    In June 2005, Apple released a new version of its online music store, iTunes.
    For the first time, iTunes included podcasts.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'This made it even easier for people to find their favorite podcasts. They could
    now subscribe and listen to podcasts on iTunes.


    At first, there were 3,000 free podcasts on iTunes. New episodes were delivered
    to each subscriber''s iPod or computer as they came out. At the time, iTunes was
    the main source of downloadable music. So, being included on iTunes provided a
    big breakthrough that helped many podcasters find success.


    > Before starting his podcast, Adam Curry was a TV personality on the music channel
    MTV.


    ![](img/a516e536f3fe63e421585585d441f3a8_22_0.png)'
