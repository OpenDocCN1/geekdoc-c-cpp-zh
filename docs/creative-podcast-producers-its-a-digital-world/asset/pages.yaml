  md: '# PODCASTS FOR EVERYONE


    Have you ever been on a road trip or a long flight?


    Riding in a car or plane for hours can be really boring. Listening to podcasts
    is a great way to pass the time. Podcasts are digital audio files you can can
    download or stream live. You can listen to them on a digital media player or smartphone.
    Most podcasts are similar to radio shows. They feature people talking about different
    subjects or telling stories.


    Podcast producers are the people who make podcasts. They record audio, edit it,
    and then post it on the internet. There are podcasts on just about any topic you
    you can think of. Some, such as Tumble, talk about cool science discoveries. Others,
    such as Dream Big, share celebrity interviews and urge kids to follow their dreams.
    Most podcasts have multiple episodes. Podcast producers work hard to make each
    episode interesting and entertaining.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# CHAPTER 1

    PODCAST PREPARATION


    **Podcast producers record and edit podcasts to be posted on the internet.** Podcast
    producers have a strong interest in the themes of their podcasts. They may even
    be experts on the topics. Podcasts are a way to share their passion and excitement
    with others.


    Podcast listeners can find information about topics that interest them. For example,
    there aren’t many radio shows just just about math. But people who love math can
    listen to the podcast *Math Mutation*. Its episodes are full of fun and weird
    math facts.


    Most podcast producers have many different skills. Producers need to be well organized.
    They do a lot of different tasks and need to manage their time well. They need
    to have strong communication skills and pay attention to detail. They should also
    be good at solving problems and meeting due dates.


    Podcast producers do not need to have college degrees. In fact, they do not need
    any special training at all. Anyone'
  merge: -1
  pgno: 9
- img_proc: true
  md: "![](img/a516e536f3fe63e421585585d441f3a8_10_0.png)\n\nApple allows podcast\
    \ producers to track when listeners start, stop, or skip during a podcast episode.\
    \ This allows producers to better understand the types of content their listeners\
    \ enjoy.\n\nof any age and experience can create a podcast. All they need is a\
    \ computer with a microphone and the internet. \n\nHowever, some podcast producers\
    \ are professionals. They have experience working in radio or other media. In\
    \ those jobs, they use a lot of software and equipment podcasters use. They also\
    \ learn interviewing and storytelling skills. Some podcast producers take courses\
    \ to build their skills. Producers must keep up with new technologies as they\
    \ come out."
  merge: -1
