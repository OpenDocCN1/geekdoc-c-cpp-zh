  md: '# CHAPTER 7

    MAKING MONEY


    **For many podcast producers, success meant making money.** One way for podcast
    producers to make money is by charging their subscribers a fee. However, this
    method requires a very large audience to be profitable.


    Podcast producers can also make money by working with companies that have online
    stores. Podcast producers can sign up for affiliate programs with these companies.
    For example, many podcasters participate in online sales giant Amazon’s affiliate
    program.


    # DIGITAL BIT


    A podcast sponsor can pay to be mentioned at the beginning, middle, or end of
    the podcast. These are called pre-roll, mid-roll, and post-roll mentions. Mid-roll
    mentions are usually longer and more expensive than pre-roll or post-roll mentions.


    Amazon gives each podcaster a special code or website link to pass on their listeners.
    Then, during podcasts, the hosts recommend products Amazon sells and passes'
  merge: -1
  pgno: 23
- img_proc: true
  md: '![](img/a516e536f3fe63e421585585d441f3a8_24_0.png)


    Many podcasts have accounts on Patreon. This is a website where podcast listeners
    or other fans can support people''s businesses.


    21'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'on the codes. When someone orders from the store using a podcast’s code, the
    podcast receives a portion of the sale amount.


    Another way for podcast producers to make money is to sell their own products
    or services. Some podcasters write books or offer courses on different topics.
    Others make artwork or other items. Some podcasters sell T-shirts and other items
    featuring the name of their podcasts. Whatever the product, mentioning it during
    a podcast is a common way to advertise it.


    However, the most common way podcasts make money is through **sponsors**. A sponsor
    is a company that pays to be mentioned on podcasts. Some companies want to sponsor
    podcasts that have the largest **audiences**. This way they will reach more customers.


    However, many companies look to sponsor podcasts that are related to the company’s
    products or services. What matters most to them is whether the audience will buy
    a product or service that is recommended on the podcast. A company may sponsor
    a podcast with loyal listeners, even if there are fewer of them. Loyal listeners
    are more likely to follow the advice of the podcast, such as buying certain products.'
  merge: -1
