  md: '# ## CHAPTER 2

    # DOING MANY JOBS


    **A lot of work goes into making a podcast.** Podcast producers perform research
    to learn about new ideas. They also look for exciting content and find interesting
    guests for their episodes.


    Sometimes, podcast producers are also the hosts of their podcasts. They tell stories
    and interview guests. Other podcast producers are hired by podcast hosts to produce
    the podcasts.


    It is the podcast producer’s job to run the tools and equipment used to record
    and edit podcasts. They need to know how to use sound editing **software** to
    make the podcast sound good. This includes adding music and sound effects. It
    also includes removing stammers, mistakes, and any other unwanted content.


    Podcast producers **upload** completed podcasts to websites or podcast hosting
    servers. Then, the producers must **market** their podcasts. They want to build
    **audiences** for their podcasts.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'A successful podcast has many loyal listeners who listen to every episode.


    **Blogs** and **social media** posts are common ways producers get the word out
    about their podcasts. In most cases, new episodes of a podcast come out at the
    same time each week or month. A podcast calendar is sometimes posted on a website
    so listeners can find out about upcoming topics and dates.


    > One of the best podcast promotion tools is ratings. Podcast apps allow users
    to rate podcasts. Higher ratings mean more listeners!


    ![](img/a516e536f3fe63e421585585d441f3a8_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# # CHAPTER 3

    # TOOLS OF THE TRADE


    **Anyone can start a podcast if they have the right tools and equipment.** Even
    kids can do it! Many schools encourage students to prepare podcasts for school
    projects.


    Most new computers come with the basic **software** and equipment needed to produce
    a podcast. Computers have built-in microphones, or *m*. A number of audio editing
    programs, such as GarageBand and Audacity can be **downloaded** for free. Using
    programs such as these is the most affordable way to get started.


    There are tools people can buy to improve the quality of their podcasts. One of
    the most important pieces of equipment is the microphone. Each mic produces a
    different sound quality. Hosts need to find one that works well for them.


    Another important tool for podcast producers is the audio software. Software programs
    are designed to record, create, edit, and mix podcasts. They are called digital
    audio workstations (DAWs). Examples of DAWs include Pro Tools and Adobe Audition.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'GarageBand can also be used on iPads. Producers can even use this app to create
    their own music for the podcast.


    After a podcast is recorded, the producer saves it as digital audio file, such
    as an MP3 file. Then the producer edits it. He or she can cut out mistakes, add
    special effects, and more.


    When finished, the podcast is posted **online**. Some podcasts have websites listeners
    can **download** episodes from. Podcasts are also posted in online stores, such
    as iTunes and Google Play Music. Stitcher, Spotify, and other apps also provide
    podcasts.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# CHAPTER 4

    AT THE OFFICE


    Podcast producers can work in different types of locations and situations. Often,
    producers can work anywhere in the world they want. They just need to have a strong
    internet connection and the proper software and equipment.


    Many podcast producers work from their own homes. Some are entrepreneurs who write,
    edit, host, and market their own podcasts. They decide what they want to talk
    about and prepare their own content. No one tells them what to do or when to do
    it.


    # DIGITAL BIT


    Podcast listeners listen to an average of five different shows per week. The most
    popular type of podcast is Comedy. Education and news are the next most popular
    types.


    Other podcast producers work for a company or organization. These producers create
    podcasts related to the companies'' products or services. Tour companies may use
    podcasts to'
  merge: -1
  pgno: 15
- img_proc: true
  md: '![](img/a516e536f3fe63e421585585d441f3a8_16_0.png)


    In 2017, 69 percent of monthly podcast listeners listened to podcasts on smartphones
    or tablets. Only 31 percent listened on computers.


    talk about ideas for sightseeing. Educational companies may use podcasts to teach
    lessons.


    Freelancing is another way for podcast producers to work. Instead of working full-time
    for one company, freelancers work on a project-by-project basis. Freelancers work
    with the people who hire them to produce the podcast.'
  merge: -1
