- pgno: 258
  md: 'First we import all the libraries we need, and we define a constant for the
    maximum length of the lines we are going to read from the Arduino. Then we define
    a main() function.


    After we’ve made sure that the name of a serial port was passed on the command
    line, we initialize a serial port in line 14. Then we sleep for two seconds to
    give the Arduino some time to get ready. After that, we start a loop where we
    constantly send the string “a0” to the Arduino in line 23. We check the result
    of serialport_write(), and if it was successful, we read the result sent by the
    Arduino in line 27. Let’s compile our little program:


    ```

    maik> gcc arduino-serial.c analog_reader.c -o analog_reader

    ```


    Determine what serial port your Arduino is connected to (mine is connected to
    /dev/tty.usbmodemfa141), and run the program like this:


    ```

    maik> ./analog_reader /dev/tty.usbmodemfa141

    a0: 495

    a0: 376

    a0: 368

    ^C

    ```


    Everything works as expected, and accessing a serial port using C isn’t that difficult.
    To embed this code into a C++ program, you should wrap it in a class named SerialPort
    or something similar.


