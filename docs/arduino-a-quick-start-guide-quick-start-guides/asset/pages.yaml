- pgno: 136
  md: "These values represent the data we get for the x-, y-, and z-axes. When you\
    \ move the sensor only around the x-axis, for example, you can see that the first\
    \ value changes accordingly. In the next section, we'll take a closer look at\
    \ these values.\n\n# 6.4 Finding and Polishing Edge Values\n\nThe physical world\
    \ often is far from being perfect. That's especially true for the data many sensors\
    \ emit, and accelerometers are no exception. They slightly vary in the minimum\
    \ and maximum values they generate, and they often jitter a bit. They might change\
    \ their output values even though you haven't moved them, or they might not change\
    \ their output values correctly. In this section, we'll determine the sensor's\
    \ minimum and maximum values, and we'll flatten the jitter.\n\nFinding the edge\
    \ values of the sensor is easy, but it cannot be easily automated. You have to\
    \ constantly read the sensor's output while moving it. Here's a program that does\
    \ the job:\n\n```\nDownload MotionSensor/SensorValues/SensorValues.pde\nconst\
    \ unsigned int X_AXIS_PIN = 2;\nconst unsigned int Y_AXIS_PIN = 1;\nconst unsigned\
    \ int Z_AXIS_PIN = 0;\nconst unsigned int BAUD_RATE = 9600;\n\nint min_x, min_y,\
    \ min_z;\nint max_x, max_y, max_z;\n\nvoid setup() {\n  Serial.begin(BAUD_RATE);\n\
    \  min_x = min_y = min_z = 1000;\n  max_x = max_y = max_z = -1000;\n}\n\nvoid\
    \ loop() {\n  const int x = analogRead(X_AXIS_PIN);\n  const int y = analogRead(Y_AXIS_PIN);\n\
    \  const int z = analogRead(Z_AXIS_PIN);\n\n  min_x = min(x, min_x); max_x = max(x,\
    \ max_x);\n  min_y = min(y, min_y); max_y = max(y, max_y);\n  min_z = min(z, min_z);\
    \ max_z = max(z, max_z);\n\n  Serial.print(\"x(\");\n  Serial.print(min_x);\n\
    \  Serial.print(\"/\");\n  Serial.print(max_x);\n```"
