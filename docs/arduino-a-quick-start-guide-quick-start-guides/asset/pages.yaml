    port, which opens the door to a whole new world of physical computing projects
    (see Section C.1, Learning More About Serial Communication, on page 251 for more
    details about serial communication). In the next chapters, you''ll learn how to
    gather interesting facts about the real world using sensors, and you''ll learn
    how to change the real world by moving objects. Serial communication is the basis
    for letting you control all these actions using the Arduino and your PC.


    # 2.5 What If It Doesn''t Work?


    If anything goes wrong with the examples in this chapter, you should take a look
    at Section 1.8, What If It Doesn''t Work?, on page 43 first. If you still run
    into problems, it may be because of some issues with serial communication. For
    example, you might have set the wrong baud rate; in Figure 2.9, you can see what''s
    happening in such a case.


