  md: '# More Fun with Motion-Sensing Technologies


    Since motion-sensing technologies became popular and cheap, people have used them
    to create some unbelievably cool and funny projects. A hilarious example is the
    Brushduino.* A father built it to encourage his young children to brush their
    teeth properly. Its main component—apart from an Arduino—is a three-axis accelerometer.
    The Brushduino indicates which section of the mouth to brush next using LEDs,
    and whenever the child has successfully finished a section, it plays some music
