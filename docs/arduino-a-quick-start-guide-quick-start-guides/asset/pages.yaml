  md: "We send two bytes (0x40 and 0x00) to the Nunchuk, and then we end the transmission.\
    \ This is the whole handshake procedure, and now we can ask the Nunchuk for its\
    \ current status by calling update(). In Figure 7.4, on the preceding page, we\
    \ see the message flow between an Arduino and a Nunchuk.\n\nupdate() first pauses\
    \ for a millisecond to let things settle a bit. Then we request six bytes from\
    \ the Nunchuk, calling Wire.requestFrom(). This does not actually return the bytes,\
    \ but we have to read them in a loop and fill our buffer. Wire.available() returns\
    \ the number of bytes that are available on the data bus, and Wire.receive() returns\
    \ the current byte. We cannot use the bytes we get from the Nunchuk directly,\
    \ because the controller obfuscates them a bit. “Decrypting” them is easy as you\
    \ can see in decode_byte().\n\nFinally, we call request_data() to tell the Nunchuk\
    \ to prepare new data. It transmits a single zero byte to the Nunchuk, which means\
    \ “prepare the next six bytes.”\n\nBefore we actually use our Nunchuk class in\
    \ the next section, take a look at the documentation of the Wire library. In the\
    \ Arduino IDE's menu, choose Help > Reference, and click the Libraries link.\n\
    \n# 7.5 Using Our Nunchuk Class\n\nLet's use the Nunchuk class to see what data\
