    # 6.2 Wiring Up the Accelerometer


    There are many different accelerometers, differing mainly in the number of spacial
    axes they support (usually two or three). We use the ADXL335 from Analog Devices—it’s
    easy to use and widely available.¹


    In this section, we’ll connect the ADXL335 to the Arduino and create a small demo
    program showing the raw data the sensor delivers. At that point, we will have
    a quick look at the sensor’s specification and interpret the data.


    In Figure 6.2, you see a breakout board containing an ADXL335 sensor on the right.
    The sensor is the small black integrated circuit (IC), and the rest is just a
    carrier to allow connections. On the top, you see a 6 pin 0.1" standard header.
    The sensor has six connectors labeled GND, Z, Y, X, 3V, and TEST. To use the sensor
    on a breadboard, solder the standard header to the connectors. This not only makes
    it easier to attach the sensor to a breadboard but also stabilizes the sensor,
    so it


