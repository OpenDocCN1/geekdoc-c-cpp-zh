- pgno: 278
  md: '# Debugging & Better SQL


    # Debug It!


    *Debug It!* will equip you with the tools, techniques, and approaches to help
    you tackle any bug with confidence. These secrets of professional debugging illuminate
    every stage of the bug life cycle, from constructing software that makes debugging
    easy; through bug detection, reproduction, and diagnosis; to rolling out your
    eventual fix. Learn better debugging whether you''re writing Java or assembly
    language, targeting servers or embedded micro-controllers, or using agile or traditional
    approaches.


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_278_0.png)


    # Debug It! Find, Repair, and Prevent Bugs in Your Code


    Paul Butcher

    (232 pages) ISBN: 978-1-9343562-8-9. $34.95

    http://pragprog.com/titles/pbdb


    # SQL Antipatterns


    If you''re programming applications that store data, then chances are you''re
    using SQL, either directly or through a mapping layer. But most of the SQL that
    gets used is inefficient, hard to maintain, and sometimes just plain wrong. This
    book shows you all the common mistakes, and then leads you through the best fixes.
    What''s more, it shows you what''s *behind* these fixes, so you''ll learn a lot
    about relational databases along the way.


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_278_1.png)


    # SQL Antipatterns: Avoiding the Pitfalls of Database Programming


    Bill Karwin

    (300 pages) ISBN: 978-19343565-5-5. $34.95

    http://pragprog.com/titles/bksqa'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Agile Techniques


    # The Agile Samurai


    Faced with a software project of epic proportions?

    Tired of over-committing and under-delivering?

    Enter the dojo of the agile samurai, where agile expert Jonathan Rasmusson shows
    you how to kick-start, execute, and deliver your agile projects. You''ll see how
    agile software delivery really works and how to help your team get agile fast,
    while having fun along the way.


    **The Agile Samurai: How Agile Masters Deliver Great Software**

    Jonathan Rasmusson

    (275 pages) ISBN: 9781934356586. $34.95

    http://pragprog.com/titles/jrap


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_279_0.png)


    # Driving Technical Change


    Your co-workers'' resistance to new technologies can be baffling. Learn to read
    users'' "patterns of resistance"—and then dismantle their objections. Every developer
    must master the art of evangelizing. With these techniques and strategies, you''ll
    help your organization adopt your solutions—without selling your soul to organizational
    politics.


    **Driving Technical Change: Why People On Your Team Don’t Act On Good Ideas, and
    How to Convince Them They Should**

    Terrence Ryan

    (200 pages) ISBN: 978-1934356-60-9. $32.95

    http://pragprog.com/titles/trevan


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_279_1.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# More On Languages


    # Seven Languages in Seven Weeks


    In this book you''ll get a hands-on tour of Clojure, Haskell, Io, Prolog, Scala,
    Erlang, and Ruby. Whether or not your favorite language is on that list, you''ll
    broaden your perspective of programming by examining these languages side-by-side.
    You''ll learn something new from each, and best of all, you''ll learn how to learn
    a language quickly.


    Seven Languages in Seven Weeks: A Pragmatic Guide to Learning Programming Languages

    Bruce A. Tate

    (300 pages) ISBN: 978-1934356-59-3. $34.95

    http://pragprog.com/titles/btlang


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_280_0.png)


    # Language Implementation Patterns


    Learn to build configuration file readers, data readers, model-driven code generators,
    source-to-source translators, source analyzers, and interpreters. You don''t need
    a background in computer science—ANTLR creator Terence Parr demystifies language
    implementation by breaking it down into the most common design patterns. Pattern
    by pattern, you''ll learn the key skills you need to implement your own computer
    languages.


    Language Implementation Patterns: Create Your Own Domain-Specific and General
    Programming Languages

    Terence Parr

    (350 pages) ISBN: 978-1934356-45-6. $34.95

    http://pragprog.com/titles/tpdsl


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_280_1.png)'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Apple iOS & Mac


    # Beginning Mac Programming


    Aimed at beginning developers without prior programming experience. Takes you
    through concrete, working examples, giving you the core concepts and principles
    of development in context so you will be ready to build the applications you''ve
    been imagining. It introduces you to Objective-C and the Cocoa framework in clear,
    easy-to-understand lessons, and demonstrates how you can use them together to
    write for the Mac, as well as the iPhone and iPod.


    **Beginning Mac Programming: Develop with Objective-C and Cocoa**

    Tim Isted

    (300 pages) ISBN: 978-1934356-51-7. $34.95

    http://pragprog.com/titles/fibmac


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_281_0.png)


    # iPad Programming


    It''s not an iPhone and it''s not a laptop: the iPad is a groundbreaking new device.
    You need to create true iPad apps to take advantage of all that is possible with
    the iPad. If you''re an experienced iPhone developer, *iPad Programming* will
    show you how to write these outstanding new apps while completely fitting your
    users'' expectation for this device.


    **iPad Programming: A Quick-Start Guide for iPhone Developers**

    Daniel H Steinberg and Eric T Freeman

    (250 pages) ISBN: 978-19343565-7-9. $34.95

    http://pragprog.com/titles/sfipad


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_281_1.png)'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Ruby & Rails


    # Programming Ruby 1.9 (The Pickaxe for 1.9)


    The Pickaxe book, named for the tool on the cover, is the definitive reference
    to this highly-regarded language.


    +   - Up-to-date and expanded for Ruby version 1.9

    +   - Complete documentation of all the built-in classes, modules, and methods

    +   - Complete descriptions of all standard libraries

    +   - Learn more about Ruby''s web tools, unit testing, and programming philosophy


    # Programming Ruby 1.9: The Pragmatic Programmers'' Guide


    Dave Thomas with Chad Fowler and Andy Hunt

    (992 pages) ISBN: 978-1-9343560-8-1. $49.95

    http://pragprog.com/titles/ruby3


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_282_0.png)


    # Agile Web Development with Rails


    Rails just keeps on changing. Rails 3 and Ruby 1.9 bring hundreds of improvements,
    including new APIs and substantial performance enhancements. The fourth edition
    of this award-winning classic has been reorganized and refocused so it''s more
    useful than ever before for developers new to Ruby and Rails. This book isn''t
    just a rework, it''s a complete refactoring.


    # Agile Web Development with Rails: Fourth Edition


    Sam Ruby, Dave Thomas, and David Heinemeier Hansson, et al.

    (500 pages) ISBN: 978-1-93435-654-8. $43.95

    http://pragprog.com/titles/rails4


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_282_1.png)'
