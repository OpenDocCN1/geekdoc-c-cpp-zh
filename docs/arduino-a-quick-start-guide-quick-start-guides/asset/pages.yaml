- pgno: 145
  md: "Unsurprisingly, we set buttonPressed to true when the button on the controller\
    \ is pressed. Otherwise, it is false. paused tells you whether the game is currently\
    \ paused, and done is true when the current level is done, that is, when all bricks\
    \ have been destroyed.\n\nEvery Processing program needs a setup() function, and\
    \ here is ours:\n\n```\nDownload MotionSensor/Game/Game.pde\n\nvoid setup() {\n\
    \  size(WIDTH, HEIGHT);\n  noCursor();\n  textFont(loadFont(\"Verdana-Bold-36.vlw\"\
    ));\n  initGame();\n  println(Serial.list());\n  arduinoPort = new Serial(this,\
    \ Serial.list()[0], BAUD_RATE);\n  arduinoPort.bufferUntil(LINE_FEED);\n}\n\n\
    void initGame() {\n  initBricks();\n  initBall();\n}\n\nvoid initBricks() {\n\
    \  for (int x = 0; x < COLUMNS; x++)\n    for (int y = 0; y < ROWS; y++)\n   \
    \   bricks[x][y] = 1;\n}\n\nvoid initBall() {\n  px = width / 2;\n  py = height\
    \ / 2;\n  vx = int(random(-MAX_VELOCITY, MAX_VELOCITY));\n  vy = -2;\n}\n```\n\
    \nThe setup() function initializes the screen, hides the mouse pointer with noCursor(),\
    \ and sets the font that we will use to output messages (create the font using\
    \ Processing's Tools > Create Font menu). Then we call initGame() to initialize\
