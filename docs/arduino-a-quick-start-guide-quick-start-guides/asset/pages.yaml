- pgno: 54
  md: '# Numbering Systems


    It’s an evolutionary accident that 10 is the basis for our numbering system. If
    we had only four fingers on each hand, it’d be probably eight, and we’d probably
    have invented computers a few centuries earlier.


    For thousands of years, people have used denominational number systems, and we
    represent a number like 4711 as follows:


    4×10³ + 7×10² + 1×10¹ + 1×10⁰


    This makes arithmetic operations very convenient. But when working with computers
    that only interpret binary numbers, it’s often advantageous to use numbering systems
    based on the numbers 2 (binary), 8 (octal), or 16 (hexadecimal).


    For example, the decimal number 4711 can be represented in octal and hexadecimal
    as follows:


    +   - 1×8⁴ + 1×8³ + 1×8² + 4×8¹ + 7×8⁰ = 011147

    +   - 1×16³ + 2×16² + 6×16¹ + 7×16⁰ = 0x1267


    In Arduino programs, you can define literals for all these numbering systems:


    ```

    int decimal = 4711;

    int binary = B100100110011;

    int octal = 011147;

    int hexadecimal = 0x1267;

    ```


    Binary numbers start with a B character, octal numbers with a 0, and hexadecimal
    numbers start with 0x.


    # Using Different Serial Terminals


    For trivial applications, the IDE’s serial monitor is sufficient, but you cannot
    easily combine it with other applications, and it lacks some features (for example,
    it could not send newline characters in older IDE versions). That means you should
    have an alternative serial terminal to send data, and you can find plenty of them
    for every operating system.


    # Serial Terminals for Windows


    Putty¹ is an excellent choice for Windows users. It is free, and it comes as an
    executable that does not even have to be installed. Figure 2.5, on the following
    page shows how to configure it for communication on a serial port.'
  merge: -1
