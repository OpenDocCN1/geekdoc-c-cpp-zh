    Admittedly, this is a lot of code, but it’s very simple. First, the SmtpService
    class encapsulates the SMTP server’s IP address and its port.


    To communicate with an SMTP server, we have to read its responses, and we do that
    using the private read_response() method starting on line 10. It waits for four
    seconds (SMTP servers usually are very busy, because they have to send a lot of
    spam), and then it reads all the data sent back by the server and outputs it to
    the serial port for debugging purposes.


    Before we can process responses, we have to send requests. send_line() beginning
    in line 18 sends a single command to an SMTP server. You have to pass the connection
    to the server as a Client instance, and the line you’d like to send has to be
    a String object.


    To send the data stored in a String object, we need to access the character data
    it refers to. At the moment of this writing, the Arduino reference documentation
    tells you to simply use toCharArray() or getBytes() to retrieve this information.
    Unfortunately, the documentation is wrong. That is, these two methods do not return
    a pointer. Instead, they expect you to provide a sufficiently large char array
    and its size. That’s why we copy line’s content to buffer before we output it
    to the serial and Ethernet port. After we’ve sent the data, we read the server’s
    response and print it to the serial port.


    In the public interface, you do not find any surprises. The constructor expects
    the SMTP server’s IP address and its port. The send_email() method is the largest
    piece of code in our class, but it’s also one of the simplest. It mimics exactly
    our telnet session, and the only thing worth mentioning is the string handling:
    we use the Arduino’s new String class, and to use its concatenation operator (+),
    we turn every string into a String object.


    Let’s use our classes now to actually send an email:'
