    # 9.4 Building Your Own Apple Remote


    Now that you know the protocol and the codes of the commands the Apple Remote
    sends to a Mac, you can build your own Apple Remote. You only need an infrared
    LED that doesn’t differ much from the LEDs we’ve used before. The only difference
    is that it emits “invisible” light. In Figure 9.6, on the next page, you can see
    how to connect it to pin 3 of an Arduino (the library we’re using in this section
    expects the infrared LED to be connected to pin 3). Note that you can’t use an
    LED without a resistor (see Section A.1, Current, Voltage, and Resistance, on
    page 237 to learn more about it).


