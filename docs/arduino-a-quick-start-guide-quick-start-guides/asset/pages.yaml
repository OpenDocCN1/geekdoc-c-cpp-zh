  md: '# **More Motors Projects**


    Motors are fascinating. Search the ''net and you’ll find numerous projects combining
    the Arduino with them. A fun project is the Arduino Hypnodisk.* It uses a servo
    motor to rotate a hypno disc—a rotating disk with a spiral printed on it that
    has a hypnotic effect. An infrared rangerfinder changes the motor’s speed, so
    the closer you get to the disc, the faster it spins.


    A useful and exciting project is the USB hourglass.† It uses an Arduino and a
    servo motor to turn a sand timer, and it observes the falling sand using an optical
    sensor. Whenever all the sand has fallen through, the device turns the timer automatically.


    That’s all nice, but the device’s main purpose is to generate true random numbers.
    Falling sand is a perfect basis for generating true randomness (see the sidebar
    on page 73), and the USB hourglass uses the signals from its optical sensor to
    generate random numbers, sending them to the serial port.


    so you cannot simply attach every motor to an Arduino. Also, you cannot easily
    drive more than one motor, especially not with the small amount of power you get
    from a USB port. If your motor does not run as expected, check its specification,
    and attach an AC or DC adapter to your Arduino if necessary.


    You also shouldn’t attach too much weight to your motor. Moving an arrow made
    of paper is no problem, but you might run into problems if you attach bigger and
    heavier things. Also, be careful not to put any obstacles into the motor’s way.
    The motor’s shaft always needs to move freely.


    Some motors have to be adjusted from time to time, and usually you have to do
    that with a very small screw driver. Refer to the motor’s specification for detailed
    instructions.


