    \ \");\n    Serial.print(microseconds_to_cm(duration));\n    Serial.println(\"\
    \ cm\");\n  }\n\n  delay(100);\n}\n\nunsigned long microseconds_to_cm(const unsigned\
    \ long microseconds) {\n  return microseconds / 29 / 2;\n}\n```\n```\n\nFirst\
    \ we define a constant for the IO pin the PING))) sensor is connected to. If you\
    \ want to connect your sensor to another digital IO pin, you have to change the\
    \ program’s first line. In the setup() method, we set the serial port’s baud rate\
    \ to 9600, because we’d like to see some sensor data on the serial monitor.\n\n\
    The real action happens in loop() where we actually implement the PING))) protocol.\
    \ According to the data sheet,³ we can control the sensor using pulses, and it\
    \ returns results as variable-width pulses, too.\n\n> 3. http://www.parallax.com/dl/docs/prod/acc/28015-PING-v1.5.pdf"
