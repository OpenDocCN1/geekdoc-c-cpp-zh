- pgno: 131
  md: '# Chapter 6


    # Building a Motion-Sensing Game Controller


    It’s astonishing how quickly we get used to new technologies. A decade ago, not
    many people would have imagined that we’d use devices someday to unobtrusively
    follow our movements. Today it’s absolutely normal for us to physically turn our
    smartphones when we want to change from portrait to landscape view. Even small
    children intuitively know how to use motion-sensing controllers for video game
    consoles such as Nintendo’s Wii. You can build your own motion-sensing devices
    using an Arduino, and in this chapter you’ll learn how.


    We’ll work with one of the most widespread motion-sensing devices: the *accelerometer*.
    Accelerometers detect movement in all directions—they notice if you move them
    up, down, forward, backward, to the left, or to the right. Many popular gadgets
    such as the iPhone and the Nintendo Wii controllers contain accelerometers. That’s
    why accelerometers are cheap.


    Both fun and serious projects can benefit from accelerometers. When working with
    your computer, you certainly think of projects such as game controllers or other
    input control devices. But you can also use them when exercising or to control
    a real-life marble maze. You can also use them to measure acceleration more or
    less indirectly, such as in a car.


    You will learn how to interpret accelerometer data correctly and how to get the
    most accurate results. Then you’ll use an accelerometer to build your own motion-sensing
    game controller, and you’ll implement a game that uses it.'
  merge: -1
  img_proc: true
