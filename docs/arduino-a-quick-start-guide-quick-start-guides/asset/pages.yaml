- pgno: 106
  md: '![](img/dcfd13a1bf99c4d3f9996627012a6526_106_0.png)


    Figure 5.4: PING))) pulse diagram


    In lines 9 to 11, we set the sensor’s signal pin to LOW for 2 microseconds to
    bring it to a proper state. This will ensure clean HIGH pulses that are needed
    in the next steps (in the world of electronics, you should always be prepared
    for jitters in the power supply).


    Finally, it’s time to tell the sensor to do some work. In lines 13 to 15, we set
    the sensor’s signal pin to HIGH for 5 microseconds to start a new measurement.
    Afterward, we set the pin to LOW again, because the sensor will respond with a
    HIGH pulse of variable length on the same pin.


    With a digital pin, you have only a few options to transmit information. You can
    set the pin to HIGH or LOW, and you can control how long it remains in a particular
    state. For many purposes, this is absolutely sufficient, and in our case it is,
    too. When the PING))) sensor sends out its 40 kHz chirp, it sets the signal pin
    to HIGH and then sets it back to LOW when it receives the echo. That is, the signal
    pin remains in a HIGH state for exactly the time it takes the sound to travel
    to an object and back to the sensor. Loosely speaking, we are using a digital
    pin for measuring an analog signal. In Figure 5.4, you can see a diagram showing
    typical activity on a digital pin connected to a PING))) sensor.


    We could measure the duration the pin remains in HIGH state manually, but the
    pulseIn() method already does all the dirty work for us. So, we use it in line
    18 after we have set the signal pin into input mode again. pulseIn() accepts three
    parameters:


    +   - *pin*: Number of the pin to read the pulse from.

    +   - *type*: Type of the pulse that should be read. It can be HIGH or LOW.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/dcfd13a1bf99c4d3f9996627012a6526_107_0.png)


    # Figure 5.5: Photo of PING))) basic circuit


    +   - *timeout*: Timeout measured in microseconds. If no pulse could be detected
    within the timeout period, pulseIn() returns 0. This parameter is optional and
    defaults to one second.


    Note that in the whole process only one pin is used to communicate with the PING))).
    Sooner or later, you will realize that IO pins are a scarce resource on the Arduino,
    so it''s really a nice feature that the PING))) uses only one digital pin. When
    you can choose between different parts performing the same task, try to use as
    few pins as possible.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'We have only one thing left to do: convert the duration we have measured into
    a length. Sound travels at 343 meters per second, which means it needs 29.155
    microseconds per centimeter. So, we have to divide the duration by 29 and then
    by 2, because the sound has to travel the distance twice. It travels to the object
    and then back to the PING))) sensor. The microseconds_to_cm() method performs
    the calculation.


    According to the specification of the PING))) sensor, you have to wait at least
    200 microseconds between two measurements. For high-speed measurements, we could
    calculate the length of a pause more accurately by actually measuring the time
    the code takes. But in our case, this is pointless, because all the statements
    that are executed during two measurements in the loop() method take far more than
    200 microseconds. And outputting data to the serial connection is fairly expensive.
    Despite this, we have added a small delay of 100 microseconds to slow down the
    output a bit.


    You might wonder why we use the const keyword so often. The Arduino language is
    based on C/C++, and in these languages it''s considered a good practice to declare
    constant values as const (see Effective C++: 50 Specific Ways to Improve Your
    Programs and Designs [Mey97]). Not only will using const make your program more
    concise and prevent logical errors early, it will also help the compiler to decrease
    your program''s size.


    Although most Arduino programs are comparatively small, software development for
    the Arduino is still software development and should be done according to all
    the best practices we know. So, whenever you define a constant value in your program,
    declare it as such (using const, not using #define). This is true for other programming
    languages, too, so we will use final in our Processing and Java programs a lot
    (you''ll learn more about Processing in Section 5.5, Transferring Data Back to
    Your Computer Using Processing, on page 119).


    Now it''s time to play around with the sensor and get familiar with its strengths
    and weaknesses. Compile the program, upload it to your Arduino board, and open
    the serial monitor (don''t forget to set the baud rate to 9600). You should see
    something like this:


    ```

    Distance to nearest object: 42 cm

    Distance to nearest object: 33 cm

    Distance to nearest object: 27 cm

    Distance to nearest object: 27 cm

    ```'
