  md: 'up in the preferences menu. You can change this behavior so that the IDE asks
    you for a name when you create a new sketch. Whenever you get lost, you can check
    what folder the current sketch is in using the Sketch > Show Sketch Folder menu
    item.


    The IDE uses directories not only to organize projects. It also stores some interesting
    things in the following folders:


    +   - The examples folder contains sample sketches that you can use as a basis
    for your own experiments. Get to them via the File > Open dialog box. Take some
    time to browse through them, even if you do not understand anything you see right
    now.

    +   - The libraries directory contains libraries for various purposes and devices.
    Whenever you use a new sensor, for example, chances are good that you have to
