- pgno: 37
  md: 'Arduino calls setup() once when it boots, and we use it for initializing the
    Arduino board and all the hardware we have connected to it. We use the pinMode()
    method to turn pin 13 into an output pin. This makes sure the pin is able to provide
    enough current to light up an LED. The default state of a pin is INPUT, and both
    INPUT and OUTPUT are predefined constants.¹¹


    Another mandatory function named loop() begins in line 8. It contains the main
    logic of a program, and the Arduino calls it in an infinite loop. Our program’s
    main logic has to turn on the LED connected to pin 13 first. To do this, we use
    digitalWrite() and pass it the number of our pin and the constant HIGH. This means
    the pin will output 5 volts until further notice, and the LED connected to the
    pin lights up.


    The program then calls delay() and waits for 500 milliseconds doing nothing. During
    this pause, pin 13 remains in HIGH state, and the LED continues to burn. The LED
    is eventually turned off when we set the pin’s state back to LOW using digitalWrite()
    again. We wait another 500 milliseconds, and then the loop() function ends. The
    Arduino starts it again, and the LED blinks.


    In the next section, you’ll learn how to bring the program to life and transfer
    it to the Arduino.


    # 1.6 Compiling and Uploading Programs


    Before you compile and upload a program to the Arduino, you have to configure
    two things in the IDE: the type of Arduino you’re using and the serial port your
    Arduino is connected to.


    Identifying the Arduino type is easy, because it is printed on the board. Popular
    types are Uno, Duemilanove, Diecimila, Nano, Mega, Mini, NG, BT, LilyPad, Pro,
    or Pro Mini. In some cases, you also have to check what microcontroller your Arduino
    uses—most have an ATmega168 or an ATmega328. You can find the microcontroller
    type printed on the microcontroller itself. When you have identified the exact
    type of your Arduino, choose it from the Tools > Board menu.


    Now you have to choose the serial port your Arduino is connected to from the Tools
    > Serial Port menu. On Mac OS X, the name of the serial port starts with /dev/cu.usbserial
    or /dev/cu.usbmodem (on my


    11. See http://arduino.cc/en/Tutorial/DigitalPins for the official documentation.'
