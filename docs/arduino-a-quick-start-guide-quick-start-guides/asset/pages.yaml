- pgno: 201
  md: '# Chapter 9


    # Creating Your Own Universal Remote Control


    Remote controls add a lot of convenience to our lives, but they aren’t without
    annoyances. Sometimes remotes don’t have a certain function that you’d like to
    have, such as a sleep timer. Plus, remote controls seem to reproduce at the same
    rate as rabbits. They quickly occupy your whole coffee table, and you have to
    feed them with expensive batteries that you don’t have at home when you need them
    during a Sunday evening football game. Universal remote controls reduce the pain
    a bit, but even the most expensive products aren’t perfect.


    Although we use remote controls every day, few of us understand how they work.
    In this chapter, you’ll find out how remote controls work from the inside out,
    and then you’ll build your own universal remote control that’s better than a store-bought
    one because you can fully customize it to your needs. You can easily add all your
    favorite functions, and you can also add functions other remotes don’t offer.
    If a commercial product doesn’t support a certain vendor, you’re usually stuck.
    With your own remote, you can easily add new protocols yourself. It’s even possible
    not only to support infrared but to add more transmission technologies such as
    Bluetooth or WiFi.


    You’ll get started by learning the basics of infrared light signals, and you’ll
    quickly build your first project using an infrared sensor to grab control codes
    from any remote you have on hand. Once you grab the control codes, you can emit
    them using an infrared LED, and you’ll start to build your own universal remote
    control.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/dcfd13a1bf99c4d3f9996627012a6526_202_0.png)


    Then we''ll even take the idea of a remote control a step further. Once we have
    a universal remote, we''ll control the Arduino itself using the serial port or
    an Ethernet connection. This way, you can control the Arduino using a web browser,
    so you can control your TV set or DVD recorder using the Internet (see Figure
    9.1).




    +   1. An Ethernet shield for the Arduino.

    +   2. A breadboard.

    +   3. An infrared receiver, preferably the PNA4602.

    +   4. A 100Ω resistor.

    +   5. An infrared LED.

    +   6. Some wires.

    +   7. One or more infrared remote controls. They can be from your TV set, DVD
    player, or your Mac. To follow the chapter’s examples, it’d be best to have a
    Mac and an Apple Remote. but it’s not necessary. If you’re not using an Apple
    Remote, be sure to adjust the protocol name, bit length, and control codes in
    the examples accordingly. If you’re using a remote control belonging to a Sony
    TV set, for example, set the protocol name to SONY (you’ll learn more about this
    in Section 9.3, Grabbing Remote Control Codes, on page 205).

    +   8. An Arduino board such as the Uno, Duemilanove, or Diecimila.

    +   9. A USB cable to connect the Arduino to your computer.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/dcfd13a1bf99c4d3f9996627012a6526_203_0.png)


    Figure 9.2: All the parts you need in this chapter


    # 9.2 Understanding Infrared Remote Controls


    To control a device such as a TV set wirelessly, you need a sender and a receiver.
    The receiver usually is built into the device to be controlled, and the sender
    is part of a separate remote control. Although you can choose from a variety of
    technologies such as Bluetooth or WiFi, most modern remote controls still use
    infrared light for communication.


    Using infrared light for transmitting signals has several advantages. It is invisible
    to human beings, so it doesn''t bother you. Also, you can generate it cheaply
    with infrared LEDs that can be integrated easily into electronic circuits. So,
    for many purposes such as controlling devices in a typical household, it''s an
    excellent choice.


    But it also has some drawbacks. It doesn''t work through walls or doors, and the
    distance between the remote control and the operated device is fairly limited.
    Even more importantly, the infrared signal is subject to interference with other
    light sources.'
