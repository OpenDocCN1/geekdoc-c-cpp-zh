  md: '![](img/dcfd13a1bf99c4d3f9996627012a6526_42_0.png)


    Figure 1.12: Connect an LED to the Arduino.


    # 1.8 What If It Doesn''t Work?


    Don''t panic! If it doesn''t work, you''ve probably attached the LED in the wrong
    way. When assembling an electronics project, parts fall into two categories: those
    you can mount any way you like and those that need a special direction. An LED
    has two connectors: an anode (positive) and a cathode (negative). It''s easy to
    mix them up, and my science teacher taught me the following mnemonic: the cathode
    is necative. It''s also easy to remember what the negative connector of an LED
    is: it is shorter, minus, less than. If you are a more positive person, then think
    of the anode as being bigger plus more. You can alternatively identify a LED''s
    connectors using its case. On the negative side the case is flat, while it''s
    round on the positive side.'
