- pgno: 112
  md: 'In some cases, you can still get the best of both worlds: float support without
    paying the memory tax. You can save a lot of space by converting the float values
    to integers before sending them over a serial connection. To transfer values with
    a precision of two digits, multiply them by 100, and do not forget to divide them
    by 100 on the receiving side. We will use this trick (including rounding) later.


    # 5.4 Increasing Precision Using a Temperature Sensor


    Support for floating-point numbers is certainly an improvement, but it mainly
