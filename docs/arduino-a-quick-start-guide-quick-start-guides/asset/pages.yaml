- pgno: 103
  md: '# 5.2 Measuring Distances with an Ultrasonic Sensor


    Measuring distances automatically and continuously comes in handy in many situations.
    Think of a robot that autonomously tries to find its way or of an automatic burglar
    alarm that rings a bell or calls the police whenever someone is too near to your
    house or to the Mona Lisa. All this is possible with Arduino. But before you can
    create that burglar alarm or robot, you need to understand some key concepts.


    Many different types of sensors for measuring distances are available, and the
    Arduino plays well with most of them. Some sensors use ultrasound, while others
    use infrared light or even laser. But in principle all sensors work the same way:
    they emit a signal, wait for the echo to return, and measure the time the whole
    process took. Because we know how fast sound and light travel through the air,
    we can then convert the measured time into a distance.


    In our first project, we will build a device that measures the distance to the
    nearest object and outputs it on the serial port. For this project, we use the
    Parallax PING))) ultrasonic sensor,² because it’s easy to use, comes with excellent
    documentation, and has a nice feature set. It can detect objects in a range between
    2 centimeters and 3 meters, and we use it directly with a breadboard, so we do
    not have to solder. It’s also a perfect example of a sensor that provides information
    via variable-width pulses (more on that in a few paragraphs). With the PING)))
    sensor, we can easily build a sonar or a robot that automatically finds its way
    through a maze without touching a wall.


    As mentioned earlier, ultrasonic sensors usually do not return the distance to
    the nearest object. Instead, they return the time the sound needed to travel to
    the object and back to the sensor. The PING))) is no exception (see Figure 5.2,
    on the next page), and its innards are fairly complex. Fortunately, they are hidden
    behind three simple pins: power, ground, and signal.


    This makes it easy to connect the sensor to the Arduino. First, connect Arduino’s
    ground and 5V power supply to the corresponding PING))) pins. Then connect the
    PING)))’s sensor pin to one of the Arduino’s digital IO pins (we’re using pin
    7 for no particular reason). For a diagram of our circuit, see Figure 5.3, on
    the following page, and for a photo see Figure 5.5, on page 108.


    2. http://www.parallax.com/StoreSearchResults/tabid/768/txtSearch/28015/List/0/SortField/4/ProductID/92/Default.aspx'
