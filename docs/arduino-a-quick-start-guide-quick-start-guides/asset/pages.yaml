    object is away from the PING))) sensor. Finally, it sets the stroke width to 10,
    so we can visualize the sensor with a single point that is 10 pixels wide.


    Processing calls the draw() method automatically at a certain frame rate (default
    is 60 frames per second), and it is the equivalent of the Arduino''s loop() method.
    In our case, we initialize the screen and calculate coordinates lying on a circle.
    The circle''s radius depends on the distance we have from the Arduino, so we have
    a point that moves on a circle. Its distance to the circle''s center depends on
    the data we measure with the PING))) sensor.'
