  md: 'At the end of the method, we wait for two seconds until the game starts again,
    and we set back the current guess to zero.


    After you’ve uploaded the software to the Arduino, start the IDE’s serial monitor.
    It will print the current value of the guess variable whenever you press the guess
    button. Press the start button, and the new result appears. In Figure 3.12, on
    the preceding page, you can see a typical output of our binary dice.


    In this chapter, you completed your first really complex Arduino project. You
    needed a breadboard, LEDs, buttons, resistors, and wires, and you wrote a nontrivial
    piece of software to make all the hardware come to life.


    In the next chapter, we’ll write an even more sophisticated program for generating
    Morse code. You’ll also learn how to create your own Arduino libraries that you
    can easily share with the rest of the world.


    # 3.8 What If It Doesn’t Work?


    A lot of things will probably go wrong when you work with breadboards for the
    first time. The biggest problem usually is that you didn’t connect parts correctly.
    It takes some time to find the right technique for plugging LEDs, wires, resistors,
    and buttons into the breadboard. You have to press firmly but not too hard—otherwise
    you’ll bend the connectors, and they won’t fit. It’s usually easier to plug parts
    in after you’ve shortened the connectors. When cutting the connectors, wear safety
    glasses to protect your eyes!


    While fiddling around with the parts, don’t forget that some of them—LEDs, for
    example—need a certain direction. Pushbuttons are candidates for potential problems,
    too. Take a close look at the pushbuttons on page 74 and make sure that you’ve
    mounted them in the right direction.


    Even simple things such as ordinary wires can lead to problems, especially if
    they aren’t the right length. If a wire is too short and might potentially slip
    out of its socket, replace it immediately. Wires are too cheap to waste your valuable
    time with unnecessary and annoying debugging sessions.'
