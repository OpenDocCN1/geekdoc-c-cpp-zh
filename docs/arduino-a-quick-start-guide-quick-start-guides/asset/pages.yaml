  md: '![](img/dcfd13a1bf99c4d3f9996627012a6526_33_0.png)


    Figure 1.7: The IDE’s toolbar gives you quick access to important functions.


    It has no advanced features such as a debugger or code completion. You can change
    only a few preferences, and as a Java application it does not fully integrate
    into the Mac desktop. It’s still usable, though, and even has decent support for
    project management.


    In Figure 1.7, you can see the IDE’s toolbar that gives you instant access to
    the functions you’ll need most:


    +   - With the Verify button, you can compile the program that’s currently in
    the editor. So, in some respects, “Verify” is a bit of a misnomer, because clicking
    the button does not only verify the program syntactically. It also turns it into
    a representation suitable for the Arduino board.

    +   - The New button creates a new program by emptying the content of the current
    editor window. Before that happens, the IDE gives you the opportunity to store
    all unsaved changes.

    +   - With Open, you can open an existing program from the file system.

    +   - Save saves the current program.

    +   - When you click the Upload button, the IDE compiles the current program and
    uploads it to the Arduino board you have chosen in'
