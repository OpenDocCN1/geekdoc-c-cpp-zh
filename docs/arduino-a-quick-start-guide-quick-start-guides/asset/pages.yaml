    \ * SUPPLY_VOLTAGE / 1024;\n  const float celsius = (voltage * 1000 - 500) / 10;\n\
    #ifdef CELSIUS\n  Serial.print(celsius);\n  Serial.println(\" C\");\n#else\n \
    \ Serial.print(9.0 / 5.0 * celsius + 32.0);\n  Serial.println(\" F\");\n#endif\n\
    \  delay(5000);\n}\n```\n\nThis is nearly the same sketch we have used before.\
    \ Keep in mind that you have to set SUPPLY_VOLTAGE to 3.3 in line 5, if you’re\
    \ using an Arduino that runs with 3.3V instead of 5V.\n\nWe support both Celsius\
    \ and Fahrenheit values now, and you can control which unit should be used with\
    \ a preprocessor constant. If you set the constant CELSIUS in the first line,\
    \ the application outputs the temperature in degree Celsius. If you remove the\
    \ first line or turn it into a comment line, Fahrenheit will be used.\n\nTo change\
    \ the application’s behavior, we use the #ifdef preprocessor directive. It checks\
    \ whether a certain preprocessor constant has been set, and then it compiles code\
    \ conditionally. In our case, it will compile the Celsius-to-Fahrenheit formula\
    \ in line 19 only if the constant CELSIUS has not been set.\n\nUpload the sketch,\
    \ and it will output the current temperature to the serial port every five seconds.\
    \ Its output looks as follows:\n\n```\n27.15 C\n26.66 C\n27.15 C\n```\n\nWhat\
    \ we need now is a program running on your PC that reads this output and tweets\
    \ a message as soon as the temperature is greater than 32 degrees Celsius (90\
    \ degrees Fahrenheit). We could use any programming language that is capable of\
    \ reading from a serial port and that supports Twitter, but because we have used\
