  md: '# Figure 1.1. You can choose from many different Arduinos.


    Seeeduino, Boarduino, and the amazing Paperduino, an Arduino clone without a printed
    circuit board. All its parts are attached to an ordinary piece of paper.


    Arduino is a registered trademark—only the official boards are named "Arduino."—so
    clones usually have names ending with "duino." You can use every clone that is
    fully compatible with the original Arduino to build all the book''s projects.




    In Figure 1.2, on the next page, you can see a photo of an Arduino Uno board and
    its most important parts. I''ll explain them one by one. Let''s start with the
    USB connector. To connect an Arduino to your computer,'
