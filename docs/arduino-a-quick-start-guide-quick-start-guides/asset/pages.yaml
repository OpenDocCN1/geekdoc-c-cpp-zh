- pgno: 184
  md: "# More Fun with Networking Arduinos\n\nWearables and e-textiles are getting\
    \ more and more popular, and they’re still a good way to impress your colleagues\
    \ and friends. Different types of interactive T-shirts are available in every\
    \ well-assorted geek shop. Some of them show the current WiFi strength, while\
    \ others come with a full-blown equalizer that analyzes ambient noise.\n\nWith\
    \ an Arduino Lilypad,* a Bluetooth dongle, and an Android phone, you can build\
    \ a T-shirt that displays the current number of unread emails in your inbox.†\n\
    \nNot only can you show the number of unread email messages on your T-shirt, you\
    \ can also show your current mood using a pointer device on your desk—at least\
    \ as long as you announce it in an IRC channel that you monitor with an Arduino.‡\n\
    \nAlthough not built with Arduinos, the Luminet project§ is very impressive. It\
    \ is a network of interconnected intelligent LED pixels, and the Luminet team\
    \ used it to build a really cool interactive jacket.\n\n+   *.\thttp://arduino.cc/en/Main/ArduinoBoardLilyPad\n\
    +   †.\thttp://blog.makezine.com/archive/2010/03/email-counting_t-shirt.html\n\
    +   ‡.\thttp://blog.makezine.com/archive/2010/01/arduino_powered_mood_meter.html\n\
    +   §.\thttp://luminet.cc\n\n```\nConnecting...connected.\n\n55480 10-10-11 13:32:23\
    \ 28 0 0 579.9 UTC(NIST) *\nDisconnecting.\nConnecting...connected.\n\n55480 10-10-11\
    \ 13:32:26 28 0 0 34.5 UTC(NIST) *\nDisconnecting.\n```\n\nWe’re done! Our Arduino\
    \ is directly connected to the Internet, and it even does something useful: we’ve\
    \ turned it into a very accurate clock.\n\nAll in all, networking with an Arduino\
    \ doesn’t differ much from networking with a PC, if you use the Ethernet shield.\
    \ In the next section, you’ll learn how to send emails with an Arduino."
