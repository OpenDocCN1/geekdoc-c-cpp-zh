- pgno: 261
  md: "```\nmaik> gem install serialport\n```\n\nUsing it, you can connect to the\
    \ Arduino in just 30 lines of code.\n\nDownload SerialProgramming/ruby/analog_reader.rb\n\
    \n```\nrequire 'rubygems'\nrequire 'serialport'\n\nif ARGV.size != 1\n  puts \"\
    You have to pass the name of a serial port.\"\n  exit 1\nend\n\nport_name = ARGV[0]\n\
    baud_rate = 9600\ndata_bits = 8\nstop_bits = 1\nparity    = SerialPort::NONE\n\
    \narduino = SerialPort.new(\n  port_name,\n  baud_rate,\n  data_bits,\n  stop_bits,\n\
    \  parity\n)\n\nsleep 2\nwhile true\n  arduino.write \"a0\"\n  line = arduino.gets.chomp\n\
    \  puts line\nend\n```\n\nWe create a new SerialPort object in line 15, passing\
    \ it all the usual parameters. After we sleep for two seconds, we start a loop\
    \ and call write() on the SerialPort object. To get the result back from the Arduino,\
    \ we call gets() and then we print the result to the console. Here you can see\
    \ the program in action:\n\n```\nmaik> ruby analog_reader.rb /dev/tty.usbserial-A60061a3\n\
    a0: 496\na0: 456\na0: 382\n^Canalog_reader.rb:21:in `gets': Interrupt\n  from\
    \ analog_reader.rb:21\n```\n\nUsing Ruby for accessing an Arduino is a good choice,\
    \ because you can fully concentrate on your application. All the ugly real-world\
    \ details you have to deal with in other programming languages are well hidden."
