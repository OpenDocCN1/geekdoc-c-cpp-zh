- pgno: 130
  md: '# 5.10  What If It Doesn’t Work?


    See Section 3.8, *What If It Doesn’t Work?*, on page 86, and make sure that you
    have connected all parts properly to the breadboard. Take special care with the
    PING))) and the TMP36 sensors, because you haven’t worked with them before. Make
    sure you have connected the right pins to the right connectors of the sensors.


    In case of any errors with the software—no matter if it’s Processing or Arduino
    code—download the code from the book’s website and see whether it works.


    If you have problems with serial communication, double-check whether you have
    used the right serial port and the right Arduino type. It might be that you have
    connected your Arduino to another port. In this case, you have to change the index
    0 in the statement `arduinoPort = new Serial(this, Serial.list()[0], 9600);` accordingly.
    Also check whether the baud rate in the Processing code and serial monitor matches
    the baud rate you have used in the Arduino code. Make sure that the serial port
    is not blocked by another application like a serial monitor window you forgot
    to close, for example.


    # 5.11  Exercises


    +   - Build an automatic burglar alarm that shows a stop sign whenever someone
    is too close to your computer.⁷ Make the application as smart as possible. For
    example, it should have a small activation delay to prevent it from showing a
    stop sign immediately when it’s started.

    +   - The speed of sound not only depends on the temperature but also on humidity
    and atmospheric pressure. Do some research to find the right formula and the right
    sensors.⁸ Use your research results to make our circuit for measuring distances
    even more precise.

    +   - Use an alternative technology for measuring distances, for example, an infrared
    sensor. Try to find an appropriate sensor, read its data sheet, and build a basic
    circuit so you can print the distance to the nearest object to the serial port.


    7. You can find a stop sign here: http://en.wikipedia.org/wiki/File:Stop_sign_MUTCD.svg.

    8. Try http://parallax.com.'
