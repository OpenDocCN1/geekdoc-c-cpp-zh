- pgno: 15
  md: 'into any problems, you’ll find a list of exercises to build your skills at
    the end of every chapter.


    All the projects in this book have been tested on the Arduino Uno, the Arduino
    Duemilanove, and with the Arduino IDE versions 18 to 21. If possible, you should
    always use the latest version.


    # Arduino Uno and the Arduino Platform


    After releasing several Arduino boards and Arduino IDE versions, the Arduino team
    decided to specify a version 1.0 of the platform. It will be the reference for
    all future developments, and they announced it on the first day of 2010.³ Since
    then, they have released the Arduino Uno, and they have also improved the IDE
    and its supporting libraries step-by-step.


    At the moment of this writing, it is still not completely clear what Arduino 1.0
    will look like. The Arduino team tries to keep this release as backward compatible
    as possible. This book is up-to-date for the new Arduino Uno boards. All the projects
    will also work with older Arduino boards such as the Duemilanove or Diecimila.
    This book is current for version 21 of the Arduino platform. You can follow the
    progress of the Arduino platform online.⁴


    # Code Examples and Conventions


    Although this is a book about open source hardware and electronics, you will find
    a lot of code examples. We need them to bring the hardware to life and make it
    do what we want it to do.


    We use C/C++ for all programs that will eventually run on the Arduino. For applications
    running on our PC, we use Processing,⁵ but in Section C.2, Serial Communication
    Using Various Programming Languages, on page 253, you’ll also learn how to use
    several other programming languages to communicate with an Arduino.


    Whenever you find a slippery road icon beside a paragraph, slow down and read
    carefully. They announce difficult or dangerous techniques.


