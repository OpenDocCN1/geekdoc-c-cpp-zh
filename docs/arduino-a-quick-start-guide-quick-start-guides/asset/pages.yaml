    \      sensorData.addData(data[2], data[3], data[4]);\n\n        final float gx\
    \ = MX * sensorData.getX() + BX;\n        final float gy = MY * sensorData.getY()\
    \ + BY;\n        final float gz = MZ * sensorData.getZ() + BZ;\n\n        xrotate\
    \ = atan2(gx, sqrt(gy * gy + gz * gz));\n        yrotate = atan2(gy, sqrt(gx *\
    \ gx + gz * gz));\n        zrotate = atan2(sqrt(gx * gx + gy * gy), gz);\n   \
    \ }\n    }\n}\n```\n\nReading, splitting, and converting the data we read from\
