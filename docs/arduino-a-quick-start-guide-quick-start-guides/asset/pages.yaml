    stand-alone projects. After you have worked through this chapter, you''ll know
    how to work with LEDs, buttons, breadboards, and resistors. Combining these parts
    with an Arduino gives you nearly endless opportunities for new and cool projects.


    Our first project will be creating an electronic die. While regular dice display
    their results using one to six dots, ours will use LEDs instead. For our first
    experiments, a single LED has been sufficient, but for the dice we need more than
    one. You need to connect several external LEDs to the Arduino. Because you cannot
    attach them all directly to the Arduino, you''ll learn how to work with breadboards.
