- pgno: 52
  md: '# Fashionable LEDs


    Both pervasive and wearable computing got very popular over the past years, so
    T-shirts with an equalizer are still cool but not that exciting any longer.* But
    by using a few LEDs, you can create some astonishing accessories for the ladies.
    For example, Japanese engineers have created LED eyelashes.†


    This particular product does not use an Arduino, but with the Lilypad,‡ you can
    easily create similar things yourself. You have to be extremely careful with LEDs,
    because most of them are very bright and can cause serious damage to your eyes!


    * http://www.thinkgeek.com/tshirts-apparel/interactive/8a5b/

    † http://blog.makezine.com/archive/2009/10/led_eyelashes.html

    ‡ http://www.arduino.cc/en/Main/ArduinoBoardLilyPad


    If the byte we have read represents the character 1, we switch on the LED and
    send back the message “LED on” over the serial port. We use Serial.println(),
    which adds a carriage return character (ASCII code 13) followed by a newline (ASCII
    code 10) to the text.


    If we received the character 2, we switch off the LED. If we received an unsupported
    command, we send back a corresponding message and the command we did not understand.
    Serial.print() works exactly like Serial.println(), but it does not add carriage
    return and newline characters to the message.


    Let’s see how the program works in practice. Compile it, upload it to your Arduino,
    and then switch to the serial monitor (optionally you can attach an LED to pin
    13; otherwise, you can only control the Arduino’s status LED). At first glance,
    nothing has happened. That’s because we have not sent a command to the Arduino
    yet. Enter a 1 in the text box, and then click the Send button. Two things should
    happen now: the LED is switched on, and the message “LED on” appears in the serial
    monitor window (see Figure 2.4, on the next page). We are controlling a LED using
    our computer’s keyboard!


    Play around a bit with the commands 1 and 2, and also observe what happens when
    you send an unknown command. If you type in an uppercase A, for example, the Arduino
    will send back the message “Unknown command: 65.” The number 65 is the ASCII code
    of the letter A, and the Arduino outputs the data it got in its most basic form.'
  merge: -1
