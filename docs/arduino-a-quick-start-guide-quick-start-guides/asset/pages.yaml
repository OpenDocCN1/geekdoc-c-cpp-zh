- pgno: 43
  md: 'Choosing the wrong serial port or Arduino type also is a common mistake. If
    you get an error message such as “Serial port already in use” when uploading a
    sketch, check whether you have chosen the right serial port from the Tools > Serial
    Port menu. If you get messages such as “Problem uploading to board” or “programmer
    is not responding,” check whether you have chosen the right Arduino board from
    the Tools > Board menu.


    Your Arduino programs, like all programs, will contain bugs. Typos and syntax
    errors will be detected by the compiler. In Figure 1.13, on the following page,
    you can see a typical error message. Instead of pinMode(), we called pinMod(),
    and because the compiler did not find a function having that name, it stopped
    with an error message. The Arduino IDE highlights the line, showing the error
    with a yellow background, and prints a helpful error message.


    Other bugs might be more subtle and sometimes you have to carefully study your
    code and use some plain old debugging techniques (in Debug It! Find, Repair, and
    Prevent Bugs in Your Code [But09] you can find plenty of useful advice on this
    topic).


    It might happen—although it’s rare—that you actually have a damaged LED. If none
    of the tricks mentioned helps, try another LED.


    # 1.9 Exercises


    +   - Try different blink patterns using more pauses and vary the pause length
    (they don’t necessarily have to be all the same). Also, experiment with very short
    pauses that make the LED blink at a high frequency. Can you explain the effect
    you’re observing?

    +   - Let the LED output your name in Morse code.¹⁴'
