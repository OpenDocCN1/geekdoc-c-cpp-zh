- pgno: 97
  md: 'Lines starting with a # character contain comments and will be ignored. The
    remaining lines contain the name of one of the library''s members and the member''s
    type. Separate them with a tab character. Classes have the type KEYWORD1, while
    functions have the type KEYWORD2. For constants, use LITERAL1.


    To enable syntax coloring for the telegraph library, copy keywords.txt to the
    libraries folder, and restart the IDE. Now the name of the Telegraph class will
    be orange, and send_message() will be colored brown.


    Before you finally publish your library, you should add a few more things:


    +   - Store all example sketches in a folder named examples, and copy it to the
    libraries folder. Every example sketch should get its own subdirectory within
    that folder.

    +   - Choose a license for your project, and copy its terms into a file named
    LICENSE.⁴ You might think this is a bit over the top for many libraries, but it
    will give your potential audience confidence.

    +   - Add installation instructions and documentation. Usually, users expect to
    find documentation in a file named README, and they will look for installation
    instructions in a file named INSTALL. You should try to install your library on
    as many operating systems as possible and provide installation instructions for
    all of them.


    After you''ve done all this, your library folder should look like Figure 4.2,
    on the following page.


    Finally, create a ZIP archive containing all the files in your project. On most
    operating systems, it''s sufficient to right-click the directory in the Explorer,
    Finder, or whatever you are using and turn the directory into a ZIP archive. On
    Linux systems and on a Mac, you can also use one of the following command-line
    statements to create an archive:


    ```

    mai k> zip -r Telegraph Telegraph

    mai k> tar cfvz Telegraph.tar.gz Telegraph

    ```


    The first command creates a file named Telegraph.zip, and the second one creates
    Telegraph.tar.gz. Both formats are widespread, and it''s best to offer them both
    for download.


    4. At http://www.opensource.org/, you can find a lot of background information
    and many standard licenses.'
