    it, you’re surrounded by stepper motors. You hear them when your printer, scanner,
    or disk drive is at work. Controlling stepper motors isn’t rocket science, but
    it is a bit more complicated than controlling DC motors and servos.


    Servo motors are the most popular among hobbyists, because they are a good compromise
    between DC motors and steppers. They’re affordable, reliable, and easy to control.
    You can move standard servos only in a range of 180 degrees, but that’s sufficient
    for many applications. With continuous rotation servos, you can increase the range
    to 360 degrees, but you lose the ease of control.


    In the next section, you’ll learn how easy it is to control standard servo motors
    with an Arduino.


