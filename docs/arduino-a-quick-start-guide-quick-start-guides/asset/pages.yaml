- pgno: 138
  md: "```\nvoid setup() {\n    Serial.begin(BAUD_RATE);\n}\n\nint get_axis(const\
    \ int axis) {\n    delay(1);\n    buffer[axis][buffer_pos[axis]] = analogRead(PINS[axis]);\n\
    \    buffer_pos[axis] = (buffer_pos[axis] + 1) % BUFFER_SIZE;\n\n    long sum\
    \ = 0;\n    for (int i = 0; i < BUFFER_SIZE; i++)\n        sum += buffer[axis][i];\n\
    \    return round(sum / BUFFER_SIZE);\n}\n\nint get_x() { return get_axis(0);\
    \ }\nint get_y() { return get_axis(1); }\nint get_z() { return get_axis(2); }\n\
    \nvoid loop() {\n    Serial.print(get_x());\n    Serial.print(\" \");\n    Serial.print(get_y());\n\
    \    Serial.print(\" \");\n    Serial.println(get_z());\n}\n```\n\nAs usual, we\
    \ define some constants for the pins we use first. This time, we also define a\
    \ constant named NUM_AXES that contains the amount of axes we are measuring. We\
    \ also have an array named PINS that contains a list of the pins we use. This\
    \ helps us keep our code more generic later.\n\nIn line 11, we declare buffers\
    \ for all axes. They will be filled with the sensor data we measure, so we can\
    \ calculate average values when we need them. We have to store our current position\
    \ in each buffer, so in line 12, we define an array of buffer positions.\n\nsetup()\
    \ only initializes the serial port, and the real action takes place in the get_axis()\
    \ function. It starts with a small delay to give the Arduino some time to switch\
    \ between analog pins; otherwise, you might get bad data. Then it reads the acceleration\
    \ for the axis we have passed and stores it at the current buffer position belonging\
    \ to the axis. It increases the buffer position and sets it back to zero when\
    \ the end of the buffer has been reached. Finally, we return the average value\
    \ of the data we have gathered so far for the current axis."
