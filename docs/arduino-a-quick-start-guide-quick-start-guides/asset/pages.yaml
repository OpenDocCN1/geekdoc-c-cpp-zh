- pgno: 246
  md: '# Appendix B


    # Advanced Arduino Programming


    In reality, the Arduino programming language is nothing but C++, but it has some
    restrictions, and it uses a special tool suite. In this appendix, you''ll learn
    what the restrictions are. Also, you''ll find a short section showing how bit
    operators work, because you need them often when working with sensors and other
    devices.


    # B.1 The Arduino Programming Language


    The first sketches you''ll write for an Arduino might seem to be written in a
    special “Arduino Language,” but they aren''t. To program the Arduino, you usually
    use plain old C/C++ and have to cross-compile your source code into machine code
    suitable for the Arduino''s microcontroller.


    These microcontrollers are all part of the AVR family produced by a company named
    Atmel. To make software development for AVR microcontrollers as easy as possible,
    Atmel has developed a whole tool chain based on the GNU compiler tools. All tools
    work like the originals, but they have been optimized for generating code for
    the AVR microcontrollers.


    For nearly all GNU development tools such as gcc, ld, or as, there''s an AVR variant:
    avr-gcc, avr-ld, and so on. You can find them in the hardware/tools/bin directory
    of the Arduino IDE.


    The IDE is mainly a graphical wrapper that helps you avoid using the command-line
    tools directly. Whenever you compile or upload a program using the IDE, it delegates
    all work to the AVR tools. As a serious software developer, you should turn on
    a more verbose output, so you can see all command-line tool invocations. Edit
    preferences.txt as'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'described in Section 2.3, *Changing Preferences*, on page 48, and set both
    build.verbose and upload.verbose to true. Then load our blinking LED sketch and
    compile it. The output in the message panel should look similar to Figure 2.3,
    on page 50.


    The command invocations look a bit weird at first, because of the names of the
    many temporary files that are created. You should still be able to identify all
    compile and link steps that are necessary to build even a simple sketch like our
    blinking LED example. That’s the most important thing that the Arduino team did:
    they hid all these nasty details well behind the IDE, so even people with no software
    development experience are able to program the Arduino. For programmers, it’s
    a good idea to work in verbose mode, because the best way to learn about all the
    AVR tools is to see them in action.


    Upload the program to the Arduino now to see avrdude in action. This tool is responsible
    for loading code into the Arduino and can be used for programming many other devices,
    too. Interestingly, the AVR tools make it even possible to use the Arduino IDE
    for non-Arduino projects such as the Meggy Jr.¹


    “But wait!” you say, “I’m a C++ programmer, and I’m missing a main() function!”
    And you’re right: that’s another difference between Arduino programming and regular
    old C++ code. When programming for the Arduino, you don’t define main() yourself,
    because it is already defined in the libraries provided by the Arduino developers.
    As you might have guessed, it calls setup() first and then runs the loop() function
    in a loop.


    There are further restrictions when programming C++ on AVR microcontrollers:²


    +   - You cannot use the Standard Template Library (STL), because it’s way too
    big for the small AVR microcontrollers.


    +   - Exception handling is not supported. That’s why you see the -fno-exceptions
    switch often when the avr-gcc compiler is invoked.


    +   - Dynamic memory management using new() and delete() is currently not supported.


    In addition to all that, you should keep an eye on performance. For example, C++
    automatically creates a lot of functions (copy construc-


