  md: '![](img/dcfd13a1bf99c4d3f9996627012a6526_34_0.png)


    Figure 1.8: The Arduino board comes with several LEDs.


    the IDE''s Tools > Serial Port menu (you''ll learn more about this in Section
    1.6, Compiling and Uploading Programs, on page 38).


    +   - The Arduino can communicate with a computer via a serial connection. Clicking
    the Serial Monitor button opens a serial monitor window that allows you to watch
    the data sent by an Arduino and also to send data back.


    +   - The Stop button stops the serial monitor.


    Although using the IDE is easy, you might run into problems or want to look up
    something special. In such cases, take a look at the Help menu. It points to many
    useful resources at the Arduino''s website that provide quick solutions not only
    to all typical problems but also to reference material and tutorials.


    To get familiar with the IDE''s most important features, we''ll create a simple
    program that makes an light-emitting diode (LED) blink. An LED is a cheap and
    efficient light source, and the Arduino already comes with several LEDs. One LED
    shows whether the Arduino is currently powered, and two other LEDs blink when
    data is transmitted or received via a serial connection (see them in Figure 1.8).


    In our first little project, we''ll make the Arduino''s status LED blink. The
    status LED is connected to digital IO pin 13. Digital pins act as a kind of switch
    and can be in one of two states: HIGH or LOW. If set to HIGH, the output pin is
    set to 5 volts, causing a current to flow through the LED, so it lights up. If
    it''s set back to LOW, the current flow stops, and the LED turns off. You do not
    need to know exactly how electricity works at the moment, but if you''re curious,
    take a look at Section A.1, Current, Voltage, and Resistance, on page 237.'
