- pgno: 35
  md: "Open the IDE, and enter the following code in the editor:\n\n```\nDownload\
    \ welcome/HelloWorld/HelloWorld.pde\nconst unsigned int LED_PIN = 13;\nconst unsigned\
    \ int PAUSE = 500;\n\nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n}\n\nvoid loop()\
    \ {\n  digitalWrite(LED_PIN, HIGH);\n  delay(PAUSE);\n  digitalWrite(LED_PIN,\
    \ LOW);\n  delay(PAUSE);\n}\n```\n\nLet’s see how this works and dissect the program’s\
    \ source code piece by piece. In the first two lines we define two int constants\
    \ using the const keyword. LED_PIN refers to the number of the digital IO pin\
    \ we’re using, and PAUSE defines the length of the blink period in milliseconds.\n\
    \nEvery Arduino program needs a function named setup(), and ours starts in line\
    \ 4. A function definition always adheres to the following scheme:\n\n<return\
    \ value type> <function name> '(' <list of parameters> ')'\n\nIn our case the\
    \ function’s name is setup(), and its return value type is void: it returns nothing.\
    \ setup() doesn’t expect any arguments, so we left the parameter list empty. Before\
    \ we continue with the dissection of our program, you should learn a bit more\
    \ about the Arduino’s data types.\n\n# Arduino Data Types\n\nEvery piece of data\
    \ you store in an Arduino program needs a type. Depending on your needs, you can\
    \ choose from the following:\n\n+   - **boolean** values take up one byte of memory\
    \ and can be **true** or **false**.\n\n+   - **char** variables take up one byte\
    \ of memory and store numbers from -128 to 127. These numbers usually represent\
    \ characters encoded in ASCII; that is, in the following example, c1 and c2 have\
    \ the same value:\n\n```\nchar c1 = 'A';\nchar c2 = 65;\n```\n\nNote that you\
    \ have to use single quotes for **char** literals.\n\n+   - **byte** variables\
    \ use one byte and store values from 0 to 255."
