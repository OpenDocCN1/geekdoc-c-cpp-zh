    # Figure 2.4: The Arduino IDE''s serial monitor


    That''s the default behavior of Serial''s print() method, and you can change it
    by passing a format specifier to your function calls. To see the effect, replace
    line 20 with the following statements:


    ```

    Serial.println(command, DEC);

    Serial.println(command, HEX);

    Serial.println(command, OCT);

    Serial.println(command, BIN);

    Serial.println(command, BYTE);

    ```


    The output looks as follows when you send the character A again:


    ```

    Unknown command: 65

    41

    101

    1000001

    A

    ```


    Depending on the format specifier, Serial.println() automatically converts a byte
    into another representation. DEC outputs a byte as a decimal number, HEX as a
    hexadecimal number, and so on. Note that such an operation usually changes the
    length of the data that gets transmitted. The binary representation of the single
    byte 65, for example, needs 7 bytes, because it contains seven characters.'
