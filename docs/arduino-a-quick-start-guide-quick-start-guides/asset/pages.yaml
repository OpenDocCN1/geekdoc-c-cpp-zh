- pgno: 137
  md: "```\nSerial.print(\", y(\");\nSerial.print(min_y);\nSerial.print(\"/\");\n\
    Serial.print(max_y);\nSerial.print(\", z(\");\nSerial.print(min_z);\nSerial.print(\"\
    /\");\nSerial.print(max_z);\nSerial.println(\")\");\n}\n```\n\nWe declare variables\
    \ for the minimum and maximum values of all three axes, and we initialize them\
    \ with numbers that are definitely out of the sensor’s range (-1000 and 1000).\
    \ In the loop() function, we permanently measure the acceleration of all three\
    \ axes and adjust the minimum and maximum values accordingly.\n\nCompile and upload\
    \ the sketch, then move the breadboard with the sensor in all directions, and\
    \ then tilt it around all axes. Move it slowly, move it fast, tilt it slowly,\
    \ and tilt it fast. Use long wires, and be careful when moving and rotating the\
    \ breadboard so you do not accidentally loosen a connection.\n\nAfter a short\
    \ while the minimum and maximum values will stabilize, and you should get output\
    \ like this:\n\n```\nx(247/649), y(253/647), z(278/658)\n```\n\nWrite down these\
    \ values, because we need them later, and you'll probably need them when you do\
    \ your own sensor experiments.\n\nNow let's see how to get rid of the jitter.\
    \ In principle, it is simple. Instead of returning the acceleration data immediately,\
    \ we collect the last readings and return their average. This way, small changes\
    \ will be ironed out. The code looks as follows:\n\n```\nDownload: MotionSensor/Buffering/Buffering.pde\n\
    Line 1 const unsigned int X_AXIS_PIN = 2;\nconst unsigned int Y_AXIS_PIN = 1;\n\
    const unsigned int Z_AXIS_PIN = 0;\nconst unsigned int NUM_AXES = 3;\n5 const\
    \ unsigned int PINS[NUM_AXES] = {\n  X_AXIS_PIN, Y_AXIS_PIN, Z_AXIS_PIN\n};\n\
    const unsigned int BUFFER_SIZE = 16;\nconst unsigned int BAUD_RATE = 9600;\n10\
    \ int buffer[NUM_AXES][BUFFER_SIZE];\nint buffer_pos[NUM_AXES] = { 0 };\n```"
