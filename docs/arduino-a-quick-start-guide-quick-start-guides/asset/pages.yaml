- pgno: 144
  md: 'Then we define some constants that will help us to customize the game easily:


    ```

    final int COLUMNS = 7;

    final int ROWS = 4;

    final int BALL_RADIUS = 8;

    final int BALL_DIAMETER = BALL_RADIUS * 2;

    final int MAX_VELOCITY = 8;

    final int PADDLE_WIDTH = 60;

    final int PADDLE_HEIGHT = 15;

    final int BRICK_WIDTH = 40;

    final int BRICK_HEIGHT = 20;

    final int MARGIN = 10;

    final int WIDTH = COLUMNS * BRICK_WIDTH + 2 * MARGIN;

    final int HEIGHT = 300;

    final int X_AXIS_MIN = 252;

    final int X_AXIS_MAX = 443;

    final int LINE_FEED = 10;

    final int BAUD_RATE = 19200;

    ```


    Most of these values should be self-explanatory—they define the size of the objects
    that appear on the screen. For example, PADDLE_WIDTH is width of the paddle measured
    in pixels, and COLUMNS and ROWS set the layout of the bricks. You should replace
    X_AXIS_MIN and X_AXIS_MAX the minimum and maximum values you measured for your
    sensor in Section 6.4, Finding and Polishing Edge Values, on page 137.


    Next we choose how to represent the game''s objects:


    ```

    int px, py;

    int vx, vy;

    int xpos = WIDTH / 2;

    int[][] bricks = new int[COLUMNS][ROWS];

    ```


    We store the balls'' current x and y coordinates in px and py. For its current
    x and y velocity, we use vx and vy. We store the paddle''s x position in xpos.


    bricks is a two-dimensional array and contains the current state of the bricks
    on the screen. If an array element is set to 1, the corresponding brick is still
    on the screen. 0 means that it has been destroyed already.


    Finally, we need to store the possible states of the game:


    ```

    boolean buttonPressed = false;

    boolean paused = true;

    boolean done = true;

    ```'
