  md: '# 6.6 Writing Your Own Game


    To test our game controller, we will program a simple Breakout³ clone in Processing.
    The game’s goal is to destroy all bricks in the upper half of the screen with
    a ball. You can control the ball with the paddle at the bottom of the screen,
    and you can tilt the controller around the x-axis to move the paddle horizontally.
    It’ll look something like this:


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_143_0.png)


    Although this is not a book about game programming, it will not hurt to take a
    look at the game’s innards, especially because game programming with Processing
    is really pure fun! Download the code from the book’s website⁴ and play the game
    before you dive into the code.


    Because we will connect our game controller to the serial port, we have to initialize
    it:


    ```

    import processing.serial.*;

    Serial arduinoPort;

    ```


    3. http://en.wikipedia.org/wiki/Breakout_%28arcade_game%29

    4. http://www.pragprog.com/titles/msard'
