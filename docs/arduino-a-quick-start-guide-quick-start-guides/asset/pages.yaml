    +   - One 100Ω resistor, two 10kΩ resistors, and three 1kΩ resistors. It’s also
    not too useful to buy single resistors; buy a value pack such as catalog number
    271-308 from RadioShack.

    +   - Two pushbuttons. Don’t buy a single button switch; buy at least four instead,
    available at RadioShack (catalog number 275-002).'
