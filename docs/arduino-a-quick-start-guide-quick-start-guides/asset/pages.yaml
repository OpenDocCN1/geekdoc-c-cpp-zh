    That''s the whole trick. To see its effect, leave the sensor untouched on your
    desk, and run the program with different buffer sizes. If you do not touch the
    sensor, you would not expect the program''s output to change. But if you set BUFFER_SIZE
    to 1, you will quickly see small changes. They will disappear as soon as the buffer
    is big enough.


    The acceleration data we measure now is sufficiently accurate, and we can finally
    build a game controller that will not annoy users because of unexpected movements.


