  md: '# Some Fun with Sensors


    With an ultrasonic sensor, you can easily detect whether someone is nearby. This
    automatically brings a lot of useful applications to mind. For example, you could
    open a door automatically as soon as someone is close enough.


    Alternatively, you can use advanced technology for pure fun. What about some Halloween
    gimmicks like a pumpkin that shoots silly string whenever you cross an invisible
    line?* It could be a nice gag for your next party, and you can build it using
    the PING))) sensor.†


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_129_0.png)


    So, we''ve seen that there are two types of sensor: digital and analog. You have
    also learned how to connect both types of sensors to the Arduino and how to transfer
    their measurements to your computer. Working with these two different IO types
    is the basis for all physical computing, and nearly every project—no matter how
    complex—is a derivation of the things you have learned in this chapter.


    > * http://www.instructables.com/id/Arduiono-controlled-Silly-String-shooter/


    > † http://arduinofun.com/blog/2009/11/01/silly-string-shooting-spider-contest-entry/'
