    # Figure 6.5: An Arduino prototyping shield


    That’s how it looks inside a typical modern game controller. We will not build
    a fancy housing for the controller, but we still should think about ergonomics
    for a moment. Our current breadboard solution is rather fragile, and you cannot
    really wave around the board when it’s connected to the Arduino. Sooner or later
    you will disconnect some wires, and the controller will stop working.


    To solve this problem, you could try to attach the breadboard to the Arduino using
    some rubber bands. That works, but it does not look very pretty, and it’s still
    hard to handle.


    A much better solution is to use an Arduino Prototyping shield (see Figure 6.5).
    It is a pluggable breadboard that lets you quickly build circuit prototypes. The
    breadboard is surrounded by the Arduino’s pins, so you no longer need long wires.
    Shields are a great way to enhance an Arduino’s capabilities, and you can get
    shields for many different purposes such as adding Ethernet, sound, displays,
    and so on.²


    Using the Proto Shield our game controller looks as in Figure 6.6, on the next
    page. Neat, eh?


