  md: 'Alternatively, Adafruit also sells an Arduino Starter Pack (product ID 170).
    It’s cheaper, but it doesn’t contain as many parts. For example, it doesn’t have
    a Protoshield or a tilt sensor.


    All shops constantly improve their starter packs, so it’s a good idea to scan
    their online catalogs carefully.


    # Complete Parts List


    If you prefer to buy parts piece by piece (or chapter by chapter) rather than
    a starter pack, here is a list of all the parts used in the book. Each chapter
    also has a parts list and photo with all parts needed for that chapter. Suggested
    websites where you can buy the parts are listed here for your convenience, but
    many of these parts are available elsewhere also, so feel free to shop around.


    Good shops for buying individual components parts are RadioShack,¹⁰ Digi-Key,¹¹
    sparkfun,¹² and Mouser.¹³


    +   - An Arduino board such as the Uno, Duemilanove, or Diecimila available from
    Adafruit (product ID 50) or Makershed (product code MKSP4).

    +   - A standard A-B USB cable for USB 1.1 or 2.0. You might already have a few.
    If not, you can order it at RadioShack (catalog number 55011289).

    +   - A half-size breadboard from Makershed (product code MKK N2) or from Adafruit
