    # Figure 9.8: An Ethernet-controllable remote control


    We’ll replace «arduino-ip» with the IP address of the Arduino’s Ethernet shield.
    The element «protocol-name» can be one of the supported protocols (“NEC,” “SONY,”
    “RC5,” or “RC6”). «command-length» specifies the length of the command code in
    bits, and «command-code» contains the command code itself as a decimal number.


    Let’s assume we’d like to send the code for the menu key on an Apple Remote, and
    our Arduino has the IP address 192.168.2.42. Then we’d have to point our web browser
    to the following URL:


    http://192.168.2.42/NEC/32/2011283550


    In this case, the protocol name is NEC, the length of the command code is 32 bits,
    and the command code is 2011283550 (the decimal representation of the hexadecimal
    number 0x77E1C05E).


    We’ve already used the Arduino as a web client in Chapter 8, Networking with Arduino,
    on page 170, but now we need to turn it into a web server. The server waits for
    new HTTP requests like the one shown previously, parses the URL, and emits the
    corresponding infrared signal.


    We’ll hide all these details in a class named InfraredProxy, and to keep things
    as easy and as concise as possible, we’ll make use of both the Ethernet and the
    IRremote library. The InfraredProxy class is still one of the book’s most sophisticated
    examples of Arduino code. Here it is:'
