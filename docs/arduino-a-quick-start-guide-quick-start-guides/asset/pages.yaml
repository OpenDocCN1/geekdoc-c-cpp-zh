- pgno: 249
  md: 'The bit shift operators << and >> let you move bits to a certain position before
    you work with them. The first one moves bits to the left, and the second moves
    them to the right:


    ```

    int x = 42; // In binary this is 101010

    int y = x << 1; // y == 84 == B1010100

    int z = x >> 2; // z == 10 == B1010

    ```


    Shifting operations might seem intuitive, but you have to be careful when shifting
    signed values.³ Although they look similar, binary operators are not the same
    as boolean operators. Boolean operators such as && and || do not operate on the
    bit level. They implement the rules of boolean algebra.⁴'
