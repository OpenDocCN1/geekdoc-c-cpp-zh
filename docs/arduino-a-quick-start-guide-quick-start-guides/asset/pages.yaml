  md: '# Chapter 4


    # Building a Morse Code Generator Library


    You now know enough about the Arduino development environment and about blinking
    LEDs to start a bigger project. In this chapter, we’ll develop a Morse code generator
    that reads text from the serial port and outputs it as light signals using an
    LED.


    By building this project, you’ll deepen your understanding of serial communication
    between the Arduino and your computer. You’ll also learn a lot about the typical
    Arduino development process: how to use existing libraries and how to structure
    bigger projects into your own libraries. At the end, you’ll be able to create
    a library that is ready for publishing on the Internet.


    # 4.1 What You Need


    +   - An Arduino board such as the Uno, Duemilanove, or Diecimila

    +   - A USB cable to connect the Arduino to your computer

    +   - An LED

    +   - A speaker or a buzzer (they are optional)


    # 4.2 Learning the Basics of Morse Code


    Morse code was invented to turn text into sounds.¹ In principle, it works like
    a character set encoding such as ASCII. But while ASCII'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'encodes characters as numbers, in Morse code they''re sequences of dots and
    dashes (also called dits and dahs). Dits are shorter in length than dahs. An A
    is encoded as · – and – – · · is Z.


    Morse code also specifies a timing scheme that defines the length of the dits
    and dahs. It also specifies how long the pauses between symbols and words have
    to be. The base unit of Morse code is the length of a dit, and a dah is as long
    as three dits. You insert a pause of one dit between two symbols, and you separate
    two letters by three dits. Insert a pause of seven dits between two words.


    To transmit a message encoded in Morse code, you need a way to emit signals of
    different lengths. The classic approach is to use sounds, but we will use an LED
    that is turned on and off for varying periods of time. Sailors still transmit
    Morse code using blinking lights.


    Let’s implement a Morse code generator!


    # 4.3 Building a Morse Code Generator


    The main part of our library will be a C++ class named Telegraph. In this section,
    we''ll define its interface, but we will start with a new sketch that looks as
    follows:


    Download Telegraph/telegraph.pde


    ```

    void setup() {

    }


    void loop() {

    }

    ```


    This is the most minimalistic Arduino program possible. It does not do anything
    except define all mandatory functions, even if they are empty. We do this so we
    can compile our work in progress from time to time and check whether there are
    any syntactical errors. Save the sketch as Telegraph, and the IDE will create
    a folder named Telegraph and a file named Telegraph.pde in it. All the files and
    directories we need for our library will be stored in the Telegraph folder.


    Now open a new tab, and when asked for a filename, enter telegraph.h. Yes, we
    will create a good old C header file (to be precise, it will even be a C++ header
    file). The listing in on the next page.'
