    too. Usually, it isn’t necessary.


    # Installing the Arduino IDE on Mac OS X


    The Arduino IDE is available as a disk image for the most recent Mac OS X.⁹ Download
    it, double-click it, and then drag the Arduino icon to your Applications folder.


    If you’re using an Arduino Uno or an Arduino Mega 2560, you are done and can start
    the IDE. Before you can use the IDE with an older Arduino such as the Duemilanove,
    Diecimila, or Nano, you have to install drivers for the Arduino’s serial port.
    A universal binary is in the disk image—double-click the FTDIUSBSerialDriver_10_4_10_5_10_6.pkg
    file for your platform, and follow the installation instructions on the screen.


    When installing a new version of the Arduino IDE, you usually don’t have to install
    the FTDI drivers again (only when a more recent version of the drivers is available).


    # Installing the Arduino IDE on Linux


    Installation procedures on Linux distributions are still not very homogeneous.
    The Arduino IDE works fine on nearly all modern Linux versions, but the installation
    process heavily differs from distribution to distribution. Also, you often have
    to install additional software (the Java virtual machine, for example) that comes
    preinstalled with other operating systems.


    It’s best to check the official documentation¹⁰ and look up the instructions for
    your preferred system.


    Now that we have the drivers and the IDE installed, let’s see what it has to offer.


