- pgno: 185
  md: '# Useful Networking Libraries


    The Ethernet library that comes with the Arduino IDE is fairly limited and not
    very convenient. For example, it doesn’t support DNS or DHCP. So for advanced
    projects, you should have a look at the Arduino Ethernet library.


    If you want to turn your Arduino into a web server, you should take a look at
    the Webduino library. It has some great features, and it is quite mature.


    But be warned: all these libraries consume quite a lot of memory, so there’s not
    much left for your application code. Also, they are rather fragile, because they
    often rely upon the innards of the official Ethernet library that change from
    time to time. So, it might well be that they do not work with the latest Arduino
    IDE.


    # 8.6 Emailing from the Command Line


    Now that we know how to access network services, we’ll continue to build a more
    advanced project: an automatic burglar alarm. In case someone is moving in our
    living room, we want to get an email, so we have to learn how to send emails from
    an Arduino.


    Although email is an important service, only a few people know how it actually
    works behind the scenes. To send emails from an Arduino, we could choose the easy
    path and use a PC as an email relay as we did in Section 8.4, Tweeting Messages
    with Processing, on page 175 to tweet messages. As real hackers, we’ll follow
    a more sophisticated path and implement a subset of the Simple Mail Transfer Protocol
    (SMTP).


    SMTP is a typical Internet protocol. It uses only text, and it is mainly line-based;
    that is, you exchange information line by line. A typical email consists of only
    a few attributes: a sender, a receiver, a subject, and a message body. To transmit
    an email, you have to send a request to an SMTP server. The request has to adhere
    to the SMTP specification.'
  merge: -1
  img_proc: true
- pgno: 186
  md: "Before we send an email using an Arduino and an Ethernet shield, you should\
    \ learn how to send an email from a command line using the telnet command. To\
    \ do so, you have to find out the address of an SMTP server you can use first.\
    \ The following instructions assume you’re using a Google Mail account (http://gmail.com).\
    \ If you use a different email provider, you have to adjust the domain names accordingly.\
    \ In any case, don’t abuse their service! When in doubt, read their usage terms!\n\
    \nOpen a terminal, and enter the following:\n\n```\nmaik> nslookup\n> set type=mx\n\
    > gmail.com\nServer:  192.168.2.1\nAddress:  192.168.2.1#53\nNon-authoritative\
    \ answer:\ngmail.com mail exchanger = 5 gmail-smtp-in.l.google.com.\ngmail.com\
    \ mail exchanger = 10 alt1.gmail-smtp-in.l.google.com.\ngmail.com mail exchanger\
    \ = 20 alt2.gmail-smtp-in.\n> exit\n```\n\nThis command returns a list of all\
    \ the Google Mail exchange servers (MX) available on your network. Take the first\
    \ server name, and open a connection to the SMTP standard port 25 (replace the\
    \ server name gmail-smtp-in.l.google.com and all email addresses accordingly):\n\
    \n```\n⇒ maik> telnet gmail-smtp-in.l.google.com 25\n⇒ Trying 74.125.77.27...\n\
    Connected to gmail-smtp-in.l.google.com.\nEscape character is '^]'.\n220 mx.google.com\
    \ ESMTP q43si10820020eeh.100\n⇒ HELO\n⇒ 250 mx.google.com at your service\n⇒ MAIL\
    \ FROM: <arduino@example.com>\n⇒ 250 2.1.0 OK q43si10820020eeh.100\n⇒ RCPT TO:\
    \ <info@example.com>\n⇒ 250 2.1.5 OK q43si10820020eeh.100\n⇒ DATA\n⇒ 354 Go ahead\
    \ q43si10820020eeh.100\n⇒ from: arduino@example.com\n⇒ to: info@example.com\n\
    ⇒ subject: This is a test\n⇒ \n⇒ Really, this is a test!\n⇒ .\n⇒ 250 2.0.0 OK\
    \ 1286819789 q43si10820020eeh.100\n⇒ QUIT\n⇒ 221 2.0.0 closing connection q43si10820020eeh.100\n\
    Connection closed by foreign host.\n```"
