- pgno: 262
  md: "# Python\n\nPython is another dynamic programming language that you can use\
    \ to quickly create Arduino clients. For programming a serial port, download and\
    \ install the pyserial library first. There is a special installer for Windows,\
    \ but usually it’s sufficient to install it like this:\n\n```bash\nmaik> python\
    \ setup.py install\n```\n\n```\n```python\nimport sys\nimport time\nimport serial\n\
    \nif len(sys.argv) != 2:\n    print \"You have to pass the name of a serial port.\"\
    \n    sys.exit(1)\n\nserial_port = sys.argv[1]\narduino = serial.Serial(\n   \
    \ serial_port,\n    9600,\n    serial.EIGHTBITS,\n    serial.PARITY_NONE,\n  \
    \  serial.STOPBITS_ONE\n)\n\ntime.sleep(2)\n\nwhile 1:\n    arduino.write('a0')\n\
    \    line = arduino.readline().rstrip()\n    print line\n```\n```\n\nWe make sure\
    \ that we have the name of a serial port on the command line. Then we create a\
    \ new Serial object in line 10, passing it all the parameters we'd like to use\
    \ for serial communication.\n\nAfter sleeping for two seconds, we start an infinite\
    \ loop. In the loop, we send the string \"a0\" to the serial port calling write().\
    \ We read the result returned by the Arduino using the readline() method and output\
    \ the result to the console. Here's what a typical session looks like:\n\n```\n\
    ```bash\nmaik> python analog_reader.py /dev/tty.usbserial-A6006la3\na0: 497\n\
    a0: 458\na0: 383\n^C\n```\n```"
  merge: -1
  img_proc: true
- pgno: 263
  md: "Isn't that code beautiful? With about 20 lines of Python code, you get full\
    \ control over your Arduino sketch. So, Python is another excellent choice for\
    \ writing Arduino clients.\n\n# Perl\n\nPerl is still one of the most widely used\
    \ dynamic programming languages, and it has good support for serial communication.\
    \ Some distributions come with libraries for programming the serial port, but\
    \ usually you have to install a module first.\n\nWindows users should have a look\
    \ at Win32::SerialPort.5 For the rest, Device::SerialPort is a good choice. You\
    \ can install it as follows:\n\n```\nmaik> perl -MCPAN -e 'install Device::SerialPort'\n\
    ```\n\nThen use it like this:\n\n```\nuse strict;\nuse warnings;\nuse Device::SerialPort;\n\
    \nif ($#ARGV != 0) {\n  die \"You have to pass the name of a serial port.\";\n\
    }\n\nmy $serial_port = $ARGV[0];\nmy $arduino = Device::SerialPort->new($serial_port);\n\
    $arduino->baudrate(9600);\n$arduino->databits(8);\n$arduino->parity(\"none\");\n\
    $arduino->stopbits(1);\n$arduino->read_const_time(1);\n$arduino->read_char_time(1);\n\
    \nsleep(2);\nwhile (1) {\n  $arduino->write(\"a0\\n\");\n  my ($count, $line)\
    \ = $arduino->read(255);\n  print $line;\n}\n```\n\nWe check whether the name\
    \ of a serial port was passed on the command line. Then we create a new Device::SerialPort\
    \ instance in line 10. We configure all serial port parameters, and in line 15,\
    \ we set a timeout\n\n5. http://search.cpan.org/dist/Win32-SerialPort/"
