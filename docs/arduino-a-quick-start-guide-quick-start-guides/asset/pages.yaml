- pgno: 30
  md: 'In this section, we had a closer look at the Arduino Uno, the newest Arduino
    board. But several other types are available, and although they''re the same in
    principle, they differ in some details. The Arduino Mega2560⁶ has many more IO
    pins than all other Arduinos and uses the powerful ATmega2560 microcontroller,
    while the Arduino Nano⁷ was designed to be used on a breadboard, so it doesn''t
    have any sockets. From my experience, beginners should start with one of the “standard”
    boards, that is, with an Uno or a Duemilanove.


    # 1.4 Installing the Arduino IDE


    To make it as easy as possible to get started with the Arduino, the Arduino developers
    have created a simple but useful integrated development environment (IDE). It
    runs on many different operating systems. Before you can create your first projects,
    you have to install it.


    # Installing the Arduino IDE on Windows


    The Arduino IDE runs on all the latest versions of Microsoft Windows, such as
    Windows XP, Windows Vista, and Windows 7. Installing the software is easy, because
    it comes as a self-contained ZIP archive.⁸ so you don''t even need an installer.
    Download the archive, and extract it to a location of your choice.


    Before you first start the IDE, you must install drivers for the Arduino''s USB
    port. This process depends on the Arduino board you''re using and on your flavor
    of Windows, but you always have to plug the Arduino into a USB port first to start
    the driver installation process.


    On Windows Vista, driver installation usually happens automatically. Lean back
    and watch the hardware wizard''s messages pass by until it says that you can use
    the newly installed USB hardware.


    Windows XP and Windows 7 may not find the drivers on Microsoft''s update sites
    automatically. Sooner or later the hardware wizard asks you for the path to the
    right drivers after you have told it to skip automatic driver installation from
    the Internet. Depending on your Arduino board, you have to point it to the right
    location in the Arduino installation directory. For the Arduino Uno and the Arduino
    Mega 2560, choose


    6. http://arduino.cc/en/Main/ArduinoBoardMega2560

    7. http://arduino.cc/en/Main/ArduinoBoardNano

    8. http://arduino.cc/en/Main/Software'
