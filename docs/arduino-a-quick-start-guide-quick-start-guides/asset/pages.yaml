- pgno: 96
  md: 'Next we define three global variables: message_text is a character buffer that
    gets filled with the data we receive on the serial port. index keeps track of
    our current position in the buffer, and telegraph is the Telegraph object we’ll
    use to convert a message into “blinkenlights.”³


    setup() initializes the serial port, and in loop() we check whether new data has
    arrived, calling Serial.available(). We read the next byte if new data is available,
    and we check whether it is a linefeed character or whether it is the last byte
    that fits into our character buffer. In both cases, we set the last byte of message_text
    to 0, because strings in C/C++ are null-terminated. We also reset index so we
    can read the next message, and finally we send the message using our telegraph.
    In all other cases, we add the latest byte to the current message text and move
    on.


    You should compile and upload the program now. Open the serial monitor, and choose
    “Carriage return” from the line endings drop-down menu at the bottom of the window.
    With this option set, the serial monitor will automatically append a newline character
    to every line it sends to the Arduino. Enter a message such as your name, click
    the Send button, and see how the Arduino turns it into light.


    Because we’ve encapsulated the whole Morse code logic in the Telegraph class,
    our main program is short and concise. Creating software for embedded devices
    doesn’t mean we can’t benefit from the advantages of object-oriented programming.


    Still, we have some minor things to do to turn our project into a first-class
    library. Read more about it in the next section.


    # 4.7 Final Touches


    One of the nice features of the Arduino IDE is its syntax coloring. Class names,
    function names, variables, and so on, all have different colors in the editor.
    This makes it much easier to read source code, and it’s possible to add syntax
    coloring for libraries. You only have to add a file named keywords.txt to your
    project:


    ```

    Download Telegraph/keywords.txt


    # Syntax-coloring for the telegraph library


    Telegraph    KEYWORD1

    send_message KEYWORD2

    ```'
