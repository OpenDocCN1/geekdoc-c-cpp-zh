    \ Nunchuk plug:\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_154_1.png)\n\nIt has\
    \ six connectors, but only four of them are active: GND, 3.3 V, Data, and Clock.\
    \ Put a wire into each connector, and then connect the wires to the Arduino. Connect\
    \ the data wire to analog pin 4 and the clock wire to analog pin 5. The GND wire\
    \ has to be connected to the Arduino's ground pin and the 3.3 V wire belongs to\
    \ the Arduino's 3.3 V pin.\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_155_0.png)\n\
    \nFigure 7.2: How to connect a Nunchuk to an Arduino\n\nThat's really all you\
    \ have to do to connect a Nunchuk controller to an Arduino. In the next section,\
    \ you'll see that the two wires connected to analog pins 4 and 5 are all we need\
    \ to interface with the controller.\n\n### 7.3 Talking to a Nunchuk\n\nNo official\
    \ documentation shows how a Nunchuk works internally or how you can use it in\
    \ a non-Wii environment. But some smart hackers and makers on the Internet invested\
    \ a lot of time to reverse-engineer what’s happening inside the controller.¹\n\
    \nAll in all, it’s really simple, because the Nunchuk uses the Two-Wire Interface\
    \ (TWI), also known as I²C (Inter-Integrated Circuit) protocol.² It enables devices\
    \ to communicate via a master/slave data bus using only two wires. You transmit\
    \ data on one wire (DATA), while the other synchronizes the communication (CLOCK).\n\
    \nThe Arduino IDE comes with a library named Wire that implements the I²C protocol.\
    \ It expects the data line to be connected to analog pin 4 and the clock line\
    \ to analog pin 5. We’ll use it shortly to communicate with the Nunchuk, but before\
    \ that, we’ll have a look at the commands the controller understands.³\n\n1. http://www.windmeadow.com/node/42\n\
    2. http://en.wikipedia.org/wiki/I2C\n3. At http://todbot.com/blog/2010/09/25/softi2cmaster-add-i2c-to-any-arduino-pins/,\
    \ you can find a library that allows you to use any pair of pins for I²C communication.\n\
    \n> ### Improve People’s Life with Tinkering\n>\n> Because of its popularity,\
    \ peripheral equipment for modern game consoles often is unbelievably cheap. Also,\
    \ it’s no longer limited to classic controllers; you can buy things like snowboard\
    \ simulators or cameras. So, it comes as no surprise that creative people have\
    \ built many interesting projects using hardware that was originally built for\
    \ playing games.\n>\n> An impressive and useful tinkering project is the Eyewriter.*\
    \ It uses the PlayStation Eye (a camera for Sony’s PlayStation 3) to track the\
    \ movement of human eyes.\n>\n> A team of hackers built it to enable their paralyzed\
    \ friend to draw graffiti using his eyes. Because of a disease, this friend, an\
    \ artist, is almost completely physically paralyzed and can only move his eyes.\
    \ With the Eyewriter, he is able to create amazing artwork again.\n>\n> It’s not\
    \ an Arduino project but definitely worth a look.\n>\n> * http://www.eyewriter.org/\n\
    \nTo be honest, the Nunchuk understands only a single command: “Give me all your\
    \ data.” Whenever it receives this command, it returns six bytes that have the\
    \ following meaning (see the data structure in Figure 7.3, on the following page):\n\
    \n- Byte 1 contains the analog stick’s x-axis value, and in byte 2 you’ll find\
    \ the stick’s y-axis value. Both are 8-bit numbers and range from about 29 to\
    \ 225.\n- Acceleration values for the x-, y-, and z-axes are three 10-bit numbers.\
    \ Bytes 3, 4, and 5 contain their eight most significant bits. You can find the\
    \ missing two bits for each of them in byte 6.\n- Byte 6 has to be interpreted\
    \ bit-wise. Bit 0 (the least significant bit) contains the status of the Z-button.\
    \ It’s 0 if the button was pressed; otherwise, it is 1. Bit 1 contains the C-button’s\
    \ status.\n\nThe remaining six bits contain the missing least significant bits\
    \ of the acceleration values. Bits 2 and 3 belong to the X axis, bits 4 and 5\
    \ belong to Y, and bits 6 and 7 belong to Z.\n\nNow that we know how to interpret\
    \ the data we get from the Nunchuk, we can start to build a Nunchuk class to control\
    \ it.\n\n| Byte | Meaning |\n| --- | --- |\n| Byte 1 | Joystick x position |\n\
    | Byte 2 | Joystick y position |\n| Byte 3 | X acceleration bits 9..2 |\n| Byte\
    \ 4 | Y acceleration bits 9..2 |\n| Byte 5 | Z acceleration bits 9..2 |\n| Byte\
    \ 6 | Bit 7–6: Z acceleration bits 1..0; bit 5–4: Y acceleration bits 1..0; bit\
    \ 3–2: X acceleration bits 1..0; bit 1: C-button status; bit 0: Z-button status\
    \ |\n\nFigure 7.3: The Nunchuk always returns 6 bytes of data.\n\n> ### Scientific\
    \ Applications Using Wii Equipment\n>\n> Because of the Wii’s accuracy and cheap\
    \ price, many scientists use Wii equipment for other things than gaming. Some\
    \ hydrologists use it for measuring evaporation on a body of water.* Usually,\
    \ you’d need equipment costing more than $500 to do that.\n>\n> Some doctors at\
    \ the University of Melbourne had a closer look at the Wii Balance Board, because\
    \ they were looking for a cheap device to help stroke victims recover.† They’ve\
    \ published a scientific paper verifying that the board’s data is clinically comparable\
    \ to that of a lab-grade “force platform” for a tiny fraction of the costs.\n\
    >\n> * http://www.wired.com/wiredscience/2009/12/wilmote-science/\n>\n> † http://www.newscientist.com/article/mg20527435.300-wii-board-helps-physios-strike-a-balance-after-strokes.html\n\
    \nIn line 4, we create a constant for the size of the array we need to store the\
    \ data the Nunchuk returns. We define this array in line 33, and in this case,\
    \ we define the constant using the preprocessor instead of the const keyword,\
    \ because array constants must be known at compile time in C++.\n\nThen the actual\
    \ declaration of the Nunchuk class begins. To initiate the communication channel\
    \ between Arduino and Nunchuk, you have to invoke the initialize() method once.\
    \ Then you call update() whenever you want the Nunchuk to send new data. You’ll\
    \ see the implementation of these two methods shortly.\n\nWe have public methods\
    \ for getting all attributes the Nunchuk returns: the x and y positions of the\
    \ analog stick, the button states, and the acceleration values of the x-, y-,\
    \ and z-axes. All these methods operate on the raw data you can find in the buffer\
    \ in line 33. Their implementation is mostly trivial and requires only a single\
    \ line of code. Only the assembly of the 10-bit acceleration values needs some\
    \ tricky bit operations (see Section B.2, Bit Operations, on page 249).\n\nAt\
    \ the end of the class declaration you find two private helper methods we need\
    \ to implement: initialize() and update():\n\n```cpp\n#include <Wire.h>\n#include\
    \ \"nunchuk.h\"\n#define NUNCHUK_DEVICE_ID 0x52\n\nvoid Nunchuk::initialize()\
    \ {\n    Wire.begin();\n    Wire.beginTransmission(NUNCHUK_DEVICE_ID);\n    Wire.send(0x40);\n\
    \    Wire.send(0x00);\n    Wire.endTransmission();\n    update();\n}\n\nbool Nunchuk::update()\
    \ {\n    delay(1);\n    Wire.requestFrom(NUNCHUK_DEVICE_ID, NUNCHUK_BUFFER_SIZE);\n\
    \    int byte_counter = 0;\n    while (Wire.available() && byte_counter < NUNCHUK_BUFFER_SIZE)\n\
    \        _buffer[byte_counter++] = decode_byte(Wire.receive());\n    return byte_counter\
    \ == NUNCHUK_BUFFER_SIZE;\n}\n```\n"
  mdcn: "\n\n## 第7章：改造 Wii Nunchuk\n\n tinkering：拿一个现成产品并将其改造成其他用途或用于非预期目的。有时你必须打开产品并使其失去保修；有时你可以安全地将其作为自己项目的组成部分。\n\
    \n在本章中，你将学习如何劫持一台任天堂 Nunchuk 控制器。它是改造的完美候选：它配备了三轴加速度计、模拟摇杆和两个按钮，而且非常便宜（截至本文撰写时不到\
    \ 20 美元）。更妙的是：由于其设计良好且连接器易于访问，你可以惊人地轻松地将其集成到自己的项目中。\n\n我们将使用一台普通的 Nunchuk 控制器，并通过\
    \ Arduino 将其发出的数据传输到计算机。你将学习如何将其连接到 Arduino；如何编写读取控制器当前状态的软件；以及如何使用 Nunchuk 在屏幕上移动、旋转和缩放一个\
    \ 3D 立方体。你甚至不需要一台任天堂 Wii 来完成所有这些——你只需要一个 Nunchuk 控制器即可。\n\n### 7.1 你需要什么\n\n-\
    \ 一个 Arduino 板，例如 Uno、Duemilanove 或 Diecimila\n- 一根 USB 电缆用于将 Arduino 连接到计算机\n\
    - 一个任天堂 Nunchuk 控制器\n- 四根导线\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_154_0.png)\n\
    \n图 7.1：任天堂 Nunchuk 控制器\n\n### 7.2 连接 Wii Nunchuk\n\n将 Nunchuk 连接到 Arduino 真的很简单。你不必打开\
    \ Nunchuk 或以任何方式修改它。你只需要将四根导线插入其连接器，然后将导线连接到 Arduino。以下是 Nunchuk 插头的引脚定义：\n\n\
    ![](img/dcfd13a1bf99c4d3f9996627012a6526_154_1.png)\n\n它有六个连接器，但只有四个是活动的：GND、3.3\
    \ V、Data 和 Clock。将一根导线插入每个连接器，然后将导线连接到 Arduino。将数据线连接到模拟引脚 4，将时钟线连接到模拟引脚 5。GND\
    \ 线必须连接到 Arduino 的地引脚，而 3.3 V 线属于 Arduino 的 3.3 V 引脚。\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_155_0.png)\n\
    \n图 7.2：如何将 Nunchuk 连接到 Arduino\n\n这就是将 Nunchuk 控制器连接到 Arduino 所需做的全部工作。在下一节中，你会看到连接到模拟引脚\
    \ 4 和 5 的两根导线就是我们与控制器交互所需的所有内容。\n\n### 7.3 与 Nunchuk 通信\n\n没有任何官方文档说明 Nunchuk\
    \ 内部的工作原理或如何在非 Wii 环境中使用它。但互联网上的一些聪明的黑客和创客投入了大量时间来逆向工程控制器内部发生的事情。¹\n\n总的来说，它非常简单，因为\
    \ Nunchuk 使用双线接口（TWI），也称为 I²C（Inter-Integrated Circuit）协议。² 它使设备能够仅使用两根导线通过主/从数据总线进行通信。你在一根导线上传输数据（DATA），而另一根导线同步通信（CLOCK）。\n\
    \nArduino IDE 附带一个名为 Wire 的库，实现了 I²C 协议。它期望数据线连接到模拟引脚 4，时钟线连接到模拟引脚 5。我们将很快使用它与\
    \ Nunchuk 通信，但在那之前，我们先来看看控制器理解的命令。³\n\n1. http://www.windmeadow.com/node/42\n\
    2. http://en.wikipedia.org/wiki/I2C\n3. 在 http://todbot.com/blog/2010/09/25/softi2cmaster-add-i2c-to-any-arduino-pins/，你可以找到一个库，允许你使用任意一对引脚进行\
    \ I²C 通信。\n\n> ### 用改造改善人们的生活\n>\n> 由于其受欢迎程度，现代游戏机的外设设备往往 unbelievably 便宜。而且，它已不再局限于经典控制器；你可以购买诸如滑雪板模拟器或摄像机之类的东西。因此，毫不奇怪，创意人士使用原本为游戏而建的硬件构建了许多有趣的项目。\n\
    >\n> 一个令人印象深刻且有用的改造项目是 Eyewriter。* 它使用 PlayStation Eye（索尼 PlayStation 3 的摄像机）来跟踪人类眼睛的移动。\n\
    >\n> 一群黑客为使他们的瘫痪朋友能够用眼睛绘制涂鸦而构建了它。由于疾病，这个朋友，一位艺术家，几乎完全身体瘫痪，只能移动眼睛。有了 Eyewriter，他能够再次创作令人惊叹的艺术作品。\n\
    >\n> 这不是一个 Arduino 项目，但绝对值得一看。\n>\n> * http://www.eyewriter.org/\n\n说实话，Nunchuk\
    \ 只理解一个命令：“给我所有的数据。” 每当它收到此命令时，它会返回六个字节，其含义如下（参见图 7.3 中的数据结构，见下一页）：\n\n- 字节 1\
    \ 包含模拟摇杆的 x 轴值，字节 2 中包含摇杆的 y 轴值。两者都是 8 位数字，范围约为 29 到 225。\n- x、y 和 z 轴的加速度值是三个\
    \ 10 位数字。字节 3、4 和 5 包含它们最重要的八位。你可以在字节 6 中找到每个的缺失两位。\n- 字节 6 必须按位解释。位 0（最低有效位）包含\
    \ Z 按钮的状态。如果按钮被按下，则为 0；否则为 1。位 1 包含 C 按钮的状态。\n\n剩余的六位包含加速度值的缺失最低有效位。位 2 和 3 属于\
    \ X 轴，位 4 和 5 属于 Y，位 6 和 7 属于 Z。\n\n现在我们知道了如何解释从 Nunchuk 获得的数据，我们可以开始构建一个 Nunchuk\
    \ 类来控制它。\n\n| Byte | Meaning |\n| --- | --- |\n| Byte 1 | Joystick x position\
    \ |\n| Byte 2 | Joystick y position |\n| Byte 3 | X acceleration bits 9..2 |\n\
    | Byte 4 | Y acceleration bits 9..2 |\n| Byte 5 | Z acceleration bits 9..2 |\n\
    | Byte 6 | Bit 7–6: Z acceleration bits 1..0; bit 5–4: Y acceleration bits 1..0;\
    \ bit 3–2: X acceleration bits 1..0; bit 1: C-button status; bit 0: Z-button status\
    \ |\n\n图 7.3：Nunchuk 总是返回 6 个字节的数据。\n\n> ### 使用 Wii 设备进行科学应用\n>\n> 由于 Wii 的准确性和低廉价格，许多科学家使用\
    \ Wii 设备进行游戏以外的用途。一些水文学家用它来测量水体上的蒸发量。* 通常，你需要花费超过 500 美元的设备才能做到这一点。\n>\n> 墨尔本大学的一些医生仔细研究了\
    \ Wii 平衡板，因为他们正在寻找一种廉价的设备来帮助中风患者康复。† 他们发表了一篇科学论文，验证该板的数据在临床上与实验室级“力平台”相当，而成本仅为其一小部分。\n\
    >\n> * http://www.wired.com/wiredscience/2009/12/wilmote-science/\n>\n> † http://www.newscientist.com/article/mg20527435.300-wii-board-helps-physios-strike-a-balance-after-strokes.html\n\
    \n在第 4 行，我们为存储 Nunchuk 返回的数据所需的数组创建一个常量。我们在第 33 行定义此数组，在这种情况下，我们使用预处理器而不是 const\
    \ 关键字来定义常量，因为在 C++ 中数组常量必须在编译时已知。\n\n然后实际的 Nunchuk 类声明开始。要启动 Arduino 和 Nunchuk\
    \ 之间的通信通道，你必须调用一次 initialize() 方法。然后每当你想要 Nunchuk 发送新数据时调用 update()。你将很快看到这两个方法的实现。\n\
    \n我们有公共方法来获取 Nunchuk 返回的所有属性：模拟摇杆的 x 和 y 位置、按钮状态以及 x、y、z 轴的加速度值。所有这些方法都操作第 33\
    \ 行缓冲区中的原始数据。它们的大部分实现都很简单，只需要一行代码。只有 10 位加速度值的组装需要一些棘手的位操作（参见第 B.2 节，位操作，第 249\
    \ 页）。\n\n在类声明的末尾，你会找到我们需要实现的两个私有辅助方法：initialize() 和 update()：\n\n```cpp\n#include\
    \ <Wire.h>\n#include \"nunchuk.h\"\n#define NUNCHUK_DEVICE_ID 0x52\n\nvoid Nunchuk::initialize()\
    \ {\n    Wire.begin();\n    Wire.beginTransmission(NUNCHUK_DEVICE_ID);\n    Wire.send(0x40);\n\
    \    Wire.send(0x00);\n    Wire.endTransmission();\n    update();\n}\n\nbool Nunchuk::update()\
    \ {\n    delay(1);\n    Wire.requestFrom(NUNCHUK_DEVICE_ID, NUNCHUK_BUFFER_SIZE);\n\
