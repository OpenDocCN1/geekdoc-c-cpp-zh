  mdcn: "\n例如，如果你按下按钮，LED 有时会立即亮起然后熄灭。而且，如果你松开它，LED 通常会停留在一种或多或少随机的状态；也就是说，它有时亮，有时灭。\n\
    \n问题在于 Arduino 会一遍又一遍地执行 loop() 方法。尽管 Arduino 的 CPU 相对较慢，但这种情况也会非常频繁地发生——无论我们当前是否按下按钮。但如果你按下并保持按住按钮，其状态将始终为\
    \ HIGH，并且你会不断地切换 LED 的状态（因为这一切发生得太快，看起来就像 LED 一直亮着）。当你松开按钮时，LED 便处于一种或多或少随机的状态。\n\
    \n为了改善这种情况，我们不仅需要存储 LED 的当前状态，还需要存储按钮的先前状态：\n\n下载 BinaryDice/MoreReliableSwitch/MoreReliableSwitch.pde\n\
    \n```\nconst unsigned int BUTTON_PIN = 7;\nconst unsigned int LED_PIN   = 13;\n\
    \nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n\
    }\n\nint old_button_state = LOW;\nint led_state = LOW;\n\nvoid loop() {\n  const\
    \ int CURRENT_BUTTON_STATE = digitalRead(BUTTON_PIN);\n  if (CURRENT_BUTTON_STATE\
    \ != old_button_state &&\n      CURRENT_BUTTON_STATE == HIGH)\n  {\n    led_state\
    \ = (led_state == LOW) ? HIGH : LOW;\n    digitalWrite(LED_PIN, led_state);\n\
    \  }\n  old_button_state = CURRENT_BUTTON_STATE;\n}\n```\n\n在初始化按钮和 LED 引脚之后，我们现在声明两个变量：old_button_state\
    \ 存储我们按钮的先前状态，led_state 存储 LED 的当前状态。两者都可以是 HIGH 或 LOW。\n\n在 loop() 函数中，我们仍然需要读取当前的按钮状态，但现在我们不仅检查它是否为\
    \ HIGH。我们还要检查它自上次读取以来是否发生了变化。只有两个条件都满足时，我们才切换 LED 的状态。因此，只要按钮被按下，我们就不会再一遍又一遍地打开和关闭\
    \ LED。在程序结束时，我们必须将按钮的当前状态存储在 old_button_state 中。\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_77_0.png)\n\
    \n*图 3.9：机械开关必须进行去抖处理。*\n\n上传我们的新版本，你会看到这个解决方案比旧版本效果好得多。但你仍然会发现一些边缘情况，按钮的行为不完全符合预期。问题主要出现在松开按钮的那一刻。\n\
    \n这些问题的原因是机械按钮在按下时会产生几毫秒的抖动。在图 3.9 中，你可以看到机械按钮产生的典型信号。刚按下按钮后，它不会发出清晰的信号。为了克服这一影响，你必须对按钮进行去抖。通常只需等待一小段时间，直到按钮信号稳定即可。去抖可以确保我们对按钮的一次按下只做出一次反应。除了去抖之外，我们仍然需要将\
    \ LED 的当前状态存储在一个变量中。具体做法如下：\n\n下载 BinaryDice/DebounceButton/DebounceButton.pde\n\
    \n```\nconst unsigned int BUTTON_PIN = 7;\nconst unsigned int LED_PIN   = 13;\n\
    \nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n\
    }\n\nint old_button_state = LOW;\nint led_state = LOW;\n\nvoid loop() {\n  const\
    \ int CURRENT_BUTTON_STATE = digitalRead(BUTTON_PIN);\n  if (CURRENT_BUTTON_STATE\
    \ != old_button_state &&\n      CURRENT_BUTTON_STATE == HIGH)\n  {\n    led_state\
    \ = (led_state == LOW) ? HIGH : LOW;\n    digitalWrite(LED_PIN, led_state);\n\
    \    delay(50);\n  }\n  old_button_state = CURRENT_BUTTON_STATE;\n}\n```\n\n我们\
    \ LED 开关的最终版本与之前版本仅有一行不同：为了对按钮进行去抖，我们在第 19 行等待 50 毫秒，然后才重新进入主循环。\n\n这就是目前你需要了解的关于按钮的全部内容。在下一节中，我们将使用两个按钮把我们的二进制骰子变成一个真正的游戏。\n\
    \n## 3.6 添加我们自己的按钮\n\n到目前为止，我们不得不借用 Arduino 的重置按钮来控制骰子。这个解决方案远非最佳，所以我们将添加自己的按钮。在图\
    \ 3.10（第 81 页）中，你可以看到我们需要对当前电路进行少量修改。实际上，我们根本不需要改变现有的部件，只需要添加一些东西。首先，我们将一个按钮插入面包板，并将其连接到引脚\
    \ 7。然后，我们通过一个 10kΩ 电阻将按钮连接到地线，并用一小段导线将其连接到 5 伏引脚。这就是我们需要的全部硬件。以下是相应的软件：\n\n下载\
    \ BinaryDice/DiceWithButton/DiceWithButton.pde\n\n```\nconst unsigned int LED_BIT0\
    \ = 12;\nconst unsigned int LED_BIT1 = 11;\nconst unsigned int LED_BIT2 = 10;\n\
    const unsigned int BUTTON_PIN = 7;\n\nvoid setup() {\n  pinMode(LED_BIT0, OUTPUT);\n\
    \  pinMode(LED_BIT1, OUTPUT);\n  pinMode(LED_BIT2, OUTPUT);\n  pinMode(BUTTON_PIN,\
    \ INPUT);\n  randomSeed(analogRead(A0));\n}\n\nint current_value = 0;\nint old_value\
    \ = 0;\n\nvoid loop() {\n  current_value = digitalRead(BUTTON_PIN);\n  if (current_value\
    \ != old_value && current_value == HIGH) {\n    output_result(random(1, 7));\n\
    \    delay(50);\n  }\n  old_value = current_value;\n}\n\nvoid output_result(const\
    \ long result) {\n  digitalWrite(LED_BIT0, result & B001);\n  digitalWrite(LED_BIT1,\
    \ result & B010);\n  digitalWrite(LED_BIT2, result & B100);\n}\n```\n\n这是原始代码和用于控制去抖按钮的代码的完美结合。像往常一样，我们初始化所有使用的引脚：三个用于\
    \ LED 的输出引脚和一个用于按钮的输入引脚。我们还初始化了随机种子，并在 loop() 函数中等待新的按钮按下。每当按钮被按下时，我们就会掷骰子并使用\
    \ LED 输出结果。我们已经用自己的按钮替换了重置按钮！\n\n既然我们已经知道了添加一个按钮有多么容易，我们将在下一节中再添加一个按钮，把我们简单的骰子变成一个游戏。\n\
    \n## 3.7 构建骰子游戏\n\n要想把我们基本的骰子变成一个完整的游戏，需要再添加一个按钮。使用第一个按钮，我们仍然可以掷骰子；使用第二个按钮，我们可以设定一个猜测值。当我们再次掷骰子且当前结果与我们的猜测相等时，骰子上的三个\
    \ LED 将闪烁。否则，它们将保持熄灭。\n\n要输入猜测值，请按正确的次数按下猜测按钮。例如，如果你认为下一个结果是 3，请按三次猜测按钮，然后按开始按钮。\n\
