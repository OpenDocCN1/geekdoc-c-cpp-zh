    \ 值占用一个字节的内存，可以是 **true** 或 **false**。\n- **char** 变量占用一个字节的内存，存储从 -128 到 127\
    \ 的数字。这些数字通常表示以 ASCII 编码的字符；也就是说，在下面的示例中，c1 和 c2 具有相同的值：\n\n```\nchar c1 = 'A';\n\
    char c2 = 65;\n```\n\n请注意，**char** 字面量必须使用单引号。\n- **byte** 变量使用一个字节，存储从 0 到 255\
    \ 的值。\n\nArduino 在启动时只调用一次 `setup()`，我们用它来初始化 Arduino 主板以及连接到它上面的所有硬件。我们使用 `pinMode()`\
    \ 方法将 13 号引脚设置为输出引脚。这可以确保该引脚能够提供足够的电流来点亮 LED。引脚的默认状态是 `INPUT`，而 `INPUT` 和 `OUTPUT`\
    \ 都是预定义的常量。¹¹\n\n另一个必需函数 `loop()` 从第 8 行开始。它包含程序的主要逻辑，Arduino 会在一个无限循环中调用它。我们程序的主要逻辑必须先打开连接到\
    \ 13 号引脚的 LED。为此，我们使用 `digitalWrite()` 并将引脚编号和常量 `HIGH` 传递给它。这意味着该引脚将输出 5 伏电压，直到另行通知，连接到该引脚的\
    \ LED 就会点亮。\n\n然后程序调用 `delay()`，等待 500 毫秒，期间不执行任何操作。在这个暂停期间，13 号引脚保持 `HIGH` 状态，LED\
    \ 继续发光。当我们再次使用 `digitalWrite()` 将引脚状态设置为 `LOW` 时，LED 最终关闭。我们再等待 500 毫秒，然后 `loop()`\
    \ 函数结束。Arduino 会再次启动它，LED 就闪烁起来了。\n\n在下一节中，你将学习如何让程序运行起来并将其上传到 Arduino。\n\n##\
    \ 1.6 编译和上传程序\n\n在编译程序并将其上传到 Arduino 之前，你需要在 IDE 中配置两件事：你使用的 Arduino 类型以及 Arduino\
    \ 所连接的串口。\n\n识别 Arduino 类型很容易，因为型号印在主板上。常见的类型有 Uno、Duemilanove、Diecimila、Nano、Mega、Mini、NG、BT、LilyPad、Pro\
    \ 或 Pro Mini。在某些情况下，你还需要检查你的 Arduino 使用的是哪种微控制器——大多数使用 ATmega168 或 ATmega328。你可以看到微控制器类型印在微控制器本身上面。当你确定了\
    \ Arduino 的确切类型后，从“工具 > 开发板”菜单中选择它。\n\n现在，你需要从“工具 > 串口”菜单中选择你的 Arduino 所连接的串口。在\
    \ Mac OS X 上，串口名称以 `/dev/cu.usbserial` 或 `/dev/cu.usbmodem` 开头（在我的\n\n11. 官方文档请参阅\
    \ http://arduino.cc/en/Tutorial/DigitalPins。\n\nMacBook Pro 上，它是 `/dev/cu.usbmodemfa141`）。在\
    \ Linux 系统上，它应该是 `/dev/ttyUSB0`、`/dev/ttyUSB1` 或类似名称，具体取决于你的计算机有多少个 USB 端口。\n\n\
    在 Windows 系统上，找到正确的串口会稍微复杂一些，但也并不难。打开设备管理器，在“端口（COM 和 LPT）”菜单项下查找“USB 串行端口”（参见下一页的图\
    \ 1.9）。通常该端口名为 COM1、COM2 或类似名称。\n\n选择正确的串口后，单击“验证”按钮，你应该会在 IDE 的消息区域看到以下输出（Arduino\
    \ IDE 将程序称为草图）：\n\n```\nBinary sketch size: 1010 bytes (of a 32256 byte maximum)\n\
    ```\n\n这意味着 IDE 已成功将源代码编译为 1,010 字节的机器码，我们可以将其上传到 Arduino。如果你看到的是错误消息，请检查你是否正确键入了程序（如有疑问，请从本书网站下载代码）。¹²\
    \ 根据你使用的 Arduino 主板，字节上限可能会有所不同。例如，在 Arduino Duemilanove 上，它通常是 14336。\n\n现在单击“上传”按钮，几秒钟后，你应该会在消息区域看到以下输出：\n\
    \n```\nBinary sketch size: 1010 bytes (of a 32256 byte maximum)\n```\n\n这与我们编译程序后得到的消息完全相同，它告诉我们\
    \ 1,010 字节的机器码已成功传输到 Arduino。如果出现任何错误，请检查你是否在“工具”菜单中选择了正确的 Arduino 类型和正确的串口。\n\
    \n在上传过程中，TX 和 RX 指示灯会闪烁几秒钟。这是正常现象，每当 Arduino 和你的计算机通过串口通信时都会发生。当 Arduino 发送信息时，它会点亮\
    \ TX 指示灯。当它接收到一些数据位时，它会点亮 RX 指示灯。由于通信速度相当快，指示灯开始闪烁，你无法识别单个字节的传输（如果你能识别，那你可能是外星人）。\n\
    \n12. http://www.pragprog.com/titles/msard\n\n图 1.9：在 Windows XP 上查找 Arduino 所连接的串口。\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_41_0.png)\n\n图 1.11：一组通孔 LED\n\n这就是为什么它们通常有一根或多根长导线。首先，你将导线穿过印刷电路板上的孔。然后，你通常会将它们弯曲、焊接并剪断，以将部件固定到电路板上。在可用的情况下，你也可以将它们插入我们\
    \ Arduino 或面包板上的插座中（你将在第 64 页的 3.2 节“使用面包板”中了解更多关于面包板的内容）。\n\n在下一页的图 1.12 中，你可以看到如何将\
    \ LED 连接到 Arduino。将 LED 的短连接脚连接到接地引脚（GND），将较长的连接脚连接到 13 号引脚。你可以让闪烁草图仍在运行时进行此操作。状态\
    \ LED 和外部 LED 都将开始闪烁。\n\n务必确保你使用的是 13 号引脚！如果你将 LED 连接到任何其他引脚，它很可能会被烧毁。原因是 13 号引脚有一个内部电阻，而其他引脚没有（你将在第\
    \ 63 页的第 3 章“构建二进制骰子”中了解更多相关信息）。\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_41_1.png)\n\
    \n就这样！你刚刚为 Arduino 添加了第一个外部电子部件，并创建了你的第一个物理计算项目。你编写了一些代码，它让世界变得更明亮了一些。你亲手实现了数字版的“fiat\
    \ lux”。¹³\n\n你将在几乎每个 Arduino 项目中用到你在本章学到的理论和技能。在下一章中，你将看到如何更灵活地控制 LED，并学习如何充分利用\
    \ Arduino IDE 的更高级功能。\n\n13. http://en.wikipedia.org/wiki/Fiat_lux\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_42_0.png)\n\
    \n图 1.12：将 LED 连接到 Arduino。\n\n## 1.8 如果它不工作怎么办？\n\n不要慌张！如果它不工作，你很可能以错误的方式连接了\
    \ LED。在组装电子项目时，部件分为两类：那些可以随意安装的，以及那些需要特定方向的。LED 有两个连接脚：阳极（正极）和阴极（负极）。它们很容易混淆，我的科学老师教了我一个助记方法：阴极是负极（cathode\
    \ is necative）。记住 LED 的负极连接脚也很容易：它更短、更少、更小。如果你是一个更积极的人，那么可以将阳极视为更大、更多、更正极。你也可以通过\
    \ LED 的外壳来识别其连接脚。负极一侧的外壳是平的，而正极一侧是圆的。\n\n"
