    如果没有我家人和朋友的支持，我永远也写不完这本书。妈妈，我们非常想念你！


    最后，我想感谢 Tanja 在我最需要的时候给了我信心，并让我的生活重新充满了乐趣！


    ## 前言


    欢迎来到 Arduino，欢迎来到令人兴奋的物理计算世界！Arduino² 是一个开源项目，由硬件和软件组成。它最初是为了给设计师和艺术家提供一个交互设计课程的原型平台而创建的。如今，世界各地的业余爱好者和专家都用它来创建物理计算项目，你也可以。


    Arduino 让我们能够像 1980 年代那样再次亲手操作计算机，当时你可以自己组装电脑。而且 Arduino 让开发手工电子项目变得比以往更容易，从原型到复杂的电子小玩意。过去的日子已经一去不复返了，那时你必须在点亮一个
    LED 之前先学习大量关于电子学的理论和晦涩的编程语言。你可以在几分钟内创建你的第一个 Arduino 项目，而无需高级的电气工程课程。


    事实上，你不需要对电子项目有任何了解就可以阅读这本书，而且你从一开始就会亲自动手。你不仅会在前几页学会如何使用最重要的电子元件，还会学会如何编写使你的项目栩栩如生的软件。


    本书摒弃了理论，始终保持动手实践。我会解释构建本书项目所需的所有基础知识，并且每一章都有故障排除部分来帮助你在出现问题时应对。这本书是一本快速入门指南，能让你迅速上手并立即创建自己的项目。


    ### 谁应该阅读这本书


    如果你对电子学感兴趣——尤其是构建自己的玩具、游戏和电子小玩意——那么这本书适合你。虽然 Arduino 是设计师和艺术家的不错工具，但只有软件开发人员才能发挥其全部潜力。因此，如果你已经开发过一些软件——最好是使用
    C/C++ 或 Java——那么你会从这本书中获益匪浅。


    但还有一件事：你必须构建、尝试并修改本书中的项目。玩得开心。不要担心犯错。故障排除部分——以及你在项目中不断增强信心所获得的动手经验——会让一切都物有所值。仅阅读关于电子学的书籍而不亲自做项目甚至连一半的战斗都算不上（你知道那句老话：我们记住我们听到的
    5%，写下的 10%，而我们亲身经历的 95%）。而且不要害怕：你真的不需要任何之前的电子项目经验！


    如果你从未写过一段软件，先从编程课程开始或先阅读一本编程入门书籍（*Learn to Program* [Pin06] 是一个不错的起点）。然后，用 *The
    C Programming Language* [KR98] 学习 C 编程，或用 *The C++ Programming Language* [Str00]
    学习 C++ 编程。


    ### 本书内容


    本书分为三个部分（“Getting Started with Arduino”、“Eight Arduino Projects” 和附录）。在第一部分，你将学习构建第二部分项目所需的所有基础知识，因此请按顺序阅读章节并完成所有练习。第二部分的章节也相互关联，重复使用前面章节的技术和代码。


    下面是一个简要介绍：


    - 本书从 Arduino 开发的基础开始。你将学习如何使用 IDE 以及如何编译和上传程序。你会很快构建你的第一个项目——电子骰子——它会向你展示如何使用诸如
    LED、按钮和电阻等基本元件。通过实现一个莫尔斯电码生成器，你会看到创建自己的 Arduino 库是多么容易。


    如果你遇到任何问题，你会在每一章末尾找到一份练习列表来提升你的技能。


    本书中的所有项目都已在 Arduino Uno、Arduino Duemilanove 上测试过，并使用 Arduino IDE 版本 18 到 21。如果可能，你应始终使用最新版本。


    ### Arduino Uno 和 Arduino 平台


    在发布了多个 Arduino 板和 Arduino IDE 版本后，Arduino 团队决定指定平台的 1.0 版本。它将成为所有未来开发的参考，并在 2010
    年的第一天宣布了它。³ 此后，他们发布了 Arduino Uno，并逐步改进了 IDE 及其支持库。


    在撰写本文时，Arduino 1.0 的具体形态仍不完全清楚。Arduino 团队试图尽可能保持此版本向后兼容。本书针对新的 Arduino Uno 板进行了更新。所有项目也适用于较旧的
    Arduino 板，如 Duemilanove 或 Diecimila。本书适用于 Arduino 平台的 21 版本。你可以在线跟踪 Arduino 平台的进展。⁴


    ### 代码示例和约定


    尽管这是一本关于开源硬件和电子学的书籍，但你会发现很多代码示例。我们需要它们来让硬件活起来并使其按我们想要的方式工作。


    我们使用 C/C++ 编写所有最终将在 Arduino 上运行的程序。对于在 PC 上运行的应用程序，我们使用 Processing，⁵ 但在第 C.2 节，Serial
    Communication Using Various Programming Languages，第 253 页，你还将学习如何使用多种其他编程语言与 Arduino
    通信。


    每当你在段落旁看到滑溜的道路图标时，请放慢速度并仔细阅读。它们会预告困难或危险的技术。


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_15_0.png)


    3. http://arduino.cc/blog/2010/01/01/uno-punto-zero/

    4. http://code.google.com/p/arduino/issues/list?q=milestone=1.0

    5. http://processing.org


    ### 在线资源


    这本书在 http://pragprog.com/titles/msard 有自己的网页，你可以在那里下载所有示例的代码（如果你拥有本书的电子书版本，点击每个代码示例上方的灰色小方框即可直接下载该源文件）。你还可以参与讨论论坛并结识其他读者和我。如果你发现错误、错别字或其他令人烦恼的问题，请在本书的勘误页面上让我和全世界知道。⁶


    在网页上你还会找到一个链接到 Flickr⁷ 照片集。它包含本书所有照片的高分辨率版本。你也可以在那里看到读者项目的照片，我们也很想看到你的项目的照片！


    让我们开始吧！


    ### 你需要的零件


    以下是完成本书所有项目所需的零件清单。此外，每一章都会列出该章项目所需的零件，因此你可以逐章尝试项目，而无需一次性购买所有组件。虽然这里看起来零件很多，但它们都相当便宜，你可以为本书中的所有项目购买所需的所有零件，约需
    200 美元。


    许多在线商店出售 Arduino 组件和电子零件。其中最好的有 Makershed 和 Adafruit。它们有很棒的入门套装，我强烈推荐购买其中一套。


    最好的、最便宜的解决方案是购买 Makershed 的 Arduino Projects Pack（产品代码 MSAPK）。它包含构建本书示例所需的大部分零件，以及许多可用于你自己的副项目的有用零件。如果你购买了
    Arduino Projects Pack，你需要单独购买以下额外零件：


    - Parallax PING))) sensor

    - TMP36 temperature sensor from Analog Devices

    - ADXL335 accelerometer breakout board

    - 6 pin 0.1" standard header

    - Nintendo Nunchuk controller

    - A Passive Infrared Sensor

    - An infrared LED

    - An infrared receiver

    - An Ethernet shield


