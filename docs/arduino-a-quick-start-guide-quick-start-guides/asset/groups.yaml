    \ 的成员变量，它存储了一个我们需要用来发送红外控制代码的 IRsend 对象。\n\n在第 8 行，我们定义了一个 read_line() 方法，用于读取客户端发送的一行数据。一行的结束要么是换行符（\\\
    n），要么是回车符后跟换行符（\\r\\n）。read_line() 需要传入要读取数据的 Ethernet Client 对象、一个用于存储数据的字符缓冲区（buffer）以及该字符缓冲区的最大长度（buffer_length）。该方法会忽略所有换行符和回车符，并将这一行的最后一个字符设置为\
