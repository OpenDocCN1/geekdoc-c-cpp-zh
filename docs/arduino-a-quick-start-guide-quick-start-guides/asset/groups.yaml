    # What Readers Are Saying About

    *Arduino: A Quick-Start Guide*


    The most comprehensive book on the Arduino platform I have read. Loaded with excellent
    examples and references, *Arduino: A Quick-Start Guide* gets beginners up and
    running in no time and provides experienced developers with a wealth of inspiration
    for their own projects.


    ► **Haroon Baig**

    Creator of the Twitwee Clock, http://www.haroonbaig.com


    Excellent paced for those who have never experimented with electronics or microcontrollers
    before and packed with valuable tidbits even for advanced Arduino tinkerers.


    ► **Georg Kaindl**

    Creator, Arduino DHCP, DNS, and Bonjour libs


    The Arduino platform is a great way for anyone to get into embedded systems, and
    this book is the road map. From first baby steps to complex sensors and even game
    controllers, there is no better way to get going on the Arduino.


    ► **Tony Williamitis**

    Senior embedded systems engineer


    I recommend this engaging and informative book to software developers who want
    to learn the basics of electronics, as well as to anyone looking to interface
    their computers with the physical world.


    ► **René Bohne**

    Software developer and creator of LumiNet'
