  - '[PAGE 179]


    # Tweeting Arduinos


    One of the most popular hardware kits available is the Botanical.* It checks whether
    your plants need water, and if they do, it sends a reminder message via http://twitter.com/.
    As soon as you water it, it dutifully sends a “Thank You” message. Although the
    official version of the Botanical is a specialized piece of hardware, you can
    build it using an Arduino.†


    Botanical certainly make your life a bit easier. Whether the Twitwee Clock‡ improves
    your life is a matter of taste. This modified cuckoo clock looks for Twitter updates
    using a wireless Internet connection. Whenever it finds a programmable search
    term, it displays the corresponding tweets on a display and also pops out a cuckoo
    making some noise. You’d better ask your family up front before you build this
    project and install it in your living room.


    * http://www.botanical.com/

    † http://www.botanical.com/archived_kits/twitter/

    ‡ http://www.haroonbaig.com/projects/TwitweeClock/


    that you need a complete PC, while for many applications the Arduino’s hardware
    capabilities would be sufficient. In this section, you’ll learn how to solve this
    problem with an Ethernet shield.


    You can’t connect a naked Arduino to a network. Not only are its hardware capabilities
    too limited, it also doesn’t have an Ethernet port. That means you can’t plug
    an Ethernet cable into it, and to overcome this limitation, you have to use an
    Ethernet shield. Such shields come with an Ethernet chip and Ethernet connectors
    and turn your Arduino into a networking device immediately. You only have to plug
    it in.


    You can choose from several products; they all are good and serve their purpose
    well.7 For prototyping I prefer the “official” shield,8 because it comes with
    sockets for all pins (it’s on the left side in Figure 8.6, on the next page).
    Also at the time of this writing the Arduino team announced the Arduino Ethernet,
    an Arduino board that comes with an Ethernet port and does not need a separate
    shield.


    7. See http://www.ladyada.net/make/eshield/, for example.

    8. http://www.arduino.cc/en/Main/ArduinoEthernetShield'
