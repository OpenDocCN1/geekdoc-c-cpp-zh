    }\n\nchar Nunchuk::decode_byte(const char b) {\n  return (b ^ 0x17) + 0x17;\n\
    }\n```\n\nAfter including all libraries we need, we define the NUNCHUK_DEVICE_ID\
    \ constant. I²C is a master/slave protocol; in our case, the Arduino will be the\
    \ master, and the Nunchuk will be the slave. The Nunchuk registers itself at the\
    \ data bus using a certain ID (0x52), so we can address it whenever we need something.\n\
    \nIn initialize(), we establish the connection between the Arduino and the Nunchuk\
    \ by sending a handshake. In line 8, we call Wire's begin() method, so the Arduino\
    \ joins the I²C bus as a master (if you pass begin() an ID, it joins the bus as\
    \ a slave having this ID). Then we begin a new transmission to the device identified\
    \ by NUNCHUK_DEVICE_ID: our Nunchuk."
  - "[PAGE 161]\n\nWe send two bytes (0x40 and 0x00) to the Nunchuk, and then we end\
    \ the transmission. This is the whole handshake procedure, and now we can ask\
    \ the Nunchuk for its current status by calling update(). In Figure 7.4, on the\
    \ preceding page, we see the message flow between an Arduino and a Nunchuk.\n\n\
    update() first pauses for a millisecond to let things settle a bit. Then we request\
    \ six bytes from the Nunchuk, calling Wire.requestFrom(). This does not actually\
    \ return the bytes, but we have to read them in a loop and fill our buffer. Wire.available()\
    \ returns the number of bytes that are available on the data bus, and Wire.receive()\
    \ returns the current byte. We cannot use the bytes we get from the Nunchuk directly,\
    \ because the controller obfuscates them a bit. “Decrypting” them is easy as you\
    \ can see in decode_byte().\n\nFinally, we call request_data() to tell the Nunchuk\
    \ to prepare new data. It transmits a single zero byte to the Nunchuk, which means\
    \ “prepare the next six bytes.”\n\nBefore we actually use our Nunchuk class in\
    \ the next section, take a look at the documentation of the Wire library. In the\
