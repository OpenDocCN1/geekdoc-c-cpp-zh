  md: "\nBuilding a new programming environment from scratch, the Arduino team decided\
    \ to modify the Processing IDE. That's the reason why both IDEs look so similar\
    \ and why Arduino sketches have the file extension .pde (Processing Development\
    \ Environment), for example.\n\nUsing Processing as the basis for the Arduino\
    \ project provided a good and well-tested IDE for free. Processing and the Arduino\
    \ are a good team for several other reasons:\n\n- The Arduino simplifies embedded\
    \ computing, and Processing simplifies the creation of multimedia applications.\
    \ So, you can easily visualize sensor data in often spectacular ways.\n- Processing\
    \ is easy to learn, especially if you already know Java.\n- Processing has excellent\
    \ support for serial communication.\n\nSo, for many reasons, Processing is well\
    \ worth a look, but it’s especially useful when working with the Arduino. That’s\
    \ why we’ll use it for several of the book’s examples.\n\n## 5.6 Representing\
    \ Sensor Data\n\nWe start with a Processing class that represents the current\
    \ sensor data we return from the Arduino via serial port. Open a new file in the\
    \ Processing IDE, and enter the following code:\n\n```\nclass SensorData {\nprivate\
    \ float temperature;\nprivate float distance;\n\nSensorData(float temperature,\
    \ float distance) {\nthis.temperature = temperature;\nthis.distance = distance;\n\
    }\n\nfloat getTemperature() {\nreturn this.temperature;\n}\n\nfloat getDistance()\
    \ {\nreturn this.distance;\n}\n}\n```\n\nIf you are familiar with Java or C++,\
    \ the SensorData class will be perfectly clear to you. It encapsulates a temperature\
    \ value and a distance\n\nas floating-point numbers and provides access to the\
    \ data via accessor methods (getTemperature() and getDistance()). You can create\
    \ new SensorData objects using the constructor, passing it the current temperature\
    \ and distance.\n\nProcessing is an object-oriented programming language and allows\
    \ us to define new classes using the **class** keyword. Classes have a name and\
    \ they contain data (often called *attributes* or *properties*) and functions\
    \ (often called *methods*). Our SensorData class contains two attributes named\
    \ temperature and distance. They are both of type **float**, and we have declared\
    \ them both **private**. Now only members of the SensorData class are allowed\
    \ to access them. This is considered good style, because it prevents unwanted\
    \ side effects and makes future changes much easier. A class should never expose\
    \ its innards.\n\nTo set and get the values of our attributes, we have to use\
    \ public methods, and our class has three of them: SensorData(), getTemperature(),\
    \ and getDistance(). (Java and C++ programmers should note that in Processing\
    \ everything is public if not specified otherwise!) A method that has the same\
    \ name as the class is called a *constructor*, and you can use it for creating\
    \ and initializing new objects of that particular class. Constructors do not have\
    \ return values, but they may specify parameters. Ours, for example, takes two\
    \ arguments and uses them to initialize our two attributes.\n\nThere’s a small\
    \ problem, though: our method’s parameters have the same names as our classes’\
    \ attributes. What would happen if we simply assigned the method parameters to\
    \ the attributes like this:\n\n```\ntemperature = temperature;\ndistance = distance;\n\
    ```\n\nRight: we simply assigned every method parameter to itself, which is effectively\
    \ a no-operation. That’s why we use the **this** keyword. It refers to the class\
    \ itself, so we can distinguish between the method parameters and the classes’\
    \ attributes. Alternatively, we could have used different names for the method\
    \ parameters or the attributes, but I prefer to use **this**.\n\nAfter the constructor,\
    \ we define the methods getTemperature and getDistance. Their definitions are\
    \ very similar; we declare the method’s return type (**float**), the method’s\
    \ name, and a list of parameters in parentheses. In our case, the parameter list\
    \ is empty. In the methods, we return the\n\ncurrent value of the corresponding\
    \ attributes using the **return** keyword. **return** stops the method and returns\
    \ its argument to the method’s caller.\n\nNow we can create and initialize new\
    \ SensorData objects:\n\n```\nSensorData sensorData = new SensorData(31.5, 11.76);\n\
    ```\n\nThe previous statement creates a new SensorData object named sensorData.\
    \ It sets temperature to 31.5 and distance to 11.76. To read those values, we\
    \ use the corresponding “get” methods:\n\n```\nsensorData.getTemperature(); //\
    \ -> 31.5\nsensorData.getDistance();    // -> 11.76\n```\n\nBecause getTemperature()\
    \ and getDistance() are members of the SensorData class, you can only invoke them\
    \ using an instance of the class. Our instance is named sensorData, and to call\
    \ the “get” methods we have to use the instance name, followed by a dot, followed\
    \ by the method name.\n\nNow that we can store sensor data, we’ll continue to\
    \ build our inverted sonar application in the next section.\n\n## 5.7 Building\
    \ the Application’s Foundation\n\nIn this section, we’ll create all the boilerplate\
    \ code we need for our application by importing some libraries and defining some\
    \ global constants and variables:\n\nDownload ultrasonic/InvertedSonar/InvertedSonar.pde\n\
    \n```\nimport processing.serial.*;\n\nfinal int WIDTH = 1000;\nfinal int HEIGHT\
    \ = 1000;\nfinal int xCenter = WIDTH / 2;\nfinal int yCenter = HEIGHT / 2;\nfinal\
    \ int LINE_FEED = 10;\n\nSerial arduinoPort;\nSensorData sensorData;\nint degree\
    \ = 0;\nint radius = 0;\n```\n\nTo communicate with the Arduino via a serial port,\
    \ we import Processing’s support for serial communication in the first line. The\
    \ **import** statement imports all classes from the processing.serial package\
    \ and makes them available in our program.\n\nOur application will have a 1000x1000\
    \ pixel screen, so we define constants for its width, height, and its center.\
    \ We set the LINE_FEED constant to the ASCII value of a linefeed character, because\
    \ we need it later to interpret the data sent by the Arduino.\n\nThen we define\
    \ a few global variables (yes, you Java programmers out there: Processing allows\
    \ you to define global variables!):\n\n- *arduinoPort*: An instance of Processing’s\
    \ Serial class. It’s from the processing.serial package we have imported and encapsulates\
    \ the serial port communication with the Arduino.\n- *sensorData*: The current\
    \ sensor data that have been transferred from the Arduino to our application.\
    \ We use the SensorData class we defined in Section 5.6, *Representing Sensor\
    \ Data*, on page 123.\n- *degree*: We will visualize the current distance to the\
    \ nearest object on a circle. This variable stores on which degree of the circle\
    \ we are right now. Values range from 0 to 359.\n- *radius*: The current distance\
    \ to the nearest object is interpreted as a radius value.\n\n## 5.8 Implementing\
    \ Serial Communication in Processing\n\nThe following functions read data from\
    \ the serial port the Arduino is connected to, and they interpret the data the\
    \ Arduino is sending:\n\nDownload ultrasonic/InvertedSonar/InvertedSonar.pde\n\
    \n```\nvoid setup() {\n  size(WIDTH, HEIGHT);\n  println(Serial.list());\n  String\
    \ arduinoPortName = Serial.list()[0];\n  arduinoPort = new Serial(this, arduinoPortName,\
    \ 9600);\n  arduinoPort.bufferUntil(LINE_FEED);\n}\n\nvoid serialEvent(Serial\
    \ port) {\n  sensorData = getSensorData();\n  if (sensorData != null) {\n    println(\"\
    Temperature: \" + sensorData.getTemperature());\n    println(\"Distance: \" +\
    \ sensorData.getDistance());\n    radius = min(300, int(sensorData.getDistance()\
    \ * 2));\n  }\n}\n\nSensorData getSensorData() {\n```\n\n```\nSensorData result\
    \ = null;\nif (arduinoPort.available() > 0) {\n    final String arduinoOutput\
    \ = arduinoPort.readStringUntil(LINE_FEED);\n    result = parseArduinoOutput(arduinoOutput);\n\
    }\nreturn result;\n}\n\nSensorData parseArduinoOutput(final String arduinoOutput)\
    \ {\n    SensorData result = null;\n    if (arduinoOutput != null) {\n       \
    \ final int[] data = int(split(trim(arduinoOutput), ','));\n        if (data.length\
    \ == 2)\n            result = new SensorData(data[0] / 100.0, data[1] / 100.0);\n\
    \    }\n    return result;\n}\n```\n\nsetup() is one of Processing’s standard\
    \ functions and has the same meaning as the Arduino’s setup() method. The Processing\
    \ runtime environment calls it only once at application startup time and initializes\
    \ the application. With the size() method, we create a new screen having a certain\
    \ width and height (by the way, you can find excellent reference material for\
    \ all Processing classes online⁶).\n\nAfter initializing the screen, we prepare\
    \ the serial port communication. First we print a list of all serial devices that\
    \ are currently connected to the computer using Serial.list(). Then we set the\
    \ name of the serial port we are going to use to the first list entry. This might\
    \ be the wrong port, so either you hard-code the name of your system’s serial\
    \ port into the code or you have a look at the list of serial ports and choose\
    \ the right one!\n\nIn line 5, we create a new Serial object that is bound to\
    \ our application (that’s what this is for). We use the serial port name we have\
    \ from the list of all serial ports and set the baud rate to 9600. If you’d like\
    \ to communicate faster, you have to change both the baud rate here and in the\
    \ Arduino sketch.\n\nFinally, we tell the Serial object that we want to be notified\
    \ of new serial data only when a linefeed has been detected. Whenever we find\
    \ a linefeed, we know that a whole line of data was transmitted by the Arduino.\n\
    \nFor our application, we chose an asynchronous programming model; that is, we\
    \ do not poll for new data in a loop but get notified whenever\n\n6. http://processing.org/reference/\n"
  mdcn: "\n\n从零开始构建一个新的编程环境，Arduino 团队决定修改 Processing IDE。这就是为什么两个 IDE 看起来如此相似，以及为什么\
    \ Arduino 草图具有文件扩展名 .pde（Processing Development Environment）的缘故，例如。\n\n使用 Processing\
    \ 作为 Arduino 项目的基础，为我们免费提供了一个良好且经过充分测试的 IDE。Processing 和 Arduino 因以下几个原因成为一对好搭档：\n\
    \n- Arduino 简化了嵌入式计算，而 Processing 简化了多媒体应用的创建。因此，你可以以常常令人惊叹的方式轻松可视化传感器数据。\n- Processing\
    \ 易于学习，尤其是如果你已经了解 Java。\n- Processing 对串行通信有出色的支持。\n\n因此，出于许多原因，Processing 非常值得一看，但在与\
    \ Arduino 协作时尤其有用。这就是为什么我们将在本书的多个示例中使用它。\n\n## 5.6 表示传感器数据\n\n我们从一个 Processing\
    \ 类开始，该类表示我们通过串行端口从 Arduino 返回的当前传感器数据。在 Processing IDE 中打开一个新文件，并输入以下代码：\n\n\
    ```\nclass SensorData {\nprivate float temperature;\nprivate float distance;\n\
    \nSensorData(float temperature, float distance) {\nthis.temperature = temperature;\n\
    this.distance = distance;\n}\n\nfloat getTemperature() {\nreturn this.temperature;\n\
    }\n\nfloat getDistance() {\nreturn this.distance;\n}\n}\n```\n\n如果你熟悉 Java 或 C++，SensorData\
