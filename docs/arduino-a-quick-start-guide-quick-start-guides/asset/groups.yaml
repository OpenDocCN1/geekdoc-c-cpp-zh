    MacBook Pro, it''s /dev/cu.usbmodemfa141). On Linux systems, it should be /dev/ttyUSB0,
    /dev/ttyUSB1, or something similar depending on the number of USB ports your computer
    has.


    On Windows systems, it''s a bit more complicated to find out the right serial
    port, but it''s still not difficult. Go to the Device Manager, and look for USB
    Serial Port below the Ports (COM & LPT) menu entry (see Figure 1.9, on the following
    page). Usually the port is named COM1, COM2, or something similar.


    After you have chosen the right serial port, click the Verify button, and you
    should see the following output in the IDE''s message area (the Arduino IDE calls
    programs sketches):


    ```

    Binary sketch size: 1010 bytes (of a 32256 byte maximum)

    ```


    This means the IDE has successfully compiled the source code into 1,010 bytes
    of machine code that we can upload to the Arduino. If you see an error message
    instead, check whether you have typed in the program correctly (when in doubt,
    download the code from the book''s website).12 Depending on the Arduino board
    you''re using, the byte maximum may differ. On an Arduino Duemilanove, it''s usually
    14336, for example.


    Now click the Upload button, and after a few seconds, you should see the following
    output in the message area:


    ```

    Binary sketch size: 1010 bytes (of a 32256 byte maximum)

    ```


    This is exactly the same message we got after compiling the program, and it tells
    us that the 1,010 bytes of machine code were transferred successfully to the Arduino.
    In case of any errors, check whether you have selected the correct Arduino type
    and the correct serial port in the Tools menu.


    During the upload process, the TX and RX LEDs will flicker for a few seconds.
    This is normal, and it happens whenever the Arduino and your computer communicate
    via the serial port. When the Arduino sends information, it turns on the TX LED.
    When it gets some bits, it turns on the RX LED. Because the communication is pretty
    fast, the LEDs start to flicker, and you cannot identify the transmission of a
    single byte (if you can, you are probably an alien).


