    \ crosses the area, the tentacles move into the person’s direction. Servos move\
    \ the tentacles, and an Arduino controls the servos.\n\nFor all people interested\
    \ in new-media art, Alicia Gibb’s thesis “New Media Art, Design, and the Arduino\
    \ Microcontroller: A Malleable Tool”† is a must-read.\n\n- * http://www.michiganbank.com/anthros\n\
    - † http://aliciagibb.com/thesis/\n\nsomeone directly, you can tell the Blaminatr\
