    \n当然，你可以将电机用于更严肃的项目。例如，你可以用它们制造轮式机器人或类似的设备。但是你不能在“裸”Arduino 上连接太多电机，因为它不是为驱动较大负载而设计的。因此，如果你有一个需要大量电机的项目，应该考虑购买电机扩展板⁶，或使用诸如\
    \ Roboduino 之类的专用扩展板。⁷\n\n## 10.5 如果它不工作怎么办？\n\n使用电机出奇地简单，但仍然有很多事情可能出错。最大的问题是电机消耗大量电力，因此你不能简单地将每个电机都连接到\
    \ Arduino。此外，你也不容易驱动多个电机，尤其是在仅靠 USB 端口提供少量电力的情况下。如果你的电机运行不符合预期，请检查其规格，并在必要时为你的\
    \ Arduino 连接交流或直流适配器。\n\n### 更多电机项目\n\n电机令人着迷。在网上搜索，你会发现大量将 Arduino 与电机结合的项目。一个有趣的项目是\
    \ Arduino Hypnodisk。\\* 它使用舵机旋转催眠盘——一个印有螺旋图案的旋转盘，具有催眠效果。红外测距仪改变电机的速度，因此你越靠近盘子，它旋转得越快。\n\
    \n一个有用且令人兴奋的项目是 USB 沙漏。† 它使用 Arduino 和舵机来翻转沙漏，并使用光学传感器观察沙子下落。每当所有沙子都漏完时，该设备会自动翻转沙漏。\n\
    \n这一切都很好，但该设备的主要目的是生成真正的随机数。落沙是产生真正随机性的完美基础（参见第 73 页的边栏），而 USB 沙漏使用其光学传感器的信号生成随机数，并将它们发送到串行端口。\n\
    \n你也不应该给电机施加过多的重量。移动一个纸做的箭头没有问题，但如果你附加更大更重的物体，可能会遇到问题。此外，注意不要在电机的路径上放置任何障碍物。电机的轴必须始终能自由移动。\n\
    \n有些电机需要时不时进行调整，通常你必须使用非常小的螺丝刀进行。有关详细说明，请参阅电机的规格。\n\n## 10.6 练习\n\n- 为 Blaminatr\
    \ 添加一个以太网扩展板，这样你就可以通过互联网指责人们，而不仅仅是通过串行端口。例如，将你的 Web 浏览器指向类似 http://192.168.1.42/blame/Maik\
    \ 的地址，就应该指责我。\n\n- 基于 TMP36 温度传感器和舵机制作一个温度计。它的显示可以如图 10.6 所示；也就是说，你必须移动一个指向当前温度的箭头。\n\
    \n  ![](img/dcfd13a1bf99c4d3f9996627012a6526_234_0.png)\n\n- 使用 IR 接收器来控制 Blaminatr。例如，你可以使用电视遥控器的频道键来让\
    \ Blaminatr 从一个名字切换到另一个名字。\n\n## 附录 A：电子学基础\n\n我们创建第一个 Arduino 项目时并不需要很多理论或背景知识。但如果你想构建更大、更复杂的项目，学习一些电学知识和焊接技巧是个好主意。\n\
    \n在本附录中，你将学习电学基础知识，并了解欧姆定律，这可能是电子学中最重要的定律。此外，你还将了解更多关于电阻的知识，并会发现焊接并没有看起来那么困难。\n\
    \n### A.1 电流、电压和电阻\n\n要构建你的第一个 Arduino 项目，你不需要了解很多电学知识。但到了某个时候，你需要理解电流、电压和电阻究竟是什么。例如，你已经知道在\
    \ LED 前总是要放一个电阻，但你可能不完全知道为什么，也不知道如何针对给定的 LED 计算电阻的大小。让我们来解决这个问题。\n\n电路在许多方面类似于水循环。在下一页的图\
    \ A.1 中，你可以看到左侧是水循环，右侧是电路。它们如此相似，令人着迷，而且当你使用一个充当电源的水力发电机时，你甚至可以在它们之间找到联系。让我们仔细看看它们最重要的属性。\n\
    \n水在水循环中流动，而电子在电路中流动。电压相当于电学中的水压，以伏特（V）为单位。电压是电流产生的初始原因，电压越高，电流流动越快。\n\n"
