    ## Part I: Getting Started with Arduino


    ### Chapter 1: Welcome to the Arduino


    The Arduino was originally built for designers and artists—people with little
    technical expertise. Even without programming experience, the Arduino enabled
    them to create sophisticated design prototypes and some amazing interactive artworks.
    So, it should come as no surprise that the first steps with the Arduino are very
    easy, even more so for people with a strong technical background.


    But it’s still important to get the basics right. You’ll get the most out of working
    with the Arduino if you’re familiar with the Arduino board itself, with its development
    environment, and with techniques such as serial communication.


    One thing to understand before getting started is *physical computing*. If you
    have worked with computers before, you might wonder what this means. After all,
    computers are physical objects, and they accept input from physical keyboards
    and mice. They output sound and video to physical speakers and displays. So, isn’t
    all computing physical computing in the end?


    In principle, regular computing is a subset of physical computing: keyboard and
    mouse are *sensors* for real-world inputs, and displays or printers are *actuators*.
    But controlling special sensors and actuators, using a regular computer is very
    difficult. Using an Arduino, it’s a piece of cake to control sophisticated and
    sometimes even weird devices. In the rest of this book, you’ll learn how, and
    in this chapter you’ll get started with physical computing by learning how to
    control the Arduino, what tools you need, and how to install and configure them.
    Then we’ll quickly get to the fun part: you’ll develop your first program for
    the Arduino.


    Figure 1.1. You can choose from many different Arduinos.


    Seeeduino, Boarduino, and the amazing Paperduino, an Arduino clone without a printed
    circuit board. All its parts are attached to an ordinary piece of paper.


    Arduino is a registered trademark—only the official boards are named "Arduino."—so
    clones usually have names ending with "duino." You can use every clone that is
    fully compatible with the original Arduino to build all the book''s projects.


    In Figure 1.2, on the next page, you can see a photo of an Arduino Uno board and
    its most important parts. I''ll explain them one by one. Let''s start with the
    USB connector. To connect an Arduino to your computer,


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_26_0.png)


    Figure 1.3: You can power an Arduino with an AC adapter.


    In these situations, the best solution usually is an AC adapter (see Figure 1.3)
    supplying 9 volts (the recommended range is 7V to 12V).⁵ You need an adapter with
    a 2.1 mm barrel tip and a positive center (you don’t need to understand what that
    means right now; just ask for it in your local electronics store). Plug it into
    the Arduino’s power jack, and it will start immediately, even if it isn’t connected
    to a computer. By the way, even if you connect the Arduino to an USB port, it
    will use the external power supply if available.


    Please note that older versions of the Arduino board (Arduino-NG and Diecimila)
    don’t switch automatically between an external power supply and a USB supply.
    They come with a power selection jumper labeled PWR_SEL, and you manually have
    to set it to EXT or USB, respectively (see Figure 1.4, on the next page).


    Now you know two ways to supply the Arduino with power. But the Arduino isn’t
    greedy and happily shares its power with other devices. At the bottom of Figure
    1.2, on the preceding page, you can see several sockets (sometimes I’ll also call
    them pins, because internally they are connected to pins in the microcontroller)
    related to power supply:


    - Using the pins labeled 3V3 and 5V, you can power external devices connected
    to the Arduino with 3.3 volts or 5 volts.


