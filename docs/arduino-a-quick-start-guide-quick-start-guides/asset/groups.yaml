    ### 5.9 可视化传感器数据


    现在，我们的计算机与 Arduino 之间的串行通信已经正常工作，让我们将到最近物体的距离可视化：


    ```

    void init_screen() {

    background(255);

    stroke(0);

    strokeWeight(1);

    int[] radius_values = { 300, 250, 200, 150, 100, 50 };

    for (int r = 0; r < radius_values.length; r++) {

    final int current_radius = radius_values[r] * 2;

    ellipse(xCenter, yCenter, current_radius, current_radius);

    }

    strokeWeight(10);

    }

    ```


    ```

    void draw() {

    init_screen();

    int x = (int)(radius * Math.cos(degree * Math.PI / 180));

    int y = (int)(radius * Math.sin(degree * Math.PI / 180));

    point(xCenter + x, yCenter + y);

    if (++degree == 360)

    degree = 0;

    }

    ```


    init_screen() 在第 2 行清除屏幕并将背景颜色设置为白色。它使用 stroke(0) 将绘图颜色设置为黑色，并将用于绘制形状的描边宽度设置为
    1 像素。然后，它在屏幕中心周围绘制六个同心圆。这些圆将帮助我们了解最近的物体距离 PING))) 传感器有多远。最后，它将描边宽度设置为 10，这样我们就可以用一个
    10 像素宽的点来显示传感器。


    Processing 会以一定的帧速率（默认是每秒 60 帧）自动调用 draw() 方法，这相当于 Arduino 的 loop() 方法。在我们的例子中，我们初始化屏幕并计算位于圆上的坐标。圆的半径取决于我们与
    Arduino 之间的距离，因此我们有一个在圆上移动的点。该点到圆心的距离取决于我们用 PING))) 传感器测量的数据。


    ### 传感器的趣味应用


    有了超声波传感器，你可以轻松检测是否有人靠近。这自然会让人联想到许多有用的应用。例如，当有人足够近时，你可以自动打开门。


    或者，你也可以将先进的技术用于纯粹的娱乐。比如一些万圣节的小把戏：一个南瓜，只要你越过一条无形的线，它就会喷射出彩带？* 这可能会成为你下一次派对上一个不错的恶作剧，而且你可以用
    PING))) 传感器来制作它。†


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_129_0.png)


    因此，我们已经看到有两种类型的传感器：数字传感器和模拟传感器。你还学习了如何将这两种类型的传感器连接到 Arduino，以及如何将它们的测量数据传输到计算机。处理这两种不同的
    I/O 类型是所有物理计算的基础，几乎每一个项目——无论多么复杂——都是你本章所学内容的延伸。


    > * http://www.instructables.com/id/Arduino-controlled-Silly-String-shooter/


    > † http://arduinofun.com/blog/2009/11/01/silly-string-shooting-spider-contest-entry/


    ### 5.10 如果它不工作怎么办？


    请参阅第 86 页的 3.8 节“*如果它不工作怎么办？*”，并确保你已将所有部件正确连接到面包板上。要特别小心 PING))) 和 TMP36 传感器，因为你以前从未使用过它们。请确保已将正确的引脚连接到传感器的正确接口上。


    如果软件出现任何错误——无论是 Processing 代码还是 Arduino 代码——请从本书的网站下载代码，看看它是否能正常工作。


    如果你在串行通信方面遇到问题，请仔细检查是否使用了正确的串行端口和正确的 Arduino 型号。有可能你的 Arduino 连接到了另一个端口。在这种情况下，你需要相应地更改语句
    `arduinoPort = new Serial(this, Serial.list()[0], 9600);` 中的索引 0。还要检查 Processing
    代码和串行监视器中的波特率是否与你在 Arduino 代码中使用的波特率一致。请确保串行端口没有被其他应用程序占用，例如你忘记关闭的串行监视器窗口。


    ### 5.11 练习


    - 构建一个自动防盗报警器，当有人离你的计算机太近时，它会显示一个停止标志。⁷ 尽量让应用程序智能一些。例如，它应该有一个小的激活延迟，以防止在启动时立即显示停止标志。

    - 声音的速度不仅取决于温度，还取决于湿度和大气压力。做一些研究，找到正确的公式和合适的传感器。⁸ 利用你的研究成果，让我们的距离测量电路更加精确。

    - 使用其他技术来测量距离，例如红外传感器。尝试找到合适的传感器，阅读其数据手册，并搭建一个基本电路，这样你就可以将到最近物体的距离输出到串行端口。


    7. 你可以在这里找到停止标志：http://en.wikipedia.org/wiki/File:Stop_sign_MUTCD.svg。

    8. 试试 http://parallax.com。


    ## 第 6 章：构建动作感应游戏控制器


    我们对于新技术的适应速度之快令人惊讶。十年前，没有多少人会想到有一天我们会使用设备来悄无声息地追踪我们的动作。如今，当我们想要从竖屏切换到横屏时，物理转动智能手机对我们来说已完全正常。甚至小孩子都直观地知道如何使用任天堂
    Wii 等视频游戏机的动作感应控制器。你可以使用 Arduino 构建自己的动作感应设备，在本章中你将学习如何做到这一点。


    我们将使用一种最广泛使用的动作感应设备：*加速度计*。加速度计能够检测所有方向的运动——无论是向上、向下、向前、向后、向左还是向右移动，它们都能感知到。许多流行的设备，如
    iPhone 和任天堂 Wii 控制器，都包含加速度计。这就是加速度计价格便宜的原因。


    无论是有趣的还是严肃的项目，都能从加速度计中受益。在使用计算机时，你肯定会想到游戏控制器或其他输入控制设备等项目。但你也可以在做运动时使用它们，或用来控制现实世界中的弹珠迷宫。你还可以或多或少间接地用它们来测量加速度，例如在汽车中。


    你将学习如何正确解读加速度计数据，以及如何获得最准确的结果。然后，你将使用加速度计构建自己的动作感应游戏控制器，并实现一个使用它的游戏。


