    \n使用功能齐全的 PC 作为 Arduino 的互联网中继很方便，但对于大多数应用来说也有些过度。在下一节中，你将学习如何将 Arduino 变成真正的网络设备。\n\
    \n## 8.5 使用以太网 Shield 进行网络通信\n\n在上一节中，你学习了如何通过使用电脑的网络连接来构建具有 Arduino 的网络应用。这种方法效果不错，但也有一些缺点。最大的问题是\n\
    \n### Tweeting Arduinos\n\n最受欢迎的硬件套件之一是 Botanical.* 它检查你的植物是否需要浇水，如果需要，它会通过 http://twitter.com/\
    \ 发送提醒消息。一旦你给它浇水，它会恭敬地发送一条“谢谢”消息。虽然 Botanical 的官方版本是专用硬件，但你也可以使用 Arduino 来构建它。†\n\
    \nBotanical 确实让你的生活更轻松一些。Twitwee Clock‡ 是否能改善你的生活则见仁见智。这种改装的布谷鸟钟通过无线互联网连接查找 Twitter\
    \ 更新。每当它找到可编程的搜索词时，它就会在显示屏上显示相应的推文，并弹出一个发出噪音的布谷鸟。你最好在建造这个项目并把它安装在客厅之前先征求家人的意见。\n\
    \n* http://www.botanical.com/\n† http://www.botanical.com/archived_kits/twitter/\n\
    ‡ http://www.haroonbaig.com/projects/TwitweeClock/\n\n你需要一台完整的 PC，而对于许多应用来说，Arduino\
    \ 的硬件能力就足够了。在本节中，你将学习如何使用以太网 Shield 解决这个问题。\n\n你不能将裸露的 Arduino 连接到网络。不仅它的硬件能力太有限，它也没有以太网端口。这意味着你不能将以太网电缆插入其中，为克服这一限制，你必须使用以太网\
    \ Shield。这类 Shield 带有以太网芯片和以太网连接器，能立即将你的 Arduino 变为网络设备。你只需要把它插上。\n\n你可以从多种产品中选择；它们都很好并且能很好地发挥作用。7\
    \ 对于原型制作，我更喜欢“官方” Shield，8 因为它为所有引脚都提供了插座（它在图 8.6 中位于左侧，见下一页）。此外，在撰写本文时，Arduino\
    \ 团队宣布了 Arduino Ethernet，这是一款自带以太网端口的 Arduino 板，无需单独的 Shield。\n\n7. 例如参见 http://www.ladyada.net/make/eshield/\n\
    8. http://www.arduino.cc/en/Main/ArduinoEthernetShield\n\n"
