    # Chapter 9


    # Creating Your Own Universal Remote Control


    Remote controls add a lot of convenience to our lives, but they aren’t without
    annoyances. Sometimes remotes don’t have a certain function that you’d like to
    have, such as a sleep timer. Plus, remote controls seem to reproduce at the same
    rate as rabbits. They quickly occupy your whole coffee table, and you have to
    feed them with expensive batteries that you don’t have at home when you need them
    during a Sunday evening football game. Universal remote controls reduce the pain
    a bit, but even the most expensive products aren’t perfect.


    Although we use remote controls every day, few of us understand how they work.
    In this chapter, you’ll find out how remote controls work from the inside out,
    and then you’ll build your own universal remote control that’s better than a store-bought
    one because you can fully customize it to your needs. You can easily add all your
    favorite functions, and you can also add functions other remotes don’t offer.
    If a commercial product doesn’t support a certain vendor, you’re usually stuck.
