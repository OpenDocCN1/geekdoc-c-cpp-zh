  mdcn: "\n\n## 备选联网技术\n\n以太网是最流行、最强大的联网技术之一。使用以太网扩展板，你可以轻松地将 Arduino 作为客户端和服务器接入互联网。\n\
    \n根据项目需求，有时使用无线连接会更好。有了 WiFi 扩展板\\*，你可以轻松地将 Arduino 变成一个无线联网设备。\n\n但很多时候你并不需要以太网的全部功能，尤其是当只需要在个人局域网中进行短距离通信时。你可以从多种方案中选择，但蓝牙和\
    \ ZigBee† 可能是最受欢迎的。Arduino 有这两种方案的出色解决方案。\n\n最后，你甚至可以让 Arduino 接入蜂窝网络。插入 GSM 扩展板‡\
    \ 和你的 SIM 卡，一切就绪。\n\n\\* WiShield (http://www.asynclabs.com/) 和 WiFly (http://www.sparkfun.com/commerce/product_info.php?products_id=9954)\
    \ 都是不错的产品。\n\n† http://en.wikipedia.org/wiki/Zigbee\n\n‡ http://www.hwkitchen.com/products/gsm-playground/\n\
    \n- 你使用了网络中不允许的 IP 地址，或者该地址已被其他设备占用。请仔细检查你的 IP 地址。\n- 你使用了错误的凭证访问服务（如 Twitter）。确保使用正确的\
    \ OAuth 令牌。\n- Twitter 不允许重复推文。因此，当你的应用未能发送推文时，请确保最近没有发送过相同推文。\n- 过去几十年中，网络已经变得非常可靠，但有时仍然有些脆弱。因此，连接失败或超时的情况很可能发生。相应地增加草图中的延迟。\n\
    \n## 第 9 章 创建你自己的通用遥控器\n\n遥控器为我们的生活增添了许多便利，但也并非没有烦恼。有时遥控器没有你想要的某个功能，例如睡眠定时器。此外，遥控器似乎像兔子一样繁殖。它们很快占据你的整个咖啡桌，而当你周日晚间观看橄榄球赛需要它们时，你不得不为它们购买昂贵的电池，而家里却没有。通用遥控器稍微减轻了这种痛苦，但即使是最昂贵的产品也并非完美。\n\
    \n虽然我们每天使用遥控器，但很少有人了解它们的工作原理。在本章中，你将深入了解遥控器的工作原理，然后动手制作自己的通用遥控器，它将比市售产品更好，因为你可以完全根据自己的需求进行定制。你可以轻松添加所有喜爱的功能，也可以添加其他遥控器不具备的功能。如果商业产品不支持某个厂商，你通常只能束手无策。有了自己的遥控器，你可以轻松自行添加新协议。你甚至不仅可以支持红外，还可以添加蓝牙或\
    \ WiFi 等更多传输技术。\n\n你将首先学习红外光信号的基础知识，然后快速搭建第一个项目，使用红外传感器从手头的任何遥控器获取控制码。一旦获取了控制码，就可以使用红外\
    \ LED 发射它们，然后开始构建你自己的通用遥控器。\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_202_0.png)\n\
    \n接下来，我们甚至会将遥控器的概念更进一步。一旦我们拥有了通用遥控器，我们将使用串口或以太网连接来控制 Arduino 本身。这样，你就可以使用网络浏览器控制\
    \ Arduino，从而通过互联网控制你的电视或 DVD 录像机（见图 9.1）。\n\n1. Arduino 以太网扩展板。\n2. 一块面包板。\n3.\
    \ 一个红外接收器，最好使用 PNA4602。\n4. 一个 100Ω 电阻。\n5. 一个红外 LED。\n6. 一些导线。\n7. 一个或多个红外遥控器。它们可以来自你的电视、DVD\
    \ 播放器或 Mac。为了遵循本章的示例，最好有一台 Mac 和一个 Apple Remote。但这不是必需的。如果你不使用 Apple Remote，请务必相应调整示例中的协议名称、位长度和控制码。例如，如果你使用的遥控器属于\
    \ Sony 电视，请将协议名称设置为 SONY（你将在第 205 页的 9.3 节“抓取遥控器控制码”中了解更多）。\n8. 一块 Arduino 开发板，如\
    \ Uno、Duemilanove 或 Diecimila。\n9. 一根 USB 电缆，用于将 Arduino 连接到计算机。\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_203_0.png)\n\
    \n图 9.2：本章所需的所有零件\n\n### 9.2 了解红外遥控器\n\n要无线控制电视等设备，你需要一个发送器和一个接收器。接收器通常内置于被控设备中，发送器则是独立遥控器的一部分。虽然你可以选择蓝牙或\
    \ WiFi 等多种技术，但大多数现代遥控器仍然使用红外光进行通信。\n\n使用红外光传输信号有几个优点。它对人眼不可见，因此不会打扰你。此外，你可以用红外\
    \ LED 廉价地生成它，而且红外 LED 很容易集成到电子电路中。因此，对于诸如典型家庭中控制设备等许多用途而言，它是一个绝佳的选择。\n\n但它也有一些缺点。它不能穿透墙壁或门，遥控器与被操作设备之间的距离也相当有限。更重要的是，红外信号容易受到其他光源的干扰。\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_205_0.png)\n\n图 9.3：PNA4602 红外传感器\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_205_1.png)\n\n图 9.4：将红外接收器连接到 Arduino\
    \ 很简单。\n\n在图 9.4 中，你可以看到如何将 PNA4602 接收器连接到 Arduino。它价格低廉、使用简单，并且工作在 38KHz 频率下，因此可以检测各种设备发出的信号。将它的接地端连接到\
    \ Arduino 的 GND 引脚之一，电源端连接到 Arduino 的 5V 引脚，信号端连接到数字引脚 11。\n\n你可能会想编写一个草图程序来读取并输出引脚\
    \ 11 上的所有传入数据，我不会阻止你。在 `loop()` 方法中调用 `digitalRead()`，并将结果输出到串口。将电视遥控器对准接收器，看看会发生什么。\n\
    \n你可能很难理解看到的数据。问题在于解码传入数据并不容易。即使接收器已经处理了数据，仍需要根据一些复杂的规则进行转换和解释。此外，Arduino 的 `digitalRead()`\
    \ 方法并不总是足够精确，无法处理所有类型的传入信号。你必须直接访问微控制器才能获得最佳结果。\n\n幸好，我们不必自己完成这项工作，因为 IRremote\
    \ 库² 隐藏了这些繁琐的细节。它支持最流行的红外协议，并且可以接收和发送数据。下载并解压 ZIP 文件³ 后，将 IRremote 目录复制到 `~/Documents/Arduino/libraries`（Mac\
    \ 上）或 `My Documents\\Arduino\\libraries`（Windows 机器上）。然后重新启动你的 IDE。\n\n使用以下草图，如果\
    \ IRremote 库支持传入红外信号的编码，你就能对其进行解码：\n\n下载 RemoteControl/InfraredDumper/InfraredDumper.pde\n\
    \n```\n#include <IRremote.h>\n\nconst unsigned int IR_RECEIVER_PIN = 11;\nconst\
    \ unsigned int BAUD_RATE = 9600;\n\nIRrecv ir_receiver(IR_RECEIVER_PIN);\ndecode_results\
    \ results;\n\nvoid setup() {\n  Serial.begin(BAUD_RATE);\n  ir_receiver.enableIRIn();\n\
    }\n\nvoid dump(const decode_results* results) {\n  const int protocol = results->decode_type;\n\
    \  Serial.print(\"Protocol: \");\n  if (protocol == UNKNOWN) {\n    Serial.println(\"\
    not recognized.\");\n  } else {\n    if (protocol == NEC) {\n      Serial.println(\"\
    NEC\");\n    } else if (protocol == SONY) {\n      Serial.println(\"SONY\");\n\
    \    } else if (protocol == RC5) {\n      Serial.println(\"RC5\");\n    } else\
    \ if (protocol == RC6) {\n      Serial.println(\"RC6\");\n    }\n  }\n}\n```\n\
    \n2. http://www.arcfn.com/2009/08/multi-protocol-infrared-remote-library.html\n\
    3. http://arcfn.com/files/IRremote.zip\n\n"
