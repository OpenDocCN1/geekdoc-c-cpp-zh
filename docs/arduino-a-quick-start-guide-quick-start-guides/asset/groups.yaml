    \ = 0;\nconst float SUPPLY_VOLTAGE = 5.0;\n```\n\n4. http://tinyurl.com/msard-analog\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_113_0.png)\n\nFigure 5.6: Connecting\
    \ the temperature sensor to the Arduino\n\n```\nconst unsigned int BAUD_RATE =\
    \ 9600;\n\nvoid setup() {\n  Serial.begin(BAUD_RATE);\n}\n\nvoid loop() {\n  Serial.print(get_temperature());\n\
    \  Serial.println(\" C\");\n  delay(1000);\n}\n\nconst float get_temperature()\
    \ {\n  const int sensor_voltage = analogRead(TEMP_SENSOR_PIN);\n  const float\
    \ voltage = sensor_voltage * SUPPLY_VOLTAGE / 1024;\n  return (voltage * 1000\
    \ - 500) / 10;\n}\n```\n\nIn the first two lines, we define constants for the\
    \ analog pin the sensor is connected to and for the Arduino's supply voltage.\
    \ Then we have a pretty normal setup() method followed by a loop() method that\
    \ outputs the current temperature every second. The whole sensor logic has been\
    \ encapsulated in the get_temperature() method.\n\nFor the PING))) sensor, we\
    \ only needed a digital pin that could be HIGH or LOW. Analog pins are different\
    \ and represent a voltage ranging from 0V to the current power supply (usually\
    \ 5V). We can read Arduino's analog pins using the analogRead() method that returns\
    \ a\n\nvalue between 0 and 1023, because analog pins have a resolution of ten\
    \ bits (1024 = 2¹⁰). We use it in line 16 to read the current voltage supplied\
    \ by the TMP36.\n\nThere’s one problem left, though: we have to turn the value\
    \ returned by analogRead() into an actual voltage value, so we must know the Arduino’s\
    \ current power supply. It usually is 5V, but there are Arduino models (the Arduino\
    \ Pro, for example) that use only 3.3V. You have to adjust the constant SUPPLY_VOLTAGE\
    \ accordingly.\n\nKnowing the supply voltage, we can turn the analog pin’s output\
    \ into a voltage value by dividing it by 1024 and by multiplying it with the supply\
    \ voltage afterward. That’s exactly what we do in line 17.\n\nWe now have to convert\
    \ the voltage the sensor delivers into degree Celsius. In the sensor’s data sheet,\
    \ we find the following formula:\n\nT = ((sensor output in mV) - 500) / 10\n\n\
    500 millivolts have to be subtracted, because the sensor always outputs a positive\
    \ voltage. This way, we can represent negative temperatures, too. The sensor’s\
    \ resolution is 10 millivolts, so we have to divide by 10. A voltage value of\
    \ 750 millivolts corresponds to a temperature of (750 - 500) / 10 = 25°C, for\
    \ example. See it implemented in line 18.\n\nCompile the program, upload it to\
    \ the Arduino, and you’ll see something like the following in your serial monitor:\n\
    \n```\n10.06 C\n26.64 C\n28.62 C\n28.50 C\n28.50 C\n29.00 C\n29.00 C\n28.50 C\n\
    29.00 C\n```\n\nAs you can see, the sensor needs some time to calibrate, but its\
    \ results get stable fairly quickly. By the way, you’ll always need to insert\
    \ a short delay between two calls to analogRead(), because the Arduino’s internal\
    \ analog system needs some time (0.0001 seconds) between two readings. We have\
    \ used a delay of a whole second to make the output easier to read and because\
    \ we do not expect the temperature to change rapidly. Otherwise, a delay of a\
    \ single millisecond would be enough.\n"
  mdcn: "\n我们现在只剩一件事要做：把测得的持续时间转换成长度。声音以每秒 343 米的速度传播，这意味着每厘米需要 29.155 微秒。所以，我们必须先用\
    \ 29 除以持续时间，然后再除以 2，因为声音要经过两次距离——它先到达物体，再返回 PING))) 传感器。microseconds_to_cm() 方法就是用来完成这个计算的。\n\
    \n根据 PING))) 传感器的规格说明，两次测量之间必须至少等待 200 微秒。对于高速测量，我们本可以通过实际测量代码运行时间来更精确地计算暂停时长。但在我们的情形下这没有意义，因为在\
    \ loop() 方法中两次测量之间执行的所有语句所需时间都远远超过 200 微秒。而且，向串口连接输出数据的开销相当大。尽管如此，我们还是添加了 100\
    \ 微秒的小延时，让输出稍微慢一点。\n\n你可能会奇怪，为什么我们如此频繁地使用 const 关键字。Arduino 语言基于 C/C++，在这些语言中，将常量值声明为\
    \ const 被视为良好实践（参见《Effective C++：改善程序与设计的 50 个具体做法》[Mey97]）。使用 const 不仅能让程序更简洁，并尽早防止逻辑错误，还能帮助编译器减小程序体积。\n\
    \n虽然大多数 Arduino 程序相对较小，但为 Arduino 开发软件仍然是软件开发，应当按照我们所知的所有最佳实践来做。因此，无论何时在程序中定义常量值，都要这样声明它（使用\
    \ const，而不是 #define）。这一点在其他编程语言中也一样，所以我们在 Processing 和 Java 程序中会大量使用 final（你将在第\
    \ 119 页的 5.5 节“使用 Processing 将数据传回计算机”中了解更多关于 Processing 的内容）。\n\n现在是时候摆弄一下传感器，熟悉它的长处和短处了。编译程序，上传到你的\
    \ Arduino 开发板，然后打开串口监视器（别忘了将波特率设置为 9600）。你应该会看到类似这样的内容：\n\n```\nDistance to nearest\
    \ object: 42 cm\nDistance to nearest object: 33 cm\nDistance to nearest object:\
    \ 27 cm\nDistance to nearest object: 27 cm\n```\n\n```\nconst float SENSOR_OFFSET\
    \ = MOUNTING_GAP * MICROSECONDS_PER_CM * 2;\n\nvoid setup() {\n  Serial.begin(BAUD_RATE);\n\
    }\n\nvoid loop() {\n  const unsigned long duration = measure_distance();\n  if\
    \ (duration == 0)\n    Serial.println(\"Warning: We did not get a pulse from sensor.\"\
    );\n  else\n    output_distance(duration);\n}\n\nconst float microseconds_to_cm(const\
    \ unsigned long microseconds) {\n  const float net_distance = max(0, microseconds\
    \ - SENSOR_OFFSET);\n  return net_distance / MICROSECONDS_PER_CM / 2;\n}\n\nconst\
    \ unsigned long measure_distance() {\n  pinMode(PING_SENSOR_IO_PIN, OUTPUT);\n\
    \  digitalWrite(PING_SENSOR_IO_PIN, LOW);\n  delayMicroseconds(2);\n\n  digitalWrite(PING_SENSOR_IO_PIN,\
    \ HIGH);\n  delayMicroseconds(5);\n  digitalWrite(PING_SENSOR_IO_PIN, LOW);\n\n\
    \  pinMode(PING_SENSOR_IO_PIN, INPUT);\n  return pulseIn(PING_SENSOR_IO_PIN, HIGH);\n\
    }\n\nvoid output_distance(const unsigned long duration) {\n  Serial.print(\"Distance\
    \ to nearest object: \");\n  Serial.print(microseconds_to_cm(duration));\n  Serial.println(\"\
    \ cm\");\n}\n```\n\n这个程序和我们的第一个版本差别不大。首先，我们使用了更精确的数值 29.155 来表示声音传播 1 厘米需要的微秒数。此外，距离计算现在考虑到了传感器与外壳之间可能存在的间隙。例如，如果你把传感器插到面包板上，传感器与面包板边缘之间通常会有一个小间隙。这个间隙在第\
    \ 5 行定义，稍后会用于距离计算。间隙以厘米为单位，并且会乘以 2，因为声音需要往返传播。\n\n在某些情况下，你仍然可以两全其美：获得浮点数支持，却无需付出内存代价。你可以在通过串口连接发送浮点值之前将它们转换为整数，从而节省大量空间。要以两位小数的精度传输数值，请将它们乘以\
    \ 100，并且不要忘记在接收端除以 100。稍后我们会使用这个技巧（包括舍入）。\n\n## 5.4 使用温度传感器提高精度\n\n支持浮点数当然是一项改进，但它主要是提高了程序输出的精度。我们本来可以用一些整数运算技巧达到类似效果。但现在，我们将添加一个无法用软件模仿的更好改进：温度传感器。\n\
    \n我之前说声音在空气中以 343m/s 传播时，并不完全准确，因为声速并不是恒定的——它除了其他因素外，还取决于空气温度。如果不考虑温度，误差可能高达相当可观的\
    \ 12%。我们用下面这个简单公式计算实际声速 C：\n\nC = 331.5 + (0.6 * t)\n\n要使用它，我们只需确定当前温度 t（摄氏度）。我们将使用\
    \ Analog Devices 公司的 TMP36 电压输出温度传感器。⁴ 它价格便宜，而且易于使用。\n\n要将 TMP36 连接到 Arduino，请将\
    \ Arduino 的接地端和电源端分别连接到 TMP36 的对应引脚。然后将传感器的信号引脚连接到 A0 引脚，也就是模拟引脚 0（参见下页的图 5.6）。\n\
    \n正如你可能从它厂商的名字猜到的那样，TMP36 是一个模拟器件：它根据当前温度改变信号引脚上的电压。温度越高，电压越高。对我们来说，这是一个学习如何使用\
    \ Arduino 模拟 IO 引脚的绝佳机会。那么，让我们看一段使用该传感器的代码：\n\n下载：temperature/sensortest/sensortest.pde\n\
    \n```\nconst unsigned int TEMP_SENSOR_PIN = 0;\nconst float SUPPLY_VOLTAGE = 5.0;\n\
    ```\n\n4. http://tinyurl.com/msard-analog\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_113_0.png)\n\
    \n图 5.6：将温度传感器连接到 Arduino\n\n```\nconst unsigned int BAUD_RATE = 9600;\n\nvoid\
    \ setup() {\n  Serial.begin(BAUD_RATE);\n}\n\nvoid loop() {\n  Serial.print(get_temperature());\n\
    \  Serial.println(\" C\");\n  delay(1000);\n}\n\nconst float get_temperature()\
    \ {\n  const int sensor_voltage = analogRead(TEMP_SENSOR_PIN);\n  const float\
    \ voltage = sensor_voltage * SUPPLY_VOLTAGE / 1024;\n  return (voltage * 1000\
    \ - 500) / 10;\n}\n```\n\n在头两行中，我们定义了传感器所连接的模拟引脚常量，以及 Arduino 的供电电压常量。然后是一个相当普通的\
    \ setup() 方法，后面跟着一个每秒输出一次当前温度的 loop() 方法。整个传感器逻辑都封装在 get_temperature() 方法中。\n\n\
    对于 PING))) 传感器，我们只需要一个可以是 HIGH 或 LOW 的数字引脚。模拟引脚则不同，它们表示从 0V 到当前供电电压（通常是 5V）之间的电压。我们可以使用\
    \ analogRead() 方法读取 Arduino 的模拟引脚，该方法返回 0 到 1023 之间的值，因为模拟引脚的分辨率是十位（1024 = 2¹⁰）。我们在第\
    \ 16 行使用它来读取 TMP36 当前提供的电压。\n\n不过还有一个问题：我们必须将 analogRead() 返回的值转换为实际电压值，因此必须知道\
    \ Arduino 当前的供电电压。它通常是 5V，但有些 Arduino 型号（例如 Arduino Pro）只使用 3.3V。你必须相应地调整 SUPPLY_VOLTAGE\
    \ 常量。\n\n知道了供电电压，我们就可以将模拟引脚的输出转换为电压值：先除以 1024，再乘以供电电压。这正是我们在第 17 行所做的。\n\n现在，我们必须把传感器输出的电压转换为摄氏度。在传感器的数据手册中，我们找到以下公式：\n\
    \nT = ((传感器输出（mV）) - 500) / 10\n\n必须减去 500 毫伏，因为传感器总是输出正电压。这样，我们也能表示负温度。传感器的分辨率是\
    \ 10 毫伏，因此我们必须除以 10。例如，750 毫伏的电压值对应 (750 - 500) / 10 = 25°C 的温度。你可以在第 18 行看到它的实现。\n\
    \n编译程序，上传到 Arduino，你就会在串口监视器中看到类似下面的内容：\n\n```\n10.06 C\n26.64 C\n28.62 C\n28.50\
    \ C\n28.50 C\n29.00 C\n29.00 C\n28.50 C\n29.00 C\n```\n\n如你所见，传感器需要一些时间来校准，但它的结果会很快稳定下来。顺便说一句，你总是需要在两次\
    \ analogRead() 调用之间插入一个短延时，因为 Arduino 的内部模拟系统在两次读数之间需要一些时间（0.0001 秒）。我们使用了整整一秒的延时，是为了让输出更容易阅读，也因为我们预计温度不会快速变化。否则，一毫秒的延时便足够了。\n"
