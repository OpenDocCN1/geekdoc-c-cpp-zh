    \ int[] buffer) {\n    int sum = 0;\n    for (int i = 0; i < _maxSamples; i++)\n\
    \        sum += buffer[i];\n    return (int)(sum / _maxSamples);\n}\n```\n\n`SensorDataBuffer`\
    \ 封装了三个缓冲区，分别用于存储 x、y、z 轴的加速度数据。它还存储一个缓冲区索引，用于记录当前在三个缓冲区中的位置。从第 8 行开始的构造函数期望接收最大样本数（缓冲区大小），并初始化缓冲区和索引。\n\
    \n`addData()` 方法接收三个空间轴的新值，并将它们追加到对应的缓冲区中。如果缓冲区已满，最旧的缓冲区条目将被丢弃。通过 `getX()`、`getY()`\
    \ 和 `getZ()`，你可以请求每个轴当前的加速度平均值。这三个方法都将工作委托给 `getAverageValue()` 方法。\n\n那么，现在让我们开始着手绘制一个\
    \ 3D 立方体。首先，我们初始化所有与串行通信相关的内容，以便与控制 Nunchuk 的 Arduino 通信：\n\n下载：MotionSensor/Cube/Cube.pde\n\
    \n```\nimport processing.serial.*;\n\nfinal int LINE_FEED = 10;\nfinal int MAX_SAMPLES\
    \ = 16;\n\nSerial arduinoPort;\nSensorDataBuffer sensorData = new SensorDataBuffer(MAX_SAMPLES);\n\
    ```\n\n像往常一样，我们导入串行通信所需的库，并初始化一个全局的 Serial 对象，这次我们还创建了一个 `SensorDataBuffer` 对象。\n\
