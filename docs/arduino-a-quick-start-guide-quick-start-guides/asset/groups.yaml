    \n## 5.7 构建应用程序的基础\n\n在本节中，我们将通过导入一些库并定义一些全局常量和变量来为我们的应用程序创建所有样板代码：\n\nDownload\
    \ ultrasonic/InvertedSonar/InvertedSonar.pde\n\n```\nimport processing.serial.*;\n\
