    Ctrl-a followed by Ctrl-k.


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_56_0.png)


    Figure 2.6: Opening a serial session to Arduino with Putty


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_56_1.png)


    Figure 2.7: Putty communicates with Arduino.


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_57_0.png)


    Figure 2.8: The screen command communicates with Arduino.


    We can now communicate with the Arduino, and this has great implications: whatever
    is controlled by the Arduino can also be controlled by your computer, and vice
    versa. Switching LEDs on and off is not too spectacular, but try to imagine what''s
    possible now. You could move robots, automate your home, or create interactive
    games.


    Here are some more important facts about serial communication:


    - The Arduino’s serial receive buffer can hold up to 128 bytes. When sending large
    amounts of data at high speed, you have to synchronize sender and receiver to
    prevent data loss. Usually, the receiver sends an acknowledgment to the sender
    whenever it is ready to consume a new chunk of data.


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_59_0.png)


    Figure 2.9: A wrong baud rate creates a lot of garbage.


    In this chapter, you saw how to communicate with the Arduino using the serial
    port, which opens the door to a whole new world of physical computing projects
    (see Section C.1, Learning More About Serial Communication, on page 251 for more
    details about serial communication). In the next chapters, you''ll learn how to
    gather interesting facts about the real world using sensors, and you''ll learn
    how to change the real world by moving objects. Serial communication is the basis
    for letting you control all these actions using the Arduino and your PC.


    # 2.5 What If It Doesn''t Work?


    If anything goes wrong with the examples in this chapter, you should take a look
    at Section 1.8, What If It Doesn''t Work?, on page 43 first. If you still run
    into problems, it may be because of some issues with serial communication. For
    example, you might have set the wrong baud rate; in Figure 2.9, you can see what''s
    happening in such a case.


    Make sure that the baud rate you have set in your call to Serial.begin() matches
    the baud rate in the serial monitor.

