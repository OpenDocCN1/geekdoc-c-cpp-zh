    \ 对象。\n\n在 setup() 方法中，我们初始化串口以用于调试。我们还会初始化以太网扩展板，并调用 Server 的 begin() 方法来启动服务器监听。在\
    \ loop() 中，我们只调用 InfraredProxy 的 receive_from_server() 方法，并将我们的 Server 实例传递给它。\n\
