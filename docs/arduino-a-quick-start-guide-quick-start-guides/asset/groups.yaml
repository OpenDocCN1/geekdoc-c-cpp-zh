    \ Arduino 的每一行末尾追加一个换行符。输入一条消息，例如你的名字，点击“发送”按钮，观察 Arduino 如何将它变成光。\n\n因为我们将整个摩尔斯电码逻辑封装在\
    \ Telegraph 类中，所以我们的主程序简短而精练。为嵌入式设备编写软件并不意味着我们就不能受益于面向对象编程的优势。\n\n不过，要把我们的项目变成一个一流的库，还有一些小事要做。在下一节中，你将读到更多相关信息。\n\
    \n## 4.7 最后的收尾\n\nArduino IDE 的一个好特性是语法着色。类名、函数名、变量等在编辑器中都有不同的颜色。这使得阅读源代码变得更加容易，而且可以为库添加语法着色。你只需在项目中添加一个名为\
    \ keywords.txt 的文件：\n\n```\nDownload Telegraph/keywords.txt\n\n# Syntax-coloring\
    \ for the telegraph library\n\nTelegraph    KEYWORD1\nsend_message KEYWORD2\n\
    ```\n\n以 # 字符开头的行包含注释，将会被忽略。其余行包含库中某个成员的名字以及该成员的类型。用制表符分隔它们。类的类型为 KEYWORD1，函数的类型为\
    \ KEYWORD2。常量使用 LITERAL1。\n\n要为 telegraph 库启用语法着色，请将 keywords.txt 复制到 libraries\
    \ 文件夹，然后重启 IDE。现在，Telegraph 类的名称会显示为橙色，send_message() 会显示为棕色。\n\n在最终发布你的库之前，你还应该添加一些东西：\n\
    \n- 将所有示例草图放在一个名为 examples 的文件夹中，并将其复制到 libraries 文件夹。每个示例草图都应在该文件夹内拥有自己的子目录。\n\
    - 为你的项目选择一个许可证，并将其条款复制到一个名为 LICENSE 的文件中。⁴ 你可能觉得对许多库来说这有点小题大做，但它会让你的潜在用户更有信心。\n\
    - 添加安装说明和文档。通常，用户期望在名为 README 的文件中找到文档，并会在名为 INSTALL 的文件中查找安装说明。你应该尽可能在多种操作系统上安装你的库，并为所有这些系统提供安装说明。\n\
    \n完成所有这些之后，你的库文件夹应该看起来像下一页的图 4.2 所示。\n\n最后，创建一个包含项目中所有文件的 ZIP 压缩包。在大多数操作系统上，只需在资源管理器、Finder\
    \ 或你正在使用的任何工具中右键单击目录，并将其转换为 ZIP 压缩包即可。在 Linux 系统和 Mac 上，你还可以使用以下命令行语句之一来创建压缩包：\n\
    \n```\nmai k> zip -r Telegraph Telegraph\nmai k> tar cfvz Telegraph.tar.gz Telegraph\n\
    ```\n\n第一个命令会创建一个名为 Telegraph.zip 的文件，第二个命令会创建 Telegraph.tar.gz。这两种格式都很常见，最好同时提供这两种格式供下载。\n\
    \n4. 在 http://www.opensource.org/ 上，你可以找到大量背景信息和许多标准许可证。\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_98_0.png)\n\
    \n图 4.2：这是一个典型的 Arduino 库所需的东西。\n\n尽管你必须执行大量手动文件操作，创建 Arduino 库仍然很容易。所以，没有任何借口：每当你觉得自己做出了很酷的东西，就把它公开发布出来。\n\
    \n到目前为止，我们的项目一直使用 LED（输出）和按钮（输入）与外部世界通信。在下一章中，你将学习如何使用更复杂的输入设备，例如超声波传感器。你还将学习如何将\
    \ Arduino 发送到计算机上运行的程序的数据可视化。\n\n## 4.8 如果它不工作怎么办？\n\nArduino IDE 对文件和目录的命名有严格的要求，而且它是为创建草图而构建的，不是为创建库而构建的。因此，你需要执行一些手动文件操作，把所有内容放到正确的位置。从图\
    \ 4.2 中可以看到最终的目录布局。如果你安装了多个版本的 Arduino IDE，请确保你使用的是正确的 libraries 文件夹。\n\n请记住，你必须经常重启\
    \ IDE。每当你更改库中的文件时，都要重启 IDE。\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_99_0.png)\n\
    \n图 4.3：将扬声器连接到 Arduino 很简单。\n\n如果语法着色不生效，请确保你的关键字文件确实名为 keywords.txt。仔细检查你是否用制表符分隔了所有对象和类型说明符！重启你的\
    \ IDE！\n\n## 4.9 练习\n\n- 摩尔斯电码不仅支持字母和数字，还定义了逗号等符号。改进 Telegraph 类，使其能识别摩尔斯电码的所有字符。\n\
    - 闪烁的 LED 很棒，但每当想到摩尔斯电码，我们通常会想到哔哔声，因此用压电扬声器替换 LED，这种扬声器便宜又易用。图 4.3 展示了如何将它连接到\
    \ Arduino。它们有一个地线引脚和一个信号引脚，因此将扬声器的地线连接到 Arduino 的地线，将信号引脚连接到 Arduino 的 13 号引脚。然后用以下代码替换\
    \ output_symbol() 方法：\n\n```\nvoid Telegraph::output_symbol(const int length)\
    \ {\n  const int frequency = 131;\n  tone(_output_pin, frequency, length);\n}\n\
    ```\n\n这会向扬声器发送一个方波，并播放频率为 131 赫兹的音调（找到随附的“Melody”示例\n"
