    - The third resistor has five stripes: brown (1), red (2), red (2), green (5 zeros),
    silver (±10%), so the value is 12,200,000Ω = 12.2MΩ.


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_240_0.png)


    Figure A.3: Colored stripes tell you about resistor values.


    In the beginning, the color coding seems to be complicated, but you''ll get used
    to it quickly. Also, you can find countless tools for determining resistor values
