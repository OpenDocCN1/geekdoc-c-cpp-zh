    # Fashionable LEDs


    Both pervasive and wearable computing got very popular over the past years, so
    T-shirts with an equalizer are still cool but not that exciting any longer.* But
    by using a few LEDs, you can create some astonishing accessories for the ladies.
    For example, Japanese engineers have created LED eyelashes.†


    This particular product does not use an Arduino, but with the Lilypad,‡ you can
    easily create similar things yourself. You have to be extremely careful with LEDs,
    because most of them are very bright and can cause serious damage to your eyes!


    * http://www.thinkgeek.com/tshirts-apparel/interactive/8a5b/

    † http://blog.makezine.com/archive/2009/10/led_eyelashes.html

    ‡ http://www.arduino.cc/en/Main/ArduinoBoardLilyPad


    If the byte we have read represents the character 1, we switch on the LED and
    send back the message “LED on” over the serial port. We use Serial.println(),
    which adds a carriage return character (ASCII code 13) followed by a newline (ASCII
    code 10) to the text.


    If we received the character 2, we switch off the LED. If we received an unsupported
    command, we send back a corresponding message and the command we did not understand.
    Serial.print() works exactly like Serial.println(), but it does not add carriage
    return and newline characters to the message.


    Let’s see how the program works in practice. Compile it, upload it to your Arduino,
    and then switch to the serial monitor (optionally you can attach an LED to pin
    13; otherwise, you can only control the Arduino’s status LED). At first glance,
    nothing has happened. That’s because we have not sent a command to the Arduino
    yet. Enter a 1 in the text box, and then click the Send button. Two things should
    happen now: the LED is switched on, and the message “LED on” appears in the serial
    monitor window (see Figure 2.4, on the next page). We are controlling a LED using
    our computer’s keyboard!


    Play around a bit with the commands 1 and 2, and also observe what happens when
    you send an unknown command. If you type in an uppercase A, for example, the Arduino
    will send back the message “Unknown command: 65.” The number 65 is the ASCII code
    of the letter A, and the Arduino outputs the data it got in its most basic form.'
  - '[PAGE 53]


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_53_0.png)


    # Figure 2.4: The Arduino IDE''s serial monitor


    That''s the default behavior of Serial''s print() method, and you can change it
    by passing a format specifier to your function calls. To see the effect, replace
    line 20 with the following statements:


    ```

    Serial.println(command, DEC);

    Serial.println(command, HEX);

    Serial.println(command, OCT);

    Serial.println(command, BIN);

    Serial.println(command, BYTE);

    ```


    The output looks as follows when you send the character A again:


    ```

    Unknown command: 65

    41

    101

    1000001

    A

    ```


    Depending on the format specifier, Serial.println() automatically converts a byte
    into another representation. DEC outputs a byte as a decimal number, HEX as a
    hexadecimal number, and so on. Note that such an operation usually changes the
    length of the data that gets transmitted. The binary representation of the single
    byte 65, for example, needs 7 bytes, because it contains seven characters.'
  - '[PAGE 54]


    # Numbering Systems


    It’s an evolutionary accident that 10 is the basis for our numbering system. If
    we had only four fingers on each hand, it’d be probably eight, and we’d probably
    have invented computers a few centuries earlier.


    For thousands of years, people have used denominational number systems, and we
    represent a number like 4711 as follows:


    4×10³ + 7×10² + 1×10¹ + 1×10⁰


    This makes arithmetic operations very convenient. But when working with computers
    that only interpret binary numbers, it’s often advantageous to use numbering systems
    based on the numbers 2 (binary), 8 (octal), or 16 (hexadecimal).


    For example, the decimal number 4711 can be represented in octal and hexadecimal
    as follows:


    +   - 1×8⁴ + 1×8³ + 1×8² + 4×8¹ + 7×8⁰ = 011147

    +   - 1×16³ + 2×16² + 6×16¹ + 7×16⁰ = 0x1267


    In Arduino programs, you can define literals for all these numbering systems:


    ```

    int decimal = 4711;

    int binary = B100100110011;

    int octal = 011147;

    int hexadecimal = 0x1267;

    ```


    Binary numbers start with a B character, octal numbers with a 0, and hexadecimal
    numbers start with 0x.


    # Using Different Serial Terminals


    For trivial applications, the IDE’s serial monitor is sufficient, but you cannot
    easily combine it with other applications, and it lacks some features (for example,
    it could not send newline characters in older IDE versions). That means you should
    have an alternative serial terminal to send data, and you can find plenty of them
    for every operating system.


    # Serial Terminals for Windows


    Putty¹ is an excellent choice for Windows users. It is free, and it comes as an
    executable that does not even have to be installed. Figure 2.5, on the following
    page shows how to configure it for communication on a serial port.'
  - '[PAGE 55]


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_55_0.png)


    # Figure 2.5: Configuring PuTTY to make it work with Arduino


    After you have configured PuTTY, you can open a serial connection to the Arduino.
    In Figure 2.6, on the next page, you can see the corresponding dialog box. Click
    Open, and you''ll see an empty terminal window.


    Now press 1 and 2 a few times to switch on and off the LED. In Figure 2.7, on
    the following page, you can see a typical session.


    # Serial Terminals for Linux and Mac OS X


    Linux and Mac users can use the screen command to communicate with the Arduino
    on a serial port. Check which serial port the Arduino is connected to (for example,
    in the IDE''s Tools > Board menu), and then run a command like this (with an older
    board the name of the serial port might be something like /dev/cu.usbserial-A0007LUY,
    and on Linux systems it might be /dev/ttyUSB1 or something similar):


    ```

    ```

    $ screen /dev/cu.usbmodemfa141 9600

    ```

    ```


    screen expects the name of the serial port and the baud rate to be used. In Figure
    2.8, on page 58, you can see a typical session. To quit the screen command, press
    Ctrl-a followed by Ctrl-k.'
