    Without the support of my family and my friends, I would have never finished this
    book. We miss you so much, Mom!


    Finally, I’d like to thank Tanja for giving me confidence and for bringing fun
    back into my life when I needed it most!


    ## Preface


    Welcome to the Arduino, and welcome to the exciting world of physical computing!
    Arduino² is an open source project consisting of both hardware and software. It
    was originally created to give designers and artists a prototyping platform for
    interaction design courses. Today hobbyists and experts all over the world use
    it to create physical computing projects, and you can too.


    The Arduino lets us get hands-on again with computers in a way we haven’t been
    able to since the 1980s, when you could build your own computer. And Arduino makes
    it easier than ever to develop handcrafted electronics projects ranging from prototypes
    to sophisticated gadgets. Gone are the days when you had to learn lots of theory
    about electronics and arcane programming languages before you could even get an
    LED blinking. You can create your first Arduino project in a few minutes without
    needing advanced electrical engineering course work.


    In fact, you don’t need to know anything about electronics projects to read this
    book, and you’ll get your hands dirty right from the beginning. You’ll not only
    learn how to use some of the most important electronic parts in the first pages,
    you’ll also learn how to write the software needed to bring your projects to life.


    This book dispenses with theory and stays hands-on throughout. I’ll explain all
    the basics you need to build the book’s projects, and every chapter has a troubleshooting
    section to help when things go wrong. This book is a quick-start guide that gets
    you up to speed quickly and enables you to immediately create your own projects.


    ### Who Should Read This Book


    If you are interested in electronics—and especially in building your own toys,
    games, and gadgets—then this book is for you. Although the Arduino is a nice tool
    for designers and artists, only software developers are able to unleash its full
    power. So, if you’ve already developed some software—preferably with C/C++ or
    Java—then you’ll get a lot out of this book.


    But there’s one more thing: you have to build, try, and modify the projects in
    this book. Have fun. Don’t worry about making mistakes. The troubleshooting sections—and
    the hands-on experience you’ll gain as you become more confident project by project—will
    make it all worthwhile. Reading about electronics without doing the projects yourself
    isn’t even half the battle (you know the old saying: we remember 5 percent of
    what we hear, 10 percent of what we write, and 95 percent of what we personally
    suffer). And don’t be afraid: you really don’t need any previous electronics project
    experience!


    If you’ve never written a piece of software before, start with a programming course
    or read a beginner’s book about programming first (*Learn to Program* [Pin06]
    is a nice starting point). Then, learn to program in C with *The C Programming
    Language* [KR98] or in C++ with *The C++ Programming Language* [Str00].


    ### What’s in This Book


    This book consists of three parts (“Getting Started with Arduino,” “Eight Arduino
    Projects,” and the appendixes). In the first part, you’ll learn all the basics
    you need to build the projects in the second part, so read the chapters in order
    and do all the exercises. The chapters in the second part also build on each other,
    reusing techniques and code from earlier chapters.


    Here’s a short walk-through:


    - The book starts with the basics of Arduino development. You’ll learn how to
    use the IDE and how to compile and upload programs. You’ll quickly build your
    first project—electronic dice—that shows you how to work with basic parts such
    as LEDs, buttons, and resistors. By implementing a Morse code generator, you’ll
    see how easy it is to create your own Arduino libraries.


    If you run into any problems, you’ll find a list of exercises to build your skills
    at the end of every chapter.


    All the projects in this book have been tested on the Arduino Uno, the Arduino
    Duemilanove, and with the Arduino IDE versions 18 to 21. If possible, you should
    always use the latest version.


    ### Arduino Uno and the Arduino Platform


    After releasing several Arduino boards and Arduino IDE versions, the Arduino team
    decided to specify a version 1.0 of the platform. It will be the reference for
    all future developments, and they announced it on the first day of 2010.³ Since
    then, they have released the Arduino Uno, and they have also improved the IDE
    and its supporting libraries step-by-step.


    At the moment of this writing, it is still not completely clear what Arduino 1.0
    will look like. The Arduino team tries to keep this release as backward compatible
    as possible. This book is up-to-date for the new Arduino Uno boards. All the projects
    will also work with older Arduino boards such as the Duemilanove or Diecimila.
    This book is current for version 21 of the Arduino platform. You can follow the
    progress of the Arduino platform online.⁴


    ### Code Examples and Conventions


    Although this is a book about open source hardware and electronics, you will find
    a lot of code examples. We need them to bring the hardware to life and make it
    do what we want it to do.


    We use C/C++ for all programs that will eventually run on the Arduino. For applications
    running on our PC, we use Processing,⁵ but in Section C.2, Serial Communication
    Using Various Programming Languages, on page 253, you’ll also learn how to use
    several other programming languages to communicate with an Arduino.


    Whenever you find a slippery road icon beside a paragraph, slow down and read
    carefully. They announce difficult or dangerous techniques.


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_15_0.png)


