    \ 常量。I²C 是一种主从协议；在我们的场景中，Arduino 是主机，Nunchuk 是从机。Nunchuk 使用特定的 ID（0x52）在数据总线上注册自己，因此我们可以在需要时随时访问它。\n\
    \n在 `initialize()` 中，我们通过发送握手信号建立 Arduino 与 Nunchuk 之间的连接。在第 8 行，我们调用 Wire 的 `begin()`\
    \ 方法，使 Arduino 以主机身份加入 I²C 总线（如果你向 `begin()` 传入一个 ID，它会以该 ID 对应的从机身份加入总线）。然后，我们开始一次向由\
    \ `NUNCHUK_DEVICE_ID` 标识的设备（也就是我们的 Nunchuk）发起的新传输。\n\n我们向 Nunchuk 发送两个字节（`0x40`\
    \ 和 `0x00`），然后结束传输。这就是整个握手过程，现在我们可以通过调用 `update()` 来请求 Nunchuk 的当前状态。在图 7.4（前一页）中，我们看到了\
    \ Arduino 与 Nunchuk 之间的消息流。\n\n`update()` 首先暂停一毫秒，让一切稍微稳定下来。然后我们调用 `Wire.requestFrom()`\
    \ 向 Nunchuk 请求六个字节。这并不会直接返回这些字节，而是需要我们通过循环读取它们并填充缓冲区。`Wire.available()` 返回数据总线上可用的字节数，`Wire.receive()`\
    \ 返回当前字节。我们不能直接使用从 Nunchuk 获取的字节，因为控制器会对它们进行一些混淆处理。正如你在 `decode_byte()` 中看到的，“解密”它们非常简单。\n\
    \n最后，我们调用 `request_data()` 告诉 Nunchuk 准备新数据。它向 Nunchuk 发送一个零字节，意思是“准备接下来的六个字节”。\n\
    \n在下一节真正使用我们的 Nunchuk 类之前，请先看一下 Wire 库的文档。在 Arduino IDE 的菜单中，选择 帮助 > 参考，然后点击 Libraries\
    \ 链接。\n\n## 7.5 使用我们的 Nunchuk 类\n\n让我们使用 Nunchuk 类来看看控制器实际返回什么数据：\n\n下载 MotionSensor/NunchukDemo/NunchukDemo.pde\n\
    \n```\n#include <Wire.h>\n#include \"nunchuk.h\"\n\nconst unsigned int BAUD_RATE\
