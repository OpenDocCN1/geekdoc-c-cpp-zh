    ing a new programming environment from scratch, the Arduino team decided to modify
    the Processing IDE. That''s the reason why both IDEs look so similar and why Arduino
    sketches have the file extension .pde (Processing Development Environment), for
    example.


    Using Processing as the basis for the Arduino project provided a good and well-tested
    IDE for free. Processing and the Arduino are a good team for several other reasons:


    +   - The Arduino simplifies embedded computing, and Processing simplifies the
    creation of multimedia applications. So, you can easily visualize sensor data
    in often spectacular ways.

    +   - Processing is easy to learn, especially if you already know Java.

    +   - Processing has excellent support for serial communication.


    So, for many reasons, Processing is well worth a look, but it’s especially useful
    when working with the Arduino. That’s why we’ll use it for several of the book’s
    examples.


    # 5.6 Representing Sensor Data


    We start with a Processing class that represents the current sensor data we return
    from the Arduino via serial port. Open a new file in the Processing IDE, and enter
    the following code:


    ```

    class SensorData {

    private float temperature;

    private float distance;


    SensorData(float temperature, float distance) {

    this.temperature = temperature;

    this.distance = distance;

    }


    float getTemperature() {

    return this.temperature;

    }


    float getDistance() {

    return this.distance;

    }

    }

    ```


    If you are familiar with Java or C++, the SensorData class will be perfectly clear
    to you. It encapsulates a temperature value and a distance'
  - '[PAGE 123]


    as floating-point numbers and provides access to the data via accessor methods
    (getTemperature() and getDistance()). You can create new SensorData objects using
    the constructor, passing it the current temperature and distance.


    Processing is an object-oriented programming language and allows us to define
    new classes using the **class** keyword. Classes have a name and they contain
    data (often called *attributes* or *properties*) and functions (often called *methods*).
    Our SensorData class contains two attributes named temperature and distance. They
    are both of type **float**, and we have declared them both **private**. Now only
    members of the SensorData class are allowed to access them. This is considered
    good style, because it prevents unwanted side effects and makes future changes
    much easier. A class should never expose its innards.


    To set and get the values of our attributes, we have to use public methods, and
    our class has three of them: SensorData(), getTemperature(), and getDistance().
    (Java and C++ programmers should note that in Processing everything is public
    if not specified otherwise!) A method that has the same name as the class is called
    a *constructor*, and you can use it for creating and initializing new objects
    of that particular class. Constructors do not have return values, but they may
    specify parameters. Ours, for example, takes two arguments and uses them to initialize
    our two attributes.


    There’s a small problem, though: our method’s parameters have the same names as
    our classes’ attributes. What would happen if we simply assigned the method parameters
    to the attributes like this:


    ```

    temperature = temperature;

    distance = distance;

    ```


    Right: we simply assigned every method parameter to itself, which is effectively
    a no-operation. That’s why we use the **this** keyword. It refers to the class
    itself, so we can distinguish between the method parameters and the classes’ attributes.
    Alternatively, we could have used different names for the method parameters or
    the attributes, but I prefer to use **this**.


    After the constructor, we define the methods getTemperature and getDistance. Their
    definitions are very similar; we declare the method’s return type (**float**),
    the method’s name, and a list of parameters in parentheses. In our case, the parameter
    list is empty. In the methods, we return the'
  - '[PAGE 124]


    current value of the corresponding attributes using the **return** keyword. **return**
    stops the method and returns its argument to the method’s caller.


    Now we can create and initialize new SensorData objects:


    ```

    SensorData sensorData = new SensorData(31.5, 11.76);

    ```


    The previous statement creates a new SensorData object named sensorData. It sets
    temperature to 31.5 and distance to 11.76. To read those values, we use the corresponding
    “get” methods:


    ```

    sensorData.getTemperature(); // -> 31.5

    sensorData.getDistance();    // -> 11.76

    ```


    Because getTemperature() and getDistance() are members of the SensorData class,
    you can only invoke them using an instance of the class. Our instance is named
    sensorData, and to call the “get” methods we have to use the instance name, followed
    by a dot, followed by the method name.


    Now that we can store sensor data, we’ll continue to build our inverted sonar
    application in the next section.


