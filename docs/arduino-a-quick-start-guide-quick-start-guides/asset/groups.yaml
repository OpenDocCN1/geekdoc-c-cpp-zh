    +   - An Arduino board such as the Uno, Duemilanove, or Diecimila

    +   - A USB cable to connect the Arduino to your computer

    +   - An LED

    +   - A speaker or a buzzer (they are optional)


    # 4.2 Learning the Basics of Morse Code


    Morse code was invented to turn text into sounds.¹ In principle, it works like
    a character set encoding such as ASCII. But while ASCII'
  - '[PAGE 88]


    encodes characters as numbers, in Morse code they''re sequences of dots and dashes
    (also called dits and dahs). Dits are shorter in length than dahs. An A is encoded
    as · – and – – · · is Z.


    Morse code also specifies a timing scheme that defines the length of the dits
    and dahs. It also specifies how long the pauses between symbols and words have
    to be. The base unit of Morse code is the length of a dit, and a dah is as long
    as three dits. You insert a pause of one dit between two symbols, and you separate
    two letters by three dits. Insert a pause of seven dits between two words.


    To transmit a message encoded in Morse code, you need a way to emit signals of
    different lengths. The classic approach is to use sounds, but we will use an LED
    that is turned on and off for varying periods of time. Sailors still transmit
    Morse code using blinking lights.


