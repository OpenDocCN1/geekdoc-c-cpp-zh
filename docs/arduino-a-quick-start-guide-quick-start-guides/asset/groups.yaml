  - '[PAGE 112]


    In some cases, you can still get the best of both worlds: float support without
    paying the memory tax. You can save a lot of space by converting the float values
    to integers before sending them over a serial connection. To transfer values with
    a precision of two digits, multiply them by 100, and do not forget to divide them
    by 100 on the receiving side. We will use this trick (including rounding) later.


    # 5.4 Increasing Precision Using a Temperature Sensor


    Support for floating-point numbers is certainly an improvement, but it mainly
    increases the precision of our program''s output. We could have achieved a similar
    effect using some integer math tricks. But now we will add an even better improvement
    that cannot be imitated using software: a temperature sensor.


    When I told you that sound travels through air at 343m/s, I wasn''t totally accurate,
    because the speed of sound is not constant—among other things it depends on the
    air''s temperature. If you do not take temperature into account, the error can
    grow up to a quite significant 12 percent. We calculate the actual speed of sound
    C with a simple formula:


    C = 331.5 + (0.6 * t)


    To use it, we only have to determine the current temperature t in Celsius. We
    will use the TMP36 voltage output temperature sensor from Analog Devices.⁴ It''s
    cheap, and it''s easy to use.


    To connect the TMP36 to the Arduino, connect the Arduino''s ground and power to
    the corresponding pins of the TMP36. Then connect the sensor''s signal pin to
    the pin A0, that is, the analog pin number 0 (see Figure 5.6, on the following
    page).


    As you might have guessed from its vendor''s name, the TMP36 is an analog device:
    it changes the voltage on its signal pin corresponding to the current temperature.
    The higher the temperature, the higher the voltage. For us it is an excellent
    opportunity to learn how to use the Arduino''s analog IO pins. So, let''s see
    some code that uses the sensor:


    Download: temperature/sensortest/sensortest.pde


    ```

    const unsigned int TEMP_SENSOR_PIN = 0;

    const float SUPPLY_VOLTAGE = 5.0;

    ```


    4. http://tinyurl.com/msard-analog'
  - "[PAGE 113]\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_113_0.png)\n\nFigure 5.6:\
    \ Connecting the temperature sensor to the Arduino\n\n```\nconst unsigned int\
    \ BAUD_RATE = 9600;\n\nvoid setup() {\n  Serial.begin(BAUD_RATE);\n}\n\nvoid loop()\
    \ {\n  Serial.print(get_temperature());\n  Serial.println(\" C\");\n  delay(1000);\n\
    }\n\nconst float get_temperature() {\n  const int sensor_voltage = analogRead(TEMP_SENSOR_PIN);\n\
    \  const float voltage = sensor_voltage * SUPPLY_VOLTAGE / 1024;\n  return (voltage\
    \ * 1000 - 500) / 10;\n}\n```\n\nIn the first two lines, we define constants for\
    \ the analog pin the sensor is connected to and for the Arduino's supply voltage.\
    \ Then we have a pretty normal setup() method followed by a loop() method that\
    \ outputs the current temperature every second. The whole sensor logic has been\
    \ encapsulated in the get_temperature() method.\n\nFor the PING))) sensor, we\
    \ only needed a digital pin that could be HIGH or LOW. Analog pins are different\
    \ and represent a voltage ranging from 0V to the current power supply (usually\
    \ 5V). We can read Arduino's analog pins using the analogRead() method that returns\
    \ a"
  - '[PAGE 114]


    value between 0 and 1023, because analog pins have a resolution of ten bits (1024
    = 2¹⁰). We use it in line 16 to read the current voltage supplied by the TMP36.


    There’s one problem left, though: we have to turn the value returned by analogRead()
    into an actual voltage value, so we must know the Arduino’s current power supply.
    It usually is 5V, but there are Arduino models (the Arduino Pro, for example)
    that use only 3.3V. You have to adjust the constant SUPPLY_VOLTAGE accordingly.


    Knowing the supply voltage, we can turn the analog pin’s output into a voltage
    value by dividing it by 1024 and by multiplying it with the supply voltage afterward.
    That’s exactly what we do in line 17.


    We now have to convert the voltage the sensor delivers into degree Celsius. In
    the sensor’s data sheet, we find the following formula:


    T = ((sensor output in mV) - 500) / 10


    500 millivolts have to be subtracted, because the sensor always outputs a positive
    voltage. This way, we can represent negative temperatures, too. The sensor’s resolution
    is 10 millivolts, so we have to divide by 10. A voltage value of 750 millivolts
    corresponds to a temperature of (750 - 500) / 10 = 25°C, for example. See it implemented
    in line 18.


    Compile the program, upload it to the Arduino, and you’ll see something like the
    following in your serial monitor:


    ```

    10.06 C

    26.64 C

    28.62 C

    28.50 C

    28.50 C

    29.00 C

    29.00 C

    28.50 C

    29.00 C

    ```


    As you can see, the sensor needs some time to calibrate, but its results get stable
    fairly quickly. By the way, you’ll always need to insert a short delay between
    two calls to analogRead(), because the Arduino’s internal analog system needs
    some time (0.0001 seconds) between two readings. We have used a delay of a whole
    second to make the output easier to read and because we do not expect the temperature
    to change rapidly. Otherwise, a delay of a single millisecond would be enough.'
