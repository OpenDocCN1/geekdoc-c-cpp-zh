  - '[PAGE 106]


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_106_0.png)


    Figure 5.4: PING))) pulse diagram


    In lines 9 to 11, we set the sensor’s signal pin to LOW for 2 microseconds to
    bring it to a proper state. This will ensure clean HIGH pulses that are needed
    in the next steps (in the world of electronics, you should always be prepared
    for jitters in the power supply).


    Finally, it’s time to tell the sensor to do some work. In lines 13 to 15, we set
    the sensor’s signal pin to HIGH for 5 microseconds to start a new measurement.
    Afterward, we set the pin to LOW again, because the sensor will respond with a
    HIGH pulse of variable length on the same pin.


    With a digital pin, you have only a few options to transmit information. You can
    set the pin to HIGH or LOW, and you can control how long it remains in a particular
    state. For many purposes, this is absolutely sufficient, and in our case it is,
    too. When the PING))) sensor sends out its 40 kHz chirp, it sets the signal pin
    to HIGH and then sets it back to LOW when it receives the echo. That is, the signal
    pin remains in a HIGH state for exactly the time it takes the sound to travel
    to an object and back to the sensor. Loosely speaking, we are using a digital
    pin for measuring an analog signal. In Figure 5.4, you can see a diagram showing
    typical activity on a digital pin connected to a PING))) sensor.


    We could measure the duration the pin remains in HIGH state manually, but the
    pulseIn() method already does all the dirty work for us. So, we use it in line
    18 after we have set the signal pin into input mode again. pulseIn() accepts three
    parameters:


    +   - *pin*: Number of the pin to read the pulse from.

    +   - *type*: Type of the pulse that should be read. It can be HIGH or LOW.'
