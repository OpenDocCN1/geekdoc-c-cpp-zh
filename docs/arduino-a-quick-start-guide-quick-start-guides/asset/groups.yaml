    might need more than one try, especially on new boards, and it often comes in
    handy to shorten the connectors before plugging them into the breadboard. Make
    sure that you can still identify the negative and the positive connector after
    you have shortened them. Shorten the negative one a bit more, for example. Also
    wear safety glasses to protect your eyes when cutting the connectors!


    The things we have done until now have been straightforward. That is, in principle
    we have only extended the Arduino''s ground pin and its IO pin number 12. Why
    do we have to add a resistor, and what is a resistor? A resistor limits the amount
    of current that flows through an electric connection. In our case, it protects
    the LED from consuming too much power, because this would destroy the LED. You
    always have to use a resistor when powering an LED! In Section A.1, Current, Voltage,
    and Resistance, on page 237, you can learn more about resistors and their color
    bands. In Figure 3.5, you can see a resistor in various stages: regular, bent,
    and cut.


    You might ask yourself why we didn''t have to use a resistor when we connected
    the LED directly to the Arduino. The answer is simple: pin 13 comes with an internal
    resistor of 1kΩ. Now that we use pin 12, we have to add our own resistor.


    We don''t want to fiddle around too much with the connectors, so we build the
    circuit as shown in Figure 3.6, on the next page. That is, we use both sides of
    the breadboard by connecting them with a short wire. Note that the resistor bridges
    the sides, too.'
