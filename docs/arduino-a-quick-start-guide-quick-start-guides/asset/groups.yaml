    \ Team 对象，并将此对象传递给 Blaminatr 的构造函数。\n\n在 setup() 函数中，我们初始化串行端口，并将 Blaminatr 的舵机连接到我们在\
    \ MOTOR_PIN 中定义的引脚。此外，我们通过指责“nobody”来初始化 Blaminatr。\n\nloop() 函数与第 225 页 10.3\
