    \ 控制电机\n\n到目前为止，我们已经创建了对现实世界产生影响的项目。我们让 LED 发光，并用红外光控制设备。在本章中，我们将创造一种更强烈的体验：控制真正能移动物体的电机。我们不会去构建一个完整的自主机器人，但会制作一个既实用又有趣的小装置。\n\
    \n不过，首先你将了解不同电机类型的基础知识及其优缺点。如今，你可以为项目选择多种电机类型，本章先从它们的区别简要说起。\n\n我们将重点介绍舵机，因为它们的用途广泛，而且便宜、易用。你将学会使用\
    \ Arduino 舵机库，并通过串口控制舵机。\n\n在这些初步步骤的基础上，我们将构建一个更复杂的项目。这是一个指责装置，使用的硬件与本章第一个项目几乎相同，但软件更为精细。你可能会在办公室里发现它的许多用途！\n\
    \n### 10.1 所需材料\n\n-   1. 一个舵机，例如 Hitec HS-322HD\n-   2. 一些导线\n-   3. 一个 TMP36\
    \ 温度传感器（可选，仅在练习中需要）\n-   4. 一块 Arduino 板，例如 Uno、Duemilanove 或 Diecimila\n-   5.\
    \ 一条用于将 Arduino 连接到计算机的 USB 线\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_224_0.png)\n\
    \n图 10.2：从左到右的电机类型：标准舵机、连续旋转舵机、步进电机\n\n事实上，你身边到处都是步进电机。当你的打印机、扫描仪或磁盘驱动器工作时，你就能听到它们。控制步进电机不是什么高科技难题，但比控制直流电机和舵机要复杂一些。\n\
    \n舵机在爱好者中最受欢迎，因为它在直流电机和步进电机之间取得了很好的平衡。它们价格实惠、可靠且易于控制。标准舵机只能在 180 度范围内移动，但这已足够应对许多应用。使用连续旋转舵机，你可以将范围扩大到\
    \ 360 度，但会失去易于控制的优点。\n\n在下一节中，你将看到用 Arduino 控制标准舵机有多么容易。\n\n### 10.3 舵机入门\n\n\
    Arduino IDE 自带一个用于控制舵机的库，我们将在最初的实验中使用它。在下页的图 10.3 中，\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_226_0.png)\n\
    \n图 10.4：将三根导线插入舵机的连接器，将其连接到 Arduino。\n\n```\nDownload: Motors/SerialServo/SerialServo.pde\n\
    Line 1\n#include <Servo.h>\n\nconst unsigned int MOTOR_PIN = 9;\nconst unsigned\
    \ int MOTOR_DELAY = 15;\nconst unsigned int SERIAL_DELAY = 5;\nconst unsigned\
    \ int BAUD_RATE = 9600;\n\nServo servo;\n\nvoid setup() {\n  Serial.begin(BAUD_RATE);\n\
    \  servo.attach(MOTOR_PIN);\n  delay(MOTOR_DELAY);\n  servo.write(1);\n  delay(MOTOR_DELAY);\n\
    }\n\nvoid loop() {\n  const int MAX_ANGLE = 3;\n\n  char degrees[MAX_ANGLE + 1];\n\
    \n  if (Serial.available()) {\n    int i = 0;\n    while (Serial.available() &&\
    \ i < MAX_ANGLE) {\n      const char c = Serial.read();\n      if (c != -1 &&\
    \ c != '\\n')\n        degrees[i++] = c;\n```\n\n```cpp\ndelay(SERIAL_DELAY);\n\
    }\ndegrees[i] = 0;\nSerial.print(degrees);\nSerial.println(\" degrees.\");\nservo.write(atoi(degrees));\n\
    delay(MOTOR_DELAY);\n}\n}\n```\n\n我们包含了 Servo 库，并在第 8 行定义了一个新的 Servo 对象。在 setup()\
    \ 函数中，我们初始化串口，然后把 Servo 对象 attach() 到 MOTOR_PIN 定义的引脚上。之后，我们等待 15 毫秒，让舵机有足够时间处理我们的命令。然后调用\
    \ write() 将舵机移回 1 度。也可以移回 0 度，但我用过的一些舵机在这个位置会发出烦人的噪音。\n\nloop() 函数的主要用途是从串口读取新的角度值。这些值的范围是\
    \ 0 到 180，我们按 ASCII 值读取。因此，我们需要一个最多能包含四个字符的字符串（记住，C 语言中的字符串以空字符结尾）。这就是为什么我们在第\
    \ 21 行将 degrees 字符串声明为长度四。\n\n然后我们等待新的数据到达串口，并逐字符读取，直到没有更多数据或读到足够数量为止。我们用零字节终止字符串，并将读到的值打印到串口。最后，用\
    \ atoi() 把字符串转换成整数值，然后传给第 34 行 Servo 对象的 write() 方法。然后再次等待舵机执行它的任务。\n\n编译并上传这个程序，然后打开串口监视器。舵机初始化后，发送一些角度值，如\
    \ 45、180 或 10。观察电机如何移到你指定的角度。为了更清楚地看到效果，可以把一根导线或一张纸弯成箭头，固定在电机的齿轮上。\n\n通过串口控制舵机很简单，而我们搭建的电路可以成为许多实用且有趣的项目的基...\
    \ 的基础。在下一节中，我们将用它来构建一个自动指责装置。\n\n### 10.4 打造 Blaminatr\n\n指责别人并不好，但它却能带来一种反常的满足感。在本节中，我们将制作一个我称之为\
    \ *Blaminatr* 的设备。与其直接指责\n\n## Arduino 艺术\n\n你不仅可以用 Arduino 来制作小玩意或趣味项目，还可以用它进行艺术创作。尤其是在新媒体艺术领域，你会看到许多用\
    \ Arduino 打造的惊人项目。其中之一是 Anthros，* 它是一种响应式环境，通过网络摄像头观察一小片区域。这个区域内有一些“触手”，每当有人经过这片区域，触手就会朝那个人的方向移动。舵机驱动触手，而\
    \ Arduino 控制舵机。\n\n对于所有对新媒体艺术感兴趣的人来说，Alicia Gibb 的论文《新媒体艺术、设计与 Arduino 微控制器：一种可塑性工具》†\
    \ 是必读之作。\n\n-   * http://www.michiganbank.com/anthros\n-   † http://aliciagibb.com/thesis/\n\
    \n某人，不如让 Blaminatr 来做这件事。在下页的图 10.5 中，你可以看到这个设备的实际运行效果。告诉它去指责我，它就会移动一支箭头，指向“Maik”。\n\
    \nBlaminatr 是完美的办公室玩具，在许多场合都能派上用场。对于软件开发者来说，把它接到持续集成（CI）系统上是个好主意。像 CruiseControl.rb³\
    \ 或 Luntbuild⁴ 这样的持续集成系统，可以帮助你持续检查软件是否状况良好。\n\n每当开发者提交更改，CI 会自动编译软件并运行所有测试，然后通过电子邮件或\
    \ RSS 源发布结果。你可以轻松编写一小段订阅这种源的软件。每当有人破坏构建，你会在源中看到一条通知，然后就可以用 Blaminatr 指向最近提交更改的开发者名字。⁵\n\
    \n在上一节中，你已经了解了制作 Blaminatr 所需的舵机知识。现在，我们只需要发挥一些创造力来制作设备的显示部分，还需要更精细的软件。我们从\n\n\
    -   3. http://cruisecontrolrb.thoughtworks.com/\n-   4. http://luntbuild.javaforge.com/\n\
    -   5. 在 http://urbanhonking.com/ideasfordozen/2010/05/19/the_github_stoplight/\
    \ 上，你可以看到一个替代项目。它用红绿灯来指示你项目的当前状态。\n\n"
