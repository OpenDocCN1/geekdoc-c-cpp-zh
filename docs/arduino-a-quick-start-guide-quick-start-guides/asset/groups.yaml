    \ 度的显示区域中享有公平的份额，Blaminatr 将指向该份额的中心，因此我们将份额除以 2。我们将位置存储在 _positions 数组中，该数组与\
    \ _members 数组对应。也就是说，_positions 的第一个条目包含第一个团队成员的位置，依此类推。\n\n通过 get_position()\
    \ 方法，我们可以获取属于某个姓名的位置。我们遍历 _members 数组，并使用 strcmp() 函数检查是否找到了正确的成员。一旦找到，我们就返回 _positions\
    \ 数组中对应的条目。如果找不到我们正在查找的姓名对应的团队成员，则返回 0。\n\n现在实现一个 Blaminatr 类就很容易了：\n\n```\n#include\
    \ <Servo.h>\n\nconst unsigned int MOTOR_PIN = 9;\nconst unsigned int MOTOR_DELAY\
