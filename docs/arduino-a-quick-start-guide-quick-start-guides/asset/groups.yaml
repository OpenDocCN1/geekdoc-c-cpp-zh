    ![](img/dcfd13a1bf99c4d3f9996627012a6526_98_0.png)


    Figure 4.2: This is what a typical Arduino library needs.


    Although you have to perform a lot of manual file operations, it''s still easy
    to create an Arduino library. So, there''s no excuse: whenever you think you''ve
    built something cool, make it publicly available.


    Until now our projects have communicated with the outside world using LEDs (output)
    and pushbuttons (input). In the next chapter, you''ll learn how to work with more
    sophisticated input devices, such as ultrasonic sensors. You''ll also learn how
    to visualize data that an Arduino sends to programs running on your computer.


    # 4.8 What If It Doesn''t Work?


    The Arduino IDE has a strong opinion on naming files and directories, and it was
    built for creating sketches, not libraries. So, you need to perform a few manual
    file operations to get everything into the right place. In Figure 4.2, you can
    see the final directory layout. If you have more than one version of the Arduino
    IDE installed, make sure that you''re using the right libraries folder.


    Remember that you have to restart the IDE often. Whenever you change one of the
    files belonging to your library, restart the IDE.'
