    \ Arduino 板或 USB 数据线。\n\n### 3.2 使用面包板\n\n将零件如 LED 直接连接到 Arduino 只有在最简单的情况下才是一种选择。通常，你会在面包板上制作项目的原型，然后将面包板连接到\
    \ Arduino。面包板“模拟”\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_64_0.png)\n\n# 图\
    \ 3.2：面包板集合\n\n一个电路板。你不需要将零件焊接到板上；相反，你可以简单地将它们插入其中。\n\n面包板有各种类型和尺寸（在图 3.2 中，你可以看到其中两种），但它们的工作方式都相同。它们有很多插座，可用于插入直插式元件或导线。仅此一点并无大碍，但插座以特殊方式连接。在下一页的图\
    \ 3.3 中，你可以看到连接方式。\n\n正如你所见，大多数插座按列连接。如果一列的某个插座连接到电源，那么该列中的所有其他插座也会自动通电。在照片中较大的板上，你还可以看到四排连接的插座。这对于更大的电路很方便。通常，你将一排连接到电源，另一排连接到地。这样，你就可以将电源和地分配到板上的任意位置。现在让我们看看如何在面包板上放置零件。\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_65_0.png)\n\n图 3.3：面包板上插座的连接方式\n\n\
    ### 3.3 在面包板上使用 LED\n\n到目前为止，我们使用的是安装在 Arduino 板上的 LED，并将一个 LED 直接连接到 Arduino。在本节中，我们将把一个\
    \ LED 插入面包板，然后将面包板连接到 Arduino。\n\n在下一页的图 3.4 中，你可以看到我们最终电路的照片。它由一个 Arduino、一个面包板、一个\
    \ LED、三根导线和一个 1kΩ 电阻组成（几分钟后会详细介绍该部件）。使用两根导线将 Arduino 连接到面包板。将引脚 12 与面包板的第 9 列连接，并将地引脚与第\
    \ 10 列连接。这会自动将第 9 列中的所有插座连接到引脚 12，并将第 10 列中的所有插座连接到地。列的选择是任意的，你也可以使用其他列。\n\n将\
    \ LED 的负极连接器（较短的那根）插入第 10 列，其正极连接器插入第 9 列。当你将零件或导线插入面包板时，必须用力按压直到它们滑入。你\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_66_0.png)\n\
    \n图 3.4：将面包板上的 LED 连接到 Arduino\n\n可能需要多次尝试，尤其是在新板上，并且在将它们插入面包板之前缩短连接器通常很有用。确保在缩短后仍能识别负极和正极连接器。例如，可以将负极再缩短一点。切断连接器时也请佩戴安全眼镜以保护眼睛！\n\
    \n到目前为止我们所做的事情都很直接。也就是说，原则上我们只是扩展了 Arduino 的地引脚和其 IO 引脚 12。为什么我们必须添加一个电阻，电阻是什么？电阻限制了通过电气连接流动的电流。在我们的例子中，它保护\
    \ LED 不会消耗过多的功率，因为这会损坏 LED。给 LED 供电时必须始终使用电阻！在第 A.1 节《电流、电压和电阻》，第 237 页，你可以了解有关电阻及其色环的更多信息。在图\
    \ 3.5 中，你可以看到一个电阻的各种阶段：常规、弯曲和切割。\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_67_0.png)\n\
    \n图 3.5：电阻的各种加工阶段\n\n你可能会问自己，为什么我们直接将 LED 连接到 Arduino 时不需要使用电阻。答案很简单：引脚 13 带有一个\
    \ 1kΩ 的内部电阻。现在我们使用引脚 12，就必须添加我们自己的电阻。\n\n我们不想太费劲地处理连接器，所以我们按图 3.6 所示构建电路，即在下一页。我们通过一根短导线使用面包板的两侧。注意电阻也跨越了两侧。\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_68_0.png)\n\n图 3.6：你可以使用面包板的两侧。\n\n\
    ### 3.4 二进制骰子的第一个版本\n\n你一定熟悉普通骰子显示从一到六的结果。要用电子设备完全模拟这样的骰子，你需要七个 LED 和一些相当复杂的业务逻辑。我们走捷径，用二进制显示骰子掷出的结果。\n\
    \n对于二进制骰子，我们只需要三个 LED 来表示当前结果。我们将结果转换为二进制数，并为每个置位的位点亮相应的 LED。下面的图表显示了骰子结果到 LED\
