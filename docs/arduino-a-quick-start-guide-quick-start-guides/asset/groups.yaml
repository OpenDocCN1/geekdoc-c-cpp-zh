    \ Sunday evening football game. Universal remote controls reduce the pain a bit,\
    \ but even the most expensive products aren’t perfect.\n\nAlthough we use remote\
    \ controls every day, few of us understand how they work. In this chapter, you’ll\
    \ find out how remote controls work from the inside out, and then you’ll build\
    \ your own universal remote control that’s better than a store-bought one because\
    \ you can fully customize it to your needs. You can easily add all your favorite\
    \ functions, and you can also add functions other remotes don’t offer. If a commercial\
    \ product doesn’t support a certain vendor, you’re usually stuck. With your own\
    \ remote, you can easily add new protocols yourself. It’s even possible not only\
