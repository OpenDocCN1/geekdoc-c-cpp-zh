    \ 368\n^C\n```\n\n一切如期工作，用 C 语言访问串口并没有那么难。要把这段代码嵌入到 C++ 程序中，你应该将其包装在一个名为 `SerialPort`\
    \ 的类或类似的类中。\n\n## Java\n\nJava 平台标准化了诸多方面，并定义了如何在 Java Communications API 中访问串口。[²](http://java.sun.com/products/javacomm/)\
    \ 但该 API 只是一个规范，仍然需要实现。RXTX 项目就是一个很好的实现。[³](http://rxtx.qbang.org/)\n\n下载最新的发行版，并按照针对你平台的安装说明进行安装。确保\
    \ `RXTXcomm.jar` 位于你的类路径中。然后在你喜欢的 IDE 或文本编辑器中输入以下代码：\n\n下载 `SerialProgramming/java/AnalogReaderTest.java`\n\
    \n```java\nimport java.io.InputStream;\nimport java.io.OutputStream;\nimport gnu.io.CommPortIdentifier;\n\
    import gnu.io.SerialPort;\n\nclass AnalogReader {\n    private InputStream _input;\n\
    \    private OutputStream _output;\n\n    public AnalogReader(\n        final\
    \ String portName,\n        final int baudRate) throws Exception\n    {\n    \
    \    final int timeout = 1000;\n        final String appName = \"analog reader\
    \ client\";\n        CommPortIdentifier portId =\n            CommPortIdentifier.getPortIdentifier(portName);\n\
    \        SerialPort port = (SerialPort)portId.open(\n            appName,\n  \
    \          timeout\n        );\n        _input = port.getInputStream();\n    \
    \    _output = port.getOutputStream();\n        port.setSerialPortParams(\n  \
    \          baudRate,\n            SerialPort.DATABITS_8,\n            SerialPort.STOPBITS_1,\n\
    \            SerialPort.PARITY_NONE\n        );\n    }\n\n    public void run()\
    \ throws Exception {\n        byte[] buffer = new byte[255];\n        Thread.sleep(2000);\n\
    \        while (true) {\n            _output.write(\"a0\\n\".getBytes());\n  \
    \          Thread.sleep(100);\n            if (_input.available() > 0) {\n   \
    \             _input.read(buffer);\n                System.out.print(new String(buffer));\n\
    \            }\n        }\n    }\n}\n\npublic class AnalogReaderTest {\n    public\
    \ static void main(String[] args) throws Exception {\n        if (args.length\
    \ != 1) {\n            System.out.println(\n                \"You have to pass\
    \ the name of a serial port.\"\n            );\n            System.exit(1);\n\
    \        }\n        AnalogReader analogReader = new AnalogReader(args[0], 9600);\n\
    \        analogReader.run();\n    }\n}\n```\n\n该文件定义了两个类：AnalogReader 和 AnalogReaderTest。AnalogReader\
    \ 实际上封装了对 Arduino 的访问。它在 `_input` 中存储一个 InputStream 对象以接收数据，并在 `_output` 中存储一个\
    \ OutputStream 对象以向 Arduino 发送数据。\n\n构造函数初始化串口连接，并将其输入流和输出流赋给我们的成员变量。要获得串口连接，我们必须先获取一个\
    \ `CommPortIdentifier` 对象。从该对象中，我们可以创建一个 `SerialPort` 对象。这个对象让我们能够访问底层流，也允许我们设置端口参数，如波特率。\n\
    \n我们在 `run()` 方法中实现了 Arduino 草图的协议。在那里我们等待两秒，然后开始一个循环。在循环中，我们使用 `OutputStream`\
    \ 的 `write()` 方法将字符串 “a0” 发送到串口。发送字符串之前，我们调用 `getBytes()` 将其转换为字节数组。为了给 Arduino\
    \ 一些时间来生成结果，我们再等待 100 毫秒。之后，我们检查是否有可用结果，并通过调用 `InputStream` 的 `read()` 方法来读取它。\n\
    \nAnalogReaderTest 只是一个小型驱动程序类，它实现了 `main()` 方法，创建一个 AnalogReader 对象，并调用它的 `run()`\
    \ 方法。下面介绍如何编译和使用该程序：\n\n```bash\nmaik> javac AnalogReaderTest.java\nmaik> java\
    \ AnalogReaderTest /dev/tty.usbmodemfa141\nExperimental:  JNI_OnLoad called.\n\
    Stable Library\n================================\nNative lib Version = RXTX-2.1-7\n\
    Java lib Version  = RXTX-2.1-7\na0: 496\na0: 433\na0: 328\na0: 328\n^C\n```\n\n\
    在输出一些来自所用库的调试信息之后，AnalogReaderTest 完全按预期工作：它持续打印模拟引脚 0 的值。如果使用正确的库，在 Java 中访问串口就是小菜一碟。\n\
    \n## Ruby\n\n即使是像 Ruby 这样的动态语言，也能让你即时访问计算机的串口，以及连接到串口的 Arduino。但在此之前，你需要安装 serialport\
    \ gem：\n\n```bash\nmaik> gem install serialport\n```\n\n使用它，你只需 30 行代码就能连接到 Arduino。\n\
    \n下载 `SerialProgramming/ruby/analog_reader.rb`\n\n```ruby\nrequire 'rubygems'\n\
    require 'serialport'\n\nif ARGV.size != 1\n  puts \"You have to pass the name\
    \ of a serial port.\"\n  exit 1\nend\n\nport_name = ARGV[0]\nbaud_rate = 9600\n\
    data_bits = 8\nstop_bits = 1\nparity    = SerialPort::NONE\n\narduino = SerialPort.new(\n\
    \  port_name,\n  baud_rate,\n  data_bits,\n  stop_bits,\n  parity\n)\n\nsleep\
    \ 2\nwhile true\n  arduino.write \"a0\"\n  line = arduino.gets.chomp\n  puts line\n\
    end\n```\n\n我们在第 15 行创建了一个新的 `SerialPort` 对象，并向它传递所有常用参数。在休眠两秒后，我们启动一个循环，并在 `SerialPort`\
    \ 对象上调用 `write()`。为了从 Arduino 取回结果，我们调用 `gets()`，然后将结果打印到控制台。下面你可以看到程序的实际运行效果：\n\
    \n```bash\nmaik> ruby analog_reader.rb /dev/tty.usbserial-A60061a3\na0: 496\n\
    a0: 456\na0: 382\n^Canalog_reader.rb:21:in `gets': Interrupt\n  from analog_reader.rb:21\n\
    ```\n\n使用 Ruby 访问 Arduino 是一个不错的选择，因为你可以完全专注于自己的应用程序。在其他编程语言中需要处理的那些繁琐的现实世界细节，在这里都被很好地隐藏了起来。\n\
    \n## Python\n\nPython 是另一种动态编程语言，你可以用它快速创建 Arduino 客户端。要进行串口编程，请先下载并安装 pyserial\
    \ 库。Windows 有一个专门的安装程序，但通常按如下方式安装就足够了：\n\n```bash\nmaik> python setup.py install\n\
    ```\n\n```python\nimport sys\nimport time\nimport serial\n\nif len(sys.argv) !=\
    \ 2:\n    print \"You have to pass the name of a serial port.\"\n    sys.exit(1)\n\
    \nserial_port = sys.argv[1]\narduino = serial.Serial(\n    serial_port,\n    9600,\n\
    \    serial.EIGHTBITS,\n    serial.PARITY_NONE,\n    serial.STOPBITS_ONE\n)\n\n\
    time.sleep(2)\n\nwhile 1:\n    arduino.write('a0')\n    line = arduino.readline().rstrip()\n\
    \    print line\n```\n\n我们确保命令行中带有串口名称。然后在第 10 行创建一个新的 `Serial` 对象，并向它传递我们希望用于串口通信的所有参数。\n\
    \n休眠两秒后，我们启动一个无限循环。在循环中，我们调用 `write()` 将字符串 `\"a0\"` 发送到串口。我们使用 `readline()` 方法读取\
    \ Arduino 返回的结果，并将结果输出到控制台。下面是一个典型会话的示例：\n\n```bash\nmaik> python analog_reader.py\
    \ /dev/tty.usbserial-A60061a3\na0: 497\na0: 458\na0: 383\n^C\n```\n\n"
