    # Creating Games with the Arduino


    You can use the Arduino to build more than your own cool game controllers. You
    can also use it to build some cool games. With the right extension shields, you
    can even turn an Arduino into a powerful gaming console.* It’s pricey, but suddenly
    your Arduino has a 320x200 pixel OLED touch screen, an analog stick, two buttons,
    and even an vibration motor for force feedback effects.


    While looking for a cheaper solution, someone built a Super Mario Bros clone with
    minimal hardware requirements.† It’s a perfect example of the unbelievable creativity
    that the Arduino sets free.


    *, http://antipastohw.blogspot.com/2009/02/getting-started-with-gamepack-in-3.html

    †. http://blog.makezine.com/archive/2010/03/super_mario_brothers_with_an_arduino.html


    have also learned that it’s easy to integrate a well-designed electronics project
    into your regular software projects. We carefully analyzed the analog data returned
    by the accelerometer, and then we eliminated all unwanted jitter. This is a technique
    you’ll use often in your electronics projects, and we will use it again in the
    next chapter.


    # 6.7 More Projects


    If you keep your eyes open, you’ll quickly find many more applications for accelerometers
    than you might imagine. Here’s a small collection of both commercial and free
    products:


    +   - Nike’s iPod Sport Kit supports you in your daily exercise, and it’s based
    on an accelerometer, too. You can learn a lot from its inner workings.⁶


    +   - It’s a lot of fun to create a marble maze computer game and control it using
    the game controller we build in this chapter. How much more fun will it be to
    build a real marble maze?⁷


    +   - In this chapter, we have measured only direct acceleration; that is, we
    usually have the accelerometer in our hand and move it.


