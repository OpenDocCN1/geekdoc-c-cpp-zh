    \ (more on that part in a few minutes). Connect the Arduino to the breadboard\
    \ using two wires. Connect pin 12 with the ninth column of the breadboard, and\
    \ connect the ground pin with the tenth column. This automatically connects all\
    \ sockets in column 9 to pin 12 and all sockets in column 10 to the ground. This\
    \ choice of columns was arbitrary, and you could have used other columns instead.\n\
    \nPlug the LED's negative connector (the shorter one) into column 10 and its positive\
    \ connector into column 9. When you plug in parts or wires into a breadboard,\
    \ you have to press them firmly until they slip in. You\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_66_0.png)\n\
    \nFigure 3.4: Connecting an LED on a breadboard to the Arduino\n\nmight need more\
    \ than one try, especially on new boards, and it often comes in handy to shorten\
    \ the connectors before plugging them into the breadboard. Make sure that you\
    \ can still identify the negative and the positive connector after you have shortened\
    \ them. Shorten the negative one a bit more, for example. Also wear safety glasses\
    \ to protect your eyes when cutting the connectors!\n\nThe things we have done\
    \ until now have been straightforward. That is, in principle we have only extended\
    \ the Arduino's ground pin and its IO pin number 12. Why do we have to add a resistor,\
    \ and what is a resistor? A resistor limits the amount of current that flows through\
    \ an electric connection. In our case, it protects the LED from consuming too\
    \ much power, because this would destroy the LED. You always have to use a resistor\
    \ when powering an LED! In Section A.1, Current, Voltage, and Resistance, on page\
    \ 237, you can learn more about resistors and their color bands. In Figure 3.5,\
    \ you can see a resistor in various stages: regular, bent, and cut.\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_67_0.png)\n\
    \nFigure 3.5: A resistor in various processing stages\n\nYou might ask yourself\
    \ why we didn't have to use a resistor when we connected the LED directly to the\
    \ Arduino. The answer is simple: pin 13 comes with an internal resistor of 1kΩ.\
    \ Now that we use pin 12, we have to add our own resistor.\n\nWe don't want to\
    \ fiddle around too much with the connectors, so we build the circuit as shown\
    \ in Figure 3.6, on the next page. That is, we use both sides of the breadboard\
    \ by connecting them with a short wire. Note that the resistor bridges the sides,\
    \ too.\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_68_0.png)\n\nFigure 3.6: You\
    \ can use both sides of a breadboard.\n\n### 3.4 First Version of a Binary Die\n\
    \nYou’re certainly familiar with regular dice displaying results in a range from\
    \ one to six. To emulate such dice exactly with an electronic device, you’d need\
    \ seven LEDs and some fairly complicated business logic. We’ll take a shortcut\
    \ and display the result of a die roll in binary.\n\nFor a binary die, we need\
    \ only three LEDs that represent the current result. We turn the result into a\
    \ binary number, and for every bit that is set, we will light up a corresponding\
    \ LED. The following diagram shows how the die results are mapped to LEDs (a black\
    \ triangle stands for a shining LED).\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_69_0.png)\n\
    \nWe already know how to control a single LED on a breadboard. Controlling three\
    \ LEDs is similar and requires only more wires, LEDs, 1kΩ resistors, and pins.\
    \ In Figure 3.7, on the following page, you can see the first working version\
    \ of a binary die.\n\nThe most important difference is the common ground. When\
    \ you need ground for a single LED, you can connect it to the LED directly. But\
    \ we need ground for three LEDs now, so we’ll use the breadboard’s rows for the\
    \ first time. Connect the row marked with a hyphen (-) to the Arduino’s ground\
    \ pin, and all sockets in this row will work as ground pins, too. Then you can\
    \ connect this row’s sockets to the LEDs using short wires.\n\nEverything else\
    \ in this circuit should look familiar, because we only had to clone the basic\
    \ LED circuit from the previous section three times. Note that we have connected\
    \ the three circuits to pins 10, 11, and 12. The only thing missing is some software:\n\
    \n```\nDownload BinaryDice/BinaryDice.pde\nLine 1 const unsigned int LED_BIT0\
    \ = 12;\nconst unsigned int LED_BIT1 = 11;\nconst unsigned int LED_BIT2 = 10;\n\
    5 void setup() {\n    pinMode(LED_BIT0, OUTPUT);\n    pinMode(LED_BIT1, OUTPUT);\n\
    \    pinMode(LED_BIT2, OUTPUT);\n10    randomSeed(analogRead(A0));\n    long result\
    \ = random(1, 7);\n    output_result(result);\n}\n15 void loop() {\n}\nvoid output_result(const\
    \ long result) {\n    digitalWrite(LED_BIT0, result & B001);\n20    digitalWrite(LED_BIT1,\
    \ result & B010);\n    digitalWrite(LED_BIT2, result & B100);\n}\n```\n"
  mdcn: "\n\n## 2.6 练习\n\n- 在示例程序中添加新的命令。例如，命令 3 可以让 LED 闪烁一段时间。\n- 尝试让命令更易读；也就是说，不要使用\
    \ 1，而是使用命令 on，不要使用 2，而是使用 off。\n\n如果你在解决此练习时遇到问题，请先阅读第 4 章《构建摩尔斯电码生成器库》，第 88 页。\n\
    \n## 第二部分\n\n## 八个 Arduino 项目\n\n## 第三章\n\n## 构建二进制骰子\n\n现在你已经学习了 Arduino 开发的基础知识，事情将会变得真正有趣起来。你现在具备创建第一个复杂、独立项目的技能。完成本章的学习后，你将知道如何使用\
    \ LED、按钮、面包板和电阻。结合这些部件与 Arduino，你几乎可以无限地进行新的有趣项目。\n\n我们的第一个项目将是创建一个电子骰子。虽然普通骰子使用一到六个点来显示结果，但我们的骰子将使用\
    \ LED 来代替。对于我们的第一次实验，单个 LED 就足够了，但对于骰子我们需要不止一个。你需要将多个外部 LED 连接到 Arduino。由于你不能全部直接连接到\
    \ Arduino，你将学习如何使用面包板。此外，你还需要一个按钮来掷骰子，所以你也将学习如何使用按钮。为了将按钮和 LED 连接到 Arduino，你需要另一个重要的电子元件：电阻。因此，在本章结束时，你的工具箱中将拥有许多新工具。\n\
    \n- 1. 一个半尺寸面包板\n- 2. 三个 LED（对于练习你需要额外的 LED）\n- 3. 两个 10kΩ 电阻（参见第 A.1 节《电流、电压和电阻》，第\
