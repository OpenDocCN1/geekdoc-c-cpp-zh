    \ = output_pin;\n  _dit_length = dit_length;\n  _dah_length = dit_length * 3;\n\
    \  pinMode(_output_pin, OUTPUT);\n}\n```\n\nThe constructor expects two arguments:\
    \ the number of the pin the Morse code should be sent to and the length of a dit\
    \ measured in milliseconds. Then it stores these values in corresponding instance\
    \ variables, calculates the correct length of a dah, and turns the communication\
    \ pin into an output pin.\n\nYou've probably noticed that all private instance\
    \ variables start with an underscore. That is a convention that I like personally.\
    \ It is not enforced by C++ or the Arduino IDE.\n\n## 4.5 Outputting Morse Code\
    \ Symbols\n\nAfter everything has been initialized, we can start to output Morse\
    \ code symbols. We use several small helper methods to make our code as readable\
    \ as possible:\n\n```\nvoid Telegraph::output_code(const char* code) {\n  for\
    \ (int i = 0; i < strlen(code); i++) {\n    if (code[i] == '.')\n    dit();\n\
    \  else\n    dah();\n}\n}\n\nvoid Telegraph::dit() {\n  Serial.print(\".\");\n\
    \  output_symbol(_dit_length);\n}\n\nvoid Telegraph::dah() {\n  Serial.print(\"\
    -\");\n  output_symbol(_dah_length);\n}\n\nvoid Telegraph::output_symbol(const\
    \ int length) {\n  digitalWrite(_output_pin, HIGH);\n  delay(length);\n  digitalWrite(_output_pin,\
    \ LOW);\n}\n```\n\nThe function output_code() takes a Morse code sequence consisting\
    \ of dots and dashes and turns it into calls to dit() and dah(). The dit() and\
    \ dah() methods then print a dot or a dash to the serial port and delegate the\
    \ rest of the work to output_symbol(), passing it the length of the Morse code\
    \ symbol to be emitted. output_symbol() sets the output pin to HIGH for the length\
    \ of the symbol, and then it sets it back to LOW. Everything works exactly as\
    \ described in the Morse code timing scheme, and only the implementation of send_message()\
    \ is missing:\n\nDownload Telegraph/telegraph.cpp\n\n```\nvoid Telegraph::send_message(const\
    \ char* message) {\n  for (int i = 0; i < strlen(message); i++) {\n    const char\
    \ current_char = toupper(message[i]);\n    if (isalpha(current_char)) {\n    \
    \  output_code(LETTERS[current_char - 'A']);\n      delay(_dah_length);\n    }\
    \ else if (isdigit(current_char)) {\n      output_code(DIGITS[current_char - '0']);\n\
    \      delay(_dah_length);\n    } else if (current_char == ' ') {\n      Serial.print(\"\
    \ \");\n      delay(_dit_length * 7);\n    }\n  }\n  Serial.println();\n}\n```\n\
    \nsend_message() outputs a message character by character in a loop. In line 3,\
    \ we turn the current character into uppercase, because lowercase characters are\
    \ not defined in Morse code (that’s the reason why you can’t implement a chat\
    \ client using Morse code). Then we check whether the current character is a letter\
    \ using C’s isalpha() function. If it is, we use it to determine its Morse code\
    \ representation that is stored in the LETTERS array. To do that, we use an old\
    \ trick: in the ASCII table all letters (and digits) appear in the right order,\
    \ that is, A=65, B=66, and so on. To transform the current character into an index\
    \ for the LETTERS array, we have to subtract 65 (or ‘A’) from its ASCII code.\
    \ When we have determined the correct Morse code, we pass it to output_code()\
    \ and delay the program for the length of a dah afterward.\n\nThe algorithm works\
    \ exactly the same for outputting digits; we only have to index the DIGITS array\
    \ instead of the LETTERS array, and we have to subtract the ASCII value of the\
    \ character 0.\n\nIn line 10, we check whether we received a blank character.\
    \ If yes, we print a blank character to the serial port and wait for seven dits.\
    \ All other characters are ignored: we only process letters, digits, and blanks.\
    \ At the end of the method, we send a newline character to the serial port to\
    \ mark the end of the message.\n\n## 4.6 Installing and Using the Telegraph Class\n\
    \nOur Telegraph class is complete, and we should now create some example sketches\
    \ that actually use it. This is important for two reasons: we can test our library\
    \ code, and for users of our class it’s good documentation for how to use it.\n\
    \nThe Arduino IDE looks for libraries in two places: in its global libraries folder\
    \ relative to its installation directory and in the user’s local sketchbook directory.\
    \ During development it’s best to use the local sketchbook directory. You can\
    \ find its location in the IDE’s preferences (see Figure 4.1, on the next page).\
    \ Create a new directory named libraries in the sketchbook directory.\n\nTo make\
    \ our Telegraph class available, create a Telegraph subfolder in the libraries\
    \ folder. Then copy telegraph.h and telegraph.cpp to that folder (do not copy\
    \ Telegraph.pde). Restart the IDE.\n\nLet’s start with the mother of all programs:\
    \ “Hello, world!” Create a new sketch named HelloWorld, and enter the following\
    \ code:\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_94_0.png)\n\n**Figure 4.1:**\
    \ Find the sketchbook location in the preferences.\n\nDownload Telegraph/examples/HelloWorld/HelloWorld.pde\n\
    \n```\n#include \"telegraph.h\"\n\nconst unsigned int OUTPUT_PIN = 13;\nconst\
    \ unsigned int DIT_LENGTH = 200;\n\nTelegraph telegraph(OUTPUT_PIN, DIT_LENGTH);\n\
    \nvoid setup() {}\n\nvoid loop() {\n\ttelegraph.send_message(\"Hello, world!\"\
    );\n\tdelay(5000);\n}\n```\n\nThis sketch emits the string “Hello, world!” as\
    \ Morse code every five seconds. To achieve this, we include the definition of\
    \ our Telegraph class, and we define constants for the pin our LED is connected\
    \ to and for the length of our dits. Then we create a global Telegraph object\
    \ and an empty setup() function. In loop(), then we invoke send_message() on our\
    \ Telegraph instance every five seconds.\n\nWhen you compile this sketch, the\
    \ Arduino IDE automatically compiles the telegraph library, too. So if you made\
    \ any syntactical errors in the library, you’ll be notified now. If you have to\
    \ correct some errors, make\n\n"
