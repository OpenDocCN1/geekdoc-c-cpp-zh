    \n```cpp\n#ifndef __EMAIL__H__\n#define __EMAIL__H__\n\nclass Email {\n    String\
    \ _from, _to, _subject, _body;\n\npublic:\n\n    Email(\n        const String&\
    \ from,\n        const String& to,\n        const String& subject,\n        const\
    \ String& body\n    ) : _from(from), _to(to), _subject(subject), _body(body) {}\n\
    \n    const String& getFrom()    const { return _from; }\n    const String& getTo()\
    \      const { return _to; }\n    const String& getSubject() const { return _subject;\
    \ }\n    const String& getBody()    const { return _body; }\n};\n\n#endif\n```\n\
    \nThis class encapsulates an email's four most important attributes—the email\
    \ addresses of the sender and the recipient, a subject, and a message body. We\
    \ store all attributes as String objects.\n\nWait a minute...a String class? Yes!\
    \ Since version 19, the Arduino IDE comes with a full-blown string class.¹⁴ It\
    \ does not have as many features as the C++ or Java string classes, but it's still\
    \ way better than messing around with char pointers. You'll see how to use it\
    \ in a few paragraphs.\n\n14. http://arduino.cc/en/Reference/StringObject\n\n\
    The rest of our Email class is pretty straightforward. In the constructor, we\
    \ initialize all instance variables, and we have methods for getting every single\
    \ attribute. We now need an SmtpService class for sending Email objects:\n\n`Download\
    \ Ethernet/Email/smtp_service.h`\n\n```cpp\n#ifndef __SMTP_SERVICE__H__\n#define\
    \ __SMTP_SERVICE__H__\n\n#include \"email.h\"\n\nclass SmtpService {\n    byte*\
    \ _smtp_server;\n    unsigned int _port;\n\n    void read_response(Client& client)\
    \ {\n        delay(4000);\n        while (client.available()) {\n            const\
    \ char c = client.read();\n            Serial.print(c);\n        }\n    }\n\n\
    \    void send_line(Client& client, String line) {\n        const unsigned int\
    \ MAX_LINE = 256;\n        char buffer[MAX_LINE];\n        line.toCharArray(buffer,\
    \ MAX_LINE);\n        Serial.println(buffer);\n        client.println(buffer);\n\
    \        read_response(client);\n    }\n\n    public:\n\n    SmtpService(\n  \
    \      byte* smtp_server,\n        const unsigned int port) : _smtp_server(smtp_server),\n\
    \        _port(port) {}\n\n    void send_email(const Email& email) {\n       \
    \ Client client(_smtp_server, _port);\n        Serial.print(\"Connecting...\"\
    );\n\n        if (!client.connect()) {\n            Serial.println(\"connection\
    \ failed.\");\n        } else {\n            Serial.println(\"connected.\");\n\
    \            read_response(client);\n            send_line(client, String(\"helo\"\
    ));\n            send_line(\n                client,\n                String(\"\
    mail from: <\") + email.getFrom() + String(\">\")\n            );\n          \
    \  send_line(\n                client,\n                String(\"rcpt to: <\"\
    ) + email.getTo() + String(\">\")\n            );\n            send_line(client,\
    \ String(\"data\"));\n            send_line(client, String(\"from: \") + email.getFrom());\n\
    \            send_line(client, String(\"to: \") + email.getTo());\n          \
    \  send_line(client, String(\"subject: \") + email.getSubject());\n          \
    \  send_line(client, String(\"\"));\n            send_line(client, email.getBody());\n\
    \            send_line(client, String(\".\"));\n            send_line(client,\
