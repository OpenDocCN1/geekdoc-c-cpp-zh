    \n我们的应用程序将有一个 1000x1000 像素的屏幕，因此我们为其宽度、高度和中心定义常量。我们将 LINE_FEED 常量设置为换行符的 ASCII\
    \ 值，因为我们稍后需要它来解释 Arduino 发送的数据。\n\n然后我们定义一些全局变量（是的，你们 Java 程序员：Processing 允许你定义全局变量！）：\n\
    \n- *arduinoPort*：Processing 的 Serial 类的一个实例。它来自我们已导入的 processing.serial 包，并封装了与\
    \ Arduino 的串行端口通信。\n- *sensorData*：从 Arduino 传输到我们应用程序的当前传感器数据。我们使用在第 5.6 节 *表示传感器数据*\
    \ 中定义的 SensorData 类，第 123 页。\n- *degree*：我们将在一个圆上可视化到最近物体的当前距离。此变量存储我们现在在圆上的哪个度数。值范围从\
    \ 0 到 359。\n- *radius*：到最近物体的当前距离被解释为半径值。\n\n## 5.8 在 Processing 中实现串行通信\n\n以下函数从\
    \ Arduino 连接的串行端口读取数据，并解释 Arduino 发送的数据：\n\nDownload ultrasonic/InvertedSonar/InvertedSonar.pde\n\
    \n```\nvoid setup() {\n  size(WIDTH, HEIGHT);\n  println(Serial.list());\n  String\
    \ arduinoPortName = Serial.list()[0];\n  arduinoPort = new Serial(this, arduinoPortName,\
    \ 9600);\n  arduinoPort.bufferUntil(LINE_FEED);\n}\n\nvoid serialEvent(Serial\
    \ port) {\n  sensorData = getSensorData();\n  if (sensorData != null) {\n    println(\"\
    Temperature: \" + sensorData.getTemperature());\n    println(\"Distance: \" +\
    \ sensorData.getDistance());\n    radius = min(300, int(sensorData.getDistance()\
    \ * 2));\n  }\n}\n\nSensorData getSensorData() {\n```\n\n```\nSensorData result\
    \ = null;\nif (arduinoPort.available() > 0) {\n    final String arduinoOutput\
    \ = arduinoPort.readStringUntil(LINE_FEED);\n    result = parseArduinoOutput(arduinoOutput);\n\
    }\nreturn result;\n}\n\nSensorData parseArduinoOutput(final String arduinoOutput)\
    \ {\n    SensorData result = null;\n    if (arduinoOutput != null) {\n       \
    \ final int[] data = int(split(trim(arduinoOutput), ','));\n        if (data.length\
    \ == 2)\n            result = new SensorData(data[0] / 100.0, data[1] / 100.0);\n\
    \    }\n    return result;\n}\n```\n\nsetup() 是 Processing 的标准函数之一，其含义与 Arduino\
    \ 的 setup() 方法相同。Processing 运行时环境仅在应用程序启动时调用一次它并初始化应用程序。通过 size() 方法，我们创建一个具有特定宽度和高度的新屏幕（顺便说一下，你可以在网上找到所有\
    \ Processing 类的优秀参考资料⁶）。\n\n初始化屏幕后，我们准备串行端口通信。首先，我们使用 Serial.list() 打印当前连接到计算机的所有串行设备列表。然后我们将要使用的串行端口的名称设置为第一个列表项。这可能是错误的端口，因此要么将系统串行端口的名称硬编码到代码中，要么查看串行端口列表并选择正确的端口！\n\
    \n在第 5 行，我们创建一个新的 Serial 对象，该对象绑定到我们的应用程序（这就是 this 的用途）。我们使用来自所有串行端口列表的串行端口名称，并将波特率设置为\
    \ 9600。如果你想更快地通信，你必须在此处和 Arduino 草图中同时更改波特率。\n\n最后，我们告诉 Serial 对象我们只希望在检测到换行符时才收到新串行数据的通知。每当我们找到换行符时，我们就知道\
