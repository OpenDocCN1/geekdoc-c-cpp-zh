  mdcn: "\n位移位运算符 `<<` 和 `>>` 允许你在处理位之前将它们移动到某个位置。第一个将位向左移动，第二个将位向右移动：\n\n```\nint\
    \ x = 42; // In binary this is 101010\nint y = x << 1; // y == 84 == B1010100\n\
    int z = x >> 2; // z == 10 == B1010\n```\n\n移位操作可能看起来很直观，但在移动有符号值时你必须小心。³ 虽然它们看起来相似，位运算符与布尔运算符并不相同。布尔运算符如\
    \ `&&` 和 `||` 不在位级上操作，它们实现的是布尔代数规则。⁴\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_251_0.png)\n\
    \n图 C.1：位级串行通信\n\n一种协议，并且在图 C.1 中，你可以看到典型的串行通信是什么样子。位的不同状态由不同的电压电平表示。通常，0 位由 0\
    \ 伏表示，而 5 伏代表 1 位（有些协议分别使用 -12V 和 12V）。\n\n以下参数控制串行通信：\n\n-   一个*起始位*表示数据字的开始，用于同步发送器和接收器。它始终为\
    \ 0。\n-   一个*停止位*告诉我们最后一个数据位何时被发送，并分隔两个连续的数据字。根据特定的协议约定，可能有多个停止位，但这种情况很少发生。\n\
    -   信息以二进制*数据位*的形式传输；也就是说，例如，如果你想传输字母 M，你必须先将其转换为数字。有几种字符集编码可用，但在使用 Arduino 时，ASCII\
    \ 编码最合适。在 ASCII 中，大写 M 被编码为十进制数 77，即二进制中的 01001101。这就是最终被传输的位序列。\n-   *校验位*指示数据中\
    \ 1 的个数是奇数还是偶数。这是一种简单的错误检查算法，现在很少使用，它源于网络连接不如今天可靠的时代。\n\n```\nchar pin_name[MAX_PIN_NAME\
    \ + 1];\n\nif (Serial.available()) {\n    int i = 0;\n    while (Serial.available()\
    \ && i < MAX_PIN_NAME) {\n        const char c = Serial.read();\n        if (c\
    \ != -1 && c != '\\n')\n            pin_name[i++] = c;\n        delay(SERIAL_DELAY);\n\
    \    }\n    pin_name[i] = 0;\n    if (strlen(pin_name) > 1 &&\n        (pin_name[0]\
    \ == 'a' || pin_name[0] == 'A'))\n    {\n        const int pin = atoi(&pin_name[1]);\n\
    \        if (pin < NUM_PINS) {\n            Serial.print(pin_name);\n        \
    \    Serial.print(\": \");\n            Serial.println(analogRead(pin));\n   \
    \     } else {\n            Serial.print(\"Unknown pin: \");\n            Serial.println(pin);\n\
    \        }\n    } else {\n        Serial.print(\"Unknown pin name: \");\n    \
    \    Serial.println(pin_name);\n    }\n}\n```\n\n该程序等待一个模拟引脚（a0, a1, ... a5）的名称，并返回其当前值。因此，我们所有的客户端都必须向\
    \ Arduino 发送数据（引脚的名称），并且必须接收结果（在下一页的图 C.2 中，你可以看到它与 IDE 的串口监视器配合工作的效果）。\n\n所有客户端看起来都很相似：它们期望将要连接的串口名称作为命令行参数。它们会不断向\
    \ Arduino 发送字符串“a0”，以获取模拟引脚 0 的当前值，然后将结果打印到控制台。它们都使用恒定的 9600 波特率，并且在打开串口后都会等待两秒，因为许多\
    \ Arduino 在打开串行连接时会重新启动。要更全面地了解串行通信，请参阅第 251 页的 C.1 节“深入了解串行通信”。\n\n对于某些客户端，你需要安装额外的库。在某些情况下，你必须以机器上的管理员用户身份执行此操作。在接下来的章节中，我不会明确提及这一点。此外，你应该确保\n\
