    ![](img/dcfd13a1bf99c4d3f9996627012a6526_48_0.png)


    # Figure 2.2: The IDE lets you change some preferences.


    compile it again. The output in the message panel should look similar to Figure
    2.3, on the following page (in recent versions of the IDE, you can achieve the
    same effect by holding down the Shift key when you click the Verify/Compile or
    Upload button in the toolbar).


    Note that the IDE updates some of the preferences'' values when it shuts down.
    So before you change any preferences directly in the preferences.txt file, you
    have to stop the Arduino IDE first.


    Now that you''re familiar with the Arduino IDE, let''s do some program- ming.
    We''ll make the Arduino talk to the outside world.




    Arduino makes many stand-alone applications possible—projects that do not involve
    any additional computers. In such cases you need to connect the Arduino to a computer
    once to upload the software, and after that, it needs only a power supply. More
    often, people use the Arduino to enhance the capabilities of a computer using
    sensors or by giving access to additional hardware. Usually, you control external
    hardware via a serial port, so it is a good idea to learn how to communicate serially
    with the Arduino.'
