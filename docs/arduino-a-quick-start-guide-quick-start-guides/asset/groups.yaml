    check() method. In Figure 8.11, on the previous page, you can see what happens
    when the burglar alarm detects an intruder.


    Did you notice how easy object-oriented programming on an embedded device can
    be? We''ve clearly hidden the complexity of both email and the PIR sensor in two
    small classes. To build the burglar alarm, we then only had to write some glue
    code.


    One word regarding privacy: do not abuse the project in this chapter to observe
    other people without their knowledge. Not only is it unethical, but in many countries
    it even is illegal!


    In this chapter, you learned different ways of connecting an Arduino to the Internet.
    Some of them need an additional PC, while others need an Ethernet shield, but
    they all open the door to a whole new range of embedded computing applications.


    Networking is one of those techniques that may have a direct impact on the outside
    world. In the next chapter, you''ll learn about another technique that has similar
    effects; you''ll learn how to control devices remotely.


    # 8.10 What If It Doesn’t Work?


    Networks are complex and complicated beasts, and many things can go wrong when
    trying the examples in this chapter. The most common problems are the following:


    +   • You have chosen the wrong serial port in the Processing application. By
    default, the application uses the first serial port it can find. It might be that
    you have connected your Arduino to another port. In this case, you have to change
    the index 0 in the statement arduinoPort = new Serial(this, Serial.list()[0],
    BAUD_RATE); accordingly.

    +   • You forgot to plug the Ethernet cable into the Ethernet shield.

    +   • Your network router has a MAC whitelist that allows only certain MAC addresses
    to access the network. Make sure that the MAC address you use in your sketches
    is whitelisted. Check your router''s documentation.

    +   • You have used the same MAC address twice on your network.'
