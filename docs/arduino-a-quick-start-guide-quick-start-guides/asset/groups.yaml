  - '[PAGE 57]


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_57_0.png)


    Figure 2.8: The screen command communicates with Arduino.


    We can now communicate with the Arduino, and this has great implications: whatever
    is controlled by the Arduino can also be controlled by your computer, and vice
    versa. Switching LEDs on and off is not too spectacular, but try to imagine what''s
    possible now. You could move robots, automate your home, or create interactive
    games.


    Here are some more important facts about serial communication:


    +   - The Arduino’s serial receive buffer can hold up to 128 bytes. When sending
    large amounts of data at high speed, you have to synchronize sender and receiver
    to prevent data loss. Usually, the receiver sends an acknowledgment to the sender
    whenever it is ready to consume a new chunk of data.'
