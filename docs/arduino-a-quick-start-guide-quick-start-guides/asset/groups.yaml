    4. http://code.google.com/p/arduino/issues/list?q=milestone=1.0

    5. http://processing.org


    ### Online Resources


    This book has its own web page at http://pragprog.com/titles/msard where you can
    download the code for all examples (if you have the ebook version of this book,
    clicking the little gray box above each code example downloads that source file
    directly). You can also participate in a discussion forum and meet other readers
    and me. If you find bugs, typos, or other annoyances, please let me and the world
    know about them on the book’s errata page.⁶


    On the web page you will also find a link to a Flickr⁷ photo set. It contains
    all the book’s photos in high resolution. There you can also see photos of reader
    projects, and we’d really like to see photos of your projects, too!


    Let’s get started!


    ### The Parts You Need


    Here’s a list of the parts you need to work through all the projects in this book.
    In addition, each chapter lists the parts you’ll need for that chapter’s projects,
    so you can try projects chapter-by-chapter without buying all the components at
    once. Although there look to be a lot of components here, they’re all fairly inexpensive,
    and you can buy all the parts you need for all the projects in this book for about
    $200.


    Many online shops sell Arduino components and electronic parts. Some of the best
    are Makershed and Adafruit. They have awesome starter packs, and I strongly recommend
    buying one of these.


    The best and cheapest solution is to buy the Arduino Projects Pack from Makershed
    (product code MSAPK). It contains nearly all the parts you need to build the book’s
    examples, as well as many more useful parts that you can use for your own side
    projects. If you buy the Arduino Projects Pack, you’ll need to buy these additional
    parts separately:


    - Parallax PING))) sensor

    - TMP36 temperature sensor from Analog Devices

    - ADXL335 accelerometer breakout board

    - 6 pin 0.1" standard header

    - Nintendo Nunchuk controller

    - A Passive Infrared Sensor

    - An infrared LED

    - An infrared receiver

    - An Ethernet shield

