  - "[PAGE 159]\n\nIn line 4, we create a constant for the size of the array we need\
    \ to store the data the Nunchuk returns. We define this array in line 33, and\
    \ in this case, we define the constant using the preprocessor instead of the const\
    \ keyword, because array constants must be known at compile time in C++.\n\nThen\
    \ the actual declaration of the Nunchuk class begins. To initiate the communication\
    \ channel between Arduino and Nunchuk, you have to invoke the initialize() method\
    \ once. Then you call update() whenever you want the Nunchuk to send new data.\
    \ You’ll see the implementation of these two methods shortly.\n\nWe have public\
    \ methods for getting all attributes the Nunchuk returns: the x and y positions\
    \ of the analog stick, the button states, and the acceleration values of the x-,\
    \ y-, and z-axes. All these methods operate on the raw data you can find in the\
    \ buffer in line 33. Their implementation is mostly trivial and requires only\
    \ a single line of code. Only the assembly of the 10-bit acceleration values needs\
    \ some tricky bit operations (see Section B.2, Bit Operations, on page 249).\n\
    \nAt the end of the class declaration you find two private helper methods we need\
    \ to implement: initialize() and update():\n\n```\n```cpp\n#include <Wire.h>\n\
    #include \"nunchuk.h\"\n#define NUNCHUK_DEVICE_ID 0x52\n\nvoid Nunchuk::initialize()\
    \ {\n    Wire.begin();\n    Wire.beginTransmission(NUNCHUK_DEVICE_ID);\n    Wire.send(0x40);\n\
    \    Wire.send(0x00);\n    Wire.endTransmission();\n    update();\n}\n\nbool Nunchuk::update()\
    \ {\n    delay(1);\n    Wire.requestFrom(NUNCHUK_DEVICE_ID, NUNCHUK_BUFFER_SIZE);\n\
    \    int byte_counter = 0;\n    while (Wire.available() && byte_counter < NUNCHUK_BUFFER_SIZE)\n\
    \        _buffer[byte_counter++] = decode_byte(Wire.receive());\n    return byte_counter\
    \ == NUNCHUK_BUFFER_SIZE;\n}\n```\n```"
