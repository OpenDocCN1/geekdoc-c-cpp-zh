    # Acknowledgments


    Writing books doesn’t get easier the more often I do it—I think there will never
    be a time when I can do it on my own. I will always depend on the help of others,
    and a lot of wonderful people contributed to this book.


    I have to start by thanking my unbelievably talented editor, Susannah Davidson
    Pfalzer. Only because of her insightful advice, her patience, and her encouragement
    have I finished this book. I owe her so much!


    Also, the Pragmatic Bookshelf team again has been amazingly professional, and
    my publishers have been very sympathetic when I went through some hard times.
    I am so thankful for that!


    This book would not have been possible without the stunning work of the whole
    Arduino team! Thank you so much for creating the Arduino!


    A big “thank-you!” goes to all the people who contributed material to this book:
    Christian Rattat took all the book’s photos, Kaan Karaca created the Blaminatr’s
    display, and Tod E. Kurt kindly allowed me to use his excellent C code for accessing
    an Arduino via serial port.


    I have created all circuit diagrams with Fritzing,¹ and I’d like to thank the
    Fritzing team for making such a great tool available for free!


    For an author, there’s nothing more motivating than feedback. I’d like to thank
    my reviewers: René Bohne, Stefan Christoph, Georg Kaindl, Kaan Karaca, Christian
    Rattat, Stefan Rödder, Christoph Schwaeppe, Federico Tomassetti, and Tony Williamitis.
    This book is so much better because of your insightful comments and suggestions!
    I am also grateful to all readers who have sent in errata during the beta book
    period.


    When I had written the first half of this book, my mother passed away in February
    2010. It has been one of the hardest times in my life, and'
