    \n我们已经创建了许多可以使用串口监视器控制的项目。对于程序员来说，这是一个不错且方便的界面，但一旦你想向不懂技术的朋友或配偶展示你的项目，你最好拥有更友好、更丰富多彩的界面。\n\
    \nSeriality⁴ 插件使这成为可能。它为你的 Web 浏览器的 JavaScript 引擎添加了串口通信支持。\n\n目前，该插件仅适用于 Mac\
    \ OS X 上的 Firefox、Safari 和 Chrome，但 Windows 移植版正在开发中。Seriality 以磁盘映像形式提供，因此你可以照常下载⁵并安装。\n\
    \n4. http://www.zambetti.com/projects/seriality/\n5. http://code.google.com/p/seriality/downloads/list\n\
    \n安装 Seriality 后，你可以使用下面的 HTML 和 JavaScript 代码混合体将 Web 浏览器变成 Apple Remote 模拟器：\n\
    \n```\nDownload RemoteControl/AppleRemoteUI/ui.html\n\nLine 1\n<html>\n<title>Apple\
    \ Remote Emulator</title>\n<head>\n<script type=\"text/javascript\">\nvar serial;\n\
    \nfunction setup() {\nserial = (document.getElementById(\"seriality\")).Seriality();\n\
    alert(serial.ports.join(\"\\n\"));\nserial.begin(serial.ports[0], 9600);\n}\n\
    </script>\n</head>\n\n<body onload=\"setup();\">\n<object type=\"application/Seriality\"\
    \nid=\"seriality\"\nwidth=\"0\"\nheight=\"0\">\n</object>\n<h2>Apple Remote Emulator</h2>\n\
    <form>\n<button type=\"button\" onclick=\"serial.write('m');\">\nMenu\n</button>\n\
    <br/>\n<button type=\"button\" onclick=\"serial.write('u');\">\nUp\n</button>\n\
    <br/>\n<button type=\"button\" onclick=\"serial.write('d');\">\nDown\n</button>\n\
    <br/>\n<button type=\"button\" onclick=\"serial.write('l');\">\nPrevious\n</button>\n\
    <br/>\n<button type=\"button\" onclick=\"serial.write('n');\">\nNext\n</button>\n\
    <br/>\n<button type=\"button\" onclick=\"serial.write('p');\">\nPlay\n</button>\n\
    <br/>\n</form>\n</body>\n</html>\n```\n\n这是一个非常简单的 HTML 页面，我们将重点放在 JavaScript\
    \ 部分。在第 4 到 12 行，我们定义了两样东西：一个名为 serial 的全局变量和一个名为 setup() 的函数。setup() 初始化 serial\
    \ 并为它分配一个 Seriality 对象。我们使用 <object> 标签将 Seriality 对象嵌入到网页中。它的 ID 是 \"seriality\"\
    ，因此我们可以使用 getElementById() 访问它。\n\n一旦我们获得了对对象的引用，就会调用 JavaScript 的 alert() 函数，并输出我们找到的所有串口。你需要查找你的\
    \ Arduino 所连接的串口的索引，并在接下来的 begin() 方法调用中使用它。为简单起见，我们总是传递我们能找到的第一个串行设备以及 9,600\
    \ 的波特率。使用第一个串行设备只是猜测，你可能需要调整它。你从我们的 Processing 示例中已经知道了这种模式。\n\n我们在 <body> 元素的\
    \ onload 事件处理程序中调用 setup()。然后，我们可以在六个 <button> 元素的 onclick 处理程序中访问 Seriality 对象。\n\
    \n将第 209 页“9.4 制作你自己的 Apple Remote”一节中的程序上传到你的 Arduino，然后将浏览器指向该 HTML 页面。在点击显示所有串口的警告框的\
    \ OK 按钮后，你应该会看到类似下一页图 9.7 所示的网页。点击任意按钮执行相应操作。这是一个连你奶奶都能使用的界面，不是吗？\n\n请注意，你不能使用\
    \ Seriality 直接访问 Arduino 硬件。你只能访问串口，因此你希望在 Arduino 上发生的所有事情都必须通过串行通信来实现。但这无论如何都是一种常见模式，因此\
    \ Seriality 确实是一个有用的工具，可以极大地改善你项目的用户界面。\n\n你仍然需要将 Arduino 连接到计算机的串口，才能用 Web 浏览器控制它。在下一节中，你将学习如何克服这一限制，在没有串行连接的情况下控制\
    \ Arduino。\n\n我们之前所有的远程控制方法都有一个主要缺点：它们都依赖于与 PC 的串行连接。在本节中，你将学习如何用以太网连接替换这种连接，从而不再需要\
    \ PC，而只需要 Internet 访问。你将直接插入\n"
