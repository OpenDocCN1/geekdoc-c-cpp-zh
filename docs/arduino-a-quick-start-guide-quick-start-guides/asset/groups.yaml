    ![](img/dcfd13a1bf99c4d3f9996627012a6526_220_0.png)


    Although we’ve used only a minimum amount of hardware (a cheap and simple infrared
    LED), this chapter’s projects are very useful and fairly sophisticated, at least
    from a software development point of view. We can now not only control any device
    that understands infrared signals, but we can do it using a computer’s serial
    port or even a web browser.


    Also, you no longer need to connect the Arduino to your computer’s USB port. The
    Infrared proxy, for example, only needs the USB port to get some power. Plug an
    AC adapter into your Arduino, and you can get rid of your USB cable.


    For the first time, we’ve controlled real-world devices using an Arduino. We’ll
    continue to do so in the next chapter, where you’ll learn how to control motors.


    # 9.7 What If It Doesn’t Work?


    In this chapter, we mainly used LEDs and an Ethernet shield, so all the advice
    from Chapter 3, *Building Binary Dice*, on page 63 and Chapter 8, *Networking
    with Arduino*, on page 170 also apply to this chapter.


    In addition, you have to be careful about more things. For example, the distance
    between an infrared LED and its receiver is important.'
