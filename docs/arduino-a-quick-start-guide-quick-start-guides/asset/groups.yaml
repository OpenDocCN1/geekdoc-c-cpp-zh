  - "[PAGE 76]\n\nIf you press the button, for example, the LED sometimes will turn\
    \ on and then off immediately. Also, if you release it, the LED will often remain\
    \ in a more or less arbitrary state; that is, sometimes it will be on and sometimes\
    \ off.\n\nThe problem is that the Arduino executes the loop() method over and\
    \ over again. Although the Arduino's CPU is comparatively slow, this would happen\
    \ very often—no matter if we currently press the button or not. But if you press\
    \ it and keep it pressed, its state will constantly be HIGH, and you'd constantly\
    \ toggle the LED's state (because this happens so fast it seems like the LED's\
    \ constantly on). When you release the button, the LED is in a more or less arbitrary\
    \ state.\n\nTo improve the situation, we have to store not only the LED's current\
    \ state but also the pushbutton's previous state:\n\nDownload BinaryDice/MoreReliableSwitch/MoreReliableSwitch.pde\n\
    \n```\nconst unsigned int BUTTON_PIN = 7;\nconst unsigned int LED_PIN   = 13;\n\
    \nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n\
    }\n\nint old_button_state = LOW;\nint led_state = LOW;\n\nvoid loop() {\n  const\
    \ int CURRENT_BUTTON_STATE = digitalRead(BUTTON_PIN);\n  if (CURRENT_BUTTON_STATE\
    \ != old_button_state &&\n      CURRENT_BUTTON_STATE == HIGH)\n  {\n    led_state\
    \ = (led_state == LOW) ? HIGH : LOW;\n    digitalWrite(LED_PIN, led_state);\n\
    \  }\n  old_button_state = CURRENT_BUTTON_STATE;\n}\n```\n\nAfter initializing\
    \ the button and LED pins, we declare two variables now: old_button_state stores\
    \ the previous state of our pushbutton, and led_state stores the LED's current\
    \ state. Both can be either HIGH or LOW.\n\nIn the loop() function, we still have\
    \ to read the current button state, but now we not only check whether it is HIGH.\
    \ We also check whether it has changed since the last time we read it. Only when\
    \ both conditions are met do we toggle the LED's state. So, we no longer turn\
    \ the LED"
  - "[PAGE 77]\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_77_0.png)\n\n# Figure 3.9:\
    \ Mechanical switches have to be debounced.\n\non and off over and over again\
    \ as long as the button is pressed. At the end of our program, we have to store\
    \ the button's current state in old_button_state.\n\nUpload our new version, and\
    \ you'll see that this solution works much better than our old one. But you will\
    \ still find some edge cases when the button does not fully behave as expected.\
    \ Problems mainly occur in the moment you release the button.\n\nThe cause of\
    \ these problems is that mechanical buttons bounce for a few milliseconds when\
    \ you press them. In Figure 3.9, you can see a typical signal produced by a mechanical\
    \ button. Right after you have pressed the button, it doesn't emit a clear signal.\
    \ To overcome this effect, you have to debounce the button. It's usually sufficient\
    \ to wait a short period of time until the button's signal stabilizes. Debouncing\
    \ makes sure that we react only once to a push of the button. In addition to debouncing,\
    \ we still have to store the current state of the LED in a variable. Here's how\
    \ to do that:\n\n```\nDownload BinaryDice/DebounceButton/DebounceButton.pde\n\
    Line 1\nconst unsigned int BUTTON_PIN = 7;\nconst unsigned int LED_PIN   = 13;\n\
    \nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n\
    }\n\nint old_button_state = LOW;\nint led_state = LOW;\n```"
  - "[PAGE 78]\n\n```\nvoid loop() {\n  const int CURRENT_BUTTON_STATE = digitalRead(BUTTON_PIN);\n\
    \  if (CURRENT_BUTTON_STATE != old_button_state &&\n      CURRENT_BUTTON_STATE\
    \ == HIGH)\n  {\n    led_state = (led_state == LOW) ? HIGH : LOW;\n    digitalWrite(LED_PIN,\
    \ led_state);\n    delay(50);\n  }\n  old_button_state = CURRENT_BUTTON_STATE;\n\
    }\n```\n\nThis final version of our LED switch differs from the previous one in\
    \ only a single line: to debounce the button, we wait for 50 milliseconds in line\
    \ 19 before we enter the main loop again.\n\nThis is everything you need to know\
    \ about pushbuttons for now. In the next section, we'll use two buttons to turn\
    \ our binary dice into a real game.\n\n# 3.6 Adding Our Own Button\n\nUp to now,\
    \ we had to abuse the Arduino's reset button to control the dice. This solution\
    \ is far from optimal, so we'll add our own buttons. In Figure 3.10, on page 81,\
    \ you can see that we need to change our current circuit only slightly. Actually,\
    \ we don't have to change the existing parts at all; we only need to add some\
    \ things. First we plug a button into the breadboard and connect it to pin 7.\
    \ Then we connect the button to the ground via a 10kΩ resistor and use a small\
    \ piece of wire to connect it to the 5 volts pin. That's all the hardware we need.\
    \ Here's the corresponding software:\n\nDownload BinaryDice/DiceWithButton/DiceWithButton.pde\n\
    \n```\nconst unsigned int LED_BIT0 = 12;\nconst unsigned int LED_BIT1 = 11;\n\
