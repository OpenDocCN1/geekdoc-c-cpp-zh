  md: "\n## Alternative Networking Technologies\n\nEthernet is one of the most popular\
    \ and most powerful networking technologies. Using an Ethernet shield, you can\
    \ easily connect your Arduino to the Internet both as a client and as a server.\n\
    \nDepending on your project’s needs, it’s sometimes better to use a wireless connection.\
    \ With a WiFi shield* you can easily turn your Arduino into a wireless networking\
    \ device.\n\nBut often you don’t need the full power of Ethernet, especially if\
    \ you only need short-range communication in a personal area network. You can\
    \ choose from a variety of options, but Bluetooth and ZigBee† are probably the\
    \ most popular. Excellent solutions for both of them are available for the Arduino.\n\
    \nFinally, you can even participate in cellular networks with your Arduino. Plug\
    \ in a GSM shield‡ and your SIM card, and you are ready to go.\n\n\\* WiShield\
    \ (http://www.asynclabs.com/) and WiFly (http://www.sparkfun.com/commerce/product_info.php?products_id=9954)\
    \ are good products.\n\n† http://en.wikipedia.org/wiki/Zigbee\n\n‡ http://www.hwkitchen.com/products/gsm-playground/\n\
    \n- You’ve used an IP address that is not allowed in your network or that is used\
    \ already by another device. Double-check your IP address.\n- You’ve used the\
    \ wrong credentials for accessing a service such as Twitter. Make sure you use\
    \ the right OAuth tokens.\n- Twitter does not allow duplicate tweets. So, whenever\
    \ your application fails to tweet a message, make sure you haven’t tweeted it\
    \ recently.\n- Networks have become very reliable over the last decades, but sometimes\
    \ they are still a bit fragile. So, it might well be that connections fail or\
    \ that you run into timeouts. Increase the delays in your sketches accordingly.\n\
    \n## Chapter 9 Creating Your Own Universal Remote Control\n\nRemote controls add\
