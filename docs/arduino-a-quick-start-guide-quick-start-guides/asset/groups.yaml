    \ SensorData 对象，将当前温度和距离传递给它。\n\nProcessing 是一种面向对象的编程语言，允许我们使用 **class** 关键字定义新类。类具有名称，并且包含数据（通常称为\
    \ *属性* 或 *属性*）和函数（通常称为 *方法*）。我们的 SensorData 类包含两个名为 temperature 和 distance 的属性。它们都是\
    \ **float** 类型，我们都将它们声明为 **private**。现在只有 SensorData 类的成员才允许访问它们。这被认为是一种良好的风格，因为它防止了不必要的副作用，并使未来的更改变得容易得多。类绝不应该暴露其内部结构。\n\
    \n要设置和获取我们的属性的值，我们必须使用公共方法，我们的类有三个：SensorData()、getTemperature() 和 getDistance()。（Java\
    \ 和 C++ 程序员请注意，在 Processing 中，如果未另行指定，一切都是公共的！）一个与类同名的方法称为 *构造函数*，你可以使用它来创建和初始化该特定类的新对象。构造函数没有返回值，但可以指定参数。我们的构造函数例如接受两个参数并用它们初始化我们的两个属性。\n\
    \n不过有一个小问题：我们的方法参数与我们类的属性具有相同的名称。如果我们像这样简单地将方法参数分配给属性会怎样：\n\n```\ntemperature\
    \ = temperature;\ndistance = distance;\n```\n\n没错：我们只是将每个方法参数分配给自身，这实际上是无操作。这就是为什么我们使用\
    \ **this** 关键字。它指的是类本身，因此我们可以区分方法参数和类的属性。或者，我们本可以使用不同的名称作为方法参数或属性，但我更喜欢使用 **this**。\n\
    \n在构造函数之后，我们定义了 getTemperature 和 getDistance 方法。它们的定义非常相似；我们声明方法的返回类型（**float**）、方法名称，以及括号中的参数列表。在我们的例子中，参数列表为空。在方法中，我们使用\
    \ **return** 关键字返回相应属性的当前值。**return** 停止方法并将其参数返回给方法的调用者。\n\n现在我们可以创建和初始化新的 SensorData\
    \ 对象：\n\n```\nSensorData sensorData = new SensorData(31.5, 11.76);\n```\n\n前面的语句创建一个名为\
    \ sensorData 的新 SensorData 对象。它将 temperature 设置为 31.5，将 distance 设置为 11.76。要读取这些值，我们使用相应的“get”方法：\n\
    \n```\nsensorData.getTemperature(); // -> 31.5\nsensorData.getDistance();    //\
    \ -> 11.76\n```\n\n由于 getTemperature() 和 getDistance() 是 SensorData 类的成员，你只能使用该类的实例调用它们。我们的实例名为\
