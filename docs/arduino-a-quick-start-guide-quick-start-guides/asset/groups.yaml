    and then connect the breadboard to the Arduino.


    In Figure 3.4, on the following page, you can see a photo of our final circuit.
    It consists of an Arduino, a breadboard, an LED, three wires, and a 1kΩ resistor
    (more on that part in a few minutes). Connect the Arduino to the breadboard using
    two wires. Connect pin 12 with the ninth column of the breadboard, and connect
    the ground pin with the tenth column. This automatically connects all sockets
    in column 9 to pin 12 and all sockets in column 10 to the ground. This choice
    of columns was arbitrary, and you could have used other columns instead.


    Plug the LED''s negative connector (the shorter one) into column 10 and its positive
    connector into column 9. When you plug in parts or wires into a breadboard, you
    have to press them firmly until they slip in. You'
