    \ (-) 的排连接到 Arduino 的地引脚，那么该排中的所有插座也将作为地引脚工作。然后你可以使用短导线将该排的插座连接到 LED。\n\n除此之外，电路中的其他部分应该都很熟悉，因为我们只是将上一节中的基本\
