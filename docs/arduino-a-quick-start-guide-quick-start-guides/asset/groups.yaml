    \ Tell it to blame me, and it moves an arrow, so it points to “Maik.”\n\nBlaminatrs\
    \ are perfect office toys that you can use in many situations. For software developers,\
    \ it can be a good idea to attach one to your continuous integration (CI) system.\
    \ Continuous integration systems such as CruiseControl.rb³ or Luntbuild⁴ help\
