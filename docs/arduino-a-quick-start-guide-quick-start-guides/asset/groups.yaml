  - '[PAGE 71]


    # More LEDs, Dice, and Cubes


    Building binary dice is fun, and it’s an easy project even for beginners. But
    what about the opposite—reading real dice? Steve Hoefer* has built a dice reader
    using an Arduino, and it’s really impressive. He uses five pairs of infrared emitters
    and receivers to “scan” a die’s surface. It’s a fairly advanced project, and you
    can learn a lot from it.


    Another interesting project is an LED cube: building a cube consisting of LEDs.†
    It’s surprisingly difficult to control more than a few LEDs, but you can produce
    astonishing results.


    This is all the code we need to implement the first version of binary dice. As
    usual, we define some constants for the output pins the LEDs are connected to.
    In the setup() function, we set all the pins into OUTPUT mode. For the dice, we
    need random numbers in the range between one and six. The random() function returns
    random numbers in a specified range using a pseudorandom number generator. In
    line 10, we initialize the generator with some noise we read from analog input
    pin A0 (see the sidebar on the next page to learn why we have to do that). You
    might wonder where the constant A0 is from. Since version 19, the Arduino IDE
    defines constants for all analog pins named A0, A1, and so on.


    Then we actually generate a new random number between one and six and output it
    using the output_result() function. (the seven in the call to random() is correct,
    because it expects the upper limit plus one).


    The function output_result() takes a number and outputs its lower three bits by
    switching on or off our three LEDs accordingly. Here we use the & operator and
    binary literals. The & operator takes two numbers and combines them bitwise. When
    two corresponding bits are 1, the result of the & operator is 1, too. Otherwise,
    it is 0. The B prefix allows you to put binary numbers directly into your source
    code. For example, B11 is the same as 3.


    You might have noticed that the loop() function was left empty, and you might
    wonder how such dice work. It’s pretty simple: whenever you restart the Arduino,
    it outputs a new number, and to roll the dice again, you have to press the reset
    button.'
  - '[PAGE 72]


    # Generating Random Numbers


    Some computing problems are surprisingly difficult, and creating good random numbers
    is one of them. After all, one of the most important properties of a computer
    is deterministic behavior. Still, we often need—at least seemingly—random behavior
    for a variety of purposes, ranging from games to cryptographic algorithms.


    The most popular approach (used in Arduino’s random() function, for example) is
    to create pseudorandom numbers.* They seem to be random, but they actually are
    the result of a formula. Different kinds of algorithms exist, but usually each
    new pseudorandom number is calculated from its predecessors. This implies that
    you need an initialization value to create the first random number of the sequence.
    This initialization value is called a random seed, and to create different sequences
    of pseudorandom numbers, you have to use different random seeds.


    Creating pseudorandom numbers is cheap, but if you know the algorithm and the
    random seed, you can easily predict them. So, you shouldn’t use them for cryptographic
    purposes.


    In the real world, you can find countless random processes, and with the Arduino,
    it’s easy to measure them to create real random numbers. Often it’s sufficient
    to read some random noise from analog pin 0 and pass it as the random seed to
    the randomSeed() function. You can also use this noise to create real random numbers;
    there is even a library for that purpose.†


    If you need strong random numbers, the Arduino is a perfect device for creating
    them. You can find many projects that observe natural processes solely to create
    random numbers. One of them watches an hourglass using the Arduino, for example.‡


    * http://en.wikipedia.org/wiki/Pseudo-random_numbers

    † http://code.google.com/p/tinkerit/wiki/TrueRandom

    ‡ http://www.circuitlake.com/usb-hourglass-sand-timer.html'
  - '[PAGE 73]


    Compile the code, upload it to the Arduino, and play a bit with your binary dice.
    You have mastered your first advanced electronics project! Enjoy it for a moment!


    So, whenever you want to see a new result, you have to reset the Arduino. That''s
    probably the most pragmatic user interface you can build, and for a first prototype,
    this is OK. But often you need more than one button, and it''s also more elegant
    to add your own button anyway. So, that''s what we''ll do in the next section.


    # 3.5 Working with Buttons


    In this section, we''ll add our own pushbutton to our binary dice, so we no longer
    have to abuse the Arduino''s reset button to roll the dice. We''ll start small
    and build a circuit that uses a pushbutton to control a single LED.


    So, what exactly is a pushbutton? Here are three views of a typical pushbutton
    that can be used as the Arduino''s reset button.


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_73_0.png)


    It has four connectors that fit perfectly on a breadboard (at least after you
    have straightened them with a pair of pliers). Two opposite pins connect when
    the button is pushed; otherwise, they are disconnected.


    In Figure 3.8, on the following page, you can see a simple circuit using a pushbutton.
    Connect pin 7 (chosen completely arbitrarily) to the pushbutton, and connect the
    pushbutton via a 10kΩ resistor to ground. Then connect the 5 volts power supply
    to the other pin of the button.


    All in all, this approach seems straightforward, but why do we need a resistor
    again? The problem is that we expect the pushbutton to return a default value
    (LOW) in case it isn''t pressed. But when the button isn''t pressed, it would
    not be directly connected to ground and would flicker because of static and interference.
    A little bit of current flows through the resistor, and this helps prevent random
    noise from changing the voltage that the input pin sees.'
  - "[PAGE 74]\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_74_0.png)\n\n# Figure 3.8:\
    \ A simple pushbutton circuit\n\nWhen the button is pressed, there will still\
    \ be 5 volts at the Arduino's digital pin, but when the button isn't pressed,\
    \ it will cleanly read the connection to ground. We call this a pull-down resistor;\
    \ a pull-up resistor works exactly the other way around. That is, you have to\
    \ connect the Arduino's signal pin to power through the pushbutton and connect\
    \ the other pin of the pushbutton to ground using a resistor.\n\nNow that we've\
    \ eliminated all this ugly unstable real-world behavior, we can return to the\
    \ stable and comforting world of software development. The following program checks\
    \ whether a pushbutton is pressed and lights an LED accordingly:\n\nDownload BinaryDice/SimpleButton/SimpleButton.pde\n\
    \n```\nconst unsigned int BUTTON_PIN = 7;\nconst unsigned int LED_PIN   = 13;\n\
    \nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n\
    }\n\nvoid loop() {\n  const int BUTTON_STATE = digitalRead(BUTTON_PIN);\n\n  if\
    \ (BUTTON_STATE == HIGH)\n    digitalWrite(LED_PIN, HIGH);\n  else\n    digitalWrite(LED_PIN,\
    \ LOW);\n}\n```"
  - "[PAGE 75]\n\nWe connect the button to pin 7 and the LED to pin 13 and initialize\
    \ the pins accordingly in the setup() function. In loop(), we read the current\
    \ state of the pin connected to the button. If it is HIGH, we turn the LED on.\
    \ Otherwise, we turn it off.\n\nUpload the program to the Arduino, and you'll\
    \ see that the LED is on as long as you press the button. As soon as you release\
    \ the button, the LED turns off. This is pretty cool, because now we nearly have\
    \ everything we need to control our dice using our own button. But before we proceed,\
    \ we'll slightly enhance our example and turn the button into a real light switch.\n\
    \nTo build a light switch, we start with the simplest possible solution. Do not\
    \ change the current circuit, and upload the following program to your Arduino:\n\
    \n```\n```\nconst unsigned int BUTTON_PIN = 7;\n\nconst unsigned int LED_PIN \
    \ = 13;\n\nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);\n  pinMode(BUTTON_PIN,\
    \ INPUT);\n}\n\nint led_state = LOW;\n\nvoid loop() {\n  const int CURRENT_BUTTON_STATE\
    \ = digitalRead(BUTTON_PIN);\n  \n  if (CURRENT_BUTTON_STATE == HIGH) {\n    led_state\
    \ = (led_state == LOW) ? HIGH : LOW;\n    digitalWrite(LED_PIN, led_state);\n\
    \  }\n}\n```\n```\n\nWe begin with the usual pin constants, and in setup() we\
    \ set the modes of the pins we use. In line 9, we define a global variable named\
    \ led_state to store the current state of our LED. It will be LOW when the LED\
    \ is on and HIGH otherwise. In loop(), we check the button's current state. When\
    \ we press the button, its state switches to HIGH, and we toggle the content of\
    \ led_state. That is, if led_state was HIGH, we set it to LOW, and vice versa.\
    \ At the end, we set the physical LED's state to our current software state accordingly.\n\
    \nOur solution is really simple, but unfortunately, it does not work. Play around\
    \ with it a bit, and you'll quickly notice some annoying behavior."
