    \ Web 浏览器来实现控制。\n\n此外，你不再需要将 Arduino 连接到计算机的 USB 端口。例如，红外代理只需要 USB 端口来获得电力。将交流电源适配器插入\
    \ Arduino，你就可以摆脱 USB 线了。\n\n这是我们第一次使用 Arduino 来控制真实世界的设备。在下一章中，我们将继续这样做，你将学习如何控制电机。\n\
    \n## 9.7 如果它不工作怎么办？\n\n在本章中，我们主要使用了 LED 和以太网扩展板，因此第 3 章 *构建二进制骰子*（第 63 页）和第 8\
    \ 章 *用 Arduino 联网*（第 170 页）中的所有建议也适用于本章。\n\n此外，你还需要注意更多事项。例如，红外 LED 与其接收器之间的距离非常重要。\n\
    \n"
