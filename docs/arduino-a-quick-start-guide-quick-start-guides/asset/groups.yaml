    We include the Servo library, and in line 8, we define a new Servo object. In
    the setup() function, we initialize the serial port, and we attach() the Servo
    object to the pin we have defined in MOTOR_PIN. After that, we wait for 15 milliseconds
    so the servo motor has enough time to process our command. Then we call write()
    to move back the servo to 1 degree. We could also move it back to 0 degrees, but
    some of the servos I have worked with make some annoying noise in this position.


    The main purpose of the loop() function is to read new degree values from the
    serial port. These values are in a range from 0 to 180, and we read them as ASCII
    values. So, we need a string that can contain up to four characters (remember,
    strings are null-terminated in C). That’s why we declare the degrees string with
    a length of four in line 21.


    Then we wait for new data to arrive at the serial port and read it character by
    character until no more data is available or until we have read enough. We terminate
    the string with a zero byte and print the value we’ve read to the serial port.
    Finally, we convert the string into an integer value using atoi() and pass it
    to the write() method of the Servo object in line 34. Then we wait again for the
    servo to do its job.


    Compile and upload the sketch, and then open the serial monitor. After the servo
    motor has initialized, send some degree values such as 45, 180, or 10. See how
    the motor moves to the angle you have specified. To see the effect a bit better,
    turn a wire or a piece of paper into an arrow, and attach it to the motor’s gear.


    It’s easy to control a servo via the serial port, and the circuit we’ve built
    can be the basis for many useful and fun projects. In the next section, we’ll
