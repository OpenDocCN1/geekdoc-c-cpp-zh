    The code is nearly a perfect merge of the programs we used to get the PING)))
    and the TMP36 sensors working. Only a few things were changed:


    +   - The constant MICROSECONDS_PER_CM has been replaced by the microseconds_per_cm()
    function that determines the microseconds sound needs to travel 1 centimeter dynamically
    depending on the current temperature.

    +   - Because the current temperature will usually not change often or rapidly,
    we no longer measure it permanently but only once a second. We use millis() in
    line 8 to determine the number of milliseconds that have passed since the Arduino
    started. From lines 15 to 19, we check whether more than a second has passed since
    the last measurement. If yes, we measure the current temperature again.

    +   - We no longer transfer the sensor data as floating-point numbers on the serial
    port but use scaled integer values instead. This is done by the scaled_value()
    function that rounds a float value to two decimal digits and converts it into
    a long value by multiplying it by 100. On the receiving side, you have to divide
    it by 100 again.


    If you upload the program to your Arduino and play around with your hand in front
    of the sensor, you''ll see an output similar to the following:


    ```

    1940,2818

    2914,3032

    3045,34156

    3005,2843

    3045,2476

    3085,2414

    ```


    The output is a comma-separated list of values where the first value represents
    the current temperature in degree Celsius, and the second is the distance to the
    nearest object measured in centimeters. Both values have to be divided by 100
    to get the actual sensor data.


    Our little project now has two sensors. One is connected to a digital pin, while
    the other uses an analog one. In the next section, you''ll learn how to transfer
    sensor data back to a PC and use it to create applications based on the current
    state of the real world.'
  - "[PAGE 118]\n\n# How to Encode Sensor Data\n\nEncoding sensor data is a problem\
    \ that has to be solved often in Arduino projects, because all the nice data we\
    \ collect usually has to be interpreted by applications running on regular computers.\n\
    \nWhen defining a data format, you have to take several things into account. For\
    \ example, the format should not waste the Arduino’s precious memory. In our case,\
    \ we could have used XML for encoding the sensor data, for example:\n\n```\n<sensor-data>\n\
    \  <temperature>30.05</temperature>\n  <distance>51.19</distance>\n</sensor-data>\n\
    ```\n\nObviously this is not a good choice, because now we are wasting a multiple\
    \ of the actual data’s memory for creating the file format’s structure. In addition,\
    \ the receiving application has to use an XML parser to interpret the data.\n\n\
    But you shouldn’t go to the other extreme either. That is, you should use binary\
    \ formats only if it’s absolutely necessary or if the receiving application expects\
    \ binary data anyway.\n\nAll in all, the simplest data formats such as character-separated\
    \ values (CSV) are often the best choice.\n\n# 5.5 Transferring Data Back to Your\
