  - "[PAGE 95]\n\nsure you change your original source code files. After you've fixed\
    \ the errors, copy the files to the libraries folder again, and don't forget to\
    \ restart the IDE.\n\nTurning a static string into Morse code is nice, but wouldn't\
    \ it be great if our program could work for arbitrary strings? So, let's add a\
    \ more sophisticated example. This time, we'll write code that reads messages\
    \ from the serial port and feeds them into a Telegraph instance. Create a new\
    \ sketch named MorseCodeGenerator, and enter the following code:\n\n```\n#include\
    \ \"telegraph.h\"\n\nconst unsigned int OUTPUT_PIN = 13;\nconst unsigned int DIT_LENGTH\
    \ = 200;\nconst unsigned int MAX_MESSAGE_LEN = 128;\nconst unsigned int BAUD_RATE\
    \ = 9600;\nconst int LINE_FEED = 13;\n\nchar message_text[MAX_MESSAGE_LEN];\n\
    int index = 0;\n\nTelegraph telegraph(OUTPUT_PIN, DIT_LENGTH);\n\nvoid setup()\
    \ {\n  Serial.begin(BAUD_RATE);\n}\n\nvoid loop() {\n  if (Serial.available()\
    \ > 0) {\n    int current_char = Serial.read();\n    if (current_char == LINE_FEED\
    \ || index == MAX_MESSAGE_LEN - 1) {\n      message_text[index] = 0;\n      index\
    \ = 0;\n      telegraph.send_message(message_text);\n    } else {\n      message_text[index++]\
    \ = current_char;\n    }\n  }\n}\n```\n\nAgain, we include the header file of\
    \ the Telegraph class, and as usual we define some constants: OUTPUT_PIN defines\
    \ the pin our LED is connected to, and DIT_LENGTH contains the length of a dit\
    \ measured in milliseconds. LINE_FEED is set to the ASCII code of the linefeed\
    \ character. We need it to determine the end of the message to be emitted as Morse\
    \ code. Finally, we set MAX_MESSAGE_LEN to the maximum length of the messages\
    \ we are able to send."
  - '[PAGE 96]


    Next we define three global variables: message_text is a character buffer that
    gets filled with the data we receive on the serial port. index keeps track of
    our current position in the buffer, and telegraph is the Telegraph object we’ll
    use to convert a message into “blinkenlights.”³


    setup() initializes the serial port, and in loop() we check whether new data has
    arrived, calling Serial.available(). We read the next byte if new data is available,
    and we check whether it is a linefeed character or whether it is the last byte
    that fits into our character buffer. In both cases, we set the last byte of message_text
    to 0, because strings in C/C++ are null-terminated. We also reset index so we
    can read the next message, and finally we send the message using our telegraph.
    In all other cases, we add the latest byte to the current message text and move
    on.


    You should compile and upload the program now. Open the serial monitor, and choose
    “Carriage return” from the line endings drop-down menu at the bottom of the window.
    With this option set, the serial monitor will automatically append a newline character
    to every line it sends to the Arduino. Enter a message such as your name, click
    the Send button, and see how the Arduino turns it into light.


    Because we’ve encapsulated the whole Morse code logic in the Telegraph class,
    our main program is short and concise. Creating software for embedded devices
    doesn’t mean we can’t benefit from the advantages of object-oriented programming.


    Still, we have some minor things to do to turn our project into a first-class
    library. Read more about it in the next section.


    # 4.7 Final Touches


    One of the nice features of the Arduino IDE is its syntax coloring. Class names,
    function names, variables, and so on, all have different colors in the editor.
    This makes it much easier to read source code, and it’s possible to add syntax
    coloring for libraries. You only have to add a file named keywords.txt to your
    project:


    ```

    Download Telegraph/keywords.txt


    # Syntax-coloring for the telegraph library


    Telegraph    KEYWORD1

    send_message KEYWORD2

    ```'
  - '[PAGE 97]


    Lines starting with a # character contain comments and will be ignored. The remaining
    lines contain the name of one of the library''s members and the member''s type.
    Separate them with a tab character. Classes have the type KEYWORD1, while functions
    have the type KEYWORD2. For constants, use LITERAL1.


    To enable syntax coloring for the telegraph library, copy keywords.txt to the
    libraries folder, and restart the IDE. Now the name of the Telegraph class will
    be orange, and send_message() will be colored brown.


    Before you finally publish your library, you should add a few more things:


    +   - Store all example sketches in a folder named examples, and copy it to the
    libraries folder. Every example sketch should get its own subdirectory within
    that folder.

    +   - Choose a license for your project, and copy its terms into a file named
    LICENSE.⁴ You might think this is a bit over the top for many libraries, but it
    will give your potential audience confidence.

    +   - Add installation instructions and documentation. Usually, users expect to
    find documentation in a file named README, and they will look for installation
    instructions in a file named INSTALL. You should try to install your library on
    as many operating systems as possible and provide installation instructions for
    all of them.


    After you''ve done all this, your library folder should look like Figure 4.2,
    on the following page.


    Finally, create a ZIP archive containing all the files in your project. On most
    operating systems, it''s sufficient to right-click the directory in the Explorer,
    Finder, or whatever you are using and turn the directory into a ZIP archive. On
    Linux systems and on a Mac, you can also use one of the following command-line
    statements to create an archive:


    ```

    mai k> zip -r Telegraph Telegraph

    mai k> tar cfvz Telegraph.tar.gz Telegraph

    ```


    The first command creates a file named Telegraph.zip, and the second one creates
    Telegraph.tar.gz. Both formats are widespread, and it''s best to offer them both
    for download.


    4. At http://www.opensource.org/, you can find a lot of background information
    and many standard licenses.'
