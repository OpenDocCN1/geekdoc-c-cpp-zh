    # 2.2 Managing Projects and Sketches


    Modern software developers can choose from a variety of development tools that
    automate repetitive and boring tasks. That''s also true for embedded systems like
    the Arduino. You can use integrated development environments (IDEs) to manage
    your programs, too. The most popular one has been created by the Arduino team.


    The Arduino IDE manages all files belonging to your project. It also provides
    convenient access to all the tools you need to create the binaries that will run
    on your Arduino board. Conveniently, it does so unobtrusively. For example, you
    might have noticed that the Arduino IDE stores all code you enter automatically.
    This is to prevent beginners from losing data or code accidentally (not to mention
    that even the pros lose data from time to time, too).


    Organizing all the files belonging to a project automatically is one of the most
    important features of an IDE. Under the hood, the Arduino IDE creates a directory
    for every new project, and it stores all the files belonging to the project in
    this directory. To add new files to a project, click the tabs button on the right
    to open the tabs pop-up menu, and then choose New Tab (see Figure 2.1). To add
    an existing file, use the Sketch > Add File menu item.


    As you might have guessed already from the names of the menu items, the Arduino
    IDE calls projects sketches. If you do not choose a name, it gives them a name
    starting with sketch_. You can change the name whenever you like using the Save
    As command. If you do not save a sketch explicitly, the IDE stores it in a predefined
    folder you can look


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_46_0.png)


    Figure 2.1: The tabs menu in action'
  - '[PAGE 47]


    up in the preferences menu. You can change this behavior so that the IDE asks
    you for a name when you create a new sketch. Whenever you get lost, you can check
    what folder the current sketch is in using the Sketch > Show Sketch Folder menu
    item.


    The IDE uses directories not only to organize projects. It also stores some interesting
    things in the following folders:


    +   - The examples folder contains sample sketches that you can use as a basis
    for your own experiments. Get to them via the File > Open dialog box. Take some
    time to browse through them, even if you do not understand anything you see right
    now.

    +   - The libraries directory contains libraries for various purposes and devices.
    Whenever you use a new sensor, for example, chances are good that you have to
    copy a supporting library to this folder.


    The Arduino IDE makes your life easier by choosing reasonable defaults for a lot
    of settings. But it also allows you to change most of these settings, and you''ll
    see how in the next section.


    # 2.3 Changing Preferences


    For your early projects, the IDE''s defaults might be appropriate, but sooner
    or later you''ll want to change some things. As you can see in Figure 2.2, on
    the following page, the IDE lets you change only a few preferences directly. But
    the dialog box refers to a file named preferences.txt containing more preferences.
    This file is a Java properties file consisting of key/value pairs. Here you see
    a few of them:


    ```

    ...

    editor.external.bgcolor=#168299

    preproc.web_colors=true

    editor.font.macosx=Monaco,plain,10

    sketchbook.auto_clean=true

    update.check=true

    build.verbose=true

    upload.verbose=true

    ...

    ```


    Most of these properties control the user interface; that is, they change fonts,
    colors, and so on. But they can also change the application''s behavior. For example,
    you can enable more verbose output for operations such as compiling or uploading
    a sketch. Edit preferences.txt, and set both build.verbose and upload.verbose
    to true. Then load the blinking LED sketch from Chapter 1, Welcome to the Arduino,
    on page 23 and'
