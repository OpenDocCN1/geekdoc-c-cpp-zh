  - '[PAGE 182]


    First, we include the Ethernet library and define a constant for the DAYTIME service
    port (we also have to include the SPI library, because the Ethernet library depends
    on it). Then we define three byte arrays:


    +   - mac contains the MAC address we are going to use for the Ethernet shield.
    A MAC address is a 48-bit number that uniquely identifies a network device.¹¹
    Usually, the manufacturer sets this identifier, but for the Ethernet shield, we
    have to set it ourselves; we use an arbitrary number.


    Important note: the MAC address has to be unique on your network. If you connect
    more than one Arduino, make sure they all have different MAC addresses!


    +   - Whenever you connect your PC to the Internet, it probably gets a new IP
    address via the Dynamic Host Configuration Protocol (DHCP).¹² For most Arduino
    applications, a DHCP implementation is comparatively costly, so you usually assign
    an IP address manually. In most cases, this will be a local address in the 192.168.x.y
    range; we store this address in the my_ip array.


    +   - To turn domain names such as time.nist.gov into an IP address, you need
    access to the Domain Name System (DNS). The Arduino’s standard library doesn’t
    support DNS, so we have to find out the IP address ourselves. We assign it to
    time_server. The telnet command already turned the DAYTIME service domain name
    into an IP address for us. Alternatively, you can use one of the following commands
    to determine a domain name’s IP address:


    ```

    maik> host time.nist.gov

    time.nist.gov has address 192.43.244.18

    maik> dig +short time.nist.gov

    192.43.244.18

    maik> resolveip time.nist.gov

    IP address of time.nist.gov is 192.43.244.18

    maik> ping -c 1 time.nist.gov

    PING time.nist.gov (192.43.244.18): 56 data bytes

    64 bytes from 192.43.244.18: icmp_seq=0 ttl=48 time=173.598 ms


    --- time.nist.gov ping statistics ---

    1 packets transmitted, 1 packets received, 0.0% packet loss

    round-trip min/avg/max/stddev = 173.598/173.598/173.598/0.000 ms

    ```


    11. http://en.wikipedia.org/wiki/Mac_address

    12. http://en.wikipedia.org/wiki/Dynamic_Host_Configuration_Protocol


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_182_0.png)'
  - "[PAGE 183]\n\nIn line 11, we create a new Client object. This class is part of\
    \ the Ethernet library and allows us to create network clients that connect to\
    \ a certain IP address and port.\n\nNow we have to initialize the Ethernet shield\
    \ itself; we do this in line 14 in the setup() function. We have to invoke Ethernet.begin(),\
    \ passing it our MAC and IP addresses. Then we initialize the serial port so that\
    \ we can output some debug messages. At this point, we've initialized all the\
    \ components we need, so we can finally connect to the DAYTIME server and read\
    \ its output.\n\nPlease note that you can also pass the IP address of your network\
    \ gateway and your subnet mask to Ethernet.begin(). This is necessary if you do\
    \ not connect the Arduino directly to the Internet but use a router or a cable\
    \ modem instead. In this case, you can pass the gateway address as follows:\n\n\
    ```\n// ...\nbyte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\nbyte my_ip[]\
    \ = { 192, 168, 2, 120 };\nbyte time_server[] = { 192, 43, 244, 18 }; // time.nist.gov\n\
    // Insert IP address of your cable or DSL router below:\nbyte gateway[] = { 192,\
    \ 168, 13, 254 };\n\nClient client(time_server, DAYTIME_PORT);\n\nvoid setup()\
    \ {\n  Ethernet.begin(mac, my_ip, gateway);\n  Serial.begin(BAUD_RATE);\n}\n//\
    \ ...\n```\n\nThe loop() function of our sketch starts with a short delay, allowing\
    \ all components to initialize properly. This is necessary because the Ethernet\
    \ shield is an autonomous device that is capable of working in parallel to the\
    \ Arduino. In line 22, we try to connect to the DAYTIME service. If the connection\
    \ cannot be established, we print an error message. Otherwise, we wait for half\
    \ a second to give the service some preparation time, and then we read and print\
    \ its output character by character.\n\nNote that the client's interface is similar\
    \ to the interface of the Serial class. With available(), we can check whether\
    \ some bytes are still available, and read() returns the next byte. At the end,\
    \ we call stop() to disconnect from the service and then we start again.\n\nCompile\
    \ and upload the program to the Arduino. Then open the serial monitor, and you\
    \ should see something like this:"
  - "[PAGE 184]\n\n# More Fun with Networking Arduinos\n\nWearables and e-textiles\
    \ are getting more and more popular, and they’re still a good way to impress your\
    \ colleagues and friends. Different types of interactive T-shirts are available\
    \ in every well-assorted geek shop. Some of them show the current WiFi strength,\
    \ while others come with a full-blown equalizer that analyzes ambient noise.\n\
    \nWith an Arduino Lilypad,* a Bluetooth dongle, and an Android phone, you can\
    \ build a T-shirt that displays the current number of unread emails in your inbox.†\n\
    \nNot only can you show the number of unread email messages on your T-shirt, you\
    \ can also show your current mood using a pointer device on your desk—at least\
    \ as long as you announce it in an IRC channel that you monitor with an Arduino.‡\n\
    \nAlthough not built with Arduinos, the Luminet project§ is very impressive. It\
    \ is a network of interconnected intelligent LED pixels, and the Luminet team\
    \ used it to build a really cool interactive jacket.\n\n+   *.\thttp://arduino.cc/en/Main/ArduinoBoardLilyPad\n\
    +   †.\thttp://blog.makezine.com/archive/2010/03/email-counting_t-shirt.html\n\
    +   ‡.\thttp://blog.makezine.com/archive/2010/01/arduino_powered_mood_meter.html\n\
    +   §.\thttp://luminet.cc\n\n```\nConnecting...connected.\n\n55480 10-10-11 13:32:23\
    \ 28 0 0 579.9 UTC(NIST) *\nDisconnecting.\nConnecting...connected.\n\n55480 10-10-11\
    \ 13:32:26 28 0 0 34.5 UTC(NIST) *\nDisconnecting.\n```\n\nWe’re done! Our Arduino\
    \ is directly connected to the Internet, and it even does something useful: we’ve\
    \ turned it into a very accurate clock.\n\nAll in all, networking with an Arduino\
    \ doesn’t differ much from networking with a PC, if you use the Ethernet shield.\
    \ In the next section, you’ll learn how to send emails with an Arduino."
  - '[PAGE 185]


    # Useful Networking Libraries


    The Ethernet library that comes with the Arduino IDE is fairly limited and not
    very convenient. For example, it doesn’t support DNS or DHCP. So for advanced
    projects, you should have a look at the Arduino Ethernet library.


    If you want to turn your Arduino into a web server, you should take a look at
    the Webduino library. It has some great features, and it is quite mature.


    But be warned: all these libraries consume quite a lot of memory, so there’s not
    much left for your application code. Also, they are rather fragile, because they
    often rely upon the innards of the official Ethernet library that change from
    time to time. So, it might well be that they do not work with the latest Arduino
    IDE.


    # 8.6 Emailing from the Command Line


    Now that we know how to access network services, we’ll continue to build a more
    advanced project: an automatic burglar alarm. In case someone is moving in our
    living room, we want to get an email, so we have to learn how to send emails from
    an Arduino.


    Although email is an important service, only a few people know how it actually
    works behind the scenes. To send emails from an Arduino, we could choose the easy
    path and use a PC as an email relay as we did in Section 8.4, Tweeting Messages
    with Processing, on page 175 to tweet messages. As real hackers, we’ll follow
    a more sophisticated path and implement a subset of the Simple Mail Transfer Protocol
    (SMTP).


    SMTP is a typical Internet protocol. It uses only text, and it is mainly line-based;
    that is, you exchange information line by line. A typical email consists of only
    a few attributes: a sender, a receiver, a subject, and a message body. To transmit
    an email, you have to send a request to an SMTP server. The request has to adhere
    to the SMTP specification.'
