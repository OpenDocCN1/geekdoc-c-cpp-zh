  - "[PAGE 263]\n\nIsn't that code beautiful? With about 20 lines of Python code,\
    \ you get full control over your Arduino sketch. So, Python is another excellent\
    \ choice for writing Arduino clients.\n\n# Perl\n\nPerl is still one of the most\
    \ widely used dynamic programming languages, and it has good support for serial\
    \ communication. Some distributions come with libraries for programming the serial\
    \ port, but usually you have to install a module first.\n\nWindows users should\
    \ have a look at Win32::SerialPort.5 For the rest, Device::SerialPort is a good\
    \ choice. You can install it as follows:\n\n```\nmaik> perl -MCPAN -e 'install\
    \ Device::SerialPort'\n```\n\nThen use it like this:\n\n```\nuse strict;\nuse\
    \ warnings;\nuse Device::SerialPort;\n\nif ($#ARGV != 0) {\n  die \"You have to\
    \ pass the name of a serial port.\";\n}\n\nmy $serial_port = $ARGV[0];\nmy $arduino\
    \ = Device::SerialPort->new($serial_port);\n$arduino->baudrate(9600);\n$arduino->databits(8);\n\
    $arduino->parity(\"none\");\n$arduino->stopbits(1);\n$arduino->read_const_time(1);\n\
    $arduino->read_char_time(1);\n\nsleep(2);\nwhile (1) {\n  $arduino->write(\"a0\\\
    n\");\n  my ($count, $line) = $arduino->read(255);\n  print $line;\n}\n```\n\n\
    We check whether the name of a serial port was passed on the command line. Then\
    \ we create a new Device::SerialPort instance in line 10. We configure all serial\
    \ port parameters, and in line 15, we set a timeout\n\n5. http://search.cpan.org/dist/Win32-SerialPort/"
