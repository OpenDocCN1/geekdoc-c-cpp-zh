  - '[PAGE 221]


    # Control Everything


    All the projects in this chapter are based on devices you can control already
    using an infrared remote control. But you can also add an infrared receiver to
    existing devices or build completely new gadgets that come with an infrared receiver.


    In principle, you could control your refrigerator or your microwave oven with
    a remote control. But have you ever thought about a remote-controlled lawn mower?*
    I bet not.


    * http://www.instructables.com/id/Arduino-RC-Lawnmower/


    To be on the safe side, you should position the LED near the receiver. It should
    also be placed right in front of the receiver, and you should make sure that there’s
    not too much ambient light that might disturb the infrared signal.


    For debugging purposes, it’s useful to replace invisible infrared LED with a regular
    LED from time to time. This way, you can see whether your circuit works in principle.


    If you’re trying to control a Mac, you should unpair any other remote controls
    in the security area of the Mac’s system preferences menu.


    Finally, you might be using a device that uses a protocol that is not supported
    by the IRremote library. In this case, you have to add it. This can be tricky,
    but IRremote is open source, so at least it’s possible.


    # 9.8 Exercises


    +   - Build an emulator for a remote control you find in your household. Make
    its commands available via serial port and via Ethernet.

    +   - Instead of controlling the Arduino via a serial monitor or web browser,
    control it using a Nintendo Nunchuk. For example, you could move the analog stick
    up and down to control your TV set’s volume, and you could move it left or right
    to change the channels.

    +   - Design a real universal remote control based on an Arduino. Look for a touch
    screen, a button pad, an SD card shield, and a Bluetooth module. I bet you didn’t
    think you could build a device like this—but you know everything you need to do
    it now.'
  - '[PAGE 222]


    # Chapter 10


    # Controlling Motors with Arduino


    So far, we’ve created projects that have had an impact on the real world. We’ve
    made LEDs shine, and we’ve controlled devices using infrared light. In this chapter,
    we’ll create an even more intense experience: we’ll control motors that will actually
    move things. We won’t go so far as to build a full-blown autonomous robot, but
    we’ll create a small device that does something useful and funny.


    First, though, you’ll learn a bit about the basics of different motor types and
    their pros and cons. Today you can choose from a variety of motor types for your
    projects, and this chapter starts with a brief description of their differences.


    We’ll concentrate on servo motors, because you can use them for a wide range of
    projects and they’re cheap and easy to use. You’ll learn to use the Arduino servo
    library and to control a servo using the serial port.


    Based on these first steps, we’ll then build a more sophisticated project. It’s
    a blaming device that uses nearly the same hardware as the first project in the
    chapter but more elaborate software. You’ll probably find many applications for
    it in your office!


    # 10.1 What You Need


    +   1. A servo motor such as the Hitec HS-322HD

    +   2. Some wires

    +   3. A TMP36 temperature sensor (it’s optional, and you need it only for the
    exercises)

    +   4. An Arduino board such as the Uno, Duemilanove, or Diecimila

    +   5. A USB cable to connect the Arduino to your computer'
