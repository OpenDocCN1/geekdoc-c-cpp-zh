    (275 pages) ISBN: 9781934356586. $34.95\nhttp://pragprog.com/titles/jrap\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_279_0.png)\n\
    \n### Driving Technical Change\n\n同事对新技术的抵制令人费解。学习解读用户“抵制模式”——然后拆解他们的反对意见。每一位开发者都必须掌握传教的艺术。通过这些技巧和策略，你将帮助你的组织采纳你的解决方案——无需向组织政治出卖灵魂。\n\
    \n**Driving Technical Change: Why People On Your Team Don’t Act On Good Ideas,\
    \ and How to Convince Them They Should**\nTerrence Ryan\n(200 pages) ISBN: 978-1934356-60-9.\
    \ $32.95\nhttp://pragprog.com/titles/trevan\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_279_1.png)\n\
    \n## More On Languages\n\n### Seven Languages in Seven Weeks\n\n在这本书中，你将亲身体验 Clojure、Haskell、Io、Prolog、Scala、Erlang\
    \ 和 Ruby。无论你最喜欢的语言是否在该列表中，通过并排检查这些语言，你都将拓宽编程视野。你将从每种语言中学习到新东西，最重要的是，你将学会如何快速学习一门语言。\n\
    \n**Seven Languages in Seven Weeks: A Pragmatic Guide to Learning Programming\
    \ Languages**\nBruce A. Tate\n(300 pages) ISBN: 978-1934356-59-3. $34.95\nhttp://pragprog.com/titles/btlang\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_280_0.png)\n\n### Language Implementation\
    \ Patterns\n\n学习构建配置文件读取器、数据读取器、模型驱动代码生成器、源到源转换器、源分析器和解释器。你不需要计算机科学背景——ANTLR 创建者\
    \ Terence Parr 通过将其分解为最常见的设计模式来阐明语言实现。逐个模式，你将学习实现自己的计算机语言所需的关键技能。\n\n**Language\
    \ Implementation Patterns: Create Your Own Domain-Specific and General Programming\
    \ Languages**\nTerence Parr\n(350 pages) ISBN: 978-1934356-45-6. $34.95\nhttp://pragprog.com/titles/tpdsl\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_280_1.png)\n\n## Apple iOS & Mac\n\n\
    ### Beginning Mac Programming\n\n面向没有编程经验的初学者开发者。带你通过具体、可运行的示例，给予你核心概念和开发原则的上下文，以便你准备好构建一直以来想象的应用。它以清晰易懂的课程向你介绍\
    \ Objective-C 和 Cocoa 框架，并演示如何将它们结合使用来为 Mac 以及 iPhone 和 iPod 编写程序。\n\n**Beginning\
    \ Mac Programming: Develop with Objective-C and Cocoa**\nTim Isted\n(300 pages)\
    \ ISBN: 978-1934356-51-7. $34.95\nhttp://pragprog.com/titles/fibmac\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_281_0.png)\n\
    \n### iPad Programming\n\n它不是 iPhone，也不是笔记本电脑：iPad 是一款开创性的新设备。你需要创建真正的 iPad 应用来利用\
    \ iPad 的所有可能性。如果你是有经验的 iPhone 开发者，*iPad Programming* 将向你展示如何编写这些出色的新应用，同时完全符合用户对该设备的期望。\n\
    \n**iPad Programming: A Quick-Start Guide for iPhone Developers**\nDaniel H Steinberg\
    \ and Eric T Freeman\n(250 pages) ISBN: 978-19343565-7-9. $34.95\nhttp://pragprog.com/titles/sfipad\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_281_1.png)\n\n## Ruby & Rails\n\n###\
    \ Programming Ruby 1.9 (The Pickaxe for 1.9)\n\nPickaxe 书，以封面上的工具命名，是该语言的权威参考。\n\
