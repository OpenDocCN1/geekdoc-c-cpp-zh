    # Chapter 8


    # Networking with Arduino


    With a stand-alone Arduino, you can create countless fun and useful projects.
    But as soon as you turn the Arduino into a networking device, you open up a whole
    new world of possibilities.


    You now have access to all information on the Internet, so you could turn your
    Arduino into a nice geeky weather station simply by reading data from a weather
    service. You can also turn the Arduino into a web server that provides sensor
    data for other devices or computers on your network.


    We will build an emailing burglar alarm in this chapter. It detects motion in
    your living room, and the Arduino will send you an email whenever it detects movement
    during your absence. Because this is a somewhat advanced project, we''ll first
    work on some smaller projects to learn all techniques and skills needed.


    We''ll start with a "naked" Arduino that doesn''t have any network capabilities.
    You can still attach it to the Internet, as long as you connect it to a PC.


    For our second project, we''ll improve the situation dramatically with an Ethernet
    shield. Now your Arduino becomes a full-blown network device that can directly
    access IP services such as a DAYTIME service. This will turn your Arduino into
    a very accurate clock.


    Once we are able to access IP services, we''ll then learn how to send emails directly
    from an Arduino with an Ethernet shield. For our burglar alarm, we then only need
    to know how to detect motion. We''ll use a passive infrared sensor (PIR) for this
    purpose, so in this chapter, you''ll'
