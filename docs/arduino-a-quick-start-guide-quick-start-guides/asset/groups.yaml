  md: "\n![](img/dcfd13a1bf99c4d3f9996627012a6526_132_0.png)\n\nFigure 6.1: All the\
    \ parts you need in this chapter\n\n## 6.1 What You Need\n\n- 1. A half-size breadboard\
    \ or—even better—an Arduino Prototyping shield with a tiny breadboard\n- 2. An\
    \ ADXL335 accelerometer\n- 3. A pushbutton\n- 4. A 10kΩ resistor\n- 5. Some wires\n\
    - 6. An Arduino board such as the Uno, Duemilanove, or Diecimila\n- 7. A USB cable\
    \ to connect the Arduino to your computer\n- 8. A 6 pin 0.1\" standard header\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_133_0.png)\n\nFigure 6.2: An ADXL335\
    \ sensor on a breakout board\n\n## 6.2 Wiring Up the Accelerometer\n\nThere are\
    \ many different accelerometers, differing mainly in the number of spacial axes\
    \ they support (usually two or three). We use the ADXL335 from Analog Devices—it’s\
    \ easy to use and widely available.¹\n\nIn this section, we’ll connect the ADXL335\
    \ to the Arduino and create a small demo program showing the raw data the sensor\
    \ delivers. At that point, we will have a quick look at the sensor’s specification\
    \ and interpret the data.\n\nIn Figure 6.2, you see a breakout board containing\
    \ an ADXL335 sensor on the right. The sensor is the small black integrated circuit\
    \ (IC), and the rest is just a carrier to allow connections. On the top, you see\
    \ a 6 pin 0.1\" standard header. The sensor has six connectors labeled GND, Z,\
    \ Y, X, 3V, and TEST. To use the sensor on a breadboard, solder the standard header\
    \ to the connectors. This not only makes it easier to attach the sensor to a breadboard\
    \ but also stabilizes the sensor, so it\n\n1. http://www.analog.com/en/sensors/inertial-sensors/adxl335/products/product.html\n\
    \ndoes not move accidentally. You can see the result on the left side of the photo\
    \ (note that the breakout board on the left is not the same as on the right, but\
    \ it's very similar). Don't worry if you've never soldered before. In Section\
    \ A.2, Learning How to Solder, on page 241, you can learn how to do it.\n\nYou\
    \ can ignore the connector labeled TEST, and the meaning of the remaining connectors\
    \ should be obvious. To power the sensor, connect GND to the Arduino's ground\
    \ pin and 3V to the Arduino's 3.3 volts power supply. X, Y, and Z will then deliver\
    \ acceleration data for the x-, y-, and z-axes.\n\nLike the TMP36 temperature\
    \ sensor we used in Section 5.4, Increasing Precision Using a Temperature Sensor,\
    \ on page 113, the ADXL335 is an analog device: it delivers results as voltages\
    \ that have to be converted into acceleration values. So, the X, Y, and Z connectors\
    \ have to be connected to three analog pins on the Arduino. We connect Z to analog\
    \ pin 0, Y to analog pin 1, and X to analog pin 2 (see Figure 6.3, on the following\
    \ page, and double-check the pin labels on the breakout board you're using!).\n\
    \nNow that we've connected the ADXL335 to the Arduino, let's use it.\n\n## 6.3\
    \ Bringing Your Accelerometer to Life\n\nA pragmatic strategy to get familiar\
    \ with a new device is to hook it up and see what data it delivers. The following\
    \ program reads input values for all three axes and outputs them to the serial\
    \ port:\n\n```\nconst unsigned int X_AXIS_PIN = 2;\nconst unsigned int Y_AXIS_PIN\
    \ = 1;\nconst unsigned int Z_AXIS_PIN = 0;\nconst unsigned int BAUD_RATE = 9600;\n\
    \nvoid setup() {\n  Serial.begin(BAUD_RATE);\n}\n\nvoid loop() {\n  Serial.print(analogRead(X_AXIS_PIN));\n\
    \  Serial.print(\" \");\n  Serial.print(analogRead(Y_AXIS_PIN));\n  Serial.print(\"\
    \ \");\n  Serial.println(analogRead(Z_AXIS_PIN));\n  delay(100);\n}\n```\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_135_0.png)\n\
    \nFigure 6.3: How to connect an ADXL335 sensor to an Arduino\n\nOur test program\
    \ is as simple as it can be. We define constants for the three analog pins and\
    \ initialize the serial port in the setup() function. Note that we did not set\
    \ the analog pins to INPUT explicitly, because that's the default anyway.\n\n\
    In the loop() function, we constantly output the values we read from the analog\
    \ pins to the serial port. Open the serial monitor, and move the sensor around\
    \ a bit—tilt it around the different axes. You should see an output similar to\
    \ the following:\n\n```\n344 331 390\n364 276 352\n388 286 287\n398 314 286\n\
    376 332 289\n370 336 301\n379 338 281\n```\n\nThese values represent the data\
    \ we get for the x-, y-, and z-axes. When you move the sensor only around the\
    \ x-axis, for example, you can see that the first value changes accordingly. In\
    \ the next section, we'll take a closer look at these values.\n\n## 6.4 Finding\
    \ and Polishing Edge Values\n\nThe physical world often is far from being perfect.\
    \ That's especially true for the data many sensors emit, and accelerometers are\
    \ no exception. They slightly vary in the minimum and maximum values they generate,\
    \ and they often jitter a bit. They might change their output values even though\
    \ you haven't moved them, or they might not change their output values correctly.\
    \ In this section, we'll determine the sensor's minimum and maximum values, and\
    \ we'll flatten the jitter.\n\nFinding the edge values of the sensor is easy,\
    \ but it cannot be easily automated. You have to constantly read the sensor's\
    \ output while moving it. Here's a program that does the job:\n\n```\nDownload\
    \ MotionSensor/SensorValues/SensorValues.pde\nconst unsigned int X_AXIS_PIN =\
    \ 2;\nconst unsigned int Y_AXIS_PIN = 1;\nconst unsigned int Z_AXIS_PIN = 0;\n\
    const unsigned int BAUD_RATE = 9600;\n\nint min_x, min_y, min_z;\nint max_x, max_y,\
    \ max_z;\n\nvoid setup() {\n  Serial.begin(BAUD_RATE);\n  min_x = min_y = min_z\
    \ = 1000;\n  max_x = max_y = max_z = -1000;\n}\n\nvoid loop() {\n  const int x\
    \ = analogRead(X_AXIS_PIN);\n  const int y = analogRead(Y_AXIS_PIN);\n  const\
    \ int z = analogRead(Z_AXIS_PIN);\n\n  min_x = min(x, min_x); max_x = max(x, max_x);\n\
    \  min_y = min(y, min_y); max_y = max(y, max_y);\n  min_z = min(z, min_z); max_z\
    \ = max(z, max_z);\n\n  Serial.print(\"x(\");\n  Serial.print(min_x);\n  Serial.print(\"\
    /\");\n  Serial.print(max_x);\n  Serial.print(\", y(\");\n  Serial.print(min_y);\n\
    \  Serial.print(\"/\");\n  Serial.print(max_y);\n  Serial.print(\", z(\");\n \
    \ Serial.print(min_z);\n  Serial.print(\"/\");\n  Serial.print(max_z);\n  Serial.println(\"\
    )\");\n}\n```\n\nWe declare variables for the minimum and maximum values of all\
    \ three axes, and we initialize them with numbers that are definitely out of the\
    \ sensor’s range (-1000 and 1000). In the loop() function, we permanently measure\
    \ the acceleration of all three axes and adjust the minimum and maximum values\
    \ accordingly.\n\nCompile and upload the sketch, then move the breadboard with\
    \ the sensor in all directions, and then tilt it around all axes. Move it slowly,\
    \ move it fast, tilt it slowly, and tilt it fast. Use long wires, and be careful\
    \ when moving and rotating the breadboard so you do not accidentally loosen a\
    \ connection.\n\nAfter a short while the minimum and maximum values will stabilize,\
    \ and you should get output like this:\n\n```\nx(247/649), y(253/647), z(278/658)\n\
    ```\n\nWrite down these values, because we need them later, and you'll probably\
    \ need them when you do your own sensor experiments.\n\nNow let's see how to get\
    \ rid of the jitter. In principle, it is simple. Instead of returning the acceleration\
    \ data immediately, we collect the last readings and return their average. This\
    \ way, small changes will be ironed out. The code looks as follows:\n\n```\nDownload:\
    \ MotionSensor/Buffering/Buffering.pde\nLine 1 const unsigned int X_AXIS_PIN =\
    \ 2;\nconst unsigned int Y_AXIS_PIN = 1;\nconst unsigned int Z_AXIS_PIN = 0;\n\
    const unsigned int NUM_AXES = 3;\n5 const unsigned int PINS[NUM_AXES] = {\n  X_AXIS_PIN,\
    \ Y_AXIS_PIN, Z_AXIS_PIN\n};\nconst unsigned int BUFFER_SIZE = 16;\nconst unsigned\
    \ int BAUD_RATE = 9600;\n10 int buffer[NUM_AXES][BUFFER_SIZE];\nint buffer_pos[NUM_AXES]\
    \ = { 0 };\n```\n\n```\nvoid setup() {\n    Serial.begin(BAUD_RATE);\n}\n\nint\
    \ get_axis(const int axis) {\n    delay(1);\n    buffer[axis][buffer_pos[axis]]\
    \ = analogRead(PINS[axis]);\n    buffer_pos[axis] = (buffer_pos[axis] + 1) % BUFFER_SIZE;\n\
    \n    long sum = 0;\n    for (int i = 0; i < BUFFER_SIZE; i++)\n        sum +=\
    \ buffer[axis][i];\n    return round(sum / BUFFER_SIZE);\n}\n\nint get_x() { return\
    \ get_axis(0); }\nint get_y() { return get_axis(1); }\nint get_z() { return get_axis(2);\
    \ }\n\nvoid loop() {\n    Serial.print(get_x());\n    Serial.print(\" \");\n \
    \   Serial.print(get_y());\n    Serial.print(\" \");\n    Serial.println(get_z());\n\
    }\n```\n\nAs usual, we define some constants for the pins we use first. This time,\
    \ we also define a constant named NUM_AXES that contains the amount of axes we\
    \ are measuring. We also have an array named PINS that contains a list of the\
    \ pins we use. This helps us keep our code more generic later.\n\nIn line 11,\
    \ we declare buffers for all axes. They will be filled with the sensor data we\
    \ measure, so we can calculate average values when we need them. We have to store\
    \ our current position in each buffer, so in line 12, we define an array of buffer\
    \ positions.\n\nsetup() only initializes the serial port, and the real action\
    \ takes place in the get_axis() function. It starts with a small delay to give\
    \ the Arduino some time to switch between analog pins; otherwise, you might get\
    \ bad data. Then it reads the acceleration for the axis we have passed and stores\
    \ it at the current buffer position belonging to the axis. It increases the buffer\
    \ position and sets it back to zero when the end of the buffer has been reached.\
    \ Finally, we return the average value of the data we have gathered so far for\
    \ the current axis.\n"
  mdcn: "\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_132_0.png)\n\nFigure 6.1: 本章所需的所有部件\n\
    \n## 6.1 What You Need\n\n- 1. 一个半尺寸面包板，或——更好的是——带有一个小型面包板的 Arduino 原型盾\n- 2.\
    \ 一个 ADXL335 加速度计\n- 3. 一个按钮\n- 4. 一个 10kΩ 电阻\n- 5. 一些导线\n- 6. 一个 Arduino 板，例如\
    \ Uno、Duemilanove 或 Diecimila\n- 7. 一根用于连接 Arduino 到计算机的 USB 数据线\n- 8. 一个 6 针\
    \ 0.1\" 标准排针\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_133_0.png)\n\nFigure\
    \ 6.2: 一个安装在转接板上的 ADXL335 传感器\n\n## 6.2 Wiring Up the Accelerometer\n\n加速度计有很多种，主要区别在于它们支持的空间轴数量（通常为两个或三个）。我们使用的是\
    \ Analog Devices 的 ADXL335——它使用简单且广泛可用。¹\n\n在本节中，我们将 ADXL335 连接到 Arduino 并创建一个小型演示程序，显示传感器提供的数据。在此之后，我们将快速查看传感器的规格并解释数据。\n\
    \n在 Figure 6.2 中，你可以看到右侧包含一个 ADXL335 传感器的转接板。传感器是那个小黑色的集成电路（IC），其余部分只是一个载体，用于允许连接。在顶部，你可以看到一个\
    \ 6 针 0.1\" 标准排针。传感器有六个标记为 GND、Z、Y、X、3V 和 TEST 的连接器。要在面包板上使用传感器，请将标准排针焊接到连接器上。这不仅使将传感器连接到面包板变得更容易，而且还能稳定传感器，使其不会意外移动。你可以在照片左侧看到结果（请注意，左侧的转接板与右侧的不同，但非常相似）。如果你从未焊接过也不用担心。在第\
    \ A.2 节，学习如何焊接，第 241 页，你可以学习如何操作。\n\n你可以忽略标记为 TEST 的连接器，其余连接器的含义应该显而易见。要为传感器供电，将\
    \ GND 连接到 Arduino 的地引脚，将 3V 连接到 Arduino 的 3.3 伏电源。X、Y 和 Z 随后将为 x、y 和 z 轴提供加速度数据。\n\
    \n就像我们在第 5.4 节《使用温度传感器提高精度》，第 113 页中使用的 TMP36 温度传感器一样，ADXL335 也是一个模拟设备：它以电压形式提供结果，这些结果必须转换为加速度值。因此，X、Y\
    \ 和 Z 连接器必须连接到 Arduino 上的三个模拟引脚。我们将 Z 连接到模拟引脚 0，Y 连接到模拟引脚 1，X 连接到模拟引脚 2（参见下一页的\
    \ Figure 6.3，并仔细检查你使用的转接板上的引脚标签！）。\n\n现在我们已经将 ADXL335 连接到 Arduino，让我们使用它。\n\n\
    ## 6.3 Bringing Your Accelerometer to Life\n\n一种了解新设备的实用策略是将其接上并查看它提供的数据。以下程序读取三个轴的所有输入值并将其输出到串口：\n\
    \n```\nconst unsigned int X_AXIS_PIN = 2;\nconst unsigned int Y_AXIS_PIN = 1;\n\
    const unsigned int Z_AXIS_PIN = 0;\nconst unsigned int BAUD_RATE = 9600;\n\nvoid\
    \ setup() {\n  Serial.begin(BAUD_RATE);\n}\n\nvoid loop() {\n  Serial.print(analogRead(X_AXIS_PIN));\n\
    \  Serial.print(\" \");\n  Serial.print(analogRead(Y_AXIS_PIN));\n  Serial.print(\"\
    \ \");\n  Serial.println(analogRead(Z_AXIS_PIN));\n  delay(100);\n}\n```\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_135_0.png)\n\
    \nFigure 6.3: 如何将 ADXL335 传感器连接到 Arduino\n\n我们的测试程序尽可能简单。我们为三个模拟引脚定义常量，并在 setup()\
    \ 函数中初始化串口。请注意，我们没有显式地将模拟引脚设置为 INPUT，因为那本来就是默认值。\n\n在 loop() 函数中，我们不断地将从模拟引脚读取的值输出到串口。打开串口监视器，并稍微移动传感器——围绕不同轴倾斜它。你应该会看到类似以下的输出：\n\
    \n```\n344 331 390\n364 276 352\n388 286 287\n398 314 286\n376 332 289\n370 336\
    \ 301\n379 338 281\n```\n\n这些值代表我们对 x、y 和 z 轴获得的数据。例如，当你仅围绕 x 轴移动传感器时，你可以看到第一个值相应地发生变化。在下一节中，我们将更仔细地查看这些值。\n\
    \n## 6.4 Finding and Polishing Edge Values\n\n物理世界往往远非完美。对许多传感器发出的数据来说尤其如此，加速度计也不例外。它们产生的最小值和最大值会略有变化，并且经常会有些抖动。即使你没有移动它们，它们也可能会改变输出值，或者它们可能不会正确地改变输出值。在本节中，我们将确定传感器的最小值和最大值，并消除抖动。\n\
    \n找到传感器的边缘值很容易，但很难自动化。你必须在移动传感器的同时不断读取其输出。以下程序可以完成这项工作：\n\n```\nDownload MotionSensor/SensorValues/SensorValues.pde\n\
    const unsigned int X_AXIS_PIN = 2;\nconst unsigned int Y_AXIS_PIN = 1;\nconst\
    \ unsigned int Z_AXIS_PIN = 0;\nconst unsigned int BAUD_RATE = 9600;\n\nint min_x,\
    \ min_y, min_z;\nint max_x, max_y, max_z;\n\nvoid setup() {\n  Serial.begin(BAUD_RATE);\n\
    \  min_x = min_y = min_z = 1000;\n  max_x = max_y = max_z = -1000;\n}\n\nvoid\
    \ loop() {\n  const int x = analogRead(X_AXIS_PIN);\n  const int y = analogRead(Y_AXIS_PIN);\n\
    \  const int z = analogRead(Z_AXIS_PIN);\n\n  min_x = min(x, min_x); max_x = max(x,\
    \ max_x);\n  min_y = min(y, min_y); max_y = max(y, max_y);\n  min_z = min(z, min_z);\
    \ max_z = max(z, max_z);\n\n  Serial.print(\"x(\");\n  Serial.print(min_x);\n\
    \  Serial.print(\"/\");\n  Serial.print(max_x);\n  Serial.print(\", y(\");\n \
    \ Serial.print(min_y);\n  Serial.print(\"/\");\n  Serial.print(max_y);\n  Serial.print(\"\
    , z(\");\n  Serial.print(min_z);\n  Serial.print(\"/\");\n  Serial.print(max_z);\n\
    \  Serial.println(\")\");\n}\n```\n\n我们为三个轴的最小值和最大值声明变量，并用肯定超出传感器范围的数字初始化它们（-1000\
    \ 和 1000）。在 loop() 函数中，我们永久测量三个轴的加速度并相应地调整最小值和最大值。\n\n编译并上传草图，然后在所有方向上移动带传感器的面包板，然后围绕所有轴倾斜它。缓慢移动它，快速移动它，缓慢倾斜它，快速倾斜它。使用较长的导线，并在移动和旋转面包板时小心，以免意外松动连接。\n\
    \n过了一会儿，最小值和最大值会稳定下来，你应该会得到类似这样的输出：\n\n```\nx(247/649), y(253/647), z(278/658)\n\
    ```\n\n记下这些值，因为我们稍后需要它们，而且当你进行自己的传感器实验时你可能也需要它们。\n\n现在让我们看看如何消除抖动。原则上很简单。不是立即返回加速度数据，我们收集最近的读数并返回它们的平均值。这样，小变化就会被抹平。代码如下所示：\n\
    \n```\nDownload: MotionSensor/Buffering/Buffering.pde\nLine 1 const unsigned int\
    \ X_AXIS_PIN = 2;\nconst unsigned int Y_AXIS_PIN = 1;\nconst unsigned int Z_AXIS_PIN\
    \ = 0;\nconst unsigned int NUM_AXES = 3;\n5 const unsigned int PINS[NUM_AXES]\
    \ = {\n  X_AXIS_PIN, Y_AXIS_PIN, Z_AXIS_PIN\n};\nconst unsigned int BUFFER_SIZE\
    \ = 16;\nconst unsigned int BAUD_RATE = 9600;\n10 int buffer[NUM_AXES][BUFFER_SIZE];\n\
    int buffer_pos[NUM_AXES] = { 0 };\n```\n\n```\nvoid setup() {\n    Serial.begin(BAUD_RATE);\n\
    }\n\nint get_axis(const int axis) {\n    delay(1);\n    buffer[axis][buffer_pos[axis]]\
    \ = analogRead(PINS[axis]);\n    buffer_pos[axis] = (buffer_pos[axis] + 1) % BUFFER_SIZE;\n\
    \n    long sum = 0;\n    for (int i = 0; i < BUFFER_SIZE; i++)\n        sum +=\
    \ buffer[axis][i];\n    return round(sum / BUFFER_SIZE);\n}\n\nint get_x() { return\
    \ get_axis(0); }\nint get_y() { return get_axis(1); }\nint get_z() { return get_axis(2);\
    \ }\n\nvoid loop() {\n    Serial.print(get_x());\n    Serial.print(\" \");\n \
    \   Serial.print(get_y());\n    Serial.print(\" \");\n    Serial.println(get_z());\n\
    }\n```\n\n像往常一样，我们首先为使用的引脚定义一些常量。这次，我们还定义了一个名为 NUM_AXES 的常量，其中包含我们测量的轴的数量。我们还有一个名为\
    \ PINS 的数组，其中包含我们使用的引脚列表。这有助于我们以后使代码更通用。\n\n在第 11 行，我们为所有轴声明缓冲区。它们将被我们测量的传感器数据填充，这样我们就可以在需要时计算平均值。我们必须存储每个缓冲区中的当前位置，因此在第\
    \ 12 行，我们定义了一个缓冲区位置数组。\n\nsetup() 只初始化串口，真正的动作发生在 get_axis() 函数中。它首先进行一个小延迟，给\
    \ Arduino 一些时间在模拟引脚之间切换；否则，你可能会得到错误的数据。然后它读取我们传递的轴的加速度并将其存储在属于该轴的当前位置。增加缓冲区位置，并在到达缓冲区末尾时将其重置为零。最后，我们返回迄今为止为当前轴收集的数据的平均值。\n\
    \n1. http://www.analog.com/en/sensors/inertial-sensors/adxl335/products/product.html\n"
