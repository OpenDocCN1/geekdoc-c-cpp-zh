    \ the opposite—reading real dice? Steve Hoefer* has built a dice reader using\
    \ an Arduino, and it’s really impressive. He uses five pairs of infrared emitters\
    \ and receivers to “scan” a die’s surface. It’s a fairly advanced project, and\
    \ you can learn a lot from it.\n\nAnother interesting project is an LED cube:\
    \ building a cube consisting of LEDs.† It’s surprisingly difficult to control\
    \ more than a few LEDs, but you can produce astonishing results.\n\nThis is all\
    \ the code we need to implement the first version of binary dice. As usual, we\
    \ define some constants for the output pins the LEDs are connected to. In the\
    \ setup() function, we set all the pins into OUTPUT mode. For the dice, we need\
    \ random numbers in the range between one and six. The random() function returns\
    \ random numbers in a specified range using a pseudorandom number generator. In\
    \ line 10, we initialize the generator with some noise we read from analog input\
    \ pin A0 (see the sidebar on the next page to learn why we have to do that). You\
    \ might wonder where the constant A0 is from. Since version 19, the Arduino IDE\
    \ defines constants for all analog pins named A0, A1, and so on.\n\nThen we actually\
    \ generate a new random number between one and six and output it using the output_result()\
    \ function. (the seven in the call to random() is correct, because it expects\
    \ the upper limit plus one).\n\nThe function output_result() takes a number and\
    \ outputs its lower three bits by switching on or off our three LEDs accordingly.\
    \ Here we use the & operator and binary literals. The & operator takes two numbers\
    \ and combines them bitwise. When two corresponding bits are 1, the result of\
    \ the & operator is 1, too. Otherwise, it is 0. The B prefix allows you to put\
    \ binary numbers directly into your source code. For example, B11 is the same\
    \ as 3.\n\nYou might have noticed that the loop() function was left empty, and\
    \ you might wonder how such dice work. It’s pretty simple: whenever you restart\
    \ the Arduino, it outputs a new number, and to roll the dice again, you have to\
    \ press the reset button.\n\n## Generating Random Numbers\n\nSome computing problems\
    \ are surprisingly difficult, and creating good random numbers is one of them.\
    \ After all, one of the most important properties of a computer is deterministic\
    \ behavior. Still, we often need—at least seemingly—random behavior for a variety\
    \ of purposes, ranging from games to cryptographic algorithms.\n\nThe most popular\
    \ approach (used in Arduino’s random() function, for example) is to create pseudorandom\
    \ numbers.* They seem to be random, but they actually are the result of a formula.\
    \ Different kinds of algorithms exist, but usually each new pseudorandom number\
    \ is calculated from its predecessors. This implies that you need an initialization\
    \ value to create the first random number of the sequence. This initialization\
    \ value is called a random seed, and to create different sequences of pseudorandom\
    \ numbers, you have to use different random seeds.\n\nCreating pseudorandom numbers\
    \ is cheap, but if you know the algorithm and the random seed, you can easily\
    \ predict them. So, you shouldn’t use them for cryptographic purposes.\n\nIn the\
    \ real world, you can find countless random processes, and with the Arduino, it’s\
    \ easy to measure them to create real random numbers. Often it’s sufficient to\
    \ read some random noise from analog pin 0 and pass it as the random seed to the\
    \ randomSeed() function. You can also use this noise to create real random numbers;\
    \ there is even a library for that purpose.†\n\nIf you need strong random numbers,\
    \ the Arduino is a perfect device for creating them. You can find many projects\
    \ that observe natural processes solely to create random numbers. One of them\
    \ watches an hourglass using the Arduino, for example.‡\n\n* http://en.wikipedia.org/wiki/Pseudo-random_numbers\n\
    † http://code.google.com/p/tinkerit/wiki/TrueRandom\n‡ http://www.circuitlake.com/usb-hourglass-sand-timer.html\n\
    \nCompile the code, upload it to the Arduino, and play a bit with your binary\
    \ dice. You have mastered your first advanced electronics project! Enjoy it for\
    \ a moment!\n\nSo, whenever you want to see a new result, you have to reset the\
    \ Arduino. That's probably the most pragmatic user interface you can build, and\
    \ for a first prototype, this is OK. But often you need more than one button,\
    \ and it's also more elegant to add your own button anyway. So, that's what we'll\
    \ do in the next section.\n\n## 3.5 Working with Buttons\n\nIn this section, we'll\
    \ add our own pushbutton to our binary dice, so we no longer have to abuse the\
    \ Arduino's reset button to roll the dice. We'll start small and build a circuit\
    \ that uses a pushbutton to control a single LED.\n\nSo, what exactly is a pushbutton?\
    \ Here are three views of a typical pushbutton that can be used as the Arduino's\
    \ reset button.\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_73_0.png)\n\nIt has\
    \ four connectors that fit perfectly on a breadboard (at least after you have\
    \ straightened them with a pair of pliers). Two opposite pins connect when the\
    \ button is pushed; otherwise, they are disconnected.\n\nIn Figure 3.8, on the\
    \ following page, you can see a simple circuit using a pushbutton. Connect pin\
    \ 7 (chosen completely arbitrarily) to the pushbutton, and connect the pushbutton\
    \ via a 10kΩ resistor to ground. Then connect the 5 volts power supply to the\
    \ other pin of the button.\n\nAll in all, this approach seems straightforward,\
    \ but why do we need a resistor again? The problem is that we expect the pushbutton\
    \ to return a default value (LOW) in case it isn't pressed. But when the button\
    \ isn't pressed, it would not be directly connected to ground and would flicker\
    \ because of static and interference. A little bit of current flows through the\
    \ resistor, and this helps prevent random noise from changing the voltage that\
    \ the input pin sees.\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_74_0.png)\n\n\
    # Figure 3.8: A simple pushbutton circuit\n\nWhen the button is pressed, there\
    \ will still be 5 volts at the Arduino's digital pin, but when the button isn't\
    \ pressed, it will cleanly read the connection to ground. We call this a pull-down\
    \ resistor; a pull-up resistor works exactly the other way around. That is, you\
    \ have to connect the Arduino's signal pin to power through the pushbutton and\
    \ connect the other pin of the pushbutton to ground using a resistor.\n\nNow that\
    \ we've eliminated all this ugly unstable real-world behavior, we can return to\
    \ the stable and comforting world of software development. The following program\
    \ checks whether a pushbutton is pressed and lights an LED accordingly:\n\nDownload\
    \ BinaryDice/SimpleButton/SimpleButton.pde\n\n```\nconst unsigned int BUTTON_PIN\
    \ = 7;\nconst unsigned int LED_PIN   = 13;\n\nvoid setup() {\n  pinMode(LED_PIN,\
    \ OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n}\n\nvoid loop() {\n  const int BUTTON_STATE\
    \ = digitalRead(BUTTON_PIN);\n\n  if (BUTTON_STATE == HIGH)\n    digitalWrite(LED_PIN,\
    \ HIGH);\n  else\n    digitalWrite(LED_PIN, LOW);\n}\n```\n\nWe connect the button\
    \ to pin 7 and the LED to pin 13 and initialize the pins accordingly in the setup()\
    \ function. In loop(), we read the current state of the pin connected to the button.\
    \ If it is HIGH, we turn the LED on. Otherwise, we turn it off.\n\nUpload the\
    \ program to the Arduino, and you'll see that the LED is on as long as you press\
    \ the button. As soon as you release the button, the LED turns off. This is pretty\
    \ cool, because now we nearly have everything we need to control our dice using\
    \ our own button. But before we proceed, we'll slightly enhance our example and\
    \ turn the button into a real light switch.\n\nTo build a light switch, we start\
    \ with the simplest possible solution. Do not change the current circuit, and\
    \ upload the following program to your Arduino:\n\n```\n```\nconst unsigned int\
    \ BUTTON_PIN = 7;\n\nconst unsigned int LED_PIN  = 13;\n\nvoid setup() {\n  pinMode(LED_PIN,\
    \ OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n}\n\nint led_state = LOW;\n\nvoid loop()\
    \ {\n  const int CURRENT_BUTTON_STATE = digitalRead(BUTTON_PIN);\n  \n  if (CURRENT_BUTTON_STATE\
    \ == HIGH) {\n    led_state = (led_state == LOW) ? HIGH : LOW;\n    digitalWrite(LED_PIN,\
    \ led_state);\n  }\n}\n```\n```\n\nWe begin with the usual pin constants, and\
    \ in setup() we set the modes of the pins we use. In line 9, we define a global\
    \ variable named led_state to store the current state of our LED. It will be LOW\
    \ when the LED is on and HIGH otherwise. In loop(), we check the button's current\
    \ state. When we press the button, its state switches to HIGH, and we toggle the\
    \ content of led_state. That is, if led_state was HIGH, we set it to LOW, and\
    \ vice versa. At the end, we set the physical LED's state to our current software\
    \ state accordingly.\n\nOur solution is really simple, but unfortunately, it does\
    \ not work. Play around with it a bit, and you'll quickly notice some annoying\
    \ behavior.\n"
  mdcn: "\n\n![](img/dcfd13a1bf99c4d3f9996627012a6526_70_0.png)\n\nFigure 3.7: A first\
    \ working version of our binary die\n\n## More LEDs, Dice, and Cubes\n\n制作二进制骰子很有趣，而且即使对初学者来说也是一个容易的项目。但反过来呢——读取真正的骰子？Steve\
    \ Hoefer* 使用 Arduino 制作了一个骰子读取器，效果非常令人印象深刻。他使用五对红外发射器和接收器来“扫描”骰子的表面。这是一个相当高级的项目，你可以从中学到很多东西。\n\
    \n另一个有趣的项目是 LED 立方体：由 LED 组成的立方体。† 控制超过几个 LED 看起来出乎意料地困难，但你可以产生惊人的效果。\n\n这就是实现二进制骰子第一版所需的所有代码。像往常一样，我们为\
    \ LED 连接的输出引脚定义了一些常量。在 setup() 函数中，我们将所有引脚设置为 OUTPUT 模式。对于骰子，我们需要在 1 到 6 之间需要随机数。random()\
    \ 函数使用伪随机数生成器在指定范围内返回随机数。在第 10 行，我们使用从模拟输入引脚 A0 读取的一些噪声来初始化生成器（请参阅下一页的边栏，了解我们为什么必须这样做）。你可能会想知道常量\
    \ A0 从何而来。自版本 19 以来，Arduino IDE 为所有模拟引脚定义了名为 A0、A1 等的常量。\n\n然后我们实际生成 1 到 6 之间的新随机数，并使用\
    \ output_result() 函数输出它。 （对 random() 的调用中的 7 是正确的，因为它期望上限加一）。\n\n函数 output_result()\
    \ 接收一个数字并通过相应地打开或关闭我们的三个 LED 输出其低三位。这里我们使用 & 运算符和二进制字面量。& 运算符接收两个数字并按位组合它们。当两个对应的位都是\
    \ 1 时，& 运算符的结果也是 1。否则为 0。B 前缀允许你直接将二进制数字放入源代码中。例如，B11 与 3 相同。\n\n你可能已经注意到 loop()\
    \ 函数被留空了，你可能会想知道这样的骰子是如何工作的。很简单：每当你重新启动 Arduino 时，它就会输出一个新数字，要再次掷骰子，你必须按下复位按钮。\n\
    \n## Generating Random Numbers\n\n一些计算问题出乎意料地困难，创建良好的随机数就是其中之一。毕竟，计算机最重要的属性之一是确定性行为。尽管如此，我们经常需要——至少看似——为各种目的提供随机行为，从游戏到加密算法。\n\
    \n最流行的方法（例如 Arduino 的 random() 函数使用的方法）是创建伪随机数。* 它们看起来是随机的，但实际上是公式的结果。存在不同种类的算法，但通常每个新的伪随机数都是从其前驱计算得出的。这意味着你需要一个初始化值来创建序列中的第一个随机数。这个初始化值称为随机种子，为了创建伪随机数的不同序列，你必须使用不同的随机种子。\n\
    \n创建伪随机数很便宜，但如果你知道算法和随机种子，你可以轻松预测它们。所以，你不应该将它们用于加密目的。\n\n在现实世界中，你可以找到无数个随机过程，并且使用\
    \ Arduino 很容易测量它们以创建真正的随机数。通常，读取模拟引脚 0 上的一些随机噪声并将其作为随机种子传递给 randomSeed() 函数就足够了。你也可以使用这种噪声来创建真正的随机数；甚至有一个用于此目的的库。†\n\
    \n如果需要强随机数，Arduino 是创建它们的完美设备。你可以找到许多仅为创建随机数而观察自然过程的项目。其中一个例如使用 Arduino 观察沙漏。‡\n\
    \n* http://en.wikipedia.org/wiki/Pseudo-random_numbers\n† http://code.google.com/p/tinkerit/wiki/TrueRandom\n\
    ‡ http://www.circuitlake.com/usb-hourglass-sand-timer.html\n\n编译代码，将其上传到 Arduino，并用你的二进制骰子玩一会儿。你已经掌握了你的第一个高级电子项目！好好享受一下！\n\
    \n所以，每当你想看到新结果时，你都必须重置 Arduino。这可能是你可以构建的最实用的用户界面，对于第一个原型来说，这是可以的。但通常你需要不止一个按钮，而且无论如何添加自己的按钮也更优雅。所以，我们将在下一节中这样做。\n\
    \n## 3.5 Working with Buttons\n\n在本节中，我们将为我们的二进制骰子添加自己的按钮，这样我们就不再需要滥用 Arduino\
    \ 的复位按钮来掷骰子了。我们从小处着手，构建一个使用按钮控制单个 LED 的电路。\n\n那么，按钮到底是什么？以下是可用于 Arduino 复位按钮的典型按钮的三个视图。\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_73_0.png)\n\n它有四个连接器，可以完美地安装在面包板上（至少在你用钳子将其拉直之后）。当按钮被按下时，相对的两个引脚会连接；否则，它们是断开的。\n\
    \n在下一页的图 3.8 中，你可以看到一个使用按钮的简单电路。将引脚 7（完全任意选择）连接到按钮，并通过 10kΩ 电阻将按钮连接到地。然后将 5 伏电源连接到按钮的另一端。\n\
    \n总的来说，这种方法似乎很直接，但为什么我们还需要一个电阻呢？问题是我们期望按钮在未按下时返回默认值（LOW）。但当按钮未按下时，它不会直接连接到地，并且会因静电和干扰而闪烁。有一点电流流过电阻，这有助于防止随机噪声改变输入引脚看到的电压。\n\
    \n![](img/dcfd13a1bf99c4d3f9996627012a6526_74_0.png)\n\n# Figure 3.8: A simple\
    \ pushbutton circuit\n\n当按钮被按下时，Arduino 的数字引脚上仍会有 5 伏电压，但当按钮未按下时，它会干净地读取到地的连接。我们称之为下拉电阻；上拉电阻则完全相反。也就是说，你必须通过按钮将\
    \ Arduino 的信号引脚连接到电源，并使用电阻将按钮的另一端连接到地。\n\n现在我们已经消除了所有这些丑陋不稳定的现实世界行为，我们可以回到稳定而舒适的软件开发世界。下面的程序检查按钮是否被按下并相应地点亮\
    \ LED：\n\nDownload BinaryDice/SimpleButton/SimpleButton.pde\n\n```\nconst unsigned\
    \ int BUTTON_PIN = 7;\nconst unsigned int LED_PIN   = 13;\n\nvoid setup() {\n\
    \  pinMode(LED_PIN, OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n}\n\nvoid loop()\
    \ {\n  const int BUTTON_STATE = digitalRead(BUTTON_PIN);\n\n  if (BUTTON_STATE\
    \ == HIGH)\n    digitalWrite(LED_PIN, HIGH);\n  else\n    digitalWrite(LED_PIN,\
    \ LOW);\n}\n```\n\n我们将按钮连接到引脚 7，将 LED 连接到引脚 13，并在 setup() 函数中相应地初始化引脚。在 loop()\
    \ 中，我们读取连接到按钮的引脚的当前状态。如果它是 HIGH，我们打开 LED。否则，我们关闭它。\n\n将程序上传到 Arduino，你会看到只要按下按钮，LED\
    \ 就亮。松开按钮后，LED 就熄灭。这很酷，因为现在我们几乎拥有控制骰子的所有所需内容，使用我们自己的按钮。但在继续之前，我们将稍微增强我们的示例，并将按钮变成真正的电灯开关。\n\
    \n要构建电灯开关，我们从最简单的解决方案开始。不要更改当前电路，并将以下程序上传到你的 Arduino：\n\n```\n```\nconst unsigned\
    \ int BUTTON_PIN = 7;\n\nconst unsigned int LED_PIN  = 13;\n\nvoid setup() {\n\
    \  pinMode(LED_PIN, OUTPUT);\n  pinMode(BUTTON_PIN, INPUT);\n}\n\nint led_state\
    \ = LOW;\n\nvoid loop() {\n  const int CURRENT_BUTTON_STATE = digitalRead(BUTTON_PIN);\n\
    \  \n  if (CURRENT_BUTTON_STATE == HIGH) {\n    led_state = (led_state == LOW)\
    \ ? HIGH : LOW;\n    digitalWrite(LED_PIN, led_state);\n  }\n}\n```\n```\n\n我们以通常的引脚常量开始，并在\
    \ setup() 中设置我们使用的引脚的模式。在第 9 行，我们定义了一个名为 led_state 的全局变量来存储我们 LED 的当前状态。当 LED\
    \ 打开时它将为 LOW，否则为 HIGH。在 loop() 中，我们检查按钮的当前状态。当我们按下按钮时，其状态切换为 HIGH，我们切换 led_state\
    \ 的内容。也就是说，如果 led_state 为 HIGH，我们将其设置为 LOW，反之亦然。最后，我们将物理 LED 的状态设置为我们当前的软件状态。\n\
    \n我们的解决方案非常简单，但不幸的是，它不起作用。稍微玩一下，你很快就会注意到一些令人讨厌的行为。\n\n"
