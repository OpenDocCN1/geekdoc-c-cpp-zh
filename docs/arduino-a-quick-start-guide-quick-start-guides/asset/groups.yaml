    # Chapter 7


    # Tinkering with the Wii Nunchuk


    One of the most entertaining electronic activities is tinkering: taking an existing
    product and turning it into something different or using it for an unintended
    purpose. Sometimes you have to open the product and void its warranty; other times
    you can safely make it part of your own project.


    In this chapter, you''ll learn how to hijack a Nintendo Nunchuk controller. It''s
    a perfect candidate for tinkering: it comes with a three-axis accelerometer, an
    analog joystick, and two buttons, and it is very cheap (less than $20 at the time
    of this writing). Even better: because of its good design and its easy-to-access
    connectors, you can integrate it into your own projects surprisingly easily.


    We''ll use an ordinary Nunchuk controller and transfer the data it emits to our
    computer using an Arduino. You''ll learn how to wire it to the Arduino; how to
    write software that reads the controller''s current state; and how to move, rotate,
    and scale a 3D cube on the screen using your Nunchuk. You don''t even need a Nintendo
    Wii to do any of this—you only need a Nunchuk controller.


    # 7.1 What You Need


    +   - An Arduino board such as the Uno, Duemilanove, or Diecimila

    +   - A USB cable to connect the Arduino to your computer

    +   - A Nintendo Nunchuk controller

    +   - Four wires'
  - '[PAGE 154]


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_154_0.png)


    Figure 7.1: A Nintendo Nunchuk controller


    # 7.2 Wiring a Wii Nunchuk


    Wiring a Nunchuk to an Arduino really is a piece of cake. You don''t have to open
    the Nunchuk or modify it in any way. You only have to put four wires into its
    connector and then connect the wires to the Arduino. Here''s the pinout of a Nunchuk
    plug:


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_154_1.png)


    It has six connectors, but only four of them are active: GND, 3.3 V, Data, and
    Clock. Put a wire into each connector, and then connect the wires to the Arduino.
    Connect the data wire to analog pin 4 and the clock wire to analog pin 5. The
    GND wire has to be connected to the Arduino''s ground pin and the 3.3 V wire belongs
    to the Arduino''s 3.3 V pin.'
  - '[PAGE 155]


    ![](img/dcfd13a1bf99c4d3f9996627012a6526_155_0.png)


    Figure 7.2: How to connect a Nunchuk to an Arduino


    That’s really all you have to do to connect a Nunchuk controller to an Arduino.
    In the next section, you’ll see that the two wires connected to analog pins 4
    and 5 are all we need to interface with the controller.


    # 7.3 Talking to a Nunchuk


    No official documentation shows how a Nunchuk works internally or how you can
    use it in a non-Wii environment. But some smart hackers and makers on the Internet
    invested a lot of time to reverse-engineer what’s happening inside the controller.¹


    All in all, it’s really simple, because the Nunchuk uses the Two-Wire Interface
    (TWI), also known as I²C (Inter-Integrated Circuit) protocol.² It enables devices
    to communicate via a master/slave data bus using only two wires. You transmit
    data on one wire (DATA), while the other synchronizes the communication (CLOCK).


    The Arduino IDE comes with a library named Wire that implements the I²C protocol.
    It expects the data line to be connected to analog pin 4 and the clock line to
    analog pin 5. We’ll use it shortly to communicate with the Nunchuk, but before
    that, we’ll have a look at the commands the controller understands.³


    1. http://www.windmeadow.com/node/42

    2. http://en.wikipedia.org/wiki/I2c

    3. At http://todbot.com/blog/2010/09/25/softi2cmaster-add-i2c-to-any-arduino-pins/,
    you can find a library that allows you to use any pair of pins for I²C communication.'
  - '[PAGE 156]


    # Improve People’s Life with Tinkering


    Because of its popularity, peripheral equipment for modern game consoles often
    is unbelievably cheap. Also, it’s no longer limited to classic controllers; you
    can buy things like snowboard simulators or cameras. So, it comes as no surprise
    that creative people have built many interesting projects using hardware that
    was originally built for playing games.


    An impressive and useful tinkering project is the Eyewriter.* It uses the PlayStation
    Eye (a camera for Sony’s PlayStation 3) to track the movement of human eyes.


    A team of hackers built it to enable their paralyzed friend to draw graffiti using
    his eyes. Because of a disease, this friend, an artist, is almost completely physically
    paralyzed and can only move his eyes. With the Eyewriter, he is able to create
    amazing artwork again.


    It’s not an Arduino project but definitely worth a look.


    * http://www.eyewriter.org/


    To be honest, the Nunchuk understands only a single command: “Give me all your
    data.” Whenever it receives this command, it returns six bytes that have the following
    meaning (see the data structure in Figure 7.3, on the following page):


    +   - Byte 1 contains the analog stick’s x-axis value, and in byte 2 you’ll find
    the stick’s y-axis value. Both are 8-bit numbers and range from about 29 to 225.


    +   - Acceleration values for the x-, y-, and z-axes are three 10-bit numbers.
    Bytes 3, 4, and 5 contain their eight most significant bits. You can find the
    missing two bits for each of them in byte 6.


    +   - Byte 6 has to be interpreted bit-wise. Bit 0 (the least significant bit)
    contains the status of the Z-button. It’s 0 if the button was pressed; otherwise,
    it is 1. Bit 1 contains the C-button’s status.


    The remaining six bits contain the missing least significant bits of the acceleration
    values. Bits 2 and 3 belong to the X axis, bits 4 and 5 belong to Y, and bits
    6 and 7 belong to Z.


    Now that we know how to interpret the data we get from the Nunchuk, we can start
    to build a Nunchuk class to control it.'
