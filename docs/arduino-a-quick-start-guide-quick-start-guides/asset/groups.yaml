    \  Serial.begin(BAUD_RATE);\n  delay(20 * 1000);\n}\n```\n\n```\nvoid loop() {\n\
    \  burglar_alarm.check();\n  delay(3000);\n}\n```\n\nFirst we define all the libraries\
    \ we need, and we define constants for the PIR sensor pin and our MAC address.\
    \ Then we define SmtpService and PassiveInfraredSensor objects and use them to\
    \ define a BurglarAlarm instance.\n\nIn the setup() method, we define the serial\
    \ port and the Ethernet shield. I've also added a delay of twenty seconds, which\
