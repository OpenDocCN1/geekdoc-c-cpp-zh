    \ LOW);\n  delayMicroseconds(2);\n\n  digitalWrite(PING_SENSOR_IO_PIN, HIGH);\n\
    \  delayMicroseconds(5);\n  digitalWrite(PING_SENSOR_IO_PIN, LOW);\n\n  pinMode(PING_SENSOR_IO_PIN,\
