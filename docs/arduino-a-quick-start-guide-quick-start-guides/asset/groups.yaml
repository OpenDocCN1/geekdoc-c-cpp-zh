  - "[PAGE 186]\n\nBefore we send an email using an Arduino and an Ethernet shield,\
    \ you should learn how to send an email from a command line using the telnet command.\
    \ To do so, you have to find out the address of an SMTP server you can use first.\
    \ The following instructions assume you’re using a Google Mail account (http://gmail.com).\
    \ If you use a different email provider, you have to adjust the domain names accordingly.\
    \ In any case, don’t abuse their service! When in doubt, read their usage terms!\n\
    \nOpen a terminal, and enter the following:\n\n```\nmaik> nslookup\n> set type=mx\n\
    > gmail.com\nServer:  192.168.2.1\nAddress:  192.168.2.1#53\nNon-authoritative\
    \ answer:\ngmail.com mail exchanger = 5 gmail-smtp-in.l.google.com.\ngmail.com\
    \ mail exchanger = 10 alt1.gmail-smtp-in.l.google.com.\ngmail.com mail exchanger\
    \ = 20 alt2.gmail-smtp-in.\n> exit\n```\n\nThis command returns a list of all\
    \ the Google Mail exchange servers (MX) available on your network. Take the first\
    \ server name, and open a connection to the SMTP standard port 25 (replace the\
    \ server name gmail-smtp-in.l.google.com and all email addresses accordingly):\n\
    \n```\n⇒ maik> telnet gmail-smtp-in.l.google.com 25\n⇒ Trying 74.125.77.27...\n\
    Connected to gmail-smtp-in.l.google.com.\nEscape character is '^]'.\n220 mx.google.com\
    \ ESMTP q43si10820020eeh.100\n⇒ HELO\n⇒ 250 mx.google.com at your service\n⇒ MAIL\
    \ FROM: <arduino@example.com>\n⇒ 250 2.1.0 OK q43si10820020eeh.100\n⇒ RCPT TO:\
    \ <info@example.com>\n⇒ 250 2.1.5 OK q43si10820020eeh.100\n⇒ DATA\n⇒ 354 Go ahead\
    \ q43si10820020eeh.100\n⇒ from: arduino@example.com\n⇒ to: info@example.com\n\
    ⇒ subject: This is a test\n⇒ \n⇒ Really, this is a test!\n⇒ .\n⇒ 250 2.0.0 OK\
    \ 1286819789 q43si10820020eeh.100\n⇒ QUIT\n⇒ 221 2.0.0 closing connection q43si10820020eeh.100\n\
    Connection closed by foreign host.\n```"
  - '[PAGE 187]


    Although it is way more complex, this session is similar to our DAYTIME example.
    We only send more complex commands (by the way, you do not have to write the commands
    in uppercase). First we send the HELO command (the spelling is correct) to establish
    a session with the SMTP server. Then we tell the server that we’d like to send
    an email using MAIL FROM:. The email address we provide with this command will
    be used by the server in case our email bounces back. Note that the server sends
    back a response line for every request. These responses always start with a three-digit
    status code.


    The RCPT TO: command sets the recipient’s email address. If you’d like to send
    an email to more than one recipient, you have to repeat the command for each of
    them.


    With the DATA command, we tell the server that we now start to transmit the email’s
    attributes. Email attributes are mainly a list of key/value pairs where key and
    value are delimited by a colon. So in the first three lines, we set the attributes
    “from,” “to,” and “subject,” and they all have the meaning you’d expect when sending
    an email.


    You separate the email’s body from the attributes using a blank line. To mark
    the end of the email body, send a line containing a single period. Send the QUIT
    command to end the session with the SMTP server.


    You should find a new email in your inbox. If not, try another MX server first.
    Still things can go wrong, and although simple in theory, SMTP can be a complex
    beast in practice. Often SMTP servers return helpful error messages that might
    help you to quickly solve your problem.


    Don’t proceed until you have successfully sent an email from the command line,
    because it is the basis for the next section where you’ll learn how to send emails
    with an Arduino.


    # 8.7 Emailing Directly from an Arduino


    To send an email from the Arduino, we will basically implement the telnet session
    from the previous section line by line. Instead of simply hardwiring the email’s
    attributes into the networking code, we will create a more advanced design.'
  - "[PAGE 188]\n\nWe start with an Email class:\n\n```\nDownload Ethernet/Email/email.h\n\
    \n#ifndef __EMAIL__H__\n#define __EMAIL__H__\n\nclass Email {\n    String _from,\
    \ _to, _subject, _body;\n\npublic:\n\n    Email(\n        const String& from,\n\
    \        const String& to,\n        const String& subject,\n        const String&\
    \ body\n    ) : _from(from), _to(to), _subject(subject), _body(body) {}\n\n  \
    \  const String& getFrom()    const { return _from; }\n    const String& getTo()\
    \      const { return _to; }\n    const String& getSubject() const { return _subject;\
    \ }\n    const String& getBody()    const { return _body; }\n};\n\n#endif\n```\n\
    \nThis class encapsulates an email's four most important attributes—the email\
    \ addresses of the sender and the recipient, a subject, and a message body. We\
    \ store all attributes as String objects.\n\nWait a minute...a String class? Yes!\
    \ Since version 19, the Arduino IDE comes with a full-blown string class.¹⁴ It\
    \ does not have as many features as the C++ or Java string classes, but it's still\
    \ way better than messing around with char pointers. You'll see how to use it\
    \ in a few paragraphs.\n\nThe rest of our Email class is pretty straightforward.\
    \ In the constructor, we initialize all instance variables, and we have methods\
    \ for getting every single attribute. We now need an SmtpService class for sending\
    \ Email objects:\n\n```\nDownload Ethernet/Email/smtp_service.h\n\nLine 1  #ifndef\
    \ __SMTP_SERVICE__H__\n        #define __SMTP_SERVICE__H__\n        \n       \
    \ #include \"email.h\"\n```\n\n14. http://arduino.cc/en/Reference/StringObject"
  - "[PAGE 189]\n\n```\nclass SmtpService {\n    byte* _smtp_server;\n    unsigned\
    \ int _port;\n\n    void read_response(Client& client) {\n        delay(4000);\n\
    \        while (client.available()) {\n            const char c = client.read();\n\
    \            Serial.print(c);\n        }\n    }\n\n    void send_line(Client&\
    \ client, String line) {\n        const unsigned int MAX_LINE = 256;\n       \
    \ char buffer[MAX_LINE];\n        line.toCharArray(buffer, MAX_LINE);\n      \
    \  Serial.println(buffer);\n        client.println(buffer);\n        read_response(client);\n\
    \    }\n\n    public:\n\n    SmtpService(\n        byte* smtp_server,\n      \
    \  const unsigned int port) : _smtp_server(smtp_server),\n        _port(port)\
    \ {}\n\n    void send_email(const Email& email) {\n        Client client(_smtp_server,\
    \ _port);\n        Serial.print(\"Connecting...\");\n\n        if (!client.connect())\
    \ {\n            Serial.println(\"connection failed.\");\n        } else {\n \
    \           Serial.println(\"connected.\");\n            read_response(client);\n\
    \            send_line(client, String(\"helo\"));\n            send_line(\n  \
    \              client,\n                String(\"mail from: <\") + email.getFrom()\
    \ + String(\">\")\n            );\n            send_line(\n                client,\n\
    \                String(\"rcpt to: <\") + email.getTo() + String(\">\")\n    \
    \        );\n            send_line(client, String(\"data\"));\n            send_line(client,\
    \ String(\"from: \") + email.getFrom());\n            send_line(client, String(\"\
    to: \") + email.getTo());\n            send_line(client, String(\"subject: \"\
    ) + email.getSubject());\n```"
