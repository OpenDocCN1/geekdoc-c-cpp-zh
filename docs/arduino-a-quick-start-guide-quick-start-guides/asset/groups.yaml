  - "[PAGE 51]\n\nFor uploading software, the Arduino has a serial port, and we can\
    \ use it to connect the Arduino to other devices, too (in Section 1.6, Compiling\
    \ and Uploading Programs, on page 38, you learn how to look up the serial port\
    \ your Arduino is connected to). In this section, we will use it to control Arduino's\
    \ status LED using our computer's keyboard. The LED should be turned on when you\
    \ press 1, and it should be turned off when you press 2. Here's all the code we\
    \ need:\n\n```\nDownload welcome/LedSwitch/LedSwitch.pde\nconst unsigned int LED_PIN\
    \ = 13;\nconst unsigned int BAUD_RATE = 9600;\n\nvoid setup() {\n  pinMode(LED_PIN,\
    \ OUTPUT);\n  Serial.begin(BAUD_RATE);\n}\n\nvoid loop() {\n  if (Serial.available()\
    \ > 0) {\n    int command = Serial.read();\n    if (command == '1') {\n      digitalWrite(LED_PIN,\
    \ HIGH);\n      Serial.println(\"LED on\");\n    } else if (command == '2') {\n\
    \      digitalWrite(LED_PIN, LOW);\n      Serial.println(\"LED off\");\n    }\
    \ else {\n      Serial.print(\"Unknown command: \");\n      Serial.println(command);\n\
    \    }\n  }\n}\n```\n\nAs in our previous examples, we define a constant for the\
    \ pin the LED is connected to and set it to OUTPUT mode in the setup() function.\
    \ In line 6, we initialize the serial port using the begin() function of the Serial\
    \ class, passing a baud rate of 9600 (you can learn what a baud rate is in Section\
    \ C.1, Learning More About Serial Communication, on page 251). That's all we need\
    \ to send and receive data via the serial port in our program.\n\nSo, let's read\
    \ and interpret the data. The loop() function starts by calling Serial's available()\
    \ method in line 10. available() returns the number of bytes waiting on the serial\
    \ port. If any data is available, we read it using Serial.read(). read() returns\
    \ the first byte of incoming data if data is available and -1 otherwise."
