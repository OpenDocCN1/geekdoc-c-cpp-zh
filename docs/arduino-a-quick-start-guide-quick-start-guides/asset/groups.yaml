    ### 5.9 Visualizing Sensor Data


    Now that the serial communication between our computer and the Arduino works,
    let’s visualize the distance to the nearest object:


    ```

    void init_screen() {

    background(255);

    stroke(0);

    strokeWeight(1);

    int[] radius_values = { 300, 250, 200, 150, 100, 50 };

    for (int r = 0; r < radius_values.length; r++) {

    final int current_radius = radius_values[r] * 2;

    ellipse(xCenter, yCenter, current_radius, current_radius);

    }

    strokeWeight(10);

    }

    ```


    ```

    void draw() {

    init_screen();

    int x = (int)(radius * Math.cos(degree * Math.PI / 180));

    int y = (int)(radius * Math.sin(degree * Math.PI / 180));

    point(xCenter + x, yCenter + y);

    if (++degree == 360)

    degree = 0;

    }

    ```


    init_screen() clears the screen and sets its background color to white in line
    2. It sets the drawing color to black using stroke(0) and sets the width of the
    stroke used for drawing shapes to 1 pixel. Then it draws six concentric circles
    around the screen''s center. These circles will help us to see how far the nearest
    object is away from the PING))) sensor. Finally, it sets the stroke width to 10,
    so we can visualize the sensor with a single point that is 10 pixels wide.


    Processing calls the draw() method automatically at a certain frame rate (default
    is 60 frames per second), and it is the equivalent of the Arduino''s loop() method.
    In our case, we initialize the screen and calculate coordinates lying on a circle.
    The circle''s radius depends on the distance we have from the Arduino, so we have
    a point that moves on a circle. Its distance to the circle''s center depends on
    the data we measure with the PING))) sensor.


