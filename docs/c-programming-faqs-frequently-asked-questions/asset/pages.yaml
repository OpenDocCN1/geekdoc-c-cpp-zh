    # Other System-Dependent Operations


    **Question:** How can I implement a delay or time a user''s response with sub-second
    resolution?


    **Answer:** Unfortunately, there is no portable way. V7 UNIX and derived sys-t
    provided a fairly useful ftime routine with resolution up to millis-ond, but it
    has disappeared from System V and POSIX. Other routines you might look for your
    system include clock, delay, getimeofday, msleep, nap, napms, setimer, sleep,
    and usleep. (A routine called wait, however, isat least under UNIX--not you want.)
    The select and poll calls (if available) can be pressed into service to implement
    simple delays. On MS-DOS machines, it is possible to reprogram the system timer
    and timer interrupts.


    Of these, only clock is part of the ANSI standard. The difference between two
    calls to clock gives elapsed execution time, and if CLOCKS_PER_SEC is greater
    than 1, the difference will have secondary resolution. However, clock elapsed
    processor time used by the current program, which on a multitasking system may
    differ considerably from real time.


    If you''re trying to implement a delay and all you have available is a time-reporting
    function, you can implement a CPU-intensive busy-wait, but this is an option only
    on a single-user, single-tasking machine, as it is terribly anti-social to any
    other processes. Under a multitasking operating system, be sure to use a call
    that puts your process to sleep for the duration, as sleep or select, or pause
    in conjunction with alarm or setimer.'
