  md: '# 19.33


    Question: How can a process change an environment variable in its caller?


    Answer: It may or may not be possible to do so at all. Different operating systems
    implement global name/value functionality in different ways. Whether the "environment"
    can be usefully altered by a running program—and if so, how—is system dependent.


    Under UNIX, a process can modify its own environment (some systems provide setenv
    or putenv functions for the purpose), and the modified environment is generally
    passed on to child processes, but it is not propagated back to the parent process.
    (The environment of the parent process can be altered only if the parent is explicitly
    set up to listen for some kind of change requests.)


