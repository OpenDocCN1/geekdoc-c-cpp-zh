    # 13.10


    **Question:** How can I sort a linked list?


    **Answer:** Sometimes, it''s easier to keep the list in order as you build it
    (or perhaps to use a tree instead). Algorithms such as insertion and merge sort
    lend themselves ideally to use linked lists. If you want to use standard library
    function, you can allocate a temporary array of pointers, fill it in with pointers
    to all your list nodes, call qsort, and finally rebuild the list pointers based
    on the sorted array.


    References: Knuth Vol. 3 $5.2.1 pp. 80–102, $5.2,4 pp. 159–68

    Sedgewick $8 pp. 98–100, $12 pp. 163–75


    # 13.11


    **Question:** How can I sort more data than will fit in memory?


    **Answer:** You want an “external sort,” which you can read about in Knuth, Volume
    3. The basic idea is to sort the data in chunks (as much as will fit in memory
    at one time), write each sorted chunk to a temporary file, and then merge the
    files. If your operating system provides provides a general-purpose sort utility,
    you can try invoking it from within your program; see questions 19.27 and 19.30
    and the example in question 19.28.


    References: Knuth Vol. 3 $5.4 pp. 247–378

    Sedgewick $13 pp. 177–87'
