    # Declaration Problems


    Sometimes the compiler insists on complaining about your declarations no matter
    how carefully constructed you thought they were. These questions uncover some
    of the reasons why. (Chapter 16 is a similar collection of baffling run-time problems.)


    # 1.25


    Question: Why is my compiler complaining about an invalid redeclaration of a function
    that I define and call only once?


    Answer: Functions that are called without a declaration in scope (perhaps because
    the first call precedes the function’s definition) are assumed to be declared
    as if:


    ```

    extern int f();

    ```


    That is, an undeclared function is assumed to return int and to accept an unspecified
    number of arguments, although there must be a fixed number of them and none be
    “narrow.” If the function is later defined otherwise, the compiler complains about
    the discrepancy. Functions returning other than int or accepting any “narrow”
    arguments or a variable number of arguments must all be declared before they are
    called. (It''s safe to declare all functions, so that function prototypes can
    check that arguments are passed correctly.)


    Another possible source of this problem is that the function has the same name
    as another one declared in a header file.

    See also questions 11.3 and 15.1.


