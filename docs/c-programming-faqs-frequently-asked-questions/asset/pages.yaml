    # 20.27


    **Question:** Is C++ a superset of C? What are the differences between C and C++?
    Can I use a C++ compiler to compile C code?


    **Answer:** C++ was derived from C and is largely based on it, but some legal
    C constructs are not legal C++. Conversely, ANSI C inherited several features
    from C++, including prototypes and const, so neither language is really a subset
    or superset of the other.


    The most important feature of C++ not found in C is, of course, the extended structure
    known as a class, along with operator overloading, makes object-oriented programming
    convenient. There are several other differences and new features: Variables may
    be declared anywhere in a block; const variables may be true compile-time constants;
    structure tags are implicitly typedefed; and & parameter declaration requests
    pass by reference; and the new delete operators, along with per-object constructors
    and destructors, simplify dynamic data structure management. Classes and object-oriented
    programming introduce a host of new mechanisms: inheritance, friends, virtual
    functions, templates, etc. (This list of C++ features is not intended to be complete;
    C++ programmers will notice many omissions.)


    Some features of C++ that keep it from being a strict subset of C++ (that is,
    keep C programs from necessarily acceptable to C++ compilers) are that main may
    be called recursively, character constants are of type int, prototypes are not
    required, and void * implicitly converts to other pointer types. Also, every keyword
    in C++ that is not a keyword in C is available in C as an identifier; C programs
    that use words such as class and friend as ordinary identifiers will be rejected
    by C++ compilers.


    In spite of the differences, many C programs will compile correctly in a C++ environment,
    and many recent compilers offer both C and C++ compilation modes.'
