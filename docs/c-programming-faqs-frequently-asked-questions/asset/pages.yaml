  md: '# # Declarations and Initializations


    C''s declaration syntax is practically a little programming language in itself.
    A declaration consists of several parts (though not all are required); a storage
    class, a base type, type qualifiers, and finally the declarators (which may also
    contain initializers). Each declarator not only declares a new identifier but
    may also indicate that the identifier is to be an array, a pointer, a function,
    or some arbitrarily complicated combination. The underlying idea is that the declaration
    mimics the eventual use of the identifier. (Question 1.21 discusses this “declaration
    mimics use” relationship in more detail.)


    # ## Basic Types


    Some programmers are surprised to discover that even though C is a fairly low-level
    language, its type system is nevertheless mildly abstract; the sizes and representations
    of the basic types are not precisely defined by the language.'
  merge: -1
