  md: '# DECLARATIONS AND INITIALIZATIONS


    # 17


    C''s declarations can be confusing because they come in two parts: a base type
    and a declarator, which contains the identifier, or name, being declared. The
    declarator may also contain the characters *, [], and (), saying whether the name
    is a pointer to, array of, or function returning the base type, or some combination.*
    For example, in


    ```

    char *pc;

    ```


    the base type is char, the identifier is pc, and the declarator is *pc; this tells
    us that *pc is a char (this is what “declaration mimics use” means).

    One way to make sense of complicated C declarations is by reading them “inside
    out,” remembering that [] and () bind more tightly than *. For example, given


    ```

    char (*pfpc) ();

    ```


    we can see that pfpc is a pointer (the inner *) to a function (the ()) to char.
    When we later use pfpc, the expression (*pfpc) () (the value pointed to the return
    value of a function pointed to by pfpc) will be a char.

    Another way of analyzing these declarations is to decompose the declarator while
    composing the description, maintaining the “declaration mimics use” relationship:


    +   * (*pfpc) () is a char

    (*pfpc) () is a pointer to char

    (*pfpc) is a function returning pointer to char

    pfpc is a pointer to returning pointer to char


    If you''d like to make things clearer when declaring complicated types like these,
    you can make the analysis explicit by using a chain of typedefs, as in the preceding
    option 2.

    The pointer-to-function declarations in these examples have not included information
    about parameter type. When the parameters have complicated types, declarations
    can really get messy. (Modern versions of cdecl1 can help here,.)


    References: K&R2 $5.12 p. 122

    ANSI $3.5ff (esp. $3.5.4)

    ISO $6.5ff (esp. $6.5.4)

    H&S $4.5 pp. 85–92, $5.10.1 pp. 149–50


    *Furthermore, a storage class (static, register, volatile) may appear along with
    the base type, qualifiers (const, volatile) may be interspersed with both the
    type and the declarator. See also question 11.9.'
