  md: '# Structure Declarations


    Question: What''s the difference between these two declarations?


    ```

    struct x1 { ... };ntypedef struct { ... } x2;

    ```


    Answer: The first form declares a structure tag; the second declares a typedef.
    The main difference is that the second declaration is of a slightly more abstract
    type—its users don''t necessarily know it is a structure, and the keyword struct
    is not used when declaring instances of:


    +   x2 b;


    Structures declared with tags, on the other hand, must be defined with the


    ```

    struct x1 a;

    ```


    form.* (It''s also possible to play it both ways:


    ```

    typedef struct x3 { ... } x3;

    ```


    It''s legal, if potentially obscure, to use the same name for both the tag and
    the typedef, since they live in separate namespaces. See question 1.29.)


    Question: Why doesn''t this work?


    ```

    struct x { ... };nx x thestruct;

    ```


    Answer: C is not C++. Typedef names are not automatically generated for structure
    tags. Actual structures are declared in C with the struct keyword:


    ```

    struct x thestruct;

    ```


    > *It may be worth mentioning that this entire distinction is absent in C++ and
    perhaps in some C++ compilers masquerading as C compilers. In C++, structure tags
    are essentially declared as typedefs automatically.'
