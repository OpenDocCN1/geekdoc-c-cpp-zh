  md: '# DECLARATIONS AND INITIALIZATIONS


    Then, put an external declaration in a header (“h”) file and use include to bring
    the header and the declaration wherever needed. The .c file containing the definition
    should also include that same header file, so that the compiler can check that
    the definition matches the declarations.


    This rule promotes a high degree of portability: It is consistent with the requirements
    of the ANSI/ISO C Standard and is also consistent with most pre-ANSI compilers
    and linkers. (UNIX compilers and linkers typically use a “common model,” which
    allows multiple definitions as long as at most one is initialized; this behavior
    is mentioned as a “common extension” by the standard, no pun intended. A few old,
    nonstandard systems may require an explicit initializer to distinguish a definition
    from an external declaration.)


    It is possible to use preprocessor tricks to arrange that line like such


    ```

    DEFINE(int, i);

    ```


    need be entered only in one header file and turned into a definition or a declaration,
    depending on the setting of some macro. It’s not clear though, whether this is
    worth the trouble, especially since it’s usually a better idea to keep global
    variables as a minimum.


    It’s more than a good idea to put global declarations in header files: If you
    want the compiler to be able to catch inconsistent declarations for you, you must
    place them in header files. In particular, never place a prototype for an external
    function in a .c file; if the definition of the function ever changes, it would
    be too easy to forget to change the prototype, and an incompatible prototype is
    worse than useless.


    See questions 1.24, 10.6, 17.2, and 18.8.


