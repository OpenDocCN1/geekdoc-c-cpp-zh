  md: '# 12.36


    **Question:** I’m trying to write a program “more.” How can I get back to the
    interactive keyboard if stdin is redirected?


    **Answer:** There is no portable way of doing this. Under UNIX, you can open the
    special file /dev/tty. Under MS-DOS, you can try opening the “file” CON or use
    routines or BIOS calls, such as getch, that may go to the keyboard whether or
    not input is redirected.


    # "Binary" I/O


    A normal stream is assumed to consist of printable text and may undergo certain
    translations to match the conventions of the underlying operating system. When
    you want to read and write arbitrary bytes exactly, without any translations,
    you want “binary” I/O.


    # 12.37


    **Question:** I want to read and write numbers directly between files and memory
    a byte at a time, not as formatted characters the way fprintf and fscanf do. How
    can I do this?


    **Answer:** What you’re trying to do is usually called “binary” I/O. First, make
    sure that you are calling fopen with the “b” modifier (“rb”, “wb”, etc.; see question
    12.38. Then use the & & sizeof operators to get a handle on the sequences of bytes
    you are trying to transfer. Usually, the fread and fwrite functions are what you
    want to use; see question 2.11 for an example.


    Note, though, that fread and fwrite do not necessarily imply binary I/O. If you’ve
    opened a file in binary mode, you can use any I/O calls on it (see, for example,
    the examples in question 12.42); if you’ve opened it in text mode, you can use
    fread or fwrite if they’re convenient.


    Finally, note that binary data files are not very portable; see question 20.5.
    See also question 12.40.'
