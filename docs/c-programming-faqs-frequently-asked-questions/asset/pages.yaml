  md: '# Boolean Expressions and Variables


    C provides no formal, built-in Boolean type. Boolean values are just integers
    (though with greatly reduced range!), so they can be held in any integral type.
    C interprets a zero value as “false” and any nonzero value as “true.” The relational
    and logical operators, such as ==, !=, <, >=, &&, and |, return the value 1 for
    “true,” so 1 is slightly more distinguished as a truth value than the other nonzero
    values (but see question 9.2).


    # 9.1


    Question: What is the right type to use for Boolean values in C? Why isn’t it
    a standard type? Should I use #defines or enums for the true and false values?


    Answer: C does not provide a standard Boolean type, in part because one involves
    a space/time tradeoff that can best be decided by the programmer. (Using an int
    may be faster, whereas char may save data space.* Smaller types may make the generated
    code bigger or slower, though if they require lots of conversions to and from
    int.)


    *Bitfields may be even more compact; see also question 2.26. An unsigned bitfield
    would be required; a 1-bit signed bitfield cannot portant hold the value +1.'
