  md: '# 10 The C Preprocessor


    C''s preprocessor provides reasonable solutions to a number of software engineering
    and configuration management problems, although its syntax is unlike the rest
    of C in several respects. As its name suggests, the preprocessor operates *before*
    formal parsing and compilation begin. Because it doesn''t know the structure of
    the code as seen by the rest of the compiler, it cannot do any processing that
    relates to declared types or function structure.


    The first part of this chapter is arranged around the major preprocessor directives:
