  md: '# 20.4


    Question: What’s the right way to use errno?


    Answer: In general, you should detect errors by checking return values and de
    use errno only to distinguish among the various causes of an error, such as "File
    not found" or "Permission denied." (Typically, you will use perror or strerror
    to print these discriminating error messages.) It''s necessary to detect errors
    with errno only when a function does not have a unique, unambiguous, out-of-band
    return item (i.e., because all of its possible return values are valid; In these
    cases (and in these cases only; one example is atoi); check the documentation
    to be sure whether a function allows this), you can detect errors by setting errno.
    (Setting errno to 0 first is important, as no library function ever does that
    for you.)


    To make error messages useful, they should include all relevant information. Beside
    the text derived from errno, it may also be appropriate to print the name of the
    program, the operation that failed (preferably in terms that will be meaningful
    to the user), the name of the file which the operation failed, and if some input
    file (script or source file) is being read, the name and current line number of
    that file.


    See also question 12.24.


    +   References: ANSI $4.1.3, $4.9.10.4, $4.11.6.2

