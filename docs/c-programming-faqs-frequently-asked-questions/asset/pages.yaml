    int *aryp;

    int nrows, ncolumns;

    { array[i][j] is accessed as ayp[i * ncolumns + j] ... }

    ```


    Note that the correct expression for manual subscripting involves ncolumns (the
    “width” of each row), not nrows (the number of rows); it’s easy to get this by
    backward.


    This function could be called with the array from question 6.18 as


    ```

    f2(&array[0][0], NROWS, NCOLUMNS);

    ```


    It must be noted, however, that a program that performs multidimensional array
    subscripting “by hand” in this way is not in strict conformance with ANSI C standard;
    according to an official interpretation, the behavior of accessing (&array[0][0])
    [x] is not defined for x >= NCOLUMNS.


    The GNU C compiler allows local arrays to be declared having sizes that are specified
    by a function’s arguments, but this is a nonstandard extension.


    When you want to be able to use a function on multidimensional arrays of various
