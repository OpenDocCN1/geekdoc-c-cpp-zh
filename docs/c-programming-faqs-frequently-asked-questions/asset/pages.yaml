  md: 'If the standard were to attempt to define standard mechanisms for accessing
    things like keyboards and displays, it might seem to be a big convenience for
    programmers. But it would be a monumental task; There is already a huge variety
    of display devices and huge variation among the operating systems through which
    they are usually accessed. We cannot assume that the years to come will offer
    any variety.


    At one time, the common output device for C programs was a Teletype; later, it
    was a “dumb” terminal, and after that it was a “smart” VT100 or other ANSI X3.64-compatible
    terminal that today might be called “dumb.” Today, it''s likely to be a bitmapped
    color display screen. What will it be in five years? How will the operating systems
