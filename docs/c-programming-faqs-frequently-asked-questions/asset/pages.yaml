  md: '# 11 ANSI/ISO Standard C


    The release of the ANSI C Standard (X3.159-1989) in 1990 (now superseded by ISO
    9899:1990 and its ongoing revisions) marked a major step in C''s acceptance as
    a stable language. The standard clarified many existing ambiguities in the language,
    but it introduced a few new features and definitions that are occasionally troublesome.
    Misunderstandings also arise when an ambiguity was resolved contrary to someone''s
    experience or when people with pre-ANSI compilers try to use code written since
    the standard became widely adopted.


    Standard C can be referred to in several ways. It was originally written by a
    committee (X3J11) under the auspices of the American National Standards Institute,
    so it''s often called “ANSI C.” The ANSI Standard was adopted internationally
    by the International Organization for Standardization, so it''s sometimes called
    “ISO C.” ANSI eventually adopted the ISO version (superseding the original), so
    it''s now often called “ANSI/ISO C.” Unless you''re making a distinction about
    the wording of the original ANSI standard before ISO''s modifications, there''s
    no important difference between these terms, and it''s correct to simply refer
    to “the C standard” or “standard C.”'
