    ![](img/2b27505702f89a0fc85dc6e5851a2984_126_0.png)


    # 5.6


    Question: If NULL were defined as follows:


    ```

    #define NULL ((char*)0)

    ```


    wouldn''t make function calls that pass an uncast NULL work?


    Answer: Not in general. The problem is that some machines use different internal
    representations for pointers to different types of data. The suggested definition
    would make uncast NULL arguments to functions expecting pointers to characters
    work correctly, but pointer arguments of other types would still require explicit
    casts. Furthermore, such legal constructions as FILE = NULL; could fail.


    Nevertheless, ANSI C allows this alternative definition for NULL:


    ```

    #define NULL ((void*)0)

    ```


    Besidesides potentially helping incorrect programs to work (but only on machines
    with homogeneous pointers, this definition may catch programs that use NULL incorrectly
    (e.g., the ASCII NUL character was really intended; see question 5.9). See also
    question 5.7. Programmers who are accustomed to modern, “flat” memory architectures
    may find the idea of “different kinds of pointers” very difficult to accept. See
    question 5.17 for some examples.


    Reference: Rationale §4.1.5


    > *Because of the assignment properties of void * pointers, the initialization
    FILE *fp = NULL; is valid if NULL is defined as ((void*)0).'
