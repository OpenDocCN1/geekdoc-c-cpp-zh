  md: '# # 15 Variable-Length Argument Lists


    C provides a mechanism, not widely understood, that allows a function to accept
    a variable number of arguments. Variable-length argument lists are relatively
    rare but are vital in the context of C''s printf function and in related situations.
    (Variable-length argument lists are particularly troublesome because formal support
    for them arose only under the ANSI C Standard—prior to that standard, they were,
    strictly speaking, undefined.)


    Manipulating a variable-length argument list involves three steps. First, a special
    "pointer" variable of type va_list is declared and initialized to point to the
    beginning of the argument list by calling va_start. Next, arguments are retrieved
    from the variable argument list by calling va_arg, which'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'requires parameters the va_list pointer and an indication of the type of the
    argument being retrieved. Finally, when processing is completed, va_end is called
    to perform any cleanup. (The va_list type is here referred to as a “pointer” in
    quotes because it is not necessarily a true pointer; va_list is a typedef that
    hides the details of the actual data structure used.)


    Varargs functions may use special calling mechanisms, different from the ones
    used for conventional, fixed-argument functions. Therefore, a prototype must always
    be in scope before a varargs call (see question 15.1). However, a prototype obviously
    cannot specify the number and type(s) of the variable arguments. Therefore, the
    variable arguments receive the “default argument promotions” (see question 15.2),
    and no type checking can be performed (see question 15.3).


    # Calling Varargs Functions


    # 15.1


    Question: I heard that you have to include <stdio.h> before calling printf. Why?


    Answer: So that a proper prototype for printf will be in scope.


    A compiler may use a different calling sequence for functions that accept variable-length
    argument lists. (It might do so if calls variable-length argument lists were less
    efficient than using fixed length.) Therefore, a prototype (using the ellipsis
    “...” to indicate that the argument list is of variable length) be in scope whenever
    a varargs function is called, so that the compiler knows to use the varargs calling
    mechanism.


    References: ANSI $3.3.2.2, $4.1.6

    ISO $6.3.2.2, $7.1.7

    Rationale $3.3.2.2, $4.1.6

    H&S $9.2.4 pp. 268–9, $9.6 pp. 275–6'
