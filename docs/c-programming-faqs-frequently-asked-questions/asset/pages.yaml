    # 4.2


    Question: I''m trying to declare a pointer and allocate some space for it, but
    it''s not working. What''s wrong with this code?


    ```

    char *p;

    *p = malloc(10);

    ```


    Answer: The pointer you declared is p, not *p. To make a pointer somewhere, you
    just use the name of the pointer:


    ```

    p = malloc(10);

    ```


    It''s when you''re manipulating the pointed-to memory that you use * as an indirection
    operator:


    ```

    *p = ''H'';

    ```


    It''s easy to make the mistake shown in the question, though, because you had
    used the malloc call as an initializer in the declaration of a local variable,
    it would have looked like this:


    ```

    *p = malloc(10);

    ```


    When you break an initialized pointer declaration up into a declaration and a
    later assignment, you have to remember to remove the *.


    In summary, in an expression, *p is the pointer, and *p is what it points to (a
    char, in this example).


    See also CT&P 1.21, 7.1, and 8.3.'
