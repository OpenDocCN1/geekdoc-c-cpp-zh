    To understand why the curious pointer conversions in a qsort comparison function
    are (and why a cast of the function pointer when calling qsort can''t help), it''s
    useful to think about how qsort works: It doesn''t know anything about the type
    or representation of the data being sorted; it just shuffles around chunks of
    memory.(All it knows about the chunks is its size, which you specify in qsort''s
    third argument.) To determine which chunks need swapping, qsort calls your comparison
    function. (To swap them, it uses the equivalent of memcpy)


    Since qsort deals in a generic way with chunks of memory of unknown type, it uses
    generic pointers (void *) to refer to them. When qsort calls your comparison function,
    it passes as arguments two generic pointers to the chunks to be compared. Since
    it passes generic pointers, your comparison function must accept generic pointers,
    and it must convert the pointers back to their appropriate type before manipulating
    them (i.e., before performing the comparison). A void pointer is not the same
    as a structure pointer; on some machines, it may have a different size or representation
    (which is why these casts are required for correctness).


    Suppose you were sorting an array of structures and had a comparison function
    accepting structure pointers:


    ```

    int mywrongstructcmp(struct mystruct *, struct mystruct *);

    ```


    If you called qsort as


    ```

    qsort(dates, ndates, sizeof(struct mystruct),

    (int (*) (const void *, const void *))mywrongstructcmp);

    /* WRONG */

    ```


    the cast (int (*) (const void *, const void *)) would do nothing except, perhaps
    silence, the message from the compiler telling you that this comparison function
    may not work with qsort. The implications of any cast you use when calling qsort
    will have been forgotten by the time qsort gets around calling your comparison
    function: It will call them with const void * arguments, so that is what your
    function must accept. No prototype-mechanism exists that could operate inside
    qsort to convert the void pointers to struct mystruct pointers just before calling
    mywrongstructcmp.'
