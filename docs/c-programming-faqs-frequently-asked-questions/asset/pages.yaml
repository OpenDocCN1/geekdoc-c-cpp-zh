    # Miscellaneous Language Features


    # 20.19


    Question: Are the outer parentheses in return statements really optional?


    Answer: Yes.


    Long ago, in the early days of C, they were required, and just enough people learned
    C then, and wrote code that is still in circulation, that notion that they might
    still be required is widespread.

    (As it happens, parentheses are optional with the sizeof operator, too, as long
    as its operand is a variable or a unary expression.)


