  md: 'Another ANSI-compatible lint (which can perform higher-level formal verification)
    is LCLint, available via anonymous ftp from larch.lcs.mit.edu in pub/Larch/lint/


    In the absence of lint, many modern compilers do attempt to diagnose as many problems
