    A better way to unpack external structures is with code like this:


    ```

    unsigned char *p = buf;

    s.c = *p++;

    s.i32 = (long)p++ << 24;

    s.i32 = (long)p++ << 16;

    s.i32 |= (unsigned)p++ << 8;

    s.i32 |= *p++;

    ```


    This code also gives you control over byte order. (This example, though, assumes
    that a char is 8 bits and that the long int and int being unpacked from the “external
    structure” are 32 and 16 bits, respectively.) See question 12.42 (which contains
    some similar code) for a few explanations and caveats.


