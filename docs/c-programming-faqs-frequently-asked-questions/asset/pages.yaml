  md: '# GLOSSARY 367


    Ivalue n. Originally, an expression that could appear on the left-hand sign of
    an assignment operator; hence, something that can perhaps be assigned to. More
    precisely, something that has a location, as opposed to a transient value. In
    the assignment


    ```

    a = b;

    ```


    a is an Ivalue and is not fetched but is written to. Compare rvalue. See also
    question 6.7. See ANSI §3.2.2.1 (especially footnote 31) or ISO §6.2.2.1. mask
    1. n. An integer value interpreted specifically as a pattern of 1s and 0s which
    to perform bitwise operations (&, |, etc.). 2 vt. To select certain bits using
    a mask (sense 1) and a bitwise operator. See question 20.7. member n. One of the
    typed components of a structure or a union.


    namespace n. A context within which names (identifiers) may be defined. There
    are several names in C; for example, an ordinary identifier can have the same
    name as a structure tag, without ambiguity. See question 1.29. narrow adj. Refers
    to a type that is widened under the default promotions: char, short, or float.
    nonentrant adj. Refers to a piece of code that makes use of static memory or temporarily
    leaves global structures in an inconsistent state, such that it cannot be safely
    called while another instance of it is already active. (That, it cannot be called
    from an interrupt handler, it might have been the code interrupted.) “notreated”
    interj. A directive indicating to lint or some other program checker that control
    flow cannot reach a particular point and that certain warnings (e.g., “control
    falls off end of function without return”) should therefore be suppressed. See
    question 11.12.


    null pointer n. A distinguished pointer value that is not the address of any object
    or function. See question 5.1. null pointer constant n. An integral constant expression
    with value 0 (or such an expression cast to use *), should request a null pointer.
    See question 5.2.


    O(n) adj. A notation referring to the “order” or computational complexity of an
    algorithm. O(n) algorithms take time roughly proportional to the number of items
    operated on. O(n²) algorithms take time proportional to the square of the number
    of items, etc.


    object n. Any piece of data that can be manipulated by a C program: a simple variable,
    an array, a structure, a piece of allocated memory, etc. See also object pointer
    n. A pointer to any object or incomplete type. Compare function pointer.


    octet n. An 8-bit quantity. Compare byte. opaque adj. Refers to a data type intended
    to abstract: code using the type is not supposed to know how the type is implemented
    (whether it is a simple type or a structure or if a structure, what fields it
    contains). See question 2.4.'
