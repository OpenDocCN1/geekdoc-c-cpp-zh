    | Format | printf | scanf |

    | --- | --- | --- |

    | %c | int | char * |

    | %d, %i | int | int * |

    | %o, %u, %x | unsigned int | unsigned int * |

    | %ld, %li | long int | long int * |

    | %lo, %lu, %lx | unsigned long int | unsigned long int * |

    | %hd, %hi | int | short int * |

    | %ho, %hu, %hx | unsigned int | unsigned short int * |

    | %e, %f, %g | double | float * |

    | %le, %lf, %lg | n/a | char * |

    | %s | n/a | char * |

    | %[...] | void * | void ** |

    | %p | int * | int * |

    | %n | none | none |


    (Strictly speaking, %lf is undefined under printf, although many systems probably
    accept it. To ensure portability, always use %f.)

