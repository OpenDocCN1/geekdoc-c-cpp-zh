    But if the %d conversion did not leave the unmatched character on the input stream,
    s would incorrectly read "ODE" instead of "CODE". (The problem is that scanning-length
    numeric constant or alphanumeric identifier, you never know where it ends until
    you''ve read "too far." This is one reason that unget exists.)


