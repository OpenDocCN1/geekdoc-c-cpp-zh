  md: '# 344 CHAPTER 20


    +   - Use pointers rather than array subscripts to step through arrays (but see
    question 20.14).


    +   - Reduce precision. (Using float instead of double may result in faster, single-precision
    arithmetic under an ANSI compiler, although other compilers convert everything
    to double, so using float can also be slower.) Replace time-consuming trigonometric
    and logarithmic functions with your own, tailored to the range and precision you
    need, and perhaps using table lookup. (Be sure you use your versions different
    names; see question 1.29).


    +   - Cache or precompute tables of frequently needed values. (See also question
    20.12).


    +   - Use standard library functions in preference to your own. (Sometimes, the
    compiler inlines or specially optimizes its own functions.) On the other hand,
    if your program''s calling patterns are particularly regular, your special-purpose
    implementation may be able to beat the library''s general-purpose version. (Again,
    if you write your own version, give it a different-name.)


    +   - As a last, last resort, hand code critical routines in assembly language
    (or hand tune the compiler''s assembly language output). Use asm directives, if
    possible.


    Here are some things not to worry about:


    +   - whether i << is faster than i = i + 1


    +   - whether i * 1 (or i >> 1, or i & 1) is faster than i * 2 (respectively i
    / 2, i % 2)


    (These are examples of optimizations that compilers regularly perform for you;
    see questions 20.14 and 20.15).


    It is not the intent here to suggest that efficiency can be completely ignored.
    Most of the time, however, by simply paying attention to good algorithm choices,
    implementing them cleanly, and avoiding obviously inefficient blunders (i.e.,
    make sure you don''t end up with an O(n³) implementation of an O(n²) algorithm),
    perfectly acceptable results can be achieved.


    For more discussion of efficiency tradeoffs, as well as good advice on how to
    improve efficiency when it is important, see Chapter 7 of Kernighan and Plauger''s
    Elements of Programming Style and Jon Bentley''s Writing Efficient Programs.


    See also question 17.11.'
