  md: '3. Use whatever pointer manipulations and library functions are handy to parse
    the line in an ad hoc way. (The ANSI strtol and strtod functions are particularly
    useful for this style of parsing because they can return a pointer indicating
    where they stopped reading.) This is obviously the most general way, but it''s
    also the most difficult and error-prone: The thorniest parts of many C programs
    are those that use lots of tricky pointers to pick apart strings.


    When possible, design data files and input formats so that they don''t require
    arcane manipulations, but can instead be parsed with easier techniques, such as
    1 and 2. Dealing with the files will then be much more pleasant all around.


    # scanf Problems


    Though it seems to be an obvious complement to printf, scanf has a number of fundamental
    limitations that lead some programmers to recommend avoiding it entirely.


    # 12.17


    Question: When I read numbers from the keyboard with scanf and a "%d\n" format,
    like this:


    ```

    int n;

    scanf("*%d\n", &n);

    printf("you typed %d\n", n);

    ```


    it seems to hang until I type one extra line of input. Why?


    Answer: Perhaps surprisingly, \n in a scanf format string does not mean to expect
    a newline but rather to read and discard characters as long as each is a whitespace
    character. (In fact, any whitespace character in a scanf format string means to
    read and discard whitespace characters. Furthermore, formats such as %d also discard
    leading whitespace, so you usually don''t need explicit whitespace in scanf format
    strings at all.)'
