  md: '# CHAPTER 8


    Traditionally, a byte is not necessarily 8 bits but merely a smallish region of
    memory, usually suitable for storing one character. The C standard follows this
    usage, so the bytes used by malloc and sizeof can be more than 8 bits.* (The standard
    does not allow them to be less.)


