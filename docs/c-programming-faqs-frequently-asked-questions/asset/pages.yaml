  md: '# 18.5


    Question: How can I shut off the “warning: possible pointer alignment problem”
    message that lint gives me for each call to malloc?


    Answer: The problem is that traditional versions of lint do not know, and cannot
    be told, that malloc “returns a pointer to space suitably aligned for storage
    of any type of object.” It is possible to provide a pseudoimplementation of malloc,
    using a #define inside of #ifdef lint, which effectively shuts this warning off,
    but a simpleminded definition will also suppress meaningful messages about truly
    incorrect invocations. It may be easier to ignore the message, perhaps in an automated
    way with grep -v. (But you don’t get in the habit of ignoring too many lint messages;
    otherwise, one day you’ll overlook a significant one.)


    # 18.6


    Question: Can I declare main as void to shut off these annoying “main returns
    no value” messages?


