    Section 4.1.5 of the C standard states that NULL “expands to an implementation-defined
    null pointer constant,” which means that the implementation gets to choose which
    form of 0 to use and whether to use a void *cast; see questions 3.6 and 5.7. “Implementation-defined”
    here does not mean that NULL might be defined to match an implementation-specific
    internal null pointer value.


    See also questions 5.2, 5.10, and 5.17.


    References: ANSI §4.1.5

    ISO §7.1.6

