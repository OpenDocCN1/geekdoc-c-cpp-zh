    # 19.38


    Question: How can I trap or ignore keyboard interrupts like control-C?


    Answer: The basic step is to call signal, either as


    ```

    #include <signal.h>

    signal(SIGINT, SIG_IGN);

    ```


    to ignore the interrupt signal, or as


    ```

    extern void func(int);

    signal(SIGINT, func);

    ```


    to cause control to transfer to function func on receipt of an interrupt signal.

    On a multitasking system such as UNIX, it''s best to use a slightly involved technique:


    ```

    extern void func(int)

    if(signal(SIGINT, SIG_IGN) != SIG_IGN)

    signal(SIGINT, func);

    ```


    > *Actually, there may be several different keyboard interrupts. referred to as
    SIGINT is generated by control-C. UNIX systems also have SIGQUIT, usually generated
    by control-\although both SIGINT and SIGQUIT can in fact be bound to any key).
    MS-DOS systems also have control-Break, which usually results in SIGINT. On the
    Macintosh, SIGINT is sometimes generated by command-period.'
