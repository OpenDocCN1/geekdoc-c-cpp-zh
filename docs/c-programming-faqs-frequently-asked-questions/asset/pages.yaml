    # 18.8


    **Question:** Don''t ANSI function prototypes render lint obsolete?


    **Answer:** Not really. Prototypes work only if they are present and correct;
    an inadvertently incorrect prototype is worse than useless. Furthermore, lint
    checks consistency across multiple source files and checks both data declarations
    and functions. Finally, an independent program like lint will probably always
    be more scrupulous at enforcing complete, portable coding practices than will
    any particular, implementation-specific, feature- and extension-laden compiler.


    If you do want to use function prototypes instead of lint for cross-file consistency
    checking, make sure that you set the prototypes up correctly in header files.
    See questions 1.7 and 10.6.


