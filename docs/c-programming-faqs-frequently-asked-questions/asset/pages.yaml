  md: '# Typedefs


    Although it is syntactically a storage class, the typedef keyword is, as its name
    suggests, involved in defining new type names, not new functions or variables.


    **Question:** What''s the difference between using a typedef or a preprocessor
    macro for a user-defined type?


    **Answer:** In general, typedefs are preferred, in part because they can correctly
    encode pointer types. For example, consider these declarations:


    ```

    typedef char *String_t;

    #define String_d char *

    String_t s1, s2;

    String_d s3, s4;

    ```


    In these declarations, s1, s2, and s3 are all declared as char *, but s4 is declared
    as a char, which is probably not the intention. (See also question 10.15.)


    Preprocessor macros do have the advantage that #ifdef works on them (see also
    question 10.15). On the other hand, typedefs have the advantage that they obey
    scope rules (that, they can be declared local to a function or a block).


    See also questions 1.17, 2.22, 11.11, and 15.11.


    References: K&R1 $6.9 p. 141

    K&R2 $6.7 pp. 146–7

    CT&P $6.4 pp. 83–4'
