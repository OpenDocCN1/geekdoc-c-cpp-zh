    **Question:** My program is crashing, apparently somewhere inside malloc(s), although
    I can''t see anything wrong with it. What''s wrong?


    **Answer:** It is unfortunately very easy to corrupt malloc''s internal data structures,
    and the resulting problems can be stubborn. The most common source of problems
    is writing more to a malloc region than it was allocated to hold; a particularly
    common bug is to call malloc(strlen(s)) instead of strlen(s) + 1.\* Other problems
    involve involving pointers to free storage (see question 7.20), allocating 0-sized
    objects (see question 11.26), reallocating null pointers (see question 7.30),
    and freeing pointers that were not obtained from malloc, that are null, or have
    already been freed. (A few of these are sanctioned by the standard: on an ANSI-compatible
    system, you may safely allocate 0-sized objects and reallocate null pointers,
    although older implementations often have problems.) Consequences of any of these
    errors can show long after the actual mistake and in unrelated sections of code,
    making diagnosis of the problem quite difficult.


    Most implementations of malloc are particularly vulnerable to these problems because
    they store crucial pieces of internal information directly adjacent to the blocks
    of memory they return, making them easy prey for stray user pointers.

    See also questions 7.15, 7.26, 16.8, and 18.2.


    # Freeing Memory


    Memory allocated with malloc can persist as long as you need it. It is never deallocated
    automatically (except when your program exits; see question 7.24). When your program
    uses memory on a transient basis, it can—and should—recycle it by calling free.


