  md: 'In any case, it''s really too late to be worrying about this sort of thing
    now. The choices of = for assignment and == for comparison were made, rightly
    or wrongly, over two decades ago and are not likely to be changed. (With respect
    to the question, many compilers and versions of lint warn about if (a = b) and
