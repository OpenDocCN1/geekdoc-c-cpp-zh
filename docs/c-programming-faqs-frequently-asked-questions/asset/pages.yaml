  md: '# Files and Directories


    # 19.11


    Question: How can I check whether a file exists? I want to warn the user if a
    requested input file is missing.


    Answer: It''s surprisingly difficult to make this determination reliably and portable.
    Any test you make can be invalidated if the file is created or deleted (i.e.,
    by some other process) between the time you make the test and the time you try
    to open the file.


    Three possible test routines are stat, access, and fopen.(To make an approximate
    test for file existence with fopen, just open for reading and close immediately.)
    Of these, only fopen is portable, and access, where it exists, must be used carefully
    if the program uses the UNIX set-UID feature.


    Rather than trying to predict in advance whether an operation such as opening
    a file will succeed, it''s often better to try it, the return value, and complain
    if it fails.(Obviously, this approach won''t work if you''re trying to avoid overwriting
    an existing file, unless you''ve got something like the O_EXCL file option available,
    which does just what you want in this case.)


    References: PCS §12 pp. 189, 213 POSIX §5.3.1, §5.6.2, §5.6.3


    # 19.12


    Question: How can I find out the "size of a file" prior to reading it in?


    Answer: If the "size of a file" is the number of characters you will be able to
    read from it in C (or that were written to it by a previous program), it is difficult
    or impossible to determine this number exactly (other than by reading the whole
    file).


    Under UNIX, the stat call (specifically, the st_size field of the structure) will
    give you an exact answer.* Several other systems supply a UNIX-like stat call,
    but the sizes reported for text files may be approximate


    > *Unless some process is writing to the file, that is.'
