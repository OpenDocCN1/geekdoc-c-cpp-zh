    The second sentence can be quite difficult to understand. It turns out that it
    allows a[i] = i++ from question 3.1. (In fact, the other expressions we''ve been
    discussing also violate the second sentence.) To see why, let''s first look more
    carefully at what the standard is trying to allow and disallow.


    Clearly, expressions like a = b and c = d + e that read some values and use them
    to write others, are well defined and legal. Clearly, *expressions like i = i++
    that modify the same value are abominations that needn''t be allowed (or in any
    case, needn''t be well defined, i.e., we don''t to figure out a way to say they
    do, and compilers have nothing to support them). Expressions like these are disallowed
    by the first sentence.


    It''s also clear that we''d like to disallow expressions a[i] = i++ that modify
    i and use it along the way, but not disallow expressions like i = i + 1 that modify
    i and only modify it later when it''s reasonably easy to ensure the final store
    of the final value (into i, in this case) doesn''t interfere with the later accesses.


    And that''s what the second sentence says: If an object is written within a full
    expression, and any accesses to it within the same expression must be for the
    purposes of computing the value to be written. This rule effectively constrains
    legal expressions to those in which the accesses demonstrably precede the modification.
    The old stand-by i = i + 1 is allowed because the access of i is used to determine
    i''s final value. The example a[i] = i++ is nothing to the value that ends up
    being stored in i (which happens over in i++) is disallowed because one of the
    accesses of i (the one in a[i]) has nothing to do with the value that ends up
    being stored in i and so there''s no good way to define—for either our understanding
    or the compiler—whether the access should take place before or after the increment
    value is stored. Since there''s no good way to define it, the standard declares
    it is undefined and portable programs simply must not use such structures.


    See also questions 3.9 and 3.11.


