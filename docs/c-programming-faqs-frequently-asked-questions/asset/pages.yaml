    # 127


    can probably assume that as a quality of implementation issue, most implementations
    will not go out of their way to generate exceptions for innocuous pointers, the
    standard is clear in saying that nothing is guaranteed, and such exceptions would
    be quite natural under some system architectures.


    When pointers are repeatedly allocated and freed within a program, it is often
    useful to set them to NULL immediately after freeing them, to explicitly record
    their store.


    References: ANSI $4.10.3

    ISO $7.10.3

    Rationale $3.2.2.3


    # 7.22


    Question: When I call malloc to allocate memory for a local pointer, I have to
    explicitly free it?


    Answer: Yes. Remember that a pointer is different from what it points to. Local
    variables* are deallocated when the function returns, but in the case of a pointer
    variable, this means that the pointer is deallocated, not what it points to. Memory
    allocated with malloc always persists until you explicitly free it. (If the only
    pointer to a block of memory is a local pointer and if that pointer disappears,
    that block cannot be freed.) In general, for every call to malloc, there should
    be a corresponding call to free.


    # 7.23


    Question: I''m allocating structures containing pointers to other dynamically
    allocated objects. When I free a structure, do I have to free each subsidiary
    pointer?


    Answer: Yes. The malloc and free functions know nothing about structure declarations
    or the contents of allocated memory; they especially do not know whether allocated
    memory contains pointers to other allocated memory. In general, you must arrange
    that each pointer returned from malloc be individually passed to free, exactly
    once (if it is freed at all).


    *Strictly speaking, it is automatic variables that are deallocated when a function
    returns.'
