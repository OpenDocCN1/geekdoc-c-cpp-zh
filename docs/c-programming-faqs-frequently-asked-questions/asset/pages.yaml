    (The Standards and Guidelines book is not in fact a style guide but rather a set
    of guidelines on selecting and creating style guides.)


    # 17.10


    Question: Some people say that goto statements are evil and that I should never
    use them. Isn''t that a bit extreme?


    Answer: Programming style, like writing style, is somewhat of an art and cannot
    be codified by inflexible rules, although discussions about style often seem to
    center exclusively on such rules.


    In the case of the goto statement, it has long been observed that unfettered use
    of goto leads to unmaintainable spaghetti code. However, a simple, unthinking
    ban on the goto statement does not necessarily lead immediately to beautiful programming:
    An unstructured programming is just capable of constructing a Byzantine tangle
    without any goto (perhaps substituting nested loops and Boolean control variables
    instead). Many programmers adopt the moderate stance that goto are usually to
    be avoided in a few well-constrained situations, if necessary: multilevel break
    statements, to coalesce common actions inside a switch statement, or to cleanup
    tasks with several error returns.


    Most observations or “rules” about programming style (Structured Programming is
    Good, goto is Bad, functions should fit on one page, etc.) usually work better
    as guidelines as rules and much better if programmers understand what the guidelines
    are trying to accomplish. Blindly avoiding certain constructs or following rules
    without understanding them can lead to as many problems as the rules were supposed
    to avert.


    Furthermore, many opinions on programming style are just that: opinions. They
    may be strongly argued and strongly, they may be backed up by solid-seeming evidence
    and arguments, but the opposing opinions may be as strongly felt, supported, and
    argued. It’s usually futile to get dragged into “style wars,” because on certain
    issues (as referred to in questions 5.3, 5.9, 9.4, and 10.7), opponents can never
    seem to agree or disagree or stop arguing.'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'Finally, as William Strunk has written (quoted in the introduction to Strunk
    and White’s classic Elements of Style):


    It is an old observation that the best writers sometimes disregard the rules of
    rhetoric. When they do, however, the reader will usually find in the sentence
    some compensating merit, attained at the cost of the violation. Unless he is certain
    of doing well, he will probably do best to follow the rules.


    References: Dijkstra, "Go To Statement Considered Harmful"

    Knuth, "Structured Programming with goto Statements"


    # 17.11


    Question: People always say that good style is important, but when they go out
    of their way to use clear techniques and make their programs readable, they seem
    to end up with less efficient programs. Since efficiency is so important, isn''t
    it necessary to sacrifice some style and readability?


    Answer: It’s true that grossly inefficient programs are a problem, but the blind
    zeal with which many programmers often chase efficiency is also a problem. Cumbersome,
    obscure programming tricks not only destroy readability and maintainability but
    may also lead to slimmer long-term efficiency improvements than would more appropriate
    design or algorithm choices. With care, it is possible to design code that is
    both clean and efficient.

    See also question 20.13.'
