  md: 'When you find yourself needing to insert data into an existing file, here are
    a few alternatives you can try:


    +   - Rearrange the data file so that you can append the new information at the
    end.

    - Put the information in a second file.

    - Leave some blank space (e.g. a line of 80 spaces or a field like 0000000000)
    in the file when it is first written and overwrite it later with the final information
    (see also question 12.30).


    Instead of deleting records, you might consider just marking them as “deleted”
    and having the code that reads the file ignore them. (You could run a separate
    coalescion program once in a while to rewrite the file, finally discarding the
    deleted records).


    See also questions 12.30 and 19.13.


    # 19.15


    **Question:** How can I recover the file name given an open stream or file descriptor?


    **Answer:** This problem is generally insoluble. Under UNIX, for instance, a scan
    of the entire disk (perhaps involving special permissions) would theoretically
    be required and would fail if the descriptor were connected to a pipe or referred
    to a deleted file (and could give a misleading answer for a file with multiple
    links). It is best to remember the names of files yourself when you open them
    (perhaps with a wrapper function around fopen).


