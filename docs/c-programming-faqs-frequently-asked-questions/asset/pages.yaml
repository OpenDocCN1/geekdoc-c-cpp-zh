    \ some fixed number of arguments. A varags function merely has the capability\
    \ of accepting a different length of argument list with each call.) If you want\
    \ to call a function with a list of arguments created on the fly at run time,\
    \ you can't do so portably.\n\n# 15.12\n\n**Question:** How can I write a function\
    \ that takes a variable number of arguments and passes them to another function\
    \ (which takes a variable number of arguments)?\n\n**Answer:** In general, you\
    \ cannot. Ideally, you should provide a version of that other function that accepts\
    \ a va_list pointer.\n\nSuppose you want to write a faterror function that will\
