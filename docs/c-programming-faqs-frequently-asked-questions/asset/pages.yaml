    # Compliance


    Obviously, the whole point of having a standard is so that programs and compilers
    can be compatible with it (and therefore with each other). Compatibility is not
    a simple black-or-white issue, however: There are degrees of compliance, and the
    scope of the standard’s definitions is not always as comprehensive as might be
    expected. In keeping with the “spirit of C,” several issues are not precisely
    specified; portable programs must simply avoid depending on these issues.


    # 11.33


    Question: People seem to make a point of distinguishing among implementation-defined,
    unspecified, and undefined behavior. What do these terms mean?


    Answer: First of all, all three of these represent areas in which the C standard
    does not specify exactly what a particular construct, or a program that uses it,
    must do. This looseness in C’s definition is traditional and deliberate:'
