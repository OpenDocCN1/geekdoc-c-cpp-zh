    **Question:** What is NULL and how is it defined?


    **Answer:** As a matter of style, many programmers prefer not to have unadorned
    0s—some representing numbers and some pointers—the preprocessor macro NULL is
    scattered through their programs, including <stdio.h> and <stddef.h>, with the
    value 0, possibly cast to (void *) (see also question 5.6). A programmer who wishes
    to make explicit the distinction between 0 and the 0 null pointer constant can
    then use NULL whenever a null pointer is required.


