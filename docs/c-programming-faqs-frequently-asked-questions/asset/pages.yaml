  md: '# CHAPTER 1


    # 1.1


    Question: How should I decide which integer type to use?


    Answer: If you might need large values (above 32,767 or below −32,767), use long.
    Otherwise, if space is very important (i.e., if there are large arrays or many
    structures), use short. Otherwise, use int. If well-defined overflow characteristics
    are important and negative values are not, or if you want to clear of sign-extension
    problems when manipulating bits or bytes, use one of the corresponding unsigned
    types. (Beware when mixing signed and unsigned values in expressions, though;
    see question 3.19.)


    Although character types (especially unsigned char) can be used as “tiny”, doing
    so is sometimes more trouble than it’s worth. The compiler will have to emit extra
    code to convert between char and int (making the executable larger), and unexpected
    sign extension can be troublesome. (Using unsigned char can help; see question
    12.1 for a related problem).


    A similar space/tradeoff applies when deciding between float and double. (Many
    compilers will convert all float values to double during expression evaluation.)
    None of the above rules apply if the address of a variable is taken and must have
    a particular type.


    It’s often incorrectly assumed that C’s types are defined to have certain, exact
    sizes. In fact, what’s guaranteed is that:


    +   * type char holds values up to 127;

    * types short int and int can hold values up to 32,767;

    * type long int can hold values up to 2,147,483,647; and

    * the sizes follow the obvious progression:


    ```

    sizeof(char) <= sizeof(short) <= sizeof(int) <= sizeof(long)

    ```


    These values imply that int is at least 8 bits, short and int are at least 16
    bits, and int is at least 32 bits. (The signed and unsigned versions of each type
    are guaranteed to have the same size.) Under ANSI C, the maximum and minimum values
    for a particular machine can be found in the header file <limits.h> and are summarized
    in the following table:


    | Base type | Minimum size (bits) | Minimum value (signed) | Maximum value (signed)
    | Maximum value (unsigned) |

    |---|---|---|---|--|

    | char | 8 | -127 | 127 | 255 |

    | short | 16 | -32,767 | 32,767 | 65,535 |

    | int | 16 | -32,767 | 32,767 | 65,535 |

    | long | 32 | -2,147,483,647 | 2,147,483,647 | 4,294,967,295 |


    *'
  merge: -1
