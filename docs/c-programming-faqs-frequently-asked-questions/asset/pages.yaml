    # 19.13


    Question: How can a file be shortened in place without completely clearing or
    rewriting it?


    Answer: BSD systems provide ftruncate, several others supply fsize, and a few
    may provide a (possibly undocumented) fcntl option F_FREESP. Under MS-DOS, you
    can sometimes use write(fd, "", 0). However, there is no portable solution, or
    a way to delete blocks at the beginning. See also question 19.14.


    # 19.14


    Question: How can I insert or delete a line (or record) in the middle of the file?


    Answer: In general, there is no way to do this.* The usual solution is simply
    to rewrite the file.


    *If your operating system provides nonsequential, record-oriented files, it probably
    has insert/delete operations, but C provides no particular support.'
