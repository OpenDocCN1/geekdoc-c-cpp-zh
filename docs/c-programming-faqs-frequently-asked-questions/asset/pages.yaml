    \ split up the existing error function to create a new version that accepts not\
    \ a variable argument list but a single va_list pointer. (Note that doing so is\
    \ little extra work, because verror contains much of the code that used to be\
    \ in error, and the new error becomes a simple wrapper around verror.)"
