    ```


    Answer: The subexpression i++ causes a side effect—it modifies i’s value—which
    leads to undefined behavior, since i is also referenced elsewhere in the same
    expression. There is no way of knowing which reference will happen before or after
    the side effect—in fact, neither obvious interpretation might hold; see question
    3.9. (Note that although the language in K&R suggests the behavior of this expression
    is unspecified, the C standard makes the stronger statement that it is undefined—see
    question 11.33.)


