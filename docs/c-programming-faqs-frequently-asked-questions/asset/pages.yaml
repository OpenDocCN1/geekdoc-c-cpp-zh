  md: '# Preface


    At some point in 1979, I heard a lot of people talking about this relatively new
    language, C, and the book that had just come out about it. I bought a copy of
    K&R, otherwise known as The C Programming Language, by Brian Kernighan and Dennis
    Ritchie, but it sat on my shelf for a while because I didn''t have an immediate
    need for it (besides which I was being a busy college freshman at the time). It
    proved in the end to be an auspicious purchase, though, when I finally did it
    up, I never put it down: I''ve been programming in C ever since.

    In 1983, I came across the Usenet newsgroup net.lang.c, which was (and its successor
    comp.lang.c still is) an excellent place to learn a lot about C, to find out what
    everyone else is having about C, and to discover that you may not know all there
    is to know C after all. It seems that C, despite its apparent simplicity, has
    a number of decidedly nonobvious aspects, and certain questions come over and
    over again. This book is a collection of some of those questions, with answers,
    based on the Frequently Asked Questions ("FAQ") list I began posting to comp.lang.c
    in May 1990.

    I hasten to add, however this book is not intended as a critique or "hatch job"
    on the C language. It is all too easy to blame a language (or any tool) for the
    difficulties users encounter with it or to claim that a properly designed tool
    "ought" to prevent its users from misusing it. It would therefore be easy to regard
    a book like this, with its lists of misuses, a litany of woes attempting to show
    that the language is hopelessly deficient. Nothing could be farther from the case.

    I would never have learned enough about C to be able to write this book, and I
    would not be attempting to make C more pleasant for others to use by writing this
    book now, if I did not think that C is a great language or if I did not enjoy
    programming in it. I do like C, and one of the reasons I teach classes in it and
    I spend time participating in discussion about it on the Internet is that I would
    like to discover which aspects of C (or programming in general) are difficult
    to learn or keep people from being able to program efficiently and effectively.
    This book represents some of what I''ve learned: These'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# PREFACE


    questions are certainly some of the ones people have the most trouble, and the
    answers have been refined over several years in an attempt to ensure that people
    don''t have too much trouble with them.


    A reader will certainly have trouble if there are any errors in these answers,
    and although the reviewers and I have worked hard to eliminate them, it can be
    as difficult to eradicate the last error from a large manuscript as it is to stamp
    out the last bug in a program. I would appreciate any corrections or suggestions
    sent to me in care of the publisher or at the e-mail address given, and I would
    like to offer the customary $1.00 reward to the first finder of any error. If
    you have access to the Internet, you can check for an errata list (and a scorecard
    of the finders) at the ftp and http addresses mentioned in question 20.40.


    As I hope I made clear, this book is not a critique of the C programming language,
    nor is it a critique of the book which I first learned C or that book''s authors.
    I didn''t learn C from K&R; I also learned a lot about programming. As I contemplate
    my own contribution to the C programming literature, my only regret is that the
    present book does not live up to a nice observation made in the second edition
    of K&R, namely, that “C” is not a big language, and it is not well served by a
    big book. I hope that those who most deeply appreciate C''s brevity and precision
    (and that of K&R) will not be offended by the fact that this book says some things
    over and over in three slightly different ways.


    Although my name is on the cover, there are a lot of people behind this book,
    and it''s difficult to know where to start out acknowledgments. In a sense, every
    one of comp.lang.c''s readers (today estimated at 320,000) is a contributor: The
    FAQ list this book was written for comp.lang.c first, and this book retains the
    flavor of a good comp.lang.c discussion.


    This book also retains, I hope, the philosophy of correct C that I began when
    I started reading net.lang.c. Therefore, I shall first acknowledge the posters
    who stand out in my philosophy: Doug Gwyn, Guy Harris, Karl Heuer, Henry Spencer,
    and Chris Torek. These gentlemen have displayed remarkable patience over the years,
    answering endless questions with generosity and wisdom. I was the one who stuck
    his neck out and started writing the Frequent questions down, but I would have
    to give the impression that the answers are somehow mine. I once the student (I
    believe it was Guy who asked my most asking question 5.10), and I owe a real debt
    to the masters who went before me. This book is theirs as much as mine, though
    I retain title to any inadequacies or mistakes I''ve made in the presentation.


    The former on-line FAQ list grew by a factor of three in the process of becoming
    this book, and its growth was a bit rapid and awkward at times.'
