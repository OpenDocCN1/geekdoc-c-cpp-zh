  md: '# 17 Style


    Computer programs are written not only to be processed by computers, but also
    to be read by other programmers. In making programs readable (and maintainable,
    and less error prone), attention must be paid to considerations other than simple
    acceptability to the compiler. Style considerations are necessarily the least
    objective aspects of computer programming: Opinions on code style, like those
    on religion, can be debated endlessly. Good style is a worthy goal and can usually
    be recognized, but it cannot be rigorously codified. Nevertheless, the absence
    of objective standards, or even of any industry-wide consensus on what constitutes
    good style, does not mean that programmers should abandon any attempt to write
    readable code.


    Question: What''s the best style for code layout in C?


    Answer: Kernighan and Ritchie, while providing the example often copied, also
    supply a good excuse for disregarding it:'
  merge: -1
