  md: 'Answer: Since it was first designed to handle a now obsolete data structure,
    the fixed-length, not necessarily \0-terminated "string," strncpy is a bit cumbersome
    to use in other contexts; you must append a ''\0'' to the destination string by
    hand. You can get around the problem by using strcat instead of strncpy. If the
    destination string starts empty, strcat does what you probably wanted strncpy
    to do:


    ```

    *dest = ''\0'';

    strcat(dest, source, n);

    ```


    This code copies up to n characters and always appends \0.

    Another possibility is


    ```

    sprintf(dest, "%.s", n, source);

    ```


    Strictly speaking, however, this is guaranteed to work only for n ≤ 509.

    When arbitrary bytes (as opposed to strings) are being copied, memcpy is usually
    a more appropriate function to use than strncpy.


    # 13.3


    Question: Does C have anything like the "substr" (extract substring) routine present
    in other languages?


    Answer: Not as such. (One reason it doesn''t is that, as mentioned in question
    7.2 and Chapter 8, C has no managed string type.)


    To extract a substring of length LEN starting at index POS in a string, use something
    like


    ```

    char dest[LEN+1];

    strncpy(dest, &source[POS], LEN);

    dest[LEN] = ''\0'';      /* ensure \0 termination * */

    ```


    Alternatively, use a variation on the trick from question 13.2:


    ```

    char dest[LEN+1] = "";

    strcat(dest, &source[POS], LEN);

    ```


    > *For example, early C compilers and used 8-character fixed-length strings in
    their symbol tables, and many versions of UNIX still use 14-character file names.
    A related quirk of strncpy''s is that it pads strings with multiple \0s, to the
    specified length; this can allow more efficient string comparisons, since they
    can blindly compare n bytes without also looking for "\0".'
