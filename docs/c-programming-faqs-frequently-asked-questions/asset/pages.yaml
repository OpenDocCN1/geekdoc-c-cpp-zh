    # Accessing Raw Memory


    # 19.22


    Question: How can I find out how much memory is available?


    Answer: Your operating system may provide a function that returns this information,
    but it''s quite system dependent. (Also, the number may vary over time.) If you''re
    trying to predict whether you''ll be able to allocate a certain amount of memory,
    just try it—call malloc (requesting that amount) and check the return value.


    # 19.23


    Question: How can I allocate arrays or structures bigger than 64K?


    Answer: A reasonable computer ought to give you transparent access to all available
    memory. If you''re not so lucky, you''ll either have to rethink your program''s
    use of memory or use various system-specific techniques.


    Even so, 64K is (still) a pretty big chunk of memory. No matter how much memory
    your computer has available, it''s asking a lot to be able to allocate huge amounts
    of it contiguously. (The C standard does not guarantee that a single object can
    be larger than 32K.) Often, it''s a good idea to use data structures that don''t
    require that all memory be contiguous. For dynamically multidimensional arrays,
    you can use pointers to pointers, as illustrated in questions 6.16 and 20.02.
    Instead of a large array of structures, you can use a linked list or an array
    of pointers to structures.


