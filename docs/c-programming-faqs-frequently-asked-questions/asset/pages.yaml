  md: '# CHARACTERS AND STRINGS


    # 8.8


    **Question:** I''m reading strings typed by the user into an array and then printing
    them out later. When the user types a sequence like \n, why isn''t it being handled
    properly?


    **Answer:** Character sequences like \n are interpreted at compile time. When
    a backslash and an adjacent n appear in a character constant or a string literal,
    they are translated immediately into a single newline character. (Analogous translations
    occur, of course, for the other character escape sequences.) When you''re reading
    strings from the user or a file, no interpretation like this is performed: A backslash
    is read and printed just like any other character, with no particular interpretation.
    (Some interpretation of the newline character may be done during run-time I/O
    but for a completely different reason; see question 12.40.) See also question
    12.6.


    # 8.9


    **Question:** I just noticed that sizeof(''a'') is 2, not 1 (i.e., sizeof(char)).
    Is something wrong with my compiler?


    **Answer:** Perhaps surprisingly, character constants in C are of type int, sizeof(''a'')
    is sizeof(int) (though it''s different in C++). See also question 7.8.


    References: ANSI $3.1.3.4

    ISO $6.1.3.4

    H& $2.7.3 p. 29


    # 8.10


    **Question:** I''m starting to think about multinational character sets. Should
    I worry about the implications of making sizeof(char) be 2 so that 16-bit character
    sets can be represented?


    **Answer:** If type char were made 16 bits, sizeof(char) would still be 1, and
    CHAR_BIT in <limits.h> would be 16, and it would be impossible to declare (allocate
    with malloc) a single 8-bit object.'
