  md: '# # Arrays and Pointers


    A strength of C is its unification of arrays and pointers. Pointers can be conveniently
    used to access arrays and to simulate dynamically allocated arrays. The so-called
    equivalence between arrays and pointers is so close, however, that programmers
    sometimes lose sight of the remaining essential differences between the two, imagining
    either that they are identical or that various non-sensical similarities or identities
    can be assumed between them.


    The cornerstone of the “equivalence” of arrays and pointers in C is the fact that
