    This code implements the generator


    ```

    X \leftarrow (aX + c) \pmod m

    ```


    for $a = 16807, m = 2147483647$ (which is $2^{31}-1$), and $c = 0$. (Since the
    modulus is prime, this generator does not have the problem described in question
    13.18.) The multiplication is carried out using a technique described by Schrage,
    ensuring that the intermediate result $aX$ does not overflow. The preceding implementation
    returns long int values in the range $[1,2147483646]$; that is, it corresponds
    to C''s rand with RAND\_MAX of 2147483646, except that it never returns 0. To
