  md: '# # 14 Floating Point


    Floating-point calculations often seem somewhat troubling and mysterious, and
    the problems are a bit worse in C because it has not traditionally been targeted
    at programs that use floating point extensively.


    #  14.1


    **Question:** When I set a float variable to, say, 3.1, why is printf printing
    it as 3.09999997?


    **Answer:** Most computers use base 2 for floating-point numbers as well as integers,
    and just as for base 10, not all fractions are representable exactly in base 2.
    It''s well-known that in base 10, a fraction like 1/3 = 0.333333... repeats infinitely.
    It turns out that in base 2, 1/1010 (that is, 1/10 decimal) is also an infinitely
    repeating fraction: its binary representation is 0.000110011011.... Depending
    on how careful your compiler''s binary/decimal conversion routines (like those
    used by printf) have been written, you may see discrepancies when numbers (especially
    low-precision floats) not exactly representable in base 2 are assigned or read
    in and then printed (i.e., are converted from base 10 to base 2 and back again).*
    See also questions 14.4 and 14.6.


    > *Converting binary floating-point numbers to and from base 10 without discrepancies
    is an interesting problem; two excellent papers on the subject by Clinger, Steele,
    and White are mentioned in the bibliography.'
