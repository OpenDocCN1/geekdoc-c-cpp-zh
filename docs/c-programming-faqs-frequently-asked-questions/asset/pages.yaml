    \ (which ANSI defines in <stdlib.h>) and assume that N is much less than RAND_MAX.\
    \ When N is close to RAND_MAX, and if the range of the random number generator\
    \ is not a multiple of N (i.e., if (RAND_MAX+1) % N != 0), all of these methods\
    \ break down: Some outputs occur more often than others. (Using floating point\
    \ does not help; the problem is that rand returns RAND_MAX+1 distinct values,\
    \ which cannot always be evenly divvied into N buckets). If this is a problem,\
    \ about the only thing you can do is to call rand multiple times, discarding certain\
    \ values:\n\n```\nunsigned int x = (RAND_MAX + 1u) / N;\nunsigned int y = x *\
    \ N;\nunsigned int r;\ndo {\n    r = rand();\n  } while (r >= y);\n  return r\
    \ / x;\n```\n\nFor any of these techniques, it's straightforward to shift the\
    \ range, if necessary; numbers in the range [M, N] could be generated with something\
    \ like M + rand() / (RAND_MAX / (N - M + 1) + 1)\n\n(Note, by the way, RAND_MAX\
    \ is a *constant* telling you what the fixed range of the C library function is.\
    \ You cannot set RAND_MAX to some other value, and there is no way of requesting\
    \ that rand return numbers in some other range.)\n\nIf you're starting with a\
