  md: '# GLOSSARY


    # 37


    terminal driver n. That portion of the system software responsible for character-based
    input and output, usually interactive; originally from and to a serially connected
    terminal, now more generally any virtual terminal, such as a window or network
    login session. See question 19.1.


    text adj. Refers to a file or I/O mode intended for handling human-readable text,
    specifically printable characters arranged into lines. Compare binary, sense 3.
    See question 12.40.


    translator n. A program (compiler, interpreter, lint, etc.) that parses and interprets
    semantic meaning in C syntax.


    unary adj. Refers to an operator taking one operand. Compare binary, sense 4.

    roll it. To replicate the loop of a one or more times (while correspondingly reducing
    the number of iterations) to improve efficiency by reducing loop control overhead
    (but at the expense of increased code size).


    unsigned adj. Refers to a set of rules, common in pre-ANSI implementations, for
    promoting signed and unsigned types that meet across binary operators and for
    promoting narrow unsigned types. Under the unsigned preserving rules, promotion
    is always to an unsigned type. Compare value preserving. See question 3.19.


    unspecified adj. Refers to behavior that is not fully specified by the standard,
    for which each implementation must choose some behavior, though it need not be
    documented or even consistent. The example: the order of evaluation of function
    arguments and other subexpressions. See question 11.33.


    value preserving adj. Refers to a set of rules, mandated by the ANSI C Standard
    and also present in some pre-ANSI implementations, for promoting signed and unsigned
    types that meet across binary operators and for promoting narrow unsigned types.
    In general. Under the value preserving rules, promotion is to a signed type if
    it is large enough to preserve all values; otherwise to an unsigned type. unsigned
    preserving. See question 3.19.


    varargs adj. 1. Refers to a function that accepts a variable number of arguments,
    e.g., printf. (A synonym for variadic). 2. Refers to one of the arguments in the
    variable-length part of a variable-length argument list.


    variadic adj. Refers to a function that accepts a variable number of arguments,
    e.g., printf. (A synonym for varargs, sense 1.)


    wrapper n. A function (or macro) that is "wrapped around" another, providing a
    bit of added functionality. For example, a wrapper around malloc might check malloc''s
    return value.


    X3159 n. The original ANSI C Standard, ANSI X3159-1989. See question 11.1.


    X3J11 n. The committee charged by ANSI with the task of drafting the C Standard.

    XJ11 now functions as the U.S. Technical Advisory Group to the ISO C-standardization
    working group WG14. See question 11.1.'
