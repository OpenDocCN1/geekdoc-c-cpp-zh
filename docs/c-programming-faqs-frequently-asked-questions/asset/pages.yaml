    p[0] = ''H'';

    ```


    Answer: String constants are in fact constant. The compiler may place them in
    nonwritable storage, and it is therefore not safe to modify them. When you need
    writable strings, you must allocate writable memory for them, either by declaring
    an array or by calling malloc. Try


    ```

    char a[] = "hello, world!\";"

    ```


