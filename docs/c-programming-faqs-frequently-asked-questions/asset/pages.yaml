  md: "# Random Numbers\n\n# 13.15\n\nQuestion: How can I generate random numbers?\n\
    \nAnswer: The standard C library has a random number generator: rand. The implementation\
    \ on your system may not be perfect, but writing a better one isn't necessarily\
    \ easy, either.\n\nIf you do find yourself needing to implement your own random\
    \ number generator, there is plenty of literature out there; see the references.\
    \ Also, any number of packages are available on the Internet; look for r250, RANLIB,\
    \ and FSULTRA (see question 18.16).\n\nHere is a portable C implementation of\
    \ the “minimal standard” generator proposed by Park and Miller:\n\n```\n#define\
    \ a 16807\n#define m 2147483647\n#define q (m / a)\n#define r (m % a)\n\nstatic\
    \ long int seed = 1;\n\nlong int PMrand()\n{\n    long int hi = seed / q;\n  \
    \  long int lo = seed % q;\n    long int test = a * lo - r * hi;\n    if(test\
    \ > 0)\n        seed = test;\n    else seed = test + m;\n    return seed;\n}\n\
    ```\n\n(The “minimal standard” is adequately good; it is something “against which\
    \ all others should be judged” and is recommended for use “unless one has access\
    \ to a random number generator known to be better.”)"
