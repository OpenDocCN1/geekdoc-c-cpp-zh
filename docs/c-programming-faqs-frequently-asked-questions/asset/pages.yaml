  md: '# System Dependencies


    C is a programming language, not an operating system. No programming language
    specifies all of the details about every interaction a program might want to have
    with its environment, but it is natural for a programmer who is trying to perform
    a system-specific task to ask how to do it in the context of the particular language
    being used. Real programs frequently need to perform such tasks as character-at-a-time
    input, cursor-controlled full-screen output, window manager interfacing (including
    menus and dialogs), mouse input, graphics, serial port communication, printer
    support, interfacing to various peripheral I/O devices, networking, etc. C''s
    definition, however, is silent on all of these.


    The specific techniques required to perform these tasks vary widely across today''s
    popular machines and operating systems, so complete answers for every combination
    cannot be given. The list of questions in this chapter is a laundry list of things
    you can''t do in portable C: Most of the answers boil down to “It’s system dependent.”
    (When the brief answers in this chapter prove insufficient, you’ll want to find
    some detailed documentation specific to the system you''re using.)'
  merge: -1
  pgno: 340
- img_proc: true
  md: At some level, interactive keyboard input is usually collected and presented
    to the requesting program one at a time. This gives the operating system a chance
    to support input line editing (backspace/delete/rubout) in a consistent way, without
    requiring that it be built into every program. Only when the user is satisfied
    and presses the Return key (or equivalent) is the line available to the calling
    program. Even if the calling program appears to be reading input a character at
    a time (with `getchar` or the like), the first call blocks until the user has
    typed an entire line, at which point potentially many
