  md: 'The rules, paraphrased from ANSI §4.1.2.1 (ISO §7.1.3), are as follows:


    +   - Rule 1. All identifiers beginning with an underscore followed by an uppercase
    letter or another underscore are always reserved (all scopes, name-spaces).


    +   - Rule 2. All identifiers beginning with an underscore are reserved for ordinary
    identifiers (functions, variables, typedefs, enumeration constants) with file
    scope.


    +   - Rule 3. A macro name defined in a standard header is reserved for any use
    if the header it defines is included.


    +   - Rule 4. All standard library identifiers with external linkage (i.e., function
    names) are always reserved with external linkage.


    +   - Rule 5. Typedef and tag names, with file scope, defined in standard headers,
    are reserved (in the same namespace) if the corresponding header is included.
    (The standard really says “each identifier with file scope,” but the only standard
    identifiers not covered by rule 4 are typedef and tag names.)


    3 and 4 are further complicated by the fact that several sets of macro names and
    standard library identifiers are reserved for “future directions”; that is, later
    revisions of the standard may define new names matching certain patterns. This
    table lists the patterns reserved for “future directions” whenever a given standard
    header is included:


    | Header | Future directions patterns |

    | --- | --- |

    | <ctype.h> | is[a-z]*, to[a-z]* (functions) |

    | <errno.h> | E[0-9]*, E[A-Z]* (macros) |

    | <locale.h> | LC_[A-Z]* (macros) |

    | <math.h> | cosf, sinf, sqrtf, etc.

    cos1, sin1, sqrt1, etc. (all functions) |

    | <signal.h> | SIG[A-Z]*, SIG_[A-Z]* (macros) |

    | <stdlib.h> | str[a-z]* (functions) |

    | <string.h> | mem[a-z]*, str[a-z]*, wcs[a-z]* (functions) |


    The notation [A-Z] means “any uppercase letter”; similarly, [0-9] indicate lowercase
    letters and digits. The notation * means “anything.” For example, if you include
    <stdlib.h>, all external identifiers beginning with the letters str followed by
    a lowercase letter are reserved.'
