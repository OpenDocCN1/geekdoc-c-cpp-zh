  md: '# Miscellaneous Pointer Use


    # 4.12


    **Question:** *I''ve seen different methods used for calling functions via pointers.

    What''s the story?*


    **Answer:** *Originally, a pointer to a function had to be “turned into” a “real”
    function, with the * operator, before calling:*


    ```

    int r, (*fp)(), func();

    fp = func;

    r = (*fp)();

    ```


    The interpretation of the last line is clear: *fp is a pointer to a function,
    so *fp is the function. Append an argument list in parentheses (and extra parentheses
    around fp to get the precedence right), and you''ve got a function call.


    It can also be argued that functions are always called via pointers and that “real”
    functions always decay implicitly into pointers in expressions, as they do in
    initializations; see question 1.34. This reasoning, made widespread through peer
    and adopted in the ANSI standard, means that r = fp(); is legal and works correctly,
    whether fp is the name of a function or a pointer to one. (The usage has always
    been unambiguous; there is nothing you could have done with a function pointer
    followed by an argument list except call the function pointed to.) An explicit
    * is still allowed and recommended if portability to older compilers is important.


    See K&R 1.34.


    +   References: K&R1 \$5.12 p. 116

    K&R2 \$5.11 p. 120

    ANSI \$3.3.2.2

    ISO \$6.3.2.2

