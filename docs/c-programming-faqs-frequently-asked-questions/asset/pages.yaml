  md: '# 14.13


    **Question:** I''m having trouble with a Turbo C program that crashes and says
    something like “floating point formats not linked.” What am I missing?


    **Answer:** Some compilers for small machines, including Borland''s (and Ritchie''s
    original PDP-11 compiler), leave out certain floating-point support if it looks
    though it will not be needed. In particular, the non-floating-point versions of
    printf and scanf save space by not including code to handle %e, %f, and %g. It
    happens that Borland''s heuristics for determining whether the program uses floating
    point are insufficient, and the programmer must sometimes insert an extra, explicit
    call to a floating-point library function to force loading of floating-point support.
    (Any such workarounds should be documented in the manuals; if not, complain! Borland
    tech note #645 supposedly addresses the problem.)


    A partially related problem, resulting in a similar error message (“floating point
    not loaded”) can apparently occur under some MS-DOS compilers when an incorrect
    variant of the floating-point library is linked. Check your compiler manual''s
    description of the various floating-point libraries.'
