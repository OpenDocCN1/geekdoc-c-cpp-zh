    **Question:** Is there a way to switch on strings?


    **Answer:** Not directly. Sometimes, it''s appropriate to use a separate function
    to map strings to integer codes and then switch on those.


    ```

    #define CODE_APPLE    1

    #define CODE_ORANGE   2

    #define CODE_NONE     0

    ```'
