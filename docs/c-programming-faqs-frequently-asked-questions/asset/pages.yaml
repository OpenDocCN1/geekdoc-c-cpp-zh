    - mismatched function arguments, especially involving pointers; two possibilities
    (see question 12.12) and fprintf (make sure it receives its first FILE * argument)


    Under UNIX, any of these problems almost invariably leads to a “core dump”: a
    file named core,* created in the current directory, containing a memory image
    of the crashed process, for debugging.


    The distinction between “bus error” and “segmentation violation” may not be significant;
    different versions of UNIX generate these signals under different sets of circumstances.
    Roughly speaking, a segmentation violation indicates an attempt to access memory
    that doesn''t even exist; a bus error indicates an attempt to access memory in
    an illegal way (perhaps due to an unaligned pointer; see question 16.7).


    See also questions 16.3 and 16.4.


    > *Yes, the name “core” derives ultimately from old core memories.'
