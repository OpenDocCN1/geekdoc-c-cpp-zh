    # 6.8


    **Question**: Practically speaking, what is the difference between arrays and
    pointers?


    **Answer**: An array is a single, preallocated chunk of contiguous elements (all
    of the same type), fixed in size and location. A pointer is a reference to any
    data element (of a particular type) anywhere. A pointer must be assigned to point
    to space allocated elsewhere, but it can be reassigned (and the space, derived
    from malloc, can be resized) at any time. A pointer can point to an array and
    simulate (along with malloc) a dynamically allocated array, but a pointer is a
    much more general data structure (see also question 4.1).


