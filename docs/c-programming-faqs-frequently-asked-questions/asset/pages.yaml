  md: '# GLOSSARY 369


    precedence n. The "strength" of an operator, indicating how tightly it binds to
    its operands during parsing, especially as compared to other nearby operators.
    Along with associativity and explicit parentheses, precedence determines how an
    expression is parsed: which operators are applied to which operands and which
    expressions are the operands of which operators. Precedence does not necessarily
    say anything about order of evaluation; see question 3.4.

    preprocessor n. The part of a compiler (traditionally, a separate program; hence
    the name) that handles the #include, #define, #ifdef, and related directives and
    performs substitution of defined macros in the rest of the program.

    pointer n. An expression context in which it can be recognized as a pointer value
    is required. The pointer contexts in C are:


    +   * any assignment context in which the destination (left-hand side) has pointer
    type;

    * an == or != comparison in which one side has a pointer type;

    * the second and third operands of the ?: operator, when one of them has pointer
    type;

    * the operand of a pointer context, such as (char *) or (void *).


    See question 5.2.

    punt. To treat an object as if it had a different type, usually by using a union
    or an expression of the form *(othertype)&object.

    ragged array n. An array, usually simulated with pointers, in which the rows are
    not necessarily of the same length. Also dope vector. See questions 16.6 and 20.2.

    reentrant adj. Refers to code that can safely be called from interrupts or in
    other circumstances in which it is possible that another instance of the code
    is simultaneously active. Reentrant code has to be very careful of the way it
    manipulates data:

    RFC An Internet Request For Comments document, available by anonymous ftp from
    ds.internet and many other sites.

    rhs n. The right-hand side, of an assignment, or more generally, of any binary
    operator.

    value n. Originally, an expression that could appear on the right-hand sign of
    an assignment operator. More generally, any value that can participate in an expression
    or be assigned to some other variable. In the assignment


    +   * a = b;


    b is an rvalue and has its value fetched. Compare lvalue. See ANSI $3.2.2.1 (especially
    footnote 31) or ISO #6.2.2.1. See also questions 3.16 and 4.5.


    scope n. The region over which a declaration is active. adj. "In scope": Visible.
    See question 1.29.

    semantics. The meaning behind a program: the interpretation that the compiler
    (or other translator) places on the various source code constructs. Compare syntax.'
