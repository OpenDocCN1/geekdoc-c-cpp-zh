  md: '# Structures, Unions, and Enumerations


    Structures, unions, and enumerations are all similar in that they let you define
    new data types. First, you define the new type by declaring the members or fields
    of structures and unions or the constants making up an enumeration. At the same
    time, you may optionally give the new type a tag* by which it can be referred
    to later. Having defined a new type, you can declare instances of it, either at
    the same time the type is defined or later (using the tag).


    To complicate matters, you can also use typedef to define new type names for user-defined
    types, just as you can for all types. If you do, though, you''ll need to realize
    that the typedef name has nothing to do with the tag (if any).


    The questions in this chapter are arranged as follows: Questions 2.1 through 2.18
    cover structures, 2.19 and 2.20 cover unions, 2.22 through 2.24 cover enumerations,
    and 2.25 and 2.26 cover bitfields.'
