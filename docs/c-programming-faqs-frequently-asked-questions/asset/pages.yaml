  md: '# THE C PREPROCESSOR


    # 10.10


    **Question:** I''m using header files that accompany two different third-party
    libraries, and they are “helpfully” defining common macros, such as TRUE, FALSE,
    Min(), and Max(), but the definitions clash with each other and with definitions
    I''d already established in my own header files. What can I do?


    **Answer:** This is indeed an annoying situation. It''s a classic namespace problem;
    see questions 1.9 and 1.29. Ideally, third-party vendors would be conscientious
    when defining symbols (both preprocessor macros and global variable and function
    names) to ensure that namespace collisions are unlikely. The best solution is
    to get the vendor(s) to fix their header files. As a workaround, you can sometimes
    undefine or redefine the offending macros between the conflicting #include directives.


    # 10.11


    **Question:** I seem to be missing the system header file <sgty.h>. Where can
    I get a copy?


    **Answer:** Standard headers exist in part so that definitions appropriate to
    your compiler, operating system, and processor can be supplied. You cannot pick
    up a copy of someone else''s header file and expect it to work, unless that person
    is using exactly the same environment. Ask your compiler why the file was not
    provided or to replace a replacement copy.


    In the case of nonstandard headers, the situation is a bit more complicated. Some
    headers (such as <dos.h>) are completely system or compiler specific. Others,
    such as those associated with proper add-on libraries, may be reasonably portable.
    If you have an add-on library but are missing its header file, look for the header
    where you got the library. If you have some source code that requires what appears
    to be an add-header that you don''t, you probably don''t have the library, either,
    and you''ll need both (see question 13.25). Something like archie may help you
    find what you''re looking for; see question 18.16.'
