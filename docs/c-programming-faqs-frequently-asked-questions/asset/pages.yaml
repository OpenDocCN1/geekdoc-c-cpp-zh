  md: '# Other I/O


    # 19.6


    Question: How do I read the mouse?


    Answer: Consult your system documentation. Mouse handling is completely different
    under the X window system, MS-DOS, the Macintosh, and probably every other system.


    Reference: PCS $5.5 pp. 78–80


    # 19.7


    Question: How can I serial (“comm”) port I/O?


    Answer: It''s system dependent. Under UNIX, you typically open, read, and write
    a device file in /dev and use the facilities of the terminal driver to adjust
    its characteristics. (See also questions 19.1 and 19.2.) Under MS-DOS, you can
    use the predefined stream stdaux, a special file such as COM1, some primitive
    BIOS interrupts, or (if you require high performance) any number of interrupt-driven
    serial I/O packages.


    # 19.8


    Question: How can I direct output to the printer?


    Answer: Under UNIX, either use popen (see question 19.30) to write to the 1lp
    or 1pr program, or perhaps open a special file such as /dev/1lp. Under MS-DOS,
    write to the (nonstandard) predefined stdio stream stdprn or open the special
    files PRN or LPT1.


    Reference: PCS $5.3 pp. 72–4'
  merge: -1
