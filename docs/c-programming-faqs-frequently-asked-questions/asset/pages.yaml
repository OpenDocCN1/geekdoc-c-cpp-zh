  md: '# INTRODUCTION


    programs fall into various gray areas: They may happen to work on some systems,
    and they may not be strictly illegal, but they are not guaranteed to work everywhere.
    This book is about portable C programming, so its answers advise against using
    nonportable constructs if at all possible.


    The on-line FAQ site underlying this book was written as a dialog: When people
    didn''t understand it, they said so. That feedback has been invaluable in refining
    the form of the answers. Although a printed book is obviously more static, such
    a dial is still appropriate: Your comments, criticisms, and suggestions are welcome.
    If you have access to the Internet, you may send comments to summit@aw.com, or
