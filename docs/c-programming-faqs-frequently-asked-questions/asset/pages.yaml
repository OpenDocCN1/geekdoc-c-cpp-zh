    # scanf Formats


    Question: Why doesn''t the call scanf("%%d", i) work?


    Answer: The arguments you pass to scanf must always be pointers. For each value
    converted, scanf "returns" it by filling in one of the locations you''ve passed
    pointers to. (See also question 20.1.) To fix the preceding fragment, change it
    to scanf("%%d", &i).


    # 12.12


    Question: Why doesn''t this code work?


    ```

    double d;

    scanf("%f", &d);

    ```


    Answer: Unlike printf, scanf uses %lf for values of type double and %f for float.*
    The %f format tells scanf to expect a pointer to float, not the pointer to double
    you gave it. Either use %lf or declare the receiving variable as a float. See
    also question 12.9.


    # 12.13


    *Everything said here is equally true of %e and %g and their companion formats
    %le and %lg.'
