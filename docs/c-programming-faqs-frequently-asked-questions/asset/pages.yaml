    # 12.16


    Question: How can I read data from data files with particular formats? How can
    I read 10 floats without having to use a jawbreaker scanf for format mentioning
    %f 10 times? How can I read an arbitrary number of fields from a line into an
    array?


    Answer: In general, there are three main ways of parsing data lines:


    +   1. Use fscanf or sscanf, with an appropriate format string. Despite the limitations
    mentioned in this chapter (see question 12.20), the scanf family is quite powerful.
    Although whitespace-separated fields are always the easiest to deal with, column
    format strings can also be used with more compact, column-oriented, FORTRAN-style
    data. For instance, the line


    ```

    1234ABC.678

    ```


    could be read with "%d%3$f". (See also the last example in question 12.19).


    +   2. Break the line into fields separated by whitespace (or some other delimiter),
    using strtok or the equivalent (see question 13.6); then deal with each field
    individually, perhaps with functions such as atoi and atof. (Once the line is
    broken up, the code for handling the argv array is much like the traditional code
    in main() for handling the argv array; see question 20.3.) This method is particularly
    useful for reading an arbitrary (i.e., not known in advance) number of fields
    from a line into an array.


    Here is a simple example that copies a line of up to 10 floating-point numbers
    (separated by whitespace) into an array:


    ```

    #include <stdlib.h>

    #define MAXARGS 10

    ```


    ```

    char *av[MAXARGS];

    int ac, i;

    double array[MAXARGS];

    ```


    ```

    ac = makeargv(line, av, MAXARGS);

    for (i = 0; i < ac; i++)

    array[i] = atof(av[i]);

    ```


    (See question 13.6 for the definition of makeargv.)'
