  md: '# 13.13


    Question: I know that the library function localtime will convert a time_t into
    a broken-down struct tm and that ctime will convert a time_t to a printable string.
    How can I perform the inverse operations by converting a struct tm or string into
    a time_t?


    Answer: ANSI C specifies a library function, mtime, that converts a struct tm
    to a time_t.


    Converting a string to a time_t is more difficult, because of the wide variety
    of date and time formats that might be encountered. Some systems provide strptime
    function, which is basically the inverse of strftime. Other popular functions
    are partime (widely distributed with the RCS package) and getdate (and a few others,
    from the C news distribution). See question 18.16.


    References: K&R2 $B10 p. 256

    ANSI $4.12.2.3

    ISO $7.12.2.3

    H&S $18.4 pp. 401–2


    # 13.14


    Question: How can I add n days to a date? How can I find the difference between
    two dates?


    Answer: The ANSI/ISO Standard C mktime and dif functions provide some support
    for both problems. Nonnormalized data are acceptable to mktime, which is straight
    forward to take a filled-in struct tm, or subtract from the tm_mday field, and
    call mktime to normalize the year, month, and day fields, and incidentally, convert
    to a time_t value). The dif function computes the difference, in seconds, between
    two time_t values; mktime can be used to compute time_t values for dates to be
    subtracted.


    These solutions are guaranteed to work correctly only for dates in the range that
    can be represented as time_ts. The tm_mday field is an int, so offsets of more
    than 32,736 or may cause overflow. Note also that daylight saving time changeovers,
    local days are not 24 hours long, so be careful if you try to divide by 86,400
    seconds/day.'
