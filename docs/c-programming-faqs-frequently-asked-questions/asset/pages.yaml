    Although p = p->next is an extremely common idiom for traversing linked list,
    -> is not a binary arithmetic operator. A hypothetical ->= therefore wouldn''t
    really fit the pattern of the other assignment operators—it would save a few keystrokes
    without really contributing much to the cleanliness or completeness of the language.


    You can use an exclusive-or macro in several ways:


    ```

    #define XOR(a, b) ((a) && !(b)) || (!(a) && (b)) /* 1 */

    #define XOR(a, b) ((!(a) ^ (b))) /* 2 */

    #define XOR(a, b) ((!(a) != !(b))) /* 3 */

    #define XOR(a, b) ((!(a) ^ !(b))) /* 4 */

    #define XOR(a, b) ((!(a) != !(b)) /* 5 */

    #define XOR(a, b) ((a) ? (b) : !(b)) /* 6 */

    ```


    The first straight from the definition is poor because it evaluates its operands
    multiple times (see 10.1). The second and third “normalize” its operands* to strict
    0/1 by negating them twice—the second then applies exclusive-or as !=. (to the
    single remaining bit); the third one implements exclusive-or; The fourth and fifth
    are based on an elementary identity in Boolean algebra, namely that


    a ⊕ b = a ¬ b


    (where ⊕ is exclusive-or and an overbar indicates negation). Finally, the sixth,
    suggested by Lawrence Kirby and Dan Pop, uses the ?: operator to guarantee a sequence
    point between the two operands, as for && and ||. (There is still no “short circuiting”
    behavior, though, nor can there be.)


