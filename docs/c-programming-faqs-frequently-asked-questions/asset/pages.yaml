    \ of day in a C program?\n\nAnswer: Just use the time, ctime, and/or localtime\
    \ functions. (These functions have been around for years and are in the ANSI standard.)\
    \ Here is a simple example:*\n\n```\n#include <stdio.h>\n#include <time.h>\n\n\
    main() {\n    time_t now;\n    time(&now);\n    printf(\"It's %.24s.\\n\", ctime(&now));\n\
    \    return 0;\n}\n```\n\nCalls to localtime and \\ look like this:\n\n```\nstruct\
    \ tm *tmp = localtime(&now);\nchar fmbuf[30];\nprintf(\"It's %:%02d:%02d\\n\"\
    ,\n    tmp->tm_hour, tmp->tm_min, tmp->tm_sec);\nstrftime(fmbuf, sizeof fmbuf,\
    \ \"%A, %B d, %Y\", tmp);\nprintf(\"on %s\\n\", fmbuf);\n```\n\n> (Note that these\
    \ functions take a pointer to the time_t variable, even that they will not be\
    \ modifying it.)†\n\nReferences: K&R $8$10 pp. 255–7\nISO $4.12\nH&S $18 p. 399,\
    \ $18.3 p. 400, $18.4 p. 401, $18.6 p. 403–4\n\n*Note, though that according to\
    \ ANSI, time can fail, returning (time_t) (-1).\n†These pointers are basically\
