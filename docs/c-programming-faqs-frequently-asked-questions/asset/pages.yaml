  md: '# 4.13


    **Question:** What''s the total generic pointer type? My compiler complained when
    I tried to stuff function pointers into a *void* *.


    **Answer:** There is no “total generic pointer type.” A void * is guaranteed to
    hold only object (i.e., data) pointers; converting a function pointer to type
    void * is not portable. (On some machines, function addresses can be very large—larger
    than any data pointers).


    It is guaranteed, however, that all function pointers can interconvert, as long
    as they are converted back to an appropriate type before calling. Therefore, you
    can pick any function type (usually int (*) or void (*)), that is, pointer to
    function of unspecified arguments returning int or void) as a generic function
    pointer. When you need a place to hold and function pointers interchangeably,
    the portable solution is to use a union of void * and a generic pointer (of whichever
    type you choose).


    See also 1.22 and 5.8.


    +   References: ANSI $3.1.2.3, $3.2.2.3, $3.3.4

    ISO $6.1.2.5, $6.2.2.3, $6.3.4

    Rationale $3.2.2.3

    H&S $5.3.3$ p. 123


    # 4.14


    **Question:** How are integers converted to and from pointers? Can I temporarily
    stuff an integer into a pointer, or vice versa?


    **Answer:** Once upon a time, it was guaranteed that a pointer could be converted
    to an integer (although one never knew whether an int or a long might be required),
    that an integer could be converted to a pointer, that a pointer remained unchanged
    when converted to a (large enough) integer and back again, and that the conversions
    (and any mapping) were intended to be “unsprising to those who know the addressing
    structure of the machine.” In other words, there is some precedent and support
    for integer/pointer conversions, but they have always been machine dependent and
    nonportable. Explicit casts have always been required (although early compilers
    rarely complained if you left them out).'
