  md: '# String Functions


    **Question:** How can I convert numbers to strings (the opposite of atoi)? There
    are an itoa function?


    **Answer:** Just use sprintf:


    ```

    sprintf(string, "%d", number);

    ```


    (Don''t worry that sprintf may be overkill, potentially wasting run time or code
    space; it works well in practice. See also the examples in the answer to question
    7.5 and also question 12.21.

    You can obviously use sprintf to convert long or floating-point numbers as well
    (using %ld or %f); in other words, sprintf can also be thought of as the opposite
    of atol and atof. In addition, you have quite a bit of control over the formatting.
    It''s for these reasons that C supplies sprintf as a general solution, and not
    itoa.

    If you simply must write an itoa function, here are some things to consider:


    +   - K&R provides a sample implementation.

    - You''ll have to worry about return buffer allocation; see question 7.5.

    - A naïve implementation usually doesn''t handle the most negative integer (INT_MIN,
    usually -32,768 or -2,147,483,648) properly.


    See also questions 12.21 and 20.10.


    References: K&R $3.6 p. 60

    K&R $3.6 p. 64


