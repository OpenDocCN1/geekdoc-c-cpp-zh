    differently named entry points, as in FORTRAN. It was not, to anyoneone’s knowledge,
    ever implemented (nor does anyone remember what sort of syntax might have been
    imagined for it). It has been withdrawn and is not a keyword in ANSI C. (See also
    question 1.12.)


    > Reference: K&R2 p. 259 Appendix C'
