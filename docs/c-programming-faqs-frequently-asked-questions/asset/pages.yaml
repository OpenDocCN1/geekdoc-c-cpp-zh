  md: '# CHAPTER 11


    # Using main()


    Although every C program must be by definition supply a function named main, the
    declaration of main is unique because it has two acceptable argument lists, and
    the rest of the declaration (in particular, the return type) is dictated by a
    factor outside of the program''s control, namely, the startup code that will actually
    call main.


    ![](img/2b27505702f89a0fc85dc6e5851a2984_219_0.png)


    **Question:** Can I declare main as void to shut off these warnings about main
    not returning a value?


    **Answer:** No; main must be declared as returning an int and as taking either
    zero or two arguments, of the appropriate types. In other words, there are just
    two valid declarations:


    ```

    int main(void)

    int main(int argc, char **argv)

    ```


    However, these declarations can be written in a variety of ways. The second parameter
    may be declared char *argv (see question 6.4), you can use any names for the two
    parameters, and you can use old-style syntax:


    ```

    int main(argc, argv)

    int argc; char **argv;

    ```


    Finally, the return value can be omitted, since int is the default (see question
    1.25).


    If you''re calling exit but still getting warnings, you may have to insert a redundant
    return statement or use some kind of "not reached" directive, if available.


    Declaring a function as void does not merely shut off or rearrange warnings; it
    may also result in a different function call/return sequence, incompatible with
    what the caller (in main''s case, the C run-time startup code) expects. That is,
    if the calling sequences for void- and int-valued functions differ, the startup
    code is going to be calling main using specifically the'
