  md: '# 3.19


    Question: What''s the difference between the “unsigned preserving” and “value
    preserving” rules?


    Under the unsigned preserving (also called “sign preserving”) rules, the promoted
    type is always unsigned. This rule has the virtue of simplicity, and it can lead
    to surprises (see the first example that follows).


    Under the value preserving rules, the conversion depends on the actual sizes of
    the original and promoted types. If the promoted type is truly larger—which means
    that it can represent all the values of the original, unsigned type as signed
    values—the promoted type is signed. If the two types are actually the same size,
    the promoted type is unsigned (as the unsigned preserving rules).


    Since the actual sizes of the types are used in making the determination, the
    results will vary from machine to machine. On some machines, short is smaller
    than int, but on others, they’re the same size. On some machines, int is smaller
    than long int, but on others, they’re the same size.


    In practice, the difference between the unsigned and value preserving rules matters
    most often when one operand of a binary operator is (or promotes to) int and the
    other one might, depending on the promotion rules, either be converted to that
    type—most certainly causing an undesired result if its value was negative (again,
    see the first example that follows). When the ANSI C standard was established,
    the value preserving rules were chosen, to reduce the number of cases where these
    surprising results occur. (On the other hand, the value preserving rules also
    reduce the number of predictable cases, because portable programs cannot depend
    on a machine’s type sizes and hence cannot know which way the value preserving
    rules will fall).'
