- img_proc: true
  md: '# xxxvi INTRODUCTION


    you (and, at some level), it can''t, because the author presumably knows the material
    already while you presumably don''t), you may be left with deep, unanswered questions.


    This book, however, is organized around 400 of those questions, all based on real
    ones asked by real people attempting to learn or program in C. This book is not
    targeted at just those topics that the author thinks are important; it is targeted
    at the topics that real readers think are important, based on the questions they
    ask. The chances are good that if you are learning or using C and you have a question
    about C that isn''t answered in any of the other books you''ve checked, you''ll
    find it anywhere.


    This book can''t promise answer every question you''ll have when you''re programming
    in C, since many of the questions that will come up in your programming will have
    to do with your problem domain, and this book covers the C language itself. As
    it can''t cover every aspect of problem anyone might try to solve in C, this book
    cannot cover every aspect of every operating system that anyone might try to write
    a C program for every algorithm that anyone might try to implement in C. Specific
    problems, specific operating systems, and general-purpose algorithms are properly
    discussed in books or other materials developed to those topics. Nevertheless,
    questions involving operating systems and algorithms are quite frequent, so Chapters
    19 and 20 provide brief, introductory answers to a few of them, but please don''t
    expect the treatment to be complete.


    The questions in this book are that people typically have after reading an introductory
    textbook or taking a C programming class. Therefore, this book will not teach
    you, nor does it discuss fundamental issues that any C textbook should cover.
    Furthermore, this book''s answers are intended for the most part to be definitely
    correct and to avoid propagating misconceptions. Therefore, a few answers are
    more elaborate than might seem necessary: they give you the complete picture rather
    than oversimplifying or leaving out important details. (It is, after all, oversimplifications
    or omitted details that are behind many of the misconceptions this book''s questions
    and answers address.) Within the elaborate answers, you will find shortcuts and
    simplifications where necessary, and in the glossary you will find definitions
    of the precise terms that accurate explanations often demand. The shortcuts and
    simplifications are, of course, safe ones: they should not lead to later misunderstandings,
    and you can always come back to the complete explanations or pursue some of the
    references, if you later desire the full story.


    As we''ll see particularly in Chapters 3 and 11, the standard definitions of C
    do not specify the behavior of every C program that can be written. Some'
