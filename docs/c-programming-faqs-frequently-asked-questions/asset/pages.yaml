  md: '# 13.25


    **Question:** I keep getting errors due to library functions being undefined,
    even though I''m including all the right header files.


    **Answer:** In general, a header file gives you only the declarations of library
    functions, not the library functions themselves. Header files happen at compile
    time; libraries happen at link time.


    In some cases (especially if the functions are nonstandard), you may have to explicitly
    ask for the correct libraries to be searched when you link the program. (Some
    systems may be able to arrange that whenever you include a header, its associated
    library, if nonstandard, is automatically requested at link time, but such a facility
    is not widespread.) See also questions 11.30, 13.26, and 14.3.


    # 13.26


    **Question:** I''m still getting errors due to library functions being undefined,
    even though I''m explicitly requesting the right libraries while linking.


    **Answer:** Many linkers make pass over the list of object files and libraries
    you specify and extract from libraries only those modules that satisfy references
    that have so far come up as undefined. Therefore, the order in which libraries
    are listed with respect to object files (and one another) is significant; usually,
    you want to search the libraries last.


    For example, under UNIX, a command line such as


    ```

    -lm myprog.c      # WRONG

    ```


    usually won''t work. Instead, put any -l options at the end of the command line:


    ```

    cc myprog.c -lm

    ```


    If you list a library first, the linker doesn''t know that it needs anything out
    of it yet and passes it by. See also question 13.28.'
  merge: -1
