    \ is “Duff’s Device”?\n\n**Answer:** It’s a devastatingly deviously unrolled byte-copying\
    \ loop, devised by Tom Duff while he was at Lucasfilm. In its “classic” form,\
    \ it looks like:\n\n```\nregister n = (count + 7) / 8;  /* count > 0 assumed *\n\
    switch (count % 8) {\n  case 0:    do (\n*to = *from++;\n  case 7:      *to =\
    \ *from++;\n  case 6:      *to = *from++;\n  case 5:      *to = *from++;\n  case\
    \ 4:      *to = *from++;\n  case 3:      *to = *from++;\n  case 2:      *to =\
    \ *from++;\n  case 1:      *to = *from++;\n} while (--n > 0);\n}\n```\n\nIn this\
    \ loop, count bytes are to be copied from the array pointed to by from to (which\
    \ is a memory-mapped device output register, which is why to isn’t incremented).\
    \ It solves the problem of handling the leftover bytes (when count isn’t a multiple\
    \ of 8) by interleaving a switch statement with the loop, which copies 8 bytes\
    \ at a time. Believe it or not, it is legal to have case labels buried within\
    \ blocks nested in a switch statement like this. In his announcement of the technique\
    \ to C’s developers and the world, Duff noted that C’s switch syntax, in particular\
    \ its “fall through” behavior, had long been controversial and that “this code\
    \ forms some sort of argument in that debate, but I’m not sure whether it’s for\
    \ or against.)"
