  md: '# Introduction


    You''ve probably had the experience, in a bar or at a party, of losing a bet on
    whether you could perform some seemingly simple task that turned out, based on
    idiosyncrasies of the human body or the laws of physics, to be impossible. The
    guy making the bet knew that the more people he challenged, the more likely he
    was to keep winning, because those idiosyncrasies and laws, even if obscure, are
    fairly constant and predictable.


    In a similar way, if you take a large number of people and set them at some complex
    task, such as learning the C programming language, many of them will run into
    exactly the same problems and have exactly the same questions. The questions and
    problems may or not have been predictable when the task was first designed, and
    the answers may seem obvious in hindsight, but people will keep having some of
    the same problems, and the same questions keep coming up. These problems and questions
    do not necessarily indicate that the task was impossible, merely that it was difficult
    enough to be interesting.


    Not surprisingly, these problems and questions are regularly asked on the Internet,
    particularly in the interactive discussion newsgroups known as Usenet. The reasonably
    obvious idea of collecting the frequent Asked Questions, or FAQ lists. FAQ lists
    don''t always serve their intended purpose of reducing the incidence of frequently
    asked questions, but if the answers are in fact consistent, the fact that they
    were asked often enough to be selected for inclusion in an FAQ list suggests that
    they might match questions which you or some other readers of this book are asking,
    too.


    # About This Book


    Most books (about C or any other topic) are written from the author''s point of
    view. They discuss the topics the author thinks you should know, presented in
    a way that makes sense to the author. If that way doesn''t make sense to'
