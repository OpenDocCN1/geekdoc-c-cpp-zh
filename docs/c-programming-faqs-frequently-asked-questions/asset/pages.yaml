  md: '# CHAPTER 17


    Evidently, it can be easier to remember to reverse the test than to remember to
    type the doubled = sign. (To be sure, accidentally using instead of == is a typo
    that even the most experienced C programmer can make).


    On the other hand, some people find reversed tests ugly or distracting,\* and
    argue that a compiler should warn about if (x = 0). (In fact, many compilers do
    warn about assignments in conditionals, you can always write it if (x = expression))
    or if (x = expression) != 0 if you really mean it.)


    Reference: H&S $7.6.5 pp. 209–10


    # 17.5


    **Question:** I came across some code that puts a (void) cast before each call
    to printf. Why?


    **Answer:** Although printf does return a value (the number of characters printed
    or an error code), few programs bother to check the return values from each call.
    Since some compilers (and lint) will warn about discarded return values, an explicit
    cast to (void) is a way of saying “Yes, I’ve decided to ignore the return value
    from this call, but please continue to warn me about other (perhaps inadvertently)
    ignored return values.” It’s also common to use void casts on calls to strcpy
    and stret, since the return value is never surprising.


    References: K&R2 $A6.7 p. 199

    Rationale $3.3.4

    H&S $6.2.9 p. 172, $7.13$ pp. 229–30


    # 17.6


    **Question:** If NULL and 0 are equivalent as null pointer constants, should I
    use?


    **Answer:** See question 5.9.


    *Note also that the reversed test convention is not sufficient, as it will not
    catch if (a = b).'
