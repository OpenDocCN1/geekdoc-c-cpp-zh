    # 3.17


    Question: I have some code containing expressions like

    a ? b = c : d


    Some compilers are accepting it but some are not. Why?


    Answer: In the original definition of the language, = was of lower precedence
    than ?; so early compilers tended to trip up on an expression like that, attempting
    to parse it as if it had been written:


    ```

    (a ? b) = (c : d)

    ```


    Since it has no sensible meaning, however, later compilers have allowed the expression
    and interpret it as an inner set of parentheses were implied:


    ```

    a ? (b = c) : d

    ```


    Here, the left-hand operand of the = is simply b, not the invalid a ? b. In fact,
    the grammar specified in the ANSI/ISO C Standard effectively requires this interpretation.
    (The grammar in the standard is not precedence based and says that any expression
    may appear between the ? and : symbols.)'
