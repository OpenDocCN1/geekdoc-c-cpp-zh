    Question: What''s the difference between const char *p, char const *p, and char
    * const p?


    Answer: The first two are interchangeable; they declare a pointer to a constant
    character (which means you can''t change the character). On the other hand, char
    * const p declares a constant pointer to a (variable) character (i.e., you can''t
    change the pointer). Read these declarations “inside out” to understand them;
    see question 1.21.


    +   References: ANSI $3.5.4.1 examples

    ISO $6.5.4.1

    Rationale $3.5.4.1

    H&S $4.4.4 p. 81


    # 11.10


    Question: Why can''t I pass a char ** to a function that expects a const char
    **?


    Answer: You can use a pointer to T (for any T) where a pointer to const T is expected.
    However, the rule (an explicit exception) that permits slight mismatches in qualified
    pointer types is not applied recursively but only at the top level. (Since const
    char ** is pointer to pointer to const char, the exception does not apply.)


    The reason you cannot assign a char ** value to a const char ** pointer is obscure.
    Given that the const qualifier exists at all, the compiler will like to help you
    keep your promises not to modify const values. That''s why you can assign a char
    * to a const char * but not the other around: It''s clearly safe to “add” const-ness
    to a simple pointer, but it would be dangerous to take it away. However, suppose
    that you performed the following, more complicated series of assignments:


    ```

    const char c = ''x'';       /* 1 */

    char *p1;               /* 2 */

    const char **p2 = &p1;  /* 3 */

    *p2 = &c;                /* 4 */

    *p1 = ''X'';               /* 5 */

    ```'
