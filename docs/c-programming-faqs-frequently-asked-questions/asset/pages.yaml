    # 3.2


    Question: Under my compiler, this code prints 49:


    ```

    int i = 7;

    printf("%d\n", i * i++);

    ```


    Regardless of the order of evaluation, shouldn''t it print 56?


    Answer: It’s true that the postincrement and postdecrement operators ++ and --
    perform their operations after yielding the former value. What’s often misunderstood
    are the implications and precise definition of “after.” An increment or decrement
    operation is not guaranteed to be performed immediately after giving up the previous
    value and before any other part of the expression is evaluated. The only guarantee
    is that the update will be performed sometime before the expression is considered
    “finished” (before the next “sequence point,” in ANSI C’s terminology; see question
    3.8). In the example, the compiler chose to multiply the previous value by itself
    and to perform both increments afterward.'
