    # **switch Statements**


    # 20.16


    **Question:** Which is more efficient: a switch statement or an if/else chain?


    **Answer:** The differences, if any, are likely to be slight. The switch statement
    was designed to be efficiently implementable, although the compiler may use the
    equivalent of an if/else chain (as opposed to a compact jump table) if the case
    labels are sparsely distributed.


    Use `switch` when you can: It''s definitely cleaner and perhaps more efficient
    (and certainly should never be any *less* efficient).


    See also questions 20.17 and 20.18.


