  md: '# Null Pointers and Null Pointer Constants


    These first three questions cover the fundamental definitions of null pointers
    in the language.


    # 5.1


    Question: What is this infamous null pointer, anyway?


    Answer: The language definition states that for each pointer type, there is a
    special value—the “null pointer”—that is distinguishable from all other pointer
    values and that is “guaranteed to compare unequal to a pointer to any object or
    function. That is, a null pointer points nowhere; it is not the address of any
    object or function. The address-of-operator & will never yield a null pointer,
    nor will a successful call to malloc.* (A null pointer is returned when malloc
    fails, and this is a typical use of null pointers as a “special” pointer value
    with another meaning, usually “not allocated” or “not pointing anywhere yet.)


    A null pointer is conceptually different from an uninitialized pointer. A null
    pointer is known not to point to any object or function; an uninitialized pointer
    might point anywhere. See also questions 1.30, 7.1, and 7.31.


    Each pointer type has a null pointer, and the internal values of null pointers
    for different types may differ. Although programmers need not know the internal
    values, the compiler must always be informed which type of null pointer is required,
    so that it can make the distinction if necessary (see-question 5.2).


    ```

    References: K&R1 $5.4 pp. 97–8

    K&R2 $5.4 p. 102

    ANSI $3.2.2.3

    ISO $6.2.2.3

    Rationale $3.2.2.3

    H&S $5.3.2 pp. 121–36

    ```


    > *A “successful” call to malloc(0) can yield a null pointer; see question 11.26.'
