    # The const Qualifier


    Another introduction from C++ is an additional dimension to the type system: type
    qualifiers. Type qualifiers can modify pointer types in several ways (affecting
    either the pointer or the object pointed to), so qualified pointer declarations
    can be tricky. (The questions in this section refer to const, but most of the
    issues apply to the other qualifier, volatile, as well.)


    Question: Why can''t I use const values in initializers and array dimensions,
    as in:


    ```

    const int n = 5;

    int a[n];

    ```


    Answer: The const qualifier really means “read-only”; an object qualified is a
    run-time object that cannot (normally) be assigned to. The value of a const-qualified
    object is therefore not a constant expression in the full sense of the term and
    cannot be used for array dimensions, case labels, and the like. (C is unlike C++
    in this regard.) When you need a true compile-time constant, use a preprocessor
    #define.


    References: ANSI §3.4

    ISO §6.4

    H&S §§7.11.2,7.11.3 pp. 226–7'
