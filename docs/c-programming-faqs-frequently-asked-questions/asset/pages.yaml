  md: '# ANSI/ISO STANDARD C 189


    It permits compiler writers to (1) make choices that allow efficient code to be
    generated by arranging that various constructs are implemented as “however the
    hardware does them” (see also question 14.4), and (2) ignore (that is, avoiding
    worrying about generating correct for) certain marginal constructs that are not
    too difficult to define precisely and that probably aren''t useful to well-written
    programs, anywhere (see, for example, the code fragments in questions 3.1, 3.2,
    and 3.3).


    The three variations on “not precisely defined by the standard” are:


    +   - Implementation-defined: The implementation must pick some behavior; it may
    fail to compile the program. (The program using the construct is not incorrect.)
    The choice must be documented. The standard may specify a set of allowable behaviors
    from which to choose, or it may impose particular requirements.


    +   - Unspecified: Like implementation-defined, except that the choice need not
    be documented.


    +   - Undefined: Anything at all can happen; the standard imposes no requirements
    on them. The program may fail to compile, execute incorrectly (either crashing
    or silently generating incorrect results), or fortuitously to do exactly what
    the programmer intended.


    Note since the standard imposes absolutely no requirements on the behavior of
    a compiler faced with undefined behavior, the compiler (more important, any generated
    code) can do absolutely anything. In particular, there is no guarantee that at
    most the undefined bit of the program will behave badly and the rest of the program
    will perform normally. It’s perilous to think that you can tolerate undefined
    behavior in a program, imagining that its undefinedness can’t hurt; the undefined
    behavior can be more undefined than you think it can. (See question 3.2 for a
    relatively simple example.)


    If you’re interested in writing portable code, you can ignore the distinctions,
    as you’ll want to avoid code that depends on any of the three behaviors. See also
    questions 3.9 and 11.34.


    ```

    References: ANSI $1.6

    ISO $3.10, $3.16, $3.17

    Rationale $1.6

    ```'
