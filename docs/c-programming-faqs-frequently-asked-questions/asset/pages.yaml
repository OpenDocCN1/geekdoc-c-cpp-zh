    Pointers, though certainly one of the most powerful and popular features of C,
    are nonetheless the bane of many beginning programmer. When pointers don''t point
    where they should, the possibilities for mayhem are endless. (Actually, many of
    the apparent problems with pointers have more to do with memory allocation; see
    Chapter 7.)


    # Basic Pointer Use


    Question: What are pointers really good for, anyway?


    Answer: They''re good for lots of things, including:


    +   - dynamically allocated arrays (see questions 6.14 and 6.16)

    - generic access to several similar variables

    - (simulated) by-reference function parameters (see questions 4.8 and 20.1)'
