    ```


    Answer: No. The ? operator, like most operators, ? yields a value, and you can''t
    assign to a value. (In other words, ? does not yield a value). If you really want
    to, you can try something like this:


    ```

    * ((condition) ? && &b) = complicated_expression;

    ```


