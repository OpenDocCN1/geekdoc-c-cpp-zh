  md: "order of evaluation n. The order in which the operations implied by an expression\
    \ are actually carried out by the processor. Compare precedence. See question\
    \ 3.4. out-of-band adj. Refers to a sentinel or otherwise exceptional value that\
    \ is distinct from all normal values that can appear in some context (e.g., in\
    \ a set of function return values, etc.). Compare in-band. Example: EOF (see question\
    \ 12.1).\n\nparameter n. The identifier in a function definition, function-like\
    \ macro definition, or function prototype declaration that stands for the actual\
    \ argument that will be passed. Often emphasized “formal parameter.” Compare argument.\n\
    \n```\nmain()\n{\n    f(5);\n    return 0;\n}\n\nf(int i);\n{\n}\n```\n\nthe formal\
    \ parameter of f is i and the actual argument is 5.\nIn the fragment\n\n```\n\
    extern int g(int apple);\nint orange = 5;\norange);\n```\n\nthe formal parameter\
    \ of g is apple and the actual argument is orange.\npass by reference n. An argument-passing\
    \ mechanism in which a function receives a reference to the actual argument that\
    \ if it modifies it, it modifies the value in the caller. Not available in C (see\
    \ question 4.11).\n\npass by value n. An argument-passing mechanism in which a\
    \ function receives a copy of the actual argument that if it modifies it, it modifies\
    \ only its own copy (and does not affect the value in the caller). Used in C.\
    \ See questions 4.8, 4.11, and 7.21.\npcc n. Steve Johnson's Portable C Compiler,\
    \ first written for the PDP-11 (as an alternative to Dennis Ritchie's cc) circa\
    \ 1978. Retargeted to the VAX the 32V and BSD projects, pcc saw very wide distribution\
    \ and served as the base for a large number of C compilers. As much as K&R1, it\
    \ served as the facto definition of C for many years, until X3J1 began its work.\
    \ (Note that the PCC mentioned in question 18.3 is probably no relation.)"
