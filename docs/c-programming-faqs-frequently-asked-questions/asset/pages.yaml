    # 12.25


    **Question:** What’s the difference between fgetpos/fsetpos and ftell/fseek? What
    are fgetpos and fsetpos good for?


    **Answer:** The newer fgetpos and fsetpos functions use a special typedef, fpos_t,
    for representing offsets (positions) in a file. The type behind this typedef,
    if chosen appropriately, can represent arbitrarily large offsets, allowing fgetpos
    and fsetpos to be used with arbitrarily huge files. In contrast, ftell and fseek
    use long int and are limited to offsets that can be represented in a long int.
    (Type long int is not guaranteed to hold values larger than $2^{31}-1$, limiting
    the maximum offset to 2 gigabytes).\ See also question 12.4.


