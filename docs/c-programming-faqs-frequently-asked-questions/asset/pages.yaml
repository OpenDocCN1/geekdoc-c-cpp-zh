    # 16.8


    Question: What do “segmentation violation” and “bus error” mean? What’s a “core
    dump”?


    Answer: These symptoms (and any similar messages having to do with memory-access
    violations or protection faults) generally mean that your program tried to access
    memory it shouldn''t have, invariably as a result of improper pointer use. Likely
    causes:


    +   * inadvertent use of null pointers (also questions 5.2 and 5.20)

    * uninitialized, misaligned, or otherwise improperly allocated pointers (see questions
    7.1, 7.2, and 16.7)

    * stale aliases to memory that has been relocated relocated (see question 7.29)'
