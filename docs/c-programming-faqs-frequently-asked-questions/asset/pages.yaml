  md: '# SYSTEM DEPENDENCIES


    299


    characters become available and many character requests (e.g., getchar calls)
    are satisfied in quick succession.


    When a program wants to read each character immediately as it arrives, its course
    of action will depend on where in the input stream the line collection is happening
    and how it can be disabled. Under some systems (e.g., MS-DOS, VMS in some modes),
    a program can use a different or modified set of OS-level calls to bypass line-at-time
    input processing. Under other systems (e.g., UNIX, VMS in other modes), the part
    of the operating system responsible for serial input (often called the “terminal
    driver”) must be placed in a mode that turns off line-at-time processing, after
    which all calls to the usual input routines (e.g., read, getchar, etc.) will return
    characters immediately. Finally, a few systems (particularly older, batch-oriented
    mainframes) perform input processing in peripheral processors that cannot be told
    to do other than line-at-time input.


    Therefore, when you need to do character-at-a-time input (or disable echo, which
    is an analogous problem), you will have to use a technique specific to the system
    you''re using, assuming it provides one. Here are brief answers for some common
    situations. Depending on which operating system you''re using and which libraries
    you have available, you may be able to use one (or more!) of the following techniques:


    +   * If you use the “curses” library, you can call cbreak (and perhaps noecho),
    after which calls to getch will return characters immediately.


    +   * If you''re trying to read a short password without echo, you may be able
    to use a function called getpass, if it''s available. (Another possibility for
    hiding typed passwords is to select black characters on a black background).


    +   * Under “classic” versions of UNIX, use ioctl and the TIOCGETP and TIOCETP
    (or TIOCETN) requests on file descriptor 0 to manipulate the sgtybuf structure,
    defined in <tty.h> and documented in tty(4). In the sg_flags field, set the CBREAK
    (or RAW) bit, and perhaps clear the ECHO bit.


    +   * Under System V, use ioctl and the TCGETAW and TCSETAW requests on file descriptor
    0 to manipulate the termio structure, defined in <termios.h>. In (and perhaps
    ECHO) bits. Also, set c_cc[MIN] to 1 and c_cc[VTIME] to 0.


    +   * Under any operating system (UNIX or otherwise) POSIX compatibility, use
    the tgetattr and tsetattr on file descriptor 0 to manipulate the termios structure,
    defined in <termios.h>. In the


    * In some old versions of curses, the function to request character-at-a-time
    input is crmode, not cbreak.'
