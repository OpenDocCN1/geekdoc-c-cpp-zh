    \n**Question:** How can I make my code more efficient?\n\n**Answer:** Efficiency,\
    \ though an enormously popular topic, is not important nearly as often as people\
    \ tend to think it. Most of the code in most programs is not time critical, and\
    \ when it is not, it is far more important that it be written clearly and portably.\
    \ (Remember that computers are very, very fast and that even \"inefficient\" code\
