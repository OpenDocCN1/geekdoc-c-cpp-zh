  md: '# DECLARATIONS AND INITIALIZATIONS


    The values in the table are the minimums guaranteed by the standard. Many implementations
    allow larger values, but portable programs shouldn''t depend on it.


    If some reason you need to declare something with an exact size, be sure to encapsulate
    the choice behind an appropriate typedef. Usually the only good reason for needing
    an exact size is when attempting to conform to some externally imposed storage
    layout. See also questions 1.3 and 20.5.


    References: K&R1 $2.2 p. 34

    K&R2 $2.2 p. 36, $A4.2 pp. 195–6, $B11 p. 257

    ANSI $2.2.4.2,1, $3.1.2.5

    ISO $5.2.4.2,1, $6.1.2.5

    H&S $5.1, $5.2$ p. 110–4


    ![](img/2b27505702f89a0fc85dc6e5851a2984_46_0.png)


    # Question: Why aren''t the sizes of the standard types precisely defined?


    Answer: Although C is considered relatively low level as high-level languages
    go, it does take the position that the exact size of an object (i.e., in bits)
    is an implementation detail. (The only place C lets you specify size in bits is
    bitfields within structures; see questions 2.25 and 2.26.) Most programs do not
    need precise control over these sizes; many programs that do try to achieve this
    control would be better off if they didn''t.


    Type int is supposed to represent a machine''s natural word size and is the right
    type to use for most integer variables. See question 1.1 for other guidelines;
    see also questions 12.42 and 20.5.


    ![](img/2b27505702f89a0fc85dc6e5851a2984_46_1.png)


    Question: Since C doesn''t define sizes exactly, I''ve been using typedefs like
    int16 and int32. I can then define these typedefs to be int, short, long, etc.,
    depending on what machine I''m using. That should solve everything, right?


    Answer: If you truly need control over exact type sizes, this is the right approach.
    However, you should remain aware of several things:


    +   - An exact match might not be possible (on the occasional 36-bit machine,
    for example).'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'A typedef like int16 or int32 accomplishes nothing its intended meaning is
    “at least” the specified size, because types int and long are already essentially
    defined as being “at least 16 bits” and “at least 32 bits,” respectively.


    Typedefs will never do anything about byte-order problems (e.g., if you''re trying
    to interchange data or conform to externally imposed storage layers).


    See also questions 10.16 and 20.5.


    # Question: What should the 64-bit type on new, 64-bit machines be?


    Answer: This is a sticky question. You can look at it in at least three ways:


    +   1. On existing 16- and 32-bit systems, two of the integer types (short and
    plain int, or plain int and long) are typically the same size. A 64-bit machine
    provides an opportunity to make all three types different sizes. Therefore, some
    vendors support 64-bit long ints.

    2. Sadly, a lot of existing code is written to assume that ints and longs are
    the same size or that the other of them is exactly 32 bits. Rather than risk breaking
    such code, some vendors introduce a new, nonstandard, 64-bit long long (or __longlong
    or __very long) type instead.

    3. Finally, it can be argued that plain int should be 64 bits on a 64-bit machine,
    since int traditionally reflects “the machine’s natural word size.”


    Programmers interested in writing portable code should therefore insulate any
    use of a64-bit type behind an appropriate typedef (and will also have to provide
    64-bit support manually when porting such code to 16- or 32-bit environments).
    Vendors feeling compelled to introduce a new, longer integral type should advertise
    it as being “at least 64 bits” (which is truly new, a type traditional C does
    not have) and not “exactly 64 bits.”'
  merge: -1
  pgno: 47
