  md: '# Glossary


    These definitions are of terms as they are used in this book. Some of the terms
    have more formal, slightly different definitions; this glossary is not an authoritative
    dictionary. Many of these terms are from the ANSI/ISO C Standard; see ANSI $1.6
    or ISO $3.


    aggregate n. An array, structure, or union type. adj. Refers to such a type.

    actual argument n. See argument.

    alias n. A Reference (usually in the form of a pointer) to an object that is also
    known via other references (i.e., its own name or other pointers). vt. To create
    such a reference.

    ANSI n. The American National Standards Institute. adj. Used informally to refer
    to standard C; see question 11.1.

    argument n. A value placed in an argument list during a function call or function-like
    macro invocation. Often emphasized “actual argument.” Compare parameter.

    argv v. The traditional name for the array (“vector”) of command-line arguments
    that is passed to main() when a C program is invoked; see questions 11.12 and
    20.3.

    arithmetic adj. Refers to a type or value on which conventional arithmetic be
    performed. The arithmetic types in C are the integral types and the floating types
    (float, double, and long double).

    ASCII n., adj. The American Standard Code for Information Interchange, ANSI X3.4-86.

    assignment context n. An expression context that recognizes the source of an assignment
    or destination of known type. The assignment contexts in C are initializations,
    the right-hand side of assignment expressions, casts, return statements, and function
    arguments in the presence of a prototype.

    automatic adj. (Often as “automatic duration.”) Refers to an object that has its
    storage allocated on entry to a function (or a nested block) and deallocated on
    return from the function (or exit the block). In other words, refers to local,
    nonstatic variables (as opposed to global variables or static variables whether
    inside or outside of a function). Compare static, sense 1. See question 1.30.'
