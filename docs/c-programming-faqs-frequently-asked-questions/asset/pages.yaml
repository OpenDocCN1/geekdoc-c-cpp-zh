  md: "# 5.2\n\n**Question:** How do I get a null pointer in my programs?\n\n**Answer:**\
    \ With a null pointer constant. According to the language definition, an “integral\
    \ constant expression with the value 0” in a pointer context is converted into\
    \ a null pointer at compile time. That is, when one side of an initialization,\
    \ assignment, or comparison is a variable or expression of pointer type, the compiler\
    \ can tell that a constant 0 on the other side requests a null pointer and can\
    \ generate the correctly typed null pointer value. Therefore, the following fragments\
    \ are perfectly legal:\n\n```\nchar *p = 0;\nif (p != 0) \n```\n\nSee also 5.3.\n\
    \nHowever, an argument being passed to a function is not necessarily recognizable\
    \ as a pointer context, and the compiler may not be able to tell that an unadorned\
    \ 0 “means” a null pointer. To generate a null pointer in a function context an\
    \ explicit cast may be required, to force the 0 to be recognized as a pointer.\
    \ For example, the UNIX system call exec1 takes a variable-length, pointer-terminated\
    \ list of character arguments and is correctly called like this:\n\n```\nexec1(\"\
    /bin/sh\", \"sh\", \"-c\", \"date\", (char *)0);\n```\n\nIf the (char *) cast\
    \ on the last argument were omitted, the compiler would not know to pass a null\
    \ pointer and would pass an integer instead. (Note that many UNIX manuals get\
    \ this example wrong; see question 5.11).\nWhen function prototypes are in scope,\
    \ argument passing becomes an “assignment context,” and most casts safely be omitted,\
    \ since the prototype tells the compiler that a pointer is required and of which\
    \ type, enabling it to correctly convert an unadorned 0. Function prototypes cannot\
    \ provide the types for variable arguments in variable-length argument lists,\
    \ however, explicit casts are still required for those arguments. (See question\
    \ 15.3.) It can be considered safest to properly cast all null pointer constants\
    \ in function calls: to guard against varags functions or those without prototypes,\
    \ to allow interim use of non-ANSI compilers, and to demonstrate that you know\
    \ what you are doing. (Incidentally, it’s also a simple rule to remember.)"
