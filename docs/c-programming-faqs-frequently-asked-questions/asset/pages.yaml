    Question: How do I write functions that accept two-dimensional arrays when the
    “width” is not known at compile time?


    Answer: It’s not easy. One way is to pass in a pointer to the [0][0] element along
    with the two dimensions and to simulate array subscripting “by hand”:


    ```

