  md: "# FLOATING POINT\n\nfor a suitably care: Its appropriate value of epsilon may\
    \ still have to be chosen with the machine’s floating-point precision, or it may\
    \ be quite small and related only if the numbers being compared are inherently\
    \ less accurate or the result of a chain of calculations that compounds accuracy\
    \ loss over several steps. (Also, you may have to make the threshold function\
    \ of b or both of a and b.)\n\nA decidedly inferior approach, not generally recommended,\
    \ would be to use an absolute threshold:\n\n```\nif (fabs(a - b) < 0.001)    \
    \            /* POOR * */\n```\n\nAbsolute “fuzz factors,” such as 0.001, never\
    \ seem to work for very long, however. As the numbers being compared change, it’s\
    \ likely that two small numbers that should be taken as different to be within\
    \ 0.001 of each other or that two large numbers, which should have been treated\
    \ as equal, by more than 0.001 . (And, of course, the problems merely shift around\
    \ and do not go away when the fuzz factor is tweaked to 0.005 or 0.001 or any\
    \ other absolute number).\n\nDoug Gwyn suggests using the following “relative\
    \ difference” function. It returns the relative difference of two real numbers:\
    \ 0.0 if they are exactly the same; otherwise, the ratio of the difference to\
    \ the larger of the two:\n\n```\n#define Abs(x)       ((x) < 0 ? -(x) : (x) )\n\
    #define Max(double a, double b) ((a) > (b) ? (a) : (b))\n\ndouble RelDif(double\
    \ a, double b)\n{\n    double c = Abs(a);\n    double d = Abs(b);\n\n    d = Max(c,\
    \ d);\n\n    return d == 0.0 ? 0.0 : Abs(a - b) / d;\n}\n```\n\nTypical usage\
    \ is\n\n```\nif (RelDif(a, b) <= TOLERANCE) ...\n```\n\nReference: Knuth Volume\
    \ 2 §4.2.2 pp. 217–8"
