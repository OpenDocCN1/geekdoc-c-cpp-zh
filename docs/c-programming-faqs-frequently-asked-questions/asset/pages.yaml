  md: 'laws do not hold completely; that is, order of operation may be important,
    and repeated addition is not necessarily equivalent to multiplication. Underflow,
    cumulative precision loss, and other anomalies are often troublesome.


    Don''t assume that floating-point results will be exact, and especially don''t
    assume that floating-point values can be compared for equality. (Don''t throw
    haphazard "fuzz factors" in, either; see question 14.5.) Beware that machines
    have more precision available in floating-point computation registers than double
    values stored in memory, which can lead to floating-point inequalities when it
    would seem that two values have to be equal.


    These problems are not worse for C than for any other computer language. Certain
    aspects of floating point are usually defined as "however the processor does them"
    (see also questions 11.33 and 11.34); otherwise, a compiler for a machine without
    the "right" model would have to do prohibitively expensive emulsions.


    This book cannot begin to list the pitfalls associated with, and workarounds appropriate
    for, floating-point work. A good numerical programming text should cover the basics;
    see also the references. (Beware, though, subtle problems can occupy numerical
    analysts for years.)


    References: Kernighan and Pauger, The Elements of Programming Style $6 pp. 115–8

    Knuth, Volume 2 chapter 4

    berg, "What Every Computer Scientist Should Know about Floating-Point Arithmetic"


    # 14.5


    Question: What''s a good way to check for "close enough" floating-point equality?


    Answer: Since the absolute accuracy of floating-point values varies, by definition,
    with their magnitude, the best way of comparing two floating-point values is to
    use an accuracy threshold that is relative to the magnitude of the numbers. Rather
    than


    ```

    double a, b;

    ...

    if (a == b)      /* WRONG */

    ```


    use something like


    ```

    #include <math.h>


    if(fabs(a - b) <= epsilon * a)

    ```'
