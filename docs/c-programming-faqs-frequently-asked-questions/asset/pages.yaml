  md: '# DECLARATIONS AND INITIALIZATIONS


    What do these five rules really mean? If you want to be on the safe side:


    +   1, 2. Don''t name anything with a leading underscore.


    +   3. Don''t name matching a standard macro (including the “future directions”
    patterns).


    +   4. Don''t give any functions or global variables names that are already taken
    by functions or variables in the standard library or that match any of the “future
    directions” patterns. (Strictly speaking, “matching” means in the first six characters,
    without regard to case; see question 11.27.)


    +   5. Don''t redefine typedef or tag names.


    In fact, the preceding list is overly conservative. If you wish, you may remember
    the following exceptions:


    +   1, 2. You may use identifiers consisting of an underscore followed by a digit
    or a lowercase letter for labels and structure/union members and at function,
    block, or prototype scope.


    +   3. You may use names matching standard macro names if you don''t include the
    header files that define them.


    +   4. You may use names of standard library functions as static or local variables
    (strictly speaking, as identifiers with internal or no linkage).


    +   5. You may use standard typedef and tag names if you don''t include the header
    files that declare them.


    However, relying on any of these exceptions, recognize that some are pretty risky
    (especially 3 and 5, since you could accidentally include the relevant header
    file at a later time, perhaps through a chain of nested `#include` files). Others,
    especially the one 1, 2, represent a “no man’s land” between the user namespaces
    and the namespaces reserved for the implementation.


    One reason for providing these exceptions is to allow the implementors of various
    add-in libraries a way to declare their internal, or “hidden,” identifiers. If
    you use any of the exceptions, you won''t clash with any identifiers defined by
    the standard, but you might clash with something defined by a third-party library
    you’re using. (If, on the other hand, you’re the one who’s implementing an add-in
    library, you’re welcome to make use of them, if necessary, and if you feel careful.)


    It is generally safe to make use of exception 4 to give function parameters or
    local variables matching standard library functions or “future directions” patterns.
    For example, “string” is a common—and legal—name for a parameter or local variable.'
