  md: '# 19.9


    **Question:** How do I send escape sequences to control a terminal or other device?


    **Answer:** If you can figure out how to send characters to the device at all
    (see question 19.8), it''s easy enough to send escape sequences. In ASCII, the
    ESC code is 033 (27 decimal), so code like


    ```

    printf(ofp, "\033[J");

    ```


    sends the sequence [ J .

    Some programmers prefer to parameterize the ESC code, like this:


    ```

    #define ESC 033

    ```


    ```

    printf(ofp, "%c[J", ESC\);

    ```


    # 19.10


    **Question:** How can I do graphics?


    **Answer:** Once upon a time, UNIX had a fairly nice set of device-independent
    plot routines described in plot(3) and plot(5), but they''ve largely fallen into
    disuse.


    If you''re programming for MS-DOS, you''ll probably want to use libraries conforming
    to VESA or BGI standards.


    If you''re trying to talk to a particular plotter, making it draw is usually a
    matter of sending it the appropriate escape sequences; see also question 19.9.
    The vendor may supply a C-callable library, or you may be able to find one on
    the Internet.


    If you''re programming for a particular window system (Macintosh, X Windows, Microsoft
    Windows), you will use its facilities; see the relevant documentation or newsgroup
    or FAQ list.


    Reference: PCS §5.4 pp.75–7'
  merge: -1
