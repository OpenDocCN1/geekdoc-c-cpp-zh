  md: '# 20.38


    **Question:** Where does the name “C” come from, anyway?


    **Answer:** C was derived from Ken Thompson’s experimental language B, which was
    inspired by Martin Richards’s BCPL (Basic Combined Programming Language), which
    was a simplification of CPL (Cambridge Programming Language). For a while, there
    was speculation that C’s successor might be named P (the third letter in BCPL)
    instead of D, but of course the most visible descendant language today is C++.


    Reference: Ritchie, “The Development of the C Language*


    # 20.39


    **Question:** How do you pronounce “char”?


    **Answer:** You can pronounce the C keyword “char” in at least three ways: like
    the English words “char,” “care,” or “car”; the choice is arbitrary.


