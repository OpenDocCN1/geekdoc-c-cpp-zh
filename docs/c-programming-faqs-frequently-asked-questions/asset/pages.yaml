  md: '# 20.18


    Question: Is there a way to have nonconstant case labels (i.e., ranges or arbitrary
    expressions)?


    Answer: No. The switch statement was originally designed to be quite simple for
    the compiler to translate; case labels are limited to single, constant, integral
    expressions. You can attach several case labels to the same statement, which will
    let you cover a small range if you don''t mind listing all cases explicitly. If
    you want to select on arbitrary ranges or nonconstant expressions, you''ll have
    to use an if/else chain.

    See questions 20.16 and 20.17.


