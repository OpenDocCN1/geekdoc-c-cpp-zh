  md: "# Declaration Style\n\nDeclaring functions and variables before using them\
    \ is not just to keep the compiler happy; it also injects useful order into a\
    \ programming project. When declarations are arranged appropriately within a project,\
    \ mismatches and other difficulties can be more easily avoided, and the compiler\
    \ can more accurately catch any errors that do occur.\n\n# 1.7\n\n**Question:**\
    \ What's the best way to declare and define global variables?\n\n**Answer:** First,\
    \ although a single “global” variable or function can have many declarations (and\
    \ in many translation units), there must be exactly one definition. For global\
    \ variables, the definition is the declaration that allocates space and provides\
    \ an initialization value, if any. For functions, the definition is the “declaration”\
    \ that provides the function body. For example, these are declarations:\n\n```\n\
    extern int i;\n\nextern int f();\n```\n\n(The keyword extern is optional in function\
    \ declarations; see question 1.11.)\nThese are definitions:\n\n```\nint i = 0;\n\
    \nint f()\n{\n    return 1;\n}\n```\n\nWhen you need to share variables or functions\
    \ across several source files, you will of course want to ensure that all definitions\
    \ and declarations are consistent. The best arrangement is to place each definition\
    \ in a relevant .c file."
