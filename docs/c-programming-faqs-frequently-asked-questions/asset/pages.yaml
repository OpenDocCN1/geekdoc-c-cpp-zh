    Answer: Believe it or not, array subscribing is commutative in C.* This curious
    fact follows from the pointer definition of array subscribing, namely, that a[e]
    is identical to * ((a) + (e)) for any two expressions a and e, as long as one
    of them is a pointer expression and one is integral. The “proof” looks like this:


    +   a[e]

    *( (a) + (e)) (by definition)

    *( (e) + (a)) (by commutativity of addition)

    e[a] (by definition)


    This unsus commutativity is often mentioned in C texts as if it were something
    to be proud of, but finds no application outside of the Obfuscated C Contest (see
    question 20.36).


