  md: '# C Programming FAQs


    STEVE SUMMIT


    Summit furnishes you with answers to the most frequently asked questions in C.
    Extensively revised from his popular FAQ on the Internet, more than 400 questions
    are addressed with comprehensive examples to illustrate key points and to provide
    practical guidelines for programmers. C Programming FAQs is a welcomed reference
    for all C programmers, providing accurate answers, insightful explanations, and
    clarification of fine points with numerous code examples.


    # Highlights


    +   - How-to manual covering the C language in a practical, nuts-and-bolts way

    - Concise, definitively correct answers to more than 400 frequently asked questions

    - Description of real problems that crop up when writing actual programs

    - Clarification of widely misunderstood issues: subtle portability problems, proper
    language usage, system-specific issues


    Steve Summit, a graduate of Massachusetts Institute of Technology, has been programming
    in C for 14 years. He is a respected voice and moderator on the Usenet/Internet
    on the C FAQ distributed on the com.lang.c newsgroup. He is currently teaching
    and working on a variety of projects in C and UNIX, with an emphasis on aggressively
    portable code and interface design.


    Source code is available free via anonymous ftp

    ftp://ftp.aw.com/authors/summit/cfaq


    Access the latest information about Addison-Wesley books from

    Internet gopher site or visit our World Wide Web page:

    gopher aw.com

    http://www.aw.com/cseng/


    ![](img/2b27505702f89a0fc85dc6e5851a2984_435_0.png)


    Addison-Wesley Publishing Company

    ISBN 0-201-84519-9'
