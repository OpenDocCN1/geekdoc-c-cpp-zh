  md: '# Expressions


    One of C''s design goals is efficient implementation—for C compilers to be reasonably
    small and easy to write and for good code to be reasonably easy to generate. This
    dual goal has significant impacts on the language specification, although the
    implications are not always appreciated by users, particularly if they are used
    for languages that are more tightly specified or that try to do more for them
    (such as protecting them from their own mistakes).


    # Evaluation Order


    A compiler is given relatively free rein in choosing the evaluation order of the
    various subexpressions within a complicated expression; this order is not as constrained
    by operator precedence and associativity as you might think. The order chosen
    by the compiler is immaterial unless there are multiple visible side effects or
    if several parallel side effects involve a single variable, in which the behavior
    may be undefined.'
