  md: '# 5 Null Pointers


    For each pointer type, C defines a special pointer value, the null pointer, that
    is guaranteed not to point to any object or function of that type. (The null pointer
    is analogous to the nil pointer in Pascal and LISP.) C programmers are often confused
    about the proper use of null pointers and about their internal representation
    (even though the internal representation should not matter to most programmers).
    The null pointer constant used for representing null pointers in source code involves
    the integer 0, and many machines represent null pointers internally as a word
    with all bits zero, but the second fact is not guaranteed by the language.


    Because confusion about null pointers is so common, this chapter discusses them
    rather exhaustively. (Questions 5.13–5.17 are a retrospective on the confusion
    itself.) If you are fortunate enough not to share the many misunderstandings covered
    or find the discussion too exhausting, you can skip to question 5.15 for a quick
    summary.'
