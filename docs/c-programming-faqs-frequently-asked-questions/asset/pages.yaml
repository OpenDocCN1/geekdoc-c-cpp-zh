    **Answer:** Use of macros like these, though perhaps superficially attractive;
    in severe cases the practice is called “preprocessor abuse.” Little can be gained
    by redefining the syntax of a language to fit your predilections, or to match
    some other language. Your predilections are unlikely to be shared by later readers
    or maintainers of the code, and any simulation of another language is most likely
    to be perfect (so any alleged convenience or utility will probably be outweighed
    by the nuisance of remembering the imperfections).


    As a general rule, it''s a good idea if the use of macros follows the syntax of
    the C language. Macros without arguments should look like variables or other identifiers;
    macros with arguments should look like function calls. Ask yourself: “If I somehow
    presented this code to the compiler without running it through the preprocessor,
    how many syntax errors would I get?” (Of course, you''d get plenty of undefined
    symbols and non-constant array dimensions, but those aren''t syntax errors.) This
    rule makes that C code, plus macros, still looks like code. So-nonsensical macros,
    as begin and or CTRL (D) (see question 10.21), can make C look like gobbledydook
    (see also question 20.36). This is of largely a style issue; see also Chapter
    17.


    # 10.3


    **Question:** How can I write a generic macro to swap two values?


    **Answer:** This question has no good answer. If the values are integers, a well-known
    trick using exclusive-OR could perhaps be used, but it will not work for floating-point
    values or pointers or if the two values are the same value.* If the macro is intended
    to be used on values of arbitrary type (the usual goal), any solution involving
    a temporary variable is problematic, because:


    +   It’s difficult to pick the temporary name that won''t clash with anything.
    Any name you pick might be the actual name of one of the variables being swapped.
    If you tried using ## to concatenate the names of the two actual arguments, to
    ensure that it won''t match either one, it might still not be unique if the concatenated
    name is longer than 31 characters,† and it wouldn''t let you swap things (such
    as a[i]) that aren''t simple identifiers.


    > *Also, the “obvious” supercompressed implementation for integer types a^b=b^a=b
    is illegal, by multiple side effects; see section 3.2.


    > †The C standard does not require compilers to look beyond the first 31 characters
    of an identifier.'
