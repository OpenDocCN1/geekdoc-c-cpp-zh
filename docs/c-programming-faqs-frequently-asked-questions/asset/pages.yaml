- img_proc: true
  md: 'The position of braces is less important, although people hold passionate beliefs.
    We have chosen one of several popular styles. Pick a style that suits you, then
    use it consistently.


    It is more important that the layout chosen be consistent (with itself and nearby
    or common code) than that it be “perfect.” If your coding environment (i.e., local
    custom or company policy) does not suggest a style and you don''t feel like inventing
    your own, just copy K&R.


    Each of the various popular styles has its good and bad points. Putting the open
    brace on a line by itself wastes vertical space; combining it with the following
    line makes it cumbersome; combining it with the previous line prevents it from
    lining up with the close brace and may make it more difficult to see.


    Indenting by eight columns per level is most common but often gets you uncomfortable
    to the right margin (which may be a hint that you should break up the function).
    If you indent one tab set stops at something other than eight columns, you''re
    requiring other people to read your code with the same software that you used.


    The elusive quality of “good style” involves much more than code layout details;
    don''t spend time on formatting to the exclusion of more substantive code quality
    issues.


    See also question 17.2.


    References: K&R1 $1.2 p. 10

    K&R2 $1.2 p. 10


    # 17.2


    Question: How should functions be apportioned among source functions?


    Answer: Usually, related functions are put together in one file. Sometimes (as
    when developing libraries), it is appropriate to have exactly one source file
    (and, consequently, one object module) per independent function. Other times,
    and especially for some programmers, numerous source files can be cumbersome,
    and it may be tempting to put most or all of a program in a few big source files.
    When the scope of certain functions or global variables is to be limited by using
    the static keyword, source file layout becomes more constrained: The static functions
    and variables the functions sharing access to them must all be in the same file.


    In other words, there are a number of tradeoffs, so it is difficult to give general
    rules. See also questions 1.7, 1.9, 10.6, and 10.7.'
  merge: -1
