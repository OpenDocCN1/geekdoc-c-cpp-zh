  md: '# MISCELLANEOUS


    343


    If the performance of your code is so important that you are willing to

    invest programming time in source-level optimizations, make sure that you

    re using the best optimizing compiler you can afford. (Compilers, even mediocre
    ones, can perform optimizations that are impossible at the source level.)


    When efficiency is truly important, the best algorithm has been chosen, and even
    the coding details matter, the following suggestions may be useful.(These are
    mentioned merely because the question is frequent; appearance here does not necessarily
    constitute endorsement by the author. Note that several of these techniques cut
    both ways and can make things worse.)


    +   Sprinkle the code liberally with register declarations for oft-used variables;
    place them in inner blocks, if applicable. (On the other hand, most modern compilers
    ignore register declarations, on the assumption that they can perform register
    analysis and assignment better than the programmer can.)


    +   Check the algorithm carefully. Exploit symmetries where possible to reduce
    the number of explicit cases.


    +   Examine the control flow: Make sure that common cases are checked first and
    handled easily. If one side of an expression involving && || will usually determine
    the outcome, make the left-hand side, if possible. (Also see question 3.6.)


    +   Use memcpy instead of memmove, if appropriate (see question 11.25).


    +   Use machine- and vendor-specific routines and #pragmas.


    +   Manually place common subexpressions in temporary variables. (Good compilers
    do this for you.)


    +   Move critical, inner-loop code out of functions and macros or in-line functions
    (and out of the loop, if invariant). If the termination condition of a loop is
    a complex loop-invariant expression, precompute it and place it in a temporary
    variable. (Good compilers do these for you.)


    +   Change recursion to iteration, if possible.


    +   Unroll small loops.


    +   Discover whether while, for, or do/while loops produce the best under your
    compiler and whether incrementing or decrementing the loop control variable works.


    +   Remove goto statements—some compilers can''t optimize as well in their presence.'
