    **Question:** This is strange; NULL is guaranteed to be 0, but the null pointer
    is not?


    **Answer:** When the term "null" or "NULL" is casually used, one of several things
    might be meant:


    +   1. The conceptual null pointer, the abstract language concept defined in question
    5.1. It is implemented with ...


    +   2. The internal, or run-time, representation of a null pointer, which may
    or not be all and which may be different for different pointer types. The actual
    values should be of concern only by compiler writers. Authors of C programs never
    see them, since they use ...


    +   3. The null pointer constant, which is a constant integer 0* (see question
    5.2). It is often hidden behind ...


    +   4. The NULL macro, which is defined to be 0 or ((void *)0) (see question 5.4).
    Finally, as red headers, we have ...


    +   5. The ASCII null character (NULL), which has all bits zero but has no relation
    to the null pointer except in name and ...


    +   6. The "null string," which is another name for the empty string (""). Using
    the term "null string" can be confusing in C, because an empty string involves
    a null pointer (''\0'') character but not a null pointer, which brings us full
    circle.


    In other words, to paraphrase the White Knight''s description of his song in Through
    the Looking-Glass, the name of the null pointer is "0", but the name of the null
    pointer is called "NULL" (and we''re not sure what the null pointer is).


    This book uses the phrase "null pointer" (lowercase) for sense 1, the character
    "0" or the phrase "null pointer constant" for sense 3, and the capitalized word
    "NULL" for sense 4.†


    References: H&S 1.3 p. 325

    nThrough the Looking-Glass, chapter VIII.


    > *More precisely, a null pointer is an integer constant expression with the value
    0, possibly cast to void *.

    *To be, very precise, the word "null" as a noun means only sense 5, and "NULL"
    means only sense 4; the other usages all use "null" as an adjective, as does the
    (unrelated) term "null statement.\ These are admittedly fine points.'
