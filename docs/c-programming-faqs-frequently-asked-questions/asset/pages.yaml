  md: '# Macro Definitions


    # 10.1


    Question: I''m trying to define a few simple little function-like macros, such
    as


    ```

    #define square(x) x * x

    ```


    but they''re not always working. Why?


    Answer: Macro expansion is purely textual. To avoid surprises, remember these
    three rules when defining function-like macros:


    +   1. The macro expansion must always be parenthesized to protect any lower-precedence
    operators from the surrounding expression. Given the (incorrect) square() macro
    in the question, the invocation

    1 / square(n)

    would expand to

    1 / n * n

    which evaluates as (1 / n) * n. What you want, however, is

    1 / (n * n)

    In this case, the problem is one of associativity rather than precedence, but
    the effect is the same.


    +   2. Within the macro definition, all occurrences of the parameters must be
    parenthesized to protect any low-precedence operators in the actual arguments
    from the rest of the macro expansion. Again given the square() macro, the invocation

    square(n + 1)

    would expand to

    n + 1 * n + 1

    But what you want is

    (n + 1) * (n + 1)'
