    Question: Should I use symbolic names, such as TRUE and FALSE, for Boolean constants
    or plain 1 and 0?


    Answer: See question 9.4.


    # 17.8


    Question: What is “Hungarian notation”? Is it worthwhile?


    Answer: Hungarian notation is a naming convention, invented by Charles Simonyi,
    that encodes things about a variable''s type(and perhaps its intended use) in
    its name. It is well loved in some circles and roughly castigated in others. Its
    chief advantage is that it makes a variable''s type or intended obvious from its
    name; its chief disadvantage is that type information is not necessarily a worthwhile
    thing to carry around the name of a variable.


    Reference: Simonyi and Heller, “The Hungarian Revolution”


