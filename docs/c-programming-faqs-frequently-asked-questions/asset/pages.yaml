    Question: I use the preprocessor macro


    ```

    #define Nullptr(type) (type *)0

    ```


    to help me build null pointers of the correct type.


    Answer: This trick, though popular and superficially attractive, does not buy
    it. It is not needed in assignments and comparisons; see question 5.2. It does
    not even save keystrokes. Its use may suggest to the reader that the program''s
    author is shaky on the subject of null pointers, requiring that the definition
