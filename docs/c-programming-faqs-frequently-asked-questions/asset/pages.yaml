    Question: Why does the declaration


    ```

    extern f(struct x *p);

    ```


    give me an obscure warning message about "struct x introduced in prototype scope"
    or "struct x declared inside parameter list"?


    Answer: In a quirk of C''s normal block scoping rules, for the first time within
    a function prototype cannot be compatible with other structures declared in the
    same source file. The problem is that the structure and the tag go out of scope
    at the end of the prototype; see question 1.29.


    To resolve the problem, you should probably rearrange things so that the actual
    declaration of the structure precedes the function prototype(s) using it. (Usually,
    both the prototype and the structure declaration will end up in the same header
    file, so that the one they''re referring to is the same struct.) If you must mention
    a hitherto unseen structure in a prototype, precede the prototype with the line:


    ```

    struct x;

    ```


    This vacuous-looking declaration places an (incomplete) declaration of struct
    x at file scope, so that all following declarations involving struct x can at
    least be sure struct x.


    References: ANSI §3.1.2.1, §3.1.2.6, §3.5.2.3

    ISO §6.1.2.1, §6.1.2.6, §6.5.2.3


