  md: '# THE C PREPROCESSOR


    # 10.7


    **Question:** Is it acceptable for one header file to include another?


    **Answer:** It''s a question of style, and thus receives considerable debate.

    Many people believe that “nested #include files” are to be avoided; the prestigious
    Indian Hill Style Guide (see question 17.9) disparages them; they can make it
    harder to find relevant definitions, they can lead to multiple-definition errors
    if a file is included twice, and they make manual Makefile maintenance very difficult.


    On the other hand, nested #include files can be used in a modular way (a header
    file can include what it needs itself, rather than requiring each includer to
    do so). A tool like grep (or a tags file) makes it easy to find definitions no
    matter where. A popular trick can be used in each header file to make it “idempotent”
    so that it can safely be included multiple times:


    ```

    #ifndef FILENAME_USED

    #define FILENAME_USED

    ...header file contents...

    #endif

    ```


    (A different bracketing macro name is, of course, for each header file.) Finally,
    automated Makefile maintenance tools (which are a virtual necessity in large projects
    anyway; see question 18.1) handle dependency generation in the face of nested
    #include files easily.

    See question 17.10.


    References: Rationale §4.1.2


    # 10.8


    **Question:** Where are header (“#include”) files searched for?


    **Answer:** The exact behavior is implementation-defined (which means that it
    is supposed to be documented; see question 11.33). Typically, headers named with
    <> syntax are searched for one or more standard places. Header files with "" syntax
    are searched for first in the “current directory” and


    *Strictly speaking, <> headers do not have to exist as files at all. The <> syntax
    is usually reserved for system-defined headers.'
