    Question: How do I get an accurate error status return from system on MS-DOS?


    Answer: You can''t; COMMAND.COM doesn''t tend to provide one. If you don''t need
    COMMAND.COM''s services (i.e., if you''re just trying to invoke a simple program,
    without I/O redirection and such), try one of the spawn routines, instead.


    # 19.30


    Question: How can I invoke another program or command and trap its output?


    Answer: UNIX and some other systems provide a popen function, which sets up stdin
    stream on a pipe connected to the process running a command, so that the calling
    program can read the output (or alternatively supply the input). Using popen,
    the last example from question 19.28 would look like


    ```

    extern FILE *popen();


    sprintf(cmdbuf, "sort < %s", datafile);


    fp = popen(cmdbuf, "r");


    /* ...now read sorted data from fp... */

    ```


    (Be sure to call pclose, as shown; leaving it out will seem to work at first but
    may eventually run out of processes.)


    If you can''t use popen, you may be able to use system, with the output going
    to a file that you then open and read, as the code in question 19.28 was doing
    already.*


    If you''re using UNIX and popen isn''t sufficient, you can learn pipe, dup, fork,
    and exec.'
