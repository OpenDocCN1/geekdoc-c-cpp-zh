  md: '# Characters and Strings


    C has no built-in string type; by convention, a string is represented as an array
    of characters terminated with ''\0''. Furthermore, C hardly has a character type;
    a character is represented by its integer value in the machine''s character set.
    Because these representations are laid bare and are visible to C programs, programs
    have a tremendous amount of control over how characters and strings are manipulated.
    The downside is that to some extent, programs *have* to exert this control: The
    programmer must remember whether a small integer is being interpreted as a numeric
    value or as a character (see question 8.6) and must remember to maintain arrays
    (and allocated blocks of memory) containing strings correctly.


    See also questions 13.1 through 13.7, which cover library functions for string
    handling.'
