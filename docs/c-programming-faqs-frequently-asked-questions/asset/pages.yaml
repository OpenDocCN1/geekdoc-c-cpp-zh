  md: "# 13.21\n\nQuestion: I'm porting a program, and it calls a function drand48,\
    \ which my library doesn't have. What is it?\n\nAnswer: The UNIX System V function\
    \ drand48 returns floating-point random numbers (presumably with 48 bits of precision)\
    \ in the half-open interval [0, 1). Its companion seed function is rand48; neither\
    \ is in the C standard. It's easy to write a low-precision replacement:\n\n```\n\
    #include <stdlib.h>\n\ndouble drand48()\n{\n    return rand() / (RAND_MAX + 1);\n\
    }\n```\n\nTo accurately simulate drand48's semantics, you can try to give it closer\
    \ to 48 bits worth of precision:\n\n```\n#define PRECISION 2.82e14    /* 2**48,\
    \ rounded up */\n\ndouble drand48()\n{\n    double x = 0;\n    double denom =\
    \ RAND_MAX + 1;\n    double need;\n\n    for(need = PRECISION; need > 1; \n  \
    \      need /= (RAND_MAX + 1.0)) {\n            x += rand() / denom;\n       \
    \     denom *= RAND_MAX + 1;\n        }\n\n    return x;\n}\n```\n\nBefore using\
    \ code like this, though, beware that it is numerically suspect, particularly\
    \ if (as is usually the case) the period of rand is on the order of RAND_MAX.\
    \ (If you have a longer-period random number generator available, such as BSD\
    \ random, definitely use it when simulating drand48.)"
