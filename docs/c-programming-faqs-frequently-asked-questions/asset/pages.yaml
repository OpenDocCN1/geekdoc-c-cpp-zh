- img_proc: true
  md: 'A good rule of thumb is that for each call to malloc in a program, you should
    be able to point at the call to free that frees the memory allocated by that malloc
    call.

    See also question 7.24.


    # 7.24


    Question: Must I free allocated memory before the program exits?


    Answer: You shouldn''t have to. It''s the operating system''s job to reclaim memory
    when a program exits; the system cannot afford to have memory integrity depend
    on the whims of random programs. (Strictly speaking, it is not even free''s job
    to return memory to the operating system; see question 7.25.) Nevertheless, some
    personal computers are said not to reliably recover unless it was freed before
    exiting, and all that can be inferred from the ANSI/ISO C Standard is that this
    issue is one of “quality of implementation.

    in any case it can be considered good practice to explicitly free all memory—for
    example, in case the program is rewritten to perform its main task more than once
    (perhaps under a graphical user interface). On the other hand, some programs,
    such as interpreters, don''t know what memory they''re done with (i.e., what memory
    could be freed) until it''s time to exit, and since all memory should be released
    at exit, it would be a needless, potentially expensive, and error-prone exercise
    for the program to explicitly free all of it.


    References: ANSI §4.10.3.2

    ISO §7.10.3.2


    # 7.25


    Question: I have a program that allocates and later frees a lot of memory, but
    memory usage doesn''t seem to go back down. Why?


    Answer: Most implementations of malloc/free do not return memory to the operating
    system (if there is one) but merely make it available for future malloc calls
    within the same program.


    *Also, unless a program frees all memory it knows about, it''s much more difficult
    to see real memory leaks detected by a “leak checking” tool (see question 18.2).'
