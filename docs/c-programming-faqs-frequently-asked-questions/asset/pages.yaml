  md: '# 5.14


    **Question:** Why is there so much confusion surrounding null pointers? Why do
    these questions come up so often?


    **Answers:** C programmers traditionally like to know more than they need to be
    about the underlying implementation. The fact that null pointers are represented
    as zero in both source code and internally to most machines invites unwarranted
    assumptions. The use of a preprocessor macro (NULL) may seem to suggest that the
    value could change some day or on some weird machine. The construct "if (p ==
    0)" is easily misread as calling for version of p to an integral type rather than
    0 to a pointer type, before the comparison. the distinction among the several
    uses of the term "null" (listed in question 5.13) is often overlooked.


    One good way to wade out of the confusion is to imagine that C used a keyword
    (perhaps nil, like Pascal) as a null pointer constant. The compiler could either
    turn nil into the correct type of pointer when it could determine the type from
    the source code or complain when it could not. In C, in fact, the keyword for
    a null pointer constant is not nil but 0, which works almost as well, except that
    an uncast 0 in a nonpointer context generates an integer instead of an error message;
    and if uncast 0 was exposed to be a null pointer constant, the code may not work.


    # 5.15


    **Question:** Is there an easier way to understand all this null pointer stuff?


    **Answer:** Follow these two simple rules:


    +   1. When you want a null pointer constant in source code, use "0" or "NULL".


    +   2. If the usage of "0" or "NULL" is an argument in a function call, cast it
    to the pointer type expected by the function being called.


    The rest of this chapter has to do with other people''s misunderstandings, with
    the internal representation of null pointers (which you shouldn''t need to know),
    and with ANSI C refinements. If you understand questions 5.1, 5.2, and 5.4, and
    consider 5.3, 5.9, 5.13, and 5.14, you''ll do fine.'
