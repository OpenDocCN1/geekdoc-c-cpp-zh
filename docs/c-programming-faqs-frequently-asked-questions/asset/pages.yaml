  md: '# Redirecting stdin and stdout


    **Question:** How can I redirect stdin or stdout to a file from within a program?


    **Answer:** Use freopen. If you''d like a function f() that normally writes to
    stdout to send its output to a file instead, and you don''t have the option of
    rewriting f, you can use a sequence like this:


    ```

    freopen(file, "w", stdout);

    f();();

    ```


    See, however, question 12.34.


    References: ANSI $4.9.5,4

    ISO $7.9.5.4

    H&S $15.2 pp. 347–38


    **Question:** Once I''ve used freopen, how can I get the original stdout (or stdin)
    back?


    **Answer:** There isn''t a good way. If you need to switch back, the best solution
    is not to have used freopen in the first place. Try using your own explicit output
    (or input) stream variable, which you can reassign at will, leaving the original
    stdout (or stdin) undisturbed. For example, declare a global


    ```

    FILE *ofp;

    ```


    and replace all calls to printf( ... ) with fprintf(ofp, ... ). (Obviously, you''ll
    have to check for calls to putchar and puts, too.) Then you can set ofp to stdout
    or to anything else.'
