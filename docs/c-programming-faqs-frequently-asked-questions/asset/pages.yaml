  md: '# ANSI/ISO STANDARD C 179


    Answer: The definition of # says that it''s supposed to stringize a macro argument
    immediately, without further expanding it (if the argument happens to be the name
    of another macro). You can use something like the following two-step procedure
    to force a macro to be both expanded and stringized:


    ```

    #define Str(x) #x

    #define Xstr(x) Str(x)

    #define OP plus

    char *opname = Xstr(opname);

    ```


    This code sets opname to "plus" rather than to "OP". (It works because the Xstr()
    macro expands its argument, and then Str() stringizes it.)

    An circumlocution is necessary with the token-passing operator ## when the values
    (rather than the names) of macros are to be concatenated.

