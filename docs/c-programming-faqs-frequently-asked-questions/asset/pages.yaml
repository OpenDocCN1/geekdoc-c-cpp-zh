  md: '# CHAPTER 10


    # Header Files


    # 10.6


    **Question:** I''m splitting up a program into multiple source files for the first
    time. What should I put in .c files and what should I put in .h files? (What does
    “h” mean, anyway?)


    **Answer:** As a general rule, you should put these things in header (.h) files:


    +   - Macro definitions (processor #defines)


    +   - Structure, union, and enumeration declarations


    +   - Typedef declarations


    +   - External function declarations (see also question 1.11)


    +   - Global variable declarations


    It''s especially important to put a declaration or a definition in a header file
    when it will be shared among several files. Do not repeat a declaration or macro
    definition at the top of two or more source files; do put it in a header file
    and use #include to bring the header wherever needed. The reason is not just to
    save typing: you want to set things up so that whenever a declaration or a definition
    changes, you have to change it in only one place, with the update propagated to
    all source files consistently. (In particular, never put external function prototypes
    remain private in .c files. See also question 1.7.)


    On the other hand, when a definition or a declaration should private to one source
    file, it''s fine to leave it there. (Private file-scope functions and variables
    should also be declared static. See also question 2.4.)


    Finally, you should not put actual code (i.e., function bodies) or global variable
    definitions (that is, defining or initializing instances) in header files. Also,
    when you are building a project out of multiple source files, you should compile
    each of them separately (using a compiler option to respect compilation) only
    and use the linker to link the result object files together. (In an integrated
    development environment, all of this may be taken care for you.) Don''t try to
    “link” all of your source files together with #include; the #include directive
    should be used to pull in header files, not other .c files. See also questions
    1.7, 10.7, and 17.2.'
