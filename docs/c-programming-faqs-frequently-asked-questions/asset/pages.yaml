  md: '# printf Formats


    Question: How can I print a ''%'' character in a printf format string? I tried
    \, but it didn''t work.


    Answer: Simply double the percent sign: %%\.

    The reason it''s tricky to print % signs with printf is that % is essentially
    printf''s escape character. Whenever printf sees a %, it expects it to be followed
    by a character telling it what to do next. The two-character sequence %% is defined
    to print a single %.

    To understand why \ can''t work, remember that the backslash \ is the compiler''s
    escape character and controls how the compiler interprets source code at compile
    time. In this case, however, we want to control how printf interprets its format
    string at run time. As far as the compiler is concerned, the escape sequence \%
    is undefined and probably results in a single % character. It would be unlikely
    for both the \ and the % to make it through to printf, even if printf were prepared
    to treat the \ specially.

    See also questions 8.8 and 19.17.


    References: K&R1 $7.3 p. 147

    K&R2 $7.2 p. 134

