    # 345


    # 20.14


    **Question:** Are pointers really faster than arrays? How much do function calls
    slow things down? Is++i faster than i = i + 1?


    **Answer:** Precise answers to these and many similar questions depend of, course,
    on the processor and compiler in. If you simply must know, you''ll have to time
    programs carefully. (Often, the differences are so slight that hundreds of thousands
    of iterations are required even to see them.) Check the compiler''s assembly language
    output, if available, to see whether two ported alternatives aren''t identically.


    It is “usually” faster to march through large arrays with pointers faster than
    array subscripts, but for some processors, the reverse is true. (Better compilers
    should generate good code regardless of which notation you use)


    Function calls, though obviously incrementally slower than in-line code, contribute
    so to modularity and code clarity that there is rarely good reason to avoid them.
    (Actually, by reducing bulk, functions can improve performance.) Also, some compilers
    are able to expand small, critical-path functions in-line, as an optimization
    or at the programmer''s request.


    Before rearranging expressions such as i = i + , remember that you are dealing
    with a compiler, not a keystroke-programmable calculator. Any decent compiler
    will generate identical code for ++i, i += 1, and i = i + 1. The reasons for using
    ++i or i += 1 over i = i + 1 have to do with style, not efficiency. (See also
    question 3.12.)


    # 20.15


    **Question:** Is it worthwhile to replace multiplications and divisions with shift
    operators?


    **Answer:** This is an excellent example of a potentially risky and usually unnecessary
    optimization. Any compiler worthy of the name can replace a constant, power-of-two
    multiplication with a left shift or a similar division of an unsigned quantity
    with a right shift (Ritchie''s original PDP-11 compiler, though it ran in less
    than 64K of memory and omitted several features now considered mandatory, performed
    both of these optimizations, without even


    > *If it''s difficult to measure, it may suggest that you don''t have to worry
    about the difference after all.'
