  md: '# 274 CHAPTER 16


    **Answer:** There are at least three things to look for:


    +   1. If a semicolon in a previous declaration is missing, main might be inadvertently
    declared as returning a structure, conflicting with the run-time startup code''s
    expectations. See questions 2.18 and 10.9.

    2. If setbuf or setvbuf is called and if the supplied buffer is local to main
    (and automatic), the buffer may not exist any more by the time the std library
    tries to perform its final cleanup.

    3. A cleanup function registered byatexit may have an error. Perhaps it is trying
    to reference data local to main or to another function that no longer exists.


    (The second and third problems are closely related to question 7.5; see also question
    11.16.)


    Reference: CT&P $5.3 pp. 72–3


    ![](img/2b27505702f89a0fc85dc6e5851a2984_317_0.png)


    **Question:** This program runs perfectly on one machine, but I get weird results
    on another. Stranger still, adding or removing debugging printouts changes the
    symptoms. What''s wrong?


    **Answer:** Lots of things could be going wrong; here are a few of the common
    things to check:


    +   * uninitialized local variables* (see also question 7.1)

    * integer overflow, especially on 16-bit machines, especially of an intermediate
    result when doing things like a * b / c (see also question 3.14)

    * undefined evaluation order (see questions 3.1 through 3.4)

    * omitted declaration of external functions, especially those that return something
    other than int (see questions 1.25 and 14.2)

    * dereferenced null pointers (see Chapter 5)

    * improper malloc/free use (assuming that freshly allocated memory contains 0,
    assuming free storage persists, freeing something; see also questions 7.19 and
    7.20)


    > *On a stack-machine, at the value that an uninitialized local variable happens
    to depend on what is on the stack and what has been called recently. That''s why
    inserting or removing debugging printouts can make a bug away; printf is a large
    function, calling it or not can make a large difference in what''s left on the
    stack.'
