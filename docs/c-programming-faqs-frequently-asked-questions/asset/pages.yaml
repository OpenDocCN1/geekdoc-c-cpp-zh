  md: '# 14.6


    Question: How do I round numbers?


    Answer: The simplest and most straightforward way is with code such as


    ```

    (int) (x + 0.5)

    ```


    C''s floating-to-integer conversion truncates (discards) the fractional part,
    so adding 0.5 before truncating arranges that fractions ≥ 0.5 will be rounded
    up. (This technique won''t work properly for negative numbers, though.)


    You can round to a certain precision by scaling:


    ```

    (int) (x / precision + 0.5) * precision

    ```


    Handling negative numbers or implementing even/odd rounding is slightly trickier.


    Note that truncation is otherwise the default, it''s usually a good to use an
    explicit rounding step when converting floating-point numbers to integers. Unless
    you''re careful, it''s quite possible for a number you thought was 8.0 to be represented
    internally as 7.999999 and to be truncated to 7.


    # 14.7


    Question: Why doesn''t C have an exponentiation operator?


    Answer: One reason is probably that few processors have a built-in exponentiation
    instruction. C has a pow function (declared in <math.h>) for performing exponentiation,
    although explicit multiplication is often better for small integer exponents.*
    In other words, pow(x, 2.) is probably inferior to x * x. (If you''re tempted
    to make a Square() macro, though, check question 10.1.)


    References: ANSI $4.5.5.1

    ISO $7.5.5.1

    H&S $17.6 p. 393


    > *In particular, not all implementations of pow yield the expected results when
    both arguments are integral. For example, on some systems, (int)pow(2., 3.) gives
    7 due to truncation; see also question 14.6.'
