  md: '# Sizes of Allocated Blocks


    Each block of memory allocated by malloc obviously has a known, fixed size, but
    once it''s allocated, you can''t ask the malloc package what that size is. (For
    one thing, if you could ask, should it tell you the size you asked for or the
    possibly larger size it gave you?)


    ```

    7.26

    ```


    Question: How does free() know how many bytes to free?


    Answer: The malloc/free implementation remembers the size of each block allocated
    and returned, so it is not necessary to remind it of the size when freeing. (Typically,
    the size is stored adjacent to the allocated block, which is why things usually
    break badly if the bounds of the allocated block are even slightly overstepped;
    see also question 7.19.)


    ```

    7.27

    ```


    Question: So can I query the malloc package to find out how big an allocated block
    is?


    Answer: Not portably. If you need to know, you''ll have to keep track of it yourself.


    ```

    7.28

    ```


    Question: Why doesn''t sizeof tell me the size of the block of memory pointed
    to by a pointer?


    Answer: The sizeof operator does not know that malloc has been used to allocate
    a pointer; sizeof tells you the size of the pointer itself. There is no portable
    way to find out the size of a block allocated by malloc.'
