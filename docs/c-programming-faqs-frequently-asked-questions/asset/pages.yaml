  md: '# 12 The Standard I/O Library


    A program isn''t very useful unless you can tell it what to do and it can tell
    you what it has done. Almost any program must therefore do some I/O. C''s I/O
    is through library functions—those in the standard I/O, or “stdio” library*—and
    these functions are therefore some of the most used in C''s libraries.


    In keeping with C''s minimalist philosophy, the stdio functions assume a fairly
    bare-bones, least-common-denominator I/O model. You can open, read, and write
    to files. Files are treated as sequential character streams, although seeking
    is possible. You can make a distinction between text and binary files if it''s
    meaningful. You name a file by a string that represents an arbitrary file name
    or pathname; its interpretation is specific to the underlying operating system.
    There is no notion of directories except as embedded in pathnames, and there is
    no standard way to create or list directories (see Chapter 19). Three predefined
    I/O streams are opened for your program implicitly: You can read from stdin, which
    is often an interactive keyboard, and you can write to stdout or stderr, both
    of which are often the user’s


    > *When we refer to “the stdio library,” we really mean “the stdio functions within
    the standard C run-time library,” or “the functions described by <stdio.h>.”'
