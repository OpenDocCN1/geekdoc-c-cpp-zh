    Question: I have some old code that** tries to construct identifiers with a macro
    like


    ```

    #define Paste(a, b) a/**/b

    ```


    but it''s not working any more. Why?


    Answer: That macro worked only by accident. An undocumented feature of some early
    preprocessor implementations was that comments disappeared entirely and could
    be used for token pasting. ANSI affirms (as did K&R1) that comments are replaced
    with white space, so they cannot portably be used in a Paste() macro. However,
    since the need for pasting tokens was demonstrated and real, ANSI introduced a
    well-defined token-pasting operator, ##, which can be used like:


    ```

    #define Paste(a, b) ##b

    ```


