  md: '# SYSTEM DEPENDENCIES 305


    Functions in the curses library to be clear, move, standout/standend, and atron/attroff/attrset;
    the last work with attribute codes such as A_REVERSE. MS-DOS libraries typically
    have functions named gotoxy and lscr or _clearscreen; you can also use the ANSI.SYS
    driver or low-level interrupts. Under termcap or terminfo, use getstr to retrieve
    strings like cl, so/se, and em for clear screen, standout mode, and cursor movement;
    then output the strings (using cm additionally requires calling goto. Some baroque
    terminals require attention to “capabilities” as well; study the documentation
    carefully. We are aware that some older terminals may not support the desired
    capabilities at all.


    For clearing the screen, a halfway portable solution is to print a form-feed character
    ''\f’, which will cause some displays to clear. Even more portable would be to
    print enough newlines to scroll everything away. As a last resort, you could use
    system (question 19.27) to invoke an operating system clear-screen command.


    References: PCS $5.1.4 pp. 54–60, $5.1.5 pp. 60–2


    +   Strange, Programming with curses

    Strange, Mui, and O’Reilly, termcap & terminfo


    ![](img/2b27505702f89a0fc85dc6e5851a2984_348_0.png)


    Question: How do I read the arrow keys? What about function keys?


    Answer: Terminfo, some versions of termcap, and some versions of curses have support
    for these non-ASCII keys. Typically, a special key has a multi-character sequence
    (usually beginning with ESC, ''\033''); parsing these can be tricky. The curses
    library will do the parsing for you, if you call keypad first.


    Under MS-DOS, if you receive a character with value 0 (not ‘0’) while reading
    the keyboard, it’s a flag indicating that the next character read will be a code
    indicating a special key. See any DOS programming guide for lists of keyboard
    codes. (Very briefly, the up, left, right, and down arrow keys are 72, 75, 77,
    and 80, and the function keys are 59 through 68.)


    Reference: PCS $5.1.4 pp. 56–7'
