  md: '# 15.11


    Question: I can''t get va_arg to pull in an argument of type pointer to function.
    Why not?


    Answer: Try using a typedef for the function pointer type.

    The type-rewriting games with the va_arg macro typically leaves stymied by overly
    complicated types, such as pointer to function. To illustrate, a simplified implementation
    of va_arg is:


    ```

    #define va_arg(argp, type) \n(*type*) ((argp) += sizeof(type)) - sizeof(type)

    ```


    where argp''s type (va_list) is char *. When you attempt to invoke va_arg(argp,
    int ()) the expansion is:


    ```

    (*int (*))) ((argp) += sizeof(int (*) ())) \nsizeof(int (*) ()))

    ```


    That expansion, however, is a syntax error (the first cast (int ()*) is meaningless).*\nIf
    you use a typedef for the function pointer type, however, all will be well. Given


    ```

    typedef int (*funcptr);

    ```


    the expansion of


    ```

    va_arg(argp, funcptr)

    ```


    is


    ```

    (*funcptr*) ((argp) += sizeof(funcptr)) - sizeof(funcptr))

    ```


    This expansion works correctly.\nSee also questions 1.13, 1.17, and 12.21.


    References: ANSI $4.8.1.2\nISO $7.8.1.2\nRationale $4.8.1.2


    *The "right" expansion would have been\n(*int (**))()) ((argp) += sizeof(int (*)
    ())) - sizeof(int (*) ())))'
