  md: '# DECLARATIONS AND INITIALIZATIONS


    # Pointer Declarations


    Although most questions about pointers come in Chapters 4 through 7, here are
    two that that touch specifically on declarations.


    # 1.5


    Question: What''s wrong with this declaration?


    ```

    char* p1, p2;

    ```


    I get errors when I try to use p2.


    Answer: Nothing is wrong with the declaration—except that it doesn''t do what
    you probably want. The * in a pointer declaration is not part of the base type;
    it is part of the declarator containing the name being declared (see question
    1.21). In the declaration as written


    ```

    char *p1, *p2;

    ```


    Since the * is part of the declarator, it''s best to use whitespace as shown;
