    # 215


    You might wonder whether you could skip freopen entirely and do something like


    ```

    FILE *savestdevout = stdout;

    stdout = fopen(file, "w");      /* WRONG */

    ```


    leaving useless to restore stdout later by doing


    ```

    stdout = savestdevout;      /* WRONG */

    ```


    Code like this is not likely to work, because stdout (and stdin and stderr) are
    typically constants, which cannot be reassigned (which is why freopen exists in
    the first place).


    It is barely possible to save away information about a stream before calling freopen
    to open another file in its place, such that the original stream can be restored,
    but the methods involve system-specific calls, such as dup, or copying or inspecting
    the contents of a FILE structure, which is exceedingly nonportable and unreliable.


    Under some systems, you can explicitly open the controlling terminal (see question
    12.36), but this isn''t necessarily what you want, since the original input or
    output (i.e., what stdin or stdout had been been before you called freopen) could
    have been redirected from the command line.


    If you''re trying to capture the result of a subprogram execution, freopen probably
    won''t work anyway; see question 19.30 instead.


    ![](img/2b27505702f89a0fc85dc6e5851a2984_258_0.png)


    Question: How can I tell whether input or output is redirected, i.e., whether
    "<" or ">" was used on the invocation command line?


    Answer: You can''t tell directly, but you can usually look at a few other things
    to make whatever decision you need to. If you want your program to take input
    from stdin when not given input files, you can do so if argv doesn''t mention
    any input files (see question 20.3) or perhaps if you''re given a placeholder,
    such as "-", instead of a file name. If you want to suppress prompts if input
    is not coming from an interactive terminal, on some systems (e.g., UNIX, and usually
    MS-DOS), you can use isatty(0) or isatty(fileno(stdin)) to make the determination.'
