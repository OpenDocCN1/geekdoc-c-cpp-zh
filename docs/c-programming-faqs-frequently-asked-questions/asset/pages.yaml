    # 11.28


    **Question:** What was noalias and what ever happened to it?


    **Answer:** The type qualifier noalias (in the same syntactic class as const and
    volatile), was intended to assert that an object was not pointed to (“aliased”)
    by other pointers. The primary application would have been for the formal parameters
    of functions designed to perform computations on large arrays. A compiler cannot
    usually take advantage of vectorization or other parallelization hardware (on
    supercomputers that have it) unless it can ensure that the source and destination
    arrays do not overlap.


    The noalias keyword was not backed up by any “prior art,” and it was introduced
    late in the review and approval process. It was surprisingly difficult to define
    precisely and explain coherently, and sparked widespread, acrimious debate. It
    had far-ranging implications, particularly for standard library interfaces, for
    which easy fixes were not readily apparent.'
