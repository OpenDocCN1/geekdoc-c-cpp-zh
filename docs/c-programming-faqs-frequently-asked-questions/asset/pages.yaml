  md: '# Code Samples


    This is a book about C, so many small pieces of it are necessarily written in
    C. The examples are written primarily for clarity of exposition. They are not
    always written in the most efficient way possible; making them “faster” would
    often make them less clear. (See question 20.13 for more information about code
    efficiency.) They are primarily written using modern, ANSI-style syntax; see question
    11.29 for conversion tips if you''re still using a “classic” compiler.


    The author and publisher invite you to read and modify these code fragments in
    your own programs, but of course we would appreciate acknowledgment if you do
    so. (Some fragments are from other sources and are so attributed; please acknowledge
    those contributors if you use those codes.) The source code for the larger examples
    is available on the Internet via anonymous ftp from aw.com in directory csnq/authors/summit/cfaq
    (see also question 18.12).


    To underscore certain points, it has unfortunately been necessary to include a
    few code fragments that are examples of not to do. In the answers, such code fragments
    are marked with an explicit comment like /* WRONG */ to remind you not to emulate.
    (Code fragments in questions are not usually marked; it should be obvious that
    the code fragments in questions are suspect, as the question is usually “Why doesn’t
    this work?”)


    # Organization


    As mentioned, this book’s questions are based on real questions asked by real
    people, and real-world questions do not always fall into neat hierarchies. Many
    questions touch on several topics: What seems to be a memory allocation problem
    may fact reflect an improper declaration. (Several questions straddle chapter
    boundaries in both chapters, to make them easier to find.) In any case, this is
    not a book you have to read sequentially: Use the table of contents, the list
    of questions that follows it, the index, and the cross-references between questions
    to find the topics that are of interest to you. (And, if you have some free time,
    you find yourself reading through sequentially anyway; perhaps you’ll encounter
    the answer to a question you hadn''t thought to ask yet.)


    Usually, you have to declare your data structures before you can start writing
    code, so Chapter 1 starts out by talking about declaration and initialization.
    C’s structure, union, and enumeration types are complicated enough'
