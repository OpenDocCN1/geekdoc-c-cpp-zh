    # The Standard


    # 11.1


    Question: What is the “ANSI C Standard?”


    Answer: In 1983, the American National Standards Institute (ANSI) com-\missioned
    a committee, X3J11, to standardize the C language. After a long,

    arduous process, including several widespread public reviews, the committee’s

    work was finally ratified as ANSI X3159-1989 on December 14, 1989, and

    published in the spring of 1990. For the most part, ANSI C standards

    existing practice, with a few additions from C++ (most notably function pro-

    totypes and support for multinational character sets (including the contro-\versal
    subgraph sequences). The ANSI C Standard also formalizes the C run-

    time library functions.


    More recently, the standard has been adopted as an international standard,

    ISO/IEC 9899:1990, and this version replaces the earlier X3.159 even within

    t United States. Its sections are numbered differently (briefly, ISO sections

    5 through 7 correspond roughly to the old ANSI sections 2 through 4). As an

    ISO standard, it is subject to ongoing revision through the release of Techni-

    cal Corrigenda and Normative Addenda.


    In 1994, Technical Corrigendum 1 amended the standard in about 40

    places, most of them corrections or clarifications. More recently, Nor-

    mative Addendum 1 added about 50 pages of new material, mostly specify-

    ing new library functions for internationalization. The production of Techni-

    cal Corrigenda is an ongoing process, and a second is expected in late

    1995. In addition, both ANSI and ISO require periodic review of their stan-

    dards. This process begins in 1995 and will likely result in a completely

    revised standard (nickname “C9X”), on the assumption of completion by

    1999.


    The original ANSI standard included a “Rationale” explaining many of its

    decisions and discussing a subset of points, including several of those

    covered here. (The Rationale was “not part of ANSI Standard X3.159-1989,

    but ... included for information only” and is not included with the ISO-

    dard.)'
