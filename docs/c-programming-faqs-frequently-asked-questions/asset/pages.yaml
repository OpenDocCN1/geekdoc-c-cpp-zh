  md: '# 19.18


    Question: I''m getting an error: “Too many open files.” How can I increase the
    allowable number of simultaneously open files?


    Answer: There are at least two resource limitations on the number of simultaneously
    open files: the number of low-level “file descriptors” or “file handles” available
    in the operating system and the number of FILE structures available in the stdio
    library. Both must be sufficient. Under MS-DOS systems, you can control the number
    of operating system file handles with a line in CONFIG.SYS. Some compilers come
    with instructions (and perhaps a source file or two) for increasing the number
    of stdio FILE structures.


    # 19.19


    Question: How can I find out how much free space is available on disk?


    Answer: There is no portable way. Under some versions of UNIX, you can call stat.
    Under MS-DOS, use interrupt 0x21 subfunction 0x36 or perhaps a function such as
    diskfree. Another possibility is to use popen (see question 19.30) to invoke and
    read the output of a “disk free” command (e.g., df on UNIX).


    (Note that the amount of free space apparently available on a disk may not match
    the size of the largest file you can store, for all sorts of reasons.)


    # 19.20


    Question: How can I read a directory in a C program?


    Answer: See whether you can use the opendir and readdir functions, which are part
    of the POSIX standard and are available on most UNIX variants. Implementations
    also exist for MS-DOS, VMS, and other systems. (MS-DOS also has FINDFIRST and
    FINDNEXT routines, which do essentially the same.) The readdir function returns
    only file names; if you need more information about the file, calling stat. To
    match filenames to some wildcard pattern, see question 13.7.'
