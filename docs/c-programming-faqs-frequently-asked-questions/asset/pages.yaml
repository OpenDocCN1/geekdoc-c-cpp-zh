  md: '# CHAPTER 12


    More generally, scanf is designed for relatively structured, formatted input (its
    name is, in fact, derived from “scan formatted”). If you attention tell you whether
    it succeeded or failed, but it can tell you approximately where it failed and
    not at all how or why. You have very little opportunity to do any error recovery.


    Yet interactive user input is the least structured input there is. A well-designed
    user interface will allow for the possibility of the user typing anything—not
    just letters or punctuation when digits were expected, but also more or fewer
    characters than were expected, no characters at all (i.e., just the Return key),
    premature EOF, or anything. It’s nearly impossible to deal gracefully with all
    of these potential problems when using scanf; it’s easier to read entire lines
    (with fgets or the like), then interpret, using either scanf or atoi other techniques.
    (Functions such as strtok, and atoi see examples 12.16 and 13.6.) If you do use
    scanf, don’t forget to check the return value to make sure that the expected number
    of items was found.


    Note, by the way, criticisms of scanf are not necessarily indictments of scanf.
    The standard input implicitly read by scanf usually an interactive keyboard and
    is therefore the least constrained, leading to the most problems. When a file
    has a known format, on the other hand, it may be appropriate to read it with scanf.
    It’s perfectly appropriate to parse strings with scanf (as long as the return
    value is checked), because it’s so easy to regain control, restart the scan, discard
    the input if it didn’t match, etc.


    Reference: K&R2 §7.4 p. 159


