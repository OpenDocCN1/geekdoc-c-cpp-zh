  md: 'The CDC Cyber 180 Series has 48-bit pointers consisting of a ring, segment,
    and offset. Most users (in ring 11) have null pointers of 0xB00000000000. It was
    common on old CDC ones-complement machines to use an all-one-bits word as a special
    flag for all kinds of data, including invalid addresses.


    The old HP 3000 series use different addressing schemes for addresses and word
    addresses; several of the previous machines, it therefore use different representations
    for char * and void * pointers than for other pointers.


    The Symbolics Lisp Machine, a tagged architecture, does use the pair <NIL, 0>
    (basically a non-existent <object, offset> handle) as a C null pointer.


    Depending on the “memory model” in use, 8086-family processors (PC compatibles)
    may use 16-bit data pointers and 32-bit function pointers, or vice versa.


    Some 64-bit Cray machines represent int * in the lower 48 bits of a word; char
    * additionally uses the upper 16 bits to indicate a byte address within a word.


