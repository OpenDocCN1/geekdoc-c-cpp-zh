    Answer: When scanf is attempting to convert numbers, any nonnumeric characters
    it encounters terminate the conversion and are left on the input stream. Therefore,
    unless other steps are taken, unexpected nonnumeric input "jams" scan again and
    again; scanf gets past the bad character(s) if the user types a character such
