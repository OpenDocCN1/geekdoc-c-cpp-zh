    As a point of historical interest, the choices were made based on the observation
    that assignment is more frequent than comparison and so deserves fewer keystrokes.
    In fact, using = for assignment in C and its predecessor B represented a change
    from B''s own predecessor BCPL, which did use := as its assignment operator. (See
    also question 20.38).


    # 20.23


    Question: Does C have an equivalent to Pascal''s with statement?


    Answer: No. The way in C to get quick and easy access to the fields of a structure
    is to declare a little local structure pointer variable (which, must be admitted,
    is not quite as notationally convenient as a with statement and doesn''t save
    quite many keystrokes, though it is probably safer). That is, if you have something
    unruly like


    ```

    structarray[complex_expression].a = =

    structarray[complex_expression].b +

    structarray[complex_expression].c;

    ```


    you can replace it with


    ```

    struct *p = &structarray[complex_expression];

    p->a = p->b + p->c;

    ```


