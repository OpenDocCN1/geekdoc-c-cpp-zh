  md: '# 5.16


    **Question:** Given all the confusion surrounding null pointers, wouldn''t it
    be easier simply require them to be represented internally as zeros?


    **Answer:** Some implementations naturally represent null pointers by special,
    nonzero bit patterns, particularly when it can be arranged that inadvertently
    using those values triggers automatic hardware traps. Requiring null pointers
    to be represented internally as 0—and therefore disallowing use of the special,
    nonzero values—would be an unfortunate step backward, because catching errors
    that result in invalid accesses is a Good Thing.


    Besides, what would such a requirement really accomplish? Proper understanding
    of null pointers does not require knowledge of the internal representation, whether
    zero or nonzero. Assuming that null are internally zero does not make any code
    easier to write (except for a certain ill-advised usage of calls; see question
    7.31). Known-zero internal pointers would not reduce the need for casts in function
    calls, because the *size* of the pointer might still be different from that of
    an int. (If “nil” were used to request null pointers, as mentioned in question
    5.14, the urge to assume an internal-zero representation would not even arise.)


    # 5.17


    **Question:** Seriously, have any actual machines really used nonzero null pointers
    or different representations for pointers to different types?


    **Answer:** The Prime 50 series used segment 07777, offset 0 for the null pointer,
    at least for PLI. Later models used segment 0, offset 0 for null pointers in C,
    necessitating new instructions, such as TCNP (Test C Null Pointer), evidently
    as a stop to all the except poorly written C that made incorrect assumptions.
    Older, word-addressed Prime machines were also notorious for requiring larger
    pointers (char *) than word pointers (int *).


    The Eclipse MV series from Data General has three architecturally supported pointer
    formats (word, byte, and bit pointers), two of which are used by C compilers:
    byte pointers for char * and void *, and word pointers for everything else.


    Some Honeywell-Bull mainframes use the bit pattern 06000 (for internal) null pointers.'
