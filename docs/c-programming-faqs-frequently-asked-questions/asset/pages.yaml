  md: '# 13.27


    **Question:** Why is my simple program, which hardly does more than print "Hello,
    world!" in a window, compiling to such a huge executable (several hundred K)?
    Should I include fewer header files?


    **Answer:** What you''re seeing the current (poor) state of the "art" in library
    design. Run-time libraries tend to accumulate more and more features (especially
    having to do with graphical user interfaces). When one library function calls
    another library function to do part of its job (which ought to be a Good Thing;
    that''s what library functions are for), it can happen that calling anything in
    the library (particularly something relatively powerful as `printf`) eventually
    pulls in practically everything else, leading to horribly bloated executables.


    Including fewer header files probably won''t help, because declaring a few functions
    you don''t call (which is mostly all that happens when you include a header you
    don''t need) shouldn''t result in those functions being placed in your executable,
    unless they do in fact get called. See also question 13.25.


    You may be able to track down and derail a chain of unnecessarily coupled functions
    that are bloating your executable or perhaps complain to your vendor to clean
    up the libraries.


    References: H&S §4.8.6 pp. 103–4


