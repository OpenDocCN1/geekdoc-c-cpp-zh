  md: 'Yes, free is properly used to free the memory allocated by calloc; there is
    no standard cfree function.


    One imagined distinction that is not significant between malloc and calloc is
    whether a single element or an array of elements is allocated. Although calloc''s
    two-argument calling convention suggests that it is supposed to be used to allocate
    an array of items of size n, there is no such requirement; it is perfectly permissible
    to allocate one item with calloc (by passing one argument as 1) or to allocate
    an array with malloc (by doing the multiplication yourself; see, for example,
    the code fragment in question 6.14). (Nor structure padding enter into the question;
    any padding necessary to make arrays of structures work correctly is always handled
    by the compiler and is reflected by sizeof. See question 2.13.)


    References: ANSI $4.10.3 to 4.10.3.2

    ISO $7.10.3 to 7.10.3.2

    HSX $16.1 p. 386, $16.2 p. 386

    PCS $11 pp. 141–2


    # 7.32


    **Question:** What is alloca and why is its use discouraged?


    **Answer:** The non standard alloca function allocates memory that is automatically
    free when the function that called alloca returns. That is, memory allocated with
    alloca is local to a particular function’s “stack frame,” or context.


    Implementing alloca is difficult, especially on a machine without a conventional
    stack.* It is problematic (and the obvious implementation on a stack-based machine
    fails) when its return value is passed directly to another function, as in gets(alloca
    (100), 100, stain).† Therefore, alloca is not standard and cannot be used in programs
    that must be widely portable.


    See also question 7.22.


    References: Rationale 4.10.3


    > *An "almost portable" implementation of alloca exists in the public domain,
    its author intended it as a stopgap measure and recommends against use of alloca
    in new code.


    > †If a call to alloca tries to allocate some memory on the stack in the middle
    of the preparation, on the same stack, of the argument list for another function
    call (gets, in this case), the argument list may be perturbed.'
