  md: '# GLOSSARY


    short circuit v. To prematurely terminate the evaluation of expression when the
    outcome is determined. The short-circuiting operators in C are &&, ||, and ?.
    In the case of && and ||, the second (right-hand) operand is not evaluated if
    the first determines the outcome (zero in the case of && or nonzero in the case
    of ||). In the case of ?, only of the second and third operands is evaluated,
    depending on the value of the first operand. See question 3.6.


    side effect n. Something that happens when an expression or subexpression is evaluated,
    beyond simply yielding a value. Typical side effects are: modifying a variable,
    printing something. See ANSI 2.1.2.3 or ISO 5.1.2.3.


    sign preserving adj. Another name for the unsigned source file n. Any file containing
    C source. More specifically, a file with name ending in .c, containing functions
    and global variable definitions (and perhaps declarations and definitions of other
    kinds). Compare header file, translation unit. See questions 1.7 and 10.6.


    static adj. 1 (Often as “static duration.”) Refers to an object that persists
    throughout the lifetime of a program, being allocated and initialized just once,
    at program startup. Compare automatic. See question 1.30. 2. To a source file,
    i.e., not of global scope.


    strictly conforming adj. Refers to a program that uses only the features described
    in the ANSI/ISO C Standard and does not depend on any unspecified, undefined,
    or implementation-defined behavior. See ANSI 1.7 or ISO 4.


    string n. An array of char, or any allocated region of memory, containing a sequence
    of characters terminated with ''\0''.


    string v. To convert a string into a string literal. See questions 11.17 and 11.18.


    literal n. A sequence of characters between double quotes in source code. Used
    to initialize an array of char or to request an anonymous array containing a constant
    string (which will be accessed by the pointer the anonymous array decays to).
    See question 1.32.


    syntax n. The text of a program: the series of tokens in which it is expressed.
    Compare pare semantics.


    tag n. The (Optional) name for a particular structure, union, or enumeration.
    See questions 2.1.


    token n. The smallest syntactic unit seen by a compiler or other translator: a
    keyword, identifier, binary operator (including multicharacter operators as +=
    and &&), 2. A whitespace-separated word within a string (see question 13.6).


    translation unit n. The set of source files seen by the compiler and translated
    as a unit: generally one .c file (that is, source file), plus all header files
    mentioned in #include directives.


    undefined adj. Refers to behavior that is not specified by the standard, for which
    an implementation is not required to do anything reasonable. Example: the behavior
    of the expression i =++.++. questions 3.3 and 11.33.'
