  md: '# VARIABLE-LENGTH ARGUMENT LISTS


    259


    # 15.2


    **Question:** How can %f be used for both float and double arguments in printf?
    Aren''t they different types?


    **Answer:** In the variable-length part of a variable-length argument list, the
    “default argument promotions” apply: Types char and short are promoted to int,
    and float is promoted to double. (These are the same promotions that apply to
    function calls without a prototype in scope, also known as “old style” function
    calls; see question 11.3.) Therefore, printf''s %f format always sees a double.
    (Similarly, %c always sees an int, as does %hd.) See also questions 12.9 and 12.13.


    +   References: ANSI §3.3.2.2

    ISO §6.3.2.2

    H&S §6.3.5 p. 177, §9.4 pp. 272–3


    # 15.3


    **Question:** I had a frustrating problem that turned out to be caused by the
    line


    ```

    printf("%d", n);

    ```


    where n was actually a long int. Aren''t ANSI function prototypes supposed to
    guard against argument type mismatches like this?


    **Answer:** When a function accepts a variable number of arguments, its prototype
    does not (and cannot) provide any information about the number and types of these
    variable arguments. Therefore, the usual protections do not apply in the variable-length
    part of variable-length argument lists: The compiler cannot perform implicit conversions
    (or in general) warn about mismatches. The programmer must make sure that arguments
    match or manually insert explicit casts.


    In the case of printf-like functions, some compilers (including gcc) and some
    versions of lint are able to check the actual arguments against the format string,
    as long as the format string is an immediate string literal.


    See also questions 5.2, 11.3, 12.9, and 15.2.'
