    **Question:** What does *p++ increment: p or what it points to?


    **Answer:** Unary operators, such as *, ++, and --, all associate (group) from
    right to left. Therefore, *p++ increments p (and returns the value pointed to
    by before the increment). To increment the value pointed to by p, use (*p)++ (or
    perhaps ++*p, if the order of the side effect doesn''t matter).


