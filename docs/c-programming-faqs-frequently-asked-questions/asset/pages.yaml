    # 39


    # 20.20


    **Question:** Why don''t comments nest? How am I supposed to comment out code
    containing comments? Are comments legal inside quoted strings?


    **Answer:** C comments don''t nest mostly because PL/I''s comments, which C''s
    are borrowed from, do not. Therefore, it is usually better to imagine “comment
    out” large sections of code, which might contain comments, with #ifdef or #if
    0 (but see 11.19).


    The character sequences /* and */ are not special within double-quoted strings
    and do not introduce comments, because a program (particularly generating C as
    output) might want to print them.It is difficult to imagine anyone would want
    or need to place a comment inside a quoted string. It is easy to imagine a program
    needing " /*). Note also that // comments, as in C++, are not currently legal
    in C, so it''s not a good idea to use them in C programs (even if your compiler
    supports them as extension).


    References: K&R1 §2.1 p. 179

    K&2 §2.2 p. 192

    ANSI §3.1.9 (esp. footnote 26), Appendix E

    ISO §6.1.9, Annex F

    Rationale §3.1.9

    H&S §2.2 pp. 18–19

    PCS §10 p. 130


