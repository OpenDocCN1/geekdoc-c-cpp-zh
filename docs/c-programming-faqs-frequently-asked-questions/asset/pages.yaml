  md: '# 11.34


    **Question:** I''m appalled that the ANSI standard leaves so many issues undefined.
    Isn''t a standard''s whole job to standardize these things?


    **Answer:** It has always been a characteristic of C that certain constructs behaved
    in whatever way a particular compiler or a particular piece of hardware chose
    to implement them. This deliberate imprecision allows compilers to generate more
    efficient code for common cases, without having to burden all programs with extra
    code to ensure well-defined behavior of cases deemed to be less reasonable. Therefore,
    the standard is simply codifying existing practice.


    A programming language standard can be thought of as a treaty between the language
    user and the compiler implementor. Parts of that treaty consist of features that
    the compiler implementor agrees to provide and that the user may assume be available.
    Other parts, however, consist of rules that the user agrees to follow and that
    the implementor may assume be followed. As long as both sides uphold their guarantees,
    programs have a fighting chance of working correctly. If either side reneges on
    any of its commitments, nothing is guaranteed to work.


    See also questions 11.35 and 19.42.


    References: Rationale $1.1


    # 11.35


    **Question:** People keep saying that the behavior of `i = i++` is undefined,
    but I just tried it on an ANSI-conforming compiler and got the results I expected.
    Is it really undefined?


    **Answer:** A compiler may do anything when faced with undefined behavior (and,
    within limits, with implementation-defined and unspecified behavior), including
    doing what you expect. It''s unwise to depend on it, though.


    Here is another way of looking at it, thanks to Roger Miller:


    Somebody told me that in basketball you can''t hold the ball and run. I got a
    basketball and tried it and it it worked just fine. He obviously didn''t understand
    basketball.


    See also questions 11.32, 11.33, and 11.34.'
