    Question: Each time I run my program, I get the same sequence of numbers back
    from rand. Why?


    Answer: It''s a characteristic of most pseudo-random number generators (and a
    defined property of the C library rand) that they always start with the same number
    and go through the same sequence. (Among other things, a bit of predictability
    can make debugging much easier.) When you don''t want this predictability, you
    can call rand to seed the pseudo-random number generator with a truly random initial
    value. Popular seed values are the time of day or the elapsed time before the
    user presses a key (although keypress times are difficult to determine portably;
    see question 19.37). Here''s an example, using the time of day as a seed:


    ```

    #include <stdlib.h>

    #include <time.h>


    srand((unsigned int)time((time_t *)NULL));

    ```


    (Note that it''s rarely useful to call rand more than once during a run of a program;
    in particular, don''t try calling rand before each call to rand, in an attempt
    to get "really random" numbers.)


