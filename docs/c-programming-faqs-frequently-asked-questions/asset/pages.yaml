    \n**Answer:** In fact, some standardization has occurred along the way. In the\
    \ beginning, C did not have a standard library at all; programmers always had\
    \ to \"roll their own\" utility functions. After several abortive attempts, a\
    \ set of library functions (including the `str*` and stdio families of functions)\
    \ became a *de facto* standard, at least on UNIX systems, but the library was\
    \ not yet a formal part of the language. Vendors could (and occasionally did)\
    \ provide completely different functions along with their compilers.\n\nIn the\
    \ ANSI/ISO C Standard, a library definition (based on the 1984 /usr/group standard\
