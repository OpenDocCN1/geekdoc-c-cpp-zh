    # lint


    C was developed along the UNIX operating system and shares its philosophy of “each
    tool should do exactly one job and do it well.” Traditionally, a C compiler''s
    job was to generate machine code from source code, not to warn the programmer
    about every possibly incorrect or inadvisable technique. That task was reserved
    for a separate program, named lint (after the bits of fluff it supposedly picks
    from programs). Although lint has waned in significance over the years, newer
    compilers have not always picked up on the same diagnostic tasks in its stead,
    there may still be a place for it in the wise programmer''s arsenal.


    # 18.4


    Question: I just typed in this program, and it’s acting strangely. What can be
    wrong with it?


    Answer: See if you can run lint first (perhaps with the -a, -c, -h, -p or other
    options*). Many compilers are really only half-compilers, taking the attitude
    that it''s not their problem if you didn''t say what you meant or what you said
    is virtually guaranteed not to work. (But also see whether your compiler has extra
    warning levels that can be optionally requested.)


    See also questions 16.5 and 16.8.


    Reference: Darwin, Checking Programs with lint


    > *Beware that under some versions of lint, these options request additional checking
    and that some others, they disable it.'
