    **Question:** Why isn''t C''s set of operators complete? A few operators, such
    as ^, &&=, and -==, seem to be missing.


    **Answer:** A logical exclusive-or operator (hypothetically "^^") might be nice,
    but it couldn''t possibly have short-circuiting behavior analogous to && and ||
    (see section 3.6). Similarly, it''s not clear how short-circuiting would apply
    to hypothetical assignment operators &&= and ||=. (It''s not clear how often &&=
    and ||= would be needed.)'
