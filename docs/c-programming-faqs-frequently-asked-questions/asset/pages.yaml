    # 6.20


    Question: How can I use statically and dynamically allocated multidimensional
    arrays interchangeably when passing them to functions?


    Answer: There is no single perfect method. Given the declarations


    ```

    int array[NROWS] [NCOLUMNS];

    int **array1;           /* ragged */

    int *array2;            /* contiguous */

    int *array3;            /* "flattened" */

    int (*array4) [NCOLUMNS];

    int (*array5) [NCOLUMNS];

    ```


    with the pointers initialized as in the code fragments in question 6.16 and functions
    declared as


    ```

    f1(int a[NCOLUMNS], int nrows, int ncolumns);

    f2(int *ayp, int nrows, int ncolumns);

    f3(int **pp, int nrows, int ncolumns);

    ```


    where f1 accepts a conventional two-dimensional array, f2 accepts a "flattened"
    two-dimensional array, and f3 accepts a pointer-to-pointer, simulated array (see
    also questions 6.18 and 6.19), the following calls should work as expected:


    ```

    f1(array, NROWS, NCOLUMNS);

    f1(array4, nrows, NCOLUMNS);

    f1(*array5, NROWS, NCOLUMNS);

    f2(&array[0] [0], NROWS, NCOLUMNS);

    f2(*array2, nrows, NCOLUMNS);

    f2(array3, nrows, ncolumns);

    f2(*array4, nrows, NCOLUMNS);

    f2(**array5, NROWS, NCOLUMNS);

    f3(array1, nrows, ncolumns);

    f3(array2, nrows, ncolumns);

    ```


    The following two calls would probably work on most systems but involve questionable
    casts and work only if the dynamic ncolumns matches the static NCOLUMNS:


    ```

    f1((int (*) [NCOLUMNS])(array2), nrows, ncolumns);

    f1((int (*) [NCOLUMNS])array3, nrows, ncolumns);

    ```'
