    # Unions


    # 2.19


    Question: What''s the difference between a structure and a union?


    Answer: A union is essentially a structure in which of all the fields overlay

    each other; you can use only one field at a time. (You can also cheat, by writ-

    ing to one field and reading from another, to inspect a type''s bit patterns or

    interpret them differently, but that''s obviously machine dependent).

    The size of a union is the maximum of the sizes of its individual members,

    whereas the size of a structure is the sum of the sizes of its members. (In both

    cases, the size may be increased by padding; see questions 2.12 and 2.13.)


    References: ANSI $3.5.2.1

    ISO $6.5.2.1

    H&S $5.7 pp. 140–5 esp. $5.7.4


    # 2.20


    Question: Is there a way to initialize unions?


    Answer: The ANSI/SIO C Standard allows an initializer for the first mem-

    er of a union. There is no standard way of initializing any other member.

    (Under a pre-ANSI compiler, there is generally no way of initializing a union

    at all.)


    Many proposals have been advanced to allow more flexible union initial-

    ization, but none has been adopted yet. (The GNU compiler provides ini-

    tialization of union member as an extension, and this feature is likely to

    make it into a future revision of the C standard.) If you''re really desperate,

    y can sometimes define several variant copies of one, with the members

    different orders, so that you can declare and initialize the one having

    the appropriate first member. (These variants are guaranteed to be implemented

    compatibly, so it''s okay to “pun” them by initializing one and then using the

    other.)


    References: K&R2 $6.8 pp. 148–9

    ANSI $3.5.7

