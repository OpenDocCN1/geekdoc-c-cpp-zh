  md: '# DECLARATIONS AND INITIALIZATIONS


    Question: How can I determine which identifiers are safe for me to use and which
    are reserved?


    Answer: Namespace management can be a sticky issue. The problem—which isn''t always
    obvious—is that you don''t want to pick identifiers already in use by the implementation
    and therefore get “multiply defined” errors or—even worse—quietly replace one
    of the implementation''s symbols and break everything. You also want some guarantee
    that later releases won''t usurp names you''re legitimately using.* (Few things
    are more frustrating than taking a debugged, working, production program; recompiling
    it under a new release of a compiler fail due to namespace or other problems.)
    Therefore, the ANSI/ISO C Standard contains rather elaborate carving out distinct
    namespaces for the user and the implementation.


    To make sense of ANSI''s rules, and before we can say whether a given identifier
    is reserved, we must understand three attributes of the identifier: its scope,
    namespace, and linkage.


    +   C has four kinds of scope (regions over which an identifier''s declaration
    is in effect): function, file, block, and prototype. (The fourth one exists only
    in the parameter lists of function declarations; see also question 11.5.)


    +   C has four kinds of namespaces: labels (i.e., goto targets); tags (names of
    structures, unions, and enumerations; these aren''t separate even though they
    theoretically could be); structure/union members (one namespace structure or union);
