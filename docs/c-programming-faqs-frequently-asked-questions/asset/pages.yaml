  md: '# INTRODUCTION


    Hiding in Chapter 16 are some questions you may want to jump to first if you''re
    already comfortable with most of the preceding material: They concern the occasional
    strange problems and mysterious bugs that crop up in a program and can be agonizingly
    frustrating to track down.


    When there are two or more equally "correct" ways of writing a program (and there
    usually are), one may be preferable based on subjective criteria having to do
    with more than whether the code simply compiles and runs correctly. Chapter 17
    discusses fie of these ephemeral issues of programming style.


    You can''t build C programs in isolation: You need a compiler, source code, or
    tools. Chapter 18 discusses some available tools and resources, including lint,
    a nearly forgotten but once indispensable tool for checking aspects of program
    correctness and portability.


    As mentioned, the C language does not specify everything you necessarily need
    to get a real program working. Questions such as "How do I read one character
    without waiting for the Return key?" and "How do I find the size of a file?" are
    extremely common, but C does not define the answers; these operations depend on
    the facilities provided by the underlying operating system. Chapter 19 presents
    a number of these questions, along with brief answers for popular operating systems.


    Finally, Chapter 20 collects the miscellaneous questions that don''t fit anywhere
    else: bit manipulation, efficiency, algorithms, C''s relationship to other languages,
    and a few trivia questions. (The Introduction to Chapter 20 contains a slightly
    more detailed breakdown of its disparate contents.)


