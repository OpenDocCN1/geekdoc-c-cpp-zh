  trans: "\n\n`static` 声明意味着该函数属于一个类。`className :: function( );` 意味着类可以直接引用此静态函数。\n\
    \n## 示例 8.3\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass Account\
    \ {\npublic:\n    static int myfunction( int n ); // 声明静态方法\n};\nint Account ::\
    \ myfunction(int n){ // 类的方法\n    return n;\n}\nint main() {\n    cout << Account\
    \ :: myfunction( 200 ) << endl; // 类直接引用方法\n    return 0;\n}\n```\n\n**输出：**\n\
    ```\n200\n```\n\n**解释：**\n`static int myfunction(int n)` 意味着静态函数 `myfunction(int\
    \ n)` 可以被类或对象引用。\n`Account :: myfunction ( 200)` 意味着类 `Account` 引用静态函数 `myfunction(\
    \ 200 )`。\n非静态函数只能通过对象引用，不能通过类引用。\n\n## X++ 或 ++X\n\n| 表达式 | 描述 |\n| :--- | :---\
    \ |\n| `++ X` | X 先加 1，然后执行表达式 |\n| `X ++` | 先执行表达式，然后 X 加 1 |\n| `- - Y` | Y\
    \ 先减 1，然后执行表达式 |\n| `Y - -` | 先执行表达式，然后 Y 减 1。 |\n\n### 示例 8.4\n\n```cpp\nint\
    \ X = 10, num;\nnum = ++X - 3;/* X 加 1 为 11，11 减 3 为 8，然后将结果“8”赋值给 num。num 的值为\
    \ 8。X 的值为 11 */\ncout << num <<\" , \"<< X << endl; // 输出:  8 , 11\n```\n\n###\
    \ 示例 8.5\n\n```cpp\nint X = 10, num;\nnum = X++ - 3;/* X 减 3 为 7，将结果“7”赋值给 num。num\
    \ 的值为 7。然后 X 加 1 为 11，X 的值为 11 */\ncout << num <<\" , \"<< X << endl; // 输出: \
    \ 7 , 11\n```\n\n## 递归函数\n\n函数内部的函数调用自身，这被称为递归函数。递归函数的语法为：\n\n```cpp\ntype function_name(){\n\
    \    function_name(); // 函数调用者调用自己\n}\n```\n\n### 示例 8.6\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nvoid myself(int n);\nint main() {\n    myself ( 1 ); //\
    \ 声明函数\n    return 0;\n}\nvoid myself ( int n){ // 定义函数 \"myself(){ }\"\n    cout\
    \ <<  \"Number \" << n << endl;\n    ++n;\n    if ( n == 4) return; // return\
    \ 意味着停止运行\n    else myself ( n ); // 函数调用者调用 myself()\n}\n```\n\n**输出：**\n```\n\
    Number 1\nNumber 2\nNumber 3\n```\n\n**解释：**\n`void myself ( int n){ }` 体内包含一个函数调用者\
    \ `myself(n);`。\n`void myself ( int n)` 被 `myself(int n){ }` 内部的 `myself(n)` 调用，这被称为递归函数。\n\
    递归函数持续运行直到“n 等于 4”。\n`if ( n == 4) return;` 当 `n` 等于 4 时停止程序运行，然后退出递归函数。\n\n##\
    \ 局部与全局变量\n\n局部变量只在当前函数中可见。全局变量在任何函数中可见。\n局部变量定义在函数内部。全局变量定义在函数外部。\n\n### 示例 8.7\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nvoid test1();\nvoid test2();\n\
    int main() {\n    test1();\n    test2();\n    return 0;\n}\nint a = 100, b = 200;\
    \ // 定义全局变量\nvoid test1 ( { // 定义函数\n    int x = 30, y = 40; // 定义局部变量\n    cout\
    \ << a << \",\" << b << endl;\n}\nvoid test2 ( ) { // 定义函数\n    int x = 50, y\
    \ = 60; // 定义局部变量\n    cout << a << \",\" << b << endl;\n}\n```\n\n**输出：**\n```\n\
    100,200\n100,200\n```\n\n**解释：**\n`a` 和 `b` 是全局变量，在任何函数中均可见。\n`x` 和 `y` 是局部变量，只在当前函数中可见。\n\
    \n## 异常\n\nC++ 程序可能存在某些错误，从而触发异常（Exceptions）。主要的异常如下：\n\n| 异常 | 情况 |\n| :--- |\
    \ :--- |\n| `domain_error` | 不符合先决条件 |\n| `invalid_argument` | 函数中的无效参数 |\n| `length_error`\
    \ | 尺寸过长或过短 |\n| `out_of_range` | 无效范围 |\n| `overflow_error` | 数据溢出 |\n\n### 示例\
    \ 8.8\n\n```cpp\nint main( ) {\n    int x, y = 0;\n    x = 100 / y; // 发生异常！\n\
    \    cout << x << endl;\n    return 0;\n}\n```\n\n**输出：**\n```\nArithmeticException:\
    \ by zero\n```\n\n**解释：**\n`100 / y` 导致异常，因为 `y` 为零。\n\n## Try-Catch\n\n`try-catch`\
    \ 处理异常的语法如下：\n\n```cpp\ntry {\n    // 此处可能发生异常\n}\ncatch(exception) {\n    //\
    \ 捕获异常\n}\n```\n\n当发生异常时，`try { }` 块抛出异常，`catch( )` 块捕获它。要使用 `try-catch` 需要 `#include<stdexcept>`。\n\
    \n### 示例 8.9\n\n```cpp\n#include <iostream>\n#include <stdexcept>\nusing namespace\
    \ std;\nint main() {\n    string str1 = \"JavaScript\";\n    string str2 = \"\
    and\";\n    try { // 此处可能发生异常\n        str1.insert(100, str2); // 导致错误\n    }\n\
    \    catch(out_of_range) { // 捕获异常\n        cout << \"Catch an exception.\" <<\
    \ endl;\n        cout << \"Out of range!\" << endl;\n    }\n    return 0;\n}\n\
    ```\n\n**输出：**\n```\nCatch an exception.\nOut of range!\n```\n\n**解释：**\n在 `try\
    \ { }` 块中，`str1.insert(100, str2);` 导致异常。`catch(out_of_range){ }` 捕获并处理异常。\n\n\
    ## 返回异常消息\n\n显示异常消息的语法如下：\n\n```cpp\ntry {\n    // 抛出异常\n}\ncatch(exception& e)\
    \ {\n    // ...\n}\n```\n\n`e.what()` 可以产生异常消息。`e` 是异常对象。\n\n### 示例 8.10\n\n```cpp\n\
    #include <stdexcept>\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    string str = \"JavaScript\";\n    try {\n        str.at(100);\n    }\n  \
    \  catch(exception &e) { // e 是异常对象\n        cout << \"Catch an exception: \"\
    \ << e.what() << endl; // “e.what() 创建异常消息\n    }\n    return 0;\n}\n```\n\n**输出：**\n\
    ```\nCatch an exception: basic::out_of_range\n```\n\n**解释：**\n`catch(exception\
    \ &e)` 可以捕获异常。`e` 是异常对象。`e.what()` 产生异常消息。\n\n## 抛出异常\n\n我们可以在可能发生的地方设置代码抛出异常：\n\
    \n```cpp\ntry {\n    // throw... 抛出异常\n}\ncatch {\n    //\n}\n```\n\n`throw` 根据我们的设置抛出异常。\n\
    \n### 示例 8.11\n\n```cpp\n#include <stdexcept>\n#include <iostream>\nusing namespace\
    \ std;\nint main () {\n    try {\n        int x = 100, y = 0;\n        if( y ==\
    \ 0 ) {\n            throw y; // 在这里抛出异常\n        }\n        x = x / y;\n    }\n\
    \    catch (int e) { // 捕获并处理异常\n        cout << \"An exception occurred.\" <<\
    \ endl;\n        cout << \"The number is divided by \" << e << endl;\n    }\n\
    \    return 0;\n}\n```\n\n**输出：**\n```\nAn exception occurred.\nThe number is\
    \ divided by 0\n```\n\n**解释：**\n`throw y;` 为 `y` 抛出异常。如果 `y` 等于零，`x/y` 将出错。`catch\
    \ (int e){ }` 可以捕获并处理异常。\n\n## Vector\n\nVector 类似于可以改变大小的数组。和数组一样，vector 可以任意数据类型，且索引从零开始。\n\
    如果使用 `vector`，必须在程序开头包含 `#include <vector>`。\n创建 vector 的语法如下：\n\n```cpp\nVector\
    \ <data-type> vector-name (size);\n```\n\n### 示例 8.12\n\n```cpp\nvector <int>\
    \ myVector(10); // 1\nvector <double> prices (60); // 2\nvector <string> titles\
    \ (18); // 3\n```\n\n**解释：**\n1：声明了一个包含 10 个元素的 `int` vector `myVector`。\n2：声明了一个包含\
    \ 60 个元素的 `double` vector `prices`。\n3：声明了一个包含 18 个元素的 `string` vector `titles`。\n\
    \n## Vector.method( ) (1)\n\nvector 的方法如下：\n\n| 方法 | 描述 |\n| :--- | :--- |\n|\
    \ `push_back(value)` | 向 vector 末尾添加元素 |\n| `size()` | 返回 vector 的大小 |\n| `at(index)`\
    \ | 返回指定索引处的值 |\n| `pop_back()` | 删除最后一个元素 |\n\n### 示例 8.13\n\n```cpp\n#include\
    \ <vector>\n#include <iostream>\nusing namespace std;\nint main() {\n    vector\
    \ < int > myVector(1); // 创建一个包含 1 个元素的 vector\n    myVector.push_back(20); //\
    \ 在末尾添加元素 20\n    myVector.push_back(30); // 在末尾添加元素 30\n    cout << \"myVector\
    \ size: \" << myVector.size( ) << endl; // 获取元素数量\n    cout << \"The third element:\
    \ \" << myVector.at(2) << endl; // 获取索引 2 的值\n    myVector.pop_back(); // 删除最后一个元素\n\
    \    cout << \"Final element has been removed.\" << endl;\n    return 0;\n}\n\
    ```\n\n"
