- fmt: "\n# Example 7.5\n\n```cpp\n#include <iostream>\n#include <string.h>\nusing\
    \ namespace std;\nint main(){\n    string mystring;\n    cout << \"Please enter\
    \ a sentence:\" << endl;\n    getline ( cin, mystring );   // input a string\n\
    \    cout << mystring << endl;\n    return 0;\n} // assume that we input a string\
    \ \"C++ is very good\"\n```\n\n**Output:**\n```\nPlease enter a sentence:\nC++\
    \ is very good\n```\n\n**Explanation:**\n`getline ( cin, mystring);` accepts the\
    \ user input from a string.\n\n## Write a File\n\nThe syntax to write a file is:\n\
    \n```cpp\nofstream fileObject (\"myFile.txt\"); // create an output object\nfileObject\
    \ << mystring << endl; // write mystring to file\n```\n\n`ofstream fileObject\
    \ (\"myFile.txt\");` creates an output-file object `fileObject`.\n\n`ofstream`\
    \ class is used to write data to a file.\n\n`fileObject` is an output-file object.\n\
    \n`fileObject << mystring << endl;` writes `mystring` to file.\n\nFor processing\
    \ a file, we need to use `#include <fstream>` first.\n\n## Example 7.6\n\n```cpp\n\
    // Please create an empty file “myFile.txt” first.\n// Assume that the path of\
    \ the \"myFile.txt\" is \"D:\\\\myFile.txt\".\n#include <iostream>\n#include <fstream>\n\
    #include <string>\nusing namespace std;\nint main(){\n    ofstream fileObject\
    \ ( \"D:\\\\myFile.txt\" ); // create an object\n    string mystring = \"C++ is\
    \ a very good language.\";\n    fileObject << mystring << endl; // write mystring\
    \ to file\n    fileObject.close ( );\n    cout << \"Write to file successfully!\"\
    \ << endl;\n    return 0;\n}\n```\n\n**Output:**\n```\nWrite to file successfully!\n\
    ```\n\n**Explanation:**\nPlease open `myFile.txt`, we will find some contents\
    \ as follow:\n\"C++ is a very good language.\"\n\n`ofstream` class is used to\
    \ write data to a file.\n\n`ofstream fileObject ( “D:\\\\myFile.txt” );` creates\
    \ an output-file object `fileObject`.\n\n`fileObject << mystring << endl;` writes\
    \ `mystring` to the file `myFile.txt`.\n\n## Open a File\n\nWhen opening a file,\
    \ we can specify the “File Mode”.\n\n| Mode | Usage |\n| :--- | :--- |\n| `ios\
    \ :: in` | open a file to read the input |\n| `ios :: out` | open a file to write\
    \ the output |\n| `ios :: app` | open a file to append the output |\n| `ios ::\
    \ trunc` | open a file or truncate the existing file |\n| `ios :: ate` | open\
    \ a file without truncating the existing file |\n| `ios :: binary` | open a file\
    \ as a binary file |\n\n## Example 7.7\n\n```cpp\nofstream fileObject ( “myfile.txt”,\
    \ ios :: app ); // line1\nofstream fileObject ( “myfile.txt”, ios :: trunk );\
    \ // line2\nofstream fileObject ( “myfile.txt”, ios :: binary ); // line3\n```\n\
    \n**Explanation:**\nLine1: Open `myfile.txt`, append the output at the end of\
    \ existing content.\nLine2: Open `myfile.txt`, truncate the existing file.\nLine3:\
    \ Open `myfile.txt`, take the file as a binary format.\n\n## Read a File\n\nThe\
    \ syntax to read a file is:\n\n```cpp\nifstream fileObject ( “myFile.txt” ); //\
    \ create an input object\ngetline ( fileObject, mystring); // read mystring from\
    \ file\n```\n\n`ifstream fileObject ( “myFile.txt” );` creates an input-file object\
    \ `fileObject`.\n\n`ifstream` class is used to read data from a file.\n\n`fileObject`\
    \ is an input-file object.\n\n`getline ( fileObject, mystring);` reads `mystring`\
    \ from file.\n\nFor processing a file, we need to import `#include <fstream>`\
    \ first.\n\n## Example 7.8\n\n```cpp\n// Assume that the path of the \"myFile.txt\"\
    \ is \"D:\\\\myFile.txt\".\n// “myFile.txt” has content: “C++ is a very good language.”\n\
    #include <iostream>\n#include <fstream>\n#include <string>\nusing namespace std;\n\
    int main(){\n    string mystring;\n    ifstream fileObject ( \"D:\\\\myFile.txt\"\
    \ ); // create an object\n    getline ( fileObject, mystring ); // reads file\
    \ to mystring\n    cout << mystring <<endl; // show the content of mystring\n\
    \    fileObject.close ( );\n    return 0;\n}\n```\n\n**Output:**\n```\nC++ is\
    \ a very good language.\n```\n\n**Explanation:**\n`ifstream` class is used to\
    \ read data from a file.\n\n`ifstream fileObject ( “D:\\\\myFile.txt” );` creates\
    \ an input-file object `fileObject`.\n\n`getline ( fileObject, mystring);` reads\
    \ the file to `mystring`.\n\n`cout << mystring` shows the content of `mystring`.\n\
    \n## End of File\n\nThe syntax to check the end of a file is:\n\n```cpp\nfileObject.eof\
    \ ( );\n```\n\nIf the file reading goes to end of the file, `eof( )` will return\
    \ `true`, otherwise, `eof( )` returns `false`.\n\n## Example 7.9\n\n```cpp\n//\
    \ Assume that the path of the \"myFile.txt\" is \"D:\\\\myFile.txt\".\n// “myFile.txt”\
    \ has content: “C++ is a very good language.”\n#include <iostream>\n#include <fstream>\n\
    #include <string>\nusing namespace std;\nint main(){\n    char ch;\n    ifstream\
    \ fileObject ( \"D:\\\\myFile.txt\" );\n    while(!fileObject.eof()) {\n     \
