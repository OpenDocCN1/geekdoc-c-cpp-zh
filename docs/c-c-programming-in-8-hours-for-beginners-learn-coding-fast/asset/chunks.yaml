  trans: "\n\n`obj.display();` 对象 `obj` 调用 `display(){ }`。\n\n注意 `obj` 在类 `Computer`\
    \ 之外，因此 `obj` 无法访问私有成员 `display( ){ }`。\n\n## 私有示例\n\n示例：\n\n```cpp\n#include\
    \ <string>\n#include <iostream>\nusing namespace std;\nclass Flower {\nprivate:\
    \ // 定义私有权限\n    string color = \"The flower is red\";  // \"color\" 是私有成员\npublic:\n\
    \    void show(){ // \"show()\" 是公共成员\n        cout<< color; // 在类内部访问私有成员\n \
    \   }\n};\nint main( ){\n    Flower obj; // 创建一个对象\n    obj.show(); // 引用公共方法，可以！\n\
    \    return 0;\n}\n```\n\n输出：The flower is red\n\n解释：私有变量只能由同一类中的代码访问。\n\n## 保护权限\n\
    \n`protected` 是 `成员访问修饰符` 之一。\n\n| 受保护类成员可以被当前类或派生类中的对象访问，但不能在另一个类中访问。 |\n\n###\
    \ 示例 5.10\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass A { // 基类\n\
    protected: // 定义保护权限\n    int prot; // 声明一个受保护成员\n};\nclass B:A { // 派生类继承基类\n\
    public:\n    void myfunction(){\n        prot = 100; // 访问受保护成员，可以！\n        cout\
    \ << prot;\n    }\n};\nint main(){\n    B obj;\n    obj.myfunction();\n    return\
    \ 0;\n}\n```\n\n输出：100\n\n解释：\n\n`protected: int prot;` 声明了一个受保护成员。\n\n`prot =\
    \ 100;` 访问基类的受保护成员，因为基类的受保护成员可以被派生类访问。\n\n## 类方法\n\n有时，方法需要在类外部定义。\n\n```cpp\n\
    ClassName:: method( ) { }\n```\n\n`::` 用于指定属于某个类的方法。\n\n### 示例 5.11\n\n```cpp\n\
    #include<string>\n#include <iostream>\nusing namespace std;\nclass Time { // 定义一个类\n\
    public:\n    void setHour( int);\n    int hour;\n};\nvoid Time::setHour(int h){\
    \ // 类方法\n    int hour = h;\n    cout << \"The hour is : \" << hour << endl;\n\
    }\nint main( ){\n    Time obj; // 创建一个对象\n    obj.setHour(10); // 调用 setHour()\
    \ 并传递参数 10\n    return 0;\n}\n```\n\n输出：The hour is: 10\n\n解释：\n\n`void Time::setHour(int\
    \ h){ }` 使用 `::` 符号在 `Time` 类外部定义了一个方法，这意味着 `Time` 类有一个方法 `setHour(int h){ }`。\n\
    \n`int hour = h;` 变量 `h` 访问公共成员 `hour`。\n\n## 访问私有成员\n\n私有成员无法从当前类外部访问。\n\n| 私有成员仅在同一个类中访问。\
    \ |\n\n### 示例 5.12\n\n```cpp\n#include<string>\n#include <iostream>\nusing namespace\
    \ std;\nclass Time { // 定义一个类\npublic:\n    void setHour(int);\nprivate: // 声明私有权限\n\
    \    int hour; // hour 是私有成员\n};\nvoid Time::setHour(int h){ // setHour() 属于 Time\
    \ 类\n    int hour = h; // \"h\" 可以访问私有成员 \"hour\", 可以！\n    cout<< hour;\n}\n\
    int main( ){\n    Time obj; // 创建一个对象\n    obj.setHour(10);\n    return 0;\n}\n\
    ```\n\n输出：10\n\n解释：\n\n`void Time::setHour(int h){ }` 在类外部定义了一个方法。这意味着 `setHour(){\
    \ }` 属于 `Time` 类。\n\n`int hour = h;` 变量 `h` 访问私有成员 `hour`，因为 `setHour()` 属于 `Time`\
    \ 类，这是有效的！\n\n## 练习题：我的房子\n\n### 类与对象\n\n在你最喜欢的编辑器中编写 C++ 代码。\n\n```cpp\n#include<string>\n\
    #include <iostream>\nusing namespace std;\nclass House{ // 声明一个类 \"House\"\npublic:\
    \ // 设置访问权限\n    int height;\n    int width;\n    string color;\n    string size;\n\
    };\nint main( ) {\n    House myHouse; // 创建一个对象 \"myHourse\"\n    myHouse.height\
    \ = 100; // 对象引用变量 height\n    myHouse.width = 200; // 对象引用变量 width\n    myHouse.color\
    \ = \"white\"; // 对象引用变量 color\n    myHouse.size = \"big\"; // 对象引用变量 size\n \
    \   cout << \"Height: \"<< myHouse.height <<endl;\n    cout << \"Width: \"<< myHouse.width\
    \ <<endl;\n    cout << \"Color: \"<< myHouse.color <<endl;\n    cout << \"Size:\
    \ \"<< myHouse.size <<endl;\n    return 0;\n}\n```\n\n输出：\nHeight: 100\nWidth:\
    \ 200\nColor: white\nSize: big\n\n解释：\n\n`class House` 创建了一个名为 `House` 的类。\n\n\
    `House myHouse` 创建了一个名为 `myHourse` 的对象。\n\n`myHouse.height = 100;` 设置 `height`\
    \ 的值为 100。\n\n`myHouse.width = 200;` 设置 `width` 的值为 200。\n\n`myHouse.color = \"\
    white\";` 设置 `color` 的值为 \"white\"。\n\n`myHouse.size = \"big\";` 设置 `size` 的值为\
    \ \"big\"。\n\n`cout << \"Height: \"<< myHouse.height <<endl;` 输出高度。\n\n`cout <<\
    \ \"Width: \"<< myHouse.width <<endl;` 输出宽度。\n\n`cout << \"Color: \"<< myHouse.color\
    \ <<endl;` 输出颜色。\n\n`cout << \"Size: \"<< myHouse.size <<endl;` 输出尺寸。\n\n"
- fmt: "\nThe second value is: 20\n\nThe third value is: 30\n\nExplanation:\n\n`int\
    \ *pt = myarray;` means that the pointer points to the first element of `myarray`\
    \ when initializing, which means that `*pt` has the value of the `myarray[0]`\
    \ at first.\n\n`pt++` moves the pointer to next element.\n\n### Use Pointer Array\n\
    \nThe syntax to define a pointer array is:\n\n`int a, b, c;int *pointer[n] = {\
    \ &a, &b, &c };`\n\n`int *pointer[n] = { &a, &b, &c };` defines a pointer array.\n\
    \n`\"n\"` is the length of the array.\n\n`&a, &b, &c\"` are the elements of the\
    \ array.\n\n#### Example 6.6\n\n```cpp\n#include <string>\n#include <iostream>\n\
    using namespace std;\nint main( ) {\n    int a, b, c;\n    a = 10, b = 11, c =\
    \ 12;\n    int *myarray[3] = { &a, &b, &c }; //  define a pointer array\n    cout\
    \ << *myarray[0] + *myarray[1] << endl; // a + b\n    cout << *myarray[2] - *myarray[1]\
    \ << endl; // c - b\n    return 0;\n}\n```\n\nOutput:\n21\n1\n\nExplanation:\n\
    \n`int *myarray[3] = { &a, &b, &c };` defines a pointer array.\n\n`\"3\"` means\
    \ that there are three elements in `myarray`.\n\n`&a, &b, &c\"` are the elements\
    \ of the array.\n\n`*myarray[0]` has the value of `“a\"` variable.\n\n`*myarray[1]`\
    \ has the value of `“b\"` variable.\n\n`*myarray[2]` has the value of `“c\"` variable.\n\
    \n### Pointer & String\n\nThe syntax to define a pointer of a string is:\n\n`char\
    \ *pt = string`\n\n`char *pointer = “string”;` defines a pointer that points to\
    \ the first character of the string.\n\n#### Example 6.7\n\n```cpp\n#include <string>\n\
    #include <iostream>\nusing namespace std;\nint main( ) {\n    char str[ ] = \"\
    mystring\"; // define a string\n    char *pt = str; // point to the first character\
    \ of the str\n    int counter = 0; // define a counter\n    while ( *pt != 0 )\
    \ { // condition\n        counter++; // count how many characters\n        pt++;\
    \ // pointer moves to the next character\n    }\n    cout << counter; // output\
    \ the number of characters.\n    return 0;\n}\n```\n\nOutput:\n8\n\nExplanation:\n\
    \n`char *pt = str;` makes the pointer point to the first character of the `“str”`,\
    \ `str` is a string.\n\n`while( *pt != 0 )` is a condition, while the `*pt` is\
    \ not a zero, keeps running the loop to count the characters.\n\n`pt++` moves\
    \ the pointer points to the next character in `“mystring”`.\n\nThe result `“8\"\
    ` means that there are 8 characters in `“mystring”`.\n\n### Reference a Variable\n\
    \nThe reference is an alias for a variable or an object. A reference name is preceded\
    \ by a symbol `&&`.\n\n`type &reference = variable;`\n\n`reference` is an alias\
    \ of the variable.\n\n#### Example 6.8\n\n```cpp\n#include <string>\n#include\
    \ <iostream>\nusing namespace std;\nint main( ) {\n    int num;\n    int &r =\
    \ num; // “r” is an alias of “num”\n    r = 100;\n    cout << num << endl; //\
    \ num equals r\n    num = 200;\n    cout << r << endl; // r equals num\n    return\
    \ 0;\n}\n```\n\nOutput:\n100\n200\n\nExplanation:\n\n`int &r = num` defines the\
    \ alias of `num` as `r`.\n\n`r = 100;` indicates `num = 100`.\n\n`num = 200;`\
    \ indicates `r = 200`.\n\n### Reference an Object\n\nThe syntax to reference an\
    \ object is:\n\n`ClassName &reference = object`\n\n`reference` is an alias of\
    \ the object.\n\n#### Example 6.9\n\n```cpp\n#include <string>\n#include <iostream>\n\
    using namespace std;\nclass Color{ // declare a class\npublic:\n    void display();\n\
    };\nvoid Color :: display( ){ // define a method\n    cout <<\"The color is blue.\"\
    \ << endl;\n}\nint main( ) {\n    Color Tint; // create an object \"Tint\"\n \
    \   Color &r = Tint; //\"r\" is an alias of \"Tint\"\n    r.display( ); // namely\
    \ Tint.dispaly();\n    return 0;\n}\n```\n\nOutput:\nThe color is blue.\n\nExplanation:\n\
    \n`Color &r = Tint;` references an object `Tint`.\n\nThe `r` is the alias of the\
    \ `Tint`.\n\n`r.display( );` means `Tint.display( ){ }`.\n\n### Referenced Arguments\n\
    \nThe syntax to reference the arguments of a function is:\n\n`type functionName\
    \ ( &a, &b ) { }`\n\n`(&a, &b)` not only can receive the parameter from the function\
    \ caller, and but also pass the parameter to the function caller.\n\n#### Example\
    \ 6.10\n\n```cpp\n#include <string>\n#include <iostream>\nusing namespace std;\n\
    void swap ( int &a, int &b) { // reference arguments\n    int temp;\n    temp\
    \ = a, a = b, b = temp; //  reference exchange\n}\nint main( ) {\n    int x =\
    \ 10, y = 20;\n    cout << x << \" \" << y << endl;\n    swap ( x, y ); // call\
    \ the function, and pass the parameters\n    cout << x << \" \" << y << endl;\n\
    \    return 0;\n}\n```\n\nOutput:\n10 20\n20 10\n\nExplanation:\n\n`void swap\
    \ ( int &a, int &b)` uses the reference.\n\n`(&a, &b)` can receive the parameters\
    \ `(x, y)` from function caller, and can also pass the parameters `(y, x)` to\
    \ function caller.\n\nBefore swap, `a` is an alias of `x`, `b` is an alias of\
    \ `y`.\n\nAfter swap, `a` is an alias of `y`, `b` is an alias of `x`.\n\n### Exercise:\
    \ Value & Address PointerPointer Sample\n\nWrite C++ codes to your favorite editor.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main( ){\n    int x =\
    \ 100, y = 200;\n    int *xPointer = &x; // *xPointer has the value of x\n   \
    \ int *yPointer; // declare a pointer\n    yPointer = &y; // yPointer has the\
    \ value of y\n    cout << \"X value: \" << *xPointer << endl; // show value\n\
    \    cout << \"Y address: \" << yPointer << endl; // show address\n    return\
    \ 0;\n}\n```\n\nSave, and run the program.\n\nOutput:\nX value: 100\nY address:\
    \ [address]\n\nExplanation:\n\n`int *xPointer = &x;` declares and initializes\
    \ the pointer.\n\n`int *xPointer = &x;` means that `*xPointer` has the value of\
    \ `x`.\n\n`int *yPointer;` declares a pointer.\n\n`yPointer = &y;` means that\
    \ `*yPointer` has the value of `y`.\n\n`xPointer=&x` means that `xPointer` has\
    \ the address of `x`.\n\n`yPointer=&y` means that `yPointer` has the address of\
    \ `y`.\n\n`cout<<\"X value: \" << *xPointer<<endl;` shows the value of `*xPointer`.\n\
    \n`cout<<\"Y address: \" << yPointer<<endl;` shows the address of `yPointer`.\n\
    \n## Chapter 7\n\n### Output One Character\n\nWe can use a single quote to define\
    \ a character, e.g. `'A'`, `'Z'`.\n\nThe syntax to output one character is:\n\n\
    `cout.put (char)`\n\n#### Example 7.1\n\n```cpp\n#include <string>\n#include <iostream>\n\
    using namespace std;\nint main( ) {\n    char ch = 'C'; // Note: use single quote\n\
    \    cout.put (ch) << endl; // output one character\n    return 0;\n}\n```\n\n\
    Output:\nC\n\nExplanation:\n\n`#include <iostream>` includes the `iostream` class\
    \ that helps input or output.\n\n`cout.put ( ch )` displays character `“C”`.\n\
    \n### Output String\n\nThe syntax to output a string is:\n\n`cout.write (stringArray,\
    \ stringLength);`\n\n`stringArray` defines the string as an array.\n\n`stringLength`\
    \ defines the string size.\n\n#### Example 7.2\n\n```cpp\n#include <iostream>\n\
    #include <string.h>\nusing namespace std;\nint main() {\n    char ch[ ] = \"This\
    \ is a test\"; // define a string array\n    cout.write(ch, strlen(ch)) << endl;\
    \ // output a string\n    return 0;\n}\n```\n\nOutput:\nThis is a test\n\nExplanation:\n\
    \n`ch[ ] = \"This is a test\"` defines a string array.\n\n`strlen(ch)` gets the\
    \ size of `ch` as the output length.\n\n`cout.write( )` is used to output a string.\n\
    \n### Input One Character\n\nThe syntax to input one character by the keyboard\
    \ is:\n\n`cin.get (char c)`\n\n#### Example 7.3\n\n```cpp\n#include <iostream>\n\
    #include <string.h>\nusing namespace std;\nint main(){\n    char c;\n    cout\
    \ << \"Input one character: \";\n    cin.get ( c ); // input one character\n \
    \   cout << c << endl; // output the character\n    return 0;\n}\n```\n\n// assume\
    \ that we input one character 'A' from the keyboard\n\nOutput:\nInput one character:\
    \ A\n\nExplanation:\n\n`cin.get ( c );` accepts one character from the keyboard.\n\
    \n`cout << c << endl;` displays what have inputted.\n\n### Input String (1)\n\n\
    The first syntax to input a string is:\n\n`cin.read ( stringArray, stringLength);`\n\
    \n`stringArray` defines the string as an array.\n\n`stringLength` defines the\
    \ maximum string size.\n\n#### Example 7.4\n\n```cpp\n#include <iostream>\n#include\
    \ <string.h>\nusing namespace std;\nint main(){\n    cout<< \"Please input a sentence:\"\
    << endl;\n    char mystring[ 80]; // string can contain 80 characters\n    cin.read\
    \ ( mystring , 10 ); // max input 10 characters\n    cout << \"What you inputted\
    \ is: \" << mystring << endl;\n    return 0;\n}\n```\n\nOutput:\nPlease input\
    \ a sentence: __\n\nExplanation:\n\n`char mystring[ 80 ];` defines a string array,\
    \ which can contain 80 characters. `cin.read ( mystring, 10 )` inputs a string\
    \ with maximum 10 characters.\n\n### Input String (2)\n\nThe second syntax to\
    \ input a string is:\n\n`getline ( cin, mystring);`\n\n`getline ( cin, mystring);`\
    \ can let user input a string.\n"
