    We can get or set the value of an array.


    | int value = array[index];//  get a value from an element. |


    | int array[index] = value;//  set a value to an element. |


    Example 3.4


    | int arr[5] = {10, 20, 30, 40, 50};int value = arr[2]; //  get a value from an
    element.cout <<  value <<endl; // output: 30 |


    Example 3.5


    | int num[5] = {10, 20, 30, 40, 50};num[3] = 800; //  set a value to an element.cout
