    a functionint secondFunction(int arg ); // declare a functionint main( ) {int
    num = 2;firstFunction ( num ); // call the firstFunctionreturn 0;}void firstFunction
    ( int num ){cout << "The result is "<< secondFunction (num) <<endl;} // call the
    secondFunctionint secondFunction( int num) {return ( num * 50);} |


    Output:


    The result is 100.


    Explanation:


    In “firstFunction”, the “secondFunction (num)” calls a function named “int secondFunction(
