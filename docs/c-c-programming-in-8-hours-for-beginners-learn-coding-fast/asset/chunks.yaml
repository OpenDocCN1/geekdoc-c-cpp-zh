    define a functioncout << "This is a function demo." <<endl;} |


    Output:


    This is a function demo.


    Explanation:


    “void myFunction();” declares a function.


    “myFunction( );” calls a function.


    “void myFunction( ) {……}” defines a function.


    “return 0” indicates the program run completely.


    “void” is a return type, meaning without return value, namely there is no any
    “return” command in the function body.


    ### Function & Arguments


    A function sometimes has an argument.


    Before using a function, you need to declare a function.


    | type function-name( arg ); // declare a functionfunction-name ( argument );
    // call the functiontype function-name ( arg ) { // define a function……};  |


    Example 3.7


    | #include <iostream>using namespace std;void myFunction(string arg ); // declare
