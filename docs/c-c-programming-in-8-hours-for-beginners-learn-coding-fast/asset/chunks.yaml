    endl;return 0;} |


    Output:


    10   20


    20   10


    Explanation:


    “void swap ( int &a, int &b)” uses the reference in the argument.


    (&a, &b) can receive the parameters (x, y) from the function caller, and can also
    pass the parameters (y, x) to the function caller.


    Before swap, “a” is an alias of “x”, “b” is an alias of “y”.


    After swap, “a” is an alias of “y”, “b” is an alias of “x”.


    ### Exercise: Value & Address


    Pointer Sample Program


    Write C++ codes to your favorite editor.


    | #include<iostream>using namespace std;int main( ){int x = 100, y = 200;int *xPointer
    = &x; // *xPointer has the value of xint *yPointer; // declare a pointeryPointer
    = &y; // yPointer has the address of ycout<<"X value: "<<*xPointer<<endl; // show
    valuecout<<"X address: "<<xPointer<<endl; // show addresscout<<"Y value: "<<*yPointer<<endl;
    // show valuecout<<"Y address: "<<yPointer<<endl; // show addressreturn 0;} |


    Save, and run the program.


    Output:   


    X value: 100


    X address: 0x22ff54


    Y value: 200


    Y address: 0x22ff50


    Explanation:


    “int *xPointer = &x;” declares and initializes the pointer.


    “int *xPointer = &x;” means that *xPointer has the value of x.


     “int *yPointer;” declares a pointer.


    “*yPointer=&y;” means that *yPointer has the value of y.


    "xPointer=&x" means that "xPointer" has the address of x.


    "yPointer=&y" means that "yPointer" has the address of y.


    “cout<<"X value: "<<*xPointer<<endl;” shows the value of “*xPointer”.


    “cout<<"X address: "<<xPointer<<endl;” shows the address of “xPointer”.


    ## Chapter 7


    ### Output One Character


    We can use a single quote to define a character, e.g. ''A'', ''Z''.


    The syntax to output one character is:


    | cout.put (char C) |


    Example 7.1


    | #include <string>#include <iostream>using namespace std;int main( ) {char ch
    = ''C''; // Note: use single quote.cout.put (ch) << endl; // output one characterreturn
    0;} |


    Output:    C 


    Explanation:


    “#include <iostream>” includes the iostream class that helps to input or output.


    “cout.put ( ch )” display one character “C”.


    ### Output String


    The syntax to output a string is:


    | cout.write (stringArray, stringLength); |


     “stringArray” defines the string as an array.


    “stringLength” defines the string size.


    Example 7.2


    | #include <iostream>#include <string.h>using namespace std;int main() {char ch[
    ] = "This is a test"; // define a string arraycout.write(ch, strlen(ch)) << endl;
    // output a stringreturn 0;}     |


    Output:      This is a test


    Explanation:


    “ch[ ] = “This is a test” defines a string array.


    “strlen(ch)” gets the size of “ch” as the output length.


    cout.write( ) is used to output a string.


    ### Input One Character


    The syntax to input one character by the keyboard is:


    | cin.get (char c ); |


    Example 7.3


    | #include <iostream>#include <string.h>using namespace std;int main(){char c;cout
    << "Input one character: ";cin.get ( c ); // input one charactercout << c <<endl;
    // output the characterreturn 0;}          |


    // assume that we input one character ''A'' from the keyboard


    Output        Input one character: A


    Explanation:


    “cin.get ( c );” accepts one character from the keyboard.


    “cout << c <<endl;” displays what have inputted.


    ### Input String (1)


    The first syntax to input a string is:


    | cin.read ( stringArray, stringLength); |


    “stringArray” defines the string as an array.


    “stringLength” defines the maximum string size.


    Example 7.4


    | #include <iostream>#include <string.h>using namespace std;int main(){cout<<
    "Please input a sentence:"<< endl;char mystring[ 80]; // string can contain 80
    characterscin.read ( mystring , 10 ); // max input 10 characterscout << "What
    you inputted is: " << mystring << endl;return 0;}       |


    Output:        Please input a sentence: __


    Explanation:


    “char mystring[ 80 ];” defines a string array, which can contain 80 characters.
    “cin.read ( mystring, 10 )” inputs a string with maximum 10 characters.


    ### Input String (2)


    The second syntax to input a string is:


    | getline ( cin, mystring); |


    “getline ( cin, mystring);” can let user input a string.'
