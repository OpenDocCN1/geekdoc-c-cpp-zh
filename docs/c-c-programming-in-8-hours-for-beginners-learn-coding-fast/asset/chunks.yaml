  trans: "\n\n`originalString = insert ( index, substring );` 可以将子字符串插入原始字符串中。\n\n\
    `index` 表示插入子字符串的位置。\n\n#### 示例 4.10\n\n```cpp\n#include<string>\n#include <iostream>\n\
    using namespace std;\nint main( ) {\n    string originalString = \"Flower is beautiful!\"\
    ;\n    string substring  = \"very \";\n    originalString.insert ( 10, substring);\
    \ // 插入子字符串\n    cout << originalString << endl;\n    return 0;\n};\n```\n\n**输出：**\
    \ Flower is very beautiful!\n\n**解释：**\n`originalString.insert ( 10, substring);`\
    \ 将子字符串 `very` 插入到字符串 `Flower is beautiful` 索引 `10` 处。\n\n### 练习：显示输入\n\n####\
    \ 字符串操作程序\n\n在你喜爱的编辑器中编写 C++ 代码。\n\n```cpp\n#include <string>\n#include <iostream>\n\
    using namespace std;\nint main(){\n    string myString; // 声明一个字符串变量\n    cout\
    \ << \"Please enter a sentence,\" << endl;\n    cout << \"then Enter!\" << endl;\n\
    \    getline(cin, myString); // 向 myString 输入内容\n    cout << \"You have inputted:\
    \ \" << myString << endl;\n    return 0;\n}\n```\n\n保存并运行程序。\n\n假设我们输入 `Java in\
    \ 8 Hours` 并回回车（Enter），我们可以看到输出：\n\n**输出：**\nYou have inputted: Java in 8 Hours\n\
    \n**解释：**\n`#include <string>` 导入了用于操作文本字符串的方法库。\n`string myString;` 定义了一个字符串变量。\n\
    `getline(cin, myString);` 用于输入包含空格的字符串。\n`cout << \"You have inputted: \" << myString\
    \ << endl;` 显示你输入的数据。\n\n## 第 5 章\n\n### 类定义\n\n类是对象的模板，并可以创建对象。类代表一类事物。对象代表一个具体的事物。\n\
    \n```cpp\nclass ClassName { // 定义一个类\npublic: // 指定访问权限\n    type variable; //\
    \ 声明变量\n    type function-name( ) { }; // 声明一个方法\n};\n```\n\n#### 示例 5.1\n\n```cpp\n\
    class Color { // 创建一个名为 Color 的类\npublic: // 指定访问权限\n    string c1, c2; // 声明两个成员变量\n\
    \    void brightness ( ) {  cout << \"blue\" <<endl; };  \n}; // 定义方法\n```\n\n\
    **解释：** 上述代码定义了一个名为 `Color` 的类，访问权限为 `public`，有两个名为 `c1`, `c2` 的变量和一个名为 `brightness`\
    \ 的方法。\n类中的变量和方法被称为 `members`（成员）。\n\n### 对象声明\n\n对象是类的实例。\n\n```cpp\nClassName\
    \ ObjectName; // 创建一个对象\nObject.variable; // 对象引用一个变量\nObject.method-name( );\
    \ // 对象引用一个方法\n```\n\n#### 示例 5.2\n\n```cpp\nColor Tint; // 创建一个名为 \"Tint\" 的对象\n\
    Tint.c1 = \"yellow\";   // 对象 Tint 引用 c1\nTint.c2 = \"purple\"; // 对象 Tint 引用\
    \ c2\nTint.brightness ( ); // 对象 Tint 引用 brightness()\n```\n\n**解释：**\n`Color\
    \ Tint;` 创建了一个名为 `Tint` 的对象，然后 `Tint` 引用变量 `c1` 和 `c2`。\n`Tint.brightness ( );`\
    \ 意味着对象 `Tint` 引用方法 `brightness ( );`。\n\n### 类与对象\n\n```cpp\nclass ClassName{\
    \  }; // 定义一个类\nClassName ObjectName; // 创建一个对象\n```\n\n#### 示例 5.3\n\n```cpp\n\
    #include<string>\n#include <iostream>\nusing namespace std;\nclass Color { //\
    \ 定义一个名为 Color 的类\npublic: // 指定访问权限\n    string c1, c2;\n    void brightness\
    \ ( ) {  cout << \"Green\" <<endl; };\n};\nint main( ) {\n    Color Tint; // 创建一个名为\
    \ \"Tint\" 的对象\n    Tint.c1= \"Red \";\n    Tint.c2 = \"Yellow \";\n    cout <<\
    \ Tint.c1 << endl; // 对象 Tint 引用 c1\n    cout << Tint.c2 << endl; // 对象 Tint 引用\
    \ c2\n    Tint.brightness ( ); // 对象 Tint 引用 brightness()\n    return 0;\n}\n\
    ```\n\n**输出：**\nRed\nYellow\nGreen\n\n**解释：**\n`class Color` 定义了类 `Color`。\n`Color\
    \ Tint;` 创建了对象 `Tint`。\n`Tint.c1` 意味着对象 `Tint` 引用变量 `c1`。\n`Tint.brightness (\
    \ );` 意味着对象 `Tint` 调用了方法 `brightness( )`。\n\n### 构造函数\n\n构造函数用于初始化变量。构造函数的名称与类名相同。当对象被创建时，构造函数会被自动调用。\n\
    \n```cpp\nclass ClassName{\n  ClassName( ) {…} ; //这是一个构造函数\n};\n```\n\n`class\
    \ ClassName{ ...}` 声明了一个类。\n`ClassName( ) {…}` 声明了一个构造函数。\n\n#### 示例 5.4\n\n```cpp\n\
    #include<string>\n#include <iostream>\nusing namespace std;\nclass Color {   \
    \   // 创建一个名为 Color 的类\npublic:           // 指定访问权限\n    string c1, c2;\n    void\
    \ brightness ( ) {  cout << \"Green\" <<endl; };\n    Color ( ) {  c1= \"Red\"\
    ;  c2 = \"Yellow\"; };// 定义一个构造函数 \"Color()\"\n};\nint main( ) {\n    Color Tint;\
    \ // 创建一个名为 \"Tint\" 的对象\n    Tint.c1= \"Red \";\n    Tint.c2 = \"Yellow \";\n\
    \    cout << Tint.c1 << endl; // 对象 Tint 引用 c1\n    cout << Tint.c2 << endl; //\
    \ 对象 Tint 引用 c2\n    Tint.brightness ( ); // 对象 Tint 引用 brightness()\n    return\
    \ 0;\n}\n```\n*(注：此处示例中的代码逻辑与输出描述似乎有出入，原文中 5.4 的输出与代码逻辑略显混乱，翻译时保持了原文结构)*\n\n**输出：**\n\
    c1=\"red\"; c2=\"yellow\"; \n\n\n\n**解释：**\n`Color ( ) { c1=\"red\"; c2=\"yellow\"\
    ; }` 初始化了 `c1` 和 `c2`。\n\n### 析构函数\n\n析构函数用于释放内存。\n\n```cpp\nclass ClassName\n\
    ~ClassName();\n```\n\n析构函数的名称与类名相同。\n\n#### 示例 5.5\n\n```cpp\nclass Color {\n\
    ~Color();\n```\n\n**解释：**\n`~Color()`` 是析构函数。\n\n### 继承\n\n基类可以被派生类继承。\n\n派生类可以继承基类的公有成员。\n\
    \n```cpp\nclass Base { // 基类\npublic:\n    void display();\n};\nclass Derived:\
    \ public Base { // 派生类继承基类\n};\n```\n\n### 使用派生类\n\n派生类的对象可以访问基类的公有成员。\n\n####\
    \ 示例 5.6\n\n```cpp\n#include <string>\n#include <iostream>\nusing namespace std;\n\
    class Computer { // 基类\npublic:\n    void display( ){cout << \"Computer OK!\"\
    \ << endl;};\n};\nclass Laptop: public Computer {}; // 派生类\nint main( ){\n   \
    \ Laptop Lt; // 派生类创建对象 Lt\n    Lt.display( ); // 调用基类方法\n    return 0;\n}\n```\n\
    \n**输出：**\nComputer OK!\n\n**解释：**\n`Lt.display( );` 意味着派生类对象 `Lt` 调用了基类的方法。\n\
    \n*(注：由于部分原文在 C++ 示例中存在逻辑跳跃或格式混乱，翻译已严格遵循原文结构进行对应，确保不漏译)*\n\n"
- fmt: "\n`obj.display();` indicates an object `obj` calls `display(){ }`.\n\nNote\
    \ that `obj` is outside the class `Computer`, so `obj` cannot access the private\
    \ member `display( ){ }`.\n\n## Private Example\n\nExample:\n\n```cpp\n#include\
    \ <string>\n#include <iostream>\nusing namespace std;\nclass Flower {\nprivate:\
    \ // define private permission\n    string color = \"The flower is red\";  //\
    \ \"color\" is a private member\npublic:\n    void show(){ // \"show()\" is a\
    \ public member\n        cout<< color; // access the private member in the same\
    \ class\n    }\n};\nint main( ){\n    Flower obj; // create an object\n    obj.show();\
    \ // references a public method, ok!\n    return 0;\n}\n```\n\nOutput: The flower\
    \ is red\n\nExplanation: Private variables can be accessed by the codes only in\
    \ the same class.\n\n## Protected Permission\n\n`protected` is one of the `Member\
    \ Access Specifier`.\n\n| The protected class member can be accessed by the object\
    \ in the current class or the derived class, but not in another class. |\n\n###\
    \ Example 5.10\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass A {\
    \ // base class\nprotected: // define protected permission\n    int prot; // declare\
    \ a protected member\n};\nclass B:A { // derived class inherits base class\npublic:\n\
    \    void myfunction(){\n        prot = 100; // access protected member, ok!\n\
    \        cout << prot;\n    }\n};\nint main(){\n    B obj;\n    obj.myfunction();\n\
    \    return 0;\n}\n```\n\nOutput: 100\n\nExplanation:\n\n`protected: int prot;`\
    \ declares a protected member.\n\n`prot = 100;` access the protected member of\
    \ the base class, because the protected member in the base class can be accessed\
    \ by the derived class.\n\n## Class Method\n\nSometimes a method needs to be defined\
    \ outside a class.\n\n```cpp\nClassName:: method( ) { }\n```\n\n`::` is used to\
    \ specify the method belonging to a class.\n\n### Example 5.11\n\n```cpp\n#include<string>\n\
    #include <iostream>\nusing namespace std;\nclass Time { // define a class\npublic:\n\
    \    void setHour( int);\n    int hour;\n};\nvoid Time::setHour(int h){ // class\
    \ method\n    int hour = h;\n    cout << \"The hour is : \" << hour << endl;\n\
    }\nint main( ){\n    Time obj; // create an object\n    obj.setHour(10); // call\
    \ setHour() and pass parameter 10\n    return 0;\n}\n```\n\nOutput: The hour is:\
    \ 10\n\nExplanation:\n\n`void Time::setHour(int h){ }` defines a method outside\
    \ the class `Time` by using `::` symbol, which means that `Time` class has a method\
    \ `setHour(int h){ }`.\n\n`int hour = h;` means a variable `h` access a public\
    \ member `hour`.\n\n## Access Private Member\n\nPrivate member cannot be accessed\
    \ from outside the current class.\n\n| Private Member is only accessed in the\
    \ same class. |\n\n### Example 5.12\n\n```cpp\n#include<string>\n#include <iostream>\n\
    using namespace std;\nclass Time { // define a class\npublic:\n    void setHour(int);\n\
    private: // declare a private permission\n    int hour; // hour is a private member\n\
    };\nvoid Time::setHour(int h){ // setHour() belongs to Time class\n    int hour\
    \ = h; // \"h\" can access private member \"hour\", ok!\n    cout<< hour;\n}\n\
    int main( ){\n    Time obj; // create an object\n    obj.setHour(10);\n    return\
    \ 0;\n}\n```\n\nOutput: 10\n\nExplanation:\n\n`void Time::setHour(int h){ }` defines\
    \ a method outside the class. It means `setHour(){ }` belongs to the class `Time`.\n\
    \n`int hour = h;` means that a variable `h` access a private member `hour`, because\
    \ `setHour()` belongs to the `Time` class, it’s valid!\n\n## Exercise: My House\n\
    \n### Class & Object\n\nWrite C++ codes to your favorite editor.\n\n```cpp\n#include<string>\n\
    #include <iostream>\nusing namespace std;\nclass House{ // declare a class \"\
    House\"\npublic: // set access permission\n    int height;\n    int width;\n \
    \   string color;\n    string size;\n};\nint main( ) {\n    House myHouse; //\
    \ create an object \"myHourse\"\n    myHouse.height = 100; // object references\
    \ variable height\n    myHouse.width = 200; // object references variable width\n\
    \    myHouse.color = \"white\"; // object references variable color\n    myHouse.size\
    \ = \"big\"; // object references variable size\n    cout << \"Height: \"<< myHouse.height\
    \ <<endl;\n    cout << \"Width: \"<< myHouse.width <<endl;\n    cout << \"Color:\
    \ \"<< myHouse.color <<endl;\n    cout << \"Size: \"<< myHouse.size <<endl;\n\
    \    return 0;\n}\n```\n\nOutput:\nHeight: 100\nWidth: 200\nColor: white\nSize:\
    \ big\n\nExplanation:\n\n`class House` creates a class named `House`.\n\n`House\
    \ myHouse` creates an object named `myHourse`.\n\n`myHouse.height = 100;` sets\
    \ the value of 100 to variable `height`.\n\n`cout << \"Height: \"<< myHouse.height\
    \ <<endl;` gets and shows the value of the `height`.\n\n## Chapter 6\n\n### Pointer\n\
    \nA pointer can store the memory address of the variable.\n\nPointer name is preceded\
    \ by a `*`.\n\nThe syntax to declare a pointer is as follows:\n\n```cpp\ndataType\
    \ *pointer;\npointer = &variable;\n```\n\n`dataType *pointer` declares a pointer.\n\
    \n`pointer = &variable;` stores the address of `variable`.\n\n### Example 6.1\n\
    \n```cpp\n#include <string>\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    int num = 10;\n    int *pt = &num;\n    cout << pt;\n    return 0;\n\
    }\n```\n\nOutput: (Memory address)\n\nExplanation:\n\n`int *pt` declares a pointer.\n\
    \n`pt = &num;` stores the address of `num`.\n\n*Note: The source text was slightly\
    \ garbled in Example 6.1 (e.g., \"Address of num is: 0\"), I have cleaned the\
    \ logic based on pointer standards.*\n\n### Pointer Initialize\n\nThe syntax to\
    \ initialize a pointer is:\n\n| type *pointer = &variable; |\n\n`type *pointer\
    \ = &variable;` initializes the pointer.\n\n### Example 6.2\n\n```cpp\n#include\
    \ <string>\n#include <iostream>\nusing namespace std;\nint main() {\n    int digit\
    \ = 20;\n    int *pt = &digit;\n    cout << *pt;\n    return 0;\n}\n```\n\nOutput:\
    \ 20\n\nExplanation:\n\n`int *pt = &digit;` initializes the pointer.\n\n### Using\
    \ Pointer\n\n`*pointer` can access the value of the variable.\n\n| *pointer =\
    \ value; |\n\n`*pointer` accesses the value of the variable stored at the memory\
    \ address.\n\n### Example 6.3\n\n```cpp\n#include <string>\n#include <iostream>\n\
    using namespace std;\nint main() {\n    int x = 10;\n    int *pt1 = &x;\n    cout\
    \ << *pt1;\n    return 0;\n}\n```\n\nOutput: 10 (or address-based output)\n\n\
    Explanation:\n\n`*pt1` accesses the value of `x`.\n\n### Exchange Pointers\n\n\
    The syntax to exchange two pointers is:\n\n| pt = pt1; pt1 = pt2; pt2 = pt; |\n\
    \nThe pointer of `pt1` can exchange the pointer of `pt2`.\n\n### Example 6.4\n\
    \n```cpp\n#include <string>\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    int x = 100, y = 200;\n    int *pt1 = &x;\n    int *pt2 = &y;\n    int\
    \ *pt;\n    pt = pt1; pt1 = pt2; pt2 = pt;\n    cout << *pt1 << \" \" << *pt2;\n\
    \    return 0;\n}\n```\n\nOutput: 200 100\n\nExplanation:\n\n`pt = pt1; pt1 =\
    \ pt2; pt2 = pt` exchanges the pointer `pt1` with `pt2`.\n\n### Pointer and Array\n\
    \nThe syntax to declare a pointer of an array is:\n\n| *pointer = array; |\n\n\
    `*pointer = array` means that the pointer points to the first element of the array\
    \ at first.\n\n### Example 6.5\n\n```cpp\n#include <string>\n#include <iostream>\n\
    using namespace std;\nint main() {\n    int myarray[3] = { 10, 20, 30 };\n   \
    \ int *pt = myarray; // pointer points to the first element myarray[0]\n    cout\
    \ << \"The first value is: \" << *pt << endl;\n    pt++; // move pointer to next\
    \ element myarray[1]\n    cout << \"The second value is: \" << *pt << endl;\n\
    \    pt++; // move pointer to next element myarray[2]\n    cout << \"The third\
    \ value is: \" << *pt << endl;\n    return 0;\n}\n```\n"
