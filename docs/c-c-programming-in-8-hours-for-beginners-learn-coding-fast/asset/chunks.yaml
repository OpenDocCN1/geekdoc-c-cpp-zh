    ## Chapter 1


    ### What is C++ ?


    C++ is a general-purpose programming language, which is an extension of the C
    language. C++ is an object-oriented programming language that is used extensively.


    C++ language is developed from the C language.


    The C language was invented by D. M. Ritchie of bell LABS in 1972. It is not designed
    for beginners at first, but for computer professionals. C is a process-oriented
    language. With the scale of software increases, C is no longer suitable for the
    needs of computer development. It cannot handle complex and large tasks.


    In this software crisis situation, C++ language came into being; it was developed
    by Dr. Bjarne Strostrup of AT&T Bell LABS in the 1980s.


    C++ language main features:


    *   Compatible with both advanced and primary languages


    *   Excellent portability. Simple and easy to use


    *   Support for object-oriented programming


    *   Can handle large and complicate programs


    *   Fast speed compilation and development


    ### C++ Compilers & Editors


    Many C++ compilers and editors (IDE) can be free download on the internet.


