    1: Declares an "int" vector "myVector" containing 10 elements.


    2: Declares a "double" vector "prices" containing 60 elements.


    3: Declares a "string" vector "titles" containing 18 elements.


    ### Vector.method( ) (1)


    The methods of the vector are as follows:


    | push_back(value) | add an element to the end of the vector |


    | size( ) | return the size of the vector |


    | at(index) | return the value at the specified index |


    | pop_back( ) | delete the last element |


