    function( );” means that a class can reference this static function directly.


    Example 8.3


    | #include <iostream>using namespace std;class Account {public:static int myfunction(
    int n ); // declare a static method};int Account :: myfunction(int n){ // class''s
    methodreturn n;}int main() {cout << Account :: myfunction( 200 ) << endl;// a
    class references a method directlyreturn 0;} |


    Output:


    200


    Explanation:


    “static int myfunction(int n)” means a static function “myfunction(int n)” can
    be referenced by a class or an object.


    “Account :: myfunction ( 200)” means that the class “Account” references a static
    function “myfunction( 200 )”.


    Non-static function is referenced only by the object, not by class.


    ### X++ or ++X


    | ++ X | X plus 1 first, then run expression |


    | X ++ | Run expression first, then X plus 1 |


    | - - Y | Y minus 1 first, then run expression |


    | Y - - | Run expression first, then Y minus 1. |


    Example 8.4


    | int X = 10, num;num = ++X - 3;/* X plus 1 is 11, 11 minus 3 is 8, then the result
    “8” assigns to num. The num value is 8. The X value is 11 */cout << num <<" ,
    "<< X << endl; // output:  8 , 11 |


    Example 8.5


    | int X = 10, num;num = X++ - 3;/* X minus 3 is 7, the result “7” assigns to num.
    The num value is 7. Then X plus 1 is 11,  the X value is 11 */cout << num <<"
    , "<< X << endl; // output:  7 , 11 |


    ### Recursive Function


    A function caller inside a function calls itself, which is known as a recursive
    function. The syntax of the recursive function is:


    | type function_name(){function_name(); // the function caller calls itself} |


    Example 8.6


    | #include <iostream>using namespace std;void myself(int n);int main() {myself
    ( 1 ); // declare a functionreturn 0;}void myself ( int n){ // define a function
    "myself(){ }"cout <<  "Number " << n << endl;++n;if ( n == 4) return; // return
    means stop runningelse myself ( n ); // the function caller calls myself()} |


    Output:


    Number 1


    Number 2


    Number 3     


    Explanation:


    “void myself ( int n){ }” body contains a function caller “myself(n);”.


    “void myself ( int n)” is called by “myself(n)” that is inside the "myself(int
    n){ }", which is known as a recursive function.


    The recursive function keeps running until "n equals 4".


    “if ( n == 4) return;” stops running the program when "n" equals 4, then exits
    the recursive function.


    ### Local & Global Variable


    The local variable is only visible in the current function.


    The global variable is visible in any function.


    | Local variable is defined inside the function.Global variable is defined outside
    the function. |


    Example 8.7


    | #include <iostream>using namespace std;void test1();void test2();int main(){test1();test2();return
    0;}int a = 100, b = 200; //  define two global variablesvoid test1 ( ) { // define
    a functionint x = 30, y = 40; //   define two local variablescout << a << ","
    << b << endl;cout << x << "," << y << endl;}void test2 ( ) { // define a functionint
    x = 50, y = 60; //   define two local variablescout << a << "," << b << endl;   cout
    << x << "," << y << endl;   } |


    Output:


    100, 200


    30, 40


    100, 200


    50, 60


    Explanation:


    “a” and “b” are global variables, which are visible in any function.


    “x” and “y” are local variables, which are visible only in the current function.


    ### Exceptions


    C++ program may have some bugs, which calls “Exceptions”.


    The main exceptions as following:


    | Exceptions | Situations |


    | domain_error | out of precondition |


    | invalid_argument | invalid argument in function |


    | length_error | size too long or short |


    | out_of_range | invalid range |


    | overflow_error | data overflow |


    Example 8.8


    | int main( ) {int x, y = 0;x = 100 / y; // exception occurs!cout << x << endl;return
    0;} |


    Output:        Exception: ArithmeticException: / by zero)


    Explanation:


    “ 100 / y ” causes an Exception, because “y” is zero.


    ### Try-Catch


    "try-catch" can process the exception, the syntax is as follows:


    | try{ ……} // exception may occur in herecatch(exception)    { ……} // catch and
    resolve the exception |


    “try {… …}” throws the exception out to the catch( ) { } block when an exceptional
    error occurs.


    “catch( ){ }” catches any exception from the try block, and handles it.


    For “try-catch”, you need to use #include<stdexcept>.


    Example 8.9


    | #include <iostream>#include <stdexcept>using namespace std;int main(){string
    str1 = "JavaScript";string str2 = "and";try{ // exception may occurstr1.insert(100,
    str2); // “100” causes an error}catch(logic_error){ // catch the exceptioncout
    << "Catch an exception." << endl;cout << "Out of range!" << endl;}return 0;} |


    Output:


    Catch an exception.


    Out of range!


    Explanation:


    In try{ } block, “str1.insert(100, str2);” causes an exception.


    “catch(logic_error){ }” catches and processes the exception.


    ### Return Exception Message


    The syntax to show the exception message is as follows:


    | try{…}catch(exception& e){  cout  << e.what( )  <<endl;  } |


    “e.what( )” can produce an exception message.


    "e" is an exception object.


    Example 8.10


    | #include <stdexcept>#include <iostream>using namespace std;int main (){string
    str = "JavaScript";try{str.at(100);}catch(exception &e) { // e is an exception
    objectcout<<"Catch an exception: "<< e.what( ) << endl;// “e.what( )” creates
    an exception message.}return 0;} |


    Output:


    Catch an exception: basic_string::at: __......


    Explanation:


    “catch(exception &e)” can catch an exception. Note that its parameter is an “&e”,
    which means that the value of the "e" can return to the exception object.


    “e” is an exception object.


    “e.what( )” produces an exception message.


    ### Throw Exception


    We can set the code to throw an exception in the place where the exception may
    occur.


    | try{… throw…} // throw an exceptioncatch{……} |


    “throw” can throw out an exception based on our setting.


    Example 8.11


    | #include <stdexcept>#include <iostream>using namespace std;int main (){try{int
    x = 100, y = 0;if( y == 0 ){throw y; // we can set "throw out an exception" in
    herex = x / y;}}catch (int e){ // catch and handle the exceptioncout << "An exception
    occurred." << endl;cout << "The number is divided by " << e ;}return 0;} |


    Output:


    An exception occurred.


    The number is divided by by 0


    Explanation:


    “throw y;” throws an exception for y. If y equals zero, x/y will be an error.


    “catch (int e){ }” can catch  and handle the exception.


    ### Vector


    Vectors are similar to arrays that can change in size. Just like arrays, vectors
    can be any data type and its first index starts with zero.


    If we use vector, C++ <vector> library must be included by #include <vector> at
    the beginning of the program.


    The syntax of creating a vector looks like this:


    | Vector <data-type> vector-name (size); |


    Example 8.12


    | vector <int> myVector (10); // 1vector <double> prices (60); // 2vector <string>
    titles (18); // 3                             |


