    ## 第一章


    ### 什么是 C++？


    C++ 是一种通用的编程语言，是 C 语言的扩展。


    C++ 是从 C 语言开发的。


    C 语言是由 `bell LABS` 的 `D. M. Ritchie` 在 `1972` 年发明的。它最初并不是为初学者设计的，而是为了计算机专业人士。随着软件规模的扩大，`C`
    语言不再 way 计算机开发的需求。它无法处理复杂的大型任务。


    ### C++ 编译器与编辑器


    许多 C++ 编译器和编辑器（IDE）可以在互联网上免费下载。


    下载并安装一个 IDE：


    | IDE | 链接 |

    | :--- | :--- |

    | Dev C++ | `http://www.bloodshed.net` |

    | CLion | `https://www.jetbrains.com/clion/` |

    | Codelite | `https://codelite.org/` |


