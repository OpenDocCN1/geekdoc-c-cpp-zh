    # C++ Programming For Beginners

    ## Crash Course Book

    **Ray Yao**


    ## About This Book


    "C++ in 8 hours" is a textbook for high school and college students; it covers
    all essential C++ language knowledge. You can learn complete primary skills of
    C++ programming fast and easily.


    The textbook includes a lot of practical examples for beginners and includes exercises
    for the college final exam, the engineer certification exam, and the job interview
    exam.


    “C++ in 8 hours” is a useful textbook for beginners. The straightforward definitions,
    the plain examples, the elaborate explanations and the neat layout feature this
    helpful and educative book. You will be impressed by its distinctive and tidy
    writing style. Reading this book is a great enjoyment!


    ## Disclaimer


    This book is only suitable for programming beginners, high school students and
    college students; it is not for the experienced programmers.


    ## Source Code Available


    This book provides source code for reference; you can reference the source code
    for better study, or copy the source code to your favorite editor to test the
    programs.


