  trans: "\n\n# 示例 7.5\n\n```cpp\n#include <iostream>\n#include <string.h>\nusing\
    \ namespace std;\nint main(){\n    string mystring;\n    cout << \"Please enter\
    \ a sentence:\" << endl;\n    getline ( cin, mystring );   // 输入一个字符串\n    cout\
    \ << mystring << endl;\n    return 0;\n} // 假设我们输入字符串 \"C++ is very good\"\n```\n\
    \n**输出：**\n```\nPlease enter a sentence:\nC++ is very good\n```\n\n**解释：**\n`getline\
    \ ( cin, mystring);` 接收用户的字符串输入。\n\n## 写入文件\n\n写入文件的语法为：\n\n```cpp\nofstream fileObject\
    \ (\"myFile.txt\"); // 创建输出对象\nfileObject << mystring << endl; // 将 mystring 写入文件\n\
    ```\n\n`ofstream fileObject (\"myFile.txt\");` 创建了一个输出文件对象 `fileObject`。\n\n`ofstream`\
    \ 类用于向文件写入数据。\n\n`fileObject` 是一个输出文件对象。\n\n`fileObject << mystring << endl;`\
    \ 将 `mystring` 写入文件。\n\n处理文件时，我们需要先包含 `#include <fstream>`。\n\n## 示例 7.6\n\n```cpp\n\
    // 请先创建一个空文件“myFile.txt”。\n// 假设 \"myFile.txt\" 的路径为 \"D:\\\\myFile.txt\"。\n#include\
    \ <iostream>\n#include <fstream>\n#include <string>\nusing namespace std;\nint\
    \ main(){\n    ofstream fileObject ( \"D:\\\\myFile.txt\" ); // 创建对象\n    string\
    \ mystring = \"C++ is a very good language.\";\n    fileObject << mystring <<\
    \ endl; // 将 mystring 写入文件\n    fileObject.close ( );\n    cout << \"Write to\
    \ file successfully!\" << endl;\n    return 0;\n}\n```\n\n**输出：**\n```\nWrite\
    \ to file successfully!\n```\n\n**解释：**\n打开 `myFile.txt`，我们将发现以下内容：\n\"C++ is\
    \ a very good language.\"\n\n`ofstream` 类用于向文件写入数据。\n\n`ofstream fileObject (\
    \ “D:\\\\myFile.txt” );` 创建了一个输出文件对象 `fileObject`。\n\n`fileObject << mystring\
    \ << endl;` 将 `mystring` 写入文件 `myFile.txt`。\n\n## 打开文件\n\n当打开文件时，我们可以指定“文件模式”（File\
    \ Mode）。\n\n| 模式 | 用法 |\n| :--- | :--- |\n| `ios :: in` | 打开文件以读取输入 |\n| `ios\
    \ :: out` | 打开文件以写入输出 |\n| `ios :: app` | 打开文件追加输出 |\n| `ios :: trunc` | 打开文件或截断现有文件\
    \ |\n| `ios :: ate` | 打开文件但不截断现有文件 |\n| `ios :: binary` | 以二进制格式打开文件 |\n\n## 示例\
    \ 7.7\n\n```cpp\nofstream fileObject ( “myfile.txt”, ios :: app ); // 行 1\nofstream\
    \ fileObject ( “myfile.txt”, ios :: trunk ); // 行 2\nofstream fileObject ( “myfile.txt”,\
    \ ios :: binary ); // 行 3\n```\n\n**解释：**\n行 1：打开 `myfile.txt`，在现有内容的末尾追加输出。\n\
    行 2：打开 `myfile.txt`，截断现有文件。\n行 3：打开 `myfile.txt`，将文件作为二进制格式处理。\n\n## 读取文件\n\n\
    读取文件的语法为：\n\n```cpp\nifstream fileObject ( “myFile.txt” ); // 创建输入对象\ngetline\
    \ ( fileObject, mystring); // 从文件读取 mystring\n```\n\n`ifstream fileObject ( “myFile.txt”\
    \ );` 创建了一个输入文件对象 `fileObject`。\n\n`ifstream` 类用于从文件读取数据。\n\n`fileObject` 是一个输入文件对象。\n\
    \n`getline ( fileObject, mystring);` 从文件中读取 `mystring`。\n\n处理文件时，我们需要先导入 `#include\
    \ <fstream>`。\n\n## 示例 7.8\n\n```cpp\n// 假设 \"myFile.txt\" 的路径为 \"D:\\\\myFile.txt\"\
    。\n// “myFile.txt” 的内容为：“C++ is a very good language.”\n#include <iostream>\n\
    #include <fstream>\n#include <string>\nusing namespace std;\nint main(){\n   \
    \ string mystring;\n    ifstream fileObject ( \"D:\\\\myFile.txt\" ); // 创建对象\n\
    \    getline ( fileObject, mystring ); // 读取文件内容到 mystring\n    cout << mystring\
    \ <<endl; // 显示 mystring 的内容\n    fileObject.close ( );\n    return 0;\n}\n```\n\
    \n**输出：**\n```\nC++ is a very good language.\n```\n\n**解释：**\n`ifstream` 类用于从文件读取数据。\n\
    \n`ifstream fileObject ( “D:\\\\myFile.txt” );` 创建了一个输入文件对象 `fileObject`。\n\n\
    `getline ( fileObject, mystring);` 将文件读取到 `mystring`。\n\n`cout << mystring` 显示\
    \ `mystring` 的内容。\n\n## 文件结束\n\n检查文件末尾的语法为：\n\n```cpp\nfileObject.eof ( );\n```\n\
    \n如果文件读取到达文件末尾，`eof( )` 将返回 `true`，否则 `eof( )` 返回 `false`。\n\n## 示例 7.9\n\n```cpp\n\
    // 假设 \"myFile.txt\" 的路径为 \"D:\\\\myFile.txt\"。\n// “myFile.txt” 的内容为：“C++ is\
    \ a very good language.”\n#include <iostream>\n#include <fstream>\n#include <string>\n\
    using namespace std;\nint main(){\n    string mystring;\n    ifstream fileObject\
    \ ( \"D:\\\\myFile.txt\" ); // 创建对象\n    getline ( fileObject, mystring ); //\
    \ 读取文件到 mystring\n    cout << mystring <<endl; // 显示 mystring 的内容\n    fileObject.close\
    \ ( );\n    return 0;\n}\n```\n\n"
- fmt: "\n`static` declaration means that function belongs to a class. `className\
    \ :: function( );` means that a class can reference this static function directly.\n\
    \n## Example 8.3\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass Account\
    \ {\npublic:\n    static int myfunction( int n ); // declare a static method\n\
    };\nint Account :: myfunction(int n){ // class's method\n    return n;\n}\nint\
    \ main() {\n    cout << Account :: myfunction( 200 ) << endl; // a class references\
    \ a method directly\n    return 0;\n}\n```\n\n**Output:**\n```\n200\n```\n\n**Explanation:**\n\
    `static int myfunction(int n)` means a static function `myfunction(int n)` can\
    \ be referenced by a class or an object.\n`Account :: myfunction ( 200)` means\
    \ that the class `Account` references a static function `myfunction( 200 )`.\n\
    Non-static function is referenced only by the object, not by class.\n\n## X++\
    \ or ++X\n\n| Expression | Description |\n| :--- | :--- |\n| `++ X` | X plus 1\
    \ first, then run expression |\n| `X ++` | Run expression first, then X plus 1\
    \ |\n| `- - Y` | Y minus 1 first, then run expression |\n| `Y - -` | Run expression\
    \ first, then Y minus 1. |\n\n### Example 8.4\n\n```cpp\nint X = 10, num;\nnum\
    \ = ++X - 3;/* X plus 1 is 11, 11 minus 3 is 8, then the result “8” assigns to\
    \ num. The num value is 8. The X value is 11 */\ncout << num <<\" , \"<< X <<\
    \ endl; // output:  8 , 11\n```\n\n### Example 8.5\n\n```cpp\nint X = 10, num;\n\
    num = X++ - 3;/* X minus 3 is 7, the result “7” assigns to num. The num value\
    \ is 7. Then X plus 1 is 11,  the X value is 11 */\ncout << num <<\" , \"<< X\
    \ << endl; // output:  7 , 11\n```\n\n## Recursive Function\n\nA function caller\
    \ inside a function calls itself, which is known as a recursive function. The\
    \ syntax of the recursive function is:\n\n```cpp\ntype function_name(){\n    function_name();\
    \ // the function caller calls itself\n}\n```\n\n### Example 8.6\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nvoid myself(int n);\nint main() {\n    myself\
    \ ( 1 ); // declare a function\n    return 0;\n}\nvoid myself ( int n){ // define\
    \ a function \"myself(){ }\"\n    cout <<  \"Number \" << n << endl;\n    ++n;\n\
    \    if ( n == 4) return; // return means stop running\n    else myself ( n );\
    \ // the function caller calls myself()\n}\n```\n\n**Output:**\n```\nNumber 1\n\
    Number 2\nNumber 3\n```\n\n**Explanation:**\n`void myself ( int n){ }` body contains\
    \ a function caller `myself(n);`.\n`void myself ( int n)` is called by `myself(n)`\
    \ that is inside the `myself(int n){ }`, which is known as a recursive function.\n\
    The recursive function keeps running until \"n equals 4\".\n`if ( n == 4) return;`\
    \ stops running the program when `n` equals 4, then exits the recursive function.\n\
    \n## Local & Global Variable\n\nThe local variable is only visible in the current\
    \ function. The global variable is visible in any function.\nLocal variable is\
    \ defined inside the function. Global variable is defined outside the function.\n\
    \n### Example 8.7\n\n```cpp\n#include <iostream>\nusing namespace std;\nvoid test1();\n\
    void test2();\nint main() {\n    test1();\n    test2();\n    return 0;\n}\nint\
    \ a = 100, b = 200; // define global variables\nvoid test1 ( { // define a function\n\
    \    int x = 30, y = 40; // define local variables\n    cout << a << \",\" <<\
    \ b << endl;\n}\nvoid test2 ( ) { // define a function\n    int x = 50, y = 60;\
    \ // define local variables\n    cout << a << \",\" << b << endl;\n}\n```\n\n\
    **Output:**\n```\n100,200\n100,200\n```\n\n**Explanation:**\n`a` and `b` are global\
    \ variables, which are visible in any function.\n`x` and `y` are local variables,\
    \ which are visible only in the current function.\n\n## Exceptions\n\nC++ program\
    \ may have some bugs, which calls `Exceptions`. The main exceptions follow:\n\n\
    | Exception | Situation |\n| :--- | :--- |\n| `domain_error` | out of precondition\
    \ |\n| `invalid_argument` | invalid argument in function |\n| `length_error` |\
    \ size too long or short |\n| `out_of_range` | invalid range |\n| `overflow_error`\
    \ | data overflow |\n\n### Example 8.8\n\n```cpp\nint main( ) {\n    int x, y\
    \ = 0;\n    x = 100 / y; // exception occurs!\n    cout << x << endl;\n    return\
    \ 0;\n}\n```\n\n**Output:**\n```\nArithmeticException: by zero\n```\n\n**Explanation:**\n\
    `100 / y` causes an Exception, because `y` is zero.\n\n## Try-Catch\n\n`try-catch`\
    \ can process the exception, the syntax as follows:\n\n```cpp\ntry {\n    // exception\
    \ may occur here\n}\ncatch(exception) {\n    // catch and resolve the exception\n\
    }\n```\n\n`try {… …}` throws the exception out to the `catch( ) }` block when\
    \ an exceptional error occurs. `catch( ) }` catches any exception from the `try`\
    \ block, and handles it. For `try-catch`, you need to use `#include<stdexcept>`.\n\
    \n### Example 8.9\n\n```cpp\n#include <iostream>\n#include <stdexcept>\nusing\
    \ namespace std;\nint main() {\n    string str1 = \"JavaScript\";\n    string\
    \ str2 = \"and\";\n    try { // exception may occur\n        str1.insert(100,\
    \ str2); // “100” causes an error\n    }\n    catch(out_of_range) { // catch the\
    \ exception\n        cout << \"Catch an exception.\" << endl;\n        cout <<\
    \ \"Out of range!\" << endl;\n    }\n    return 0;\n}\n```\n\n**Output:**\n```\n\
    Catch an exception.\nOut of range!\n```\n\n**Explanation:**\nIn `try{ }` block,\
    \ `str1.insert(100, str2);` causes an exception. `catch(out_of_range){ }` catches\
    \ and processes the exception.\n\n## Return Exception Message\n\nThe syntax to\
    \ show the exception message is as follows:\n\n```cpp\ntry {\n}\ncatch(exception&\
    \ e) {\n    cout << e.what() << endl; \n}\n```\n\n`e.what()` can produce an exception\
    \ message. `e` is an exception object.\n\n### Example 8.10\n\n```cpp\n#include\
    \ <stdexcept>\n#include <iostream>\nusing namespace std;\nint main () {\n    string\
    \ str = \"JavaScript\";\n    try {\n        str.at(100);\n    }\n    catch(exception\
    \ &e) { // e is an exception object\n        cout << \"Catch an exception: \"\
    \ << e.what() << endl; // “e.what()” creates an exception message.\n    }\n  \
    \  return 0;\n}\n```\n\n**Output:**\n```\nCatch an exception: basic_string::at:......\n\
    ```\n\n**Explanation:**\n`catch(exception &e)` can catch an exception. Note that\
    \ its parameter is `&e`, which means that the value of `e` can return to the exception\
    \ object. `e` is an exception object. `e.what()` produces an exception message.\n\
    \n## Throw Exception\n\nWe can set the code to throw an exception in the place\
    \ where the exception may occur.\n\n```cpp\ntry {\n    // throw... // throw an\
    \ exception\n}\ncatch {\n    //\n}\n```\n\n`throw` can throw out an exception\
    \ based on our setting.\n\n### Example 8.11\n\n```cpp\n#include <stdexcept>\n\
    #include <iostream>\nusing namespace std;\nint main () {\n    try {\n        int\
    \ x = 100, y = 0;\n        if( y == 0 ) {\n            throw y; // we can set\
    \ \"throw out an exception\" in here\n        }\n        x = x / y;\n    }\n \
    \   catch (int e) { // catch and handle the exception\n        cout << \"An exception\
    \ occurred.\" << endl;\n        cout << \"The number is divided by \" << e ;\n\
