    Yellow and Green.


    Note that index begins from 0.


    ### Array Size


    We can get the size of an array by using "sizeof" and dividing it by the size
    of one element of the array. The syntax is:


    | size = sizeof(array) / sizeof(element) |


    Example 3.3


    | #include <iostream>using namespace std;int main() {int arr[ ] = {10, 11, 12,
    13, 14, 15}; // define an arrayint size = sizeof(arr) / sizeof(arr[0]); // get
    the size   cout << "The size of the array is: " << size;   return 0;} |


    Output:      


    The size of the array is: 6


    Explanation:


    “sizeof(arr) / sizeof(arr[0])” is used to get the size of the array.


