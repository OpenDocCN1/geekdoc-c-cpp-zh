    Save, Compile, and Run the Program.\n\nOutput:\nHello World!\n\nExplanation:\n\
    - `int main( )` is a required main function in C++ programs.\n- `cout << \"Hello\
    \ World!\" << endl;` displays `\"Hello World!\"`.\n\n## Output Commands\n\n- `cout\
    \ << “ ”;` print the result in the same line.\n- `cout << “ ” << endl;` print\
    \ the result in the different line.\n\n### Example 1.4\n\n```cpp\ncout << \" 1\
    \ \"; // output in the same line\ncout << \" 2 \";\ncout << \" 3 \";\n```\nOutput:\
    \ 1 2 3\n\n```cpp\ncout << \" 1 \" << endl ; // output in the different line\n\
    cout << \" 2 \" << endl ;\ncout << \" 3 \" << endl ;\n```\nOutput:\n1\n2\n3\n\n\
    Explanation:\n- `cout << “ ”` prints the result in the same line.\n--cout << “\
    \ ” << endl` prints the result in the different line.\n\n## Escaping Characters\n\
    \nThe `\\` backslash character can be used to escape characters.\n\n- `\\n` outputs\
