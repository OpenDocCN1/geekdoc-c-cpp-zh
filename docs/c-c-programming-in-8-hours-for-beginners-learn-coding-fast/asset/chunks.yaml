    **解释：** `(a>b)` 是测试表达式，即 `(200>100)`，如果返回真，将执行 `{ }` 内部的代码；如果返回假，则不执行 `{ }` 内部的代码。\n\
    \n### If-else 语句\n`if...else 语句` 在条件为真时运行某些代码，在条件为假时运行另一部分代码。\n\n```cpp\nif (\
    \ test-expression) { // 如果为真则执行此操作; }else { // 如果为假则执行此操作; }\n```\n\n**示例 2.2**\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n    int a =\
    \ 100; \n    int b = 200;\n    if (a > b) { // 如果为真则执行此操作;\n      cout << \"a\
    \ is greater than b.\";\n    }else { // 如果为假则执行此操作;\n      cout << \"a less than\
    \ b\";\n    }\n    return 0;\n}\n```\n**输出：**\n```\na less than b.\n```\n**解释：**\
    \ `(a>b)` 是测试表达式，即 `(100>200)`，如果返回真，将输出 `\"a is greater than b.\"`；如果返回假，将输出\
    \ `\"a less than b\"`。\n\n### Switch 语句\n```cpp\nswitch ( variable ){\n  case\
    \ 1: 匹配 1，执行此操作;\n  case 2: 匹配 2，执行此操作;\n  case 3: 匹配 3，执行此操作;\n  default : 匹配任意，执行默认操作;\n\
    }\n```\n`variable` 的值将与每个 `case` 进行比较，如果匹配某个 `case`，将执行该 `case` 代码。`break` 终止代码。\n\
    \n**示例 2.3**\n```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n\
    \    int number = 20;\n    switch ( number ) {\n      case 10 : cout << \"Running\
    \ case 10 \\n\";\n      case 20 : cout << \"Running case 20 \\n\";\n      case\
    \ 30 : cout << \"Running case 30 \\n\";\n      default : cout << \"Running default\
    \ \\n\";\n    }\n    return 0;\n}\n```\n**输出：**\n```\nRunning case 20\n```\n**解释：**\
    \ `number` 为 `20`；匹配 `case 20`，因此执行该代码。\n\n### For 循环\n`for 循环` 按指定的次数运行代码块。\n\
    \n**示例 2.4**\n```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n\
    \    int x;\n    for (x = 0; x <= 5; x++){ // 重复 5 次\n      cout << x;\n    }\n\
    \    return 0;\n}\n```\n**输出：**\n```\n012345\n```\n**解释：** `x = 0` 是初始化，`x <=\
    \ 5` 是测试表达式，代码最多运行 6 次。`x++` 意味着每次循环 `x` 增加。结束后，代码输出 `012345`。\n\n### While 循环\n\
    `while 循环` 当指定条件为真时循环代码块。\n\n**示例 2.5**\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main( ) {\n    int counter = 0;\n    while (counter < 8){ // 8 次\n\
    \      cout << \"&\";\n      counter++; // 增加\n    }\n    return 0;\n}\n```\n\
    **输出：**\n```\n&&&&&&\n```\n**解释：** `counter < 8` 是测试表达式，如果条件为真，代码将循环 8 次，直到 `counter`\
    \ 变为 `8`，此时条件为假，代码停止运行。\n\n### Do-While 循环\n`do...while` 先循环一次代码块，然后如果指定条件为真则重复循环。`do…while`\
    \ 在检查条件之前运行代码。\n\n**示例 2.6**\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main( ) {\n    int counter = 0;\n    do { // 在条件前运行代码\n      cout << \"@\"\
    ;\n      counter++;\n    } while (counter < 8); // 8 次\n    return 0;\n}\n```\n\
    **输出：**\n```\n@@@@@@@\n```\n**解释：** `counter < 8` 是测试表达式，如果条件为真，代码将循环 8 次，直到 `counter`\
    \ 变为 `8`，此时条件为假，代码停止运行。\n\n### Break 语句\n`break` 关键字用于根据条件停止循环运行。\n\n**示例 2.7**\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n    int num\
    \ = 0;\n    while ( num < 10 ){\n      if ( num == 5 ) break; // 跳出当前的 while 循环\n\
    \      num++;\n    }\n    cout << num ;\n    return 0;\n}\n```\n**输出：**\n```\n\
    5\n```\n**解释：** `if(num==5) break;` 是一个 break 语句。如果 `num` 为 `5`，程序将运行 `break`\
    \ 命令，break 语句退出循环，然后运行 `cout << num`。\n\n### Continue 语句\n`continue` 关键字用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n\
    \n**示例 2.8**\n```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n\
    \    int num = 0;\n    while ( num < 10 ){\n      num++;\n      if ( num == 5\
    \ ) continue; // 进入下一个 while 循环\n      cout << num ; // 如果 num 为 5，跳过这段代码\n  \
    \  }\n    return 0;\n}\n```\n**输出：**\n```\n1234678910\n```\n**解释：** 注意输出中没有 `5`。`if(num==5)\
    \ continue;` 包含了 continue 命令。当 `num` 为 `5` 时，程序将运行 `continue`，跳过下一个命令 `cout <<\
    \ num `，然后继续下一次循环。\n\n### If ( 条件 )\n在 `if 语句` 中，“条件”不仅可以是一个测试表达式，也可以是一个单一变量。例如：`if(x)`,\
    \ `if(y)`。\n\n**示例 2.9**\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main( ) {\n    int x = 100;\n    char y = 'W';\n    if ( x ) { // 条件 (x) 是单个变量，可以！\n\
    \      cout << x ;\n    }\n    if ( y ){ // 条件 (y) 是单个变量，可以！\n      cout << y\
    \ ;\n    }\n    return 0;\n}\n```\n**输出：**\n```\n100 W\n```\n**解释：** `if( x )`\
    \ 和 `if( y )` 是正确的代码，因为在 `if 语句` 中，`(条件)` 不仅可以是一个测试表达式，也可以是一个单一变量。\n\n"
