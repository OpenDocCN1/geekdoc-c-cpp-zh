    | Visual Studio | [`www.visualstudio.com`](https://www.visualstudio.com/en-us/products/visual-studio-express-vs.aspx)\
    \ |\n\n`Dev C++` 适合初学者；因此我们本书中使用 `Dev C++` 作为编译器。\n\n## DEV C++\n\n1. `Dev C++`\
    \ 的下载地址是：[`sourceforge.net/projects/embarcadero-devcpp/`](https://sourceforge.net/projects/embarcadero-devcpp/)\n\
    \n![](img/image00289.jpeg)\n\n2. 下载安装程序后，请安装 `DEV C++`。\n\n![](img/image00290.jpeg)\n\
    \n3. 点击 `OK` 按钮，开始安装。\n\n![](img/image00291.jpeg)\n\n4. 点击 `Finish` 按钮完成安装。\n\n\
    ##  Dev C++\n\n1. 启动 `Dev C++`，我们可以看到如下编辑器：\n\n![](img/image00292.jpeg)\n\n2.\
    \ 在 `Dev C++` 中，我们可以点击 `File` > `New` > `Source File`，并将 C++ 代码输入编辑器如下所示：\n\n\
    ![](img/image00293.jpeg)\n\n将文件保存为 `helloworld.cpp`。\n\n3. 在 `Dev C++` 中，我们可以点击\
    \ `Execute` > `Compile & Run`。我们可以看到输出：`\"Hello World!\"`。\n\n![](img/image00294.jpeg)\n\
    \n这是一个 C++ 程序示例：\n\n### 示例 1.1\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    cout << \"Hello World!\" << endl;\n    return 0;\n}\n\
    ```\n\n输出：\nHello World!\n\n解释：\n- `#include <iostream>` 表示包含一个名为 `iostream` 的输入输出库，有助于输入或输出操作。\n\
    - `using namespace std` 表示 `std` 是一个标准命名空间，可以解决命名冲突问题。\n- `int` 是返回类型，指定了函数的返回类型。\n\
    - `main( )` 是一个强制的函数，用于运行 C++ 的主代码。\n- `cout <<` 显示或输出内容。\n- `return 0` 表示程序运行完全。\n\
    \n### C++ 注释\n\nC++ 注释用于解释当前代码，描述这段代码在做什么。C++ 编译器会忽略注释。\n\n- `///* …… */` 用于多行注释。\n\
    - `//` 用于单行注释。\n- `/*...*/` 用于多行注释。\n\n### 示例 1.3\n\n```cpp\ncout << “Hello World”\
    \ ; // 显示 “Hello World”/* 这里是多行注释\"cout <<   是一个一个 C++ 输出命令，意味着显示或打印.*/\n```\n\
    \n解释：\n- `// show \"Hello World\"` 是一个单行注释。\n- `/* …… */` 是一个多行注释。\n\n注意：每个 C++\
    \ 命令都以分号 `;` 结束。\n\n## 第一次编程\n\nHello World!\n\n在你喜爱的编辑器中编写 C++ 代码。\n\n```cpp\n\
    #include <iostream> // 包含输入输出库\nusing namespace std; // “std” 是一个标准命名空间\nint main()\
    \ { // 运行程序的起点\n    cout << \"Hello World!\" << endl; // 输出\n    return 0; //\
    \ “return 0” 表示成功\n}\n```\n\n保存、编译并运行程序。\n\n输出：\nHello World!\n\n解释：\n- `int main(\
    \ )` 是 C++ 程序中必须的 main 函数。\n- `cout << \"Hello World!\" << endl;` 显示 `\"Hello\
    \ World!\"`。\n\n## 输出命令\n\n- `cout << “ ”;` 在同一行内打印结果。\n- `cout << “ ” << endl;`\
    \ 在不同行内打印结果。\n\n### 示例 1.4\n\n```cpp\ncout << \" 1 \"; // 在同一行输出\ncout << \" 2\
    \ \";\ncout << \" 3 \";\n```\n输出：1 2 3\n\n```cpp\ncout << \" 1 \" << endl ; //\
    \ 在不同行输出\ncout << \" 2 \" << endl ;\ncout << \" 3 \" << endl ;\n```\n输出：\n1\n\
    2\n3\n\n解释：\n- `cout << “ ”` 在同一行打印结果。\n- `cout << “ ” << endl` 在不同行打印结果。\n\n\
    ## 转义字符\n\n`\\` 反斜杠字符可以用于转义字符。\n\n- `\\n` 输出内容到下一新行。\n- `\\r` 产生返回。\n- `\\t` 产生制表符（tab）。\n\
    - `\\'` 输出单引号。\n- `\\\"` 输出双引号。\n\n### 示例 1.5\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main( ) {\n    cout << \" \\\" Hello World! \\\"\";\
    \ // \\\" 转义双引号\n    return 0;\n}\n```\n输出：“Hello World!”\n\n解释：\n- `\\\"` 转义双引号。注意\
    \ `\"Hello World\"` 本身带有一个双引号。另一个示例：\n`cout << “Hello \\t\\t\\t World” ; // 注意它有三个制表符`\n\
    输出：Hello     World\n\n## C++ 关键字\n\n某些单词仅供 C++ 语言本身使用。在为变量、函数和标签选择标识符名称时，可能无法使用。以下是关键字：\n\
    \n| `asm` | `auto` | `break` |\n| `char` | `class` | `case` |\n| `continue` |\
    \ `default` | `catch` |\n| `double` | `else` | `enum` |\n| `friend` | `goto` |\
    \ `if` |\n| `inline` | `int` | `long` |\n| `private` | `public` | `return` |\n\
    | `static` | `switch` | `this` |\n| `typedef` | `throw` | `union` |\n| `unsigned`\
    \ | `virtual` | `void` |\n| `while` | | |\n\n| 数据类型 |\n\n| `char` | 字符 |\n| `int`\
    \ | 整数 |\n| `float` | 浮点型 |\n| `double` | 浮点型 |\n| `bool` | 布尔 |\n\n### 创建变量\n\
    \n`dataType = value;` 创建变量。\n\n### 示例 1.8\n\n```cpp\nbool x=true;\nbool y=false;\n\
    bool a = x && y;\n```\n\n## 算术运算符\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `+` | 加\
    \ |\n| `-` | 减 |\n| `*` | 乘 |\n| `/` | 除 |\n| `%` | 取模 |\n| `++` | 增加 1 |\n| `--`\
    \ | 减少 1 |\n\n### 示例 1.9\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main( ) {\n    int a = 200, b = 100;\n    int sum = a + b;\n    cout << sum<<\
    \ endl;\n    int divi = a / b;\n    cout << divi<< endl;\n    int modu = a % b;\n\
    \    cout << modu<< endl;\n    cout << ++a << endl;\n    return 0;\n}\n```\n输出：\n\
    300\n2\n0\n201\n\n解释：\n- `int sum = a + b` 意味着 100 加 200。\n- `int divi = a / b`\
    \ 意味着 200 除 100。\n- `int modu = a % b` 意味着 200 取模 100。\n- `++a` 将其值增加 1。\n\n##\
