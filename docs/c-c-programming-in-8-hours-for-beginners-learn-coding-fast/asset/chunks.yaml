    ## Chapter 1


    ### What is C++ ?


    C++ is a general-purpose programming language, which is an extension of the C
    language.


    C++ is developed from the C language.


    The C language was invented by `D. M. Ritchie` of `bell LABS` in `1972`. It is
    not designed for beginners at first, but for computer professionals. With the
    scale of software increases, `C` is no longer suitable for the needs of computer
    development. It cannot handle complex and large tasks.


    ### C++ Compilers & Editors


    Many C++ compilers and editors (IDE) can be free download on the internet.


    Download and Install one of the IDEs:


    | IDE | LINK |

    | :--- | :--- |

    | Dev C++ | `http://www.bloodshed.net` |

    | CLion | `https://www.jetbrains.com/clion/` |

    | Codelite | `https://codelite.org/` |

