    int > myVector(1); // create a vector with 1 element.myVector.push_back(20); //  add
    an element 20 to the endmyVector.push_back(30); //  add an element 30 to the endcout<<
    "myVector size: " << myVector.size( ) << endl;// gets the number of elementscout<<
    "The third element: " << myVector.at(2) << endl;// gets the value at index 2myVector.pop_back(
    );//  removes the final elementcout<< "Final element has been removed."<< endl;return
