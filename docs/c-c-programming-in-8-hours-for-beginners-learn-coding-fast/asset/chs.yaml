- "# C++：8 小时学会 C++ 编程，初学者指南，快速学习编码\n\n\n\n\n\n## 关于本书\n\n“8 小时精通 C++”是一本为高中生和大学生编写的教科书；它涵盖了所有核心\
  \ C++ 语言知识。你可以快速、轻松地学习 C++ 编程的完整基础技能。\n\n本教材包含了许多针对初者的实用示例，并包含了适用于大学期末考试、工程师认证考试和工作面试的练习。\n\
  \n“8 小时精通 C++”是一本对初学者非常有用的教材。直观的定义、通俗示例、详尽的解释以及整洁的布局是这本有益且教育意义的书的特点。你会被它独特且严谨的写作风格所吸引。阅读这本书是一种极大的享受！\n\
  \n## 免责声明\n\n本书仅适用于编程初学者、高中生和大学生；不适用于有经验的程序员。\n\n## 源代码可用\n\n本书提供了源代码供参考；你可以参考源代码以获得更好的学习，或者将源代码复制到你喜爱的编辑器中测试程序。\n\
  \n\n## 第一章\n\n### 什么是 C++？\n\nC++ 是一种通用的编程语言，是 C 语言的扩展。\n\nC++ 是从 C 语言开发的。\n\nC\
  \ 语言是由 `bell LABS` 的 `D. M. Ritchie` 在 `1972` 年发明的。它最初并不是为初学者设计的，而是为了计算机专业人士。随着软件规模的扩大，`C`\
  \ 语言不再 way 计算机开发的需求。它无法处理复杂的大型任务。\n\n### C++ 编译器与编辑器\n\n许多 C++ 编译器和编辑器（IDE）可以在互联网上免费下载。\n\
  \n下载并安装一个 IDE：\n\n| IDE | 链接 |\n| :--- | :--- |\n| Dev C++ | `http://www.bloodshed.net`\
  \ |\n| CLion | `https://www.jetbrains.com/clion/` |\n| Codelite | `https://codelite.org/`\
  \ |\n\n\n\n\n\n| Eclipse | [`www.eclipse.org/ide/`](https://www.eclipse.org/ide/)\
  \ |\n| Visual Studio | [`www.visualstudio.com`](https://www.visualstudio.com/en-us/products/visual-studio-express-vs.aspx)\
  \ |\n\n`Dev C++` 适合初学者；因此我们本书中使用 `Dev C++` 作为编译器。\n\n## DEV C++\n\n1. `Dev C++`\
  \ 的下载地址是：[`sourceforge.net/projects/embarcadero-devcpp/`](https://sourceforge.net/projects/embarcadero-devcpp/)\n\
  \n![](img/image00289.jpeg)\n\n2. 下载安装程序后，请安装 `DEV C++`。\n\n![](img/image00290.jpeg)\n\
  \n3. 点击 `OK` 按钮，开始安装。\n\n![](img/image00291.jpeg)\n\n4. 点击 `Finish` 按钮完成安装。\n\n\
  ##  Dev C++\n\n1. 启动 `Dev C++`，我们可以看到如下编辑器：\n\n![](img/image00292.jpeg)\n\n2. 在\
  \ `Dev C++` 中，我们可以点击 `File` > `New` > `Source File`，并将 C++ 代码输入编辑器如下所示：\n\n![](img/image00293.jpeg)\n\
  \n将文件保存为 `helloworld.cpp`。\n\n3. 在 `Dev C++` 中，我们可以点击 `Execute` > `Compile & Run`。我们可以看到输出：`\"\
  Hello World!\"`。\n\n![](img/image00294.jpeg)\n\n这是一个 C++ 程序示例：\n\n### 示例 1.1\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    cout << \"\
  Hello World!\" << endl;\n    return 0;\n}\n```\n\n输出：\nHello World!\n\n解释：\n- `#include\
  \ <iostream>` 表示包含一个名为 `iostream` 的输入输出库，有助于输入或输出操作。\n- `using namespace std` 表示\
  \ `std` 是一个标准命名空间，可以解决命名冲突问题。\n- `int` 是返回类型，指定了函数的返回类型。\n- `main( )` 是一个强制的函数，用于运行\
  \ C++ 的主代码。\n- `cout <<` 显示或输出内容。\n- `return 0` 表示程序运行完全。\n\n### C++ 注释\n\nC++ 注释用于解释当前代码，描述这段代码在做什么。C++\
  \ 编译器会忽略注释。\n\n- `///* …… */` 用于多行注释。\n- `//` 用于单行注释。\n- `/*...*/` 用于多行注释。\n\n###\
  \ 示例 1.3\n\n```cpp\ncout << “Hello World” ; // 显示 “Hello World”/* 这里是多行注释\"cout\
  \ <<   是一个一个 C++ 输出命令，意味着显示或打印.*/\n```\n\n解释：\n- `// show \"Hello World\"` 是一个单行注释。\n\
  - `/* …… */` 是一个多行注释。\n\n注意：每个 C++ 命令都以分号 `;` 结束。\n\n## 第一次编程\n\nHello World!\n\n\
  在你喜爱的编辑器中编写 C++ 代码。\n\n```cpp\n#include <iostream> // 包含输入输出库\nusing namespace std;\
  \ // “std” 是一个标准命名空间\nint main() { // 运行程序的起点\n    cout << \"Hello World!\" << endl;\
  \ // 输出\n    return 0; // “return 0” 表示成功\n}\n```\n\n保存、编译并运行程序。\n\n输出：\nHello World!\n\
  \n解释：\n- `int main( )` 是 C++ 程序中必须的 main 函数。\n- `cout << \"Hello World!\" << endl;`\
  \ 显示 `\"Hello World!\"`。\n\n## 输出命令\n\n- `cout << “ ”;` 在同一行内打印结果。\n- `cout << “\
  \ ” << endl;` 在不同行内打印结果。\n\n### 示例 1.4\n\n```cpp\ncout << \" 1 \"; // 在同一行输出\ncout\
  \ << \" 2 \";\ncout << \" 3 \";\n```\n输出：1 2 3\n\n```cpp\ncout << \" 1 \" << endl\
  \ ; // 在不同行输出\ncout << \" 2 \" << endl ;\ncout << \" 3 \" << endl ;\n```\n输出：\n\
  1\n2\n3\n\n解释：\n- `cout << “ ”` 在同一行打印结果。\n- `cout << “ ” << endl` 在不同行打印结果。\n\n\
  ## 转义字符\n\n`\\` 反斜杠字符可以用于转义字符。\n\n- `\\n` 输出内容到下一新行。\n- `\\r` 产生返回。\n- `\\t` 产生制表符（tab）。\n\
  - `\\'` 输出单引号。\n- `\\\"` 输出双引号。\n\n### 示例 1.5\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main( ) {\n    cout << \" \\\" Hello World! \\\"\"; // \\\"\
  \ 转义双引号\n    return 0;\n}\n```\n输出：“Hello World!”\n\n解释：\n- `\\\"` 转义双引号。注意 `\"\
  Hello World\"` 本身带有一个双引号。另一个示例：\n`cout << “Hello \\t\\t\\t World” ; // 注意它有三个制表符`\n\
  输出：Hello     World\n\n## C++ 关键字\n\n某些单词仅供 C++ 语言本身使用。在为变量、函数和标签选择标识符名称时，可能无法使用。以下是关键字：\n\
  \n| `asm` | `auto` | `break` |\n| `char` | `class` | `case` |\n| `continue` | `default`\
  \ | `catch` |\n| `double` | `else` | `enum` |\n| `friend` | `goto` | `if` |\n| `inline`\
  \ | `int` | `long` |\n| `private` | `public` | `return` |\n| `static` | `switch`\
  \ | `this` |\n| `typedef` | `throw` | `union` |\n| `unsigned` | `virtual` | `void`\
  \ |\n| `while` | | |\n\n| 数据类型 |\n\n| `char` | 字符 |\n| `int` | 整数 |\n| `float` |\
  \ 浮点型 |\n| `double` | 浮点型 |\n| `bool` | 布尔 |\n\n### 创建变量\n\n`dataType = value;`\
  \ 创建变量。\n\n### 示例 1.8\n\n```cpp\nbool x=true;\nbool y=false;\nbool a = x && y;\n\
  ```\n\n## 算术运算符\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `+` | 加 |\n| `-` | 减 |\n| `*`\
  \ | 乘 |\n| `/` | 除 |\n| `%` | 取模 |\n| `++` | 增加 1 |\n| `--` | 减少 1 |\n\n### 示例 1.9\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n    int a =\
  \ 200, b = 100;\n    int sum = a + b;\n    cout << sum<< endl;\n    int divi = a\
  \ / b;\n    cout << divi<< endl;\n    int modu = a % b;\n    cout << modu<< endl;\n\
  \    cout << ++a << endl;\n    return 0;\n}\n```\n输出：\n300\n2\n0\n201\n\n解释：\n-\
  \ `int sum = a + b` 意味着 100 加 200。\n- `int divi = a / b` 意味着 200 除 100。\n- `int\
  \ modu = a % b` 意味着 200 取模 100。\n- `++a` 将其值增加 1。\n\n## 逻辑运算符\n\n| 运算符 | 等价 |\n\
  | :--- | :--- |\n| `&&` | 和 |\n| `||` | 或 |\n| `!` | 非 |\n\n使用逻辑运算符后，结果将为真或假。“1”代表真，“0”代表假。\n\
  \n### 示例 1.10\n\n```cpp\nbool x=true;\nbool y=false;\nbool a= x && y;\ncout << a\
  \ << endl; // 输出: 0\nbool b=x || y;\ncout << b << endl; // 输出: 1\nbool c=! x;\n\
  cout << c << endl; // 输出: 0\n```\n\n## 赋值运算符\n\n| 运算符 | 示例 | 解释 |\n| :--- | :---\
  \ | :--- |\n| `+=` | `x += y` | `x = x + y` |\n| `-=` | `x -= y` | `x = x - y` |\n\
  | `*=` | `x *= y` | `x = x * y` |\n| `/=` | `x /= y` | `x = x / y` |\n| `%=` | `x\
  \ %= y` | `x = x % y` |\n\n\n\n\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main( ){\n    int x=200; \n    int y=100;\n    cout <<\"200+=100 equals\
  \ \" << (x+=y)<< endl;\n    cout <<\"300-=100 equals \" << (x-=y)<< endl;\n    cout\
  \ <<\"200*=100 equals \" << (x*=y)<< endl;\n    cout <<\"20000%=100 equals \"<<\
  \ (x%=y)<< endl;\n    return 0;\n}\n```\n\n**输出：**\n```\n200+=100 equals 300\n300-=100\
  \ equals 200\n200*=100 equals 20000\n20000%=100 equals 0\n```\n\n**解释：**\n- `x+=y;`\
  \ // `x=x+y`, `x=200+100`, 输出 `300`。\n- `x-=y;` // `x=x-y`, `x=300-100`, 输出 `200`。\n\
  - `x*=y;` // `x=x*y`, `x=200*100`, 输出 `20000`。\n- `x%y;` // `x=%y`, `x=200000%100`,\
  \ 输出 `0`。\n\n### 比较运算符\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `>` | 大于 |\n| `<` | 小于\
  \ |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==` | 等于 |\n| `!=` | 不等于 |\n\n使用比较运算符后，结果将为真（true）或假（false）。\n\
  在 C++ 中：`\"1\"` 代表真。`\"0\"` 代表假。\n\n**示例 1.12**\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main( ) {\n    int x=200; \n    int y=100;\n    bool result1\
  \ = (x>y); \n    cout << result1<< endl;\n    bool result2 = (x<=y); \n    cout\
  \ << result2<< endl;\n    bool result3 = (x!=y ); \n    cout << result3 << endl;\n\
  \    return 0;\n}\n```\n**输出：**\n```\n1\n0\n1\n```\n**解释：**\n- `\"1\"` 代表真。\n- `\"\
  0\"` 代表假。\n- `x>y` // 测试 `200>100`, 输出为真。\n- `x<=y` // 测试 `200<=100`, 输出为假。\n- `x!=y`\
  \ // 测试 `200!=100`, 输出为真。\n\n### 练习：计算\n\n#### 计算\n在你喜爱的编辑器中编写 C++ 代码。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main(){\n    int a=10, b=20, c=30;\
  \ // 定义三个变量\n    int sum; // 定义一个变量 \n    sum = a + b * c; // 计算\n    cout << \"\
  a+b*c = \"<< sum << endl; // 输出\n    return 0; // 运行完毕\n}\n```\n**输出：**\n```\na+b*c\
  \ = 610\n```\n**解释：**\n- `\"#include <iostream>\"` 包含了名为 `iostream` 的输入输出库，有助于输入或输出操作。\n\
  - `\"using namespace std\"` 意味着 `\"std\"` 是一个标准空间，可以解决命名冲突问题。\n- `\"int\"` 是一种返回类型，指定函数的返回类型。\n\
  - `main()` 是一个必须的函数，运行 C++ 的主代码。\n- `int a=10, b=20, c=30;` 初始化三个变量 `a`、`b`、`c`。\n\
  - `sum = a + b * c;` 是一个表达式，将结果赋值给 `\"sum\"`。\n- `cout <<` 显示或输出内容。\n- `return 0`\
  \ 表示程序运行完毕。\n\n## 第 2 章\n\n### If 语句\n`if 语句` 仅在指定条件为真时执行 `{ … }` 内部的代码；如果条件为假，则不执行\
  \ `{…}` 内部的任何代码。\n\n```cpp\nif ( test-expression ) { // 如果为真则执行此操作; }\n```\n\n**示例\
  \ 2.1**\n```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n    int\
  \ a=200;\n    int b=100;\n    if (a>b){ // 如果为真则执行此操作;\n      cout << \"a is greater\
  \ than b.\";\n    }\n    return 0;\n}\n```\n**输出：**\n```\na is greater than b.\n\
  ```\n**解释：** `(a>b)` 是测试表达式，即 `(200>100)`，如果返回真，将执行 `{ }` 内部的代码；如果返回假，则不执行 `{ }`\
  \ 内部的代码。\n\n### If-else 语句\n`if...else 语句` 在条件为真时运行某些代码，在条件为假时运行另一部分代码。\n\n```cpp\n\
  if ( test-expression) { // 如果为真则执行此操作; }else { // 如果为假则执行此操作; }\n```\n\n**示例 2.2**\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n    int a = 100;\
  \ \n    int b = 200;\n    if (a > b) { // 如果为真则执行此操作;\n      cout << \"a is greater\
  \ than b.\";\n    }else { // 如果为假则执行此操作;\n      cout << \"a less than b\";\n   \
  \ }\n    return 0;\n}\n```\n**输出：**\n```\na less than b.\n```\n**解释：** `(a>b)` 是测试表达式，即\
  \ `(100>200)`，如果返回真，将输出 `\"a is greater than b.\"`；如果返回假，将输出 `\"a less than b\"\
  `。\n\n### Switch 语句\n```cpp\nswitch ( variable ){\n  case 1: 匹配 1，执行此操作;\n  case\
  \ 2: 匹配 2，执行此操作;\n  case 3: 匹配 3，执行此操作;\n  default : 匹配任意，执行默认操作;\n}\n```\n`variable`\
  \ 的值将与每个 `case` 进行比较，如果匹配某个 `case`，将执行该 `case` 代码。`break` 终止代码。\n\n**示例 2.3**\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n    int number\
  \ = 20;\n    switch ( number ) {\n      case 10 : cout << \"Running case 10 \\n\"\
  ;\n      case 20 : cout << \"Running case 20 \\n\";\n      case 30 : cout << \"\
  Running case 30 \\n\";\n      default : cout << \"Running default \\n\";\n    }\n\
  \    return 0;\n}\n```\n**输出：**\n```\nRunning case 20\n```\n**解释：** `number` 为 `20`；匹配\
  \ `case 20`，因此执行该代码。\n\n### For 循环\n`for 循环` 按指定的次数运行代码块。\n\n**示例 2.4**\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main( ) {\n    int x;\n    for (x\
  \ = 0; x <= 5; x++){ // 重复 5 次\n      cout << x;\n    }\n    return 0;\n}\n```\n\
  **输出：**\n```\n012345\n```\n**解释：** `x = 0` 是初始化，`x <= 5` 是测试表达式，代码最多运行 6 次。`x++`\
  \ 意味着每次循环 `x` 增加。结束后，代码输出 `012345`。\n\n### While 循环\n`while 循环` 当指定条件为真时循环代码块。\n\
  \n**示例 2.5**\n```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n\
  \    int counter = 0;\n    while (counter < 8){ // 8 次\n      cout << \"&\";\n \
  \     counter++; // 增加\n    }\n    return 0;\n}\n```\n**输出：**\n```\n&&&&&&\n```\n\
  **解释：** `counter < 8` 是测试表达式，如果条件为真，代码将循环 8 次，直到 `counter` 变为 `8`，此时条件为假，代码停止运行。\n\
  \n### Do-While 循环\n`do...while` 先循环一次代码块，然后如果指定条件为真则重复循环。`do…while` 在检查条件之前运行代码。\n\
  \n**示例 2.6**\n```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n\
  \    int counter = 0;\n    do { // 在条件前运行代码\n      cout << \"@\";\n      counter++;\n\
  \    } while (counter < 8); // 8 次\n    return 0;\n}\n```\n**输出：**\n```\n@@@@@@@\n\
  ```\n**解释：** `counter < 8` 是测试表达式，如果条件为真，代码将循环 8 次，直到 `counter` 变为 `8`，此时条件为假，代码停止运行。\n\
  \n### Break 语句\n`break` 关键字用于根据条件停止循环运行。\n\n**示例 2.7**\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main( ) {\n    int num = 0;\n    while ( num < 10 ){\n\
  \      if ( num == 5 ) break; // 跳出当前的 while 循环\n      num++;\n    }\n    cout <<\
  \ num ;\n    return 0;\n}\n```\n**输出：**\n```\n5\n```\n**解释：** `if(num==5) break;`\
  \ 是一个 break 语句。如果 `num` 为 `5`，程序将运行 `break` 命令，break 语句退出循环，然后运行 `cout << num`。\n\
  \n### Continue 语句\n`continue` 关键字用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n\n**示例 2.8**\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main( ) {\n    int num = 0;\n   \
  \ while ( num < 10 ){\n      num++;\n      if ( num == 5 ) continue; // 进入下一个 while\
  \ 循环\n      cout << num ; // 如果 num 为 5，跳过这段代码\n    }\n    return 0;\n}\n```\n**输出：**\n\
  ```\n1234678910\n```\n**解释：** 注意输出中没有 `5`。`if(num==5) continue;` 包含了 continue 命令。当\
  \ `num` 为 `5` 时，程序将运行 `continue`，跳过下一个命令 `cout << num `，然后继续下一次循环。\n\n### If ( 条件\
  \ )\n在 `if 语句` 中，“条件”不仅可以是一个测试表达式，也可以是一个单一变量。例如：`if(x)`, `if(y)`。\n\n**示例 2.9**\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n    int x = 100;\n\
  \    char y = 'W';\n    if ( x ) { // 条件 (x) 是单个变量，可以！\n      cout << x ;\n    }\n\
  \    if ( y ){ // 条件 (y) 是单个变量，可以！\n      cout << y ;\n    }\n    return 0;\n}\n\
  ```\n**输出：**\n```\n100 W\n```\n**解释：** `if( x )` 和 `if( y )` 是正确的代码，因为在 `if 语句`\
  \ 中，`(条件)` 不仅可以是一个测试表达式，也可以是一个单一变量。\n\n\n\n\n\n```\n| (test-expression) ? (if-true-do-this)\
  \ : (if-false-do-this); |\n```\n\n`(test-expression)` 看起来像：`a<b, x!= y, m==n. 等.`\n\
  \n示例 2.10\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main( ) {\n\
  \    int a = 100; \n    int b =200;\n    string result = (a < b) ? \"apple\" : \"\
  banana\";\n    // (test-expression) ? (if-true-do-this) : (if-false-do-this);\n\
  \    cout << result << endl;\n    return 0;\n}\n```\n\n输出：`apple`\n\n解释：\n\n条件运算符使用\
  \ `(a<b)` 来测试“a”和“b”，因为“a”小于“b”，所以它是真的。因此，输出是“apple”。\n\n`return 0;` 表示程序完全运行完毕。\n\
  \n### 练习：求和\n\n#### for 循环程序\n\n在你喜爱的编辑器中编写 C++ 代码。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main(){\n    int sum = 0;\n    for (int n=1; n<=100; n++)\
  \ // 运行 100 次\n    sum += n; // sum = sum + n\n    cout << \"Sum = \" << sum <<\
  \ endl;\n    return 0;\n}\n```\n\n保存并运行程序。\n\n输出：`Sum = 5050`\n\n解释：\n\n`for (int\
  \ n=1; n<=100; n++)` 按指定的次数运行一个代码块。\n\n`n = 1` 将 `n` 初始化为 1。\n\n`n <= 100` 是一个 `test-expression`，代码最多运行\
  \ 100 次。\n\n`n++` 意味着 `n` 在每次循环中增加 1。\n\n`sum += n` 等于 `sum = sum + n`。\n\n`cout\
  \ << \"Sum = \" << sum << endl;` 显示 `sum` 的值。\n\n`return 0` 表示程序完全运行完毕。\n\n在 100\
  \ 次循环后，代码将输出 5050。\n\n## 第 3 章\n\n### 创建数组 (1)\n\n数组是一个变量，可以包含多个值。\n\n创建数组的第一种方法如下：\n\
  \n```cpp\nint array-name[ number] = {“value0”, “value1”, “value2”,…};\n```\n\n`number`\
  \ 表示数组元素的数量。\n\n示例 3.1\n\n```cpp\nint myarray[4] = { 10,20,30,40 }; // 创建数组\n```\n\
  \n解释：\n\n上述代码创建了一个名为“myarray”的数组，它有四个元素：\n\n`myarray[4]` 意味着 `myarray` 有 4 个元素。\n\
  \n第 1 个元素是 `myarray[0]`，值为 10。键（Key）是 0。\n\n第 2 个元素是 `myarray[1]`，值为 20。键是 1。\n\n\
  第 3 个元素是 `myarray[2]`，值为 30。键是 2。\n\n第 4 个元素是 `myarray[3]`，值为 40。键是 3。\n\n在数组中，Key\
  \ 的别名是“index（索引）”。Index 的别名是“key”。\n\n注意索引从 0 开始。\n\n### 创建数组 (2)\n\n数组是一个变量，可以包含多个值。\n\
  \n创建数组的第二种方法如下：\n\n```cpp\nint myarray [ number of elements ];\nint array-name[index0]\
  \ = “value1”;\nint array-name[index1] = “value1”;\nint array-name[index2] = “value2”;\n\
  ```\n\n示例 3.2\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main( ){\n\
  \    string color[3]; // 声明数组\n    color [0] = \"Red \"; // 给数组赋值\n    color [1]\
  \ = \"Yellow \";\n    color [2] = \"Green \";\n    cout<< color[0]<<color[1]<<color[2];\n\
  \    return 0;\n}\n```\n\n输出：`Red  Yellow Green `\n\n解释：\n\n上述代码创建了一个数组，数组名为“color”，它有三个元素：`color\
  \ [0]`、`color [1]`、`color [2]`。它的索引是 0, 1 和 2。它的值是 Red, Yellow 和 Green。\n\n注意索引从\
  \ 0 开始。\n\n### 数组大小\n\n我们可以通过使用 `sizeof` 并除以数组单个元素的大小来获取数组的大小。语法为：\n\n```cpp\nsize\
  \ = sizeof(array) / sizeof(element)\n```\n\n示例 3.3\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int arr[ ] = {10, 11, 12, 13, 14, 15}; //\
