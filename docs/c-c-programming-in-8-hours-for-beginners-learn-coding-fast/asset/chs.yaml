  `(float)` 可以将数据类型更改浮点数。\n`(string)` 可以将数据类型更改字符串。\n以此类推……\n\n### 练习：最大值\n\n获取数组中的最大元素。\n\
  \n在你最喜爱的编辑器中编写 C++ 代码。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
