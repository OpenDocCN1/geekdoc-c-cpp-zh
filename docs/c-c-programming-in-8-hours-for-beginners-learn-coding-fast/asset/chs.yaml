  \    Tint.c1= \"Red \";\n    Tint.c2 = \"Yellow \";\n    cout << Tint.c1 << endl;\
  \ // 对象 Tint 引用 c1\n    cout << Tint.c2 << endl; // 对象 Tint 引用 c2\n    Tint.brightness\
  \ ( ); // 对象 Tint 引用 brightness()\n    return 0;\n}\n```\n*(注：此处示例中的代码逻辑与输出描述似乎有出入，原文中\
  \ 5.4 的输出与代码逻辑略显混乱，翻译时保持了原文结构)*\n\n**输出：**\nc1=\"red\"; c2=\"yellow\"; \n\n\n\n\
  **解释：**\n`Color ( ) { c1=\"red\"; c2=\"yellow\"; }` 初始化了 `c1` 和 `c2`。\n\n### 析构函数\n\
  \n析构函数用于释放内存。\n\n```cpp\nclass ClassName\n~ClassName();\n```\n\n析构函数的名称与类名相同。\n\n\
  #### 示例 5.5\n\n```cpp\nclass Color {\n~Color();\n```\n\n**解释：**\n`~Color()`` 是析构函数。\n\
  \n### 继承\n\n基类可以被派生类继承。\n\n派生类可以继承基类的公有成员。\n\n```cpp\nclass Base { // 基类\npublic:\n\
  \    void display();\n};\nclass Derived: public Base { // 派生类继承基类\n};\n```\n\n###\
  \ 使用派生类\n\n派生类的对象可以访问基类的公有成员。\n\n#### 示例 5.6\n\n```cpp\n#include <string>\n#include\
  \ <iostream>\nusing namespace std;\nclass Computer { // 基类\npublic:\n    void display(\
  \ ){cout << \"Computer OK!\" << endl;};\n};\nclass Laptop: public Computer {}; //\
  \ 派生类\nint main( ){\n    Laptop Lt; // 派生类创建对象 Lt\n    Lt.display( ); // 调用基类方法\n\
