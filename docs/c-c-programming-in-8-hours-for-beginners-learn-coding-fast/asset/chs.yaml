  \ // 假设第一个元素是最大值\n    for(int n=1; n<5; n++) // 运行 5 次\n        if(arr[n] > max)\
  \ // 将最大值与当前元素比较\n            max = arr[n]; // 新的最大值替换旧的旧值\n    cout << \"Max Value\
  \ = \"<< max << endl;\n    return 0;\n}\n```\n\n保存并运行程序。\n\nOutput:\nMax Value =\
  \ 100\n\nExplanation:\n`int arr[5]= {20, -6, 0, 100, 78};` 创建了一个包含五个元素的数组。\n`int\
  \ max = arr[0];` 将值 `20` 赋值给变量 `max`。`arr[0]` 的值为 20。\n`arr[n]>max` 比较 `arr[n]`\
  \ 的值和 `max` 的值。\n`max=arr[n];` 获取最大值并赋值给 `max`。\n\n## 第 4 章\n\n### 字符串变量\n\n在使用字符串数据类型之前，应该先在文档中包含\
