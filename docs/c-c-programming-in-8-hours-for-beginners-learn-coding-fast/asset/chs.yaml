  \ 定义了一个字符串变量。\n`getline(cin, myString);` 用于输入包含空格的字符串。\n`cout << \"You have inputted:\
  \ \" << myString << endl;` 显示你输入的数据。\n\n## 第 5 章\n\n### 类定义\n\n类是对象的模板，并可以创建对象。类代表一类事物。对象代表一个具体的事物。\n\
  \n```cpp\nclass ClassName { // 定义一个类\npublic: // 指定访问权限\n    type variable; // 声明变量\n\
  \    type function-name( ) { }; // 声明一个方法\n};\n```\n\n#### 示例 5.1\n\n```cpp\nclass\
  \ Color { // 创建一个名为 Color 的类\npublic: // 指定访问权限\n    string c1, c2; // 声明两个成员变量\n\
  \    void brightness ( ) {  cout << \"blue\" <<endl; };  \n}; // 定义方法\n```\n\n**解释：**\
  \ 上述代码定义了一个名为 `Color` 的类，访问权限为 `public`，有两个名为 `c1`, `c2` 的变量和一个名为 `brightness` 的方法。\n\
  类中的变量和方法被称为 `members`（成员）。\n\n### 对象声明\n\n对象是类的实例。\n\n```cpp\nClassName ObjectName;\
  \ // 创建一个对象\nObject.variable; // 对象引用一个变量\nObject.method-name( ); // 对象引用一个方法\n\
  ```\n\n#### 示例 5.2\n\n```cpp\nColor Tint; // 创建一个名为 \"Tint\" 的对象\nTint.c1 = \"yellow\"\
  ;   // 对象 Tint 引用 c1\nTint.c2 = \"purple\"; // 对象 Tint 引用 c2\nTint.brightness (\
  \ ); // 对象 Tint 引用 brightness()\n```\n\n**解释：**\n`Color Tint;` 创建了一个名为 `Tint` 的对象，然后\
  \ `Tint` 引用变量 `c1` 和 `c2`。\n`Tint.brightness ( );` 意味着对象 `Tint` 引用方法 `brightness\
  \ ( );`。\n\n### 类与对象\n\n```cpp\nclass ClassName{  }; // 定义一个类\nClassName ObjectName;\
  \ // 创建一个对象\n```\n\n#### 示例 5.3\n\n```cpp\n#include<string>\n#include <iostream>\n\
  using namespace std;\nclass Color { // 定义一个名为 Color 的类\npublic: // 指定访问权限\n    string\
  \ c1, c2;\n    void brightness ( ) {  cout << \"Green\" <<endl; };\n};\nint main(\
  \ ) {\n    Color Tint; // 创建一个名为 \"Tint\" 的对象\n    Tint.c1= \"Red \";\n    Tint.c2\
  \ = \"Yellow \";\n    cout << Tint.c1 << endl; // 对象 Tint 引用 c1\n    cout << Tint.c2\
  \ << endl; // 对象 Tint 引用 c2\n    Tint.brightness ( ); // 对象 Tint 引用 brightness()\n\
  \    return 0;\n}\n```\n\n**输出：**\nRed\nYellow\nGreen\n\n**解释：**\n`class Color`\
  \ 定义了类 `Color`。\n`Color Tint;` 创建了对象 `Tint`。\n`Tint.c1` 意味着对象 `Tint` 引用变量 `c1`。\n\
  `Tint.brightness ( );` 意味着对象 `Tint` 调用了方法 `brightness( )`。\n\n### 构造函数\n\n构造函数用于初始化变量。构造函数的名称与类名相同。当对象被创建时，构造函数会被自动调用。\n\
  \n```cpp\nclass ClassName{\n  ClassName( ) {…} ; //这是一个构造函数\n};\n```\n\n`class ClassName{\
  \ ...}` 声明了一个类。\n`ClassName( ) {…}` 声明了一个构造函数。\n\n#### 示例 5.4\n\n```cpp\n#include<string>\n\
  #include <iostream>\nusing namespace std;\nclass Color {      // 创建一个名为 Color 的类\n\
  public:           // 指定访问权限\n    string c1, c2;\n    void brightness ( ) {  cout\
