  ### 数据类型转换\n\n`variable 1= ( data-type) variable 2;`\n\n`(data-type)` 可以一种数据类型转换为另一种数据类型。\n\
  \n#### 示例 3.11\n\n```cpp\n#include <iostream>\n#define PI 3.1415926 // 常量定义\nusing\
