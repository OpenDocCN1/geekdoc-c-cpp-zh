  md: '# Multidimensional Arrays


    C# provides support for multidimensional arrays. The most common and simplest
    form of these arrays is the 2-dimensional array.


    # Jagged Arrays


    These arrays can be simply said to be arrays of arrays.


    # The Array Class


    This class is defined in the System namespace. This is the base class for all
    the arrays. As such, it provides a number of methods and properties to help you
    while working with arrays.


    # Passing an Array to a Function


    It is possible to pass a function to the array. This can be done by specifying
    the name of the array but without the index.


    # Param Arrays


    They are used for passing an unknown number of parameters to a given function.


    This concludes the section on arrays. Now, we will be taking a look at strings.


