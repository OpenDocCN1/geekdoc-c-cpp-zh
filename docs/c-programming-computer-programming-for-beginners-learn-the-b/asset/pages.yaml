    # **Getting a Grip on Constants and Literals**


    Constants are a reference to fixed values which cannot be changed in any way by
    the program while it is being executed. Another term for these fixed values is
    literals. It is possible to use any basic data type as a constant. Examples include
    character constants, floating constants, integer constants and string literals.
    Enumeration constants also exist.


    The fact is constants will be treated in the same manner as that of regular variables
    with a major difference. That is, the values'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'of constants cannot be altered in any way after they have been defined. Let
    us now take a look at each of the varieties of literals and constants.


    # Integer Literals


    In C#, it is possible for an integer literal to be a decimal constant to a hexadecimal
    constant. The base will be specified by a prefix. In the case of hexadecimal constant,
    the prefix used is oX or ox. No prefix is used in the case of decimal constants.


    It is also possible for an integer literal to have a suffix in a combination of
    L and U. L represents long integers while U is for unsigned. The suffix can be
    used in the lowercase or the uppercase. There are no rules about the order of
    the suffix.


    Take a look at the following examples of integer literals.


    +   - 212    /* Legal */

    +   - 215u   /* Legal */

    +   - 0xFeeL  /* Legal */

    +   - 85     /* decimal */

    +   - 0x4b    /* hexadecimal */

    +   - 30     /* int */

    +   - 30u    /* unsigned int */

    +   - 30l    /* long */'
  merge: -1
  img_proc: true
- pgno: 32
  md: '`3oul` /* unsigned long */


    # Floating Point Literals


    These literals will be made of an integer part, decimal point, fractional part
    and finally, exponent part. It is possible to represent floating point literals
    in the form of decimals or in the exponential form.


    Take a look at the following examples to get a better understanding of floating
    point literals.


    +   ```text

    +   3.14159     /* Legal */

    +   314159E-5L  /* Legal */

    +   510E        /* Illegal: incomplete exponent */

    +   210f        /* Illegal: no decimal or exponent */

    +   . e55       /* Illegal: missing integer or fraction */

    +   ```


    If you are going to use the decimal form for the representation, you must remember
    to insert the decimal point or the exponent. You can even use both if you want.
    In the case of the exponential form, you will have to insert the integer part
    or the fractional part. Both can be used as well. In the case of a signed exponent,
