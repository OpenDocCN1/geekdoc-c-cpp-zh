    # Converting Datatypes


    Type conversion is simply the conversion of one data type to another type. Another
    name for this process is type casting. It is an essential part of programming.
    As such, it is a good idea to get familiar with it as soon as possible.


    In C#, there are two different forms of type conversion as follows.


    Implicit type conversion: In this case, the conversions are executed in a type-safe
    manner by C#. For example, converting a smaller integral data type to a larger
    one will be an implicit type conversion. Another example is converting to base
    classes from derived classes.'
  merge: -1
  img_proc: true
- pgno: 28
  md: "Explicit type conversion: These are the conversions which are performed explicitly\
    \ by the users with the help of the predefined functions. In order to perform\
    \ an explicit conversion, a cast operator is a must.\n\nTake a look at the following\
    \ example to get a better understanding of explicit type conversions.\n\n```\n\
    using System;\n\nnamespace TypeConversionApplication\n{\n    class ExplicitConversion\n\
