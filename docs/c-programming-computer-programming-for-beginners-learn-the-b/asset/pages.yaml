    at structures and enums. They play vital roles in a variety of programs. Therefore,
    let’s find out more about them.


    # What is a Structure?


    A structure in C# is a value type datatype. With it, it becomes possible for a
    single variable to hold related data of different datatypes. To create a structure,
    you have to use the struct keyword. Structures are typically used for representing
    a record.


    Let us take library books as our example in understanding structures better. In
    a library, you will have to keep track of the books. Now, there are various attributes
    you may want to consider while tracking each book such as the title, the author,
    and the subject among others. We will be using this example in the programs in
    the following sections.'
