  md: "# Destructors in C#\n\nLike constructors, a destructor is also a special member\
    \ function of a class. However, it gets executed only when one of the objects\
    \ of the class goes outside of its designated scope. The name of the destructor\
    \ is the exact same as that of its class, but it will have a prefixed tilde (~)\
    \ with it. A destructor is incapable of returning a value or taking any parameters.\
    \ Destructors can be rather beneficial as they can release memory resources before\
    \ the program is exited. It is not possible for destructors to be inherited.\n\
    \nThe following example demonstrates the use of destructors.\n\n```\nusing System;\n\
    \nnamespace LineApplication\n{\n    class Line\n    {\n        private double\
    \ length; // Length of a line\n        public Line() // constructor\n        {\n\
    \            Console.WriteLine(\"Object is being created\");\n        }\n    }\n\
    ```"
