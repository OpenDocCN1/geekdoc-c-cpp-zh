    ## 引言


    首先，感谢您购买本书《编程：计算机编程入门：学习C#基础》。C# 由微软在其 .NET 计划下开发。


    C#（发音为 C Sharp）是一种编程语言。它是一种多范式编程语言，因为它支持包括面向对象范式在内的多种编程范式。因此，在为手头任务选择编程风格时，你享有极大的灵活性。此外，对于希望迈入计算机编程广阔世界的初学者来说，C#
    被认为是一种易学的语言。


    学习C#将为你带来众多机会。从C#出发，你可以退一步学习强大的C语言，然后再学C++。掌握C#还能让你通过 .NET 平台掌握 Web 开发所需的技能。此外，如果你计划未来为微软生态系统开发产品，这门语言也很有帮助。


    你是不是感到不知所措？对于一个初学者来说，这可能信息量很大。但你不必过于担心。本书将帮助你获得成为一名C#程序员所需的基础知识。你将学习一些很棒的新术语，甚至一些程序。你会接触到这门语言中使用的一些术语和函数。简而言之，你将得到全面的准备，从而能够学习高级课程，成为一名顶尖的程序员。


    现在，让我们开始学习C#吧！


    ## 第1章：C#简介


    在微软最初开发 .NET 框架时，程序员必须借助 Simple Managed C（一种托管代码编译器系统）来编写类库。然而，使用 C 存在一些问题。因此，C#
    被开发为一种新语言来克服这些问题。


    C# 被专门设计得简单而现代。它是一种面向对象、通用的编程语言。如果你已经熟悉编程，你会很容易发现 C# 借鉴了其他多种编程语言的一系列关键概念，其中最著名的是
    Java。


    ### .NET框架的重要性


    从理论上讲，C# 可以被编译为机器代码。尽管如此，这门语言在现实生活中几乎总是与 .NET 框架一起使用。因此，你需要确保运行用 C# 编写的应用程序的计算机上已安装
    .NET 框架。


    .NET 框架与大量编程语言兼容。然而，与这个框架最常关联的是 C#。在某些圈子里，它甚至被称为“THE .NET 语言”。这很可能是因为该框架和该语言是同时开发的。


    ### 开始C#编程需要什么？


    在开始编写 C# 程序之前，你需要先处理一些事情。请确保计算机上已安装以下程序。


    - .NET框架软件开发工具包（SDK）

    - 编辑器


    仅此而已。这是开始用 C# 编程所需的仅有的两样东西。可用的编辑器很多。你甚至可以使用记事本或 DOS 编辑器，但稍后会有更多介绍。尽管如此，如果你安装以下可选程序中的任意一个，将更有利于你的学习曲线。


    - Visual C# .NET

    - Visual C++ 6.0。它包含在 Microsoft Visual Studio 6.0 软件包中。


    你的第一步应该是在计算机上安装 .NET SDK。你可以轻松地从微软官方网站下载该程序。你还将获得该程序的完整文档。安装此工具包后，你将能够编译和执行 C#
    源代码。这得益于工具包内置的命令行编译器以及运行时即时（JIT）编译器。如果你以前接触过 Java，你可以将它们视为类似于 Java 开发工具包中的 Java
    编译器和 Java 解释器。


    ### 关于编辑器


    编辑器是用于编写源代码的程序。在这方面，C# 非常灵活，几乎可以用任何文本编辑器来编写。即使是 Windows 中自带的基本记事本也是个不错的选择。编译时，你可以轻松使用
    .NET 框架中的命令行编译器 csc.exe。


    在使用 .NET SDK 开发 C# 程序时，记事本是一个常见的选择。另一方面，它并不是最好的编辑器，尤其是对初学者而言。毕竟，记事本缺少一些有用的功能，例如代码编号和语法着色。


    这就是为什么许多开发者更喜欢使用集成开发环境（IDE）。有不少


    '
