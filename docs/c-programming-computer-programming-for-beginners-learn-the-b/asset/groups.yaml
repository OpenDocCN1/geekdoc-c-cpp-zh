    If you have learned or dabbled in any programming language previous to C#, you
    will be familiar with “Hello, world!” This is a basic example that demonstrates
    the programming language in action. This is exactly what you will be learning
    in this chapter.


    This programming example will illustrate the fundamentals of the programming language.
    You will come across a few functions and classes that you will surely be using
    later while writing more advanced codes.


    # Starting a New Project


    To start a new C# project, you should first open Visual C# Express. In the File
    menu, select the New Project option. The project dialog will open where you should
    choose the Console application. This will be the most basic application type that
    you can find on a system running Windows. Click on the Ok option so that Visual
    C# Express can create the new project for you.'
