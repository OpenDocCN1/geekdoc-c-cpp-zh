    # Chapter 11


    # Becoming Familiar with the Concept of Inheritance


    As mentioned in the previous chapter, one of the most important aspects of any
    object oriented programming language is classes. In the same way, inheritance
    is a key concept in object oriented programming.


    As C# is such a language, you will have to utilize inheritance sooner than later.
    In fact, the entirety of the .NET framework has been built upon the concept of
    inheritance. It is responsible for the expression that everything is an object.


    Inheritance, in simple terms, enables you to create classes that can inherit specific
    attributes from their parent classes. In C#, even a simple number can be an instance
    of a class that inherits from the parent class, System.Object.


    Inheritance can be a bit advanced for some beginners. However, it is better to
    become familiar with it sooner than later because'
