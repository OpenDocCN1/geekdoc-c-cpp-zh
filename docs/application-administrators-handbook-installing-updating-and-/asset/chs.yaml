- "# 应用程序管理员手册：软件安装、更新与故障排除\n\n\n\n![](img/9780124017122_FC.jpg)\n\n![image](img/9780124017122_FC.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n这本书献给我的父母 Jack Bourne 和 Bev Bourne。\n\n我的父母真的是两个非常非凡的人。\n\n\
  在我们成长过程中，他们一直和我六个兄弟姐妹的榜样和不可思议的灵感来源。我仍然可以依靠他们的智慧和常识来指导我的人生。\n\n谢谢爸爸妈妈。\n\n# 致谢\n\n\
  如果没有爱思尔（Elsevier）的 Steve Elliot 对我以及我的提案出的远见和信任，这本书就不会出现在你们手中。如果没有他的远见，这本书将仅仅是一个梦想。同样来自爱思利的\
  \ Lindsay Lawrence 在这项工作的制作和审查阶段提供了极大的帮助和支持。最后但绝非最重要的是技术编辑 Brian Jaffe。在整个过程中，Brian\
  \ 的意见、建议以及一如既往建设性的批评是无价的。\n\n# 第 1 章\n\n# 应用程序管理员是做什么的？\n\n## 摘要\n\n本章描述了应用程序管理员执行的任务。他们的工作职责包括安装从供应商许可的软件、更新软件、从性能角度调优应用程序、排故障排除以及培训用户。\n\
  \n### 关键词\n\n应用程序管理员；安装软件；更新；诊断；故障排除；调优；文档编制\n\n## 1.1 职位概述\n\n应用程序管理员既不是开发者也不是用户，但他们对于维持你组织所依赖的应用程序运行至关重要。他们安装、更新、调优、诊断并维护内部以及第三方应用程序。他们支持的应用程序可能包括\
  \ ERP（企业资源计划）、CRM（客户关系管理）、POS（销售点）、BPM（业务流程管理）、预算与预测、HR（人力资源）、法律事务管理、AP（应付账款)/AR（应收账款）、工资单、总账、SOX（萨班斯-奥克斯利法）合规跟踪、培训、时间跟踪、供应链、数据库引擎以及消息传递（即电子邮件）。\n\
  \n虽然软件可以从供应商那里获得许可，但仍然需要获取组织付出大量的精力。必须有人准备运行该软件的服务器。然后，必须有人对其进行安装、配置、加载数据、调优、升级，并通常保持该包的运行。如果发生错误，必须有人向供应商报告并与供应商技术人员合作解决问题。这些都是应用程序管理员处理的任务。\n\
  \n在许多情况下，公司完全依赖这些应用程序的运行。如果工资单应用程序崩溃了，员工会有什么反应？如果发票没有发送给客户，组织的财务状况会发生什么变化？如果新员工无法添加到\
  \ HR 系统中怎么办？应用程序管理员的重要性及其专业水平不应被忽视。由于在可预见的未来依赖第三方软件的趋势不会减少，应用程序管理员这一角色也不会消失。\n\n\
  每家公司都会雇佣他们，即使他们的正式职位名称听起来完全不像“应用程序管理员”。系统应用程序管理员”的职位可能是一个兼顾应用程序管理和系统管理的职。。由于这两个职位之间存在很大程度的重叠，这种情况并不起见。\n\
  \n组织依赖的任何软件几乎都会有一个应用程序管理员提供支持。这包括从第三方供应商或从内部开发团队获取的软件。开发团队通常负责开发，然后将支持职责交给组织内的另一个小组。无论好坏，他们往往不会无限期地留下来提供持续的生产支持。\n\
  \n### 1.1.1 应用程序管理员的背景\n\n担任应用程序管理员的 IT 专业人员背景各迥异。有些人具有软件开发背景。另一些人成为应用程序管理员是因为需要管理员，而他们恰好在正确的时间出现在的位置。没有\
  \ IT 正式教育或培训的人员将从书中受益最深。它将提供关于如何管理应用程序、排除故障以及建立保持应用程序顺利运行的最佳实践的实操建议。但即使是最经验丰富的应用程序管理员也有其薄弱领域，这本书可以帮助加强这些领域。\n\
  \n### 1.1.2 潜在技能要求\n\n应用程序管理员可能要求的潜在技能列表可能很长且多样。正在寻求的技能从非常具体的**技能到被认为是“软技能”的技能不等。几乎每个职位都要求不同程度的卓越沟通能力、故障排除能力、问题解决和/或分析能力、灵活性以及对业务需求的理解。要求的技能的一些示例包括：\n\
  \n- 必须具备 `XYZ` 应用程序的专业知识和经验。\n- 在故障转移、高可用性、灾难恢复、业务连续性方面经验丰富。\n- 在 `XYZ` 版本控制工具方面经验丰富。\n\
  - 对由于防火墙、负载均衡器、代理等引起的连接问题有良好的知识和证明过的故障排除能力。\n- SOX 合规和方法的经验。\n- 在流程自动化、最佳实践方法、技术效率和有效性方面的实操经验。\n\
  - 熟悉 Web 服务和面向服务的架构（SOA）优先。\n- 需要大量的 Windows 2000/2003 Server 知识。\n- 具有与 `XYZ` 数据库相关的\
  \ `SQL Query Development` 经验。\n- 必须证明在设计、实施和维护当前的 Windows 服务器产品方面具有丰富经验，包括 `Microsoft\
  \ SQL 2005`、`IIS`、Windows 集群、网络负载均衡、Net 环境和 ISA。\n- 丰富的 Linux 经验，包括用于管理任务的 shell\
  \ 和 Perl 脚本。\n- 具有监控工具经验优先。\n-  Oracle Application Server、Apache Tomcat 和 `Microsoft\
  \ IIS` 优先。\n- 在应用程序系统分析和编程活动的所有阶段均处于最高技术水平。\n- 理解不同部门系统的软件和硬件需求。\n- 理解复杂应用程序系统的工作流和流程需求。\n\
  - 证明能够成为支持、维护和管理复杂应用程序的领域专家。\n- 卓越的问题解决/分析能力以及对分析工具的知识。\n- 展示并执行逻辑和复杂的故障排除方法。\n\
  - 卓越的口头、书面沟通和谈判技巧。\n- 展示所需的软技能，如想法展示和向高管理层清晰阐述概念。\n- 能够与组织各层级的技术和非技术人员进行有效对接。\n\
  - 强大的客户服务和问题解决能力。\n- 能够提供卓越的客户服务，善于倾听并与他人良好合作。\n- 自我激励，能够独立工作并采取主动性。\n- 能够在快速节奏的环境中处理多项任务。\n\
  - 对细节极度关注，具有卓越的时间和项目管理能力。\n- 证明能够与多样化的客户群体成功合作。\n- 需要快速且良好地学习新内容领域和新技能。\n- 职业态度和工作习惯。\n\
  - 理解与相关的业务功能。\n- 能够处理模糊的工作状况。\n\n### 1.1.3 职责与义务\n\n\n\n\n\n某些职位公告中描述的职责和范围与对求职申请者要求的技术技能一样，广泛且多样。期望一名候选人能够负责整份职责列表是不切实际的，但随着时间的推移，如果你的初始工作描述范围扩大，包含了越来越多的职责，请不要对此感到惊讶。应用程序管理员（Application\
  \ Administrator）可能承担的一些职责和范围包括：\n\n• 候选人应监控 `XYZ` 软件应用程序，记录并分析问题，并发布维护计划\n• 设置管理员账户和服务级账户\n\
  • 维护系统文档\n• 与用户交互并评估供应商产品\n• 可能使用管理语言进行编程\n• 为终端用户提供建议和培训\n• 根据分配保持对相关技术的最新知识掌握\n\
  • 候选人应作为团队的一员，负责维护 `XYZ` 系统达到 99% 的可用率\n• 排除故障并解决任何报告的任何问题\n• 提供应用程序性能调优\n• 候选人应审查管理法规，以确保程序得到适当的合规支持\n\
  • 候选人应监控、更新和维护现有的遗留环境软件系统接口，以确保接口能够正常交换数据并支持当前的遗留环境\n• 这是一个具有 `XYZ` 应用领域专家知识（SME）的实战高级技术职位\n\
  • 实现最佳实践\n• 流程自动化\n• 维护 SLA、系统可用性、容量管理和性能 KPI\n• 与硬件、操作系统、DBA 技术团队协作，确保环境的正确集成\n\
  • 与应用程序开发团队和供应商密切合作，对应用程序进行调优和故障排除\n• 计划并协调测试、升级和新服务，确保系统在当前和未来的环境中正常运行\n• 为所有公司系统和软件组件提供二级技术支持\n\
  • 为应用程序提供 3 级支持。必须能够支持 2 × 7 服务。还要使生产支持团队能够处理二级级支持和问题\n• 领导并参与开发和实施应用程序及系统监控流程\n\
  • 领导并参与实施应用程序更新工作，包括升级、补丁和新版本\n• 测试、调试、实施和记录程序。协助修改公司产品和/或客户/内部系统以满足客户和/或终端用户的需求\n\
  • 开发测试计划以验证新程序或修改程序的逻辑\n• 为组织开发和维护报告仪表板基础设施\n• 制定工作计划并跟踪/报告分配的项目/任务状态\n• 就所有问题与供应商支持联系\n\
  • 全面负责问题管理活动，如问题解决和根原因分析\n• 日常监控和维护活动\n• 协助运营部门的日常工作\n• 审查并处理分配的技术支持工单和电话，将与此类电话相关的所有更新录入帮助服务台工单系统，并让团队意识到任何敏感或升级中的问题\n\
  • 为所有应用程序提供领域专家知识\n• 参与安全和应用程序审计\n• 有时支持工作外的活动。此职位可能需要灵活的时间表\n• 通过使用 `XYZ` 并遵循 SOX\
  \ 政策和程序来推动变更\n• 识别、下载并应用 `XYZ` 升级和补丁\n• 研究应用程序中间件、数据库等问题，并建议/应用解决方案，例如对操作系统、`WebLogic`、`Tuxedo`、`Java`\
  \ 等进行配置更改，额外的硬件、内存、CPU 等\n• 识别有问题的 `SQL` 并与开发者、分析师和 DBA 协作解决\n• 优化和调优 `XYZ` 应用程序组件\n\
  • 与客户和分析师合作开发用于负载测试的脚本\n• 使用负载测试工具进行测试，以确定应用程序的负载能力\n\n如上面的列表显而易见所示，对应用程序管理员的要求是多样且丰富的。这是一份有趣的工作。这是一份挑战性的工作。这绝对不是一份无聊的工作。每天都会带来新的挑战。每一个问题都是一个学习机会。每一个解决方案都是教育你的用户、组织内其他专业人士或继任者的机会。\n\
  \n### 1.1.4 需要管理员的应用程序类型\n\n从第三方供应商许可且并非为组织定制构建的应用程序通常被称为缩写 COTS —— 商用现成软件（Commercial\
  \ Off The Shelf Software）。由于 COTS 应用程序的安装非常多，它们是应用程序管理员的支持重点。\n\n除了 COTS 软件包，应用程序管理员还负责管理软件即服务（SaaS）应用程序。SaaS\
  \ 应用程序由供应商托管。客户端用户通过指向特定 URL 的网络浏览器访问。如果 SaaS 应用程序对你的组织至关重要，那么有人担任管理员来帮助用户，在发生问题时与供应商合作，并在你的组织与供应商的技术人员之间充当中介。\n\
  \n全球范围内使用的越来越多的企业级软件是从第三方供应商许可的，而不是在内部开发的。这一趋势在未来可能发生改变。如果说有什么变化，它可能会加速。原因有很多，包括以下几点：\n\
  \n• 开发一个复杂的应用程序既极其困难又昂贵。开发有效、可靠的软件需要时间、专业人才和大量的资源。大多数组织缺乏正确完成此工作的经验。大型软件项目的失败率高得惊人。\n\
  • 组织喜欢关注其主营业务。对于大多数业务来说，软件开发并不是它们的核心功能。开发 `ERP` 或其他任何复杂应用程序都会降低他们专注于运营业务的能力。\n•\
  \ 企业级软件是复杂的，并且变得越来越复杂。许多（甚至是大多数）组织跨州或国际。这要求软件能够处理其运营的每个州和国家的法律法规。法律法规往往极具动态性。修改和测试软件以正确处理这些如如其的变化非常耗时。\n\
  • 软件应用程序必须处理动态环境。新版本的操作系统不断发布，旧版本被淘汰。修改和测试应用程序以适应新操作系统是一项巨大的投入。新的网络浏览器和现有版本的更新版本定期发布。依赖网络浏览器的应用程序需要在每次浏览器升级时进行测试并可能需要修改。数据库系统也会定期升级和修改。依赖数据库系统的应用程序需要进行测试并可能需要修改以应对包内部的变化。\n\
  • 安全漏洞是所有软件面临持续威胁，特别是那些广泛部署且涉及机密或个人身份信息（PII）的软件。对组织声誉的危险和泄露的成本是惊人的。了解新发现的安全威胁需要专业人士的专注。\n\
  \n\n\n\n\n由于上述原因，越来越多的组织开始选择将软件应用程序 own“外包”给专门的供应商。获取第三方应用程序无疑是一种妥协之举。现有的软件包中没有哪一个能够提供组织想要或需要的精确功能。另一方面，安装现成应用程序的成本和时间远少于在内部开发该应用程序或让第三方定制构建的投入。\n\
  \n许可应用程序这一趋势中，最主要的例外是：当应用程序是业务的“核心”并能提供竞争优势时。例如，Google 绝不会从供应商那里许可软件来取代其页面排名算法。这些算法是\
  \ Google 的灵魂，将永远保留在公司内部。与之形成对比的是组织的薪资发放应用程序。薪资发放并没有独特或具有优势之处。当然，它是一项重要的流程，但它还没有达到商业秘密的高度。对于一个组织来说，花费数百万美元开发计算工资支票的专利算法是不合逻辑的，这种投资不会产生任何显著的回报。\n\
  \n## 1.2 应用程序管理员的素质\n\n要成为一名成功的应用程序管理员，拥有一特殊的素质会有帮助。这项工作并不完全等同于做软件开发。以下章节描述了一些应当具备的素质。\n\
  \n### 1.2.1 服务意识\n\n要成为一名有效的应用程序管理员，必须具备服务意识。你工作的本质是保持应用程序运行，以便其他人能够开展工作。通常，你不会从事“朝\
  \ 9 晚 5”的工作。你必须愿意尽一切努力保持系统运行。如果应用程序在半夜宕机并影响了另一个时区的用户，你会接到电话。如果需要应用补丁，且维护窗口是周日晚上\
  \ 10 点到午夜，那么请做好偶尔在周日晚上晚上的准备。如果世界上另一端的用户感到访问速度缓慢，那么请做好在深夜熬夜监控和排除故障的准备。你不仅提供技术专家，还提供服务。如果为内部或外部客户、顾客提供服务的想法对你没有吸引力，那么你可能并不适合担任应用程序管理员。\n\
  \n应用程序支持岗位意味着永远不能说“那不是我的问题”。如果用户无法使用应用程序，即使你知道问题的真正原因与应用程序本身无关，那也是你的问题。你将代表用户与其他小组（数据库管理员\
  \ DBA、供应商、网络团队、安全团队、防火墙团队等）合作，直到应用程序和你的用户都恢复在线。与其他其它团队成员的合作将为你提供了解更多 IT 行业的机会，因为你们都在共同努力以保持系统运行。\n\
  \n我承认我对这个主题有些许偏见，但可以说，应用程序管理员对公司的重要性与应用程序开发人员相当。如果世界上最好的应用程序没有被安装、定制、备份或供用户使用，那么它将一文不值。\n\
  \n如果说“杀猫有千种方法”这个短语适用于某个职位，那一定是应用程序管理。完成你需要做的几乎每件事都有许多方法。某些方法可能比其他方法快一点或更直接，但始终要意识到存在许多解决方案。如果你睁开眼睛观察，在与其他应用程序管理员、系统管理员、数据库管理员、供应商技术代表和其他专业人士合作时，你将获得许多学习机会。如果你能从他们每个人身上学到一两个技巧，你对你的雇主、你的用户以及你的职业就会变得更有价值。\n\
  \n### 1.2.2 坚持终有回报\n\n应用程序管理员必须在坚持与不礼貌之间取得微妙的平衡。\n\n你需要其他人的帮助，如网络团队、DBA、供应商帮助热线、安全团队以及远程站点的用户。在不越界、不招烦的情况下保持坚持是困难的，但你必须坚持下去。没有人喜欢被讨厌虫缠着，但你应用程序的用户正依赖你，而你不能独立完成一切。只需不断提醒自己，你只是在尝试做好你的工作，你有权获得组织内其他专业人士的协助。不要无礼，不要具有攻击性，但要坚持。你正在为你的应用程序以及依赖这些程序的用户而战。\n\
  \n### 1.2.3 持续改进\n\n你的工作实际上不仅仅是保持应用程序运行。组织正不断寻找持续改进流程的方法。作为 IT 团队的一员，你被期望为此工作做出贡献。改进运营的三种常见方式是：\n\
  \n*   文档\n*   最佳实践\n*   流程成熟度\n\n### 1.2.4 记录、记录、记录\n\n记录你所做的一切。供应商的文档将提供一些高层示例，但像服务器名称、账户名称、URL\
  \ 等细节不会包含在他们的标准文档中。截取你经过的每一个屏幕的截图。对截图进行彻底标记，例如标识每个屏幕上需要更改哪些设置。\n\n如果应用程序遇到问题或停机，你需要记录它。写一份文档，描述发生了什么、什么时候发生的、谁先发现的以及是如何解决的。你的组织可能将其称为事故报告或根因分析。确保你的叙述清晰、简洁且准确。\n\
  \n如果你要对系统进行升级，你需要编写一份项目计划和测试脚本。项目计划详细描述了将要做什么、谁来做、需要多长时间以及如果升级失败将如何恢复。测试脚本列出了为了确认升级成功而需要的一系列测试。\n\
  \n会有应用程序需要重启。你需要记录如何验证应用程序已成功启动。这可能简单到只需登录应用程序。也可能复杂到确认应用程序 `A` 能成功将文件传递给应用程序 `B`。这一切取决于你的环境。\n\
  \n花时间为你创建的每个文档文件准确命名。世界上最详尽的文档如果你找不到，它将一文不值。具有描述性的文件名会比简晦或晦涩的文件更容易找到。\n\n你的组织或部门需要确定一个存放所有文档的地方。无论是\
  \ SharePoint 门户、数据库还是网络驱动器其实并不重要。只要它是大家都知道、可以访问并一致使用的地方即可。\n\n### 1.2.5 最佳实践\n\n\
  “最佳实践”是一个通用术语，指证明能产生优越结果的方法或技术。这个概念可以理解非常模糊。对于一个小组或组织来说是最佳实践，对于另一个小组可能毫无用处。你小组的管理层需要确定在你们的情况下什么是最佳实践。\n\
  \n\n\n\n你的组织从哪里获取其“最佳实践”？可能包括通过试验、错误以及对最佳方案的观察来自己构建。也可以从像 `ISO`（国际标准化组织）这样经过认证的管理标准组织获取。最后一个来源是与专门从事最佳实践领域的咨询公司合作，让他们就适用于\
  \ IT 或你所在特定行业的模板向你提供建议。\n\n作为一名 `Application Administrator`（应用程序管理员），你将有机会确保你所支持的所有应用程序都符合组织的最佳实践。这不会一夜之间完成，但随着你对当前流程的改进，你的工作将变得更加简单和高效。\n\
  \n### 1.2.6 流程成熟度\n\n流程成熟度包含了这样一个概念：你的小组或组织开展业务活动的方式可以提高成功的可能性。人们使用相同的定义步骤执行活动。这确保了流程是可重复的。流程被拆解、定义、优化和衡量。`Application\
  \ Administrators` 帮助确保与其应用程序相关的流程变得日益成熟。\n\n考虑到对 `Application Administrators` 期望的所有技能以及我们被要求执行任务的所有条件，这让我想起了鲁德亚·基普林（Rudyard\
  \ Kipling）的一首诗。这首诗太长，无法在这里全部收录，但第一节和最后两节如下：\n\n```\nIf you can keep your head when\
  \ all about you\nAre losing theirs and blaming it on you,\nIf you can trust yourself\
  \ when all men doubt you,\nBut make allowance for their doubting too;\nIf you can\
  \ fill the unforgiving minute\nWith sixty seconds' worth of distance run -\nYours\
  \ is the Earth and everything that's in it,\nAnd - which is more - you'll be a Man\
  \ my son!\n```\n——鲁德亚·基普林\n\n## 1.3 应用程序管理员从哪里来？\n\n目前没有“应用程序管理”本科学位，因此没有人为了这一特定职位接受过正式教育。目前在该领域的每个人都是从业务或\
  \ IT 的其他领域流转过来的。有些 `Application Administrators`（像我一样）最初是软件开发人员。有些人从获得 `MIS`（管理信息系统）学位起步，并被分配为组织一个或多个应用程序的\
  \ `Application Administrator`。其他 `Application Administrators` 可能最初是组织应用程序的高级用户，当需要有人来管理应用程序时，他们要么自愿请，要么被自愿推荐。\n\
  \n## 1.4 应用程序管理员可以晋升到什么职位？\n\n实际上并没有供 `Application Administrators` 晋升的明确职业路径。我的经验和观察是，`Application\
  \ Administrators` 的职业路径与在该职位的个人一样多样化。一条常见的路径是继续担任 `Application Administrator`，但负责或其他额外的应用程序。一旦你培养了成为胜任的\
  \ `Application Administrator` 所需的技能，许多机构可能都需要你的服务。\n\n### 1.4.1 IT 架构师\n\n`Application\
  \ Administrator` 几乎与组织 IT 部门的每一个方面接触。他或她需要理解所有部分是如何结合在一起的。这种背景可以使 `Application Administrator`\
  \ 成为组织中 `IT Architect`（IT 架构师）职位的候选人。`IT Architect` 是组织中在最高水平工作、决定哪些 IT 投资将为组织带来最佳回报的人。该职位要求在技术和业务方面都有经验。`Microsoft`\
  \ 和 `The Open Group` 都提供 `IT architects` 的认证。如果你目前是 `Application Administrator`\
  \ 并且对晋升到 `IT Architect` 职位有兴趣，那么你应该调查认证要求，并考虑努力完善你的技能，以填补你可能存在的短板。\n\n### 1.4.2\
  \ 软件开发\n\n如果你目前是 `Application Administrator` 并且具有软件开发背景，那么回到开发领域无疑是一个选择。支持应用程序所花费的时间将为你提供关于用户对应用程序的期望、当前应用程序的缺点，以及如何编写更容易实现和升级的软件的想法的宝贵见解。没有花时间支持过应用程序的开发人员不太可能拥有你所获得的这些洞察力。\n\
  \n关于这一职业变动的一个警告是，软件开发的变化极快。如果你离开该领域已经多年，可以预计要经历一段艰难的爬坡才能回到状态。如果你认为这种变动在你的长期未来中，那么你应该计划跟上软件开发世界的当前趋势。定期阅读行业杂志，阅读最受推崇的博客并保持你的编码技能敏锐。这将消耗你大量的空闲时间，但当你开始申请开发人员职位时，这是非常值得的。\n\
  \n### 1.4.3 为供应商工作\n\n如果你对特定的软件应用程序变得非常精通并喜欢与其一起工作，那么一条可能的职业路径就是去供应商那里。你可能考虑成为他们的技术分析师或系统工程师。如果你为他们工作，他们可能会为你提供高级培训，以学习更多关于应用程序内部工作原理。然后你将协助他们的客户进行安装、升级、故障排除等。这个职位与你目前的职位相似，但你会与许多客户合作，而不仅仅是你的现有组织。\n\
  \n一个警告——你工作的组织可能与供应商签有协议，不互相挖员工。如果存在这样的协议（无论是书面的还是仅仅是口头的），供应商雇佣你的机会也微乎其微。在接触供应商之前，先搞是否存在此类协议。如果你进行了咨询而供应商由于与你当前雇主之间的法律协议无法雇佣你，对大家来说都会非常尴尬。\n\
  \n### 1.4.4 咨询\n\n对于任何展示出具备具有市场力的技能组合的 IT 人员来说，进入咨询或合同职位是一种可能。虽然 `Application Administrators`\
  \ 可能进入咨询职位，但其他技能组合似乎可能性较小。`Application Administration` 是一个长期或永久需要的职位。大多数咨询或合同职位是为了填充短期职位。虽然这条职业路径看起来不像其他路径那样可能，但它未来可能会变得更常见。行业中发生过比这更奇怪的事情。\n\
  \n## 1.5 现成软件 (COTS) 示例\n\n在本章较早之前提到了 `COTS` 软件。现成软件的一些示例包括以下：\n\n- `ERP`——企业资源计划软件包\n\
  - `CRM`——客户关系管理软件包\n- `POS`——销售点终端软件包\n- 调度软件包\n- 教育/培训软件\n- 简历处理软件\n- 会计软件包\n-\
  \ 合同管理软件\n- 医疗账单计费\n- 发票系统\n- `SOX` 合规跟踪\n- 应付账\n- 应收账\n- 未归属财产\n- 销售税处理\n- 薪资税处理\n\
  - 项目管理软件\n- `SAP`\n- `PeopleSoft`\n- `Sales Force`\n- `Oracle Financials`\n- `Oracle\
  \ HR`\n- 仓库管理\n- 订单管理\n- 库存管理\n- 供应链管理\n\n\n\n虽然每个应用程序都不同，但有很多共同的技能、技术和方法可以帮助应用程序管理员支持各种应用程序。本书试图记录这些技术。它不会为你提供安装\
  \ `XYZ` 应用程序 9.7 版本的详细信息，但提供了一系列适用于许多（如果不是大多数）应用程序的基础技能。\n\n作为一名应用程序管理员，你必须成为某种程度上的“全才手”。你需要了解许多领域的话题，如操作系统、磁盘管理、数据库、网络、性能、网站、负载均衡、安全、备份、灾难恢复、项目管理和配置管理。这本书不会让你成为所有这些领域的专家，但它将提供基础信息，使你能够快速、高效且胜任地完成工作。希望它能为你提供足够的基准知识，以便你与这些领域的专家高效地工作。\n\
  \n## 1.6 与人打交道（与大量人打交道）\n\n你可能认为作为应用程序管理员，你所有的时间都花在处理计算机和软件上，但事实并非如此。你将与**大量**人打交道。典型的一天中，你花在他人身上的时间和你花在你所管理的应用程序上的时间一样。这些人类型包括：\n\
  \n* 用户\n* 高级用户\n* 应用程序“所有者”\n* 你的主管或经理\n* 项目经理\n* 内部开发团队\n* 数据库管理员 (DBA)\n* 网络团队\n\
  * 安全团队\n* 供应商帮助热台人员\n* 供应商开发团队\n* 你们组织的帮助热台团队\n\n## 1.7 如果你被交了应用程序的责任，应该问哪些问题\n\n\
  如果你是一名应用程序管理员，那么很有可能在你职业生涯的某个时刻，会有另一个应用程序被添加到你的职责列表中。如果你准备第一次成为应用程序管理员，那么这件事正发生在你身上。\n\
  \n如果发生这种情况，你应该如何应对？你想成为一个团队合作者，但不要忽视了照顾好自己。尽可能地收集有关新应用程序的信息。第 6 章 中提供了一份潜在问题列表。显然，任何现成的问题列表无法涵盖每种情况，但请以此列表作为起点。根据你个人、你的组织以及你即将负责的应用程序增加特定问题来充充。\n\
  \n我不愿意做一个悲观主义者，但如果应用程序的当前“所有者”告诉你该应用程序非常容易维护，我会对这种说法持保留态度。毕竟，如果真的那么容易维护，为什么会被交接给你呢？\n\
  \n## 1.8 管理多个应用程序\n\n大多数应用程序并不需要等同全职人员来管理。如此，你可以预计自己将承担额外的职责。你很有可能被指派管理多个应用程序。\n\
  \n根据我的经验，管理多个应用程序最大的挑战是平衡来自每个应用程序的请求。墨菲定律预测到，如果一个应用程序需要你大量的时间和注意力，那恰恰是你其他某个应用程序崩溃或需要更新的时候。我能给你的最佳建议是让你的主管充分了解你的日常活动。与他/她合作，确定哪个应用程序应该是你的最高优先级。如果用户或其他任何人不同意，请非常委婉地告诉他们去找你的主管反映。让你的主管处理此类决策可以为你腾出更多时间来解决问题。\n\
  \n如果你最终成为了多个应用程序的应用程序管理员，那么你需要尽可能高效。你需要利用机会重用文档、表单、快捷方式、提示、培训、DR 计划等。任何可以从一个应用程序到另一个应用程序复制并重用的东西都能节省你的时间。它的次要优势是让你的文档和流程在应用程序之间更加保持一致。\n\
  \n## 1.9 培训你的继任者或备份人员\n\n你工作的这一特殊细节可能并不明显，但它对你个人来说是最重要的任务之一。如果你想休假、晋升或转岗，你就需要一个可以随时替换你的人。最糟糕的事情莫过于在休假或生病时，接到电话说应用程序崩溃了，而你必须立即解决问题。\n\
  \n培训备份人员的第一步是确定这个人将会是谁。显然，这个决定将由管理层做出，而不是由你个人做出。一旦做出决定，你就需要定期与你的备份人员一起。你需要教育他/她关于该应用程序及其背景和日常活动。\n\
  \n你需要为你的备份人员提供访问所有相关服务器和文档的权限。更重要的是，他们最初需要观察你，随后由他们自己管理。大多数人似乎在实际执行任务时学得最好。应用程序管理也不例外这一规律，因此计划让你的备份人员看你执行一两次特定任务，然后下次由他们自己来做。在他们第一次执行任何任务时，你需要极度耐心。他们不会像你那样自信。他们不会像你那样快。他们会犯错。但那是学习经验的一部分，无法避免。\n\
  \n养成习惯，每当你准备做某些不寻常的操作就把他们叫过来即使你不认为这个特定任务很快不会再次执行。让他们至少看到一次操作过程，也比在你不在场时他们第一次尝试要好。\n\
  \n你花了大量时间在技术上变得精通，并且喜欢拥有这些技能。对我们许多人来说，将任务交给别人是很困难的，但你需要考虑大局。你喜欢在休假时接到故障电话吗？你想获得晋升或新任务的机会吗？如果你对这些问题的任何一个回答是“是”，那么在培训备份人员或潜在继任者时请记住这一点。\n\
  \n## 1.10 总结\n\n如果不熟悉应用程序管理员职位，我希望这次介绍说服了你工作很重要且具有挑战性。这可能不是适合每个人的工作，但它有趣、充满挑战，并且大公司的运营至关重要。如果你已经熟悉该职位或正在担任应用程序管理员，我希望这本书为你提供了帮助成为更好应用程序管理员的工具。\n\
  \n# 2 设计\n\n## 摘要\n\n本章描述了什么是软件架构和设计。介绍了容量规划、托管类型（内部托管、供应商托管、SaaS、ASP）以及 Web 应用程序与客户端/服务器应用程序的描述和比较。解释了所有权成本（`TCO`）的比较。它还描述了与其他应用程序或系统的交互如何影响设计。\n\
  \n### 关键词\n\n软件架构；设计；容量规划；规格说明；托管模式；ASP；SasS；Web 应用程序；客户端/服务器应用程序；应用程序 TCO\n\n`architecture`（架构）和\
  \ `design`（设计）术语之间存在大量的混淆。这两个术语存在于一个连续体中，专业的业内很容易在其中一个结束而另一个开始的地方产生分歧。对这两个术语的非常简化的定义可以是：\n\
  \n\n\n\n\n- 架构（Architecture）指的是宏观层面。它涉及到使用哪种框架和编程语言。软件框架是供应商用于开发其产品的可重用平台。与范围和目标相关的决策（即应用程序将包含哪些内容）是在架构层面上做出的。\n\
  - 设计（Design）关注的是更小、更紧凑的细节。它涉及到软件模块如何组织以及模块之间传递什么样的通信内容。实现和支持则更偏向于设计端。\n\n作为应用程序管理员（Application\
  \ Administrator），你控制这些任何方面的机会都较少。通常你介入流程时已经太晚了，无法影响架构和设计决策。通常在你参与工作时，应用程序已经就绪。如果你参与了获取软件的过程，那么你可能对选择哪个特定供应商的产品产生一些影响。\n\
  \n## 2.1 规范（Specifications）\n\n在获取第三方应用程序或开发自己的应用程序时，需要完成的第一步是完全理解它需要做什么。你希望应用程序执行的功能的正确术语是定义其“规范”。\n\
  \n为复杂的应用程序列出规范是一项非常重大的任务。目前有一些软件软件包可以帮助你制定规范。使用工具来这样做会让过程更加正式，并且可能更完整，但这些工具相当复杂，难以理解和学习使用。一种不那么正式的定义规范的方法是结合电子表格或文字处理文档。\n\
  \n如前所述，大多数应用程序管理员可能不会参与收集应用程序规范的过程。这是因为这项工作在获取或设计应用程序过程的早期就完成了，远在应用程序管理员介入之前。另一个原因是，极少应用程序管理员拥有开发一套完善规范的培训或经验。\n\
  \n## 2.2 与其他软件软件包的交互\n\n约翰·多恩（John Donne）曾说：“人不是孤岛。”如果这对人适用，那么对应用程序同样适用。在典型的企业环境中，应用程序经常往返传递数据考虑以下场景：\n\
  \n- 招聘了一位新员工，其个人详情被输入到 HR 系统。\n- 与此同时，他的详情被输入到 Active Directory (AD) 中。\n- 新员工在学习管理系统\
  \ (LMS) 或培训系统中被分配了几门课程。当新用户登录开始培训时，Active Directory 子系统会验证他们的登录信息。\n- 一旦新员工完成了课程，LMS\
  \ 系统将发送一个列出课程“毕业生”的文件给其他应用程序，例如数据市市（Data Mart）应用程序，该程序会为每个新用户创建一个账户。系统会发送封电子邮件给新用户，提供他们的账户详情。\n\
  - 为了发放工资，HR 系统与薪资系统协作，根据其基本工资计算净工资是多少。它还会根据他们向 HR 提供的属人详情，计算从支票中扣除联邦、州和地方税，以及医疗保险、牙科保险等扣款。\n\
  - 年末，HR 系统或所得税软件软件包会向每位员工邮寄 W2 表格用于报税。\n\n上述示例只是企业应用程序之间存在通信的少数例子。你支持的应用程序很可能与其他应用程序交互。与任何其他自动化过程一样，两个应用程序之间的通信偶尔会失败。这里列出了你想要了解的一些细节：\n\
  \n- 交互是如何发生的？\n- 是否存在 `API`？\n- 系统上平均会有多少用户？\n- 用户中有多少是在读取数据，有多少是在写入数据？\n- 如果你的应用程序有高峰期，那时有多少用户在使用？\n\
  - 它参与了多少次交互？\n- 你的应用程序是否创建或发送数据？\n- 你的应用程序是否接收传入的数据？\n- 这种情况发生的频率有多高？\n- 数据格式是什么？\n\
  - 如果接收端应用程序不可用怎么办？\n- 如果发送了意外数据怎么办？\n\n除了了解交互的技术细节外，你必须知道在发生故障时应该联系谁。他们的姓名、电子邮箱地址和电话号码是多少？\n\
  \n## 2.3 容量规划（Capacity Planning）\n\n容量规划是由确定资源需要什么容量而进行的计算。应用程序的业务所有者应该能够提供有关应用程序如何使用的以下细节：\n\
  \n- 平均用户每天登录应用程序的时间有多长？\n\n了解系统的最大用户数以及平均事务的资源利用率，将让你能够估计需要多少磁盘空间、内存、网络带宽和其他资源。这让你能够准确地估计硬件（即服务器）需要多强大。\n\
  \n容量规划应该在获取应用程序硬件之前进行。如果你知道用户群将大幅扩大，你可能还想重复此过程。例如，如果你的组织即将与另一公司合并或收购另一公司，你就需要考虑增加硬件资源。\n\
  \n如果你正在获取 COTS（商业现成软件）应用程序，供应商可能已经为潜在客户完成了容量规划计算。他们经常提供一张图表或表格，按用户是持续、频繁还是偶尔使用进行分类。另一个表格可能会列出将输入应用程序的数据记录或条目数量。\n\
  \n## 2.4 遗留系统（Legacy Systems）\n\n你的应用程序涉及任何遗留系统吗？在这种语境下，遗留系统指的是比大多数系统都旧的软件应用程序或计算机系统。这个问题意义非常重要：遗留系统的支持级别可能比大多数应用程序低。如果是第三方应用程序，供应商可能不再支持它。如果它是内部编写的，那么开发人员可能不再在该机构工作，或者可能不再属于开发小组。无论何种情况，如果遗留系统出现问题，你可能需要绕过问题而不是找人来修复它。\n\
  \n\n\n\n另一个需要你关注遗留系统的原因是，它们比全新的应用程序更容易被替换。如果它们被替换，那么很可能会对你支持的应用程序产生影响。当新系统安装时，应用程序之间的接口可能会发生。即使替换系统与遗留系统完全相同，你仍然需要测试接口，以确认一切都能按预期工作。\n\
  \n## 2.5 托管模型类型\n\n应用程序有若干种不同的运行或托管方式。每种方式都有其优缺点。最常见的托管模型有：\n\n### 2.5.1 内部托管\n\n\
  组织从供应商处获得软件许可，并在内部计算机上运行它。应用程序的大部分责任由组织“拥有”。通常会与供应商签一份支持性许可，因此如果发生问题，供应商人员将帮助研究并解决这些问题。\n\
  \n这种模式的优点是客户保留了对一切的绝对控制权。硬件和数据由客户拥有并管理。对于一个喜欢掌握自己命运的组织来说，这是应该选择的模型。\n\n内部托管的缺点是它需要投入更多的资金来购买硬件、软件许可并聘用人员来支持该应用程序。\n\
  \n### 2.5.2 由供应商托管\n\n在供应商托管模型中，所有硬件都属于供应商并位于其设施内。你的用户连接到供应商的服务器来运行应用程序。根据你与供应商签订的合同，你可能拥有专用的服务器，也可能拥有由共享物理服务器托管的虚拟服务器。除非你代表一个非常、非常大的安装实例，否则你可能不会拥有专属于你的服务器。\n\
  \n对于由供应商托管的应用程序有几种不同的术语。其中一个术语是 `ASP`——应用程序服务提供商（Application Service Provider）。另一个是\
  \ `SaaS`——软件即服务。另一个术语是“按需软件”。正如 IT 行业的许多其他方面一样，供应商托管应用程序的细节处于不断变化的状态。后续章节提供了 `ASP`\
  \ 和 `SaaS` 的具体定义。\n\n### 2.5.2.1 应用程序服务提供商 (ASP)\n\n通常，`ASP` 托管应用程序意味着每个客户都有一个为他们构建的特定环境。客户是该环境的“单租户”，与其他供应商的其他客户共享它。\n\
  \n### 2.5.2.2 软件即服务 (SaaS)\n\n软件即服务是指将应用程序软件和数据托管在云端的模型术语。客户可能会共享相同的资源，即服务器、软件和数据库。这一概念被称为“多租户模型”。\n\
  \n用户使用网络浏览器访问应用程序。在 `SaaS` 或 `ASP` 环境中常见的业务应用程序包括会计应用程序、发票应用程序、客户关系管理（CRM）系统、人力资源管理（HRM）应用程序和帮助热台管理系统。\n\
  \n### 2.5.3 供应商托管环境的优缺点\n\n就像生活中的几乎所有其他事物一样，选择供应商托管环境也有其优缺点。其中一些优缺点列在以下章节中。\n\n\
  ### 2.5.3.1 支持与更新\n\n供应商托管模型的一个显著优势是你将所有支持和更新的烦恼都转嫁给了供应商。例如，以下责任现在属于供应商而不是你的组织：\n\
  \n* 他们必须保持服务器和软件的运行。\n* 他们必须设计、设置并测试 DR（灾难恢复）设施。\n* 他们必须聘用并留住合资的、胜任的 IT 人员以保持服务器运行。\n\
  * 他们必须安排并处理服务器操作系统的升级。\n* 他们必须处理所有服务器上应用程序软件的升级。\n\n### 2.5.3.2 稳定性\n\n选择供应商托管路径的一个重大风险是，你依赖于供应商是胜任的、人员充足且经济稳定的。如果他们缺乏这些任何一个属性，你可能会后悔自己的决定。\n\
  \n你如何知道供应商是胜任的、有足够的技术人员来支持他们的客户群体，并且将长期经营下去？从他们现有客户那里获取推荐。如果它是上市公司，他们的财务信息将是公开的。检查它。查看行业媒体和博客上的评论。努力参加当地的用户组会议并与其他客户交谈。参加全国性会议会得更好，因为那可以让你有更多的人可以建立人脉。\n\
  \n### 2.5.3.3 安全性\n\n如果你选择托管模型，需要考虑的一个潜在漏洞是你放弃了对数据的控制权。如果数据在别人的机器上，那么他们就拥有了访问权限。他们的员工有权访问，或者可能获得访问权限。一个心怀不满的员工可能会暴露供应商整个客户群体的机密信息。另一方面，供应商可能非常关注数据安全，以至于他们投入的资源可能比你的组织要多。\n\
  \n在考虑这个潜在漏洞时，在你开始批评供应商之前，你必须对自己的安全水平保持现实。你的内部系统有多安全？是否执行了以下所有步骤？\n\n* 是否有人定期为服务器操作系统安装最新的补丁？\n\
  * 你的服务器是否运行所有应用程序软件的最新版本？\n* 你是否实施了强密码要求？\n* 你是否删除了或至少禁用了服务器上不需要的软件组件？\n* 你是否禁用了操作系统和应用程序的默认账户？\n\
  * 如果存在默认账户，是否更改了默认密码？\n* 你的组织是否有一个专门的、训练良好的安全团队？\n* 是否在你的服务器和网络上进行渗透测试？\n* 是否定期检查安全日志？\n\
  \n如果你不能诚实地对上述所有问题回答“是”，那么你的安全性可能并不比你考虑的供应商更严密。也许唯一的区别是你到目前为止很幸运。或者更糟，也许系统已经被入侵了，但你还没有发现。\n\
  \n### 2.5.3.4 锁定\n\n另一个需要考虑的点是被锁定在任何供应商托管应用程序中的风险和成本。如果你的组织对应用程序或供应商的响应都不满意，那么迁移到另一个应用程序将变得也不快。例如，如果应用程序的性能无法满足你的预期，你对此无办法。你唯一的解决方案是与供应商合作。如果供应商对你的担忧和请求没有响应，那么你基本上受限于目前的应用程序。\n\
  \n从任何应用程序迁移到另一个都不容易，但在处理托管环境时，似乎你有更多的鸡蛋放在了他们的篮子里。离开供应商的托管站点可能需要他们的协助或参与。如果迁移的原因是供应商没有响应，你认为一旦他们得知你正在终止合同，他们会变得更有响应性吗？\n\
  \n## 2.5.4 成本比较\n\n比较不同托管模型之间的成本是很的，因为这就像比较苹果和橘子。内部托管的启动成本显然更高，因为必须购买所有的计算机硬件。这种模式的人力成本也最高，因为你聘用人员来执行许多行政类型的工作。\n\
  \n\n\n\n供应商托管应用程序的许可费用可能会比你自己获取许可并在自己的硬件上运行要高。。但如果你考虑到你不需要购买硬件、维护数据中心、获取数据库许可或雇佣大量\
  \ IT 人员，那么它的费用可能并没有初看起来看起来那么昂贵。\n\n供应商会辩称，由他们来托管应用程序更廉，，因为他们可以汇集硬件、软件和人员，并将这些成本分摊到所有客户身上。利用规模效应可以帮助他们以更低的成本提供服务。这是一个非常有说服力的论点。\n\
  \n如果你的组织已经支持许多应用程序，并且拥有一个完全运行的数据中心以及支持该数据中心的人员，那么内部托管可能更具效益。在这种情况下，你的组织已经在利用规模效应了。例如，你的\
  \ `DBAs`（数据库管理员）和数据库许可可能正在支持多个应用程序。你的网络团队、安全团队和系统管理员的情况也是如此。\n\n## 2.6 Web 应用程序\
  \ vs. 客户端/服务器应用程序\n\n软件应用程序通常被描述由三个主要部分组成：\n\n- 显示组件——它将数据和图形显示在用户的屏幕上\n- 应用程序逻辑——应用基于业务的决策和处理\n\
  - 存储组件——存储和检索数据，通常在关系型数据库中\n\n### 2.6.1 客户端/服务器应用程序\n\n客户端/服务器应用程序要求在每个用户的桌面上都安装软件。该软件包括显示逻辑，通常还包括业务逻辑。客户端/服务器应用程序与存储组件通信以访问请求的数据，但所有其他处理都在用户的桌面电脑上完成。\n\
  \n这种方法既有优点也有缺点。缺点包括以下：\n\n- 如果桌面级计算机无法胜任，性能可能会成为一个大问题。磁盘空间不足、磁盘驱动器缓慢、内存不足或处理能力限制都可能导致应用程序的运行速度用户无法接受。\n\
  - 软件存在于每个用户的桌面上。如果需要安装新版本，则也必须安装。显然，这需要花费时间和精力的。\n- 如果某个特定用户在机器上加载了多个应用程序，这些应用程序之间可能会相互作用并导致严重问题。通常，这是由于新安装的应用程序安装了新版本的\
  \ `DLL`（动态链接库）引起的。如果这个新版本的 `DLL` 更改了现有应用程序所需的接口，那么现有应用程序可能会停止工作。这通常被称为“DLL 地狱”（DLL\
  \ hell）。新的桌面操作系统允许安装多个版本的 `DLLs`，但世界上有许多运行 `Windows XP` 的桌面很容易受到此问题的影响。\n\n客户端/服务器方法的优点是：\n\
  \n- 通过仅向存储组件请求数据，从数据存储层请求的信息量减少到了最低。如果你考虑一个典型应用程序的屏幕，数据占百分之几，其他内容占百分之几（例如背景图像、标签、按钮、框架等）？通常，数据在呈现给用户的内容中占很小比例。由于只有活动数据从数据库中拉取，客户端计算机和存储服务器之间传递的信息量减少到了最低。\n\
  - 客户端/服务器软件是相对静态的。只有当应用程序管理员或用户选择更新它时，它才会更改。我见过一些基于客户端/服务器的应用程序在每次启动时都会自动向供应商的“总部”检查。如果有可用更新，将会自动下载。\n\
  \n### 2.6.2 Web 应用程序\n\nWeb 应用程序与更传统的客户端/服务器应用程序不同，主要体现在显示和应用程序逻辑部分：\n\n- 显示组件仍然运行在用户工作站上，但使用的是浏览器（例如\
  \ `Mozilla Firefox`、`Microsoft Internet Explorer` 或 `Google Chrome`）作为显示工具，而不是由供应商提供的专用程序。\n\
  - 应用程序逻辑执行在 Web 服务器上，而不是用户的工作站上。\n- 存储组件通常不会发生太大变化。它继续运行在专门提供数据库功能的服务器上。\n\n支持 Web\
  \ 应用程序可能比支持客户端/服务器应用程序要挑战得多。其主要原因是这种组合环境比传统环境更复杂：\n\n- 涉及的软件部分更多；例如，插件、`HTML` 和\
  \ `Java script` 在后台运行以允许应用程序正常工作。除非你对应用程序非常熟悉，否则你不会知道所有涉及的各个部分。\n- 其中许多部分不受你的控制。例如，你对每个用户在桌面上使用什么种浏览器或哪个版本的浏览器几乎没有控制力。你可以反复告诉用户应用程序\
  \ `XYZ` 仅针对 `Internet Explorer 9` 认证，但我向你你会收到用户的投诉，说应用程序在他们的计算机上无法运行。在调查之后，你会发现他们在使用\
  \ `Internet Explorer 10` 或 `Opera` 或另一个不支持的服务器。\n- 网络吞吐量至关重要。如果网络中断或显著减慢，应用程序将迅速变得非常迟钝。我会建议你，问题出在网络上的机会非常其微。将未知的性能问题归咎于网络很容易，但大多数时候，结果证明是其他原因。在指责网络之前，请确保你有一些证据。第\
  \ 24 章——“UNIX 工具”提供了你可以使用的工具信息，用以判断问题是否由网络问题引起。\n- 用户使用各种类型的计算机、操作系统和 Internet 浏览器。所有这些组合，加上操作系统和浏览器的各种配置选项，使得很难确定问题的具体原因。\n\
  - 防火墙和端口问题可能会令人沮丧，因为昨天还能用的东西今天可能失效了。维护防火墙中的所有规则并不容易，团队偶尔会犯错，你的应用程序可能会受到影响。第 15 章提供了可以用于识别哪些防火墙端口开放的工具信息。\n\
  \n总来说，支持 Web 应用程序比客户端/服务器应用程序更难还是更简单？很难泛泛回答这个问题。这很大程度上取决于应用程序本身。有些很难支持，而另一些更容易处理。\n\
  \n在 Web 应用程序下，某些事情更简单，而某些事情更困难。建立一个新用户更容易，因为你不需要在他或她的电脑上加载软件。通常，你只需要将他们的帐户添加到应用程序中，并给他们在\
  \ 浏览器中访问的 URL 即可。\n\n另一方面，由于组件和相互连接的数量更多，排查访问或性能问题可能会更困难。这里只是你必须调查的几个可能原因。这些原因中的许多适用于客户端/服务器和\
  \ Web 应用程序：\n\n- 用户是否在 Web 浏览器中输入了正确的 URL？\n- 他或她是否在使用支持的浏览器？\n- 用户在应用程序是否有帐户？\n\
  - 用户是否正确输入了他们的 ID 和密码？\n- 用户应用程序帐户是否已启用？\n\n\n\n\n\n- 用户的网络账户在活动目录（Active Directory）中是否启用？\n\
  - 用户与 Web 服务器之间的防火墙端口是否开启？\n- DNS 名称解析是否正确？\n- Web 服务器是否存在资源问题，例如：磁盘空间、内存、数据库连接？\n\
  - 应用程序的各项服务是否在 Web 服务器上运行？\n- Web 服务器上的负载均衡器运行是否正常？\n- Web 服务器与数据库服务器之间的防火墙端口是否开启？\n\
  - 数据库服务器是否正常？\n- 应用程序在数据库服务器上的账户是否过期？\n- 数据库软件是否在数据库服务器上运行？\n- 数据库服务器资源是否耗尽，例如：磁盘空间或内存？\n\
  \n## 2.7 应用程序的总拥有成本 (TCO)\n\n在运行应用程序的总成本中，你支付给供应商的许可费用只是冰山一角。一些经常被忽视的成本包括：\n\n-\
  \ 年度维护费用是一笔巨大的支出。对于这项年度支出，占应用程序原始成本 22% 并不是罕见的比例。\n- 软件安装成本。务必将人员的时间以及与安装相关的任何顾问费用计算在内。\n\
  - 定制的咨询费用。许多应用程序非常复杂，以至于组织的员工无法对开箱即用的应用程序进行定制以满足组织的需求。如果由供应商人员或承包商进行定制，费用可能会迅速变得非常贵。\n\
  - 硬件——虽然摩尔定律说硬件速度每 18 个月翻一倍，但硬件尚未达到免费的程度。\n- 培训成本累积成多。务必包含所有的培训成本，包括应用程序管理员、用户和帮助热台人员。你可能认为不培训员工可以省钱，但那是一种虚假的经济。你仍然会为生产力降低以及未经培训或培训不足的员工所犯的错误而付出代价。\n\
  - 数据中心的房产成本。\n- 数据中心的电力和冷却成本。\n- 内部支持成本，即：网络管理员、安全团队、服务器管理员等。这些成本可以分摊到多个应用程序中，但它们确实存在。\n\
  - 中间件和其他支持软件的成本。例如应用程序使用的数据库。不要忘记包含其他支持软件，如 `IBM WebLogic`、报告包、监控工具以及类似 `CommVault`\
  \ 的备份软件。\n- 磁盘空间成本，包括用于备份的磁盘空间。\n\n# 第 3 章：架构\n\n## 摘要\n\n许多软件开发项目都是构建在底层框架之上。软件框架是供应商用于开发其产品的复用平台。文中列出了框架的示例。提供了应用程序服务器的定义。列出了三层架构中每一层的详细分分。提供了中间件的示例。解释了虚拟服务器的概念。概述了负载均衡和集群的优缺点。\n\
  \n### 关键词\n- 软件框架；应用程序服务器；三层架构；中间件；虚拟服务器；集群；负载均衡；纵向扩展 (scaling up)；连接池；代码库\n\n##\
  \ 3.1 应用程序架构\n\n许多软件开发项目都是构建在底层框架之上。软件框架是供应商用于开发其产品的复用平台。使用框架的一些目标是让软件更容易编写、更具一致性，并使最终代码中的错误更少。\n\
  \n框架的目的是提供标准化的低级功能，以便程序员能够关注更高层次的设计需求。框架可能提供的功能示例包括：\n\n- 内存管理，即：分配和释放内存\n- 未使用内存的垃圾回收\n\
  - 异常处理\n- 调整窗口大小\n- 打开和关闭窗口\n- 移动窗口\n- 安全性\n- 编译器\n- 代码库\n- 应用程序编程接口 (`API`)\n-\
  \ 模板\n- 会话管理\n- 缓存\n\n框架示例有：\n\n- 用于 `Java` 的 `Spring Framework`\n- 用于 `Java` 的\
  \ `Apache Cocoon Framework`\n- 用于 `C#` 和 `Visual Basic` 的微软 `.NET Framework`\n-\
  \ 用于语言 `Ruby` 的 `Ruby on Rails`\n- 用于语言 `Python` 的 `Django` 框架\n- `Blueprint` 是用于\
  \ `CSS`（层叠样式表）的框架\n\n你所支持的应用程序可能基于框架，也可能不是。你并不知道它是否基于框架构建，但了解这一点以及特定的框架可以为你提供有用的背景知识。\n\
  \n你如何确定你的应用程序是否是构建在框架之上的以及它是什么？答案可能在安装手册中。安装手册的概述部分可能会指定使用的是哪种框架。如果没有明确提到，你可能根据开始应用程序构建过程之前必须在服务器上加载的软件来推断。例如，如果初步步骤之一是安装\
  \ `.NET`，那么 `.NET` 就是你的框架。如果你需要加载 `JRE`（Java 运行环境），那么使用的语言就是 `Java`，并且可能使用了也可能未使用框架。\n\
  \n除了框架之外，你的应用程序可能还依赖其他软件组件。其中某些组件将在本书后后部分进行详细探讨，但这里提供了它们的简要描述。你不需要成为这些方面的专家，但至少拥有它们是什么以及起什么作用入门知识是有用的。\n\
  \n`.NET` 是由微软创建一个编程框架。截至 2013 年，该包的最新版本是 `.NET Framework 4.5`。如果你的应用程序是使用微软语言编写的，那么在加载应用程序之前你可能需要安装\
  \ `.NET`。在计算机上运行多个版本的 `.NET` 是可能的。\n\n`Java` 是一种由 Sun Microsystems 开发并于 1995 年发布的编程语言。Sun\
  \ Microsystems 后来被 Oracle 公司收购。`Java` 的基本理念是允许程序员编写一次代码即可在任何平台上运行。这在很大程度上已经实现，目前\
  \ `Java` 运行在数百万台机器上。`Java` 特别适用于 Web 应用程序。\n\n你会遇到许多 `Java` 包或组件。主要元素有：\n\n- `JDK`（Java\
  \ 开发工具包）指的是面向 Java 开发者的产品。它包含了程序员编写 `Java` 应用程序时使用的众多工具。你可能不需要在生产应用程序服务器上加载 `JDK`。\n\
  - `JRE`（Java 运行环境）包含在计算机上运行 `Java` 应用程序所需的类库和支持文件。如果你支持的应用程序是用 `Java` 编写的，你可能需要将\
  \ `JRE` 加载到你的应用程序服务器上。加载 `JRE` 不需要需许可费用。\n- `JVM`（Java 虚拟机）是一个运行在你的服务器上的程序，用于创建一个自己的环境（即虚拟机），可以在其中执行\
  \ `Java` 字节码。在虚拟机中运行 `Java` 的优势是，当发生软件错误时更容易提供更详细的调试信息。如果你已经在服务器上加载了 `JRE`，那么 `JVM`\
  \ 就可以在服务器上运行。\n\n\n\n\nMicrosoft Internet Information Services (`IIS`)，以前称为 Internet\
  \ Information Server，是一个用于开发和托管 Web 及其服务的平台。`IIS` 仅运行在 Windows 上，例如 Windows `2008\
  \ R2` 和 Windows `2003`。该 Web 服务器的最新版本是 `7.5`。如果用户通过 Web 浏览器访问您的应用程序，那么服务器上很有可能需要这部分软件。\n\
  \nApache Tomcat 是一个由 Apache 软件基金会 (`ASF`）开发的开源 Web 服务器。Apache 是用于驱动 Web 服务器的最常用的软件包之一。\n\
  \n“应用程序服务器”一词可以指一种硬件（即服务器），也可以指一种支持软件。在第二种定义的语境下，应用程序服务器通过为 Web 应用程序提供基础服务来支持其。它可能提供的服务示例包括：\n\
  \n- 支持动态 Web 页面的构建\n- 处理数据库连接\n- 提供安全相关服务\n- 支持事务处理\n- 集群\n- 故障转移\n- 负载均衡\n\n通过依赖应用程序服务器，开发者可以专注于编写应用程序的高级功能。应用程序服务器通常与\
  \ Web 服务器（例如 `IIS` 或 `Apache`）以及 `SQL`（结构化查询语言）数据库协同工作。应用程序服务器的示例包括：\n\n- `WebLogic\
  \ Application Server` 是 Oracle 公司的基于 Java 的应用程序服务器\n- `IBM 的 WebSphere Application\
  \ Server`\n- `JBoss Application Server` 是一个基于 Java 企业版 (`EE`) 的开源应用程序服务器。虽然 `JBoss`\
  \ 是开源的，但红帽会对 `JBoss Enterprise Middleware` 收许可费用。\n\n`Oracle Client` 是一种中间件产品，用于连接到运行数据库服务器上的\
  \ `Oracle` 数据库。`Oracle-Client` 安装并不困难也不占用磁盘空间。一旦安装，它就提供了 `SQL*Plus` 或 `SQL Developer`\
  \ 等工具与数据库服务器之间通信所需的软件层。\n\n`JDBC`（Java 数据库连接 API）是一系列接口和类的集合，允许 Java 程序通过 `SQL`（结构化查询语言）语句与关系型数据库交互。如果您的应用程序基于\
  \ Java 并且连接到关系型数据库，那么您可能需要安装某种版本的 `JDBC`。已编写 `JDBC` 驱动的数据库列表包括：\n\n- `DB2`\n- `Informix`\n\
  - `Ingres`\n- `Oracle`\n- `Microsoft SQL Server`\n- `MySQL`\n- `Sybase`\n\n## 3.2\
  \ 历经风雨\n\n分类计算机设计的一种方法是客户端计算机是“胖”的还是“瘦”的。其他常见术语还有“肥的”、“精的”或“纤的”。对客户端计算机的引用指的是它自身能进行多少处理。瘦客户端除了显示服务器发送给的数据之外，处理相对较少。相比之下，胖客户端能够自己进行更多处理，对服务器的依赖程度也较低。\n\
  \n每种方法的优点是什么？瘦客户端需要的计算能力远少于胖客户端，这可以意味着设备价格更便宜。相反，由于胖客户端承担了更多工作，支持它们的服务器性能可以较低。在服务器宕机的情况下，胖客户端能够离线工作。它们还具有更好的多媒体性能。\n\
  \n## 3.3 层架构\n\n在设计计算机系统时，由其最大的组件通常被称为“层”（tiers）。图 3.1 显示了三层架构的布局。系统分解的三个主要层是：\n\
  \n- 客户端或表示逻辑层\n- 业务逻辑或应用处理层\n- 数据库层\n\n![image](img/F000030f03-01-9780123985453.jpg)\n\
  \n图 3.1 三层架构。\n\n表示层是用户看到并与之交互的部分。它向用户显示带有动态数据、标签和其他对象的屏幕。用户通过各种控件或“小部件”（widgets）与应用程序交互。一些常见的交互方式包括：\n\
  \n- 在文本字段中输入数据\n- 修改文本字段中的数据\n- 删除表格中的行\n- 拖放对象\n- 点击按钮\n- 点击菜单项\n- 点击链接\n- 高亮字段内容并复制它们\n\
  \n应用层（也称为业务逻辑层）是中间层。该层包含的内容示例包括：业务计算、业务对象的定义、控制业务对象的交互、实现安全性以及执行身份验证。此层从数据管理层请求数据，然后根据业务逻辑对其进行处理。结果被传递到表示层。\n\
  \n数据管理层（又称数据库层）是数据所在的地方。通常，这一层是一个关系型数据库管理系统 (`RDBMS`)，如 `Oracle`、`SQL Server`、`MySQL`\
  \ 或其他软件包。它不必是 `RDBMS`，它可以是面向对象的数据库或平文件的文件的集合。唯一的要求是应用程序层和数据管理层之间有一组定义良好的接口。\n\n\
  在架构中使用多层的主要优势之一是，只要与其他层的接口不改变，就可以对某层进行更改。例如，如果应用程序使用 `Oracle` 作为数据库软件包，可以重写数据管理层以使用\
  \ `Microsoft SQL server`。只要应用层和数据管理层之间的接口不变，这种更改就不会引起任何问题。\n\n另一个优势是每一层都可以从一个服务器移动到另一个，而不影响整体应用程序。可以通过升级运行应用程序或数据管理层的硬件来增加吞吐量或性能。你甚至可以在某一层实现负载均衡软件包，而无需对其他层进行任何更改。\n\
  \n一种常见的架构是利用上述层的三层架构。任何超过三层的设计通称为 n 层架构。附加层的示例包括：\n\n- Web 服务器层——与使用浏览器访问应用程序的用户交互的服务器软件\n\
  - 工作流层——处理应用程序内部的工作流逻辑\n- 外部接口层——处理与外部实体接口\n\n### 3.3.1 中间件\n\n什么是中间件？有一种类比将中间件比作家庭或办公楼中的管道系统。管道将各种组件连接在一起，例如，连接热水器到淋浴间的管子。支持应用程序的中间件也连接了组件或层。例如，应用程序可能调用函数库来完成任务。应用程序开发者可以从头开始编写这些函数，但重新创建代码库中已的代码并不符合效益。\n\
  \n我不愿意提供中间件列表，因为这可能会变得非常技术化。它还会引发关于到底什么是中间件的争论。以下是通常被认为是中间件的功能类型的简短列表：\n\n- 用于建立数据库连接的软件\n\
  - 用于建立网络连接的软件\n- 实现服务器之间 `RPC`（远程过程调用）交互的软件\n- 实现平台透明性的软件，例如，它可以在 EBCDIC 和 ASCII\
  \ 之间进行转换\n- 对象请求代理\n\n\n\n\n\n-   允许网络透明性的软件，例如，它可以在 `TCP/IP` 和其他协议之间进行转换\n-   文件传输软件\n\
  -   负载均衡软件\n-   允许不同数据库系统看起来像单一系统的软件\n- 允许应用程序连接到多个关系型数据库程序包的数据库网关产品\n- 允许应用程序与遗留应用程序集成的软件\n\
  -   启用单点登录（Single Sign on）的软件\n-   事务监控软件包\n\n## 3.4 计算机、CPU 与核心\n\n`CPU` 或中央处理单元是计算机的大脑。一个\
  \ `CPU` 可以存在于计算机内部的单个芯片上。多处理器计算机包含一个以上的 `CPU`。每个 `CPU` 都可以独立地执行指令。这些处理器可以位于同一块主板上，也可以位于多块主板上。对于强大的计算机（尤其是服务器）来说，多个处理器是常见现象。如果一台计算机拥有一个以上的处理器，根据处理器的数量，它被称为双处理器、四处理器等等。\n\
  \n一个 `CPU` 内部可以构建多个处理器，即在同一个集成电路上存在多个处理器。这些处理器中的每一个被称为一个 `core`（核心）。每个核心与同一芯片上的其他核心是相同的。随着\
  \ `CPU` 芯片组变得越来越微型，单个 `CPU` 内部可用核心的数量正在不断增加。\n\n多个处理器和多个核心的优势是它们比单核心或单处理器运行程序更快。事实上，今天购买的每台服务器都拥有多个处理器、多个核心或两者都有。\n\
  \n在涉及服务器、处理器和核心数量时，最重要的问题是应用程序是否利用了服务器上所有的处理器和核心。答案可能是定的，但为了确定，你必须从供应商那里获得这个问题的答案。一种来源是阅读他们的手册。先从`Installation\
  \ Manual”（安装手册）或`Application Administrator Guide”（应用程序管理员指南）开始。如果你在文档中没有找到，尝试联系他们的技术支持小组。一个拥有多个处理器和多个核心的服务器被一个无法利用它们的应用程序使用，将是资源的浪费。\n\
  \n确定 Windows 计算机是否具有多个处理器的简单方法是在命令行窗口中运行 `systeminfo`。该命令输出的其中一个部分告诉该计算机拥有多少个处理器。图\
  \ 3.2 显示了单处理器计算机的输出。图 3.3 显示了多处理器计算机的 `systeminfo` 输出。\n\n![image](img/F000030f03-02-9780123985453.jpg)\n\
  \n图 3.2 `systeminfo` 命令的输出。\n\n![image](img/F000030f03-03-9780123985453.jpg)\n\n\
  图 3.3 多处理器计算机上的 `systeminfo` 输出。\n\n![image](img/F000030f03-04-9780123985453.jpg)\n\
  \n图 3.4 `Task Manager`（管理器）显示 4 核心处理器的统计数据。\n\n![image](img/F000030f03-05-9780123985453.jpg)\n\
  \n图 3.5 显示具有多个处理器的计算机的 `Task Manager`（管理器）。\n\n要确定 Windows 计算机有多少个核心，请打开`Task Manager`（管理器）并点击`Performance`（性能）选项卡。该实用程序将以单个（即复合）图或多个图显示`CPU\
  \ Usage`（CPU 使用率）的详细信息。要在复合模式和单独图形之间切换，选择菜单项`View | CPU History`并选择“One Graph per\
  \ CPU”或“One Graph, All CPUs”。子菜单的具体措辞可能会根据运行的 Windows 版本而有所不同。\n\n将显示模式更改为“One Graph\
  \ per CPU”并检查显示的图的数量。如果只显示一个图，那么你正在检查的计算机具有单处理器和一个单核心。如果显示了多个图，则图的数量反映了处理器数量乘以核心数量。图\
  \ 3.4 是在一台具有四个核心的单处理器计算机上拍摄的截图。图 3.5 中的截图是在一台具有 24 个处理器的计算机上拍摄的，每个处理器都有一个核心。\n\n\
  ## 3.5 虚拟服务器\n\n在过去，大多数服务器都是专门用于单个应用程序。这使得管理它们变得更容易，并避免了应用程序不配合（即无法良好共处）时出现的问题。专用服务器易于设置和管理，但导致了数据中心存在大量利用不足的服务器的问题。随着服务器变得越来越强大，将一台强大的服务器专门用于一个未能充分利用服务器处理能力的单一应用程序或任务被认为是越来越浪费的。\n\
  \n解决这一问题的方案是开发一种软件，将一个物理服务器“划分”为若干不同的“虚拟”服务器。理想情况下，每个虚拟服务器都与运行在物理设备上的任何其他虚拟服务器完全分离。\n\
  \n虽然虚拟化软件很好并且在不断改进，但有时完全独立的虚拟服务器的理想并不总能实现。虚拟服务器的一个缺点是很难排查性能问题。它们也难以正确设置。虚拟服务器的另一个缺点是，如果物理设备宕机，托管在其上的虚拟服务器都会宕机。\n\
  \n虚拟化的优点远大于缺点。服务器整合可能是数据中心从物理服务器转向虚拟服务器的主要原因。与其拥有许多运行在 10%-20% 的物理服务器，虚拟服务器要经济得多。节省体现在功耗、冷却成本和硬件投资上。此外，更少的服务器可以进行管理，从而节省人员成本。\n\
  \n除了有效利用硬件这一显而易见的优势外，还有一些额外的优势。虚拟服务器的创建和销毁比物理服务器快得多、容易得多。如果你的环境需要频繁设置并丢弃服务器，虚拟化可能是你的最佳解决方案。另一个优势是可以轻松从模板创建许多相同的服务器。如果你重视一致性，那么这是虚拟服务器的另一个理由。\n\
  \n随着虚拟化成为主流，该领域的供应商数量已经增加。这些产品一些是开源的，另一些是专有的。其中一些著名的产品包括：\n\n-   `VMWare`\n-   `Citrix\
  \ Xen`\n-   `Microsoft Hyper-V`\n-   `Red Hat`\n-   `Oracle`\n-   `Proxmox`\n- \
  \  `Parallels`\n\n并不是所有供应商都认证其软件可以在虚拟机上运行。随着服务器虚拟化变得越来越普遍，这种情况越来越少。如果你计划将应用程序迁移到虚拟服务器，你应该从供应商那里确认这是一个支持的环境。要检查的地方是他们的网站。寻找你感兴趣的应用程序的规格页面。如果你在该文档中没有找到，请尝试联系他们的销售或支持小组。\n\
  \n如果你从供应商那里得知该应用程序已在虚拟机上运行，那么请确保你了解哪些环境是支持的。你不想在投资了 `VMWare` 软件后发现唯一认证的环境是 `Citrix\
  \ Xen`。此外，还要确保它可以在哪些版本的虚拟化软件下运行。\n\n\n\n\n\n如果你正在接手现有应用程序的支持工作，你可能想找出你的应用程序服务器是物理的还是虚拟的。如何判断呢？如果目标服务器运行的是\
  \ Windows 操作系统，请登录服务器并在工具栏上寻找以下图标。\n\n悬停在图 3.6 所示的最右侧图标上，会显示一个提示工具，指示该服务器是一个物理机。图\
  \ 3.7 中间的图标（即相互锁定的的正方形）表示这是一个运行 VMware 的虚拟服务器。\n\n![image](img/F000030f03-06-9780123985453.jpg)\n\
  图 3.6 表示服务器为物理机的图标。\n\n![image](img/F000030f03-07-9780123985453.jpg)\n图 3.7 表示服务器为虚拟的图标。\n\
  \n关于虚拟服务器需要记住的最后一点是，“虚拟”并不等同于“免费”。虚拟化通过减少数据中心中的服务器数量来引入经济效益。它们创建或销弃服务器的速度比购买和构建物理服务器快得多。但尽管具有所有这些优势，它们仍然需要费用。获取主机服务器是一项支出。虚拟化软件可能昂贵的。设置虚拟服务器的时间更快，但仍然存在。\n\
  \n一个容易被忽视的支出是软件许可费用。无论是物理服务器还是虚拟服务器，你都必须在服务器上加载经过许可的软件副本。例如，如果你有一台运行 `Windows 2008\
  \ R2` 的物理服务器，它托管了六台各运行 `Windows 2008 R2` 的虚拟服务器，那么你就必须为七份 `Windows 2008 R2` 付费。在设计或为你的架构定价时，不要忘记软件许可成本。\n\
  \n## 3.6 容错\n\n容错系统是指在发生一个或多个故障时仍能够继续运行或至少能够“优雅降级”的系统。故障的示例可能是服务器崩溃或磁盘损坏。实现容错并不容易也不廉价，因此它通常只出现在关键系统或涉及人类生命的系统中。如果你的应用程序是典型的业务系统（如工资单或人力资源系统），那么它可能不需要容错性。另一方面，如果你正在为商用客飞机的航空电子系统工作，那么设计一个容错系统就是合适的。\n\
  \n容错增加了系统的复杂性。增加了额外的硬件、额外的软件或二者兼有，以帮助确保系统从不宕机。从应用程序管理员的角度来看，这使得系统更难维护。它可能让你的工作变得困难的具体方式取决于它是如何实施的，但一些可能的方法包括：\n\
  \n*   安装将更加耗时，因为会有更多的服务器需要加载软件。\n*   关机和启动系统将变得更加困难。这是因为涉及了更多的服务器，而且因为在关闭系统和恢复系统时可能有更严格的步骤，例如，在关机“B”服务器之前必须先让“A”服务器关机。\n\
  *   监控日志文件将更加耗时，仅仅是因为文件更多了，而且它们分布在多台服务器上。\n*   监控整个系统将变得更加困难，因为有更多的服务器需要监控，而且因为你不想产生虚假报警。例如，在非容错系统中，如果“A”服务器宕机，可能是一个致命错误，并要求监控系统自动重启服务器。在容错系统中，如果“A”服务器宕机，则“B”服务器会自动接管主服务器的工作。“A”服务器可能需要手动重启，以确保它不会尝试夺回其作为主服务器的职位。\n\
  *   如果控制系统容错特性的硬件或软件出现问题，那么修复这些问题很可能会非常复杂。你可能需要供应商技术人员参与此过程。\n\n容错系统的另一个额外优势是，可以在不关闭系统的情况下安装升级。执行此操作的方法是：\n\
  \n1. 将其中一台服务器移出使用状态\n2. 在该服务器上安装升级\n3. 将其带回系统并使其成为主服务器（即活动服务器）\n4. 移除第二台服务器并在其上安装升级\n\
  5. 重复上述步骤，直到所有服务器都完成升级\n\n这个过程虽然更耗时，但如果你的应用程序绝对不能关机，那么这就是一种以零停机时间安装升级的方法。\n\n##\
  \ 3.7 在单台服务器上运行多个应用程序\n\n是否应该在单台物理服务器上安装多个应用程序？像大多数其他架构考虑因素一样，每种选择都有其优缺点。\n\n在单台服务器上运行多个应用程序的一些理由包括：\n\
  \n*   允许你利用空闲的 CPU 周期\n*   物理服务器减少意味着成本降低\n*   数据中心可以更小、更凉爽且运行成本更便宜\n\n不在服务器上运行多个一个应用程序的一些理由包括：\n\
  \n*   应用程序之间可能会相互影响并导致问题\n*   一个应用程序对另一个应用程序的性能影响可能是问题，特别是当一个应用程序被频繁使用时\n*   需要协调停机时间\n\
  \n在服务器成本下降且服务器虚拟化广泛应用的时代，这个问题的答案可能是“否”。如果你有许多资源需求较低的应用程序，你可能将它们安装在各自的虚拟机上更好。\n\n\
  ## 3.8 虚拟桌面\n\n应用程序可以运行在用户的桌面、Web 服务器或虚拟桌面上。一种允许创建虚拟桌面的软件示例是 `Citrix XenApp`。要访问此种实例，用户必须通过浏览器登录到应用程序服务器，并在会话窗口运行应用程序。\n\
  \n虚拟桌面的优点包括：\n\n*   不需要在许多桌面上加载应用程序。\n*   由于用户可以共享虚拟桌面上的实例，因此需要更少的应用程序许可。\n\n缺点：\n\
  \n*   引入了另一层需要安装、升级和其他维护的软件。\n*   某些软件供应商不支持这种实现其产品的方式。如果你遇到问题，就得自生自灭。\n*   如果虚拟桌面层或到它的连接出现故障，你的用户就倒霉了。\n\
  *   由于你需要跨网络访问应用程序，可能会出现性能问题。\n*   如果虚拟桌面上运行多个应用程序，可能会产生性能影响。\n\n允许创建虚拟桌面的软件示例包括：\n\
  \n*   `Citrix XenApp`\n*   `Microsoft Windows 2012 Remote Desktop Services`\n* \
  \  `VMware ThinApp`\n\n## 3.9 高可用性/高性能\n\n如果支持的应用程序具有某些极端需求，那么它在设计时可能考虑了高可用性或高性能。以下章节描述了这些环境。\n\
  \n### 3.9.1 集群\n\n计算机集群是指一组共同执行类似任务的计算机。集群的两个主要理由是为了：\n\n1. 提高性能或吞吐量\n2. 通过在主计算机故障时提供备用计算机来提高可用时间。\n\
  \n\n\n\n在冲出去为你的应用程序购买并安装服务器集群之前，你需要回答一个非常重要的问题——它是否需要运行在集群上？如果高可用性对组织来说并非至关重要，那么投入额外的硬件、软件和维护费用是否值得？同样，如果应用程序的性能不是问题，那么为集群环境支付费用是否值得呢？投资于一台性能更强大的单台服务器可能比一台计算机集群是更好的解决方案。\n\
  \n如果你决定采用集群环境，你需要意识到这可能会让应用程序的管理变得更加复杂。你可能会遇到的一些复杂情况包括以下方面：\n\n*   **安装**将变得更加复杂，因为通常你必须在在每个集群成员上单独安装应用程序软件。一旦构建了各个集群成员，你将进入一个定义集群成员的过程，并识别出哪台是主计算机，哪些是备用计算机。\n\
  *   **升级**也将变得同样复杂。你必须对集群的每个成员应用升级。如果你足够幸运的话，你可能可以在不关闭整个集群的情况下应用升级。这可以通过将备份服务器从集群中移除、对其进行更新、将其返回集群，然后将其变为主服务器来实现。接着，你再对所有非主服务器应用升级。\n\
  *   **备份**将更加复杂，因为涉及到多台服务器。确保在集群环境上线之前已经练习过从备份中恢复。恢复生产环境并不是那种你希望在用户等待应用程序恢复时才去练习做的事情。\n\
  *   如果应用程序是**基于 Web**的，用户输入什么 URL 来访问应用程序？如果主服务器宕机，他们是继续使用相同的 URL，还是需要输入不同的 URL\
  \ 来访问备用服务器？\n*   你想要创建一个与生产环境完全相同的测试或 QA 环境。因此，如果生产环境由四台服务器组成的集群组成，那么你的 QA 环境中也需要四台集群服务器。请务必在成本估算中包含这些额外的开销。\n\
  \n### 3.9.2 负载均衡\n\n负载均衡是一种使用额外的硬件组件来增加吞吐量、减少响应时间并增加可用时间的技术。在负载均衡环境中添加的组件示例包括 Web\
  \ 服务器、数据库服务器、处理器、网络链路和磁盘驱动器。\n\n负载均衡和集群是类似的，但并非完全相同的概念。一种解释是，集群通常包含负载均衡，但负载均衡并不一定包含集群。例如，可以设置如下所示的环境：\n\
  \n1.  负载均衡软件捕获用户打开应用程序会话的请求。\n2.  应用程序运行在位于不同城市的多个独立服务器上。\n3.  负载均衡器根据某些标准将新请求分配给某个服务器，可能是最空闲的服务器或物理上距离用户最近的服务器。\n\
  \n上述环境描述了一个不包含集群的负载均衡环境。\n\n某些应用程序设计为在负载均衡环境中工作，但你不应该做任何假设。阅读安装文档或联系供应商的支持团队，以确定你所支持的应用程序是否可以在负载均衡环境中工作。\n\
  \n### 3.9.3 心跳与故障转移\n\n计算机系统中的**心跳**（heartbeat）是计算机相互监控的方法，以确保所有计算机都运行正常。假设你的环境包含一台主计算机和一台备用计算机。备用计算机需要一种方法来确认主计算机正在运行。心跳是计算机之间的一种信号方法，让它们能够相互监控。如果备用计算机没有看到主计算机的心跳，它将认为主计算机已故障。然后它将接管并成为主计算机。\n\
  \n心跳的设计有非常多种方法。如果你的应用程序采用了心跳技术，那么你就不需要自己设计或编写它。作为应用程序管理员，你需要理解以下内容：\n\n*   心跳是如何实现的。\n\
  *   它可能如何出错。\n*   必要时如何重置它。\n\n### 3.9.4 增加复杂性\n\n向系统中添加集群或负载均衡会使其变得更加复杂。这会导致成本增加并使管理变得困难。如果使用应用程序的用户数量远在单台服务器可以处理的范围内，那么你可能想要重新考虑设置集群或负载均衡环境。如果不需要，为什么要增加额外的开销呢？\n\
  \n再次，如果你的生产环境包含集群或负载均衡，那么你必须为测试或 QA 创建一个相同的环境。在计算应用程序环境的总成本时，需要包含这一费用。\n\n你的应用程序生产环境需要在\
  \ QA（质量保证）、测试或阶段性环境（staging）中进行复制。如果生产环境包含集群、故障转移或负载均衡等复杂性，那么 QA、测试或阶段环境也需要具备集群、故障转移或负载均衡。之所以这样做是因为你永远不想在生产环境中进行任何尚未在相同的\
  \ QA、测试或阶段环境中测试过的更改。\n\n这样做的成本会更高，但你的生产环境越复杂，这条建议就越有价值。如果你从整个章节中只记得几条建议，那么这两条是你需要记住的：\n\
  \n1.  生产环境需要进行镜像。\n2.  在先在相同环境中进行测试之前，永远不要在生产环境中进行任何更改。\n\n## 3.10 操作系统\n\n操作系统或\
  \ O/S 是管理计算机内存、硬件和软件的软件。它使计算机与磁盘驱动器、键盘、显示器、鼠标、打印机、扫描仪和网络等硬件组件通信。操作系统允许多个应用程序在计算机上同时运行并在它们之间切换控制权。没有功能的操作系统，计算机基本上是没用的。\n\
  \n可能需要做的决策之一是运行 32 位还是 64 位操作系统。应用程序可能需要其中一种，或者可以在两者上运行。32 位和 64 位系统之间的主要区别在于内存的访问和管理方式。利用\
  \ 64 位操作系统编写的应用程序在 64 位系统上运行更好。\n\n操作系统有各种尺寸和复杂程度。世界上最大的超级计算机有操作系统，你的微波炉也是。运行你应用程序的服务器几乎都有一个现成的商业操作系统。最常见的选择有：\n\
  \n*   Windows\n*   Unix\n*   Linux\n*   Apple 的 Mac OS X\n\n## 3.11 Windows vs.\
  \ UNIX vs. Linux\n\n关于这些操作系统哪个好哪个坏的争论可能会很快升级为一场宗教般的狂热。我不会参与这种争论。我也不会推崇其中某一个而不是其他的。应用程序管理员没有权利选择服务器的操作系统。很可能是以下情况之一将控制该决策：\n\
  \n1.  应用程序兼容的操作系统。\n2.  将使用的服务器上已有的操作系统。\n3.  数据中心系统管理员支持经验丰富的操作系统。\n\n### 3.11.1\
  \ Windows\n\n\n\n\n微软自 1985 年以来就开始营销 Windows 操作系统。第一个版本基本上是其现有操作系统 `MS-DOS` 提供的一个图形用户界面。从那时以后，Windows\
  \ 的发布非常稳定，甚至是定期。该软件从 16 位扩展到 32 位，然后扩展到 64 位。每个新版本通常代表了可访问内存量的增加、功能的提供、安全性的改进以及更直观的用户界面。\n\
  \n## UNIX\n\nUNIX 操作系统于 1969 年开发于 AT&T 贝尔实验室。原始版本是用汇编语言编写的，但到 1973 年，大部分已用 `C` 语言重写。在后的多年里，它经历了无数次修订、衍生，以及关于哪一个版本才是“官方”版本的分歧。UNIX\
  \ 是全球数千台服务器使用的操作系统。\n\n## Linux\n\nLinux 起于 Linus Torvalds 的一个编写新操作系统的个人项目。Torvalds\
  \ 向编程社区寻求帮助以扩展和改进 Linux。它作为开源软件免费提供。一些公司销售 Linux 的版本，其中包含安装光盘、打印文档、安装工具、技术支持等。\n\
  \n## \n\n每个应用程序都需要存储空间，即存储在磁盘驱动器上的文件。应用程序服务器将有一个或多个驱动器。单个驱动器通常包含数百千字节（GB）的数据。虽然这些存储量看起来可能比实际使用的要多，但它的消耗速度总是比你预想的要快。\n\
  \n如果服务器上连接了多个驱动器，每个驱动器上运行的是什么呢？在 Windows 服务器上，通常的是驱动器号从 `C` 开始并向后递增。每个驱动器上通常包含的内容所示：\n\
  \n* `C:`：操作系统（O/S）文件\n* `D:`：应用程序文件，包括可执行文件\n* `E:`（如果存在）数据、临时或日志文件\n\n只应将 O/S 文件加载到\
  \ `C:` 盘的原因有两个：\n\n1. 它能最大限度地减少应用程序安装损坏 O/S 文件的概率\n2. 应用程序创建的数据文件、日志文件和其他输出文件往往会增长。如果它们在\
  \ `C:` 盘上增长，可能会耗尽所有可用空间。如果发生这种情况，系统可能会崩溃。如果它们消耗了另一个驱动器上的所有空间，应用程序将崩溃，但服务器不会。\n\n\
  ### 存储区域网络 (SAN)\n\nSAN 是一种向其他服务器（例如应用程序服务器）提供磁盘存储的网络资源。你的服务器不是使用物理连接的本地驱动器，而是从\
  \ SAN 上分配驱动器空间。使用 SAN 最明显的风险是，所有的磁盘 I/O 流都通过应用程序服务器与 SAN 设备之间的网络进行流式传输。如果你的网络没有足够的带宽，那么使用\
  \ SAN 并不是一个现实的替代方案。\n\n为什么选择使用 SAN 而不是本地驱动器？使用 SAN 驱动器的理由包括：\n\n* 组织可以购买更大、更快、更经济的驱动器，并在多个应用程序服务器之间共享。这为组织节省了资金和行政工作量。\n\
  * 如果使用了虚拟机，则必须使用 SAN 驱动器，因为物理硬盘无法连接到虚拟机上。可以这样想——虚拟机没有物理驱动器可以插入的连接器。\n* SAN 驱动器比物理连接到服务器的本地驱动器更灵活。例如，假设你的应用程序加载到连接到服务器的\
  \ 100 GB `D:` 盘上。如果这 100GB 都用完了，你能做什么？你可以买一个更大的驱动器，并将所有内容从旧驱动器拷贝到新驱动器。当然，这将需要应用程序停机。你可以购买额外的驱动器并将其安装为\
  \ `E:` 盘。然后你必须配置应用程序以识别并使用新驱动器。你可能还需要从 `D:` 盘拷贝一些文件到 `E:` 盘，以释放 `D:` 盘的磁盘空间。如果使用的是\
  \ SAN 驱动器，你只需要联系 SAN 团队并请求扩大你的 `D:` 盘即可。此而已。没有麻烦，没有混乱，也没有停机时间。\n* SAN 团队可以使用 `RAID`（独立磁盘冗余阵列）技术配置\
  \ SAN 后面的物理驱动器。`RAID` 可以提供更快的访问速度和冗余，因此如果其中一个驱动器故障，数据不会丢失，应用程序可以继续工作。\n* 作为应用程序管理员，你将存储资源的责任“外包”给专门的团队。你不需要成为存储技术专家。有一个团队专门负责这个专长领域，他们为整个组织做出决策。\n\
  * 备份可以针对整个组织进行管理，而不是逐个应用程序地进行。这可以使备份过程更快、更一致、更可靠。同样，这让你作为应用程序管理员将这一方面外包给专门团队。\n\n\
  你需要与供应商确认的一个问题是应用程序是否支持 SAN 驱动器。某些应用程序尚未通过与 SAN 驱动器使用的认证。这背后的逻辑是供应商认为 SAN 驱动器的性能无法满足应用程序的需求。本质上，如果\
  \ SAN 慢，应用程序就会慢。供应商不想在网络或 SAN 慢时被埋怨。\n\n这里的建议——如果你的应用程序出现性能问题且服务器使用 SAN 存储，供应商支持团队很会将问题归咎于\
  \ SAN。另一方面，你的内部 SAN 团队会坚持认为问题不是由于 SAN 或网络引起的。这让你处于一个非常尴尬的境地。你能做的最好就是收集网络性能统计数据以帮助识别根源。更好的是，获取应用程序性能“正常”时的基准网络统计。一些最广泛使用的\
  \ SAN 软件包包括：\n\n* 3PAR\n* Dell\n* EMC\n* HDS\n* HP\n* IBM\n* Intransa\n* MPC\n*\
  \ Sun Microsystems\n* Xiotech\n\n你如何发现你的组织使用的是 SAN 而不是本地驱动器？最确定的方法是询问你数据中心的技术人员。有一些命令可以提供此类信息，但它们返回的结果有很多例外。询问构建服务器的团队可以确保你在所有情况下都能得到正确答案。\n\
  \n### 固态硬盘 (SSD)\n\n固态硬盘是一种使用内存而非磁盘驱动器存储数据的数据设备。SSD 最大的优势是由于它是全电子化的，因此没有移动部件。这使得它比磁盘驱动器快得多。除了比硬盘更快，SSD\
  \ 也更可靠。缺点是它们更贵，而且容量没有硬盘能达到的大。随着时间的推移，SSD 的容量正在增加，价格正在下降，因此如果它们现在对你来说并不实用，那么一两年后可能就可行了。\n\
  \n在对 SSD 进行重大投资之前，你必须确定它们是否会对你的应用程序产生重大影响。获取这些信息的最佳来源包括：\n\n* 联系你的应用程序供应商的技术支持小组，询问是否可以有利地将\
  \ SSD 加入环境。尝试获取具体的细节，例如你预计实际可以看到哪些性能提升。\n* 与其他使用该应用程序且测试或实施了此类环境修改的客户交流。如果你能够参加供应商的用户组会议，这将询问其他应用程序管理员经验的绝佳场所。\n\
  \n\n\n\n- 如果可能，请租用一台 SSD 设备并在内部进行测试。当然，你将在应用程序的 QA 或测试环境中执行此操作。你必须在安装和使用 SSD 的前后运行压力测试。\n\
  \n## 3.13 你的服务器是什么样子的？\n\n通过此，我并不是在问它是否是一个前面装有许多闪烁灯光的米白色箱子。我指的是组成服务器的硬件、软件和网络连接。你应该了解或能够查找到所有服务器的一些基础细节如下：\n\
  \n- 它是物理的还是虚拟的？\n- 如果是虚拟服务器，它运行在什么种虚拟化软件包上？\n- 它有多少个处理器？\n- 它有多少个核心？\n- 每个 CPU 的速度是多少？\n\
  - 它有多少内存（RAM）？\n- 有多少缓存内存？\n- 有多少个 `NICs`（网卡）？\n- 上运行的是什么操作系统？\n- 什么版本和服务补包？\n-\
  \ 有多少块磁盘？\n- 每个磁盘有多大？可用空间有多少？\n- 磁盘是本地连接到服务器、SAN（存储区域网络），还是两者的结合？\n\n你如何获得上述问题的答案？每个操作系统都有工具或命令可以提供这些信息。\n\
  \n对于 Windows 服务器，最好的工具之一是 `systeminfo` 命令。该命令将提供你所需的大部分细节。图 3.8 显示 `systeminfo`\
  \ 命令的输出。要获取核心数，你可以打开任务管理器。图 3.4 显示了一台四核心单处理器计算机。\n\n![image](img/F000030f03-08-9780123985453.jpg)\n\
  \n图 3.8 `systeminfo` 命令的输出。\n\n在 Windows 中获取总磁盘空间和可用磁盘空间的方法有两种。一种是打开 Windows 资源管理器。然后右键点击磁盘并选择`属性`。将显示一个与图\
  \ 3.9 所示所示的屏幕。对计算机上剩余的任何磁盘驱动器重复此过程。\n\n![image](img/F000030f03-09-978012398553.jpg)\n\
  \n图 3.9 Windows 资源管理器下的属性界面。\n\n另一种获取 Windows 服务器磁盘驱动器信息的方法是通过计算机管理实用程序。通过点击`开始\
  \ | 管理工具 | 计算机管理`打开计算机管理。打开后，点击左侧面板中的`磁盘管理`。图 3.8 显示了服务器上 `C:` 和 `D:` 驱动器的详情。每个驱动器都显示了容量和可用空间。\n\
  \n## 3.14 扩展\n\n应用程序的使用似乎总是处于扩张或收缩状态。如果应用程序被证明对用户有价值，那么他们就会扩大对其的使用。这可以通过添加更多数据或使用之前未使用的功能来实现。增加用户是应用程序使用扩展的另一种方式。应用程序的使用可能会扩展到其他部门、办公室、城市或国家的用户。\n\
  \n另一个原因是你的组织或公司经历了合并或收购。如果发生这种情况，M&A 团队将你的应用程序与其他公司用于执行相同工作的程序进行比较，并决定保留哪一个，放弃哪一个。如果他们决定保留你的应用程序，那么你可以预计其使用量将大幅增长。\n\
  \n你如何扩展以满足大幅增加的使用量？这里列出了一些显而易见的选择。在没有获得供应商建议的情况下做这些决定。他们很有可能帮助过其他客户进行类似的扩展。\n\n\
  - 获取具有更快处理器的服务器\n- 获取具有更多处理器的服务器\n- 获取具有更多核心的处理器\n- 为服务器分配更多内存\n- 使用额外的服务器建立集群或负载均衡环境\n\
  - 分布服务器，例如，将服务器部署在北美、欧洲、亚洲等地区\n\n在冲出去购买额外服务器之前，你应该分析新用户的预期使用量。增加的使用量可能并没有预期中那么大。新用户也可能位于不同的时区。如果是这样，使用量将均匀分布在全天，而高峰使用量不会显著增加。\n\
  \n## 3.15 数据库\n\n除了最简单的应用程序外，所有程序都会连接到数据库来存储和检索数据。某些应用程序使用专用数据库，但大多数将连接到主要的市售可用关系型数据库管理系统之一。`Oracle`、微软的\
  \ `SQL Server`、`IBM DB2` 和 `MySQL` 是一些最常用的数据库产品。\n\n作为应用程序管理员，你将希望尽可能多了解数据库。这里列出了你想要了解的一些细节。关于数据库的更多信息请见第\
  \ 8 章和第 9 章。\n\n- 数据库软件运行在什么服务器上？它很可能不在应用程序服务器上。\n- 应用程序和数据库服务器之间通信使用哪些端口？\n- 你可以独立于应用程序访问数据库吗？你将使用什么工具？\n\
  - 数据库的设计如何？\n- 你可以更新统计信息吗？\n- 你可以添加、删除或修改索引吗？\n- 你可以访问数据库引擎生成的任何日志吗？\n- 你可以访问性能统计吗？\n\
  - 哪些配置设置可以调优以提高性能？是否有文档记录？\n- 是否有工具可以查看提交给数据库的实际查询？\n- 数据库流量可以锁定特定的应用程序吗？\n- 哪个账户拥有应用程序？这通常被称为\
  \ `DBO`（数据库所有者）。\n- 数据库目前有多大？\n- 它增长到多大会遇到问题？\n\n### 3.15.1 连接池\n\n当用户启动需要从数据库获取数据的活动时，应用程序与数据库建立连接，请求数据，然后关闭数据库连接。这种方法简单，但效率低下，因为与数据库连接非常耗时，与其不断创建和销毁连接，不如复用连接。复用连接的概念被称为连接池。\n\
  \n要确定应用程序连接数据库时何时连接池，你需要参考文档。首先检查《安装手册》或《管理员指南》。如果在任何手册中都找不到关于连接池的信息，请联系供应商的支持小组。\n\
  \n如果应用程序使用了它，你可能可以控制建立并池的最大连接数。此设置可能在安装应用程序时指定，或者在配置文件中。如果你更改了此设置，可能需要停止并启动应用程序才能生效。\n\
  \n注意，每个连接都会消耗一定量的内存。将此值设置得太大会导致内存浪费，但设置得太小可能会影响性能。如果你认为此设置影响了应用程序性能，你需要与供应商和 DBA\
  \ 协作确定任何时刻所需的连接数。\n\n应用程序使用的数据库也必须编写为允许连接池。以下关系型数据库软件包都支持池化：\n\n- `IBM DB2`\n- `Microsoft\
  \ SQL Server`\n- `Oracle`\n- `MySQL`\n\n## 3.16 代码库\n\n\n\n\n\n在软件开发领域，代码库（code\
  \ base）意味着用于创建应用程序的源代码集合。基于单一代码库进行开发是理想的，因为所有精力都可以集中在这一份源代码上。如果应用程序有多个代码库，供应商就需要支持更多的软件，其资源也会分散得更薄。最终导致的结果可能是在研究和纠正客户报告的问题时，响应速度较慢。\n\
  \n既然拥有多个代码库是一个如此糟糕的主意，那么为什么供应商还会允许它们存在呢？一些解释如下：\n\n*   供应商正在运行多个多个且显著不同的应用程序版本。例如，他们可能正在支持\
  \ `3.0`、`4.0` 和 `5.0` 版本。供应商在促使客户升级的力度上各不相同。有些供应商愿意让客户在早已被取代的版本上；另一些则更严格，要求客户尽可能保持应用程序的最新版本。\n\
  *   不同的代码库可能运行在不同的操作系统上，例如 Windows 版本和 UNIX 版本。如果应用程序是最近编写的，这不应该需要不同的代码库。\n*   应用程序可能存在客户端-服务器版本和\
  \ Web 版本。如果它们是用不同的语言或由不同的团队编写的，那么它们可能不会共享同一个代码库。\n\n## 3.17 中间件\n\n什么是中间件？有一种类比是将中间件与家庭或办公建筑中的水路相比。水电将各种组件连接在一起，例如，管道连接了热水器和淋浴。支持应用程序的中间件也将组件连接在一起。例如，应用程序可能会使用调用的函数库来完成任务。应用程序开发者可以从头编写这些函数，但重写它们并不划算。\n\
  \n我不想提供一份中间件列表，因为可能会变得非常技术化。它还会引发关于到底什么是、什么中间件的争论。以下是通常被认为是中间件的功能类型的简单列表：\n\n* \
  \  用于建立数据库连接的软件\n*   用于建立网络连接的软件\n*   允许服务器之间进行 `RPC`（远程过程调用）交互的软件\n*   实现平台透明性的软件，例如在\
  \ `EDCDIC` 和 `ASCII` 之间进行翻译\n*   对象请求代理（Object Request Brokers）\n*   允许网络透明性的软件，例如它可以在\
  \ `TCP/IP` 和其他协议之间进行转换\n*   文件传输软件\n*   负载均衡软件\n*   允许不同数据库系统看起来像单一系统的软件\n*   允许应用程序连接到多个关系数据库包的数据库网关产品\n\
  *   允许应用程序与遗留应用程序集成的软件\n*   启用单点登录（Single Sign on）的软件\n*   事务监控包\n\n# 第 4 章：许多应用程序的通用特性\n\
  \n## 摘要\n\n本章描述了许多第三方（`COTS`——现成软件）应用程序常用的特性。这些特性包括报告、用户偏好、数据、数据导入方法、应用程序管理工具、日志文件、导航、菜单、面包屑导航、仪表板和工作流。\n\
  \n### 关键词\nCOTS；模块；定制；配置更改；用户偏好；数据类型；数据库；导入；管理控制台；日志文件；面包屑导航；仪表板；工作流；cookies\n\n\
  所有应用程序都是独特的，但它们经常具有共同特性。通过识别许多应用程序共享的特性，你可以显著降低学习新应用程序的曲线。本章的每一节都描述了应用程序经常提供的特性。理解即使是完全不同的应用程序也有相似之处，将帮助你在看到它们时识别出它们。\n\
  \n## 4.1 应用程序中的多个模块\n\n应用程序通常提供多个模块，在购买软件时可以单独购买，例如 `HR`（人力资源）模块、`AR`（应收账款）模块、`AP`（应付款）模块等。你的组织可能购买了其中的部分或全部。如果你最初没有购买，供应商也非常乐意在未来的任何时间点将它们卖给你。\n\
  \n在某个时刻，你会被问到“我们的环境中安装了哪些模块？”你需要准备好快速准确地回答这个问题。在以下情况下，知道答案尤为重要：\n\n*   你的老板问你\n\
  *   用户问你\n*   供应商的支持服务台问你\n*   你正准备执行升级\n*   你正在景观图或其他技术文档中记录系统。\n\n你该如何识别安装了哪些模块？一种方法是将其写下来。这种做法的缺点是你需要跟踪那张纸或文本文件。还存在有人在你不知情的情况下添加或删除模块的风险，导致你的文档过时。\n\
  \n最佳解决方案是学会从应用程序本身或运行应用程序的服务器上获取这些信息。每个应用程序都是不同的，但有一些通用方法可以识别加载和激活了哪些模块。这些细节可能在《管理员指南》（`Administrator’s\
  \ Guide`）中。如果那里没有，那么下次你与供应商技术合作时就询问他们。他们几乎会让你知道这个秘密。获取这些信息的潜在方法包括：\n\n*   登录应用程序并选择\
  \ `Help | About` 菜单选项。\n*   登录应用程序并在初始屏幕的“秘密”位置上点击右键。我工作过的一个应用程序在在你右键点击他们的 Logo\
  \ 时会显示版本信息。\n*   远程连接到应用程序服务器并检查相应的 `.ini` 文件、配置文件或属性文件。\n*   远程连接到应用程序服务器并检查应用程序启动时写入的日志文件。这些日志文件的前几行通常会标识版本和加载的模块。\n\
  *   远程连接到应用程序服务器并查看 `Windows Registry`。非常小心不要在 `Registry` 中进行任何更改。\n*   连接到应用程序使用的关系型数据库，并在正确的表中执行\
  \ `SELECT` 查询。如果这是你确定版本的方法，供应商技术支持将为你提供这些细节。\n\n## 4.2 定制与配置更改\n\n定制和配置更改之间的区别是什么？每小时\
  \ 250 美元。说真的，这两种操作都会更改应用程序运行的方式以及用户看到的方式。区别在于，其中一种（配置）通过修改现有代码或功能来实现这些更改；而另一种（定制）则需要对应用程序背后的代码进行更改。更改代码非常耗时，需要大量的测试，并且耗资巨大。除非有充分的理由，否则供应商不愿意进行代码更改。\n\
  \n你的供应商可能用其他术语称为这些概念，但这些概念几乎存在于他们的环境中。你绝对需要知道如何实现组织对应用程序的修改。如果更改可以通过配置更改来实现，那么那太好了。如果必须进行代码定制，那么你真的需要坐下来决定：\n\
  \n*   这些更改真的是必要的吗？\n\n\n\n\n\n- 该应用是否符合你的需求？当然，如果你已经购买了 `license` 并安装了软件，那么现在才产生这种感悟可能有点太晚了。\n\
  - 在现有系统中，是否有其他方法可以让你获得想要的内容？潜在的替代方案可能不是最优雅的解决方案，但几乎比定制化方案要更快、更便宜。\n\n以下是通过配置更改实现的某些修改示例：\n\
  \n- 在数据库表中添加字段\n- 添加或修改屏幕\n- 在屏幕上添加或修改字段\n- 添加工作流\n- 添加或修改菜单\n- 添加或修改报告\n- 添加或修改数据结构\n\
  \n如果你计划通过配置更改来应用程序的外观和感受，请务必了解其操作方法。例如：\n\n- 谁可以进行配置更改？\n- 这种功能仅限于应用程序管理员吗？\n- 在其他用户正在使用应用程序时可以进行这些更改吗，还是所有用户都需要先注销？\n\
  - 更改需要停止并启动应用程序（即重启）才能使更改生效？\n- 配置更改可以回滚吗？\n- 为了实施配置更改，是否需要对数据库进行修改？\n- 你的组织是否建立了相关程序，要求所有更改在在\
  \ `PROD` 环境执行之前在 `DEV` 或 `QA` 环境中进行并测试？\n- 使用什么类型的文件来存储配置数据？例如：`.ini` 文件、`.properties`\
  \ 文件、`.config` 文件等。\n\n如果你绝对必须进行被视为定制的更改，那么你需要与供应商进行深入讨论。你首先需要做的是极其具体地说明你想要什么。如果你不够精确，供应商很有可能会误解你的需求，导致你最终对生成的更改感到不满意。\n\
  \n一旦你准确解释了你的需求，可以向供应商询问的一些问题包括：\n\n- 代码更改的费用是多少？\n- 这个数字有多准确的？\n- 如果成本超过报价金额，超出的部分由谁支付？\n\
  - 实现这些更改需要多久？\n- 谁来测试修改后的代码？\n- 如果更改不符合规范，由谁承担成本？\n- 你的更改会进入与其它客户共享的代码库吗？你的组织是否将这种定制视为一种你不希望公开的竞争优势？如果是这样，你从一开始就应该通知供应商这一点。\n\
  - 应用程序的更新如何影响你的定制？这些定制会在更新中被保留吗，还是你必须重新安装它们？\n\n## 4.3 用户报告\n\n组织似乎依赖于报告生存。许多组织的逻辑似乎是报告越多越好。编写报告会是你的职责之一，还是可以由经验更丰富的用户处理？如果这是你必须处理的事情，请预料花费的时间将比你预想的要长。用户社区会不断请求新报告或对现有报告进行修改。对你来说，如果这项功能由用户社区中经验更丰富的成员处理将会好得多。\n\
  \n无论是你还是另一个团队的人员负责开发报告，报告子系统是否有任何培训或文档？虽然图形化的拖放报告看起来很容易创建，但当你尝试构建灵活、复杂的报告时，难度比看起来要大得多。前期投入的任何培训从长远来看几乎都能收之回报。\n\
  \n为了满足对报告的需求，几乎每个应用程序都包含了某种类型的报告包。报告生成器可能是供应商专门为其应用程序编写的，即专有的报告生成器。更有可能的情况是他们许可了现有的报告包，如\
  \ `Crystal Reports`。无论哪种情况，你都可能能够选择并运行现有的制制报告，或从头创建一个报告。\n\n如果应用程序中没有嵌入报告功能，可以使用其他工具来创建吗？你可以获取并安装类似下面列出的工具吗？你可能可以，但要注意，连接到应用程序的数据库可能并没有你想象的那么简单。理解数据库的设计方式会更加复杂。当供应商设计数据库时，他们通常不是为了让初学者容易理解：\n\
  \n- `Cognos`\n- `Crystal Reports`\n- `Microsoft Reporting`\n- `Oracle Reports`\n\
  - `Tableau`\n- `VBA`\n- `Scripts`\n- `常规编程语言`\n\n报告包很可能允许你使用图形化显示来创建报告。它将显示表或数据对象的列表。你有能力将所需的列拖放到模板或工作区域中。一旦你选择并安排了你想要的数据，就可以对其进行格式设置和排序。添加摘要字段是一个很常见的功能。完成报告后，你可以将其保存以便以后使用。报告通常可以按需运行，或调度在指定的日期和时间运行。\n\
  \n你想要确保理解的某些细节是：\n\n- 谁可以创建报告？所有用户、具名用户还是属于特定组的用户？\n- 如果 `User A` 创建了报告，`User B`\
  \ 可以使用吗？\n- 如果 `User A` 创建了报告，`User B` 可以修改它吗？\n- 如果报告遇到错误，会发生什么？应用程序会向日志文件写入条目吗？它会通知某人（例如创建者）错误吗？\n\
  - 报告可以处理不同的语言、货币、字母等吗？\n- 如果报告创建了一个巨大的文件会怎样？它会继续运行，还是系统会检测到失控并终止它？此事件会被记录吗？\n- 编写糟糕的报告会影响其他用户的性能吗？\n\
  - 如果报告子系统有更新或修正，供应商会提供给你吗，还是你需要处理编写报告工具的公司？\n\n### 4.3.1 无报告生成器的报告\n\n如果应用程序没有包含报告包，仍然可以创建报告。如果应用程序基于关系型数据库，那么可以使用\
  \ `SQL` 命令创建良好的报告。当然，你必须能够编写 `SQL` 或很快学会它。\n\n你可以创建一个可以在桌面或服务器上运行的可行的报告系统。在桌面计算机上运行的一个缺点是，如果在计划执行报告时你的电脑没有运行，那么它就不会启动。用于创建报告的某些可用组件包括：\n\
  \n- 从 `DB` 获取数据的 `SQL Plus` 命令\n- 任务调度程序用于自动运行报告\n- 消息软件用于手动将报告电子邮件给接收者\n- `Excel`接收者可以使用\
  \ `Excel` 打开 `CSV` 文件\n\n第一步是编写一个包含 `SQL` 语句的文本文件。此示例从多个 Oracle 表创建一个报告。`SELECT`\
  \ 语句的输出可能看起来奇怪，但为了让数据以逗号分隔的形式输出，创建的每一列都需要逗号分隔。下面所示的语句这样做。该查询可以适用于任何数量的报告。\n\n###\
  \ 4.3.1.1 文件 roster.sql 的内容\n\n```sql\nspool Roster.csv\n\nSELECT ‘Class,Student,Status,Grade,Completion\
  \ Date’ FROM dual;\n\nSELECT c.LongName||‘,'||a.StudentName||‘,'||a.Status||‘,'||a.score||‘,'||TO_CHAR(a.DateTime,‘yyyy-mm-dd')\n\
  FROM Record a, Student b, Class c\nWHERE b.Student_ID = a.Student_ID\nAND b.Class_ID\
  \ = c.Class_ID;\n\nspool off\n\nexit\n```\n\n\n\n\n第 2 步编写一个命令文件来执行查询。这里有一个简单的命令文件示例，它可以创建一个名名单（Roster）报告并将其写入\
  \ CSV（逗号分隔值）文件中。此示例调用了 Oracle 的 SQL Plus 来执行 SQL 语句。也可以使用像 SQL Server 这样的数据库包。\n\
  \n将数据写入 CSV 文件的好处是，当接收者双击文件时，它会在 Excel 表格中打开。这样你就可以让 Excel 来完成格式化工作。\n\n### 4.3.1.2\
  \ 文件 `roster.cmd` 的内容\n\n```cmd\necho ****** Running Roster Query *******>> Roster.log\n\
  echo set echo off feed off pages 0      >> %0.tmp\necho whenever sqlerror exit sql.sqlcode\
  \ >> %0.tmp\nsqlplus -s /nolog @%0.tmp >> Roster.log;\nSet CURRDATE=%TEMP%\\CURRDATE.TMP\n\
  Set CURRTIME=%TEMP%\\CURRTIME.TMP\nDATE /T > %CURRDATE%\nTIME /T > %CURRTIME%\n\
  Set PARSEARG=“eol =; tokens=1,2,3,4* delims =/, ”\nFor /F %PARSEARG% %%i in (%CURRDATE%)\
  \ Do SET YYYYMMDD=%%l%%j%%k\nSet PARSEARG=“eol =; tokens=1,2,3* delims =:, ”\nFor\
  \ /F %PARSEARG% %%i in (%CURRTIME%) Do Set HHMM=%%i%%j%%k\nRENAME Roster.csv Roster_%YYYYMMDD%_%HHMM%.csv\n\
  SendEmail.vbs Roster_%YYYYMMDD%_%HHMM%.csv\n```\n\n第 3 步是调度命令文件的运行。图 4.1 中的截图显示已定义了一个名为\
  \ Roster 的任务。在本示例中，使用了 Windows 任务计划程序来启动脚本。这也可以在 UNIX 或 Linux 服务器上使用 `cron` 轻松实现。\n\
  \n![image](img/F000042f04-01-9780123985453.jpg)\n\n图 4.1 Windows 计划任务工具。\n\n###\
  \ 4.3.2 报告输出格式\n\n你可能想要答案的细节是：应用程序报告生成器可以创建哪些输出格式？这很重要，因为你创建的“报告”可以用于完全不同的用途。一些常见的输出文件类型列在表\
  \ 4.1 中。\n\n表 4.1 文件格式及其典型用途\n\n| 输出文件格式 | 典型用途 |\n| --- | --- |\n| xls | 表格文件，例如\
  \ Microsoft Excel |\n| csv | 可以用 Excel 打开。也经常用于批量输入文件 |\n| txt | 用户容易打开和读取 |\n|\
  \ HTML | 用户容易打开和读取 |\n| PDF | 用户容易打开和读取 |\n| XML | 批量输入文件 |\n\n### 4.3.3 报告分发\n\n\
  报告必须分发给需要它们的人才能产生价值。因此，你需要理解的报告包的另一个功能是：如何分发报告？一些可用选项包括：\n\n- 报告本身通过电子邮件发送。虽然这种方法对接收者很方便，但可能会给系统带来巨大压力。例如，如果每天向\
  \ 1000 个接收者发送一份 20 页的报告，这会浪费多少带宽？如果大多数接收者根本不看这些报告，这种情况将尤为困扰。\n- 发送一封电子邮件通知接收者报告已可用。如果接收者想查看报告，他们点击电子邮件中嵌入的\
  \ `URL`（该 URL 充当链接）。弹出的网页将显示他们的报告。发送一封简单的电子邮件而不是大尺寸附件显然要高效得多。\n- 报告输出可以 `ftp` 发送到另一个服务器。想要报告的用户知道去该位置取。。\n\
  - 如果与报告系统的用户界面是网页，则可以直接从网页下载报告。例如，用户可能可以在报告上点击右键，并选择“另存为”，将其复制到本地硬盘。\n- 报告可以发布在\
  \ SharePoint 或另一个门户系统上。用户访问门户来获取他们想要查看的报告。\n\n### 4.3.4 报告拆分（Bursting）\n\n报告拆分（Bursting）是一个运行一次报告并将输出有选择性地分发给多个接收者的过程。例如，可以为整个组织运行一份销售报告。每个区域经理将收到一封仅包含其地区销售数字的电子邮件。报告拆分的概念用于将报告分发给预定的接收者列表。\n\
  \n在定义要拆分的报告时，你必须提供额外的细节，例如定义如何分割报告的拆分键（burst key）。在上面的示例中，拆分键是 `region`。第二个键通常称为“接收者”键，决定了报告的每个部分将如何分发。如果你的应用程序支持报告拆分，文档将提供有关如何定义这些键的细节。\n\
  \n### 4.3.5 授权用户创建报告\n\n并不是每个应用程序用户都应该被允许创建、修改或调度报告。如果允许每个人创建报告，系统可能会充斥着不准确、过时的报告。将创建报告的能力授予相对少的用户要有效得多。\n\
  \n其他应严格控制的报告相关权限有：\n- 删除报告的能力\n- 修改现有报告的能力\n- 调度报告的能力\n- 修改接收者列表的能力\n\n这些信息可能位于配置文件或应用程序的类似位置。\n\
  \n## 4.4 管理员报告\n\n用户并不是唯一需要报告的人。管理员也有许多需要查看的数据项。管理员可能想要查看的报告示例包括：\n\n- 按注册、激活、禁用划分的用户数\n\
  - 当前在线用户数\n- 最近一天、周、季度和年的运行时间和停机时间。你可能需要此报告来证明你满足了 `SLA`（服务等级）。\n- 按小时、天划分的交易数\n\
  - 按用空间和可用空间划分的磁盘使用情况\n- 显示用户登录和注销时间的报告\n\n对于基于 Web 的应用程序，跟踪用户注销可能是困难的。因为如果用户点击窗口右上角的“X”而不是点击“注销”按钮，处理注销事件可能就不会被激活。只是一个友情警告。\n\
  \n是否存在关于报告的报告，即一份列出应用程序生成的所有报告的报告？以下细节对于满足信息查询非常有帮助：\n\n- 报告名称\n- 运行日期时间\n- 接收者\n\
  - 上次运行时间\n- 状态\n- 调度人\n- 首次运行日期\n- 输出文件名\n\n## 4.5 电子邮件\n\n应用程序生成电子邮件并不常见。某些可能创建并发送的电子邮件示例包括：\n\
  \n- 问题通知\n- 报告分发\n- 向管理员发送潜在问题（如磁盘空间不足）的警告\n- 备份成功或失败通知\n- 新账户的登录详情\n- 工作流信息\n\n\
  设置和维护应用程序电子邮件功能时，你需要回答的一些问题包括：\n\n- 应用程序将使用哪个邮件服务器？你组织的邮件服务器名称以及可能存在的类型需要输入到配置文件中。\n\
  - 如果组织的邮件服务器发生变化，你如何在应用程序中更改这些信息？\n- 应用程序发送的电子邮件将关联什么发件人名称和地址？应用程序并不在乎你输入什么，但你必须提供内容。再次，这些信息可能位于配置文件。\n\
  - 应用程序服务器和邮件服务器之间需要开启哪个端口？\n\n\n\n\n关于应用程序发送的邮件回执地址，这里有一条建议。如果某封邮件的接收者进行了回复，你希望这封邮件能送达给正确的人或小组。不要使用个人的姓名或电子邮件地址。你应该为应用程序创建一个账户并使用它。例如，不要使用像\
  \ `Kelly.Bourne@SomeCompany.com` 这样的回执地址，而应使用 `ApplicationName@SomeCompany.com`。这样，即使\
  \ Kelly 离开了公司，邮件回复也会投递给正确的人或小组。这还能让其他人在 Kelly 休假期间为该应用程序提供支持。\n\n你需要意识到，某些类型的附件可能会被你的电子邮件服务器或目标服务器拦截。这样做是因为某些文件类型更有可能携带危险的“载荷”，例如病毒、恶意软件等。通常，扩展名为\
  \ `.exe`、`.jar` 和 `.bat` 的附件文件会被拦截。产生的错误信息并不总是能清楚说明问题的原因。因此预先警告，并非所有文件附件都能到达目的地。\n\
  \n## 4.6 用户偏好\n\n许多应用程序允许个人用户定义他们对应用程序外观和感受的偏好。每个用户都可以在有限范围内调整应用程序的外以适应自己的需求。必须注意的是，用户偏好不等同于自定义或配置更改。用户偏好通常是与个人用户账户关联的简单更改。\n\
  \n通常可以配置的更改示例包括：\n\n- 标签、菜单项、按钮标签、链接等使用的语言，例如：英语、法语、德语、俄语等。\n- 成本或值的表示货币单位，例如：美元、英镑、欧元等。\n\
  - 分隔美元和分的字符。通常是小数点或逗号。\n- 用户所在的时区。\n- 工作周的天数，例如：周一至周五对比周六至周三。\n- 日期的表示格式，例如：`MM/DD/YY`\
  \ 或 `DD/MM/YY`。\n- 测量单位，例如：公制对比英制。\n- 假日\n- 用户登录时显示的第一个屏幕\n- 默认排序偏好，例如：从小到大对比从大到小。\n\
  \n应用程序管理员通常可以设置适用于新账户的默认用户偏好。某些应用程序允许不同的用户组设置不同的用户偏好集。例如，所有定义在北美地区的用户可能有一套默认偏好；而\
  \ EMEA（欧洲、中东和非洲）的用户可能会有另一套默认偏好。一旦用户熟悉了系统，他们就可以更改自己的偏好。\n\n你肯定会被问到关于用户偏好的问题，因此你希望提前知道答案。除了知道哪些对象可以修改外，你还需要知道如何设置所有这些偏好。还需要还需要如何取消这些设置，以防用户在设置自己的偏好时过于“冒险”。\n\
  \n一个非常有价值的建议是准备一份单页的“备忘表”，涵盖关于用户偏好的最常见问题。如果你手头有这份表并分给新用户，就能节省很多回答的时间。你可以考虑在给新用户提供登录信息时发送它。可以从供应商提供的文档中复制，也可以自己编写。无论哪种方式，提前这样做从长远来看都是值得的。\n\
  \n## 4.7 数据\n\n每个应用程序都处理数据。数据从外部看可能可见，但在内部，应用程序大部分都是数据。没有数据，就无法记录信息、无法存储信息，也没有可以操作的对象。\n\
  \n### 4.7.1 数据类型\n\n应用程序支持哪些数据类型？大多数应用程序支持“普通”数据类型，如整数、字符、浮点数等。应用程序可能支持的其他数据类型还包括：\n\
  \n- 日期\n- 时间\n- \n- BLOB（二进制大对象），通常是图像\n- 货币\n\n### 4.7.2 数据库\n\n几乎每个重要的应用程序（无论是自开发的还是第三方的）都将数据存储在某种数据库中。一个非常简单的应用程序可能通过一组文件就能运行，但那种级别的应用程序可能不需要应用程序管理员。关系型数据库是最常见的数据库设计。某些应用程序利用面向对象的数据库，但那些相对少见。如果使用关系型数据库，它几乎不是由供应商提供的。它很可能是少数\
  \ `RDBMS`（关系型数据库管理系统）软件包之一，如 `Oracle`、`Microsoft SQL Server`、`Sybase` 或 `MySQL`。\n\
  \n拥有多个数据库的组织可能在员工中拥有一个或多个数据库管理员（`DBAs`）。这些 IT 专家支持数据库软件就像你支持应用程序一样。DBA 的职责包括以下：\n\
  \n- 安装数据库软件\n- 应用供应商提供的更新和补丁\n- 遇到错误时与供应商进行交互\n- 创建新数据库\n- 确认数据库备份是否成功完成\n- 恢复损坏或需要恢复到较早状态的数据库\n\
  - 当数据库空间耗尽时，扩展其可用磁盘空间\n- 解锁已锁定或禁用的账户\n- 杀死失控查询（即未完成的查询）\n- 检查 `SQL` 语句以识别不准确或无效的语句\n\
  - 添加或修改索引以优化数据库性能\n\n简而言之，DBA 是你组织 IT 部门中非常有经验且重要的成员。和员工中的所有 IT 专业人员一样，尽量不要浪费他们的时间。在提问显而易见的问题之前，你应该先花几分钟尝试自己找出。\n\
  \n确保你尽可能了解应用程序所使用的数据库。你可能想要了解细节包括：\n\n- 使用的是什么供应商的数据库，例如：`Oracle`、`Microsoft SQL\
  \ Server`、`MySQL` 等？\n- 数据库是否运行在独立的服务器上，如果是，是哪个服务器？某些应用程序（特别是较小的）可能将数据库在与应用程序相同的服务器上。\n\
  - 应用程序与数据库服务器通信使用什么端口？\n- 组织中谁负责数据库服务器？\n- 应用程序到底有多少数据库？这看起来像是个奇怪的问题，但我支持的几个应用程序在数据库服务器上有多个数据库。一个四个，一个三个，一个有两个。\n\
  - 另一个的问题是应用程序的所有数据库是否相同？我支持的一个应用程序有三个运行在独立服务器上的 `Microsoft SQL Server` 数据库，但第四个数据库运行在应用程序服务器上。那是一个\
  \ `Microsoft Jet` 数据库。他们这种异常设计的原理是 `Jet` 数据库只包含呈现给用户的表单。表单相对较少且不频繁更改。鉴于此，他们认为这些表单可以使用不需要所有全功能的数据库来支持。\n\
  - 数据库有多大，增长有多快？\n- 多久备份一次？\n- 如果数据库崩溃，从备份恢复需要多久？\n- 运行数据库的服务器可靠性如何？\n- 如果数据库服务器宕机，恢复它们的程序是什么？\n\
  \n\n\n\n\n# 当数据库宕机时，你的应用程序是如何处理这种情况的？我遇到过一些处理得并不应用程序。如果数据库宕机或应用程序丢失与数据库的连接，应用程序就会向其日志文件写入一条非常特定的消息，然后挂起。我们不得不部署一些监控来查找该日志文件条目，并在发生这种情况时向我们告警。然后我们会关闭应用程序并重启它。虽然这很尴尬，但总比等用户来提醒我们应用程序已崩溃要好。\n\
  \n支持企业级应用程序的关系型数据库本身就极其复杂。它们存储了海量且种类繁多的数据。现代数据库实践要求数据库被设计成所谓的“规范化”设计。本书并不打算教授数据库设计理论，因此我将用五个字来总结数据库规范化的影响——“非常多、非常多的表”。表非常多到以至于只有对该应用程序非常熟悉的人才能理解它。如果你确实要钻研该数据库，请务必在\
  \ `DEV`（开发）或测试环境中进行。你可不想在生产环境数据库中胡乱闯撞。\n\n在你作为应用程序管理员的职业生涯中某个时刻，你可能会被要求授予业务分析师或其他数据处理人员直接访问数据库的权限。他或她会轻描写地描述如何利用\
  \ `Excel`、`Access` 或其他软件包的功能，仅提取他们想要的数据而不包含其他任何内容。不惜一切代价拒绝此类请求！最重要的原因有：\n\n- 如果业务分析师不懂数据库结构（即表与表之间的关系），那么他们可能会创建一个包含错误信息的报告。这种错误可能会导致非常严重的业务影响！\n\
  - 编写得糟糕的查询会对系统性能产生重大影响。\n- 他们可能会向你请求大量协助，这将非常耗费时间。\n\n如果此类此类数据请求且无法避免，请尝试将其引导至以下方向之一：\n\
  \n1. 应用程序是否包含导出数据的功能？如果是，请尝试使用它。\n2. 创建一个报告，提取所需数据并将其写入 `XML` 或 `CSV` 格式的文件。\n3.\
  \ 付供应商编写一个 `SQL SELECT` 语句来提取所需数据，并根据需要执行它。\n\n## 4.8 喂数据！将大量数据导入或导出你的应用程序\n\n应用程序经常提供将大量数据导入或导出到系统的功能。这种能力可能是为了提供一种更简单或更准确的数据输入方式。也可能是为了提供一种导出数据的方法，以便将其用于馈入另一个应用程序。\n\
  \n你可能想通过批量导入执行的一些活动类型包括：\n\n- 批量注册新用户\n- 需要添加新数据的合并\n- 多个多样化应用程序的整合\n- 与业务伙伴、供应商、组织子公司或母公司之间/双方的数据馈送\n\
  \n你可能需要导入或导出的特定数据类型可能包括：\n\n- 用户及其详细信息\n- 用户所属的组\n- 安全性\n- 合同\n- 账户\n- 发票\n- 库存详情\n\
  \n导入或导出数据的目标可能都将通过一个或多个 `SQL` 语句来实现，这些语句直接从应用程序的数据库中选择或插入数据。然而，供应商数据库通常非常复杂（即高度规范化），除非你对数据库设计非常熟悉，否则你不应该自己完成操作。这在导入数据时尤为如此，因为涉及到引用完整性和依赖关系的考量。\n\
  \n应用程序可能包含一个导入或导出数据的工具。此功能可能位于一个只有管理员组组员才能访问的屏幕上。也可能是一个可以通过 `CLI`（命令行界面）访问的独立可执行文件。检查《管理员指南》文档以查看是否存在此类功能。\n\
  \n应用程序的导入功能将决定输入文件的格式。你的应用程序可能能够处理多种格式。你可能获得的常用格式有：\n\n- `XML` 文件\n- `CSV`（逗号分隔值）文件\n\
  - 制表符分隔值文件\n- 固定长度字段\n\n如果你正尝试进行批量导入过程，你将处理一个提供给你的文件。无论该文件是手动创建的还是从另一个应用程序导出的，你都应该做好准备，数据可能是“脏”的。我的意思是会发生一个或多个问题：\n\
  \n- 某些记录中将缺失数据字段。在导入具有缺失字段的记录之前，你需要了解应用程序将如何处理这种情况。导入工具可能会接受缺失字段并用空格和零代替，也可能会终止。\n\
  - 数据字段将不符合预期的顺序。\n- 姓名数据将不符合预期的格式。输入过程可能要求将姓名数据拆分为单独字段，例如：名、中间名首字母、姓。发送给你的数据可能包含在一个字段中。关于姓名的另一个潜在问题是某些人拥有连字符姓或多个姓。\n\
  - 某些字段中存在无效字符。例如，一个本应包含“True”或“False”的字段在某些行中将包含“Yes”和“No”值。\n- 为你提供的日期格式不符合预期。导入过程可能要求日期为\
  \ `MM/DD/YYYY` 格式。即使你向提供输入文件的组说明了这一点，文件中的日期也可能是不同的格式，例如 `DD/MM/YYYY` 或 `MM/DD/YY`。\n\
  - 如果你指定每行都以 `CR/LF`（回车/换行）字符结束，文件结尾可能只有 `LF` 字符。\n- 无论你指定文件应该或不应该有头，你准备导入的文件可能错了。\n\
  - 某些导入过程期望第一条或最后一条包含特殊值。可能是记录计数或“END”。如果导入过程有此类要求，请确保文件符合这些要求。\n- 字符串中的单引号（即“引号”）会对\
  \ `SQL insert` 语句产生严重问题。在 `SQL` 语句中，所有文本字段都以单引号开头和结束，例如“Smith”。如果单引号出现在字符串中间，例如“O’Malley”，那么\
  \ `SQL` 语句可能无法被数据库引擎执行。为了解决这个问题，你可能需要包含第二个单引号，例如“O''Malley”。如果需要这样做，你需要扫描输入文件，如果任何记录包含额外的单引号，则为其添加额外的单引号。\n\
  \n- 对涉及货币的假设不准确。例如，你假设是美元，实际上是欧元。\n- 测量单位不同，例如，磅和公斤，或者米而不是英码。\n\n你需要了解输入过程将如何处理所有潜在的数据异常。其中某些细节可能在应用程序文档中说明。如果你对如何处理其他异常有疑问，你需要进行测试。刻意创建一个包含问题的文件并导入到你的\
  \ `TEST` 或 `DEV` 环境中，查看应用程序如何处理它。\n\n\n\n\n清理新文件需要花费你时间，例如，重新格式化日期、填充空字段、确认记录是否正确终止等。这在你第一次从源头接收文件时尤为如此。请在你的计划中为这些潜在问题留出额外时间。在你对每个特定源完整运行几次整个导入过程之前，请预料会有问题发生。\n\
  \n无论你在运行导入操作时有多小心，事情都有极大的可能不会按照你预期的方式发展。在执行导入时，我建议遵循两条非常重要的建议：\n\n1. 确保你拥有数据库的最新备份。\n\
  2. 在尝试生产环境操作之前，先在测试服务器上练习任何批量导入或导出操作。\n\n数据文件多久到达一次并需要导入系统？\n\n* 每小时\n* 每天\n* 每周\n\
  * 每月\n\n如果数据文件定期到达，处理它们的过程可以自动化吗？你是否可以编写一个脚本来启动导入过程，并通过 `Windows Task Scheduler`、`cron`\
  \ 或 `Control-M` 进行调度？\n\n这里是一些可能发生的额外故障排除问题：\n\n* 如果文件没有在预期时间内到达会怎样？\n* 如果文件中包含不符合正确布局的记录会怎样？\n\
  * 如果文件无意中加载了两次会怎样？它是会崩溃（异常终止）还是你会得到重复数据？这些重复数据容易被删除吗？\n* 如果输入文件为空会怎样？\n\n输入过程如何处理意外情况？你可能需要提前查明，如果发生意外情况会怎样？系统是否会采取以下措施之一？\n\
  \n* 进程是否会停止？\n* 错误记录是否会被记录到文件中，然后输入过程继续？\n* 是否会自动通知任何人，例如，通过电子邮件或短信？\n\n## 4.9 应用程序管理工具\n\
  \n每个应用程序都提供了工具和实用程序，使应用程序管理员能够执行普通用户不需要执行的操作。事实上，如果普通用户从未听说过这些某些工具，那是最好的。学习这些工具的最佳地点可能是《管理员指南》或同等文档。学习这些工具的另一种方法是查看供应商是否为管理员提供培训。\n\
  \n仅限于管理员的功能示例包括：\n\n* 数据导入/导出实用程序\n* 用于配置、监控和控制应用程序的控制台\n* 用于启动和停止该应用程序的实用程序或脚本\n\
  * 创建备份\n* 从备份文件恢复数据库\n* 创建用户账户\n* 禁用或启用用户账户\n* 重置用户密码\n* 修改用户账户详情\n* 确定应用程序中有多少用户\n\
  * 锁定用户登录应用程序\n* 应用程序的性能监控\n\n应用程序经常提供两种类型的管理员工具：基于 GUI 的和基于命令行的。即使你偏于其中一种，你也应该精通这两种工具。其中一个原因是可能是，有时你可能可以使用基于命令行的工具，但无法使用基于\
  \ GUI 的工具。\n\n不言而喻的是，基于命令行的实用程序几乎肯定只在应用程序服务器上可用。你可能将其加载到你的桌面机器上，但极可能它只会在服务器上运行。\n\
  \n## 4.10 用于支持软件的控制台管理员工具\n\n你支持的应用程序并不是服务器上唯一可能有控制台的软件。同样运行在服务器上的支持软件也可以拥有控制台管理工具，通过该工具你可以控制应用程序或环境。你可能会遇到的其他软件产品包括：\n\
  \n* `JMX Console`\n* `WebLogic Admin Console`\n* `Apache/TomCat`\n* `JBOSS`\n* `IBM\
  \ 的 WebSphere`\n\n`WebLogic Server` 是一个支持企业 Web 应用程序的平台。你的应用程序可能依赖 `WebLogic Server`\
  \ 来处理底层功能，如缓存、连接池和安全，而不是将这些功能包含在应用程序本身中。图 4.2 显示 Oracle WebLogic Server 管理控制台的样子。如果你的应用程序使用\
  \ `WebLogic Server`，那么在首次安装时你需要打开此控制台来定义应用程序的细节。你还可能登录此控制台来调查性能问题。\n\n![image](img/F000042f04-02-9780123985453.jpg)\n\
  \n图 4.2 WebLogic Server 管理控制台。\n\n如果你的应用程序是用 `Java` 编写的，你可能需要启动 `JMX console` 来识别应用程序服务器中注册了哪些服务（`MBeans`）。这些服务的参数可以通过\
  \ `JMX console` 进行修改。图 4.3 显示了 `JMX console` 初始界面的样子。\n\n![image](img/F000042f04-03-9780123985453.jpg)\n\
  \n图 4.3 JMX 控制台截图。\n\n## 4.11 日志文件\n\n日志文件（通常是文本文件）的创建是为了记录计算机上的活动。日志文件中的大多数条目包含详细信息和时间戳，即创建该条目的日期和时间。日志文件通常按时间顺序排序，即每个条目的的时间戳等于或大于其之前的条目。某些日志文件会无限增长。另一些具有固定大小，当到达文件末尾时，下一个记录将覆盖第一个。\n\
  \n### 4.11.1 应用程序日志\n\n几乎每个应用程序都会生成一个或多个日志文件。这些日志文件可以提供以下类型的信息：\n\n1. 版本详情：运行应用程序的版本\n\
  2. 启动时间：应用程序何时启动\n3. 应用程序发生了哪些活动\n4. 性能问题\n5. 安全问题\n6. 详细错误信息\n7. 用户登录：谁在使用应用程序，频率如何\n\
  8. 连接信息，例如连接到哪个服务器\n\n处理日志文件是应用程序管理员的常见活动。由于你无法 24 小时监控应用程序活动，你将依靠日志文件了解在你不在时发生了什么。日志文件的其他用途包括：\n\
  \n* 故障排除发生的问题\n* 发送给供应商技术支持\n* 确定谁登录了系统\n* 跟踪谁对应用程序做了哪些更改\n* 监控应用程序的健康和性能\n\n你需要了解应用程序创建哪些日志文件以及它们的位置。我在上一句中特意使用了复数，因为应用程序往往会有多个日志文件。相信我，你最终会需要引用它们，所以你应该预先知道它们在哪里。如果你足够好，它们会在名为\
  \ `logs` 的子目录中，但不要寄于此。如果你向供应商的支持团队报告问题，他们很有可能会要求你发送“日志文件”。他们将使用日志条目帮助分析问题。\n\n###\
  \ 4.11.2 配置应用程序日志文件\n\n你的应用程序默认创建日志吗，还是需要定义配置设置来开启它？我见过的需要更改设置的两个不同位置：\n\n* `JMX\
  \ console`。某个应用程序需要你进入 `JMX console` 来修改日志级别值。图 4.4 是在 `JMX console` 中设置日志级别的截图。\n\
  \n\n\n\n\n-   一个注册表设置。`Logging` 的值（图 4.5 所示）可以通过更改来决定记录内容的选择性。值 `0` 表示不进行任何记录。值\
  \ `1` 表示仅记录失败的 SQL 查询。如果将值设置为 `2`，则将记录所有的 SQL 查询。\n\n![image](img/F000042f04-05-9780123985453.jpg)\n\
  \n图 4.5 控制日志记录数量的注册表项。\n\n一旦你更改了指示应进行何种日志级别的设置，是否还需要进行其他操作来激活？例如，你是否需要停止并重新启动应用程序以使更改生效？请务必了解激活日志所需的完整流程。\n\
  \n一旦激活了日志，日志条目将写入何处？应用程序写入日志条目的某些常见位置包括：\n\n-   写入日志文件\n-   写入 Windows 服务器上的事件（Events）区域\n\
  -   写入数据库表\n\n如果应用程序将内容写入日志文件，你需要知道该日志的位置。需要预提的是，某些应用程序会写入多个日志文件。我工作过的一个应用程序将启动操作相关的条目写入一个日志文件，并将与运行中的活动相关的日志条目写入完全独立的另一个文件中。\n\
  \n日志文件的创建频率是多少？应用程序是无限期地写入同一个输出文件吗？还是每天创建一个文件名中带有日期的新日志文件？应用程序在每次停止并重启时都会创建一个新文件吗？\n\
  \n某些应用程序允许你根据需要关闭旧日志文件并创建新文件。如果这是创建新日志文件的唯一时机，你是否定期执行此操作？定期创建新日志文件具有明确的优势。定期创建新日志文件可以让你避免处理极其庞大的日志文件。文件越大，打开、搜索、通过电子邮件发送给供应商等所需的时间就越长。如果你能自动化此过程，可以考虑让它每晚运行或至少每周运行一次。\n\
  \n### 4.11.3 日志文件时间戳问题\n\n处理应用程序日志文件时，你需要记住的一点是时间戳中所用时间的来源。时间戳指的是哪个时区？通常，时间戳使用的时区是服务器物理所在的本地时间。当你位于西海岸（太平洋时间），而服务器位于奥马哈（中部时间），用户位于东海岸（东部时间）时，请记住这一点。如果用户说她在下午\
  \ 3 点做了某事，记录显示的时间戳将是下午 2 点。这可能会特别让人困惑，因为在你所在的所在地可能只是下午 1 点。\n\n### 4.11.4 支持软件日志文件\n\
  \n你的应用程序并不是服务器上唯一写入日志文件的软件。写入日志文件的程序列表很长且种类繁。一些示例包括：\n\n-   如 `Windows`、`Linux`\
  \ 和 `UNIX` 等操作系统都会创建日志文件\n-   如果应用程序运行在 Web 服务器上，那么 Web 服务器应用程序（例如 `IIS` 或 `Apache`）也会写入日志文件，跟踪其服务的每一个\
  \ Web 页面请求\n-   互联网浏览器会创建日志文件，跟踪访问了哪些网站\n-   大多数第三方应用程序都会保留其活动日志\n-   安全程序会对服务器上发生的几乎每件事物都保留详细的日志文件\n\
  -   如 `SQL Server` 和 `Oracle` 等数据库包会创建事务日志来记录它们执行的所有活动\n-   如 `cron` 和任务计划程序（Task\
  \ Scheduler）等调度程序拥有日志文件，记录调度了哪些任务、执行时间以及是否成功\n\n## 4.12 导航\n\n每个 `GUI`（图形用户界面）应用程序都提供了一些让用户在屏幕之间导航的方法。常见方法列在此处。最后三种将在后续章节中进行更详细描述：\n\
  \n-   使用鼠标点击链接\n-   菜单\n-   功能键，又称快捷键\n-   面包屑导航（Breadcrumbs）\n\n### 4.12.1 菜单\n\
  \n你可能支持的几乎任何应用程序都会存在菜单。它们允许用户快速准确地进入他们想要看到的屏幕。涉及到菜单，问题不在于它们是否存在，而在于它们的可配置性如何。例如，应用程序为应用程序管理员或用户提供了以下哪些功能？\n\
  \n-   应用程序有多少层菜单？\n-   菜单是可配置的吗？\n-   可以为每个用户或用户组自定义菜单吗？\n-   如果是的话，谁可以自定义？是应用程序管理员还是用户本身？\n\
  -   应用程序支持菜单的多语言支持吗？\n-   可以使用快捷键组合激活菜单选项吗？\n-   快捷键组合是可以配置的吗？谁可以配置它们？\n\n### 4.12.2\
  \ 功能键/快捷键\n\n你的应用程序中有哪些快捷键？即使这些内容有记录，这可能也是你的用户可能会问你的问题。为新用户准备一份单页文档是一项非常好的投资。在该文档中包含应用程序可用的快捷键也是一个好主意。\n\
  \n如果可以在应用程序中配置快捷键，那么请务必这样做。使用它们可以显著提高你用户的效率。唯一的问题是你想要定义哪些快捷键？\n\n有几个常用的快捷键：\n\n\
  -   `F1`: 弹出帮助菜单\n-   `F5`: 查找\n-   `Ctrl+A`: 全选\n-   `Ctrl+C`: 复制\n-   `Ctrl+F`:\
  \ 查找\n-   `Ctrl+S`: 保存\n-   `Ctrl+V`: 粘贴\n-   `Ctrl+X`: 剪切\n-   `Ctrl+Z`: 撤销更改\n\
  -   `Ctrl+End`: 跳到文件末尾\n-   `Ctrl+Home`: 跳到文件开头\n\n### 4.12.3 面包屑导航\n\n在原始童话中，汉塞尔在地上留下了面包屑，以便他和妹妹格蕾特找到离开森林的路。类似地，许多应用程序使用面包屑显示它们是如何到达某个屏幕的。如果应用程序显示面包屑，它们通常位于屏幕顶部，通常位于应用程序菜单下方。图\
  \ 4.6 显示了应用程序中的面包屑实现。路径上的每个屏幕由“大于”符号分隔。点击面包屑路径中的任何项都会带你进入该屏幕。\n\n![image](img/F000042f04-06-9780123985453.jpg)\n\
  \n图 4.6 应用程序中面包屑的示例。\n\n你的应用程序显示面包屑吗？如果是，用户可以点击其中一个直接跳转到该屏幕吗？某个应用程序通过禁用浏览器后退键来强制用户使用面包屑。面包屑可能对你没有直接影响，但你可能会收到用户关于它们的问题，请做好准备。\n\
  \n## 4.13 错误消息\n\n当出现问题时，每个应用程序都会显示不同的错误消息。如果所有软件供应商都能协调他们的消息那将太好了，但我强烈感觉到这在我们生前不会发生。\n\
  \n看看是否可以获取应用程序显示的所有错误消息列表。这可能可以在管理员指南中找到。如果手册中没有，它可能在文本文件或数据库表中。如果你足够幸运，你可以获得一个完整的列表，并且其中包含对错误的更详细描述。屏幕上显示的错误消息可能相当简练，并且令人困惑。\n\
  \n用户需要接受培训，在报告问题时始终包含错误代码和完整的错误消息。准确的信息越准确，供应商的支持团队在必要时解决工单的速度就越快。\n\n\n\n\n\n##\
  \ 4.14 仪表板 (Dashboards)\n\n仪表板是一种显示类型，以易于阅读的格式向查看者传达重要信息。通常显示的值代表部门或组织的关键绩效指标 (`KPI`)。使用的图表、仪表盘或其他组件通常会使用红色、黄色和绿色进行颜色编码，以指示数值是糟糕、中等还是良好。\n\
  \n你需要回答的某些仪表板相关的问题包括：\n\n- 你支持的应用程序提供仪表板吗？\n- 用户偏好可以应用于这些仪表板吗？\n- 数据多久刷新一次？\n- 它们包含哪些数据？\n\
  - 你可以创建新的仪表板吗？\n- 谁在使用它们？\n- 是所有用户还是特定用户组可以访问仪表板？\n\n## 4.15 局限性\n\n每个应用程序在与其他软件的兼容性方面都有局限性。它可能具有的一些局限性示例包括：\n\
  \n- 该应用程序可以在 `Windows 2003` 下运行，但不支持 `Windows 2008 R2`\n- 它通过了与 `Windows Internet\
  \ Explorer 9` 的兼容认证，但不支持 `10`\n- 它可能可以将报告导出到 `Excel 6.0`，但不支持 `7.0` 版本。\n\n你的工作是意识到任何局限性，并确保用户也这样做。如果应用程序无法兼容某个版本的\
  \ `Internet Explorer`，你就不能允许用户群升级。我要警告你，这将场无休止的战斗。总会有部门或小组以始终拥有最新的软件为傲。要说服他们领先于应用程序更新曲线会给他们带来麻烦是非常困难的。\n\
  \n## 4.16 工作流 (Workflow)\n\n工作流是一个允许多人执行整个过程的一部分，并将对象传递给下一个人的过程。为发票制作支票可能需要以下步骤：\n\
  \n- 收到发票\n- 应付账记员使用相应的 `General Ledger`（总账）代码对发票进行编码\n- 经理审核发票，进行修正并返回给应付账记员\n-\
  \ 将发票输入 `Financial System` 进行付款\n- 公司应付部门经理签署发票\n- 相关部门经理授权付款\n- 开具支票\n\n许多应用程序包含工作工作流组件，以使业务流程更高效、更容易跟踪。应用程序确保链中的每个人在将对象（例如索赔单、工单或发票）传递给需要关注的下一个人之前完成他们的任务。通常，链中的下一个人将通过电子邮件通知该对象已在他们的队列中。\n\
  \n如果你的应用程序包含工作流功能，在工作流逻辑正确处理你的对象之前，你可能需要提供许多设置细节。具体由谁负责设置工作流取决于应用程序。通常由 `Application\
  \ Administrator` 完成，因为处理这些工作可能相当复杂。在某些应用程序中，这项工作需要运行只有 `Application Administrator`\
  \ 才能访问的实用程序。在其他应用程序中，工作流由 `XML` 文件控制。用户和所有者通常不擅长编辑 `XML` 文件。\n\n可能需要定义或设置的一些细节包括：\n\
  \n- 定义要执行过程中的每项任务\n- 定义完成任务的顺序\n- 定义组\n- 将用户分配到组\n- 将任务分配给相应的组\n- 如果分配的人员在定义时间内未完成任务，将发送提醒\n\
  - 如果分配的人员在第二个定义时间内未完成任务，对象将重新分配给其他人\n- 谁可以从其他工作人员那里接管任务\n- 当工作流过程中所有步骤完成后将执行的操作\n\
  \n## 4.17 时区问题 (Time Zone Trouble)\n\n如果你的组织在多个时区设有办事或人员，那么就存在时区相关的混乱可能。人们通常认为自己所在的时区是“正确”的。在这方面，计算机服务器与人没有区别。每个服务器都有一个内部时，通常设置为本地时间。服务器上的时间变得重要，是因为：\n\
  \n- 文件系统使用服务器时间来识别文件何时被创建或修改\n- 日志文件条目通常带有服务器时间的时间戳\n- 交易经常关联有来自服务器的时间戳\n- 备份等管理操作被安排在特定时间发生\n\
  - 停机和重启等计划内事件需要向所有受影响的人清晰说明\n\n其他由于员工或硬件位于不同时区使你的生活复杂的情况包括：\n\n- 如果 `Application\
  \ Administrator` 与大多数用户或主要用户不在同一个时区怎么办？这会变得尴尬，因为你们的重叠时间可能非常少。是否可能将工作日平移一两个小时，以更符合用户的工作日？你与用户的重叠时间越多，在一个典型工作日内完成的任务就越多。\n\
  - 供应商的支持人员与你的团队在同一个时区吗？这并不关键，但如果供应商的 `Support Desk`（支持服务台）离你的时区很近，确实方便。\n- 如果你的应用程序服务器和数据库服务器位于不同的时区怎么办？它们会被设置为一个共同时间，还是每个都设置为自己的本地时间？如果你以后需要将日志文件中的时间戳条目与时间戳条目进行比对，后者可能会使情况复杂化。\n\
  \n在你付了巨大的努力后，你解决了所有与时区相关的工作。你认为自己将一帆风顺，但夏令时（Daylight Savings Time）来来了！夏令时有很多潜在问题可能会使你的生活复杂。其中包括：\n\
  \n- 并非所有美国州都承认夏令时。最注意的是，亚利桑州 `Arizona` 不承认。\n- 并非所有国家都承认夏令时。\n- 承认夏令的国家并非在同一天进入。\n\
  - 美国进入和退出夏令时的日期是不固定的。\n\n你的用户会受上述情况的影响吗？从技术角度来看，当你们进入或退出夏令时时，你的应用程序环境会出现类似以下的问题吗？\n\
  \n- 你的服务器设置为自动切换夏令时吗？还是你组织的手动操作？\n- 如果夏令时从一年到一年的日期发生变化怎么办？你的服务器会自动识别吗？\n- 时间变化将如何影响计划任务？具体来说，当时间回拨时，任务会被再次调度吗？如果是，这会导致问题吗？\n\
  - 当时间“回拨”时，日志文件中的时间戳条目会受到什么影响？日志文件中是否存在多个相同日期和时间的条目？这会对应用程序产生问题吗？\n- 当时间“回拨”时，数据库表中的时间戳条目会受到什么影响？如果时间戳被用作表的主键，你会遇到重复键导致的错误吗？\n\
  \n## 4.18 Cookies\n\nCookie，也称为浏览器 Cookie，是用户登录的网站发送的一小信息，存储在用户的计算机上。如果应用程序设计为使用\
  \ Cookie，那么用户和 `Application Administrator` 均无法控制它们。它们是由软件自动创建。\n\n\n\n\nCookie 的一种用途是为用户提供个性化的网站服务，即用户每次返回网站时，其外观都保持如一。Cookie\
  \ 可能会记录用户的详细信息（如家庭地址），这样用户每次登录时就不需要重新添加。Cookie 的另一个用途是记录购物车中的内容，以防会话被中断。\n\n如果你支持的应用程序是基于\
  \ Web 的，它会在用户的桌面电脑上创建 Cookie 吗？如果确实创建了，你对它创建的 Cookie 是否有控制权？要获得这些问题的答案，你可以尝试查看 `Administration\
  \ Guide`。如果它没有回答你的问题，你应该联系供应商。\n\n# 第 5 章：关于你的应用程序的细节\n\n## 摘要\n本章介绍了你将支持的特定程序的特定特性。它通过提问来确定应用程序具体提供了哪些功能，以及这些功能对于支持该程序的人意味着什么。问题示例包括：支持哪些浏览器、应用程序是否脆弱、是否需要许可证密钥、是否包含源代码以及提供了哪些审计功能。\n\
  \n### 关键词\n应用程序功能；支持的浏览器；脆弱代码；应用程序集成；许可证密钥；故障排除；源代码；托管；开源代码；回传数据（phoning home）；审计跟踪\n\
  \n上一章描述了许多第三方应用程序通用的功能。现在，我们需要提出探究性问题，以进一步了解你正在支持或即将支持的应用程序。在阅读本章时，请务必考虑未包含在此处的问题。你的提问范围越广，你对应用程序的理解就越完整。\n\
  \n## 5.1 你的应用程序支持的浏览器\n如果你的应用程序是基于 Web 的，它认证可以在哪些浏览器运行？这些信息可能可以在供应商的网站上找到。如果那里没有列出，请检查\
  \ `Installation Guide`。一如既往，你的最后手段是联系供应商的支持部门。一些最常用的浏览器包括：\n\n* `Microsoft Internet\
  \ Explorer`\n* `Mozilla Firefox`\n* `Google Chrome`\n* `Apple Safari`\n\n一旦你确定了支持的浏览器列表，你就需要确定该应用程序认证的每个浏览器的特定版本。例如，该应用程序可能支持\
  \ `Internet Explorer 8`，但不支持 `IE9`？或者支持 `Firefox 22` 但不支持 `Firefox 23`。\n\n当新版本的浏览器发布时，应用程序供应商对支持这些版本是否积极？或者在新浏览器版本发布后，他们的支持会滞后几个月？如果供应商没有处于浏览器支持的最前沿，你对此无能为力，但这是你需要注意的。\n\
  \n务必确切知道支持哪些版本，因为当用户尝试使用不支持的浏览器时可能会出现细微的问题。当用户报告问题时，应该始终问的一个问题是发生问题时使用的是什么浏览器（包括版本）。如果该浏览器或版本不支持，你的第一步应该是查看问题是否在支持的浏览器上也会发生。如果没有发生，那么在大多数情况下，你对该问题的工作就完成了。你应该联系供应商，查看是否已经发布了对该浏览器和版本的支持日期。然后通知用户他们在使用不支持的浏览器，并且需要退回到经过认证的浏览器。\n\
  \n组织在控制用户允许在桌面上运行哪些软件方面，做法各不相同。有些组织控制得很严，而另一些则采取顺其自然的态度。你的组织处于这个光谱的什么位置？如果处于不受控的一端，那么就要你来告知用户应用程序对他们浏览器选择所施加的限制。他们不会喜欢的，但这是一个你无法控制的领域。\n\
  \n### 5.1.1 兼容性模式\n如果你使用最新版本的 Microsoft Internet Explorer (`IE`) 浏览器，某些网站可能无法正常显示。这是因为某些网站的设计是为了与早期版本的\
  \ Internet Explorer 配合。如果你支持的应用程序在 `IE` 中查看时出现问题，那么你可能遇到了兼容性问题。\n\nInternet Explorer\
  \ 中有一个名为 `Compatibility View`（兼容视图）的设置，它可以像使用浏览器的早期版本一样显示网站。要使用 `Compatibility View`\
  \ 设置，你需要点击 `IE` 菜单中的 `Tools` 设置。在 `Tools` 菜单中，选择 `Compatibility View Settings` 选项。在显示的屏幕中，你可以点击\
  \ `Add` 按钮在 `Compatibility View` 中查看当前网页。所有以兼容模式查看的网站都将显示在屏幕上显示的列表框中。如果你想以 `Compatibility`\
  \ 模式查看所有网站，请点击屏幕上的最后一个复选框。\n\n## 5.2 你的应用程序是脆弱吗？\n某些应用程序似乎需要不断的关注。每天早上当你到达工作时，你就知道会有用户发来邮件抱怨应用程序出了某些问题。或者这些邮件可能来自应用程序本身，或者来自你的监控软件包。如果这些应用程序是人，它们会被称为“高维护”。其他应用程序看起来只需要最少的关注就能正常运行。你的是哪一种？你需要了解这一点有一些非常重要的理由。最重要的一点是你的主管对你投入多少时间到这个应用程序上的预期。\n\
  \n如果一个软件（例如一个应用程序）在用户完全正确操作时运行良好，那么它被认为是脆弱的。但如果用户偏离了使用软件的方式，它就不再按照预期运行。通常，这类问题似乎会发生，然后又很快消失。如果问题无法被轻易复现，那么故障排除将非常困难。\n\
  \n脆弱或“高维护”的应用程序将需要你投入更多时间，可能多得多。结果是，应用程序管理员无法像应用程序只需要正常维护那样支持许多应用程序。或者，单个应用程序管理员可能在没有帮助的情况下无法支持该应用程序。你希望你的主管提前知道这一点，这样她才不会认为你无能或在偷懒。\n\
  \n应用程序脆弱的一些方式示例包括：\n\n* 如果用户以不同的顺序操作，就会出现问题\n* 如果用户选择了非默认选项，就会出现问题\n* 如果用户输入了极端但在技术上有效的值，就会出现问题\n\
  \n没有人会出来说某个应用程序是脆弱的。并没有一个衡量和比较应用程序的“脆弱性”量表。判断你的应用程序是否脆弱的一种方法是听取用户对那些“神秘消失”或“自动解决”问题的投诉。这些可能是这样的情况：在用户偏离特定的使用模式之前，一切运行正常。他们做了一点点不同的操作，问题出现了。然后下次他们按“正常”方式这样做时，一切正常。\n\
  \n脆弱的代码在没有大量精力的情况下无法得到显著改进（即变得“健壮”）。本质上，构成应用程序的代码库必须重写。如果应用程序现在是脆弱的，供应商不太可能这样做，因此未来可能也不会改进。\n\
  \n### 5.2.1 记录脆弱区域\n\n\n\n\n也许，记录应用程序脆弱性（brittleness factor）最好的方法，就是对发生的每一个问题记录详细的注释。虽然你本来就应该这样做，但这提供了另一个促使你去做的动力。文档应该包含以下细节：\n\
  \n* 每一个报告给你的问题的条目\n*   是哪些用户报告了问题\n*   从用户处获取问题的详细信息花费了多久\n*   是你自己解决的，还是需要供应商协助\n\
  *   供应商支持团队最初响应的速度有多快\n*   供应商技术人员的第一个建议是否解决了问题\n*   用户确认问题已解决花费了多久\n\n如果能有一张图显示支持每个不同应用程序所需的人工时，那就太棒了。遗憾的是，这是不可能的，因为涉及到许多变量。其中一些变量包括：\n\
  \n*   用户数量\n*   用户的经验\n*   用户群的多样性\n*   应用程序的架构，例如：客户端-服务器架构与 Web 架构\n*   应用程序的灵活性\n\
  *   你的总体经验，特别是针对该应用程序的经验\n*   该应用程序是否被认为是组织至关重要的\n*   供应商响应问题工单的速度以及解决问题的速度有多快\n\
  \n### 5.2.2 缓解脆弱性\n\n应用程序管理员无法让一个应用程序变得不脆弱，但你可以采取一些措施来缓解脆弱应用程序的影响。一些可能的防御措施包括：\n\
  \n*   在遇到问题时记录应用程序的特殊之处（idiosyncrasies），这样当你将来再次遇到时就不可能感到意外。如果再次遇到问题，你会知道如何绕过它。\n\
  *   向供应商报告任何问题。如果他们没有被告知问题，就无法修复它们。\n*   如果存在应用程序用户组，请加入其中或与其他应用程序管理员交流，学习他们如何处理这些问题。你会惊讶于从同事那里可以学到多多的知识。\n\
  *   增加日志级别，看看是否有助于识别问题发生的时间和原因。\n*   建立一个流程来监控日志文件，寻找与应用程序中“脆弱”错误相关的错误消息。如果合适，当流程发现错误时，它将向你发送警报，让你知道该错误的发生。\n\
  \n### 5.3 应用程序与其他程序“相处融洽”吗？\n\n如果一个现有的应用程序（无论你的还是别人的）在第二个应用程序加载到服务器或桌面之前运行良好，但随后性能开始下降，那么你可能遇到了其中一个应用程序无法与其他程序“相处融洽”的情况。\n\
  \n应用程序之间无法良好共同作用的某些可能原因是：\n\n*   它们使用了不同版本的同一个 `DLL`（动态链接库）\n*   它们尝试使用相同的端口与其他计算机或服务进行通信\n\
  *   两个应用程序都高度依赖于特定资源，例如：磁盘 I/O、网络 I/O、内存、CPU 周期等\n*   一个或两个应用程序存在内存泄漏问题，最终导致应用程序或计算机崩溃\n\
  \n解决这一困境显而易见的方案是根本不要强迫这些应用程序共同工作。如果你在单台服务器上处理应用程序，请将它们分开。要么投资另一台物理服务器，要么创建一个第二个虚拟机。\n\
  \n如果问题存在于用户的桌面上，那么解决方案就会变得更加复杂。其中一步是确定两个应用程序是否真的需要同时运行在同一台桌面上。如果必须同时运行，请查看其中一个或两个应用程序是否有可用更更新的版本或补丁。这可能是一个已知问题，并且已经发布了解决该问题的修复程序。\n\
  \n### 5.4 与其他应用程序良好集成\n\n你组织依赖的许多应用程序都需要与其他应用程序进行集成。例如，考勤应用程序的输出为工资单应用程序提供输入。工资单应用程序的输出馈给税务应用程序，后者在年底为员工生成税表。\n\
  \n其他可以与其他应用程序集成的应用程序示例包括：\n\n*   供应链管理应用程序与你的库存系统集成\n*   客户关系管理（CRM）应用程序与你的账单系统集成\n\
  *   人力资源（HR）系统与你的考勤系统集成\n*   学习管理系统（LMS）与你的人力资源系统集成\n*   Active Directory 与人力资源系统集成\n\
  *   商业智能（BI）与许多系统集成以收集数据\n\n某些应用程序尝试提供端到端（soup-to-nuts）的功能，即它们试图满足你组织可能需要的每一个想象的需求。虽然这可能吸引某些客户，但可能并不是你想要的方式。你选择集成多个应用程序而不是选择一个全能软件软件包的某些原因包括：\n\
  \n*   你不愿意过度依赖单一供应商\n*   你的组织已经部署了提供相关功能的软件（例如考勤功能），你不需要购买新产品来处理它\n*   内部开发团队编写了完全契合你组织需求的自定义应用程序\n\
  *   新应用程序关联的版本没有提供你所需的所有功能\n*   你已有的软件被认为是“同类最佳（best of breed）”，你不想离开它\n*   新应用程序中该软件包的成本超过了你愿意支付或能筹集的资金\n\
  *   新应用程序中的软件包提供的功能超过了组织的需求\n*   政府法规限制了可以软件软件包，而新应用程序不在批准列表上\n\n某些应用程序似乎比其他更适合集成。良好的程序具有内置工具或功能，可以使生成输出变得更容易。它们能够以多种格式生成报告，其中某些格式适合其他应用程序的输入。\n\
  \n在链的另一端，某些应用程序在输入数据方面更加灵活。它们可以处理多种格式的输入数据。某些应用程序比其他应用程序更好地处理意外或无效数据。你需要对你的应用程序进行实验，以确定与其他应用程序集成的难易程度。\n\
  \n### 5.5 许可证密钥\n\n许多大多数供应商使用许可证密钥来确保他们的软件只运行在付费的站点。这是一个合理的要求，但偶尔会给即使是合法授权的用户带来麻烦。例如，如果许可证密钥在深夜、周末、节假日或应用程序管理员不在办公室时过期会怎样？墨菲定律预示着任何过期的许可证都会在最不方便的时间过期。\n\
  \n\n\n\n为了最终能做好这些准备，你需要进行一些高级规划。你可以采取的步骤包括以下：\n\n- 与你组织的采购团队合作，主动处理即将到期的许可密钥。这可以确保预付维护或支持发票的费用，并确保你的应用程序不会出现许可问题。\n\
  - 提前了解密钥的过期时间。如何提取此类信息对于每个应用程序都是唯一的。你需要检查`Administrator’s Guide`管理员指南）或联系供应商的支持服务台以了解如何操作。然后，你需要为自己创建一个提醒（也称为\
  \ `tickler` 提醒事项），该提醒将在过期日期的一周出现。这将为你留出充足的时间联系供应商并获取新的许可密钥。\n- 如果你正在运行软件的多个副本，例如负载均衡环境或独立的\
  \ `PROD` 和 `QA` 环境，它们的许可证是否会在同一时间过期？如果能一次性处理所有环境，将是非常理想的，而不是在一年中要多次处理这些事宜。\n- 不要忘记你的\
  \ `DR`（灾难恢复）环境。如果发生灾难，你不希望发现 DR 站点因为无人注意的许可问题而无法使用。\n- 应用程序是否提供了密钥即将过期的任何警告？这种警告以什么形式呈现？\n\
  - 是否会向应用程序管理员发送电子邮件？\n- 用户每次登录应用程序时，是否会弹出警告消息？\n- 警告消息是否会埋没在某个无人监控的日志文件中？\n\n你应该提前掌握的其他信息还包括知道联系谁来获取新的许可密钥。\n\
  \n- 拨供应商的支持服务台是否会给你最快的响应？\n- 新的许可密钥是否通过其网站上的自动化流程颁发？\n- 是否有特定的人员可以拨打电话或发送电子邮件来获取新密钥？\n\
  - 供应商会提前多远发布新密钥？\n- 如果许可证在正常工作时间之外过期，是否有可以拨打的紧急电话？\n- 供应商的假期是否与你的假期一致？\n\n### 5.5.1\
  \ 更新许可密钥\n\n最后一条建议是，你需要提前了解如何在服务器上更新许可密钥。正如你所预期的，每个应用程序处理此问题的方式不同。图 5.1 和 5.2 显示了如何为一个应用程序输入新的许可密钥。此过程要求你远程连接到托管该应用程序的服务器。连接后，流程的第一步是打开该应用程序并选择\
  \ `Manage | Licensing` 菜单选项。请参见图 5.1 该菜单选项的截图。\n\n![image](img/F000054f05-01-9780123985453.jpg)\n\
  \n图 5.1 访问许可屏幕。\n\n![image](img/F000054f05-02-9780123985453.jpg)\n\n图 5.2 输入新的许可密钥。\n\
  \n显示 `Licensing` 屏幕后，点击 `Enter New` 按钮。输入供应商提供的新许可密钥，然后点击 OK。请参见图 5.2 两个许可屏幕的截图。完成这些步骤后，许可即已更新。\n\
  \n## 5.6 故障排除协助\n\n应用程序是否提供了可以协助你进行故障排除的额外详细信息？第 4 章 描述了应用程序通常用于记录问题的日志文件。可能显示的、能显著简化故障排除过程的额外信息示例包括：\n\
  \n- 当发生错误时，会显示一个带有错误详情的有意义屏幕。\n- 应用程序中的每个屏幕都有一个唯一的 `ID`，以便用户可以明确识别该屏幕并将该信息传递给你。\n\
  - 某些应用程序在输入特定的按键组合或选择菜单项时，会显示关于当前屏幕的额外信息。\n\n如果应用程序提供了额外信息，那么你需要教育用户在报告问题时捕获这些信息。如果不利用供应商花费精力包含在应用程序中的宝贵细节，将是一种浪费。从开始训练用户提供这些信息将为所有人节省时间和消除麻烦。\n\
  \n一个提供丰富故障排除信息的应用程序示例是 Mozilla 的 Firefox。如果你点击菜单项 `Help | Troubleshooting Information`（帮助\
  \ | 故障排除信息），将显示图 5.3 所示的屏幕。虽然提供的所有信息并不适用于业务应用程序，但在尝试排除 Firefox 问题时，它们可能是非常有用的。\n\
  \n![image](img/F000054f05-03-9780123985453.jpg)\n\n图 5.3 Mozilla Firefox 中提供的故障排除信息。\n\
  \n## 5.7 以意想不到的方式使用应用程序\n\n与任何产品一样，应用程序都是为了特定目的而设计的。跑车很快而且有趣，但不能像皮卡车那样运送货物。吸尘器在你家里工作很好，但不能像吹叶机那样吸走院子里的落叶和草坪碎屑。我的意思是，如果你用它来做错误的工作，那么世界上最好的软件也无法运行。\n\
  \n应用程序在非其设计目标环境中使用的示例包括：\n\n- 使用原本设计用于批处理的应用程序尝试 `24×7` 运行\n- 使用应用程序未设计过的数据库\n-\
  \ 尝试支持应用程序无法处理的用户数量、站点等\n- 使用错误的数据类型，例如对货币值使用 `integer` 或 `float` 而不是 `currency`\
  \ 类型\n- 使用预定义对象来存放“不匹配”的数据\n- 支持设计者之外的数据\n\n## 5.8 源代码\n\n每个应用程序背后都是源代码，大量的源代码。还有其他对象如数据库和业务对象，但应用程序是由大量的源代码组成的。\n\
  \n### 5.8.1 专有软件\n\n供应商不希望提供其应用程序的源代码，因为任何人都可以编译应用程序并使用执行文件而无需支付许可费。需要许可的计算机程序或应用程序通常被称为专有程序。\n\
  \n### 5.8.2 源代码托管\n\n你可能会合理地担心如果供应商倒闭了怎么办？如果发生这种情况，未来将由谁支持该应用程序？你可能考虑的一种方案（特别是当供应商较新或规模较小时）是要求将源代码存在托管中。这种安排要求将源代码提供给中立第三方，称为托管代理。如果供应商无法按照许可协议支持应用程序，则源代码将提供给客户。\n\
  \n如果你希望进行源代码托管，你可能从采购过程开始就必须与供应商进行谈判。一旦他们在你的站点安装了应用程序并兑现了支票，你就失去了筹码。你需要定义所有源代码释放给你的条件。其中某些条件可能包括：\n\
  \n- 供应商宣布破产\n- 供应商未在规定时间内（例如 6-12 个月）解决记录的错误\n- 供应商未更新应用程序以适配新的操作系统版本\n- 供应商未更新应用程序以适配其所依赖的新数据库包版本\n\
  \n\n\n\n不要片刻刻认为让供应商同意将源代码存入托管账户就是解决所有潜在问题的万灵药。如果你认为已经满足触发释放源代码的条件，那么你可以预料供应商将会进行反击。一旦源代码交付到你手中，他们的立场就会被大大削弱，因此要做好他们会延迟、否认或以其他方式阻碍你获取源代码的尝试。\n\
  \n即使你获得了源代码的访问权限，在尝试自己支持应用程序时仍会遇到困难。你可能需要处理的一些潜在障碍包括：\n\n- 你的员工中是否有熟悉该源代码编程语言、平台和编码风格的开发者？\n\
  - 你的员工中是否有足够的开发者来完全支持该应用程序？供应商有多少名技术人员，而你又有有多少？\n- 托管中的代码更新有多新？代码越旧，价值就越低。\n- 代码库使用的所有库文件都包含在托管中了吗？\n\
  - 托管材料中是否包含任何文档？\n\n你是否已经定义了支持应用程序的首要目标？除非你有无限的预算和人员，否则你无法完成所有想做的事情。你必须对将要的任务进行优先级排序。你的潜在目标可能包括：\n\
  \n- 修复已知错误\n- 提高应用程序性能\n- 增加应用程序支持的用户数量\n- 使应用程序支持多种语言\n- 升级应用程序以适配新的服务器操作系统\n-\
  \ 更新应用程序以适配新版本的数据库\n- 添加能让你的用户更高效的新功能，或是他们明确请求的功能\n- 添加监管机构要求的合项\n\n### 5.8.3 开源软件\n\
  \n在源代码可用性和许可费用方面，光谱的另一端被称为“开源软件”或 OSI。开源软件在开发过程中通常有许多贡献者。开源软件项目的一些示例包括：\n\n- Apache\
  \ HTTP Server\n- Mozilla 的 Firefox 浏览器浏览器\n- Linux 操作系统\n- 用于移动设备的 Android 操作系统。\n\
  \n企业级开源应用程序并不多见，但它们正开始出现。随着开源运动力量壮大、追随者增加，组织所依赖的越来越多类型的应用程序可能会以开源项目的形式可用。\n\n如果你所支持的应用程序是开源的，那么源代码将对你开放，你可以随心所欲地进行修改。请务必注意，如果你在软件中引入了错误，那么在调试它时你可能需要自力更生。你需要密切记录\
  \ string 了哪些更改、何时进行以及由谁进行，以便在需要时可以撤销。第 7 章 讨论了跟踪软件更改的方法。\n\n仅仅因为源代码随手可用，并不意味着你就具备了修改或完全支持它的能力。你必须回答许多针对已托管软件提出的问题：\n\
  \n- 你的员工中是否有熟悉该源代码编程语言、平台和编码风格的开发者？\n- 你的员工中是否有足够的开发者来完全支持该应用程序？\n- 你是否拥有该源代码的最新版本？\n\
  - 代码库使用的所有库文件都可用吗？\n- 开源材料中是否包含任何文档？\n\n## 5.9 拨回家（Phoning Home）\n\n无论你喜不喜欢，许多软件供应商在他们的应用程序中包含了定期联系总部的功能。本节的标题并非暗示应用程序将使用调制解调器和电话线进行此类通信。通信途径很可能是通过互联网实现的。\n\
  \n供应商在软件中包含此功能可能出于正当理由。例如，可能是为了报告遇到的错误。这有可能让你的问题更快得到解决。应用程序被设计为“拨回家”的其他原因可能包括：\n\
  \n- 它可能在报告站点正在使用的授权密钥\n- 它可能在报告登录应用程序的具名用户数量\n- 它可能在报告正在使用的应用程序版本\n\n你如何发现你的应用程序是否在向它的“妈妈”打电话？阅读文档是确定这一点的一种方法。如果《管理员指南》没有提到这一点，你可以联系供应商的支持团队进行询问。如果他们不给你明确的答复，你可以安装软件来监控服务器的此类活动（参见第\
  \ 5.9.1 节）。\n\n关于这个主题你可能想要答案的问题包括：\n\n- 你支持的应用程序会拨回家吗？\n- 可以关闭这个“功能”？\n- 它在连接时会向供应商发回什么信息？\n\
  - 应用程序多久拨一次家？\n- 你可以控制它拨家的频率和发送的内容吗？\n- 该功能被用于恶意目的的风险是什么，例如向你组织之外的人发送机密信息？\n\n如果你正在评估某个应用程序，那么向供应商提问这个问题是合理的。如果应用程序确实会拨回家且无法关闭，那么你需要决定是否将其排除在考虑之外。如果销售代表或技术代表后期告诉你他们的软件不具备此功能，而你后来发现它确实有，那么你就必须做一个重要的决定：你是否愿意与撒谎的供应商合作？\n\
  \n### 5.9.1 阻止拨回家\n\n存在某些监控包可以帮助你防止应用程序拨回家。一旦设置了此类监控包，它将报告任何互联网访问尝试。这为你提供了关于哪些应用程序正在尝试拨回家、使用了哪些端口以及尝试的目标地的信息。有了这些信息，你可以决定是否允许任何通信。\n\
  \n如果你不想安装监控包，还有另一种方法可以实现目标。`netstat` 是一个查看哪些端口已打开以及哪个程序打开了端口的工具。`netstat` 适用于 Windows、Unix\
  \ 和 Linux。通过 `netstat` 识别端口后，你可以使用防火墙阻止应用程序拨回家。这需要更改你的防火墙设置，以阻止通过 `netstat` 识别的端口进行出站通信。\n\
  \n\n\n\n### 5.10.2 日志文件\n\n如果没有任何审计报告，那么你可能需要多花些精力才能找到你寻找的内容。下一个逻辑查找地点应该是日志文件。根据应用程序的不同，写入日志文件的信息量差异巨大。它可能细化到是谁更改了特定字段。遗憾的是，为了获得那种程度的详细信息，某些应用程序要求你修改要记录的级别。这里有两个复杂之处：首先，如果发生更改时，日志级别没有设置为更详细的级别，那么你寻找的信息就不会被记录下来。其次，如果你提高日志级别以记录每次更改，那么可能会对性能产生明显影响。这无疑会影响日志文件所占用的磁盘空间大小。\n\
  \n### 5.10.3 数据库表\n\n如果日志没有记录是谁执行了更改，那么你的下一个目标就是数据库。许多数据库表包含一个时间戳字段。如果你知道该字段存储在哪个特定的表中，就可以从数据库中检索它，并确定更改确切发生。如果运气好，数据库表还会包含一列标识执行更改者\
  \ ID 的列。不要抱有过高的期望，因为即使表中有一个这样的 ID 字段，该字段中的值也可能是一个通用 ID，而不是个人用户的标识。你必须对此进行研究（最好提前进行），以确定你的应用程序在数据库中保留了哪些信息。\n\
  \n### 5.10.4 登录报告\n\n如果上述来源都对你无效，那么我只剩下一个建议了。如果你大致知道更改发生的时间，可以尝试确定当时哪些用户登录了应用程序。某些应用程序有一个管理员可以访问的报告，列出了单个用户登录和注销应用程序的时间。如果没有此类报告，这些信息可能会被写入日志文件中。如果这两条信息可以将潜在的嫌疑人缩小到少数几个，那么这可能帮助你确定是谁做了更改。\n\
  \n给智者的忠告是，如果你预先知道如何收集这些细节，你就能更快速地处理这些请求。当此类问题发生时，人们会立即想知道是谁干的。如果你已经练习过这种类型的调查，那么速度会比第一次做快得多。一如既往，请就如何收集这些信息编写你自己的文档。如果你好久没做过这件事，你可能就不记得所需的确切步骤顺序。\n\
  \n## 5.11 使用磁盘空间\n\n每个应用程序都会消耗磁盘空间，通常是相当大量的空间。磁盘空间可以分为两类：\n\n1. 初始加载软件所需的空间\n2.\
  \ 应用程序运行期间，日志文件、数据文件、图像等所需的空间。\n\n你的应用程序初始需要多少磁盘空间？这些信息将位于《安装指南》中。在安装序列期间，程序经常会检查并确认你正在安装应用程序的驱动器是否有足够的空间来满足建议。如果没有足够的空间，它将向你发出警告提示，并可能拒绝继续安装过程。\n\
  \n这里需要给出一个警告——认真对待最小磁盘空间建议。供应商可能对所需的磁盘量有非常准确的把握。不要试图用绝对最小值来凑合。最终，你会耗尽空间，而且它会发生在一个不方便的时间。\n\
  \n如果应用程序耗尽了空间究竟会发生什么？这当然取决于应用程序，但我可以向保证，这绝不是件好事。这对用户没有好处。对应用程序的可用性统计没有好处。最重要的是，这对你的声誉或职业生涯没有好处。\n\
  \n避免服务器耗尽磁盘空间的一种方法是定期进行监控。如果你定期监控可用空间量，可以使用这些统计数据来预测服务器何时会耗尽磁盘空间。最大的问题是多久监控一次，以及你将使用什么来进行监控。\n\
  \n### 关于预测的警告\n\n预测服务器何时耗尽磁盘空间是一个令人赞赏的目标，但要意识到它并不完全可靠。你可能认为服务器在很一段时间内都不会耗尽磁盘空间，但如果服务器上发生异常情况，磁盘空间消耗得非常快。导致服务器比你预想的快得多耗尽空间的示例包括：\n\
  \n* 如果出现错误情况，日志文件可能会增长得极快。如果所有日志选项都已启用（即你正在记录一切），情况就尤其如此。\n* 异常频繁的用户活动可能会消耗异常大量的磁盘空间。\n\
  * 如果系统崩溃，大多数操作系统将创建一个转储文件（dump file）来帮助分析崩溃原因。转储文件可能极大。服务器上创建了多个被被忽略的文件并不常见。\n*\
  \ 在安装应用程序的新版本或更新现有版本时，过程通常要求你下载一个包含新或修改的代码、库等的庞大文件。该文件通常是压缩的，一旦解压缩，它会变得更大。更新完成后，请务必删除这些文件。\n\
  * 你的服务器可能在定期进行备份。备份文件应该移动到服务器之外，以确保它们在服务器崩溃时不会消失。确保服务器上没有遗留旧版本的备份文件。\n* 测试可能涉及非常大的文件。很容易忘记向服务器加载了文件。如果被忘记，它们会消耗大量的磁盘空间。一旦测试完成，确保在安全的情况下删除所有测试文件。\n\
  \n### 5.11.1 监控磁盘空间\n\n监控服务器可用空间的方法有多种。你可以根据愿意投入的时间或金钱，采取不同的监控服务器的方式。这里列出了处理此类监控活动的一些示例。\n\
  \n#### 5.11.1.1 手动\n\n确定可用磁盘空间并不是火箭科学。远程登录服务器并确定其可用磁盘空间只需要几分钟。在确定剩余多少空间后，你可以将该值写入电子表格。根据日期和大小在电子表格上创建图表，砰——瞬时趋势分析。你甚至可以将这项活动委托给一个实习生。\n\
  \n#### 5.11.1.2 编写脚本来实现\n\n手动检查可用空间的一种升级方法是编写脚本来实现。脚本不需要很花哨。只需使用 `df` 命令配合 `grep`\
  \ 来隔离出你需要的计数。将新值追加到文件末尾以捕获一段时间的数据。调度你的脚本在服务器上每天或每周运行一次。\n\n你可以编写第二个脚本，当磁盘空间低于临阈值（例如\
  \ 10%）时向你发送电子邮件。此脚本也应该调度为定期运行。每天甚至每天两次都会非常有价值。\n\n#### 5.11.1.3 使用操作系统功能来实现\n\n\n\
  \n\n\n利用操作系统的功能来监控磁盘空间可能比编写自己的脚本还要简单。如果操作系统具有此类功能，只需设置一个监控任务来完成即可。如果操作系统在可用空间低于预设阈值（例如\
  \ 10%）时可以发送电子邮件，那么这个特定的监控需求就基本完成了。\n\n### 5.11.1.4 下载一个免费工具来完成\n\n在互联网上简单搜索，就会列出无数免费工具，它们可以提供监控你一个或所有服务器上可用磁盘空间的服务。我个人其实非常对于将来源不明的程序加载到生产服务器上感到犹豫，但也许我比大多数人都要谨慎一点。如果你选择这条路线，你会有许多潜在的工具可以选择。\n\
  \n### 5.11.1.5 将其整合到整体监控框架中\n\n你的组织可能已经有了企业级监控工具。如果是这样，你肯定希望利用它，而不是重造轮子。设置它来监控服务器上的可用磁盘空间并不太难。如果你足够幸运，你的组织会有一个专门负责此领域的管理员，你只需要提交请求，让他或她将此添加到已有的监控列表中即可。\n\
  \n### 5.11.2 磁盘空间不足\n\n一旦你知道服务器即将耗尽磁盘空间，你该怎么办？我脑中想到的三个方案将在接下来的章节中描述。\n\n#### 5.11.2.1\
  \ 增加磁盘空间\n\n增加额外的空间可能非常简单也可能非常困难，取决于你的服务器是如何设置的。如果服务器只有一个硬盘且空间几乎耗尽，那么这就是最坏的情况。要增加空间，你必须用新的、更大的硬盘替换旧硬盘，或者增加额外的硬盘。这两种方案都既复杂又耗时，并且需要停机。\n\
  \n要将现有硬盘替换为新的、更大的硬盘，你需要执行以下步骤的变体：\n\n* 关闭应用程序和服务器\n* 将旧硬盘的内容复制到新硬盘\n* 将新硬盘安装为主硬盘\n\
  * 重启服务器和应用程序\n\n如果服务器是使用 SAN（存储区域网络）构建的，步骤就会简单得多。只需联系 SAN 管理员并说“我需要更多磁盘空间。”当然，必须有人授权这种扩展并承诺支付费用，但这不会从你的工资里扣除。\n\
  \n除了简单，扩展 SAN 空间还有另一个优势。大多数情况下，应用程序不需要为了扩展 SAN 空间而停止。如果你的奖金取决于应用程序是否满足可用性目标，那么这对你来说尤为重要。\n\
  \n#### 5.11.2.2 释放磁盘空间\n\n在现有硬盘上释放磁盘空间符合我这个吝啬鬼的想法。如果硬盘上有大量空间被你不需要或想要的文件占用，为什么要花钱增加磁盘空间呢？这里最明显的问题是，当服务器磁盘不足时，你可以删除哪些类型的文件？候选文件的简短列表包括：\n\
  \n* 旧日志文件\n* 操作系统转储文件\n* 安装或升级文件\n* 备份文件\n* 测试数据文件\n* 服务器上不再使用的程序或应用程序\n* 你支持的应用程序中不再使用的模块\n\
  * 文档文件，无论是供应商文档还是你编写的文档\n\n当然，在删除任何文件之前，你需要确定它们不再被需要了。如果有任何疑问，请询问他人。询问用户、询问供应商支持台、询问同事等。在删除你一无所知的文件时务必非常小心。\n\
  \n如果你足够幸运，在应用程序服务器上有多个硬盘，且只有其中一个变满了，你还有额外的选项可以选择。这里列出了几种可能性，从简单到稍微复杂等不等。\n\n####\
  \ 5.11.2.3 移动文件\n\n一个快速简单的解决方案是将文件从已满的硬盘移动到空间较充裕硬盘上。当然，你不能简单地移动眼看到的任何文件。应用程序将引用的任何文件都必须留在应用程序预期看到的地方。可以移动的潜在文件包括：\n\
  \n* 旧日志文件\n* 操作系统转储文件\n* 安装或升级文件\n* 备份文件\n* 测试数据文件\n\n#### 5.11.2.4 修改应用程序以利用另一个驱动器\n\
  \n另一个可能的解决方案是修改应用程序，使其某些功能开始使用另一个磁盘驱动。例如，应用程序可能有一个配置参数，规定了日志文件的写入位置。可能没有理由将日志文件写入到\
  \ `D:` 盘而不是 `C:` 盘。如果你的应用程序有 `\\temp` 或 `\\calculation` 子目录，也许这些子目录可以移动到另一个硬盘。\n\
  \n不言而喻，如果你更改了任何应用程序设置，首先需要在非生产环境中进行测试。即使是这样简单的更改也可能产生意外的副作用。为了你自己和你的用户考虑，请在移动到生产环境之前先在\
  \ QA 或 UAT 环境中进行测试。\n\n#### 5.11.2.5 创建接接点（junction point）\n\n接接点本质上是一个指向另一个目录的目录。这里的想法是创建并使用接接点，让应用程序使用不同的驱动器但却不知情。\n\
  \n\n\n\n\n根据定义，每位应用程序管理员在职业生涯中至少会接手一个应用程序。在应用程序交接给你期间，会有一段较短的“蜜月期”。我的意思是，你将获得你一生中可能能获得的所有关于该应用程序的配合和信息。我的建议是充分利用这次机会，尽可能收集有关该应用程序的详细信息。\n\
  \n收集尽可能信息的最佳方法是提前准备好一份非常详尽的问题清单。当你被告知负责 `XYZ` 应用程序时，列出以下问题列表，并根据你的新职责对其进行针对性修改。删掉任何不适用于你新负责范围的问题或章节。\n\
  \n你可以根据自己的环境自由修改此问题列表。添加、重写或删除问题，以最大限度地发挥其对你作为新应用程序管理员的价值。例如，你可能想将其转换为电子表格，一列是问题，另一列是你期望收到的答案。如果你的组织是\
  \ `SharePoint` 的深度用户，你可以将这些问题发布在上面，并要求大家在线回答。\n\n有一点建议，如果你将问题列表分发给多个人，你需要针对每位收件者定制列表。如果你向\
  \ `DBA` 发送关于应用程序背景的问题，他将无法回答。事实上，他可能完全忽略整个问题列表。请按主题分解你的问卷，并仅向每位同事发送相关部分。\n\n将列表分发给所有你请求协助的人。同事们会理解你对该应用程序还不熟悉，并且可能更愿意帮助某个该任务的新手。你应该将完成后的列表发送给以下某些潜在类型的人，包括：\n\
  \n* 之前支持该应用程序的人员\n* 应用程序的所有者\n* 应用程序的一或两名高级用户\n* 数据库管理员\n* 如果存在专门负责备份的团队，则为该团队\n\
  * 网络管理员\n* 服务器管理员\n* 安全管理员\n\n如果你是刚担任应用程序管理员这一角色，那么本章中的一些问题和概念对你来说可能熟悉。不要过度担心。本章中提到的每个问题和概念将在书中后的部分进行更详细的解释。\n\
  \n## 6.1 应用程序概述\n\n* 应用程序的名称是什么？\n* 应用程序的目的是什么？\n* 该组织使用此应用程序有多久了？\n* 目前的应用程序管理员是谁？\n\
  * 如果当前管理员只支持了很短时间，之前是谁支持的？\n* 他/她在过渡期内是否可以协助你？\n* 为什么该应用程序要从当前个人或小组手中转交？\n* 前任应用程序管理员是否要离开组织？\n\
  * 他/她以后是否可以作为你的备份人员？\n* 为什么专门交接给你？\n* 应用程序是如何许可的？\n\n软件应用程序有几种常见的许可模式：\n\n* 具名用户（Named\
  \ user）——意味着只有特定的终端用户有权使用应用程序\n* 席位许可（Seat License）——公司购买特定数量用户（席位）在任何时间使用应用程序的权利。只要任何时间人数不超过限制，公司的任何员工都可以随时使用该应用程序。\n\
  * 无限制（Unlimited）——任何时间允许任何数量的用户使用该应用程序。\n\n* 该应用程序有哪些文档？这包括用户手册以及管理活动的文档。\n* 供应商是否为该应用程序提供了“管理员指南”或“安装指南”？\n\
  * 前任应用管理员是否有关于该应用程序的笔记、清单、口传经验等？\n* 现任应用程序管理员能否提供其执行的常规任务列表，以及每个任务执行所需的时间？\n* 当前管理员每周或每月大约花费多少工时支持该应用程序？\n\
