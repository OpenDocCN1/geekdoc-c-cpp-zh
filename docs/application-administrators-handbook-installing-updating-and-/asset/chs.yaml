  \n（注：由于原文存在大量重复段落，已按要求对核心内容进行逻辑完整翻译）\n\n也许，最大的区别在于，数据馈可能没有表头或花哨的格式。最可能需要的文件必须是 `CSV`（逗号分隔值）文件或固定长度文件。`CSV`\
  \ 文件使用逗号来分隔记录中的字段。固定长度文件的每个字段都有固定长度，且整个记录长度也有固定长度。\n\n图 26.3 是 `CSV` 文件的示例，而图 26.4\
  \ 显示了固定长度文件的示例。\n\n许多应用程序需要生成将数据馈给其他系统的文件。例如，你支持的应用程序可能需要将数据导出到属于你组织其他部门的系统、客户、供应商、厂商、政府监管机构等。在许多方面，这个过程与编写创建报告的脚本或批处理文件非常相似。\n\
  \n（注：原文文本中存在多次重复的段落，翻译文已根据语意进行处理）\n\n### 26.2.8 收集日志文件\n\n如果你在应用程序中遇到问题并无法自行解决，那么你可能会向供应商的支持团队开启工单。当你开启工单时，他们会想要关于问题的信息，以帮助他们理解发生了什么以及如何重现。他们可能还会想要的另一个额外信息是服务器发生错误时的日志文件。这些文件帮助他们拼凑发生了什么以及出了什么问题。\n\
  \n由于你需要多次收集这些日志文件，编写一个脚本来收集它们非常有意义。使用脚本进行这些操作更快、更简单且更准确。实现此目的批处理文件示例见以下代码段。\n\n\
  ```batch\nREM 使用此批处理文件捕捉日志文件发送给供应商\n\nREM 1) 创建目录如 C:\\App1\\20130401 Logs\\\n```\n\
  \n\n\n\nREM 2) 将 `SaveLogs.bat` 复制到子目录\n\nREM 3) 执行 `SaveLogs.bat`\n\nREM 4) 确认预期的目录/文件已创建\n\
  \nREM 5) 从新子目录删除 `SaveLogs.bat`\n\nREM 6) 将子目录压缩并通过 ftp 或 电子邮件发送给供应商\n\n```\nmkdir\
  \ db\ncopy C:\\App1\\db\\logs\\db.log db\\*\nmkdir logs\ncopy C:\\App1\\logs\\*.*\
  \ logs\\*\nmkdir AdminServer\ncopy C:\\App1\\AdminServer\\logs\\access.log AdminServer\\\
  *\ncopy C:\\App1\\AdminServer\\logs\\App1AdminServer.log AdminServer\\*\ncopy C:\\\
  App1\\AdminServer\\logs\\App1Domain.log AdminServer\\*\nmkdir App1Server\ncopy C:\\\
  App1\\App1Server1\\logs\\access.log App1Server\\*\ncopy C:\\App1\\App1Server1\\\
  logs\\App1Server1.log App1Server\\*\n```\n\n### 26.2.9 删除旧文件\n\n大多数应用程序服务器上都有不同类型的文件。其中许多文件在有限的时间内很有价值，但此之后价值就会递减。例如，几个月前的日志文件几乎肯定不会再次被引用。比昨天、上周或上个月旧的报告文件可能价值无几，特别是当它们可以很容易重新创建时。如果不经常删除这些较旧的文件，没不了多久，应用程序服务器的磁盘驱动器就会完全填满。\n\
  \n编写一个用于定期删除文件的批处理文件并不并不困难，而且可以为你节省大量时间。以下代码删除了不再需要的备份文件。此示例包含注释，并将正在删除的文件列表写入日志文件。如果没有这些行，此批处理作业将只有两行代码。\n\
  \n```\nREM 删除大于 4 天的备份文件的批处理文件。\nREM 正在删除的文件列表。\necho ' >> c:\\Delete.log\necho\
  \ %date:~4,2%/%date:~7,2%/%date:~10,4% %time% >> c:\\Delete.log\nREM 输出被删除内容的列表。\n\
  FORFILES /P C:\\App1\\backup /M *.log /D -5 /C “cmd /c echo @path being deleted”\
  \ >> c:\\Delete.log\nFORFILES /P C:\\App1\\backup /M *.zip /D -5 /C “cmd /c echo\
  \ @path being deleted” >> c:\\Delete.log\nREM 实际删除文件\nFORFILES /P C:\\App1\\backup\
  \ /M *.log /D -5 /C “cmd /c del @path”\nFORFILES /P C:\\App1\\backup /M *.zip /D\
  \ -5 /C “cmd /c del @path”\n```\n\n### 26.2.10 升级前的目录和文件备份\n\n在升级应用程序时，你可能会被要求执行的首要步骤之一是备份特定的文件和目录。如果升级进展不顺利，可以使用这些备份来快速恢复到应用程序的当前版本。确保这一点无误至关重要，但你也希望尽可能快地完成。实现这两个目标的一种方法是在批处理文件或脚本中编写一系列复制命令。此脚本可以在升级开发环境时初始编写，在升级\
  \ QA 环境时进行测试，并在升级生产环境时放心地地使用。\n\n以下代码段显示了在 Windows 计算机上备份目录和文件的命令示例。\n\n```\nxcopy\
  \ C:\\App1\\reports\\web\\p2p\\WEB-INF\\lib c:\\_App1_Backup\\web\\lib /E\nxcopy\
  \ C:\\App1\\reports\\config c:\\_App1_Backup\\config /E\nxcopy C:\\App1\\CC\\apache-tomcat\
  \ c:\\_App1_Backup\\CC\\apache-tomcat /E\nxcopy C:\\App1\\CC\\tools\\bin c:\\_App1_Backup\\\
  CC\\tools\\bin /E\ncopy C:\\App1\\CC\\registry.xml C:\\_App1_Backup\\registry.xml\n\
  ```\n\n### 26.2.11 监控工具\n\n如果你的组织没有投资像 SolarWinds 或 OpenView 这样的商业监控工具，可行的替代方案是像\
  \ Nagios 这样的开源工具。如果即使开源工具在你的组织中不可接受，那么也可以编写能够执行基本水平监控的脚本。\n\n可以编写相对简单的脚本来检查以下内容：\n\
  \n- 进程未运行\n- 关键文件不存在\n- 特定的错误信息已写入日志文件\n- 应该开启的端口已关闭\n- 磁盘驱动器的使用空间超过特定阈值，例如达到 90%、95%\
  \ 或 100% 满\n- CPU 利用率超过特定阈值，例如 70%、80% 或 90%\n\n这可能需要一些研究、编码和练习，但上述所有标准都可以被监控。正如前面的章节所建议的，询问你组织中的同事，看看是否有人已经建立了你正在寻找的监控。如果不存在，就翻出你的参考手册并开始实验。当然，你希望在开发或测试服务器上进行所有的开发和测试。只有在你确认它运行良好后，才应将其移动到生产环境。\n\
  \n如果你的应用程序要求特定的服务或进程运行，编写一个脚本来确认其正在运行并不困难。如果服务没有运行，则发送一封电子邮件提醒你和其他人。安排此脚本或批处理文件每\
  \ 5、10 或 15 分钟运行一次，这样，你就拥有了一个监控工具。\n\n当关键服务宕机时可以采取的操作之一是针对其发布警报。如果警报是以电子邮件的形式发送，最好发送到分发列表。通过使用分发列表，可以更改接收者，而无需修改监控程序甚至无需登录服务器。\n\
  \n如果应用程序非常重要，你可能想向支持人员发送短信。向手机发送短信几乎与发送电子邮件一样简单。取决于你的服务提供商，你可能只需要在手机号码后附加服务提供商的域名。例如，向以下地址发送电子邮件将向手机发送一条\
  \ IM：\n\n`800555100@messaging.sprint.com`\n\n### 26.2.12 关键服务宕机时重启应用程序\n\n如果需要将停机时间减少到最低，你可以编写一个脚本在服务停止时重启它。当监控工具（你编写的或第三方工具）发现关键服务已停止时，它将重启应用程序。如果你的应用程序涉及多个服务，可能的预防措施是停止所有进程或服务，然后重新启动它们，以确保它们按顺序启动。如果供应商提供了启动和停止应用程序的脚本，这绝对减少了你的工作量。\n\
  \n### 26.2.13 剪贴板弹出\n\n我管理的一个 LMS（学习管理系统）有一项每月任务，要求我登录应用程序、逐个调出账户列表并禁用它们。没有批量禁用工具，因此这是一个手动过程。可以将需要禁用的用户列表导出到电子表格中。我注意到我花费大量时间从电子表格中复制用户\
  \ ID 并将其粘贴到应用程序的文本框中。我编写了一个快速实用程序，允许我将整个账户 ID 列表加载到缓冲区。通过点击 `Next Value` 按钮，将显示下一个\
  \ ID 并加载到剪贴板缓冲区。这允许我非常快速地将下一个 ID 粘贴到应用程序的用户 ID 文本框并点击搜索按钮。图 26.5 是该实用程序界面的截图。\n\n\
  ![image](img/F000261f26-05-9780123985453.jpg)\n\n图 26.5 剪贴板弹出工具。\n\n### 26.2.14\
  \ 有多少用户登录了应用程序\n\n\n\n\n\n有时，你可能想知道当前有多少用户登录了应用程序。一个非常常见的例子是，你想关闭应用程序，但又不想终止任何用户会话。如果应用程序提供了此功能，请务必使用它。如果没有提供，那么这可能是你应该考虑开发的一个功能。\n\
  \n如果应用程序没有提供此功能，那么你可能需要通过一些创意来获取这些信息。我支持过的一个应用程序会将所有的登录和注销操作都写到日志文件中。可以编写一个实用程序或脚本，从当前时间向后扫描日志文件，列出所有已登录但尚未注销的人。\n\
  \n另一个可能的解决方案是通过数据库。每当有人登录应用程序时，应用程序是否会创建一个记录行？该记录是否会进行更新以反映他们已经注销，例如，通过向名为 `logout_time`\
  \ 的列写入日期和时间值之类的操作？通过扫描该表并查找没有注销时间的记录，你就可以获得一个当前所有登录应用程序的用户列表。\n\n### 26.2.15 停止屏幕保护程序启动\n\
  \n不要告诉安全团队这一节的内容，但有时工作站启动屏幕保护程序确实很烦人。会话这样锁定会对你可能正在运行的任何进程产生不可预测的影响。\n\n如果你正在远程工作并建立了\
  \ VPN 会话，如果笔记本电脑超时，会更加烦人，因为那样你的 VPN 会话可能会丢失。这需要你重新登录网络。\n\n如果能够避免会话超时不是很好吗？这不仅是可能的，而且相对简单。下面在\
  \ VBS（Visual Basic 脚本）文件中（例如 `StopScreensSaver.vbs`）显示的代码将每隔 120 秒激活一次 F15 键。\n\n\
  ```vbbs\nSet ws = CreateObject(\"WScript.Shell\")\n\nDo\n\nWscript.Sleep 120000\n\
  \nws.SendKeys \"{F15}\"\n\nLoop\n```\n\n要启动此脚本，你需要创建一个包含以下命令的 `.bat` 文件。我创建的文件命名为\
  \ `StopScreensaver.bat`。\n\n```cmd\ncscript.exe c:\\_StopScreensaver\\StopScreenSaver.vbs\n\
  ```\n\n我的示例中，这些文件位于名为 `C:\\_StopScreensaver` 的目录中。如果你将文件放置在任何其他目录，则需要相应地调整 `.bat`\
  \ 文件中的命令。\n\n### 26.2.16 击键程序\n\n有时，你需要反复执行相同的按键操作。一个极佳的例子是你正在对应用程序进行压力测试。在进行压力测试时，你希望在应用程序中产生尽可能多的活动。无限地重复同一个函数对你来说可能看起来是冗的，但它是在强制应用程序做出响应。如果你能让\
  \ 10 个人或 100 个人同时进行这样的测试，那就更好了。\n\n有一些第三方工具可以做到这一点。如果你熟悉电子表格和文字处理程序中的“宏”功能，那么其功能是类似的。基本上，你开启一个“录制器”，然后开始按键。完成后，你停止“录制器”。你输入的所有按键都会记录在一个文件中。该工具可以回放你所有的按键。某些工具允许你编辑该文件。这将使你能够让它循环。\n\
  \n这种“宏”脚本功能对于压力测试非常有用。你只需要录制你想执行的所有操作，然后启动脚本即可。如果你能够多次登录应用程序，你可以在单个工作站上运行多个会话。10\
  \ 台工作站或 PC 每个运行 25 个会话，将让你能够模拟或重现 250 个不同用户的活动。\n\n可用的键盘宏工具示例包括：\n* KeyText\n* Keyboard\
  \ Express\n* AutoIt\n* Superkey\n\n### 26.2.17 文件比较\n\n会有很多时候你需要比较两个文件。一个常见的例子是需要比较升级前后的配置文件。在许多情况下，这些文件由于太长或太详尽，无法通过肉眼观察来准确比较。\n\
  \n在待比较的文件过于复杂的情况下，你可能需要一个工具来比较它们。一些可用工具包括：\n\n* Windows 命令行提示符中的 `fc` 命令\n* UNIX\
  \ 和 Linux 中的 `diff` 命令\n* 如果你更习惯于使用 GUI 工具，那么 Notepad++ 是一个非常好的选择。它有一个非常方便的比较功能。要比较两个文件，同时打开它们，然后选择菜单项\
  \ Plugins | Compare。最棒的是，Notepad++ 是开源的，可以免费下载。\n* WinMerge 是一个用于 Windows 识别文件差异的开源工具。它以视觉文本格式呈现差异，使差异易于识别和合并。WinMerge\
  \ 还能比较目录结构并显示它们之间的差异。\n\n### 26.2.18 同步文件\n\n由于许多原因，你可能想或需要在两个不同的平台之间同步文件。其中一些情况包括：\n\
  \n* DR（灾难恢复）系统需要与生产系统保持同步\n* 定期，测试系统需要与开发系统同步\n* 特殊用途环境（例如年终测试或全球测试）需要与 QA 系统同步\n\
  * 定期需要将生产系统的内容推送到所有其他环境\n\n如果需要同步服务器之间的文件，那么至少有两种方法可以实现。第一种是编写一系列 `copy`、`cp` 或\
  \ `xcopy` 命令。也许这种方法最大的缺点是它会耗费大量的维护工作。每当系统添加新文件、新目录或新驱动器时，同步脚本都必须进行更新。\n\n手动操作的替代方案是使用工具在服务器之间同步文件。一个随手可工具是\
  \ `rsync`（远程同步）命令。`rsync` 最初为 UNIX 系统编写的，但已移植到 Linux 和 Windows 平台。`rsync` 的基本格式为：\n\
  \n`rsync options source destination`\n\n源和目的值可以指定服务器名称以及目录名称。可以使用通配符来允许对复制的文件更具灵活性。`rsync`\
  \ 的一个区别于标准远程复制工具的特性是，它只复制自上次 `rsync` 运行以来发生变化的文件。更高的效率使得 `rsync` 能够产生更少的网络流量并更快地完成。\n\
  \n`rsync` 命令指定的某些选项包括：\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-c` | 使用校验和值确定哪些应被复制\
  \ |\n| `-n` | 执行测试，即不会实际复制任何文件 |\n| `-p` | 在目标服务器上保留权限 |\n| `-q` | 静静模式运行，即不显示命令执行的细节\
  \ |\n| `-r` | 递归处理目录中的目录 |\n| `-R` | 使用相对路径名 |\n| `-t` | 在目标服务器上保留时间 |\n| `-v` |\
  \ 详细，即显示命令执行的细节 |\n| `-z` | 在传输过程中压缩文件\n\n### 26.2.19 新用户\n\n添加用户的过程对于每个应用程序似乎都不同。如果你足够，你支持的应用程序有一个批量注册工具。如果存在此类工具，它可能期望新用户位于\
  \ CSV 文件中。\n\n\n\n\n在首次在生产环境中使用此工具之前，你肯定希望在开发或 QA（测试）环境中对其进行测试。在 QA 环境中运行批量注册后，你应该使用其中一个新账户登录应用程序，以验证其是否已正确创建。以其中一个新用户的身份登录后，运行一些快速检查，以确认账户拥有其本应的所有权限，且没有多余权限。\n\
  \n如果相关应用程序没有提供批量注册工具，你可能会想找到一种添加新用户的方法，而无需手动将他们的信息输入应用程序的数据输入屏幕中。例如，你可能认为可以使用 `SQL`\
  \ 语句向相应的数据库表插入数据。除非厂商的支持小组明确告知你这样做可以正常工作，否则我强烈建议不要这样做。大多数厂商的数据库设计都极其复杂，可能无法直观看出所有表是如何相互关联的。\n\
  \n### 26.2.20 审计\n\n许多组织要求每年对其应用程序进行审计。如果你支持的应用程序需要经过审计的，那么你应该警惕那些让审计过程更高效、更简单、更自动化的方法。在脑海中审查审计过程的每一步，看看它们是否可以自动化或以某种方式提高效率。\n\
  \n审计需求针对你的特定组织，因为每个人的审计过程都是不同的。以下报告是使审计过程更高效的一些方法示例：\n\n- 列出所有用户以及每个用户被授予的访问权限\n\
  - 列出所有用户及其主管\n- 列出每个用户上次访问应用程序的时间\n- 审批者是授权访问应用程序的人。为每位审批者创建一份报告，列出他们批准的每一个用户。这些报告可以用于验证所有现有用户是否继续拥有访问系统的合法需求。\n\
  \n# 第 27 章\n\n# 第三方工具\n\n## 摘要\n\n有些第三方工具非常有用，但由于过于复杂，你自己无法构建构建。这些工具的示例包括服务器监控器、远程访问、会话共享、编辑器、数据库访问工具、浏览器、数据访问和项目管理工具。\n\
  \n### 关键词\n\n第三方工具；sysinternals 工具；远程会话工具；会话共享工具；复制工具；监控工具；`WMIC`；网络监控工具；编辑器；文件比较；压缩；加密；截图工具；图像编辑器；浏览器；数据访问；项目管理\n\
  \n有些工具是你可以也应该自己构建的，但另一些要复杂得多，现实中普通的应用程序管理员无法构建。它们可能要求你在你不熟悉的领域拥有丰富的编程经验。此外还有时间因素。大多数应用程序管理员都头头很大，没有精力从零开始构建重要的新工具。\n\
  \n接下来的章节简要描述由他人构建的、你可以用来支持你的应用程序的工具。如果你对其中某个感兴趣，可以轻松地进行网络搜索以获取更多细节，通常也可以下载这些工具。\n\
  \n## 27.1 Sysinternals 工具\n\n如果你的应用程序运行在 Windows 计算机，那么熟悉由 Mark Russinovich 创建的\
  \ Windows `Sysinternals` 工具将使你受益。在本文写作时，我能够从 URL `http://technet.microsoft.com/en-us/sysinternals/bb842062.aspx`\
  \ 免费下载这套工具。这里列出了我发现非常有用的一些工具。这绝不是一个完整的列表。\n\n- `AccessEnum`——一种确定谁可以访问计算机上的目录、文件和注册表项的简单方法。\n\
  - `Autoruns`——列出系统启动时启动的程序。\n- `BgInfo`——自动生成桌面背景，列出服务器详细信息，包括计算机名称、IP 地址、服务器上的网卡等。在你的每台服务器上显示这些非常有用。\n\
  - `DiskView`——以图形化方式显示正在使用的磁盘扇区。\n- `DiskUsage`——列出目录以及每个目录使用的磁盘空间。如果你试图寻找删除的文件以释放磁盘空间，这很有用。\n\
  - `Handle`——显示已打开的文件以及谁拥有这些文件的句柄。当你尝试删除一个文件但由于某个进程当前打开了它而无法删除时，知道这些可能非常有价值。\n- `ListDLLs`——列出正在使用某个\
  \ `DLL` 的进程。如果你想更新它并需要知道哪些进程会受此更改的影响，这很有用。\n- `LogonSessions`——列出计算机上当前和最近的登录会话。如果你包含了\
  \ `/p` 参数，那么 `LogonSessions` 将列出在每个登录会话期间运行的可执行文件。\n- `MoveFile`——在系统下次重启后立即将文件移动到指定位置。如果你需要更改的文件在系统启动后不久被某个进程打开并锁定，这非常有用。如果你想删除一个文件，只需为\
  \ `MoveFile` 命令指定一对双引号 (\"\") 作为目标即可。\n- `ProcDump`——为任何命名的进程创建进程转储。如果某个进程挂起但你不知道为什么，这非常有用。在捕获任何进程转储之前，确保有人能够读取它们。如果你无法解释它，它对你就没用。\n\
  - `ProcessExplorer`——一个列出计算机上运行的所有进程的工具。可以从 `ProcessExplorer` 杀死任何进程或进程树。它还可以用于查找哪个进程打开了句柄或\
  \ `DLL`。\n\n关于使用这些工具有一个警告——它们极其强大，因此在操作之前务必知道自己在做什么。第一次使用特定命令时，在测试或开发系统上练习比在生产平台上练习要好主意。\n\
  \n## 27.2 远程会话\n\n所有的应用程序管理员都需要熟悉建立和在远程会话中使用。在选择远程会话工具之前，你应该问的问题包括：\n\n- 包含哪些功能？例如，远程打印、文件传输、远程控制。\n\
  - 它可以在你组织部署的操作系统上运行吗？\n- 是否需要打开防火墙端口？\n- 是否需要连接到中央服务器？\n- 是否需要插件？\n- 客户端是否需要安装代理？\n\
  - 使用此类工具风险？\n- 使用什么加密算法进行会话编码？\n- 如果工具不是免费的，你支付的是一次性费用还是年度许可费用？\n- 你可以同时操作多少会话？\n\
  - 会话性能如何？\n\n有很多优秀的工具可以用于远程会话。许多工具要么是免费的，要么是 Windows 预装，要么提供了功能有限的免费版本。这里是一些示例：\n\
  \n- `Gbridge`——此工具是免费的。它允许计算机之间进行文件传输。它已移植到多个版本的 Windows。不需要任何防火墙更改，即无需打开任何端口。\n\
  - `LogMeIn`——该工具也是免费的，但提供了按年订阅付费的专业版。已移植到 Mac 和 Windows PC。连接 LogMeIn 网站的 PC 需要安装主机代理。不需要任何防火墙更改。适用于多种网络浏览器。\n\
  \n\n\n\n\n- `RDC`—远程桌面连接（Remote Desktop Connection）——此免费工具内置在所有当前版本的 Windows 中。它需要打开防火墙端口。适用于当前版本的\
  \ Windows 和 Mac。\n- `TeamViewer`—既有免费版，也有不免费的商业版。适用于当前版本的 Windows 以及从 `OS X 10.4`\
  \ 开始的 Mac 版本。要求在远程计算机上安装代理程序或运行内存驻留客户端。\n- `VNC Viewer`—既有免费版，也有不免费的个人版和企业版。适用于\
  \ Windows、Mac、UNIX 和 Linux。它不需要代理程序或集中式服务器。它使用端口 `80`，因此不需要任何防火墙更改。\n- `WinRemotePC`—此工具是免费的。它运行在当前版本的\
  \ Windows 上。为了让此工具与客户端计算机通信，必须打开防火墙端口。必须在远程计算机上安装代理程序。\n\n## 27.3 会话共享\n\n作为应用程序管理员，你很多时候需要共享自己的电脑屏幕或他人的屏幕。这种通信通常被称为在线会议。你可能需要此功能的示例包括：\n\
  \n- 与供应商技术人员合作安装软件或解决问题\n- 与用户合作以了解或纠正问题\n- 与同事合作处理某个问题或项目\n- 领导用户培训\n\n第 27.2 节中描述的部分工具可以用于会话共享。还有其他专门用于共享会话的工具。同样，某些是免费的，而另一些会消耗你的预算。其中的示例有：\n\
  \n- `Cisco WebEx`—移植到了 Windows、UNIX 和 Linux。基于浏览器，并要求下载并安装浏览器插件来托管会议。仅加入在线会议的人无需执行安装。需按月支付许可，但提供免费试用。\n\
  - `GoToMeeting`—基于浏览器的工具，已移植到 Mac 和 PC 平台。该工具有每月费用，但提供免费试用版。\n- `Mikogo`—参与者通过将浏览器指向\
  \ `Mikogo` 网站并输入会话 ID 加入会议。无需下载。`Mikogo` 适用于 Windows、Apple 和 Linux 计算机。该工具的价格可以选择按年或终身付费，并提供自由者、团队或企业版本。\n\
  - `Microsoft Lync`—微软的统一通信旗舰产品。`Lync` 包含与通话参与者共享屏幕的能力。此产品不是免费的。\n- `Adobe Connect`—参与者通过网络浏览器连接，因此不需要安装任何软件。`Connect`\
  \ 不是免费工具，有按月或按年的许可费。\n\n一个非常有用的功能是录制会话并在以后播放。这对于培训课程非常有帮助。你不需要对每个新用户培训应用程序，只需录制一次材料并引导新用户访问链接。录制的会话可以提供视频版的\
  \ FAQ（常见问题）列表。对于用户遇到的每个问题或疑问，你录制一个描述该问题或困难以及如何解决它的会话。如果你认为录制会话是你想要做的，请确保你选择的工具具有此功能。\n\
  \n## 27.4 移动文件\n\n作为应用程序管理员，你经常需要将文件从一台计算机移动到另一台计算机。这是一项如此常见的任务，以至于能够能够完成它。例如，你可能需要：\n\
  \n- 从供应商网站下载升级或补丁文件，然后将其移动到应用程序服务器上。\n- 从服务器上传日志文件到供应商网站或 `FTP` 服务器。\n- 运行 `SQL`\
  \ 查询从数据库中提取数据，并将结果文件传递给业务所有者。\n- 从业务所有者接收数据文件并通过批量插入工具将其导入应用程序。\n- 将数据从生产服务器移动到\
  \ `QA` 或开发服务器，以便两台服务器可以同步。\n- 将数据或备份文件从生产环境移动到 `DR` 服务器，以测试或激活你的 `DR` 环境。\n- 将计划报告或数据提取的结果传输到另一个部门、供应商或客户。\n\
  \n后续章节描述了某些可用于移动文件的工具。其中某些可能已经存在于你的服务器上。另一些是开源的，可以免费下载。另一些则需要许可费用。\n\n### 27.4.1\
  \ FTP\n\n`FTP`，文件传输协议，是一种广泛用于跨网络（如 Internet）传输程序的。最初，`FTP` 客户端是命令行工具。现在，有许多用于 `FTP`\
  \ 的 `GUI` 或图形化用户界面。`GUI FTP` 工具的一个示例是 `FileZilla`。你应该使用任何对你来说最舒适的界面。\n\n关于传输类型设置的一个警告是\
  \ FTP 会话。此设置控制数据在实际传输时的格式化方式。可能的值有：\n\n- `ASCII`—用于在计算机之间使用 `ASCII` 字符集传输文本文件。PC\
  \ 和服务器通常使用 `ASCII`。如果你正在向供应商的支持组上传日志文件，那么你应该使用 `ASCII` 设置。\n- `Binary`—文件内容按字节传递，而不会转换为类似\
  \ `ASCII` 或 `EBCDIC` 的字符表示。例如，如果你正在从供应商处下载文件以对你的应用程序进行升级，你应该使用 `binary` 设置。\n- `EBCDIC`—用于在使用\
  \ `EBCDIC` 的计算机之间传输文本文件。通常，大型机使用 `EBCDIC`。\n\n使用 `FTP` 在两个系统之间移动文件时，如果使用了错误的模式，可能会导致意外的问题。请注意你正在传输的文件类型，并相应地调整类型设置。\n\
  \n`FTP` 最大的缺点是它是不安全的。文件在跨网络发送时不会被加密。任何访问网络的人都可以使用数据嗅探器捕获传输你文件的数据包。数据包是明文的，因此任何对隐私或机密性的期望都是不切实际的。第\
  \ 27.4.2 节 描述了包含安全性的 `FTP` 变体。\n\n有很多工具实现了 `FTP` 协议。简要列表包括：\n\n- 命令行工具——最大的优势是许多计算机已经预装了\
  \ `FTP` 命令。缺点是你必须学习设置 `FTP` 连接和传输文件所需的命令。如果已经熟悉 `DOS` 或 `UNIX` 命令，那么学习 `FTP` 的基础知识应该会非常容易。\n\
  - `FileZilla`—一种免费的 `GUI`based `FTP` 工具。易于设置和使用。`FileZilla` 是最常用的 `GUI`based `FTP`\
  \ 工具之一。\n\n\n\n\n\n在你作为应用程序管理员的职业生涯中某个时刻，你将需要弄清楚服务器上发生了什么情况。你的目标可能是让应用程序运行得更快。或者是为了弄明为什么服务器的所有内存都被占用了。又可能是为了找出哪个进程锁定了特定文件。有很多工具可以帮助你回答许多问题，包括我刚才列出的那些。诀窍在于在你需要这些工具`之前`\
  \ 就先对它们变得熟练。这样你就可以专注于解决问题，而不是花时间在寻找或学习使用工具上。\n\n## 27.5.1 监控服务器\n\n后续章节描述了你可以用来识别服务器上正在发生哪些活动的的工具。请注意，其中某些工具需要在问题发生之前部署好。\n\
  \n### 27.5.1.1 任务管理器\n\n`Task Manager`（任务管理器）是 Windows 计算机上最基本的监控工具之一。它可以为你提供关于服务器进程的以下见解：\n\
  \n• 正在运行的进程\n• 每个进程的 `PID`（进程 ID）\n• 进程是 32 位还是 64 位的\n• 每个进程的所有者\n• 每个进程占用的 CPU\
  \ 时间\n• 每个进程占用的内存\n• 活跃的应用程序\n• 所有定义的服务及其当前状态（停止、运行、禁用、启动、正在停止）\n• 启动每个服务的命令行语句\n\
  • 当前登录到系统的所有用户\n• 显示 CPU 使用率和内存使用随时间变化的滚动图表。\n\n`Task Manager` 及其许多功能的详细描述已在第 17\
  \ 章中介绍。\n\n### 27.5.1.2 Perfmon\n\n`Perfmon`，又称 `Performance Monitor`（性能监器），是一个允许你选择记录哪些系统指标、记录频率以及将结果写入何何处的工具。使用\
  \ `Perfmon`，你可以监控服务器上发生的几乎任何类型的活动。\n\n使用 `Perfmon` 的几点建议如下：\n\n• 不要尝试记录每一个可能的指标。细节会让你淹没，并可能影响服务器性能。最好从采集较少的统计数据开始，然后逐个添加到列表中。\n\
  • 确保你理解你正在监控的指标。不要根据你对某个统计数据含义的假设做出决策。如果你不完全确定，请查看 `Perfmon` 中的帮助屏幕或在互联网上搜索该统计数据。\n\
  • 抵制过于频繁地捕捉指标的诱惑。如果 `Perfmon` 每秒运行一次，数据量将让你应接不并可能影响服务器性能。\n• 在问题发生之前让 `Perfmon`\
  \ 运行。这将让你看到性能何时开始下降，或者资源（如内存）具体何时变得稀缺。\n• 让 `Perfmon` 至少每天创建一个新文件。按天打开和查看指标比一次性查看一周或一个月要容易。\n\
  \n`Perfmon` 在第 17 章中有过更详细的描述。\n\n### 27.5.1.3 ProcessExplorer\n\n`ProcessExplorer`\
  \ 是 Mark Russinovich 编写的 Sysinternals 工具包的一部分。这个工具可能是确定 Windows 计算机上发生什么的最实用的工具。它在第\
  \ 23 章中曾被详细描述，因此我不想重复已经列出的内容。这是一个需要你去尝试和探索的工具。你用得越多，就会发现它越有用。\n\n### 27.5.1.4 WMIC\n\
  \n`WMIC`（`Windows Management Instrument Command`，Windows 管理实例命令行工具）也曾在第 23 章中描述过，但它非常再次列出。它不像\
  \ GUI 工具那样直观，但包含了极其丰富的功能。你可以用它来查找有关服务器的以下类型的信息：\n\n• 硬件细节，如 CPU 类型、CPU 速度、网卡（NIC）数量、内存大小等。\n\
  • 已加载到服务器上的软件\n• 列出用户账户信息\n• 列出活动进程信息\n• 终止进程\n• 列出打印机及其状态\n• 列出已应用于操作系统的修复和补丁\n\
  • 硬盘、CD-ROM 驱动器和网卡等设备的详情\n\n`WMIC` 可以以两种模式运行：交互式和非交互式。如果你有很多查询需要执行，交互式模式非常好。如果你只有一个查询需要执行，非交互式模式很有用。你可以将多个\
  \ `WMIC` 指令写入文件，并在非交互模式下调用该文件来执行。\n\n## 27.5.2 监控网络\n\n每个企业级应用程序最终都依赖网络才能运行。用户浏览器需要与\
  \ Web 服务器和 DNS 服务器通信。Web 服务器需要与数据库服务器和 AD 服务器通信。数据库服务器需要与 SAN 通信。所有这些通信都需要网络功能正常且不过载。\n\
  \n网络监控工具可以执行的一些功能包括：\n\n• 提供网络的高级示意图或图片\n• 识别网络中出现丢包的链路\n• 识别缓慢的链路\n• 识别可能即将掉线的链路\n\
  • 网络利用率\n• 分析路由协议以优化网络效率\n• 维护历史路由信息以便与当前信息对比\n• 记录链路或硬件的故障\n• 通过在配置的时间间隔检查 HTTP\
  \ 来监控网站\n• 提供网络容量和增长的统计数据\n• 识别消耗大量带宽的用户或应用程序\n\n有很多工具可以让你映射并监控网络。有些是开源的，有些是需要许可费的商业产品。越早开始监控，就越早发现异常情况。\n\
  \n\n\n\n编辑文件是应用程序管理员的日常工作。某些编辑器无法显示特定的文件类型，或者即使可以显示，格式也不特别方便。例如，`Notepad` 无法对齐 XML\
  \ 文件中的匹配元素。如果你处理的文件不是 ASCII 文本，那么使用一个能够识别不同文件类型的编辑器既方便又能提高工作效率。你可能会遇到的一些文件类型示例包括：\n\
  \n* 配置文件、初始化文件、批处理文件和脚本通常是 ASCII 格式，可以使用几乎任何编辑器进行编辑。\n* 日志文件也可能是文本文件。一个问题是，某些日志文件太大，无法用像\
  \ `Notepad` 这样简单的编辑器打开。要打开一个几十或几百兆字节的文件，你需要一个足够智能的编辑器，不会尝试一次性加载整个文件。如果你的编辑器尝试加载整个文件，那么启动将花费很长时间，运行速度非常缓慢，并消耗计算机的大部分内存。\n\
  * XML 文件具有必须平衡的匹配闭合语法。可以使用像 `Notepad` 这样简单的文本编辑器进行编辑，但如果你使用专为 XML 代码构建的编辑器，将会容易得多。此外，在使用以\
  \ XML 为导向的编辑器时，你不太可能出现拼写或其他错误。\n* HTML 文件和 XML 文件一样，具有必须平衡的闭合语法。可以使用简单的文本编辑器，但如果你使用专为处理\
  \ HTML 文件构建的编辑器，你的效率和生产力将显著提高。\n* 大多数，如果你必须处理 PDF 文件，你只需要读取它。如果你需要编辑它，必须使用与该文件类型兼容的编辑器。\n\
  * 像 `C`、`C#` 和 `Java` 等代码文件可以在简单的编辑器中编辑。但使用像 `IDE`（集成开发环境）中的专用编辑器将使你的生产力提高并减少错误。这类编辑器提供的某些功能包括：\n\
  \n* 对语法词、变量等不同元素进行颜色编码\n* 自动补全关键词\n* 显示过程调用所需的参数列表\n* 自动添加闭合元素，如括号、大括号和“End”语句\n\
  * 在工作日中你将创建和更新大量的文档。为了让这些文档显得美观且专业，你需要像 `Microsoft Word` 或 `OpenOffice Writer` 这样的文字处理器。\n\
  \n所有的 Windows 计算机都预装了 `Notepad` 和 `Wordpad`。所有的 `Linux` 和 `UNIX` 计算机都带有 `vi`。还有许多许多其他编辑器可供。有些是开源的，有些则需要许可费用。根据你的具体需求，你应该获取一个或多个能让你在使用最常用的文件类型时效率更高的编辑器。\n\
  \n在决定编辑器之前，你可能考虑的特性如下：\n\n* 编辑器可以打开被另一个进程锁定的文件吗？有些有些不能。\n* 编辑器可以显示以下格式的文件吗：十六进制、八进制或二进制？\n\
  * `UNIX` 和 `Windows` 文件具有不同的行终止符。编辑器可以同时创建两种格式的文件吗？\n* 可以通过将文件拖放到编辑器来打开吗？\n* 它能够执行文件比较吗？\n\
  * 它如何处理极大的文件？\n* 可以同时打开多个文件吗？\n\n如果你在互联网上搜索编辑器，你会得到几十万条结果。任何书籍都不可能评论或推荐如此众多选项中的极一小部分。下面列出了几种可用编辑器，但此列表显然只是你可用选项中的极小部分。\n\
  \n### 27.6.1.1 Notepad++\n\n`Notepad++` 是一个非常实用的开源文本编辑器。它一些更有用的功能部分列表包括：\n\n* 允许打开多个文档，每个文档都在单独的标签页中\n\
  * 文件比较，显示文件具体差异之处的高级视图\n* 分屏编辑\n* 宏录制和执行\n* 支持 `UNIX` 类型文件的行结束符\n* 用不同颜色的字体显示源代码语法文本\n\
  * 支持某些编程语言的自动补全\n* 支持许多语言，包括 `C`、`C++`、`C#`、`Java`、`JavaScript`、`XML`、`HTML`\n*\
  \ 提供超过 100 个插件以进一步扩展此编辑器的功能\n\n### 27.6.1.2 UltraEdit\n\n`UltraEdit` 是一款商业文本编辑器，提供了许多\
  \ `Notepad` 之外的功能。它的一些优势包括：\n\n* 能够处理大于 4 GB 的文件\n* 强大的文本比较工具，包括比较二进制文件的能力\n* 替换操作可以保留被替换字符串的大小写\n\
  * 对语法、变量等进行颜色编码\n* 易于识别匹配分隔符，例如左括号和右括号\n* 支持许多语言，包括 `C`、`C++`、`PHP`、`XML`、`HTML`、`Java`、`JavaScript`\
  \ 和 `Perl`\n* 语法关键词的自动补全\n\n### 27.6.1.3 PDF\n\n`PDF`（便携文档格式）由 `Adobe Systems` 公司开发。这种格式是典型的应用程序管理员经常遇到的。根据我的经验，许多供应商将其手册发布为\
  \ PDF 文档。这样做是因为 PDF 文件可以在几乎任何计算机上打开。任何想从 `Adobe®` 网站下载的人都可以免费通过 `Adobe Reader®`\
  \ 读取 PDF 文件。\n\n### 27.6.2 比较\n\n很多时候，你需要比较两个或多个文件。例如，你可能想比较升级前后配置文件的版本。或者你可能需要比较位于\
  \ `CSV 文件` 中的两个数据列表。你应该确保你正在使用的编辑器具有比较文件的能力。\n\n### 27.6.3 压缩\n\n应用程序管理员偶尔不得不处理一些极大的文件。非常大的文件类型示例包括：\n\
  \n* 来自供应商的升级和安装包\n* 发送到供应商支持团队的日志文件\n* 发送到另一个系统或应用程序的大型导出文件\n* 备份文件\n* 从一个服务器复制应用程序到另一个\n\
  \n如果你需要存储、移动、`FTP` 或电子邮件极大的文件，先对它们进行压缩是非常常见的。压缩软件使用的算法可能非常复杂，但概念其实很简单。文件可以通过删除重复数据来压缩。在大多数情况下，重复部分被替换为小得多的代码值。当文件被解压缩时，算法会识别该代码并恢复原始值。源代码和日志文件特别充满了重复的文本字符串，因此它们通常可以压缩到原始大小的一小部分。\n\
  \n这里需要提供一个警告：一旦文件被压缩，你通常需要相同的包来解压缩。对于常见的压缩技术存在例外，但如果你偏离路径并使用不寻常的压缩包，那么将来你很可能需要它来解压缩该文件。如果使用非标准包压缩了文件，你确定在\
  \ 1 年、2 年或 5 年后你想解压缩它时仍然拥有该包吗？该包还会存在吗？它是否已经升级以适应未来使用的操作系统？这些只是在选择压缩包时需要考虑的几点。\n\n\
  \n\n\n除了服务器操作系统已加载的工具外，还有许多压缩工具可供。你需要注意的一个问题是，并不是所有压缩工具生成的输出都是等同的。它们可能使用不同的算法，因此一个工具可能无法解压由另一个工具创建的文件。接下来的章节将介绍一些常用的压缩工具示例。\n\
  \n在选择压缩工具之前，你应该问自己以下问题：\n\n- 该工具有效吗？\n- 它容易使用吗？\n- 它的界面是图形界面（GUI）还是命令行定向的？\n- 它是否已经移植到你工作的所有操作系统上？\n\
  - 它是否能够处理你经常遇到的压缩文件类型？\n- 该工具压缩和解压文件的速度快吗？\n- 能否将多个文件或文件夹合并为一个单一压缩输出？\n- 价格是否负担得起？\n\
  - 它在 1、2 或 5 年后还会存在吗？\n\n### 27.6.3.1 WinZip\n\n`WinZip` 带有相关的许可费用，但你可以免费下载试用版。它适用于\
  \ Windows 和 Mac 电脑。`WinZip` 可以创建多种类型的文件，并能解压使用许多流行压缩算法压缩的文件。一个具有安全意识的功能是，在提取加密文件时，`WinZip`\
  \ 创建的任何临时文件都会被擦除，以防止被他人滥用。\n\n### 27.6.3.2 WinRAR\n\n`WinRAR` 不是一个免费工具，但提供试用版供你在购买前尝试。你可能根据它的名称推断出它只运行在\
  \ Windows 操作系统上。它能够将文件压缩为 `RAR` 和 `ZIP` 格式，并可以打开许多类型的压缩文件，包括：`CAB`、`ARJ`、`TAR`、`ISO`、`7z`\
  \ 和 `Z`。`WinRAR` 的一个有用功能是创建跨卷的存档。如果你正在处理巨大的源文件，这将非常有价值。\n\n### 27.6.3.3 7-Zip\n\n\
  `7-Zip` 是一个可以免费下载的开源压缩工具。它能够压缩和解压大多数常用格式，如 `zip`、`TAR`、`GZIP`、`CAB`、`ISO` 和 `RAR`。`7zip`可以通过命令行或图形界面进行交互。该软件包最大的优势可能是它能够创建其自身的\
  \ `7z` 格式文件。\n\n### 27.6.3.4 FreeArc\n\n`FreeArc` 也是一个开源压缩工具。它同时支持 Windows 和 Linux\
  \ 系统。他们的网站声称该工具比其他压缩工具快二到五倍。`FreeArc` 提供的一个非常好的功能是用户可以对压缩算法设置进行精细调整。\n\n### 1. 加密\n\
  \n加密是一个严肃的话题，不应忽视。如果你有需要保护的文件或数据，你需要确保加密算法是安全的，并且使用方法是正确的。最常见的需求可能是数据从应用程序中提取并发送给另一个实体，例如供应商、客户或供应商。\n\
  \n许多压缩工具还包含了对正在压缩的文件进行加密的能力。在上述工具中，`FreeArc` 表示可以在压缩的同时进行加密。如果你的文件既需要压缩又加密，请考虑获取一个可以同时完成这两者的工具。如果你选择此路线，请确保该工具使用的加密算法足够强大。\n\
  \n如果你只需要加密工具，有很多种选择。如前所述，加密是一个需要正确处理的重要领域。任何实现加密过程的人都会明智地咨询该领域的专家，以确保设置安全。本书并不打算提供关于选择何种算法或使用多大密钥的建议。市场上上有数千个加密包，无法进行全部审查。接下来的章节将描述极少数的可用工具。\n\
  \n#### 1.1 BitLocker\n\n`BitLocker` 使用 `AES`（高级加密标准）算法和 128 位或 256 位密钥来为 Windows\
  \ 电脑安全地加密硬盘或卷。该工具由微软在最新发布的 Windows 版本中提供。\n\n#### 1.2 TrueCrypt\n\n`TrueCrypt` 被\
  \ CNET 编辑员 Seth Rosenblatt 描述为“终极免费软件加密程序”。它提供了许多不同的加密算法，可用于在文件或分区存储加密文件。`TrueCrypt`\
  \ 运行 Windows、Mac OS X 和 Linux 电脑上。它允许你实时加密文件，即在你打开或关闭文件时加密。与任何加密产品一样，如果你用强密码加密文件并忘记或丢失了它，你的文件将无法访问。\n\
  \n#### 1.3 PGP\n\n`PGP`（Pretty Good Privacy）自 20 世纪 90 年代初一直存在，一直是加密领域的领导者。它提供了加密整个硬盘驱动器的能力。`PGP`\
  \ 已移植到 Windows 2008、Windows 2003、XP、Vista 和 Mac OS X。它为服务器、笔记本电脑、桌面电脑和 USB 驱动器等可移动介质提供端点加密保护。`PGP`\
  \ 有相关的许可费用。\n\n## 屏幕\n\n很容易被忽视，但海量信息在你的电脑显示器或屏幕上流动。在很多情况下，你可能想要捕捉正在查看的屏幕内容。你看到的内容可能在你的电脑上、在服务器桌面上、在应用程序内部、在网页上，甚至是他人共享给你的电脑上。你需要对截取屏幕数据非常熟悉，以便无需思考就能快速完成。接下来的章节描述了捕获屏幕的方法。\n\
  \n### 屏幕截取工具\n\n你有时会想要精确捕获屏幕上看到的内容。最常见的需求可能是当你编写文档时。你可能在为用户编写操作手册，或者向供应商的支持小组发送错误详情。\n\
  \n#### PrtScrn\n\n对于这些或任何情况，你可以轻松捕获 Windows 电脑的屏幕。按下 `PrtScrn` 键将创建一个截图，即捕捉当时的屏幕图像。\n\
  \nWindows 嵌入的屏幕打印功能有一些变体。这些选项如下：\n\n- 按下 `PrtScrn` 键捕获显示器上的所有内容。如果你有多个显示器，捕获的图像将包含所有内容。这样做的一个缺点是，当捕获区域包含多个显示器时，细节往往难以分辨。\n\
  - 按下 `Alt` + `PrtScrn` 键将仅捕获活动窗口。当你编写文档只想包含特定窗口而不是整个显示器时，这非常有用。\n- 按下 `Ctr` + `PrtScrn`\
  \ 键在你有多个显示器时非常有用。如果你只有一个显示器，它的功能与 `PrtScrn` 键相同。但如果你有多个显示器，无论哪个窗口拥有焦点，它都会捕获主显示器的图像。\n\
  \n\n\n\n此工具预装在 Windows 7 和 Vista 电脑上，以及 Windows XP 平板版的体验包中。它不仅可以像 `PrtScrn` 那样捕获整个屏幕，还允许你拖动并仅捕获你所需的屏幕部分。你可以捕获特定的窗口、矩形或进行任意形状捕获。捕获的图像可以保存为多种文件格式，包括\
  \ PNG、GIF、JPG 和 MHT。\n\n你可以通过几种方式启动 `SnippingTool`（截图工具）：\n\n1. 点击 Windows 徽标或开始图标，点击`运行`，在“打开”文本框中输入\
  \ `SnippingTool`。\n2. 打开命令提示符窗口，输入 `SnippingTool` 并按 `Enter` 键。\n3. 点击 Windows 徽标或开始图标，点击`所有程序`，点击`附件`，然后点击\
  \ `SnippingTool` 条目。\n\n该工具的可执行文件位于 `C:\\Windows\\system32\\SnippingTool.exe`。如果你打算频繁使用此工具，可以轻松将其拖到桌面以创建快捷方式。\n\
  \n### 27.7.1.3 FastStone 截屏\n\n###Stone Capture 是一款轻量级的屏幕捕获实用，同时也具有屏幕视频录制器的功能。它在\
  \ Windows 启动期间启动，并在系统托区域有一个图标。激活后，会显示一个小型工具栏，提供屏幕截屏和启动屏幕录制的功能。捕获后，你的图像可以发送到文件、打印机、电子邮件、文字处理器或其他目标类型。它可以以多种文件格式保存图像，包括\
  \ BMP、GIF、JPEG、PCX、PNG、TIFF 和 PDF。此工具不是开源软件。\n\n### 27.7.2 捕获屏幕活动的工具\n\n能够截屏固然很棒，但有时录制屏幕活动视频会更好。视频录制在以下两种情况下极其有用：\n\
  \n* **培训**—— 有时，通过向用户提供一段显示如何操作某事的视频，比编写操作步骤要更快、更简单且更准确。\n* **错误报告**—— 有时，错误之前的动作非常冗长或复杂。如果用户可以打开视频录制工具，然后演示导致错误发生的步骤，将使你更容易准确地理解如何重现该错误。在向供应商支持团队提供错误详情时，你也可以使用此功能。\n\
  \n#### 27.7.2.1 FastStone capture\n\nFastStone Capture 在第 27.7.1 节介绍介绍。如所述，它还能录制屏幕活动。启动此工具后，点击图标激活屏幕录制器。在捕获屏幕活动的同时，可以使用电脑麦克风录制音频。这允许用户对自己的操作进行实时讲解。当活动完成后，关闭录制并将输出保存到文件中。包含录制会话的文件可以拖到屏幕录制器的面板上进行播放。视频编辑器允许你对视频添加注释。\n\
  \n#### 27.7.2.2 微软问题步骤录制\n\n问题步骤录制器（`psr`）并不完全是一个屏幕录制器。相反，它会创建一系列截图，用于显示到特定时间点为止的每一个步骤。录制完成后，输出会自动保存在一个压缩的\
  \ MHTML 文件中，该文件可以通过电子邮件发送给可能帮助解决问题的人。\n\n启动 `psr` 并录制活动的步骤如下：\n\n* 点击 Windows 徽标或开始图标，在文本框中输入\
  \ `psr` 并按 `Enter` 键。\n* 点击`开始录制`按钮。\n* 执行重现问题所需的步骤。\n* 点击`停止录制`按钮。\n* 系统会提示你输入文件名，输入一个有意义的名字并点击`保存`。\n\
  * 创建的文件将具有 `.zip` 文件扩展名。\n* 要查看录制内容，打开刚创建的 `.zip` 文件，然后双击 MHTML 文件。\n* 将打开浏览器会话，文档将在其中显示。\n\
  * 从上一个捕获的屏幕移动到下一个，只需在浏览器会话中向下滚动。\n\n显示的文件包含以下信息：\n\n* 一个标题区域，描述了“录制问题步骤”工具的功能概述。\n\
  * 每个被捕获的屏幕都包含以下信息：\n    * 递增的步骤编号。\n    * 捕获的时间戳。\n    * 用户到达该处所采取的动作，例如，“用户左键点击了开始（按钮）”。\n\
  \    * 动作完成后屏幕截图。\n* 最后一部分标题为“其他信息”，显示每个步骤的摘要，包括等细节：\n    * 步骤编号。\n    * 用户采取的动作。\n\
  \    * 涉及的程序名称，包括版本、制造商和可执行文件名。\n    * 涉及的 UI 元素，例如，按下的按钮名称、屏幕上的对话框。\n\n我必须承认这个工具非常精巧！对我来说，它似乎完美适用于它尝试解决的需求。提供的信息正是重现问题所需的全部内容。即使是最排斥技术的用户也应该能够使用此工具提供关于如何重现问题的极佳信息。而且，它还是免费的。还有什么要求更多的呢？\n\
  \n### 27.7.3 处理工具\n\n截屏足够容易，但有时你可能在之后对其进行修改。\n\n例如，为了将其放入文档中，你可能需要对其进行裁剪以适应。另一个例子是，截图可能包含你不希望公开的账号。如果你打算在任何形式的文档中使用它们，那么在捕获截图后能够修改图像是非常重要的一步。\n\
  \n接下来的章节描述了能够处理图像的工具。如既往一样，有些是免费的，另一些需要付费许可。\n\n#### 27.7.3.1 微软画画\n\n大多数电脑用户在大多数时间内使用一个特定的网络浏览器。如果你电脑上还没有第二个或第三个浏览器，我想提供一些说明为什么你应该准备一个备用的替代方案。\n\
  \n很容易因为微软画画（Microsoft Paint）是免费的、存在已久且预装在所有 Windows 电脑上，就将其视为一个微不足道的应用，但这样做是错误的。画画易于使用。它具有许多功能，包括在图像上添加文本、圆形、箭头等对象，以强调特定区域。它可以以以下格式保存图像文件：BMP、PNG、JPEG、GIF\
  \ 和 TIFF。画画永远不会让 Photoshop® 破产，但对于基础的图像处理，它提供的功能绰绰有余。噢，我提过它是免费的吗？\n\n#### 27.7.3.2\
  \ Paint.NET\n\nPaint.NET 是一个开源免费软件编辑器，允许你修改图像。它的某些功能甚至可以与价格昂贵的图像编辑软件包相媲美。它的一些功能的示例包括：\n\
  \n* 裁剪、旋转和调整图像大小。\n* 调整颜色。\n* 消除照片中的“红眼”。\n* 允许用户在图像中创建层。\n* 能够包含锐化、模糊、畸变和浮雕等特效。\n\
  * 以常见的图像相关格式（如 GIF、JPEG、PNG 和 TIFF）保存文件。\n\n## 27.8 浏览器\n\n大多数电脑用户都有一个在大多数时间内使用的特定网络浏览器。如果你电脑上还没有第二个或第三个浏览器，我想提供一些理由，说明你应该准备一个随时可用的替代方案。\n\
  \n\n\n\n\n- **速度**——在特定情况下，某些浏览器比其他浏览器要快。在我支持的一个应用程序中，某个屏幕需要 58 秒才能加载出来。我们当时抓狂了头发，试图找出为什么需要这么长时间。是数据库问题吗？还是网络瓶颈？结果证明，是浏览器的问题。使用另一个浏览器，加载同一个屏幕仅需\
  \ 2 秒。这些时间是连贯的。浏览器 A 总是花费不到一分钟的时间，而浏览器 B 总是少于 3 秒。\n- **错误**——我有很多时候尝试打开一个网页，但它就是打不开。最后，我会尝试用另一个浏览器打开，结果奇迹地——它成功了。这种情况似乎在有人给我发送包含在线会议邀请链接的邮件时总会发生。\n\
  \n我认为我不需要向任何熟悉电脑的人介绍以下浏览器了，我只需列出一些最常用的浏览器即可。即使你是其中某个浏览器的死忠粉丝，在你的工作站上加载另一个浏览器以备不时之需也无妨。\n\
  \n- **Google Chrome**\n- **Microsoft Internet Explorer**\n- **Mozilla Firefox**\n\
  - **Opera**\n- **Apple Safari**\n\n## 27.9 数据库访问工具\n\n如果你担任应用程序管理员（Application Administrator），你几乎经常需要连接到应用程序背后的数据库。在许多情况下，该数据库是一个关系型数据库。要连接它，你需要建立一个\
  \ `SQL` 会话，这意味着你需要某种客户端工具来操作。\n\n以下章节描述了可用的一些工具。可能最重要的考虑因素是你需要连接到什么种类的数据库。例如，如果你的商店只有\
  \ `Microsoft SQL Server` 数据库，那么 `Oracle` 工具对你来说就没太大用。\n\n### 27.9.1 Oracle SQL*Plus\n\
  \n如果安装了 `Oracle Client`，你的电脑上通常会有 `SQL*Plus`。你可以用它做几乎任何事情，但如果你不习惯使用命令行界面，那么这可能不是最适合你的工具。另一方面，你也可以考虑扩展自己的技能，投入精力精通它。整理一份关于使用该工具的技巧备查表只需要花费几分钟。\n\
  \n### 27.9.2 Oracle SQL Developer\n\n`Oracle SQL Developer` 是一个可以从 `Oracle` 网站免费下载的工具。这个\
  \ GUI 工具非常强大且易用。它提供了标准的工作表界面，你可以在其中输入 `SQL` 命令，另一个面板会显示命令的结果。你可以保存查询以备后用。`SQL Developer`\
  \ 还允许你管理数据库。由于 `SQL Developer` 仅适用于 `Oracle` 数据库，如果你的组织依赖其他数据库，你可能需要准备另一个 GUI 工具。\n\
  \n### 27.9.3 TOAD\n\nQuest Software 的 `TOAD` 能够连接多种类型的关系型数据库，包括 `Oracle`、`Microsoft\
  \ SQL Server`、`Sybase`、`IBM 的 DB2` 以及 `MySQL`。`TOAD` 与任何其他可用 GUI 访问工具一样直观。`TOAD`\
  \ 不是免费的，但可以下载试用版。\n\n### 27.9.4 SQL-Station\n\n来自 Computer Associates 的 `SQL-Station`\
  \ 也是支持多种关系数据库的 GUI 访问工具。它可以处理的部分列表包括 `Oracle`、`MySQL`、`SQL Server`、`DBA` 和 `Sybase`。`SQL-Station`\
  \ 不是开源或免费工具。\n\n## 27.10 项目管理工具\n\n作为应用程序管理员，你和你的应用程序将参与许多项目。可能影响你的项目包括：\n\n- 获取初始应用程序包\n\
  - 迁移到新的或不同的应用程序包\n- 存档应用程序\n- 由于合并或收购扩大或缩小应用程序涵盖的范围\n- 升级到应用程序的新版本\n- 迁移到新硬件，即新服务器\n\
  - 迁移到不同的数据中心\n- 添加新环境，例如 `DR` 站点\n\n这些项目中的某些复杂到足以证明编写项目计划的合理。你可能会被要求编写或参与编写项目计划。如果你能获取到它们，尝试查看你自己的应用程序或其他应用程序之前的项目计划。基于类似的任务来制定你的项目计划并没有任何问题。\n\
  \n用于制定项目计划的工具范围很广，从电子表格中的几行代码到完整项目管理工具中的数百页内容不等。我的建议是尽可能简单。如果你的“项目”包含的任务相对较少，可以很容易地在文本文件或电子表格中管理。另一方面，如果你的项目将涉及数十名贡献者的努力或数百个独立任务，那么你绝对需要一个专为跟踪项目而构建的工具。绝对让项目规划工具非常有值的复杂因素是：你的某些任务需要连续执行，而另一些任务可以同时完成。\n\
  \n你希望在项目计划中记录的一些主要数据类别包括：\n\n- 任务名称\n- 开始日期/时间\n- 任务持续时间（周、天、小时或分钟）\n- 结束日期/时间\n\
  - 前置任务或多个任务\n- 应用到任务的资源\n- 完成百分比\n\n一些可用工具允许你定义此类的高级详细信息。这些设置被纳入到确定任务结束日期的计算中。\n\
  \n- 工作周的定义，例如周一至周五\n- 工作日的小时数\n- 公司认可的假期\n- 每个成员投入项目的时间百分比\n\n实际上有数以百计的项目管理工具可供你选择。有些是通用的，而另一些是特定行业的。你的组织或小组很可能已经选择了你将使用的工具。如果工具的决定还没有替你做出来，那么请准备进行大量的调研。许多工具是免费或开源的，但另一些非常昂贵。当然，价格昂贵的工具往往包含更多功能。\n\
  \n项目管理工具的一些示例是：\n\n- `Microsoft Project`\n- `Clarizen`\n- `Genius Project`\n- `Daptive\
  \ PPM`\n- `Tenrox`\n- `PROJECT Insight`\n- `Redmine`\n- `Trac`\n- `Zoho Projects`\n\
  \n\n\n\n\n# 5. 记录问题和解决方案以备将来参考\n\n## 28.2 识别问题\n\n在识别问题之前，你将不知道它的影响范围有多大、重要性如何，以及如何处理它。识别问题的一种方法是隔离其发生的位置。例如：\n\
  \n* 问题是否是用户在其工作站或笔记本电脑上遇到的错误？\n* 问题是否发生在应用程序服务器上？\n* 问题是否发生在另一个子系统中，例如数据库、网络、Active\
  \ Directory 或存储区域网络（SAN）？\n\n一旦确定了问题发生的位置，就需要采取或提问某些特定的步骤和问题。这些操作的示例列在后续章节中。\n\n\
  ## 28.3 收集有关问题的信息\n\n在尽可能了解该问题之前，甚至不要考虑去“解决”它。如果你在收集到充分信息之前就尝试解决问题，你很可能会发现自己解决了错误的问题。\n\
  \n### 28.3.1 向报告问题的用户提问\n\n如果用户报告其工作站上发生了问题，那么你需要从他们那里获取关于问题的信息。并不是所有用户都同样善于言辞。并不是所有用户的计算机素养都一样。并不是所有用户都同样敏锐。为了弥补用户之间的差异，在这种情况下采取主动将大大提高效率。不要简单地听取他们对情况的描述，你应该针对此提出针对性的问题。\n\
  \n你可以给他们打电话询问这些问题，给他们发送带有检查清单的电子邮件，或者引导他们访问一个可以记录其答案的网站。使用最适合你和你的组织的方法。无论你或你的组织采取哪种方法，你都需要获得基础问题的答案。这些答案将帮助你识别问题的潜在原因。\n\
  \n你应该定期审查你的标准问题列表，并对其进行改进。如果你发现自己经常在想“天哪，我真希望我问了用户关于 x、y 或 z 的”，那么你就需要将这些问题添加到列表中。同样，如果你问的问题对你解决问题的完全没有帮助，那么就可以它们从列表中删除。通常情况下，你问的问题越少，处理速度就越快，获得的用户的配合也越多。\n\
  \n以下问题可以作为你向用户提问的第一轮筛选。不要害怕修改此列表以反映你的实际情况。例如，如果你所有的用户都在同一栋楼里，那么询问他们所在的哪个城市或国家就是浪费大家的时间。如果你的用户只能访问应用程序的生产版本，那么询问错误发生在什么环境就是没有必要的。\n\
  \n* 报告问题的人员姓名。\n* 问题发生的日期和时间。\n* 此问题是否影响了生产环境？\n* 报告问题人员所在地（房间、楼层、建筑、城市、国家）。\n*\
  \ 用户是在网络上还是在远程工作？如果是远程工作，他们是否通过 `VPN` 软件连接到组织网络？\n* 错误的描述，包括列出的任何错误代码。\n* 如果可能，捕捉错误屏幕的截图。注意——你应该有一份现成的文档，显示用户如何截屏并粘贴到电子邮件或文档中。\n\
  * 导致问题发生的步骤是什么？注意——`Microsoft Problem Steps Recorder`（微软问题步骤记录器）是捕捉问题发生前步骤的优秀工具。你应该准备好一份说明如何使用它的文档并发送给你的用户。\n\
  * 此问题以前出现过吗？\n* 如果有，它发生在什么时候以及频率是多少？例如，每小时、每天、每周、每月？\n* 其他用户也遇到了这个问题吗？注意——如果该用户处于相对孤立的状态（即该办公室或城市唯一使用此应用程序的人），那么你可能需要联系其他用户来获取这些信息。明智之是列出一份位于不同办公室、城市、国家、时区的用户列表，以便就此问题询问他们。\n\
  * 每次执行这些步骤时问题都会出现吗？\n* 问题可以容易复现吗？\n* 用户电脑的名称是什么？用户可以通过 `Start | Run`，输入 `sysdm.cpl`\
  \ 并按 `Enter` 键获取此信息。\n* 使用的是什么版本的操作系统？用户可以通过打开 `Windows Explorer`，右键点击“Computer”并选择“Properties”获取此细节。\n\
  * 使用的是什么内核浏览器和版本？用户可以在大多数浏览器中通过 `Help | About` 或类似的选项获取这些信息。\n* 你的机器在哪个网络域？用户可以通过打开\
  \ `Windows Explorer`，右键点击“Computer”并选择“Properties”获取此细节。\n* 使用的是什么版本的应用程序？收集此信息对于每个应用程序都不同。是否有\
  \ `Help | About` 菜单项？是否有可以点击以显示此信息的图标？作为应用程序管理员，你需要向用户提供如何找到这些指导。\n\n### 28.3.2\
  \ 眼见为实\n\n我的意思并不是要表现得不友好或不信任用户的报告，但我强烈建议你在亲眼看到问题之前，不要相信问题存在。很多时候，问题归结为用户方面的误解或错误。但在你亲眼看到他们正在做什么之前，你并不知道这一点。\n\
  \n你可以采取几个步骤来获取确切情况的证明。最快最简单的方法是让他们给你发送错误截图。很多时候，这足以确认问题是真实的。\n\n如果这不能说服你，那么请让他们运行\
  \ `Microsoft Problem Steps Recorder`。这个工具非常易用，可以捕捉一系列截图以及所有的用户操作。可以通过点击 `Start |\
  \ Run` 并输入 `psr` 然后按 `Enter` 键启动。点击 `PSR` 中的 `Start Record` 按钮后，用户执行遇到问题时相同的步骤。遇到错误时，他们点击\
  \ `Stop Record`，命名文件并通过电子邮件发送给你。使用这些信息，你应该能够自己复现错误。\n\n最后也是最有说力的方法是通过允许你远程查看并在必要时控制用户桌面的工具。如果你的组织拥有\
  \ `Citrix WebEx`、`Microsoft Live Meeting` 或 `Communicator` 的许可，请使用它们。否则，还有许多提供相同功能的免费工具。请参见第\
  \ 27 章获取对此类工具的完整描述。一旦你监控了他们的桌面，让他们执行之前导致问题发生的步骤。如果你能看到哪里错了，要么告诉他们正确的步骤，要么接管并演示给他们看。\n\
  \n### 28.3.3 但昨天还好好的！\n\n我可以绝对保证，在你担任应用程序管理员的职位上，你会听到有人声称“但昨天还好好的！”。你会听到这句话一遍又一遍。在很多、很多情况下，这个声称实际上是真的。我知道我也不止一次过过这种主张。\n\
  \n如果应用程序停止工作而你确定最近没有对其进行任何更改，那么有些事情是值得检查的。下面列出的项目只是导致昨天运行良好的应用程序今天无法运行的快速列表。当你遇到本节列出的其他问题时，你需要更新自己的检查点列表。\n\
  \n\n\n\n\n-   应用程序许可是否过期？我在实施应用程序的过程中遇到过这种情况。只需给供应商打个电话，然后联系我们的应付账款部门，就解决了。如果这发生在生产平台上，将会是一个大得多的问题。\n\
  -   防火墙更改——联系安全团队或防火墙团队，查看最近该区域是否发生了任何更改。\n-   操作系统补丁——最近是否对操作系统应用了补丁？\n-   数据库问题——数据库服务器空间是否已？数据库引擎是否正在运行？数据库监听器是否正在运行？是否有数据库账户已过期？\n\
  -   DNS 名称无法识别——DNS 服务器是否损坏？\n-   病毒和恶意软件——你的服务器上是否运行了防病毒软件？其所使用的签名文件最近是否更新过？其许可是否过期？\n\
  \n## 28.3.4 出现在服务器上的问题\n\n如果问题发生在应用程序服务器上而不是用户的工作站上，那么关于问题原因的所有细节都应该可以在服务器上找到。接下来的章节描述了应该检查的潜在来源。\n\
  \n### 28.3.4.1 来自应用程序的电子邮件告警\n\n应用程序可能会发送电子邮件，通知应用程序管理员发生了问题。并不是所有应用程序都通过这种方式广播问题信息，但你支持的应用程序可能会使用电子邮件来处理。请查阅管理员指南获取有关此点的详细信息。\n\
  \n如果你能通过电子邮件接收应用程序的告警，那么你就必须为应用程序提供配置细节。例如，你组织的电子邮件服务器名称以及告警应该发送到的电子邮件地址。如果可能，请输入组分发列表而不是单个电子邮件地址。这可以提供更大的灵活性，允许你或任何人在无需访问应用程序服务器的情况下更改收件人列表。\n\
  \n### 28.3.4.2 显示在应用程序服务器上的错误消息\n\n错误消息可能会显示在应用程序服务器的显示器上，但通常情况下不会这样。企业级应用程序的开发者理解管理员不会一直登录服务器，因此弹出消息框通常不会显示在服务器的桌面上。\n\
  \n### 28.3.4.3 应用程序日志文件\n\n应用程序创建的日志文件记录应用程序问题最常用的方法。遗憾的是，应用程序往往会创建并写入多个日志文件。这些文件可能分布在应用程序服务器的磁盘驱动器上。例如，如果应用程序有多个服务，那么每个服务都可能将其目写入单独的文件。某些应用程序拥有专门用于启动过程的日志文件。作为应用程序管理员，你需要了解有关其日志文件的以下信息：\n\
  \n-   每个日志文件的名称和位置\n-   何时被写入，例如在启动过程中或在中的活动期间\n-   当前日志文件是否以及何时被归档并创建新文件\n-   写入每个日志文件的条目的含义\n\
  -   如果开启了工单（ticket），供应商支持组将想要哪些日志文件\n\n你应该定期检查应用程序日志文件，寻找错误或警告消息。作为日常维护活动的一部分执行此操作，可能会让你在小问题演变成大问题之前发现它们。此类检查可以手动进行，你也可以设置一个工具来自动执行。\n\
  \n### 28.3.4.4 事件查看器\n\n在基于 Windows 的应用程序服务器上向 `Event Viewer` 写入条目是许多应用程序记录其错误状况的方法。你应用程序的管理员指南或等效文档将告诉你这是否是应用程序写入其日志条目的的地方。\n\
  \n要打开 `Event Viewer`，选择 `Start` 图标，然后选择 `Administration Tools | Event Viewer`。一旦打开了\
  \ `Event Viewer`，你就必须选择写入条目的特定区域或文件夹。主要文件夹有 `Application`、`Security` 和 `System`。应用程序可能创建了额外的文件夹。我支持过的一家供应商创建了一个名为“IC\
  \ Software”的额外文件夹，将其所有的日志条目写入该文件夹。\n\n一旦找到正确的文件夹，你需要滚动查看按时间顺序排列条目，寻找与你正在调查的事件相关的条目。为了减少必须检查的条目数量，`Event\
  \ Viewer` 允许你创建一个过滤器。如果你要在 `Event Viewer` 中进行大量搜索，那么花时间学习使用过滤器可能是一项明智的投资。\n\n###\
  \ 28.3.4.5 Web 服务器日志\n\n如果你的应用程序使用网站作为与用户交互的方法，那么问题可能已经记录在由 Web 服务器软件维护的日志文件中。例如，如果使用的\
  \ Web 服务器软件是 `IIS`（微软的 Internet 信息服务），那么错误状况可能会记录在 `IIS` 日志文件中。\n\n通过以下步骤可以找到 `IIS`\
  \ 放置文件的位置：\n\n-   打开 `IIS`\n-   展开 `Web Sites` 文件夹\n-   右键点击应用程序的网站并选择 `Properties`\n\
  -   选择 `Web Site` 选项卡\n-   点击日志（logging）部分中的 `Properties` 按钮\n-   日志文件的位置将显示在 `Log\
  \ file directory` 字段中。一个可能的位置是 `C:\\Windows\\system32\\LogFiles`。在此目录中，网站运行的每个日期都会有一个日志文件。这些文件的命名规范为\
  \ `ex000000.log`，其中 `000000` 是递增序列值。\n\n这些文件的内容记录了网站上的活动，包括错误。必须承认，读取 `IIS` 日志文件并不容易。如果该网站是一个繁忙的网站，那么每天的日志文件中会有很多条目。显然，除非你有充分充分，否则你不想阅读它们。这样的理由可能是所有其他信息源都已耗尽，或者供应商的支持团队要求你搜索\
  \ Web 服务器的日志文件。\n\n### 28.3.4.6 日志级别\n\n某些应用程序允许你配置记录多少内容的日志。例如，它们可能提供了与下面描述类似的日志级别。当然，你的供应商可能对这些级别有不同的名称，或者他们可能将其中两个或多个级别合并为一个。\n\
  \n-   `Error`——只记录极其严重的错误。一个经验法是，进入这里的错误类型只能是严重到足以在凌晨 2 点打电话某人来处理的。\n-   `Warning`——项目足够重要可以被跟踪，但不需要立即关注。\n\
  -   `Debug`——记录非平凡代码区域的进入和退出，特别是异常发生但并不一定是错误的情况事件。\n-   `Info`——记录比 `debug` 设置更多的信息，但并没有捕获所有内容。\n\
  -   `Trace`——记录所有内容！显然，这种级别将在极罕的情况下使用，可能是在开发团队尝试跟踪系统所做的一切期间。\n\n更改日志设置在我支持的每个应用程序中似乎都不同。查阅管理员指南以了解是否存在此类可配置性以及如何修改。某些处理方式的示例包括：\n\
  \n-   编辑配置文件或属性文件\n-   需要对注册表设置进行更改\n-   在应用程序 UI（用户界面）中进行\n-   在仅供应用程序管理员使用的“配置”工具中进行[/\n\
  \n\n\n更改日志级别时请务必小心！如果让系统记录过多的信息，很容易耗尽你服务器的 I/O 带宽，或消耗惊人的磁盘空间。一个非常好的规则是在短时间内提高日志级别，然后在检查刚刚创建的日志文件时将其改回正常。一旦安全，你就应该删除任何不再需要的大型日志文件。这样做可以帮助防止应用程序因可用磁盘空间不足而崩溃的情况。\n\
  \n## 28.3.5 转储文件 (Dump files)\n\n“转储文件”一术是指包含计算机在特定时间点（即创建转储文件时）的内存快照的文件。通常，转储文件会在应用程序或操作系统崩溃时创建。转储文件可以为分析人员提供有关崩溃发生时系统状态的详尽信息。凭借经验、坚持和一点运气，分析人员可以准确找到崩溃的原因。\n\
  \n### 28.3.5.1 转储术语\n\n对于外行人士来说，与转储文件相关的术语可能令他们望而生畏。这里提供了某些术语的定义，以便让你对讨论的内容有一个概括了解。\n\
  \n- 二进制文件或可执行文件（Binaries or executables）——指的是包含程序、应用程序甚至操作系统的二进制代码或可执行代码的文件。\n-\
  \ 堆（Heap）——堆是一个较大的内存区域，从该区域向任何请求内存的进程分配内存块。当进程完成对该内存块的使用时，它会被返回，以便将来分配给另一个进程。如果进程没有正确返回分配给它的堆内存，则被称为“内存泄漏”。在创建转储时，可以包含也可以不包含堆内存区域。\n\
  - 全量转储或完整转储（Full or complete dump）——包含计算机拥有的所有 RAM（内存）的转储。在现代服务器中，这可能是几十或几百 GB 的内存。这个版本的转储要完整得多，但由于其体积巨大，处理起来也更加困难。\n\
  - 内核转储（Kernel dump）——仅限于操作系统内核所占用的 RAM（内存）的转储。内核是操作系统代码的核心或本质部分。内核转储比全量转储小得多。\n\
  - 最小转储或小内存转储（Minidump or small memory dump）——是一种较小的转储，它不包含崩溃时恰好位于内存中的二进制或可执行文件，但它包含了导致崩溃发生的线程或进程的堆栈。\n\
  - 堆栈（Stack）——堆栈是一个为特定进程或线程保留的较小内存区域。进程在调用函数时使用此临时内存来保存寄存器和返回地址。\n- 符号信息或符号文件（Symbol\
  \ information or symbol files）——在创建可执行文件（`.exe`）或库文件（`.dll`）时由链接器创建。符号文件中的信息包括全局和局部变量、函数名及其地址位置以及源代码行号。执行文件运行不需要这些信息，但对于调试程序或分析转储文件非常有帮助。\n\
  \n### 28.3.5.2 分析转储文件的工具\n\n有很多工具可以帮助分析转储文件。可以使用的工具示例包括：\n\n- Microsoft 的 Windows\
  \ 调试工具（Debugging Tools for Windows）是调试器及相关工具的集合。最新版本已集成到 `Visual Studio` 开发环境中。这套工具是\
  \ `Windows SDK` 的一部分。\n- `DebugView` 是 Microsoft `Windows Sysinternals` 实用程序包的一部分。它允许你监控调试输出。该工具免费提供。\n\
  - `BlueScreenView` 显示一份关于 Windows 计算机出现 `BSOD`（蓝屏）崩溃信息的报告。它专门列出了可能导致崩溃的驱动程序或模块。该工具免费，但创建者接受捐赠。\n\
  - `WhoCrashed` 是一款免费软件，可以检查 Windows 最小转储文件，并帮助隔离哪些新驱动程序或损坏的现有驱动程序可能导致了问题。\n\n这些工具从转储文件中提取并显示的一些细节包括：\n\
  \n- 最近崩溃的列表\n- 崩溃后创建的转储文件的名称和位置\n- 崩溃时运行的进程列表\n- 崩溃时加载的驱动程序列表\n- 重现系统崩溃时显示的屏幕\n\
  - 建议它认为最可能的崩溃原因的进程或驱动程序\n- 崩溃时运行的进程或线程的调用堆栈\n\n### 28.3.5.3 谁最适合分析转储？\n\n最适合分析转储的人可能是经验最丰富的人。在你的情况下，那可能是：\n\
  \n- 你，应用程序管理员\n- 内部系统管理员\n- 供应商帮助热线的人员\n\n我这里的建议是：“不要尝试当英雄”。如果你没有阅读由崩溃创建的转储文件的经验，请委婉地交给比你更有专业知识的人。如果你想培养这种专业知识，那太好了，但不要假设仅仅因为你热情且愿意学习你就是最合适的。也许你最好的做法是尝试自己分析转储，然后把你对原因的评估与系统管理员或供应商支持人员的结论进行比较。\n\
  \n## 28.4 测试可能的解决方案\n\n在我看来，80/20 法则绝对适用于应用程序问题。这意味着 80% 的问题是由 20% 的潜在原因造成的。如果你检查那些常见的“嫌疑对象”（即原因），那么很有可能就会找到问题的根源。以下章节描述了我总是首先检查的内容。\n\
  \n### 28.4.1 要求用户执行以下步骤\n\n我无法保证这一点，但大多数情况下，如果你要求用户执行以下步骤，问题就会得到解决。运气好的，你甚至可以训练用户在给你打电话或就该问题提交工单之前就执行这些操作。这将为大家节省大量的时间麻烦。\n\
  \n#### 28.4.1.1 退出应用程序\n\n让用户退出应用程序然后重新登录。这很有可能解决该问题。\n\n#### 28.4.1.2 关闭所有其他应用程序\n\
  \n让用户关闭任何其他打开的程序百无无处。它可能没有帮助，但肯定没有坏处，而且操作足够简单。\n\n#### 28.4.1.3 清除他们的浏览器缓存\n\n每当在浏览器中打开网站时，信息就会写入浏览器的缓存区域。最终，缓存可能会充斥成千上万的文件。让用户清除浏览器缓存，然后重新登录应用程序查看问题是否解决。\n\
  \n清除缓存对于每个浏览器都略有不同，但并不困难。Internet Explorer 的步骤是：\n\n- 点击工具并选择删除浏览记录……\n- 取消勾选保留收藏的网站数据，并勾选临时\
  \ Internet 文件、Cookie 和历史\n- 点击删除\n\n如果使用的是 Mozilla Firefox，步骤为：\n\n- 点击工具 | 清除最近历史\n\
  - 在时间范围中选择“所有”\n- 点击“立即清除”按钮\n\n#### 28.4.1.4 使用 VPN 连接网络\n\n如果报告问题的用户是在远程工作，请验证他们是否已通过\
  \ VPN 软件连接到组织网络。如果他们没有这样连接，请要求他们这样做并再次尝试使用应用程序。这为我支持的应用程序的用户解决了许多登录问题。\n\n#### 28.4.1.5\
  \ 尝试另一个 浏览器\n\n\n\n\n这不是一个显而易见的解决方案，但我遇到过许多情况：在某个 Internet 浏览器上出现的问题，当用另一种浏览器启动应用程序时却没有出现。两个浏览器的行为竟然如此不同，这似乎并不符合直觉，但我亲眼目睹过。这绝对值得尝试，因为这几乎不费吹之力，而且没有任何风险。\n\
  \n如果这解决了问题，那么你就解决了一个问题，但可能又引发了另一个。你现在知道原始问题是浏览器的 Bug，而不是应用程序的问题。你还知道一种通宜方法是使用第二个浏览器。如果你的大多数用户都没有加载该浏览器，那么他们可能都必须加载它。如果你的典型用户在工作站上没有管理员权限，那么就必须由其他人为他们每一个人加载新浏览器。\n\
  \n### 28.4.1.6 重启他们的电脑\n\n让用户重启电脑并查看问题是否仍然存在百无害处。这只需要几分钟时间，而且通常能解决问题。\n\n### 28.4.1.7\
  \ 用户会话异常终止\n\n某些应用程序对用户退出的方式非常非常挑剔。我支持的一个应用程序要求用户点击“注销”链接退出。如果他们恰好点击了窗口右上角的“X”，就会发生糟糕的事情。通过这样做，用户在应用程序的记录中留下了一个开启的条目，显示会话仍然激活。在该条记录被删除之前，用户无法重新登录该应用程序。\n\
  \n如果你支持的应用程序有此类倾向，那么你就需要了解这一点，并有一套处理计划。一些方案包括：\n\n- 培训、提醒并督促用户注意应用程序的这一特殊之处。确保他们明白，如果疏忽并错误地终止应用程序，将的是他们自己。\n\
  - 应用程序最终会自动清除这些“孤立”会话吗？如果是的话，确保用户知道在重新登录之前需要等待多久。\n- 编写一个脚本，能够快速、方便且准确地清除孤立记录。\n\
  - 确保你的备份人员了解该应用程序的倾向以及如何处理它。如果你写了脚本，请确保他/她知道如何使用它。\n- 查看是否可以定期执行该脚本以清理潜在的孤立会话。你必须完全确保执行它不会损坏合法的会话记录。\n\
  \n### 28.4.1.8 大小写敏感\n\n在某些情况下，输入文本的大小（即大写与小写）是至关重要的。输入大小写错误的值会导致问题。需要告知用户此类情况，并警告他们使用错误大小写导致的后果。大小写敏感可能导致问题的示例包括：\n\
  \n- 账户 ID\n- 密码\n- 许可证密钥\n- 文件名，尤其是在 UNIX 或 Linux 系统上\n- 目录名，尤其是在 UNIX 或 Linux 系统上\n\
  \n### 28.4.1.9 特殊字符\n\n某些字符对计算机软件具有特殊含义。如果这些字符用在意想不到的地方或使用不当，就可能导致问题。导致这些问题难以排查的原因是，它们发生非常罕见，且症状难以识别。某些导致问题的特殊字符包括：\n\
  \n- 使用反引号（`` ` ``）代替普通的单撇号或引号（‘）\n- 波浪号 (`~`）\n- 管道符 (`|`）\n- 单引号（‘），如果未对输入字符串进行此类潜在问题的扫描，它可能导致\
  \ SQL 语句失败。\n\n### 28.4.1.10 换行符\n\nWindows 和 UNIX 操作系统处理行尾的方式从根本上说是不同的。Windows\
  \ 使用回车符（`CR`）和换行符（`LF`）共同表示行尾情况。UNIX 只使用换行符（`LF`）。如果你在不考虑这一点的情况下将文件从一种系统移动到另一种系统，你可能会面临一个不悦的惊喜。\n\
  \n### 28.4.2 重启应用程序（Bouncing）\n\n有时你可能想要停止并重启应用程序，看看这是否解决正在发生的问题。这通常被称为“重启应用程序”（bouncing\
  \ the application）。由于即使只是短暂关闭应用程序也会影响用户，你不想在没有预先考虑的情况下这样做。\n\n每个组织都不同，但在重启应用程序之前你可能想采取的步骤包括：\n\
  \n- 谁有权做出此决定？应用程序的业务所有者？最高级的用户？应用程序管理员？\n- 如果应用程序有一个通常会停止的维护窗口，是否可以在该时间段内完成停止/重启？\n\
  - 你是否应该提醒用户应用程序即将关闭？你如何通知他们？\n- 如果你无法联系所有用户，仍然可以停止/启动吗？\n- 如果应用程序或其进程被监控，那么在停机期间禁用监控进程是一个好主意。如果不禁用监控，就会发出提示应用程序已下线的报警。这可能会引起恐慌、混乱和一般的骚乱。\n\
  - 应用程序的重启是否应该记录或存档？如果是，记录在哪里？有物理笔记本吗？公共驱动器上的日志文件？门户上的电子表格？\n- 此次停机会影响应用程序的运行时间统计吗？如果你需要满足某些可用性统计，可能考虑将重启推迟到维护窗口，这样运行时间就不会受到影响。\n\
  \n### 28.4.2.1 重启可以解决什么\n\n重启应用程序可能会解决几种情况。最显著的是如果应用程序存在内存泄漏。理想情况下，当计算机程序需要内存执行某些功能时，它会向操作系统请求一块内存。当程序完成内存使用后，它会释放内存，即将其归还操作系统，以便未来某个时间供另一个应用程序使用。如果由于编码或逻辑错误，程序在完成后没有释放内存，这就被称为内存泄漏。这是坏的，因为随着时间的推移，应用程序将请求越来越多的内存且从不归还。最终服务器可能会耗尽可用内存。当发生时，服务器将崩溃、挂起或开始表现异常。\n\
  \n如果你的应用程序有内存泄漏，停止它会将所有积累的内存释放回操作系统，使其再次可用。作为应用程序管理员，你无法修复应用程序的内存泄漏问题。你唯一能做的就是在可用内存不足成为问题时重启应用程序。你还可以将此问题报告给供应商，并希望他们的人员在未来的版本中修复它。\n\
  \n你可以使用 Windows 服务器上的性能监视器或任务管理器等工具来跟踪应用程序占用的内存量。UNIX 服务器上的 `TOP` 命令将显示每个应用程序正在使用多少内存。如果很明显应用程序继续积累越来越多的内存且从不释放，那么你就可以非常有信它存在内存泄漏问题。\n\
  \n### 28.4.3 重启服务器\n\n正如停止和启动应用程序可以解决某些问题，启动和停止服务器也可以解决问题。如果我不承认某些操作系统不需要定期停止和启动，将是不准确的。Linux\
  \ 和 UNIX 服务器似乎可以运行几个月或几年而无需重启。\n\n重启服务器的一些潜在负端是：\n\n\n\n\n\n- 花的时间可能比重启（bouncing）应用程序还要长\n\
  - 如果同一服务器上运行着其他应用程序，它们也会受到影响\n- 停机统计数据可能会受到影响\n\n每个组织的情况都不同，但在重启服务器之前，你可能想要采取以下步骤：\n\
  \n- 谁有权做出此决定？应用程序的业务所有者？最高级的用户？应用程序管理员？\n- 你是否应该提醒用户服务器和应用程序即将关闭？你如何通知他们？\n- 如果应用程序有维护窗口，是否可以在该时间段内完成停止/重启？\n\
  - 在停止服务器之前，应用程序是否需要优雅地关闭？\n- 在服务器恢复后，应用程序是会自动启动，还是需要手动干预？\n- 是否需要有人验证应用程序在服务器重启后是否正常启动？\n\
  - 是否需要在一切恢复并完全功能运行之前，将用户排除在应用程序之外？如果需要，如何实现？\n- 如果服务器、应用程序或其进程正在被监控，那么在停机期间禁用监控是一个好主意。如果你不禁用，可能会导致许多人恐慌并疑惑发生了什么。\n\
  - 重启的服务器是否应该记录或归档？如果是，记录在哪里？有笔记本吗？公共驱动器上的日志文件吗？门户网站上的表格吗？\n- 此次停机会影响应用程序的运行时间统计吗？如果你需要满足某些可用性统计，可能考虑将重启延迟到维护窗口，这样运行时间就不会受到影响。\n\
  \n## 28.4.4 电子邮件问题\n\n如果你的应用程序能够生成电子邮件，最终可能会出现与电子邮件相关的问题。如果用户没有收到他们预期的电子邮件，我做的第一件事是建议他们查看“垃圾邮件”文件夹。如果涉及的邮件是新的、应用程序已迁移到新服务器，或者电子邮件服务器发生了更改，这个提示就尤为真实。这曾多次成为我所谓的“遗漏”邮件的根源。\n\
  \n要排查电子邮件问题，你应该检查以下内容：\n\n- 应用程序的配置文件中是否正确了电子邮件服务器？\n- 电子邮件服务器是否已正常运行？\n- 到电子邮件服务器的网络连通性是否可用？\n\
  - 应用程序服务器与电子邮件服务器之间的端口是否开放？\n- 电子邮件服务器是否设置为接受来自应用程序的邮件并发送到外部地址？\n- 应用程序生成的电子邮件是否包含被禁止的文件类型？例如，某些电子邮件服务器不允许在传入的邮件中附加“exe”、“zip”或“bat”文件。\n\
  - 应用程序生成的电子邮件是否附加了过大无法处理的文件？某些电子邮件服务器对附件有 5 MB 的上限。\n\n如果以上方法都不能解决问题，你可能需要联系你的电子邮件小组，要求他们检查电子邮件日志文件，查看具体向其发送了什么。在联系他们之前，确保你已知邮件源自哪个服务器，以及特定邮件应该创建的日期和时间。这将有助于消息团队在电子邮件服务器上搜索日志。\n\
  \n## 28.4.5 DLL 地狱\n\n在“过去那些糟糕的日子里”，用户经常会遇到一种被称为“DLL 地狱”的情况。当 16 位 Windows 操作系统流行时，多个应用程序依赖\
  \ DLL（动态链接库）是非常普遍的。DLL 包含了程序例（本质上是子程序），应用程序调用这些程序例，而不是在内部重复代码。从概念上讲，这是一个极佳的主主意，但在实践中，当一个应用程序升级了其他应用程序也在使用的\
  \ DLL 时，就会出现问题。偶尔，新版本的 DLL 更改方式使得它对于更新它的应用程序可以正常工作，但对其他应用程序却无效。这些问题特别难以诊断，因为 DLL\
  \ 是否被更改可能并不显而易见。一旦确定了根源，选择就非常惨淡。它有时归结为：应用程序 #1 正常工作而 #2 坏了，或者 #2 正常工作而 #1 坏了。\n\n\
  幸运的是，DLL 地狱不再像以前那样是一个严重的问题。有几个原因使得这个老问题不再是曾经那样的威胁。首要原因是通过使用 32 位操作系统，每个应用程序都运行在独立的内存空间中。这允许每个应用程序使用它自己的\
  \ DLL 等库文件版本。\n\n### 28.4.5.1 注册 DLL\n\n作为应用程序管理员，你可能偶尔需要安装并注册 DLL 或 OCX。注册 DLL\
  \ 会在注册表中创建相应的引用。从那时起，对该 DLL 的调用就可以成功了。注册 DLL 或 OCX 的步骤是：\n\n- 打开命令行窗口\n- `CD C:\\\
  windows\\system32`\n- 输入 `Regsvr32.dll name`，其中 name 是要注册的 DLL 名称，例如 `librfc32.dll`\n\
  \n## 28.5 寻求专业协助\n\n总会有一些问题比其他问题更难解决。一旦你尝试了解决问题的简单方法并发现它们无效，你就必须深入挖掘来处理更棘手的问题。每个应用程序和环境都是不同的，但以下提示应该帮助你解决更困难的问题。\n\
  \n### 28.5.1 请求厂商支持\n\n如果你无法通过应用经过验证的修复来解决问题，那么你可能需要请专家。老实地说，修复应用程序不是你的工作。从技术上讲，你的工作是确保组织的应用程序实例正在运行。这并不是一回事。\n\
  \n由于以下原因，你修复应用程序故障的能力受到严重限制：\n\n- 你没有应用程序的源代码\n- 你可能不熟悉编写应用程序的语言\n- 你没有参加过应用程序的设计会议\n\
  - 你可能没有数据库结构的文档\n- 你几乎没有时间去学习以上所有内容\n\n我的观点是，依靠厂商支持小组的专业知识来寻求帮助并没有错。毕竟，他们编写了这些东西，而你付钱让他们提供支持和维护。当它无法工作时，他们理应能够修复。你的责任限于：\n\
  \n- 向厂商的支持服务台提交工单\n- 提供你所所知的所有关于问题的详细信息\n- 与支持小组协作，根据他们的要求提供额外信息或测试特定的解决方案\n- 向业务所有者和你的老板汇报进度\n\
  \n### 28.5.2 其他系统的问题\n\n有时，应用程序出现的问题是由完全在你控制范围之外的事引起的。例如，问题的根源可能在另一个子系统中。如果应用程序创建的错误日志中包含指示数据库引擎未响应请求的消息，那么你就不需要花更多时间查看应用程序了。你需要联系可以排查数据库系统的人。\n\
  \n\n\n\n\n后续章节提供了一个可能导致问题的子系统潜在列表。根据你组织 IT 部门的规模和布局，此处列出的所有团队可能并不存在。它们可能有其他名称，或者多个团队已经合并在一起起。如果你发现你的环境中适用其他子系统，请务必将它们记录下来，以便在下次发生此类问题时可以再次检查它们。\n\
  \n你需要了解负责其他系统的具体个人，而不仅仅是负责这些系统的团队名称。当你尝试让你的应用程序恢复运行时，你没有时间去研究 IT 部门中到底是谁。你需要一份包含姓名、电子邮件和电话号码的列表，以便需要时立即拨打。\n\
  \n请确保拥有一份独立于计算机的姓名和电话号码备份。这可能意味着一份纸质副本，或者将它们都保存在手机中。某些时候你可能需要打电话给某人，但你的电脑不在身边或者无法工作。例如，当你正在度假且没有带笔记本电脑时。\n\
  \n## 28.5.2.1 数据库团队\n\n正如多次提到的，大多数企业级应用都依赖数据库服务器来存储数据。判断你的问题是否由数据库系统引起并不困难。你可以执行以下一些快速检查：\n\
  \n* 当你或用户尝试登录时，错误信息中是否包含对数据库引擎错误的引用，例如 `ORA-00000`？\n* 应用日志条目是否包含对数据库引擎错误的引用？\n\
  * 你是否可以成功 `ping` 数据库服务器？\n* 你是否可以 `telnet` 到数据库服务器并指定服务器之间应该开启的端口？一些常用数据库引擎的默认端口为：\n\
  \    * Oracle—1521\n    * Microsoft SQL Server—1433\n    * MySQL—3306\n* 你是否可以使用\
  \ `SQL*Plus`、`Toad` 或 `SQL Developer` 等工具从应用程序服务器连接到数据库？\n\n## 28.5.2.2 虚拟服务器团队\n\
  \n在虚拟服务器而不是物理服务器上运行应用程序有许多优点。一个主要的缺点是它为环境增加了另一层复杂度。作为应用程序管理员，你几乎肯定没有知识、经验或权限来安装、诊断或修复虚拟服务器安装中的问题。如果你的应用程序运行在虚拟服务器上，并且你怀疑它有问题，那么你需要联系支持服务器上这一层的技术专家。\n\
  \n## 28.5.2.3 存储子系统\n\n你的应用程序所依赖的存储子系统（即磁盘存储）可以是连接到物理服务器的物理驱动器，也可以由 `SAN`（存储区域网络）子系统提供。如果你的服务器是虚拟服务器，根据定义正在使用\
  \ SAN 驱动器。如果你的服务器是物理服务器，那么存储子系统可能是本地驱动器或 SAN 驱动器。\n\n确定你是否遇到存储子系统问题的一种方法是打开 `Windows\
  \ Explorer`并在每个驱动器上点击右键。如果属性看起来正常，请尝试访问目录或文件。如果一切看起来正常且性能似乎正常，那么存储子系统可能运行正常。显然，这是一个非常简单的测试，因此不要依赖它来假设存储系统正在运行正常。\n\
  \n如果你的驱动器是物理的并且出现问题，那么你需要就此联系数据中心团队。如果驱动器是 SAN 的且无法用，那么你需要联系支持 SAN 存储的团队。\n\n##\
  \ 28.5.2.4 负载均衡器或集群团队\n\n如果你的应用程序环境包含负载均衡器或集群，那么你需要确定哪些设备正在工作，哪些没有工作。在负载均衡的环境中，每台服务器都有自己的物理\
  \ IP 地址。你需要 `ping` 每台服务器以确认其运行正常。\n\n如果应用程序运行在服务器上，那么每台服务器将有自己的 IP 地址。集群也将有一个单独的\
  \ IP 地址。你需要 `ping` 每个设备和集群，以确定哪些可用，哪些不可用。\n\n如果整组设备和支持结构（例如负载均衡设备或集群）均不可用，那么你需要联系支持该结构的团队。\n\
  \n## 28.5.2.5 网络团队\n\n如果你知道网络两端的设备功能正常，但它们之间无法相互通信，那么问题可能出在网络内部。例如，如果你知道应用程序服务器运行正常，且\
  \ DBA 团队已向你保证数据库服务器正在工作，但两台服务器无法通信，那么意识到网络问题可能导致了这个问题似乎并不是什么天才之举。联系网络团队并向他们提供尽可能多关于问题的详细信息。\n\
  \n## 28.5.2.6 安全团队\n\n如果用户在连接组织网络时遇到困难，这可能是与安全相关的问题。他们的网络账户可能被锁定或禁用。\n\n如果通过 (AD)\
  \ 活动目录或 `SSO`（单点登录）进行身份验证，并且在这些子系统中发生了问题，那么用户可能无法登录任何应用程序。联系组织的安全团队以了解可能可能发生哪些安全相关问题。\n\
  \n## 28.5.2.7 防火墙团队\n\n如果你、你的用户或你的应用程序可以访问某些服务器而不是所有服务器，那么防火墙可能是问题的原因。正确地设置和维护组织的防火墙是一项艰巨的任务。随着对其进行更改以包含新的用户、服务器或应用程序，可能会引入错误。联系防火墙或安全团队寻求帮助解决此类问题。如果你在描述所经历的问题时能尽可能详尽，将会有帮助。\n\
  \n## 28.5.2.8 DNS 团队\n\n如果你的组织有网络业务，那么它可能有一个 `DNS`（域名系统）服务器。DNS 服务器负责将如 `www.google.com`\
  \ 之类的 URL 转换为底层的 IP 地址（在本例中为 `74.125.142.103`）。如果 DNS 服务器停止响应或损坏，运行在你的网络上的用户和应用程序在连接外部服务器或网站时可能会遇到困难。如果用户在访问外部网站时遇到困难，且没有\
  \ DNS 团队，请联系网络团队。\n\n## 28.5.2.9 其他子系统\n\n是否有其他你需要注意并建立联系的子系统或支持团队？与你组织中的其他应用程序管理员建立联系，确保你没有忽略可能对你或你支持的应用程序产生问题的子系统小组。\n\
  \n### 28.5.3 供应商之间（或内部团队之间）的推诿\n\n你面临的最困难、最耗时且最尴尬的情况之一，是两个不同的小组都声称问题是由另一个小组的软件引起的。每个小组都会声称自己的软件运行正常，而另一个软件包的运行不正确。这些小组可能是两个不同的供应商，例如应用程序供应商和数据库供应商。它也可能是内部小组和供应商之间，例如应用程序供应商和网络团队可能会为远程用户体验到的响应速度缓慢而互相推诿。\n\
  \n\n\n\n我认为即使是所罗门，在处理这种困境时也会感到困难。我最好的建议是保持冷静、保持中立并保持专注。不要站队，因为如果你这样做，你就会失去其中一方的信任。尽量保持专业的态度。\n\
  \n我还发现，让双方聚在一起谈，比充当传声筒要有帮助。如果你在他们之间来回传递信息，存在一种非常真实的风险，即你可能会误传某一方的话，并给局面引入新的复杂性。安排一次会议或电话会议，让他们彼此交流。此外，尝试使用桌面共享，让每个人都能同时看到问题。如果双方都能在错误发生时看到它，那么可能就更难有人否认他们的软件是问题的根源了。\n\
  \n## 28.6 记录问题和解决方案\n\n要成为一名有效的应用程序管理员，你需要记录应用程序上发生的所有新变情况。如果发生了新问题并找到了修复方法，你需要记录问题和解决方案。所有文档都需要存放在所有人都可以访问的地方。这可能在网络驱动器上，也可能在门户网站上。通过这种方式，你改进了组织响应和纠正问题的流程。\n\
  \n### 28.6.1 记录你的故障排除技巧\n\n当你的应用程序世界运行得很糟糕时，你会做什么？你采取哪些步骤来恢复应用程序？你按什么顺序执行这些步骤？这些是你需要提前记录的技巧。你最不想看到的是，当用户和老板看着你并期待应用程序尽快恢复运行时，你却手忙脚乱地试图拼凑这些信息。\n\
  \n你的文档应该尽可能详细，有助于解决问题。由于你可能在几周或几个月后再次遇到某个问题，因此在文档中保留更多细节比更少更有意义。当你试图回忆一个问题以及如何修复它时，你会感谢自己在下一次问题发生时提供了丰富的细节。\n\
  \n永远不要忘记，这些文档不仅仅是你自己使用的。如果你的备份人员可以使用它在你不在时让应用程序上线，这意味着你在病假或休假期间可以少接一个打来的电话。良好的文档还能在你晋升或转岗后，让接替者能够支持该应用程序。\n\
  \n### 28.6.2 截图\n\n拍摄和保存截图看起来技术含量不高，但它可以节省大量时间和困惑。我尝试在文档中包含尽可能多的截图。当我处理一个几个月没见过的问题时，它们能帮我唤起记忆。\n\
  \n捕取截图非常简单。只需执行以下步骤即可：\n\n• 按 `PrtScn` 键捕获整个屏幕并将其写入剪贴板。如果你有多个显示器，它会捕获所有显示器。\n\n\
  • 按 `Alt/PrtScn` 键仅捕获当前焦点窗口的图像。\n\n• 如果你使用多个显示器，按 `Ctrl/PrtScn` 键仅捕获主显示器。\n\n一旦屏幕图像进入你的剪贴板，它就会像任何其他对象一样被处理。你可以将其粘贴到\
  \ Word 文档、电子邮件中，或将其保存为文件。你还可以将其粘贴到像 `Paint` 这样的图像编辑器中并在保存前进行编辑。\n\n在执行以下操作时，截图可能极具价值：\n\
  \n• 向供应商提供有关问题的详细信息\n\n• 记录流程\n\n• 通过让用户发送带有截图的电子邮件来诊断用户问题。\n\n当用户在使用应用程序遇到问题时，我总是尝试从他们那里获取截图。一旦拿到截图，你应该首先寻找简单但容易犯的错误。如果是\
  \ Web 应用程序，查看类似下面的错误：\n\n• 错误的 URL 方案，例如，使用 `https:` 而不是 `http:`\n\n• 错误的斜杠标记，即使用\
  \ `\\\\` 而不是 `//`\n\n• 使用 `wwww` 或 `ww` 而不是 `www`\n\n• 错误的 URL 主机名，例如使用 `www.amozon.com`\
  \ 而不是 `www.amazon.com`\n\n• 后缀不准确，例如 URL 中是 `.con` 而不是 `.com`\n\n• 某些应用程序 URL 需要指定端口号。如果你的应用程序需要此，请确保指定了正确的端口并用冒号隔开\n\
  \n• 用户是否提到了不存在的文件或路径？\n\n• 用户是否漏掉了某个参数？\n\n• 用户是否正确登录？\n\n### 28.6.3 开发你自己的故障排除列表\n\
  \n你需要为应用程序开发你自己的“技巧和窍门”文档。每当你学到新知识时，都应该将其记录下来。将所有技巧合并成一个文档，还是为每个技巧创建单独的文档并不重要。只要你知道在哪里可以找到它们，或者可以通过搜索找到它们，这才是最重要的。\n\
  \n你的“技巧和窍门”文档中应该包含什么？以下是一些示例，但不要局限于此列表。基本上，你为了改进应用程序或解决问题所做过的任何事情都是此列表的候选内容。你记录的技巧和窍门永远不停止增长。\n\
  \n• 如何杀死用户会话？\n\n• 如何停止和启动应用程序？\n\n• 如何判断应用程序是否响应请求？\n\n• 如何判断应用程序服务器是否挂起？\n\n•\
  \ 如何解锁用户会话？\n\n• 如何确定应用程序中有多少用户？\n\n• 如何确定是谁更改了应用程序的内容？\n\n• 如何重新编译或重建应用程序？\n\n\
  • 如何检查应用程序生成的日志文件？\n\n• 如何对应用程序进行备份？\n\n• 如何从之前的备份中恢复数据？\n\n你的“技巧和窍门”文档的来源是什么？基本的答案是：一切！你所做的、你所见的、你所读的，以及每次与同事讨论应用程序的时刻。对于可能作为技巧来源的内容，没有任何限制。\n\
  \n• 你对此或其他应用程序的经验\n\n• 其他应用程序管理员的建议\n\n• 你看到同事所做的创新方法\n\n• 用户可能发现解决应用程序问题的聪明方法，值得记住\n\
  \n• 供应商文档，如 `Administrator’s Guide`\n\n• 供应商网站经常提供白皮书或建议列表\n\n• 用户会议上的演讲\n\n• 行业杂志文章\n\
  \n• 你在网上阅读的文章或帖子\n\n\n\n本章的章节描述了少数几种万如果这些情况发生，你可能会希望自己曾做过更充分的准备。随着你对一个或多个应用程序使用经验的增加，你应该不断寻找那些只需稍加准备就能帮助的情况。花几分钟写下该情况的描述，你或你的继任者将不胜感激。\n\
  \n## 29.1 谁登录了应用程序\n\n在某些情况下，你可能需要知道谁登录了系统，或者在特定时间谁登录了系统。`application` 是否提供了方法来找到这些问题的答案？某些应用程序提供了管理员可以使用的界面来查找这些信息。如果你足够幸运，`application`\
  \ 还会让你发现每个用户何时登录的，以及他们目前正在做什么。如果你提前知道如何获取这些信息，将节省大量时间并避免挫败感。\n\n可能需要这些知识的一些示例包括：\n\
  \n- 你需要所有用户退出应用程序，以便重启程序或服务器。如果你能快速获取这个姓名列表，就可以联系他们要求他们注销。如果能获取用户列表**以及**他们的主管列表就更好。如果他们收到老板发来的电子邮件或即时消息（IM）要求他们注销，他们可能会响应得更快。\n\
  \n- 根据我的经验，有很多时候应用程序内的数据发生了变化，或者某个对象或报告被删除了。出了某些问题，你被要求查明是谁干的。如果你非常幸运，`application`\
  \ 将具有审计跟踪功能，这样你就可以运行报告并确切看到是谁更改或删除了对象。如果你不那么幸运，系统可能只提供一份当前在系统上或早些时候登录过的用户列表。使用该列表，你或`Business\
  \ Owner`（业务所有者）可以联系每个用户尝试确定是谁导致了问题。\n\n- 无论 `CPU` 多么强大，服务器有多少个处理器，或者服务器有多大的内存，`application`\
  \ 的运行速度似乎永远没有用户希望的那么快。会有他们他们声称性能特别糟糕并坚持要求采取某些措施。在此时，知道谁登录了应用程序以及他们正在做什么是有帮助的。也许有人正在执行一个巨大的搜索或一个调取了从开始以来所有信息的报告。如果\
  \ `application` 提供列出用户及其他们所处界面的功能，那么你就解决了该问题的 90%。如果你只能获取应用程序中的用户列表，那么至少你有了一个起点。从这里开始，你必须搜索日志、查看正在运行的进程，或者联系每个活动用户并询问他们正在做什么。\n\
  \n- 某些应用程序允许用户在同一时间多次登录。其他应用程序不允许同时开启多个会话。对于某些应用程序，这是一个可以任意配置的选项。如果 `application`\
  \ 不允许用户同时开启多个会话，你可能会收到用户的电话，声称她无法登录，因为目前有人正以她的身份登录。\n\n这种情况至少有两种解释。第一是用户上次进入应用程序时没有正常注销。也许她的电脑崩溃了，或者她使用\
  \ `Task Manager`（任务管理器）结束应用程序。另一种可能性是真的有人以该用户的身份登录了。无论哪种，如果 `application` 允许列出当前所有用户，你就可以尝试确定是哪种情况。你最终需要的一个步骤是杀死当前会话，无论是孤立会话还是被劫持会话都需要被杀死。如果证明是冒充者或黑客登录了用户，你需要杀死会话并立即更改该账户的密码。\n\
  \n## 29.2 终止用户会话\n\n在某些情况下，用户不应该出现在系统中。当正在进行某些活动时，用户的存在会导致严重问题。至少，这对于用户来说是挫败的，因为他们很可能会丢失所做的任何更新，并且他们的会话可能会过早终止。这些情况的示例如下：\n\
  \n- 在应用程序或操作系统的升级期间\n- 在正在创建备份时\n- 在从备份文件恢复数据时\n- 当应用程序正在启动过程中，但尚未完全运行期间\n- 在关机序列中间\n\
  - 在某些应用程序中，某些管理功能必须在“单用户”模式下进行\n- 在定期安排的维护窗口期间，例如，每个周日晚上 10 点\n\n如果用户在这些禁令期间内登录，那么\
  \ `Application Administrator`（应用程序管理员）需要知道如何终止他们的会话。\n\n## 29.3 防止用户会话\n\n上一节描述了用户不应登录应用程序的情况。它提供的建议是\
  \ `Application Administrator` 应该知道如何终止那些会话。更好的解决方案是完全防止用户登录应用程序。这将防止许多问题情况的发生。你需要了解是否有方法可以阻止访问应用程序。\n\
  \n如果存在这种功能，它可以通过编程方式开启或关闭吗？如果程序或脚本可以做到这一点，那么此功能就可以结合备份或计划的维护停机使用，以确保用户在不应该登录的时候登录。\n\
  \n## 29.4 关闭系统\n\n应用程序通常提供一种关闭可执行文件或服务的方法。如果用户当前登录了应用程序，该方法可能无法关闭应用程序。是否存在该方法的紧急版本或覆盖版本？\n\
  \n例如，我支持的一个应用程序具有命令行界面，允许管理员执行如下功能操作：\n\n- 启动应用程序\n- 停止应用程序\n- 显示应用程序状态\n- 列出登录应用程序的用户数\n\
  - 创建新用户\n- 删除现有用户\n- 显示指定用户的详细信息\n\n如果一个或多个用户当前登录应用程序，`stop` 命令将不起作用。然而，针对这种情况有一个覆盖机制。通过输入命令\
  \ `stop immediate`，无论用户是否登录，应用程序都将停止。如果执行了此命令，用户会话将立即终止。显然，这应该只在最关键的情况下使用，因为强制终止所有进程可能会对用户、应用程序、数据或系统产生不利影响。\n\
  \n## 29.5 自动化维护任务\n\n对于 `Application Administrator` 来说，大多数工作日都非常忙。待办事项似乎总是充满了各种活动，如应用升级、测试软件新版本，以及与供应商支持小组处理现有工单。还会有意外事件，例如用户在使用应用程序时遇到需要调查和解决的问题。\n\
  \n你任何可以自动化常规维护任务的努力都能为你腾出许多其他义务所需的时间。这里列出了一些可以自动化的维护任务示例。通过一点想象力和创造力，你应该能够自动化许多本会占用你宝贵时间的任务。显然，并非所有任务对于每个应用程序都是必要的。\n\
  \n\n\n\n- 定期停止并启动应用程序的服务，以释放程序泄漏的内存。一家供应商建议每周重启一次应用程序，以确保内存泄漏不会变成问题。我们编写了脚本，在每个周六凌晨\
  \ 1:00 停止服务，并在凌晨 1:15 重新启动。\n- 通过定期运行脚本来检查服务器驱动器上的可用磁盘空间。如果可用空间低于阈值，则让脚本发送一封电子邮件，提醒你注意这一潜在问题。\n\
  - 如果你的环境在 DNS 名称上出现问题，你可以编写一个脚本定期通过名称 ping 你的服务器。如果这些服务器不存在，脚本将向你发送封警告邮件。\n- 编写一个脚本\
  \ ping 你的应用程序服务器，以确认它们是否运行正常并有响应。如果 ping 失败，则让脚本向你发送电子邮件、短信或呼叫你。我见过许多应用程序用户将 QA（测试）环境视为类似于“轻量级生产”的平台。如果\
  \ QA 环境崩溃，他们期望这个问题能立即得到解决。也可以使用类似的脚本来检查你的非生产平台，例如 `DEV`。\n- 编写脚本确认应用程序服务是否处于激活状态。如果未激活，脚本将发送电子邮件、短信或呼叫提醒你注意此问题。或者，如果脚本发现关键服务已停止，它可以重启或启动应用程序。\n\
  - 定期确认数据库是否可用或应用程序是否与数据库断开连接。我支持的一个应用程序会在随机间隔断开数据库连接。当这种情况发生时，第一个发现的用户会提交工单或直接给我们打电话。我们编写了一个脚本定期扫描应用程序错误日志，寻找特定的错误代码。如果找到了该代码，脚本会向管理员发送电子邮件，由管理员重启应用程序并重新建立数据库连接。如果这个问题发生得更频繁，我们会更进一步，让脚本自动重启应用程序，以将停机时间减少到最低。\n\
  - 通过编写脚本从数据库中提取数据并将其通过电子邮件发送收件者来输出报告。如果应用程序带有报告包，这可能就不需要，但你可能需要一些可以在标准报告包之外运行的简单报告。\n\
  - 通过让脚本在日志文件达到特定时长后删除它们来清理日志文件。另一个选项是让脚本将旧的日志文件压缩。。由于它们是文本文件且包含大量重复内容，日志文件可以压缩到原始大小的极小比例。这将让你能够保留更长时间的日志文件，而不会占用宝贵的磁盘空间。\n\
  - 运行脚本从数据库中提取需要发送到其他应用程序、供应商、客户或监管机构的数据。应用程序管理员可以手动运行 `SQL` 查询来提取相同的数据，但如果脚本可以完成相同的任务，为什么要耽误管理员的时间呢？\n\
  - 可以编写一个相对简单的脚本，在日志文件中搜索特定短语，如果发现了这些短语，则发送电子邮件、短信或呼叫应用程序管理员。你可能寻找的短语示例包括数据库连接错误、无效的应用程序登录尝试，或用户尝试进行他们未授权的更改。\n\
  - 创建脚本在服务器之间 `FTP` 文件并不困难。如果你已经写好了一个提取数据的脚本，那么添加 `FTP` 语句将其发送给你的供应商、客户、供应商、监管机构等，应该不太难。还可以编写一个脚本通过\
  \ `FTP` 从外部源获取文件，并启动将数据文件导入应用程序数据库的过程。\n\n## 29.6 用户常见问题解答 (FAQs)\n\n根据我的经验，一组用户往往会反复询问相同的问题。我并不是在批评他们。如果一个用户每年遇到一次问题，他们不太可能记得你去年给他们的指令。你可能会反复收到相同问题的另一个原因是，系统会定期加入新用户。\n\
  \n准备他们问题的一种方法是准备一份用户常见问题解答列表。如果你能为可能的问题编写答案，那么当他们提问时，只需给他们提供相应的文档即可。你要确保提供给他们的文档回答了他们的问题，因此请确保它是准确、清晰的，并在适当的情况下包含截图。如果用户问了一个你尚未准备好答案的问题，请编写一个答案，并将此问题加入到你的\
  \ FAQ 列表中。\n\n理想情况下，你应该将 FAQ 列表存放在用户可以访问的地方，并训练他们在联系你之前先查看那里。如果你能成功地做到这一点，你可能消除绝大多数此类问题。这些文件可以列出的位置示例包括门户网站、公共网络驱动器、wiki。如果应用程序有公告页或欢迎页，你应该在那里公布\
  \ FAQ 文件的位置。\n\n一些潜在的 FAQ 主题包括：\n\n- 如果应用程序是基于 Web 的，则其 URL\n- 如果应用程序不是基于 Web 的，如何启动应用程序\n\
  - 如果应用程序不是基于 Web 的，列出需要加载到新用户工作站的任何软件\n- 如何更改密码\n- 有效密码的要求，例如最小长度、字符组合\n- 对重复使用密码的限制\n\
  - 应用程序任何文档或培训材料的位置\n- 如何定义打印机\n- 如何在应用程序中导航\n- 如何查看上个月或去年的数据\n- 如何恢复已删除的数据（文件、文件夹、报告等）\n\
  - 维护窗口的日期和时间\n- 年度结算和新年度开启的时间段\n- 报告错误时必须包含的信息\n- 请求修改用户权限\n- 如何请求解锁账户\n- 用户如何修改他们的偏好\n\
  - 如何更改用户名或账户 ID\n\n## 29.7 日志文件\n\n即使在正常情况下，应用程序也会产生大量的日志条目。条目的积累速度非常快，手动检查是不现实的。你可以设置一个自动化过程来扫描日志中的特定错误条目吗？\n\
  \n### 29.7.1 供应商支持会请求日志文件\n\n当你针对问题开启工单时，供应商支持经常要求发送一个或多个日志文件。如果他们通常要求日志文件，那么在开启新工单时应包含它们。为了能够更快响应，你应该熟悉应用程序创建的日志文件名和位置。如果你还没有这样做，应该编写脚本或批处理文件来自动捕获供应商通常要求的日志文件。\n\
  \n捕捉日志文件越快越好。在发现错误后尽快复制它们有两个优势：\n\n1. 你发送给供应商的日志文件中产生的“问题后”干扰较少\n2. 在间隔期间，日志文件不会被归档或重命名。\n\
  \n### 29.7.2 用户登录尝试\n\n应用程序日志显示用户登录/注销的情况吗？如果是，这可以监控合法和未经授权的访问尝试。你并不经常需要这些知识，但当你试图识别问题发生时谁在系统内，这些信息可能证明是极有价值的。\n\
  \n\n\n### 29.7.3 理解日志文件\n\n除非日志文件被读取和解释，否则它们不会提供任何价值。毫不夸张地说，读取日志文件是非常困难的。它们可能非常长。日志文件的内容充满了各种代码和缩写，非常晦涩难懂。读取日志文件的秘诀在于实践、实践、再实践。如果你需要帮助，希望你可以联系供应商的技术支持小组寻求建议。另一个潜在的帮助来源是检查在用户会议上发表的论文，看看是否有人提供了关于解释日志文件条目的提示。\n\
  \n## 29.8 关于服务器需要了解的以及如何学习它们\n\n在某些时候，你可能需要了解服务器的细节。例如，如果你向供应商支持小组报告了一个问题，他们可能会对服务器或应用程序的安装方式提出特定问题。你越快回答这类问题，他们就能越快地提供帮助。\n\
  \n这里列出的是我在某些时候不得不查找的服务器详情。希望这个列表对你也有帮助。注意——这里列出的 `UNIX`/`Linux` 命令可能在这些操作系统的所有变体中都适用。\n\
  \n![Image](img/T000297tabT0010.png)\n\n![Image](img/T000297tabT0010a.png)\n\n![Image](img/T000297tabT0010b.png)\n\
  \n## 29.9 紧急情况\n\n应用程序管理员的生涯可能会遇到一些紧急情况，这会让你的工作变得很有趣。希望这些情况极少发生，但如果真的发生了，你需要立即反应。你没有时间联系供应商支持、同事或你的前任。你永远无法对紧急情况做出完全准备，但如果你为你能想到的每一个潜在问题都准备了一份备忘清单，那就是你能做的最好的准备了。当然，如果你遇到了无法预见的情况，你会想要将其记录并添加到你的列表中。\n\
  \n### 29.9.1 如何解锁管理员账户\n\n管理员账户的特殊之处在于它们允许你执行其他账户无法执行的操作。通常能够执行的任务之一是解锁由于某种原因被锁的用户账户。敏的读者会问：“如果管理员账户恰好被锁了该解锁？”这是一个很好的问题。根据应用程序的不同，可能有几种可能的答案。如果《管理员指南》中没有涵盖这一点，那么你需要联系供应商的支持小组获取答案。\n\
  \n一种可能性是创建几个具有管理员权限的账户。例如，你可以为你的个人账户赋予这些权限。为你的备份创建的账户也应该拥有这些权限。最后，一个管理员账户也应该拥有它们。如果其中一个账户被锁定，可以使用其他账户来解锁它。这种做法的缺点是现在有更多的账户需要跟踪，而且这些账户可能面临破解风险。\n\
  \n某些应用程序有一个特定的账户，它是唯一真正能做所有事情的账户。如果这个账户被锁定，你就没有登录另一个账户并解锁它的奢侈了。那么该如何解锁它呢？你需要从供应商那里得到答案，但我见过两种方法：\n\
  \n- 某些应用程序允许通过数据库表重置密码。\n- 另一些则需要特定的命令行工具。\n\n### 29.9.2 修改密码\n\n某些时候你需要更改管理员密码。例如，安全策略可能要求定期更换，或者某个员工可能离职了。更改密码可以简单也可以复杂，取决于应用程序。\n\
  \n某些应用程序将加密加密存储存储在文件中。在这种情况下，过程涉及：\n\n1. 停止应用程序\n2. 修改配置文件中的条目，使其包含密码的明文版本\n3. 运行特定的工具对密码进行加密\n\
  4. 启动应用程序\n\n如果你还不知道如何操作，应该联系供应商支持并获取细节。我还建议你在测试环境或 QA 环境中练习该过程。\n\n### 29.9.3 在紧急情况下关闭应用程序\n\
  \n某些时候你可能立即关闭应用程序。例如，可能出了某些问题，运行时间越久，造成的损害就越严重。为了确保你能尽可能地停止该应用程序，如果该过程很复杂，你应该将其记录下来。如果该过程是多步骤的，最好编写一个脚本来执行。\n\
  \n在关闭应用程序之前需要记住的另一件事是需要什么授权。在紧急情况下停止应用程序之前是否需要批准？如果是，需要由谁给出批准？\n\n### 29.9.4 立即重启服务器\n\
  \n\n\n\n\n如果你可以远程连接到 Windows 服务器，可以通过点击“开始”图标并选择“关机”来重启它。在 Windows 关机界面，在标记为“您希望计算机做什么”的下拉框中选择“重启”选项。\n\
  \n重启 Windows 服务器的另一种方法是使用 `shutdown` 命令。你应该预先确认你的账户具有远程关闭服务器所需的权限。幸运的是，此权限并不是赋予每个人的。该命令的格式如下：\n\
  \n```bash\nshutdown /m \\\\computername /r /t:01 /y /f\n```\n\n其中参数含义如下：\n\n- `/m\
  \ \\\\computername`——指定要关闭的远程计算机。省略此参数将导致关闭输入命令的这台计算机。\n- `/r`——执行重启而不是关机。\n- `/t:xx`——在关闭远程计算机之前等待的时间（以秒为单位）。\n\
  - `/y`——对关机过程中显示的所有提示回答“是”。\n- `/f`——在关机发生之前强制所有所有正在运行的程序。\n\n重启服务器并不是一件困难，但某些组织对于重启服务器的限制甚至比停止和重启应用程序还要严格。在重启服务器之前，请确保你遵循了所有的协议。\n\
  \n你需要确保的一点是，你请求的是重启服务器而不仅仅是关闭它。如果你是停止它而不是重启它，那么拥有其物理访问权限的人可能需要重新启动它。如果你不在数据中心所在的位置，犯这个错误可能会延迟服务器的重启，直到你联系数据中心的人员，由他们走过去并物理上重新启动它。\n\
  \n### 29.9.5 从备份恢复数据库\n\n如果你定期对应用程序数据库进行备份，那太棒了，你应该受到赞扬。但你需要知道如何从备份恢复数据库，以便能够使用任何已创建的备份。在紧急情况下，你需要知道以下问题的答案：\n\
  \n- 从备份恢复的步骤是什么？\n- 你的所有备份是否都是全量备份，或者是否在每周的某几天创建了增量备份？如果某些备份是增量的，这将如何影响执行恢复所需的步骤？\n\
  - 必须由谁来执行恢复步骤？具体来说，应用程序管理员（Application Administrator）可以这样做吗，还是需要数据库管理员（DBA）参与？\n\
  - 存在多少个不同的备份文件？我的意思是，是否对数据库和应用程序服务器的文件进行了分开备份？如果是，这两组数据是否是同时备份的？在进行恢复时，两组数据必须同时恢复吗？备份文件集是否必须在同一时间创建？\n\
  - 应用程序有多少个数据库，这如何影响执行恢复？这个问题的答案可能不像你想象的那么明显。例如，我支持的一个应用程序有三个独立的数据库：报告数据库、工作流数据库和应用程序数据库。另一个应用程序有四个不同的\
  \ SQL Server 数据库。\n- 从备份恢复数据库需要多长时间？这是否包括将文件从一台服务器传输到另一台服务器所需的时间？\n- 上一次备份是什么时候执行的？\n\
  - 保留了多少组备份文件？\n- 是否可以从磁带或离线存储设施恢复旧的备份文件集？如果是，交付 CD、DVD 或磁带需要多长时间？\n- 备份文件在哪里？例如，它们是在应用程序服务器上、数据库服务器上还是\
  \ SAN 服务器上？\n- 备份文件的命名规范是什么？创建日期的时间是否嵌入在其中？\n- `DEV`、`QA` 和生产环境（Production）备份文件是否存储在同一个位置？它们的命名方式是否让你能够轻松区分它们？例如，它们是在不同的目录中，还是命名不同？\n\
  - 是否可以将一个环境的备份恢复到另一个环境？例如，可以从 `PROD` 的备份文件加载到 `QA` 环境中吗？如果可以这样做，步骤是否相同？对于我支持的一个应用程序，从其自己的备份恢复应用程序的过程简单又快速，大约需要\
  \ 30 分钟。但将 `PROD` 备份迁移到 `QA` 服务器大约需要 6 小时，并且需要大量的手动步骤。\n- 多久执行一次恢复过程以验证其是否有效？上一次恢复测试是什么时候执行的？成功了吗？\n\
  \n定期测试从备份文件恢复应用程序数据的过程是一个非常好的主意。可以在 `DEV` 或 `QA` 环境中进行，这样就不会影响生产环境的可用性。我特别建议在应用程序环境发生任何重大更改后进行测试。例如：\n\
  \n- 在应用程序完成重大升级之后。例如，在重大更新（从版本 4.0 升级到版本 5.0）之后，但不一定是在小版本升级（从版本 5.4 升级到版本 5.5）之后。\n\
  - 在数据库引擎发生任何重大变化之后。\n- 在硬件发生变化（如新磁盘驱动器、服务器等）之后。\n- 在人员发生任何变动之后（如新的应用程序管理员或全新的 DBA\
  \ 团队）。\n\n### 29.10 “Read_Me.txt” 文件\n\n可以创建名为 `Read_Me.txt` 的文件并用于文档记录。大多数管理员都会意识到，这个名称意味着该文件很重要、应该阅读且不应被删除。偶尔，你可能需要创建一个\
  \ `Read_Me.txt` 文件，包含所有管理员可见的信息。一个警告是不要过度使用此类文件。如果系统的每个子目录下都有一个 `Read_Me.txt` 文件，那么这个文件名将失去意义。你可能希望将其留给以下情况：\n\
  \n- 解释很少访问的文件的目的。\n- 解释备份过程如何工作以及执行所需的所需的文件。\n- 解释属性文件的目的。\n- 描述特定文件对监控过程的重要性。\n\
  \n### 29.11 版本信息\n\n每个应用程序都有版本。在某些情况下，你需要知道运行的版本。例如，当你向供应商的支持部门提交工单时，他们几乎总是要求该信息。你需要知道安装了哪个版本的应用程序。每个应用程序都略有不同，以下是我看到的获取应用程序版本的一些方法：\n\
  \n- 在配置文件中\n- 显示在“帮助 | 关于”界面上\n- 显示在登录界面上\n- 每次启动应用程序时写入日志文件的记录\n\n知道版本不仅适用于应用程序本身。了解运行版本的需求也适用于在服务器上运行的支持软件。你可能需要查找版本的某些软件示例包括：\n\
  \n- `IIS`——互联网信息服务\n- `Apache Web Server`\n- 数据库客户端软件如 `Oracle Client`\n- `JRE`——Java\
  \ 运行时环境\n- `JDK`——Java 开发包\n- `WebLogic`\n\n### 29.12 性能\n\n如果第一个计算机用户对第一个程序员说的第一句话是“很好了，但你能让它运行得更快吗？”，我不会感到意外。人类希望希望工具和玩具运行得更快。遗憾的是，当前的企业级应用程序极其复杂。让它们变快并不容易，特别是对于无法访问源代码、无法控制整体设计、无法控制网络、无法控制数据库引擎、无法控制用户桌面的应用程序管理员来说。\n\
  \n\n\n\n毫无疑问，你将会收到用户的投诉，他们应用程序运行缓慢、非常慢，甚至慢到无法使用。你必须判断是系统实际上变慢了，还是可能只是用户在抱怨。你能否以某种方式证明或记录其性能？如果你有基准性能统计数据，你就有了可以与当前性能进行比较的对象。此类统计数据至少可以通过两种方式捕获和表示：\n\
  \n1. 在应用程序运行正常时，测量服务器统计数据，如处理器忙率 (%)、磁盘活动、当前发生的 I/O 流量水平等。\n2. 对用户在应用程序中执行的典型活动计时。例如，在性能正常的情况下，对登录、常见搜索、排序、运行现有报告、修改条目、添加条目、打开应用程序深层界面等活动进行计时。\n\
  \n当不可避免的投诉来临时，你可以测量当前的活动或性能，并将其与记录的基准统计数据进行比较。如果存在显著差异，那么用户的投诉可能是合理的。服务器上的统计数据无法使用本节稍后描述的性能工具之一来捕获。遗憾的是，收集典型用户活动的计时信息可能并不易于自动化。这可能需要你手动操作应用程序并对结果进行计时。如果在多次捕获这些结果，将更具代表性。\n\
  \n为了准备应对不可避免的提升性能的请求，你可以提前做一些准备。这些准备步骤包括以下内容：\n\n* 按照上段所述收集你的基准性能统计数据。\n* 在多个类型的时间段收集统计数据：清晨、中午、月底等。\n\
  * 哪些统计数据是有用的，以及如何获取它们？\n* 应用程序是否有一组内部测试可以提供性能信息？我支持的一个应用程序就具有这种能力。你可以启动一个界面，向数据库建立\
  \ 500 个连接，执行 500 次读取、执行 500 次写入等，并显示所需的平均时间。该工具唯一的缺点是，运行时它会对系统造成相当大的压力。\n* 可为你提供性能信息的工具很大程度上取决于运行在你服务器上的操作系统。例如，`Perfmon`（性能监视器）收集基于\
  \ Windows 的服务器统计数据。在 UNIX 和 Linux 系统上，`time`、`netstat`、`ps` 和 `top` 等命令可以提供有关应用程序服务器活动的细节。\n\
  * 还有用于在浏览器级别收集统计数据的工具。`Firebug` 是一个开源工具，可用于捕获 Firefox 浏览器的 HTTP 流量统计数据。`Fiddler`\
  \ 是另一个开源工具，捕获 Internet Explorer 浏览器会话中的 HTTP 流量。此类工具可以提供有关进出浏览器的信息的见解，以及可能导致它需要那么长时间的原因。\n\
  * 网络级工具如开源数据包分析器 `Wireshark` 可用于分析网络流量。一旦你有了使用此类工具的经验，你对从用户工作站到应用程序服务器到数据库服务器之间传输的内容有更深入的理解。\n\
  \n一旦你确定系统运行比正常慢，你该怎么办？第一步是隔离问题。性能问题是否只发生在单个用户身上？如果是这种情况，请要求他们清除 Internet 浏览器缓存，重启工作站并重新登录应用程序。惊讶的是，这已被证明可以解决用户遇到的大部分问题。\n\
  \n如果有多个用户报告相同的问题，那么这就是一个必须调查和处理的正规问题。第一步是尝试将问题隔离到应用程序环境的某个特定区域。例如，我将按照特定的顺序调查以下领域。\n\
  \n* 看起来是应用程序服务器问题吗？如果应用程序服务器的 CPU 空闲率为 99%，那么这可能不是问题所在。应用程序服务器上应该检查的其他资源还包括内存占用、磁盘\
  \ I/O 活动量以及生成的网络流量。如果这些统计数据没有异常高，那么你可能安全地排除应用程序服务器是问题源。\n* 可能是数据库服务器问题吗？遗憾的是，大多数应用程序管理员没有远程登录数据库服务器的能力。鉴于现实，你的首要替代方案是联系\
  \ DBA 团队，询问数据库服务器是否看起来过载或运行缓慢。如果你确实拥有数据库服务器的权限，请检查与你在应用程序服务器上检查相同的统计数据，即 CPU 活动、内存使用、磁盘\
  \ I/O 和网络活动。\n* 如果你在应用程序服务器或数据库服务器上没有发现任何问题，那么网络就是下一个关注的组件。遗憾的是，调查潜在的网络性能问题并不总是容易。你可能需要依靠组织网络团队的专业知识。向他们展示当前与基准性能统计数据将有助于说服他们确实存在问题。\n\
  \n## 29.13 应用程序管理员手册模板\n\n每个应用程序的应用程序管理员都需要记录某些内容。考虑到这一点，你应该考虑为整个组织创建一个应用程序管理员手册模板。它可以为你你或你的小组支持的每个应用程序进行复制和定制。这些项目大部分只需要一页，有些只需要一段。将所有这些信息放在一个地方，对于你深夜、你的继任者、你的老板等来说将是无价的。提前编写和组装此文档，可能让你在享受假期时不会被替补人员的疯狂电话打扰。\n\
  \n我讨厌称某物为“活动文档”，但这个术语对于此类文档来说非常合适。你需要保持它的更新。如果你写了它但不复审，它将很快过时并毫无用处。\n\n适用于每个应用程序的主题包括：\n\
  \n* 启动程序\n* 如果存在多个服务器，你需要包含它们重启的顺序\n* 关机程序\n* 如果存在多个服务器，你需要包含它们停止的顺序\n* 紧急关机程序\n\
  * 添加、删除、禁用、启用用户\n* 杀死用户会话\n* 查找系统中哪些用户\n* 配置文件\n* 拓扑文件\n* 升级过程中需要保留的文件。通常，这些包括仅存在你的安装中的自定义内容。供应商的升级可能会覆盖这些文件，或者清除存放自定义内容的整个目录。\n\
  * 管理员密码和登录信息\n* 服务器上特定于此应用程序的服务或守护进程\n* 重新编译应用程序\n* 调控制模式\n* 日志文件在哪里、是什么、何时创建和归档\n\
  * 应用程序的 URL\n* 应用程序的当前版本以及如何查找\n* 操作系统的当前版本以及如何查找\n* 服务器拥的内存和磁盘空间\n* 所有服务器的名称和位置\n\
  * 数据库详情\n* 数据库服务器名称\n* 应用程序使用的数据库登录名\n* 应用程序使用的数据库密码\n* 应用程序使用的连接字符串\n* 数据库软件版本\n\
  \n\n\n\n- 如果适用于此应用，请提供负载均衡详情\n- 如果此应用使用 FTP 服务器导入或导出文件，请提供该服务器信息\n- 重启应用程序程序\n-\
  \ 重启服务器程序\n- 正在使用的 DNS 名称\n- 备份详情\n- 备份频率是多少？\n- 备份发送到哪里？\n- 使用什么工具来创建备份？\n- 联系人\n\
  - 供应商\n  - 电话号码\n  - 网站 URL\n  - 支持电子邮箱地址\n  - 您的许可证号\n  - 您正在运行的产品名称和版本\n  - 您在登录供应商网站时使用的\
  \ ID 和密码\n- DBA 团队\n- 数据中心\n- 网络人员\n- 用户社区，特别是那些必须批准重启的人员\n- 应用程序业务“所有者”\n- 从供应商获取帮助的概述\n\
  - 你是否会拨打 800 电话？\n- 你是否会通过电子邮件提交请求？\n- 你是否会在网站上发布你的请求？\n- 他们的联系信息对你来说准确吗？你不希望等他们的电话，结果发现他们拨打的是你的旧号码\n\
  - 基准性能负载的详情\n- 发布补丁或升级的步骤概述\n- 应用程序的维护停机窗口。例如，中部标准时间周日晚上 10 点到午夜\n- 列出应用程序服务器、数据库服务器、IP\
  \ 地址等的拓扑结构文档\n- 输入和输出应用程序的数据流\n- 文件导入或出的频率是多少？\n- 文件布局\n- 什么进程导入了数据？\n- 如何处理错误情况？\n\
  - 如果发生问题，联系谁？\n- 它依赖哪些其他应用程序，或哪些应用程序依赖它？\n- 你的 DR（灾难恢复）程序、硬件和位置概述\n- 故障转移程序，包括从备份带恢复\n\
  - 从头开始重建系统的步骤\n- 应用程序服务器上是否有任何计划任务？\n- 每个任务是做什么的？\n- 它们的运行频率是多少？\n- 定期生成哪些报告？\n\
  - 这些报告发送给谁？\n- 如何调度这些报告？\n- 报告调度时间应该错开，以避免系统过载\n- 修改、添加或删除报告的流程\n\n# 第 30 章\n\n\
  # 会发生你不想考虑的事\n\n## 摘要\n\n本章描述了某些你可能不想面对但会发生的事件。这些事件的示例包括：应用程序挂死、重启应用程序、确定停机原因、数据丢失、迁移应用程序或服务器、供应商相关的变更、迁移到另一个应用程序包，以及增加或丢失大量用户。\n\
  \n### 关键词\n\n应用程序挂死；通知；根因；事故报告；数据丢失；迁移；供应商被收购；整合；合并；收购；规模扩大或缩减；获取新电脑\n\n尽管我们有自己的愿望和期待，坏事总会在人的生活中中发生。在应用程序管理员的职业生涯中，会发生一些你不希望发生的事情。虽然你无能完全阻止它们的发生，但充分的准备可以最大限度地减少它们造成的伤害。准备的关键在于花时间思考可能会发生什么，以及你如何为此此做准备。\n\
  \n本章的章节描述了你世界中可能发生的某些情况。某些情况比其他情况更容易发生，某些比其他情况更具破坏性，但在你职业生涯的某个时刻，你可能会遇到其中至少一些问题。如果你经历或预见到了这里没有列出的情况，你应该记录你关于如何应对的计划。\n\
  \n## 30.1 应用程序挂死\n\n迟早，你支持的应用程序都会变得无响应或挂死。在大多数情况下，重启它将解决问题，但那只是治标不治本。你真的应该在预防、检测和分析该问题的计划上投入更多精力。接下来的章节描述了处理完全停止运行的应用程序的一些步骤。\n\
  \n### 30.1.1 通知\n\n你将如何发现应用程序已变得无响应？我可以向你，如果你没有立即注意到问题，你的用户社区会很快发现。根据你与该群体的关系，他们中的某人可能会立即联系你。如果他们不认识你或不了解你，那么他们可能会向组织的帮助热线提交工单。如果没有此类工具，他们就会坐在座位上，一边咒骂你和应用程序，一边尝试通过电子邮件或电话拨打他们组织和你组织内他们能想到的任何人来寻求帮助。\n\
  \n比起让用户发现问题，更好的解决方案是为应用程序实施某种程度的自动化监控。例如，如果应用程序依赖于特定的进程或服务，则监控该进程或服务。如果它停止运行，监控脚本或包应该发送该问题的通知。\n\
  \n这引出了关于谁、如何以及何时的问题。\n\n- **应该通知谁？** 最可能的情况有一个列表而不是单一的人员接收通知。一些可能的候选人包括：应用程序管理员、备份应用程序管理员、应用程序业务所有者，可能还有数据中心的人员。每个组织都会有一份不同的通知名单。\n\
  - **应该如何通知他们？** 显而易见的选择是根据员工经常携带的电子设备发送电子邮件或短信。\n- **应该何时通知他们？** 这个问题在午夜左右变得非常重要。某些应用程序需要\
  \ 24 小时、7 天运行。如果你的应用程序是之一，那么每当它变得无响应时都应该发送警报。另一方面，如果周一早上 9 点之前没有人会使用该应用程序，你真的需在周六凌晨\
  \ 2 点接到电话吗？需要对支持水平进行现实的评估，并据此设置监控流程。也许在周一至周五的早上 7 点到晚上 10 点之间发送短信，下班和周末发送电子邮件。监控工具通常允许你根据问题的严重性（由你定义）配置发送什么类型的警报以及何时。\n\
  \n这里需要说明监控的局限性。关键进程或服务完全可能挂死但在技术上并没有停止运行。从用户的角度来看，应用程序似乎是死掉了，但在服务器上进程仍然处于激活状态。在这种情况下，监控进程可能不会发送任何通知。会有某些时候，你的用户将成为应用程序是否工作的最终评判者。\n\
  \n### 30.1.2 平衡快速重启与收集信息\n\n当不可避免的应用程序挂死发生时，你的本能可能是尽可能快地重启应用程序。虽然这可以理解，但它可能不是最佳决定。如果你不了解导致问题的原因，那么你永远无法采取任何措施防止它再次发生。因此，与其简单地重启应用程序，或许在重启之前花几分钟收集有关应用程序状态的信息，可能是一项明智的投资。你应该尝试获取的一些信息在下一节中描述。\n\
  \n### 30.1.3 收集关于挂死的信息\n\n可能具有潜在价值的可能信息来源列表包括：\n\n- 应用程序的服务或进程是否正在运行？如果你还没有编写脚本来收集这些信息，这是要这么做的又一个好理由。\n\
  \n\n\n\n\n- 是否服务器的部分或全部资源被过度利用？例如，`CPU` 利用率是否异常高？所有可用的 `RAM` 是否已用尽？系统页面交换是否像厉鬼尖叫一样剧烈？网络带宽的占用百分比是多少？\n\
  - 收集一组供应商支持团队通常请求的日志文件。同样，如果你还没有编写脚本或批处理文件将日志复制到临时位置，这是一个这么做的绝佳理由。\n- 有多少用户登录了应用程序，他们正在做什么？如果系统已经挂起，你可能无法获得这些信息。在某些系统中，这些信息可以通过日志文件或数据库获取。\n\
  - 数据库是否可以访问？使用 `Toad` 或 `SQL*Plus` 快速连接到数据库只需要几秒钟。你应该考虑编写一个脚本来测试数据库连接。如果应用程序有一个包含活动用户列表及其最近操作的表，你可以编写一个脚本\
  \ `select` 那些行并将它们写入文本文件。这在排故障问题原因时可能是有用的知识。如果你无法与数据库建立连接，这本身就是很有价值的信息。\n- 截取任何已显示的错误信息的屏幕。这些信息更有可能显示在用户屏幕上，而不是服务器控制台上。\n\
  - 如果供应商支持组要求在应用程序挂起时提供核心转储（core dump），那么如果还没有创建，现在就是创建它的。\n- 最后一个信息来源是查看操作系统级别的日志文件。在\
  \ Windows 服务器上，可以通过打开`Event Viewer` 访问这些文件。\n\n### 30.1.4 重启应用程序\n\n一旦你从系统中提取了每一丝信息，就是时候重启应用程序了。你需要做的下一个决定是简单重启应用程序，还是先完全关闭它。直接启动可能看起来更快，但这样做可能会导致某些进程或服务处于未知状态，并且对数据库可能存在风险。这个问题的正确答案取决于：\n\
  \n- 《管理员指南》中的说明\n- 供应商支持组给你的建议\n- 你对以前应用程序挂起情况的经验\n\n重启或关闭并重启应用程序需要多长时间？了解这一点非常重要，以便你能识别出应用程序没有正常启动的情况。如果通常从零开始启动需要\
  \ 10 分钟，而你已经等了 30 分钟，那么你面临的问题可能比你之前认为的严重得多。\n\n应用程序在启动过程中是否显示或记录了记录应用程序已成功完成 `y`\
  \ 个可能步骤中的第 `x` 步的消息？如果这些信息可用，且应用程序有未正常启动的记录，那么你就需要成为识别应用程序处于启动过程哪个阶段的专家。\n\n###\
  \ 30.1.5 通知用户社区\n\n一旦应用程序完全运行，你需要通知谁？这个列表上的某些人员包括：\n\n- 应用程序的业务所有者（Business Owner）\n\
  - 最初报告问题的人\n- 数据中心团队\n- 负责报告该问题的监控包的团队\n- 你的老板\n- 你的伙伴或备份人员，这样他们就不会浪费时间调查你已经处理过的事情\n\
  - 用户\n\n### 30.1.6 找到问题的根源\n\n如果你没有弄清楚导致问题的原因，那么它极可能永远无法修复。找出导致问题原因的调查通常被称为根因分析（root\
  \ cause analysis）。遗憾的是，进行根因分析通常：\n\n- 需要耗费大量精力\n- 需要耗费时间\n- 需要专业的知识\n\n我真想告诉你，每当我的某一个应用程序崩溃时，通过努力和勤奋，我都能找到问题的根源。我很想这样告诉你，但那是谎言。根据我的经验，大多数时候你能够对原因给出合理的推测，但你无法明确地证明它。现实情况是，应用程序、数据库、支持软件和操作系统都是极其复杂的。它们包含数百万行代码。错误可能出现在任何地方。通过收集日志、错误信息等，你正在帮助他们解决问题所需的信息。\n\
  \n### 30.1.7 创建事件报告\n\n每次停机都应该记录。这些报告不需要很长。只需包含以下内容：\n\n- 影响概述\n- 采取的步骤描述、执行人及时间\n\
  - 总停机时间\n- 根因或你最大的近似值\n\n你想要创建事件报告有几个原因：\n\n- 它帮助你识别由相同或类似情况引起的停机\n- 它记录了你及时处理了停机并及时恢复应用程序\n\
  - 它记录了总停机时间\n- 审计员可能需要\n\n## 30.2 服务器崩溃\n\n如今硬件和软件的可靠性比以前高得多。服务器崩溃得没那么频繁，但你的服务器最终可能会崩溃。当这种情况发生时，就像应用程序挂起一样，但更可怕。\n\
  \n应用程序挂起和服务器崩溃之间的区别在于，服务器问题可能会影响更多的用户。如果服务器托管了多个应用程序，那么每个应用程序的所有用户都会受到影响。\n\n在这种情况下，你需要采取的步骤与应用程序挂起时所做的非常相似。我不想重复上一章，但会包含相同的章节，并仅列出不同的步骤。\n\
  \n### 30.2.1 通知\n\n如果你的组织部署了监控包，那么它一定设置好了可以识别服务器崩溃。如果你需要编写脚本来识别服务器崩溃，最好的方法是在另一台服务器上运行脚本或批处理作业，定期\
  \ ping 应用程序。如果没有响应，那么很有可能是服务器已经挂起或崩溃。\n\n如果服务器崩溃，应该通知的人员列表与应用程序停止时通知的人几乎相同。唯一的区别是，如果服务器托管了多个应用程序，就需要联系多个应用程序管理员。由于是服务器问题，肯定需要联系数据中心的人员。\n\
  \n### 30.2.2 权衡快速重启与收集信息\n\n快速重启与花时间收集信息之间的平衡并不会因为服务器宕机而改变。从长远来看，在重启服务器并启动应用程序之前，多花几分钟尽可能地了解问题仍然是更好的。\n\
  \n### 30.2.3 收集有关崩溃的信息\n\n\n\n\n通常，如果服务器崩溃，那么收集问题信息的责任属于数据中心或服务器团队。在服务器启动后，你收集应用程序日志文件并无大碍，但数据中心团队应该是该问题的首席负责人。\n\
  \n### 30.2.4 重启服务器\n\n通常，重启服务器是数据中心团队的责任。在许多情况下，应用程序管理员无法做到这一点，因为他或她没有访问数据中心的权限。如果服务器已经宕机，关于谁可以授权重启应用程序的问题就不值讨论了。\n\
  \n必须考虑的一个棘手问题是服务器是否会自动重启？在某些情况下，系统管理员可能希望在不启动任何应用程序的情况下启动服务器。例如，他们可能希望在对其添加额外负载之前，先查看操作系统是否运行正常。如果应用程序必须手动启动，你知道如何操作吗？\n\
  \n- 此过程是否有文档记录？\n- 文档在哪里？\n- 如果应用程序没有启动，你该如何处理这种情况？\n\n一旦服务器启动，你必须确认应用程序正在运行。需要回答以下以下问题：\n\
  \n- 谁负责验证应用程序已启动？是由应用程序管理员执行，还是业务所有者的责任？\n- 你如何确认应用程序运行正常？\n- 此过程是否有文档记录？\n- 如果应用程序没有启动，会采取哪些措施？\n\
  \n### 30.2.5 通知用户\n\n需要通知相关人员服务器已经重启，且应用程序已确认运行正常。在应用程序重启后负责执行此操作的人员也应该承担相应责任。\n\
  \n### 30.2.6 寻找根源\n\n等尘埃落定后，有人需要找出服务器最初死亡的原因。很可能，这个责任将分配给数据中心团队，而不是应用程序管理员。他们可能会向你索要信息，例如日志文件，但这应该是他们的任务。\n\
  \n### 30.2.7 创建事件报告\n\n你仍然需要为服务器崩溃创建一个事件报告。其布局应与应用程序挂起时相同。最大的区别在于“根本原因”，你应该包含数据中心团队提供的任何信息，而不是自己去进行研究。\n\
  \n## 30.3 数据库困境\n\n由于大多数应用程序将数据存储在数据库中（通常是关系型数据库），数据库中发生的任何问题都会对应用程序产生重大影响。或许最糟糕的数据库相关困境是应用程序数据丢失。导致数据丢失的原因包括：\n\
  \n- 应用程序问题——如果应用程序存在代码或逻辑错误，数据可能会在应该保存时丢失或未保存。如果你怀疑是此原因，你需要多次测试数据丢失发生的情况，以确认问题确实存在。如果数据反复丢失，请向供应商支持组提交工单以报告该问题。运气好的话，他们将提供一个通用的方案，一直使用到修复错误的补丁发布为止。\n\
  - 人为错误——从现实来说，这是数据丢失最可能的原因。可能是用户不理解如何正确使用应用程序，或者需要额外的练习来熟悉应用程序。在这种情况下，提供更多培训无疑是一个选择。\n\
  - 数据库问题——数据库实际上导致数据丢失的概率微乎其微。主要的数据库引擎非常复杂，但在发布之前经过了极其严格的测试。此外，它们每天被数十万甚至数百万个实例使用。如果它们会丢失数据，那么此类问题几乎肯定已经被报告了。我不是说这种情况不会发生，但其发生的概率极低。数据丢失的原因更有可能是人为失误、误解或应用程序错误。\n\
  \n## 30.4 迁移\n\n应用程序的迁移并不经常发生，但它是你的应用程序未来可能发生的事情。任何类型的迁移都不好玩，但由于这类事件一旦一旦启动，应用程序管理员可能无法阻止它们。后续章节描述了某些类型的迁移事件。\n\
  \n### 30.4.1 迁移到新服务器的原因\n\n应用程序可能迁移到新服务器有几个可以理解的原因：\n\n1. 当前服务器的寿命即将到期或已经到达。如果你的组织长期使用该应用程序，这种迁移是不可避免的。服务器的寿命约为\
  \ 5 年。在此之后它们可以继续运行，但很难找到备备件，供应商不再愿意支持，或者更换服务器的性价比极具吸引力，令人无法忽视。\n2. 应用程序已经超过了当前服务器的容量，需要迁移到更大、更强大的服务器。这实际上是一个“好问题”，表明应用程序正在被广泛使用。这几乎意味着它对组织的价值得到了认可。\n\
  3. 物理服务器已虚拟化。这可能也是一个好问题。这意味着与物理服务器相关的许多维护问题将转移给组织中支持虚拟服务器的小组。迁移到虚拟服务器还有其他好处，包括：\n\
  \n- 为虚拟服务器分配额外的处理器、内存和 SAN 空间比为物理服务器更容易。\n由于 由于多个虚拟服务器托管在单一物理服务器上，因此每台虚拟服务器的成本通常低于物理服务器。\n\
  - 可以对虚拟服务器拍摄快照，并在其损坏或崩溃时使用进行重建。这确保了虚拟服务器的停机时间降至最低。\n\n#### 30.4.1.1 迁移到新服务器的步骤\n\
  \n你需要做什么来确保顺利、无地过渡到新服务器？实现顺利过渡的第一步是准备一个清单，列出完成迁移所需的步骤。通过这种方式，你可以识别潜在的瓶颈，并安排人员并行工作以以最短总时间完成项目。列表上的任务可能包括以下内容，当然，每个计划都会不同。\n\
  \n1. 验证建议的硬件和操作系统符合应用程序的要求。\n2. 获取服务器并在加载操作系统。\n3. 为应用程序管理员团队授予服务器权限。\n4. 打开所需的防火墙端口，例如数据库服务器、报告服务器、邮件服务器。\n\
  5. 在服务器上加载支持软件，如 `IIS`、`Apache`、数据库客户端等。\n6. 在服务器上加载应用程序软件并应用所有最新的补丁和更新。\n7. 如果需要，获取并安装应用程序许可证文件。有时，许可证硬编码到特定服务器，因此迁移到新服务器可能需要新的许可证。\n\
  \n\n\n\n\n8. 配置新应用程序环境以访问生产数据库的副本。这确保了测试将使用真实数据，但不会破坏生产环境的数据。如果你的数据库包含 `PII`（个人身份信息），则你可能需要在测试访问之前对其进行修改或掩码。\n\
  \n9. 在新服务器上对应用程序进行 `UAT`（用户验收测试）。\n\n10. 如果 `UAT` 成功，则与用户安排迁移停机日期和时间。\n\n11. 从此时点起，用户将无法再访问旧服务器。\n\
  \n12. 将新应用程序环境指向生产数据库。\n\n13. 在将新服务器交付用户之前，在这些服务器上进行最终测试。\n\n14. 如果测试成功，则为用户开启对新环境的访问。\n\
  \n15. 如果旧服务器将保持在线一段时间，请确保禁用它创建的所有报告、提取和告警。如果你忘记了这一点，用户可能会收到重复的报告，或者旧新服务器可能会同时创建导出文件。\n\
  \n16. 在经过一段合适的间隔（几天或几周）后，废弃旧服务器。\n\n迁移到新服务器的步骤包含了许多在原始服务器上安装应用程序时执行过的步骤。如果你保留了准确的笔记和截图，那么这些文档在将应用程序迁移到新服务器时将非常有帮助。充分利用你的远见卓卓吧吧。\n\
  \n### 30.4.2 物理移动服务器\n\n移动服务器可以有多种形式。其中一些列在这里：\n\n- 从办公桌或布线间到实际的数据中心。\n- 从一个数据中心移动到另一个数据中心。\n\
  \n步骤可能涉及将服务器从其当前位置（例如隔间的办公桌或布线间）物理移动到正式的数据中心。这可能是因为应用程序的责任正从开发小组转移到正式的支持小组。也可能是因为一个组织变得更加“成熟”，意识到其硬件需要汇集到具有物理安全性、适当的环境控制和冗余支持（电源和电信连接）的相应设施中。\n\
  \n如果工作仅仅是物理移动服务器，步骤列表将如下：\n\n- 与用户社区协调迁移日期和时间。\n- 备份数据库。\n- 备份应用程序软件及相关文件。\n- 将服务器物理移动到其新位置，例如数据中心。\n\
  - 如果服务器将从一个 `LAN` 移动到另一个 `LAN`，这可能会影响安全或防火墙端口。\n- 验证服务器具有电源和电信连接。\n- 如果服务器的 `IP\
  \ address` 发生变化，则更新其 `DNS` 条目。\n- 测试与数据库、备份和消息传递等其他子系统的连通性。\n- 测试用户访问应用程序的能力。\n\
  - 执行 `UAT` 以验证应用程序运行正常。\n- 通知用户社区应用程序再次可用。\n\n### 30.4.3 迁移到供应商托管的 ASP（应用程序服务提供商）\n\
  \n许多供应商提议为通过互联网访问其应用程序的客户托管应用程序。基本上，客户的用户访问的是运行在供应商服务器上的应用程序。这种应用程序交付方法有多个名称，例如：\n\
  \n- `ASP`——应用程序服务提供商\n- 需需软件\n- 软件即服务 (`SaaS`)。\n\n`ASP` 模式的优势之一是供应商承担了许多传统上由内部人员负责的日常活动：\n\
  \n- 客户不需要获取或维护应用程序服务器、`OS` 许可证、相关基础设施和数据中心空间。\n- 客户不需要维护数据库服务器。\n- 客户不需要执行备份。请确保你清楚供应商正在进行哪些备份，以及备份保留多久。如果用户无意中删了一些关键数据，你会希望知道供应商是否可以恢复它、过程需要多长时间以及费用是多少。\n\
  - 客户不需要应用升级来保持服务器或应用程序处于最新状态。\n\n`ASP` 也并非没有缺点。其中一些：\n\n- 应用程序的成本可能比本地安装高，但必须对对比几年的成本进行仔细的财务分析。\n\
  - 失去对应用程序的控制。\n- 组织的数据位于数据中心之外。\n- 除非你专门签合同，否则可能没有 `TEST` 或 `QA` 环境。\n- 你的数据完全依赖于供应商的安全。\n\
  - 你的组织对升级计划的控制微乎其微。\n- 你无力处理性能问题。\n\n如果你目前在内部服务器上托管应用程序，并决定迁移到 `ASP` 环境，那么你将参与这一变化。你可能对这种变化并不热衷，但你必须具备团队协作精神。执行此操作的基本步骤是：\n\
  \n- 导出你的数据库并提供给供应商。\n- 向供应商提供任何本地开发的定制化内容。\n- 向供应商提供任何本地报告。\n- 供应商根据你的数据、定制化内容和报告构建系统并供其测试。\n\
  - 由用户社区中选定的子集对 ASP 托管的应用程序进行 `UAT`。\n- 如果测试成功，则与用户协调日期和时间。\n- 在切换当天，禁用内部托管应用程序的访问，或将用户权限降为只读。\n\
  - 执行数据库的最终导出并发送给供应商。\n- 供应商在他们的服务器上加载你的最终导出。\n- 禁用内部托管版本上的任何报告、数据导出或其他进程。\n- 对 ASP\
  \ 托管的应用程序进行 `UAT`。\n- 如果测试成功，则允许用户访问 ASP 托管版本。\n- 为所有用户提供访问 ASP 托管版本的新 URL。\n- 在使用\
  \ ASP 版本几天或几周后，废弃内部应用程序服务器。\n\n## 一旦组织许可并安装了供应商的应用程序，你不希望供应商发生任何变化。你希望他们继续照常运行，而不产生任何波澜。最令人不安的事情之一是你收到供应商通知他们那边发生了变化。此类变化的示例描述在以下章节中。\n\
  \n### 30.5.1 供应商被收购\n\n软件应用程序供应商的世界是一个不断变化。你可能认为你的供应商太大或太独立而不会被收购。如果你是这样想的，你可能错了。即使是最大的供应商的客户，也会发现他们的供应商被企业应用海洋中更大的鱼收购了。\n\
  \n如果你许可应用程序的供应商被另一家公司收购，你该怎么办？你需要仔细听从收到的任何公告或发布的任何新闻稿中的内容。你还需要查看收购方目前提供的其他产品和服务务。例如：\n\
  \n- 收购方是否提供相同或相似的应用程序？如果是这样，那么你必须为你所依赖的应用程序可能停止服务的这种可能性做好准备。\n\n\n\n\n\n-   收购方是否声称他们将继续支持他们刚刚收购的应用程序？在宣布收购时，你并不知道他们的真实意图。你所做的只能观察他们过去的行为以及他们目前销售的类似产品。如果他们没有像你所许可的那样的应用程序，那么他们很有可能说的是真话。另一方面，如果他们有收购软件供应商并停止其产品线的历史，那么你就必须面对现实：你的应用程序的寿命可能已经寥寥无几了。\n\
  -   他们会将其整合到自己的产品系列中吗？如果他们没有竞争产品，或者他们的内部产品的市场份额远低于刚刚收购的应用程序，那么这种情况更有可能。\n-   他们会任由收购的应用程序荒废，并强制你迁移到他们的应用程序吗？也许吧。只有时间能给出答案。\n\
  \n### 30.5.2 供应商正在退用你的应用程序\n\n你不想从供应商那里收到的另一种消息是他们决定退用或停止你从他们那里许可的应用程序。如果你收到此类公告，那么会有你应该做的事情以及你应该问的问题。其中包括：\n\
  \n-   确保业务用户和部门已经了供应商的计划。他们在决定处理这种情况的策略时可能会有最大的影响力。\n-   他们将继续支持该应用程序多久？“支持”到底意味着什么？是提供补丁和更新吗？是故障修复支持吗？排除故障？还是仅仅接电话并将你引向手册？\n\
  -   供应商是否会将此应用程序的功能添加到你的组织可以迁移的另一款产品中？\n-   应用程序的源代码会公开吗？\n-   在供应商停止支持后，是否有可能提供第三方支持？该实体将拥有哪些专业知识？\n\
  -   是否可以雇佣具有该应用程序经验的供应商前员工？这种专业知识和对源代码的访问权限是否能为该应用程序为你提供充分的支持？\n-   你可以在没有供应商或第三方支持的情况下生存吗？如果应用程序非常稳定且不需要定期的数据更新（例如税收信息变化），那么你可能可以在没有支持的情况下维持下去。\n\
  -   是否可以想象，你的组织可以与其他同样许可该应用程序的组织建立联系，并在应用程序退用后相互帮助？在某些领域，这种合作的设想是不可想象的。在其他领域，这种情况已经在发生了了。\n\
  \n### 30.5.3 迁移到另一个供应商的产品\n\n如果供应商被收购或选择了退用该应用程序，那么你的组织可能会决定替换它。如果这是计划，你将需要尽快开始收集潜在替换产品的信息。迁移过程将比预期的要长。当前供应商的支持结束将比你预想的要快得多，最好不要在毫无准备的情况下被击中。\n\
  \n组织决定是时候迁移到来自不同供应商的另一个产品，还有其他原因。做出此决定的原因有很多。一些示例：\n\n-   当前的应用程序没有提供你认为重要的功能\n\
  -   当前的应用程序没有跟上行业的变化\n-   供应商对当前应用程序的支持水平未达到你的预期水平\n-   当前应用程序的成本被认为过高\n-   用户对当前应用程序不满意\n\
  \n迁移到新应用程序需要采取的步骤包括以下：\n\n-   获取潜在替换产品的基准测试数据。\n-   询问潜在的新供应商关于他们在迁移方面的经验，特别是从你目前使用的产品迁移的经验。\n\
  -   询问潜在的新供应商是否可以将数据从当前应用程序迁移到新应用程序。应用程序数据库通常非常复杂。如果新供应商具有迁移数据的经验，那么你应该认真考虑让他们来执行这一步。\n\
  -   你可以在新产品上重现现有的自定义功能吗？\n\n### 30.5.4 避免供应商变更\n\n避免所有上述供应商变更的一种方法是依赖于基于开源技术构建的应用程序。这些应用程序在传统意义上并不被任何人“所有”。它们是由志愿者社区开发和增强的，而不是由单一公司开发。如果有这样的应用程序且你选择了那条路线，你的组织需要对它投入比在传统许可应用程序中更多的精力。当然，如果没有与你正在使用的类似的开源应用程序，那么这个选项对你来说无效。\n\
  \n## 30.6 整合、合并与收购\n\n美国和其他国家的组织似乎在不断地经历整合、合并和收购的过程。如果你的组织收购了另一家公司或自身被收购，对你所支持的应用程序（以及你的工作）将产生什么影响？虽然没有办法预先确定，但至少考虑一下可能发生的情况并无坏处。\n\
  \n在过去的十年里，降低成本在某种程度上一直被视为“圣杯”（Holy Grail，即梦寐以求的目标）。管理层可以降低成本的一种方法是将多个相似的应用程序合并为一个应用程序。这是一个合理的做法，你可以相当确信这在未来将继续发生。最大的问题是，你支持的应用程序将是“合并方”还是“被合并方”？\n\
  \n如果你的组织参与了合并或收购，你必须询问另一个组织是否有一个提供与你支持的应用程序相同功能的应用程序。如果答案是“是”，那么很有可能其中一个最终会被停止。\n\
  \n-   这个价值 64,000 美的问题是哪一个会被保留？\n-   如果你的应用程序被保留，你将如何吸收另一个应用程序的用户的功能？\n-   如果你的应用程序没有被保留，它将如何迁移到另一个应用程序？\n\
  -   如果你的应用程序将被保留，你被解雇或调的概率有多大？\n\n无论你的应用程序是保留还是退用，都会有大量工作要做。需要采取的一些步骤包括以下：\n\n-\
  \   识别需要保留的自定义内容\n-   数据迁移，即从一个应用程序导出数据并导入到另一个应用程序\n-   重新培训用户\n-   重新培训管理员\n- \
  \  更新网络访问、防火墙端口、备份等\n-   退用或重用服务器\n\n## 30.7 增加办公室、部门或分公司\n\n如果你的组织扩大，对你的应用程序将产生什么影响？如果开设一个新办公室，应用程序的使用会受到影响吗？如果一个新的部门或分公司需要使用它呢？虽然这在短期内可能不会发生，但从长期来看这是可能的。如果你能对以下问题给出大致答案，你就能更快地对这些可能性做出反应。\n\
  \n-   是否需要额外的硬件？\n-   这会是迁移到更大的服务器的契机吗？虚拟机？集群？负载均衡环境？\n-   与供应商的许可协议是否需要修改？\n- \
  \  新用户需要重新培训吗？\n-   如果是，谁来培训？何时进行？\n-   是否需要在新用户的工作站上安装软件？\n-   如果是，谁来安装？何时进行？\n\
  \n## 30.8 输入和输出文件\n\n\n\n\n\n许多应用程序都会处理输入到应用程序或由应用程序创建并导出的文件。偶尔，这些过程的运行可能并不如预期。如果发生这种情况，则需要尽快纠正这种状况。之所以需要及时处理，是因为这些文件通常会驱动其他进程。例如，如果向人力资源应用程序中添加了新用户，他们可能会被包含在发送到薪资应用程序的文件中。如果该文件没有被正确创建、导出、接收和导入，那么新员工在薪资应用程序的下次运行时可能无法获得工资。\n\
  \n遗憾的是，当一个过程成功运行了很一段时间后，人们往往会忘记其具体工作方式的细节。如果这些过程没有良好的文档记录，那么可能花费时间来刷新机构记忆，以重新建立纠正问题所需的专业知识。\n\
  \n导入或导出文件过程出现问题的原因可能是由于列表中列出的简单情况：\n\n- 磁盘空间耗尽\n- 被使用的用户账户被禁用，可能是因为该用户离职或退休\n- 在台式计算机上运行的进程没有运行，是因为计算机未开启或已报废\n\
  - 数据库表发生细微变化导致 SQL 查询失效\n- 在修改表后，数据库视图被删除或未重建\n- 数据库中创建的索引不允许重复键值\n- 现有的 FTP 服务器不再可用\n\
  - 调度条目损坏\n- 调度条目被无意删除\n- 文件布局被创建它的进程所更改\n- 当进程应该运行时，创建文件的服务器未运行\n- 夏令时变化影响了一个地点但没有影响另一个\n\
  - 文件名不符合预期格式\n\n导出和导入过程的文档需要正在处理的文件细节。如果这些细节没有记录在文档中，那么每当发生问题，你在解决问题时学到的任何内容都应该添加到文档中。例如，文档中应包含以下细节：\n\
  \n- 正在导入或导出了多少文件\n- 文件的布局，例如，文件中所有字段及其各自的大小和数据类型\n- 文件的命名规范，包括文件扩展名\n- 文件（们）何时创建\n\
  - 创建或处理每个文件的进程名称\n- 每个进程在哪个账户下运行\n- 每个进程在何处运行（应用程序服务器、数据库服务器、Web 服务器、FTP 服务器、用户工作站）\n\
  - 如何调度进程？\n- 如果进程失败会发生什么？应该联系谁？\n- 如果预期的文件没有到达该怎么办？应该联系谁？\n- 如果输入文件有错误该怎么办？缺少字段、记录过长等。\n\
  - 如何处理重复文件，例如，如果昨天的文件而不是今天的文件到达了？\n- 处理重复文件会产生问题吗？\n- 如果收到了意外的文件会发生什么？\n\n## 30.9\
  \ 磁盘空间不足\n\n大多数应用程序都需要磁盘空间才能正常运行。这一泛化的例外包括嵌入式应用程序，但这类程序不是本书的主题。如果服务器上的可用空间降到最低水平，服务器性能可能会糟糕。它可能会导致应用程序不稳定、产生错误或运行极慢。在最坏的情况下，应用程序服务器本身可能会崩溃并拒绝重启。\n\
  \n你需要尽一切确保你的服务器永远不会达到这种情况。接下来的章节描述了为确保这一点可以采取的步骤。\n\n### 30.9.1 从底牌充足开始准备\n\n大多数应用程序在安装软件之前都有一个需要遵守的要求清单。不可避免的是，列出的项目之一引用了在安装操作系统、支持软件和应用程序本身`之后`\
  \ 可用的磁盘空间量。确保可用磁盘空间量达到或超过应用程序的要求。\n\n### 30.9.2 是什么在占用所有空间？\n\n作为管理员，你需要掌握应用程序服务器上在占用磁盘空间的情况。每隔一两周对服务器驱动器上的大文件进行搜索并不需要长时间。这样做几次后，你就会识别出磁盘空间流向了哪里。例如，它们是否被以下领域占用？\n\
  \n- 日志文件\n- 报告\n- 核心储（Core dumps）\n- 临时文件\n- 备份文件\n- 应用程序的旧版本\n- 修复或升级期间使用的下载文件\n\
  - 导入或导出文件\n- 大型报告\n\n服务器上异常巨大的文件可以删除吗？还是应用程序仍然需要它们？如果可以删除，你将如何操作？例如：\n\n- 在启动大文件搜索后手动删除\n\
  - 通过定期启动的脚本删除\n- 更好，它们可以由定期运行的脚本自动删除吗\n\n这里必须强调一个警告。驱动器上会有一些无法删除的大文件。例如，与操作系统和应用程序关联的可执行文件、库文件、当前的备份文件集。在删除文件之前，务必完全确认。\n\
  \n### 30.9.3 监控它\n\n你是否有一套监控服务器的流程？如果是，可用空间就是绝对需要监控的指标之一。如果没有，也应该增加这种能力，即使只是你编写的每天运行一两次的简单脚本。\n\
  \n当服务器磁盘空间不足时会发出警报吗？具体发出哪些警报？\n\n- 是否有不同类型的警报，例如警告与关键警报？\n- 谁会接收这些警报？\n- 警报是如何发送的？例如，通过电子邮件、短信或页面通知？\n\
  - 警报会发布几次？只发布一次，还是警报会持续发出直到情况消失？\n- 当可用空间恢复所需量时，会发出“恢复正常”的警报吗？\n\n你的监控流程是否提供了图表或报告，显示上个月、上周或昨晚有多少可用空间？保留这样的统计数据对于预测未来增长所需的磁盘空间非常有帮助。只需画出一条延伸使用趋势的线就可以告诉你可用磁盘空间何时耗尽。当然，这假设所有测量都是在\
  \ 30.9.2 描述的大文件被删除后记录的。\n\n## 30.10 灾难恢复 (DR) 计划\n\n每个应用程序都需要制定灾难恢复计划。这些计划需要说明如果生产设施或其大部分不再可用将发生什么。你希望自己永远不需要使用此计划，但你不能让希望成为你的灾难恢复计划。`第\
  \ 12 章`详细描述了灾难恢复计划，因此在此不再重复这些信息，请参考书的相应章节。\n\n## 30.11 扩容与缩减\n\n组织对应用程序的使用可能会在短时间内发生巨大变化。一些例子包括：\n\
  \n- 你的组织经历了合并或收购，而你的应用程序被选为保留的\n- 供应商发布了应用程序的新组件，你组织中的其他部门渴望开始使用\n- 出于成本措施，你的一半用户被裁员了\n\
  \n\n\n\n\n- 新政府法规已经实施，要求像你这样的这样的组织必须使用额外的控制措施。恰好，你的应用程序提供的正是这些控制措施。\n\n诚然，这种剧烈扩张或收缩需求的概率很小。在较长的一段时间内（比如一年或两年），应用程序的使用可能会发生显著变化，这是非常可能的。你是否知道在以下几个方面，扩展或收缩你的应用程序需要什么？\n\
  \n- 注册用户的绝对数量\n- 使用该程序的站点数量\n- 应用程序服务器所在的数据中心数量\n- 应用程序服务器中的处理器数量\n\n## 30.12 获取新电脑\n\
  \n无论对你还是对你的用户来说，获取新电脑都是会定期发生的事情。人们并不总是能意识到，这一事件会产生多大的干扰并耗费时间。除非你最近经历过这个过程，否则获取新电脑的劣端可能会让你感到意外。提前做一点计划可以显著减少迁移到新电脑可能引起的头疼问题。\n\
  \n### 30.12.1 重叠期\n\n在可能的情况下，尝试在开始使用新电脑后，保留旧电脑一段时间。我向你保证，旧电脑上会有某些你忘记迁移到新电脑上的东西。一周的重叠期是不错的，但两周会更好。如果可能，尝试将旧电脑保留到至少下个月初。你可能在每个月初会做某些你之前忽略了的事情。\n\
  \n### 30.12.2 旧电脑上有什么？\n\n迁移到新电脑的第一步是为你旧电脑上的软件创建一个清单（inventory）。这一步的执行起来可能比你想象的要困难，因为很容易忘记随着时间的推移，你的旧机器上加载了哪些内容。某些软件在你拿到它时就已经存在那里了，而另一些程序是在你使用的几个月或几年里被一个接一个添加进去的。\n\
  \n你或用户如何发现电脑上安装了哪些程序？获取此类列表有多种方法。这里列出了一些方法或工具：\n\n- 在 Windows PC 上，打开`控制面板 | 添加/删除程序`\
  \ 并查看列出的程序列表。\n- 在 Windows 电脑上，选择`Windows 图标` 然后点击“所有程序”。此时你看到的屏幕将显示已加载到电脑上的应用程序。\n\
  - 在命令提示符中，输入以下命令将创建一个包含 Windows 电脑上加载软件列表的文本文件：`wmic /output:Software_List.txt product\
  \ get Name, Version, Vendor, InstallDate, InstallLocation, PackageName`\n\n### 30.12.3\
  \ 在新电脑上加载程序\n\n一旦你确定了电脑上有什么，你就需要决定哪些内容需要加载到新机器上。仅仅因为某些东西加载了你的旧机器上，并不意味着它必须加载到新电脑上。你可能选择不加载它的原因包括：\n\
  \n- 它是当你收到机器时就已经加载在那的，而你从未用过它\n- 它是你不再需要的包\n- 你已经确定了更好的工具或实用程序来替换它\n- 旧电脑上的版本已经过时\n\
  - 你不再支持该程序运行所需的应用程序\n\n在开始向新电脑加载软件之前，你还需要对旧机器上运行的软件进行更进一步的研究。例如：\n\n- 你拥有哪些包的安装光盘？\n\
  - 哪些是从组织的网络驱动器之一安装的？\n- 哪些是从网站下载的？\n- 哪些程序是免费的，哪些是授权的？\n- 你是否有这些授权包的`License Key`（许可证密钥）？\n\
  \n我最近收到了一台新笔记本电脑并经历了这个过程。以下是我必须在上面安装的一些软件。这是我记得的列表，但很可能在此过程中遗掉了一两个包。\n\n- SQL Developer\n\
  - Oracle Client\n- 数据库驱动程序 (ODBC, JDBC, Oracle)\n- WinRar\n- FileZilla\n- Juniper\
  \ VPN\n- Process NT\n- Java Development Kit (JDK)\n- Notepad++\n- WinSCP—Windows\
  \ 安全复制程序\n- PuTTY\n\n### 30.12.4 个性化设置\n\n如果你像大多数人一样，在获得新电脑时，你希望它的设置与之前的那一个尽可能相似。人是习惯的生物，并希望能够以以前的方式来做事情。如果这个描述符合你的情况，那么这里是你可能需要在新电脑上设置的一些内容：\n\
  \n- 桌面图标\n- 如果没有预装，你最喜欢的互联网浏览器\n- 你的互联网浏览器中的书签或收藏\n- Outlook 或其他电子邮件软件包中的个人文件夹文件\n\
  - 电子邮件软件包中的联系人列表\n- `Oracle tnsnames.ora` 文件\n- 你在`Windows 任务调度器`或其他调度工具中设置的任务\n\
  - 你定义的本地打印机\n- 你映射的网络驱动器\n- `ODBC`（开放数据库连接）`DSNs`（数据源名称）\n- 你的应用程序或连接的密码。你知道所有这些密码吗？如果不知道，你如何恢复它们？新电脑的\
  \ IP 地址会相同吗？这重要吗？\n- 右键点击文件时“发送到”选项中的目标\n- 电脑启动时启动的应用程序\n- Windows 资源管理器如何显示文件、文件夹。例如，是否显示已知文件扩展名？标题栏中是否显示完整路径？是否显示缩略图？\n\
  \n### 30.12.5 培训时间\n\n如果你像大多数人一样，在获得新电脑时，你可能也会获得一些新软件。无论是什么新软件，你都需要时间才能像以前熟悉的软件那样变得熟练。在估算获取新电脑的影响时，请务必将熟悉新软件所需的时间考虑在内。\n\
  \n\n\n\n\n-   当前的应用程序提供了更先进的技术，例如，它们支持移动设备或自带设备（BYOD）模式\n-   其功能正在与另一个应用程序合并，可能是由于合并或收购\n\
  -   供应商不再对其提供支持\n-   供应商已被收购，你对新所有者支持该应用程序的长期意图表示严重怀疑\n-   对于你所获得的内容，供应商的维护费用和持续许可成本被认为高得无法接受\n\
  -   运行该应用程序的定制硬件已经老旧且无法维护\n-   维护该应用程序的 IT 技能已不再可用\n-   维持其运行正在消耗大量的 IT 资源\n-  \
  \ 它不安全，而且使其变得安全并不可，或者成本高得离谱\n-   组织正在迁移到 `ASP` 或 `SaaS` 托管环境，可能来自同一家供应商\n-   组织希望迁移到云端实现方案，而当前的软件包与该架构不兼容\n\
  \n## 31.2 谁拥有最终决定权？\n\n决定是否停用某个应用程序的个人或小组不太可能是`应用程序管理员`（Application Administrator`）。这项权力属于支付账单、实际使用应用程序并从中获得价值的群体。`业务所有者`（Business\
  \ Owner`）是最有可能做出此决定的个人或群体。最初决定引入该应用程序的可能是他们。该程序属于他们，而且他们正在付费，因此由他们拥有决定何时该抛弃它的权力是合理的。\n\
  \n支持该应用程序的团队（包括`应用程序管理员`）在技术上可以发挥作用，但不做最终决定。他们可以根据经验和行业最佳实践提供建议和方案。例如，他们可以就以下领域提供建议：\n\
  \n-   就用什么来替换应用程序提供建议\n-   提供维护现有应用程序的成本估算\n-   提供停用该应用程序需要完成的任务列表\n-   提供退休应用程序的时间表\n\
  \n## 31.3 数据如何处理？\n\n与停用应用程序相关的最复杂的因素或许是：数据将如何处理？以下章节描述了处理退役应用程序数据的常见选项。\n\n###\
  \ 31.3.1 需要保留哪些数据，以及保留多久？\n\n在做出对如何处理数据的决定之前，你需要知道是否有任何法律义务必须保留它。如果没有政府的规则或法规，你的选择将更加灵活。\n\
  \n保留数据的法律义务是一个复杂的迷宫。仅美国的规则就极其复杂。每个政府机构，例如`IRS`、`OSHA`、`EPA`、`商务部`、`海关`似乎都有自己的保留计划。如《萨班斯-奥克斯莱法案》（`Sarbanes-Oxley\
  \ Act`）或`HIPAA`等主要法案具有独特的保留计划。为了确保你获得准确、最新的信息，你需要咨询该领域的专家。\n\n不同类型的数据需要保留多久？这里列了一些示例，但请注意这些只是概括。此外，你必须意识到法规可能在几乎一夜之间发生巨大变化。不要根据此处列出的时长做出任何决定。等这本书印刷时，这些时长可能已经不再准确。\n\
  \n-   公司注册文件——永久\n-   合同——7 年至永久\n-   业务记录，例如：作废支票、工资支票、银行对单、发票——6 年\n-   工资记录——3\
  \ 年\n-   与《公平劳动标准法》（Fair Labor Standards Act）相关的文档——至少 3 年\n-   员工记录——3 年\n-   审计记录——审计后\
  \ 7 年\n-   《家庭与医疗假法》（Family and Medical Leave Act）——至少 3 年\n-   关税记录——自进口货物缴纳关税之日起\
  \ 5 年\n-   `OSHA`相关记录——事故报告事故后 5 年\n-   移民`I-9`表格——聘用后 3 年或雇佣结束后 1 年，以较晚者为准\n\n\
  如果你的组织在多个国家开展业务，那么同一份数据在每个国家可能有完全不同的保留要求。在做出删除任何数据的决定之前，你需要咨询每个国家的法律专家。即使没有法律的约束，可能也有非常充分的业务理由希望在一段时间内保留这些数据。\n\
  \n### 31.3.2 从现有系统中提取数据\n\n从技术角度来看，从现有应用程序的数据库中提取数据可能是困难的。支持应用程序的数据库通常规模很大，包含大量数据，并由许多（可能是成百甚至上千个）表组成。它们的设计是为了灵活性并尽可能减少数据重复，而不是为了易于理解。\n\
  \n如果你需要从现有应用程序中提取数据，这是可以，但绝非易事。这里列出了实现此目标的选项。这些选项按偏好程度从高到低排序。\n\n-   最佳选项是应用程序具有导出功能，允许对数据进行逻辑分组导出。如果存在此功能，那么它应该是你提取数据列表顶部的方案。在运行此实用程序时，尝试尽可能广泛和深入地获取数据。我的意思是，如果可能，包含所有与对象相关的所有列。通过“深入”，我的意思是不过滤掉任何行，即包含所有日期、所有国家、所有部门、所有状态等。你想要尽可能地导出可能的每一行数据。\n\
  \n-   如果应用程序有报告包，你就可以可以使用它来创建抓取你所需数据的报告。报告软件（特别是当它具有拖放式界面时）很可能在逻辑层面而非物理层面呈现数据。这意味着你不需要理解数据库表是如何关联的，因为报告包已经内置了这些逻辑。首选输出文件类型将是`CSV`或制表符分隔文件。如果可能，从报告中排除页页眉、列标题、页码、报告创建日期等。这些多余细节在文件被作为替换应用程序的输入之前，需要被剔除。\n\
  \n-   如果上述两个选项不可用，下一个最佳选项是编写`SQL`查询直接从数据库选择数据。这假设数据库是基于关系模型构建的，你拥有如`SQL*Plus`或`Toad`之类的工具，并且你拥有连接到数据库的账户。在编写从数据库提取行的查询之前，你必须花些时间在表中摸索，以便对每个表中的内容有一个基本的了解。查看是否存在解释主要表及其关联性的文档是有的。\n\
  \n-   屏幕抓取（Screen-scraping）指的是一种程序读取另一个程序的输出或“屏幕”的技术。从屏幕上读取（即“抓取”）的数据可以保存到文件或数据库中。屏幕抓取程序经常用于连接到大型主机的旧“绿屏”终端。在\
  \ PC 或图形工作站上编写屏幕抓取程序来提取数据是复杂的但可行的。由于开发能够正确抓取的软件需要大量时间和精力，这是提取数据最不理想的方式之一。\n\n###\
  \ 31.3.3 数据将迁移到另一个应用程序吗？\n\n\n\n\n\n如果需要将现有应用程序中的数据迁移到新应用程序，那么您应该考虑在发送给感兴趣提供新软件的潜在竞标者的\
  \ `RFP`（征求书）中包含此项需求。如果提供新软件的供应商具有数据迁移的经验，那么他们可能有可用的工具来完成此工作。他们可能对您要停役的特定应用程序也有经验。通过将此活动委托给新供应商，您可以避免从头造轮子。\n\
  \n如果所选定的供应商在这一领域没有经验，那么您将需要确定如何从当前应用程序提取数据并导入新应用程序。第 31.3.2 节 中提出的选项至少应该被考虑。\n\n\
  ### 31.3.4 保持数据可访问性\n\n如果数据没有迁移到替换应用程序，如何保持其可访问性？一些选项包括：\n\n- 将数据保留在 `CSV`（逗号分隔值）文件中，如果这些文件是从原始应用程序导出的。`CSV`\
  \ 文件可以使用编辑器或如 `Microsoft Excel` 的电子表格程序打开。使用编辑器进行基础搜索，但更复杂的搜索很难通过该工具完成。\n- 将 `CSV`\
  \ 文件转换为电子表格文件。用户经常使用电子表格，因此对该工具的熟悉程度可能很高。缺点是某些电子表格程序对处理的行数有限制。如果您的数据集超过了电子表格的限制，可能需要将文件分成多个部分。这对您和用户来说都是方便的。\n\
  - 创建一个简单的数据库并将数据导入其中。有很多数据库引擎提供免费版本（`MySQL）、`SQL Server` 或 `Oracle`）。如果数据库提供了图形化报告工具，您的用户就可以筛选、排序并搜索数据内容。\n\
  \n### 31.3.5 数据存档\n\n如果数据必须保留但不需要在线，那么可以进行归档处理。归档数据时需要考虑的一些问题是：\n\n- 您的组织是否有处理归档数据的存储管理团队？如果是，您应该从一开始就让他们参与。\n\
  - 数据在存档时是否需要压缩？这可以大幅减少存储的数据量。如果应用了压缩，您如何保证解压缩算法在未来仍然可用？\n- 数据在存档时会被加密吗？这是法律要求、组织政策还是偏好？如果是，您如何保证解密算法在未来仍然可用？在哪里以及如何存储解密文件的密钥？谁负责密钥？如果密钥丢失或损坏，有什么替代方案？\n\
  - 使用什么介质来存档数据？示例包括磁带、硬盘、DVD 或闪存卡。\n- 没有任何物理存储介质是永久的。所选介质在变得不可靠之前可以使用多久？\n- 所有存储介质技术最终会被取代。随着新技术的普及，旧技术会过时。如果您的数据存储在即将过时的介质上，它会被迁移到新的介质吗？5\
  \ 或 10 年后还会记得这样做吗？还是您会在某天醒来发现所有数据都在无法读取的技术上？\n- 存档数据需要是只读格式吗？所选介质是否允许或强制执行这一点？\n\
  - 文件格式需要保留哪些文档？\n- 介质将存储在哪里？内部？还是专门的数据长期存储的公司？\n- 组织中的人员如何得知数据已存档？\n- 如果有人需要访问存档数据，他们如何操作？是否有创建和履行此类请求的正式流程？\n\
  \n一个建议是在介质创建后后立即验证其是否可以读取。如果创建存档副本出现问题，您希望越早越好。通过验证可以访问存档介质，至少可以确保它是正确创建的。\n\n##\
  \ 31.4 停止应用程序的步骤\n\n如果应用程序将用另一个软件包进行替换，那么停止它的时间将很大取决于新应用程序何时可用、安装、测试并通过验证。请确保您的计划具有灵活性，因为替换应用程序可能甚至可能无法按时交付。\n\
  \n需要记住的一点是，您不仅在停用生产应用程序，还在关闭并停用应用程序环境中的任何测试服务器、开发服务器、灾备（DR）服务器和质量保证（QA）服务器。关闭生产服务器时执行的许多步骤需要在其他服务器上重复。\n\
  \n### 31.4.1 备份所有内容\n\n备份您能想到的与应用程序相关的所有内容。如果您永远不需要它，那么损失也有限。这包括：\n\n- 数据库\n- 执行\
  \ `SQL query` 列出数据库中的所有表，以及每个表中的列名、数据类型等。获取每个表的行数也很有用。如果您不知道如何操作，请让您的 DBA 帮助您。\n\
  - 源代码（如果您有的话）\n- 设置文件、配置文件、`ini`（初始化）文件等。\n- 供应商提供的文档\n- 您、您的同事或前任同事编写的任何文档\n- 脚本或批处理文件\n\
  - 日志文件\n- 记录应用程序宕机时间的事件报告\n- 打印服务器上所有的系统和环境变量\n- 使用哪些账户访问应用程序，特别是 `Application Administrator`\
  \ 账户？\n- 使用哪些账户访问数据库？\n- 运行 `netstat` 命令列出服务器上所有的开放端口\n\n### 31.4.2 记录每一步\n\n当您处于关闭应用程序的过程中，建议记录过程中的每一步。您可能永远不需要它，但拥有一份所做操作的记录是个好意。\n\
  \n如果您在关闭第一个环境（例如开发服务器）时编写此文档，那么在关闭下一个环境（例如测试服务器）时就可以使用（并改进）它。\n\n\n\n\n\n- 应用程序创建的输出文件需求是否仍然存在？如果是，那么新供应商需要了解这一要求。需求文档中应该提供一个输出文件的示例。\n\
  - 如果没有购买新软件来替代已退用的应用程序，那么需要有人来确定在没有该软件的情况下将如何创建输出文件。\n\n### 31.4.4 禁用任务\n\n如果应用程序要求在应用程序服务器、报告服务器、数据库服务器、ftp\
  \ 服务器或任何其他服务器上调度任务，那么这些调度任务需要被禁用或完全删除。可能已经调度的任务示例包括：\n\n- 创建备份的进程\n- 删除旧日志文件的任务\n\
  - 创建输出文件以提供给另一个应用程序或系统的进程\n- 接收输入文件并将其导入应用程序的进程\n- 监控应用程序服务器的任务\n- 创建的报告\n\n不同的服务器可能运行着不同的调度软件包。例如，Linux\
  \ 或 UNIX 服务器可能将使用 `cron` 来调度其任务。Windows 服务器可能使用 `Task Scheduler`（任务计划程序）。该组织可能会使用如\
  \ `Control-M` 这样的企业级调度软件包。在搜索调度任务时，务必查找所有这些类型的调度器以及可能在它们上运行的任务。\n\n### 31.4.5 开始省钱\n\
  \n一旦应用程序退用，你就希望确保你的组织不再支付不必要的开支。确保你的应付账款部门知道在特定日期之后不要支付此应用程序的任何发票。软件供应商收取的任何年度许可费、维护费或咨询费的任何付款都应直接拒绝，或至少在支付前进行调查。\n\
  \n### 31.4.6 转售你的许可证\n\n你与供应商签订的合同允许你将许可证转售或分租给其他组织吗？如果合同允许（或至少没有禁止），那么你应该判断这是否值得追求。现实可能是这样做是合法的，但在经济上并不可行，但至少值得考虑这种可能性。\n\
  \n## 31.5 应用程序不是孤岛\n\n即使退用的是你的应用程序，当应用程序退休时，受影响的也不只有你这一个群体。你组织中的许多其他小组在应用程序退用时必须进行某些更改或至少收到通知。以下是你应该考虑通知的小组或团队示例：\n\
  \n- **DBA 团队**——将停止数据库并在必要时将其删除。这将释放数据库服务器上的 CPU 周期和内存以及磁盘空间。\n- **安全团队**——将关闭为了允许应用程序与网络其他服务器通信而开放的端口。\n\
  - **备份团队**——不再需要对应用程序服务器（s）以及可能的数据库服务器进行备份。任何发送的记录备份结果的报告都可以停止。\n- **监控团队**——不再需要监控应用程序服务器（s），因此监控团队可以从他们的列表中删除这些服务器。\n\
  - **消息团队**——将应用程序服务器（s）从他们用于接收和转发消息的服务器列表中删除。\n- **防病毒团队**——将知道他们可以停止更新应用程序服务器（s）上的防病毒定义文件。\n\
  - **系统管理员**——将要么退用服务器或将其重建以便用于其他应用程序。如果服务器已达到使用寿命并被废弃，这可能会释放一些机架空间。至少，他们可以关闭服务器以节省电力和空调，直到服务器被其他任务需要。\n\
  - **VM 团队**——将删除虚拟机。\n- **DNS 团队**——将删除专门为此应用程序创建的任何 DNS 条目。\n- **SAN 团队**——将释放给此应用程序服务器的\
  \ SAN 驱动器上的空间。\n- **更新团队**——控制何时向服务器推送更新或补丁的团队可以将你的服务器从需要更新的机器列表中移除。\n- **VPN 团队**——如果你的用户不再使用\
  \ VPN 访问组织网络，那么他们可以从授权列表中移除。此更改可能不适用，因为所有用户可能都需要保留其 VPN 账户，以便访问网络和其他应用程序。\n- **AD\
  \ 团队**——是否可以从活动目录（Active Directory）数据库中删除应用程序的任何用户？同样，此更改可能不适用，因为所有用户可能都需要保留其 AD\
  \ 凭据以访问网络和其他应用程序。\n- **培训团队**——培训团队是否可以关闭退用应用程序的任何 LMS（学习管理系统）课程？\n- **服务台（又称帮助热台）**——需要被告知不再处理该应用程序的请求。如果他们接到有关已退用应用程序的电话，他们应该告知来电者该应用程序已不再运行。\n\
  - **DR（灾备恢复）设施**——如果你的应用程序有一个 DR 服务器或多台服务器，它们也可以被退用。这可能会释放一个或多台可用于其他应用程序的服务器。退用的应用程序还应该从在\
  \ DR 设施激活时需要启动的应用程序列表中移除。在 DR 设施中启动一个没有运行生产版本的应用程序是没有意义的。\n- **审计员**——将不再需要审计你的应用程序。当然，他们可能需要审计退用过程，但在之后他们可能就完成了对该应用程序的工作。\n\
  - **用户工作站**——此应用程序是否要求在用户工作站上安装任何软件？如果存在此类软件并需要移除，下一个问题是用户是否能够移除它。某些组织“锁定”用户工作站，使用户无法在上面加载或卸载软件。根据用户是否有权限，你需要发送明确指令告诉用户如何删除，或与桌面软件团队协调由他们删除软件。\n\
  \n## 31.6 文档\n\n应用程序退用对文档将产生什么影响？可能需要更新的文档示例包括：\n\n- 引用退用应用程序的 DR 文档需要更新以移除这些引用。或者，你可能需要用替换系统的详细信息更新它。\n\
  - 帮助台用于响应有关应用程序问题的操作手册（Playbook）需要更新。至少，帮助台应该应该知道该应用程序已不再运行。\n- 显示谁拥有应用程序访问权限的文档需要更新以反映此应用程序的终结。\n\
  - 组织维护的显示每个应用程序联系人的电话列表应编辑以移除退役的应用程序。移除这些引用消除了在半夜意外拨打电话的风险。\n\n为应用程序编写的任何文档是否需要进行长期或永久存储？如果是，它需要纸质副本还是可以存档电子副本？这个答案可能由法规、规则或法律规定。\n\
  \n## 31.7 安全\n\n此应用程序是否有任何安全影响？例如，它是否包含：\n\n- 你的组织认为敏感或机密的内容？\n- 组织认为是专有的信息？\n-\
  \ 客户、客户、员工、投资者、患者的 PII（个人身份信息）？\n\n\n\n\n\n- 是否需要专用的服务账户来运行计划任务或作业？如果应用程序下线，是否可以删除任何服务账户？\n\
  - 是否要求用户必须拥有特定的网络凭据才能访问该应用程序？如果应用程序停用，是否可以撤销任何用户的网络凭据？\n\n如果应用程序确实包含安全数据，则必须额外考虑文件、服务器或驱动器的处置方式。例如：\n\
  \n- 如果所有磁盘文件及其包含的数据从文件创建时起经过了加密，那么当文件被删除或驱动器停用时，从驱动器中提取数据的危险将大大降低。目前有某些驱动器可以在数据写入驱动器时加密，并在从驱动器读取文件时解密。如果安全性是该应用程序的主要考虑因素，应该采用自动加密文件的磁盘驱动。\n\
  - 大多数精通技术的人都意识到，当文件从计算机硬盘中删除时，数据并不会真正消失。实际发生的是 `File Allocation Table`（`FAT`）中的条目发生了更改，指示之前分配给该文件的磁盘扇区（区域）现在可以分配给另一个文件。扇区的内容从未被真正移除。现在有许多现成的实用程序可以恢复被“删除”的文件。\n\
  - 防止删除的文件稍后被读取的一种方法是使用随机的 01 模式反复覆盖其扇区。这里的原理是，完成此操作后，将无法检测到原始值的“影子”图像。实现这一目标有几种方法：一种是购买内置这种特定功能的磁盘驱动器；另一种是使用具有相同加载和使用实用程序。\n\
  - 关系型数据库系统使用物理硬盘和文件来包含它们操作的逻辑表。如果数据库没有使用加密来保护数据，那么删除数据库时释放的任何磁盘空间都可能被研究，并可能暴露其持有的机密数据。如果没有执行加密，在删除数据库时，应将反复写入随机的\
  \ 01 过程视为一种安全措施。\n- 从下线的应用程序中提取的数据如果被导入到新系统，也需要受到保护。提取文件在导入到替换应用程序之前需要进行加密。到那时，提取文件需要被删除，并通过在文件扇区上反复写入随机的\
  \ 01 来妥善遮蔽。\n- 如果没有替换系统且数据正在归档，则数据需要是安全的。存档文件应使用目前认为不可破解的加密算法进行加密。另一个想法是，今天被认为不可破解的内容在\
  \ 5 或 10 年后可能会被轻易破解。如果你的数据要长期归档，你可能需要在未来的某个日期使用那时最先进的算法重新加密。\n\n## 31.8 释放服务器\n\n\
  一旦应用程序下线，服务器（们）将如何处理？如果它们相对较新，可以在组织内重新用于另一个应用程序。如果它们已达到或接近其使用寿命终点，那么保留它们可能没有意义。如果应用程序运行在虚拟服务器上，那么物理服务器可能会留在原位以托管其他虚拟服务器。\n\
  \n如果有任何硬件要处置，你将希望确保以符合生态环保的方式进行。将其倾倒在填埋场或运往监管更宽松的第三世界国家是不够的。计算机包含重金属，如果处置不当，这些金属会成为严重的污染物。短期内节省的几美元，如果你对环境法规的缺乏关注被揭露，将来可能会造成巨大的尴尬。\n\
  \n其他选项是将你的闲置硬件捐赠给非营利组织。在这样做之前，需要处理两个关注点：\n\n- 磁盘驱动器是否已经充分清理？如果没有这样做，就存在丢失公司信息的风险。请参见前面的章节，该章节描述了通过向磁盘扇区反复写入随机的\
  \ 01 以使删除的文件无法恢复的实用程序。\n- 在将任何服务器捐给非营利组织之前，你需要确保留在它们上的任何软件都可以合法地转让。例如，如果你的组织许可了文字处理程序的副本，那么将服务器转让给另一个组织可能会违反你的许可协议。\n\
  \n## 31.9 替换应用程序\n\n如果现有应用程序正被新软件替换，那么在你的下线过程中将会有额外的考虑因素。其中一些点在接后的章节中描述。\n\n###\
  \ 31.9.1 最后的细节\n\n你是否需要从现有应用程序中提取并保留任何额外信息？例如：\n\n- 目前可以使用该应用程序的所有用户列表。这可能用于设置替换应用程序。\n\
  - 用户在替换系统中会使用相同的 ID 和密码登录吗？如果这是要求的，你将必须从现有系统导出这些信息。\n- 现有系统中定义的安全组列表。\n- 每个用户被分配的组。\n\
  - 已开发或修改的自定义屏幕的截图。\n- 应用程序实施的工作流步骤，包括在过程的每一步中谁负责或授权推进任务。\n- 由你的团队或用户编写的自定义报告。\n\
  - 所有报告计划发送的日期和时间。\n- 发送给用户的每个报告的列表。\n- 自定义图标或背景。\n\n### 31.9.2 维护退出的系统\n\n新应用程序并非一夜之间就到的。以下每一步都需要时间：\n\
  \n- 研究其他其他可用的软件包\n- 开发并发送 `RFP`（`征求书`）\n- 检查收到的提议\n- 选择最佳方案\n- 谈判合同\n- 使 `COTS`（`现成软件`）软件根据你组织的需求进行定制\n\
  - 安装\n- 加载数据\n\n在进行所有这些操作时，现有应用程序正在发生什么？具体来说，在此过程中是否对当前软件应用了更新或补丁？每种可能的答案都有其优缺点。\n\
  \n- 如果对现有应用程序进行更改，那么替换系统将被迫追逐一个移动的目标。\n- 另一方面，会有某些更改是必须的。影响安全的补丁需要安装。为了完成工作所需的修复补丁需要应用。\n\
  \n## 31.10 新应用程序的用户验收测试\n\n作为现有应用程序的应用程序管理员，即使你没有参与新应用程序的选择、采购或安装，也会对你产生一些影响。至少，当前应用程序的经验丰富的用户可能会参与新软件的测试。这可能意味着一段时间内，经验较少的用户将使用现有系统。这可能会导致你面临更多问题，或者被证明是由用户错误导致的\
  \ bug 报告。如果真的发生了，请确保你非常有耐心。\n\n\n\n\n\n你很可能会遇到关于当前应用程序如何运作的详细问题。这通常意味着有人遇到了在 RFP（需求征询书）或定制阶段未被解决的情况。他们想看到它在现有系统上是如何运行的，以确认替换系统是否能够正确处理这些情况。显然，你需要以最专业的态度来处理此类问题。\n\
  \n## 31.11 并行测试比平行停车还难！\n\n在现有应用程序仍在运行的同时测试新应用程序被称为并行测试。这可能是确保新系统从相同输入中产生与现有软件相同结果的最佳方法。遗憾的是，要妥善执行并行测试并不容易。它需要以下条件：\n\
  \n- 当并行测试开始时，两个应用程序中的数据库在功能上必须完全相同。这本身就不是容易实现的。\n- 必须在大致相同的时间向两个系统输入相同的输入。这适用于数据馈送和手动输入的数据。负责数据输入的小组将承担比平时多倍的工作负载。如果每天向系统输入大量数据，这可能会变得难以应付。\n\
  - 输入两个系统中的手动输入数据必须完全一致。如果两个系统输入的数据不匹配，可能会导致输出的数据文件或报告出现差异。这很容易导致人们去调查新系统中的潜在问题，结果发现这些问题归因于数据输入活动的不一致。\n\
  - 系统的输出（即输出的数据馈送和报告）必须进行比较以确保它们是完全相同的。如果这些比较可以自动化，那就太棒了。如果没有，就必须手动完成。\n\n## 31.12\
  \ 重新上线应用程序\n\n是否存在这种可能，即以后还需要该应用程序？不要笑并立即说“不”。奇怪的事情比有发生。为了保险起见，在新的系统显然能够如描述那样工作，并且没有最后一刻需要退回到已拆用的应用程序之前，你不应该拆除当前的软件或硬件。\n\
  \n# 第 32 章：每个应用程序管理员都应该知道的事情\n\n## 摘要\n\n本章列出了每个管理员都应该知道的事项。意识到这些项目将提高你的工作能力。\n\n\
  ### 关键词\n\n了解应用程序；文件类型；文件关联；隐藏文件；大小写敏感；行尾符；管道；重定向；测试基础；基础 SQL；Excel 的高级用法；URL；XML\n\
  \n无论支持的是哪种类型的应用程序，每个应用程序管理员都应该了解某些事情。你最终会发现它们的，因为你可能会发现自己不断地遇到它们。提前了解它们可能会让学习过程变得轻松一点点。\n\
  \n## 32.1 了解应用程序！\n\n并不是所有人都会同意这一观点，但我认为对你所支持的应用程序有良好的工作知识是非常重要的。你不需要成为专家，但应该对它的功能有透理解。你应该了解的某些示例包括：\n\
  \n- 你能用一或两句话总结该应用程序为公司做了什么吗？例如，它是在向客户发送发票、为供应商准备支票、进行预算预测，还是跟踪法律合同？\n- 该应用程序在一年中是否有某些时间段会被频繁使用？你知道这些时期何时发生以及为什么吗？\n\
  - 在与用户社区成员交谈期间，你是否理解他们使用的大多数常用缩写或技术术语？\n- 你知道在安装该应用程序之前，用户是如何完成这些工作的吗？\n- 如果用户列出一份关于改进应用程序的“愿望清单”，你能预测出他们的任何愿望吗？\n\
  - 如果用户解释了到达发生错误的屏幕所需的步骤，你是否会对如何重现他们的步骤有很好的理解？\n\n如果你还没有这种水平的知识，请与一位更有经验的用户协调，和他们坐在一起学习。他们几乎都会乐意提供帮助，因为他们知道你越了解该应用程序，你就越能支持好它。\n\
  \n## 32.2 文件\n\n文件将贯穿你的工作生活。你将不断地加载、比较、创建和删除它们。为了尽可能提高效率，你希望在处理文件时尽可能掌握许多技巧。我不能说我知道每一个技巧，但以下章节应该为几乎所有人提供一些建议。\n\
  \n### 32.2.1 文件名和位置\n\n文件不是抽象的。它们存在于某个驱动器上并有一个名称。关于文件，你需要了解的几点是：\n\n 全 全限定文件名是引用文件的一种方式，它包含了文件所在位置完整路径。当指定了全限定文件名时，它只能指向单个文件。在\
  \ `UNIX` 或 `Linux` 计算机上，这将包括从根目录开始的路径名，例如 `/Examples/Chapter32/this_file.txt`。对于\
  \ Windows 文件，将包含驱动器号，例如 `C:\\Examples\\Chapter32\\this_file.txt`。\n- 符号链接（symbolic\
  \ link）是指指向另一个文件系统的对象。符号链接的目标可以是文件夹也可以是文件。这一功能在 `Linux`、`UNIX` 和 `Windows` 计算机上均可用。使用符号链接的一个性为了灵活性。文件夹或文件可以移动到另一个服务器上更大或更快的驱动器上。只要更新链接以反映新位置，任何引用它的个人或程序都不会知道发生了变化。\n\
  - 通用命名规范 (`UNC`) 是一种用于跨局域网 (`LAN`) 映射网络驱动器的命名规范。格式为 `\\\\server\\share\\file_path`。例如，`\\\
  \\FileServer1\\D$\\Accounting\\.`。\n\n### 32.2.2 文件类型\n\n文件类型极其多样，早晚你可能会遇到大多数类型。这里简要描述一些较常见的类型。没有任何列表可以包含所有的文件类型，因为新类型正在被定期创建。此外，没有什么能阻止应用程序开发者随机选择一组字母并将其作为新的“标准”文件扩展名。\n\
  \n- `7z`——由 `7-Zip` 压缩工具使用的压缩文件。\n- `bat`——批处理文件，经常出现在 `Windows` 计算机上。它包含启动批处理文件时将执行的命令。\n\
  - `cab`——机箱文件（cabinet files）是 `Microsoft` 通常用于安装的一种压缩文件形式。\n- `cmd`——命令文件，又称批处理文件，包含在初始化或启动时将执行的命令。\n\
  - `csv`——逗号分隔值文件经常用于存储数据。可以使用文本编辑器打开它们。`Microsoft Excel` 也能以电子表格格式打开并显示它们。\n- `evt`——`evt`\
  \ 文件用于保存来自 `Microsoft Event Viewer` 实用工具的事件列表。\n- `ear`——“企业归档”（Enterprise ARchive）文件被\
  \ `Java` 用于在单个归档中包含多个文件。\n- `html`——超文本标记语言是用于创建网页的主要标记语言。网络浏览器（例如 `Internet Explorer`、`Firefox`、`Safari`\
  \ 和 `Chrome`）解释这些文件并将其渲染成用户看到的屏幕。\n- `iso`——`ISO` 文件是光盘的镜像，即 `DVD` 或 `CD`。`ISO`\
  \ 文件经常用于下载软件或补丁。\n- `jar`——`Java 归档文件用于聚合和压缩多个 `Java` 类文件和其他相关文件。\n\n\n\n\n\n- `mdb`—Microsoft\
  \ Access 使用的数据库文件，特别是 2003 及更早版本。\n- `mime`—多用途互联网邮件扩展——一种用于电子邮件的类型类型。\n- `msi`—MSI\
  \ 文件用于 Microsoft Windows 安装程序安装软件。\n- `pdf`—便携文档格式文件，用于创建独立于特定计算机硬件和操作系统的文档。该文件类型由\
  \ Adobe Systems 开发。\n- `ppt`—用于创建演示文稿的 PowerPoint 文件。\n- `rar`—由 WinRAR 压缩和归档工具创建的压缩文件。\n\
  - `tar`—磁带存档文件是由 UNIX `tar` 命令创建的压缩文件。\n- `xls`—Excel 表格文件。最新版本的 Excel 创建的文件扩展名为\
  \ `xlsx` 的文件。\n- `xml`—可扩展标记语言——许多应用程序使用 `XML` 文件作为输入或存储配置细节。\n- `zip`—由 `Zip` 或\
  \ `WinZip` 压缩工具创建的压缩文件。\n\n### 32.2.3 文件类型与程序之间的关联\n\n在 Windows 计算机上，当您双击文件时，与该文件类型关联的程序将开始执行并打开双击的文件。例如，如果您双击一个名为\
  \ `my_notes.txt` 的文件，通常 `Notepad` 会启动、运行并打开该文件。有许多文件类型与特定的程序或操作相关联。某些关联是在操作系统加载时设置的，另一些则由应用程序添加。如果\
  \ Windows 不识别该文件扩展名，将提示您选择与该扩展类型关联的程序。\n\n即使文件类型已与某个程序关联，您也可以强制使用不同的程序打开它。在 Windows\
  \ 资源管理器中右键点击该文件，并选择`打开方式`菜单选项。子菜单将显示一个备用程序列表。选择您想要用于打开文件的程序即可。\n\n#### 32.2.3.1\
  \ 列出文件类型关联\n\n查看文件扩展类型列表以及每个文件类型关联的程序的步骤在每个版本的 Windows 上似乎有所不同。将执行以下步骤：\n\n- 点击`开始`按钮并点击`控制面板`链接打开`控制面板`\n\
  - 点击`文件夹选项`选项卡\n- 点击`文件类型`选项卡。\n\n列表框将包含每个扩展名及其关联的程序。图 32.1 是`文件夹选项`窗口的截图。要查看扩展名的更多详细信息，请选择它。\n\
  \n![image](img/F000327f32-01-9780123985453.jpg)\n\n图 32.1 文件夹选项窗口。\n\n还有通过命令行查看文件关联的方法。该过程涉及两个命令。\n\
  \n1. `assoc`—此命令显示与每个文件扩展名关联的文件类型。\n2. `ftype`—此命令显示当双击特定文件类型的文件时将打开的程序。\n\n图 32.2\
  \ 显示了一个带有这两个命令输出的命令提示符窗口。这两个命令的输出都很很长，因此它们被传递给 `find` 命令以过滤掉不需要的输出。`assoc` 命令显示四个文件扩展名与\
  \ `txtfile` 关联绑定。`ftype` 命令告诉我们，与 `txtfile` 关联的所有文件扩展类型都会启动 `Notepad` 程序并打开双击的文件。\n\
  \n![image](img/F000327f32-02-9780123985453.jpg)\n\n图 32.2 文件关联的命令提示符选项。\n\n####\
  \ 32.2.3.2 将文件类型与程序关联\n\n如果文件类型当前未关联程序，有多种方法可以创建关联。最简单的方法是在 Windows 资源管理器中右键点击文件并选择`打开`选项。系统将弹出一个屏幕，询问由计算机决定使用什么程序，还是您可以从程序列表中选择打开文件的程序。如果您选择自己做决定，可以从现有程序列表中选择，也可以浏览以查找另一个程序。\n\
  \n如果您是硬核命令行用户，则可以使用 `assoc` 完成此关联。例如：\n\n```\nassoc mylog\n```\n\n#### 32.2.3.3\
  \ 取消文件类型关联步骤\n\n有时您需要移除文件类型与程序之间的关联。一种方法是使用如图 32.1 所示的`文件夹选项`窗口。选择扩展名后，可以移除关联。要执行此操作，请输入：\n\
  \n```bash\nassoc .doc\n```\n\n#### 32.2.4 访问其他计算机上的文件\n\n会有很多需要访问另一个服务器上的文件。快速访问此类内容的方法是通过\
  \ Windows 资源管理器，并在地址栏中输入 `\\\\app02\\d$`。图 32.3 显示了该字段的样式。\n\n![image](img/F000327f32-03-9780123985453.jpg)\n\
  \n图 32.3 访问另一计算机上的文件。\n\n将文件从一个服务器移动到另一个服务器的另一种简单方法是使用许多程序（如 `Notepad`、`Microsoft\
  \ Word` 和 `Microsoft Excel`）内置的`另存为`功能。这种技术甚至可以用于电子邮件附件的文件。图 32.4 是演示如何执行此技术的截图。要将文件保存到服务器\
  \ `app02`，请遵循以下步骤：\n\n1. 在 `Notepad`或其他程序中选择`文件 | 另存为`菜单选项。将显示普通的文件浏览器界面。\n2. 在`文件名`字段中，按[图\
  \ 32.4]所示的格式输入目标服务器和共享驱动器。\n3. 按回车键。\n4. 浏览器界面的区域区域显示目标服务器的目录结构。您可以像在 Windows 资源管理器中一样，通过双击子目录来进入。\n\
  \n![image](img/F000327f32-04-9780123985453.jpg)\n\n图 32.4 另存到另一服务器。\n\n### 32.2.5\
  \ 隐藏文件\n\n大多数操作系统都提供向查看目录内容的人隐藏文件的功能。其目的似乎并不是让它们完全无法访问，而是为了让它们避开视线。如果您知道如何查找，就可以很容易地访问。\n\
  \n\n\n\n\n在 UNIX 和 Linux 计算机上，以点开头的目录和文件名默认隐藏的。通常，配置文件都是隐藏的。若要在 `ls` 命令的输出中包含隐藏文件和目录，需要包含\
  \ `-a` 标志。例如：\n\n```bash\nls -a\n```\n\n在 Windows 计算机上，文件、文件夹和驱动器可以设置为隐藏。默认情况下，Windows\
  \ 资源管理器不会显示隐藏文件。你可以通过以下方式更改此设置：\n\n1. 在 Windows 资源管理器中，选择菜单选项`组织`(Organize) | `文件夹和搜索选项`(Folder\
  \ and search options)\n2. 点击标记为`视图`(View)的选项卡\n3. 在`隐藏的文件和文件夹`(Hidden files and\
  \ folders)部分，选择`显示文件、文件夹和驱动器`\n\n通常不会预期供应商会故意隐藏文件或目录，但这种情况确实发生。一位同事向我展示了显示它们的方法。我们刚刚运行了一个因错误崩溃的进程。该进程应该在\
  \ `C:\\Users\\Kelly.Bourne\\Documents\\Rentview` 目录下创建几个日志文件，但我们在 Windows 资源管理器中并没有看到。我们可以通过以下步骤进入该目录：\n\
  \n1. 打开 Windows 资源管理器，深入到我们知道隐藏目录应该存在的位置。\n2. 在 Windows 资源管理器的地址栏中，紧接预期隐藏对象所在的目录名称点击，即在\
  \ `\\Documents` 之后。\n3. 手动添加被隐藏的目录名称，即 `\\Rentview`。\n4. 按下回车键。\n\n图 32.5 显示了按下回车键之前的\
  \ Windows 资源管理器。之后，预期的目录出现在右侧面板中。我们能够以正常方式进入该目录，即通过双击右侧面板中的它。\n\n![image](img/F000327f32-05-9780123985453.jpg)\n\
  \n图 32.5 显示隐藏目录。\n\n## 32.3 UNIX 对比 Windows\n\nUNIX 和 Windows 计算机之间存在许多差异，这些可能会可能会不留心的应用程序管理员出错。其中一些主要的差异列在以下章节中。\n\
  \n### 32.3.1 Root 与管理员 administrator\n\n每个计算机系统都需要一个能够执行所有操作的账户。在传统的 UNIX 和 Linux\
  \ 系统上，此账户被称为 `root`。在 Windows 系统上，它被称为 `administrator` 账户。你可能听到的这些账户的其他名称还有超级用户（superuser）或管理员（admin）。\n\
  \n### 32.3.2 文件\n\nUNIX 和 Windows 在处理文件方面存在显著差异。以下列表简要描述了一些主要区别：\n\n* 在 UNIX 中，文件名是\
  \ `inode`（索引节点）的指针，文件的元数据实际存储在那里。`inodes` 允许 UNIX 对文件拥有极大的控制权。例如，它会跟踪有多少进程打开了该文件，只要有一个或多个进程打开了它，就不会允许删除该文件。Windows\
  \ 没有类似于 `inodes` 的概念。\n* UNIX 系统允许多个文件名指向同一个磁盘文件。这种概念被称为“硬链接”（hard link）。允许这种操作是因为不同的文件名仅仅指向同一个\
  \ `inode`。\n* 在 Windows 系统中，路径的“顶部”通常是一个驱动器号，例如 `C:\\Windows\\system32\\some.dll`。在\
  \ UNIX 系统上，它被称为“挂载点”（mount point）。\n* 文件路径中使用的斜杠不同。UNIX 系统使用正斜杠 (`/`)，而 Windows\
  \ 用户使用反斜杠 (`\\`)。\n* UNIX 在文件名中允许的字符范围比 Windows 更宽。例如，Windows 不允许使用 `<`, `>`, `:`,\
  \ `\\` 和 `|` 等字符。\n* 用于控制谁可以访问文件的权限在 UNIX 和 Windows 系统之间显著不同。\n* Windows 维护了某些文件信息，这些信息在\
  \ UNIX 上没有等效项。例如，“存档”（archive）、“隐藏”（hidden）和“系统”（system）的属性位。\n\n### 32.3.3 大写\n\
  \n大小写（即大写与小写）在 UNIX 和 Windows 系统上的处理方式大不同。通常，UNIX 对大小写不敏感，而 Windows 对大小写更敏感。大小写敏感的一些示例包括：\n\
  \n* Windows 中的文件名不区分大小写，而在 UNIX 中区分大小写。这意味着文件名 `Example.txt` 和 `example.txt` 指向同一个\
  \ Windows 文件，但在 UNIX 中是不同的文件。\n* Windows 中的命令不区分大小写，例如，`dir` 和 `DIR` 都能正常工作。在 UNIX\
  \ 中，命令 `ls` 有效，但 `LS` 无法识别。\n* 用户名在 UNIX 中区分大小写，但在 Windows 中不区分。\n* 在 UNIX 上进行的搜索区分大小写，而在\
  \ Windows 系统上的搜索不区分大小写。\n\n### 32.3.4 行结束符\n\nWindows 和 UNIX 使用不同的字符来表示文本文件中每行的结束。UNIX\
  \ 使用的符号是换行符 (`\\n`)。Windows 使用两个符号，回车符和换行符 (`\\r\\n`)。\n\n如果你正在从一种类型的系统传输文件到另一种系统，那么这个概念对你来说非常重要。如果读取文件的程序遇到意外的行结束符，可能会崩溃。\n\
  \n如果你需要将行结束符从一种样式转换为另一种，可以使用工具来完成此操作。UNIX 系统上的 `dos2unix` 命令可以将文件从 DOS 或 Windows\
  \ 格式转换为 UNIX 格式。名为 `Unix2DOS` 的免费软件可以将 UNIX 风格结束的文件转换为 Windows 格式。\n\n### 32.3.5\
  \ 获取帮助\n\n在 UNIX 或 Linux 系统上获取信息的标准方法是在 shell 提示符处输入 `man` 命令。需要传递的参数是你想要获取信息的命令。例如，`man\
  \ mkdir` 命令将返回关于 `mkdir` 命令的详情。\n\n在 Windows 系统上，对应的方法是在命令提示符处输入命令名称，后跟正斜杠和问号。例如，输入\
  \ `mkdir /?` 将返回 `mkdir` 命令的详情。\n\n### 32.3.6 CLI 与 GUI\n\n从历史上看，UNIX 和 Linux 系统使用\
  \ CLI（命令行界面）与用户交互。Windows 用户主要使用 GUI（图形用户界面）与该操作系统交互。这并不是说 Windows 用户不使用或不能使用命令提示符来实现他们的目标。UNIX\
  \ 系统也有 GUI 工具，允许用户进行拖放等操作。\n\n应用程序管理员应该能够熟练地使用 Windows 和 UNIX 的命令行界面 (CLI)。如果你习惯了某个特定的\
  \ UNIX 工具，无法保证它会在你将工作的每台 UNIX 服务器上都存在。与其需要加载 GUI 工具，不如在命令行级别培养至少基础的 UNIX 命令熟练程度会更有效。\n\
  \n## 32.4 命令行组件\n\n命令行的内容包含命令本身、零或多个参数（parameters）以及零或多个选项（options）。选项也称为标志（flags）或开关（switches）。还存在存在符号（pipe）和一个用于写入输出的文件。参数通常是磁盘文件。例如，命令可能需要一个参数来指示命令的输出应该写入何处。命令可能有多个参数，例如，可能都需要指定输入文件和输出文件。\n\
  \n选项修改命令的操作。根据操作系统或 shell，使用的任何选项前面都可能有一个连字符或正斜杠。选项可能区分或不区分大小写。\n\n如果你对命令期望的参数或选项有任何疑问，请使用\
  \ `man` 或 `help` 命令显示有关该命令的更多信息。宁可多花几分钟确保正确也不要让命令执行某些意外且可能具有破坏性的操作。\n\n## 32.5 管道与重定向\n\
  \n\n\n\n作为应用程序管理员，你将经常使用命令行界面。有时，你需要捕获命令的输出内容。也许，实现此操作最简单的方法是将其输出重定向到一个文件中。例如，以下命令将文件和目录列表写入名为\
  \ `output_list.txt` 的文件中：\n\n```\ndir > output_list.txt\n```\n\n重定向符号还可以允许你将文件的内容作为命令的输入。我个人使用过这种方法，但频率没有输出重定向那么高。以下命令会将文件\
  \ `input.txt` 的内容传递给 `sort` 命令。`sort` 命令的输出将发送到文件 `output.txt`：\n\n```\nSort < input.txt\
  \ > output.txt\n```\n\n管道符号（`|`）允许你将一个命令的输出作为第二个命令的输入。我发现这种符号最常见的用法是当我需要从一个命令的输出中搜索特定字符串时。例如，以下命令会在\
  \ `netstat` 命令的输出中搜索端口 1521：\n\n```\nnetstat -a | find “1521”\n```\n\n## 32.6 能够节省时间和烦恼的\
  \ DOS 命令\n\n如果你的背景主要是 Windows 计算机，那么你可能习惯于使用图形用户界面（GUI）处理一切。你不应该忽视这种可能性：有时在命令行输入的命令可以节省时间。\n\
  \n一个简单的例子是，如果你需要在目录中创建多个子目录。你可以轻松地在 Windows 资源管理器中右键点击并选择“新建 |文件夹”，然后输入所需的子目录名称。在目标目录下打开命令提示符并简单输入\
  \ `mkdir directory_name` 要快得多。如果新子目录名称相似，你可以使用向上箭头显示上一条命令并将其更改以反映新的目录名称。\n\n在命令提示符中使用\
  \ `rm` 或 `erase` 比使用 Windows 资源管理器删除文件更高效，因为 GUI 替代方案会将文件移动到回收站。如果你正尝试通过将文件移动到回收站来删除大量文件，这会显著降低处理速度。建议使用\
  \ `erase` 命令而不是 `rm`，仅仅是因为这样更不容易误操作。\n\n另一个可以在 Windows 命令提示符中运行的命令示例是 `Robocopy`（或健壮文件复制）。该命令将目录及其子目录从一个位置复制到另一个位置。当你需要同步两台计算机上的文件时，此命令非常有用。\n\
  \n诚然，我只提到了几个 CLI 命令，但重点在于不要假设 GUI 比命令行更快、更易用。如果你保持开放的心态，可能会发现完成工作的其他替代且更高效的方法。\n\
  \n## 32.7 测试基础\n\n测试应用程序将是应用程序管理员参与的一项常规活动，即使不是持续性的活动。你可能不需要测试整个应用程序，但应用程序中某些部分只有管理员才能访问，因此你将始终参与到测试活动中。\n\
  \n需要进行测试的情况包括：\n\n- 在应用程序初始安装之后\n- 在每次升级之后\n- 在对系统进行重大更改的前后记录性能情况。\n\n软件测试有多种类型。每种测试都适用于应用程序生命周期中的特定阶段。以下章节描述了测试的类型以及通常执行这些测试的时机：\n\
  \n- **单元测试（Unit testing）**——并不适用于第三方应用程序的用户。这种测试在应用程序开发期间进行。每当完成一个单元（即模块或子程序），就会对其进行测试，以验证其是否符合规范。\n\
  - **UAT（用户验收测试 User Acceptable Testing）**——在应用程序最初安装时进行，以验证应用程序执行了规范要求的所有操作。UAT\
  \ 测试在每次升级后也会进行。有时组织在每次升级后都不进行 UAT，当他们升级后的生产环境出现显然由升级或补丁引起的问题时，他们会对此追悔莫。\n- **性能测试（Performance\
  \ testing）**——用于衡量应用程序的性能如何。可以在软件安装时进行。另一种进行性能测试的情况是在系统发生重大更改前后，例如从物理服务器迁移到虚拟机前后，或者在从本地驱动器迁移到\
  \ SAN 驱动器前后。性能测试的示例包括计时执行以下操作所需：\n    - 打开特定屏幕\n    - 运行某些命令\n- **压力测试（Stress testing）**——用于测试高负载下的系统表现。\n\
  - **回归测试（Regression testing）**——用于确保新更改没有破坏现有功能。\n- **并行测试（Parallel testing）**——通过同时运行两个系统来确保数据一致性。\n\
  \n## 32.8 基础 SQL\n\nSQL，即结构化查询语言，是与关系型数据库交互的事实语言。如果你的应用程序将数据存储在关系型数据库中，无论数据库是 Oracle、Microsoft\
  \ SQL Server、DB2 还是 MySQL，都会使用 SQL。\n\n作为应用程序管理员，你不需要成为 SQL 专家，但你需要理解基础知识。你必须知道如何编写、执行和调试一些基础\
  \ SQL 语句。这些语句将在 `SQLPlus`、`TOAD` 或 `SQL Navigator` 等工具中执行。\n\n你几乎最常用的 SQL 语句是 `SELECT`\
  \ 语句。该语句用于从数据库中选择（即读取）数据。`SELECT` 语句的基本结构所示：\n\n```sql\nSELECT table.column\nFROM\
  \ table\nWHERE conditions\nORDER BY columns;\n```\n\n你可能会遇到的其他 SQL 语句包括：\n\n- `UPDATE`——修改数据库表中现有行的值。除非供应商明确要求你执行\
  \ `UPDATE` 语句，否则你不应该自行这样做。因为如果 `UPDATE` 语句的 `WHERE` 子句不正确，可能会更改错误的行。你可能会无意中修改表中的每一行。\n\
  - `INSERT`——向表中添加行。编写和执行 `INSERT` 语句的一个危险是数据库中的表存在关系，即一个表中的行与其他表中的行关联。如果你不理解这些关系，可能会很容易损坏数据库。\n\
  - `DELETE`——从表中删除行。如果 `DELETE` 语句的 `WHERE` 子句编写错误，你可能会删除表中的每一行。显然，使用 `DELETE` 语句时应极其小心。\n\
  - `CREATE`——用于创建数据库对象，如表、视图、索引等。支持应用程序时，你不太会编写或执行 `CREATE` 语句。\n\n\n\n\n你可能认为 Excel\
  \ 仅仅是用户需要熟悉的工具，但它提供了许多即使应用程序管理员（Application Administrator）也可以使用的功能。Excel 最平凡的用途是创建用户可以填写以报告问题、请求访问、识别改进等表单。这些功能非常有用，因为用户可能已经熟悉\
  \ Excel 及其使用方法。\n\n精通 Excel 的用户可以快速轻松地使用它来实现更高级的用途。一个例子是快速准确地创建 SQL 语句或脚本。例如，假设你需要删除\
  \ 500 个包含递增数字序列名称的表，例如 `Table_001`、`Table_002` 等。你可以手动完成，也可以使用 Excel 创建一个包含 500\
  \ 条独立 `DROP` 语句的文件。要使用 Excel 创建此文件，请执行以下步骤：\n\n- 在单元格 `A1` 中输入 `Table_001`。\n- 点击击该单元格的右下角并向下拖动。\n\
  - 后续行将填充 `Table_002`、`Table_003` 等。根据需要继续向下扩展。\n- 在单元格 `B1` 中输入值 `=“DROP TABLE”\
  \ & `A1` & “;`。\n- 点击该单元格的右下角并向下拖动，将其复制到 `A` 列中所有值的行。\n- 后续行将填充相同的公式。\n- 选择 `B`\
  \ 列中你想要的所有单元格，复制它们并粘贴到记事本中。\n- 将文件另存为 `Drop_Table_script.sql` 或适当命名的文件。\n\n图 32.6\
  \ 显示了执行上述步骤后 Excel 表格的样式。通过在 `SQL*Plus` 中执行此 SQL 文件，所有的“DROP table”语句都将执行。\n\n![image](img/F000327f32-06-9780123985453.jpg)\n\
  \n图 32.6 使用 Excel 创建 SQL 语句。\n\n同样的技术也可以用于创建：\n\n- 用于向表中插入测试数据的 `INSERT` 语句\n- 用于修改测试表中现有数据的\
  \ `UPDATE` 语句\n- 用于从测试表中删除数据的 `DELETE` 语句\n\n使用 Excel 创建 SQL 脚本和批处理内容的潜力仅限于你的想象力和智慧。\n\
  \n## 32.10 URL\n\nURL，统一资源定位符（uniform resource locator），是网页的地址，输入到 浏览器中显示所需的网页。你不需要编写解释或处理\
  \ URL 的代码，但你必须理解它们的外观。如果你能够快速识别用户可能意外输入的 URL 错误，将非常有用。\n\n一个 URL 包含以下部分：\n\n- 方案名称（schema\
  \ name），也称为协议。方案名称示例有 `http`、`https`、`ftp`、`gopher` 和 `wais`。\n- 域名（domain name），也称为\
  \ IP 地址，是 URL 的目标位置。这可以用域名（例如 `google.com`）或其 IP 地址来表示。域名不区分大小写。域名通过冒号和两个正斜杠（`://`）与方案分开。\n\
  - 域名后可以包含一个可选的端口号，例如 `google.com:80`。如果提供端口号，将使用该方案的默认端口。使用冒号将端口与方案分隔。\n- 路径（path）指定请求的资源。路径值区分大小写，但某些服务器将其视为不区分大小写。路径的一个示例是“example/URL”。路径通过正斜杠与域名（如果存在则为端口号）分开。\n\
  - 查询字符串（query string）是一个可选字段，包含传递给 Web 服务器上运行应用程序的数据。例如，它可能是账号、订单号或客户 ID。如果传递了多个值，用和符号（`&`）分隔。查询字符串通过问号（`?`）与路径分开。\n\
  - 片段标识符（fragment identifier）是 URL 末尾的可选值。它指向所调用的主资源的子资源，例如页面或文档。片段标识符通过哈希标记（`#`）与之前的之前的元素分开。\n\
  \n## 32.11 HTML\n\nHTML（超文本标记语言）是用于创建网页的主要标记语言。HTML 中的代码告诉网络浏览器如何渲染（即显示）页面。如果你支持基于\
  \ Web 的应用程序，你至少在看到 HTML 时必须识别它。HTML 告诉浏览器显示的视觉元素短列表包括：\n\n字体 字体\n- 颜色\n- 普通、粗体或斜体\n\
  - 下划线或删除线\n- 换行\n- 图片\n- 表格\n\n## 32.12 XML\n\nXML（可扩展标记语言）是一种用于编码人类和机器可读文档的标记语言。它由元素和属性组成，元素前后由标签包围。起始标签以小于符号（`<`）开始标签代码，然后是闭合大于符号（`>`）。例如\
  \ `<section>`。结束标签与起始标签类似，但包含一个正斜杠，例如 `</section>`。\n\n应用程序使用 XML 文件存储其配置设置或应用程序创建的数据文件是非常常见的。\n\
  \n## 32.13 WANs, LANs and VLANs\n\n如果你对网络的经验相对有限，那么可能有一些你不理解的概念、术语和短语。这里简要说明了应用程序管理员可能会遇到的一些网络术语。\n\
  \n- 带宽（Bandwidth）——单位时间内通过网络的数据量。带宽以每秒比特（bits per second）衡量。\n- 互联网（Internet）——所有互连网络的集合。\n\
  - 内网（Intranet）——一个组织专私有网络。\n- 局域网（LAN）——连接在一起的距离较的计算机。\n- 网络（Network）——一个在多台计算机之间发送数据的系统。\n\
  - 网卡（Network card）——允许计算机与网络通信的设备。通常称为网络接口卡或 `NIC`。\n- Ping——一种命令，向另一台计算机发送消息，以确定其是否连接到网络。\n\
  - 路由器（Router）——将多个局域网连接在一起的设备。路由器使通信从一个局域网的计算机流向另一个局域网的计算机。\n- 交换机（Switch）——在同一局域网计算机之间转发数据包的设备。\n\
  - TCP/IP——传输控制协议/网协议，连接互联网计算机的标准协议。\n- 虚拟局域网（VLAN）——将局域网上的某些计算机分组的技术。如果这些计算机主要在彼此之间交换消息而不是与局域网上的其他计算机交换，将它们分组在\
  \ VLAN 中可以使网络更高效。\n- 虚拟私有网络（VPN）——使用软件通过互联网建立“隧道”在两台计算机之间创建私有连接的网络。\n- 广域网（WAN）——跨越较大区域的计算机网络，例如州或国家。\n\
  - WiFi——硬件和软件的结合，允许在不使用电线或其他物理连接的情况下，将网络通信从一台计算机发送到另一台计算机。\n\n\n\n\n应用；网络；安全；数据库基础；Web\
  \ 应用基础；脚本语言；性能监控；软技能；写作能力；口头交流能力；项目管理；会议主持；预算；未来趋势；虚拟化；云计算；SaaS；开源软件；数据可视化；移动应用；BYOD；虚拟补丁\n\
  \nIT 行业如此广泛、复杂且发展之快，跟上几乎是一项全职工作。成为每个领域的专家是不可能的，因此你必须专注于对你现在最重要的内容。以下章节描述了教育对你帮助最大的某些领域。\n\
  \n## 33.1 应用管理员可能需要改进的领域\n\n每个人都有自己的长和板。一位应用管理员可能具有深厚的技术背景，她最大的弱点可能是对组织所属业务的理解有限。另一位应用管理员可能是从用户社区晋升上来的，对于他来说，学习额外的技术基础可能获益匪浅。\n\
  \n以下章节概述了你可以投入教育时间和资金关注的某些领域。由于你的时间和培训资金都是有限的，请务重选择，以确保你的努力回报最大化。\n\n### 33.1.1\
  \ 应用\n\n如果你支持此应用程序的时间相对较短，那么将教育精力投入到它上可能会获得最高的培训投资回报。后续章节描述了你可以学习的一些特定领域。\n\n####\
  \ 33.1.1.1 应用的技术方面\n\n每种企业级第三方应用程序都有许多许多许多活动组件。你几乎肯定会有部分内容是不熟悉的。了解更多关于应用程序技术方面的知识可以在许多活动中帮助到你，包括：\n\
  \n• 安装\n• 升级\n• 定制\n• 数据导入和导出\n• 故障排除\n\n#### 33.1.1.2 组织如何使用应用程序\n\n更多地了解业务背景或组织绝对值得投入。如果可能，请尝试理解你的应用程序是如何使用的、它为什么对组织有价值，以及其功能的基础。这种知识将使你更容易理解用户。\n\
  \n#### 33.1.1.3 增强应用程序\n\n该应用程序是否包含可以增加对组织价值的可选包？如果你既了解组织如何使用应用程序，又了解应用程序提供了哪些可选功能，你就可以向管理层建议哪些可选功能可能提供额外的有用功能。\n\
  \n### 33.1.2 应用之外的技术领域\n\n如果你以应用为中心的知识非常扎实，那么专注于格局的技术方面可能是你的最佳行动方案。接下来的章节仅描述了可能对你有价值的少数领域。请回顾它们，但不要被此技术主题列表限制。\n\
  \n#### 33.1.2.1 网络基础\n\n根据我的经验，对许多 IT 人员来说，“网络”有点神秘。增加对网络的了解将使大多数应用管理员受益。即使你不会或不能对网络进行更改，当网络出现问题时，你至少可以与网络管理员进行知识性的对话。拥有`DNS`、`DHCP`、路由、`IP\
  \ 地址`等领域的实用知识只对你会有帮助。\n\n#### 33.1.2.2 安全\n\nIT 安全领域几乎是无尽的。学习任何形式的 IT 安全对你和你的雇主都具有巨大的价值。你可以深入研究的领域包括：\n\
  \n• 网络安全\n• 数据库安全\n• 身份识别与验证\n• 服务器级安全\n• 应用级安全\n• Web 服务器软件的安全，例如 `IIS` 或 `Apache`\n\
  • 最小化你应用程序服务器的攻击面\n\n#### 33.1.2.3 数据库基础\n\n可以很地假设你支持的任何企业级应用程序都是构建在关系型数据库上的。如果你还没有关系型数据库的知识，那么这是一个有很多可学内容的领域。你可以学习更多的一些潜在主题包括：\n\
  \n• `SQL` 基础\n• 数据库调优\n• 主键和外键\n• 索引\n• 视图\n• 存储过程\n• 应用程序数据库的结构\n• 数据库备份和恢复过程\n\
  \n#### 33.1.2.4 高级 SQL\n\n章节 `33.1.2.3` 提到学习数据库基础，包括 `SQL` 基础。一旦你精通 `SQL` 基础，在认为自己是专家之前还有很长的路要走。\n\
  \n#### 33.1.2.5 Web 应用基础\n\n如果你的用户使用 `Internet Explorer` 或 `Firefox` 等 浏览器与应用程序交互，那么你的应用程序就是基于\
  \ Web 的。如果你还不熟悉 Web 应用的基础，这应该是你深入研究的首要领域之一。了解 Web 应用的基础将帮助你设置、调优和故障排除应用程序。\n\n你可能想要学习的一些潜在主题包括：\n\
  \n• Web 页面的基本结构\n• `HTML`\n• 级联样式表 (`CSS`)\n• 访问数据\n• 托管\n• 常见错误\n• 网站如何被搜索引擎识别\n\
  • 互联网与万维网\n• `URLs`\n• 支持网站\n\n#### 33.1.2.6 脚本语言\n\n脚本语言是一种不需要编译的计算机语言。脚本语言的优势之一是代码可以快速编辑和重新执行。它们被用于各种方式，包括：\n\
  \n• 脚本文件，即命令文件或批处理文件\n• Web 应用的客户端\n• Web 应用的服务器端\n\n即使学习一种脚本语言也是值得的。脚本语言的示例包括：\n\
  \n• `JavaScript`\n• `PHP`\n• `Python`\n• `Perl`\n• `Ajax`\n• `Rexx`\n\n#### 33.1.2.7\
  \ 性能监控和调优\n\n计算机系统的性能调优是一项非常艰巨的任务。随着每一代软件的出现，组件的数量似乎呈指数级增长。如果你学习了足够的知识来提高你支持的应用程序性能，将为你组织和用户做出巨大的贡献。\n\
  \n### 33.1.3 软技能\n\n技术人员被隔离在房间里从不与高层管理、用户、客户或供应商互动的时代。现在几乎每个人都必须准备好进行演示、回答问题或与组织的其他部分互动。对于我们中的硬核技术人员来说，这可能是一个令人生畏的要求。让这种经历更容易的一种方法是提高你所拥有的所谓软技能。以下章节描述了一些软技能。\n\
  \n#### 33.1.3.1 写作\n\n组织中的每个人都需要能够以简洁连贯的方式进行写作。即使是最硬核的技术人员也需要编写此类文档：\n\n• 事故报告\n\
  • 测试计划\n• 应用概述\n• 用户操作指南\n• 操作手册 (Playbooks)\n• 提案书\n• 电话会议或会议回顾\n\n#### 33.1.3.2\
  \ 口头交流能力\n\n\n\n有效进行口头交流的价值如何强调都不为过。无论是在向小组进行演示，还是向老板或用户解释为什么他们的请求比看起来要复杂得多。在你的整个职业生涯，你将不断与主管、用户、管理层、供应商、其他应用程序管理员以及技术人员进行交流。如果你无法组织出一个连贯的句子，那么提高你的沟通能力可能可能是提升你软技能的最佳切入点。\n\
  \n### 33.1.3 项目管理\n需要管理的项目范围从数百人年到少数几个人月不等。如果你在项目管理艺术方面没有任何经验或培训，那么即使是一个只包含几个任务的“项目”也可能让你无所措。学习项目管理的基础知识绝对是一项值得的投资。即使你永远不需要为规模较小的工作创建正式的项目计划，但严格地制定一个供自己使用的计划也可能很有价值。\n\
  \n如果你发现自己正在做越来越多与项目管理相关的工作，并且喜欢这项工作，你可能想要获得该领域的认证。由项目管理协会（PMI）提供的项目管理专业（PMP）是项目经理最受认可的认证之一。获得认证需要时间和努力，但你将学到该领域的大量知识，并成为该领域认可的专业人士。\n\
  \n### 33.1.4 主持会议\n最终，几乎每个人都被要求主持会议。这可能涉及一个在本地会议室聚集的团队，也可能是与来自世界各地拨入的团队成员电话会议。无论在哪里或有多少人参加，只要领导者有效，会议就会更有效率。提高会议管理水平的方法包括：\n\
  \n• 每场会议都应该有一个明确且公认的目的\n• 提前分发会议议程\n• 在适当的情况下使用有效的视觉辅助\n• 鼓励每个人讨论和参与，但保持讨论在主题范围内\n\
  • 会议结束时，总结讨论和达成共识的内容\n• 应在合理范围内尽快编写会议纪要并分发给参会人员\n\n### 33.1.5 预算基础\n许多技术人员对组织内部预算流程的运作了解或完全不了解。学习更多预算基础知识可以从几个方面对你有帮助：\n\
  \n• 你将了解提交额外硬件、软件和培训请求的流程\n• 如果你的资金申请被拒绝，你能够更好地理解原因，并增加下次被批准的机会\n• 它可以增加你晋升为管理职务的几率\n\
  \n### 33.1.6 员工监督与管理\n学习更多关于主管和管理层如何工作对每个人都有好处。它将让你更好地理解他们在做什么以及他们做某些事情的原因。通过更多了解这些职位，你将能更好地洞察自己是否对监督职位感兴趣。\n\
  \n### 33.1.7 你的行业\n深入了解你所在组织的行业一直是可能的。你可以学习更多关于它的背景、现状、政府影响、未来趋势等。拥有更多背景信息可以帮助你理解你所支持的应用程序及其使用方式。\n\
  \n### 33.1.4 未来趋势\nIT 领域正在发生不断变化，而且变化速度似乎正在加速。许多未来趋势现在看起来还很远，但它们到来将比预想要快得多。不可能成为每一个未来趋势的专家，但如果你能跟上几个最可能影响你所在行业或组织的趋势，那么你将领先于形势。接下来的章节列出了几个未来即将来到来或已经到来的趋势。\n\
  \n#### 33.1.4.1 虚拟化\n用虚拟化服务器取代物理服务器对于大多数数据中心来说已经是现实。如果你的组织尚未采取这一步，那么可能只是时间问题。你需要确定你的应用程序是否经过供应商认证可在虚拟服务器上运行。如果是，它通过了哪种类型的虚拟化软件的认证？\n\
  \n服务器不是唯一被虚拟化的设备。用户桌面也可以转换为虚拟设备。其概念是操作系统运行在本地（即桌面）硬件上，但软件是从远程服务器访问的。虚拟化桌面的缺点之一是它需要与访问镜像的服务器保持持续的网络连接。\n\
  \n虚拟化桌面的优点包括：\n\n• 如果桌面丢失、被盗或损坏，可以快速创建一个新的虚拟设备。\n• 虚拟桌面不包含任何数据，因此如果它们丢失或被盗，就不会丢失机密信息。\n\
  • 虚拟化桌面可以从标准基础进行克隆。拥有相同的服务器更容易确保它们都安装了所有所需的支持软件。\n• 你的灾备（DR）计划可以包括创建虚拟化桌面以替代主设施丢失的桌面。\n\
  • 在虚拟桌面上应用升级比在物理设备上安装升级更简单。\n• 如果虚拟桌面感染了病毒、木马或其他恶意软件，可以将其丢弃并快速重新构建。\n\n#### 33.1.4.2\
  \ 云计算/SaaS\n“云计算”是一个广泛使用的术语，指组织租赁计算能力，而不一定知道或关心这些服务器所在地。这把支持服务器的负担从用户组织转移到了支持组织，例如亚马逊及其提供的弹性云计算（EC2）服务。\n\
  \n对大多数组织而言，云计算的优点包括：\n\n• 它更灵活，例如几乎可以随心增加或减少计算能力\n• 供应商声称降低了成本\n• 供应商承诺更好的性能\n•\
  \ 可靠性\n• 维护负担由供应商处理\n\n如果你的组织正在考虑将其数据中心或至少部分服务器迁移到云端，那么你需要理解它可能如何影响你的应用程序。例如：\n\n\
  • 应用程序是否通过了云环境认证？\n• 云供应商是否有处理你特定应用程序的经验？\n• 其他使用此应用程序的客户是否成功将其迁移到了云端？\n• 云计算是否足够应用程序的安全需求？\n\
  • 如果应用程序迁移到云端是否可能产生性能影响？\n\n供应商通常在云中托管 SaaS（软件即服务）应用程序。这样做的一个主要优势是云是是灵活的。如果对应用程序的需求增加，可以为应用程序分配额外的（云）计算资源，以维持用户性能。\n\
  \n#### 33.1.4.3 开源软件\n开源软件（OSS）是指免费分发的软件，包括源代码。软件的版权所有者允许任何人检查、修改和重新分发该软件。可能存在某种能够满足你组织需求的开源软件应用程序。如果存在这种可能，你的组织可以考虑利用它，而不是从第三方供应商处许可产品。\n\
  \n在深入研究开源领域之前，你需要意识到这种获取软件的方法是有缺点的。其中一些缺点是：\n\n\n\n\n- 从你当前的应用程序迁移到开源软件（OSS）必须在没有供应商支持的情况下完成。\n\
  - 开源应用程序可能并不完全符合你的需求，因此你的组织需要准备好对其进行修改或接受其局限性。\n- 支持开源应用程序需要技术水平更高的员工。\n- 如果应用程序出现问题，你不能仅仅拨打电话期望供应商来修复。可能会有个人或某个小组在支持它，但你或你的员工需要具备深入源代码以独立解决问题的。\n\
  - 应用程序随附的文档质量可能达不到你习惯的水平。\n- 支持该应用程序的工具可能无法像第三方产品那样随处可用。\n\n#### 33.1.4.4 外包\n\n\
  似乎迟早，几乎每个组织都会考虑将外包作为一种降低成本的方法。如果供应商决定外包其开发团队或支持小组，外包会对你产生影响。如果发生这种情况，我能提供的最佳建议是保持耐心并保持开放的心态。如果你已经建立了一个其他应用程序管理员的网络，当出现问题时，你可以转向他们寻求第一级支持。如果他们无法帮助你，再通过供应商的支持小组提交工单。\n\
  \n#### 33.1.4.5 数据可视化\n\n随着组织积累越来越多的数据，要理解所有这些数据变得越来越困难。用于理解所有这些数据的一种技术是数据可视化。以图形化格式显示数据通常与数据可视化相关。\n\
  \n你所支持的应用程序包含任何数据可视化工具吗？如果目前应用程序未提供工具，供应商是否承诺未来将提供此类工具？另一种方案是导出数据，以便像 `Tableau`\
  \ 这样的可视化工具可以访问它并创建图形化的数据演示。\n\n#### 33.1.4.6 移动应用程序\n\n能够被移动设备（例如智能手机和平板电脑）访问似乎是企业级应用程序最新的时髦话题（*de\
  \ jour*）。你组织中的人们是否正开始讨论这个问题？如果是，你可能需要开始考虑这些问题：\n\n- 你的移动用户将使用什么类型的硬件？`iPhones`、`iPads`、`Android`\
  \ 手机等。\n- 移动用户访问你的应用程序是否有意义？\n- 你支持的应用程序可以通过智能手机或平板电脑访问吗？\n- 有多少应用程序用户想要从移动设备访问它？\n\
  - 这个数字在增长吗？\n- 应用程序的安全要求是什么？从移动设备访问它可能违反安全要求吗？\n- 应用程序可以被修改或重新配置以使其更安全吗？\n\n####\
  \ 33.1.4.7 BYOD——自带设备\n\nBYOD 似乎是移动应用程序之后的下一步。它只是在路径上更进一步了一步，基本上支持用户想要访问应用程序的任何设备。在节\
  \ 33.1.4.6 中列出的所有所有问题同样适用于 BYOD 趋势。\n\n#### 33.1.4.8 虚拟补丁\n\n虚拟补丁是一种应用快速修复来解决应用程序特定漏洞的方法。它并不是一个全面或长期的解决方案。虚拟补丁的一个重大缺点是它没有纠正应用程序中固有的缺陷；它在比喻上是用创可贴贴盖了问题，直到永久修复方案的出现。如果你的应用程序供应商提供虚拟补丁，那么你至少需要考虑接受并加载它们。\n\
  \n## 33.2 教育机会\n\n在我们的职业中，自我教育的机会几乎是无尽的。只要有一点想象力和合理的努力，任何人都可以提高对该领域内几乎任何主题的了解。这里列出了一些你可以利用来教育自己的更明显的资源。\n\
  \n### 33.2.1 供应商培训\n\n供应商提供的特定应用程序培训通常是你能找到的最好的培训来源。如果你的雇主出钱送你参加供应商提供的培训，那么你希望在供应商培训课程期间学到的东西最大化。关于如何充分利用这些课程的一些建议是：\n\
  \n- 不要空手而入。在课程开始之前，阅读任何可用的手册、帮助屏幕、`Dummies` 系列书籍等。对应用程序有一个良好的基础将帮助你吸收将要呈现给你的材料。\n\
  - 在课程之前尽可能多地操作应用程序。任何实践经验都将是巨大的益处。\n- 带上大量的问题。在参加课程之前把它们写下来，在获得答案时也写下来。与同事、用户、你的前任等人交流，询问他们是否有任何关于应用程序的想要解答的问题。对于你的问题列表来说，越多越好。\n\
  - 每天课后都复习材料。在一天结束后去喝玛格丽他（margaritas）当然更有趣，但在记忆新鲜时复习这些信息将有助于将其巩固在记忆中。这是更新你的笔记的时候——或者如果你在课上没写的话，现在就写。\n\
  - 如果课程涉及实操实验室或作为小组项目完成的任务，不要依赖别人来解决问题。这在当时看起来可能很容易，但你将浪费从专家那里学习的机会。\n\n如果你足够幸运，你的供应商会提供其他培训途径。例如，网络研讨会（直播或按需）、白皮书或时报。你应该利用任何提供的教育机会。\n\
  \n### 33.2.2 从应用程序中学习\n\n如果没有应用程序的课程，或者你的雇主不送你去参加，不要绝望。如果你愿意努力，你可以自己学到很多。一些来源列在下面的章节。\n\
  \n#### 33.2.2.1 供应商文档\n\n供应商提供的应用程序文档可能不是轻松的读物，但它通常提供了惊人的信息。预先警告，它可能很枯燥，写得可能不好，也不会成为明年的电影，但它是很容易获得的且通常免费的。谁还能要求更多呢？\n\
  \n#### 33.2.2.2 应用程序实验\n\n有些人在通过操作而不是阅读文档时学得最好。对于这类类型的人，最好的学习机会可能是实验应用程序。通过手册并测试所讨论的内容。当然，不说自明的这种测试应该在开发或测试环境中进行。在生产版本的应用程序上乱来可能会让你被解雇。\n\
  \n#### 33.2.2.3 服务器上的帮助\n\n你会有许多需要学习的技术方面，这些不在供应商的文档中。与服务器操作系统相关的工具、命令和技术不会在应用程序文档中记录。相反，你应该转向操作系统提供的文档。两个例子是\
  \ UNIX/Linux 的 `man` 页或 `Windows Help` 系统。\n\n### 33.2.3 内部 LMS（学习管理系统）\n\n许多组织提供内部学习管理系统。这些\
  \ LMS 可能没有针对你所需的技术水平的课程，但检查一下没有坏处。\n\n### 33.2.4 课程\n\n\n\n\n\n如果你所支持的应用被广泛使用，那么可能会由供应商以外的其他实体提供有关该应用的课程。后续章节列出了一些可能的提供者。\n\
  \n### 33.2.4 当地大学\n大多数大学不提供针对特定应用程序的课程，但只需花几分钟查看他们的在线课程目录即可。你可能找不到专门针对你应用程序的课程，但可能会发现某个你感兴趣的另一个主题的课程。\n\
  \n### 33.2.5 社区学院\n相比大学，你当地的社区学院更有可能提供针对你应用程序的课程。同样，如果你没有找到针对你应用程序的特定课程，但可能有很多关于你感兴趣、或者你认为了解更多会有价值的主题的课程。\n\
  \n### 33.2.6 培训机构\n大多数中大城市至少有一两家为 IT 行业提供培训的公司。他们的许多课程很可能是为了准备与认证相关的考试做准备。其他课程可能是关于编程语言的。如果你的应用被广泛使用，那么他们可能会提供一两门关于它的课程。\n\
  \n### 33.2.7 书籍\n如果你支持的应用具有很高的市场渗透率，那么很有可能至少已经有一本关于它的书。通过投入 25-30 美元和一两周的实际努力，你可能将自己的专业水平从初级提升到高级级。\n\
  \n### 33.2.8 白皮书或演示稿\n如果你在互联网上努力搜索，你可能会找到任何内容。你可能会发现的内容之一关于你行业或你所支持的应用白皮书或演示稿。当然，你在互联网上读到的所有内容都必须持保留态度。由供应商营销人员编写的演示稿不太可能提供关于应用程序的平衡观点。考虑到这一点，阅读与应用程序相关的任何内容都百无害处。\n\
  \n### 33.2.9 博客\n有很多非常有价值的博客绝对值得定期阅读。虽然你可能找不到一个专门针对你应用程序的博客，但其中一些涵盖了软件开发、测试、安全、变更控制等主题。你发现的任何带有行业背景信息的博客都值得至少一看。\n\
  \n### 33.2.10 行业期刊\n定期出版的行业期刊数量得惊人。如果你在互联网上到处找找，很可能会找到至少一两本涵盖你行业的期刊。有些是邮政投递的纸质版，另一些是通过电子邮件接收的电子版。其中一个难以比拟的特点是，大多数都是免费的。\n\
  \n#### 33.2.10.1 技术\nIT 行业拥有种类丰富的行业期刊。它们关注的主题从硬核编程到网络、安全，再到适合 CIO 或 CTO 的高级主题。其中许多要么是免费送到你的办公桌的，要么可以免费在线阅读。\n\
  \n还有许多技术电子简报直接发送到你的 `e-mailbox`。一旦你开始收到这些信函，似乎你的名字就会传开，很快你收到的信息将超过你可能阅读的范围。\n\n\
  #### 33.2.10.2 行业特定\n关注你所在机构的行业是一个非常好的主意。我敢打赌，无论你从事的是哪个行业，都有该行业的特定行业期刊。我快速搜索了一下，发现\
  \ `www.wikipedia.org` 有 254 页列出了“专业和贸易杂志”。如果你在那个列表中找不到你的行业，那么你正处于一个相当冷门的领域。\n\n\
  #### 33.2.10.3 通用商业\n商业趋势和气候会影响所有行业，因此了解通用的商业气候是一个好主意。有很多出版物提供基础商业信息的报道。\n\n###\
  \ 33.2.11 网络研讨会\n如果你不喜欢阅读技术出版物，你可能更愿意通过网络研讨会获取教育材料。我似乎每天都会收到两三个关于技术主题的网络研讨会邀请。有些是直播的，其他是预录制的。直播的允许你和其他观众通过提问来参与。预录制研讨会最大的优势是你可以在你方便的时候观看它们。\n\
  \n### 33.2.12 互联网\n互联网提供的各主题信息可能比普通人提供的任何其他资源都要多。它方便、免费，而且你可以在任何地方访问它。通过对某个主题进行搜索，你可能会找到提供及时且相关信息的白皮书、博客、网络研讨会或大学课程。当然，每当你依赖你不熟悉的来源的信息时，都需要稍微谨慎。不要相信你读到的所有内容，特别是如果某个特定来源的信息与其他来源的说法显著不同时。\n\
  \n### 33.2.13 用户组\n你支持的软件应用程序是否存在用户组（User Group）？如果有，可能值得花时间查看一下。如果没有，也许机会机会所在的地区建立一个。一些用户组为其成员提供以下资源：\n\
  \n- 一次年度会议，包括供应商演示、用户演示和课程\n- 一个设有每月或每季度举行会议的本地用户分会\n- 一个带有知识库或详尽 FAQ 列表的网站\n- 与专业人士建立人脉的机会\n\
  \n### 33.2.14 会议\n如果你的应用程序供应商或用户组有年度会议，如果可以的话，你应该参加。如果没有用户会议或你无法参加，请看看家里附近是否有举办的\
  \ IT 或行业会议。寻找那些你的供应商可能会展出或演讲的会议。虽然这些会议可能不提供关于你应用程序的细节，但它们可以为你提供有关 IT 领域的价值信息以及与专业人士建立人脉的机会。\n\
  \n## 33.3 与教育相关的潜在个人目标\n拥有职业目标有助于你在生活中实现更多目标，而不仅仅是每周出现并领取薪水。以下章节只是你可能考虑的一些可能目标。\n\
  \n### 33.3.1 在用户会议上进行演讲\n如果你发现了做某事的更好方法，或者以以独特的方式使用该应用程序，你应该考虑在下一次用户会议上进行演讲。第一步是在会议发布征稿通知（call\
  \ for papers）时提交提案。这通常发生在会议举行 6 个月之前。虽然公开演讲可能有点可怕，但向你的同伴展示信息是一种令人兴奋的经历。\n\n你可能无法获得演讲的报酬，但许多会议会免除演讲者的入场费由于由于可能花费一千美元，对于你的时间和精力来说，这是一个相当慷厚的补偿。如果你的机构通常不支付会议费用，能够免费参加可能会影响他们的决定。\n\
  \n### 33.3.2 在行业期刊上撰写文章\n所有每月出版的行业期刊都需要文章填充。根据我的经验，这些期刊的编辑乐于考虑 IT 专业人士提出的关于他们工作、应用程序或技术的写作提案。如果你提交了一个关于你的应用程序、新技术或当前趋势的深思熟虑的提案，如果被接受并发现自己成了了作者，不要惊讶。\n\
  \n### 33.3.3 博客\n\n\n\n\n\n任何人都可以关于自己的应用程序或整个职业撰写博客。我觉得，如果你花时间整理自己的思路并将其写在纸上，这就是一种学习经历。如果你花时间和精力为你的职业生活撰写博客，你可能会以全新的、更好的眼光来看待很多事情。\n\
  \n### 33.3.4 学位\n\n获得学位是一项巨大的工程，但从个人和职业角度来看都是有回报的。在当地大学上课或通过在线课程学习，可以帮助你在当前雇主处或未来的职位中提升职业。请务必对这一决定深思熟虑，以确保你参加了最符合你职业目标的计划。\n\
  \n### 33.3.5 认证\n\n获得认证值得吗？如果你考虑的认证与你的职位描述直接相关，那么这可能是一个显而易见的决定。如果认证与你的日常工作没有那么紧密，那么获得认证应该是你真正想要的事情，或者是你计划未来转型的领域。\n\
  \n在走上认证之路之前，需要考虑以下几点：\n\n* 该证书在领域内是否获得认可并广受推崇？\n* 获得认证需要通过多少次测试？\n* 证书需要多久更新一次？\n\
  * 基础主题是否变化过于频繁，以至于目前的认证在不久后就会过？\n* 你的雇主会支付书籍、课程或测试的部分或全部费用吗？\n\n### 33.3.6 写一本书\n\
  \n你应该至少考虑的个人发展领域之一是写书。如果你支持的应用程序具有巨大的市场份额，那么一本关于该主题的好书可能会很好卖。如果没有竞争性书籍，那么它更有可能卖得好。\n\
  \n## 33.4 教育用户\n\n教育应用程序的用户可能不是你的职责，但可以假设受过更好教育的用户所需的支持更少。如果你能在不危及你对应用程序支持水平的情况下帮助他们教育，这可能是一件很好的事情。而且，这将为你提供磨练演讲技巧的机会。\n\
  \n培训材料可以通过多种方式呈现给用户。示例包括：\n\n* 如果你的组织有内部培训部门，请让他们参与到这项工作中\n* 讲师引导的课程\n* 用户可以根据自己的时间和进度观看的预录课程\n\
  * 列出当前或过去用户提过的常见问题解答（FAQ）列表\n* 包含应用程序信息的 wiki\n\n接下来的章节描述了应该考虑的一些主题。\n\n### 33.4.1\
  \ 计算机基础\n\n如果你的用户对计算机还比较陌生，那么提供基础计算机技能的课程或材料将非常有价值。如果可能，请强调在使用应用程序时所需的计算机技能。例如，复制和粘贴操作，创建和更新电子表格，或搜索概念。\n\
  \n### 33.4.2 新用户应用程序基础\n\n如果该应用程序有较多的新用户，那么针对新用户设计的课程或材料将特别有价值。任何帮助他们快速进入状态的内容都是有用的。为新用户提供扎实培训的额外优势是，他们不太可能因为提问而干扰同事。\n\
  \n### 33.4.3 针对现有用户的高级主题\n\n一旦为用户开发了教育材料，就可以考虑高级用户了。\n\n## 建议\n\n## 摘要\n\n本章提供了一些之前章节未涵盖的建议。\n\
  \n### 关键词\n\n本章提供了一些之前章节未涵盖的建议。\n\n## 34.1 不造成伤害\n\n准则之一是“首先，不造成伤害”。管理员也应该遵循同样的指南。如果有合理理由认为你正做的某事可能会对系统造成伤害，请不要这样做。在以下情况下：\n\
  \n* 在开发系统上进行测试。\n* 在更改之前备份所有内容。根据具体更改的内容，这可能意味着制作配置文件的副本或备份数据库。\n* 记录当前设置。例如，你可能需要捕获系统更改前后的截图以及所采取的步骤。\n\
  * 在用户不会受到影响的时间进行此更改。例如，不要在一年中最忙的时期之前进行。\n* 如果环境是虚拟化的（即应用程序运行在虚拟服务器上），查看虚拟化团队是否可以为你创建一个新服务器进行测试。先在沙箱环境中进行更改。如果更改有预期结果，再对生产系统进行更改。\n\
  \n## 34.2 始终尝试掌握驾驶权\n\n人们学习方式各不相同，但人们学习得最好的的一种共同方式是亲手执行操作，而不是看别人做。如果你最擅长通过实践来学习，那么在需要执行某事时，始终尝试做那个“驾驶”的人。通过“驾驶”，我的意思是你应该是那个实际坐在键盘前对系统进行更改的人。这适用于以下情况：\n\
  \n* 当供应商技术人员与你合作安装软件时\n* 当有人正在交交应用程序的支持责任并想向你演示时\n* 当你正与用户合作以理解他们正在经历的问题或错误时\n\n\
  \n\n\n\n- 你可以捕屏并将其粘贴到文档中。如果另人在操作（驾驶），他们可能会在你能够截屏之前更改屏幕。在将截图粘贴到文档时，你也可能错过一些操作活动。\n\
  \n#### 34.2.1 当你是“副驾驶”时\n\n有时你可能无法“驾驶”整个会话。当别人在操作时，你仍然可以从他们那里获得技巧。每个人的做事方式都不同，他们的处理方法可能比你通常操作的方法更好。如果你仔细观察同事、供应商技术人员或数据中心的人员，你可能会学到一些非常有价值的东西。每当你处于有人向你演示屏幕内容的情况时，务要寻找学习更好操作技巧的机会。如果你看到别人做你不理解的事情，不要犹豫，提问。\n\
  \n## 34.3 除非绝对必要，否则使用管理员登录\n\n作为管理员，你将拥有访问应用程序管理员账户的权限。你可能还可以使用 `root` 或超级用户登录服务器。虽然以管理员身份登录应用程序或服务器可能更方便，但你应该避免这种诱惑。使用较低访问权限账户的某些原因包括：\n\
  \n- 由于 `admin` 拥有几乎无限的访问权限，你可能会无意中在应用程序或服务器上进行广泛且无意的更改、删除等。\n- 以 `admin` 身份登录时，你可能会无意中安装病毒、木马、蠕虫或其他形式的恶意软件，并赋予其管理员权限。\n\
  - 如果很多人知道管理员账户密码，那么对于谁做了什么更改的责任判定将非常困难。尽可能以你自己的身份登录，将更容易跟踪谁做了哪些更改。\n\n你不应该自动以管理员账户登录，而应该使用个人账户登录，仅在绝对需要时才使用管理员账户。在这些情况下，你也可以考虑使用以下命令：\n\
  \n- `su`——此命令允许授权用户切换到另一个账户，例如 `root` 账户。你可以以自己的身份登录服务器，然后切换到授权修改应用程序文件或目录的账户。\n\
  - `sudo`——在 UNIX 和 Linux 系统上可用，`sudo` 命令允许授权用户以 `root` 账户或其他指定账户的身份执行命令。它本质上赋予了你\
  \ `root` 账户的力量，但没有一直以 `root` 身份登录的风险。\n- `runas`——在 Windows 系统上，`runas` 命令大致相当于\
  \ UNIX 的 `sudo` 命令。它让你以管理员身份启动命令 shell。\n\n## 34.4 了解你正在做什么\n\n不要养成盲目遵循清单来完成任务或流程的习惯。理解你为什么要执行流程中的每一步。如果你不理解每一步的作用，请向他人请教。学习更多流程知识的潜在来源包括《管理员指南》供应商支持小组、你建立过联系的其他应用程序管理员，或者在你之前支持过该应用程序的同事。\n\
  \n盲目遵循清单的一个巨大危险是，如果发生了异常情况，你将不知道如何应对。根据墨菲定律，这很可能发生在没有人能帮助你的时候。\n\n## 34.5 用简单的方法处理事情\n\
  \n在执行安装或升级等任务时，你可能会发现自己自己在反复地输入相同的值。这些值的示例包括文件名、登录名、密码、服务器名称、应用程序名称等。始终保持一个打开的记事本实例并在其中记录这些值以便复制和粘贴，将有助于避免拼写错误并加快进程。\n\
  \n## 34.6 眼亦金睛\n\n让第二双眼睛来观察问题的价值不言而喻。我数不清在代码段或应用程序配置设置上遇到问题的次数。一直盯着它看似乎只会让问题变得难以解决。当我最终崩溃并请求同事看一看时，他们似乎总能在几秒钟内发现错误。\n\
  \n总会有一个时刻，你自己盯着它看已经没有意义了。一旦达到那个极限，不要害怕寻求帮助。认为寻求帮助是软弱的表现是一个新手的错误。你的同事会非常乐意帮助你，就像他们向你寻求帮助时你乐意他们一样。\n\
  \n如果你是那种绝对讨厌寻求帮助的人，这里有一些技巧可以帮你看到卡住问题的解决方案：\n\n- 休息一下——站起来离开座位一会儿。去喝瓶冷饮料或杯咖啡。让大脑从问题中转移几分钟，通常会让你的思绪大开，然后解决方案就会突然出现在你面前。\n\
  - 去忙其他事情一会儿——这种方法的额外好处是，在你让潜意识处理原始问题的同时保持效率。\n- 睡一觉——如果获取解决方案并不紧急，就睡一晚上解决这个问题。根据我的经验，如果我完全把问题抛在脑后，解决方案似乎会凭空出现。\n\
  - 尝试从不同的角度检查。例如，从下往上读代码。从物理上以不同的方式查看代码或文件可能会让你产生不同的思考，并可能让你看到解决方案。\n\n## 34.7 记录、记录、再记录\n\
  \n如果说所有应用程序管理员应该具备一种品质，我认为应该是记录他们所做工作的能力。今天发生的任何问题或情况将来都可能再次发生。通过在第一次遇到时进行记录，你将使将来重复该过程变得容易得多。如果该情况在几个月或几年内没有发生，情况更是如此。良好的文档还将帮助你的备份人员或继任者处理问题。\n\
  \n尝试在修复某些问题或做出更改后尽快创建文档。等待创建文档的时间越长，记忆就越容易模糊，错误也越容易渗透进文档。理想情况下，你应该在执行活动时截屏并将其粘贴到文档中，附上简短的注释。活动完成后，立即用完整的细节更新文档。完成文档的初稿后，对其进行评审并根据需要进行更新。\n\
  \n如果在文档中加入截图更有帮助，请务必包含尽可能多的截图。确保每张截图都有准确的标签。如果文档中的截图按逻辑、时间顺序出现也会有帮助。开发一个可以重复使用的文档模板，以便你所有的文档都具有熟悉的格式和布局，以及关键信息（标题、描述、创建日期、修订历史等）。\n\
  \n应该记录的情况示例包括：\n\n- 软件安装\n- 应用更新\n- 用户遇到的错误\n- 运行备份过程\n- 将数据从一个环境迁移到另一个环境，例如从 `PROD`\
  \ 迁移到 `QA`\n- 将应用程序设置为单用户模式\n- 修改管理员密码\n- 解锁用户账户\n- 关闭应用程序\n- 启动应用程序\n- 修改配置文件\n\
  - 捕获日志文件发送给供应商支持小组\n\n#### 34.7.1 让你的文档易于查找\n\n\n\n\n\n如果你能快速找到它，那么你保留的任何文档都将更有价值。这里是一些方便你对文档进行搜索的技巧：\n\
  \n- 将你所有的笔记文档保存在已知位置。由于我支持多个应用程序，我为每个应用程序创建了单独的文档子目录。\n- 所有文档文件都应恰当命名。\n- 每份文档内部都应该有一个有意义的标题，最好放在顶部。\n\
  - 包含文档的创建日期和最近的更新日期。\n- 一年后，你可能无法回想起文档中描述某个问题或情况时使用的准确短语。通过在文档中设置“关键词”部分，可以将这种问题降至最低。在该部分中，你可以包含各种可以描述文档主题的短语。这可以让未来的搜索更有效。\n\
  \n## 34.8 保持一致性\n对于`Application Administrator`（应用程序管理员）每天执行的任务，保持一致性绝对是一种美德。一如既往地会导致错误减少并缩短寻找东西的时间。它还将让你的继任者或备份人员的工作变得更轻松。\n\
  \n以下是你保持一致性的一些示例：\n\n- 尽可能在你的每个环境中以相同的方式操作：`DEV`、`QA`、`DR` 和 `Production`。例如，如果应用程序安装在生产服务器的\
  \ `D:\\Program Files\\MyApp` 上，那么在你的所有服务器上都应该这样设置。\n- 配置设置应尽可能相似。一个明显的例外是，服务器名称的值在每个环境中将是不同的。例如，它们可能是\
  \ `app_dev`、`app_qa` 和 `app_prod` 或类似的名称。\n- `IIS` 网站名称应尽可能一致。同样，名称可能需要包含对该网站是开发、`QA`\
  \ 还是生产环境网站的指示。\n- 目录和文件的权限设置在你的开发、`QA` 和生产服务器上应保持一致。\n- 文件命名规范应保持一致。例如，所有的日志文件都应该具有\
  \ `.log` 扩展名。所有的脚本文件都应该具有 `.bat`、`.cmd` 或 `.scr` 扩展。\n- 对于第三方应用程序，你可能无法控制数据库表和列的名称。如果你有影响数据库对象名称的能力，请尝试保持一致。例如，如果有一个存储\
  \ `User_ID` 的列，请在所有数据库表中都一致地命名它。不要在某些表中称为 `User_ID`，在其他表中称为 `UID`，在另一些表中称为 `ID`。任何需要理清表之间关系的人都会感谢这种一致性。\n\
  - 用户名应尽可能一致。例如，你的规范可能是 `fname.lname@email-address`。一旦选定了规范，除非绝对必要，否则不要破例。\n- 将你编写的所有脚本或批处理文件放在所有应用程序服务器的相同位置。例如，在\
  \ `D:\\Scripts` 目录下。\n- 报告名称应具有意义，并指明报告的内容。\n\n## 34.9 任务后立即清理\n在完成安装、升级、导出、捕获额外的日志细节等后，请进行清理。我的意思是，一旦你完成了任务，就应该删除不再需要的文件、日志和子目录。如果你在完成任务后没有立即删除这些文件，你很可能会忘记删除，或者因为忙起来而再也没有回到这项任务。结果将是积累不再需要的旧文件。它们除了困扰你和占用磁盘空间外别无用处。在某个时刻，当你被迫回来清理文件时，将花费更长的时间来理清一切，并确定哪些可以删除，哪些需要保留。\n\
  \n## 34.10 始终检查你的垃圾邮件文件夹\n如果你缺少来自以下任何来源的电子邮件，请始终检查你的垃圾邮件文件夹：\n\n- 应用程序服务器\n- 报告服务器\n\
  - 供应商\n- 为供应商工作的支持技术人员\n\n我花费了太多时间试图弄清楚为什么没有收到某些邮件，而实际上它已经发送了，只是被自动移动到了我的垃圾邮件文件夹。最近两个让我吃闭头的的例子是：\n\
  \n- 我无法明白为什么当 `QA` 服务器上的夜间备份过程完成时，我没有收到发出的邮件。我检查了执行备份的任务，发现它执行成功了。进程创建的备份文件存在。任何日志文件中都没有错误。最后，我突然想到查看垃圾箱，它就在那里。我不知道为什么来自开发服务器和生产服务器的相同邮件被接收了，但来自\
  \ `QA` 服务器的邮件却被重定向到垃圾箱。这只是生活中的许多谜团之一。\n- 我在等待与我合作解决问题的技术人员的回复。它从未出现过，至少我是这么想的。我收到了供应商支持网站生成的所有电子邮件，但在这种特殊情况下，技术人员从他的公司邮箱账户向我发送了邮件。出于某些原因，我的邮件包认为它是垃圾邮件并将其移动到了垃圾箱。\n\
  \n## 34.11 信任但要验证\n我的不是说要做一个偏执的人，但在许多情况下，验证别人对你说的话是有道理的。\n\n- 如果用户报告应用程序对他们没有启动，或者昨天还能运行但现在不再工作了，在投入时间研究发生了什么之前，你应该自己进行核实。\n\
  - 如果供应商提供了你下载文件网站的登录详情，你应该在收到这些详情后验证这些详情是否能让你登录。如果它们不能让你进入，最好尽快向供应商反馈。\n- 如果供应商告诉你某些更改不会影响用户或不会导致系统崩溃，你需要在\
  \ `Production` 上进行更改之前，先在 `DEV` 或 `TEST` 系统上验证这一点。没有人是完美的，包括供应商技术人员也不如此。\n\n## 34.12\
  \ 不要用你的账户下运行调度任务\n如果你在应用程序服务器上调度了任务，不要让它们在你的个人账户下运行。如果尚存在此类活动的账户，请为此任务创建一个服务帐户。不使用你的个人账户的原因包括：\n\
  \n- 你的账户密码需要每 30、60 或 90 天更改一次。当你更新密码时，你还必须记住在存在调度任务的所有应用程序服务器上更新它。如果你忘记在某个服务器上更新密码，那么调度在该服务器上的任何任务在下次运行时都会失败。\n\
  - 如果你辞职或被解雇，你的账户将被禁用。下次使用你账户的该任务运行时将失败。\n- 除了你之外，没有其他人可以在不知道你密码的情况下修改任务的详情。行业最佳实践是不共享个人账户的密码。\n\
  - 如果你的应用程序经过审计，这可能会被发现，然后你会被要求解释为什么选择这种方式。使用你的账户真的没有正理由，所以这个问题可能会变得非常尴尬。\n- 当你生病或休假时，你的备份可能需要你的密码来更改任务。\n\
  - 从相反的观点来看这个问题，意味着你组织中的其他某人在调度任务时使用了他们的账户。如果任务运行失败，那么在不知道他们的密码的情况下，你无法修改。\n\n##\
  \ 34.13 不要试图掩盖你的错误\n\n\n\n\n\n每个人都会偶尔犯错。最终，你在担任应用程序管理员期间也难免会犯错。根据我的经验，最佳行动方案是承认错误、纠正它，然后继续前进。承认自己搞砸了可能很丢脸，但包括你的老板在内的每一个人都曾犯过错。你最近的错误并不是第一次，我能保证这不会是你的最后一次。\n\
  \n比犯错更糟糕的是试图用谎言来掩盖。永远不要忘记，许多人因为掩盖行为而遭受的惩罚往往比原始错误更严重。你可以想想理查德·尼克松，以及其他政治家、商业高管和一位著名的家居装饰大师。\n\
  \n## 34.14 充分利用供应商技术人员的作用\n\n在你担任应用程序管理员期间，你将花费大量时间与供应商支持小组的技术人员通话。你将希望尽一切办法从与他们共处的时间中获得价值。关于最大化与供应商技术人员会话学习潜力的建议包括：\n\
  \n*   如果你正在进行共享终端会话，务必由你来主导。这可以确保会话按照你的节奏运行，而不是他的或她的。他们可能对正在执行的步骤非常熟悉，以至于忘记并不是每个人都像他们那样熟悉该应用程序。\n\
  *   如果你正在进行共享终端会话，在执行步骤时要截图并将其保存到文档中。告诉技术人员你正在做什么，这样他们就能理解你在将截图粘贴到文档并保存时产生的时间延迟。\n\
  *   如果不理解某个步骤或命令，务必询问正在发生什么。不要因为不想表现得无知就假装理解。显而易见，技术人员对应用程序的了解远比你多。不要为这个事实感到羞愧。\n\
  *   始终询问供应商技术人员他或她是否有关于你所操作内容的“备用清单”、抄本或内部文档。询问你可能会得到一些东西，也可能得不到，但值得一试。如果他们有这样的文档，那么它可能比“官方”版本更有价值。\n\
  \n## 34.15 事情总是比预期的要长\n\n根据我的经验，生活中大多数事情花费的时间比你预想的要长。这包括烹饪、清洁和汽车维修。修复应用程序也属于这种情况。安装需要更长时间、导出需要更长时间、解决问题需要更长时间，与供应商技术人员预约的时间也比预期要长。\n\
  \n如果任务有硬截止日期，而你等等到最后一刻才开始，那么你几乎会错过截止日期。所以一个非常明智的建议是做出合理的进度估计并尽早开始。\n\n## 34.16 结语\n\
  \n过去 6 年的应用程序管理员对我来说是一段非常棒的经历。我在职业上有所成长，学习了公司的运作方式，与一些非常专业的人士合作过，并希望帮助了许多用户。我希望你应用程序管理员的职位能像我当年一样带给你成就感。\n\
  \n我在高效的应用程序管理员身上看到过许多特征。我认为以下特质贡献了他们的（并希望也有我的）成功。这些特质可能对你的职业生活也有帮助：\n\n*   愿意为用户付出额外努力\n\
  *   保持积极的态度\n*   对自己的行为负责\n*   保持好奇心\n*   愿意学习处理事务的新方法\n*   总是乐意帮助同事\n\n# 索引\n\n\
