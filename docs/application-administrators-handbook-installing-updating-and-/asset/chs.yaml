  \n图 14.8 `Administrator`组中某个组的成员。\n\n### 14.4.2 执行漏洞评估\n\n漏洞评估是识别应用程序环境中的漏洞的过程。漏洞被定义为系统中的弱点或缺陷，允许攻击者或内部人员以不受允许的方式访问系统。执行评估的目的是在坏人发现并利用它们之前识别并修复漏洞。\n\
  \n执行漏洞评估并不是大多数管理员能够胜任的工作。要很好完成，需要具备丰富的技能和经验。此外，运行评估的人员需要像黑客一样思考。没有这些技能和观点，评估很难发现所有存在的漏洞。在许多组织中，安全团队会运行漏洞评估，并向每个应用程序管理员提供评估结果。\n\
  \n在漏洞评估期间需要检查的漏洞简短列表包括：\n\n* 缓冲区溢出\n* 输入验证错误\n* SQL 注入漏洞\n* 权限提升\n* 跨站脚本 (XSS)\n\
  * 默认账户或密码的存在\n* 用户对社会工程攻击的敏感性\n* 拒绝服务 (DoS) 攻击\n* 弱密码\n* 已知的弱软件版本\n* 缺少应该应用的关键补丁\n\
  * 系统存在恶意软件\n* 服务器上存在来源的软件（即你无法判断其是否来自可靠来源）\n* 整数溢出或回绕\n* 未加密敏感数据\n\n有许多工具可以帮助执行漏洞评估。其中许多是开源的，另一些是可以从开发者处购买的专用工具。这些工具的示例包括：\n\
  \n* `Nessus`\n\n\n\n\n\n- OpenVAS\n- SARA\n- SAINT\n- Core Impact\n- Metasploit\n\
  - Microsoft Baseline Security Analyzer\n- Retina\n- Nmap Security Scanner\n\n###\
  \ 14.4.3 确认谁拥有应用程序的访问权限\n\n所有应用程序的用户都会发生变化。人员离开了组织，其他人获得了晋升或更换了工作。由于人员变动频繁，当这些用户离职时，很容易忘记删除其对应用程序的访问权限。定期检查访问应用程序的用户列表，是确认没有意外遗留某些人已不再需要的访问权限的一种方法。\n\
  \n大多数应用程序都提供一份报告或界面，列出所有用户及其访问级别。可以使用此类列表来确认谁仍然应该拥有访问权限。如果应用程序记录了每个用户的主管，那么按主管对报告进行拆分，并让他们确认其下属的每个人是否仍然需要访问权限。如果应用程序记录了每个用户在添加到系统时是由谁批准的，那么应该与这些批准人联系，以确认列表上的每个人是否仍然需要对应用程序的访问权限。\n\
  \n除了确保删除前用户的访问权限外，您还需要确认用户拥有完成工作所需的最小访问级别。例如，某人可能更换了职位，不再需要对应用程序的写入权限。可以使用季度审查来验证其访问权限是否已得到适当更改。\n\
  \n在某些组织中，您可能不想删除用户。在这种情况下，您可能希望禁用和/或锁定用户账户。任何可以使账户无法使用的操作都可以。可能的原因包括：\n\n- 用户可能长时间不使用应用程序，但以后会回来，并需要相同的账户\n\
  - 从系统中删除用户可能会违反您的审计标准\n- 从应用程序中删除用户可能还会删除他们创建或编辑的对象。\n\n## 14.5 年度任务\n\n日历的更替是审查您的应用程序相关元素的自然时间。这里列出了至少每年应审查一次的项目。\n\
  \n### 14.5.1 审查您的灾难恢复计划\n\n第 12 章关于“灾难恢复”的内容描述了您的 `DR` 计划需要定期审查和更新的原因。每年审查一次此计划是一个很好的间隔。对于某些业务领域的组织，这也是一项要求。\n\
  \n### 14.5.2 测试您的灾难恢复计划\n\n第 12 章关于“灾难恢复”的内容也解释了为什么测试您的 `DR` 计划非常重要。每年执行此测试的频率足以保持其准确性，但又不会过于频繁而变成负担。\n\
  \n### 14.5.3 验证未使用的内容\n\n每个应用程序的使用模式都会随时间而变化。定期，您需要审查应用程序是如何被使用的，以及某些部分是否可以丢弃。例如，如果某个报告已经一年或以上没有运行或被请求，那么它很可能被丢弃。\n\
  \n如果您发现应用程序的整个组件未被使用，那么您可能考虑关闭它们。如果这些组件带有额外的成本，那么通过更新您与供应商的合同，您可能会获得显著的节约。\n\n即使这些组件没有额外成本，关闭未使用的组件也是最佳实践。这样做可以减少系统的资源消耗，并减少入侵者可能在您的环境中利用的攻击面。\n\
  \n### 14.5.4 从备份磁带中重构系统\n\n日常任务之一是确认备份过程是否成功。这种验证是绝对必要的，但并不是需要执行的唯一测试。终极测试是使用您的备份文件或磁带重新创建系统。在计划此活动时，显然您将在\
  \ `DR`、`Test` 或 `DEV` 环境中进行，而不是在您的 `Production` 环境中。\n\n此活动在计划时，显然您是在非生产环境进行的。这项活动需要一份计划。编写此计划将迫使您思考如何重构系统。拥有此计划将帮助您准确地了解步骤来重构它。当您真的需要从备份磁带重构系统时，您将非常感激有此信息。\n\
  \n### 14.5.5 验证输入输出\n\n如果您的应用程序需要输入流（例如文件），或创建发送到其他系统的输出流，那么您需要定期确认这些是否仍然需要。这些输入输出的需求是否存在？这些功能是否已被应用程序或系统取代？对这些问题的回答可能表明这些流可以丢弃。在与\
  \ `Business Owner` 确认后，确保对应用程序环境进行了此类更改。如果一年后有人查阅为什么某个输入或输出被终止了，您希望确保已记录了此类更改。\n\
  \n### 14.5.6 审查谁在提供支持\n\n应用程序管理员以及用户都会发生位置变化。定期，您需要审查谁作为您的备份支持该应用程序。以下是需要回答的问题：\n\
  \n- 去年作为您备份的人员仍在组织中吗？\n- 他/她是否仍在同一职位？\n- 他/她是否接受了与应用程序相关的充分培训？\n- 他/她最后一次升级是什么时候？\n\
  - 他/她最后一次处理用户问题是什么时候？\n\n如果上述任何问题的答案是“否”或“长期没有”，那么您需要认真检查您的备份人员。现有的备份人员需要额外的培训，或者需要在应用程序上花费更多时间，否则可能该换一个人了。\n\
  \n如果您是另一个应用程序的备份应用程序管理员，您应该审查自己支持该应用程序的能力。如果您在过去的一年中没有投入过任何“高质量”的时间进行工作，那么您需要回到一线。\n\
  \n### 14.5.7 执行回归测试\n\n在对应用程序进行每次重大更改后，都需要进行测试，以验证更改是否引入了问题。这种测试的形式被称为回归测试。\n\n\
  定期对回归测试进行审查，以确保它仍然具有意义。如果它不能反映应用程序的使用情况，则需要更新。每年与应用程序的 `Business Owner` 至少审查一次，应确保它仍然能够充分测试应用程序并捕捉已引入的问题。\n\
  \n### 14.5.8 硬件\n\n软件不是应用程序唯一需要定期审查的组件。构成应用程序环境的硬件也需要定期审查。主要的审查领域是确保您所有文档中对硬件的引用都是准确的。例如，在您的布局图和\
  \ `DR` 文档中，以下内容准确吗？每年检查一次硬件是确保所有文档更新的好良机：\n\n- IP 地址\n\n\n\n\n\n- 内存容量\n- 磁盘驱动器大小\n\
  - 处理器和核心数量\n- 网网络接口卡 (NICs) 数量\n- 硬件的物理位置\n- 负载均衡器\n- 防火墙\n\n您的服务器（们）是否提供了用户群所需的性能？如果未能满足用户需求，是否可以通过升级或补充环境硬件来改善状况？定期审查应用程序的性能（理想情况下要及早，以便将任何硬件升级纳入年度预算中）是解决这一潜在问题的一种方法。\n\
  \n#### 14.5.8.1 硬件寿命结束\n\n您的硬件是否已经达到了寿命终点或者正快速接近终点？所有服务器都会达到继续使用不再具有经济效益的节点。企业通常计划每\
  \ 3-5 年更换一次服务器。其原因包括：\n\n- 它们不再受到供应商的支持\n- 零件越来越难以获得，即使找到也昂贵\n- 新服务器的能源效率更高。这为了更有效地利用数据中心的有限资源是必要的。\n\
  - 新服务器性能更强，这为了跟上应用程序使用量的增长是必要的。\n\n## 14.6 按需执行的任务\n\n并非所有任务都需要按照定期计划执行。某些任务需要根据需要执行。在某些情况下，你似乎忙于处理这些任务，而在另一些时候你可能很长时间没有处理过它们。本节列出了此类任务的示例。\n\
  \n### 14.6.1 用户账户\n\n支持应用程序意味着与用户打交道。应用程序的地位越高或越重要，用户可能越多。后续章节列出了一些需要处理的用户相关问题。\n\
  \n#### 14.6.1.1 添加用户\n\n在应用程序可以使用之前必须完成的任务之一是创建用户账户。\n\n谁来处理这项任务？这完全取决于您的组织。可能包括：\n\
  \n- 应用程序管理员\n- 帮助服务台 (Help Desk)\n- 超级用户\n\n无论由谁处理，创建新用户都需要特定的信息。开发一个纸质表格、电子邮件模板或网页，其中应包含所有所需信息的字段。在创建账户之前需要提供的某些细节包括：：\n\
  \n- 用户名称\n- 员工 ID 号\n- 网络 ID，例如 `Jason.Smith@mycompany.com`\n- 电话号码\n- 电子邮件地址\n\
  - 谁授权了他们的访问\n- 用户的主管\n- 请求的用户角色，例如：读者、写入者、审批者、主管等\n- 用户所属的组织\n- 用户所属的部门\n- 用户所在的国家\n\
  - 地区或州\n- 默认语言\n- 偏好的日期格式\n- 偏好的数字格式\n- 此人是员工、承包商、顾问、实习生、临时人员等吗\n- 何时创建账户？\n- 用户启动应用程序时看到的默认屏幕\n\
  \n在创建用户账户时，确保使用一致的命名规范。例如，可以使用以下任何格式为用户 Kelly C. Bourne 创建账户：\n\n- `kbourne`\n-\
  \ `KBourne`\n- `kcbourne`\n- `KCBourne`\n- `kellybourne`\n- `KellyBourne`\n- `Kelly.Bourne`\n\
  - `Kelly.Bourne@mycompany.com`\n\n比选择确切格式更重要的是一致地使用所选的格式。\n\n名称冲突是多个用户的名称被翻译成相同的用户名时发生的问题。例如，如果您的命名规范是名字首字母加姓氏，那么\
  \ John Smith 和 Jerome Smith 就会发生名称冲突，即他们都是 `jsmith`。\n\n处理名称冲突的一种方法是在新用户的名称后添加数字。第二个添加的\
  \ J. Smith 将获得用户名 `jsmith2`，它不会与 `jsmith` 冲突。处理该问题的更好方法是使用用户的电子邮件地址，例如 `jerome.smith@companyname.com`。由于电子邮件地址必须是唯一的，你通过利用他们已经分配的标识符解决了自己的问题。\n\
  \n#### 14.6.1.2 移除用户\n\n正如你需要添加许多用户一样，你必须定期移除或停用他们。出于多种原因需要移除用户。他们可能辞职了、被解雇了、改变了职责、转到了新地点等。这些原因任何一个都会导致他们不再需要访问该应用程序。\n\
  \n如果你是移除或停用用户账户的人，那么当用户不应再拥有访问访问时，你将如何获得通知？\n\n- 你会收到电子邮件吗？\n- 电话吗？\n- 每周或每月的离职报告吗？\n\
  - 当你在休息室拿咖啡时，贴在显示器上的便利贴吗？\n\n及时移除用户可能对您的组织安全至关重要。\n\n- 数据是机密的吗？\n- 您想让前员工拥有访问权限吗？\n\
  - 您想让不满的用户拥有访问权限吗？\n- 应用程序可以从防火墙外部访问吗？\n- 员工可以通过 VPN 访问应用程序吗？\n\n希望这些问题会让您意识到尽早终止应用程序访问是多么重要。\n\
  \n#### 14.6.1.3 LDAP 和 SSO\n\n如果您目前正在使用 `LDAP`（轻量级目录访问协议）或 `SSO`（单点登录），或者计划最终使用它们，您应该定义您的命名规范以便与之兼容。如果为了实施\
  \ `LDAP` 而更改所有名称，将非常耗时。\n\n使用 `LDAP` 和 `SSO` 进行用户验证的两个优势是：\n\n1. 用户不需要记住另一个登录应用程序的账号密码。他们只需使用网络登录密码。如果您设置了\
  \ `SSO`，那么用户登录网络后即可访问应用程序。\n2. 如果用户离开公司，`LDAP` 团队负责从 `LDAP` 数据库中删除其姓名。从那时起，这些凭据将无法登录您的应用程序。相同的安全访问适用于\
  \ `SSO`。\n\n#### 14.6.1.4 用户账户问题\n\n用户不可避免会遇到账户问题。您需要流程和政策来处理这些不可避免的情况。您可以预期的一些问题包括：\n\
  \n- 谁可以重置用户账户密码？\n- 如何验证确实是用户请求更改密码？\n- 谁可以解锁由于闲置、登录尝试次数过多而被禁用的账户？\n- 谁可以授予用户额外的应用程序权限？\n\
  \n政策需要预定义用户在遇到问题并寻求帮助时需要做什么。例如：\n\n- 应该联系谁\n- 应如何提交请求，例如：通过电子邮件、电话、填写表单等\n- 这些问题何时可以处理，即：正常工作时间还是\
  \ 24×7\n- 解决方案将多快反馈给请求者\n\n### 14.6.2 软件升级\n\n补丁可以在某种程度上定期发布，但升级的间隔是不可预测的。好消息是，通常发生得并不频繁。坏消息是，安装它们可能耗时。更糟糕的是，当发布新版本时，可能会有快速获取并安装它的巨大压力。\n\
  \n\n\n\n由于你无法预测何时何时会发布更新，因此很难安排时间以确保你有空闲安装它们。当更新发布时，你能做的最好的做法就是尽可能快速阅读发布说明，以估算安装它需要投入多少工作量以及安装的紧迫性。如果运气不错，供应商提供的更新通常比较一致，因此上一次更新花费的时间可以作为本次更新所需时间的一个良好参考指标。\n\
  \n## 14.6.3 任务调度\n\n许多（如果不是大多数）应用程序都有需要调的任务。通常，这些任务是在应用程序最初安装时设置的。偶尔，在应用程序运行后，可能需要添加新的调度任务。好消息是，这通常只需要几分钟就能设置完成。\n\
  \n通常调度哪些类型的任务？它们可以像组织所使用的应用程序一样多种多样。这里列出了几个示例：\n\n• 备份\n• 自动重启应用服务\n• 创建报告\n• 创建输出文件\n\
  • 获取和/或处理输入文件\n• 清理旧文件\n• 日志扫描\n• 检查磁盘可用空间\n• 处理挂起的进程\n• 对系统事件做出反应\n\n### 14.6.3.1\
  \ 重启应用程序\n\n如果服务器由于任何原因重启，应用程序是否应该自动启动？许多应用程序已经做到了，例如，组成应用程序的一个或多个服务由操作系统自动启动。\n\
  \n如果你的应用程序没有自动重启，你可能需要编写一个批处理文件或脚本来处理此。对于运行在 Windows 服务器上的应用程序，你可以在 `Task Scheduler`（任务计划程序）中创建一个任务，并设置为在系统重启时运行。该脚本将启动应用程序。\n\
  \n### 14.6.3.2 刷新（重启）应用程序\n\n应用程序是否需要定期停止并重启（刷新）？可能需要这样做的原因之一是回收由于应用程序内存泄漏丢失的 RAM。\n\
  \n## 14.6.4 启动和关闭应用程序\n\n所有应用程序都必须定期关闭并重新启动。这可能是因为发生了问题、为了维护、创建备份或安装更新。你必须对在任何情况下如何安全地关闭应用程序并重新启动它具有丰富的经验。\n\
  \n关闭的原因可能是另一台服务器。如果数据库服务器需要进行维护，应用程序是否可以继续运行？如果不能，那么它需要停止，直到数据库再次可用。\n\n当你需要关闭应用程序时，你需要联系谁？谁需要批准停机？谁需要被停停机？确保他们的联系方式随时可用。如果主要联系人不在了怎么办？备用人员是谁，你如何联系他或她？\n\
  \n### 14.6.4.1 临时禁用监控\n\n如果你的环境包含 `OpenView`、`SolarWinds` 或 `Nagios` 等监控工具，那么每当应用程序停止或启动时都会发送警报。发送假报警通常是一个坏主意。它们要么导致人们对不存在的问题做出反应，要么训练他们忽略来自监控工具的所有警报。\n\
  \n当你准备关闭或启动应用程序时，你可能希望临时禁用正在进行的任何监控。监控工具是否有“维护模式”，可以临时停止对服务器的监控？如果是，那么每当你准备停止或启动应用程序时，请务必利用这一点。在你为任何涉及停止或启动应用程序的活动编写文档时，也应该包含一个禁用监控的步骤。\n\
  \n## 14.6.5 让用户退出！\n\n有时你可能需要让所有用户都退出应用程序。这可能是出于任何原因。你可能正在：\n\n• 在应用程序内执行需要“单用户模式”的功能\n\
  • 应用升级\n• 创建备份\n• 从之前捕获的备份中恢复\n\n是否有方法查看用户当前是否在应用程序中？我支持过的几个应用程序都有确定此点的方法，每种方法都不同。一个应用程序为管理员提供了一个专门用于此目的屏幕。图\
  \ 14.9 是该功能的截图。它显示了哪些用户当前在应用程序中。\n\n![image](img/F000145f14-09-9780123985453.jpg)\n\
  \n图 14.9 应用程序用户列表的一个示例。\n\n我支持的另一个应用程序具有命令行界面，可以提供当前登录用户列表。图 14.10 显示此命令的输出。\n\n\
  ![image](img/F000145f14-10-9780123985453.jpg)\n\n图 14.10 应用程序中列出用户的第二个示例。\n\n我支持的第三个应用程序在确定用户是否在应用程序方面的方法要笨得多。你必须打开特定的日志文件，移动到末尾，并向后搜索登录和注销条目。如果你找到了匹配的登录和注销条目，则表明一个用户登录后注销了。如果你找到了一个没有匹配注销条目的登录条目，则表明用户仍然登录在应用程序中。不用说，此应用程序在这方面的能力比前两个示例方便得多。\n\
  \n描述这些多样化方法的目的是强调每个应用程序都是不同的。你支持的应用程序可能有方便的方法识别登录用户，可能有一种笨拙的方法，也可能根本没有方法。你需要在执行它之前学习它是怎样的并熟悉它。\n\
  \n一旦你知道用户当前是否登录了应用程序，你就需要知道如何强制他们退出。可以踢出用户吗？正常流程是什么？是否有踢出用户的紧急流程？即使用户登录也能关闭应用程序吗？你需要在现实情况下执行它之前知道如何做这些事情。\n\
  \n## 14.7 重复性活动的清单\n\n每个应用程序管理员都有一个他们执行多次但并不频繁到至于变成本能的任务列表。对于此类活动，在执行时有一个可以参考的清单是非常主意。清单不需要解释为什么要执行特定步骤，只需要做什么以及操作顺序。每季度或每年执行一次的活动似乎是清单刷新记忆的明显候选者。\n\
  \n你可能执行的符合清单要求的活动包括：\n\n• 添加或删除用户\n• 添加或删除客户端\n• 添加或删除报告\n• 添加或删除业务单元\n• 修改应用程序中用户的访问权限\n\
  • 为应用程序创建新管理员\n• 创建备份\n• 从备份恢复\n• 将备份数据从 PROD 迁移到 QA 或 DEV\n• 将应用程序复制到新服务器\n• 在升级应用程序后恢复自定义更改\n\
  • 升级后需要测试的事\n\n创建清单还有另一个价值的用途。你可以把它给你的备份人员或替补人员，让他或她处理你的一部分职责。这是帮助他们在受控范围内获得支持应用程序经验的另一种方式。\n\
  \n\n\n\n# 应用及其数据必须是安全的。\n\n本章描述了可以采取的步骤，以帮助确保应用程序及其数据尽可能安全。一些步骤包括：将用户放入适当的安全组中、移除离开组织的用户、限制对服务器的访问、应用最小权限原则、不共享账户、强制使用强密码、控制管理员帐户、应用补丁、关闭未使用功能以及关闭未使用的端口。\n\
  \n### 关键汇\n\n安全；认证；LDAP；SSO；离职用户；安全组；VPN；共享账户；测试账户；密码；国家漏洞数据库；ACL；日志文件；加密；防火墙；端口；SSL；HTTPS；黑客；社会工程；渗透测试\n\
  \n安全是一个历程，而非终点。作为应用程序管理员，你将与组织内的其他 IT 专业人员、供应商，以及理想的应用程序用户社区合作，以确保应用程序是安全的。这是一个至关重要的领域但在传统上往往被低估。你将有机会学习许多\
  \ IT 安全知识以及你的组织是如何实施它的。\n\n如果你的组织设有安全组，那么他们将负责本章描述的许多活动。某些与安全相关的步骤是特定于应用程序的，由你负责。另一些将由组织内的系统管理员或\
  \ DBA（数据库管理员）处理。\n\n如果你的组织没有安全组，那么所有与安全相关的责任可能都落在你的肩上。在这种情况下，你和其他任何其他 IT 专业人员应该向管理层强调安全的重要性，并请求创建和填补安全职位。如果你的诉求没有得到重视，你就必须利用资源（如本书，以及其他专注于\
  \ IT 安全的书籍）来提供你能提供的最佳安全保障。\n\n关于安全，你必须吸收的一个绝对关键点是：它不是一次性的事件或活动。你必须不断审查安全威胁、策略、设置、补丁级别、日志文件等。针对你的网络、服务器和应用程序的威胁在不断演变，你的响应也必须不断演变。安全是一个历程，而非终点。\n\
  \n## 15.1 用户帐户\n\n大多数计算机安全专业人士可能同意，人类是目前对计算机系统安全最大的威胁。他们的行为或不作为可能并非恶意的，但经常会让系统和应用程序暴露在外部的威胁之下。\n\
  \n### 15.1.1 教育\n\n人们通常反感被告知执行耗时且不便的操作。如果他们不理解为什么密码必须具有特定长度，他们就会对反复输入长密码感到反感。如果他们不理解定期更改密码的重要性，他们会尽可能避免这样做。你或安全团队需要向他们普及组织安全策略的重要性。用户需要了解针对你的组织、网络以及他们所依赖的应用程序所面临的威胁。他们可能并不喜欢遵守安全策略，但至少如果他们接受了教育，他们就能理解为什么需要这样做。\n\
  \n与安全一样，教育是一个持续的过程，而非单一事件。某人被录用或开始使用你的应用程序的时间点，是提供安全培训的最佳时机。许多组织要求在向新员工发放应用程序凭据之前，必须完成并掌握某项课程。你需要确保培训课程涵盖了保持应用程序安全所需的安全主题。\n\
  \n就像接伤风加强针一样，应该为所有用户提供定期的复习培训。此版本的培训应该包含原始培训的摘要以及关于出现的新威胁的信息。复习培训的频率不应频繁到影响用户完成工作，但另一方面，它需要足够频繁，让用户意识到组织的安全需求。\n\
  \n### 15.1.2 认证\n\n当用户登录应用程序时，通常在获得访问权限之前会进行认证。认证是确认请求访问的用户身份的过程。认证用户有三种主要方式：\n\n\
  1. 他们所知道的，例如密码或 PIN 码\n2. 他们拥有的，例如带有磁条的胸卡或智能卡\n3. 他们所的，例如指纹或视网膜扫描\n\n大多数商业应用程序使用第一种技术。用户通常需要向应用程序输入有效的用户\
  \ ID 和密码以获得访问权限。未来，商业应用程序可能会开始更多地使用另外两种方法，但这尚未确定。这些方法会产生显著的额外成本，而且一些专家并不认为增加的安全级别值得上这笔成本。\n\
  \n执行认证的软件可以嵌入在应用程序中，也可以位于应用程序外部。如果认证过程是应用程序不可或缺的一部分，那么应用程序本身就包含一个用户 ID 列表及其有效密码。这被称为“原生认证”。每当用户尝试登录应用程序时，应用程序中的认证软件就会验证所输入的用户\
  \ ID 和密码是否存在于数据库中。如果存在，则允许用户登录。如果不存在，则登录请求被拒绝。\n\n### 15.1.3 认证的替代形式\n\n两种替代形式的认证，即外部认证是轻量级目录访问协议（`LDAP`）和单点登录（`SSO`）。这些方法让用户登录应用程序变得更加容易。\n\
  \n关键问题是你的组织和应用程序是否都支持 `LDAP` 或 `SSO`。要确定你的组织是否支持这些，请联系网络组、安全团队或其他应用程序管理员。要确定应用程序是否支持这些，请审阅应用程序的《安装指南》或《管理员指南》。如果这些指南没有包含\
  \ `LDAP` 或 `SSO` 的引用，那么你必须联系供应商的支持团队来获取答案。\n\n如果你打算利用 `LDAP` 或 `SSO`，那么应用程序需要调整某些配置设置。通常，这些设置位于\
  \ XML 文件中。例如，应用程序需要知道 `LDAP` 服务器的名称。你需要阅读《安装指南》来识别需要设置的参数。你还需要联系你组织中支持 `LDAP` 的小组，让他们为你提供这些细节。\n\
  \n对我个人而言，我认为 `LDAP` 认证能让你投入获得最大的回报。虽然用户确实需要登录每个应用程序，但他们不需要记住不同的登录名和密码。我认为配置应用程序使用\
  \ `LDAP` 认证要比使用 `SSO` 容易得多。\n\n#### 15.1.3.1 轻量级目录访问协议\n\n\n\n\nLDAP，即`轻量目录访问协议`，经常用作所有用户信息的中心存储库。当使用\
  \ `LDAP` 验证用户时，应用程序会像通常一样提示用户输入登录和密码。从用户处接收到这些值后，应用程序将其传递给 LDAP 模块，由该模块在中心数据库中进行验证。在微软服务器上，由于该中心数据库通常是\
  \ `Active Directory`（简称 `AD`）。如果信息有效，应用程序将允许用户登录。如果无效，应用程序将拒绝登录尝试。无论何种情况，用户都不会察觉到使用了外部进程来执行身份验证。\n\
  \n如果使用 `LDAP`（或 `SSO`）来验证用户，应用程序管理员仍然需要在应用程序内部创建一个账户，并为其分配适当的访问权限、启动屏幕等。不同之处在于，该账户被标记为使用\
  \ `LDAP` 或 `SSO` 验证，而不是原生验证。因此，该账户需要在 `LDAP`（或 `SSO`）和应用程序中同时存在并处于激活状态。如果账户在其中任何一个位置被禁用，则用户将无法登录应用程序。\n\
  \n#### 15.1.3.2 单点登录\n\n`SSO`，即`单点登录`，是一种允许用户登录组织网络的方法，从该点开始，他们就可以自动访问其他应用程序，而无需登录每一个。他或她只需启动应用程序，但永远不会看到登录界面。\n\
  \n可用的一些常用 `SSO` 实现方式包括：\n\n- `Kerberos` 票据授予 (`TGT`)\n- 一次性密码 (`OTP`) 令牌方法\n- `安全断言标记语言`\
  \ (`SAML`)\n\n#### 15.1.3.3 LDAP 和 SSO 的优势\n\n将 `LDAP` 或 `SSO` 作为应用程序的身份验证方法有许多优势。这里列出了其中：\n\
  \n- 如果使用网络凭据访问应用程序，则用户无需为他们使用的每个应用程序记住单独的登录名和密码。用户登录的应用程序越多，这一优势就越重要。\n- 如果用户离开了组织，如果使用的是原生验证，则需要在其有访问权限的每个应用程序中禁用其账户。如果应用程序使用\
  \ `LDAP` 或 `SSO`，则在 `Active Directory`（`AD`）中禁用其账户即可通过一次操作将他或她排除在每个应用程序之外。应用程序管理员最终想要删除已禁用的账户，但立即删除并不是关键的。\n\
  - 如果用户忘记了网络密码，他或她可以联系像 `Help Desk` 这样的中心小组来重置，而不是请求应用程序管理员重置。`Help Desk` 24/7 运行的可能性比应用程序管理员大，因此用户可能更快重置密码。\n\
  - `LDAP` 和 `SSO` 允许比某些应用程序更严格的密码控制。例如，要求用户定期更改网络密码，通常为每 30、60 或 90 天一次。\n\n####\
  \ 15.1.3.4 LDAP 和 SSO 的缺点\n\n任何技术的进步都有其缺点，通过 `LDAP` 或 `SSO` 进行身份验证也不例外。这里列出了一些缺点：\n\
  \n- 如果用于身份验证的中心数据库（通常是 `Active Directory`）由于任何原因不可，则任何依赖 `LDAP` 或 `SSO` 的应用程序将无法验证用户。在相应的中心数据库再次可用之前，所有用户的登录尝试都将失败。出于原因，某些应用程序供应商建议设置一个不使用\
  \ `LDAP` 或 `SSO` 验证的管理员账户。\n- 并非所有第三方应用程序都设计用于与 `LDAP` 或 `SSO` 验证配合。你的组织可能某些依赖 `LDAP`\
  \ 或 `SSO` 的应用程序，而另一些不是。这会让用户感到困惑，并为应用程序管理员和安全团队带来额外的挑战/工作。\n- 如果用户的网络密码被破解或其他通过方式已知，那么使用\
  \ `LDAP` 或 `SSO` 验证的每个应用程序（包括你的）都会受到威胁。\n- 从原生验证转换为 `LDAP` 或 `SSO` 验证可能需要更新你应用程序中每个用户的配置文件。\n\
  - 并非所有的实现都允许 `LDAP` 或 `SSO` 支持来自不同域（例如北美、欧洲、亚洲等）的用户。这是你在从原生验证转换之前需要确认的。\n- 如果某个特定用户没有网络账户（例如承包商、供应商、外部客户等）怎么办？`LDAP`\
  \ 或 `SSO` 验证可能对这类用户不起作用。\n- 实现任何一种都需要在应用程序内进行配置更改。\n- 如果你选择使用 `SSO`，可能需要购买并安装额外的软件。\n\
  \n### 15.1.4 离职用户\n\n用户不会永远留在组织内，这是一个生活事实。用户经常会退休、辞职、被解雇、被裁、换工作甚至去世。当此类事件发生时，他们对应用程序的访问权限需要终止。\n\
  \n谁负责禁用其访问权限的责任对所有人来说必须清晰。以下问题需要在你组织的策略中明确记录：\n\n- 当用户提交辞职信时，`HR`（人力资源）是否会就此发起请求或公告？\n\
  - 他们的主管会提交终止访问的请求或通知吗？\n- 在员工提交辞职信或最后工作日是否关闭访问？\n- 你的组织如何知道此人访问哪些应用程序？这是否有记录？\n\
  - 他有访问的应用程序使用的是原生验证、`LDAP` 还是 `SSO`？\n- 如何通知应用程序管理员禁用账户？邮件、报告还是电话？\n- 应用程序管理员多快收到员工离职的通知？实时、当天结束、每周还是每月？\n\
  - 谁来移除离职员工的访问权限？`HR`、`Help Desk`、其主管、应用程序管理员、`Active Directory` 团队、网络团队、安全团队，还是上述人员的组合？\n\
  \n仅仅因为前员工不再走进公司大门，并不意味着他们无法再次访问应用程序。该应用程序可以在公司网络之外访问（即通过 `Internet`）吗？如果离职员工的访问权限未被禁用，后果如何？他们会访问敏感信息吗？他们可以修改敏感信息吗？\n\
  \n他们所有的账户都需要尽快禁用。上一句中的“所有”并不是拼写错误，因为用户对于某个应用程序可能有多个账户。例如，他们可能在以下服务器上有账户：\n\n- `Production`\
  \ 服务器\n- `DEV` 服务器\n- `Test` 服务器\n- `DR`（灾备）服务器\n- `database` 服务器\n\n但工作并不止于禁用他们的个人账户。除了他们自己的账户外，离职员工可能访问过哪些账户？\n\
  \n- 他们是否访问过管理员账户？\n- 他们是否知道上述列出的任何环境中任何测试账户的密码？\n- 他们的同事是否向他们透露过账户密码？\n- 他们是否会知道与应用程序相关的任何数据库账户？\n\
  \n你需要立即更改离职用户可能知过的所有账户的密码。过度谨慎并更改过多的密码总比更改得少要好。\n\n### 15.1.5 安全组与用户\n\n\n\n\n\n\
  在基于 Windows 的计算机中，用户通过在“计算机管理”工具中将用户添加到安全组来授予其对机器的访问权限。要打开此工具，点击“开始 | 管理工具 | 计算机管理”。要查看在此服务器上定义了哪些用户和组，请展开“本地用户和组”文件夹。\n\
  \n要添加用户，右键点击“用户”文件夹并选择`New User`菜单选项。将显示如图 15.1 所示的屏幕。输入用户的详细信息并点击`Create`按钮。\n\n\
  ![image](img/F000157f15-01-9780123985453.jpg)\n\n图 15.1 在 Windows 服务器上添加新用户。\n\n\
  账户创建后，您需要授予其执行某些任务所需的访问权限。可以通过结构化的方式来实现，即将将此用户添加到现有组中，而不是单独为用户授予权限。例如，可以将新用户添加到“读取者”或“写入者”组。\n\
  \n创建具有特定权限集的组并将用户分配给这些组，而不是向单个用户授予相同权限，具有许多优势。这些优点包括：\n\n• 授予权限的工作量较少，因为只需操作一次，即在设置组时。之后，将用户添加到组就非常容易。\n\
  • 它允许更好地看到哪些用户拥有哪些权限。\n• 维护更容易。如果您对组权限进行更改，该组中的所有用户都将自动并立即更新。另一种方法是修改每个用户的访问权限。\n\
  \n要将用户添加到一个或多个组，在“计算机管理”中右键点击该组并选择`Properties`菜单选项。然后点击`Member Of`选项卡。如果您想将此账户添加到新组或附加组，请点击`Add`按钮，输入安全组的名称并点击。图\
  \ 15.2 是将用户添加到 Administrator（管理员）组的截屏。\n\n![image](img/F000157f15-02-9780123985453.jpg)\n\
  \n图 15.2 将用户添加到现有组。\n\n### 15.1.6 限制对服务器的访问\n\n在提到应用程序时，“访问”一词有两个完全不同的含义。第一个含义是对应用程序的访问，即使用它的能力。所有用户都可以访问该应用程序。他们通过调出登录页面并输入凭据来访问它。第二种形式的访问是与运行应用程序软件的物理服务器建立连接的能力。这种类型的访问应限制为应用程序管理员和其他需要访问它以进行维护的\
  \ IT 专业人员。\n\n访问应用程序服务器的人数应该尽可能保持在最低范围内。没有理由让典型的应用程序用户获得服务器的访问权限。在某些情况下，业务所有者或应用程序的高级用户会声称他们需要访问权限来完成工作。这可能准确也可能不准确。要确认这一点，请阅读应用程序的《管理员指南》或咨询供应商的技术支持团队。\n\
  \n这在政治上可能很困难，但最佳实践和常识告诉我们应该让所有用户排除在应用程序服务器之外，尤其是生产服务器。可以远程访问服务器的人越多，某人越可能无意中修改某些内容或导致服务器宕机。如果发生这种情况，那么要确定是谁进行了导致问题的的更改将变得更加困难。\n\
  \n您的组织应该针对以下安全相关问题制定策略。如果不存在控制这些策略，则需要进行定义并达成共识。\n\n一旦策略建立，切切不要违反它们：\n\n• 谁批准在服务器上创建新用户？\n\
  • 谁实际创建了新用户？\n• 谁批准在服务器上创建新组？\n• 每个组中的用户自动获得哪些权限？\n• 是否有人确认每个用户、组和组员是否仍然需要？\n• 是否存在一份列出此服务器上所有用户、组和组员的报告？该报告是否定期运行？\n\
  \n### 15.1.7 远程访问\n\n除非组织拥有一支 24×7 小时的现场团队，否则它很可能允许 IT 人员远程管理应用程序服务器。如果允许远程管理，则需要尽可能安全地进行访问。应强烈考虑以下建议：\n\
  \n• 包含强身份验证方法，如公/私钥对或双因子身份验证。\n• 将限制谁可以远程访问服务器设置为授权用户或命名的 IP 地址。\n• 仅使用提供密码和数据双重加密的协议。例如`SSH`（安全外壳）和`HTTPS`（安全超文本传输协议）。\n\
  • 用于远程访问系统的账户应遵循最小权限原则。\n• 远程授权工具和应用程序应更改默认账户和密码。\n\n### 15.1.8 远程用户的 VPN 访问\n\n\
  VPN（虚拟专用网络）是一种通常用于允许远程用户通过互联网安全地连接到组织网络的技术。所有在远程地点工作的用户都应该使用 VPN 软件，以确保他们的连接和往传的数据免受窥视。在许多组织中，VPN\
  \ 访问是发放得非常的，例如，任何在家里、另一个办公室工作或需要连接到组织网络的人。\n\nVPN 如何运作的细节超出了本书的范围，但有很多网站提供了这些细节。只需说明一旦在计算机上安装了\
  \ VPN，使用它安全地连接到工作站点是很容易。\n\n有很多 VPN 包供选择。VPN 软件有开源和专有的，因此有适用于各种预算的包。常用的：\n\n• `Cisco’s\
  \ VPN Client`\n• `Juniper Network`\n• `OpenVPN`\n• `FreeS/WAN`\n• `LogMeIn Hamachi`\n\
  • `Shrew Soft`\n• `Windows Built-In VPN`\n\n### 15.1.9 所有用户的最小权限\n\n为用户提供最小权限的概念是，为他们提供完成工作所绝对最小的权限集。这样做的目的是尽量减少他们故意或无意对应用程序、数据或组织的破坏。\n\
  \n例如，应用程序定义了某些安全角色如“读取者”、“写入者”和“批准者”。如果用户仅被允许读取现有文档但不修改它们或创建新文档，那么他或她将被分配到`reader`角色。如果读者在`writer`或`approver`组中，他们完全可以完成任务，但他们不需要这些组授予的额外访问。\n\
  \n实施最小权限策略的另一个原因是减少黑客、恶意软件和其他坏分子可能造成的破坏。如果用户的电脑上有恶意软件，那么黑客可能会监控用户的操作。如果用户是读取者而不是写入者或批准者，黑客造成的破坏就会减少。\n\
  \n给应用程序管理员的建议：最小权限的概念不仅适用于用户，也适用于您。当然，作为管理员，您应该知道管理员账户的密码，但这意味着意味着应该一直使用它。如果您正在执行需要管理员账户的操作，请尽管登录。但如果您正在执行并非特别需要管理员账户的操作，那么您应该使用您的普通非管理个人账户登录。\n\
  \n\n\n\n妥善设置授予应用程序访问权限的账户对应用程序安全性具有重大影响。如果从一开始就没有妥善处理账户，那么安全性从第一天起就会受到威胁。\n\n###\
  \ 15.2.1 不应允许共享账户\n\n作为安全最佳实践的一部分，每个用户都应该拥有自己的账户。账户共享会导致用户对其行为不负责的情况。例如，如果数据发生泄露或破坏，共享账户的存在可能会导致你无法识别出作案者。你可能识别出是哪个账户导致了问题，但如果有多个用户经常使用该账户，可能无法确定具体的责任人。\n\
  \n应该反复向你的用户强调，他们绝不能与他人共享账户。某些组织将违反此安全策略视为可导致解雇的违规。这种严格程度可能并不适用于所有组织，但如果发现用户与他人共享账户信息，那么绝对应该有相应的惩罚。\n\
  \n不允许共享账户这一规则中有一个悖论的例外：管理员账户。通常，某些功能只能由该账户执行。如果你的应用程序确实如此，那么你可能不得不将 `account ID`\
  \ 和密码同时给主管理员和备份应用程序管理员。显然，知道此账户详情的人数应保持在最低限。\n\n### 15.2.2 删除或禁用所有不必要的账户\n\n应用程序通常带有默认账户。你可能需要它们，也可能不需要。确保在安装应用程序后的第一步之一是删除或禁用所有不需要账户。如果你需要保留某个账户，请务必更改密码。默认账户的名称和密码在黑客社区中广为人知。如果你让其中任何一个账户处于开放状态，很快就会有人利用你的疏忽。\n\
  \n除了默认应用程序账户外，此建议也适用于包括操作系统和数据库在内的软件。难道没有人知道某个数据库软件包的默认 `ID` 和密码曾是“scott”和“tiger”吗？\n\
  \n### 15.2.3 定义用户组\n\n你应该定义一组用户在应用程序内执行的用户功能。例如，这些功能性角色可以是“读者”、“写者”、“审批者”和“管理员”。一旦定义并审查了这些角色，就可以在应用程序中创建它们。在创建用户账户时，将它们分配给相应的组。将新用户分配到预先定义的角色集中，比为每个新用户授予与角色相关的所有访问权限和权限更快、更准确、也更一致。\n\
  \n定义角色的另一个优势是，如果需要添加或移除角色的权限，可以非常快速地完成。如果必须为组中的每个用户执行此更改，将花费更长时间，而且很可能无法准确执行。\n\n\
  ### 15.2.4 测试账户\n\n你定期定期登录应用程序，并从用户的视角查看它。这可能意味着你拥有的权限比管理员账户甚至比你的个人账户少得多。以这种方式访问应用程序时，你需要一个或多个具有与用户组相同权限的测试账户。\n\
  \n这些账户对于真正验证应用程序是必须的。如果你以 `admin account` 登录，你看到的与用户看到的是不一样的。为了确保测试完全准确，必须在用户所在的同一个用户组内进行。因此，如果你的功能性角色是“读者”、“写者”、“审批者”和“管理员”，那么你应该为每个组创建一个测试账户。理想情况下，每个账户的名称都应清楚地表示它所属的角色。这些测试账户的明显名称可以是\
  \ `test_reader`、`test_writer`、`test_approver` 和 `test_admin`。\n\n负责测试工作的团队应该拥有测试账户的访问权限。这可能是你和其他应用程序管理员，或者是一组因为最优秀、最聪明而被选中的的用户。\n\
  \n一旦测试完成，你需要对如何处理测试账户做出决定。至少，需要禁用它们。如果在不久后还将进行进一步测试，你只需禁用它们。如果在在可预见的未来不再进行测试工作，那么它们应该被彻底删除。\n\
  \n### 15.2.5 服务器管理员账户\n\n在应用程序服务器上拥有管理员权限的人员列表应该是短的。应用程序管理员及其备份人员需要是服务器的管理员。其他取决于你的组织拥有什么样的技术团队。以下团队对拥有应用程序服务器的管理员权限有合法需求：\n\
  \n* 服务器管理员\n* 管理监控软件的团队\n* 管理防病毒软件的团队\n* 网络团队\n* 安全团队\n* 管理 Active Directory 的团队\n\
  * 管理备份软件的团队\n\n### 15.2.6 密码\n\n许多计算机安全专家预测，依靠密码保持账户安全的时代已屈指可数。密码在未来几年可能存在也可能不存在，但目前它们对于保持账户安全至关重要。为了帮助确保这种级别的安全性，你的组织需要制定规定哪些是接受接受密码。以下是应该涵盖的一些点：\n\
  \n1. 可接受密码由什么组成？这包括密码的长度和复杂性。\n2. 密码需要多久更改一次？\n3. 密码何时可以重复使用？\n4. 允许多少次失败登录尝试，达到限制后会发生什么？三次限制是相当常见的。某些应用程序会锁定账户直到管理员解锁。其他则会禁用账户一段可配置的时间，例如\
  \ 1 或 2 分钟。\n5.  所有失败的登录尝试都需要记录记录。\n6. 新用户在首次登录时强制更改密码。\n7. 用户被强制每 30、60 或 90 天更改一次密码。\n\
  8. 谁有权限更改密码和/或解锁账户？\n\n#### 15.2.6.1 强密码\n\n许多应用程序可以配置为强制上述列表的前六点。检查《管理员指南》以确定你的应用程序如何处理密码。经常验证密码的应用程序通常允许管理员实施类似的设置，以强制用户使用强密码：\n\
  \n* 最小长度\n* 要求密码中至少包含一个大写字母和一个小写字母\n* 要求密码中包含一个字母、数字和一个特殊字符\n* 之前使用过的密码在若干天数内不能重复使用，通常为\
  \ 60 或 90 天\n* 密码不能与 `account ID` 相同\n* 密码不能包含字典中找到单词\n\n#### 15.2.6.2 弱密码\n\n最近的一篇行业杂志文章说，黑客在一个热门社交网站发现的最流行的密码是“123456”。其他常见密码有\
  \ `12345`、`123456789`、`Password`、`iloveyou`、`princess`、`rockyou`、`1234567`、`12345678`\
  \ 和 `abc123`。你能防止你的用户选择这些容易猜测的密码吗？如果公司机密是由这些脆弱的安全措施保护的，你组织的首席信息官（CIO）会满意吗？\n\n####\
  \ 15.2.6.3 谁可以重置密码？\n\n\n\n\n\nSection 15.2.6 中的最后一项代表了你组织的一项策略决策。如果存在帮助台（Help Desk），它就是更改或重置密码以及解锁账户的逻辑组。当然，需要制定策略，以便帮助台能够验证请求者确实是用户本人而非冒充者。策略可能是将新密码发送到用户的电子邮件账户，而不是通过电话口头。当然，如果访问用户的电子邮件账户需要该密码，那么必须通过其他方式提供给他们。\n\
  \n#### 15.2.6.4 默认密码\n\n这听起来可能显而易见，但密码应该保持保密。如果可能，应强制所有用户在首次登录时更新密码。这样做有两个同样充分的理由。首先，是为了防止用户继续使用管理员设置的初始密码，诸如“secret1”或“welcome2”之类的默认密码。其次，是为了确保重置密码的人在用户更改密码后将不再知道它。帮助台的人员或应用程序管理员可能不想知道\
  \ Joe User 的密码，但如果用户被强制更改密码，那么密码无疑就是秘密了。\n\n供应商在安装应用程序时创建的默认账户通常在每个安装站点都具有相同的默认密码。如果你不更改初始密码，那么所有为供应商工作的人以及全球范围内使用此软件的每个站点的管理员都知道你的密码是什么。如果这让你感到担心，请尽快更改你的密码。\n\
  \n#### 15.2.6.5 管理你的密码\n\n作为管理员，你会有许多需要记住的密码。你并不经常需要所有的密码，但偶尔需要获取它们。你如何在不将它们写在便利签上的情况下将它们理清绪呢？有很多工具可以以加密格式存储你的密码以确保其安全。这些工具的示例包括：\n\
  \n• Password Safe\n• Dashlane\n• Hitachi ID Password Manager\n• KeePass\n• Kapersky\
  \ Password Manager\n• IronKey Personal S200\n\n然而，对于所有这些工具，ID/密码都是通过该工具的“主密码”保护的。因此，如果这个主密码泄露、被破解或被忘记，就会产生明显的挑战。\n\
  \n#### 15.2.6.6 修改密码的意之外后果\n\n当更新密码时，你需要确保不会导致任何意之外的后果。你最可能吃亏的情况是账户及其密码被硬编码在某个地方。如果它在其他地方被使用，它将无法无法执行预期的操作。这些可能的情况包括：\n\
  \n• Windows 计划任务中的计划事件\n• 用于导入或导出数据运行的脚本\n\n解决此问题的办法是创建账户（可能是本地账户），专门用于该特定任务。授予其尽可能小的权限集，只要仍使其能够运行必须完成的任务即可。\n\
  \n### 15.2.7 管理员账户\n\n每个应用程序都有一个应用程序管理员（Application Administrator）或超级用户（Super User）账户。任何登录应用程序管理员账户的任何人都可以在系统中执行几乎任何事情。正如彼得·帕克（蜘蛛侠）的本叔叔所说：“能力越大，责任越大”，所以请务必明智地使用它。\n\
  \n#### 15.2.7.1 何时使用管理员账户\n\n超级用户账户的经验法是仅在绝对必要时才使用它。诸如安装升级、根据供应商指示进行更改、从备份恢复等操作。对于学习应用程序或测试等活动，应该使用“普通”账户。使用管理员账户导致大范围损害的概率使得定期使用的风险太高了。\n\
  \n显然，管理员账户的密码应该比普通用户账户控制得更紧。为什么要对这个密码控制得这么紧呢？\n\n1. 如果多人知道任何账户的密码，那么当它被错误使用时，你就无法追究责任。每个用户都可以否认自己是操作者。如果应用程序的日志系统记录了每次登录操作的\
  \ IP 地址，那么你可能可以追溯到罪祸首。\n2. 管理员账户具有巨大的破坏能力。它可以删除所有对象、更改或重命名它们等。\n3. 如果你以管理员账户登录，并在会话期间安装了病毒、恶意软件或木马，它将拥有最高访问权限。它造成的破坏几乎是无限的。\n\
  \n#### 15.2.7.2 谁应该知道管理员账户密码？\n\n谁应该知道应用程序管理员账户？只有应用程序管理员。\n\n你可能希望至少两个人知道：应用程序管理员及其备份人员。\n\
  \n不要让任何用户（或你的经理）说服你授予他们访问此账户。如果他们需要更高级别的访问，请授予他们的个人账户或角色，但不要给他们超级用户账户密码！\n\n####\
  \ 15.2.7.3 何时更改管理员账户密码\n\n你何时需要更改应用程序账户密码？\n\n• 最常见的情况是密码过期了。\n• 一个经常被忽略的更改时间是知道密码的人离开公司或转到另一个工作。\n\
  • 另一个需要更新的情况是，如果你怀疑不该知道密码的人已经知道了它。\n\n#### 15.2.7.4 管理员账户密码泄露了吗？\n\n超级用户密码是否存在于服务器上的某个文件中？它是否嵌入在任何脚本、批处理文件、命令文件等？如果你要更改它，最好知道这个问题的答案！\n\
  \n你可不想在晚上备份失败时才发现这个问题。\n\n## 15.3 应用程序安全\n\n安装应用程序时应该执行的一些有助于增强安全的步骤包括：\n\n• 确认加载的软件版本没有已知漏洞。\n\
  • 应用补丁或升级以解决任何已知漏洞。\n• 移除或禁用应用程序软件创建的所有不需要的默认账户，或者更改必须保留的账户的密码。\n• 如果需要修改任何默认账户，请确保该默认密码不再被使用。\n\
  • 从服务器上移除所有制造商文档。\n• 从服务器上移除所有示例或测试文件。\n• 从服务器上移除任何不需要的编译器、工具、库等。\n• 对于面向外部的服务器，修改欢迎横幅以删除任何特定细节，例如：操作系统类型和版本、应用程序软件的名称和版本。\n\
  • 显示警告横幅，告知这是一个安全系统，任何未经授权的人员都将受到法律的最严惩处。\n\n### 15.3.1 已知漏洞\n\n应用程序软件中存在的一些常见的漏洞包括：\n\
  \n• 跨站脚本\n• SQL 注入\n• 不安全的加密算法\n• 跨站请求伪造\n• 缓冲区和整数溢出\n\n找出你组织依赖的应用程序是否包含漏洞并不是件容易的事。有很多资源可供，并且都应该检查这些关键信息。\n\
  \n\n\n\n一个关于潜在漏洞的无偏列表是国家漏洞数据库（NVD）。该网站 [`nvd.nist.gov`](http://nvd.nist.gov) 允许你搜索已知存在漏洞的软件包。在你寄予厚望之前，列表中的软件包往往是操作系统、数据库包、Web\
  \ 浏览器、办公套件、网络交换机、网络路由器和防火墙。这类软件包拥有更多补丁是理所，因为它们被加载到更多的服务器上，并且是黑客显而易见的目标。搜索 NVD 列表需要时间，但你应该彻查这一资源，以查看你的应用程序是否存在任何已知漏洞。\n\
  \n直接向供应商询问应用程序的漏洞是可能的，但不要指望他们会给你一份产品短缺的列表。在漏洞方面，完全披露的时代尚未到来，而且可能永远不会到来。\n\n如果有一个针对该应用程序的用户小组，请在其中活跃起来。如果该小组独立于供应商，这一点尤为真实。与你的同行（即其他应用程序管理员）建立联系是学习潜在漏洞的绝佳来源。\n\
  \n如果可能，请参加为该应用程序举办的用户会议。会议不仅是参加演示和与同行建立联系的绝佳时机，还为你提供了与供应商技术人员面对面交流的机会。他们才是对该应用程序潜在漏洞最了解的人。\n\
  \n了解软件缺陷的最后一种方法是在你的服务器上获取并运行漏洞扫描工具。这些工具的设计旨在让服务器和应用程序暴露于已知漏洞，并确定软件是否免受这些漏洞的侵害。缺点是，这些工具只能测试已经识别出的漏洞。如果发现了一个全新的漏洞（即零日漏洞），在工具更新之前，这些工具将无法识别它们。\n\
  \n### 15.3.2 应用补丁\n\n应该参考供应商的网站以获取需要应用的补丁列表，以保护应用程序免受已知漏洞的侵害。尽可能保持软件的当前发布版本水平是理想的。当然，你可能希望先在测试服务器或开发服务器上安装补丁，以确认它不会为应用程序在你的组织或环境中的运行引入问题。\n\
  \n### 15.3.3 已知文件位置\n\n大多数应用程序软件都安装在为人知且可预测的目录、可执行文件等等。黑客要么知道这些细节，要么可以在几分钟内获它们。为了避免搜索已知位置的探测，请考虑使用非标准的可执行名称和目录名称来安装应用程序软件。这可能会在软件安装和升级期间导致额外工作，但如果它能防止你成为黑客入侵的受害者，那么它是值得的。\n\
  \n### 15.3.4 禁用你不使用的默认账户\n\n应用程序安装时经常带有默认账户。如果你不使用它们，那么它们绝对应该被禁用或删除。让它们保持开启就像在你度假时敞开大门一样。这两种做法都是邀请入侵者直接入内的开放信号。\n\
  \n你如何确定你的应用程序是否创建了任何默认账户？阅读文档，寻找显式的账户列表或使用默认账户的示例。如果存在供应商的知识库，请搜索。向供应商的支持部门索要默认账户列表及其用途。\n\
  \n### 15.3.5 关闭不使用的功能\n\n如果你没有使用应用程序中的某个功能，并且该功能可以关闭，请将其关闭。这样做可以减少入侵者可能利用的功能数量。它也减少了合法用户无意中使用该功能并导致问题的概率。\n\
  \n### 15.3.6 自动注销\n\n无人看的应用程序会话代表着安全威胁。如果合法用户离开工作站并让应用程序运行，任何人都可以走过去并作乱。至少，这将使他们获得用户被允许调出的任何机密信息。\n\
  \n如果应用程序具有自动注销非活跃用户的功能，可以减少这一安全问题。如果这是一个配置选项，那么可能应该被调用。现在最大的问题是非活跃时间应该设置成多久。你对这段时间的选择反映了希望缩短非活跃时间的安全人员与希望较长非活跃时间的用户之间的斗争。\n\
  \n## 15.4 服务器\n\n服务器是数据中心皇冠上的明珠。如果黑客能够访问其中之一，那么可能造成的损害几乎是无限的。由于它们如此宝贵，因此需要最大程度地保护它们。作为应用程序管理员，你可能不会专门负责服务器的安全，但你会希望尽尽所能帮助保护它们。\n\
  \n### 15.4.1 物理安全\n\n最基本的的形式是为你的服务器提供物理保护。如果入侵者可以获得服务器的物理访问权限，他们就拥有了这台机器。数据中心物理安全吗？机房的物理访问是否受到了锁、读卡器或保安人员的保护？服务器、磁盘驱动器等也存在相同的问题和担忧。\n\
  \n### 15.4.2 服务器的远程访问\n\n假设数据中心和服务器的物理安全已经到位，那么下一个担心是服务器的远程访问。你知道谁有远程访问你应用程序服务器权限吗？你组织中的网络组能为你提供一份可以访问它的人员列表吗？\n\
  \n允许用户能够远程访问应用程序服务器并不符合“最佳策略”。如果他们拥有对服务器的访问权限，你就无法控制他们可能会做什么。例如，他们可能会\n\n*   删除应用程序所需的软件或文件\n\
  *   启动消耗服务器资源的进程\n*   无意中允许病毒、恶意软件或特洛马感染服务器\n*   消耗磁盘空间\n*   停止或干扰应用程序进程或作业\n* \
  \  调度干扰现有应用程序相关任务的任务\n\n用户直接登录应用程序服务器是否有合法的业务需求？他们可能会声称某些应用程序功能只能在服务器上运行。如果用户声称确实如此，你需要向供应商核实。如果他们的说法是准确的，你可能希望研究以下选项，以便他们能够在对服务器风险最小的情况下完成工作：\n\
  \n*    某些功能可能远程可用\n*    他们需要运行的进程可以调度为特定间隔运行\n*    应用程序管理员可以为用户在服务器上运行进程\n*    用户提供批处理或脚本文件，由应用程序管理员在服务器上执行\n\
  *    应用程序管理员可以使用会话共享软件如 `WebEx`、`NetMeeting` 等，允许用户通过应用程序管理员的桌面在服务器上启动进程\n*    服务器上的账户可以专门为要运行的任务启用，然后禁用\n\
  *    在服务器上创建一个除所提任务之外完全什么都做不了的账户\n\n### 15.4.3 维护补丁\n\n\n\n\n\n维护补丁可以是指应用程序软件或服务器上支持软件的更改。许多支持软件的补丁是为了修复供应商识别出的漏洞。一旦补丁发布，所有人（包括坏人）都会知晓该漏洞的存在。这意味着您需要在合理的范围内尽可能快地安装这些补丁。如果您的组织有数据中心团队，那么他们可能已经在处理此类类型的补丁了。\n\
  \n应用程序软件的补丁频率通常低于支持软件的补丁。应用程序软件补丁通常解决安全以外的其他问题。这些补丁解决的问题示例包括：\n\n* 修复应用程序中的问题\n\
  * 提高应用程序性能\n* 为应用程序添加功能\n* 使应用程序能够与额外的数据库、Web 服务器应用程序等协作\n* 支持用户使用的额外语言\n* 支持政府机构需要的新表单格式\n\
  * 处理政府规则或法规的变化，例如税法的变更\n\n供应商的补丁通常包含一个“自述”（read me）文件，其中描述了补丁将实施的更改。审阅此文件以确定您的站点是否需要安装该补丁。如果用户选择不安装，为了安全起见，请通过书面或电子邮件获取他们的决定。如果需要安装补丁，请在修改生产服务器之前，在测试或开发服务器上进行安装和测试。\n\
  \n### 15.4.4 ACL（访问控制列表）\n\n`ACL`（访问控制列表）通过维护允许访问对象的用户和进程列表来限制对对象（通常为文件）的访问。`ACL`\
  \ 条指定了允许的访问类型，例如读取、写入、创建、删除。应该保护的文件类型示例包括：\n\n* 应用程序执行文件\n* 应用程序库\n* 配置文件\n* 密码哈希和其他身份验证文件\n\
  * 加密密钥\n* 日志和审计文件\n* 数据文件\n\n### 15.4.5 防毒病毒 (AV) 和恶意软件检测工具\n\n所有计算机都受到计算机病毒、木洛马、根内核和其他恶意软件的攻击。目前存在用于检测和删除恶意软件的工具。这些检测工具需要在应用程序服务器上安装和维护。这些工具的示例包括：\n\
  \n* Kaspersky Anti-Virus\n* Norton Anti-Virus\n* VIPRE Antivirus\n* Webroot SecureAnywhere\
  \ Antivirus\n* Bitdefender Antivirus Plus\n* Panda ActiveScan\n\n如果您的组织没有处理这些工具的安全团队，那么应用程序管理员将需要安装并维护它们。保持这些工具处于最新状态非常重要。过时的反病毒软件可能会提供虚假的安全感，这是危险的。\n\
  \n### 15.4.6 入侵防御系统 (IPS)\n\n入侵防御系统（`IPS`）监控系统和/网络可能的恶意活动。例如，未经授权的尝试访问服务器。如果检测到无效活动，将会被记录。`IPS`\
  \ 还可以向安全或应用程序人员发送警报，以提醒他们可疑活动。\n\n可用的 `IPS` 包示例包括：\n\n* Check Point IPS-1\n* Cisco\
  \ IPF Series\n* eTrust Intrusion Detection\n* IBM Security Network Intrusion Prevention\
  \ System\n* NetScreen-IDP\n* Proventia\n* Snort\n* TippingPoint Intrusion Prevention\
  \ System\n\n### 15.4.7 审计日志文件\n\n日志是服务器安全的重要组成部分。大多数应用程序都会生成日志文件并在其中记录问题和异常事件。应用程序服务器上的操作系统创建一个日志文件，并向其中写入系统活动（包括正常和异常）的记录。入侵防御系统（IPSs）将可疑活动记录到日志文件中。病毒扫描程序向日志文件写入记录，识别其发现的潜在危险软件。简而言之，大量信息被写入分散在整个服务器文件系统的多个日志文件中。\n\
  \n马克·吐温曾说：“一个不读好书的人比一个不认识如何读这些书的人没有任何优势。”对我来说，这也适用于日志文件。一个不阅读或不审阅日志文件的管理员，并不比不保留日志文件的管理员好在哪里。如果不进行审阅，日志文件就毫无用处。不幸的是，应用程序管理员是非常忙碌的人。他们最不需要添加到“待办事项”列表中的，就是每天或每小时审阅日志文件。\n\
  \n幸运的是，有很多工具（包括一些开源工具）可以自动化审阅日志文件的过程。获取一个，安装并使用。扫描日志文件以寻找重大事件的工具示例包括：\n\n* Splunk\n\
  * PCS Log Scanning\n* Nagios 具有执行日志扫描的插件\n* IIS Logfile Analyser\n* LogFusion\n\
  * Microsoft Log Parser\n\n### 15.4.8 加密驱动器\n\n如果攻击者或恶意内部人员访问了您的应用程序服务器，驱动器上的任何文件对他们来说都是可能访问的。一种可以此类威胁的安全技术是加密驱动器上所有文件的内容。实施加密不应该轻率为之。它也不应该在本地开发。获取专业级的加密产品绝对是应该采取的途径。您还需要向应用程序供应商确认，他们的软件包是否能够在加密环境中工作。\n\
  \n可用于加密驱动器的工具有：\n\n* FileVault 2\n* BitLocker Drive Encryption\n* GNU Privacy Guard\n\
  * PGP\n* BitArmor DataControl\n* Check Point Full Disk Encryption\n* McAfee Endpoint\
  \ Encryption\n\n### 15.4.9 操作系统（OS）加固\n\n一旦对操作系统应用了所有升级和补丁，服务器管理员应该采取额外步骤来加固服务器。描述此活动的另一个术语是“减少攻击面”。本质上意味着将服务器上的软件减少到完成工作所需的最小量。另一种可能性是禁用不需要的服务。此目的是减少攻击者利用漏洞的机会。\n\
  \n应该采取的具体步骤包括删除不必要的服务、应用程序和网络协议。如果无法删除不必要的组件，则应该禁用它们。具体示例包括：\n\n* 文件和打印机共享服务，例如\
  \ NetBIOS、 NFS、FTP\n* 无线网络服务\n* 远程控制和远程访问程序，例如 Telnet\n* 目录服务，例如 LDAP、NIS\n* Web\
  \ 服务器和服务\n* 电子邮件服务，例如 SMTP\n* 语言编译器和库\n* 系统开发工具，例如 Visual Studio、Eclipse 等\n* 系统和网络管理工具和程序，例如\
  \ SNMP\n\n## 15.5 防火墙\n\n主机防火墙有助于保护服务器免受未经授权访问。它通过控制网络与服务器之间的进流量来实现。消息中的每个数据包都会经过检查，如果其内容被确定为潜在危险，将被阻止。\n\
  \n一组规则用于判断每条消息是否允许通过防火墙。可以定义的规则示例包括：\n\n* 阻塞来自特定 IP 地址或 IP 段的所有流量\n* 允许来自一组已知域名的流量\n\
  * 始终允许来自特定后缀域名的流量，例如 .edu 或 .mil\n* 允许或阻塞特定协议，例如 SMTP、FTP、UDP、Telnet、SNMP 或 TCP\n\
  * 可以允许或阻塞指向或来自特定端口的流量\n\n\n\n\n\n• 可以针对特定关键词搜索消息。如果找到，该消息将会被拦截。\n\n为任何防火墙设置规则都可能是复杂的，并且需要持续的关注。除非应用程序管理员具有处理防火墙的丰富经验，否则应该将此责任交给安全团队。如果你的组织没有安全团队，请向管理层申请增加具有此类背景的人员。这种类型的安全包绝对不是那种安装后就可以不管的东西。\n\
  \n## 15.5.1 端口\n\n在计算机世界中，`port`（端口）一词是指计算机与其他设备之间存在的接口。设备可以是内部的或外部的。内部设备的示例包括硬盘、DVD\
  \ 驱动器和 U 盘等 USB 设备。外部设备包括网络远端的其他服务器。\n\n为了让计算机使用 `port` 与外部设备通信，该 `port` 必须是打开的。这意味着，如果你的网络架构中存在防火墙，那么防火墙知道该\
  \ `port` 会有数据包通过并允许通过。数据包可以从计算机发送到外部设备，也可以从外部设备发送到计算机。\n\n### 15.5.1.1 应用程序如何使用端口？\n\
  \n大多数应用程序至少使用几个 `ports`。例如，如果应用程序访问 Oracle 数据库以获取数据，那么应用程序服务器和数据库服务器之间可能需要打开 `port\
  \ 1521`。如果应用程序发送电子邮件，那么应用程序服务器和邮件服务器之间的 `port 25` 可能是打开的。如果用户通过 Web 浏览器与应用程序交互，那么\
  \ `port 80` 将是打开的。\n\n### 15.5.1.2 你的应用程序使用了哪些端口？\n\n要确定运行你的应用程序需要打开哪些 `ports`，你需要获取它所使用的\
  \ `ports` 列表。这些信息可以通过以下来源提供：\n\n• 安装指南\n• 应用程序管理员指南\n• 配置文件\n\n如果你无法在上述任何一处找到 `ports`\
  \ 列表，请联系供应商的支持团队。他们应该拥有一份应用程序所使用的 `ports` 完整列表及其使用方法。如果你正在安装应用程序，那么你需要确保应用程序要使用的所有\
  \ `ports` 都是打开的。\n\n### 15.5.1.3 常用端口\n\n有许多应用程序和其他软件经常使用的 `ports`。以下列表提供了其中一些，但显然并没有包含全部。如果正在使用某个\
  \ `port` 的软件正在你的服务器上执行，那么该 `port` 将被使用。否则，它不应保持打开。\n\n| 端口 | 用途 |\n| :--- | :---\
  \ |\n| 20 | 文件传输协议 (FTP) |\n| 21 | 文件传输协议 (FTP) |\n| 23 | Telnet |\n| 25 | 简单邮件传输协议\
  \ (SMTP) |\n| 53 | 域名系统 (DNS) 服务 |\n| 66 | Oracle SQL*NET |\n| 80 | 超文本传输协议 (HTTP)\
  \ |\n| 109 | 邮局协议 (POP) |\n| 111 | SUN 远程过程调用 |\n| 161 | 简单网络管理协议 (SNMP) |\n| 194\
  \ | 互联网相对聊天协议 |\n| 443 | 安全超文本传输协议 (HTTPS) |\n| 1433 | Microsoft SQL Server |\n\
  | 1434 | Microsoft SQL Server |\n| 1494 | Citrix Metaframe |\n| 1521 | Oracle 数据库\
  \ |\n| 1524 | Ingres 数据库 |\n| 1723 | Microsoft VPN |\n| 3306 | MySQL 数据库 |\n| 5432\
  \ | Postgres |\n\n### 15.5.1.4 识别正在使用的端口\n\n未被使用的端口应该关闭，以避免它们被不当使用。一旦你识别出你的应用程序及所有支持软件正在使用的端口，就可以关闭任何其他端口。更现实地说，安全团队将处理此工作，但对所有应用程序管理员来说，了解其操作原理是有好处的。\n\
  \n运行端口扫描可以告诉你哪些端口是打开的，哪些被拦截了。Windows 计算机上扫描端口的工具之一是“netstat”。在命令行窗口输入命令 `netstat\
  \ –v –n` 将列出所有端口及其使用方式。图 15.3 显示服务器使用的端口示例。每个地址的第一部分（即冒号之前）是计算机的 IP 地址。冒号之后的地址部分是端口号。\n\
  \n![image](img/F000157f15-03-9780123985453.jpg)\n\n图 15.3 netstat 命令的输出。\n\n## 15.6\
  \ 你的服务器位于何处？\n\n应用程序供应商可能会问的问题是“服务器位于何处？”这个问题并不是指它的物理位置。它的意思是它相对于互联网、你的组织内部网络以及组织防火墙的位置。有两种可能：应用程序服务器位于\
  \ DMZ（脱敏区），即互联网和内部网络之间的区域；或者它位于组织的内部网络中。\n\n图 15.4 显示位于 DMZ 的应用程序服务器。\n\n![image](img/F000157f15-03-9780123985453.jpg)\
  \ (根据上下文说明)\n\n## 15.7 浏览器\n\nWeb 浏览器是一种用于展示万网页面的软件应用程序。基于 Web 的第三方应用程序需要用户通过浏览器进行访问。这样做的主要优点是：\n\
  \n• 使用浏览器，供应商无需编写演示组件\n• 典型的计算机用户已经非常熟悉使用浏览器\n\n最常用的浏览器（随机排序）列有：\n\n• Mozilla Firefox\n\
  • Google Chrome\n• Microsoft Internet Explorer\n• Opera\n• Apple Safari\n\n### 15.7.1\
  \ SSL—安全套层\n\n安全套层 (SSL) 是一种管理互联网传输消息安全的协议。SSL 使用基于公钥和私钥的加密系统来维护传输安全。Firefox 和 Internet\
  \ Explorer 等浏览器可以运行 SSL 以保护发送和接收的数据。\n\n要实施 SSL，必须从认证机构获取 SSL 证书。该证书包含了加密传输消息所需的公钥和私钥。认证机构的示例包括：\n\
  \n• Symantec\n• VeriSign\n• GoDaddy\n• Comodo\n\n### 15.7.2 HTTPS（安全超文本传输协议）\n\n\
  以 HTTPS 开头的网站使用 SSL 来保护与其浏览器之间的传输。你的应用程序可能利用 SSL 来提高安全性。要确定是否可以，请参考安装指南或管理员指南。如果这些文档中没有关于\
  \ HTTPS 或 SSL 的信息，请联系供应商支持团队了解此信息。\n\n### 15.7.3 受信站点\n\n\n\n\n在很多情况下，你不希望连接无限期保持活动。如果连接一直保持活动，可能会带来安全风险。在大多数情况下，如果连接在可配置的时间内未被使用，它将被终止。以下是可能需要设置超时的场景示例：\n\
  \n• 如果应用程序一段时间未被使用，则它将被关闭\n• 如果没有新请求到来，则与数据库的连接将被关闭\n• 如果向网络或从网络传输停止，则连接将被关闭\n•\
  \ 如果用户长时间不使用鼠标或键盘，则 PC 将锁定\n\n你是否有能力设置超时，或确定应用程序会话超时之前必须经过的时间？接受默认超时值是安全的吗？在增加超时值之前，请确保你理解你所操作将产生的影响。你不希望通过更改默认超时值来降低应用程序的安全性。\n\
  \n### 15.7.5 弹出窗口拦截器\n\n许多浏览器都允许你阻止在网络会话期间“弹出”的在线广告。这种能力被称为“弹出窗口拦截器”。你的应用程序可能会创建额外的屏幕来显示用户请求的信息。如果发生这种情况，浏览器可能会认为这些新屏幕是广告并尝试阻止它们。如果发生了了这种情况，用户需要在浏览器中指定允许来自应用程序网站的弹出窗口。\n\
  \n每个浏览器都有启用弹出窗口的方法。在 Firefox 中，操作步骤如下：\n\n1. 点击主菜单中的 `Tools`\n2. 点击 `Content` 选项卡\n\
  3. 点击“Block popup windows”复选框旁边的 `Exceptions` \n4. 输入应用程序的网络 URL 并点击 `Allow` 按钮\n\
  \n### 15.7.6 Cookies\n\nCookies 是网络浏览器创建的小文件，用于记录用户会话的信息。网络浏览器可以设置为禁用 Cookies。如果你的应用程序要求在用户的桌面上创建\
  \ Cookies，则用户需要配置他们的浏览器以允许它们。\n\n## 15.8 黑客攻击\n\n黑客攻击是寻找计算机软件、网络或系统漏洞的活动。连接到网络的每个计算机都是潜在的攻击目标。如果你的应用程序运行在连接到网络的服务器上，它也是一个潜在目标。如果你的组织有一个安全团队，那么保护你的服务器将是他们的责任。\n\
  \n关于计算机安全和黑客攻击的著作已有几十甚至数百本。我并不幻想这一章节会让读者成为专家，但为你提供一点知识可能会激发你对该主题进行更多学习的兴趣。\n\n###\
  \ 15.8.1 攻击类型\n\n这里列出了可能针对你的服务器和应用程序的攻击类型简要列表：\n\n• SQL 注入\n• 缓冲区溢出\n• 钓鱼攻击\n• 鱼叉式钓鱼攻击\n\
  • 僵尸网络\n• Root Kit\n• 病毒\n• 洛伊木马\n• 蠕虫\n• 拒绝服务 (DOS)\n• 分布式拒绝服务 (DDOS)\n\n你的应用是否容易受到上述列出的各种形式的攻击？在没有广泛测试的情况下，很难判断这一点。学习它可能受到哪些（如果有）攻击类型的方法包括：\n\
  \n• 询问供应商\n• 询问独立用户组（如果存在）\n• 如果你具备技能、经验和坚持力，请自己进行测试\n• 请合格、信誉良好的安全顾问或公司进行渗透测试\n\
  • 与支持此应用程序的其他应用程序管理员交流\n• 在互联网上搜索相关信息\n• 检查跟踪漏洞的政府网站 (`nvd.nist.gov`)\n\n### 15.8.2\
  \ 社会工程学\n\n社会工程学攻击通常不需要涉及高科技。它是一种操纵人们交出不应公开的信息的艺术。社会工程技术的一些示例是：\n\n• 黑客给用户打电话或发送电子邮件，告诉她的账户出现问题并需要纠正。来电者请求用户的\
  \ ID 和密码来“修复”问题。\n• 黑客在 U 盘中加载病毒或洛伊木马，并将其遗留在容易发现的地方。如果 U 盘被发现并连接到 `PC`，那么恶意软件就会自动加载并让黑客获得访问系统或网络的权限。\n\
  • 攻击者只需跟随合法用户通过锁定的入口以进入安全区域。这被称为“尾随（tailgating）”，如果攻击者提着包裹导致他或她无法使用自己的卡钥匙开门，这种方法尤为有效。\n\
  \n用户需要接受关于什么是社会工程学以及它可能如何被用来欺骗他们泄露机密信息的教育。应该教他们系统或应用程序管理员不需要密码来测试系统。管理员可以创建测试账户或使用自己的账户进行测试目的。这种培训需要定期进行，以确保不被忘记。\n\
  \n## 15.9 测试\n\n如果你的新或现有应用程序服务器从未经过测试，你就不知道它是否安全。测试服务器以确定其安全性会引发问题，例如：\n\n• 谁来负责测试？如果测试人员没有足够的经验和动力，得到的测试结果将毫无价值。\n\
  • 应该多久测试一次服务器？每年一次？每月一次？还是在构建时测试？\n• 在 `Production` 服务器上运行安全测试是明智的吗？它会影响你的用户吗？会导致拒绝服务\
  \ (DoS) 情况吗？会对性能产生重大影响吗？\n• 服务器是否包含机密数据？如果是，对其进行安全测试明智吗？\n• 对 `QA` 服务器进行安全测试可能更好。请注意，即使\
  \ `QA` 系统与 `Production` 系统完全相同，也存在某些差异。这些差异是否代表额外的漏洞很难说。\n\n### 15.9.1 渗透测试\n\n\
  根据国家安全委员会定义，渗透测试是“评估人员根据对系统设计和实现的理解，尝试绕系统安全性的测试”。持有关键信息的服务器应该进行渗透测试。渗透（Pen）测试不能交给新员工或暑期实习生。它必须由具有经验、更重要的是具有黑客思维的专业\
  \ IT 人员完成。渗透测试的好处是：\n\n• 网络和服务器将使用黑客使用的相同的工具和方法受到攻击。\n• 如果存在漏洞，意图是让渗透测试暴露它们，以便在坏人利用它们之前进行修复。\n\
  • 为许多人（例如高层管理人员）提供“真实感”，让他们真正理解服务器可能有多脆弱。\n• 渗透测试可以确定组织对“社会工程学”的敏感程度。这不是一个在没有实际测试的情况下可以准确衡量的。\n\
  \n### 15.9.2 漏洞测试\n\n漏洞扫描由旨在识别服务器上已知漏洞的工具执行。这些工具被称为漏洞评估工具，自动化了黑客利用服务器漏洞将采取的步骤。创建工具自动化这些步骤的优势是它可以运行得更快、更一致，并自动处理多台服务器。\n\
  \n这些工具可以发现的漏洞示例包括以下：\n\n• 开放端口\n• 服务器不需要的软件\n• 过时的软件\n• 未应用的补丁\n• SQL 注入攻击\n\n\n\
  \n\n- 跨站脚本 (XSS)\n- 捕识别服务器上软件版本的横幅 (banners)\n- 违反最小权限原则\n\n有很多此类工具可用。有些是开源的，另一些是专有的。包括：\n\
  \n- Beyond Security Automate Vulnerability Detection System\n- eEye Retina Network\n\
  - DragonSoft Vulnerability Management\n- IBM Proventia Network Enterprise Scanner\n\
  - Lumension Scan\n- McAfee Vulnerability Manager\n- Microsoft Attack Surface Analyzer\n\
  - HP WebInspect\n- SAINT\n- Tenable Nessus\n\n应该在服务器生命周期中的特定时间点定期进行漏洞扫描。应该执行扫描的时间示例包括：\n\
  \n- 当服务器构建完成后，但在投入运行之前\n- 当新软件加载到服务器上时\n- 当新威胁的消息传出时\n- 定期进行，例如每 6 个月一次\n\n您的应用程序服务器是否正在进行漏洞扫描？如果您的组织有一个安全团队，那么他们可能正在这样做，但您需要确定。联系他们，并要求让他们告知您服务器何时进行扫描以及结果如何。如果您的组织没有安全团队，那么您需要引起管理对这一疏漏，并请求启动此类扫描。\n\
  \n漏洞扫描的输出并不是一份告诉您如何做以确保服务器安全的清单。其结果需要熟练的 IT 专业人员进行密集的检查，以完全理解可能存在或不存在的漏洞。结果通常包含大量的虚假阳性，即实际上并不存在的漏洞。\n\
  \n使用漏洞扫描器时的最后一个建议是——两个胜过一个。目前所有可用的扫描器都不是完美的。结合使用两个扫描器比只使用一个扫描器更有可能发现所有漏洞。\n\n###\
  \ 15.9.3 谁应该提前知晓测试？\n\n如果您将对应用程序服务器进行渗透测试和/或漏洞测试，是否有人特别需要提前获此此？或者不通知测试是否会更好？不通知测试更符合现实情况，因为大多数黑客不会提前给组织打电话并警告他们即将受到攻击。\n\
  \n# 第 16 章：服务器\n\n## 摘要\n\n通常运行在与用户工作站大不同的服务器上。服务器可以是物理的，也可以是虚拟的。管理员需要知道应用程序服务器上有哪些硬件和软件。\n\
  \n### 关键词\n\n服务器；物理；虚拟；SAN；本地驱动器；RAID；NIC；操作系统；Windows；Linux；UNIX；服务；守护进程；环境变量；账户；影子副本；重启\n\
  \n您所支持的应用程序几乎肯定运行在服务器上。例外是直接加载到用户工作站上的非常有限的应用程序。此类应用程序显然在企业范围内不可，而且通常不需要应用程序管理员的服务。\n\
  \n本章标题的单一性某种带有误导性。您的应用程序可能涉及多台服务器。如果符合以下任一情况，情况就是这样：\n\n- 应用程序为用户界面、报告、专用数据库服务器等功能拥有独立的服务器。\n\
  - 应用程序环境包含负载均衡或服务器集群。\n- 生产、QA（质量保证）、测试或开发有独立的环境。\n\n大型组织中可以找到许多类型的服务器。您的应用程序可能包含以下某些类型。您的组织可能还有专门用于您的应用程序请求的以下功能的服务器。一台服务器请求另一台服务器的服务是非常常见的。这里列出了一些服务器类型的示例：\n\
  \n- 数据库服务器——运行 `Oracle`、`DB2` 和 `SQL Server` 等数据库引擎。这些服务器响应其他服务器（例如应用程序服务器）的请求，提供满足用户请求页面或功能所需的数据。\n\
  - Web 服务器——托管网站并响应用户对网页的请求。第三方软件应用程序运行在 Web 服务器上相当常见。\n- 文件服务器——包含组织网络中的用户或其他服务器可以访问的文件。\n\
  - 打印服务器——打印作业，例如报告、支票等。\n- Ftp 服务器——提供将文件传输进出组织网络的服务。许多应用程序创建一个每日文件，然后使用 `ftp` 服务器将其传输给客户端或供应商组织。\n\
  - 应用程序服务器——运行您所支持的（多个）应用程序。\n- DNS（域名系统）服务器——将服务器的主机解析为 IP 地址。如果用户在浏览器中输入 URL `www.google.com`，则会调用\
  \ `DNS` 服务器将该名称翻译为访问和显示网页之前所需的 IP 地址。\n- 安全与目录服务器——验证请求访问网络或应用程序的用户。\n\n构建用于作为服务器的计算机与典型的桌面式电脑之间存在许多差异。其中一些差异是：\n\
  \n- 强劲——将用作服务器的计算机通常其计算能力比单台工作站多得多。这是通过拥有多个处理器和/或每个处理器多个核心来实现的。这种比较也有例外，例如，为图形处理等计算密集型任务设计的用户工作站，其原始\
  \ CPU 功率可能比某些服务器还要。\n- 资源——通用用户 PC 包含 4-8 GB 的 RAM 和数百 GB 的磁盘空间。服务器可能拥有两倍的 RAM 和\
  \ 10-100 倍的磁盘空间。\n- 可靠性和稳定性——服务器必须比个人使用的计算机可靠得多，因为有许多用户依赖于它们。服务器可以运行几个月而不重启。怀疑普通的家用电脑是否能持续运行那么久而不崩溃。\n\
  - 冗余——服务器通常内部构建了冗余以确保可靠性和稳定性。例如，它们可能具有冗余电源，在主电源故障时提供供电。它可能还有用于网络通信的冗余 `NIC` 卡。如果主卡停止工作，通信将自动路由到备用卡。\n\
  - 热插拔——除了具有冗余组件外，服务器可能可以在不停止的情况下更换组件。例如，服务器的任一个冗余电源可以在不停止服务器的情况下移除和更换。\n- 可扩展——服务器比典型的用户工作站更具可扩展性。它有更多的槽位用于额外的处理器、内存、`NICs`\
  \ 等。\n\n### 服务器冷知识\n\n服务器冷知识\n\n没有配备显示器或其他输入设备的服务器被认为以“无头”模式运行。\n\n2010 年，估计服务器消耗了美国\
  \ 2.5% 的能量。为了冷却服务器，额外消耗了美国所有能源消耗的 2.5%。\n\n## 16.1 服务器之间的差异\n\n虽然所有服务器都有许多相似之处，但存在许多差异。它们通常是为了不同的目的而设计和构建的。服务器最大的两个差异在后续章节中描述。\n\
  \n### 16.1.1 物理或虚拟\n\n\n\n\n\n服务器可以是看得见、摸得着的物理设备，也可以是虚拟的。虚拟服务器运行在物理服务器上，但多了一个额外的软件层，允许多个完全独立的虚拟服务器同时在单台物理服务器上运行。虚拟服务器的一些优点包括：\n\
  \n*   在主机服务器上运行多个虚拟服务器是对设备更高效的利用。\n*   物理服务器越少意味着电力和冷却成本越低。\n*   虚拟服务器的创建和销毁速度远比物理服务器的搭建快得多。\n\
  *   每个虚拟服务器都可以由组织定义的“黄金标准”的相同副本。让每台服务器都成为克隆使环境更具一致性。\n*   将虚拟服务器从一台物理服务器移动到另一台物理服务器相对容易。\n\
  \n使用虚拟服务器的缺点包括：\n\n*   并非所有应用程序供应商都认证了其软件可以在虚拟服务器上运行。如果他们的软件没有经过虚拟服务器的使用认证，而你在其上又遇到了问题，供应商可能不会提供任何帮助。更有可能，他们会要求你在物理服务器上重现该问题，然后才会为你提供协助。\n\
  *   如果主机服务器（即物理服务器）宕机，那么它支持的所有虚拟服务器也将随之宕机。\n*   虚拟服务器增加了需要管理的复杂性。这一领域需要有经验的人。典型的应用程序管理员无法支持虚拟服务器层。\n\
  *   由于额外的软件层和复杂性，包括性能问题在内的故障更难排查。\n*   每台虚拟服务器以及物理服务器都需要获取应用程序和操作系统许可证。此外，还有虚拟化软件的成本。\n\
  \n## 16.1.2 操作系统\n\n服务器上常见的操作系统可以归纳为三个主要选择：\n\n*   Linux\n*   Unix\n*   Microsoft\
  \ Windows。\n\n这些每一个操作系统都有变体。例如，你可能运行的是红帽企业 Linux（Red Hat Enterprise Linux）或 SUSE\
  \ 企业 Linux（SUSE Linux Enterprise）。基于 UNIX 的操作系统包括 Oracle Solaris 和 Free BSD。设计用于服务器的两个两个最新的\
  \ Windows 版本是 Windows Server 2008 R2 和 Windows Server 2012。\n\n服务器运行何种操作系统由许多你无法控制的因素决定。例如：\n\
  \n*   你的组织可能是一家 UNIX 或 Windows 商店\n*   供应商的软件可能只在特定的操作系统上运行\n*   你的组织对操作系统的许可费用极其敏感\n\
  *   操作系统的选择受所用硬件的限制\n*   如果你组织的数据中心人员非常有经验，他们可能更倾向于运行他们最熟悉的更新版本或自建版本。\n\n### 16.1.2.1\
  \ 操作系统尺寸\n\n一旦决定了操作系统的类型（Windows、UNIX 或 Linux），下一个决策是它应该是多少位的。选择有 32 位或 64 位。从功能角度来看，64\
  \ 位操作系统处理的比特数是 32 位机器的两倍。它的寄存器也是两倍大，64 位对比 32 位。64 位机器中的寻址方案可以访问比 32 位机器多多的内存。访问更多内存意味着\
  \ 64 位机器具有比 32 位机器更潜力，但并非总是如此。\n\n在 32 位或 64 位的问题上，最大的因素是应用程序认证在什么环境下运行。通常，32 位应用程序可以在\
  \ 64 位机器上运行，但为 64 位计算机编写的应用程序无法在 32 位机器上运行。供应商的软件细节可能会替你做这个决定。第三方应用程序通常只能在其中一种上运行，不能兼顾。检查《安装指南》，查看可能存在的任何尺寸限制。如果你找不到此规格，那么你需要联系供应商的支持热线。如果服务器上安装了错误版本的操作系统，你将浪费时间删除它并重新安装正确的版本。\n\
  \n## 16.2 服务器硬件\n\n每台服务器都需要硬件才能运行。服务器的基本硬件组件在每台服务器上都是相似的，但仍有空间构建一台适应于你的应用程序所需的服务器。服务器的基本硬件构建模块在后续章节中列出并描述。\n\
  \n### 16.2.1 主板\n\n服务器的主板是所有其他组件安装在其上或与之连接的电路板。如果类比人体对你有帮助，那么将主板与骨骼或脊柱骨进行比较是合理的。\n\
  \n### 16.2.2 处理器\n\n服务器中的处理器是芯片或芯片组，它们是计算机的“大脑”。通用处理器芯片由少数公司制造。两个最大的 CPU（中央处理单元）芯片制造商是\
  \ Intel 和 AMD。为你的服务器提供动力的很可能由这些供应商提供。服务器通常有多个处理器，每个处理器可以有多个核心。\n\n新型处理器的出现速度极快，所以我不会在这里列出当前版本。通常情况下，快的处理器比慢的好，但同时，新的处理器比上季度推出的型号更贵。新的、更快的处理器对于你的应用程序可能并不值得投入额外费用。\n\
  \n### 16.2.3 总线\n\n从计算机的角度来说，总线是数据和指令从计算机的一个部分传输到另一部分的电子通道。类比身体，总线就是中枢神经系统。典型的服务器中不止一种总线。例如：\n\
  \n*   系统总线——在 CPU 与缓存或主内存之间通信。也被称为前端总线或本地总线。\n*   I/O 总线——与磁盘驱动器等外部设备通信。也被称为外部总线或扩展总线。\n\
  \n总线的速度不同。慢总线可能是服务器性能的瓶颈。通常，新的总线类型比旧类型快。`ISA`（工业标准架构）总线用于早期 PC 型。更新的总线变体包括 `PCI`（外部件组件接口）。\n\
  \n### 16.2.4 内存\n\n计算机内存通常被称为 `RAM`（随机存存储器），用于在服务器运行时存储数据和计算机指令。如果计算机关闭，内存内容将会丢失。\n\
  \n服务器通常包含大量内存，远大于台式工作站能够寻址（即使用）的量。软件供应商提供的规格可能会决定你的服务器应该拥有的最小内存量。不要在内存上打折扣。你的服务器至少应该拥有供应商指定的数量。增加额外的内存不会损害应用程序的性能。在某些情况下，增加更多的\
  \ `RAM` 可以让性能较差的系统变为响应得多的系统。\n\n### 16.2.5 磁盘驱动器\n\n磁盘驱动器是服务器永久存储数据和程序的地方。服务器所需的空闲磁盘空间由供应商指定。不要忘记，文档中列出的数量是在操作系统和服务器上支持程序使用的之外所需的量。\n\
  \n#### 16.2.5.1 需要多少个驱动器？\n\n\n\n\n\n你的应用程序服务器需要多少个磁盘驱动器？虽然使用一个巨大的磁盘驱动器也可以运行，但使用多个较小的驱动器也有其优势。多个驱动器的三个优势是：\n\
  \n1. 响应时间可以得到提高，因为每个驱动器可以同时工作。当一个驱动器正在检索数据时，另一个驱动器可以同时进行写入操作。\n2. 如果一个驱动器崩溃，所有数据都不会丢失。\n\
  3. 驱动器越多意味着系统的总存储容量越大。\n\n### 16.2.5.2 每个驱动器上运行什么内容？\n\n如果服务器有多个驱动器，关于文件应如何分布在这些驱动器上有一些经验法则。最大的规则是，一个驱动器（在\
  \ Windows 环境下通常为 `C:`）专门用于操作系统。第二个驱动器通常包含应用程序文件，例如库和可执行文件。如果存在第三个驱动器，它可以包含用于计算的临时空间或日志文件。在大多数企业应用程序中，数据存储在数据库服务器上，因此不会影响本地驱动器。\n\
  \n### 16.2.5.3 分区\n\n磁盘驱动器可以划分为单独分区。操作系统将每个分区视为完全独立的磁盘驱动器。在磁盘驱动器上创建多个分区具有以下优势：\n\
  \n* 操作系统可以位于与应用程序分离的分区上\n* 可以为分页区域定义单独的分区\n* 日志文件可以位于某个分区上，这样它们就不会消耗分配给该分区的磁盘空间\n\
  * 不同分区可以拥有不同的操作系统，从而使服务器能够在 Windows、UNIX 或 Linux 下启动\n* 如果应用程序及其用到的数据文件位于同一个分区上，它们将彼此靠近，从而最小化延迟时间（即驱动器访问文件的时间延迟）\n\
  \n### 16.2.5.4 本地驱动器还是网络驱动器？\n\n磁盘空间可以位于物理连接到服务器的驱动器上，也可以位于网络某处的存储设备上。如果你的服务器利用位于\
  \ `SAN`（存储区域网络）上的存储，那么它就是在利用远程存储。\n\nSAN 存储与本地驱动器相比具有明确优势：\n\n* 你不需要管理 SAN 驱动器。那是\
  \ SAN 管理员的责任。\n* 扩展 SAN 驱动器比向你的服务器添加另一个物理驱动器或或用更大的驱动器替换现有本地驱动器要容易得多。\n\n### 16.2.5.5\
  \ RAID 驱动器\n\nRAID 是冗余磁盘阵列（Redundant Array of Inexpensive Disks）的缩写。RAID 阵是一个被视为单个设备的驱动器集合。实现\
  \ RAID 的目的是让磁盘存储更快、更具容错性或兼之。如果你的磁盘空间在 SAN 存储上，它可能实际上位于 RAID 阵上。\n\nRAID 阵可以设置为不同的配置（称为级别），取决于目的是更快的访问还是更高的容错能力。一些基础级别包括：\n\
  \n* `RAID 0`——在阵中的所有驱动器上进行块条带。提高性能，但不提供容错能力。\n* `RAID 1`——每个驱动器进行镜像。同时提高性能和容错能力，但需要的驱动器数量是\
  \ `RAID 0` 的两倍。\n* `RAID 3`——数据跨所有驱动器进行字节条带。需要一个额外的驱动器用于校验。以比 `RAID 1` 更廉的方式提供容错能力。\n\
  * `RAID 5`——数据在块级进行条带。提供比 `RAID 1` 更高效的容错率，以及比 `RAID 3` 更好的性能。\n\n### 16.2.5.6 共享驱动器\n\
  \n共享驱动器字面上意思是与其他服务器共享的驱动器。共享驱动器提供了一种在服务器之间移动文件的相对简便的方法。你的应用程序可能会为运行在另一台服务器上的进程创建输出。如果你创建了共享驱动器，那么该服务器上的特定账户就可以从你的驱动器上提取输出文件。\n\
  \n如果创建了共享驱动器，请确保尽可能严格限制访问。例如，你会执行以下操作：\n\n* 限制哪些账户可以访问共享\n* 指定正在共享的子目录\n* 限制在共享上可以执行的操作，例如读取、写入、删除\n\
  \n在 Windows 环境中，设置共享驱动器相对简单。基本步骤是：\n\n1. 打开 Windows 资源管理器\n2. 浏览到要共享的子目录\n3. 右键点击要共享的子目录并选择“共享和安全设置”。图\
  \ 16.1 显示了创建共享驱动器的这一步。\n\n![image](img/F000169f16-01-9780123985453.jpg)\n\n图 16.1\
  \ 定义共享驱动器。\n\n4. 点击“权限”按钮\n5. 输入被授予共享驱动器访问权限员以及授予的访问级别。图 16.2 显示 Kelly Bourne（即账户\
  \ [`KB@public.com`](http://www.KB@public.com)）已被授予对共享子目录 `tmp_tax` 的读取权限。\n\n![image](img/F000169f16-02-9780123985453.jpg)\n\
  \n图 16.2 为共享驱动器授予访问权限。\n\n### 16.2.5.7 网络信息卡\n\n`NIC`（网卡）支持服务器与网络之间的通信。`NIC` 插入服务器的主板并连接到不同的交换机。应用程序安装过程可能会提示你服务器有多少个\
  \ `NIC`。在 Windows 服务器上，你可以通过输入 `systeminfo` 命令来确定有多少个 `NIC`。连接到服务器的 `NIC` 详情显示在输出的底部。图\
  \ 16.3 显示了 `systeminfo` 命令的输出。\n\n```\n![image](img/F000169f16-03-9780123985453.jpg)\n\
  ```\n图 16.3 systeminfo 输出中的 NIC。\n\n### 16.2.5.8 电源\n\n电源将交流电（即墙电）转换为服务器所需的低电压直流电。服务器电源容量往往比台式电脑更大，因为它们拥有更多组件。你的服务器可能配备双电源，以便在一个电源故障时保持在线。这是冗余的一个示例，即拥有至少一个独立的组件以确保系统可用。\n\
  \n## 16.3 后台进程\n\n操作系统具有以后台进程运行程序的能力。服务器上的后台进程通常不与控制台键盘、显示器或鼠标交互。它们通常在服务器启动时启动，也可以随时手动或程序地启动。在\
  \ Windows 系统上这些程序被称为服务。在 UNIX 或 Linux 系统上，它们被称为守护进程。\n\nWindows 后台进程的一些示例及其作用：\n\
  \n* `3CDMINIC.exe`——3COM 网卡的套件\n* `AcroRD32.exe`——用于管理 PDF 文件的 Adobe Acrobat Reader\
  \ 程序\n* `ALUNotify.exe`——赛防杀病毒软件包的自动更新通知\n* `EventMgr.exe`——微软事件管理器的后台任务\n* `Explorer.exe`——Windows\
  \ 资源管理器打开时运行的可执行文件\n* `MMC.exe`——微软管理控制台\n* `Spoolsv.exe`——管理传真和打印作业的 Windows 打印服务\n\
  * `Svchost.exe`——托管从 DLL 而非 EXE 运行的进程\n* `Javaw.exe`——Windows 版 Java 的组件\n* `Taskeng.exe`——负责激活旧任务\n\
  * `Taskhost.exe`——托管 UBPM 注册的任务\n\n\n\n\n\n大多数（如果不是全部）第三方应用程序要求一个或多个程序在服务器后台运行，以响应用户请求。除非发生故障，否则它们不需要应用程序管理员或其他任何人员的干预或处理。《应用程序管理员指南》应该提供有关你的应用程序是否依赖于后台服务以及这些服务的名称等信息。\n\
  \n作为应用程序管理员，有许多关于这些服务需要了解的内容。无论应用程序运行在 Windows 服务器、UNIX 服务器还是 Linux 服务器上，这些问题都适用。每种操作系统的用词可能略有不同，但基本原理是相同的。为了完全具备支持应用程序的能力，你需要对以下问题了如：\n\
  \n* 你的应用程序依赖于守护进程（daemons)或 Windows 服务（Windows Services）吗？\n* 如果是，它们的名称是什么？\n* 每个服务的用途是什么？\n\
  * 每个进程的可执行文件位于哪里？\n* 进程会创建日志文件吗？如果是，位于哪里？\n* 它们是如何启动的？通常情况下，进程会在操作系统启动后自动启动，但也可以手动或通过另一个进程启动。\n\
  * 启动时是否向它们传递了任何参数？如果是，有多少个参数以及预期值是什么？\n* 这些进程运行需要什么权限？\n* 它们在什么名称或账户下运行？\n* 如果你需要停止它们，应该如何操作？\n\
  * 如果存在多个进程，应该按什么顺序停止和启动它们？\n* 这个顺序是至关重要的还是仅仅是建议性的？\n* 在启动序列中的下一个进程之前，是否需要暂停启动一个进程？如果是，延迟应该持续多久？\n\
  * 如果停止了一个或多个进程，应用程序还会继续运行吗？\n* 是否有用于安装（创建）服务的脚本？\n* 是否有用于删除（移除）服务的脚本？\n\n## 16.3.1\
  \ Windows 服务\n\n在基于 Windows 的机器上，这些后台服务被称为“Windows 服务”（Windows Services）。如果你的应用程序运行在基于\
  \ Windows 的服务器上，那么很有可能它有一个或多个 Windows 服务在进行后台处理。\n\n### 16.3.1.1 Windows 服务面板\n\n\
  要查看服务器上存在的服务列表，你需要打开 Windows 服务面板。有几种方法可以调出该界面：\n\n* 开始 | 管理工具 | 服务\n* 开始 | 设置 |\
  \ 控制面板 | 管理工具 | 服务\n* 打开命令窗口，输入 `services.msc` 并按回车键\n* 开始 | 控制面板 | 管理工具 | 计算机管理，然后展开屏幕底部的“和服务应用程序”。点击“服务”图标。\n\
  \n图 16.4 是服务面板的截图。最重要的列是：\n\n* 名称——这是厂商技术和文档中引用该服务的名称\n* 状态——告诉你服务当前是否正在运行。“已启动”表示它正在运行。空白值表示未运行。\n\
  * 启动类型——告诉该服务是否在服务器启动时自动启动。其他候选项是手动启动或当前被禁用。\n\n![image](img/F000169f16-04-9780123985453.jpg)\n\
  \n图 16.4 Windows 服务面板。\n\n要获取特定服务的更多详细信息，请右键点击它并选择“属性”。图 16.5 是服务属性的截图。“常规”选项卡上最有价值的细节是该服务可执行文件的位置。此界面还允许你控制以下细节：\n\
  \n* “启动类型”下拉菜单允许你选择服务在服务器重启时是自动启动、手动启动还是被禁用。\n* 按钮允许你启动、停止、暂停或恢复服务器的执行。\n* 可以定义在执行启动时传递给服务的参数。\n\
  \n![image](img/F000169f16-05-9780123985453.jpg)\n\n图 16.5 特定服务的属性。\n\n服务的“登录”选项卡是你定义服务在启动时以什么账户执行的地方。指定的账户必须存在、处于激活状态，并且必须拥有服务运行所需的权限和授权。应用程序的安装过程通常会包含一个步骤，指示你创建一个所有服务都将在其下的的。图\
  \ 16.6 是“登录”选项卡的截图。在此示例中，服务在 Bprint Service 账户下运行。\n\n![image](img/F000169f16-06-9780123985453.jpg)\n\
  \n图 16.6 服务的登录详细信息。\n\nWindows 服务面板的“依赖关系”选项卡包含识别服务之间依赖关系的详细信息。在这种语境下，依赖关系意味着一个服务要求另一个服务在运行之前才能运行。图\
  \ 16.7 中所示截图告诉我们，在 TCScheduler 运行之前，Bprint Reminder 无法启动。\n\n![image](img/F000169f16-07-9780123985453.jpg)\n\
  \n图 16.7 服务的依赖关系详情。\n\n### 16.3.1.2 命令行控制 Windows 服务\n\nWindows 服务也可以在命令窗口中管理。用于此的基本命令有：\n\
  \n* `sc start <service-name>`启动服务\n* `sc query <service-name>`查询服务状态\n* `sc stop\
  \ <service-name>`停止服务\n* `sc create <service-name>`创建服务\n* `sc delete <service-name>`删除服务\n\
  \n要查看所有 `sc` 命令列表，打开命令窗口，输入 `sc ?` 并按回车键。要查看特定命令的更多详细信息，在命令窗口中输入 `sc command ?`\
  \ 并按回车键。\n\n### 16.3.1.3 控制远程服务器上的 Windows 服务\n\nWindows 命令的一个功能是它可以控制运行在远程服务器上的服务。例如，你的应用程序架构可能包含两台服务器。如果你登录到第一台服务器，可以使用\
  \ `sc` 命令控制第二台服务器上运行的服务。这是一种便利，因为你不需要登录到其他服务器即可操作服务。例如，此命令：\n\n```\nsc \\\\opp002\
  \ stop ServiceX\n```\n\n可以在服务器 opp001 上发布，以停止名为 opp002 服务器上的服务。\n\n### 16.3.1.4\
  \ 创建 Windows 服务\n\n虽然可能不需要知道 Windows 服务是如何创建的，但了解这一点很有帮助。通常使用批处理文件来创建应用程序使用的服务。批处理文件可能会在安装过程中执行，因此你通常不需要手动执行它。\n\
  \n在升级或排排除故障期间，你很有可能需要修改 Windows 服务。了解批处理文件、其位置以及其中的内容，将有助于你与厂商技术人员合作或自行调试问题。\n\n\
  图 16.8 中所示的代码是某个厂商用于创建其所依赖的 Windows 服务的批处理文件示例。其他厂商使用的批处理文件可能与此示例完全不同，但查看一个厂商创建\
  \ Windows 服务的方法是值得价值的。\n\n![image](img/F000169f16-08-9780123985453.jpg)\n\n图 16.8\
  \ 创建 Windows 服务的批处理文件内容。\n\n\n\n\n第一条语句调用另一个批文件 `SetEnv.bat`，该文件定义了 `lxasrvc` 命令中引用的变量。这些变量包含了正在使用的文件位置的信息。语句中实际创建服务的部分如下：\n\
  \n1. `lxasrvc` 是供应商提供的一个执行文件。\n2. 第二个参数引导 `lxasrvc` 对服务进行“安装”（install）。\n3. 服务名称将包含后缀“_lxlwtst.”。该应用程序的前缀始终是应用程序的名称。\n\
  4. 包含可执行文件的目录，即 `...\\software\\servers\\current`。\n5. `10950` 是服务将使用的端口。\n6. 最后一个参数是服务用于存放临时文件的目录。\n\
  \n#### 16.3.1.5 监控 Windows 服务\n\n如果你的应用程序依赖于一个对程序运行至关重要的服务，那么你将希望确保它始终在运行。至少有两种方法可以监控它：\n\
  \n1. 利用 Windows 服务（Windows Services）面板中可用的功能。\n2. 如果你的组织已经使用了如 `OpenView`、`Nagios`\
  \ 或 `SolarWinds` 等监控工具，则设置该工具来监控该应用程序。该监控工具的局限性将决定你如何响应服务故障。请参阅第 13 章有关监控的详细讨论。\n\
  \n如果应用程序的服务停止了，你必须决定希望发生什么。图 16.9 是 Windows 服务面板中“恢复”（Recovery）选项卡的截图。你有四种响应服务故障的选项：\n\
  \n* 不采取任何操作（Take No Action）——如果服务失败，将不执行任何操作。这是默认选项。\n* 重启服务（Restart the Service）——简单的响应是直接重启服务。这可能会让你的应用程序重新运行，但不会为你提供关于为什么发生这种情况以及发生频率的深度见解。\n\
  * 运行程序（Run a Program）——允许在服务失败时运行一个程序。你可以编写一个程序或脚本来执行以下一个或全部操作：向你报警问题、捕捉日志并重启服务。如果你选择运行程序，请点击\
  \ `Browse` 按钮，导航到程序位置并选择它。\n* 重启电脑（Restart the Computer）——这是一个极端的选择，但对于某些应用程序来说可能是正确的。\n\
  \n![image](img/F000169f16-09-9780123985453.jpg)\n\n图 16.9 Windows 服务面板的“恢复”选项卡。\n\
  \n注意，你可以根据服务在可配置天数内失败的次数采取不同的响应措施。第一次失败可能只需要重启服务。如果它在一天内第二次失败，你可能想发送警报、捕捉日志，然后重新重启它。超过第二次的失败可能会促使你重启服务器。\n\
  \n#### 16.3.1.6 从命令行窗口启动 Windows 服务\n\n从 Windows 服务面板启动服务是通常的运行方式，但有时你可能想从命令行窗口启动它们。要做到这一点，请打开命令行窗口，导航到服务可执行文件所在的目录，输入可执行文件的名称，并按\
  \ Enter 回车键。\n\n在调试服务时，这样做有优势。这些优势是：\n\n* 命令行窗口将保持打开，因此服务创建的任何输出对你都可见。如果通过服务面板启动服务，将看不到服务的任何输出。\n\
  * 在启动可执行文件时，可以向其传递参数。在调试服务时，传递一个强制服务执行额外日志的参数可能对故障排除活动很有帮助。\n\n从命令行窗口启动服务的两个劣势是：\n\
  \n* 如果重启服务器，服务将不会自动启动。在排除故障的过程中，这通常不是问题，但一旦你解决了问题，你需要确保在服务面板中启用了该服务。\n* 服务将在你登录服务器时使用的任何账户下运行。你需要确保所用账户具有服务恰当执行所需的相应权限。\n\
  \n### 16.3.2 UNIX 和 Linux 守护进程\n\n在基于 UNIX 或 Linux 的服务器上，守护进程（daemon）是一个在后台运行的进程，通常运行时间很长。从历史上，要成为守护进程，进程的父进程是\
  \ `init` 进程。`init` 总是 UNIX 或 Linux 启动时启动的第一个进程。进程成为守护进程还有两种方法：\n\n* 如果进程的父进程死亡，它的事实父进程将变为\
  \ `init`。\n* 由 `inetd`（一个管理其他守护进程的守护进程）发起的进程也被视为守护进程。\n\n在 UNIX 系统中，守护进程的名字习惯上以字母“d”结尾。示例包括\
  \ `inetd`、`xinetd`、`httpd`、`nfsd`、`named`、`ftpd` 和 `ldp`。但请记住，没有任何规定强制第三方供应商遵循这一规则。\n\
  \n通过检查 `/etc/services` 文件，可以找到 UNIX 或 Linux 系统上由 `inetd` 管理的服务列表。该文件还包括每个服务所使用的端口号。当\
  \ `inetd` 检测到某个端口上有请求时，它会扫描服务文件并启动与该端口关联进程。接下来的代码段显示了服务文件中可能存在的条目示例：\n\n![Image](img/T000169T010)\n\
  \n## 16.4 是什么在运行你的服务器？\n\n你可能认为你知道服务器上运行着什么软件，但你真的知道吗？你的组织可能有一套标准软件包，被加载到每台服务器上。你可能没有请求加载某些软件包，但它们确实被安装了。以下类型的软件是否有任何运行在你的服务器上？\n\
  \n| 软件类型 | 示例 |\n| --- | --- |\n| 杀病毒软件 | `Symantec`, `Norton AntiVirus` |\n| 防火墙\
  \ | `WatchGuard`, `Symantec` |\n| 监控软件 | `HP Open View`, `SolarWinds` |\n| 备份软件\
  \ | `CommVault` |\n| 交付软件 | `LAN Desk` |\n| Web 服务器软件 | `Apache`, `IIS`, `WebLogic`\
  \ |\n| 数据库软件 | `Oracle`, `SQL Server`, `MySQL` |\n| 邮件软件 | `Outlook`, `SMTP` |\n\
  | FTP 服务器软件 | `FileZilla`, `Cerebus FTP Server` |\n| 日志监控软件 | `Splunk`, `SolarWinds\
  \ Log, Event Manager` |\n| 报告软件 | `Crystal Reports` |\n| 负载均衡软件 | `Big IP`, `ACE`\
  \ |\n| 虚拟机软件 | `VMWare` |\n| 工具程序 | `Process Explorer` |\n| 调度软件 | `Control-M`,\
  \ `Tivoli Workload Scheduler` |\n| 恶意软件检测软件 | `Spybot`, `Ad-Aware` |\n\n### 16.4.1\
  \ 如何识别服务器上运行着什么？\n\n确定服务器上运行软件的方法有很多，尽管没有一种方法能提供你所需的所有细节。在 Microsoft 服务器上可以使用的一种工具是\
  \ `msconfig` 工具。使用它的步骤如下：\n\n1. 点击“开始”按钮并选择“运行”\n2. 在“打开”文本字段中输入 `msconfig` 并点击确定按钮\n\
  3. 将显示系统配置实用程序\n4. 选择“启动”选项卡。所有在服务器启动时启动的程序将显示出来。图 16.10 是该工具启动选项卡的截图。\n\n![image](img/F000169f16-10-9780123985453.jpg)\n\
  \n图 16.10 Windows 服务面板的启动选项卡。\n\nWindows 任务管理器（Task Manager）列出了运行在 Windows 计算机、工作站或服务器上的所有进程。遗憾的是，虽然它可以提供有关所有进程的一些细节，但它不会告诉你每个进程正在做什么。要获取这些信息，最好的办法是在互联网上搜索。该工具在第\
  \ 27 章](#CHP027.html) 中有所描述。\n\n\n\n\n\n可用于列出 Windows 服务器上软件的第三种工具是控制面板中的“程序和功能”界面，特别是“卸载或更改程序”界面。要打开此工具，点击`开始\
  \ | 控制面板 | 卸载程序`。图 16.11 是此显示内容的截图。它列出了所有在服务器上安装的软件。从此界面，你可以修改或卸载应用程序。\n\n![image](img/F000169f16-11-9780123985453.jpg)\n\
  \n图 16.11 Microsoft 卸载程序。\n\n这两个工具都能告诉你服务器上加载了哪些内容。但它们无法告诉你每个程序的作用是什么、它们为什么被加载、是由于谁加载了它们，或者它们是否真的需要。要弄清楚这些，你将不得不进行一些研究。这里描述了获取这些信息的两个潜在来源：\n\
  \n1. 你的应用程序所需的程序可能已经列在供应商的《安装指南》中。检查此列表应该允许你排除服务器上的某些程序。\n2. 联系你组织内实际构建服务器的团队。他们可以告诉你服务器上加载了哪些标准软件包以及每个软件包执行什么功能。\n\
  \n在这两个程序列表中，任何尚未说明的剩余程序都需要调查。你可能发现了可以从服务器上删除的软件，但执行此操作时需要格外谨慎。你应该联系供应商的支持台，以确保你不会删除应用程序运行所必需的软件。你还应该联系用户团队，以确保这些不是他们请求安装在服务器上的内容。\n\
  \n## 16.5 环境变量\n\n环境变量是计算机上可以动态更改的命名值。用户、应用程序和进程都可以访问这些变量。环境变量存在于 Windows、UNIX 和基于\
  \ Linux 的计算机中，尽管每个环境的具体细节有所不同。\n\n你所支持的应用程序几乎会引用某些环境变量。《安装指南》将提供有关在安装应用程序之前需要创建哪些环境变量的具体说明。你应该熟练地在服务器运行的操作系统上显示、创建和修改环境变量。\n\
  \n下表列出了你可能会遇到的一些较常见的环境变量。当然，任何给定的应用程序都可能只引用服务器上定义的变量的一小部分。\n\n| 变量名 | 用途 |\n| ---\
  \ | --- |\n| `PATH` | 包含子目录列表。当操作系统查找可执行文件时，它将搜索 `PATH` 中的所有子目录 |\n| `PATHEXT` |\
  \ 包含文件扩展名列表，例如 bat、cmd 和 ext。当操作系统查找要启动的程序时，它将查找具有这些扩展名的文件 |\n| `USERNAME` | 当前登录计算机的用户名\
  \ |\n| `JAVA_HOME` | 存放 Java 文件的目录 |\n| `ORACLE_HOME` | 存放 Oracle 相关文件的目录 |\n| `TEMP`\
  \ | 临时文件存放的目录 |\n| `TMP` | 临时文件存放的目录 |\n\n要查看 Windows、UNIX 和 Linux 系统中的所有环境变量，请在命令行窗口中输入命令\
  \ `set`。服务器上当前定义的每一个环境变量都会显示在窗口中。图 16.12 是在 Windows 服务器上执行此命令的截图。\n\n![image](img/F000169f16-12-9780123985453.jpg)\n\
  \n图 16.12 `set` 命令的输出。\n\n### 16.5.1 在 Windows 中管理变量\n\n要在 Windows 服务器上创建或更改环境变量，需使用\
  \ `set` 命令。附加参数决定变量是在被创建、读取还是销毁。在以下命令中，可以选择使用引号来包围文本值。\n\n创建一个环境变量的命令如下：\n\n```\n\
  set NEW_ENV_VARIABLE=“new value”\n```\n\n显示变量内容的命令是：\n```\nset NEW_ENV_VARIABLE\n\
  ```\n\n更改变量内容的命令与创建变量的命令相同：\n```\nset NEW_ENV_VARIABLE=”new value”\n```\n\n要删除环境变量，输入\
  \ set 命令，并包含等号，但不包含值：\n```\nset NEW_ENV_VARIABLE =\n```\n\n在 Windows 中查看和修改环境变量的另一种方法是在系统显示中打开“高级系统设置”窗口。要在\
  \ Windows 2008 服务器上访问此界面，请执行以下操作：\n\n1. 右键点击“计算机”图标并选择“属性”\n2. 点击“高级系统设置”链接\n3.\
  \ 点击“高级”选项卡\n4. 点击标记为“环境变量”的按钮\n\n显示的屏幕将列出所有本地变量和系统变量。本地变量只有你登录的账户可以访问。系统变量可供所有程序和账户访问。点击相应的按钮可以创建新变量、编辑现有变量或删除变量。图\
  \ 16.13 显示了环境变量窗口界面。如果你不擅长使用命令行，那么它是管理变量的更好替代方案。\n\n![image](img/F000169f16-13-9780123985453.jpg)\n\
  \n图 16.13 Windows 上的环境变量。\n\n### 16.5.2 在 UNIX 中管理变量\n\n在 UNIX 服务器上，创建、修改、显示和删除环境变量的命令取决于所使用的\
  \ shell。对于 C shell 的命令如下：\n\n创建一个环境变量或更改现有变量的值，命令如下：\n```\nsetenv VARIABLE_NAME\
  \ value\n```\n\n显示变量内容的命令是：\n```\nprintenv VARIABLE_NAME\n```\n\n要删除环境变量，输入 set\
  \ 命令，包含等号，但不包含值：\n```\nunsetenv VARIABLE_NAME\n```\n\n在 UNIX 和 Linux 系统上，环境变量的名称是大小敏感的。例如，`HOME`\
  \ 和 `home` 是两个不同的变量。在 Windows 系统上，名称不是大小敏感的。`WIN_HOME` 和 `win_home` 都指向同一个环境变量。\n\
  \n## 16.6 Path\n\n`Path` 是环境变量的一种特殊实例。由于它被广泛使用，因此需要单独讨论。该变量持有的值包含目录名称列表，用于识别可执行程序或库的位置。每当程序需要启动时，操作系统都会在\
  \ `Path` 指定的目录中查找。如果程序不在这些目录中，你将收到错误。如果是这样，选择有：\n\n1. 指定程序的确切路径\n2. 将程序移动到 `Path`\
  \ 环境变量指定的目录之一\n3. 修改 `Path` 环境变量以包含该程序所在的目录\n\n程序可以访问路径环境变量，并在其中的每个目录中搜索它们所需的文件。在\
  \ UNIX 或 Linux 系统上，各个目录用冒号分隔。在 Windows 系统上，它们用分号分隔。\n\n在安装过程中，应用程序可能会修改 `PATH` 的值以包含它将引用的目录。这可能由安装程序完成，也可能由安装人员手动完成。确保对路径变量的任何更改都在不损坏其现有内容的情况下进行是非常重要的。如果发生这种情况，那么新应用程序可以工作，但现有软件可能无法运行。\n\
  \n\n\n\n要查看 Windows 计算机上路径（path）变量的内容，请打开命令提示窗口，输入命令 `path` 并按回车键。图 16.14 显示了输入\
  \ `path` 命令后的结果。通常，`path` 环境变量中持有的值非常长。由于这个长度，你可能会发现使用描述的 GUI 来操作 `path` 命令会更简单。\n\
  \n![image](img/F000169f16-14-9780123985453.jpg)\n\n图 16.14 在 Windows 计算机上显示路径变量。\n\
  \n## 16.7 服务器上的账户\n\n你尽可能将对服务器的访问权限限制到最低，但访问服务器确实有合法的需求。你需要知道谁需要服务器账户，以及需要哪些权限。需要存在的账户示例包括：\n\
  \n- **应用程序所需的账户**——这些账户有时被称为“服务账户”。它们通常不允许用户登录服务器。相反，它们供运行在服务器上的程序或进程使用。《安装指南》将告诉你该应用程序在服务器上是否需要服务账户。\n\
  - **供应商支持账户**——对于向供应商提供对服务器的无限制访问，你必须非常警惕。如果你给供应商一个账户，你不仅是允许其人员访问你的服务器，而且还假设了他们服务器和网络的安全性足以将黑客隔之门外。\n\
  - **应用程序管理员账户**——应用程序管理员及其备份人员需要在服务器上拥有账户。你将在这台服务器上花费大量时间，因此你的账户需要对它拥有完全访问权限。\n\
  - **服务器管理员**——如果你的组织有一个处理服务器管理的团队（即构建和维护服务器的团队），那么这个小组需要能够访问你的应用程序服务器。\n\n你组织中可能也需要访问服务器的其他团队或部门包括：\n\
  \n- 支持备份过程的团队\n- 支持监控软件的团队\n- 支持操作系统的团队\n- 支持防病毒软件的团队\n\n## 16.8 排除服务器故障\n\n无论应用程序编写得有多好、运行得有多良好，总有一天它会出问题。在那一天，你必须远程连接到服务器并找出如何修复它。现实情况让你的努力变得复杂，因为你实际上需要完成两个任务：\n\
  \n1. 尽快获取应用程序备份。\n2. 理解问题的根源，以便将来防止问题再次发生。\n\n有时这些任务是互斥的。如果你在收集日志或其他细节之前重启了应用程序，你可能会销毁或覆盖可以识别问题根源的信息。\n\
  \n下面的章节描述了应用程序服务器上可能发生的一些问题。当然，不可能包含每个应用程序服务器上可能发生的每一个问题，但此列表为你提供了一个可能出现问题的简要清单。\n\
  \n### 16.8.1 磁盘空间不足\n\n服务器在构建时其磁盘空间是有限的。从那一天起，可用空间往往倾向于稳定减少。如果可用磁盘空间量达到临界低值，那么服务器很可能会崩溃。\n\
  \n这个指标绝对应该是定期进行监控的内容。如果你的组织没有配备像 `OpenView`、`Nagios` 或 `SolarWinds` 这样的监控软件包，那么你应该认真考虑编写一个脚本来完成此工作。编写此类脚本并不复杂。Windows、UNIX\
  \ 和 Linux 中都有可以返回可用空空间限额的命令。如果该数值低于预设阈值，则应发送电子邮件警报。\n\n当可用磁盘空间低于此水平时，应该首先检查几个地方，以查看它们是否是消耗空间的地方。根据我的经验，这些“常的疑犯”有：\n\
  \n- **日志文件**——日志文件增长得极快，特别是当发生某些错误时。在删除任何日志文件之前，务必检查日志文件是否存在错误。在删除日志文件或任何类型的文件之前，你还应该获得用户的许可。删除日志文件的另一种替代方案是将其进行压缩。由于日志文件通常是文本，你将体验到的压缩率可能是\
  \ 10:1 或更高。\n- **临时文件**——某些应用程序在执行过程中会创建临时文件。如果发生问题，临时文件可能不会在适当的时间被删除。随着时间的推移，临时文件可能会消耗大量的空间。除非你对临时文件的性质非常熟悉，否则你不应该在没有用户社区或更有可能的供应商支持小组的批准的情况下删除它们。\n\
  - **计算文件**——与临时文件一样，某些应用程序会创建处理期间使用的计算文件。当这些文件不再需要时，Calc 文件有时不会被删除。\n- **报告**——如果你的应用程序在应用程序服务器上创建报告文件，那么可能旧的、不再需要的报告没有被定期删除。除非你与用户社区就此问题达成一致，否则不要在向他们确认的情况下删除报告文件。\n\
  - **安装文件**——在安装软件时，通常会有一些非常大的文件需要放置在服务器上。一旦安装完成并验证，这些文件就不再需要了。在验证安装后，很容易忘记删除它们。在这种情况下，你不需要在删除前向用户确认。\n\
  - **升级文件**——像安装文件一样，升级通常需要将一些大文件下载到服务器上。一旦升级应用并验证，这些文件就不再需要了。如果你忘记删除它们，它们会消耗大量的空间。\n\
  - **卷影**——Windows 操作系统提供可以自动或手动创建文件副本的功能。这种技术被称为卷影复制服务或 `VSS`。`VSS` 的一个常见用途是为要备份的文件创建只读副本。通过在某个时刻创建这些文件的快照，备份工具可以存储一致的备份集。有时，备份工具退出时不会删除卷影文件。由于这些文件通常很大，它们会对磁盘可用空间产生重大影响。\n\
  \n你可以通过在 Windows 资源管理器中右键点击驱动器并选择“卷影”选项卡来确定驱动器上是否存在卷影。图 16.15 显示了此服务器上的 `E:` 驱动器包含一个\
  \ `C:` 驱动器的 21GB 卷影。你可以通过点击禁用来删除此文件。\n\n![image](img/F000169f16-15-9780123985453.jpg)\n\
  \n图 16.15 在 Windows 资源管理器中识别卷影。\n\n如果上述位置列表没有发现任何可以删除的大文件，那么你必须更深入地挖掘。打开 Windows\
  \ 资源管理器实例并搜索相关驱动器，关注大文件。我通常从至少 10 MB 或 20 MB 的文件开始。搜索完成后，按文件大小从降序排序列表，这样你就可以优先处理最大的文件。希望这个过程能识别出可以删除的文件并缓解你的磁盘空间危机。一如既往，在实际删除之前，务绝对确定删除这些文件不会对应用程序产生任何伤害。\n\
  \n\n\n\n\n关于恢复磁盘空间的最后一点建议：如果你删除了上述位置中的文件，它们可能会被移动到服务器的回收篓。要收回空间，你可能需要右键点击回收篓并选择“清空回收篓”子菜单项。为了在\
  \ Windows 资源管理器中删除文件时避免将文件移动到回收篓，请使用 `Shift-Delete` 键组合。\n\n### 16.8.2 CPU 异常繁忙\n\
  \n应用程序服务器上可能出现的另一个问题是 CPU 变得极其忙碌。如果发生这种情况，用户的应用程序性能将会下降。在 Windows 服务器上查看处理器忙程度的一种非常快速的方法是打开任务管理器。在任务栏（例如屏幕底部）上右键点击。图\
  \ 16.16 显示了任务管理器 `Processes` 选项卡的截图。通常情况下，`System Idle Process`（空闲进程）占用服务器大部分大部分\
  \ CPU 时间。如果另一个进程持续占用 CPU 时间的大比例，那么它可能出现了故障。\n\n![image](img/F000169f16-16-9780123985453.jpg)\n\
  \n图 16.16 任务管理器中的性能选项卡。\n\n任务管理器的状态栏（即底部一行）提供了某些有用信息的快速参考。例如，它列出了：\n\n- 当前正在运行的进程数\n\
  - 正在使用的 CPU 时间量\n- 正在使用的内存量\n\n要理解什么是正常与非正常情况，你需要在应用程序正常运行时查看 `Processes` 界面。如果一个通常只使用\
  \ 1% 或 2% CPU 的进程现在占用了大部分 CPU 时间，并持续这种模式很长时间，那么它可能需要被杀死。要在任务管理器中杀死一个进程，右键点击它并选择子菜单项“结束进程”或“结束进程树”。\n\
  \n在杀死一个不熟悉的进程之前，你应该考虑联系供应商的支持组（Support Group），以帮助理解该进程正在做什么。如果它与应用程序没有关联，你可以对它进行互联网搜索，以确切了解它的功能以及它为什么可能出现故障。\n\
  \n### 16.8.3 已停止的服务\n\n如果应用程序停止响应用户请求，可能是因为它的一个或多个服务已停止执行。要确认这一点，请打开 `Services`（服务）面板。请参考\
  \ 图 16.4 以复习如何操作。如果应用程序的一个服务状态不是“Started（已启动）”，那么这可能就是问题所在。\n\n要让应用程序重新上线，你需要重启该服务，但在此之前，你应该考虑以下两点：\n\
  \n1. 是什么导致了服务停止？检查应用程序的日志文件，寻找可能导致问题原因的线索。由于你可能需要联系供应商的支持组寻求帮助，建议对应用程序日志文件进行备份，以防他们索要。最好在采取任何额外步骤（如重启停止的服务）之前捕获日志文件。\n\
  2. 如果应用程序有多个服务，它们是否需要按特定顺序启动？如果是，你可能需要停止所有服务并按照正确的顺序重启它们。\n\n### 16.8.4 数据库连接\n\n\
  如果你的应用程序依赖于 Oracle 或 SQL Server 等数据库，那么任何数据库问题都有可能导致应用程序禁用。数据库并不一定需要宕机导致应用程序问题。我支持过多个在处理数据库连接性问题时并不复杂的应用程序。如果与数据库的连接丢失（即使是瞬间的），应用程序也会停止运行。要让它恢复运行，必须停止并重启应用程序。\n\
  \n要确定是否是数据库问题导致你的应用程序出现问题，你可以采取以下两个步骤：\n\n1. 在应用程序日志文件中检查是否有指示数据库连接断的条目。打开日志并搜索“database（数据库）”或“connection（连接）”等术语。如果没有找到这些术语，你需要手动扫描日志。从当前时间开始回溯，直到找到与数据库相关的条目或到达应用程序运行正常的时间点。如果你找到记录了数据库连接问题的条目，你一定要记录错误信息文本以备日后参考。\n\
  2. 尝试使用 `SQL*Plus` 或 `Toad` 等工具建立数据库连接。\n\n- 如果无法连接到数据库，那么数据库可能宕机了。联系 DBA 团队并要求他们调查。\n\
  - 如果可以连接到数据库，那么可能是数据库访问瞬间丢失了。如果是这种情况，解决方案可能是关闭应用程序并重启它。\n\n### 16.8.5 Web 服务器问题\n\
  \n如果你的应用程序是基于 Web 的，那么你的应用程序所依赖的 Web 服务器可能出现了问题。如果 Microsoft IIS（互联网信息服务）或 Apache\
  \ Tomcat 等软件运行在你的应用程序服务器上，那么你应该检查这些软件包以确认它们正在运行。\n\n检查 IIS 的步骤描述在此：\n\n1. 点击“开始\
  \ | 管理工具 | 互联网信息服务 (IIS) 管理器”\n2. 如必要，点击计算机名称旁边的 `+` 号展开它\n3. 如必要，点击 `Web Sites（网站）`\
  \ 文件夹旁边的 `+` 号\n4. 如果与应用程序相关的网站状态为“stopped（已停止）”，则它需要重启。图 16.17 是 IIS 管理器的截图，显示“Default”已停止\n\
  \n![image](img/F000169f16-17-9780123985453.jpg)\n\n图 16.17  IIS 的状态。\n\n5. 要重启网站，右键点击它并选择“Start（启动）”。\n\
  \n如果你的应用程序网站是服务器唯一的，你可以重启 IIS 而不是特定网站。操作步骤如下：\n\n1. 打开命令行窗口\n2. 输入命令 `iisreset`\
  \ 并按回车键\n3 显示服务已停止和启动的消息\n\n## 16.9 重启服务器\n\n如果停止并重启应用程序服务不能解决问题，那么你可能需要停止服务器自身的操作系统。这通常被称为“重启服务器（bouncing\
  \ the server）”。如果你对服务器拥有管理员权限，停止 Windows 服务器并不难。右键点击开始按钮并选择“关机”。将弹出一个窗口询问你下一步的操作。选项有“注销当前用户”、“关机”、“重启”、“待机”和“断开连接”。选择“重启”选项并点击确定。重启程序将启动。\n\
  \n\n\n\n\n- 重启服务器需要什么审批？例如，你是否需要联系应用程序的业务所有者或用户团队代表获取许可？提前警告服务器即将宕机是否被认为是良好的礼仪？\n\
  - 你的组织是否在应用程序服务器上运行任何监控软件，例如 OpenView 或 `Nagios`？如果是，你是否需要禁用它或将服务器设置为“维护模式”，以避免发送关于服务器停止的虚假警报？\n\
  - 每次重启是否需要记录在某处，例如日志簿中？\n- 每次服务器宕机时是否需要完成一份“故障报告”？\n- 此操作会影响服务器上维护的可用性指标吗？\n\n#\
  \ 第 17 章：性能调优\n\n## 摘要\n\n需要进行性能调优以确保应用程序运行状况良好。调优是一个复杂的课题，需要来自多个领域的输入，包括操作系统、支持软件、数据库以及应用程序本身。在开始更改任何内容之前，请定义目标。除了应用程序，服务器上的任何支持软件都需要进行调优。\n\
  \n### 关键词\n\n性能调优；调优目标；响应时间；性能测量工具；支持软件；缓存；内存；处理器；磁盘驱动器；SSD；聚类；负载均衡\n\n性能调优是尝试提高应用程序或系统性能，直到其达到或超过性能目标的过程。调优是一个复杂的课题，需要来自多个领域的输入，包括操作系统、支持软件、数据库以及应用程序本身。对某个应用程序有帮助的技巧在另一个应用程序上可能无用甚至无法实现。在阅读本章时，请记住并非所有这些技巧或技术都适用于你的环境。提到的工具你可能无法使用。提到的服务器或应用程序设置可能已经处于其优化值。\n\
  \n在调优应用程序方面，以下建议适用于所有环境。遵循这些建议将有助于你学习哪些操作有效，哪些操作无效。更重要的是，如果你所做的更改实际上降低了性能，这可以帮助你恢复原始状态。\n\
  \n- 一次只一种更改。如果你同时进行多项更改，你将不知道每项更改实际上产生了什么影响。\n- 对更改的内容保留详细的记录，包括更改的内容、原始值、新值、日期、时间以及更改对性能的影响。\n\
  - 每次做出更改后，使用一致的测试脚本测试应用程序。每次完成更改后，应以相同的顺序执行相同的测试。在每次测试后应记录观察到的响应时间或其他指标。\n- 尽可能减少或消除应用程序上的所有其他活动。如果无法消除附带活动，则它在每次测试运行之间需要保持一致。比较在一名用户登录系统时进行的测试与\
  \ 1000 名用户登录系统时运行相同的测试是不准确的。\n\n## 17.1 想要实现什么样的调优目标？\n\n老话所说“如果你不知道要去去哪里，你就不知道何时能到达那里这也适用于调优。在开始更改环境之前，你需要清楚地理解你试图实现什么。例如，你的目标可能是：\n\
  - 提高应用程序用户体验的响应时间\n- 让批处理过程更快地完成\n- 减少网络流量\n- 提高应用程序的可用性\n- 使用服务器上更少的内存\n- 释放磁盘空间\n\
  - 确定增加资源（如内存、处理器）性能是否会提高\n\n以上所有内容都是合理的调优目标。可能最常见的目标是提高用户的响应时间，但在开始进行更改之前，你必须知道你的目标是什么。\n\
  \n关于调优工作的一个警告是，很多时候潜在目标可能是相互冲突的。提高性能某一方面的努力实际上可能会降低另一个方面的性能。例如，提高批处理作业的吞吐量可能会缩短用户看到的响应时间，反之亦然。检查你的目标，以确保你没有处于无赢的境地。\n\
  \n### 17.1.1 测量响应时间\n\n为了确定你是否符合性能标准，每个人都需要对标准的含义达成共识。例如，如果你的目标是衡量和改进响应时间，那么你需要对响应什么操作达成共识？它是完成以下操作的时间：\n\
  - 登录应用程序？\n- 打开平均屏幕，但哪个屏幕是“平均”屏幕？\n- 打开一个带有静态文本但没有动态填充字段的屏幕？\n- 打开一个带有大量图形图标的屏幕？\n\
  - 打开一个包含复杂计算的屏幕？\n- 打开一个包含表格中多行数据的屏幕？\n- 刷新上述任何屏幕？\n- 执行复杂的搜索操作以查找单个记录？\n- 创建新记录？\n\
  - 修改现有记录？\n- 删除现有记录？\n- 运行报告？\n\n另一个需要回答的问题是上述操作将在何时进行测试。相同操作的性能可能会根据运行时间的不同而产生巨大差异。例如，考虑以下执行时间：\n\
  - 晚上 10:00，如果那是夜间备份过程启动的时间\n- 凌晨 12:10，如果那是运行每日导入过程的时间\n- 凌晨 5:00，当极少数用户登录应用程序时\n\
  - 上午 8:30，当大多数用户买完咖啡正在登录应用程序时\n- 中午，当大多数用户外出吃午餐或未活跃使用应用程序时\n- 公司结月或结季度账目的前一天\n-\
  \ 周日晚上，当几乎没有人在办公室或远程访问应用程序时\n- 圣诞节和新年之间的一周，此时大多数用户不在办公室或在与同事聊天\n- 每月处理工资单的那天\n\n\
  如上述列表所示，企业级应用程序的典型用户在极不同的系统利用率下执行许多不同的操作。某些操作无论何时运行都预计可以很快地完成。其他操作如果是系统中只运行这些操作时，执行时间会长得多。哪些操作代表了“平均”活动和条件？\n\
  \n### 17.1.2 什么是“正常”响应时间？\n\n如果你没有为特定屏幕记录特定的预期响应时间列表，那么你需要对正常日子的响应时间有一个良好的直觉。这种知识将帮助你识别性能是否下降。如果你不知道什么是“正常”响应时间，那么当人们抱怨系统慢时，你就无法反驳他们。\n\
  \n\n\n\n某些界面总是很慢。我支持过的一个应用程序，其界面上列出了成百上千个对象。无论系统调优得多么细致，那个界面总是很慢。你的应用程序可能也有类似的界面。如果你知道哪些界面启动总是很慢，那么当用户对这些界面抱怨时，你就能如实地回答它们现在的运行速度并不比平时慢。相反，如果一个通常显示时间不到一秒的界面现在需要\
  \ 30 秒，那么你就知道出什么问题了。\n\n如果能够知道界面启动需要多长时间，这将是非常有价值的信息。请检查软件的《管理员指南》或联系供应商支持以获取以下问题的答案：\n\
  \n- 应用程序是否已经记录了此类信息？\n- 是否可以通过增强日志记录来捕这些信息？\n- 如果应用程序是由内部开发团队编写的，可以添加此功能吗？\n- 是否可以使用自动化测试工具启动界面并记录每个界面启动的时间？这些工具的示例包括\
  \ `Watir`、`Selenium`、`Visual Studio Test Professional` 和 `Rational Functional Tester`。\n\
  \n在采集这些统计数据时，要注意应用程序日志记录会消耗 CPU 周期、磁盘 I/O 和磁盘空间。如果启用了大量的日志记录并持续时间过长，其活动可能会降低应用程序的性能。\n\
  \n采集性能统计数据的最佳时间是“正常”的一天，即不是在结账前、批处理文件运行或正在执行复杂搜索时。如果能定期采集这些统计数据（例如每周或每月一次），会更好。这将允许你观察用户正在经历的性能趋势。\n\
  \n### 17.1.3 性能是瞬时退化的还是随时间退化的？\n\n重要应用程序的性能永远不可能是静态的，因为环境既复杂又是动态的。以下是用户每次登录应用程序时可能发生变化的几个示例：\n\
  \n- 供应商发布的升级对应用程序更改了更改\n- 支持软件（包括操作系统）的更新频率通常比应用程序更高\n- 数据库中的行数始终在变化\n- 工具软件的更新或操作（如防病毒扫描）可能会对性能产生负面影响\n\
  - 访问应用程序的用户数每次登录时都可能不同\n- 网络和服务器负载每分钟都在变化，即使不是每秒都在变\n- 用户工作站上运行的程序数量可能每小时或每天都有很大差异\n\
  \n如果你投入精力定期采集性能统计数据，你就能识别出性能趋势。识别性能趋势可以帮助你找到性能问题的原因。\n\n#### 17.1.3.1 瞬时\n\n如果性能是瞬时或相对快速退化的，那么可能是环境中的某些重大因素发生了变化。你可以问自己一些问题，可能帮助发现发生了什么变化：\n\
  \n- 服务器上最近是否更改了任何软件？这可能包括应用程序和支持软件。例如，性能是否在应用程序上次升级后立即下降，或者在操作系统应用了最新的维护补丁的第二天下降的？\n\
  - 是否有硬件故障？如果你的磁盘存储包含 `RAID` 阵列且其中一个或多个驱动器崩溃，阵列可能继续运行，但性能将不再那么好。如果你的环境包含服务器集群，是否其中一个或多个服务器退出了集群？你的\
  \ `NIC`速率是否从 `100 Mbps` 降到了 `10 Kbps`？\n- 应用程序服务器、网络、数据库服务器或用户工作站上是否运行了某些平时此时不运行的程序？例如，夜间备份是否在\
  \ `7 am` 仍在运行？如果是，那么你的应用程序在 1 月份运行得比粘糖还慢也不足为了。\n- 最近你的防病毒软件是否有任何更改？扫描级别是否有所提高？例如，它现在是扫描每个被访问的文件，而以前只扫描被复制到服务器上的文件吗？\n\
  - 如果网络访问似乎比正常慢，可能是由于防火墙的更改引起的。维护防火墙是复杂的。如果最近发生了重大更改，它们可能会减慢发往网络或从网络进入的数据包。\n- 是否有人最近在应用程序中启用了详细日志记录？某些应用程序具有可以开启的不同日志记录级别。最低级别只记录错误，但最高级别会记录应用程序执行的所有操作。这种级别的日志记录有其用处，但会对性能产生重大影响。\n\
  \n这些问题的答案可能并不容易找到。你必须与组织内负责特定技术领域的其他专家小组合作。这需要时间，你的大多数提问可能无功而归，但如果应用程序性能下降得非常快，那么一定有原因导致了它，你需要寻找直到找到原因。\n\
  \n#### 17.1.3.2 随时间\n\n如果性能是随时间退化的，那么原因可能与一夜之间发生的变化不同。这里给出了一些潜在原因：\n\n- 如果可用磁盘空间变得过低，服务器性能可能会下降或服务器可能会崩溃。如果不定期清理，日志文件和临时文件往往会随时间推积。\n\
  - 服务器内存不足绝对会影响性能。潜在的解决方案是增加更多 `RAM` 或减少服务器上运行的进程数量。内存不足的一个潜在原因是应用程序存在内存泄漏问题。进程请求分配内存，并在完成后将其返回给操作系统。如果你的应用程序持续分配内存但从不返回，那么最终所有可用内存都将耗尽。这些丢失的内存可以通过停止应用程序来恢复。如果可以定期（例如每周）停止并重启应用程序，可能会缓解泄漏问题。\n\
  \n\n\n• 数据库变得过大或臃肿会阻碍许多活动，包括用户响应时间和完成备份所需的时间。某些应用程序的设计为从不实际删除数据。如果你删除了记录，实际发生的情况是它们被标记为对用户隐藏。尽管它们被隐藏了，但它们仍然需要被搜索和备份。如果你的应用程序是这样处理记录删除的，而且你知道数据库中包含大量的过时数据，那么你可能想要考虑从数据库中导出所有活动数据，然后将其导入到一个空的数据库中。这将产生真正清除数据库中过时数据的效果。在开始此类工作之前，你可能需要与供应商的支持台协商，以查看是否可行以及/或是否有建议。你还需要确保对原始数据库进行备份。\n\
  \n• 最初仅在本地使用的应用程序最终可能会吸引来自整个企业甚至可能是整个国家或世界的用户。如果你的系统有这种经历，你可能需要考虑采取步骤来提高这些远端应用程序用户的性能。提高网络吞吐量是否可行？应用程序是否允许存在多个地理分散的应用程序或数据库服务器？这些步骤听起来可能很极端，但如果你的应用程序对全球用户至关重要，那么可能需要考虑此类的步骤。\n\
  \n## 17.2 性能测量工具\n\n要衡量性能，你需要能够捕捉特定指标的工具。你不能在屏幕出现时在心里默数“一密西西比，两密西西比”并期望获得准确的测量结果。有很多可用工具可以帮助你，但从你操作系统中已有的工具开始也无害处。\n\
  \n### 17.2.1 Windows 工具\n\n每个操作系统都带有某种形式的性能管理工具，Windows 也例外。以下章节描述了 Windows 自带的一些工具。还有许多其他开源和专有的工具可以加载到你的服务器上。\n\
  \n#### 17.2.1.1 任务管理器\n\n在 Windows 计算机上，最容易访问的性能工具是任务管理器。通过右键点击屏幕底部的任务栏并选择“启动任务管理器”来打开它。按下组合键\
  \ `Ctrl-Alt-Delete` 并选择“启动任务管理器”也可以打开它。\n\n在调整服务器时，任务管理器中有三个选项卡非常有帮助：“进程”、“性能”和“网络”选项卡。图\
  \ 17.1 是“进程”选项卡的截图。它显示了活动进程以及每个进程消耗的 CPU 时间和内存。通常情况下，系统空闲进程消耗了大部分 CPU 时间，但被密集使用的\
  \ CPU 可能会显示其他进程占用了显著百分比的 CPU 时间。如果某个进程的 CPU 使用率持续高于所有其他进程，可能意味着它出了问题。即使没有其他问题，它无疑也是值得检查的候选对象，看看是否可以运行得更高效。通过点击列标题来按\
  \ CPU 或内存对显示进行排序，可以轻松地查看哪些进程使用了最多的资源。\n\n![image](img/F000170f17-01-9780123985453.jpg)\n\
  \n图 17.1 任务管理器\n\n“性能”选项卡以图表形式呈现 CPU 使用情况。图 17.2 显示了“性能”选项卡。随着时间的进行，新数据被添加到右侧。可以通过选择\
  \ `查看` 来调整读取之间的间隔。在图表中显示使用情况可以轻松识别峰值。如果你认为性能受到限制，任务管理器的一些功能可以显示正在使用多少内存。\n\n![image](img/F000170f17-02-9780123985453.jpg)\n\
  \n图 17.2 任务管理器\n\n如果你在“进程”选项卡上右键点击某个进程，选项有“结束进程”和“结束树”。如果你选择“结束进程”，它将被终止。如果你选择“结束树”，它将被终止。任务管理器的附加功能是允许你设置优先级：\n\
  \n- 实时\n- 高\n- 高于普通\n- 正常\n- 低于普通\n- 低\n\n一组正在捕捉的测量包含在一个名为 `Counter Log`（计数器日志）的对象中。你可以在服务器上同时运行多个一个计数器日志。这样做的一个原因可能是每组以不同的频率捕获不同的性能统计数据。\n\
  \n“网络”选项卡显示了正在移动多少数据。如果你认为性能受到 I/O 的限制，此屏幕将提供见解。图 17.3 显示了布局。\n\n![image](img/F000170f17-03-9780123985453.jpg)\n\
  \n图 17.3 任务管理器\n\n#### 17.2.1.2 Perfmon\n\nPerfmon 或性能监视器是作为 Windows 部分的一部分更高级的性能测量工具。本节仅对该工具进行简要介绍。关于它的更完整信息，你可以进行互联网搜索或点击\
  \ `帮助 | 主题`。我发现 Perfmon 的一些重要功能包括：\n\n- 你可以从广泛类别中选择想要显示的统计数据。\n- 统计数据可以导出到日志文件或数据库。你可以在以后日期或时间打开\
  \ Perfmon 并查看来自这些源的统计数据。\n- 你可以控制测量频率。请注意，如果测量频率过高，Perfmon 可能会影响服务器性能。\n- Perfmon\
  \ 可以 设置为连续运行，也可以定期将数据写入新文件。\n\n一组正在捕捉的测量包含在一个名为 `Counter Log`的对象中。\n\n这里描述了两种启动\
  \ Perfmon 的方法：\n\n- 在命令行窗口中，输入命令 `perfmon` 并按回车键。\n- 选择 `开始 | 管理工具 | 性能`\n\n打开 Perfmon\
  \ 时看到的初始屏幕显示的是实时统计数据，而不是来自日志文件的统计数据。右下面板显示的活动是正在监控的内容。默认监控的三个活动是：\n\n- `Pages/sec`：衡量正在使用多少内存\n\
  - `Average Disk Queue Length`：衡量磁盘活动量\n- `% Processor Time`：衡量 CPU 多么忙\n\n\n\n\n\
  *   实心红色垂直条从左向右移动。当它到达屏幕右边缘时，它会从左侧重新出现。最新的统计数据将写入垂直条的左侧。\n*   每个统计数据都分配有一种唯一的颜色。可以通过右键点击图表面板并选择\
  \ `Properties` 来重新分配统计数据的颜色。然后点击某个统计数据，并在下拉框中选择新颜色来更改颜色。\n*   点击灯泡菜单图标会将当前选中统计数据的图表以白色突出显示。在图中，`Page/sec`\
  \ 状态将显示为白色而不是蓝色。使用上下方向键可以切换当前具有焦点的统计数据。\n\n![image](img/F000170f17-04-9780123985453.jpg)\n\
  \n图 17.4 Perfmon 的初始屏幕。\n\n要更改正在监控的统计数据，请右键点击窗口并选择“Properties”。图 17.5 是属性屏幕的截图。要删除现有的统计数据，选择它并点击\
  \ `Remove` 按钮。\n\n![image](img/F000170f17-05-9780123985453.jpg)\n\n图 17.5 添加或删除统计数据。\n\
  \nPerfmon 中一些更有用的计数器列在下所示。\n\n| Processor\\% Processor Time | 显示 CPU 的忙程度 |\n| :---\
  \ | :--- |\n| Processor\\Interrupts/Sec | CPU 每秒被中断的次数，例如由磁盘控制器或网卡引起。如果此值持续超过 1000，可能一个或多个设备存在问题\
  \ |\n| System\\Processor Queue Length | 队列中并等待 CPU 时间的线程数。如果此值除以 CPU 的数量小于 10，则系统可能运行良好\
  \ |\n| Memory\\Pages Input/Sec | 如果此计数器持续大于 0，则表明 RAM 不足 |\n| Memory\\Available\
  \ Mbytes | 显示供新进程或现有进程可用的内存量 |\n| Physical Disk\\Bytes/Sec | 每秒传输到/从磁盘的字节数 |\n|\
  \ Physical Disk\\% Disk Time | 表示磁盘驱动器的忙程度。如果此值持续接近 100%，则磁盘驱动器可能是瓶颈 |\n| Physical\
  \ Disk\\Current Disk Queue Length | 如果此值过高，则说明磁盘驱动器被过度使用。此计数通常不应高于 2 或 3 |\n| Processor\\\
  % User Time | 运行应用程序代码的时间百分比。通常，此值越高越好 |\n| Network Interface\\Bytes Total/Sec |\
  \ 发送到网络或从网络接收的字节数 |\n| Network Interface\\Output Queue Length | 显示通过网卡队列等待发送到网络的数据包数。如果此值持续大于\
  \ 2，则你可能存在网络瓶颈 |\n\n在监控列表中添加新的统计数据相对简单。Perfmon 提供的选择非常多，以至于很难识别出你想要哪一个。图 17.6 是后续步骤所涉及屏幕的截图。添加统计数据的步骤如下：\n\
  \n1. 点击 `Add` 按钮。\n2. 从 `Performance` 对象下拉框中选择一个值。\n3. 在标记为“Select counters from\
  \ list”的列表框中选择一个或多个计数器。\n4. 在标记为“Select instances from list”的列表框中选择一个或多个实例。\n5.\
  \ 点击 `Add` 按钮。\n6. 对下一个想要捕获的统计数据重复步骤 1-5。\n7. 点击 `Close` 按钮。\n8. 点击 `OK` 按钮。\n\n\
  ![image](img/F000170f17-06-9780123985453.jpg)\n\n图 17.6 添加一个要监控的统计数据。\n\n设置 Perfmon\
  \ 以捕获统计数据将其写入日志文件或数据库是非常实用的。例如，你可以让服务器持续捕获统计数据，并在每天午夜创建一个新的日志文件。然后在第二天，你可以检查捕获的统计数据以查看是否发生了异常。要显示在日志文件或数据库中捕获的统计数据，右键点击\
  \ Perfmon 主屏幕区域，选择 `Properties` 并点击 `Source` 选项页。图 17.7 显示了选择统计数据来源的屏幕。\n\n![image](img/F000170f17-07-9780123985453.jpg)\n\
  \n图 17.7 选择日志文件作为 Perfmon 统计数据的来源。\n\n要显示来自日志文件的统计数据，请遵循以下步骤：\n\n1. 点击“Log Files”单选按钮。\n\
  2. 点击 `Add` 按钮。\n3. 选择包含所需数据的日志文件。\n4. 点击 `Open` 按钮。\n5. 点击 `Time Range` 按钮。\n6.\
  \ 点击 `Apply` 按钮。\n\n图 17.8 显示了昨天捕获并写入日志文件的统计数据。所显示的统计数据分为三类：\n\n* 第一个测量值是总 CPU 处理时间\n\
  * 下一个测量值是 CPU 时间的百分比\n* 最后一个测量值显示磁盘的忙程度\n\n![image](img/F000170f17-08-9780123985453.jpg)\n\
  \n图 17.8 显示在日志文件中捕获的统计数据。\n\n\n\n\n数据库调优可能和应用程序调优一样复杂。优化数据库性能的一些明显候选对象包括：\n\n- 数据库表是否具有适当的索引？数据库查询可以读取数据库表中的每一行来查找它需要的值，也可以使用索引来加速搜索。例如，假设应用程序允许你搜索所有金额在\
  \ $1000 元或以上的订单。如果 `Orders` 表在 `Order_Value` 列上建立了索引，那么按订单值进行搜索可以执行得非常快。如果不存在此类索引，查询将导致全表扫描，速度会慢得多。在设计应用程序和数据库时，分析师应该已经识别出哪些列需要索引，并恰当地构建了数据库。\n\
  \n- 数据库的使用统计信息最近是否更新过？数据库引擎使用表统计信息来决定使用哪一个或多个索引可以加速查询。如果统计信息已过期，查询将无法达到最优状态。与数据库管理员\
  \ (`DBA`) 协作，确定你的数据库统计信息是否是最新的。\n\n- 数据库引擎在服务器上是否有足够的内存？如果没有，那么完成查询将需要更长时间。应用程序或数据库供应商应该就如何为数据库引擎分配多少内存提供建议。与\
  \ `DBA` 或 `系统管理员` 协作，确保至少分配了其推荐的最小量。\n\n- 企业级数据库引擎并非单一的软件实体。它们有多个共同支持数据库的组件。在某些情况下，通过启动组件的多个实例可以提高性能。例如，通过启动多个“Oracle\
  \ Listener”的副本，可以使你的 `Oracle` 数据库响应更快。你的 `DBA` 或供应商技术人员能够判断这会提高你应用程序的性能。\n\n`Oracle`\
  \ 或 `SQL Server` 等企业级数据库允许 `DBA` 监控正在执行的 `SQL`（结构化查询语言）查询。你可以与 `DBA` 协作，识别应用程序向数据库提交了哪些查询。从查询列表中可以获取到两项非常有价值的信息：\n\
  \n1. 哪些查询执行频率最快？\n2. 哪些查询执行时消耗的时间精力最多？\n\n如果你能识别出执行频率最高且在 CPU 时间和磁盘 I/O 方面成本较高的查询，那么你的\
  \ `DBA` 可能就可以对它们进行优化。例如，如果一个查询包含多个位于同一磁盘驱动器上的表，你可能可以将其中一个或多个表移动到另一个驱动器。通过这种方式最小化磁头竞争可以提高性能。\n\
  \n## 17.2.4 网络活动\n\n对于大多数 `应用程序管理员` 来说，网络有点神秘。有时它运行良好，而有时它又会出现问题。一本关于应用程序管理的书籍不能教你成为\
  \ `网络管理员`，但它可以为你提供一些识别网络问题的基本工具。一旦你识别出特定的网络问题，就可以联系你组织的网络组来协助解决它。\n\n我的第一条建议是，除非你有可靠的证据，否则不要将性能问题归咎于网络。`网络管理员`和`应用程序管理员`\
  \ 一样忙碌，不喜欢对于他们领域引起问题的无理指控。如果你怀疑网络是问题所在但没有证明，那么至少要用不那么指责性的方式表达请求，以避免从一开始就疏远他们。\n\n\
  以下是一些可能帮助你确定网络是否存在存在问题的基本网络命令或工具。\n\n### 17.2.4.1 ping\n\n`ping` 是一个向另一台计算机发送消息的命令。`ping`\
  \ 命令的格式为 `ping target_computer`，其中目标可以是计算机名或 IP 地址。`ping` 显示的输出告诉你消息是否能够到达目标计算机以及花费多长时间。\n\
  \n### 17.2.4.2 traceroute\n\n`UNIX/Linux` 的 `traceroute` 命令（Windows 计算机上的 `tracert`）识别数据包在你的计算机和命令指定的目标计算机之间所走的路径。按照原则，你对数据包如何从点\
  \ A 到点 B 几乎没有控制权。`traceroute` 比 `ping` 命令多的功能列出了两台计算机之间路径上的每一个跳数。这可以帮助你识别通信是否在错误的方向上经过了太多跳，或者某些节点是否失效。图\
  \ 17.11 显示了 `traceroute` 命令的输出。\n\n![image](img/F000170f17-11-9780123985453.jpg)\n\
  \n图 17.11 `traceroute` 命令的输出。\n\n与许多故障排除和调优操作一样，在网络正常运行时使用 `traceroute` 命令是一个好习惯。这将让你对正常情况下路由、跳数和总时间有一个良好的了解。这将为你提供一个比较的基础，这样当情况运行不正常时，你就能识别出差异。\n\
  \n## 17.3 潜在瓶颈\n\n你的应用程序环境中不太可能存在一个可以让你指出来并调整以解决所有问题的地方。调优应用程序通常需要你在许多不同的地方进行调整（通常是微小调整），直到性能提高到你期望的水平。困难之处在于知道这些地方在哪里，以及确切知道如何调整它们。可能需要调查并可能进行调优的潜在位置包括：\n\
  \n- 应用程序服务器\n- 应用程序\n- 如 `IIS`、杀病毒产品和备份软件\n- 服务器上的调度活动\n- 数据库\n- 应用程序调用的服务\n- 网络\n\
  - 用户工作站\n- 用户浏览器软件\n\n### 17.3.1 应用程序服务器\n\n运行应用程序的服务器应该是你调优应用程序时检查列表上的首位。你的初始检查应该是确认它是否拥有供应商建议的所有硬件和软件资源。例如，服务器是否具有安装指南中推荐的至少：\n\
  \n- 处理器速度——处理器的速度以赫兹或每秒周期计算。典型的服务器处理器速度可能在 2-5 GHz 范围内。你可以在命令行窗口中输入 `systeminfo`\
  \ 查看你的 Windows 处理器的速度。\n\n- 处理器——如果供应商建议你的服务器配备多个处理器，那么你可以肯定他们这样做很有理由。处理器的数量也列在\
  \ `systeminfo` 输出中。\n\n- 内存——足够的内存的重要性不言而喻。确保可用至少至少供应商推荐的最小量。内存的价格足够低，增加额外内存并不贵且无害。你服务器的内存列在\
  \ `systeminfo` 命令中。\n\n- 磁盘空间——磁盘空间的价格也相对便宜，所以确保你的空间比供应商推荐的更多。可以通过右键点击开始按钮并选择“打开资源管理器”来查看你有多少可用空间。然后右键点击磁盘并选择“属性”。\n\
  \n- 网络带宽——如果你的网络没有足够的带宽，你的应用程序运行可能会比你希望的要慢。寻找网络速度需要几个步骤。咨询你组织的 `网络管理员` 获取建议。\n\n\
  \n\n\n- 操作系统——如果供应商推荐了特定的版本或大小，例如 `32-bit` 或 `64-bit` 操作系统，请确保服务器上运行的正是该版本。\n- 供应商是否支持将其软件运行在虚拟服务器上？虽然虚拟服务器有很多优点，但如果供应商尚未批准，那么你就不应该在虚拟机上运行该应用程序。遵循供应商建议的一个极佳理由是，如果你忽视了在这方面的要求，他们可能会选择不再提供支持。\n\
  \n## 17.3.2 应用程序\n\n在您提升性能的道路上，第二步应该是应用程序本身。许多应用程序都有许多设置、配置文件或其他调整应用程序执行方式的方法。如果你想靠自己找出最佳设置，这可能是非常困难的甚至是不可能的。你需要联系供应商的支持部门，向他们索取他们拥有的任何关于调优或性能优化的文档。我曾支持的一家供应商拥有一份名为“在\
  \ Windows Server 上配置安全与性能”的文档。\n\n根据他们的建议，你需要确保你的环境设置正确。仔细阅读文档，并记录下你所做的任何更改。你还应该一次只更改一个设置，以便观察其产生的影响。希望他们的文档能提供关于如何优化应用程序性能的具体细节。\n\
  \n## 17.3.3 支持软件\n\n如前所述，你所支持的应用程序并不是服务器上运行的唯一软件。如果你对服务器和应用程序的检查没有解决你的性能问题，那么下一步就是开始查看同样运行在服务器上的支持软件。其中的任何一个程序都可能影响你应用程序的性能。例如，其中某个程序可能会消耗过量的\
  \ `CPU` 时间、内存或 `disk I/O` 操作。\n\n首要考虑因素之一是确保运行在服务器上的所有支持软件都是最新版本。新版本的软件通常比旧版本运行得更快或更高效。新版本的设计目的通常是为了更安全，并解决已知的问题。这些规则也有例外，但在大多数情况下，越新越好。\n\
  \n关闭或移除服务器上运行的但应用程序并非特定需要的软件。这样做有多个益处。它可以释放内存、`CPU` 周期和磁盘空间等资源。移除未使用的软件还有助于减少黑客可能用来入侵你服务器的攻击面。服务器上可能存在可以移除的软件示例包括：\n\
  \n- 像 `NetBIOS`、`NFS` 和 `FTP` 这样的文件和打印机共享服务\n- 无线网络服务\n- 远程控制和远程访问程序，如 `telnet`\n\
  - 像 `SMTP` 这样的电子邮件服务\n- 语言编译器和库\n- 像 `Visual Studio` 和 `Eclipse` 等系统开发工具\n\n###\
  \ 17.3.3.1 IIS\n\n如果你的应用程序是基于 Web 的，那么服务器上很有可能运行着 `IIS`（互联网信息服务）。如果你的应用程序依赖于 `IIS`，那么上面的某些设置可能会让你的应用程序运行得更快。在采取以下任何建议之前，你应该向供应商的支持小组确认，以确保这样做不会引起问题。在生产环境中执行这些更改之前，先在开发、测试或\
  \ `QA` 环境中测试这些更改也是一个极佳的主意。\n\n以下是一些可能帮助提高应用程序性能的 `IIS` 调整：\n\n- 存在一个设置可以决定是否应对对\
  \ `HTTP` 文件进行压缩。压缩 `HTML` 数据可以将服务器与用户浏览器之间传输的数据量减少 5 倍或更多。\n- 可以增加与 `ASP` 相关的缓存限制。可以增加缓存的\
  \ `ASP` 文件数量和缓存的脚本引擎数量。\n- 可以调整 `IIS` 的日志记录，使其更适合你的环境。减少日志记录量可以减少 `disk I/O` 活动以及消耗的磁盘空间。\n\
  - `IIS` 会终止在配置时间内未激活的会话。你有能力设置这段时间。此设置从用户便利性和安全角度来看都非常敏感。如果会话超时值太低，用户的应用程序会话将被不方便地提前终止。如果太高，则可能会让会话开放过久，以至于用户离开电脑时其他人可以访问。\n\
  - `IIS` 使用 `Application Pools`（应用程序池），这些 Windows 操作系统进程。用户会话状态信息存储在“应用程序池”中。应用程序池有许多设置可以影响应用程序的性能。例如，工作进程回收的频率，以及工作进程在关闭之前需要空闲多长时间。\n\
  \n### 17.3.3.2 杀毒软件\n\n如果你的服务器上运行着杀毒软件，那么 `AV` 软件完全可能影响服务器的性能。要知这是否属，你应该确切知道它在做什么。如果你无法回答以下问题，就应该进行研究，以便更充分地理解\
  \ `AV` 软件可能是服务器上任何性能问题的根源。\n\n- 它是基于签名的检测、启发式检测还是两者都用于识别病毒？\n- 它在服务器上运行的进程名称是什么？\n\
  - 这些进程是在内核级别运行的吗？\n- 它会产生多少误报？\n- 每个进程通常消耗多少百分比的 `CPU` 时间？\n- 它会检查每一个吗？\n- 它会检查每一个打开的文件吗？\n\
  - 它会自动下载新签名吗？\n- 它多久下载一次？\n- 下载在一天中什么时候进行？\n- 每次下载多少数据？\n- 它是否会对服务器进行定期扫描？\n\n###\
  \ 17.3.3.3 分发软件\n\n你的组织是否有软件向服务器和工作站推送更新？这些工具允许系统管理员向多个服务器和用户计算机分发更改。此类软件包的示例：\n\
  \n- `Altiris`\n- `LANDesk`\n- `SCCM`\n- `System Center`\n\n如果你的服务器上存在此类软件包，它会对服务器性能产生影响。你需要知道以下问题的答案：\n\
  \n- 软件包在你的服务器上是否有代理程序或进程？\n- 向你的服务器推送了什么内容？操作系统更改？支持软件更改？\n- 多久推送一次更改？\n- 你可以阻止更新推送吗？\n\
  - 安装后，可以回滚更新吗？\n- 在分发这些更改之前，是否在组织内的另一台服务器上进行了测试？\n- 更改在一天中什么时候推送？\n- 如果更新需要重启服务器才能生效，会发生什么？\n\
  - 你的服务器需要分发软件吗？还是可以移除？\n\n### 17.3.3.4 备份软件\n\n每台服务器都需要定期对其内容进行备份。这对于开发服务器、测试服务器、`QA`\
  \ 服务器以及最重要的生产服务器都是如此。你的组织对于使用什么软件备份具有选择权。你的组织可能开发了自己的备份流程和软件，或者可能安装了一个软件包来处理这一重要的过程。无论如何，备份过程都会往返大量数据，因此可能会导致服务器性能问题。\n\
  \n你需要知道以下备份相关问题的答案：\n\n\n\n\n\n- 服务器上运行着哪些与备份相关的进程？\n- 它们在哪些天运行？\n- 它们在什么时候运行？\n\
  - 它们通常在什么时候完成？\n- 如果备份没有完成（或者未在正常时间内完成），会发生什么？\n- 备份进程运行时，必须停止应用程序吗？\n- 如果不需要停止应用程序，用户在备份运行时会看到性能下降吗？\n\
  - 备份是如何调度和启动的？\n- 正在备份哪些驱动器、目录和文件？\n- 哪些驱动器、目录或文件被排除在备份之外？\n- 是每天都进行全备，还是将全备与增量备份结合？\n\
  \ 如果 如果另一个进程已打开某个文件，备份软件可以复制该文件吗？\n- 是否可以在月度、季度或年的关键时期暂停或避免定期计划的备份，以确保耗时比常长的进程能够完成？\n\
  \n### 17.3.4 调度活动\n\n如果您的应用程序有定期运行的活动，它们可能会影响应用程序性能。此类活动的示例包括备份、计算、报告、数据仓库活动和数据提取。应用程序管理员是否有能力和权限调度作业运行的时间？如果是，你应该努力在大多数用户未使用系统时运行它们。如果完全无法做到，你是否可以尝试错开这些任务，以确保它们不同时运行？\n\
  \n### 17.3.5 数据库\n\n如果应用程序调用数据库包来提取数据，那么这就是一个需要检查的领域。坦率地说，你可能在这里找不到太大的改进空间。\n\n\
  一个合格的供应商已经考虑过这些问题。这值得追求，因为如果数据库设置不当，调优可以带来巨大的差异，但从现实来说，这不太可能是你的问题的根源。\n\n可以用来改进数据库性能的领域包括：\n\
  \n- 应用程序传递给数据库的查询可以被优化吗？\n- 是否可以在表中添加索引以加快查询速度？\n- 是否可以更频繁地刷新数据库引擎使用的统计信息以优化查询执行？\n\
  - 是否为数据库服务器添加额外的内存或磁盘驱动器以增强性能？\n- 是否可以创建额外的进程（如监听器或写入器）来提高性能？\n\n### 17.3.6 网络\n\
  \n将所有性能问题都归咎于“网络”是非常容易的。不要掉进这个陷阱。除非你能证明网络导致了问题，否则将其归咎于网络是没有意义的。可以检查的某些领域包括：\n\n\
  - 服务器上的 `NIC`（网卡）运行正常吗？\n- `NIC` 是否过时？\n- `NIC` 是否安装了最新的软件驱动程序？\n- 使用的是什么 `DNS`（域名系统）服务器？\n\
  - 是否定义了备份 `DNS` 服务器？\n\n### 17.3.7 用户工作站\n\n你对它们没有太大控制权，但用户工作站会对性能产生影响。如果用户的计算机内存不足或运行进程过多，它就会变慢。作为管理员，你无法控制它们，但你可以提出建议：\n\
  \n- 为工作站添加更多内存。\n- 关闭不必要的程序。\n- 定期重启电脑。\n- 清除浏览器缓存。\n- 检查磁盘错误。\n\n### 17.3.8 浏览器\n\
  \n如果您的应用程序是基于 Web 的，用户将通过 `InternetExplorer`、`Chrome` 或 `Firefox` 等浏览器浏览器访问。这些浏览器都使用缓存来存储从\
  \ Web 服务器检索的页面或数据。如果再次请求，从缓存中检索的速度会比从 Web 服务器检索快得多。\n\n在 `InternetExplorer` 中清除缓存：\n\
  1. 点击 `Tools` 菜单项。\n2. 选择 `Options`。\n3. 转到 `Advanced` 标签页。\n4. 在 `Network` 区域，点击\
  \ `Clear` 按钮。\n\n在 `Firefox` 中清除缓存：\n1. 点击 `Tools` 菜单项。\n2. 选择 `Options`。\n3. 转到\
  \ `Privacy & Security` 标签页。\n4. 在 `History` ，点击 `Clear History...`。\n\n### 17.3.9\
  \ 缓存\n\n“缓存”一词在计算机世界中有多种含义。通常，该概念指的是将数据或代码存储在可以快速访问的区域。你在处理应用程序时可能会遇到的缓存变体包括：\n\n\
  - 服务器的 `CPU` 使用缓存内存存储最近使用且可能在不久后再次使用的指令或数据。缓存可以让较慢的 `CPU` 性能优于几乎或没有缓存的快速 `CPU`。\n\
  - 应用程序可能使用内存来存储从数据库或文件系统请求的数据。后续使用该数据将从缓存而非数据库中提取。\n- 应用程序可以使用缓存来存储安全凭据信息。我支持的一个应用程序有一个报告组件，它使用缓存来存储计划报告的账户\
  \ `ID` 和密码。如果用户更改了密码，报告可能无法运行，因为缓存中包含旧密码。为了确保此问题不会阻止报告运行，我们必须定期“清除缓存”。\n- 如果您的应用程序是基于\
  \ Web 的，那么 Web 服务器（例如 `IIS`）几乎肯定使用缓存来保留频繁请求的 页面。通过将它们存储在缓存中，软件避免了在后续请求中从磁盘读取它们。\n\
  - 如果您的应用程序使用如 `Oracle` 或 `SQL Server` 等关系型数据库引擎，那么数据库引擎使用缓存来减少磁盘 I/O 并提高整体性能。\n\n\
  #### 17.3.9.1 缓存问题\n\n\n\n\n\n当使用合理时，缓存对应用栈所有层级的性能都会产生重大影响。为了确定是否可以通过缓存提高性能，你需要对以下几个问题有所了解：\n\
  \n- 你能否确定环境中的每一层有多少可用缓存？例如，应用程序可以使用多少缓存？`IIS` 可以使用多少缓存？你可能无法获取到这些信息的唯一层是数据库服务器。你完全可以向数据库管理员（DBA）索要，但你对更改数据库服务器上的缓存使用不会产生太大影响。\n\
  - 你是否可以分配额外的缓存？是否有设置可以决定应用程序使用的缓存大小？你知道它在哪里吗？你是否知道为 Web 服务器应用程序分配额外的缓存？\n- 分配更多缓存会提高性能吗？供应商的文档对于最佳缓存大小是如何说明的？你目前的设置与供应商的建议相比如何？\n\
  - 如果你打算通过调整缓存大小来提高性能，你应该执行以下操作：\n    - 增量地更改缓存大小\n    - 在每次更改缓存后测试性能，以记录其影响。如果没有改进，你可能考虑将其恢复到原始设置。\n\
  \n### 17.3.9.2 刷新缓存\n\n你需要熟悉的另一个与缓存相关的概念是“刷新缓存（flushing the cache）”。这个概念意味着清除缓存，以便将新数据加载到其中。例如，应用程序的某些更改在缓存刷新之前可能不会变得明显。你需要知道是否可以刷新你的应用程序缓存以及如何操作。这个过程可能简单到只需删除一个临时子目录，但每个应用程序的情况可能不同，因此请从供应商处获取具体的指令。\n\
  \n## 17.4 维护任务可以帮助性能\n\n某些维护任务如果定期执行，可以帮助提高应用程序的性能。实际上，更准确的说是，定期执行这些任务可以帮助避免应用程序性能的下降。这些任务的示例包括：\n\
  \n- 如果数据库引擎不会自动刷新数据库表统计信息，则应该定期执行此操作。DBA 可以编写并调度脚本，在最合适的间隔（例如，每天或每周）运行。\n- 可用空间极小的磁盘驱动器可能会导致性能问题，因此你应该定期检查它们并在必要时释放空间。如果你的组织已经部署了监控软件，请让它检查磁盘可用空间。\n\
  - 过量的日志文件可能会影响性能。如果在不影响应用程序的情况下删除旧日志文件，则应该定期删除它们。\n- 定期关闭并重启应用程序可以恢复由于应用程序内存泄漏问题而丢失的内存。\n\
  - 运行在服务器上的恶意软件会占用磁盘空间并消耗 CPU 周期。从安全和性能的角度来看，定期运行检测软件以发现病毒、广告软件和特洛马是有益的。\n\n## 17.5\
  \ 改变格局\n\n如果较先的一些建议未能帮助将你的应用程序性能调优到理想水平，那么可能是时候采取更激进的措施了。改变硬件或软件格局可能是下一个逻辑进展。在采取任何此类激进步骤之前，你需要与应用程序的业务所有者协调更改。在修改生产环境之前，你还应该在开发、测试或\
  \ QA 系统上测试这些更改。\n\n### 17.5.1 添加或更换硬件\n\n如果你已经监控了应用程序环境并识别出某项硬件资源是瓶颈，那么增加该资源可能会解决你的问题。将现有设备更换为更快的版本也可能解决问题。\n\
  \n你能预先预测增加硬件会提高性能吗？遗憾的是，并不总是能够预知你的硬件投资会对性能产生重大影响。\n\n接下来的章节描述了一些可以考虑的潜在资源。这些建议适用于物理服务器。如果你的服务器是虚拟的，添加资源要简单得多。请联系你组织中管理虚拟服务器的小组来增强你的虚拟服务器配置。\n\
  \n#### 17.5.1.1 内存\n\n增加内存是可以实现的较简单的硬件更改之一。它还可以以较低的价格产生显著的性能提升。如果你选择这条路线，你需要记住几点。例如：\n\
  \n- 确保服务器确实可以使用额外的内存。增加应用程序或操作系统无法使用的内存是浪费时间和金钱。\n- 混合使用新旧内存芯片可能是不可行的。你可能需要将所有现有内存更换为新的\
  \ `RAM` 芯片。这将导致高于预期的成本。\n- 以最有帮助的方式分配内存。这可能意味着，例如，增加应用程序的缓存大小。\n\n#### 17.5.1.2\
  \ 处理器\n\n如果监控活动已确定 `CPU` 是性能瓶颈，那么你可以考虑添加处理器来增强性能。遗憾的是，添加处理器并不像增加内存那样简单。服务器的主板可能没有用于额外处理器芯片的插槽。在认真考虑此操作之前，你可能需要联系组织中的系统管理员或提供服务器的供应商。\n\
  \n添加更多处理器的另一种方法是利用集群或负载均衡。这些更改将在本章后的章节中描述。\n\n#### 17.5.1.3 磁盘驱动器\n\n磁盘驱动器影响应用程序性能的两种方式如下：\n\
  \n- 磁盘驱动器可用空间不足的计算机会产生错误、创建日志记录，并且通常比有足够的可用空间时慢。解决此问题的两种方案是释放现有驱动器的空间或增加更多空间。第二种方案在下文中描述。\n\
  - 磁盘活动很容易降低应用程序的性能。磁盘驱动器作为机械设备，比像 `CPU` 或内存等所有电子设备慢得多。如果你的应用程序产生大量的磁盘 I/O，那么它极可能减慢应用程序。解决此性能问题的潜在方案在以下章节描述。\n\
  \n##### 17.5.1.3.1 添加驱动器\n\n向服务器中添加一个或多个驱动器相对简单且廉。。这种更改具有解决上一节所述的两个问题的潜力。显而易见，添加另一个驱动器将立即创建大量的可用空间。不那么明显的是这样做可能会解决性能问题。在尝试之前，请确保应用程序能够识别多个驱动器。\n\
  \n##### 17.5.1.3.2 用更大的驱动器替换现有驱动器\n\n将现有驱动器更换为更大的驱动器比添加额外的驱动器更困难。要实现这一点，你必须将文件从现有驱动器传输到新驱动器。如果服务器没有空插槽或电源无法处理额外的设备，这可能是你唯一的选择。\n\
  \n\n\n\n增加更大的硬盘驱动器的一个好处是，它的速度可能会比原始驱动器快。如果是这样，那么通过更换驱动器，你将获得额外的空间并可能同时提高磁盘性能。\n\n\
  ### 17.5.1.3.3 RAID\n\nRAID（独立设备冗余阵列）使用软件将多个驱动器组合在一起，使其显示为单一设备。RAID 有多个级别，侧重于提高性能、增强冗余或两者兼顾。\n\
  \n为你的应用程序实现 RAID 阵列并非没有缺点。实现 RAID 阵列的一些缺点包括：\n\n- 它是另一层需要管理的复杂性。如果你或你的组织没有 RAID\
  \ 阵列的经验，这就是需要获取的额外专业领域。\n- 它不是免费的。额外的驱动器以及管理 RAID 子系统的软件是有成本的。确保对于你的安装来说，收益大于成本。\n\
  \n### 17.5.1.3.4 固态硬盘\n\n固态硬盘，或 `SSD`，本质上是用于用作硬盘存储的内存。从应用程序的角度来看，`SSD` 的外观和行为与硬盘完全一样，尽管通常容量相对较小。\n\
  \n固态硬盘有明显的优缺点。由于没有机械零件，它们的运行比硬盘快得多。缺点是它们的每 GB 价格贵得多，而且容量没有典型硬盘那么大。\n\n如果你的应用程序严重依赖于较少的数据或文件，那么利用\
  \ `SSD` 可能是有效的。为了确保你没有浪费时间和金钱，在做出财务承诺之前，你应该与供应商讨论此事。\n\n### 17.5.1.4 NIC\n\n如果你的网络性能显著变慢，问题可能出在你的\
  \ `NIC`（网卡）上。你可以检查的 `NIC` 的一些潜在方面包括：\n\n- 如果 `NIC` 较旧，它可能已经严重过时。升级到速度更高的新卡可以显著提高网络和应用程序的性能。\n\
  - 你的 `NIC` 是否拥有所有的最新驱动更新？安装此关键软件的最新版本可以改进错误处理和整体性能。\n- `NIC` 上有一些功能是可以修改的。例如，禁用卸载功能（例如“大发送卸载”，Large\
  \ Send Offload）在某些情况下可以改善性能问题。\n\n对像 `NIC` 这样的硬件设备进行更改可能超出大多数应用程序管理员的经验和范围。如果你的组织有数据中心小组，你应该联系他们，并讨论你对网络性能的担忧以及检查\
  \ `NIC` 的可能性。\n\n### 17.5.2 负载均衡\n\n负载均衡是将用户产生的应用程序活动分布到多个服务器上的方法。它被用于提高性能并提高应用程序的可用性。负载均衡可以通过硬件、软件或两种方法的结合来实现。它也可以通过应用程序内部或通过第三方包处理。一些供应商及其负载均衡工具包括：\n\
  \n- Barracuda 的 Load Balancer\n- F5 Networks Big-IP\n- Cisco ACE Application Control\
  \ Engine Module\n- KEMP LoadMaster\n\n### 17.5.3 聚类\n\n聚类与负载均衡一样，用于提高性能并确保应用程序的高可用性。聚类通常通过纯软件技术实现。提供集群能力的应用程序服务器软件有：\n\
  \n- Oracle/BEA WebLogic\n- IBM WebSphere\n- Oracle Application Server\n\n负载均衡和聚类都需要产生额外成本。其中一些成本包括：\n\
  \n- 硬件——额外的服务器、负载均衡设备或两者兼有\n- 软件许可证\n- 需要维护的额外硬件或软件层\n- 你的组织在 IT 员工或承包商中所需的专业知识\n\
  \n### 17.5.4 升级应用程序\n\n如果你遇到了任何上述建议都未能解决的性能问题，请向应用程序软件供应商提交工单，要求他们与你合作解决该问题。他们肯定处理过许多客户的性能问题。如果他们提供了一份检查列表或需要执行的更改，那么你应该强烈考虑与他们合作。\n\
  \n你的供应商可能会建议将应用程序升级到最新版本以提高性能。这是一个合理的建议，但在被说服这样做之前，你需要确保它有合理的概率解决问题。帮助你决定的一种方法是确定性能问题是否在所有运行相同版本应用程序的平台上都发生。例如，假设你的\
  \ `Production` 和 `QA` 平台运行相同版本的应用程序。如果其中一个运行得比另一个慢，那么应用程序软件可能不是原因。如果是版本问题的罪祸首，那么两个环境都将具有相似的性能水平。如果一个快而另一个慢，那么问题可能是应用程序软件版本之外的。\n\
  \n如果你决定升级应用程序，你应该在修改你的 `Production` 环境之前，在开发、测试或 `QA` 服务器上对新版本进行测试。正如我之前提到的，在没有先在另一个平台上测试过更改之前，永远不要修改\
  \ `Production` 环境。\n\n# 第 18 章\n\n# 网络\n\n## 摘要\n\n应用程序依赖网络与其他服务器和用户通信。如果网络出现问题，应用程序将无法优优运行。应用程序管理员需要知道网络上有哪些设备，以及他们的应用程序正在与谁通信。\n\
  \n### 关键词\n\n网络；表示层；网络管理员；LAN；WAN；MAC 地址；IP 地址；静态 IP；动态 IP；域名；域控制器；DNS；防火墙；DMZ；子网\n\
  \n作为一名应用程序管理员，你必须对网络有基本的了解。当你设置应用程序、调优它以及排除发生的任何问题时，都需要这些知识。虽然你不需要成为网络专家，但你需要了解足够的网络知识，以便与组织中的网络管理员以及供应商的支持团队合作。\n\
  \n每个企业级应用程序在很大程度上都依赖网络。如果应用程序的表示层（即用于向用户展示数据的软件）是基于 Web 的，那么主要的通信路由将是用户工作站与应用程序或\
  \ Web 服务器之间的网络。如果数据库在单独的服务器上，那么应用程序服务器与数据库服务器之间网络上也会大量的传输。\n\n如果表示层在用户工作站上（即客户端-服务器应用程序），那么通信将在工作站（客户端）和数据库服务器（服务器）之间通过网络进行。请参考第\
  \ 3 章（节 3.3](#CHP003.html_S0020）复习许多应用程序通用的三层架构。\n\n唯一没有网络依赖的应用程序类型是完全存在于单个计算机上的应用程序。符合这种设计的应用程序范围会非常有限。它可能只是位于用户的工作站上，并仅供单个用户使用。这种受限的应用程序最可能不需要应用程序管理员的服务。\n\
  \n## 18.1 LAN、WAN 以及其他“AN”\n\n\n\n\n\n有多种类型的网络可以应用于企业级应用中。互联网是所有网络的母体，但在企业环境中，你可能会听到其他类型网络的提到。其中包括：\n\
  \n- `LAN`—局域网（Local Area Network）用于连接距离较短的设备。如果你的组织只占用一层层楼或一栋建筑，那么你的“网络”很可能就是一个\
  \ `LAN`。\n- `WAN`—广域网（Wide Area Network）用于连接跨越较远距离的 `LAN` 集合。如果你的组织在同一个州或国家有多个设施，那么每个站点可能都有一个\
  \ `LAN`，并且所有的 `LAN` 都通过 `WAN` 连接。\n- `MAN`—城域网（Metropolitan Area Network）类似于 `WAN`，但规模较小。如果你的组织设施都位于同一个城市，你可能正在使用\
  \ `MAN` 进行通信。\n- `SAN`—存储区域网络（Storage Area Network）是一种允许服务器访问存储设备（例如磁盘驱动器或 RAID\
  \ 列）的网络。\n\n## 18.2 地址\n\n就像房子或公寓一样，每个计算机设备都有一个地址，以便其他设备与其通信。实际上，网络上的每个设备都有两个地址。这些地址方案将在后续章节中进行描述。\n\
  \n### 18.2.1 MAC 地址\n\n`MAC`（介质访问控制）地址是分配给每个连接到网络的设备的唯一标识符。该标识符在设备制造时被固化在设备的内存中。你最常的具有\
  \ `MAC` 地址的设备是 `NICs`（网络接口卡）。连接到网络的每个设备（例如用户工作站或服务器）都有一个 `NIC`。如果你的服务器有多个 `NICs`，那么其中每一个都有它们自己的\
  \ `MAC` 地址。\n\n`MAC` 地址的格式由六组每组两个十六进制数字组成，并用冒号或连字符分隔。地址的前半部分表示制造商，后半部分是制造商分配给特定设备的序列号。`MAC`\
  \ 地址的示例为 `01:23:45:67:89:ab` 或 `01-23-45-67-89-ab`。\n\n你可以在 Windows 计算机的命令行窗口中输入命令\
  \ `ipconfig /all` 来查看 `NIC` 的 `MAC` 地址。图 18.1 显示了该命令的输出。在此图中，`NIC` 卡的 `MAC` 地址（又物理地址）是\
  \ `F0-4B-A2-B4-DE-D7`。Linux 和 UNIX 对应的命令是 `ifconfig`。\n\n![image](img/F000182f18-01-9780123985453.jpg)\n\
  \n图 18.1 用户工作站的 MAC 地址。\n\n### 18.2.2 IP 地址\n\n与网络设备关联的第二个地址是 `IP`（网际协议）地址。`IP`\
  \ 地址指定设备所在的网络以及在该网络上的位置。设备在加入网络时会被分配一个 IP 地址。\n\n从技术上讲，`IP` 地址是 32 位二进制数（例如 `74.25.227.178`）。为了方便识别，它们通常写成四个\
  \ 8 位组（每个称为一个字节），并用点号分隔，例如 `174.14.253.12`。当前的 `IP` 地址规范被称为 IP 第 4 版本或 `IPv4`。互联网上的设备数量增长得如此快，以至于这种编号方案已不足以为未来的互联网设备提供唯一的\
  \ `IP` 地址。\n\n为了处理所有预计将添加到互联网的未来设备，设计了一种新的扩展地址。新方案 IP 第 6 版本（`IPv6`）具有 128 位，而不是\
  \ 32 位。`IPv6` 地址被写为八组四位十六进制数，用冒号分隔。例如：`2012:0CA7:BD10:ED01:0000:0000:0000:0000`。如果低位数字全为零，则可以省略它们。上面的\
  \ `IPv6` 地址也可以写为 `2012:0CA7:BD10:ED01`。遗憾的是，这两个版本（`IPv4` 和 `IPv6`）是不兼容的，因此向这个新世界的过渡可能是漫长且复杂的。\n\
  \n设备的 `IP` 地址也可以通过 `ipconfig /all` 命令获取。在图 18.1 中，`NIC` 卡的 `IPv4` 地址是 `12.16.8.68`。\n\
  \n网络上的每台计算机都维护一份名为 `ARP`（地址解析协议）表的本地副本，该表映射了网络上每个设备的 `MAC` 地址和 `IP` 地址。它使用这种映射来确保通信指向正确的网络设备。\n\
  \n### 18.2.3 公有 IP 地址与内网 IP 地址\n\n`IP` 地址有两种类型：公有和私有。公有 `IP` 地址是公众可见的，即世界上任何一台计算机都可能尝试与其进行通信。私有\
  \ `IP` 地址只能从你组织的私有网络内部访问。\n\n两种 `IP` 地址存在两个原因。第一个是与安全有关。例如，在互联网上销售商品的公司（如亚马逊）绝对希望它们的\
  \ IP 地址是公开的。他们希望每个人都能登录并购买商品。或者，一个组织可能有一个考勤系统。\n\n如果你正在支持的应用可以从外部世界（即互联网）访问，那么它的\
  \ IP 地址可能是公有的。如果它只能在组织的私有网络内部（例如 `LAN`）使用，那么 IP 地址 可能是私有的。内网地址的第二个原因是为了节省 IPv4 地址，因为它正成为一种稀缺资源。这些组织本地网络中的路由器知道具有私有地址范围的计算机是供内部使用的。这允许许多\
  \ `LAN` 使用相同的 IP 地址而不会产生任何混淆。\n\n### 18.2.4 静态 IP 与动态 IP 地址\n\n分配给设备的 `IP` 地址可以是静态的也可以是动态的。区别在于，一旦分配，静态\
  \ `IP` 地址就不会改变。动态 `IP` 地址在每次建立连接时都可能不同。动态 `IP` 地址通常由名为动态主机配置协议（`DHCP`）的服务器分配给 `LAN`\
  \ 中的设备。\n\n动态分配用于节省 IP 地址，因为它是有限的资源。动态 IP 地址通常分配给用户工作站。如果你的组织有大量用户，可能无法为每个人分配独立的静态\
  \ IP 地址。通过仅对连接到互联网的工作站动态分配 IP 地址，可以使所需的唯一 IP 地址减少到最低。\n\n\n\n\n\n在计算机网络语境中，域（domain）是一组计算机，它们可以使用同一组规则进行访问和管理，并作为一个整体进行管理。域中的所有计算机可以看到域内的所有其他计算机，也可以被它们看到。一台计算机在任何给定时间只能属于一个域。\n\
  \n根据组织的规模和对安全的重视程度，你的组织可能只有一个域或多个域。作为应用程序管理员，你需要了解的关键点是应用程序服务器位于哪个域。此外，了解用户所在的域也是很有用的。跨域访问需要开放防火墙端口，因此如果你的服务器和用户位于不同的域，你可能需要提交开启防火墙端口的请求，以便用户访问应用程序服务器。\n\
  \n在 Windows 计算机上，你可以通过查看“系统属性”界面来确定它所属的域。图 18.2 所示的截图表明此计算机位于 `[network.com](http://network.com)`\
  \ 域。你可以按照以下步骤查找 Windows 计算机所在的域。这些步骤会根据你所使用的 Windows 版本略有不同。\n\n1. 点击“开始”菜单按钮并点击“控制面板”选项\n\
  2. 点击“系统和安全”选项\n3. 选择“系统”选项\n4. 选择“高级系统设置”选项\n5. 点击“计算机名称”选项卡\n\n![image](img/F000182f18-02-9780123985453.jpg)\n\
  \n图 18.2  Windows 计算机所在的域。\n\n### 18.3.1 域控制器\n\n在 Windows 计算机网络中，每台服务器要么是成员，要么是域控制器。域控制器（`DC`）是控制每个成员允许拥的安全访问权限的服务器。一个域将有一个主域控制器和一个多个备份域控制器，当主\
  \ DC 故障时，备份域控制器将接管工作。\n\n域控制器执行的一些安全相关任务包括：\n\n- 它在数据库中存储所有授权访问域内任何服务器的用户详细信息\n\
  - 定期将安全数据库的副本发送到备份域控制器\n- 成员服务器将查询域控制器，以确认用户输入的凭据（即用户名和密码）是否有效\n\n本节旨在向你提供域控制器的简要背景，域控制器仅存在于\
  \ Windows 计算机网络。网络管理员将管理域控制器。你的应用程序服务器不会作为域控制器运行，你也不会被要求维护域控制器。\n\n## 18.4 DNS—域名系统\n\
  \n无论是互联网还是你组织使用的局域网（LAN），计算机网络都包含大量计算机。需要一种方法来跟踪计算机如何联系网络中的另一台计算机。域名系统（`DNS`）是一种命名系统，它允许计算机使用名称而不是\
  \ IP 地址在一个或多个网络中“找到”对方。\n\n例如，假设你的某一个用户想要访问你支持的 Web 端会计应用程序。他打开 浏览器并输入应用程序的 URL（统一资源定位符），例如\
  \ `[www.accounting.acme.com](http://www.accounting.acme.com)`。浏览器获取该地址并将其传递给域名服务器。`DNS`\
  \ 服务器会将用户输入的名称翻译为应用程序 Web 服务器的 IP 地址，例如 `19.0.21.17`。然后浏览器与该服务器上的 Web 服务器软件建立会。如果不存在域名系统，用户将必须为想要访问的每台服务器输入\
  \ IP 地址。这将非常缓慢、不便且容易出错。\n\n作为应用程序管理员，与域名系统配合并不困难。在大多数情况下，你需要与 `DNS` 交互的情况只有：\n\n\
  - 当设置应用程序服务器和正在安装应用程序时，你必须向 DNS 管理员提供每台服务器的名称和 URL 等详细信息\n- 如果应用程序服务器的 IP 地址发生变化（例如，服务器从一个域移动到另一个域），其\
  \ IP 地址将更改。需要将新地址提供给 DNS 管理员，以便其更新 DNS 数据库\n- 如果增加了额外的应用程序服务器来支持应用程序，你必须向 DNS 管理员提供新的服务器名称和\
  \ IP 地址，以便更新 DNS 数据库\n\n如果你的应用程序的 DNS 条目发生了更改，你需要意识到这些更改并不是即时生效的。一种延迟是，DNS 管理员可能只在每天的特定时间对域名服务器进行更改，例如深夜。\n\
  \n发布新 DNS 条目数据的另一个潜在延迟源是，对 `DNS` 的更改不会立即发送到网络上的所有计算机。相反，每个域名服务器都会缓存其条目，并仅在条目过期时（即“超时”时）才进行刷新。DNS\
  \ 服务器的管理员设置刷新时间，称为生存时间（`TTL`）。`TTL` 值可以从几秒到几天不等。在缓存中持有这些数据的原理是它们相对稳定。如果每台计算机在与另一台计算机通信时都向\
  \ DNS 服务器提交请求，DNS 服务器将会被请求淹没。通过在单台计算机的缓存中持有这些数据，减少了此类请求的数量。\n\n## 18.5 防火墙\n\n防火墙的作用是作为外部（即互联网）和局域网之间的屏障来保持网络安全。防火墙通过分析入站和出站网络流量来决定是否允许其通过网络。良好的防火墙能够识别并阻止未受邀访客尝试连接到你的计算机或网络。它还会过滤掉已知攻击源的网站的访问尝试。\n\
  \n如果你的组织对安全特别重视，局域网可能有多个防火墙。最靠近外部世界的称为“前端”防火墙。内部防火墙称为“后端”防火墙。网络中两个防火墙之间的区域称为 DMZ，又非军事化区。如果你的组织确实有两个防火墙，那么它们可能来自不同的供应商。这提供了额外的保护层。第\
  \ 18.6 节描述了 DMZ 的用途。\n\n防火墙可以是硬件或软件。无论哪种情况，它都位于外部世界和你的局域网之间。防火墙需要由经过培训或经验丰富的专业人员设置和维护，以确保其有效性。维护组织防火墙的责任将属于网络管理员或安全组。作为应用程序管理员，你可能不会负责这种维护活动。\n\
  \n## 18.6 DMZ—非军事化区\n\nDMZ 是一种为你的网络提供额外安全层的方法。如果你的网络有防火防火墙，那么两个防火墙之间的区域被认为是 DMZ。图\
  \ 18.3 说明了一个具有两个防火墙及其之间存在 DMZ 的网络。\n\n![image](img/F000182f18-03-9780123985453.jpg)\n\
  \n图 18.3 通过在网络中使用两个防火墙创建的 DMZ。\n\n\n\n\n如果你的组织提供了局域网（LAN）之外的用户服务，即面向外部世界的服务，那么提供这些服务的服务器将位于\
  \ DMZ（解隔离区）。这允许它们从外部世界访问，同时保护了你网络其他部分免受外部暴露。可能向外部世界提供的服务示例包括：\n\n* 邮件服务器\n* FTP\
  \ 服务器\n* Web 服务器\n\n你的组织网络是否拥有 DMZ 对支持你的应用程序没有显著影响，这仅仅是一些对你来说有价值的知识。应用程序供应商可能会询问你的服务器是在\
  \ DMZ 中还是内部网络中。提前掌握这些信息并理解其含义将使你的工作变得轻松一点。\n\n## 18.7 你的网络上有什么\n\n网络可能是一个庞大、忙碌且多样化的地方。对于应用程序管理员来说，了解可能存在于网络上的设备类型是一个好主意。接下来的章节简要描述了你组织网络中可能存在的内容。\n\
  \n### 18.7.1 用户工作站\n\n用户工作站可能是大多数网络上数量最多的设备类型。你的应用程序的用户需要连接到网络才能访问它。所有其他支持组织业务需求的应用程序也是如此。\n\
  \n### 18.7.2 服务器\n\n服务器是为网络上的用户或其他计算机提供一个或多个服务的计算机。虽然任何计算机都可能提供多种不同的服务，但通常每个服务器只支持单一服务。这里列出了网络上可能服务器类型示例：\n\
  \n* 应用程序服务器——用于运行应用程序软件，例如你支持的应用程序。根据组织对软件种类的需求，应用程序服务器可能是网络上最常见的服务器类型。\n* Web 服务器——运行处理用户提交的网页页面请求的软件。三个常用的\
  \ Web 服务器软件包是 Apache HTTP Server (Apache)、Microsoft Internet Information Services\
  \ (IIS) 和 Sun Java System Web Server。\n* 数据库服务器——维护数据库中信息的软件，通常是关系型数据库。它响应用户和其他服务器的请求，向数据库插入或从数据库查询、更新、删除和选择信息。常见的关系型数据库管理软件包有\
  \ MySQL、Microsoft SQL Server、IBM DB2 和 Oracle。\n* 邮件服务器——使用简单邮件传输协议 (SMTP) 跨网络传输电子邮件。如果服务器是基于\
  \ UNIX 或 Linux 的，在邮件服务器上运行的软件示例包括 sendmail、Postfix 或 Exim。在 Windows 服务器上，最常见的电子邮件软件是\
  \ Microsoft Exchange Server。\n* 文件服务器——通过包含网络上任何人都可以访问的文件来支持用户和其他服务器。\n* FTP 服务器——存在于网络上，以便在网络与之间传输大文件。如果你组织使用的应用程序需要向客户端、业务伙伴或政府实体传输文件，则可以使用\
  \ FTP 服务器来满足这一业务需求。\n\n### 18.7.3 打印机\n\n几乎每个人偶尔都需要打印一些东西。与其让每个用户直接为 PC 连接一台小型打印机，不如大多数组织拥有直接连接到网络的较大的打印机。任何获得打印机权限的用户都可以使用它打印他们的报告、代码列表或配方。\n\
  \n### 18.7.4 路由器\n\n路由器是将数据包从一个网络转发到另一个网络的电子设备，从而将多个网络连接在一起。如果你的组织支持多个网络（例如位于几个城市中的每一个），那么在它们汇合的地方可能存在路由器。另一个例子是，如果你的局域网\
  \ (LAN) 连接到互联网，那么在该连接点的 LAN 上就会有一个路由器。\n\n### 18.7.5 交换机\n\n交换机是 LAN 上的电子设备，它接受来自\
  \ LAN 上任何设备的消息并将其转发到目标设备。如果你的 LAN 上有超过几个设备，那么它可能包含一个或多个交换机。\n\n### 18.7.6 网络驱动器\n\
  \n网络驱动器是一种存储设备（类似于驱动器），供组织网络上的用户和其他服务器使用。每个用户在访问该设备之前，需要由系统管理员授予访问权限。网络驱动器允许多个用户或服务器共享子目录和文件，以促进协作工作。\n\
  \n网络驱动器的另一种用法示例是：如果一个组织在特定的驱动器上维护所有的文档，而我需要访问这些文档之一，我可能会获得该驱动器的访问权限。然后我就可以从我的工作站映射（即定义）该驱动器。在映射驱动器后，我可以随时访问该驱动器。\n\
  \n### 18.7.7 子网\n\n组织可能将他们的网络分成多个部分。如果他们选择这样做，那么这些划分中的每一个都被称为子网。这样做的一个原因可能是为了让特定建筑中的所有计算机都位于同一个子网中。假设子网上的大多数计算机主要相互相互通信，那么流量就可以集中在子网内部。通过这样做，可以提高网络效率。如果你的组织有\
  \ 50 台计算机，这不会产生太大影响，但如果有 1000 台计算机，这无疑会产生影响。\n\n## 第 19 章：你的组织\n\n## 摘要\n\n每个应用程序管理员都是组织的一部分。为了有效工作，他或她需要知道如何与个人、小组和策略进行有效协作。\n\
  \n### 关键词\n\n组织；IT 部门；创新；数据中心；优先级排序；变更控制；文档编制；技术格局；SLA；灾备计划；数据字典；费用分；组织文化；与其他应用程序的交互\n\
  \n作为应用程序管理员，你大部分时间将花在技术问题上，但你需要依靠组织的其他部分提供大量支持。没有人了解他们将遇到的所有技术主题，也不完全了解他们的组织是如何运营的。你需要与组织中的主管、同伴和其他技术专业人员合作来完成工作。\n\
  \n### 19.1 IT 部门向谁汇报？\n\n如果你在 IT 小组，了解该小组向谁汇报是非常重要的。IT 小组向 CEO（首席执行官）汇报吗？财务部门？研发部门？这些选择没有“坏”，但它们指示了\
  \ IT 在组织中的角色。许多人认为，如果 CIO（首席信息官）向 CEO 汇报，那么 IT 将会有更高的威望和地位，因为它显然对 CEO 非常重要。\n\n\
  ### 19.2 创新\n\n观察你 IT 部门的另一种方式是看它是否具有创新性。你的 IT 部门只是接受新硬件的订单，还是为组织提供领导力和愿景？一个将自己的角色视为与业务伙伴关系以推动收入，并帮助对新产品和新市场进行投资的\
  \ IT 部门，比一个只会安装更换服务器的 IT 部门更有可能提供更多多样性和更多新技术供你工作。\n\n### 19.3 支持你的技术小组\n\n\n\n\n\
  \n应用管理员需要其他技术团队的协助才能充分支持其应用程序。为了高效工作，你对组织需要了解的最重要信息之一就是：当你的应用程序与其他系统发生冲突问题时，应该联系谁寻求协助。了解哪个小组负责哪个领域是一个良好的开始，但了解并与其他小组的同事建立良好的工作关系将是无价的。\n\
  \n请了解你的组织是否设有执行下列功能的小组。请注意，并非所有组织都拥有以下小组。IT 部门较小的组织可能会将多个功能合并到一个小组中。例如，系统管理员可能还会处理网络管理和安全工作：\n\
  \n- Active Directory 管理员：通过管理用户账户来维护 Active Directory 子系统，确保用户账户具有正确的安全访问权限，创建并将用户分配到正确的角色，在应用程序更改为\
  \ LDAP 或 SSO 认证时提供指导等。\n- 备份与恢复管理员：调度和监控运行在企业范围服务器上的备份过程。与应用管理员协作，确保所有必要的驱动器和目录都被备份。设置报告以验证备份是否成功。如果你需要加载存储在磁带或\
  \ DVD 等辅助介质上的备份文件，该团队也将提供帮助。\n- 计算机操作员：在数据中心工作，确保所有服务器运行正常、监控工具、接收警报、升级问题等。他们可能负责启动批处理作业并验证这些作业是否成功完成。如果在非工作时间发生问题，他们将尝试处理。\n\
  - DBA（数据库管理员）：支持你的应用程序及其他程序依赖的数据库。他们负责为数据库软件应用更新、在性能出现问题时调优数据库、验证数据库正在备份、维护数据库用户账户等。\n\
  - 桌面支持：与用户合作，确保其桌面软件和硬件运行正常。该团队将执行桌面操作系统软件、应用程序等的安装和更新。\n- DNS（域名系统系统）管理员：负责确保组织所需的所有\
  \ DNS 条目都存在且准确。\n- 电子邮件管理员：负责组织赖赖以生成和接收电子邮件的任何电子邮件服务器和软件。\n- 帮助台（Help Desk）：用户接触的第一线支持。他们将解决他们熟悉的问题或可以在知识库中查找到的问题。\n\
  - 网络管理员：负责维护构成组织计算机网络的硬件和软件。\n- SAN（存储区域网络）团队：负责存在于存储区域并可供公司网络任何人使用的磁盘存储。\n- 调度应用程序管理员：安装、维护和支持如\
  \ `Control-M` 等企业级调度工具。\n- 安全管理员：负责 IT 相关的安全。该小组可能处理开放防火墙端口的请求。他们可能还会定期使用 `Nessus`\
  \ 等工具运行漏洞扫描。\n- 软件开发：开发应用程序的团队。他们负责对其进行增强、调优并修复识别出的任何问题。\n- 系统管理员（又称 sysadmins）：负责在服务器上安装操作系统等基础软件。需要时，他们还会对操作系统应用升级和补丁。\n\
  - 监控软件管理员：负责如 `Nagios`、`SolarWinds` 和 `OpenView` 等企业级监控软件。\n- Web 服务器管理员：维护 `IIS`\
  \ 和 `Apache` 等 Web 服务器软件包。\n\n## 19.4 你的组织有数据中心吗？\n\n数据中心是存放组织的计算机、网络硬件、存储子系统、通信连接、布线等的设施。它很可能配备空调等环境设备，以保持环境处于硬件的最佳温度。许多数据中心拥有冗余电源器和/或\
  \ `UPS`（不间断电源）。\n\n如果你的组织拥有好几台服务器，那么它们很可能位于数据中心。数据中心也很可能采取了安全措施，以防止入侵者物理接触硬件。安全措施可以包括锁上的门、警卫、限制访问的密码磁条以及闭路电视摄像头。\n\
  \n由于这些安全预防措施，你可能无法独自访问数据库中心。如果你不是经常访问，应该看看是否可以去参观。虽然你实际上并不需要知道它看起来什么样，但对我来说，实际上了解你辛苦维护其运行的服务器位于何处以及长什么样是有一定价值的。\n\
  \n数据中心是 24/7 小时值守吗？如果托管你应用程序的服务器挂起并需要重启，这对你来说将变得重要。虽然许多问题可以远程解决，但有些时候，有人按下开关切断电源是无可替代的。\n\
  \n如果数据中心不是 24/7 小时值守，那么什么时候有人，什么时候没人？如果在“非值班”期间发生危机，你的替代方案是什么？在紧急情况下，有人有多快冲向数据中心处理问题？这些问题的答案需要反映在你的应用程序的\
  \ `SLA`（服务水平协议）中。如果一个数据中心工作人员需要 60 分钟才能到达现场，你就不想向用户承诺应用程序会在故障后 10 分钟内恢复。\n\n如果需要，你知道如何联系数据中心吗？如果数据中心时刻值守那太棒了，但除非你知道如何联系上他们，否则帮助并不大：\n\
  \n- 是否有一个一直有人值守的办公桌电话？\n- 是否有一个由值班数据中心技术人员携带的手机？\n- 是否有一份值班名单，指明每周在数据中心应该联系谁？\n\n\
  \n\n\n\n- 是否有一个由数据中心人员监控的电子邮件地址？\n\n## 19.5 组织内是否存在类似的应用程序？\n\n如果组织内有其他管理方式与你的程序相似的应用程序，是否可以利用这种状况？性质上相似的应用程序为跨部门支持提供了天然机会。可能由于业务、监管或安全原因导致无法这样做，但如果可能可以进行合作，就应该去探索这种可能性。\n\
  \n你可以利用相似应用程序的一些可能方法包括：\n\n- 不同应用程序的 `Application Administrators`（应用程序管理员）是否可以快速方便地进行交叉培训以互相备份支持？\n\
  - 如果多个应用程序极其相似，一个 `Application Administrator`（应用程序管理员）可以支持多个应用程序吗？\n- 在紧急情况下，相似应用程序的\
  \ `Application Administrators`（应用程序管理员）可以在无需预先培训的情况下支持其他应用程序吗？\n- 是否可以重用相似应用程序的程序、流程、文档和自动化任务以避免造轮子？\n\
  \n## 19.6 向其他应用程序管理员学习\n\n如果说我在 IT 领域多年来学到的一点是什么，那就是每个人都能从别人身上学到东西。你可能认为你管理应用程序的方式没有改进空间，但我向你保证，如果你与其他\
  \ `Application Administrators`（应用程序管理员）交流，你会发现做某事的更好方法。如果你没有学到任何东西，要么你极度固执，要么你就是我们行业见过的最有能力的专业人士。\n\
  \n从其他 `Application Administrators`（应用程序管理员）那里可以学习的简短列表包括：\n\n- 它的 `SLA`（服务水平协议）细节是什么？\n\
  - 他们是如何实施变更控制的？\n- 他们是如何进行备份的？\n- 他们有哪些巧妙的小脚本来自动化枯燥的任务？每个应用程序都有如运行备份、清理旧文件和审查日志文件等任务，这些任务必须完成但非常耗时，是自动化的理想对象。\n\
  - 他们使用什么来监控服务器以及运行在服务器上的所有程序？\n- 他们是如何记录应用程序故障的？\n- 他们从每次故障中学到了什么，帮助他们预防或减少未来的故障发生？\n\
  - 他们是如何记录他们的最佳实践的？\n- 他们是如何同步生产系统和 `DR`（灾难恢复）系统的（包括数据和软件）？\n- 他们如何与用户社区协调故障信息？\n\
  - 他们如何对备份人员和未来的继任人员进行交叉培训？\n- 当应用程序宕机时，他们如何收到警报？\n- 他们是否有相应的流程在应用程序宕机时重启它？\n- 他们的\
  \ `UATs`（用户验收测试）长什么样？\n- 谁编写他们的 `UATs`？\n- 谁运行他们的 `UATs`？\n- 他们是如何进行压力测试的？他们使用正式的工具吗？他们是否编写了脚本或批处理文件给应用程序施加负载？如果有一组用户同时访问应用程序以施加负载，他们是如何协调的？\n\
  - 他们在应用程序和服务器上发现了哪些漏洞？他们是如何发现这些漏洞的，又采取了什么措施来防护？\n\n了解组织内的其他 `Application Administrators`（应用程序管理员）并与他们交流业务是一个非常好的主意。如果你能与其他组织的\
  \ `Application Administrators`（应用程序管理员）建立联系，那也会非常有成效。当然，你必须付出才能有收获。你需要愿意分享一些你的“秘密”，才能期待他们分享自己的秘密。\n\
  \n## 19.7 应用程序优先级排序\n\n在组织眼中，并非所有应用程序都是平等的。被认为最重要的应用程序是那些能产生收入或履行对组织至关重要的功能。不符合这些标准的应用程序在水平或重要性上并不处于同一地位。\n\
  \n组织通常会对内部使用的以满足需求的应用程序进行排序。应用程序对组织越重要，评分越高。应用程序的评分决定了如下几点：\n\n- 投入给它的资源。为组织产生收入的应用程序可能比不产生收入的应用程序分配更多资源。\n\
  - `SLA` 中规定了什么水平的支持。例如，正常工作时间或 `24 × 7`。关键应用程序更有可能被要求全天候可用。\n- 它在 `DR`（灾难恢复）站点恢复的速度有多快。如果发生此类意外情况，高优先级应用程序将排在\
  \ `DR` 站点恢复的队列首位。\n- 与应用程序供应商的任何支持合同都更有可能包含 `24 × 7` 支持，如果它对组织的未来至关重要，还可能包含现场顾问服务。\n\
  \n确定应用程序优先级的常用方法是为每个应用程序分配高、中、低优先级。优先级级别的示例及其含义列在下方。显然，每个组织对于每个类别中的哪些应用程序都有其自己的定义和标准：\n\
  \n### 高优先级\n\n- 既能为组织产生收入又被认为是关键的应用程序。高优先级应用程序的一些示例包括：与客户/客户群交互的电子商务界面、`DNS`（域名系统）服务器、备份所有服务器以及满足政府监管要求所需的应用程序，这些都是高优先级状态的候选者。\n\
  - 高级应用程序预计随时可用。\n- 如果高级别应用程序出现问题，无论在一天中的什么时间或星期几，都预计在几小时内修复。\n- `DR` 站点已经存在一个支持每个高级别应用程序的“热”或预构建服务器。这使得在发生灾难时，应用程序能够相对快速地启动。\n\
  - 高级应用程序的数据定期备份到 `DR` 站点。这可能是每小时进行一次，也可能是实时的。\n\n### 中优先级\n\n- 组织可以在短时间内无法运行的应用程序将被分配为中优先级。可能是中优先级的应用程序示例包括：向用户工作站推送更新的应用程序或工单应用程序。\n\
  - 中级应用程序预计在正常工作时间内可用。\n- 如果中级应用程序出现问题，预计在一个工作日内恢复。\n- 如果发生灾难，中优先级应用程序可以安装在 `DR`\
  \ 站点已有的物理或虚拟机上。\n- 中级应用程序的数据每天备份到 `DR` 站点。\n\n### 低优先级\n\n- 组织可以在较长时间无法运行的应用程序将被分配为低优先级。它们的示例包括\
  \ `LMS`（学习管理系统）、跟踪无主财产的应用程序或跟踪员工假期申请的应用程序。\n- 低级应用程序预计在正常工作时间内可用。\n- 如果低级应用程序出现问题，预计在几周内恢复。\n\
  - 如果发生灾难，将在所有高、中优先级应用程序运行后处理低优先级应用程序。低优先级应用程序的硬件将在宣布灾难后订购。\n- 低级应用程序的数据每天备份到 `DR`\
  \ 站点。\n\n\n\n\n\n- 在进行任何更改之前，需要由用户代表批准对所做更改完整且准确的描述。\n- 更改最初在测试和/或 QA 系统上进行。如果在该级别成功，则将其推广到生产系统。\n\
  - 流程中的每一步都需要授权人员的批准。可以批准的职位示例包括用户代表、IT 代表、应用业务经理、开发小组代表以及实际安装更改的人员。划分审批责任是确保所有受影响的小组在变更过程中都有发言权。\n\
  - 对于每个正在进行的更改，都会预先创建一个 `UAT`（用户验收测试）。\n- `UAT` 由用户代表在每个系统上执行，例如 `DEV`、`QA` 和 `Production`。\n\
  - 必须建立数据对账过程，以验证更改是否仅影响了预期的数据集。该过程还需要定义如果观察到意外的数据变化，如何将数据回滚到原始状态。\n- 必须创建一个回滚计划，以确定当更改不符合预期时如何将系统恢复到初始状态。\n\
  \n您的组织是使用正式工具还是自有的流程来进行变更控制？这两种方法没有对错，但你需要了解现有的流程。如果本地开发的流程适合您组织的需求，那么它就是最好的使用工具。关于所用工具的功能，可以询问以下问题：\n\
  \n- 工具是否包含工作流组件，以便流程对于获得批准流程下一步授权的人员之外的每个人来说都是锁定的？\n- 工具是否会向需要将其推过当前阶段的人员发送电子邮件？如果当前审批者没有意识到其待处理的责任，那么可能会浪费大量时间等待更改被批准和推进。\n\
  - 工具是否能清楚地显示每个更改到为止完成了哪些步骤？\n- 工具是否能生成报告，记录到目前对特定应用程序或在特定期间内进行了哪些更改？\n- 审计员是否可以访问该工具，以便他们确认已遵循记录在案的变更控制程序？\n\
  - 工具是否允许异常情况，例如，如果工资应用程序在每月开支票阶段期间崩溃怎么办？如果它需要在特定时间内完成运行，可能没有时间通过整个审批周期。工具是否允许立即进行更改，并在下一个工作日由适当的人员批准？\n\
  \n您的组织对于将更改发布到 `Production` 系统时是否有特定的偏好或强制性时间？可能执行的限制或偏好示例包括：\n\n- 更改应仅在所有用户当天离开应用程序后进行。\n\
  - 更改应仅在主要业务位置（例如 `East Coast`）的用户当天离开应用程序后进行。\n- 更改应尽可能在`周五`进行。这允许在发生问题时利用整个周末来恢复应用程序。\n\
  - 更改只能在`周二`、`周三`和`周四`进行。这使得所有必要的支持人员更有可能解决问题。\n- 更改只能在发布的维护时间内进行。\n\n## 19.9 文档\n\
  \n您的组织内部存在多种类型的文档。示例包括：\n\n- 技术文档\n- 运营支持文档\n- `SLA`（服务水平协议）\n- 测试文档\n- `DR`（灾难恢复）计划\n\
  \n### 19.9.1 技术文档\n\n技术文档显示了应用程序所需的内容。它可以根据组织的需要变得简单，也可以详细。一个非常简单的版本将只需列出：\n\n-\
  \ 服务器名称\n- IP 地址\n- 操作系统和版本\n- 服务器是物理的还是虚拟的\n- 磁盘驱动器和大小\n- 应用程序版本\n- 需要开放的端口\n-\
  \ 服务器是否负载均衡\n- 设备生命周期结束\n\n如果您有多个环境，每个环境都应单独显示。典型环境包括：\n\n- `DEV`（开发）\n- `TEST`（测试）\n\
  - `QA`（质量保证），也称为 `UAT`（用户验收测试）\n- `PROD`（生产）\n\n有很多可用工具可以生成图表。几个示例包括：\n\n- `Microsoft\
  \ Visio`\n- `Dia`\n- `Lucidchart`\n- `draw.io`\n- `Pencil Project`\n- `Apache OpenOffice\
  \ Draw`\n\n这些工具中的一些是开源或共享软件或提供试用期的免费下载。其他昂贵的软件包是专门为开发图表定制的。如果您的组织有一个制作图表的标准工具，那么那可能就是您应该使用的。否则，请询问您的同事其他人在使用什么。\n\
  \n### 19.9.2 运营支持文档\n\n运营支持文档提供了应用程序管理员组将如何支持应用程序的细节。需要此类文档是为了防止对每个小组责任产生误解。通常涵盖的观点示例包括：\n\
  \n- 支持团队成员，例如`项目经理`、`文档经理`、`系统工程师`、`测试经理`以及`运营支持团队`的成员\n- 在安装应用程序之前准备服务器将要执行的步骤\n\
  - 将对应用程序及其运行的服务器进行哪些监控\n- 为操作和维护应用程序而实施的标准化程序\n- 识别、记录和诊断错误的程序\n- 支持小组将执行的安全特性和操作\n\
  - 将实施的备份和恢复程序\n\n### 19.9.3 服务水平协议\n\n服务水平协议（`SLA`）是支持小组与客户（即应用程序的用户）之间的合同，记录了他们可以从应用程序中期望的可用性和性能。无论用户是内部的还是外部的，都需要\
  \ `SLA`。如果应用程序停止工作或不符合性能预期，用户不在乎是由组织内部还是外部开发的。\n\n\n\n\n\n-   基于业务影响程度的响应时间：系统完全宕机、系统部分可用、系统性能缓慢、系统非关键部分故障，以及针对问题提供了可行的备选方案\n\
  -   已报告问题的升级程序\n-   将进行监控和报告的服务器指标\n-   帮助服务台（Help Desk）的服务覆盖时长\n-   执行备份的时间和日期\n\
  - 系统可以停机的维护窗口，例如每月第三周六上午 8 点至下午 6 点（中部时间）\n- IT 支持团队的联系方式\n-   如果第一联系人无法联系或未在约定的间隔内回复，则升级联系人\n\
  -   公共节假日是否提供支持，以及对这些节假日的定义\n-   通知请求者已报告问题已解决的方法\n-   定期的（例如每周）报告，列出所有已报告的问题，包括每个问题的状态\n\
  \n`SLA` 还可以列出不支持的内容。这可能包括以下点：\n- 应用程序运行或不支持运行的桌面电脑类型\n-   如果应用程序是基于 Web 的，则应包含支持的浏览器及版本列表\n\
  \n### 19.9.4 验证测试\n\n进行验证测试是为了验证应用程序运行是否符合预期。需要进行验证测试的情况包括：\n-   应用程序初始构建后\n-  \
  \ 应用程序经过升级或打过补丁后\n-   支持软件（例如操作系统）升级或打过补丁后（例如操作系统的维护周末）\n-   数据库发生更改后，特别是发生结构性变更后\n\
  -   使用新浏览器或现有浏览器的新版本时\n\n创建验证测试实际用例的群体应该是用户社区。与其他人相比，他们更清楚应用程序应该做什么和不该做什么。`Application\
  \ Administrator`（应用程序管理员）对应用程序的功能有大致的了解，但对界面和功能的熟悉程度绝不能达到经验用户应有的水平。用户可能会产生抵触，但他们至少需要参与到这些测试脚本的中。\n\
  \n让用户或用户代表创建验证测试文档还有一个非常重要的额外原因。如果由他们创建并批准了该文档，那么在系统通过了这套测试方案后，他们以后就不能指责测试不够准确或全面。如果测试不够详尽或不准确，那么他们只能怪他们自己。\n\
  \n### 19.9.5 灾难恢复计划\n\n没有人喜欢考虑可能影响组织及其数据中心的最坏情况。仅仅是想到这些就让人很沮丧，但必须有人考虑这些并计划如何减轻影响。`Chapter\
  \ 12` 包含了对灾难恢复更详细的描述。可以想象许多可能的灾难场景。一些非常现实的可能灾难包括：\n-   龙风风袭击了你的数据中心或非常靠近数据中心\n-\
  \   管道泄漏、河流、山洪或海啸淹没你的数据中心\n-   你的数据中心发生火灾\n-   你的数据中心因自然灾害、停电或电压波动失去电源\n-   地震摧毁了数据中心或使其无法使用\n\
  -   你所在的城市、州或国家发生内乱\n-   山火导致数据中心关闭或无法访问\n-   恐怖袭击目标针对你的组织、数据中心或城市\n-   发生灾难（龙风暴、地震、海啸、山火等）。虽然它没有从物理上损坏数据中心，但导致你的员工无法上班\n\
  \n上述灾难影响到你个人的概率看起来可能微乎其微，但在全国乃至范围内，它们正在经常发生。你想冒这个“永远不会有灾难影响你”的险吗？如果“不可能”的事情真的发生了，你会说什么来为自己辩护？如果你没有做好准备，你可能就要寻找新工作了。\n\
  \n组织拥有的每个应用程序都需要单独进行评估，并制定相应的 `DR`（灾难恢复）计划。应用程序用户和所有者可能不承认，但并非所有应用程序都是平等的。例如，一个客户进行购买的网站对于组织的收入流是至关重要的。其他应用程序（例如创建季度或年度报告的程序）可以长时间宕机而不会产生严重后果。前者应用程序的\
  \ `DR` 计划将与后者显著不同。\n\n`DR` 计划应该是什么样的？它们可以从复杂昂贵到极其简单不等。光谱的高端可能包括在远程 `DR` 设施中部署备用服务器，并进行实时传输以保持生产数据库和\
  \ `DR` 数据库同步。低端可能是承认在灾难发生后将获取替换服务器并加载从供应商处获取的软件。一旦 `DR` 服务器建成，将从最近的备份带中恢复数据库。只要它们对于相关应用程序是合适的，这两种计划都不是“错误”的。\n\
  \n绝对必要的是 `DR` 计划必须清晰规定将做什么以及由谁来。某些步骤必须在灾难发生之前完成。其他步骤只有在灾难发生后才会执行。不要忘记每个应用程序都需要自己的单独\
  \ `DR` 计划。以下是 `DR` 计划中应包含的几个示例：\n-   现在 `DR` 站点需要部署什么？可以提前完成的步骤包括获取服务器、加载操作系统、加载支持软件、加载应用程序软件、测试与数据库的连接等。\n\
  -   `DR` 站点是否有足够的电力、网络带宽、暖气和空调？\n-   谁有权宣布灾难并授权应用程序迁移到 `DR` 站点？是只移动一个应用程序，还是组织的所有应用程序都要同时移动？\n\
  -   谁负责每个设置任务？\n-   每个步骤将在何时完成？\n-   灾难发生时将执行哪些步骤？\n-   灾难发生时谁与用户、IT 支持团队等联系？\n\
  -   迁移到 `DR` 服务器对用户来说是完全透明的，还是他们需要进行最小调整？例如，他们是否需要使用新的 URL 来访问 Web 应用程序？还是 DNS 重新指向\
  \ `DR` 服务器从而无需进行任何更改？\n-   保持 `DR` 服务器与 `PROD` 服务器同步的计划是什么？例如，当 `PROD` 服务器上的操作系统或应用程序软件更新时，`DR`\
  \ 服务器也需要进行相同的更新。\n-   当灾难过去后，如何将应用程序迁移回生产服务器？由谁来做决定以及如何操作？\n\n\n\n\n定期审查每份 DR（灾难恢复）计划（例如每年一次），以确认其仍然适用。5\
  \ 年前并不重要的应用程序，现在可能对组织的生存至关重要。相反，其他应用程序可能已经退役，不再需要 DR 覆盖。如果不是定期审查 DR 计划，这些变化将不会被注意到。\n\
  \nDR 计划的另一个需要定期审查的方面是分配给每个任务的人员。人员会经常离开组织。如果将一个不再属于组织的人分配给 DR 计划中的某项关键任务，这本身可能是一场灾难。除了离职，员工往往也会在组织内部变动。2\
  \ 年前负责应用程序 `XYZ` 的人可能仍在公司任职，但现在已担任完全不同的职位。所有 DR 计划中的所有人员分配都需要定期审查。\n\n## 19.10 文档位置\n\
  \n每个组织都需要编写、开发或维护用于支持应用程序的文档。根据组织的不同，生成的文档目录可能很长，也可能很短。你可能需要创建的文档示例包括：\n\n字体 详细说明如何安装升级的项目计划\n\
  - 构建新服务器的请求表单\n- 每一项变更所需的 `UATs`（用户验收测试）\n- 每一个应用程序都需要制定 `DR`（灾难恢复）计划\n- 制定继任计划，以规定当你晋升或遭遇所谓的“意外（hit\
  \ the bus）”时由谁来支持你的应用程序\n- 备份计划说明了如何定期备份和验证你的应用程序数据库\n- 在安装完每月维护支持软件更新后将进行的有效性测试\n\
  - 访问应用程序的新用户授权请求\n\n一旦你创建了上述描述的所有文档，就必须将其存储在某处。你的组织对存储位置有任何要求或建议吗？可能的地点包括：\n\n-\
  \ 在你的 `PC` 上\n- 在公共网络驱动器上\n- 在门户网站上\n- 在组织图书馆的物理 3 环活夹中\n- 在 `SharePoint` 等工具中\n\
  \n一旦你确定了存储文档的地方，可能会被问到其他问题。例如：\n\n- 谁应该能够访问它们？\n- 谁可以授予或更改访问权限？\n- 每个人对文档应该拥有什么种级别的访问权限（例如：读取、写入、删除、修改）？\n\
  - 是否应该备份？频率是？如何备份？\n- 文档在删除之前应该维护多久？\n- 当需要删除文件或文档时，应该如何操作？\n\n## 19.11 数据字典\n\n\
  数据字典是元数据的集中存储库。元数据是关于数据的数据。组织数据字典中可能包含的内容示例包括：\n\n- 组织所有数据库中包含的字段名称\n- 每个字段存在哪些\
  \ `table(s)` 中\n- 每个字段存在哪些 `database(s)` 中\n- 组织数据库中所有字段的数据类型，例如：`integer`、`real`、`character`\
  \ 和 `image`\n- 组织数据库中所有字段的大小，例如：`LONG INT`、`DOUBLE` 和 `CHAR(64)`\n 每个数据库字段含义的解释\n\
  - 每个数据库字段的数据来源\n- 引用每个数据库字段的应用程序列表\n- 组织所有数据库中字段之间的关系\n- 组织所有数据库所有字段的默认值\n- 谁有权访问每个字段\n\
  \n你的组织维护数据字典吗？如果是，它会影响你支持的应用程序吗？影响你的方式可能包括\n\n- 数据字典中是否存在适用于你的应用程序的信息？\n- 你是否需要定期审查和验证与你的应用程序相关的数据字典条目？\n\
  - 如果你应用程序的数据库详情发生变化，你是否需要更新数据字典？例如，如果添加了新字段或更改了现有字段的大小，这些更改是否需要反映数据字典中？\n- 如果你的应用程序添加了新用户，他们的访问权限是否需要反映数据字典中？\n\
  \n## 19.12 费用分摊（Chargebacks）\n\n通常，IT 部门并不产生收入。组织向用户提供 IT 服务的一种常见方式是通过一种被称为“费用分摊（chargebacks）”的方法。用户部门收取的费用与他们“消耗”的\
  \ IT 服务水平相称。IT 部门为他们做得越多，收取的费用就越高。\n\n对于所有应用程序管理员来说，了解组织是否建立了费用分摊系统是明智的。知道用户组正在为你的服务付费，有助于你更积极地提供物超所值的服务。这还能帮助你优先处理出现的问题，即：你应该关注用户正被专门收费的服务。\n\
  \n费用分摊系统向用户部门收取了哪些费用？虽然每个组织的处理方式不同，但计算每个部门收费的某些常用指标可能基于：\n\n- 应用程序使用的服务器数量或特定特定用户部门的服务器数量\n\
  - 每个部门中应用程序的用户数\n- 对应用程序进行的定制化程度（整体或针对特定部门）\n- 使用的磁盘空间\n- 每个用户部门利用的网络带宽\n- 使用的 CPU\
  \ 时间\n- 按用户部门分摊的应用程序管理员人工成本\n- 专门为用户部门开发的报告数量\n- 设置和维护 `DR` 服务器的成本\n- 在主数据中心与 `DR`\
  \ 之间保持数据和软件同步的成本\n\n反，管理应用程序的 IT 组本身可能会向提供服务的其他 IT 组产生费用分摊成本。例如，应用程序组可能会产生类似的费用：\n\
  \n- 在数据中心设置服务器的成本。注意，虚拟服务器的成本与物理服务器的成本可能显著不同\n- 数据中心服务器的持续管理成本\n- 基于每个逻辑设备的驱动器数量和存储区域的\
  \ `SAN` 驱动器费用\n- 备份操作费用\n- `DBA` 组收取的每个数据库或专用数据库服务器的费用\n- 通过将备份带或文件重新加载到服务器上来恢复系统的费用\n\
  \n## 19.13 其他应用程序的影响\n\n如果你的组织在数据中心运行着许多应用程序，你需要理解你管理的应用程序是否正受到其他应用程序的影响，或者是否可能影响到它们。你需要考虑的一些问题包括：\n\
  \n- 你的应用程序服务器支持其他应用程序吗？现实地说，大多数应用程序并没有使用服务器的大部分容量，但软件供应商经常建议让他们的软件成为服务器上运行的唯一应用程序。\n\
  - 支持你应用程序的数据库是否也支持其他应用程序的数据库？如果你认为与另一个数据库密集型应用程序共享数据库服务器会导致你的应用程序产生无法调和的性能问题，那么你可以请求将你的数据库迁移到另一个物理数据库服务器。我要警告你，在提出此类请求之前，你应该做一些研究，并确认数据库竞争确实是一个问题。如果你提出的说法被证明是毫无根据的，那么没有人会认真对待你的下一次请求。\n\
  \n\n\n\n\n- 组织的网络是否支持数据包密集型应用程序，如 `VOIP`（网络语音协议）、文件共享或大图像？这可能会降低你应用程序的性能。遗憾的是，对于像这样的环境，可能没有任何解决方案。\n\
  - 你的应用程序与其他应用程序之间是否存在严重的时间冲突问题？例如，多个应用程序是否会在同时启动数据库密集型或网络密集型活动？如果你的应用程序在启动数据库密集型报告的同时，工资应用程序也启动了月度工资处理流程，那么应该重新安排其中一项活动。另一个例子是，当备份软件在你的服务器和其他其他服务器上运行时，如果启动了一份数据库密集型报告也是。\n\
  \n“娱乐性应用”会影响网络性能吗？如果网络性能问题的原因是成像部门的频繁活动，那么可能无能为力。但如果组织中的每个人都在看“三月疯狂”篮球赛、在“网络一一”期间假日购物或在互联网上观看世界杯，那么也许可以做些什么。娱乐性应用的示例包括：\n\
  \n- 网络电台/流媒体音频\n- 流媒体视频，即在线电影或电视节目\n- 在线游戏\n- 文件共享或 P2P（点对点）音乐共享\n- 即时消息\n- 在线购物\n\
  \n## 19.14 组织文化\n\n每个组织都有文化，即使它们并没有刻意追求一种。你的同事可能对这种文化毫无察觉，但它仍然存在。你可以问的一些可能帮助你理解组织文化的问题包括：\n\
  \n- 你的组织处于技术的最前沿，还是等到新技术变得更稳定、更广泛使用且更经济？\n- 你的组织是否处于高度监管的行业，审计是否经常发生？\n- 你的组织的员工流失率是否高于行业平均水平？\n\
  - 你的组织是否仅在被迫的情况下才做出改变？\n- 你的同事是否为了不现实且最终无法实现的截止日期而投入长时间工作？\n\n尽可能了解你的组织的建议适用于所有人，特别是新人。如果你最近被聘用于管理应用程序，你需要花时间了解你的新工作是如何进行的。\n\
  \n有多少用户可以（或正在）登录你的应用程序？取决于应用程序的性质，这个看似简单的问题可能出奇地难以回答。如果你的应用程序需要 ID 和密码登录，那么获取用户\
  \ ID 列表并进行计数应该并不困难。另一方面，如果你的应用程序是基于 Web 的且不需要 ID，那么可能无法统计用户群的规模。例如，电子商务网站在用户为其选择的内容付费之前不需要任何身份识别。\n\
  \n如果可能，定期跟踪你的用户数量是一个好主意。每周或每月获取用户数量并制作图表并不困难，而且可能极具价值。跟踪用户数量的原因包括：\n\n- 如果你的许可证只允许特定数量的用户，那么你想要知道自己离限制有多远。如果你在添加新副总裁作为用户时发现自己超过了限制，那将是非常不方便的。\n\
  - 如果你迅速接近用户限制，这可能会迫使管理层同意增加许可证限制，或者删除不再属于组织或不再使用该应用程序的用户。\n- 如果用户数量显著增加，那么你可能需要扩展硬件，以确保用户体验的应用程序性能不会下降。\n\
  - 如果用户数量在增加但不应该增长，这可能是安全违规的证据。\n- 向你的管理层展示应用程序的使用量正在增加，可能帮助你为应用程序争取资金。\n- 另一方面，如果应用程序中的用户活动量减少，你或业务所有者需要调查原因。这可能是用户对应用程序不不满的信号。也许他们认为应用程序的性能不可接受。这可能意味着他们从其他来源获取类似的数据或功能。这种缺乏活动可能表明该应用程序对组织已不再关键，应该考虑将其退休。\n\
  \n### 20.1.1 用户活动\n\n虽然知道你的应用程序有 1001 个注册用户是有用的，但这些信息本身并没有像想象中那么有用。也许比绝对计数更有用的是以下与用户相关的统计数据：\n\
  \n- 现在应用程序中有多少个用户？\n- 今天有多少用户登录了？\n- 昨天有多少用户登录了？\n- 在过去的一周、一个月或一年中，最大并发人数是多少？\n\
  - 哪个用户登录应用程序最频繁？\n- 哪个小组或部门的应用程序的用户最多？\n- 用户在应用程序中的平均时间是多少？\n- 一天中哪个时段应用程序使用最多？\n\
  - 一天中哪个时段应用程序使用最少？\n- 用户生成了多少活动（例如交易次数、报告等）？\n\n你的应用程序是否提供任何方法来回答上述此类使用相关问题？某些应用程序提供登录信息的系统级报告。此类报告通常被称为审计跟踪报告。\n\
  \n如果应用程序没有直接提供使用信息，是否可以间接收集这些细节？应用程序是否每次用户登录或注销时都会写入带有时间戳的日志条目？如果日志文件包含这种程度的细节，可能编写一个脚本来扫描日志文件、捕获使用相关的细节并将其写入文件或数据库。如果你拥有每个用户连接的\
  \ ID、登录时间和注销时间，那么你可以从这些数据中推导出大量使用相关的统计数据。\n\n### 20.1.2 日志文件的问题\n\n\n\n\n\n关于日志文件中的登录和注销记录，有一条警告。根据我的经验，这些记录似乎从没有完美对齐。我处理过许多应用程序，这些记录处理起来一直都不容易。通常发生的情况是，登录记录始终在那里，但某些注销记录缺失了。注销记录缺失的一个原因可能是用户在登录状态下应用程序崩溃了。\n\
  \n在许多应用程序中，如果用户以不正确的方式退出程序，该注销记录将会缺失。如果用户点击“退出”按钮或点击“注销”菜单选项，应用程序中的逻辑就会日志文件中写入一条注销记录。然而，如果用户点击了屏幕右上角的“X”，则可能不会有日志条目来记录这一注销事件。\n\
  \n这些记录发生混乱的另一种方式是，如果允许用户同时打开多个会话。如果允许这样做，那么在日志文件中将登录记录与相应的注销记录正确关联可能会非常困难。\n\n即使丢失了一些注销记录，或者允许用户拥有多个连接，你从日志文件中提取出的数据仍然非常有用。登录用户数将是准确的。你可能无法准确地计算每个用户在应用程序中持续多长时间。\n\
  \n## 20.1.2.1 日志文件的时间戳问题\n\n日志文件中另一个潜在的混乱来源是时间戳。例如：\n\n- 时间戳值是随着向下移动日志文件而增加，还是随着向上移动而增加？\n\
  - 时间代表生成该活动的用户本地时间吗？\n- 时间是 UT（以前称为 GMT）时间，还是应用程序服务器所在地的时间？\n- 日志记录过程如何处理服务器时间发生变化的情况？例如，当夏令时导致时钟“回拨”时？\n\
  \n## 20.1.3 是否某些用户比其他用户平等？\n\n并不是所有用户都是平等的。其中一些人偶尔登录一次应用程序，并且权限极小。其他用户似乎一直都在应用程序中。\n\
  \n如果你知道哪些用户是最重要的，将对你是有益的。具有高权限（如写入或审批权限）的用户在组织层级中的地位通常高于具有只读访问权限的用户。如果高权限用户遇到问题，那么该问题需要尽快进行调查和纠正。\n\
  \n## 20.1.4 用户位置\n\n如果应用程序的所有用户都在同一个城市，或者最好是在同一栋大楼内，应用程序管理员的工作将会简单得多。不幸的是，我们中可能很少有人处于这种境地。大多数应用程序管理员的用户遍布于全国甚至世界各地。与多个用户位置相关的某些特定复杂将在后续章节中描述。\n\
  \n### 20.1.4.1 时区\n\n地理多样性使支持变得复杂的一个原因是，这意味着用户分布在许多时区。时区使支持复杂的一些原因包括：\n\n- 其他时区的用户在你睡觉时需要或想要支持。要提供\
  \ `24 × 7` 的支持需要三个或更多轮班的应用程序管理员。\n- 多个时区使得更难找到一个无人使用系统的维护窗口，以便对其停机。\n- 无法同时联系所有人，因为在任何给定时间，某些用户都会不在办公室。\n\
  \n### 20.1.4.2 缺乏面对面支持\n\n支持当然可以远程进行，但我认为每个人都会同意，距离使得提供支持变得更加复杂。使用电子邮件、电话以及最好的屏幕共享等通信工具可以使远程支持变得更容易，但它仍然比站在用户身后确切看到他或她在做什么要困难。\n\
  \n### 20.1.4.3 文化差异\n\n在遥远国家拥有用户意味着用户将来自不同的国家。这意味着他们会说多种语言并来自不同的文化。用户之间的文化差异使得远程支持应用程序变得更加困难。总的来说，我能提供的最佳建议是对所有用户保持耐心。\n\
  \n## 20.1.5 访问什么？\n\n你的用户到底需要访问什么？你将授予访问权限的某些潜在对象将在后续章节中进行描述。但请记住，不同类别的用户需要访问不同的对象。\n\
  \n### 20.1.5.1 应用程序\n\n根据定义，用户需要能够访问应用程序。不同的用户组或类别的用户需要访问应用程序的不同组件。希望你已经创建了不同的角色，例如\
  \ `reader`、`writer`、`reviewer`、`approver` 等，并可以分配给用户。将用户分配到符合其需求的角色将使支持他们变得容易得多。\n\
  \n应用程序具有根据星期几或一天中的时间限制访问的能力吗？如果没有特定用户在非工作时间访问应用程序的正当业务理由，实施这样的限制是一个好主意吗？通过这种方式限制访问可能会使应用程序更安全。另一方面，如果发生危机或大量工作需要完成，它可能会防止用户在迫切需要时加班。\n\
  \n如果你的应用程序没有限制用户登录应用程序时间的功能，但这又是一个理想的安全功能怎么办？如果你正在使用 `Active Directory` (`AD`) 或\
  \ `Single Sign On` (`SSO`)，它们是否都提供了这种能力？如果 `Active Directory` (`AD`) 用于身份验证，你可以用它来执行登录限制吗？\n\
  \n### 20.1.5.2 多会话\n\n用户可以同时打开多个应用程序会话吗？某些应用程序允许这样做，而其他则不允许。你应该了解你的应用程序是否允许。这有利也有弊。在某些应用程序中，这是一个可以切换的设置。允许多个会话可能会提高用户的效率，特别是在响应时间缓慢的情况下。另一方面，如果用户尝试从多个会话修改相同或相关的数据项，可能会损坏数据。\n\
  \n不允许的另一个原因是出于考虑。如果坏人冒充合法用户登录，而真实用户尝试登录，那么会有意义错误信息告诉她有人在使用她的账户。应该教育用户，如果遇到这种情况，立即联系他们的主管或应用程序管理员！\n\
  \n### 20.1.5.3 报告\n\n如果应用程序具有报告功能，那么至少某些用户需要访问它。用户对报告系统的某些访问示例包括：\n\n- 运行现有报告\n\
  - 创建新报告\n- 修改现有报告\n- 删除现有报告\n- 计划报告\n- 修改已计划报告的详情\n- 更改已计划报告的分发列表\n\n### 20.1.5.4\
  \ 服务器\n\n你可能会面临用户声称他们需要访问应用程序服务器的情况。这些用户可能会告诉你，某些功能只能在服务器上执行。当你面临此类主张时，第一步应该是确定这些主张是否准确。查看文档看看它对该主题是如何说的。如果它提供的细节没有结论，那么你需要联系供应商支持组来验证这一主张。\n\
  \n\n\n\n\n如果事实证明某些功能只能在服务器上执行，那么你就需要考虑处理这种情况的方法。一些可能的方案包括：\n\n• 任务可以自动化吗？是否可以将此任务添加到调度器中并定期运行？\n\
  \n• 你可以远程登录到服务器并为用户执行任务吗？如果该任务执行频率较低（例如每月一次或更少），那么这可能是一个可行的解决方案。如果任务需要每天甚至每周执行一次，那么对于你或相关用户来说可能都是不可接受的。\n\
  \n• 用户可以编写一个脚本或批文件，由你在服务器上为他们执行吗？如果他们不会写批文件，你可以来编写并演示给他们看。\n\n• 在建立远程连接后，你可以与用户共享桌面吗？然后你给他们会话控制权，允许他们在受控环境中启动任务。\n\
  \n• 仅在用户需要在服务器上进行操作时才开启其权限，并在完成任务后立即撤销权限。在其他所有时间内，他们在服务器上的账户均处于禁用状态。\n\n• 向极少数用户授予服务器的访问权限。在我看来，这是所有可能方案中最不可接受的。\n\
  \n以下是一些我通过惨痛教训换建议。在提供生产服务器的访问权限之前，请务必深思熟虑。权限人数越多，出现问题的概率就越大，在查明是谁导致问题时，互相指责的情况也会越多。\n\
  \n不提供服务器访问权限的另一个原因是你组织内部可能存在的审计流程。如果你的应用程序必须遵守 SOX 或另一组政府法规，那么限制对服务器的访问可能已经是强制性的了。在某种程度上，这可以转化为你的优势。你可以告诉用户他们无法访问服务器，并把这归咎于审计员！\n\
  \n### 20.1.5.5 数据库\n\n最终，你可能会收到直接访问应用程序数据库的请求。请求者可能是某个用户，也可能是你组织中其他小组的人员。他们会解释说他们想要数据库的只读访问权限。\n\
  \n\n\n\n\n- 不要仅仅因为别人不是技术人员就轻视他们。你的技术素养可能比他们高，但他们的业务素养几乎肯定比你高。\n- 除非他们证明了这一点，否则不要假设他们拥有特定的技术知识。作为一名\
  \ IT 人员，很容易假设每个人都知道如何打开 `command prompt`（命令提示符）或如何截图，但事实并非如此。除非你确定用户在技术上是称职，否则最好假设他们并不了解许多技术细节。\n\
  - 不要提供不需要的技术细节。例如，用户不在乎应用程序是用什么语言编写的，他们不在乎 `CPU` 有多少核心。提供过多的信息会浪费时间，引起困惑，并分散你对正尝试完成的任务的注意力。\n\
  - 与用户交道时，不要使用术语、缩写或首字母词。这会导致混乱、误解和怨恨。\n- 听到他们声音中充满挫败感时不要感到惊讶。保持冷静，用通俗易懂的语言解释问题。\n\
  - 演示，而不是指令。向他们展示需要做什么，但如果他们的方式与你略有不同，请不要生气。他们的方法可能没有你的快或高效，但如果他们觉得舒服，那么这对他们来说就是最好的。\n\
  - 看着别人在电脑上操作可能是极其沮丧的。他们动作比你慢。他们会犯你不会犯的错误。他们不知道做事情最快的方法。避免提供过多建议的诱。只需微笑并保持耐心。\n-\
  \ 观察用户如何操作非常有见地。你可能会发现他们所做的某些假设（可能是因为 `UI` 令人困惑），或者他们正在使用在另一个应用程序中有效的组合键，但该键会导致你的应用程序终止。\n\
  \n### 20.2.1 最简单的解决方案可能是正确的\n\n奥姆剃刀（Ockham's Razor）是一种假设，通常最简单的解释可能是正确的。这个概念绝对适用于应用程序支持。如果你的应用程序突然出现问题，尝试通过寻找最简单的修复方法来解决：\n\
  \n- 是用户（`cockpit`）错误吗？我不喜欢指责别人，但根据我的经验，这是应用程序出现“问题”的最要原因。如果只有一个用户遇到问题，情况尤其如此。\n\
  - 是否发生了任何变化？用户是否在他们的电脑上加载了任何新软件？用户是否换了新电脑？用户最近是否更改了物理位置、域名、网络等？\n- 是否在使用新版本的应用程序？如果你刚刚升级到应用程序的新版本，那么很有可能其中仍然存在一些几个\
  \ bug。\n\n### 20.2.2 保持清晰\n\n始终准备好澄清向用户提出的问题。这对你来说可能显而易见，但对他们来说可能并不清晰。如果他们不理解你的问题，他们的答案可能会让你做无无用功。在投入大量时间回答他们的答案之前，最好确保他们真的理解了你的问题。\n\
  \n### 20.2.3 信任但要验证\n\n我喜欢用户。我最好的朋友中有很多用户。但在没有验证的情况下，我从不相信他们说的任何话。当技术术语从他们口中或从键盘里跳出来时，情况尤其如此。\n\
  \n今天我遇到了一个完美的例子，说明了为什么应用程序管理员需要验证用户所说的话。我支持的一个应用程序的主要用户给我发了一封邮件，写道：“这周我在模板上遇到了一些问题，供应商告诉我我们需要重启服务器上的数据库。请尽快处理。”\
  \ 这看起来听起来非常直接。`DBA` 说，如果我们在数据库服务器上重启数据库，将影响许多其他应用程序。我回复用户，告诉她重启数据库是不可能的。我让她让供应商技术人员发邮件，详细说明他想想做什么。几分钟后，我收到一封邮件，写道：“在服务器上进入\
  \ `Control Panel | Administrative Tools | Services` 并重启‘XXXX background service’。然后重启\
  \ `IIS`。” 这两个请求完全没有关系。她是如何将重启数据库与重启 Windows 服务以及 `IIS` 混淆的，这真很难理解。如果我盲目执行了她的第一个请求，将给许多其他用户带来不便，并且无法解决问题。永远记住这句话——“信任，但要验证。”\n\
  \n## 20.3 用户的观点\n\n用户看待世界的方式与 IT 人员不同，这不应该感到惊讶。用户通常不像 IT 人员那样习惯技术，也不像他们热爱技术。对他们来说，重要的是尽可能快速、准确，并且最重要的是容易地完成工作。\n\
  \n无论是用户的观点还是 IT 员工的观点都没有错的。它们在本质上都不比对方更有价值。它们反映了这样一个现实：组织是复杂的，是由对事物有不同看法的人组成的。仅仅因为某人的观点与你的不同就否定它，这是非常重要的。\n\
  \n### 20.3.1 应用程序的存在是为了支持业务需求\n\n永远不要忘记，应用程序和你的工作之所以存在，是因为有需要满足的业务需求。组织有业务需求完成某些工作，例如向他们的客户发送发票。用户需要向发票系统输入数据，这样就可以创建发票，组织就可以收回欠款。程序员、`DBA`\
  \ 和应用程序管理员的职位的存在是为了帮助满足业务需求。我们工作的存在并不仅仅是因为公司喜欢酷炫的软件。\n\n### 20.3.2 停机成本\n\n我们这些技术人员不喜欢应用程序宕机，但我们通常不会为停机分配具体的金额成本。用户或应用程序的所有者比我们更有可能建立这种联系。发现每小时或每分钟停机成本可能是很有趣的。如果你有了这个数字，那么你可能就不太会承担停机的风险。\n\
  \n拥有以下问题的可以加强你对组织业务背景的了解：\n\n- 停机是否有相关成本，或者用户可以以后“补回来”？\n- 应用程序宕机每分钟给组织带来多少成本？\n\
  - 每次发生停机会损失多少客户？\n- 如果应用程序宕机会对监管机构产生任何影响吗？\n- 是否有合同要求应用程序不能停机？\n- 停机是否会导致停机时间超过阈值并触发罚款或其他后果？\n\
  \n## 20.4 用户投诉\n\n没有任何应用程序曾经是或将来会是完美的。即使是最好的应用程序也会出现问题。当应用程序出现问题时，你可以确定用户会对其抱怨。这是预料之中的，因为如果他们不让你知道问题，你就无法修复它们。\n\
  \n### 20.4.1 性能投诉\n\n根据我的经验，对应用程序最常见的投诉是它们太慢了。虽然应用程序管理员可能觉得响应时间没有减少，但对于大部分时间都在使用应用程序的人来说，性能下降很快就会注意到。\n\
  \n如果用户抱怨应用程序太慢，应用程序管理员首先需要做的是获取额外的背景信息。询问以下问题可以提供所需的信息细节：\n\n- 用户在其他应用程序上是否有类似的问题？如果应用程序相似（例如都是基于\
  \ Web 或都不基于 Web），这个问题尤为重要。\n\n\n\n\n\n- 性能问题首次出现是什么时候？\n- 性能问题是持续性的还是间歇性的？\n- 位于同一区域的其他用户在使用此或其他应用程序时是否也遇到了性能问题？\n\
  - 在用户首次注意到性能问题时，他们是在办公室工作还是在远程地点？\n- 如果他们正在远程工作，他们是在固定地点（例如家里）工作吗？还是在他们以前从未去过的远程地点（例如酒店、咖啡馆或客户现场）工作？\n\
  - 用户是直接连接到组织的网络，还是通过 `VPN`（虚拟公共网络）连接的？\n\n## 20.4.2 非性能类投诉\n\n所有应用程序都可能出现与性能相关的投诉。这些投诉的常见类型包括：\n\
  \n- 点击图标或快捷方式时，应用程序未启动\n- 用户无法登录应用程序\n- 用户密码已过期\n- 屏幕上本应存在的按钮、菜单项、字段等对象未出现\n- 显示了意外之外的错误消息\n\
  - 请求结果要么始终不显示，或者显示了但不准确\n- 报告没有按预期分发\n- 功能缺失\n- 导航路径复杂\n- UI（用户界面）设计令人困惑\n- 错误消息不准确、不清晰或无意义\n\
  - 需要在多个处输入相同的信息\n\n我发现，要求用户关闭应用程序并重启电脑可以解决解决之极高比例的问题。用户可能并不急于这样做，但要向他们解释，这个简单的步骤可能比提交工单更快地解决他们的问题。如果你向他们解释尝试重启对他们自己有利，那么你更有可能获得他们的配合。\n\
  \n如果重启电脑不能解决问题，则需要创建一个事件报告。以下章节描述了用户需要收集并提供给你或帮助台（如果他们是填写事件报告表单的人）的信息。\n\n## 20.4.3\
  \ 事件报告\n\n每个问题或崩溃都是一次事件。每个事件的细节都需要记录、存储，并供以后参考。如果你的公司没有正式的事件报告，你需要为你的应用程序创建一个。它可以是存储在公共驱动器上的文本或\
  \ Word 文档。如果你的组织已经有了如 `Remedy`、`Plain Ticket`、`Trac` 或 `Request Tracker` 之软件包，那么你几乎会被要求使用它来跟踪事件。\n\
  \n这里列出了事件报告应记录的细节示例：\n\n- 问题发生的日期和时间。\n- 谁第一个遇到这个问题？\n- 用户在错误发生之前执行的准确步骤。\n- 问题是可以重复的吗？\n\
  - 用户看到或体验的示例。尽可能包含问题的截图。\n- 正在显示的错误消息。获取错误消息的截图是好的，但你还应该将错误消息输入事件文档或跟踪系统中。截图的内容是不可搜索的，但如果输入了错误消息，就可以进行搜索。\n\
  - 错误消息的来源，例如，是由应用程序、桌面操作系统、数据库等生成的。\n- 有多少用户遇到过这个问题？\n- 在哪些地点（即哪些办公室或设施）遇到了这个问题？\n\
  - 这是一个新问题还是现有问题？\n- 发生问题的计算机类型是什么？例如，用户使用的是 Apple、Dell、Compaq、平板电脑等？\n- 发生问题的用户的电脑操作系统是什么？\n\
  - 应用程序的版本号。\n- 导致此问题发生之前的步骤。\n- 问题解决的日期和时间。\n- 问题是如何解决的？\n- 谁帮助解决了问题？例如，应用程序管理员、供应商支持团队、系统管理员、数据库管理员等。\n\
  \n无论你最终使用什么方法来保存事件报告，它们都应该是可搜索的。这将使你能够快速判断过去是否发生过问题，如果发生过，当时是如何解决的。典型的应用程序管理员太忙，没有花时间去调查和修复已经出现并修复的问题。\n\
  \n## 20.5 处理用户的变更请求\n\n你的组织是否有正式的方法让用户提交关于应用程序的请求？每个人是否知道他们应该如何提交和接收用户请求？提交变更请求的一些正式方法包括：\n\
  \n- 在定期举行的应用程序状态会议期间\n- 通过电子邮件发送给个人或组发列表\n- 在现有的请求表单上书面提交\n- 通过网站或门户网站\n\n### 20.5.1\
  \ 正式请求流程的优点\n\n虽然这种方法可能看起来过于死板，但正式流程具有明显的优势。其中一些优势是：\n\n- 永久记录——将会有关于更改内容、谁请求的、谁批准的以及何时进行更改的永久记录。\n\
  - 没有流程，合法的请求很容易被遗漏或忽略。正式流程会大大降低这种情况发生的概率。\n- 重复——避免提交相同或非常相似的变更请求。\n- 优先级排序——使委员会或个人能够审查所有请求，并确定哪些请求应该分配最高优先级。\n\
  - 时间和成本估算——对每个请求进行时间和成本估算。没有这些信息，将很难计划工作，因为你不知道任何更改需要多长时间。\n- 对用户的影响——一旦实施，更改将如何影响用户？他们需要重新培训吗？它会使现有的工作或数据失效吗？用户需要新界面吗？\n\
  - 工作计划——如果每个人知道即将到来的更改，那么计划计划就可以更高效、更准确。\n\n如果你的组织已经有了提交请求的流程，那么它必须适用于所有请求。如果某些请求是在流程之外处理的，将抵消拥有正式流程的大多数优点。不允许在流程之外进行变更的两个额外原因是：\n\
  \n- 变更会有从小变大的趋势。\n- 如果你允许一个例外，那么那个人就会期望下一次变更（以及后续）也是例外。\n\n## 20.5.2 批准变更请求\n\n\
  并不是每个请求的更改都值得实施。例如，一个用户可能希望对应用程序进行更改，但其他人并不希望。或者另一个请求的更改可能太贵了，在财务上没有意义。为了过滤掉不应该做的更改，需要有人审查所有请求，并决定哪些将应用于应用程序，哪些不。\n\
  \n你的组织中是否有授权的人在工作之前批准请求？每个组织都有自己的做法，但该职位的可能性包括：\n\n- 应用程序所有者\n- 高级用户代表\n- 高应用程序管理\n\
  - 由上述小组组成的委员会\n\n## 20.5.3 测试变更\n\n对应用程序进行的每项更改都有导致问题的可能。可能出现的结果可能包括：\n\n- 更改符合预期\n\
  - 更改不符合预期\n- 更改符合预期，但引起了其他不想要的问题\n- 更改不符合预期且引起了其他不想要的问题\n\n\n\n\n\n为了避免产生意想不到且不希望的副作用，所有更改都应先安装在测试或\
  \ QA 系统上。在安装到非生产环境后，需要进行彻底测试。测试应由熟悉该应用程序的人进行。高熟悉程度将使测试人员能够更容易识别出由所做更改引起的负面问题。第 7\
  \ 章 详细说明了每当进行更改时都必须进行测试的原因。\n\n## 20.6 用户偏好\n\n第三方软件开发者通常非常清楚，他们希望自己的产品能够在多个国家使用。为了让他们的应用程序更容易被广泛用户接受，他们允许根据每个用户的偏好修改应用程序的某些特性。可以设置的特性示例包括：\n\
  \n- `语言`\n- `日期和时间格式`\n- `货币格式`，例如，使用逗号或句号来指定小数点\n- 数值的显示方式，例如，使用负号或括括号包含\n- `字体`和字体大小\n\
  - `语言`，包括语言内部的差异，如`英式英语`与`美式英语`\n- `背景`（又称壁纸），显示在应用程序之后\n- `动画`的启用与禁用\n- 是否`显示工具提示`\n\
  - `音效`的启用与禁用\n- `初始选择`\n\n应用程序是否允许识别或选择默认设置？如果是，`管理员`或`业务所有者`应该选择对大多数用户群有益的设置。不喜欢默认设置的用户可以将其偏好更改为他们自己的个人偏好。\n\
  \n### 20.6.1 语言支持\n\n支持多种语言并不像在安装应用程序时点击“是”那么简单。你需要知道需要哪些语言，以及供应商的支持程度。如果你不知道以下问题的答案，那么在尝试设置应用程序以支持多种语言之前，你需要开始一些研究：\n\
  \n- 社区需要多少种语言？\n- 用户群体中最常见的 2、3 或 5 种语言是什么？\n- 你的帮助台是否有具备多语言能力的员工？\n- 应用程序是否支持多种语言？\n\
  - 供应商目前提供多少种语言？\n- 供应商是否正在开发额外的语言？\n- 多语言功能是否收费？\n- 你的组织是否可能添加供应商的语言？如何操作？工作量有多大？成本是多少？\n\
  \n#### 20.6.1.1 语言变体\n\n你是否知道需要支持哪些特定语言的变体？应用程序是否能够支持语言变体？例如，可以识别以下语言的不同变体：\n\n\
  - `英语：英国`对`美国`\n- `法语：法国`对`魁北克`\n- `西班牙语：西班牙`对`墨西哥`或其他其他拉丁美洲国家\n\n#### 20.6.1.2\
  \ 哪些对象具备语言能力\n\n对于企业级应用程序来说，支持多种语言已成为常态而非例外。如果你的组织是跨国公司，或者可能会发展成这种状况，那么支持一种以上的语言可能是强制性的，而不是可选的。应用程序中的哪些对象可以用多种语言显示？例如，以下对象的文本可以以每个用户偏好的语言显示吗？\n\
  \n- `屏幕页眉`\n- `背景文本`\n- `按钮上的文本`\n- `菜单项和子菜单项上的文本`\n- `帮助页面`\n- `提示符中的文本`\n- `错误消息中的文本`\n\
  - `工具提示中的文本`\n- `标签上的文本`\n- `链接中的文本`\n\n#### 20.6.1.3 语言支持的其他方面\n\n支持多种语言时，有某些方面并非显而易见。为了真正支持多种语言，应用程序不能仅仅具有以另一种语言显示单词的能力。你的应用程序是否支持以下语言/文化特性？如果是，你是否知道如何设置它们或开启它们？\n\
  \n- 重量和度量\n- 打印机和复印机可用的纸张尺寸\n- 书写方向是从左到右还是从右到左，从上到下还是从下到上\n- `电话号码格式`\n- 各国使用的`邮政编码`\n\
  - 不同的字母，例如`阿拉伯语`、`中文`、`西里尔字母`、`日语`、`拉丁语`、`希腊语`、`希伯来语`等\n- 不同的数字系统\n- 不同的历法，例如`格列略历`、`回历`、`中国历`、`希伯来历`等\n\
  - 用于引号的字符\n\nUnicode 多语言支持不仅限于屏幕上的显示。如果用户以英语以外的字符集输入值，数据库系统必须能够存储用户输入的内容。一种处理多种字符集的标准被称为`Unicode`。如果你的应用程序将接受多种语言的输入，那么支持该应用程序的数据库引擎可能需要配置为将文本数据存储为`Unicode`。你需要与你的`DBA`\
  \ 协作，确保数据库可以使用`Unicode`并按照供应商指定的方式进行设置。\n\n### 20.6.2 自定义角色\n\n如第 15 章第 15.1.5 节所示，如果定义一组常用角色并将每个用户分配给其中一个，管理用户会更容易。例如，你的应用程序可能有类似于此处列出的这些角色：\n\
  \n- `只读`\n- `编写者`\n- `审批者`\n- `审计员`\n- `管理员`\n\n一旦定义了角色，你就需要确定每个角色应该能够看到和使用应用程序的哪些部分。例如，只能读取应用程序中记录的用户不应该看到标记为“编辑”、“保存”、“更改”或“删除”的按钮。如果某个角色无法执行这些功能，那么让他们看到这些按钮就没有意义。某些应用程序可能会显示未激活的按钮，但这些按钮是禁用的，以便用户无法执行。列出了每个角色可能不同的对象示例：\n\
  \n- `菜单项`\n- `子菜单项`\n- `面板`\n- `选择列表`（又称下拉列表框）\n- `图像`\n- `按钮`\n- `链接`\n- `文本字段`\n\
  - `单选按钮`\n\n## 20.7 培训\n\n你不能指用户能直观地理解如何使用应用程序。为了让用户正确且高效地使用应用程序，他们需要培训。培训听起来像是浪费时间和金的开销，但有效的培训将带来更少的错误、更少的重复、更高效以及更满意的用户。这是一项值得的投资。\n\
  \n### 20.7.1 培训类型\n\n用户（特别是新用户）将接受什么类型的培训？新用户在获得登录凭据之前是否必须完成并通过培训课程？以下哪些是提供的？\n\n\
  - `课堂培训`——由讲师引导的培训，可能在教室环境中进行。\n- `在线培训`——通过`LMS`（学习管理系统）提供，通常通过用户工作站上的浏览器访问。\n\
  - `在职培训`——可能由经验丰富的同事提供。\n- `持续培训`——用户获得定期的，例如每年的复习课程。\n\n作为`应用程序管理员`，你是否参与了培训过程？如果可能，你应该参加给用户社区的培训。特别是当你对该应用程序不熟悉时。这种建议的一些原因包括：\n\
  \n- 你可以从用户的角度查看应用程序\n- 你可以从用户提出的问题中学习\n- 你可能会改进培训的某些领域\n\n\n\n\n\n• 你最终将不得不处理应用程序上的各种问题，因此了解用户接受过哪些培训将很有帮助。\n\
  \n### 20.7.2 谁来培训培训师\n\n如果你计划进行教室培训，那么由谁来主持课程呢？也许最好的方案是请由应用程序供应商提供或由其认证的培训师。具有此类背景的培训师可能在应用程序使用和培训师角色方面都非常有经验。这种选择的缺点是，它几乎可以肯定是最昂贵的选项之一。\n\
  \n如果预算不允许你聘请外部培训师，可以考虑一些替代方案：\n\n• 贵组织内部的培训部门\n• 经验丰富的用户\n• 一个 `Application Administrator`（应用程序管理员）\n\
  \n如果你计划使用内部人员进行培训，你应该考虑派他或她去参加供应商提供的培训课程。如果该培训师对应用程序有经验，并且擅长在群体面前演讲，这将是一个非常有效的选择。\n\
  \n### 20.7.3 为用户创建“快速查表”（Cheat Sheet）\n\n为用户创建一份快速查表，其中包含他们使用应用程序所需的各种信息，这是一个非常好的主意。如果供应商未提供，可以由培训师、经验丰富的用户或\
  \ `Application Administrator` 来完成。开发此内容的投入相对较小，从长远来看绝对会有回报。用户对应用程序越了解，他们犯的错误就越少，你接电话也越少。请包含以下项目。确保保持此文档更新并定期重新发布给用户。如果可以将此快速查表添加到应用程序的帮助屏幕中，将非常值得：\n\
  \n• 连接到应用程序所需的 `URL(s)`。\n• 计划维护时间，例如，应用程序在标准时间周日晚上 10 点到午夜之间无法使用。\n• 发生问题时联系谁。\n\
  • 报告问题时应准备好提供的信息。\n• 使用应用程序的要求，例如桌面的操作系统、支持的 Internet 浏览器、需要加载到工作站的插件等。\n• 他们可能遇到的常见问题以及如何纠正。\n\
  • 如果账户被锁定或忘记密码，联系谁。\n• 从远程位置通过 `VPN`（虚拟专用网络）连接到组织网络的说明。\n• 应用程序任何与用户相关的文档位置，例如在共享驱动器或门户上。\n\
  • 知识库的位置，该库列出了其他用户遇到过的问题及其解决方案。理想情况下，所有用户在遇到问题后都应该搜索知识库，看看是否有列出的解决方案。这具有减少大量向你或帮助台发起请求的潜力。\n\
  \n### 20.7.4 技术助力培训\n\n可以利用技术为你的培训工具库提供一些有价值的补充。如果你的组织中没有其他人可以提供此类培训辅助工具，那么这些任务可能会落在你的肩上，但结果可能会是值得值的。技术可以增强培训的一些示例如下：\n\
  \n• 为用户经常遇到问题的常见任务创建视频培训课程。将这些发布在所有用户都可以访问的地方，例如网络驱动器或网站。\n• `wiki`（维基）是一个任何人都可以网络浏览器添加或修改的网站。创建一个以你的应用程序为中心的\
  \ `wiki`。在其中填充用户遇到过的常见问题。鼓励用户添加他们的建议、快捷方式和想法进行补充。如果你的用户群体对其做出贡献，这可能会成为一个非常有价值的参考。\n\
  • 收集用户提交给你或帮助台的所有 `FAQs`（常见问题）。将这些问题和答案发布在所有用户都可以访问的网站或门户上。\n• 使用 `Webex`、`LiveMeeting`\
  \ 或屏幕共享会议进行培训和调查用户问题。这类工具在与远程位置的用户合作时特别有价值。如果可能，记录这些会议并将最有信息的部分发布在所有用户都可以访问的网站或门户上。\n\
  • 如果可能，在应用程序的初始屏幕上包含指向录制培训课程库、`wiki` 或 `FAQ` 的链接。这将方便用户访问这些工具。\n\n## 20.8 工作流过程\n\
  \n应用程序可以包含称为工作流处理的功能。其中一个示例是，应用程序自动帮助用户，将工作流程从一个人推进给下一个需要处理该问题的人。例如，`Change Control`（变更控制）应用程序将在更改进入生产环境之前需要完成的每个审批步骤向相应的人员发送\
  \ `e-mail`（电子邮件）。这些步骤可能包括：\n\n• 业务所有对变更请求的批准\n• IT 对变更请求的批准\n• 开发完成\n• 业务所有对 `UAT`（验收测试）的批准\n\
  • 更改已安装在 `QA` 系统上\n• 业务所有在 `UAT` 上验证更改\n• 切换到上线\n• 业务所有在 `UAT` 上验证更改\n\n如果你支持的应用程序包含任何工作流过程，那么你需要问以下问题：\n\
  \n• 存在多少个工作流过程？\n• 工作流过程是否已设置？\n• 每个用户组在工作流过程中承担什么角色？\n• 工作流过程有多容易被更改？\n• 如果更改了工作流过程（例如添加了新步骤），对已经在流程中的任务会有什么影响？\n\
  • 所有用户是否理解自己在工作流过程中的部分（职责）？\n• 从头开始创建一个工作流有多困难？\n\n## 20.9 远程访问应用程序\n\n你的应用程序用户是否有人在远程位置工作，即他们没有连接到组织的网络？例如，某些用户在家里、远程办公室、酒店房间或客户现场工作？如果是这样，你需要调查以下可能性：\n\
  \n• 应用程序是否明确支持远程访问？某些应用程序是专门为经常出差的用户设计的。例如，销售人员在访问潜在客户现场时使用的应用程序。\n• 应用程序是否存在防止远程办公的特殊情况？\n\
  • 应用程序中是否有特定功能在远程访问时无法执行？例如，是否某些管理任务在用户连接到组织网络时才可用？\n• 用户远程访问应用程序时性能受什么影响？如果有影响，应该提前警告用户。通过提前告知，你可能会避免他们在远程登录时出现对性能下降的惊讶和投诉。\n\
  \n### 20.9.1 远程办公\n\n你是否知道目前有多少应用程序用户远程访问（即远程办公）应用程序，或在近期计划远程办公？如果这个人数将增加，这是否需要对应用程序架构的以下部分进行任何更改？\n\
  \n• 应用程序\n• 网络\n• 应用程序服务器\n• 使用的 `VPN`（虚拟专用网络）设置\n\n为了获得问题的答案，你可能需要与组织的网络管理员或供应商的支持小组协作。\n\
  \n\n\n\n\n从第三方供应商处获得软件的应用程序管理员和组织与供应商之间存在着长期关系。本章描述了各种许可模型，如单用户许可、服务器许可、每处理器许可、并发用户许可和按席许可。供应商对他们的软件提供哪些支持？此外还描述了供应商支持的替代方案。\n\
  \n### 关键词\n\n供应商；关系；软件许可；许可模型；许可限制；非生产环境；维护费用；维护合同；故障修复与功能增强；技术支持；支持服务台；支持级别；更新；补丁；培训；供应商支持的替代方案；知识传递。\n\
  \n当你支持一个第三方应用程序时，供应商将是你职业生活中贯常的存在。你会相当定期地与他们进行交流。如果你不是在就某个遇到的问题进行邮件沟通，就是在与他们合作完成某项需要执行的升级。如果你足够幸运，你与供应商及其员工的关系将是友好且专业的，这会让你的工作变得显著轻松得多。\n\
  \n如果你支持的是一个内部开发的应用程序，那么本章的大部分内容将不适用于你。在某些方面，与内部开发小组合作比与外部供应商合作更困难。其原因之一包括：\n\n-\
  \ 内部小组的人力几乎肯定没有供应商那么充足。\n- 他们可能没有 `Help Desk`（帮助服务台）。\n- 他们的支持结构不会那么正式。\n- 他们可能没有供应商那样的客户服务意识。\n\
  - 如果提供培训的话，其可用性非常有限。\n- 对于内部小组来说，高质量的文档往往是低优先级。\n\n## 21.1 软件许可\n\n这对于任何人来说可能并不意外，但你实际上并没有购买计算机软件。你并不是像大多数其他产品那样直接买下它，你做的是支付在某些限制条件下使用该软件的权利。如果你不相信我的话，只需阅读安装某些软件时弹出的屏幕之一即可。它非常清楚地说明你并不拥有它，你本质上是在“租赁”该应用程序。\n\
  \n如果你支持的应用程序已经获得许可并安装，那么更改与供应商的合同已经为时晚了，但你应该在未来获取应用程序时了解许可协议的基础知识。\n\n某些应用程序被设计并作为模块集合进行市场营销。例如，你的组织可能需要一个包含\
  \ `Accounts Receivable`（应收账款）和 `Accounts Payable`（应付账款）逻辑的应用程序，但不需要 `Inventory Control`（库存控制）。供应商的应用程序是否允许客户自行选择他们需要的模块？他们的许可成本可能是固定价格，也基于你所利用的模块数量。\n\
  \n### 21.1.1 许可模型类型\n\n有几种描述软件如何获得许可的许可模型类型。接下来的段落描述了最常见的模型。对你来说，最好的可能是查看供应商是否允许你结合使用多种许可模型。例如，你可能需要服务器的每处理器许可，以及工作站的\
  \ `CALs`（客户端访问许可）。在软件许可方面，不要害怕要求一些“菜单之外”的内容。发生的最坏情况就是他们说“不”：\n\n- 个人或单用户许可（Individual\
  \ or Single-User License）——允许将软件安装在单台计算机上，并仅供登录到该计算机的单一用户使用。该程序无法被网络上的任何其他用户或计算机访问。此类许可不适用于企业级应用程序，因此它可能不是你可选的许可方案之一。\n\
  - 服务器许可（Server License）——允许将软件安装在特定服务器上的许可。多个用户可以访问该服务器以使用该应用程序。\n- 每处理器许可（Per-Processor\
  \ Licensing）——软件加载到的服务器中存在的每个处理器都需要许可。如果你的服务器有四个处理器，则需要购买四个许可，每个处理器一个。\n- 每核心许可（Per\
  \ Core Licensing）——软件加载到的服务器中处理器的每个核心都需要许可。例如，如果你的服务器有 4 个处理器，且每个处理器有 4 个核心，则总共需要购买\
  \ 16 个许可。\n- 并发用户许可（Concurrent User License）——此类许可允许指定数量的用户访问应用程序。例如，你可以购买允许 25\
  \ 个用户访问应用程序的许可。如果有 25 个用户登录而第 26 个用户尝试登录，他将收到错误消息，说明当前应用程序中的用户人数已满，请稍试。\n- 按席许可（Per\
  \ Seat）——此类许可仅允许具名个人登录应用程序。如果你的许可是针对 50 个具名个人的，那么不在列表中的用户永远无法使用该应用程序，无论那 50 个人是否在应用程序中。\n\
  - 客户端访问许可 (CAL)——在用户可以合法访问应用程序软件之前，需要在客户端（即用户、工作站）上安装许可。如果你预计会有 100 个用户访问该应用程序，那么你将需要购买\
  \ 100 个 `CALs`。并不是所有供应商都在其许可模型中使用 `CALs`，但你应该了解这一概念。\n\n确保你理解你的许可是允许 25 个用户在应用程序注册，还是允许\
  \ 25 个用户同时访问应用程序。这里的区别至关重要。例如，你可能有 100 名员工登录应用程序，但限制任何时候只有 25 人登录。这与仅有 25 名员工注册完全不同。\n\
  \n如果你的许可对注册用户数量有限制，那么在签署合同时，应该确定更多细节。你应该询问的一些潜在问题包括：\n\n- 被禁用的用户是否仍算作“已注册”用户？你可能有充分的理由禁用某个用户，并预计他们稍后会启用。例如，休产假或休假的员工可能几个月内不使用应用程序。\n\
  - 可以增加最大用户数吗？供应商在这个问题上是否灵活，还是需要大量的行政程序和提前期？\n- 你可以临时增加这个数量吗？例如，如果应用程序是 `LMS`（学习管理系统），而你有一批新员工入职。他们可能需要密集的培训。是否可以在两周内增加用户限制然后恢复到较低的许可数量？\n\
  \n### 21.1.2 许可有效期\n\n软件许可的一个稍微不同角度是许可有效期。主要的选项有：\n\n- 永久许可（Perpetual licenses）——一旦购买，此类许可允许你无限运行和使用该软件。\n\
  - 年度许可（Annual licenses）——许可有效期为一年。如果你想在明年继续使用该应用程序，你需要续约许可。大多数属于 `SaaS`（软件服务）类别的软件都采用年度许可。\n\
  \n年度许可看起来更便宜，但它必须每年续约。如果你计划在未来许多年内使用此应用程序，那么如果有该选项，永久许可可能是更好的选择。\n\n### 21.1.3 许可限制\n\
  \n软件许可带有许多限制或约束。你需要检查你的合同以确定你的许可具体具有哪些限制。一些常见的限制包括：\n\n- 软件只能在许可协议中指定的服务器上运行。\n\n\
  \n\n\n\n-   可以访问应用程序的用户数受合同中规定的限制。\n-   同时访问应用程序的用户数可能会有限制。\n-   升级您的硬件（例如安装更快的服务器、额外的处理器或额外的核心）可能会违反您的许可协议。如果您这样做，请做好被收取增加的许可费的准备。\n\
  -   不允许进行反向工程，即试图弄清楚供应商软件的工作原理，以便您自己编写类似的应用程序。\n-   您不被发布任何基准测试（又称性能测试）的结果。某些供应商对于发布任何可能被认为对其产品有负面评价的内容非常敏感。\n\
  \n### 21.1.4 选择最适合您的模型\n\n您的供应商提供哪些许可模式？如果供应商提供多种许可选项，您需要决定哪种替代模型最适合您的组织。为了做出这一决定，您需要对自己的环境和用户群有详细的了解。例如，您应该知道：\n\
  \n-   将注册以访问应用程序的员工人数。\n-   最大并发用户数。\n-   这种最大使用发生的频率如何（例如，是否在月底或年底）？\n-   运行应用程序的服务器中的处理器和核心数量。\n\
  \n### 21.1.5 多份许可\n\n如果您的组织与同一供应商有多个份许可合同，您可能可以将此转化为您的优势。中小型软件供应商经常被大型组织收购。导致的结果是，越来越少的供应商拥有越来越多软件产品的许可。您的组织可能正从单一供应商处获得多项产品的的许可，而这些产品在不久前还来自多个供应商。这种情况是否可以通过谈判获得更好的许可安排？\n\
  \n通过多份许可，您可能符合某些类型的批量折扣的条件。即使折扣没有公开，要求一个也无无处。大批量客户可能要求获得什么种类的让步？\n\n-   折扣后的许可费\n\
  -   折扣后的支持费\n-   将多个许可合并为单一许可，以获得更低的总成本\n-   升级您的支持协议（例如，从标准支持升级为高级别支持）\n\n您的组织是否有一个部门（例如，采购部）记录了每份现行的软件合同？如果没有一份包含所有合同和供应商的列表，您将永远不知道是否存在批量折扣的可能。\n\
  \n### 21.1.6 非生产环境\n\n您组织的生产环境并不是加载应用程序软件的唯一环境。其他可能需要的环境包括：\n\n-   开发环境 (Development)\n\
  -   测试环境 (Test)\n-   质量保证环境 (QA—Quality Assurance)\n-   灾难恢复环境 (DR—Disaster Recovery)\n\
  \n您需要检查合同或与供应商交流，以获得关于非生产环境问题的答案。您最不希望的是建立了一个环境，然后在供应商发现其存在时被处以罚款或提高许可成本。最好是提前了解与非生产环境相关的成本和限制，这样这些知识就可以纳入您的决策过程中：\n\
  \n-   您的许可允许这些额外环境的 string 吗？\n-   拥有额外的非生产环境是否有任何额外费用？\n-   对非生产环境中可以存在的数据量是否有限制？\n\
  -   对连接到非生产环境的用户数量是否有限制？\n-   如果在非生产环境中遇到问题，供应商会提供支持吗？\n-   如果 DR 环境是生产环境的紧密复制，它是否可以随时运行，还是仅限于定期测试以确保其运行正常？\n\
  \n根据我的经验，供应商意识到客户需要 `DEV`、`QA` 和 `DR` 环境，并且不会对它们施加不合理的限制。希望您合作的供应商在这一问题上同样能够理解。\n\
  \n### 21.1.7 维护费\n\n我的经验是，供应商意识到客户需要 `DEV`、`QA` 和 `DR` 环境，并且不会对它们施加不合理的限制。希望您合作的供应商在这一问题上同样能够理解。\n\
  \n大多数供应商收取年度维护费，通常为软件费的百分比。通过此费用您可以获得补丁、更新和文档。维护合同和费用因供应商而异，但 20% 左右很常见。如果软件许可支付了\
  \ `1,000,000`，那么每年需要支付 `200,000`。如果您不支付，将会被切断支持。\n\n如果您认为通过不购买维护合同可以省钱，请注意警告。许多供应商已经考虑到了这一点。他们会收取重新许可的费用。这笔费用可能会超过您因不购买维护合同而节省的费用。在停止支持之前，请确保您知道回来需要花费多少。\n\
  \n### 21.1.8 版本\n\n大多数应用程序软件都会频繁修改。供应商出于许多目的发布新版本。其中一些原因包括：\n\n-   在应用程序中包含增强（即新功能）\n\
  -   提高性能\n-   修复用户报告的问题\n-   应对新法规或行业实践带来的变化\n-   支持新的硬件或软件（例如，新的浏览器或操作系统）\n-  \
  \ 应对潜在的安全问题\n\n了解供应商如何处理产品版本是有用的。例如：\n\n-   供应商多久发布一次应用程序的主版本？像版本 `5.0`、`6.0` 或\
  \ `7.0` 这样的主版本发布频率通常较低。主版本之间间隔一到两年并不常见。\n-   供应商多久发布一次应用程序的小版本？像 `6.1` 或 `6.2`这样的小版本发布频率通常比主版本频繁得多。对于供应商每年发布两次小版本并不常见。\n\
  -   小版本是累积的吗？版本 `6.3` 是否包含了 `6.1` 和 `6.2` 中的所有更改？从应用程序管理员的角度来看，累积版本的工作量更少。如果版本不是累积的，那么您需要在安装版本\
  \ `6.3` 之前安装 `6.1` 和 `6.2`。大多数是累积的，但请在合同中确认这一点。\n\n\n\n\n\n- 厂商支持产品的多少旧版本？如果应用程序当前版本为\
  \ `6.2` 版本，厂商是否允许客户继续运行 `5.x` 版本？是否允许客户运行 `4.x` 版本？某些客户非常乐意运行产品的 `4.x` 版本，因为它能满足他们的需求，而且他们认为没有升级的理由。另一方面，厂商需要支持的版本越多，他们付出的精力就越多。他们的\
  \ `Support Group` 现在必须熟悉更多版本。厂商对于支持产品多少个旧版本的决策，必须权衡客户的需求与厂商操作的易易程度之间的关系。\n\n- 客户是否被强制或被强烈鼓励升级到最新版本？这与前一点有关，因为涉及到旧版本。某些厂商在促使用户跟上最新版本方面比其他厂商要激进得多。例如，他们可能会采取以下步骤来鼓励客户安装最新版本：\n\
  \n    - 发布一个特定日期，在此之后旧版本将不再受到支持\n    - 不再对产品的旧版本提供新的安全更新\n    - 对支持产品的旧版本收取额外费用\n\
  \    - 针对旧版本的支持请求在他们的计划中获得最低优先级\n\n### 21.1.9 修复与 增强\n\n这里有一个关于应用程序管理员的冷笑话。\n\n\
  **问题：** 修复（fix）和增强（enhancement）有什么区别？\n\n**答案：** 大约 10,000 美元\n\n这个笑话很冷，但并非没有道理。如果你向厂商报告一个问题，他们会进行研究以确定这到底是一个问题，还是客户的操作错误。如果他们的研究确定这是一个漏洞，他们将自费进行修复。如果该问题不是关键的，那么可能需要几个月甚至几年时间，在产品的新版本中才会修复该修复。\n\
  \n另一方面，如果你请求的是对产品的更改，即增强功能，那么你可能需要为此付费。厂商将提供该增强功能的成本估算，并向你提交一份变更请求单、工单或类似命名的合同。如果你同意付款，他们将进行更改并将其提供给你。\n\
  \n关于请求增强，你还需要理解的另外一点是，该更改很可能会包含在产品的未来发布版本中。其他客户将免费获得它。不要指望他们感谢你，因为厂商往往不会将特定的更改归功于请求该功能的客户。\n\
  \n### 21.1.10 技术支持\n\n如果你希望获得拨打厂商 `support group` 并获得协助的权限，那么你需要一份技术支持协议。某些厂商会将技术支持包含在维护合同中，但并非所有厂商都是如此。你需要了解厂商是否将技术支持包含在维护费用中。\n\
  \n如果应用程序对于你组织的运营至关重要，在决定不购买技术支持许可之前，你需要深思熟虑。考虑这个问题的一种是：如果应用程序长时间宕机，你的组织将付出多少成本？\n\
  \n## 21.2 厂商提供什么支持？\n\n询问厂商提供什么服务是合理的。询问你付了钱得到了什么也是合理的。接下来的章节描述了支持的基本要素。\n\n###\
  \ 21.2.2 支持级别\n\n某些厂商提供多个级别的支持。对于愿意为额外支持付费的客户来说，这些支持是可用的。这些支持级别的常用术语有 `Standard`（标准级）和\
  \ `Premium`（高级），或 `Gold`（金色）、`Silver`（银色）和 `Bronze`（青铜）。\n\n高级别的支持能带给你什么？高级支持可能包括以下优势：\n\
  \n    - 支持每周 7 天可用，而非 5 天\n    - 支持每天 24 小时可用，而非 8、10 或 12 小时\n    - 厂商承诺在 30 分钟内响应，而非\
  \ `2 hours` 内\n    - 你的工单会自动路由给经验更丰富的技术人员\n    - 在最高支持级别下，你可能有一名专门负责你组织的技术人员\n \
  \   - 你组织的额外人员也在厂商的“联系人名单”中。通常，厂商允许有限的人员拨打其支持热线。高级支持合同允许你在名单上添加额外姓名。\n\n你的厂商是否提供不同级别的支持？如果是，每个支持级别的成本和优势分别是什么？有了这些信息，你可以就你组织需要且负担得起的支持级别做出明智的决策。\n\
  \n\n\n\n应用程序软件会定期更新。供应商会发送电子邮件通知应用程序管理员，有新的补丁或更新可用。邮件中可能包含一个 URL，你可以通过该链接访问可以获取新软件的网页。\n\
  \n一旦收到更新或补丁可用的通知，你应该下载并打印《发布说明》（Release Notes）和/或《升级指南》（Upgrade Guide）。审阅这些文档以确定以下内容：\n\
  \n- 更改是否适用于你的环境\n- 升级具体做了什么，特别是修复了哪些问题或提供了哪些增强\n- 该更改是否可用\n- 安装升级的步骤\n- 如果安装失败，如何回滚升级\n\
  \n掌握了这些升级信息后，你就可以很专业地向用户群建议是否应该进行升级。应用程序所有者（Application Owner）可能会对贵组织是否执行此项升级做出最终决定。\n\
  \n一旦做出决定，你需要制定一个项目计划，包含以下任务：\n\n- 你的环境（即开发环境、测试、QA 环境或生产环境）升级的顺序\n- 首次或下一个环境升级的预计日期\n\
  - 在升级环境之前备份服务器的步骤\n- 在升级环境之前备份数据库的步骤\n- 开发用于验证更新是否成功的 UAT（用户验收测试）\n- 谁负责升级过程中的每项任务\n\
  - 升级前用户与管理员之间的协调，确保用户在执行升级时不要使用应用程序\n- 验证应用程序数据是否受到升级的负面影响。如果升级未修改应用程序数据，则不需要此步骤\n\
  - 何时以及由谁执行 UAT\n- 由谁来签署确认升级成功\n- 对下一个要升级的环境重复上述步骤\n\n### 21.2.4 只需要 FAQ 即可\n\n你的供应商是否发布了关于该应用程序的常见问题（FAQs）列表？如果存在\
  \ FAQ 列表，在提交问题工单之前最好查看该列表，看看其他客户是否遇到过相同的问题。如果你的问题出现在 FAQ 中，在向供应商的支持台提交工单之前，你应该尝试推荐的解决方案。通过\
  \ FAQ 列表查找你的问题可以节省你和供应商的时间。\n\n### 21.2.5 培训\n\n供应商为其应用程序提供哪些培训？通常，供应商会提供针对用户和管理员的系列课程。课程通常以以下格式和地点提供：\n\
  \n- 现场\n- 在线\n- 供应商现场\n\n你还应该考虑的其他培训相关问题是：\n\n- 是否有独立的培训机构提供培训？这仅适用于最广泛使用的应用程序\n\
  - 该应用程序是否有任何认证？这同样仅适用于最广泛使用的应用程序\n- 供应商课程的先决条件是什么？你可能想在没有推荐先决条件的情况下“溜”进去，但如果你这样做，你可能无法准备好处理课程中涵盖的内容\n\
  - 你的组织中有多少人需要培训？\n- 派去培训的人能否回到办公室并有效地培训他的同事？这种方法显然要便宜廉得多，但并不是每个人都能胜任教他人。\n\n###\
  \ 21.2.6 知识库\n\n供应商是否提供可以搜索的知识库来回答有关其应用程序的问题？知识库类似于 FAQ 列表，但更详细且涵盖了更广泛的主题。如果供应商确实提供了知识库，客户必须拥有特定的支持级别合同，还是对所有客户开放？\n\
  \n### 21.2.7 文档\n\n该应用程序有哪些可用文档？供应商可能提供的文档示例包括：\n\n- 管理员指南（Administrator’s Guide）\n\
  - 安装指南（Installation Guide）\n- 升级指南（Upgrade Guide）\n- 用户指南（User’s Guide）\n- 高级用户指南（Advanced\
  \ User’s Guide）\n- 性能调优（Performance Tuning）\n- 用户或管理员可用的工具\n- 如果应用程序具有模块化组件，则每个特定组件可能都有一份文档\n\
  \n文档以什么格式提供？过去，客户会购买或有权获得一定数量的纸质文档。最近，文档可以在线提供，通常为 `PDF` 文件，客户可以根据需要自行下载并打印。\n\n\
  了解供应商更新文档的频率是有帮助的。你可能会预计在每进行一次重大升级时都会发布一个新版本。供应商可能会让你惊喜，在应用程序的每次小版本升级时都发布新版本。我接触过的一家供应商似乎每个月都会更改一次《管理员指南》。如果你正在与技术人员合作，而他所引用的文档页面似乎与你试图解决的问题毫无关系，这一点就会变得非常重要。\n\
  \n### 21.2.8 供应商现场技术人员\n\n如果你的组织规模很大且极度依赖该应用程序，那么你可能考虑通过合同让供应商的技术人员驻守现场。这是一项开销巨大的工程，是例外而非常态。对于较小的组织来说，由于成本原因，通过聘佣供应商技术人员将是非常寻常的。\n\
  \n与其让供应商人员永久入驻，更有可能的情况是他们为了特定任务临时留任。一些可能需要这种专业知识的项目示例包括：\n\n- 从零开始安装，特别是必须快速完成且不接受错误时\n\
  - 对应用程序进行重大升级\n- 从其他供应商的软件转换到此应用程序\n- 激活应用程序的一个重大新组件\n- 将应用程序推向规模较大的部门、小组或国家\n\n\
  ### 21.2.9 支持的其他选项\n\n\n\n是否有从供应商处获得支持的替代方案？总有选项，但你必须自己决定它们是否现实。如果你的薪资系统在发放支票的前一天崩溃，那将是一场危机。由于这一点，你并没有选择，必须拥有供应商支持。另一方面，如果该应用程序不被认为是关键的，且流程可以手动完成，那么可能在没有供应商支持的情况下生存。\n\
  \n#### 21.2.9.1 供应商的维护和支持值得吗？\n\n许多软件供应商从支持费用中获得的收入实际上比产品许可费用多。这并不奇怪。如果维护费大约占产品价格的\
  \ 20-22%，且安装基数很大，那么产生的收入将非常显著。\n\n现实是，供应商是从销售还是支持费用中获得大部分钱并不重要。你的组织必须决定该产品是否值得购买价格和持续支持费用。如果决定业务需求不值得供应商支持的成本，那么可能最初就不应该购买该产品。\n\
  \n#### 21.2.9.2 没有支持的情况\n\n\n\n\n\n放弃对该应用程序的支持是可能的，但也非常罕见。交付的应用程序是一个真正的“黑盒”，也就是说，你无法看到其内部。在无法访问底层设计或源代码的情况下，支持企业级应用程序几乎是不可能的。对于规模较小、重要性较低的应用程序，可以做到，但风险水平仍然很高。\n\
  \n## 21.2.9.3 供应商支持的替代方案\n\n供应商支持的一些替代方案。替代方案的简要列表包括：\n\n- 你是否可以雇佣以前在该供应商工作过的开发者或技术代表？这是一种可能，但如果供应商已经倒闭，这样做更为现实。如果供应商仍在运营并推销该应用程序，你可能在获得产品许可时已经签署了“禁止挖角”协议。如果你试图挖走他们的员工，如果供应商警告你或采取法律行动阻止这种行为，请不要感到意外。\n\
  \n- 是否有第三方为该应用程序提供支持？曾有员工离开供应商并成立公司，推销他们支持该应用程序的能力案例。他们可能承诺以供应商收费的一半价格提供顶级质量的支持。遗憾的是，这些公司中很多如果不是大多数，很快就会倒闭。在决定与他们开展业务时，你必须考虑该公司的长期生存能力。\n\
  \n- 你是否可以与咨询公司签订一份应急合同？这是可能的，但他们的支持有多好，人才储备又有多深？如果他们只有几名熟悉你需要支持的应用程序的技术人员，你愿意冒险吗？\n\
  \n## 21.2.9.4 与其他应用程序管理员建立联系\n\n与其他应用程序管理员建立联系是一件好事，但它不能替代供应商对应用程序的支持。它可能允许你购买较低级别的支持。例如，与其购买黄金级支持，你可能铜铜级即可，并希望与其他经验丰富的管理员的联系能帮助填补支持空白。\n\
  \n如果你计划与其他管理员建立联系，有一些建议：\n\n- 临渴不掘井。你需要在需要他们的帮助之前，先与其他应用程序管理员建立关系。如果你遇到危机并迫切需要帮助，那不是你第一次联系同伴的时候。这些关系需要随着时间的推移来培养。\n\
  \n-有所付出。如果你希望别人帮助你，那么你需要在他们需要时乐于帮助他们。如果你背上了“索取者”的名，那么当你陷入危机时，不要期待得到太多的帮助。\n\n##\
  \ 21.3 充分利用供应商联系\n\n在纯粹的资本主义体系中，每种产品都有大量的买卖双方。等式两边的巨大人数赋予了双方相对平等的权力。如果你不喜欢当地杂货店的番茄，可以开车一英里去另一家店购买。如果某家电影院粘粘的地板让你感到恶心，你可以开几英里去另一家多厅影院看同样的电影。\n\
  \n遗憾的是，如果你是一家财富 500 强公司并需要一个人力资源应用程序，情况并非如此。在涉及企业级软件供应商时，你的选择要少得多。鉴于此，你需要与供应商保持良好的工作关系。这意味着要尽可能利用你与供应商组织之间的联系。例如，不要仅仅因为老话说“客户永远是对的”就表现得粗鲁。你可能是对的，但如果供应商没有人回你的电话，你只是在伤害自己。\n\
  \n### 21.3.1 谁拥有供应商关系？\n\n在每个客户组织中，都有一组“拥有”与供应商的关系。我指的是与供应商接触最多的那个小组。当发生变化、或者有新功能可用等时，供应商联系的组或个人。这个小组可以是业务小组，也可以是技术小组。这两种方法没有对错之分，但你需要了解你的组织是如何处理这一关键关系的。\n\
  \n### 21.3.2 知识传递\n\n每当你或你组织中的任何人与供应商的技术联系人员合作时，脑中应始终记住两个目标：\n\n1. 解决正在处理的问题或故障\n\
  2. 尽可能学习关于应用程序的知识，即知识传递\n\n你始终需要确保你和组织中的其他人从供应商联系人那里尽可能地获取关于应用程序的知识。通过这样做，你的组织最终能够减少对供应商支持小组的依赖，更多地依靠你们人员积累的技能和知识。另一种是你总是被迫依赖供应商员工来帮助你处理一切。\n\
  \n### 21.3.3 掌握主导权\n\n我发现增加知识传递量的一种方法是当我与供应商技术人员共享屏幕会话时始终由我来“驾驶”，即始终保留鼠标和键盘的控制权。我认为这有助于我学习更多关于应用程序的原因是：\n\
  \n- 我通过实践来学得更好。并非所有人都能通过这种方式最好学习，但对我来说效果最好，所以我确保尽可能由我来驾驶。\n\n- 当我点击鼠标并在键盘上输入值时，我是在控制活动的速度。如果我允许供应商技术人员驾驶，他或她不可避免地移动得太快，快至于我无法跟上正在操作的内容。\n\
  \n- 如果由我在驾驶，我可以停下来捕捉操作的截图，并将其粘贴到文件中记录该过程。稍后我会查看该文档并添加细节。下次我执行此过程时，我就有了参考文档并可以验证其准确性。\n\
  \n### 21.3.4 充分利用供应商技术上门访问\n\n如果你足够幸运有机会让供应商的技术代表访问你的公司，那么你想要尽一切努力来充分利用这次机会。最大化收获的某些方法是：\n\
  \n- 通知所有接触该应用程序的人有关即将到来的访问。参加的人越多越好。\n\n- 为访问期间将涵盖的内容制定议程。提前将议程发给每位参与者。\n\n- 确保在议程中安排了问答环节。鼓励你团队的每个人带上他们想向技术代表提的问题清单。运气的话，这些问题将引导供应商技术人员向你及其他员工进一步传递知识。\n\
  \n- 如果预算允许，就叫午餐而不是出去吃。利用这段时间进行问答或非正式讨论。\n\n### 21.3.5 用户会议\n\n供应商是否为他们的产品安排年度用户会议？如果是，你应该尽一切努力参加，至少一次。你的老板可能会对开销感到退缩（这些活动从不便宜，大都市的酒店房间也同样如此），你的同事可能会嘲笑你去浪费经费（boondoggle），但你需要为自己的去提供合理的理由。参加用户会议的许多优势包括：\n\
  \n- 供应商高管的主旨演讲经常概述了供应商和应用程序的长期目标和方向。\n\n- 供应商经常在会议前的一、两天提供培训课程。如果你想参加一些培训，这是一个一票双两鸟的机会。\n\
  \n\n\n\n\n-   同行提交的论文可能极具价值。有时，他们已经想出了非常巧妙的方法来完成你正尝试实现的目标。\n-   与供应商支持人员和其他应用程序管理员（Application\
  \ Administrators）建立人脉可能是无价的。请准备好与许多技术同行交流并交换名片或电子邮件地址。\n\n参加用户会议费用的一种方法是提交论文。许多会议会为被选在分会上演示论文的人免除入场费。在年度会议前\
  \ 9 到 12 个月检查供应商网站，查看何时接受提交。然后，撰写一份提案，描述你在应用程序上做过的某些特殊操作，或者你编写的让工作变得更容易的工具或脚本，并期待最好的结果。当然，在提交提案之前，你可能希望获得老板的批准。\n\
  \n### 21.3.6 批准的供应商联系列表\n\n大多数供应商对你组织中联系其帮助热线并寻求协助的人数有限。如果你的名字不在官方联系名单上，他们就不会回答你的问题。实施这些限制的一些合法理由包括：\n\
  \n-   通过小组成来引导你组织的请求，以确保所有联系都是必要的。供应商希望避免用户因一些经验丰富的用户或应用程序管理员可以轻松解决的问题而给他们打电话。\n\
  -   避免与他人已经提交的请求重复。\n-   确保联系人在收到技术性回复时能够理解其内容。\n-   确保联系人拥有知识和权限来实施供应商建议的纠正步骤。\n\
  -   出于利润动机。某些供应商允许在增加支持费用的情况下增加额外的联系人。\n\n关于供应商联系列表，你应该了解答案的细节包括：\n\n-   你的组织允许有多少个供应商联系人？\n\
  -   你是其中之一吗？\n-   名单上的联系人是谁？\n-   你如何删除旧的联系人并添加新的联系人？如果现有的联系人之一离开组织或转到与此应用程序无关的，这将变得至关重要。\n\
  -   由于更新联系列表的过程可能需要供应商花费才能完成，因此一旦知道有人需要从联系列表中删除或添加，你就立即启动更改。\n\n你还应该知道供应商会出于各种原因联系你组织内的谁。例如，针对以下主题将联系谁？\n\
  \n-   账单——供应商将向谁发送发票？如果此联系人不准确，你将面临账单无法按时支付的风险。如果发生这种情况，可能会产生罚金，或者你的支持被挂起。这两种都不好。\n\
  -   更新——如果有了更新或补丁，将通知谁？\n-   技术问题——如果供应商需要了解关于你组织环境（例如，你的服务器）的信息，他们将联系谁？\n\n###\
  \ 21.3.7 从供应商支持热线寻求帮助\n\n没有人期望你理解你所支持的应用程序的一切。你会遇到供应商的一级和二级支持无法回答的问题。当你遇到不熟悉的问题或疑问时，联系供应商的支持台（Support\
  \ Desk）并不可耻。毕竟，这正是你组织支付支持费用的原因。\n\n### 21.3.8 如何联系他们\n\n每个供应商的客户支持方法略有不同。最好在危机发生之前就了解联系他们最有效的方法。下面描述了供应商获取新来电详情的三种常见方式。你应该提前了解你的供应商提供哪种方式，以及哪种对你最有效：\n\
  \n-   拨打免费电话\n-   必须在他们的网站上提交请求\n-   请求必须发送到支持台的电子邮件地址\n\n你还应该知道答案的其他问题还包括：\n\n\
  -   他们的开放日期和时间是什么时候？\n-   他们会在节假日上班吗？\n-   如果你在半夜发生停机怎么办？\n-   他们在其他时区是否有服务台？如果是，你如何联系他们？还是拨打中心号码，由它将你连接到当前有人值的服务台？\n\
  \n## 21.4 与供应商的挑战\n\n与任何关系一样，你与供应商之间的关系不会一帆风顺。会有事情变得紧张的时候。接下来的章节描述了一些可能会复杂关系的情况。\n\
  \n### 21.4.1 离岸供应商\n\n为了降低成本或让支持人员更靠近开发人员，某些供应商已将其支持人员移至海外。如果你的供应商这样做了，请准备好应对一些额外复杂的情况，但这并不一定意味着事情会变得很糟糕。\n\
  \n与离岸供应商或支持人员合作可能会引入以下问题：\n\n-   语言差异可能是处理海外支持人员时最大的复杂因素。无论技术人员受教育程度有多高、培训多充分或意图有多好，如果他们的母语与你不同，口头沟通将更加困难。我能提供的最好建议是保持你的耐心和幽默感。\n\
  -   时差可能会让你更难在长时间、连续的时间内处理某个问题。我必须承认，我合作过的大多数离岸技术人员都是为了适应客户而工作所需的时间。\n-   文化差异也会让合作变得稍微有些困难。与来自另一种文化的人一起工作对我来说似乎总是有些生硬。我们都不想做任何冒犯对方的事，所以在说话时总是谨小慎微。\n\
  -   海外连接可能意味着屏幕会较慢，且电话连接不清晰。结合语言差异，这使得通过电话解决问题变得极具挑战性。\n\n### 21.4.2 伴随式服务\n\n大型或在全球范围内拥有客户的供应商可能在各地战略性地部署了多个支持台。这通常被称为“日随式”支持。如果你的供应商是这样，你可能会获得比平均水平更好的支持。这种支持对客户的一些优点包括：\n\
  \n-   随时提供支持\n-   客户拨打一个 800 号，即可连接到当前有人值守的支持台。\n-   如果处理问题的技术人员要下班了，问题可以交给另一位技术人员继续处理。虽然这在概念上很棒，但有时站点之间的信息交接并不是无缝的。当这种情况发生时，当你发现自己自己在证明之前的技术人员已经问过的细节或背景信息时，你会感到沮丧。\n\
  \n在与支持台交流时，我最后的建议是保持冷静、保持耐心，不要在通话时生气。听我的没错，这没有帮助！供应商的支持台团队和你想要的一样，即：尽可能快速、高效地解决你的问题。\n\
  \n## 21.5 最坏的情况\n\n不幸的是，有时会发生最糟糕的结果，你可能就是经历这种情况的人。接下来的章节描述了与供应商打交道的一些最坏情况示例。\n\n\
  ### 21.5.1 供应商被收购\n\n\n\n\n\n你可能会遇到的一种不理想的情况是你的供应商被另一家公司收购。更糟糕的是，收购方供应商可能并不打算长期支持该应用程序。这可能是因为他们认为该应用程序是不可行的，或者他们有自己的产品线，希望将其客户群迁移到自家的产品上。这种情况唯一的好的一面是，收购供应商可能会继续支持它至少很短一段时间。你需要明智地利用这段时间来规划你的行动方案。\n\
  \n如果发生这种情况，你的替代方案有哪些？\n\n• 放弃他们的支持，并让应用程序按现状运行。这在法律上可能可行，也可能不可。你需要审查与原始供应商签订的合同。\n\
  \n• 开始计划用其他供应商的产品替换应用程序。参见第 21.5.3 节列出的步骤。\n\n• 迁移到供应商的其他产品。如果这是你的选择，收购供应商将为你提供所需的支持，将数据从旧应用程序迁移到他们的新产品。\n\
  \n### 21.5.2 供应商停止支持应用程序\n\n有时，供应商直接决定放弃其产品之一。这可能是因为该产品的利润没有预期中那么丰厚。也可能是他们没有看到它从长期来看能够盈利。无论何种情况，你可能都必须迁移该应用程序。\n\
  \n你可能会面临一个并没有正式宣布应用程序结束的供应商，但他们只是停止了支持。这可能意味着他们停止了发布更新和补丁。不再有新功能推出。年度用户会议将“暂停”。他们还可能大幅削减支持台（Support\
  \ Desk）的人员。如果你处于这种情况下，那么你需要开始替换应用程序的步骤。\n\n### 21.5.3 供应商破闭\n\n如果你的供应商破闭了而你又依赖他们的应用程序，那么你就麻烦了。不幸的是，这别无选择。如果你非常幸运，该应用程序可能会通过以下方式之一继续获得支持：\n\
  \n• 另一家供应商将收购该供应商或应用程序，并承诺支持它\n\n• 破闭供应商的员工可以提供支持\n\n• 用户小组可能会站出来承诺支持该应用程序\n\n这些替代方案中没有一个是理想的，现实中甚至可能的。进一步的复杂性在于时间因素。对于想要支持该应用程序的实体来说，获取源代码的权限或访问权限可能需要几个月的时间。\n\
  \n你唯一的解决方案可能是没有任何供应商支持的情况下让应用程序勉强运行，直到你可以迁移到其他供应商的产品。取决于应用程序的大小和复杂性，完成此类迁移可能需要很长时间。涉及的某些步骤包括：\n\
  \n• 编写替换应用程序必须具备的功能规范。\n\n• 向可能替换你当前应用程序的产品的供应商发布征求书（RFP）。\n\n• 等待供应商的回复。你可能需要给他们\
  \ 60 或 90 天的时间来准备方案。\n\n• 评估所有 RFP 提案并选择最佳替代方案。\n\n• 与选定的供应商就以下几点进行谈判：\n\n• 获取新硬件\n\
  \n• 与政府合作\n\n• 对用户进行应用程序培训\n\n• 役应用程序\n\n### 21.5.4 供应商停止支持应用程序\n\n也许最糟糕糟糕的情况不是这个。最糟糕的情况不是这个。最糟糕的情况不是这个。最糟糕的情况不是这个。最糟糕的情况不是这个。最糟糕的情况在应用程序上（原文不完整）。\n\
  \n---\n\n# 第 22 章\n# 政府的介入\n\n## 摘要\n\n政府对业务的介入对应用程序及其使用方式产生影响。多个层级的政府（联邦、州、地方）都可能影响你的组织。对上市公司的影响。\n\
  \n### 关键词\n\n政府；法规；多层级政府；联邦；州；地方；政府机构；SOX；HIPPA；隐私；PCI DSS；数据后的披露；发现\n\n无论你喜不喜欢，政府对你的组织都有影响，而且可能对应用程序产生影响。具体影响可能是你向政府机构提供数据、你从政府接收信息，或者你的组织必须遵守某种类型的政府规定。无论具体情况如何，在某个层级上都是政府介入的。\n\
  \n---\n\n## 22.1 多层级政府\n\n在提到“政府”时，很容易只想到联邦政府。美国和大多数其他国家都有州或省级政府，它们对企业和非营利实体同样产生影响。许可以满足业务需求的应用程序往往不仅受到单一政府实体的影响，还受到许多个政府实体的影响。\n\
  \n\n\n\n\n- 各州的所得税预扣缴税率各不相同。除了州所得税外，许多州还允许市、县或学区对收入征收税。在多个州设有业务的机构需要意识到哪些政府实体要求计算并从员工的工资单中扣缴预扣所得税。\n\
  - 环境法规对于任何处理化学品、水、土地或潜在危险材料的组织来说，都可能带来巨大的工作量。联邦和州政府要求的报告和记录工作可能是极其巨大的。\n- 当机构无法找到诸如已开具从未兑现的支票、休眠账户、股票股和人寿保险金等物品的所有者时，就会认领财产。每个州处理认领财产的规则都不同。大型组织很容易需要遵守许多不同州的认领财产规则。\n\
  - 房产税也受到被授予征税权的各级政府机构的严重影响。这些实体的示例包括县、市、学区、`SIDs`（卫生改善区）和公用事业。每个政府实体都有自己的税率或千分比税（mill\
  \ levy）。需要对自己的房产缴纳房产税或为客户房产计算款项的机构，需要对所有这些政府征税机构维护当前且准确的税率信息。\n- 失业税由各州管理。如果你的机构在多个州设有业务，那么任何工资活动都必须考虑你机构所在地每个州的税率。\n\
  \n## 22.2 政府机构\n\n有许多美国联邦政府机构是你的机构可能会与之交道的。关于它们的任何清单都保证是不完全的，但其中一些值得注意的机构包括：\n\n\
  - `IRS`—美国国税局：营利性组织需要每季度完成纳税申报表。这要求所有形式和规模的企业都要对其支出、收入、成本、投资等保持准确的记录。有员工的机构需要向 `IRS`\
  \ 提交 `W-2` 表格，以记录从每位员工工资单中扣除的收入和税款。如果你的机构支付利息或股息，则这些财务分配需要向 `IRS` 报告。\n- `SSA`—社会安全局：雇主需要从其所有员工的工资单中扣除\
  \ `FICA`（联邦保险贡献法案）。雇主可能还需要与 `SSA` 互动，以验证现职和前任员工的姓名和社会安全号码。\n- `FDA`—美国食品药品管理局：`FDA`\
  \ 负责通过确保药物、医疗设备和其他消费品的安全来保护公众健康。它还负责监控测试和批准制药公司想要上市的新药。\n- `SEC`—美国证券交易委员会：`SEC`\
  \ 负责管理规范美国证券业的法律。`SEC` 管理的较新法律之一是《2002 年萨尔班斯-奥克斯利法案》。这些法律的目标之一是防止会计欺诈、内幕交易和其他违反证券法的行为。上市公司（即其股份可以在股票市场上买卖的\
  \ la）需要向 `SEC` 提供季度季度和年度财务报告。\n- `OSHA`—美国职业安全与健康管理局制定并执行规则，以确保工作场所的健康和安全标准。雇主必须遵守\
  \ `OSHA` 规定，否则将面临罚款和其他惩罚。\n- `DHS`—美国国土安全部：在其众多义务中，`DHS` 保护美国内的地面运输、卡车、货运火车、管道和大众交通。它还负责检查在所有港口设施进口到美国的货物。如果你的机构有在美国境内进口或运输的产品，那么它可能需要从\
  \ `DHS` 获取信息或向 `DHS` 提供信息。\n- `EPA`—美国环境保护署：`EPA` 负责执行与环境相关的法律法规。如果你的与与制造、任何形式的采矿、钻井、运输石油产品、排放液体或其他废物材料、废物管理或燃烧燃料有关，那么它极有可能需要向\
  \ `EPA` 提供记录。提供准确且及时的记录几乎需要一个 IT 结构来收集、监控和维护与输出相关的数据。\n\n## 22.3 法规\n\n如果政府对企业施加的所有法规首尾相连，它们可能会延伸到月球并在其之外。我没有打算尝试列出所有法规，但将列出并描述一些最著名的法规，以便读者理解遵守这些法规是多么困难。\n\
  \n### 22.3.1 Sarbanes oxley\n\n《萨尔班斯-奥克斯利合规法案》（`Sarbanes Oxley Compliance Act`）对美国业务的影响可能比任何其他单一法规更大，但它可能是存在的最被误解的法规之一。`SOX`\
  \ 法规的意图是保护股东和公众免受欺诈行为和会计错误的影响。`SOX` 适用于美国上市公司，但其他国家也制定了类似的法规。\n\n`SOX` 可能影响 IT 部门和特定应用程序的主要方式包括：\n\
  \n- 强制要求对信息进行独立审计\n- 需要建立和维护记录财务信息的内部控制\n- 对于某些类型的业务记录，纸质版和电子版记录都需要至少 5 年\n- IT\
  \ 应用程序控制必须包含完整性检查和有效性检查\n- 应用程序的业务用户需要被唯一且不可否认地识别\n- 只有经过授权的用户才能访问财务应用程序\n\n应用程序管理员针对\
  \ `SOX` 需要问的问题包括：\n\n- 机构是否需要符合 `SOX` 合规？并不是所有机构都受此限制。例如，私有持有机构不受 `SOX` 法规限制。\n\
  - 该应用程序是否需要符合 `SOX` 合规？对于受 `SOX` 法规限制的机构，并不是其依赖的所有应用程序都需要符合 `SOX` 合规。例如，一个 `LMS`（学习管理系统）可能不需要符合\
  \ `SOX` 合规。\n- 如果应用程序现在不需要合规，未来需要符合 `SOX` 合规吗？你的猜测和别人的一样。\n- 该应用程序是否通过了 `SOX` 合规审计？通过了吗？重要的一点是，`SOX`\
  \ 没有规定什么是合规的什么。每家公司都与其审计师讨论这一点，但一旦定义了程序，公司必须维护合规性。\n- 更改应用程序的流程是什么？\n\n#### 22.3.1.1\
  \ SOX 审计\n\n本书以及特别是本章的范围内，审计是对组织内部控制和流程的评估，以确保它们既符合政府法规又得到了一致的执行。如果组织的流程是理想的，但经常被忽视，那么它们就是毫无用处的。\n\
  \n\n\n\n许多组织设有两个审计流程。内部审计小组会对这些流程进行评估。如果他们发现到问题，将为组织的员工提供改进或完善其流程的机会。第二次审计由一个外部独立的审计员小组执行。外部审计员的发现才具有决定性意义。如果一个组织未能通过\
  \ SOX（萨班斯-奥克斯利法案）审计，则将安排补救审计，以测试出现问题的区域。\n\nSOX 审计会关注的一些问题包括：\n\n• 员工对哪些操作负责？是否存在任何个人拥有的职责范围可能会破坏现有的控制？\n\
  • 谁有权访问处理财务信息的应用程序和系统？\n• 谁负责批准访问财务信息的用户？\n• 多久审查一次用户列表，以验证每个用户是否仍需要访问财务信息的权限？\n\
  • 是否建立了职责分离，以最大限度地减少欺诈活动的可能性？\n• 业务流程在整个组织中是否一致？\n• 离职员工在离开后是否能尽快移除其访问权限？\n• 测试账户的数量是否已降至最低？是否在测试完成后尽快将其删除？\n\
  • 处理所有应用程序进出数据接口的程序是否包含错误处理、验证和身份验证？\n• 应用程序应要求“强”密码。\n• 新用户账户应要求用户在首次登录时更改密码。\n\
  • 应用程序开发人员不应拥有允许其修改生产环境中代码或可执行文件的权限。\n\n### 22.3.2 健康保险可移植性与责任法案\n\n1996 年通过的《健康保险可移植性与责任法案》（HIPAA）旨在保护工人及其家庭的健康保险覆盖。该法案的一个章节规定了保护患者健康相关数据安全和隐私的标准。这可能是该法案对\
  \ IT 部门及其运行的应用影响最大的部分。\n\n如果你工作的组织处理患者的健康数据，那么 HIPAA 法规可能会影响你的 IT 部门。受影响的示例包括：\n\
  \n• 医院\n•诊所\n• 健康保险公司\n• 提供 MRI 读等专业服务的组织\n• 牙医\n• 眼科医生\n• 学校\n• 初级保健医生\n• 为上述任何业务提供理赔处理、账单活动、会计服务或上述业务会计服务的业务伙伴\n\
  \n应用程序管理员在涉及 HIPAA 合规性方面需要询问的问题包括：\n\n• 该组织是否受 HIPAA 法案的约束？\n• 所支持的应用程序是否受 HIPAA\
  \ 法规的约束？\n• 如果不是，未来是否需要符合 HIPAA 合规性？\n• 该应用程序是否经过了 HIPAA 合规性审计？\n\n如果你所支持的应用程序受\
  \ HIPAA 合规性约束，已经识别出许多潜在的安全威胁。允许访问 HIPAA 相关数据的软件需要免受合理预见的威胁或危害。你需要确保你的应用程序没有出现以下漏洞：\n\
  \n• 用户工作站上允许其远程访问的软件必须是安全的。实现这种安全性的一种方法是对来自和来自工作站的通信进行加密。\n• 远程访问软件需要记录所有的远程访问活动。如果不进行记录，将几乎无法识别是谁在何时访问了系统。\n\
  • 当员工离开组织或转到不再需要访问该应用程序的职位时，密码（尤其是管理员账户的密码）需要更改。\n• 在多个远程系统上使用相同的管理员密码可能很方便，但很难快速更改所有密码。离职员工可能在密码更改之前访问远程系统。\n\
  • 日志文件需要集中存储，或者可以从中心位置访问。这使得应用程序管理员更容易在在不耗费过多精力的情况下定期访问它们。\n\n### 22.3.3 支付卡行业数据安全标准—PCI\
  \ DSS\n\n信用卡行业开发了一套名为 PCI DSS（支付卡行业数据安全标准）的标准，以增加处理信用卡、借记卡、ATM 卡和 POS 卡持卡人信息的安全性。如果你的组织通过上述任何类型的卡接收支付，则可能必须遵守\
  \ PCI DSS 的标准和要求。未能应用和维护这些标准的组织面临巨额罚金的可能。\n\nPCI DSS 提出的要求摘要：\n\n1. 需要防火墙来保护包含持卡人数据的服务器\n\
  2. 系统上管理账户的默认密码需要更改\n3. 存储在数据库或文件中的持卡人数据需要受到保护\n4. 跨公共网络传输的持卡人信息必须加密\n5. 系统需要由定期更新的杀病毒软件进行保护\n\
  6. 应用程序和系统需要是安全的\n7. 对持卡人数据的访问必须限制在有合法知情需求的用户\n8. 必须为用户分配唯一的 ID，并在访问应用程序和数据时使用这些\
  \ ID\n9. 对持卡人数据的物理访问必须受到限制，例如：锁闭的门、安保人员等\n10. 对持卡人数据和网络资源的访问必须进行跟踪和监控\n11. 系统安全应定期进行测试\n\
  12. 组织需要制定并维护信息安全策略\n\n### 22.3.4 联邦信息安全管理法案\n\n2002 年的联邦信息安全管理法案（FISMA）要求联邦机构确保其信息系统是安全的。有效的安全计划应包含的一些属性包括：\n\
  \n• 必须定期对风险评估进行审查。需要修改政策和程序以应对感知风险的变化\n• 需要制定并实施为网络、设施和系统等子系统提供安全的计划\n• 需要开发并提供旨在让人员了解安全需求的培训\n\
  • 信息安全政策需要定期进行测试和评估\n• 需要制定处理安全事件的程序，即检测、报告和响应安全事件\n• 需要制定确保业务连续性的计划\n\n你可能认为 FISMA\
  \ 并不适用于你的组织，但你可能会大吃一惊。该法案还扩展到承包商或其他实体为联邦机构提供的系统和应用程序。如果你的组织与必须遵守 FISMA 政策的联邦机构开展业务，那么你的组织可能也处于该法案的安全标准伞下。\n\
  \n### 22.3.5 公平信用报告法案\n\n\n\n\n\n《儿童在线隐私保护法》（`COPPA`）规定了可以收集哪些关于 13 岁以下儿童的个人信息，以及这些数据应如何处理。`FTC`（美国联邦贸易委员会）已获得授权执行\
  \ `COPPA` 并发布额外的法规。对于违反 `COPPA` 规定的公司，已对其处以高达 100 万美元的罚款。如果您的机构收集或使用了有关儿童的数据，那么\
  \ `COPPA` 规定可能适用于该机构。\n\n收集儿童个人信息的一些指南包括：\n\n*   必须在网站上发布一份清晰且全面的隐私政策，说明机构如何处理收集到的信息。\n\
  *   在收集其儿童的个人信息之前，必须获得家长的同意。\n*   必须赋予父母禁止机构向第三方披露其儿童信息的选项。\n*   必须赋予父母查阅其儿童数据并从从中删除信息的能力。\n\
  *   必须向父母提供防止额外收集和/或使用其儿童个人信息的选项。\n*   机构必须确保从儿童处收集的信息以机密和安全的方式进行维护。\n\n## 22.4\
  \ 隐私\n\n截至 2013 年中期，美国还没有保障其公民隐私权的联邦法律。如果您的机构仅在美国开展业务，您可能会认为这意味着您没有任何需要满足的隐私标准。您的想法可能是错的，并且会由于您必须满足的隐私标准的来源而感到惊讶。如果您的机构的网站包含隐私政策，那么该机构就有义务履行那些声明。网站隐私政策声明中常见的声明包括：\n\
  \n*   消费者的信息是否会被出售、交换或传输给任何其他机构。\n*   一份表明网站是否使用 `cookies` 的陈述。\n*   在线收集信息与离线收集信息之间的区别分。\n\
  *   正在收集的信息是强制性的还是可选的。\n*   使用了什么种安全措施来确保消费者信息的保护。\n*   消费者如何了解安全策略的变更。\n*   消费者如何选择避免来自贵机构的未来联系。\n\
  \n欧盟的法律为其公民提供了显著更强大的隐私保护。`EU 指令 94/46/EC` 包含了管理个人数据隐私的七项原则：\n\n1.  `Notice`（通知）：被收集数据的主体应被告知此类收集行为。\n\
  2.  `Purpose`（目的）：收集的数据应仅用于说明的目的，而不用于任何其他目的。\n3.  `Consent`（同意）：在没有主体同意的情况下，不应向第三方披露或共享个人数据。\n\
  4.  `Security`（安全）：一旦被收集，个人数据应保持安全，免受潜在的滥用、盗窃或丢失。\n5.  `Disclosure`（披露）：被收集个人数据的主体应被告知收集此类数据的方或双方。\n\
  6.  `Access`（访问）：主体应获得访问其个人数据的权限，并允许修正任何不准确之处。\n7.  `Accountability`（问责）：主体应能够要求个人数据收集者遵守上述所有七项原则。\n\
  \n## 22.5 保护个人身份信息\n\n个人身份信息（`PII`）是可用于唯一识别个人的信息。如果犯罪分子获得了某人的个人身份信息，将使盗窃其身份成为一种非常现实的可能性。因此，有法律规定了机构必须为这类信息提供的保护类型。保护\
  \ `PII` 的法律因国家而异。如果您的机构在多个国家经营，您应该了解每个国家的规则。\n\n构成 `PII` 的信息示例包括：\n\n*   个人的全名（如果该姓名并不常见）。\n\
  *   在发放此类号码的国家的身份号码。\n*   美国的社会安全号码。\n*   护照号码。\n*   驾照号码。\n*   信用卡号。\n*   出生日期。\n\
  *   出生地。\n*   生物识别信息，如指纹、虹膜扫描和脸部几何。\n*   家庭和个人手机号码。\n*   母亲的中间名和姓。\n*   军事记录。\n\n\
  关于如何保护 `PII` 的一些行业建议包括：\n\n*   如果 `PII` 存储在工作站或移动设备上，必须使用经过 `FIPS 140-2` 认证的加密模块加密。\n\
  *   电子存储的 `PII` 应仅通过 `User IDs` 和密码等访问控制进行访问。\n*   存储在网络驱动器或数据库上的 `PII` 应根据“知情原则”可用。\n\
  *   当从 `PII` 数据库中提取数据时，应记录活动，包括创建者、日期和提取的信息类型。\n*   通过互联网传输的 `PII` 必须加密。\n*   通过电子邮件传输的\
  \ `PII` 需要加密。\n\n`Application Administrator` 应该回答的关于 `PII` 的问题包括\n\n*   你支持的应用程序包含\
  \ `PII` 吗？\n*   你是否遵循行业最佳实践来保护个人身份信息？\n*   你必须做什么来证明你正在遵循行业最佳实践？\n*   应用程序和/或你的流程是否经过了审计？\n\
  *   你的数据加密了吗？\n*   如果是，是在哪里加密的？在磁盘上、传输过程中还是两者都加密？\n*   使用的是哪种加密类型？例如 `DES`、`3DES`、`AES`、`RSA`？\n\
  *   加密算法使用了多少位？\n***加密密钥是如何管理的？\n*   你的备份磁带加密了吗？\n*   你是否对承包商的安全性进行审计？\n*   你是否对外包工作的公司的安全性进行审计？\n\
  *   你是否对你的离线存储供应商的安全性进行审计？\n\n## 22.6 数据丢失后的披露\n\n如果发生数据丢失或系统入侵，你是否需要提醒客户其数据可能已经泄露？目前美国有\
  \ 46 个州的法律规定在发生数据丢失时必须披露信息。如果您的机构位于这 46 个州之一，那么它需要制定政策和程序以遵守州法律。需要强调，如果丢失的任何数据属于这\
  \ 46 个州之一的客户、员工、客户等，则适用州法律。什么构成了数据丢失事件？某些常见类型包括：\n\n*   信息的无意披露。例如，员工或客户的社会安全号码无意中发布在公开的网站上。\n\
  *   外部人员（例如黑客）访问了计算机服务器、网络或数据库并可能获取了敏感信息。\n*   内部人员（例如员工或承包商）访问或下载了他们未经授权的数据。\n\
  *   包含敏感信息的纸质文档丢失，例如报告、申请表、贷款申请表、健康记录等。\n*   包含敏感信息的便携式电子设备丢失，如笔记本电脑、`PDA`、硬盘、`USB\
  \ 驱动器`和备份磁带。这些设备可能被盗或丢失。\n*   包含敏感信息的固定设备丢失，如服务器。\n\n您的机构是否有处理此类事件的政策和程序？政策是否规定了丢失什么种类型或多少量的数据才需要披露？在未来的某个时刻，可能会出现该主题的联邦立法。当发生时，每个机构都需要审查其政策，以确保符合联邦或州法律（以严格者为准）。\n\
  \n## 22.7 发现调查\n\n\n\n\n\n# 取证\n\n在美国法律中，诉讼中的每一方都将被要求向对方提供证据。这一法律流程的审前阶段被称为“取证（discovery）”。如果你的组织卷入诉讼，将根据要求在取证过程中进行全力配合。取证还包括最初以电子格式存储的信息交换。你的公司可能被提供以下某些或全部信息：\n\
  \n- 电子邮件\n- 即时消息 (IM) 聊天\n- 照片\n- 视频文件\n- `Oracle`、`DB2`、`SQL Server` 等关系型数据库的内容\n\
  - `Access` 等桌面数据库的内容\n- 电子表格\n- 结构化平面文件\n- XML 页面\n- 语音邮件\n\n作为 `Application Administrator`，你可能需要参与为取证过程收集和提供电子信息的工作。如果是这样，你需要理解的是，未能提供所有相关信息（无论是故意还是无意忽略）都可能导致灾难性的法律后果。请确保你清楚自己需要提供哪些内容。\n\
  \n## 22.8 数据保留要求\n\n法律要求企业根据不同期限保留某些类型的信息。早于此时间的数据可以根据组织的决定进行清理。请确保你了解下列表中列出的任何数据类别是否适用于你支持的应用程序。\n\
  \n这里列出了一些必须保留的数据示例。此列表仅供示例，不应被视为定义列表。法律要求会发生变化，且每个州和国家都不同，因此让组织的法律部门研究需要保留的内容以及保留多久是非常重要的。\n\
  \n| 人员人事申请 | 1 年 |\n| :--- | :--- |\n| 采购订单 | 1 年 |\n| 银行对账 | 3 年 |\n| 实物库存日志 |\
  \ 3 年 |\n| 事故报告和索赔 | 7 年 |\n| 银行账单 | 7 年 |\n| 佣金记录 | 7 年 |\n| 采购订单 | 7 年 |\n| 版权\
  \ | 永久 |\n| 专利 | 永久 |\n| 抵押贷款 | 永久 |\n\n作为 `Application Administrator`，你应该熟悉你组织的数据保留政策。如果你支持的应用程序包含组织数据保留政策中指定的任何类型的数据，请确认这些数据正在按适当的时间保留。如果你有任何疑问，请联系你组织的数据保留团队或法律部门。\n\
  \n### 22.8.1 法律调查优先于常规数据保留实践\n\n如果你的组织卷入法律调查或诉讼，那么停止删除任何可能与案件相关的电子记录就变得至关重要。这包括删除文件、销毁备份介质或覆盖备份带。取证的要求优先于正常的数据保留期或做法。\n\
  \n# 第 23 章\n\n# Windows 工具\n\n## 摘要\n\n本章描述了 Windows 操作系统下的可用工具。这些工具包括命令提示符、`Computer\
  \ Management`、`Process Explorer`、远程连接、`shutdown`、`ipconfig` 以及其他用于收集服务器信息的 Windows\
  \ 命令。\n\n### 关键词\n\nWindows；工具；命令提示符；Windows Explorer；管理员；自动补全；文件类型；功能键；`WMIC`；管道；`Terminal\
  \ Services Manager`；`Computer Management`；事件查看器；`Process Explorer`；VPN；`RDC`\n\n\
  ## 23.1 Windows 工具\n\n每个操作系统都有其自己的工具，如果你了解它们并知道如何使用它们，它们会让你的生活变得更轻松。Windows 也例外。本章列出的工具可以使\
  \ `Application Administrator` 的工作变得轻松。\n\n## 23.2 使用命令提示符\n\n命令提示符（曾经被称为 DOS 窗口）并没有消失。作为\
  \ `Application Administrator`，你需要知道如何使用它们。你可能需要使用命令提示符有许多原因。例如：\n\n- 许多厂商的安装程序将要求你打开命令提示符\n\
  - 在命令提示符中完成某些任务可能可能更快\n- 许多在命令提示符中运行的命令提供了 GUI 中无法提供的命令行选项\n\n### 23.2.1 打开和关闭命令提示符\n\
  \n有多种方法启动命令提示符。\n\n- 点击“开始”。如果显示“命令提示符”图标，则点击它。\n- 点击“开始”图标，点击“运行”，输入 `cmd` 并按回车键。\n\
  - 通过将 `C:\\Windows\\System32\\cmd.exe` 拖到桌面并选择“在此创建快捷方式”来创建快捷方式。\n\n要关闭命令提示符，你可以：\n\
  \n- 点击窗口右上角的“X”\n- 输入命令 `exit` 并按回车键\n\n### 23.2.2 启动命令提示符的高级方法\n\n还有其他启动命令提示符的方法。这些方法并不适用于所有情况，但在适用时非常有效。\n\
  \n#### 23.2.2.1 启动第二个命令提示符\n\n如果你打开了一个命令提示符，可以通过输入命令 `start` 并按回车键来启动第二个命令提示符。这将打开一个新的窗口。新的命令提示符将处于原始窗口运行的子目录级别。\n\
  \n第二个命令提示符的打开模式与第一个窗口相同。如果第一个窗口是以管理员模式打开的，第二个窗口也是该模式。\n\n#### 23.2.2.2 从 Windows\
  \ Explorer 打开命令提示符\n\n如果你不想输入任何内容，有一种方法可以直接从 Windows Explorer 打开命令提示符。按住 Shift 键并右键点击子目录。当子菜单显示时，点击“在此处打开命令窗口”选项。\n\
  \n#### 23.2.3 使用拖放更改命令提示符的子目录\n\n可以使用拖放的概念更改命令提示符的当前子目录。操作步骤如下\n\n1. 在命令提示符窗口中输入\
  \ `cd` 和一个空格\n2. 从 Windows  中将子目录拖入命令提示符窗口并松开\n3. 在命令提示符窗口中按回车键\n\n### 23.2.3 以管理员身份打开命令提示符\n\
  \n在某些情况下，你准备在命令提示符中输入的命令将对系统进行更改。为了对系统进行更改，你必须拥有完全管理员权限。这需要以管理员身份打开命令提示符。\n\n\n\n\
  \n\n1. 如果你在点击启动图标时在启动列表中看到了`Command Prompt`选项，请右键点击它并选择“以管理员身份运行”。请参图 23.2 查看该选项的截图。\n\
  \n![image](img/F000236f23-02-9780123985453.jpg)\n\n图 23.2 以管理员身份打开命令提示符。\n\n2. 打开命令提示符的另一种方法是通过启动图标。完成此操作的步骤如下：\n\
  \na. 左单击启动图标\nb. 点击`运行`\nc. 在“打开文本框中输入`cmd`\nd. 同时按下 `Ctrl`、`Shift` 和 `Enter` 键\n\
  \n3. 如果你按照第 23.2.1 节中的描述创建了打开命令提示符的快捷方式，则可以修改该快捷方式使其始终以管理员模式打开命令提示符。步骤如下：\n\na.\
  \ 右键点击快捷方式并选择`属性`\nb. 如果尚未选中`快捷方式`选项卡，请选中它\nc. 点击`高级`按钮\nd. 勾选“以管理员身份运行”复框\n\n###\
  \ 23.2.4 更改命令提示符窗口的外观\n\n默认的命令提示符窗口可能比你想要的要。要让命令窗口更高或更矮，只需抓住顶部或底部边缘并拖动。\n\n让命令提示符变宽需要几个额外的步骤。\n\
  \n- 右键点击命令提示符窗口的上边界并选择“属性”。\n- 将显示如图 23.3 所示屏幕。\n\n![image](img/F000236f23-03-9780123985453.jpg)\n\
  \n图 23.3 命令提示符的属性。\n\n- 如果尚未选中`布局`选项卡，请点击它。\n- 将`宽度`设置更改为所需的值。\n- 系统可能会提示你决定此更改是影响所有命令提示符还是仅影响当前的一个。\n\
  \n“属性”窗口允许你对命令提示符进行许多其他更改。可以进行的调整最显著的是：\n\n- 可用多种字体来显示文本\n- 调整在命令提示符中保存命令和输出的缓冲区\n\
  - 选择一组预设的窗口大小，例如 4 × 6、6 × 8 或 12 × 18\n- 可以选择文本和背景的字体颜色\n\n### 23.2.5 复制和粘贴\n\n\
  可以在命令提示符中执行复制和粘贴操作。当你想要复制在命令提示符中执行的命令的输出时，这非常有帮助。从命令提示符中复制文本有两种方法：\n\n要选择命令提示符中的所有内容，步骤如下：\n\
  \n1. 在命令提示符中右键点击并选择“选择所有”\n2. 整个屏幕将以反色视频显示\n3. 按下 `Enter` 键\n\n屏幕内容现在位于你的剪贴板缓冲区中。可以像处理其他缓冲区内容一样对其进行操作。\n\
  \n要复制命令提示符的一部分，请执行以下步骤：\n\n1. 在命令提示符中右键点击并选择“标记”\n2. 点击开始复制的位置\n3. 拖动鼠标到结束复制的位置\n\
  4. 按下 `Enter` 键\n\n使用第二种技术时，你需要注意复制的区域不会自动包含完整的行。在鼠标点击的初始像素和当前鼠标位置之间形成一个矩形。该矩形不一定包含完整的行。如果你想复制整行，则鼠标的最终位置必须位于命令提示符窗口的右侧边缘。请查看图\
  \ 23.4 显示使用标记选项示例的截图。\n\n![image](img/F000236f23-04-9780123985453.jpg)\n\n图 23.4\
  \ 使用标记选项从命令提示符复制内容。\n\n将内容粘贴到命令提示符窗口中非常简单，但有一个例外。如果你习惯使用 `Control-V` 组合键进行粘贴，请忘记这个快捷键。要粘贴到命令提示符中，你需要在窗口中右键点击，并在显示的子菜单上选择“粘贴”选项。\n\
  \n这里需要对粘贴操作提供一个警告。剪贴板缓冲区中的任何内容都将粘贴到命令提示符中。这包括 `Control Return` 和换行符（`CRLF`）。如果你从记事本窗口复制了多行，那么\
  \ `CRLF` 字符之前的文本将被执行。务非常小心不要在粘贴的字符串中包含任何 `CRLF` 字符，以避免在命令提示符中自动执行不需要的命令。\n\n将字符串粘贴到命令提示符后，可以对其进行编辑。使用左箭头键定位光标，然后使用\
  \ `backspace` 或 `delete` 键删除不需要的字符。使用键盘输入新文本。按下 `Enter` 或 `Return` 键执行命令提示符窗口显示的命令。\n\
  \n### 23.2.6 有用的命令提示符功能和命令\n\n在使用命令提示符时，有很多方法可以提高效率。这里描述了其中一些。\n\n#### 23.2.6.1\
  \ 清屏\n\n当你向命令提示符中复制和粘贴时，一个非常有用的命令是“清屏”命令。输入 `cls` 并按下 `Return` 键使命令提示符屏幕清空。当你只想复制单个命令的输出时，这非常有帮助。\n\
  \n#### 23.2.6.2 重复命令\n\n你可以通过键盘上的向上或向下箭头在命令提示符窗口中重复命令，无需重新输入。一旦显示了你想要的命令，就可以使用向右和向左箭头键或\
  \ `backspace` 和 `delete` 键进行编辑。\n\n#### 23.2.6.3 重定向文件\n\n命令提示符窗口中执行大多数命令的输出都可以重定向到磁盘文件。要执行此操作，输入命令然后在命令提示符中输入\
  \ `> filename`。输出将写入指定的文件。例如，命令 `systeminfo > systeminfo.txt` 将运行 `systeminfo` 命令并将输出写入当前子目录下的文件\
  \ `systeminfo.txt`。如果指定的文件已存在，它将被覆盖。\n\n#### 23.2.6.4 追加文件\n\n你可以将命令的输出追加到现有文件中。执行此操作的格式是在命令末尾添加\
  \ `>>filename`。例如，命令 `ipconfig >> systeminfo.txt` 将 `ipconfig` 命令的输出追加到 `systeminfo.txt`\
  \ 中已有的行中。\n\n### 23.2.7 放大命令提示符窗口\n\n要快速放大命令提示符窗口，只需双击其标题栏。窗口将增大到属性窗口指定的尺寸。要让窗口恢复原始大小，再次双击标题栏。此技巧可以用于大多数（不是所有的\
  \ Windows 屏幕。\n\n### 23.2.8 自动完成\n\n如果你不喜欢在输入子目录或文件名时输入长字符串，那么你会发现命令提示符的自动完成功能非常好用。此功能与切换目录（`cd`）命令配合完美。输入\
  \ `cd` 和一个空格。然后按下 `Tab` 键。按字母顺序排列第一个文件或目录将填充到命令行。再次按下 tab 键将显示下一个文件或目录。这对于深入目录树非常有用。它比手动输入名称更快、更准确。在使用此功能很短一段时间后，你将无法理解没有它是怎么生活的。\n\
  \n\n\n\n如果你想深入某个目录结构，自动补全功能可以提供帮助。首先输入 `cd` 和一个空格，然后按 `Tab` 键来获取你需要的目录。接着按 `\\`\
  \ 键在路径中添加一个反斜杠（`\\`），然后再次按 `Tab` 键。重复此过程，直到你获得了所需的完整路径。最后，按下 `Enter` 键，你就会进入目标子目录。只需稍加练习，你就能学会比你想象中快的速度来导航子目录。\n\
  \n自动补全功能也可用于启动 `cmd`、`bat` 和 `exe` 文件。按下 `Tab` 键，命令行将自动补全当前子目录下按字母顺序排列的第一个对象（无论它是文件还是子目录）。当你想要启动的特定文件显示在命令行上时，按下\
  \ `Enter` 键即可启动它。\n\n## 23.2.9 关联文件类型\n\n在 Windows 资源管理器中双击文件时，操作系统将使用与该文件扩展名关联的应用程序打开文件。例如，扩展名为\
  \ `.txt` 的文件通常会用记事本打开。Excel 将用于打开扩展名为 `.xls` 的文件。如果没有与文件扩展名类型的关联，系统会提示你使用哪个应用程序打开文件。\n\
  \n`assoc` 命令可列出或更改与特定文件扩展类型关联的程序。在命令提示符中输入 `assoc` 将列出所有文件扩展类型及其关联的程序。图 23.5 显示，以\
  \ `.csv` 结尾的文件将由 Excel 打开，而以 `.doc` 结尾的文件将用 Microsoft Word 打开。下一节将解释图 23.5 中显示的最后一行行的含义。\n\
  \n![image](img/F000236f23-05-9780123985453.jpg)\n\n图 23.5 列出关联的文件类型。\n\n文件关联可以通过\
  \ Windows GUI 获取，但深入到那种种程度所需比在命令提示符中使用 `assoc` 命令要长得多。要使用 GUI 方法显示文件关联，请执行以下操作：\n\
  \n1. 点击“开始”并选择“控制面板”\n2. 点击“默认程序”链接\n3. 点击“将文件类型或协议与程序关联”链接\n\n如果你只想查看特定的关联，可以添加管道符号和\
  \ `find` 命令来列出单个文件类型。例如，要查看与扩展名 `.txt` 关联的程序，输入命令 `assoc | find \".txt.\"`。管道符号导致\
  \ `assoc` 命令的输出被送给 `find` 命令。`find` 命令被指示查找字符串 `.txt.`。图 23.6 显示了该命令和结果。\n\n![image](img/F000236f23-06-9780123985453.jpg)\n\
  \n图 23.6 列出单个关联的文件类型。\n\n如果你想删除文件扩展名与程序之间的关联，可以使用 `assoc` 命令 并在等号后跟一个空值（not value）。例如，命令：\n\
  \n```\nassoc .txt =\n```\n\n这会删除 `.txt` 文件与记事本之间的关联。\n\n可以通过以下方式创建文件类型关联：\n\n1.\
  \ 在 Windows 资源管理器中双击文本文件，在选择用何种程序打开文件时选择记事本\n2. 在命令提示符中输入命令 `assoc .txt=txtfile`\n\
  3. 打开“控制面板 | 默认程序 | 将文件类型或协议与程序关联”，然后点击 `txt` 条目并点击“更改程序”按钮。在“打开方式”屏幕上选择记事本并点击确定。\n\
  \n## 23.2.10 More\n\n使用 `assoc` 命令列出的关联数量可能很多。如果只输入 `assoc` 命令，显示的文件类型可能多到让你无法无法全部全部。另一种方法是在你的输入中包含\
  \ `more` 命令。通过输入命令 `assoc | more`，你对输出的显示方式有了更多的控制。管道符号（`|`）导致 `assoc` 命令的输出被送给\
  \ `more` 命令，该命令一次显示一屏的输出。图 23.5 中所示截图是命令 `assoc | more` 的结果。\n\n如果你按下回车键，`more`\
  \ 命令将显示来自 `assoc` 命令的额外行输出。按下空格键将显示来自 `assoc` 命令的整屏额外输出。`More` 命令可以与命令提示符窗口中产生输出的任何命令配合。\n\
  \n## 23.2.11 Clip\n\n如果你想将在命令提示符中执行的命令输出写入剪贴板缓冲区，可以使用 `clip` 命令。例如，要将 `assoc` 命令的输出导出到剪贴板缓冲区，输入以下命令：\n\
  \n```\nAssoc | clip\n```\n\n像 `more` 命令一样，`clip` 命令可以与命令提示符中产生输出的任何命令配合。\n\n## 23.2.12\
  \ FC 比较文件\n\n另一个允许你比较文件的命令是 `fc` 命令。`fc` 命令可以在窗口中启动：\n\n![image](img/F000236f23-08-9780123985453.jpg)\n\
  \n图 23.8 fc 提示。\n\n![image](img/F000236f23-09-9780123985453.jpg)\n\n图 23.9 fc 结果。\
  \ \n\n## 23.2.13 命令提示符窗口和功能键\n\n命令提示符窗口可以比 GUI 更高效，但如果你能将命令提示符与功能键结合，你的工作效率将大大提高。命令提示符中可用的功能键列表如下：\n\
  \n- `F1`——逐个字符重复上一个命令。每次按下 F1 键，都会显示另一个字母。在处理长路径或文件名时非常有用。\n- `F2`——会提示你输入一个字符。当你输入时，将重复上一行命令中直到该字符为止的内容。图\
  \ 23.8 显示了上一个命令以及按下 F2 时的提示。我在提示处输入了“d”。图 23.9 显示了上一个命令中但不包含第一个“d”的内容。\n- `F3`——重复整个上一个命令。其结果基本上与按一次“向上箭头”键相同。\n\
  - `F4`——类似于 F2，但会提示你从上一个命令中删除到某个字符。\n\n\n\n\n- `F5`—允许你显示之前输入的所有命令。每当你按下 `F5` 时，都会显示上一个命令。其结果与多次按下“上箭头”键相同。\n\
  - `F6`—向命令行中包含 `Ctrl Z`（文件结束符）。\n- `F7`—弹出一个提示窗口，列出本次会话中输入的所有命令。你可以使用上、下方向键来选择命令。当你按下\
  \ `Enter` 键时，选定的命令将显示在命令行中。图 23.10 显示了所显示的提示窗口。如果你想清除持有命令行历史的缓冲区，请按 `Alt + F7`。\n\
  \n![image](img/F000236f23-10-9780123985453.jpg)\n\n图 23.10 显示命令行历史的窗口。\n\n- `F8`—按下\
  \ `F8` 可以循环遍历已累积的命令行历史。在命令行中输入一个或多个字符可以使 `F8` 过滤显示内容，仅显示以这些字符开头的命令。例如，如果你输入“c”并按下\
  \ `F8`，则历史记录中仅列出以“c”开头的命令。\n- `F9`—允许你从 `F7` 列表中输入命令编号。你必须拥有良好的记忆或一张截图才能充分利用此功能键。\n\
  \n### 23.2.14 Tree \n\n`tree` 命令以半图形化的方式显示当前驱动器和子目录的子目录结构。请注意，如果当前层级下方有很多子目录，那么\
  \ `tree` 命令的大部分输出将滚出屏幕顶端。图 23.11 显示了 `tree` 命令的输出示例。\n\n![image](img/F000236f23-11-9780123985453.jpg)\n\
  \n图 23.11 `tree` 命令的输出。\n\n### 23.2.15 Ctrl-C\n\n如果命令行提示符中的某个命令返回的输出较多，或者处理时间比预期的要长，你可以选择中止它。按下\
  \ `Ctrl-C` 键，大多数命令将被终止。\n\n### 23.2.16 Prompt 命令\n\n默认情况下，命令行提示符窗口中的提示符显示你当前所在的驱动器和子目录。这通常不是问题，但有时它可能并不是理想的。在以下两种情况下，你可能不希望显示整个路径：\n\
  \n1. 当路径长到以至于你无法在命令行的剩余部分输入命令时。当你输入命令时，它会自动滚动到下一行，但这可能不利于阅读或不方便。\n2. 当你正在截屏但不想显示实际子目录时。你可能正在编写文档，不想暴露不必要的细节。\n\
  \n为了避免这种情况情况，你可以使用 `prompt` 命令来更改显示内容。命令的格式为 `prompt xxxx`，其中 `xxxx` 是要显示的新字符串。图\
  \ 23.12 中的截图显示了 `prompt` 命令的多次执行情况及结果。\n\n- 输入 `prompt C:` 将提示符更改为“C:”\n- 仅输入 `prompt`\
  \ 将恢复到默认提示符\n- 在命令中包含 `$g` 会在你选择的任何字符串后附加 `>` 符号。在这种情况下，结果是“C:>”\n\n![image](img/F000236f23-12-9780123985453.jpg)\n\
  \n图 23.12 更改提示符值。\n\n### 23.2.17 Shutdown\n\n`shutdown` 命令允许你——让你意料的是——关闭计算机。此命令可以影响你当前登录的计算机，也可以网络上的远程计算机。显然，由于此命令权限很大，在使用它时需要极其小心。\n\
  \n使用 `shutdown` 命令可以指定的参数有：\n\n- `/i`—显示对话框屏幕\n- `/l`—在本地计算机关机前注销当前用户\n- `/s`—关闭本地计算机\n\
  - `/m \\\\computername`—指定关闭指定的远程计算机\n- `/r`—重启本地或远程计算机\n- `/p`—在关机完成后关闭电源\n- `/f`—强制关闭所有运行中的程序而不发出警告\n\
  - `/t xxx`—关将在 xxx 秒后发生\n- `/c \"comment\"`—解释关机的注释将记录在事件日志中\n\n## 23.3 更多关于计算机\n\
  \n一些非常有用的命令和工具将让你更多地了解当前登录的工作站。你可能了解你的 PC 或笔记本电脑，但对运行应用程序的服务器并不熟悉。\n\n### 23.3.1\
  \ ipconfig 命令\n\n`ipconfig` 命令显示 IP 地址信息。图 23.13 显示了 `ipconfig` 命令的输出。\n\n![image](img/F000236f23-13-9780123985453.jpg)\n\
  \n图 23.13 计算机的 IP 信息。\n\n### 23.3.2 hostname 命令\n\n`hostname` 命令列出计算机名称。图 23.14\
  \ 显示了 `hostname` 命令的输出。\n\n![image](img/F000236f23-14-9780123985453.jpg)\n\n图 23.14\
  \ 计算机的主机名\n\n### 23.3.3 net srv 命令\n\n有时你需要知道服务器运行了多久。在 Windows 服务器上，`net srv` 提供关于活动的信息。图\
  \ 23.15 显示了 `net srv` 命令的输出。\n\n![image](img/F000236f23-15-9780123985453.jpg)\n\n\
  图 23.15 Windows 计算机的运行时间\n\n### 23.3.4 driverquery\n\n软件驱动程序的定义是让计算机与硬件设备通信的软件程序。要查看计算机上的驱动程序列表，你可以在命令行提示符中输入\
  \ `driverquery`。图 23.16 显示了 `driverquery` 命令的输出。\n\n![image](img/F000236f23-16-9780123985453.jpg)\n\
  \n图 23.16 `driverquery` 命令的输出。\n\n### 23.3.5 Java\n\n许多服务器，特别是支持 Web 应用程序的服务器，都加载了\
  \ Java 元素。可以在命令行提示符中运行几个简单的命令来检查计算机是否加载了 Java。图 23.17 显示了这些命令的输出。\n\n| 命令 | 描述 |\n\
  | :--- | :--- |\n| `java -version` | 确定是否存在 Java JRE（Java 运行环境）。应用程序通常只需要 JRE |\n\
  | `javac -version` | 确定是否存在完整的 JDK（Java 开发工具包）。开发者需要 JDK，但应用程序服务器上通常不需要 |\n\n\n\n\
  \n\n| `set JAVA_HOME` | 如果计算机上安装了 Java，则环境变量 `JAVA_HOME` 通常用于定义其位置。`set` 命令显示变量\
  \ `JAVA_HOME` 中的值 |\n| `Echo %JAVA_HOME%` | 显示环境变量内容的另一种方法 |\n\n![image](img/F000236f23-17-978012398545.jpg)\n\
  \n图 23.17 检查计算机上是否安装 Java 的方法。\n\n### 23.3.6 WMIC\n\n`WMIC`（Windows 管理体系工具命令行）在单个命令中集成了极其丰富的功能。根据所指定的参数，它可以返回有关服务器上硬件或软件的详细信息。要真正彻底理解此命令的全部功能，你必须对其进行大量操作才能变得熟练。使用帮助选项运行它，即\
  \ `wmic /?`，以获取参数和选项列表。\n\n这里列出并描述了 `wmic` 命令的一些基本选项。\n\n![Image](img/T000236tabT0020.png)\n\
  \n`wmic` 命令的输出可能非常长。有几个非常有用的选项可以处理这些输出。例如，你可以：\n\n- 在 `wmic` 命令中包含“brief”（简要）选项，例如\
  \ `wmic product list brief`\n- 在 `wmic` 命令中指定输出文件，例如 `wmic output:product_list.txt\
  \ product list`\n- 通过在 `wmic` 命令末尾添加 `| filename` 将输出通过到文件\n- 通过通过 `more` 命令对输出进行管道传输，以便更好地控制输出\n\
  - 通过在命令末尾添加 `| clip` 将输出通过到剪贴板缓冲区\n\n在 `wmic` 内部使用“get”（获取）选项，你可以指定仅显示某些列。这是减少命令输出的另一种方法。图\
  \ 23.18 显示了 `wmic product get name, version, vendor` 命令的输出。\n\n![image](img/F000236f23-18-9780123985453.jpg)\n\
  \n图 23.18 `wmic` 命令的输出。\n\n### 23.3.7 终端服务\n\n所有的 Windows 服务器操作系统以及从 XP 开始的所有 Windows\
  \ 桌面操作系统都包含了一个名为“终端服务器”（Terminal Server）的功能。该软件允许用户远程登录（即连接）计算机。例如，当用户使用 `RDC`（远程桌面连接）远程登录时，它会创建一个专门用于连接的客户端会话。应用程序管理员经常使用\
  \ `RDC` 来监控和控制位于数百或数千英里之外的应用服务器上的状况。\n\n“终端服务管理器”（Terminal Services Manager）可以让你了解服务器上的连接情况。例如，它列出了运行在服务器上的用户、会话和进程。作为应用程序管理员，这些细节让你对服务器上发生的情况了如指，并能够控制谁当前连接到了服务器。\n\
  \n#### 23.3.7.1 断开连接与注销\n\n当你完成与服务器的远程连接时，你需要理解注销（logging off）和断开连接（disconnecting）之间的区别。\n\
  \n- 当你断开连接时，你与服务器的远程会话继续存在。你在会话期间启动的所有程序将继续保持激活状态。如果你以后再次登录，将重新连接到现有的会话，并看到你启动的程序仍在运行。\n\
  - 当你注销时，你的远程会话将完全关闭。你在会话期间启动的任何程序都将被终止。\n\n断开连接而不是注销会占用其他用户无法使用的资源。其中一个持续被占用的资源是会话连接。许多服务器的默认设置是同时只允许建立两个连接。让你的连接保持原样可能会防止他人连接到服务器。如果你需要你的会话保持激活状态，那是没问题的，但如果没有必要，请让它一直运行。\n\
  \n#### 23.3.7.2 终端服务管理器\n\n要打开“终端服务管理器”，左键点击 `开始 | 管理工具 | 终端服务管理器`。你看到的初始屏幕如图 23.19\
  \ 所示。它显示有一个用户连接到服务器，连接方法为“RDP”。`RDP`（远程桌面协议）是远程桌面连接（`RDC`）在连接到远程计算机时使用的协议。该用户的会话处于激活状态。\n\
  \n![image](img/F000236f23-19-9780123985453.jpg)\n\n图 23.19 终端服务管理器。\n\n在“终端服务管理器”内部，你可以断开或注销任何用户会话。要实现此操作，右键点击用户并从显示的子菜单中选择“断开连接”（Disconnect）或“注销”（Log\
  \ off）。终止别人的会话可能不会赢得任何朋友，但有些时候必须这样做。\n\n“终端服务管理器”的第二个选项卡提供了此计算机上现有会话的详细信息。图 23.20\
  \ 中的三行告知你此计算机仅允许三个会话，目前其中两个正在被使用。控制会话（console session）始终存在，且始终是 `session 0`。“客户端名称”（Client\
  \ Name）中的值提供了计算机名称。\n\n![image](img/F000236f23-20-9780123985453.jpg)\n\n图 23.20\
  \ 终端服务管理器的会话选项卡。\n\n终端服务管理器提供的其他一些功能：\n\n- 你可以通过选择用户并点击“发送消息”（Send Message）按钮（从左数第三个）向远程连接的用户发送消息，你可以用此通知用户服务器即将关机，或者你要求他们注销（注：原文此处误，保留语义含义）。\n\
  - 点击“状态”（Status）按钮（工具栏上数第六个）可以获取有关会话的统计数据。\n- 点击工具栏上数第二个“断开连接”（Disconnect）按钮可以断开会话或用户的连接。\n\
  - 点击工具栏上数第七个“注销”（Log Off）按钮可以注销会话或用户。\n\n图 23.21 是终端服务管理器第三个选项卡的截图。此选项卡显示了计算机上运行的进程。提供的细节与任务管理器（Task\
  \ Manager）类似。\n\n![image](img/F000236f23-21-9780123985453.jpg)\n\n图 23.21 终端服务器的进程选项卡。\n\
  \n### 23.3.8 计算机管理\n\n“计算机管理”（Computer Management）是一套工具和实用程序，你将用它们来控制谁可以访问服务器以及每个人拥有多少权限。它也是打开其他\
  \ Windows 工具的一种方式。计算机管理的默认界面如图 23.22 所示。点击左侧面板中的图标可以打开其他实用程序，或深入研究计算机管理的功能。这些图标及其打开的内容简述如下：\n\
  \n- “事件查看器”（Event Viewer）：允许你查看操作系统、自定义应用程序、通用应用程序或安全软件发布的事件。该实用程序在第 23.3.9 节](#CHP023.html)\
  \ 中有所讨论。\n- “共享文件夹”（Shared Folders）：列出此计算机上定义的所有共享文件夹。第 16 章 解释了如何共享驱动器。在特定驱动器上共享文件夹只是限制共享内容的一种方式。计算机管理中的此功能是检查或修改任何设置共享的驱动器或文件夹的方便之处。\n\
  - “用户”（Users）：列出访问此计算机的用户。计算机管理的这一功能在第 23.3.8.1 节](#CHP023.html) 中有更详细的描述。\n- “组”（Groups）：列出所有获得访问此计算机权限的组。“组”功能在第\
  \ 23.3.8.2 节](#CHP023.html) 中有描述。\n\n\n\n\n\n- **性能日志和警报**——此链接将带您进入性能日志和警报工具（又称为\
  \ `Perfmon`），允许您捕获操作系统内部各种指标的统计数据。`Perfmon` 工具在第 17 章中进行了描述。\n- **设备管理器**——链接到提供构成计算机或服务器的设备详细信息的屏幕。这些设备的示例包括磁盘驱动器、网络适配器、处理器、RAID\
  \ 控制器、键盘、DVD 驱动器、内存、主板以及任何存在的总线。\n- **可移动存储**——提供连接到计算机的任何可移动存储设备的洞察。例如，DVD 或 CD\
  \ 驱动器。\n- **磁盘碎片整理**——指向对服务器硬盘进行碎片整理的工具的链接。\n- **磁盘管理**——`计算机管理器` 中的一个功能，提供连接到服务器的所有硬盘的详细信息。它还提供了一些诊断功能，允许您确定物理驱动器的健康状况。此工具还允许您确定每个磁盘驱动器运行的驱动程序版本、更新驱动、卸载驱动或还原到之前的版本。\n\
  - **服务**——列出在此计算机上定义的服务。也可以通过选择 `开始 | 管理工具 | 服务` 来打开服务面板。服务在第 13 章中进行了描述。\n- **WMIC\
  \ 控制**——点击此图标将打开 Windows 管理体系工具控制。通过其对话窗口，您可以获取有关计算机的信息，包括硬件详细信息、操作系统版本和服务包信息。\n\
  - **Internet 信息服务 (IIS) 管理器**——点击此链接将打开 IIS 管理器。也可以通过选择 `开始 | 管理工具 | Internet 信息服务\
  \ (IIS) 管理器` 来启动 IIS 管理器。\n\n![image](img/F000236f23-22-9780123985453.jpg)\n\n图\
  \ 23.22 计算机器的初始界面。\n\n### 23.3.8.1 用户\n\n在用户访问计算机之前，必须在计算机上将其定义为用户。可以通过选择`计算机管理器`中“本地用户和组”内的`用户`\
  \ 图标来打开定义用户的屏幕。服务器 `OM001` 上定义的用户列表显示在图 23.22 中。带有白色“x”的红圈的用户当前处于禁用状态。可以通过右键点击该用户并选择“属性”子菜单选项获取有关用户的更多详细信息。\n\
  \n查看图 23.22，显然存在多种类型的用户。这台计算机上突出的几个用户是：\n\n- `!OM001` 与计算机本身关联。它是一个用于管理计算机和域的内置账户。\n\
  - `Administrator` 是存在于服务器上的账户，但除非专门需要使用它，否则通常是禁用的。\n- 像 `BServer` 这样的服务账户是为了支持特定应用程序而创建的。该服务可能存在于这台计算机上并在\
  \ `BServer` 账户下运行。\n- `Kbourne` 是个人用户账户的示例。在实际上，此账户可能不应该出现在此文件夹中。最佳实践是将个人用户账户分配给组。有关组的更多信息，请参见第\
  \ 23.3.8.2 节。\n- `Guest` 是为没有账户的人准备的账户。由于它不需要密码，因此该账户存在重的安全风险。`Guest` 账户应该始终保持禁用，如图\
  \ 23.22 所示。\n- 内置账户用于支持特定的应用程序或服务。这台计算机上的内置账户示例包括 `isadmin`、`ISR_N42` 和 `IAM_N42`。\n\
  \n要创建一个新账户，右键点击`用户` 链接并选择“新建用户”子菜单选项。您将看到一个窗口，其中可以输入用户名、全名、描述和密码。\n\n### 23.3.8.2\
  \ 组\n\n组是计算机上具有相同访问权限的用户集合。定义并创建有限数量的组，并将所有用户分配给一个或多个组被认为是最佳实践。原因如下：\n\n- 将新用户分配到现有组比为每个用户设置权限和访问权限更容易、更快。\n\
  - 它更具一致性，因为每个用户都与组内其他成员具有相同的权限和访问权限。\n- 移除具有特定权限的人更容易，因为您只需要移除组中的每个成员。\n- 如果用户位于具有描述性名称的组（如\
  \ `Administrators` 或 `Remote Desktop Users`）中，记录用户拥有的访问权限更容易。\n\n图 23.23 显示了特定服务器上定义的组列表。要定义新组，右键点击“组”图标并选择“新建组”子菜单项。您将看到一个窗口，其中可以添加组名、描述和成员。\n\
  \n![image](img/F000236f23-23-9780123985453.jpg)\n\n图 23.23 计算机器的初始界面。\n\n要查看组成员列表，可以双击该组，或者右键点击它并选择“属性”子菜单项。将显示组的成员身份。图\
  \ 23.24 显示了 `Administrators` 组的属性。\n\n![image](img/F000236f23-24-9780123985453.jpg)\n\
  \n图 23.24 Administrators 组中的用户。\n\n在“组”区域定义的用户可以是本地的，也可以是域范围的。如果条目通过反斜杠与名称隔开，则该用户是在更高层级定义的，例如在\
  \ Active Directory 中。本地用户则定义在您正在查看的机器上。\n\n关于用户和组，有一些您应该能够回答的问题：\n\n- 您的审计过程是否要求您定期列出所有组及其访问权限？\n\
  - 审计过程是否要求您定期列出每个组的成员？\n- 您是否有一个报告或流程可以列出此计算机上的所有用户、组和组成员，以满足此审计要求？\n- 此报告或流程是否定期运行？\n\
  - 是否有人定期确认每个用户、组和组成员是否是需要的？\n- 如果需要删除用户、组或组成员，是否有相应的流程来跟进？\n\n### 23.3.9 事件查看器\n\
  \nWindows 操作系统在发生意外事件或错误情况时会创建日志条目。应用程序管理员可以使用事件查看器工具查看这些日志条目。可以通过选择 `开始 | 管理工具\
  \ | 事件查看器` 来打开此工具。图 23.25 显示了事件查看器的默认界面。\n\n![image](img/F000236f23-25-9780123985453.jpg)\n\
  \n图 23.25 事件查看器。\n\n日志条目被分为五类不同的消息。当您点击这些类别之一时，事件查看器的主面板将仅列出与所选类别相关的日志条目。\n\n- \
  \ (Application)\n- 安全 (Security)\n- 安装 (Setup)\n- 系统 (System)\n- 目录 (Directory service)—仅当计算机配置为域控制器时存在\n\
  - 文件复制服务器 (File replication server)—仅当计算机配置为域控制器时存在\n- DNS 服务器 (DNS server)—仅当计算机配置为\
  \ DNS 服务器时存在\n\n日志条目被分为不同的级别。这里显示了从最低优先级到最高优先级的级别。注意，两种类型的审计日志默认是禁用的。如果您希望启用它们，系统管理员需要启用它们。\n\
  \n\n\n\n\n- **审核失败（Failure Audit）**——正在审计的安全访问尝试失败\n- **审核成功（Successful Audit）**——正在审计的安全访问尝试成功\n\
  - **信息（Information）**——发生了成功操作并已记录\n- **警告（Warning）**——发生了一个目前看来并不重要的事件，但可能预示着未来会出现问题\n\
  - **错误（Error）**——发生了严重问题\n\n要查看特定条目的所有详细信息，请双击该条目。将显示如图 23.26 所示窗口。可以通过点击屏幕右侧的上、下箭头来浏览事件查看器中的所有事件。点击\
  \ `Copy`（复制）按钮可以将当前选中事件的详细信息复制并粘贴到剪贴板缓冲区。如果你需要记录某个事件，这会非常有用。\n\n![image](img/F000236f23-26-9780123985453.jpg)\n\
  \n图 23.26 事件查看器中的特定事件。\n\n#### 23.3.9.1 应用程序事件\n\n应用程序可以自由地向事件查看器显示的 Windows 日志文件发布条目。某些供应商选择在\
  \ Windows 日志文件中发布条目，而另一些则选择自己的日志文件。如果应用程序的文档没有指定日志条目的发布位置，你应该询问他们的支持台。\n\n如果供应商选择将条目发布到\
  \ Windows 日志文件，你可以通过点击日志条目的 `Application`（应用程序）类别来访问它们。\n\n#### 23.3.9.2 导出事件日志\n\
  \n如果你支持的应用程序将条目写入 Windows 日志文件，那么他们的支持台可能会要求你导出这些条目并将导出文件发送给他们。使用事件查看器创建的导出文件默认扩展名为\
  \ `.evtx`。除非你有充分理由不这样做，否则你应该坚持使用默认扩展类型。\n\n导出日志条目的步骤如下：\n\n- 右键点击 `Windows Logs\
  \ | Application`\n- 选择 `Save all events as`（将所有事件保存为）子菜单选项\n- 输入 `File name`（文件名），如果需要，更改写入文件的子目录\n\
  - 点击 `Save`（保存）按钮\n\n### 23.3.10 Dr. Watson\n\n当应用程序崩溃或异常终止（abends）时，可以设置操作系统使用一个名为\
  \ `Dr. Watson` 的工具来创建转储文件。转储文件包含了问题发生时计算机正在发生的情况。捕获的细节包括：\n\n- 导致崩溃的程序名称\n- 崩溃的日期\n\
  - 导致崩溃的错误\n- 计算机名称、用户名、会话 ID、处理器数量、操作系统等详细信息\n- 崩溃时运行的进程列表\n- 每个进程使用的内存位置\n- 每个进程的寄存器内容\n\
  - 每个运行进程的符号\n- 崩溃程序所用内存的转储\n- 每个运行进程的栈内容\n\nDr. Watson 有一个允许你调整设置的用户界面。在命令提示符中，输入\
  \ `drwtsn32` 并按回车。将显示如图 23.27 所示的截图。从该界面中，你可以调整 Dr. Watson 以按照你想要的方式运行。此屏幕也是查看它在哪里写入转储文件的简单方法。\n\
  \n![image](img/F000236f23-27-9780123985453.jpg)\n\n图 23.27 Dr. Watson 用户界面。\n\n\
  理解转储文件并不特别容易。它需要知识和大量的经验。特别是，如果你熟悉十六进制系统，对于理解转储文件非常有帮助。如果你的应用程序崩溃了，供应商的技术支持组可能会向你索要创建的转储文件。在应用程序反复崩溃时尤其是如此。如果供应商要求你向他们发送转储文件，你可以打开\
  \ Dr. Watson 界面找到它然后将其发送给他们。\n\n### 23.3.11 Windows 注册表\n\nWindows 注册表是一个数据库，用于存储任何设计用于它的软件的详细信息和选项。第三方应用程序可能会在注册表中存储信息，也可能被设计为在\
  \ `ini`（初始化）或 `config`（配置）文件中保留详细信息。如果应用程序将配置设置信息写入注册表，那么这几乎是在安装过程中完成的。\n\n在某些情况下，你可能需要编辑注册表。一个场景示例是开启或关闭应用程序执行的调试级别日志。对注册表进行错误更改会对应用程序产生灾难性的影响。如果供应商建议你对其进行更改，我有以下建议：\n\
  \n- 获取书面指令。这不是一个你想要随意进入并进行更改的领域。拥有关于具体需要更改内容的书面文档至关重要。\n- 在编辑注册表之前，强烈考虑备份服务器或至少备份注册表。备份注册表的指令列在第\
  \ 23.3.11.1 节中。\n- 在修改任何注册表设置之前，进行记录或截图。\n- 在 `Production` 环境、`Test` 或 `QA` 环境进行更改。如果你进行了多次更改并出现问题，你将不知道是哪项更改导致的。\n\
  \n23.3.11.1 备份注册表\n\n备份注册表的步骤列在这里。此过程只需要几分钟。\n\n1. 选择 `Start | All Programs | Accessories\
  \ | System Tools | Backup`\n2. 点击 `Next` 按钮\n3. 选择 `Back up files and settings`\n\
  4. 选择 `Let me choose what to back up`\n5. 勾选 `My Computer`\n6. 展开后点击 `System State`\n\
  7. 点击 `Next` 按钮\n8. 点击 `Browse` 按钮选择备份文件所在的目录\n9. 为备份文件命名或接受默认名称 `Backup`\n10. 点击\
  \ `Next` 按钮\n11. 点击 `Finish` 按钮\n\n你将看到 `Backup Progress` 屏幕。备份完成只需不到一分钟。\n\n###\
  \ 23.3.12 Regedit\n\nRegedit 是用于编辑注册表的工具。要启动它，打开命令提示符窗口并输入命令 `regedit`。图 23.28 是\
  \ Regedit 界面的截图。左侧面板允许你进入特定的用户、硬件、程序或软件包的组件。\n\n![image](img/F000236f23-28-9780123985453.jpg)\n\
  \n图 23.28 Regedit 界面。\n\n供应商的说明应明确指出你应该进入哪个级别以及更改什么。例如，某个供应商的软件在注册表中有一个用于启用或禁用应用程序日志功能的条目。该设置如图\
  \ 23.29 所示。要启用日志，必须编辑 `Logging` 条目并将其值更改为 1。要禁用日志，应将值更改为 0。\n\n![image](img/F000236f23-29-9780123985453.jpg)\n\
  \n图 23.29 注册表中的应用程序特定条目。\n\n### 23.3.13 查询命令\n\n\n\n\n\n在命令提示符中输入 `query` 将显示有关系统活动的的各种信息。这些信息也可以从其他源获取，例如\
  \ `Task Manager`（任务管理器），但如果你已经打开了命令窗口，使用 `query` 命令会更快、更方便。\n\n可用的选项描述如下：\n\n• `query\
  \ process`—显示由你的账户拥有的进程\n• `query process *`—显示所有进程\n• `query process username`—显示由用户名拥有的进程\n\
  • `query session`—显示计算机上所有的会话\n• `query session /SERVER:server_name`—显示在远程计算机上运行的所有会话\n\
  • `query user`—列出所有登录到服务器的用户\n\n## 23.3.14 路径 (Path)\n\n`path` 环境变量被许多（甚至是大部分）应用程序使用。应用程序的可执行文件的位置（即目录）由安装程序或应用程序管理员手动添加到\
  \ `path` 变量中。这使得操作系统能够找到并启动该应用程序。可以在提示符窗口中运行并显示 `path` 变量内容的两个命令是：\n\n• `echo %path%`\n\
  • `set path`\n\n## 23.4 计算机上运行着什么\n\n有时你需要知道服务器上正在运行哪些进程。Windows 提供了几种工具可以为你收集这些信息。其中一些工具已经描述过。对于这些工具，将提供非常简短的描述，并指向详细描述该内容的原始章节。\n\
  \n### 23.4.1 任务管理器 (Task manager)\n\nWindows `Task Manager` 列出了当前在计算机上运行的所有进程。它安装在每台\
  \ Windows 计算机上，并且非常启动和使用。`Task Manager` 在第 17 章中有所介绍。每个进程显示的默认列包括：\n\n• 进程名称\n•\
  \ 启动它的用户\n• 进程使用的 CPU 时间\n• 进程使用的内存量\n• 进程描述\n\n你可以轻松地添加或删除 `Task Manager` 显示的列。执行此操作，请在\
  \ `Task Manager` 中选择菜单选项 `View | Select Columns`。将显示图 23.30 所示的屏幕。勾选你想显示的指标，并取消勾选你不想在\
  \ `Task Manager` 中显示的指标。\n\n![image](img/F000236f23-30-9780123985453.jpg)\n\n图 23.30\
  \ 向任务管理器添加列。\n\n### 23.4.2 性能监器 (Perfmon)\n\n`Perfmon`（Performance Monitor）是 Windows\
  \ 操作系统的一个性能测量工具。它允许你精确选择想要测量的内容以及采样的频率。`Perfmon` 在第 17 章中有所描述。\n\n可以选择的性能对象之一是“进程\
  \ (Process)”。如果选择了此对象，你可以选择一个或多个计数器进行捕获。你还可以选择为每个进程捕获此数据，或仅针对你选择的进程。\n\n• `% Processor\
  \ Time`\n• `% User Time`\n• `Elapsed Time`\n• `Handle Count`\n• `IO Read Bytes/sec`\n\
  • `Page Faults/sec`\n\n### 23.4.3 进程管理器 (Process explorer)\n\n`Process Explorer`\
  \ 是一个非常有用的工具，提供了许多应用程序管理员可以利用的特性。毫不夸张地说，无论投入这个工具投入多大空间都是不够的。`Process Explorer` 功能的部分列表如下：\n\
  \n• 列出计算机上运行的所有进程，并带有描述和开发它的公司名称\n• 列出每个进程使用的 CPU 时间\n• 显示系统活动，例如 CPU 使用率、物理内存使用情况、分页活动、I/O\
  \ 活动、内核内存、分页\n• 通过树形结构显示哪些进程是由其他进程产生的\n• 将光标悬停在进程上，弹出框将显示进程背后的可执行文件和或服务的名称和路径\n\
  • 树形结构中的进程及其子进程可以展开或最小化。这更容易关注特定的进程\n• 可以杀死单个进程或整个进程树\n• 右键点击进程会弹出一个多标签窗口，提供有关该进程的深度信息、其可执行文件路径、性能统计、网络活动、该进程使用的任何端口等\n\
  • 列出登录服务器的用户\n• 允许你搜索当前使用句柄（handle）或 DLL 的进程\n• 列出当前加载到内存中的所有 DLL 以及哪些进程在使用它们\n\
  • 调用 Google 以查找有关 DLL 或进程的详细信息\n• 列出所有存在的句柄以及拥有每个句柄的进程\n• 修改进程的优先级\n• 允许你控制每个进程被允许在哪些处理器上运行\n\
  • 允许你挂起或重启进程\n\n你对这个工具探索得越多，发现的使用方法就越多。这绝对是你需要熟悉的工具。`Process Explorer` 的初始界面见图 23.31。\n\
  \n![image](img/F000236f23-31-9780123985453.jpg)\n\n图 23.31 进程管理器。\n\n## 23.5 从命令提示符启动\
  \ GUI 工具\n\n在本章早些部分，描述了命令提示符的功能。除了只有在命令提示符中使用的命令外，还有方法从命令提示符打开许多基于 GUI 的工具。如果你已经有一个命令提示符，打开它们会快得多。以下是用于打开工具或实用程序的命令\n\
  \n| 命令 | 启动的工具 |\n| :--- | :--- |\n| `Appwiz.cpl` | 添加或删除程序 |\n| `compmgmt.msc`\
  \ | 计算机管理 |\n| `control` | 控制面板 |\n| `control admintools` | 管理工具 |\n| `control folders`\
  \ | 允许你设置文件夹选项的窗口 |\n| `control schedtasks` | 任务计划 |\n| `desk.cpl` | 桌面属性 |\n| `devmgmt.msc`\
  \ | 设备管理器 |\n| `diskmmt.msc` | 磁盘管理 |\n| `drwtsn32` | Watson 博士 |\n| `eventvwr.msc`\
  \ | 事件查看器 |\n| `firewall.cpl` | Windows 防火墙 |\n| `fsmgmt.msc` | 显示定义的共享文件夹 |\n|\
  \ `intl.cpl` | 区域和语言 |\n| `lusrmgr.msc` | 显示用户和组 |\n| `mstsc` | 远程桌面连接 |\n| `ncpa.cpl`\
  \ | 网络连接 |\n| `nlbmgr.exe` | 网络负载均衡管理器 |\n| `odbcc32.cpl` | ODBC 管理器 |\n| `perfmon.msc`\
  \ | 性能监器 |\n| `regedit.exe` | 启动注册表编辑器 |\n| `services.msc` | Windows 服务 |\n| `sysdm.cpl`\
  \ | 系统属性 |\n| `tscc.msc` | 终端服务管理器 |\n| `wuaucpl.cpl` | Windows 更新 |\n\n## 23.6\
  \ 远程工作工具\n\n在本章前面的部分，描述了命令提示符的力量。除了只有在命令提示符中才使用的命令外，还有方法从命令提示符打开许多基于 GUI 的工具。作为应用程序管理员，你职业生涯中的每天都会进行远程工作。即使你坐在办公室的桌前，也很可能所有的应用程序服务器不在你桌子上。你需要从工作站或笔记本远程连接到它们以支持应用程序。本节介绍了一些用于远程工作的工具。\n\
  \n### 23.6.1 VPN—虚拟专用网络\n\n虚拟专用网络（VPN）在第 15 章中被描述过。在那种背景下，VPN 被描述为允许用户通过互联网远程连接到组织网络。作为应用程序管理员，你几乎肯定也会这样做。你可能在半夜接到电话，说某个应用程序崩溃了。你不需要开车去办公室，可以打开笔记本电脑，使用\
  \ VPN 工具安全地登录到组织网络，并在穿睡衣时解决问题。\n\n### 23.6.2 远程桌面连接 (RDC)\n\n\n\n\n\n远程桌面连接（RDC）是微软的一个产品，允许你连接到远程计算机。几乎所有的微软计算机默认都安装了\
  \ RDC。要启动 RDC，请点击“开始菜单 | 所有程序 | 辅助工具 | 远程桌面连接”。如果你频繁使用 RDC，可以将其固定到“开始”菜单中，以便随时快速访问。\n\
  \n图 23.32 显示了启动 RDC 时显示的屏幕。一旦你按照自己的设置好了 RDC，就可以点击左下角的“选项”按钮。这会将屏幕缩小，只显示 图 23.33\
  \ 所示的基本内容。\n\n![image](img/F000236f23-32-9780123985453.jpg)\n图 23.32 启动远程桌面连接。\n\
  \n![image](img/F000236f23-33-9780123985453.jpg)\n图 23.33 RDC 最小化屏幕。\n\n要成功连接到远程计算机，需要在\
  \ 图 23.34 所示的三个字段中输入准确的信息。预期的值如下：\n\n* 用户名—你登录时使用的用户名\n* 密码—上述账户的密码\n* 登录到—此字段的值可以是域，也可以是你正尝试远程连接的计算机名称。如果你选择了“本地计算机”，则该账户必须是该计算机上的本地账户。如果你选择了域，则该账户必须存在于所选域中。\n\
  \n![image](img/F000236f23-34-9780123985453.jpg)\n图 23.34 登录到远程计算机。\n\n为了能够创建到另一台计算机的远程连接，目标计算机必须识别该账户。设置账户有两种方法：\n\
  \n1. 账户可以被设置为计算机上的本地账户。\n2. 账户可以存在于域中，并添加到目标计算机上的用户列表中。\n\n管理员组中的任何人都可以在计算机上创建本地账户。请参阅\
  \ 第 23.3.8 节 “计算机管理”，获取如何在目标计算机上创建账户的步骤。\n\n除了在目标计算机上拥有账户外，你的账户必须属于“远程桌面用户”组。如果你的账户是管理员组的成员，那么这个要求可能已经满足了。\n\
  \n### 23.6.2.1 重用 RDC 连接\n\n如果你有一组经常远程访问的计算机，可以将每台远程计算机的 RDC 连接设置保存到文件中。当你双击该文件时，RDC\
  \ 将启动，你将直接进入 图 23.34 所示的屏幕。要创建这些 RDP 文件，只需点击 图 23.32 所示屏幕上的“另存为”按钮。在提示时，恰当地命名文件。将所有\
  \ RDP 文件保存到单个子目录中可以更容易一次性看到所有连接文件。图 23.35 显示了一组 RDP 文件。\n\n![image](img/F000236f23-35-9780123985453.jpg)\n\
  图 23.35 为 RDC 设置连接文件。\n\n当你想要注销远程计算机时，需要小心。如果你点击“开始”按钮，将根据操作系统的不同出现三个选项：\n\n* 注销（Log\
  \ Off）—大多数情况下这是你需要的。注销会关闭连接。这将释放连接，以便其他人可以远程连接到此服务器。\n* 断开（Disconnect）—如果你选择此选项，你的会会在远程计算机上将保持激活状态。稍后可以使用\
  \ RDC 重新连接到该服务器并回到原来的会话。如果你在远程服务器上启动了一个想要继续运行的进程，选择此选项是合适的。你可以断开连接，任务将在无需监控的情况下继续。\n\
  * 关闭（Shut Down）—顾其字面意思——它会关闭服务器。很有可能这不是你想做的。你可能想要关闭服务器的一个例子是，为了使更改生效而需要重启服务器。如果你这样做，请确保你选择了“重启”选项。服务器将关闭但不会自动启动。\n\
  \n### 23.6.2.2 RDC 背景\n\n如果你阅读或研究 RDC，可能会遇到几个相关的术语：\n\n* RDC 以前被称为终端机服务（Terminal\
  \ Services）。\n* RDC 使用的协议是远程桌面协议（RDP）。\n\n如果你听到有人在谈论这些术语，你可能指的是同一个产品。\n\n### 23.6.3\
  \ Telnet\n\nTelnet 指一种网络协议，可以用于局域网（LAN）或互联网，在远程计算机上打开命令行界面。Telnet 开发于一个大多数网络计算机处于学术界、且安全还不被认为重要的时代。由于它默认不加密数据，telnet\
  \ 的使用已经减少。\n\n要与另一台计算机建立 telnet 连接，输入：\n\n```telnet computer_name port\n```\n\n\
  ### 23.6.4 PuTTY\n\nPuTTY 是一种终端模拟器，可用于与远程计算机创建连接。PuTTY 易用、强大，而且它是免费的。图 23.36 显示了启动\
  \ PuTTY 时看到的屏幕。在“主机名”（Host Name）字段中输入要连接的计算机名称或 IP 地址。如果端口和连接类型设置正确，然后点击“打开”。连接建立后，你将进入标准会话。\n\
  \n![image](img/F000236f23-36-9780123985453.jpg)\n图 23.36 PuTTY 的默认屏幕。\n\n### 23.6.5\
  \ WinSCP\n\n很多时候你需要在计算机之间移动或复制文件。例如，你可能需要从工作站到服务器，或者需要从数据库服务器复制备份文件。WinSCP（Windows\
  \ 安全复制）是一种允许在计算机之间安全传输文件的实用程序。图 23.37 显示了初始 页面。在此页面上，你创建以后用于连接的会话。左侧面板允许你定义用于连接的参数。\n\
  \n![image](img/F000236f23-37-9780123985453.jpg)\n图 23.37 WinSCP 连接页面。\n\n一旦选择或设置了会话详情，点击“登录”按钮。将显示的屏幕如\
  \ 图 23.38 所示。左面板显示本地硬盘的内容，而右侧面板显示远程计算机硬盘的内容。\n\n![image](img/F000236f23-38-9780123985453.jpg)\n\
  图 23.38 WinSCP 传输屏幕。\n\n在此屏幕上可以执行的一些操作包括：\n\n* 在左侧面板上，可以通过在下拉框中选择驱动器来从本地计算机定义的驱动器。\n\
  * 在左侧面板上，你可以向上移动本地硬盘的目录结构。\n* 在右侧面板上，你可以向上移动远程计算机硬盘的目录结构。\n* 点击一个或多个文件后，可以按 `F5`\
  \ 键将其到另一个驱动器。\n* 按 `F6` 将文件从选定的驱动器移动到另一个驱动器。\n* 按 `F8` 删除文件。\n* 按 `F9` 显示选中文件的属性。\n\
  * 按 `Shift + F2` 比较当前选的子目录。\n* 按 `Ctrl + F5` 同步当前子目录。\n* 在本地和远程面板上都可以添加或丢弃列。\n\n\
  \n\n\n\n-   文件可以在本地和远程面板的任何列上进行排序。\n\n### 23.6.6 使用远程控制工具\n\n许多产品都承诺让在工作中远程访问你的\
  \ PC 就像登录网站一样简单。虽然这些工具的安全性尚有争论，但毫无疑问的是，你用于发起会话的计算机是不安全的。位于复印店、机场、酒店大堂和其他类似地点的电脑很容易被感染键盘记录器。无论密码有多强，如果坏人能从键盘记录日志文件中读取到它，那么密码就变得一文不值了。避免这种漏洞的方法非常简单——不要在不安全的计算机上使用远程控制工具。\n\
  \n### 23.6.7 使用 Windows 资源管理器在服务器之间移动文件\n\n在很多时候，你需要将文件从一个应用服务器移动到另一个服务器。例如，你可能需要将文件从\
  \ `DEV` 服务器移动到 `QA` 服务器。有很多方法可以实现这一点，但最简单的方法之一是使用 Windows 资源管理器。\n\n图 23.39 显示了服务器上打开的两个\
  \ Windows 资源管理器实例。它们都是通过右键单击开始按钮并选择“打开 Windows 资源管理器”打开的。后台实例没有更改，因此它显示的是服务器上的本地驱动器。\n\
  \n![image](img/F000236f23-39-9780123985453.jpg)\n\n图 23.39 使用 Windows 资源管理器移动文件。\n\
  \n打开第二个实例后，我点击了顶部的地址栏，输入了我想要工作的另一个服务器的名称。在这种情况下，名称为 `\\\\om003\\c$`。现在我可以将文件或文件夹图标从任一个\
  \ Windows 资源管理器实例拖动到另一个，以复制文件夹或文件。在这个示例中，我指定了 `C:` 盘，但我同样可以轻松指定 `D:` 盘或 `C:` 盘上的特定文件夹。\n\
  \n使用这种技术在计算机之间移动文件存在局限性。我所知的局限性包括：\n\n- 两台计算机需要处于同一个网络中\n- 你必须在第二台计算机上拥有账户\n- 你指定的驱动器或文件夹必须已共享\n\
  \n## 23.7 测试连通性的工具\n\n在很多时候，你需要确认两台计算机是否能够相互通信。本节列出了许多可测试连通性的工具。\n\n### 23.7.1 Ping\n\
  \n也许最基础的连通性工具是 `ping`。它测试计算机在 IP（网际协议）网上是否可访问。要运行 ping 测试，请打开命令提示符并输入 `ping` 命令以及计算机名称或\
  \ IP 地址。图 23.40 显示了 `ping` 命令的结果。如果目标计算机可访问，则回复语句将指示已收到成功回复。\n\n![image](img/F000236f23-40-9780123985453.jpg)\n\
  \n图 23.40 Ping 命令。\n\n### 23.7.2 Tracert\n\n`Tracert` 或 `traceroute` 类似于 `ping`，用于确定是否与另一计算机建立连接，但它提供了额外的细节。`Tracert`\
  \ 显示了数据包跨网络到达目的地的路由。通信数据包不会直接从源移动到目的地。消息会在沿途多个服务器之间传递。输出中路径上每个跳数或计算机的详细信息显示在单独行。\n\
  \n`tracert` 的格式和输出所示图 23.41。格式是输入命令，然后是目的地的名称或 IP 地址。我特意选择了一台不是本地的计算机，以便输出更有趣。\n\
  \n![image](img/F000236f23-41-9780123985453.jpg)\n\n图 23.41 Tracert 命令。\n\n### 23.7.3\
  \ Pathping\n\n`Pathping` 是一种实际上结合了 `ping` 和 `tracert` 的实用程序。它显示消息在到达目的地途中经过的中间服务器。也许最大的区别是它根据更长的时间产生性能统计数据。这通常使得\
  \ `pathping` 更加准确，因为单次良好或糟糕的传输不会扭曲统计结果。\n\n### 23.7.4 Tnsping\n\n`tnsping` 命令允许你判断\
  \ Oracle 数据库服务器上的监听器（listener）是否可用。命令格式为 `tnsping service_name`。服务名称可以在 Oracle 客户端安装子目录下的\
  \ `tnsnames.ora` 文件中找到。如果 `tnsping` 命令失败，你应该联系组织的 `DBA`（数据库管理员）团队，请他们确认数据库和监听器均正常运行\
  \ (图 23.42)。\n\n![image](img/F000236f23-42-9780123985453.jpg)\n\n图 23.42 tnsping\
  \ 命令。\n\n### 23.7.5 NSlookup\n\n`nslookup`（名称查询）是一种实用程序，用于查询域名系统（DNS）中关联的 IP 地址。命令格式为\
  \ `nslookup computer_name`，其中 `computer_name` 是你感兴趣的计算机。如果你的应用程序连接出现问题，运行 `nslookup`\
  \ 可以确定服务器是否返回了 IP 地址。图 23.43 显示了 `nslookup` 命令的结果。返回的第一组数据是 DNS 服务器的名称和 IP 地址。\n\
  \n![image](img/F000236f23-43-9780123985453.jpg)\n\n图 23.43 nslookup 命令。\n\n## 23.8\
  \ Windows 技巧\n\n无论你使用 Windows 多久，总会有一些你可能还不知道的技巧和快捷键。希望本节包含一些让你产生依赖并让工作轻松一点的小技巧。\n\
  \n### 23.8.1 Windows 资源管理器技巧\n\n你可以通过 Windows 资源管理器在任何子目录中打开命令窗口。按住 `Shift` 键并右键单击子目录。在菜单中选择“在此处打开命令窗口”，命令行将在该子目录启动。如果目录树很深，这个技巧可以节省大量输入时间。\n\
  \n对文件有疑问时，可以右键点击它并选择“属性”菜单选项。这通常会显示关于文件及其历史等有用信息。\n\n### 23.8.2 屏幕截图\n\n如果你还不熟悉键盘上的\
  \ `PrtScn` 键，那么是时候开始使用它了。使用 `PrtScn` 键捕取的屏幕非常适合文档、报告问题和创建培训材料。\n\n`PrtScn` 捕取的精确内容取决于按了哪些键。\n\
  \n- 仅按下 `PrtScn` 键会捕获屏幕上显示的所有内容。如果你有多个显示器，它会捕获所有显示器的内容。\n- 同时按下 `Alt` + `PrtScn`\
  \ 键仅捕获当前焦点的窗口。\n\n`PrtScn` 捕取的图像保存在剪贴板缓冲区中。可以通过按下 `Ctrl` + `V` 组合将其粘贴到 Word 文档、Excel\
  \ 表格单元格、电子邮件、画图或其他应用程序中。\n\n### 23.8.3 画图功能强大\n\n\n\n\n\n微软计算机预装的画图程序可能不是世界上最复杂的图像处理工具，但对于应用程序管理员的许多需求来说已经足够了。使用\
  \ `PrtScn` 键捕获屏幕并按 `Ctrl + V` 键粘贴到画图中。然后你可以根据需要对图像进行裁剪和修。在发送给供应商或用户之前，你还可以覆盖图像上的任何敏感信息。\n\
  \n画图可以使用以下格式保存图像。它还可以用于将图像从一种文件类型转换为另一种。\n\n- `PNG`\n- `JPEG`\n- `BMP`（包含 16 色和\
  \ 256 色版本）\n- 单色 BMP (`Monochrome BMP`）\n- `GIF`\n- `TIFF`\n\n### ### 23.8.4 其他\
  \ Windows 技巧\n\n以下提示不属于上述任何类别，因此我将收集在了一起。\n\n#### 23.8.4.1 循环所有打开的进程\n\n如果你连续按下\
  \ `Alt-Tab` 键，Windows 将在你打开的所有会话和工具之间循环切换。这比寻找任务栏上想把哪个图标带到前台要快得多。\n\n#### 23.8.4.2\
  \ 粘贴文件名\n\n如果完整的文件和路径名已经存在某处，那么在 `Word`、`Excel`、`Notepad`、`Notepad++` 等程序中打开文件有一种非常快的方法。例如，如果文档或日志文件的名称就是你想打开的文件，请按照以下步骤操作：\n\
  \n1. 高亮路径和名称\n2. 按 `Ctrl + C` 将其复制到剪贴板缓冲区\n3. 在 `Word`、`Notepad` 等中，点击菜单项 `文件 |\
  \ 打开`\n4. 点击 `文件名` 字段并按 `Ctrl + V` 粘贴文件名\n5. 点击 `打开` 按钮\n\n当文件名被打印到日志文件中且你想打开它时，这非常非常用。它节省了你逐层查阅目录树的时间。这个技巧在大多数具有\
  \ `文件 | 打开` 功能的程序上都有效。\n\n#### 23.8.4.3 从已删除文件中恢复空间\n\n当你删除文件时，它们通常会被移动到回收站而不是被实际删除。在它们从回收站中删除之前，它们占用的空间不会释放。你可以通过右键点击\
  \ `Windows 资源管理器` 中的回收站项并选择 `清空回收站` 来清空它。\n\n# 第 24 章：UNIX 工具\n\n## ### 摘要\n\nUNIX\
  \ 服务器上的应用程序管理员可以使用许多工具。本章描述的大多数工具都是命令行类型的工具，可以在其中一个 UNIX shell 中执行。\n\n### ### 关键词\n\
  \nUNIX；shell；命令行；大小写敏感；环境变量；重定向；管道；启动作业（launch jobs）；基础 UNIX 命令；命令历史；跟踪作业；终止作业；后台；前台；调度作业；安全；文件访问；文本编辑器；核心转储（core\
  \ dumps）；连接性\n\n本章是对 UNIX 的介绍。如果你不熟悉 UNIX，那么本章足以让你对在 UNIX 服务器上支持应用程序时会遇到的某些任务有一个基本的了解。如果服务器的操作系统是\
  \ UNIX，那么请务必阅读市面上许多优秀的 UNIX 书籍之一。在此期间，阅读本章以快速体验 UNIX。\n\n本章中有许多地方对 Windows 和 UNIX\
  \ 进行了比较。之所以这样做是因为我观察到，通常应用程序管理员对 Windows 的经验比对 UNIX 的丰富。通过提供与 Windows 的对比，我希望用许多读者熟悉的术语和概念来解释\
  \ UNIX。\n\n## ### 24.1 UNIX 简介\n\n以下章节仅提供了 UNIX 系统最基本的背景知识。我试图保持这些内容的广泛性，并针对应用程序管理员在履行职责期间需要执行的活动。\n\
  \n### ### 24.1.1 Shell\n\nUNIX 中用户与操作系统之间的接口被称为 shell。用户输入的命令由 shell 解释然后执行。脚本（Scripts，即写在文件中的命令集合）也会在\
  \ shell 中执行。\n\n#### #### 24.1.1.1 可用的 shell\n\nUNIX 操作系统下有多个可用的 shell。每个 shell\
  \ 都有自己的重点和优势。你可以通过输入以下命令来确定你正在哪个 shell 中工作：\n\n```\necho $SHELL\n```\n\n最常用的 shell\
  \ 有：\n\n- Bourne shell（波恩 壳）——这是最初的 UNIX 命令行解释器。它由 Stephen Bourne 在 AT&T 编写，并于 1977\
  \ 年随第 7 版 UNIX 发布。输入命令 `sh` 运行 Bourne shell。坦白说，虽然我们姓氏相同，我很确定 Stephen Bourne 和我没有亲戚。\n\
  - C shell（C 壳）——由 Bill Joy 编写。它基于 C 语言。要切换到 C shell，请在命令行输入命令 `csh`。\n- Korn shell（科恩\
  \ 壳）——由 David Korn 在贝尔实验室工作期间开发。要切换到 Korn shell，请在命令行输入命令 `ksh`。\n\n如果你想永久更改使用的\
  \ shell，是可以实现的。第一步是确认你想要切换的 shell 是否在你的服务器上可用。一旦确认了这一点，你就可以带有以下参数运行 `chsh` 命令：\n\
  \n```\nchsh –s shell_name user_name\n```\n\n其中 `shell_name` 是你想要的 shell 类型：`/bin/ksh`、`/bin/csh`、`/bin/sh`\
  \ 等。\n\n最后一个参数 `user_name` 是要更改的用户。\n\n#### #### 24.1.1.2 Shell 脚本\n\n在命令行输入的命令可以写到文件中并执行。包含此类命令列表的文件被称为\
  \ shell 脚本。如果你熟悉 DOS 或 Windows 的 `.bat` 文件，那么 shell 脚本就是 UNIX 等等物。\n\nShell 脚本具有巨大的威力，但需要经验和实践才能正确编写。作为应用程序管理员，你更有可能会执行供应商提供的\
  \ shell 脚本。\n\n如果你有编程或技术背景，没有理由不编写自己的 shell 脚本来简化或自动化你需要执行的任务。我唯一的建议是在新的 shell 脚本投入生产环境之前，在测试或开发平台上进行彻底测试。像任何其他代码更改一样，编写糟糕的脚本可能会造成损害。\n\
  \n### ### 24.1.2 命令行\n\n在 Windows 中，与系统交互的默认方法是通过图形或 GUI 工具。这些图形工具是大多数用户熟悉的。一些快速例子包括：\n\
  \n- `Windows 资源管理器`用于显示子目录和文件\n- `任务管理器`显示运行的进程\n- `控制面板`和`管理工具`允许你查看或修改系统\n- `计算机管理`允许你添加或修改访问服务器的用户\n\
  - 服务面板列出了服务及其当前状态和属性\n\n在 UNIX 系统上，命令行是与系统交互的主要方法。需要的一切都可以通过在命令提示符输入命令来实现。即使有 GUI\
  \ 工具可以完成相同的操作，在大多数情况下，命令行界面（CLI）具有 GUI 方法不存在的附加功能或选项。\n\n图 24.1 所示的截图显示了典型的命令行界面外观。为了连接到这个特定的服务器，我使用了一个名为\
  \ `PuTTY` 的工具连接到远程服务器。本章显示的所有命令都可以在此屏幕显示的提示符处输入。\n\n![image](img/F000248f24-01-9780123985453.jpg)\n\
  \n图 24.1 典型的 UNIX 命令行界面。\n\n### ### 24.1.3 大小写敏感\n\n\n\n\nWindows 和 DOS 之间的一个显著区别是大小写敏感。Windows\
  \ 中的名称和命令是不区分大小写的。相反，UNIX 是区分大小写敏感。在 Windows 系统上，`Test_File.txt` 和 `test_file.txt`\
  \ 指向同一个文件。在 `UNIX` 上，它们代表不同的文件。对于一个新的 `UNIX` 用户来说，当引用的文件显示不存在时感到沮丧是非常常见的。在抓狂之前，请检查并确保你输入的文件名与实际文件名的大小写完全一致。\n\
  \n### 24.1.4 环境变量\n\nUNIX 与 Windows 一样，拥有可以由应用程序、shell 脚本和命令行界面输入的命令设置并使用的环境变量。UNIX\
  \ 在这方面相对于 Windows 的一个愉快优点是，UNIX 对环境变量的数量或其命名几乎没有限制。环境变量通常全用大写字母。虽然这不是强制要求的，但这使得它们在\
  \ shell 脚本、文件和命令中更容易识别。\n\n要查看所有环境变量列表，请输入命令 `env`。图 24.2 显示了该命令及其输出。要查看单个环境变量，输入\
  \ `echo $` 然后加上特定变量。例如，命令 `echo $SHELL` 列出了当前正在使用的 shell。\n\n![image](img/F000248f24-02-9780123985453.jpg)\n\
  \n图 24.2 UNIX 中的环境变量。\n\n一个常用的环境变量是 `PATH`。它是一个多值变量，列出了在运行可执行文件时将搜索的所有子目录。图 24.2\
  \ 显示了路径变量当前的内容的内容。\n\n以下 UNIX 命令可用于查看或操作环境变量。\n\n| `env` | 返回所有定义的环境变量 |\n| `setenv\
  \ NEW_VARIABLE new_value` | 定义一个新的环境变量 |\n| `unset VARIABLE_NAME` | 移除 `variable-name`\
  \ 的定义 |\n| `unsetenv VARIABLE_NAME` | 完全删除该变量 |\n| `set PATH=(/usr/local /usr/bin\
  \ /bin /etc \\.)` | 将 `PATH` 设置为多值变量。注意——如果漏掉了括号，则 `PATH` 将包含单个值 |\n| `Echo $#PATH`\
  \ | 返回多值变量中的值个数 |\n| `Echo $PATH[2]` | 返回多值变量中的第二个值 |\n\n### 24.1.5 目录结构\n\nUNIX\
  \ 计算机上的典型目录结构包含以下子目录。当然，提供软件的供应商可能要求添加一些额外的子目录以反映其标准：\n\n* `/root` 目录主要包含子目录\n*\
  \ `/bin` 目录包含二进制或可执行文件\n* `/etc`—管理和配置程序及文件\n* `/lib`—库\n* `/tmp`—临时文件的存放位置\n* `/usr`—包含系统应用程序（如邮件队列或打印机队列）使用的文件\n\
  \n### 24.1.6 信息流\n\nUNIX 中有三种类型的信息流。这些流及其描述如下所示。这些流适用于程序和命令：\n\n![Image](img/T000248tabT0030.png)\n\
  \n### 24.1.7 输入和输出流的重定向\n\n所有进入或离开程序和命令的流都可以重定向。重定向输入流允许文件内容提供给程序或命令。同样，输出可以发送到文件中以便保存。这里列出了用于重定向的命令。\n\
  \n![Image](img/T000248tabT0035.png)\n\n通过此输出重定向 `> /dev/null` 可以使输出消失。\n\n### 24.1.8\
  \ 管道\n\nWindows 和 UNIX 都允许管道操作。Windows、UNIX 和 Linux 中的管道符号是竖线（`|`）。这个符号通常是键盘上反斜杠键上的大写字符。管道允许将一个命令的输出作为另一个命令的输入。例如，以下命令\n\
  \n```\nls | more\n```\n\n将执行 `ls` 命令并输出发送给 `more` 命令。`more` 让用户更易于阅读大量输出的内容。\n\n\
  在 DOS 和 UNIX 中使用管道的唯一实际区别是，DOS 会创建中间临时文件，而 UNIX 不会。从用户的角度来看，这并不影响管道的使用。\n\n### 24.1.9\
  \ 运行作业\n\n在 UNIX 中运行应用程序可以简单地在命令行窗口中输入可执行文件名并按回车键。传递给程序的命令行参数（例如文件名）跟在程序名之后，并用空格分隔。如果需要向应用程序传递命令选项，它们将跟在参数之后，并以连字符（`-`）开头。Windows\
  \ 命令行使用正斜杠（`/`）指示命令选项。\n\n当启动程序或应用程序时，会启动一个进程。该进程代表程序的正在运行副本。多个程序副本可以同时运行。例如，用户可以运行多个文本文本编辑器\
  \ `vi`。每个进程都有一个关联的进程标识符或 `pid`。`pid` 由 `ps` 等命令显示，这些命令会显示系统上运行的所有进程的列表。\n\n### 24.1.10\
  \ 命令搜索路径\n\nUNIX 在查找可执行文件位置方面非常灵活。例如，你想要运行的可执行文件可以位于：\n\n* 当前工作目录，即命令会话所在的目录。\n\
  * `PATH` 环境变量中的任何子目录。shell 会在 `PATH` 变量中的每个子目录中查找第一个找到的实例将被执行。\n* 启动可执行文件时指定的特定位置。\n\
  \n### 24.1.11 Tar 文件\n\nWindows 压缩文件的等价物是 `tar`（归档）文件。文件或整个目录结构可以压缩成单个 `tar` 文件。生成的文件通常具有\
  \ `.tar` 扩展名。如果供应商为 UNIX 系统提供软件或更新，那么他们的文件几乎都是 `tar` 格式。\n\n一些你可能需要的基础 `tar` 命令：\n\
  \n| `tar tvf file_name.tar` | 列 tar 文件内容但不提取 |\n| `tar xvf file_name.tar` | 从 tar\
  \ 文件中提取所有文件 |\n| `tar xvf file_name.tar /path/file1.txt` | 从 tar 文件中提取 `file1.txt`\
  \ |\n| `tar xvf file_name.tar --wildcards \"*.pdf\"` | 从 tar 文件中提取所有 pdf 文件 |\n\
  | `tar xvf file_name.tar /path/dir/` | 从 tar 文件中仅提取子目录 `/path/dir/` |\n| `tar xvf\
  \ file_name.tar /path/dir1/ /path/dir2/` | 从 tar 文件中提取子目录 `/path/dir1/` 和 `/path/dir2/`\
  \ |\n\n## 24.2 基础 UNIX 命令\n\nUNIX 有许多可以在命令行或 shell 脚本执行的命令。本节描述了管理员可能会遇到的一些命令。并不是所有命令在所有\
  \ UNIX shell 中都可用。24.7 节提供了关于 UNIX shell 概念的信息。\n\n大多数 UNIX 命令接受一个或多个命令行参数，以影响命令的具体执行方式。在\
  \ UNIX 中，命令行参数以连字符（`-`）开头。如果输入多个参数，它们用空格分隔。表 24.1 列出了一些基础 UNIX 命令及其对应的描述。\n\n| 命令\
  \ | 命令描述 |\n| --- | --- |\n| `pwd` | 打印当前工作目录 |\n| `cd cd ~ jason` | 将当前会话返回用户的主目录\
  \ 将当前工作目录更改为账户的主目录 |\n\n`jason` | |\n\n\n\n\n\n| `head filename` | `head -n filename`\
  \ | 打印文件的前 10 行。包含命令行参数 `n` 将显示更多或更少的行数。 |\n| `tail filename` | `tail -n filename`\
  \ | 打印文件的最后 10 行。包含命令行参数 `n` 将显示更多或更少的行数。`tail` 命令特别用于查看日志文件中的最新条目。 |\n| `clear`\
  \ | 清空会话屏幕 |\n| `man command` | 显示指定命令的帮助文档页 |\n| `ls` | 列出当前子目录下的文件。`ls` 命令有许多命令行参数。要完全理解此命令，你需要使用搜索引擎对其进行搜索，或者执行命令\
  \ `man ls` 来查看其文档。 |\n| `touch` | 将文件的最后访问时间更改为当前时间 |\n| `mkdir directory-name`\
  \ | 在当前位置创建一个名为 `directory-name` 的目录 |\n| `rmdir directory-name` | 移除目录 `directory-name`\
  \ |\n| `cp file1 new_dir` | 将文件 `file1` 复制到目录 `new_dir`。`cp` 命令也可以有许多参数。为了充分利用它，你需要进行搜索或查阅\
  \ man 页。 |\n| `more filename` | 显示文件的单页内容。按空格键可以显示下一页。按回车键可以显示文件中的额外一行。 |\n| `less\
  \ filename` | 类似于 `more` 命令，但更灵活。例如，它允许用户在文件中向上或向下移动。 |\n| `grep` | 在一个或多个文件中搜索指定的模式。通常与管道命令\
  \ `|` 配合使用。例如，`ls | grep xyz` 将显示所有名称中包含 `xyz` 的文件。`grep` 有许多利用方式，请确保对其进行研究以充分发挥其潜力。\
  \ |\n| `compress filename` | 压缩文件以减小其体积 |\n| `uncompress filename` | 将压缩文件恢复到原始状态\
  \ |\n| `cat filename` | 将文件显示到标准输出设备（通常是终端） |\n| `find` | 查找符合命令指定条件的文件 |\n| `diff\
  \ file1 file2` | 显示两个文件之间的差异 |\n| `lp filename` | 将指定的文件打印到默认打印机。通过包含命令行参数 `-dprinter_name`\
  \ 可以将输出发送特定的打印机。 |\n\n## 24.3 命令行帮助\n\nUNIX 提供了帮助信息以使命令行的使用更加简单。以下章节描述了在命令行中快速、准确地输入命令的方法。\n\
  \n### 24.3.1 重复命令\n\nC shell 和 Korn shell 允许你重复之前输入过的命令。这些命令甚至可以显示和编辑，以获得更高的准确性和灵活性。\n\
  \n通过在命令行输入 `!!` 可以重复上一个命令。在 Korn shell 中，要重复上一个命令，请按 Escape 键然后按 `k` 键。\n\n输入一个感叹号后跟跟一个或多个字符，将显示以这些字符开头的最近命令。例如，如果你输入\
  \ `!ls`，将显示你最近执行的 `ls` 命令。你可以编辑该命令中输入的任何命令行参数。\n\n还可以根据命令在命令历史记录中的位置来重复命令。这是通过输入一个感叹号后跟一个数字实现的。例如，如果你输入\
  \ `!1`，将显示历史日志中最旧的命令。下一节将描述该日志的大小。\n\n### 24.3.2 命令历史\n\nUNIX shell 会维护最近输入命令的历史记录。在\
  \ C shell 中，可以通过输入命令显示历史日志的大小：\n\n```\necho $history\n```\n\n返回值是记忆的命令数量。如果该值为 0，则此功能不可用。\n\
  \n要更改 C shell 中将记录的命令数量，请输入命令：\n\n```\nSet history=25\n```\n\n这将将历史日志的大小设置为最近的 25\
  \ 条命令。\n\n### 24.3.3 命令行自动补全\n\n某些 shell 允许你输入命令的一部分，命令的剩余部分将自动显示或补全。如果你知道某个命令存在，但记不起它的完整名称，这非常有帮助。\n\
  \n要激活此功能，你只需输入命令的一个或多个字符，然后按 `Tab` 键。如果你输入的内容对于单个命令是唯一的，那么自动补全将填充命令的剩余部分。如果你输入的字符串适用于多个命令，则自动补全功能将不起作用。\n\
  \n## 24.4 运行作业\n\n用户可以通过在命令行输入程序或应用程序的名称并按回车键来启动作业运行。这会导致程序被调用。一旦程序被调用，计算机上就会运行一个进程。当程序中的逻辑执行完毕后，进程退出。\n\
  \n### 24.4.1 前台和后台作业\n\n用户启动的作业既可以在前台运行，也可以在后台运行。如果作业在前台运行，启动它的命令行会话就会被占用。在作业作业完成之前，无法输入任何额外的作业或命令。\n\
  \n在后台运行的作业不会占用用户的命令行会话。如果你知道一个程序将运行很长时间，可能让它在后台运行。\n\n### 24.4.2 启动后台作业\n\n要让作业在后台运行，请在命令行程序名后添加和符号\
  \ `&`。例如，要启动后台作业，输入：\n\n```\ncalc &\n```\n\n按下回车键后将显示一个数字。这是刚刚启动的后台作业的编号。\n\n需要注意的是，所有后台的作业都与你的会话绑定。如果你注销系统，所有的后台作业将被终止。\n\
  \n对于注销时终止作业的规则有一个例外。如果你使用 `nohup` 命令启动命令，它可以忽略挂。输出将发送到 `nohup.out`。输入将从文件 `nohup.in`\
  \ 读取。使用 `nohup` 启动 `calc` 命令的格式为\n\n```\nnohup calc\n```\n\n### 24.4.3 跟踪作业\n\n\
  如果你在命令行输入 `jobs` 命令，它将列出当前会话期间启动的所有作业。图 24.3 显示了 `jobs` 命令的截图。\n\n![image](img/F000248f24-03-9780123985453.jpg)\n\
  \n图 24.3 `jobs` 命令的输出。\n\n### 24.4.4 作在前台和后台之间切换\n\n后台运行作业非常强大，但有一个很大的局限性。如果后台作业尝试读取或写入控制台，它将被挂。要与控制台交互，必须将进程移到前台。\n\
  \n`fg` 命令将进程移到前台。在时不带参数的情况下，`fg` 将将等待输入的作业移到前台。使用作业标识作为参数可以将特定进程移到前台，例如，`fg 2` 将\
  \ 2 号作业移到前台。\n\n一旦进程被移到前台，它就可以写入控制台。如果它正在等待输入，可以在作业移到前台后在控制台输入预期的输入。\n\n如果你启动了一个作业并现在想将其移动到后台，请执行以下步骤：\n\
  \n1. 使用 `Control-Z` 字符中断进程。现在进程处于挂起状态。\n2. 输入命令 `bg` 强制让挂起的进程在后台运行。\n\n进程可以根据需要多次地在前台和后台模式之间切换。\n\
  \n### 24.4.5 终止作业\n\n\n\n\n\n如果你需要杀死或终止正在运行的作业，有两种方法。如果作业正在前台运行，请按下 `Ctrl-C` 组合键。这将终止大多数前台作业。如果你想要杀死的作业无法通过\
  \ `Ctrl-C` 键终止，请尝试下一段中描述的命令。\n\n终止作业的第二方法是输入命令 `kill %n`，其中 `n` 是你想要终止的作业的作业号（使用\
  \ `jobs` 命令获取作业号）。如果 `kill` 命令不起作用，请输入 `kill -9 %n`，其中 `n` 是要杀死作业的作业号。作业号可以通过 `jobs`\
  \ 命令获取。\n\n### 24.4.6 串行作业\n\n有时同时启动多个作业是比较方便的。例如，作业“A”创建一个文件，作业“B”需要该文件作为输入。你可以启动作业“A”，等待它完成，然后启动作业“B”。或者你可以同时启动这两个作业，并将它们设置为串行运行，即一个接一个地运行。串行启动多个作业的方法是在命令行中输入所有作业名称，并用分号隔开。所示所示命令将串行启动作业“A”和“B”：\n\
  \n```\nJob_A ; Job_B\n```\n\n上面的示例描述了两个恰好共享一个公共文件的作业。串行运行作业之间不需要有任何关系。以下命令行启动了三个不相关的命令：\n\
  \n```\nls ; pwd ; mkdir joe\n```\n\n### 24.4.7 并行作业\n\n就像可以用一个命令启动多个串行作业一样，你也可以用一个命令启动多个并行（即后台）作业。它们被称为并行作业，是因为它们都在并行运行或同时运行。要做到这一点，每个作业名称后面都需要跟一个取地址符（`&`））。以下命令启动了三个并行作业：\n\
  \n```\nJob_A & Job_B & Job_C &\n```\n\n你可以使用第 24.4.3 节列出的 `jobs` 命令获取与每个并行作业相关的作业号。如果你想将其中一个移动到前台，可以使用第\
  \ 24.4.4 节描述的技术。\n\n## 24.5 作业调度\n\nUNIX 有多种方法调度作业在未来时间运行。接下来的章节描述了两种调度作业的方法。第一种是简单的，第二种更复杂，但功能强大得多且灵活得多。\n\
  \n### 24.5.1 at\n\n`at` 命令（在 Windows 中也可用）可用于调度作业在未来的某个时间运行一次。以下命令将调度 Job1 在今天上午\
  \ 11:30 运行：\n\n```\nat 11:30 < Job1\n```\n\n与 `at` 一起使用的参数列在表 24.2 中。\n\n表 24.2\n\
  \n`at` 命令的参数\n\n| 参数 | 说明 |\n| --- | --- |\n| -f filename | 文件 `filename` 包含要运行的命令\
  \ |\n| -m | 在命令启动后发送一电子邮件 |\n| Date | 指定运行命令的日期 |\n| -l | 列出所有已调度的作业。参见下方的 `atq`\
  \ 命令 |\n\n`at` 命令的两个变体是：\n\n| atq | 列出当前用户通过 `at` 命令调度的所有作业 |\n| atrm # | 移除（即删除）作业号\
  \ # |\n\n### 24.5.2 Cron\n\nCron 是一种调度实用，提供了比 `at` 命令强大得多的灵活性。Cron 可用于调度重复性任务，例如：\n\
  \n- 每天晚上创建备份\n- 清理不再需要的旧文件\n- 启动搜索日志文件的作业\n- 运行需要每周或每月生成的报告\n\n`crontab` 可以执行的一些调度变体包括：\n\
  \n- 在计算机启动时运行作业\n- 每小时、每天、每周、每月或每年运行一次作业\n- 在每周的某一天运行作业\n- 在每月的某某一天运行作业\n- 以特定间隔重复运行作业，例如每小时、每天等\n\
  - 每次运行作业时发送一电子邮件\n- 在每个月的第 1 号到第 10 号运行作业\n- 在特定时间运行作业，例如每天晚上 9:40\n- 在每周的某一天运行作业，例如每周一早晨\
  \ 7 点\n\n在大多数 UNIX 系统上，你必须获得系统管理员授予的权限才能 cron 调度作业。如果你支持的应用是服务器上运行的唯一软件，那么你可能会获得此特权。\n\
  \n一个文件包含了由 cron 调度运行的所有作业的细节。可以通过输入命令 `crontab –e` 来编辑此文件。该文件的细节相当复杂，超出了本书的范围。相关细节可以在\
  \ `man` 页面中找到。\n\n## 24.6 学习服务器的工具\n\n有很多 UNIX 命令可以提供有关服务器的信息。这里列出了一些实用的命令。并不是所有的命令都适用于每个版本。\n\
  \n### 24.6.1 了解你\n\n关于服务器最基本的信息可能是它的名称。这似乎是显而易见的，但如果你远程登录到多个服务器，有一个命令可以确认是哪一台会很好。返回主机名称的命令是\
  \ `hostname`。\n\n`uname` 命令返回有关 UNIX 版本的信息。`uname` 可以包含的参数包括：\n\n在命令行运行 `id` 命令将显示有关账户的信息。具体它列出了你的：\n\
  \n- 用户名\n- 用户 ID (`uid`)\n- 组名 \n\n`whoami` 命令也提供你登录账户的详细信息。\n\n你可能经常想知道服务器运行了多久。通常在排除故障时这很重要。`uptime`\
  \ 命令也提供这些信息，以及其他一些小知识。图 24.4 显示了 `uptime` 命令的输出。输出是：\n\n- 当前时间\n- 系统运行的天数和小时数\n\
  - 当前登录的用户数\n- 负载平均值，即过去 1 分钟、5 分钟和 15 分钟的活动量。0 表示没有活动。1 表示平均每个处理器有一个进程正在运行。通常，数值越高，运行的进程越多。\n\
  \n### 24.6.2 服务器上运行了什么\n\n也许你需要回答的问题是“服务器上运行了什么？”这可能是响应性能问题。也可能是在试图弄清楚为什么功能没有按预期工作时提出的。又可能只是为了更充分地了解服务器在正常运行时发生了什么。\n\
  \nUNIX 提供了几个命令可以帮助回答这个问题。第一个命令是 `ps` 或进程列表命令。`ps` 命令有许多可以运行的选项。仅仅没有任何选项的基本 `ps`\
  \ 命令返回的内容非常少。主要是你在命令行会话中启动的进程。\n\n\n\n\n\n这里列出了可以添加到 `ps` 的某些参数。`ps` 命令中可以包含多个参数：\n\
  \n| -a | 列出所有与终端相关的进程信息 |\n| -d | 列出除会话组长之外的所有进程 |\n| -e | 列出服务器上运行的所有进程 |\n| -f\
  \ | 列出每个进程的详细信息 |\n| -g grplist | 仅列出与 grplist 中组组 ID 相关的进程 |\n| -j | 列出每个进程的会话\
  \ ID (session ID) 和进程组 ID (process group ID) |\n| -l | 列出输出的长格式或详细版本 |\n| -o format\
  \ | 按指定的格式列出进程信息 |\n| -p proclist | 仅列出进程 ID 在 proclist 列表中的进程 |\n| -u username\
  \ | 列出由用户名 启动的所有进程 |\n| -P | 列出每个进程所绑定的处理器编号 |\n\n图 24.5 显示了命令 `ps –el | more` 的输出。`-e`\
  \ 参数导致 `ps` 列出正在运行的每一个进程。`-l` 参数指定了长或完整的输出列表。我在命令中添加了 `| more`，以便将输出一次一个屏幕地发送到监视器上。\n\
  \n![image](img/F000248f24-05-9780123985453.jpg)\n\n图 24.5 正在工作的 `ps` 命令。\n\n如果你只想查看某个特定进程的详情，可以将\
  \ `ls` 的输出通过到 `grep`。例如，`ps –el | grep test` 将仅列出名称中包含 `test` 的进程的所有详细信息。\n\n`ps`\
  \ 命令的一个缺点是它可能会让人无从从备。它显示了非常有用的信息，但在典型的服务器上，任何时候都有许多进程在运行。当你从中筛选这么多进程时，很难识别出是哪些进程占用了大部分\
  \ CPU 时间。\n\n`top` 命令为“哪些进程正在服务器大部分的 CPU 时间？”这个问题提供了答案。`top` 按进程使用 CPU 时间的多少对进程进行列排序。图\
  \ 24.6 显示了 `top` 命令的输出。\n\n![image](img/F000248f24-06-9780123985453.jpg)\n\n图 24.6\
  \ `top` 命令的输出。\n\n`top` 的一个非常好的特性是它会每隔几秒无限地刷新一次进程列表。你可以通过按 `Ctrl-C` 键终止 `top` 命令。可以通过包含\
  \ `-s` 参数来指定此间隔。例如，要让它每 10 秒刷新一次，请输入命令：\n\n```\ntop –s 10\n```\n\n运行 `top` 命令后，你可能决定需要终止某个进程。可以使用\
  \ `kill` 命令来杀死一个进程。输入命令 `kill pid`，其中 `pid` 是你想终止的进程的进程 ID。如果进程没有停止，请在命令中添加 `-9`\
  \ 选项，例如 `kill -9 pid`。这应该可以杀死该进程。\n\n另一个提供进程信息的工具是 `glance`。该工具仅在 HP/UX 系统可用。`glance`\
  \ 与 `top` 非常相似，但它提供的信息比 `top` 更多是图形化格式。\n\n### 24.6.3 谁登录了服务器\n\n通常情况下，能够登录到应用程序服务器的人应该非常少，特别是生产服务器。你可以使用\
  \ `who` 命令来查找谁登录了服务器。此命令的输出将告诉你谁登录了以及他们是何时登录的。\n\n另一个可以用来查找谁在服务器上的命令是 `finger` 命令。`finger`\
  \ 的输出提供了 `who` 无法提供的几个额外列，但本质上这些信息是相同的。\n\n最后一个可能实用的命令是 `w` 命令。它并不是所有的 UNIX 系统上都可用，但在你的系统上可能可用。它是\
  \ `uptime` 和 `who` 命令的结合。它还列出了每个用户当前正在做什么。如果你运行这个命令，你会发现你的会话当前正在运行 `w` 命令。\n\n`listusers`\
  \ 命令列出了所有授权登录服务器的用户，无论他们当前是否已登录。如果你正试图掌握谁有权访问服务器，那么这些信息可能非常有用。你可以从中识别出那些本不应该获得服务器访问权限的人，或者由于工作变化或离开组织而可能不再需要访问权限的人。\n\
  \n### 24.6.4 服务器上的可用资源\n\n确定服务器上哪些资源是可用的是应用程序管理员的一项相当常见的活动。经常检查的资源包括空闲磁盘空间、内存和处理器。在某些情况下需要知道这些资源：\n\
  \n*   大多数软件安装过程都要求你确认服务器上的资源足以满足应用程序的要求。\n*   对现有应用程序的升级也需要确认存在某些最低级别的资源。\n*   当发生性能问题时，你进行的首次检查之一就是确认是否有足够的资源供应用程序运行。\n\
  \n后续段落描述了可以查看可用资源的某些 UNIX 命令。如前所述，并不是所有这些命令在所有的 UNIX 变体和所有的 shell 下都可用。如果这里列出的命令在你的\
  \ UNIX 服务器上不起作用，可以搜索它的等价命令。\n\n要确定可用多少磁盘空间，可以运行 `df`，即 disk free 命令。包含 `-P` 将显示以下列：\n\
  \n* 文件系统名称\n* 总大小\n* 空闲量\n* 使用百分比\n* 文件系统的根目录\n\n`du` 即 disk used 命令提供了每个文件或子目录占用磁盘空间的信息。运行\
  \ `du` 命令返回两列：\n\n* 分配的 512 字节块数\n* 子目录名称\n\n如果你的服务器有很多子目录和文件，那么该命令的输出将非常长。你可以通过以下方式使输出更易管理：\n\
  \n* 将起始目录名称作为参数，例如 `du /tmp` 或 `du /tmp/`\n* 将 `du` 命令的输出通过到 `more` 命令，以便一次显示一个屏幕\n\
  * 使用 `>>` 符号将输出重定向到文件中以便日后检查\n* 将输出通过到 `grep` 并搜索特定的目录\n\n确定 UNIX 系统上可用内存的方法差异很大。以下命令根据你工作的服务器运行的\
  \ UNIX 版本提供此类信息。尝试它们，直到找到适用于你系统的那个：\n\n* machinfo | grep Memory\n* dmesg | grep\
  \ mem\n* prtconf –v | grep Memory\n* dmesg | grep Physical\n* show mem /page\n*\
  \ grep memory /var/run/dmesg.boot\n* vmstat –P | grep Total\n\n供应商支持小组经常询问另一个系统资源是你的服务器上有多少处理器以及速度有多快。`top`\
  \ 命令的顶部列出了你所有的 CPU。\n\n获取 CPU 速度要困难一些。与许多其他资源相关的命令一样，并不总有一个适用于所有 UNIX 系统的命令。这里列出了可以提供此类信息的某些常用命令。在你的系统上尝试它们，并记录下哪个适用于你的环境：\n\
  \n* grep –c processor /proc/cpuinfo\n* lshw –class processor –short\n* dmesg | grep\
  \ cpu\n* dmidecode | grep -i CPU\n* psrinfo –v\n* /opt/ignite/bin/print_manifest\
  \ | pg\n\n### 24.6.5 关于文件的信息\n\n\n\n\n在支持应用程序时，你将处理各种类型的文件。这些包括可执行文件、库文件、配置文件、日志文件、数据文件等许多类型。这些文件位于许多不同的子目录中。为了让你的工作更轻松，如果你能熟练地快速找到所需的文件，将非常有帮助。深入一个冗长的路径结构需要时间。这里描述了一些\
  \ UNIX 命令，它们可以帮助你定位和处理文件。\n\n你必须处理的任何应用程序文件很可能是 `PATH` 环境变量列出的子目录。通常，应用程序的安装过程会将它的一个或多个子目录添加到此变量中。你可以使用\
  \ `echo` 命令来显示 `PATH` 变量并查看它指向何处。命令的格式为\n\n```bash\necho $PATH\n```\n\n要在 UNIX 系统上查找特定文件，可以使用\
  \ `find` 命令。该命令有许多选项，但通过名称查找文件的基础命令是调用 `find`、搜索位置以及文件名。文件名可以包含如 `*..` 之类的通配符。例如，该命令\n\
  \n```bash\nfind . –name “*.cfg”\n```\n\n将找到当前目录下所有扩展名为 `.cfg` 的文件。你可以通过轻微修改命令来指定搜索所有子目录：\n\
  \n```bash\nfind / –name “*.cfg”\n```\n\n你也可以指定只搜索特定的子目录。以下命令将只在 `/usr/local` 子目录中搜索具有\
  \ `cfg` 扩展的文件：\n\n```bash\nfind /usr/local –name “*.cfg”\n```\n\n在文件名方面，UNIX 是区分大小写的。如果你运行\
  \ `find` 命令搜索一个名为“archimedes”的文件，`find` 命令将找不到任何包含大写字母的名称。因此，你的搜索将找不到“Archimedes”或“ARCHIMEDES”。要强制\
  \ `find` 命令不区分大小写，请使用 `-iname` 而不是 `-name`。例如：\n\n```bash\nfind /use/local –iname\
  \ “archimedes.*”\n```\n\n如果你想了解更多关于特定文件的信息，可以使用 `file` 命令。输入 `file file_name`，其中\
  \ `file_name` 是文件名。输出列出了操作系统所关于该文件的所有信息。例如：\n\n* 它是否为文本文件\n* 文件是否包含编程代码\n* 文件是否包含\
  \ ASCII 数据\n* 文件是否为可执行文件\n* 文件是否包含脚本命令\n\n## 24.7 基础 UNIX 安全\n\n即使你不是运行应用程序的 UNIX\
  \ 服务器的系统管理员，你也有兴趣确保服务器的安全。对 UNIX 安全的基本了解可以帮助你避免将服务器暴露给可能想要利用你的安全失误的人。\n\n## 24.7.1\
  \ 超级账户\n\n每个 UNIX 服务器都有一个 `root` 或超级用户账户。该账户拥有执行系统中任何操作的能力。它可以更改任何文件或目录的访问权限。它可以修改任何用户账户的权限。它可以执行任何命令。当登录\
  \ `root` 账户时，如果你不熟悉自己在做什么，可能会完成大量工作或造成巨大的损害。\n\n作为应用程序管理员，你有访问此账户权限吗？如果有，你需要非常小心。最好的建议可能是只在绝对需要时以\
  \ `root` 身份登录。完成当前任务后，立即注销 `root`，其余时间使用个人账户。\n\n要切换到 `root` 账户，输入此处所示 `su`（切换用户）命令：\n\
  \n```bash\nsu –\n```\n\n系统将提示你输入超级用户账户的密码。正确输入后，你将登录 root。输入 `exit` 退出 `root` 并返回自己的账户。\n\
  \n运行需要 root 权限命令的另一种方法是使用名为 `sudo` 的程序。`sudo` 可以执行通常保留给 `root` 账户的命令。其格式是输入 `sudo`\
  \ 加上你想执行的命令。例如：\n\n```bash\nsudo AcctgApp restart\n```\n\n如果你的账户在执行输入命令的 `sudo`\
  \ 授权用户列表中，系统将提示你输入账户密码。`sudo` 可以授予不同用户不同的权限。一个用户可能执行任何命令，而另一个用户只能执行有限的命令集。\n\n##\
  \ 24.7.2 控制文件访问\n\nUNIX 中子目录和文件的访问可以被严格控制。作为应用程序管理员，你可能会访问与应用程序相关的每个文件。你可能需要定期向其他用户或应用程序授予权限。后续章节将描述\
  \ UNIX 中使用的访问控制方法以及授予权限的命令。\n\n### 24.7.2.1 文件的访问\n\nUNIX 世界中的每个文件（包括子目录）都关联有三类访问权限。每一类都可以分配不同层级的权限。这三类定义为：\n\
  \n1. 文件的所有者\n2. 文件的组属\n3. 不属于上述两类的用户\n\n授予给一类的可能的访问权限列在此处。当显示访问权限时，如果用户未被授予特定权限，则用连字符（`-`）代替其他字母之一：\n\
  \n* `r`—读取，即文件只能被读取\n* `w`—写写，即文件可以被写入、删除或创建新版本\n* `x`—执行，即文件可以执行\n\n目录访问权限的含义略有不同：\n\
  \n* `r`—组可以读取目录的内容。注意，这并不意味着用户将访问文件本身。\n* `w`—组可以向目录中添加文件、删除目录中的文件并重命名文件。\n* `x`—用户可以\
  \ cd，即进入该目录。\n\n通过运行 `ls -l` 命令可以查看授予每个类别的权限。图 24.7 显示了其输出的一个示例。每个文件和子目录都有行描述谁具有访问权限以及权限级别。\n\
  \n### 24.7.2.2 修改文件的访问权限\n\n文件的访问并非固定不变。文件的所有者或 `root` 账户（即超级用户）可以更改文件的访问权限。执行此操作的命令是\
  \ `chmod` 命令。使用 `chmod` 命令有两种方法：数字模式和符号模式。\n\n\n\n\n要使用数字法，如果你对数字敏感（尤其是八进制数字），将会很有帮助。每个访问级别和访问权限的组合都有一个八进制数字或模式。这些模式及其含义如下：\n\
  \n![Image](img/T000248tabT0060.png)\n\n要在一条命令中设置多个访问权限，你需要将你想要的权限相加。然后，在 `chmod`\
  \ 命令中指定聚合后的模式，相应的组将获得特定的权限。以下示例希望能够说明其工作原理。虽然其中一些示例并不符合实际，但具有教学意义：\n\n![Image](img/T000248tabT0065.png)\n\
  \n更改访问权限的第二种方法称为符号法，它不涉及八进制数字。通过使用加号（`+`）和减号（`−`）你可以你可以指示从当前权限集中添加或移除哪些访问权限。该方法中的一点说明是：\n\
  \n* `u` 指文件的所有者\n* `g` 指所有者组\n* `o` 指不属于 `u` 或 `g` 组的所有人员。\n\n以下示例应该让你看清楚这个版本的 `chmod`\
  \ 命令：\n\n| `chmod u+r test.txt` | 为所有者已有的权限添加读权限 |\n| `chmod g+w test.txt` | 为所有者组已有的权限添加写权限\
  \ |\n| `chmod o+x test.txt` | 为其他组已有的权限添加执行权限 |\n| `chmod o-x test.txt` | 从其他组已有的权限中移除执行权限\
  \ |\n| `chmod o-w test.txt` | 从其他组已有的权限中移除写权限 |\n\n### 24.7.2.3 修改文件的所有权\n\n更改文件的所有权并不常见，但有时需要这样做。可以使用\
  \ `chown` 命令。它只能由文件所有者和 root 执行。以下命令会将文件 `test.txt` 的所有权更改名为 Jason 的用户：\n\n```\n\
  chown jason test.txt\n```\n\n要更改目录中每个文件（包括其中所有的子目录）的所有权，你需要输入以下命令：\n\n```\nchown\
  \ –R jason test_dir\n```\n\n## 24.8 文本编辑器\n\nUNIX 系统上有许多编辑器，但人们通常将 `vi` 与 UNIX 联系在一起。为\
  \ `vi` 或任何其他 UNIX 编辑器提供入门指南已超出本书的范围。我将提供一份 UNIX 上可用的文本编辑器列表。如果读者需要了解更多关于这些编辑器的信息，有许多关于它们的书籍或教程：\n\
  \n* `vi` 可以在几乎每个 UNIX 或 Linux 系统找到。这个特定的编辑器并非面向 GUI 的，但一旦你熟悉了它，它就能提供强大的功能。一个建议是——在变得精通之前，务必频繁保存你的更改！\n\
  * `Pico` 的内存占用和功能列表比 `vi` 小得多。另一方面，这使得它更容易掌握。`Pico` 不是 GUI 或 WYSIWYG 工具，但拥有比 `vi`\
  \ 更多的图形化功能。\n* `Emacs` 介于 `pico` 和 `vi` 之间。它提供的功能比前者多，但没有后者那么多。如果你的系统支持可用 `emacs`，那么它可能是你感到最舒适且效率最高的工具。\n\
  \n## 24.9 调优工具\n\n作为应用程序管理员，在调优 UNIX 服务器时必须小心。除非你有系统管理员背景，否则尝试调优操作系统可能会让情况变得更糟而不是更好。本节中的段落可能很有价值，但要小心不要尝试超过你的能力范围。\n\
  \n### 24.9.1 时间\n\n如果你想了解一个命令在 UNIX 系统上运行需要多久，`time` 命令可以帮助你。它返回关于命令运行时间的信息，分为三类：\n\
  \n* `Real time`（实际时间）——命令运行期间经过的时间，即挂钟时间。\n* `User time`（用户时间）——CPU 执行你输入的命令所花费的时间。\n\
  * `Sys time`（系统时间）——CPU 代表你输入的命令执行系统调用所花费的时间。\n\n要使用此命令，输入 `time` 命令加上你想运行的命令。例如，如果你想对名为\
  \ `run_accounts` 的作业收集统计信息，请输入以下命令：\n\n```\ntime run_accounts\n```\n\n### 24.9.2\
  \ Core 转储 (Core dumps)\n\n如果程序异常终止，UNIX 通常会捕获与程序相关的核心转储（core dump）。如果你的应用程序异常终止了多次，供应商可能会要求你提供\
  \ core 文件以便他们进行分析。他们将通过分析 core 文件来确定他们的应用程序在崩溃之前正在做什么。\n\n解释如何读取 core 文件远超本书的范围。它需要大量的经验以及编程背景。你可能向供应商提供\
  \ core 文件并让他们来分析会更好。\n\n### 24.9.3 性能分析 (Profiling)\n\n与该词目前的用法相反，对应用程序进行性能分析（profiling）是一件好事。性能分析的作用是精确检查应用程序内部正在做什么。例如，性能分析程序可能会捕获以下统计数据：\n\
  \n* 正在调用哪些内部函数（例如子程序）\n* 每个函数被调用的频率\n* 每次调用函数完成需要多长时间\n* 每个函数占总执行时间的百分比\n\n通过确切地知道它在做什么，就可以改进应用程序。例如，如果很大比例的时间花在了某个特定函数上，那么尝试优化它是值得的。很少被调用的函数无论其效率有多低，可能都不值得优化。\n\
  \n性能分析的缺点是你必须拥有应用程序的源代码。第三方供应商不太向你提供源代码，但如果应用程序是内部开发的，那么你可能可以使用此工具来改进应用程序。\n\n###\
  \ 24.9.4 Vmstat\n\n`Vmstat` 是一个提供系统上运行的每个进程统计信息的命令。它可以帮助你识别特定系统资源（如 CPU、内存、磁盘 I/O\
  \ 或页面文件）被使用的情况。如果你能发现资源短缺的情况，你可以设法如何减少其使用量或提供更多资源。例如，如果系统总是缺少内存，你可能想要获取额外的 RAM。向服务器添加另一个处理器也是可能且建议的，以缓解现有\
  \ CPU 以高利用率运行的情况。\n\n### 24.9.5 nice\n\n大多数计算机系统的现实情况是有许多应用程序、作业或进程在竞争有限的资源。如果一个作业获取了更多有限资源，留给其他进程的资源就减少了。CPU\
  \ 时间的竞争是许多系统上的常见问题。系统中可能有少数进程消耗了很大比例的 CPU 时间。如果可以强制这些进程减少用量（例如，“表现得友好一点”），那么其他进程就能更快地完成。\n\
  \n`Nice` 是 UNIX 系统上的一个程序，可以更改进程的优先级，从而改变分配给它的 CPU 时间。如果你能识别出系统中消耗过多 CPU 时间的作业或进程，你可以更改它们的\
  \ `nice` 设置以便它们获得更少的时间。相反，可能有一个应该获得尽可能多 CPU 时间的关键进程。`nice` 命令可用于增加分配给关键作业的 CPU 时间。\n\
  \n## 24.10 连接性\n\n\n\n\n\n你的应用程序服务器很可能并非孤立存在。该应用程序可能由多个服务器组成，例如 Web 服务器、报告服务器等。该应用程序可能处于负载均衡环境中。它可能利用了集群来提高性能或可用性。数据库很可能位于另一台独立的、专用服务器上。\n\
  \n如果你的环境中存在上述任何情况，那么你将需要处理多个服务器。多个服务器意味着你必须理解这些服务器之间是如何进行通信的。本节列出的工具或命令可以提供关于服务器与服务器之间或你的服务器与外部世界之间通信的洞察。\n\
  \n作为应用程序管理员，你最令人头疼的问题可能是处理潜在的连接问题。在排查连接问题时，拥有一个需要检查的清单是有帮助的，并且始终按照顺序检查这些项目。一段时间后，你就会对这次问题的原因产生直觉。典型的连接相关问题示例包括以下内容：\n\
  \n* 应用程序服务器在连接到数据库服务器时是否遇到了问题？\n* 如果应用程序运行在多个服务器上（例如应用程序服务器和报告服务器），它们能够相互连接吗？\n\
  * 用户在连接到应用程序服务器时是否遇到了问题？\n* 用户能够连接到组织网络吗？\n* 用户能够从远程位置访问组织网络吗？\n* 用户遇到的性能问题是由应用程序、数据库、网络还是其他原因引起的？\n\
  \n要排查此类列表中的问题，你需要知道服务器上提供了哪些工具。每个组织的环境都是不同的，但后续章节中描述的工具可能在你的 UNIX 服务器上是可用的。章节的安排从最简单的检查开始，最复杂的检查放在最后。\n\
  \n### 24.10.1 ping\n\n`ping` 命令在第 23 章中描述过。它在 Windows 和 UNIX 下的工作原理基本相同。输入 `ping`\
  \ 加上另一台计算机的名称或 IP 地址。两种 `ping` 命令的格式所示。`Ping` 将确定目标是否可达。如果 `ping` 继续显示输出行，你可以按 `Ctrl-C`\
  \ 终止它：\n\n```\nping computer-name\nping IP-address\n```\n\n如果你收到提示未找到 `ping` 命令的错误消息，请尝试按如下方式输入\
  \ `ping`：\n\n```\n/usr/sbin/ping computer-name\n```\n\n使用 `ping` 命令有两个潜在的缺点。首先，如果你输入了远程计算机的名称，可能是你的\
  \ `DNS`（域名系统）服务器将你输入的服务器名称翻译成了错误的 IP 地址。如果提供了不准确的 IP 地址，这可能是问题的所在。要确定这是否为问题，你应该将\
  \ `ping computer-name` 命令返回的 IP 地址与标识远程计算机 IP 地址的文档进行比较。如果 `ping-by-name` 返回的 IP\
  \ 地址与你的记录不匹配，则 `DNS` 存在问题。联系你的网络团队并在他们解决时配合。\n\n你还应该执行 `ping` 命令并指定远程计算机的 IP 地址。这将帮助你确定在使用准确的\
  \ IP 地址时是否可以访问远程计算机。\n\n之前的建议假设你有一份“拓扑”文档或其他文档，显示了组织所有计算机的名称和正确的 IP 地址。如果不存在此类文档，那么现在是创建它的好时机。\n\
  \n`ping` 命令的第二个潜在问题是某些服务器被配置为忽略 `ping` 命令。这样做是一种安全措施，有助于保护它们免受 `DOS`（拒绝服务）攻击。如果你每次\
  \ `ping` 特定的服务器时都得到“Request Timed Out”（请求超时）的结果，那么可能意味着它被设置为忽略 `ping` 命令。\n\n###\
  \ 24.10.2 数据库连接\n\n如果你的连接问题似乎与数据库有关，那么你应该检查是否可以从应用程序服务器访问数据库服务器。应用程序服务器上可能有一个工具允许你启动数据库会话。例如，如果使用的数据库是\
  \ Oracle，那么 `SQL*Plus` 可能已经加载到应用程序服务器上。使用如下所示命令打开与数据库的 `SQL*Plus` 会话：\n\n```\nsqlplus\
  \ username/password@hostname\n```\n\n如果建立了了会话，则证明与数据库服务器之间存在连接。如果 `SQL*Plus` 命令失败，则存在问题。下一步是与\
  \ DBA 团队协作确认数据库引擎是否正在运行。如果它正在运行，你可能需要与网络团队合作，验证应用程序服务器是否可以与数据库服务器通信。\n\n### 24.10.3\
  \ Traceroute\n\n如果 `ping-by-name` 和 `ping-by-IP` 失败了，那么你需要找到在你的服务器和目标地之间路径的哪个位置失败了。你需要知道你的计算机是否能够连接到互联网或其他网络。你的组织有一个被称为“网关路由器”的设备，它作为你的网络与其他所有网络之间的网关。运行\
  \ `traceroute` 命令来确定你的通信尝试是否成功“出了大门”。如果结果表明你的 `traceroute` 尝试没有通过你的网关路由器，那么你需要联系组织的网络团队来解决问题。\n\
  \n`traceroute` 与 `ping` 一样，可以确认是否可以建立到目标计算机的连接。`traceroute` 的输出表示从你的服务器到目标计算机需要经过多少台服务器或跳数。`traceroute`\
  \ 命令的格式为：\n\n```\ntraceroute destination\n```\n\n其中 `destination` 可以是名称或 IP 地址。\n\
  \n如果与另一计算机的通信非常缓慢，此命令可以提供很多信息。它可以告诉你路径上经过了过多的跳数，或者路径上的某个特定计算机通信时间比预期长。如果是这任何一种情况，问题都不在于服务器。\n\
  \n### 24.10.4 tnsping\n\n`tnsping` 是 Oracle 提供的实用程序，用于确定是否可以建立到 Oracle 数据库服务器的连接。如果你的应用程序使用\
  \ Oracle 数据库，可以使用 `tnsping` 来确定应用程序服务器是否与 Oracle 数据库服务器通信。命令的格式为：\n\n```\ntnsping\
  \ service-name\n```\n\n如果你不知道服务名称的值，可以在 Oracle 软件子目录下的 `tnsnames.ora` 文件中找到它。\n\n\
  ### 24.10.5 netstat\n\n`netstat` 显示以下网络通信信息：\n\n* **活动端口**：运行带有 `-a` 选项的 `netstat`\
  \ 会列出所有活动端口。这意味着服务器上开启的所有入站网络连接列表。它还列出了打开每个端口的进程、该端口是用于输入还是输出以及使用了什么协议。\n* **路由表**：路由表存储了可以直接通信的计算机列表。你可能会感到惊讶，但你的服务器并不知道互联网上的所有服务器。它知道一些其他计算机，这些计算机又知道更多计算机，这些计算机又知道更多计算机，以此类推。要仅查看路由表信息，在调用\
  \ `netstat` 时包含 `-r` 选项。\n\n\n\n\n\n# 统计\n可以通过运行带有 `-s` 选项的 `netstat` 获取协议统计信息，该命令会显示支持的每个协议（`tcp`、`udp`、`ip`、`icmp`、`igmp`）的统计列表。显示的某些数据包括：发送包、接收包、连接请求、接受连接、建立连接。\n\
  \n## 24.10.6 uptime\n`ruptime`（远程 uptime）显示网络上所有机器的状态。它还提供了每台计算机运行时间以及最近负载水平的信息。`ruptime`\
  \ 的形成如下：\n\n```\nruptime\n```\n\n## 24.10.7 rwho\n`rwho`（远程 who）列出登录到网络中所有机器的用户。请注意，由于安全考虑，并非所有网络都可用\
  \ `rwho`。如果你需要知道谁登录了另一台计算机且 `rwho` 无法工作，那么你必须远程登录该机器并运行 `who`。该命令的格式为：\n\n```\n\
  rwho\n```\n\n## 24.10.8 nslookup\n如果你的用户或应用程序无法连接到服务器，问题可能是本地名称服务器已过期或包含不准确的信息。`nslookup`\
  \ 命令允许你查询域名系统（DNS）以收集其包含的域名信息。通过使用它，你可以学习正在使用的名称服务器名称和 IP 地址。你还可以获取名称服务器所维护信息的机器的\
  \ IP 地址。\n\n图 24.8 显示了调用 `nslookup` 获取服务器“dr005”详细信息的运行。`nslookup` 命令还有其他可用参数，可以在其\
  \ man 页中查看。\n\n![image](img/F000248f24-08-9780123985453.jpg)\n\n图 24.8 `nslookup`\
  \ 命令。\n\n## 24.10.9 防火墙问题\n可能是你组织的防火墙导致了连接问题。防火墙配置的更改导致无法连接到昨天运行运行的服务器，这种情况并不罕见。根据你的专业水平，你可以自己调查，也可以联系组织管理防火墙的团队。这里非常有必要发出警告：要非常小心，不要对防火墙引起问题或进行未经许可的更改。这样做可能会为你、你的用户其他应用程序以及他们的用户带来极其严重的问题。\n\
  \n如果你了解组织的防火墙，可能会考虑检查防火墙配置或其日志，以查看是否有任何关于问题的线索。两个可能提供一些见解的命令是：\n\n| `iptables -n\
  \ -L` | 列出防火墙中配置的所有规则。如果你不熟悉防火墙规则，那么此命令的输出对你来说可能是无法的。 |\n| `tail -f /var/log/messages`\
  \ | 重复列出位于 `/var/log/messages` 目录日志文件中最近添加的 10 条目。 |\n\n## 24.10.10 网络分析工具\n可以获取许多网络分析工具来提供你的服务器与其他机器之间通信的详细信息。对它们进行深入描述超出了本书的范围。\n\
  \n### 24.10.10.1 tcpdump\n`tcpdump` 是一个从命令行启动的数据包分析器。它可以用于拦截接收到的数据包。它运行在 Linux 上。\n\
  \n### 24.10.10.2 Wireshark\n`Wireshark` 是一个用于故障排除的工具。使用它的 GUI（图形用户界面）可以捕获大量的流量。\n\
  \n### 24.10.10.3 Cheops\n`Cheops` 是一个开源包，允许你连接到网络。它提供了所有主机的映射。\n\n### 24.10.10.4\
  \ 连接工具\n有很多与连接相关的工具。它们在接后的章节中描述。\n\n### 24.10.10.5 Telnet\n`Telnet` 是一个允许你连接到另一台计算机的实用程序。要启动会话，请输入以下命令：\n\
  \n```\ntelnet remote_computer.domain.com\n```\n\n### 24.10.10.6 rsh\n`rsh`（remote\
  \ shell）是连接另一台计算机的另一种方法。要使用 `rsh`，你必须有一个账户。\n\n```\nrsh -l username remote_computer.domain.com\n\
  ```\n\n### 24.10.10.7 ssh\n`ssh`（secure shell）是一种更安全的登录方法。ssh 会话期间传输的通信是加密的。启动远程会话的\
  \ `ssh` 命令格式为：\n\n```\nssh remote_computer.domain.com\n```\n\n### 24.10.10.8 PuTTY\n\
  `PuTTY` 是一个允许你连接远程计算机的开源实用。尽管它最初是为 Windows 编写，但它已移植到许多平台。\n\n### 24.10.10.9 ftp\n\
  `ftp` 文件传输协议是一个 UNIX 应用程序，用于在机器之间传输文件。`ftp` 有许多 GUI 实现，但大多数 UNIX 系统都支持该工具的命令行版本。要启动\
  \ `ftp` 会话，请输入以下命令：\n\n```\nftp remote_computer.domain.com\n```\n\n### 24.10.10.10\
  \ rcp\n`rcp`（remote copy）是一个 UNIX 命令，允许你向或从远程计算机传输一个或多个文件。为了向或从另一计算机移动文件，你必须在远程机器上已经有一个激活的账户。\n\
  \n\n\n\n将文件复制到远程计算机的常用 `rcp` 命令格式如下：\n\n```\nrcp example.txt kellyb@remote_computer.domain.org:\n\
  ```\n\n从远程计算机复制文件到本地计算机的命令是：\n\n```bash\nrcp kellyb@remote_computer.domain.org:example.txt\n\
  ```\n\n## 24.10.11.7 scp\n\n`scp`（安全复制）的语法和功能与 `rcp` 类似，但更安全。`SCP` 在传输之前会对文件内容进行加密。如果有人在你文件传输过程中捕获并检查数据包，他们将无法读取内容。\n\
  \n将文件复制到远程计算机的常用 `scp` 命令格式如下：\n\n```bash\nscp example.txt kellyb@remote_computer.domain.org:\n\
  ```\n\n从远程计算机复制文件到本地计算机的命令是：\n\n```bash\nscp kellyb@remote_computer.domain.org:example.txt\n\
  ```\n\n# 第 25 章：Linux 工具\n\n## 摘要\nLinux 服务器上的应用程序管理员可以使用多种工具。本章描述的大多数工具都是命令行类型，可以在一种\
  \ Linux Shell 中执行。\n\n### 关键词\nLinux Shell；命令行；环境变量；重定向；管道；基础 Linux 命令；命令历史；任务跟踪；终止任务；后台；前台；任务调度；安全；文本编辑器\n\
  \nLinux 是 UNIX 的衍生版本，因此 第 24 章 中描述的许多命令和技术也适用于 Linux。在本章中，我尝试仅列出 Linux 特有或与其 UNIX\
  \ 命令相比发生显著变化的命令和功能。\n\n## 25.1 Linux 简介\nLinux 的创建是为了作为 UNIX 的免费替代方案。目前，它运行在从桌面电脑到超大型服务器的各种平台上。Linux\
  \ 的更新由一组专门开发者提供，他们贡献时间和专业知识但不要求任何报酬。\n\n## 25.2 Shell\n与 UNIX 系统一样，Linux 中的 Shell\
  \ 是用户和操作系统之间的接口程序。接下来的章节描述了与 Linux 相关的主要的 Shell。\n\n### 25.2.1 Bash\n`Bash` 或“The\
  \ Bourne Again Shell”是 Linux 系统的标准 Shell。它是 Bourne shell 的超集。实际上，在 Bourne shell\
  \ 中可以运行的所有命令和脚本在 `Bash` Shell 中同样可以运行。\n\n### 25.2.2 tcsh\n`tcsh` Shell 是 C shell\
  \ 的扩展。在 C shell 中编写的脚本可以在 `tcsh` Shell 中运行。\n\n## 25.3 目录结构\nUNIX 和 Linux 的目录结构几乎相同。Linux\
  \ 机器上常见但在 UNIX 机器上没有的目录包括：\n\n* `/run`——用于存储临时文件。它们不放在 `/tmp` 目录中，因为该目录可能会被删除\n\
  * `/selinux`——用于安全 Linux 安装\n\n## 25.4 环境变量\n| 命令 | 描述 |\n| :--- | :--- |\n| `Printenv`\
  \ | 类似于 UNIX 的 `env` 命令，显示所有定义的环境变量 |\n| `Set` | 如果不提供参数，则显示当前 Shell 中定义的所有变量的值\
  \ |\n| `Readonly` | 防止为此命令参数列表 Shell 变量赋值新值 |\n\n## 25.5 基础 Linux 命令\n列出了一些 Linux\
  \ 特有或与其 UNIX 命令相比发生显著变化的命令。要了解命令的详细信息，你应该使用 `man` 命令。\n\n| 命令 | 描述 |\n| :--- | :---\
  \ |\n| `---` | --- |\n| `change` | 修改密码 |\n| `cksum` | 计算文件的校验和 |\n| `egrep` | 使用正则表达式产生与\
  \ `grep` 相同 |\n| `find` | 在目录树中搜索文件 |\n| `gawk` | `awk` 的 GNU 版本 |\n| `gzexe` |\
  \ 可执行实用程序 |\n| `gzip` | 压缩文件 |\n| `gunzip` | 解压缩文件 |\n| `reset` | 重置终端 |\n| `sum`\
  \ | 计算并打印校验和 |\n\n## 25.6 命令行帮助\nLinux 还提供了命令行帮助。下文描述了其中一些功能。\n\n### 25.6.1 重复命令\n\
  `history` 命令显示存储最近命令的缓冲区。你可以指定显示的命令数量。示例包括：\n\n* `fc -l 10`: 列出历史中最旧的 10 条命令\n*\
  \ `fc -l -10`: 列出历史中最近的 10 条命令\n* `fc -l -1 > output_file`:将最近的命令写入文件\n* `fc -e\
  \ vi 15`: 用编辑器打开最旧的 15 条命令\n\n### 25.6.2 命令历史\n一旦显示了历史内容，你就可以重新执行特定的命令。要执行历史中的第\
  \ 5 条命令，输入：`!5`\n\n要执行以特定字符开头的命令，使用感叹号： `!ls`\n\n可以通过输入以下命令清除历史缓冲区：\n`history -c`\n\
  \n如果由于某些原因你想禁用历史功能，输入：\n`export HISTSIZE=0`\n\n### 25.6.3 命令行自动补全\nLinux 命令通常不长，但文件名或子目录名可能很长。说实话，如果你输入前几个字符然后按\
  \ Tab 键，Linux 有能力为你补全命令。当你这样做时，将显示与输入匹配的第一个命令或名称。如果你寻找的命令、目录或文件名不是显示的，再次按 Tab 键将显示下一个匹配。\n\
  \n### 25.6.4 which\n当命令准备执行时，Shell 会在 `PATH` 环境变量所有目录中搜索该命令或程序。找到的命令或可执行文件将执行执行。`which`\
  \ 命令可用于识别将执行哪个命令或程序。\n\n`which` 命令的格式为：\n\n`which command_name`\n\n输出将要执行的命令或程序的完整路径。例如，假设\
  \ `PATH` 变量包含以下字符串：\n\n```\n/app1/bin:/app2/bin\n```\n\n\n\n同样假设这两个 bin 目录都包含一个名为“myapp”的可执行文件。如果你在命令行中输入“myapp”，将执行的是\
  \ `/app1/bin` 中的版本。如果你想执行 `/app2/bin/myapp`，那么你就运气不佳了。你可能甚至没有意识到存在两个版本的 `myapp`，并认为问题是由\
  \ `/app2/bin/myapp` 中的代码错误引起的。运行 `which` 命令可以让你准确地识别出正在执行的是哪个程序。\n\n## 25.7 运行作业\n\
  \n在 Linux 中运行作业的方法与 UNIX 中的描述完全相同。只需在命令提示符中输入作业名称并按回车键即可。接下来的章节描述了让作业运行更加灵活、高效的工具和方法。\n\
  \n### 25.7.1 前台和后台作业\n\nLinux 与 UNIX 一样，提供了在前台或后台创建作业的能力。前台作业会占用命令行，而后台作业不会。作业可以在这两个级别之间移动。\n\
  \n### 25.7.2 wait\n\n`wait` 命令会暂停执行，直到所有后台作业完成。`wait` 命令的两种变体是：\n\n| wait id | 等待到\
  \ id 对应的进程完成 |\n| :--- | :--- |\n| `wait $!` | 等待到最近创建的后台进程完成 |\n\n### 25.7.3 终止作业\n\
  \n可以使用以下 Linux 命令杀死一个或多个进程。\n\n| command | 描述 |\n| :--- | :--- |\n| `killall process_name`\
  \ | 杀死名为 `process_name` 的进程。如果运行了多个同名进程，它们都将被杀死 |\n| `killall5` | 杀死除运行此命令的进程以外的所有活动进程。`killall5`\
  \ 命令只能由超级用户账户运行 |\n\n## 25.8 调度作业\n\nLinux 和 UNIX 中存在用于调度作业的相同基本工具。下列出的命令是 UNIX\
  \ 标准功能的 Linux 版本的变体。\n\n### 25.8.1 atq\n\n`atq` 命令列出当前用户调度的所有待处理作业。如果当前用户恰是 root（即超级用户），则列出每个用户调度的作业。\n\
  \n```\natq\n```\n\n### 25.8.2 atrm\n\n`atrm` 命令的格式为 `atrm job#`。输入后，它将删除与该编号相关的作业。\n\
  \n```\natrm job#\n```\n\n### 25.8.3 batch\n\n`batch` 命令会在作业负载水平低于某个平均水平时，执行已由 `at`\
  \ 命令调度的作业。默认情况下，该水平为 0.8，但它是可以配置的。\n\n## 25.9 学习服务器的工具\n\n每个操作系统系统中都存在提供计算机背景信息的工具。Linux\
  \ 中提供的某些功能已在接下来的章节中进行了描述。\n\n### 25.9.1 hostid\n\n输入命令 `hostid` 会让主机的 id 返回其数字标识符。对于\
  \ Linux 机器，主机 id 值是第一块以太卡的 MAC（介质访问控制）地址。你应该注意此 ID 数字是一个十六进制数。它可能包含字母“a”到“f”以及数字。该命令的格式为：\n\
  \n```\nhostid\n```\n\n### 25.9.2 dnsdomainname\n\n`dnsdomainname` 命令返回 DNS 域名。这是将互联网域名和主机名转换为相应\
  \ IP 地址的服务器名称。每当计算机尝试连接网络上的另一台机器时，这些翻译就会发生。`dnsdomainname` 命令的格式为：\n\n```\ndnsdomainname\n\
  ```\n\n### 25.9.3 服务器上正在运行什么\n\n`tload` 命令显示系统平均负载的图形表示。如果命令中包含了延迟参数（`tload -d delay_count`），则图形每隔\
  \ `delay_count` 秒更新一次。该命令的格式为：\n\n```\ntload\n```\n\n要学习正在运行的进程标识符（PID），可以使用 `pidof`\
  \ 命令。只需在命令中如下输入进程名称：\n\n```\npidof process_name\n```\n\n将显示该进程的进程标识符（PID）值。\n\n\
  ### 25.9.4 谁在使用进程或文件？\n\n可以使用 `fuser` 命令识别正在使用文件或目录的进程。命令的格式中 `name` 是文件名或目录名。\n\
  \n```\nfuser name\n```\n\n### 25.9.5 wall\n\n要向当前登录到这台电脑的所有用户发送消息，可以使用 `wall`（写入所有）命令。命令的格式为：\n\
  \n```\nwall message\n```\n\n其中 `message` 是要发送的消息。所有当前登录的用户都将在他们的终端上看到该消息，以及发送者和发送时间。\n\
  \n## 25.10 基础 Linux 安全\n\n可以说，Linux 系统的受攻击频率可能不如 Windows 系统频繁，但这并不意味着因为你支持的应用运行在\
  \ Linux 服务器上，就可以忽视安全。对于 Linux 系统以及所有其他操作系统，意识到各个级别的安全问题至关重要。希望接下来的章节将为你提供关于如何使 Linux\
  \ 系统更安全的额外知识。\n\n### 25.10.1 修改文件的访问权限\n\n`chattr` 命令更改一个或多个 Linux 文件的属性。该命令相当于\
  \ UNIX 的 `chmod` 命令。该命令的格式为：\n\n```\nchattr [options] filename1 filename2\n```\n\
  \n其中 `filename1` 和 `filename2` 是要修改的文件或目录。选项可以精确指定给文件（们）哪些属性。另一个递归属性 `-R` 会导致 `chattr`\
  \ 命令修改目录及其内部文件的访问权限。\n\n### 25.10.2 chpasswd\n\n如果你想更改单个账户的密码，可以使用 `passwd` 命令。如果你有一列表需要更改密码的账户列表，Linux\
  \ 命令 `chpasswd` 将非常有帮助。该命令的格式为：\n\n```\nchpasswd\n```\n\n它从标准输入读取，期望每行一个用冒号分隔的用户名和密码。当你输入完列表中的所有用户后，输入\
  \ `Ctrl-D` 终止输入并退出命令。\n\n如果用户名和密码列表存在于文件中，可以使用重定向字符将该文件导入 `chpasswd`。此操作的示例：\n\n\
  ```\nchpasswd < user_list.txt\n```\n\n其中 `user_list.txt` 是包含用户名和密码的文件。例如：\n\n```\n\
  jkash:singer1\nmdaemon:actor1\nppicasso:painter1\n```\n\n\n\n\n无论你支持的应用有多成熟，总会有空间引入可以提高你工作效率的工具。工具可以以多种形式存在。即使是一个看起来极其简单的工具，也可能对你大有帮助。以下都是合法的工具形式：\n\
  \n- 供应商提供的实用程序\n- 脚本\n- 程序（无论简单还是复杂）\n- 检查清单\n\n使用工具或脚本的一些优点包括：\n\n- 它比手动操作更快\n\
  - 一旦脚本或工具经过调试，它的准确性会更高\n- 它是可重复的\n- 你可能对它进行计划任务\n- 你可以将其委托给你的备用人员\n\n## 26.1 不要重复轮子\n\
  \n如果你需要的工具已经存在，那么就使用它。如果你像大多数应用程序管理员（Application Administrators）一样，你会有足够的事情要做，而没必要去重新发明一个已经存在的工具。这里列出了一些预存工具的潜在来源。\n\
  \n### 26.1.1 供应商是否已经提供了你需要的工具？\n\n在花费时间和精力的创建工具之前，你应该阅读供应商提供的文档，以确保他们没有提供过该工具。如果供应商提供了类似于“管理员指南”的手手册，那应该是你搜索工具列表的首选目标。任何描述为“技术工具包”、“参考指南”或“工具”的文档也是获取可用工具详情的潜在来源。\n\
  \n另一个潜在来源是供应商是否在他们的支持网站上提供了知识库（`KB`）或常见问题列表（`FAQ`）。这些内容通常包含来自他们支持人员的论文或提示，以及像你这样的应用程序管理员提交的内容。如果有知识库或\
  \ FAQ 列表，绝对值得检查一下，看看里面可能包含什么瑰宝。\n\n供应商提供的工具的一个示例是批量注册实用程序。曾几何，我是一个学习管理系统（`LMS`）应用程序的管理员。我工作的公司定期会进行合并或收购。当发生这种情况时，所有新员工都必须在\
  \ LMS 中注册。有时是 10 个人，有时是 100 个人。供应商提供了一个可以读取 `CSV`（逗号分隔值）文件并批量注册其中名称的工具。它不是最可靠或最灵活的工具，但在\
  \ 99%的情况下，它可以处理我们的需求。我可能可以写一个工具来复制或改进它，但那是浪费我的时间。现有的工具并不完美，但能胜任工作。\n\n### 26.1.2\
  \ 用户组是否已经提供了类似的工具？\n\n你支持的应用有用户组吗？如果是，那么它可能有某些价值信息（包括工具）的来源。\n\n你如何发现该用户组是否有有价值的内容？检查它是否有网站。如果存在，就仔细搜寻以寻找工具、提示和脚本。了解它是否有可提供内容的其他方法还包括：\n\
  \n- 参加用户组会议。许多用户组每年至少举办一次全国性会议。如果你足够幸运能够参加，请明智地规划你的时间。选择标题或摘要暗示对管理员有价值的演讲。许多会议要么在网站上发布演示文稿，要么在\
  \ DVD 上提供。即使可能要花几块钱，也买一份吧。如果你发现了一个工具或提示，那么这笔钱就值回票了。\n- 如果你所在的地区有本地会议，请参加。本地会议不会像年会那么大，但它们经常会邀请来自供应商、资深用户或顾问的人。本地会议的一个优势是，大多数参与者都在你的地区生活和工作。这正好引出了下一点。\n\
  - 建立人脉、建立人脉、建立人脉。无论你参加的是全国活动还是局部活动，都要结识你的同行。交换姓名、电子邮箱地址和背景。你今天一起吃午饭的人可能在一两个月后帮助你解决问题。但除非你花精力去联系他人，否则这不会发生。\n\
  - 为公共利益做贡献。如果你有一个好的提示或工具，就将其发布在网站上，或就此举办一场演讲。你不仅会帮助你的同事管理员们，人们还会认为你是专家专家。这将帮助你建立人脉。\n\
  \n### 26.1.3 你正在寻找的内容在网上可用吗？\n\n互联网是潜在工具的绝佳来源。使用同一应用程序的人数会非常少，但支持其他应用程序的管理员通常有类似的需求。在开始编写新工具之前，花一点时间进行互联网搜索。即使你没有找到完全符合要求的，你也可能找到足够相似的东西并对其进行修改以满足你的即时需求。\n\
  \n### 26.1.4 是否有同事创建过类似的工具？\n\n你的应用程序管理员同事可能没有与你处理同一个应用程序，但他们的需求可能与你非常相似。如果你需要一个脚本来启动备份并执行其他任务，很有可能你所在的组织或部门有人有同样的需求。问问大家，看看你正在寻找的工具是否已经存在于某人的桌面上。如果没有人写过，那么也许你可以合作构建它，或者在你完善它之后将其分享出来。\n\
  \n如果你想成为表现之星，你可以制定一种方法，让你和同事们分享各自开发的工具。你可以在门户网站上、共享驱动器上或在每月的午餐学习会议（lunch-and-learn\
  \ session）期间这样做。管理层应该将这些努力视为团队合作的典范，并认可你超出了职责。\n\n### 26.1.5 是否有商业产品？\n\n开发者倾向于认为他们可以快速拼凑出满足他们需求的东西。如果目标足够简单，这可能是真的，但随着工具需求变得越来越复杂，开发它的时间和和开发成本很容易超过现有产品的价格。使用你最好的判断，但不要被对你或你的团队开发工具速度的不切实际估算所蒙蔽。\n\
  \n## 26.2 工具示例\n\n接下来的章节描述了一些会被证明非常有用的工具类别。这些只是我遇到过的一些建议。任何你发现自己执行超过一次的事情都应该是工具的候选对象。如果某项特定任务完成的时间超过几分钟，那么它也是工具的可能候选对象。列一份你想要自动化或脚本化的物品清单，并在空闲时间开发那些回报率最高的工具。\n\
  \n### 26.2.1 状态检查\n\n如果你的应用程序由服务器上运行的一个服务或进程组成，那么编写一个脚本或批处理文件来查询服务状态可能是值得的。如果你支持多个应用程序，很容易忘记具体哪些服务支持每个应用程序。拥有批处理文件会让检查应用程序状态变得更容易更快捷，特别是当发生故障且你想快速了解情况时。\n\
  \n这里显示非常简单的批处理文件 `AppCheck.bat`，它在 Windows 服务器上运行并返回 `FIN_APP` 应用程序四个服务的状态：\n\n\
  ```\nREM 返回与 FIN_APP 关联服务的状态\n\nsc query FinAppAdminServer | find “STATE”\n\nsc\
  \ query FinAppServer1 | find “STATE”\n\nsc query InterstateAdminServer | find “STATE”\n\
  \nsc query InterstateServer1 | find “STATE”\n```\n\n\n\n\n\n该批文件创建的输出类似于图 26.1 所示。如果所有服务的状态均为“RUNNING”（运行），则应用程序已启动。任何其他状态值，例如\
  \ STOPPED（停止），表示应用程序存在问题。\n\n![image](img/F000261f26-01-9780123985453.jpg)\n\n图\
  \ 26.1 应用程序状态批处理结果。\n\n如果你的应用程序运行在多个服务器上，可以添加查询语句来检查运行在另一个服务器上的服务状态。这里了从远程服务器获取状态的代码：\n\
  \n```\nREM Returns status of services on the FIN_APP report server\nsc \\\\finapp002\
  \ query CC | find “STATE”\nsc \\\\finapp002 query Dashboard | find “STATE”\n```\n\
  \n在 UNIX 服务器上运行的脚本看起来会有很大不同，但复杂性并不大。这是一个简单脚本的示例。如果没有返回四个进程中的一个，则意味着该特定进程没有运行。\n\n\
  ```bash\n# Returns status of processes associated with FIN_APP\nps -el | grep FinApp\n\
  ps -el | grep FinAppServer1\nps -el | InterstateAdminServer\nps -el | InterstateServer1\n\
  ```\n\n## 26.2.2 比较服务器\n\n早期的章节强调（或者说反复？）为你的应用程序准备多个环境的性，例如 `DEV`、`QA` 和 `PROD`。总会有一天，你的应用程序在某个服务器上运行正常，但在另一台服务器上不是。例如，它在\
  \ `DEV` 上运行良好，但在 `QA` 上有些奇怪。确定原因的一种方法是比较这两个系统。如果你有一个可以比较以下类型对象的工具，这将使任务变得极其简单和快速。\n\
  \n* 注册表\n* 目录树\n* 特定文件，例如配置文件、属性文件、初始化文件\n* 服务\n* 计划任务\n* 启动任务\n* DSN——数据源名称\n*\
  \ 数据库连接字符串\n* IIS 条目\n* 开放端口\n* DLL 版本\n\n如果最初你无法自动化整个比较过程，不要担心。从从小开始，然后随着时间的推移向比较过程中添加更多对象。如果你无法编写脚本来自动化该过程，至少要准备一个需要比较内容的清单。按照清单操作比试图从你过度劳的记忆中记住需要比较的内容要快得多且有效得多。\n\
  \n## 26.2.3 启动和停止脚本\n\n根据我的经验，应用程序需要定期（即使不是很频繁）地启动和关闭。以下是你可能需要关闭应用程序的一些示例：\n\n*\
  \ 执行备份\n* 升级应用程序\n* 对操作系统或支持软件进行维护\n* 执行数据的批量插入\n* 进行硬件维修、更换或升级\n* 供应商可能会出于性能考虑建议定期重启（bounced）\n\
  * 在业务财年的关键期间锁定用户，例如，以便结上上年度的账目\n\n如果你的应用程序非常简单，它将由运行在单个服务器上的单个服务组成。停止和启动这样的应用程序并不困难。复杂的应用程序可能在多个服务器上运行许多服务。在许多情况下，服务需要按照特定的顺序启动。如果供应商没有提供启动和停止应用程序的脚本，那么你一定要自己编写它们。与其相信你的记忆和打字技巧，你应该创建一个按正确顺序启动所有内容的脚本。\n\
  \n编写此类脚本的其他愉快副产品是：\n\n* 运行脚本应该是无错误的\n* 它通常比手动操作快\n* 你可以启动脚本，然后处理其他事情，直到它完成\n* 脚本可以调度在特定时间运行，例如在正在进行备份时\n\
  * 它们更容易让你的备份程序执行。你有备份，对吧？\n\n关闭应用程序通常比启动它更简单快捷。停止服务或进程的时间通常比启动它们的时间短。通常，服务停止的顺序没有启动的顺序重要。尽管停止应用程序更快更简单，但拥有一个可以为你执行此操作的仍然仍然。如果你编写了启动应用程序的脚本，你也应该花时间写一个停止脚本。\n\
  \n## 26.2.4 数据备份和恢复\n\n应用程序数据需要定期进行备份。“定期”的定义取决于许多因素。其中一些条件是：\n\n* 数据是以读为主还是以写为主？\n\
  * 每天更改多少数据？\n* 数据对组织的运行是否至关重要？\n* 如果数据丢失，可以从其他源或应用程序恢复吗？\n* 是否有法律或监管要求规定数据备份的频率？\n\
  \n### 26.2.4.1 备份\n\n根据你对上述问题的回答，你的应用程序数据可能需要每小时、每天、每周或实时进行备份。对你来说，每小时备份一次数据可行吗？理论上你可以每天做一次，但你想这样做吗？通常，数据是在“非工作时间”备份的。我不希望承担那项义务。\n\
  \n如果你不能或不想手动运行备份过程，那么你只能使用工具来执行。如果你足够幸运，供应商提供了脚本或工具。如果他们没有，那么你必须自己开发。如果你被迫自己开发脚本或工具，那么我的建议是测试、测试、再测试。当你在\
  \ `TEST` 或 `QA` 环境完成备份过程测试后，执行恢复并验证每个保存的数据都已恢复。\n\n注意我没有使用“数据库备份”或“数据库恢复”这个词。这个词的选择是有刻意的。对于某些应用程序，所有数据都存在关系型数据库中。在这种情况下，备份过程是简单的，可能由数据库内置的功能处理。对于其他应用程序，数据库之外可能还有文件或其他形式的数据需要在备份的同时的同时备份。没有外部文件的数据库备份是无用的，反之亦然。\n\
  \n### 26.2.4.2 恢复\n\n通常，数据恢复很少进行。你的 `DR (灾难恢复)` 计划可能执行和测试两次。除此之外，你可能永远不会在活动系统中进行恢复。编写恢复数据库脚本的主要原因是，一旦情况发生，你会希望恢复能够：\n\
  \n1. 第一次运行就正确\n2. 尽可能快速完成\n\n如果恢复过程无法自动化，那么你至少需要列出一份详细的执行步骤列表。不要假设你可以使用供应商提供的列表。你需要一个定制的列表，其中包含了供应商列表中未包含的特定环境细节。一些你组织特有的细节包括：\n\
  \n* 你的应用程序服务器名称\n* 你的数据库服务器名称\n* 应用程序使用的任何外部文件的位置\n* 数据库备份文件的位置\n* 外部备份文件的位置\n*\
  \ 恢复过程所需的时间\n* 执行恢复所需的账户\n\n\n\n\n一旦你开发了自定义列表，你就需要多次运行恢复过程，以确保列表的准确性。你应该能够在不影响用户的情况下，对\
  \ `DEV` 或 `TEST` 环境进行恢复。明智的做法是比你的灾难恢复（DR）测试计划更频繁地练习恢复。此外，让你指定的备份人员人员也练习恢复过程也是明智的。你可不希望在蜜月或家庭聚会期间被叫回去，只因为系统崩溃了而除了你之外没有人知道如何恢复它。\n\
  \n### 26.2.5 谁在登录你的服务器？\n\n如果你采纳了我关于应用程序服务器安全的建议，那么能够登录你服务器的人数将非常稀少。如果你选择不采纳建议，或者迫于压力允许管理员以外的人员访问这些服务器，那么你就麻烦了。我几乎可以向你保证，有一天服务器上会发生重大变化，而所有人都会否认是他们更改的。\n\
  \n如果有 10 个人可以访问服务器，但没有人承认是他们所为，你该如何确定是谁做了更改？一种方法是编写一个脚本来记录谁在什么时候登录了服务器。以下 Windows\
  \ 批处理文件中的命令每当有人使用 `RDC`（远程桌面连接）登录服务器时，都会写入包含日期、时间、用户名和 IP 地址的记录。此批处理文件需要位于应用程序服务器上的\
  \ `C:\\Documents and Settings\\All Uses\\Start Menu\\Programs\\Startup` 目录下。\n\n\
  ```batch\n@Echo off\n\nEcho %date% %time% %username% >> C:\\Who\\WhoLogOn.txt\n\n\
  Netstat -n -p tcp | Find “:3389” >> C:\\Who\\WhoLogOn.txt\n\nEcho===============================================\
  \ >>C:\\Who\\WhoLogOn.txt\n```\n\n图 26.2 显示了此脚本生成的输出文件 `C:\\Who\\WhoLogOn.txt` 的截图。你知道问题是从某个日期开始出现的，此日志文件可以快速缩小当天登录服务器的人范围。当然，如果有人真的想掩盖踪迹，他们可以编辑此日志文件以删除显示他们登录的条目。这个工具并不是为了发现高级黑客，它更多是为了“提醒”你的同事，他们在特定日期登录过服务器。\n\
  \n![image](img/F000261f26-02-9780123985453.jpg)\n\n图 26.2 谁登录了服务器。\n\n### 26.2.6\
  \ 报告脚本\n\n执行 `SQL` 查询以从数据库中选取数据的脚本可以作为廉价的报表工具。此类脚本可以执行以下步骤：\n\n* 运行 `SQL` 查询\n*\
  \ 格式化数据\n* 恰地命名输出文件，通常带有日期戳\n* 将文件通过电子邮件发送相关方\n\n以下自动化报告的非常简单的示例需要两个文件。第一个文件 `Report1.bat`\
  \ 是一个批处理文件，调度为定期运行，例如，每天或每周一次。它建立了与数据库的连接，然后启动第二个文件中的 `SQL` 语句。更高级的示例可以使用当前日期重命名输出文件，并将其电子邮件发送或通过\
  \ `ftp` 出去。\n\n批处理文件 `Report1.bat` 的内容为：\n\n```batch\nconnect username/password@DB_Host;\
  \ > %0.tmp\n\nwhenever sqlerror exit sql.sqlcode >> %0.tmp\n\n@Report1.sql; >> %0.tmp\n\
  \nexit; >> %0.tmp\n\nsqlplus -s /nolog @%0.tmp;\n```\n\n第二个文件 `Report1.sql` 包含从数据库提取数据、格式化数据并写入输出文件的\
  \ `SQL` 语句。\n\n`SQL` 文件 `Report1.sql` 的内容为：\n\n```sql\nSET FEEDBACK OFF\n\nSET HEADING\
  \ ON\n\nSET PAGESIZE 30000\n\nSET LINESIZE 300\n\nCOLUMN “FIRSTNAME” FORMAT A25\n\
  COLUMN “LASTNAME” FORMAT A25\nCOLUMN “CLASS” FORMAT A55\nCOLUMN “DATE” FORMAT A11\n\
  COLUMN “GRADE” FORMAT A3\nset termout off\n\nspool Report1.txt\n\nSELECT FirstName\
  \ AS FirstName, LastName AS LastName,\nLongName AS Class, TO_CHAR(DateTime,‘mm-dd-yyyy')\
  \ AS Date,\nTO_CHAR(WScore) AS Grade\nFROM Class\nWHERE a.Class_ID = 12345\n/\n\n\
  spool off\n\nexit\n```\n\n### 26.2.7 数据馈\n\n许多应用程序需要生成将数据馈给其他系统的文件。例如，你支持的应用程序可能需要将数据导出到属于你组织其他部门的系统、客户、供应商、厂商、政府监管机构等。在许多方面，这个过程与编写创建报告的脚本或批处理文件非常相似。\n\
  \n也许最大的区别在于，数据馈可能没有表头或花哨的格式。最可能需要的文件必须是 `CSV`（逗号分隔值）文件或固定长度文件。`CSV` 文件使用逗号来分隔记录中的字段。固定长度文件的每个字段都有固定长度，且整个记录长度也有固定长度。\n\
