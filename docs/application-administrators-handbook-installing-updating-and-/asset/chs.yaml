  \ 6.18 监控\n\n对应用程序服务器进行监控活动可以在问题达到关键点之前发现潜在问题。如果你的组织已经建立了监控机制，你将希望尽可能多地了解它。\n\n\
  经常监控的指标示例包括：\n\n• CPU 忙时间\n• 剩余磁盘空间\n• 磁盘 I/O\n• 磁盘队列长度\n• 页错误\n• 可用物理内存\n• 可用虚拟内存\n\
  • 网络 I/O\n• 登录失败次数\n• 已停止的服务\n\n你的组织是否有一个团队或个人监控应用程序服务器，以确保它们运行正常？\n\n• 监控过程使用什么工具？是自研工具还是商业工具？\n\
  • 监控过程对应用程序服务器产生了多大的开销？\n• 正在监控哪些指标？\n• 你能从监控团队获取一份列表吗？\n• 如果你想在应用程序服务器上监控一个新指标，可以添加吗？\n\
  • 如果特定指标超出范围，可以采取行动吗？例如，如果特定服务停止，可以停止并启动应用程序吗？\n• 如果监控团队在服务器上发现问题，他们会怎么做？\n• 解决服务器问题的步骤是否有记录？\n\
  \n应用程序是否会填满服务器的磁盘驱动器？\n\n• 如果驱动器满了，服务器和应用程序会发生什么？\n• 当这种情况即将发生时，是否会自动收到警报？\n• 当磁盘空间达到\
  \ 90% 时可以收到警告吗？95% Full？\n\n# 第 7 章\n\n# 变更控制管理\n\n## 摘要\n\n本章描述了可以建立的用于控制应用程序更改的变更控制管理。概述了整个流程，包括审批、变更控制软件包、工作流、将更改推向生产环境、异常以及测试更改。\n\
  \n### 关键词\n\n变更控制管理；审批；工作流；变更控制委员会；生产环境；萨班斯-奥克斯利法；`SOX`；异常；测试更改；回归\n\n几乎每一个软件应用程序都会受到变更的影响。可能某个非常小的应用程序仍然运行在某处几十年未过的\
  \ `DOS` 或 `UNIX` 机器上，但那将是最极的例外。对于典型的企业应用程序来说，变更是定期的、持续的不可避免的。\n\n你可以预期你支持的任何应用程序受到影响的变更示例包括：\n\
  \n• 来自应用程序供应商的补丁或热修复。这些在性质上通常非常有限且易于安装。它们通常分发用于修复应用程序中发现的特定问题。\n• 来自供应商的应用程序的升级。此类更改比补丁更大，且安装耗时更长。如果安装不正确，它还可能破坏应用程序。\n\
  • 供应商分发的更改可能是针对数据而非或额外的应用程序软件。应用程序供应商可能会分发 `SQL`（结构化查询语言）语句，`Application Administrator`（应用程序管理员）或\
  \ `DBA`（数据库管理员）连接到数据库后需要执行。这些命令可以修改现有数据、添加表或向表中添加列。数据更新的一个完美例子是税收变化。销售税、房产税、所得税、预扣税等的税率经常发生变化。任何处理这些种目的应用程序必须定期更新。\n\
  • 服务器的操作系统将会有持续不断的补丁需要应用。其中许多更改的目的将是加强服务器的安全性。为了让你的环境尽可能安全，你需要在实际情况下尽快安装它们。\n• 如果你的应用程序是基于\
  \ Web 的，那么你可能会收到 Web 服务器软件的补丁或升级。此类软件的示例包括 `Apache HTTP Server`、`Microsoft IIS`（互联网信息服务）和\
  \ `Sun Java System Web Server`。\n• 硬件升级也会偶尔发生，例如出于性能原因，可以将应用程序移动到更新、更强大的服务器上。\n\
  • 环境中可能会添加负载均衡软件和/或硬件。\n• 控制你的应用程序使用的数据的数据库引擎也会由该供应商分发补丁。这些可能是为了修复软件漏洞、增强性能或与安全有关。你完全可能不知道数据库正在进行的更改。你组织的\
  \ `DBA` 会从数据库供应商处接收这些补丁并安装在数据库服务器上。\n\n由于变更无法避免，你的组织需要一套流程来处理即将而来的变更。该流程需要对生产系统上代码和数据的更改进行控制。它需要良好的设计、完善的记录和广泛的宣传。还需要相关方的遵守。一个经常被忽略的流程是毫无价值的。\n\
  \n## 7.1 什么是变更控制管理？\n\n变更控制管理是对环境进行的所有更改进行系统控制的方法，以最大化应用程序的可用性和稳定性。在应用程序管理领域，它是控制应用程序环境的一种系统化方法。这包括应用程序软件、运行它的服务器、服务器上的支持软件、数据库引擎、网络连接以及应用程序依赖任何其他系统。\n\
  \n### 7.1.1 为什么要进行变更控制管理？\n\n实施变更控制流程有很多原因。它们增加价值的某些示例包括：\n\n• 记录支持应用程序的软件和整体环境\n\
  • 确保以系统化、经过批准的方式进行更改\n• 最大化对应用程序产生负面影响的更改进行成功回滚的可能性\n• 良好的沟通和透明有助于避免多个管理员同时实施可能相互干扰的独立更改\n\
  • 符合你组织的审计合规流程的要求\n\n\n\n\n\n- 通过遵循系统化、有方法的方法，你增加了变更流程的可重复性。每个人都喜欢高度可重复性且成功的流程。用户喜欢它，客户喜欢它，管理层（包括你的老板）也喜欢它。应用程序管理员也喜欢，因为这让他们的工作更具可预测性。\n\
  - 一个设计良好的变更控制流程可以减少应用程序管理员的时间。如果应用程序管理员的效率更高，组织可以用更少的 IT 人员完成工作活动。\n\n### 7.1.2\
  \ 变更控制步骤\n\n并没有什么“魔法步骤列表”可以构成一个完美的变更控制流程。每个行业和组织都有其独特的需求。但对于每项变更，应该记录一些基本信息。此列表中的数据项包括：\n\
  \n- 谁请求了变更？通常，这应该是应用程序的业务所有者。\n- 执行变更的业务理由。\n- 变更的来源，例如：应用程序供应商向所有许可者分发了变更、操作系统供应商发布了变更、应用程序管理员正在激活应用程序中的某功能或能力等。\n\
  - 应用程序所有者请求变更的日期。\n- 需要安装变更的目标日期。\n- 流程中的每一步由谁批准了变更。\n- 变更将影响应用程序中的哪些应用程序或模块。\n\
  - 一个用于确认变更执行符合预期的测试计划。测试计划应包含回归测试，以确认在实施时没有“弄坏”不相关的现有功能。\n- 测试计划中的测试何时运行，以及由谁运行的。\n\
  - 如果变更没有按预期执行，如何回滚（back out）变更的计划。这可能简单到删除新文件并恢复原始文件。另一方面，它可能会复杂得多且耗费时间。如果运行应用程序的服务器是虚拟机，那么回滚变更可能会容易得多。你可以请求数据中心的人员在你执行升级之前对虚拟环境拍摄快照。如果你需要回滚变更，他们只需用快照覆盖当前的虚拟机软件即可。给出一个建议——如果变更成功了，请告知数据中心，这样他们就可以删掉那个快照文件。对于能够删除一个几个\
  \ GB 大的文件，他们会非常感激的。\n\n### 7.1.3 审批\n\n为了确认变更正在正确实施，变更控制流程要求在路径的每一步获得批准。市场上上有可以购买并安装的软件包以实现此目的。可用软件包示例包括：\n\
  \n- Spiceworks\n- SLAM 变更管理控制软件\n- Pilgrim Software 变更控制管理软件\n- SysAid ITIL 变更管理\n\
  - Giva eChangeManager\n\n如果你的组织有内部开发人员，此功能可以在内部开发。如果你的组织走这条路线，有一个警告是：开发它将花费比预期更多的时间和成本。而且会有持续的变更请求。除非你的开发人员有丰富的经验和充足的时间来处理这项工作，否则你应该认真考虑获取已经开发、文档化并测试过的第三方变更控制管理应用程序。\n\
  \n### 7.1.4 变更控制软件\n\n作为应用程序管理员，你可能对选择和安装哪个变更控制管理软件包没有发言权。很可能它已经被选定并安装了。如果你在选择变更控制管理的过程中的过程中参与其中，请尽可能积极。自愿评估正在考虑的软件包。向任何愿意听的人提供你的反馈。你将与安装的软件包长期共处，所以现在要花时间和精力帮助确保选定的软件包符合你的需求、文档齐全、可靠且对用户来说直观。如果供应商为其产品提供任何在线培训，请尝试完成它。你对所考虑的每个工具了解越多，越可能选出最好的一个。\n\
  \n流程中可能需要审批的潜在步骤包括：\n\n1. 用户代表批准授权安装变更\n2. IT 管理层批准\n3. 用户代表批准测试计划\n4. 用户代表批准将变更安装到\
  \ UAT（用户验收测试）环境\n5. 用户代表验证测试计划在 UAT 上通过\n6. 批准将变更移动到生产环境（PROD）\n7. 用户代表验证测试计划在 PROD\
  \ 上通过\n8. 确认变更流程已完成。这包括向所有利益相关者发送电子邮件，告知变更是成功了，还是发生了问题且已回滚。\n\n### .1.5 工作流\n\n\
  一个设计良好的变更控制管理软件包通常会通知下一个审批者，以免工单在某一步无限期停滞，通常通过电子邮件实现。例如，当用户代表批准变更（步骤 #1）时，IT 管理团队将收到通知，告知变更正在等待\
  \ IT 审批。这种通知过程有助于确保工单在审批过程中继续移动。\n\n你组织的变更控制流程是正式的、非正式的还是缺失的？如果没有流程，绝对应该考虑建立一个。它可以根据你的需要变得极其简单或复杂，但必须存在某种流程。没有变更控制流程，你就是在邀请混乱。你的环境在没有它的情况下可能会挣扎一段时间，但最终会需要的。不如现在硬着头皮实施该流程，并尽早开始获益控制管理的益处。\n\
  \n## 7.2 软件配置管理 (SCM) 还是变更控制管理？\n\n软件配置管理 (SCM) 和变更控制管理之间的区别是什么？对我来说，软件配置管理是控制软件开发的过程。变更控制管理用于控制对生产环境的更改，即软件以及硬件。这可能不是一个严谨的学术答案，但根据我的经验，这看起来非常贴切。\n\
  \n应用程序管理员很少甚至从不实际更改应用程序。他可以修改配置参数。她可以决定应用程序加载到哪些服务器或驱动器上。他可以选择何时应用供应商分发的补丁或升级。她可以安装新的库或\
  \ jar 文件。但应用程序管理员并没有对应用程序的源代码进行更改。供应商为你提供新模块，例如可执行文件或库文件。供应商修改了源代码并将其编译成库或可执行文件。这些新组件随后分发到像你这样的客户站点。如果说有人在使用软件配置管理流程来控制软件，那是供应商，绝对不是软件的许可者。\n\
  \n## 7.3 变更控制委员会\n\n\n\n\n\n谁来决定对应用程序进行哪些更改？最初的答案似乎是应用程序的业务所有或应用程序管理员。但如果这些更改可能会影响其他应用程序呢？例如，如果薪资应用程序的更改需要对考勤应用程序也进行相应更改，那么薪资应用程序的所有者是否可以在不咨询拥有或维护考勤应用程序的团队的情况下自行做此决定？如果对发票应用程序的更改需要\
  \ DBA（数据库管理员）小组投入大量精力呢？发票应用程序的所有者是否可以在没有来自 DBA 团队或其他同样需要 DBA 时间的其他应用程序所有者意见的情况下占用\
  \ DBA 的时间？这些例子表明，决策者需要对组织的 IT 运营有一个“大局”视角。\n\n为了解决这种困境，至少有两种潜在的解决方案。第一种是让 IT 部门中的高层人员（例如\
  \ CIO，首席信息官）来做决定。该职位的人员既能保持公正，又能对 IT 运营拥有足够的“大局”视角。\n\n可能的第二解决方案是由一个小组或委员会做出决策。可以建立一个变更控制委员会（Change\
  \ Control Board）来批准影响多个应用程序的更改。如果某个应用程序的更改不会影响其他应用程序，那么变更控制委员会就不会覆盖应用程序所有者的决定。只有在以下情况下，委员会才会介入：\n\
  \n- 更改具有影响其他应用程序的可能\n- 更改需要大量的公共资源，例如 DBA、系统管理员、网络管理员等的时间\n- 更改可能会影响组织的安全\n- 更改的时间范围与其他应用程序所有者计划安排的更改发生重叠\n\
  \n### 7.3.1 变更控制委员会成员成员\n\n变更控制委员会的成员不必很多，但必须包含高级技术人员。组织的高级系统架构师应在委员会中占席，并可能担任主席。其他委员会成员可以是\
  \ IT 部门各小组的代表，或代表最重要应用程序的 IT 经理。提交了拟议更改的应用程序管理员预计在考虑其更改时参加会议。\n\n### 7.3.2 会议\n\n\
  会议举行的频率取决于组织。每周开一次会议似乎是合理的。频率更高的话，队列中的更改将不足以让会议变得有意义。如果会议频率较低，那么更改可能需要在两次会议之间的间隙实施，并需要以紧急模式进行处理。紧急更改（即异常）将在第\
  \ 7.9 节中讨论。\n\n### 7.3.3 提议更改\n\n拟议的更改可以通过多种方式收集。它们可以通过电子邮件提交给变更控制委员会的代表。如果组织有正式的变更控制应用程序，则可以通过周报提取录入其中的票工单（tickets）。一份列出所有拟议更改的电子邮件将在每次计划会议前的一或两天发送给所有委员会成员。\n\
  \n在每场会议期间，他们将审查已提交的所有应用程序或系统更改。更改的“所有者”简要描述更改的内容、潜在影响、回滚计划以及他们打算何时推出。在描述之后，开放提问环节。委员会此时将投票决定是批准还是拒绝拟议的更改。如果被拒绝，所有者将与委员会合作解决任何异议。\n\
  \n## 7.4 环境\n\n为了最大限度地减少应用程序受到更改负面影响的概率，最好至少拥有两个安装了该应用程序的环境。更改首先在 `QA`（质量保证）或 `TEST`（测试）环境中进行。在在\
  \ `QA` 环境中实施并测试更改后，它们将被移动（又称迁移）或提升到生产环境（`PROD`）。通过先在 `TEST` 或 `QA` 环境上安装更改，如果出现问题，这些问题可能会在非生产环境中被发现。\n\
  \n组织可能需要 `QA`、`TEST` 和 `PROD` 之外的环境。其他潜在的环境及其用途包括：\n\n- 开发环境（`DEV`）——通常，开发环境与开发或大量修改软件的组织相关联。某些从供应商处获得许可的第三方应用程序允许客户进行大量的编程，尽管应用程序的基础代码没有被更改。PeopleSoft\
  \ 是这种类型应用程序的范例。客户组织中的程序员可以编写大量的 `SQR` 代码来为基础产品提供定制。这些更改将在 `DEV` 环境中进行编码和测试。随后，它们将在\
  \ `QA` 环境中安装和测试。最后一步是将它们安装到 `PROD` 环境中。\n\n- 预发布环境（staging environment）可以存在于 `QA`\
  \ 和 `PROD` 环境之间。预发布环境目的是目的是一个与 `PROD` 环境物理完全相同的环境。如果生产环境的架构包括集群服务器、负载均衡、基于多处理器的服务器、RAID\
  \ 存储设备或其他 `DEV` 或 `QA` 环境中不存在的功能，组织可能需要预发布环境。\n\n- 如果应用程序特别复杂或需要对新用户进行正式培训，则可能需要培训环境（training\
  \ environment）。如果存在，培训环境上的软件应与 `PROD` 相同。在一个与他们开始在 `PROD` 上使用应用程序时看到的情况不相似的环境上培训新用户是没有意义的。\n\
  \n- 如果你对应用程序的使用有独特的测试要求，可能需要多个测试（`TEST`）环境。例如，一个跨国组织可能会将其业务划分为几个地区，如 `EMEA`（欧洲、中东和非洲）、`LATAM`（拉丁美洲）、`APAC`（亚太）等。每个地区可能都需要一个测试环境。这将需要创建和维护多个测试环境。\n\
  \n- 沙箱（sandbox）一词有时用于指测试或开发环境。它是一个或或多个测试人员使用的环境。使用独立的环境提供了双重保护：它保护分配给沙箱的用户不受同事在其他环境中更改的影响；同时也保护同事不受沙箱用户所做更改的影响。只有当更改经过严格测试后，才会迁移到代码库。沙箱测试完成后，该环境可以被丢弃或用新的应用程序覆盖并分配给另一个开发者或测试人员。\n\
  \n关于拥有多个环境的一点建议：不要害怕使用它们来了解应用程序是如何工作的。这是你可以承担风险的地方。如果你想在应用程序中尝试新事物，或者做一些没有充分说明的事情，那么测试环境就是理想的场所。如果你的活动导致应用程序出现问题，只需清空整个服务器并重新加载即可。在这里学习问题比在生产环境中学习要好。\n\
  \n### 7.4.1 每个环境的外观\n\n`DEV`、`QA`、预发布和 `TEST` 环境与生产环境越接近，对变更控制管理过程越有利。如果你的 `PROD`\
  \ 服务器运行的是 Windows Server 2008，而 `QA` 运行的是 Windows 2003，那么在 `QA` 上进行的测试就没有那么有意义。以下对象是需要在两个环境之间尽可能保持相似的示例：\n\
  \n\n\n\n\n- 应用程序软件版本\n- 操作系统版本，包括其上安装的服务包\n- 支持软件，如 `IIS`、`Web Logic Server`、`Apache`、`Oracle\
  \ client`、`ODBC` 等\n- 环境之间的数据应当相似。不需要完全相同，但为了测试目的，每个环境的数据量和多样性应该是相似的。如果 `PROD` 有数百万行数据，而\
  \ `QA` 只有几千行，那么在 `PROD` 上出现的问题可能永远不会在 `QA` 上出现。\n\n关于将生产数据放在非生产服务器上的一点警告是，这存在安全风险。`Non-PROD`\
  \ 环境似乎从不像其对应的生产环境那样安全。如果你的数据包含机密信息，例如个人身份信息 (`PII`)，则应该用虚假数据进行替换。这仍然提供了宝贵的测试机会，但降低了泄密数据的风险。\n\
  \n### 7.4.2 差异是可以接受的\n\n有时，`QA` 和 `PROD` 环境之间的应用程序软件会存在差异。例如，如果供应商发布了新版本，该版本将被安装在\
  \ `QA` 中进行测试。团队完成工作可能需要相当长，在此期间，两个服务器上的应用程序版本将是不同的。\n\n### 7.4.3 谁可以访问服务器？\n\n谁应该能够访问每个服务器或应用程序功能？常识认为，人们应该被赋予工作所需的访问，但除此之外的访问应尽可能受到限制。`SOX`\
  \ 合规性政策对此有很大的话语权，并应该是最终决定。作为一般策略，以下小组应拥有相应的权限：\n\n- 开发人员（Developers）应该拥有 `DEV` 和可能的\
  \ `QA` 的无限访问权限，但绝不能访问 `Staging` 或 `PROD`。\n- 应用程序管理员（Application Administrators）应该拥有所有服务器的无限访问权限，毕竟他们是加载应用程序的人员。\n\
  - 用户（Users）只需要在生产环境中运行应用程序的权限，而不应被赋予对服务器的直接访问权限。\n- 应用程序所有者（Application Owner）可能坚持认为他们需要访问运行应用程序的所有服务器，但应尽可能限制这种访问。作为最终负责运行应用程序的人员，你真的希望有很多人都能登录\
  \ `PROD` 服务器吗？显然，访问 `PROD` 服务器的人越少越好。\n- 测试人员（Testers）需要访问 `QA` 或 `TEST` 环境。\n-\
  \ 新用户（New users）在有资格进入生产环境之前不应拥有访问权限。\n\n### 7.4.4 从组织外部访问环境\n\n如果这是一个基于 Web 的应用程序，哪些环境可以从外部访问，即从组织外部？是否真的有业务需求允许从防火墙外访问\
  \ `DEV`、`QA`、`Staging` 或 `TEST` 环境？如果开发或测试团队需要远程工作，他们应该使用虚拟网络 (`VPN`) 登录网络。如果用户通过\
  \ `VPN` 连接网络，那么就不需要从外部访问网站。\n\n让非生产环境从外部访问的风险是什么？为了理解风险，必须回答：“它们是否拥有生产环境所有的安全保护？”如果你对该问题的回答是“是”，你确定吗？有时在设置非生产环境时，因为人们认为它们不需要像生产环境一样安全。任何包含实时数据的环境都需要严格保护。这就是为什么\
  \ `non-PROD` 环境不应该是实时的。\n\n## 7.5 何时将更改移到生产环境\n\n这似乎是一个奇怪的话题，但行业内的不同人员对于何时将更改移到生产环境有非常强烈的观点。我曾与建议不同时间段的人合作过，他们对为什么自己的时间段是最好的有详尽的理由。这里列出了我听到的建议窗口及其理由：\n\
  \n- 一组人认为更改安装的时间不应该限制。如果你能让用户同意在周一早上 8 点将更改移到生产环境，并且该时间对 `Application Administrator`\
  \ 可行，就在那个时间进行更改。他们的理由是让相关方自行决定。\n- 另一派认为周三和周四是实施更改的唯一日子。他们的理由是更改需要在周末之前运行足够的时间，以便任何潜在问题出现。这个小组希望问题在周末发生，此时可能需要协助解决问题的人在线。他们认为需要在线的人员或角色包括\
  \ `Application Administrator`、应用程序所有者、供应商的支持台、网络管理员、数据库管理员和系统管理员。\n- 最后一组认为进行更改的唯一时间是周五晚上，特别是在大多数用户下班之后。这个窗口的逻辑是大多数用户在正常工作时间内使用应用程序。如果从周五晚上进行了更改并发生了问题，你有整个周末的时间来修复。如果应用程序在周末宕机，对用户群体的影响将是微乎其微的。\n\
  \n一个需要回答的问题是你的供应商支持何时可用。你与供应商的合同是否要求他们每周 7 天每天 24 小时响应你的请求？如果是这样，无论你何时进行更改都可以立即获得协助。另一方面，如果你的支持合同只提供周一至周五早上\
  \ 8 点到下午 5 点的支持，那么在周五晚上发布更改之前你应该深思熟虑。如果你的更改导致了没有供应商支持无法解决的问题，那么你只能等到周一早上等他们的回电话。\n\
  \n## 7.6 将更改移到生产环境\n\n通常，`Application Administrator` 是在生产环境中进行更改的人。根据组织策略的要求，可能会发生例外。许多组织都有限制谁可以将更改移到生产环境的策略。限制是创建更改的人或团队不允许将其迁移到生产环境。引入职责分离可能无法防止所有欺诈，但会降低可能性。如果你的组织仅限于严格应用供应商提供的更改，则此限制不适用。\n\
  \n## 7.7 班斯·奥克斯利法案或 SOX\n\nIT 领域的几乎每个人都听过 2002 年的《班斯·奥克斯利法案》或常说的 `SOX`，但很少有人确切知道它是如何运作的。由于\
  \ `SOX` 对许多应用程序都有影响，因此在这里进行了简要介绍。要全面了解 `SOX` 法案的规定，有许多相关的主题书籍。第 22 章 (`CHP022.html`)\
  \ 将提供关于 `SOX` 以及政府影响应用程序的其他方式的信息。\n\n\n\n\n\nSOX 法案的陈述目的是“通过提高根据证券法所发布的公司披露信息的准确性和可靠性，来保护投资者，并实现其他目的。”其中包含的众多条款包括：\n\
  \n• 更高水平的审计独立性\n• SOX 合规性仅限于上市公司\n• 要求公共公司的高管人员签署审计报告，以证明其准确性\n• 增加对违反证券法行为的民事和刑事处罚\n\
  • 确保财务报告在充分披露的情况下进行\n\nSOX 是如何影响 IT 人员的，特别是应用程序管理员（Application Administrators）？如果你的应用程序包含了组织的财务信息，那么你将受到影响。应用程序管理员可能受到影响的一些方式包括：\n\
  \n• 用户身份验证\n• 职责分离，例如：同一个人不能既修改代码又安装更改\n• 需要维护审计追踪，记录谁在何时修改了什么内容、何时进行了更改等\n• 必须对应用程序的访问权限进行控制和记录\n\
  • 需要监控 IT 人员在标准业务实践之外的活动\n\nSOX 为必须实现的目标提供了一个全局视角，即会计实践的透明度，但将细节留给了各个组织。这在涉及 IT\
  \ 技术如何受到影响时尤为如此。SOX 并没有规定你必须做任何特定的事情。它说的是，一旦你建立了 SOX 流程，你就必须遵守它。\n\n作为应用程序管理员，你并不会为你的组织设计\
  \ SOX 政策。政策已经存在了，遵循它们是你的责任。我能给你的最佳建议是从一开始就习惯这些政策。你可能不喜欢这些政策，它们对你来说可能既耗时又毫无意义，但它们是法律。反抗是徒劳的。\n\
  \n## 7.8 违背变更控制流程\n\n无论你的组织执行了哪种变更控制流程，最终都会有人想让你在不遵守流程的情况下推行更改。他们可能会声称这只是一个微小的变化，绝不可能引起任何问题。他们可能会告诉你这项更改是立即需要的，不能等待正常的变更控制流程。他们可能会对着叠圣经发誓，保证明天就会填好相关文件来涵盖这次更改。\n\
  \n我给你的建议是：不要这样做！如果你这样做了，你就面临着非常真实的风险，你的老板或审计师可能会找你谈谈你的违规行为。听我的吧，你不想成为那种对话的接收者。\n\
  \n你不应该“就此这一次”破例的另一个原因是，这不会只有一次。一旦你开了先例，无论是谁迫使你做的，他们都会推动你做第二次、第三次、第四次，以此类推。你和用户可能不喜欢现有的流程，但你必须遵守它。\n\
  \n## 7.9 异常\n\n规则的制定是为了打破的，变更管理流程也不例外。尽管上一节是所说的，但会有某些必须允许异常的情况。对于允许异常的时间是有限制的。秘诀在于能够识别合法异常与那些懒得不愿遵守既定程序的人员之间的区别。\n\
  \n合法异常的一个例子是：你的生产环境宕机了，并且必须在能力范围内尽快恢复。你可能根据经验知道需要做什么来让它恢复。没有时间联系相关人员获得批准，所以你直接重启系统。\n\
  \n另一个可能的异常例子是：关键流程（例如工资单处理）已终止。如果该流程需要立即重启以便能够准时完成，那么你可能现在就得这样做。一旦系统恢复运行，你就可以通知其他人该问题了。\n\
  \n在异常的基础上对生产环境进行更改并不能免除你为该更改提交工单（ticket）的义务。你仍然需要启动变更管理流程。你可能在当时无法获得所有的权限，但通过启动流程，你已经记录了正在进行更改。此外，一个不完整的变更工单将不断提醒你完成该更改的文件工作。\n\
  \n## 7.10 测试\n\n任何进入生产环境的更改都需要经过彻底的测试。需要进行的测试强度与所更改的内容密切相关。一个仅限于应用程序子集的较小更改，不需要像一个发生了大规模性改变的应用程序软件主要新版本那样进行大量的测试。遗憾的是，并不总是容易准确确定到底需要多少测试。我可以提供的一条建议是：测试过多总比测试不足好。\n\
  \n测试可以分为两种不同的类型：验收测试（acceptance）和回归测试（regression）。虽然它们都测试应用程序，但它们是显著不同的测试形式，在开发和执行上需要不同的方法。\n\
  \n### 7.10.1 验收测试\n\n验收测试的目的是确认正在测试的修改符合其预期目标。在某种程度上，验收测试更容易，因为你可以直接关注应用程序中发生变化的区域。当供应商发布补丁或升级时，会附带文档，通常称为“发布说明”（Release\
  \ Notes），描述了哪些内容。针对此升级的验收测试需要基于供应商所说的更改内容。如果发布说明说邮政编码输入界面、库存报告以及计算预扣税的程序都经过了修改，那么你的验收测试脚本就需要关注应用的这些特定区域。\n\
  \n测试脚本需要列出测试人员为验证错误已修复而必须执行的步骤。它需要提供足够的细节，以便测试人员能够准确执行测试。脚本还需要列出用户预期看到的结果。如果在测试期间没有显示预期结果，那么该特定的测试步骤以及整个测试过程都失败了。\n\
  \n`图 7.1`所示所示表格是测试脚本的一个极其简单的示例。实际的测试脚本可能有更多的步骤。\n\n![image](img/F000078f07-01-9780123985453.jpg)\n\
  \n图 7.1 测试脚本简单示例。\n\n### 7.10.2 回归测试\n\n回归测试的目的是确认更改没有破坏应用程序的现有功能。回归测试比验收测试更困难，因为它可能要求进行更多的测试。应用程序中除本次版本受影响的内容外的所有内容都可以包含在回归测试中。\n\
  \n完全测试即使是中等规模的应用程序是不可能的。这是因为随着应用程序变得越来越复杂，使用方式的组合数量呈几何级数增长。为了彻底测试一个应用程序，需要以下步骤：\n\
  \n• 每个屏幕都必须测试\n• 每个屏幕上的每个链接都必须测试\n• 每个屏幕上的每个按钮都必须测试\n• 每个屏幕上的每个菜单项和子菜单项都必须测试测试\n\
  • 每个屏幕上的每个文本框都必须使用所有可能的输入组合进行测试，包括有效和无效数据\n• 每个屏幕上的每个下拉列表及其其中的每个选项都必须测试\n• 测试数据库必须包含每张表中所有可能的数据组合\n\
  \n\n\n\n\n- 每一个可能的导航序列都必须经过测试。例如，你必须测试从屏幕 `A` 到 `B`、`A` 到 `C`、`A` 到 `D`、…… `B` 到\
  \ `C`、`B` 到 `D`、`B` 到 `E`、`Z` 到 `A`、`Z` 到 `B` 等。\n\n现在，针对以下情况重复上述每个测试场景：\n\n- 应用程序获得认证运行的每一个桌面操作系统\n\
  - 应用程序获得认证运行的每一个服务器操作系统\n- 应用程序获得认证运行的每一个数据库\n- 应用程序获得认证运行的每一个浏览器\n\n如果上述操作都由一名测试人员完成，仍然无法发现多个用户同时使用系统时可能相互交互或干扰的情况。为了测试这种可能性，你必须针对以下情况重复上述所有步骤：\n\
  \n- 应用程序中同时有两个用户\n- 同时有 3、4、5、…… 直到系统使用的最大用户数\n\n如你所见，对应用程序进行完全的回归覆盖是不可能的。你所能希望的是覆盖应用程序中最常用的功能。如果你的回归测试彻底覆盖了应用程序中使用频率最高的屏幕和操作，那么你的工作已经比大多数站点做得好了。\n\
  \n从另一个角度来说，回归测试可能比验收测试更容易。这是因为一旦你开发了详尽的回归测试脚本，就可以反复多次使用。假设你为应用程序的 `5.1` 版本开发了一个全面的回归测试脚本。当应用程序的\
  \ `5.2` 版本发布时，你的回归测试脚本就可以重复使用。随着新功能添加到应用程序，回归测试需要扩展以反映这些变化，但测试脚本的大部分不受影响。\n\n###\
  \ 7.10.3 谁应该编写测试脚本？\n\nBarry Manilow 可能写下了让全世界为歌唱的歌曲，但用户社区需要编写测试脚本。这里使用复数形式是因为测试可能被拆分为两个脚本：`UAT`\
  \ 和 `Regression`。其原因非常简单：\n\n- 他们比任何人都更熟悉应用程序。\n- 如果他们编写的测试脚本不充分，他们除了自己无人可怪。\n\n\
  上述规则的唯一例外是，应用程序管理员需要为只有他或她访问的工具或实用程序编写测试。要求用户为他们从未见过的应用程序部分开发测试是没有意义的。\n\n### 7.10.4\
  \ 在哪里进行测试？\n\n测试需要在应用更新的每一个环境中进行。这包括在移动到 `Production` 之前的 `DEV`、`QA`、`TEST` 或 `Staging`\
  \ 服务器。测试序列的自然演进应该是首先是 `DEV`，其次是 `TEST` 或 `QA`，如果存在，然后是 `Staging`。`PROD` 最后测试。这一顺序背的原因是在安装到生产环境之前，尽可能彻底地测试这些更改。\n\
  \n每个测试步骤的结果在每个环境中应该是相同的。可能存在特殊情况来解释为什么在不同环境中结果存在差异。可能解释差异的某些示例包括：\n\n- 每个环境中的数据库是不同的。在进行搜索、显示列表或创建报告时，不同的数据库会导致不同的结果集。这是一种非常可能的情况，因为像\
  \ `DEV` 这样的非生产环境的数据库通常比 `QA` 或 `PROD` 小得多。\n- 性能可能会显著不同，因为大多数 `DEV` 环境可用资源较少。例如，`DEV`\
  \ 会拥有性能较弱的服务器、较小的内存等。\n- `DEV` 环境可能不具备你 `PROD` 环境中的所有组件。例如，`DEV` 可能没有激活报告。它可能没有工作流。如果是这样，那么针对应用程序这些区域的特定测试步骤无法在该环境中测试。\n\
  \n### 7.10.5 谁应该执行测试？\n\n谁应该执行用户验收测试和回归测试？在这种情况下，名称已经说明了一切，即用户测试应该由用户完成。这有许多原因：\n\
  \n- 他们最熟悉如何使用应用程序\n- 用户社区规模大于应用程序管理员人数，因此他们可以将工作负载分散到更多人之间\n- 既然用户社区编写了测试脚本，他们对脚本最熟悉\n\
  - 如果测试执行得不正确，用户只能怪他们自己\n\n逻辑上的例外是，应用程序管理员需要运行只有他们才能访问的工具和实用程序的测试。应用程序的这些部分通常运行在应用程序服务器上，用户通常不被允许访问。\n\
  \n### 7.10.6 测试文档\n\n需要保留在不同环境中进行的测试记录。对于每次不同的升级都需要保留一套完整的文档。需要填写和保留的示例包括：\n\n-\
  \ 测试日期\n- 谁执行了测试\n- 在哪个环境中进行的测试，即 `DEV`、`QA`、`PROD`\n- 表明这是该环境的初始测试还是重复测试\n- 包含所有测试步骤的电子表格或文档\n\
  - 每个单独测试步骤的结果\n- 用户代表对测试圆满完成的批准\n\n这可能很明显也可能不明显，但如果任何单独测试步骤失败，整个测试脚本都必须重复。重新运行升级或更改环境会使之前的任何测试失效。\n\
  \n## 7.11 版本号\n\n跟踪每个服务器上运行的应用程序版本非常重要。每当你向供应商支持热线提交工单时，都需要它。似乎供应商询问的两个问题总是运行的是什么版本的应用程序以及运行在什么操作系统。如果你的记忆力不足以跟踪这些，你就需要记录在某个地方。当然，这意味着现在你要记住把它写在哪里。\n\
  \n如果每个应用程序查找版本的方法都是相同的，那就太好了。遗憾事实如此。这里列出了一些最常见的方法。我确定还没有遇到过很多方法。\n\n- 确定应用程序版本的常见位置之一是点击“帮助”菜单项，然后点击“关于”子菜单项。图\
  \ 7.2 显示了这种菜单选择。显示的“关于”界面如图 7.3 所示。\n\n![image](img/F000078f07-02-9780123985453.jpg)\n\
  \n图 7.2 用于弹出“关于”界面的典型帮助 | 关于 菜单项\n\n![image](img/F000078f07-03-9780123985453.jpg)\n\
  \n图 7.3 显示的关于界面\n\n- 对于某些应用程序，如果点击其图标将显示等同于“关于”的界面。图 7.4 描述了要点击的图标，图 7.5 显示了将显示的“关于”界面。\n\
  \n![image](img/F000078f07-04-9780123985453.jpg)\n\n图 7.4 点击可弹出“关于”界面的图标\n\n![image](img/F000078f07-05-9780123985453.jpg)\n\
  \n图 7.5 显示的关于界面\n\n\n\n\n\n-   某些应用程序将版本信息存储在配置文件中。图 7.6 所示的 `registry.xml` 文件是某个应用程序的配置文件，可以通过引用它来确定应用程序的当前版本。\n\
  \n![image](img/F000078f07-06-9780123985453.jpg)\n\n图 7.6 包含版本详情的配置文件。\n\n-   其他应用程序在每次启动时，都会将构建信息写入日志文件。图\
  \ 7.7 所示的日志文件显示其所在的服务器上运行的是 3.5 Update 5（生成版本 2252.10）版本。\n\n![image](img/F000078f07-07-9780123985453.jpg)\n\
  \n图 7.7 从日志文件中可以获取的版本详情。\n\n# 第 8 章 安装软件\n\n## 摘要\n\n每个应用程序都有安装过程。通过阅读文档和在供应商提供的工作表中收集所需信息，为安装做好准备。制定一个项目计划。在你的\
  \ `DEV` 或 `TEST` 环境中练习安装，以确保过程在 `Production` 环境中无故障运行。一如既往，记录你所做的一切，以便可以重复。安装可能会影响多个服务器：应用程序服务器、报告服务器和集群服务器。安装完成后，检查是否有更新。\n\
  \n### 关键词\n\n安装软件；安装；项目计划；轻客户端；胖客户端；集群的；负载均衡的；准备安装；服务包；端口；文档记录；环境变量；安装程序；更新\n\n\
  每个应用程序都有安装过程。如果你运气好，安装软件的过程将是简单、合逻辑且文档齐全的。如果你不那么幸运，过程将变得复杂、文档不全，并且频繁失败。最坏的情况需要你后退一或两步，可能一直回到第一步，然后重新尝试。就像许多其他活动一样，熟能生巧。在你的\
  \ `DEV` 或 `TEST` 环境中练习安装，以确保过程在 `Production` 环境中无故障运行。一如既往，记录你所做的一切，以便可以重复。\n\n\
  每个应用程序的安装过程都会略有不同。许多软件供应商使用商业化安装产品。如果你安装过使用相同安装包的其他应用程序，那么这些步骤对你来说可能是熟悉的。这类产品的一些示例包括：\n\
  \n-   InstallAnywhere\n-   InstallBuilder\n-   JExpress\n-   InstallShield\n-  \
  \ Windows Installer\n-   Wise InstallBuilder。\n\n安装设计可以使得该过程能够多次运行。每次全新的安装都会覆盖上一次所做的更改。这不是你能够控制的，但如果你知道你特定的应用程序安装过程是这样设置的，那也是件好事。如果你知道如果安装没有正常运行，你可以直接从头开始，这会减轻你的很多压力。如果安装文档没有说明这一细节，请将其加入到你的问题列表中，并向你的供应商联系人或其技术支持台提问。\n\
  \n我感到有必要提供的一点警告是，在处理“服务器（server）”一词时，你需要极其小心。在某些情况下，这个词指的是一个计算机硬件，例如安装在你的数据中心的一个四处理器服务器。在其他情况下，这个词指的是运行在计算机上的某段软件，例如运行在计算机上允许用户查看页面的\
  \ Web 服务器。如果该词使用的上下文对你来说并不清晰，那么你需要要求解释。不要害羞这样做，因为如果你感到困惑，那么几乎可以肯定其他人也一样。\n\n## 8.1\
  \ 成为那个拥有（项目）计划的人或女性\n\n这看起来可能有些多此一举，但为应用程序安装创建一个项目计划非常有意义。仅仅是通过将过程写写的过程，就能确保你的计划工作做得更好。制定项目计划的其他几个良好理由是：\n\
  \n-   帮助确保你不会遗漏任何准备步骤\n-   帮助以最高效率顺序对步骤排序\n-   可以帮助识别你从组织内其他团队需要的资源，例如数据库管理员（DBAs）、系统管理员、网络安全团队等。\n\
  -   提供机会来识别在开始安装之前需要就位的硬件、软件、安全措施等。\n-   帮助记录执行安装所需的时间。这将使你对未来的类似任务做出更好的估算。\n\n\
  你的项目计划不需要极其详尽、复杂或难以理解。从理论上讲，它可以写成文本文件、电子表格或 Word 文档。如果你可以使用项目计划软件（如 `Microsoft Project`），那么它会让计划过程变得更简单、快速且更有价值。\n\
  \n图 8.1 所示是一个项目计划的示例。该计划并不复杂，但包含了每个计划任务的基本数据。这些：\n\n-   任务名称或描述\n-   预估持续时间\n- \
  \  预计开始日期\n-   预计完成日期\n-   在此任务开始之前需要完成的任务\n-   任务状态或完成百分比\n-   任务分配给谁\n\n![image](img/F00008Xf08-01-9780123985453.jpg)\n\
  \n图 8.1 安装项目计划示例。\n\n## 8.2 需要进行多少次安装？\n\n这看起来像是个愚蠢的问题，但对于特定的应用程序，需要进行多少次安装？而易见的答案“一次”并不一定正确。设置应用程序的环境可能需要多次、独立的安装。接下来的章节描述了至少三种多次安装的情况。显然还有其他情况，但那些较少见。\n\
  \n### 8.2.1 用户工作站上的安装\n\n应用程序大致分为两类：轻客户端（thin clients）和胖客户端（thick clients）。轻与胖的区别在于用户或客户端工作站上需要加载多少软件。轻客户端在客户端机器上很少或不需要软件。胖客户端设计在客户端机器上需要大量的软件。\n\
  \n轻客户端设计通常使用 Internet 浏览器作为前端。这种设计模式的应用程序不需要在用户的工作站上安装任何软件。一旦你设置好了应用程序服务器，任何数量的用户都可以直接指向服务器并开始使用应用程序，前提是他们拥有\
  \ ID 和密码。由于这种原因，这种模型是一种日益流行的交付方式。\n\n如果应用程序具有胖客户端，那么某些（通常是大量的）需要安装到每个用户的工作站上。在工作站上安装软件的过程可能是你的职责，也可能是他人的职责范围。\n\
  \n如果你没有幸运拥有处理桌面安装的团队，那么你不需要做这项工作，但仍需要将此任务纳入项目计划。请确保为设置一个工作站增加保守的时间估算，并将其乘以使用该应用程序的用户总数。\n\
  \n\n\n\n\n在某些情况下，这些安装是用户可以自行完成的。这可能简单到点击所需软件的可执行文件即可完成安装。如果你的用户工作站是这样设置的，那么请确保执行以下操作：\n\
  \n- 进行测试，以确认安装过程与 `Installation Guide` 中的描述一致\n- 编写一份简短的、非技术性的文档并分发给用户\n- 让一个非 IT\
  \ 人员根据该文档在其工作站上安装软件，以验证文档对于普通用户来说是既准确又易于理解的\n\n如果你的非 IT 测试人员成功完成了安装，那么请将文档和可执行文件（或其位置）发布给所有在桌面上需要该软件的人。下面列出了一些需要考虑的潜在情况。这些情况极有可能会发生，因此你需要提前准备好对：\n\
  \n- 如果安装成功，用户将收到什么消息？\n- 如果安装未成功，用户将收到什么消息？\n- 如果安装失败，用户应该联系谁？\n- 如果安装失败，用户应该怎么做？例如，是应该卸载应用程序还是只等待帮助到达？\n\
  - 对于远程地点的用户，安装过程会有何不同？\n- 对于不在组织局域网（LAN）或广域网（WAN）中的用户，安装过程会有何不同？\n\n## 8.2.2 应用程序架构可以包含多个类型的服务器\n\
  \n某些应用程序设计在其环境中包含多种类型的服务器。每个服务器都为用户或其他服务器提供独特的功能。例如，一个应用程序环境可能包含以下类型的服务器：\n\n- 支持用户界面的服务器，例如\
  \ Web 服务器\n- 支持报告的服务器\n- 支持数据库的服务器\n- 支持业务逻辑的服务器\n\n图 8.2 显示了一个包含三种不同类型服务器的环境图。这些服务器分别是\
  \ Web 服务器、报告服务器和数据库服务器。这样的环境非常常见。\n\n![image](img/F00008Xf08-02-9780123985453.jpg)\n\
  \n图 8.2 具有多种类型服务器的应用程序图。\n\n我支持过的一个应用程序拥有两种类型的服务器。第一种支持用户界面 (UI)。第二种支持应用程序生成的报告。供应商建议将这些不同的软件组件安装在独立的硬件设备上，尽管对于用户量较少的环境，这两个组件都可以安装在单一硬件服务器上。\n\
  \n我支持的另一个应用程序也有两种类型的服务器。第一种是 Web 服务器，允许“普通”用户通过运行在桌面计算机上的 浏览器访问应用程序。第二种类型的服务器仅限少数的“高级”用户访问。这些用户将远程连接到第二台服务器。一旦连接到服务器，他们就会在该服务器的桌面上运行该应用程序的管理版本。\n\
  \n上述两个应用程序实际上都存在第三种类型的服务器，即数据库服务器。在安装应用程序软件之前，它必须处于运行且正常状态。在我们组织中，设置数据库服务器的责任属于\
  \ `DBA` 团队，因此那不需要我处理。我的责任仅限于与 `DBAs` 协作，确保数据库被正确创建并可供应用程序和报告服务器访问。\n\n你所支持的应用程序是否有超过一种类型的服务器？存在多少类型？它们是如何相互作用的？哪些是依赖于其他的？如果你不知道这些问题的答案，那么是时候再次复阅\
  \ `Installation` 或 `Administrators` 手册了。\n\n每个服务器的安装几乎肯定会是一个独立的过程。它们可能在某些方面相似，但本质上是独立的安装过程。当你编写项目计划并估算安装所需的时间时，请务必包含所有安装过程的时间。\n\
  \n## 8.2.3 集群或负载均衡环境\n\n应用程序架构包含集群或负载均衡是为了实现两个特定目的：\n\n- 通过提供多个可用服务器来最大化应用程序的可用性。如果其中一台服务器挂起或故障，其他服务器可以继续处理，应用程序对用户来说保持可用。\n\
  - 通过在多个服务器之间分配负载来增加处理吞吐量。负载在服务器之间分配的方式可以是简单的，也可以是复杂的。最基本的方法称为 `round-robin`（轮询）。在这种情况下，第一个用户请求分配给\
  \ 1 号服务器。第二个请求分配给 2 号服务器，以此此类推。更复杂的算法会考虑每个请求的复杂性。在这种安排下，一台服务器可能正在处理单个复杂请求，而另一台服务器正在处理多个简单请求。\n\
  \n图 8.3 显示了一个包含集群服务器的环境。这个示例展示了一个由三台服务器组成的应用程序集群，以及由两台服务器组成的报告功能集群。组成集群的硬件服务器数量可以不同，但原理是相同的：使用多个服务器来增强可用性或性能。\n\
  \n![image](img/F00008Xf08-03-9780123985453.jpg)\n\n图 8.3 具有集群服务器的环境图。\n\n如果你的应用程序采用了集群或负载均衡，那么你需要确切了解你从中获得了哪些好处。目标可能是增强系统可用性，也可能是增强吞吐量。根据应用程序的设计，可能可以或无法同时获得这两种好处。阅读手册或咨询供应商，以确保你理解架构提供了什么，更重要的是它没有提供什么。\n\
  \n如果你的环境采用了集群或负载均衡，那么安装过程可能比单服务器环境复杂得多。你几乎必须在每台服务器上单独安装软件。服务器的构建可能有一个特定的顺序。如果存在“主”服务器，它可能需要最先构建。“从”服务器可能在主服务器完全运行后后再在其上面安装软件。确保你了解流程，并将所有步骤和顺序包含在项目计划中。\n\
  \n## 8.3 安装准备工作\n\n在我看来，成功安装的最重要的步骤并不困难。这些是你本就应该做的事情。它们列在这里。如果你做了这些事情，你的成功概率就会尽可能高：\n\
  \n1. 阅读 `Installation Guide`。再读一遍会更好。\n2. 写下你所有的问题，并联系供应商技术人员获取答案\n3. 填写指南中包含的任何工作表并在安装时备用\n\
  4. 尽可能在 `Test` 或 `Development` 服务器上进行练习\n\n### 8.3.1 阅读安装指南\n\n我无法强调阅读从供应商处收到的安装包时附带的\
  \ `Installation Guide` 和 `Release Notes` 是多么重要。尽早阅读这些文档！此外，确保不要匆忙读完文档。要仔细阅读。阅读和吸收这些信息需要时间，所以不要等到计划安装的前一天才开始。\n\
  \n\n\n\n\n阅读这些文档时，请记录下你的问题、疑虑以及任何你不清楚的地方。不要害怕列出一份长长的问题清单。不要将其看作是软弱的表现，而是说明你对工作非常严谨。如果你在阅读文档时不理解某些内容，那么在实际安装过程中你肯定也不会理解。\n\
  \n当你读完`Installation Guide`（安装指南）后，请再读一遍。根据我的经验，第二遍阅读比第一遍更有价值。在第二次阅读期间，你应该频繁查阅你的问题列表。你可能会增加一些问题，但更有可能的情况是，你会发现现在已经知道了许多原始问题的答案，可以将它们从列表中删除了。\n\
  \n将你的列表发送给供应商支持团队以获得问题的解答。在发送给他们之前，请检查你的问题，确保它们写得尽可能清晰。你不会希望花费大量时间来回多次地向他们解释你的问题。我建议你尽早将此列表交给你的供应商联系人。在计划安装日期的前一天给他们一份长长的问题列表，不会给他们留下足够的时间来回复。这让你没有时间对他们的回答或他们对你提出的任何问题做出反应。\n\
  \n你可能计划让供应商技术人员与你一起进行安装。这在许多情况下是完全合适的，但不要认为这样就可以省去阅读`Installation Guide`。即使有供应商技术人员配合你完成安装，你仍然需要阅读`Installation\
  \ Guide`。相信我，技术人员想尽快完成安装。在完成你的工作后，他们几乎肯定立刻为另一个客户安排了安装任务。他们会回答你的问题，但你在此过程中没有时间详细学习一切。在这个过程开始之前了解得越多，你对安装的了解就越多。\n\
  \n### 8.3.2 安装指南中的工作表\n\n`Installation Guides`通常会包含一份安装过程中所需的信息表格。如果`Installation\
  \ Guide`中没有此类表格，请向供应商技术人员索要。此举目的是让你有机会提前收集所需信息并将其记录在一个地方。\n\n我再如何强调详尽且准确地完成这张表格都不为过。如果你不提前收集这些信息，你将在安装过程中手忙脚乱地寻找。安装本身已经足够复杂了，如果因为没有供应商技术人员或安装程序所需的问题答案，只会让安装变得更加困难。\n\
  \n你可能被要求收集的数据类型示例包括：\n\n- 应用服务器的名称，即硬件设备\n- 服务器上运行的操作系统版本\n- 服务器的内存容量\n- 安装过程中是否可以禁用服务器上的任何病毒扫描软件\n\
  - 是否将使用`SSL`（安全套接层）以及你是否拥有所需的安全证书\n- 将将使用的身份验证形式。常见选择有应用程序原生认证、`LDAP/AD`（轻量级目录协议/活动目录）或`SSO`（单点登录）\n\
  - 服务器名称，即软件而非硬件\n- 软件应加载的位置，例如`C:\\AcmeApplication`\n- 加载应用程序的驱动器上剩余可用空间\n- 用户与应用程序通信使用的端口\n\
  - 管理员账户的账户名和密码\n- 数据库客户端软件的位置，例如`C:\\oracle\\product\\11.2`\n- 数据库服务器名称\n- 用于与数据库服务器通信的端口\n\
  - 数据库名称\n- 拥有数据库的账户名称和密码\n- 如果应用程序将发送电子邮件，则你组织的电子邮件服务器名称\n- 用于与电子邮件服务器通信的端口号\n\n\
  你被提示的许多选项或设置都有其提供的默认值。除非你的组织对此有标准，否则我建议尽可能多地采用默认值。这将使供应商技术人员与你及你的系统工作起来更加容易。如果你在安装完成后忘记记录这些信息，这也有利于找回这些信息。\n\
  \n上述建议中唯一明显的例外是账户密码，特别是管理员账户。在这些情况下，你可能想在初始使用默认密码，但在应用程序运行后立即更改它们。不要忘记更改它们！如果你不更改管理员账户密码，那么世界上每一个对接触过或安装过此应用程序的人都知道你的密码是什么。这不是你的老板或应用程序用户所预期的安全性。\n\
  \n### 8.3.3 为安装编写项目计划\n\n为你的安装编写项目计划肯定会是一个迭代过程。你的第一次尝试极不可能是 100%准确的。可能会犯的一些常见错误包括：\n\
  \n- 任务被忽略\n- 时间估算偏差很大\n- 任务顺序错误\n- 任务之间的依赖关系无法反映实际情况\n- 将错误的人分配到某项任务\n\n一旦第一版本的计划完成，请仔细检查其是否有错误。让一位经验丰富的项目经理审阅一下是个好主意。如果你的小组中还有其他应用程序管理员，请让他或她也看一下。\n\
  \n一旦你认为准备就绪，就将其发送给所有相关人员，要求他们以敏锐的眼光进行评审。与参与者安排一次简短的会议并无害。有时 30 分钟的会议就能解决通过往来邮件几天才能澄清的误解。\n\
  \n### 8.3.4 确认服务器是否存在并已正常启动\n\n如果用于此应用程序的服务器是全新的，你一定要确认它们是否存在并已正常启动。如果你的组织要求在请求构建新服务器时填写表格，请尽早、准确地填写。如果你不告诉他们你想要什么，数据中心团队无法按照你的意愿构建服务器。你需要在服务器请求表上指定的某些值可能包括：\n\
  \n- 申请人姓名\n- 需要回答技术问题时的联系人\n- 业务部门\n- 请求日期\n- 服务器需要可用的日期\n- 给服务器的名称\n- 加载到服务器的应用程序名称\n\
  - 要加载的操作系统版本\n- 操作系统的服务包\n- 需要的处理器数量和核心数\n- 需要的网卡（NICs）数量及规格\n- 内存容量\n- 硬盘数量及每个的大小\n\
  - 服务器是否具有`SAN`（存储区域网络）驱动器空间，如果是，需要多少\n- 需要加载到服务器上的支持软件，例如`IIS`（互联网信息服务）、`Apache\
  \ Tomcat`、监控软件、防病毒软件等\n- 服务器将位于`DMZ`（非军事化区）还是内部网络\n- 此应用程序在何处需要负载均衡或集群服务器\n- 是否需要在服务器上创建任何服务账户，如果是，ID\
  \ 和密码应该是什么\n\n\n\n\n\n-   谁应该被包含为服务器的本地管理员\n-   如果存在可以作为新服务器模板的现有服务器，那么提到它将非常有帮助\n\
  \n当相关小组完成服务器构建后，他们应该向你回复并提供有关服务器的额外信息。例如：\n\n-   服务器设置是否按要求完成\n-   服务器的 `IP`（互联网协议）地址\n\
  -   服务器的 FQDN（完全限定域名）\n\n### 8.3.5 验证你是否可以远程访问所有服务器\n\n一旦收到服务器已设置好的通知，你将想要对其进行验证。这可以通过成功远程连接到相关服务器来实现。经常用于远程连接到另一台计算机的\
  \ Windows 工具是 `RDC`（远程桌面连接）。图 8.4 显示了 `RDC` 的输入界面。使用 `RDC` 远程连接到新服务器，以验证它是否存在以及你是否能够访问它。\n\
  \n![image](img/F00008Xf08-04-9780123985453.jpg)\n\n图 8.4 `RDC` 连接的截图。\n\n### 8.3.6\
  \ 确认操作系统已加载\n\n如果你能够远程连接到相关服务器，那么操作系统已正确加载到服务器上。你现在唯一的任务是确认加载到服务器上是正确的操作系统。你可以通过以下方式识别计算机上运行的\
  \ Windows 操作系统版本。打开命令行窗口并输入命令\n\n```\nsysteminfo\n```\n\n输出包含大量关于这台计算机的丰富信息，包括加载到其上的操作系统版本。图\
  \ 8.5 显示了其中一些细节的截图。如果你在自己的工作站或计算机上运行此命令，可以向下滚动查看其他信息，包括所有 `HotFixes` 列表和 `NIC` 详情。\n\
  \n![image](img/F00008Xf08-05-9780123985453.jpg)\n\n图 8.5 `systeminfo` 的截图。\n\n####\
  \ 8.3.6.1 服务包\n\n操作系统厂商定期发布一组更新、修复和增强功能，这些内容通常被成称为服务包（Service Pack）。例如，某个操作系统可能提供可安装的\
  \ `SP1` 或 `SP2`。应用安装指南可能会指定在应用程序服务器上安装特定的服务包。请确保你服务器上的操作系统已安装正确的服务包。`systeminfo`\
  \ 命令列出了计算机上当前安装的服务包。\n\n### 8.3.7 确保所有所需的支持软件都已加载\n\n几乎每个软件应用程序都需要某些支持软件加载到服务器上。根据组织的不同，应用程序管理员可能需要加载这些软件，或者会有另一个小组来处理。所需软件列表可能很短，但请确保没有它们你的应用程序无法运行。以下是应用程序可能需要的软件类型示例：\n\
  \n-   `IIS`—互联网信息服务\n-   `Apache Tomcat`\n-   `JRE`—Java 运行时\n-   `JDK`—Java 开发包\n\
  -   `Oracle WebLogic Server`\n-   `IBM WebSphere`\n-   数据库用户客户端\n-   文字处理软件\n- \
  \  如 `WinZip` 之类的压缩工具\n-   `FTP` 软件\n-   处理 PDF（便携式格式）文档的软件\n-   `BizTalk`\n-  \
  \ `Tuxedo`\n-   `SharePoint`\n-   `.NET Framework`\n-   `Windows SDK`—软件开发包\n- \
  \  `DLLs`\n-   安全证书\n-   如 `Symantec` 或 `Norton` 的病毒防护软件\n\n遗憾的是，应用程序安装指南可能没有为你提供安装这些支持软件所需的信息。如果这些细节没有包含在厂商的文档列表中，那么最好的来源就是在互联网上搜索。你也可以联系厂商的支持台并询问他们这些信息。\n\
  \n### 8.3.8 数据库\n\n你正在安装的应用程序可能需要使用数据库，通常是关系型数据库引擎，如 `Oracle` 或 `Microsoft SQL Server`。如果是如此，你必须在开始应用程序安装过程之前确保该组件已设置完毕。你需要关注的具体事项包括：\n\
  \n-   数据库服务器必须存在并运行\n-   数据库引擎软件已安装在数据库服务器上\n-   数据库引擎软件处于正确的补丁级别\n-   应用程序服务器能够与数据库服务器通信\n\
  -   数据库服务器上已创建厂商指定的账户\n-   数据库服务器上已创建厂商指定的数据库\n\n如果你的组织有一个 `DBA` 团队，那么他们将处理这些大部分任务。你的工作是向他们传达安装指南中指定的。。务必尽早联系\
  \ `DBA` 团队。你不想在计划开始安装的当天早上才要求他们创建一个数据库。\n\n在安装过程中，你可能需要 `DBA` 团队的进一步参与。安装过程可能需要在\
  \ `SYSTEM` 账户下创建数据库对象，例如表或表空间。下面列出了两种常用的方法。这两种方法我都尝试过，并且同样方便。请与你的 `DBA` 团队讨论。\n\n\
  ### 8.3.9 端口\n\n应用程序需要哪些防火墙端口才能正常通信？安装指南将提供这些细节。你的应用程序可能需要的端口示例包括：\n\n-   应用程序服务器与数据库服务器之间的端口\n\
  -   如果应用程序包含多个服务器，则它们之间的端口可能需要开放\n-   如果用户通过浏览器浏览器与应用程序交互，则需要开放端口 `80`\n-   如果应用程序生成电子邮件，则应用程序服务器与邮件服务器之间的端口需要开放\n\
  -   如果环境包括负载均衡器或集群，则它们可能需要开放特定的端口\n\n如果你的组织有一个处理防火墙的团队，那么你需要与他们合作以开放必要的端口。端口可以作为入站、出站或两者兼具有开放。在提交请求之前，请确保你知道它应该是哪种。一如既往，不要等到最后一刻才提出此请求。\n\
  \n#### 8.3.9.1 识别已用端口的工具\n\n在 Windows 环境中，有几种工具可以识别哪些端口是开放的。用于验证端口是否开放的工具是 `telnet`。在应用程序服务器上打开命令行窗口并在其中\
  \ `telnet` 命令。命令格式为：\n\n```\ntelnet ComputerName port#\n```\n\n如果 `telnet` 连接成功（即目标计算机端口开放），则整个命令行窗口将变为空。图\
  \ 8.6 显示了成功的 `telnet` 命令窗口。如果目标计算机端口未开放，则 `telnet` 命令将失败。图 8.7 显示了失败的 `telnet` 命令。\n\
  \n![image](img/F00008Xf08-06-9780123985453.jpg)\n\n图 8.6 开启端口的 `telnet` 截图。\n\n\
  ![image](img/F00008Xf08-07-9780123985453.jpg)\n\n图 8.7 端口未开启的 `telnet` 截图。\n\n\n\
  \n\n\n另一个显示开放端口的 Windows 命令是 `netstat`。图 8.8 显示了该命令及其输出。在应用服务器上运行 `netstat` 命令会返回大量输出，因此对输出进行过滤以只保留你感兴趣的端口是非常方便的。可以使用管道操作和\
  \ `findstr` 命令来执行此过滤。带有此过滤的 `netstat` 命令示例如下：\n\n![image](img/F00008Xf08-08-9780123985453.jpg)\n\
  \n图 8.8 显示开放端口的 `netstat` 命令截图。\n\n```\nnetstat –aon | findstr 1521\n```\n\n`netstat`\
  \ 命令的输出被传递到 `findstr` 命令中以搜索字符串“1521”。包含该字符串的输出行都将显示出来。在本例中，端口 1521 在 IP 地址 14.11.39.48\
  \ 和 14.11.39.52 之间是的。\n\n### 8.3.9.2 记录所有正在使用的端口\n\n你需要一个应用程序所使用的端口的准确列表。这些信息应该在《安装指南》中。遗憾的是，它可能被埋没在该文档中。如果可以使用手册的在线版本，你可能会搜索“port（端口）”。\n\
  \n《安装指南》或安装程序可能会列出每个所需端口的默认数量值。我的建议是尽可能使用默认值。如果你的组织有自己的标准，那么你需要遵循这些标准，否则请坚持默认值。这样做将使安装变得更容易，长期的维护也会变得更简单。\n\
  \n为什么这很重要？你需要跟踪应用程序将要使用的端口，有两个极其重要的原因：\n\n- 同一时间只有一个应用程序可以使用某个端口。如果两个应用程序尝试使用同一个端口，那么它们都将无法成功。你可以使用以下命令来识别已使用端口的应用程序的\
  \ `PID`（进程 ID），其中 `port#` 是你正在调查的端口号：\n\n```\nnetstat –aon | findstr port#\n```\n\
  \n- 防火墙端口必须开放才能使用。网络安全团队需要确保防火墙中的端口是开放的。如果端口未开放，应用程序将无法工作。在请求开放端口时，务必指定流量是入站、出站还是两者兼有。\n\
  \n### 8.3.10 环境变量\n\n环境变量是操作系统用于记录系统环境详细信息的对象。根据操作系统的不同，环境变量变量集可以分为两个子组。系统变量对计算机上的任何用户或进程可用。用户变量仅对创建它们的用户可用。\n\
  \n保存环境变量的字符串可以被操作系统或应用程序使用。如果软件需要加载到用户工作站上，那么在这些机器上可能也需要设置环境变量。\n\n应用程序的安装过程通常会引导你创建一个或多个环境变量。应用程序需要定义的某些常见值类型包括：\n\
  \n- 应用程序源代码及其他文件的位置\n- 数据库客户端软件的位置\n- 标识将使用哪种数据库字符集的值\n- JRE（Java 运行环境）的位置\n- 应用程序临时子目录的位置\n\
  - 应用程序日志子目录的位置\n- 应用程序输出子目录的位置\n- 库的位置\n\n#### 8.3.10.1 两种环境变量\n\n环境变量有两种：\n\n-\
  \ 仅影响创建它的用户的用户变量或局部变量\n- 影响系统上所有用户和进程的系统变量\n\n根据你希望变量持续多长时间以及你希望其影响范围有多广，你需要创建相应的环境变量。\n\
  \n#### 8.3.10.2 每个操作系统都不相同\n\n每个操作系统都有一种定义环境变量的方法。遗憾的是，这种方法在不同的操作系统之间略有不同，例如 Windows\
  \ 2003、Windows Server 2008 R2 等。在 Windows 中查看、创建、删除和修改环境变量的基本步骤列如下：\n\n1. 点击屏幕左下角的\
  \ Windows 图标\n2. 在显示的弹出的窗口中，右键点击“计算机”并选择“属性”\n3. 点击“高级系统设置”\n4. 在“系统属性”屏幕上，点击“高级”选项卡\n\
  5. 点击“环境变量”按钮\n6. 将显示图 8.9 所示的屏幕。\n\n![image](img/F00008Xf08-09-9780123985453.jpg)\n\
  \n图 8.9 设置 `Path` 的截图。\n\n#### 8.3.10.3 创建新环境变量\n\n要创建新变量，请点击“用户变量”或“系统变量”部分下的“新建”按钮。将显示图\
  \ 8.10 所示的屏幕。输入你的新环境变量（用户或系统）的名称和值，并点击“确定”按钮。\n\n![image](img/F00008Xf08-10-9780123985453.jpg)\n\
  \n图 8.10 创建新环境变量的屏幕。\n\n#### 8.3.10.4 修改现有环境变量\n\n要编辑现有环境变量，点击“编辑”按钮。图 8.11 显示编辑界面。在此屏幕中进行修改并点击“确定”按钮保存变量名或值。\n\
  \n![image](img/F00008Xf08-11-9780123985453.jpg)\n\n图 8.11 修改现有环境变量的屏幕。\n\n此屏幕的一个缺点是无法调整大小。如果你正在编辑的变量超过\
  \ 40 个字符，将无法看到它的完整值。一个技巧是从此屏幕复制并粘贴到记事本进行编辑。图 8.12 显示了记事本中显示的变量值。\n\n![image](img/F00008Xf08-12-9780123985453.jpg)\n\
  \n图 8.12 使用记事本编辑环境变量。\n\n#### 8.3.10.5 环境变量与命令行\n\n如果你更喜欢使用命令行而不是图形界面，那么你运气不错，因为\
  \ Windows 允许这样做。要查看所有环境变量列表，打开命令行并输入 `set` 命令。图 8.13 是 `set` 命令输出的截图。\n\n![image](img/F00008Xf08-13-9780123985453.jpg)\n\
  \n图 8.13 用于显示环境变量的 `set` 命令。\n\n也可以从命令行创建新环境变量、删除和修改它们。下表演示了 `set` 命令的这些变体：\n\n\
  | 命令 | 结果 |\n| --- | --- |\n| `set testv=“tester”` | 创建变量 `testv` 并加载为“tester”。该变量仅在当前用户会话可用\
  \ |\n| `set testv` | 显示变量 `testv` 的当前内容 |\n| `set testv=“New val”` | 将 `testv` 的值更新为“New\
  \ val” |\n| `set testv =` | 删除变量 `testv` |\n| `setx NewVar New2` | 创建名为 `NewVar`\
  \ 的用户环境变量并加载“New2”。该变量在当前用户会话无效，但在该用户打开的所有后续命令行中可用 |\n| `setx /M NewestVar New3`\
  \ | 创建名为 `NewestVar` 的系统环境变量并加载“New3”。该变量在当前用户会话中无效，但在所有用户打开的所有后续命令行中可用。若要修改或删除由\
  \ `setx` 命令创建的变量，必须使用图 8.9 所示的 UI 窗口。无法通过命令行中输入的命令进行修改或删除 |\n\n#### 8.3.10.6 关于环境变量生效时间和持续时间的警告\n\
  \n\n\n\n环境变量根据其创建的位置和方式具有不同的“生命周期”。在 Windows 命令提示符中创建的可以是 `User`（用户）或 `System`（系统）类型，具体取决于所使用的命令。关于创建变量的具体命令和持续时间，请参见第\
  \ 8.3.10.4 节](#CHP008.html_S0120) 中的表格。\n\n关于环境变量有一点警告：通常情况下，应用程序只在启动启动时读取它们。如果变量在应用程序运行后发生变化，那么应用程序将无法识别新值。既然如此，你应该在应用程序启动之前完成所有变量更改。如果应用程序已经在运行，那么你需要停止应用程序，创建或更改环境变量，然后重新启动应用程序。\n\
  \n### 8.3.11 运行安装程序\n\n希望你已经尽一切努力为安装做好了准备。现在是时候通过运行安装程序的可执行文件来开始安装了。深吸一口气，关手机，打开一个你将用来截图的文字处理文档。\n\
  \n### 8.3.11.1 典型的安装问题\n\n很难预测每个应用程序安装程序会提出的每一个问题，但以下是你可能会遇到的一些典型问题列表：\n\n* 这是一个新安装还是对现有安装的更新？\n\
  * 你想删除任何现有文件还是覆盖它们？除非有充分理由，否则在进行下一次安装之前请删除现有文件。\n* 这是典型（Typical）安装还是自定义（Custom）安装？确保你理解自定义和典型安装之间的区别。如果你能接受典型安装，它通常更简单更安全。\n\
  * 你想将软件安装在哪里？如果可以，请避免在 `C:` 盘上安装应用程序软件。该驱动器通常保留给操作系统。\n* 你想在桌面上创建一个快捷方式吗？如果你在服务器上安装应用程序软件，没有理由创建快捷方式。它很可能会通过其他方式启动。\n\
  * 用户将如何进行身份验证？有几种身份验证方法，在第 15 节](#15) 中有更详细的描述。\n* 认证——用户\n* 操作系统通过 Windows 认证。\n\
  *  \n* 应用程序的密码。\n* Windows 认证——用户\n* 应用程序认证——用户\n* LDAP/AD——轻量级目录协议/活动目录\n* SSO——单登录\n\
  \n### 8.3.11.2 熟能生工\n\n你应该在安装之前在非生产环境进行练习。如果应用程序在 `DEV` 环境下运行良好即可。\n\n### 8.3.11.3\
  \ 向供应商寻求帮助\n\n不要让用户自己当英雄，在安装过程中寻求帮助。如果应用程序在 `DEV` 或 `TEST` 环境下运行良好，那么你就会很幸。如果应用程序通过了验收测试但无法工作，那么你应该在\
  \ `PROD` 环境下进行测试。\n\n### 8.3.11.4 总是比预想的要\n\n允许自己留出足够的时间。如果安装程序说需要 1 小时，那么假设它需要\
  \ 2 小时。如果安装程序说需要 3 小时，那么假设它需要 4 小时。如果安装程序说需要 5 小时，那么假设它需要 6 小时。确保你留出足够的时间，直到周末。\n\
  \n### 8.3.11.5 文档，记录\n\n在安装过程中记录每一个操作步骤。在文字处理文档中记录每一个屏幕。在截图时记录每一个屏幕。在测试过程中反复记录每一个屏幕。\n\
  \n### 8.3.11.6 安装后检查更新\n\n这看起来像是在《周日循环》中的场景，但安装应用程序后的首要工作是检查是否有补丁。有时供应商会发现应用程序包含代码错误。如果发生这种情况，他们会发布一个称为“热修复”（hotfix）的更新来修复此类问题。如果存在这样的更新，你一定要在发布之前安装它。\n\
  \n## 8.4 用户验收测试——UAT\n\n用户需要一份正式的测试集来确认系统安装正确并满足了他们的需求。如果没有这样的测试和批准协议，你可能会陷入用户拒绝“接受”系统的局面。这些测试需要独立于你获取系统的供应商进行拟定和同意。\n\
  \n验收测试应该由用户编写，而不是开发者或应用程序管理员。这样做有两个主要原因。首先，用户对应用程序的功能更了解。他们对应用程序应该做什么和不应该做什么有更好的判断。\n\
  \n用户编写 UAT 的第二个原因是让责任负在他们身上。我的意思是，如果应用程序通过了 UAT 但无法工作，那么用户只能怪他们自己。作为开发者或应用程序管理员，你不希望在应用程序失败时成为替罪羊。如果用户编写的\
  \ UAT 不可用，他们应该对应用程序失败负责。\n\n用户社区的代表应该执行用户验收测试。测试是由他们编写的，而且他们拥有主要的领域知识，因此他们应该执行测试。可能需要应用程序管理员的协助，但绝大多数测试应该由用户完成。\n\
  \nUAT 的概念同样适用于新安装和升级。升级后，你需要用户同意升级已应用、它符合预期，且系统没有受到其他方面的不利影响。原始的 UAT 可以作为升级后测试的核心。可能会包含额外的测试，但大部分测试可以是原始的\
  \ UAT 测试。\n\n\n\n真实的测试只有通过真实的测试数据才能实现。在这种情况下，“真实”既指数量也指复杂性。假设生产数据库在数百张独立的表中包含数百万行不同的数据。举一个非常简单的例子，假设生产数据库预计将包含\
  \ 100,000 个唯一用户及其地址。与这些用户相关的订单表可能有 10,000,000 行。如果测试数据库仅包含 100 个用户和 200 行订单，那么你的测试是真实的吗？使用这种微不足道的数据库量进行测试，是否能让你预测应用程序在生产数据库上运行时性能？我希望你的答案是“否”。\n\
  \n创建测试数据并非易事。它需要是真实的，但不必是真实的。使用真实数据是危险的，因为人们往往不会像保护生产数据那样保护测试数据。将这些数据标记为“测试”意味着它们没有价值或不需要安全保护。\n\
  \n如果你们机构的策略是在测试期间使用生产数据，那么你需要确保其处理方式与生产数据相同。确保测试数据库的账户和密码与生产数据库一样一样安全。确保访问测试应用程序的安全性与访问其生产版本的安全性一致。\n\
  \n# 第 9 章：支持软件\n\n## 摘要\n每个应用程序在服务器上都需要其他支持软件。本章描述了为应用程序提供的支持软件及其功能。支持软件的示例包括 Web\
  \ 服务器、软件框架、数据库客户端软件、数据库访问工具、防火墙、防病毒软件、入侵检测、日志监控、漏洞扫描器、监控软件、备份软件和调度软件。\n\n### 关键词\n\
  支持软件；软件框架；集群与负载均衡；Web 软件；数据库客户端软件；防火墙；防病毒；日志；漏洞；监控；备份；调度；ETL\n\n约翰·多恩的名言“人不是孤岛”对于软件的适用性几乎亚于人类。没有任何程序、应用程序或软件代码是孤立存在的。你支持的应用程序依赖于许多其他软件，而这些软件反过来依赖于其他代码。甚至操作系统也需要设备驱动和其他低级软件到位才能提供支持。\n\
  \n鉴于软件这种近乎有机的相互依赖关系，对于你的应用程序之外还需要加载到服务器以及可能加载到用户工作站的软件数量，你不必感到意外。其中一些会在操作系统加载时加载。另一些需要在运行应用程序安装程序之前加载。还有可能作为应用程序安装的一部分被加载。极其重要的一点是你要清楚需要加载什么以及何时加载。安装这些支持软件应该包含在第\
  \ 8 章中学习过的项目计划中。\n\n## 9.1 应用程序服务器上的支持软件\n虽然每个应用程序服务器都有独特的环境，但应用程序服务器上通常需要某些类型的软件。接下来的章节描述了一些更常见的软件软件包类型，以及它们为应用程序提供的功能的简要描述。\n\
  \n如果这本书能提供你应用程序所依赖的每一个可能的支持软件的详细信息，那就太好了。遗憾的是，对于这本书或任何书来说都不可能包含那种水平的信息。而且一旦付诸纸面，它立刻就会过时了。这里可以采取的最佳方案是对你可能遇到的支持软件提供高层次的描述。关于它的更详细信息可以从应用程序的《安装指南》或直接从供应商的支持小组获取。\n\
  \n第 9.1.1 节–第 9.1.12 节 中描述的软件类型大致是从底部向上排列的。除了服务器操作系统外，框架是最基础的组件。在其之上的是集群和负载均衡软件等。它们都是重要的，但某些仅仅是层级比其他更低。\n\
  \n### 9.1.1 框架\n在软件开发和应用领域，软件框架是一个可以重复使用的平台，用于更快速、更高效且更少错误地开发应用程序。框架通常包括编译器、库、工具和\
  \ `API`（应用程序编程接口）。\n\n你所支持的应用程序可能（但并非确定）是使用软件框架开发的。如果应用程序是基于框架的，那么你可能需要确保在应用程序安装过程之前，服务器上已经安装了所需的软件组件。如果需要这样做，《安装指南》将说明这一点，并提供供你遵循的安装说明。\n\
  \n你的应用程序可能构建在更常见的框架上有微软的 `.Net Framework` 以及各种 Java 框架之一。\n\n#### 9.1.1.1 .NET framework\n\
  `.NET framework` 主要运行在 Windows 操作系统上。如果你的应用程序是基于 `.NET` 构建的，那么你需要在服务器上安装某个版本的 `.NET`。这样做并不困难，而且加载\
  \ `.NET` 没有相关的许可费用。\n\n如果给定服务器上运行着多个应用程序，且每个应用程序都需要不同版本的 `.NET Framework`，这并不是问题，不同版本的\
  \ `.NET` 可以加载到同一台机器上，它们将共存。\n\n### 9.1.1.2 Java 框架\n你支持的应用程序是否要求服务器上安装 Java 组件？有很多\
  \ Java 框架，每个框架都有其自己的要求。框架可以是开源的，也可以是专有的，但这对你作为应用程序管理员来说并不重要。编写应用程序的供应商已经决定了什么框架最适合他们的工作，并在必要时进行了授权。\n\
  \n一些流行的 Java 框架包括：\n* `Apache Struts`\n* `Cocoon`\n* `Oracle ADF (Application Development\
  \ Framework)`\n* `RAP (Rich Ajax Platform)`\n* `WebWork`\n\n如果 Java 框架要求在服务器上安装任何软件组件，这些细节将在《安装指南》中指定。只要你遵循《安装指南》中的指令，就不应该遇到任何问题。第\
  \ 8 章提供了通用的应用程序安装指南。如果确实发生了问题，请联系供应商的服务台寻求帮助。\n\n### 9.1.2 集群与负载均衡\n集群和负载均衡是用于提高应用程序可用性或吞吐量的架构技术。并不是所有应用程序都需要更高水平的可用性或性能，因此大多数应用程序环境都不包含集群或负载均衡。\n\
  \n如果你选择采用这些任何一种技术，请准备应对一个复杂得多的安装过程。这可能包括处理额外的服务器、额外的软件、额外的 IP 地址以及更复杂的启动/关闭程序。\n\
  \n如果你的机构没有此类安装的经验，你应该认真考虑让供应商技术人员或经验丰富的顾问协助你完成安装过程。务必将集群和负载均衡所需的额外时间和资源考虑在你的项目计划中。\n\
  \n#### 9.1.2.1 集群\n\n\n\n\n\n集群被定义为一组像单一系统一样运行的计算机服务器。如果其中一台服务器发生故障，理想情况下对应用程序的可用性不应产生明显的影响。取决于应用程序的复杂性、访问应用程序的用户数量以及剩余服务器的数量等因素，可能会对应用程序的性能产生影响，但其意图是让应用程序继续对用户可用。\n\
  \n集群可以通过硬件或软件实现。如果选择硬件方法，通常需要专门的硬件。如果选择软件技术，则可以使用通用服务器。由于通用服务器更具经济效益，软件聚类是创建和控制集群时更常用的方法。\n\
  \n一些集群软件的示例包括：\n\n* Microsoft Cluster Server\n* Red Hat Cluster Suite\n* Solaris\
  \ Cluster\n* Veritas Cluster Server\n\n## 9.1.2 负载均衡软件\n\n负载均衡的目标是将工作分配到多个服务器、磁盘驱动器、网络链路或其他组件上，以最大化提高吞吐量。如果你确定你的应用程序需要负载均衡，请准备好面对更复杂的安装过程。\n\
  \n实现负载均衡有几种方法。其中一种是使用负载均衡程序，它接收用户请求并将其分配到若干个“后端”服务器之一。当服务器完成请求后，结果将发送到负载均衡器，由其将其返回给请求者。只要有后端服务器可以处理下一个迁入请求，用户请求就能立即得到响应。这种方法向用户隐藏了多台服务器的存在。在用户看来，负载均衡程序就是应用程序本身。\n\
  \n另一种方法是让多个“后端”服务器暴露给用户。用户在提出请求时会指定一个特定的服务器。这种方法更简单，但缺点是它给用户施加了一定程度的决策负担，即他们应该连接到哪台服务器。这种方法的另一个缺点是，如果用户习惯使用的服务器不可用，用户可能并不知道其他服务器是可用的。\n\
  \n你的应用程序可能基于的一些负载均衡器品牌有：\n\n* F5 BIG-IP Load Traffic Manager (LTM)\n* 基于 Cisco IOS\
  \ 的路由器\n* Radware AppDirector OnDemand 交换机\n* CoyotePoint Equalizer Appliances\n\
  * Barracuda\n* Riverbed Stingray Traffic Manager\n* Kemp Technologies LoadMaster\
  \ 负载均衡器\n\n## 9.1.3 Web 服务器\n\n“Web 服务器”一词可以指代硬件或软件。如果你指的是硬件，那么它是满足用户网页请求的物理设备。当指的是软件时，它是一个运行在硬件上以满足网页请求的程序（见下文示例）。\n\
  \n如果你的应用程序是基于浏览器的，那么你可能会同时接触硬件和软件版本的 Web 服务器：\n\n* 硬件是安装你应用程序的服务器。\n* 软件是一段专门的代码，它接受应用程序用户的网页请求，处理这些请求并返回结果。\n\
  \n有很多广泛使用的软件服务器，你的应用程序可能会依赖它们作为 Web 服务器。其中一些包括：\n\n* Apache HTTP Server（又称 Apache）是最流行的\
  \ Web 服务器程序之一。它根据 Apache 许可发布，因此它是开源的，对任何想要使用它的人免费提供。Apache 可以在许多操作系统上运行，包括 Linux、OS\
  \ X、Solaris、UNIX 和 Windows。\n* Microsoft IIS（Internet 信息服务）适用于大多数 Windows 操作系统，并作为\
  \ Windows 的可选组件可用。\n* Sun Java System Web Server 由 Oracle 提供。该 Web 服务器运行在 AIX、HP-UX、Linux、Solaris\
  \ 和 Windows 操作系统上。\n\n## 9.1.4 支持应用程序的软件\n\n应用程序服务器旨在为应用程序提供使其功能化且高效所需的基础设施。为应用程序提供的服务包括安全性、改进的可用性、支持复杂的数据库访问、事务支持和邮件服务。\n\
  \n如果你的应用程序依赖于应用程序服务器，安装指南将提供相关详细信息。它将提供安装步骤。从长远来看，你应该尽可能多学习有关应用程序服务器的知识。（请参见 第 8\
  \ 章 关于安装的通用指南。）有时你必须登录其控制台来停止、启动或修改对象。你对这个工具越熟悉，操作起来就越熟练。\n\n一些常见的应用程序服务器有：\n\n\
  * Oracle WebLogic Server 是一个 Java EE 平台，为应用程序提供网络协议、Java 数据库连接 (`JDBC`)、Java 事务\
  \ API (`JTA`)、Java 消息服务 (`JMS`)、JavaMail 以及服务。\n* IBM WebSphere 是一个软件套件，提供 Web 服务器、网站模板、开发工具、配置向导以及访问关系型数据库的功能。\n\
  * Glassfish 是一个开源应用程序服务器。它最初由 Sun Microsystems 开发和支持。目前由 Oracle 公司赞助。Oracle 支持的\
  \ Glassfish 版本被称为 Oracle GlassFish Server。Glassfish 支持 EJB（企业级 JavaBeans）、Java 持久化\
  \ API（即 `JPA`）、Java 消息服务 (`JMS`) 和 JavaServer Page。\n\n## 9.1.5 数据库\n\n几乎每个应用程序都会连接数据库，以存储、更新和检索应用程序所需的数据。这些数据库中的许多（如果不是大多数）都是关系数据库引擎，如\
  \ Oracle、Microsoft SQL Server 或 MySQL。某些应用程序可能有专用数据库，但那些绝对是少数。\n\n在应用程序开始使用第三方数据库引擎之前，需要完成若干任务。最常见的列在此处：\n\
  \n1. 在数据库服务器上安装数据库引擎。\n2. 在数据库服务器与需要与其通信的服务器之间开放端口。\n3. 在应用程序服务器上安装能够与数据库引擎工作的软件。这种软件被称为“客户端”。例如，如果使用的数据库是\
  \ Oracle，那么该版本的客户端软件就是 Oracle Client。\n4. 创建应用程序所需的数据库。\n5. 在应用程序数据库中创建应用程序所需的管理帐户。\n\
  6. 在数据库中创建应用程序所需的表。\n7. 为表填充应用程序所需的初始数据。\n8. 在应用程序数据库中创建用户级帐户。\n\n\n\n\n\n| DBA、安装程序或\
  \ App Admin | 创建应用程序所需的管理账户。如果由应用程序管理员执行此操作，则需要数据库 `SYSTEM` 账户的密码 |\n| DBA、安装程序或\
  \ App Admin | 创建应用程序所需的表。如果由应用程序管理员执行此操作，则需要数据库 `SYSTEM` 账户的密码 |\n| DBA 或安装程序 |\
  \ 填充应用程序数据库表 |\n| 应用程序管理员或选定的应用程序“高级用户” | 创建用户级账户。如果应用程序具有批量注册流程，则应使用该流程 |\n\n##\
  \ 9.1.5.1 数据库客户端软件\n\n请阅读《安装指南》，详细了解正在使用的是哪种数据库引擎，以及是否需要加载该客户端软件。并不是所有的数据库引擎都要求将客户端软件加载到应用程序服务器上。以下章节描述了多种数据库引擎的客户端软件。\n\
  \n### 9.1.5.1.1 Oracle 客户端软件\n\nOracle 客户端软件提供 32 位和 64 位版本。关于加载 32 位还是 64 位版本的决定并不是一而易见的。如果应用程序服务器的操作系统/系统是\
  \ 32 位的，则可以使用任何版本的 Oracle 客户端软件。在向应用程序服务器加载任何内容之前，请通过《安装指南》或联系供应商支持小组确认需要哪一个版本。如果供应商没有提供客户端软件副本，则可以从\
  \ Oracle 网站获取。请务必确保安装的是《安装指南》指定的精确版本。如果安装的客户端软件版本未经过应用程序供应商的认证，那么现在或将来可能会出现问题。\n\
  \n加载此软件应在 DBA 创建数据库且应用程序服务器与数据库服务器之间的防火墙端口已打开之后进行。只有在完成这两个前提条件后，您才能测试连接以验证所有设置是否已正确。\n\
  \n### 9.1.5.1.2 IBM DB2 客户端软件\n\nIBM 的 `DB2` 数据库引擎也有需要安装在应用程序服务器上的客户端软件。`DB2` 客户端软件有多个版本。最大的版本包含了对\
  \ Java、C/C++、.NET、PHP 和 Ruby 的支持。如果应用程序只需要一种类型的数据库连接支持，则可以安装支持 Java、.NET 或 C/C++\
  \ 的较小版本的客户端软件。如果供应商没有提供所需的版本，请仔细阅读《安装指南》，以便下载并安装所需的特定版本。\n\n## 9.1.5.2 数据库访问工具\n\
  \n作为应用程序管理员，您有时可能需要对数据库运行 `SQL`（结构化查询语言）命令。在安装期间，您可能需要执行 `SQL` 脚本来创建表、填充表或创建用户账户。应用程序安装后，在应用升级时，您可能需要运行\
  \ `SQL` 语句或脚本。如果应用程序出现问题，来自供应商支持部门的技术人员很可能会要求您运行一个 `SQL` 语句脚本以收集有关问题的详细信息。\n\n有很多工具可以与数据库建立连接并执行\
  \ `SQL` 命令。取决于所使用的数据库引擎，有多种可能性。以下章节描述了潜在的工具及其工作原理。其中一些工具是免费的，另一些则涉及许可费用。某些工具仅适用于单一供应商的数据库，而另一些则适用于许多不同的数据库。\n\
  \n### 9.1.5.2.1 SQL*Plus\n\n在 Oracle 环境中，与数据库交互的最基本工具是 `SQL*Plus`。和任何工具一样，它有优缺点。`SQL*Plus`\
  \ 最大的优点作为免费 Oracle 客户端软件的一部分提供的。这意味着在每个连接到 Oracle 数据库的工作站或服务器上都可用。对于许多用户来说，`SQL*Plus`\
  \ 最大的缺点是它以命令行为中心，即它没有 GUI 界面。`SQL*Plus` 的另一个限制是它只能连接到 Oracle 数据库。图 9.1 显示了 `SQL*Plus`\
  \ 连接到数据库时的截图。\n\n![image](img/F000091f09-01-9780123985453.jpg)\n\n图 9.1 Oracle SQL\
  \ Plus 示例。\n\n在提示符处，输入您的 `SQL` 命令并按 Enter 键。结果将显示在命令行窗口中。如果显示超过几行，将它们重定向（即输出/spool）到输出文件将非常有用。然后可以使用像记事本之类的文本编辑器打开输出文件。\n\
  \n### 9.1.5.2.2 SQL Developer\n\n另一个可以连接到 Oracle 数据库的工具是 `Oracle SQL Developer`。`SQL\
  \ Developer` 是一个基于 GUI 的工具，对于习惯使用图形界面工具的人来说可能更舒服。可以从 Oracle 网站免费下载此工具。图 9.2 显示了\
  \ `SQL Developer` 的主界面。\n\n![image](img/F000091f09-02-9780123985453.jpg)\n\n图 9.2\
  \ Oracle SQL Developer 示例。\n\n### 9.1.5.2.3 Microsoft Server Management Studio\n\
  \n一种可连接数据库的 Microsoft 工具是 `SQL Server Management Studio`。它允许用户连接数据库、执行 `SQL` 命令并显示结果。此工具对所有安装免费，但它只能连接到\
  \ SQL Server。图 9.3 包含了该工具的示例。\n\n![image](img/F000091f09-03-9780123985453.jpg)\n\
  \n图 9.3 Server Management Studio 示例。\n\n### 9.1.5.2.4 Query Browser\n\nMySQL 的对应工具被称为\
  \ `Query Browser`。它也是一个基于 GUI 的工具，允许用户创建和执行 `SQL` 命令并将结果显示在面板中。图 9.4 包含了 Query Browser\
  \ 的截图。\n\n![image](img/F000091f09-04-9780123985453.jpg)\n\n图 9.4 Query Browser 示例。\n\
  \n### 9.1.5.2.5 Toad 和 SQL station\n\n之前描述的工具（即 `SQL*Plus`、`SQL Server Management\
  \ Studio` 和 `Query Browser`）只能连接到特定的产品。有一些工具可以连接到多个供应商的数据库。此类工具的两个是 `Toad` 和 `SQL\
  \ station`。这些工具都是基于 GUI 的。它们的主要优势是可以连接到不同的供应商数据库，包括 Oracle、SQL Server 和 MySQL。缺点是它们不像描述的其他工具那样免费。\n\
  \n## 9.1.6 安全\n\n安全是每个应用程序管理员的一个主要考虑因素。你支持的应用程序可能包含大量的公司数据。这些可能是财务数据、预算数据、会计信息、法律文件或个人数据。属于组织的所有数据都必须保密。\n\
  \n许多网络犯罪分子已经意识到应用程序及其数据库中包含了数据的宝库。当这些坏分子盯准你所支持的应用程序时，组织中的每个人都需要变得更加注重安全。\n\n以下章节描述了经常用于保护应用程序的某些工具类型。并不要求应用程序管理员成为所有这些领域的专家，但你需要了解它们的功能以及它们是否已部署以保护你的应用程序环境。关于安全性的更多信息在第\
  \ 15 章中提供。\n\n### 9.1.6.1 防火墙\n\n\n\n\n\n防火墙的作用是通过控制网络流量（包括入站和出站流量）来保持网络安全。防火墙可以是基于硬件的、基于软件的，或者是硬件与软件的结合。它分析数据包并根据一组规则决定哪些数据包允许通过，哪些应该被拦截。\n\
  \n防火墙本质上是你的内部或本地网络与组织外部一切事物（即互联网）之间的桥梁。图 9.5 展示了防火墙如何将内部网络与外部世界隔离开。\n\n![image](img/F000091f09-05-9780123985453.jpg)\n\
  \n图 9.5 防火墙保护组织网络的示意。\n\n作为应用程序管理员，你与防火墙的交道主要是请求安全团队在你的应用程序服务器和其他服务器之间开放端口。可能需要在防火墙中开放的端口示例包括：\n\
  \n- 如果你的应用程序使用 Oracle 数据库，那么你需要在应用程序服务器和 Oracle 数据库服务器之间开放端口。Oracle 使用的默认端口是 `1521`。\n\
  - 如果数据库是微软的 SQL Server，则需要在应用程序服务器和运行 SQL Server 的数据库服务器之间开放端口。SQL Server 的默认端口是\
  \ `1433`。\n- 如果应用程序需要与 SMTP 邮件服务器通信，则必须开放应用程序服务器与邮件服务器之间的端口。SMTP 的默认端口是 `25`。安全\
  \ SMTP (SSMTP) 的默认端口是 `465`。\n- 如果应用程序用户使用浏览器与应用程序服务器通信，则需要为该通信开放端口。HTTP 流量的默认端口是\
  \ `80`。\n\n### 9.1.6.2 杀毒 (AV) 软件\n\n计算机病毒是一段主要意图自我复制的代码。它可能是破坏性的，也可能是良性的，但其主要目的是复制到其他计算机。病毒从一台计算机传递到另一台计算机的一些方式包括：\n\
  \n- 病毒可以附加到 `.COM` 或 `.EXE` 程序文件中。当受感染的文件在新的计算机上执行时，该计算机就会被感染。\n- 病毒可以写成 Microsoft\
  \ Word 或 Excel 等程序使用的宏。当宏运行时，运行该宏的计算机就会被感染。\n- 病毒可以感染硬盘、CD 或 U 盘（即 USB 驱动器）特定区域的代码。如果将受感染的\
  \ CD 或 U 盘插入计算机，计算机就会被感染。\n\n杀毒软件可以识别病毒和其他恶意软件，如广告软件、木马、间谍软件和蠕虫。一旦杀毒软件识别出恶意软件，它就会阻止其运行。你需要理解，大多数杀毒软件是对之前已识别的恶意软件做出反应。你的服务器面临被杀毒软件厂商尚未识别的恶意代码攻击的风险。尚未被识别且尚无解决方案的攻击被称为“零日攻击”。\n\
  \n可能运行在你的应用程序服务器上的提供杀毒软件的厂商示例包括：\n\n- Bitdefender Antivirus Plus\n- GFI-Vipre\n\
  - Kapersky Anti-Virus\n- McAfee\n- Microsoft\n- Norton/Symantec\n- Panda\n- Sophos\n\
  - Symantec\n- Trend Micro\n\n作为应用程序管理员，你对杀毒软件的参与是确保它在你的应用程序服务器上运行。大多数杀毒软件会定期下载用于识别恶意软件的更新。这些更新被称为“特征码”。如果你发现杀毒软件没有运行，或者新特征没有定期下载到你的服务器，那么你需要立即联系组织的安全团队！\n\
  \n### 9.1.6.3 入侵检测系统 (IDS)\n\n入侵检测系统旨在防止个人或自动化攻击访问你的服务器或网络。如果检测到入侵尝试，系统将进行记录并向安全管理员发出警报。识别入侵的方法有很多种，但这些信息超出了本书以及大多数应用程序管理员的范围。\n\
  \n可能已安装在你的应用程序服务器上的一些较常用的 IDS 工具包括：\n\n- Snort\n- Firestorm\n- Prelude\n- Dragon\n\
  - STAT\n\n作为应用程序管理员，你需要知道服务器上是否安装了 IDS 软件。如果是，那么当它生成关于正在发生入侵的警报时，你应该知道该联系谁。IDS 应该自动通知安全团队，但如果你发现了警报，自己也联系他们并无大大益。\n\
  \n### 9.1.6.4 日志监控实用\n\n日志文件由运行在你的应用程序服务器上的许多不同软件创建。经常写入日志文件的组件示例包括：\n\n- 操作系统\n\
  - 你所支持的应用程序\n- Web 服务器\n- 负载均衡器\n- 防火墙\n- ETL（提取、转换和加载）软件\n- 入侵检测系统 (IDS)\n- 备份进程\n\
  \n如果你像大多数应用程序管理员一样，你没有时间、意愿或知识来不断检查这些日志。但如果没有人定期检查它们，它们可能包含的价值信息就无法被注意到。这种困境的解决方案是让日志监控程序来检查它们。\n\
  \n日志监控工具可以是简单或复杂的、易用或复杂的、昂贵或免费的。如果你的安全组尚未选择日志监控程序并将其安装在你的应用程序服务器上，那么你应该考虑自己这样做。\n\
  \n日志监控软件的示例是：\n\n- GFI EventsManager\n- Solarwinds\n- Splunk\n- Tivoli Log Monitoring\
  \ Tools\n- WhatsUp Log Management\n\n### 9.1.6.5 安全证书\n\n安全证书是一种用于解密信息的密钥。如果你的应用程序包含敏感信息（例如信用卡号），它应该尽可能安全。使用带有安全证书的\
  \ `SSL` 可以为你的应用程序提供所需的保护。\n\n安全证书从证书机构 (`CA`) 获取。每个 CA 都有自己的费用、更新细节等。CA 的示例包括：\n\
  \n- GeoTrust\n- Go Daddy\n- RSA\n- Secure Certificate Services\n- Symantec/VeriSign\n\
  - Thawte\n\n### 9.1.6.6 漏洞扫描器\n\n漏洞扫描器是一种用于评估服务器、应用程序或网络安全性的工具。从根本上说，漏洞扫描器是一个像黑客一样思考的工具。它以黑客的方式检查目标，即寻找漏洞或缺陷。\n\
  \n一种方法是漏洞扫描器拥有一个已知漏洞数据库。它检查目标以查看这些漏洞是否存在。如果漏洞存在，它将包含在漏洞扫描器准备的报告中。这种解释针对的是最基础的漏洞扫描。存在更复杂的方法，但超出了本书的范围。\n\
  \n漏洞扫描器寻找的漏洞示例包括：\n\n- 应用程序是否进行了输入验证？\n- 服务器是否存在已知配置错误？\n- 服务器是否已安装最新的操作系统补丁？\n\
  - Web 服务器软件是否已安装最新的补丁？\n- 应用程序是否容易受到溢出攻击？\n- 攻击者是否可以提升其获得的权限？\n- 应用程序是否可以通过 SQL\
  \ 注入攻击破解？\n\n\n\n\n\n# 应用程序容易受到整数溢出攻击吗？\n\n以下列出了一些可用漏洞扫描器的示例。其中一些是开源工具，而另一些是商业产品。一些安全专家建议组织同时使用商业产品和开源工具：\n\
  \n- AppScan\n- Arachni\n- Hailstorm\n- N-Stalker\n- Nessus\n- NeXpose\n- Powerfuzzer\n\
  - Skipfish\n- Wapiti\n- WebInspect\n- Websecurify\n\n## 9.1.6.7 更新软件\n\n对于依赖技术的组织来说，更新是生活中的常态。那些你甚至已经忘记安装在服务器上安装的软件，最终也需要更新。你有两种选择：是手动进行此操作，还是将该过程自动化。如果你选择手动处理更新，请准备好将职业生涯很大比例的时间花在这些枯燥的任务上。\n\
  \n更新软件工具示例包括以下产品：\n\n- Altiris\n- AppFresh\n- Desktop Central\n- KACE Appliance\n\
  - LANDesk\n- Synaptic/APT\n- Update Notifier\n\n尽管这些工具非常有用，但在更新软件方面，它们并不是万能妙药。它们无法更新你服务器上可能存在的每一件软件。务必确保你所选择的工具正在更新什么，以及没有更新什么。\n\
  \n服务器上安装的软件越流行，其更新就越有可能通过上面列出的更新工具之一进行管理。但是，如果你支持的应用程序是一个小众产品，那么任何更新工具都不可能识别它。我还要概括为：软件越复杂，其自动更新的可能性就越小。\n\
  \n## 9.1.7 报告\n\n在我看来，谈论无纸化社会为时过早了。商业世界继续依靠报告运行，在许多许多情况下，这些报告被打印在纸上。为了在虚拟上支持这一需求，每个应用程序都有一个报告组件。第\
  \ 4 章 对许多应用程序常用的报告功能进行了更全面的讨论。\n\n报告功能可能以以下方式之一实现：\n\n- 内置在应用程序中的专有报告工具\n- 从第三方许可的独立报告包\n\
  - 从第三方许可并已集成到应用程序中的报告包\n\n作为应用程序管理员，供应商选择上述哪种技术来实现其报告能力并不至关重要。从管理员的角度来看，支持报告包通常并不困难。报告工具需要连接到数据库。这意味着你可能需要调整某些配置参数来启用该功能。如果报告通过电子邮件分发，那么你可能需要在参数文件中输入电子邮件服务器的名称。\n\
  \n如果你将亲自负责编写报告，那么你无疑会花更多时间在报告包上。如果还没有建立起一种让用户提交新报告请求和现有报告更改请求的流程，那么绝对需要建立这样的系统。如果没有方法跟踪此类请求，你将面临无尽的头恼。\n\
  \n一些广泛使用的第三方报告包示例包括：\n\n- Business Objects\n- Crystal Reports\n- Cognos BI\n- SQL\
  \ Server Reporting Services\n- Oracle Reports\n- Tableau\n\n## 9.1.8 监控\n\n应用程序、网络和服务器有许多变动部件，碎片多到任何人都无法\
  \ 24 小时、每周 7 天进行跟踪。有可用的监控工具可以为忙碌的应用程序管理员跟踪所有这些部件。使用监控工具的一个主要目标是识别问题，并希望在用户察觉之前修复它。\n\
  \n监控工具可以跟踪的一些指标包括以下：\n\n- CPU 负载超过阈值\n- 网络带宽利用率过高\n- 网络流量监控以确保未超过阈值\n- 服务器上的服务已停止或启动\n\
  - 服务器已重启\n- 可用磁盘空间低于预设阈值\n- 磁盘 I/O 活动超过设定的阈值\n- 设备不再可用\n- 发生网络中断\n- 创建了错误文件\n\n\
  监控工具的能力差异很大。有些工具仅在指标超出范围时能够记录事件。另一些工具可以在指标异常时通过电子邮件发送警报。有些可以在特定事件发生时采取行动。例如，如果应用程序停止，监控工具将识别此情况并重启它。\n\
  \n某些监控工具使用称为 `agent`（代理）的软件，该软件被加载到每个需要监控的服务器上。代理实际上监控每台服务器上的活动，然后将细节传回加载了监控工具的“主”服务器。不需要代理的工具被称为“无代理”。这些工具通过使用运行在应用程序服务器上的操作系统内置监控功能来获取活动详情。\n\
  \n有很多监控工具可以选择。有些简单，另一些复杂得多。有些是开源的（即免费），有些则昂贵。这里列出了监控工具的短名单：\n\n- Cacti\n- Nagios\n\
  - HP 的 OpenView\n- Orion SolarWinds\n- Zabbix\n- Monit\n\n涉及监控时，应用程序管理员可能的角色和职责如下：\n\
  \n- 你是否负责将监控软件加载到应用程序服务器上？\n- 你是否负责在应用程序服务器上激活监控软件？\n- 当发生异常情况时，监控软件会发送警报吗？\n- 如果会，谁接收了这些警报以及如何接收？\n\
  - 如果服务器由于任何原因必须停止（例如在升级过程中），可以禁用监控软件以防发送警报吗？\n- 报告是由监控工具创建的吗？\n- 报告是自动创建还是手动创建？\n\
  - 报告如何分发？谁拥有副本？\n\n## 9.1.9 备份软件\n\n世界是一个不确定的地方。任何可能坏事最终都会发生。如果你的应用程序没有备份，那么当最糟糕的情况发生时你将毫无准备。为了做好准备，你需要按照定期、可靠、可预测的周期对服务器进行备份。\n\
  \n备份软件示例包括：\n\n- CommVault\n- IBM Tivoli Storage Manager\n\n\n\n\n\n- NetVault Backup\n\
  - NTBackup\n- Norton 360\n- EMC RecoverPoint\n- Yosemite Server Backup\n\n作为应用程序管理员，你需要对以下与备份的问题给出答案：\n\
  \n- 应用程序软件是否包含自带备份功能？\n- 是否需要向应用程序服务器加载特定的特定的备份软件或程序包？\n- 如果需要，那么由谁来操作？\n- 谁负责调度备份？\n\
  - 在备份运行期间，用户是否能够登录应用程序？\n- 如果不能，他们是否知情，或者是否会在备份窗口期内被阻止登录？\n- 谁来验证备份是否成功完成？\n- 如果备份失败，是否会有人通知？\n\
  - 备份的输出结果发送到哪里？\n- 保留多少份备份文件？\n- 如何删除旧的备份文件？\n\n### 9.1.10 工具\n\n有一些工具或实用程序并不整齐地归入前述的类别。这里介绍了这些工具的示例：\n\
  \n- `FTP`（文件传输协议）软件，用于在服务器之间移动文件。\n- 压缩软件，用于压缩文件，即在不丢失任何数据完整性的情况下减小文件体积。这样做是因为即使是今天的大容量硬盘，磁盘空间也是有限的。某些文件可以压缩到其原始大小的一个小百分比。\n\
  - 加密软件，用于保护你的数据免受窥视。\n\n### 9.1.11 调度\n\n这可能显而易见，但即使是相对简单的应用程序可能也有需要在特定日期和时间启动的任务。为了满足这些需求，可以在你的应用程序服务器上安装一个调度程序包。需要在计划日期或时间执行的任务示例包括：\n\
  \n- 执行备份\n- 创建并发送报告\n- 导出数据文件并将其传输到另一个应用程序或服务器\n- 为了性能目的重启（即停止并启动）应用程序\n- 捕获服务器或应用程序统计信息的快照\n\
  \n调度程序包种类极多。你可以选择一个非常基础的工具或一个功能完备的。你可以使用操作系统内置的工具。你可以免费下载开源包，也可以选择花高价购买一个行业领先、最先进的调度器。\n\
  \n需要调度的任务数量可能会决定获取和使用什么类型的工具。如果需要调度的任务非常有限，购买昂贵的调度工具将是愚的。\n\n这里列出了一些可调度工具：\n\n-\
  \ `Cron` 内置于 UNIX 和 Linux 操作系统\n- `Windows Task Scheduler` 内置于所有 Windows 操作系统\n\
  - `BMC Control-M`\n- `Open Source Job Scheduler`\n- `JAMS Scheduler`\n- `Tivoli\
  \ Workload Scheduler`\n- `VisualCron`\n- `ActiveBatch`\n- `Advanced Job Scheduler`\n\
  \n作为应用程序管理员，你必须回答以下与调度相关的问题：\n\n- 你的应用程序是否需要任何调度？\n- 如果需要，将使用什么调度工具来完成？\n- 是否需要向你的应用程序服务器加载任何调度软件？\n\
  - 正在调度哪些任务，具体是哪些任务、哪几天以及什么时间？\n- 谁负责设置这些计划任务？\n- 如果调度任务失败，是否有人（例如你）收到通知？\n- 如果一个或多个任务的调度失败，你知道如何重置调度器吗？\n\
  - 如果调度是从“主”计算机运行的，当你的某个任务应该运行时如果调度软件宕机，你的任务会发生什么？\n\n### 9.1.12 提取、转换和加载\n\n`ETL`\
  \ 是执行以下数据相关任务的软件的通用名称：\n\n1. 从多个和/或外部源提取数据\n2. 转换数据以适应目标、格式或预期\n3. 将数据加载到目标数据库、数据市或数据仓库中\n\
  \n如果你支持的应用程序拥有 `ETL` 软件，那么你需要考虑以下问题：\n\n- 谁来加载 `ETL` 软件？\n- 它加载在你的应用程序服务器上吗？\n-\
  \ 如果没有，它需要加载到哪里？\n- 它是应用程序内部的还是一个独立的软件组件？\n- 是否需要将 `ETL` 任务添加到调度器中？\n- 谁来监控 `ETL`\
  \ 任务是否成功完成？\n\n## 9.2 用户工作站上的支持软件\n\n应用程序的大部分软件加载到服务器上，但某些组件可能需要加载到用户的工作站上。作为应用程序管理员，你需要仔细阅读《安装指南》，以确切了解哪些软件（如果有）需要加载到用户的计算机。\n\
  \n虽然涉及的软件数量相对有限，但由于可能存在大量此类工作站，情况变得复杂。更糟糕的是，这些设备可能分布在整个大楼、城市、国家甚至世界上。由于时区、语言障碍、用户拥有的各种硬件以及用户之间技术水平的巨大差异，与用户社区的沟通或工作可能会变得复杂。\n\
  \n你需要理解这些软件将如何加载。一些可能性包括：\n\n- 你的组织是否有一个专门向桌面电脑加载软件的组？\n- 是否由你负责加载它？\n- 供应商是否提供了加载它的脚本或实用程序？\n\
  - 如果提供准确且易读的说明，用户是否有能力加载它？\n\n可能需要加载到用户工作站的软件类型在 `9.2.1` 到 `9.2.4` 中描述。这些描述保持简短，是因为其中许多软件已经在服务器部分被描述过。必要时已提供更详细的描述。\n\
  \n### 9.2.1 浏览器\n\n如果用户将使用 浏览器连接到应用程序，你需要知道哪些浏览器和版本通过了供应商的认证。虽然用户在大多数情况下使用未经的浏览器可能没事，但他们很可能会遇到问题。你需要建议他们坚持供应商提供的授权浏览器列表。\n\
  \n当用户报告问题时，你应该问的首要问题之一是错误发生时在使用什么浏览器。如果使用了不支持的浏览器或版本，请让他们在支持的浏览器上重复他们采取的步骤，看看问题是否再次出现。\n\
  \n### 9.2.1.1 浏览器插件\n\n浏览器插件是添加到浏览器中的软件组件，用于为浏览器功能添加特定的能力或特性。某些通过网络浏览器访问的应用程序要求在每个用户的工作站上加载特定的插件。\n\
  \n如果你支持的应用程序有此要求，那么你需要确切记录这将如何影响用户。该文档中应包含的一些细节有：\n\n- 安装插件的确切步骤\n- 用户可以访问进行此安装所需的任何文件的位置\n\
  - 此过程将需要多久？\n- 过程完成后，用户的工作站需要重启吗？\n- 如果安装成功，用户将看到什么消息？\n- 如果安装失败，用户将看到什么消息？\n- 如果安装不成功，用户应该做什么，例如尝试重新安装、打电话等。\n\
  \n插件可能为你的应用程序浏览器添加的一些功能示例包括：\n\n- 添加显示新文件格式的能力，例如图像文件格式\n- 加密和解密文件的功能\n- 支持编程语言\n\
  \n\n\n\n\n### 9.2.2 数据库\n\n如果应用程序需要将某个演示软件加载到用户的工作站上，那么工作站可能会直接与数据库进行通信。如果是如此，则可能需要在每个用户工作站上安装数据库客户端软件。确认此需求存在并为此做好准备的方法有两种：\n\
  \n1. 阅读 `Installation Guide`（安装指南）\n2. 设置一个模拟典型用户工作站的测试工作站\n\n### 9.2.3 文档查看器\n\n\
  如果应用程序的报告包生成的报告格式不是 ASCII 文本，那么可能需要在用户工作站上安装某种形式的查看软件。此类文档查看软件的一些可能示例包括：\n\n• `Microsoft\
  \ Office`，特别是 `Microsoft Word` 和 `Excel`，如果报告是以 `.doc` 或 `.xls` 文件创建的。\n• 用于打开 `pdf`（便携式文档格式）文件的\
  \ `Adobe Reader`。`Adobe Reader` 可以无需许可费用下载安装。互联网上有大量的 `pdf` 文档，很可能你的所有潜在用户已经在其工作站上安装了该软件。\n\
  • 如果应用程序创建了用户需要访问 `HTML`（超文本标记语言）文档，这不应该带来任何问题。互联网浏览器通常读取 `HTML` 文档，几乎可以肯定你所有的用户工作站都已经安装了\
  \ `Internet Explorer` 或 `Firefox` 等互联网浏览器。\n\n### 9.2.4 VPN 软件\n\n如果用户在计算机未连接组织网络时需要访问应用程序，你就希望他们的连接尽可能安全。保护这些连接的一种方法是使用\
  \ `VPN`（虚拟专用网络）软件来建立连接。\n\n如果你的用户已经在远程连接访问其他应用程序，那么很有可能 `VPN` 软件已经加载到他们的计算机中了。如果不是如此，你将不得不向他们解释什么是\
  \ `VPN` 以及为什么他们需要它来远程连接网络。关于 `VPN` 软件的详细解释包含在第 15 章中。\n\n组织可能推荐使用的 `VPN` 软件潜在类型包括：\n\
  \n• `Cisco VPN Client`\n• `CyberGhost Premium VPN`\n• `Juniper VPN`\n• `OpenVPN`\n\
  • `StrongVPN`\n• `VPN4ALL Basic`\n\n# 第 10 章 更新与补丁\n\n## 摘要\n\n每个应用程序最终都需要更新或打补丁。本章描述了从供应商接收更新并将其应用于应用程序的过程。应用程序服务器上的支持软件也需要定期更新。更新可以分为大版本发布、小版本发布、中间修复和仅数据更新。更新过程中的步骤包括阅读发布说明和安装指南、备份系统、制定项目计划和恢复计划、应用升级，然后测试系统。\n\
  \n### 关键汇\n\n更新；补丁；维护协议；累积补丁；大版本发布；小版本发布；中间修复；发布说明；安装指南；恢复计划；数据核对；手动补丁；向导；维护周末；测试；UAT；回归\n\
  \n一旦你完成了应用程序的安装，你可能认为可以放松并享受生活了。我不想打破你的幻想，但这种情况并不会发生。很快，就会有更新需要应用到你那闪新的新应用程序上。所以请保持警惕，随时准备好迎接意外到达的更新。在应用程序的生命周期内，你进行的升级次数无疑多于安装次数，因此请对此做好准备。\n\
  \n你与应用程序供应商的许可或维护计划是否有权获得他们所有的更新？这个问题的答案似乎是显而易见的“是”，但许可并不总是包含无限更新。例如，你可能会获得小版本发布，但不会获得大版本发布。在做出假设之前，请向供应商核实或查看你的许可协议，以绝对确定你有权获得哪些更新。\n\
  \n## 10.1 哪些需要更新？\n\n你会对运行你应用程序的服务器上需要进行多少次更新感到惊讶。另一个更大的惊喜是，你的服务器上最终需要更新的软件种类之多。\n\
  \n### 10.1.1 应用程序\n\n对于一个初级应用程序管理员来说，你可能对为什么有必要更新感到好奇。毕竟，似乎就在昨天你才安装了应用程序，现在供应商就告诉你它需要更新了？发布更新的一些原因包括：\n\
  \n• 修复你或其他软件其他用户发现并报告的问题。如今的应用程序变得越来越复杂，因此用户不可避免地遇到错误是可以理解的。\n• 通过实施改进的技术来提高应用程序的性能。对于用户来说，应用程序运行永远不够快，因此供应商总是在寻找让它们运行更快的方法。\n\
  • 添加你或其他客户请求的功能。无论应用程序做什么，总有人会希望它能做得更多。当增强请求被提交给供应商时，其中一些会被实现并在更新中返回给你。\n• 紧跟上政府对商业和工业所施加的法律法规的变化。某些行业比其他行业更容易受到这些负担的影响。例如，如果你支持的应用程序与医疗保健、金融、保险或\
  \ SOX 合规性有关，那么你可能对法规的变化及其对应用程序的影响非常熟悉。\n\n### 10.1.1.1 这种更新真的必要吗？\n\n不是开玩笑，而是这种更新真的必要吗？如果你可以避免安装更新，那么你应该这样做吗？在就是否安装更新做出做出明智决定之前，需要问几个问题。这些问题是：\n\
  \n1. 在阅读了随补丁或升级一起的 `Release Notes`（发布说明）后，修复或增强内容是否显然适用于你，或者是你想要或需要的？每次更新都针对某一个特定的问题列表。这些特定问题可能并不适用于你的组织。正在修复的问题可能在你未购买的应用程序模块中，或者可能位于你未使用的功能中。如果修复对你没有帮助，你可以选择不应用。应用程序的业务所有者通常会在你的建议下做出此决定。\n\
  2. 法律或法规要求你应用此更新吗？如果是这样，你就需要应用更新并处理完毕。\n3. 如果此更新影响应用程序的安全，那么就应该安装。如果供应商发布了安全补丁来修复漏洞，那么坏人也知道。如果你不应用所有的安全更新，那么当你的应用程序受到入侵时，你只能怪自己。\n\
  4. 供应商发布的更新是累积的吗？这个主题在 10.2.5 节中有更详细的讨论，但简单来说，累积更新包含了之前更新中包含的所有修复。如果更新是累积的，那么你不一定要安装每一次更新，因为当你安装下一次更新时，它将包含当前更新的所有内容。如果它们不是累积的，那么你很可能想要安装每一个发布的补丁。\n\
  \n如果你在审阅了 `Release Notes`、适用法律以及供应商补丁的累积性质后，你可能决定不安装此更新。如果应用程序的业务所有者同意这一决定，那么你就可以等到下一个补丁的发布了。\n\
  \n\n\n\n\n在决定是否应用更新时，你需要考虑供应商对于客户保持在软件最新版本的立场。某些供应商在这一问题上采取了更强硬的态度。如果你使用的不是当前版本，或者非常接近当前版本，那么在你升级到最新版本之前，他们可能不会提供太多支持。他们的理由是，你报告的问题可能已经通过你尚未安装的更新被修复了。并不是所有供应商都是如此，但你需要了解你的供应商所持的立场。\n\
  \n### 10.1.2 支持软件\n\n更新和补丁并不不仅仅来自你的应用程序供应商。运行在你的服务器上的任何软件都是潜在的升级候选对象。作为应用程序管理员，你不需要负责所有这些更新，但你应该对它们保持警惕。需要更新的潜在软件包括：\n\
  \n- 客户端的操作系统\n- 客户端的 `BIOS`（基本输入/输出系统）\n- `NIC` 网卡\n- 数据库服务器\n- 数据库驱动程序\n- `DLLs`（动态链接库）和\
  \ `OCXs`（OLE 扩展）\n- 报表引擎\n- 电子邮件子系统\n- `SAN` 软件和/或硬件\n- 支持你 `VM` 环境的软件\n- 你的域名服务器\n\
  \n这些升级中的每一个将如何影响你的应用程序？对于支持你应用程序的软件进行的任何更新，你需要提出一些探测性问题。以下是需要回答的问题示例：\n\n- 补丁受影响的软件会导致你应用程序使用的服务器或功能中断吗？\n\
  - 在补丁修复支持软件期间，你的应用程序需要停止吗？\n- 补丁支持软件是否需要停止并重启服务器或应用程序（即重启/bounce）？\n- 更新需要多长时间？你应该始终对供应商提供的预计时间持非常怀疑的态度。更新所需的时间通常比供应商所说的要长。\n\
  - 如果更新出现问题，将如何影响你的应用程序？\n- 如果更新出现问题，恢复需要多长时间？\n- 什么时候可以对支持软件打补丁？例如，在正常工作时间内？在晚上？在与用户社区协商好的停机维护窗口内？\n\
  - 该补丁是否已在其他环境或服务器上安装？如果是，是在哪里、何时以及如何安装的？\n- 该更新已发布多久了？是否有足够的把握认为该更新是稳定的，不会对应用程序产生任何负面影响？如果补丁与安全有关，那么你可能需要尽快安装它。\n\
  \n## 10.1.3 硬件\n\n令人惊讶的是，可能甚至还需要对你的环境应用硬件更新。通常，硬件更新被称为“固件更新”。关于固件更新需要问的问题与支持软件更新的问题相同，其中最核心的问题是“这将如何影响我的应用程序？”\n\
  \n## 10.1.4 用户桌面电脑\n\n更新也会发生在用户的桌面电脑上。你可能不需要负责升级他们的软件，但用户桌面上进行的更改可能会影响他们访问或使用你所支持的应用程序的能力。\n\
  \n你可能不认为这是你的问题，但即使你不是造成的或并不知情，它依然是。如果用户无法访问你的应用程序，或者它在更新后的运行方式与以前不同，他们的最初反应将归咎于应用程序。你必须向他们证明应用程序没有错。这可能是一个很难说服他们，特别是如果应用程序在过去确实有过错。\n\
  \n用户桌面上可能发生的更改示例包括：\n\n- 给用户发放了新的 PC 或笔记本电脑\n- 在用户的电脑中安装了新的硬硬盘\n- 他们的电脑崩溃了，文件从备份中恢复了\n\
  - 安装了新的桌面操作系统\n- 安装了操作系统补丁\n- 安装了新的或升级后的 Internet 浏览器\n- 升级了 Office 类软件，例如文字处理器、电子表格等\n\
  - 工具软件（如防病毒软件病毒库）的更新\n\n这就是与组织的桌面软件团队保持良好关系的另一个原因。如果用户报告了问题，联系桌面支持团队的某人询问他们最近该用户的\
  \ PC 是否进行过任何更改，将非常方便且高效。\n\n## 10.2 更新和补丁的类型\n\n更新和补丁并不完全相同。某些更新为应用程序引入了大量新软件，而另一些则旨在修复软件中的一个或多个漏洞。你能够根据发布版本相关的数字相当容易地区分这些类型的发布。虽然每个供应商都有自己的命名标准，但通常，数字和点号越多的发布等于较低层级的发布。\n\
  \n通常，发布可以分为三类。接下来的章节将解释命名格式及其包含的内容。\n\n### 10.2.1 发布类型\n\n- 大版本发布（Major Releases），也称为更新发布，例如\
  \ `2.0`、`2.1` 和 `3.0`\n- 小版本发布（Minor Releases），也称为修复包（Fix Packs），例如 `2.0.1`\n- 中期修复（Interim\
  \ Fixes，有时称为热补丁 hotfixes），例如 `2.0.1.1`，是为了解决客户遇到的特定问题而创建的。中期修复仅发布给遇到相同特定问题的客户。如果你不向供应商报告相关问题，你就不会获得该中期修复。\n\
  - 仅数据更新（Data only updates）仅包含新数据，例如更新后的税率。\n\n### 10.2.2 每种类型发布包含的内容\n\n- 大版本发布通常包含应用程序的重大新功能。在某些发布版本中，应用程序的基础结构可能被重写。大版本发布还包含了之前补丁的所有修复。例如，`2.1`\
  \ 包含了小版本修复 `2.0.1` 的所有更改。\n- 小版本包含的更改少于大版本。它可能包含新功能以及修复，但不会像大版本那样包含应用程序的重构。小版本通常包含自上次大版本或小版本发布以来的所有中期修复。例如，`2.0.1`\
  \ 包含了 `2.0.0.1`。\n- 中期修复是为了解决特定问题而创建的。它们通常包含之前的中期修复。例如，`2.0.0.2` 包含了 `2.0.0.1.1`\
  \ 和 `2.0.0.1.2`。\n- 上述规则存在例外。如果一个大版本发布即将发布且需要创建一个中期修复，那么它可能不会包含在大版本发布中。例如，如果 `2.1`\
  \ 将要发布且创建了中期修复 `2.0.1.5`，它可能不会包含在 `2.1` 中。\n\n另一个使用的术语是服务包，简称 `SP`，是在单个发布中交付的更改集合。并不是所有供应商都有服务包。参考上述类型，服务包大致等同于小版本发布。\n\
  \n### 10.2.3 你如何知道发布中包含什么\n\n每次发布通常都会附带发布说明（Release Notes）文档和/或安装指南。发布说明对此补丁或修复中包含的更改进行了描述。更改可能会根据供应商在开启客户请求时分配的工号进行分类。如果你跟踪了向供应商提交的所有问题工单，这可能是快速判断你报告的一些问题是否已在该发布中得到解决的快捷方法。\n\
  \n\n\n\n《安装指南》提供了在您的系统上安装升级或补丁所需的步骤详细说明。工作量在主版本发布（Major Release）和间期修复（Interim Fix）之间之间可能会有显著差异。主版本发布可能需要下载、解压并将大量文件移动到指定的子目录。而间期修复可能仅需将一个单独的文件（例如\
  \ `.jar` 文件）移动到到位即可。\n\n您的首要任务之一应该是阅读这两份文档。业务所有者也需要阅读《发布说明》（Release Notes）。他们需要了解发布版本中包含哪些内容，以便对是否需要安装做出明智的决策。如果当前运行的应用程序没有出现该发布版本要解决的任何问题，那么业务所有者可能会选择不花时间、精力和承担风险去安装它。\n\
  \n## 10.2.4 发布计划\n\n您的供应商多久发布一次每种类型的版本？这取决于具体的供应商。有些供应商尝试定期发布版本，例如每年发布一次主版本发布，全年发布三次小版本发布。由于间期版本发布（Interim\
  \ Releases）是由特定问题驱动的，因此它们不那么受计划驱动。\n\n您的供应商可能不会按照上述描述安排发布。他们可能仅在开发出后发布补丁和修复。您应该与供应商的支持小组联系，以获取发布计划的思路。虽然未来的发布可能会偏离预期计划，但只要了解预期的计划，就能帮助您更好地规划投入到此应用程序补丁和修复的时间与资源。\n\
  \n## 10.2.5 更新是累积的吗？\n\n了解供应商的补丁是否是累积的关重要。在更新的世界里，累积是好事！为什么知道这一点如此关键？因为如果供应商发布的补丁不是累积的，那么您实际上被强制在每个补丁发布时都安装它。如果您现在没有应用某个补丁，那么在安装下一个补丁之前必须应用它。如果发布版本是累积的，那么您将更大的灵活性来选择想要应用哪些升级以及何时应用。\n\
  \n如何得知这一点？询问供应商的支持台。他们可能无法回答每一个未来的版本，但至少可以告诉您过去和即将发布的版本是否是累积的。\n\n## 10.2.6 仅数据更新？\n\
  \n某些应用程序需要定期更新数据。例如，如果应用程序用于计算销售税，那么它需要知道每个州、每个县、每个市、每个城镇以及该国其他每个纳税实体的税率。这些独立实体的税率经常变化。新税率需要在生效前就绪可用。\n\
  \n如何定期更新这些数据？一种解决方案是让公司每月下载一次“仅数据”更新。这种发布通常只更新数据库中的表。它不会修改应用程序的任何软件。\n\n提早预警，即使进行的是仅数据更新，您仍然需要遵循标准协议。这意味着需要遵循以下步骤（或类似的步骤）：\n\
  \n1. 与用户协调更新非生产环境的时间，例如 `TEST` 或 `QA`。\n2. 在修改数据之前，备份目标环境的数据库。\n3. 将仅数据更新应用到数据库。\n\
  4. 在 `TEST` 或 `QA` 环境中运行用户验收测试（UAT）。\n5. 如果 UAT 成功，则对生产环境（Production）重复步骤 1-3。\n\
  \n## 10.2.7 第一个版本的魔咒\n\n许多管理员极度不愿意甚至拒绝升级到主版本升级的第一个版本。他们坚持要等到 `.1` 版本可用。这样做的原因是，一些\
  \ IT 专业人员认为供应商发布带有 Bug 的代码，并期望客户识别出其中的错误并报告。随后，`.1` 版本会被整合以修复 `.0` 版本中存在的问题。\n\n\
  一种解决方案是问自己是否可以等到第一个 `.1` 更新发布。另一个可能的解决方案是在您的非生产环境中广泛测试 `.0` 版本。\n\n## 10.3 谁来执行更新？\n\
  \n显而易见，更新不会自动完成安装。必须有人执行更新。是谁呢？在很大程度上，这取决于被更新的软件以及组织的结构。\n\n### 10.3.1 我、我自己和自我\n\
  \n在大多数情况下，您作为应用程序管理员将执行更新。您需要在这项工作工作方面变得尽可能熟练，因为这项活动对您来说将是一项常见的任务。如果您对应用程序还比较陌生，那么在第一次或两次更新时想要得到供应商技术人员的指导指导也是可以理解的。但很快，您就需要自己应用更新了。\n\
  \n如果更新说明没有像文档的那样起，不要犹豫让供应商参与。在检查确认您没有犯任何错误后，向供应商提交工单（ticket），解释您正在做什么以及出了什么问题。如果在事情显然已经出错后仍继续埋头苦干，对您自己或您的组织都没有帮助。\n\
  \n### 10.3.2 让供应商参与\n\n让供应商技术人员与您合作处理前一两次更新并没有问题。之后，您需要自己应用更新。自己执行更新的某些原因包括：\n\n\
  * 大多数人通过实践比通过观察中学得多。\n* 供应商人员在您想执行更新时可能并不可用。\n* 根据您与供应商的服务合同，您的组织可能需要为这些付费。\n\n\
  ### 10.3.3 组织中的其他 IT 专业人员\n\n幸运的是，您不需要负责上述所有的更改。如果您的组织有 IT 部门，工作负载将分配给不同的专业人员。例如：\n\
  \n*操作系统更新由系统管理员应用\n* 数据库更新由数据库管理员应用\n* 网络软件由网络管理员处理\n* 互联网和办公类软件由桌面软件管理员处理\n* 如果组织有安全团队，他们将处理杀病毒软件和防火墙的更新\n\
  \n## 10.4 更新如何分发\n\n一旦更新可用，供应商如何将其分发给所有客户？这因供应商而异。下面描述了一些常见的分发方法。\n\n### 10.4.1\
  \ 公告更新和补丁\n\n发布更新和补丁的第一步是让客户知道它们可用。主要的办法是通过电子邮件。大多数供应商要求所有客户提供应用程序管理员和/或业务所有者的联系方式。通过向他们提供您的电子邮件地址，当他们宣布更新或补丁可用时，就能向您发送电子邮件。\n\
  \n公告邮件通常包含对包含包含的修复问题的简要描述。如果应用程序的业务所有者没有收到相同的通知，您需要尽快告知他们。他们将决定是否让您加载此更新。您越早告诉他们，他们就越早知道是否需要开始为此做计划。\n\
  \n### 10.4.2 分发\n\n\n\n\n供应商有多种方式分发更新和补丁的软件文件。这里列出了一些常见的方法：\n\n- 他们通过邮寄发送 `CD` 或\
  \ `DVD`。与其他方法相比，这种方法有明显的缺点。主要是它的成本更高，而且比电子传输传输文件要慢得多。我的印象是，现在已经没有很多供应商不再提供这种选项了。\n\
  - 通过他们的 `ftp` 站点。这种方法快速、方便且相对安全。供应商会为你提供 `ftp` 站点的 `URL`、登录 ID 和密码。使用这些详情，你可以连接到他们的\
  \ `ftp` 站点并将软件下载到本地驱动器。\n- 通过他们的网站。如果需要下载的文件较小，供应商可能会在他们的网站上提供这些文件。使用 Internet 浏览器从他们的网站将文件下载到你的本地驱动器。\n\
  \n## 10.4.2.1 你到底在下载什么\n\n如果你正在下载大量的软件，其格式可能与你只下载一两个文件时不同。在某些情况下，你下载的不是独立文件的集合，而是一个\
  \ DVD 镜像。如果是这种情况，文件扩展名可能是 `.ISO`。\n\n如果你的服务器无法处理 `ISO` 文件，那么你必须下载一个能够处理 `ISO` 的实用程序或驱动程序。可以下载处理\
  \ `ISO` 文件的实用程序有：\n\n- `Undisker`\n- Microsoft 的 `Virtual CD-ROM Control Panel for\
  \ Windows XP`\n- `IsoBuster`\n- `Daemon Tools Lite`\n- `Mount ISO Files Virtually`\n\
  - `Virtual CloneDrive`\n\n如果你从未处理过 ISO 文件，有一些你需要了解的基础知识。ISO 文件是 DVD 的镜像，因此你不能像访问普通驱动器那样访问它。第一步是使用该实用程序将其挂载。图\
  \ 10.1 到 10.3 显示了如何使用名为 `Virtual CloneDrive` 的实用程序进行此操作。第一步（见图 10.1）是选择 `Virtual\
  \ CloneDrive` 的挂载选项。\n\n![image](img/F000108f10-01-9780123985453.jpg)\n\n图 10.1\
  \ 使用 `Virtual CloneDrive` 挂载 ISO 文件。\n\n![image](img/F000108f10-02-9780123985453.jpg)\n\
  \n图 10.2 选择要挂载的 ISO 文件。\n\n![image](img/F000108f10-03-9780123985453.jpg)\n\n图 10.3\
  \ 访问 ISO 内部的文件。\n\n第二步是使用浏览选项选择要挂载的 ISO 文件。图 10.2 是显示如何进行此操作的截图。\n\n一旦用 `Virtual\
  \ CloneDrive` 挂载了 ISO 文件，就可以像访问任何其他驱动器一样访问它。图 10.3 显示 ISO 文件在 Windows 文件资源管理器中看起来像一个典型的驱动器。当你完成对\
  \ ISO 文件的操作后，可以右键点击该驱动器并选择 `Virtual CloneDrive | Unmount` 来卸载它。\n\n## 10.4.3 下载注意事项\n\
  \n在下载更新或补丁时，需要采取的一项措施是绝对确定你获取的是正确的文件集。供应商可能支持许多操作系统、版本和语言。你需要确保选择了正确的发布文件集。如果你获取了错误的文件，我可以向你更新或补丁将无法成功。可能会根据以下因素有不同的选择：\n\
  \n- 平台，例如 PC、服务器、主机等。\n- 操作系统，例如 Unix、Linux、Windows 2003、Windows 2008\n- 操作系统的位宽，例如\
  \ 32 位或 64 位\n- 语言，例如英语、法语、西班牙语等。\n- 要下载的文件类型，例如 `zip` 或 `tar`\n- 下载类型，例如 `ftp`\
  \ 或 `http` 传输\n\n另一条建议是在你开始升级之前先下载文件并将其移动到目标服务器。在很多情况下，你将处理的文件非常大。大文件下载需要很长时间。此外，大文件在下载过程中似乎比小文件更容易出现问题。你可以通过提前下载所需文件并将其放置在目标服务器（`TEST`、`DEV`\
  \ 和 `Production`）上来避免这两个陷阱。\n\n如果你将与供应商技术人员合作处理更新或补丁，这条建议就尤为有价值。你不希望在下载发布文件时让他们等待。在不变得重复的情况下，你能和他们聊的闲话是有限的。\n\
  \n## 10.5 升级方法\n\n作为应用程序管理员，你可能执行的升级比安装多得多，因此你需要精通此道。通常情况下，升级和补丁比安装更容易应用，但如果你打算应用它们，仍然需要一种严谨的方法。\n\
  \n### 10.5.1 阅读发布说明和安装指南\n\n尽快阅读发布说明和安装指南。它们可能会警告你想要避免的升级陷阱。一些潜在问题的示例包括：\n\n1. 新版本不再支持你的服务器运行的操作系统。\n\
  2. 新版本不再支持你正在使用的数据库系统或其版本。\n3. 新版本涉及数据库结构的重大更改。\n4. 新版本比你需要的更多的磁盘空间、内存或更强大的 CPU。\n\
  5. 新版本不再支持大多数用户桌面面上使用的操作系统。\n6. 新版本不再支持浏览器。\n\n再次阅读发布说明和安装指南。在第二次阅读时，尝试回答以下问题。如果你无法回答，可能需要联系供应商的支持团队获取答案：\n\
  \n- 升级会影响你组织实施的任何定制吗？\n- 升级会影响你的数据库吗？\n- 升级会影响用户设置的菜单设计等吗？\n- 升级会改变用户访问功能的方式吗？\n\
  \n### 10.5.2 为升级编写项目计划\n\n为新安装编写项目计划的所有理由和依据同样升级。实际上，编写升级项目计划通常比编写安装计划更容易。原因是升级通常不那么复杂，不需要安装支持软件，涉及的人员也较少。\n\
  \n升级项目计划确实需要一些安装的步骤。这些额外步骤在此列出，并在后续章节中详细解释：\n\n1. 升级失败时的恢复步骤\n2. 备份\n3. 与用户社区协调\n\
  4. 证明数据未受负面影响的数据对账\n\n\n\n\n在进行升级时，情况完全反转了。现在存在一个用户正在依赖的系统。如果更新失败导致系统无法使用，他们将无法使用系统来完成工作。至少起码，你给他们造成了不便，而且很可能会引发指责。\n\
  \n拥有恢复计划可以帮助你避免这种情况。恢复计划在需要时，其目的是让你恢复到存在一个可运行系统的状态。这里列出了一些可能的恢复计划：\n\n- 如果你的服务器是虚拟机（例如\
  \ `VMWare`），那么请为它创建一个快照。如果更新过程失败，请请求从快照恢复你的虚拟机。理想情况下，这应该让你回到安装更新之前的确切状态。这里有一个建议——一旦对了更新后的系统通过了测试和验证，就可以通知虚拟机团队可以删除快照了。快照\
  \ `snapshots` 会占用大量的磁盘空间，他们希望尽快将其删除。\n- 如果你的环境有多个服务器（即部署了集群或负载均衡），那么请逐个更新它们。其思路是先更新一台服务器，并确认应用程序运行正常，然后再更新下一台服务器。通过这样做，即使更新出现问题，你仍然有一个可用的系统。你可能没有所有的服务器都在运行，但至少系统是可以工作的。拥有一个工作的系统可以为你赢得一些时间来找出更新未成功的原因并进行修正。\n\
  - 让系统管理员对服务器硬盘进行克隆。克隆磁盘涉及创建其的一个精确副本。如果更新不顺利，请请求他或她将克隆的内容复制到损坏的硬盘上。完成完成后，系统应该恢复到创建克隆时的状态。\n\
  - 备份所有内容！如果你确切知道应用程序软件加载的路径，你应该能够将它复制到安全位置。如果更新不顺利，你将使用复制的版本恢复原始文件和子目录。这种恢复计划的缺点是，它假设你确切知道应用程序使用的每个文件的位置。如果有几个文件隐藏在意料之外或未知的子目录中被损坏，那么这个恢复计划可能无法生效。\n\
  \n### 10.5.2.2 备份\n\n在安装任何升级之前，请务必进行完整备份，这包括数据库和源代码。大多数供应商提供的更新说明都建议这样做，但即使如果没有规定，也请尽管去做！我向你保证，在你作为应用程序管理员的职业生涯中某个时刻，你会需要这个备份。\n\
  \n在开始备份过程之前，确保用户已退出系统，并在升级过程完成之前将他们排除在系统之外。确保这一点的原因有两个：\n\n- 如果备份过程尝试备份的文件被用户锁定，某些备份过程将无法工作。\n\
  - 你不希望用户在备份完成后做出更改。这样如果更新失败且你回滚到备份文件，用户的更改将不会存在。\n\n### 10.5.2.3 与用户社区协调\n\n当你进行初始安装时，用户社区还没有使用该应用程序，因为它还不存在。但如果你正在进行更新，应用程序可能已经有了使用该系统的用户。他们可能依赖它来完成日常工作。如果你在不通知他们或不与他们协调的情况下关掉系统，那么你将不会是一个受欢迎的人。\n\
  \n你希望与用户社区合作，找到一个双方都方便的时间来完成更新。你不需要询问应用程序的每一个个体用户。你将与应用程序的业务所有者（Business Owner）协调这一维护窗口。然后由他或她通知其他用户有关即将到来的停机。\n\
  \n在很大程度上，用户社区的工作需求日历将决定你何时可以安装升级。例如，如果应用程序处理税收，你将不想在财年结束之前进行任何升级。如果你支持薪资应用程序，那么你不想在发放工资单之前进行更改。如果你不知道应用程序的“繁忙”时间，那么你需要尽快查明此点。\n\
  \n是否有请求停机的正式流程？是否有表单需要填写或有网页需要完成？如果没有此类流程，你可能想要建立一个流程。这将为你节省去向多个人询问何时应该安排停机的时间和困恼。\n\
  \n进行更改的首选日期和时间是什么时候？有些组织偏好在周中，而另一些组织则偏好周五下午或晚上。选择周五的理由是，如果出了问题，你整个整个周末可以在用户回到办公室之前恢复应用程序。选择周中的理由是，你可能需要联系帮助解决问题的每个人更有可能在办公室。我不愿意成为向你宣布坏消息的人，但如果你的组织偏于在常规工作时间之外执行更新，那么请做好至少花一些非工作时间登录系统的准备。\n\
  \n关于处理协调停机的几点建议：\n\n- 升级所需的时间从几分钟到几小时不等。当你告诉用户更新需要多长时间时，请务必保守一些。例如，假设如果一切顺利，你可以在一小时内完成更新，但如果发生问题，你就知道这需要\
  \ 2 小时。你会告诉用户需要 2 小时或 1 到 2 小时之间。不要告诉他们最佳情况下的时间窗口，因为情况并不总是那样顺利。\n- 在执行更新期间，尽一切限制用户访问应用程序。在某些情况下，有用户在程序中会导致问题或至少延迟进程。\n\
  - 如果约定的更新时间到了，但一个或多个用户没有按照约定退出，你有权限终止这些话吗？还是你必须与用户代表协调这一点？在协调更新时就对此达成协议。\n- 确保在更新完成且应用程序准备好测试时知道联系谁。你会希望那个人开始测试，以便应用程序能够尽快验证并发布给用户。\n\
  \n### 10.5.2.4 数据比对\n\n数据比对是一个向用户、更重要的是向审计人员证明应用程序数据没有受到更新过程意外影响的过程。在最简单的情况下，更新不会触及数据。在更完整的更新中，数据可能会通过以下方式受到影响：\n\
  \n- 在数据库中创建了表\n- 在现有表中添加了列\n- 在现有表中插入了行\n- 修改了现有数据库值\n\n你如何证明在更新过程中没有一个值被意外地添加、删除或修改？除了逐行、逐列比较之外，无法证明没有任何内容被意外更改。然而，你仍然可以采取一些步骤审查数据库，以帮助确保数据库的更改与发布说明一致。这需要你与数据库管理员（DBA）以及最终用户紧密合作。\n\
  \n你需要记住的不是比对计划是完美的，而是要与组织过去的做法一致，并为用户和审计人员提供安全感。这里建议了一些可能的比对计划：\n\n\n\n\n\n• 如果发布说明（Release\
  \ Notes）指出将向货币表中添加行，以反映 East Nowhereville 货币单位的变化，那么你可以运行更新前后的查询，以显示原始值和新值。在这个示例中，受影响的行数应该是最少的，可能只有一行，因此选择并显示这些行的查询是符合实际的。如果受影响的行数几千行，那么这种对账计划就不不可接受了。\n\
  \n• 如果发布说明说明此更新不会影响任何数据，那么你可以选择所有表名以及每个表的行数。在应用更新之前和之后运行此查询，并将这些信息导出到单独的电子表格中。在表格中包含公式来统计表数并求和行数，应该显示没有表或行被添加或删除。\n\
  \n• 如果发布说明指示将向特定表添加一列，那么你的对账计划可以在更新前和后导出该表。如果导出的值在两种情况下都是有序的，那么你就可以使用电子表格函数来比较，或至少对两组数据进行抽检，以确认大量的表数据没有丢失或修改。\n\
  \n### 10.5.3 熟能生巧\n\n计划按优先级顺序对你的环境进行升级。更新将最后应用于生产服务器（Production server）。例如，它可能会按以下顺序应用于环境：\n\
  \n• 开发环境（Development）\n• 测试环境（Test）\n• 准备环境或 QA（质量保证）\n• 生产环境（Production）\n\n如果在某个级别的更新过程和测试未成功，在成功之前，你不要进入到下一个级别。例如，如果在\
  \ `Development` 服务器上应用更新时不符合文档说明，则将 `Development` 服务器恢复到原始配置，弄清楚哪里出了问题，然后再次应用更新。\n\
  \n给自己留出充足的时间来升级。更新花费的时间比你预期的要长是很典型的，尤其是第一次执行时。一旦你做了一两次，速度就会快得多。\n\n对对每台服务器所做的更改进行详尽的记录。我个人会为每台服务器的每次更新创建一个\
  \ Word 文档。我会对我遇到的每个屏幕截图，并将它们粘贴到文档中。我还会记录必须输入的每个值和点击的每个按钮。这很耗时，但我实际上只需要在第一次创建时创建此文档，即当我更新\
  \ `DEV` 服务器时。当我对第二个服务器（例如 `QA`）执行更新时，该文档已经基本完成了。通常我只需要做的更改是微小的添加或纠正拼写错误。手头有这样一个文档会让更新应用于生产环境快得多，压力也小得多。\n\
  \n### 10.5.4 应用补丁\n\n根据我的经验，大多数补丁应用过程分为两种类型：手动补丁或基于向导的补丁。以下章节将详细描述它们。\n\n#### 10.5.4.1\
  \ 手动补丁\n\n如果补丁过程是手动的，那么安装指南（Installation Guide）将包含一组你需要遵循的相当详细指令。这些指令可能与以下类似：\n\n\
  1. 确保数据库和应用程序文件夹已备份\n2. 停止 Acme 应用程序\n3. 在 `\\Acme\\software\\servers` 中创建一个新文件夹，并以新版本命名，例如\
  \ `1.2.3`\n4. 从供应商的发布包将补丁 zip 安装文件复制到刚创建的文件夹中\n5. 在刚创建的文件夹中解压缩补丁文件\n6. 删除压缩的补丁文件\n\
  7. 删除 `\\Acme\\software\\servers\\current` 文件夹中的所有文件夹和文件\n8. 将 `\\Acme\\software\\\
  servers\\1.2.3` 中的所有文件夹和文件复制到 `\\Acme\\software\\servers\\current`\n9. 启动 Acme 应用程序\n\
  10. 应用程序启动完成后，打开日志文件并确认最近启动条目指定的版本具有正确的版本号，例如 `1.2.3`\n\n显然，这里的指令相当通俗且非常简单。实际的更新会有额外的步骤，但上述步骤对实际应用程序更新具有合理的代表性。你需要执行的步骤并不特别困难，但必须完全按照规定的顺序执行！\n\
  \n如果某个步骤没有成功，你必须在进入下一个步骤之前弄清楚如何纠正它。希望问题会自动消失是行不通的。听我的，我这样做过，而且从没用过。如果你无法确定哪里做错了，请立即停止并联系供应商的支持台寻求帮助。\n\
  \n#### 10.5.4.2 向导或其他可执行过程\n\n如果供应商提供了向导或其他可执行过程来执行升级，那么你所做的就是启动它，回答一些问题，并观察进度条在屏幕上移动。\n\
  \n通常为你显示的屏幕包括：\n\n1. 初始欢迎屏幕。\n2. 警告屏幕，警告你如果启动升级，应用程序将被停止。\n3. 要求你接受软件许可协议条款的屏幕。\n\
  4. 确认组织名称的屏幕。\n5. 安装类型屏幕，允许你在典型升级和自定义升级之间进行选择。完整安装更容易，但它会安装所有组件并占用更多磁盘空间。如果你想控制软件的安装位置，或者如果你不想安装所有组件，请选择自定义升级。\n\
  6. 登录屏幕，你在其中输入管理员账户的 ID 和密码。\n7. 带有进度条的屏幕，显示升级正在实际进行。\n8. 告知你更新已完成的屏幕。此屏幕可能会提供启动应用程序的。\n\
  \n在补丁过程或基于向导的过程之后，应该做的某件事是检查补丁过程创建的任何日志文件。这非常重要，因为很容易错过显示在屏幕上的信息。有时信息滚屏消失的速度比你阅读或理解的速度快得多。确保你知道供应商将日志写入什么位置，并在补丁完成后检查一次。\n\
  \n## 10.6 维护周末，又称补丁周末\n\n无论你喜不喜欢，主要供应商都会定期发布补丁。跟上这永无没了的补丁洪流会让你的组织极其忙碌。微软在每个月的第二个星期二发布安全补丁。Adobe\
  \ 是另一个同样在每月第二个星期二发布其安全更新（即补丁）的软件供应商。其他供应商发布补丁的时间表差异很大。有的供应商每 6 个月发布一次。另一个供应商每年发布六次补丁。\n\
  \n许多组织选择每月的特定一天在他们的生产系统上应用这些补丁。我工作过的一家组织在每月的第三个星期六应用补丁。这让他们在收到大多数供应商的补丁后有一周多半的时间将它们安装到测试系统中，并进行最小程度的测试，以确认补丁没有损坏操作系统、硬盘等。\n\
  \n当每月的第三个星期六到来时，所有的应用程序管理员都知道数据中心的工作将根据需要关闭服务器以应用补丁。由应用程序管理员负责对他们的每个应用程序执行以下操作：\n\
  \n• 通知业务所有者应用程序将在周六停机\n• 在补丁过程完成后，确认应用程序已恢复启动\n• 通知业务所有者应用程序已启动并可以进行测试。\n\n\n\n\n\
  \n更详细的有效性测试由应用程序业务负责人负责。在大多数月份里，补丁过程进行得非常顺利。只有在极少数情况下，每月补丁才会导致操作系统、支持软件或应用程序本身出现问题。\n\
  \n## 10.7 自动更新\n\n应用程序会自动向你的服务器下载更新吗？我曾支持过一个应用程序，它每当有人登录时都会检查供应商网站是否有更新。这种分发更新的方法有优点也有缺点。\n\
  \n自动更新具有以下优点：\n\n-   补丁应用非常频繁。由于应用频率高，它们往往更较小、更简单。对我来说，简单的补丁就是好的补丁。越复杂的补丁，越容易出现问题。\n\
  -   补丁发布与安装到你的系统之间的延迟明显缩短。这最大限度地减少了恶意行为利用未打补丁系统的机会。\n-   如果自动应用补丁，那么你就不会落后进度。\n\n\
  这种方法的缺点是：\n\n-   补丁是不预先通知的。如果是自动应用，你没有机会审查并决定在你的环境中是否需要这些更新。\n-   由于补丁是不预先通知的，你无法在更新下载并安装之前进行备份。\n\
  -   你没有机会在安装到 `PROD` 之前在 `DEV` 或 `QA` 系统上进行测试。先登录哪个环境，补丁就会加载到哪个环境。\n-   你不会收到加载补丁的确认提示。如果你开启了自动模式，那么当有人登录应用程序时，任何可用的补丁都会下载。应用程序管理员可能根本不知道更新已经安装。被排除在流程之外可能会不方便，特别是当补丁最终导致问题时。\n\
  -   补丁可能会在非常不方便的时间安装。例如，在开具工资支票或关闭年度账目期间。如果补丁不起作用，往好了说这会变得极其不方便。\n\n如果你的应用程序供应商提供自动更新，而你需要在利用它之前对其充分了解。以下问题列表只是你应该向供应商询问的开始：\n\
  \n-   是否可以在业务日历中的特定时间开启或关闭自动更新？例如，在开具工资支票、结账或提交纳报表之前等期间。\n-   所有级别的更新（即主版本、次要版本和中间版本）都通过自动更新分发吗？还是说更重要的更新通过其他方式分发？\n\
  -   更新是否记录在某处？如果是，记录在哪里？记录的详细程度如何？\n-   是否有关于每个更新的文档可用？\n-   这些更新可以回滚吗？\n\n## 10.8\
  \ 测试软件更新\n\n人会犯错是生活中一个不幸的事实。尽管尽了最大努力，供应商在分发更新、补丁和应用程序新版本时，偶尔会引入错误。你需要意识到这一点，以保护你的组织免受这些潜在问题的影响。\n\
  \n你必须做的一些与测试相关的决策包括以下：\n\n-   升级后进行多少测试？通常情况下，测试越多比越少好。\n-   由谁执行？让用户代表测试应用程序的大部分功能是重要的，他们是最熟悉应用程序、知道它应该做什么以及它是如何工作的人。应用程序管理员应该测试仅供他或她使用的功能。\n\
  -   什么时候进行？越快越好，至少有两个原因。第一，如果应用程序中引入了问题，你希望尽快知道。其次，`DEV` 和 `QA` 环境测试得越早，补丁就能越早应用到下一个更高级别，最终应用到生产环境。\n\
  -   由谁批准结果？最终批准者必须是应用程序的业务负责人。\n-   如何记录测试和结果？创建一个包含每个测试描述、预期结果、观察到的结果以及通过/失败值的电子表格，是记录测试和结果的一种高效方法。\n\
  \n供应商的错误至少以两种形式出现。你的测试需要处理可能引入的两种类型的错误：\n\n-   预期的修复或增强功能没有按预期工作。\n-   更新破坏了应用程序中之前运行良好的其他部分。\n\
  \n防止在生产系统上引入这些错误的最佳防御，是在将所有新软件安装在非生产环境中，并在安装到生产环境之前对其进行彻底测试。你的测试需要处理可能引入的两种类型的错误。第一种测试被称为\
  \ `UAT` —— 即用户验收测试。第二种形式的测试被称为回归测试。\n\n### 10.8.1 UAT——用户验收测试\n\n首先，你必须测试更改是否符合预期。随更新一起发布的发行说明将列出应用程序哪些部分发生了更改。`UAT`\
  \ 应该测试每个更改的区域。\n\n### 10.8.2 回归测试\n\n需要进行的第二种测试是确认更改是否给应用程序引入了错误。这种测试被称为回归测试，是两者中更困难、更耗时的。理想情况下，回归测试应该确认每个屏幕、每个路径、每个数据输入机会、每份报告等都得到了测试。对于大型、复杂的应用程序，这并不实际。你必须在现实主义和理想主义之间平衡，以创建你的回归测试。\n\
  \n回归测试绝对需要覆盖的一个区域是对应用程序所做的任何自定义更改。已知供应商的更新会覆盖或删除已实施的增强或自定义。在每次更新后进行的测试必须验证你的自定义内容仍然存在。这需要在第一次升级后进行，即升级到你的\
  \ `DEV`、`TEST` 或 `QA` 环境后。不要等到生产环境更新后才做这一点。如果测试做得不早、不彻底，那么当以前的功能消失时，你可能会面临非常糟糕的意外。\n\
  \n第 11 章\n\n# 支持你的应用程序\n\n## 摘要\n\n支持应用程序是应用程序管理员工作的关键部分。服务水平协议（SLA）是描述用户对应用程序的协议。支持需要对服务器的远程访问、支持人员以及备份。\n\
  \n### 关键词\n\n支持；SLA；支持人员；维护窗口；`24 × 7` 运营；支持层级；知识库；响应时间；工单；远程访问；控制台模式；继任计划；备份\n\n\
  ## 11.1 什么是支持角色？\n\n应用程序支持角色（包括应用程序管理员）的目的是在应用程序投入生产后提供日常责任。如果应用程序出现问题，支持人员将调查并纠正。如果应用程序需要更新，由支持人员执行更新。理想情况下，只有应用程序支持团队会接触应用程序。\n\
  \n如果应用程序是专门为该组织创建的，那么应用程序管理员可以参与设计规范的审查。无论应用程序是内部开发还是外部开发，都是如此。\n\n\n\n\n应用程序的安装也是支持团队发挥主作用的领域。无论应用程序是定制开发的还是现成的，支持团队都会参与其中。其中一个较重要的原因是，这为支持团队提供了一个大量的实践机会，使其极极其熟悉应用程序。\n\
  \n支持角色与软件开发岗位有显著不同。解释这种差异的一种方法是：开发者构建应用程序，而支持团队则确保它在交付和安装后能够继续运行。如果应用程序出现问题，支持团队将与开发人员合作收集问题信息，但开发小组将是实际编写或修改代码解决问题的人。随后，支持团队会将更改移至\
  \ `QA` 和 `Production` 环境并进行测试，以确认修复是否解决了问题。\n\n如果你来自开发背景，你可能需要克制自己想要更改的本能。起初，你可能认为支持工作没有开发工作那样有成就感或回报，但你很快就会消除这种误解。这两份工作都是必不可少的，以确保业务用户能够继续使用让他们提高生产效率的软件。\n\
  \n## 11.2 SLA（服务水平协议）\n\nSLA 是支持小组与用户团队之间的一种协议，描述了用户对应用程序的预期。以下是 SLA 中可能包含的内容示例：\n\
  \n• 应用程序何时停机维护。许多应用程序有每周或每月的维护窗口，在此期间进行维护或备份。某些应用程序无法接受任何计划内的停机时间。如果你的应用程序是这种情况，那没问题，但所有人都需要提前理解并同意。\n\
  \n• 支持团队提供的日期和时间，例如，周一至周五，中部时间上午 8 点至下午 5 点。\n\n• 在高用量日历期间（例如纳税季节）是否存在延长支持时间，这些时间将予以说明。\n\
  \n• 不提供支持的假期。\n\n• 工单开启后支持团队响应的速度有多快。例如，如果开启了一个高优先级工单，且该工单是在正常工作时间内开启的，支持团队将在 30\
  \ 分钟内开始处理。对于低优先级工单，要求可能是在 8 个工作小时内处理。\n\n• 问题发生后应用程序多快恢复运行。\n\n• 多久创建一次备份，以及备份保留多久。\n\
  \n• 如果需要，从数据库备份恢复所需的最长时间。\n\n• 将发生的非计划停机时间的最长，例如，除计划维护时间外，应用程序的运行时间为 99%。\n\n• 正常工作时间段及之外与支持团队通信的联系方式。\n\
  \n• 应用程序的响应时间将不超过指定的阈值。\n\n• 概述提交软件修改请求的流程。\n\n• 在应用程序服务器上更新软件的过程将遵循 SLA 中指定的变更管理程序。\n\
  \n• 支持团队和用户组审查来自供应商的软件升级的流程，以决定安装哪些版本以及何时安装。\n\n• 任何已同意的监控指标。例如，服务器 CPU% 空闲时间、磁盘\
  \ I/O 时间等。\n\n在 SLA 中包含响应时间指标会很难进行衡量和执行。这是因为许多组件不在应用程序支持团队的控制范围内。组织的局域网（`LAN`）不在应用程序支持团队的控制范围内。如果网络大幅缓慢或完全关闭，那么应用程序几乎无法满足响应时间指标。虽然应用程序支持团队无疑会网络小组合作，但他们对网络或支持该网络的团队没有控制权。\n\
  \n每个组织都会有针对其需求的 SLA 条款。例如，如果应用程序是 24 × 7 全天使用的，那么支持可用性就不能限制在上午 9 点到下午 5 点。如果用户群遍布全球，那么支持团队可能需要精通多种语言的人员。具体提供多少种语言的支持应在\
  \ SLA 中定义。\n\nSLA 的第一个版本不太可能是完美的。会出现 SLA 中未涵盖的情况，需要将其包含进来。必须定义修订 SLA 的流程。如果没有涵盖这一点，修订\
  \ SLA 将是一场持续的战斗。\n\nSLA 的正式版本存储在哪里？它会存储在网上吗？还是说官方副本是文档的纸质版？\n\n### 11.2.1 SLA 指标必须可行\n\
  \nSLA 中的指标或要求必须是可实现的。应用程序可用性达到 99.9999% 的要求不能在不考虑实现它所需基础设施的情况下被强制规定。例如：\n\n• 服务器几乎必须位于集群中。单个服务器无法现实地满足如此高的运行时间要求。\n\
  \n• 数据库和/或应用程序能够在不关机系统的情况下创建备份。如果系统必须关机才能备份，则无法满足可用性要求。\n\n• 服务器之外的所有硬件都必须是冗余的。例如，磁盘驱动器必须位于\
  \ `RAID` 阵列中，`NIC` 卡必须有备份，电源必须有备份，通信连接必须是冗余。\n\n• 人员，例如 `Application Administrator`（应用程序管理员），都必须有全职、专用的备份。\n\
  \n• 与供应商签订的指定 24 × 7 覆盖的支持合同。\n\n### 11.2.2 严格的 SLA 要求带来成本\n\n极高的运行时间要求或极快的响应时间会带来成本。如果应用程序的业务所有者想要非常高的\
  \ SLA 指标，他们必须为此付费。这些成本的示例包括：\n\n• 冗余硬件的成本\n\n• 与供应商签订的指定 24 × 7 可用的支持合同\n\n• 全职备份\
  \ `Application Administrator` 的额外人员成本\n\n• 高可用性软件，如操作系统和数据库引擎\n\n• 镜像 `Production`\
  \ 环境的 `QA` 环境\n\n## 11.3 支持人员\n\n有多少人支持此应用程序？全职员工（`FTE`）一词有时用于描述支持人员的数量。如果你的应用程序分配的人员少于两人，你可能需要重新考虑人员配置。让一个人支持一个\
  \ 24 × 7 运行的应用程序是不现实的。即使是只需要在正常工作时间（即 9 点到 5 点）提供支持的应用程序，由个人提供所需的水平支持也是困难的。人们需要休假、生病、处理家庭紧急情况、参加培训、旅行，并且偶尔需要睡觉。\n\
  \n### 11.3.1 优先级\n\n\n\n\n支持此应用程序对于支持团队成员来说是全职还是兼职职责？这是他们的最高优先级吗？还是他们还有其他更关键的应用程序需要支持？如果他们不是全职的，或者该应用程序不是他们的最高优先级，那么你可以确定，在应用程序发生故障的某个时刻，他们将无法提供支持。总会有时候，他们支持的两个应用程序都需要他们立即且完全的关注。当这种情况发生时，其中一个应用程序停机时间将比预期的要长。最好让每个人提前知道哪一个应用程序的优先级最高。大家是否对每个应用程序在优先级列表上的位置达成共识？\n\
  \n### 11.3.2 主管人员\n\n谁负责支持团队？具体来说，主管是在业务指挥链中，还是在 IT（信息技术）指挥链中？这非常重要，因为答案很可能会影响他们对工作方式的看法。具有深厚\
  \ IT 背景的人更有可能遵循软件行业的一贯做法。\n\n### 11.3.3 与支持团队沟通\n\n在非工作时间如何联系支持团队？他们是否有随时随身携带的 iPhone、黑莓手机、部门智能手机等？如今几乎每个人都有智能手机，所以这通常不是问题。问题在于确保所有这些号码都已发布，以便在需要时能联系上。当在下班后联系他们时，他们是否知道他们的要求？是否有轮班制的“值班”工程师表，以至于某一个人不会被凌晨\
  \ 3 点的电话淹没？\n\n如果有“值班电话”或呼机器，支持人员只需将它从下班的值班人员交接给上岗的支持人员即可。我非常生地记得丢掉部门呼机器的感觉，因为我知道自己很可能获得几天或几周不受打扰的深度睡眠。\n\
  \n如果每个人都有自己的手机，那么值班表需要发布在每个人都知道并可以访问的地方。也许可以将这些号码发布在部门网站、门户网站，或者交给 `Help Desk`（帮助台）工作人员。\n\
  \n如果事情没有按计划进行，你将面临像这里列出的这些问题。最好提前回答这些问题。没有人希望在凌晨 3:00 尝试去解决问题。\n\n- 如果值班支持人员不接电话、不回复短信或邮件怎么办？应该给他们打几次电话？\n\
  - 打电者在升级给更高级别的人员之前应该等多久？\n- 列表上的下一个应该致电的人是谁？\n- 列表上每个人的最佳联系电话是什么？\n\n对于支持团队来说，一个非常重要的问题是让每个人都明白什么时候该被叫过去。大多数支持团队成员都理解他们在非工作时间会接到电话。他们意识到这是工作描述的一部分。他们非常不理解的是，接到那些没有按照常规联系支持团队政策就直接联系支持的应用程序用户打来的电话。例如，如果我这周没有值班，而用户没有去查看哪个\
  \ `admin` 在值班，那么无论问题有多重要，我都不可能感激在凌晨 2 点接到电话。另一个例子是，如果重置密码的本应该拨给 `Support Desk`（支持台），该支持台是\
  \ 2×7 小时服务的，但用户却在凌晨 4 点拨给了某个 `admin`。这样的电话将是不受欢迎的。\n\n### 11.3.4 与用户社区沟通\n\n需要定义一个与用户社区沟通良好的通信链。`Application\
  \ Administrator`（应用程序管理员）需要定期与用户一起工作，因此最好是让他们知道自己应该和谁交流。应该澄清的一些情况示例包括：\n\n- 如果应用程序遇到问题，应该通知谁？\n\
  - 在正常工作时间内，谁可以批准停机应用程序？\n- 在非工作时间内，谁可以批准停机应用程序？\n- 如果这些人不在线或没有给予响应，他们的备选人员是谁？\n\
  - 应用程序恢复运行后，需要通知谁？\n- 谁可以授权恢复到备份？\n- 谁可以授权激活 `DR (灾难恢复)` 站点？\n\n## 11.4 异常时间\n\n\
  你提前需要知道的一点是，作为 `Application Administrator` 的生产支持角色并不是一份“9 到 5 点”类型的工作。会有某些时候一切进展顺利，你可以随心所欲离开。但也会某些时候，你进入办公室的时间比通常要早或晚得多。导致你需要在异常时间工作的原因示例可能包括：\n\
  \n- 为了与其他时区的用户互动。你将与来自国家其他地区甚至可能世界另一端的用户合作。某些时候，你必须早到或晚留以配合他们的工作安排。\n- 为了在用户没有使用应用程序的时段对系统进行更改。如果你的应用程序用户仅限于单个时区或国家，那么每天可能有一个时间窗口，让你可以关闭系统并进行更改而不影响用户。如果你的应用程序是跨国或全球性的，那么你可能只能在\
  \ `服务水平协议 (SLA)` 中定义的维护窗口期间关闭系统。\n- 为了监控或更改在非工作时间运行的进程。许多应用程序在非高峰时间运行进程以避免影响用户。这些进程的示例包括长报告、数据转储、数据导入、数据库完整性检查和备份。如果这些进程需要修改、测试或调试，那么这种支持活动很可能在非工作时间进行。\n\
  - 如果应用程序崩溃并需要立即恢复，那么你可能会接到电话、短信或电子邮件。如果该应用程序不是关键性的，且恢复运行可以等到第二天早晨，那么这种情况就不适用于你。\n\
  - 为了在服务器操作系统或支持软件更新或打补丁后测试应用程序。你的数据中心小组将决定何时为数据中心的所有服务器打补丁。对于大多数应用程序，这意味着应用程序需要停机以便服务器打补丁。一旦服务器完成补丁并重启，就可以重启应用程序。应用程序支持团队需要验证服务器和应用程序是否成功备份。更详细的应用程序测试将是用户团队责任。\n\
  - 因为你正在进行需要应用程序进入“单用户模式”的更改。许多应用程序的某些任务在只有一个用户登录时才能执行。为了满足这种需求，可以将应用程序设置为“管理模式”或“单用户模式”。如果在正常工作时间进行此操作，则所有其他用户都将被阻止使用系统。为了避免这种情况，需要单用户模式的干扰更改通常在非工作时间进行。\n\
  - 因为你需要运行一个会影响应用程序性能的进程。例如，执行批量插入的实用程序可能比手动向应用程序添加每一行快得多，但缺点是它会让系统变得极其缓慢。这种性质的进程需要在非工作时间执行。\n\
  \n\n\n\n\n- 因为你正在处理的任务在下午 5 点还没有完成。这会有某些时候，你正在处理的工作需要尽快完成。这意味着你不需要在到时下班，而是要一直努力工作，直到任务完成。\n\
  - 与供应商的支持技术人员进行交互。在很大程度上，你取决于这些技术人员的可用时间。当他们有空处理你的问题时，你也要确保自己有空。这些人员很可能在另一个国家，因此你可能需要调整工作时间来与他们配合。我支持的一个应用程序其主要支持中心位于英国。曾有一个绝对必须修复的问题。技术人员在\
  \ 11 月的第四个星期四有空。对于美国人来说，这一天被称为感恩节。对于英国公民来说，这只是一个星期四。我在感恩节当天早晨 6 点就坐在办公室里与他合作解决了该问题。\n\
  \n## 11.5 维护窗口\n\n大多数应用程序每周或每月都有一个特定的时间，用于停机系统进行备份、安装更新、运行需要专用服务器的测试、重启服务器等。这个时间并非每个月都用于这些目的，但如果系统确实停机，用户就不能抱怨他们不知道系统可能会停机。\n\
  \n你是否有一个定期的、定义的维护窗口，即用户社区知道系统将不可用的时间？这个窗口是否足够长，以便实际可行地完成工作？例如，如果系统每天晚上 7 点到 8 点为了备份而停机，但备份过程需要两个小时，那么你的维护窗口就是不现实的。\n\
  \n在维护窗口期间，用户是否被锁定在应用程序之外？还是允许他们在承担自担风险的情况下使用，即在知晓系统在使用过程中可能会停机的情况下继续使用？如果是如此，你最好确保定期向他们公布系统在这一窗口期内可能会停机。如果他们已经连续几周或几个月在未受打扰的情况下使用系统，而突然在没有任何预警的情况下被踢出系统，他们可能不会记得这个时间段从初就不属于他们。\n\
  \n你如何处理用户在维护窗口期间已登录应用程序的情况？如果 `Application Administrator` 需要关机系统，他或她可以在不通知用户的情况下这样做吗？还是是否需要联系并警告用户？如果用户并没有真正登录呢？也许他或她在没有正常注销的情况下退出了应用程序，现在应用程序有一个并不真正活跃的“孤立”会话？\n\
  \n执行备份时必须停掉应用程序吗？如果没有，从用户的角度来看系统性能是否明显下降？这是用户愿意忍受的吗？\n\n当在固定的维护窗口期间对应用程序有业务需求时会发生什么？例如，如果会计部门在周末加班结账，他们将需要取消维护窗口以确保他们的工作不受中断。是否有取消维护窗口的流程，以便不干扰关键工作？\n\
  \n## 11.6 支持 24 × 7 运行\n\n某些业务应用程序必须每天 24 小时、每周 7 天运行。考虑一个大型网站的订单输入系统。或者搜索引擎。或者一个客户登录以报告天然气泄漏或停电的大型公用事业。\n\
  \n支持永远不能停机的应用程序与支持像贵组织的培训网站这样平庸的应用程序有何不同？我认为，说支持 24 × 7 运行比支持“9 到 5”的应用程序要困难几何级增加。支持\
  \ 24 × 7 应用程序时出现的一些复杂情况包括：\n\n- 在不停止应用程序的情况下创建备份。解决这一困境的答案通常来自软件供应商或数据库供应商。应用程序的设计必须允许“在线”进行备份。\n\
  - 在不停止应用程序的情况下安装更新。如果修复或更新需要停止并启动应用程序，但从业务角度来看这是不可接受的，那么生活将变得复杂。解决此问题的方法之一是应用程序运行在集群或多个集群上。如果是这样，可以将一个服务器从集群中取出、进行更新，然后恢复运行。如果测试显示修复有效，则在集群中的其他服务器上重复这些步骤，直到所有服务器都更新完毕。\n\
  - 支持人员的规模是否足够，以提供长时间的 24 × 7 支持？短期内，一个小组可以处理全天候支持。但对于长时间来说，小团队会变得精疲力竭、倦怠且容易出错。如果支持需要是不间断的，就需要增加支持团队的规模。\n\
  - 当一个班次下班另一个个人或小组上岗时，支持团队对正在进行的问题是否有正式的交接程序？如果一个关键问题在一个团队离开一天另一个团队接手时掉进了缝隙中，将会有一些极度敌对的用户。如果轮班团队在物理上不在同一个地点，这个问题就更容易发生。\n\
  - 某些软件存在错误，内存被分配用于临时使用，但在不再需要时没有将其释放给系统。这通常被称为“内存泄漏”。如果应用程序有这个问题，典型的通俗方法是定期停止并启动应用程序，例如每周一次。当应用程序停止时，所有分配给它的内存都会自动释放回系统。如果应用程序必须\
  \ 24 × 7 运行，那么这种解决内存泄漏的方法对你就不可用。\n\n## 11.7 支持层级\n\n拥有服务台的组织经常会对支持小组进行分级。其核心思想是将问题分配给能够最有效解决问题的组。许多组织定义了三层支持。如果你的组织没有建立支持层级计划，那么本节不适用于你。\n\
  \n### 11.7.1 第一级支持\n\n通常，当软件用户寻求技术协助时，第一级技术人员收集并记录呼叫者的基本信息。然后技术人员将尝试解决问题，查看它是否属于用户经常遇到的问题列表。更复杂的问题将传递给二级技术人员。\n\
  \n一级人员可以处理的典型问题或问题包括：\n\n- 注册新用户\n- 解锁被锁定的账户\n- 重置密码\n- 删除或禁用用户帐户\n- 识别表明 Web 应用程序的错误信息\n\
  - 与用户配合确认了正确的 URL、登录 ID 和密码\n\n服务台的人员流动率可能很高，因此你不能指望员工的连续性。为了保持有效性，服务台人员要么需要良好的培训，要么需要拥有非常有效的资源。有效资源的一个例子是提供一份列出第一级技术人员预计遇到并处理每个问题的文档或网页。这种信息有时被称为“剧本（playbook）”，包含以下内容：\n\
  \n- 用户经历的问题症状\n- 纠正问题应采取的步骤\n- 如果上述步骤未能纠正用户的问题该怎么办\n- 如果问题证明比预期的重大，应该联系谁\n\n\n\n\
  \n\n如果一级技术人员无法解决问题，则需要将其升级到二级支持。这需要关于如何实现这一操作的直观指令。在这一转换过程中，确保已开启的工单不丢失是非常重要的。\n\
  \n如果你的组织已经建立了多级支持结构，那么由谁来提供一级支持？他们是否拥有上述描述的信息，以使他们的工作更高效？\n\n### 11.7.2 二级支持\n\n\
  二级人员在应用程序方面比一级人员拥有更丰富的经验和培训。得于他们额外的专业知识，他们将能够处理更复杂、更不常见的问题。\n\n当问题从一级人员传递给二级人员时，必须提供已经收集到的关于该问题的所有细节。如果没有这样做，那么可能会在重复基础性问题或调查上浪费时间。如果所有与工单相关的信息都输入到在线系统中，那么二级技术人员就可以随时访问这些信息。\n\
  \n这里列出了可能可能适用于你的组织关于二级支持的问题：\n\n- 你们的组织是否为该应用程序提供二级协助？\n- 你们的二级人员拥有多少额外的经验或培训？\n\
  - 一级人员和二级人员之间的交接流程是否已经完善？\n- 是否存在一种流程，使二级人员能够访问已在工单上收集的所有信息，以及已经尝试过的解决步骤？\n\n###\
  \ 11.7.3 三级支持\n\n三级支持人员负责处理用户在使用应用程序时遇到的最困难或最高级的问题。这些人对该应用程序拥有最丰富的经验。如果他们不能自己解决问题，他们将根据需要联系供应商支持团队寻求额外协助。\n\
  \n与二级技术人员一样，当问题升级到三级时，技术人员需要能够看到该问题的记录。如果他重复了一级或二级人员已经尝试过的内容，将是浪费大家的时间。\n\n### 11.7.4\
  \ 影响所有层级的话题\n\n需要描述影响所有层级的某些主题。这些主题被收集在以下章节中。\n\n### 11.7.4.1 知识库\n\n支持应用程序永远不是静态的。会遇到新问题，现有的问题也会变得不再严重。如果每个人都能意识到新问题以及现有问题的成熟解决方案，将使支持团队更高效。支持团队人员如何学习这些新或不同的细节？如果进入团队的每个案例都进行记录，那么这些信息就可以组织成知识库。团队成员（特别是一级和二级人员）可以利用这个知识库来解决以前只有经验丰富的人才能解决的问题。有价值的知识库的关键是记录每个问题的每一个细节。如果系统中描述了一个问题，但没有记录如何解决该的细节，那么这条记录对任何人都没有帮助。\n\
  \n知识库的另一个有价值的可能是从中提取趋势信息。如果某个问题以前从未遇到过，但现在频繁发生，这就是一种趋势。使用知识库，可以识别趋势并更快速地解决这些问题。例如，该问题可能是因为用户升级了浏览器导致的。知识库可以提供统计数据，例如第一次发生的时间以及他们安装了什么种浏览器。如果没有广泛的信息，此类情况可能不会被很快地察觉。\n\
  \n### 11.7.4.2 响应时间\n\n每个层级对响应时间的预期是什么？我不认同响应时间可以被精确地预测或控制。困难之处在于每个问题都是不同的。一个看起来可能是非常简单的问题，结果可能被证明是极其复杂的。如果你的支持人员专业且富有经验，那么我相信你必须信任他们，让他们尽力尽快解决问题。\n\
  \n### 11.7.4.3 升级工单\n\n你如何知道一个问题工单需要从一个层级升级到另一个层级？很难对此设定精确的时间限制，但当一名员工遇到瓶颈时，他们应该能够识别出来。如果他们尝试了知识库中的所有内容以及他们个人的技巧列表，并且没有任何进展，那么就需要升级。对于一级人员来说，通过反复重复解决方案来继续尝试修复问题不是一种高效的做法。一旦他尝试了他所熟悉的一切，就是时候将工单推到下一个层级了。\n\
  \n谁有权做出升级工单的决定？我认为三个方应该拥有这种权限。\n\n1. 正在处理该工单的当前支持团队成员。他或她应该能够识别自己何时达到了专业知识极限。如果某个成员似乎无法识别这一点，那么他的或她的经理应该将其作为个人发展的一部分来处理。\n\
  2. 支持团队主管绝对有权升级工单。主管应该足够了解团队，以便能识别出某人何时没有取得进展。一旦达到这一点，时间和金钱就会被浪费，问题需要用新的眼光来审视。\n\
  3. 请求者至少应该能够请求升级工单。如果在合理的时间范围内没有进展，那么要求升级工单请求就是合理的。问题越关键，这个时间跨度就应该越短。\n\n#### 11.7.4.4\
  \ 交接工单\n\n在一个层级捕集的细节是如何传递给下一个层级的？需要一个工具，允许支持小组在工单开启时收集细节。这种工具通常被称为故障单系统。在解决此工单的每次更改时，这些细节都会被记录。如果工单重新分配给新的接收者，将发送一封电子邮件通知他们新的责任。\n\
  \n支持支持人员的工具可以在内部开发，也可以从软件供应商处购买。有很多成的工具可以支持这一点。例如：\n\n- 来自 `BMC` 的 `Remedy`\n- `iSupport\
  \ Service Desk`\n- `IncidentMonitor`\n- `Hesk Help Desk Software`\n- 来自 `BrightBox\
  \ Solutions` 的 `Help Desk Software`\n\n### 11.8 远程访问你的服务器\n\n如果你作为应用程序管理员工作，根据定义你将处于远程工作状态。你工作的服务器可能在另一个房间、另一栋楼、另一个城市或另一个国家，但你并没有坐在它们面前。你需要了解能够让你方便、高效地远程连接到服务器并在上面执行所需操作的工具。\n\
  \n\n\n\n这里描述了三种你可以用于远程访问服务器的工具。你选择哪种特定工具将部分取决于你服务器上的操作系统，部分取决于你的个人偏好。\n\n### 11.8.1\
  \ RDC—远程桌面连接\n\n如果你的台式电脑是基于 Windows 的，那么你至少可以考虑使用远程桌面连接（`RDC`）来连接远程服务器，至少是因为它已经加载在你的桌面上而且它是免费的。\n\
  \n图 11.1 显示了 `RDC` 的登录界面。要远程连接到另一台服务器，你需要输入要连接的服务器名称。如屏幕所示，你需要输入 ID 和密码来完成连接。\n\n\
  ![image](img/F00011Xf11-01-9780123985453.jpg)\n\n图 11.1 远程桌面连接的登录界面。\n\n这很容易被忽略，但要远程连接到另一台服务器，你必须在该服务器上有一个有效的账户。如果你的账户在服务器上尚不存在，你必须请求系统管理员为你创建一个。\n\
  \n成功登录服务器后，你本质上是在控制该桌面。你看到的屏幕如图 11.2 所示。在这个桌面上，你可以执行任何你坐在控制台和键盘前可以做的操作。如果你点击“开始”按钮，可以选择打开命令行窗口的选项。如果你右键点击开始按钮，可以打开\
  \ Windows 资源管理器（又称文件管理器）。\n\n![image](img/F00011Xf11-02-9780123985453.jpg)\n\n图\
  \ 11.2 远程服务器的桌面屏幕。\n\n在远程服务器上完成任务后，你需要注销。虽然这项任务看起来简单，但可能很棘手。选择“开始”，然后点击“注销”。注销”和“关机”链接靠得非常近。确保你点击的是正确的一个。图\
  \ 11.3 显示了注销过程的截图。\n\n![image](img/F00011Xf11-03-9780123985453.jpg)\n\n图 11.3 注销选项。\n\
  \n你应该看到的下一个屏幕是图 11.4 所示的注销确认提示。如果你没有看到那个提示，那么可能是你选择了“关机”选项。继续此路径将关闭服务器。通常情况下这样做（特别是对于生产服务器）被认为是不恰当的。在注销服务器时请务必小心。\n\
  \n![image](img/F00011Xf11-04-9780123985453.jpg)\n\n图 11.4 注销确认提示。\n\n退出远程服务器会话的一个极其实用的替代方案是关闭连接但让会话继续运行。如果你启动了一个需要运行很长时间的进程，你可能想这样做。如果你不需要监控它，可以断开连接并让它运行完成。要通过这种方式断开连接，点击\
  \ `RDC` 会话窗口右上角的红色“X”。将显示图 11.5 所示的提示屏幕。点击“确定”按钮。要重新启动会话，只需打开 `RDC` 并像往常一样连接到服务器即可。\n\
  \n![image](img/F00011Xf11-05-9780123985453.jpg)\n\n图 11.5 断开连接但保持会话开启。\n\n你的环境中可能存在的一个局限是可以连接到服务器的最大会话数。每个连接都需要有限的资源（例如内存）来建立和维护。在我目前工作的机构中，此限制被设置为两个。你将发现你所在位置的限制是什么。\n\
  \n如果这些插位已被占用，你将无法连接到服务器。图 11.6 显示了如果在这种情况下你会看到的消息窗口。\n\n![image](img/F00011Xf11-06-9780123985453.jpg)\n\
  \n图 11.6 显示所有会话均被使用的消息屏幕。\n\n如果所有插位都被占用，那么在当前会话之一关闭之前，你就无法登录服务器。然而，有一种方法可以找到当前连接到服务器的人。一旦你知道了，你就可以联系他们并礼貌地请求他们注销，以便你登录。\n\
  \n实现此方法是远程连接到与你想连接的服务器同一网络中的服务器。例如，假设你想登录 `ox002` 但它所有的连接都已占用。你需要远程连接到 `ox001`，然后在\
  \ `ox001` 上打开名为 `Terminal Services Managers` 的实用程序。点击“开始”按钮，然后点击“管理工具”，并在子菜单中选择\
  \ `Terminal Services Manager`。图 11.7 显示了如何进行操作。\n\n![image](img/F00011Xf11-07-9780123985453.jpg)\n\
  \n图 11.7 打开终端服务管理器。\n\n`Terminal Services Manager` 的默认界面所示。在图 11.8 中，有两个用户登录了服务器。其中一个处于活动状态。\n\
  \n![image](img/F00011Xf11-08-9780123985453.jpg)\n\n图 11.8 终端服务管理器。\n\n要查看谁登录了服务器，选择“操作”菜单。图\
  \ 11.9 显示了如何连接。\n\n![image](img/F00011Xf11-09-9780123985453.jpg)\n\n图 11.9 连接到另一台计算机。\n\
  \n#### 11.8.11 控制模式\n\n在使用 `RDC` 连接到远程服务器时，你本质上是在创建一个新会话并登录其中。一个名为控制的会话在服务器上总是存在。这被称为\
  \ `session 0`。你可以在连接时添加 `/console` 参数来连接到此会话。\n\n以控制模式打开会话的优势是，服务器上运行的任何应用程序对于控制会话都是可见的。非控制模式打开会话时并非如此。\n\
  \n在远程访问服务器时使用控制模式存在极小的风险。我管理的一个应用程序如果任何人以控制模式登录服务器就会崩溃。该应用程序有一个 bug，要求它在控制会话中运行。如果有人以控制模式远程登录，应用程序就会崩溃。\n\
  \n### 11.8.2 PuTTY\n\n`PuTTY` 是另一个允许你远程访问其他服务器的包。它是一个开源终端仿真器程序。`PuTTY`可以在 Windows、Unix、Mac\
  \ OS X 和其他操作系统上运行。图 11.10 显示了 `PuTTY` 的连接界面。服务器的名称或 IP 地址输入到 `Host Name` 字段。然后输入端口号并在单选按钮字段中选择连接类型。最后，点击\
  \ `Open` 按钮与远程服务器建立会话。\n\n![image](img/F00011Xf11-10-9780123985453.jpg)\n\n\n\n\n\
  图 11.10 PuTTY 连接界面。\n\n一旦通过 `PuTTY` 与远程计算机建立连接，你将看到类似于图 11.11 所示的屏幕。登录方式就像坐在电脑面前一样。\n\
  \n![image](img/F00011Xf11-11-9780123985453.jpg)\n\n图 11.11 PuTTY 连接。\n\n### 11.8.3\
  \ SmarTerm\n\nSmarTerm 是一种商业终端仿真应用程序，能够访问各种系统。它兼容 `Windows Server 2008`、`Windows\
  \ Server 2003`、`Unix` 以及 `IBM mainframes`。SmarTerm 支持英语以外的多种语言。\n\n## 11.9 谁在为你提供支持？\n\
  \n没有人能无所不知。对于你不熟悉的领域，你拥有多大的支持？当应用程序之外（例如数据库或网络）出现问题时，你可以向谁寻求帮助？你的组织在这些领域是否有专家可以帮助你调查并纠正应用程序之外的问题？你现在知道如何与他们联系吗？他们对你的求助请求响应及时吗？\n\
  \n希望你的组织与应用程序供应商签有支持合同。无论你有多多少经验，最终都会遇到你从未见过且无法处理的问题。当这种情况发生时，知道你可以依靠供应商支持服务台（Support\
  \ Desk）的专业知识将是一件幸事。\n\n大多数供应商都会为客户提供不同级别的支持合同。协助程度从完全没有支持到让他们的技术人员坐在你旁边的隔间间不等。你需要了解你与供应商签订的是什么种级别的支持合同。确保你知道以下问题的答案：\n\
  \n- 你拥有什么级别的支持？例如，是仅限于常规工作时间，还是扩展到 24 × 7 全天候？\n- 供应商的“常规工作时间”是什么？他们和你在同一个时区吗？\n\
  - 你有非工作时间支持的电话号码吗？有时这与普通号码不同。\n- 你的名字是否在组织的授权联系人名单上？某些供应商允许每个客户的少数人员（即联系人）拨打他们的支持服务台。你在名单上吗？\n\
  - 你知道你组织的许可证号或客户编号吗？某些供应商的服务台在接听电话后就会询问这个问题。你可能想背下这个号码，或者把它纹在手腕上。\n\n## 11.10 继任计划\n\
  \n我读过，一旦你进入某个职位，就需要开始培训你的备份人员或继任者。对于我们所有担任应用程序管理员的人来说，这个建议似乎是。\n\n### 11.10.1 为什么你需要备份人员？\n\
  \n为什么你需要一个备份人员？这里列出了一些原因：\n\n- 你喜欢偶尔休个假并能够忘记一两周的工作吗？如果没有备份人员，你能够这样做吗？如果知道手机随时可能因为危机情况而响起来，在假期里很难尽情享受。如果知道有一个经过良好培训、经验丰富的备份人员在现场处理任何发生的紧急情况而不会打扰你，难道不是更愉快吗？\n\
  - 你是否想过晋升？如果你在目前的职位上是不可或缺的，那么要说服管理层提拔你并让关键应用程序失去支持将是很困难。如果你能说服他们提拔你，你就不想同时兼顾新旧两个工作。\n\
  - 你是否会生病并需要请假？你是否曾在流感期间尝试过解决系统故障？这会让糟糕的一天变得更好。\n\n### 11.10.2 培训你的备份人员\n\n每个人的学习方式不同，但对我来说，许多人在采取“动手”方法时学习得最有效。如果这对大多数人适用，那么培训继任者的最佳方法就是先让他们看你执行一两次任务。然后，他们“毕业”到你的监督下由自己操作。最后，他们将在没有帮助的情况下独立完成。随着他们掌握了支持应用程序的简单方面，他们需要面对难度日益增加的任务。\n\
  \n你应该尽早开始培训你的继任者或备份人员。如果你们中一个或两人都支持其他应用程序，情况尤为如此。如果你等到你们都有了大量的“空闲”时间，那么他们的培训永远不会发生。几周、几个月、几年就会这样过去，而没有进行过任何实质性的培训。\n\
  \n从对应用程序进行几次简短的熟悉课程开始。之后，开始让他们参与实操环节。对我来说，进行多次短小而密集的课程，比进行少数长时间但冗闷的课程要好。\n\n## 11.11\
  \ 支持人员的呼叫列表\n\n所有支持人员都需要知道如何相互联系。找到这些号码必须很容易，因为它们在清晨最早的时候就会被需要。你的组织是否有支持人员列表，以及他们的家庭电话、手机和呼机号码？\n\
  \n- 这个列表是否在门户网站上？\n- 在网页上？\n- 在共享驱动器上？\n- 记录在每个人的手机里？\n\n你们的呼叫列表是否指定了应该按什么顺序拨打？如果主要支持人员在线，应该先拨打他们。只有当他们不在或未响应时，才拨打名单上的下一个人。还需要了解支持团队的专业领域。例如，你的\
  \ DBA 团队可能有 Oracle 专家和 SQL Server 专家，而他们对另一个平台没有任何专业知识。如果你的应用程序基于 Oracle 数据库并出现问题，那么拨打\
  \ SQL Server 专家将毫无意义。你需要的是 Oracle 专家，而呼叫列表应该告诉你哪位 DBA 是最佳人选。\n\n\n\n\n\n行业内经常提到两个术语。这两个术语分别是“灾难恢复”（DR）和“业务连续性”（BC）。尽管两者存在大量重叠，但它们并不是同一一物。简而言之，DR\
  \ 和 BC 的区别在于：业务连续性处理整个组织的需求，而灾难恢复关注组织的 IT 方面。\n\n业务连续性下的主要主题示例包括：\n\n* 供应链物流\n*\
  \ 关键高管离职的继任计划\n* 通讯中断（例如组织的 PBX 系统）\n* 紧急情况下向公众、政府和媒体发布信息的计划\n* 识别关键岗位的备份人员并对其进行交叉培训，因为主要人员在紧急情况下可能无法提供服务\n\
  \n灾难恢复所解决的主要主题示例包括：\n\n* 数据中心损坏或停机（火灾、洪水、停电、关键基础设施组件故障）\n* 电信中断\n* 电力或其他公用事业中断\n\
  * 无法访问数据中心\n* 无法使用主要的 IT 设备（如服务台 Help Desk）\n* 关键业务应用程序的损坏或故障，例如在线订单输入系统、面向客户的网站、应付账款、应收账款、库存控制等。\n\
  \nBC 和 DR 之间大量的重叠要求这些计划必须结合制定。如果在不知道另一方正在做什么的情况下制定其中任何一个，很可能会导致工作重复，或者忽略和遗漏重大的需求。图\
  \ 12.1 显示了一个概述两者的韦恩图，展示了它们重叠之处和相互独立之处。\n\n![image](img/F000121f12-01-9780123985453.jpg)\n\
  \n图 12.1 潜在问题的韦恩图。\n\n作为 IT 专业人员，你可能负责或不负责制定组织的业务连续性计划。你可能会被联系就 BC 计划如何影响你所支持的应用程序提供意见。你很可能会参与你所在应用程序灾难恢复计划的制定。如果你在灾难恢复计划制定后成为了该应用程序的管理员，那么在定期审查时你仍会参与其中。\n\
  \n## 12.2 什么是构成灾难？\n\n你的 DR 计划可能没有涵盖但需要考虑的一个主题是：到底什么构成了灾难。像全城停电这样的灾难是显而易见的。但更局限的问题呢？可以仅针对单个应用程序宣布灾难吗？例如，以下问题是否构成了灾难吗？\n\
  \n* 你的应用程序服务器真的起火并烧毁了。这是一个灾难吗？该应用程序应该移动到 DR 站点，还是最佳解决方案是购买备用服务器并在生产数据中心重建？\n* 如果一整排服务器烧毁了呢？能否在接受的时间范围内在生产数据中心安装并重建\
  \ 10、20、30 或 40 台服务器，还是应该将这些这些“焦焦的小家伙”上运行的应用程序移动到 DR 站点？\n* 如果是数据库服务器崩溃了呢？是否应该将数据库和应用程序都迁移到\
  \ DR 服务器？为了使情况更加复杂，如果数据库服务器所需的硬件无法立即获得怎么办？这会改变关于是否构成灾难的决定吗？\n* 假设你处于 5 类飓风的潜在路径上，国家飓风中心说你的生产数据中心有\
  \ 90% 的概率会被袭击。你应该将磁带和人员移至内陆 200 英里的 DR 站点吗？如果概率是 50% 呢？在这种情况下你应该移动到 DR 站点吗？\n\n\
  上述问题的重点在于，你必须知道在什么条件下可以宣布灾难。谁有权做出这个决定？如果主要决策者不在，那么谁是他的后备人员？\n\n## 12.3 必须准备的灾难类型\n\
  \n不可能为每种可以想象的灾难类型做好准备。例如，你能够有效地为灭绝级小行星撞击地球或全面核战争做好准备吗？当然，无法为这种规模的灾难制定计划。你所能做的最好的办法是为现实发生的、且你有资源处理的灾难做好准备。极端的末日场景是无法计划的。\n\
  \n下面列出了必须考虑的某些可能场景。显然，并不是每种类型的灾难都适用于每个组织。内布拉斯加州的 IT 人员不需要为飓风做计划，佛罗里达州的人员不需要担心雪暴，但这些威胁中的大部分是相当通用的。\n\
  \n* 自然灾害，如洪水（自然或人为）、飓风、山火灾、雪暴、龙卷风、地震等。\n* 数据中心宕机\n* 由于天气、轮流停电或技术问题导致的停电\n* 通信中断\n\
  * 失去空调或暖气\n* 由于其他灾难（如洪水或雪暴）导致物理上无法到达数据中心\n* 流行病，如禽流感\n* 你所在的州或城市的恐怖袭击\n* 针对你的网络、服务器或应用程序的网络攻击\n\
  * 在你数据中心附近释放危险化学物质的火车脱轨\n\n需要注意的是，这里列出的并非种灾难都意味着设备和系统故障。其中某些与人力资源有关，员工可能无法可用（如大范围疾病），或简单的无法到达工作场所（如雪暴情况）。\n\
  \n## 12.4 组织级灾难计划\n\n如果你的组织有一个 DR 计划，那么你应用程序的特定计划必须遵循更广泛的指南。如果组织在位置 `x` 设置了 DR 站点，那么你应用程序的\
  \ DR 站点也将在那里。你不能期望为单个应用程序建立另一个站点。\n\n### 12.4.1 你的组织要求拥有 DR 计划吗？\n\n虽然每个组织都应该有一个\
  \ DR 计划，但某些行业法律或法规要求必须有一个。你的组织要求拥有 DR 计划吗？某些要求拥有的行业示例包括：\n\n* 银行和其他金融机构必须在 2003\
  \ 年 3 月之前拥有 DR 计划。\n* 美国证券交易协会要求其成员（即股票经纪）拥有业务连续性计划。\n* 电力部门被 `FERC`（联邦能源监管委员会）要求拥有\
  \ DR 计划。\n* `HIPAA`（健康保险流动性与责任法案）要求医疗保健提供者拥有灾难恢复计划。\n* 广播和电视电视台被媒体和安全可靠性委员会要求拥有\
  \ DR 计划。\n\n### 12.4.2 DR 是否被认真对待？\n\n组织的 DR 计划是否被认真对待？以下两个问题的答案可以让你非常深入地了解组织是否在认真对待\
  \ DR 规划。\n\n1. DR 计划是否定期审查或测试？如果 DR 计划已经多年没有经过审查或测试，那么它就没有被认真对待。\n2. DR 计划是否得到了维护（即更新）？没有任何\
  \ DR 计划是完美的。每份计划都需要定期的修正。随着组织物理基础设施、软件清单、人员和设施位置的改变，即使是完美的计划也会过时。如果一个计划超过一年没有更新，那么它几乎肯定过时了。如果\
  \ 5 年没有更新，那么它可能一毫无用处。\n\n### 12.4.3 你的应用程序是否存在于整体 DR 计划中？\n\n\n\n\n组织的灾难恢复（DR）计划对你的应用程序是如何说明的？你的应用程序在计划中提到吗？如果没有被列出，那么可能是由于以下原因之一被遗漏了。例如：\n\
  \n- 在制定 DR 计划时，你的应用程序还不存在。如果是这种情况，则需要将其添加到整体 DR 计划中。作为`Application Administrator`，你是启动这一过程的最佳人选。\n\
  - 在整体规划方案中，你的应用程序被视为低优先级，其重要性不足以被纳入规划过程。\n- 它仅仅是被疏忽了。如果是这种情况，你需要启动努力将其包含在内。如果灾难发生且没有恢复你应用程序的计划，这对你或该应用程序都不会产生积极影响。\n\
  - 灾难发生期间，将使用人工变通方法来代替应用程序。\n- 没有人愿意为应用程序的 DR 部分提供资金。\n- 应用程序依赖于不在 DR 计划中的其他资源，因此即使该应用程序在\
  \ DR 计划中，在包含这些资源之前，灾难恢复也无法进行。\n\n### 12.4.4 你的应用程序的优先级是多少？\n\n并不是所有的应用程序对组织来说都同等重要。这并不是一个不切实际或随意的观察。如果组织中的所有应用程序突然变得不可用，重点是恢复面向客户的订单网站，还是跟踪内部培训课程的应用程序？显然，首要任务是能产生收入的应用程序。其他优先级是处理个人安全的应用程序。组织的业务部门而非\
  \ IT 部门将做出这些优先级排序决策。\n\n通常，组织内部的应用程序按优先级分组。例如，它们可以根据应用程序在影响组织之前可以不可用多长时间进行分组。这些组的定义可能所示。当然，这些只是示例，可能不适用于你的应用程序或组织。\n\
  \n- 高——如果应用程序宕机超过 30 分钟，则需要在灾难恢复备用站点恢复它。\n- 中——如果应用程序宕机超过 24 小时，则需要在灾难恢复备用站点恢复它。\n\
  - 低——如果应用程序宕机超过 3 天，则需要在灾难恢复备用站点恢复它。\n\n你的应用程序的优先级是什么？它在全公司范围内的排名将对它在灾难场景下何时被处理产生巨大影响。如果所有应用程序都受到灾难影响，那么高优先级应用程序将首先恢复在线。网络工程师、`DBAs`\
  \ 和 `System Administrators` 等资源一次只能处理一个问题。一旦高优先级应用程序恢复在线，非关键应用程序将由基本人员资源处理。\n\n\
  ## 12.5 应用程序的 DR 计划\n\n每个应用程序都需要一个独立的 DR 计划。如果目前不存在，则需要编写。如果已经存在，则应该对其进行审查以确认其是自。在任何情况下，你作为`Application\
  \ Administrator`都将负责该过程很大一部分。\n\n### 12.5.1 你的应用程序已经有 DR 计划了吗？\n\n你支持的应用程序已经有 DR\
  \ 计划了吗？如果是，你能回答关于它的以下问题吗？\n\n- 谁写的？\n- 是什么时候写的？\n- 上一次测试是什么时候？\n- 上一次更新是什么时候？\n\n\
  如果你不知道这些问题的答案，那么你需要尽快彻底地审查 DR 计划。仅仅因为计划存在并不意味着它是最新的或准确的。\n\n关于你应用程序的现有 DR 计划，你还需要考虑的另一个问题是“为什么要写？”这听起来可能是一个奇怪的问题，但它很重要。它是仅仅是为了勾选某项任务而写的吗？如果是这样，你可能想把它扔掉并从零开始。一个仅仅为了满足公司指令而写的计划可能不值钱。\n\
  \n你如何识别你的 DR 计划写得不好？一种方法是看它看起来是否像一个模板，只在空白处填了应用程序名称和极少量的细节。另一种方法是将其与你组织中其他应用程序的\
  \ DR 计划进行比较。如果你的计划看起来和其他计划非常相似，那么它可能是作为“复制粘贴”过程的结果产生的。这类批量产型的 DR 计划都不可能经过深思熟虑，可能可以大大改进。\n\
  \n### 12.5.2 应用程序的 DR 计划应该包含什么？\n\n每个应用程序的 DR 计划都应该包含以下几点。如果组织对 DR 计划有推荐格式，显然应该遵循该模板。\n\
  \n- 对支持应用程序所需的硬件描述，例如计算机服务器。这需要包括用于支持集群或负载均衡的硬件。\n- 服务器是物理的还是虚拟的。如果是虚拟的，则需要包含对虚拟平台的描述，例如`VMware`。\n\
  - 硬件是否将提前购买并安装在 DR 站点。另一种方案是在宣布灾难后订购并安装。虽然这种方法可以省钱，但明显的缺点是，灾难发生后应用程序对用户可用所需的时间将长得多。\n\
  - 应用程序软件的描述，包括类似哪个版本以及包含哪些可选包等详细信息。\n- 应用程序运行所需的数据库详细信息。\n- 服务器所需的支持软件列表，包括版本。\n\
  - 恢复时间目标，例如，在宣布灾难后 24 小时内应用程序恢复运行。\n- 在 DR 服务器上安装应用程序软件的步骤。这些步骤应当记录，且这些文档应位于相关人员已知的位置。\n\
  - 从生产系统迁移数据到 DR 系统的步骤。\n- 处理灾难事件的 IT 和业务团队的角色和职责。每个角色都需要确定主要人员和备份人员，因为在灾难情况下，可能并非所有的主要人员都能联系上。\n\
  - 谁有权宣布灾难情况？\n- 一旦宣布灾难情况，IT 和业务人员如何通信？联系信息（包括工作电话和私人电话、电子邮件地址等）应位于相关人员的 DR 文档中。\n\
  - 应用程序终端用户如何通知灾难发生了？他们需要被明确告知应用程序何时再次可用，以及他们如何访问 DR 版本。\n- 关于何时以及如何测试 DR 计划的描述。\n\
  \nDR 计划需要获得应用程序所有者和支持它的 IT 组的批准。它可能还需要经过高级 IT 人员的审查，以确保其符合组织提出的整体 DR 目标。\n\n###\
  \ 12.5.3 DR 站点类型\n\n并不是所有的 DR 环境都是相同的。在如何设置和维护 DR 站点方面有多种选择。一种类比是称之为冷、温、热。组织可以为不同的应用程序设置不同的\
  \ DR 环境。例如，它可以为产生收入的应用程序设置热 DR 环境，为其他应用程序设置冷站点。\n\n### 12.5.3.1 热\n\n\n\n\n热备地（Hot\
  \ DR site）拥有旨在复制生产环境（Production site）的计算机设备。硬件可能与生产环境并不完全相同，但非常接近。例如，两个站点都可能拥有集群服务器，但生产环境的集群中的服务器可能更多。热备地站点的数据库是同步的，因此与生产环境的数据库几乎完全一致。这可能包括生产环境与灾备地站点之间的专用软件或额外的网络链路。\n\
  \n热备地的优势是它可以非常快速地启动并运行，在某些情况下，在生产环境宕机几秒钟内即可完成。缺点是复制硬件、软件和数据既复杂又昂贵。你必须为灾备地购买额外的在\
  \ 99.99% 时间内未被使用的计算机。你可能还需要为灾备地购买额外的软件许可许可。你应该持续监控数据同步过程，以确保它始终正常运行，并能够在短时间内接管生产环境的工作。热备地地是所有方案中最昂贵的，这并不令人意外。\n\
  \n只有当所支持的应用程序需要这种级别的可用性时，才建议建立热备地。可能证明热备地合理的场景示例包括：电子商务网站、金融机构系统、在线股票交易系统以及无法承担应用程序中断后果的政府机构。\n\
  \n### 12.5.3.2 冷备（Cold）\n\n冷备地（Cold DR site）没有正在运行的计算机。事实上，最初它可能一台计算机都没有。更多地将其看作是一个空设施，只有在宣布灾难后才开始建设。\n\
  \n冷备地的优势是它是成本最低的方法。在未宣布或灾难之前，不会产生任何支出或投资。冷备地的缺点是让应用程序恢复到正常运行需要大量时间。硬件必须经过采购、交付、安装，然后必须在上面安装软件。显然，如果涉及的应用程序需要在几小时甚至一两天内投入运行，那么这种类型的灾备地就无法使用。\n\
  \n### 12.5.3.3 温备（Warm）\n\n正如你可能已经猜到的，温备地（Warm DR site）介于热备地和冷备地之间。它可能已经设置好了服务器，但可能尚未在上面安装应用程序软件。温备地上的数据几乎保证是过时的。在站点投入生产之前，必须在温备地加载最新的数据。\n\
  \n温备地的优势是它提供的响应比冷备地快，但成本只有热备地的一部分。\n\n## 12.5.4 软件许可与你的灾备地\n\n在获取和设置灾备服务器之前，请确保你理解有关灾备地许可方面的影响。如果你的灾备地包含已经加载了软件的服务器，你不希望从事任何非法行为。你需要考虑以下问题，以确保你没有违反与软件供应商的合同。\n\
  \n* 应用程序软件供应商是否允许你在不额外支付许可费用的情况下在灾备服务器上加载他们的软件？\n* 数据库引擎供应商是否允许你在不额外支付许可费用的情况下创建灾备数据库服务器？\n\
  * 灾备服务器上的所有支持软件是否已获得妥当许可？\n* 灾备服务器在不被视为测试或生产服务器的情况下可以使用天数是否有限制？你的测试计划是否会违反这些限制？\n\
  \n## 12.5.5 人员配置计划\n\n灾备计划需要解决人员问题才能保持完整。即使是设计得最好的灾备地，也需要人员参与才能启动并保持运行。后续章节概述了许多与人员相关的问题。\n\
  \n### 12.5.5.1 谁参与了灾备计划？\n\n每个在灾备工作中承担责任的人都需要按姓名列在灾备计划中。仅通过职位来称呼他们是不够的。你需要包含姓名。\n\
  \n灾备计划还需要指定计划中每个职位的备份人员姓名。其原因是，关键人员在灾难期间可能无法就位。他或她在灾难发生时可能不在那里，并且由于交通选择有限而无法返回。更不幸的情况可能是关键人员可能在灾难中丧生或受伤。\n\
  \n人员变动是你灾备计划需要定期评审的首要原因之一。如果关键人员离开组织或转到另一个职位，那么他们将无法在灾备计划中履行其角色。每次对灾备计划的评审都需要确认每个列出的个人仍留在组织中，并且仍处于计划中列出的相同职位。如果不是，则需要用其继替者更新计划。\n\
  \n最后一个必须考虑的人员问题是，如果发生灾难，由于人的工作可能不是员工的首要任务。如果一个员工的家庭面临迫在危险，他们很可能不会离开家人而前往办公室。灾备计划必须考虑到，并不是每个员工都有能力或意愿参与灾备行动。\n\
  \n### 12.5.5.2 他们将在哪里执行？\n\n并不是每个人都必须亲自出现在灾备地。事实上，如果人们可以远程执行任务，可能会带来更低的成本、更少的拥挤和更高的生产力。对于每个扮演角色的人，灾备计划需要定义：\n\
  \n* 他们是否需要亲自到场\n* 他们是否可以远程工作\n\n如果某人需要亲自出现在灾备地，他们什么时候到达？并不是所有人都需要在第一天的第一个小时出现。组装服务器机架的硬件技术员显然需要在过程开始时在现场。负责在服务器上加载操作系统的系统管理员需要执行工作。应用程序管理员在之前的步骤完成之前无法进行任何操作。\n\
  \n人们如何到达灾备地？他们是飞过去还是开车过去？这个问题与站点的位置密切相关。如果它离生产环境较近，那么他们可以开车，但如果有 1000 英里远，那么开车是不现实的。每个人都需要知道灾备地在哪里，以便在需要时规划如何到达。\n\
  \n他们的住宿问题是否考虑过？如果他们将在一天内进出，那么这不是一个重要问题。如果他们需要在现场停留几天或几周，那么他们需要一个住所。组织是否可以在灾难发生时预订附近的酒店房间？这将使员工能够专注于他们的职责，而不是担心在有机会休息时睡在哪里。\n\
  \n### 12.5.5.3 每个人都知道自己的职责吗？\n\n每个人都需要知道自己在灾备计划中的职责。他们需要知道自己负责做什么、什么时候做以及在哪里何做。\n\
  \n灾备计划需要确保他们拥有履行职责所需的工具。例如，如果他们需要访问公司网络，他们将如何操作？以下问题概述了应该在灾备计划中解决关注的问题。\n\n* 所有将远程工作的支持人员在家里是否有宽带接入？\n\
  * 他们是否都有一台加载了所需软件的笔记本电脑？\n* 他们是否都有一台支持访问网络的家用电脑？\n* 他们知道如何从远程访问网络吗？他们以前做过吗？最近做过吗？\n\
  \n\n\n\n\n- 在任何时刻通过 VPN（虚拟专用网络）接入网络的人数是否有限制？如果答案是“没有限制”，那么这是否经过了测试？\n- 如果有限制，谁优先进入？如何执行这一限制？是否已经确定了高优先级的人员？\n\
  \n哪些应用程序将首先被处理？这个问题涉及第 12.4.4 节，该节对应用程序进行了优先级排序。每个人都需要知道哪些应用程序的优先级最高。在这些问题上浪费的时间或在引入低优先级应用程序上花费的时间，都代表了关键应用程序恢复上线的延迟。\n\
  \n## 12.5.6 测试你的灾难恢复（DR）计划\n\n未经测试的 `DR` 计划是不可信的。将关键任务遗留在计划之外是非常容易的。从头到尾测试计划有助于暴露任何此类关键遗漏。从头到尾测试计划还有助于确保任务顺序是正确的，并且每个任务的预计完成时间准确的。\n\
  \n在准备测试你的 `DR` 计划时，你需要记住以下问题：\n- 上次测试是什么时候？\n- 上次测试得如何？\n- 是否发现了计划中的缺陷？\n- 是否已利用上次测试中获得的信息来改进计划？\n\
  - 每个人是否知道 `DR` 计划的副本放在在哪里？\n- 如果系统/网络/服务器/数据中心宕机，计划是否可以访问？\n- `DR` 计划中有多少部分可以远程完成？\n\
  \n另一个需要回答的问题是，将 `DR` 站点恢复到运行状态需要多长时间？需要这一点，以便在宣布灾难后为用户提供每个应用程序可用时间的估计。与时间相关的问题包括：\n\
  - `DR` 计划是否专门针对时间方面进行测试？\n- 是否已指定每个应用程序的预计到达时间（ETA）？\n- 是否发生了任何可能导致重建过程耗长的变化？例如，如果应用程序使用的数据自上次测试以来增加了三倍，那么可以假设加载它需要更长时间。另一个例子是，如果应用程序现在有了集群服务器，那么在它们上加载应用程序软件将花费更长时间。\n\
  \n## 12.5.7 用户与灾难\n\n`DR` 计划需要考虑潜在灾难将如何影响用户。例如，如果应用程序的用户位于主数据中心相同的设施或城市中，他们将受到怎样的影响？\n\
  - 他们能否继续在主设施内工作？\n- 计划是让他们远程访问应用程序吗？\n- 他们家里是否有笔记本电脑或电脑可以让他们做到这一点？\n- 他们家里是否有 `broadband\
  \ Internet`（宽带互联网）访问？\n- 他们习惯远程访问应用程序吗？如果没有，在家里发生灾难的情况下学习这些对他们来说有多困难？\n- 是否采取了安全措施，允许他们使用应用程序但防止非合规的人员访问？\n\
  \n如果主数据中心不可用，将如何影响位于其他位置的用户？\n- 转向 `DR` 站点的迁移对他们来说是无缝的吗？\n- 如果不是，他们知道自己应该连接到 `DR`\
  \ 设施吗？\n- 如何通知他们主数据中心已不可用？\n- 如何通知他们 `DR` 站点现在已可用？\n- 他们知道该如何连接到运行在 `DR` 设施中的应用程序吗？对于基于\
  \ Web 的应用程序，这是否只是使用不同 `URL` 的问题？如果是，他们是否收藏了 `DR URL`？会通过电子邮件发送给他们吗？\n\n## 12.6 DR\
  \ 站点\n\n`DR` 站点的物理位置在哪里？它离 `Production`（生产）站点近吗？距离近有优缺点。一个优点是，如果它离主设施近，员工可以轻松地在两个站点之间迁移。\n\
  \n站点太近的缺点在以下问题中：\n- `DR` 站点是否会受到影响你主设施的相同灾难的影响？\n- 两个站点是否在同一海岸？如果是，飓风或海啸会同时影响它们吗？\n\
  - 两个站点是否在同一个地震带？\n- 两个站点是否依赖于同一个电力公用事业？\n- 两个站点是否依赖于同一个电信供应商？\n\n### 12.6.1 专用还是共享\
  \ DR 设施？\n\n`DR` 设施是为你的组织专用的，还是多个组织共享的？如果设施是共享的，则需要考虑以下问题：\n- 还有谁可以访问该设施？\n- 该设施可以同时托管多个客户吗？\n\
  - 如果多个组织需要同时使用共享的 `DR` 设施，谁拥有优先？\n- 如果上一个问题的答案是“先来后到”，是否意味着你应该比平时更早宣布灾难情况，以确保你有权访问\
  \ `DR` 设施？\n\n### 12.6.2 访问 DR 站点\n\n访问 `DR` 站点是否受限？如果是，那么你不希望获取访问权限的过程延迟你的应用程序运行的过程。回答以下问题可以防止在灾难发生时出现延迟：\n\
  - 如果发生灾难，你的 `IT staff`（IT 员工）如何访问该站点？\n- 现场有人有人吗？\n- 你的关键人员已经拥有访问权限吗？\n- 你的团队的其他成员有访问权限吗？\n\
  \n\n\n\n对于大多数应用而言，数据的变化比软件快得多。每天都会产生新的订单、发票、采购订单、交易等。因此，必须制定一个有效且一致的计划，以保持灾备（DR）站点的数据与生产环境的数据保持同步。\n\
  \n在生产环境和灾备站点之间同步数据有多种方法。这里列出了三种可能的实现方法。\n\n- 如果使用的数据库引擎提供相关功能，就可以实现数据的实时或近实时同步。这种功能有时被称为“日志传输（log\
  \ shipping）”。这种方法的优点是数据是实时或近实时同步的。数据丢失的风险从几小时减少到了几分钟或几秒。\n\n这种方法的一个缺点是，灾备环境中的数据库引擎必须一直运行。这可能需要为灾备环境中的数据库服务器获取许可。如果你没有为这些额外的许可费用准备预算，那么这种方法在经济上可能并不可行。\n\
  \n一个需要注意的是，并非所有应用程序都兼容实时数据同步。例如，如果应用程序将其部分数据存储在数据库之外的平文件中，那么数据库的实时同步并不一定包含这些平文件中的数据。这可能导致该方法无法作为你的解决方案。\n\
  \n- 定期备份（通常是每晚一次）并写入磁带。如果发生灾难，将最近的一组数据库备份磁带发送到灾备站点并加载。截至上一次备份时的所有数据现在在灾备站点上可用。这种方法的主要优点是执行成本相对低廉。\n\
  \n- 这种方法有几个缺点。最显著的缺点是耗时。将磁带发送到灾备站点需要时间，加载它们需要更多时间。另一个容易忽视的缺点是磁带并非完全可靠。如果无法读取最新的磁带，你将额外浪费发送和加载下一个磁带的时间。\n\
  \n这种方法最后的问题是，你将丢失数据库备份之间输入系统的数据。如果每天创建备份，通过回滚到最近的备份磁带，你可能会丢失多达 24 小时的数据。\n\n- 每晚通过正常流程创建备份文件，并通过电子方式发送到灾备站点。如果发生灾难，将加载灾备站点上最近的备份文件。这种方法的主要优点是备份文件在灾备站点立即可用。\n\
  \n这种方法的另一个优点是它不会产生实时同步的额外成本。可以使用开源代码工具来自动完成备份文件创建后立即将其移动到灾备站点的过程。或者，也可以编写脚本来处理此任务。\n\
  \n这种方法的缺点是，你将丢失数据库备份之间输入系统的数据。如果每天创建备份，通过回滚到最近的备份文件，你可能会丢失多达 24 小时的数据。\n\n## 12.8\
  \ 测试灾备环境\n\n你的生产环境在不断变化。为了确保你的灾备计划有效，需要定期对其进行测试。如果你的灾备计划没有经过测试，你只会在灾难发生时才会发现它的错误和缺陷。相信我，那不是你想要了解其问题的时候。\n\
  \n### 12.8.1 需要多频率测试一次？\n\n“定期”是指多频率？这取决于你的组织，但每年一次似乎是一个合理的开始。如果频率高于此，人们就没有时间顾工作了。如果频率更低，由于生产环境变化导致问题的风险就会增加。\n\
  \n如果你所在的行业有法律或法规要求存在灾备计划，那么它们可能也规定了测试的频率。咨询你组织的法律部门并听取他们的意见。毕竟，这正是他们拿薪水的原因，不是吗？\n\
  \n### 12.8.2 灾备测试是什么样子的？\n\n测试灾备计划并不复杂，但可能非常耗时。基本上，你模拟生产站点由于灾难而不可用的情况。然后按照灾备计划将\
  \ IT 活动转移到灾备站点。灾备计划中说需要做什么，你就做什么。测试步骤可能包括这里列出的那些。取决于你的灾备站点是冷备、温备还是热备，以下所有步骤可能并不适用。\n\
  \n- 在应用服务器上加载操作系统。\n- 在应用服务器上加载支持软件。\n- 在应用服务器上加载应用程序。\n- 确认已加载了正确版本的应用程序。\n- 将最近的数据库备份加载到灾备数据库服务器上。这可能需要你从离线存储设施请求最近的备份磁带。接收磁带的时间应与灾备计划中说明的时间相符。确认磁带可以读取。\n\
  - 确认应用程序可以访问数据库。\n- 确认刚刚加载的数据在应用程序中可见。\n- 验证所有用户都有权访问应用程序的 `URL`。\n- 验证所有用户的凭据都存在于中。\n\
  - 验证如果用户应该使用 `DNS` 值访问应用程序，该值是否有效。\n- 确认用户可以登录应用程序。\n- 验证用户可以通过应用程序的用户界面读取、写入、修改和删除数据。\n\
  - 如果灾备站点上的应用程序环境应该是集群化或负载均衡的，请确认这些方面运行正常。\n- 确认所有应该能够远程访问应用服务器的人都能这样做。\n\n当然，灾备计划中规定的要执行的操作可能存在某些例外。例如，如果灾备计划要求你购买新服务器，那么你可能想跳过这一步——可以使用现有服务器并在上面加载相应的软件吗？\n\
  \n如果你的应用程序需要 24/7 可用，那么某些步骤可能不可行。例如，用户可能指定一个域名如 `http://accounting.acmecorp.com`\
  \ 来启动基于 Web 的会计应用程序。该 `URL` 传递给 `DNS`（域名系统）服务器以转换为生产服务器的实际 IP 地址。域名一次只能指向一个服务器。它指向生产服务器或灾备站点，但不同时指向两者。如果在运行灾备测试期间用户需要访问生产应用程序，那么你就无法重新指向灾备站点。也许你可以使用另一个\
  \ `URL`，例如 `http://accounting-DR.acmecorp.com` 来启动应用程序的灾备版本。\n\n### 12.8.3 谁参与灾备测试？\n\
  \n灾备计划中提到的每个人都需要参与测试演练。这样做有几个原因。首先，这确认了他们的职责是准确的。如果他们执行灾备计划中分配的任务所需的相应的访问权限或经验，那么在测试中尽早发现总比在实际灾难中发现要好。\n\
  \n其次，通过参与灾备测试工作，人员正在为实际灾难进行练习。这种“演习”会在实际灾难发生时提高他们的效率。如果他们以前从未在灾备站点执行过这些操作，你就不能指望他们能正确完成。但在参与几次灾备测试后，如果发生真实灾难，他们应该会非常熟练了。\n\
  \n### 12.8.4 灾备测试的输出\n\n\n\n\n你的容灾恢复（DR）测试不太可能进展得非常完美。每次定期测试都是更新 DR 计划的机会。通过记录测试结果并进行事后分析以讨论结果，你可以从每次测试中学习，并让下一次测试获得更好的结果。\n\
  \n在 DR 测试期间，你特别应该关注的某些方面包括以下内容。遇到的任何更改都需要更新到 DR 计划中。\n\n*   新增或更改的硬件\n*   服务器名称的变更\n\
  *   新的或更改的域名\n*   新的或更新的应用程序\n*   新的或更新的支持性软件\n*   数据库变更，例如新增数据库、更改访问数据库所需的账户，或更新数据库客户端软件的版本\n\
  * 人员或其职责的变更\n*   新增使用该应用程序的部门、设施或国家\n*   备份文件、数据库、源代码或工具位置的变更\n*   必须遵循的新法律或更新的法律法规\n\
  \n## 12.9 生产环境与 DR 环境的比较\n\n虽然你的 DR 环境不需要与生产环境完全相同，但你始终需要意识到它们之间的不同之处。某些差异是预期且已计划在内的，但你仍然需要警惕那些未考虑到的差异。\n\
  \n以下章节指出了生产环境和 DR 环境可能存在差异区域。\n\n### 12.9.1 备份\n\n如果生产设施宕机且 DR 站点变为生产环境，你知道以下问题的答案吗？\n\
  \n*   是否在你的 DR 服务器上创建了备份？\n*   DR 环境的备份频率是否与生产站点相同？两个环境备份的内容是否相同？\n*   在 DR 服务器上创建的备份是否经过了测试，以确认其准确性和完整性？\n\
  *   是否已有计划将备份文件移至异地（即离开 DR 站点）？\n\n### 12.9.2 安全\n\n虽然在忙于搭建 DR 点的期间，安全可能不是你的首要考虑问题，但绝不应该忽视。组织的信息在主生产站点和\
  \ DR 站点都必须受到保护。测试过程中应包含的一些点包括：\n\n*   DR 站的安全策略是否与生产环境相同？\n*   访问控制和加密方法是否配置正确？\n\
  *   安全监控系统在 DR 环境中是否处于激活？\n*   事件响应程序是否已针对 DR 场景进行了更新？\n\n### 12.9.3 域名\n\n如果 DR\
  \ 环境使用的域名与生产环境不同，用户和系统将如何连接到它？\n\n*   故障转移期间，DNS 记录是否已更新以指向 DR 环境？\n*   内部应用程序配置是否已更新以处理新域名？\n\
  *   SSL/TLS 证书对于 DR 环境域名是否有效？\n\n### 12.9.4 防火墙\n\n防火墙规则必须在生产和 DR 环境之间同步，以确保灾难恢复期间的无缝通信。\n\
  \n*   DR 防火墙是否已开放所有必要的端口和协议？\n*   当生产环境发生变更时，防火墙规则是否同步更新？\n*   防火墙规则是否经过测试，以确保它们不会阻塞关键流量？\n\
  \n### 12.9.5 电子邮件\n\n如果你的应用程序依赖电子邮件通知，DR 环境必须具备发送这些通知的能力。\n\n*   DR 站点是否配置了邮件网关或服务器？\n\
  *   DR 环境的邮件记录（MX ）是否已更新？\n*   是否可以从 DR 站点发送和接收基于电子邮件的警报？\n\n### 12.9.6 FTP 传输\n\
  \nFTP（文件传输协议）用于系统之间的文件传输。如果你的应用程序使用 FTP，DR 环境必须支持此项。\n\n*   是否可以从 DR 环境访问 FTP 服务器？\n\
  *   FTP 访问所需的必要凭据和权限是否已镜像到 DR 环境中？\n*   是否已测试过 DR 站点与外部合作伙伴之间的文件传输？\n\n### 12.9.7\
  \ 吞吐能力\n\nDR 环境必须具备足够的带宽和处理能力来处理生产环境的负载。\n\n*   DR 站点的网络带宽是否满足生产环境的要求？\n*   DR 站点的硬件资源（CPU、内存）是否足以处理峰值负载？\n\
  \n\n\n\n\nDR 环境具有与生产环境相同的吞吐能力吗？它是否需要相同的容量？如果不需要，是否每个人都理解当在使用 DR 站点时，用户体验到的性能可能会变慢？需要提前警告他们这一点，以免在发生灾难时他们产生抱怨。\n\
  \n### 12.9.10 监控\n\n许多数据中心都包含监控工具，因此当关键指标达到不可接受的水平时，就会发送警报。如果你的生产环境包含监控，那么 DR 站点是否会进行相同类型的监控？这里是一些需要考虑的监控点。\n\
  \n-  你的 DR 服务器的监控方式是否与生产服务器监控的方式相同？\n-  监控过程是否为 DR 环境创建了与生产环境相同的警报？\n-  警报是否发送给相同的人员或组分发列表？\n\
  -  是否对 DR 环境的监控进行了测试？\n\n## 12.10 通信\n\n灾难发生期间的通信至关重要。每个人都需要提前知道 DR 团队将如何相互通信。在紧急情况下，你们的标准通信手段是什么？\n\
  \n-   个人之间的电话\n-   会议电话\n-   IM（即时消息）\n-   LiveMeeting、WebEx 等\n\n在组织基础设施恢复运行之前，考虑使用备用通信手段是值得的。例如，如果组织的电子邮件服务器无法工作，那么每个人都可以拥有\
  \ Hotmail 或 Gmail 账户。他们还可以在组织结构之外拥有一个 `IM` 账户。如果这样做了，那么每个人的备用联系信息都需要被记录并在并供所有人使用。\n\
  \n如果你将使用会议电话桥接，那么某些信息需要在现在就提供给所有人。这些信息包括：\n\n-  接入号码是你们组织的标准号码吗？如果不是，号码是多少？\n- \
  \ 每个人都知道它吗？\n-  由谁来主持会议？\n-  它是否具有国际通话能力？\n\n### 12.10.1 联系人\n\n每种组织都需要一份联系名单，列出发生问题时需要联系的人员。哪些人应该在联系名单上？\n\
  \n-   应用程序业务所有者\n-   应用程序管理员\n-   DBA\n-   数据中心工作人员\n-   帮助服务台（Help Desk）\n-   供应商支持服务台\n\
  \n你是否 get 联系名单上的每个人都拥有以下信息？\n\n-   姓名\n-   职位\n-   每个人的备用人员\n-   家庭电话号码\n-   手机号码\n\
  -   位置，即与 DR 站点的距离\n\n如果被叫的人不接听或不回电怎么办？呼叫者在升级到名单上的下一个名字之前应该应该等多久？10 分钟？20 分钟？30\
  \ 分钟？这应该在 DR 计划中定义，以免浪费时间等待一个可能永远不会回接的电话。\n\n## 12.11 做出激活 DR 站点的决策\n\n激活 DR 站点的决定不应轻率做出。最初看起来可能是灾难的问题，但实际上可能是一个很快解决的小问题。考虑到激活\
  \ DR 站点的成本和精力，只有在真正需要时才这样做是合理的。\n\n关于这一重大决定，应该预先提问许多问题。例如：\n\n-   谁有权做出激活 DR 站点的决定？\n\
  -   如果此人不在，谁是备选决策者？\n-   现场是否有人需要被通知，何时通知？\n-   如果 DR 站点是共享的，是否需要提前通知设施的所有者或管理人员？\n\
  -   将如何通知组织员工 DR 站点正在激活？一些可能的方法包括：\n-   呼叫树\n-   自动电子邮件\n-   自动电话\n-   自动短信\n- \
  \  当 DR 站点激活时，是否需要联系任何供应商？例如：\n-   为备用发电机提供燃料的供应商\n-   电信供应商\n-   为站点提供物理安的组织\n\
  -   提供咖啡、零食、瓶装水、汽水等等的供应商\n\n## 12.12 返回你的生产站点\n\n希望你的生产数据中心没有被毁，并且在某个时间点它将再次可用。你是否有概述生产环境如何移回原始生产数据中心的计划？返回主站点的步骤可能与将生产环境转移到\
  \ DR 站点的步骤非常相似。\n\n返回主站点的决定不应轻率做出。如果 DR 站点上的运行完全正常，那么过早返回主站点将是一个巨大的错误，因为可能会发现它并不像最初认为的那样稳定或功能完备。在确定主站点能够支持所有生产活动之前，留在\
  \ DR 站点可能是明智的。\n\n# 第 13 章\n\n# 处理应用程序问题\n\n## 摘要\n\n每个应用程序都会出现问题，应用程序管理员需要处理这些问题。本章列出了应用程序管理员在处理发生的问题时应该采取的步骤。\n\
  \n### 关键词 \n\n问题；停机；通信；服务；日志文件；事件查看器；记录问题；联系名单；监控；替代方案（work-around）\n\n我希望我不是在告诉你们没有复活节，但没有完美的应用程序。无论你支持的是哪种应用程序，总会有一天它运行不符合描述或预期。本章描述了当这一不可避免的一天到来时可以采取的步骤。\n\
  \n## 13.1 处理停机\n\n周一早晨，你的电脑还没有完成启动，你就接到一个电话说应用程序宕了。你该怎么办？处理应用程序停机时你应该采取什么顺序的步骤？以下步骤是我尝试的做法。它们并不适用于每个组织，但请根据你的情况选择适合的。\n\
  \n### 13.1.1 通知你的老板\n\n向老板通报潜在问题总是一个好主意。你不希望他从别人那里获知停机消息。发送一封电子邮件或 `IM` 告诉他 `XYZ`\
  \ 应用程序宕了，你正在调查只需要几分钟。这让他知道为什么你没有在处理其他任务或参加会议。\n\n### 13.1.2 确认问题存在\n\n在没有亲眼看到之前，我从不真正相信应用程序出了问题。用户已知会出错。应用程序对他们无法运行有很多原因。\n\
  \n-  他们可能在浏览器中输入了错误的 URL。\n-  他们可能输错了密码。他们的电脑可能没有连接到网络。\n-  问题可能仅限于他们的电脑或浏览器。\n\
  -  他们可能是远程连接，但在尝试登录应用程序之前忘记通过 `VPN`（虚拟专用网络）。\n\n独立确认问题存在可以通过你自己登录应用程序来实现。如果我可以访问应用程序，我通常会要求用户重启电脑并尝试登录应用程序。我还会要求他们清除浏览器的缓存。十有九，这些步骤中的某一步就能解决他们的问题。\n\
  \n\n\n\n\nping 应用程序服务器以确认其是否正在运行。在 Windows、UNIX 和 Linux 系统中，`ping` 命令将验证是否可以跨网络访问服务器。如果你收到了它的响应，那么这明确表明服务器正在运行。图\
  \ 13.1 是 Windows 系统上 `ping` 命令的截屏，以及响应通常的样貌。如果你收到的响应指示服务器不可用，请联系数据中心或系统管理员并请求重启服务器。\n\
  \n![image](img/F000133f13-01-9780123985453.jpg)\n\n图 13.1 Ping 命令。\n\n### 13.1.4\
  \ 你能登录服务器吗？\n\n下一步是尝试远程登录服务器，以确认它是否接受登录。如果你无法登录服务器，那么你也就无能为力。如果你和数据中心人员都无法登录服务器，那么唯一的选择就是请求重启它。一旦它恢复运行，检查日志以寻找关于发生了什么事的线索。\n\
  \n### 13.1.5 服务器是否极其繁忙？\n\n如果服务器的 CPU 极其繁忙，那么应用程序可能运行不佳，甚至可能根本没有运行。要确定 CPU 的繁忙程度，你可以在\
  \ Windows 服务器上运行 `Task Manager`，或在 UNIX 服务器上运行 `top` 命令。如果 CPU 活动率极高并保持在在该水平，那么显然出了问题。\n\
  \n确定哪些进程消耗了大部分 CPU 时间，可以为应用程序问题的原因提供重大的线索。图 13.2 显示了 Windows 任务管理器的输出。图 13.3 显示了\
  \ UNIX `top` 命令的输出。在这两个工具中，需要关注的列列是 `CPU` 和 `Memory`。在 `Task Manager` 中点击 `CPU`\
  \ 列标题非常有非常有帮助，这样就可以根据进程对 CPU 的使用量对它们进行排序。通常情况下，`System Idle Process`（系统空闲进程）将占用大部分\
  \ CPU 时间。如果另一个进程占用了大部分 CPU 时间，这可能解释为什么应用程序无法运行或性能不佳。\n\n![image](img/F000133f13-02-9780123985453.jpg)\n\
  \n图 13.2 Windows 任务管理器。\n\n![image](img/F000133f13-03-9780123985453.jpg)\n\n图 13.3\
  \ UNIX top 命令的输出。\n\n下一步是确定消耗所有 CPU 时间的任务实际上是做什么的。供应商的《管理员指南》可能会列出组成应用程序环境的进程。如果活动进程列在指南中，那么它将指示该进程的作用。\n\
  \n如果这个过度活跃的进程不属于应用程序，那么它可能属于已加载到服务器的某些支持软件。例如，它可能是监控软件、备份软件或防病毒软件包的一部分。要确定它属于哪种软件的一种方法是在互联网搜索引擎中搜索该进程名称。你很有机会找到该进程名称以及关于其作用的解释。\n\
  \n### 13.1.6 运行着哪些与相关的进程？\n\n应用程序是否有一个或多个应该运行的特定进程或服务？在 Linux 或 UNIX 服务器上使用 `Task\
  \ Manager` 或 `ps`（进程状态）命令来验证它们是否正在运行。\n\n在 Windows 服务器上，你可以调出 `Services Panel`（服务面板）查看应用程序相关服务是否正在运行。如果应用程序有\
  \ Windows 服务在运行，你应该考虑编写批处理文件或脚本来获取每个应用程序相关服务的状态。使用批处理文件提取这些信息比手动操作更快且更不容易出错。这里列出了此类脚本示例。\n\
  \n```\nREM ACCOUNTING services status\n\nsc query AcctAdminServer | find “STATE”\n\
  \nsc query AcctServer1 | find “STATE”\n\nsc query IstageBPMAdminServer | find “STATE”\n\
  \nsc query IstageBPMCS1 | find “STATE”\n\npause\n```\n\n### 13.1.7 日志文件中包含什么？\n\n\
  日志文件由服务器操作系统和许多应用程序创建，用于记录它们的活动，包括问题情况。你应该检查所有可用的日志文件，查看它们是否包含你正在研究的问题详情。\n\n某些应用程序维护多个日志文件。其中一个可能包含启动过程中的条目。另一个可能只包含与功能相关的条目。如果应用程序维护日志文件，那么这些是获取其遇到的任何问题详情的首选且最佳来源。\n\
  \n如果你不知道应用程序创建的日志文件的名称和位置，那么你需要立即了解这些。检查《管理员指南》以获取这些信息。如果你在该文档中没有找到，请向供应商的支持服务台提交请求获取这些信息。知道这些日志位于何处至关重要，以便在问题发生时能够快速访问它们。\n\
  \n如果你就问题向供应商提交工单，他们很有可能想要任何所有可能包含问题详情的日志文件副本。某些供应商要求你在向他们提出的每个工单中附上日志文件。\n\n越早捕获这些日志文件越好。这是因为日志文件会随着时间的推移而积累条目。你等待复制日志文件越久，与你的问题无关的条目就越多，因为它们是在问题发生后创建的。更糟糕的是，某些日志进程每天午夜创建一个新文件。等得越久，寻找你需要的日志条目就越困难。一旦确认存在问题，尽快捕获日志文件，为你自己和供应商帮个忙。\n\
  \n如果供应商要求你始终捕获并向他们转发同一组日志文件，那么编写脚本或批处理文件来自动化此过程可能是高效的。下面的代码示例显示了一个批处理文件，它可以从多个不同的子目录捕获日志文件，并将它们复制到单个目录，以便更方便、更快地发送给供应商。\n\
  \n```\nREM 使用此批处理文件捕获版本 6.0 日志文件发送给供应商\n\nREM 1) 创建一个如下子目录 D:\\Account\\20121118_Logs\\\
  \n\nREM 2) 将 SaveLogs60.bat 拷贝到该子目录\n\nREM 3) 执行 SaveLogs60.bat\n\nREM 4) 确认预期目录和文件已创建\n\
  \nREM 5) 从新子目录删除 SaveLogs60.bat\n\nREM 6) 压缩子目录并发送给供应商\n```\n\n#### 13.1.7.1 系统日志中包含什么？\n\
  \n如果服务器是基于 Windows 的，那么查看 O/S 相关日志条目的方法是在`管理工具 | 事件查看器`中。有四类主要的日志：`应用程序（Application）、`安全（Security）、`安装（Setup）和`系统（System）。你需要检查每个类别，以确保不会遗漏任何与你的问题相关的信息。图\
  \ 13.4 是事件查看器的截屏。在截图中，高亮的条目显示特定服务已停止。这可能代表了应用程序的问题。\n\n![image](img/F000133f13-04-9780123985453.jpg)\n\
  \n图 13.4 Windows 事件查看器。\n\n### 13.1.8 问题可能与数据库有关？\n\n\n\n\n由于大多数应用程序都依赖于数据库，因此数据库实际上可能是问题的所在，而不是应用程序软件。确认此点的一种快速方法是查看数据库服务器和数据库本身是否正常运行。操作步骤包括：\n\
  \n- `Ping` 数据库服务器。如果该服务器对 `ping` 没有响应，则可能意味着数据库服务器已宕机。也可能意味着存在网络或防火墙问题。此时，你应该将重点放在可能的因素数据库服务器上。联系\
  \ DBA 团队并要求他们登录该数据库服务器查看其是否运行正常。如果他们回复说服务器和数据库正常，那么可能是应用程序服务器和数据库服务器之间存在网络或防火墙问题。请联系网络团队寻求帮助。\n\
  \n  一旦解决了数据库、网络或防火墙问题，请尝试在应用程序中重复导致初始问题的场景。如果问题无法重现，那么你很可能已经解决了问题根源。\n\n- 如果你能够成功\
  \ `ping` 数据库服务器，那么下一步是确认数据库本身是否可用。通过交互式工具（如 Oracle 的 SQL*Plus、`Oracle SQL Developer`、`Toad`、`Query\
  \ Browser` 等）建立数据库连接。如果能够建立连接，那么你可能排除数据库作为问题源。\n\n  如果连接失败，那么很有可能是数据库连接性是问题的原因。联系\
  \ DBA 团队并让他们确认数据库已启动。一旦他们恢复了数据库备份，登录应用程序并尝试在其中重现问题。如果问题无法重现，你很可能已经解决了它。\n\n某些应用程序无法很好处理数据库连接的中断。如果数据库连接丢失（即使是瞬间的），应用程序无法或不会尝试重新建立数据库连接。如果这描述了你的应用程序，那么在解决与数据库的问题后，请务必重启应用程序。\n\
  \n### 13.1.9 何时向供应商寻求帮助\n\n如果你以前遇到过这个问题，并留有如何解决它的记录，那么你极有有机会在不需要供应商帮助的情况下解决它。如果你的应用程序管理员团队记录了所遇到的每一个事件（包括解决问题的步骤），那么你将很可能可以使用这些信息自行进行纠正。第\
  \ 13.1.10 节 描述了对于应用程序发生的每次事件应保留的文档类型。\n\n如果你遇到的是一个以前从未见过的问题，且上述建议没有帮助解决它，那么你可能需要向供应商寻求帮助。供应商通常提供多个级别的协助。他们希望客户使用的初始级别帮助是可搜索的知识库。该数据库包含了客户遇到的每个问题的详细信息，包括可能的解决方案。\n\
  \n如果你有支持合同，可能已经收到了他们的支持网站地址。通常，该网站包含一个可搜索的知识库。它允许你指定正在使用的应用程序版本。然后输入问题的描述并点击搜索按钮。如果应用程序显示了错误代码或消息或将其写入日志，请根据该错误代码或描述进行搜索。如果搜索返回结果，请仔细阅读，以确保描述的问题与你遇到的问题相同。如果是，请按照列出的说明解决问题。\n\
  \n如果供应商不提供知识库，或者知识库中不包含你的问题，那么你的下一步通常是向供应商的支持服务台提交一个工单（ticket）。在创建工单时，填写信息必须尽可能详细和准确。你提供的初始信息越准确越完整，他们就能越快提供实用的帮助。\n\
  \n供应商的工单系统可能会要求提供一组关于你遇到的问题的标准信息。务必提供必要的信息，但只要相关，就不要担心输入额外的细节。以下细节务必提供给他们的支持服务台：\n\
  \n- 你的公司名称。\n- 你的姓名和联系方式。\n- 你偏好的联系方式，例如电话、电子邮件、即时消息（IM）、或通过其支持网站。\n- 使用的应用程序名称，以防供应商有多个产品。\n\
  - 应用程序版本。\n- 你服务器上的操作系统。\n- 环境是否为负载均衡。\n- 环境是否为集群化。\n- 受影响的是否为生产环境。\n- 对问题的详细、准确描述。务必包含显示的任何错误信息以及你找到的任何日志条目。截图非常有帮助。\n\
  - 已经采取了解决问题的步骤以及影响如何？例如，如果你停止并重启了应用程序、重启了应用程序服务器或重启了用户工作站，请务必提及这些。他们可能会建议你执行这些步骤。通过告诉他们你已经做了什么，你可以节省时间。\n\
  - 此问题是影响了所有用户还是仅一个用户。\n- 此问题是影响了单个地点还是多个用户地点（例如多个办公室、多个城市）。\n- 问题何时发现的。\n- 以前是否遇到过这个问题。\n\
  - 系统最近是否发生过任何更改。例如，操作系统或支持软件的补丁、最近的应用程序升级、使用了应用程序的新包或新功能、新的分支正在使用该应用程序、数据库服务器的变更。\n\
  - 描述遇到问题时的场景。如果可能，列出导致问题发生之前的步骤或屏幕。如果应用程序中有多种方法可以到达该特定屏幕，这会对供应商支持团队很有帮助。\n- 如果供应商支持通常要求你收集并向他们发送某些日志文件，请务必现在就这样做。通过在初始请求中提供这些信息，你可以避免他们再次向你索取并浪费响应时间。\n\
  \n当你向供应商提交工单时，第一个查看它的可能是 1 级支持人员。该技术人员将检查你提供的信息，看是否有显而易见的答案，例如，你输入了错误的 URL 或明显无效的参数。如果修复方法显而易见，他或她可能会咨询知识库查找类似问题的工单。如果数据库中不存在像你这样的问题，工单将重新分配给\
  \ 2 级支持技术人员。\n\n### 13.1.10 记录问题\n\n将你在解决问题期间所做的操作都记录在一个名为“事件报告”（Incident Report）的内部文档中。你提供的细节越详细，对你或未来的其他人就越有价值。侧边栏提供了一个事件报告的示例。\n\
  \n事件报告的准确布局并不重要。至关重要的是该文档包含了关于该问题的特定信息。分解它的一种方法是包含以下章节：\n\n- 应用程序名称\n- 日期/时间\n-\
  \ 涉及人员\n- 问题\n- 措施/结果\n- 根原因\n- 概述\n\n\n\n“操作/结果”部分需要特别详细。如果在调查和解决问题期间使用了电子邮件或即时消息（IM）进行通信，则应对这些消息进行总结并插入到《事件报告》中。一个完整的“操作/结果”部分应包含：\n\
  \n- 处理问题的人员之间的通信总结，包括日期和时间\n- 在调查问题期间对系统进行的更改\n- 系统恢复运行的日期和时间\n- 应用程序或服务器是否被关闭并重启\n\
  - 为此问题开的工单号（包括内部工单和供应商工单）\n- 来源，例如获取信息的日志文件、事件文件\n- 此问题是否与过去遇到过的类似问题相似。如果是，请包含之前事件的日期\n\
  - 提供给供应商支持团队的详细信息\n- 从供应商支持团队收到的建议\n- 供应商支持团队建议的任何临时解决方案\n- 做了什么来解决问题？例如：更改了配置设置、替换了库文件、更新了驱动程序、为服务器增加了内存、重启了系统、更新了数据库参数、修改了数据库中的表值、在用户工作站或网络浏览器上进行了更改\n\
  \n事件报告需要发布在所有人都能访问的地方。这可能是网络驱动器或门户网站。具体位于何处并不重要，重要的是要放在一个所有人都能访问且全都知道其所在位置。\n\n\
  最好尽早开始撰写事件报告。开始得越早，你对事件的记忆就越准确。事件报告在最初创建时并不需要完整。例如，你可能仍在等待供应商支持团队的建议。问题的根因可能一段时间后才能确定，因此该部分在确定相关信息之前可以留空。只需确保你不要忘记回去完成它即可。\n\
  \n# 事件报告示例\n\n生产环境 AccountingApp 服务器 oma001\n\n2013 年 11 月 18 日\n\n本文中的所有时间均为中部标准时间\n\
  \nIGG: Kelly Bourne, John Maxwell, Shawn Torson\n供应商: Peter Hill\n\n## 问题\n\n在凌晨\
  \ 4:08 左右，AccountingApp 服务 Server1 和 IstageBPMCS1 停止运行。这导致 AccountingApp 应用程序崩溃。\n\
  \n## 操作/结果\n\n上午 7:49，我收到了 John Maxwell 的封邮件，告知我 AccountingApp 已掉线，并要求我将其恢复。\n\n\
  我登录了服务器 `oma001`，发现四个 AccountingApp 服务中的两个（Server1 和 IstageBPMCS1）已停止。由于这些服务必须按照特定顺序启动，我停止了所有服务并使用供应商提供的脚本重启了它们。应用程序恢复运行。\n\
  \n上午 8:01，我给 John 发了邮件，告知他 AccountingApp 现在已恢复。\n\n上午 8:04，我给我们的帮助热台发了邮件，开开一个工单（`#\
  \ 64034`）来处理此问题。\n\n上午 8:05 左右，我收集了供应商要求在开启工单时提供的日志文件。登录供应商的支持网站，开了一个工单，以请求协助解决此问题。由供应商工单系统创建的服务请求号为\
  \ `61486`。\n\n我检查了所有日志文件，发现有条目显示两个服务在凌晨 4:08 停止了。\n\n上午 10:12，我给 Shawn 发了邮件，询问 AccountingApp\
  \ 服务器上的关键服务是否正在接受监控。如果没有监控，我请求开始对其进行监控。\n\n下午 12:27，供应商支持回复了工单，要求我查看事件查看器中包含引用服务\
  \ `beasvc` 停止的条目。\n\n下午 1:21，我回复了该邮件，提供了带有 `beasvc service` 的条目示例。这些条目证实了问题发生在 2013\
  \ 年 11 月 18 日凌晨 4:08。\n\n下午 1:46，Peter 要求我向他发送两个特定的转储文件（dump files）。当时的建议是：\n\n\
  - IstageBPMCS1 服务停止，因为它无法连接到 Server1 传输消息。\n- IstageBPMCS1 和 Server1 被配置为 JMS 桥接。我们需要找出为什么\
  \ Server1 在该期间不可用。\n\n下午 1:54，我向 Peter 提供了请求的文件。\n\n2013 年 11 月 19 日上午 9:03，Peter\
  \ 说我昨天发送的日志文件包含 Server1 服务停止的原因的迹象。他表示：“遗憾的是，没有任何日志包含了如 Windows 事件查看器报告报告的 11 月\
  \ 18 日凌晨 4:08:16 Server1 服务停止的原因。”\n\n上午 10:23，他要求我提供日志文件 `C:\\AccountingApp\\Domain\\\
  hs_err_pid*.log`。\n\n上午 10:28，我向他发送了三个符合该名称格式的文件。\n\n上午 11:15，Peter 说他已经确定了崩溃的原因。\n\
  \n崩溃发生在 JVM（Java 虚拟机）中，是在运行该函数的热点编译代码时：`com.accountingapp.apps.ButtonLoader.doLoad()`。\n\
  \n目前的临时方案是排除该函数。真正的修复将在新版本的 JVM 中。发布日期尚未知。\n\n11 月 19 日晚上 8:17，Peter 回复说问题是随机发生的，所以如果另一个用户点击同一个页面，并不保证会发生崩溃。\n\
  \n11 月 19 日晚上 10:29，Shawn Torson 发来邮件，说所有（4 个服务器，3 个服务器）现在都在接受监控。如果其中任何一个停止，将发出警报。\n\
  \n## 根因\n\nAccountingApp 内部的代码错误导致用户在执行正常操作（例如点击按钮）时应用程序崩溃。\n\n## 概述\n\n我在 2013\
  \ 年 6 月 6 日上午 7:49 被告知 AccountingApp 已掉线。应用程序在上午 8:01 恢复。供应商支持将问题追溯到代码错误。错误将在未来的版本中修复。目前没有发布日期。已有临时解决方案。\n\
  \n我与 Shawn Torson 协作，已将所有（4 个服务器，3 个服务器）都添加到了对服务器的监控中。如果其中任何一个停止，我们将收到警报。\n\n##\
  \ 13.2 联系供应商\n\n不同的供应商通常提供不同的方式联系他们以报告应用程序问题。我见的最常见方法有：\n\n1. 电话\n2. 电子邮件\n3. 通过其网站\n\
  \n我对报告问题的偏好顺序如下，具体原因见此处。你对其他供应商的经验可能会认为其他联系方法更佳。\n\n- 网站——通过在基于网络的工单系统中输入问题报告，我有很大把握我输入的内容会被准确记录为问题细节。这不会出现电子邮件中可能出现的复制粘贴问题，也不会出现电话通话中可能出现的误解。\n\
  \n\n\n\n\n- **电子邮件 (E-mail)**：虽然这种方法的优点可以让我用自己的话来描述问题，但接收方可能会将我邮件中的文本复制并粘贴到数据输入表单中。如果必须这样做，就可能出现错误。\n\
  \n通过电子邮件开通工单（ticket）的另一个缺点是，如果我提供的是自由格式的问题描述，我很有可能遗漏某些必要信息。供应商的首次联系将是请求缺失的信息。在获得所有需要的信息之前，他们将无法开始调查问题。\n\
  \n- **电话 (By phone)**：我觉得这是报告问题效率最低且最准确的方法。最大的问题是，我必须口述我的问题描述，而电话另一端的人进行记录。这既不准确也不高效。它花费的时间更长，而且没有另外两种方法任何一种准确。如果有选择，我会避免通过电话提交问题报告。\n\
  \n电话的优点是，一旦接通电话，就可以与技术人员进行即时交互。另一方面，如果支持设施位于另一个国家，语言带来的挑战是无法到最低的。\n\n当供应商响应你的请求时，他们可能会给你一个工单编号。不要弄丢它！每当你想就该问题联系供应商时，都需要引用这个编号。如果你通过电子邮件与他们通信，那么工单编号应该包含在主题行中。如果你想在他们的网站上查找工单，你几乎肯定通过他们给你的工单编号来查找。\n\
  \n### 13.2.1 谁允许联系供应商？\n\n某些供应商限制了你组织中能够联系其支持团队的人数。限制可能是三或四个人。这样做的原因之一是让你的联系人在某种程度上通过一个小小组进行引导。如果没有进行这种渠道化，你组织中的不同个人可能会在不经意间开启重复的协助请求。\n\
  \n谁会被选为这少数人之一？通常情况下，我建议将技术性较强的人列为你的联系人。向供应商提出的很多问题以及他们的回复在性质上都是极其技术性的。如果联系人不具备技术素养，那么确实存在混淆的可能性。\n\
  \n如果你的某个联系人离开公司或更换工作，请务必及时更新联系人列表。一旦你意识到某人将不再负责该应用程序，请请求供应商删除旧姓名并替换为新人的姓名。务必提前了解如何进行操作，以免在需要设置新联系人时浪费宝贵的时间。\n\
  \n## 13.3 防止或缓解停机\n\n及时有效地做出响应以解决停机是一个需要追求的目标。但可能做得更好吗？是否可能完全防止停机，或者响应速度之快，以至于大多数用户甚至没有意识到它的发生？这个问题的答案是：是的，可以防止或最小化问题的发生。\n\
  \n### 13.3.1 监控 (Monitoring)\n\n设计良好的监控过程可能在问题达到实际导致停机的水平之前捕捉到即将发生的问题。例如，如果可用磁盘空间量减少到接近零，那么操作系统或应用程序可能会崩溃。如果监控过程能够在可用空间低于设定的阈值（例如\
  \ 5% 或 10%）时向你发出警报，你就可以干预并释放磁盘空间，防止潜在停机的发生。\n\n监控其他关键指标可以让你发现可能导致停机或性能问题的情况。要监控的一些常见指标包括以下：\n\
  \n- 发生了 CPU 瓶颈\n- 磁盘可用空间低于告警阈值\n- 磁盘可用空间低于临界阈值\n- 发生了磁盘瓶颈\n- 发生了内存瓶颈\n- 网络活动超过告警阈值\n\
  - 网络活动超过临界阈值\n- 发生了网络错误\n- 服务器已重启\n- 发生了登录尝试失败\n- 集群成员已从集群成员中移除\n- 类型为自动的服务未运行\n\
  - DNS 服务器无法解析计算机名称\n\n设计良好的监控实现可用于发现预测系统正在接近极限的趋势。此类预测提供了在故障发生前升级基础设施的警告。这无疑是防止停机和性能问题的一种方法。\n\
  \n为了确保有效，你的监控系统必须查看正确的指标，并在出现问题时必须发送适当的警报。\n\n- 警报必须发送给正确的人。\n- 警报必须通过正确的通道发送。电子邮件很棒，但如果收件者下班回家或过周末，那么关键邮件可能等到周一早上才被阅读。解决这一局限性有两种方法：\n\
  \n1. 如果你有一个 24×7 小时有人值的帮助服务台或其他小组，他们应该被抄送该电子邮件。如果在工作时间后收到关键警报，他们将致电应用程序运行手册（Playbook）中列出的主要联系人，告知其该问题。\n\
  2. 如果监控系统除了发送电子邮件外还可以发送短信，请利用此功能就此问题提醒人员，无论问题何时发生。如果采用此选项，请确保只将关键警报作为短信发送。如果支持人员在凌晨\
  \ 2 点被吵醒，他们会非常生气。\n\n### 13.3.2 自动处理停机\n\n如果可以自动化一个解决导致停机问题的流程，请考虑这样做。这样做可以无论在什么时间或日期都纠正状况。例如，我支持的一个应用程序偶尔会停止工作。供应商说这是一个已知问题，将在下一次重大升级中修复。遗憾的是，他们无法告诉我们该升级何时发布。折中的修复方案是在问题发生时手动停止应用程序然后重启它。\n\
  \n我们组织使用监控包来监控故障的应用程序服务（此类监控包示例：`OpenView`、`Nagios` 和 `SolarWinds`）。如果服务停止，脚本将停止应用程序并重启它。通过这种自动化，我们知道即使问题发生，应用程序最多停机\
  \ 10 分钟。该服务每天 24 小时每周 7 天进行监控，因此即使在深夜停止也会立即恢复。\n\n替代方案是让用户在发现后立即报告停机。一旦问题被报告，帮助服务台将联系应用程序管理员，由其远程登录系统并停止/重启应用程序。端到端的时间可能长达一小时。监控服务并自动停止/重启流程已经非常成功。\n\
  \n### 13.3.3 问题发生时获取通知\n\n在问题发生时获取通知并不能解决问题，但它是修复问题的第一步。尽快获得问题通知至关重要。自动通知流程通常比依赖用户发现并报告问题要好。\n\
  \n\n\n\n如果主应用程序管理员无法联系上怎么办？如果主要联系人在约定的时间内（例如 10 或 15 分钟）没有响应，是否应该联系次要联系人？帮助台或监控系统是否知道每个应用程序次要联系人是谁？每个应用程序的完整联系人列表应放在相应的运行手册（Playbook）、门户网站或其他已知位置中。\n\
  \n### 13.3.4 监控工具\n\n监控技术从简单到复杂，从免费到昂贵皆有。根据可用选择，对于每种预算和环境，都有监控你的应用程序和服务器的方法。\n\n\
  #### 13.3.4.1 监控工具\n\n监控 Windows 服务器上的服务最简单的方法也许是“服务”面板中的一个选项。右键点击某个服务并选择`属性`，然后选择`恢复`选项卡。将显示如图\
  \ 13.5 所示的屏幕。此屏幕提供了处理服务失败的第一次、第二次及后续情况的选项。\n\n![image](img/F000133f13-05-9780123985453.jpg)\n\
  \n图 13.5 Windows 服务面板中的恢复屏幕。\n\n`恢复`选项卡允许你设置服务失败时服务器的响应方式。每个失败计数旁下拉列表框中的选项有：\n\n\
  *   不采取操作——这是默认设置，除非你对其进行修改，否则服务失败时将不会采取任何操作。\n*   重启服务——如果重启服务可以让应用程序恢复，请选择此选项。\n\
  *   运行程序——如果让应用程序恢复比仅仅重启服务更复杂，请选择“运行程序”选项。运行的程序几乎可以执行你任何让它执行的操作。例如，它可以发送电子邮件或短信。它可以运行脚本来捕获日志文件。它可以停止应用程序然后重启它。或者执行以上所有操作。\n\
  *   重启计算机——最后一个选项“重启计算机”，如果关机并重启服务器是让应用程序恢复的唯一方法，那么这将是一个可行的选项。如果服务器上运行着多个应用程序，那么此选项可能就不合适，因为这将导致它们也停机。\n\
  \n#### 13.3.4.2 开源监控工具\n\n如果你想走这条路线，有很多开源监控工具可用。`Zabbix`、`Zenoss`、`OpenNMS`、`Nagios`\
  \ 和 `Ground Works` 是这些工具的示例。`Nagios`提供的某些功能包括：\n\n*   对多个服务器上的系统指标、应用程序和服务进行监控。\n\
  *   组件故障时发送警报。这些警报可以是电子邮件或发送到手机的短信（短消息服务）。\n*   如果 IT 人员没有及时确认警报，警报将升级并发送到不同的组。\n\
  *   可以创建报告，提供事件、警报和响应的历史记录，以供日后审查。这些对于事后调查或问题的趋势分析非常有用。\n*   可以为应用程序定义维护期。例如，应用程序可能每天晚上关闭以便进行备份。如果应用程序或服务器在这些预定义的时间段内发生故障，则不会创建警报。\n\
  \n#### 13.3.4.3 商业监控工具\n\n有许多商业监控工具可以选择。两个选择是 `HP OpenView` 和 `SolarWinds IT Management\
  \ Software`。这些软件包都提供了大量的函数和选项。与 `Nagios` 类似，它们允许应用程序管理员监控多个服务器上的应用程序、系统指标和服务。如果被监控的内容偏离了定义值或状态，它们还可以发送警报。\n\
  \n### 13.3.5 是否需要立即响应？\n\n并非所有应用程序都需要立即采取行动。它们可能只在正常工作时间内使用。它们提供的功能可能不是关键的。如果它们在半夜崩溃，那么等到第二天早上再重启它们是可以接受的。你如何决定什么问题重要到需要监控并为其设置警报/通知？事件是否需要立即响应应该写入应用程序的\
  \ `SLA`（服务水平协议）中。如果 `SLA` 规定停机将立即处理，那就是你的答案。\n\n## 13.4 向用户通报问题\n\n如果检测到问题，你就必须尽可能通知用户社区该问题。如果不这样做，更多的用户可能会遇到该问题，导致他们感到沮丧。很有可能会打开多个报告同一个问题的工单，这从而让你也感到沮丧。发布已知问题的消息对大家都有好处。\n\
  \n与用户通报问题还有其他非常好的理由。它让让他们知道问题正在被积极处理。知道你正在处理问题对用户有明确的镇静作用。定期向他们发送进度报告，表明问题仍在处理中。在这些通信中抄送你的老板也是一个好主意。这样，他或她就不会对停机或其他对生产应用程序的打击感到意外。\n\
  \n你如何向用户通报已知问题？这个答案很大程度上取决于你的组织。以下建议是考虑通知你的用户的方法。发挥一点想象力，你一定能提出更好的方法。\n\n*   登录页面——签名或登录页面可以显示消息吗？如果是，这是解决此问题的极佳方案。确保不要让该区域信息过载。如果是，用户将不会阅读，从而失去这一机会。\n\
  *   公告页面——某些应用程序在登录页面之前的页面称为公告页面。通常，它只是告诉用户应用程序是否可用或是否正在维护。如果你有公告页面，这是发布已知问题的另一个绝场所。\n\
  *   电子邮件——如果存在所有用户的邮件列表，可以通过电子邮件向所有用户发送已知问题。确保谨慎使用这种技术，以避免用户信息过载。对于许多人来说，对信息过载的反应是忽略所有信息。\n\
  *   通知高级用户，让他们将其传递给其他用户。这种方法最大的优势是高级用户很可能理解你在说什么，并能有效地向他们的团队或站点传递信息。\n*   通讯报——如果你的组织有每周或每月的通讯报，且接收者中大部分是应用程序的用户，那么考虑包含一篇关于该问题的短文。无法保证每个人都能看到，但某些用户肯定会看到。运气好的话，他们会在遇到问题之前或之后告知同事。\n\
  *   公告栏海报——如果应用程序的所有用户都位于同一区域，那么在该区域的公告栏上发布已知问题信息是可行的。\n\n\n\n\n在尽快恢复系统与花费足够时间收集确定问题根源所需的信息之间，存在着一种非常微妙的平衡。有时，恢复应用程序的动作本身就会破坏或隐藏导致停机的证据。快速恢复作为一种短期解决方案可能是好的，但它并不能帮助你理解问题或防止问题在未来再次发生。\n\
  \n平衡这些竞争需求的一种方法是编写脚本，这些脚本可以比人工操作快得多且更准确地收集所需信息。通常情况下，供应商的帮助热线会在你报告错误时要求你捕获的一组日志文件。请提前花时间编写一个脚本或批处理文件，将这些日志文件复制到临时子目录。这样当错误发生时，你可以运行脚本并几乎瞬间完成。\n\
  \n脚本可以发挥用处的另一个领域是显示进程或服务的状态。例如，某个应用程序可能需要一个或多个服务正在运行才能成功处理用户请求。要检查这些服务，你可以打开 Windows\
  \ 服务面板并逐个查看每个服务。更快的方法是编写一个脚本，为这些服务每一个执行 `sc query` 命令。图 13.6 显示了一个检查运行在两个不同服务器上的七个服务状态的脚本输出。除了更快和更准确之外，此类脚本的输出可以在单个命令行窗口中呈现所有服务的状态。捕捉此窗口的截图是向事件报告中添加文档的简单方法。\n\
  \n![image](img/F000133f13-06-9780123985453.jpg)\n\n图 13.6 显示 Windows 服务状态的脚本。\n\n\
  # 第 14 章：运营活动\n\n## 摘要\n应用程序支持包括一些需要重复执行的任务。这些任务列表需要被识别并尽可能高效地处理。本章描述了需要处理的任务类型，并描述了简化或自动化这些任务的潜在方法。\n\
  \n### 关键词\n周期性任务；备份；加密；应用程序监控；内存泄漏；日志文件；补丁周末；性能指标；漏洞评估；服务器访问；硬件寿命结束；添加用户；删除用户；LDAP；SSO；任务调度\n\
  \n在支持应用程序时，你几乎会有需要根据需要或按计划定期执行的任务。周期性任务可能需要每天、每周、每月、每季度或每年重复。通过提前识别并记录这些任务，你就不太忽略它们。记录这些任务的额外处处是，如果你在需要执行时恰好不在，你的备份人员可以处理它们。\n\
  \n执行运营活动的频率取决于许多因素。其中包括：\n- 供应商推荐的最佳实践\n- 贵组织定义的最佳实践\n- 产品用户组中其他应用程序管理员建议的最佳实践\n\
  - 如果上述来源没有涵盖，则请使用你的常识\n\n## 14.1 每日任务\n像本节中这样相对简单的任务几乎每天都需要执行。这些任务处理起来并不长时间，但它们不是你希望无限推迟的事情。\n\
  \n### 14.1.1 创建备份\n成功创建备份的重要性无论如何强调都不为过。一旦备份过程建立起来并运行良好，就很容易忽视它，但这是一个巨大的错误。你需要定期确认备份过程是无错误的，并且输出实际上是可用的。你还需要定期确认你是否确实备份了你认为需要备份的所有内容。\n\
  \n大多数应用程序每天都会创建一个备份。然而，对应用程序可以进行不同类型的备份。一些不同类型是：\n- 全量备份——每个文件都进行备份。通常每周执行一次。\n\
  - 差异备份——备份自上次全量备份以来更改的文件。\n- 增量备份——仅备份自上次增量或全量备份以来更改的文件。\n\n#### 14.1.1.1 备份了什么？\n\
  定期创建备份是一项基本需求，但你确切知道备份了什么吗？有些文件需要备份，而另一些则不需要保留。备份的是正确的文件吗？为了在驱动器故障或损坏时能够恢复服务器，应该备份的一些文件示例包括以下文件类型：\n\
  - 数据\n- 可执行文件\n- 贵组织实施的自定义内容\n- 支持文件，如注册表、ini 文件、资源文件、属性文件、xml 文件等\n- 用户配置文件\n-\
  \ 日志文件\n\n#### 14.1.1.2 备份文件存储\n一旦创建了备份，就需要对其进行保护。备份带或磁盘存储在何处？异地站点物理上安全吗（即：是否有锁的房间、签入/退出程序等）？它是否免受热、冷和水等自然因素的影响？\n\
  \n你的备份计划包含备份介质的异地存储是绝对必要的。因为如果备份介质存储在生产站点并发生了灾难，你可能会失去一切！异地存储可以放在像 Iron Mountain\
  \ 这样的商业运营机构，或者放在贵组织运营的另一个位置。你需要确保存储站点足够远，不至于受到袭击生产设施的灾难影响。\n\n如果备份介质存储在异地，则需要询问许多额外问题：\n\
  - 从另一个站点检索备份介质的流程是什么？\n- 它能多快交付到生产地或灾备地？\n- 它将加载在哪里（即在哪些驱动器上）？\n- 备份文件的正常清理过程会删除恢复的文件吗？如果你的清理过程是日期驱动的（例如自动删除\
  \ `x` 天以前），就会这种情况。\n- 请求备份介质并恢复它的流程是否经过过测试？最近测试过吗？\n\n#### 14.1.1.3 保留\n你的备份保留多久？关键备份（例如季度末或年底）是否保留时间更长？这种保留期限是由贵行业的法律要求驱动的吗？\n\
  \n磁盘或磁带释放后会发生什么？\n- 上面的文件被销毁了吗？\n- 如果涉及物理介质（例如磁带），它是被销毁还是重复使用？\n- 文件销毁的方式是否使得文件无法恢复？\n\
  - 贵行业对于备份文件的销毁是否有标准？贵组织是否遵循这些标准？\n\n#### 14.1.1.4 从备份恢复\n从备份恢复是一项高压活动。它不仅执行频率相对较低，而且如果正在执行该项操作，很可能生产环境发生了非常糟糕的事情。为了最大化成功的几率，恢复过程需要进行详尽的记录并定期进行测试。该过程的文档需要供需要的团队能够方便获取。\n\
  \n\n\n\n\n# 从备份恢复系统取决于所创建的备份类型。从全备恢复严格来说只是从备份介质中加载文件的问题。如果通过全量备份与差异或增量文件的组合进行恢复，那么你需要加载最近的全量备份介质，然后按照时间顺序加载差异或增量介质。例如，如果在每个周五进行全量备份，而在其他日期进行差异备份，那么在周三恢复系统的步骤如下：\n\
  \n1. 加载周五的全量备份文件\n2. 加载周六的差异文件\n3. 加载周日的差异文件\n4. 加载周一的差异文件\n5. 加载周二的差异文件\n\n每晚执行一次全备会更简单，但它们耗时更长且消耗的存储空间更多。将全备与增量或差异备份相结合更高效且所需的空间更小，但增加了恢复过程的复杂度。\n\
  \n提前考虑的问题包括：\n\n- 谁有权决定进行恢复？\n- 如果主要决策者不在，，此人是否有备选人员？\n- 是否练习过恢复过程？上一次执行是什么时候做的？\n\
  - 执行恢复需要多长时间？\n\n## 14.1.1.5 加密\n\n如果你的数据包含 PII（个人身份信息），则备份介质应当加密。如果将其存储在异地，这一点尤为重要。行业媒体上经常有关于备份带丢失的故事。如果它们没有加密，那么介质上的任何数据对于任何发现或偷走介质的人来说都是可见的。\n\
  \n使用的是哪种形式的加密？它足够强大并将坏人隔之门外吗？安全和加密领域每天都在变化。我今天能写的任何指南在书上架之前就会过时。你最好的行动方案是咨询专家，了解应该选择和部署什么样的加密算法和密钥大小。\n\
  \n## 14.1.2 备份确认\n\n“备份”一词的通用定义是将文件从服务器磁盘驱动器复制到另一个存储介质。第二个存储介质可能是另一个磁盘驱动器、磁带或 DVD。通常，大型组织的备份是使用\
  \ `CommVault`、`HP’ StorageWorks Enterprise Backup Solution`、`Sun StorageTek Enterprise\
  \ Backup Software`、`EMC NetWorker` 和 `IBM Tivoli Storage Manager` 等软件包创建的。\n\n在系统上创建备份是为了确保系统故障时，可以从备份介质成功重建。备份创建后，你需要确认该过程是否成功。如果最近的备份不可用，那么将无法从它们重建系统。\n\
  \n像上面列出的企业级备份软件包通常会创建报告，记录备份过程已成功。图 14.1 显示了来自 `CommVault` 备份工具的输出报告。\n\n![image](img/F000145f14-01-9780123985453.jpg)\n\
  \n图 14.1 一份记录备份活动的报告。\n\n这里需要包含一条关于备份过程的告警告。你必须了解你的备份软件包的能力。它可能会将某些你不需要担心的情况报告为错误。一个例子是，某些备份软件包分两个阶段执行。在第一阶段，它检查驱动器的主表以识别所有需要备份的文件。这些文件名被写入临时列表或表。在第二阶段，备份软件包尝试将临时列表中的所有文件复制到次级存储设备。如果列表中的文件不再存在，则会在报告中写入错误。对于文件可能在第一阶段存在但在第二阶段不存在的一种解释是，它是杀毒软件签名文件。新的\
  \ AV 文件每天加载一次。如果备份和 AV 加载重合，那么 AV 文件在备份的第二阶段可能不再存在于驱动器上。图 14.1 中的第一行错误是备份过程第二阶段无法找到某个文件的示例。\n\
  \n某些备份报告中的另一类型错误是指无法复制的文件。某些备份软件包无法复制当前由另一个进程打开（即正在使用）的文件。如果它们遇到打开的文件，则输出报告中将包含一个错误。图\
  \ 14.1 中的最后两个错误指的是由于处于打开状态而无法备份的文件。日志文件是由于这种情况而未被备份最常见的文件类型。你需要检查输出报告，因为可能某个对你的应用程序至关重要的文件由于这个原因没有被备份。\n\
  \n我支持的一个应用程序对“备份”一词有不同的定义。该特定应用程序依赖于在关系型数据库中维护的数据。此外，数据库中的指针指向存储在应用程序服务器文件系统的图像文件。对于该应用程序来说，创建“备份”意味着运行一个将数据从数据库表导出到平坦文件的进程。然后，该过程会创建一个包含这些导出的数据库文件和图像文件的\
  \ zip 文件。将应用程序恢复到特定时间点所需的一切都包含在该 zip 文件中。供应商还提供了一个恢复过程，可以将备份 zip 文件的内容覆盖到数据库表和图像文件上。\n\
  \n该应用程序的备份概念并没有将 zip 文件复制到次级存储介质。在这种情况下，创建备份有两个阶段的过程。第一阶段是运行应用程序的备份过程。第二阶段是使用 `CommVault`\
  \ 等备份软件包备份 zip 文件。\n\n应用程序的备份过程在完成时会发送电子邮件。图 14.2 显示了该应用程序典型的成功确认邮件格式。如果备份过程遇到问题且没有成功，它会发送一封明确说明备份过程失败的电子邮件。邮件中的内容将是“文件和数据库未备份。备份错误退出。详情请参阅附件日志文件。”\n\
  \n![image](img/F000145f14-02-9780123985453.jpg)\n\n图 14.2 备份电子邮件确认示例。\n\n这些电子邮件需要分发给不仅仅是应用程序管理员。理想情况下，它们应该发送到一个分发列表。如果不可能，至少应该发送给应用程序管理员和备选应用程序管理员。应用程序的业务所有者可能也请求获取。\n\
  \n如果没有自动发送确认电子邮件，那么你需要进行一些调查来确认备份状态。日志文件可能包含你正在寻找的信息。或者你可能需要检查昨天创建的备份文件的数量和大小，并将其与之前创建的备份文件进行比较。\n\
  \n## 14.1.3 环境监控\n\n每天对应用程序监控是非常明智的做法。如果应用程序环境中的情况开始恶化并被及时发现，你可能避免停机。至少，你可能防止情况进一步恶化。\n\
  \n\n\n\n如果你的环境包含了监控软件包，那么你就可以依赖它来完成大部分监控工作。如果你还没有配备监控工具，那么你应该每天检查一些关键指标。检查这些项目应该在一天中尽可能尽早进行，以便在用户遇到问题之前检测并纠正它们。你可能想要检查的项目包括：\n\
  \n*   自你上次检查以来服务器是否重启过？如果发生了这种情况，你需要调查原因。如何判断服务器是否已重启？在 Windows 环境中，你可以在命令提示符窗口中运行\
  \ `net stats server` 命令。图 14.3 显示了该命令的详细输出。\n\n![image](img/F00145f14-03-9780123985453.jpg)\
  \ 图 14.3 显示日期。\n\n*   应用程序是否仍在运行？如果应用程序没有启动，那么调查并解决这个问题应该是你的首要任务。检查应用程序是否运行至少有两种方法。第一种方法是登录服务器并确认已知进程是否正在运行。第二种方法是登录集群控制台查看。这里有几点注意事项：\n\
  \    *   如果环境包含不同的应用程序组件（例如用户界面和单独的报告），你需要登录每个组件以确认它们都在正常运行。\n    *   如果环境包含集群或负载均衡，那么集群中至少有一个服务器是可用的。要确认这一点，你必须登录每个服务器进行检查。\n\
  \n*   今天创建了大量的报告吗？对于许多用户来说，这些报告代表了应用程序最重要的部分。如果报告没有被创建，可能是系统已崩溃或损坏。如果报告出现问题，那么解决它们应该是高优先级任务。\n\
  \n*   夜间进程是否已完成？这些过程包括创建导出文件、从其他系统接收文件，或者向应用程序添加需要处理的旧数据。如果导入或导出进程没有完成，可能是磁盘空间不足，这需要解决。\n\
  \n*   最近的备份进程是否成功了？如果没有成功，如果应用程序或数据库崩溃，可能会丢失更多数据。解决这类问题优先级非常高。\n\n*   服务器（s）上有多少可用磁盘空间？如果当前数量极低或正处于下降趋势，则需要处理这个问题。如果磁盘空间不足，可能是由于应用程序运行得过多，或者旧文件没有被及时删除。磁盘空间不足可以通过增加更多驱动器或替换现有驱动器来解决。如果是存储区域网络（SAN），只需花费较少精力即可完成扩展。\n\
  \n磁盘空间不足的另一个原因是应用程序运行得过多，或者管理员没有正确清理文件。哪些文件可以清理？在某些看来是垃圾的文件，但用户可能想要保留它们：\n    *\
  \   如果服务器已经崩溃，可能有非常大的核心转储文件（core dump files）可以删除。\n    *   可能有大量的日志文件可以压缩、归档或直接删除。\n\
  \    *   可能存在测试数据可以删除。\n    *   某些应用程序有自己的 `/temp` 或 `/tmp` 子目录。如果这些目录存在，应该检查是否有可以删除的文件。\n\
  \    *   如果你的应用程序包含任何导入或导出数据的进程，可能存在旧数据文件可以删除。\n    *   软件安装或升级的残留物可能没有删除。很多时候，安装文件被忽略了。\n\
  \    *   服务器上可能存在旧数据可以删除。\n    *   影子拷贝是磁盘卷的快照，用于在发生系统故障时将服务器恢复到较早的状态。影子拷贝可能会消耗大量的磁盘空间。\n\
  \n*   CPU 使用率是多少？这个比率高于正常吗？如果比率异常高，可能反映出应用程序使用量的增加或存在问题。如果用户数量最近增加，或者你刚刚进入了应用程序使用更密集的业务时期（例如纳税季或年度“结账”时），使用量的增加是可以预期的。如果是这种情况，你可能只能在短期内接受。\n\
  \n或者，使用量的增加可能代表一个问题。可能是与应用程序或支持软件相关的进程失控了。你可以使用 Windows 管理器或 Unix 的 `top` 命令来判断\
  \ CPU 使用率的增加是否由单个进程引起。如果单个进程消耗了大部分 CPU 时间，你可能已经找到了罪祸首。\n\n我遇到过病毒检测软件消耗了几乎可用 CPU\
  \ 周期的情况。关闭该软件包后，问题消失了。不久后，我们将病毒检测软件更新到最新版本并重新开启，CPU 使用率问题没有再次。\n\n*   有多少空闲内存？内存数量呈下降趋势吗？可用内存对大多数应用程序的性能至关重要。如果没有足够的可用内存，大多数应用程序的性能都不会理想。如果可用内存降过低，应用程序或操作系统可能会崩溃。\n\
  \n如果内存数量稳定下降，可能是内存泄漏（memory leak）的结果。如果一个应用程序向操作系统请求内存，但在不再需要时没有释放它，则被称为内存泄漏。最终，它可能会请求并泄漏足够的内存，从而严重影响服务器性能。\n\
  \n内存泄漏应用程序的最佳解决方案是重写代码，使其正确地将未使用的内存返回给操作系统。遗憾的是，这很难做到。如果应用程序是专有的，你将无法访问源代码。你可以向供应商报告此问题，但解决此类问题可能不是他们的首要任务。\n\
  \n\n\n另一种解决方案是定期停止并重启应用程序。当应用程序停止时，分配给它的所有内存都会立即返回给操作系统。我曾支持的一个应用程序存在内存泄漏问题。供应商的支持服务台建议每周停止并重启一次。我们编写了脚本，在每个周六凌晨\
  \ 1 点停止它。另一个脚本在凌晨 1:15 运行以重启应用程序。在这些脚本一实施后，应用程序的性能问题就消失了。这虽然不是世界上最优雅的解决方案，但它确实有效。\n\
  \n## 14.1.4 调查你从监控工具收到的任何警报\n\n如果你足够幸运部署了监控软件，那么你就需要密切关注它发出的任何警报。它可能会识别并提醒你注意问题，但调查和修复该问题的责任完全在于你身上。\n\
  \n## 14.1.5 跟进用户问题\n\n当应用程序的用户遇到问题时，你的职责之一将是调查并解决这些问题。其中一些问题是由用户错误或误解引起的，但有相当一部分是应用程序中的真实问题。\n\
  \n你获取用户投诉的方式在很大程度上取决于你组织的架构。用户可能会在问题跟踪系统中创建工单。他们可能会向你或你的小组发送电子邮件。或者，他们可能直接走到你的工位前，面对面与你谈论他们遇到的最新问题。\n\
  \n无论你如何获知应用程序的新问题，人们都会预期你和/或应用程序管理员小组解决它们。有些问题只需教育用户与应用程序交互的正确方法即可解决。其他情况则需要你翻阅笔记或文档，并使用之前应用过的解决方案来修复它们。最棘手的问题将需要你与供应商合作进行调查和纠正。\n\
  \n当然，所有用户都希望他们的问题立即得到处理，但这在物理上是不可能的。所有开放的工单必须进行优先级排序，以确定哪些将优先处理，哪些需要等待。不要尝试自己做决定，因为无论你如何对问题排序，都会有人感到不满意。决定先处理哪个最佳方法是包含组织技术端和业务端的意见。\n\
  \n## 14.2 每周任务\n\n根据需要，每周任务可以每天执行，但每周执行一次可能是可以接受的。\n\n### 14.2.1 审查日志文件\n\n日志文件可能包含关于你应用程序的黄金矿信息，但如果不定期审查，它们毫无意义。日志文件中可能存在的某些细节示例：\n\
  \n* 应用程序的哪些部分使用得最多\n* 应用程序停止和启动的频率\n* 应用程序内部发生了哪些内部错误\n* 安全问题\n* 失败的登录尝试\n* 用户是否错误地使用了应用程序\n\
  * 性能问题\n* 与数据库的交互，尤其是可能发生的问题\n* 网络问题\n* 用户经历的超时问题\n\n你的应用程序并不是服务器上日志文件的唯一来源。服务器上的任何重要软件都可能创建日志文件。以下是某些向其自己的日志文件中写入条目的软件示例：\n\
  \n* 调度包，如 `Windows Task Scheduler` 或 `cron`。\n* 操作系统\n* 杀毒病毒软件\n* Web 服务器应用程序，如\
  \ `IIS` 或 `Apache`。\n* 应用程序服务器，如 `WebLogic Server` 或 `IBM WebSphere`。\n* 监控包，如 `HP\
  \ OpenView` 或 `SolarWinds`。\n\n处理日志文件最大的困难在于：\n\n* 文件在哪里？我确定他们不是故意的，但有时我脑海中闪过，供应商故意隐藏日志文件只是为了烦人。至少，他们没有让它们变得容易寻找。你会发现它们散落在子目录树中，并且倾向于隐藏在应用程序文件的深处。\n\
  * 日志条目意味着什么？日志文件条目往往简短到晦涩的。我理解详细的条目需要更长的写入时间并消耗更多的磁盘空间，但在涉及在日志文件中写入简短、几乎像代码的条目时，供应商似乎倾向于走向极端。\n\
  \n对于上述这两个困难，我最好的建议是坚持下去并记录下你学到的一切切。维护一份文档，列出你为应用程序处理的每一个日志文件。同样，对你处理的每一个有意义的条目保留详细笔记。\n\
  \n另一个建议是纠缠供应商的支持团队成员，向他们有关日志文件的建议和背景信息。询问供应商是否有专门关于日志文件的文档。询问他们是否有任何关于日志文件的速查笔记（crib\
  \ notes）。询问供应商是否提供关于其日志文件的课程、研讨会或网络研讨会。他们最坏的结果就是对你说。\n\n## 14.3 每月任务\n\n每月任务不像某些每日或每周任务那样紧迫，但并不意味着它们不重要。如果你让它们拖延太久，其中一个最终会导致严重问题。\n\
  \n### 14.3.1 补丁周末\n\n软件需要定期更新。对于那些经常被黑客探测弱点的软件来说，尤其如此。大型软件程序（例如操作系统）的供应商定期发布其产品的补丁，以跟上定期检测到的漏洞。\n\
  \n例如，某些供应商（`Microsoft`）每月发布一次补丁。为了跟上这种定期的补丁更新，你可能希望以类似的频率应用它们。当然，你会希望将补丁应用到测试服务器上，以确保它们不会给你的服务器带来不可预的问题。\n\
  \n### 14.3.2 审查性能指标\n\n如果你的组织部署了监控，那么定期审查它创建的统计数据是非常好的主意。每月似乎是一个很好的间隔。它不会频繁到需要你一直这样做，但时间跨度足够大可以感知趋势。如果你能对主要的统计数据制作图表，你可能预测何时需要额外的硬件。应该审查的一些统计数据包括：\n\
  \n* 使用的磁盘空间或可用磁盘空间量\n* 应用程序的用户数\n* 给时间登录的用户数\n* CPU 利用率\n* 创建和分发的报告数量\n* 磁盘 I/O\
  \ 计数\n\n以下两图展示了周期性统计对于识别趋势有多有价值。图 14.4 显示一个系统的磁盘空间利用率没有显著增长，不需要处理。对比图 14.5，它显示一个系统的磁盘空间正在迅速消失。如果不迅速采取措施来恢复磁盘空间或增加该系统的可用磁盘空间，那么问题是不可避免的。\n\
  \n## 14.3.3 识别谁有权访问服务器\n\n\n\n\n\n访问服务器（尤其是生产服务器）的人数应该尽可能严格地限制。允许用户访问生产服务器的理由非常少。除了应用程序管理员（Application\
  \ Administrators）之外，访问人员列表也应该保持尽可能短。可能需要访问服务器桌面的某些人员示例包括：\n\n* 系统管理员\n* 管理备份软件的团队\n\
  * 网络工程师\n* 管理监控软件的团队\n* 管理防病毒软件的团队\n\n许多组织要求定期（例如每季度一次）生成服务器访问报告，这通常作为其安全审计流程的一部分。如果你的组织有此类需求，那么你将希望确保创建此报告的过程既是准确的，又有良好的记录。\n\
  \n除非你确认了谁可以访问你的服务器，否则访问范围可能比你想象的要广泛得多。为了防止这种情况，你需要定期确认访问列表中没有添加额外的名称或用户组。在`Windows`\
  \ 服务器上，查看谁可以访问服务器的一种方法是通过`计算机管理`工具。点击`开始` | `管理工具` | `计算机管理`。在“本地用户和组”节点下，点击`用户`和`组`以查看服务器上存在哪些这些项。图\
  \ 14.6 是此工具的截图。\n\n![image](img/F000145f14-06-9780123985453.jpg)\n\n图 14.6 `Windows`\
  \ 中的`计算机管理`工具。\n\n要查看组中的哪些个人，右键点击组组条目并选择“属性”。虽然你需要检查属于每个组员，但知道谁在`Administrator`组中至关重要，因为该组成员对服务器拥有不受限制的访问权限。图\
  \ 14.7 是显示`Administrators`组中包含的用户和组的截图。\n\n![image](img/F000145f14-07-9780123985453.jpg)\n\
  \n图 14.7 `Administrator`组中的成员。\n\n遗憾的是，`Administrator`组本身可能包含其他组。图 14.7 中的截图显示了若干作为`Administrator`组成员的组，例如`CORP\\\
  Global Admins`。这看起来像你掉进了兔子洞，但你需要另一个工具来识别谁是这些组的成员。可以提供此类信息的工具之一是`Microsoft Management\
