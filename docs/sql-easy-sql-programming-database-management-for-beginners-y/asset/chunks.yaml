    | CUSTOMER ID | NAME | POSITION | COMPANY | STATE | CONTACT NO |


    |                       1 | Kathy Ale | President | Tile Industrial | TX | 3461234567
    |


    | 2 | Kevin Lord | VP | Best Tooling | NY | 5181234567 |


    | 3 | Kim Ash | Director | Car World | CA | 5101234567 |


    | 4 | Abby Karr | Manager | West Mart | NV | 7751234567 |


    You will also have an ORDER TABLE that will store information such as order ID,
    date, quantity and more. Check the following table:


    | ORDER ID | ORDER DATE | CUSTOMER ID | PRODUCT ID | ORDER QTY |


    | 1 | 2016-05-23 | 1 | 4 | 300 |


    | 2 | 2016-09-09 | 1 | 5 | 100 |


    | 3 | 2016-02-17 | 3 | 2 | 150 |


    | 4 | 2016-05-12 | 2 | 2 | 500 |


    As you can see, each table looks like an array of rows and columns. Referring
    to the CUSTOMER TABLE, a row is also called a record or  a tuple that holds information
    for a single customer. On the other hand, a column holds a single attribute of
    the customer (i.e., name, job title or position, company name and address, contact
    number). It is also self-consistent, meaning it contains the same type of data
    in every row. So if a column contains the name of your customer in the first row,
    then the succeeding rows will have to show the names of your other customers.
    There is also no significance which row or column will appear first and which
    will be next, since there is no particular organization that is followed. Looking
    at both tables, you will notice that each one of them has a column that contains
    the same data value – CUSTOMER ID. This is now called the common key, which links
    the tables to one another in a relational database. The existence of the common
    keys makes it possible to merge data from multiple tables in forming a larger
    set of data entity.


    The relation between the two tables consists of a two-dimensional array of data
    stored in rows and columns. The intersection of a row and a column is called a
    cell. Each cell contains singe-valued entries and each row is unique. Thus, each
    cell has only one value and no duplicate rows. Going back to the CUSTOMER and
    ORDER TABLES, will be able to create the following relation by adding the CUSTOMER
    NAME that corresponds to the given CUSTOMER ID:


    | ORDER ID | CUSTOMER ID | CUSTOMER NAME |


    | 1 | 1 | Kathy Ale |


    | 2 | 1 | Kathy Ale |


    | 3 | 3 | Kim Ash |


    | 4 | 2 | Kevin Lord |


    You will see that there is no empty cell. One particular order referenced by the
    ORDER ID is associated to a particular customer, indicated by the CUSTOMER ID
    and CUSTOMER NAME. There are no two customers having the same ORDER ID. That is
    why, there will be no two rows that are exactly identical.


    Database Management Systems


    A database management system, or simply DBMS, is an important programming tool
    that consists of a set of programs that define, manage and process databases and
    all applications associated to them. Through this, you are able to build a structure
    and operate on the valuable data that the database holds in a very efficient way.
    There are two main types of users that work on DBMS – the conventional user who
    retrieves or modifies data and the administrator who is responsible for maintaining
    the structure of the database.


    The following are the key features of a DBMS:


    *   Allows the creation of new databases and their data structures


    *   Allows data query and modification using an appropriate programming language


    *   Allows the storage of vast amounts of data over a long period of time


    *   Enables database recovery in times of failure, error or intentional misuse


    *   Controls data access from many users at once


    It was during the late 1960s when the first commercial DBMS appeared. It evolved
    from file systems that basically provided data storage for over a certain period
    of time. Though such systems were capable of storing tremendous amount of data,
    computer professionals still have to face problems of data loss and an inefficient
    information retrieval system. There were also issues on control access where errors
    occur when two users modify the same file at the same time. Some examples of these
    applications are airline reservation systems, banking systems and corporate record
    keeping systems, among others.


    With the advancement of technology in the market today, you can find numerous
    programs that will be suitable for your DBMS requirements. There are applications
    that run on a small scale level like your personal computer or tablet. Some are
    built to run on a large and powerful equipment, like those being used by multinational
    companies. Nevertheless, the on-going trend is for DBMS to be executed on multiple
    platforms or machines (whether large or small) that are interconnected to one
    another, forming an immense scalable network. IT experts have also found ways
    on how store data using Internet technology in powerful data centers or more popularly
    known as clouds. This cloud can be public entity (managed by a large company like
    Microsoft or Google) or a private one (maintained and stored via the intranet
    within an organization).


    ![](Images/image00176.jpeg)


    In this chapter you have learnt the essential features of a database and how it
    transforms to become a relational database.  Also, you had an overview of the
    history and characteristics of database management systems. In the next chapter
    you will learn the fundamental structure of the SQL language and its components.


    # Chapter Three: The SQL Structure


    In this chapter you will learn the fundamental features of the SQL language and
    an overview of its programming aspect. In addition, you will be presented with
    a step-by-step instruction on where and how to download SQLite, a version of the
    SQL software that will be used all throughout the discussion of this e-Book.


    SQL Fundamental Features


    SQL is a flexible computer language that you can deploy in different ways to communicate
    with relational databases. This software has some distinct features that differentiates
    it from other programming applications. First and foremost, SQL is a nonprocedural
    language. Most computer programs (e.g., C, C++ and Java) solve problems by following
    a sequence of commands that is called a procedure. In this case, one specific
    operation is performed after another until the required task has been accomplished.
    The flow of operation can either be a linear sequence or a looping one, depending
    on what the programmer had specified. This is not the same for SQL. In using this
    application, you will just have to specify the output that you want, not how you
    want to generate the output. From the CUSTOMER TABLE, if you want to create a
    separate list of contacts whose company are located in Texas then you have to
    retrieve the rows where the STATE column contains “TX” as its value. In writing
    the SQL command, you don’t have to indicate how the information should be retrieved.
    It is the primary role of the database management system to examine the database
    and decide how to generate the results you wanted.'
