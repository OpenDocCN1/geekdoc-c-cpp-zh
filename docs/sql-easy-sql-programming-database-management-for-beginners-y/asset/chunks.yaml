    上图显示，那些部分依赖于主键 `EmployeeID` 的属性已从 `EMPLOYEE_TBL` 中移除，并存储在一个名为 `EMPLOYEE_SALARY_TBL`
    的新表中。保留在原表中的属性完全依赖于主键——这意味着对于每一条姓氏、名、地址和合同编号记录，都有一个特定的员工 ID。与 `EMPLOYEE_SALARY_TBL`
    不同，特定的员工 ID 并不引用唯一的员工职位或薪资率。可能有多个员工的职位（`EmpPosition`）、薪率（`Payrate`）和奖金（`Bonus`）相同。


    ![](img/image00332.gif)


    对于 `CUSTOMER_TBL` 表，客户的订单信息并不直接取决于原表中的通用客户信息。这就是为什么四个属性（`OrderID`、`OrderDate`、`ProductID`
    和 `OrderQty`）被移动到名为 `ORDER_TBL` 的独立表中。


    ### 三阶范式 (3NF)


    通过第三阶范式（`3NF`），你必须从表中分离完全不依赖于主键的信息。回到 `CUSTOMER_TBL`，职位（`JobPosition`）及其描述（`JobDescription`）完全独立于主键
    `CustomerID`。这是因为在通常情况下，无论客户是谁，任何职位都具有相同的职责和责任。因此，我们将 `JobPosition` 和 `JobDescription`
    属性分离到另一个名为 `POSITION_TBL` 的表中。


    ![](img/image00333.jpeg)


    在本节章中，你学习了可以应用来提高数据库性能的设计实践。通过在表分配分配主键和外键，避免了重复的数据值。通过实现表索引，提高了搜索查询的效率。由于归一化过程，数据一致性和安全性得到了提高。因此，整体数据库组织结构得到了增强。在下一章中，你将学习
    SQL 设计中的一些高级主题，包括光标、触发器和错误。


    # 第十一章：数据库高级主题


    在本章中，你将介绍一些超出基础数据库事务的 SQL 高级主题。即使该部分只包含对光标、触发器和错误的概述，这些知识也可能帮助你扩展 SQL 实现的功能。


    ## 光标 (Cursors)


    通常情况下，SQL 命令使用基于集合的操作来处理数据库对象。这意味着事务是在一组或一个数据块上执行的。而光标则是逐行处理来自表中的数据。它使用复合语句进行创建，并在退出时销毁。声明光标的标准语法如下（对于每个实现可能有所不同）：


    ```

    DECLARE CURSOR CURSOR_NAME

    IS {SELECT_STATEMENT}

    ```


    只有在光标被声明或定义后，你才能对其执行操作。


    ### 打开光标


    一旦声明光标，你就可以执行 `OPEN` 操作来访问光标，然后执行指定的 `SELECT` 语句。`SELECT` 查询的结果将保存在内存中的某个区域。打开光标的标准语法为：


    ```

    OPEN CURSOR_NAME;

    ```


    ### 从光标获取数据


    如果你想从光标中检索查询结果或数据，则执行 `FETCH` 语句。获取数据的标准语法为：


    ```

    FETCH NEXT FROM CURSOR_NAME [INTO FETCH_LIST]

    ```


    在 SQL 编程中，方括号内的可选语句允许你将检索的数据赋值给特定的变量。


    ### 关闭光标


    在打开特定光标时，有一个相应的 `CLOSE` 语句要执行。一旦光标关闭，所有使用的名称和资源将被释放。因此，程序将无法再使用该光标。关闭光标的标准语法为：


    ```

    CLOSE CURSOR_NAME

    ```


    ## 触发器 (Triggers)


    在某些情况下，你希望在执行某些特定操作后发生特定的 SQL 操作或事务。这种情况描述了一个触发另一个 SQL 语句发生的 SQL 语句。本质上，触发器是在数据库中编译的
    SQL 过程，它根据之前发生的其他事务执行某些事务。此类触发器可以在 DML 语句（`INSERT`、`DELETE` 和 `UPDATE`）执行之前或之后执行。此外，触发器可以验证数据完整性、维护数据一致性、回滚事务、记录操作、修改和读取数据库数据值。


    ### 创建触发器


    创建触发器的标准语法为：


    ```

    CREATE TRIGGER TRIGGER_NAME

    TRIGGER_ACTION_TIMETRIGGER_EVENT

    ON TABLE_NAME

    [REFERENCING OLD_OR_NEW_VALUE_ALIAS_LIST]

    TRIGGERED_ACTION

    ```


    - `TRIGGER_NAME` - 此对象的唯一标识名称

    - `TRIGGER_ACTION_TIMETRIGGER_EVENT` - 触发动作发生的指定时间（无论是在触发事件之前还是之后）。

    - `TABLE_NAME` – 执行 DML 语句的表

    - `TRIGGERED_ACTION` - 触发事件后要执行的动作


    在打开特定光标后，有一个相应的触发器语句要执行。一旦触发器被创建，就无法再更改。触发器的工作方式取决于你指定的条件——是在 DML 语句执行时触发一次，还是对于受影响的每一行
    DML 语句触发多次。


    ### 删除触发器


    删除触发器的基本语法与删除表或视图相同：


    ```

    DROP TRIGGER_NAME;

    ```


    ## 错误 (Errors)


    无错误的设计或实现是任何编程语言的最终目标之一。你可能会由于不遵守命名规范、错误地编写代码（例如缺少单引号或括号）或当输入数据与定义类型不匹配时产生错误。


    为了方便起见，SQL 设计了一种返回错误信息的方法，以便程序员了解发生的情况并能够采取适当措施。此类错误处理机制包括状态参数 `SQLSTATE` 和 `WHENEVER`
    子句。


    ### SQLSTATE


    状态参数或主机变量 `SQLSTATE` 是一种包含多种异常条件的错误处理工具。它是由五个字符组成的字符串（大写字母 A-Z 和数字 0-9），其中前两个字符表示类代码，后三个字符是子类代码。类代码标识
    SQL 语句完成后的状态——无论其是否成功（如果没有成功，则会返回主要的错误类型之一）。


    `SQLSTATE` 在每次操作后都会更新。如果值为 `00000`（五个零），则意味着执行成功，你可以继续后续操作。如果它包含 `00000` 以外的五位字符串，则必须检查你的代码行以修复提交的错误。


    ### WHENEVER 子句


    `WHENEVER` 子句错误处理机制关注执行异常。通过这种方式，错误会被识别，并为程序员提供纠正的选择。如果你无法纠正或撤销已提交的错误，就可以优雅地终止应用程序。


    `WHENEVER` 子句写在可执行的 SQL 代码之前，具体位于 SQL 声明部分。基本语法为：

