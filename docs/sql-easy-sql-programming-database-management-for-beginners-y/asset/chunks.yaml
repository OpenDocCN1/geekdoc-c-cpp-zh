    WHERE CustomerName = ‘KATHY ALE’;

    ```


    2. To check if the record has been deleted, go to `Customer_2` table by clicking
    on ![](Images/image00252.jpeg). Then click on the `REFRESH TABLE DATA` button
    ![](Images/image00253.jpeg) or press `F5` on your keyboard to update the values.
    You will notice that the record has been deleted already.


    ![](Images/image00254.jpeg)


    ### Multiple Records


