    使用星号 `*` 给定表中的所有列都包含在输出中并显示。`ALL` 提取并显示列的所有值，即使是重复值。相反，使用关键字 `DISTINCT` 则防止重复行包含并显示在输出中。紧跟在
    `FROM` 关键字之后的是一个或多个列表，您希望从中获取数据。语法中指定的列和表之间都用逗号分隔。


    ### 数据控制语言 (DCL)


    数据控制语言（简称为 `DCL`）由允许您管理数据库内数据访问的命令组成。此外，通过控制用户权限可以保护数据库免受无意或故意的误用。`DCL` 关注事务，事务会捕获所有执行数据库操作的
    SQL 语句并将其保存到日志文件中。以下是常用的 `DCL` 命令语句：


    *   `GRANT` – 该语句为您提供某些权限，例如授予您访问数据库的权限。其语法为：


    ```

    GRANT PRIVILEGE1, PRIVILEGE2, … TO USER_NAME

    ```


    *   `REVOKE` – 该语句撤销您的权限，例如移除您访问数据库的权限。其语法为：


    ```

    REVOKE PRIVILEGE1, PRIVILEGE2, … TO USER_NAME

    ```


    ### 事务控制命令


    事务控制命令允许用户在维护数据库完整性方面操作各种事务。在 `SQL` 中，事务在应用程序执行时开始。第一个事务在 SQL 应用程序启动时开始，最后一个事务在应用程序终止时结束。以下是常用的事务控制命令：


    *   `COMMIT` – 该语句通过使您对数据库的更改持久化或简单保存事务来完成事务。其语法为：


    ```

    COMMIT [WORK];

    ```


    在上述命令行中，关键字 `WORK` 是可选的。


    *   `ROLLBACK` – 该语句的主要功能是将数据库系统恢复到之前的状态，或撤销事务日志中发生的所有操作。其语法为：


    ```

    ROLLBACK [WORK];

    ```


    在上述命令行中，关键字 `WORK` 是可选的。


    *   `SAVEPOINT` – 该语句与 `ROLLBACK` 命令配合使用，它在事务组内创建区域或点，您可以在这些区域中执行 `ROLLBACK` 命令。其语法为：


    ```

    SAVEPOINT SAVEPOINT_NAME;

    ```


    # SQLite 安装说明与数据库特性


    在开始让自己陷于各种数据库解决方案和 SQL 命令行之前，您需要首先确定创建数据库的目的。这将进一步决定其他数据库设计考虑，如大小、复杂性、运行应用程序的机器类型、存储介质等。当您开始考虑数据库需求时，您需要知道在设计中应该考虑到多大详细程度。细节过多会导致设计非常复杂，从而进一步浪费时间和精力，甚至是您计算机的存储空间。细节过少则会导致数据库性能差、损坏且毫无价值。一旦您完成了设计阶段，就可以决定下载哪种数据库软件来开始您的
    SQL 体验。


    为了本电子书的讨论，`SQLite`（一个简单的软件库）将作为入门数据库引擎，用于设计、构建和部署应用程序。`SQLite` 是一种免费且独立的数据库软件，下载快速且易于管理，由
    Richard Hipp 和他的程序员团队开发。它的设计易于配置和实现，完全不需要任何客户端-服务器设置。因此，`SQLite` 被认为是最广泛使用的软件之一。以下列了一些主要特性：


    *   事务具有原子性、一致性、隔离性和持久性

    *   编译简单易用

    *   支持系统崩溃和断电

    *   无外部依赖的全 SQL 实现

    *   代码占用极小

    *   可适应并调整到更大的项目

    *   自包含且可移植


    在使用 `SQLite` 时，您需要下载 `SQLiteStudio` 作为您的数据库管理器和编辑器。凭借其直观的界面，该软件轻量而强大。您甚至不需要安装它，只需下载、解压并运行程序。按照以下简单步骤在
    Windows 计算机上下载 SQLiteStudio：


    1. 检查计算机系统的版本，然后点击相应的链接开始下载软件。

    2. 下载软件后，进入保存文件夹（通常是下载文件夹）。点击顶部的“提取”选项卡，然后选择“提取所有”。

    3. 您将看到“提取压缩（zip）文件夹”对话框。将目标文件夹更改为 `C:\SQL` 然后点击“提取”按钮。这将是所有 SQLite 文件所在的文件夹。

    4. 一旦解压所有文件，您将获得 SQLiteStudio 子文件夹。

    5. 在子文件夹中找到名为 `SQLiteStudio` 的程序。若要在桌面上创建快捷方式（以便能够快速启动程序），请右键点击文件名，选择“发送到”选项，然后选择“桌面（创建快捷方式）”。

    6. 当您双击桌面上的 `SQLiteStudio` 图标时，您应该看到以下屏幕：


    数据库导航器（左侧面板）显示数据库的所有逻辑单元，如表和视图。右侧的灰色面板是 SQL 工作区，您可以在其中编写查询语句。在随后的章节中，您将对该程序的图形用户界面有更好的理解。


