- fmt: "\n![](Images/image00272.jpeg)\n\nIn the example above, the `COUNT` function\
    \ was introduced to arrange the data in groups. The following is a summary of\
    \ the common aggregate functions used together with the `GROUP BY` statement (`x`\
    \ denotes the column name where you want to perform the function):\n\n*   `AVG(x)`\
    \ – computes the average of all the column values (null values removed)\n*   `COUNT(x)`\
    \ – counts the number of non-null values in the column\n*   `COUNT(*)` – counts\
    \ the number of records\n*   `MAX(x)` – computes the maximum value in the column\
    \ (null values removed)\n*   `MIN(x)` - computes the minimum value in the column\
    \ (null values removed)\n*   `SUM(x)` – computes the sum or total of the values\
    \ in the column (null values ignored)\n\nGoing back to the `GROUP BY` example,\
    \ the data in the `JobPosition` column is retrieved and for each instance of the\
    \ value, a record is counted using the `COUNT` function. The `number_of_record`\
    \ is a new column created that displays the total number of records per job position.\
    \ The Director, Manager and President positions have 1 record each while the Vice-President\
    \ has 2. This is because there are two customers who are vice-presidents – Kevin\
    \ Lord and Mike Armhs. If you can also notice, the records displayed are sorted\
    \ in an ascending order by default.\n\nAltering your SQL statements to display\
