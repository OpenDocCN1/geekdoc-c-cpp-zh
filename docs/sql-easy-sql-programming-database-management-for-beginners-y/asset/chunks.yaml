    自首次向公众发布以来，SQL 已经有了许多版本。1979 年，Relational Software, Incorporated（后更名为 Oracle 公司）发布了
    ORACLE，这是第一个 SQL 产品。现在，随着对管理数据的计算机需求增加，SQL 越发成为信息技术领域的行业标准。这种正式标准由国际标准组织（简称为 ISO）制定并维护。1986
    年，基于 IBM 的实现，SQL 被认可为数据库通信的标准语言。次年，ISO 接受 ANSI SQL 作为国际标准。ANSI 代表美国国家标准协会，这是一个批准美国各行业某些特定标准的组织。此后，该标准又经过了多次修订，例如
    1992 年（SQL-92）和 1999 年（SQL-99）。最新版本现在被称为 SQL-2011，它于 2011 年 12 月正式发布。


    ## SQL 的用途


    如今，企业界正从仅仅生产产品和提供服务，转向对数字技术的投资，以处理海量数据，并将其转化为有意义的信息，从而为公司创造更丰丰的收入。这是 SQL 的主要目标——访问并操作数据，从而进一步带来业务洞察。这种灵活的计算机语言一直是处理数据库（特别是本书第
    3 章将进一步讨论的关系型数据库）最广泛使用的通信工具。


    试着想象你正要去一个外国国家度假。你可能需要学习那个国家的语言，以便在探索新地方时找到路。当你尝试向一位当地居民且只说该国语言的人问路时，你显然会发现很难理解他。在这种情况下，异国土地将是你的数据库，你需要在其中寻找信息，而
    SQL 就是你用来从数据库中获取所需内容的语言。


    你时时会遇到“查询”（query）这个词，它也是 SQL 缩写的一部分。查询本质上是使用 SQL 语句编写的、向数据库提出的问题。当数据库中的任何数据满足给定的查询语句的条件要求时，SQL
    就会检索出所需的信息。因此，在现实应用中（例如在线商店），当你通过输入搜索标准来执行对特定商品的查询时，SQL 程序通常在后台运行以管理数据库连接。你实际上是在通过
    SQL 的帮助，告诉数据库你想看哪些信息以及你希望它如何将这些信息呈现给你。


    ## 使用 SQL 的人员


    SQL 不仅适用于 IT 专业人士或具备卓越编程技能的极客。随着当今不断发展的商业世界，商人和经理等非 IT 人员也可以从学习 SQL 语义中获益。这是因为计算机语言使他们能够利用驱动每家公司的数据来理解业务的细节。此外，对于那些想要从当前职位晋升的人来说，它在分析、管理、战略或研究领域开启了多个职业机会。在
    IT 领域，SQL 知识可以带来更具挑战性的角色，如数据库设计师、管理员或科学家、系统工程师、项目经理和软件开发人员等。


    在本章，你学习了 SQL 的概览——它的历史、创建它的首要目的以及哪些人将从学习这种强大的数据库软件中获益。在下一章中，你将学习数据库的基础知识，这是 SQL
    最初被设计的首要原因。


    # 第二章：数据库基础


    在开始学习 SQL 这种计算机语言的技术细节之前，本章将首先讨论什么是数据库及其基本特征。你还将了解到为什么商业世界现在被驱动着收集和操作数据，以带来更丰丰的收入。


    ## 数据库基础


    定义或描述什么是数据库有很多方法。简单来说，它可以被定义为一组可以长期存在的项目集合。把名片盒想象成一个数据库，其中包含了你认识的人的带有不同信息的名片（例如人的姓名、职位、公司名称、联系电话）。另一个例子是印刷的电话簿（更广为人知的“黄页”），它包含了居住特定区域注册居民的姓名、电话号码和地址。


    有些人从更专业的角度定义数据库，而不只是数据的集合。它被描述为一种有组织的工具，能够在需要时以有效且高效的方式保留你可以检索的数据或信息。它也可以被更严格地定义为一组相互集成的、自描述的对象的集合。当你创建这些物理或概念对象的表示时，它们将被称为“记录”（records）。回到上一个名片盒的例子，如果你想跟踪你的业务联系人，你就必须给每张名片分配一条特定的记录。每条记录包含多个信息或数据，如个人姓名、职位、公司名称和地址、电话等，我们现在称这些为记录的“属性”。


    数据库不仅包含你需要的数据，还包含你所谓的“元数据”（metadata）。这些是定义或描述给定数据库内数据结构的信息（这就是为什么之前将其定义为自描述实体的原因），它们存储在一个名为“数据字典”的区域中。因此，如果你知道信息是如何排列和存储的，数据检索将更快。此外，由于数据项之间是相互成的，它们之间存在关系。请查看下图，关于数据库的示例说明。


    ![](img/image00174.gif)


    无论数据库是包含少数记录的简单集合，还是由数百万记录组成的庞大系统，都可以分为三类：个人、工作组/部门以及企业级。每个类别的特征在于数据库的大小、运行数据库的机器规模以及管理它的组织规模。


    - **个人数据库**：由单个人在独立计算机上构思并设计。其数据库结构相当简单，规模相对较小。例如，你的个人电子通讯录。

    - **工作组/部门数据库**：由特定组织内单个工作组或部门的个人设计和创建。与个人级相比，其数据库结构更大、更复杂，并且被多个用户同时访问。

    - **企业数据库**：在三类中，这种类型的构思和创建是为了处理非常大型组织的整个信息流。因此，数据库设计涉及复杂得多的结构。


