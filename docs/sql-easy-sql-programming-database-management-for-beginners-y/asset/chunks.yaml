- fmt: '

    The storage spaces of an index and the table from which it was created are separate.
    Such allocated physical space can also increase tremendously, even larger than
    the table it references. That is why storage requirements are taken into consideration
    when designing databases. Just like tables and views, indexes can also be created
    or dropped. When designed correctly, they actually speed up `SELECT` queries but
    could slow down `DELETE`, `UPDATE` and `INSERT` statements. For enormous databases,
    data retrieval will definitely consume so much time. However, such index transactions
    have no effect on the table’s data.


    ### Creating Indexes


    An index is associated to a particular column when it is created. It then holds
    the location of the data values of the table that contains that particular indexed
    column. Whenever new data is added to the table, it will also be added to the
    index. Let’s say you execute a `SELECT` statement with a certain condition specified
    in the `WHERE` clause that checks the column that is indexed. The first thing
    that will happen is that the index is first searched and will only return the
    exact location if the data value is found.


    For example, you wanted to select all the records from the `ORDER` table where
    the `Customer ID` matches to `1`. You will then issue the following query:


    ```

    SELECT *

    FROM Order_TBL

    WHERE CustomerID = 1;

    ```


    If the `ORDER_TBL` table is indexed on the `CustomerID` column, then the records
    will be arranged in an ascending order based on that column. Thus, the `CustomerID`
    index makes it easier for the search process to take place and finally resolves
    the location of all the data with the matching `Customer ID`. Once the location
    is determined, the corresponding rows of data will be retrieved from the `ORDER_TBL`
    table. Without the existence of the index, a full scan will be performed, which
    will not be efficient if the table contains hundreds or even thousands of records.


    ![](Images/image00325.gif)


    The basic syntax is for creating an index is:


    ```

    CREATE INDEX INDEX_NAME ON TABLE_NAME [(COLUMN_NAME)];

    ```


    This statement can vary by adding specifications such as the column name to be
    indexed, ordering (whether ascending or descending) and many more. Now, to create
    the `ColumnID` index of the `ORDER_TBL` table in SQLiteStudio:


    1. Click the ![](Images/image00304.jpeg) option and make sure the `QUERY` tab
    is empty. Then type the following:


    ```

    CREATE INDEX CustomerID_IDX ON Order_TBL (CustomerID);

    ```


    ![](Images/image00326.jpeg)


    2. Click the `EXECUTE QUERY` button ![](Images/image00196.jpeg) on top of the
    `QUERY` tab. You will now have `CustomerID_IDX` under the `INDEXES` list in the
    `ORDER_TBL` table.


    ![](Images/image00327.jpeg)


    ### Dropping Indexes


    Just like dropping a table or a view, you will use the following basic syntax:


    ```

    DROP INDEX INDEX_NAME;

    ```


    Remember that you can re-create the index after it has been deleted, but make
    sure you take extra precaution when performing such transactions. Also, when you
    delete a table, you will also be deleting all the corresponding indexes with it.
    Sometimes you may only need to delete the index and retain the table. Such implementation
    happens when you only want to fix an index problem to optimize the database performance
    and reduce fragmentation.


    To drop the index that we have created previously:


    1. Click the ![](Images/image00283.jpeg) option and make sure the `QUERY` tab
    is empty. Then type the following:


    ```

    DROP INDEX CustomerID_IDX;

    ```


    ![](Images/image00328.jpeg)


    2. Click the `EXECUTE QUERY` button ![](Images/image00290.jpeg) on top of the
    `QUERY` tab. You will now notice that the `CustomerID_IDX` index has been deleted
    from the `Indexes` list.


    ![](Images/image00329.jpeg)


    ### Normalizing Databases


    Why do you need to normalize a database? This is because in designing a database
    you need to ensure that information is well organized, easily managed, always
    accurate and there is no unnecessary duplication. Basically, normalization is
    the process of designing and redesigning a database by reducing one big table
    into two smaller tables, where the same type of data are grouped together. For
    example, if you only have one table by merging the customer information of the
    `CUSTOMER_TBL` table with the `ORDER_TBL` table, then you will get a table that
    is not normalized:


    | ORDER ID | ORDER DATE | CUSTOMER ID | NAME | POSITION | COMPANY | STATE | CONTACT
    NO | PRODUCT ID | ORDER QTY |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | 2016-05-23 | 1 | Kathy Ale | President | Tile Industrial | TX | 3461234567
    | 4 | 300 |

    | 2 | 2016-09-09 | 1 | Kathy Ale | President | Tile Industrial | TX | 3461234567
    | 5 | 100 |

    | 3 | 2016-02-17 | 3 | Kim Ash | Director | Car World | CA | 5101234567 | 2 |
    150 |

    | 4 | 2016-05-12 | 2 | Kevin Lord | VP | Best Tooling | NY | 5181234567 | 2 |
    500 |


    As you can see, there is a redundancy of data on the part of storing the customer
    information. That is why it is way better to divide this table into two smaller
    ones through the normalization process. Always bear in mind to keep data redundancy
    to a minimum, if possible, to save storage space and avoid information confusion.
    If you have customer information for every table and one table does not match
    such information then how will you be able to verify which one is correct?


    The way of measuring the depth or level to which a database has been normalized
    is called a normal form. There are three common normal forms, where each form
    is dependent on the previous layers.


    #### First Normal Form (1NF)


    Given a set of base data, the first normal form (1NF) aims to divide this into
    logical units or tables with an assigned primary key. Every cell contained in
    any of the 2-dimensional tables should only have a single value. Each row of a
    particular table refers to a certain record of information and must always be
    unique. As for the column, it is given a unique name and consists of data values
    of the same type, which pertains to a single attribute of the information. Moreover,
    there is no particular order the columns nor the rows should be arranged.


    Modifying the given database in Chapter 2 by adding employee information, you
    will have the following base data:


    ![](Images/image00330.jpeg)


    Based from the figure above, the entire company database was divided into two
    smaller tables – `EMPLOYEE_TBL` and `CUSTOMER_TBL`. The primary key for these
    tables are `EmployeeID` and `CustomerID` respectively. In this way, it is easier
    to read and manage the information as compared to one big table with so many columns
    and rows.


    #### Second Normal Form (2NF)


    After you are done with the first normal form, the next step is deriving the second
    normal form (2NF). This process focuses on functional dependency that describes
    the relationships between attributes. When an attribute determines the value of
    another, then there is functional dependency between them. In this case, you will
    store data values from the Employee and Customer tables.


    ![](Images/image00331.gif)

