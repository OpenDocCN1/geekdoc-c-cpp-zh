    \ VIEW mode.\n\n1. Click the ![](Images/image00263.jpeg) option. To ensure that\
    \ there are no transactions currently running in the database, type the following\
    \ programming line in the QUERY tab then click the `EXECUTE QUERY` button ![](Images/image00218.jpeg):\n\
    \n```sql\nEND TRANSACTION;\n```\n\n![](Images/image00274.jpeg)\n\n2. Double-click\
    \ `Customer_TBL` under the `TABLES` list in the `DATABASE NAVIGATOR` pane. Click\
    \ the `DATA` tab at the right and make sure that the `GRID View` is displayed.\
    \ You will see all the records of the `Customer_TBL` table. \n\n![](Images/image00275.jpeg)\n\
    \n3. Click the first column of the last row of the table, which is `CustomerID`\
    \ 5.\n\n![](Images/image00276.jpeg)\n\n4. Click the drop-down arrow beside the\
    \ `INSERT ROW (INS)` button and select `PLACE NEW ROWS BELOW SELECTED ROW` option.\n\
    \n![](Images/image00277.jpeg)\n\n5. This time click the `INSERT ROW (INS)` button\
    \ and you will see a new empty row added to the table.\n\n![](Images/image00278.jpeg)\n\
    \n6. Add the following data values in the new record:\n   *   `CustomerID`: 6\n\
