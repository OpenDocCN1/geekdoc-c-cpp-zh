    ```\n2. 点击 `EXECUTE QUERY` 按钮后，`CompanyAdd` 列添加到 `ContactNo` 列之后。此字段包含字符串数据类型的值。\n\
    \n## DROP 语句\n\n如果你想删除数据库对象，则使用 SQL `DROP` 语句。因此，`DROP TABLE` 语句用于删除不再需要的表。一旦执行此行，表中包含的所有数据和元数据也将被删除。`DROP\
    \ TABLE` 被是最容易执行的命令。然而，如果要删除的表被数据库中的另一个表引用，将发生错误。这就是为什么在执行 `DROP` 语句时需要小心，避免误删对象（特别是当多个用户访问数据库时）。\n\
    \n语法格式：\n```sql\nDROP TABLE TABLE_NAME [restrict | cascade];\n```\n`RESTRICT`\
    \ 选项用于在删除其他数据库对象引用的表时返回错误。相反，`CASCADE` 允许删除表以及所有其他引用对象。某些 SQL 应用程序不允许 `CASCADE`\
    \ 选项，以确保不会产生无效的数据库对象。\n\n* 删除现有表\n\n"
