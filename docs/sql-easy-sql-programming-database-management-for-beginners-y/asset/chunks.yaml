    # 引言


    你好！非常感谢下载这本《初学者 SQL 编程与数据库管理》电子书。我向你保证，投资你的数据库专业人士的技能是一个明智的决定。本电子书将教你如何使用强大的软件工具之一——`SQL`
    语言来学习数据库编程和管理的关键信息。我是 Felix，我曾从一名简单的分析师开始，现在正向数据库科学家方向发展。通过本电子书的指导，你将更好地理解 `SQL`
    语言能带带来的无数机会。我将循序渐进地介绍学习这种可靠数据库软件的基本技能方法。


    起初，我并没有意识到，如果有像 Microsoft Excel 这样的程序应用程序可以处理和展示信息，那么理解 `SQL` 是有多么重要。当我开始研究 `SQL`
    的价值时，我告诉自己，如果继续从事这个领域，我将不仅是在展示信息，还在分析数据。在下载并安装软件后，我发现学习 `SQL` 编程并没有那么挑战性！迈出理解基础数据库概念的第一步，将使你扩展知识，成为最受青的
    IT 专业人员之一。


    目前信息技术的趋势是更加数字化，这涉及到操作数据库。这正是 `SQL` 发挥用场的地方——这是一种既强大又简单、灵活、便携，而且最集成到许多数据库应用程序中的软件语言。决定成为一名数据库专业人士将向你承诺一份稳定的工作和潜在的高额报酬。平均而言，美国的一名简单数据库分析师年薪约为
    92,000 美元。


    要开启你在数据库编程和管理领域的旅程，请让本电子书作为你的初始指南，帮助你学习 `SQL` 的基础知识。我将为你提供关于该语言起源、软件及其环境的各种特性、不同的命令和函数、可用的错误处理工具、一些进阶主题以及更多内容！我的最终目标是让你欣赏
    `SQL` 的潜力并以一种酷的方式掌握编程概念。那么你还在等什么？让我们开始吧！


    # 第一章：SQL 概览


    在本章中，你将学习关于 `SQL` 如何以及为何产生的简要背景知识。获取这种计算机语言的历史知识将帮助你理解它对于大多数专注于数据处理领域的 IT 专业人士的重要性。你还将了解如何在不断变化的信息技术世界中最大化利用
    `SQL` 的潜力。


    ## SQL 的历史


    `SQL` 的读音为 ees-que-ell 或 see’qwl，这种计算机语言最初由一家名为美国跨国技术和咨询公司 `IBM`（国际商业机器公司）在 20
    世纪 70 年代利用 E. F. Codd 博士关于“大型共享数据库的数据的关系模型”的论文作为原型设计发明的。它最初被称为 `SEQUEL`（结构化英语查询语言），用于对数据的收集和组织查询——或简单称为数据库。当
    `IBM` 的研究人员发现另一家公司拥有相同的“Sequel”商标时，他们将其重命名为 `S-Q-L`（现扩展为结构化查询语言）。


