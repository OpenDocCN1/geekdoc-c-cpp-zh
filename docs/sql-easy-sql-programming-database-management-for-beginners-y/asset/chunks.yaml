  trans: "\n\n![](img/image00272.jpeg)\n\n在上面的示例中，引入了 `COUNT` 函数来对数据进行分组。以下是与 `GROUP\
    \ BY` 语句一起使用的常用聚合函数总结（`x` 表示你想要执行函数操作的列名）：\n\n*   `AVG(x)` – 计算所有列值的平均值（剔除空值）\n\
    *   `COUNT(x)` – 统计列中非空值的数量\n*   `COUNT(*)` – 统计记录数\n*   `MAX(x)` – 计算列中的最大值（剔除空值）\n\
    *   `MIN(x)` - 计算列中的最小值（剔除空值）\n*   `SUM(x)` – 计算列中数值之和或总计（忽略空值）\n\n回到 `GROUP BY`\
    \ 示例，检索了 `JobPosition` 列中的数据，并对该值的每个实例使用 `COUNT` 函数进行计数。`number_of_record` 是新创建的列，显示每个工作职位的记录总数。总监（Director）、经理（Manager）和总裁（President）职位各有\
    \ 1 条记录，而副总裁（Vice-President）有 2 条。这是因为有两个客户是副总裁——Kevin Lord 和 Mike Armhs。如果你能注意到，显示的记录默认是按升序排列的。\n\
    \n要修改你的 SQL 语句以降序显示工作职位，你需要在 `GROUP BY` 子句之后添加 `ORDER BY` 语句（`ORDER BY` 始终位于 `GROUP\
    \ BY` 语句之后）。将你的代码行更改为以下内容，然后点击 QUERY 标签页上方的 `EXECUTE QUERY`  ![](img/image00270.jpeg)：\n\
    \n```sql\nSELECT JobPosition, COUNT(*) AS number_of_record\nFROM Customer_TBL\n\
    GROUP BY JobPosition\nORDER BY JobPosition DESC;\n```\n\n![](img/image00273.jpeg)\n\
    \n在本章中，你学习了如何使用 SQL 中最常用的 DQL 命令语句，通过从数据库表中选择、排序和分组记录来编码编程行。在下一章中，你将学习不同的事务控制命令，这些命令将允许你管理多个关系型数据库事务。\n\
    \n# 第八章：事务控制命令\n\n在本章中，你将学习如何使用 SQLiteStudio 在关系型数据库管理系统 (RDBMS) 中使用的三个可用事务控制命令——`COMMIT`、`ROLLBACK`\
    \ 和 `SAVEPOINT`。控制事务需要你能够管理通常由 `insert`、`update` 和 `delete` 命令引起的某些数据库更改。\n\n\
    当你注意到表的数据或结构已经发生变化时，执行数据库事务似乎已成功完成。在事务执行期间实际发生的情况是信息被存储在数据库的临时空间中（或你可以称之为回滚区域）。当你想要完成这些事务并永久存储这些信息时，你将通过发布适当的事务控制命令，对对数据库表所所的更改进行保存或丢弃。只有这样，回滚区域才会被清空。\n\
    \n## COMMIT 命令\n\n使用 `COMMIT` 命令可以将所有事务保存到你的数据库中。通常，在 SQLiteStudio 中，当你在 SQL 编辑器中编写编程行执行\
    \ `CREATE`、`INSERT` 或 `DELETE` 事务时，更改会自动保存。你之前在第 6 章通过 `COMMIT CHANGES STRUCTURE`\
    \ 按钮首次遇到过 `COMMIT` 命令，当时你重创建了 `Customer_TBL` 表的副本。现在，为了在 SQLiteStudio 中再次演示此命令，你将通过在\
    \ GRID VIEW 模式下向 `Customer_TBL` 表添加新记录来操作表结构。\n\n1.  点击 ![](img/image00263.jpeg)\
    \ 选项。为了确保数据库当前没有正在运行的事务，在 QUERY 标签页中输入以下编程行，然后点击 `EXECUTE QUERY`  ![](img/image00218.jpeg)：\n\
    \n```sql\nEND TRANSACTION;\n```\n\n![](img/image00274.jpeg)\n\n2.  在 `DATABASE\
    \ NAVIGATOR` 格下的 `TABLES` 列表中双击 `Customer_TBL`。点击右侧的 `DATA` 标签并确保显示的是 `Grid View`。你将看到\
    \ `Customer_TBL` 表的所有记录。\n\n![](img/image00275.jpeg)\n\n3.  点击表格最后行的第一列，即 `CustomerID`\
    \ 5。\n\n![](img/image00276.jpeg)\n\n4.  点击 `INSERT ROW (INS)` 按钮旁边的箭头，选择 `PLACE\
    \ NEW ROWS BELOW SELECTED ROW` 选项。\n\n![](img/image00277.jpeg)\n\n5.  这次点击 `INSERT\
    \ ROW (INS)` 按钮，你将看到表中添加了一个新空行。\n\n![](img/image00278.jpeg)\n\n6.  在新记录中添加以下数据值：\n\
    \    *   `CustomerID`: 6\n    *   `CustomerName`: JOHN DEPP\n    *   `JobPosition`:\
    \ President\n    *   `CompanyName`: Rockers Mine Company\n    *   `USState`: TX\n\
    \    *   `ContactNo`: 3467654321\n\n![](img/image00279.jpeg)\n\n7.  点击 `COMMIT`\
    \ 按钮 ![](img/image00280.jpeg) 以永久保存添加到表中的新数据值。\n\n## ROLLBACK 命令\n\n如果说 `COMMIT`\
    \ 命令是将所有更改保存到数据库，那么 `ROLLBACK` 命令就是反过来，所有未保存的更改都将被丢弃。然而，你只能撤销自上次 `COMMIT` 或 `ROLLBACK`\
    \ 语句执行以来的更改。该事务命令的标准语法为：\n\n```sql\nROLLBACK;\n```\n\n此外，在执行 `ROLLBACK` 命令之前，请确保事务已经开始。这意味着你需要在开头执行以下语句：\n\
    \n```sql\nBEGIN TRANSACTION;\n```\n\n为了演示 `ROLLBACK` 如何工作，你将修改 SQLiteStudio 中的\
    \ `DROP TABLE` 命令：\n\n1.  点击 ![](img/image00263.jpeg) 选项。在 QUERY 标签页中输入以下编程语句，然后点击\
    \ `EXECUTE QUERY`  ![](img/image00218.jpeg)：\n\n```sql\nBEGIN TRANSACTION;\n```\n\
    \n![](img/image00282.jpeg)\n\n2.  点击 ![](img/image00283.jpeg) 选项并清除 QUERY 标签页。输入以下内容然后点击\
    \ `EXECUTE QUERY`  ![](img/image00218.jpeg)：你会注意到 `Customer_TBL` 表已从列表中移除。\n\n\
    ```sql\nDROP TABLE Customer_TBL;\n```\n\n![](img/image00284.jpeg)\n\n3.  再次点击\
    \ ![](img/image00285.jpeg) 选项并清除 QUERY 标签页。输入以下内容然后点击 `EXECUTE QUERY`  ![](img/image00218.jpeg)：\n\
    \n```sql\nROLLBACK;\n```\n\n![](img/image00286.jpeg)\n\n4.  为了检查 `ROLLBACK` 命令是否撤销了\
    \ `Customer_TBL` 表的删除，右键点击 `DATABASE NAVIGATOR` 格内的任意位置。选择 `REFRESH ALL DATABASE\
    \ SCHEMAS` 选项。\n\n![](img/image00287.jpeg)\n\n5.  点击左侧的 `TABLE` 列表。你现在可以看到 `Customer_TBL`\
    \ 表回来了。\n\n![](img/image00288.jpeg)\n\n## SAVEPOINT 命令\n\n当你只想回滚到某个点而不是整个事务时，你需要在执行\
    \ `ROLLBACK` 操作之前执行 `SAVEPOINT` 命令。这就是你将多个事务管理为更小 SQL 命令组的方法。该事务控制命令的标准语法为：\n\n\
    ```sql\nSAVEPOINT SAVEPOINT_NAME;\n```\n\n当结合使用 `SAVEPOINT` 和 `ROLLBACK` 命令时，语法为：\n\
    \n```sql\nROLLBACK TO SAVEPOINT_NAME;\n```\n\n保存点的名称可以与执行事务的数据库对象名称相同。但是，你应该记住使其唯一，与你想要拆分为几个点或段的事务组区分开。\n\
    \n为了演示带有 `ROLLBACK` 命令的 `SAVEPOINT` 如何工作，你将从 `Customer_TBL` 表中删除某些记录并撤销此事务。\n\n\
    1.  点击 ![](img/image00250.jpeg) 选项。在 QUERY 标签页中，输入以下编程语句并点击 `EXECUTE QUERY`  ![](img/image00196.jpeg)：\n\
    \n```sql\nBEGIN TRANSACTION;\n```\n\n![](img/image00289.jpeg)\n\n"
