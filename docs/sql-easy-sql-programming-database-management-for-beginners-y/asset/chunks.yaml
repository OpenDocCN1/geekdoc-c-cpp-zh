    Again, anything inside the brackets that is indicated in the `WHERE clause statement
    is optional and the maximum number of columns is represented by “n”. The said
    clause identifies which rows need to be updated - this means that if the `WHERE`
    clause is not present then all the records of the table are automatically modified.


