    # Introduction


    Hi there! Thank you so much for downloading this eBook in SQL Programming and
    Database Management for Beginners. I assure you that you have made a wise decision
    in investing in your skills as a database professional. This eBook will teach
    you vital information on the fundamentals of database programming and management
    using one of the powerful software tools – the `SQL` language. I am Felix, who
    also started as a simple analyst and now progressing into becoming a database
    scientist. Through the guidance of this eBook, you will have a better understanding
    of the countless opportunities that this `SQL` language can bring you. I will
    be presenting you step-by-step instructions in learning the essential skills of
    this reliable database software.


    At first, I did not realize how important it is for one to comprehend `SQL` if
    there are other program applications you can use, such as Microsoft Excel, to
    process and present information. When I started researching for the value of `SQL`,
    I told myself that if I continue embarking on this field then I will not just
    be presenting information but analyzing data as well. After downloading and installing
    the software, I have found out that it is not that challenging to study `SQL`
    programming after all! Taking that first step to understanding the basic database
    concepts will lead you to expanding your knowledge in becoming one of the most
    sought-after IT professionals.


    The current trend in information technology is to be more digital, which entails
    manipulating databases. This is where `SQL` comes in place – a software language
    that is powerful yet simple, flexible, portable and, most of all, integrated into
    numerous database applications. Deciding to become a database professional will
    definitely promise you a secured job with a potential high remuneration. On the
    average, a simple database analyst in the United States earns an annual salary
    of around $92,000 USD.


    To start your journey in this field of database programming and management, let
    this eBook serve as your initial guide in educating yourself with the basics of
    `SQL`. I will provide you an overview of how the language started, the various
    features of the software and its environment, the different commands and functions,
    the available error-handling tools, some advanced topics and many more! My ultimate
    aim is for you to appreciate the potentials of `SQL` and grasp the programming
    concepts in a cool way. So what are you waiting for? Let us get started!


    # Chapter One: SQL Overview


    In this chapter you will learn a brief background on how and why `SQL` came into
    existence. Gaining knowledge on the history of this computer language will help
    you understand its importance to most IT professionals who focus on the field
    of data manipulation. You will also have an idea on how to maximize the potentials
    of `SQL` in the ever-changing world of Information Technology.


    ## History of SQL


    Pronounced as ees-que-ell or see’qwl, `SQL` is a computer language initially invented
    by an American multinational technology and consulting company known as `IBM`
    (International Business Machines Corporation) way back1970s using Dr. E. F. Codd’s
    paper on “A Relational Model of Data for Large Shared Data Banks” for the prototype
    design. It was originally called `SEQUEL` (Structured English QUEry Language)
    that handled queries on the collection and organization of data - or simply known
    as a database. When `IBM` researchers learned that there is another company that
    had the same “Sequel” trademark, they renamed it to `S-Q-L` (presently expanded
    as Structured Query Language).

