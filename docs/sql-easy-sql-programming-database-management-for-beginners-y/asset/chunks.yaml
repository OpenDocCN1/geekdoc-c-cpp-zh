    | 4 | 2016-05-12 | 2 | 2 | 500 |


    As you can see, a `table` consists of `rows` and `columns`. Referring to the `CUSTOMER
    TABLE`, each `row` is a `tuple` and each `column` is an `attribute`. For instance,
    a `row` represents a single `record` while a `column` represents a specific `property`.
    In a relational database, `tables` are related to one another, which improves
    the data retrieval process when a `query` is submitted by the user.


    To clearly picture out this idea, convert the information found on the calling
    card holder into a spreadsheet like a Microsoft Excel file. Assume that these
    are your contacts from companies that have ordered products and services from
    your business. You will also have an `ORDER TABLE` that will store information
    such as `order ID`, `date`, `quantity` and more.


    A Database Management System (DBMS) is software designed to manage, store, and
    retrieve data. It acts as an interface between the user and the database. A DBMS
    allows users to create, read, update, and delete data without needing to know
    the technical details of data storage. Common examples of DBMS include MySQL,
    PostgreSQL, Oracle, and SQL Server. Each has its own features and syntax, but
    they all share the common goal of managing data efficiently and securely.

