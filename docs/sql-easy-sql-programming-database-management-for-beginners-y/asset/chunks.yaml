    ### Assigning Primary and Foreign Keys


    It is one of the best practices to assign a primary key when you define a table.
    In a relational database, the primary key is a special field or combination of
    fields that make each record unique. Furthermore, fields designated as primary
    keys cannot contain null values. Defining a primary key, whether it is explicit
    or implied, occurs during table creation.


    In the previous chapters, you have been dealing with the `CUSTOMER` table and
