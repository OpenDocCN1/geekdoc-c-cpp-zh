    ### DELETE Statement


    The `DELETE` statement is a DML command that will remove records from a table
    but will still keep its existence in the database. This happens when you don’
    need a particular information in your database, either because they are obsolete
    or have no use anymore. Thus, you can free up some storage space. You can execute
    the `DELETE` command to remove just one record, multiple records or even all the
    records of the table at one time. Just a reminder, this command does not delete
    values from a specific column, but removes an entire row or a full record. That
    is why you have to be very careful when executing this command. There is a possibility
    that the effect of the `DELETE` command is permanent and you may not be able to
    recover the erased data. The standard syntax for this DML statement is:


    ```sql

    DELETE FROM TABLE_NAME

    [WHERE CONDITION];

    ```


    Even if the `WHERE` clause is an optional part, you are required to include it
    when you want to delete selected rows of data from a certain table. Without the
    `WHERE` clause, you will delete all rows.


    To demonstrate the function of the `DELETE` statement, create a copy of the `TBL`
    first.


    1. Go to the `NAVIGATOR` then right-click on `TBL`. Choose `CREATE SIMILAR TABLE`.
    ![](Images/image0034.jpeg)

    2. You will be asked for a name. Type `Customer_2`. ![](Images/image0035.jpeg)

    3. Click on `STRUCTURE CHANGES`. ![](Images/image0036.jpeg)


    At this point `Customer_2` is empty, you have to copy records from `TBL`. To do
    this, follow the steps:


    1. Click the ![](Images/image00220.jpeg) option then click the `REFRESH TABLE
    DATA` button ![](Images/image00221.jpeg) or press `F5` on your keyboard to update
    the values.

    2. Highlight the first row in the `CustomerID` column. ![](Images/image00219.jpeg)

    3. Right-click on the `CustomerID` column. ![](Images/image00218.jpeg)

    4. Click `COPY`. ![](Images/image00217.jpeg)

    5. Click on the `DATA` tab. ![](Images/image00228.jpeg)

    6. Click the ![](Images/image00227.jpeg) drop arrow beside `INSERT`. Select `MULTIPLE
    ROWS`. ![](Images/image00226.jpeg)

    7. Inside the `NUMBER OF ROWS TO INSERT` box type `5`. ![](Images/image00224.jpeg)

    8. Right-click the cell then `PASTE`. ![](Images/image00223.jpeg)

    9. All data from `TBL` will be inserted to `Customer_2`. ![](Images/image00222.jpeg)

    10. Click on `STRUCTURE CHANGES` ![](Images/image00249.jpeg) to save the data.


    ### Single Record


    To delete only one record of data from `Customer_2` table where the customer’s
    name matches ‘KATHY ALE’:


    1. Click the ![](Images/image00255.jpeg) option, type the following lines of code
    in the `QUERY` tab and click the `EXECUTE QUERY` button ![](Images/image00218.jpeg).


    ```sql

