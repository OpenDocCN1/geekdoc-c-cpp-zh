    \ and store the information permanently, then you either save or discard the changes\
    \ made to the database tables by issuing the appropriate transactional control\
    \ command. Only then that the rollback area is emptied.\n\n## COMMIT Command\n\
    \nUsing the `COMMIT` command saves all the transactions into your database. Normally,\
    \ in SQLiteStudio, whenever you execute a `CREATE`, `INSERT` or `DELETE` transaction\
    \ by writing programming lines in the SQL Editor, the changes are automatically\
