    2. 要检查记录是否已删除，请点击 ![](img/image00252.jpeg) 进入 `Customer_TBL2` 表。然后点击 `REFRESH
    TABLE DATA`按钮 ![](img/image00257.jpeg) 或按下键盘上的 `F5` 键来更新数值。你会发现这两条记录已经被删除了。


    ![](img/image00258.jpeg)


    ### 全表


    要一次性删除 `Customer_TBL2` 表中的所有剩余记录：


    1. 点击 ![](img/image00259.jpeg) 选项，在 `QUERY` 标签页中输入以下代码，然后点击 `EXECUTE QUERY` 按钮
    ![](img/image00230.jpeg)。


    ```sql

    DELETE FROM Customer_TBL2

    ```


    ![](img/image00260.jpeg)


    2. 要检查记录是否已删除，请点击 ![](img/image00261.jpeg) 进入 `Customer_TBL2` 表。然后点击 `REFRESH
    TABLE DATA` 按钮 ![](img/image00262.jpeg) 或按下键盘上的 `F5` 键来更新数值。你会发现执行单条 `DELETE`
    命令已经删除了表中的所有记录。


    在本章中，你学习了如何使用最常用的 DML 命令语句来编码编程行，以便在 SQL 中从数据库表中插入、更新和删除记录。在下一章中，你将学习不同的 DQL 命令，这些命令将允许你检索数据库表中包含的有价值信息。


    # 第七章：查询查询语句


    在本章中，你将学习如何使用可用的数据查询语言语句从数据库表中检索数据。通过 `SQLiteStudio`，你将能够使用 `SELECT`、`WHERE`、`ORDER
    BY` 和 `GROUP BY` 语句请求并显示重要的数据库信息。


    一旦你创建了表并填充了数据值，将会有需要你执行数据库查询来检索相关信息。查询是对数据库的有效提问，根据用户的请求，以可读或易理解的格式提取并显示数据。SQL
    的主要挑战在于如何通过行选择操作数据库，从而正确地指示计算机搜索什么。一旦你选定了所需的值，就可以进一步执行各种操作，如数据添加、删除、修改等。


    ## SELECT 语句


    检索数据值是数据库用户执行的最频繁的操作任务。执行此类操作时，你需要使用名为 `SELECT` 的 DML 命令语句。你可以选择只检索一行、多行或数据库表中的所有行。


    使用 `SELECT` 语句检索特定表的所有记录是该 DML 命令语句的基本形式。即使 `SELECT` 命令被认为是最强大的语句，它也需要其他子句在执行查询时才能正常工作。其最简单形式的语法为：


    ```sql

    SELECT * FROM TABLE_NAME;

    ```


    在上面的编程行中，星号 `*` 代表所有内容。这意味着通配符是列出特定表所有列列的快捷方式。


    要从 `Customer_TBL` 表中选择所有数据行：


    1. 点击 ![](img/image00263.jpeg) 选项，然后输入以下代码：


    ```sql

    SELECT * FROM Customer_TBL;

    ```


    2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00218.jpeg)。此 `SELECT` 命令的结果显示在 `GRID VIEW`
    标签页中。


    ![](img/image00264.jpeg)


    结果基本上显示了 `Customer_TBL` 表的所有数据，因为代码指示数据库选择该表的所有行和列。


    ### WHERE 语句


    当你想要更具体地从数据库表中选择数据行时，你需要为你的编程行增加一些复杂性。此时，你需要 `WHERE` 子句的功能，这意味着只有当子句内指定的条件为真时，才会执行
    `SELECT` 操作。带有 `WHERE` 子句的 `SELECT` 语句语法如下：


    ```sql

    SELECT COLUMN_LIST

    FROM TABLE_NAME

    WHERE CONDITION;

    ```


    仅选择客户职位为“副总裁”（Vice-President）的数据行：


    1. 点击 ![](img/image00263.jpeg) 选项，然后输入以下代码：


    ```sql

    SELECT *

    FROM Customer_TBL

    WHERE JobPosition = ‘Vice-President’;

    ```


    2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00265.jpeg)。此 `SELECT` 命令的结果显示在 `GRID VIEW`
    标签页中。


    ![](img/image00266.jpeg)


    结果显示了两个名为 Kevin Lord 和 Mike Armhs 的客户记录，他们都是各自公司的副总裁。


    如果你只想选择表中的某些列，可能只需要客户的全名和公司呢？你现在可以将你的代码行修改为以下内容：


    1. 在 `QUERY` 标签页中，通过输入以下内容将通配符 `*`（星号）改为 `CustomerName` 和 `CompanyName`：


    ```sql

    SELECT CustomerName, CompanyName

    FROM Customer_TBL

    WHERE JobPosition = ‘Vice-President’;

    ```


    2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00267.jpeg)。此 `SELECT` 命令的结果显示在 `GRID VIEW`
    标签页中。


    ![](img/image00268.jpeg)


    通过指定你想选择的列，你在尝试检索数据以及如何检索。


    ### ORDER BY 和 GROUP BY 语句


    当你希望检索的数据以某种方式显示并排序时，你需要在句尾包含 `ORDER BY` 或 `GROUP BY` 操作符。`ORDER BY` 语句的主要功能是特定排列数据，无论是升序还是降序。另一方面，`GROUP
    BY` 语句用于将相同的数据聚集在一起并安排查询输出。


    ```sql

    SELECT COLUMN_LIST

    FROM TABLE_NAME

    ORDER BY COLUMN_LIST [ASC | DESC];

    ```


    默认情况下，`ORDER BY` 按升序排列单独行。如果你想按降序排列记录，则必须在 `ORDER BY` 子句末尾指示 `DESC`。


    从 `Customer_TBL` 表中检索所有客户记录并按州升序排列：


    1. 点击 ![](img/image00259.jpeg) 选项，然后输入以下代码：


    ```sql

    SELECT *

    FROM Customer_TBL

    ORDER BY USState;

    ```


    2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00203.jpeg)。此 `SELECT` 命令的结果显示在 `GRID VIEW`
    标签页中。


    ![](img/image00269.jpeg)


    由于你没有指定排序方式，数据行使用 `USState` 列按字母顺序排列。如果你想按降序排列记录：


    1. 在 `QUERY` 标签页中，在 `ORDER BY` 子句的 `USState` 之后添加 `DESC`。


    ```sql

    SELECT *

    FROM Customer_TBL

    ORDER BY USState DESC;

    ```


    2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00270.jpeg)。此 `SELECT` 命令的结果显示在 `GRID VIEW`
    标签页中。


    ![](img/image00271.jpeg)


    如果你想确定一组记录某些情况，或者需要以逻辑方式合并具有重复值的列，那么是时候使用 `GROUP BY` 子句了。与分组类似的术语还有聚合、汇总和汇总。为了说明这一点，如果你想知道
    `Customer_TBL` 表中每个职位有多少位客户，我们需要统计记录数并显示每个职位的客户总数。


    1. 点击 ![](img/image00263.jpeg) 选项，然后输入以下代码：


    ```sql

    SELECT JobPosition, COUNT(*) AS number_of_record

    FROM Customer_TBL

    GROUP BY JobPosition;

    ```


    2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00218.jpeg)。此 `SELECT` 命令的结果显示在 `GRID VIEW`
    标签页中。

