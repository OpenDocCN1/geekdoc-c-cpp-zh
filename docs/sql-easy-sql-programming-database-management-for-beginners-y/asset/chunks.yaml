    | 1 | Kathy Ale | President | Tile Industrial | TX | 3461234567 | own| 2 | Kevin
    Lord | VP | Best Tooling | NY | 5181234567 |

    | 3 | Kim Ash | Director | Car World | CA | 5101234567 |

    | 4 | Abby Karr | Manager | West Mart | NV | 7751234567 |


    You will also have an `ORDER TABLE` that will store information such as order
    ID, date, quantity and more. Check the following table:


    | ORDER ID | ORDER DATE | CUSTOMER ID | PRODUCT ID | ORDER QTY | own| :--- | :---
    | :--- | :--- | :--- | own| 1 | 2016-05-23 | 1 | 4 | 300 |

    | 2 | 2016-09-09 | 1 | 5 | 100 |

