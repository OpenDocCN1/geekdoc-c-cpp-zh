    \n![](Images/image00279.jpeg)\n\n7. Click the `COMMIT` button ![](Images/image00280.jpeg)\
    \ to permanently save the new data values added to the table.\n\n## ROLLBACK Command\n\
    \nIf the `COMMIT` command saves all the changes to the database, the `ROLLBACK`\
    \ command is the reverse where all the unsaved changes will be discarded. However,\
    \ you can only undo transactions since the last `COMMIT` or `ROLLBACK` statement\
    \ executed. The standard syntax for this transactional control command is:\n\n\
    ```sql\nROLLBACK [WORK];\n```\n\nAlso, before you can perform a `ROLLBACK` command,\
    \ make sure that transactions have started. This means that you need to execute\
    \ the following programming statement at the very beginning:\n\n```sql\nBEGIN\
    \ TRANSACTION;\n```\n\nTo demonstrate how a `ROLLBACK` statement works, you will\
    \ modify the `DROP TABLE` command in SQLiteStudio:\n\n1. Click the ![](Images/image00263.jpeg)\
