    In this chapter you have learnt an overview of SQL – its history, its primary
    purpose why it was created and those who will profit from learning this powerful
    database software. In the next chapter you will learn the essentials of database,
    which is the primary reason why SQL was designed in the first place.


    # Chapter Two: The Database Essentials


    Before you start learning the technicalities of SQL as a computer language, this
    chapter will discuss first what a database is and its fundamental characteristics.
    You will also be informed why the business world is now driven to gather and manipulate
    data to bring forth more profitable income.


    Database Fundamentals


    There are many ways on how to define or describe what a database is. In simple
    terms, it can be defined as a collection of items that can exist over a long period
    of time. Think of a calling card holder as a database that contains business cards
    with different information of people that you know (e.g. person’s name, job title,
    company name, contact number). Another one is a printed telephone directory (more
    popularly known as the yellow pages) that contains the name, phone number and
    address of the registered residents living in a particular area.


    Some define database more professionally, not just a collection of data. It is
    described as an organized tool capable of keeping data or information that you
    can retrieve in an effective and efficient way when the need arises. It can also
    be more strictly defined as a self-describing collection of objects that are integrated
    to one another. When you create representations of these physical or conceptual
    objects then they will be called records. From the previous example of your calling
    card holder, if you wish to keep track of your business contacts then you have
    to assign each business card a specific record. Every record contains multiple
    information or data, such as individual name, job title, company name and address,
    phone number and more that you will now call the record’s attributes.


    A database does not only contain the data that you need, but also what you call
    its metadata. This is the information that defines or describes the data’s structure
    within the given database (that is why it was defined earlier as a self-describing
    entity), stored in a region called data dictionary. Thus, data retrieval will
    be faster if you know how information is arranged and stored. Furthermore, relationships
    exist among the data items since they are integrated to one another. Check the
    following figure for a sample illustration of what a database is.


    ![](Images/image00174.gif)


    Whether a database contains a simple collection of a few records or a massive
    system composed of millions of records, it can be categorized into three types:
    personal, workgroup  or departmental, and enterprise. Each category is characterized
    by the database size, the machinery size into which the database runs and how
    big the organization that manages it. 


    *   Personal Database – This is conceptualized and designed by a single person
    on a stand-alone computer. Its database structure is rather simple and the size
    is relatively small. For example, your personal electronic address book.


    *   Workgroup/Departmental Database – This is designed and created by individuals
    of a single workgroup or department within a certain organization. The database
    structure is larger and more complex, as compared to the personal category, which
    is also accessed by multiple users at the same time.


    *   Enterprise Database – Among the three categories, this type is conceptualized
    and created to handle the entire flow of information of very large organizations.
    Thus, the database design involves far more complex structures.


    Relational Database Fundamentals


    Taking the discussion further into a more technical aspect, a relational database
    is an entity consisting of logical units known as tables. This relational database
    model was first formulated by Dr. E. F. Codd in 1970\. How the tables are related
    to each other defines their relationships. In this scenario, data is simplified
    into smaller yet more logical and manageable units that optimize the database
    performance. The following figure shows an illustration on how the various components
    of a relational database are connected to each other.


    ![](Images/image00175.jpeg)'
