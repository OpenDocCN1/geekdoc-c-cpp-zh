    索引与其创建的表的存储空间是分开的。这种分配的物理空间可能会大幅增加，甚至比它所引用的表还要大。这就是为什么在设计数据库时需要考虑存储需求。就像表和视图一样，索引也可以创建或删除。如果设计得当，它们实际上会加速
    `SELECT` 查询，但可能会减慢 `DELETE`、`UPDATE` 和 `INSERT` 语句。对于巨大的数据库，数据检索肯定会消耗大量时间。然而，此类索引事务对表的数据没有影响。


    ### 创建索引


    索引在创建时与特定的列相关联。然后，它持有包含该特定索引列的表中数据值的位置。每当向表中添加新数据时，数据也会被添加到索引中。假设你执行一个在 `WHERE`
    子句中指定了特定条件的 `SELECT` 语句，该条件检查了索引列。首先发生的情况是先搜索索引，只有在找到数据值时才会返回确切的位置。


    例如，你想从 `ORDER` 表中选择所有 `Customer ID` 等于 `1` 的记录。你将执行以下查询：


    ```

    SELECT *

    FROM Order_TBL

    WHERE CustomerID = 1;

    ```


    如果 `ORDER_TBL` 表在 `CustomerID` 列上建立了索引，那么记录将根据该列进行升序排列。因此，`CustomerID` 索引使得搜索过程更容易进行，并最终确定所有具有匹配
    `Customer ID` 的数据的位置。一旦确定了位置，将从 `ORDER_TBL` 表中检索相应的数据行。如果没有索引，将执行全表扫描，如果表包含成百甚至数千条记录，这将是低效的。


    ![](img/image00325.gif)


    创建索引的基本语法是：


    ```

    CREATE INDEX INDEX_NAME ON TABLE_NAME [(COLUMN_NAME)];

    ```


    此语句可以通过添加规格发生变化，例如要建立索引的列名、排序（升序或降序）等等。现在，在 SQLiteStudio 中为 `ORDER_TBL` 表创建 `ColumnID`
    索引：


    1. 点击 ![](img/image00304.jpeg) 选项并确保 `QUERY` 标签页是空的。然后输入以下：


    ```

    CREATE INDEX CustomerID_IDX ON Order_TBL (CustomerID);

    ```


    ![](img/image00326.jpeg)


    2. 点击 `QUERY` 标签页上方的 `EXECUTE QUERY` 按钮 ![](img/image00196.jpeg)。你现在可以在 `ORDER_TBL`
    表的 `INDEXES` 看到 `CustomerID_IDX`。


    ![](img/image00327.jpeg)


    删除 删除索引


    就像删除表或视图，你将使用以下基本语法：


    ```

    DROP INDEX INDEX_NAME;

    ```


    记住，你可以在删除索引后重新创建它，但在执行此类事务时务必格外小心。此外，当你删除一个表时，也会同时删除所有相关的索引。有时你可能只需要删除索引而保留表。这种实现发生在你只想修复索引问题以优化数据库性能并减少碎片时。


    要删除之前创建的索引：


    1. 点击 ![](img/image00283.jpeg) 选项并确保 `QUERY` 标签页是空的。然后输入以下：


    ```

    DROP INDEX CustomerID_IDX;

    ```


    ![](img/image00328.jpeg)


    2. 点击 `QUERY` 标签页上方的 `EXECUTE QUERY` 按钮 ![](img/image00290.jpeg)。你现在会注意到 `CustomerID_IDX`
    索引已从 `Indexes` 列表中删除。


    ![](img/image00329.jpeg)


    ### 数据库规范化


    为什么你需要对数据库规范化？因为在设计数据库时，你需要确保信息组织良好、易于管理、始终准确且没有不重复。基本上，规范化是通过将一个大表拆分为两个较小的表来设计和重新设计数据库的过程，其中相同类型的数据被在一起。例如，如果你只通过合并
    `CUSTOMER_TBL` 表和 `ORDER_TBL` 表的客户信息来创建一个表，那么你将得到一个未规范化的表：


    | ORDER ID | ORDER DATE | CUSTOMER ID | NAME | POSITION | COMPANY | STATE | CONTACT
    NO | PRODUCT ID | ORDER QTY |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | 2016-05-23 | 1 | Kathy Ale | President | Tile Industrial | TX | 3461234567
    | 4 | 300 |

    | 2 | 2016-09-09 | 1 | Kathy Ale | President | Tile Industrial | TX | 3461234567
    | 5 | 100 |

    | 3 | 2016-02-17 | 3 | Kim Ash | Director | Car World | CA | 5101234567 | 2 |
    150 |

    | 4 | 2016-05-12 | 2 | Kevin Lord | VP | Best Tooling | NY | 5181234567 | 2 |
    500 |


    如你所示，客户信息部分存在数据冗余。

