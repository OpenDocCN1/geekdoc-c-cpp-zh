    如果你认为 `SQL` 数据库只是集合的集合，那么你就错了。还需要指定额外的结构来维护你数据的完整性，例如模式（schemas）、域（domains）和约束（constraints）。


    *   **Schema（模式）** – 这也称为概念视图或完整的逻辑视图，定义了整个数据库的结构并提供了整体的表组织。这种模式被视为元数据——存储在表中，并是数据库的一部分（就像包含普通数据的表一样）。

    *   **Domain（域）** – 它规定了可以在特定表列或属性中存储的所有有限数据值的集合。例如，在我们之前的 `CUSTOMER TABLE` 中，如果你只提供德克萨斯州、纽约州、加利福尼亚州和内华达州的产品和服务，那么
    `STATE` 列只能包含“TX”、“NY”、“CA”和“NV”。所以这四个州缩写就是 `STATE` 属性的域。

    *   **Constraint（约束）** – 经常被忽略但是数据库的重要组件之一，它设定了规则，识别特定表属性可以包含哪些数据值。结合严格的约束可以确保数据库用户只向特定列输入有效数据。与定义的表特征一起，列约束决定了它的域。使用相同的
    `STATE` 列作为示例，给定仅限这四个值的约束，如果数据库用户为新泽西输入“NJ”，则该条目将不被接受。除非由于业务突然变化需要更新数据库结构，否则系统将不会在为
    `STATE` 属性输入有效值。


    ## SQL 命令类型


    在开始使用 `SQL` 编程之前，你需要了解它在执行各种功能时的基本命令分类——包括数据库创建、对象操纵、数据填充和更新、数据删除、查询提交、访问控制和数据库管理等。以下是主要类别：


    ### 数据定义语言 (DDL)


    数据定义语言（或简单称为 `DDL`）允许你创建、更改或重构甚至破坏关系型数据库中包含的基本元素。`DDL` 仅关注结构，而不关注元素中包含的数据。这些基本元素或数据对象包括表、模式、视图等。视图由于没有独立的物理存在，被视为虚拟表，其定义只存在于元数据中。然而，视图的数据来自你派生视图的表（或多个表）。下面列了一些最常见的
    `DDL` 命令：


    *   **CREATE** – 该命令语句负责构建数据库结构。其语法为：

    ```

    CREATE TABLE

    CREATE VIEW

    ```

    *   **ALTER** – 该命令语句负责在数据库创建后更改其结构。其语法为：

    ```

    ALTER TABLE

    ALTER VIEW

    ```

    *   **DROP** – 该命令是 `CREATE` 语句的相反操作，用于破坏数据库结构。其语法为：

    ```

    DROP TABLE

    DROP VIEW

    ```


    ### 数据操纵语言 (DML)


    数据操纵语言（或简单称为 `DML`）由处理维护的 SQL 命令组成。这意味着你可以操纵关系型数据库内部的数据。这些语句读起来像普通的句子，允许你输入、更改或删除数据。以下是：


    *   **INSERT** – 该命令语句用于向表插入新数据。向具有两列的表添加值使用以下语法：

    ```

    INSERT INTO TABLE_NAME

    VALUES (''value1'', ''value2'');

    ```

    `TABLE_NAME` 是你要添加值的表名。`VALUES` 括号内的项数量代表列的数量。如果值是字符或日期/时间类型，需要用单引号括起来。数值或空值则不需要（空值应写为
    `NULL`）。

    *   **UPDATE** – 该命令语句用于修改或更改表中已存在的数据，而不是添加或删除记录。更新是针对一个表或数据库中一个表的多个行/列进行的。更改单个列使用以下语法：

    ```

    UPDATE TABLE_NAME

    SET COLUMN_NAME = ''value''

    [WHERE CONDITION];

    ```

    只要满足给定的 `WHERE` 子句，`COLUMN_NAME` 的值将被更新。这可以在给定 `TABLE_NAME` 的一个或多个记录中进行。

    *   **DELETE** – 该命令删除某些记录甚至整个表，而不是从特定列删除数据值。从表中删除一行或多条记录使用以下语法：

    ```

    DELETE FROM TABLE_NAME

    [WHERE CONDITION];

    ```

    如果你想从 `TABLE_NAME` 中删除选定的行，`WHERE` 子句是该命令的重要部分。


    ### 数据查询语言 (DQL)


    数据查询语言（或简单称为 `DQL`）由执行数据选择的命令组成，这是关系型数据库用户的主要关注点。使用的语句是 `SELECT`，它可以带有其他子句或选项，以便你的提取结果以组织良好且易读的格式呈现。你可以使用单独的应用程序或命令行向数据库提交查询。以下是简单
    `SELECT` 语句的语法：

    ```

    SELECT [* | ALL | DISTINCT COLUMN1, COLUMN2]

    FROM TABLE1 [, TABLE2];

    ```

