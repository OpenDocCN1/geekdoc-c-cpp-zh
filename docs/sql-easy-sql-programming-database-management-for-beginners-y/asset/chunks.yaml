  trans: "\n在学习了通用的预定义数据类型后，你现在将转向用户定义数据类型，简称为 `UDTs`。从名称本身来看，这些是用户根据现有数据类型定义或指定的数据值。因此，允许自定义以最大限度地利用存储空间并满足其他用户需求。此外，数据库应用程序开发对程序员来说变得更加灵活。这意味着当需要在多个表中定义的列中输入相同类型的数据时，你可以使用\
    \ `UDTs`。要定义 `UDTs`，你可以使用 `CREATE TYPE` 语句。\n\n例如，如果你想为你的数据库将 `USDollar` 和 `UKPound`\
    \ 定义并区分为两种货币，则可以创建以下 `UDTs`：\n\n```sql\nCREATE TYPE USDollar AS DECIMAL (9, 2)\
    \ ;\nCREATE TYPE UKPound AS DECIMAL (9, 2) ;\n```\n\n即使这两个数据类型都是使用预定义的 `DECIMAL`\
    \ 类型创建的，但它们在数据库中都有各自的功能和特性。回到之前章节中客户和订单信息的示例代码中，你现在可以创建以下包含这两个 `UDTs` 的发票表：\n\n\
    ```sql\nCREATE TABLE AmericaInvoice (\n    InvoiceID INTEGER PRIMARY KEY,\n  \
    \  CustomerID INTEGER,\n    OrderID INTEGER,\n    TotalSaleAmt USDollar,\n   \
    \ ShippingFee USDollar\n);\n\nCREATE TABLE UnitedKingdomInvoice (\n    InvoiceID\
    \ INTEGER PRIMARY KEY,\n    CustomerID INTEGER,\n    OrderID INTEGER,\n    TotalSaleAmt\
    \ USDollar,\n    ShippingFee USDollar\n);\n```\n\n在本章中，你学习了 SQL 语言中提供的各种数据类型的特性。你还理解了创建用户定义数据类型的必要性，使你的数据库不再复杂且更具移植性。在下一章中，你将学习如何在创建数据库对象时使用不同的数据定义语句。\n\
    \n# 第五：数据定义语言\n\n在本章中，你将对三个数据语言语句——`CREATE`、`ALTER` 和 `DROP` 有更深入的理解。通过 SQLiteStudio，你还将学习如何编码数据库结构。再次，数据库对象是任何存储或引用数据的定义逻辑单元。当你有一组数据库对象时，你会创建一个与特定数据库关联的模式（schema）。本章的重点是数据存储的基本形式，即关系表。一个简单的表由行（对应数据记录）和列（也称为字段）组成。数据库表始终至少包含一列和一个由一个或多个字段组成的行。\n\
    \n## CREATE 语句\n\nSQL `CREATE` 语句的多种形式负责构建关键的数据库结构——表、视图、域等。创建表的操作可能很容易，但你需要考虑许多因素。在实际实施之前规划表结构可以节省你的精力和精力，因为在表创建后，你不需要再重新配置。\n\
    \n以下是创建表时需要考虑的一些因素：\n* 表将包含的数据类型\n* 表名和列名\n* 主键（使数据每行数据都是唯一的列，以避免表中出现重复记录）\n*\
    \ 列长度\n* 包含空值的列\n\n语法格式：\n```sql\nCREATE TABLE TABLE_NAME (\n    field1 DATA_TYPE\
    \ [not null],\n    field2 DATA_TYPE [not null],\n    field3 DATA_TYPE [not null],\n\
    \    field4 DATA_TYPE [not null],\n    field5 DATA_TYPE [not null]\n);\n```\n\
    列名（`field1`、`field2`、`field3`、`field4` 和 `field5`）和字段数据类型写在括号内，用逗号分隔。括号内指示的任何内容都是可选的，语法最后以分号结束。使用第\
    \ 2 章中的 `CREATE TABLE`，你将使用 SQLiteStudio 创建一个新的数据库表。\n\n### 创建新数据库\n1. 双击桌面上的应用程序图标打开\
    \ SQLiteStudio。\n2. 点击 `DATABASE` 菜单然后选择 `ADD DATABASE`。\n3. 在 `FILE` 输入框内输入 `Sample_DB`（这是新数据库的名称），然后点击\
    \ OK。\n4. 现在你在数据库导航器（Database Navigator）面板中拥有 `Sample_DB` 对象。\n\n### 创建新表\n1.\
    \ 点击 `TOOLS` 菜单然后选择 `OPEN SQL EDITOR`。你将在右侧面板中获得 SQL 编辑器区域。如果你双击 `Sample_DB`，你将在数据库对象下看到\
    \ `TABLES` 和 `VIEWS`。目前还没有表或视图，因此你将使用 SQL 编辑器面板创建一个创建一个。\n2. 在 `QUERY` 标签页下，输入以下代码行：\n\
    ```sql\nCREATE TABLE Customer_TBL (\n    CustomerID INTEGER NOT NULL PRIMARY KEY,\n\
    \    CustomerName VARCHAR NOT NULL,\n    JobPosition VARCHAR,\n    CompanyName\
    \ VARCHAR NOT NULL,\n    USState VARCHAR NOT NULL,\n    ContactNo BIGINTEGER NOT\
    \ NULL\n);\n```\n3. 点击 `QUERY` 标签页上方的 `EXECUTE QUERY` 按钮或在键盘上按 `F9`。你现在拥有了一个包含\
    \ 6 列的 `Customer_TBL` 表。\n\n## ALTER 语句\n\nSQL `ALTER` 语句用于修改数据库对象，特别是表。修改表元素可以包括添加和删除列、更改列定义、添加和删除约束、修改表存储值等。\n\
    \n语法格式：\n```sql\nALTER TABLE TABLE_NAME [modify] [column COLUMN_NAME] [DATA TYPE\
    \ | null not null] [restrict | cascade] [drop] [constraint CONSTRAINT_NAME] [add]\
    \ [column] COLUMN DEFINITION;\n```\n\n### 通过添加新列修改表\n1. 为 `Customer_TBL` 表添加一个包含客户地址的新列。在\
