  \n\n\n\n### 7.7 回想，如果排序算法保留了重复键的原始顺序，则称该算法是稳定的。我们可以通过修改输入键来使任何算法变得稳定，这种方法是将（可能）重复的键值以某种方式变为唯一，使得原始重复值的第一次出现小于第二次出现，第二次出现又小于第三次出现，依此类推，从而使这些键值变得唯一。在最坏情况下，所有\
