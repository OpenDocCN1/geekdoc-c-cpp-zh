  \n写出你的计算过程。\n\n### 8.14\n证明从磁盘中随机选择两条轨道，它们之间的平均距离为磁盘总轨道数的三分之一。\n\n### 8.15\n假设一个文件包含按键值排序的一百万条记录。对该文件的查询返回一个包含请求键值的单个记录。文件存储在磁盘的`sectors`中，每个扇区包含`100`条记录。假设随机选择一个扇区的平均时间为`10.0\
  \ ms`。相比之下，读取当前`I/O head`位置相邻扇区仅需`2.0 ms`。处理查询的“批量”算法是首先按照查询在文件中出现的顺序对查询进行排序，然后顺序读取整个文件，在读取文件时按顺序处理所有查询。该算法意味着所有查询在开始处理之前必须可用。“交互式”算法是按照查询到达的顺序处理每个查询，每次都搜索请求的扇区（除非连续两个查询恰好指向同一个扇区）。仔细定义在什么情况下，批量方法比交互式方法更高效。\n\
