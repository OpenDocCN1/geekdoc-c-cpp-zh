  哈夫树的构建是贪心算法的一个示例。在每一步中，算法都会做出“贪心”的决策，合并权重最小的两个子树。\n\n这使得算法变得简单，但它能产生理想的结果吗？本节以一个证明结束，证明哈夫树确实为该字母集提供了最高效的排列。该证明需要以下引理。\n\
  \n**引理 5.1** 对于由函数 `buildHuff` 构建的包含至少两个字母的哈夫树，频率最低的两个字母存储在兄弟节点中，其深度至少与树中的任何其他叶子节点一样。\n\
  \n**证明：** 将两个频率最低的字母标记为 `l1` 和 `l2`。它们必须是兄弟节点，因为 `buildHuff` 在构建过程的第一步就选择了它们。\n\n\
  假设 `l1` 和 `l2` 不是树中最深的节点。在这种情况下，哈夫树必须看起来像如图 5.30 所示，要么在某种意义上与此对称。要出现这种情况，`l1` 和\
  \ `l2` 的父节点（标记为 `V`）的权重必须大于标记为 `X` 的节点。否则，函数 `buildHuff` 将选择节点 `V` 代替节点 `X` 作为节点\
  \ `U` 的孩子。然而，这是可能的，因为 `l1` 和 `l2` 是频率最低的字母。\n\n2\n190\n第 5 章 二叉树\n\n```cpp\n// 哈夫树节点抽象基类\n\
  template <typename E> class HuffNode {\npublic:\n    virtual ~HuffNode() {}\n  \
  \  // 基析构函数\n    virtual int weight() = 0;\n    // 返回频率\n    virtual bool isLeaf()\
  \ = 0;\n    // 类型\n};\n\ntemplate <typename E>\n// 叶子节点子类\nclass LeafNode : public\
