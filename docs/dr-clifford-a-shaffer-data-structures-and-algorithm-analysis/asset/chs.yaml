  \ |\n| 基数/O | 0.83 | 0.79 | 0.47 | 0.66 | | |\n\n**图 20：排序算法的实证比较**\n\n各种排序算法展示了长度为\
  \ 10、100、1000、10000、100000 和 1,000,000 列表的性能。每个表格的最后两列显示了算法在 10,000 规模下分别对应升序（排序）和降序（反序排序）的性能。这些列展示了某些算法的最优情况以及另一些算法的最坏情况。它们还表明，对于某些算法来说，输入顺序的影响很小。\n\
  \n\n\n本书包含了许多对算法的分析。这些分析通常定义了算法在最坏和平均情况下的上界和下界。对于目前介绍的许多算法，分析是容易的。本节考虑了一个更具挑战的任务——对问题的成本进行分析，而不是算法。问题的上界可以定义为已知最快算法的渐近成本。下界则定义了解决该问题的任何算法可能的最佳效率，包括尚未发明的算法。\n\
  \n一旦问题的上界和下界重合，我们就知道未来的算法就不可能（在渐近意义上）更高效了。\n\n问题下界的简单估计可以通过测量必须读取的输入大小和必须写入的输出大小来。显然，任何算法的效率不能高于问题的\
  \ I/O 时间。从这里我们可以，排序问题无法通过任何算法在少于 `\\(\\Omega(n)\\)` 的时间内解决，因为读取和写入排序所需的 `n` 个值至少需要\
  \ `n` 步。或者，任何排序算法必须至少查看每个输入值以识别输入值是否处于排序顺序。因此，根据我们目前对排序算法的了解以及输入的大小，我们知道排序问题被限制在\
  \ `\\(\\Omega(n)\\)` 和 `O(n log n)` 之间。\n\n计算机科学家花费了大量时间设计高效的通用排序算法，但还没有发现过在最坏或平均情况下比\
  \ `O(n log n)` 更快的算法。我们是否应该继续寻找更快的排序算法？或者，我们能否通过找到一个更紧的下界来证明不存在更快的排序算法？\n\n本节介绍了计算机科学中最重要且实用的证明之一：任何基于键比较的排序算法在最坏情况下都不可能比\
  \ `\\(\\Omega(n log n)\\)` 快。这个证明之所以重要，有三个原因。\n\n首先，知道广泛使用的排序算法是渐近最优的是令人安心的。特别是，这意味着你不需要像撞墙一样去寻找一个\
  \ `O(n)` 的排序算法（或者至少不是寻找任何基于键比较的算法）。其次，这个证明是我们针对任何问题所拥有的极少数非平凡下界证明之一；也就是说，这个证明提供了我们的下界比简单测量输入输出大小更紧的的较数实例之一。因此，它为证明其他问题的下界提供了一个有用的模型。最后，知道排序的下界反过来也为其他解决方案可以作为排序算法基础的问题提供了下界。从一个问题的渐近界推导出另一个问题的渐近界的过程被称为“归约”，这一概念将在第\
  \ 17 章中进一步探讨。\n\n除了 `Radix Sort` 和 `Binsort` 之外，本章介绍的所有排序算法都是基于两个键值的直接比较来做出决策的。\n\
  \n例如，`Insertion Sort` 顺序比较要插入排序列表的值，直到与列表中的下一个值比较失败。相比之下，`Radix Sort` 没有对键值的直接比较。所有决策都基于键值中特定数字的值，因此可能采取不涉及键比较的排序方法。显而易见的是，`Radix\
  \ Sort` 最终并没有提供比基于比较的排序更高效的排序算法。因此，经验证据表明，基于比较的排序是一个很好的方法。\n\n证明任何比较排序在最坏情况下都需要\
  \ `\\(\\Omega(n log n)\\)` 次比较的证明结构如下。首先，基于比较的决策可以建模为树中的分支。这意味着任何基于记录之间比较的排序算法都可以被视为一棵二叉树，其节点对应比较，其分支对应可能的结果。接下来，证明生成的树的最少叶子节点数是\
  \ `n` 的阶乘。最后，证明具有 `n!` 个叶子节点的树的最小深度为 `\\(\\Omega(n log n)\\)`。\n\n在给出排序的 `\\(\\\
  Omega(n log n)\\)` 下界证明之前，我们必须定义决策树的概念。决策树是一种可以对任何做出二元决策的算法进行建模的二叉树。每个（二元）决策由树中的分支表示。为了对排序算法建模，我们将所有键值的比较视为决策。如果对两个键进行比较，且第一个小于第二个，则将其建模为树中的左分支。在第一个值大于第二个值的情况下，算法采取右分支。\n\
  \n**图 7.21** `Insertion Sort` 处理三个标记为 `X`、`Y` 和 `Z` 的值时的决策树，这些值最初分别存储在输入数组 `A` 的位置\
  \ 0、1 和 2 中。\n\n当 `n = 3` 时，`Insertion Sort` 进行的第一次比较位于输入数组中的第二个项（`Y`）和数组中的第一项（`X`）之间。有两种可能：`Y`\
  \ 的值小于 `X`，或者 `Y` 的值不小于 `X`。这个决策由树中的第一个分支建模。如果 `Y` 小于 `X`，则应该采取左分支，且 `Y` 在最终输出中必须出现在\
  \ `X` 之前。原始的六种排列中只有三种具有这种属性，因此根的左节点列出了 `Y` 出现在 `X` 之前的三个排列：`YXZ`、`YZX` 和 `ZYX`。同样，如果\
  \ `Y` 不小于 `X`，则将采取右分支，只有三种 `Y` 出现在 `X` 之后的排列是可能的结果：`XYZ`、`XZY` 和 `ZXY`。\n\n让我们假设\
  \ `Y` 小于 `X`，因此采取了左分支。在这种情况下，`Insertion Sort` 交换这两个值。此时数组 `A` 存储为 `YXZ`。因此，在图 7.21\
  \ 中，根的左节点在横线上显示 `YXZ`。接下来，将数组中的第三个值与第二个值进行比较（即 `Z` 与 `X` 比较）。再次，有两种可能。如果 `Z` 小于\
  \ `X`，则应该交换这些项（左分支）。如果 `Z` 不小于 `X`，则 `Insertion Sort` 完成（右分支）。\n\n\n\n请注意，右分支到达了一个叶子节点，且该叶子节点仅包含一种排列：`YXZ`。这意味着根据到达该节点的决策结果，只有排列\
  \ `YXZ` 可能是结果。换句话说，`Insertion Sort`（插入排序）已经“找到”了原始输入中能够产生排序列表的唯一排列。同样，如果第二个决策导致进入左侧分支，那么无论第三次比较的结果如何，都会在决策树中产生只包含单一排列的节点。再次，`Insertion\
  \ Sort` “找到”了能够产生排序列表的正确排列。\n\n任何基于比较的排序算法都可以用这种决策树的方式进行建模，无论输入的大小有多大。因此，所有排序算法都可以被视为“寻找”输入中产生排序列表的正确排列的算法。每个基于比较的算法都可以被视为通过根据键比较的结果在树中划分分支来进行，且一旦到达具有单一排列的节点，每个算法就可以终止。\n\
  \n算法的最坏情况代价是如何通过决策树表示的？决策树显示了算法针对给定大小的所有可能输入所做的决策。从根到叶的树中每条路径都是算法所采取的一系列可能的决策。最深节点的深度代表了算法得出答案所需的性决策序列。\n\
  \n有许多基于比较的排序算法，每种算法将由不同的决策树建模。某些决策树可能是良好平衡的，另一些可能不平衡。某些树的节点比其他树多（节点较多的可能进行了“不必要”的比较）。事实上，一个糟糕的排序算法在其决策树中可能有任意数量的节点，且叶子的深度可以是任意的。“最坏”的排序算法的速度是没有限制的。然而，我们在这里感兴趣的是最好的排序算法在最坏情况下的最小代价可能是什么。换句话说，我们想知道对于任何排序算法，树中最深节点可能具有的最小深度是多少。\n\
  \n最深节点的最小深度取决于树中的节点数量。显然，我们想“向上推”树中的节点，但顶部空间有限。高度为 1 的树只能存储一个节点（根节点）；高度为 2 的树可以存储三个节点；高度为\
  \ 3 的树可以存储七个节点，以此此类推。\n\n是一些值得记住的重要事实：\n\n- 高为 `n` 的二叉树最多可以存储 $2^n - 1$ 个节点。\n-\
  \ 等价地，具有 `n` 个节点的树至少需要 $\\log_2(n + 1)$ 层。\n\n### 7.10 扩展阅读\n\n对于 `n` 个值的任何基于比较的排序算法，决策树中必须包含的最少节点数？因为排序算法的任务是确定输入的哪种唯一排列对应排序列表，因此任何排序算法的决策树必须为每种可能的排列至少包含一个叶子节点。一个\
  \ `n` 个数字集合有 $n!$ 种排列（见第 2.2 节）。\n\n由于树中至少有 $n!$ 个节点，我们知道树必须有 $\\Omega(\\log n!)$\
  \ 层。根据斯特林近似公式（第 2.2 节），我们知道 $\\log n!$ 是 $\\Omega(n \\log n)$。任何基于比较的排序算法的决策树深度必须为\
  \ $\\Omega(n \\log n)$。因此，在最坏情况下，任何此类排序算法都需要 $\\Omega(n \\log n)$ 次比较。\n\n任何在最坏情况下需要\
  \ $\\Omega(n \\log n)$ 次比较的排序算法，在最坏情况下都需要 $\\Omega(n \\log n)$ 的运行时间。因为任何排序算法都需要\
  \ $\\Omega(n \\log n)$ 的运行时间，排序问题也需要 $\\Omega(n \\log n)$ 的时间。我们已经知道运行时间为 $O(n \\\
  log n)$ 的排序算法，所以我们可以得出结论排序问题需要 $\\Theta(n \\log n)$ 的时间。作为一个推论，我们知道没有基于比较的排序算法可以比现有的\
  \ $\\Theta(n \\log n)$ 时间排序算法改进一个常数倍。\n\n排序方面的权威参考是 Donald E. Knuth 的《Sorting and\
  \ Searching》 [Knu98]。那里涵盖了大量的细节，包括小规模 `n` 的最优排序和特殊用途排序网络。这是对排序的详尽（尽管有些过时）的描述。关于\
  \ `Quicksort` 的分析及其优化的详尽调查，请参见 Robert Sedgewick 的 `Quicksort` [Sed80]。Sedgewick\
  \ 的《Algorithms》 [Sed11] 讨论了这里描述的大多数排序算法，并特别关注高效的实现。第 7.4 节中优化的 `Mergesort` 版本来自\
  \ Sedgewick。\n\n虽然 $\\Omega(n \\log n)$ 是排序最坏情况下的理论下限，但很多时候输入是足够有序的，某些算法可以利用这一事实来加速排序过程。一个简单的例子是\
  \ `Insertion Sort` 的最好情况运行时间。运行时间基于输入无序程度的排序算法被称为自适应算法。关于自适应排序算法的更多信息，请参见 Estivill-Castro\
  \ 和 Wood 的“A Survey of Adaptive Sorting Algorithms” [ECW92]。\n\n### 7.11 练习\n\n\
  7.1 使用归纳法证明 `Insertion Sort` 始终产生一个排序数组。\n\n7.2 为整数键值编写一个 `Insertion Sort` 算法。但是，陷阱在于：输入是一个栈（而不是数组），你的算法可以使用的变量只有固定数量的整数。该算法应该返回一个包含有序记录的栈（最小值在栈顶）。你的算法在最坏情况下应该是\
  \ $\\Theta(n²)$ 的。\n\n7.3 `Bubble Sort` 实现具有以下内部 `for` 循环：\n```c\nfor (int j=n-1;\
  \ j>i; j--)\n```\n考虑替换为以下语句的影响：\n```c\nfor (int j=n-1; j>0; j--)\n```\n新实现能够正确工作吗？这种改变会影响算法的渐进复杂度吗？这种改变会影响算法的运行时间吗？\n\
