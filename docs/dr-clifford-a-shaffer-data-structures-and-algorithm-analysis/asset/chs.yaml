  \ comparator for two\n// elements.\ntemplate <typename E>\nclass HuffTree {\nprivate:\n\
  \    HuffNode<E>* Root; // 树根\npublic:\n    // 叶子构造函数\n    HuffTree(E& val, int\
  \ freq)\n    { Root = new LeafNode<E>(val, freq); }\n    // 内部节点构造函数\n    HuffTree(HuffNode<E>*\
  \ l, HuffNode<E>* r)\n    { Root = new IntlNode<E>(l, r); }\n    // 析构函数\n    ~HuffTree()\
  \ {}\n    // 获取根\n    HuffNode<E>* root() { return Root; }\n    // 权重\n    int weight()\
  \ { return Root->weight(); }\n};\n```\n**图 5.28** 树类声明。\n\n```cpp\n// 从频率集合构建哈夫树\n\
  template <typename E>\nHuffTree<E>* buildHuff(HuffTree<E>* TreeArray, int count)\
  \ {\n    heap<HuffTree<E>*, minComp>* forest = new heap<HuffTree<E>*, minComp>(TreeArray,\
  \ count);\n    HuffTree<E>* *temp1, *temp2, *temp3 = NULL;\n    while (forest->size()\
  \ > 1) {\n        temp1 = forest->removefirst(); // 取前两个\n        temp2 = forest->removefirst();\
  \ // 从列表中\n        temp3 = new HuffTree<E>(temp1, temp2); // 将新树放回\n        forest->insert(temp3);\n\
  \        delete temp1; // 必须删除\n        delete temp2; // 我们创建的树\n    }\n    return\
  \ temp3;\n}\n```\n**图 5.29** 哈夫树构建函数的实现。\n\n192\n第 5 章 二叉树\n\nV\nU\nl1\nX\nl2\n\
  **图 5.30** 一个不可能的哈夫树，显示了权重最小的两个节点 l1 和 l2 不是树中最深节点的情况。三角形表示子树。\n\n**定理 5.3** 函数\
  \ `buildHuff` 构建了给定字母集具有最小外部路径权的哈夫树。\n\n**证明：** 该证明对字母数量 $n$ 使用归纳法证明。\n\n- 基础情况：对于\
  \ $n = 2$，哈夫树必须具有最小外部路径权，因为只有两种可能的树，每个树的加权路径长度都是相同的。\n- 归纳假设：假设由 `buildHuff` 创建的包含\
  \ $n-1$ 个叶子节点的树具有最小外部路径权。\n- 归纳步骤：给定一个由 `buildHuff` 构建的具有 $n$ 个叶子的哈夫树 $T$，$n \\\
  ge 2$，假设 $w_1 \\le w_2 \\le \\dots \\le w_n$，其中 $w_1$ 到 $w_n$ 是字母的权重。调用 $V$ 为频率为\
  \ $w_1$ 和 $w_2$ 的字母的父节点\n\n\n\n\n以及 `w2`。根据引理，我们知道包含频率 `w1` 和 `w2` 字母的叶子节点与 `T`\
  \ 中的任何节点一样深。如果树中的任何其他叶节点更深，我们就可以通过将其与 `w1` 或 `w2` 交换来减小它们的权路径长度。但引理告诉我们不存在这样的更深节点。令\
  \ `T0` 为哈夫曼树，它与 `T` 相同，但节点 `V` 被替换为叶子节点 `V 0`，其权重为 `w1 + w2`。根据归纳假设，`T0` 具有最小外部路径长度。将子节点返回到\
  \ `V0` 即可恢复树 `T`，它也必然具有最小外部路径长度。\n\n因此，通过数学归纳法，函数 `buildHuff` 创建了具有最小外部路径长度的哈夫曼树。\n\
  \n### 5.6.2 分配和使用哈夫曼编码\n\n一旦构建哈夫曼树，为单个字母分配代码就是很容易的事。从根开始，我们为树中的每条边分配‘0’或‘1’。‘0’分配给连接节点与其左子节点的边，‘1’分配给连接节点与其右子节点的边。这一过程在第\
  \ 5.6 节哈夫曼编码树中有所说明。\n\n| 字母 | 频率 | 代码 | 位数 |\n| :--- | :--- | :--- | :--- |\n| C\
  \ | 32 | 1110 | 4 |\n| D | 42 | 101 | 3 |\n| E | 120 | 0 | 1 |\n| K | 7 | 111101\
  \ | 6 |\n| L | 42 | 110 | 3 |\n| M | 24 | 11111 | 5 |\n| U | 37 | 100 | 3 |\n| Z\
  \ | 2 | 111100 | 6 |\n\n**图 5.31** 图 5.24 中字母的哈夫曼编码。\n\n字母的哈夫曼编码简单是由从根到该字母对应的叶子节点的路径确定的二进制数。因此，`E`\
  \ 的代码是‘0’，因为从根到 `E` 叶子节点的路径只经过了一个左分支。`K` 的代码是‘111101’，因为通往 `K` 节点的路径经过了四个右分支，然后是一个左分支，最后是最后一个右分支。图\
  \ 5.31 列出了所有八个字母的代码。\n\n给定字母的代码，使用这些代码来编码文本消息是非常简单的问题。我们只需将字符串中的每个字母替换为其二进制代码即可。可以使用查找表来实现此目的。\n\
  \n**示例 5.9** 使用我们示例哈夫曼树生成的代码，单词“DEED”被表示为位字符串“10100101”，单词“MUCK”被表示为位字符串“111111001110111101”。\n\
  \n解码消息是从左到右查看编码字符串中的位来完成的，直到解码出一个字母。这可以通过以与生成代码的过程相反的反向过程使用哈夫曼树来完成。解码位字符串从树的根开始。我们根据位值选择分支——‘0’向左，‘1’向右——直到到达叶子节点。该叶节点包含消息中的第一个字符。然后我们处理代码中的下一个位，重新从根开始处理下一个字符。\n\
  \n**示例 5.10** 为了解码位字符串“1011001110111101”，我们从树的根开始，对第一位‘1’走一个右分支。因为下一位是‘0’，我们走一个左分支。然后我们再走一个右分支（对应第三位‘1’），到达与字母\
  \ `D` 对应的叶子节点。因此，编码单词的第一个字母是 `D`。然后我们再次从树的根开始处理第四位，该位是‘1’。走右分支，然后走两个左分支（对应接下来的两个位‘0’），我们到达与字母\
  \ `U` 对应的叶子节点。因此，第二个字母是 `U`。类似地，我们完成解码过程，发现最后两个字母是 `C` 和 `K`，拼成单词“DUCK”。\n\n如果一组代码被认为满足前缀属性，则该集合中没有代码是另一个代码的前缀。前缀属性保证了位字符串在解码时不会产生歧义。换句话说，一旦我们在解码过程中到达代码的最后一位，我们就知道它是哪个字母的代码。哈夫曼编码确实具有前缀属性，因为任何代码的前缀都会对应于一个内部节点，而所有代码都对应于叶子节点。例如，`M`\
  \ 的代码是‘11111’。在图 5.26 的哈夫曼树中走五个右分支将我们带到包含 `M` 的叶子节点。我们可以确定没有字母的代码可以是‘111’，因为这对应于树的内部节点，而树的构建过程只将字母放置在叶子节点。\n\
  \n哈夫曼编码的效率如何？在理论上，只要已知真实频率且字母的频率与其在消息中的上下文无关，它就是最优编码方法。在实践中，英语文本文档中的字母频率确实会随着上下文而改变。例如，虽然\
  \ `E` 是英语文档中最常用的字母，但 `T` 作为单词的首字母更为常见。这就是为什么大多数商业压缩工具不使用哈夫曼编码作为主要的编码方法，而是使用利用利用字母上下文的技术。\n\
  \n另一个影响哈夫曼编码压缩效率的因素是字母的相对频率。某些频率模式与等长代码相比无法节省空间；而另一些可以产生巨大的压缩效果。通常，当频率变化很大时，哈夫曼编码的效果更好。\n\
  \n**示例 5.11** 因为图 5.31 中的频率之和为 306，如果实际频率符合这一预期，我们可以确定从哈夫曼编码的预期节省。`E` 的频率为 120，我们预计它在消息中出现\
  \ 120 次。`D`、`L` 和 `U` 的代码长度为三，预计合共在 306 个字母中出现 121 次。`C` 的代码长度为四，预计在 306 个字母中出现\
  \ 32 次。`M` 的代码长度为五，预计在 306 个字母中出现 24 次。最后，`K` 和 `Z` 的代码长度为六，预计合共在 306 个字母中仅出现 9\
  \ 次。\n\n\n\n\n在在上述示例中，“DEED”被编码为 8 位，比定等长度编码所需的 12 位节省了 33%。然而，“MUCK”需要 18 位，比相应的定等长度编码所需的空间更多。问题在于，“MUCK”是由预计不会频繁出现的字母组成的。如果消息的内容与字母的预期频率不符，那么编码的长度也将无法符合预期。\n\
  \n### 5.6.3 在霍夫曼树中搜索\n\n当我们使用 `Huffman` 编码树解码字符时，我们遵循由代码字符串中的位决定的路径在树中移动。每个`’0’`位表示左分支，而每个`’1’`位表示右分支。现在看图\
  \ 5.26，并从搜索给定字母（其键值为其 `Huffman` 编码）的角度考虑该结构。我们看到，所有以`’0’`开头的字母都存储在左分支中，而所有以`’1’`开头的字母都存储在右分支中。将其与在\
  \ `BST` 中存储记录进行对比。在那里，所有键值小于根值的记录存储在左分支中，而所有键值大于根值的记录存储在右分支中。\n\n第 5 章 二叉树\n\n如果我们将存储在这两种结构中的所有记录视为出现在代表键空间的数轴上的某一点，我们可以看到这两种结构的分裂行为非常不同。`BST`\
  \ 根据在向下遍历时遇到的键值来划分空间。但 `Huffman` 树的键空间划分是预先确定的。键空间划分点预先确定的搜索树结构有一个特殊名称 `trie`（字典树），以区分于划分点由数据决定的搜索树类型（如\
  \ `BST`）。`Tries` 将在 13 章中进行详细讨论。\n\n## 5.7 扩展阅读\n\n参见 Shaffer 和 Brown 的 `[SB93]`，这是一个树实现的示例，在该实现中，内部节点指针字段在子节点为叶子节点时存储子节点的值而非子节点的指针。\n\
  \n面对不友好的插入和删除操作序列，有许多技术可以维持相当平衡的 `BST`。一个例子是 Adelson-Velskii 和 Landis 的 `AVL` 树，Knuth\
  \ `[Knu98]`讨论过它。`AVL` 树（见第 13.2 节）实际上是一个 `BST`，其插入和删除程序会重组树结构，以保证任何节点的子节点根的子树高度差最多一。另一个例子是\
  \ `splay` 树 `[ST85]`，在第 13.2 节中也有讨论。\n\n参见 Bentley 的编程之珠“Thanks, Heaps” `[Ben85,\
  \ Ben88]`，是对堆数据结构及其用途很好的讨论。\n\n第 5.6.1 节关于 `Huffman` 编码树具有最小外部路径权重的证明来自 Knuth `[Knu97]`。关于数据压缩技术的更多信息，请参见\
  \ Witten, Moffat 和 Bell 的《Managing Gigabytes》`[WMB99]`，以及 Dominic Welsh 的《Codes\
  \ and Cryptography》`[Wel88]`。表 5.23 和 5.24 源自 Welsh `[Wel88]`。\n\n## 5.8 练习\n\n\
