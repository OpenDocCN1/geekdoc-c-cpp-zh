  \ | $0$ / $\\Theta(n)$ / $\\Theta(n)$ |\n\n### 第 7.3 节 希排序\n\n我们考虑的下一种排序算法称为希排序，以其发明者\
  \ D.L. Shell 命名。它有时也被递减增量排序。与插入排序和选择排序不同，希排序没有现实生活的对应物。与交换排序不同，希排序在非相邻元素之间进行比较和交换。希排序还利用了插入排序的最佳情况性能。希排序的策略是让列表“大部分有序”，以便最后的插入排序能够完成工作。当实现正确时，希排序在最坏情况下会远优于\
  \ $\\Theta(n²)$。\n\n希排序使用的过程是许多后续排序的基础：将列表分成子列表，对其进行排序，然后合并子列表。希排序将元素数组分成“虚拟”子列表。每个子列表使用插入排序进行排序。然后选择并排序另一组子列表，依此类推。\n\
  \n在每次迭代中，希排序将列表分成互不相交的子列表，使得子列表中的每个元素间隔固定数量的位置。例如，为了方便起见，假设要排序的数值 $n$ 是 2 的幂。\n\n\
  一种可能的希排序实现将从将列表分成 $n/2$ 开始。\n\n\n\n\n20, 36, 41, 42, 70, 59, 83, 65, 98, 11, 13,\
  \ 14, 15, 17, 20, 23, 28, 36, 41, 42, 59, 65, 70, 83, 98。\n\n**图 7.6** 壳排序（Shellsort）的示例。16\
  \ 个元素通过四轮排序完成。\n\n第一轮排序 8 个大小为 2 的子列表，增量为 8。第二轮排序 4 个大小为 4 的子列表，增量为 4。第三轮排序 2 个大小为\
  \ 8 的子列表，增量为 2。第四轮排序 1 个大小为 16 的列表，增量为 1（即普通的插入排序）。\n\n每个子列表包含 2 个元素，其中每个子列表中 2\
  \ 个元素的数组索引相差 `n/2`。如果数组中有从 0 到 15 索引的 16 个元素，初始会有 8 个每个包含 2 个元素的子列表。第一个子列表是位置 0\
  \ 和 8 处的元素，第二个子列表是位置 1 和 9 处的元素，依此类推。每个包含两个元素的列表都使用插入排序进行排序。\n\n壳排序的第二轮查看更少、更大的列表。对于我们的示例，第二轮将有\
