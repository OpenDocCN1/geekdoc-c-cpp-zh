  ```\n\n\n\n\n# 第 12.3 节讨论了通用内存管理器的实现方式。\n\n开销源于自由存储（free-store）程序必须能够处理与自由存储之间没有特定模式的请求，以及处理大小完全不同的内存请求。这使得它们与针对受控内存访问模式所可能实现的方案相比，效率较低。\n\
  \n在链表实现中，列表节点的创建和删除方式允许 `Link` 类的程序员提供简单但高效的内存管理程序。`Link` 类不需要重复地调用 `new` 和 `delete`，而是可以处理自己的空闲列表（freelist）。空闲列表持有那些当前未被使用的列表节点。当一个节点从链表中删除时，它会被放置在空闲列表的头部。当需要向链表添加新元素时，会检查空闲列表是否有可用的列表节点。如果有，则从空闲列表中取出该节点。\n\
  \n如果空闲列表为空，则必须调用标准的 `new` 操作符。\n\n空闲列表对于周期性增长后收缩的链表特别有用。空闲列表的大小永远不会超过链表达到过的最大尺寸。在列表收缩后，对新节点的请求可以由空闲列表处理。另一个使用空闲列表的良好机会发生在程序使用多个列表时。只要这些列表不是同时同时增长和收缩，空闲列表就可以让节点在不同列表之间移动。\n\
  \n实现空闲列表的一种方法是创建两个新的操作符来代替标准的自由存储程序 `new` 和 `delete`。这需要修改用户的代码（例如图 4.8 中的链表类实现），以调用这些空闲列表操作符。另一种方法是使用\
  \ C++ 算符重载，在操作 `Link` 类对象时替换 `new` 和 `delete` 的含义。通过这样，使用 `LList` 类的程序无需任何修改即可利用空闲列表。`Link`\
  \ 类是用空闲列表实现的，还是依赖于常规的自由存储机制，对列表类用户来说是完全透明的。\n\n图 4.11 显示了 `Link` 类的重新实现，其通过空闲列表方法重载了标准的自由存储操作符。注意它们是多么简单，因为它们只需要分别向空闲列表的头部移除和添加元素即可。空闲列表版本的\
  \ `new` 和 `delete` 运行时间均为 Θ(1)，除非空闲列表耗尽且必须调用 `new` 操作的情况。在我的电脑上，调用重载的 `new` 和 `delete`\
  \ 操作符所需的时间大约是系统自由存储操作符所需的十分之一。\n\n空闲列表实现还可以获得额外的效率提升。图 4.11 的实现在空闲列表为空时，会为请求的每个链表节点单独调用一次系统\
  \ `new` 操作符。这些链表节点通常很小——只比 `element` 字段的大小多出几个字节。如果程序在某个时刻需要数千个活跃的链表节点，那么这些节点将通过多次调用系统版本的\
  \ `new` 来创建。另一种方法是在单次调用系统版本的 `new` 时分配许多链表节点，预判到如果现在空闲列表耗尽了，很快将需要更多节点。调用一次 `new`\
  \ 获取 100 个 `link` 节点的空间，然后一次性将所有 100 个节点加载到空闲列表中，比分别调用 100 次 `new` 要快。以下语句将 `ptr`\
  \ 赋值为指向一个包含 100 个节点的数组。\n\n```cpp\nptr = ::new Link[100];\n```\n\n// 支持空闲列表的单链表节点\n\
  template <typename E> class Link {\nprivate:\n    static Link<E>* freelist; // 指向空闲列表头的引用\n\
  public:\n    E element; // 此节点的值\n    Link* next; // 指向链表中下一个节点\n    // 构造函数\n \
  \   Link(const E& elemval, Link* nextval =NULL) {\n        element = elemval;\n\
  \        next = nextval;\n    }\n    Link(Link* nextval =NULL) { next = nextval;\
  \ }\n    void* operator new(size_t) {\n        // 重载的 new 操作符\n        if (freelist\
  \ == NULL) return ::new Link; // 创建空间\n        Link<E>* temp = freelist; // 从空闲列表中取出\n\
  \        freelist = freelist->next;\n        return temp; // 返回节点\n    }\n    //\
  \ 重载的 delete 操作符\n    void operator delete(void* ptr) {\n        ((Link<E>*)ptr)->next\
  \ = freelist; // 放入空闲列表\n        freelist = (Link<E>*)ptr;\n    }\n};\n// 空闲列表头指针在此实际创建\n\
  template <typename E>\nLink<E>* Link<E>::freelist = NULL;\n```\n\n图 4.11 带有空闲列表的\
  \ `Link` 类实现。注意 `new` 的重定义在第三行引用 `::new`。这表示使用了标准的 C++ `new` 操作符，而不是重载后的 `new` 操作符。如果没有使用冒号，就会调用\
  \ `Link` 类的 `new` 操作符，导致无限递归。成员 `freelist` 的 `static` 意味着所有 `Link` 类对象共享同一个空闲列表指针变量，而不是每个对象都存储自己的副本。\n\
  \n随后，`link` 类中的 `new` 操作符可以将这 100 个节点中的每一个都放入空闲列表。\n\n## 4.1 列表\n\n## 4.1.2 列表、栈和队列\n\
  \n`freelist` 变量声明使用了 `static` 关键字。这创建了一个所有 `Link` 实例共享的变量。我们希望为给定类型的 `Link` 只有一个空闲列表。程序可能会创建多个列表。只要它们具有相同类型（即它们的元素类型相同），它们就可以并应该共享同一个空闲列表。这将在\
  \ 4.11 的实现中发生。如果创建的列表具有类型，由于此代码是用模板实现的，编译器将在编译时发现不同列表实现的需求。为每个元素类型生成独立的列表版本。因此，每个元素类型将获得\
  \ `Link` 类的副本。每个不同的 `Link` 类实现将获得一个空闲列表。\n\n## 4.1.3 列表实现的比较\n\n现在你已经看到了两种不同的列表实现，问哪种更好是自然的。特别是，如果你必须为某个任务实现列表，你应该选择哪种实现？\n\
  \n数组列表的缺点是它们在分配数组之前必须预先大小。当列表只包含少数元素时，大量的空间可能会浪费在一个很大空空的数组上。链表的优点是它们只需要实际列表上元素的空间。只要有自由存储内存可用，链表的元素数量就没有限制。链表所需的空间是\
  \ Θ(n)，而数组列表实现所需的空间是 Ω(n)，但可能更大。\n\n数组列表的优点是单个元素没有浪费空间。链表要求每个列表节点都添加一个额外的指针。如果元素的大小很小，那么链接的开销可能会占总存储的很大比例。当数组列表的数组完全填满时，没有存储开销。此时，它将比链表实现在空间上高效（常数倍）。\n\
  \n可以使用一个简单的公式来确定在特定情况下，数组列表或链表实现哪种在空间上更有效。\n\n\n\n\n令 `n` 为列表中当前有的元素个数，`P` 为指针在存储单元中的大小（通常为\
  \ 4 个字节），`E` 为数据元素在存储单元中的大小（这可以是任何值，从 `Boolean` 变量的 1 位到复杂记录的数千字节或更多），而 `D` 为数组可以存储的列表元素最大数量。基于数组的列表所需的空间为\
  \ `DE`，无论列表中任何给定时刻实际存储了多少元素。链表列表所需的空间为 `n(P + E)`。对于给定的值 `n`，这两个表达式中较小的一个决定了对于 `n`\
  \ 个元素空间效率更高的实现方式。通常情况下，当列表中元素较少时，链表实现所需的空间小于基于数组的实现。\n\n相反，当数组接近满时，基于数组的实现空间效率更高。通过该方程，我们可以求解出\
  \ `n`，以确定在任何特定情况下基于数组的实现空间效率更高的盈平衡点。这发生在 `n > DE/(P + E)` 时。\n\n如果 `P = E`，则平衡点在\
  \ `D/2`。如果元素字段是四字节的 `int` 值或指针，且下一个字段是典型的四字节指针，就会发生这种情况。也就是说，只要数组填充率超过一半（如果链接字段和元素字段大小相同时），基于数组的实现就会更高效。\n\
  \n根据经验法则，在实现元素数量变化很大或未知的列表时，链表的空间效率更高。当用户预先大致知道列表将变得多大时，基于数组的列表通常空间效率更高。\n\n## 第\
  \ 4.1 节列表\n\n基于数组的列表按位置随机访问的速度更快。可以通过 `next` 和 `prev` 方法轻松地向前或后调整位置。这些操作始终花费 `Θ(1)`\
  \ 时间。相比之下，单链表没有显式访问前一个元素的方法，按位置访问需要我们从列表开头（或当前位置）沿列表移动到指定位置。如果我们假设列表上的每个位置在任何调用\
  \ `prev` 或 `moveToPos` 时被访问的概率相等，那么这两种操作在平均和最坏情况下都需要 `Θ(n)` 时间。\n\n在给定指向列表合适位置的指针的情况下，链表的\
  \ `insert` 和 `remove` 方法只需要 `Θ(1)` 时间。基于数组的列表必须在数组内向上或向下移动剩余的列表。这在平均和最坏情况下需要 `Θ(n)`\
  \ 时间。对于许多应用来说，插入和删除元素的时间占据了所有其他操作。因此，链表通常优于基于数组的列表。\n\n在实现基于数组的列表时，实现者可以让数组的大小根据实际存储的元素数量而增长和缩小。这种数据结构被称为动态数组。`Java`\
  \ 和 `C++/STL` `Vector` 类都实现了动态数组。动态数组允许程序员绕过标准数组的局限性，即数组一旦创建其大小就无法更改。这意味着在在使用动态数组之前，不需要为它分配空间。这种方法的缺点是处理数组上的空间调整需要时间。每当数组尺寸变大时，其内容都必须被复制。良好的动态数组实现会以某种方式增长和缩小数组，以使一系列插入/删除操作的成本保持相对低廉，尽管偶尔的插入/删除操作可能是昂贵的的。一个简单的经验法则是：当数组满时将其大小翻倍，当其填充到只有四分之一时将其大小减半。为了分析动态数组操作随时间的总成本，我们需要使用一种名为摊还分析（amortized\
  \ analysis）的技术，这将在第 14.3 节中讨论。\n\n### 第 4.1.4 元素实现\n\n列表用户必须决定是否希望在每个包含该元素的列表上存储该元素的副本。对于像整数这样较小的元素，这样做是有意义的。\n\
  \n如果元素是工资记录，列表节点存储指向记录的指针可能存储记录本身的副本可能更为理想的。这种更改允许多个列表节点（或其他数据结构）指向同一条记录，而不是重复地复制记录。这不仅可以节省空间，而且意味着元素值的修改将自动反映在引用它的所有位置。存储每个元素指针的缺点是指针本身也需要空间。如果元素从不被复制，那么这些额外空间就会增加不必要的开销。\n\
  \n本节介绍的 `C++` 列表实现为用户提供了存储元素副本或指向元素指针的选择。用户可以将 `E` 声明为（例如指向工资记录的指针。在这种情况下，多个列表可以指向记录的同一个副本。另一方面，如果用户声明\
  \ `E` 即为记录本身，那么当它被插入列表时，将创建一个记录的新副本。\n\n使用共享元素的指针还是单独的副本更有优势，取决于预期的应用。通常，元素越大且复制得越频繁，使用共享元素的指针就越可能是更好的方法。\n\
  \n列表类实现者（或任何存储用户定义数据元素集合的数据结构）面临的第二个问题是，存储的元素是否都要求为相同类型。这在数据结构中被称为同性（homogeneity）。在某些应用中，用户希望定义存储在给定列表上的元素类，然后永远不允许将不同类的对象存储在同一个列表中。在其他应用中，用户希望允许存储在单个列表上的对象具有不同类型。\n\
  \n对于本节介绍的列表实现，编译器要求列表上的所有对象都是相同类型。事实上，由于列表是使用模板实现的，编译器为每种数据类型创建一个新类。对于希望尽量减少编译器创建类数量的实现者来说，列表可以都存储\
  \ `void*` 指针，由用户在每个元素与实际对象类型之间进行必要的转换。然而，这种方法需要用户进行类型检查，要么为了强制同质性，要么为了区分不同的对象类型。\n\
  \n\n\n\n列表实现的用户必须面对的第三个问题，在不支持自动垃圾回收的语言中进行编程时主要是需要关注的。也就是说，当列表被删除或调用 `clear` 方法时，如何处理存储在列表中的对象的内存。列表析构函数和\
  \ `clear` 方法存在的问题在于，它们有被误用的可能，从而导致内存泄漏。所存储的元素类型决定了此处是否存在问题隐患。如果元素是如 `int` 之类的简单类型，则不需要显式删除元素。如果元素是用户定义的类，则会调用它们自身的析构函数。然而，如果列表元素是指向对象的指针呢？那么在基于数组的实现中删除\
  \ `listArray`，或者在链表实现中删除链接节点，可能会移除指向某个对象的唯一引用，导致其内存空间无法访问。\n\n遗憾的是，列表实现无法得知给定对象是否正被程序的其他部分引用。因此，列表用户必须在适宜的时候负责删除这些对象。\n\
  \n### 4.1.5 双向链表\n\n第 4.1.2 节介绍的单向链表仅允许从列表节点直接访问列表中的下一个节点。双向链表则允许从列表节点方便地访问下一个节点，也可以访问列表的前一个节点。\n\
  \n双向链表节点通过存储两个指针以直观的方式实现了这一点：一个指向其后继节点（类似于单向链表），第二个指针指向其前驱节点。使用双向链表最常见的原因是它比单向链表更容易实现。虽然双向实现的代码比单向版本稍长一点，但它的意图往往更为“直观”，因此更易于实现和调试。图\
  \ 4.12 展示了双向链表的概念。列表实现是双向链还是单向链，应该对 `List` 类的用户隐藏。\n\n和我们的单向链表实现一样，双向链表实现也利用了头节点（header\
  \ node）。我们还在列表末尾添加了一个尾节点（tailer node）。\n\n尾节点与头节点相似，它们都是一个不包含任何值的节点，且始终存在。当初始化双向链表时，会创建头节点和尾节点。数据成员\
  \ `head` 指向头节点，`tail` 指向尾节点。这些节点的目的是通过消除列表为空或在列表头部或尾部插入时对特殊情况代码的需求，来简化 `insert`、`append`\
  \ 和 `remove` 方法。\n\n对于单向链表，我们将 `curr` 指向包含实际当前元素的前一个节点，因为在插入和删除期间无法访问前一个节点。由于在双向链表中我们可以访问前一个节点，因此这不再是必要的。我们可以让\
  \ `curr` 直接指向包含当前元素的节点。然而，为了一致性起，我选择保持与设置单向链表时相同的 `curr` 指针惯例。\n\n图 4.13 显示了用于双向链表的\
  \ `Link` 类的完整实现。这段代码比单向链表节点的实现要长一点，因为双向链表节点多了一个数据成员。\n\n图 4.14 显示了双向链表 `insert`、`append`、`remove`\
  \ 和 `prev` 方法的实现。双向链表类的声明以及其余成员函数与单向链表版本几乎相同。\n\n对于我们的双向链表实现，`insert` 方法特别简单，因为大部分工作都是由节点的构造函数完成的。图\
  \ 4.15 展示了在插入值为 10 的节点前后的列表状态。\n\n`new` 操作符的三个参数允许列表节点类构造函数分别为新链接节点设置 `element`、`prev`\
  \ 和 `next` 字段。`new` 操作符返回指向新创建节点的指针。两侧节点的指针都会更新，以指向这个新创建的节点。头节点和尾节点的存在意味着在向空列表插入时，不需要担心特殊情况。\n\
  \n`append` 方法同样简单。同样，在执行 `new` 操作符时，`Link` 类构造函数会设置节点的 `element`、`prev` 和 `next`\
  \ 字段。\n\n`remove` 方法（如图 4.16 所示）非常直观，尽管代码稍长一些。首先，将变量 `it` 赋值为要删除的值。注意，我们必须将返回给调用者的元素与链接对象分离。接下来的几行调整列表。\n\
  \n```cpp\n// 支持空闲列表的双向链表链接节点\ntemplate <typename E> class Link {\nprivate:\n   \
  \ static Link<E>* freelist; // 指向空闲列表头的引用\npublic:\n    E element;\n    // 此节点的值\n\
  \    Link* next;\n    // 指向列表中下一个节点的指针\n    Link* prev;\n    // 指向前一个节点的指针\n   \
  \ // 构造函数\n    Link(const E& it, Link* prevp, Link* nextp) {\n        element =\
  \ it;\n        prev = prevp;\n        next = nextp;\n    }\n    Link(Link* prevp\
  \ = NULL, Link* nextp = NULL) {\n        prev = prevp;\n        next = nextp;\n\
  \    }\n    void* operator new(size t) {\n        // 重载 new 操作符\n        if (freelist\
  \ == NULL) return ::new Link; // 创建空间\n        Link<E>* temp = freelist; // 从空闲列表中取出\n\
  \        freelist = freelist->next;\n        // 返回节点\n        return temp;\n   \
  \ }\n    // 重载 delete 操作\n    void operator delete(void* ptr) {\n        ((Link<E>*)ptr)->next\
  \ = freelist; // 放入空闲列表\n        freelist = (Link<E>*)ptr;\n    }\n};\n\n// 空闲列表指针在此处创建\n\
  template <typename E>\nLink<E>* Link<E>::freelist = NULL;\n```\n\n图 4.13 使用空闲列表的双向链表节点实现。\n\
  \n```cpp\n// 在当前位置插入 \"it\"\nvoid insert(const E& it) {\n    curr->next = curr->next->prev\
  \ = new Link<E>(it, curr, curr->next);\n    cnt++;\n}\n// 将 \"it\" 追加到列表末尾\nvoid\
  \ append(const E& it) {\n    tail->prev = tail->prev->next = new Link<E>(it, tail->prev,\
  \ tail);\n    cnt++;\n}\n// 并返回当前元素\nE remove() {\n    if (curr->next == tail) {\n\
  \        // 无元素可删除\n        return NULL;\n    }\n    E it = curr->next->element;\n\
  \    // 记录值\n    Link<E>* ltemp = curr->next;\n    // 记录链接节点\n    curr->next->next->prev\
  \ = curr;\n    curr->next = curr->next->next; // 从列表中移除\n    delete ltemp; // 回收空间\n\
  \    cnt--; // 计数减一\n    return it;\n}\n// 向左移动一步；如果左侧为空则无变化\nvoid prev() {\n  \
  \  if (curr != head) {\n        // 不能从列表头部后退\n        curr = curr->prev;\n    }\n\
  }\n```\n\n图 4.14 双向链表 `insert`、`append`、`remove` 和 `prev` 方法的实现。\n\n\n\n最后，被删除节点的前一个节点的\
  \ `next` 字段会被调整。`remove` 方法的最后步骤是更新 `listlength`、将被删除的节点返回空存储，并返回被删除元素的值。\n\n与单链表相比，双链表唯一的缺点是使用了额外的空间。双链表每个节点需要两个指针，因此在所给出的实现中，它的开销是单链表的两倍。\n\
  \n## 第 4.1 节 列表\n\n119\n\n`curr`\n\n`...`\n\n`...`\n\n20\n\n23\n\n12\n\n插入 10:\n\
  \n10\n\n(a)\n\n`curr`\n\n4\n\n5\n\n`...`\n\n20\n\n`...`\n\n23\n\n12\n\n10\n\n3 1\
  \ 2\n\n(b)\n\n**图 4.15** 双链表的插入。标签 1、2 和 3 对应链表节点构造函数执行的赋值。4 标记对 `curr->next` 的赋值。5\
  \ 标记对新插入节点之后 `prev` 指针的赋值。\n\n`curr`\n\n`...`\n\n20\n\n`...`\n\n23\n\n12\n\n(a)\n\
  \n`curr`\n\n`...`\n\n`...`\n\n20\n\n12\n\nit\n\n23\n\n(b)\n\n**图 4.16** 双链表的删除。元素\
  \ `it` 存储了被删除节点的元素。然后其两侧节点的指针将进行调整。\n\n120\n\n第 4 章 列表、栈和队列\n\n**示例 4.1** 有一种节省空间的技术可以用于消除额外的空间需求，尽管这会增加实现的复杂性且速度较慢。因此，这是一个空间/时间权衡的示例。它基于这样一个观察：如果我们存储两个值的和，就可以通过减去另一个值来获取其中任何一个值。也就是说，如果我们在变量\
  \ `c` 中存储 `a + b`，那么 `b = c - a` 且 `a = c - b`。当然，为了从存储的和中恢复其中一个值，必须提供另一个值。指向链表第一个节点的指针，加上其两个链接字段之一的值，将允许顺序访问链表的所有剩余节点。这是因为指向节点的指针必须与后一个节点\
  \ `prev` 指针的值相同，同时也与前一个节点的 `next` 指针的值相同。可以像打开拉链一样拆分求和的链接字段并在链表中向下移动。这种变体的实现细节留作练习。\n\
  \n这种技术背后的原理值得记住，因为它有许多应用。以下代码段可以在不使用临时变量的情况下交换两个变量的内容（代价是三次算术操作）。\n\n```\na = a\
  \ + b;\nb = a - b; // 现在 b 包含 a 的原始值\na = a - b; // 现在 a 包含 b 的原始值\n```\n\n使用异或运算符达到类似的效果。这一事实被广泛应用于计算机图形。通过对周围的框轮廓进行异或，可以突出计算机屏幕的一个区域。再次对框轮廓进行异或即可恢复屏幕原始内容。\n\
  \n## 4.2 栈\n\n栈是一种列表类结构，元素只能从一端插入或删除。虽然这种限制使得栈不如列表灵活，但也使得栈既高效（对于它们能执行的操作）又易于实现。许多应用程序只需要栈提供的有限形式插入和删除操作。在这种情况下，使用更简单的栈数据结构比使用通用列表更有效。例如，第\
  \ 4.1.2 节中的空闲列表（freelist）本质上就是一个栈。\n\n尽管有这些限制，栈也有许多用途。因此，栈产生了一套专门的术汇。会计师在计算机发明很久以前就使用了栈。他们将栈称为“LIFO”列表，代表“后进先出”（Last-In,\
  \ First-Out）。\n\n第 4.2 节 栈\n\n121\n\n```cpp\n// 栈抽象类\ntemplate <typename E> class\
  \ Stack {\nprivate:\n    void operator =(const Stack&) {}\n    // 保护赋值\n    Stack(const\
  \ Stack&) {}\n    // 保护拷贝构造函数\npublic:\n    Stack() {}\n    // 默认构造函数\n    virtual\
  \ ~Stack() {}\n    // 基类析构函数\n    // 初始化栈。\n    // 用户负责\n    // 回收栈元素使用的存储空间。\n\
  \    virtual void clear() = 0;\n    // 将元素推入栈顶。\n    // it: 被推入栈的元素。\n    virtual\
  \ void push(const E& it) = 0;\n    // 栈顶的元素。\n    // 返回：栈顶的元素。\n    virtual E pop()\
  \ = 0;\n    // 返回：栈顶元素的拷贝。\n    virtual const E& topValue() const = 0;\n    // 返回：栈中元素的数量。\n\
  \    virtual int length() const = 0;\n};\n```\n\n**图 4.17** 栈 ADT（抽象数据类型）。\n\n注意，LIFO\
  \ 策略的一个含义是，栈按照元素到达的反序删除元素。\n\n栈的可访问元素被称为栈顶元素（top element）。元素不是被“插入”，而是被“推”（push）入栈。当被移除时，元素被认为“弹出”（pop）出栈。图\
  \ 17 显示了一个示例栈 ADT。\n\n与列表一样，栈的实现有很多变体。这里介绍的方法分别是基于数组和链表的。\n\n### 4.2.1 基于数组的栈\n\n\
  基于数组的栈实现本质是数组列表的简化版本。重要的设计决策是数组的哪一端代表栈顶。一种选择是让栈顶位于数组的位置 0。从列表函数来看，所有的 `insert` 和\
  \ `remove` 操作都将在位置 0 进行。图 18 显示了一个完整的栈实现。\n\n对于图 4.18 的实现，`top` 被定义为栈中第一个空闲位置的数组索引。因此，空栈的\
  \ `top` 设置为 0，即数组的第一个可用空闲位置。（或者，`top` 也可以定义为\n\n122\n\n第 4 章 列表、栈和队列\n\n```cpp\n\
  // 基于数组的栈实现\ntemplate <typename E> class AStack: public Stack<E> {\nprivate:\n \
  \   int maxSize; // 栈的最大尺寸\n    int top; // 顶元素的索引\n    E *listArray; // 保存栈元素的数组\n\
  public:\n    AStack(int size = defaultSize) { // 构造函数\n        maxSize = size;\n\
  \        top = 0;\n        listArray = new E[size];\n    }\n    ~AStack() { // 析构函数\n\
  \        delete [] listArray;\n    }\n    void clear() { // 初始化\n        top = 0;\n\
  \    }\n    void push(const E& it) { // 将 \"it\" 入栈\n        Assert(top != maxSize,\
  \ \"栈满了\");\n        listArray[top++] = it;\n    }\n    E pop() { // 弹出顶元素\n   \
  \     Assert(top != 0, \"栈空\");\n        return listArray[--top];\n    }\n    const\
  \ E& topValue() const { // 返回顶元素\n        Assert(top != 0, \"栈空\");\n        return\
  \ listArray[top-1];\n    }\n    int length() const { // 返回长度\n        return top;\n\
  \    }\n};\n```\n\n**图 4.18** 基于数组的栈类实现。\n\n\n\n\n作为栈顶端元素的索引，而不是第一个空闲位置。如果这样做，空列表会将\
  \ `top` 初始化为 −1。方法 `push` 和 `pop` 简单地将元素放入由 `top` 指向的数组位置，或从该位置移除元素。由于假设 `top` 是第一个空闲位置，`push`\
  \ 首先将其值插入到 `top` 位置，然后增加 `top`；而 `pop` 则先减小 `top`，然后移除顶端元素。\n\n124\n\n第 4 章 列表、栈与队列\n\
  \n### // 链表栈实现\n\n```cpp\ntemplate <typename E> class LStack: public Stack<E> {\n\
  private:\n    Link<E>* top;\n    // 指向第一个元素的指针\n    int size;\n    // 元素数量\npublic:\n\
  \    LStack(int sz =defaultSize) // 构造函数\n    { top = NULL; size = 0; }\n    ~LStack()\
  \ { clear(); }\n    // 析构函数\n    void clear() {\n        // 重新初始化\n        while\
  \ (top != NULL) {\n            // 删除链节点\n            Link<E>* temp = top;\n    \
  \        top = top->next;\n            delete temp;\n        }\n        size = 0;\n\
  \    }\n    void push(const E& it) { // 将 \"it\" 推入栈\n        top = new Link<E>(it,\
  \ top);\n        size++;\n    }\n    E pop() {\n        // 从栈中弹出 \"it\"\n      \
  \  Assert(top != NULL, \"栈空\");\n        E it = top->element;\n        Link<E>*\
  \ ltemp = top->next;\n        delete top;\n        top = ltemp;\n        size--;\n\
  \        return it;\n    }\n    const E& topValue() const { // 返回顶端值\n        Assert(top\
  \ != 0, \"栈空\");\n        return top->element;\n    }\n    int length() const {\
  \ return size; } // 返回长度\n};\n```\n\n图 4.19 链表栈类的实现。\n\n### 4.2.2 链表栈\n\n链表栈的实现非常简单。第\
  \ 4.1.2 节中的空闲列表是链表栈的一个示例。元素仅从列表的头部插入和删除。没有使用头节点，因为对于长度为零或一个元素的列表不需要特殊处理代码。图 4.19\
  \ 显示了完整的链表栈\n\n第 4.2 节 栈\n\n125\n\ntop1\n\ntop2\n\n图 4.20 在单个数组内实现的两个栈，两者都向中间生长。实现。唯一的数据成员是\
  \ `top`，它是指向栈的第一个（顶端）链节点的指针。`push` 方法首先修改新创建链节点的 `next` 字段，使其指向栈顶，然后将 `top` 指向该链节点。`pop`\
  \ 方法也相当简单。变量 `temp` 存储顶端节点的值，而 `ltemp` 则连接到正从栈中移除的顶端节点。通过将 `top` 指向栈中的下一个链节点来更新栈。然后将旧的顶端节点返回到空闲存储区（或空闲列表），并返回元素值。\n\
  \n### 4.2.3 数组栈与链表栈的比较\n\n数组栈和链表栈实现的所有操作时间耗都是常数级的，因此从时间效率的角度来看，两者都没有显著优势。\n\n另一个比较的依据是所需的总空间。该分析与列表实现的分析类似。数组栈必须初始化时声明一个固定大小的数组，每当栈未满时，部分空间就会被浪费。链表栈可以收缩和增长，但每个元素都需要一个链域字段的开销。\n\
  \n当需要实现多个栈时，可以利用数组栈单向增长的特点。这可以使用一个数组存储两个栈来实现。如图 4.20 所示，每个栈从两个端部向内部生长，希望减少空间浪费。然而，只有当两个栈的需求呈反相关时，这种方法才有效。换句话说，理想情况下，当一个栈增长时，另一个会收缩。这在元素从一个栈取出并给给另一个栈时尤为有效。如果两个栈同时增长，那么数组中间的空闲空间很快就会耗尽。\n\
  \n### 4.2.4 实现递归\n\n也许使用栈的最常见的计算机应用程序对用户来说是不可见的。这是大多数编程语言运行时环境中子程序调用的实现。子程序调用通常通过将有关子程序的必要信息（包括返回地址、参数和局部变量）放入栈中来实现。这些信息被称为激活记录。进一步的子程序调用会向栈添加内容。每次从子程序返回都会从栈中弹出顶部激活记录。图\
  \ 4.21 展示了该\n\n126\n\n第 4 章 列表、栈与队列\n\nβ\n\nCurrptr\n\n3\n\nn\n\n2\n\nβ\n\nβ\n\n\
  Currptr 2\n\nCurrptr 2\n\nn\n\n3\n\nn\n\n3\n\nβ\n\nβ\n\nβ\n\nCurrptr 1\n\nCurrptr\
  \ 1\n\nCurrptr 1\n\nn 4\n\nn 4\n\nn 4\n\nβ\n\nβ\n\nβ\n\nCurrptr\n\nCurrptr\n\nβ\n\
  \nCurrptr\n\nCurrptr\n\nCall fact(4)\n\nCall fact(3)\n\nCall fact(2)\n\nCall fact(1)\n\
  \n2.5 节\n\n图 4.21 使用栈实现递归。\n\n考虑用值 4 调用 `fact` 时发生了什么。我们将调用程序的地址命名为 `β1`。栈必须存储 `β1`\
  \ 以及当前值 `n`（即 4）。接下来，递归调用 `fact`，这次值为 3。我们使用 `β1` 来指示调用处。栈必须存储 `β` 和值 3。\n\n以类似的方式，再次递归调用，参数为\
  \ 2，这将调用地址（假设为 `β2`）和当前值 `n`（即 3）存储在栈中。\n\n此时，我们已经达到了 `fact` 的基准情况，因此递归开始回溯。每次从\
  \ `fact` 返回都会从栈中弹出存储的 `n` 值以及函数的返回地址。`fact` 的返回值与恢复的 `n` 值相乘，并返回结果。\n\n由于每次子程序调用都必须创建激活记录并放入栈，因此子程序调用是一个相对昂贵的操作。\n\
  \n虽然递归通常用于使实现简单清晰，但有时你可能想消除递归函数调用带来的开销。\n\n在某些情况下，例如 2.5 节中的阶乘函数，递归可以很容易被迭代替换。\n\
  \n示例 4.2 作为用栈替换递归的简单示例，考虑阶乘函数的非递归版本。\n\n```cpp\nlong fact(int n, Stack<int>& S)\
  \ { // 计算 n!\n    // 为了将 n! 放入 long 类型变量中，要求 n <= 12\n    Assert((n >= 0) && (n\
  \ <= 12), \"输入超出范围\");\n    while (n > 1) S.push(n--);\n    // 填充栈\n    long result\
  \ = 1;\n    // 存储最终结果\n    while(S.length() > 0)\n        result = result * S.pop();\n\
  \    // 计算\n    return result;\n}\n```\n\n在这里，我们简单地将递减的 `n` 值推入栈，直到达到基准情况，然后反复弹出存储的值并将其相乘得到结果。\n\
  \n\n\n阶乘函数的迭代形式比示例 4.2 所示的版本更简单、也更快。但递归并非总是可以用迭代来替代。在实现需要多个分支的算法时（例如哈诺深度塔算法）或遍历二叉树时，递归或其模拟形式是必须的。第\
  \ 7 章的合并排序和快速排序算法也是需要递归的例子。幸运的是，始终可以使用栈来模拟递归。现在，让我们转向哈诺深度塔函数的非递归版本，它是无法通过迭代实现的。\n\
  \n### 示例 4.3\n图 2.2 所示的 `TOH` 函数进行了两次递归调用：一次是从底部的圆环上移动 `n − 1` 个圆环，另一个是将这 `n − 1`\
  \ 个圆环移回目标柱。我们可以通过使用栈来存储 `TOH` 必须执行的三种操作的表示：两个递归调用和一个移动操作，从而消除递归。为了做到这一点，我们必须先想出各种操作的表示方法，并将其实现为一个类，该类的对象将存储在栈中。\n\
  \n```cpp\n// 操作选择：DOMOVE 将移动一个盘子\n// DOTOH 对应于递归调用\nenum TOHop { DOMOVE, DOTOH };\n\
  \nclass TOHobj { // 一个操作对象\npublic:\n    TOHop op; // 此操作类型\n    int num;  // 盘子数量\n\
  \    Pole start, goal, tmp; // 定义柱的顺序\n    \n    // DOTOH 操作构造函数\n    TOHobj(int\
  \ n, Pole s, Pole g, Pole t) {\n        op = DOTOH; num = n;\n        start = s;\
  \ goal = g; tmp = t;\n    }\n    \n    // DOMOVE 操作构造函数\n    TOHobj(Pole s, Pole\
  \ g) { op = DOMOVE; start = s; goal = g; }\n};\n\nvoid TOH(int n, Pole start, Pole\
  \ goal, Pole tmp, Stack<TOHobj*>& S) {\n    S.push(new TOHobj(n, start, goal, tmp));\
  \ // Initial TOHobj* t;\n    while (S.length() > 0) {\n        // 获取下一个任务\n    \
  \    t = S.pop();\n        if (t->op == DOMOVE)\n            // 执行移动\n         \
  \   move(t->start, t->goal);\n        else if (t->num > 0) {\n            // 存储（逆序）3\
  \ 条递归语句\n            int num = t->num;\n            Pole tmp = t->tmp;\n       \
  \     Pole goal = t->goal;\n            Pole start = t->start;\n            S.push(new\
  \ TOHobj(num-1, tmp, goal, start));\n            S.push(new TOHobj(start, goal));\n\
  \            S.push(new TOHobj(num-1, start, tmp, goal));\n        }\n        delete\
  \ t; // 必须删除创建的 TOHobj\n    }\n}\n```\n\n**图 4.22** 基于栈的哈诺深度塔实现。\n\n图 4.22 展示了这样一个类。我们首先定义了一个名为\
  \ `TOHop` 的枚举类型，包含两个值 `MOVE` 和 `TOH`，分别表示对 `move` 函数的调用和对 `TOH` 的递归调用。`TOHobj` 类存储了五个值：一个操作字段（表示移动或新的\
  \ TOH 操作）、圆环数量以及三个柱子。注意，移动操作实际上只需要存储关于两个柱子的信息。\n\n因此，有两个构造函数：一个用于存储模拟递归调用时的状态，另一个用于存储移动操作的状态。\n\
  \n使用基于数组的栈是因为我们知道栈将恰好需要存储 `2n+1` 个元素。新版本的 `TOH` 开始在栈上放置一个关于 `n` 个圆环初始问题的描述。函数的其余部分只是一个\
  \ `while` 循环，用于从栈中弹出元素并执行相应的操作。在 `TOH` 操作的情况下（当 `n > 0` 时），我们在栈中存储递归版本所执行的三种操作的表示。然而，这些操作必须以逆序放在栈中，这样它们才能按照正确的顺序被弹出。\n\
  \n当描述一个子问题所需的信息较少时，递归算法非常适合用栈进行高效实现。例如，第 7.5 节讨论了基于栈的快速排序实现。\n\n## 4.3 队列\n\n和栈一样，队列是一种类似于列表的结构，对其元素的访问是受限的。队列元素只能在队插入（称为\
  \ `enqueue` 操作）并从头部移除（称为 `dequeue` 操作）。队列的操作方式就像在电影院售票处排队。如果没有人作弊，新来的人就去队末尾。队首的人是下一个被服务的人。因此，队列按照到达顺序释放元素。早在计算机出现之前，会计师就已经使用了队列。他们将队列称为“FIFO”列表，意为“先进先出”（First-In,\
  \ First-Out）。图 4.23 展示了一个示例队列 ADT。本节介绍了队列的两种实现方式：基于数组的队列和链队列。\n\n### 4.3.1 基于数组的队列\n\
  \n基于数组的队列要有效地实现有些困难。简单地转换基于数组的列表并不是高效的。\n\n假设队列中有 `n` 个元素。类似于基于数组的列表实现，我们可以要求队列的所有元素都在数组的前\
  \ `n` 个位置上。如果我们选择队列的尾部为位置 `0`，那么 `dequeue` 操作只需要 Θ(1) 时间，因为队列的头部（被移除的元素）是数组的最后一个。然而，`enqueue`\
  \ 操作将需要 Θ(n) 时间，因为队列中的每个元素必须移动。如果选择队列的尾部位于位置 `n-1`，那么 `enqueue` 操作等同于列表的 `append`\
  \ 操作。这只需要 Θ(1) 时间。但现在，`dequeue` 操作将需要 Θ(n) 时间，因为所有元素必须向下移动一位。\n\n```cpp\n// 抽象队列类\n\
  template <typename E> class Queue {\nprivate:\n    void operator =(const Queue&)\
  \ {} // 防止赋值\n    Queue(const Queue&) {} // 防止拷贝构造\npublic:\n    Queue() {} // 默认构造函数\n\
  \    virtual ~Queue() {} // 基类析构函数\n    // 初始化队列。\n    // 用户负责回收队列元素使用的内存。\n   \
  \ virtual void clear() = 0;\n    // 将元素放入队列尾部。\n    // it: 入队的元素。\n    virtual void\
  \ enqueue(const E&) = 0;\n    // 移除并返回队列头部的元素。\n    // 返回：队列头部的元素。\n    virtual\
  \ E dequeue() = 0;\n    // 返回：头部元素的拷贝。\n    virtual const E& frontValue() const\
  \ = 0;\n    // 返回：队列中元素的数量。\n    virtual int length() const = 0;\n};\n```\n\n**图\
  \ 4.23** 队列的 C++ ADT。\n\n通过放宽队列元素必须位于数组前 `n` 个位置的要求，可以获得一种高效得多的实现。\n\n我们仍然要求队列存储在连续的数组位置上，但允许队列的内容在数组内漂移，如图\
  \ 4.24 所示。现在，`enqueue` 和 `dequeue` 操作都可以在 Θ(1) 时间内完成，因为队列中的其他元素不需要移动。\n\n\n\n\n\
  这种实现产生了一个新问题。假设队列的头部元素初始位于位置 0，并且元素被相继添加到数组中编号更靠后的位置。当元素从队列中移除时，头部的索引就会增加。随着时间的推移，整个队列会向数组中编号更高的位置漂移。一旦某个元素被插入到数组中编号最高的位置，队列就耗尽了空间。尽管数组的低端可能存在由于之前从队列中移除元素而留下的空位置。\n\
  \n“漂移队列”问题可以通过假装数组是循环的来解决，从而允许队列直接从数组中编号最高的位置继续连接到编号最低的位置。这可以通过使用模运算运算符（在 C++ 中表示为\
  \ `%`）轻松实现。通过这种方式，数组中的位置从 0 到 `size-1` 编号，且位置 `size-1` 被定义为紧邻位置 0（这等同于位置 `size %\
  \ size`）。图 4.25 展示了这种解决方案。\n\n### 第 4.3 节 队列\n\n131\n\nfront\nrear\n20 5 12 17\n\
  (a)\nfront\nrear\n12 17\n3\n30 4\n(b)\n\n**图 4.24** 在反复使用后，基于数组的队列中的元素将漂移到数组的末尾。(a)\
  \ 插入前四个数字 20、5、12 和 17 后的队列。(b) 删除元素 20 和 5 后的队列，随后插入 3、30 和 4。\n\nfront\nfront\n\
  20\n5\n12\n12\n17\n17\nrear\n3\n30\n4\nrear\n(a)\n(b)\n\n**图 4.25** 数组位置按顺时针方向增加的循环队列。(a)\
  \ 插入前四个数字 20、5、12 和 17 后的队列。(b) 删除元素 20 和 5 后的队列，随后插入 3、30 和 4。\n\n对于基于数组的队列实现，还存在另外一个严重但微妙的问题。我们如何识别队列是为空的还是满的？\n\
  \n假设 `front` 存储队列中头部元素的数组索引，而 `rear` 存储队列尾部元素的数组索引。如果 `front` 和 `rear` 具有相同的位置，那么根据这种方案，队列中必须有一个元素。因此，空队列可以通过\
  \ `rear` 比 `front` 小 1 来识别（考虑到队列是循环的，所以位置 `size-1` 实际上被认为比位置 0 小 1）。但如果队列完全满员呢？\n\
  \n换句话说，当一个拥有 $n$ 个可用数组位置的队列\n\n132\n\n第 4 章 列表、栈和队列\n\n包含 $n$ 个元素时，情况如何？在这种情况下，如果头部元素位于位置\
  \ 0，那么尾部元素位于位置 `size-1`。但这意味着，考虑到队列的循环特性，`rear` 的值比 `front` 的值小 1。换句话说，满队列和空队列是无法区分的！\n\
  \n你可能认为问题出在对 `front` 和 `rear` 被定义为分别存储头部和尾部元素数组索引的假设，并且对该定义进行某些修改将提供解决方案。遗憾的是，无法通过简单改变\
  \ `front` 和 `rear` 的定义来解决这个问题，因为队列可能处于的条件或状态太多。\n\n忽略第一个元素的实际位置，忽略队列中存储元素的实际值，会有多少种不同的状态？队列中可以没有元素、一个元素、两个，以此类推。如果有\
  \ $n$ 个数组位置，队列中最多可以有 $n$ 个元素。这意味着队列有 $n+1$ 种不同的状态（从 0 到 $n$ 个元素都是可能的）。\n\n如果 `front`\
  \ 的值是固定的，就需要 $n+1$ 个不同的 `rear` 值来区分这 $n+1$ 种状态。然而，除非我们为（例如）空队列创建一个特殊情况，否则 `rear`\
  \ 只有 $n$ 个可能的值。这是练习 2.30 中定义的鸽巢原理的例子。鸽巢原理指出，在给定 $n$ 个鸽巢和 $n+1$ 只鸽子的情况下，当所有鸽子都进入鸽巢时，我们可以确定至少有一个鸽巢包含多于一只鸽子。同样，我们可以确定\
  \ $n+1$ 个状态中的两个状态通过 `front` 和 `rear` 的 $n$ 个相对值是无法区分的。我们必须寻找其他方法来区分满队列和空队列。\n\n\
  一个显而易见的解决方案是维护队列中元素数量的显式计数，或者至少一个指示队列是否空的布尔变量。另一个解决方案是让数组大小为 $n+1$，并且只允许存储 $n$ 个元素。采用这些解决方案之一完全取决于实现者对此事的喜好。我的选择是使用大小为\
  \ $n+1$ 的数组。\n\n图 4.26 显示了一个基于数组的队列实现。`listArray` 持有队列元素，按照惯，队列构造函数允许一个可选参数来设置队列的最大大小。创建的数组实际上足够容纳比队列允许的多一个元素，以便区分空队列和满队列。\n\
  \n```cpp\n// 基于数组的队列实现\ntemplate <typename E> class AQueue: public Queue<E> {\n\
  private:\n    int maxSize;\n    // 队列的最大大小\n    int front;\n    // 头部元素的索引\n   \
  \ int rear;\n    // 尾部元素的索引\n    E *listArray;\n    // 保存队列元素的数组\npublic:\n    AQueue(int\
  \ size =defaultSize) {\n        // 构造函数\n        // 让数组大一个位置留出一个空位\n        maxSize\
  \ = size+1;\n        rear = 0;\n        front = 1;\n        listArray = new E[maxSize];\n\
  \    }\n    ~AQueue() { delete [] listArray; } // 析构函数\n    void clear() { rear\
  \ = 0; front = 1; } // 初始化\n    void enqueue(const E& it) {\n        // 将 \"it\"\
  \ 放入队列\n        Assert(((rear+2) % maxSize) != front, \"队列已满\");\n        rear =\
  \ (rear+1) % maxSize;\n        // 循环增加\n        listArray[rear] = it;\n    }\n \
  \   E dequeue() {\n        // 取出元素\n        Assert(length() != 0, \"队列为空\");\n \
  \       E it = listArray[front];\n        front = (front+1) % maxSize;\n       \
  \ // 循环增加\n        return it;\n    }\n    const E& frontValue() const {\n      \
  \  // 获取头部值\n        Assert(length() != 0, \"队列为空\");\n        return listArray[front];\n\
  \    }\n    virtual int length() const\n        // 返回长度\n    { return ((rear+maxSize)\
  \ - front + 1) % maxSize; }\n};\n```\n\n**图 4.26** 基于数组的队列实现。\n\n134\n\n第 4 章 列表、栈和队列\n\
  \n4.3.2\n\n链接队列\n\n链接队列的实现是对链表的直接适配。\n\n\n\n\n图 4.27 显示了链表队列类的声明。`front` 和 `rear`\
  \ 方法分别是指向队列头部和尾部元素的指针。我们将使用一个头链节点（header link node），这可以通过避免队列为空时的任何特殊情况，使得入队操作（enqueue）的实现更加简单。在初始化时，`front`\
  \ 和 `rear` 指针将指向头节点，`front` 始终指向头节点，而 `rear` 指向队列中真正的最后一个链节点。`enqueue` 方法将新元素放在链表末尾的链节点中（即\
  \ `rear` 所指向的节点），然后使 `rear` 指向新的链节点。`dequeue` 方法移除并返回列表的第一个元素。\n\n### 4.3.3 基于数组的队列与链表队列的比较\n\
  \n基于数组和链表的队列实现中的所有成员函数都需要常数时间。空间比较问题与等效栈实现相同。与基于数组的栈实现不同，没有方便的方法在同一个数组中存储两个队列，除非元素总是直接从一个队列传输到另一个队列。\n\
  \n## 4.4 字典\n\n计算机程序最常见的目标是存储和检索数据。\n\n本书的大部分内容关于高效组织数据记录集合的方法，以便能够快速存储和检索它们。在这一节中，我们描述了此类集合的简单接口，称为字典（dictionary）。字典\
  \ ADT 提供了存储记录、查找记录和从集合中移除记录的操作。该 ADT 为我们比较各种数据结构提供了标准依据。\n\n在讨论字典的接口之前，我们必须首先定义键（key）和可比较对象（comparable\
  \ objects）的概念。如果我们想在数据库中搜索特定的记录，我们应该如何描述我们正在寻找的内容？数据库记录可能仅仅是一个数字，也可能非常复杂，例如具有许多不同类型字段的工资记录。我们不希望通过详细描述和匹配记录的全部内容来描述我们正在寻找的内容。如果我们已经知道关于记录的所有信息，可能就不需要查找它了。相反，我们通常根据键值（key\
  \ value）来定义我们想要的记录。例如，如果搜索薪资记录，我们可能希望搜索匹配特定 ID 号的记录。在这个例子中，ID 号就是搜索键。\n\n为了实现搜索功能，我们要求键是可比较的。至少，我们必须能够获取两个键并可靠地判断它们是否相等。这足以对记录数据库进行顺序搜索并找到与给定键匹配的记录。然而，我们通常希望键定义一个全序（见第\
  \ 2.1 节），这意味着我们可以判断两个键中哪一个更大。使用具有全序的键类型为数据库实现者提供了机会，以更高效的方式组织记录集合。一个例子是在数组中按排序顺序存储记录，这允许二分查找。幸运的是，在实践中，大多数记录的大多数字段由具有自然全序的简单数据类型组成。例如，整数、浮点数、双精度浮点字符串都是全序的。对于自然的多维字段（例如二维或三维空间中的点），如果我们想利用它们的多维特性，将面临特殊的机遇。这个问题在第\
  \ 13.3 节中讨论。\n\n#### 链表队列实现\n\n```cpp\ntemplate <typename E> class LQueue: public\
  \ Queue<E> {\nprivate:\n  Link<E>* front; // 指向队列头节点的指针\n  Link<E>* rear; // 指向队列尾节点的指针\n\
  \  int size; // 队列中的元素数量\npublic:\n  LQueue(int sz =defaultSize) // 构造函数\n  { front\
  \ = rear = new Link<E>(); size = 0; }\n  ˜LQueue() { clear(); delete front; } //\
  \ 析构函数\n  void clear() {\n    // 清空队列\n    while(front->next != NULL) { // 删除每个链节点\n\
  \      rear = front;\n      delete rear;\n    }\n    rear = front;\n    size = 0;\n\
  \  }\n  void enqueue(const E& it) { // 将元素放入尾部\n    rear->next = new Link<E>(it,\
  \ NULL);\n    rear = rear->next;\n    size++;\n  }\n  E dequeue() {\n    // 从头部移除元素\n\
  \    Assert(size != 0, \"Queue is empty\");\n    E it = front->next->element;\n\
  \    // 存储出队值\n    Link<E>* ltemp = front->next; // 留存出队的链节点\n    front->next =\
  \ ltemp->next;\n    // 移动头部\n    if (rear == ltemp) rear = front; // 出队最后一个元素\n\
  \    delete ltemp;\n    // 删除链节点\n    size --;\n    return it; // 返回元素值\n  }\n \
  \ const E& frontValue() const { // 获取头部元素\n    Assert(size != 0, \"Queue is empty\"\
  );\n    return front->next->element;\n  }\n  virtual int length() const { return\
  \ size; }\n};\n```\n图 4.27 链表队列类的实现。\n\n图 4.28 显示了简单抽象字典类的定义。`insert` 和 `find` 方法是该类的核心。`insert`\
  \ 方法接收一个记录并将其插入字典。`find` 方法接收一个键值，并从字典中返回与该键匹配的记录。如果字典中有多个具有该键的记录，则不要求返回哪一个。\n\n\
  `clear` 方法仅仅是重新初始化字典。`remove` 方法类似于 `find`，但它还会删除返回的记录。再次，如果字典中有多个具有该键的记录，不要求具体删除哪一个。`size`\
  \ 方法返回字典中的元素数量。\n\n剩余的方法是 `removeAny`。它类似于 `remove`，但它不接受键值。相反，它从字典中移除一个任意记录（如果存在）。该方法的目的是允许用户遍历字典中的所有元素（当然，在此过程中字典将变为空）。如果没有\
  \ `removeAny` 方法，用户将无法获取不知道键值的字典记录。有了 `removeAny` 方法，用户可以像下面的代码片段所示处理字典中的记录：\n\n\
  ```cpp\nwhile (dict.size() > 0) {\n  it = dict.removeAny();\n  doSomething(it);\n\
  }\n```\n\n其他遍历字典的方法似乎更自然，例如使用“first”和“next”函数。但并不是所有我们想要实现字典的数据结构都能高效地执行“first”。例如，哈希表实现无法高效定位键值最小的记录。通过使用\
  \ `removeAny`，我们获得了一种通用访问机制。\n\n#### 字典抽象类\n\n```cpp\ntemplate <typename Key, typename\
  \ E>\nclass Dictionary {\nprivate:\n  void operator =(const Dictionary&) {}\n  Dictionary(const\
  \ Dictionary&) {}\npublic:\n  Dictionary() {} // 默认构造函数\n  virtual ˜Dictionary()\
  \ {} // 基析构函数\n  // 重新字典\n  virtual void clear() = 0;\n  // 插入记录\n  // k: 插入记录的键。\n\
  \  // e: 插入的记录。\n  virtual void insert(const Key& k, const E& e) = 0;\n  // 移除并返回记录。\n\
  \  // k: 要移除的记录的键。\n  // 返回: 匹配的记录。如果多个记录匹配 \"k\"，\n  // 则移除任意一个。如果不存在键为 \"k\" 的记录，则返回\
  \ NULL。\n};\n```\n\n\n\n\n```cpp\nvirtual E remove(const Key& k) = 0;\n\n// 从字典中删除并返回任意记录。\n\
  // 返回：被删除的记录，如果不存在则返回 NULL。\nvirtual E removeAny() = 0;\n\n// 返回匹配 \"k\" 的记录（如果不存在则返回\
  \ NULL）。\n// 如果有多个记录匹配，则返回其中任意一个。\n// k: 要查找的记录的键\nvirtual E find(const Key& k)\
  \ const = 0;\n\n// 返回字典中的记录数。\nvirtual int size() = 0;\n\n};\n```\n\n图 4.28 简单字典的\
  \ ADT。\n\n138\n\n第 4 章 列表、栈与队列\n\n```cpp\n// 一个包含 ID、名称、地址字段的简单工资条目\nclass Payroll\
  \ {\nprivate:\n    int ID;\n    string name;\n    string address;\npublic:\n   \
  \ // 构造函数\n    Payroll(int inID, string inname, string inaddr) {\n        ID = inID;\n\
  \        name = inname;\n        address = inaddr;\n    }\n    ~Payroll() {}\n \
  \   // 本地数据成员访问函数\n    int getID() { return ID; }\n    string getname() { return\
  \ name; }\n    string getaddr() { return address; }\n};\n```\n\n图 4.29 工资条记录的实现。\n\
  \n给定一个存储特定类型记录的数据库，我们可能想以多种方式搜索记录。例如，我们可能想将工资条记录存储在一个字典中，允许我们按 ID 搜索；同时将这些相同的记录存储在第二个字典中，允许我们按名称搜索。\n\
  \n图 4.29 显示了工资条记录的一种实现方式。`Payroll` 类有多个字段，每个字段都可能用作搜索键。通过简单地更改键的类型并将每条记录中相应的字段作为键值，我们就可以定义一个搜索键为\
  \ `ID` 字段的字典，另一个搜索键为 `name` 字段的字典，以及第三个搜索键为 `address` 字段的字典。图 4.30 显示了一个示例，其中 `Payroll`\
  \ 对象被存储在两个独立的字典中，一个使用 `ID` 字段作为键，另一个使用 `name` 字段作为键。\n\n字典的基本操作是找到与给定键匹配的记录。这引出了如何从记录中提取键的问题。我们希望任何定的字典实现都能支持任意记录类型，因此我们需要某种足够通用的提取键的机制。一种方法是要求所有记录类型都支持某个返回键值的特定方法。例如，在\
  \ Java 中，可以使用 `Comparable` 接口来提供这种效果。遗憾的是，当同一种记录类型需要存储在多个字典中，且每个字典由记录的不同字段作为键时，这种方法并不适用。这在数据库应用中很常见。另一种更通用的方法是提供一个类，其职责是从记录中提取键。遗憾的是，这种解决方案在所有情况下也并不适用，因为对于某些记录类型，无法编写键提取方法²\n\
  \n139\n\n```cpp\nint main() {\n    // IDdict 按 ID 组织 Payroll 记录\n    UALdict<int,\
  \ Payroll*> IDdict;\n    // namedict 按名称组织 Payroll 记录\n    UALdict<string, Payroll*>\
  \ namedict;\n    Payroll *foo1, *foo2, *findfoo1, *findfoo2;\n    foo1 = new Payroll(5,\
  \ \"Joe\", \"Anytown\");\n    foo2 = new Payroll(10, \"John\", \"Mytown\");\n  \
  \  IDdict.insert(foo1->getID(), foo1);\n    IDdict.insert(foo2->getID(), foo2);\n\
  \    namedict.insert(foo1->getname(), foo1);\n    namedict.insert(foo2->getname(),\
  \ foo2);\n    findfoo1 = IDdict.find(5);\n    if (findfoo1 != NULL) cout << findfoo1;\n\
  \    else cout << \"NULL \";\n    findfoo2 = namedict.find(\"John\");\n    if (findfoo2\
  \ != NULL) cout << findfoo2;\n    else cout << \"NULL \";\n}\n```\n\n图 4.30 字典搜索示例。在这里，工资条记录存储在两个字典中，一个按\
  \ ID 组织，另一个按名称组织。两个字典都是用基于无序数组的列表实现的。\n\n根本问题在于，记录的键值并不是记录类的固有属性，也不是该类中任何字段的固有属性。记录的键实际上是记录被使用的上下文的属性。\n\
  \n一种真正通用的替代方案是在字典中作为一个独立的字段，显式存储与给定记录关联的键。也就是说，字典中的每个条目都包含记录及其关联的键。这种条目被称为键值对（key-value\
  \ pairs）。显式存储键通常会复制记录中的某些字段。然而，键通常比记录小得多，因此这种额外的空间开销不会很大。图 4.31 显示了一个用于表示键值对的简单类。字典类的\
  \ `insert` 方法支持键值对实现，因为它接受两个参数：记录以及该字典与之关联的键。\n\n140\n\n第 4 章 列表、栈与队列\n\n```cpp\n\
  // 键值对的容器\ntemplate <typename Key, typename E>\nclass KVpair {\nprivate:\n    Key\
  \ k;\n    E e;\npublic:\n    // 构造函数\n    KVpair() {}\n    KVpair(Key kval, E eval)\
  \ {\n        k = kval;\n        e = eval;\n    }\n    KVpair(const KVpair& o) {\
  \ // 拷贝构造函数\n        k = o.k;\n        e = o.e;\n    }\n    void operator =(const\
  \ KVpair& o) { // 赋值运算符\n        k = o.k;\n        e = o.e;\n    }\n    // 数据成员访问函数\n\
  \    Key key() { return k; }\n    void setKey(Key ink) { k = ink; }\n    E value()\
  \ { return e; }\n};\n```\n\n图 4.31 表示键值对的类的实现。\n\n现在我们已经定义了字典 ADT，并确定了为条目存储键值对的设计方案，准备好考虑实现方法了。两种可能性是使用基于数组或链表的。图\
  \ 4.32 显示了使用（无序）数组列表实现的字典。\n\n通过检查 `UALdict` 类（UAL 代表无序数组列表），我们可以很容易地看到 `insert`\
  \ 是一个常数时间操作，因为它简单地将新记录插入到列表末尾。然而，`find` 和 `remove` 在平均和最坏情况下都需要 Θ(n) 时间，因为我们需要进行顺序搜索。\n\
  \n特别是 `remove` 方法，必须遍历列表中的每条记录，因为一旦找到了所需的记录，剩余记录必须在列表中向下移动以填补空隙。`removeAny` 从列表中删除最后一条记录，因此这是一个常数时间操作。\n\
  \n作为替代方案，我们可以使用链表来实现字典。其实现将与图 4.32 所示非常相似，函数的代价在渐近上应该是相同的。\n\n另一种替代方案是用排序列表来实现字典。这种方法的优势是，我们可能通过二分查找来加速\
  \ `find` 操作。为了做到这一点，我们首先对 `List` ADT 定义一个变体以支持排序列表。图 4.33 显示了基于数组的排序列表的实现。排序列表与无序列表的不同之处在于，它不允许用户控制元素插入的位置。因此，\n\
  \n141\n\n\n\n\n\n## 使用无排序数组列表实现的字典\n\n```cpp\ntemplate <typename Key, typename E>\n\
  class UALdict : public Dictionary<Key, E> {\nprivate:\n    AList<KVpair<Key,E> >*\
  \ list;\npublic:\n    UALdict(int size=defaultSize)\n    // 构造函数\n    { list = new\
  \ AList<KVpair<Key,E> >(size); }\n    UALdict() { delete list; }\n    // 析构函数\n\
  \    void clear() { list->clear(); }\n    // 初始化\n    // 插入元素：追加到列表末尾\n    void\
  \ insert(const Key&k, const E& e) {\n        KVpair<Key,E> temp(k, e);\n       \
  \ list->append(temp);\n    }\n    // 使用顺序查找找到要删除的元素\n    E remove(const Key& k)\
  \ {\n        E temp = find(k); // \"find\" 将设置列表位置\n        if(temp != NULL) list->remove();\n\
  \        return temp;\n    }\n    E removeAny() { // 移除最后一个元素\n        Assert(size()\
  \ != 0, \"Dictionary is empty\");\n        list->moveToEnd();\n        list->prev();\n\
  \        KVpair<Key,E> e = list->remove();\n        return e.value();\n    }\n \
  \   // 使用顺序查找查找 \"k\"\n    E find(const Key& k) const {\n        for(list->moveToStart();\n\
  \        list->currPos() < list->length(); list->next()) {\n            KVpair<Key,E>\
  \ temp = list->getValue();\n            if (k == temp.key())\n                return\
  \ temp.value();\n        }\n        return NULL; // \"k\" 不在字典中\n    }\n    int\
  \ size() // 返回列表大小\n    { return list->length(); }\n};\n```\n\n**图 4.32** 使用无排序数组列表实现的字典。\n\
  **图 4.32**（续） 142\n\n## 排序数组列表\n\n继承自 `AList` 作为保护基类\n\n```cpp\ntemplate <typename\
  \ Key, typename E>\nclass SAList: protected AList<KVpair<Key,E> > {\npublic:\n \
  \   SAList(int size=defaultSize) :\n    AList<KVpair<Key,E> >(size) {}\n    ~SAList()\
  \ {} // 析构函数\n    // 重定义 insert 函数以保持值排序\n    void insert(KVpair<Key,E>& it) { //\
  \ 插入到右侧\n        KVpair<Key,E> curr;\n        for (moveToStart(); currPos() < length();\
  \ next()) {\n            curr = getValue();\n            if(curr.key() > it.key())\n\
  \                break;\n        }\n        AList<KVpair<Key,E> >::insert(it); //\
  \ AList 的 insert\n    }\n    // 除了 append 外，所有剩余方法都\n    // 从 AList 暴露出来。类用户对 append\
