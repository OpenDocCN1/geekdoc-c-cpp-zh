  \ 的祖先，`M` 就是 `R` 的后代。因此，树中的所有节点都是根的后代。\n\n# 第 5 章 二叉树\n\n**图 5.1** 一棵二叉树。节点 `A`\
  \ 是根。节点 `B` 和 `C` 是 `A` 的孩子。\n\n节点 `B` 和 `D` 共同组成子树。节点 `B` 有两个孩子：它的左孩子是空树，右孩子是 `D`。节点\
  \ `A`、`C` 和 `E` 是 `G` 的祖先。\n\n节点 `D`、`E` 和 `F` 成了树的第 2 层；节点 `A` 位于第 0 层。从 `A` 到\
  \ `C` 再到 `E` 最后到 `G` 的边形成长度为 3 的路径。节点 `D`、`G`、`H` 和 `I` 是叶节点。\n\n节点 `A`、`B`、`C`、`E`\
  \ 和 `F` 是内部节点。`I` 的深度为 3。这棵树的高度为 4。\n\n树的根是所有节点的祖先。树中节点 `M` 的深度是从树的根到 `M` 的路径长度。树的高度比树中最深节点的深度多加\
  \ 1。所有深度为 `d` 的节点都在树的第 `d` 层。根是第 0 层的唯一节点，它的深度为 0。叶节点是任何具有两个空孩子的节点。内部节点是任何具有至少一个非空孩子的节点。\n\
  \n图 5.1 展示了用于标识二叉树各部分的各种术语。\n\n图 5.2 展示了关于二叉树结构的一个重要 True 点。\n\n由于所有二叉树节点都有两个孩子（其中一个或两个都可能为空），因此图\
  \ 5.2 中的两棵二叉树是不相同的。\n\n两种受限的二叉树形式重要到足以拥有专门的。满二叉树中的每个节点要么是 (1) 具有两个两个非空孩子的内部节点，要么是\
  \ (2) 叶节点。完全二叉树具有受限的形状，从根开始从左到右逐层填充树。在高度为 `d` 的完全二叉树中，除了可能的第 `d−1` 层外，所有层都是满的。底层的节点从左侧开始填充。\n\
  \n图 5.3 展示了满二叉树和完全二叉树之间的区别。\n\n这两种树形状之间没有特定的关系；也就是说，图 5.3(a) 中的树是满的但不完全，而图 5.3(b)\
  \ 中的树是完全的但不满。虽然这些满二叉树和完全二叉树的定义是最常用的，但它们并不是通用的。由于“满（full）”和“完全（complete）”这两个词的含义非常相似，除了记忆定义外，你几乎无事可以区分它们。这里有一个你可能觉得有用的记忆辅助：“完全（complete）”是一个比“满（full）”更宽的词，完全二叉树往往比满二叉树宽，因为完全二叉树的每一层都是尽可能宽的。\n\
