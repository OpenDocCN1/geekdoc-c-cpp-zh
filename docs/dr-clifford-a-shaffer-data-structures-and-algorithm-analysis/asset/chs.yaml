  \ 8、4、2 和 1。图 7.7 给出了壳排序的 C++ 实现。\n\n只要最后一轮的增量为 1，壳排序就能正常工作（即只要最后一轮是普通的插入排序）。如果壳排序总是以普通的插入排序结束，那么它如何比插入排序有所改进呢？预期是每个（相对廉价的）子列表排序都会使列表比之前“更有序”。\n\
  \n## 第 7.4 节归并排序（Mergesort）\n\n241\n\n### 适用于不同增量的改进插入排序版本\n\n```cpp\ntemplate <typename\
  \ E, typename Comp>\nvoid inssort2(E A[], int n, int incr) {\n    for (int i=incr;\
  \ i<n; i+=incr)\n        for (int j=i; (j>=incr) && (Comp::prior(A[j], A[j-incr]));\
  \ j-=incr)\n            swap(A, j, j-incr);\n}\n\ntemplate <typename E, typename\
  \ Comp>\nvoid shellsort(E A[], int n) { // 壳排序\n    for (int i=n/2; i>2; i/=2)\n\
  \        // 对于每个增量\n        for (int j=0; j<i; j++)\n            // 排序每个子列表\n  \
  \          inssort2<E,Comp>(&A[j], n-j, i);\n    inssort2<E,Comp>(A, n, 1);\n}\n\
  ```\n\n**图 7.7** 壳排序的实现。\n\n这种情况并不一定成立，但在实践中几乎总是成立的。当最后一轮是插入排序时，列表应该是“接近有序”。预期是每个（相对廉价的）子列表排序都会使列表比之前“更有序”。某些增量选择会使壳排序运行得比其他算法高效。特别是，增量选择（2k,\
  \ 2k-1）结果被证明是低效的。一种更好的选择是基于三分的（..., 1）。\n\n壳排序的分析是困难的，我们必须接受：在某些增量情况下，壳排序的平均性能是\
  \ `O(n¹.5)`。增量选择可以稍微减小这个上界。因此，壳排序在渐近意义上优于插入排序。当输入是链表时，壳排序非常非常。对于链表实现 `merge` 函数是直接的，因为我们只需要从输入列表头部移除项并添加到输出列表。\n\
  \n## 7.4 归并排序\n\n归并排序的自然方法是分治法。在排序方面，我们可能考虑将列表拆分为两半，对两半进行排序，然后将它们合并。这种方法不需要预先知道列表长度。\n\
  \n242\n\n36 20 17 13 28 15\n20 36 13 17 28 15\n13 20\n\n**图 7.8** 归并排序的插图。归并排序将列表分解为\
  \ 1 的子列表，然后合并它们。第一行显示大小为 8。第二行显示大小为 2。第三行显示大小为 4。\n\n归并排序是最简单的算法之一。令人的是，尽管它基于简单的概念，在渐近意义上它的性能良好。在实践中，实现它是比较困难的。归并排序的伪代码如下：\n\
  \n```\nList mergesort(List inlist) {\n    if (inlist.length() <= 1) return inlist;\n\
  \    List L1 = half of inlist;\n    List L2 = other half of inlist;\n    return\
  \ merge(mergesort(L1), mergesort(L2));\n}\n```\n\n在讨论如何实现归并排序之前，我们将首先检查 `merge`\
  \ 函数。合并两个有序的子列表非常简单。`merge` 函数检查每个子列表的元素并选取较小值。该较小值从子列表中移除并放入输出列表。以这种方式合并，直到子列表中没有剩余元素。\n\
  \n实现归并排序面临许多技术困难。第一个决策是如何表示列表。因此，归并排序非常适合链表，因为合并不需要对列表进行随机访问。\n\n将输入列表分为两个等大的部分具有某些困难。理想情况下，我们会直接将列表分为前后两个半部分。然而，即使我们预先知道列表长度，仍然需要遍历列表到后半部分的开头。一种更简单、不依赖列表长度的方法是把元素分配给……\n\
  \n第 7.4 节 归并排序 243\n\n```cpp\ntemplate <typename E, typename Comp>\nvoid mergesort(E\
  \ A[], E temp[], int left, int right) {\n    if (left == right) return;\n    //\
  \ 单元素列表\n    int mid = (left+right)/2;\n    mergesort<E,Comp>(A, temp, left, mid);\n\
  \    mergesort<E,Comp>(A, temp, mid+1, right);\n    // 将子数组拷贝到 temp\n    for (int\
  \ i=left; i<=right; i++)\n        temp[i] = A[i];\n    // 将合并操作回 A\n    int i1 =\
  \ left; int i2 = mid + 1;\n    for (int curr=left; curr<=right; curr++) {\n    \
  \    if (i1 == mid+1)\n            // 左子列表耗尽\n            A[curr] = temp[i2++];\n\
  \        else if (i2 > right)\n            // 右子列表耗尽\n            A[curr] = temp[i1++];\n\
  \        else if (Comp::prior(temp[i1], temp[i2]))\n            A[curr] = temp[i1++];\n\
  \        else A[curr] = temp[i2++];\n    }\n}\n```\n\n**图 7.9** 归并排序的标准实现。\n\n\n\
  \n输入列表在两个子列表之间交替分配。第一个元素分配给第一个子列表，第二个元素分配给第二个子列表，第三个分配给第一个子列表，第四个分配给第二个子列表，以此此类推。这需要对输入列表进行完整遍历来构建子列表。\n\
  \n当 `Mergesort` 的输入是一个数组时，如果我们知道数组边界，将输入拆分为两个子数组是非常容易。如果我们将子数组合并到第二个数组中，合并操作也很容易。请注意，这种方法所需的空间是目前为止介绍的任何排序方法的两倍，这对于\
  \ `Mergesort` 来说是一个严重的缺点。可以在不使用第二个数组的情况下合并子数组，但要高效地实现这一点极其困难，并且并不实用。将两个子数组合并到第二个数组虽然实现起来简单，但存在另一个困难。合并过程以辅助数组中的有序列表结束。考虑一下\
  \ `Mergesort` 的递归性质如何将原始数组拆分为子数组，如图 7.8 所示。`Mergesort` 被递归调用，直到创建了大小为 1 的子数组，这需要\
  \ `log n` 层的递归。这些子数组被合并为大小为 2 的子数组，然后再次合并为大小为 4 的子数组，以此此类推。\n\n我们需要避免每次合并操作都要求一个新的数组。经过一些努力，可以设计出在两个数组之间交替的算法。一种更简单的方法是先将排序后的子列表复制到辅助数组，然后将它们合并回原始数组。图\
  \ 7.9 显示了遵循这种方法的归排序的完整实现。\n\n优化的 `Mergesort` 实现如图 7.10 所示。它在初始拷贝期间反转了第二个子数组的顺序。现在两个子数组的当前位置从末端向内部，允许每个子数组的末端作为另一个的哨兵。与之前的实现不同，不需要测试检查其中一个子数组何时为空。这个版本还使用了插入排序来处理小子数组。\n\
  \n```cpp\ntemplate <typename E, typename Comp>\nvoid mergesort(E A[], E temp[],\
  \ int left, int right) {\n    if ((right-left) <= THRESHOLD) { // 小列表\n        inssort<E,Comp>(&A[left],\
  \ right-left+1);\n        return;\n    }\n    int i, j, k, mid = (left+right)/2;\n\
  \    mergesort<E,Comp>(A, temp, left, mid);\n    mergesort<E,Comp>(A, temp, mid+1,\
  \ right);\n    // 执行合并操作。\n    首先，将两个部分拷贝到 temp。\n    for (i=mid; i>=left; i--)\
  \ temp[i] = A[i];\n    for (j=1; j<=right-mid; j++) temp[right-j+1] = A[j+mid];\n\
  \    // 将子列表合并回 A\n    for (i=left,j=right,k=left; k<=right; k++)\n        if (Comp::prior(temp[i],\
  \ temp[j])) A[k] = temp[i++];\n        else A[k] = temp[j--];\n}\n```\n图 7.10 优化的\
  \ `Mergesort` 实现。\n\n尽管 `Mergesort` 是一个递归算法，但它的分析是非常直观的。合并部分消耗的时间为 $\\Theta(i)$，其中\
  \ $i$ 是正在合并的两个子数组的总长度。待排序数组被反复折半，直到达到大小为 1 的子数组，此时它们被合并为大小为 2，这些再被合并为大小为 4 的子数组，以此此类推，如图\
  \ 7.8 所示。因此，对于 $n$ 个元素，递归深度为 `log n`（简单地假设 $n$ 是 2 的幂）。递归的第一层可以被认为是处理一个大小为 $n$ 的数组，下一层处理两个大小为\
  \ $n/2$ 的数组，再下一层处理四个大小为 $n/4$ 的数组，以此此类推。递归底部有 $n$ 个大小为 1 的数组。因此，合并 $n$ 个大小为 1 的数组（总共需要\
  \ $\\Theta(n)$ 步）、$n/2$ 个大小为 2 的数组（同样总共需要 $\\Theta(n)$ 步）、$n/4$ 个大小为 4 的数组等。在 `log\
  \ n` 层递归的每一层中，都执行了 $\\Theta(n)$ 的工作，总成本为 $\\Theta(n \\log n)$。该成本不受排序值相对顺序的影响，因此该分析适用于最好、平均和最坏情况。\n\
  \n## 7.5 快速排序\n\n虽然 `Mergesort` 使用了最明显的分治形式（将列表一分为半然后对两半排序），但并不是我们分解排序问题的唯一方法。我们已经看到，使用数组实现时，`Mergesort`\
  \ 的合并步骤并不容易。所以也许不同的分治策略可能会变得更高效？\n\n`Quicksort`（快速排序）之名其实得归，因为在实现得当的情况下，它是平均情况下已知的最通用内存排序算法。它不需要\
  \ `Mergesort` 所需的额外数组，因此也具有空间效率。\n\n`Quicksort` 被广泛使用，通常是库排序程序（如 UNIX 的 `qsort`\
  \ 函数）实现的算法。有趣的是，`Quicksort` 受极差的最坏情况性能的影响，使其不适用于某些应用程序。\n\n在介绍 `Quicksort` 之前，请考虑一下使用二叉搜索树的实用性。你可以将所有值一个一个插入树中，然后使用中序遍历完成树。输出将形成有序列表。这种方法有很多缺点，包括二叉搜索树所需的额外空间以及插入节点的时间。然而，这种方法引入了一些有趣的想法。首先，二叉搜索树的根（即第一个插入的节点）将列表分为两个子列表：左树包含小于根的值，而右树包含大于或等于根的值。因此，二叉搜索树隐含地实现了“分治”方法。\n\
  \n`Quicksort` 首先选择一个值作为基值（概念上类似于二叉搜索树中的根值）。假设输入数组包含 $k$ 个小于基值的值。然后重新排列记录，使得小于基值的\
  \ $k$ 个值放在数组的左侧 $k$ 个位置，而大于或等于基值的值放在右侧 $n-k$ 个位置。这被称为数组的划分。给定划分内的值不需要（通常也不会）相互排序。只需要确保所有值都进入正确的划分。`Quicksort`\
  \ 然后继续排序基值两侧生成的子数组，一个大小为 $k$，另一个大小为 $n-k-1$。由于 `Quicksort` 是如此优秀的算法，在子数组上使用它是非常合适的。\n\
  \n```cpp\ntemplate <typename E, typename Comp>\nvoid qsort(E A[], int i, int j)\
  \ { // 快速排序\n    if (j <= i) return; // 不排序 0 或 1 个元素\n    int pivotindex = findpivot(A,\
  \ i, j);\n    swap(A, pivotindex, j);\n    // 将基值放在末尾\n}\n```\n`partition` 函数将记录移动到相应的划分中，然后返回\
  \ `k`，即右侧划分的起始。注意基值初始为。\n\n\n\n\n\n```cpp\n// k will be the first position in the\
  \ right subarray\nint k = partition<E,Comp>(A, i-1, j, A[j]);\nswap(A, k, j);\n\n\
  // Put pivot in place\nqsort<E,Comp>(A, i, k-1);\nqsort<E,Comp>(A, k+1, j);\n\n\
  }\n```\n\n**图 7.11** 快速排序的实现。\n\n位于数组末尾（位置 `j`）。因此，`partition` 不能影响数组位置 `j` 的值。分区后，基准值被放置在位置\
  \ `k`，这是它在最终排序数组中的正确位置。通过这样做，我们保证了至少有一个值（基准值）不会在 `qsort` 的递归调用中被处理。即使选择了一个糟糕的基准值，导致基准值的一侧产生完全空的划分，较大的划分也最多包含\
  \ $n - 1$ 个元素。\n\n选择基准值有多种方法。最简单的方法是使用第一个键。然而，如果输入是排序或逆逆排序的，这将导致糟糕的划分，使所有值都在基准值的一侧。最好随机选择一个值，从而减少不良输入顺序影响排序的概率。\n\
  \n遗憾的是，使用随机数生成器的开销相对较大，而我们可以通过选择数组的中间位置来实现几乎相同的效果。这里有一个简单的 `findpivot` 函数：\n\n```cpp\n\
  template <typename E>\ninline int findpivot(E A[], int i, int j)\n{ return (i+j)/2;\
  \ }\n```\n\n我们现在转向 `partition` 函数。如果我们预先知道有多少个键小于基准值，`partition` 只需要简单地将键值小于基准值的元素复制到数组的低端，将键值较大的元素复制到高端。由于我们无法预先知道有多少个键小于基准值，我们使用了一种聪明的算法，让索引从子数组的两端向内移动，并在必要时交换值，直到两个索引相遇。图\
  \ 7.12 显示了划分步骤的 C++ 实现。\n\n图 7.13 阐释了 `partition`。初始，变量 `l` 和 `r` 位于被划分子数组的实际边界之外。每层外部\
  \ `do` 循环都会使计数器 `l` 和 `r` 向内移动，直到它们最终相遇。\n\n注意，在内部 `while` 循环的每次迭代中，边界在与基准值进行比较之前就会移动。这确保了每个\
  \ `while` 循环都能取得进展，即使 `do` 循环最后一次迭代交换的两个值与基准值相等。还要注意第二个 `while` 循环中的检查 `r > l`。\n\
  \n第 7.5 节 快速排序\n\n247\n\n```cpp\ntemplate <typename E, typename Comp>\ninline int\
  \ partition(E A[], int l, int r, E& pivot) {\n    do {\n        // 边界向内移动直到它们相遇\n\
  \        while (Comp::prior(A[++l], pivot));\n        // l 向右移动\n        while ((l\
  \ < r) && Comp::prior(pivot, A[--r])); // r 向左\n        swap(A, l, r);\n       \
  \ // 交换不在位置的值\n    } while (l < r);\n    // 当它们相交时停止\n    return l;\n    // 返回右划分的第一位置\n\
  }\n```\n\n**图 7.12** 快速排序的划分实现。\n\nInitial\n72 6\n57 88 85 42 83 73 48 60\nl\nr\n\
  \nPass 1\n72 6\n57 88 85 42 83 73 48 60\nl\nr\n\nSwap 1\n48 6\n57 88 85 42 83 73\
  \ 72 60\nl\nr\n\nPass 2\n48 6\n57 88 85 42 83 73 72 60\nl\nr\n\nSwap 2\n48 6\n57\
  \ 42 85 88 83 73 72 60\nl\nr\n\nPass 3\n48 6\n57 42 85 88 83 73 72 60\nl,r\n\n**图\
  \ 7.13** 快速排序的划分步骤。第一行显示了十个键值的初始位置。基准值为 60，它已被交换到数组的末尾。`do` 循环进行了三次迭代，每次都使计数器 `l`\
  \ 和 `r` 向内移动，直到在第三次通过中相遇。最后，左划分包含四个值，右划分包含六个值。\n\n`qsort` 函数将基准值放置在位置 4。`partition`\
  \ 函数返回右划分的索引，以便确定 `qsort` 递归调用的子数组边界。图 7.14 显示了完整的快速排序算法。\n\n为了分析快速排序，我们首先分析在长度为\
  \ $k$ 的子数组上运行的 `findpivot` 和 `partition` 函数。显然，`findpivot` 耗时常数时间。`partition` 函数消耗线性时间。快速排序的总复杂度取决于划分的质量。在最坏的情况下，基准值始终是最小或最大的元素，导致大小为\
  \ $0$ 和 $n-1$ 的极不平衡的划分。这导致了递归方程 $T(n) = T(n-1) + O(n)$，其解为 $\\Theta(n²)$。这种最坏情况发生在输入已经是排序或逆排序的状态时。如果随机选择基准值，这种情况极不可能发生。当选择子数组的中间位置时，这种情况也不可能发生。快速排序不需要许多较好的划分就能运行得相当不错。\n\
  \n快速排序的最佳情况发生在 `findpivot` 总是将数组分成两个相等的部分时。快速排序重复地将数组拆分成更小的划分，如图 7.14 所示。在最好的情况下，结果将是\
  \ $\\log n$ 层的划分，顶层有一个大小为 $n$ 的数组，第二层有两个大小为 $n/2$ 的数组，下一层有四个大小为 $n/4$ 的数组，依此类推。因此，在每一层中，该层的所有划分步骤共执行\
  \ $n$ 次工作，当快速排序找到完美的基准值时，总成本为 $n \\log n$ 次工作。\n\n快速排序的平均情况行为处于最坏和最佳情况之间。平均情况分析考虑了所有可能的输入排列的成本，将成本求和并除以情况数。我们做一个合理的简化假设：在每个划分步骤中，基准值等可能落在（排序后的）数组中的任何位置。也就是说，基准值等可能将数组划分为大小为\
  \ $0$ 和 $n-1$、 $1$ 和 $n-2$ 的划分，依此类推。\n\n给定这一假设，平均情况成本从以下方程计算：\n\n$$T(n) = cn + \\\
  frac{1}{n} \\sum_{k=0}^{n-1} [T(k) + T(n - 1 - k)]$$\n\n$$T(0) = T(1) = c.$$\n\n\
  \n\n\n该方程是一个递归关系的形式。递归关系在第 2 章和第 14 章中讨论，而本方程将在第 14.2.4 节求解。该方程表示：有 `n` 分分之一的概率枢将数组分成大小为\
  \ 0 和 `n − 1` 的子数组，有 `n` 分分之一的概率将数组分成大小为 1 和 `n − 2` 的子数组，以此类推。表达式 `T(k) + T(n −\
  \ 1 − k)` 是对两个大小为 `k` 和 `n−1−k` 的数组进行两次快速排序递归调用的代价。\n\n初始的 `cn` 项是执行 `findpivot`\
  \ 和 `partition` 步骤的代价，其中 `c` 是某个常数。该递归关系的闭式解为 `Θ(n log n)`。\n\n因此，快速排序的平均情况代价为 `Θ(n\
  \ log n)`。\n\n这是一种不寻常的情况，平均情况代价和最坏情况代价的渐近增长率不同。考虑一下“平均情况”实际上意味着什么。我们通过对每个大小为 `n`\
  \ 的可能输入计算其运行时间代价乘以该输入出现的概率，并求和，来计算大小为 `n` 的输入的平均代价。为了简化问题，我们假设每种排列出现的概率相相等。因此，寻找平均值意味着对所有排列的代价求和并除以输入的数量（`n!`）。我们知道这些\
  \ `n!` 输入中某些的代价是 `O(n2)`。但所有排列的代价总和必须是 `(n!)(O(n log n))`。鉴于最坏输入的代价极高，它们的数量必然很少。事实上，代价为\
  \ `O(n2)` 的输入不可能是输入的常数比例。即使只有 1% 的输入代价为 `O(n2)`，也会导致平均代价变为 `O(n2)`。因此，随着 `n` 的增长，高代价输入的比例必须趋于零。我们可以得出结论：如果我们能避免那些极少数的坏输入排列，快速排序将会有良好的表现。\n\
  \n快速排序的运行时间可以改进（通过一个常数因子），并且许多研究致力于优化该算法。最明显的改进之处是 `findpivot` 函数。当枢轴未能很好地将数组分成等大小的子数组时，快速排序的最坏情况情况就会出现。如果我们愿意花费更多工作来寻找更好的枢轴，坏枢轴的影响就可以被减轻甚至消除。一种好的选择是使用“三数取中值”算法，该算法使用三个随机选取的值中的中间值作为枢轴。\n\
  \n使用随机数生成器来选择位置相对昂贵，因此一种常见的折中方案是查看当前子数组的第一个、中间和最后一个位置。然而，我们取中间值作为枢轴的简单 `findpivot`\
  \ 函数具有一个优点：它使得极不可能意外获得坏输入，而且实现起来非常廉。。这与选择第一个或最后一个元素作为枢轴形成鲜明对比，后者会对许多接近已排序或接近逆序排序的排列产生糟糕的性能。\n\
  \n通过意识到快速排序在 `n` 较小时速度较慢，可以获得显著的改进。如果我们在大多数时间里都在排序大数组，这似乎并不相关；而且在排序小数组的罕见情况下，快速排序花费多长时间也并不重要，因为它本身就很快。但你应该注意到，快速排序本身就排序了许多、许多小数组！这是分治治法的自然副产物。\n\
  \n一个简单的改进可能是对于小数字使用更快的排序算法替换快速排序，例如插入排序或选择排序。然而，有一种甚至更好——且更简单的优化。当快速排序的分区小于某个特定大小时，什么都不做！该分区内的值将是无序的。\n\
  \n然而，我们确实知道分区左侧的所有值都小于分区内的所有值。分区右侧的所有值都大于分区内的所有值。因此，即使快速排序只是将值移动到“接近”正确的位置，数组也将接近已排序状态。这是一个利用插入排序最优情况性能的理想状况。最后一步是单次调用插入排序来处理整个数组，将元素置于最终的排序顺序中。实证测试表明，每当子数组减少到九个或更少元素时，应让其保持无序。\n\
  \n最后一个需要考虑的加速方法是减少递归调用的代价。快速排序本质上是递归的，因为每次快速排序操作必须排序两个子列表。因此，没有简单的方法可以将快速排序转换为迭代算法。\n\
  \n然而，可以使用栈来实现模拟递归，因为必须存储的信息量很小。我们不需要存储子数组的副本，只需要子数组的边界。此外，如果注意快速排序递归调用的执行顺序，就可以保持较小的栈深。我们还可以将\
  \ `findpivot` 和 `partition` 的代码内联以消除剩余的函数调用。但请注意，通过上述建议不处理大小为九或更小的子列表，约四分之一的函数调用已经被消除了。因此，消除剩余的函数调用只会产生微不足道的加速。\n\
  \n## 7.6 堆排序\n\n我们对快速排序的讨论是从考虑使用二叉搜索树排序的实用性开始的。二叉搜索树比其他排序方法需要更多空间，由于插入值的相对开销，速度会比快速排序或合并排序慢。二叉搜索树还可能不平衡，导致\
  \ `Θ(n2)` 的最坏运行时间。二叉搜索树的平衡与快速排序的分区步骤密切相关。快速排序的枢轴的作用类似于根节点，即左分区（子树）存储小于枢轴的值，而右分区（子树）存储大于或等于枢轴的值。\n\
  \n基于更适用于目的树可以设计良好的排序算法。特别是，我们希望树是平衡的、空间高效且快速的。算法应该利用排序这一特殊应用的特性，即所有要存储的值在开始时就可用。这意味着我们不需要一个一个地向树插入值。\n\
  \n堆排序是基于第 5.5 节介绍的堆结构。堆排序具有上述的所有优点。完全二叉树是平衡的，其数组表示空间高效，我们可以一次性将所有值加载到树中，利用高效的 `buildheap`\
  \ 函数。堆排序的渐进性能在最好、平均和最情况下均为 `Θ(n log n)`。它在平均情况下没有快速排序快（通过常数因子），但堆排序在处理无法放入主内存的数据集时具有特别的用途，如第\
  \ 8 章所示。\n\n基于大堆的排序算法非常直观。首先，我们使用第 5.5 节的堆构建算法将数组转换为堆序。\n\n然后我们反复从堆中取出最大值，每次取出后恢复堆属性，直到堆为空。注意，每次我们从堆中移除最大元素时，它被放在数组的末尾。假设\
  \ `n` 个元素存储在数组位置 0 到 `n − 1` 中。从堆中移除最大值并重新调整后，该最大值现在被放在数组的 `n − 1` 位置。此时堆被认为\n\n\
  \n\n大小为 $n - 1$。移除新的最大值（根节点）会将次大值放置在数组的 $n - 2$ 位置。在依次移除剩余的每个值后，数组将从小到大顺序被正确排序。这就是为什么堆排序使用的是\
  \ `max-heap`（大堆）而不是预期的 `min-heap`（小堆）。图 7.15 展示了堆排序。完整的 C++ 实现如下：\n\n```cpp\ntemplate\
  \ <typename E, typename Comp>\nvoid heapsort(E A[], int n) { // Heapsort\n    E\
  \ maxval;\n    heap<E,Comp> H(A, n, n);\n    // Build the heap\n    for (int i=0;\
  \ i<n; i++)\n        // Now sort\n        maxval = H.removefirst();\n        //\
  \ Place maxval at end\n    }\n}\n```\n\n由于构建堆需要 $\\Theta(n)$ 的时间（见第 5.5 节），并且删除\
  \ $n$ 次最大元素每次都需要 $\\Theta(\\log n)$ 的时间，我们看到整个堆排序操作在最坏、平均和最好情况下都需要 $\\Theta(n \\\
  log n)$ 的时间。\n\n虽然堆排序通常比快速排序慢一个常数倍，但它与目前研究的其他排序算法相比有一个特殊优势。构建堆相对廉价，只需要 $\\Theta(n)$\
  \ 的时间。从堆中移除最大元素需要 $\\Theta(\\log n)$ 的时间。因此，如果我们想找到数组中最大的 $k$ 个元素，我们可以在 $\\Theta(n\
  \ + k \\log n)$ 时间内完成。如果 $k$ 较小，这比之前描述的其他排序方法找到 $k$ 个最大元素所需的时间有了显著的改进（其中许多方法需要先对整个数组进行排序）。我们能够利用这一概念的一种情况是第\
  \ 11.5.2 节中 Kruskal 最小生成树（MST）算法的实现。该算法要求按升序访问边（因此，使用 `min-heap`），但该过程一旦 MST 完成就会立即停止。因此，只需要对相对较小比例的边进行排序。\n\
  \n## 7.7 桶排序与基数排序\n\n想象一下在过去的一年里，当你支付各种账单时，只是简单地将所有纸质堆在某个桌子的顶部。现在一年结束了，是时候根据账单用途（电话、电、房租等）和日期对这些纸张进行排序了。一种自然的方法是在地板上腾出空间，在你处理这堆纸时，将电话账单放在一堆，电费账单放在另一堆，以此此类推。一旦完成这些账单到堆的初始分配（只需一次），你就可以相对快速地按日期对每个堆进行排序，因为每个堆都相当较小。这就是桶排序（Binsort）的基本思想。\n\
  \n第 3.9 节展示了以下代码片段，用于对 $0$ 到 $n-1$ 的数字排列排序：\n\n```cpp\nfor(i=0; i<n; i++)\n    B[A[i]]\
  \ = A[i];\n```\n\n**图 7.15** 堆排序示意图。第一行显示原始顺序中的值。第二行显示构建堆之后的值。第三行显示了对键值 88 执行第一次\
  \ `removefirst` 操作的结果。\n\n注意 88 现在位于数组的末尾。第四行显示了对键值 85 执行第二次 `removefirst` 操作的结果。第五行显示了对键值\
  \ 83 执行第三次 `removefirst` 操作的结果。此时，数组的最后三个位置持有按排序的三个最大值。堆排序以这种方式继续，直到整个数组排序完毕。\n\n\
  ```cpp\ntemplate <typename E, class getKey>\nvoid binsort(E A[], int n) {\n    List<E>\
  \ B[MaxKeyValue];\n    E item;\n    for (int i=0; i<n; i++) \n        B[A[i]].append(getKey::key(A[i]));\
  \ \n    for (int i=0; i<MaxKeyValue; i++)\n        for (B[i].setStart(); item =\
  \ B[i].next())\n            output(item);\n}\n```\n\n**图 7.16** 扩展的桶排序算法。在这里，键值被用于将记录分配到桶中。这是桶排序最基本的示例，其中键值用于确定在\
  \ `B` 中的位置。该算法极其高效，无论实际持有多少记录，都需要 $\\Theta(n)$ 的时间。这比我们目前见过的任何排序算法都要好得多。\n\n最简单的扩展是允许桶排序更具实用性。我们进一步假设记录使用名为\
  \ `getKey` 的模板类。这可以通过将 `B` 变成一个链表数组来实现。通过这种方式，任何键值为 $i$ 的记录都可以放在 `B[i]` 中。扩展的桶排序如图\
  \ 7.17 所示。\n\n第二个扩展允许对键范围大于 $n$ 的进行桶排序。所需的总工作量只需将每个记录放入适当的桶中，然后从桶中取出所有记录。因此，我们需要处理每条记录两次，花费\
  \ $\\Theta(n)$ 的工作。\n\n遗憾的是，这个分析中存在一个关键的疏漏。桶排序还查看每个桶以看它是否包含记录。如果 `KeyValue` 相对于\
  \ $n$ 较小，那么这不是一个很大的开销。假设 `MaxKeyValue = n²`。在这种情况下，完成的总工作将是 $\\Theta(n + n²) = \\\
  Theta(n²)$。这导致了一个糟糕的排序算法，并且随着 $n$ 和 `KeyValue` 之间差异增大，算法会变得更加糟糕。\n\n**图 7.17** 十进制下十二个两位数的基数排序示例。需要两次处理来排序列表。\n\
  \n一个巨大的键范围需要一个不可接受的大数组 `B`。因此，即使是扩展的桶排序也仅适用于有限的键范围。\n\n桶排序的进一步泛化产生了桶排序（Bucket Sort）。每个桶关联的不仅是一个键值，而是一个键值范围。桶排序将记录分配到桶中，然后依赖其他排序技术来对每个桶内的记录进行排序。希望相对廉价的分桶过程会在每个桶中只放入少量的记录，这样桶内的“清理排序”就会变得相对廉价。\n\
  \n\n\n\n有一种方法可以在保持桶（bins）数量和相关处理较小的同时，允许清理排序基于分桶排序（Binsort）。考虑一组键值范围在 0 到 99 之间的记录序列。如果我们有十个可用桶，首先可以通过对键值对\
  \ 10 取模将记录分配到桶中。因此，每个键都将分配到与其右侧位数字相匹配的桶中。然后我们可以按照顺序从桶中取出这些记录，并根据它们的左侧位（十位）数字将其重新分配到桶中（定义\
  \ 0 到 9 范围内的数值左侧位为 0）。换句话说，使用公式 `A[i]/10` 将数组 `A` 中的第 `ith` 条记录分配到一个桶中。如果我们现在按顺序从桶中收集这些值，结果就是一个有序列表。图\
  \ 7.17 展示了这一过程。\n\n256\n\n第 7 章 内部排序\n\n```cpp\ntemplate <typename E, typename getKey>\n\
  void radix(E A[], E B[], int n, int k, int r, int cnt[]) {\n    // cnt[i] stores\
  \ number of records in bin[i]\n    int j;\n    for (int i=0, rtoi=1; i<k; i++, rtoi*=r)\
  \ { // For k digits\n        for (j=0; j<r; j++) cnt[j] = 0;\n        // Initialize\
  \ cnt\n        // Count the number of records for each bin on this pass\n      \
  \  for (j=0; j<n; j++) cnt[(getKey::key(A[j])/rtoi)%r]++;\n        // Index B: cnt[j]\
  \ will be index for last slot of bin j.\n        for (j=1; j<r; j++) cnt[j] = cnt[j-1]\
  \ + cnt[j];\n        // Put records into bins, work from bottom of each bin.\n \
  \       // Since bins fill from bottom, j counts downwards\n        for (j=n-1;\
  \ j>=0; j--)\n            B[--cnt[(getKey::key(A[j])/rtoi)%r]] = A[j];\n       \
  \ for (j=0; j<n; j++) A[j] = B[j];\n        // Copy B back to A\n    }\n}\n```\n\
  \n**图 7.18** 基数排序算法。\n\n在这个示例中，我们有 `r = 10` 个桶和 `n = 12` 个范围在 0 到 `r² - 1` 之间的键。\n\
  \n总计算量为 $\\Theta(n)$，因为我们对每个记录和每个桶都查看常数次。这对于简单的分桶排序是一个巨大的改进，在分桶排序中，桶的数量必须与键范围一样大。注意，示例使用了\
  \ `r = 10` 以便桶的计算易于可视化：记录首先根据右侧位后根据左侧位数字的值放入桶中。任何数量的桶都可以工作。这是基数排序（Radix Sort）的一个示例，之所以这样命名是因为桶的计算是基于键值的基数（radix）。这种排序算法可以扩展到任何键范围内的任意数量的键。我们只需要根据从右侧位到左侧位的键的位值将记录分配到桶中。如果有\
  \ `k` 位，则我们需要将键分配 `k` 次桶。\n\n与归并排序（Mergesort）一样，实现一个高效的基数排序有些困难。特别是，我们更倾向于对一个值数组进行排序并避免处理链表。如果我们知道每个桶中有多少值，则可以使用一个大小为\
  \ `r` 的辅助数组来存放桶。例如，如果在第一轮中，0 桶将接收三条记录，1 桶将接收五条记录，我们可以简单地为 0 桶留前三个数组位置，为 1 桶留接下来的五个数组位置。图\
  \ 7.18 的 C++ 实现正是采用了这种方法。在每一轮结束时，记录会被复制回原始数组。\n\n第 7.7 节 分桶排序与基数排序 257\n\n第一个内部\
  \ `for` 循环初始化数组 `cnt`。第二个循环计算分配到每个桶的记录数。第三个循环将 `cnt` 中的值设置为它们在数组 `B` 中的正确索引。注意存储在\
  \ `cnt[j]` 中的索引是桶 `j` 的最后一个索引；桶从高索引到低索引填充。第四个循环将记录分配到桶中（在数组 `B` 中）。最后一个循环简单地将记录复制回数组\
  \ `A`，为下一轮迭代做准备。变量 `rtoi` 存储 `ri`，用于第 `i` 次迭代中的桶计算。图 7.19 显示了该算法如何处理图 7.17 所示的输入。\n\
  \n该算法需要对基为 `r` 的 `n` 个数列表进行 `k` 轮处理，每轮执行 $\\Theta(n + r)$ 的工作。因此总工作量为 $\\Theta(nk\
  \ + rk)$。在 `n` 方面这意味着什么？因为 `r` 是基的大小，它可能相当小。\n\n可以使用基 2 或 10。基 26 适用于排序字符字符串。目前，我们将\
  \ `r` 视为常数值，并在确定渐近复杂度时忽略它。变量 `k` 与键的范围有关：它是键在基 `r` 下可能拥有的最大位数。在某些应用中，我们可以确定 `k`\
  \ 是有限大小的，因此可能希望将其视为常数。\n\n在这种情况下，实现一个高效的基数排序有些困难。特别是，我们更倾向于对一个值数组进行排序并避免处理链表。如果我们知道每个桶中有多少值，则可以使用一个大小为\
  \ `r` 的辅助数组来存放桶。例如，如果在第一轮中，0 桶将接收三条记录，1 桶将接收五条记录，我们可以简单地为 0 桶留前三个数组位置，为 1 桶留接下来的五个数组位置。图\
  \ 7.18 的 C++ 实现正是采用了这种方法。在每一轮结束时，记录会被复制回原始数组。\n\n\n\n\n第 7 到 10 个位置将存储桶 7 的四个键值。第\
  \ 4 行显示了基数排序（Radix Sort）第一次迭代的结果。第 5 到 7 行显示了第二次迭代的相应步骤。\n\n### 7.8 排序算法的实证比较\n\n\
  32 位键。当然，这需要一个大小为 64K 的 `cnt` 数组。只有当记录数接近或大于 64K 时，性能才会良好。换句话说，为了使基数排序高效，记录数相对于键的大小来说必须是足够大的。在许多排序应用中，基数排序可以这样调优以获得这种性能。\n\
  \n基数排序取决于根据数字位值进行固定次数多路选择的能力，以及对数据桶（bins）的随机访问。因此，对于某些类型的键，基数排序可能难以实现。例如，如果键是实数或任意长度的字符串，那么在实现时就需要特别注意。特别是，基数排序需要小心判断何时找到“最后一位数字”，以区分实数，或变长度字符串中的最后一个字符。使用字典树（trie）数据结构（第\
  \ 13.1 节）来实现基数排序的概念最适合这些情况。\n\n此时，敏锐的读者可能会开始质疑我们之前的假设，即键的比较需要常数时间。如果键是存储在（例如整数变量中的“普通整数”值，那么这个变量的大小相对于\
  \ $n$ 有有多大呢？事实上，对于任何实际计算，32（标准 `int` 变量的位数）大于 `log n` 几乎是肯定的。从这个意义上说，比较两个长整数需要 `Ω(log\
  \ n)` 的工作。\n\n计算机通常以特定大小的单位进行算术运算，例如特定大小。只有当记录数接近或大于 64K 时，性能才会良好。换句话说，为了使基数排序高效，记录数相对于键的大小来说必须是足够大的。在许多排序应用中，基数排序可以这样调优以获得这种性能。\n\
  \n基数排序取决于根据数字位值进行固定次数多路选择的能力，以及对数据桶的随机访问。因此，对于某些类型的键，基数排序可能难以实现。例如，如果键是实数或任意长度的字符串，那么在实现时就需要特别注意。特别是，基数排序需要小心判断何时找到“最后一位数字”，以区分实数，或变长度字符串中的最后一个字符。使用字典树（trie）数据结构（第\
  \ 13.1 节）来实现基数排序的概念最适合这些情况。\n\n此时，敏锐的读者可能会开始质疑我们之前的假设，即键的比较需要常数时间。如果键是存储在（例如整数变量中的“普通整数”值，那么这个变量的大小相对于\
  \ $n$ 有有多大呢？事实上，对于任何实际计算，32（标准 `int` 变量的位数）大于 `log n` 几乎是肯定的。从这个意义上说，比较两个长整数需要 `Ω(log\
  \ n)` 的工作。\n\n计算机通常以特定大小的单位进行算术运算，例如特定大小。只有当记录数接近或大于 64K 时，性能才会良好。换句话说，为了使基数排序高效，记录数相对于键的大小来说必须是足够大的。在许多排序应用中，基数排序可以这样调优以获得这种性能。\n\
  \n### 排序算法的实证比较\n\n哪种排序算法最快？渐进分析无法告诉我们对于较小列表哪种算法最好。渐进分析无法区分 $O(n)$ 和 $O(n \\log\
  \ n)$ 算法。对于这些问题，我们可以转向实证测试。**排序**\n\n| | 10 | 100 | 1K | 10K | 100K | 1M |\n| :---\
