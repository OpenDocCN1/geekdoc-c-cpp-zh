  \n### 6.6 在此项目中，你将运行一些实验测试，以确定路径压缩变变会导致改进性能。你需要比较以下五种实现：\n\n(a) 带有路径压缩和加权合并的标准 `UNION/FIND`。\n\
  (b) 路径压缩和加权合并，但路径压缩是在 `UNION` 之后而不是 `FIND` 操作期间进行的。即让两棵树中遍历的所有节点直接指向较大树的根。\n(c)\
