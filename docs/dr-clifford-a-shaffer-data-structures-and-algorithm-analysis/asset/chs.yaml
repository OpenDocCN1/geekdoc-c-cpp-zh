  # 算法分析\n\n一旦我们完成计划中的合并，处理公司薪资需要多久？我应该从供应商 X 还是供应商 Y 购买新的薪资程序？如果某个特定程序运行很慢，是因为它实现不好，还是因为它在解决一个棘手的问题？\n\
  \n这类问题要求我们考虑问题的难度，或者解决该问题的两种或多种方法之间的相对效率。\n\n本章介绍了算法分析的动机、基本符号和基础技术。我们关注一种被称为渐近算法分析（或简称渐近分析）的方法。渐近分析试图估计算法的资源消耗。它允许我们比较解决问题的两个或多个算法的相对成本。渐近分析还为算法设计者提供了一个工具，用于在实现实际程序之前估计所提解决方案是否可能满足问题的资源限制。读完本章后，你应该理解：\n\
  \n- 增长率的概念，即算法成本随输入规模增大而增长的速率；\n- 增长率的上界和下界的概念，以及如何为简单的程序、算法或问题估算这些界限；\n- 算法（或程序）的成本与问题成本之间的区别。\n\
  \n本章最后简要讨论了在实证测量程序成本时遇到的实际困难，以及提高程序效率的代码调优原则。\n\n## 3.1 引言\n\n我们如何从效率的角度来比较解决某个问题的两种算法？我们可以将两种算法都实现为计算机程序，然后在适当的输入范围内运行它们，测量每个程序所使用的资源量。这种方法由于以下四个原因，通常是不如人意的：\n\
  \n首先，即使我们只想保留其中一个，但编写和测试两种算法也需要投入精力。其次，在实证比较两种算法时，总是存在一个程序写得比另一个更好的可能，因此底层算法的真实质量无法通过其实现来体现。当编程人员对算法产生偏见时，这种情况很容易发生。第三，实证测试用例的选择可能会不公平地有利于某一个算法。第四，你可能会发现即使两种算法中更好的一个也不符合你的资源预算。在这种情况下，你必须使用实现新算法重新开始整个过程。但是，你如何知道是否有算法可以满足资源预算呢？\n\
  \n通过渐近分析通常可以避免这些问题。渐近分析衡量算法（或其程序实现）在输入规模变大时的效率。它实际上是一种估计技术，并不告诉我们两个总是比另一个快一点的程序之间的相对优劣。然而，对于必须确定特定算法是否值得考虑实现的计算机科学家来说，渐近分析已被证明非常有用。\n\
  \n\n\n\n\n程序关键的资源通常是其运行时间。然而，你不能仅仅关注运行时间。你必须考虑其他因素，例如运行程序所需的空间（包括主内存和磁盘空间）。通常，你会分析算法（或以程序形式实例化的算法）所需的时间，以及数据结构所需的空间。\n\
  \n许多因素会影响程序的运行时间。某些因素与程序编译和运行的环境有关。这些因素包括计算机 CPU、总线和外围硬件的速度。与其他用户竞争计算机（或网络）资源可能会导致程序运行得像牛爬一样。\n\
  \n编程语言以及特定编译器生成的代码质量也会产生显著影响。将算法转换为程序的编程人员的“编码效率”也会产生巨大影响。\n\n如果你需要在特定的计算机上让一个程序在时间和空间限制内正常运行，那么所有这些因素都可能是相关的。然而，这些因素中没有一个能够说明两个算法或数据结构之间的差异。公平起见，从解决同一个问题的两个算法推导出的程序，应该使用相同的编译器编译，并在相同的计算机、在相同的条件下运行。在可能的情况下，对每个程序的编程工作应投入同等的精力，以使实现达到“同等高效”。\n\
  \n### 第 3.1 节 引言\n\n从这个意义上说，上述所有因素都应该在比较中抵消，因为它们对两种算法都是平等的。\n\n如果你真正想理解算法的运行时间，还有其他比机器速度、编程语言、编译器等更适合考虑的因素。理想情况下，我们会在标准基准测试条件下测量算法的运行时间。然而，我们没有办法通过在计算机上运行算法实现来可靠地计算运行时间。唯一的替代方案是使用其他指标作为运行时间的替代。\n\
  \n估计算法性能时首要考虑的因素是算法处理特定规模输入所需的基本操作次数。“基本操作”和“规模”这两个术语都相当模糊，取决于所分析的算法。规模通常是所处理的输入数量。例如，在比较排序算法时，问题规模通常通过待排序记录的数来衡量。基本操作必须具有这样一个属性：其完成时间不取决于操作数的特定值。在大多数编程语言中，相加或比较两个整数变量是基本操作示例。求和包含\
  \ `n` 个整数的数组内容并不是基本操作，因为开销取决于 `n` 的值（即输入规模）。\n\n**示例 3.1** 考虑一个简单的算法，用于解决在 `n` 个整数的数组中寻找最大值的问题。该算法逐个查看每个整数，保存为止发现的最大值的位置。这种算法被称为最大值顺序搜索，并如下函数所示：\n\
  \n```cpp\n// 返回大小为 \"n\" 的数组 \"A\" 中最大值的位置\nint largest(int A[], int n) {\n    int\
  \ currlarge = 0; // 存储最大元素的位置\n    for (int i=1; i<n; i++) {\n        // 对于每个数组元素\n\
  \        if (A[currlarge] < A[i]) // 如果 A[i] 更大\n            currlarge = i;\n  \
  \      // 记住它的位置\n    }\n    return currlarge; // 返回最大值位置\n}\n```\n\n在这里，问题的规模是\
  \ `A.length`，即存储在数组 `A` 中的整数数量。基本操作是将整数的值与为止发现的最大值进行比较。可以合理地假设进行这样一次比较需要固定的时间，无论这两个整数的值或它们在数组中的位置如何。\n\
  \n由于影响运行时间的最因素通常是输入的规模，因此对于给定的输入规模 `n`，我们通常将运行算法的时间 `T` 表示为 `n` 的函数，写为 `T(n)`。我们始终假设\
  \ `T(n)` 是非负值。\n\n让我们称 `c` 为函数 `largest` 中比较两个整数所需的时间。我们现在不关心 `c` 的精确值是多少。我们也不关心增加变量\
  \ `i` 所需的时间（因为这必须对数组中的每个值执行一次），或者在发现更大值时实际赋值所需的时间，或者是初始化 `currlarge` 所花费的少量额外时间。我们只需要对执行算法所需的时间的一个合理近似值。因此，运行\
  \ `largest` 的总时间约为 `cn`，因为我们必须进行 `n` 次比较，每次比较耗费 `c` 时间。我们说函数 `largest`（并泛指到任何典型实现的最大值顺序搜索算法）的运行时间由等方程表示：\n\
  \n`T(n) = cn`\n\n该方程描述了最大值顺序搜索算法运行时间的增长率。\n\n**示例 3.2** 将整数数组第一个值赋值给变量的语句的运行时间仅仅是复制数组第一个元素值所需的时间。我们可以假设这种赋值无论值如何，都花费固定的时间。让我们称\
  \ `c1` 为复制一个整数所需的时间。无论在典型计算机上的数组有多大（在内存和数组规模的合理条件下），从数组第一个位置复制值的时间始终是 `c1`。因此，该算法的方程简单为\n\
