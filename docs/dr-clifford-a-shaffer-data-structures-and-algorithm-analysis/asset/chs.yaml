  \n9.3 实现第 9.2 节中描述的文本压缩系统。\n\n9.4 实现一个用于管理文档检索的系统。你的系统应该具备向系统插入（文档的抽象引用）、将关键词与给定的文档关联、以及根据指定关键词搜索文档的能力。\n\
  \n9.5 使用桶散列法（bucket hashing）实现一个存储在磁盘上的数据库。定义记录长度为 128 字节，包含 4 字节的键和 120 字节的数据。剩余的\
