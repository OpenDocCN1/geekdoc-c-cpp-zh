  ### 7.11 修改快速排序以找到记录数组中最小的 `k` 个。你的输出应该是修改后的数组，使得 `k` 个最小值排序在数组的前 `k` 个位置上。你的算法应该执行最少的工作，即不应该排序不必要的数组部分。\n\
  \n### 7.12 修改快速排序以对一序列连续存储在字符数组中的变长字符串序列进行排序，使用第二个数组（存储指向字符串的指针）来索引字符串。你的函数应该修改索引数组，使得第一个指针指向值最小字符串的开头，依此类推。\n\
  \n### 7.13 在 `1 ≤ n ≤ 1000` 范围内绘制 `f1(n) = n log n`、`f2(n) = n1.5` 和 `f3(n) = n2`，以直观地比较它们的增长率。通常，插入排序实现的运行时间表达式中的常数因子将小于壳排序或快速排序的常数因子。当\
  \ `n = 1000` 时，壳排序的常数因子比插入排序大可以大多少倍？当 `n = 1000` 时，快速排序的常数因子比插入排序大可以大多少倍？\n\n###\
  \ 7.14 假设存在一个算法 `SPLITk`，它可以将包含 `n` 个元素的列表 `L` 分为 `k` 个子列表，每个子列表包含一个或多个元素，使得对于 `i\
  \ < j <= k`，子列表 `i` 只包含值小于子列表 `j` 中所有元素的元素。如果 `n < k`，则 `k − n` 个子列表为空，其余的长度为 1。假设\
  \ `SPLITk` 的时间复杂度为 `O(length of L)`。\n\n此外，假设这 `k` 个列表可以在数时间内再次合并。考虑以下算法：\n\n```java\n\
  List SORTk(List L) {\n  List sub[k]; // 用于存放子列表\n  if (L.length() > 1) {\n    SPLITk(L,\
  \ sub); // SPLITk 将子列表放入 sub\n    for (i=0; i<k; i++) {\n      sub[i] = SORTk(sub[i]);\
  \ // 排序每个子列表\n    }\n    L = concatenation of k sublists in sub;\n    return L;\n\
  \  }\n}\n```\n\n(a) `SORTk` 的最坏情况渐近运行时间是多少？为什么？\n\n(b) `SORTk` 的平均情况渐近运行时间是多少？为什么？\n\
  \n### 7.15 这是一个排序的变体。问题是按大小对 `n` 个螺母和 `n` 个螺钉进行排序。假设集合中的每个螺钉都有一个大小相同的对应螺母，但最初我们不知道哪一个螺母对应哪个螺钉。两个螺母之间或两个螺钉之间的尺寸差异可能小到肉眼无法察觉，因此你不能直接依赖比较两个螺母或两个螺钉的大小。相反，你只能通过尝试将一个螺母拧入另一个螺钉来比较它们的大小（假设这种比较是常数时间操作）。此操作告诉你螺母比螺钉大、螺钉比螺母大，或者它们的大小相同。在最坏情况下，排序螺母和螺钉最少需要多少次比较？\n\
  \n### 7.16\n(a) 设计一个算法来排序三个数字。它应该尽量减少比较。在最好、最坏和平均情况下，需要多少次交换？\n\n(b) 设计一个算法来排序五个数字。它应该尽量减少比较。在最好、最坏和平均情况下，需要多少次交换？\n\
  \n(c) 设计一个算法来排序八个数字。它应该尽量减少比较。在最好、最坏和平均情况下，需要多少次交换？\n\n### 7.17 设计一个高效算法对一组范围在 0\
  \ 到 30,000 之间的数字进行排序。没有重复值。内存要求最低。\n\n### 7.18 以下操作最好通过先对数字排序来实现？对于每个操作，简要描述实现它的算法并说明算法的渐近复杂度。\n\
  \n(a) 寻找最小值。\n(b) 寻找最大值。\n(c) 计算算术平均值。\n(d) 寻找中位数（中间值）。\n(e) 寻找众数（出现次数最多的值）。\n\n\
  ### 7.19 考虑一种递归合并排序实现，对于小于阈值的子列表调用插入排序。如果有 `n` 次合并排序调用，会有多少次插入排序调用？为什么？\n\n### 7.20\
  \ 为输入链表的情况实现合并排序。\n\n### 7.21 计数排序（假设输入键值为 0 到 `m − 1` 范围内的整数）通过第一次遍历统计每个键值记录的数量，然后利用这些信息在第二遍历中按顺序放置记录。编写计数排序的实现（参考基数排序获取一些思路）。为了使这种方法有效，对于\
  \ `m` 和 `n` 的相对值我们可以说明什么？如果 `m < n`，该算法的运行时间是多少？\n\n### 7.22 使用类似于第 7.9 节中给出的参数，证明在包含\
  \ `n` 个元素的排序数组中搜索给定值的 `log n` 是最坏情况的下界。\n\n### 7.23 快速排序划分步骤的一种更简单的方法是将索引 `split`\
  \ 设置为第一个大于基值的位置。然后从位置 `split+1` 开始让另一个索引 `curr` 向右移动直到找到一个小于基值的值。交换 `split` 和 `next`\
  \ 处的值，并增加 `split`。继续这种方式，将较小的值交换到左侧。当 `curr` 到达子数组末尾时，`split` 将位于两个之间的分割点。遗憾的是，这种方法所需的交换次数比第\
  \ 7.5 节介绍的版本多，导致实现速度较慢。给出一个例子并解释原因。\n\n\n\n\n\n## 7.1 冒泡排序\n冒泡排序的一种改进方法是添加一个标志变量和一个测试，用于判断在当前迭代中是否发生了交换。如果没有发生交换，则说明列表已经排序，因此算法可以提前停止。这使得最坏情况性能变为\
  \ `O(n)`（因为如果列表已经排序，那么在第一轮遍历中将不会发生任何迭代，排序将在此停止）。\n\n修改冒泡排序实现以添加此标志和测试。在范围输入范围内比较修改后的实现，以其在实践中是否改进了性能。\n\
  \n## 7.2 双向插入排序\n双向插入排序是插入排序的一种变体，从数组中间向外进行。在每次迭代中，数组的中间部分会被排序。在下一次迭代中，取与已排序部分的两个相邻元素。如果它们之间的顺序不对，则交换它们。现在，只要左侧元素大于右侧元素，就将其在数组中向右推；只要右侧元素小于左侧元素，就将其在数组中向左推。\n\
  \n如果数组长度为偶数，算法从处理中间的两个元素开始。如果数组长度为奇数，则跳过中间元素，从处理其紧左和紧右的元素开始。\n\n首先，解释双向插入排序与标准插入排序相比的代价是多少以及为什么。（注意，当前迭代中处理的两个元素在初始交换以使其相互排序后，在被推入排序位置时是无法交叉的。）然后，实现双向插入排序，注意正确处理数组为奇数和偶数的两种情况。在实践中将其运行时间与标准插入排序进行比较。最后，解释这种加速可能如何影响快速排序实现的阈值水平和运行时间。\n\
  \n## 7.3 希插入排序\n使用不同的增量对希插入排序进行研究。将第 7.3 节所示的版本（每次增量是前一次的一半）与其他版本进行比较。特别是，尝试实现“除以\
  \ 3”，即对于长度为 `n` 的列表，增量将为 `n/3`、`n/9` 等。其他增量方案同样有效吗？\n\n## 7.4 合并排序\n第 7.4 节给出的合并排序实现以数组作为输入并对该数组进行排序。在第\
  \ 7.4 节开头，有一个使用合并排序对链表的简单伪代码实现。分别实现基于链表的合并排序和基于数组的合并排序，并比较它们的运行时间。\n\n## 7.5 快速排序优化\n\
  从本章给出的快速排序 C++ 代码开始，编写一系列快速排序实现，在广泛的输入数据规模上测试以下优化。尝试这些优化的各种组合，以开发出你所能的最快的快速排序实现。\n\
  \n(a) 在选择基准值时查看更多值。\n\n(b) 当列表大小低于给定阈值时，不要对 `qsort` 进行递归调用，而是使用插入排序来完成排序过程。测试不同数值的阈值大小。\n\
  \n(c) 使用栈和内联函数来消除递归。\n\n## 7.6 堆排序优化\n有人提议，通过修改堆的 `siftdown` 函数可以优化堆排序。将正在向下下沉的值命名为\
  \ `X`。`siftdown` 每一层进行两次比较：首先比较 `X` 的子节点，然后将胜出者与 `X` 比较。如果 `X` 太小，则与较大的子节点交换并重复该过程。建议的优化方案消除了对\
  \ `X` 的测试。相反，较大的子节点会自动替换 `X`，直到 `X` 到达堆的底部。此时，`X` 可能太大而无法留在该位置。这通过反复比较 `X` 与其父节点并在需要时交换以将其“泡”到正确的层级来纠正。该说法是，这个过程将节省多次比较，因为大多数节点在向下下沉时最终都会位于树的底部。实现两个版本的\
  \ `siftdown`，并进行经验研究以比较它们的运行时间。\n\n## 7.7 基数排序\n基数排序通常实现为仅支持 2 的幂基数。这允许将基数直接转换为整数键值中的某些位数。例如，如果基数是\
  \ 16，那么 32 位键将分 8 步处理，每步 4 位。这可以导致更高效的实现，因为位移操作可以替代第 7.7 节实现中的除法操作。重新实现第 7.7 节给出的基数排序代码，使用位移代替除法。比较新旧基数排序实现的运行时间。\n\
  \n## 7.8 排序集合\n编写你自己的排序程序集合来实现本章描述的算法，并比较它们的运行时间。确保实现优化版本，并尝试让每个程序尽可能快。\n\n你得到与图\
  \ 7.20 所示相同的相对计时结果吗？如果不是，你认为为什么会这样？你的结果与同学的结果相比如何？这说明了进行经验计时研究的困难性有多大？\n\n# 8 文件处理与外部排序\n\
  \n早前的章节介绍了操作存储在主内存中的数据的基本数据结构和算法。某些应用程序需要存储和处理大量信息——信息量大到无法全部装入主内存。在这种情况下，信息必须驻在磁盘上，并选择性地调入主内存进行处理。\n\
  \n你可能已经意识到访问主内存的速度远快于访问磁盘或其他存储设备上的数据。访问时间的相对差异巨大，以至于高效的磁盘程序需要与大多数程序员习惯的方法不同的。\n\n\
  本章介绍了与磁盘应用程序算法和数据结构设计相关的基本问题。我们从描述主内存与辅助存储之间的显著差异开始。\n\n8.2 节讨论了磁盘驱动器的物理方面。8.3 节介绍了缓冲池的基本方法。8.4\
  \ 节讨论了磁盘存储数据随机访问的 `C++` 模型。8.5 节讨论了无法放入主内存的大型集合排序的基本原理。\n\n## 8.1 主存储与辅助存储\n计算机存储设备通常分为主存储（主内存）和辅助存储（外围存储）。主内存通常指\
  \ RAM 计算机技术变化迅速。我提供了一些磁盘驱动器规格和其他硬件性能数据，这些数据在本书时是相当新的。当你阅读时，这些数字可能已经过时。然而，基本原理没有改变。内存与磁盘之间时间、空间和成本的近似比例在\
  \ 20 多年前保持着惊人的稳定。\n\n**图 8.1** 常用可写电子数据存储介质的价格比较表。单位为美元/MB。\n\n\n\n\n访问内存（`RAM`），而次级存储指的是硬盘、固态硬盘、可移动\
  \ “USB” 驱动器、CD 和 DVD 等设备。主存还包括寄存器、缓存和显存，但我们在讨论中将忽略它们，因为它们的存在并不影响主存与次级存储之间的主要区别。\n\
  \n随着 CPU 速度的提高，每个新款电脑似乎配备了更多的主内存。随着内存容量不断增加，相对缓慢的磁盘存储会变得不再必要吗？可能不会，因为存储和处理更大文件的需求增长至少与内存容量增长一样快。如图\
  \ 8.1 所示，主内存和外存储设备的价格在近年来大幅下降。然而，硬盘驱动存储的单位成本仍比 `RAM` 低两个数量级，且多年以来如此。\n\n现在有多种广泛的可移动介质，可以相对安全地传输数据或离线存储数据。这些包括软盘（现已很大过时）、可写式\
  \ CD 和 DVD、“闪存”驱动器和磁带。`CDs` 和 `DVDs` 等光存储器的每兆字节成本大约是硬盘空间的一半，在过去几年中已成为作为备份存储的实用选择。磁带曾比其他介质便宜得多，并是备份的首选手段，但随着其他介质价格下降，现在已不再那么流行了。“闪存”驱动器的每兆字节成本最高，但由于其存储容量和灵活性，它们迅速取代了软盘，成为在无法进行直接网络传输时在计算机间传输数据的主要存储设备。\n\
  \n次级存储设备相比 `RAM` 内存至少还有两个优点。最重要的是，磁盘、“闪存”和光介质是持久性的，这意味着掉电时数据不会从介质上删除。相比之下，用于主存的\
  \ `RAM` 通常是易失的——所有信息都会随断电丢失。第二个优势是 `CDs` 和 “USB”驱动器可以在计算机之间轻松传输。这为在计算机间移动提供了方便的方法。\n\
  \n### 8.1 主存与次级存储\n\n为了交换降低存储成本、持久性和便携性，次级存储设备在访问时间增加了代价。虽然并非所有磁盘访问的时间都相同（后文将详细介绍），但在\
  \ 2011 年从硬盘驱动访问一个字节存储的典型时间约为 9 ms（即 9 秒的千分之一）。这看起来可能并不慢，但与从主存访问一个字节所需的时间相比，这慢得惊人。2011\
  \ 年标准个人电脑 `RAM` 的典型访问时间约为 5-10 纳秒（即 5-10 秒的十分之一）。因此，从硬盘访问一个字节数据的时间大约比从主存访问一个字节的时间大六个数量级。虽然硬盘和\
  \ `RAM` 的访问时间都在缩短，但它们的速度频率大致相同。相对速度在几十年里一直保持不变，即 `RAM` 和硬盘之间的访问时间差异一直保持在 100,000\
  \ 到 1,000,000 倍之间。\n\n为了直观地理解这种速度差异的意义，请考虑你在本书的索引中查找硬盘驱动条目然后翻到相应页面所需的时间。将这称为你的“主存”访问时间。如果你执行这次访问需要大约\
  \ 20 秒，那么耗时长 500,000 倍的访问将需要几个月。\n\n有趣的是，尽管处理速度大幅提高，硬件价格大幅下降，但在过去的 15 年里，磁盘和内存访问时间的提升不足一个数量级。\n\
  \n然而，情况实际上比这种适度的提速所暗示的要得多。在同一时期内，磁盘和主内存的容量都增加了三个数量级以上。因此，在这些存储设备密度大幅增加的面前，访问时间实际上缩短了。\n\
  \n由于磁盘数据的访问时间相对于主内存较慢，因此创建处理基于磁盘信息的有效应用程序时需要格外小心。磁盘访问时间与主存访问时间之间百万比一的比例，使得在设计基于磁盘的应用程序时，以下规则至关重要：\n\
  \n**最小化磁盘访问次数！**\n\n减少磁盘访问通常有两种方法。第一种方法是组织信息，使得当你从次级存储访问数据时，能够以尽可能少的访问获取所需内容，最好在第一次访问时获取。文件结构是用于组织存储在次级存储中的数据的数据结构的术语。文件结构的组织应尽可能地减少所需的磁盘访问次数。减少磁盘访问的另一种方法是保存之前检索的信息（或在每次访问时以极小的额外成本检索更多数据），用以减少未来访问的需求。\n\
  \n这需要能够准确预测以后将需要哪些信息，并现在将其存储在主存中。这被称为 `caching`（缓存）。\n\n### 8.2 硬盘驱动器\n\n`C++` 程序员将存储在磁盘上的随机访问文件视为一系列连续的字节，这些字节可能组合成数据记录。这被称为逻辑文件。实际存储在磁盘上的物理文件通常不是连续的字节序列。它很可能是分散在整个磁盘上的各个片段。\n\
  \n文件管理器是操作系统的一部分，负责接收来自逻辑文件的数据请求，并将这些请求映射到数据在磁盘上的物理位置。同样，当相对于文件开头写入某个特定的逻辑字节位置时，该位置必须由文件管理器转换为磁盘上相应的物理位置。为了理解这些操作的大致时间成本，你需要了解硬盘驱动器的物理结构和基本工作原理。\n\
  \n硬盘驱动器通常被称为直接访问存储设备。这意味着访问文件中的任何记录所需的时间大致相等。这与顺序访问存储设备（如磁带机）不同，后者需要磁带读取器从磁带开始处理数据直到到达目标位置。正如你将看到的，硬盘驱动器只是近似直接访问：在任何给定时间内，某些记录比其他记录访问更快。\n\
  \n#### 8.2.1 硬盘架构\n\n硬盘由一个或多个盘片组成，盘片堆叠在一起安装在一个主轴上。盘片以恒定的速度持续旋转。每个盘片的每个可用表面都分配了一个读写头（或\
  \ I/O 头），通过它读取或写入数据，这有点类似于唱片机手臂“读取”唱胶唱片中声音的布局。与唱片机针不同，硬盘读写头实际上不会触碰硬盘表面。相反，它保持在表面微方的上方，正常运行期间的任何接触都会损坏硬盘。这个距离非常小，远小于一个尘粒的高度。这可以类比为一次横跨美国的\
  \ 5000 公里飞行旅行，而飞机的高度仅为一米！\n\n\n\n\n# 8.2 节 磁盘驱动器\n\n硬盘通常有几个盘片和几个读写头，如图 8.2(a) 所示。每个磁头连接在一个臂上，臂连接到磁臂（boom）。磁臂带动所有磁头一起向内或向外移动。当头位于盘片上的某个位置时，每个盘片上都有每个磁头可以直接访问的数据。这种安排虽然是典型的，但并不适用于所有的磁盘驱动器。这里关于磁盘驱动器物理布局的几乎所有描述都代表了一种典型的工程折，而非基本设计原理。设计磁盘驱动器的方法有很多，而工程……\n\
  \n在单个盘片上，对于该盘片的磁头的任意一个位置都可访问的数据统称为一个 `track`（轨道），即盘片上所有距离主轴固定距离的数据，如图 8.2(b) 所示。所有距离主轴固定距离的轨道的集合称为一个\
  \ `cylinder`（柱面）。因此，一个 `cylinder` 是当臂处于特定位置时可以读取的所有数据。\n\n每个轨道被细分为多个 `sectors`（扇区）。在每个\
  \ `sector` 之间存在不存储数据的 `intersector gaps`（扇区间隙）。这些间隙允许读头识别 `sector` 的结束。注意，每个 `sector`\
  \ 包含相同的数据量。\n\n由于外轨道长度较大，它们每英寸包含的比特比内轨道少。因此，大约一半的潜在存储空间被浪费了，因为只有最内轨道以可能的最高密度存储。图\
  \ 8.3a 展示了这种安排。现在的磁盘驱动器实际上将轨道分为若干“区域”，使得最内区域的轨道调整其数据密度以保持相同的径向数据密度，然后下一个区域的轨道重置数据密度以便更好地利用存储能力，以此此类推。这种安排如图\
  \ 8.3b 所示。\n\n与硬盘的物理布局不同，CD-ROM 由单个螺旋轨道组成。轨道上的信息位等距分布，因此信息密度在轨道的外部和内部是相同的。为了保持信息流沿螺旋线以恒定速率流动，当\
  \ I/O 头向磁盘中心移动时，驱动器必须加快磁盘的旋转速度。这使得机制更加复杂且速度更慢。\n\n从硬盘读取特定字节或一系列字节字节数据时，会发生三个独立的步骤：\n\
  1. 首先，移动 I/O 头使其位于包含数据的轨道上方。这种移动被称为 `seek`（寻道）。\n2. 第二，包含数据的 `sector` 旋转到磁头下方。在使用时，磁盘始终在旋转。在本文写作时，典型的磁盘旋转速度为每分钟\
  \ 7200 转 (rpm)。等待所需的扇区旋转到 I/O 头下方的时间称为 `rotational delay`（旋转延迟）或 `rotational latency`（旋转延迟）。\n\
  3. 第三步是数据的实际传输（即读取或写入）。一旦第一个字节置于 I/O 头下方，读取信息所需的时间相对短，只需所有数据移动到头下方的时间即可。事实上，磁盘驱动器的设计并不是为了读取一个字节的数据，而是为了在每次请求读取整个\
  \ `sector` 数据。因此，一个 `sector` 是一次可以读取或写入的最少数据量。\n\n通常，将一个文件的所有 `sectors` 集中在尽可能少的轨道上是理想的。这种愿望源于两个假设：\n\
  1. `Seek time`（寻道时间）很慢（它通常是 I/O 操作中最昂贵的部分）。\n2. 如果读取了文件的一个 `sector`，下一个 `sector`\
  \ 可能会很快被读取。\n\n假设 (2) 被称为 `locality of reference`（局部性），这是一个计算机应用程序中经常出现的概念。\n\n\
  连续的 `sectors` 经常被分组形成一个 `cluster`（簇）。`cluster` 是文件分配的最小单位，因此所有文件都是 `cluster size`（簇大小）的倍数。`cluster\
  \ size` 由操作系统决定。文件管理器跟踪哪些 `clusters` 组成每个文件。\n\n在 Microsoft Windows 系统中，磁盘有一个特定区域称为\
  \ `File Allocation Table`（文件分配表），它存储关于哪些 `sectors` 属于哪个文件的信息。相比之下，UNIX 不使用簇。文件分配的最小单位和可读写的最小单位是\
  \ `sector`，在 UNIX 术语中称为 `block`（块）。UNIX 在某些称为 `i-nodes` 的磁盘块中维护文件组织信息。\n\n来自同一文件的物理连续的\
  \ `clusters` 组被称为 `extent`（范围）。\n\n理想情况下，组成文件的所有 `clusters` 在磁盘上将是连续的（即文件由一个 `extent`\
  \ 组成），以最小化访问文件不同部分所需的 `seek time`。如果在创建文件时磁盘几乎已满，则可能没有足够大的 `extent` 来存放新文件。此外，如果文件增大，物理相邻区域可能没有空闲空间。因此，一个文件可能由磁盘上间距分散的几个\
  \ `extents` 组成。磁盘越满，磁盘上的文件变化越频繁，这种 `file fragmentation`（文件碎片）（以及由此产生的寻道时间）就越糟糕。文件碎片会导致性能明显下降，因为访问数据需要额外的额外的寻道。\n\
  \n当记录的逻辑记录大小与 `sector size` 不匹配时，会出现另一种类型的问题。如果 `sector size` 不是 `record size` 的倍数（反之亦然），记录将无法均匀地放入\
  \ `sector` 中。例如，一个 `sector` 可能长 2048 字节，而逻辑记录为 100 字节。这留下了存储 20 个记录的空间，剩余 48 字节。要么浪费额外空间，要么允许记录跨越\
  \ `sector boundaries`。如果记录跨越扇区边界，读取它可能需要两次磁盘访问。如果留空，这种浪费的空间被称为 `internal fragmentation`（内部碎片）。\n\
  \n`internal fragmentation` 的另一个示例发生在 `cluster boundaries` 处。文件大小不是 `cluster size`\
  \ 的偶数倍时，在最后一个 `cluster` 处必须浪费某些空间。最坏的情况发生在文件大小对 `cluster size` 取模为 1 时（例如，4097 字节的文件和一个\
  \ 4096 字节的簇）。因此，`cluster size` 是在顺序处理的大文件（大簇大小有利于最小化寻道）和小型文件（小簇有利于最小化浪费存储）之间的权衡。\n\
  \n\n\n\n\n每个磁盘驱动器结构都需要使用某些磁盘空间来组织扇区、簇等。磁道内扇区的布局如图 8.4 所示。必须存储在磁盘本身上的典型信息包括 `File\
  \ Allocation Table`（文件分配表）、包含地址标记和每个扇区状态信息（是否可用）的扇区头，以及扇区之间的间隙。扇区头还包含错误检测代码，以帮助验证数据未损坏。这就是为什么大多数磁盘驱动器的“名义”尺寸大于驱动器上可以存储的用户数据的实际量。\n\
  \n这种差异在于组织磁盘上信息所需的空间。由于碎片化，将会丢失更多空间。\n\n### 第 8 章文件处理与外部排序\n\n```\nIntersector Gap\n\
  Sector\nSector\nSector\nSector\nHeader\nData\nHeader\nData\nIntrasector Gap\n```\n\
  \n**图 8.4** 磁道内扇区间隙示意图。每个扇区从扇区头开始，其中包含扇区地址和该扇区内容的错误检测代码。扇区头之后是一个小的扇内间隙，随后是扇区数据。每个扇区与下一个扇区之间由较大的扇间间隙隔开。\n\
  \n### 8.2.2 磁盘访问成本\n\n当需要寻道（seek）时，这通常是访问磁盘信息的主要成本。当然，这假设寻道是必要的。当按顺序读取文件时（如果组成文件的扇区在磁盘上是连续的），不需要多少寻道。然而，当访问随机磁盘扇区时，寻道时间成为数据访问的主要成本。虽然实际寻道时间变化很大，取决于\
  \ I/O 头当前所在磁道与头移动到的目标磁道之间的距离，但我们将只考虑两个数字。\n\n一个是道道道成本，即从一个磁道移动到相邻磁道所需的最小时间。当你想要分析在磁盘上放置良好的文件的访问时间时，这将是合适的。第二个数字是随机访问的平均寻道时间。这两个数字通常由磁盘制造商提供。一个典型的例子是西部数据\
  \ Caviar 系列 SATA 驱动器。\n\n制造商的规格显示道道道时间为 `2.0 ms`，平均寻道时间为 `9.0 ms`。在 2008 年，该系列的一个典型驱动器容量可能为\
  \ `120GB`。在 2011 年，同一系列的驱动器容量已达到 `2` 或 `3TB`。在这些年份，广告的道道道时间和平均寻道时间是相同的。\n\n多年来，磁盘驱动器的典型旋转速度为\
  \ `3600 rpm`，或者说每 `16.7 ms` 旋转一次。2011 年大多数磁盘驱动器的旋转速度为 `7200 rpm`，或每次旋转 `8.3 ms`。当随机读取一个扇区时，你可以预计磁盘需要旋转半圈将所需的扇区带到\
  \ I/O 头下方，对于 `7200-rpm` 的磁盘驱动器为 `4.2 ms`。\n\n一旦位于 I/O 头下方，数据扇区的传输速度就可以该扇区在头下方旋转的速度一样。如果要读取整个磁道，则需要一次旋转（在\
  \ `7200 rpm` 下为 `8.3 ms`）将整个磁道移动到头下方。如果只读取磁道的部分，则需要相应较少的时间。例如，如果磁道上有 `16,000` 个扇区，只需读取其中一个扇区，这只需要极少的时间（旋转的\
  \ `1/16,000`）。\n\n**示例 8.1** 假设一个旧磁盘驱动器的总容量（名义容量）为 `16.8GB`，分布在 `10` 个盘片上，每个盘片产生\
  \ `1.68GB`。每个盘片包含 `13,085` 个磁道，每个磁道（格式化后）包含 `256` 个扇区，每个扇区 `512 bytes`。道道寻道时间为 `2.2\
  \ ms`，随机访问的平均寻道时间为 `9.5 ms`。假设操作系统维护每个簇 `8` 个扇区的簇（`4KB`），每个磁道产生 `32` 个簇。磁盘旋转率为 `5400\
  \ rpm`（每次旋转 `11.1 ms`）。基于这些信息，我们可以估计各种文件处理操作的成本。\n\n读取一个磁道需要多长时间？平均而言，需要半圈旋转将磁道的第一个扇区带到\
  \ I/O 头下方，然后通过一次完整旋转读取该磁道。\n\n读取一个分为 `2048` 个扇区大小（`512 byte`）记录的 `1MB` 文件需要多长时间？该文件将存储在\
  \ `256` 个簇中，因为每个簇持有 `8` 个扇区。问题的答案很大程度上取决于文件在磁盘上的存储方式，即它是存储在一起还是分成多个跨区（extents）。我们将计算这两种情况，看看会产生多大差异。\n\
  \n如果文件的存储方式填满了八个相邻磁道的所有扇区，那么读取第一个扇区的成本将是寻道到第一个磁道的时间（假设这需要随机寻道），然后等待初始旋转延迟，然后读取时间（与再次旋转磁盘的时间相同）。这需要\n\
  `9.5 + 11.1 × 1.5 = 26.2 ms`。\n\n在此处，由于我们假设接下来的七个磁道需要随机寻道，但它们是相邻的。这需要\n`2.2 + 11.1\
  \ × 1.5 = 18.9 ms`。\n\n如果文件的簇随机分布在磁盘上，那么我们必须对每个簇执行寻道，然后是旋转延迟。一旦簇的第一个扇区到达 I/O 头下方，读取该簇只需要很少的时间，因为只需要磁道的\
  \ `1/256` 旋转到头下方，总时间约为 `5.9 ms`。\n\n因此，总时间约为 `256(9.5 + 5.9) ≈ 3942ms` 或接近 4 秒。这长得多！这说明了为什么防止磁盘文件产生碎片化是重要的，以及为什么所谓的“碎片整理工具”可以加快文件处理时间。文件碎片化最发生在磁盘几乎满且文件管理器每次创建或更改文件时必须搜索空空间的情况下。\n\
  \n### 8.3 缓冲区和缓冲区池\n\n根据 `示例 8.1` 中的磁盘驱动器规格，我们发现读取一个磁道数据平均大约需要 `9.5+11.1×1.5 = 26.2\
  \ ms`。读取单个扇区数据平均大约需要 `9.5+11.1/2+(1/256)×11.1 = 15.1 ms`。\n\n这是一个很好的节省（略多于一半的时间），但读取的数据仅占磁道数据的不到\
  \ 1%。如果我们想读取单个字节，与读取整个扇区的时间相比，实际上没有节省任何时间。由于这个原因，每当访问磁盘时，几乎所有的磁盘驱动器都会读取或写入整个扇区的信息，即使只请求一个字节的信息。\n\
  \n一旦扇区被读取，其信息就会存储在主内存中。这被称为缓冲或缓存信息。如果下一次磁盘请求是同一个扇区，则没有再次从磁盘读取，因为信息已经存储在主内存中。缓冲是本章开头提到的减少磁盘访问的方法的一种示例：从磁盘预取额外信息以满足未来的请求。如果文件信息是随机访问的，那么连续两次磁盘请求是同一个扇区的概率很低。然而，在实践中，大多数磁盘请求至少在逻辑文件上都靠近上一次请求的位置。这意味着下一次请求“命中缓存”的概率比随机情况显示的要高得多。\n\
  \n\n\n\n\n# 这一原理解释了为什么新硬盘的平均访问时间比过去短。这不仅是因为硬件更快了，而且现在信息还使用更好的算法和更大的缓存进行存储，从而最大限度地减少了从磁盘获取信息的次数。同样的概念也被用于将程序存储在\
  \ CPU 内更快的内存中，使用了现代微处理器中常见的 `CPU cache`。\n\n## 扇区缓冲 (Sector-level Buffering)\n扇区缓冲通常由操作系统提供，并且直接构建在磁盘控制器硬件中。大多数操作系统至少维护两个缓冲区，一个用于输入，一个用于输出。考虑一下如果在按字节拷贝操作期间只有一个缓冲区，会发生什么。\n\
  \n包含第一个字节的扇区将被读取到 `I/O buffer` 中。输出操作将需要销毁单个 `I/O buffer` 的内容以写入该字节。然后，需要从磁盘重新填充缓冲区以获取第二个字节，但在输出时它又会被销毁。解决这个问题的简单方法是保留一个输入缓冲区，另一个作为输出缓冲区。\n\
  \n## 双缓冲 (Double Buffering)\n一旦接收到 `I/O request`，大多数磁盘控制器都会独立于 CPU 运行。这非常有用，因为在执行单次\
  \ `I/O operation` 需要的时间内，CPU 通常可以执行数百万条指令。充分利用这种微并行性的技术是双缓冲。想象一个文件正在被顺序处理。在读取第一个扇区时，CPU\
  \ 无法处理该信息，因此必须等待或在此期间寻找其他事情。一旦读取了第一个扇区，CPU 就可以开始处理，而磁盘驱动（并行地）开始读取第二个扇区。如果 CPU 处理一个扇区的时间与磁盘控制器读取一个扇区的时间相似，那么可能让\
  \ CPU 持续地从文件中获取数据。同样的概念也适用于输出，当 CPU 向内存中的第二个输出缓冲区写入数据时，将一个扇区写入磁盘。\n\n因此，在支持双缓冲的计算机中，至少准备两个输入缓冲区和两个输出缓冲区是有意义的。\n\
  \n## 缓冲与缓冲区池 (Buffering and Buffer Pools)\n在内存中缓存信息是一个如此好的主意，以至于通常扩展到多个缓冲区。操作系统或应用程序可能会存储许多从某些底层存储（如磁盘文件）获取的缓冲区信息。\n\
  \n这种将缓冲区作为用户和磁盘文件之间的介质的过程称为文件缓冲。存储在缓冲区中的信息通常被称为 `page`（页），而缓冲区的集合被称为 `buffer pool`（缓冲区池）。`buffer\
  \ pool` 的目标是增加内存中存储的信息量，以希望新的信息请求可以从 `buffer pool` 满足，而不是需要从磁盘读取新信息。\n\n只要 `buffer\
  \ pool` 中有未使用的缓冲区可用，就可以根据需要从磁盘读取新信息。当应用程序继续从磁盘读取新信息时，最终 `buffer pool` 中的所有缓冲区都将变满。一旦发生这种情况，就必须决定牺牲\
  \ `buffer pool` 中的哪些信息来为新请求的信息腾出空间。\n\n## 缓冲区替换策略 (Buffer Replacement Policies)\n\
  在替换 `buffer pool` 中包含的信息时，目标是选择一个包含“不必要”信息的缓冲区，即最不可能被再次请求的信息。由于 `buffer pool` 无法确定未来请求的模式将是怎样，必须使用基于某些启发式方法或最佳猜测的决策。有几种方法可以做出这种决策。\n\
  \n### 先进先出 (First-In, First-Out, FIFO)\n一种启发式方法是“先入先出”（`FIFO`）。该方案简单地将缓冲区按队列顺序排序。队列头部的缓冲区下次被用于存储新信息，然后放在队列末尾。通过这种方式，要替换的缓冲区是持有信息最久的那一个，希望这些信息不再被需要。当处理以某种恒定速度大致按顺序沿文件移动移动时，这是一个合理的假设。然而，许多程序会反复处理某些关键信息，而信息的重要性与信息首次被访问的时间长短关系不大。通常，知道信息被访问了多少次，或者信息最后一次被访问的时间更为重要。\n\
  \n### 最不经常使用 (Least Frequently Used, LFU)\n另一种方法称为“最不经常使用”（`LFU`）。`LFU` 跟踪 `buffer\
  \ pool` 中每个缓冲区的被访问次数。当必须重用缓冲区时，访问次数最少的缓冲区被认为包含“最不重要”的信息，因此下次使用它。`LFU` 虽然在直觉上看起来合理，但有许多缺点。首先，必须存储并更新每个缓冲区的访问计数。其次，过去被多次引用的内容现在可能已经无关了。因此，通常需要某种让计数“过期”的计时机制。这还避免了缓冲区因为使用频率足够高而未被替换，从而缓慢积累大计数值的问题。另一种方法是维护所有已读取过的扇区的计数，而不仅仅是当前在\
  \ `buffer pool` 中的扇区。这避免了立即替换刚刚读取的缓冲区，因为它还没有时间建立高访问计数。\n\n### 最久未使用 (Least Recently\
  \ Used, LRU)\n第三种方法称为“最久未使用”（`LRU`）。`LRU` 简单地将缓冲区保存在列表中。每当缓冲区中的信息被访问时，该缓冲区就会移到列表头部。当必须读取新信息时，会取列表末部的缓冲区（最久未使用的那个），并根据情况将其“旧”信息丢弃或写入磁盘。这是\
  \ `LFU` 的一种易于实现的近似，除非对应用程序访问模式有特殊了解，否则通常是管理 `buffer pools` 的选择方法。\n\n## 磁盘 I/O 优化\
  \ (Disk I/O Optimization)\n`buffer pool` 的主要目的是最小化磁盘 I/O。当块的内容被修改时，我们可以立即将更新的信息写入磁盘。\n\
  \n但如果块再次发生变化呢？如果我们每次更改后都写入块的内容，可能会产生大量可以避免的磁盘写入操作。等待文件关闭或包含该块的缓冲区从 `buffer pool`\
  \ 刷新会更高效。\n\n\n\n\n块根据内存访问的需求被读入主内存。自然地，使用虚拟内存技术的程序比数据完全存储在主内存中的程序要慢。它的优点是减少了程序员的工作量，因为良好的虚拟内存系统可以在不修改程序的情况下提供比主内存更大的假象。\n\
  \n### 示例 8.2\n考虑一个大小为十个扇区的虚拟内存，它关联有一个包含五个缓冲区（每个大小为一个扇区）的缓冲区池。我们将使用 LRU（最久未使用）替换方案。发生以下系列内存请求：\n\
  \n```\n9017668135171\n```\n\n在前五个个请求之后，缓冲区池将按照 6, 7, 1, 0, 9 的顺序存储扇区。由于扇区 6 已经位于头部，下次请求无需从磁盘读取新数据或重新排序缓冲区即可回答。对扇区\
  \ 8 的请求需要清空最久未使用缓冲区的内容，该缓冲区包含扇区 9。对扇区 1 的请求将持有扇区 1 内容的缓冲区移回头部。处理剩余请求后，缓冲区池的状态如图\
  \ 8.5 所示。\n\n### 示例 8.3\n图 8.5 展示了一个由五个块组成的缓冲区池，用于调节一个十个块的虚拟内存。在任何时刻，最多有五个扇区的信息位于主内存中。假设扇区\
  \ 1, 7, 5, 3 和 8 当前位于缓冲区池中并按此顺序存储，并且我们使用 LRU 缓冲区替换策略。如果随后收到对扇区 9 的请求，则必须替换缓冲区池中的当前一个扇区。因为包含扇区\
  \ 8 的缓冲区是最久未使用的缓冲区，其内容将被写回磁盘的扇区 8。然后将扇区 9 的内容复制到此缓冲区，并将其移到缓冲区池的头部（使包含扇区 3 的缓冲区成为新的最久未使用缓冲区）。如果下次内存请求是扇区\
  \ 5，则无需从磁盘读取数据。\n\n相反，已经包含扇区 5 的缓冲区将移到缓冲区池的头部。\n\n### 缓冲区池实现\n在实现缓冲区池时，关于缓冲区池用户与缓冲区池类本身之间的信息传输，可以采取两种基本方法。第一方法是在两者之间传递“消息”。这种方法由下面的抽象类说明：\n\
  \n辅助存储（磁盘上）\n主内存（RAM 中）\n\n```\n0 1 7 2 5 3 3 4 8 5 6 7 8 9\n```\n\n**图 8.5** 虚拟内存示意图。完整的信息集位于较慢的辅助存储（磁盘上）中。最近访问的扇区保留在快速的主内存（RAM）中。在本例中，来自辅助存储的扇区\
  \ 1, 7, 5, 3 和 8 的副本当前存储在主内存中。如果接收到扇区 9 的内存访问，必须替换主内存中当前的扇区之一。\n\n#### 使用消息传递风格的缓冲区池\
  \ ADT\n```cpp\nclass BufferPool {\n  public:\n    // 从 \"space\" 拷贝 \"sz\" 字节到缓冲存储器中的\
  \ \"pos\" 位置。\n    virtual void insert(void* space, int sz, int pos) = 0;\n\n  \
  \  // 从缓冲存储单元的 \"pos\" 位置拷贝 \"sz\" 字节到 \"space\"。\n    virtual void getbytes(void*\
  \ space, int sz, int pos) = 0;\n};\n```\n\n这个简单的类提供了一个带有两个成员函数 `insert` 和 `getbytes`\
  \ 的接口。信息通过 `space` 参数在缓冲区池用户和缓冲区池之间传递。这是一个由缓冲区池客户端提供的存储空间，长度至少为 `sz` 字节，缓冲区池可以从从中获取信息（`insert`\
  \ 函数）或向其放入信息（`getbytes` 函数）。参数 `pos` 指明信息将放置在缓冲区池逻辑存储空间中的位置。在物理上，它实际上将被复制到缓冲区池中某个缓冲区的相应字节位置。此\
  \ ADT 与第 8.4 节讨论的 `RandomAccessFile` 类的 `read` 和 `write` 方法相似。\n\n### 示例 8.4\n假设磁盘文件的每个扇区（以及缓冲区池中的每个块）都存储\
  \ 1024 字节。假设缓冲区池处于图 8.5 所示的状态。如果下次请求是从文件位置 6000 开始拷贝 40 字节，这些字节应该被放在扇区 5 中（其字节范围从位置\
  \ 5120 到位置 6143）。因为扇区 5 当前在缓冲区池中，我们只需将 `space` 中包含 40 字节拷贝到字节位置 880-919。然后将包含扇区\
  \ 5 的缓冲区移到缓冲区池中位于包含扇区 1 的缓冲区之前。\n\n另一种接口是让缓冲区池向用户提供指向包含请求信息的缓冲区的直接指针。这样的接口可能如下：\n\
  \n#### 使用缓冲区传递风格的缓冲区池 ADT\n```cpp\nclass BufferPool {\n  public:\n    // 返回请求块的指针\n\
  \    virtual void* getblock(int block) = 0;\n\n    //为持有 \"block\" 的缓冲区设置脏位\n  \
  \  virtual void dirtyblock(int block) = 0;\n\n    // 告诉缓冲区的大小\n    virtual int blocksize()\
  \ = 0;\n};\n```\n\n在这种方法中，缓冲区池用户被感知到存储空间被划分为给定大小的块，每个块的大小等于缓冲区的大小。用户从缓冲区池请求特定的块，并返回一个指向持有该块的缓冲区指针。用户随后可以对该空间进行读取或写入。如果用户向该空间写入，必须通知缓冲区池这一事实。这是因为，当给定的块要从缓冲区池中移除时，如果该块已被修改，则其内容必须写回底层存储。如果块未被修改，则没有必要将其写入。\n\
  \n### 示例 8.5\n我们希望从文件逻辑位置 6000 开始写入 40 字节。假设缓冲区池处于图 8.5 所示的状态。使用第二个 ADT，客户端需要知道块（缓冲区）的大小为\
  \ 1024，因此将请求对扇区 5 的访问。\n\n调用 `getblock` 将返回一个指向包含扇区 5 的缓冲区指针。客户端随后将  40 字节拷贝到缓冲区的\
  \ 880-919 处，并调用 `dirtyblock` 警告缓冲区池该块的内容已被修改。\n\n### 基于模式的方法\n该方法的一种变体是让 `getblock`\
  \ 函数接受另一个参数以指示信息使用的“模式”。如果模式是读（READ），则缓冲区池假设缓冲区的内容不会发生任何更改（因此当缓冲区被重用以存储另一个块时，不需要执行写操作）。如果模式是写（WRITE），则缓冲区池假设客户端不会查看缓冲区的内容，因此没有必要从文件中读取。如果模式是读写（READ\
  \ AND WRITE），则缓冲区池将从磁盘读取块的现有内容，并在缓冲区被重用时将缓冲区的内容写入磁盘。使用“模式”方法可以避免使用 `dirtyblock`\
  \ 方法。\n\n\n\n\n\n传递缓冲区（buffer-passing）ADT 的一个问题是过期指针（stale pointers）的风险。当缓冲区池用户在时间\
  \ T1 获得指向某些缓冲区空间的指针时，该指针在当时确实指向该时间所需的数据。随着对缓冲区池的进一步请求，任何给定缓冲区中的数据可能会被移除并替换为新数据。如果缓冲区池用户在稍后的时间\
  \ T2 再次引用由 T1 时刻给出的该指针所指向的数据，那么这些数据可能不再有效，因为在此期间缓冲区的内容已被替换。因此，指向缓冲区池内存的指针就变得“过期”了。为了保证指针不过期，如果在此期间对缓冲区池发生了插入请求，则不应使用该指针。\n\
  \n我们可以通过引入用户（或可能的多个用户）获取缓冲区访问并在完成后释放缓冲区的概念来解决这个问题。\n\n为了这一目的，我们将添加方法 `acquireBuffer`\
  \ 和 `releaseBuffer`。\n\n方法 `acquireBuffer` 以块 ID（block ID）作为输入并返回用于存储该块的缓冲区指针。缓冲区池将维护该块当前活跃请求的数量计数。方法\
  \ `releaseBuffer` 将减少关联块的活跃用户计数。与活跃块关联的缓冲区将符合从缓冲区池中刷新（flushing）的条件。如果客户端在不再需要活跃块时忘记释放，就会导致问题。如果总活跃块的数量多于缓冲区池中的缓冲区，也会出现问题。然而，缓冲区池的初始化应该始终包含比同时可能活跃的数量更多的缓冲区。\n\
  \n到为止提出的两种 ADT 的另一个问题是：当用户想要完全覆盖一个块的内容，且不需要读取已经在磁盘上的旧内容时。然而，缓冲区池通常无法知道用户是否想要使用旧内容。这在消息传递方法中尤为如此，因为给定的消息可能只覆盖块的一部分。在这种情况下，即使在不需要时，块也会被读入内存，然后其内容将被覆盖。\n\
  \n这种低效率（至少在缓冲区传递版本中）可以通过将块到缓冲区的分配与实际读取该块的数据分离离开来避免。特别是，以下经过修订的缓冲区传递 ADT 并不会在 `acquireBuffer`\
  \ 方法中实际读取数据。想要查看旧内容的用户必须发布 `readBlock` 请求将数据从磁盘读入缓冲区，然后发布 `getDataPointer` 请求以获得对缓冲区数据内容的直接访问权限。\n\
  \n### Sec 8.3 缓冲区与缓冲区池\n\n```cpp\n// 缓冲区池中的单个缓冲区\nclass Buffer {\npublic:\n    //\
  \ 从磁盘读取关联的块（如有必要）并\n    // 返回数据的指针\n    void *readBlock() = 0;\n    // 返回缓冲区数据数组的指针\n\
  \    // （不从磁盘读取）\n    void *getDataPointer() = 0;\n    // 标记缓冲区内容为已更改，这样\n    //\
  \ 刷新块将将其写回磁盘\n    void markDirty() = 0;\n    // 释放块对此缓冲区的访问。后续\n    // 对此缓冲区的访问将是非法的\n\
  \    void releaseBuffer() = 0;\n};\n\n// 缓冲区池\nclass BufferPool {\npublic:\n   \
  \ // 构造函数：缓冲区池拥有 \"numbuff\" 个缓冲区，\n    // 每个缓冲区包含 \"buffsize\" 字节的数据。\n    BufferPool(int\
  \ numbuff, int buffsize) = 0;\n    // 将块与缓冲区关联，返回指向缓冲区对象的指针\n    Buffer *acquireBuffer(int\
  \ block) = 0;\n};\n```\n\n同样地，可以为 `acquireBuffer` 方法添加一个模式参数（mode parameter），从而消除对\
  \ `readBlock` 和 `markDirty` 方法的需求。\n\n显然，缓冲区传递方法对缓冲区池的用户施加了更多义务。这些义务包括了解块的大小、不损坏缓冲区池的存储空间，以及在块被修改和不再需要时都通知缓冲区池。这么多义务使得这种方法容易出错。其优势是，当从用户获取信息并放入缓冲区时，不需要额外的拷贝步骤。如果存储的记录大小很小，那么这并不是一个重要的考虑因素。如果记录大小很大（特别是当记录大小和缓冲区大小相同时，这在实现\
  \ B 树时通常是这样的，见第 10.5 节），那么这个效率问题可能会变得重要。但请注意，内存中拷贝的时间始终远少于将缓冲区内容写入磁盘所需的时间。对于磁盘 I/O\
  \ 是程序瓶颈的应用程序，即使是由于缓冲区池用户和缓冲区之间拷贝大量信息的时间也可能是微不足道的。\n\n缓冲区传递的另一个优势是减少了对那些将会被覆盖的数据的不必要的读取操作。\n\
  \n你应该注意，上述 `BufferPool` 类的实现没有使用模板（templates）。相反，`space` 参数和缓冲区指针被声明为 `void*`。\n\
  \n当一个类使用模板时，意味着记录类型是任意的，但该类知道记录类型是什么。相比之下，使用 `void*` 指针表示空间意味着不仅记录类型是任意的，而且缓冲区池甚至不知道记录类型是什么。事实上，一个给定的缓冲区池可能有许多用户存储许多类型的记录。在缓冲区池中，用户决定记录存储在何，但对数据传输到后备存储的精确机制没有控制权。这与第\
  \ 12.3 节描述的内存管理器相反，在那种情况下用户将记录传递给管理器，而对存储位置完全没有控制。\n\n### 8.4 程序员对文件的视图\n\nC++ 程序员对随机访问文件的逻辑视图是一个单一字节流。与文件的交互可以被视为一个发布三个指令之一的通信通道：从文件的当前位置读取字节、向文件的当前位置写入字节，以及移动文件内的当前位置。你通常看不到字节是如何存储在扇区、簇等处的。逻辑地址到物理地址的映射由文件系统完成，扇区级缓冲由磁盘控制器自动完成。\n\
  \n在处理磁盘文件中的记录时，访问顺序会对 I/O 时间产生巨大影响。随机访问过程以独立于文件内逻辑顺序的顺序处理记录。顺序访问按照文件在内的逻辑顺序处理记录。如果磁盘文件的物理布局与其逻辑布局匹配（这在空闲空间比例高的磁盘上创建文件时是预期的），顺序处理需要更少的寻道时间。\n\
  \nC++ 提供了多种处理磁盘文件的机制。最常用的之一是 `fstream` 类。可以使用以下方法操作文件中的信息：\n\n- `open(char *name,\
  \ openmode flags)`：打开文件 `name` 进行处理。`flags` 控制各种细节，例如文件是否允许读取、写入或两者；以及是否应删除其预存内容。\n\
  - `read(char *buff, int count)`：从文件的当前位置读取 `count` 字节。当前文件位置随字节读取向前移动。字节被读入数组 `buff`，该数组长度至少为\
  \ `count` 字节。\n\n\n\n\n\n- `write(char *buff, int count)`: 在文件的当前位置写入 `count` 字节（覆盖该位置已有的字节）。随着这些字节的写入，当前文件位置将向前移动。要写入的字节源自数组\
  \ `buff`。\n- `seekg(int pos)` 和 `seekp(int pos)`: 将文件的当前位置移动到 `pos`。这允许读取或写入文件内任意位置的字节。实际上有两个“当前”位置：一个用于读取，一个用于写入。函数\
  \ `seekg` 改变“获取”（get）或读取位置，而函数 `seekp` 改变“放入”（put）或写入位置。\n- `close()`: 在处理结束时关闭文件。\n\
  \n请注意，该 ADT（抽象数据类型）的精神与第 8.3 节中描述的用于缓冲区池的“消息传递”版本的 ADT 相似。\n\n## 8.5 外部排序\n\n我们现在考虑对于大到无法放入主内存的记录集的排序问题。由于记录必须存储在外围或外部内存中，此类排序方法被称为外部排序。这与第\
  \ 7 章讨论的内部排序形成对比，后者假设待排序的记录存储在主内存中。对大型记录集排序是许多应用的核心，例如处理工资单和其他大型业务数据库。因此，人们设计了许多外部排序算法。年前，排序算法设计者试图优化特定硬件配置的使用，例如多个磁带或磁盘驱动器。如今的大部分计算是在个人电脑和低端工作站上完成的，这些设备具有相对强力的\
  \ CPU，但只有一个或最多两个磁盘驱动器。这里介绍的技术针对单磁盘驱动器的优化处理。这种方法使我们能够涵盖外部排序中最重要的问题，同时跳过许多不重要的、取决于机器的细节。需要实现利用更复杂硬件配置的高效外部排序算法的读者，应查阅第\
  \ 8.6 节中的参考文献。\n\n当记录集大到无法放入主内存时，对其排序的唯一实用方法是从磁盘读取某些记录，进行一些重排，然后将其写回磁盘。这个过程不断重复直到文件排序完成，每条记录可能会被读取多次。鉴于磁盘\
  \ I/O 的高成本，外部排序算法的主要目标是尽量减少信息从磁盘读取或写入磁盘的次数，这并不意外。少量的额外 CPU 处理可以换取磁盘访问的减少，这是物有所值的交易。\n\
  \n在讨论外部排序技术之前，再次考虑从磁盘访问信息的 Basic 模型。程序员将待排序的文件视为一系列固定大小的块（block）。假设（为了简单起见）每个块包含相同数量的固定大小数据记录。根据应用程序的不同，记录可能只有几个字节——仅由键（key）组成或几乎没有内容——也可能是数百字节，并带有一个较小的键字段。\n\
  \n假设记录不会跨越块边界。对于特殊的排序应用，可以放宽这些假设，但忽略此类复杂性会让原理更加清晰。\n\n如第 8.2 节所示，扇区（sector）是 I/O\
  \ 的基本单元。换句话说，所有的磁盘读写都是针对一个或多个完整扇区的。扇区的大小通常是 2 的幂，范围在 512 到 16K 字节之间，取决于操作系统以及磁盘驱动器的大小和速度。外部排序算法使用的块大小应等于或扇区大小的倍数。\n\
  \n在此模型下，排序算法将一个数据块读取到主内存的缓冲区中，对其进行一些处理，并在未来的某个时间将其写回磁盘。从第 8.1 节我们可以看到，从磁盘读取或写入一个块所需的时间是内存访问的百万倍。基于这一事实，我们可以合理地预期，单个块中包含的记录通过内部排序算法（如\
  \ `Quicksort`）进行排序所需的时间比读取或写入该块的时间要短。\n\n在良好的情况下，按顺序读取文件比按随机顺序读取块更高效。鉴于寻道时间（seek\
  \ time）对磁盘访问的显著影响，顺序处理更快似乎是显而易见的。然而，精确地理解在什么情况下顺序文件处理实际上比随机访问更快至关重要，因为这影响了我们设计外部排序算法的方法。高效的顺序访问依赖于将寻道时间保持在最低。第一个要求是组成文件的块实际上在磁盘上按顺序存储且靠得很近，最好填满少数几个连续的磁道（tracks）。至少，组成文件的连续区段（extents）数量应该是很小的。\n\
  \n用户通常对文件在磁盘上的布局没有太大控制权，但向具有高百分比空闲空间的磁盘驱动器一次性按顺序写入文件，会增加这种布局的可能性。\n\n第二个要求是磁盘 I/O\
  \ 磁头在整个顺序过程中始终保持在文件上方。如果 I/O 磁头存在任何形式竞争，这种情况就不会发生。例如，在多用户时分计算机上，排序过程可能会与其他用户的进程竞争\
  \ I/O 磁头。即使排序过程独占 I/O 磁头的控制权，顺序处理可能仍然不会高效。想象这样的情况：所有处理都在单个磁盘驱动器上完成，典型配置是单组读写磁头，它们在堆叠的盘片上一起移动。如果排序过程涉及从输入文件读取并交替写入输出文件，那么\
  \ I/O 磁头将在输入文件和输出文件之间持续寻道。同样，如果同时处理两个输入文件（例如在合并过程中）， I/O 磁头将在这两个文件之间持续寻道。\n\n教训是，对于单磁盘驱动器，通常不存在所谓的对数据文件的高效顺序处理。因此，如果一个排序算法执行较少的非顺序磁盘操作，而不是执行需要大量寻道的逻辑顺序顺序磁盘操作，那么它可能会更有效。正如之前提到的，记录的大小相对于键的大小来说可能非常大。例如，大型企业的工资条目可能每个都存储数百字节的信息，包括每位员工的姓名、ID、地址和职称。排序键可能是\
  \ ID 号，仅需几个字节。\n\n最简单的排序算法可能是对此类记录进行整体处理，在每次处理时都读取整个记录。然而，这将大大增加所需的 I/O 量，因为单个磁盘块中只能容纳较少的记录。另一种方案是进行键排序。在这种方法下，所有的键都被读取并一起存储在一个索引文件中，每个键都与一个指向原始数据文件中相应记录位置的指针一起存储。键和指针的组合应远小于原始记录的大小；因此，索引文件将比完整数据文件得多。然后对索引文件进行排序，由于索引记录比完整记录小，所需的\
  \ I/O 将少得多。\n\n\n\n\n一旦索引文件排序完成，就可以对原始数据库文件中的记录进行重新排序。通常情况下不会这样做，原因有两个：首先，从记录文件中按排序顺序读取记录需要对每条记录进行随机访问。这可能花费大量时间，而且只有在需要按排序顺序查看或处理整个记录集时（与搜索选定的记录相比），这种做法才有价值。其次，数据库系统通常允许对多个键进行搜索。例如，今天的处理可能是按\
  \ ID 编号进行的；而明天，老板可能希望按薪资排序信息。因此，完整记录可能没有一个单一的“排序”顺序。相反，通常会维护多个索引文件，每个文件对应一个排序键。这些思想将在第\
  \ 10 章中进行进一步探讨。\n\n## 8.5.1 外部排序的简单方法\n\n如果你的操作系统支持虚拟内存，最简单的“外部”排序是将整个文件读入虚拟内存，并运行如\
  \ `Quicksort` 类的内部排序方法。这种方法允许虚拟内存管理器使用其标准的缓冲池机制来控制磁盘访问。遗憾的是，这并不总是一个可行的方案。一个潜在的缺点是，虚拟内存的大小通常远小于可用的磁盘空间。因此，你的输入文件可能无法放入虚拟内存中。通过调整内部排序方法以利用你自己的缓冲池，可以克服虚拟内存有限的问题。\n\
  \n将内部排序算法改为外部排序算法的一个更通用的问题是：它的效率可能不如以最小化磁盘 I/O 为特定目标设计的新算法。考虑将 `Quicksort` 使用缓冲池的简单改进。`Quicksort`\
  \ 开始时处理整个记录数组，第一个分区步骤将索引从两端向内移动。这可以使用缓冲池高效地实现。然而，下一步是处理每个子数组，然后是处理子子数组，依此类推。\n\n\
  随着子数组变得越来越小，处理将迅速接近于磁盘驱动器的随机访问。即使最大限度地使用缓冲池，`Quicksort` 平均仍然必须读写每条记录 `log n` 次。我们可以做得好得多。最后，即使虚拟内存管理器可以使用标准的\
  \ `Quicksort` 获得良好的性能，这也是以消耗系统大量工作内存为代价的，这意味着系统无法将此空间用于其他工作。更好的方法可以在节省时间的同时，也使用更少的内存。\n\
  \n我们的外部排序方法源自 `Mergesort` 算法。最简单的外部 `Mergesort` 形式是对记录进行一系列顺序扫描，在每次扫描中合并越来越大的子列表。第一遍扫描将大小为\
  \ 1 的子列表合并为大小为 2 的子列表；第二遍将大小为 2 的子列表合并为大小为 4 的子列表；依此类推。排序后的子列表被称为 `run`（游）。因此，每次扫描都在合并成对的\
  \ run 形成更长的 run。每次扫描将文件内容复制到另一个文件中。以下是算法的概述，如图 8.6 所示。\n\n1. 将原始文件分成两个等大小的 run 文件。\n\
  2. 从每个 run 文件读取一个块到输入缓冲区。\n3. 从每个输入缓冲区取第一条记录，并按排序顺序将长度为二的 run 写入输出缓冲区。\n4. 从每个输入缓冲区取下一条记录，并按排序顺序将长度为二的\
  \ run 写入第二个输出缓冲区。\n5. 重复直到完成，在两个输出 run 缓冲区之间交替输出。\n\n每当到达输入块的末尾时，从相应的输入文件读取下一块。当输出缓冲区满额时，将其写入相应的输出文件。\n\
  \n**图 8.6** 一个简单的外部 `Mergesort` 算法。输入记录平均分配在两个输入文件之间。来自每个输入文件的第一个 run 被合并并放在第一个输出文件中。来自每个输入文件的第二个\
  \ run 被合并并放在第二个输出文件中。合并在两个输出文件之间交替进行，直到输入文件为空。然后反转输入文件和输出文件的角色，使得 run 的长度在每次扫描中增加一倍。\n\
  \n6. 重复步骤 2 到 5，使用原始输出文件作为输入文件。在第二遍扫描中，每个输入 run 文件的前两个记录已经是排序顺序了。因此，这两个 run 可以被合并并输出为一个长度为四个元素的单个\
  \ run。\n7. 每次遍历 run 文件都会提供越来越大的 run，直到只剩下一个 run。\n\n**例例 8.6** 使用图 8.6 的输入，我们首先创建分布在两个输入文件之间的长度为一的\
  \ run。然后我们顺序处理这两个输入文件，创建出长度为二的 run。第一个 run 具有值 20 和 36，输出到第一个输出文件。下一个 run 具有 13\
  \ 和 17，输出到第二个文件。run 14, 28 发送到第一个文件，然后 run 15, 23 发送到第二个文件，依此类推。一旦这一遍完成，输入文件和输出文件的角色就会反转。下一遍扫描将长度为二的\
  \ run 合并为长度为四的 run。run 20, 36 和 13, 17 合并，将 13, 17, 20, 36 发送到第一个输出文件。然后 run 14,\
  \ 28 和 15, 23 合并，将 run 14, 15, 23, 28 发送到第二个输出文件。在最后一次扫描中，这些 run 合并形成最终的 run 13,\
  \ 14, 15, 17, 20, 23, 28, 36。\n\n\n\n\n我们可以扩展这一概念以进一步提高性能。可用的主内存通常远大于一个块的大小。如果我们处理更大的初始运行（initial\
  \ runs），那么 `Mergesort` 所需的趟数（passes）就会进一步减少。例如，大多数现代计算机可以为排序程序提供几十兆甚至数百兆字节的 RAM。如果所有这些内存（除留一小部分用于缓冲区和局部变量外）都投入到构建尽可能大的初始运行，那么就可以在少数几趟内处理非常大的文件。下一节介绍了一种生成大范围运行的技术，其大小通常是能够直接放入主内存的运行大小的两倍。\n\
  \n减少所需趟数的另一种方法是增加每次遍历中合并在一起的运行数量。虽然标准的 `Mergesort` 算法一次只合并两个运行，但没有理由将合并限制在这种种方式上。第\
  \ 8.5.3 节讨论了多路合并（multiway merging）技术。\n\n多年来，人们提出了许多外部排序的变体，但它们都基于以下两个步骤：\n\n1.\
  \ 将文件分成大的初始运行。\n2. 将这些运行合并成一个排序后的文件。\n\n## 8.5.2 替换选择 (Replacement Selection)\n\n\
  本节处理了如何从磁盘文件中创建尽可能大的初始运行的问题，假设有固定数量的 RAM 可供处理。如前文所述，一种简单的方法是将尽可能多的 RAM 分配给大数组，从磁盘填充该数组，并使用\
  \ `Quicksort` 对数组进行排序。因此，如果用于数组的内存大小为 `M` 条记录，那么输入文件就可以分成长度为 `M` 的初始运行。一种更好的方法是使用一种名为\
  \ `替换选择`（replacement selection）的算法，它平均可以创建长度为 `2M` 条记录的运行。替换选择实际上是 `Heapsort` 算法的一种微变体。`Heapsort`\
  \ 比 `Quicksort` 这一事实在本文中并不重要，因为 I/O 时间将主导任何合理的外部排序算法的总运行时间。构建更长的初始运行将减少所需的总 I/O\
  \ 时间。\n\n替换选择将 RAM 视为一个大小为 `M` 的数组，加上一个输入缓冲区和一个输出缓冲区。（如果操作系统支持双重缓冲，额外的 I/O 缓冲区可能是理想的，因为替换选择对输入和输出都执行顺序处理。）想象输入和输出文件是记录流。替换选择在需要时按顺序从输入流中获取下一条记录，并一次一条记录向输出流输出运行。使用缓冲区是为了每次执行一个块的磁盘\
  \ I/O。一组记录最初被读取并保持在输入缓冲区中。替换选择逐个从输入缓冲区中移除记录，直到缓冲区为空。此时，读取下一块记录。\n\n输出到缓冲区的情况也类似：一旦缓冲区填满，它就会作为一个单元写入磁盘。\n\
  \n图 8.7 释了这一过程。\n\n替换选择的工作原理如下。假设主处理在一个大小为 `M` 条记录的数组中完成。\n\n1. 从磁盘填充数组。设置 `LAST\
  \ = M - 1`。\n2. 构建一个最小堆（`min-heap`）。记住，`min-heap` 的定义是每个节点上的记录键值都小于其子节点的键值。）\n3.\
  \ 重复直到数组为空：\n    (a) 将键值最小的记录（根节点）发送到输出缓冲区。\n    (b) 令 `R` 为输入缓冲区中的下一条记录。如果 `R`\
  \ 的键值大于刚刚输出的键值……\n        i. 则将 `R` 置于根节点位置。\n        ii. 否则用数组位置 `LAST` 处的记录替换根节点，并将\
  \ `R` 置于位置 `LAST`。设置 `LAST = LAST - 1`。\n    (c) 向下调整（Sift down）根节点以重新排序堆。\n\n当步骤\
  \ 3(b) 处的测试成功时，一条新记录被添加到堆中，最终作为运行的一部分被输出。只要来自输入文件的记录的键值大于输出到运行的最后一个键值，它们就可以安全地添加到堆中。键值较小的记录不能作为当前运行的一部分被输出，因为它们将不符合排序顺序。这些值必须存储在某处，以便以后作为另一个运行的一部分进行处理。然而，由于在这种情况下堆会减少一个元素，现在堆最后一个元素所在的位置就有了一个空隙！因此，替换选择将缓慢收缩堆，并同时利用丢弃的堆空间来存储下一次运行的记录。一旦第一个运行完成（即堆变空），数组将填满准备好用于第二次运行的记录。图\
  \ 8.8 展示了由替换选择创建的运行的一部分。\n\n很清楚，如果堆的大小为 `M`，那么运行的最小长度将是 `M` 条记录，因为至少原始在堆中的那些记录将是运行的一部分。在良好的条件下（例如，如果输入是有序的），可以产生任意长的运行。事实上，整个文件可以作为一个运行进行处理。如果条件不好（例如，如果输入是反序的），产生的运行只有\
  \ `M` 长度。\n\n## 替换选择生成的运行的预期长度是多少？\n\n可以从一个被称为“推雪器论”（snowplow argument）的类比中推出来。想象有一台推雪器在大雪但稳定的雪暴中绕着圆形轨道行驶。在推雪器至少绕一周后，轨道上的雪必须如下：在任何时刻，轨道上都有一定数量的雪\
  \ `S`。雪以恒定的速率在整个轨道上不断落下，一部分落在推雪器的“前方”，另一部分落在推雪器的“后方”。（在圆形轨道上，实际上一切都在推雪器的“前方”，但但图\
  \ 8.9 展示了这一观点。）在推雪器的下一次循环期间，轨道上所有的雪 `S` 都会被清除，加上掉落的一半。由于假设一切都处于稳态，一次循环后轨道上仍有 `S`\
  \ 的雪，因此在一个循环内必须掉落 `2S` 的雪，并且在一个循环内会清除 `2S` 的雪（留下 `S` 的雪）。\n\n在替换选择开始时，几乎所有来自输入文件的值都大于输出到该运行的最新键值（即“在推雪器的前方”），因为运行的初始键值应该是较小的。随着运行的进行...\n\
  \n\n\n\n\n# 未来的雪\n\n## 现有雪\n\n### 雪铲车的移动\n\n开始时间 `T`\n\n**图 8.9** 雪铲类比展示了雪铲车旋转一圈期间的动作。为了说明起，圆形轨道被布置成直线，并展示了横截面。在任何时间\
  \ `T`，大部分雪直接位于雪铲车正前方。随着雪铲车绕着轨道移动，铲车前的雪量始终保持不变。随着雪铲车向前移动，这些雪中在 `T` 时位于轨道上的雪较少；而在\
  \ `T` 之后落下的雪较多。\n\n最新的键值输出变得更大，因此来自输入文件的新键值更有可能太小（即“在铲车之后”）；此类记录将到数组的底部。运行（run）的总长度预计是数组大小的两倍。当然，这假设传入的键值在键值范围内均匀分布（用雪铲类比来说，我们假设雪均匀地降落在整个轨道上）。有序和反向排序的输入不符合这一预期，因此会改变运行的长度。\n\
  \n### 8.5.3 多路合并\n\n典型外部排序算法的第二阶段合并第一阶段创建的运行。假设我们有 `R` 个运行需要合并。如果使用简单的二路合并，那么 `R`\
  \ 个运行（无论其大小如何）将需要对文件进行 `log R` 次扫描。虽然 `R` 应该远小于记录的总数（因为每个初始运行都应该包含许多记录），但我们还希望进一步减少合并这些运行所需的扫描次数。注意，二路合并没有很好地利用可用内存。因为合并是对两个运行的顺序处理过程，此时内存中每个运行只需要保留一个块的记录。在任何时候在内存中保留一个运行的多个一个块，都不会减少合并过程所需的磁盘\
  \ I/O（尽管如果一次性从文件中读取多个块，至少它们利用了顺序访问）。\n\n因此，堆用于替换选择（replacement selection）刚刚使用的大部分空间（通常是许多块的长度）并没有被合并过程使用。\n\
  \n如果我们一次合并几条运行，就可以更好地利用这些空间，同时大大减少合并这些运行所需的扫描次数。\n\n多路合并与二路合并相似。如果我们有 `B` 个运行需要合并，且每个运行都有一个块在内存中可用，那么\
  \ `B` 路合并算法\n\n只需查看 `B` 个值（每个输入运行的最前端值）并选择最小的一个输出。该值从其所在的运行中移除，并重复该过程。当任何运行的当前块用尽时，将从磁盘读取该运行的下一个块。图\
  \ 8.10 展示了多路合并。\n\n## 节 8.5 外部排序\n\n301\n\n输入运行\n5 10 15 ...\n\n输出缓冲区\n6\n7\n23\
  \ ...\n5\n6\n7 10 12 ...\n12 18 20 ...\n\n**图 8.10** 多路合并示意图。检查每个输入运行的第一个值，并将最小的发送到输出。该值从输入中移除，并重复该过程。在这个例中，首先比较值\
  \ 5、6 和 12。值 5 从第一个运行中移除并发送到输出。接下来将比较 10、6 和 12。在前五个值（注：此处原文为 first five，应为前五个值）输出后，每个块的“当前”值是带有下划线的那一个。\n\
  \n概念上，多路合并假设每个运行都存储在单独的文件。然而，在实践中这并非必要。我们只需要知道每个运行在单个文件中的位置，并在我们需要从特定运行获取新数据时，使用\
  \ `seekg` 移动到相应的块。自然地，这种方法破坏了对输入文件进行顺序处理的能力。但是，如果所有运行都存储在单个磁盘驱动器上，那么处理本身就不是顺序的，因为\
  \ I/O 头会在运行之间交替。因此，多路合并将多次（潜在的）顺序扫描替换为单次随机访问扫描。如果处理本身就不是顺序的（例如当所有处理都在单个磁盘驱动器上时），这样做不会浪费任何时间。\n\
  \n多路合并可以大大减少所需的扫描次数。如果内存中有空间为每个运行存储一个块，那么所有运行可以在一次扫描中合并。因此，替换选择可以在一次扫描中构建初始运行，而多路合并可以在一次扫描中合并所有运行，产生总共两次扫描的代价。然而对于真正的大文件，运行数量可能太多，导致每个运行无法获得内存中的块。如果有足够的空间为\
  \ `B` 路合并分配 `B` 个块，且运行数量 `R` 大于 `B`，则有必要进行多次合并扫描。换句话说，合并前 `B` 个运行，然后是下 `B` 个，依此类推。这些超运行随后通过后续扫描进行合并，一次合并\
  \ `B` 个超运行。\n\n302\n\n第 8 章 文件处理与外部排序\n\n### 一次扫描可以合并多大的文件？假设堆为替换选择分配了 `B` 个块（产生平均长度为\
  \ `2B` 块的运行），然后进行 `B` 路合并，我们可以在单次多路合并中平均处理大小为 `2B²` 块的文件。在 `k` 次 `B` 路合并中平均可以处理\
  \ `2B^{k+1}` 块。为了理解这种增长有多快，假设我们有 0.5MB 可用内存，块为 4KB，产生 128 个块。平均运行大小为 1MB（内存大小的两倍）。在扫描中可以合并\
  \ 128 个运行。因此，128MB 的文件可以通过两次扫描（一次构建运行，一次合并）平均处理，使用 0.5MB 内存。作为另一个例子，假设块长度为 1KB，内存为\
  \ 1MB（1024 个块）。那么平均长度为 2MB（约 2GB）的 1024 个运行可以在单次合并扫描中合并。对于固定大小的内存，更大的块大小或更大的内存将增加一次扫描中可以处理的文件大小。两次合并扫描允许处理更大的文件。使用\
  \ 0.5MB 内存和 4KB 块，16GB 的文件可以通过两次扫描处理，这对于大多数应用程序已经足够了。因此，这是单盘外部排序的一种非常有效的算法。\n\n\
  图 8.11 显示了排序各种文件的运行时间比较，实现如下：(1) 使用两个输入运行两个输出运行的标准排序，(2) 使用可用内存大小限制的大初始运行的二路排序，以及\
  \ (3) 在生成大初始运行后执行的 R 路排序。在每种情况下，文件均由一系列四字节记录（双字节键和双字节数据值）组成，即每 MB 文件有 256K 条记录。我们从表中可以看出，即使使用适中的内存大小（两个块）来创建初始运行也能节省大量时间。对运行进行\
  \ 4 路合并提供了另一个显著的加速，然而，当 R 超过 4 或 8 个运行时，大规模多路合并并没有太大帮助，因为大量时间花在了在 R 个运行中确定下一个最小元素上。\n\
  \n总结来说，一个良好的外部排序算法会寻求执行以下操作：\n\n- 使初始运行尽可能长。\n- 在所有阶段，尽可能地重叠输入、处理和输出。\n\n\n\n\n\n\
  -   尽可能尽可能地使用工作内存。更多的内存通常会加快处理速度。事实上，更多的内存比更快的磁盘具有更大的影响。更快的 CPU 可能对外部排序的运行时间产生不大的改进，因为磁盘\
  \ I/O 速度是限制因素。\n\n## 8.6 节 延伸阅读\n\n| 文件 | 排序 1 | 排序 2 | 排序 3 | 大小（内存大小（以块为单位）） |\
