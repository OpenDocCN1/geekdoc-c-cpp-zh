  \ BSTNode<Key,E>* getmin(BSTNode<Key, E>*);\n    BSTNode<Key,E>* removehelp(BSTNode<Key,\
  \ E>*, const Key&);\n    E findhelp(BSTNode<Key, E>*, const Key&) const;\n    void\
  \ printhelp(BSTNode<Key, E>*, int) const;\npublic:\n    BST() { root = NULL; nodecount\
