  \ | 1/512 | 1/1024 |\n\n通过直接观察表格的第二行，我们可能会识别出模式 `f(n) = 1 - 1/2^n`。然后一个简单的归纳证明就可以证明这是成立的。或者，考虑如果我们没有注意到\
