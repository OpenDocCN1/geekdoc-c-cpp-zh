  \ 42, 7, 32, 40, 42, 2 插入值的结果。\n\n```cpp\n// 用于字典 ADT 的二叉搜索树实现\ntemplate <typename\
  \ Key, typename E>\nclass BST : public Dictionary<Key,E> {\nprivate:\n    BSTNode<Key,E>*\
  \ root; // BST 的根节点\n    int nodecount; // BST 中的节点数量\n    // 私有“辅助”函数\n    void\
