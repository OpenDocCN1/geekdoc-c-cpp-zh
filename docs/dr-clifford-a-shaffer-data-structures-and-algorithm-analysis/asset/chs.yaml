  \        root = inserthelp(root, k, e);\n        nodecount++;\n    }\n    // 从树中删除记录。\n\
  \    // k 要删除记录的键值。\n    // 返回：被删除的记录，如果没有则返回 NULL。\n    E remove(const Key& k)\
  \ {\n        E temp = findhelp(root, k);\n        // 实现逻辑\n    }\n};\n```\n\n\n\n\
  \n```cpp\n// 先找到它\nif (temp != NULL) {\n    root = removehelp(root, k);\n    nodecount--;\n\
  }\nreturn temp;\n}\n```\n\n图 5.14 二叉搜索树的实现。\n\n第 5 章 二叉树\n\n```cpp\n// 从字典中移除并返回根节点。\n\
  // 返回：被删除的记录，如果树为空则返回 null。\nE removeAny() {\n    // 删除最小值\n    if (root != NULL)\
  \ {\n        E temp = root->element();\n        root = removehelp(root, root->key());\n\
  \        nodecount--;\n        return temp;\n    }\n    else return NULL;\n}\n```\n\
  \n```cpp\n// 返回键值为 k 的记录，如果不存在则返回 NULL。\n// k: 要查找的键值。\n// 返回匹配 \"k\" 的某个记录。\n//\
  \ 如果存在则返回 true，否则返回 false。如果\n// 有多个记录匹配 \"k\"，则返回任意一个。\nE find(const Key& k) const\
  \ { return findhelp(root, k); }\n\n// 返回字典中记录的数量。\nint size() { return nodecount;\
