  \ 1, 2, 3, 4 和 5 的 B+ 树可以存储的记录最小和最大数量是多少？\n\n## 项目\n\n10.1 实现一个如图 10.1 和 10.2 所示的变长记录的二级线性索引。假设磁盘块长度为\
  \ 1024 字节。\n\n数据库文件中的记录长度通常在 20 到 200 字节之间，包括一个 4 字节的键值。索引文件中的每个记录应存储一个键值以及对应记录第一个字节在数据库文件中的字节偏移。顶层索引（存储在内存中）应该是一个简单的数组，存储索引文件中对应块的最小键值。\n\
  \n\n\n\n\n边从一个顶点指向另一个顶点的图（如图 11.1(b) 所示）称为有向图或漫图（digraph）。边没有方向的图称为无向图（如图 11.1(a)\
  \ 所示）。与其顶点关联标签的图（如图 11.1(c) 所示）称为标记图。如果两个顶点由边连接，则称这两个顶点相邻。这样的顶点也称为邻接。连接顶点 `U` 和\
  \ `V` 的边写为 `(U, V)`。这样的边被称为作用于顶点 `U` 和 `V`。每条边可能关联有一个代价或权重。边具有权重的图（如图 11.1(c) 所示）称为权图。\n\
  \n如果对于 `1 ≤ i < n`，存在从 `vi` 到 `vi+1` 的边，则顶点序列 `v1, v2, ..., vn` 构成一条长度为 `n − 1`\
  \ 的路径。如果路径上的所有顶点都是互不相同的，则称该路径为简单路径。路径的长度是其所包含的边数。环是一个长度为三或更多且将某个顶点 `v1` 连接到自身的路径。如果路径是简单路径（除了第一个和最后一个顶点相同外），则称该环为简单环。\n\
  \n某些图应用需要给定的顶点对之间可以有多个或并行边连接，或者一个顶点可以有一条指向自身的边。然而，书中讨论的应用不需要这两种特殊情况，因此为了简单起见，假设这些情况不会发生。\n\
  \n### 第 11.1 节 术语与表示 383\n\n**图 11.2** 具有三个连通分的无向图。顶点 `0, 1, 2, 3` 和 `4` 构成一个连通分。顶点\
  \ `5` 和 `6` 构成第二个连通分。顶点 `7` 独立构成第三个连通分。\n\n子图 `S` 是通过选择图 `G` 的顶点子集 `Vs` 和边子集 `Es`\
  \ 从 `G` 中形成的，使得对于 `Es` 中的每条边 `E`，`E` 的两个顶点都在 `Vs` 中。\n\n如果从任意顶点到任何其他顶点至少存在一条路径，则称该无向图是连通的。无向图的最大连通子图称为连通分。例如，图\
  \ 11.2 显示了一个具有三个连通分的无向图。\n\n没有环的图称为无环图。因此，没有环的有向图称为有向无环图或 DAG。\n\n自由树是一个连通的、无向的且没有简单环的图。一个等效的定义是，自由树是连通的且具有\
  \ `|V| − 1` 条边。\n\n表示图有两种常用方法。邻接矩阵如图 11.3(b) 所示。图的邻接矩阵是一个 `|V| × |V|` 数组。假设 `|V|\
  \ = n` 且顶点被标记为从 `v0` 到 `vn−1`。邻接矩阵的第 `i` 行包含顶点 `vi` 的条目。\n\n如果从 `vi` 到 `vj` 有有一条边，则第\
  \ `i` 行的第 `j` 列被标记，否则不标记。因此，邻接矩阵在每个位置上都需要一个位（bit）。或者，如果我们希望与每条边关联一个数字（例如两个顶点之间的权重或距离），则每个矩阵位置必须存储该数字。在这两种情况下，邻接矩阵的空间需求均为\
  \ `Θ(|V|2)`。\n\n图的第二种常用表示是邻接表，如图 11.3(c) 所示。邻接表是一个链表数组。该数组的长度为 `|V|`，位置 `i` 存储一个指向顶点\
  \ `vi` 的边之链表的指针。该链表通过与顶点 `vi` 相邻的顶点来表示边。因此，邻接表是第 6.3.1 节描述的树的“子节点列表”表示法的泛化。\n\n\
  **示例 11.1** 图 11.3(c) 中顶点 `0` 的条目存储了 `1` 和 `4`，因为图中有条离开顶点 `0` 的边，其中一条指向顶点 `1`，另一条指向顶点\
  \ `4`。顶点 `2` 的列表存储了顶点 `4` 的条目，因为存在从顶点 `2` 到顶点 `4` 的边，但没有顶点 `3` 的条目，因为这条边是进入顶点 `2`\
  \ 而不是流出。\n\n邻接表的存储需求取决于图中的边数和顶点数。对于每个顶点都必须有一个数组条目（即使该顶点不与任何其他顶点相邻，因此其链表中没有元素），并且每条边必须出现在其中一个列表上。因此，代价为\
  \ `Θ(|V| + |E|)`。\n\n邻接矩阵和邻接表都可以用于存储有向图或无向图。无向图中连接顶点 `U` 和 `V` 的每条边都由两条有向边表示：一条从\
  \ `U` 到 `V`，另一条从 `V` 到 `U`。图 11.4 展示了无向图中使用邻接矩阵和邻接表的情况。\n\n哪种图表示法更节省空间取决于图中的边数。邻接表仅存储图中实际出现的边的信息，而邻接矩阵则为每条可能的边留空间，无论其是否存在。然而，邻接矩阵不需要指针的开销，这可能是一项巨大的代价，特别是当图是稀疏的时。\n\
  \n**图 11.4** 用于无向图的图表示。(a) 一个无向图。(b) 该图的邻接矩阵。(c) 该图的邻接表。\n\n存储每条边的信息是一个位，用于指示其是否存在。随着图密度的增加，邻接矩阵变得相对更高效。稀疏图可能其邻接表表示法更高效。\n\
  \n**示例 11.2** 假设顶点索引需要两个字节，指针需要四个字节，边权重需要两个字节。那么图 11.3 的邻接矩阵需要 `2|V| = 50` 字节，而邻接表需要\
  \ `4|V| + 6|E| = 56` 字节。对于图 11.4，邻接矩阵的空间与之前相同，而邻接表需要 `4|V| + 6|E| = 92` 字节（因为现在有\
  \ 12 条边而不是 6 条）。\n\n邻接矩阵对算法所需的渐近代价通常比使用邻接表时高。原因是图算法通常会访问每个顶点的邻居。使用邻接表时，只检查连接到邻居的实际边。然而，邻接矩阵必须检查其\
  \ `|V|` 条可能的每条，导致在算法可能只需要 `Θ(|V| + |E|)` 的情况下产生了 `Θ(|V2|)` 的总代价。这在图稀疏时是一个显著缺点，但在图接近全满时则不是。\n\
  \n### 第 11.2 节 图的实现\n\n我们接下来转向实现通用图类的问题。图 11.5 显示了一个定义图 ADT 的抽象类。顶点由整数索引值定义。换句话说，存在顶点\
  \ 0、顶点 1 等。我们可以假设图应用程序在其他地方存储了关于给定顶点的任何其他感兴趣的信息，例如名称或与应用程序相关的值。注意，此 ADT 没有使用模板实现，因为维护与顶点本身相关的信息是\
  \ **Graph** 类使用者的责任。**Graph** 类不需要了解与顶点关联信息的类型或内容，只需要该顶点的索引号。\n\n\n\n\n\n# 图类概述\n\
  \n抽象类 `Graph` 具有返回顶点数边数的方法（分别为方法 `n` 和 `e`）。函数 `weight` 返回给定边的权重，该边通过其两个邻接顶点来标识。例如，在图\
  \ 11.1 (c) 的图上调用 `weight(0, 4)` 将返回 4。如果不存在该边，则权重定义为 0。因此，在图 11.1 (c) 的图上调用 `weight(0,\
  \ 2)` 将返回 0。\n\n函数 `setEdge` 和 `delEdge` 分别设置边的权重和从图中删除边。同样，一条边通过其两个邻接顶点来标识。`setEdge`\
  \ 不允许用户将权重设置为 0，因为该值被用于表示不存在的边，也不允许负的边权重。函数 `getMark` 和 `setMark` 分别获取和设置顶点 `V`\
  \ 在 `Mark` 数组（下文将描述）中的请求值。\n\n# 邻居遍历\n\n本章介绍的几乎每个图算法都需要访问给定顶点的所有邻居。我们提供了两种方法来支持这一操作。它们的工作方式类似于链表访问函数。函数\
  \ `first` 输入一个顶点 `V`，并返回指向 `V` 的第一个邻居的边（我们假设邻居列表按顶点编号排序）。函数 `next` 输入两个顶点 `V1` 和\
  \ `V2`，并返回在 `V1` 的边列表中位于 `V2` 之后与 `V1` 构成下一条边的顶点索引。一旦到达 `V1` 边列表的末尾，函数 `next` 将返回值\
  \ `n = |V|`。\n\n以下行出现在许多图算法中：\n```\nfor (w = G->first(v); w < G->n(); w = G->next(v,w))\n\
  ```\n这个 `for` 循环获取 `v` 的第一个邻居，然后遍历 `v` 的剩余邻居，直到返回与 `G->n()` 相等的值，该值表示 `v` 的所有邻居都已访问。例如，图\
  \ 11.4 中的 `first(1)` 将返回 0。`next(1, 0)` 将返回 3。`next(0, 3)` 将返回 4。`next(1, 4)` 将返回\
  \ 5，而 5 不是图中的顶点。\n\n# 图的实现\n\n```cpp\n// 图抽象类。此 ADT 假设顶点数量\n// 在图创建时是固定的。\nclass\
  \ Graph {\nprivate:\n    void operator =(const Graph&) {}\n    // 保护赋值\n    Graph(const\
  \ Graph&) {}\n    // 保护拷贝构造函数\npublic:\n    Graph() {}\n    // 默认构造函数\n    virtual\
  \ ~Graph() {} // 基析构函数\n    // 初始化一个 n 个顶点的图\n    virtual void Init(int n) =0;\n\
  \    // 返回：顶点数和边数\n    virtual int n() =0;\n    virtual int e() =0;\n    // 返回 v\
  \ 的第一个邻居\n    virtual int first(int v) =0;\n    // 返回 v 的下一个邻居\n    virtual int\
  \ next(int v, int w) =0;\n    // 设置边的权重\n    // i, j: 顶点\n    // wgt: 边权重\n    virtual\
  \ void setEdge(int v1, int v2, int wght) =0;\n    // 删除边\n    // i, j: 顶点\n    virtual\
  \ void delEdge(int v1, int v2) =0;\n    // 判断边是否在图中\n    // i, j: 顶点\n    // 返回：如果边\
  \ i,j 有非零权重则返回 true\n    virtual bool isEdge(int i, int j) =0;\n    // 返回边的权重\n\
  \    // i, j: 顶点\n    // 返回：边 i,j 的权重，或为 0\n    virtual int weight(int v1, int v2)\
  \ =0;\n    // 获取和设置顶点的标记值\n    // v: 顶点\n    // val: 要设置的值\n    virtual int getMark(int\
  \ v) =0;\n    virtual void setMark(int v, int val) =0;\n};\n```\n\n图 11.5 一个图 ADT。此\
  \ ADT 假设顶点数量在图创建时是固定的，但边可以添加和删除。它还支持一个标记数组以辅助图遍历算法。\n\n使用邻接列表或邻接矩阵来实现我们的图和边 ADT\
  \ 是非常直接的。这里展示的示例实现没有解决图实际上是如何创建的问题。这些实现的用户必须为此目的添加功能，也许从文件中读取图描述。可以使用 ADT 提供的 `setEdge`\
  \ 函数来构建图。\n\n图 11.6 显示了邻接矩阵的实现。数组 `Mark` 存储了由 `setMark` 和 `getMark` 函数操作的信息。对于具有\
  \ $n$ 个顶点的图，边矩阵实现为大小为 $n \\times n$ 的整数数组。矩阵中的位置 $(i, j)$ 存储存在边 $(i, j)$ 的权重。边 $(i,\
  \ j)$ 的权重为 0 则表示没有边连接这些顶点。\n\n给定一个顶点 `V`，函数 `first` 定位邻接列表中的位置。如果不存在边，`next` 返回\
  \ $n$。函数 `setEdge`、`delEdge` 和 `weight` 在原理上是直接的，关键函数是每个顶点的邻居。\n\n\n\n\n\n# 图 11.6\
  \ 邻接矩阵实现的实现。\n\n390\n第 11 章 图\n\n```cpp\n// 设置边 (v1, v2) 的权重为 \"wt\"\nvoid setEdge(int\
  \ v1, int v2, int wt) {\n    Assert(wt>0, \"Illegal weight value\");\n    if (matrix[v1][v2]\
  \ == 0) numEdge++;\n    matrix[v1][v2] = wt;\n}\n\nvoid delEdge(int v1, int v2)\
  \ { // 删除边 (v1, v2)\n    if (matrix[v1][v2] != 0) numEdge--;\n    matrix[v1][v2]\
  \ = 0;\n}\n\nbool isEdge(int i, int j) // (i, j) 是边？\n{ return matrix[i][j] != 0;\
  \ }\n\nint weight(int v1, int v2) { return matrix[v1][v2]; }\nint getMark(int v)\
  \ { return mark[v]; }\nvoid setMark(int v, int val) { mark[v] = val; }\n};\n```\n\
  \n**图 11.6**（续）\n\n## 11.3 图的遍历\n\n通常，根据图的拓扑结构按照特定顺序访问图的顶点是非常有用的。这被称为图遍历，在概念上与树遍历相似。回想一下树遍历按照指定的顺序（如前序、中序或后序）恰好访问每个节点一次。存在多种树遍历方法是因为不同的应用需要按照特定的顺序访问节点。\n\
  \n例如，要按升序打印二叉搜索树（BST）的节点，需要使用中序遍历，而不是其他遍历方式。同样，标准的图遍历顺序也存在。\n\n每种顺序都适用于解决某些问题。例如，人工智能编程中的许多问题都是使用图来建模的。问题领域可能由大量的状态集合组成，不同状态对之间存在连接。解决问题可能需要通过仅在连接之间移动，从指定的起始状态到达指定的目标状态。通常，起始状态和目标状态之间不是直接连接的。为了解决这个问题，必须以某种组织的方式搜索图的顶点。\n\
  \n图遍历算法通常从起始顶点开始，并尝试从那里访问其余顶点。图遍历必须处理许多棘手的情况。首先，可能无法从起始顶点到达所有顶点，这在图不连通时发生。其次，图可能包含环，我们必须确保环不会导致算法进入无限循环。\n\
