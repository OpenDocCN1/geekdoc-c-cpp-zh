  \ = n(n+1)/2`，那么 `f(n)/f(n-1) = (n+1)/n`。\n\n**示例 14.2** 求解求和 `sum_{i=1}^n 1/2^i`。我们将从写列出求和的前几个值的表格开始，看看能否检测到模式。\n\
