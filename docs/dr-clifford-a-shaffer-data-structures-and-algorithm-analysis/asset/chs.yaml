  \n### 7.8 第 7.5 节中快速排序的讨论使用了栈而不是递归来减少函数调用的次数。\n\n(a) 在最坏情况下，栈的深度可以达到多大？\n\n(b) 快速排序包含两次递归调用。可以修改算法以按照特定的顺序进行这两个调用。应该以什么顺序进行这两个调用？这如何影响栈的深度？\n\
  \n### 7.9 给出一个 0 到 7 的数值的排列组合，使得快速排序（如第 7.5 节所示实现）产生最坏情况的行为。\n\n### 7.10 假设 `L`\
