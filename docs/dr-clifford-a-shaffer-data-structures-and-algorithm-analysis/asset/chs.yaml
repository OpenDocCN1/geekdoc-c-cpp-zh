  \ 2-3 树，证明插入额外的 `M` 个节点需要进行 $O(M + N)$ 次节点分裂。\n\n### 14.21 实现大小未知的数组列表的一种方法是让数组增长和收缩。这被称为动态数组。在需要时，我们可以通过将数组的内容复制到新数组来增长或收缩数组。如果我们对新数组的大小非常小心，这种复制操作可以执行得足够稀少，至于影响操作的摊还代价。\n\
  \n(a) 如果数组初始大小为 1，并且当我们想要存储的元素数量超过数组大小时将数组大小翻倍，向列表插入元素的摊还代价是多少？假设插入操作本身每次操作花费 $O(1)$\
  \ 时间，因此我们只关心最小化复制到新数组的时间。\n\n(b) 考虑一种下溢策略，当数组填充率低于半时将数组大小减半。给出一个说明该策略会导致糟糕摊还代价的例子。同样，我们只感兴趣测量数组复制操作的时间。\n\
  \n(c) 给出一个比部分 (b) 建议的更好的下溢策略。你的目标是找到一种策略，其摊还分析显示对于一系列 `n` 次操作，数组复制需要 $O(n)$ 时间。\n\
  \n### 14.22 回想，如果无连图中的两个顶点之间存在路径，则它们属于同一个连通分量。寻找无连图连通分量的良好算法从对第一个顶点调用 `DFS` 开始。由\
  \ `DFS` 到达的所有顶点属于同一个连通分量并被标记。然后我们遍历数组直到发现未标记的顶点 `i`。\n\n\n\n\n在第 3.6 节中，我们将一个问题的上界定义为我们知的该问题最优算法的上界，而将下界定义为我们针对该问题的所有算法所能证明的最紧（tightest）的下界。虽然我们通常可以识别给定算法的上界，但要为所有可能的算法寻找最紧下界往往是困难的，特别是当该下界超过了通过测量必须处理的输入量决定的“平凡”下界时。\n\
  \n发现强有力的下界具有重大意义。特别是，当我们能够让一个问题的上界和下界重合时，这意味着我们在理论意义上真正理解了该问题。它还节省了我们在不存在此类算法的情况下，尝试发现更高效（渐进意义上）的算法的精力。\n\
  \n通常，确定问题下界最有效的方法是将其归约（reduction）到另一个已知下界的问题。这是第 17 章的主题。然而，当我们无法找到合适的“相似问题”时，这种方法对我们就没有帮助。本章的重点是从第一原理出发发现并证明下界。到目前为止，我们关于下界论证的最显著的例子是第\
  \ 7.9 节中的证明，即排序问题在最坏情况下是 `O(n log n)`。\n\n第 15.1 节回顾了问题的下界概念，并介绍了寻找良好算法的 Basic“算法”。第\
  \ 15.2 节讨论了列表搜索的下界，包括无序列表和有序列表。第 15.3 节处理寻找列表中的最大值，并提出了一种基于构建部分序集的选择算法模型。第 15.4\
  \ 节介绍了对抗性下界证明（adversarial lower bounds proof）的概念。第 15.5 节阐述了状态空间下界的概念。第 15.6 节给出了一种寻找列表中第\
  \ $i$ 大元素的线性时间最坏情况算法。第 15.7 节继续我们对排序的讨论，寻求一种排序列表所需的绝对比较次数最少的算法。\n\n# 15.1 下界证明引论\n\
  \n问题的下界是针对针对解决该问题的所有可能的算法所能证明的最紧（最高）下界。这可能是一个困难的标准，因为我们不可能知道任何问题的全部算法，因为在理论上算法是无限的。然而，我们通常可以根据必须检查的输入量来识别一个简单的下界。例如，我们可以认为，任何在无序列表中找到最大值的算法，其下界必须是\
  \ `Ω(n)`，因为任何算法都必须检查所有输入以确保它确实找到了最大值。\n\n在寻找最大值的情况下，我们知道有一个运行在 `O(n)` 时间的简单算法，结合任何算法都需要\
  \ `Ω(n)` 时间的事实，这是很有意义的。因为我们的上界和下界（在常数因子内）重合了，我们知道确实有一个解决该问题的“良好”算法。可能有人开发出一个比现有算法“快一点”的实现，这种快是常数因子倍的。但我们知道不可能开发出一个渐进意义上更好的算法。\n\
  \n然而，我们必须小心解释最后这一陈述。由于快速排序（`Quicksort`）的发明，世界显然变得更好了，尽管当时合并排序（`Mergesort`）已经可用。快速排序在渐进意义上并不比合并排序快，但它也不仅仅是合并排序的某种“调优”。快速排序是一种截然不同的排序方法。因此，即使当我们对一个问题的得到的上界和下界重合时，从新的、巧妙的算法中仍然可以获益。\n\
  \n现在我们对问题“我如何知道我是否有一个良好的算法来解决问题？”有了答案。如果一个算法（从渐进意义上说）的上界与问题的下界匹配，那么它就是良好的。如果它们匹配，我们就知道应该停止尝试寻找（渐进意义上）更快的算法。如果我们算法的（已知）上界与问题的（已知）下界不匹配，会怎样？\n\
  \n在这种情况下，我们可能不知道该怎么办。是我们的上界有缺陷，算法实际上比我们能证明的要快吗？还是我们的下界太弱了，问题的真实下界更大？或者我们的算法根本就不是最好的？\n\
  \n在整个讨论过程中，应当理解，任何对界的说明都必须指定考虑的是哪一类输入。我们指的是最坏情况输入的下界吗？所有输入的平均成本吗？无论我们考虑哪一类输入，所有提出的问题都同样适用。\n\
  \n现在我们确切地知道在设计算法时的目标是什么：我们想要找到一个上界与问题下界匹配的算法。结合我们目前对算法的所有知识，我们可以将思路组织成以下“设计算法的算法”：\n\
  \n```\nif the upper and lower bounds match,\n    then stop,\nelse if the bounds\
  \ are close or the problem isn’t important, then stop,\nelse if the problem definition\
  \ focuses on the wrong thing, then restate it,\nelse if the algorithm is too slow,\n\
  \    then find a faster algorithm,\nelse if lower bound is too weak,\n    then generate\
  \ a stronger bound.\n```\n\n我们可以重复这个过程，直到我们满意或精疲力竭。\n\n这让我们直接面对分析中最困难的任务之一。下界证明以极难构建而闻名。问题在于构思能够真正覆盖任何算法可能执行的所有内容的论证。\n\
  \n最常见的谬误是从某些算法实际上做了什么的观点来进行论证，并声称任何算法都必须这样做。这显然不是真的，任何涉及到必须发生的特定行为的下界证明都应该引起怀疑。\n\
  \n让我们再次考虑汉诺塔问题。回顾第 2.5 节，我们的基本算法是将 $n-1$ 个盘子（递归地）移动到中间柱子，将底盘移动到第三个柱子，然后再次递归地将 $n-1$\
  \ 个盘子从中间移动到第三个柱子。这个算法生成了递归式 `T(n) = 2T(n - 1) + 1 = 2n - 1`。因此，我们算法的上界是 `2n - 1`。但这是该问题的最优算法吗？问题的下界是多少？\n\
  \n对于我们下界证明的第一次尝试，“平凡”下界是我们必须移动每个盘至少一次，最小成本为 `n`。稍微好一点的是观察到为了将底盘移动到第三个柱子，我们必须移动其他所有盘子至少两次（一次为了离开底盘，一次为了将它们移到第三个柱子）。这产生了\
  \ `2n - 1` 的成本，但这与我们的算法仍然匹配。问题出在算法中，还是下界中？\n\n我们可以通过以下推理得到正确的下界：为了将最大的盘从第一个柱子移动到最后一个柱子，我们必须先让其他\
  \ $n-1$ 个盘子让路，而唯一的方法是将它们全部移动到中间柱子（成本至少为 `T(n - 1)`）。然后我们必须移动底盘（成本至少为一次）。之后，我们必须将剩余的\
  \ $n-1$ 个盘子从中间柱子移动到第三个柱子（成本至少为 `T(n - 1)`）。因此，任何可能的算法都无法在 `2n - 1` 步以内解决该问题。因此，我们的算法是最优的。\n\
  \n\n\n\n当然，一个问题存在不同的变体。问题定义的改变可能会也可能不会导致下界的改变。标准的汉诺塔塔问题有两种可能的变体：\n\n- 并非所有的盘子都需要从第一根柱子开始。\n\
  - 一次可以移动多个盘子。\n\n第一个变体不会改变下界（至少在渐近意义上如此）。\n第二个变体则会。\n\n## 15.2 列表搜索的下界\n\n在第 7.9\
  \ 节中，我们给了一个重要的下界证明，说明排序问题在最坏情况下是 $\\Theta(n \\log n)$。在第 9 章中，我们讨论了许多在有序和无序列表中进行搜索的算法，但我们没有对这个重要问题提供任何下界证明。在本节中，我们将通过研究无序列表和有序列表搜索的下界，扩展我们的下界证明技术库。\n\
  \n### 15.2.1 在无序列表中搜索\n\n给定一个包含 `n` 个元素的（无序）列表 `L` 和一个搜索键 `K`，我们的目标是在 `L` 中识别出一个键值为\
  \ `K` 的元素（如果存在的话）。在接下来的讨论中，我们假设 `L` 中元素的键值是唯一的，所有可能的键的集合是全序的（即操作 `<`、=` 和 `>` 对所有键值对都有定义），并且比较是找到找到两个键相对顺序的唯一方法。我们的目标是用最少的比较次数来解决这个问题。\n\
  \n根据这个搜索定义，我们可以很容易地得出标准的顺序搜索算法，也可以看到该问题的下界“显然”是 `n` 次比较。（请记住，键 `K` 可能并不真的出现在列表中。）然而，下界证明有些难以捉摸，观察它们是如何出错的是很有启发意义的。\n\
  \n**定理 15.1** 在无序列表中搜索的问题的下界是 `n` 次比较。\n\n回想起那条建议，即对任何声称某种行为“必须”发生的下界证明保持警惕，这个证明本应该引起警觉。但在这种情况下，由于问题受到了严格限制，以至于这种特定的事件序列确实没有其他（更好的）替代方案。\n\
  \n这里是我们证明该定理的第一次尝试。\n\n**证明 1：** 我们尝试使用反证法。假设存在一个算法 `A`，它只需要对 `K` 与 `L` 中的元素进行 `n\
  \ - 1`（或更少）次比较。由于 `L` 有 `n` 个元素，`A` 必须避免与某个 `L[i]` 比较 `K`。我们可以给算法输入一个 `K` 位于位置 `i`\
  \ 的输入。这种输入在我们的模型中是合法的，因此算法是错误的。\n\n这个证明正确吗？遗憾的是。首先，任何给定的算法并不一定会在 `n - 1` 次搜索中一致地跳过某个位置\
  \ `i`。例如，并不是所有算法都从左到右搜索列表。甚至不是所有算法每次遍历列表时都先搜索相同的 `n - 1` 个位置。\n\n我们可以尝试这样润色证明：**证明\
  \ 2：** 在算法的任何给定运行中，如果有 `n - 1` 个元素与 `K` 进行比较，那么某个元素位置（称为位置 `i`）就会被跳过。此时 `K` 可能位于位置\
  \ `i`，并且将无法被找到。因此，需要 `n` 次比较。\n\n遗憾，还有另一个需要修复的错误。并不是所有解决该问题的算法都必须通过比较 `L` 中的元素与\
  \ `K` 来工作。算法可能通过将 `L` 中的元素相互比较来取得有用的进展。例如，如果我们比较 `L` 中的两个元素，然后将较大的元素与 `K` 比较并发现该元素小于\
  \ `K`，那么我们就知道另一个元素也小于 `K`。直觉上似乎明显，这样的比较实际上并不会导致更快的算法，但我们如何确定呢？我们需要以某种方式将证明推广以考虑到这种方法。\n\
  \n我们现在引入一个用于表示一组对象之间值关系状态的有用抽象。全序定义了对象集合内部的关系，使得对于每一对对象，其中一个大于另一个。偏序集或 `poset` 是一个只定义了偏序的集合。也就是说，可能存在某些元素对，我们无法判断哪一个“更大”。对于我们的目的，这里的偏序是我们当前关于对象的知识状态，使得元素对之间的序关系中有零个或多个是已知的。我们可以通过绘制显示已知关系的有向有向无环图（`DAGs`）来表示这种知识，如图\
  \ 15.1 所示。\n\n**证明 3：** 起初，我们对 `L` 中元素的相对顺序或它们与 `K` 的关系一无所知。所以起初，我们可以将 `L` 中的 `n`\
  \ 个元素视为 `n` 个独立的偏序。`L` 中两个元素之间的任何比较都会影响偏序的结构。这与第 6.2 节描述的使用父指针树实现的 `UNION/FIND`\
  \ 算法有些相似。\n\n现在，`L` 中元素之间的每次比较最多可以将两个偏序合并在一起。`K` 与 `L` 中的某个元素（例如 `A`）之间的任何比较最多可以消除包含\
  \ `A` 的偏序。因此，如果我们花费了 `m` 次比较，我们至少仍有 `n - m` 个偏序。每一个这样的偏序都需要至少与 `K` 进行一次比较，以确保 `K`\
  \ 不在其中。\n\n**图 15.1** 使用 `poset` 模型对象集合之间关系的插图。使用有向无环图（`DAG`）来绘制 `poset`（假设所有边都向下）。在这个例子中，我们的知识使得\
  \ `A` 或 `B` 如何与其他对象相关。然而，我们知道 `C` 和 `G` 大于 `E`。此外，我们知道 `C` 大于 `D`，且 `E` 大于 `F`。\n\
  \n### 15.2.2 在有序列表中搜索\n\n我们现在假设列表 `L` 是有序的。在这种情况下，线性搜索仍然是最优的吗？显然不是，但为什么呢？因为我们有了在列表无序时没有的信息。我们知道标准二分搜索算法的最坏情况代价是\
  \ $O(\\log n)$。我们可以做得更好吗？我们可以使用类似于证明排序下界的证明方法，证明这在最坏情况下是可能的。\n\n我们再次使用决策树来模拟我们的算法。与搜索无序列表不同，`L`\
  \ 中元素之间的比较没有提供关于它们相对顺序的新信息，因此我们只考虑 `K` 与 `L` 中元素之间的比较。在决策树的根部，我们的知识没有排除 `L` 中的任何位置，因此所有位置都是候选。当我们根据比较\
  \ `K` 与 `L` 中元素的结果在决策树中分支时，我们逐渐排除候选。\n\n最终，我们到达树中的一个叶节点，该节点代表 `L` 中可能包含 `K` 的唯一位置。树中必须有\
  \ `n + 1` 个节点，因为我们有 `n + 1` 个 `K` 可能所在的不同（`L` 中的任何位置，加上不在 `L` 中）。树中的某些路径至少有 $\\\
  log n$ 层深，树中最深的节点代表了该算法的最坏情况。因此，在有序数组上的任何算法在最坏情况下至少需要 $\\Omega(\\log n)$ 次比较。\n\n\
  我们可以修改这个证明来寻找平均代价下界。再次，我们使用决策树模拟算法。只是现在我们感兴趣的不是最深节点的深度（最坏情况）以及具有最深节点的树。相反，我们感兴趣的是最小可能的值是\n\
  \n\n\n\n# 第 15.3 节寻找最大值\n\n对于叶子节点的“平均深度”。将总路径长度定义为每个节点层级的和。一个结果的代价是对应节点的层级加 1。算法的平均代价是所有结果的平均代价（总路径长度/n）。哪种树的平均深度最小？这等同于与二分查找对应的树。因此，二分查找在平均情况下是最优的。\n\
  \n虽然在对排序数组进行搜索时，二分查找在最坏和平均情况下确实是列表的最优算法，但存在许多情况可能会导致我们选择其他算法。一种可能性是我们对数组中数据的分布有所了解。在第\
  \ 9.1 节中我们看到，如果 `L` 中的每个位置持有 `X` 的概率相等的（等同于数据在整个键范围内分布良好），那么插值查找在平均情况下的复杂度为 `Θ(log\
  \ log n)`。如果数据未排序，那么使用二分查找就需要我们付出预先排序列表的代价，这只有在对列表进行多次（至少为 `O(log n)` 次）搜索时才是值得的。二分查找还要求列表（即使已排序）必须使用数组或其他某些结构实现，该结构要支持以等代价随机访问所有元素。最后，如果我们提前知道所有的搜索请求，我们可能倾向于按照频率对列表排序，并在极端搜索分布下进行线性查找，正如第\
  \ 9.2 节讨论的那样。\n\n## 15.3 寻找最大值\n\n我们如何在排序列表中找到第 i 大的值？显然，我们只需要跳到第 i 个位置即可。但如果我们有一个未排序的列表呢？我们能做得比排序更好吗？如果我们寻找的是最小值或最大值，显然可以做得比排序更好。这对于第二大值也是真的吗？对于中位数呢？在随后的章节中，我们将研究这些问题。在本节中，我们将重新考虑在未排序列表中寻找最大值的简单问题，继续我们对下界证明的检验。\n\
  \n这是一个寻找最大值的简单算法。\n\n```cpp\n// 返回大小为 \"n\" 的 \"A\" 中最大值的位置\nint largest(int A[],\
  \ int n) {\n    int currlarge = 0; // 保存最大元素的位置\n    for (int i=1; i<n; i++) {\n\
  \        // 遍历每个数组元素\n        if (A[currlarge] < A[i]) // 如果 A[i] 更大\n         \
  \   currlarge = i;\n    }\n    // 记住它的位置\n    return currlarge; // 返回最大值的位置\n}\n\
  ```\n\n显然，这个算法需要 `n` 次比较。这是最优的吗？直觉上这应该是的，但让我们尝试证明它。（在继续阅读之前，你可能尝试写下自己的证明。）\n\n**证明\
  \ 1：** 胜者必须与所有其他元素比较，因此必须有 `n − 1` 次比较。\n\n这个证明显然是错误的，因为胜者并不需要显式地与所有其他元素比较就能识别出来。例如，标准的单淘汰制体育锦赛只需要\
  \ `n − 1` 次比较，获胜者并不与每一个对手比赛过。所以让我们再试一次。\n\n**证明 2：** 只有胜者没有失败。有 `n − 1` 个失败者。单次比较产生（最多）一个（新的）失败者。因此，必须有\
  \ `n − 1` 次比较。\n\n这个证明是成立的。然而，稍后我们将像第 15.2.1 节中那样，通过引入偏序（posets）的概念来抽象它。我们可以将寻找最大值的问题看作是从一个没有已知关系的偏序开始，因此集合中的每个成员都在自己独立的单元素\
  \ DAG（有向无环图）中。\n\n**证明 2a：** 为了找到最大值，我们从由 `n` 个单个元素的 DAG 组成的偏序开始，我们必须构建一个包含所有元素并在同一个\
  \ DAG 中的偏序，使得存在一个最大值（隐含有 `n − 1` 个失败者）。我们希望用最少数量的连接将偏序元素连接成单个 DAG。这至少需要 `n − 1`\
  \ 条连接。单次比较最多提供一条新连接。因此，必须进行至少 `n − 1` 次比较。\n\n`largest` 的平均代价是多少？因为总是总是相同次数的比较，显然必须花费\
  \ `n − 1` 次比较。我们还可以考虑 `largest` 必须执行的赋值次数。函数 `largest` 可能在 `for` 循环的任何迭代中执行一次赋值。\n\
  \n由于这个事件确实发生（或不发生），如果我们没有关于分布的任何信息，我们可以猜测在每次比较后进行赋值的概率为一半。但这显然是错误的。事实上，`largest`\
  \ 在第 i 次迭代中执行赋值，当且仅当 `A[i]` 是前 `i` 个元素中最大的。假设所有排列都是等概率的，那么这种情况成立的概率为 `1/i`。因此，执行的赋值平均次数为\
  \ `\\sum_{i=1}^{n} \\frac{1}{i}`，即调和级数 `H_n`。`H_n = Θ(log n)`。更准确地说，`H_n` 接近 `log_e\
  \ n`。\n\n这个平均值有多“可靠”？也就是说，程序的单次运行会偏离平均代价多少？根据切比雪夫不等式（Čebyšev’s Inequality），观测值落在均值两个标准差范围内的至少至少\
  \ 75%。\n\n对于 `largest`，方差为 `H_n - \\sum_{i=1}^{n} \\frac{1}{i²}`。因此，标准差约为 `log_e\
  \ n`。这种波动是窄的还是宽的？与平均值相比，这种离散程度相当大。\n\n## 15.4 对抗下界证明\n\n我们的下一个问题是在集合中寻找第二大值。考虑在标准淘汰赛中发生了什么。即使我们假设“最好”球队在每场比赛中都获胜，第二强的也是决赛中输的人吗？我们可能预期第二强的会输给最好的，但他们可能在任何时候相遇。\n\
  \n让我们通过标准的“寻找”过程，首先提出一个算法，然后给出下界，并看看它们是否匹配。与我们对大多数问题的分析不同，这一次我们将计算比较的具体次数并尝试最小化该次数。寻找第二大值的简单算法是首先找到最大值（花费\
  \ `n − 1` 次比较），将其丢弃，然后找到剩余元素的最大值（花费 `n − 2` 次比较），总代价为 `2n − 3` 次比较。这是最优的吗？这看起来怀疑，但让我们现在进入尝试证明下界的步骤。\n\
  \n**定理 15.2** 寻找第二大值的下界是 2n-3。\n\n**证明：** 任何输给除最大值以外元素的元素都不可能是第二大的。因此，第二名的候选人只有那些输给最大值的元素。\n\
  \n函数 `largest` 可能会将最大元素与其他 `n − 1` 个元素比较。因此，我们可能需要额外的 `n − 2` 次比较来寻找第二大值。\n\n这个证明是错误的。它表现了必要性谬误：“我们的算法做了某事，因此解决该问题的算法都必须这样做。”\n\
  \n这使得目前最好的下界论据是：寻找第二大值的代价至少与寻找最大值的代价一样，即 n − 1。\n\n让我们再次尝试通过采用分治策略来寻找一个更好的算法。如果我们把列表分成两半，并在每个部分上运行\
  \ `largest` 呢？然后我们可以比较这两个获胜者（我们现在总共使用了 n − 1\n\n\n\n\n（比较），并从胜者所在的部分中移除该胜者。对胜者所在的部分再次调用\
  \ `largest` 可以得到其第二优者。最后与另一部分的获胜者进行一次比较，就能得到真正的第二名。总成本为 `d3n/2e − 2`。这是最优的吗？如果我们将列表分成四部分呢？最好的结果是\
  \ `d5n/4e`。\n\n如果我们把列表分成八部分呢？那么成本大约是 `d9n/8e`。\n\n注意，随着我们将列表分成越来越多的部分，部分获胜者之间的比较就变成了一个更关注的问题。\n\
  \n502\n\n第 15 章 下界\n\n**图 15.2** 构建二项树的示例。元素对之间通过选择其中一个父节点作为整棵树的根来组合。给定两个大小为四的树，选择其中一个根作为合并后的八节点节点树的根。\n\
  \n从另一个角度来看，获得第二名的唯一候选者是那些输给最终获胜者的元素，我们的目标是让这类元素尽可能少。因此，我们需要跟踪在与（最终）获胜者直接比较中输掉的元素集合。我们还观察到，当两个竞争者已知都比相同数量的其他值大时，我们从比较中学到的信息最多。因此，我们希望安排比较，与“实力相当”的竞争者进行。\n\
  \n我们可以通过二项树完成所有这一切。高度为 `m` 的二项树有 `2m` 个节点。它是一个单节点（如果 `m = 0`），或者是两个高度为 `m − 1` 的二项树，其中一棵树的根变成另一棵树的节点。图\
  \ 15.2 展示了如何构建具有八节点的二项树。\n\n所得算法原理上很简单：为所有 `n` 个元素构建二项树，然后比较根的 `dlog ne` 个孩子以找到第二名。\n\
  \n我们可以将二项树存储为显式的树结构，并以比较次数的线性时间轻松地构建它，因为每次比较仅需添加一个链接。由于二项树的形状受到严格限制，我们也可以在数组中隐式地存储二项树，就像我们处理堆一样。假设数组中有两棵各有\
  \ `2k` 个节点的树。第一棵树位于位置 `1` 到 `2k`。第二棵树位于位置 `2k + 1` 到 `2k+1`。每个子树的根位于该子树在数组中的最终位置。\n\
  \n要合并两棵树，我们只需比较子树的根。如有必要，交换子树，使得具有较大根元素的树成为第二个子树。这是用空间（我们只需要数据值的空间，不需要节点指针）换取时间（在最坏情况下，所有数据交换可能花费\
  \ `O(n log n)`，尽管这不会影响所需的比较次数）。注意，对于某些应用，这是一个重要的观察，即数组的数据交换不需要任何比较。如果比较仅仅是两个整数之间的检查，那么移动数组中的半部分值显然太昂贵了。但如果一次比较要求在两支体育队之间进行一场比赛，那么少量（甚至大量）记录工作带来的成本就变得无关紧要了。\n\
  \n由于二项树的根有 `log n` 个孩子，且构建树需要 `n − 1` 次比较，该算法所需的比较次数为 `n + dlog ne − 2`。这明显比我们之前的算法更好。它是最优的吗？\n\
  \n第 15.4 节 对抗下界证明 503\n\n我们现在回到尝试改进下界证明。为了做到这一点，我们引入了对抗者（adversary）的概念。对抗者的工作是让算法的成本最高。想象对抗者保留了一个所有可能的输入列表。我们将算法看作向对抗者询问有关算法输入的信息。对抗者可能永远不会撒谎，因为它的答案必须与之前的答案一致。但它被允许根据自己的意愿“重新排列”输入，以将算法的总成本推得尽可能高。特别是当算法提问时，对抗者必须以与至少一个剩余输入一致的方式来回答。然后，对抗者划掉所有与该答案不一致的剩余输入。记住，计算机程序内部并没有一个真实存在的对抗者实体，我们也没有实际上修改程序。对抗者仅仅作为一种分析设备运行，帮助我们对程序进行推理。\n\
  \n作为对抗者概念的一个例子，考虑标准的猜字游戏（Hangman）。玩家 A 选一个单词，并告诉玩家 B 该单词有多少个字母。\n\n玩家 B 猜不同的字母。如果\
  \ B 猜中了单词中的某个字母，那么 A 将指示明单词中哪些位置有该字母。玩家 B 在失败之前被允许对单词中没有的字母进行有限次数的猜测。\n\n在猜字游戏的例子中，想象对抗者持有一个某个选定长度的单词字典。每当玩家猜一个字母时，对抗者都会查询字典并决定是通过接受该字母（并指示它所在的位置）还是说它不在单词中来消除更多单词。对抗者可以做出它所选择的任何决定，只要字典中至少有一个单词与所有决策一致即可。通过这种方式，对抗者希望让玩家猜尽可能多的字母。\n\
  \n在解释对抗者如何在我们的下界证明中发挥作用之前，首先观察到至少有 `n − 1` 个值至少输一次。这至少需要 `n − 1` 次比较。此外，至少有 `k −\
  \ 1` 个值输给第二大的值。也就是说，胜者必须被比较。至少需要 `n + k − 2` 次比较。问题是：我们能让 `k` 变得多低？\n\n将元素 `A[i]`\
  \ 的强度定义为比它（已知）大的元素数量。如果 `A[i]` 的强度为 `a`，而 `A[j]` 的强度为 `b`，那么胜者的强度为 `a + b + 1`。算法知道每个元素的（当前）强度，并可以选择比较哪两个元素。对抗者决定谁获胜。对抗者的什么策略会导致算法从任何给定比较中学到的信息最少？它应该最小化元素提高强速率。这可以通过让强度较大的元素获胜来实现。这是对抗者的“公平”用法，因为它代表了提供最坏输入的结果。\n\
  \n504\n\n第 15 章 下界\n\n为了减少最坏情况的影响，算法的最佳策略是通过平衡竞争者的强度来最大化最小改进。从算法的角度来看，最好的结果是元素翻倍。这发生在\
  \ `a = b` 时，其中 `a` 和 `b` 是比较的两个元素的强度。所有强度都从零开始，因此当 `2k−1 < n ≤ 2k` 时，胜者必须进行 `k`\
  \ 次比较。因此，至少需要 `n + dlog ne − 2` 次比较。我们的算法是最优的。\n\n15.5\n\n状态空间下界证明\n\n我们现在考虑从一个（无排序）值列表中找到最小值和最大值的问题。如果我们想知道要绘制的值的范围，以便绘制图表的刻度，这可能很有用。\n\
  \n当然，我们可以独立地通过 `2n − 2` 次比较找到它们。一种微小的改进是通过 `n − 1` 次比较找到最大值，从列表中移除，然后通过 `n − 2`\
  \ 次比较找到最小值，总共 `2n − 3` 次比较。我们能做得更好吗？\n\n\n\n在继续之前，请思考一下，寻找最小值和最大值的问题与上一节中寻找第二大值（隐含为最大值）的问题相比如何。你认为这两个问题中哪一个更难？对于你来说，一个问题比另一个更难或更简单可能并非显而易见。直觉可以支持这两种情况。一方面，直觉可能认为，寻找最大值的过程对于第二大值提供的信息，应该比该过程对最小值提供的信息要多；另一方面，任何给定的比较都能告诉你两个值中哪一个可以是最大值的候选，，哪一个可以是最小值的候选，从而在两个方向上取得进展。\n\
  \n我们将首先考虑一种简单的分而治法来寻找最小值和最大值。将列表分成两部分，并找到每个部分的最小值和最大值。然后通过额外的两次比较两个最小值和最大值，得到最终结果。算法如图\
  \ 15.3 所示。\n\n该算法的代价可以通过以下递归方程进行建模。\n\n```\nT(n) = {0 n=1; 1 n=2; T(bn/2c) + T(dn/2e)\
  \ + 2 n>2}\n```\n\n这是一个相当有趣的递归方程，它的解介于 `3n/2 − 2`（当 `n = 2^i` 或 `n = 2^i \\pm 1`\
  \ 时）和 `5n/3 − 2`（当 `n = 3 × 2^i` 时）。我们可以从这种行为推断出，我们划分列表的方式影响算法的性能。\n\n第 15.5 节 状态空间下证明\
  \ 505\n\n```cpp\n// 返回 A 中位置 l 和 r 之间的最小值和最大值\ntemplate <typename E>\nvoid MinMax(E\
  \ A[], int l, int r, E& Min, E& Max) {\n    if (l == r) {\n        // n=1\n    \
  \    Min = A[r];\n        Max = A[r];\n    }\n    else if (l+1 == r) { // n=2\n\
  \        Min = min(A[l], A[r]);\n        Max = max(A[l], A[r]);\n    }\n    else\
  \ {\n        // n>2\n        int Min1, Min2, Max1, Max2;\n        int mid = (l +\
  \ r)/2;\n        MinMax(A, l, mid, Min1, Max1);\n        MinMax(A, mid+1, r, Min2,\
  \ Max2);\n        Min = min(Min1, Min2);\n        Max = max(Max1, Max2);\n    }\n\
  }\n```\n\n图 15.3 在数组中寻找最小值和最大值的递归算法。\n\n例如，如果列表中有六个元素呢？如果我们将列表分成两个包含三个元素的子列表，代价将是\
  \ 8。如果我们将列表分成一个大小为二和一个大小为四的子列表，那么代价仅为 7。\n\n在分而治法中，最好的算法是工作量最小的算法，而不一定是平衡输入大小的算法。从这个例子中学到的教训是，注意\
  \ `n` 较小时发生的情况很重要，因为列表的任何划分最终都会产生许多小列表。\n\n我们可以通过以下递归方程对该问题的所有可能的分而治策略进行建模。\n\n\
  ```\nT(n) = {0 n=1; 1 n=2; min1≤k≤n−1{T(k) + T(n − k)} + 2 n>2}\n```\n\n也就是说，我们想要找到一种划分列表的方法，使总工作量最小。如果我们检查各种划分小列表的方法，最终会发现，将列表分成一个大小为\
  \ 2 和一个大小为 `n − 2` 的子列表产生的结果将与任何其他划分一样好。这种策略产生了以下递归方程。\n\n```\nT(n) = {0 n=1; 1\
  \ n=2; T(n − 2) + 3 n>2}\n```\n\n506 第 15 章 下界\n\n该递归方程（以及相应的算法）产生了 `T(n) = d3n/2e\
  \ − 2` 次比较。这是最优的吗？我们现在向下界证明技术工具箱中引入另一个工具：状态空间证明。\n\n我们将通过定义算法在任何给定时刻必须处于的状态对算法进行建模。然后我们可以定义起始状态、结束状态以及任何算法可以支持的状态之间的转换。从这里，我们将推导出算法从开始到结束必须经过的最少状态数，以达到状态空间下界。\n\
  \n在任何给定时刻，我们可以跟踪以下四类元素：\n\n*   未测试（Untested）：尚未测试的元素。\n*   胜利者（Winners）：至少胜过一次且从未输过的元素。\n\
  *   失败者（Losers）：至少输过一次且从未胜过的元素。\n*   中间（Middle）：既胜过也输过一次的元素。\n\n我们将当前状态定义为四个值的向量\
  \ `(U, W, L, M )`，分别代表未测试、胜利者、失败者和中间。对于一个包含 `n` 个元素的集合，初始状态为 `(n, 0, 0, 0)`，结束状态为\
  \ `(0, 1, 1, n-2)`。在任何给定时刻，我们可以跟踪以下四类元素：\n\n*   未测试：尚未测试的元素。\n*   胜利者：至少胜过一次且从未输过的元素。\n\
  *   失败者：至少输过一次且从未胜过的元素。\n*   中间：既胜过也输过一次的元素。\n\n（注：原文后续存在大量重复段落，此处已根据要求去重保留核心内容）\n\
  \n\n\n观察快速排序算法可能会为解决中位数问题提供一些启示。回想，快速排序的工作原理是选择一个基准值（pivot），将数组分为小于基准值的元素和大于基准值的元素，并将基准移动到它在数组中的正确位置。如果基准值位于位置\
  \ `i`，则我们完成了。如果没有，我们可以通过只考虑其中一个子列表来递归地解决子问题。也就是说，如果基准值落在位置 `k > i`，我们只需通过在左侧分区中寻找第\
  \ `ith` 个优元素来解决。如果基准值位于位置 `k < i`，我们希望在右侧分区中寻找第 `i − kth` 个元素。\n\n**图 15.5** 一种为列表划分寻找基准值的方法，该方法保证至少有固定比例的列表位于每个分区中。我们将列表分成五元素一组组，并找到每组的中位数。然后我们递归地找到这\
  \ `n/5` 个中位数的中位数。五个元素的中位数保证每个分区中至少有两个元素。在 15 个元素的集合中，三个中位数的中位数保证每个分区中至少有五个元素。\n\n\
  该算法的最坏情况代价是多少？与快速排序一样，如果基准值是数组中的第一个或最后一个元素，我们的性能就会糟糕。这可能导致 `O(n2)` 的性能。然而，如果基准值总是将数组一对半，那么我们的代价将由递归式\
  \ `T(n) = T(n/2) + n = 2n` 或 `O(n)` 代价建模。\n\n寻找平均代价我们需要使用带有完整历史的递归式，类似于我们用于模拟快速排序代价的递归式。如果我们这样做，将会发现在平均情况下\
  \ `T(n)` 是 `O(n)` 的。\n\n是否可能修改我们的算法以获得最坏情况下的线性时间？为了做到这一点，我们需要选择一个保证丢弃固定比例元素的基准值。我们不能随机选择基准值，因为这样做无法满足该保证。理想的情况是如果我们每次都能选择中位数作为基准值。但这本质上与我们最初试图解决的问题是相同的问题。\n\
  \n然而，请注意，如果我们选择任何常数 `c`，然后从大小为 `n/c` 的样本中选取中位数，那么我们就可以保证至少丢弃 `n/2c` 个元素。实际上，我们可以通过选择常数大小的小子集来做得更好（这样我们可以在常数时间内找到每组的中位数），然后取这些中位数的中位数。图\
  \ 15.5 描述了这一思想。这一观察直接引出了以下算法：\n\n* 从列表中为五元素一组选出 `n/5` 个中位数。选取五个项目的中位数可以在常数时间内完成。\n\
  * 递归地选择 `M`，即 `n/5` 个“五元素中位数”的中位数。\n* 将列表分为大于 `M` 和小于 `M` 的元素。\n\n虽然通过这种方式选择中位数保证了消除一部分元素（最多留下\
  \ `d(7n − 5)/10e` 个元素），但我们仍然需要确保我们的递归产生线性时间算法。我们通过以下递归式对算法建模：\n\n`T(n) ≤ T(dn/5e)\
  \ + T(d(7n − 5)/10e) + 6dn/5e + n − 1`\n\n`T(dn/5e)` 项来自计算“五元素中位数”的中位数，`6dn/5e`\
  \ 项来自计算“五元素中位数”的代价（每组五个元素恰好六次比较），而 `T(d(7n−5)/10e)` 项来自对剩余（最多）70%可能剩下的元素的递归调用。\n\
  \n我们将通过假设该递归式对于某个常数 `r` 成立来证明该递归是线性的，然后证明对于所有大于某个边界的 `n`，`T(n) ≤ rn`。\n\n```\nT(n)\
  \ ≤ T(dn/5e) + T(d(7n − 5)/10e) + 6dn/5 + n − 1\nT(n) ≤ r(dn/5) + r(d(7n−5)/10)\
  \ + 6dn/5 + n − 1\nT(n) ≤ (rd/5 + 7rd/10 + 6d/5 + 1)n − 1\nT(n) ≤ ((2rd + 7rd +\
  \ 12d)/10 + 1)n\nT(n) ≤ (21rd/10 + 1)n\n```\n\n这对于 `r ≥ 2/3` 和 `n ≥ 380` 成立。这提供了一个基础情况，允许我们使用归纳法证明\
  \ `∀n ≥ 380, T(n) ≤ 2/3n`。\n\n在现实中，这个算法并不实用，因为它的常数因子代价太高。为了保证线性时间性能做了太多的工作，以平均而言，依靠运气选择基准值更高效，例如通过随机选取或从当前子数组中选取中间值。\n\
  \n## 最优排序\n\n我们通过尝试寻找比较次数绝对最少的排序算法来结束本节。结果对于对于通用排序算法来说可能是不实用的。但请回想我们之前对体育锦赛的类比。\n\
  \n\n\n图 15.6 展示了我们可能进行比较的另一种组织方式。首先，我们比较第一个和第二个元素，以及第三和第四个元素。然后比较这两个胜者，产生一个二项树。我们可以将其视为一个由三个元素组成的（排序后的）链，其中元素\
  \ A 挂在根节点上。如果我们随后将元素 B 插入到这三个元素的排序链中，我们将得到图 15.6 右侧所示的两个偏序集之一，代价为 2 次比较。然后我们可以将\
  \ A 合并到链中，代价为两次比较（因为我们已经知道它比一个或两个元素中的任何一个小，我们实际上是将其合并到一个包含两个或三个元素的列表中）。因此，排序五个元素所需的总比较次数最多为七次，而不是八次。\n\
  \n如果有十个元素需要排序，我们可以先分成五对元素（使用五次比较），然后使用上述描述的算法对这五个胜者进行排序（再使用七次比较）。现在，我们需要做的是处理原始的失败者。我们可以将此过程推广到任意数量的元素：\n\
  \n*   使用 `b \\ n c` 次比较将所有节点配对。\n*   递归地排序胜者。\n*   折叠失败者。\n\n**图 15.6** 五个元素排序的比较组织方式。首先我们对两对元素进行排序，然后比较两个胜者以形成一个包含四个元素的二项树。根节点对应的原始失败者标记为\
  \ A，其余三个元素形成一个排序链。然后我们将元素 B 插入到该排序链中。最后，我们将 A 放入生成的链中，得到一个最终的排序列表。\n\n我们使用二分插入法放置失败者。然而，我们可以自由选择插入的最优顺序，同时考虑到二分查找对于\
  \ `2i` 到 `2i+1 − 1` 个元素的代价是相同的。例如，对于大小为 4, 5, 6 或 7 的列表，二分查找在最坏情况下需要三次比较。因此，我们选择插入顺序来优化二分查找，这意味着选择一种能够避免子列表大小增长到跨越列表边界导致需要额外比较的顺序。这种排序被称为合并插入排序（merge\
  \ insert sort），也称为福德-约翰逊排序（Ford and Johnson sort）。\n\n对于十个元素，给定图 15.7 所示的偏序集，我们按照元素\
  \ 3、元素 4、元素 1 最后是元素 2 的顺序折叠最后四个元素（标记为 1 到 4）。元素 3 将插入到一个大小为三个列表中，花费两次比较。根据元素 3 最终列表中的位置，元素\
  \ 4 将插入到大小为 2 或 3 的列表中，两种情况下都是两次比较。根据元素 3 和 4 在列表中的位置，元素 1 将插入到大小为 5, 6 或 7 的列表中，这些都需要三次比较来排序排序。最后，元素\
  \ 2 将插入到大小为 5, 6 或 7 的列表中。\n\n### 15.7 最优排序\n\n合并插入排序非常好，但它是最优的吗？回顾第 7.9 节，任何排序算法都不可能快于\
  \ $\\Omega(n \\log n)$。准确地说，排序的信息论下界可以证明为 `d\\log n!`。也就是说，我们可以证明比较次数下界恰好为 `d\\\
  log n!`。对于直到 `n = 12` 的所有值，合并插入排序给出的比较次数等于这个信息论下界。在 `n = 12` 时，合并插入排序需要 30 次比较，而信息论下界仅为\
  \ 29 次比较。然而，对于如此少的元素，可以对每种可能的比较安排进行详尽研究。事实证明，当 `n = 12` 时，实际上没有任何比较安排能让下界小于 30 次。因此，在这种情况下，信息论下界是低估的，因为\
  \ 30 次确实是能做到的。\n\n**图 15.7** 十个元素的合并插入排序。首先比较五对元素。然后对五个胜者进行排序。这留下了标记为 1-4 的元素排序到由其余六个元素组成的链中。将\
  \ `n` 个元素的最坏情况代价称为 `S(n)`。我们知道 `S(n + 1) ≤ S(n) + d\\log(n + 1)`，因为我们可以排序 `n` 个元素，并对最后一个元素使用二分插入。对于所有的\
  \ `n` 和 `m`，`S(n + m) ≤ S(n) + S(m) + M(m, n)`，其中 `M(m, n)` 是合并两个排序列表的最佳时间。对于 `n\
  \ = 47`，事实证明通过将列表分成大小为 5 和 42 的片段然后合并可以做得更好。因此，合并排序并不是完全最优的。但它非常出色，并且对于较少的元素数量接近最优。\n\
  \n### 15.8 扩展阅读\n\n书中的大部分内容也出现在许多其他关于数据结构和算法的教科书中。最大的例外是，没有多少其他教科书像本章这样详细地涵盖了下界证明。那些关注相同示例问题（搜索和选择）的教科书，是因为它就相关主题讲述了一个如此紧凑且引人入胜的故事，同时展示了下界证明的主要技术。此类教科书的例子是\
  \ Baase 和 Van Gelder 的《Computer Algorithms》[BG00]，以及 Gregory J. Rawlins 的《Compared\
  \ to What?》[Raw92]。Brassard 和 Bratley 的《Fundamentals of Algorithmics》[BB96] 也涵盖了下界证明。\n\
  \n### 15.9 练习\n\n1.1 考虑 15.1 节中所谓的“算法”。这真的是算法吗？回顾第 1.4 节的算法定义。哪些部分适用，哪些部分不适用？这种“算法”是寻找良好算法的启发式方法吗？为什么？\n\
  \n1.2 单淘汰赛以调度困难而闻名。假设你正在为 `n` 个小组组织比赛（你可以假设 `n = 2i`，`i` 为整数）。我们将进一步简化，假设每场比赛不到一小时，并且在需要时每个小组都可以安排一场比赛。（注意，这里关于球场的所有论也适用于解决最大问题的并行算法）。\n\
  (a) 为了最小化总时间，我们需要多少个篮球球场？\n(b) 在这种情况下，比赛持续多久？\n(c) 可用的总“场时”是多少？总使用了多少场时？有多少空闲的场时？\n\
  (d) 修改算法以减少所需的球场总数，可以不让每个小组都参赛。这将增加比赛的总时间，但尽量使增加尽可能少。对于你的新算法，比赛持续多久？需要多少个球场？总场时是多少？总使用了多少场时？有多少空闲的场时？\n\
  \n1.3 解释为什么为了找到最小值和最大值，将大小为六的列表拆分为两个大小为三的列表需要八次比较，而将列表拆分为一个大小为二和一个大小为四的列表只需要七次比较。\n\
  \n1.4 写出一个对于所有 `n ≤ 13` 的值，找到最小值和最大值所需的比较次数表。\n\n1.5 使用对手证法作为下界证明，证明在最坏情况下，找到 `n`\
  \ 个值的最大值需要 `n - 1` 次比较。\n\n1.6 使用对手证法作为下界证明，证明在 `n` 个元素中搜索值为 `X` 的元素（如果存在）时，最坏情况下需要\
  \ `n` 次比较。\n\n1.7 第 15.6 节声称，通过选择一个至少丢弃剩余数组固定比例 `c` 的基元，所得算法将是线性的。\n\n\n\n解释为什么这是正确的。提示：主定理（定理\
  \ 14.1）可能对你有帮助。\n\n15.8 证明任何寻找中位数的基于比较的算法必须使用至少 `n - 1` 次比较。\n\n15.9 证明任何寻找 `n`\
  \ 个值中次小值的基于比较的算法都可以扩展为也能寻找最小值，而不需要执行任何额外的比较。\n\n15.10 证明任何基于比较的排序算法都可以修改为删除所有重复项，而不需要执行任何额外的比较。\n\
  \n15.11 证明任何从值列表中移除重复项的基于比较的算法必须使用 `Ω(n log n)` 次比较。\n\n15.12 给定一个包含 `n` 个元素的列表，如果某个元素出现的次数超过\
  \ `n/2` 次，则该元素为列表的多数数。\n\n### 第 15 章 下界\n\n(a) 假设输入是一个整数列表。设计一种算法，在最坏情况下整数与整数之间的比较次数是线性的，该算法能够找到并报告存在的多数数；如果列表中不存在这样的整数，则报告不存在多数数。\n\
  \n(b) 假设输入是一个没有相对顺序的元素列表，例如颜色或水果。因此当你比较两个元素时，所能做的只是询问它们相同。设计一种算法，在最坏情况下元素与元素之间的比较次数是线性的，该算法能够找到存在的多数数；如果列表中不存在这样的元素，则报告不存在多数数。\n\
