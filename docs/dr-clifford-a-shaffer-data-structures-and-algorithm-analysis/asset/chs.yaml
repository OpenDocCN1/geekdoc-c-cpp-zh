  }\n```\n\n那些不熟悉递归的人可能很难接受它主要被用作简化算法设计和描述的工具。\n\n\n\n\n学会如何编写良好的证明在许多方面都有帮助。首先，它能理清你的思路，反过来又让你的解释更加清晰。其次，如果你使用了标准的证明结构（例如反证法或归纳证明），那么你和读者都将基于对该结构的共同理解来工作。这使得读者理解你的证明时，复杂性更低，因为读者不需要从零开始解码你论证的结构。\n\
  \n本节简要介绍了三种常用的证明技术：(i) 演绎，或直接证明法；(ii) 反证法，以及 (iii) 数学归纳法。\n\n## 2.6 数学证明技术\n\n###\
  \ ### 直接证明法 (Direct Proof)\n\n通常情况下，直接证明法就是“逻辑解释”。直接证明法有时被称为推演绎论证。这简单来说就是基于逻辑的论证。它通常用英语编写，并使用“如果……那么……”等词汇，也可以使用逻辑符号如\
  \ `P ⇒ Q` 来编写。即使我们不想使用符号逻辑符号，仍然可以利用逻辑的基本定理来构建我们的论证。例如，如果我们想证明 `P` 和 `Q` 是等价，我们可以先证明\
  \ `P ⇒ Q`，再证明 `Q ⇒ P`。\n\n在某些领域中，证明本质上是从起始状态到结束状态的一系列状态变化。形式谓词逻辑可以这样来看，各种“逻辑规则”被用于在通往目的地的路径上，通过改变一个公式或组合几个公式来生成新公式。在入门微积分课程中求解积分问题的符号运算在精神上是相似的，高中的几何证明也是如此。\n\
  \n### ### 反证法 (Proof by Contradiction)\n\n反驳一个定理或陈述最简单的方法是找到该定理的反例。遗憾的是，支持一个定理的例子再多也不足以证明该定理是正确的。然而，有一种方法与通过反例反驳的方法非常相似，被称为反证法。\n\
  \n要通过反证法证明一个定理，我们首先假设该定理是假的。然后我们找到从该假设得出的逻辑矛盾。如果用于寻找矛盾的逻辑是正确的，那么解决矛盾的唯一方法就是承认“定理是假的”这一假设是错误的。也就是说，我们得出了定理是正确的结论。\n\
  \n**示例 2.10** 这是一个简单的反证法示例。\n\n**定理 2.1** 不存在最大的整数。\n\n**证明：** 反证法。\n\n步骤 1\\. 反向假设：假设存在一个最大的整数。称之为\
  \ `B`（代表“biggest”）。\n\n步骤 2\\. 证明该假设会导致矛盾：考虑 `C = B + 1`。`C` 是一个整数，因为它是两个整数之和。此外，`C\
  \ > B`，这意味着 `B` 到底并不是最大的整数。因此，我们得到了矛盾。我们推理中唯一的缺陷是最初对定理是假的假设。因此，我们得出结论该定理是正确的。\n\n\
  一种相关的证明技术是证明其否逆命题。我们可以通过证明 `(not Q) ⇒ (not P )` 来证明 `P ⇒ Q`。\n\n### ### 数学归纳法 (Proof\
  \ by Mathematical Induction)\n\n数学归纳法可以用于证明各种定理。归纳法还为算法设计提供了一种有效的思考方式，因为它鼓励你通过从简单的子问题逐步构建来解决问题。\n\
  \n归纳法可以帮助证明递归函数产生正确的结果。理解递归是理解归纳的一大步，反之亦然，因为它们本质上按相同的原理运行。\n\n在算法分析的语境下，数学归纳法最重要的用途之一是作为测试假设的方法。正如第\
  \ 2.4 节所示，在寻找求和或递归的闭式解时，我们可能首先猜测或通过其他方式获得某个特定公式是正确答案的证据。如果公式确实正确，通过归纳证明证明这一事实通常是容易的。\n\
  \n令 `Thrm` 为待证明的定理，并用正整数参数 `n` 来表示 `Thrm`。数学归纳法指出，如果以下两个条件成立，则 `Thrm` 对于参数 `n` 的任何值（对于\
  \ `n ≥ c`，其中 `c` 是某个常数）成立：\n\n1. 基础情况：`Thrm` 在 `n = c` 时成立，且\n2. 归纳步骤：如果 `Thrm`\
  \ 对于 `n − 1` 成立，那么 `Thrm` 对于 `n` 成立。\n\n证明基础情况通常很容易，通常只需要在定理中用像 `1` 的小值代替 `n`，并在需要应用简单的代数或逻辑来验证定理。证明归纳步骤有时容易，有时困难。归纳步骤的另一种表述被称为强归纳。强归纳的归纳步骤是：2a\\\
  . 归纳步骤：如果 `Thrm` 对于所有 `k`（`c ≤ k < n`）成立，那么 `Thrm` 对于 `n` 成立。\n\n证明归纳步骤的任一变体（结合验证基础情况）都能得到一个满意的数学归纳证明。\n\
  \n构成归纳证明的两个条件结合在一起，证明了 `Thrm` 在 `n = 2` 时成立，这是 `Thrm` 在 `n = 1` 时成立事实的延伸。\n\n这一事实再次结合条件\
  \ (2) 或 (2a)，表明 `Thrm` 也对于 `n = 3` 成立，以此此类推。因此，一旦这两个条件得到证明，`Thrm` 就对于所有 `n` 的值（大于基础情况）都成立。\n\
  \n让数学归纳法如此强大（且对大多数人初看起来是如此神秘）的原因是，我们可以利用“`Thrm` 对于小于 `n` 的所有值成立”的假设，作为工具帮助我们证明 `Thrm`\
  \ 对于 `n` 成立。这被称为归纳假设。\n\n递归和归纳有许多相似之处。它们都锚定在一个或多个基础情况上。递归函数依赖于调用自身来获取较小问题的答案。同样，归纳证明依赖于归纳假设的真性。归纳假设并不是空穴产生的。只有当定理本身是正确的时，它在证明范围内才是可靠的。使用归纳假设来工作与使用递归调用完全相同。\n\
  \n**示例 2.11** 这是一个数学归纳法的示例。令前 `n` 个正整数之和为 `S(n)`。\n\n**定理 2.2** `S(n) = n(n + 1)/2`。\n\
  \n**证明：** 采用数学归纳法。\n\n1. 检查基础情况。对于 `n = 1`，验证 `S(1) = 1(1 + 1)/2`。`S(1)` 仅仅是第一个数的和，即\
  \ `1`。因为 `1(1 + 1)/2 = 1`，该公式在基础情况下是正确的。\n2. 陈述归纳假设。归纳假设是 `n−1 X (n − 1)((n − 1)\
  \ + 1) = (n − 1)(n)/2 = S(n − 1)`。\n3. 使用来自 `n − 1` 的归纳假设来证明结果对于 `n` 是成立。归纳假设假设\
  \ `S(n − 1) = (n − 1)(n)/2`，因为 `S(n) = S(n − 1) + n`，我们可以替换 `S(n − 1)` 得到：\n\n```\n\
  S(n) = (n-1)(n)/2 + n = (n² - n + 2n)/2 = (n² + n)/2 = n(n + 1)/2\n```\n\n因此，通过数学归纳法，\n\
  \n```\nn X S(n) = n(n + 1)/2\n```\n\n\n\n\n\n仔细注意此示例中发生的情况。首先，我们将 `S(n)` 转换为更小规模问题的形式：`S(n)\
  \ = S(n − 1) + n`。这很重要，因为一旦 `S(n − 1)` 出现，我们就可以使用归纳假设将 `S(n − 1)` 替换为 `(n − 1)(n)/2`。从这里开始，通过代数运算即可证明\
  \ `S(n − 1) + n` 等于原始定理的右侧。\n\n**示例 2.12** 这是另一个简单的归纳证明，说明了如何选择合适的归纳变量。我们希望通过归纳法证明前\
  \ n 个正奇数的和为 `n²`。首先，我们需要一种描述第 n 个奇数的方法，它就是 `2n − 1`。这还允许我们将定理表示为求和。\n\n**定理 2.3**\
  \ 对于 `i=1`，`Pn (2i − 1) = n²`。\n\n**证明：** 基础情况 `n = 1` 得到 `1 = 1²`，这是成立的。归纳假设是 `sum_{i=1}^{n-1}\
  \ (2i − 1) = (n − 1)²`。我们现在使用归纳假设来证明定理对于 `n` 成立。前 n 个奇数的和等于前 n−1 个奇数的和加上第 n 个奇数。在下方的第二行中，我们将使用归纳假设将部分求和（如第一行中括号所示）替换为其闭式解。之后，剩下的部分由代数运算完成。\n\
  \n```\nsum_{i=1}^{n} (2i − 1) = sum_{i=1}^{n-1} (2i − 1) + (2n − 1)\n= [(n − 1)²]\
  \ + 2n − 1\n= n² − 2n + 1 + 2n − 1\n= n²\n```\n\n因此，通过数学归纳法，`Pn (2i − 1) = n²`。\n\
  \n**示例 2.13** 此示例展示了我们如何使用归纳法证明一个给定的递归关系的闭式解是正确的。\n\n**定理 2.4** 递归关系 `T(n) = T(n−1)+1;\
  \ T(1) = 0` 的闭式解为 `T(n) = n − 1`。\n\n第 2.6 节 数学证明技术 43\n\n**证明：** 为了证明基础情况，我们观察到\
  \ `T(1) = 1 − 1 = 0`。归纳假设是 `T(n − 1) = n − 2`。将递归定义与归纳假设相结合，我们立即看到对于 `n > 1`，`T(n)\
  \ = T(n − 1) + 1 = n − 2 + 1 = n − 1`。因此，我们已经通过数学归纳法证明了定理是正确的。\n\n**示例 2.14** 此示例使用了归纳法但不涉及求和或其他方程。它还说明了基础情况更灵活的用法。\n\
  \n**定理 2.5** 2¢ 和 5¢ 的邮票可以组成任何值（对于 ≥ 4 的值）。\n\n**证明：** 该定理定义了值 ≥ 4 的情况，因为对于值 1 和\
  \ 3 它是不成立的。使用 4 作为基础情况，4¢ 可以由两个 2¢ 邮票组成。归纳假设是值 `n − 1` 可以由 2¢ 和 5¢ 邮票的某种组合组成。我们现在使用归纳假设来展示如何从\
  \ 2¢ 和 5¢ 邮票得到值 `n`。值 `n − 1` 的组合要么包含 5¢ 邮票，要么不包含。如果是，将一个 5¢ 邮票替换为三个 2¢ 邮票。如果没有，则组合必须包含至少两个\
  \ 2¢ 邮票（因为其大小至少为 4 且仅包含 2¢ 邮票）。在这种情况下，将两个 2¢ 邮票替换为一个 5¢ 邮票。无论哪种情况，我们现在都得到了由 2¢ 和\
  \ 5¢ 邮票组成的值 `n`。因此，通过数学归纳法，定理是正确的。\n\n**示例 2.15** 这是一个使用强归纳法的示例。\n\n**定理 2.6** 对于\
  \ `n > 1`，`n` 可被某个质数整除。\n\n**证明：** 对于基础情况，选择 `n = 2`。2 被质数 2 整除。归纳假设是任何值 `a`（`2\
  \ ≤ a < n`）都能被某个质数整除。在证明 `n` 的定理时现在有两种情况需要考虑。如果 `n` 是质数，那么 `n` 被自身整除。如果 `n` 不是质数，则\
  \ `n = a × b`，其中 `a` 和 `b` 都是小于 `n` 但大于 1 的整数。归纳假设告诉我们 `a` 被某个质数整除。同一个质数也必须整除 `n`。因此，通过数学归纳法，定理是正确的。\n\
  \n第 2 章 数基础\n\n**图 2.3** 平面上三条直线形成的区域的二色划分。\n\n我们的下一个数学归纳示例证明了一个几何定理。它还说明了归纳证明的标准技术，即我们取\
  \ `n` 个对象并移除某些对象以使用归纳假设。\n\n**示例 2.16** 定义一组区域的二色划分为每个区域分配两种颜色中的一种方法。\n\n**定理 2.7**\
  \ 三条直线形成的区域集是二染色的。\n\n**证明：** 对于基础情况，考虑单条直线。归纳假设是任何由 `n − 1` 条直线形成的区域集都是二染色的。对于\
  \ `n` 条直线，我们移除其中一条。根据归纳假设，剩余区域是二染色的。当我们把直线放回去时，它将某些现有区域一分为二。我们将新区域涂上原始区域相反的颜色。因此，通过数学归纳法，区域是二染色的。\n\
  \n第 2.6 节 数学证明技术 45\n\n将定理 2.7 的证明与定理 2.5 进行对比。对于定理 2.5，我们取了一组大小为 `n − 1` 的邮票（根据归纳假设，它们必须具有所需的属性），并在此基础上“构建”了一个具有所需属性的大小为\
  \ `n` 的集合。因此，我们证明了大小为 `n` 的邮票集合的存在。对于定理 2.7，我们必须证明任何 `n` 条直线都具有所需的属性。因此，我们的策略是取任意的\
  \ `n` 条直线，并将其“还原”，直到得到具有所需属性的集合。从那里开始，我们只需要证明原始还原过程保留了所需的属性。\n\n相比之下，考虑如果我们尝试从大小为\
  \ `n − 1` 的直线集“构建”大小为 `n` 的集将需要什么。我们将很难证明所有可能的 `n` 条直线都在我们的构建覆盖范围内。通过从任意的 `n` 条直线还原，我们避免了这个问题。\n\
  \n**示例 2.17** 本节的最后一个示例展示了如何使用归纳法证明递归函数产生正确的结果。\n\n**定理 2.8** 函数 **fact** 对于任何 `n`\
  \ 值都会终止。\n\n**证明：** 对于基础情况，我们观察到当 `n ≤ 0` 时，**fact** 会直接终止。归纳假设是 **fact** 对于 `n\
  \ − 1` 会终止。对于 `n`，有两种可能性。一种可能性是 `n ≥ 12`。\n\n在这种情况下，**fact** 将因为失败其断言测试而直接终止。否则，**fact**\
  \ 将递归调用 **fact(n-1)**。根据归纳假设，**fact(n-1)** 必须终止。\n\n**定理 2.9** 函数 **fact** 确实计算了\
  \ 0 到 12 范围内任何值的阶乘。\n\n\n\n\n\n**证明：** 要证明基础情况，观察到当 `n = 0` 或 `n = 1` 时，`fact(n)`\
  \ 返回正确值 `1`。归纳假设是 `fact(n-1)` 返回正确值 `(n − 1)!`。对于合法范围内的任何值 `n`，`fact(n)` 返回 `n ∗\
  \ fact(n-1)`。根据归纳假设，`fact(n-1) = (n − 1)!`，由于 `n ∗ (n − 1)! = n!`，我们已经证明了 `fact(n)`产生了正确的结果。\n\
  \n我们可以使用类似的过程证明许多递归程序的正确性。通用形式是证明基础情况执行正确，然后使用归纳假设来证明递归步骤也产生正确的结果。\n\n# 第 2 章 数学基础\n\
  \n在此之前，我们必须证明函数总是终止的，这也可以通过归纳证明法完成。\n\n## 2.7 估计\n\n你从计算机科学训练中获得的最用的生活技能之一就是进行快速估计的能力。这有时被称为“餐巾计算”（back\
  \ of the napkin）或“信封计算”（back of the envelope）。这两个昵号都意味着产生的只是粗略的估计。估计技术是工程课程的标准组成部分，但在计算机科学中经常被忽视。估计不能替代对问题的严谨、详细的分析，但它可以用来指示何时需要进行严谨的分析：如果初始估计表明解决方案不可行，那么进一步的分析可能是不必要的。\n\
  \n估计可以通过以下三个步骤的过程进行形式化：\n1. 确定影响问题的主要参数。\n2. 推导出将参数与问题联系起来的方程。\n3. 为参数选择值，并应用方程得到估计的解决方案。\n\
  \n在进行估计时，一种让自己相信估计是合理的好方法是采用两种不同的方式进行。通常情况下，如果你想知道系统的输出是什么，你可以尝试直接估计输出，或者你可以估计系统的输入（假设输入的内容最终会输出）。如果这两种方法（独立地）给出相似的答案，那么这应该增加对估计的信心。\n\
  \n在计算时，确保你的单位是匹配。例如，不要将英尺和磅相加。验证结果是否正确的单位。始终记住，计算的输出质量取决于其输入。你对第 3 步中输入参数的估值越不确定，输出值就越不确定。\n\
  \n然而，信封计算通常只是为了获得一个数量级内的答案，或者是在两倍范围内。在进行估计之前，你应该决定可接受的误差范围，例如 25% 以内、两倍以内等。一旦你确认估计落在你的误差范围内，就不要管它了！不要尝试获得比你的目的所需的精确的估计。\n\
  \n**示例 2.18** 需要多少个图书馆书柜来存放包含一百万页的书？我估计一本 500 页的书在书架上需要一英寸的空间（看看任何手头书籍会有帮助），一百万页大约需要\
  \ 200 英尺的架空间。如果一个书架宽 4 英尺，那么就需要 50 层书架。如果一个书柜包含 5 层书架，那么大约 10 个书柜。为了得出这个结论，我估计了每英寸的页数、书架的宽度以及书柜中的书架数量。我的估计都不可能是精确的，但我认为我的答案在两倍范围内是正确的。（在写完这些之后，我去了弗吉尼亚理工大学的图书馆看了一些真实的书柜。它们只有大约\
  \ 3 英尺宽，但通常有 7 层书架，总共 21 英尺长。所以……）\n\n**示例 2.19** 买一辆每加油行驶 20 英里的汽车还是买一辆便宜 3000\
  \ 美元的汽车更经济？\n\n**示例 2.20** 在超市时，你能估计你将支付多少钱吗？一种简单的方法是将物品舍入到最近的美元。\n\n## 2.8 扩展阅读\n\
  \n本章涵盖的大多数主题被认为是离散数学的一部分。该领域的入门书籍是 Susanna S. Epp 写的《Discrete Mathematics with Applications》[Epp10]。对计算机科学家有许多主题的高级处理是\
  \ Graham、Knuth 和 Patashnik 写的《Concrete Mathematics》[GKP94]。参阅 1995 年 2 月份的 *IEEE\
  \ Spectrum* 中的“Technically Speaking”[Sel95]，以讨论本书使用的标准。Udi Manber 写的《Introduction\
  \ to Algorithms》[Man89] 大量使用了数学归纳法。关于递归的更多信息，请参见 Eric S. Roberts 写的《Thinking Recursively》[Rob86]。为了正确学习递归，学习\
  \ LISP 或 Scheme 语言是值得的。特别是，Friedman 和 Felleisen 的“Little”系列书籍（包括《The LISPer》[FF89]\
  \ 和《The Little Schemer》[FFBS95]）旨在教你如何递归地思考以及教你这种语言。这些书很有趣。一本关于写数学证明的好书是 Daniel\
  \ Solow 的《How to Read and Do Proofs》[Sol09]。为了提高你的通用数学问题解决能力，请参见 Paul Zeitz 的《The\
  \ Art and Craft of Problem Solving》[Zei07]。Zeitz 还讨论了第 2.6 节提出的三种证明技术，以及调查和论证在解决问题中的作用。更多关于估计技术的信息，请参见\
  \ John Louis Bentley 写的《The Back of the Envelope and The Envelope is Back》[Ben84,\
  \ Ben00, Ben86, Ben88]。James Gleick 写的《Genius: The Life and Science of Richard Feynman》[Gle92]\
  \ 让我们了解这种计算对于原子弹开发者以及整个现代理论物理有多重要。\n\n## 2.9 练习题\n\n2.1 对于下面的关系，解释该关系满足或不满足自反、对称、反对称和传递性的哪一个属性。\n\
