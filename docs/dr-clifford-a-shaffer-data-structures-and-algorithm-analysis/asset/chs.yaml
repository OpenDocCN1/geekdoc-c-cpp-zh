  \n[content]\n不是通过指向节点的指针，而是通过堆本身。在实践中，逻辑上的堆位置与数组中编号相同的物理位置相对应。其次，构造函数接收一个指向要使用的数组的指针作为输入。这种方法为使用堆提供了最大的灵活性，因为客户端可以直接将所有数据值加载到数组中。这种优势来自于堆的构建阶段，下文所示。构造函数还接收一个整数参数，表示堆的初始大小（基于起初加载到数组中的元素数量），以及另一个整数参数，表示堆允许的最大大小（数组的大小）。\n\
  \n方法 `heapsize` 返回堆的当前大小。`H.isLeaf(pos)` 如果位置 `pos` 是堆 `H` 中的一个叶子节点，则返回 `true`，否则返回\
  \ `false`。成员 `leftchild`、`rightchild` 和 `parent` 分别返回传入位置的左子节点、右子节点和父节点的位置（实际上是数组索引）。\n\
  \n构建堆的一种方法是逐个插入元素。`insert` 方法将一个新元素 `V` 插入堆中。你可能期望堆的插入过程类似于二叉搜索树（BST）的插入函数，从根节点开始向下处理堆。然而，这种方法可能不可行，因为堆必须保持完全二叉树的形状。等价地，如果堆在调用\
  \ `insert` 之前占据了数组的前 `n` 个位置，那么在之后它必须占据前 `n + 1` 个位置。为了实现这一点，`insert` 首先将 `V` 放在数组的第\
  \ `n` 位置。当然，`V` 不可能处于正确的位置。为了将 `V` 移动到正确的位置，将其与其父节点的值进行比较。如果 `V` 的值小于或等于其父节点的值，则它就处于正确的位置，插入例程完成。如果\
  \ `V` 的值大于其父节点的值，则两个元素交换位置。从这里开始，继续 `V` 与其（当前）父节点比较，直到 `V` 到达其正确的位置。\n\n由于堆是完全二叉树，它的高度保证是最小可能的。特别是，一个包含\
  \ `n` 个节点的堆高度将为 `Θ(n log n)`。直观上，我们可以预见这是必然的，因为我们添加的每一层都会使树中的节点数量略多于翻倍（树的节点数增加一倍）。\n\
  \n\n\n遗憾的是，新的根值可能不是新堆中的最大值。这个问题可以通过使用 `siftdown` 重新调整堆的顺序来解决。由于堆的深度为对 `n` 层，在平均和最坏情况下，删除最大元素的代价为\
  \ $\\Theta(\\log n)$。\n\n堆是本节开头讨论的优先级队列的自然实现。当需要时，可以将任务添加到堆中（使用它们的优先级值作为排序键）。每当需要执行新任务时，都可以调用\
  \ `removemax` 方法。\n\n## 5.6 霍夫曼编码树\n\n某些优先队列的应用需要更改已存储在队列中的对象优先级的能力。这可能需要更新对象在堆表示中的位置。遗憾的是，最大顶堆在搜索任意值时效率并不高；它只适用于寻找最大值。然而，如果我们已经知道了某个对象在堆中的索引，那么更新其优先级（包括改变其位置以维护堆属性）或将其移除都是易手的事。\n\
  \n`remove` 方法以要从堆中删除的节点位置作为输入。对于需要更新优先级的优先级队列，一种典型的实现方法需要使用一个支持高效查找对象的辅助数据结构（如 `BST`）。辅助数据结构中的记录将存储对象的堆索引，这样对象就可以从堆中删除并用新优先级重新插入（见项目\
  \ 5.5）。第 11.4.1 和 11.5.1 节介绍了具有优先级更新功能的优先级队列的应用。\n\n第 3.9 节的空间/时间权衡原理指出，通常可以通过牺牲运行时间来换取空间需求的改进。\n\
  \n在许多情况下，这种权衡是有利的。典型的例子是在磁盘上存储文件。如果文件没有被频繁使用，所有可能希望压缩它们以节省空间。稍后可以使用解压来使用，这需要一些时间，但只需要一次。\n\
  \n我们通常在计算机程序中通过为每个项目分配一个唯一的代码来表示一组项目。例如，标准的 ASCII 编码方案为每个字符分配一个唯一的八位值。为每个字符提供唯一代码需要最小数量的比特。例如，需要\
  \ $\\lceil \\log_2 128 \\rceil$ 或七位比特来表示 ASCII 字符集所需的 128 个唯一代码。\n\n使用 $\\lceil\
  \ \\log_2 n \\rceil$ 位比特来表示 `n` 个唯一代码值的要求假设了所有代码的长度都相同，正如 ASCII 码一样。这被称为固定长度编码方案。如果所有字符被使用的频率相同，那么固定长度编码方案是最节省空间的方法。然而，你可能已经意识到，在许多应用中，并不是所有字符的使用频率都相同。例如，英语文档中的各种字母的使用频率差异很大。\n\
  \n图 5.23 显示了字母表中字母的相对频率。从表中我们可以看到，字母‘E’出现的次数比字母‘Z’多大约 60 倍。在标准的 ASCII 中，“DEED”和“MUCK”这两个单词需要相同的空间（四个字节）。ASCII\
  \ 标准是八位，而不是七位，尽管只有 128 个字符。第八位要么被用于检查传输错误，要么用于支持带有额外 128 个字符的“扩展”ASCII 码。\n\n看起来像“DEED”这样由相对常见的字母组成的单词，其存储空间应该比“MUCK”这样由相对不常见的字母组成的单词更少。\n\
