  \ 5，冲突解决过程将尝试按 5, 6, 7, 0, 1, 2, 3，最后是 4 的顺序将记录插入表。如果桶满了，则应将记录放在文件末尾的溢出区域。\n\n你的哈希表应实现\
  \ 4.4 节中的字典 ADT。在测试时，假设系统旨在一次存储大约 100 或记录。\n\n9.6 通过通过线性探测作为冲突解决策略的哈希表实现 4.4 节中的字典\
  \ ADT。你可能希望从图 9.9 的代码开始。通过经验模拟，确定插入和删除的成本随 `α` 增长的趋势（即重构图 9.10 中的虚线）。然后使用二次探测和伪随机探测重复实验。对于这三种冲突解决策略的相对性能，你可以说明什么？\n\
  \n## 10 索引\n\n许多大规模计算应用都围绕无法放入主内存的数据集展开。经典的例子是一个具有多个搜索键的大型数据库，需要插入、删除和搜索记录的能力。哈希为此类情况提供了卓越的性能，但仅限于所有搜索形式均为“查找键值为\
  \ `K` 的记录”的有限情况。许多应用需要更通用的搜索能力。例如，针对所有键落在某个范围内的记录的范围查询搜索。其他查询可能涉及按键值顺序访问所有记录，或查找具有最大键值的记录。哈希表的结构并不是为了高效支持这些任何查询设计的。\n\
  \n本章介绍了用于组织存储在磁盘上的大量记录的文件结构。这些文件结构支持高效的插入、删除和搜索操作，适用于精确匹配查询、范围查询以及最大/最小键值搜索。\n\n\
  （注：原文）\n在讨论此类文件结构之前，我们必须熟悉一些文件处理术语。顺序文件（entry-sequenced file）按记录加入文件的顺序存储记录。顺序文件是无序列表的磁盘等效物，因此不支持高效搜索。自然的解决方案是按搜索键对记录进行排序。然而，一个典型的数据库（例如企业维护的员工或客户记录）可能包含多个搜索键。回答有关特定客户的问题可能需要按姓名进行搜索。企业通常希望按邮政编码排序并输出记录以进行批量邮件。政府文件可能要求按社会安全号进行搜索。因此，存储记录时可能不存在唯一的“正确”顺序。\n\
  \n（注：原文）\n索引是将键与记录位置关联的过程。第 8.5 节讨论了键排序的概念，其中创建一个索引文件，其记录由键/指针对组成。在这里，每个键都与指向主数据库文件中完整记录的指针相关。索引文件可以是排序的，也可以使用树结构组织，从而在不物理重新排列记录的情况下实施逻辑顺序。一个数据库可能有多个关联的索引文件，每个索引文件通过不同的键字段支持高效访问。\n\
  \n（注：原文）\n数据库的每条记录通常有一个唯一标识，称为主键。例如，人事记录集的主键可能是个人的社会安全号或 ID 号。遗憾的是，ID 号通常是一个不方便搜索的值，因为搜索者不太知道它。相反，搜索者可能知道目标员工的姓名。或者，搜索者可能对薪资在某个范围内的所有员工感兴趣。\n\
  \n\n\n\n\n像 `salary` 这样的关键字段，其特定的键值可能在多个记录中重复，被称为辅助键。大多数搜索都是使用辅助键完成的。辅助键索引（或简单地称为辅助索引）将一个辅助键值与具有该辅助键值的每个记录的主键相关联。此时，可能直接搜索整个数据库以找到该主键的记录，也可能存在一个主键索引（或主索引），它将每个主键值与指向磁盘上实际记录的指针相关联。在后的情况下，只有主索引提供了磁盘上实际记录的位置，而辅助索引则引用主索引。\n\
  \n索引是组织大型数据库的重要技术，目前已经开发了许多索引方法。第 9.4 节讨论了通过哈希算法进行直接访问。一个按键值排序的简单列表也可以作为记录文件的索引。下一节将讨论如何通过排序列表对磁盘文件建立索引。\n\
  \n遗憾的是，排序列表在执行插入和删除操作时性能并不。\n\n索引的第三种方法是树索引。树通常用于组织支持记录插入、删除和键范围搜索的大型数据库。第 10.2\
  \ 节简要描述了 ISAM，这是解决必须支持记录插入和删除的大型数据库存储问题的一个尝试性步骤。它的缺点有助于说明树索引技术的价值。\n\n第 10.3 节引入了与树索引相关的基本问题。第\
  \ 10.4 节引入了 2-3 树，这是一种平衡树结构，是第 10.5 节涵盖的 B 树的简单形式。B 树是大型磁盘数据库和文件系统实现中最广泛使用的索引方法。由于它们具有极大的实用价值，人们发明了许多变体。第\
  \ 10.5 节开始讨论通常被简称为“B 树”的变体。\n\n第 10.5.1 节介绍了实现最广泛的变体 B+ 树。\n\n## Sec 10.1 线性索引\n\
  \n### 线性索引\n\n线性索引是一种组织为键/指针对序列的索引文件，其中键按顺序排序，指针要么 (1) 指向磁盘上完整记录的位置，(2) 指向主索引中主键的位置，或\
  \ (3) 实际上是主键的值。根据其大小，线性索引可能存储在内存中或磁盘上。线性索引提供了许多优势。它为变长数据库记录提供了便利访问，因为索引文件中的每个条目包含一个固定长度的键字段和一个指向（变长）记录开头的固定长度指针，如图\
  \ 10.1 所示。线性索引还允许对数据库记录进行高效搜索和随机访问，因为它适用于二分查找。\n\n如果数据库包含足够的记录，线性索引可能太大而无法存储在内存中。这使得索引的二分查找代价更高，因为搜索过程通常需要多次磁盘访问。解决此问题的一种方案是在内存中存储一个二级线性索引，用以指示索引文件中的哪个磁盘块存储了所需的键。例如，磁盘上的线性索引可能位于一系列\
  \ 1024 字节的块中。如果线性索引中的每个键/指针对需要 8 字节（4 字节键和 4 字节指针），则每个块存储 128 个键/指针对。存储在内存中的二级索引由一个简单的表组成，该表存储线性索引文件中每个块第一个位置的键值。这种安排如图\
  \ 10.2 所示。如果线性索引需要 1024 个磁盘块（1MB），则二级索引仅包含 1024 条条目，每个磁盘块一个。要找到哪个磁盘块包含所需的搜索键值，首先搜索这\
  \ 1024 条条目的表，找到小于或等于搜索键的最大值。这会将搜索引导到索引文件中的正确块，然后将其读入内存。此时，在该块内进行二分查找将产生一个指向数据库中实际记录的指针。\n\
  \n较小的二级索引存储在内存中。二级索引中的每个元素都存储了索引文件中对应磁盘块中的第一个键值。在这个示例中，线性索引的第一个磁盘块存储在 1 到 2001 范围内的键，第二个磁盘块存储在\
  \ 2003 到 5688 范围内的键。因此，二级索引的第一个条目是键值 1（线性索引第一个块中的第一个键），而二级索引的第二个条目是键值 2003。\n\n\
  **图 10.1** 变长记录的线性索引。索引文件中的每条记录长度都是固定长度的，并包含一个指向数据库文件中对应记录开头的指针。\n\n**图 10.2** 一个简单的二级线性索引。线性索引存储在磁盘上。\n\
  \n每当向数据库插入或删除记录时，所有辅助索引都必须更新。线性索引的更新是昂贵的，因为整个数组的内容可能会发生移动。另一个问题是具有相同键的多条记录在索引中每个重复该键。当辅助键字段有许多重复值时，例如其范围有限时（例如用于在少数可能的类别中指示工作类别的字段），这种重复可能会浪费空间。\n\
  \n简单排序数组的一种改进是二维数组，其中每行对应一个辅助键值。每行包含所有具有所指示辅助键值的记录的主键。图 10.3 阐述了这种方法。现在没有辅助键值的重复，可能会节省大量的空间。插入和删除的成本也降低了，因为只需要处理表的一行。请注意，当添加新的辅助键值时，会在数组中添加新行。这可能导致移动大量记录，但在适用于这种安排的应用程序中，这种情况发生得很少。\n\
  \n这种方法的缺点是数组必须是固定大小的，这为与特定辅助键关联的主键数量设定了上限。此外，记录数少于数组宽度的辅助键将浪费其行的剩余部分。更好的方法是建立一个辅助键值的一维数组，其中每个辅助键都与一个链表相关联。如果索引存储在内存中，这种方法很好，但在存储在磁盘上时效果不佳，因为给定键的链表可能分散在多个磁盘块中。\n\
  \n**图 10.3** 二维线性索引。每行列出与特定辅助键值关联的主键。在这个示例中，辅助键是姓名。主键是一个唯一的四字符代码。\n\n\n\n\n\n**图\
  \ 10.4** 倒置列表的示意。每个辅助键值都存储在辅助键列表中。列表中的每个辅助键值都指向一个主键列表，该列表中的主键对应的记录具有该辅助键值。\n\n考虑一个大型员工记录数据库。如果主键是员工\
  \ ID 号，辅助键是员工姓名，那么姓名索引中的每条记录都将一个姓名与一个或多个 ID 号关联。ID 号索引反过来将 ID 号与指向磁盘上完整记录的唯一指针关联。在这种结构中，辅助键索引也被称为倒置列表或倒置文件。之所以被称为“倒置”，是因为搜索是从辅助键反向到主键，再到实际数据记录的。之所以被称为“列表”，是因为每个辅助键值（概念上）都关联着一个主键列表。图\
  \ 10.4 阐述了这种安排。在这里，我们使用姓氏作为辅助键。主键是一个四个字符的唯一标识符。\n\n图 10.5 显示了一种更好的存储倒置列表的方法。如之前所示，显示了一个辅助键值数组。每个辅助键关联一个指向主键数组的指针。主键数组使用链表实现。这种方法将所有辅助键列表的存储合并到一个数组中，可能会节省空间。该数组中的每条记录由一个主键值和一个指向列表中下一个元素的指针指针组成。\n\
  \n```\nSecondary Primary Key Index Key Next\nJones 0 0 AA10 4\nSmith 1 1 AX33 6\n\
  Zukowski 3 2 ZX45 3 ZQ99 4 AB12 5 5 AB39 7 6 AX35 2 7 FF37\n```\n\n**图 10.5** 实现为辅助键数组和主键合并列表的倒置列表。辅助键数组中的每条记录包含一个指向主键数组中记录的指针。主键数组的\
  \ `next` 字段指示具有相同辅助键值的下一个记录。从此数组中插入和删除辅助键很容易，这使其成为基于磁盘的倒置文件的良好实现。\n\n## 10.2 ISAM\n\
  \n我们如何处理需要频繁更新的大型数据库？线性索引的主要在于它是一个单一的大数组，不利于适应更新，因为单次更新可能需要更改索引中每个键的位置。倒置列表减少了这个问题，但它们仅适用于辅助键值远少于记录数的辅助键索引。如果线性索引能够以某种方式拆分成若干部分，使得单次更新只影响索引的一部分，那么它作为主键索引将表现良好。这一概念将在本章其余部分继续追求，最终形成\
  \ B+ 树——这是目前最广泛使用的索引方法。但首先，我们开始学习 ISAM，这是解决需要频繁更新的大型数据库问题的早期尝试。它的局限性有助于说明为什么 B+\
  \ 树工作得如此出色。\n\n在发明有效的树索引方案之前，有多种基于磁盘的索引方法。所有方法都相当繁琐，很大程度上是因为当时不知道处理更新的合适方法。通常，更新会导致索引性能下降。ISAM\
  \ 是此类索引的一个示例，在 IBM 采用 B 树之前被广泛使用。\n\nISAM 基于线性索引的变体形式，如图 10.6 所示。记录按主键排序顺序存储。磁盘文件被划分为磁盘上的多个磁道。每个磁道容纳一个按顺序排列的列表部分。初始时，每个磁道都没有满容量，额外的空间被留存在磁道溢出区中。内存中有一张表，列出文件中每个磁道中存储的最小键值。每个磁道包含一张表，列出该磁道每个块的最小键值，称为磁道索引。当插入新记录时，它们被放置在正确磁道的溢出区（实际上，磁道充当了桶）。如果某个磁道的溢出区完全满，则使用系统级溢出区。搜索通过从保存在主内存中的系统表中确定正确的磁道进行。从磁盘调入磁道的块表并进行查询以确定正确的块。如果在该块中找到记录，则搜索完成。否则，搜索磁道的溢出区。如果该区域也满了且未找到记录，则搜索系统级溢出区。\n\
  \n```\nIn-memory Table of Cylinder Keys\nCylinder 1 Cylinder 2 Cylinder Cylinder\
  \ Cylinder\nIndex Index Records Records Cylinder Cylinder Overflow Overflow System\
  \ Overflow\n```\n\n**图 10.6** ISAM 索引系统的示意图。\n\n在数据库初始构建后，只要不插入或删除新记录，访问就是高效的，因为只需要两次磁盘读取。第一次磁盘读取获取目标磁道的块表。第二次磁盘读取获取在良好情况下包含记录的块。在多次插入后，溢出列表会变得过长，随着磁道溢出区的填满，会导致搜索时间显著增加。在极端情况下，许多搜索最终可能会导致系统溢出区。该问题的“解决方案”是定期重新组织整个数据库。这意味着在磁道之间重新平衡记录，对每个磁道内的记录排序，并更新系统索引表和磁道内块表。这种重新组织是\
  \ 20 世纪 60 年数据库系统的典型，通常每晚或每周一次。\n\n## 10.3 基于树的索引\n\n当数据库是静态的（即插入和删除记录很少或从发生），线性索引是高效的。ISAM\
  \ 适用于有限的更新，但不适用于频繁更改。由于它本质有两个层索引，对于磁道数量大到顶层索引无法放入主内存的真正大型数据库，ISAM 也会失效。\n\n在最通用形式下，数据库应用程序具有以下特征：\n\
  \n1. 频繁更新的大量记录。\n2. 按一个或多个键的组合进行搜索。\n3. 使用键范围查询或极值查询。\n\n对于此类数据库，必须找到更好的组织方式。一种方法是使用二叉搜索树（BST）来存储主键和辅助键索引。BST\
  \ 可以存储重复的键值，它们提供了高效的插入、删除以及搜索，并可以执行高效的范围查询。当有足够的内存时，BST 是实现主键和辅助键索引的可行方案。\n\n遗憾的是，BST\
  \ 可能会失去平衡。即使在良好的条件下，叶子节点的深度也可能变化一倍。当树存储在内存中时，这可能不是严重问题，因为搜索和更新所需的时间仍然是 Θ(log n)。但当树存储在磁盘上时，节点的深度变得至关重要。每当访问\
  \ BST 节点 B 时，都需要访问从根节点到 B 路径上的所有节点。\n\n\n\n\n此路径上的每个节点必须从磁盘检索。每次磁盘访问都会返回一个块的信息。如果一个节点与其父节点在同一个块中，那么一旦父节点进入主内存，找到该节点的代价就是微不足道的。因此，将子树保持在同一个块中是理想的。遗憾的是，很多节点与其父节点不在同一个块中。因此，对\
  \ `BST` 节点的每次访问都可能需要从磁盘读取另一个块。如果 `BST` 访问显示出良好的引用局部性，使用缓冲池在内存中存储多个块可以缓解磁盘访问问题。但缓冲池无法完全消除磁盘\
  \ I/O。如果 `BST` 不平衡，问题会变得更加严重，因为树中深处的节点可能会导致读取许多磁盘块。因此，为了实现基于磁盘的高效搜索，必须解决两个关键问题：\n\
  \n# 第 10.3 节 基于树的索引\n\n**图 10.7** 将 BST 分分为若干块。`BST` 分布在磁盘块中，每个块有空间容纳三个节点。从根到任何叶子的路径包含在两个块中。\n\
  \n**图 10.8** 在插入后尝试重新平衡 `BST` 的代价可能是昂贵的。\n\n(a) 一个具有六个节点且呈完全二叉树形状的 `BST`。(b) 在 (a)\
  \ 的 `BST` 中插入一个值为 1 的节点。为了同时保持完全二叉树形状和 BST 属性，需要对树进行大规模重组。\n\n第一个是如何保持树的平衡。第二个是如何安排块上的节点，以便使从根到叶的任何路径上遇到的块数量保持最少。\n\
  \n我们可以选择一种方案来平衡 `BST` 并将 `BST` 节点分配到块中，以使磁盘 I/O 最小化，如图 10.7 所示。然而，在面对插入和删除时维持这种方案是困难的。特别是当发生更新时，树应该保持平衡，但这样做可能需要大量的重组。每次更新应该只影响少数块，否则其代价将太高。从图\
  \ 10.8 所示，采用诸如要求 `BST` 必须是完全规则会导致树内数据的大量重排。\n\n我们可以通过选择另一种树结构来解决这些问题，这种结构在更新后能够自动保持平衡，并且适合存储在块中。\n\
  \n平衡树数据结构有很多，也有保持 `BSTs` 平衡的技术。例如第 13.2 节讨论的 `AVL` 树和 `splay` 树。作为替代，第 10.4 节介绍了\
  \ `2-3 树`，它的属性是叶子节点始终处于同一层。在这里优先讨论 `2-3 树` 而不是其他平衡搜索树的主要原因是，它自然地引出了第 10.5 节的 B 树，这是目前最广泛使用的索引方法。\n\
  \n# 10.4 2-3 树\n\n本节介绍了一种名为 `2-3 树`的数据结构。`2-3 树` 不是二叉树，而是其形状遵循以下定义：\n1. 节点包含一个或两个键。\n\
  2. 每个内部节点要么有两个孩子（如果包含一个键），要么三个三个（如果包含两个键）。由此得名。\n3. 所有叶子节点都在树的同一层，因此树始终是高度平衡的。\n\
  \n除了形状属性外，`2-3 树` 还具有类似于 `BST` 的搜索树属性。对于每个节点，左子树中所有后代的值都小于第一个键的值，而中间子树中的值大于或等于第一个键的值。如果存在右子树（等同于节点存储了两个键），则中间子树中所有后代的值小于第二个键的值，而右子树中的值大于或等于第二个键的值。为了维持这些形状和搜索属性，在插入和删除节点时需要采取特殊操作。`2-3\
  \ 树` 相比 `BST` 的优势在于，它可以以较低的代价保持高度平衡。\n\n图 10.9 展示了 `2-3 树`。节点显示为带有两个键字段的矩形框。（这些节点实际上将包含完整记录或指向完整记录的指针，但图示将仅显示键。）只有两个子节点的内部节点其右键字段为空。。叶子节点可能包含一个或两个键。图\
  \ 10.10 是 `2-3 树` 节点的实现。假设 `TTNode` 类是 `2-3 树` 类 `TTTree` 的私有类，因此 `TTNode` 的数据成员将公开以简化演示。\n\
  \n注意，此示例声明没有区分叶子节点和内部节点，因此在空间上是无效的，因为每个叶子节点存储了三个指针。\n\n```cpp\ntemplate <typename\
  \ Key, typename E>\nclass TTNode {\n    // 2-3 tree node structure\npublic:\n  \
  \  E lval; // 节点的左值\n    Key lkey; // 节点的左键\n    E rval; // 节点的右值\n    Key rkey;\
  \ // 节点的右键\n    TTNode* left; // 指向左孩子的指针\n    TTNode* center; // 指向中间孩子的指针\n  \
  \  TTNode* right; // 指向右孩子的指针\n\n    TTNode() {\n        center = right = NULL;\n\
  \        lkey = rkey = EMPTYKEY;\n    }\n    TTNode(Key lk, E lv, Key rk, E rv,\
  \ TTNode<Key,E>* p1, TTNode<Key,E>* p2, TTNode<Key,E>* p3) {\n        lkey = lk;\
  \ lval = lv;\n        rkey = rk; rval = rv;\n        left = p1; center = p2; right\
  \ = p3;\n    }\n    bool isLeaf() { return left == NULL; }\n    TTNode<Key,E>* add(TTNode<Key,E>*\
  \ it);\n};\n```\n**图 10.10** 2-3 树节点实现。\n\n第 5.3.1 节的技术可以应用于此处实现内部节点和叶子节点。从 2-3\
  \ 树的定义规则可以推导出节点数量与树深度的关系。高度为 `k` 的 2-3 树至少有 $2^k-1$ 个叶子，因为如果每个内部节点有两个孩子，它将退化为完全二叉树。高度为\
  \ `k` 的 2-3 树最多有 $3^k-1$ 个叶子，因为每个内部节点最多有三个孩子。\n\n在 2-3 树中搜索值类似于搜索 `BST`。搜索从根开始。如果根不包含搜索键\
  \ `K`，则搜索进入包含 `K` 的唯一子树。根中存储的键决定了哪个是子树。例如，在图 10.9 的树中搜索值 30，我们从根节点开始。因为 30 位于 18\
  \ 和 33 之间，它只可能在中间子树中。搜索根节点的中间孩子即可所需的记录。如果搜索 15，第一步同样是搜索根节点。因为 15 小于 18，采取第一个（左）分支。在下一层，我们采取第二个分支到达包含\
  \ 15 的叶子节点。\n\n如果搜索键是 16，那么在遇到包含 15 的叶子节点时将发现搜索键不在树中。图 10.11 是 2-3 树搜索方法的实现。\n\n\
  ```cpp\n// 查找匹配给定键值的记录\ntemplate <typename Key, typename E>\nE TTTree<Key, E>::findhelp(TTNode<Key,E>*\
  \ root, Key k) const {\n    if (root == NULL) return NULL;\n    // 未找到值\n    if\
  \ (k == root->lkey) return root->lval;\n    if (k == root->rkey) return root->rval;\n\
  \    if (k < root->lkey)\n        // 向左\n        return findhelp(root->left, k);\n\
  \    else if (root->rkey == EMPTYKEY)\n        // 2 孩子节点\n        return findhelp(root->center,\
  \ k);\n    // 向中间\n    else if (k < root->rkey)\n```\n\n\n\n\n```cpp\nreturn findhelp(root->center,\
  \ k);\n\n// 进入中心\n\nelse return findhelp(root->right, k);\n\n// 向右移动\n\n}\n```\n\
  \n图 10.11：2-3 树搜索方法的实现。\n\n图 10.12：向图 10.9 中的 2-3 树进行简单插入。值 `14` 被插入到包含 `15` 的叶子节点中。由于该节点有空间容纳第二个键，因此它被简单地添加到左侧，并将\
  \ `15` 移动到右侧。\n\n向 2-3 树插入节点与向二叉搜索树（BST）插入相似，之处在于新记录被放置在合适的叶子节点中。与 BST 插入不同，不会创建一个新的子节点来存放正在插入的记录，也就是说，2-3\
  \ 树不会向下生长。第一步是找到如果记录在树中则将包含它的叶子节点。如果该叶子节点只包含一个值，则可以将新记录添加到该节点中，而无需对树进行任何进一步修改，如图\
  \ 10.12 所示。在本例中，插入了一个键值为 `14` 的记录。从根节点开始查找，到达存储 `15` 的叶子节点。我们将 `14` 作为左值添加（将键 `15`\
  \ 的记录推到最右位置）。\n\n如果我们把新记录插入到已经包含两个记录的叶子节点 `L`，则必须创建更多空间。考虑节点 `L` 的两个记录以及要插入的记录，无需进一步考虑哪两个已经在\
  \ `L` 中，而哪一个是新记录。第一步是将 `L` 分拆为两个节点。因此，必须从空闲存储器中创建一个新节点——称之为 `L0`。`L` 接收三个键值中最小的记录。`L0`\
  \ 接收三个值中最大的。三个键值中中间的记录将连同指向 `L0` 的指针一起传递给父节点。这被称为“**提升（promotion）**”。然后，将该提升的键插入到父节点中。如果父节点目前只包含一条记录（因此只有两个孩子），则将提升的记录和指向\
  \ `L0` 的指针简单地添加到父节点中。如果父节点已满，则重复拆分并提升的过程。\n\n图 10.13：2-3 树的简单节点拆分插入。值 `55` 被添加到图\
  \ 10.9 的 2-3 树中。这使得包含值 `50` 和 `52` 的节点拆分，将值 `52` 提升到父节点。\n\n图 10.13 展示了一个简单的提升。图\
  \ 10.14 展示了当提升需要根节点拆分时发生的情况，为树增加了新的层次。无论哪种情况，所有叶子节点的深度保持相等。图 10.15 和 10.16 展示了插入过程的实现。\n\
  \n注意图 10.15 中的 `inserthelp` 了三个参数。第一个是指向当前子树根的指针，命名为 `rt`。第二个是待插入记录的键，第三个是记录本身。`inserthelp`\
  \ 的返回值是一个指向 2-3 树节点的指针。如果 `rt` 未改变，则返回指向 `rt` 的指针。如果 `rt` 发生了变化（由于插入导致节点拆分），则返回指向新子树根的指针，其中键值和记录值位于最左字段，而指向（唯一的）子树的指针位于中心指针字段中。\n\
  \n这个修改后的节点将被添加到父节点，如图 10.14 所示。\n\n从 2-3 树中删除记录时有三种情况需要考虑。最简单的情况发生在从包含两个记录的叶子节点中删除记录。在这种情况下，记录被简单删除，不影响其他节点。\n\
  \n第二种情况发生在删除叶子节点中唯一的记录时。第三种情况发生在从内部节点中删除记录时。在第二种和第三种情况下，被删除的记录会被另一个可以替换其位置并保持正确顺序的记录所替换，类似于从\
  \ BST 中删除节点。如果树足够稀疏，则没有此类可用记录允许所有节点仍然保持至少一条记录。在这种情况下，兄弟节点将合并在一起。2-3 树的删除操作极其复杂，将不再进一步描述。相反，对删除的完整讨论将推迟到下一节，届时可以针对\
  \ B 树的特定变体进行泛化处理。\n\n图 10.14：导致根节点拆分的记录插入示例。\n(a) 2-3 树根拆分，使树变深。\n(b) 这导致根节点拆分，使树变深。\n\
  (c) 最后，根节点拆分，使树变深。\n\n本节介绍 B 树。B 树通常归于 R. Bayer 和 E. McCight，他们在 1972 年的一篇论文中描述了\
  \ B 树。到 1979 年，B 树已经——\n\n```cpp\ntemplate <typename Key, typename E>\nTTNode<Key,E>*\
  \ TTTree<Key, E>::\ninserthelp(TTNode<Key,E>* rt, const Key k, const E e) {\n  \
  \  TTNode<Key,E>* retval;\n    if (rt == NULL) // 空树：为根创建一个叶子节点\n        return\
  \ new TTNode<Key,E>(k, e, EMPTYKEY, NULL, NULL);\n    if (rt->isLeaf()) // 在叶子节点：在此插入\n\
  \        return rt->add(new TTNode<Key,E>(k, e, EMPTYKEY, NULL, NULL));\n    //\
  \ 添加到内部节点\n    if (k < rt->lkey) {\n        retval = inserthelp(rt->left, k, e);\n\
  \        if (retval == rt->left) return rt;\n        else return rt->add(retval);\n\
  \    }\n    else if((rt->rkey == EMPTYKEY) || (k < rt->rkey)) {\n        retval\
  \ = inserthelp(rt->center, k, e);\n        if (retval == rt->center) return rt;\n\
  \        else return rt->add(retval);\n    }\n    else { // 右插入\n        retval\
  \ = inserthelp(rt->right, k, e);\n        if (retval == rt->right) return rt;\n\
  \        else return rt->add(retval);\n    }\n}\n```\n\n图 10.15：2-3 树插入程序。\n\n除了哈希外，B\
  \ 树取代了几乎所有的大文件访问方法。B 树或 B 树的变体是需要插入、删除和键范围搜索的应用的文件组织标准。它们被用于大多数现代文件系统。B 树有效地解决了实现磁盘搜索树时遇到的所有主要问题：\n\
  \n1. B 树始终是高度平衡的，所有叶子节点都在同一层级。\n2. 更新和搜索操作只影响少数磁盘块。影响的磁盘块越少，所需的磁盘 I/O 就越少。\n3. B\
  \ 树将相关的记录（即具有相似键值的记录）保留在同一个磁盘块中，这有助于减少由于局部性引起的搜索所需的磁盘 I/O。\n\n\n\n\n\n## 4. B 树保证了树中的每个节点至少会达到某个最小百分比的填充。这提高了空间利用率，同时减少了搜索或更新操作过程中典型的磁盘读取次数。\n\
  \n阶数为 `m` 的 B 树定义为具有以下形状属性：\n\n- 根节点是一个叶子节点，要么至少有两个孩子。\n- 除了根节点外，每个内部节点拥有在 `dm/2e`\
  \ 到 `m` 之间的孩子。\n\n```cpp\n// Add a new key/value pair to the node. There might be\
  \ a\n// subtree associated with the record being added. This\n// information comes\
  \ in the form of a 2-3 tree node with\n// one key and a (possibly NULL) subtree\
  \ through the\n// center pointer field.\n\ntemplate <typename Key, typename E>\n\
  TTNode<Key,E>* TTNode<Key, E>::add(TTNode<Key,E>* it) {\n    if (rkey == EMPTYKEY)\
  \ { // Only one key, add here\n        if (lkey < it->lkey) {\n            rkey\
  \ = it->lkey; rval = it->lval;\n            right = center; center = it->center;\n\
  \        } else {\n            rkey = lkey; rval = lval; right = center;\n     \
  \       lkey = it->lkey; lval = it->lval;\n            center = it->center;\n  \
  \      }\n        return this;\n    } else if (lkey >= it->lkey) { // Add left\n\
  \        center = new TTNode<Key,E>(rkey, rval, EMPTYKEY, NULL, center, right, NULL);\n\
  \        rkey = EMPTYKEY; rval = NULL; right = NULL;\n        it->left = left; left\
  \ = it;\n        return this;\n    } else if (rkey < it->lkey) { // Add center\n\
  \        it->center = new TTNode<Key,E>(rkey, rval, EMPTYKEY, NULL, it->center,\
  \ right, NULL);\n        it->left = this;\n        rkey = EMPTYKEY; rval = NULL;\
  \ right = NULL;\n        return it;\n    } else { // Add right\n        TTNode<Key,E>*\
  \ N1 = new TTNode<Key,E>(rkey, rval, EMPTYKEY, NULL, this, it, NULL);\n        it->left\
  \ = right;\n        right = NULL; rkey = EMPTYKEY; rval = NULL;\n        return\
  \ N1;\n    }\n}\n```\n\n**图 10.16** 2-3 树节点的 `add` 方法。\n\n- 所有叶子节点位于树的同一层级，因此树始终是高度平衡的。\n\
  \nB 树是 2-3 树的推广。换句话说，2-3 树是阶为三的 B 树。通常情况下，B 树中节点的大小被选择为填满一个磁盘块。B 树节点的实现通常允许有 100\
  \ 个或更多孩子。\n\n因此，B 树节点等于一个磁盘块，存储在树中的“指针”值实际上是包含子节点的块号（通常被解释为相对于相应磁盘文件起始位置偏移量）。在典型的应用中，B\
  \ 树对磁盘文件的访问将使用缓冲池和块替换方案（如 `LRU`，见第 8.3 节）进行管理。\n\n图 10.17 展示了一个阶为四的 B 树。每个节点包含最多三个键，内部节点最多有四个孩子。\n\
  \nB 树中的搜索是 2-3 树搜索的推广。它是一个交替的两个步骤的过程，从 B 树的根节点开始。\n\n1. 对当前节点中的记录进行二分查找。如果找到了具有搜索键的记录，则返回该记录。如果当前节点是叶子节点且未找到该键，则报告搜索失败。\n\
  2. 否则，沿着正确的分支并重复该过程。\n\n例如，考虑在图 10.17 的树中搜索键值为 `47` 的记录。检查根节点并选择第二个（右侧）分支。在检查完第\
  \ 1 层的节点后，选择第三个分支进入下一层，最终到达包含键值 `47` 记录的叶子节点。\n\nB 树插入是 2-3 树插入的推广。第一步是在空间允许的情况下，找到应该包含插入键的叶子节点。如果该节点中有空间，则插入该键。如果没有空间，则将节点拆分为两个，并将中间键提升到父节点。如果父节点也满了，则它会被相应的拆分，并提升其中间键。\n\
  \n注意，这种插入过程保证了所有节点至少是半满。\n\n例如，当我们尝试向一个阶为四的 B 树的满内部节点时，五个孩子中间的一个会被提升到该位置。\n\n##\
  \ 10.5.1 B+ 树\n\n上一节提到 B 树被广泛使用。当需要更高的效率时，会使用一种更复杂的变体，称为 `B* tree`。当数据是静态的，通常使用\
  \ B+ 树。大问题是如何找到具有给定键的记录。也许可以使用某种树形结构来定位适当的数据块。这些想法正是 B+ 树的动力。B+ 树本质上是一种管理基于数组的列表的机制，其中列表被切分成块。\n\
  \nB+ 树与二叉搜索树（BST）或标准 B 树之间最重要的区别是 B+ 树只在叶子节点中存储记录。内部节点存储键值，但这些仅作为引导搜索的占位符。这意味着内部节点的结构与叶子节点不同。\n\
  \n内部节点存储键以引导搜索，并将每个键与指向子 B+ 树节点的指针关联。叶子节点存储实际记录，或者如果 B+ 树仅用作索引，则存储键以及指向单独磁盘文件中实际记录的指针。取决于记录的大小相对于键的大小，阶数为\
  \ `m` 的 B+ 树的叶子节点可能有空间存储多或少于 `m` 条记录。要求仅仅是叶子节点存储足够的记录以保持至少半满。B+ 树的叶子节点通常连接在一起。\n\
  \n\n\n\n为了形成双向链表。因此，通过访问链表上的所有叶子节点，可以按顺序遍历整个记录集合。这里是 `BPNode` 类的 C++ 风格伪代码表示。叶子节点和内部节点子类将实现此基类。\n\
  \n```cpp\n// B+-树的抽象类定义\ntemplate <typename Key, typename E>class BPNode {\npublic:\n\
  \    BPNode* lftptr;\n    BPNode* rghtptr; // 指向兄弟节点\n    virtual BPNode() {} //\
  \ 基类析构函数\n    virtual bool isLeaf() const =0;\n    // 如果节点是叶子节点返回真\n    virtual\
  \ bool isFull() const =0;\n    // 如果节点为满返回真\n    virtual int numrecs() const =0;\n\
  \    // 当前记录数\n    virtual Key* keys() const=0;\n    // 返回键数组\n};\n```\n\n需要注意的一个实现细节是，虽然图\
  \ 10.17 显示内部节点包含三个键和四个指针，但 `BPNode` 类略有不同，因为它存储的是键/指针对。图 10.17 显示的是传统画法的 B+-树。为了简化实际实现，节点实际上确实将每个指针与一个键关联。应假设每个内部节点在最左位置持有一个额外的键，该键小于或等于节点最左侧子树中任何可能的键值。B+-树的实现通常在最左叶子节点中存储一个哑记录，其键值小于任何合法的键值。\n\
  \nB+-树非常适合范围查询。一旦找到范围内的第一个记录，就可以通过顺序处理第一个节点中的剩余记录，然后根据需要继续向下遍历叶子节点链表来访问范围内的其他记录。图\
  \ 10.18 展示了 B+-树。\n\nB+-树中的搜索与普通 B 树的搜索几乎相同，但搜索必须始终继续到正确的叶子节点。即使在内部节点中找到了搜索键值，它也只是一个占位符，并不提供访问实际记录的方法。要在图\
  \ 10.18 的 B+-树中找到键值为 33 的记录，搜索从根节点开始。存储在根节点中的值 33 仅作为占位符，表示大于等于 33 的键位于第二个子树中。从根节点的第二个孩子开始，采取第一个分支到达包含键值为\
  \ 33 的实际记录（或指向实际记录的指针）的叶子节点。图 10.19 显示了 B+-树搜索算法的伪代码草图。\n\n```cpp\ntemplate <typename\
  \ Key, typename E>\nE BPTree<Key, E>::findhelp(BPNode<Key,E>* rt, const Key k) const\
  \ {\n    int currec = binaryle(rt->keys(), rt->numrecs(), k);\n    if (rt->isLeaf())\
  \ {\n        if ((((BPLeaf<Key,E>*)rt)->keys())[currec] == k)\n            return\
  \ ((BPLeaf<Key,E>*)rt)->recs(currec);\n        else return NULL;\n    } else {\n\
  \        return findhelp(((BPInternal<Key,E>*)rt)->pointers(currec), k);\n    }\n\
  }\n```\n**图 10.19** B+-树搜索方法的实现。\n\nB+-树的插入类似于 B 树的插入。首先找到应该包含该记录的叶子节点 `L`。如果 `L`\
  \ 未满，则添加新记录，且不会影响其他 B+- 树节点。如果 `L` 已经满，则将其分成两部分（将记录平均分配到两个节点中），并将新形成的右节点中值最小的键的副本向上提升。与\
  \ 2-3 树一样，提升可能会导致父节点相应分裂，最终可能导致根节点分裂并使 B+-树增加一级。B+-树的插入保持所有叶子节点处于相同的深度。图 10.20 通过几个示例说明了插入过程。图\
  \ 10.21 显示了 B+-树插入算法的 C++ 风格伪代码草图。\n\n要从 B+-树中删除记录 `R`，首先找到包含 `R` 的叶子节点 `L`。如果 `L`\
  \ 的填充程度超过一半，我们只需要删除 `R`，让 `L` 仍然保持至少半满。图 10.22 展示了这一点。\n\n如果删除记录导致节点中的记录数低于最小阈值（称为欠载），我们必须采取措施来保持节点足够满。第一种选择是查看节点的相邻兄弟节点，确定它们是否有空闲记录可以用来填充空隙。如果是，则从兄弟节点转移足够的记录，使得两个节点拥有大致相同的记录数。这样做是为了尽可能地推迟下一次删除导致该节点再次欠载。这一过程可能需要修改父节点的占位符键值，以反映每个节点中真实的第一个键值。图\
  \ 10.23 展示了这一过程。\n\n\n\n因此，存储利用率必须至少达到 50%。这对许多实现来说是令人意的，但请注意，保持节点更满会导致所需空间减少（因为磁盘文件中的空空间更少），且处理效率更高（平均读取到内存的块较少，因为每个块中的信息量更大）。由于\
  \ B 树已经非常流行，许多算法设计师都尝试改进 B 树的性能。其中一种方法是使用被称为 B*树的 B+-树变体。B*树与 B+-树相同，不同之处在于用于分裂和合并节点的规则。B*树在节点溢出时不是将节点一分为二，而是尽可能将一些记录交给相邻的兄弟节点。如果兄弟节点也是满的，那么这两个节点将分裂成三个。同样，当节点欠额时，它会与其两个兄弟节点合并，总数减少为两个节点。因此，节点始终至少保持三分之二满。\n\
  \n## 10.5 B 树\n\n#### 10.5.2 B 树分析\n\n从 B 树、B+-树和 B*树中搜索、插入和删除记录的渐近代价为 $\\Theta(\\\
  log n)$，其中 $n$ 是树中记录的总数。然而，对数的基数是树的（平均）分支因子。\n\n典型的数据库应用使用极高的分支因子，可能 100 或更高。因此，在实践中，B\
  \ 树及其变体是非常浅的。\n\n为了说明这一点，考虑一个阶数为 100 的 B+-树，其叶子节点最多包含 100 条记录。高度为一（即单个叶子节点）的 B+-树最多可以有\
  \ 100 条记录。高度为二（子为叶子节点的根内部节点）的 B+-树必须至少有 100 条记录（2 个包含 50 条记录的叶子节点）。它最多有 10,000 条记录（100\
  \ 个包含 100 条记录的叶子节点）。高度为三的 B+-树必须至少有 5000 条记录（有两个包含 50 个子节点的二级节点，每个子节点包含 50 条记录），最多有一百万条记录（100\
  \ 个二级节点，每个节点有 100 个满的子节点）。高度为四的 B+-树必须至少有 250,000 条记录，最多有 1 亿条记录。因此，需要一个巨大的数据库才能生成高度超过四的\
  \ B+-树。\n\nB+-树的分裂和插入规则保证了每个节点（根节点外）至少半满。因此它们平均大约有 3/4 满。但内部节点完全是开销，因为存储在那里的键仅用于树引导搜索，而不是存储实际数据。这种开销等同于对空间的显著浪费吗？不，因为由于树结构的高扇出率意味着绝大多数节点都是叶子节点。回想（自\
  \ 6.4 节），一个满的 K 叉树大约有 $1/K$ 的节点是内部节点。这意味着虽然一个满二叉树有一半的节点是内部节点，但在阶数为 100 的 B+-树中，可能只有大约\
  \ 1/75 的节点是内部节点。这意味着与内部节点相关的开销非常低。\n\n我们可以通过以下方法进一步减少 B 树所需的磁盘读取次数。首先，树的上层可以存储在内存中。然而，有时将某些节点（如根节点）“锁定”缓冲池中可能是理想的。\n\
  \n图 10.24：通过合并兄弟节点从图 10.18 的 B+-树中删除键值为 33 的记录。(a) 最左侧的两个叶子节点合并成一个叶子节点。遗憾的是，父节点现在只有一个孩子。(b)\
  \ 因为左侧子树有一个空闲的叶子节点，该节点被传递到右子树。根节点和右内部节点的占符值已更新以反映变化。值 23 移动到根节点，旧根值 33 移动到最右侧的内部节点。\n\
  \n```cpp\n/** Delete a record with the given key value, and return true if the root\
  \ underflows */\ntemplate <typename Key, typename E>\nbool BPTree<Key, E>::removehelp(BPNode<Key,E>*\
  \ rt, const Key& k) {\n    int currec = binaryle(rt->keys(), rt->numrecs(), k);\n\
  \    if (rt->isLeaf()) {\n        if (((BPLeaf<Key,E>*)rt)->keys()[currec] == k)\n\
  \            return ((BPLeaf<Key,E>*)rt)->del(currec);\n        else return false;\n\
  \    } else { // Process internal node\n        if (removehelp(((BPInternal<Key,E>*)rt)->pointers(currec),\
  \ k)) {\n            // Child will merge if necessary\n            return ((BPInternal<Key,E>*)rt)->underflow(currec);\n\
  \        } else return false;\n    }\n}\n```\n\n图 10.25：B+-树删除算法的 C++ 风格伪代码。\n\n\
  \n\n\n(b) 如果线性索引也存储在磁盘上（因此其大小仅受二级索引的限制），当使用如图 10.2 所示的 4096 字节（即 1024 个键值）的二级索引时，文件中最多可以存储多少条记录？二级索引的每个元素引用线性索引中某个磁盘块的最小键值。\n\
