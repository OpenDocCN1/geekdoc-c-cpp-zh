  \    // 指向标记数组的指针\npublic:\n    Graphl(int numVert) {\n        Init(numVert);\n\
  \    }\n    ~Graphl() {\n        // 析构函数\n        delete [] mark; // 返回动态分配的内存\n\
  \        for (int i=0; i<numVertex; i++) delete [] vertex[i];\n        delete []\
  \ vertex;\n    }\n    void Init(int n) {\n        int i;\n        numVertex = n;\n\
