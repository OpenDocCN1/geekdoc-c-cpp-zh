  \ is empty.\\n\";\n    else printhelp(root, 0);\n}\n};\n```\n\n图 5.14（续）\n\n然而，`find`\
  \ 操作最简单的实现方式是一个递归函数，其参数是子树的根和搜索键。成员函数 `findhelp` 符合该递归子程序所需的的形式，并实现如下：\n\n```cpp\n\
  template <typename Key, typename E>\nE BST<Key, E>::findhelp(BSTNode<Key, E>* root,\
  \ const Key& k) const {\n    if (root == NULL) return NULL;\n    // 树为空\n    if\
  \ (k < root->key())\n        return findhelp(root->left(), k);\n    // 检查左侧\n  \
  \  else if (k > root->key())\n        return findhelp(root->right(), k);\n    //\
  \ 检查右侧\n    else return root->element();\n    // 找到了\n}\n```\n\n一旦找到了所需的记录，它就会通过返回值沿着递归调用链向上传递。如果没有找到合适的记录，则返回\
  \ `null`。\n\n插入一个键值为 `k` 的记录需要我们首先找到如果该记录在树中，它应该所在的位置。这会引导我们到达一个叶子节点，或者一个在相应方向上没有子节点的内部节点。将此节点称为\
  \ `R`。然后我们将一个包含新记录的新节点作为 `R` 的子节点添加。图 5.15 展示了这一操作。值 35 被添加为值为 32 节点的右子节点。\n\n图\
  \ 5.15 BST 插入示例。将一个值为 35 的记录插入到图 5.13(a) 的 BST 中。值为 32 的节点成为包含 35 的新节点的父节点。\n\n\
  以下是 `inserthelp` 的实现：\n\n```cpp\ntemplate <typename Key, typename E>\nBSTNode<Key,\
  \ E>* BST<Key, E>::inserthelp(BSTNode<Key, E>* root, const Key& k, const E& it)\
  \ {\n    if (root == NULL)\n        // 树为空：创建节点\n        return new BSTNode<Key,\
  \ E>(k, it, NULL, NULL);\n    if (k < root->key())\n        root->setLeft(inserthelp(root->left(),\
  \ k, it));\n    else \n        root->setRight(inserthelp(root->right(), k, it));\n\
  \    return root;\n    // 返回插入了节点的树\n}\n```\n\n你应该仔细注意 `inserthelp` 的实现。\n\n注意 `inserthelp`\
  \ 返回的是一个指向 `BSTNode` 的指针。返回的是与旧子树完全相同的子树，只是它被修改为包含正在插入的新记录。从根节点到新添加到树中的新节点父节点路径上的每个节点都将被分配了其相应的子节点指针。除了路径上的最后一个节点外，这些节点中没有会真正改变它们的子节点指针值。从这个意义上说，许多赋值似乎是冗余的。\n\
  \n然而，为了保持插入过程简单，支付这些额外赋值的代价是值得的替代方案是检查给定的赋值是否有必要，这可能比赋值本身更贵！\n\nBST 的形状取决于元素插入的顺序。新元素作为新的叶子节点添加到\
  \ BST 中，可能会增加树的深度。图 5.13 展示了针对一组值的两个 BST。\n\n第 5.4 节 二叉搜索树\n\n从 BST 中删除节点比插入节点要稍微复杂一点，但如果单独考虑所有可能的情况，它并不复杂。在处理通删除过程之前，让我们先讨论如何从给定的子树中删除最小值的节点。要从子树中删除最小值节点，首先通过不断向左链接移动直到没有左链接为止找到该节点。将此节点称为\
  \ `S`。要删除 `S`，只需让 `S` 的父节点将其指针指向 `S` 的右孩子即可。我们知道 `S` 没有左孩子（因为如果 `S` 有左孩子，那么 `S`\
  \ 就不会是最小值节点）。名为 `deletemin` 的方法代码如下：\n\n```cpp\ntemplate <typename Key, typename\
  \ E>\nBSTNode<Key, E>* BST<Key, E>::deletemin(BSTNode<Key, E>* rt) {\n    if (rt->left()\
  \ == NULL) // 找到最小\n        return rt->right();\n    else {\n        // 继续向左\n \
  \       rt->setLeft(deletemin(rt->left()));\n        return rt;\n    }\n}\n```\n\
  \n图 5.16 删除最小值节点示例。图 5.16 展示了 `deletemin` 过程。从值为 10 的根节点开始，`deletemin` 沿着左链接移动直到没有左链接，在这种情况下到达值为\
  \ 5 的节点。值为 10 的节点被指向其右孩子。指向包含最小元素的指针存储在参数 `S` 中。`deletemin` 方法的返回值是删除最小值节点后的当前子树。与\
  \ `inserthelp` 方法一样，返回根节点路径上的每个节点的左孩子指针都会重新赋值为其调用 `deletemin` 方法产生的子树。\n\n一个实用的辅助方法是\
  \ `getmin`，它返回指向子树中最小值的指针。\n\n```cpp\ntemplate <typename Key, typename E>\nBSTNode<Key,\
  \ E>* BST<Key, E>::getmin(BSTNode<Key, E>* rt) {\n    if (rt->left() == NULL)\n\
  \        return rt;\n    else return getmin(rt->left());\n}\n```\n\n\n\n\n从 `BST`\
  \ 中删除给定键值 `R` 的节点需要我们首先找到 `R`，然后将其从树中删除。因此，删除操作的第一部分是搜索找到 `R`。一旦找到 `R`，就有几种可能的情况。如果\
  \ `R` 没有子节点，则将 `R` 的父节点指针设置为 `NULL`。如果 `R` 有一个子节点，则将 `R` 的父节点指向 `R` 的子节点（类似于 `deletemin`）。如果\
  \ `R` 有两个子节点，问题就出现了。虽然这种方法开销很大，但一种简单的方法是将 `R` 的父节点指向 `R` 的两个子树中的一个，然后逐一个地重新插入剩余子树的节点。更好的替代方案是在其中一个子树中找到一个可以替换\
  \ `R` 中值的键。\n\n因此，问题变成了：哪个值可以代替被删除的值？它不能是任何任意值，因为我们必须在不对树结构进行重大更改的情况下保持 `BST` 属性。哪一个值与被删除的值最相似？答案是：是比被删除的值大（或等于）该值的最小键值，否则是比被删除的值小的最大键值。如果这些值中的任何一个替换了被删除的值，`BST`\
  \ 属性就能维持。\n\n**示例 5.7** 假设我们想从图 5.13(a) 的 `BST` 中删除值 37。我们不是删除根节点，而是删除右子树中值最小的节点（使用\
  \ `deletemin` 操作）。\n\n该值随后可以替换根节点的值。在这个例子中，我们首先删除值为 40 的节点，因为它包含了右子树中的最小值。然后我们将\
  \ 40 替换为根节点的新值。\n\n**图 5.17** 从 `BST` 中删除值 37 的示例。包含该值的节点有两个子节点。我们用该节点右子树中的最小值（在本例中为\
  \ 40）来替换值 37。\n\n图 5.17 说明了这一过程。\n\n当树中没有出现重复节点值时，替换值是左子树的最大值还是右子树的最小值就没有区别。如果存储了重复值，那么我们必须从右子树中选择替换值。为了理解原因，假设左子树中的最大值为\
  \ `G`。\n\n如果左子树中的多个节点具有值 `G`，则选择 `G` 作为子树根的替换值将导致树在现在包含 `G` 的节点左侧出现具有相等的值。当我们用图\
  \ 5.13(b) 中左子树的最大值替换值 120 时，就会恰好发生这种情况。从右子树中选择最小值不会有类似的问题，因为即使右子树中出现相等的值，也不会违反二叉搜索树属性。\n\
  \n从上述内容我们可以看到，如果我们想删除存储在具有两个子节点的节点中的记录，我们只需要对该节点的右子树调用 `deletemin`，并将返回的记录替换掉被删除的记录。图\
  \ 5.18 显示了 `removehelp` 的实现。\n\n`findhelp` 和 `inserthelp` 的代价是找到或插入的节点的深度。`removehelp`\
  \ 的代价是被删除节点的深度，或者当该节点具有两个子节点时，其右子树中值最小的节点的深度。因此，在最坏的情况下，这些操作中任何一个的代价都是树中最深节点的深度。这就是为什么保持\
  \ `BSTs` 平衡（即高度尽可能低）是理想的。如果一棵二叉树是平衡的，那么 `n` 个节点树的高度大约为 `log n`。然而，如果树完全不平衡（例如呈链表状），那么具有\
  \ `n` 个节点的树的高度可能高达大 `n`。因此，平衡的 `BST` 在平均情况下操作的代价为 $\\Theta(\\log n)$，而极度不平衡的 `BST`\
  \ 在最坏情况下操作的代价为 $\\Theta(n)$。考虑通过逐一个插入记录来构建一个具有 `n` 个节点的 `BST` 的情况。如果我们足够幸运，它们到达的顺序产生了一个平衡的树（“随机”顺序对于这个目的可能足够了），那么每次插入的平均代价为\
  \ $\\Theta(\\log n)$，总代价为 $\\Theta(n \\log n)$。然而，如果记录按值递增的顺序插入，那么结果生成的树将是一条高度为\
  \ $n$ 的链。在这种情况下，插入的代价将是 $\\Theta(n²)$。\n\n```cpp\n// 删除键值为 k 的节点\n// 返回：删除了该节点的树\n\
  template <typename Key, typename E>\nBSTNode<Key, E>* BST<Key, E>::removehelp(BSTNode<Key,\
  \ E>* rt, const Key& k) {\n    if (rt == NULL) return NULL;\n    // k 不在树中\n   \
  \ else if (k < rt->key())\n        rt->setLeft(removehelp(rt->left(), k));\n   \
  \ else if (k > rt->key())\n        rt->setRight(removehelp(rt->right(), k));\n \
  \   else {\n        // 找到：删除它\n        BSTNode<Key, E>* temp = rt;\n        if (rt->left()\
  \ == NULL) {\n            // 只有右子节点\n            rt = rt->right();\n           \
  \ // 指向右侧\n            delete temp;\n        }\n        else if (rt->right() ==\
  \ NULL) { // 只有左子节点\n            rt = rt->left();\n            // 指向左侧\n       \
  \     delete temp;\n        }\n        else { // 左右都有\n            BSTNode<Key,\
  \ E>* temp = getmin(rt->right());\n            rt->setElement(temp->element());\n\
  \            rt->setKey(temp->key());\n            rt->setRight(deletemin(rt->right()));\n\
  \            delete temp;\n        }\n    }\n    return rt;\n}\n```\n图 5.18 BST\
  \ `removehelp` 方法的实现。\n\n遍历 `BST` 的代价为 $\\Theta(n)$，无论树的形状如何。每个节点被访问一次。\n\n下面是两个遍历示例。第一个是成员\
  \ `clearhelp`，它将 `BST` 的节点返回到空列表中。由于在释放节点本身之前必须释放其子节点，这是一个后序遍历。\n\n```cpp\ntemplate\
  \ <typename Key, typename E>\nvoid BST<Key, E>::clearhelp(BSTNode<Key, E>* root)\
  \ {\n    if (root == NULL) return;\n    clearhelp(root->left());\n    clearhelp(root->right());\n\
  \    delete root;\n}\n```\n\n下一个示例是 `printhelp`，它对 `BST` 执行序遍历以打印节点值。注意 `printhelp`\
  \ 通过缩进每一行来指示节点在树中的深度。因此我们传递树的当前层级 `level`，并在每次递归调用时增加此值。\n\n```cpp\ntemplate <typename\
  \ Key, typename E>\nvoid BST<Key, E>::printhelp(BSTNode<Key, E>* root, int level)\
  \ const {\n    if (root == NULL) return;\n    // 空树\n    printhelp(root->left(),\
  \ level + 1);\n    // 左子树\n    for (int i=0; i<level; i++) {\n        // 缩进层级\n\
  \        cout << \"**\";\n    }\n    cout << root->key() << \"\\n\";\n    // 打印键值\n\
  \    printhelp(root->right(), level + 1);\n    // 右子树\n}\n```\n\n\n\n\n在现实生活和计算机应用中，有很多情况使我们希望从一组人员、任务或对象中选择下一个“最重要”的某个。例如，医院急诊室的医生通常会选择下一个看“最危急”的患者，而不是先到达的患者。在多任务操作系统中调度程序执行时，在任何给定时刻，可能有几个程序（通常称为作业）准备就绪。选中的下一个作业是优先级最高的那个。优先级由与作业关联的特定值指示（该值在作业留在等待列表期间可能会改变）。\n\
  \n当一个对象集合按照重要性或优先级进行组织时，我们称之为**优先队列**。普通的队列数据结构无法高效地实现优先队列，因为搜索具有最高优先级的元素需要 `Θ(n)`\
  \ 时间。列表（无论是有序还是未排序的）在插入或删除元素时也需要 `Θ(n)` 时间。可以使用按优先级组织记录的 `BST`，在平均情况下，共 `n` 次插入和\
  \ `n` 次删除操作需要 `Θ(n log n)` 时间。然而，`BST` 始终存在变得平衡的可能性，从而导致性能下降。相反，我们希望找到一种在该特殊应用中能够保证良好性能的数据结构。\n\
  \n## 第 5.5 节堆与优先队列\n\n本节介绍 `heap` 数据结构。堆由两个属性定义。首先，它是一棵完全二叉树，因此堆几乎总是使用 5.3.3 节中介绍的完全二叉树数组表示法来实现。\n\
  \n其次，存储在堆中的值是有序的。这意味着任何节点中存储的值与其子节点的值之间存在某种关系。\n\n堆有两种变体，取决于这种关系的定义。\n\n**最大堆**（`max-heap`）具有属性：每个节点存储的值大于或等于其任一子节点的值。由于根的值大于或等于其子节点，而子节点的值大于或等于其子节点，因此根存储了树中所有值的最大值。\n\
  \n**最小堆**（`min-heap`）具有属性：每个节点存储的值小于或等于其子节点的值。由于根的值小于或等于其子节点，而子节点的值小于或等于其子节点，因此根存储了树中所有值中的最小值。\n\
  \n注意，在`最小堆`或`最大堆`中，节点的值与其兄弟节点的值之间没有必要的关系。例如，根的左子树中所有节点的值可能大于右子树每个节点的值。我们可以通过排序关系的强弱来对比\
  \ `BST` 和堆。`BST` 在其节点上定义了**全序**，即在给定树中任意两个节点的位置的情况下，位于“左侧”的（等价于在中序遍历中出现较早的）节点键值比位于“右侧”的的小。相比之下，堆实现的是**偏序**。给定位置，只有当其中一个节点是另一个节点的后代时，我们才能确定堆中两个节点键值的相对顺序。\n\
  \n`最小堆`和`最大堆`都有它们的用处。例如，7.6 节的堆排序（`Heapsort`）使用了`最大堆`，而 8.5.2 节的替换选择算法（`Replacement\
  \ Selection`）则使用了`最小堆`。本节其余部分的示例将使用`最大堆`。\n\n注意不要将堆的逻辑表示与其通过数组的完全二叉树进行的物理实现混淆。两者并不是等价的，因为堆的逻辑视图实际上是树形结构，而典型的物理实现使用数组。\n\
  \n图 5.19 显示了堆的实现。该类是一个带有两个参数的模板`E` 定义了存储在堆中的数据元素类型，而 `Comp` 是用于比较两个元素的比较类。该类可以通过更改\
  \ `Comp` 的定义来实现`最小堆`或 `最大堆`。`Comp` 定义了方法 `prior`，这是一个二元布尔函数，如果第一个参数在堆中应该排在第二个参数之前，则返回\
  \ `true`。\n\n该类定义对使用数组实现这一事实做了妥协。首先，堆节点通过其内部的逻辑位置来指示。\n\n```cpp\n// Heap class\n\
  template <typename E, typename Comp> class heap {\nprivate:\n    E* Heap;\n    //\
  \ 指向堆数组的指针\n    int maxsize;\n    // 堆的最大大小\n    int n;\n    // 堆中当前的元素数量\n    //\
  \ 将元素放在正确位置的辅助函数\n    void siftdown(int pos) {\n        while (!isLeaf(pos)) { //\
  \ 如果 pos 是叶子节点则停止\n            int j = leftchild(pos);\n            int rc = rightchild(pos);\n\
  \            if ((rc < n) && Comp::prior(Heap[rc], Heap[j]))\n                j\
  \ = rc;\n            // 将 j 设置为较大孩子的值\n            if (Comp::prior(Heap[pos], Heap[j]))\
  \ return; // 完成\n            swap(Heap, pos, j);\n            pos = j;\n       \
  \     // 向移动\n        }\n    }\npublic:\n    heap(E* h, int num, int max) // 构造函数\n\
  \    { \n        Heap = h;\n        n = num;\n        maxsize = max;\n        buildHeap();\
  \ \n    }\n    int size() const // 返回当前堆的大小\n    { return n; }\n    bool isLeaf(int\
  \ pos) const // 如果 pos 是叶子节点\n    { return (pos >= n/2) && (pos < n); }\n    int\
  \ leftchild(int pos) const // 返回左子节点位置\n    { return 2*pos + 1; }\n    int rightchild(int\
  \ pos) const // 返回右子节点位置\n    { return 2*pos + 2; }\n    int parent(int pos) const\
  \ // 返回父节点位置\n    { return (pos-1)/2; }\n    void buildHeap() // 堆化内容\n    { for\
  \ (int i=n/2-1; i>=0; i--) siftdown(i); }\n    // 将 \"it\" 插入堆\n    void insert(const\
  \ E& it) {\n        Assert(n < maxsize, \"堆满了\");\n        int curr = n++;\n   \
  \     Heap[curr] = it;\n        // 从堆末尾开始\n        // 向上移动直到 curr 的父大于 curr\n  \
  \      while ((curr!=0) && Comp::prior(Heap[curr], Heap[parent(curr)])) {\n    \
  \        swap(Heap, curr, parent(curr));\n            curr = parent(curr);\n   \
  \     }\n    }\n    // 第一个值\n    E removefirst() {\n        Assert(n > 0, \"堆为空\"\
  );\n        swap(Heap, 0, --n); // 将第一个与最后一个交换\n        if (n != 0) siftdown(0);\
  \ // 对新根进行下滤\n        return Heap[n]; // 返回删除的值\n    }\n    // 删除并返回指定位置的元素\n  \
  \  E remove(int pos) {\n        Assert((pos >= 0) && (pos < n), \"位置错误\");\n   \
  \     if (pos == (n-1)) n--; // 最后一个元素，无需操作\n        else {\n            swap(Heap,\
  \ pos, --n); // 与最后一个值交换\n            while ((pos != 0) && Comp::prior(Heap[pos],\
  \ Heap[parent(pos)])) {\n                swap(Heap, pos, parent(pos)); // 向上推大的键\n\
  \                pos = parent(pos);\n            }\n            if (n != 0) siftdown(pos);\
  \ // 向推小的键\n        }\n        return Heap[n];\n    }\n};\n```\n\n图 5.19 堆的实现。\n\
  \n\n\n\n不是通过指向节点的指针，而是通过堆本身。在实践中，逻辑上的堆位置与数组中编号相同的物理位置相对应。其次，构造函数接收一个指向要使用的数组的指针作为输入。这种方法为使用堆提供了最大的灵活性，因为客户端可以直接将所有数据值加载到数组中。这种优势体现在堆的构建阶段，如下文所示。构造函数还接收一个整数参数，表示堆的初始大小（基于起初加载到数组中的元素数量），以及另一个整数参数，表示堆允许的最大大小（数组的大小）。\n\
  \n方法 `heapsize` 返回堆的当前大小。`H.isLeaf(pos)` 如果位置 `pos` 是堆 `H` 中的一个叶子节点节点，则返回 `true`，否则返回\
  \ `false`。成员 `leftchild`、`rightchild` 和 `parent` 分别返回传入位置的左子节点、右子节点和父节点的位置（实际上是数组索引）。\n\
  \n构建堆的一种方法是逐个插入元素。`insert` 方法将一个新元素 `V` 插入堆中。你可能期望堆的插入过程类似于二叉搜索树（BST）的插入函数，从根节点开始向下处理堆工作。然而，这种方法可能不可行，因为堆必须保持完全二叉树的形状。等价地，如果堆在调用\
  \ `insert` 之前占据了数组的前 `n` 个位置，那么在之后它必须占据前 `n + 1` 个位置。为了实现这一点，`insert` 首先将 `V` 放在数组的第\
  \ `n` 位置。当然，`V` 不可能处于正确的位置。为了将 `V` 移动到正确的位置，将其与其父节点的值进行比较。如果 `V` 的值小于或等于其父节点的值，则它就处于正确的位置，插入例程完成。如果\
  \ `V` 的值大于其父节点的值，则两个元素交换位置。从这里开始，继续 `V` 与其（当前）父节点比较，直到 `V` 到达其正确的位置。\n\n由于堆是完全二叉树，它的高度保证是最小可能的。特别是，一个包含\
  \ `n` 个节点的堆高度将为 `Θ(n log n)`。直观上，我们可以预见这是必然的，因为我们添加的每一层都会使树中的节点数量略多于翻倍（树的节点数增加一倍）。等价地，如果堆在调用\
