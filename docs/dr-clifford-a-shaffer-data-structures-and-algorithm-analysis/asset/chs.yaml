  \ 节 图遍历\n\n393\n\n图遍历算法可以通过为每个顶点维护一个标记位（mark bit）来解决这两个问题。在算法开始时，所有顶点的标记位被清除。当遍历过程中遇到已标记的顶点时，则不会再次访问。当遍历算法完成后，我们可以通过检查标记位来判断是否所有顶点都已处理。如果未标记，我们可以从另一个顶点继续遍历。注意，该过程无论图是有向的还是无向的都适用。\n\
  \n```cpp\nvoid graphTraverse(Graph* G) {\n    int v;\n    for (v=0; v<G->n(); v++)\n\
  \        G->setMark(v, UNVISITED);\n    // 初始化标记位\n    for (v=0; v<G->n(); v++)\n\
  \        if (G->getMark(v) == UNVISITED)\n            doTraverse(G, v);\n}\n```\n\
  \n函数 `doTraverse` 可以通过节描述的图遍历方法来实现。\n\n### 1 深度搜索\n\n组织图遍历的第一方法是深度搜索（DFS）。每当搜索访问顶点\
  \ V 时，DFS 会递归地访问其所有未访问的邻居。等效地，DFS 将所有出的边添加到栈中。下一个访问的顶点通过弹出栈并沿着该边来确定。其效果是沿着图中的一个分支走到最后，然后回溯并沿着另一分支继续，以此此类推。DFS\
  \ 过程可以用于定义深度搜索树。该树由遍历过程中指向任何新（未访问）顶点的边组成，并排除了指向已访问顶点的边。DFS 可以应用于有向或无向图。以下是 DFS 算法的实现：\n\
  \n```cpp\nvoid DFS(Graph* G, int v) { // 深度搜索\n    PreVisit(G, v);\n    // 执行适当的操作\n\
  \    G->setMark(v, VISITED);\n    for (int w=G->first(v); w<G->n(); w = G->next(v,w))\n\
  \        if (G->getMark(w) == UNVISITED)\n            DFS(G, w);\n    PostVisit(G,\
  \ v);\n    // 执行适当的操作\n}\n```\n\n394\n第 11 章 图\n\n**图 11.8** (a) 一个图。(b) 从顶点 A 开始时该图的深度搜索树。\n\
  \n\n\n\n\n由于前序树遍历需要在访问子树之前执行操作，因此某些图遍历要求在处理 DFS 中更远处的顶点之前处理某个顶点。另一种，某些应用要求在处理完剩余顶点后执行活动；因此调用了函数\
  \ `PostVisit`。这将是利用第 1.3.2 节中描述的访问者设计模式的绝佳机会。\n\n图 11.8 展示了一个图及其对应的深度优先搜索树。图 11.9\
  \ 展示了图 11.8(a) 图的 DFS 过程。\n\n在有向图中，DFS 对每条边处理一次。在无向图中，DFS 从两个方向处理每条边。每个顶点必须被访问但只能访问一次，因此总代价为\
  \ $\\Theta(|V| + |E|)$。\n\n### 11.3.2 广度优先搜索\n\n我们的图遍历算法被称为广度优先搜索（BFS）。\n\nBFS 在访问更远的顶点之前检查所有与起始顶点连接的顶点。BFS\
  \ 的实现方式与 DFS 类似，用队列代替了递归栈。注意，如果图是一棵树且起始顶点是根节点，则 BFS 等同于从上到下逐层访问顶点。图 11.10 提供了 BFS\
  \ 算法的实现。图 11.11 展示了一个图和相应的广度优先搜索树。图 11.12 展示了图 11.11(a) 图的 BFS 过程。\n\n### 11.3.3\
  \ 拓扑排序\n\n假设我们需要调度一系列任务（例如课程或施工任务），在完成先决任务之前无法开始某个任务。我们希望将任务组织成线性顺序，以便我们逐一完成它们而不违反任何先决条件。我们可以使用有向无环图（DAG）对该问题建模。图是有向的，因为一个任务是另一个任务的先决——顶点之间具有定向关系。它是无的，因为循环表示存在冲突的先决序列，在不违反至少一个先决条件下无法完成。按线性顺序排列\
  \ DAG 顶点以满足先决规则的过程被称为拓扑排序。图 11.14 展示了这个问题。该示例的一个可接受拓扑排序是 J1, J2, J3, J4, J5, J6,\
  \ J7。\n\n可以通过对图执行 DFS 来找到拓扑排序。当访问一个顶点时，不采取任何操作（即函数 `PreVisit` 什么都不做）。当递归回溯到该顶点时，函数\
  \ `PostVisit` 打印该顶点。这产生一个反序拓扑排序。排序从哪里开始并不重要，只要最后访问了所有顶点即可。图 11.13 展示了基于 DFS 的算法实现。\n\
  \n**图 11.9** 从顶点 A 开始的图 11.8(a) 图的 DFS 过程的详细插图。描述了导致递归栈每次变化的步骤。\n\n```cpp\nvoid\
  \ BFS(Graph* G, int start, Queue<int>* Q) {\n    int v, w;\n    Q->enqueue(start);\n\
  \    // Initialize Q\n    G->setMark(start, VISITED);\n    while (Q->length() !=\
  \ 0) { // Process Q 上的所有顶点\n        v = Q->dequeue();\n        PreVisit(G, v);\n\
  \        // 采取适当的操作\n        for (w=G->first(v); w<G->n(); w = G->next(v,w))\n \
  \           if (G->getMark(w) == UNVISITED) {\n                G->setMark(w, VISITED);\n\
  \                Q->enqueue(w);\n            }\n    }\n}\n```\n\n**图 11.10** 广度优先图遍历算法的实现。\n\
  \n**图 11.11** (a) 一个图。(b) 从顶点 A 开始时该图的广度优先搜索树。\n\n我们可以使用队列而不是递归来实现拓扑排序，如下：首先访问所有边，计算每个顶点的先决条件数量。将所有没有先决条件的顶点放入队列。然后我们开始处理队列。当顶点\
  \ V 从队列取出时，打印它，并将 V 的所有邻居（即所有以 V 为先决条件的顶点）的计数减一。将计数变为零的任何邻居放入队列。如果队列在打印所有顶点之前变为空，则图包含环（即不存在不违反某些先决条件的任务可能排序）。使用队列版本的拓扑排序，图\
  \ 11.14 中图顶点的打印顺序为 J1, J2, J3, J6, J4, J5, J7。图 11.15 展示了该算法的实现。\n\n```cpp\nvoid\
  \ topsort(Graph* G) {\n    int i;\n    for (i=0; i<G->n(); i++) { // 初始化数组\n   \
  \     G->setMark(i, UNVISITED);\n    }\n    for (i=0; i<G->n(); i++) { // 调用递归辅助函数\n\
  \        if (G->getMark(i) == UNVISITED)\n            tophelp(G, i);\n    }\n}\n\
  \nvoid tophelp(Graph* G, int v) {\n    // 处理顶点 v\n    G->setMark(v, VISITED);\n\
  \    for (int w=G->first(v); w<G->n(); w = G->next(v,w))\n        if (G->getMark(w)\
  \ == UNVISITED)\n            tophelp(G, w);\n    printout(v);\n    // PostVisit\
  \ 顶点 v\n}\n```\n\n**图 11.12** DFS 过程的详细插图。\n**图 11.13** 递归拓扑排序的实现。\n**图 11.14**\
  \ 用于拓扑排序的示例图。\n\n\n\n\n\n```cpp\nif (Count[w] == 0) {\n    // 该顶点现在空闲\n    Q->enqueue(w);\n\
  }\n}\n```\n\n图 11.15 基于队列的拓扑排序算法。\n\n# 11.4 最短路径问题\n\n在道路地图上，连接两个城镇的道路通常用其距离进行标记。\n\
  \n我们可以将道路网络建模为一个有向图，其边标记为实数。这些数字代表两个顶点之间的距离（或其他代价指标，如旅行时间）。根据应用的不同，这些标记可能被称为权重、代价或距离。给定这样一个图，一个典型问题是找到两个指定顶点之间最短路径的总长度。这并不是一个而易举的问题，因为最短路径可能并不沿着连接两个顶点的边（如果存在的话），而是可能沿着某条涉及一个或多个中间顶点的路径。例如，在图\
  \ 11.16 中，从 `A` 到 `B` 再到 `D` 的路径代价为 15。直接从 `A` 到 `D` 的边代价为 20。从 `A` 到 `C` 再到 `B`\
  \ 再到 `D` 的路径代价为 10。因此，从 `A` 到 `D` 的最短路径是 10（而不是沿着连接 `A` 到 `D` 的边）。我们使用符号 `d(A, D)\
  \ = 10` 表示从 `A` 到 `D` 的最短距离为 10。在图 11.16 中，没有从 `E` 到 `B` 的路径，因此我们设置 `d(E, B) = ∞`。我们定义\
  \ `w(A, D) = 20` 为边 `(A, D)` 的权重，即从 `A` 到 `D` 直接连接的权重。由于没有从 `E` 到 `B` 的边，所以 `w(E,\
  \ B) = ∞`。注意 `w(D, A) = ∞`，因为图 11.16 的图是有向的。我们假设所有权重均为正数。\n\n第 11 章 图\n\n图 11.16\
  \ 最短路径定义的示例图。\n\n### 11.4.1 单源最短路径\n\n本节介绍了一种解决单源最短路径问题的算法。给定图 `G` 中的 `Vertex S`，找到从\
  \ `S` 到 `G` 中每个其他顶点的最短路径。我们可能只需要两个顶点 `S` 和 `T` 之间的最短路径。但在最坏情况下，在寻找从 `S` 到 `T` 的最短路径时，我们可能也找到了从\
  \ `S` 到每个其他顶点的最短路径。因此，在最坏情况下，寻找单个顶点最短路径的算法没有比寻找所有顶点的最短路径更好的算法。这里描述的算法将只计算到每个此类顶点的距离，而不记录实际路径。记录路径需要对算法进行修改，这被留作练习。\n\
  \n计算机网络为单源最短路径问题提供了一个应用。目标是找到一个计算机向网络上的所有其他计算机广播消息的最廉方法。网络可以建模为图，其边权重表示向邻居计算机发送消息的时间或代价。\n\
  \n对于无权图（或当所有边的代价都相同时），可以使用简单的广度优先搜索找到单源最短路径。当加入权重时，BFS 将无法给出正确答案。\n\n当边权重不同时，解决此问题的方法可能是按固定顺序处理顶点。将顶点标记为\
  \ `v0` 到 `vn-1`，其中 `S = v0`。在处理 `Vertex v1` 时，我们取连接 `v0` 和 `v1` 的边。处理 `v2` 时，我们考虑从\
  \ `v0` 到 `v2` 的最短距离，并将其与从 `v0` 到 `v1` 到 `v2` 的最短距离比较。在处理 `Vertex vi` 时，我们考虑已经处理过的\
  \ `Vertices v0` 到 `vi-1` 的最短路径。\n\n不幸，到 `vi` 的真实最短路径可能会经过 `j > i` 的 `Vertex vj`。\n\
  \n该算法不会考虑这种路径。但如果我们按照距离 `S` 的远顺序处理顶点，问题就不会发生。假设我们已经按照距离 `S` 的顺序顺序处理了离 `S` 最近的前 `i\
  \ - 1` 个顶点；将这些顶点集合称为 `S`。我们现在准备处理第 i 近的顶点；称之为 `X`。\n\n```cpp\n// 计算从 \"s\" 的最短路径距离。\n\
  // 将这些距离返回在 \"D\" 中。\nvoid Dijkstra(Graph* G, int* D, int s) {\n    int i, v, w;\n\
  \    for (i=0; i<G->n(); i++) {\n        // 处理顶点\n        v = minVertex(G, D);\n\
  \        if (D[v] == INFINITY) return; // 不可达顶点\n        G->setMark(v, VISITED);\n\
  \        for (w=G->first(v); w<G->n(); w = G->next(v,w))\n            if (D[w] >\
  \ (D[v] + G->weight(v, w)))\n                D[w] = D[v] + G->weight(v, w);\n  \
  \  }\n}\n```\n\n图 11.17 Dijkstra 算法的实现。\n\n从 `S` 到 `X` 的最短路径其倒数第二个顶点必须在 `S` 中。从\
