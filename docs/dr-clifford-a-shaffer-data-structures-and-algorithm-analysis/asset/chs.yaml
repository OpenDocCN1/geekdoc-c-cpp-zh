  \ 问题。\n\n17.15 证明实数集是不可数的。使用类似于第 17.3.1 节的证明证明函数集是不可数的。\n\n17.16 使用第 17.3.2 节给出的归约方法，证明任意程序是否打印任何输出是不可判定的。\n\
  \n17.17 使用第 17.3.2 节给出的归约方法，证明任意程序是否执行了某个语句是不可判定的。\n\n17.18 使用第 17.3.2 节给出的归约方法，证明两个程序是否在完全相同的输入上停止是不可判定的。\n\
