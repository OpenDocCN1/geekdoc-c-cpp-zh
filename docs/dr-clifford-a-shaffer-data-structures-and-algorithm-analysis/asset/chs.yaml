  \ 将 (a) 中缺失的右孩子显式化后的二叉树。(d) 将 (b) 中缺失的左孩子显式化后的二叉树。\n\n**图 5.3** 满二叉树和完全二叉树的示例。(a)\
  \ 这棵树是满的（但不完全）。(b) 这棵树是完全的（但不满）。\n\n堆数据结构（第 5.5 节）是完全二叉树的一个示例。哈夫树（第 5.6 节）是满二叉树的一个示例。\n\
  \n### 5.1.1 满二叉树定理\n\n某些二叉树实现只在叶节点上存储数据，使用内部节点为树提供结构。更通地说，二叉树实现可能为内部节点需要某些空间，而为叶节点需要不同的空间。因此，为了分析此类实现所需的空间，了解在包含\
  \ `n` 个内部节点的树中，叶节点占总节点的最小和最大比例是有用的。\n\n遗憾的是，这个比例并不是固定的。一个具有 `n` 个内部节点的二叉树可能只有一个叶节点。这发生在内部节点被排列成一条链并以单个叶节点结束时，如图\
  \ 5.4 所示。在这种情况下，叶节点数量很少，因为每个内部节点只有一个非空孩子。要找到具有 `n` 个内部节点的树的叶节点数量的上界，首先注意到上界出现在每个内部节点都有两个非空孩子的时候，即树是满的。然而，这一观察并没有告诉我们什么形状的树会产生最高百分比的空叶。事实证明并不重要，因为所有具有\
  \ `n` 个内部节点的二叉树叶节点数量都是相同的。\n\n**图 5.4** 包含许多内部节点和单个叶节点的树。\n\n**定理 5.1 满二叉树定理：**\
  \ 具有 `n` 个内部节点的二叉树，其叶节点数量比 `n` 多 1。\n\n**证明：** 对内部节点数量 `n` 使用数学归纳法。\n\n**基础情况：**\
  \ 0 个内部节点的非空树有一个叶节点。1 个内部节点的二叉树有两个叶节点。因此，`n=0` 和 `n=1` 符合定理。\n\n**归纳假设：** 假设具有 `n−1`\
  \ 个内部节点的二叉树有 `n` 个叶节点。\n\n**归纳步骤：** 对于具有 `n` 个内部节点的树 `T`，选择一个孩子都是叶节点的内部节点 `I`。移除\
  \ `I` 的两个孩子，使 `I` 成为叶节点。记新树为 `T0`。`T0` 有 `n−1` 个内部节点。根据归纳假设，`T0` 有 `n` 个叶节点。现在恢复\
  \ `I` 的两个孩子。我们再次得到具有 `n` 个内部节点的树 `T`。`T` 有多少叶节点？因为 `T0` 有 `n` 个叶节点，加上两个孩子得到 `n+2`\
  \ 个。然而，节点 `I` 在 `T0` 中被计为叶节点之一，现在它变成了内部节点。因此，`T` 有 `n+1` 个叶节点和 `n` 个内部节点。\n\n通过数学归纳法，该定理对于所有\
  \ `n ≥ 0` 成立。\n\n在分析二叉树实现的空间需求时，了解树包含多少个空子树是有用的。满二叉树定理的简单扩展可以告诉我们任何二叉树（无论是否满）中有多少个子树。\n\
  \n## 第 5.2 节 二叉树遍历\n\n**定理 5.2** 非空二叉树中空子树的数量比树的节点数量多 1。\n\n**证明 1：** 取任意二叉树 `T`，并将每个空子树替换为叶节点。记新树为\
  \ `T0`。`T` 中的所有节点都将成为 `T0` 中的内部节点（因为是 `T` 的叶节点现在也有孩子了）。`T0` 是一棵满二叉树，因为 `T` 的每个内部节点现在在\
  \ `T0` 中必须有两个孩子，且 `T` 的每个叶节点在 `T0` 中也有两个孩子（即刚刚添加的叶节点）。满二叉树定理告诉我们，叶节点数量比内部节点数量多 1。因此，为了创建\
  \ `T0` 而添加的新叶节点数量比 `T` 的节点数量多 1。`T0` 中的每个叶节点对应于 `T` 中的一个空子树。因此，`T` 中空子树的数量比其节点数量多\
  \ 1。\n\n\n\n## 证明 2\n根据定义，二叉树 `T` 中的每个节点都有两个孩子，因此一个包含 `n` 个节点的树总共有 `2n` 个孩子。除了根节点外，每个节点都有父节点，因此共有\
  \ `n − 1` 个具有父节点。换句话说，有 `n − 1` 个非空孩子。由于孩子的总数为 `2n`，剩余的 `n + 1` 个孩子必须是空的。\n\n##\
  \ 二叉树节点 ADT\n\n正如链表由一组链接对象组成一样，树由一组节点对象组成。图 5.5 显示了一个二叉树节点的 ADT，称为 `BinNode`。该类将用于后文介绍的某些二叉树结构。`BinNode`\
  \ 类是一个带有参数 `E` 的模板类，其中 `E` 是存储在节点中的数据记录的类型。该类提供了成员函数，用于设置或返回元素值、设置或返回左子节点指针、设置或返回右子节点指针，或者指示节点是否为叶子节点。\n\
  \n**图 5.5** 二叉树节点 ADT。\n\n```cpp\n// Binary tree node abstract class\ntemplate <typename\
  \ E> class BinNode {\npublic:\n    virtual ~BinNode() {} // Base destructor\n  \
  \  // Return the node’s value\n    virtual E& element() = 0;\n    // Set the node’s\
  \ value\n    virtual void setElement(const E&) = 0;\n    // Return the node’s left\
  \ child\n    virtual BinNode* left() const = 0;\n    // Set the node’s left child\n\
  \    virtual void setLeft(BinNode*) = 0;\n    // Return the node’s right child\n\
  \    virtual BinNode* right() const = 0;\n    // Set the node’s right child\n  \
  \  virtual void setRight(BinNode*) = 0;\n    // Return true if the node is a leaf,\
  \ false otherwise\n    virtual bool isLeaf() = 0;\n};\n```\n\n## 二叉树遍历\n\n我们通常希望通过“访问”二叉树的每个节点来处理二叉树，每次执行一个特定的操作，例如打印节点的内容。以某种顺序访问所有节点的过程被称为遍历。任何恰好列出树中每个节点的遍历都称为树节点的枚举。某些应用程序并不要求节点按特定顺序访问，只要每个节点被恰好访问一次即可。对于其他应用程序，节点必须按照保留某种关系的顺序进行访问。例如，我们可能希望在访问任何给定节点之前先访问它的孩子。这被称为前序遍历。\n\
  \n**示例 5.1** 图 5.1 中树的前序枚举为 ABDCEGFHI。\n\n打印打印的节点是根节点。然后，在打印任何右子树节点之前，先打印左子树的所有节点（按前序顺序）。\n\
  \n或者，我们可能希望在访问其孩子（及其子树）之后再访问每个节点。例如，如果我们希望将树中的所有节点释放到堆中，这样做就是必要的。我们希望在删除节点本身之前删除该节点的节点。但要做到这一点，需要先删除孩子的孩子，依此类推。这被称为后序遍历。\n\
  \n**示例 5.2** 图 5.1 中树的后序枚举为 DBGEHIFCA。\n\n中序遍历首先访问左孩子（包括其整个子树），然后访问节点，最后访问右孩子（包括其整个子树）。第\
  \ 5.4 节中的二叉搜索树利用这种遍历按值的升序顺序打印所有节点。\n\n**示例 5.3** 图 5.1 中树的中序枚举为 BDAGECHFI。\n\n遍历程序自然被写成一个递归函数。它的输入参数是一个指向节点的指针，我们称之为\
  \ `rt`，因为每个节点都可以被视为某些子树的根。遍历函数的初始调用传递了指向树根节点的指针。遍历函数按照所需的顺序访问 `rt` 及其孩子（如果有）。例如，前序遍历规定在访问其孩子之前访问\
  \ `rt`。这可以很容易地实现如下：\n\n```cpp\ntemplate <typename E>\nvoid preorder(BinNode<E>*\
  \ root) {\n    if (root == NULL) return; // Empty subtree, do nothing\n    visit(root);\n\
  \    // Perform desired action\n    preorder(root->left());\n    preorder(root->right());\n\
  }\n```\n\n`preorder` 函数首先检查树是否为空（如果为空，则遍历完成，`preorder` 直接返回）。否则，`preorder` 调用 `visit`，由\
  \ `visit` 处理根节点（即打印值或执行应用程序所需的任何计算）。随后在左子树上递归调用 `preorder`，这将访问该子树中的所有节点。最后，在右子树上调用\
  \ `preorder`，访问右子树中的所有节点。\n\n后序和中序遍历是相似的。它们只是根据需要改变了访问节点及其孩子的顺序。\n\n在树上实现任何递归函数时，一个重要的决策是何时检查空子树。`preorder`\
  \ 函数首先检查 `root` 的值是否为 `NULL`。一些程序员使用另一种设计，在其中检查左、右孩子。这种设计通常如下：\n\n```cpp\ntemplate\
  \ <typename E>\nvoid preorder2(BinNode<E>* root) {\n    visit(root);\n    // Perform\
  \ whatever action is desired\n    if (root->left() != NULL) preorder2(root->left());\n\
  \    if (root->right() != NULL) preorder2(root->right());\n}\n```\n\n起初 `preorder2`\
  \ 似乎比 `preorder` 更高效，因为它的递归调用只有后的一半。另一方面，`preorder2` 必须访问左右指针的频率是两倍。结果是性能提升很少或完全没有提升。实际上，`preorder2`\
  \ 的设计在两个方面都劣于 `preorder`。首先，虽然在这个简单的示例中并不明显，但对于更复杂的遍历，在调用代码中放置 `NULL` 指针检查可能会变得很笨拙。即使在这里，我们也必须为\
  \ `NULL` 编写两个测试，而 `preorder` 仅需一个。`preorder2` 更重要的问题是它容易出错。虽然 `preorder2` 确保不会对空子树进行递归调用，但如果初始调用传递了一个\
  \ `NULL` 指针，它将会失败。为了避免这个错误，要么 `preorder2` 需要在开始对 `NULL` 指针进行额外测试（这使得后续测试都是冗余的），要么\
  \ `preorder2` 的调用者承担着传递非空树的隐藏义务，这是一种不可靠的设计。结果是许多程序员忘记测试遍历空树的情况。\n\n通过使用第一种显式支持处理空子树的设计可以避免这个问题。\n\
  \n在设计遍历时要考虑的另一个问题是如何定义在每个节点上执行的访问函数。一种方法是为每个需要的访问函数简单地编写一个新遍历版本。这种方法的缺点是，执行遍历的函数必须能够访问\
  \ `BinNode` 类。可能更好的设计是仅允许树类访问 `BinNode` 类。\n\n另一种方法是让树类提供一个通用的遍历函数，将访问者作为模板参数或函数参数传入。\n\
  \n\n\n\n这被称为访问者模式（visitor design pattern）。这种方法的一个主要限制是，所有访问者函数的签名（即返回类型和参数）必须提前固定。因此，通用遍历函数的设计者必须能够充分判断潜在的访问者函数可能需要哪些参数和返回类型。\n\
  \n处理程序部分之间的信息流是一项重大的设计挑战，特别是在处理如树遍历等递归函数时。通常，我们可能会遇到两种问题：要么未能传递函数执行工作所需的正确信息，要么未能将信息返回给递归函数的调用者。我们将在书中看到许多示例，说明在递归函数遍历树结构时如何进出出地传递信息。以下是几个简单的例子。\n\
  \n首先，我们考虑一种简单的情况，即计算需要将信息向树上传递给最终用户。\n\n**示例 5.4** 我们希望统计二叉树中的节点数量。关键的洞察是：任何（非空）子树的总数等于根节点的一个，加上左右子树的计数。左右子树的计数从哪里来？通过对子树调用函数\
  \ `count` 可以为我们计算出结果。因此，我们可以如下实现 `count`：\n\n```cpptemplate <typename E>\nint count(BinNode<E>*\
  \ root) {\n    if (root == NULL) return 0;\n    // 无需计数\n    return 1 + count(root->left())\
  \ + count(root->right());\n}\n```\n\n在递归处理数据集合时，另一个出现的问题是控制集合中的哪些成员将被访问。例如，某些树的“遍历”实际上只访问某些树节点，而避免对其他节点进行处理。练习\
  \ 5.20 必须在二叉搜索树的背景下恰解决这个问题。它必须只访问给定节点中可能落在给定值范围内的子节点。幸运的是，这只需要简单的局部计算就能确定要访问哪个子节点（或哪些）。\n\
  \n下面的问题说明了一个更困难的情况。给定任意任意二叉树，我们希望确定：对于每一个节点 `A`，`A` 左子树中的所有节点是否都小于 `A` 的值，且 `A`\
  \ 右子树中的所有节点是否都大于 `A` 的值？（这恰好是 5.4 节描述的二叉搜索树的定义。）遗憾的是，为了做出这个判断，我们需要一些仅通过查看节点的父节点或节点无法获取的上下文信息。\n\
  \n如图 5.6 所示，仅验证 `A` 的左子节点的值小于 `A` 且 `A` 的右子节点的值大于是不够的。同样验证 `A` 的值与其父节点的值一致也是不够的。事实上，我们需要知道关于给定节点哪些值范围是合法的信息。这些信息可能来自该节点的任何祖先。因此，相关的范围信息必须沿树向下传递。我们可以如下实现此函数：\n\
  \n```cpptemplate <typename Key, typename E>\nbool checkBST(BSTNode<Key,E>* root,\
  \ Key low, Key high) {\n    if (root == NULL) return true; // 空子树\n    Key rootkey\
  \ = root->key();\n    if ((rootkey < low) || (rootkey > high)) return false; //\
  \ 越界\n    if (!checkBST<Key,E>(root->left(), low, rootkey)) return false; // 左侧失败\n\
  \    return checkBST<Key,E>(root->right(), rootkey, high);\n}\n```\n\n## 5.3 二叉树节点的实现\n\
  \n在本节中，我们研究了实现二叉树节点的方法。我们首先介绍基于指针的二叉树节点实现方案。然后讨论了确定特定实现空间需求的技术。本节最后介绍了针对完全二叉树的基于数组的实现。\n\
  \n### 5.3.1 基于指针的实现\n\n根据定义，所有的二叉树节点都有两个孩子，尽管一个或两个孩子可能为空。二叉树节点通常包含一个值字段，该字段的类型取决于应用程序。最常见的节点实现包含一个值字段和指向两个子节点的指针。\n\
  \n图 5.7 显示了 `BinNode` 抽象类的简单实现，将其命名为 `BSTNode`。`BSTNode` 类包含一个类型为 `E`（第二个模板参数）的数据成员，用于元素类型。为了支持二叉搜索树等搜索结构，还包含了一个额外的字段以及相应的访问方法，用于存储键值（其目的在\
  \ 4.4 节中解释）。其类型由命名为 `Key` 的第一个模板参数决定。\n\n每个 `BSTNode` 对象还有两个指针，一个指向左子节点，另一个指向右子节点。可以添加重载的\
  \ `new` 和 `delete` 运算符以支持空闲列表（freelist），如 4.1.2 节所述。图 5.8 展示了 `BSTNode` 的实现。\n\n\
  有些程序员发现为节点添加一个指向父节点的指针是方便的，允许在树中轻松向上移动。使用父指针类似于向双向链表中添加链接。在实践中，父指针几乎是不必要的，并且增加了空间开销。\n\
  \n```cpptemplate <typename Key, typename E>\nclass BSTNode : public BinNode<E> {\n\
  private:\n    Key k; // 节点的键\n    E it; // 节点的值\n    BSTNode* lc; // 指向左节点的指针\n\
  \    BSTNode* rc; // 指向右节点的指针\npublic:\n    // 两个构造函数——带初始值和不带初始值\n    BSTNode()\
  \ { lc = rc = NULL; }\n    BSTNode(Key K, E e, BSTNode* l =NULL, BSTNode* r =NULL)\
  \ {\n        k = K; it = e; lc = l; rc = r;\n    }\n    ~BSTNode() {} // 析构函数\n\
  \    // 设置和返回值与键的函数\n    E& element() { return it; }\n    void setElement(const\
  \ E& e) { it = e; }\n    Key& key() { return k; }\n    void setKey(const Key& K)\
  \ { k = K; }\n    // 设置和返回子节点的函数\n    inline BSTNode* left() const { return lc;\
  \ }\n    void setLeft(BinNode<E>* b) { lc = (BSTNode*)b; }\n    inline BSTNode*\
  \ right() const { return rc; }\n    void setRight(BinNode<E>* b) { rc = (BSTNode*)b;\
  \ }\n    // 如果是叶节点则返回 true，否则返回 false\n    bool isLeaf() { return (lc == NULL) &&\
  \ (rc == NULL); }\n};\n```\n\n基于指针实现设计中的一个重要决策是是否对叶节点和内部节点使用相同的类定义。\n\n对两者使用相同的类会简化实现，但可能空间利用效率不高。某些应用程序仅在叶节点需要数据值。\n\
  \n\n\n其他应用要求叶子节点使用一种类型的值，而内部节点使用另一种。示例包括第 13.1 节的二叉字典树、第 13.3 节的 PR 四叉树、第 5.6 节的霍夫树以及图\
  \ 5.9 所示的表达式树。根据定义，只有内部节点具有非空子节点。\n\n如果我们对内部节点和叶子节点使用相同的节点实现，那么它们都必须存储子指针。但在叶子节点中存储子指针似乎是浪费的。因此，为内部节点和叶子节点采用单独实现可以节省空间的原因有很多。\n\
  \n作为叶子节点和内部节点存储不同信息的树的示例，考虑图 5.9 所示的表达式树。表达式树表示一个由加、减、乘、除等二元运算符组成的代数表达式。内部节点存储运算符，而叶子节点存储操作数。图\
  \ 5.9 的树表示表达式 `4x(2x + a) - c`。表达式树中叶子节点的存储需求与内部节点大不同。内部节点存储一小部分运算符中的一个，因此内部节点可以存储一个很小的代码来标识运算符，例如用于运算符字符符号的单个字节。相比之下，叶子节点存储变量名或数字，为了处理更广泛的可能值范围要大得多。同时，叶子节点不需要存储子指针。\n\
  \nC++ 允许我们通过使用类继承来区分叶子节点和内部节点。基类为对象提供了通用定义，而子类修改基类以添加更多细节。可以为一般的二叉树节点声明基类，并为内部节点和叶子节点定义子类。图\
  \ 5.10 中的基类命名为 `VarBinNode`。它包含一个名为 `isLeaf` 的虚成员函数，指示节点类型。内部节点和叶子节点类型的子类分别实现了 `isLeaf`。内部节点存储基类类型的子指针；它们不区分其子节点的实际子类。每当检查节点时，其对应的\
  \ `isLeaf` 就会就会指示该节点所属的子类。\n\n图 5.10 包含了两个派生自 `VarBinNode` 类的子类，分别名为 `LeafNode`\
  \ 和 `IntlNode`。`IntlNode` 类可以通过 `VarBinNode` 类型的指针访问其子节点。`traverse` 函数说明了这些类的用法。当\
  \ `traverse` 调用方法 `isLeaf` 时，C++ 运行时环境确定 `rt` 特定实例究竟是哪个子类，并调用该子类的 `isLeaf` 版本。然后\
  \ `isLeaf` 方法向调用者提供实际的节点类型。派生子类的其他成员函数通过适地对基类指针进行类型转换来访问，如函数 `traverse` 所示。\n\n\
  我们还有另一种方法来表示分离的叶子和内部节点，同样使用虚基类和针对两种类型的独立节点类。\n\n这种方法是使用组合设计模式来实现节点。这种方法与图 5.10 的方法明显不同，在于节点类本身实现了\
  \ `traverse` 的功能。图 5.11 显示了该实现。在这里，基类 `VarBinNode` 声明了一个每个子类必须实现的成员函数 `traverse`。然后，每个子类都根据其在遍历中的角色实现各自适当的行为。整个遍历过程通过在根节点上调用\
  \ `traverse` 来触发，根节点反过来又调用其子节点的 `traverse`。\n\n在比较图 5.10 和图 5.11 的实现时，两者各有优劣。前者不需要节点类感知\
  \ `traverse` 函数。通过这种方法，很容易向树类中添加新方法，以对树的节点执行其他遍历或其他操作。\n\n然而，我们看到图 5.10 中的 `traverse`\
  \ 确实需要熟悉每个节点子类。因此，添加新的节点子类将需要对 `traverse` 函数进行修改。相比之下，图 5.11 的方法要求任何需要遍历的树上的新操作也必须在节点子类中实现。另一方面，图\
  \ 5.11 的方法避免了 `traverse` 函数感知节点子类之间不同能力的需求。这些子类负责处理对自身执行遍历的责任。另一个次要优势是，`traverse`\
  \ 不需要显式地列举所有不同的节点子类并为每种子类指导适当的操作。在只有两个节点类的情况下，这是一个要要的问题。但如果有这样的子类，这可能会变成一个更大的问题。一个缺点是不能在\
  \ `NULL` 指针上调用遍历操作，因为没有对象可以捕获该调用。可以使用享量模式（见第 1.3.1 节）来实现空节点，从而避免这个问题。\n\n通常情况下，如果\
  \ `traverse` 是树类的成员函数，并且节点子类如下，则在本示例中会优选图 5.10 版本：\n\n```cpp\n// 使用简单继承的节点实现\nclass\
  \ VarBinNode {\n// 节点抽象基类\npublic:\n    virtual ~VarBinNode() {}\n    virtual bool\
  \ isLeaf() = 0;\n    // 子类必须实现\n};\nclass LeafNode : public VarBinNode { // 叶子节点\n\
  private:\n    Operand var;\n    // 操作数值\npublic:\n    LeafNode(const Operand& val)\
  \ { var = val; } // 构造函数\n    bool isLeaf() { return true; }\n};\n// LeafNode 的版本\n\
  Operand value() { return var; }\nclass IntlNode : public VarBinNode { // 内部节点\n\
  private:\n    VarBinNode* left;\n    // 左子节点\n    VarBinNode* right;\n    // 右子节点\n\
  \    Operator opx;\n    // 运算符值\npublic:\n    IntlNode(const Operator& op, VarBinNode*\
  \ l, VarBinNode* r)\n    { opx = op; left = l; right = r; }\n    bool isLeaf() {\
  \ return false; }\n};\n// IntlNode 的版本\nVarBinNode* leftchild() { return left; }\n\
  VarBinNode* rightchild() { return right; }\nOperator value() { return opx; }\n\n\
  void traverse(VarBinNode *root) {\n// 前序遍历\n    if (root == NULL) return;\n    //\
  \ 无需访问\n    if (root->isLeaf()) {\n        // 执行叶子节点\n        cout << \"Leaf: \"\
  \ << ((LeafNode *)root)->value() << endl;\n    } else {\n        // 执行内部节点\n   \
  \     cout << \"Internal: \" << ((IntlNode *)root)->value() << endl;\n        traverse(((IntlNode\
  \ *)root)->leftchild());\n        traverse(((IntlNode *)root)->rightchild());\n\
  \    }\n}\n```\n图 5.10 使用 C++ 类继承和虚函数实现内部和叶子节点表示。\n\n```cpp\n// 使用组合模式的节点实现\nclass\
  \ VarBinNode {\n// 节点抽象基类\npublic:\n    virtual ~VarBinNode() {}\n    // 通用析构函数\n\
  \    virtual bool isLeaf() = 0;\n    virtual void traverse() = 0;\n};\nclass LeafNode\
  \ : public VarBinNode { // 叶子节点\nprivate:\n    Operand var;\n    // 操作数值\npublic:\n\
  \    LeafNode(const Operand& val) { var = val; } // 构造函数\n    bool isLeaf() { return\
  \ true; }\n    // 叶子节点的 isLeaf\n    Operand value() { return var; }\n    // 返回节点值\n\
  \    void traverse() { cout << \"Leaf: \" << value() << endl; }\n};\nclass IntlNode\
  \ : public VarBinNode { // 内部节点\nprivate:\n    VarBinNode* lc;\n    // 左子节点\n  \
  \  VarBinNode* rc;\n    // 右子节点\n    Operator opx;\n    // 运算符值\npublic:\n    IntlNode(const\
  \ Operator& op, VarBinNode* l, VarBinNode* r)\n    { opx = op; lc = l; rc = r; }\n\
  \    bool isLeaf() { return false; }\n};\n```\n\n\n\n\n```cpp\nIntlNode(const Operator&\
  \ op, VarBinNode* l, VarBinNode* r)\n{\n  opx = op; lc = l; rc = r;\n}\n\n// 构造函数\n\
  bool isLeaf() { return false; }\n\n// IntlNode 的 isLeaf\nVarBinNode* left() { return\
  \ lc; }\n\n// 左节点\nVarBinNode* right() { return rc; } // 右节点\nOperator value() {\
  \ return opx; }\n\n// 值\nvoid traverse() { // 内部节点的遍历行为\n  cout << \"Internal: \"\
  \ << value() << endl;\n  if (left() != NULL) left()->traverse();\n  if (right()\
  \ != NULL) right()->traverse();\n}\n};\n\n// 执行前序遍历\nvoid traverse(VarBinNode *root)\
  \ {\n  if (root != NULL) root->traverse();\n}\n```\n\n**图 5.11** 另一种使用 C++ 类继承和虚拟函数、通过组合设计模式对内部节点和叶子节点进行分离表示的实现。在这里，`traverse`\
  \ 的功能被嵌入到节点子类中。\n\n166\n\n第 5 章 二叉树\n\n对该树类的用户隐藏了。另一方面，如果节点对于树的用户来说具有特定意义的对象（独立于它们作为树中节点的存在之外），那么图\
  \ 5.11 的版本可能更受欢迎，因为此时隐藏节点的内部行为变得更加重要了。\n\n组合设计的另一个优势是，实现每个节点类型的功能可能会更容易。这是因为你可以完全关注该节点类型完成工作所需的信息传递和其他行为。这消解了许多程序员在处理与递归处理相关的复杂信息流时感到无从措的复杂性。\n\
  \n### 5.3.2 空间需求\n\n本节介绍了计算二叉树实现所需开销大小的技术。请记住，开销是维护数据结构所需的空间。换句话之，它是任何未用于存储数据记录的空间。开销的大小取决于几个因素，包括哪些节点存储数据值（所有节点还是仅叶子节点）、叶子节点是否存储子指针，以及树是否为完全二叉树。\n\
  \n在类似于图 5.7 所示的简单指针的二叉树实现中，每个节点都有指向其子节点的指针（即使子节点为 `NULL`）。对于一个拥有 `n` 个节点的树，这种实现所需的总空间为\
  \ `n(2P + D)`。在这里，`P` 代表指针所需的空间，`D` 代表数据值所需的空间。整棵树的开销空间将是 `2Pn`。因此，开销比例为 `2P/(2P\
  \ + D)`。\n\n该表达式的实际值取决于指针与数据字段的相对大小。如果我们任意假设 `P = D`，那么一棵满树的总空间约有三分之二被开销占据。更糟糕的是，定理\
  \ 5.2 告诉我们，大约一半的指针是“浪费”的 `NULL` 值，它们仅用于指示树结构，而不能提供对新数据的访问。\n\n一种常见的实现不在节点中存储任何实际数据，而是存储指向数据记录的指针。在这种情况下，每个节点通常会存储三个指针，所有指针都是开销，导致开销比例为\
  \ `3P/(3P + D)`。\n\n如果只有叶子节点存储数据值，那么分配给开销的总空间比例取决于树是否完全。如果树不是完全的，理论上在一系列内部节点末末尾可能只有一个叶子节点。因此，对于非完全二叉树，开销可以是任意高的百分比。随着树越接近完全，开销比例越下降，在树真正完全时最低。在这种情况下，大约一半的节点是内部节点。\n\
  \n通过消除满二叉树中叶子节点的指针，可以节省大量空间。再次假设树存储一个指向数据字段的指针。由于大约一半的节点是叶子节点，一半是内部节点，而且现在只有内部节点拥有子指针，这种情况下的开销比例约为\
  \ `n(2P) / (n(2P) + Dn) = P / (P + D)`。\n\n如果 `P = D`，开销下降到约总空间的一半。然而，如果只有叶子节点存储有用信息，则这种实现的开销比例实际上占了总空间的三分之二，因为一半的“数据”空间是未被使用的。\n\
  \n如果一棵满二叉树只需要在叶子节点存储数据，更好的实现是让内部节点存储两个指针且没有数据字段，而叶子节点仅存储一个指向数据字段的指针。这种实现需要 `n2P\
  \ + n(p+d)` 单位的空间。如果 `P = D`，则开销为 `3P/(3P +D) = 3/4`。\n\n在总空间减少的同时开销比例反而上升了，这似乎不符合直觉。原因是我们改变了对“数据”的定义，仅指存储在叶子节点中的内容，因此虽然开销比例更高，但它是基于更低的总存储需求。\n\
  \n这种分析存在一个严重的缺陷。当使用内部节点和叶子节点的分离实现时，必须有一种方法区分节点类型。当通过 C++ 子类实现分离节点类型时，运行时环境为每个对象存储信息，使其能够确定（例如在调用\
  \ `isLeaf` 函数时）使用正确的子类。\n\n5.33 节 二叉树节点实现 167\n\n在 20 世纪 80 年代中期，我参与过一个使用四叉树存储空间数据的地理信息系统（见第\
  \ 13.3 节）。在当时空间是至关重要的资源，因此我们使用了位打包方法，将节点类型标志存储在父节点指针的最后一位。这在各种 32 位工作站上运行得完美。遗憾的是，当时的\
  \ IBM PC 兼容机使用的是 16 位指针。我们从未想出如何将代码移植到 16 位机器上。\n\n168\n\n第 5 章 二叉树\n\n### 5.3.3\
  \ 完全二叉树的数组实现\n\n上一节指出，在典型的二叉树节点实现中，大部分空间被用于结构开销，而不是存储数据。\n\n本节介绍了一种完全二叉树的简单、紧凑的实现方法。\n\
  \n\n\n\n回想，完全二叉树除了底层外，所有层都是满填充的，并且底层的所有节点都是从左到右填充。因此，一个拥有 `n` 个节点的完全二叉树只有一种可能的形状。你可能认为完全二叉树是一种非常罕见的情况，没有必要为它开发特殊的实现方法。然而，完全二叉树具有实际用途，最重要的是第\
  \ 5.5 节中讨论的堆数据结构。`Heaps` 通常用于实现优先级队列（第 5.5 节）和外部排序算法（第 8.5.2 节）。\n\n我们首先如图 5.12(a)\
  \ 所示，从左到右逐层为完全二叉树中的节点位置编号。数组可以高效地存储树的数据值，将每个数据值存放在数组与该节点在树中位置对应的数组位置上。图 5.12(b)\
  \ 列出了图 5.12(a) 中每个节点的子节点、父节点和兄弟节点的数组索引。从图 5.12(b) 中，你可以看到节点节点在数组中位置的规律。可以根据节点 `r`\
  \ 的索引推导出计算节点 `r` 的每个亲属数组索引的简单公式。访问节点的左孩子或右孩子不需要显式的指针。这意味着如果为具有 `n` 个节点的树选择大小为 `n`\
  \ 的数组，则数组实现没有任何额外开销。\n\n计算节点各种亲属数组索引的公式如下。树中的节点总数为 `n`。目标节点的索引为 `r`，它必须在 0 到 `n\
  \ - 1` 的范围内。\n\n- `Parent(r) = floor((r - 1)/2)`，如果 `r \\neq 0`。\n- `Left child(r)\
  \ = 2r + 1`，如果 `2r + 1 < n`。\n- `Right child(r) = 2r + 2`，如果 `2r + 2 < n`。\n- `Left\
  \ sibling(r) = r - 1`，如果 `r` 为偶数。\n- `Right sibling(r) = r + 1`，如果 `r` 为奇数且 `r +\
  \ 1 < n`。\n\n## 5.4 二叉搜索树\n\n第 4.4 节介绍了字典 ADT，以及基于排序列表和无序列表的字典实现。当用无序列表实现字典时，向字典插入新记录可以通过将其置于列表末尾来快速完成。然而，在无序列表中搜索特定记录在平均情况下需要\
  \ $\\Theta(n)$ 的时间。对于大型数据库来说，这可能太太慢了。另一种方法是将记录存储在排序列表中。如果列表使用链表实现，那么按排序顺序存储记录将不会给搜索操作带来速度提升。另一方面，如果我们使用基于数组的排序列表来实现字典，则可以使用二分查找在仅需\
  \ $\\Theta(\\log n)$ 时间内找到记录。然而，现在插入操作平均需要 $\\Theta(n)$ 的时间，因为一旦在排序列表中找到新记录的正确位置，可能需要移动许多记录以为新记录腾出空间。\n\
  \n是否有某种方法组织记录集合，使得插入记录和搜索记录都能快速完成？本节介绍了二叉搜索树（BST），它为该问题提供了一个改进的解决方案。\n\nBST 是一种符合以下条件的二叉树，该条件被称为二叉搜索树属性：键值为\
  \ `K` 的节点，其左子树中存储的所有节点的键值都小于 `K`。键值为 `K` 的节点，其右子树中存储的所有节点的键值都大于或等于 `K`。\n\n图 5.13\
  \ 显示了针对一组值的两个 BST。二叉搜索树属性的一个结果是，如果使用中序遍历（见第 5.2 节）打印 BST 节点，得到的枚举将是从低到高排序的顺序。\n\n\
  图 5.14 显示了实现字典 ADT 的 BST 类声明。公共成员函数包括字典所需的函数：\n\n**图 5.12** 完全二叉树及其数组实现。(a) 具有 12\
  \ 个节点的完全二叉树。每个节点都标记了其在树中的位置。(b) 每个节点各亲属的位置。破折号表示该亲属不存在。\n\n**图 5.13** 两个搜索树。(a)\
