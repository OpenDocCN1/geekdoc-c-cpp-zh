  \ | 17 | O | 67 |\n| C | 32 | P | 20 |\n| D | 42 | Q | 5 |\n| E | 120 | R | 59 |\n\
  | F | 24 | S | 67 |\n| G | 17 | T | 85 |\n| H | 50 | U | 37 |\n| I | 76 | V | 12\
  \ |\n| J | 4 | W | 22 |\n| K | 7 | X | 4 |\n| L | 42 | Y | 22 |\n| M | 24 | Z |\
  \ 2 |\n\n**图 5.23** 在选定的英语文档集中出现的 26 个字母的相对频率。“频率”代表每 1000 个字母的预期出现频率（不区分大小写）。\n\
  \n如果某些字符的使用频率高于其他字符，是否可以利用这一事实并以某种方式为它们分配较短的代码？代价可能是其他字符需要更长的代码，但如果这些字符出现得足够少见，这可能是值得的。这一概念是目前常用文件压缩技术的核心。下一节介绍了这种分配变长代码的方法，称为霍夫曼编码。虽然它没有以最简单的形式常用于文件压缩（有更好的方法），但霍夫曼编码体现了此类编码方案的特点。学习霍夫曼编码的一个动机是因为它让我们第一次看到一种被称为搜索字典（search\
  \ trie）的树结构。\n\n### 5.6.1 构建霍夫曼编码树\n\n霍夫曼编码为字符分配代码，使得代码的长度取决于对应字符的相对频率或权重。因此，它是一种变长编码。如果字母的估计频率与实际情况匹配，那么加密信息的长度通常比使用固定长度代码要短。霍夫曼编码源自一个被称为霍夫曼树的完全二叉树。霍夫曼树的每个叶子节点对应一个字母，我们定义叶子的权重为其权重（频率）。目标是构建一个具有最小外部路径权的树。定义叶子的加权路径长度为权重乘以深度。\n\
  \n为 `n` 个字母构建霍夫曼树的过程非常简单。首先，创建 `n` 个初始霍夫曼树，每个树都是包含一个字母的叶子节点。将这 `n` 个部分树放入按权重（频率）组织的优先级队列中。接下来，从优先级队列中移除前两个树（权重最小的两个）。将这两棵树合并创建一个新树，其根节点以此棵树作为子节点，权重为这两棵树权重的和。将这个新树放回优先级队列。重复此过程，直到所有的部分霍夫曼树都合并为一个。\n\
  \n**示例 5.8** 图 5.25 展示了图 5.24 中八个字母的霍夫曼树构建过程。按字母顺序任意排序 D 和 L，字母按频率排序如下：\n\n| 字母\
  \ | 频率 |\n| :--- | :--- |\n| Z | 2 |\n| K | 7 |\n| M | 24 |\n| C | 32 |\n| U | 37\
  \ |\n| D | 42 |\n| L | 42 |\n| E | 120 |\n\n由于列表前两个字母是 Z 和 K，它们被选择为第一个合并的树。它们成为权重为\
