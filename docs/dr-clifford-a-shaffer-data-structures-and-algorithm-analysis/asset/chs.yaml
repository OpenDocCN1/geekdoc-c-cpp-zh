  \n通常情况下，列表元素为两种类型之一：\n\n1.  原子（atom），即某种类型的数据记录，例如数字、符号或字符串。\n2.  另一个列表，称为称为子列表（sublist）。\n\
  \n包含子列表的列表将写为\n`hx1, hy1, ha1, a2i, y3i, hz1, z2i, x4i`。\n\n**图 12.1** 由树表示的多重列表示例。\n\
