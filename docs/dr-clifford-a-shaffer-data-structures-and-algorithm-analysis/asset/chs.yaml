  (e) 加权合并和路径压缩简化形式。在 `UNION` 操作后，等价关系中的两个节点将被设置为直接指向较大树的根。例如，考虑处理等价关系 `(A, B)`，其中\
  \ `A0` 是 A 的根`B0` 是 B 的根。假设根 `A0` 的树比根 `B0` 的树大。在 `UNION` 操作结束后，节点 `A`、`B` 和 `B0`\
  \ 都将直接指向 `A0`。\n\n\n\n\n我们在日常生活中会对许多事物进行排序：玩桥牌游戏时的一手牌牌；账单和其他一叠纸；调料罐等等。我们有很多直观的策略可以用于这些排序，这取决于我们需要排序的对象数量以及它们移动的难程度。排序也是最频繁的计算任务之一。我们可能会对数据库中的记录进行排序，以便高效地搜索集合。我们可能会按邮政编码对记录排序，以便更便宜地打印和邮寄。我们可能会将排序作为算法内在组成部分来解决其他问题，例如计算最小权重生成树时（参见第\
  \ 11.5 节）。\n\n由于排序如此重要，它自然受到了深入研究，并设计出了许多算法。其中一些算法是我们在日常生活中使用的方案的直接改进。另一些则与人类的操作方式完全不同，它们是为了排序存储在计算机上的数千甚至数百万记录而发明的。经过多年的研究，仍然存在与排序相关的未解决问题。针对特殊用途的应用，新的算法仍在开发和完善中。\n\
  \n本章在介绍计算机科学这一核心问题的同时，还有一个次要目的是阐明算法设计和分析中的问题。例如，这些排序算法展示了使用分治法的多种方法。特别是，有多种划分方法：`Mergesort`\
  \ 将列表一分为二；`Quicksort` 将列表分为大值部分和小值部分；而 `Radix Sort` 通过一次处理键的一个位数字来拆分问题。排序算法还可以展示各种分析技术。\n\
  \n我们发现，算法的平均情况增长率可能显著小于其最坏情况（如 `Quicksort`）。我们将看到如何利用另一个算法的最佳情况行为（`Insertion sort`）来加速排序算法（包括\
  \ `Shellsort` 和 `Quicksort`）。我们将看到几个如何调整算法以获得更好性能的示例。我们将看到某些算法的特殊情况使其成为特殊领域应用的良好解决方案（`Heapsort`）。排序为分析问题下界的重要技术提供了一个示例。排序还将用于为第\
  \ 8 章介绍的文件处理提供动机。\n\n本章涵盖了若干种适用于能够放入计算机主内存的记录集合的标准算法。它首先讨论了三种简单但相对较慢的算法，这些算法在平均和最坏情况下都需要\
  \ `Θ(n2)` 的时间。然后介绍了几种性能好得得多的算法，某些算法的最坏情况运行时间为 `Θ(n log n)`。最后介绍的排序方法在特殊条件下仅需 `Θ(n)`\
  \ 的最坏情况时间。\n\n本章以一个证明结束，即排序在最坏情况下需要 `Ω(n log n)` 的时间。\n\n## 7.1 排序术语和符号\n\n除非另有说明，本章介绍的排序算法的输入是存储在数组中的记录集合。记录之间通过第\
  \ 4.4 节引入的比较器类（comparator class）进行互为比较的。为了方便讨论，我们假设每条记录都有一个键字段（key field），其值由比较器从记录中提取。比较器类的\
  \ `key` 方法为 `prior`，当其第一个参数在排序后的列表应该出现在其第二个参数之前时，该方法返回 `true`。我们还假设对于每种类型的记录，都有一个\
  \ `swap` 函数，可以交换数组中两个记录的内容（参见附录）。\n\n给定一组具有键值 `k1, k2, ..., kn` 的记录集合 `r1, r2, ...,\
  \ rn`，排序问题是将记录排列成任何顺序 `s`，使得记录 `rs1, rs2, ..., rsn` 的键遵循属性 `ks1 ≤ ks2 ≤ ... ≤ ksn`。换句话说，排序问题排列一组记录，使得它们的键字段值是非递减的。\n\
  \n根据定义，排序问题允许输入具有相同键值的两个或多个记录。某些应用要求输入不包含重复的键值。除非另有说明，本章和第 8 章中介绍的排序算法都可以处理重复键值。\n\
  \n当允许重复键值时，重复项之间可能存在一种隐式排序，通常基于它们在输入中出现的顺序。保持这些重复项之间的这种初始顺序可能是理想的。如果一个排序算法不改变键值相同的记录的相对顺序，则称该算法是稳定的（stable）。本章介绍的许多算法（但不是所有）都是稳定的，或者可以通过微小的改变变为稳定。\n\
  \n在比较两种排序算法时，最直接的方法似乎是简单地编写两个程序并测量它们的运行时间。图 7.20 展示了此类计时的示例。然而，这种比较可能是误导性的，因为许多排序算法的运行时间取决于输入值的具体细节。特别是记录的数量、键和记录的大小、键值的允许范围，以及输入记录“乱序”的程度，都可能极大地影响排序算法的相对运行时间。\n\
  \n在分析排序算法时，传统做法是测量键之间的比较次数。这种衡量标准通常与算法的运行时间密切相关，并具有独立于机器和数据类型的优点。然而，在某些情况下，记录可能非常大，以至于它们的物理移动可能占据总运行时间的很大。如果是这样，测量算法执行的交换操作次数可能是合适的。在大多数应用中，我们可以假设所有记录和键都是固定长度的，且无论涉及哪些键，单次比较或单次交换操作都需要恒定的时间。某些特殊情况“改变了”比较排序算法的规则。例如，记录或键长度差异很大的应用程序（例如排序变长字符串序列）将从特殊用途的排序技术中受益。某些应用需要对少量记录进行排序，但需要频繁排序。例如，反复对一组数字进行排序的应用。在这种情况下，渐近分析中通常被忽略的常数现在变得至关重要。最后，某些情况要求排序算法尽可能少内存。我们将注明哪些排序算法输入数组之外需要额外的内存。\n\
  \n## 7.2 三种 Θ(n2) 排序算法\n\n本节介绍了三种简单的排序算法。虽然它们易于理解和实现，但我们很快会发现，当有大量记录需要排序时，它们的速度是不可接受的。尽管如此，在某些情况下，这些简单算法是处理该任务的最佳工具。\n\
  \n### 7.2.1 插入排序\n\n\n\n\n想象一下，你有一叠过去两年的电话账单，你想按日期对它们进行整理。一种相当自然的方法是查看前两张账单并对它们排序。然后取出第三张账单，相对于前两张账单将其放在正确的位置，以此此类推。当你处理每张账单时，都会将其添加到已经创建的排序堆中。这个自然直观的过程就是我们第一种排序算法的灵感，称为**插入排序**（Insertion\
  \ Sort）。插入排序遍历一个记录列表。每个记录依次被插入到由已处理记录构成的有序列表的正确位置上。\n\n234\n\n第 7 章 内部排序\n\ni=1\n\
  2\n3\n4\n5\n6\n7\n42\n20\n17\n13\n13\n13\n13\n13\n20\n42\n20\n17\n17\n14\n14\n14\n\
  17\n17\n42\n20\n20\n17\n17\n15\n13\n13\n13\n42\n28\n20\n20\n17\n28\n28\n28\n28\n\
  42\n28\n23\n20\n14\n14\n14\n14\n14\n42\n28\n23\n23\n23\n23\n23\n23\n23\n42\n28\n\
  15\n15\n15\n15\n15\n15\n15\n42\n\n**图 7.1** 插入排序的插图。每一列显示了在外部层 `for` 循环具有指定值 `i`\
  \ 迭代后的数组。每列中线以上的值已经排过序。箭头表示记录在数组中的向上移动。\n\n以下是 C++ 实现。输入是一个存储在数组 `A` 中的包含 `n` 个记录的数组。\n\
  \n```cpp\ntemplate <typename E, typename Comp>\nvoid inssort(E A[], int n) { //\
  \ 插入排序\n  for (int i=1; i<n; i++) {\n    // 插入第 i 个记录\n    for (int j=i; (j>0) &&\
  \ (Comp::prior(A[j], A[j-1])); j--) {\n      swap(A, j, j-1);\n    }\n  }\n}\n```\n\
  \n考虑 `inssort` 正在处理第 `i` 个记录的情况，其键值为 `X`。只要 `X` 小于它正上方的键值，记录就会在数组中向上移动。一旦遇到小于或等于\
  \ `X` 的键值，`inssort` 就会完成该记录的处理，因为数组中它之上的所有记录键值值都更小。图 7.1 展示了插入排序的工作原理。\n\n`inssort`\
  \ 的主体由两个嵌套的 `for` 循环组成。外部 `for` 循环执行 `n - 1` 次。内部 `for` 循环较难分析，因为它的执行次数取决于位置 1 到\
  \ `i - 1` 之间有多少个键的值小于位置 `i` 处键的值。在最坏的情况下，每个记录都必须到达数组的顶部。如果键值最初按从高到低的顺序排列（即排序顺序的反序），就会发生这种情况。在这种情况下，第一次通过\
  \ `for` 循环时的比较次数为 1，第二次为 2，以此此类推。因此，比较的总数将是 `n X i ≈ n2/2 = Θ(n2)`。\n\ni=2 \n\n\
  相比之下，考虑最好情况下的代价。这发生在键值开始按从低到高的有序顺序排列时。在这种情况下，每次通过内部 `for` 循环都会立即失败，且没有值会被移动。比较的总数将是\
  \ `n - 1`，即外部 `for` 循环执行的次数。因此，插入排序在最好情况下的代价是 `Θ(n)`。\n\n虽然最好情况明显比最坏情况快得多，但最坏情况通常是“典型”运行时间更可靠的指示。然而，在某些情况下，我们可以预期输入是排序的或几乎有序的。\n\
  \n一个例子是当已经排序的列表由于向列表中添加了少量元素而略微乱序；如果我们知道这种乱序很轻微，那么使用插入排序恢复有序顺序可能是一个好主意。利用插入排序近乎最佳情况运行时间的算法示例包括\
  \ 7.3 节的壳排序算法（Shellsort）和 7.5 节的快速排序算法（Quicksort）。\n\n插入排序的平均情况代价是多少？当处理记录 `i` 时，内部\
  \ `for` 循环执行的次数取决于该记录“乱序”的程度。特别是，对于数组位置 0 到 `i-1` 中每个大于记录 `i` 之键值的键，内部 `for` 循环都会执行一次。例如，在图\
  \ 7.1 最左侧的一列中，值 `15` 之前有五个大于 `15` 的值。每一次这样的发生被称为一次逆序（inversion）。逆序的数量（即在数组中出现在给定值之前的大于该值的数值数量）将决定必须发生的比较和交换次数。\n\
  \n我们需要确定位置 `i` 处记录的平均逆序数是多少。我们预计平均在前 `i - 1` 个数组位置中有一半的键值小于位置 `i` 处键的值。因此，平均情况应该是\
  \ `n2/2`，即 `Θ(n2)`。计算整个排序的交换次数将是最坏情况。因此，平均情况是 `Θ(n2)`。\n\n节 7.2 Θ(n2) 排序算法 235\n\
  \n7.2.2 冒泡排序\n\n我们的下一个排序算法称为冒泡排序（Bubble Sort）。冒泡排序通常在入门课程中教授。不幸的是，冒泡排序并没有什么优点。它比插入排序更难理解，而且最好情况运行时间很差。\n\
