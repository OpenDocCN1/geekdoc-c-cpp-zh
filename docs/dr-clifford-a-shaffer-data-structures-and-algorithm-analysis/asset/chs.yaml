  log n)$ 时间。\n\n### 14.19 回想，当哈希表填充率超过约一半时，其性能会迅速下降。该问题的一个解决方案是将哈希表中的所有元素重新插入到一个大小两倍的新哈希表中。假设插入到哈希表的（预期）平均情况代价为\
