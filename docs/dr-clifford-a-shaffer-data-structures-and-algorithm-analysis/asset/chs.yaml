  \ 实现如图 12.18 所示的 Deutsch-Schorr-Waite 垃圾回收算法。\n\n## 13 高级树结构\n\n本章介绍了几种为特殊应用程序设计的树结构。13.1\
  \ 节中的 `trie` 常用于存储和检索字符串。它还用于阐述键空间分解的概念。\n\n\n\n\n第 13.2 节中的 `tree` 和 `splay tree`\
  \ 是 `BST` 的变体。它们是自平衡搜索树的示例，无论记录的插入顺序如何，都能保证良好的性能。第 13.3 节介绍了用于种通过 `xy-coordinates`\
  \ 组织点数据的空间数据结构。\n\n文中给出了每种数据结构的基本操作描述。本章的一个目的是为课程编程项目提供机会，因此详细的实现留给读者自行。\n\n# 13.1\
  \ 字典树 (Tries)\n\n回想 `BST` 的形状取决于其数据记录插入的顺序。记录的某种排列可能会产生一棵平衡树，而另一种排列可能产生一棵不平衡树，极端情况下，它会变成链表的形状。这是因为根节点中存储的键值将键值范围分为两部分：小于根节点键值的键值，以及大于根节点键值的键值。根据根节点键值与树中其他记录键值分布之间的关系，生成的\
  \ `BST` 可能是平衡的也可能是不平衡的。\n\n因此，`BST` 是一种基于对象空间分解的数据结构示例，之所以这样命名，是因为键值范围的分解是由存储在树中的对象（即数据记录的键值）驱动的。\n\
  \n对象空间分解的替代方案是预定义树中每个节点在键值范围内的划分位置。换句话说，根可以预定义为将键值范围分为对等的部分，无论数据记录的具体值或插入顺序如何。位于键值范围下半部分的记录将存储在左子树中，而位于键值范围上半部分的记录将存储在右子树中。\n\
  \n虽然这种分解规则并不一定会导致平衡树（如果记录在键值范围内的分布不均匀，树将是不平衡的），但至少树的形状将取决于键的插入顺序。此外，树的深度将限于键值范围的分辨率；也就是说，树深度永远大于存储键值所需的位数。例如，如果键是范围从\
  \ `0` 到 `1023` 的整数，那么键的分辨率就是十位。因此，两个键只有在第十位之前可能是相同的。在最坏的情况下，两个键在树中遵循相同的路径只到第十个分支。结果是树的深度永远不会超过十层。相比之下，包含\
  \ `n` 条记录的 `BST` 深度可能达到 `n` 层。\n\n基于键值范围预定义划分的划分被称为键空间分解。在计算机图形学中，这种技术被称为图像空间分解，这个术语有时也描述数据结构。基于键空间分解的数据结构被称为\
  \ `trie`（字典树）。民间传说“trie”来源于“retrieval”（检索）。遗憾的是，这意味着该词的读音是“tree”，这会导致与“tree”一词的常规用法混淆。“Trie”的实际读音是“try”。\n\
  \n与 `B+-tree` 一样，`trie` 只在叶子节点中存储数据记录。内部节点作为引导搜索过程的占位符，但由于划分点是预定义的，内部节点不需要存储“交通引导”键值。图\
  \ 13.1 展示了 trie 的概念。必须对键值施加上下界限，以便我们计算键值范围的中点。由于此示例中插入的最大值为 `120`，因此假设范围从 `0` 到\
  \ `127`，因为 `128` 是大于 `120` 的最小 2 的幂。键的二进制值决定了在搜索过程的任意一点选择左分支还是右分支。最高位决定了根节点的分支方向。图\
  \ 13.1 显示了一个二叉 trie，之所以这样命名，是因为在这个示例中，trie 结构基于解释为二进制数的键值，这结果产生了一棵二叉树。\n\n第 5.6\
  \ 节中的 `Huffman coding tree` 是另一个二叉 trie 示例。哈曼树中的所有数据值都在叶子节点，每个分支都将可能的字母代码范围平一半。哈曼码实际上是从\
  \ trie 内的字母位置重构的。\n\n这些是二叉 trie 的示例，但 trie 可以具有任何分支因子。通常分支因子由使用的字母表决定。对于二进制数，字母表是\
  \ `{0, 1}`，从而产生二叉 trie。其他字母表会导致其他分支因子。\n\ntrie 的一个应用是存储单词字典。这种 trie 被称为字母表字典树（alphabet\
  \ trie）。为了简单起见，我们的示例将忽略字母的大小写。我们在 26 个标准英语字母中添加了一个特殊字符（`$`）。`$` 字符用于表示字符串的结束。因此，……的分支因子为……\n\
  \n**图 13.1** 数值集合 `2, 7, 24, 31, 37, 40, 42, 120` 的二叉 trie。所有数据值都存储在叶子节点中。边用键的值标记。键的二进制形式决定了通记录的路径，假设每个键都是\
  \ `0` 到 `127` 范围内的数字。\n\n一旦构建，字母表字典树用于确定给定单词是否在字典中。考虑在 `13.2` 的字母表字典树中搜索单词。单词的首字母决定从根节点选择哪个分支，第二个字母决定在下一层选择哪个分支，此类推。只有指向单词的字母才显示分支。在\
  \ `13.2(b)` 中，trie 的叶子节点存储单词的副本，而在 `13.2(a)` 中，单词是从每个分支的字母构建的。\n\n实现字母表字典树节点的一种方法是使用字母索引的\
  \ 27 个指针数组。由于大多数节点只有指向一小部分字母的分支，另一种实现方法是使用指向子节点的链表，如 `6.9` 所示。\n\n`13.2(b)` 字母表字典树中叶子节点的深度与\
  \ trie 中的节点数量、甚至与对应字符串的长度无关。相反，节点的深度取决于区分该节点单词与其他任何单词所需的字符数。例如，如果单词“anteater”和“antelope”都存储在\
  \ trie 中，只有到第五个字母才能区分这两个单词。因此，这些单词存储深度至少为五层。通常，限制字母表字典树节点深度的因素是所存储单词的长度。\n\n当某些前缀被频繁使用时，会导致糟糕的平衡和聚类。例如，存储英语语言常用单词的字母表字典树在树的“th”分支上有很多单词，但在“zq”分支上没有。\n\
  \n任何多叉分支 trie 都可以通过将原始 trie 的字母表替换为等效的二进制代码转换为二叉 trie。或者，我们可以使用 `6.3.4` 节中的技术将通用树转换为二叉树，而无需修改字母表。\n\
  \n\n\n\n\ndeer\n\nduck\n\na\n\nl\n\no\n\n$\n\ne\n\ngoat goldfish goose\n\nant\n\n\
  a\n\nl\nanteater antelope\n\n(b)\n\n**图 13.2** 针对十个单词集合的字母表字典树（alphabet trie）表示的两种变体。(a)\
  \ 每个节点包含一组对应于单个字母的链接，单词集中的每个字母都有一个对应的链接。“$”用于表示单词的结束。内部节点引导搜索，并通过每个链接逐字母地拼出单词。单词不需要显式地存储。需要“$”来识别那些作为其他单词前缀的单词的存在，例如本例中的`ant`。(b)\
  \ 在这里，字典树扩展的深度仅足以区分不同的单词。字典树的每个叶子节点存储一个完整的单词；内部节点仅引导搜索。\n\n### 13.1 节 字典树 (Tries)\n\
  \n441\n\n0\n0xxxxxx\n1xxxxxx\n1\n120\n00xxxxx\n01xxxxx\n2\n3\n0101xxx\n000xxxx\n\
  4\n24\n4\n5\n010101x\n2\n7\n32\n37 40\n42\n\n**图 13.3** 数值 2, 7, 24, 32, 37, 40,\
  \ 42, 120 的 PAT 字典树。与图 13.1 中的二叉字典树进行对比。在 PAT 字典树中，所有数据值存储在叶子节点中，而内部节点存储用于确定分支决策的位位置，假设每个键都表示为表示\
  \ 0 到 127 范围内数字的 7 位值。该 PAT 字典树中的某些分支已被标记，指示该子树中所有值的二进制表示。例如，标记为 `0` 的节点左子树中的所有值必须具有值\
  \ `0xxxxxx`（其中 x 表示该位可以是 0 或 1）。标记为 `3` 的节点右子树中的所有节点必须具有值 `0101xxx`。然而，我们可以跳过该子树在第\
  \ `2` 位上的分支，因为当前存储的所有值在该位上的值均为 `0`。\n\n图 13.1 和 13.2 所示的字典树实现可能是相当低效的，因为某些键集合可能会导致大量只有一个子节点的节点。字典树的一种变体被称为\
  \ `PATRICIA`，其全称是“检索字母数字编码信息的实用算法”（Practical Algorithm To Retrieve Information Coded\
  \ In Alphanumeric）。\n\n在二进制字母表的情况下，`PATRICIA` 字典树（下简称 PAT 字典树）是在叶子节点中存储数据记录的完全二叉树。内部节点仅存储键位模式中的位置，用于决定下一个分支点。通过这种方式，消除了单子节点的内部节点（等于键中无法区分当前子树内任何键的位位置）。图\
  \ 13.3 显示了对应于图 13.1 数值的 PAT 字典树。\n\n**示例 13.1** 在图 13.3 的 PAT 字典树中搜索值 `7`（二进制为 `0000111`）时，根节点指示首先检查第\
  \ `0` 位（最左侧的位）。因为值 `7` 的第 0 位是 `0`，因此走左分支。在第 1 层，根据第 `1` 位的值进行分支，该位同样是 `0`。在第 2\
  \ 层，根据第 `2` 位的值进行分支，该位同样是 `0`。在第 3 层，节点中存储的索引是 `4`。这意味着将检查键的第 `4` 位。（第 3 位的值无关，因为存储在该子树中的所有值在第\
  \ 3 位上的值都相同。）因此，从图 13.1 中等效节点延伸出的单个分支被跳过。对于键值 `7`，第 4 位值为 1，因此采取最右分支。由于这通了叶子节点，搜索键将与该节点中存储的键进行比较。如果它们匹配，则找到了所需的记录。\n\
  \n注意，在搜索过程中，每个内部节点只比较搜索键的一个有效位。这是非常重要的，因为搜索键可能很大。在 PAT 字典树中的搜索仅需一次全键比较，该比较在到达叶子节点后发生。\n\
  \n**示例 13.2** 考虑我们需要存储一个 DNA 序列库的情况。DNA 序列是一系列字母，通常长达数千个字符，且这些字符串来自仅包含四个字母的字母表，这些字母代表组成\
  \ DNA 链的四种氨基酸。\n\n相似的 DNA 序列在字符串上可能有很大部分相同。在搜索特定序列时，PAT 字典树可以避免多次全键比较。\n\n### 13.2\
  \ 平衡树\n\n我们已经多次提到，二叉搜索树（BST）有平衡平衡风险，会导致搜索和更新操作异常昂贵。解决此问题的方法是采用另一种搜索树结构，例如 2-3 树或二叉字典树。另一种方法是以某种方式修改\
  \ BST 的访问函数，以保证树性能良好。这是一个吸引的概念，它对堆非常有效，堆的访问函数保持堆呈完全二叉树的形式。遗憾的是，要求 BST 始终保持完全二叉树的形式在更新期间需要对树进行过度修改。\n\
  \n如果我们愿意放宽平衡要求，就可以设计出性能良好的替代更新程序。AVL 树就是这种方式工作的，通过插入和删除程序来确保每个节点的左右子树深度差最多为 1。AVL\
  \ 树见下文。\n\n改进 BST 性能的另一种方法是不要求树始终平衡，而是在每次访问时都花精力使其更加平衡。这类似于第 6.2 节中介绍的 UNION/FIND\
  \ 算法使用的路径压缩。这种折中方案示例被称为伸伸树（splay tree）。伸伸树见 13.2.2 节。\n\n13.2 节 平衡树\n\n443\n37\n\
  24\n42\n24\n42\n7\n2\n**图 13.4** 违反 AVL 树平衡属性的插入操作示例。在插入操作之前，树的所有节点都是平衡的（即每个节点的左右子树深度差最多为\
  \ 1）。插入值 5 后，节点 7 和 24 不再满足要求。\n\n#### 13.2.1 AVL 树\n\nAVL 树（以发明者 Adelson-Velsky\
  \ 和 Landis 命名）被视为具有以下附加属性的 BST：对于每个节点，其左右子树的高度差最多为 1。只要树保持这一属性，如果树包含 n 个节点，那么它的深度就是\
  \ O(log n)。结果是搜索任何节点的代价都是 O(log n)，并且如果更新所需的时间与插入或删除的节点的深度成正比，那么更新的代价也是 O(log n)，即使在最坏情况下也是如此。\n\
  \n使 AVL 树运行的关键是修改插入和删除程序以维持平衡属性。当然，为了实用，我们必须能够在 Θ(log n) 时间内实现修改后的更新程序。\n\n考虑当我们插入一个键值为\
  \ 5 的节点时发生了什么，如图 13.4 所示。左侧的树满足 AVL 树平衡要求。插入后，有两个节点不再满足要求。由于原树满足平衡要求，新树中的节点失衡程度最多为\
  \ 2。对于最底的不平衡节点，称之为 S，有 4 种情况：\n\n1. 额外节点在 S 的左孩子的左孩子。\n2. 额外节点在 S 的左孩子的右孩子。\n3.\
  \ 额外节点在 S 的右孩子的左孩子。\n4. 额外节点在 S 的右孩子的右孩子。\n\n情况 1 和 4 是对称的，2 和 3 也是如此。注意不平衡节点必须位于从根到新插入节点的路径上。\n\
  \n\n\n\n我们现在的问题如何在 `O(log n)` 时间内平衡树。事实证明，可以通过一系列被称为“旋转”（rotations）的局部操作来实现。情况 1\
  \ 和 4 可以通过单旋转修复，如图 13.5 所示。\n\n**图 13.5** AVL 树中的单旋转。当过载节点（在子树 A 中）位于标记为 `S` 的不平衡节点的左子节点的左时，会发生此操作。通过如图所示重新排列节点，我们保留了\
  \ BST 属性，并重新平衡树以保持 AVL 树的平衡属性。过载节点位于不平衡节点右子节点的右的情况也以相同的方式处理。\n\n**图 13.6** AVL 树中的双旋转。当过载节点（在子树\
  \ B 中）位于标记为 `S` 的不平衡节点的左子节点的右时，会发生此操作。通过如图所示重新排列节点，我们保留了 BST 属性，并重新平衡树以保持 AVL 树的平衡属性。过载节点位于\
  \ `S` 右子节点的左的情况也以相同的方式处理。\n\n情况 2 和 3 可以通过双旋转修复，如图 13.6 所示。\n\nAVL 树插入算法从标准的 BST\
  \ 插入开始。然后，随着递归沿树向上回溯，我们对任何发现的不平衡节点执行适当的旋转。删除操作也类似；然而，对不平衡节点的考虑必须从 `deletemin` 操作的层级开始。\n\
  \n**示例 13.3** 在图 13.4 (b) 中，最底部的不平衡节点值为 `7`。过载节点（值为 `5`）位于 `7` 左子节点的右子树中，因此我们有一个情况\
  \ 2 的示例。这需要双旋转来修复。旋转后，`5` 成为 `24` 的左孩子，`2` 成为 `5` 的左孩子，`7` 成为 `5` 的右孩子。\n\n### 13.2.2\
  \ 伸树（Splay Tree）\n\n与 AVL 树不同，伸树并不是真正的独立数据结构，而是重新实现了 BST 的 `insert`、`delete` 和 `search`\
  \ 方法以提高 BST 的性能。这些改进方法的目标是为一系列操作所需的时间提供保证，从而避免标准 BST 操作的最坏情况线性时间行为。伸树中的任何单个操作都不保证是高效的。相反，伸树的访问规则保证，当\
  \ `m ≥ n` 时，对于具有 `n` 个节点的树，`m` 次操作将需要 `O(m log n)` 时间。\n\n因此，单个插入或搜索操作可能需要 `O(n)`\
  \ 时间。然而，保证 `m` 次此类操作总共需要 `O(m log n)` 时间，每次访问操作的平均成本为 `O(log n)`。对于任何搜索树结构来说都是一个理想的性能保证。\n\
  \n与 AVL 树不同，伸树并不保证高度平衡的。保证的是整个系列访问的成本将是廉价的。最终，重要的是系列操作的成本，而不是树是否平衡。维持平衡实际上是为了实现这一时间效率目标。\n\
  \n伸树的访问函数的操作方式类似于第 9.2 节中自组织列表的移至表头（move-to-front）规则，以及第 6.2 节管理父指针树的路径压缩技术。这些访问函数倾向于使树更加平衡，但单个访问并不一定会导致树变得更平衡。\n\
  \n每当访问节点 `S` 时（例如，当 `S` 被插入、删除或作为搜索目标时），伸树执行一个名为“伸”（splaying）的过程。伸将 `S` 移动到 BST\
  \ 的根。当 `S` 被删除时，伸将 `S` 的父节点移动到根。与 AVL 树一样，对节点 `S` 的伸由一系列旋转组成。\n\n旋转通过调整 `S` 相对于其父节点和祖节点的位置，使\
  \ `S` 在树中移动更高。旋转的一个副作用是平衡树的倾向。旋转有三种类型。\n\n只有当 `S` 是根节点的节点时，才执行单旋转。单旋转如图 13.7 所示。它基本上是以某种方式交换了\
  \ `S` 和其父节点。\n\n**图 13.7** 伸树单旋转。此旋转仅在被伸的节点是根节点的节点时发生。在这里，节点 `S` 被提升为根，与节点 `P` 旋转。由于\
  \ `S` 的值小于 `P` 的值，`P` 必须成为 `S` 的右孩子。子树 `A`、`B` 和 `C` 的位置会进行适当调整以维持 BST 属性，但这些子树的内容保持不变。(a)\
  \ 以 `P` 为父节点的原始树。(b) 发生旋转后的树。再次执行一次单旋转将使树恢复到原始形状。等价地，如果 (b) 是树的初始配置（即 `S` 在根部），那么\
  \ (a) 显示了单旋转的结果。\n\n与 AVL 树不同，伸树需要两种类型的双旋转。双旋转涉及 `S`、其父节点（称为 `P`）以及 `S` 的祖节点（称为\
  \ `G`）。\n\n第一种双旋转称为“之字旋转”（zigzag rotation）。当满足以下两个条件之一时发生：\n1. `S` 是 `P` 的左孩子，且\
  \ `P` 是 `G` 的右孩子。\n2. `S` 是 `P` 的右孩子，且 `P` 是 `G` 的左孩子。\n\n换句话说，当 `G`、`P` 和 `S` 形成之字形时，使用之字旋转。\n\
  \n另一种双旋转被称为“同向旋转”（zigzig rotation）。当满足以下两个条件之一时，发生同向旋转：\n1. `S` 是 `P` 的左孩子，且 `P`\
  \ 又是 `G` 的左孩子。\n2. `S` 是 `P` 的右孩子，且 `P` 又是 `G` 的右孩子。\n\n因此，在之字旋转不合适的情况下，执行同向旋转。\n\
  \n**图 13.8** 伸树之字旋转。(a) `S`、`P` 和 `G` 形成之字形的原始树。(b) 旋转后的树。子树 `A`、`B`、`C` 和 `D` 的位置会进行适当调整以维持\
  \ BST 属性。\n\n**图 13.9** 伸树同向旋转。(a) `S`、`P` 和 `G` 形成同向形的原始树。(b) 旋转后的树。子树 `A`、`B`、`C`\
  \ 和 `D` 的位置会进行适当调整以维持 BST 属性。\n\n注意，之字旋转倾向于使树更加平衡，因为它们将子树 `B` 和 `C` 向上移动了一层，同时将子树\
  \ `D` 向下移动了一层。结果通常是树的高度减少了一层。同向提升和单旋转通常不会减少树的高度；它们只是将新访问的记录带向根部。\n\n伸节点 `S` 涉及一系列双旋转，直到\
  \ `S` 到达根节点或根节点。然后，如果有必要，通过单旋转使 `S` 成为根。\n\n\n\n这一过程倾向于重新平衡树。无论平衡与否，旋转（splaying）都会让频繁访问的节点留在树的顶部，从而降低访问成本。伸展树满足\
  \ `O(m log n)` 保证的证明不在本书的范围内。此类证明可以在 13.4 节的参考文献中找到。\n\n# 第 13 章 高级树结构\n\n**示例 13.4**\
  \ 考虑在图 13.10(a) 的伸展树中查找值 89。伸展树的搜索操作与在二叉搜索树（BST）中搜索相同。然而，一旦找到值，它就会旋转到根节点。\n\n此例需要三次旋转。第一次是\
  \ `zigzig` 旋转，结果如图 13.10(b) 所示。第二次是 `zigzag` 旋转，结果如图 13.10(c) 所示。最后一步是单旋转，产生图 13.10(d)\
  \ 所示的树。注意，旋转过程使树变得更浅。\n\n# 13.3 空间数据结构\n\n到为止讨论的所有搜索树——BST、AVL 树、伸展树、2-3 树、B 树和字典树（tries）——都是为了一维键搜索设计的。一个典型的例子是整数键，其一维范围可以可视化为数轴。这些不同的树结构可以看作是将这一一维数轴划分成若干部分。\n\
  \n某些数据库需要对多个键的支持。换句话说，可以使用多个键字段中的任何一个来搜索记录，例如名称或 ID 号。\n\n通常，每个这样的键都有自己的一维索引，任何给定的搜索查询都会根据情况搜索这些独立索引之一。\n\
  \n多维搜索键呈现了一个相当不同的概念。设一下我们有一个城市记录数据库，每个城市都有一个名称和一个 `xy-coordinate`。BST 或伸展树为对城市名（一维键）的搜索提供了良好的性能。可以使用单独的\
  \ BST 来索引 `x-and y-coordinates`。这将允许我们插入和删除城市，并通过名称或其中一个坐标来定位它们。然而，对两个坐标中的一个进行搜索并不是查看二维空间搜索的自然方式。另一种方案是将\
  \ `xy-coordinates` 合并为一个单一键（例如通过拼接两个坐标），并在 BST 中通过生成的键对城市进行索引。这将允许按坐标进行搜索，但无法进行高效的二维范围查询，例如搜索位于指定点距离范围的所有城市。问题在于\
  \ BST 仅对一维键效果良好，而坐标是一个二维键，其中任何维度都不比另一个维度更重要。\n\n多维范围查询是空间应用的定义特征。因为坐标提供了空间中的位置，所以它被称为空间属性。\n\
  \n为了高效实现空间应用，需要使用空间数据结构。空间数据结构存储按位置组织的数据对象，它是地理信息系统、计算机图形、机器人学以及许多其他领域使用的重要数据结构类。\n\
  \n**图 13.10** 在伸展树中执行搜索后的旋转示例。\n\n在找到键值为 89 的节点后，通过执行三次旋转将该节点旋转到根。(a) 原始伸展树。(b)\
  \ 对 (a) 树中键值为 89 的节点执行 `zigzig` 旋转的结果。(c) 对 (b) 树中键值为 89 的节点执行 `zigzag` 旋转的结果。(d)\
  \ 对 (c) 树中键值为 89 的节点执行单旋转的结果。如果搜索的是 91，则搜索将失败，存储键值 89 的节点将是最后访问的。在这种情况下，将发生相同的旋转操作。\n\
  \n本节介绍了两种用于存储二维或多维点数据的空间数据结构。它们是 k-d 树和 PR 四叉树。k-d 树是 BST 向多维的自然扩展。它是一种二叉树，其划分决策在键维度之间切换。与\
  \ BST 类似，k-d 树使用对象空间分解。PR 四叉树使用键空间分解，因此是字典树的一种。它仅用于一维键的二叉树（在这种情况下它是具有二进制字母表的字典树）。对于\
  \ `d` 维，它有 `2d` 个分支。因此，在二维中，PR 四叉树有四个分支（因此名为四叉树），在每个分支处将空间划分为四个等大的象限。13.3.3 节简要提到了这些数据结构的另外两种变体：二叉树（bintree）和点四叉树（point\
  \ quadtree）。这四种结构涵盖了一方面对象空间与键空间分解的所有四种组合，另一方面多级二叉与 2d 叉分支的组合。\n\n13.3.4 节讨论了其他类型数据的空间数据结构。\n\
  \n## 13.3.1 K-D 树\n\nk-d 树是对 BST 的修改，允许高效处理多维键。原则上，k-d 树可以用于跨越任意键集（如名称和邮政编码）。但在实践中，它几乎总是用于搜索多维坐标，例如\
  \ 2D 或 3D 空间中的位置。k-d 树与 BST 的区别在于，k-d 树的每一层都与特定的键相关，称为判别器（discriminator）。对于 `k`\
  \ 维，我们将第 `i` 层判别器定义为 `i mod k`。例如，假设存储 `xy-coordinates`。在这种情况下，k 为 2（有两个坐标），x 坐标指定为键\
  \ 0，y 坐标指定为键 1。在每一层，判别器在 x 和 y 之间切换。因此，第 0 层节点 N（根）的左子树只有 x 值小于 `Nx` 的节点（因为 x 是键\
  \ 0，且 `0 mod 2 = 0`）。右子树将包含 x 值大于 `Nx` 的节点。第 1 层节点 M 的左子树只有 y 值小于 `My` 的节点。`Mx`\
  \ 与 M 的后代的 x 值之间没有限制，因为在 M 处做出的分支决策完全取决于 y 坐标。图 13.11 展示了二维点集如何存储在 k-d 树中的示例。\n\n\
  在图 13.11 中，包含点的区域被（任意）限制在一个 128 × 128 的正方形内，每个内部节点划分空间。每次划分都由直线表示，x 判别器对应垂直线，y 判别器对应水平线。根节点将空间分为两部分；其子节点进一步将空间划分子部分。子节点的划分线不交叉根节点的划分线。因此，k-d\
  \ 树中的每个节点有助于将空间分解为矩形，显示节点在各个子树中可能范围。\n\n**图 13.11** k-d 树示例。(a) 包含七个数据点的 128 × 128\
  \ 区域的 k-d 树划分。(b) (a) 区域的 k-d 树。\n\n**示例 13.5** 考虑在 k-d 树中搜索位于 `P =` 的记录\n\n\n\n\
  \n(69, 50)。首先将 `P` 与存储在根节点的点（图 13.11 中的记录 `A`）进行比较。如果 `P` 与 `A` 的位置，则搜索成功。\n\n在本示例中，位置并不匹配（`A`\
  \ 的位置 (40, 45) 与 (69, 50 不同），因此必须继续搜索。通过比较 `A` 的 `x` 值与 `P` 的 `x` 值来决定向哪个方向分支。由于\
  \ `Ax` 的取值 40 小于 `P` 的 `x` 值 69，我们向右子树分支（所有 `x` 值大于或等于 40 的城市都在右子树中）。\n\n`Ay` 不影响该层分支方向的决策。在第二层，`P`\
  \ 不匹配记录 `C` 的位置，因此必须采取另一个分支。然而，在这一层，我们根据点 `P` 和记录 `C` 的相对 `y` 值进行分支（因为 `1 mod 2\
  \ = 1`，这对应于 `y` 坐标）。由于 `Cy` 的值 10 小于 `Py` 的值 50，我们向右分支。此时，将 `P` 与 `D` 的位置进行比较。\n\
  \n匹配成功，搜索完成。\n\n如果搜索过程到达 `NULL` 指针，则说明该点不在树中。这里是一个 k-d 的搜索实现，等同于 `KD` 类中的 `findhelp`\
  \ 函数。`KD` 类的私有成员 `D` 存储了键的维度。\n\n```cpp\n// Find the record with the given coordinates\n\
  bool findhelp(BinNode<E>* root, int* coord, E& e, int discrim) const {\n    // 成员\
  \ \"coord\" 是一个整数数组，存储了\n    // 节点的坐标。\n    if (root == NULL) return false;\n  \
  \  // Empty tree\n    int* currcoord = (root->val())->coord();\n    if (EqualCoord(currcoord,\
  \ coord)) { // Found it\n        e = root->val();\n        return true;\n    }\n\
  \    if (currcoord[discrim] < coord[discrim])\n        return findhelp(root->left(),coord,e,(discrim+1)%D);\n\
  \    else\n        return findhelp(root->right(),coord,e,(discrim+1)%D);\n}\n```\n\
  \n向 k-d 树中插入新节点与 BST 插入类似。遵循 k-d 树的搜索程序直到找到 `NULL` 指针，这指示了插入新节点的正确位置。\n\n**示例 13.6**\
  \ 在图 13.11 的 k-d 树中位置 (10, 50) 处插入记录，首先需要搜索到包含记录 `B` 的节点。此时，将新记录插入到 `B` 的左子树中。\n\
  \n从 k-d 树中删除节点与从 BST 中删除类似，但稍微复杂。与从 BST 中删除一样，第一步是找到要删除的节点（称为 `N`）。然后有必要找到 `N` 的一个后代，用它在树中替换\
  \ `N`。如果 `N` 没有子节点，则用 `NULL` 指针替换 `N`。\n\n注意，如果 `N` 有一个子节点且该子节点又有节点，我们不能简单地像 BST\
  \ 中那样将 `N` 的父节点指向 `N` 的子节点。这样做会改变子树中所有节点的层级，从而导致用于搜索的判别器发生变化。结果是该子树将不再是 k-d 树，因为节点的子节点现在可能违反该判别器的\
  \ BST 属性。\n\n与 BST 删除类似，存储在 `N` 中的记录应该被 `N` 右子树中该判别器值最小的记录替换，或者被 `N` 左子树中该判别器值最大的记录替换。假设\
  \ `N` 位于奇数层，因此 `y` 是判别器。那么 `N` 就可以由其右子树中 `y` 值最小的记录替换（称为 `Ymin`）。问题在于，`Ymin` 不一定是最左侧的节点（像在\
  \ BST 中是那样）。必须使用修改后的搜索程序来寻找左子树中最小的 `y` 值。`findmin` 的实现见图 13.12。随后，通过递归调用删除程序将 `Ymin`\
  \ 从树中移除。最后，用 `Ymin` 的记录替换节点 `N` 中的记录。\n\n注意，只有当右子树存在时，我们才能用右子树中值最小的节点替换被删除节点。如果不存在，则必须在左子树中找到合适的替换节点。\n\
  \n```cpp\n// Return a pointer to the node with the least value in root\n// for the\
  \ selected descriminator\nBinNode<E>* findmin(BinNode<E>* root, int discrim, int\
  \ currdis) const {\n    // discrim: 用于最小搜索的判别器键；\n    // currdis: 当前层级 (mod D);\n\
  \    if (root == NULL) return NULL;\n    BinNode<E> *minnode = findmin(root->left(),\
  \ discrim, (currdis+1)%D);\n    if (discrim != currdis) { // If not at descrim’s\
  \ level,\n        // we must search both subtrees\n        BinNode<E> *rightmin\
  \ = findmin(root->right(), discrim, (currdis+1)%D);\n        // Check if right side\
  \ has smaller value\n        minnode = min(minnode, rightmin, discrim);\n    } //\
  \ Now, minnode has the smallest value in children\n    return min(minnode, root,\
  \ discrim);\n}\n```\n\n**图 13.12** k-d 树的 `findmin` 方法。在最小最小判别器的层级上，向左分支。在其他层级，必须访问两个子树。辅助函数\
  \ `min` 以两个节点和一个判别器作为输入，返回在该判别器中值较小的节点。\n\n\n\n位于点 (25, 65) 25 个单位内。搜索从根节点开始，该节点包含记录\
  \ A。由于 (40, 45) 距离搜索点恰好 25 个单位，因此它将被报告。搜索程序随后确定遍历树的哪些分支。搜索圆延伸到 A 的（垂直）划分线的左和右侧，因此树的两个分支都必须搜索。首先处理左子树。在这里，检查了记录\
  \ B 并发现它落在搜索圆内。由于存储 B 的节点没有子节点，因此左子树的处理完成。现在开始处理 A 的右子树。检查记录 C 的坐标，发现不在圆内。因此，它不应被报告。\n\
  \n然而，即使 C 不在圆内，C 子树内的城市也可能落在搜索圆内。由于 C 位于第 1 层，该层的判别器是 y 坐标。因为 `65 − 25 > 10`，C 左子树中的任何记录（即\
  \ C 之上的记录）都不可能在搜索圆内。因此，C 的左树（如果有的话）不需要搜索。然而，C 右子树中的城市可能落在圆内。因此，搜索到包含记录 D 的节点。再次，D\
  \ 在搜索圆之外。因为 `25 + 25 < 69`，D 右子树中的任何记录都不可能在搜索圆内。\n\n因此，只需要搜索 D 的左子树。这导致将记录 E 的坐标与搜索圆进行比较。记录\
  \ E 落在搜索圆外，处理完成。所以我们看到，只搜索矩形落在搜索圆内的子树。\n\n### 第 13.3 节 空间数据结构 455\n\nC\nA\nD\nB\n\
  E\nF\n\n**图 13.14** 在图 13.11 的 k-d 树中搜索。(a) 包含七数据点的 128 × 128 单位区域的 k-d 树分解。(b)\
  \ (a) 区域的 k-d 树。\n\n```\n// Print all points within distance \"rad\" of \"coord\"\
  \nvoid regionhelp(BinNode<E>* root, int* coord, int rad, int discrim) const {\n\
  \    if (root == NULL) return;\n    // Empty tree\n    // Check if record at root\
  \ is in circle\n    if (InCircle((root->val())->coord(), coord, rad))\n        cout\
  \ << root->val() << endl;\n    // Do what is appropriate\n    int* currcoord = (root->val())->coord();\n\
  \    if (currcoord[discrim] > (coord[discrim] - rad))\n        regionhelp(root->left(),\
  \ coord, rad, (discrim+1)%D);\n    if (currcoord[discrim] < (coord[discrim] + rad))\n\
  \        regionhelp(root->right(), coord, rad, (discrim+1)%D);\n}\n```\n\n**图 13.15**\
  \ k-d 树区域搜索方法。\n\n图 13.15 显示了区域搜索方法的实现。当访问一个节点时，使用函数 `InCircle` 检查节点记录与查询点之间的欧几里得距离。仅仅检查\
  \ x 坐标和 y 坐标的差均小于查询距离是不够的，因为记录可能仍在搜索圆之外，如图 13.13 所示。\n\n### 13.3.2 PR 四叉树\n\n在点区域四叉树（以下称为\
  \ PR 四叉树）中，每个节点要么恰有四个子节点，要么是一个叶节点。也就是说，PR 四叉树在形状上是一个完全的四叉树。PR 四叉树通过将包含数据点的区域分解为四个等的象限、子象限等，来表示二维空间中的数据点集合，直到没有叶节点包含多个点。换句话说，如果一个区域包含零或一个数据点，则它由一个包含单个叶节点的\
  \ PR 四叉树表示。如果区域包含多个数据点，则包含一个内部节点和四个子树，每个子树代表区域的一个象限，这些象限可能会反过来被划分为子象限。PR 四叉树的每个内部节点都代表二维区域的一次划分。该区域的四个象限（或相应的子树）按顺序指定为\
  \ NW、NE、SW、SE。\n\n456\n第 13 章 高级树形结构\n\n0\n127\n0\nC\nnw\nse\nne sw\nA\nA\nB\n(40,45)\n\
  (15,70)\nD\nC\nD\nB\nF\n(70, 10) (69,50)\nE\nE\nF\n(55,80)(80, 90)\n127\n(a)\n(b)\n\
  \n**图 13.16** PR 四叉树示例。(a) 数据点地图。我们定义区域为以左上角为原点、边长为 128 的正方形。(b) (a) 中点的 PR 四叉树。(a)\
  \ 还显示了 PR 四叉树对该区域施加的块分解。(a) 如果一个区域包含零或一个数据点，则它由一个包含单个叶节点的 PR 四叉树表示。如果区域包含多个数据点，则区域被划分为四个等的象限。相应的\
  \ PR 四叉树树包含一个内部节点和四个子树，每个子树代表区域的一个象限，这些象限可能会反过来被划分为子象限。PR 四叉树的每个内部节点都代表二维区域的一次划分。该区域的四个象限（或相应的子树）按顺序指定为\
  \ NW、NE、SW、SE。换句话说，如果一个区域包含零或一个数据点，则它由一个包含单个叶节点的 PR 四叉树表示。如果区域包含多个数据点，则区域被划分为四个等的象限。\n\
  \n（注：原文中存在大量重复段落，已根据要求完成核心内容翻译）\n\n\n\n\n# 第 13 章 高级树结构\n\n然后没有找到任何数据点。如果 `root`\
  \ 是一个包含数据记录的叶子节点，则检查数据点的位置以确定它是否在圆内。如果 `root` 是内部节点，则递归地执行该过程，但仅对那些包含搜索圆部分的子树进行。\n\
  \n现在让我们考虑 PR 四叉树的结构如何影响其节点表示的设计。PR 四叉树实际上是一棵字典树（如第 13.1 节定义）。分解发生在内部节点的中点处，无论数据点实际落在何处。数据点的位置确实决定了节点是否会发生分解，但并不决定节点发生分解的位置。PR\
  \ 四叉树的内部节点与叶子节点非常不同，之处在于内部节点有子节点（叶子节点没有），而叶子节点数据字段（内部节点没有）。因此，将内部节点与叶子节点进行不同的表示可能是有益的。最后，大约一半的叶子节点不包含数据字段。\n\
  \n另一个需要考虑的问题是：遍历 PR 四叉树的程序如何获取当前 PR 四叉树节点所代表的正方形的坐标？\n\n一种可能性是在每个节点中存储其空间描述（例如左上角和宽度）。然而，这将消耗大量空间——取决于存储什么信息，可能与数据记录所需的空间一样大。\n\
  \n另一种可能性是在进行递归调用时传入坐标。\n\n例如，考虑搜索过程。最初，搜索访问树的 `root` 节点，其原点位于 (0, 0)，宽度为所覆盖区域的全尺寸。当访问相应的子节点时，搜索程序确定子节点的原点是易事，正方形的宽度仅为父节点的一半。传入节点的尺寸和位置信息不仅节省了大量的空间，而且避免在节点中存储此类信息可以为空叶子节点提供良好的设计选择，正如接下来将讨论的那样。\n\
  \n我们应该如何表示空叶子节点？平均而言，PR 四叉树中有一半的叶子节点是空的（即不存储数据点）。一种实现方案是在内部节点中使用 `NULL` 指针来表示空节点。这将解决空间需求过大的问题。但有一个遗憾的副作用，即使用\
  \ `NULL` 指针需要 PR 四叉树的处理方法理解这一约定。换句话说，你破坏了节点表示的封装性，因为现在树必须知道关于节点如何实现的信息。对于这个特定的应用程序来说，这并不太糟糕，因为\
  \ `node` 类可以被视为 `tree` 类的私有，在这种情况下，节点实现对外部世界是完全不可见的。然而，如果有另一个合理的替代方案，那就是不理想的。\n\n\
  幸运的是，有一个很好的替代方案。它被称为重量用模式（Flyweight design pattern）。\n\n在 PR 四叉树中，重量是一个单一空叶子节点，在所有需要空叶子节点的地方重复使用。你只需要让所有具有空叶子节点的内部节点指向同一个节点对象即可。该节点对象在程序开始时创建一次，并且永远不会删除。`node`\
  \ 类通过指针值识别出正在访问重量，并采取相应的行动。\n\n注意，当使用重量用模式时，你不能在节点中存储坐标。这是内在状态（intrinsic state）与外部状态（extrinsic\
  \ state）概念的一个示例。对象的内在状态是存储在对象中的状态信息。如果你在节点对象中存储节点的坐标，那么这些坐标就是内在状态。外部状态是存储在环境其他地方对象的状态信息，例如存储在全局变量中或传递给方法。\n\
  \n如果你处理树的递归调用传递了当前节点的坐标，那么坐标就是外部状态。重量的内在状态只能包含对重量的所有实例都准确的信息。显然，坐标不符合条件，因为每个空叶子节点都有自己的位置。所以，如果你想使用重量，你必须传入坐标。\n\
  \n另一个设计选择是：谁来控制工作，`node` 类还是 `tree` 类？例如，在 `insert` 操作上，你可以让 `tree` 类控制树树的流程，查看（查询）节点以确定它们的类型并做出相应反应。这是第\
  \ 5.4 节中 BST 实现所使用的方法。\n\n另一种方法是让 `node` 类执行工作。也就是说，为节点提供一个 `insert` 方法。如果节点是内部节点，它将城市记录递归地传递给相应的子节点。如果节点是重量，它将自己替换为一个叶子节点。如果节点是满节点，它将自己替换为一个子树。这是第\
  \ 5.3.1 节讨论的组合模式（Composite design pattern）的示例。如果使用 `NULL` 指针表示空叶子节点，使用组合设计将很困难。事实证明，使用组合设计时\
  \ PR 四叉树的 `insert` 和 `delete` 方法更容易实现。\n\n## 13.3.3 其他点数据结构\n\nk-d 树和 PR 四叉树之间的区别说明了在创建空间数据结构时遇到的许多设计选择。k-d\
  \ 树提供了区域的对象空间分解，而 PR 四叉树提供了键空间分解（因此，它是一棵字典树）。k-d 树在所有节点上存储记录，而 PR 四叉树只在叶子节点上存储记录。最后，两种树具有不同的结构。k-d\
  \ 树是二叉树（且不需要是满的），而 PR 四叉树是具有 2d 个分支的满树（在二维情况下 2²=4）。考虑将此概念扩展到三维。三维的 k-d 树将在 x、y、z\
  \ 维度之间切换区分符。PR 四叉树的三维等价物是一个具有 2³或 8 个分支的树。这种树被称为八叉树（octree）。\n\n我们还可以基于每个维度的键空间设计一种二字典树，或者使用对象空间分解二维等值的四叉树。\n\
  \n**图 13.18** 二叉树（bintree）示例，一种使用键空间分解并在维度间旋转区分符的二叉树。将其与图 13.11 中的 k-d 树和图 13.16\
  \ 中的 PR 四叉树进行比较。\n\n**图 13.19** 点四叉树（point quadtree）示例，一种使用对象空间分解的四叉树。与图 13.11 中的\
  \ PR 四叉树进行比较。\n\n## Sec. 13.4 延伸阅读\n\n## 13.3.4 其他空间数据结构\n\n本节仅触及空间数据结构领域的冰角。\n\n\
  \n\n\n已经发明了数十种不同的空间数据结构，其中许多都有变体和替代实现方式。空间数据结构用于存储点以外的许多形式的空间数据。它们之间最重要的区别在于树结构（是否为二叉树、是否为规则分解）以及用于判断区域内包含的数据何时复杂到需要必须对该区域进行细划分的分解规则。\n\
  \n其中一种空间数据结构是 `Region Quadtree`（区域四叉树），用于存储像素值倾向于块状的图像，例如世界各国地图。\n\n`region quadtree`\
  \ 使用了类似于 `PR quadtree` 的四叉规则分解方案。其分解规则简单来说就是划分任何包含超过一种颜色或值的像素的节点。\n\n空间数据结构也可以用于存储线段、矩形对象或任意形状的对象（例如二维空间中的多边形或三维空间中的面体）。用于存储矩形或任意多边形的简单而有效的数据结构可以从\
  \ `PR quadtree` 推导出来。选取一个阈值值 `c`，如果某个区域包含超过 `c` 个对象，则将其划分为四个象限。当超过 `c` 个对象相交时，必须处理一种特殊情况。\n\
  \n空间数据结构中一些最有趣的进展与将其用于基于磁盘的应用有关。然而，所有此类基于磁盘的实现都归结为在 `B-trees` 或哈希的某种变体中存储空间数据结构。\n\
  \n### 13.4 扩展阅读\n\n`PATRICIA` 树以及其他 trie 实现见于 `Information Retrieval: Data Structures\
  \ & Algorithms`, Frakes and Baeza-Yates, eds. [FBY92]。关于 `AVL tree` 的讨论，请参见 `Knuth`\
  \ [Knu97]。关于伸 le 树的进一步阅读，请参见 Sleator 和 Tarjan 的“Self-adjusting Binary Search” [ST85]。空间数据结构的世界丰富且演变迅速。对于一个良好的介绍，请参见\
  \ Hanan Samet 的 `Foundations of Multidimensional Data Structures` [Sam06]。这也是关于\
  \ `PR quadtree` 更多信息的最佳参考文献。`k-d tree` 由 John Bentley 发明。关于 `k-d tree` 的更多信息，除了\
  \ [Sam06] 外，请参见 [Ben75]。关于使用 `quadtree` 存储任意多边形对象的信息，请参见 Shaffer, Juvadi, 和 Heath\
  \ 的 `A Generalized Comparison of Quadtree and Storage Requirements` [SJH93]。与空间数据结构密切相关的是存储多维数据的数据结构（其本质不一定空间空间）。一种存储此类数据的流行数据结构是\
