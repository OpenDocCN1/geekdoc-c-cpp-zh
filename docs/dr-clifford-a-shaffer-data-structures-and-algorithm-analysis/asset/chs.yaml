  23\n23\n23\n42\n28\n15\n23\n23\n23\n23\n28\n28\n28\n42\n\n**图 7.2** 冒泡排序的插图。每一列显示了在在外部\
  \ `for` 循环具有指定值 `i` 迭代后的数组。每列中线以上的值已经排过序。箭头表示在给定迭代期间发生的交换。\n\n相邻，两个值就会交换。一旦遇到最小值，这个过程将导致它“泡”到数组的顶部。第二次遍历数组重复这个过程。然而，因为我们知道最小值在第一次遍历时已经到达顶部，所以第二次遍历不需要比较顶部两个元素。同样，随后的每次遍历都会比较相邻元素，比上一次遍历少一个值。图\
  \ 7.2 展示了冒泡排序。其 C++ 实现如下：\n\n```cpp\ntemplate <typename E, typename Comp>\nvoid\
  \ bubsort(E A[], int n) { // 冒泡排序\n  for (int i=0; i<n-1; i++) {\n    // 冒泡第 i 个记录\n\
  \    for (int j=n-1; j>i; j--) {\n      if (Comp::prior(A[j], A[j-1])) {\n     \
  \   swap(A, j, j-1);\n      }\n    }\n  }\n}\n```\n\n确定冒泡排序的比较次数很容易的。无论数组中的值如何排列，内部\
  \ `for` 循环执行的比较次数始终是 `i`，导致总代价为 `n X i ≈ n2/2`，即 `Θ(n2)`。\n\n冒泡排序的运行时间在最好、平均和最坏情况下都大致相同。\n\
  \n\n\n\n\n交换所需的次数取决于数组中某个值小于其紧前一个值的频率。在平均情况下，我们可以预计这种情况会发生在大约一半的比较中，导致期望交换次数为 $\\\
  Theta(n²)$。冒泡排序实际执行的交换次数将与插入排序执行的次数相同。\n\n## 第 7.2 节 三种 $\\Theta(n²)$ 排序算法\n\n`i=0`\n\
