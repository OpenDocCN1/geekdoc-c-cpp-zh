  \ = 5` 处就与之相交。如果我们将线性方程前的常数值翻倍会怎样？如图所示，一旦 `n = 10`，`2n2` 就会超过 `20n`。线性增长率中增加的二倍因子并没有太大影响，它只是让交点的\
  \ x 坐标增加了一倍。通常情况下，等方程中常数系数的变化只会改变两条曲线相交的位置，而不会改变它们是否相交。\n\n当你购买了更快的计算机或更快的编译器时，无论运行时间方程中的常数如何，在给定时间内、给定的增长率下可以运行的新问题规模会按相同的倍数增大。不同增长率的两个算法的时间曲线仍然会相交，无论它们的运行时间方程常数是多少。由于这些原因，当我们想要对算法的运行时间或其他资源需求的增长率进行估算时，通常会忽略常数。这简化了分析，并让我们关注最重要的方面：增长率。这被称为渐近算法分析。准确地说，渐近分析是指研究输入规模“变大”或达到极限（微积分意义上）时的算法行为。\n\
  \n然而，证明忽略所有常数因子的做法是非常用的，以至于渐近分析被用于大多数算法比较。\n\n忽略常数并不总是合理的。在比较适用于较小 `n` 值的算法时，常数可能会产生巨大影响。例如，如果问题是对恰好包含五个记录的集合进行排序，那么一个为排序数千条记录设计的算法可能并不合适，即使它的渐近分析显示性能良好。在极少数情况下，所比较的两个算法的常数差异可能达到\
  \ 1000 倍或更多，导致增长率较低的算法因其常数巨大而在大多数情况下都是不切实际的。渐近分析是算法资源消耗的一种“信封背后的”估算方法。它提供了一个算法运行时间或其他资源需求的简化模型。这种简化通常有助于你理解算法的行为。只要在常数重要的极少数情况下，注意渐近分析的局限性即可。\n\
  \n### 3.4.1 上界\n\n人们使用了多个术语来描述算法的运行时间方程。\n\n这些术语及其相关符号精确地描述了算法行为的某个方面。其中之一是算法运行时间增长的上界。它指了算法可能具有的上限或最高增长率。\n\
  \n由于“增长率有 `f (n)` 的上界”这一短语很长，且在讨论算法时经常使用，我们采用了一种特殊的表示法，称为大 O 表示法（big-Oh notation）。如果算法增长率的上界（例如最坏情况）是\
  \ `f (n)`，那么我们就写该算法在最坏情况下“属于集合 `O(f (n))`”（或直接写“在最坏情况下属于 `O(f (n))`）。例如，如果对于最坏输入，`n²`\
  \ 的增长与 `T(n)`（我们算法的运行时间）一样快，我们会说算法在最坏情况下“属于 `O(n2)`”。\n\n以下是上界的精确定义。`T(n)` 代表算法的真实运行时间。`f\
  \ (n)` 是上界的某个表达式。\n\n对于非负函数 `T(n)`，如果存在两个正常数 `c` 和 `n0`，使得对于所有 `n > n0` 都有 `T(n)\
  \ ≤ cf (n)`，则 `T(n)` 属于集合 `O(f (n))`。\n\n常数 `n0` 是使上界假设成立的最小 `n` 值。通常 `n0` 很小，例如\
  \ `1`，但并非如此。你还必须能够选取某个常数 `c`，但 `c` 的实际值无关。\n\n换句话说，该定义说明：对于所有特定类型的输入（例如所有规模为 `n`\
  \ 的输入的最坏情况），只要足够大（即 `n > n0`），对于某个常数 `c`，算法执行次数总是少于 `cf (n)` 步。\n\n**示例 3.4** 考虑在整数数组中查找指定值的顺序查找算法。如果访问和检查数组中的一个值需要\
  \ `cs` 步（其中 `cs` 是一个正数），且我们要查找的值在数组中任何位置出现的概率相等，那么在平均情况下，`T(n) = csn/2`。对于所有 `n\
  \ > 1` 的值，`csn/2 ≤ csn`。因此，根据定义，当 `n0 = 1` 且 `c = cs` 时，`T(n)` 属于 `O(n)`。\n\n**示例\
  \ 3.5** 对于某个特定算法，平均情况下 `T(n) = c1n2 + c2n`，其中 `c1` 和 `c2` 是正数。那么，对于所有 `n > 1`，`c1n2\
  \ + c2n ≤ c1n2 + c2n2 ≤ (c1 + c2)n2`。因此，当 `c = c1 + c2` 且 `n0 = 1` 时，`T(n) ≤ cn2`。因此，根据第二个定义，`T(n)`\
  \ 属于 `O(n2)`。\n\n**示例 3.6** 将数组第一个位置的值赋值给变量需要常数时间，无论数组规模如何（对于所有情况、最坏或平均情况）。`T(n)`\
  \ 属于 `O(c)`。\n\n### 3.4 渐近分析\n\n如果有人突然问“最好情况如何？”，你的自然反应应该是“什么情况下？平均情况？还是最坏情况？”同样，如果你被问到“这个增长率是多少？”，你需要回答“在什么情况下？”某些算法无论接收什么输入行为都是相同的。例子是寻找数组中的最大值。因此，任何关于上界的陈述必须处于某些规模为\
  \ n 的输入范围内。我们几乎总在最好情况、平均情况或最坏情况下来测量这种上界。因此，我们不能说“该算法增长率上限是 n2”。我们必须说“该算法在平均情况下增长率上限是\
  \ n2”。\n\n知道某物属于 `O(f (n))` 只能说明情况最坏时。也许情况并没有那么糟。因为顺序查找在最坏情况下属于 `O(n)`，所以说它属于 `O(n2)`\
  \ 也是正确的。但对于其他 `O(n2)` 的算法，这在 `n` 很大时是实用的。\n\n我们总是寻求用最紧（最低）的可能上界来定义算法的运行时间。因此，我们倾向于说顺序查找属于\
  \ `O(n)`。这也解释了为什么使用“属于 `O(f (n))`”或符号 `∈ O(f (n))`，而不是“是 `O(f (n))`”或 `= O(f (n))`”。大\
  \ O 表示法之间没有严格的等价。`O(n)` 属于 `O(n2)`，但 `O(n2)` 不属于 `O(n)`。\n\n### 3.4.2 下界\n\n大 O\
  \ 表示法描述的是上界。换句话说，大 O 表示法对算法对于规模为 n 的某类输入（通常是最坏的输入、所有可能输入的平均值或最好的输入）所需的某种资源（通常是时间）的最大量给出假设。\n\
  \n类似的符号用于描述算法对某类输入所需的最少资源。与大 O 表示法一样，这是对算法增长率的衡量。与大 O 表示法一样，适用于任何资源，但我们最经常测量最少的时间。再次，与大\
  \ O 表示法一样，我们衡量的是针对特定类别输入所需的资源：最坏、平均或最好情况的规模为 n 的输入。\n\n\n\n\n算法的下界（或问题的下界，后文解释）用符号\
  \ `Ω` 表示，读作“big-Omega”或直接称为“Omega”。以下对 `Ω` 的定义与大 O（big-Oh）的定义是对称的。\n\n对于非负值函数 `T(n)`，`T(n)`\
  \ 属于集合 `Ω(g(n))` 当当存在两个正常数 `c` 和 `n0`，使得对于所有 `n > n0`，都有 `T(n) ≥ cg(n)`。\n\n`Ω`\
  \ 的另一种（非等价）定义是：\n\n**示例 3.7** 假设 `T(n) = c1n2 + c2n`，其中 `c1` 和 `c2 > 0`。那么对于所有 `n\
  \ > 1`，`c1n2 + c2n ≥ c1n2`。因此，当 `c = c1` 且 `n0 = 1` 时，`T(n) ≥ cn2`。所以根据定义，`T(n)`\
  \ 属于 `Ω(n2)`。\n\n同样，示例 3.7 中的方程也属于 `Ω(n)`。然而，与大 O 符号一样，我们希望尽可能得到“最紧”（对于 `Ω` 符号而言是最大的）界。因此，我们更倾向于说该运行时间属于\
  \ `Ω(n2)`。\n\n回想在整数数组中查找值 `K` 的顺序查找算法。在平均和最坏情况下，该算法都属于 `Ω(n)`，因为在平均和最坏情况下，我们都必须检查至少\
  \ `cn` 个值（其中在平均情况下 `c` 为 `1/2`，最坏情况下为 `1`）。\n\n### 3.4.3 Θ 符号\n\n大 O 和 `Ω` 的定义为我们提供了描述算法上界的方法（如果我们能找到一个描述规模为\
  \ `n` 的特定输入类最大成本的方程）以及算法下界的方法（如果我们能找到一个描述规模为 `n` 的特定输入类最小成本的方程）。当上界和下界在常数因子内相同时，我们使用\
  \ `Θ`（big-Theta）符号来表示这种关系。如果一个算法属于 `O(h(n))`，且存在一个正常数 `c` 使得对于无限多个 `n` 值满足 `T(n)\
  \ ≥ cg(n)`，则称该算法为 `Θ(h(n))`。\n\n这个定义意味着，对于数量“有意义”的情况，算法至少消耗了 `cg(n)` 的时间。请注意，这个定义与大\
  \ O 的定义并不对称。为了使 `g(n)` 成为下界，该定义并不要求对于所有大于某个常数的 `n` 值都有 `T(n) ≥ cg(n)`。它只要求这种情况发生得足够频繁，特别是要发生在无限多个\
  \ `n` 值上。这种替代定义的动机可以在以下示例中找到。\n\n假设某个特定算法具有以下行为：\n对于所有奇数 `n ≥ 1`，`T(n) = n`\n对于所有偶数\
  \ `n ≥ 0`，`T(n) = n2/100`\n\n根据这个定义，对于所有偶数 `n ≥ 0`，`n2/100 ≥ 1n2`。因此，当 `c = 1/100`\
  \ 时，`T(n)` 对于无限多个 `n` 值（即对于所有偶数 `n`）满足 `T(n) ≥ cn2`。根据定义，`T(n)` 属于 `Ω(n2)`。\n\n\
  对于这个 `T(n)` 方程，所有规模为 `n` 的输入至少需要 `cn` 时间。但有无限多个规模为 `n` 的输入需要 `cn2` 时间，因此我们希望说该算法属于\
  \ `Ω(n2)`。\n\n遗憾的是，使用第一个定义将得到 `Ω(n)` 的下界，因为无法选择常数 `c` 和 `n0` 使得对于所有 `n > n0` 都有\
  \ `T(n) ≥ cn2`。替代定义确实为该算法得出了 `Ω(n2)`，这似乎更符合常识。幸运的是，很少有真实的算法或计算机程序表现出该示例中的病态行为。\n\
  \n我们 `Ω` 的第一个定义通常会产生预期结果。从这段讨论可以看出，渐近界符号并不是自然法则。它仅仅是一种用于描述算法行为的强大建模工具。\n\n请注意，在\
  \ `Θ` 符号中我们省略了“in”（属于）一词，因为两个具有相同 `Θ` 的方程之间存在严格等式。换句话说，如果 `f(n)` 是 `Θ(g(n))`，那么\
  \ `g(n)` 就是 `Θ(f(n))`。\n\n因为顺序查找算法在平均情况下既属于 `O(n)` 又属于 `Ω(n)`，我们说它在平均情况下是 `Θ(n)`。\n\
  \n给定一个描述算法时间要求的代数方程，上界和下界总是会汇合。这是因为在某种意义上，我们对算法有了完美的分析，并体现在运行时间方程中。对于许多算法（或作为程序的实例化），很容易得出定义其运行时间行为的方程。书中介绍的大多数算法都已被很好理解，我们几乎总是为它们给出\
  \ `Θ` 分析。\n\n然而，第 17 章讨论了一整类算法，我们对这些算法还没有 `Θ` 分析。\n\n\n\n\n给定函数 `f(n)` 和 `g(n)`，它们的增长率用代数方程表示，我们可能想确定其中一个比另一个增长更快。实现此点的最佳方法是取这两个函数当\
  \ `n` 趋无穷大时的极限：\n\n`lim_{n→∞} f(n)/g(n)`\n\n如果极限为 ∞，则 `f(n)` 属于 `Ω(g(n))`，因为 `f(n)`\
  \ 增长更快。如果极限为零，则 `f(n)` 属于 `O(g(n))`，因为 `g(n)` 增长更快。如果极限为除零的常数，则 `f(n) = Θ(g(n))`，因为两者的增长速率相同。\n\
  \n**示例 3.8** 如果 `f(n) = 2n log n` 且 `g(n) = n²`，那么 `f(n)` 属于 `O(g(n))`、`Ω(g(n))`\
  \ 还是 `Θ(g(n))`？因为\n\n`2n log n / n² = 2 log n / n`\n\n我们很容易看到 \n\n`lim_{n→∞} 2n\
  \ log n / n² = ∞`\n\n因为 `n` 的增长速度比 `2 log n` 快。因此，`n²` 属于 `Ω(2n log n)`。\n\n## 3.5\
  \ 计算程序的运行时间\n\n本节介绍了几个简单代码片段的分析。\n\n**示例 3.9** 我们首先对一个整数变量的简单赋值进行分析。\n\n```c\na\
  \ = b;\n```\n\n由于赋值语句消耗的是常数时间，因此它是 `Θ(1)`。\n\n**示例 3.10** 考虑一个简单的 `for` 循环。\n\n\
  ```c\nsum = 0;\nfor (i=1; i<=n; i++)\n    sum += n;\n```\n\n第一行是 `Θ(1)`。`for` 循环重复\
  \ `n` 次。第三行消耗了常数时间，因此根据第 3.4.4 节的简化规则 (4)，执行构成 `for` 循环的两行代码的总代价为 `Θ(n)`。根据规则 (3)，整个代码片段的代价也是\
  \ `Θ(n)`。\n\n**示例 3.11** 我们现在分析一个包含几个 `for` 循环的代码片段，其中一些是嵌套的。\n\n```c\nsum = 0;\n\
  for (i=1; i<=n; i++)\n    // 第一个 for loop\n    for (j=1; j<=i; j++)\n        //\
  \ 是双层循环\n        sum++;\n    for (k=0; k<n; k++)\n        // 第二个 for loop\n    \
  \    A[k] = k;\n```\n\n该代码片段有三个独立的语句：第一个赋值语句和两个 `for` 循环。同样，赋值语句消耗常数时间；称之为 `c1`。第二个\
  \ `for` 循环与示例 3.10 中的循环相似，消耗 `c2n = Θ(n)` 时间。\n\n第一个 `for` 循环是一个双层循环，需要特殊的技巧。我们从循环的内部向外处理。表达式\
  \ `sum++` 消耗常数时间；称之为 `c3`。由于内部 `for` 循环执行了 `i` 次，根据简化规则 (4)，它的代价为 `c3i`。外层 `for`\
  \ 循环执行了 `n` 次，但每次内部循环的代价都是不同的，因为它的代价是 `c3i`，且 `i` 每次都会变化。你可以看到对于外层循环的第一次执行，`i` 是\
  \ `1`。对于外层循环的第二次执行，`i` 是 `2`。每经过外层循环，`i` 都会加 1，直到循环的最后一次时 `i = n`。因此，循环的总代价是 `c3`\
  \ 乘以整数 1 到 `n` 的和。从等式 2.1 中，我们知道 \n\n`\\sum_{i=1}^{n} i = n(n + 1)/2`\n\n这是 `Θ(n²)`。通过简化规则\
  \ (3)，`Θ(c1 + c2n + c3n²)` 仅仅是 `Θ(n²)`。\n\n**示例 3.12** 比较以下两个代码片段的渐近分析：\n\n```c\n\
  sum1 = 0;\nfor (i=1; i<=n; i++)\n    // 第一个双层循环\n    for (j=1; j<=n; j++)\n    \
  \    // 执行 n 次\n        sum1++;\n\nsum2 = 0;\nfor (i=1; i<=n; i++)\n    // 第二个双层循环\n\
  \    for (j=1; j<=i; j++)\n        // 执行 i 次\n        sum2++;\n```\n\n在第一个双层循环中，内部\
  \ `for` 循环始终执行 `n` 次。因为外层循环执行 `n` 次，所以显而易见语句 `sum1++` 正好执行了 `n²` 次。第二个循环类似于上一个示例中分析的循环，代价为\
  \ `\\sum_{j=1}^{n} j`。这大约是 `n²/2`。因此，两个双层循环的代价都是 `Θ(n²)`，尽管第二个所需的只需要大约的一半。\n\n**示例\
  \ 3.13** 并不是所有的双嵌套 `for` 循环都是 `Θ(n²)`。接下来的一对嵌套循环说明了这一事实。\n\n```c\nsum1 = 0;\nfor\
  \ (k=1; k<=n; k*=2)\n    // 执行 log n 次\n    for (j=1; j<=n; j++)\n        sum1++;\n\
  \nsum2 = 0;\nfor (k=1; k<=n; k*=2)\n    // 执行 log n 次\n    for (j=1; j<=k; j++)\n\
  \        sum2++;\n```\n\n在第一个代码片段中，外层循环执行 `log n` 次，内部循环执行 `n` 次。在第二个代码片段中，外层循环执行\
  \ `log n` 次，内部循环执行 `k` 次。第二个片段的总代价为 `\\sum_{i=0}^{\\log n} 2^i = 2n-1`，这是 `Θ(n)`。根据等式\
  \ 2.8，我们知道这个和仅仅是 `Θ(n)`。其他控制语句如何？`While` 循环的分析方法类似于 `for` 循环。在某些情况下，`if` 或 `switch`\
  \ 语句的概率是输入大小的。例如，对于大小为 `n` 的输入，`then` 分句的执行概率可能是 `1/n`。一个例子是仅在最小值处执行 `then` 分句的\
  \ `if` 语句。为了对此类程序进行平均情况分析，我们不能简单地将 `if` 语句的代价视为开销较大的分支。\n\n确定子程序的执行时间可能是困难的。递归子程序的运行时间通常用递归关系表示最为合适。例如，2.5\
  \ 节中的阶乘函数 `fact` 调用自身时传入比输入值小一次。该递归调的结果与输入值相乘，这消耗常数时间。因此，阶乘函数的代价（如果我们想以乘法操作次数来衡量代价）比对较小输入进行递归调用所花费的乘法次数多一次。由于基础情况不进行乘法，其代价为零。因此，该函数的运行时间可以表示为\
  \ `T(n) = T(n-1) + 1`，对于 `n > 1; T(1) = 0`。\n\n我们从示例 2.8 和 2.13 中知道该递归关系的闭闭式解是 `Θ(n)`。\n\
  \n\n\n\n以及 11. 接下来检查位置 9。同样，它的值太大了。最后的搜索在位置 8，该处包含所需的值。因此，函数 `binary` 返回位置 8。或者，如果\
  \ `K` 是 44，则将进行相同的系列记录访问。在检查位置 8 后，`binary` 将返回值 `n`，表示搜索失败。\n\n本节的最后一个算法分析示例将比较两种在数组中执行搜索的算法。在此之前，我们已经确定，对于搜索值\
  \ `K` 有等概率出现在数组任意位置的数组，其顺序查找的运行时间在平均和最坏情况下均为 `Θ(n)`。我们希望将此运行时间与在对数组值按从低到高有序存储的数组上执行二分查找所需的运行时间进行比较。\n\
  \n二分查找首先从检查数组中间位置的值开始；将此位置称为 `mid`，对应的值称为 `kmid`。如果 `kmid = K`，则可以立即停止处理。然而，这种情况不太。幸运的是，知道中间值提供了很有用的信息，可以帮助引导搜索过程。特别是，如果\
  \ `kmid > K`，那么你就知道值 `K` 不可能出现在数组中大于 `mid` 的任何位置。因此，你可以消除对数组上半部分的后续搜索。相反，如果 `kmid\
  \ < K`，你就知道可以忽略数组中所有小于 `mid` 的位置。无论哪种，一半的位置都被从进一步考虑中排除了。二分查找接下来查看值 `K` 可能存在的数组部分的中间位置。该位置的值再次允许我们从考虑中消除一半剩余的位置。这个过程不断重复，直到找到所需的值，或者数组中没有剩余可能包含值\
  \ `K` 的位置。图 3.4 释了二分查找法。图 3.5 显示了二分查找的实现。\n\n为了找到该算法在最坏情况下的代价，我们可以将运行时间建模为递归方程，然后找到闭式解。`binary`\
  \ 的每次递归调用都会将数组的大小大约减半，因此为了简单，假设 `n` 是 2 的幂，可以将最坏情况的代价建模如下：\n\n`T(n) = T(n/2) + 1\
  \ for n > 1;`\n`T(1) = 1.`\n\n第 3.5 节 计算程序的运行时间 75\n\n```c\n// 返回排序数组 \"A\" 中大小为\
  \ \"n\"\n// 值为 \"K\" 的元素的位置。\n// 如果 \"K\" 不在 \"A\" 中，则返回\n// 值 \"n\"。\nint binary(int\
  \ A[], int n, int K) {\n    int l = -1;\n    int r = n;\n    // l 和 r 超出了数组边界\n\
  \    while (l+1 != r) {\n        // 当 l 和 r 相遇时停止\n        int i = (l+r)/2;\n  \
  \      // 检查剩余子数组的中间\n        if (K < A[i]) r = i;\n        // 在左半\n        if (K\
  \ == A[i]) return i; // 找到了\n        if (K > A[i]) l = i;\n        // 在右半\n    }\n\
  \    return n; // 搜索值不在 A 中\n}\n```\n\n图 3.5 二分查找的实现。\n\n如果我们展开递归方程，会发现我们在到达基础情况之前只能进行\
  \ `log n` 次展开，每次展开都会增加一次代价。因此，该递归方程的闭式解为 `T(n) = log n`。\n\n函数 `binary` 设计用于找到 `K`\
  \ 的（单次）出现并返回其位置。如果 `K` 未出现在数组中，则返回特殊值。该算法可以修改以实现变体，例如：在允许多次出现的情况下返回数组中 `K` 首次出现的位置，以及当\
  \ `K` 不在数组中返回小于 `K` 的最大值的位置。\n\n比较顺序查找和二分查找，我们看到随着 `n` 的增长，顺序查找在平均和最坏情况下的 `Θ(n)`\
  \ 运行时间会迅速大于二分查找的 `Θ(log n)` 运行时间。单独来看，二分查找似乎比顺序查找高效得多。尽管由于二分查找的常数因子大于顺序查找，因为二分查找中计算下一个搜索位置的开销比仅仅增加当前位置（如顺序查找那样）要贵。\n\
  \n但注意，无论数组值是否按顺序存储，顺序查找的运行时间都大致相同。相比之下，二分查找要求数组值从低到高有序。根据使用二分查找的上下文，这种对排序数组的要求可能对整个程序的运行时间产生不利，因为在向数组插入新元素时，保持值的排序需要更大的代价。这是搜索期间二分查找优势与维护排序数组相关的劣势之间的权衡。只有在要解决的完整问题背景下，我们才能知道优势是否大于劣势。\n\
  \n76\n\n第 3 章 算法分析\n\n### 3.6 分析问题\n\n你最经常使用“算法”分析技术来分析算法，或者算法作为算法的实例化。你也可以使用这些相同的技术来分析问题的代价。对你来说，说问题的上界不会比我们已知的该问题最佳算法的上界更差是合理的。但给一个问题给出下界意味着什么？\n\
  \n考虑某个算法在给定大小下所有输入的代价图。定义 A 为所有解决问题的算法的集合（理论上有无限多个这样的算法）。现在考虑所有图的集合。最下界是所有点中的最小值。\n\
  \n证明一个算法（或程序）属于 `Ω(f(n))` 比证明一个问题属于 `Ω(f(n))` 要容易得多。一个问题属于 `Ω(f(n))` 意味着解决该问题的每个算法都属于\
  \ `Ω(f(n))`，甚至是我们尚未想到的算法！\n\n到为止，我们所有的算法分析示例给都是“显而易见”的结果，大 O 总是与 Ω 匹配。为了理解大 O、Ω\
  \ 和 Θ 符号如何正确地描述我们对问题或算法的理解，最好考虑一个你不知道答案的例子。让我们预先查看排序问题的分析，看看这个过程是如何运作的。在最坏情况下，任何排序算法的最小可能代价是多少？\n\
  \n算法必须至少查看输入中的每个元素，以确定输入确实是已排序的。因此，任何排序算法都至少需要 `cn` 时间。\n\n对于许多问题，这种对每个 `n` 个输入都必须被查看的观察会导致得到一个简单的\
  \ `Ω(n)` 下界。\n\n\n\n第 7 章介绍了在最坏情况下运行时间为 $O(n \\log n)$ 的排序算法。这极地缩小了差距。有了这些新知识，我们现在有了\
  \ $\\Omega(n)$ 的下界和 $O(n \\log n)$ 的上界。我们应该寻找更快的算法吗？许多人都尝试过，但没有成功。幸运的是（也许是不幸？），第\
  \ 7 章还包含一个证明，任何排序算法在最坏情况下运行时间必须为 $\\Omega(n \\log n)$。这个证明是算法分析领域最重要的结果之一，意味着对于大小为\
  \ $n$ 的最坏输入，没有任何排序算法的运行速度比 $cn \\log n$ 快。\n\n因此，我们可以得出结论：排序问题在最坏情况下是 $\\Theta(n\
  \ \\log n)$，因为上下下界已经汇合。\n\n知道问题的下界并不能给你一个好的算法。但它确实能帮助你知道何时停止寻找。如果问题的下界与算法的上界匹配（在常数因子范围内），那么我们就知道可以找到一个仅差一个常数因子的优算法。\n\
  \n## 3.7 常见误解\n\n渐近分析是本科计算机科学专业面临的最具智性的话题之一。大多数人发现增长率和渐近分析令人困惑，因此对概念或术语产生了误解。了解哪些标准的困惑点是有帮助的，以期避免它们。\n\
  \n在区分上界和下界概念时，问题在于：对于你会遇到的大多数算法，识别该算法的真实增长率是非常的。在完全了解代价函数的情况下，该代价函数的上界和下界总是相同的。因此，只有当你对所测量的对象了解不完全时，上界和下界之间的区分才有意义。如果这种区别仍然不清楚，请重新阅读第\
  \ 3.6 节。我们使用 $\\Theta$ 符号来表示我们所知的上界和下界增长率之间没有实质性差异（这对于简单算法通常是如此）。\n\n一个常见的错误是将一方面的上界或下界概念，与另一方面的最坏情况或最好情况概念相混淆。最好情况、最坏情况或平均情况每种都为我们提供了一个具体的输入实例（或一组具体的实例），我们可以将其应用于算法描述以获得成本衡量值。上界和下界描述的是我们对该成本衡量值增长率的理解。\n\
  \n因此，为了定义算法或问题的增长率，我们需要确定我们正在测量什么（最好情况、最坏情况或平均情况），以及我们对该成本衡量值增长率的认知描述（大 O 表示、$\\\
  Omega$ 或 $\\Theta$）。\n\n算法的上界并不等于该算法对于给定大小为 $n$ 的输入的最坏情况。被界定的不是实际成本（你可以根据给定的 $n$\
  \ 值确定它），而是成本的增长率。单个点（例如 $n$ 的特定值）是不存在增长率的。增长率适用于随着输入大小的变化而导致成本的变化。\n\n同样，下界并不等于对于给定大小\
  \ $n$ 的最好情况。\n\n另一个常见的误解是认为算法的最好情况发生在输入大小尽可能小时，或者最坏情况发生在输入大小尽可能大时。正确的说法是，对于每种可能的输入大小，都存在最好和最坏情况的实例。也就是说，对于给定大小（假设为\
  \ $i$）的所有输入，大小为 $i$ 的输入中有一个（或多个）是最好的，大小为 $i$ 的输入中也有一个（或多个）是最坏的。通常（但并非总是！），我们可以刻画任意大小的最好输入情况，也可以刻画任意大小的最坏输入情况。理想情况下，我们可以随着输入大小的增长，确定所刻画的最好、最坏和平均情况的增长率。\n\
  \n**示例 3.14** 顺序搜索的最好情况的增长率是什么？对于任何大小为 $n$ 的数组，最好情况发生在我们要找的值出现在数组的第一个位置时。无论数组大小如何，这都是成立的。因此，对于任意大小\
  \ $n$ 的最好情况发生在所需值位于 $n$ 个位置中的第一个时，其成本为 1。说最好情况发生在 $n = 1$ 时是不正确的。\n\n**示例 3.15**\
  \ 想象画一张图来显示随着 $n$ 增长，在 $n$ 个值中寻找最大值的成本。也就是说，x 轴是 $n$，y 轴值是成本。当然，这是一条向右上延伸的斜线，随着\
  \ $n$ 的增加而增加（在继续阅读之前，你可能想自己画一下这张图）。\n\n现在，想象一张图，显示在数组（假设为）20 个元素中寻找最大值问题的每个实例的成本。图沿\
  \ x 轴的第一个位置可能对应于最大元素位于数组的第一个位置。图沿 x 轴的第二个位置可能对应于最大元素位于数组的第二个位置，依此类推。当然，成本始终是 20。因此，该图将是一条值为\
  \ 20 的水平线。你应该自己画这张图。\n\n现在，让我们切换到在数组中对给定值进行顺序搜索的问题。考虑显示大小为 20 的每个实例成本的图。第一个实例可能是我们搜索的值位于数组的第一个位置。这成本为\
  \ 1。第二个实例可能是我们搜索的值位于数组的第二个位置。这的成本为 2。依此类推。如果我们把大小为 20 的实例从左侧到右侧排列，我们可以看到图表形成了一条从左下角（值为\
  \ 0）到右上（值为 20）的斜线。\n\n最后，让我们考虑当数组大小 $n$ 增大时执行顺序搜索的成本。这张图看起来会是什么样？遗憾的是，不像寻找最大值那样没有一个简单的答案。图的形状取决于我们考虑的是最好情况成本（那将是一条值为\
  \ 1 的水平线）、最坏情况成本（那将是一条在 x 轴位置 $i$ 值为 $i$ 的斜线）还是平均成本（那将是一条在 x 轴位置 $i$ 值为 $i/2$ 的斜线）。这就是为什么我们必须说函数\
  \ $f(n)$ 在最好、平均或最坏情况下是 $O(g(n))$！\n\n\n\n\n```markdown\n// 查看所有像素\ncount[value(i)]++;\
  \ // 增加像素值计数\nsort(count, C);\n// 对像素值计数进行排序\n```\n\n在这个示例中，`count` 是一个大小为 `C` 的数组，用于存储每个颜色值对应的像素数量。函数\
  \ `value(i)` 返回像素 `i` 的颜色值。\n\n第一个 `for` 循环（初始化 `count`）的时间取决于颜色的数量 `C`。第二个循环（确定每种颜色的像素数量）的时间为\
  \ Θ(P )。最后一行调用 `sort` 的时间取决于所用排序算法的代数开销。根据第 3.6 节的讨论，我们可以假设如果排序 `P` 个元素，排序算法的代价为\
  \ Θ(P log P )，从而得出总算法代价为 Θ(P log P )。\n\n这种表示是该算法成本的良好衡量吗？实际上排序的是什么？它不是像素，而是颜色。如果\
  \ `C` 远小于 `P` 呢？那么对 Θ(P log P ) 的估计就是悲观的，因为排序的元素远少于 `P`。相反，我们应该使用 `P` 作为查看每个像素步骤的分析变量，并将\
  \ `C` 作为查看颜色步骤的分析变量。这样，初始化循环得到 Θ(C)，像素计数循环得到 Θ(P )，排序操作得到 Θ(C log C)。这得到了 Θ(P +\
  \ C log C) 的总代价。\n\n为什么我们不不能简单地使用 `C` 的值作为输入规模，并说算法代价是 Θ(C log C) 呢？因为 `C` 通常远小于\
  \ `P`。例如，一张图片可能有 1000 × 1000 个像素，以及 256 种可能的颜色范围。因此，`P` 是一百万，远大于 `C log C`。但是，如果\
  \ `P` 较小或 `C` 较大（即使它仍然小于 `P`），那么 `C log C` 可能会变成更大的数值。因此，这两个变量都不应该被被忽略。\n\n## 3.9\
  \ 空间边界\n\n除了时间，空间是程序员通常关注的另一个计算资源。正如多年来计算机变得越来越快，它们获得的内存分配也增加了。尽管如此，可用磁盘空间或主内存的量对于算法设计者来说可能是显著的限制。\n\
  \n用于衡量空间需求的技术与用于衡量时间需求的技术相似。然而，时间需求通常是针对操作特定数据结构的算法衡量的，而空间需求通常是针对数据结构本身的。用于输入规模增长率的渐近分析概念完全适用于衡量空间需求。\n\
  \n**示例 3.16** 一个包含 `n` 个整数的数组空间需求是多少？如果每个整数需要 `c` 字节，那么该数组需要 `cn` 字节，即 Θ(n)。\n\n\
  **示例 3.17** 假设我们想要跟踪 `n` 个人之间的友谊。我们可以通过一个大小为 `n × n` 的数组来实现。数组的每一行代表一个个人的朋友，列则表示谁是该个人的朋友。例如，如果人员\
  \ `j` 是人员 `i` 的朋友，那么我们在数组的第 `i` 行的第 `j` 列中做一个标记。同样，如果我们假设友谊是双向的，我们也应该在第 `j` 行的第\
  \ `i` 列中做一个标记。对于 `n` 个人，数组的总大小为 Θ(n2)。\n\n数据结构的主要目的是以存储数据，以便能够高效地访问这些数据。为了提供高效访问，可能需要存储关于数据在数据结构中位置的额外信息。例如，链表的每个节点必须存储一个指向列表中下一个值的指针。所有此类存储在实际数据值之外的信息都称为开销（overhead）。\n\
  \n理想情况下，开销应保持在最低，同时允许最大的访问效率。\n\n在这些对立目标之间保持平衡的需求，使得数据结构的研究变得如此有趣。\n\n算法设计的一个重要方面被称为空间/时间权衡原则（space/time\
  \ tradeoff principle）。空间/时间权衡原则指出，如果愿意牺牲空间（或反之），通常可以实现时间的减少。许多程序可以通过“打包”或编码信息来减少存储需求。“解包”或解码这些信息需要额外的时间。因此，生成的程序使用的空间更少，但运行速度较慢。相反，许多程序可以修改为预存结果或重新组织信息，以以更大的存储需求为代价获得更快的运行时间。通常，这种时间和空间的变化都是以常数倍数的形式存在的。\n\
  \n空间/时间权衡的一个经典例子是查找表（lookup table）。查找表预存了函数的值，否则该值在每次需要时都要重新计算。例如，`12!` 是可以存储在 32\
  \ 位 `int` 变量中的阶函数最大值。如果你正在编写一个经常计算阶角的程序，简单地预先计算并将 `12` 个值存储在表中可能会在时间上高效得多。每当程序需要\
  \ `n!` 的值时，只需检查查找表即可。（如果 `n > 12`，该值太大，根本无法作为 `int` 变量存储。）与计算阶角所需的时间相比，存储查找表所需的少量额外空间可能是非常值得的。\n\
  \n查找表还可以存储昂贵函数（如正弦或余弦函数）的近似值。如果你只对精确角度计算此函数，或者愿意用最近的角度来近似答案，那么可以使用存储精确角度的查找表来代替重复计算。注意，初始构建查找表需要一定的时间。你的应用程序必须频繁使用查找表，这样才是值得的。\n\
  \n另一个空间/时间权衡的例子是程序员在尝试优化空间时可能会遇到的。这里有一个对整数数组排序的简单代码片段。假设这是一个特殊情况，即整数的值是 0 到 `n-1`\
  \ 的排列。这是桶排序（Binsort）的一个例子，它在第 7.7 节中讨论过。桶排序将每个值分配到与其值对应的数组位置。\n\n```\nfor (i=0;\
  \ i<n; i++)\nB[A[i]] = A[i];\n```\n\n这种方法非常高效且需要 Θ(n) 时间。然而，它需要两个大小为 n 的数组。接下来是一个在同一个数组内将排列按顺序排序的代码片段（因此它是“原地”排序的例子）。\n\
  \n```\nfor (i=0; i<n; i++)\nwhile (A[i] != i)\nswap(A, i, A[i]);\n```\n\n函数 `swap(A,\
  \ i, j)` 交换 `A` 中的元素 `i` 和 `j`。第二个代码片段是否真的排序了数组并不显而易见。为了证明它有效，注意每次通过 `for` 循环至少会将值为\
  \ `i` 的整数移动到数组中的正确位置，并且在此迭代期间，`A[i]` 的值大于或等于 `i`。总最多发生 n 次 `swap` 操作，因为一个整数一旦被放在正确位置，就不会再被移出，且每次交换操作至少将一个整数放在正确位置。因此，该代码片段的代价为\
  \ Θ(n)。然而，它的运行时间比第一个代码片段长。在我的电脑上，第二个版本的运行时间几乎是第一个版本的两倍，但它只需要一半的空间。\n\n关于程序空间和时间需求之间关系的第二个原则适用于处理存储在磁盘上的信息的程序，如在第\
  \ 8 节及之后中讨论的那样。奇怪的是，基于磁盘的空间/时间权衡原则与使用主内存的程序的空间/时间权衡原则几乎相反。\n\n\n\n\n\n基于磁盘的空时间权衡原则指出，你的磁盘存储需求越小，你的程序运行得就越快。这是因为与计算时间相比，从磁盘读取信息的时间是巨大的，因此，为了解包数据而所需的任何额外计算，其时间都小于通过减少存储需求所节省的磁盘读取时间。自然，这一原则并非在所有情况下都适用，但在设计处理存储在磁盘上的信息的程序时，记住这一点好处。\n\
  \n## 3.10 加快你的程序\n\n在实践中，增长率为 $\\Theta(n)$ 的算法与另一个增长率为 $\\Theta(n \\log n)$ 的算法之间的运行时间并没有那么大的差异。然而，增长率分别为\
  \ $\\Theta(n \\log n)$ 和 $\\Theta(n²)$ 的算法之间运行时间存在着巨大的差异。正如你在学习常用数据结构和算法的过程中将会看到的，一个显而易见的解决方案需要\
  \ $\\Theta(n²)$ 时间的问题也有一个需要 $\\Theta(n \\log n)$ 时间的解决方案，这并不罕见。例子包括排序和搜索，这是计算机领域最重要的两个问题。\n\
  \n**示例 3.18** 以下是一个真实故事。几年前，我的一个研究生遇到了一个大问题。他的论文工作涉及对大型数据库的几项复杂操作。他当时正在进行最后一步。“Shaffer\
  \ 博士，”他说，“我正在运行这个程序，它似乎需要很长时间。”在检查了算法后，我们意识到它的运行时间是 $\\Theta(n²)$，可能需要一到两周才能完成。即使我们可以让计算机不中断地运行那么久，他也希望在此之前完成论文并毕业。幸运的是，我们意识到有一种相当简单的方法可以转换算法，使其运行时间变为\
  \ $\\Theta(n \\log n)$。到第二天，他就修改了程序。它只运行了几个小时，他按时完成了论文。\n\n虽然远没有改变算法以减小其增长率那样重要，但“代码调优”（code\
  \ tuning）也能带来运行时间的巨大改进。代码调优是手工优化程序以使其运行得更快或需要更少存储的艺术。\n\n对于许多程序，代码调优可以使运行时间减少十倍，或者将存储需求削减一半或更多。我曾调优过程序中的一个关键函数——在不改变其基本算法的情况下——实现了\
  \ 200 倍的加速。然而，为了获得这种加速，我确实对信息的表示进行了重大更改，将其从符号编码方案转换为数值编码方案，我能够在上面进行直接计算。\n\n这里是一些通过代码调优加快程序的方法建议。\n\
  \n要意识到的最重要的一是，程序中的大多数语句对该程序的运行时间没有太大影响。通常只有少数关键子程序，甚至可能是关键子程序中的关键几行代码，占据了大部分的运行时间。将一个仅占总运行时间\
  \ 1% 的子程序的运行时间缩短一半是没有意义的。将注意力集中在程序中影响最大的部分上。\n\n在调优代码时，收集良好的计时统计数据是非常重要的。许多编译器和操作系统都包含了性能分析器（profilers）和其他特殊工具，以帮助收集关于时间和空间使用的信息。在尝试让程序更高效时，这些工具是无价之宝，因为它们可以告诉你应该在哪里投入精力。\n\
  \n很多代码调优是基于避免工作而非加速工作的原理。一种常见的情况是，我们可以测试某个条件来跳过某些工作。然而，这种测试绝不是完全免费的。必须注意测试的成本不能超过所节省的工作量。虽然一次测试可能比潜在节省的工作要便宜，但测试必须进行，且工作只有在部分时间内可以被避免。\n\
  \n**示例 3.19** 计算机图形应用中的常见操作是找到一组复杂对象中哪一个包含空间中的给定点。许多有用的数据结构和算法已被用于处理此类问题的变体。大多数此类实现都涉及以下调优步骤。直接测试给定的复杂对象是否包含所述点是相当贵的。相反，我们可以筛选该点是否位于对象的边界框（bounding\
  \ box）内。边界框仅仅是包含对象的最小矩形（通常定义为边垂直于 x 轴和 y 轴）。\n\n如果点不在边界框内，那么它就不可能在对象内部。如果点在边界框内，我们才对对象与点进行完整的比较。请注意，如果点在边界框之外，我们节省了时间，因为边界框测试比完整对象与点的比较要便宜。但如果点在边界框内，那么该测试就是冗余的，因为我们仍然需要比较点和对象。通常，通过进行这种测试所避免的工作量大于在每个对象上进行测试的成本。\n\
  \n**示例 3.20** 第 7.2.3 节介绍了一种名为`Selection Sort`（选择排序）的排序算法。该算法的主要特征是它对数组中存储的记录所需的交换次数较少。\n\
  \n然而，它有时会执行一次不必要的交换操作，试图将一个记录与自身交换。通过测试正在交换的两个索引是否相同可以避免这种工作。然而，这种事件发生并不频繁。因为与测试成功时节省的工作相比，测试的成本已经足够高，添加该测试通常会减慢程序而不是加速它。\n\
  \n\n\n\n请注意，对程序的计时比较是一项困难的工作，往往受到由于不受控因素（如系统负载、使用的语言或编译器等）引起的实验误差的影响。最重要的一点是不要偏袒某一个程序。如果你有偏见，这一定会反映在计时结果中。看一眼竞争性软件或硬件厂商的广告，你就会明白这一点。在编写两个程序来比较性能时，最常见的陷阱是其中一个程序收到的代码调优比另一个多。如第\
  \ 3.10 节所述，代码调优通常可以将运行时间缩短十倍。如果两个程序的运行时间无论输入大小如何都相差一个常数因子（即它们的增长率相同），那么代码调优的差异可能解释运行时间的任何不同。在这种情况下，要对经验比较保持怀疑。\n\
  \n分析的另一种方法是仿真。仿真的思想是用计算机程序对问题进行建模，然后运行它以获得结果。在算法分析的背景下，仿真与对两个竞争者进行经验比较不同，因为仿真的目的是进行否则可能难以实现的分析。图\
  \ 9.10 是一个很好的例子。该图展示了在两种查找哈表空槽策略的假设下，从哈表中插入或删除记录的代价。y 轴是评估的哈希表槽数量的代价，x 轴是表中满槽位占总数的百分比。这些曲线的数学方程可以确定，但并不容易。一种合理的替代方案是编写哈希的简单变体。通过对程序在各种加载条件下的成本进行计时，并不构造出一个类似于图\
  \ 3.10 的图表。这种分析的目的不是为了确定哪种哈希方法最高效，因此我们并不是在对哈希替代方案进行经验比较。相反，其目的是分析在高效哈希系统中使用的适当负载因子，以平衡时间成本与哈希表大小（空间成本）。\n\
  \n# 第 3 章 算法分析\n\n## 3.12 扩展阅读\n\n算法分析的开创性工作包括 Donald E. Knuth 的 *The Art of Computer\
  \ Programming* [Knu97, Knu98]，以及 Aho、Hopcroft 和 Ullman 著的 *The Design and Analysis\
  \ of Computer Algorithms* [AHU74]。`Ω` 的另一种定义来自 [AHU83]。使用符号 `T(n) is in O(f (n))`\
  \ 而不是更常用的 `T(n) = O(f (n))`——我源于 Brassard 和 Bratley [BB96]，尽管这种用法显然早于他们。关于算法分析技术的更多信息，一本很好的读物是\
  \ Gregory J.E. Rawlins 著的 *Compared to What?* [Raw92]。\n\nBentley [Ben88] 描述了数值分析中的一个问题，在\
  \ 1945 年到 1988 年之间，已知最佳算法的复杂度从 `O(n7)` 减少到 `O(n3)`。对于规模为 `n = 64` 的问题，这大致等于同一时期计算机硬件所有进步带来的速度提升。\n\
  \n虽然程序效率最重要的方面是算法，但通过高效的代码编写可以获得巨大的改进。正如 Frederick P. Brooks 在 *The Mythical Man-Month*\
