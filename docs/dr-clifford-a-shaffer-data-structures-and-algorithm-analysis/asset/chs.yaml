  # 11.5 最小权重生成树\n\n最小权重生成树（MST）问题的输入是一个连通的无向图 G，其中每条边都附带有一个距离或权重度量。\n\nMST 是包含 `G`\
  \ 的所有顶点以及 `G` 的边的一个子集的图，该子集满足：(1) 通过对子集中所有边的值求和，具有最小总成本，且 (2) 保持顶点连通。该问题的解决应用场景包括：焊接连接电路板上一组端子所需的最短电线集合，以及以需要最少电缆的方式连接一组城市。\n\
  \nMST 不包含任何环。如果建议的 MST 包含环，则通过移除环中的任何一条边可以获得一个成本更低的 MST。因此，MST 是一个具有 $|V| - 1$ 条边的无向树。“最小权重生成树”这一名称源于所需的边集形成了一棵树，它跨越了所有顶点（即将它们连接在一起），并且具有最小成本。图\
  \ 11.20 显示了一个示例图的 MST。\n\n```cpp\n// Dijkstra’s shortest paths algorithm with priority\
  \ queue\nvoid Dijkstra(Graph* G, int* D, int s) {\n    int i, v, w;\n    // v is\
  \ current vertex\n    DijkElem temp;\n    DijkElem E[G->e()];\n    // Heap array\
  \ with lots of space\n    temp.distance = 0; temp.vertex = s;\n    E[0] = temp;\n\
  \    // Initialize heap array\n    heap<DijkElem, DDComp> H(E, 1, G->e()); // Create\
  \ heap\n    for (i=0; i<G->n(); i++) {\n        // Now, get distances\n        do\
  \ {\n            if (H.size() == 0) return; // Nothing to remove\n            temp\
  \ = H.removefirst();\n            v = temp.vertex;\n        } while (G->getMark(v)\
  \ == VISITED);\n        G->setMark(v, VISITED);\n        if (D[v] == INFINITY) return;\n\
  \        // Unreachable vertices\n        for (w=G->first(v); w<G->n(); w = G->next(v,w))\n\
  \            if (D[w] > (D[v] + G->weight(v, w))) { // Update D\n              \
  \  D[w] = D[v] + G->weight(v, w);\n                temp.distance = D[w]; temp.vertex\
  \ = w;\n                H.insert(temp);\n                // Insert new distance\
  \ in heap\n            }\n    }\n}\n```\n\n**图 11.18** 使用优先级队列实现的 Dijkstra 算法。\n\
  \n**A**, **B**, **C**, **D**, **E**\n初始：0, $\\infty$, $\\infty$, $\\infty$, $\\\
  infty$\n处理 A：0, 10, 3, 20, $\\infty$\n处理 C：0, 5, 3, 20, 18\n处理 B：0, 5, 3, 10, 18\n\
  处理 D：0, 5, 3, 10, 18\n处理 E：0, 5, 3, 10, 18\n\n**图 11.19** 在图 11.16 的图上运行 Dijkstra\
  \ 算法的进度列表。起点为 A。\n\n**图 11.20** 一个图及其 MST。所有的边都出现在原始图中。用粗实线绘制的边表示构成 MST 的子集。注意，边\
  \ `(C, F)` 可以替换为边 `(D, F)` 以形成成本相同的不同 MST。\n\n## 11.5.1 Prim 算法\n\n我们寻找 MST 的两种算法中的第一个通常被称为\
  \ Prim 算法。Prim 算法非常简单。从图中的任意顶点 `N` 开始，最初将 MST 设为 `N`。选择与 `N` 连接的成本最低的边。这条边将 `N`\
  \ 连接到另一个顶点；我们称其为 `M`。将顶点 `M` 和边 `(N, M)` 加入 MST。接下来，选择从 `N` 或 `M` 出到图中任何其他顶点的成本最低的边。将这条边和它到达的新顶点加入\
  \ MST。这个过程持续进行，每一步通过选择从当前在 MST 中的顶点到当前不在 MST 中的顶点的成本最低的边来扩展 MST。\n\nPrim 算法与寻找单源最短路径的\
  \ Dijkstra 算法非常相似。主要区别在于我们寻找的不是距离起点最近的顶点，而是距离当前 MST 中任意顶点最近的顶点。因此，我们将 `if (D[w]\
  \ > (D[v] + G->weight(v, w)))` 替换为 `D[w] = D[v] + G->weight(v, w);`。\n\nPrim 算法是贪心算法的一个例子。在\
  \ `for` 循环的每一步中，我们选择连接某个标记顶点和某个未标记顶点的成本最低的边。这引发了一个重要的问题：Prim 算法有效吗？\n\n**定理 11.1**\
  \ Prim 算法产生最小权重树。\n\n**证明：** 我们将使用反法证明。假设 `G = (V, E)` 是一个 Prim 算法无法生成 MST 的图。根据顶点添加到\
  \ MST 的顺序对顶点进行排序：`v0, v1, ..., vn−1`。令边 `ei` 连接了 `(vx, vi)`，对于某个 `x < i`。令 `ej`\
  \ 为 Prim 算法添加的编号最低（第一条）边，使得目前为止的边集无法扩展形成 MST。换句话说，`ej` 是 Prim 算法“出错”的第一条边。令 `T`\
  \ 为“真正的” MST。称 `vp (p < j)` 为由边 `ej` 连接的顶点，即 `ej = (vp, vj)`。由于 `T` 是一棵树，在 `T` 中存在一条连接\
  \ `vp` 和 `vj` 的路径。在该路径中存在某条边 `e0` 连接 `vu` 和 `vw`，其中 `u < j` 且 `w ≥ j`。由于 `ej` 不属于\
  \ `T`，将边 `ej` 加入 `T` 将形成一个环。\n\n\n\n\n\n```cpp\nv = temp.vertex;\n\n} while (G->getMark(v)\
  \ == VISITED);\n\nG->setMark(v, VISITED);\n\nif (v != s) AddEdgetoMST(V[v], v);\
  \ // 将边加入 MST\n\nif (D[v] == INFINITY) return;\n\n// 不可顶点\nfor (w=G->first(v); w<G->n();\
  \ w = G->next(v,w))\n  if (D[w] > G->weight(v, w)) {\n    // 更新 D\n    D[w] = G->weight(v,\
  \ w);\n    V[w] = v;\n    // 更新来源\n    temp.distance = D[w]; temp.vertex = w;\n\
  \    H.insert(temp);\n    // 在堆中插入新距离\n  }\n}\n}\n```\n\n**图 11.22** 使用优先队列的 Prim\
  \ 算法的实现。\n\n成本比边 `ej` 更低，因为 Prim 算法没有生成 MST。\n\n这种情况在图 11.23 所示。然而，Prim 算法会选择可用成本最低的边。它会选择\
  \ `e0` 而不是 `ej`。因此，Prim 算法会选择错误的边是一个矛盾，因此，Prim 算法必须是正确的。\n\n2\n\n**示例 11.3** 对于图\
  \ 11.20 中的图，假设我们首先从标记顶点 A 开始。从 A 开始，成本最低的边指向顶点 C。顶点 C 和边 (A, C) 被加入 MST。此时，连接 MST（顶点\
  \ A 和 C）与图的其余部分的候选边有 (A, E), (C, B), (C, D) 和 (C, F)。在这些选择中，从 MST 出发的成本最低的边是 (C,\
  \ D)。因此我们将顶点 D 添加到 MST 中。在下一次迭代中，我们的边选择有 (A, E), (C, B), (C, F) 和 (D, F)。因为边 (C,\
  \ F) 和 (D, F) 的成本恰好相等，所以选择哪一个是随机的。假设我们选择了 (C, F)。下一步标记顶点 E 并将边 (F, E) 加入 MST。按照这种方式，标记顶点\
  \ B（通过边 (C, B)）。此时，算法终止。\n\n第 11.5 节 最小生成树 407\n\n已标记\n未标记\n顶点 $v, i < j$\n顶点 $v,\
  \ i >= j$\ni\ni\n””边\n$e'$\n$u$\n$v$\n$vu$\n$p$\n$v$\n$vj$\n$j$\n$e$\nPrim 的边\n\n\
  **图 11.23** Prim MST 算法证明。左侧椭圆包含了图中 Prim 的 MST 与“真实”MST $T$ 一致的那部分。右侧椭圆包含了图的其余部分。图的两个部分由（至少）边\
  \ `ej`（Prim 算法选择加入 MST 的边）和 `e0`（应放置在 MST 中的“正确”边）连接。请注意，从 $vw$ 到 $vj$ 的路径不能包含任何已标记顶点\
  \ $v_i, i \\le j$，因为这样做会形成环。\n\n### 11.5.2 Kruskal 算法\n\n我们的下一个 MST 算法通常被称为 Kruskal\
  \ 算法。Kruskal 算法也是一种简单的贪心算法。首先将顶点集合划分为 $|V|$ 个等价类（见第 6.2 节），每个类包含一个顶点。然后按照权重顺序处理边。如果一条边连接两个不同等价类中的顶点，则将该边加入\
  \ MST 并合并两个等价类。重复此过程，直到只剩下一个等价类。\n\n**示例 11.4** 图 11.24 显示了针对图 11.20 运行 Kruskal\
  \ 算法的前三个步骤。边 (C, D) 的成本最低，因为 C 和 D 目前在不同的 MST 中，所以它们合并了。我们接下来选择边 (E, F) 进行处理，并将这些顶点合并为一个单一\
  \ MST。我们处理的第三条边是 (C, F)，它导致包含顶点 C 和 D 的 MST 与包含顶点 E 和 F 的 MST 合并。下一条要处理的边是 (D, F)。但由于顶点\
  \ D 和 F 目前在同一个 MST 中，这条边被拒绝了。算法将继续接受边 (B, C) 和 (A, C) 加入 MST。\n\n可以使用最小堆按照权重顺序处理边。这通常比先对边排序更快，因为在实践中我们只需要在完成\
  \ MST 之前访问一小部分边。正如第 7.6 节讨论的，这是在列表中寻找少数最小元素的示例。\n\n408\n第 11 章 图\n\n初始\nA, B, C,\
  \ D, E, F\n步骤 1\nA, B, E, F\n1\n处理边 (C, D)\nD, C\n步骤 2\nA, B, E\n1\n1\n处理边 (E, F)\n\
  D, C\n步骤 3\nA, B\n1\n2\n处理边 (C, F)\nD, F, E1\n\n**图 11.24** Kruskal 算法前三个步骤的插图。\n\
  \n可以使用最小堆按照权重顺序处理边。这通常比先排序更快，因为在实践中我们只需要在完成 MST 之前访问一小部分边。正如第 7.6 节讨论的，这是在列表中寻找少数最小元素的示例。算法唯一困难的部分在于判断顶点是否属于同一个等价类。说实话，如果使用了路径压缩和按秩合并，`differ`\
  \ 和 `UNION` 函数几乎是常数时间。因此，在平均情况下算法复杂度接近 $\\Theta(E \\log V)$。\n\n409\n```cpp\nclass\
  \ KruskElem {\n    // 堆的元素\n    public:\n    int from, to, distance;\n    KrusElem()\
  \ { from = -1; to = -1; distance = -1; }\n    KrusElem(int f, int t, int d) { from\
  \ = f; to = t; distance = d; }\n};\n\nvoid Krkel(Graph* G) {\n    // Kruskal 算法\n\
  \    ParTree A(G->n());\n    // 等价类数组\n    KrusElem E[G->n()];\n    // 边的集合\n  \
  \  heap<KrusElem, Comp> H(E, edgecnt);\n    int numMST = G->n();\n    // 初始 n 等价类\n\
  \    for (i=0; numMST>1; i++) { // 合并等价类\n        KrusElem temp;\n        temp =\
  \ H.removefirst(); // 获取最小边\n        int v = temp.from;\n        int u = temp.to;\n\
  \        if (A.differ(v, u)) { // 如果不同类\n            A.UNION(v, u); // 合并等价类\n \
  \           AddEdgetoMST(temp.from, temp.to); // 加入 MST\n            numMST--; //\
  \ 少一个 MST\n        }\n    }\n}\n```\n\n**图 11.25** Prim 算法的实现。\n\n11.6 延伸阅读\n\n\
