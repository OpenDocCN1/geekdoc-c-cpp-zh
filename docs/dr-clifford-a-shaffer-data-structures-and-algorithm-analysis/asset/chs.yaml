  \ probing），会发生什么。这种排列是否能解决主聚集问题？这对于在实现伪随机探测时选择排列说明了什么？\n\n## 项目\n\n9.1 实现第 9.1 节中的二分查找和二次二分查找。在很大范围的问题规模上运行你的实现，并对每个算法的结果进行计时计（耗时统计）。绘制图表并比较这些耗时结果。\n\
  \n9.2 实现三种自组织列表启发式算法：`count`（计数）、`move-to-front`（移至表头）和 `transpose`（交换）。比较在各种输入数据上运行这三种启发式算法的成本。成本指标应该是搜索列表时所需的总比较次数。使用对于自组织列表合理的输入数据（即分布不均匀的频率分布）来比较这些启发式算法是非常重要的。一种很好的方法是读取文本文件。列表应该存储文本文件中的单个单词。从空列表开始，就像\
