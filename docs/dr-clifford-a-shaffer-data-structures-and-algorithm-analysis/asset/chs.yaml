  \n13.12 使用基于规则分解的 `quadtree` 为一组（二维）矩形实现一种表示方法。假设所表示的空间是一个宽度和高度为 2 的幂方的正方形。假设矩形具有整数坐标以及整数宽度和高度。选取某个值\
  \ `c`，并使用分解规则：每当一个区域包含超过 `c` 个矩形时，将其划分为四个等大小的区域。如果这些矩形在当前区域内的某点相交，则发生特殊情况（因为分解此类节点永远无法终止）。在这种情况下，节点只需存储超过\
  \ `c` 个矩形的指针。在具有不同 `c` 值的矩形数据集测试你的表示方法。\n\n# 第五部分 算法理论\n\n## 14 算法技术\n\n通常，发明一个方程来模拟算法或数据结构的行为是非常的。如果方程包含递归或求和，通常也很容易推导出其闭式解。但有时分析证明更加困难。这可能需要巧妙的洞察才能导出正确的模型，例如分析由\
  \ `Replacement Selection`（第 8.5.2 节）产生的平均运行长度雪推论证。在这个例子中，一旦理解了雪推论证，得出的方程就顺理成章了。有时，建立模型是直接的，但分析产生的方程却并不容易。例如\
  \ `Quicksort` 的平均情况分析。第 7.5 节给出的方程简单地枚举了基值位置的所有可能情况，并对递归 `Quicksort` 的相应代价求和。然而，推导出结果的递归关系的闭式解并不那么容易。\n\
  \n许多迭代算法的分析使用求和来对循环代价建模。寻找求和闭式解的技术在第 14.1 节中给出。许多基于递归的算法代价最好用递归关系来建模。第 14.2 节提供了求解递归的技术讨论。这些章节建立在第\
  \ 2.4 节提供的求和和递归介绍的基础上，因此读者应该已经熟悉了这些材料。\n\n第 14.3 节提供了摊还分析（amortized analysis）主题的介绍。摊还分析处理一系列操作的代价。也许系列中的单次操作很高，但作为结果，后续操作的代价是有限的。摊还分析已成功用于分析之前节中的几个算法，包括\
  \ `UNION/FIND` 操作（第 6.2 节）、`Quicksort` 中的 `partition`（第 7.5 节）、伸展树系列的操作（第 13.2 节）以及自组织列表的操作（第\
  \ 9.2 节）。第 14.3 节将详细讨论该主题。\n\n### 14.1 求和技术\n\n考虑以下求和。在第 2.6.3 节中，通过归纳法证明该求和有著名的闭式解\
  \ n(n+1)/2。虽然归纳法是证明所提闭式表达式正确的良好技术，但我们最初如何找到一个候选闭式表达式呢？\n\n分析求和的一个良好起点是为给定的 `n` 给出一个估计值。观察该求和最大的项是\
  \ `n`，且有 `n` 项在相加。因此总和必须小于 `n2`。实际上，大多数项远小于 `n`，且项的大小是线性增长的。如果我们为项的大小画一张图，它们的高度将形成一条线，我们可以将其封装在一个宽为\
  \ `n`、高为 `n` 的框内。从这一点很容易看出，求和的更的估计值约为 (n2)/2。\n\n现在让我们考虑我们如何可能找到该求和闭式解的精确方程。一种特别巧妙的方法是观察到我们可以将第一项和最后一项、第二项和\
  \ (n − 1) 项“配对”。每对之和为 `n + 1`。对的数量为 `n/2`。\n\n\n\n因此，解是 `n(n + 1)/2`。这很漂亮，而且毫无疑问是正确的。但问题在于，它并不是解决许多其他求和问题的有效技巧。\n\
  \n现在让我们尝试一种更具通用性的方法。我们已经意识到，因为最大的项是 `n` 且有 `n` 项，所以求和小于 `n²`。如果我们足够好，这个闭式解是一个多项式。以此作为工作假设，我们可以调用一种名为\
  \ `guess-and-test`（猜测与测试）的技术。我们假设该求和的闭式解是一个形式为 `c1n² + c2n + c3` 的多项式，其中 `c1`、`c2`\
  \ 和 `c3` 是常数。如果如此，我们就可以代入求和的小情况的答案来求解系数。对于这个例子，将 `n` 替换为 0、1 和 2 会得到三个同时方程组。\n\n\
  由于 `n = 0` 时求和仅为 0，所以 `c3` 必须为 0。对于 `n = 1` 和 `n = 2`，我们得到两个方程：\n\n```\nc1 + c2\
  \ = 1\n4c1 + 2c2 = 3\n```\n\n继而得出 `c1 = 1/2` 和 `c2 = 1/2`。因此，如果求和的闭式解是一个多项式，它只能是：\n\
  \n`1/2n² + 1/2n + 0`\n\n更常见的写法是：\n\n`n(n + 1) / 2`。\n\n到此时，我们仍然必须执行 `guess-and-test`\
  \ 方法中的“测试”部分。我们可以使用归纳证明来验证我们的候选闭式解是否正确。在这种情况下，它确实是正确的，如示例 2.11 所示。归纳证明是必要的，因为我们最初对解是简单多项式的假设可能是错误的。例如，真实的解可能可能包含一个对数项，如\
  \ `c1n² + c2n log n`。这里展示的过程本质上是为固定数量的点拟合一条曲线。因为总存在一个拟合 `n + 1` 个点的 `n` 次多项式，所以如果不使用归纳法，我们所做的工作还不足以确定真实的方程。\n\
  \n当解是一个多项式表达式时，`guess-and-test` 总是有用的。特别地，可以使用类似的推理来求解 `Pn i²`，或者更通用地求解对于任何正整数 `c`\
  \ 的 `sum_{i=1}^Pn i^c`。为什么这不是一个解决 `sum_{i=1}` 求和的通用方法？因为许多求和的闭式解并不是多项式。\n\n一种更通用的方法是基于\
  \ `subtract-and-guess`（减法与猜测）或 `divide-and-guess`（除法与猜测）策略。`subtract-and-guess`\
  \ 的一种形式被称为 `shifting method`（移位法）。\n\n`shifting method` 从求和的变体中减去该求和。选择用于减法的变体应该是让大多数项抵消的。为了求解\
  \ `sum f`，我们选取一个已知函数 `g`，并在 `f(n) - g(n)` 或 `f(n)/g(n)` 中寻找模式。\n\n**示例 14.1** 使用\
  \ `divide-and-guess` 方法找到 `sum_{i=1}^Pn i` 的闭式解。我们将尝试两个示例函数来说明 `divide-and-guess`\
  \ 方法：除以 `n` 和除以 `f(n - 1)`。我们的目标是找到可以利用的模式来猜测一个闭式表达式，作为我们用归纳法测试的候选方案。为了帮助我们寻找此类模式，我们可以构建一个表格，显示每个函数的前几个数字以及一个除以另一个的结果，如下所示。\n\
