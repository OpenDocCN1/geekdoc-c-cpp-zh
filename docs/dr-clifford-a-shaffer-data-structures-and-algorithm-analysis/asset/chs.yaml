  \ 6.5 节。\n\n6\n\n**非二叉树**\n\n\n\n\n许多组织在本质上是层次化的，例如军队和大多数企业。考虑一家拥有总裁和若干位向总裁汇报的副总裁的公司。每位副总裁都有若干个直接下属，以此此类推。如果我们想用数据结构来模拟这家公司，自然的想法是将总裁放在树的根节点，将副总裁放在第\
  \ 1 层，而随着组织架构的向下延伸，将他们的下属放在树的更低层次。\n\n由于副总裁的数量可能超过两个，这家公司的组织无法简单地用二叉树来表示。相反，我们需要使用一种节点具有任意数量子节点的树。遗憾的是，当我们允许树具有任意数量子节点的节点时，它们的实现比二叉树困难得多。在本章我们将考虑这类树。为了将它们与二叉树区分开，我们使用“一般树”（general\
  \ tree）这一术语。\n\n第 6.1 节介绍了一般树的术语。第 6.2 节介绍了解决处理等价类这一问题的简单表示方法。\n\n第 6.3 节涵盖了基于指针的通用通用树实现。\n\
  \n除了一般树和二叉树外，还有一种内部节点具有固定数量 K 个子节点的树，其中 K 不等于 2。这种树被称为 K 叉树（K-ary trees）。第 6.4 节将二叉树的属性推广到\
  \ K 叉树。第 6.5 节涵盖了顺序表示法，这适用于将树存储在磁盘上等应用。\n\n# 6.1 一般树的定义与术语\n\n树 `T` 是一个或多个节点组成的有限集合，其中有一个指定的节点\
  \ `R`，称为 `T` 的根。如果集合 `(T - {R})` 不空，则这些节点被划分为 `n > 0` 个不相交子集 `T0, T1, ..., Tn−1`，每个子集都是一棵树，并且它们的根\
  \ `R1, R2, ..., Rn` 分别是 `R` 的孩子。子集 `Ti`（`0 ≤ i < n`）称为 `T` 的子树。这些子树是有序的，如果 `i <\
  \ j`，则称 `Ti` 在 `Tj` 之前。按照惯例，子树从左到右排列，子树 `T0` 称为 `R` 的最左孩子。节点的出度是该节点的节点数。森林是一棵或多棵树的集合。图\
  \ 6.1 展示了从第 5 节的二叉树表示法推广出来的树表示法。\n\n树中的每个节点仅有一个父节点，根节点没有父节点。根据这一观察，可以立即推导出，具有 `n`\
  \ 个节点的树必须有 `n − 1` 条边，因为除了根节点外，每个节点都有一条边将该节点与其父节点连接。\n\n**图 6.1** 一般树的表示法。节点 `P`\
  \ 是节点 `V`、`S1` 和 `S2` 的父节点。因此，`V`、`S1` 和 `S2` 是 `P` 的孩子。节点 `R` 和 `P` 是 `V` 的祖先。节点\
  \ `V`、`S1` 和 `S2` 称为兄弟。椭圆围绕着 `V` 为根的子树。\n\n## 6.1.1 一般树节点的 ADT\n\n在讨论一般树的实现之前，我们应该首先明确此类实现必须支持的操作。任何实现都能够初始化一棵树。给定一个树，我们需要访问该树的根。必须有某种方法访问节点的节点。在二叉树节点的\
  \ ADT 中，这是通过提供成员函数来显式访问左孩子和右孩子指针来实现的。遗憾的是，由于我们预先不知道一般树中的给定节点会有多少个孩子，因此无法提供显式函数来访问每个孩子。必须找到一种适用于未知数量数量的替代方案。\n\
  \n```cpp\n// General tree node ADT\ntemplate <typename E> class GTNode {\npublic:\n\
  \    E value();\n    // 返回节点的值\n    bool isLeaf();\n    // 如果节点是叶子节点则为真\n    GTNode*\
  \ parent();\n    // 返回父节点\n    GTNode* leftmostChild();\n    // 返回第一个孩子\n    GTNode*\
  \ rightSibling();\n    // 返回右兄弟\n    void setValue(E&);\n    // 设置节点的值\n    void\
  \ insertFirst(GTNode<E>*); // 插入第一个孩子\n    void insertNext(GTNode<E>*); // 插入下一个兄弟\n\
  \    void removeFirst(); // 删除第一个孩子\n    void removeNext(); // 删除右兄弟\n};\n\n// General\
  \ tree ADT\ntemplate <typename E> class GenTree {\npublic:\n    void clear();\n\
  \    // 将所有节点释放到存储区\n    GTNode<E>* root();\n    // 返回树的根\n    // 合并两个子树\n    void\
  \ newroot(E&, GTNode<E>*, GTNode<E>*);\n    void print();\n    // 打印树\n};\n```\n\
  \n**图 6.2** 一般树和一般树节点的定义。\n\n一种选择是提供一个以所需孩子的索引作为参数的函数。这结合一个返回给定节点孩子数量的函数，将支持访问任何节点。遗憾的是，这种观点倾向于在节点实现的选择上偏向基于数组的方法。在实践中，通常倾向于基于链表的实现。\n\
  \n另一种替代方案是提供对节点第一个（或最左）孩子的访问，并提供对节点下一个（或右）兄弟的访问。图 6.2 显示了一般树及其节点的类声明。基于这两个访问函数，节点的节点可以像列表一样遍历。尝试寻找右兄弟将返回\
  \ `NULL`。\n\n## 6.1.2 一般树的遍历\n\n在第 5.2 节中，为二叉树介绍了三种树遍历：前序、后序和中序。对于一般树，前序和后序遍历的定义与其二叉树对应类似。一般树的前序遍历首先访问树的根，然后从左到右对每个子树进行前序遍历。一般树的后序遍历从左到右对根的子树进行后序遍历，然后访问根。中序遍历对于一般树没有自然的定义，因为内部节点没有特定的数量。可以发明一种任意定义——例如中序遍历最左子树，然后访问根，再中序遍历剩余的子树。然而，中序遍历对于一般树通常不可用。\n\
  \n**图 6.3** 一般树示例。\n\n**示例 6.1** 图 6.3 中树的前序遍历访问节点的顺序为 `RACDEBF`。\n该树的后序遍历访问节点的顺序为\
  \ `CDEAFBR`。\n\n要执行前序遍历，必须从左到右访问给定节点（例如 R）的每个孩子。这是通过从 R 的最左孩子（称为 T）开始实现的。从 T 开始，我们可以移动到\
  \ T 的右兄弟，然后移动到该节点的右兄弟，以此此类推。\n\n使用图 6.2 中的 ADT，这里有一个用前序遍历打印一般树节点的 C++ 实现。注意结尾的 `for`\
  \ 循环，它通过从最左孩子开始，反复移动到下一个孩子直到调用 `next` 返回 `NULL` 来处理孩子列表。\n\n```cpp\n// 使用前序遍历打印\n\
  void printhelp(GTNode<E>* root) {\n    if (root->isLeaf()) cout << \"Leaf: \";\n\
  \    else cout << \"Internal: \";\n\n    cout << root->value() << \"\\n\";\n\n \
  \   // 现在处理根节点的孩子\n    for (GTNode<E>* temp = root->leftmostChild(); temp != NULL;\
  \ temp = temp->rightSibling()) {\n        printhelp(temp);\n    }\n}\n```\n\n\n\n\
  \n\n# 6.2 父节点指针实现\n\n最简单的通用树实现方式可能是为每个节点仅存储一个指向该节点父节点的指针。我们将其称为父节点指针实现。\n\n显然，这种实现并不是通用的，因为它对于寻找最左侧子节点或节点的右侧兄弟等重要操作来说是不够的。因此，以这种方式实现通用树似乎是一个很糟糕的主意。然而，父节点指针实现恰恰存储了回答以下有用问题所需的信息：“给定两个节点，它们在同一棵树中吗？”为了回答这个问题，我们只需要从每个节点沿着一系列父指针追踪到各自的根节点。如果两个节点都到达同一个根节点，那么它们一定在同一棵树中。如果根节点不同，则这两个节点不在同一棵树中。我们将查找给定节点最终根节点的过程称为\
  \ `FIND`。\n\n父节点表示通常用于维护一个不交集集合（disjoint sets）。两个不交集集合之间没有共同的成员（它们的交集为空）。不交集集合将某些对象进行划分，使得每个对象恰好属于不交集集合中的一个。我们希望支持两个基本操作：\n\
  \n1. 判断两个对象是否在同一个集合中，以及\n2. 将两个集合合并。\n\n由于两个合并后的集合是统一的整体，因此合并操作被称为 `UNION`，而判断两个对象是否在同一个集合中并合并集合的整个被称为“UNION/FIND”。\n\
  \n为了实现 `UNION/FIND`，我们用一个独立的通用树来表示每个不交集。如果两个对象在同一棵树中，则它们在同一个不交集里。\n\n树的每个节点（根节点除外）恰好有一个父节点。因此，每个节点表示自己所需的空间是相同的。对象集合通常存储在数组中，数组的每个元素对应一个对象，每个元素存储该对象的值。对象也对应于各个不交树中的节点（每个不交集对应一棵树），因此我们也在数组的每个对象中存储了其父节点的值。作为各自树的根节点的节点存储着相应的指示器。注意，这种表示法意味着使用单个数组来实现树的集合。这使得通过\
  \ `UNION` 操作合并树变得简单。\n\n图 6.4 显示了使用父节点指针的通用树实现，称为 `ParPtrTree`。该类相比图 6.2 中的声明被大大简化，因为我们只需要通用树操作的一个子。`ParPtrTree`\
  \ 没有实现单独的节点类，而是简单地存储一个数组，数组的每个元素对应树的一个节点。数组的每个位置 `i` 存储节点 `i` 的值以及节点 `i` 的父节点的数组位置。`ParPtrTree`\
  \ 类提供了两个新方法：`differ` 和 `UNION`。`differ` 方法检查两个对象是否在不同的集合中，而 `UNION` 方法将两个集合合并。私有方法\
  \ `FIND` 用于查找对象的最终根节点。\n\n```cpp\n// 用于 UNION/FIND 的通用树表示\nclass ParPtrTree {\n\
  private:\n    int* array;\n    // 节点数组\n    int size;\n    // 节点数组的大小\n    int FIND(int)\
  \ const;\n    // 查找根\npublic:\n    ParPtrTree(int);\n    // 构造函数\n    ~ParPtrTree()\
  \ { delete [] array; } // 析构函数\n    void UNION(int, int);\n    // 合并等价关系\n    bool\
  \ differ(int, int);\n    // 如果不在同一树中则返回真\n};\n\nint ParPtrTree::FIND(int curr) const\
  \ { // 查找根\n    while (array[curr] != ROOT) curr = array[curr];\n    return curr;\
  \ // 在根节点\n}\n```\n图 6.4 使用父节点指针实现 `UNION/FIND` 算法的通用树。\n\n使用 `UNION/FIND` 操作的应用应该存储一个包含\
  \ $n$ 个对象的集合，其中每个对象被分配一个 0 到 $n-1$ 范围内的唯一索引。索引指向数组中对应的父节点指针。`ParPtrTree` 类创建并初始化\
  \ `UNION/FIND` 数组，`differ` 和 `UNION` 方法接受数组索引作为输入。\n\n图 6.5 展示了父节点指针实现。注意，节点可以在数组中的任何顺序出现，且数组可以存储最多\
  \ $n$ 棵独立的树。例如，图 6.5 显示了存储在同一个数组中的两棵树。因此，单个数组可以存储分布在任意（且不断变化的）数量不交集中的项目集合。\n\n考虑将集合的成员分配到称为等价类（equivalence\
  \ classes）的不交子集的问题。回顾 2.1 节，等价关系具有自反性、对称性和传递性。因此，如果对象 A 和 B 等价，且对象 B 和 C 等价，我们必须能够识别出对象\
  \ A 和 C 也是等价的。\n\n不交集和等价表示有许多实际用途。例如，考虑图 6.6，它显示了一个标记为 A 到 J 的十个节点的图。注意，对于节点 A 到\
  \ I，存在一系列边连接了任意对节点，但节点 J 与其余节点是开的。这样的图可以用于表示电路板上组件之间的连接（如导线）或城市之间的道路。如果图中两个节点之间存在路径，我们可以认为图中这两个节点是等价的。因此，图中等价（连通）的边的子集被称为连通分量（connected\
  \ component）。`UNION/FIND` 的另一个应用出现在用于计算图最小生成树的 Kruskal 算法中（第 11.5.2 节）。\n\n`UNION/FIND`\
  \ 算法的输入通常是等价对。在连通分量的示例中，等价对将是图中边的集合。一个等价对可能表示对象 C 与对象 A 等价。如果是这样，C 和 A 将被放在同一个子集中。如果稍后的等价关系涉及\
  \ A 和 B，那么根据推论，C 也与 B 等价。\n\n可以使用 `UNION/FIND` 算法高效地管理等价类。初始时，每个对象都是自己树的根节点。处理等价对时，通过\
  \ `differ` 方法检查对中的两个对象是否在同一树中。如果它们在同一棵树中，则不需要任何更改，因为对象已经在同一个等价类中了。否则，应通过 `UNION`\
  \ 方法合并这两个等价类。\n\n\n\n\n\n**示例 6.2** 作为解决等价类问题的示例，考虑图 6.6 中的图。初始情况下，我们假设图中的每个节点都在不同的等价类中。这通过将每个节点存储为其自身树的根来表示。图\
  \ 6.7(a) 使用父指针数组表示了这种初始配置。现在，考虑当处理等价关系 `(A, B)` 时发生了什么。包含 `A` 的树的根是 `A`，包含 `B` 的树的根是\
  \ `B`。为了让它们等价，将这两个根中的一个设置为另一个的父。在这种情况下，哪个点指向哪个并不重要，因此我们随机选择字母顺序上的第一个作为根。这在父指针数组中通过将\
  \ `B`（数组中位置为 1 的节点）的 `parent` 字段设置为存储指向 `A` 的指针来实现。等价对 `(C, H)`、`(G, F)` 和 `(D,\
  \ E)` 以类似的方式进行处理。当处理等价对 `(I, F)` 时，由于 `I` 和 `F` 都是它们自己的根，因此 `I` 设置为指向 `F`。\n\n注意，这也使得\
  \ `G` 等价于 `I`。处理这五个等价关系的结果如图 6.7(b) 所示。\n\n父指针表示法对共享父节点的节点数量没有限制。为了使等价处理尽可能高效，每个节点到其树根的距离应该越小越好。因此，在合并两个等价类时，我们希望保持树的高度尽可能小。理想情况下，每棵树的所有节点都直接指向根。要一直实现这一目标需要过多的额外处理，不划算，因此我们必须满足于尽可能接近。\n\
  \n减少高度的一种低成本方法是明智地连接两棵树。一种称为“加权合并规则”（weighted union rule）的简单技术通过让较小树的根指向较大树的根，将节点较少的树连接到节点较多的树上。这将树的总深度限制在\
  \ `O(log n)`，因为现在只有较小树中的节点深度只会增加一个，而合并后树中最深节点的深度最多比合并前最深节点深一层。因此，合并后树的节点总数至少是较小子树节点数的两倍。因此，当处理\
  \ `n` 个等价关系时，任何节点的深度最多增加 `log n` 次。\n\n**示例 6.3** 在处理图 6.7(b) 中的等价对 `(I, F)` 时，`F`\
  \ 是一个包含两个节点的树的根，而 `I` 是一个仅包含一个节点的树的根。因此，将 `I` 设置为指向 `F`，而不是相反。\n\n图 6.7(c) 显示了处理另外两个等价对：`(H,\
  \ A)` 和 `(E, G)` 的结果。对于第一对，`H` 的根是 `C`，而 `A` 的根是自身。由于两棵树都包含两个节点，因此决定哪个节点被设置为合并树的根是随机的。在等价对\
  \ `(E, G)` 的情况下，`E` 的根是 `D`，而 `G` 的根是 `F`。\n\n由于 `F` 是较大树的根，节点 `D` 设置为指向 `F`。\n\n\
  并不是所有的等价关系都会合并两棵树。如果当表示法处于图 6.7(c) 所示的状态时处理等价关系 `(F, G)`，则不会发生任何更改，因为 `F` 已经是 `G`\
  \ 的根了。\n\n**图 6.7** 等价处理的示例。(a) 图 6.6 中十个节点的初始配置。节点被分到十个独立的等价类中。(b) 处理五条边后：`(A,\
  \ B)`、`(C, H)`、`(G, F)`、`(D, E)` 和 `(I, F)` 的结果。(c) 处理另外两条边后：`(H, A)` 和 `(E, G)`\
  \ 的结果。\n\n(d) 处理处理边 `(H, E)` 的结果。\n\n加权合并规则有助于最小化树的深度，但我们可以做得更好。路径压缩（Path compression）是一种倾向于创建极浅树的方法。路径压缩发生在查找节点根的过程中。这个版本的\
  \ `FIND` 不仅返回当前节点的根，还让当前节点的所有祖先都指向该根。这可以通过以下方式实现。\n\n```cpp\n// 带有路径压缩的 FIND\nint\
  \ ParPtrTree::FIND(int curr) const {\n    if (array[curr] == curr) // 在根处返回 curr;\n\
  \    array[curr] = FIND(array[curr]);\n    return array[curr];\n}\n```\n\n**示例 6.4**\
  \ 图 6.8 阐了相同等价对的路径压缩过程。这意味着在 6.7(c) 所示的表示中，节点 A 指向 F。注意，路径压缩发生在 `FIND` 操作期间，而不是\
  \ `UNION` 操作期间。在 6.8 中，这意味着节点 B、C 和 H 保持节点 A 为它们的父节点，而不是将它们的父节点改为 F。路径压缩使得每次 `FIND`\
  \ 操作的代价非常接近常数。\n\n为了更准确地说明“非常接近常数”的含义，在 n 个节点上进行 n 次 `FIND` 操作的路径压缩代价（当结合用于连接集合的加权合并规则时）大约为\
  \ `Θ(n log* n)`。`log* n` 符号表示在 `n ≤ 1` 之前必须对 `n` 取对数的次数。例如，log* 65536 是 4，因为 log\
  \ 65536 = 16，log 16 = 4，log 4 = 2，最后 log 2 = 1。因此，log* n 增长非常缓慢，所以一系列次 操作的代价非常接近\
  \ n。\n\n注意，这并不意味着处理 n 个等价对后得到的树深度一定是 `Θ(log* n)`。人们可以设计一系列等价操作，使得生成的树的深度为 `Θ(log\
  \ n)`。然而，此类系列中的许多等价操作将只查看被合并树的根，所需的处理时间很少。这是摊还分析（amortized analysis）的一个示例，将在第 14.3\
  \ 节中进一步讨论。\n\n\n\n\n\n每种实现在存储节点所需的空间大小以及执行关键操作的相对易用性各有优劣。通用树的实现不应对节点可以拥有的子数量设置任何限制。更准确地说，已发现这种成本随时间的增长与阿克函数的反函数成正比。请参见第\
  \ 6.6 节。\n\n### 6.3.1 子节点列表\n我们创建通用树实现的首次尝试被称为通用树的“子节点列表”实现。它简单地在每个内部节点中存储一个子节点的链表。如图\
  \ 6.9 所示。\n\n“子节点列表”实现将树节点存储在数组中。每个节点包含一个值、一个指向父节点的指针（或索引）以及一个指向子链表的指针，按左到右的顺序存储。每个链表元素包含指向一个子节点的指针。因此，可以找到节点的最左侧孩子，因为它是链表的第一个元素。然而，要找到节点的右兄弟则要困难得多。考虑节点\
  \ `M` 及其父节点 `P` 的情况。\n\n为了找到 `M` 的右兄弟，我们必须向下移动 `P` 的子列表，直到找到存储指向 `M` 指针的链表元素。再向移动一步，即可到达存储指向\
  \ `M` 右兄弟指针的链表元素。因此，在坏的情况下，找到 `M` 的右兄弟需要搜索 `P` 的所有孩子。\n\n图 6.9：通用树的“子节点列表”实现。节点数组左侧的数字列标记数组索引。标记为“Val”的列存储节点值。标记为“Par”的列存储指向父节点的索引（或指针）。最后一列存储每个内部节点指向子链表的指针。链表的每个元素存储一个指向一个子节点的指针。\n\
  \n### 6.3.2 左孩子/右兄弟实现\n使用“子节点列表”实现，访问节点的右兄弟是困难的。图 6.10 展示了一种改进。在这里，每个节点都存储其值以及指向其父节点、最左侧孩子和右兄弟的指针。因此，每个基本的\
  \ ADT 操作都可以通过直接从节点中读取值来实现。\n\n如果两棵树存储在同一个节点数组中，那么将其中一棵作为另一个的子树只需设置三个指针。以这种方式合并树如图\
  \ 6.11 所示。这种实现比“子节点列表”实现更节省空间，且每个节点在节点数组中需要固定长度的空间。\n\n图 6.10：“左孩子/右兄弟”实现。如果每棵树都存储在单独的节点数组中，使用这种表示法合并树是困难的。如果两棵树的节点都存储在单个节点数组中，将树\
  \ `T` 添加为节点 `R` 的子树只需将 `T` 的根添加到 `R` 的子列表中即可。\n\n### 6.3.3 动态节点实现\n上述两种通用树实现都使用数组来存储节点集合。相比之下，我们二叉树的标准实现是将每个节点存储为独立的动态对象，其中包含其值和指向两个孩子的指针。遗憾的是，通用树节点可以拥有任意数量的孩子，而且这个数量在节点的生命周期内可能会发生。通用树节点实现必须支持这些属性。\n\
  \n一种解决方案是简单限制任何节点允许的孩子数量，并为该数量的孩子分配指针。这有两个主要的反对意见。第一，它对孩子数量设置了不理想的限制，导致某些树无法通过这种实现表示。其次，这可能会极其浪费空间，因为大多数节点的节点要少得多，从而留下了一些空的指针位置。\n\
  \n另一种方案是为每个节点分配可变空间。有两种基本方法。一种是作为节点的一部分分配一个子指针数组。本质上，每个节点存储一个基于数组的子指针列表。图 6.12 展示了这一概念。这种方法假设在节点创建时已知孩子的数量，这对于某些应用是成立的，但对其他应用则不然。如果孩子的数量不发生，它的效果最好。如果孩子的数量发生变化（特别是增加时），则必须提供某种特殊的恢复机制来支持子指针数组大小的变化。\n\
  \n一种可能性是从空闲存储中分配一个正确大小的新节点，并将旧节点的拷贝返回空闲存储以备后重用。这在像 `Java` 这样内置垃圾回收的语言中效果非常好。例如，假设节点\
  \ `M` 初始有两个孩子，在创建 `M` 时分配了两个子指针的空间。如果给 `M` 添加了第三个孩子，可以分配一个带有三个子指针的新节点空间，将 `M` 的内容复制到新空间，然后将旧空间返回空闲存储。作为依赖系统垃圾收集器的替代方案，可以实现一个用于变长单元的内存管理器，如第\
  \ 12.3 节所述。另一种可能性是使用一组空闲列表，每个数组大小一个，如第 4.1.2 节所述。\n\n图 6.12：使用固定大小数组作为子指针的动态通用树表示。(a)通用树。(b)树的表示。对于每个节点，第一个字段存储节点值，而第二个字段存储子数组的大小。\n\
  \n图 6.11：合并使用“左孩子/右兄弟”实现的两棵树。图 6.10 中以 `R` 为根的子树现在成为 `R0` 的第一个孩子。节点数组中调整了三个指针：`R0`\
  \ 的左孩子字段现在指向节点 `R`，而 `R` 的右兄弟字段指向节点 `X`。节点 `R` 的父节点字段指向节点 `R0`。\n\n\n\n\n每个节点都存储指向其左孩子和右兄弟的指针。为了便于转换，假设树的根节点彼此相邻。\n\
  \n### 6.3.4 动态“左孩子/右兄弟”实现\n\n第 6.3.2 节中的“左孩子/右兄弟”实现在每个节点中存储固定数量的指针。这可以很容易地转换为动态实现。从本质上说，我们用二叉树代替广义树。“左孩子/右兄弟”实现中的每个节点指向新二叉树结构中的两个“孩子”。\n\
  \n该新结构的左孩子是该节点在广义树中的第一个孩子。右孩子是该节点的右兄弟。我们可以轻松将这种转换扩展到广义树森林，因为树的根可以被视为兄弟。图 6.14 展示了从广义树森林转换为单个二叉树的过程。在这里我们只需包含每个节点到其右兄弟的链接，并删除除最左侧孩子以外到所有节点的链接。图\
  \ 6.15 显示了在每个节点有两个指针的实现中这可能是怎样的。\n\n与图 6.13 所示的需要三个指针/节点开销的实现相比，图 6.15 的实现每个节点仅需要两个指针。\
  \ 6.15 的表示可能比本节中提出的其他实现更容易实现、更节省空间，且更灵活。\n\n## 6.4 K 叉树\n\nK 叉树是指其所有内部节点都具有恰好 `K`\
  \ 个孩子的树。因此，满二叉树是一种 2 叉树。第 13.3 节讨论的 PR 四叉树是 4 叉树的一个例子。由于 K 叉树节点具有固定数量的孩子，与广义树不同，它们相对容易实现。通常，K\
  \ 叉树与二叉树有许多相似之处，可以使用类似的实现用于 K 叉树节点。请注意，随着 `K` 变大，潜在的 `NULL` 指针数量会增加，内部节点和叶子节点所需尺寸之间的差异也会增大。因此，随着\
  \ `K` 的增大，为内部节点和叶子节点选择单独实现变得更加迫切。\n\n**图 6.15** 将广义树转换为动态“左孩子/右兄弟”表示。与图 6.13 的表示相比，这种表示所需的空间更少。\n\
  \n**图 6.16** 满且完全的 3 叉树。(a) 这棵树是满的（但不完全的）。(b) 这棵树是完全的（但不满的）。\n\n满和完全 K 叉树分别类似于满完全完全二叉树。图\
  \ 6.16 显示了 `K = 3` 的满和完全 K 叉树。在实践中，大多数 K 叉树的应用都将其限制为满的或完全的。\n\n二叉树的许多属性都可以扩展到 K\
  \ 叉树。可以推导出与第 5.1.1 节关于 K 叉树中 `NULL` 指针数量以及 K 叉树中叶子节点数与内部节点数之间关系的等效定理。我们还可以使用数组存储完全\
  \ K 叉树，并使用简单的公式以类似于第 5.3.3 节中使用的方法来计算节点的关系。\n\n### 6.5 顺序树实现\n\n接下来我们考虑一种从根本上不同的实现树的方法。其目标是存储一系列节点值，并带有重建树结构所需的最少信息。这种方法被称为顺序树实现，它的优点是节省空间，因为没有存储指针。它的缺点是访问树中的任何节点都需要顺序处理节点列表中出现在该节点之前的所有节点。换句话说，节点访问必须从节点列表的开始开始，按照它们存储时的任何顺序顺序处理节点，直到到达目标节点。因此，本节中讨论的其他实现中失去了一个首要优点：对树中任意节点的高效访问（通常时间复杂度为\
  \ `\\Theta(\\log n)`）。顺序树实现非常适合将树归档在磁盘上以备后以后使用，因为它们节省了空间，并且可以根据后继处理的需要重建树结构。\n\n\
  顺序树实现可以用于树树的序列化。序列化是将对象存储为一系列字节的过程，通常是为了使数据结构能够在计算机之间进行传输。当在分布式处理环境中使用数据结构时，这种能力至关重要。\n\
  \n顺序树实现通常按照先序遍历枚举的顺序存储节点值，以及描述树形状的足够信息。如果树具有限制的形状（例如如果它是一棵满二叉树），则通常需要存储较少的结构信息。广义树由于其形状最灵活，往往需要最多的额外形状信息。有很多可能的顺序树实现方案。我们将从描述适用于二叉树的方法开始，然后推广到适用于广义树结构的实现。\n\
  \n由于二叉树的每个节点要么是叶子节点，要么有两个（可能为空）孩子，我们可以利用这一事实隐式地表示树的结构。最直接的顺序树实现是按照先序遍历枚举的方式列出每个节点值。遗憾的是，仅有节点值并不能提供足够的恢复树形状的信息。特别是，当我们读取系列节点值时，我们不知道何时到达了叶子节点。然而，我们可以将所有非空节点视为具有两个（可能为空）孩子的内部节点。只有\
  \ `NULL` 值会被解释为叶子节点，且这些值可以显式地列出。这种增强的节点列表提供了足够的信息来重建树结构。\n\n**示例 6.5** 对于图 6.17\
  \ 中的二叉树，相应的顺序表示如下所示（假设 `/` 代表 `NULL`）：\n\n```\nAB/D//CEG///FH//I//\n```\n\n要从此节点列表重建树结构，我们首先将节点\
  \ A 设置为根。A 的左孩子将是节点 B。B 的左孩子是一个 `NULL` 指针，因此节点 D 必须是 B 的右孩子。D 有两个 `NULL` 孩子，因此节点\
  \ C 必须是 A 的右孩子。\n\n**图 6.17** 用于顺序树实现示例的二叉树。\n\n为了说明使用顺序树表示进行处理的困难性，考虑搜索根节点的右孩子。我们必须首先顺序通过左子树的节点列表。只有在这里我们到达到达根右孩子的值。显然，顺序表示在空间上是高效的，但在沿任意路径向下遍历树时时间上并不是高效的。\n\
  \n\n\n假设每个节点值占据恒定的空间。例如，如果节点值是一个正整数，并用值零表示 `NULL`。根据第 5.1.1 节的满二叉树定理，我们知道节点列表的大小将是节点数量的两倍左右（即开销比例为\
  \ 1/2）。额外的空间是由 `NULL` 指针所需的。我们本能够以更紧凑的方式存储节点列表。\n\n然而，任何顺序实现都必须识别何时到达叶子节点，也就是说，叶子节点表示一个子树的结束。实现此点的方法之一是用每个节点显式列出它是内部节点还是叶子节点。如果节点\
  \ `X` 是内部节点，那么我们知道它的两个孩子（可能是子树）在节点列表中紧跟在 `X` 之后。如果 `X` 是叶子节点，那么列表中的下一个节点是 `X` 的某个祖先的右孩子，而不是\
  \ `X` 的右孩子。特别，下一个节点将是 `X` 最近的一个尚未遇到其右孩子的祖先的节点。\n\n然而，这假设每个内部节点确实有两个孩子，换句话说，这棵树是满的。空孩子必须在节点列表中显式表示。假设内部节点用撇号（0）标记，而叶子节点不显示任何标记。\n\
  \n内部节点的空孩子用 ‘/’ 表示，但叶子节点的（空）孩子完全不被表示。注意，这种实现下，满二叉树不存储 `NULL` 值，因此所需的开销更少。\n\n**示例\
  \ 6.6** 我们可以将图 6.17 中的树表示如下：`A0B0/DC0E0G/F0HI` (6.2)\n\n注意，空孩子处需要斜杠，因为这不是一棵满二叉树。存储\
  \ `n` 个额外位与存储 `n` 个 `NULL` 值相比可以节省大量空间。\n\n在示例 6.6 中，如果节点是内部节点，则显示标记；如果是叶子节点，则不显示标记。这要求每个节点值都有空间来存储标记位。如果例如，节点值被存储为\
  \ 4 字节整数，但存储值的范围足够小，以至于没有所有位都被使用，那么可能是可能的。例如，如果所有节点值必须是正整数，那么整数值的高位（符号位）就可以用作标记位。\n\
  \n另一种方法是存储一个单独位向量来表示每个节点的状态。在这种情况下，树的每个节点对应位向量中的一个位。值 ‘1’可以表示内部节点，‘0’可以表示叶子节点。\n\
  \n**示例 6.7** 图 6.17 树的位向量（包括节点 B 和 E 的空孩子的位置）将是 `11001100100` (6.3)\n\n通过顺序实现存储通用树，需要在节点列表中包含更显式的结构信息。通用树的实现不仅必须指示节点是叶子节点还是内部节点，还必须指示该节点有多少个孩子。或者，实现上可以指示节点的节点列表何时结束。\n\
  \n下一个示例舍弃了内部节点或叶子节点的标记。相反，它包含一个特殊标记（我们将使用 ”)” 符号）来指示孩子列表的结束。所有叶子节点后面都紧跟一个 ”)”符号，因为它们没有孩子。如果一个叶子节点也是其父节点的最后一个孩子，则通过两个或多个连续的\
  \ ”)”符号来表示这一点。\n\n**示例 6.8** 对于图 6.3 中的通用树，我们得到顺序表示：`RAC)D)E))BF)))` (6.4)\n\n注意\
  \ `F` 后面跟着三个 ”)”标记，因为它是一个叶子节点，是 B 最右子树的最后一个节点，也是 R 最右子树的最后一个节点。\n\n注意，这种用于通用树序列化的表示不能用于二叉树。这是因为二叉树不仅仅是最多两个孩子的通用树的限制形式。每个二叉树节点都有左和右孩子，尽管其中或两者可能为空。例如，示例\
  \ 6.8 的表示无法让我们区分图 6.17 中的节点 `D` 是节点 `B` 的左孩子还是右孩子。\n\n## 6.6 延伸阅读\n\n第 6.2 节引用的表达式\
