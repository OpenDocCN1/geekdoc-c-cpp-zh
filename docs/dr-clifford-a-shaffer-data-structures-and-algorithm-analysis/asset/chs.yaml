  ### 3.14 项目\n\n3.1 假设你试图存储 32 个布尔值，并且必须频繁访问它们。比较交替存储为单个位、字符、短整型或长整型的布尔值访问所需的时间。在编写程序时有两点需要注意。首先，确保你的程序尽可能花时间在变量访问上，而不是调用函数或增加计数器。其次，确保对四种方法进行足够的测量（通常为毫秒）。\n\
