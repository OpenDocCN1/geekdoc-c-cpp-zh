  \ `i` 值迭代后的数组。每列线上方的数字已经排过序，并处于它们的最终位置。\n\n### 7.2.3 选择排序\n\n再次考虑对过去一年的电话账单进行排序的问题。另一种直观的方法可能是查看这堆账单直到找到一月份的账单并将其取出。然后查看剩余的账单直到找到二月份的账单，并将其放在一月份之后。在不断缩小的账单堆中进行，按顺序选择下一个，直到完成。这就是我们最后一个\
  \ $\\Theta(n²)$ 排序算法的灵感，称为选择排序。选择排序的第 $i$ 次通过会“选择”数组中第 $i$ 小的键值，并将该记录放在位置 $i$。换句话说，选择排序首先在未排序的列表中找到最小的键值，然后是第二小的，依此类推。它的独特之处是记录交换很少。要找到下一个最小键值需要搜索数组的整个未排序部分，但只需要一次交换即可将记录就位。因此，所需的总交换次数将是\
  \ $n - 1$（我们“免费”得到了最后一条记录的就位）。\n\n图 7.3 展示了选择排序。下面是一个 C++ 的实现。\n\n```cpp\ntemplate\
  \ <typename E, typename Comp>\nvoid selsort(E A[], int n) { // 选择排序\n    for (int\
  \ i=0; i<n-1; i++) {\n        // 选择第 i 个记录\n        int lowindex = i;\n        //\
  \ 记住它的索引\n        for (int j=n-1; j>i; j--) {\n            // 找到最小值\n          \
  \  if (Comp::prior(A[j], A[lowindex]))\n                lowindex = j;\n        }\n\
  \        // 将其就位\n        swap(A, i, lowindex);\n    }\n}\n```\n\n选择排序（如此处所示）本质上是一种冒泡排序，不同在于它不是重复交换相邻值以获取下一个最小记录就位，而是记住要选择的元素的位置并在最后进行一次交换。因此，比较次数仍然是\
  \ $\\Theta(n²)$，但交换次数远少于冒泡排序所需的次数。当交换成本很高时，选择排序特别具有优势，例如当元素是长字符串或其他大型记录时。在大多数其他情况下，选择排序的效率（通过常数倍数）也高于冒泡排序。\n\
  \n还有另一种保持记录交换成本较低的方法，即使在记录很大时也可以用于任何排序算法。这是让数组的每个元素存储一个指向记录的指针 own 存储记录本身。在这一实现中，交换操作只需要交换指针值；记录本身不移动。图\
  \ 7.4 展示了这种技术。需要额外的空间来存储指针，但回报是更快的交换操作。\n\n### 7.2.4 交换排序的成本\n\n图 7.5 总结了插入排序、冒泡排序和选择排序在最好、平均和最坏情况下的比较次数和交换次数。这些排序在平均和最坏情况下的运行时间均为\
  \ $\\Theta(n²)$。\n\n本章介绍的其余排序算法在典型情况下都显著优于这三种。但在继续之前，调查是什么导致这三种排序如此缓慢是有启发性的。关键瓶颈在于只对相邻记录进行比较。因此，比较和移动（除选择排序外）都是单步完成的。交换相邻记录被称为“交换”。因此，这些排序有时被称为交换排序（exchange\
  \ sorts）。任何交换排序的成本在最好的情况下也是到达其“正确”位置必须移动的记录总数（即逆序对数）。选择排序存在一个微小的异常。选择排序所谓的优势是其交换次数少，然而选择排序在最好情况下的交换次数却差于插入排序。这是因为给出的选择排序实现中没有在\
  \ `i` 已经处于位置 `i` 的情况下避免交换。可以加入一个测试来避免此类交换。\n\n**图 7.4** 交换指针的示例。(a) 一系列记录。键值为 42\
  \ 的记录在键值为 5 的记录之前。(b) 在交换了前两个指针后，键值为 5 的记录现在位于键值为 42 的记录之前。\n\nKey = 42\nKey = 42\n\
