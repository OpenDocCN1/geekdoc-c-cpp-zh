  md: 'If you want to output your JSON data to a file, use json.dump() rather than
    json.dumps(). You can use ensure_ascii=False to maintain non-ASCII characters,
    and sort_keys=True to alphabetize key names. You can also include an indent=option,
    which can make the file readable for human consumption. However, rarely use JSON
    to create human-readable files. JSON is primarily a marshalling format used to
    transport from databases to apps, and from apps to databases.


    As an example, suppose you want to create a file hitcounts_new.json (or, if it
    already exists, open it to overwrite its contents). You want to retain any non-ASCII
    characters that you write to the file. Here is the code for that; the ''w'' is
    required to make sure the file opens for writing data into it:


    ```

    with open(''hitcounts_new.json'', ''w'', encoding=''utf-8'') as out_file:

    ```


    Then, to copy the dictionary named hits as JSON data into this file, use the name
    you assigned at the end of the code in the preceding line. Again, to retain any
    non-ASCII characters and, optionally, alphabetize the key names in each dictionary,
    follow that line with this one, indented so that it''s contained in the with block:


    ```

    json.dump(hits, out_file, ensure_ascii=False, sort_keys=True)

    ```


    JSON is a widely used format for storing and sharing data. Luckily, Python has
    lots of built-in tools for accessing and creating JSON data. We''ve covered the
    most important capabilities here. But don''t be shy about doing a web search for
    python json if you want to explore more.'
