  md: "# Keeping Your App from Crashing\n\nYou can stack up except: statements in\
    \ a try block to handle different errors. Be aware that when the exception occurs,\
    \ it looks at each one starting at the top. If it finds a handler that matches\
    \ the exception, it raises that one. If some exception occurred that you didn't\
    \ handle, you get the standard Python error message. But there's a way around\
    \ that, too.\n\nIf you want to avoid all Python error messages, you can start\
    \ the last exception handler in the code with except Exception:. That line means\
    \ “If the error that occurred wasn't already handled by one of the previous exceptions,\
    \ use the exception handler instead.\n\n# Adding an else to the Mix\n\nIn the\
    \ previous example, we used one error handler to handle file-not errors, and a\
    \ second handler for everything else. But in real life, you may have to handle\
    \ many kinds of errors. So there may be except: blocks for various errors. What\
    \ if none of the errors you're trying to catch occurs? In that case, you want\
    \ code execution to proceed normally. You can add an else: block to your code\
    \ to handle the situation when there is no error to catch.\n\n```\ntry:\n    The\
    \ thing that might cause an exception\ncatch a common exception:\n    Explain\
    \ the problem\ncatch Exception as e:\n    Show the generic error message\nelse:\n\
    \    Continue on here only if no exceptions raised\n```\n\nIf you convert this\
    \ code to plain English, the logic of the flow is as follows:\n\n+   - Try to\
    \ open the file.\n\n+   - If the file isn't there, tell the user and stop."
