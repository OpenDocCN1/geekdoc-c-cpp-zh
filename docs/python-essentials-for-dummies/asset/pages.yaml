    # TABLE 12-1 Common HTTP Status Codes


    | Code | Meaning | Reason |

    |---|---|---|

    | 200 | Okay | No problems exist. |

    | 400 | Bad Request | The server is available but can''t make sense of your request,
    usually because something is wrong with your URL. |

    | 403 | Forbidden | The site has detected that you''re accessing it programmatically,
    which it doesn''t allow. |

    | 404 | Not found | Either the URL is wrong or the URL is right but the content
