  md: "```\nif x happens, stop here\nexcept Exception as e:\n  if something else bad\
    \ happens, stop here\nelse:\n  if no exceptions, continue on normally\nfinally:\n\
    \  do this code no matter what happened\n```\n\nThe **finally** code is executed\
    \ when the **try** block ends **no matter what**. For example, if you're inside\
    \ a function and an **except** block uses return to exit the function, the **finally**\
    \ code still executes. Without that kind of feature, the **finally** block would\
    \ be the equivalent of putting its code after and outside the **try** block.\n\
    \nTo illustrate, the upcoming code sets sets a variable named `file_is_open` to\
    \ **False**. It then attempts to open the file. If the file cannot be opened,\
    \ the first **except**: catches the error, the program doesn't crash. The `file_is_open`\
    \ variable remains set to **True**.\n\nIf the file can be opened, the **else**:\
    \ block executes, sets the `file_is_open` variable to **True**, it closes the\
    \ file. Regardless displays the file’s contents on the screen.\n\nFinally (in\
    \ the **finally: block**), the code checks to see if `is_file_open` is True, and\
    \ if it is True, it closes the file. Regardless of the situation, the program\
    \ will run without crashing and will also ensure that the file is closed before\
    \ moving to the next code.\n\n```\n# A variable that starts out False.\nfile_is_open\
    \ = False\n\ntry:\n  # Open the file named people.csv\n  the_file = open(\"people.csv\"\
    )\n\n  # Watch for common error and stop program if it happens.\nexcept FileNotFoundError:\n\
    \  print(\"Sorry, I don't see a file named people.csv here\")\n\n# Otherwise,\
    \ if nothing bad had happened by now, just keep going.\nelse:\n  # File must be\
    \ open by now. Set the open status to True.\nfile_is_open = True\n```"
