    you, the user (a human being), and your user agent (the program you''re using
    to access the internet) are on the client side of things. The server, which is
    just a computer, not a person, sends back its response, as illustrated in Figure
    12-1.


    # Client (person)


    # Server (machine)


    Request


    Response


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_159_0.png)


