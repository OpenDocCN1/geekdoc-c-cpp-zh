    # # Understanding the mysterious URL


    The URL is a key part of accessing a web page, because that''s how the internet
    finds the resource you''re seeking. On the web, most resources use Hypertext Transfer
    Protocol (HTTP), thus their URLs start with `http://` or `https://`. The difference
    is that `http://` sends across the wire in its raw form, which makes it susceptible
    to hackers and others who can “sniff out” the traffic. The https protocol is *secure*
    in that the data is *encrypted*, which means it''s converted to a secret code
    that''s not easy to read. Typically, any site with whom you do business and to
    whom you transmit sensitive information, such as passwords and credit card numbers,
    uses `https` to keep that information secure and secret.


    The URL for any website can be relatively simple, such as Alan''s URL, which is
    `https://alanspson.me`. Or it can be complex, to add more information to the request.
    Figure 12-2 shows the parts of a URL, some of which you may have noticed in the
    past.


    Note that the order matters. For example, it''s possible for a URL to contain
    a path to a specific folder or page (starting with a slash right'
