    \ as f:\n    one_line = f.readline()\n    while one_line:\n        print(one_line,\
    \ end='')\n        one_line = f.readline()\n```\n\nFor larger files, this is the\
    \ way to go about because at no point are you reading in the entire file. The\
    \ only potential problem is forgetting to include .readline() inside the loop\
    \ to advance to the next row. If you"
