  md: 'You may also notice people importing a module like this:


    ```

    from math import *

    ```


    The asterisk is short for “everything.” So in essence, that command is the same
    as import math, which also imports the entire math module, but with a subtle difference.
    Using the command from math import * automatically associates the names of constants
    and functions in the math module with math module. So you don''t have to use the
    math prefix in subsequent code. In other words, after you execute the following:


    ```

    from math import *

    ```


    you can do a command like print(pi) and it will work, even without using print(math.pi).
    Although this approach seems smart and convenient, many programmers think it isn''t
    Pythonic. If you''re importing lots of modules and using lots of different pieces
    of each, avoiding module names in code can make it harder for other programmers
    to read and make sense of that code.


    So that''s it for Python libraries, packages, and modules. All three represent
    code written by others that you''re allowed to use in any Python code you write.
    The only real difference is size. A library may contain several packages, a package
    may contain several modules, and the modules usually contain functions, classes,
    or other prewritten chunks of code that you''re free to use.'
