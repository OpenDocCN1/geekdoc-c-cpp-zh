  md: '# # Chapter 10


    # # Working with External Files


    IN THIS CHAPTER


    +   - Working with text and binary files

    - Opening, closing, and reading the contents of a file

    - Looping through a file

    - Reading and copying a binary file


    Pretty much everything stored in your computer, it be a document, program, movie,
    photograph, and more, is stored in a file. Most files are organized into *folders*
