    # # Introducing Object-Oriented Programming


    At the risk of getting technical or computer science-y, we should mention that
    there are different approaches to designing languages. Perhaps the most successful
    and widely used model is object-oriented programming, or OOP, which is a design
    philosophy that tries to mimic the real world in the sense that it consists of
    objects with properties as well as methods (actions) those objects perform.


    Python is very much an object-oriented language. The core language consists of
    controls (in the form of words) that allow you to control all different kinds
    of objects — in your own and other peoples'' programs. However, you need to learn
    the core language first that when you''re ready to start using other peoples''
    objects, you know how to do so. Similarly, after you know how to drive one car,
    you pretty much know how to drive them all. You don''t have to worry about renting
    a car only to discover that the accelerator is on the roof, the steering wheel
    on the floor, and you have to use voice commands rather than a brake to slow it
    down. The basic skill of driving applies to all cars.


