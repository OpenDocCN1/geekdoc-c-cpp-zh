    \ (make sure you use single or double quotation marks with no spaces around).\n\
    \n# Looping with readline()\n\nIf you aren't too sure about the size of the file\
    \ you're reading or the amount of RAM in the computer running your app, using\
    \ readlines() to read in an entire file can be risky. If there isn't enough memory\
    \ to hold the entire file, the app will crash when it runs out of memory. To play\
    \ it safe, you can loop through the file one line at a time so that only one of\
    \ the contents from the file is in memory at any given time.\n\nTo use this, you\
    \ open the file, read one line, and put it in a variable. Then loop through the\
