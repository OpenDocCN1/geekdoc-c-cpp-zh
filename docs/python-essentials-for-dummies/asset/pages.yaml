    The Python standard library includes a json module that helps you work with JSON
    files. Because it’s part of the standard library, you just have to put import
    json near the top of your code to access its capabilities.

    The four main methods for serializing and deserializing json are summarized in
    Table 11-1.


    # TABLE 11-1 Python JSON Methods for Serializing and Deserializing JSON Data


    | Method | Purpose |

    | --- | --- |

    | json.dump() | Write (serialize) Python data to a JSON file (or stream). |

    | json.dumps() | Write (serialize) a Python object to a JSON string. |

    | json.load() | Load (deserialize) JSON from a file or similar object. |

    | json.loads() | Load (deserialize) JSON data from a string. |


    Data types in JSON are similar but not identical to data types in Python.

    Table 11-2 lists how data types are converted between the two languages when serializing
    and deserializing.


    # TABLE 11-2 Python and JSON Data Conversions


    | Python | JSON |

    | --- | --- |

    | Dict | Object |

    | list, tuple | Array |

    | Str | String |

    | int and float | Number |

