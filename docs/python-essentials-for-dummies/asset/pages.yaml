    # # Understanding Serialization


    When it comes to JSON, the first buzzword you have to learn is serialization.
    *Serialization* is the process of converting an object (such as a Python dictionary)
    into a stream of bytes or characters that can be sent across a wire, stored in
    a file or database, or stored in memory. The main purpose is to save all the information
    in an object in a way that can be retrieved by any other computer. The process
    of converting the information back to an object is called *deserialization*. To
    keep things simple, you may just consider using these definitions:'
