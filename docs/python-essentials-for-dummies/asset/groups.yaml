- md: "\n# Chapter 6\n\n# Controlling the Action\n\n- Deciding with if\n- Repeating\
    \ with for\n- Looping with while\n\nSo far in this book we've talked a lot about\
    \ storing information in computers, mostly in variables that Python and your computer\
    \ can work with. Having the information in a form that the computer can work with\
    \ is critical to getting a computer to do anything. Think of this as the “having”\
    \ part — having some information to work with.\n\nBut we need to turn our attention\
    \ to the “doing” part — working with that information to create something useful\
    \ or entertaining. In this chapter, we cover the most important and most commonly\
    \ used operations for making the computer *do* stuff. We start with something\
    \ that computers do well, do quickly, and do a lot: make decisions.\n\n## Main\
    \ Operators for Controlling the Action\n\nYou control what your program (and the\
    \ computer) does by making decisions, which often involves making comparisons.\
    \ You use operators, such as those in Table 6-1, to make comparisons. These operators\
    \ are often referred to as relational operators or comparison operators because\
    \ by comparing items, the computer is determining how two items are related.\n\
    \n## TABLE 6-1 Python Comparison Operators for Decision-Making\n\n| Operator |\
    \ Meaning |\n| :--- | :--- |\n| == | Is equal to |\n| != | Is not equal to |\n\
    | < | Is less than |\n| > | Is greater than |\n| <= | Is less than or equal to\
    \ |\n| >= | Is greater than or equal to |\n\nPython also offers three logical\
    \ operators, also called Boolean operators, which enable you to assess multiple\
    \ comparisons before making a final decision. These operators use the English\
    \ word for, well, basically what they mean, as shown in Table 6-2.\n\n## TABLE\
    \ 6-2 Python Logical Operators\n\n| Operator | Meaning |\n| :--- | :--- |\n| and\
    \ | Both are true |\n| or | One or the other is true |\n| not | Is not true |\n\
    \nAll these operators are often used with if then ... else decisions to control\
    \ what an app or program does. To make such decisions, you use the Python if statement.\n\
    \n## Making Decisions with if\n\nThe word if is used a lot in all apps and computer\
    \ programs to make decisions. The simplest syntax for if follows:\n\n```python\n\
    if condition: \n    do this\ndo this no matter what\n```\n\nSo the first do line\
    \ is executed only if the condition is true. If the condition is false, that first\
    \ do this is ignored. Regardless of what the condition turns out to be, the second\
    \ line is executed next. Note that neither line is indented. Indentation means\
    \ a lot in Python, as you'll see shortly. But first, consider a few simple examples\
    \ with this syntax. You can try it for yourself in a .py file.\n\nFigure 6-1 shows\
    \ a simple example where the sun variable receives the string down. Then an if\
    \ statement checks to see whether the sun variable equals the word down and, if\
    \ it does, it prints a Good night! message. Then it continues normally to print\
    \ an I am here.\n\n```python\nsun = \"down\"\nif sun == \"down\": \n    print(\"\
    Good night!\")\nprint(\"I am here\")\n\n# Good night!\nI am here\n```\n\nFIGURE\
    \ 6-1: The result of a simple if when the condition proves true.\n\n> WARNING\
    \ Make sure you always use two equal signs with no space between (==) to test\
    \ equality. This rule is easy to forget. If you type it incorrectly, the code\
    \ won't work as expected.\n\n> REMEMBER You must spell True and False with an\
    \ initial capital letter and the rest lowercase. If you type it any other way,\
    \ Python won't recognize it as a Boolean True or False and your code won't run\
    \ as expected.\n\nNotice that in the if statement, we used\n\n```python\nif taxable:\n\
    ```\n\nThis code is perfectly okay because we made taxable a Boolean that can\
    \ only be True or False. You may see other people type it as\n\n```python\nif\
    \ taxable == True:\n```\n\n## Adding else to your logic\n\nSo far, you've looked\
    \ at code examples in which some code is executed if some condition proves true.\
    \ If the condition proves false, code is ignored. Sometimes, you may want one\
    \ chunk of code to execute if a condition proves true; otherwise (else), if it\
    \ doesn't prove true, you want some other chunk of code to be executed. In that\
    \ case, you can add an else: to your if. Any lines of code indented under the\
    \ else: are executed only if the condition did not prove true. Here is the logic\
    \ and syntax:\n\n```python\nif condition:\n    do indented lines here\n    ...\n\
    else:\n    do indented lines here\n    ...\ndo remaining un-indented lines no\
    \ matter what\n```\n\nFigure 6-2 shows a simple example in which we grab the current\
    \ time from the computer clock using datetime.now(). If the hour of that time\
    \ is less than 12, the program displays Good morning. Otherwise, it displays Good\
    \ afternoon. Regardless of the hour, it prints I hope you are doing well!! So\
    \ if you write such a program and run it in the morning, you get the appropriate\
    \ greeting followed by I hope you are doing well!, as in Figure 6-2.\n\n```python\n\
    import datetime as dt\n# Get the current date and time\nnow = dt.datetime.now()\n\
    # Make a decision based on hour\nif now.hour < 12:\n    print(\"Good morning\"\
    )\nelse:\n    print(\"Good afternoon\")\n    print(\"I hope you are doing well!\"\
    )\n\n# Good morning\nI hope you are doing well!\n```\n\n**Figure 6-2:** Print\
    \ an initial greeting based on the time of day.\n\nWhen if ... else is used, the\
    \ code under the if is executed if the condition is true, and the code under the\
    \ else is executed if it is false. This allows for branching logic in your programs.\n"
  mdcn: "\n\n# 第 6 章\n\n# 控制动作\n\n- 使用 if 决策\n- 使用 for 重复\n- 使用 while 循环\n\n到本书为止，我们已经讨论了很多关于如何在计算机中存储信息，大部分存储在\
