    the operating system shell or the Python interpreter (which always shows >>>)
    but are now in a new area that provides help. As described on the screen, you
    can enter the name of any module, keyword or topic to get help with that term.
    As a beginner, you might not need with specifics right at the moment. But it''s
    good to know that the help is there if you need it.


    For example, Python uses certain keywords that have special meaning in the language.
    To get a list of those keywords, just type the following at the `help>` prompt:


    ```

    keywords

    ```


    After you press Enter, you see a list of keywords, as shown in Figure 2-3.


    | PROBLEMS | OUTPUT | TERMINAL |

    | :--- | :--- | :--- |

