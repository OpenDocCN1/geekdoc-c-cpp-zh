    \n图 9-3：showfilecontents.py 文件抛出了异常。\n\nTraceback（回溯）是指引用，如果有多个异常，它们都将被列出来，并将最近的一个列在最前面。更具体地说，如果有多个函数调用导致错误，Traceback\
