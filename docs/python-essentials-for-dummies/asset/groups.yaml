    Whichever command gives you the Python version will also take you to a Python
    interpreter, where you can enter Python code directly. You’ll know you’re in the
    right place when you see the prompt change to greater-than signs (>>>). To get
    the command prompt now, enter whichever command worked for you before, without
    --version. For example, just type python (or just python3, or just py) and nothing
    else; then press Enter:


    ```python

