    Sometimes in code you work with one item of data at a time, such as a person''s
    name or a unit price or a username. Other times, you work with larger sets of
    data, such as a list of people''s names or a list of products and their prices.
    These sets of data are often referred to as lists or arrays in most programming
    languages.


    Python has lots of easy, fast, and efficient ways to deal with all kinds of data
    collections, as you discover in this chapter. As always, we encourage you to follow
    along in a .py file. The “doing” part helps with the “understanding” part.


    # ## Defining and Using Lists


    The simplest data collection in Python is a list. We provided examples of these
    in the preceding chapter. A list is any list of data items, separated by commas,
    inside square brackets. Typically, you assign a name to the list using list =
    character, just as you would with variables. If the list contains numbers, don''t
    use quotation marks around them. For example, here is a list of test scores:


    ```

    scores = [88, 92, 78, 90, 98, 84]

    ```'
  - '[PAGE 91]


    If the list contains strings, those strings should, always, be enclosed in single
    or double quotation marks, as in this example:


    ```

    students = ["Mark", "Amber", "Todd", "Anita", "Sandy"]

    ```


    To display the contents of a list on the screen, you can print it just as you
    would print any regular variable. For example, executing `print(students)` in
    your code after defining that list displays on the screen:


    ```

    [''Mark'', ''Amber'', ''Todd'', ''Anita'', ''Sandy'']

    ```


    This output may not be exactly what you had in mind. Don''t worry; Python offers
    lots of ways to display lists.


    # Referencing list items by position


    Each item in a list has a position number, starting with 0, even though you don''t
    see any numbers. You can refer to any item in the list by its number using the
    name for the list followed by a number in square brackets. In other words, use
    this syntax:


    ```

    listname[x]

    ```


    Replace `listname` with the name of the list you''re accessing and replace `x`
    with the position number of the item you want. Remember, the first item is always
    0, not 1. For example, in the following first line, we define a list `students`,
    and then print item number 0 from that list. The result, when executing the code,
    is the name `Mark` displayed:


    ```

    students = ["Mark", "Amber", "Todd", "Anita", "Sandy"]

    print(students[0])

    ```


    The next example shows a list named scores. The `print()` function prints the
    value of `scores[4]`, which is 84 in this example. Remember, the first item is
    always at position 0. So `scores[0]` is 88, `scores[1]` is 92 and so forth.


    ```

    scores = [88, 92, 78, 90, 84]

    print(scores[4])

    84

    ```'
