    ```


    > REMEMBER When we, or anyone else, says “enter the command,” that means you have
    to type the command and press Enter. Nothing happens until you press Enter. So
    if you just type the command and wait for something to happen, you’ll be waiting
    for a long, long time. You should see some information about the Python version
    you’re using and the >>> prompt, which represents the Python interpreter.


    # Entering commands


    Entering commands in the Python interpreter is the same as typing them anywhere
    else. You must type the command correctly and then press Enter. If you spell something
    wrong in the command, you will likely see an error message, which is just the
    interpreter telling you it doesn''t understand what you mean. But don''t worry;
    you can''t break anything. For example, suppose you type the command


    ```

    howdy

    ```


    After you press Enter, you''ll see some techie gibberish that is trying to tell
    you that the interpreter doesn''t know "howdy" means, so it can''t do anything.
    Nothing has broken. You''re just back to another >>> prompt, which you can try
    again, as shown in [Figure 2-2](Figure-2-2).


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_25_0.png)


    **Figure 2-2:** Python doesn''t know howdy means.


    # Using Python''s built-in help


    One of the prompts in [Figure 2-2](Figure-2-2) mentions that you can type **help**
    as a command in the Python interpreter. Note that you don''t type the quotation
    marks, just use **help** (and then press Enter, always). This time you see


    ```

    help() for interactive help, or help(object) for help about object.

    ```


    Now the interpreter is telling you to type **help** followed by an empty of parentheses,
    or type **help** with a specific word in parentheses (object is the example given).
