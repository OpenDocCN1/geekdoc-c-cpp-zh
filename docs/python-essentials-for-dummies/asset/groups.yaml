    # Searching for specific help online


    Python’s built-in help is useful when you know the exact terminology and concept
    you want to look up. But that’s often tough for beginners. When you’re online,
    you may be better off searching the web. If you’re looking for videos, start at
    www.youtube.com; if not, https://stackoverflow.com is a good place to ask questions
