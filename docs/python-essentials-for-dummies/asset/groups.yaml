  - '[PAGE 138]


    # Appending versus overwriting files


    WARNING Anytime you work with files, it''s important to understand the difference
    between write and append. If a file contains information and you open it in write
    mode and then write to it, your new content will overwrite (replace) whatever
    is already in the file. There is no undo for this. So if the content of the file
    is important, you want to make sure you don''t make that mistake. Add content
    to the end of a file, open the file in append (a) mode, and then use .write to
    write to the file.


    # Using tell() to determine the pointer location


    When you loop through a file, its contents are read top to bottom and left to
    right. Python maintains a pointer to keep track of where it is in the file. When
    you''re reading a text file with readline(), the pointer is always the character
    position of the next line in the file.


    # Moving the pointer with seek()


    Whereas the tell() method tells you where the pointer is in an external file,
    the seek() method enables you to reposition the pointer. The syntax is


    ```

    file.seek(position,whence)

    ```


    Replace file with the variable name of the open file. Replace position to indicate
    where you want to put the pointer. For example,0 moves the pointer back to the
    top of the file. The whence is optional; you can use it to indicate where in the
    file to set the pointer position. Your choices are


    +   - 0: Set the position relative to the start of the file.

    - 1: Set the position relative to the current pointer position.

    - 2: Set the position relative to the end of the file. Use a negative number for
    position.'
  - '[PAGE 139]


    If you omit the whence value, it defaults to 0.


    By far the most common use of seek is to just reset the pointer back to the top
    of the file for another pass through the file. The syntax for this is simply .seek(0).


    # Reading and Copying a Binary File


    Suppose you have an app that changes a binary file, and you want to always work
    with a copy of the original file to play it safe. Binary files can be huge, rather
    than opening it all at once and risking running out of memory, you can read it
    in chunks and write it out in chunks. Binary files do not have human-readable
    content. Nor do they have lines of text. So readline() and read() aren''t a good
    choice for looping through binary files, but you can use .read() with a specified
    size.


    Figure 10-2 shows the binarycopy.py file, which makes a copy of any binary file.
    We take you through that code step-by-step so that you can understand how it works.'
  - '[PAGE 140]


    ```

    binarycopy.py > ...

    1 # Specify the file to copy

    2 file_to_copy = ''happy_pickle.jpg''

    3 # Create new file name wuth _copy before the extension.

    4 name_parts = file_to_copy.split(''.'')

    5 new_file = name_parts[0] + ''_copy.'' + name_parts[1]

    6 # Open the original file as read-only binary.

    7 with open(file_to_copy, ''rb'') as original_file:

    8   # Create or open file copy into

    9   with open(new_file,''wb'') as copy_to:

    10   # Grab a chunk of the original file (4MB).

    11 chunk=original_file.read(4096)

    12 # Loop until no more chunks.

    13 while len(chunk) > 0:

    14   copy_to.write(chunk)

    15   # Make sure you read the next chunk in this loop.

    16   chunk = original_file.read(4096)

    17

    18 # Close is automatic after loops, show done message.

    19 print(''Done!'')

    ```


    **FIGURE 10-2:** The binarycopy.py file copies any binary file.


