    # Understanding Python Data Types


    You deal with written information all the time and probably don’t think about
    the difference between numbers and text. Numbers are amounts, such as 10 or 123.45.
    Text consists of letters and words. For computers, the big difference is that
    they can do arithmetic (subtract, multiple, divide) with numbers, but not with
    letters and words.


    # Numbers


    Numbers in Python must start with a number digit, (0–9); a dot (period), which
    is a decimal point; or a hyphen (-) used as a negative sign for negative numbers.
    A number can contain only one decimal point. It should not contain letters, spaces,
    dollar signs, or anything else that isn’t part of a normal number.


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_43_0.png)


    > TIP If you’re worried that the number rules won’t let you work with dollar amounts,
    zip codes, addresses, or anything else, stop worrying. You can store and work
    with all kinds of information, as you’ll see shortly.


    # Integers


    An integer is any whole number, positive or negative. There is no limit to its
    size. Numbers such as 0, –1, and 99999999999999 are all perfectly valid integers.
    From your perspective, an integer is just any valid number that doesn’t contain
    a decimal point.


    # Floats'
  - '[PAGE 44]


    A floating-point number, often called a float, is any valid number that contains
    a decimal point. Again, there is no size limit: 1.1 and –1.1 and 123456.789012345
    are all perfectly valid floats.


    If you work with very large scientific numbers, you can use an e in a number to
    indicate the power of 10. For example, 234e1000 is a valid number, and will be
    treated as a float if there''s no decimal point. If you''re familiar with scientific
    notation, know 234e3 is 234,000 (replace the e3 with three zeros). If you''re
    not familiar with scientific notation, don''t worry about it. If you''re not using
    it in your day-to-day work now, chances you''ll never need it in Python either.


    # Words (strings)


    Strings are sort of the opposite of numbers. With numbers, you can add, subtract,
    multiply, and divide the numbers represent quantities. Strings are for just about
    everything else. A name, address, or kind of text you see every day would be a
    string in Python (and in computers in general). It''s called a string because
    it''s a string of characters (letters, spaces, punctuation marks, and maybe some
    numbers). To us, a string usually has some meaning, such as a person''s name or
    address. But computers don''t have eyes to see with or brains to think with or
    any awareness that humans even exist, so to a computer, if a piece of information
    is not something on which it can do arithmetic, it''s just a string of characters.


    ```

    "Hi there, I am a string"

    "Hello world"

    "123 Oak Tree Lane"

    "(267) 555-1234"

    "18901-3384"

    ```


    Note that it''s fine to use numeric characters (0–9) as well as as hyphens and
    dots (periods) in strings. Each is still a string because it''s enclosed in quotation
    marks.'
