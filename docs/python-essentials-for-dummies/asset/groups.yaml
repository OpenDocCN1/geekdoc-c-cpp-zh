    ## Tools for Success


    Now we need to start getting your computer set up so that you can learn, and do,
    Python hands-on. For one, you''ll need a good Python interpreter and editor. The
    *editor* lets you type the code, and the *interpreter* lets you run that code.
    When you run (or execute) code, you''re telling the computer to “whatever my code
    tells you to do.”


    The term *code* refers to anything writing in a programming language to provide
    instructions to a computer. The term *coding* is often used to describe the act
    of writing code. A code editor is an app that lets you type code, in the same
    way as app Microsoft Word or Apple Pages helps you type regular, plain-English
    text.


    Just as there are many brands of toothpaste, soap, and shampoo in the world, there
    are many brands of code editors that work well with Python. There isn''t a right
    one or a wrong one, a good one or a bad one, a best one or a worst one. Just a
    lot of different products that basically do the same thing but vary slightly in
    their approach and what that editor''s creators think is good.


    If you''ve already started learning Python and are happy with whatever you''ve
    been using, you''re welcome to continue using that and ignore our suggestions.
    If you''re just getting started with this stuff, we suggest you use VS Code, because
