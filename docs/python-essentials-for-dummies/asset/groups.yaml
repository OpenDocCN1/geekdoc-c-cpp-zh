    format string. Inside the quotation marks, the text, called the *literal* part,
    is displayed literally (exactly as typed in the f-string). Anything in curly braces
    is the *expression* part of the f-string, a placeholder for what will appear when
    the code executes. Inside the curly braces, you can have an *expression* (a formula
    to perform some calculation, a variable name, or a combination of the two). Here
    is an example:


    ```

    username = "Alan"

    print(f"Hello {username}")

    ```


