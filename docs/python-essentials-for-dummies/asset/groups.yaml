    \n这种错误的通用名称是 `FileNotFoundError`。许多异常都与一个数字相关（在本例中为 `2`）。该数字取决于操作系统。\n\n## 优雅地处理错误\n\
    \n处理文件未找到错误的最佳方法是将 Python 显示的内容替换为用户更有可能理解的内容。为了做到这一点，你可以使用以下基本语法编写 `try ... except`\
    \ 块：\n\n```python\ntry:\n    你想让代码执行的内容\nexcept Exception:\n    当它无法执行时要执行\n```\n\
    \n这里是你可以如何重写 `showfilecontents.py` 来处理缺失（或拼写错误）错误的示例：\n\n```python\ntry:\n   \
    \ # Open file and show its name.\n    the_file = open('people.csv')\n    print(the_file.name)\n\
    except Exception:\n    print(\"Sorry, I don't see a file named people.csv here\"\
    )\n```\n\n因为要打开的文件可能不存在，你从 `try:` 开始，然后尝试打开文件。如果文件打开了，`print()` 语句将运行并显示文件名。但如果打开文件时抛出异常，程序不会崩溃并显示通用错误消息。相反，它会显示一条普通人可以理解的信息，如图\
    \ 9-4 所示。\n\n![](img/be36b4e9a8416f1ae2a353bd745f71cb_121_0.png)\n\n图 9-4：showfilecontents.py\
    \ 文件捕获了错误并显示了友好的消息。\n\n## 指定异常\n\n我们之前的代码示例优雅地处理了文件未找到错误。但较大的应用程序可能有许多可能出现错误的地方，你需要对每个错误进行不同的处理。为此，你可以定义多个错误处理器，正如我们所讨论的那样。\n\
    \n假设你手动修复了文件名，使其成为原本的 `people.csv`。正如之前所示，当你运行代码且没有错误时，输出只是文件名。在打印文件名的行下面，我们又添加了一行代码：\n\
    \n```python\ntry:\n    # Open file and show its name.\n    the_file = open('people.csv')\n\
    \    print(the_file.name)\n    print(the_file.wokerms())\nexcept Exception:\n\
    \    print(\"Sorry, I don't see a file named people.csv here\")\n```\n\n"
