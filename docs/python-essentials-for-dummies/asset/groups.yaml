    # Exploring Python Packages


    !


    The Python language supports modular programming, in which a program is broken
    down into smaller, more manageable components, and modules. And some of these
    components might already have been created by someone else and can be reused.


    Any large project, whether you’re working alone or as a team member, can be simplified
    and streamlined if some components can use code that’s already written, tested,
    debugged, and deemed reliable by members of the Python programming community.
    The packages you hear about in relation to Python are kind of code — code that
    has been developed and nurtured, is trustworthy, and generic enough to be used
    as a component of a large project.


    Thousands of packages are available for Python. A good resource for finding packages
    is PyPI, a clever name’s easy to remember and short for Python Package Index.
    You can check it out


    ```

    https://pypi.org.

    ```


    In addition, a program named pip, for Pip Installs Packages (another clever name)
    is a package manager that you can use to explore, update,


