  - '[PAGE 215]


    # About the Authors


    **John Shovic:** John has been working with software since he talked his high
    school into letting him use their IBM 1130 computer for the entire summer of 1973.
    That launched him into his lifelong love affair with software. John has founded
    multiple companies: Advance Hardware Architectures; TriGeo Network Security; Blue
    Water Technologies; InstaComm; SwitchDoc Labs; and bankCDA. He has given more
    than 80 invited talks and has published more than 50 papers on a variety of topics
    on artificial intelligence, manufacturing automation, Arduinos, Raspberry Pi,
    computer security, computer forensics systems, and others. In 2019, he was appointed
    the director of the research group the Center for Intelligent Industrial Robotics.
    Currently, John is proud to serving as a computer science faculty member, specializing
    in industrial robotics and artificial intelligence, at the University of Idaho
    in Coeur d’Alene, where he is surrounded by a bunch of students who are as excited
    about technology and computers as he is.


    **Alan Simpson:** Alan is the author of more than 100 computer books on databases,
    programming, and web development. His books have been published throughout the
    world in more than a dozen languages and have sold millions of copies. Alan left
    the writing world a few years ago to get out of the ivory tower into the real
    world, first as a developer and now as a manager of the apps and DBA team in his
    county government’s IT department. Alan has been called a “master communicator”
    throughout his extensive career, and his online courses and YouTube videos continue
    to get reviews from his many students and followers.'
  - '[PAGE 216]


