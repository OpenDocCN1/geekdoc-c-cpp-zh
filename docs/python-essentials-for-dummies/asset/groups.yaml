    Python code to work with files.


    # # Understanding Text and Binary Files


    There are basically two types of files:


    +   - Text file: Contains plain text characters. in a text editor, it displays
    human-readable content. The text may not be in a language you know or understand,
    but you will see mostly normal characters that you can type at any keyboard.


    +   - Binary file: Stores information in bytes that aren''t quite so human readable.'
