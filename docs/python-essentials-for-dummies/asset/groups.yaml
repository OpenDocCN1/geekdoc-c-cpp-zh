    \ the_file.close()\n    print(\"Success!\")\n```\n\n![](img/be36b4e9a8416f1ae2a353bd745f71cb_123_0.png)\n\
    \n注意 在 Python 中的 try ... except ... else ... finally\n\n如果你查看异常处理的完整语法，你会发现最后还有最后一个选项，如下：\n\
    \n```python\ntry:\n    尝试做这件事\nexcept:\n    如果发生了 x，在这里停止\nexcept Exception as\
