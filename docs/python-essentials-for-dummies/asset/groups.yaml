    ）会在屏幕上显示 `people.csv`——假设文件夹中存在一个名为 `people.csv` 的文件。当异常处理介入时，这个假设就不成立。\n\n假设由于你无法控制的，，`people.csv`\
    \ 文件不存在，因为某些人员或自动化程序未能将其放在那里。或者可能有人拼错了文件名。很容易不小心打错，例如把文件名写成 `.csvv` 而不是 `.csv`。有很多情况可能导致文件不可用。当文件不可用时运行程序会抛出异常（在英语中意思是“显示错误消息”），正如你在图\
