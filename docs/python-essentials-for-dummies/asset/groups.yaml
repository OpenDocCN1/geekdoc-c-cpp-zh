    # # Calculating timespans


    Sometimes knowing the date or time isn’t enough. You need to know the duration,
    or *timespan*, as it’s typically called in the computer world. In other words,
    not the date, not the o’clock, but the “how long” in terms of years, months, days,
    hours, minutes, or whatever. For timespans, the Python `datetime` module includes
    the `datetime.timedelta` class.


    A **timedelta** object is automatically created whenever you subtract two dates,
    times, or datetimes to determine the duration between them. For example, suppose
    you create a couple of variables to store them, perhaps for one New Year’s Day
    and another for Memorial Day. Then you create a third variable named `days_between`
    and put in it the difference by subtracting the earlier date from the later, as
    follows:


    ```

    import datetime as dt

    new_year_day = dt.date(2024, 1, 1)

    memorial_day = dt.date(2024, 5, 27)

    days_between = memorial_day - new_year_day

    print(days_between)

    print(type(days_between))

    ```


    So what exactly is `days_between` in terms of a data type? If you print its value,
    you get *127 days*, **0:00:00**. In other words, there are 147 days between those
    dates; the **0:00:00** is time, but because we didn’t specify a time of day in
    either date, the time digits are all just set to 0.'
