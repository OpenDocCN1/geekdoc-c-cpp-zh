    # Uncovering Dates and Times


    In the world of computers, we often use dates and times for scheduling, or for
    calculating something is due or how many days it''s past due. We sometimes use
    timestamps to record exactly when a user did something or when an event occurred.
    There are lots of reasons for using dates and times in Python, but perhaps surprisingly,
    no built-in data type for them exists like the ones for strings and numbers.


    To work with dates and times, you typically need to use the datetime module. As
    with any module, you must import it before you can use it. You do that by using
    import datetime. And as with any import, you can add an alias (nickname) that''s
    easier to type, if you like. For example, import datetime as dt would work, too.
    You just have to remember to type dt rather than datetime in your code when calling
    upon the capabilities of that module.


    The datetime module provides an easy way to work with dates and times in Python.
    It provides three ways of storing information about dates, times, and time zones
    including these:


    +   datetime.date: A date consisting of month, day, and year (but no time information).


    +   datetime.time: A time consisting of hour, minute, second, microsecond, and
    optionally time zone information if needed (but date).


    +   datetime.datetime: A single item of data consisting of date, time, and, optionally,
    time zone information.


    We preceded each type with the full word datetime in the preceding list, but if
    you use an alias, such as dt, you can use that in your code instead.'
