    请注意顺序非常重要的。例如，URL 可能包含指向特定文件夹或页面的路径（在域名后紧跟一个斜杠开始）。URL 还可以包含查询字符串，查询字符串始终位于最后，并且始终以问号（?）开头。问号之后是一个或多个
    `name=value` 对，基本上与你在数据字典和 JSON 中看到的语法相同。如果有多个 `name=value` 对，它们通过 ampersands（&）分隔。


