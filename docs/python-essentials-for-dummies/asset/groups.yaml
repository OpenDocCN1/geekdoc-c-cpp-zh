    | math.acos(x) | 返回 x 的弧度反余弦值。 |

    | math.atan(x) | 返回 x 的弧度正切值。 |

    | math.atan2(y, x) | 返回 y 除以 x 的弧度正切值。 |

    | math.ceil(x) | 返回 x 的向上整数，即大于或等于 x 的最小整数。 |

    | math.cos(x) | 返回 x 的弧度余弦值。 |

    | math.degrees(x) | 将角度 x 从弧度转换为角度。 |

    | math.e | 返回数学常量 e (2.718281 ...)。 |


    | 内置函数 | 用途 |

    |--- |---|

    | math.exp(x) | 返回 e 的 x 次方，其中 e 是自然对数的底数。 |

    | math.factorial(x) | 返回 x 的阶乘。 |

    | math.floor(x) | 返回 x 的向下整数，即小于或等于 x 的最大整数。 |

    | math.isnan(x) | 如果 x 不是数字则返回 True；否则返回 False。具体而言，如果 x 包含 NaN，此函数返回 True；NaN
    是 Python 中的一个特殊值，用作没有数值的变量的占位符。 |

    | math.log(x, y) | 返回 x 以 y 为底的对数。 |

    | math.log2(x) | 返回 x 以 2 为底的对数。 |

    | math.pi | 返回数学常量 pi (3.141593 ...)。 |

    | math.pow(x, y) | 返回 x 的 y 次方。 |

    | math.radians(x) | 将角度 x 从角度转换为弧度。 |

    | math.sin(x) | 返回 x 的正弦值（当 x 以弧度表示时）。 |

    | math.sqrt(x) | 返回 x 的平方根。 |

    | math.tan(x) | 返回 x 的弧度正切值。 |

    | math.tau() | 返回数学常量 tau (6.283185 ...)。 |


    ## 数字格式化


    多年来，Python 提供了不同的方法以人类熟悉的方式显示数字。例如，大多数人更愿意看到美元金额格式化为 $1,234.56 或 1234.560065906594056959。从
    3.6 版本开始，Python 中格式化数字最简单的方法是使用 f-strings。


    ## 使用 f-strings 进行格式化


    格式化字符串（或 f-strings）是 Python 中格式化数据简单的方法。你只需要一个小写的 f 或大写的 F，后面紧跟着用引号括起来的一些文本或表达式。这里有一个示例：


    ```

    f"Hello {username}"

    ```


    第一个引号之前的 **f** 告诉 Python 后面的是格式化字符串。在引号内部，文本被称为*字面量*（literal）部分，将字面上地显示（与在 f-string
    中输入的完全相同）。花括号中的任何内容都是 f-string 的*表达式*（expression）部分，是代码执行时将出现内容的占位符。在花括号内部，你可以有一个*表达式*（执行某些计算的公式、变量名或两者的组合）。这里有一个示例：


    ```

    username = "Alan"

    print(f"Hello {username}")

    ```


    当你运行这段代码时，`print` 函数将显示单词 **Hello**，后面是一个空格，然后是 `username` 变量的内容，如图 5-2 所示。


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_61_0.png)


    **图 5-2**：用于格式化的超简单 f-string。这里是表达式的另一个示例——在大括号内部 `quantity` 乘以 `unit_price`：


    ```

    unit_price = 49.99

    quantity = 30

    print(f"Subtotal: ${quantity * unit_price}")

    ```


    执行该代码的输出如下：


    ```

    Subtotal: $1499.7

    ```


    **$1499.7** 不是显示美元金额的理想方式。通常我们喜欢在千分位使用逗号，并在分位保留两位，如下：


    ```

    Subtotal: $1,499.70

    ```


    ## 显示美元金额


    幸运的是，f-strings 为你提供了进行这种格式化的方法。要让美元金额中出现逗号并将分位保留两位，你可以在花括号内使用格式化字符串。格式化字符串以冒号开始，并放在右括号内，紧跟变量名或显示的值。要在千分位显示逗号，在你的格式化字符串中冒号后面使用逗号，如下所示：


    ```

    :,

    ```


    使用当前的示例，你可以执行以下操作：


    ```python

    print(f"Subtotal: ${quantity * unit_price:,}")

    ```


    执行此操作产生此输出：


    ```

    Subtotal: $1,499.7

    ```


    要让分显示为两位，在逗号后面紧跟


    ```

    .2f

    ```


    .2f 意味着“两位小数，固定”（永远不会多于或少于两位）。以下代码将带有逗号和两位小数显示数字：


    ```python

    print(f"Subtotal: ${quantity * unit_price:.2f}")

    ```


    这里是代码执行时显示的内容：


    ```

    Subtotal: $1,499.70

    ```


    完美！这正是我们想要的格式。所以，每当你想要显示一个千分位有逗号且小数点后恰好有两位的数字时，请使用带有格式字符串 `.2f` 的 f-string。


    ## 格式化百分比数字


    现在假设你的应用适用销售税。应用需要知道销售税率，该税率应该表示为百分比。如果销售税率是 6.5%，你可能希望将其格式化为 6.5% 而不是 0.065。如果数字是
    0.065，你可能希望将其格式化为 6.5%。


    ```python

    tax_rate = 0.065

    print(f"Tax rate: {tax_rate:.1%}")

    ```


    如果销售税率是 6.5%，你可能希望将其格式化为 6.50%。


    ```python

    tax_rate = 0.065

    print(f"Tax rate: {tax_rate:.2%}")

    ```


