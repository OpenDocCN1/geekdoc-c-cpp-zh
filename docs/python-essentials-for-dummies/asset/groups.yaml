    \n这个输出没有问题，只是我们通常会在单词和人名的部分之间加上空格。\n\n因为 Python 不会在你认为应该出现的地方自动插入空格，所以你必须手动输入它们。表示单个空格的最简单方法是使用一对引号，中间留一个空格，如下所示：\n\
    \n\" \"\n\n如果你忘记在引号之间放入空格（如下所示），那么你的字符串中将不会有空格，因为引号之间之间没有空格：\n\n\"\" \n\n如果你想在输出中获得多个空格，可以在引号之间放置多个空格，但通常一个就足够了。在接下来的示例中，你于\
    \ `first_name` 和 `last_name` 之间加了一个空格。你还在 `middle_init` 后面加了一个句号和空格：\n\n```\n\
    first_name = \"Alan\"\nmiddle_init = \"C\"\nlast_name = \"Simpson\"\nfull_name\
    \ = first_name + \" \" + middle_init + \".\" + last_name\nprint(full_name)\n```\n\
    \n该代码的输出（即 `full_name` 变量的内容）看起来更像你熟悉的姓名：\n\nAlan C. Simpson\n\n当然，作为将所有组件和空格拼接成新字符串的替代方案，你也可以简单地使用\
    \ f-string 以所需的格式显示名称，如下代码所示。唯一的区别在于你不需要一个 `full_name` 变量来处理你的代码。\n\n```\nprint(f\"\
    {first_name} {middle_init}.{last_name}\")\n```\n\n## 获取字符串长度\n\n要确定字符串中包含多少个字符，你可以使用内置的\
    \ `len()` 函数（length 的缩写）。长度包括空格，因为空格也是字符，每个字符的长度为 1。空字符串——即内部没有任何内容、甚至没有空格的字符串——长度为\
    \ 0。\n\n## 使用常用的字符串运算符\n\nPython 提供了几种用于处理数据序列的运算符。Python（以及大多数其他编程语言）中字符串一个奇怪的点是，当你数字符时，第一个字符被计为\
    \ 0，而不是 1。这对我们来说毫无意义，但计算机是这样数字符的，因为这是最高效的方法。所以尽管字符串长度为五个字符，但该字符串的最后一个字符是字母 E，因为第一个字符是数字\
    \ 0。\n\n表 5–4 总结了用于字符串的 Python 3 运算符。\n\n### 表 5–4 用于字符串的 Python 序列运算符\n\n| 运算符\
    \ | 目的 |\n| --- | --- |\n| x in s | 如果 x 存在于字符串 s 的某处，返回 True。 |\n| x not in s\
    \ | 如果字符串 s 中不包含 x，返回 True。 |\n| s*n* | 重复字符串 n 次。 |\n| s[i] | 字符串 s 中位置 i 的字符。\
    \ |\n| s[i:j] | 从位置 i 字符开始到位置 j 字符结束（但不包含位置 j）的切片。 |\n| s[i:j:k] | 从 i 到 j 步长为\
    \ k 的切片，其中 k 是任意字符之间的距离。例如，将 k 设置为 3 将显示每隔第三个字符，依此类推。 |\n| min(s) | 字符串 s 中最小（最低）的字符。\
    \ |\n| max(s) | 字符串 s 中最大（最高）的字符。 |\n\n当 `print()` 函数的输出看起来不对时，请记住关于 Python 字符串的两个事实：\n\
    \n- 第一个字符始终是数字 0。\n- 每个空格都算作一个字符，所以数数时不要跳过空格。\n\n你可能已经注意到 `min(s)` 返回一个空白空格字符，这意味着空格字符是字符串中最低的字符。但到底是什么让空格比字母\
    \ A 或字母 a 更“低”的呢？简单的答案是字母的 ASCII 码。你在键盘上输入的每个字符，以及许多额外的字符，都有一个由美国标准信息交换编码（ASCII）分配的数字。\n\
    \n## 使用方法操作字符串\n\nPython 字符串带有许多方法来帮助你操作它们。通用语法为：\n\n```\nstring.methodname(params)\n\
    ```\n\n### 表 5–5 字符串内置方法\n\n| 方法 | 目的 |\n| --- | --- |\n| s.capitalize() | 返回首字母大写、其余部分小写的字符串。\
    \ |\n| s.count(x, [y,z]) | 返回 x 在 s 中出现的次数。 |\n| s.find(x, [y,z]) | 返回 x 第一次出现的位置。如果未找到，则返回\
    \ -1。 |\n| s.index(x, [y,z]) | 类似于 s.find 但在未找到时抛出异常。 |\n| s.isalpha() | 如果 s\
    \ 至少有一个字符且仅包含字母（A–Z 或 a–z）和 Unicode 字符，返回 True。 |\n| s.isdecimal() | 如果 s 至少有一个字符且仅包含数字（0–9），返回\
    \ True。 |\n| s.islower() | 如果 s 包含字母且所有字母均为小写，返回 True。 |\n| s.isnumeric() | 如果\
    \ s 至少有一个字符且仅包含数字（0–9），返回 True。 |\n| s.isprintable() | 如果 s 仅包含可打印字符，返回 True。空格是可打印的，但换行符和制表符不是。\
    \ |\n| s.istitle() | 如果 s 包含字母且每个单词的首字母大写并跟着小写字母，返回 True。 |\n| s.isupper() | 如果字符串中的所有字母都是大写，返回\
    \ True。 |\n| s.lower() | 返回所有字母转换为小写的 s。 |\n| s.lstrip() | 返回删除了开头空白（空格、制表符、换行符）的\
    \ s。 |\n| s.replace(x, y) | 返回将 x 替换为 y 的 s 副本。 |\n| s.rfind(x, [y,z]) | 类似于 s.find\
    \ 但从字符串反向搜索。如果提供了 y 和 z，则从位置 z 到位置 y 反向搜索。如果未找到，返回 -1。 |\n| s.rindex() | 与 s.rfind\
    \ 相同但在未找到时抛出异常。 |\n| s.rstrip() | 返回删除了结尾空白的 s。 |\n| s.strip() | 返回删除了开头结尾空白的\
    \ s。 |\n| s.swapcase() | 返回大写字母转换为小写、小写字母转换为大写的 s。 |\n| s.title() | 返回每个单词首字母大写、所有其他字母均为小写的\
    \ s。 |\n| s.upper() | 返回所有字母转换为大写的 s。 |\n\n不要费力尝试记忆或甚至理解每一个字符串方法。记住，你随时可以询问 AI\
    \ 来列出所有的"
