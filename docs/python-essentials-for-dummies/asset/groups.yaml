    # # What’s a Tuple and Who Cares?


    In addition to lists, Python supports a data structure known as a tuple. Some
    people pronounce it “two-pull.” Some people pronounce it to rhyme with couple.
    But it’s not spelt tuple or to, so our best guess is that it’s pronounced “two-pull.”
    (Heck, for all we know, there may not be one correct way to pronounce it, but
    doesn’t stop people from arguing about it.)


    Anyway, the oddball name, a tuple is just an immutable list (like that tells you
    a lot). In other words, a tuple is a list, but you can’t change it after it’s
    defined. It’s like a constant.


    The syntax for creating a tuple is the same as the syntax for creating a list,
    except you don’t use square brackets. You have to use parentheses, like this:


    ```

    prices = (29.95, 9.98, 4.95, 79.98, 2.95)

    ```


    Most of the techniques and methods that you learned for using lists back in Table
    7-1 don’t work with tuples because they are used to modify something in a list,
    and a tuple can’t be modified. However, you can get the length of a tuple using
    len, like this:


    ```

    print(len(prices))

    ```


    You can use .count() to see how many times an item appears in a tuple. For example:'
