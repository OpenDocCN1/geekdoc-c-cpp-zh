    已发布。不过原理是相同的。版本号最高的是最新、最先进的模型，它根据早期版本的经验进行了改进，并包含了与当前时代相关的特性。


    在本书中，我们关注 2023 年底仍主流的 Python 版本，从 Python 3.11 及更高版本。不要担心前两个数字之后的版本差异。版本 3.11.1
    与版本 3.11.2 足够相似，因此版本差异并不重要，尤其是对初学者来说。Python 的大部分内容在所有近期版本中都是相同的。因此，你不需要担心投入时间学习一个已经过时或即将过时的版本。


    ## 成功的工具


    现在，我们需要开始设置你的电脑，以便你能够学习并亲手实践 Python。首先，你需要一个良好的 Python 解释器和编辑器。*编辑器*（editor）让你输入代码，而*解释器*（interpreter）让你运行这些代码。当你运行（或执行）代码时，你是在告诉计算机：“无论我的代码让你做什么什么，你就做什么。”


    *代码*（code）一词是指任何用编程语言编写的、用于向计算机提供指令的任何内容。*编码*（coding）一词通常用于描述编写代码的行为。代码编辑器是一个让你输入代码的应用程序，就像
    Microsoft Word 或 Apple Pages 应用程序帮助你输入普通的纯英文文本一样。


    就像世界上有许多种的牙膏、肥皂和洗发水一样，也有许多与 Python 配合良好的代码编辑器品牌。没有所谓的正确与错误之分、好坏之分、最与最差之分。只是有很多不同的产品，它们基本上在做相同的事情，但在实现方法以及编辑器创作者认为认为好的标准上略有不同。


    如果你已经开始学习 Python 并且对目前正在使用的任何工具感到满意，欢迎继续使用并忽略我们的建议。如果你刚刚开始接触这些内容，我们建议你使用 VS Code，因为它是一个优秀且免费的学习环境。


    ## 安装 Python 和 VS Code


    我们推荐并在本书中使用的编辑器正式名称为 Visual Studio Code。但大多数时候，它被读作或写为 VS Code。它是我们最喜欢的几个原因如下：


    - 它是学习编码的优秀编辑器。

    - 它是编写专业代码的优秀编辑器，被数百万专业程序员和开发者使用。

    - 它相对容易学习和使用。

    - 它在 Windows、Mac 和 Linux 上的运行方式几乎完全相同。

    - 它是免费的。

    - 它与 GitHub Copilot 完美集成，因此你可以使用现代生成式 AI 来加速学习和实际编码。


    要将 VS Code 作为你学习和实践 Python 的编辑器，你需要下载并安装 Python、VS Code 以及 VS Code 扩展。如果运气好，你已经有一些使用应用程序的经验，所以这并不困难。你需要按照屏幕上的指令进行操作。如果遇到任何不熟悉的选择，只需选择默认（建议的）选项。以下是下载和安装
    Python 和 VS Code 的步骤：


    1. 使用任何浏览器访问 www.python.org。

    2. 点击“Download”（下载），如果要求选择版本，请选择建议的稳定版本。

    3. 打开下载 Python 的文件夹，双击下载的文件图标以安装 Python。在安装过程中，你只需按照屏幕上的指令操作并接受任何建议的默认设置即可。

    4. 访问 https://code.visualstudio.com/ 并下载适用于你操作系统的当前版本 VS Code。

    5. 打开下载 Visual Studio code 的文件夹，双击下载的文件图标，并按照屏幕上的指令安装 VS Code。


    安装 VS Code 后，你应该能够像启动系统中的任何其他程序一样启动它。在 Windows 中，点击“开始”菜单查找 Visual Studio Code
    图标。在 Mac 上，你应该可以在“应用程序”文件夹或启动台中找到它。


    ## 安装 Python 扩展


    要使用 VS Code 进行 Python 编码，你需要安装 VS Code Python 扩展。当你打开 VS Code 时，你会看到窗口左侧列出了一些图标。将鼠标悬停在任何图标上会显示其名称。在扩展面板顶部的搜索框中输入
    Python。点击 Microsoft 提供的 Python 扩展旁边的“Install”（安装）按钮（见图 1-1）。


    ![](img/be36b4e9a8416f1ae2a35bd745f1cb_0.png)


    **图 1-1：** 在 VS Code 中获取扩展。


    当你完成扩展安装后，你可能会注意到 Python 和 Pylance 都被添加到 VS Code 中。不要担心，这是正常的。Pylance 提供了一些让你在
    VS Code 中学习和编写 Python 代码变得更简单的功能。为了确保扩展已激活，请退出并重启 VS Code。


    ## 让 AI 编写你的 Python 代码


    （。在扩展面板顶部的搜索框中输入 Python。点击 Microsoft 提供的 Python 扩展旁边的“Install”按钮（见图 1-1）。）现代生成式
    AI 完全能够为你编写 Python 代码。然而，它并不像命令它“写一个能让我发富的 Python 应用”那么简单。目前还没有这样做。遗憾的是，你需要将其拆解，并使用准确的术语。


    ## 使用 Copilot


    GitHub Copilot 是另一个能够编写 Python 的 AI 工具。它直接集成在 VS Code 中。如果你正在学习，可以随时点击它来禁用。要使用
    Copilot，你需要搜索以找到最新的操作指令。基本上，它的工作原理如下：


    1. 如果你还没有 GitHub 账户，请访问 https://github.com 并创建一个账户。确保你知道你的用户名和密码，因为设置 Copilot
    时需要它们。

    2. 如果 VS Code 未打开，请打开它。

    3. 点击左列的“Extensions”（扩展），然后在搜索框中输入 Copilot 进行搜索。会出现一个 Copilot 扩展列表。

    4. 点击 GitHub Copilot 扩展（不是“Copilot Labs”）或出现的任何其他扩展右边的“Install”（安装）按钮，如图 1-2 所示。


    ![](img/be36b4e9a8416f1ae2a35bd745f1cb_21_0.png)


    扩展图标安装 GitHub Copilot


    **图 1-2：** VS Code 中的 Copilot 扩展。


    你会在右侧看到一些指令和提示。你可能不需要对这些做任何操作。在 VS Code 的左下角，你应该看到一个账户图标（见图 1-3）。点击该图标并使用 GitHub
    登录以使用 Copilot。但记住：设置 Copilot 账户不是强制要求的，只是一个选项。所以不要觉得现在就必须完成过程。但如果你添加了 Copilot
    扩展，每当你查看 VS Code 扩展时，都会在已安装下看到它的名称。

