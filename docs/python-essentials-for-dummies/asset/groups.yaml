    you can’t use the assignment operator, =, to change the value of an item in a
    tuple because a tuple is immutable, meaning its content cannot be changed.


    Any method that alters, or even just copies, data in a list causes an error when
    you try it with a tuple. So the list methods .append(),.clear(), .copy(),.extend(),.insert(),.pop(),.remove(),.reverse(),
    and .sort() would fail when working with tuples. In short, a tuple makes sense
    if you want to show data to users without giving them any means to change any
    of the information.


    # Working with Sets


    Python also offers sets as a means of organizing data. One difference between
    a set and a list is that the items in a set have no specific order. Even though
    you may define the set with the items in a certain order, none of the items get
    index numbers to identify their position.


    To define a set, use curly braces where you use square brackets for a list and
    parentheses for a tuple. For example, here’s a set with some numbers in it:


    ```

    sample_set = {1.98, 98.9, 74.95, 2.5, 1, 16.3}

    ```


    Sets are similar to lists and tuples in a few ways. You can use len() to determine
    how many items are in a set. Use in to determine whether an item is in a set.


    But you can’t get an item in a set based on its index number. Nor can you change
    an item already in the set. You can’t change the order of items in a set. So you
    can’t use .sort() to sort the set or .reverse() to reverse its order.


    You can add a single new item to a set using .add(), as in the following example:


    ```

    sample_set.add(11.23)

    ```


    Note that unlike a list, a set never contains more than one instance of a value.
    So even if you add 11.23 to the set multiple times, the set will still'
  - '[PAGE 102]


    contain only one copy of 11.23.


    You can also add multiple items to a set using .update(). But the items you''re
    adding should be defined as a list in square brackets, as in the following example:


    ```

    sample_set.update([88, 123.45, 2.98])

    ```


    You can copy a set. However, because the set has no defined order, when you display
    the copy, its items may not be in the same order as the original set.


    Lists and tuples are two of the most commonly used Python data structures. Sets
    don''t seem to get as much play as the other two, but it''s good to know about
    them.'
