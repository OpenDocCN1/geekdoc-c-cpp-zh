    ## 使用 Python 爬取网页


    当你从网络请求页面时，它通常以网页的形式交付给你，通常由 HTML 和内容组成。HTML 是一种标记代码，配合另一种名为 CSS 的语言，告诉浏览器如何根据尺寸、位置、字体、图像以及所有其他视觉和样式问题显示内容。在网页浏览器中，你看不到
    HTML 或 CSS 代码。你只能看到内容，而这些内容通常包含在页面 HTML 代码块中。


    即使你在网页上看到的大部分数据来自数据库，你也没有权限直接访问数据库。但是，你可以使用一种名为“网页爬取”（web scraping）的技术从网页中提取数据并用于其他用途。Python
    具有强大的网页爬取能力，这是大多数人想要学习的热门话题。因此，我们将使用图 12-5 中的示例页面作为工作示例，开始学习网页爬取。


    ## Python 3 速查表


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_166_0.png)


    网页爬取示例。告诉浏览器如何显示该页面内容的代码在浏览器中是不可见的，除非你查看源代码。在大多数浏览器中，你可以通过按下 F12 键或在页面空白处点击右键并选择“查看源代码”或“检查”或其他选项来实现。在大多数页面上，真实内容——你在浏览器中看到的内容——是
    `<body>` ... `</body>` 标签。在页面主体内，可能会有头部、导航栏、页脚、可能的广告等部分。在该特定页面中，内容的精华位于 `<article>`
    ... `</article>` 标签之间。你在网页上看到的每个方块 [图 12-5] 都被称为“卡片”（card），每个卡片都定义在 `<a>` ...
    `</a>` 标签中。


    [图 12-6] 显示了页面 [图 12-5] 的部分 HTML 代码。我们展示了页面中前两个链接的代码，但所有的链接都遵循相同的结构，并且它们都包含在由
    `<article>` ... `</article>` 标签指定的区域内。


    在 Python 代码中，你需要三个模块：来自 `urllib` 的 `request` 模块，允许你向网络请求资源并读取网络返回的内容。这是 Python
    自带的标准模块之一，因此你不需要获取任何新东西。


    对于网页爬取，你还需要 BeautifulSoup（它的名字来源于《爱丽丝梦游仙》书中的歌）。该模块提供了解析检索网页的工具，用于提取感兴趣的特定数据项。Python
    已经可用，但你必须使用 `pip` 安装它。在 VS Code 中，进入“终端”（Terminal）面板。如果你使用的是 Windows，输入此命令：


    ```bash

    pip install beautifulsoup4

    ```


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_167_0.png)


    你应该会在屏幕上看到一些反馈，表示 BeautifulSoup 已找到并安装。或者，如果你之前安装过，你会看到一条消息，显示要求已满足。无需担心。


    你还需要一个 HTML5 解析器。你可以使用 `html5lib`，这是另一个你现在就可以安装的模块。如果你使用的是 Windows，在 VS Code 的终端面板中输入此命令：


    ```bash

    pip install html5lib

    ```


    如果你在 Mac 上遇到错误，请在 VS Code 的终端面板中使用此命令：


    ```bash

    pip3 install html5lib

    ```


    要尝试代码，请在 VS Code 中创建一个 .py 文件并输入以下代码：


    ```python

    # 从 url 库获取 request 模块

