    ## Creating and Using Variables


    Variables are a big part of Python and all computer programming languages. A variable
    is simply a placeholder for information that may vary (change).


    In your code, a variable is represented by a variable name rather than a specific
    piece of information. Here is another way to think of it. Anytime you buy one
    or more of some product, the extended price is the unit price times the number
    of items you bought. In other words:


    > Extended Price = Quantity * Unit Price


    You can consider Quantity and Unit Price to be variables because no matter what
    numbers you plug in for Quantity and Unit Price, you get the correct extended
    price. For example, if you buy three turtle doves for $1.00 apiece, your extended
    price is $3.00 (3 * $1.00). If you buy two dozen roses for $1.50 apiece, the extended
    price is $36 because 1.5 * 24 is 36.


    ## Creating valid variable names


    In our explanation of variables, we used names like Quantity and Unit Price, and
    this is fine for a general example. In Python, you can also make up your own variable
    names, but they must conform to the following rules to be recognized as variable
    names:


    - The variable name must start with a letter or an underscore (_).

    - After the first character, you can use only letters, numbers, or underscores.

    - Variable names are case sensitive, so after you make up a name, any reference
    to that variable must use the same uppercase and lowercase letters.

    - Variable names cannot be enclosed in, or contain, single or double quotation
    marks.

    - The variable name cannot be the same as a Python keyword.


    ## Creating variables in code


    To create a variable, you use the following syntax (order of things):


    ```

    variablename = value

    ```


    where variablename is the name you make up. You can use x or y, as people often
    do in math, but in larger programs, it''s a good idea to give your variables more
    meaningful names, such as quantity or unit_price or sales_tax or user_name, so
    that you can remember you''re storing in the variable.


    The value is whatever you want to store in the variable. It can be a number, a
    string, or a Boolean True or False value or result of a calculation.


    The = sign is the assignment operator and is so named because it assigns the value
    (on the right) to the variable (on the left). For example, in the:


    ```

    x = 10

    ```


    we are storing the number 10 in a variable named x. In other words, we’re assigning
    the value 10 to the x variable.


    And here:


    ```

    user_name = "Alan"

    ```


    we’re putting the string Alan in a variable named user_name.


    ## Manipulating variables


    Much of computer programming revolves around storing values in variables and manipulating
    that with operators. Following are some simple examples to help you get the hang
