    \ the mathematical constant tau (6.283185 ...). |\n\n## Formatting Numbers\n\n\
    Over the years, Python has offered different methods for displaying numbers in\
    \ familiar ways to humans. For example, most people would rather see dollar amounts\
    \ expressed in the format $1,234.56 or 1234.560065906594056959. The easiest way\
    \ to format numbers in Python, starting with version 3.6, is to use f-strings.\n\
    \n## Formatting with f-strings\n\nFormat strings, or f-strings, are the easiest\
    \ to format data in Python. All you need is a lowercase f or uppercase F followed\
    \ immediately by some text or expressions enclosed in quotation marks. Here is\
    \ an example:\n\n```\nf\"Hello {username}\"\n```\n\nThe **f** before the first\
    \ quotation mark tells Python that what follows is a format string. Inside the\
    \ quotation marks, the text, called the *literal* part, is displayed literally\
    \ (exactly as typed in the f-string). Anything in curly braces is the *expression*\
    \ part of the f-string, a placeholder for what will appear when the code executes.\
    \ Inside the curly braces, you can have an *expression* (a formula to perform\
    \ some calculation, a variable name, or a combination of the two). Here is an\
    \ example:\n\n```\nusername = \"Alan\"\nprint(f\"Hello {username}\")\n```\n\n\
    When you run this code, the `print` function displays the word **Hello**, followed\
    \ by a space, followed by the contents of the `username` variable, as shown in\
    \ [Figure 5-2].\n\n![](img/be36b4e9a8416f1ae2a353bd745f71cb_61_0.png)\n\n**FIGURE\
    \ 5-2**: A super simple f-string for formatting. Here is another example of an\
    \ expression — the `quantity` times `unit_price` — inside the curly braces:\n\n\
    ```\nunit_price = 49.99\nquantity = 30\nprint(f\"Subtotal: ${quantity * unit_price}\"\
    )\n```\n\nThe output from that, when executed, follows:\n\n```\nSubtotal: $1499.7\n\
    ```\n\n**$1499.7** isn't an ideal way to show dollar amounts. Typically we like\
    \ to use commas in the thousands places, and two digits for the pennies, as in\
    \ the following:\n\n```\nSubtotal: $1,499.70\n```\n\n## Showing dollar amounts\n\
    \nFortunately, f-strings provide you with the means to do this formatting next.\
    \ To get a comma to appear in the dollar amount and the pennies as two digits,\
    \ you can use a format string inside the curly braces. The format string starts\
    \ with a colon and needs to be placed inside the closing brace, right against\
    \ the variable name or the value shown. To show commas in thousands places, use\
    \ a comma in your format string right after the colon, like this:\n\n```\n:,\n\
    ```\n\nUsing the current example, you would do the following:\n\n```\nprint(f\"\
    Subtotal: ${quantity * unit_price:,}\")\n```\n\nExecuting this produces this output:\n\
    \n```\nSubtotal: $1,499.7\n```\n\nTo get the pennies to show as two digits, follow\
    \ the comma with\n\n```\n.2f\n```\n\nThe .2f means \"two decimal places, fixed\"\
    \ (never more or less than two places). The following code will display the number\
    \ with commas and two decimal places:\n\n```\nprint(f\"Subtotal: ${quantity *\
    \ unit_price:.2f}\")\n```\n\nHere's what the code displays when executed:\n\n\
    ```\nSubtotal: $1,499.70\n```\n\nPerfect! That's exactly the format we want. So\
    \ anytime you want to show a number with commas in the thousands places and exactly\
    \ two digits after the decimal point, use an f-string with the format string `.2f`.\n\
    \n## Formatting percent numbers\n\nNow suppose your app applies sales tax. The\
    \ app needs to know the sales tax rate, which should be expressed as a decimal\
    \ number. If the sales tax rate is 6.5 percent it has to be written as 0.065 (or\
    \ .065, if you prefer) in your code, like this:\n\n```\nsales_tax_rate = 0.065\n\
    ```\n\nIt's the same amount with or without the leading zero, so use whichever\
    \ format works for you. This format is ideal for Python, and you wouldn't want\
    \ to mess with that. If you want to display that number to a human, simply using\
    \ the `print()` function displays exactly as Python stores it:\n\n```\nsales_tax_rate\
    \ = 0.065\nprint(f\"Sales Tax Rate: {sales_tax_rate}\")\nSales Tax Rate 0.065\n\
    ```\n\nWhen displaying the sales tax for people to read, you'll probably want\
    \ to use the more familiar 6.5% format rather than .065. You can use the same\
    \ idea with fixed numbers (.2f). However, you replace the f for fixed numbers\
    \ with %, like this:\n\n```\nprint(f\"Sales Tax Rate: {sales_tax_rate:.2%}\")\n\
    ```\n\nRunning this code multiplies the sales tax by 100 and follows it with a\
    \ percent sign (%).\n\n## Formatting width and alignment\n\nYou can also control\
    \ the width of your output (and the alignment of content within that width) by\
    \ following the colon in your f-string with `<` (left aligned), `^` (centered),\
    \ or `>` (right aligned). Put any of these characters after the colon in your\
    \ format string. For example, the following will make the output 20 characters\
    \ wide, with the content aligned right:\n\n```\n:>20\n```\n\n![](img/be36b4e9a8416f1ae2a353bd745f71cb_63_0.png)\n\
