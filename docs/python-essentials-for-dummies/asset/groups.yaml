    \n## 控制动作的主要运算符\n\n你通过做出决策来控制你的程序（以及计算机）的行为，这通常涉及进行比较。你使用运算符（如表 6-1 所示）来完成比较。这些运算符通常被称为关系运算符或比较运算符，因为通过比较项目，计算机正在确定两个项目之间的关系。\n\
    \n## 表 6-1 用于决策的 Python 比较运算符\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| == | 等于 |\n\
    | != | 不等于 |\n| < | 小于 |\n| > | 大于 |\n| <= | 小于或等于 |\n| >= | 大于或等于 |\n\nPython\
    \ 还提供了三个逻辑运算符，也称为布尔运算符，允许你在做出最终决策之前评估多次比较。这些运算符使用的英文单词基本上就是它们的含义，如表 6-2 所示。\n\n\
    ## 表 6-2 Python 逻辑运算符\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| and | 都为真 |\n| or |\
