    expressed in the format $1,234.56 or 1234.560065906594056959. The easiest way
    to format numbers in Python, starting with version 3.6, is to use f-strings.


    # Formatting with f-strings


    Format strings, or f-strings, are the easiest to format data in Python. All you
    need is a lowercase f or uppercase F followed immediately by some text or expressions
    enclosed in quotation marks. Here is an example:'
  - '[PAGE 61]


    ```

    f"Hello {username}"

