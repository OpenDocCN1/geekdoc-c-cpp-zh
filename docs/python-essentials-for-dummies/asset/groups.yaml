    a learner, you can use comments in code as notes to yourself about what the code
    is doing. These can help a lot when you’re first learning.


    However, comments in code aren’t strictly for beginners. When working in teams,
    professionals often use comments to explain to team members what their code is
    doing. Developers also put comments in their code as notes to themselves so that
    they review the code in the future, they can refer to their own notes for reminders
    on why they did something in the code. Because a comment isn’t code, your wording
    can be anything you want. However, to be identified as a comment, you must do
    one of the following:


