    \n你可以在 try 块中堆叠 `except:` 语句来处理不同的错误。请注意，当异常发生时，它会从顶部开始检查每一个语句。如果它找到了一个与异常匹配的处理器，就会抛出该异常。如果发生了你没有处理的异常，你将获得标准的\
