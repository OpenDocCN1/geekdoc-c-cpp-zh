- md: '

    You''ll be using the ever-popular Visual Studio Code (VS Code) editor in this
    book to learn Python and create Python apps. We assume that you''ve already set
    up your learning and development environment, as described in the previous chapters,
    and know how to open VS Code. To follow along in this chapter, start with these
    steps:


    - 1. Use Launchpad on a Mac or the Start menu in Windows to open VS Code, and
    choose File ⇒ Open Folder or the Explorer pane in VS Code to open the Python Essentials
    folder you create in [Chapter 2](#).

    You may notice a new folder named .vscode with your other files. Don''t worry;
    it''s just information used by VS Code, and you can ignore it for now.

    - 2. If you created the hello.py file as described in [Chapter 2](#), click it;
    otherwise, create it now and then come back here.

    - 3. Select all the text on the first line and delete it that you can start from
    scratch.


    At this point, hello.py should be open in the editor, as shown in [Figure 4-1](#).
    If any other tabs are open, close them by clicking the X in each.


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_41_0.png)


    FIGURE 4-1: The hello.py file, open for editing in VS Code.


    ## Typing and Using Python Comments


    Before you type any code, start with a programmer’s comment. A programmer’s comment
    (usually called a comment for short) is text in the program that does nothing.
    Which brings up the question, “If it doesn’t do anything, why type it in?” As
    a learner, you can use comments in code as notes to yourself about what the code
    is doing. These can help a lot when you’re first learning.


    However, comments in code aren’t strictly for beginners. When working in teams,
    professionals often use comments to explain to team members what their code is
    doing. Developers also put comments in their code as notes to themselves so that
    they review the code in the future, they can refer to their own notes for reminders
    on why they did something in the code. Because a comment isn’t code, your wording
    can be anything you want. However, to be identified as a comment, you must do
    one of the following:


    - Start the text with a pound sign (#)

    - Enclose the text in triple quotation marks ("""" or '''''''''''')


    ```

    # This is a Python comment

    ```


    To type a Python comment into your own code:


    - 1. In VS Code, click next to the 1 under the hello.py tab and type the following:


    ```

    # This is a Python comment in my first Python app.

    ```


    - 2. Press Enter.


    The comment you typed appears on line 1. The comment text will be green if you’re
    using the default color theme.


    Although you won’t use multiline comments just yet, be aware that you can type
    longer comments in Python by enclosing them in triple quotation marks. These larger
    comments are called docstrings and often appear at the top of a Python module,
    function, class, or method definition, which are app building blocks.


    You can have an unlimited number of comments in your code. If you’re waiting for
    something to happen after you type a comment ... don’t. When you’re working in
    an editor like this, code doesn’t do anything until you run it. Before you start
    typing code, you need to start with the absolute basics.


    ## Understanding Python Data Types


    You deal with written information all the time and probably don’t think about
    the difference between numbers and text. Numbers are amounts, such as 10 or 123.45.
    Text consists of letters and words. For computers, the big difference is that
    they can do arithmetic (subtract, multiple, divide) with numbers, but not with
    letters and words.


    ## Numbers


    Numbers in Python must start with a number digit, (0–9); a dot (period), which
    is a decimal point; or a hyphen (-) used as a negative sign for negative numbers.
    A number can contain only one decimal point. It should not contain letters, spaces,
    dollar signs, or anything else that isn’t part of a normal number.


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_43_0.png)


    > TIP If you’re worried that the number rules won’t let you work with dollar amounts,
    zip codes, addresses, or anything else, stop worrying. You can store and work
    with all kinds of information, as you’ll see shortly.


    ## Integers


    An integer is any whole number, positive or negative. There is no limit to its
    size. Numbers such as 0, –1, and 99999999999999 are all perfectly valid integers.
    From your perspective, an integer is just any valid number that doesn’t contain
    a decimal point.


    ## Floats


    A floating-point number, often called a float, is any valid number that contains
    a decimal point. Again, there is no size limit: 1.1 and –1.1 and 123456.789012345
    are all perfectly valid floats.


    If you work with very large scientific numbers, you can use an e in a number to
    indicate the power of 10. For example, 234e1000 is a valid number, and will be
    treated as a float if there''s no decimal point.

