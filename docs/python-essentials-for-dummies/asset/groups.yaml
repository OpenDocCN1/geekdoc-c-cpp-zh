    def hello():

    ```


    This is a function, but it doesn’t do anything. To make the function do something,
    you have to write Python code on subsequent lines. To ensure that the new code
    is “inside” the function, indent each of those lines.


    > REMEMBER Indentations matter big time in Python. There is no command that marks
    the end of a function. All indented lines below the def line are part of that
    function. The first un-indented line (indented as far out as the def line) is
    outside the function.


    To make this function do something, put an indented line of code under def. We’ll
