    ## Scraping the web with Python


    Whenever you request a page from the web, it''s delivered to you as a web page
    usually consisting of HTML and content. HTML is markup code that, with another
    language called CSS, tells the browser how to display the content in terms of
    size, position, font, images, and all other visual, stylistic matters. In a web
    browser, you don''t see HTML or CSS code. You see only the content, which is generally
    contained in blocks of HTML code on the page.


    Even much of the data you see on a web page comes from a database, you don''t
    have permission to access the database directly. However, you can use a technique
    known as web scraping to pull data from the web page for use in some other manner.
    Python has great web-scraping capabilities, and this is a hot topic most people
    want to learn about. So we''ll get started with web scraping using the sample
    page from Figure 12-5 as our working example.


