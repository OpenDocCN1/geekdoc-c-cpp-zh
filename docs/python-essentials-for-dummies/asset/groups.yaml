    为你提供了字符串操作符和函数。或者你可以在网络上搜索 Python 字符串方法以查找哪些可用方法。


    ## 揭示日期和时间


    在计算机世界中，我们经常使用日期和时间进行调度，或者计算任务何时到期，或者已经过期了多少天。我们有时使用时间戳来精确记录用户何时执行了某项操作或事件何时发生。在
    Python 中使用日期和时间的理由有很多，但令人惊讶的是，它并没有像字符串和数字那样的专门针对这些内容的内置数据类型。


    要处理日期和时间，你通常需要使用 `datetime` 模块。像任何模块一样，你必须在使用之前先导入它。你可以通过使用 `import datetime`
    来实现。而且像任何导入一样，如果你喜欢，可以为其添加一个更容易输入的别名（昵号）。例如，使用 `import datetime as dt` 也可以。你只需要记住在调用该模块的功能时，在代码中输入
    `dt` 而不是 `datetime`。


    `datetime` 模块提供了一种在 Python 中处理日期和时间的简单方法。它提供了三种存储关于日期、时间和时区信息的方法，包括：


    - `datetime.date`: 由月、日、年组成的日期（但不包含时间信息）。

    - `datetime.time`: 由时、分、秒、微秒以及（如果需要）可选的时区信息组成的时间（但不包含日期）。

    - `datetime.datetime`: 由日期、时间以及（可选的）时区信息组成的单个数据项。


    在前面的列表中，我们在每个类型之前都加上了完整的单词 `datetime`，但如果你使用了别名（如 `dt`），你可以在代码中使用它代替。


    我们将在接下来的章节中分别讨论这些每数据类型。


    ## 处理日期


    当时间不是问题时，`datetime.date` 数据类型是处理日期的理想选择。你可以通过两种方式创建日期对象。你可以使用 `today()` 方法从计算机的内部时钟中获取今天的日期。或者你可以在括号内指定年、月、日（按此顺序）。


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_71_0.png)


    **记住**在指定月份或日期时，永远不要为 `datetime.date()` 使用前导零。例如，2024 年 4 月 1 日必须表示为 `2024,4,1`
    —— 如果使用 `2024,04,01`，它将无法工作。


    导入 `datetime` 模块后，你可以使用 `date.today()` 从计算机内部时钟获取当前日期。或者使用 `date(year, month,
    day)` 语法为其他日期创建日期对象。以下代码显示了两种方法：


    ```python

    # 导入 datetime 模块，别名为 dt

    import datetime as dt

    # 将今天的日期存储在名为 today 的变量中。

    today = dt.date.today()

    # 将另一个日期存储在名为 last_of_teens 的变量中。

    last_of_teens = dt.date(2019, 12, 31)

    ```


    你可以使用 `.month`, `.day` 和 `.year` 提取日期对象的任何部分。例如，在同一个 Python 提示符执行这段代码：


    ```python

    print(last_of_teens.month)

    print(last_of_teens.day)

    print(last_of_teens.year)

    ```


    该日期的三个组成部分中的每一个都会显示在单独的一上：


    ```

    12

    31

    2023

    ```


    你可以按照自己想要的方式格式化日期和时间。使用我们在本章稍早讨论过的 f-strings，并结合 https://docs.python.org/3/library/datetime.html
    上显示的字符串格式化指令（大约位于页面顶部向下约四之三处），这些指令包含了日期的格式以及后续的格式，正如我们将在本章稍晚时候讨论的那样。对于显示本地日期和时间的指令，具体格式将取决于你所在地。例如，在美国使用
    `%x` 显示日期 2023 年 12 月 18 日将显示为 `12/18/23`，但在更习惯先显示日期而不是月份的国家，结果则不同。


    使用格式化字符串时，确保在希望它们在输出中出现的地方，在指令之间放置空格、斜杠以及你想要的任何其他内容。例如，这个：


    ```python

    print(f"{last_of_teens:%A, %B %d, %Y}")

    ```


    执行时，会显示：


    ```

    Tuesday, December 31, 2019

    ```


    要以 mm/dd/yyyy 格式显示日期，使用 `%m/%d/%Y`，如下：


    ```python

    todays_date = f"{today:%m/%d/%Y}"

    ```


    当你尝试时，输出将是当前日期，格式如下：


    ```

    11/19/2024

    ```


    **表 5-6** 显示了你可以用不同日期尝试的更多一些示例。


    ### 5-6 示例日期字符串


    | 格式字符串 | 示例 |

    | :--- | :--- |

    | %a, %b %d %Y | Sat, Jun 01 2024 |

    | %x | 06/01/24 |

    | %m-%d-%y | 06-01-24 |

    | %A %B %d | Saturday June 01 |

    | %A %B %d %Y | Saturday June 01 of 2024 |


    有时你只想处理日期，有时你只想处理时间。通常你想同时使用日期和时间来精确定时间中的某个时刻。为此，请使用 `datetime` 模块中的 `datetime`
    类。该类支持一个 `now()` 方法，可以从计算机时钟获取当前日期和时间，如下：


    ```python

    import datetime as dt

    right_now = dt.datetime.now()

    print(right_now)

    ```


    你在屏幕上通过 `print()` 函数看到的内容取决于执行这段代码的时间。`datetime` 值的格式如下：


    ```

    2024-11-19 14:03:07.52975

    ```


    这意味着 2024 年 11 月 19 日下午 2:03（附加了 7.529 秒）。你也可以使用以下任何参数定义一个 `datetime`。月、日、年是必须的。其他是可选的，如果你省略了它们，时间部分将设置为
    0：


    ```python

    datetime(year, month, day, hour, minute, second, microsecond)

    ```


    这里是使用某些参数定义 `datetime` 的示例：


    ```python

    import datetime as dt

    years_eve = dt.datetime(2024, 12, 31, 23, 59)

    print(years_eve)

    ```


    这意味着 2024 年 12 月 31 日晚上 11:59。


    ### 5-7 示例时间字符串


    | 格式字符串 | 示例 |

    | :--- | :--- |

    | %A, %B %d %Y | Tuesday, December 31, 2024 |

    | %m/%d/%Y | 12/31/2024 |

    | %H:%M:%S | 23:59:00 |

    | %b %d, %y | Dec 31, 24 |


    '
