    # # Chapter 12

    # Interacting with the Internet


    +   **IN THIS CHAPTER**

    - Understanding how the web works

    - Opening web pages from Python

    - Using Python to post to the web

    - Web scraping with Python


    As you probably know, the internet is home to virtually all the world’s knowledge.
    Most of us use the web all the time to find information. We do so using a web
    browser such as Safari or Google Chrome. To visit a website, you type a Uniform
    Resource Locator (URL) into your browser’s address bar and press Enter, or you
    click a link that sends you to the page automatically. This is the most complicated
    chapter in our book, but it is one of the most interesting to play with.


    As an alternative to browsing with your web browser, you can access its content
    programmatically. In other words, you can use a programming language such as Python
    to post information to the web, as well as to access web information. In this
    chapter, you learn about the two main modules for accessing the web programmatically
    with Python: `urllib` and `BeautifulSoup`.


    # ## Seeing How the Web Works


    When you open up your web browser and type in a URL or click a link, that action
    sends a *request* to the internet. The internet directs your request to the appropriate
    web server, which in turn sends a *response* back to your computer. Typically
    that response is a web page, but it can be just about any file. Or it can be an
    error message if what you'
- md: '

    requested no longer exists at that location. But the important thing is that you,
    the user (a human being), and your user agent (the program you''re using to access
    the internet) are on the client side of things. The server, which is just a computer,
    not a person, sends back its response, as illustrated in Figure 12-1.


    # Client (person)


    # Server (machine)


    Request


    Response


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_159_0.png)


    **FIGURE 12-1:** The client makes a request, and the server sends back a response.


    ## Understanding the mysterious URL


    The URL is a key part of accessing a web page, because that''s how the internet
    finds the resource you''re seeking. On the web, most resources use Hypertext Transfer
    Protocol (HTTP), thus their URLs start with `http://` or `https://`. The difference
    is that `http://` sends across the wire in its raw form, which makes it susceptible
    to hackers and others who can “sniff out” the traffic. The https protocol is *secure*
    in that the data is *encrypted*, which means it''s converted to a secret code
    that''s not easy to read. Typically, any site with whom you do business and to
    whom you transmit sensitive information, such as passwords and credit card numbers,
    uses `https` to keep that information secure and secret.


    The URL for any website can be relatively simple, such as Alan''s URL, which is
    `https://alanspson.me`. Or it can be complex, to add more information to the request.
    Figure 12-2 shows the parts of a URL, some of which you may have noticed in the
    past.


    Note that the order matters. For example, it''s possible for a URL to contain
    a path to a specific folder or page (starting with a slash right after the domain
    name). The URL can also contain a query string, which is always last and always
    starts with a question mark (?). After the question mark comes one or more name=value
    pairs, basically the same syntax you''ve seen in data dictionaries and JSON. If
    there are multiple name=value pairs, they are separated by ampersands (&).


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_160_0.png)


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_160_1.png)


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_160_2.png)


    FIGURE 12-2: Different parts of URLs.


    ## Exposing the HTTP headers


    When you''re using the web, all you care about is the stuff you see on your screen.
    At a deeper, somewhat hidden level, the two computers involved in the transaction
    are communicating with one another via HTTP headers. The headers are not normally
    visible to the human eye, but they are accessible to Python, your web browser,
    and other programs.


    The product we use most to view headers is HTTP Headers, which is a Google Chrome
    extension. If you have Chrome and want to try HTTP Headers for yourself, you can
    download and install HTTP Headers from the Chrome Web Store at https://chromewebstore.google.com.
    After you''ve installed the extension, see the headers included whenever you''ve
    just visited a site, click the HTTP Headers icon in your Chrome toolbar (it looks
    like a cloud) and you can see the HTTP header information (see Figure 12-3).


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_161_0.png)


    **Figure 12-3:** Inspecting HTTP headers with Google Chrome.


    Two of the most important things in the HTTP headers are at the top, where you
    see GET followed by a URL. This tells you that a GET request was sent, meaning
    the URL is a request for information; nothing is being uploaded to the server.
    The URL after the word GET is the requested resource. Another type of response
    is POST, which means there''s some information you''re sending to the server,
    such as when you post on Facebook or X (formerly Twitter).


    The line below the GET shows the status of the request. The first part indicates
    the protocol used. In the example in Figure 12-4, the protocol is HTTP1.1, which
    means the web request follows the HTTP version 1.1 rules of communication. The
    200 is the status code, which in this case means "okay, everything went well."
    Common status codes are listed in Table 12-1.


    All of what we''ve been telling you here matters because it''s related to accessing
    the web programmatically with Python, as you''ll see next.


    ## Opening a URL from Python


    To access the web from a Python program, you need to use aspects of the `urllib`,
    or URL Library, package. this one library contains modules, each of which provides
    capabilities that are useful for different aspects of accessing the internet programmatically.
    Table 12-2 summarizes the packages.


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_162_0.png)


    FIGURE 12-4: HTTP headers.


    ### TABLE 12-1: Common Status Codes


    | Code | Meaning | Reason |

    | :--- | :--- | :--- |

    | 200 | Okay | Everything went well. |

    | 400 | Bad Request | Something is wrong with the request. |

    | 403 | Forbidden | The site doesn''t allow access. |

    | 404 | Not Found | The URL is not there. |

    | 500 | Internal Server Error | The server encountered an error. |


    ### TABLE 12-2: urllib Packages


    | Package | Purpose |

    | :--- | :--- |

    | request | Opens URLs |

    | response | Handles response |

    | error | Handles exceptions |

    | parse | Analyzes URLs |

    | cookie | Handles cookies |

    | robotparser | Handles robots.txt |


    ```python

    from urllib import request

    # URL (address) of the desired page,

    sample_url = ''https://free.ai/sample.html''

    # Request the page and put it in a variable named the page.

    the_page = request.urlopen(sample_url)

    # Put the response code in a variable named status.

    status = the_page.code

    ```


    # What is the data type of the page?

    print(type(the_page))

    # What is the status code?

    print(status)

    ```

    Running this code displays this output:

    ```

    <class ''http.client.HttpResponse''>

    200

    ```

    The variable the_page contains an http.client.HttpResponse object, which is everything
    the server sent back in response to the request. The 200 is the status code that
    tells you all went well.


