    Proper syntax in programming languages is every bit as important as it is in human
    languages — even more so, in some ways, because when you make a mistake speaking
    or writing to someone, that other person can usually figure out what you meant
    by the context of your words. But computers aren''t nearly smart. Computers don''t
    have brains, can''t guess your actual meaning based on context, and in fact the
    concept of context doesn''t even exist for computers. So syntax matters more in
    programming languages than in human languages.


    Looking back at the earliest code in this chapter, note that most of the lines
    of actual code (not the comments, which start with #) follow this syntax:


    ```

    variablename = value

    ```


    where variablename is some name you made up, and value is something you are storing
    in that variable. It works because it''s the proper syntax. If you try to do it
    like this, it won''t work:


    ```

    value = variablename

    ```


    For example, the following is the correct way to store the value 10 in a variable
    named x:


    ```

    x = 10

    ```


    It might seem you could also do it the following way, but it won''t work in Python:


    ```

    10 = x

    ```


    If you typed it that way in VS Code, you''d see some wavy underlines beneath the
    code, indicating that you didn''t follow the rules of syntax, and your code can''t
    be executed as written. You can touch the mouse pointer to any code that shows
    a wavy underline, to see more information about the error.


    In Python, a line of code ends with a line break or a semicolon. For example,
    this is three lines of Python code:


    ```

    first_name = "Alan"

    last_name = "Simpson"

    print(first_name, last_name)

    ```'
