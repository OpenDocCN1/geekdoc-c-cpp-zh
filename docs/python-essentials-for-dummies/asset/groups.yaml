    One of the secrets Python’s success is that it’s composed of a simple, clean,
    core language. That’s the part you need to learn first. In addition to that core
    language, many, many modules are available that you can grab for free and access
    from your own code. These modules are also written in the core language, but you
    don’t need to see that or even know because you can access all the power of modules
    from the basic core language.


    Most modules are for some specific application such as science or artificial intelligence
    or working with dates and time or ... whatever. The beauty of using modules is
    that other people spent a lot of time creating, testing, and fine-tuning that
    module so that you don’t have to. You simply import the module into your Python
    file, and use the module’s capabilities as instructed in the module’s documentation.


    The sample Magic 8 Ball program in the previous section starts with this line:


    ```

    import random

    ```


    The core Python language has nothing built into it to generate a random number.
    Although we could figure out a way to make a random number generator, we don’t
    need to because someone has figured out how to do it and has made the code freely
    available. Starting your program with `import random` tells the program that you
    want to use the capabilities of the random number module to generate a random
    number. Then, later in your program, you generate a random number between 1 and
    8 with this line of code:


    ```

    answer = random.randint(1, 8)

    ```


    As mentioned earlier, in your own Python code, you must import a module before
    you can access its capabilities. The syntax for doing so is


    ```

    import modulename [as alias]

    ```


    Code written in a generic format like that, with some parts in italic and some
    in square brackets, is sometimes called a syntax chart because it’s not showing
