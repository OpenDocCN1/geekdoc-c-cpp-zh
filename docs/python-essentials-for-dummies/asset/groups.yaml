    Python 版本的一些信息以及 >>> 提示符，它代表 Python 解释器。


    # 输入命令


    在 Python 解释器中输入命令与在其他地方输入是一样的。你必须正确地输入命令然后按回车。如果你在命令中拼错了某个单词，你可能会看到错误消息，这只是解释器在告诉它不理解你的意思。但别担心；你不会弄坏任何东西。例如，假设你输入命令


    ```

    howdy

    ```


    按下回车后，你将看到一些技术术语乱码，它们试图告诉你解释器不知道 "howdy" 是什么意思，所以它无法执行任何操作。什么都没有弄坏。你只是回到了另一个 >>>
