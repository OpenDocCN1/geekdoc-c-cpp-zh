    ## 理解神秘的 URL


    URL 是访问网页的关键部分，因为互联网正是通过这种方式找到你所寻找的。在 Web 上，绝大多数资源都使用超文本传输协议（HTTP），因此它们的 URL 以
    `http://` 或 `https://` 开头。区别在于，`http://` 以原始形式在电线中传输，这使得它容易受到黑客或其他能够“嗅探”流量的人的攻击。https
    协议是*安全的*的，因为数据经过了*加密*，这意味着它被转换为一种不易阅读的秘密代码。通常，任何与你进行业务并对其传输敏感信息（如密码和信用卡号）的网站都会使用
    `https` 来保持这些信息的安全和秘密。


    任何网站的 URL 都可以相对简单，例如 Alan 的 URL 是 `https://alanspson.me`。它也可以很复杂，以便向请求中添加更多信息。图
