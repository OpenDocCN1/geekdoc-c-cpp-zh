- md: "\n## Chapter 9\n## Sidestepping Errors\n\nIN THIS CHAPTER\n\n- Discovering\
    \ exceptions\n- Finding out how to handle errors gracefully\n- Making sure your\
    \ app doesn’t crash\n- Checking out try ... except ... else ... finally\n- Learning\
    \ to raise your own exceptions\n\nWe all want our programs to run perfectly all\
    \ the time. But sometimes, situations in the real world stop a program from running.\
    \ The problem isn’t with you or your program. Usually, the person using the program\
    \ did something wrong. Error handling is all about anticipating these problems,\
    \ catching the error, and informing users of the problem so they can fix it.\n\
    \nThe techniques we describe here aren’t for fixing bugs in your code. You have\
    \ to fix that type of error yourself. We’re talking strictly about errors in the\
    \ environment in which the program is running, over which you have no control.\
    \ Handling the error is simply a way of replacing the tech-speak error message\
    \ that Python normally displays, which is meaningless to most people, with a message\
    \ that tells users in plain English what’s wrong, and how to fix it.\n\nAgain,\
    \ users will be fixing the environment in which the program is running — they\
    \ won’t be fixing your code.\n\n## Understanding Exceptions\n\nIn Python (and\
    \ all other programming languages) the term exception refers to an error in your\
    \ code, or in the environment in which the code is running — basically anything\
    \ that prevents the program from running properly. To see a simple example, have\
    \ your Python app open a file. The syntax for that is easy:\n\n```\nname = open(filename)\n\
    ```\n\nReplace name with a name of your choosing. Replace filename with the name\
    \ of the file. If the file is in the same folder as the code, you don't need to\
    \ specify a path to the folder because the current folder is assumed.\n\nFigure\
    \ 9-1 shows an example. We used VS Code for this example so that you can see the\
    \ contents of the folder in which we worked. The folder contains a file named\
    \ filecontents.py, which is the file that contains the Python code we wrote. The\
    \ other file is named people.csv.\n\n![](img/be36b4e9a8416f1ae2a353bd745f71cb_117_0.png)\n\
    \nFIGURE 9-1: The showcontents.py and people.csv files in a folder in VS Code.\n\
    \nThe showcontents.py file contains code. The people.csv file contains data (information\
    \ about people). Figure 9-2 shows the content of the people.csv file in Excel\
    \ (top), so that it's easy for you to read, and in a text editor (bottom), which\
    \ is how it looks to Python and other languages. The file's content doesn't matter\
    \ much right now; what you're discovering here will work in any external file.\n\
    \n| A | B | C | D | E |\n|---|---|---|---|---|\n| Username | FirstName | LastName\
    \ | Role | DateJoined |\n| Rambo | Rocco | Moe | 0 | 3/1/2019 |\n| Ann | Annie\
    \ | Angst | 0 | 6/4/2019 |\n| Wil | Wilbur | Blomgren | 0 | 2/28/2019 |\n| Lupe\
    \ | Lupe | Gomez | 1 | 4/2/2019 |\n| Ina | Ina | Kumar | 1 | 1/15/2019 |\n\n![](img/be36b4e9a8416f1ae2a353bd745f71cb_118_0.png)\n\
    \n**FIGURE 9-2:** The contents of the people.csv in Excel (top) and a text editor\
    \ (bottom).\n\nThe Python code is just two lines (excluding the comments), as\
    \ follows:\n\n```\n# Open file that's in this same folder.\nthe_file = open('people.csv')\n\
    # Show the filename.\nprint(the_file.name)\n```\n\nThe first line of code opens\
    \ the file named people.csv. The second line of code displays the filename (people.csv)\
    \ on the screen. Running simple showfilecontents.py app (by right-clicking its\
    \ name in VS Code and choosing Run Python File in Terminal) displays people.csv\
    \ on the screen — assuming that a file named people.csv exists in the folder to\
    \ open. This assumption is except when exception handling comes in.\n\nSuppose\
    \ that for reasons beyond your control, the people.csv file isn't there because\
    \ some person or automated procedure failed to put it there. Or perhaps someone\
    \ misspelled the filename. It's easy to accidentally type, say, .csv rather than\
    \ .csv for the filename. There are many situations that might make the file unavailable.\
    \ Running the app when the file is unavailable raises an exception (which in English\
    \ means “displays an error message”), as you can see in the Terminal pane at the\
    \ bottom of Figure 9-3. The exception reads as follows:\n\n```\nTraceback (most\
    \ recent call last):\nFile \"c:/Users/acsimpson/Desktop/exceptions/showfilecontents.py\"\
    , line 2,\nin <module>\n    the_file = open('people.csv')\nFileNotFoundError:\
    \ [Errno 2] No such file or directory: 'people.csv'\n```\n\n![](img/be36b4e9a8416f1ae2a353bd745f71cb_119_0.png)\n\
    \n**Figure 9-3:** The showfilecontents.py file raises an exception.\n\nTraceback\
    \ is a reference to that if there were multiple exceptions, they'd all be listed,\
    \ with the most recent listed first. More specifically, if there are multiple\
    \ function calls leading to the error Traceback shows you the history of those\
    \ cases, with the most recent call first. In this case, there is just one exception.\
    \ The File tells you where the exception occurred, in line 2 of the showfilecontents.py\
    \ file. The following part shows you the line of code that caused the error:\n\
    \n```\nthe_file = open('people.csv')\n```\n\nAnd finally, the exception itself\
    \ is described:\n\n```\nFileNotFoundError: [Errno 2] No such file or directory:\
    \ 'people.csv'\n```\n\nThe generic name for this type of error is FileNotFoundError.\
    \ Many exceptions are also associated with a number (ERRNO 2 in this example).\
    \ The number can vary depending on the operating system environment, so it's typically\
    \ not used for handling errors. In this case, the main error is FileNotFoundError,\
    \ and the fact that it's ERRNO 2 where I'm sitting right now doesn't matter.\n\
    \nThe last part tells you exactly what went wrong: No file or directory: 'people.csv'.\
    \ In other words, Python can't do open('people.csv') because there is no file\
    \ named people.csv in the folder.\n\n## Handling Errors Gracefully\n\nThe best\
    \ way to handle a file-not-found error is to replace what Python displays with\
    \ something person is more likely to understand. To do that, you can code a try\
    \ ... except block using this basic syntax:\n\n```\ntry:\n    The things you want\
    \ the code to do\nexcept Exception:\n    What to do if it can't do you want\n\
    ```\n\nHere's how you can rewrite showfilecontents.py to handle a missing (or\
    \ misspelled) error:\n\n```\ntry:\n    # Open file and show its name.\n    the_file\
    \ = open('people.csv')\n    print(the_file.name)\nexcept Exception:\n    print(\"\
    Sorry, I don't see a file named people.csv here\")\n```\n\nBecause the file that\
    \ is supposed to open may be missing, you start with try: and then attempt to\
    \ open the file under that. If the file opens, the print() statement runs and\
    \ displays the filename. But trying to open the file raises an exception, the\
    \ program doesn’t bomb and display a generic error message. Instead, it displays\
    \ a message that the average computer can understand, as shown in Figure 9-4.\n\
    \n![](img/be36b4e9a8416f1ae2a353bd745f71cb_121_0.png)\n\n**Figure 9-4:** showfilecontents.py\
    \ file catches the error and displays a friendly message.\n\n## Being Specific\
    \ about Exceptions\n\nOur previous code example handled the file-not-found error\
    \ gracefully. But a larger app might have many places where there’s a potential\
    \ for error, and you need to handle each error differently. To do so, you can\
    \ define multiple error handlers, as we discuss.\n\nSuppose that you manually\
    \ fix the filename so it’s people.csv as originally intended. As shown previously,\
    \ when you run the code and there’s no error, the output is just the filename.\
    \ Below the line that prints the filename, we’ve added another line of code:\n\
    \n```\ntry:\n    # Open file and show its name.\n    the_file = open('people.csv')\n\
    \    print(the_file.name)\n    print(the_file.wokerms())\nexcept Exception:\n\
    \    print(\"Sorry, I don't see a file named people.csv here\")\n```\n"
