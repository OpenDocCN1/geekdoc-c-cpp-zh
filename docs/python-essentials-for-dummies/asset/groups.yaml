    # 引言


    Python 语言正变得越来越流行，根据 IEEE Spectrum 的数据，它在 2017 年成为世界上最流行的语言。Python 的强大是实实在实的。


    Python 之成为第一语言是因为它于学习和使用，这部分归功于其简化的语法和自然语言流，但也归功于其强大的社区和广泛的应用范围。


    # 关于本书


    本书是一本参考手册，旨在引导你学习 Python 基础知识的过程。如果你想学习许多令人兴奋的内容，那么这本书正适合你。它向你介绍了你需要深入探索的主题。


    这是一本实操性书籍，书中处有示例和代码。你将输入代码、运行代码，然后修改它来实现你的需求。


    在本书中，我们将通过小巧、易懂的步骤带你了解 Python 语言的基础。


    # 傻瓜假设


    我们假设你已经知道如何使用电脑。如果你能打开电脑并使用鼠标，你就准备好学习这本书了。我们假设你还不会编程，尽管在阅读本书后你将具备一些编程技能。


    # 本书使用的图标


    如果没有书中指向那些真正有帮助且能加速你进步信息的图标，那还是一本“傻瓜教程”吗？在这里我们简要说明书中使用的每个图标。


    - 提示（TIP）：指出可能让你的工作变得简单的有用信息。

    - 记住（REMEMBER）：标记你可能想要记得有趣事实。

    - 警告（WARNING）：突出危险。当我们使用此图标时，我们在提醒你注意。


    # 下一步


    你可以从任何地方开始，但这里有两个提示。如果你是完全的新，请前往第 1 章。


    # 从 Python 开始


    本章内容


    - 探索 Python 为什么如此火

    - 寻找工具

    - 编写代码


    # 为什么 Python 如此火


    我们承诺过不会花大量时间向你推销 Python，这并不是我们的意图。但我们想简谈一下它为什么如此火。以下是提到的 Python 流行的主要原因：


    - Python 相对容易学习。

    - 在 Python 中需要学习（以及执行）的一切都是免费的。

    - 与大多数语言相比，Python 为数据科学、机器学习、人工智能和机器人等当前热门技术提供了更多现成的工具。


    # 选择合适的 Python


    世界上有不同版本的 Python，这让许多初学者产生了如下疑问：


    - 为什么会有不同的版本？

    - 它们有什么不同？

    - 我应该学习哪一个？


    这些都是好问题，我们将从第一个开始。版本就像汽车的年份。你可以买到一辆 1968 年的福特马、1990 年的、2019 年的或2020 年的福特马。它们都是福特马。唯一的区别是年份数字最高的是目前最新的福特马。那辆车与旧型号的区别在于，它根据对早期型号的经验进行了改进，并具有与时代同步的功能。


    编程语言（以及大多数其他软件产品）也是如此。但按照惯例，我们不会为它们分配年份，因为它们不是每年发布的。它们是在……的时候发布的。


