    你将在本书中使用广受欢迎的 Visual Studio Code (VS Code) 编辑器来学习 Python 并创建 Python 应用程序。我们假设你已经按照前面的章节设置好了学习和开发环境，并知道如何打开
    VS Code。要跟上本章的内容，请按照以下步骤操作：


    - 1. 在 Mac 上使用 Launchpad 或 Windows 上使用开始菜单打开 VS Code，并在 VS Code 中选择文件 ⇒ 打开文件夹或使用资源管理器窗格，打开你在[第
    2 章](#)中创建的 Python Essentials 文件夹。

    你可能会注意到在其他文件旁边有一个名为 .vscode 的新文件夹。别担心，这只是 VS Code 使用的信息，你现在可以忽略它。

    - 2. 如果你已经按照[第 2 章](#)所述创建了 hello.py 文件，请点击它；否则，现在创建一个然后回到这里。

    - 3. 选择第一行的所有文本并将其删除，这样你就可以从零开始。


    此时，hello.py 应该已经在编辑器中打开，如[图 4-1](#)所示。如果打开了任何其他标签，请点击每个标签上的 X 将其关闭。


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_41_0.png)


    图 4-1：在 VS Code 中打开用于编辑的 hello.py 文件。


    ## 输入和使用 Python 注


    在输入任何代码之前，先从程序员注释开始。程序员注释（通常简称为注释）是程序中不起任何作用的文本。这引出了一个问题：“如果它什么用没有，为什么要写它呢？”作为一个学习者，你可以将代码中的注释作为自己的笔记，说明代码在做什么。这在你初次学习时非常有帮助。


    然而，代码中的注释并不仅仅是初学者的。在团队工作时，专业人士经常使用注释向团队成员解释他们的代码的功能。开发者还会在代码中添加注释作为自己的笔记，以便在将来审查代码时，可以参考自己的笔记来提醒为什么要在代码中执行某些操作。因为注释不是代码，你的措辞可以是任何内容。但是，为了被识别为注释，你必须执行以下操作之一：


    - 以井号 (#) 开头文本

    - 使用三引号（""" 或 ''''''''''）包裹文本


    ```

    # This is a Python comment

    ```


    要在自己的代码中输入 Python 注释：


    - 1. 在 VS Code 中，点击 hello.py 标签旁数字 1 处，输入以下内容：


    ```

    # This is a Python comment in my first Python app.

    ```


    - 2. 按回车。


    你输入的注释出现在第 1 行。如果你使用的是默认颜色主题，注释文本将是绿色的。


    虽然你暂时不会使用多行注释，但请注意，在 Python 中你可以通过三引号来编写更长的注释。这些较大的注释被称为 docstrings（文档字符串），通常出现在
    Python 模块、函数、类或方法定义的顶部，这些都是构建应用程序的基石。


    你可以在代码中编写无限数量的注释。如果你在输入注释后在等待发生什么……别等了。在这样的编辑器中工作时，代码在运行之前不会产生任何作用。在开始输入代码之前，你需要从最基础的知识开始。


    ## 理解 Python 数据类型


    你一直在处理书面信息，可能没有考虑过数字和文本之间的区别。数字是数量，例如 10 或 123.45。文本由字母和单词组成。对于计算机来说，巨大的区别在于它们可以对数字进行算术运算（减法、乘法、除法），但不能对字母和单词进行。


    ## 数字


    Python 中的数字必须以数字（0–9）、点（句号，即小数点）或用作负数的连字符（-）开头。数字只能包含一个小数点。它不应包含字母、空格、美元符号或任何不是正常数字组成的内容。


    ![](img/be36b4e9a8416f1ae2a353bd745f71cb_43_0.png)


    > 提示：如果你担心数字规则让你无法处理金额、邮政编码、地址或其他任何内容，请停止担心。你可以存储并处理各种信息，正如你很快就会看到的。


    ## 整数


    整数是任何整数字，无论是正还是负。它的大小没有限制。像 0、–1 和 99999999999999这样的数字都是完全有效的整数。从你的角度来看，整数任何不包含小数点的有效数字。


    ## 浮点数


    浮点数（通常称为 float）是任何包含小数点的有效数字。同样，没有大小限制：1.1、–1.1 以及 123456.789012345 都是完全有效的浮点数。


    如果你处理非常大的科学计数数字，可以在数字中使用 `e` 来表示 10 的幂次。例如，234e1000 是一个有效数字，如果没有小数点，它将空视为浮点数。


