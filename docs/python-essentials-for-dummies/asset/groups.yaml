    these only if your actual work (or perhaps homework) requires it. In the next
    section, you look at some number types commonly used in computer science: binary,
    octal, and hexadecimal numbers.


    If your work requires dealing with base 2, base 8, or base 16 numbers, you''re
    in luck Python has symbols for writing these as well as functions for converting
    them. Table 5-3 shows the three nondecimal bases and the digits used by each.


    # TABLE 5-3 Python for Base 2, 8, and 16 Numbers


    | System | Also Called | Digits Used | Symbol | Function |

