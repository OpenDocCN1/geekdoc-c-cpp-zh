    ## 布尔运算符


    布尔运算符作用于布尔值（True 或 False），用于判断一个或多个事物是否为 True 或 False。表 4-3 总结了布尔运算符。


    # 表格 4-3 Python 布尔运算符


    | 运算符 | 代码示例 | 决定什么 |

    | --- | --- | --- |

    | or | x or y | x 或 y 中其中一个为 True |

    | and | x and y | x 和 y 均为 True |

    | not | not x | x 不为 True |


    我们还没有告诉你什么是变量，所以示例的这部分可能让你感到困惑。接下来的我们将把这个问题说清楚。


    ## 创建和使用变量


    变量是 Python 以及所有计算机编程语言的重要部分。变量仅仅是可能会变化（改变）信息的占位符。


    在你的代码中，变量由变量名表示，而不是特定的信息。这里有另一种思考它的方式：每当你购买一件或多件某种产品时，总价就是单价乘以你购买的数量。换句话说：


    > 总价 = 数量 * 单价


    你可以将 Quantity（数量）和 Unit Price（单价）视为变量，因为无论你在 Quantity 和 Unit Price 中填入什么数字，都能得到正确的总价。例如，如果你每只
    $1.00 买了三只斑鸠鸽，你的总价就是 $3.00 (3 * $1.00)。如果你每只 $1.50 买了两打玫瑰，总价为 $36，因为 1.5 * 24
    等于 36。


    ## 创建有效的变量名


    在我们对变量的解释中，我们使用了像 Quantity 和 Unit Price 这样的名称，对于通用示例来说没问题。在 Python 中，你也可以自己命名变量，但它们必须符合以下规则才能识别为变量名：


    - 变量名必须以字母或下划线 (_) 开头。

    - 在第一个字符之后，你可以使用字母、数字或下划线。

    - 变量名对大小写敏感，因此在你命名名称后，对该变量的任何引用必须使用相同的大小写字母。

    - 变量名不能包含或单引号或双引号。

    - 变量名不能与 Python 关键字相同。


    ## 在代码中创建变量


    要创建一个变量，你使用以下语法（元素的顺序）：


    ```

    variablename = value

    ```


    其中 variablename 是你起的名称。你可以像数学中人们那样使用 x 或 y，但在较大的程序中，给变量起一个更有意义的名字是个好主意，例如 quantity
    或 unit_price 或 sales_tax 或 user_name，这样你就能记住你在变量中存储了什么。


    value 是你想要存储在变量中的任何内容。它可以是一个数字、字符串、布尔 True 或 False 值，或者是计算结果。


    `=` 符号是赋值运算符，之所以这样命名是因为它将（右侧的）值赋值给（左侧的）变量。例如：


    ```

    x = 10

    ```


    我们正在将数字 10 存储在一个名为 x 的变量中。换句话说，我们正在将值 10 赋值给变量 x。


    而在这里：


    ```

    user_name = "Alan"

    ```


    我们将字符串 Alan 放入了名为 user_name 的变量中。


    ## 操作变量


    计算机编程的大部分都围绕着在变量中存储值并使用运算符对其进行操作。以下是一些简单的示例，帮助你掌握它。如果你仍然打开着 VS Code 并显示着那条注释，请在
    VS Code 编辑器中按照步骤操作：


    - 1. 在写有 `# This a Python comment in my first Python app.` 的行下方，输入此注释并按回车：


    ```

    # This variable contains an integer

    ```


    - 2. 输入以下内容（忘记在 `=` 符号前后各加空格）并按回车：


    ```

    quantity = 10

    ```


    - 3. 输入以下内容并按回车：


    ```

    # This variable contains a float

    ```


    - 4. 输入以下内容（不要输入美元符号！）并按回车：


    ```

    unit_price = 1.99

    ```


    - 5. 输入以下内容并按回车：


    ```

    # This variable contains the result of multiplying quantity unit price

    ```


    - 6. 输入以下内容（运算符周围留有空格）并按回车：


    ```

    extended_price = quantity * unit_price

    ```


    - 7. 输入以下内容并按回车：


    - 8. 最后，输入此内容并按回车：


    ```

    print(extended_price)

    ```


    你的 Python 程序创建了一些变量，在其中存储了一些值，并根据 quantity 和 unit_price 变量的内容计算了一个新值 extended_price。最后一行在屏幕上显示了
    extended_price 变量的内容。记住，在程序运行时，注释不会起任何作用。注释只是你对程序正在发生的情况所做的笔记。


    如果你犯了任何错误，可能会在错误或样式建议附近看到波浪线，例如多余的空格或行尾漏掉的回车。在输入代码时，你必须准确。


    换句话说，如果代码是错误的，运行它时将无法工作。这非常简单——没有例外。


    ## 保存你的工作


    输入代码就像在计算机上输入其他文档一样。如果你不保存，就会丢失它。

