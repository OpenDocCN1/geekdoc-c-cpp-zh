    # # Manipulating Strings


    In Python and other programming languages, we refer to words and chunks of text
    as strings, short for “a string of characters.” A string has no numeric meaning
    or value. (We discuss the basics of strings in Book 1, Chapter 4.) In this section,
    you learn Python coding skills for working with strings.


    # # Concatenating strings


    You can join strings by using a plus sign (+). The process of doing so called
    string concatenation in nerd-o-rama world. One thing that catches beginners off
    guard is the fact that a computer doesn''t know a word from a bologna sandwich.
    So when you join strings, the computer doesn''t automatically put spaces where
    you''d expect them. For example, in the following code, `full_name` is a concatenation
    of the first three strings.


    ```

    first_name = "Alan"

    middle_init = "C"

    last_name = "Simpson"

    full_name = first_name + middle_init + last_name

    print(full_name)

    ```


    When you run this code to print the contents of the `full_name` variable, you
    can see that Python did join them in one long string:


    > AlanSimpson


    Nothing is wrong with this output, except that we usually put spaces between words
    and the parts of a person’s name.


    Because Python won’t automatically put in spaces where you think they should go,
    you have to put them in yourself. The easiest way to represent'
  - '[PAGE 66]


    a single space is by using a pair of quotation marks with one space between them,
    like this:


    " "


    If you forget to put the space between the quotation marks, like the following,
    you won''t get a space in your string because there''s no space between the quotation
    marks:


    "


    You can put multiple spaces between the quotation marks if you want multiple spaces
    in your output, but typically one space is enough. In the following example, you
    put a space between first_name and last_name. You also stick a period and space
    after middle_init:


    ```

    first_name = "Alan"

    middle_init = "C"

    last_name = "Simpson"

    full_name = first_name + " " + middle_init + "." + last_name

    print(full_name)

    ```


    The output of that code, which is the contents of full_name variable, looks more
    like the kind of name you''re used to seeing:


    Alan C. Simpson


    Of course, as an alternative to concatenating all the components and spaces together
    in a new string, you can simply display the name in the desired format using an
    f-string, as in the following code. The only difference is that you don''t have
    a variable full_name to work with your code.


    ```

    print(f"{{first_name} {middle_init}.{last_name}")

    ```


    # Getting the length of a string


    To determine how many characters are in a string, you use the builtin len() function
    (short for length). The length includes spaces because spaces are characters,
    each having a length of one. An empty string — that is, a string with nothing
    in it, not even a space — has a length of zero.'
  - '[PAGE 67]


    # Working with common string operators


    Python offers several operators for working with sequences of data. One weird
    thing about strings in Python (and in most other programming languages) is that
    when you''re counting characters, the first character counts as 0, not 1. This
    makes no sense to us, but computers count characters that way because it''s the
    most efficient method. So though the string is five characters long, the last
    character in that string is the letter E, because the first character is number
    0. Go.


    Table 5–4 summarizes the Python 3 operators for working with strings.


    # TABLE 5–4 Python Sequence Operators That Work with Strings


    | Operator | Purpose |

    | --- | --- |

    | x in s | Returns True if x exists somewhere in string s. |

    | x not in s | Returns True if x is not contained in string s. |

    | s*n* | Repeats string n times. |

    | s[i] | The character at position i within string s. |

    | s[i:j] | A slice from i beginning with the character at position i up to (but
    excluding) the character at position j. |

    | s[i:j:k] | A slice of i to j with step k where k is the distance between any
    characters. For example, setting k to 3 displays every third character, and so
    forth. |

    | min(s) | The smallest (lowest) character of string s. |

    | max(s) | The largest (highest) character of string s. |


    When the output of a print() function doesn''t look right, keep in mind two important
    facts about strings in Python:


    +   - The first character is always number 0.


    +   - Every space counts as one character, so don''t skip spaces when counting.'
