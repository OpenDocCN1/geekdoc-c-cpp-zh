    ## Using Python’s Interactive Mode


    One way to get some practical, hands-on experience with using Python is to just
    start typing some commands interactively. The Terminal pane in VS Code is a great
    place to type Python code. So in this chapter, that''s where you''ll start.


    ## Opening Terminal


    To use Python interactively with VS Code, follow these steps:


    1. Open VS Code.

    2. Choose View ⇒ Terminal from the VS Code menu bar.

