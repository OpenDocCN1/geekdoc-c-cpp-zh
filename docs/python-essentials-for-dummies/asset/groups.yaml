- md: "\nstring operators and functions for you. Or search the web for python string\
    \ methods to find out what's available. \n\n## Uncovering Dates and Times\n\n\
    In the world of computers, we often use dates and times for scheduling, or for\
    \ calculating something is due or how many days it's past due.. We sometimes use\
    \ timestamps to record exactly when a user did something or when an event occurred.\
    \ There are lots of reasons for using dates and times in Python, but perhaps surprisingly,\
    \ no built-in data type for them exists like the ones for strings and numbers.\n\
    \nTo work with dates and times, you typically need to use the datetime module.\
    \ As with any module, you must import it before you can use it. You do that by\
    \ using import datetime. And as with any import, you can add an alias (nickname)\
    \ that's easier to type, if you like. For example, import datetime as dt would\
    \ work, too. You just have to remember to type dt rather than datetime in your\
    \ code when calling upon the capabilities of that module.\n\nThe datetime module\
    \ provides an easy way to work with dates and times in Python. It provides three\
    \ ways of storing information about dates, times, and time zones including these:\n\
    \n- datetime.date: A date consisting of month, day, and year (but no time information).\n\
    - datetime.time: A time consisting of hour, minute, second, microsecond, and optionally\
    \ time zone information if needed (but date).\n- datetime.datetime: A single item\
    \ of data consisting of date, time, and, optionally, time zone information.\n\n\
    We preceded each type with the full word datetime in the preceding list, but if\
    \ you use an alias, such as dt, you can use that in your code instead.\n\nWe talk\
    \ about each of these data types separately in the sections that follow.\n\n##\
    \ Working with dates\n\nThe datetime.date data type is ideal for working with\
    \ dates when time isn't an issue. You can create a date object in two ways. You\
    \ can get today's date from the computer's internal clock using the today() method.\
    \ Or you can specify a year, month, and day (in that order) inside parentheses.\n\
    \n![](img/be36b4e9a8416f1ae2a353bd745f71cb_71_0.png)\n\nREMEMBER When specifying\
    \ the month or day, never use a leading zero for datetime.date(). For example,\
    \ April 1 2024 has to be expressed as 2024,4,1 — if you use 2024,04,01, it won't\
    \ work.\n\nAfter importing the datetime module, you can use date.today() to get\
    \ the current date from the computer's internal clock. Or use date(year, month,\
    \ day) syntax to create a date object for some other date. The following code\
    \ shows both methods:\n\n```python\n# Import the datetime module, nickname dt\n\
    import datetime as dt\n# Store today's date in a variable named today.\ntoday\
    \ = dt.date.today()\n# Store some other date in a variable called last_of_teens\n\
    last_of_teens = dt.date(2019, 12, 31)\n```\n\nYou can isolate any part of a date\
    \ object using .month, .day, and .year. For example, in the same Python prompt,\
    \ execute this code:\n\n```python\nprint(last_of_teens.month)\nprint(last_of_teens.day)\n\
    print(last_of_teens.year)\n```\n\nEach of the three components of that date appear\
    \ on a separate line:\n\n```\n12\n31\n2023\n```\n\nYou can format dates and times\
    \ however you want. Use f-strings, which we discuss earlier in this chapter, along\
    \ with the string formatting directives shown on https://docs.python.org/3/library/datetime.html\
    \ about three-quarters of the way down from the top of the page, which includes\
    \ the format for dates as well as for times, as we discuss later in this chapter.\
    \ For directives that show local dates and time, the exact format will depend\
    \ on your location. For example, using %x to display the date December 18, 2023\
    \ in the U.S. would show 12/18/23 but countries where it's more common to show\
    \ the first day, rather than the month.\n\nWhen using format strings, make sure\
    \ you put spaces, slashes, and anything else you want between directives where\
    \ you want to appear in the output. For example, this:\n\n```python\nprint(f\"\
    {last_of_teens:%A, %B %d, %Y}\")\n```\n\nwhen executed, displays this:\n\n```\n\
    Tuesday, December 31, 2019\n```\n\nTo show the date in mm/dd/yyyy, use %m/%d/%Y,\
    \ like this:\n\n```python\ntodays_date = f\"{today:%m/%d/%Y}\"\n```\n\nThe output\
    \ will be the current date when you try it, with a format like the following:\n\
    \n```\n11/19/2024\n```\n\n**Table 5-6** shows a few more examples you can try\
    \ with different dates.\n\n### 5-6 Sample Date Strings\n\n| Format String | Example\
    \ |\n| :--- | :--- |\n| %a, %b %d %Y | Sat, Jun 01 2024 |\n| %x | 06/01/24 |\n\
    | %m-%d-%y | 06-01-24 |\n| %A %B %d | Saturday June 01 |\n| %A %B %d %Y | Saturday\
    \ June 01 of 2024 |\n\nSometimes you want to work only with dates, and sometimes\
    \ you want to work with times. Often you want to pinpoint a moment in time using\
    \ both the date and the time. For that, use the datetime class of the datetime\
    \ module. This class supports a now() method that can grab the current date and\
    \ time from the computer clock, as follows:\n\n```python\nimport datetime as dt\n\
    right_now = dt.datetime.now()\nprint(right_now)\n```\n\nWhat you see on the screen\
    \ the print() function depends on when you execute this code. The format of the\
    \ datetime value will be like:\n\n```\n2024-11-19 14:03:07.52975\n```\n\nThis\
    \ means November 19, 2024 at 2:03 PM (with 7.529 seconds tacked on). You can also\
    \ define a datetime using any of the following parameters. The month, day, and\
    \ year are required. The rest are optional and set to 0 in the time if you omit\
    \ them:\n\n```python\ndatetime(year, month, day, hour, minute, second, microsecond)\n\
    ```\n\nHere is an example datetime as 11:59 PM on December 31 2024:\n\n```python\n\
    import datetime as dt\nnew_years_eve = dt.datetime(2024, 12, 31, 23, 59)\nprint(new_years_eve)\n\
    ```\n\nHere is the output of that print() statement with no formatting:\n\n```\n\
    2024-12-31 23:59:00\n```\n\nTable 5-7 shows examples of formatting the datetime.\n\
    \n### 5-7 Sample Datetime Format Strings\n\n| Format String | Example |\n| :---\
    \ | :--- |\n| %A, %B %d at %I:%M%p | Tuesday, December 31 at 11:59 PM |\n| %m/%d/%y\
    \ at %H:%M%p | 12/31/24 at 23:59 PM |\n| %I:%M %p on %B %d | 11:59 PM on Dec 31\
    \ |\n| %x | 12/31/24 |\n| %c | Tue Dec 31 23:59:00 2024 |\n| %m/%d/%y at %I:%M%p\
    \ | 12/31/24 at 11:59 PM |\n| %I:%M %p on %m/%d/%y | 1:59 PM on 12/31/24 |\n\n\
    ## Calculating timespans\n\nSometimes knowing the date or time isn’t enough. You\
    \ need to know the duration, or *timespan*, as it’s typically called in the computer\
    \ world. In other words, not the date, not the o’clock, but the “how long” in\
    \ terms of years, months, days, hours, minutes, or whatever. For timespans, the\
    \ Python `datetime` module includes the `datetime.timedelta` class.\n\nA **timedelta**\
    \ object is automatically created whenever you subtract two dates, times, or datetimes\
    \ to determine the duration between them. For example, suppose you create a couple\
    \ of variables to store them, perhaps for one New Year’s Day and another for Memorial\
    \ Day. Then you create a third variable named `days_between` and put in it the\
    \ difference by subtracting the earlier date from the later, as follows:\n\n```python\n\
    import datetime as dt\nnew_year_day = dt.date(2024, 1, 1)\nmemorial_day = dt.date(2024,\
    \ 5, 27)\ndays_between = memorial_day - new_year_day\nprint(days_between)\nprint(type(days_between))\n\
    ```\n\nSo what exactly is `days_between` in terms of a data type? If you print\
    \ its value, you get *127 days*, **0:00:00**. In other words, there are 147 days\
    \ between those dates; the **0:00:00** is time, but because we didn’t specify\
    \ a time of day in either date, the time digits are all just set to 0.\n\nUsing\
    \ the Python type() function to determine the data type of days_between, you see\
    \ that it's a timedelta object from the datetime class, as follows:\n\n```\n147\
    \ days, 00:00:00\n<class 'datetime.timedelta'>\n```\n\nThe timedelta calculation\
    \ happens automatically when you subtract one date from another to get the between.\
    \ You can also define any timedelta (duration) using this syntax:\n\n```python\n\
    datetime.timedelta(days= seconds= microseconds= milliseconds= minutes= hours=\
