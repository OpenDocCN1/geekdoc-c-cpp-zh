    backward_names = names.copy()\n# Reverse the copy.\nbackward_names.reverse()\n\
    # Print the list.\nprint(names)\nprint(backward_names)\n```\n\n```\n['Zara', 'Lupe',\
    \ 'Hong', 'Alberto', 'Jake']\n['Jake', 'Alberto', 'Hong', 'Lupe', 'Zara']\n```\n\
    \nTable 7-1 summarizes the methods you've learned so far in this chapter. As you\
    \ will see in upcoming chapters, these methods work with other kinds of iterables\
    \ (a fancy name that means any list or list-like thing that you can go through\
    \ one at a time).\n\n## TABLE 7-1 Methods for Working with Lists\n\n| Method |\
    \ What It Does |\n|---|---|\n| append() | Adds an item to the end of the list\
    \ |\n| clear() | Removes all items from the list, leaving it empty |\n| copy()\
    \ | Makes a copy of a list |\n| count() | Counts how many times an element appears\
    \ in a list |\n| extend() | Appends the items from one list to the end of another\
    \ list |\n| index() | Returns the index number (position) of an element in a list\
    \ |\n\n| Method | What It Does |\n| --- | --- |\n| insert() | Inserts an item\
    \ into the list at a specific position |\n| pop() | Removes an element from the\
    \ list, and provides a copy of that item that you can store in a variable |\n\
    | remove() | Removes one item from the list |\n| reverse() | Reverses the order\
    \ of items in the list |\n| sort() | Sorts the list in ascending order |\n| sort(reverse=True)\
    \ | Sorts the list in descending order |\n\n## # What’s a Tuple and Who Cares?\n\
    \nIn addition to lists, Python supports a data structure known as a tuple. Some\
    \ people pronounce it “two-pull.” Some people pronounce it to rhyme with couple.\
    \ But it’s not spelt tuple or to, so our best guess is that it’s pronounced “two-pull.”\
    \ (Heck, for all we know, there may not be one correct way to pronounce it, but\
    \ doesn’t stop people from arguing about it.)\n\nAnyway, the oddball name, a tuple\
    \ is just an immutable list (like that tells you a lot). In other words, a tuple\
    \ is a list, but you can’t change it after it’s defined. It’s like a constant.\n\
    \nThe syntax for creating a tuple is the same as the syntax for creating a list,\
    \ except you don’t use square brackets. You have to use parentheses, like this:\n\
    \n```python\nprices = (29.95, 9.98, 4.95, 79.98, 2.95)\n```\n\nMost of the techniques\
    \ and methods that you learned for using lists back in Table 7-1 don’t work with\
    \ tuples because they are used to modify something in a list, and a tuple can’t\
    \ be modified. However, you can get the length of a tuple using len, like this:\n\
    \n```python\nprint(len(prices))\n```\n\nYou can use .count() to see how many times\
    \ an item appears in a tuple. For example:\n\n```python\nprint(prices.count(4.95))\n\
    ```\n\nYou can use in to see whether a value exists in a tuple, as in the following\
    \ sample code:\n\n```python\nprint(4.95 in prices)\n```\n\nThis returns True if\
    \ the tuple contains 4.95 or False if it doesn't.\n\nIf an item exists in the\
    \ tuple, you can get its index number. You'll get an error, though, if the item\
    \ doesn't exist in the tuple. You can use in first to see whether the item exists\
    \ before checking for its index number, and then you can return some nonsense\
    \ value as -1 if it doesn't exist, in this code:\n\n```python\nlook_for = 12345\n\
    if look_for in prices:\n    position = prices.index(look_for)\nelse:\n    position\
    \ = -1\nprint(position)\n```\n\nYou can loop through the items in a tuple and\
    \ display them in any format you want by using format strings. This example displays\
    \ each item with a leading dollar sign and two digits for the pennies:\n\n```python\n\
    # Loop through and display each item in the tuple.\nfor price in prices:\n   \
    \ print(f\"${price:.2f}\")\n```\n\nThe output of running this code with the sample\
    \ tuple follows:\n\n```\n$29.95\n$9.98\n$4.95\n$79.98\n$2.95\n```\n\nYou can't\
    \ change the value of an item in a tuple using this kind of syntax:\n\n```python\n\
    prices[1] = 234.56\n```\n\nYou'll get an error message that reads TypeError: 'tuple'\
    \ object does not support item assignment. This message is telling you that you\
    \ can’t use the assignment operator, =, to change the value of an item in a tuple.\
    \ Because tuples are immutable, you can't change its contents once it's created.\n\
    \n## Working with Sets\n\nPython also offers sets, which are collections of unique\
    \ items. Unlike lists, sets don't have an order, which means you can't use an\
    \ index number to access an item. You define a set using curly braces, like this:\
    \ \n\n```python\nfruits = {'apple', 'banana', 'cherry'}\n```\n\nIf you add an\
    \ item to a set that is already there, the set won't change. This is because sets\
    \ only store unique values. You can add a new item to a set using the .add() method:\n\
    \n```python\nfruits.add('orange')\n```\n\nTo add multiple items at once, you can\
    \ use the .update() method:\n\n```python\nfruits.update(['grape', 'kiwi'])\n```\n\
    \nIf you want to remove an item from a set, use the .remove() or .discard() method.\
    \ If the item doesn't exist, .remove() will raise an error, while .discard() will\
    \ not.\n\nYou can check if an item is in a set using the in operator:\n\n```python\n\
    if 'apple' in fruits:\n    print(\"Apple is in the set!\")\n```\n\n## # Chapter\
    \ 8: Wrangling Bigger Chunks of Code\n\n-   Creating your own function\n-   Including\
    \ a comment in a function\n-   Seeing how to pass information to a function\n\
    -   Returning values from a function\n\nIn this chapter, you learn how to better\
    \ manage larger code projects by creating your own functions. Functions provide\
    \ a way to compartmentalize your code into small tasks that can be called from\
    \ multiple places. For example, if something you need to access throughout the\
