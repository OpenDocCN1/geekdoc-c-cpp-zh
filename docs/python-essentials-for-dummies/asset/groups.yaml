    \n## 使用 while 循环\n\n作为 `for` 循环的替代方案，你可以使用 `while` 循环。区别是细微的。对于 `for` 循环，你通常会获得固定次数的循环，范围内的每个项目一次，或者列表中的每个项目一次。在\
