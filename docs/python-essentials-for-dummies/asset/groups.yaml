    To see what packages you already have installed, enter this at the operating system
    command prompt or in the VS Code Terminal pane in Windows:


    ```

    pip list

    ```


    Or on a Mac, use pip3 in place of pip if you get an error with pip:


    ```

    pip3 list

    ```


    # Importing Python Modules


    You’ll hear the module used with Python all the time. If you think of the standard
    library as a physical library and a package as a book in that library, a module
    is one chapter in one book. In other words, a package may contain many modules,
    and a library may contain many packages. The module is a big part of what makes
    Python a modular language, because code is grouped together according to function.
    You don’t have to import everything including the kitchen sink to use some code.
    On the other hand, if you need to use several related things, such as functions
    for working with dates and times, you don’t have to import'
