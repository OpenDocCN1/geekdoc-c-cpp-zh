    \ 的变量设置为 **False**。然后它尝试打开文件。如果无法打开文件，第一个 **except:** 会捕获错误，程序不会崩溃。`file_is_open`\
    \ 变量将保持为 **False**。\n\n如果文件可以打开，**else:** 块执行，将 `file_is_open` 变量设置为 **True**，它关闭文件。无论如何，都会在屏幕上显示内容。\n\
    \n最后（在 **finally: 块**中），代码检查 `file_is_open` 是否为 **True**，如果是，则关闭文件。无论发生什么情况，程序将正常运行，并在移动到后续代码之前确保文件已关闭。\n\
    \n```python\n# 一个初始为 False 的变量\nfile_is_open = False\n\ntry:\n  # 打开名为 people.csv\
    \ 的文件\n  the_file = open(\"people.csv\")\n\n  # 监控常见错误，如果发生则停止程序。\nexcept FileNotFoundError:\n\
    \  print(\"Sorry, I don't see a file named people.csv here\")\n\n# 否则，如果到为止没有发生任何坏事，继续运行。\n\
