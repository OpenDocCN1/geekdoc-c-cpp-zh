    ```


    After you import a module, the `dir()` and `help()` functions work on that module,
    too. For example, if you tried doing `dir(math)` or `help(math)` before `import
    math`, you''d get an error. That''s because `math` package isn''t part of the
    standard library. However, if you do `import math` first and then `help(math)`,
    it all works.


    There may be times when you don''t need the whole kit-and-caboodleoo. In those
    cases, you can import just what you need using the following syntax:


    ```

    from math import pi

    ```


    In this example, you''re importing one (`pi`), so you''re not bringing in unnecessary
