    ```


    Here''s what the code displays when executed:


    Subtotal: $1,499.70


    Perfect! That''s exactly the format we want. So anytime you want to show a number
    with commas in the thousands places and exactly two digits after the decimal point,
    use an f-string with the format string, .2f.


