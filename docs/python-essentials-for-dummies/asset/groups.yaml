    The Python standard library is basically all the stuff you get when you get the
    Python language, including all the Python data types such as string, integer,
    float, and Boolean. Every instance of these data types is an instance of a class
    defined in the standard library. For this reason, the terms type, instance, and
    object are often used interchangeably. The integer is a whole number; it''s also
