    them one at a time. Typically, importing the entire module will get you what you
    need.


    You can import functionality from modules in a few ways. The way we just noted
    is one of the most common: import the entire module. To do that, just follow the
    `import` command with the name of the module you want to import. For example,
    the following command imports the entire math module:


    ```

