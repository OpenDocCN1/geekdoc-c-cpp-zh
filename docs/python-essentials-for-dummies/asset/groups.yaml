    # # Manipulating strings with methods


    Every string in Python 3 is considered a str object (pronounced “string object”).
    The shortened word str for string distinguishes Python 3 from earlier versions
    of Python, which referred to strings as string objects (with the word string spelled
    out, not shortened). This naming convention is a great source of confusion, especially
    for beginners. Just try to remember that in Python 3, str is all about strings
    of characters. Python offers numerous str methods (also called string methods)
    to help you work with strings. The general syntax of str object methods is as
    follows:


    ```

    string.methodname(params)

    ```


    where `string` is the string you’re analyzing, `methodname` is the name of a method
    from Table 5-5, and `params` refers to any parameters that you need to pass to
    the method (if required). The leading `s` in the first column of Table 5-5 means
    “any string,” be a literal string enclosed in quotation marks or the name of a
