  \ 1477–2744.\n\n6. Singer, P. W. (2009). 军事机器人与战争法。*New Atlantis*, *23*(冬季), 28–47.\n\
  \n7. Sparck‐Jones, K. (2003). 隐私：现在有什么不同？*Interdisciplinary Science Reviews*, *28*,\
  \ 287–292.\n\n# 14\n\n## 网络犯罪：儿童色情物与恋童癖\n\n本章再次关注网络犯罪。这次的重点是（1）那些访问和/或交易儿童色情图像，但没有对儿童进行实际性侵待的历史或表面动机的人；以及（2）那些访问并交易儿童色情，并利用互联网通过诱导（grooming）促进与儿童实际性接触的人。我们将考虑针对第（2）类人群，儿童色情与实际儿童性侵待之间的关系，以及第（1）类人群由于对观看儿童色情产生兴趣，从而表现出与第（2）类类似的犯罪行为的可能性。此外，我们还将寻求解释个体为何有动机观看儿童色情物的理论，哪些因素有助于维持这种动机，以及升级为实际性侵待的潜力。我们首先考察对儿童色情法的法律理解以及与术语定义相关的问题，以及在评估假色情材料在多大程度上可以证明违反了儿童色情法方面的问题。文中还讨论了伪照片和虚拟儿童色情及其在法律上的地位。本章呈现了犯罪者类型的分类总结，重点关注性窥淫症背后的病理学以及作为儿童色情收集者的犯罪者，以及与儿童色情和恋童行为有关的其他分类和特征。我们还讨论了在互联网上访问儿童色情、接触类犯罪者之间网络儿童色情的泛滥，与实际犯罪行为之间的关系。最后，概述了目前对犯罪行为的心理学理解，并简要讨论了利用技术检测儿童色情使用以及涉及少年的其他网络犯罪（如性诱导）的情况。\n\
  \n然而，在继续讨论这些问题之前，首先要进行一点说明。儿童性侵待的实施者在流行媒体中通常被称为“恋童者”（paedophiles）。“恋童者”一词的临床用法留给那些对青春期儿童有性兴趣的人（Berlin\
  \ & Sawyer, 2012）。儿童色情法，至少在英国和美国，包含了对（后）青春期儿童的性侵待（简称，任何 18 岁以下的人）。对青春期和青春前期儿童有性兴趣的人被称为“青春期恋童”（hebephiles）（Neutze,\
  \ Seto, Schaefer, Mundt & Beier, 2011）。根据这一临床定义，一个并非恋童者的人（因为他们的性兴趣是对青春期儿童）也可能被判定为违反儿童色情法。这种区别将反映在本章使用的语言中。\n\
  \n## 14.1 互联网与儿童色情物的增加\n\n互联网的出现开启了色情内容生产、传输和获取的新纪元，包括儿童色情（Lee, Li, Lamade, Schuler\
  \ & Prentky, 2012; Motivans & Kyckelhahn, 2007; Tsaliki, 2011），其呈指数级增长（Taylor &\
  \ Quayle, 2003），已成为增长最快的互联网行业之一（Bell & Kennedy, 2000; Jenkins, 2009）。访问互联网的便利性引发了“网络恋童犯罪”（cyber‐paedriminality）（Webb,\
  \ Craissati & Keen, 2007），它描述了一种新型犯罪形式，即包含儿童色情的文件的在线展示、交换和购买。例如，在美国，涉及儿童色情的犯罪（即性亵猥待）从\
  \ 2000 年（935 起）到 2006 年（2417 起）显著增加，随后在 2009 年（3719 起）再次增长（Wolak, Finkel & Mitchell,\
  \ 2012）。事实上，儿童色情犯罪现在占美国联邦检察官起诉性剥削案件大部分（Lam, Mitchell & Seto, 2010）。为了应对儿童色情的增加，国际警察行动（2001\
  \ 年的 Genesis、2004 年的 Falcon 和 2006 年的 Koala）已识别出许多（Niveau, 2010）。此外，到 2008 年，国际刑警组织\
  \ Interpol 的儿童受虐图像数据库已收集了五十万图像，用于识别全球近 700 名受害者（Elliot & Beech, 2009）。Elliot 和 Beach（2009）还报告了英国互联网基金会对获的包含儿童色情的图像进行分析结果。在这些图像中，80%被发现是\
  \ 10 岁及以下的儿童（2 岁及以下占 10%，3-6 岁占 33%，7-10 岁占 37%）。绝大多数图像（79%）也被发现是女孩；事实上，最常见的儿童色情图像是青春前期女孩（Seto,\
  \ 2010）。\n\n在第 5 章](#c05.xhtml）中提到的三 A 引擎被用于解释儿童色情的数量，其原因在于其更高的可访问性、可负担性和匿名性（Cooper\
  \ et al., 2000）。此外，Quayle、Eroga、Wright、Taylor 和 Harbinson（2006）指出数字化色情材料比非数字材料更容易存储，且隐藏所需的精力很少。互联网还提供了一种媒介，让犯罪者能够与潜在的性虐受害者以及其他在性化图像和实际犯罪方面都有共同偏好的人建立联系（McCarthy,\
  \ 2010）。鉴于儿童色情消费的普遍，一个具有实际意义的问题是，儿童色情消费者有多大参与接触性犯罪或未来面临此类风险（Endrass et al., 2009）。\n\
  \n## 14.2 儿童色情物与法律\n\n\n\n\n\n直到 20 世纪 70 年代后期，英国和美国才制定了专门禁止 `child`（儿童）色情的法律：这些法律将儿童色情认定为一种特殊的违禁活动分类（当然，这里的“儿童色情”指的是互联网时代之前的材料）。在此之前，成人色情和儿童色情之间没有区别，对两者的监管都基于相同的淫秽法（Gillespie,\
  \ 2010）。事实上，直到 1982 年，美国最高法院才从《宪法第一修正案》（言论自由）的保护范围内排除了儿童色情——其定义为“视觉上描绘了特定年龄以下儿童进行性行为的”材料——因为这“与儿童性待有内在联系”（New\
  \ York v. Ferber, 1982, p. 764, cited in Ray, Kimonis, Donoghue, 2010, p. 85）。关于这一点，值得注意的是，英国儿童剥削与在线保护中心理所当然地会向编辑发送通知，要求将“儿童色情”这一术语替换为“儿童虐待”或“儿童虐待图像”。使用“儿童色情”一词错误地暗示了合法性和合规性，而非实际发生的虐待行为（Adams,\
  \ 2010；另见 Edwards, 2000; Tate, 1992, Taylor & Quayle, 2003）。Williams (1991) 也呼应了这一点，他指出：“儿童色情是儿童虐待的视觉记录。每一个视频或照片都是对儿童犯罪的记录”（p.\
  \ 88）。此外，除了虐待本身，对这种虐待的呈现（作为永久记录）也是儿童的二次伤害（Beech, Elliot, Birgden & Findlater, 2008;\
  \ Taylor & Quayle, 2003）。尽管我们承认这一点的有效性，但考虑到该术语在相关文献中被广泛使用，为了方便起见，我们将继续使用“儿童色情”。\n\
  \n### 14.2.1 儿童色情内容的客观与功能方面\n\n法律上构成的儿童色情材料与对儿童有性兴趣的人所使用的材料并不一定匹配。用于诱发个体性兴奋的儿童图像可能并没有描绘性虐待；它们甚至不包含儿童部分裸或全裸的图像。因此，作为儿童图像，其本身可能是完全无害的，并不违反儿童色情法（Tate,\
  \ 1990）。正如 Howitt (1995) 指出的，性刺激可能并非基于显含的性内容，而是基于犯罪者脑海中产生的幻想。Taylor, Holland 和 Quayle\
  \ (2001) 因此区分了儿童色情（描绘了显含的性虐待）和儿童色情文学（更多地反映了图像的用途：诱发性兴奋）。\n\n当然，更常见的情况是，对儿童有性兴趣的人确实拥有，或有动机拥有或至少观看了违反儿童色情法的儿童图像，因此这些图像确实构成了儿童虐待图像。然而，Taylor\
  \ 和 Quayle 关于某些形式的内容客观衡量标准独立于图像用途（其对观看者起到的目的）的观点是非常切中要害的。\n\n### 14.2.2 不同的法律解释\n\
  \n对儿童色情的法律定义因国家而异，对“儿童”等术语的解释也是如此。于全球对儿童色情的定义和监管存在差异，我们的重点将放在英国和美国的法律定义上，因为这些定义在相关文献中往往占据重要地位。在英国，2003\
  \ 年《性犯罪法》第 `6A.1` 案修订了 1978 年《儿童保护法》和 1988 年《刑事司法法》，使得“拍摄、制作、允许拍摄、分发、展示、持有、带有分发意图的持有或广告任何\
  \ 18 岁以下人员的淫秽照片或伪照片属于犯罪”。什么构成“淫秽”由陪审团根据公认的体面标准判定。对违反第 `6A.1` 条的罪者的判刑必须反映犯罪的严重性，范围从\
  \ 1 级（描绘色情动作但无性行为的图像）到 5 级（涉及施虐或由动物进入对动物进入；见下方的 `COPINE` 量表）。\n\n在美国，司法部《联邦法律指南》在儿童剥削和淫秽章节指出：\n\
  \n> 《美国法典》第 18 卷第 `2256` 条将儿童色情定义为任何涉及未成年人（18 岁以下人员）的显含性行为的视觉描绘。视觉描绘包括照片、视频、数字或计算机生成的与真实未成年人无法区分的图像，以及创建、改编或修改但看起来[原文]描绘了可识别的真实未成年人的图像。\n\
  \n此外：\n\n> 显含性行为的法律定义并不要求图像描绘儿童正在进行性活动。如果一张裸童照片具有足够的性暗示性，则可能构成非法的儿童色情。（美国司法部, 2015）\n\
  \n### 14.2.3 儿童色情与同意年龄\n\n在英国和美国的儿童色情定义中，儿童是指任何 18 岁以下的人员。这一年龄在关于儿童色情的国际法中也有规定（Gillespie,\
  \ 2010；见《联合国关于儿童权利公约》第 `1a` 条；另见《欧洲委员会网络犯罪公约》）。因此，如果图像是 18 岁以下的人员，那么根据儿童色情法，该图像即涉及儿童。在许多国家，这一年龄与允许进行性行为的同意年龄不同。例如，在英国，该年龄为\
  \ 16 岁（但取决于是否涉及弱势群体或是否存在权力不平衡，例如学生与教师的情况）。在美国，同意年龄在 16 岁到 18 岁之间变化，取决于你所在的州。全球范围为\
  \ 12 至 20 岁（在 12 岁即同意的情况下，对方必须在 18 岁以下）。\n\n考虑到这种差异，即使在英国和某些美国州之间，如果一个人已满同意年龄但未满\
  \ 18 岁，他可能与另一个成年年龄的人发生性行为，但在法律上不允许持有对方的显含图像。\n\n正如第 5 章提到的，性信息（sexting）是一种主要的青少年行为，即通过手机或互联网发送或发布具有暗示性质的短信和/图像，包括裸体或半裸照片（Levick\
  \ & Moon, 2010）。未成年人创建此类未成年人图像（即使该未成年人已 16 岁）符合儿童色情的法定定义（Walsh, Wolak & Finkelhor,\
  \ 2013；另见 Mitchell, Finkelhor, Jones & Wolak, 2012）。然而，根据 Levick 和 Moon (2010) 的观点，在性信息案件中起诉未成年人是对儿童色情法的误用，因为这种行为仅仅是青少年性发育的一种新表现。在美国，对性信息的起诉仅发生在以下情况：\n\
  \n*   恶意意图、欺凌、胁迫或骚扰（照片发送给某人后出于上述原因分发的情况）；\n*   分发（在干预后继续发送性信息，或在受害者未同意的情况下将图像发送给并非原始目标的人）；\n\
  *   参与人员之间年龄差异巨大。\n\n\n\n\n\n*   图形表现（极具性暗示和/或具有性暴力的图像。（改编自 Walsh 等人，2013）\n\n因此，性信息短信是一个新的社会问题（已在第\
  \ 5 章中讨论），法律尚未能解决这一问题。\n\n## 14.3 伪照片（PSEUDO‐PHOTOGRAPHS）\n\n数字时代为那些反对儿童色情的立法者带来了自身的问题和挑战。儿童色情的伪照片涉及对真实照片的操纵，或对人物/儿童的数字形象进行修改。这可能涉及对裸体成人的图像进行处理，使其看起来像儿童；或者对儿童非色情图像进行处理，使其看起来具有色情性。在后者的情况下，一张原本描绘儿童舔冰淇淋（例如）的图像可能会被处理，使得该儿童似乎正在对成年人进行口交（Gillespie,\
  \ 2010）。\n\n在实际儿童色情的情况下，由于图像是性化儿童或儿童虐待的记录，照片或视频构成了该事件的记录。然而，在伪照片的情况下，产生的是并非真实的事件，但其呈现方式*仿佛*是真实的（Oswell,\
  \ 2006）。对于 Williams (2003) 来说，尽管这些“PS 处理”过的图像非常令人不安，但实际上它们并不比绘画更“真实”。尽管如此，尽管人们承认在儿童色情背景下，猥亵照片和猥亵伪照片并不等同，但根据英国法律（参见\
  \ 2003 年《性犯罪法》和 2009 年《验法官与司法法案》），它们被视为*仿佛*完全一样（Oswell, 2006）。因此，上述的伪照片虽然本身没有描绘虐待，也被认为具有剥削性，因此是“不仅是针对*特定*儿童的犯罪，而且是对*所有*儿童的犯罪”（Oswell,\
  \ 2006, p. 252，强调为原文所有）。\n\n美国方面的立法则试图通过其 1996 年的《儿童色情预防法》（如上所述）来考虑数字时代，根据该法，儿童色情的定义不仅包括实际描绘对未成年人进行性虐待的内容，还包括*似乎*描绘未成年人参与性活动的内容。根据这一定义，伪照片的创建者和持有者，甚至涉及涉及实际儿童图像的数字创建图像也可以根据法律被起诉（Samenow,\
  \ 2012）。\n\n然而，2002 年，*阿什克罗特诉言论联盟案*（525 U.S. 234）中做出了一项裁决，旨在挑战 1996 年的《儿童色情预防法》（18\
  \ U.S.C.§ 2251）（参见 Kosse, 2004）。与英国法律不同，美国最高法院裁定，虽然“制作、展示或持有具有性暗示的儿童图像仍然是非法的……[但]没有充分理由禁止制造或展示仅仅*看起来*是儿童的图片”（Levy,\
  \ 2002, p. 319）。此外，对于纯数字来源的图像——不涉及任何真实的未成年人，因此没有记录犯罪（即虚拟儿童色情）——最高法院裁定，由于美国儿童色情法的实施是为了防止儿童遭受受害，而在虚拟儿童色情案件中没有受害者，因此没有充分的理由限制这种言论自由。\n\
  \nPaul 和 Linz (2008) 让成年人接触“法律边缘”色情片，以测试美国政府在维护 1996 年《儿童色情保护法》时提出的一个假设——“即虚拟儿童色情会刺激并增加成年人对儿童的性欲求，且此类内容会导致对未成年人的性虐待或剥削被观者所接受甚至青睐”（p.\
  \ 35）——他们发现，尽管观看这些材料的人更有可能在认知上将性活动与未成年人的非性化图像联系起来（基于反应潜伏期），但没有证据表明接触会导致参与者对儿童色情或恋童癖有更高的包容度。（“法律边缘”色情片使用超过\
  \ 18 岁的模特，但这些模特被描绘为低于或略高于法定同意年龄。）。）Paul 和 Linz 的发现挑战了美国政府关于儿童色情会导致实际儿童虐待事件的断言，而是支持了\
  \ 2002 年最高法院的观点，即目前没有证据表明这种因果关系除了偶然和间接之外没有。\n\n重要的是，作为澄清，最高法院 2002 年的裁决并没有影响对“合成（morphed）”图像的持续禁止，这些图像通过整合真实儿童图像来创建儿童色情。然而，2003\
  \ 年引入了《保护法》（PROTECT Act）；通过禁止淫秽材料（淫秽基于公认的当代社区标准）限制了虚拟儿童色情的许可性。具体而言，法律将以下行为犯罪化：\n\
  \n> 任何形式的视觉描绘，包括“绘画、卡通、雕塑或画”，“描绘未成年人参与性暗示行为且属于淫秽”，或“描绘一个一个是或看起来是未成年人参与……性交的图像，且缺乏严肃的文学、艺术、政治或科学价值。（18\
  \ USC §1466A）”（Samenow, 2012, p. 19）\n\n关于虚拟儿童色情——至少在美国，除非违反淫秽法，否则是非法的——美国最高法院裁定：\n\
  \n*   虚拟儿童色情不像实际儿童虐待那样内在相关，因此无法与实际犯罪联系起来。\n*   与儿童虐待的任何联系都是间接且偶然的，因此不能说必然与未来的虐待有关。\n\
  *   禁止虚拟儿童色情不能基于其*可能*伤害某些儿童。\n\n## 14.4 儿童色情犯罪者的类型\n\n在本节中，我们考虑如何对儿童色情犯罪者进行分类。例如，Berlin\
  \ 和 Sawyer (2012) 将儿童色情犯罪者分为以下类别：\n\n1.  **性猥亵者 (Sexual molesters)**：除了观看儿童色情外，对实际上接触儿童（面对面）有兴趣（有时有过去史）。\n\
  2.  **性诱骗者 (Sexual solicitors)**：除了观看儿童色情外，与儿童进行性化的“聊天”，但没有面对面会的动机。（当然，某些犯罪分子可能通过这种方式发起接触，作为实现第一类特征接触的手段）。\n\
  3.  **性窥淫者 (Sexual voyeurs)**：没有记录显示曾尝试过接触儿童（且没有证据表明他们有这样做的兴趣），但他们表现出观看儿童色情的模式（有时是强迫性的）。\n\
  \n### 14.4.1 未另指定的性恋癖障碍\n\n\n\n\n\n> 某些个体似乎对窥淫观看此类[儿童色情]图像有强迫冲动，但并没有实际上接触儿童进行性行为的动机。换句话说，在这些情况下，在互联网上窥淫式（通常是强迫性的）观看此类图像的行为本身就是目的，而不是实现其他目的的手段——例如实际的性接触。（第\
  \ 31–32 页）\n\n尽管如此，根据 DSM-IV-TR，上述方式的窥淫式观看儿童色情被归类为“未另说明的性偏癖障碍”。这指的是那些被归类为有强迫欲望反复观看\
  \ `preescent` 儿童性暴露图像的个体；其性偏癖障碍的主要成分是窥淫癖和恋童癖（Berlin & Sawyer, 2012）。该疾病的恋童癖方面局限于网络窥淫，因此应将其与恋童癖本身区分开来，后者是指个体有动机与青春期儿童进行\
  \ `engage` 性行为（这是直接受害的特征），而不仅仅是观看带有性内容的幼童图像。为了支持这种临床学区分，Galbreath、Berlin 和 Sawyer\
  \ (2002) 在一项针对 39 名网络儿童色情犯罪者的研究中发现，23% 的被诊断为恋童癖，而 49% 的被诊断为未另说明的性偏癖障碍。\n\n互联网具有许多可能吸引网络恋童犯罪者的特征（独特特征），尤其是那些从事高水平性幻想但对付诸幻想幻想保持强烈抑制力的人（Niveau,\
  \ 2010）。根据 Niveau (2010) 的观点，这些特征是：\n\n*   相对（或至少是感知上的）匿名；\n*   易于获取；\n*   负担得起；\n\
  *   无限市场；\n*   消费者与生产者之间界限的模糊（每个消费者都有通过交换文件成为生产者的潜力）；\n*   幻想体验的无限机会。\n\n### 14.4.2\
  \ 收藏者\n\n许多儿童色情犯罪者不仅限于观看甚至获取儿童或虐待儿童的图像；不仅如此，他们 `collect` 这些图像，并对其进行分类和索引作为其收藏的一部分：这就是\
  \ Taylor (1999) 所说的“收藏者综合征”。Svedin 和 Back (1996；引自 Oswell, 2006) 这样描述了不同的“收藏者”：\n\
  \n*   `closet collector`（隐蔽收藏者）是指观看图像但与儿童没有直接性接触的人。\n*   `isolated collector`（孤立收藏者）是指除了观看图像外还参与儿童性虐待的人。\n\
  *   `cottage collector`（家庭收藏者）与孤立收藏者的区别在于他们与他人分享收藏，并与他人参与身体虐待。\n*   `commercial\
  \ collector`（商业收藏者）是指从其制作的儿童色情传播中获利的人。商业收藏者与 Elliot 和 Beech (2009) 提到的“商业剥削”相吻，这涉及为了财务而制作和交易儿童色情的人，这可能是更广泛非法活动的一部分，因此他们可能对儿童性接触没有特定兴趣。\n\
  \n成为收藏者的动机被视为底层病理的症状，并且在“家庭收藏者”的情况下，它是犯罪者与其他具有相似动机的人之间建立的社会关系中的一种纽带特征（Oswell, 2006）。Taylor\
  \ 等人 (2001) 也认为，收藏本身并不是随机的；因此，其选择性内容揭示了收藏者的“内心”，使得即使某些图像本身不符合英国和美国对儿童色情的法律定义，但考虑到该收藏的动机，它们在收藏中的位置也使其具有虐待性。Taylor\
  \ 等人 (2001) 根据 10 点 COPINE 量表提供了一种图像分类法（COPINE 代表欧洲打击恋童癖信息网络）。该量表范围如下：(1) 指示性的，(2)\
  \ 裸主义的，(3) 色情的,(4) 摆拍的,(5) 性姿态的,(6) 显性性姿态的,(7) 显性性活动,(8) 攻击,(9) 严重攻击,(10) 虐待/兽交。因此，即使是分类在量表最低位置的图像（日常生活中非色情且非性化的儿童图像），当出现在收藏中时（如上所述），也表明了对儿童蓄意的性侵害。对于\
  \ Taylor 等人 (2001) 来说，收藏者符合 Svedin 和 Back (1996；引自 Oswell, 2006) 的隐蔽分类，还是收藏者实施了实际的身体儿童虐待，在犯罪者的病理学方面没有区别。观看儿童图像，特别是在为了引起性冲动而汇集的收藏中，即使在\
  \ COPINE 量表的最低水平，也等同于儿童侵害。因此，犯罪者的病理学不仅局限于或仅以对儿童的身体性虐待为特征，还通过构成即使是隐蔽收藏者收藏的图像得到了证实。\n\
  \n### 14.5 儿童色情犯罪者的特征\n\n我们现在将注意力转向儿童色情犯罪者的特征上。Galbreath 等人 (2002) 声称，接触儿童色情的人绝大多数是男性（然而，请参阅\
  \ Seigfried-Spellar & Rogers, 2010 关于女性的研究），但除此之外，他们也来自各种背景。Reijnen、Bulten 和 Nijman\
  \ (2009) 基于一个荷兰样本同样指出，儿童色情犯罪者与非犯罪人口一样具有许多相同的异质性（另见 Nielssen 等人, 2011）。事实上，McCarthy\
  \ (2010) 认为目前不存在 `典型` 的儿童色情犯罪者画像。然而，一些研究显示了差异。\n\n根据美国的发现，许多人受过良好教育（O’Brien & Webster,\
  \ 2007）。Wolak、Finkelhor 和 Mitchell (2005) 发现，在 1713 名因儿童色情定罪的人中，37% 上过大学或获得大学文凭，另\
  \ 4% 拥有博士学位。根据 Burke、Sowerbutts、Blundell 和 Sherry (2002) 使用的澳大利亚样本，犯罪者的年龄倾向于 25\
  \ 到 50 岁之间。Web 等人 (2007) 报告说，他们的样本 `n=90` 平均年龄为 38 岁，低于身体性犯罪者；他们的同居关系也较少。\n\nMiddleton、Elliot、Mandeville-Norden\
  \ 和 Beech (2006) 发现患有心理障碍的网络犯罪者倾向于社交孤立或有亲密关系问题。相反，Henry、Mandeville-Norden、Hayes\
  \ 和 Egan (2010) 在 422 名儿童色情犯罪者的样本中报告了情感缺陷和高度偏差的证据。使用互联网也被视为一种缓解情感压力的方式。然而，重要的是，Henry\
  \ 等人研究中的几乎一半犯罪者没有表现出任何心理障碍。事实上，Neutze 等人 (2011) 在他们的样本中完全没有发现情感缺陷的证据。此外，在将儿童色情犯罪者与非网络性犯罪者比较时，Reijnen\
  \ 等人 (2009) 发现儿童色情犯罪者倾向于更年轻、独居、单身且没有孩子。因此，Reijnen 等人得出儿童色情犯罪者更加社交孤立。这些发现与上述 Middleton\
  \ 等人 (2006) 和 Web 等人 (2007) 的结果一致。Reijnen 等人还推测，社交孤立（例如由于亲密关系问题）是否可能是犯罪者网络行为的诱因，或者他们的恋童倾向对尝试建立亲密的成年关系产生负面影响。\n\
  \n\n\n\n\n## 14.6 儿童色情与肢体接触猥儿童之间的关系\n\n大多数当代儿童色情犯罪者是通过互联网实施犯罪的（Ray et al., 2010）。正如本章早期提到的，在这些犯罪者中，有一类特殊的个体，他们将自己的犯罪行为限制在窥探儿童虐待图像上。然而，考虑到互联网具有双重潜力，对于对未成年人有性偏好的人来说——无论是观看图像还是寻求更直接的接触（例如，直接受害分类学）——人们不得不考虑儿童色情与肢体接触儿童性虐待之间的关系。因为，尽管在肢体接触儿童虐待的人与仅观看视频的人之间划分界限在某些情况下可能是合理的，但显而易见的是，被指控招儿童和/或猥扰的人往往被抓获持有儿童色情制品（Kingston,\
  \ Fedoroff, Firestone, Curry & Bradford, 2008; Riegel, 2004）。\n\n还存在升级的问题，即犯罪者的偏态性兴奋可能会促使他们寻求日益发令人震惊的描写（Niveau,\
  \ 2010），并/或参与肢体接触儿童性虐待（Seto & Eke, 2005）。Quayle 和 Taylor（2002）以及 Sullivan 和 Bee（2003）认为，对儿童色情的倾向增加了以性猥扰或性招揽等形式对未成年人实施接触性犯罪的概率（Seto,\
  \ Wood, Babchishin & Flynn, 2012）。因此，人们必须考虑，对儿童色情的积极兴趣在多大程度上会导致犯罪者实施接触性犯罪，还是仅仅满足于观看儿童性图像。\n\
  \n在 Bourke 和 Hernandez（2009）一项基于 155 名儿童色情犯罪者样本的研究中，85%的人承认至少虐待过一次儿童。Wolak 等人（2005）报告说，在\
  \ 1,713 名儿童色情犯罪者的样本中，40%是双重犯罪者——意味着他们也实施了肢体接触儿童性虐待——在其中，39%的人是在互联网上结识受害者。Seto, Hanson\
  \ 和 Babchishin（2011）发现，每八名儿童色情犯罪者中就有一人有接触性犯罪的正式记录。Seto 和 Eke（2005）指出，有肢体性虐待史的儿童色情犯罪者更有再次犯罪，而仅触犯儿童色情法规定的人则没有继续实施接触性犯罪（至少在研究的随访期间；进一步的随访研究见\
  \ Eke, Seto & Williams, 2011）。Webb 等人（2007）则发现，尽管有证据表明被定犯儿童色情罪的人（但他们并非也是儿童猥亵者）中存在再次犯罪的情况，但他们的再次犯罪仅限于获取儿童色情制品；没有证据表明他们继续实施了接触性犯罪。事实上，McCarthy（2010）认为缺乏接触性犯罪（包括网络诱导）是区分这两类偏态群体的关键因素。为了进一步说明，在了一组对男孩有性偏好的儿童色情犯罪者样本（n = 290）中，Riegel（2004）发现\
  \ 84%的人报告图像充当了真实儿童的替代品，84.5%的人表示观看此类图像并未增加他们对男孩进行肢体虐待的欲望。\n\nLee 等人（2012）发现，与两项指标得分均较高的双重犯罪者相比，儿童色情犯罪者在网络沉迷方面的得分较高，而在与反社会人格障碍相关的特质（他们称之为“反社会性”）方面的得分较低。Lee\
  \ 等人推测，相对于高网络沉迷程度，反社会性测量值的低或高，可能提供作为双重犯罪的有用预测指标，因此可以识别出在儿童色情犯罪者中谁会实施接触性犯罪。\n\n##\
  \ 14.7 儿童色情犯罪的理论方法\n\n本节概述了一些用于解释为什么有些人会成为恋童者的心理理论。\n\n### 14.7.1 求爱理论（Courtship\
  \ theory）\n\n求爱理论（Freund & Blanchard, 1986; Freund, Scher & Hucker, 1983）假设性互动分为四个阶段。第一阶段是寻找潜在伴侣。然后通过观察和交流建立接触（被称为前接触互动）。接下来，恋爱向抚摸和亲吻等触觉互动发展，最后达到生殖器结合。这种进展中的病理性干扰通常表现为正常恋爱中某个阶段的扭曲。\n\
  \n在本章早期，我们看到一些儿童色情犯罪者被发现社交孤立、存在亲密问题或情感缺失（Henry et al., 2010; Middleton et al., 2006;\
  \ Web et al. 2007）。Jung, Ennis 和 Malesky（2012）遵循 Elliot, Beech, Manderville 和 Hayes（2009）的观点，认为这些犯罪者的行为应被理解为实现一种伪亲密的过程，这在没有拒绝风险的情况下补偿了现实生活中亲密的缺失。回顾那些诊断为性偏好障碍（未另说明）的犯罪者，其病理具有强烈的窥视成分。因此，Jung\
  \ 等人（2012）推测，“强迫性使用互联网获取非法色情在概念上类似于寻找和评估潜在伴侣的第一阶段”（p. 662）。\n\n对于儿童色情犯罪是否会升级为性招揽或猥扰的问题，如果性偏好障碍（未另说明）个体对未成年人的痴迷是病态恋爱的一部分，那么这种个体“不仅限于与受害者保持非接触，而是倾向于参与人类性互动的后续阶段，进展到触觉互动，并进入生殖器结合”（Jung\
  \ et al., 2012, p. 662）。\n\n求爱理论的解释是建立在择偶的进化方法之上的。然而，这对于社会或情境对犯罪行为的影响几乎没有解释，特别是通过互联网产生的影响（例如，Wortley\
  \ & Smallbone, 2006）。\n\n### 14.7.2 社会学习理论\n\n提醒一下，社会学习理论（Bandura, 1977）主张通过观察和模仿进行学习。如果一个人观察到了获得奖励的行为，他将更有可能模仿并参与该行为。互联网增强的通信能力扩大了人们可以观察并因此模仿的行为范围，包括对儿童的性虐待行为。在一个可以观察或与参与儿童性虐待的人互动的环境中，观察者能够学习并可能模仿具有虐待特征的行为。在这样的环境中——在一个在线恋童者群体中——个人可能会体验到社区感，在那里儿童虐待的美德被歌扬，[个人]对未成年人的性兴趣得到认可（Malesky\
  \ & Ennis, 2004）。回顾过去，对于色情制品收集者来说，分享儿童色情图像甚至共同组织肢体性虐待，是犯罪者与动机相似的人之间建立的社会关系的纽带特征。\n\
  \n\n\n\n这种类型的网络接触可能会导致观察者产生认知转变，使他们对侵犯行为采取更具接纳的态度，从而更倾向于放松此前阻止他们参与性侵犯的抑制力（Jung et\
  \ al., 2012）。这种社区感和认同感从以下引言中可以看出，该引言摘自一个恋童者网站：“正因为这个新闻组，我直到一个半月前才意识到我是一个恋童者。我曾大笑、哭过，并分享了你们所有优美、悲伤和幽默的帖子。这是人生中第一次有人表现出与我相似的情感”（Durkin,\
  \ 1996, p. 108；引自 Jung et al., 2012, p. 658）。\n\nJung 等人（2012）认为，互联网以以前所未有的程度能够能够传播和获取支持儿童犯罪行为的信念。在缺乏审查、更重要的是缺乏反对声称犯罪者行为具有危害性的异议声音的情况下，支持恋童的观点随处可见。因此，在互联网上访问和/或交易儿童色情内容相对容易——似乎可以不受惩罚——这对于社会学习理论的支持者来说，可能会间接鼓励他人参与同样的虐待行为。\n\
  \n### 14.7.3 Finkelhor 的先决模型\n\n求爱障碍理论与社会学习理论绝非不相容。儿童色情犯罪者可能通过观察儿童性化图像获得一种扭曲的虚假亲密感，并（通过模仿）学习更复杂的犯罪行为；他们还可能通过与其他志同道合的人进行网络交流感到自己的行为是合理的，从而强化了他们的行为。作为求爱障碍理论中求爱进程的一部分，并通过进一步的社会学习理论实践，网络犯罪者可能会从在网上观看色情内容“进展”到儿童性诱骗和/或猥亵。\n\
  \n根据 Finkelhor (1984) 的观点，在发生实际儿童性侵犯之前必须满足四个先条件（改编自 Elliot & Beech, 2009）。犯罪者必须：\n\
  \n1.  `有犯罪动机`，因为 (a) 他们相信与儿童性行为在情感上是满足的和/或 (b) 他们会被儿童引起性兴奋和/或 (c) 正常的性出口（与成年人）被阻断和/or\
  \ (d) 他们以他人通常不具备的方式被去除了抑制；\n\n2.  能够`克服内部抑制`，也许通过 (a) 认知扭曲（如 1a 中描述的那种）和/or (b)\
  \ 冲动性和/or (c) 物质滥用；\n\n3.  能够`克服外部抑制`（阻止接触儿童的正常障碍），也许通过 (a) 诱导和/or (b) 照护者或专业机构（如果其中一方可以接触儿童的话）；\n\
  \n4.  能够`克服儿童的抵抗`，也许通过威胁或礼物（包括特权的给予和剥夺）和/or 通过让（儿童）接触儿童色情内容来进行去敏感化和常态化。\n\n### 14.7.4\
  \ 路径模型与性犯罪的整合理论\n\nWard 和 Siegert (2002) 认为，儿童性侵犯是许多不同因素——或不同的虐待路径的顶点，其中一种因素将产生主要的因果影响，其他仅是次要的（当然，哪条路径被认为是主要的、哪些是次要的取决于具体的犯罪者）。路径模型假设许多不同的路径可能`导致`对儿童的性侵犯；然而，它并没有提供为什么儿童猥亵可能会`持续`的解释。Ward\
  \ 和 Siegert (2002) 在他们对儿童猥亵的因果解释中识别了四个不同且相互作用的心理机制。这些机制表现为亲密感和社会技能的缺陷、扭曲的性脚本、情绪调节障碍和认知扭曲。此外，作为他们性犯罪整合理论（`ITSO`）的一部分，Ward\
  \ 和 Beech (2006) 引入了“生态位”的概念，这指的是人的生物学特征与其社会文化以及物理环境的相互作用（其社会学习）。`ITSO` 还关注三个神经心理系统，这些系统被认为表达了个人的生态位——而且，在儿童性侵犯犯罪者的案例中，这些系统被认为部分或完全功能异常。这些神经心理系统的紊乱被认为会导致成年人性亲密关系问题、行为自控和适应性不良的信念。Elliot\
  \ 和 Beech (2009) 将路径模型与 `ITSO` 整合起来，并将它们应用于儿童色情犯罪者。这种整合的关键方面如下所示。\n\n#### 14.7.4.1\
  \ 自调节控制问题\n\n儿童色情犯罪者报告说，在网络上观看儿童性化图像是逃避生活中某些（感知的）不愉快方面的手段（Quayle & Taylor, 2002）；他们将自己从（不愉快的）个人环境中隔离开。因此，观看儿童色情被理解为处理困难情绪状态的工具，特别是因为性满足的即时奖励（通过在自淫时观看这些图像获得）具有很强的强化作用（Gifford,\
  \ 2002）。\n\n#### 14.7.4.2 社会/亲密问题\n\n此前，我们讨论过一些研究，表明某些儿童色情观看者在启动和/或维持与成年人的亲密关系方面存在问题。因此，考虑到这些犯罪者在成年人面对面性接触方面存在问题，他们的网络性行为发挥了更重要的作用。由于这种性行为与成年人面对面的性接触相比威胁性较小，这可能导致犯罪者访问网络儿童色情（针对周期性好色群体）和/或更积极地寻找并交易它（针对纯幻想群体）（Middleton\
  \ et al., 2006；另见上文关于求爱障碍理论的章节）。\n\n#### 14.7.4.3 反社会思维模式\n\nWard (2000) 认为，儿童性侵犯者的扭曲思维模式具有五个特征信念：\n\
  \n1.  儿童是性生物，只要他们需要/渴望与成年人的性接触并能够同意这样做。\n\n2.  与儿童进行性活动没有危害。\n\n3.  犯罪者优于儿童，因此理受到特殊对待。\n\
  \n4.  世界是一个危险的地方，充满了不可信赖的人。\n\n5.  犯罪者并不能完全控制自己的行为。\n\nHowitt 和 Sheldon (2007) 发现儿童色情犯罪者和儿童猥亵者在信念\
  \ (1) 方面存在差异，前者对这一信念的坚持程度比后者更强。Elliot 和 Beech (2009) 推测，这可能是因为色情犯罪者——特别是纯幻想群体——通常观看的是理想化的儿童性化图像，这些图像似乎证实了信念\
  \ (1)，而儿童猥亵者则经历了现实情况，而这反驳了该信念。\n\n\n\n\nElliot 和 Beech (2009；遵循 Taylor & Quayle,\
  \ 2003) 也描述了儿童色情淫犯罪者如何参与“道德脱离”（Bandura, 1986），这是他们扭曲思维模式的进一步特征。他们经常试图为自己的行为及其相对无害性（正如他们所理解的那样）辩护，理由是这“仅涉及图片”，以及这些图像仅仅是收藏的一部分。正常化现象还通过声称他们在行动上并不孤单（即“其他人也这样做”）来实现。将图像视为对象的感知也是去人性化过程的特征，而去人性正是道德脱离的另一个特征。当犯罪者谈论由于这些图像的泛滥且易于获取，“互联网应该受责”时，责任扩散现象也显而易见。根据\
  \ Elliot 和 Beech (2009) 的观点，对儿童的偏态性兴趣是个人对情绪状态、性欲以及性控制欲望的自我调节出现问题，结合关于儿童的扭曲性相关信念的结果——所有这些因素共同导致了偏态的性幻想和不当的性关注。\n\
  \n## 14.8 结论\n\n互联网增加了获取涉及儿童色情材料（儿童虐待图像）的机会，并促进了其分发。它还为恋童者提供了更多接触儿童的机会。在本章中，我们提供了这种现象增加的原因，并且重要的是提供了对英国和美国儿童色情法律的总结，包括这些法律之间的某些差异。我们还研究了儿童色情犯罪者的分类方法，并考虑了他们的特征，或许是意识到并没有所谓的典型儿童色情犯罪者。我们还讨论了观看儿童色情信息的人与实际犯罪者之间的关系，特别是关于观看儿童色情信息会导致犯罪行为升级的担忧（一种“滑坡效应”论点）。我们在本章结束处，审视了专门用于解释并因此帮助我们理解某些理论模型，这些模型解释了某人成为恋童癖的机制和过程。解释方式的多样性极可能反映了导致儿童色情犯罪的多种因素，而这种犯罪并非随着互联网的诞生而产生，它仅仅是将空间从线下领域跨越到了虚拟领域。\n\
  \n### 讨论题\n\n1. 你认为发送性暗示短信（sexting）仅仅是正常青少年性发育的新表现形式吗？你认为涉及性暗示短信的未成年人应该受到起诉吗，还是你认为此类起诉等同于对儿童色情法的严重误用？\n\
  \n2. 在你看来，法律应该如何处理性化伪照片（pseudo-photographs）？在没有真实儿童图像的情况下创建的性化伪照片和性化图像（例如，计算机生成的儿童形象）在法律上是否应与真实的儿童图像同样对待？\n\
  \n3. 证据表明，存在一个特定的儿童色情犯罪者群体，他们获取儿童色情信息并非寻求在网上接触儿童（目的是为了诱约和骚扰）。你认为这种行为在多大程度上不可避免地升级？也就是说，你是否支持一种滑坡效应论点，该论点认为这种初始行为将或可能导致对儿童的诱约和骚扰？\n\
  \n4. 针对上述问题，你认为对于从未对儿童进行诱约或骚扰的儿童色情犯罪者来说，访问虚拟儿童的性化图像（即数字创建的儿童）在道德和法律上是可以接受的吗？\n\n\
  ### 建议阅读\n\n1. Berlin, F. S. & Sawyer, D. (2012). 通过互联网获取儿童色情的潜在后果以及谁在访问。*Sexual\
  \ Addiction & Compulsivity*, *19*(1–2), 30–40。\n\n2. Quayle, E. & Ribisl, K. M.\
  \ (2012). *理解和预防儿童在线性剥削*。伦敦, UK: Routledge。\n\n3. Seto, M. C. (2010). 恋童症诊断中的儿童色情信息使用和网络诱约。*Archives\
  \ of Sexual Behavior*, *39*, 591–593。\n\n4. Taylor, M., Holland, G. & Quayle, E.\
  \ (2001). 恋童者照片收藏的分类。*Police Journal*, *74*(2), 97–107。\n\n5. Wortley, R. K. & Smallbone,\
  \ S. (2012). *互联网儿童色情：原因、调查与预防*。Santa Barbara, CA: Praeger。\n\n# 15 在线支持与医疗\n\n\
  本章的目的是考虑互联网及相关技术对医疗的影响，体现在健康相关信息的可用性、支持和治疗方面。我们首先研究更有可能搜索在线健康信息的人群类型以及他们为什么要这样做，以及这对个人可能以“网络焦虑症”（cyberchondria）形式产生的潜在负面影响。随后，我们将在线论坛作为健康问题人士知识和支持的场所。利用互联网进行治疗从早期开始一直存在，因此重要的是，我们讨论了在线治疗（或电子健康治疗）并评估了其有效性。最后，我们展示了沉浸式虚拟环境被用于多种健康相关疾病治疗的案例。\n\
  \n## 15.1 互联网与健康\n\n互联网改变了我们与健康相关信息的关系。尽管研究通常显示，医疗专业人员仍是大多数有健康问题的人的首选接触点（Berle et\
  \ al., 2015; Fox, 2011），但健康搜索和论坛等在线资源（人们可以在其中向同伴和/或“知情人士”寻求建议）已成为健康信息的重要来源，特别是在美国（Fox,\
  \ 2011）。因此，说“互联网正在带来医疗系统文化实践和组织的结构性转型”并不夸张（Rossi, 2006, p. 9）。为了支持这一观点，Eysenbach\
  \ 和 Kohler 在 2003 年报告说，全球每天在 Google 上进行的健康相关互联网搜索次数高达 675 万次。此外，Rossi（引用 Pew Internet\
  \ & American Life Project）报告说，在 21 世纪初，美国访问互联网的人中有 55%（相当于 5200 万人）曾使用互联网获取健康相关信息或使用在线健康服务（当时欧洲国家的平均水平较低：约为\
  \ 23%）。在其中，92% 的人认为这些信息是有用的。到 2008 年，美国搜索在线健康信息的比例已上升到互联网访问者的估计 75–80%（Fox, 2008）。\n\
  \n\n\n\n\n作为这种与健康信息不断变化的关系的一部分，Powell (2011) 指出，随着互联网成长的年轻人——有时被称为“数字原住民”——在交流、寻求信息以及一般的互动和娱乐方式上，与前几代人有本质不同，这是因为他们对数字技术熟悉且依赖（正如在第\
  \ 7 章 中讨论的）。因此，他们“对医疗保健等公共服务将是数字化的抱期待”（Powell, 2011, p. 368；另见 Owens 等人，2012）。作为回应，社交媒体现在正被整合到医疗保健环境中，例如通过提供紧急警报以及帮助监测患者护理。世界卫生组织同样利用社交媒体（包括\
  \ Twitter 和 YouTube 等）作为向民众发布最新健康相关新闻的手段（Catford, 2011）。因此，互联网应被视为患者和医疗专业人员的健康相关益处来源（Wright,\
  \ 2012）。\n\n## 15.2 特征与动机\n\n谁更有可能参与在线搜索？什么驱动了这种活动？根据 Lee 和 Hawkins (2010) 的观点，有健康问题的人倾向于寻找信息来帮助他们理解自己的诊断、预后和治疗；同样，那些认为自己健康的人也会寻找健康相关信息，以了解更多关于身体健康状况的信息（我们将在以后讨论电子疗法时更详细地考虑心理/精神健康）。同样，Rice\
  \ (2006) 在分析了多个美国数据库后得出结论，最可能通过互联网搜索健康相关信息的人是那些刚刚被诊断出某种医疗疾病的个体，或正寻求帮助他人应对其医疗问题的人（例如，朋友或父母，或其他家庭护理人员，照顾患有慢性疾病的儿童）。Rice\
  \ 还发现，在职女性也是最有可能在网上寻求健康相关信息的人之一。简而言之，基于健康相关网站的增长以及在欧洲和北美范围内开展的多项研究结果（例如：网络健康基金会，2001；Skinner,\
  \ Biscope, Poland & Goldberg, 2003），所有这些意味着，大量人员正在使用互联网来获取有关疾病、治疗和支持的信息（Horgan &\
  \ Sweeney, 2010；Ybarra & Suman, 2006）。\n\n## 15.3 在线健康搜索与网络疑病症\n\n在网上寻求健康相关信息的人可能只是简单地在搜索引擎中输入关键词，或者可能直接咨询专业健康组织的网站（例如英国的\
  \ NHS Choices）。通过与医疗保健专业人员咨询相结合，研究表明，这种相对简单的策略可以让人对从专业人士那里获得的信息感到更加安心（Parker 等人，1999；Ybarra\
  \ & Suman, 2008）。同样，以这种方式寻求在线健康内容已被证明对个体的药物依从性具有积极影响（Samal 等人，2011），并对个人就医疗保健做出明智决策的能力有帮助（Seckin,\
  \ 2010）。然而，重要的是，虽然这种信息寻求方式显然有其益处，但这种方法并非没有问题。Helft, Eckles, Johnson‐Calley 和 Daugherty\
  \ (2005) 报告说，参与研究的癌症患者对阅读在线癌症信息有负面体验：三分之一的人感到更加困惑，近近四分之一的人感到更加紧张、焦虑或心烦意乱。更广泛地说，在线医疗搜索的一个常见动机是获得一种保证，即医学上没有问题，或者至少没有严重问题（Baumgartner\
  \ & Hartmann, 2011；Muse, McManus, Leung, Meghreblian & Williams, 2012）。因此，减少不确定性引起的不适是人们在互联网上搜索健康信息的主要原因。然而，在线医疗搜索与普通人群抑郁症的增加有关（Bessière,\
  \ Pressman, Kiesler & Kraut, 2010），正如 Fergus (2013) 所指出的，它们往往会导致多种医学上的可能性，其中某些可能比其他的更具威胁性。White\
  \ 和 Horvitz (2009) 发现，使用通用搜索引擎（例如 `Google`）尝试自我诊断的人，暴露在严重疾病信息中的概率不成比例地高。具体而言，约 70%\
  \ 使用通用搜索引擎自我诊断常见且无害症状的人，最终却搜索了更罕见、更严重的疾病（McManus, Leung, Muse & Williams, 2014）。这种行为往往会导致不确定性增加，而不是让相关人员感到放心，可能会加剧病情，从而增加健康相关焦虑，特别是当个体对不确定性缺乏耐忍度时（Fergus,\
  \ 2013；Norr, Albanese, Oglesby, Allan & Schmidt, 2015）。因搜索健康相关信息而导致焦虑增加的被称为“网络疑病症”（cyberchondria），它不仅被解释为一种寻求保证的形式，还被视为健康焦虑和疑病症的表现（Starcevic\
  \ & Berle, 2013）。\n\nMcManus 等人 (2014) 认为，网络疑病症的表达与健康焦虑的认知行为模型是一致的。正如所述，反复检查在线医疗信息来源是寻求保证的一种形式；遗憾的是，这种活动是\
  \ `maintaining` 个健康焦虑的因素，而不是减轻它。McManus 等人引用了多项研究（例如：Haviland, Pincus & Dial, 2003；Lemire,\
  \ Paré, Sicotte & Harvey, 2008；Muse 等人，2012），报告称健康焦虑的人更频繁地搜索信息，但重要的是，增加健康搜索可能会增加他们的焦虑。推测，这增加了他们寻求进一步保证和搜索健康信息的频率，从而使焦虑循环持续下去。\n\
  \n网络疑病症已通过多维度网络疑病症量表进行测量（Mcroy & Shevlin, 2014；另见 Fergus, 2014；Norr, Allan, Boffa,\
  \ Raines & Schmidt, 2015 关于量表的评论）。量表中的项目旨在评估强迫、痛苦、过度、寻求保证和对医疗专业人员的不信任程度。这些因素通过五点李克特量表进行测量，表示频率（1：从不；2：极少；3：有时；4：经常；以及\
  \ 5：总是），参与者对 33 项陈述进行评分，陈述如下（改编自 McElroy & Shevlin, 2014）：\n\n*   在网上研究症状或感知的疾病状况干扰了我的线下社交活动（测量强迫程度）。\n\
  *   在网上研究症状或感知的疾病状况后，我难以放松（测量痛苦程度）。\n*   我在 Web 搜索中多次输入相同的症状（测量过度程度）。\n*   我会与家庭医生或健康专业人员讨论我的在线医疗发现（测量寻求保证程度）。\n\
  *   我重视家庭医生或医疗专业人员的意见胜过我的在线医疗研究（测量对医疗专业人员的信任或不信任）。\n\n在寻求健康相关信息时，除了更通用的互联网搜索，越来越多的人正在利用健康相关的讨论论坛（Tanis,\
  \ 2008）。在互联网时代，此类虚拟社区正成为一种日益常见的健康传播形式。因此，让我们进一步讨论这种在线活动。\n\n## 15.4 社交媒体、小组论坛和支持网站\n\
  \n\n\n\n\nLiang 和 Scammon (2011) 指出，在如今的医疗环境中，患者并不总是容易、实际上也无法在相对短的问诊通过与医生面对面交流获取所需的所有信息和支持。因此，自世纪初以来，社交网络（SNSs）开始以虚拟社区的形式出现——有时被称为自助小组或社会支持小组——这些社区由“朋友”或对特定健康相关问题更了解（可能是通过第一手经验）的人组成，这些问题涵盖非常广泛，从易激性肠综合征（Coulson,\
  \ 2005）、不不育（Malik & Coulson, 2008）、流产（Gold, Boggs, Mugisha & Palladino, 2012）、抑郁症（Griffiths\
  \ et al., 2012）到艾滋病毒/艾病（Mo & Coulson, 2008）等。\n\n在这些论坛中，人们可以寻求帮助和建议（Sillence, 2013）。这通常会变成一个主题，包含对初始问题的系列回复和/或围绕这些回复的讨论。它还可能涉及某人讲述一个具有信息量的相关轶事，或者至少传达出这样一个信息：有其他人——“经验专家”——他们根据对该个人正在经历之事的先验经验，产生了基于同理心的理解（Donelle\
  \ & Hoffman‐Goetz, 2009），这也许是该个人在线下社交网络中的其他成员无法提供的支持。\n\n此外，Tanis (2008) 描述了这些论坛如何成为获取有关治疗或应对策略的有用信息的好地方，或者仅仅是一个提供鼓励和支持并带来归属感的地方。这可能帮助个体感到对自己的病情更有掌控感，或者至少减少不确定性，特别是对于最近才确诊的患者。它也可能是一个让他们在讨论与他们经历相关的问题时感到更轻松的地方——与在同事、甚至朋友和家人面前相比——如此，特别是当他们感到羞耻或害怕被污名化时（Berger,\
  \ Wagner & Baker, 2005; Webb, Burns & Collin, 2008）。\n\n论坛成员潜在且可能的多样性也意味着，那里可能有丰富的多样化信息，而这些信息在线下是难以获取的。这种多样性可以在某种程度上帮助满足不同个的需求，正如\
  \ Liang 和 Scammon (2011) 所指出的，健康传播的研究支持这样观点：最有效的健康传播是定制化的健康传播。因此，健康相关信息和交流应该是定制的，以满足个体的需求、特征、技能组合和能力（例如阅读和理解能力、计算机素养）以及动机。\n\
  \n当然，在线论坛在实现定制交流目标方面的有用性必须受到事实的限制，信息并不总是可靠或在医学上是合理的（Owens et al., 2012）。毕竟，此类论坛并不一定有医疗专家光顾，也不要求有专家光顾。Horgan\
  \ 和 Sweeney (2010) 对通过互联网获取的健康相关信息的质量表示担忧。为了支持这一观点，他们引用了 Eysenbach、Powell、Kuss 和\
  \ Sa (2002) 对 79 项研究的综述，这些研究评估了在线健康信息的质量。虽然对其中一些原始研究（以及它们的结论）的质量存在担忧，但 Eysenbach\
  \ 等人仍然报告说，70% 的结论认为在线提供的健康相关信息标准存在问题。\n\n尽管如此，许多研究健康相关论坛对其用户影响的研究报告了积极影响。例如，Kramer\
  \ 等人 (2015) 研究了针对自杀受害亲属在线同伴支持论坛，其中许多人表现出抑郁症状和与健康相关的问题。他们描述了三分之二的参与者认为论坛是有益的，特别是在社会支持方面。他们还发现，总而言，一年后参与者的抑郁症状和幸福感有了小到中等程度的改善（尽管一些人仍在与心理健康作斗争）。\n\
  \nJones 等人 (2011) 在其针对自残受者的在线论坛的调查中，发现参与者非常重视能够与陌生人匿名交流他们的自残问题。他们发现，以这种方式进行披露比面对面或通过与某人交更容易。参与者还报告说，他们从论坛中学到的关于自己的知识比从在线信息网站更多，并觉得从与他们有相似感受的人互动中获益了。\n\
  \nKirk 和 Milnes (2015) 研究了针对囊性纤维化青少年及其父母的在线支持论坛的有效性。囊性纤维化患者表示，在线社区意味着他们有一个安全的地方来分享经验、交流基于经验的建议和观点，关于如何管理他们的治疗以及更广泛的生活，包括他们的情感、关系、身份以及他们从医疗服务获得的支持。囊性纤维化儿童的父母则寻求并接受了关于管理孩子健康的建议，包括特定的疗法。Kirk\
  \ 和 Milnes 还描述了论坛如何补充专业支持，并帮助父母和孩子在与医疗保健人员互动时培养专业知识以赋能自己。\n\nOwens 等人 (2012) 对邀请医疗保健人员加入支持自残青少年的在线论坛讨论的可能益处感兴趣。他们报告说，在招募这些同意参加的医疗专业人员期间最初表现了兴趣，但随后对积极参与论坛表现出不愿。建议的某些原因包括专业人员对参与此类交流缺乏信心、涉及私人与职业边界的问题，以及考虑到对护理责任和问责的影响，对角色清晰度的需求。Owens\
  \ 等人邀请医疗专业人员进入在线支持小组讨论这一匿名世界的失败尝试凸显了将这两种信息和支持机制整合为一个运作整体的问题（也许说是难题）。\n\n\n\n\n\n\
  > 一种新的治疗模式，旨在通过电子手段（同步或异步）帮助客户解决生活和人关系问题。[它]是一个与治疗师在线进行持续性对话的互动过程，在此过程中，客户和咨询师身处不同或远程地点，并利用电子手段相互通信。\
  \ (Olasupo & Atiri, 2013, p. 408)\n\n## 远程治疗的演变\n\n当然，远程治疗的现象并不新鲜。例如，在 17 世纪和 18\
  \ 世纪，医生通常根据患者对症状的书面描述进行诊断，而不是通过体检（Spielberg, 1999）。此外，在 19 世纪，弗洛伊德通过信进行治疗实践（Brabant,\
  \ Falzeder & Giampieri‐Deutsch, 1993）。然而，电子治疗在 20 世纪 80 年代开始成为心理咨询实践中的一种交付方法（Alleman,\
  \ 2002; Oravec, 2000; Skinner & Zack, 2004）。它们包含了与 `Internet` 兼容的各种电子媒体，应该被视为一种治疗的`delivery`，而不是治疗本身（Sucala,\
  \ Schnur, Brackman, Constantino & Montgomery, 2013）。\n\n## 电子治疗的模式\n\n例如，基于文本的会话可能涉及电子邮件、聊天室和短信（Andersson,\
  \ Sarkohi, Karlsson, Bjärehed & Hesser, 2013; Hucker & McCabe, 2014）。非文本的治疗可能涉及仅限语音通信或视频会议（Dunstan\
  \ & Tooth, 2012; Nelson & Lillis, 2013; Santhiveeran, 2005）。这些每一种可以是同步的（实时发生，从而提供即时反馈）或异步的（涉及时间延迟，因此缺乏即时响应）。在世纪之，只有大约\
  \ 10% 的治疗师报告过使用某种形式的在线媒体与患者/客户通信（VandenBos & Williams, 2000; Wright, 2002）。在挪威进行的一项更最近的研究中，这一比例已增加到\
  \ 45%（Wangberg, Gammon & Spitznogle, 2007）。\n\n## 电子治疗的优势\n\n取决于所使用的精确媒介，除了保密之外，电子治疗与面对面治疗相比提供了更高的匿名性。对于某些人来说，这可能提供额外的吸引力（Hucker\
  \ & McCabe, 2014; Qian & Scott, 2007; Rains, 2014; Tanis, 2008）。此外，Prabhakar (2013)\
  \ 我们我们，研究支持这种观点：“客户在在线会话中比面对面治疗更诚实、更合作，并倾向在更短时间内探索更深入的问题”（p. 213；尽管请参见下文关于潜在风险的讨论，作为对这一说法的提醒）。电子治疗的进一步优势包括（改编自\
  \ Olasupo & Atiri, 2013）：\n\n*   消除或减少了地理边界带来的不便，包括距离以及因此旅行；\n*   对于那些有时间限制或其他责任（例如照顾孩子）或感到社交孤立的人来说更加方便；\n\
  *   能够在自己舒适的家中接受治疗；\n*   为那些因害耻或害怕标签化而寻求避免面对面治疗的人提供了真正的替代方案；\n*   产生治疗会话的书面记录（在基于文本的电子治疗情况下），这些记录可以作为计算机化的病历。\n\
  \n## 患者偏好与益处\n\n根据 Recupero 和 Rainey (2005)，患者偏好可能是电子治疗益处的最清晰指标之一。例如，Postel, de\
  \ Jong 和 de Haan (2005) 在荷兰进行研究后发现，对于不愿参与离线（面对面）治疗的人来说，电子治疗被认为是治疗酒精问题更有吸引力的手段。跨越困难距离的能力也是一种优势。例如，电子治疗已用于治疗偏远地区的军事人员（Jerome\
  \ et al., 2000）。某些患者可能认为电子治疗为他们提供了更多的隐私，尽管正如我们在下面将看到的，情况并不如此，因为在线治疗无法避免与保密相关的风险。Recupero\
  \ 和 Rainey 还指出，对于某些人来说，消除面对面的互动可能促进自我披露和诚实（再次，请参见下文关于基于抑制增加的潜在风险的讨论）。对于 Skinner\
  \ 和 Latchford (2006) 来说，`Internet` 的普及和便利，加上匿名机会的增加，使其成为咨询的理想媒介。\n\n## 缺点与伦理挑战\n\
  \n尽管如此，电子治疗并非没有缺点，其包括（改编自 Olasupo & Atiri, 2013）：\n\n*   依赖于可靠的 `Internet` 连接，或依赖于通信所需的适当硬件和软件，或者拥有使用这些设备的技术技能（这些都可能排除低收入客户和受教育程度较低的人群）；\n\
  *   遇到欺骗性电子治疗师的风险；\n*   保密风险：私人信件可能在网上被黑客攻击，即使没有，电子邮件的副本（如果这是选定的通信方式）也会留在其经过的大多数服务器中；\n\
  *   基于文本的通信中缺乏非语言线索，这可能导致误解，从而阻碍清晰的沟通和治疗，而且缺乏直接观察，这再次阻碍电子治疗师对治疗效果的评估；\n*   治疗不一致的风险，由于技术困难或客户缺乏动力，会话未能按固定间隔进行；\n\
  *   电子治疗难以提供应急服务的事实。\n\n\n\n\n\n大多数形式的在线治疗（e-therapy）内在潜在风险之一是缺乏面部表情线索。因此，基于文本的沟通可能会降低个体的抑制（称为去抑制效应；Suler,\
  \ 2004；另见第 3 章）。根据 Recupero 和 Rainey (2005) 的观点，由于抑制的可能性增加，“一个害羞患者在聊天室里比在治疗师办公室里更有可能吐露自杀意图，[这意味着]在线治疗师现在必须考虑一个可能远在远方的患者的安全问题”\
  \ (p. 322）。为了帮助防止此类事件的发生，并以此提高线下危机干预的概率，在线治疗师可能会决定将在线治疗限制在本地患者。事实上，Recupero 和 Rainey\
  \ (2006) 报告说，某些网站会取消某些不符合条件的潜在客户/患者的资格（例如，那些具有“自杀倾向”的人）。此外存在误诊的风险，特别是考虑到心理治疗师在做出诊断时传统上依赖非语言线索。当然，视频会议可能会减少这种机会，但正如\
  \ Santhiveeran 和 Grant (2006) 在调查 73 个在线治疗网站后发现的，这些网站上的大多数治疗是以邮件通信的形式进行的，只有极少数在线治疗师提供视频会议。Recupero\
  \ 和 Rainey (2005) 还注意到，视觉线索的缺乏可能意味着药物的任何副作用都可能被在线治疗师察觉。因此，一些治疗师不会在网上开处药物。此外，在研究了\
  \ 44 个在线治疗网站后，Heinlen、Welfel、Richmond 和 O’Donnell (2003) 得出结论，“提供在线治疗的心理学家数量较少，他们的服务是多样化的，对既定伦理原则的遵循情况参差不齐”\
  \ (p. 112)。\n\n## 15.6 评估在线治疗的有效性\n\n已有证据支持在线治疗对各种心理社会问题具有有效性 (Barak, Hen, Boniel-Nissim\
  \ & Shapira, 2008; Rochlen, Zack & Speyer, 2004)，但对其有效性的广泛研究仍然有限，且研究结果可能差不齐。例如，Aardoom、Dingemans、Spinhoven\
  \ 和 Van Furth (2013) 以及 Dölemeyer、Tietjen、Kersting 和 Wagner (2013) 的研究对在线治疗饮食障碍的效果得出了积极结论。相反，Loucas\
  \ 等人 (2014) 基于对 20 项研究的元分析得出的结论是：在线治疗饮食障碍的有效性不能被描述为“有前景的”，也没有任何坚实的依据认为在线治疗是面对面治疗的有效替代方案，至少在饮食障碍方面如此。\n\
  \n在线治疗有效性研究中一个需要解决的问题是如何将“依从性”（adherence）操作化，以便能够以更大的信心衡量治疗计划依从性与治疗结果之间的关系。Donkin\
  \ 等人 (2011) 对各种在线治疗干预进行了系统性回顾。他们注意到，依从性的报告及其与结果的关联性存在巨大差异，这可能导致了研究结果的波动。因此，Donkin\
  \ 等人建议使用依从性的综合标准，涵盖在线时长、活动完成情况以及与干预措施的积极参与。\n\n此外，Sucala 等人 (2013) 提出了“治疗联盟”的问题，以及在尝试在线环境中建立这种关系时可能存在的困难。治疗联盟被定义为“患者与治疗师之间工作关系的性质”（Sucala\
  \ et al., 2013. p. 283）。Sulcala 等人告诉我们，在面对面课程中，研究表明治疗联盟与治疗结果之间存在强正相关（例如 Horvath,\
  \ Del Re, Fluckiger & Symonds, 2011; Lambert & Barley, 2001）。然而，在在线治疗背景下关于这种关系的研究很少。已有的少量工作（例如\
  \ Sucala 等人 2012 年对文献的系统性回顾）表明，虽然由于研究匮乏，尚无法对在线治疗中治疗联盟的性质得出确定性结论，但似乎确实迹象表明它至少等同于面对面治疗。Sucala\
  \ 等人 (2013) 还对临床医生在在线治疗背景下对联盟重要性的感知感兴趣。他们发现：\n\n> 临床医生对面对面治疗中联盟重要性的评分高于他们对在线治疗中联盟重要性的评分，这一结果可能表明临床医生没有意识到治疗联盟在在线治疗中可能具有的重要作用。(p.\
  \ 290)\n\n从这里，他们得出结论：\n\n> 这一结果似乎反映了在线治疗文献的现状，其中治疗关系极少被研究……如果在线治疗文献能够追上并开始反映普通心理治疗文献在承认治疗联盟在治疗过程中所起的作用方面的表现，那么临床医生对在线治疗中联盟重要性的感知可能会改变。(p.\
  \ 290)\n\n在结束本节时，Castelnuovo、Gaggioli、Mantovani 和 Riva (2003) 的观点似乎恰当。对于这些作者来说，新在线技术的引入不应被认为是一种新的心理治疗理论方法，也不应该是一种替代治疗。相反，这种技术应该被视为一种补充传统治疗方法的资源。正如他们所说：\n\
  \n> 在线治疗可以代表技术工具与传统临床技术方案之间的有效整合，以提高治疗过程的有效性和效率……[然而]，为了增强在线治疗的普及，还需要进一步的研究。需要对临床结果、组织影响、医疗提供者和用户的利益以及质量保证进行更多评估。到为止，实证研究不足以客观评估在线治疗的所有优点和局限性。(380–81)\n\
  \n事实上，基于目前对在线治疗有效性的研究，Loucas 等人 (2014) 也许最好总结了现状，涵盖了在线治疗不可避免的发展以及对保障的需求：\n\n> 随着互联网和移动设备应用程序（App）的广泛可用以及它们直接向用户提供某些心理治疗的能力，健康问题的治疗在未来\
  \ 10 到 20 年可能会发生显著变化。这种变化将极大增加这些治疗的可获得性，但也伴随着风险，主要风险之一是无效甚至有害干预措施的传播。因此，临床医生和公众都需要获得关于许多在线及基于应用的干预的实证状态和临床用途的权威最新指南。(p.\
  \ 122)\n\n## 15.7 沉浸式虚拟环境作为治疗辅助\n\n最后，值得注意的是，以“沉浸式虚拟环境”形式存在的数字技术正越来越多被用作各种心理问题的工具。这种沉浸式环境能够模拟许多现实情况，从而让患者能够在数字模拟的安全和控制范围内，以真实的方式体验这些情况。\n\
  \n\n\n\n举例说明：严重的认知障碍及随后的行为障碍往往发生在创伤性脑损伤和中风之后。作为康复的一部分，患者需要评估他们参与日常生活活动的能力。Lee 等人（2003）设计了一个超市形式的沉浸式虚拟环境，以帮助评估患者的康复水平（评估患者在虚拟超市中穿行、挑选物品以及开关门等能力的程度）。Cárdenas、Munõz、González\
  \ 和 Uribarren（2006）同样报告了沉浸式虚拟环境在治疗广场恐惧症方面的有用性（另见 Alcañiz 等人，2003；Martin, Botella,\
  \ Garcıá‐Palarios & Osma，2007）。作为治疗的一部分，患者可以（虚拟地）暴露在所恐惧的情境中（在这种情况下是开放空间的模拟）。Freeman（2008）则发现这种沉浸式技术是控制精神分裂症患者社交环境的有效手段（必须与地铁上的虚拟角色进行互动）：Freeman\
  \ 声称，这是理解精神病（包括偏执性恐惧）的一大步（另见 Freeman 等人，2008；Ku 等人，2007）。沉浸式虚拟环境还被用于辅助治疗（其他）蜘蛛恐惧症（Carlin,\
  \ Hoffman & Weghorst, 1997）、烟草依赖（Culbertson, Shulenberger, De La Garza, Newton &\
  \ Brody，2012）、牙科手术中的疼痛控制（Hoffman 等人，2001）、社交恐惧（Roy 等人，2003）以及幻肢患者的疼痛减轻（Murray, Patchick,\
  \ Pettifer, Caillette & Howard，2006）。沉浸式虚拟环境还被用于辅助长时间暴露法，该疗法要求患有创伤后应激障碍（PTSD）的患者重新经历创伤性事件（而不是寻求逃避它）。对于因战斗导致\
  \ PTSD 的战争老军人来说，患者需要体验战场模拟，包括地雷爆炸、遭遇伏击以及处理伤员。\n\n## 15.8 结论\n\n互联网已被证明是患者传统护理和支持的有效补充。然而，互联网及相关虚拟技术对健康和健康教育的影响和范围尚未完全为人知，也没有得到充分测试。互联网确实提供了增加用户获取医疗知识和支持的可能性，从而能够实现更多的协作与护理。\n\
  \n### 讨论问题\n\n1. **通过互联网获取医疗信息（例如疾病症状和治疗方法）有什么好处？这可能会带来任何潜在问题甚至危险吗？**\n2. **论坛可能为患者提供什么样的支持（如果有），是传统的社交和/或医疗支持无法提供的？**\n\
  3. **为什么医疗专业人员可能不愿甚至不愿意参与在线医疗论坛？**\n4. **电子治疗（e-therapy）的优缺点是什么？**\n5. **在沉浸式虚拟环境中治疗患者，甚至在类环境中培训医生（包括外科医生），可能有什么优势或优势？**\n\
  \n### 建议阅读\n\n1. Barak, A., Hen, L., Boniel‐Nissim, M. & Shapira, N. (2008). 对基于互联网的心理治疗干预有效的全面综述和元分析。*Journal\
  \ of Technology in Human Services*, *26*, 109–160.\n2. Berle, D., Starcevic, V.,\
  \ Milicevic, D., Hannan, A., Dale, E., Brakoulias, V. & Viswasam, K. (2015). 患者更倾向于面对面还是基于互联网的治疗？*Psychotherapy\
  \ and Psychosomatics*, *84*(1), 61–62.\n3. DeJong, S. M. (2014). 博客与推文、短信与好友：医疗保健中的社交媒体和在线专业精神。圣地亚哥，CA：Elsevier\
  \ Academic Press。\n5. Fergus, T. A. (2013). 网络焦虑和对不性的不忍：检验个人在互联网搜索医疗信息时何时产生健康焦虑。*CyberPsychology,\
  \ Behavior, and Social Networking*, *16*, 735–739.\n6. Hsiung, R. C. (2002). *电子治疗：案例研究、指导原则和互联网的临床潜力*。伦敦，英国：W.\
  \ W. Norton.\n\n# 16 结语思考\n\n> 到 2050 年，将有 90 亿人口需要食物、衣物、运输、就业和教育。我们致力于一个由增长驱动的世界经济，这种经济必须持续通胀几个世纪，为每个人提供无限制的消费。有了新技术，我们是否能增加一个数字世界，在共同努力的同时帮助每个人成功和繁荣？我们能否成为一个伟大成为常态成功的世界？（Abelow,\
  \ 2014）\n\n互联网的设计初衷是连接计算机而非人类。尽管如此，人们开始发现这种技术的社交用途。个人很快开始以电子邮件的形式撰写私人信息，在线社区开始涌现以连接全球各地的人们。浪漫关系和友谊开始通过数字技术建立和发展——旁观者发现很难想象个人竟然与那些在物理世界未见过的人建立“强纽带”。正如上面的引言所示，数字技术将继续发展和变化——互联网将如何增长尚待待定。“物联网”说明了随着物理物体变得连接起来，世界正在发生变化，为人们的连接和生活提供了新的机会。\n\
  \n\n\n本书试图对网络心理学领域涵盖的主题和研究进行全面的探讨。尽管本书植足于心理学，但其主题也对媒体与传播、哲学、社会学、犯罪学和安全研究感兴趣的人具有相关性（这些学科的课程中通常包含了心理学）。正如本书中所阐述的，网络心理学跨越了广泛的主题，其中某些主题在书中可能并未涵盖。然而，我们尝试介绍许多经过充分研究的主题，以及与个人和整个社会相关的领域。在可能的情况下，我们展示了现实案例，并探讨了心理学如何应用于解释网络上发生的特定行为和事件（例如：网络极端化、DDoS\
  \ 攻击、针对阿什莉·麦迪逊的黑客攻击）。在几乎每一个章节中，我们还包含了建议的活动和讨论问题，希望这些内容能够吸引读者和课堂参与。许多问题要求读者结合书中提出的理论和实证研究来思考自己的生活，我们希望这能为人们的生活提供新的见解。此外，我们希望这些活动和问题能帮助读者对现有文献采取批判性态度，并帮助他们识别需要进一步调查的研究空白。\n\
  \n### 网络空间中的关键理论与身份\n\n我们在书的开头介绍了一些在互联网出现之前开发的关于自我和身份的关键理论，并进一步探讨了这些理论如何与网络领域相关，或它们如何被调整以解释网络空间中的身份。此外，我们对一些关于自我和身份的新型理论进行了批判性概述，这些理论被用来解释网络空间为重塑“自我”提供的新机会。\n\
  \n这些理论在书中的多个章节中被反复审视（例如解释网络环境中的关系建立、儿童和青少年对数字技术的使用、虚拟环境中的游戏以及各种形式的网络犯罪）。书中还探讨了专门为了解释网络空间中发生的行为而开发的其他理论。例如，`disinhibition\
  \ effect`（去抑制效应）（由于网络空间的特质，人们感到受抑制较少），它在书中多个章节中得到了关注，并用于解释为什么人们在网络空间中会执行他们在物理世界中不太可能从事的行为。\n\
  \n### 益处、问题与未来展望\n\n我们试图涵盖网络空间迄今带来的社会和心理益处，以及问题和缺点。积极方面的例子包括：教育、结识新朋友和建立关系的新机会，以及社会支持和健康方法的改进。尽管如此，数字技术引发了一些新问题；例如，新一波犯罪，研究人员尚未对其找到有效的预防和威慑策略。然而，某些问题的出现纯仅仅是因为我们尚未更好地理解人类如何与技术互动。一旦我们理解了这一点，数字技术可能会提供更多机会（例如在教育和健康领域）。\n\
  \n我们希望读者阅读本书的乐趣正如我们撰写本书时一样。这对我们来说是一段旅程，编写这本书帮助我们思考了自己的工作以及需要进一步检查的重要领域。我们还希望它为你（读者）开辟探索的新路径，无论是在个人生活中还是在研究中。网络心理学是一个新颖且有趣的领域，其他人有充足的机会在该学科做出贡献——无论是通过学生的论文、学术者的研究项目，还是更广泛地通过人们的工作和家庭生活。\n\
