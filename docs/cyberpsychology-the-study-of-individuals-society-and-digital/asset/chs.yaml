- "# 网络心理学：个体、社会与数字技术研究 (BPS 心理学教科书)\n\n\n\n\n# 1. 引言\n\n数字技术在我们的日常生活和工作生活中都发挥着重要作用，在未来其重要性将继续增加。鉴于这种重要性，网络心理学（cyberpsychology）作为心理学的一个新分支出现并不意外，它已经在许多主流心理学学位以及媒体与传播、哲学、社会学、犯罪学和安全研究等学科中被教授。目前，专门专注于网络心理学的良好且高影响力的期刊已经出现。学术会议也针对这一主题进行了设计，并变得越来越受欢迎。网络心理学硕士课程在全球范围内涌现，吸引这些课程的学生人数也不断增加——这很可能是因为互联网持续增长，并以新的、具有挑战性且令人兴奋的方式影响着人们的生活。\n\
  \n网络心理学是个、社会、数字技术以及它们相互作用的心理机制的研究。网络心理学应用心理学理论来解释个人如何在网络空间中互动，以及这些互动如何影响我们的线下生活。它为定义自我和社会尚提供了一种新方法。在书中，我们试图涵盖网络心理学的广度和深度，尽管随着该学科的扩展，它可能会纳入新的、令人兴奋的领域和重点。\n\
  \n本书旨在作为心理学专业本科生和研究生以及其他将心理学纳入教学大纲的相关专业的教科书。它旨在阐述网络心理学领域的关键理论和实证研究。我们通过考虑现实世界的问题和事件来实现这一点，并思考该领域的理论如何进一步深化我们对这些问题的理解。此外，它还引导读者关注新颖且相关的问题——鼓励他们批判性地评估现有文献，并对特定问题采取自己的个人立场。\n\
  \n我们从关注网络空间中“自我”定义的这一复杂问题开始，并提出了这样一个观点：互联网改变了我们看待和理解自我的方式。在第 2 章中，我们首先考虑了传统的自我理论——例如特质理论、社会身份认同理论、可能自我、社会建主义方法以及自我的后现代观点。随后，我们介绍了自我在网络空间中是如何被理解的历史。在本章中，我们承认了特克尔（Turkle）早期的工作，她理论化个人可以在网络空间内探索并获得关于身份的新见解。本章还提到了其他对互联网持有这种乌托邦式观点的理论者，特别提到了女性主义理论家，如哈拉维（Haraway）。然而，我们注意到，特克尔在近期拒绝了她早期的主张，现在了相反的观点，认为数字技术可能导致新的孤独感。格根（Gergen）关于饱和自我的理论在这里也得到了强调，他还认为新技术的导致了自我的碎片化。我们简要概述了传统的自我理论如何应用于自现在网络空间中的呈现方式——例如，考虑了戈夫曼（Goffman）的“表演自我”、“可能自我”理论和社会身份认同理论。我们在本章结束处指出，用户可以实现视觉匿名的地方寥寥无几，因此我们建议在线自我的理论需要考虑用户视觉匿名空间与他们展示自身形象空间之间的差异，以及他们在视觉上呈现自我形象时所做出的选择。\n\
  \n在第 3 章中，我们阐述了一些研究在线关系的理论和经典研究——包括朋友之间和浪漫关系之间的。我们首先列述了一些关于关系发展的著名理论，这些理论解释了关系如何在物理领域中发展，例如社会演化理论、社会渗透理论、交换理论和公平理论。然后，我们转向研究这些理论如何被用于解释在线关系的发展，并指出它们的一些局限性。由于这些局限性，人们开发了理论来解释在网络空间中启动和发展的某些关系与物理世界相比的独特性。书中概述了如“抑制效应”、社会存在理论、社会信息处理理论和超人格沟通理论等理论。我们解释了这些理论是如何产生的，以及如何被应用于解释在线交往。我们还提供了在线交往的简史，并详细说明了随着技术的发展交往发生变化的方式——特别是从一个更具文本的空间到一个带宽更大、视觉匿名性更低的空间。\n\
  \n在线约会已从一种被污名化的寻找对象的方法转变为许多国家不同年龄段人们的流行匹配方式。第 4 章专门关注这一现象，并汲取了第 3 章中概述的一些理论，以考察关系的启动和发展与在网络其他地方以及物理领域形成的关系有何不同，同时又有何共同点。我们研究了发现与使用在线约会相关的性格差异的研究；例如，一些研究发现，与社交上更有自信的人相比，害羞的人更有可能使用约会网站。我们还探索了在在线约会网站上自我被商品化的观点，以及个人的呈现方式在某种程度上取决于哪些方面更容易吸引理想的约会对象（这种动机有时会导致欺骗，即约会者在自己的某些方面如身高和体重上撒谎）。我们还分析了在线约会过程中涉及的阶段，注意到新一波约会应用正在改变用户对这一过程的体验。\n\
  \n在第 5 章中，我们考虑了在线性活动。我们注意到，即使在互联网早期，人们也以色情文本通信的形式参与网络性。本章概述了一些被广泛引用的论文，考虑了个人为何参与网络性的原因。例如，`Triple\
  \ A Engine`是库珀及其同事提出的一个模型，认为互联网的负担得起、匿名性和便利性最初导致了一些人被吸引到空间参与性活动。库珀认为，其中一些人变成了网络性成迫症。本章进一步概述了与网络性相关的一些问题，以及它的一些解放方面。其中一个当代仍然存在的问题是，互联网使得风险的线下性接触成为可能，研究揭示了在线寻找性伴侣与性传播疾病（STIs）之间的相关性。在本章描述的短信摄影（Sexting）也是一项存在问题且有时违法的活动。然而，另一方面，互联网提供了性健康信息，这些信息易于获取，且无需像医生那样感到尴尬，从而可能预防性疾病的传播。\n\
  \n\n\n\n\n正如我们在第 6 章中讨论的那样，有些人认为网络不轨是一种真正的背叛，会对伴侣的生活产生真实的影响。我们根据现有的理论和实证结果对网络不轨定义了定义。我们审视了在线和线下关系违背行为在性与情感两个方面。\n\
  \n本章还对解释男女为何在物理世界中产生嫉妒的理论（例如社会进化论和社会认知方法法）进行了批判性审查，并探讨了这些理论是否可以适用于解释对网络空间中看似对等活动产生的嫉妒。尽管关于网络不轨的研究仍然匮乏，但本章指在线和线下外遇之间存在存在的一些性差异。例如，网络外遇可能更容易从人的日常生活中分离出来——这使得出轨的人更容易将其合理化为并非一种关系违背行为。我们还考虑了与化身进行性行为是否构成了“真实”的背叛。在这里，我们提供了一些现实案例，描述人们对\
  \ `Second Life` 中伴侣的网络性活动感到受伤和被背叛。\n\n多年来，关于数字鸿沟的讨论很多。有些人讨论的是社会阶层之间的鸿沟，而另一些人考虑年龄之间的差异（例如，数字原住民与数字移民）。第\
  \ 7 章侧重于数字原住民——儿童和青少年对数字技术的使用。然而，它并不仅仅是探讨年轻人如何轻松地将数字技术融入生活。此外，它还考虑了年轻人自互联网出现以前一直在面对的问题（例如身份、性倾向、行动主义）以及这些问题在网络空间中是如何处理的。我们在这里审视了使用数字技术对青少年是有害的还是赋能的，并详细说明了支持这两种观点的实证结果。我们提供了一个平衡的观点，指出了风险和机会。我们研究了青少年可能接触到的非法内容类型以及一些青少年参与的非法活动种类。我们还问，对于某些青少年来说，接触非法内容是否可能是滑坡效应的开始。虽然我们在第\
  \ 13 章中研究了网络骚扰，但在本章中，我们关注了这种行为如何影响青少年。本章还概述了犯罪分子如何针对青少年进行诈骗，以及他们的身份如何被盗用并随后用于诈骗他人（例如，祖父母骗局）。最后，本章探讨了通过网络导致青少年激进化的非常真实的担忧。\n\
  \n早在 1913 年，托马斯·爱迪逊就预测新技术将处于教育的前沿。正如第 8 章所示，爱迪逊的预测可能是正确的，但极可能是以他未想象的方式实现的。我们在本章开始关注电子学习，并将其与面对面学习进行比较，指出了电子学习所提供的优势。我们还评论了电子学习中可能对学生学习表现产生负面影响的特征。在比较电子学习与面对面学习时，我们发现不同类型的学习可能从不同的教学实践中受益。例如，研究人员发现，学生在处理困难任务时倾向于面对面讨论，而在处理简单任务时倾向于计算机介学习。在本章中，正如我们在其他章节中所做的那样，我们对比了同步和异步通信。我们强调了两者电子学习方面的优势。我们还指出了电子学习成功的必要条件，包括认知存在、社会存在和教学存在。此外，我们向读者介绍了媒体丰富度理论：该理论已应用于包括教育在内的多个场景。根据这一理论，我们制定了何时使用电子学习实践最佳。本章还查看了萨尔曼阶段模型，以及该模型在\
  \ `Second Life` 中的应用。事实上，`Second Life` 和其他 3D 学习环境已成为教育工作者作为学习环境的热门空间，在本章中，我们查看了一些评估这些环境中学习的研究。\n\
  \n在第 9 章中，我们将重点从教育转向对休闲和娱乐的追求。互联网腾出了追求休闲活动的时间吗？它是否提供了新的娱乐形式？本章研究了这些问题以及更多问题。我们在本章开始时对休闲进行了操作化定义，指出了休闲的不同形式，例如严肃爱好和休闲消遣，以及过去家庭可能更经常地聚在一起在家里玩桌游。与这种更传统的观点相比，当我们想到在线游戏时，我们往往会想象一个青少年在锁起来的卧室里孤独地玩游戏，或者在自己的卧室里与其他青少年联系。然而，研究人员发现，在线游戏也可以帮助家庭成员保持联系。而且，正如读者将学到的，互联网对老年用户的主要功能之一是追求休闲活动，例如参与虚拟爱好（如构建家族树）。重要的是，本章查阅了关于我们在休闲和娱乐方面花费了多少在线时间的文献，以及这与在物理世界花费的娱乐时间相比的情况。它审视了替代假设和参与假设。读者可能不会对发现许多人在两个领域同时进行多任务娱乐感到意外（例如，边看电视边玩在线视频游戏）。本章确实质疑了结合这些任务在心理上是否健康。在本章的最后一节中，我们考虑了\
  \ `Twitter` 如何被用娱乐来源，以及它对追随者与名人推文者之间感知关系产生的影响。\n\n\n\n\n# 第 10 章：游戏与赌博\n\n`[第 10\
  \ 章]` 通过关注游戏和赌博对娱乐领域进行了更详细的探讨。我们首先研究了网络游戏和赌博成瘾。例如，有人推测，网络赌博比线下赌博更容易导致成瘾。网络赌博的某些特征，如易于获取、隐私性、匿名性和更好的游戏体验，可能会增加产生问题的风险。在此处，我们将最新版*精神疾病诊断与统计手册*（`DSM`）中新增的“网络游戏障碍”与一些将网络游戏问题与其他心理问题联系起来的研究（例如注意力缺陷多动障碍\
  \ (`ADHD`)、睡眠剥夺、物质滥用）结合起来。\n\n本章还探讨了关于视频游戏是否可能导致暴力行为的理论和实证证据。这些理论包括社会学习理论、脚本理论、挫折-攻击假说、认知新关联模型和一般攻击模型。我们对这些每种理论都进行了批判性分析，并详细介绍了试图寻找攻击行为与玩攻击性视频游戏之间联系证据的研究。然而，我们得出结论认为，研究结果充其量是薄弱的。尽管如此，虽然暴力视频游戏对攻击行为的影响可能微乎其微甚至为，但对于玩某些内容视频游戏的人，仍有理由担心——即那些在物理世界被视为禁忌的内容（如强奸、酷刑或食人主义）。在本章中，我们考虑了调查这一问题的可用文献，这些文献表明有些人可能无法在心理上应对在游戏中接触此类材料。虽然本章的很大重点在玩视频游戏的负面影响上，但我们也注意到也有许多积极影响。首先，视频游戏是有趣的，深受许多人的喜爱。其次，视频游戏作为教育工具在各种环境中的普及程度日益提高。我们通过考虑利用游戏教授新技能和态度的某些方式来结束本章。\n\
  \n# 第 11 章：网络空间中的欺骗\n\n在前面的章节中，我们研究了人们如何在在线上更多地进行自我披露（变得过度诚实）。相比之下，在`[第 11 章]`中，我们研究了与物理领域相比，人们在网络空间是否更具欺骗性。在网上，用户可能会以新颖的方式欺骗更多的人。我们从定义欺骗开始本章，并考虑网络空间中明显的欺骗类型：基于身份的欺骗和基于消息的欺骗。\n\
  \n书中提供了关于“网络孟豪森症”（Munchausen by Internet）现象的案例研究，以提供基于身份欺骗的示例。（孟豪森综合是一种心理疾病，患者会谎称生病或自我诱发疾病症状。）因此，网络孟豪森症是一种心理疾病，一些人认为它应该在`DSM`中得到正式承认。互联网可能为我们提供了更多撒谎的机会，但我们真的在网上撒谎更多吗？本章研究了回答这一问题的实证证据，并阐明了一些有趣的结论。目前的研究表明，人们大多数情况下在电话中撒谎更多。本章介绍了解释这一发现的特征模型。我们介绍了支持该模型的研究，但也指出，在对自发谎言和计划性谎言进行区分时，该模型并不总是得到支持。我们还研究了试图在离和网络领域检测欺骗的研究。尽管仍需许多研究，但特别是计算机科学家们已开始检测那些隐藏在多重身份后的罪犯了。\n\
  \n# 第 12 章：犯罪欺骗与诈骗\n\n`[第 12 章]` 关注犯罪分子实施的欺骗，包括网络钓鱼、大众营销欺诈 (`MMF`) 和在线材料的非法下载等犯罪行为。我们从关注网络钓鱼开始本章，解释其工作原理以及被这种骗局欺骗的人数。本章还考虑了鱼叉钓鱼，它与钓鱼类似，但涉及针对性攻击而非随机黑客行为。\n\
  \n已使用真实的钓鱼邮件进行了研究，以调查用户为何会对这些邮件做出响应。例如，关注本能触发因素会增加响应的可能性。发现性格在预测谁更有可能响应钓鱼邮件方面也起着作用。本章考虑了为开发的帮助终端用户检测钓鱼邮件的培训计划，以及对这些计划的评估。正如读者所注意到的，开发更有效的培训计划仍有巨大需求。\n\
  \n本章还考虑了另一种类型的诈骗，即`MMF`，这是一种利用大众通信技术（如批量邮件、电子邮件、即时消息、社交网络网站 (`SNSs`)）来骗取他人钱财的欺诈行为。我们提供了关于此类诈骗受害者数量的示例和数据。我们详细说明了网络约浪漫诈骗涉及的各个阶段。与钓鱼攻击一样，性格被发现可以预测哪类的人更有可能响应`MMFs`；然而，这些画像可能会根据特定的欺骗类型而不同。这里还记录了受害者可能犯的认知和动机错误。我们指出，这类诈骗造成的伤害既是财务上的，也是心理上的。正如本章所解释的，`MMF`的预防和检测是困难的，且意识活动尚未得到适当评估。最后，我们研究了音乐和视频等在线材料的非法下载。我们评论了参与这些活动的个人往往不认为自己的行为是犯罪。文中讨论了防止这种犯罪行为的方法，包括鼓励个人在未来以不同的方式思考购买视频和音乐等材料。\n\
  \n\n\n\n\n在第 13 章中，我们继续关注网络犯罪主题，通过研究网络骚扰、仇恨犯罪和网络战。本章首先考虑了网络骚扰和网络跟踪（一种骚扰形式）。我们对这些术语进行了操作化定义，并讨论了不同国家间法律不一致所导致的一些问题。根据文献记载，互联网为针对个人和组织的网络跟踪提供了新的机会。此外，网络跟踪当然也可能伴随着现实世界中的跟踪和骚扰。本章概述了跟踪者侧写与网络跟踪者侧写之间的一些主要区别，同时注意到相关研究还相当匮乏。随后，我们转向更广泛地考虑了仇恨犯罪，并考察了它们如何在网络空间中实施。我们提供了仇恨犯罪的案例，以及在网络上存在以招募成员的极端主义组织示例。我们还考虑了网络战——另一个可用研究较匮乏的话题。我们在此指出，政府和社会尚未妥善地法化并批准一套用于规范国家在网络空间行为的准则。我们还强调了网络战区别于传统战争的一些特征。我们认为，当学者和政府重新思考网络战的规则时，需要考虑这些特征。检测和反击网络攻击的一种方法是通过监控和监测。虽然监控可能是出于善意，但它仍然侵犯了无辜平民的隐私。不出所料的是，公民对政府“监视”其在线活动表达了许多不满。我们通过考虑当前关于监控和监测的一些辩论来结束本章的讨论。\n\
  \n第 14 章继续关注网络犯罪，这次侧重于儿童色情和恋童癖。我们承认自互联网出现以来，儿童色情有所增加，并对这种增长给出了一些原因。本章的一个重要点是提供了英国和美国关于儿童色情立法的总结，并强调了这些合法化过程中的某些差异。进行这种比较是为了阐明执法部门在跨国处理此类犯罪时可能出现的问题；这种比较也指出了在法律适用于更近期现象（如性短信/sexting）时涉及的一些问题。我们概述了与某些类型恋童癖相关的心理障碍，以及互联网在这些障碍中扮演的角色。我们还解释了观看儿童色情的恋童癖者与收集儿童色情者之间的区别，并将收集者的类型分为以下几类：隐蔽收集者、孤立收集者、家庭收集者和商业收集者。本章总结了关于儿童色情犯罪者侧写的研究，尽管我们注意到许多研究认为并不存在典型的儿童色情犯罪者侧写。我们考虑了观看儿童色情者与实施亲手犯罪者之间之间的关系，并参考了“滑坡效应”假说。在本章的最后几节中，我们考察了专门开发或应用自其他领域的理论模型，以解释某人为何成为恋童癖者，考虑了求婚障碍理论、社会学习理论、Finkelhor\
  \ 的前条件模型、路径模型以及性犯罪综合理论。\n\n第 15 章的重点从网络犯罪转向在线支持和医疗保健。我们在本章开头通过一组数据展示了人们从在物理世界（通过医生和专家服务）获取健康相关信息转向在线搜索来源的转变。我们阐述了相关研究，即那些刚刚被诊断出某种疾病或正寻求帮助他人应对医疗问题的人，最可能在互联网上搜索健康相关信息。我们在此承认了从互联网获取健康信息的益处，但也指出了与此活动相关的一些问题。例如，一些患者在阅读有关其特定疾病的信息后感到更加焦虑。此外，我们注意到了与互联网搜索健康相关信息相关的一个特定问题，即“网络焦虑症”（cyberchondria）。网络焦虑症不仅被解释为一种寻求安慰的形式，也被视为健康焦虑和疑病症的表现。在本章中，我们还考虑了在线健康论坛的效用，提供了证据表明参与此类论坛具有积极和负面的影响。我们还关注了电子治疗（e-therapy），对其术语进行了操作化定义，并考察了关于这种治疗形式优劣的研究。本章重新讨论了抑制效应，背景是它可能给治疗中的某些个人引起的问题。尽管对电子治疗有效性的评估已有研究（其中一些我们在此进行了总结），但我们注意到还需要更多研究，且目前的发现结果不一。我们通过考虑沉浸式虚拟环境以及它们如何被治疗一系列心理问题的工具来结束本章。我们提供了可能在这些环境中治疗的各种心理问题的示例，例如恐惧症和创伤后应激障碍。\n\
  \n我们的最后一章是对全书的总结。在第 16 章中，我们提醒读者书中讨论过的一些主要问题，并指出了文献中的现有空白。我们提醒读者，重要的是理解：随着互联网的演变，我们在在线上的行为方式可能发生变化，尽管某些方面将保持不变。我们质疑互联网是否带来了一个具有新心理问题、机会和挑战的新世界，以及我们的心理有多少程度上仍然是保持的。\n\
  \n# 2. 网络空间中的“自我”\n\n自从互联网诞生以来，自我如何在网络空间中被构建和理解一直是关注的领域。我们在在线上的身份与在线下的身份不同吗？还是说互联网为我们提供了更深入地了解自己的新机会？我们在网络空间中创造的自我会跨越到其他空间吗？本章概述了研究网络空间中自我的一些关键心理理论和研究。本章承认学者们以各种方式对自我进行操作化。我们并不是在推崇某一种理论优于另一种，而是强调了该领域一些更有影响力的工作。\n\
  \n## 2.1 定义“自我”\n\n人们已有许多理论用来解释“自我”这一概念。哲学家和神学家最早尝试定义自我。心理学家经常交替使用“自我”和“身份”这两个词，尽管许多人认为这些是不同的概念（例如，`Owens,\
  \ 2006`）。虽然在本书中详述关于自我和身份的竞争性心理理论超出了我们的范围，但在研究网络空间中的自我之前，考虑这些原始理论是值得的。\n\n\n\n\n\n\
  早在 19 世纪 90 年，心理学家就开始尝试定义他们所指的“自我”。威廉·詹姆斯（William James, 1892/1963）作为心理学的先驱之一，将自我分为两个方面：作为主体的自我，或称“我”（I）；以及作为对象的自我，或称“我”（me）。。“镜像自我”是库利（Cooley,\
  \ 1902）提出的概念，用于描述人的自我成长于社会人际互动以及他人的感知。对于库利来说，没有社会就没有自我。\n\n### 2.1.1 特质理论与自我\n\n\
  特质心理学家认为，自我包含了进化的、遗传的且跨文化通的特定特质（MacDonald, 1998; McCrae, 2000）。这些理论者假设特质随时间推移是稳定的，个体具有不同的特质，且特质会影响行为。例如，卡特尔（Cattell,\
  \ 1946）提出了一个包含 16 个基本因素（温暖、理性、情绪稳定、支配、活跃、规则意识、社交胆量、敏感、警觉、抽象、私密、忧虑、开放、自力更生、完美主义和紧张）和\
  \ 5 个次要因素（外向、焦虑、坚毅、独立和自我控制）的双层人格结构。戈尔德堡（Goldberg, 1990）提出了五个人格因素：经验开放性、尽责性、外向性、宜性和神经质。\n\
  \n### 2.1.2 认同：“我是谁？”\n\n认同本质上是关于“我是谁”。埃里克森（Erikson, 1950, 1968）是最早明确考察认同概念的心理学家之一。根据埃里克森的观点，认同包含一组关于自身的持续态度和价值观。他认为，在实现认同的过程中必须形成某些特定的意识形态：一套个人价值观和目标。他认为，在形成认同的过程中，个体能够将其思维从“此时此地”的导向转向包含过去和未来的导向。埃里克森借鉴心理动力学理论，认为“认同形成”是青少年必须完成的发展任务。他认为，每个青少年都面临着认同形成的危机，而认同形成是青少年时期最有价值的成就。马西亚（Marcia,\
  \ 1980, 1991）扩展了埃里克森的工作，考虑了实现认同涉及的过程。根据马西亚的观点，青少年可以采取四条路径：认同扩散、认同早、延期和认同成就。与埃里克森不同，马西亚认为，“认同”的发展任务是不断重形成的，因为个体在大部分生活中会在成就和延期阶段之间波动。\n\
  \n并不是所有心理学家都认同埃里克森对认同的理解。与马西亚相似，许多人认为认同不是局限于青少年期的任务。对于麦亚姆斯（McAdams, 1993）来说，认同是个体为自己构建的“个人神话”或故事，将他们及其生活的不同部分整合为一个有目的且说服力的整体。\n\
  \n### 2.1.3 社会认同\n\n并不是所有心理学家都认同认同与个人的身份有关；一些人则认为认同更多是关于群体归属或“社会认同”。泰费尔和特纳（Tajfel\
  \ and Turner）开发了社会认同理论，以解释人们将自己归类为某个群体以获得更大的自我价值感的倾向（参见，例如 Tajfel, 1979; Tajfel\
  \ & Turner, 1979; Turner, 1975）。根据这一理论，认同由社会身份和个人身份共同组成。社会认同被定义为特定社会群体（如活动小组）或更广泛的社会类别（如国籍或性别）的成员。根据这些理论者的观点，群体赋予个体对世界的归属感。人们将世界分为“我们”（内群体）和“他们”（外群体）。当某种社会认同显现时，个体会将自己的态度和行为与其他群体成员进行比较。根据社会认同理论，内群体会歧视外群体以增强自身的自我价值。研究人员提出，社会认同关注会促个体对内群体成员的评价比外群体成员更积极（例如，Abrams\
  \ & Hogg, 1988）。\n\n去个性化效应社会认同模型（SIDE）的开发是为了扩展社会认同理论和自我分类理论（Lea & Spears, 1991;\
  \ Reicher, 1984; Spears & Lea, 1994）。该理论将自我建构概念化为灵活且特定情境的。正如 Lea、Spears 和 de Groot（2001）所解释的那样，“人在任何情况下的行为都可以处于一个连续体上，从完全个人（符合个人标准）到完全基于群体（符合显性的群体规范和标准）”（p.\
  \ 527）。根据 SIDE 理论，当人们处于“视觉匿名”状态时，他们的个人身份会变得不那么重要，而社会认同变得显性。这发生了从个人身份到群体身份的转变，从而促进了符合群体规范的行为。视觉匿名被认为会鼓励去个性化，因为它减少了用于社会比较、自我意识和自我呈现的人际基础。当这种情况发生时，个体看自己和呈现自己时不再是作为独特的个体，而更多是根据他们与感知的显性社会群体的原型属性的相似性（即刻板印象）。反之，他人的匿名性意味着他们也将根据其群体属性被感知，而不是作为独特的个体。“简而言之，SIDE\
  \ 提出，对自我和他人的去个性化感知会增加对群体成员的吸引力，而这一过程是由视觉匿名互动中缺乏个体化线索所刺激的”（Lea et al., 2001, p. 528）。\n\
  \n### 2.1.4 可能自我\n\n在尝试理解“自我”时，心理学家争论是否存在一个统一的、可测量的自我，还是存在多个方面。“可能自我”理论认为，人们不仅将自己理解为当下的人，还持有对未来自己的认知表征（Markus\
  \ & Nurius, 1986, 1987）。根据 Markus 和 Nurius（1986, 1987），自我概念包含：预期自我（你认为自己现实上可能变成的人）、希望自我（你希望变成的人）和恐惧自我（你不想要变成的自我）。\n\
  \n希金斯（Higgins, 1987, 1989）对这些自我方面做了更清晰的区分。他提出了自我的三个方面：实际自我（你或他人认为你实际拥有的属性表征）、理想自我（你或他人认为你理想上拥有的属性表征）以及应当自我（你或他人认为你应该拥有的属性表征）。希金斯开发了“自我差异理论”来解释个体受目标引导去接近两个不同的终点状态：他们的理想自我和应当自我。“理想自我调节系统”关注积极结果的缺失或存在，而“应当自我调节系统”关注负面结果的缺失或存在。希金斯还认为，在不同自我之间存在巨大差异的个体更容易出现心理健康问题（例如抑郁、焦虑或自尊低）。\n\
  \n### 2.1.5 作为行动者的自我\n\n\n\n\n\nGoffman (1959/1997) 在理解自我和身份方面采取了截然不同的方法。他对日常生活中的社会关系和互动发展出了一种戏剧化分析。Goffman\
  \ 将人视为演员。他将自我描述为既是表演者也是一个角色。根据 Goffman 的观点，“作为表演者的自我”不仅是社会产物，还具有基本的动机核心。相比之下，“作为角色的自我”代表了个体独特的人性。自我的这部分确实是社会产物——也就是说，它在社会生活中是向外“表演”出来的。而“作为角色的自我”则是一个人的内在自我。\n\
  \n在 Goffman 的理论中，个体需要向他人展示自己是受人欢迎的人格。他认为，个体在印象形成方面是具有策略性的。特别是，Goffman 能够区分面对面互动中“给出”（given）的表现（例如口头交流）与“流露”（given\
  \ off）的表现（例如非语言信号）。\n\nGoffman 主张个体往往会对情况呈现一种理想化的观点。他指出：“当个体在他人面前展示自己时，他的表演往往会吸收并体现社会官方认可的价值观”（1959/1997,\
  \ p. 101）。因此，他认为个体策略的一部分是将自己表现为他人眼中受人欢迎的人。根据 Goffman 的说法，“他人给出的印象往往被看作他们含蓄做出的主张和承诺，而主张和承诺往往具有道德属性”（p.\
  \ 21）。\n\n### 2.1.6 后现代自我\n\n后现代主义运动复杂且多样；然而，在很大程度上，后现代主义理论者都认同人类知识是主观的。知识是相对且易错的，不存在绝对真理。后现代学者认为真理是情境化的，观察者与被观察者是无法分离的。要理解一个人，必须理解其社会背景，这包括文化和语言。\n\
  \n因此，根据后现代主义理论者的观点，自我是碎片化且情境化的。他们认为不存在一个统一且可知的自我。例如，Gergen (1991)认为后现代文化已让“自我”这一范畴变得多余。他曾表示媒体“为我们提供了多种不连且不相关的自我语言”（p.\
  \ 6）。我们将在本章稍后详细讨论 Gergen。\n\n## 2.2 赛博空间中的自我\n\n为什么要在赛博空间考虑自我或身份？这个空间与其他媒介相比有何不同，以至于自我可能以不同的方式被表达或理解？许多学者甚至在互联网发展的早期就认为，赛博空间为表达自我提供了独特的机会。\n\
  \n如前，在 20 世纪 90 年代，互联网看起来与今天大不相同。它更多基于文本，速度更慢，栖息在该空间的人也更少。在某些方面，在互联网上隐藏并伪装成某人或某物比现在更容易——或者正如\
  \ Peter Steiner 在一张著名的《纽约客人》漫画中所示的那样。一些学者认为，互联网的匿名性为人们提供了“去肉体化”（disembodied）的机会——即创造并体验一种不再依赖或受限于其物理外貌的在线认同。\n\
  \n## 2.3 赛博空间中的去肉体自我\n\nSherry Turkle (1995) 是首批考虑赛博空间中去肉体化自我想法的理论家之一。她因将电脑命名为“第二个自我”而著名，并认为为人们提供了“重新发明”自己的机会。在早期作品中，Turkle\
  \ (1995) 研究了发生在虚拟环境中的互动，例如 `MUDs`（多用户地下城或多用户领域）和 `MOOs`（多对象面向对象）。借鉴心理动力学理论，她认为赛博空间为个体提供了玩身份的机会。Turkle\
  \ 认为，赛博空间可以是个体的解脱空间，可以是一个人们发现自我更深层真理的地方。她写道：“当玩家参与时，他们不仅是文本的作者，也是自己的作者，通过社会互动构建新的自我”（p.\
  \ 12）。\n\nTurkle 认为互联网为心理学家提供了一个激进的新视角，用来审视身份。她持有后现代自我观，认为人可以拥有多个自我，而不是一个统一、连续的自我：\n\
  \n> 我并不是暗示 MUD 或计算机公告板与表现出多重人格障碍（MPD）症状的人数剧增有因果关系，或者说 MUD 上的人患有 MPD，又或者玩 MUD 就像患有\
  \ MPD。我想说的是，我们文化中多样性的表现（包括在线人格的采纳）正在促人们对传统的、统一的身份观念进行重新审视。（Turkle, 1995, p. 260）\n\
  \n重要重要的是，Turkle 并不认为在线自我和线下自我之间存在完全的分裂。在虚拟空间中，她的部分参与者尝试了他们希望在日常生活中“成为”的身份。例如，她描述了一个名为\
  \ Gordon 的参与者的经历：\n\n> 在 MUD 上，Gordon 尝试了许多角色，但它们都有共同点。每个角色都具有 Gordon 试图在自己身上发展的特质。他将一个目前的角色描述为“我的一个化身。他像我，但更外向、更擅长华丽和浪漫，并对整件事带着一种调侃的态度”。（Turkle,\
  \ 1995, p. 190）\n\nTurkle 认为，在 Gordon 的情况下，在线实验是健康的，因为它为他提供了一种看待自己的新方式，从而提高日常生活的质量。尽管\
  \ Turkle 确实认为赛博空间中与“物理”身体的脱节创造了体验自我的新机会，但也发现在线和线下自我之间的完全分离并不总是健康的。她写道：\n\n> 有时这种经历可以促进自我认知和个人成长，有时则不然。MUD\
  \ 可以是人们绽放的地方，也可以是他们受困的地方，被困在一个比现实生活更简单的自自足的世界里，当一切失败时，你可以隐退你的角色，直接开始另一种现实生活。（Turkle,\
  \ 1995, p. 185）\n\n\n\n\nTurkle 的工作非常重要，因为它为心理学家提供了一种思考在线身份的新方式。此外，它挑战了早期学者的观点，即互联网是一种非人格化的媒介，人们其中只能以浅层、虚幻且敌对的方式建立联系（Kiesler,\
  \ Siegel & McGuire, 1984; Sproull & Kiesler, 1986; Stoll, 1995）。尽管有这些优点，她的工作也存在一些问题。\n\
  \nTurkle 早期对网络空间身份的认知基于她对 `MUDs` 和 `MOOs` 的研究。在这些空间中，个人被期望扮演角色角色。这些地方的设计具有趣味性和娱乐性。玩家被期望扮演自己以外的角色（Whitty,\
  \ 2007a; Whitty & Carr, 2003; Wynn & Katz, 1997），因此我们可能会预期人们在这些空间中展现不同的自我。她的理论在其他娱乐性较弱的空间中（如电子邮件或政治博客）是否适用？互联网并不是一个同质空间，因此我们不能开发一种通用的理论。\n\
  \n这种“去肉体化”的概念又是怎样的？人们能够完全将自己从肉体中分离出来，创造出一个乌托邦式的自我吗？其他人也认同 Turkle 的观点。例如，Clark（1997）提出，“在虚拟环境中，我们可以以去肉体化或网络空间的形式存在”（p.\
  \ 86）。Rollman、Krug 和 Parente（2000）写道，“通过消除时间、距离和身体，互联网的架构师创造了一个连接心灵与精神的不受阻媒介”（p.\
  \ 161）。女性主义学者，如 Haraway (1991) 和 Plant (1992) 认为，互联网为创造后现代自我提供了真实的机会。他们希望个人能够逃避日常生活中强加在人们身上的性别化期望。例如，Klein（1999）写道：\n\
  \n> 在后现代和网络思维中，“女性”和“男性”（或年轻与年老、白与黑）的类别已经失去了任何意义；……成为他她所想要的任何身份取决于个人——包括在特定时刻穿上他想要呈现的身体/身体——人们可能会想，这就像某种永恒的化装舞会。（p.\
  \ 202）\n\n然而，并非所有学者都同意个人可以在网络空间中完全去肉体化。例如，研究人员发现，复杂的性别信息可以通过文本传输，某些语言线索可以将男性的对话与女性区分来（Lea\
  \ & Spears, 1995）。Thomson 和 Murachver（2001）发现，女性更倾向于在线提及情感和个人信息。此外，这些研究人员发现，实验研究中的参与者能够识别他们在线交流对象的性别。Whitty（2003a）认为，“尽管我们在网络空间中没有物理的、实体的的身体，但我们确实拥有身体”（p.\
  \ 344）。她还指出，我们对在线遭遇有具体化的反应。Whitty 认为，对个人如何调情、参与性活动以及开发和维护在线关系的研究证明了身体的重要性（Whitty\
  \ 2003a; Whitty & Carr, 2006）。\n\nTurkle 本人（2011）改变了她对网络空间的原始观点。她不再相信网络空间承载着她在世纪\
  \ 90 年代所希望的乌托邦承诺。她现在认为互联网太容易获取，且占据了人们生活的大部分，使得个人感到无所从心和精疲力竭。她认为，虚拟世界提供了比现实更丰富、更好的生活。在她最近的作品中，她主张互联网可能导致一种新的孤独感。她写道：\n\
  \n> 当技术所提供的符合了我们的人性脆弱性时，它是具有诱惑力的。事实证明，我们确实非常脆弱。我们孤独但对亲密感到恐惧。数字连接和社交机器人可能提供伴侣的幻象，而没有友谊的要求。我们的网络生活允许我们相互躲避，尽管我们又相互系在一起。（Turkle,\
  \ 2011, p. 6）\n\n### 2.3.2 饱和自我（The saturated self）\n\nGergen（2000）采取了与 Turkle 目前类似的观点。他认为，在后现代时代，自我已被过多的身份所饱和。他认为，这归因于现代通信技术。数字技术为“现代自我”带来了问题。他认为自我已变得日益碎片化。\n\
  \n根据 Gergen（2000），有七种技术开启了这种社会饱和过程：铁路、邮政、汽车、电话、广播、电影和商业出版；“每种技术都让人们彼此的距离越来越近，让他们接触到范围越来越广的人群，并培养了一系列以前绝不可能发生的关系”（p.\
  \ 53）。他理论化地认为，在最近时期，社会饱和技术出现了第二阶段或高科技阶段，包括航空运输、电视和电子通信。因此，我们不仅建立起比以前更多的关系，而且这些关系展开的速度也比以往任何时候都快。此外，Gergen（2000）指出，这些关系既是真实的，也是想象的。他认为，想象关系的一个例子是从网上下载色情图像。他评论道，“当传统的个体被推入一个不断扩大的关系阵列中时，他或她开始越来越多地将自我视为一个策略性的操纵者。陷入往往相互矛盾或不连贯的活动中，人们会对自我感的被侵犯感到痛苦”（p.\
  \ 17）。\n\n## 2.4 赛博格自我（THE CYBORG SELF）\n\n正如本章提到的，Donna Haraway（1991）认为，在世界网的早期，网络空间为创造后现代自我提供了真实的机会。她认为，特别是女性可以逃脱性别角色。她将其理论命名为“赛博格女性主义”。她写道：\n\
  \n> 赛博格是一个控制有机体，机器与有机体的混合体，既是社会现实的产物，也是虚构的产物。社会现实是生活的社会关系，是我们最重要的政治构建，是虚构改变的世界。国际女性运动构建了“女性经验”，同时也发现了这一关键的集体客体。这种经验既是虚构也是最关键的政治事实。解放取决于对压迫的意识构建、想象性理解，以及可能。赛博格是一个虚构与生活经验的问题，它改变了\
  \ 20 世纪后期什么是女性经验的标准。（p. 149）\n\n## 2.5 戈夫曼：在线自我表演\n\n\n\n\n\n当学术界首次研究世界维网时，戈夫曼（Goffman）并不在世；然而，许多人已将他的理论应用于网络空间。应用戈夫曼理论的人对个体如何在网上表演自我，以及个人如何管理他们呈现给他人的自我印象感兴趣。例如，对学术网页的一项早期研究发现，大多数呈现方式都是“类论文文本”的，学者们并没有对自我进行新的展示（Miller\
  \ & Arnold, 2000）。然而，这些研究人员是在 20 世纪 90 年代研究互联网的——那个时代用户创建个人网页的带宽和资源是非常有限的。\n\n更近期的研究采取了完全不同的观点。例如，Tufekci\
  \ (2008) 认为，社交网络平台（SNSs）上发生的许多活动可以通过应用戈夫曼的自我理论来理解。她写道：“用户通过调整个人资料、链接朋友、展示自己的喜好、加入小组以及其他方式调整其个人资料的情境化外观来参与印象管理”（第\
  \ 547 页）。其他人也表达了类似的观点，指出：“Facebook 是一个多受众的身份生产地。用户对账户隐私设置的控制使他们能够将 Facebook 页面划分为许多‘后台’和‘前台’区域（Goffman,\
  \ 1959/1997），从而为不同的受众展示不同的身份表演”（Zhao, Grasmuck & Martin, 2008, 第 1832 页）。戈夫曼的作品在研究在线约会网站的人中非常流行。我们将在第四章中进一步讨论他的著作。\n\
  \n## 2.6 网络空间中的可能自我\n\n许多研究考虑了 Higgins 的“可能自我”理论可能如何应用于在线自我呈现。Manago、Graham、Greenfield\
  \ 和 Salimkhan (2008) 在一项焦点小组研究中发现，不同的参与者选择在他们的 Myspace 资料上展示自己的不同部分。他们声称：“资料可以代表真实的自我、多方面自我中的选定方面、理想化的自我，或对可能自我的实验”（第\
  \ 51 页）。\n\nBessière、Seay 和 Kiesler (2007) 使用 Higgins 的理论进行了一项最有趣的研究之一。这些研究人员认为，MMORPG（大型在线角色扮演游戏）是个体创建反映其理想自我角色的理想环境。他们强调，正是这种空间的匿名性促进了这些自我呈现。他们首先预测，玩家会认为自己的角色比他们认为的自己更接近于他们的理想自我。其次，他们假设，心理健康测量得分较低的个体与心理健康测量得分较高的人相比，更有可能创建接近其理想自我而非真实自我的角色。这与上述的\
  \ Higgins 自我差异理论一致。Bessière 等人使用了大五人格量表，该量表对个人的以下特质进行评估：尽责、外向、神经质、宜人和开放性。通过一种独特的方法，他们要求个体对自己的\
  \ `World of Warcraft` 角色进行评分，衡量其特质与其真实及理想自我的特质有多相似。Bessière 等人发现他们的假设得到了一些支持。主要，参与者对他们在\
  \ `World of Warcraft` 中的角色评价为比他们自己更尽责、更外向，且神经质更低。这对于那些抑郁症或自尊心较低的人来说更有可能。在心理健康测量中得分较高的人则不太可能认为他们的角色比他们自己更好。\n\
  \n### 2.6.1 真实的我\n\n作为“可能自我理论”的变体，John Bargh 和 Katelyn McKenna 声称他们借鉴了 Roger (1961/2004)\
  \ 的自我理论来解释人们如何在网上展示自己（见 Bargh, McKenna & Fitzsimons, 2002; McKenna, Green & Gleason,\
  \ 2002; McKenna, Green & Smith, 2001）。他们使用术语 `Real Me`（真实的）是指个体拥有并想要拥有但通常无法向大多数人表达的特质或特征。这是一个指的是一个人内心核心（或他们‘真实身份’）方面的构念。Bargh\
  \ 和 McKenna 认为，由于网络空间是匿名的，在那个环境中，更容易向未知个体表达自我，因为在面对面互动中明显的传统的门控功能缺失了。\n\nMcKenna\
  \ 等人 (2002) 开发了 `Real Me` 量表，由四个问题组成。前两个问题需要是/否的回答。首先，询问参与者他们向互联网上认识的人透露的自我信息是否比向现实生活中认识的人（`非网络朋友`）多。其次，询问他们是否有些网络朋友了解他们的某些方面，而他们认为无法在‘现实生活中’与非网络朋友分享。接下来的两个问题要求参与者在七分制上评价，如果他们的家人和朋友阅读参与者的电子邮件和新闻组帖子，他们会有多惊讶。\n\
  \n相比之下，Bargh 等人 (2002) 选择通过其他手段来衡量 `Real Me`。他们通过要求参与者列出最多 10 个他们拥有并想要表达但通常觉得无法表达的特质或其他特征来衡量\
  \ `Real Me`。与 McKenna 等人 (2002) 的研究一样，假设是参与者了解自己的 `Real Me`。\n\nBargh 和 McKenna\
  \ 认为，能够表达自己的 `Real Me` 对关系发展产生重要影响。我们将在第三章中详细考虑这些作者关于 `Real Me` 和网络空间关系进展的工作。\n\n\
  ## 2.7 网络空间中的社会身份\n\n在本章早期解释的社会身份理论扩展模型（被称为 SIDE 理论）已被应用于在线身份和行为。SIDE 理论的一个前提是社会身份在视觉匿名环境中会变得显著，因此它是应用于网络空间互动的一个显而易见的理论。研究人员认为他们已经发现了匿名计算机介通信（CMC）环境中群体影响和社会规范作用的证据。\n\
  \n在一项关于 CMC 的早期实验中，Spears、Lea 和 Lee (1990) 操纵了群体身份与个人身份的显著性。在群体身份显著的情况下，研究人员告诉参与者该研究是关于心理学学生作为一个体的沟通风格。在个人身份显著的情况下，他们告诉参与者他们正在研究沟通风格的个体差异。小组通过通过房间的终端进行通信（使其视觉匿名），另一半在同一房间内通信，他们可以看到彼此。在整个研究过程中，研究人员提供了有关讨论主题的参与者规范反馈。正如预期的那样，他们发现当群体身份显著时，群体向群体规范的方向极化，而且这种倾向在参与者视觉匿名的情况下更强。当然，这里提出的一个批评是，由于这是一项实验室研究，我们不知道在自然发生的群体中是否会获得相同的发现。\n\
  \n\n\n\n在另一个基于实验室的研究中，Cress (2005) 再次从 SIDE 理论出发，考察了网络社会懈现象。参与者完成了一项社会价值取向测试，以确定他们更倾向于个人主义还是亲社会性。随后，他们被要求参加一个同步工作小组，该小组由六名成员组成，每个人都在不同的房间里工作。这项任务是一个社交困境：团队成员的贡献越多，个人获得的收益就越多；然而，个人对群体的贡献越多，他们获得的收益就越少。在实验中，一半的参与者使用显示成员照片的共享数据库，另一半人则看不到成员肖像。正如预期的那样，研究发现，亲社会量表得分高的参与者感知到的群体规范比个人主义类型的人格更为显著。其次，研究发现匿名性调节了社会价值取向对合作行为的影响。当看到成员肖像时，那些更具亲社会性的人社会懈有所增加，这与\
  \ SIDE 理论的预测相一致。\n\n## 2.8 视觉上匿名吗？\n\n当然，如今互联网上人们可以实现视觉匿名的地方比互联网早期要少得多，因为用户喜欢展示自己的照片并查看他人的照片（例如，在社交网络、在线交友网站、博客、聊天室等）。这并不意味着个体在呈现自己的方式上不再具有实验性或策略性（正如我们在第四章中看到的在线看到的），但这意味着我们必须开发新理论来理解不断演变的互联网。当我们在线上展示自己的肉身时，有趣的是我们如何呈现这些自我的——例如，我们选择展示哪些照片，以及查看我们在线个人资料的用户对我们身份的何解读。我们可能会像特克尔（Turkle）在其早期作品中所做的那样询问：通过我们展示的图像，我们是否比在线下更容易在网上操纵和玩弄自我呈现。随着互联网的变化和发展，需要更严谨的研究来测试和开发关于自我的新理论。在未来，与视觉匿名的互联网相比，在线表达自我的机会可能会要少得多。\n\
  \n## 2.9 结论\n\n本章总结了关于自我和身份的一些关键理论，并考察了这些理论如何被应用于解释在线自我呈现。某些理论解释了多重自我，以及互联网如何为自我呈现的实验提供了更多可能性。一些学者认为人们可以在自我呈现上具有策略性，这一点我们在接下来的章节中会遇到。然而，我们需要在研究当时互联网是如何构建的背景下来阅读这些理论。在早期，人们比现在更容易在视觉上匿名。鉴于早期和当前数字技术之间的差异，我们可能还会预期取决于当时的空间产生不同的呈现方式。当你阅读这些文献时，你会注意到物理世界通常被称为“真实”世界，这暗示在在线环境中的存在是“不真实的”。作为读者，你可能想要质疑你在在线空间中的行为是“虚幻的”，还是它仅仅是你自我的另一种表达。此外，随着人们将实时社交网络的使用与物理领域发生的活动相结合，在线和线下空间正变得越来越无缝（例如，分享你正在做的照片和视频，并让朋友同时进行评论）。未来关于自我和身份的理论可能需要重新思考将面对面和赛博空间视为二元对立的理解。\n\
  \n在第三章中，我们重新回顾了这里提出的关于视觉匿名互联网的一些概念，以及它在在线建立和发展关系时为个体提供的机会。与本章一样，你将了解到，对于数字空间互动中的健康与不健康方面，学者们持有许多不同的观点。\n\
  \n### 讨论问题\n\n1. 你在不同的在线空间以不同的方式呈现自己？你在哪些方面是不同的，又在哪些方面是一致的？你认为这是为什么？\n\n2. 你同意特克尔（Turkle）早期的观点认为互联网是一个乌托邦式的游乐场吗？\n\
  \n3. 你同意格根（Gergen）“自我正受到围”的观点吗？\n\n4. 你能如何应用戈夫曼（Goffman）的理论来解释赛博空间中的自我呈现？\n\n5.\
  \ 是否存在呈现“理想自我”的理想空间？\n\n### 建议阅读\n\n1. Bargh, J. A., McKenna, K. Y. A. & Fitzsimons,\
  \ G. M. (2002). 你看到真实的我吗？互联网上“真实自我”的激活与表达。*Journal of Social Issues*, *58*, 33–48.\n\
  \n2. Bessière, K., Seay, F., & Kiesler, S. (2007). 理想精灵：*魔兽世界*中的身份探索。*CyberPsychology\
  \ & Behavior*, *10*(4), 530–535.\n\n3. Gergen, K. J. (1991). 《饱和的自我》。纽约，纽约州: Basic\
  \ Books.\n\n4. Goffman, E. (1959/1997). 在日常生活中的自我呈现。在 C. Lemert & A. Branaman (编),\
  \ *戈夫曼读者读* (pp. 21–26)。Cambridge, MA: Blackwell.\n\n5. Haraway, D. (1991). 《类人、赛博格与女性：自然的重塑》。伦敦，英国:\
  \ Free Association.\n\n6. Lea, M., & Spears, R. de Groot, D. (2001). 了解我，了解你：匿名对社会身份过程的影响。*Personality\
  \ and Social Psychology Bulletin*, *27*(5), 526–537.\n\n7. Turkle, S. (1995). 《屏幕生活：数字时代的身份》。伦敦，英国:\
  \ Weidenfeld & Nicolson.\n\n8. Turkle, S. (2011). 《孤独聚集：为什么我们对技术的期待更多，对彼此的却更少》。纽约，纽约州:\
  \ Basic Books.\n\n# 3\n\n在线关系\n\n尽管互联网最初并非设计为社交空间，但用户很快就开始以社交的方式利用它。我们在网络上进行的大部分活动都是社交性的，研究证明在线可以形成并维持心理健康的关系。本章简要概述了互联网出现之前解释关系形成的一些主要理论。在解释在线形成的关系的启动、发展和维护时，考虑这些理论是重要的；然而，为了解释观察到的在线与传统空间在互动方式上的差异，开发新理论也是必要的。\n\
  \n## 3.1 传统关系：线下领域\n\n当你思考一个“传统的”线下浪漫关系如何从启动发展到承诺阶段时，你会想到什么？你想象的这些轨迹可能与你父母关系的发展方式完全不同，而这种方式又与不同文化或远古时期浪漫关系的发展不同。在阅读关于关系形成的文献时，留意这一点是非常重要的。\n\
  \n\n\n\n浪漫吸引力是使伴侣结合的一个相当较新的动力（参见 Whitty & Carr, 2006）。在 19 世纪初的欧洲，婚姻通常是包的（Murstein,\
  \ 1974; Rice, 1996），而在当代，某些文化仍然保留着包办婚姻。19 世纪末和 20 世纪初的求爱非常正式，家庭对孩子将与谁结婚仍有发言权（Cate\
  \ & Lloyd, 1992）。直到 20 世纪中叶，在西方化文化中，求爱变得更加非正式，同伴群体确立了约会的规则（Mongeau, Hale, Johnson\
  \ & Hillis, 1993）。20 世纪 60 年代西方文化中的性革命改变了男女的求会方式，带来了你可能在思考父母如何相遇时所想象的那种求会形式。这一时期为个人带来了更多选择；婚姻不再是伴侣表达双方承诺的必要条件，同居也逐渐成为了一种流行的选择。\n\
  \n需要注意的是，许多关于浪漫关系的理论都是基于 20 世纪 60 年代以后特定的西方规范。以下我们总结了一些旨在解释浪漫关系如何发展以及为何发展的理论。\n\n\
  ### 3.1.1 社会进化论理论\n\n简而言之，社会进化理论解释说，通过自然选择，人类继承了某些特质和情感反应。人类已经进化到看重异性的某些特质。在形成浪漫关系时，个体拥有的某些特征越多，就越可能吸引异性（Buss,\
  \ 1987）。根据这一理论，女性更容易被那些能为后代提供物质生活的男性所吸引。相比之下，男性被具有生育能力因此具有生殖价值的女性所吸引。关于吸引力的许多研究都为这一理论提供了支持，发现男性会寻找外貌吸引人的女性，而女性对社会经济地位较高的男性表现出更的浪漫兴趣（例如，参见\
  \ Buss & Barnes, 1986; Greenless & McGrew, 1994; Kenrick, Sadalla, Groth & Trost,\
  \ 1990; Townsend & Wasserman, 1997）。\n\n### 3.1.2 社会渗透理论\n\n与之相反，社会渗透理论考虑了浪漫关系的发展（也可以应用于友谊）。该理论由\
  \ Altman 和 Taylor (1973) 提出，并被其他人修改过（例如, Morton, Alexander, & Altman, 1976）。根据这一理论，关系随着时间的推移从较不亲密的参与转向更亲密的参与。这一过程可以用洋葱类比来描述，认为随着关系的进展，人们会不断自我披露关于自己的更深层次的方面。该理论讨论了关系形成的深度和广度。深度代表从表面开始移动到人格核心特质的维度。广度是指关于广泛话题的信息，如一个人的家庭、职业等。根据社会渗透理论，在关系发展的早期，人们行事谨慎，讨论较不亲密的话题，并检查对话中是否存在互惠迹象。逐渐地，人们会感到更安全，并传达自己的其他方面。\n\
  \n### 3.1.3 交换理论与公平理论\n\n交换理论和公平理论研究了个人在选择浪漫伴侣时所做出的选择类型。交换理论从奖励和成本的角度来解释关系。Thibaut\
  \ 和 Kelley (1959) 开发了这些理论中的第一个，认为，无论我们对某人的感觉如何（无论我们的动机看起来多么纯洁崇高），个体只有在关系在总奖励和成本方面令人满意的范围内，才会与他人建立关系。根据交换理论，个体试图实现利润最大化；即，奖励应该超过成本。这些理论学家还认为，为了预测一个个体对给定关系可能有多满意，有必要考虑他们的预期。例如，个体根据过去的关系以及对与自己相似的人的人关系结果的观察来对关系产生预期。因此，为了让他们对某段关系感到满意，结果必须匹配或超过这些比较水平。与交换理论类似，公平理论建议人际关系中的个体试图使其产出最大化。该理论的倡导者认为，当个体发现自己处于不公平的关系中时，他们会感到痛苦，且痛苦程度与感知到的不公平程度成正比增加。当个体经历这种痛苦时，他们会尝试恢复公平。\n\
  \n与 Thibaut 和 Kelley (1959) 的理论不同（后者的理论认为个体用于产生比较水平的信息来自他们自己的过去经验和/或对相似者的观察），公平理论关注伴侣双方的相对贡献和产出。因此，决定关系中什么是公平的相关信息来自关系内部。贡献较多的人应该期待获得更多回报；投入较少的人应该对关系期待较少。也有大量的研究支持这些理论。例如，Harrison\
  \ 和 Saeed (1977) 对 800 份异性恋个人广告进行了内容分析。他们发现个人提供的自身条件与他们对潜在伴侣的期望之间存在互补但具有性别差异的差异。换句话说，他们发现个体会寻找与自己吸引力相当的人，而且如果他们寻找比自己更有吸引力的人，他们通常会提供其他品质（例如，社会地位和财富）来平衡这种差异。\n\
  \n## 3.2 将旧理论应用于网络关系\n\n新的理论已被开发出来，以解释人们如何在网络空间中启动、发展和维持关系，以及这些关系如何进展到线下空间。然而，在概述这些新理论之前，本章考虑了上述某些理论如何应用于解释网络关系。\n\
  \n### 3.2.1 社会进化论理论\n\n社会进化论预测的对异性吸引的某些性别差异在网上是显而易见的。例如，Dawson 和 McIntosh (2006)\
  \ 发现，在在线个人广告中，男性倾向于写强调财富的广告，而女性则可能强调物理特征。关于在线约会（我们在 `c04.xhtml` 中更详细地讨论了这一主题），研究人员发现，女性更有可能在个人资料上投入更大的精力获得一张吸引自己的照片（Whitty,\
  \ 2008a; Whitty & Carr, 2006）。此外，女性比男性更可能在外貌上撒谎或使用过时的照片，而男性更有可能夸大或谎充自己的社会地位。Whitty\
  \ 和 Buchanan (2010) 在对在线约会网名的研究中发现，男性比女性更容易被表示物理吸引力的网名吸引，而女性比男性更容易被表示智力或中性的网名吸引。同样，男性比女性更有动力联系表示物理吸引力的网名，而女性比男性更有动力联系表示智力特征的网名。\n\
  \n### 3.2.2 社会渗透理论\n\n\n\n\n研究人员发现，当个体在网上时，他们可能比面对面时更快地在深度和广度上对自己的信息进行自我披露（例如，Joinson,\
  \ 2001）。鉴于在线自我披露与传统环境相比可能有所不同，研究人员已经开发了新的理论来解释这种关系类型（参见本章后文的`抑制效应` (Disinhibition\
  \ Effect) 和`超个人理论` (Hyperpersonal Theory) 章节）。然而，正如本章所示，重要的一点是，不能用一种理论来解释所有的在线交流；例如，正如第\
  \ 4 章中所示，社会渗透理论无法解释从在线约会网站建立的关系（Whitty, 2008a）。\n\n### 3.2.3 交换理论与公平理论\n\n研究人员将在线约会者在他人身上寻找的特征描述为详尽的购物清单（Whitty,\
  \ 2008a; Whitty & Carr, 2006）。这些研究人员认为，在在线约会网站上，人们将自己和他人视为商品。`Exchange theory`（交换理论）和`equity\
  \ theory`（公平理论）可以用于此，解释在他人和自己之间寻求吸引特质（如外貌、爱好、性格）的平衡的过程。我们将在第 4 章中进一步探讨这些概念。\n\n\
  ## 3.3 解释在线关系的新理论\n\n尽管上述理论具有实用性，但学者们发现，人们在线上互动和建立关系的方式有时与他们在更传统的空间中的互动和关系方式非常不同。考虑到这种关系建立上的差异，研究人员制定了新理论来解释在某些在线空间发生的某些独特互动。本章现在将考虑这些理论。\n\
  \n### 3.3.1 抑制效应\n\n研究人员发现，在某些在线空间中，个体更有可能在网络空间中敞开自己的某些方面，并表现出在传统的面对面环境中可能不会表现的行为（Joinson,\
  \ 2001）。这被称为“抑制效应”（disinhibition effect）（Suler, 2004）。Suler (2004) 将其描述为一把双刃剑，因为一些人会揭露秘密的情绪、恐惧和愿望，或者表现出异常的善良和慷慨，Suler\
  \ 将其称为“良性抑制”（benign disinhibition）。Barak, Boniel-Nissim 和 Suler (2008) 发现，由于在线抑制效应，个体在在线支持小组中能够更加开放。他们认为，这促进了个人赋权、控制、自信和心情的改善。相反，有时人们比平时面对面时更粗鲁、更具批判性、愤怒或更有威胁性。Suler\
  \ (2004) 将此称为“毒性抑制”（toxic disinhibition）。网络骚扰就是这种毒性抑制的例子（我们将在第 13 章中详细讨论这一主题）。\n\
  \n### 3.3.2 社会存在理论\n\n社会存在理论是最早应用于环境的理论之一。注意的是，该理论最初是在个体仅通过文本交流进行在线通信时提出的。该理论假设，社会存在是个体感觉到他人参与了交流交换的感觉。由于面对面交流相比，在线交流涉及的非语言线索（如面部表情、姿态、服装等）和听觉线索较少，因此其社会存在极低（Hiltz,\
  \ Johnson & Turoff, 1986）。根据该理论，随着社会存在的下降，交流会变得更加缺乏人情。相反，当有更多关于一个人外貌的信息时，这会导致更大的积极评价。因此，鉴于在线上的社会存在少于其他媒体，在线交流被认为更不人化、更不亲密。该理论在在线关系方面的问题在于，真实且亲密的关系会在网上形成。由于证据反驳了该理论的预测，随后出现了其他理论来解释真实关系是如何通过在线环境中的文本形成的。\n\
  \n### 3.3.3 社会信息处理理论\n\nWalther (1995) 批评了早期理论，例如社会存在理论。虽然他仍然赞同社交线索减少的观点，但他认为许多此类研究没有充分考虑到时间。考虑到以前研究的缺陷，Walther\
  \ 及其同事寻求对在线环境中发生的交换进行更深入的理解。在此，Walther 提出了“社会信息处理理论”。该理论认为，面对面交流与`CMC`之间的主要区别在于关系在每个空间发展的速度，而不是建立关系的能力。Walther\
  \ 认为，尽管 `CMC` 最初可能更具攻击性，但随着时间推移，这种倾向会消失。Walther (1992, 1995, 1996) 在该理论中强调，在线关系与面对面关系之间的许多差异随着时间的推移而减少，尽管带宽限制限制了信息交换的速度，但这个问题可以通过允许更长和或更频繁的交流来缓解。\n\
  \n### 3.3.4 超个人通信\n\nWalther 扩展了他的社会信息处理理论，开发了一个超个人通信框架。该理论假设，“CMC 用户有时对伴侣产生的亲密感、情感和人际评估超过了在平行的面对面活动或其他性\
  \ CMC 语境下发生的体验”（Walther, Slovacek & Tidwell, 2001, p. 109）。Walther (1996) 认为，人们利用互联网的技术来辅助印象的形成。根据该理论，接收者因为收到的信息而理想化伴侣，他们认为这些信息展示了自己与在线伴侣之间的相似性，以及后者极具吸引力的性格。相反，发送者利用技术选择性地展示他们被认为具有社会吸引力的自我方面。`CMC`\
  \ 的特征允许个体在自我呈现上具有策略性，而 CMC 环境创造了一个过滤掉外部世界的空间，认知资源转而用于关注在线交流。正如 Walther (2007) 所解释的，“CMC\
  \ 渠道方便了编辑、谨慎考虑和便利，并且能够忽略环境干扰并重新分配认知资源，以进一步增强自己的信息构成”（p. 2539）。Walther 认为，一旦这种交流循环开始，“CMC\
  \ 可能会产生动态反馈回路，使得夸大的预期通过带有偏见的互动过程得到确认和回应”（p. 2539）。\n\n研究人员在双人组和小组中都发现了对这一理论的支持。例如，在\
  \ Hancock 和 Dunham (2001) 的一项研究中，参与者被分配到基于文本的对话条件或面对面的双人互动。在这项研究中，80 名参与者对伴侣的性格画像按广度和进行了评分。他们发现，正如超个人理论预测的那样，在\
  \ CMC 环境形成的印象比面对面形成的印象不详细，但更强烈。在最近的研究中，Jiang, Bazarova 和 Hancock (2013) 发现，伴侣通过基于文本的\
  \ CMC 进行的自我披露比面对面的披露更亲密。随后的 CMC 交流继续保持更高的亲密度。\n\n### 3.3.5 真实的我\n\n\n\n\n\n如第 2\
  \ 章所示，21 世纪 0 年代初，研究人员（例如 Bargh, McKenna & Fitzsimons, 2002；McKenna & Bargh, 2000；McKenna,\
  \ Green & Gleason, 2002）提出互联网是罗杰斯所谓的“真实自我”的理想空间。他们将该术语替换为“真实的我”（Real Me）的概念，并认为这个词等同于罗杰斯（1951/2003,\
  \ 1961/2004）的“真实自我”。他们用“真实的我”一词是指个体拥有并想要表达但通常无法向大多数人表达的特质或特征。这是一个指的是一个人内心核心层面（或他们“真实的本质”）的构念。研究人员认为，这是因为网络空间是匿名的，而且在缺乏面对面互动中明显的传统门控特征的情况下，向陌生人表达自我变得更容易。\n\
  \n在第 2 章中，我们强调了 McKen 等人（2002）是如何开发“真实的我”量表的。提醒一下，“真实的我”量表由四个问题组成。前两个问题需要回答“是/否”。首先，询问参与者，他们在互联网上对他们认识的人所展示的关于自己的信息是否比对在现实生活中认识的人（“非网络朋友”）更多。其次，询问他们是否有些他们的网络朋友了解关于他们的某些方面，而他们认为自己在“现实生活中”无法与非网络朋友分享的。接下来的两个问题要求参与者在七分量表上评价，如果他们的家人和朋友阅读参与者的电子邮件和新闻组帖子，他们会感到多大惊讶。这项研究为他们的理论提供了明确的证据。\n\
  \n这些研究人员采用了一种额外的方法来衡量“真实的我”。Bargh 等人（2002）要求参与者列出最多 10 个他们认为自己拥有并在社交场合表达给他人的特质（实际自我），以及最多\
  \ 10 个他们拥有想要表达但通常觉得无法表达的特质（真实自我）。他们还创建了一个反应时自我描述任务，词语每隔几秒钟出现在电脑屏幕上，参与者被要求尽可能地按下表示“是”和“否”的键，以确定该词是否描述了他们。在那些反应时任务的实验中，研究人员发现在网络互动期间，“真实自我”概念在记忆中更容易被提取，而在面对面互动期间，“实际自我”更容易被提取。在他们的最终研究中，他们再次发现与面对面互动相比，参与者可能通过互联网向伴侣表达他们的真实自我特质。\n\
  \n关于在线关系，这些研究人员认为，某些人能够在在线建立更亲密的关系，因为许多人觉得在这个空间里敞开心扉感到更舒服——而自我披露会让人们彼此彼此距离。他们认为，对于那些内向和有社交焦虑的人来说，情况尤为如此。\n\
  \n## 3.4 在线关系的简史\n\n几乎无法想象，在不到 15 年前，大多数在线浪漫活动仅涉及纯粹的文本交流。需要找到新方法来克服在线互动中非语言线索的缺乏（例如以表情符号的形式）。了解千禧交替时期互联网的面貌非常重要。在本节中，我们概述了一些新兴的在线空间，在线关系就在这些空间开始启动并形成。\n\
  \n### 3.4.1 公告板系统：逐行关系\n\n公告板系统（BBS）是互联网早期一个特别受欢迎的空间，许多在本质上具有性色彩。它们是世界维网的前身；然而，它们与目前互联网上可用的空间看起来非常不同。它们通常是单线系统，这意味着一次只能有一个用户在线。个体只能使用文本进行交流。即使在早期，它们也是社交空间，人们在那里相遇、讨论、发表文章、下载软件，并可能还玩了游戏。系统管理员有时会审查这些网站上的信息，但在很大程度上它们是相当自由的。用户可以留公开信息也可以留私信信息。一些公告板系统专门设计用于让人们与与其有共同性兴趣的人相遇，并让他们在在线或下下实现他们的性欲望（正如我们将在[第\
  \ 5 章](#c05.xhtml）中看到的）。\n\n### 3.4.2 MUDs 和 MOOs：形成真实关系的场所\n\nMUDs 和 MOOs 是基于文本的在线虚拟系统，多个用户可以同时连接。这些是可以在其中进行互动角色扮演游戏（非常类似于桌面游戏《龙与地下城》）的空间。MUDs\
  \ 和 MOOs 是同步通信的形式。参与者扮演一个选定的角色，并在网上与其他角色进行交流。\n\n在早期，研究人员对于真实的友谊和浪漫关系是否真的能在这些空间中形成存在分歧。实证工作表明它们确实，而且有时成功地从这些空间转移到线下。例如，Parks\
  \ 和 Roberts（1998）研究了在 MOOs 中发展的关系，发现他们调查的大多数参与者（93.6%）在 MOOs 期间至少建立了一段持续的个人关系。识别出了各种关系，包括亲密友谊（40.6%）、友谊（26.3%）和浪漫关系（26.3%）。Parks\
  \ 和 Roberts（1998）得出结论，“在 MOOs 上形成个人关系可以视为常态而非例外”（第 529 页）。有趣的是，大多数在线关系是异性成员之间的。这一发现跨年龄和关系状态是一致的。正如\
  \ Parks 和 Roberts 指出的，这一结果与“现实生活”大不同，在现实生活中同性友谊比异性友谊常见得多。\n\nUtz（2000）研究了发生在 MUD\
  \ 中的互动。在她的研究中，她发现 76.7%的受访者报告在网上形成了发展到线下关系。其中，24.5%被报告为浪漫关系。此外，Utz 发现随着时间的推移，人们确实学会了如何“将非语言化”。她调查的\
  \ MUD 用户通常使用表情符号来表示感受和情感。\n\n### 3.4.3 聊天室：少即是多\n\n聊天室涉及同步通信或者根据 Whitty、Buchanan\
  \ 和 Meredith（2012）的说法是“近同步”通信。大多数聊天室都有特定的主题，尽管这不是必须的。当用户进入聊天室时，他们可以输入一条所有其他个体都可见的消息。数百个个人可以同时在同一个虚拟房间里向小组发送消息。聊天室与即时消息相似，只不过人数超过两人。有时这些房间会有管理员。聊天室在互联网早期非常流行，且只有文本。过去，研究人员发现浪漫关系和友谊是在聊天室中启动和发展的。例如，Whitty\
  \ 和 Gavin（2001）通过访谈 60 名网络用户了解到，传统关系中重要的理想（如信任、诚实和承诺）在这些空间形成的关系中同样重要。Whitty 和 Gavin\
  \ 并没有发现在线关系更不真实或更不尽意的证据，相反，他们发现研究中的一些参与者报告说，他们的关系似乎仅在互联网上效果更好。\n\n\n\n\nWhitty 和\
  \ Gavin 还发现，聊天室用户报告感到不那么局促，对被社交评价的意识也较低，这反过来让他们能够在保持距离和个人空间的同时，透露自己的私密细节。讽刺的是，许多男性参与者认为，通过隐藏身份，他们可以在情感上变得更加诚实和坦率。\n\
  \n### 3.4.4 讨论组和 Usenet 新闻组：“真实的自我”的场所\n\n讨论组或 Usenet 新闻组是关于特定主题的持续公共讨论。这是一种异步通信的形式。有时这些小组会有管理员。它们在互联网早期非常流行。这些小组在今天仍然存在，而且通常仍然仅以文本形式存在，尽管也可以发布图片和视频。关于人际关系，Parks\
  \ 和 Floyd (1996) 在对新闻组的研究中发现，其样本中几乎有三分之二（60.7%）承认与在新闻组中初次相识的人建立了个人关系。其中，7.9% 的人表示这种关系是恋爱关系。他们发现，女性比男性更容易在在线上建立人际关系。值得注意的是，参与新闻组越多的人越可能建立人际关系。Parks\
  \ 和 Floyd 还发现，许多始于在线的关系也转移到了其他渠道的互动，对于某些人来说，甚至是面对面的。\n\n正如本章前面解释的那样，McKenna 等人 (2002)\
  \ 对他们所谓的“真实的自我”（Real Me）感兴趣，将其定义为个人拥有并想要表达但通常无法向他人展示的特征或品质。在这项研究中，作者想了解那些在在线上比线下更能披露自己“真实自我”的人，是否更有能力在在线上建立亲密关系并成功地将这些关系带到线下。作者随机选择了\
  \ 20 个 Usenet 新闻组纳入研究。在为期三周的时间里，问卷被发送给每个新闻组中每隔五名的发布者（不包括垃圾邮件）。第一项研究发现，当人们在线上传递他们的“真实自我”时，他们建立了强大的网络关系，并将这些关系带到了线下。在这项初步研究两年后，568\
  \ 名参与者中的 354 人收到了随访调查邮件（样本其余人的电子邮件地址已失效）。与研究人员的预测一致，这些关系在两年期间保持了相对稳定和持久。McKenna\
  \ 等人 (2002) 从此研究得出结论：\n\n> 个人并不是将互联网作为逃避现实生活和建立真实关系的方式，而是将其作为一种与现有家人和朋友保持联系的手段，而且是一种在相对无威胁的环境中建立亲密且有意义的新关系的手段。对于那些因为害羞、社交焦虑或缺乏社交技巧而在面对面情况下难以建立关系的人来说，互联网可能也有帮助。（p.\
  \ 30）\n\n## 3.5 当代在线空间\n\n在现代，互联网已成为情侣相遇的更流行的地方。Dutton, Helsper, Whitty, Buckwalter\
  \ 和 Lee (2008) 对澳大利亚、西班牙和英国的已夫妇进行了抽样，发现澳大利亚 9% 的已夫妻、英国 6% 和西班牙 5% 的已夫妻是在网上结识伴侣的。在线结识的夫妻中比例最大的群体年龄在\
  \ 26 到 55 岁之间。一个有趣的发现是，使用 `CMC` 可能会让人们遇到他们通过其他手段可能遇到的人；也就是说，互联网让人们在选择伴侣时具有更多多样性，例如引入了年龄或教育背景差异更大但兴趣和价值观更相似的个体。在对同一项目的近期研究中（牛津互联网学院，2011），研究人员发现，在一项涵盖澳大利亚、巴西、日本和美国的泛欧研究中，15%\
  \ 的已夫妻是在网上结识伴侣的。最常见的场所包括在线约会网站，其次是聊天室，然后是社交网络（SNS）。其他场所包括个人网站、在线社区、在线游戏网站以及通过电子邮件或即时消息直接联系。\n\
  \n本章之前讨论的 `CMC` 模式主要采用基于文本的交流。然而，今天，许多空间在视觉上并不是匿名。空间的特征可能会影响我们互动的方式以及我们感知彼此的方式。Walther\
  \ 等人 (2001) 评估了在短期和长期虚拟国际小组中在线展示自己物理肖像的时机。他们发现，在计算机会议之前和期间看到虚拟小组成员的照片，对短期、不认识的小组的亲密感/情感和社交吸引力有积极影响。对于在结识一段时间后看到照片的虚拟小组，与从未见过对方照片的长期用户相比，一旦引入照片，他们体验到的情感和社交吸引力较少。\n\
  \n在更最近的趋势中，我们经常在网上与已经在下认识的人联系。例如，Subrahmanyam 和 Greenfield (2008) 发现，青少年使用电子通信（如即时消息、电子邮件、短信、博客和\
  \ SNS）来加强现有的关系，无论是与朋友还是浪漫伴侣。此外，他们认为青少年日益地将这些工具整合到他们的线下世界中。例如，SNS 被用来获取有关他们在线下世界遇到的新人的信息。本节接下来将转向考虑更当代的在线空间以及关系在这些空间内发展的方式（其中一个空间在线约会网站，将在第\
  \ 4 章]中详细介绍）。\n\n### 3.5.1 MMORPG：仍然是一个非常社交化的空间\n\n在本章前面，我们写了关于 MUDs 和 MOOs。MMORPG\
  \ 在很大程度上取代了这些早期空间。在 MMORPG 中，玩家扮演虚构角的角色（通常在幻想世界中），并对角色的许多行动拥有控制权。MMORPG 与 MUDS 和\
  \ MOOS 的区别在于它们不仅仅是基于文本的；它们还有复杂的图形。除了玩游戏之外，个人还可以互相编写文字并在这些空间中社交。游戏中创造的世界即使在玩家不在游戏中时也会继续进化——例如\
  \ `EverQuest`、`Final Fantasy` 系列、`World of Warcraft` 以及最近的 `Warhammer`。这些游戏的流行性继续增长。最近，与某些\
  \ MMORPG 的这种互动性质变得更加“成人化”。例如，`Age of Conan`、`Requiem: Bloodymare`、`2Moons` 和 `Warhammer`\
  \ 提供了更多极端暴力的机会和对暴力结果更生动的描述。\n\n\n\n\n研究人员发现，玩家之所以被这些游戏所吸引，部分原因是因为它们的社交元素。Yee (2006)\
  \ 发现了个人玩大型多人在线角色扮演（MMORPG）的五种动机，包括成就、关系、沉浸、逃避和操纵。在他的研究中，他发现男性玩家更容易受到成就和动机因素的驱动，而女性玩家则更容易受到关系因素的驱动。他还发现，玩家与他们在\
  \ MMORPG 中结识的人建立了有意义的关系。有趣的是，Yee (2001) 发现，60% 的男性玩家和 75% 的女性玩家认为，他们在 `EverQuest`\
  \ 中的某些友谊与他们的线下友谊不相当甚至更好。他还发现，有 3% 的男性玩家和 15% 的女性玩家与诺拉斯（Norrath，`EverQuest` 所描绘的世界）首次结识的某建立了线下关系（即结婚、约会或订婚）。\n\
  \n`Second Life` 是另一个 MMORPG 的例子。它是一个由 Linden Lab 开发的在线虚拟世界，于 2003 年推出。`Second Life`\
  \ 用户被称为“居民”，他们通过化身进行相互互动。与其他 MMORPG 不同，这里没有游戏目标。相反，居民们与其他居民见面、探索并帮助创建虚拟环境。参与者可以进行社交、参加个人和小组活动，并创建和交易虚拟财产。众所周知，浪漫关系和友谊会在\
  \ `Second Life` 中建立和发展。Gilbert、Murphy 和 Avalos (2011) 对 199 名在 `Second Life` 中建立过亲密关系的参与者进行了调查。他们发现，大多数参与者将他们的\
  \ `Second Life` 关系视为真实的，而不是一种游戏形式。\n\n### 3.5.2 社交网络网站：面对面与虚拟朋友\n\nBoyd 和 Ellison\
  \ (2007) 对社交网络网站（SNSs）的定义为：\n\n> 基于网络的服务，允许个体 (1) 在边界系统内构建公共或半公共的个人资料，(2) 列出与其建立连接的其他用户列表，以及\
  \ (3) 查看并遍历他们在系统内的连接列表以及其他人在系统中建立的连接。这些连接的性质和术语可能随网站而异。\n\nFriendster 出于 2002 年，是最早的主流\
  \ SNS 之一，随后是 Myspace 和 LinkedIn。Facebook 于 2004 年推出，目前是全球最大的 SNS。\n\n对 SNS 的研究发现，青少年和年轻人使用这些网站来加强他们线下连接的各个方面（Pempek,\
  \ Yermolayeva & Calvert, 2009；Subrahmanyam, Reich, Waechter & Espinoza, 2008）。（我们将在第七章\
  \ 中进一步讨论青少年和在线关系。）然而，研究人员发现 SNS 也被用于寻找新朋友（Raacke & Bonds-Raacke, 2008）。有趣的是，Pempek\
  \ 等人 (2009) 发现 Facebook 用户观察内容的时间多于发布内容的时间。\n\n研究人员发现，成为 SNS 成员可以特定的社交利益（Ellison,\
  \ Steinfield & Lampe, 2007, 2011；Steinfield, Ellison & Lampe, 2008）。例如，Ellison 等人\
  \ (2007) 发现使用 Facebook 与三种社会资本之间存在强关联：桥接型社会资本、联结型社会资本和维持型社会资本，其中最强的关系是与桥接型社会资本的关系。此外，发现使用\
  \ Facebook 可能对低自尊心和低生活满意度的用户产生更大的益处。\n\nSNS 上的体验并非都是积极的。Muise、Christofides 和 Desmarais\
  \ (2009) 发现 Facebook 使用量的增加显著预测 Facebook 相关的嫉妒。Utz 和 Beukeboom (2011) 检查了 SNS 嫉妒、SNS\
  \ 关系幸福以及 SNS 使用对浪漫关系的影响。总体而言，他们发现参与者对伴侣在 SNS 上的活动时，感受到的快乐多于嫉妒。然而，低自尊的个体比高自尊的个体体验了更多与\
  \ SNS 相关的嫉妒。自尊心还会调节 SNS 使用以及在 SNS 上获得受欢迎的需求对 SNS 相关嫉妒和 SNS 相关关系幸福的影响。\n\n你在 SNS\
  \ 上如何展示自己可能会产生影响。例如，Tong、Van der Heide、Langwell 和 Walther (2008) 考察了 Facebook 资料中朋友数量与观察者对吸引力和外向性评分之间的关系。该研究发现，个人\
  \ SNS 朋友数量与个人社交吸引力之间存在曲线关系。在个人资料显示朋友最少（102 个）的情况下，社交吸引力的评分最低，而最高评分出现在拥有约 300 个朋友的资料。然而，任何朋友超过\
  \ 300 个的资料，其评分都会下降到接近 102 个朋友资料的水平。此外，这些作者发现，拥有更多朋友资料的人更有可能被判断为外向；然而，最高程度的外向性与中等数量的朋友有关，并随着朋友数量的增加而减少。因此，拥有朋友数量最多的资料的人更有可能被判断为内向。\n\
  \n通过 SNS 了解一个人可能与通过其他在线空间或面对面交流可能一个人不同。例如，Antheunis、Valkenburg 和 Peter (2010) 观察了荷兰一个\
  \ SNS 上初始在线互动中的不确定性减少过程。他们发现参与者使用了三种不确定性减少策略：被动、主动和交互式。被动策略最常用，其次是交互式和主动策略。重要的是，这些作者指出：\n\
  \n> 与基于文本的计算机介通信（CMC）环境相比，社交网络网站拥有更多听力和视觉线索，并且是相对开放的系统。显然，这使得 CMC 参与者不仅可以使用交互式[不确定性减少策略]（即直接提问和自我披露），还可以观察目标人物（被动策略），或向其他参与者询问有关目标人物的信息（主动策略）。（第\
  \ 106 页）\n\n然而，研究人员还发现，尽管被动策略最频繁，但交互式策略是唯一减少信息寻求者不确定性水平的策略。正如预期，他们发现低不确定性会导致社交吸引力。更重要的是，他们发现不确定性水平与社交吸引力之间的关系并非直接，而是被感知信息的效价所调节（即个体感知目标人物信息的正面或负面的程度，无论其信誉或质量如何）。\n\
  \n## 3.6 在各种空间中互动\n\n正如第二章所讨论的，学者需要更加意识到人们在各种空间中交流、发展和维护友谊以及浪漫关系。研究人员不再能将线下领域称为“现实世界”。同样如此，这意味着个体在多个空间中可能拥有多种自我呈现。这对于关系维护可能会产生什么影响？\n\
  \n\n\nDe Andrea 和 Walther (2011) 通过调查观察者如何解释 Facebook 自我呈现与通过其他人际互动形成的印象之间的差异，对上述问题进行了研究。参与者能够轻松识别出朋友和熟人中具有误导性的在线自我呈现；然而，他们认为熟人的在线自我呈现比朋友的自我呈现更具误导性。此外，当熟人进行误导性自我呈现时，更容易导致对其产生不可信任和虚伪的判断。尽管对熟人给予了更严厉的评判，但朋友并没有因此幸免。发布不诚实自我呈现的朋友被评为不可信任（被评判为不道德和不光彩的是该朋友本人，而非该行为）以及是虚伪的。这项研究结果表明，个人对于在线和线下自我呈现之间的差异是不可容忍的。\n\
  \n## 3.7 该领域的未来发展\n\n正如本章所承认，互联网将继续增长，新潮流将层出不穷，因此很难预测心理学家未来在关系方面将研究什么。毫无疑问，连接速度将变得更快，可用带宽也会更多。到目前为止，大多数学者在考虑发起、发展和维持关系时，都考虑了在线空间与线下空间之间的差异。然而，现实是个人会将多种媒体与传统通信结合使用。在关系的早期认识某人时，通常不再是人们在一个在线空间互相认识，并在不同媒体之间切换直到最终面对面。相反，个人将各种媒体整合到他们的关系形成和发展中。关于关系的新研究需要考虑这些媒体使用的变化。\n\
  \n## 3.8 结论\n\n自 20 世纪 990 年代以来，世界变化非常快。然而，正如本章指出的，在建立关系方面，我们所做的并不与互联网出现之前完全不同。已经开发出新理论来解释在线交往；然而，许多解释传统约会形式和关系发展的理论仍然提供了有用的视角。新理论发现，有时人们在线建立的关系比面对面建立的关系更亲密、更强烈（超人际）。研究人员还在研究在线视觉上认识某人与视觉匿名之间的区别。此外，研究发现，当不同空间之间的自我呈现缺乏一致性时，个人是不可容忍的。未来，心理学家可能不会使用许多学者目前采用的在线和线下关系的二元观点。此外，在考虑关系发展时，我们建议学者考虑每个空间的特征以及治理这些空间的独特规则。\n\
  \n在 第 4 章 中，我们将更详细地观察一种在线空间，考虑个人寻找潜在浪漫伴侣的环境——在线约会。与本章一样，你将了解到这些网站上的自我呈现存在问题，这有时会让约会者难以决定是否想更多地了解某个人。尽管如此，许多人在这些网站上相遇后仍然成功地建立了关系。\n\
  \n### 讨论问题\n\n1. 你是否有仅在社交网络服务（SNS）上与之互动的朋友？这些人与你面对面认识的人有不同吗？\n2. 考虑沃尔特（Walther）的超人际理论。你是否建立过感觉比面对面关系更亲密的在线关系？\n\
  3. 考虑麦肯（McKenna）的“真实自我”概念。你是否发现在线上更容易揭露自己真实的自我？\n4. 你如何展望通过数字技术结朋友和寻找浪漫伴的未来？\n\n\
