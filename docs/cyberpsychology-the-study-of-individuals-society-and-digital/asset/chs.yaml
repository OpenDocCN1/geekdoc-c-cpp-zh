  \ & Behavior*, *6*(6), 569–579.\n6. Whitty, M. T. (2005). 网络出轨的“真实性”：男性和女性对不忠网络关系的表述。*Social\
  \ Science Computer Review*, *23*(1), 57–67.\n\n# 7 儿童和青少年对数字技术的使用\n\n与成人相比，儿童和青少年在某些方面对数字技术的理解和体验非常不同。成年人经历过互联网出现之前的世界，而儿童和青少年是在各种数字技术环境中长大的，这些技术被用于教育他们、让他们建立友谊，并让他们从中学习身份认同。本章探讨了年轻人使用互联网的一些方式，以及它可能为这些用户提供的机会和潜在风险。我们讨论了年轻人与老年人之间的数字鸿沟，这使得父母很难以知情的方式就年轻人在网络空间中可能遇到的潜在危险提供建议。“身份发展”部分探讨了互联网如何改变了年轻人形成身份的方式，为他们反思和思考自我提供了新途径，同时也为身份的形成带来了新挑战。\n\
  \n## 7.1 互联网使用\n\n2011 年，《牛津互联网调查》显示，年轻人使用互联网的情况高于老年人（Dutton & Blank, 2011）。研究发现几乎所有\
  \ 14 至 17 岁的青少年都使用互联网。Childwise (2010) 报告称，90% 的英国儿童使用互联网，平均每个儿童每周使用五次以上，每天平均两小时。`框\
  \ 7.1` 详细列了 Livingstone (2006) 编写的英国青少年统计数据，而 `框 7.2` 概述了皮尤研究中心一份报告中强调的美国青少年统计数据。\n\
  \n## 7.2 数字鸿沟\n\n研究人员认为，尽管年轻人迅速接受了互联网，但在儿童和青少年获取互联网方面存在不平等现象。Livingstone 和 Helsper\
  \ (2007) 发现，男孩、年长儿童和中产阶级儿童都从更频繁、质量更好的互联网使用中受益，而女孩、年幼儿童和工人阶级儿童则不然。同样，研究人员发在美国样本中，低收入家庭的非洲美国裔儿童以及父母只有高中及以下学历的儿童，在家使用电脑的可能性低于白人儿童和高收入家庭儿童（Brodie\
  \ et al., 2000）。\n\nWei 和 Hindman (2011) 指出，对数字鸿沟的关注不应在于接入权限或个人使用互联网的程度，而应在于他们如何使用。这些作者发现，高社会经济地位的儿童比低地位的儿童更可能为了信息目的使用互联网。同样，Wood\
  \ 和 Howley (2012) 在俄亥俄州的学校样本中发现，大多数学生都能接触计算机和互联网。差异在于带入教室的笔记本电脑数量、计算机实验室的权限、软件的充足性以及网络连接的速度和可靠性。在这些变量上，差异通常倾向于富裕的郊区学校。然而，并非所有研究人员都认为学校类型决定了年轻人之间数字鸿沟的程度。在一项跨多个国家的研究中，Zhong\
  \ (2011) 发现，ICT 设施的可用性学校类型是学生自述数字技能的重要预测因素。他们还发现考虑家庭环境很重要。青少年在家庭中获取 ICT 的情况、社会经济背景以及使用\
  \ ICT 的历史与自述数字技能呈正相关。此外，他们发现男孩报告的数字技能比女孩更复杂。\n\n## 7.3 数字技术：对年轻人是有害还是赋能？\n\n对于儿童是否应该上网，意见不一，父母经常担心孩子在做什么。这部分源于父母与孩子在互联网知识方面的代沟，另一部分源于对年轻人行为的认知。Livingstone\
  \ (2009) 认为，关于儿童上网存在极极化的观点。她指出：\n\n> 儿童被认为是脆弱的，正处于关键但脆弱的认知和社会发展过程中，互联网倾向于通过向发展的社会条件引入潜在危害构成风险，从而为保护主义的监管环境提供理由。\n\
  \n相反的观点是，儿童被视为\n\n> 独立且具有创造力的主体，他们的媒体敏锐技能往往被周围的成人所低估，结果是社会未能为他们提供足够的环境。（p. 16）\n\
  \n\n\n\n\n事实是，互联网为年轻人提供了巨大的机会，但同时也带来了许多风险（总结在表 7.1）。如表所示，年轻人可以从数字技术中获得许多机会，因此有理由认为，为了保护年轻人免受网络风险的影响，解决方案并不是对互联网进行普遍的禁止。相反，父母需要意识到这些风险，并意识到他们需要为提供什么样的支持（Livingstone,\
  \ 2009）。本章现在将更详细地考虑年轻人可能面临的一些风险类型（尽管某些主题在其他章节中也有涉及）。\n\n| 潜在机会 | 潜在风险 |\n| --- |\
  \ --- |\n| 获取全球信息 | 非法内容 |\n| 教育资源 | 恋童癖者的性诱导 |\n| 朋友间的社交网络 | 遭遇极端或性暴力 |\n| 娱乐、游戏和乐趣\
  \ | 其他有害的犯规内容 |\n| 用户生成内容的创作 | 种族主义/仇恨材料和活动 |\n| 公民和政治参与 | 广告和隐性营销 |\n| 身份表达的隐私\
  \ | 偏见信息或虚假信息 |\n| 社区参与/活动主义 | 个人信息滥用 |\n| 技术专长和素养 | 网络欺凌/骚扰 |\n| 职业发展/就业 | 赌博、钓鱼、金融诈骗\
  \ |\n| 个人/健康/性建议 | 自残 |\n| 专业小组和粉丝论坛 | 侵犯/滥用隐私 |\n| 与远方的他人的共享经验 | 暴露于非法活动 |\n\n\
