  \ Wiley & Sons.\n\n# 12 网络犯罪：诈骗、欺诈与非法下载\n\n> 我从我父亲位于伦敦的家里给你写这封信，相信你对我挽救家族最后的遗产将有巨大的帮助。我选择通过这种方式联系你，是因为它是最快、最可靠的通信方式，我希望寻求你坚定的支持与合作。\n\
  \n> 我是 West Alamieyeseigha 先生，Alamieyeseigha 家族的继承人。我家族的遭遇始于去年，当时我的父亲是尼日利亚南部巴耶塞拉州（Bayelsa）州长，由于他反对政府对尼日尔三角洲困境的漠视，他与联邦政府发生了冲突。该地区是国家原油的主要外汇来源。在英国伦敦被捕之前，我父亲与联邦当局进行了一系列会议，其中部分会议目的是为了让他放弃对真正的联邦制和资源控制的运动，但他拒绝了对方提供的所有优厚承诺，因此有了陷害他的计划。他于去年在伦敦被捕并扣留。在某个过程中，他逃回了家乡巴耶塞拉州，但这离不开英国当局的配合，他们声称他逃了保。我\
  \ 50 岁的老母亲 Margaret Alamieyeseigha 夫人也在伦敦遭受了耻辱并被指控洗钱罪。\n\n> 我确定你对这个案件非常了解，不过你可以进行进一步查询。然而，我联系你的目的是寻求你在保障我家族遗产方面的支持与合作。我是根据我母亲的指示联系你的，她要求我寻找一位可靠的外国人，帮助我们投资我父亲保存在私人保险箱中的、价值超过\
  \ 20,000,000.00 美元的未被发现资金。如果你能提供你所在国家的投资信息，我将为你提供如何获取资金的细节。作为你提供信息和合作的回报，全部资金的 30%\
  \ 将作为你的报酬。\n\n> 当你表示愿意帮助我们时，我将向你说明更多细节。在此期间，你可以通过……联系我。（尼日利亚邮件诈骗示例；Whitty & Joinson,\
  \ 2009）\n\n在第 11 章中，我们查看了网络欺骗，主要关注日常欺骗，并指出了区分日常谎言与为了犯罪活动而说的谎言的重要性。本章关注犯罪分子在网上进行的欺骗，以及为什么有些人会被这种欺骗误导。特别是，我们将关注钓鱼、邮件诈骗（MMF）以及音乐和视频内容的非法下载。\n\
  \n## 12.1 钓鱼\n\n钓鱼利用社会工程和技术欺骗来诱导个人提供个人和财务信息，以便欺诈访问人的真实账户。这通常从一封似乎来自知名且信任组织（例如 `PayPal`、`eBay`、某知名银行）的邮件开始，要求用户通过登录组织网站验证其信息。然而，提供的链接并未指向官方网站——而是将用户引导至一个模型。类似的信息也会出现在社交媒体上，如\
  \ `Facebook`。技术欺骗方案在用户的计算机上植入犯罪软件，通过拦截用户的在线账户用户名和密码，或通过破坏本地基础设施将消费者引导至伪网站来窃取凭据（Anti-Phishing\
  \ Working Group, 2014）。由于这些攻击是大量发送的，“钓鱼（phishing）”一词被用来描述这类攻击，因为它就像一次钓鱼活动，犯罪分子抛出诱饵，希望能欺骗至少几个遇到饵物的猎物。钓鱼邮件的示例可以参见图\
  \ 12.1。如图所示，如果用户检查网络链接，他们会发现真实的网站地址看起来完全不像 Nationwide 的官方网站。\n\n```\n![屏幕截图显示了一封关于\
  \ Nationwide SSL 服务器升级的钓鱼邮件示例。光标指向邮件中的一个网络链接，指向 http://www.drinkrezepte.de/shakes/index.html。](img/c12f001.gif)\n\
  ```\n\n**图 12.1** *钓鱼邮件示例*\n\n\n\n\n\n反钓鱼工作小组（Anti‐Phishing Working Group）在 2014\
  \ 年 12 月识别出 17,320 个唯一的钓鱼网站。它还发现 2014 年 12 月有 300 个品牌成为钓鱼攻击的目标。通过对 2014 年 12 月受攻击最多的行业领域进行分析，发现零售服务是受攻击最高的行业（29.4%），其次是支付服务（25.1%）和金融服务（20.8%）。由于检测技术的改进，大约一半的钓鱼网站会在一天内被关闭（Rao,\
  \ 2015）。尽管如此，每天存在的数量表明，这些网站仍然是一个需要改进检测和预防方法的问题。此外，它们的存在证明了犯罪分子至少认为这是一种欺骗受害者的成功方法。\n\
  \n除了钓鱼之外，读者可能听说过“鱼叉式钓鱼”（spear phishing），它与钓鱼相似，但它不是随机黑客，而是有特定的目标。与钓鱼一样，鱼叉式钓鱼邮件似乎也来自可靠的来源。然而，与普通钓鱼不同，鱼叉式钓鱼利用了个人和组织的特定知识。Hong\
  \ (2012) 举了一个针对军事人员的攻击案例，该邮件可能包含一份参加将军退休派对的邀请，要求收件人点击链接确认他们可以出席。因此，由于邮件看起来来自已知来源，与普通钓鱼攻击相比，个人可能更容易响应鱼叉式钓鱼攻击。\n\
  \n## 12.2 语音诈骗 (VISHING)\n\n个人继续面临新的诈骗，犯罪分子也坚持寻找新方法来利用媒体来说服潜在受害者相信他们是真实的。例如，语音诈骗（Vishing）是犯罪分子利用电话试图骗用户泄露用于身份窃取的私人信息。诈骗者通常伪装成合法企业（例如银行），欺骗受害者相信他们是出于正当理由获取个人信息。在其他版本中，犯罪分子要求受害者在网站上输入个人详情，或说服受害者将资金转入另一个账户，并说他们是为了保护其财务安全，而实际上这些账户是钱骡的账户。\n\
  \n### 12.2.1 受害者人数\n\n尽管组织为终端用户提供了许多意识活动和培训研讨会，但仍有许多人沦为钓鱼攻击。受加拿大政府赞助的 Get Cyber\
  \ Safe 在 2015 年的一份报告中估计，大约有 10% 点击钓鱼链接的加拿人落入诈骗，大约相当于 800,000 人（Get Cyber Safe, 2015）。Verizon\
  \ 在英国编写的一份报告声称，2014 年约有 25% 的员工可能会打开钓鱼邮件（BBC News, 2015）。\n\n## 12.3 为什么人们会被钓鱼邮件欺骗？\n\
  \n一些研究人员研究了受害者相信钓鱼邮件是真实的原因。在 Wang, Herath, Chen, Vishwanath 和 Rao (2012) 进行的研究中，参与者看到了一封主题为“立即升级您的电子邮件帐户”的“真实”钓鱼邮件图片。该邮件向收件人索要用户名、密码、出生日期、安全问题及答案。收件人还被告知，如果不在七天内发送请求的信息，他们将丢失电子邮件账户。参与者并没有被告知这是一封钓鱼邮件，但被问及他们响应邮件的概率有多大，并回答了一系列旨在帮助研究人员建立理论模型以预测哪些用户更有可能响应钓鱼邮件的问题。他们发现，对本能触发因素（例如强调响应的紧急性）的关注会增加响应概率，而对钓鱼欺骗指标（如语法错误和发者地址）的关注则会降低响应概率。有趣的是，这些研究人员发现处理钓鱼邮件时花费的认知努力与响应邮件的概率没有显著相关。\n\
  \nAlsharnouby, Alaca 和 Chiasson (2015) 进行了实验研究，要求参与者考虑一系列网站（14 个钓鱼网站和 11 个真实网站），以帮助为什么用户会被钓鱼诈骗欺骗。参与者需要查看每个网站，并被判断每个网站是合法的还是欺诈的、他们的确定程度以及如何得出结论。此外，参与者被要求佩戴眼动追踪设备，在他们查看网站时记录其视线数据。这些研究人员发现，参与者在浏览器\
  \ `Chrome` 中查看安全指标花费的时间越长，他们注意到安全指标的可能性就越高——尽管他们注意到这种效应并不强烈。\n\n在 Vishwanath (2015a)\
  \ 进行的一项值得关注的研究中，检查了 Facebook 使用与对钓鱼攻击脆弱性之间的关系。Vishwanath 指出，通过社交媒体（如 `Facebook`）进行的钓鱼攻击比电子邮件钓鱼攻击更容易成功。他认为认为这种成功率的原因是社交媒体的界面、功能和用户保护在不断变化，使得用户很难对平台的使用达到精通。通过社交媒体进行的钓鱼攻击分为两个阶段。第一阶段要求用户接受好友请求，接受后可能会为犯罪分子提供关于用户的大量数据。在攻击的第二阶段，犯罪分子可以使用社交媒体的消息功能（如\
  \ `Facebook` 的 `Messenger`）直接向用户索取信息。Vishwanath 举例说，知道某人爱狗可能被用来通过 `Messenger` 向狗狗慈善机构请求捐款，而实际上受害者点击的是带有隐藏脚本和病毒的链接，这些病毒可能会感染访问消息的设备。这项研究传递的信息是：习惯性使用\
  \ `Facebook`（包括使用 `Facebook` 的频率和维护大型社交网络）以及无法调节这些行为，是社交媒体攻击中个人受害最大的预测因素。\n\n\n\n\
  \n\n尽管 Vishwanath (2015b) 承认社交媒体钓鱼在诈骗受害者方面比电子邮件钓鱼更有可能成功，但他仍然对进一步了解那些容易受到电子邮件钓鱼攻击的人感兴趣。在这项特别的研究中（Vishwanath,\
  \ 2015a），他向一小组就读本科学位的学生（400 人中的 200 人，其中有 192 份有效回复）发送了一封钓鱼邮件。邮件中包含一个关于电子邮件账户将关闭的警告，以及一个紧迫的截止日期，要求点击超链接以防止账户关闭。该链接使用短网址进行了隐藏。未点击链接的人在一周后收到一封提醒邮件。总而言，83%\
  \ 的参与者（n = 159）点击了该链接。Vishwanath 认为，邮件习惯强度（即个人是否会对收到的邮件自动做出反应）和认知处理的共同影响预测了对钓鱼攻击的易易感性。他还假设尽责心和神经质等人格特征会影响电子邮件习惯。正如预期的那样，发现尽责心高和神经质高的人更倾向于报告安全的邮件习惯。Vishwanath\
  \ 发现，习惯性检查邮件的个人受害机会会增加。他还发现，启发式处理（也称为“认知捷径”）显著增加了受害概率（例如，邮件可能看起来来自可信的来源，如学生就读大学），而系统性处理（对通信内容的详细评估）则显著降低了受害概率。然而，邮件习惯被认为是受害的最强预测预测因素，这表明预防工作需要集中于改变习惯以降低易感性。\n\
  \n## 12.4 提高检测能力\n\n可以理解，检测软件以及帮助用户识别钓鱼邮件的培训计划已被开发，以帮助减少陷入钓鱼邮件的人数，并帮助组织免受员工点击此类邮件造成的伤害。例如，Jansson\
  \ 和 von Solms (2013) 对过去曾响应过请求性钓鱼邮件的个人提供了培训，以确定其培训计划是否有效。在参与者点击钓鱼邮件中的链接后，他们的电脑显示出红色警告屏幕，提醒他们这种“不安全”的行为，并附带一封邮件让他们意识到自己的“不安全”行为。此外，邮件还提供了一个链接，邀请他们参加在线培训计划。在参与计划后，通过一组关于对安全理解的简短问题评估了参与者再次受到攻击的概率。研究人员认为，他们的发现表明，接触模拟钓鱼攻击并结合嵌入培训，可以提高应对钓鱼攻击的韧性；但重要的是，这项研究没有采用随机对照组。\n\
  \n在较早的一的研究中，Davinson 和 Sillence (2010) 开发了一项培训计划，告知用户常见的钓鱼攻击类型以及如何识别它们。在这项研究中，参与者被随机分配到四种情况之一：第\
  \ 1 组被告知处于低风险且未完成培训；第 2 组被告知处于低风险并接受了培训；第 3 组被告知处于高风险且未接受培训；第 4 组被告知处于高风险并接受了培训。培训计划涉及互动游戏，训练用户防御钓鱼攻击。他们发现，无论被告知处于高风险还是低风险，一个显然是量身定制的风险信息都会增加参与者以安全方式采取行动的意愿。然而，提高风险意识似乎并没有增加安全行为。此外，研究人员发现，培训计划在培训七天后并未影响安全行为。该研究强调了评估培训计划的重要性，并强调了开发更有效的培训计划的必要性。\n\
  \n## 12.5 大众营销诈骗\n\n欺骗可以广泛定义为为了从他人或组织获取不当利益（通常是财务利益）而使用的欺诈手段。大众营销诈骗是一种利用大众通信技术（例如电子邮件、即时消息、批量邮件、社交网络）骗取钱财的欺。人们认为，犯罪分子通过这种犯罪获得的资金通常被用于更阴险的犯罪（例如毒品交易、恐怖主义）。\n\
  \n本章开头介绍了一个尼日利亚邮件诈骗案例，这是大多数读者可能听说过的大众营销诈骗（MMF）。这种诈骗被称为“预付费诈骗”或“419 诈骗”（之所以以此命名是因为适用于它的尼日利亚刑法章节编号），它实际上始于邮信诈骗。在大多数情况下，邮件似乎来自一个非洲国家和/或一个通常是尼日利亚人的个人，尽管也有邮件来自其他非洲国家，以及近期来自亚洲和东欧国家。预付费诈骗通常涉及因原因被困或冻结的大额资金（例如，未领的遗产、腐败的高管、临死的萨马利亚人）。在每种情况下，发送者都为收件者提供丰厚的奖励，只需让他们帮助政府官员或家庭成员解决尴尬或法律问题。回复此类邮件的人（令人惊讶的是已经有很多人被骗了）随后会逐渐遇到财务交易中的问题。起初，据称文件延迟了，然后给出需要更多钱的借口——例如，为了贿赂官员。与收件者最终将获得的巨额财富相比，所要求的资金似乎微不足道。延迟持续，收件者被索要更多财务支持。鉴于他们已经向这笔交易中投入了大量的个人资金，拒绝变得越来越困难。只有当受害者意识到并接受了自己被骗了，并且意识到他们可能永远无法拿回钱，或者犯罪分子不会被捕并逮捕时，诈骗才会结束。\n\
  \n互联网为大众营销诈骗打开了大门，因为犯罪分子可以利用它以极小的精力针对更多的潜在受害者，误导他们基于错误的慈善、投资或爱情而进行电子甚至加密货币的转账。这种犯罪还会对数字经济产生影响，因为公民开始不信任犯罪分子针对个人的特定在线网站。银行和汇款机构面临处理欺诈交易的问题，这不仅影响了自身的贸易，还影响了客户的生活，在某种程度上，无论客户实际上是否疏忽或合从。\n\
  \n某些大众营销诈骗是针对大量受害者的低价值、一次性诈骗，而另一些则涉及建立关系（例如，浪漫、商业、友谊），并随时间骗取资金，同样涉及多个同时或连续的受害者。大众营销诈骗的示例包括：\n\
  \n- *锅炉房诈骗/投资诈骗*：这种诈骗与经典的 419 诈骗一样，诱骗受害者相信他们可以很快赚取大笔资金。犯罪分子联系受害者，提供毫无价值、价格过高或不存在的股票。受害者的动机是获取巨额利润。\n\
  \n\n\n\n\n- **网络恋爱诈骗**：在这种犯罪中，犯罪分子通过网络约会网站假装建立恋爱关系，诈骗受害者，通常涉及巨额资金。受害者参与此类诈骗的动机是建立一段长期的承诺关系。自\
  \ 2012 年 6 月以来，该诈骗演变出了另一种变体，即受害者在成人约会网站（用于背叛伴侣）上遇到犯罪分子后，其进行性行为被录制视频，随后遭到勒索（威胁要将视频发送给亲友和工作场所）。\n\
  \n- **慈善诈骗**：慈善诈骗涉及犯罪分子以看似真实的慈善机构的名义骗取资金。诈骗者伪装成合法知名慈善机构的代理，或创建自己的慈善名称。犯罪分子建立与真实慈善机构运营网站相似的假网站。这些诈骗并不一定涉及一次性付款，并可以在长时间内欺骗受害者。受害者参与此类诈骗的动机是给他人捐钱，而不是希望获利。\n\
  \n- **紧急诈骗**：在 във诈骗中，犯罪分子从网上（例如通过 Facebook）获取某人的真实信息，并联系该个人联系人中的一个或多个人，称此人陷入了麻烦并急需资金（例如发生车祸或在国外遇到麻烦）。与电房诈骗和恋爱诈骗不同，这种诈骗进展极快。其动机是帮助需要帮助的亲人。\n\
  \n- **遗产诈骗**：在这种诈骗中，假装成律师的犯罪分子告诉受害者，一位与受害者姓相同或相似的富豪已去世，除非律师能识别出此人的亲属，否则资金将归政府所有。冒充律师建议，鉴于受害者姓相似，律师可以将钱付给受害者并分钱，而不是交给政府。和其他其他预付费用诈骗一样，受害者被要求支付费用（如税费和法律费用）以释放资金。这种诈骗很难检测，因为确实存在通过寻找继承人维持生活的合法公司。一些此类犯罪受害者可能认为自己的行为并不完全符合法律。\n\
  \n报告显示，很大比例的人受到了资金诈骗（MMF）的影响——无论是作为受害者本人，还是作为受害者的亲属。英国国家欺诈局（2012）估计，英国每年的诈骗损失超过\
  \ 780 亿英镑，仅 2011 年 MMF 诈骗损失就达 35 亿英镑。国家欺诈局对 4000 多名英国成年人开展了具有全国代表性的研究，发现 2011 年有\
  \ 100 万英国成年人（不到 2%）回复非自愿信息并发送资金，其中不到一半的人因此遭受诈骗。他们还发现，2011 年四之三的英国成年人（3700 万人）收到了非自愿信息（大部分通过电子邮件）。同样，在\
  \ 2000 名英国成年人的代表性样本中，Whitty（2013a）发现 2012 年英国约有 80 万成年人遭受了 MMF 的诈骗。2010 年，英国公平贸易署报告称，“近一半的英国成年人是诈骗的目标，百分之八的人在人一生中至少会成为一次受害者”（第\
  \ 1 页）。Whitty 和 Buchanan（2012）从英国代表性样本中发现，至少有 23 万名个人曾被网络恋爱诈骗骗过。正如这些统计数据所示，MMF 的财务成本是严重的。财务成本不仅涉及受害者及其家人和朋友，还包括执法部门以及社会和健康支持服务的成本。\n\
  \n大众营销诈骗被认为报案率较低，这是由于受害者经历了羞愧和耻辱感，对犯罪分子能被捕缺乏希望，并担心执法部门不会以其应有的严肃性对待此类犯罪。英国的报告机构（如\
  \ Action Fraud）估计，少于 10%的受害者实际上报告了此类犯罪。在 ways，根据 2014 年互联网犯罪投诉中心（IC3）的数据，有 123,684\
  \ 名受害者向该机构报告了网络犯罪导致的财务损失，其中许多是 MMF。估计只有 10%的受害者向`IC3`报告了此类犯罪。在澳大利亚，2012 年 MMF 受害者报告的损失仅超过\
  \ 9400 万澳元（澳大利亚竞争与消费者委员会，2012）。\n\nMMF 受害者既遭受财务损失也遭受心理影响，即使在损失了巨额资金时，心理影响有时也会超过财务影响（Button,\
  \ Lewis & Tapley, 2014; Lea, Fischer & Evans, 2009a; Levi & Burrows, 2008; Whitty,\
  \ 2015; Whitty & Buchanan, 2016）。心理伤害包括羞耻、内疚、尴尬、抑郁、自杀念、悲伤、焦虑和丧失信任。此外，由于对犯罪缺乏了解，且受害者往往因其处境被指责，他们通常缺乏其他类型犯罪受害者所获得的支持（如家人、朋友）。已知一些受害者会转而实施犯罪行为，例如为诈骗者充当“钱骡子”，有时是无意的，有时是为了收回自己的损失。\n\
  \n抓捕和起诉 MMF 犯罪分子是一项艰巨的任务。这主要有三个原因：(1) 犯罪分子通常住在受害者不同的国家；(2) 犯罪分子使用的方法难以追踪；(3) 起诉非常耗时，因为需要分析大量的在线数据以建立针对犯罪子的证据，并获取其行踪和行动策略的情报。鉴于这些因素，需要新的策略来预防和检测这种犯罪。例如，约会网站被要求分享已知的假个人简介以帮助减少犯罪简介的数量。Facebook\
  \ 已尝试删除已知的假个人（犯罪分子创建这些简介以实现多种类型的 MMF）。反洗钱法规增加了通过汇款公司（如西汇汇和 MoneyGram）转移资金时交易和收款人的可识别性。\n\
  \n## 12.6 意识宣传活动\n\n\n\n\n\n与预防网络诈骗的策略类似，研究人员还制定了各种意识活动来帮助预防杀猪盘诈骗（MMF）。目前有许多网站和手机应用程序试图向用户普及诈骗知识，以防止因\
  \ MMF 导致的受害。这些活动通常建议一些基本规则，例如：永远不要点击电子邮件中的链接；永远不要回复要求确认银行详情的邮件；永远不要向在网上认识的陌生人发送任何资金。正如本章早些时候讨论预防网络诈骗的培训计划时所的那样，关于网络安全的警告往往只关注理想化的个人行为，并假设人们之所以上当是因为他们缺乏知识。这种方法存在的问题之一（至少对于\
  \ MMF 而言）是，许多 MMF 的受害者在被诈骗之前就已经听过这些诈骗了。Lea 等人（2009a）认为，对诈骗的详细了解反而会增加脆弱性，因为这些个人往往会产生一种“无免疫的幻觉”。研究发现，即使当权威人士（如警察、执法人员、银行经理）试图提醒某人其已成为浪漫诈骗的受害者时，受害者往往难以相信他们。此外，即使受害者对犯罪者的真实性产生怀疑，犯罪分子也会采用说服技巧来来说服受害者（Whitty,\
  \ 2015）。重复受害者的数量也表明，这是一个很难帮助其识别诈骗的群体。鉴于对诈骗的了解可能不足以防止个人被诈骗，因此需要其他类型的干预措施。为了帮助制定有效的活动以防止个人因\
  \ MMF 遭受诈骗，理解个人之所以被欺骗的原因至关重要。作为协助预防和检测的一种方式，研究人员例如研究了个人在面对诈骗时如何在认知上处理信息、哪些类型的人更容易被欺骗以及诈骗中涉及的阶段。\n\
  \n### 认知与动机错误\n\n有人认为，“落入诈骗归结于决策过程中的错误”，并且“诈骗者创造的情境（通过他们的诈骗提议）增加了做出错误决策的可能性”（Lea\
  \ 等人，2009a，第 35 页）。认知过程（例如对特定话题的过度自信）和动机过程（例如诈骗触发了积极情绪）也解释了人们对诈骗做出反应的心理原因。主要原因包括“对信任和权威的诉求”（即利用权威人士或机构使诈骗看起来合法的）以及“内感触发因素”（用于让潜在受害者关注巨额奖励和想象中的未来积极情感状态的触发因素）。受害者经常犯的另一个错误是认为自己是按照社会规范行动。规范“可以被视为基于社会知识的经验法则：它们告诉我们‘应该’如何选择，而且人们‘可能’如何选择”（Lea,\
  \ Fischer & Evans, 2009b，第 25 页）。Lea 等人（2009a）认为 MMF 受害者会掉入陷阱的常见错误清单汇总在表 12.1 中。\n\
  \n| *动机* | *认知* |\n| --- | --- |\n| 内感影响 | 信息处理的意愿降低 |\n| 偏好确认 | |\n| 缺乏自我控制 | |\n\
  | 情绪调节和幻象固着 | |\n| 追求刺激 | |\n| 喜欢与相似性 | |\n| 回报 | |\n| 承诺与一致 | 认知能力降低 积极幻觉 |\n|\
  \ 背景知识与过度自信 | |\n| 规范激活 | |\n| 权威 | |\n| 社会证明 | |\n| 角色投射 | |\n\n**表 12.1**](#c12.xhtml_R_c12-tbl-0001)\
  \ *针对诈骗的决策错误（Lea 等人 2009a 识别，第 24 页）*\n\n## 什么类型的人容易受 MMF 影响？\n\n除了考虑认知过程，研究人员还研究了容易受\
  \ MMF 影响的人群。Furnell (2005) 认为贪婪和幼稚的人更容易被骗。Lee 和 Soberon-Ferrer (2005) 发现欺诈受害者往往年龄较大、较穷、教育程度较低且单身。Holtfreter,\
  \ Reisig 和 Pratt (2008) 广泛研究了“消费者欺诈”受害情况，发现诈骗受害者自我控制力较低。相比之下，Buchanan 和 Whitty (2014)\
  \ 发现，追求刺激的人并不更容易被网络约会浪漫诈骗骗。相反，他们发现浪漫信仰中“理想化”的高分与成为受害者的概率相关。对于诈骗受害者可能存在一种通用的分类法；然而，考虑到某些诈骗的独特性质（例如，紧急诈骗需要立即响应；浪漫诈骗通常在受害者被诈骗前持续几个月），可能会根据诈骗类型存在特定的风险因素。了解容易受网络\
  \ MMF 影响的人群以及某些个人更容易受到哪些类型诈骗的影响对预防工作有利，因为知道谁更有可能成为这些犯罪的受害者可以帮助为相关人员定制合适的信息。\n\n\
  ### 互联网的作用\n\n极少有研究考虑到互联网在说服个人交钱方面可能起的作用。鉴于互联网通常在 MMF 的启动或实施中发挥作用，检查通过这种媒介进行通信的潜在影响有助于阐明预防此类犯罪的新方法。在第\
  \ 3 章中我们总结了 Walther 的超个人理论。Whitty (2013b) 进一步利用该理论来研究网络约会浪漫诈骗。她认为在这种特定的诈骗中，受害者和诈骗者之间建立了单向的“超个人”关系。根据\
  \ Whitty 的观点，受害者会对虚假人格理想化，认为他们找到了完美的伴侣。Whitty 在她的阶段模型（见下一节）中阐述了互联网在这种诈骗中扮演的角色。未来的研究可能会更多关注媒体的某些特征如何被犯罪分子用于诈骗\
  \ MMF 受害者。\n\n## 网络约会浪漫诈骗涉及的阶段\n\n将诈骗视为一系列阶段可能为让个人洞察这些诈骗的构造提供有用的方法。研究发现，网络约会浪漫诈骗经历了多个阶段，犯罪分子利用各种媒体说服受害者交钱（Whitty,\
  \ 2013b）。识别出的阶段如下：\n\n*   *第一阶段*：潜在受害者需要动力寻找“理想伴侣”。\n*   *第二阶段*：潜在受害者看到理想的简介，并获得诈骗者的唯一性承诺。\n\
  *   *第三阶段*：犯罪分子对潜在受害者进行引导以获得信任和爱，并试探潜在受害者是否已准备好并愿意交钱。\n*   *第四阶段*：犯罪分子采用技巧说服潜在受害者发送资金（例如关于急需资金的危机描述或“登门槛”策略）。\n\
  *   *第五阶段*：犯罪分子采用进一步的技巧维持诈骗持续（例如制造新的危机或采用“后推门”策略）。\n*   *第六阶段*：某些受害者可能认为诈骗已经结束，但随后再次受害（例如，犯罪分子承认一直在诈骗他们，但他们爱上了他们；随后诈骗者向受害者索要更多钱）。\n\
  \n### 非法下载\n\n\n\n\n\n> 在文件共享应用 Aurous 发布最早 Alpha 版本几天后，几家主流音乐唱片公司便起诉该公司，指控其存在“故意且严重的侵权行为”。\n\
  \n> 美国行业协会 `RIAA` 代表环球音乐、索尼音乐以及华纳音乐旗下的华纳兄弟、大西洋和首都音乐在内的唱片公司提起诉讼，寻求对该软件发布禁令并索要赔偿。\n\
  \n> 这种类 Spotify 的应用程序允许用户搜索可流媒体播放和下载的歌曲，尽管其开发者表示打算成为音乐和许可流媒体服务的聚合器，但 `RIAA` 的诉讼声称其来源是盗版网站。(Dredge,\
  \ 2015)\n\n本章到为止描述的活动显然是犯罪行为；然而，在线上进行的一些活动，用户可能不知道它们是违法的，或者认为这种做法如此普遍而不至于被视为犯罪。此类活动包括从互联网上非法下载受版权保护（例如音乐、视频、书籍）。研究表明，用户对未经授权的下载几乎没有伦理顾虑\
  \ (Siegfried, 2004)。Hardy、Krawczyk 和 Tyrowicz (2013) 认为，“事实上，文件共享服务的流行似乎表明，要么是数百万人在道德上堕落了，要么他们强烈反对将在线‘盗版’等同于传统盗窃”。\n\
  \n鉴于许多人质疑参与此类活动在道德上是否是错误的，防范这种形式的网络犯罪可能需要一种非传统的方法。事实上，已经有大量资金投入到提高意识和教育运动中，以期减少在线文件共享或“盗版”。然而，这些运动在很大程度上是失败的——对改变人们的观点或行为微乎其微\
  \ (D’Astous, Colbert & Montpetit, 2005)。事实上，参与在线盗版的终端用户数量似乎在不断上升 (Cesareo & Pastore,\
  \ 2014)。这些运动中的许多项将传统的线下盗窃行为与在线盗窃等同起来。它们通常还关注与在线盗版相关的个人负面后果，例如罚款和监禁。2012 年，英国的严重组织犯罪局（现称为国家犯罪调查局）取缔了音乐网站\
  \ `RnBXclusive`，并在网站上留下警告，称用户可能面临最高 10 年的监禁和无限额罚款。这一努力在某种程度上是成功的，因为作为结果，至少另一个网站自愿下线了。然而，这一行动似乎并没有改变终端用户的态度，有些人称其为一种欺凌策略和恐吓手段\
  \ (Geere, 2012; Moody, 2012)。最近，伦敦市警方开始在被认为非法提供盗版内容的网站上投放横幅广告；但截至目前，尚无后续研究来调查这一最新策略的有效性。\n\
  \n以往策略面临的某些问题在于缺乏对行为改变心理学的洞察，也缺乏个人对此类行为所持的伦理道德的理解。恐惧营销活动往往很少成功，因为引发过多恐惧的营销活动往往会被观众忽略，以避免因关注这些信息而产生过度的焦虑（见\
  \ Bada & Sasse, 2014）。在线安全和戒烟运动是很好的例子，这些广告植入了过多的恐惧感，但对改变行为的影响很小。研究人员认为，与传统盗窃相比，用户对在线盗版持有不同的伦理立场（例如，见\
  \ Blythe & Wright, 2008; Moores & Chang, 2006）。此外，正如计划行为理论预测的那样，如果个人认为某事是社会规范，特别是当他们的同伴正在参与该活动时，他们也可能参与该行为。有趣的是，Hardy\
  \ 等人 (2013) 发现，即使一个人的伦理观在在线和传统占有行为上同样严格，当人们感知到社会规范是“松散”的时，他们更有可能参与盗版。\n\n因此，在线盗版是一种有趣的犯罪，可能需要新方法来帮助减少。这甚至可能意味着开发针对在线材料付费的新业务模式。例如，Magnatune\
  \ 是一家成立于 2003 年的唱片公司，它将其一半的利润交给艺术家，并为通过 `PayPal` 购买提供阶梯方案。一些研究人员认为，这种方法可能防止非法下载。Regner\
  \ (2015) 在一项关于消费者对 Magnatune 态的研究中得出：\n\n> 一系列研究记录的自愿付费模式的成功是引人注目的，提高我们对 `PWYW`（随心付）的理解至关重要。各种内在动机被确定为自愿付费的决定因素。根据这些证据，公平性、互惠考虑、自我形象关注、规范遵从和战略考虑的结合驱动了\
  \ `PWYW` 环境下的行为，这似乎是合理的。(第 212 页)\n\nMagnatune 的案例可能是未来的方向；然而，行业和研究人员完全可以考虑借鉴心理学理论的其他方法，以帮助预测其成功率。\n\
  \n## 12.11 结论\n\n本章关注了两种类型的在线犯罪行为：诈骗和非法下载。此处关注的诈骗类型包括网络钓鱼、网络钓鱼的各种子类（例如针对性网络钓鱼和语音钓鱼）以及\
  \ `MMFs`（邮件式诈骗）。捕获和起诉这些犯罪分子具有挑战性且耗时，这就是为什么开发了其他方法（如教育和意识提高计划）来帮助预防这些犯罪。心理学学科为这些计划可以提供许多帮助，帮助开发者理解如何改变个人行为、易受诈骗者的心理特征，以及受害者在受到诈骗者接触时犯下的认知和动机错误。\n\
  \n### 讨论问题\n\n1. 鉴于整体证据，什么样的用户更有可能被诈骗？现有研究有什么局限性？\n2. 考虑一些防止网络钓鱼攻击的培训研究。你对这些研究会有哪些批评（包括优缺点）？\n\
  3. 你认识被 `MMF` 诈骗的人吗？你认为他们为什么会被骗？\n4. 你对非法下载音乐/视频有什么看法？你认为这在道德上是错误的吗？为什么？\n\n###\
