  \ online social networks and social capital. *Journal of Computer‐Mediated Communication*,\
  \ *12*, 1143–1168.\n3. Joinson, A. N. (2001). Self‐disclosure in computer‐mediated\
  \ communication: The role of self-awareness and visual anonymity. *European Journal\
  \ of Social Psychology*, *31*, 177–192.\n4. McKenna, K. Y. A., Green, A. S. & Gleason,\
  \ M. E. (2002). Relationship formation on the Internet: What’s the big attraction?\
  \ *Journal of Social Issues*, *58*, 9–31.\n5. Tong, S. T., Van der Heide, B., Langwell,\
  \ L. & Walther, J. B. (2008). Too much of a good thing? The relationship between\
