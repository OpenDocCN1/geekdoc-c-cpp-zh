  \n# 11: 在线欺骗\n\n正如本书已经所示，在某些方面，我们在在线上的行为与在物理世界中的行为不同。在第 2 章中，我们探讨了个人是否可能在网络空间探索和体验与线下不同的身份。在第\
  \ 3 章、第 4 章和第 5 章中，我们了解到人们在网络空间建立关系、发展友谊和浪漫关系的方式，与我们在物理世界中建立关系的方式可能有所不同。我们在线上进行的自我披露往往比面对面时更多，某些人在网络空间中发展了“超个人”关系。悖论的是，尽管我们有时会在在线上更多地敞开自己，但也会保留或审查信息。此外，一些研究人员发现，人们在网络空间中可以（或至少尝试）比线下更具欺骗性。Whitty\
  \ 和 Joinson (2009) 将这种现象命名为“真相/谎言悖论”。Whitty 和 Joinson (2009) 写道：\n\n> 在许多方面，互联网是一种与电话和[面对面交流]完全不同的媒介。这个空间的独特之处在于我们在其中交流的方式……通常，我们的交流往往是“超诚实”的，但悖论地也往往是“超不诚实”的。这两种对比的特征应该引起学者、网页设计师以及当然互联网用户的关注。（第\
  \ 6–7 页）\n\n本章考察了关于在线欺骗的文献，并研究了个人在网络空间中可能在哪些方面比在物理世界更具欺骗性。\n\n## 11.1 定义欺骗\n\nBuller\
  \ 和 Burgoon (1996) 将欺骗定义为“发送者故意传达的信息，旨在使接收者产生虚假的信念或结论”（第 205 页）。Bok (1989) 对欺骗的定义如下：“当我们刻意要欺骗他人时，我们传达旨在误导他们的信息，其目的是让他们相信我们自己并不相信。我们可以通过手势、伪装、通过行动或不作为，甚至是通过沉默来实现这一点”（第\
  \ 13 页）。她区分了欺骗（deception）和谎言（lies），认为谎言是欺骗的一种形式，本质上是“任何陈述性的故意欺骗性信息。此类陈述通常通过口头或书面进行，但当然也可以通过烟雾信号、摩斯密码、手语等传递”（第\
  \ 13 页）。\n\nBok 提醒我们，欺骗并非小事。几个世纪以来，哲学家们一直在争论撒谎是否是不道德的行为，如果是，是所有谎言都不道德的，还是在某些情况下某些类型的谎言可以。Bok\
  \ (1989) 写道：“欺骗和暴力——这是对人类蓄意攻击的两种形式。但欺骗的控制更为微妙，因为它既影响信念，也影响行动”（第 18 页）。Bok 描述了被欺骗的个人，指出：\n\
  \n> 那些发现自己在重大问题上被骗的人——例如，父母的身份、配偶的爱或政府的诚信——会感到愤恨、失望和怀疑。他们感到受委屈；对新的提议保持警惕。并根据所发现的谎言的新光芒，回顾他们过去的信念和行动。（第\
  \ 20 页）\n\nBok 还指出，欺骗对社会具有破坏性。在她看来：\n\n> 因此，一个成员无法区分真实信息与欺骗信息的社会将会崩溃。但在这种全面崩溃发生之前，个体的选择和生存就会受到威胁。对食物和庇护的寻找不能依赖于他人的预期。井水中毒的警告或事故中的求救除非能找到独立的证实，否则将被忽视。（第\
  \ 19 页）\n\n对欺骗的所有个人和社会后果进行彻底调查超出了本书的范围。然而，之前的文献确实表明撒谎是一个严肃的问题，如果欺骗在网上更为普遍，那么它就是一种需要心理学家和社会学家关注的行为。\n\
  \n## 11.2 网络空间中的欺骗\n\n\n\n\n互联网为我们提供了一个新的欺骗平台。在网上，个人可能会欺骗更多的人。此外，网络空间为欺骗提供了在面对面环境中无法实现的新奇机巧的可能（Walther,\
  \ 1996, 2007）。研究人员认为在线欺骗可能更加普遍的主要原因在于，在线交流和对自我的呈现在物理上并没有与人本人相连。数字欺骗被定义为‘在技术中介的信息中对信息进行刻意控制，以在信息的接收者中创造一种虚假信念’（Hancock,\
  \ 2007, p. 209）。与其他媒体相比，我们可能不需要为网络空间中发生的欺骗设立单独的定义；但考虑到研究人员发现，在某些方面，某些类型的谎言更容易（至少感觉上更容易）脱身，而且我们可以以在物理世界无法实现的方式进行欺骗，因此这种定义可能是很有用的。\n\
  \n研究人员尝试对在线发生的欺骗类型进行分类。Utz (2005) 认为欺骗有三种类型：类别欺骗（性别转换）、吸引力欺骗和身份隐瞒。尽管这些区别很重要，但也许\
  \ Hancock (2007) 的分类更有用。Hancock 认为数字欺骗有两种不同类型：基于身份的欺骗和基于消息的欺骗。身份欺骗是创建一个虚假的身份或归属关系。与物理世界相比，这种欺骗在网络空间中可能更容易执行，也更容易在事后脱身。基于消息的欺骗是基于两个或更多人之间通信内容中的欺骗。学术工作已经关注了这两种形式的欺骗。\n\
  \n### 11.2.1 基于身份的欺骗\n\n个人可能会伪装关于自己的一系列基于身份的信息——例如，年龄、性别、种族、性取向、健康状况和外貌吸引。网络空间比“真实”世界提供了更多管理身份和匿名性（或至少是视觉上的匿名）的机会，它可能会助长基于身份的欺骗。\n\
  \n网络空间比“真实”世界提供了更多管理身份和匿名性（或至少是视觉上的匿名）的机会，它可能会助长基于身份的欺骗。如今，大多数在线空间并非完全基于文本的。然而，在用户可以利用头像来代表自己的空间里，他们仍然可以以在物理世界无法实现的方式进行欺骗。例如，Galanx\
  \ 和 Nah (2007) 发现，在仅限文本的空间中，欺骗者感受到的焦虑更大。然而，考虑到研究人员发现，某些类型的谎言更容易（至少感觉更容易）脱身，而且我们可以以在物理世界无法实现的方式进行欺骗，这种定义可能是很有用的。Galanx\
  \ 和 Nah (2007) 发现，在仅限文本的空间中，欺骗者感受到的焦虑更大。然而，在基于头像的环境中，欺骗者感受到的焦虑没有显著差异。这些作者认为：\n\n\
  > 在仅限文本的环境中，匿名性可以保护欺骗者；而在支持头像的环境中，匿名性会增加欺骗者的焦虑。\n\n因此，使用头像可以增加欺骗者与接收者的距离，从而增加欺骗者的焦虑（p.\
  \ 778）。当然，一个人有很多理由参与基于身份的欺骗：有些可能是为了保护一个被污名化的身份（例如，残障人士，有些可能是为了保护一个被污名化的身份）。Bowker\
  \ 和 Tuffin (2003) 指出：\n\n> 在计算机中介的环境中，残障人士可以获得很多利益；此外，物理障碍被打破了。\n\n注意的是，并非所有在线空间都促进了欺骗——正如书中所述，网络空间不应被理解为这种空间。一个很好的例子是\
  \ Guillory 和 Hancock (2012)，他们研究了 LinkedIn 对欺骗的影响。这些作者关注 LinkedIn 是因为研究表明，在简历上撒谎是很常见的。例如，George、Marett\
  \ 和 Tilly (2004) 发现，人们在申请工作时会撒谎。这样做的一个明显动机是为了在潜在雇主面前显得胜任，从而增加就业机会。然而，Guillory 和\
  \ Hancock 推测，在 LinkedIn 上撒谎的可能性比传统简历低。\n\n在 Guillory 和 Hancock (2012) 的研究中，18 至\
  \ 22 岁的大学学生被随机分配到三种情况之一：编写传统的线下文档简历、编写私密的 LinkedIn 个人资料或编写公开的 LinkedIn 个人资料。然后他们被要求为一份高薪且设有跨国办事点的顾问职位创建简历，目标是让自己看起来是最合适的候选人，并被告知填写得最好的简历将获得\
  \ 100 美元。随后他们被告知研究的真实目的是检测欺骗，并被要求花费 15 分钟揭露并描述他们的欺骗行为。这些被编码为可验证信息（例如，职责、能力、技能）和不可验证信息（例如，兴趣、爱好）。正如预期，Guillory\
  \ 和 Hancock 发现，可验证的谎言倾向于出现在传统和私密的 LinkedIn 简历中，而公开的 LinkedIn 简历包含更多不可验证的谎言。虽然 Guillory\
  \ 和 Hancock 的工作产生了一些有趣的结果，但这项工作存在一些明显的局限性。使用大学学生提供了一个职业经历较短的填充样本。此外，考虑到参与者就读于大学且研究人员已知该大学，他们不太可能在大学课程和经历上撒谎。\n\
  \n### 11.2.2 网络孟亨森症\n\n网络孟亨森症是基于身份的欺骗的一个有趣的例子。Pulman 和 Taylor (2012) 的文献综述讨论了这样观点：互联网增加了孟亨森症的发生频率（这是一种心理疾病，人们在那里谎称自己病了或自我诱发疾病症状）。孟亨森症通常是慢性的，患有这种综合症的人成为习惯性撒谎者（Doherty\
  \ & Sheehan, 2010）。\nFeldman (2000) 首次创造了“网络孟亨森症”这一术语，用来描述个人在网上通过一系列戏剧性的近慢性疾病和康复来获取关注。\n\
  \n\n\n\nVan Gelder (1991) 报道的一个经典案例是“Alex”和“Joan”的故事。Alex 现实中是一位中年的美国精神科医生，他使用网名\
  \ `Shrink Inc.`（医生医生）加入了一个聊天室。由于他的原始 ID 是中性的，群里并没有意识到他是一个男性，许多人错误地认为 Alex 是一个女性。Alex\
  \ 发现，通过假装成女性，他能够与在线女性产生脆弱感和亲密感——这比他在线下职业中的感受要得多。他报告说自己对这种帮助人的新机会感到非常兴奋，并创造了一个名为“Talkin\
  \ Lady”的女性角色，这个角色最终告诉群友，她的真实名字叫 Joan Sue Greene，是一位二十多岁的神经心理学家。据称，Joan 曾和她的男友遭遇了一场车祸，男友去世了，而\
  \ Joan 本人瘫痪、面容毁损并丧失了说话能力。因此，面对面的交流在生理和情感上都是巨大的挑战。Joan 的形象经历了多次变化，从一个患有抑郁症和自杀念头的女性转变成一个拥有许多朋友的自信女性。与此同时，Alex\
  \ 能够通过其在线人格 Joan 的介绍，与聊天室的一些成员见面并发生线下关系。Alex 最终试图用一种绝症来终结 Joan 的生命。正是在此时，成员们发现了这个骗局——当他们打电话去医院送花时，发现医院并没有这个病人。当成员们发现\
  \ Joan/Alex 的真相时，意不意外，社区内引发了相当大的愤怒。这个案例研究为“网络慕豪森综合”（Munchausen by Internet）以及许多其他欺骗行为提供了一个很好的例子。它让我们对这些行为的动机有了见解，包括扮演身份的能力；扮演一个作为男性可能无法实现的关怀和共情角色；从群体成员那里获得同情和亲密的能力；以及在下与群体成员建立身体亲密关系的能力。\n\
  \nPulman 和 Taylor (2012) ，社会心理学提供了许多理论可以解释为什么会发生“网络慕豪森综合”。这些理论中的一些在本书早期已经过总结。例如，“去抑制效应”（参见第\
  \ 3 章）表明，由于许多空间是非异步的，网络慕豪森综合更容易在网上发生，这为个人在身份呈现上提供了创造性机会，而匿名性可以减少终端用户对他人意见的担忧。其他研究人员认为，某些网络慕豪森综合患者的动机可能是由于他们从网上欺骗他人时获得的单纯快乐。对于“网络慕豪森综合”是否被\
  \ DSM-5 正式承认可能是一些从业者关心的问题——或许他们更感兴趣的是更详细地理解其根源。\n\n### 11.2.3 基于消息的欺骗\n\n当通信双方的身份已知，且欺骗发生在通信内容中，就发生了基于消息的欺骗。在面对面或中介互动中，这种欺骗发生的频率高于基于身份的欺骗。例子可能包括：当你推迟了旅行计划时将迟到归于交通拥堵，或者当你其实不想参加某项活动时说生了。与基于身份的欺骗一样，基于消息的欺骗并不总是导致负面结果。DePaulo、Wetzel、Sternglanz\
  \ 和 Wilson (2003) 认为，在许多情况下，欺骗可以提高社会凝聚力并保护隐私。\n\n关于基于身份和基于消息的欺骗，欺骗者当然可以同时使用这两种形式。大众营销诈骗是使用这两种形式的一个好例子——欺骗者戴上一个与自己不同的身份，并使用基于消息的欺骗（例如，地理位置、请求金钱的原因）。大众营销诈骗和其他网络犯罪分别将在第\
  \ 12 章和第 13 章中讨论。\n\n## 11.3 我们在网上的谎言更多吗？\n\n人们真的在互联网上撒谎更多吗？Caspi 和 Gorsky (2005)\
  \ 发现，73% 的个人认为欺骗在网上非常普遍，一些研究也支持这一观点。虽然在网上撒谎的机会更多，且人们普遍认为在网络空间中撒谎得更多，但进行研究以确定这是否真的是如此很重要。早期研究表明，个人确实会在网上就自己的某些特定方面撒谎。例如，Cornwell\
  \ 和 Lundgren (2001) 发现，参与者对他们的在线浪漫伴侣关于年龄和身体特征撒谎的概率，比在面对面关系中更高。Whitty 和 Gavin (2001)\
  \ 发现了类似的结果，参与者认为，为了给他人提供在线与他们交流的机会而撒谎在社交上是可以接受的。他们认为这种谎言是“善意的谎言”，并无意伤害或恶意。此外，参与者认为这种欺骗在网上很常见。\n\
  \n在更最近的研究中，Naquin、Kutzberg 和 Belkin (2010) 发现，参与者通过电子邮件通信时比通过纸笔通信时更愿意撒谎，并觉得这样做更加合情合理。Zimbler\
  \ 和 Feldman (2011) 检查了通过电子邮件、即时通讯工具和面对面进行的 15 分钟会话中的欺骗，发现与面对面相比，数字媒体中的欺骗更为明显。尽管\
  \ Naquin 等人以及 Zimbler 和 Feldman 的研究为我们提供了一些有趣的发现，但鉴于这些研究是在实验室而非现实生活中进行的，这些研究仍然具有局限性。在现实生活中，个人可以选择媒介，并既与他们认识的人交流，也与陌生人交流。\n\
  \n更系统性的研究考察了人们在各种媒介上（包括面对面和电话）可能撒谎的可能性。此类研究还区分了网络上不同类型的媒体。例如，一个纯文本的空间与一个要求个人上传自己照片和视频的空间相比，可能提供更多的欺骗机会。该研究将在下文详细介绍。\n\
  \n### 11.3.1 预测欺骗的理论\n\n目前已有许多理论用于预测个人在何种类型的媒介上更容易撒谎。“社会距离理论”的支持者认为，因为撒谎会让个人感到不舒服，他们会选择更精简或丰富度较低的媒介，以保持与欺骗对象之间的社会距离；也就是说，他们会避免使用包含人们认为会泄露谎言线索的媒体（例如，声音、身体和语言）。此外，在精简媒介中，欺骗者对互动有更多控制权——任何意外的问题都可以经过思考，而不是立即回答。如果社会距离理论得到经验研究的支持，我们将发现人们在电子邮件中撒谎最多，其次是即时通讯、电话，最后是面对面。相反，“媒体丰富性理论”解释说，由于撒谎具有高度的模糊性，个人倾向于在更丰富的媒体中撒更多谎，这种媒体包括多个线索系统、即时反馈、自然语言和信息个性化。因此，该理论预测个人在面对面情况下会撒更多谎，其次是电话、即时通讯，最后是电子邮件。\n\
  \n\n\n\n\nHancock (2007; Hancock, Curry, Goorha & Woodworth, 2005; Hancock, Thom‐Santelli\
  \ & Ritchie, 2004) 及其同事提出了一种替代理论，他们称之为“基于特征的模型”。在测试了上述两种理论后，发现他们的研究并不支持这些理论，于是设计了这一理论。在原始研究中，他们通过一项为期七天的日记研究调查了\
  \ 28 名学生的谎言行为，参与者记录了所有的撒谎实例（Hancock et al., 2004）。参与者每天大约进行六次互动，平均每天撒谎 1.6 次（所有社交互动中有\
  \ 26% 包含谎言）。谎言最多发生在面对面互动中（n  202，每天 1.03 次），其次是电话（n = 66，每天 0.35 次）、即时消息（n = 27，每天\
  \ 0.18 次）和电子邮件（n = 9，每天 0.06 次）。在某种媒介中，谎言占比最高的是电话；占比最低的是电子邮件。有趣的是，人们对电子邮件的经验越丰富，他们就越可能通过该介质撒谎（这种关系在即时消息中并未被发现）。\n\
  \n为了解释他们的发现，Hancock 等人 (2004) 提出了基于特征的理论（列于下方的表 11.1）。该理论规定了我们在检查欺骗时需要考虑三个维度，包括媒介是否是同步的、是否不可记录以及是否是分布式的（即不在现场）。基于特征的理论认为，媒介越同步且分布，但可记录性越低，撒谎发生的频率就越高。人在同步互动中会撒更多谎，因为大多数谎言是自发的，因此同步通信提供了更多撒谎的机会。在有记录的通信中，人们意识到对话可能会被保留或存储（例如在保存的电子邮件中），并在未来的对话中被查阅；因此，如果意识到有谎言的证据可以日后查阅，就不太可能撒谎。在参与者并非分布式的媒体中，欺骗应该在某种程度上受到限制，因为某些谎言可能是立而易见的（例如，在非分布式媒介上，撒谎说自己正在写报告而实际上在玩电脑游戏可能是困难的）。\n\
  \n| | *面对面* | *电话* | *即时消息* | *电子邮件* | *SNS* | *短信* |\n| --- | --- | --- | --- |\
  \ --- | --- | --- |\n| *媒介特征* |  |  |  |  |  |  |\n| *同步性* | x | x | x |  |  | \
  \ |\n| *不可记录性* | x | x |  |  |  |  |\n| *分布性* |  | x | x | x | x | x |\n| *撒谎预测*\
  \ |  |  |  |  |  |  |\n| *基于特征* | 2 | 1 | 2 | 3 | 3 | 3 |\n\n**表 11.1**](#c11.xhtml_R_c11-tbl-0001)\
  \ *基于特征的模型：撒谎概率排名（改编自 Hancock et al., 2004）*\n\n自 Hancock 等人 (2004) 的研究以，发现，在考虑谎言的目标和所说的谎言类型时，基于特征的理论并不一定成立。例如，Whitty\
  \ 和 Carville (2008) 要求 150 名参与者在李克特量表上对他们在不同媒介上说不同类型谎言的概率进行评分。他们发现，个体总体倾向于对不熟悉的人撒利己性谎言。研究中识别出的一个利己性谎言示例如下：\n\
  \n> 你正在与一个“亲近”的人进行[面对面]交谈，他们邀请你参加一个活动。你可以想其他更想做的事情，所以你告诉他们你无法参加活动，尽管你其实可以去。(p. 1025)\n\
  \n这些研究人员认为，对撒谎者感到亲近的个体撒利己性谎言风险更大，也更难脱身——因为与我们关系亲近的人对我们的日常生活有更多信息。对于利己性谎言，个体表示他们更有可能在电子邮件中撒谎，其次是电话，最后是面对面。无论目标是亲近的人还是撒谎者不熟悉的人，情况都是如此。这一发现支持了社会距离理论。Whitty\
  \ 和 Carville (2008) 解释说，利己性谎言更容易让撒谎者感到不安和焦虑，因此电子邮件是说此类谎言的理想场所。在考虑他向型谎言时，本研究的参与者更有可能认为他们会对他们感到亲近的人说这些谎言。一个他向型谎言的例子是：\n\
  \n> 你收到一封来自不太认识的邮件。在邮件中，他们问你是否觉得他们看起来很有魅力。你不认为他们有，但你不想伤害他们的感受，所以你回邮件告诉他们他们很有魅力。(p.\
  \ 1025)\n\n他向型谎言通常是为了保护对方的感受。据此，Whitty 和 Carville 认为，为了保护对方的感受，人们可能觉得更有必要向亲近的人（而不是不亲近的人）撒谎，而不是说实话，因为实话可能会让他们感到不悦或痛苦。本研究的参与者认为，媒介的类型不会影响他们对亲近的人说他向型谎言的概率。也许这是因为这类谎言的目的是维护目标的完整性，而人们应该有动力为自己关心的人这样做。这类谎言不是为了伤害他人，而是为了让他人对自己的看法变好。一个人越关心他人，显然就越有动力说“善意谎言”。相比之下，涉及到对不熟悉的人说他向型谎言时，受访者声称他们不太可能在电子邮件中撒谎，而最可能面对面撒谎。同样，这并不支持基于特征的理论，反而是支持了社会距离理论。Whitty\
  \ 和 Carville (2008) 指出：\n\n> 认为在计算机中介通信（CMC）中人们更容易进行攻击性交谈……比起面对面，因为在线缺乏社会存在且上下文线索较少。这也许就是为什么目前的研究发现，个体更有可能在电子邮件中对不熟悉的人说出伤人的实话，而不是说他向型谎言。在这种情况下，社会距离促使了人们说出不悦真相。(p.\
  \ 1029)\n\n\n\n\n\nWhitty 等人 (2012) 试图通过扩大样本量、考察更多类型的媒体以及区分自发谎言和计划性谎言来复制 Hancock\
  \ 同事早期的工作。在他们的研究中，有 76 个人参与了一项日记研究，并关注了六种通信模式：面对面、电话、`SNSs`、即时消息、电子邮件和短信（`SMS`）。基于\
  \ Hancock 及其同事的发现，他们假设通过电话撒的谎言比通过面对面和即时消息的多，其次是 `SNS`、电子邮件和 `SMS`（见表 11.1）。他们的假设仅得到了部分支持：参与者更有可能在电话中撒谎，其次是面对面，而正如预测的那样，面对面和即时消息之间没有显著差异。然而，数据并不支持参与者在即时消息上撒的谎多于其他数字媒体的假设，但\
  \ `SMS` 除外——正如预测的那样，参与者在即时消息上撒的谎多于 `SMS`。这可以解释为：在预测欺骗时，媒体特征并不是我们唯一需要考虑的变量，和或者模型中可能需要考虑其他特征。研究人员增加了进一步的解释：即时消息可能应该被视为“近同步”而非“同步”的。\n\
  \n## 11.4 检测欺骗\n\n人们通常不擅长检测谎言——即使是那些受过检测谎言训练的人员，例如警察（Vrij, 2008）。因此，心理学家在互联网出现很久以前就开始对检测欺骗感兴趣，这并不令人意外。当然，在日常生活中检测欺骗很有趣，但有助于判断嫌疑人是有罪还是无罪也是很有用的。认知心理学家考虑过如何通过增加叙述中的认知负荷来提高口述的检测能力。例如，Vrij\
  \ 等人 (2008) 发现，当要求诚实者和谎者倒序报告他们的故事时，对欺骗的检测能力会提高。\n\n考虑到严重犯罪分子可能发展出更熟练的欺骗策略，他们所撒的谎言可能更难检测。事实上，研究发现犯罪分子在检测谎言方面的表现优于非犯罪分子。此外，同样的研究人员发现，94%\
  \ 的非犯罪分子认为撒谎比说实话需要更多的精神努力，而只有 60% 的犯罪分子报告了这一观点（Hartwig, Granhag, Stromwall & Anderson,\
  \ 2004）。鉴于检测潜在犯罪分子是否在欺骗的困难性，已有许多研究关注如何改进审问技巧以识破谎言者（例如，Dando, Bull, Ormerod & Sandham,\
  \ 2015）。其中一种策略是在询问某人时增加其认知负荷，以确定他们是否为欺骗者。英国的研究人员开发了一种他们称为“受控认知参与”（`CCE`）的安全筛选方法。安全人员可以应用这种方法来控制谈话，使乘客提供可以进行真伪测试的信息（Dando,\
  \ 2014; Ormerod & Dando, 2015）。根据 Ormerod 和 Dando (2015) 的说法，`CCE` “体现了实验室研究中提高欺骗检测率的六种技术中的每一个：证据的使用；预期知识测试；有效的提问风格；言语技巧的观察；非对称认知负荷；以及言语行为的变化”（第\
  \ 78 页）。这种访谈类型测试了预期知识，使诚实者体验到友好的、非正式的对话，而欺骗者的认知负荷则会增加，因为他们必须确保自己的回答保持一致且符合事实。研究人员发现这种方法在测试航空安全筛选欺骗的实验研究中非常成功。\n\
  \n在非犯罪分子群体中，检测欺骗被认为稍微容易，尽管仍然具有挑战。欺骗者倾向于表现出过度控制的行为，使用较少的“说明符”（如身体动作和手势）来意识地传递信息（Granhag\
  \ & Strömwall, 2002）。非犯罪的谎言者往往会有意识地降低语速（Vrij, 2008）。此外，由于欺骗可能会引发负罪感和恐惧，当个人撒谎时，他们通常会表现出增加压力信号，如紧张的微笑、言语犹豫和干扰以及坐立不安的增加（DePaulo\
  \ 等人, 2003; Vrij, Edwards & Bull, 2001）。虽然非语言线索在检测欺骗方面可能有用，但问题在于，在现实生活中人们在欺骗时并不总是被记录。我们在本章中已经了解到，人们在撒谎时往往会避免可记录的媒体。尽管如此，有些谎言是在可记录媒体上撒的，当人们尝试使用这些媒体进行欺骗时，会有可以检查的记录来帮助检测任何潜在的欺骗。\n\
  \n因此，互联网为检测欺骗开启了新机会——特别是在案件中，人们可以收集记录材料，用于在犯罪可能发生的时间范围内整理法医证据。计算机科学家和行为科学家在创新研究中结合知识和技能，检测在线环境中的欺骗。Rashid\
  \ 等人 (2013) 的研究可以检测隐藏在多重身份（或所谓的数字人格）后的犯罪分子。他们的工作通过检查词频以及关键语法类别和语义场，为作者建立一种“风格语言指纹”。应用这些方法，这些研究人员能够非常有把握地确定数字人格背后“真实”人的年龄和性别，这将有助于阐明某人是否创建一个与本人差异巨大的在线身份。这项工作可以帮助在线检测犯罪分子，例如儿童色情犯、浪漫诈骗犯和参与青少年激进的人员。\n\
  \n## 11.5 结论\n\n互联网为撒谎提供了新机会，同时也增加了身份-信息欺骗发生的概率（例如改变年龄、性别或身体描述）。然而，与直觉相反，研究人员发现人们在电话中撒谎的可能性比通过其他媒体（例如面对面、电子邮件）更高。基于特征的模型被开发用来解释个人为什么可能在电话中撒更多谎，但正如本章指出的，该模型还有发展空间，需要考虑谎言的复杂性（谎言的类型、欺骗对象等）。\n\
  \n\n\n\n\n正如本章讨论过的，并非所有撒谎的人都是出于伤害人的人的。尽管如此，有许多原因导致研究人员以及其他人（例如执法部门、安全部门、行业）可能想要了解人们在什么时候更容易撒谎，以及如何检测欺骗。虽然互联网为撒谎提供了新机会，但同时也为检测欺骗开启了新机会。本章阐明了通过跨学科研究团队合作开发更有效的欺骗检测方法的益处。此外，在考虑检测欺骗时，研究人员指出方法需要区分非犯罪分子与参与犯罪活动的个人，后者有更多理由撒谎，且在欺骗方面有更丰富的经验。犯罪分子参与的特定欺骗类型是学术界和非学术界特别感兴趣检测的。我们在第\
  \ 12 章中了其中一些，该章节探讨了网络诈骗、钓鱼和非法下载。\n\n### 讨论题\n\n1. **在所有情况下撒谎都应该被认为是不道德的吗？如果不是，什么时候撒谎是可以接受的？为什么？**\n\
  2. **你认为自己在什么情况下更容易通过撒谎逃脱？你认为为什么会这样？你的思维方式是否得到了欺骗理论模型任何一个的支持？**\n3. **你更有可能对亲近的人撒谎，还是对陌生人撒谎？你对亲近人和陌生人撒谎会使用不同的媒体吗？你认为为什么会这样？**\n\
  4. **考虑汉考克（Hancock）的特征模型。你认为在该模型中是否还有其他可以考虑的特征，以预测人们在什么时候更容易欺骗？**\n5. **除了本章总结的内容外，还可能采用哪些使用数字媒体检测欺骗的方法？你将如何测试你所提方法的有效性？**\n\
