  \ T. & Carr, A. N. (2006). *Cyberspace romance: The psychology of online relationships*.\
  \ Basingstoke, UK: Palgrave Macmillan.\n\n# 4\n\n在线约会\n\n在 第 3 章 中，我们学到越来越多的人在网上结识伴侣——特别是在在线约会网站上。我们在书中强调，在涉及互联网时，没有一种理论是适用于所有人的。相反，我们需要考虑各种在线空间、它们是如何构建的以及治理这些空间的规范。在本章中，你将了解到，在其他空间观察到的超人际关系并不适用于在约会网站上建立的关系。此外，人们在这些网站上寻找伴侣有各种策略，而且关系的进展阶段与在其他在线空间以及更传统的面对面环境中建立的关系不同。\n\
  \n## 4.1 什么是在线约会网站？\n\n在线约会网站于 20 世纪 80 年代开始出现，与我们现在熟悉的相比，其形式相当原始。正如 Whitty 和 Carr\
  \ (2006) 所解释的：\n\n```\nOnline dating sites started appearing in the 1980s and are\
  \ still increasing in popularity as an alternative or addition to offline dating.\
  \ Similar 报纸分类广告（但信息多得多），个人建立简介，描述自己并通常提供自己的照片，有时还有音频片段和视频。用户通常需要付费使用此服务，一旦他们确定了喜欢的简介的人，就会通过系统进行在线联系，以判断对方是否也感兴趣。从那里开始，个人通常会安排面对面。\n\
  ```\n(第 4 页)\n\n\n\n\n在早期，在线约会曾被视为污名，研究人员发现害羞的人倾向于通过这些网站寻找伴侣（Scharlott & Christ,\
  \ 1995）。在 20 世纪 80 年代，这些网站主要以文本为主，个人创建约会简介以期吸引他人的空间有限。目前，许多在线约会网站正尝试有效地匹配用户。这些约会网站正在不断完善改进工具，以将最合适的人匹配到一起。在线约会者通常被要求完成性格测试，以及关于他们的兴趣和对伴侣期望的调查。在此基础上，系统通常会给出兼容性评分。其他网站则允许客户自己寻找自己的匹配对象；在这些网站上，用户必须浏览大量的简介来做出选择。除了\
  \ `e‐Harmony`、`Parship` 和 `Match.com` 等通用在线约会网站外，还有更专业的在线约会网站，它们将志同道合的人聚集在一起。例如，有专门为基督徒、犹太人、素食者、哥特族、情绪分子、素食者和囚犯设计的网站。这类网站类似于人们加入的社交团体，希望能找到具有相同价值观或兴趣的人。\n\
  \n## 4.2 使用在线约会网站的动机\n\n为什么选择通过在线约会网站寻找伴侣呢？迄为止，研究报告了选择在线约会作为寻找匹配对象的社交和性格原因。例如，Brym\
  \ 和 Lenton (2001) 假设了多种原因，包括：\n\n*   鉴于职业和时间压力日益增大，人们正在寻找更高效的方式来与他人建立亲密关系；\n*  \
  \ 由于就业市场的需求，单身人士流动性更高，因此他们很难面对面进行约会；以及\n*   由于对性骚扰的敏感性增加，职场恋爱正在减少——因此，需要替代性的约会方法。\n\
  \nAlbright (2007) 认为，其吸引力在于能够增强浪漫投射的环境中有庞大的可用人群。Whitty 和 Carr (2006) 发现参与者为使用在线约会网站给许多理由，包括：\n\
  \n*   因为它是酒吧和夜俱乐部场所的替代方案；\n*   因为他们很害羞或保守；\n*   因为他们觉得没有其他选择；\n*   因为它很方便；以及\n*\
  \   因为它提供的隐私性。\n\n## 4.3 在线约会者的心理特征\n\n上一节给出使用在线约会网站的原因之一是个人可能会感到害羞或保守。然而，目前关于在线约会者性格组成的研究结果见奇不齐。在考虑关于在线约会者特征的现有研究时，我们需要注意到使用在线约会网站的人数已经剧增，因此我们可能预计在线约会者的心理特征发生了变化；因此，我们可能不再发现大多数在线约会者都是害羞的。\n\
  \nPoley 和 Luo (2012) 非常正确地指出，多年来，关于被在线约会吸引的人群类型存在两个竞争性假设：社交补偿假设（`SCH`）和富者愈富假设（`RGRH`）。`SCH`\
  \ 认为，约会焦虑或社交焦虑较高且社交能力较低的人（这类人通常在传统的面对面环境中建立关系方面会遇到困难）将使用在线约会来补偿他们在线下遇到的缺陷。相反，`RGRH`\
  \ 认为，社交焦虑低且社交能力高的人更有可能使用在线约会；鉴于这些人已经拥有了良好的社交和约会技能，他们应该能够将这些技能转移到互联网，并比能力较差的同类更有能力。\n\
  \n在在线约会的早期研究中，对 `SCH` 假设有强力支持。例如，McKenna 同事（2002；其工作描述请参见 `Chapter 3`）发现，社交焦虑的人更有可能在网上展示他们的“真实”自我，并与在互联网上遇到的人建立成功的浪漫关系。Whitty\
  \ 和 Buchanan (2009) 研究了更有可能参加快速约会和在线约会的人的特征，并观察了倾向于这些约会形式的人群。正如 `SCH` 所预测的那样，他们发现害羞得分高的人更有可能尝试过在线约会，并更有可能考虑未来使用。然而，在\
  \ Valkenburg 和 Peter (2007) 的研究中发现了相反的结果。他们发现约会焦虑低的荷兰人使用在线约会比约会焦虑高的人多。诚然，这些研究衡量的略有不同的构念：一个衡量害羞，而另一个衡量约会焦虑。最近，Poley\
  \ 和 Luo (2012) 发现，那些高度焦虑且缺乏社交技巧的人报告面对面约会的次数显著增加，并且更倾向于面对面约会。然而，他们没有发现 `RGRH` 的证据，因为社交能力和无能力的维度与实际及偏好的面对面和在线约会行为几乎关系不大。约会场是一个不断变化的竞技场，当我们考虑在被在线约会吸引的人群类型方面的结果差异，以及这些类型在未来发生变化的可能性时，我们需要记住这一点。\n\
  \n## 4.4 在线约会网站与个人广告的比较\n\n在线约会网站是否与其他匹配方法相比，还是它们是独特的工具？如果是独特的，则需要界定新理论来解释这些空间中的关系形成。\n\
  \n在 `Chapter 3` 中，我们概述了关于传统关系的理论，并考察了它们在解释在线关系方面的效用。我们了解到，虽然这些理论具有一定用，但在解释个人在网上开始和维持关系方面的某些差异时，新理论是必重要的。也许与在线约会和之前的介绍对象形式相比，最好的对比涉及报纸个人广告和视频约会。\n\
  \n心理学家一直对研究如何在报纸广告中展示自己感兴趣（这些广告现在仍然存在）。例如，Cameron、Oskamp 和 Sparks (1977) 对出现在《单身人士注册登记》上的\
  \ 347 份异性广告进行分析后发现，提供和请求的模式“让人想起异性股票市场”（第 27 页）。换句话说，自我被商品化了。个人更倾向于展示包含正面特征（例如，温暖、友好和诚实）的自我描述，而不是负面特征：85%\
  \ 的个人广告描述了吸引人的特征，只有 3% 的男性和 6% 的女性描述了负面品质。\n\n\n\n\n### 自我呈现与个人广告中的性别差异\n\n在这些个人广告中，发现男性女性在自我呈现以及追求的特质上存在明显的性别差异。例如，Cameron\
  \ 等人（1977）发现，女性比男性更强调人格特质。在他们的样本中，女性对外貌的重视程度（`67%`）也高于男性（`35%`）。相比之下，38%的男性与 12%的女性相比，写道潜在伙伴的外貌特征是理想的。男性提到职业的情况（`46%`）多于女性（`20%`）。相反，女性（`24%`）比男性（`3%`）更有可能指定理想的职业。在\
  \ Smith、Waldorf 和 Trembath（1990）对 514 份单身广告的分析中发现，男性对吸引力的追求频率最高（`57%`），而女性为`26%`。此外，三分之一的男性要求伴侣苗条，而女性仅占`2%`。Koestner\
  \ 和 Wheeler（1988）发现，男性写道他们具有表达性特质（例如，良好的沟通者），并寻求工具性特质（例如，喜欢户外活动）。相比之下，女性提供工具性特质并寻求表达性特质。\n\
  \nGonzales 和 Meyers（1993）在对个人广告的分析中发现，许多广告者将自己描述为“理想”的男性或女性。乍一看，这似乎显得有些过头；然而，对于男女来说，突出某些特质而非其他特质可以说是明智的策略。如果一个人想要吸引潜在伙伴，首先需要推销吸引人的产品，而不是可能看起来没有吸引力或平庸的产品。\n\
  \n### 视频约会\n\n进行视频约会的客户会收到其潜在约对象的文字信息和视频片段。视频约会服务通常会选择他们认为与其客户匹配程度良好的潜在伙伴。随后，客户会看到潜在对象的人口统计学信息、自我描述和照片，接着是一段视频访谈。客户随后决定对这些潜在对象中的哪一个感兴趣。然后，选中的个人会收到联系，以决定他们反是否有兴趣与这个人见面。\n\
  \n与以往关于吸引力的研究一样，视频约会显示，男性大多被长相漂亮的女性吸引，而女性则渴望具有高社会地位的男性（Green, Buchanan and Heuer,\
  \ 1984）。这同样是进化理论所预测的。相反，Riggio 和 Woll（1984）发现，受欢迎的男性视频约会者是那些外貌出众、演技好且富有表现力的人。受欢迎的女性则是那些外貌出众的人。交换理论可能更好地解释男性约会者，因为他们可能试图将他们所能提供的质量最大化。\n\
  \nWoll 和 Young（1989）对视频约会客户的关系和自我呈现目标、这些客户为实现目标而采用的策略，以及他们选择向他人展示的形象感兴趣。这些理论者认为，视频约会者希望通过展示真实的自我来成功吸引理想的伙伴。尽管这显然是明智的策略，但\
  \ Woll 和 Young（1989）指出，这些视频约会者对选择他们的人并不满意，认为他们的理想伙伴与对他们简介产生真实兴趣的人之间存在差异。\n\n###\
  \ 约会方法的比较\n\n在线约会、个人广告和视频约会在许多方面是相似的（见参见 Whitty, 2007b）。这些约会方法的一个明显共同点是，个人在任何见面之前都有时间塑造自己的自我呈现。这与更传统的约会形式非常不同，在传统形式中，个人通常是面对面交流，因此对话更具自发性（例如在酒吧、俱乐部或工作场所）。此外，通过这些每种媒合形式，约会者对印象形成的控制力都比面对面交流时要更多（Whitty,\
  \ 2007b）。也有一些值得注意的明显差异。在报纸广告中，联系广告者的人往往不是自己构建个人广告的人。另一个明显的区别是，视频约会者和在线约会者可以获得更多的视觉信息。研究人员专门检查了在线约会网站上的自我呈现，本章现在将转向这个问题。\n\
  \n## 4.5 在在线约会网站上展示自我\n\n与构建个人广告的人一样，在线约会者声称在构建吸引人的简介上付出了巨大努力（见 Ellison, Heino &\
  \ Gibbs, 2006; Whitty, 2008a, 2008b, 2008c; Whitty & Carr, 2006）。Whitty（2007b, 2008a）认为，与报纸广告一样，在线约会者受到驱动去将自己“商品化”——确保他们展示的是一种他人感到迫于“买单”的自我。这与前面提到的\
  \ Cameron 等人（1977）的主张相似，即报纸广告“联想到一个异性恋股票市场”（第 27 页）。Whitty（2008a）的一位参与者描述了这种“推销自己”的过程：\n\
  \n> 对我个人来说，另一件事是我很擅长为别人写贸易手册，但当涉及到关于自己并尝试推销自己时，情况完全是另一回事。我不知道这更多是男性特质还是女性特质。这取决于你想多努力地尝试推销自己，不是吗？（Wayne）（第\
  \ 1714 页）\n\n研究人员发现，在线约会者认为应该展示的特征包括他们的外貌、兴趣、活动、性格、幽默、职业、智力、独特性以及希望和梦想（见 Whitty\
  \ & Carr, 2006）。Whitty（2008a）发现，在线约会者倾向于展示许多积极特质，而不仅仅是几个。如果你回顾交换理论（见 `第 3 章`），你会注意到该理论假定在决定关系时，个人会寻求回报最大化。因此，列出尽可能多的积极特征似乎是一个明智的策略，以便让自己看起来比许多其他简介更像是一个高回报价值的选项。\n\
  \n\n\n\n\n在线约会者面临的一个挑战是判断个人资料包含的是真实还是误导性信息。1983 年，Austrom 和 Hanel（引自 Ahuvia & Adelman,\
  \ 1992）在研究中发现，个人广告中并没有完全的谎言，但有夸大和选择性事实陈述的证据。Whitty (2008a; Whitty & Carr, 2006)\
  \ 发现，当在线约会者在个人资料中歪曲自我时，他们将这些行为视为修饰；但当他人这样做时，他们往往会被认为不可信赖或缺乏自我认知；无论如何，如果一个人的表现与其个人资料不符，他们通常无法进入第二次约会。\n\
  \nToma 和 Hancock (2012) 检查了在线约会资料中的欺骗行为，发现欺骗性的资料仅能通过计算机语言分析才能检测出来。人类判断者发现，基于文字部分检测欺骗要困难得多，而是需要依赖与个人资料欺骗无关的语言线。不诚实程度越资料，其自我描述明显越短。这与研究同步环境中欺骗的研究形成对比，在同步环境中，发现撒谎者在对话中使用更多的词。情感相关的线索、第一人称单数代词和否定词在欺骗性资料中均清晰可见。与预期相反，负面情感词汇在欺骗性资料中出现的概率并不更高，Toma\
  \ 和 Hancock 认为这是因为异步环境允许人们在使用这些词汇时更具策略性。\n\n研究人员借鉴了 Goffman (1959/1997) 的理论来解释在线约会者在网络空间中的自我呈现（例如,\
  \ Ellison et al., 2006; Whitty, 2008a; Whitty & Carr, 2006）以及资料中显而易见的欺骗。Whitty (2008a)\
  \ 认为，在线约会网站提供的机会很少能见证 Goffman 所描述的那种“流露”出来的表达。她指出：\n\n> 当参与者怀疑地审视陈词滥调的资料时，“读字外之音”或寻找“流露”出的表达的方法变得显而易见。此外，在线约会者在面对面\
  \ [sic] 有时会检查约会对象是否与其个人资料相符。用 Goffman 的话说，他们能够看到“真实性格”与表演之间的匹配程度。当出现差异时，正如 Goffman\
  \ 所预言的那样，在线约会者……判读他们的约会对象是不道德的，认为对方有义务与其在个人资料中创造的印象相符。（p. 1720）\n\n## 4.7 完美匹配还是数字游戏？\n\
  \n正如本章所示，在线约会者在个人资料中呈现自我的方式上具有策略性；然而，他们在使用约会网站的方式上也具有策略性。Whitty (2008a, 2008b) 发现，那些在在线上提高期望高于线下期望的约会者，报告说对约会对象不满意，并且找到伴侣的成功可能较低。Whitty\
  \ 认为，许多在线约会者变得更加挑剔，尤其是当他们看到有如此多的选择时。正如之前描述的，大多数在线约会者只描述自己的优点，因此这些网站充斥着大量具有吸引力的潜在约会对象。交换理论再次可能帮助解释这些结果。正如上一章解释的，Thibaut\
  \ 和 Kelley (1959) 认为，个体根据对自己的关系与其他他人关系的比较，发展出对关系的期望。在线约会者可以进行更大规模的“假设性比较”。也许正在进行不切实际的比较，导致在线约会者对他们所吸引到的对象感到不满。\n\
  \n研究人员还观察到了由性别定义的策略（参见 Whitty, 2008a, 2008b; Whitty & Carr, 2006）。Whitty 研究中的许多女性报告说花费了大量时间构建个人资料并阅读他人的资料以寻找理想的匹配对象，而许多男性则在玩“数字游戏”；也就是说，他们联系许多个人，希望有人回应。一位男性在线约会者以以下方式描述了这种数字游戏策略。\n\
  \n> 那是一种“自助大餐”式的方法。我猜这回到我之前所说的，生活是一场数字游戏。如果你去跳舞会，那么乡村舞会就是一场数字游戏，其目的当然是为了让女孩们遇到 [sic]\
  \ 一个男生，但这是一件类似的事情（在线约会网站），只是没有音乐，从你所看到的，在采取行动之前，你就可以对个人进行了解和欣赏，这种方式在酒吧、俱乐部，甚至在舞会上是做不到的。所以，这种“散弹式”的方法是一种相当高级的方式。（Alan）（Whitty\
  \ & Carr, 2006, p. 138）\n\n在 Yang 和 Chiou (2010) 一项有趣的实验研究中，发现参与者并非都以最高效的方式使用在线约会网站上提供的搜索选项。作者将样本分为“最大化追求者”（即，通过详尽搜索寻找最佳方案的人）和“满足者”。他们发现，当最大化追求者因进行更多搜索而导致认知资源减少时，他们就不可能忽略无关信息，从而使他们关注那些与原始偏好不相干的属性。Yang\
  \ 和 Chiou (2010) 指出：\n\n> 从大量的考虑数据集中识别出最优变得越来越困难，迫使最大化追求者依赖外部而非内部标准来评估和选择结果。此外，在具有吸引力的选项之间进行权衡是避免的，这增加了在选择更有吸引力的选项时放弃另一个吸引力选项的遗憾感。（p.\
  \ 209）\n\n## 4.8 在线约会过程的阶段\n\n可以说，与在线约会网站上结识的人建立关系的阶段，与在其他网络空间或物理领域结识的人建立关系的阶段是不同的。Whitty\
  \ (2008c) 借鉴了 Givens (1978) 关于传统求偶模型的研究，设计了在线约会涉及的五个阶段。\n\n在 Givens 的五阶段模型中，这些阶段是：关注（女性通常通过展示非语言信号来试图吸引异性的注意力）；认可（由嘟嘴、整理打扮、眨眼/挑眉毛等组成的调情行为）；互动（发起对话，通常由男性发起）；性唤醒；最后是解决。其他学者也为正式媒合中涉及的阶段创建了模型，例如个人广告、视频约会和电脑媒合。例如，Ahuvia\
  \ 和 Adelman (1992) 设计了 `SMI`（搜索、匹配和互动）。他们将媒婆服务与基本的市场功能相类比。例如，在市场中，最初需要`搜索`；即获取交换至关重要的信息（在媒合中，这意味着搜索有关潜在对象的信息）。其次，需要`匹配`将兼容的交换伙伴带在一起（在媒合中，这意味着将两个看起来匹配良好的单身者聚在一起）。最后，`互动`是他们面对面的时候。\n\
  \n\n\n\n\n在 Whitty 的在线约会模型中，她认为在线约会确实包含了 Abuvia 和 Adelman 所强调的三个阶段；然而，这些阶段并不一定恰好地符合他们所提出的顺序顺序。例如，匹配（Matching）可能发生在两个点。首先，网站可能会根据一套特定的公式来“科学地”匹配个体并建议匹配对象，然后客户可能会浏览网站提供的选择，以决定他们认为谁是合适的匹配对象。或者，客户可能开始从海量的个人资料中搜索，直到找到合适的匹配对象。接下来，双方最初在网站上建立联系，表示对对方的兴趣，而对方必须给予这种兴趣的回应。从那里开始，两个潜在的伙伴开始互动，并决定是否希望进一步推进关系。Whitty\
  \ 的模型将在后续章节中阐述。\n\n### 4.8.1 第一阶段：注意力阶段（The attention phase）\n\n在注意力阶段，个人会试图通过在网上展示微妙的非语言信号来吸引异性。在在线约会中，人们并没有一个可以立即互动的目标。相反，个人通过选择一张吸引人的照片来代表自己，展示吸引力。通常情况下，不显示照片的资料会被忽略（Whitty\
  \ & Carr, 2006）。\n\n在这个注意力阶段，在线约会者吸引他人关注其资料的另一种独特方式是通过他们用来代表自己的名称（通常被称为“网名”）。一些人使用非常调情的名字（例如，`Imcute`\
  \ 或 `Bubbly`），而另一些人选择反映个人身份或兴趣的名字（例如，`Mountainclimber`）。还有人可能选择一个不调情的名字（例如，`Jt28`\
  \ 或 `Smith48`）。Whitty 和 Buchanan（2010）发现，某些网名被认为比其他名字更有吸引力，且男女都有动力与不同类型的网名的人建立联系。例如，发现男性比女性更容易受指示身体吸引力的网名（例如，`Hottie`\
  \ 或 `Greatbody`）的吸引并更有动力与其联系，而女性比男性更容易受展现智的网名（例如，`Wellread` 或 `Welleducated`）的吸引。总的来说，大多数人认为不调情的名字吸引力较小。\n\
  \n### 4.8.2 第二阶段：识别阶段（The recognition phase）\n\n与线下追求一样，在线约会的第二阶段需要更多的调情和一些认可。在线约会网站在构建网站时尝试模仿这一步骤。在线约会者通常不是立即向他们认为吸引人的网站成员发送电子邮件，而是被赋予了虚拟调情的选项；也就是说，许多网站提供了通过网站发送“表单式”备注的选项，这通常被称为“眨眼”（wink）或“亲吻”（kiss）。类似于线下调情，与一封介绍自己并要求对方同样自我披露的详细邮件相比，这种方式显得不那么侵入性，也更微妙。\n\
  \n### 4.8.3 第三阶段：互动阶段（The interaction phase）\n\n与线下相似，在线约会追求过程的下一阶段涉及互动。这当然发生在网上。它最初可能通过网站的电子邮件交换、网站的即时消息服务、个人电子邮件账户或站外即时消息程序进行。然后它可能会转移到电话（通常是手机手机）或\
  \ `SMS` 短信。与线下追求一样，这一阶段也可以是调情的。虽然没有传统的线下物理线索，但可以为这些非语言信号找到替代品。通常，这第三阶段相对较短。虽然在线约会者在互动期间会进行一些调情和自我披露，但这一阶段更多是关于验证信息和安排面对面会议（或双方中的一个或双方决定退出流程）。鉴于个人资料已经提供了关于该个人的简历，不需要再披露关于该人的额外信息。因此，在这一阶段，如果双方感到足够舒适，他们就会安排面对面约会。\n\
  \n### 4.8.4 第四阶段：面对面会议（The face-to-face meeting）\n\n第四阶段大致相当于 Givens 提到的第四阶段，被称为“性唤醒”阶段。对于在线约会者来说，第一次约会很大程度上决定了是否会有后续约会。这种会议不同于“传统的”第一次约会，在后者性吸引力已经建立，夫妻双方计划一起度过一个浪漫的夜晚。相反，这是一个双方测试物理化学反应并查看他们的约会对象与其个人资料相符程度的会议。出于安全考虑，会议通常在公共空间（例如，咖啡馆、酒吧）举行，并可能安排在限制的时间（以便如果互动不顺利，个人可以快速抽身）。有些人会制定应急预案，这样如果会议进展顺利，就会继续进行正式的约会（例如，晚餐）。由于担心个人不会符合其资料描述，一些精明的在线约会者会从观察点查看他们的约会对象，如果约会对象看起来并不完全符合个人的预期（例如，如果照片是几年前的，或者约会对象的体型与描述有些不同），那么这个人可能就不会进行约会（有时会礼貌地拨打对方手机并找一个不能面的理由）。\n\
  \n### 4.8.5 第五阶段：解决（Resolution）\n\n与 Givens 的五个追求阶段一样，解决是在线约会追求过程的最后阶段。第一次见面后，个人通常知道自己对约会对象是否有性吸引力，以及是否想了解更多。如果他们仍然不确定，可能会安排几次约会；然而，他们通常会在查看网站上其他选择的同时这样做。如果他们有信心继续发展，他们离开网站。\n\
  \n## 4.9 结论（CONCLUSIONS）\n\n自千禧初以来，在线约会从一种少数人使用的污名化活动变成了一种非常受欢迎的相亲工具，深受男女的喜爱。正如本章所示，很难对倾向于在线约会的人群类型进行分类，这可能是因为人员类型多年来发生了变化。它也将继续发生变化。约会软件（如\
  \ `Tinder`）正在改变一些人进行在线约会的方式；肉体约会可能仅仅是为了性行为，而不是为了建立有意义的关系。目前对在线约会的研究阐明，制作个人资料以及与网站上的其他人建立联系确实涉及某些技巧。人们很难从资料中察觉欺骗线索，尽管研究发现一些约会者在资料中美化了关于自己的真相。虚假陈述的后果通常是追求过程无法突破第一次约会。研究人员认为，在线约会者采用的一些策略将导致失败（例如，从海量数据集中最大化选择）。\n\
  \n### 讨论问题\n\n1.  **考虑戈夫曼（Goffman）的理论，以及如何将其应用于解释人们在在线约会网站上如何展示自己。**\n\n\n\n\n\n\
  ### 2. 你认为人们在网上约会网站上欺骗他人的方式与其他地方（面对面和在线）相比有什么不同？\n\n### 3. 你或你认识的人是否与在网上约会网站上遇到的人建立了恋爱关系？这段关系是如何进展的？它是否符合本章介绍的阶段理论？\n\
  \n### 4. 如果你要创建一个网上约会个人资料，你认为包含哪些方面是重要的？哪些理论最能解释你的选择？\n\n### 建议阅读\n\n1. Poley, M.\
  \ E. M. & Luo, S. (2012). 社交补偿还是富者愈富？社交能力在大学生利用互联网寻找伴侣中的作用。*Computers in Human Behavior*,\
  \ *28*, 414–419.\n2. Toma, C. L. & Hancock, J. T. (2012). 冰山之下的：网上约会资料中欺骗的语言痕迹。*Journal\
  \ of Communication*, *62*, 78–97.\n3. Valkenburg, P. M. & Peter, J. (2007). 谁在访问网上约会网站？探索网上约会者的某些特征。*CyberPsychology\
  \ & Behavior*, *10*(6), 849–852.\n4. Whitty, M. T. (2008). 揭示“真实的”我，寻找“实际的”你：互联网约会网站上的自我呈现。*Computers\
  \ in Human Behavior*, *24*, 1707–1723.\n5. Yang, M. L. & Chiou, W. B. (2010). 在线寻找最佳浪漫伴侣会降低决策质量：选择策略的调节作用。*Cyberpsychology,\
  \ Behavior, and Social Networking*, *13*(2), 207–210.\n\n# 5\n\n 线网络性活动\n\n人类会为几乎任何新媒体寻找性用途。互联网也不例外。在互联网出现之前，已经存在“波拉罗性爱”和当然还有视频。这些媒体都曾被用于制作商业和业余色情片。互联网的独特之处在于，它为更具互动性的性接触和探索提供了机会。这包括在网络空间发生的性活动，以及互联网所实现的在线性活动。心理学家们质疑参与在线性活动是否健康，一些学者认为某些人会对在线性爱成瘾。相比之下，其他人认为互联网为在潜在的安全环境中探索性爱提供了新途径。正如前几章指出的，互联网将继续为新的互动开启新机会，这同样适用于在线性爱和色情。例如，远程性交技术和虚拟现实极可能会继续发展，以创造新的性体验。本章考察了关于在线性活动心理学的文献，并思考了它们是解放性的还是削弱人类的。它是通过考虑一系列活动来实现的。尽管，尽管考虑网络恋童问题无疑至关重要，但将推迟到第\
  \ 14 章。\n\n## 5.1 网络性爱的起源\n\n自互联网诞生以来，人们就在互联网上进行性活动。尽管最初个人局限于文字交流，但许多人发现进行“色情聊天”并没有困难。卡罗尔·帕克（1997）的书《网络性爱的快乐》（*The\
  \ Joy of Cybersex*）很好地说明了这一点：\n\n```\nGersh\n我紧贴着你 …\n\ngeekgirl\n我揉着肚子，用手涂抹油\n\n\
  Gersh\n推着你 … 热 … 无法移开对你的目光 … 看着你弓起 …\n\ngeekgirl\n用一只手轻抚着你的大腿 … 另一只手揉着我的胸部，在你的注视下我的乳头变硬\
  \ … 唉\n\nGersh\n我的手向下滑进你的大腿间 … 只是碰了一下 …\n\ngeekgirl\n我的双腿微微分开 … 臀部缓慢移动\n\nGersh\n\
  这次更深了 … 我能感觉到你 … 湿润 … 温暖 … 嗯唔\n```\n\n学者们试图对在线上发生的各种类型的性活动进行分类。例如，“热聊”（Hot chat）被定义为“两个或更多个人参与了超出轻微调情的论述”（Whitty\
  \ & Carr, 2006, p. 21）。相比之下，“网络性爱”（cybersex）“通常被理解为网络空间中的同步通信，两个或更多个人在其中进行关于性幻幻想的论述”（Whitty\
  \ & Carr, 2006, p. 21）。\n\n正如第 3 章所示，公告板系统在互联网早期是一个特别受欢迎的空间，许多此类系统在本质上是性相关的。有些系统设计是为了让人们遇到与其有共同性兴趣的人，并使他们能够在在线和/或线下实现自己的性欲望。社会科学家研究了这些网站以及居住在其中的人（例如，Wysocki,\
  \ 1998; Wysocki & Thalken, 2007）。Wysocki (1998)对观察在线性爱是面对面关系的替代品还是增强了这种关系感兴趣。她通过对一个名为“快乐之池”（Pleasure\
  \ Pit）的公告板进行访谈来调查她的研究问题。在她的研究中，她确定了使用性显性公告板的五个主要原因，包括匿名性、个人生活中的时间限制、与他人分享性幻想的能力、参与在线性活动的愿望以及寻找志趣相似的人面对面见面的愿望。值得注意的是，Wysocki\
  \ 还发现，她访谈的许多人并没有向伴侣透露他们正在将互联网作为性发泄。\n\n## 5.2 三 A 引擎\n\n与前几章描述的类似，在互联网早期，学者们对于互联网是一个探索和了解性安全的健康空间，还是参与在线活动会导致问题行为存在分歧。阿尔·库珀（Al\
  \ Cooper）和他的同事详细探讨了网络空间所提供的问题和快乐——特别是在性方面。Cooper、Scherer 和 Marcus（2002）指出，“互联网同样可以威胁或帮助健康的、对性积极的、情感上满足的性生活”（p.\
  \ 210）。Cooper (1998) 开发了他将其命名为“三 A 引擎”（Triple A Engine）的理论，以解释互联网如何成为强有力的性活动媒介。他指出互联网（`access`）很容易，它是负担得起的（`affordable`），而且在网上可以是匿名（`anonymous`）的。考虑到互联网的这些特点，在线性活动随时可用，成本很低或免费，并且可以匿名使用，允许用户在人们不知道其“真实”身份的情况下安全地参与性活动。然而，这些理论学家认为互联网的诱惑力也可能导致问题行为。例如，Cooper、Delmonico\
  \ 和 Burg（2000）发现极少数人的在线性行为表现出明显的强迫性。他们还发现，在他们确定的网络性爱成瘾者群体中，女性和男同恋者的比例都高于异性恋男性。\n\
  \n\n\n\n\n网络性（Cybersex）自互联网早期就一直存在。本章早期 Gersh 与 geekgirl 之间的节选就是网络性的一个例子。本章早些对网络性给出了定义；然而，个人在网络空间中参与性话语的方式有很多。这可能是独自进行，也与他人一起——无论是在物理上还是虚拟现场。Shaughnessy、Byers\
  \ 和 Thornton (2011) 要求 292 名学生定义网络性。与之前的定义一致，他们的参与者将其定义为一种在线互动的性活动，且大多数人将其描述为实时发生的。其样本中\
  \ 36% 的人表示网络性是一种“描述性活动”——即涉及描述性活动、进行性行为和性动作的活动。25% 的人表示它涉及自我刺激，21% 的人表示涉及性兴奋。13%\
  \ 的人表示涉及视觉刺激——考虑到当时的参与者大多仅局限于文字交流，这是对网络性早期理解的一种进步。\n\n与网络性相关的问题包括网络性成瘾（本章后文将详述）和不忠（详情请参见第\
  \ 6 章）。然而，参与网络性是否有任何积极的一面？Whitty (2008d) 认为网络性可能是一种释放性的活动，特别是对于那些渴望探索性的人来说。Adams、Oye\
  \ 和 Parker (2003) 认为互联网为老年人提供了一个释放性的空间。他们指出：“毫无疑问，互联网上的性表达对老年人具有促进潜力。例如，当个体发现其他人有相似的追求时，他们可以对自己的性兴趣产生一种‘正常感’（p.\
  \ 413）。”在一项针对 MMORPG 玩家的研究中，Valkyrie (2011) 发现她访谈的参与者对网络性持有混合观点。有时它被认为是来自女性玩家的骚扰；另一些人认为这为他们的虚拟世界体验增加了另一个维度，正如“Beck”所解释的那样：\n\
  \n> 升级 Drg 真累。要花大量时间 LFP [找队友]，额的，我得想办法让自己娱乐起来。我认识另外一个 Drg。她聊天起来很有趣，我开始和她聊聊 Drg，以及这个那个那个。最后，它就演变成了网络性（笑）。所以，，实际上就是这样，持续了几个月。它很有趣，而且非常分心……它是网络性，完全取决于你的想象力有多么生动，以及如何同时与对方产生共鸣。（p.\
  \ 89）\n\n## 5.4 互动式性娱乐\n\n正如已经强调的，网络空间为一系列互动性活动提供了一个新空间。与过去一样，色情内容可以是业余创作，也可以是专业创作。然而，互联网为更具互动性的性娱乐提供了一个新空间。迄为止，尽管这些娱乐形式已经存在多年，但很少有研究关注互动性娱乐的任何潜在心理益处。一个例子是\
  \ `CU-SeeMe`，这是一种许多人用作互动性娱乐网站的视频会议软件。最近，我们看到了诸如 `Chatroulette` 这样的网站，陌生人被随机配对进行基于网页的对话。他们可以选择使用语音、摄像头和/或文本。在这个网站上，陌生人会一直聊天，直到有人决定转向下一个陌生人。Bilton\
  \ (2010) 在《纽约纽约时报》中描述了他使用该网站的经历：\n\n> 有一刻我正和妻子坐在客厅里，进入网站后，我们被引入一个光线昏暗的房间，一个男人告诉我们他在俄罗斯。几刻后，我们看到一个女人在土耳其的厨房里半裸地跳舞，然后我们震惊地盯着某处宿舍室的一群大笑大学生。鼠标每点击一下，我们就会进入一个陌生人的生活——然后又被带到另一个令人震惊的相遇中。\n\
  \n> 五分钟后，我们断开了连接并沉默地坐着，被我们看到的某些内容的粗俗感到困扰……[另一次，我们]点击 `Next`，看到阿姆斯特丹有三个赤裸的男人正随着 Rick\
  \ Astley 的音乐跳舞……然后一个男人告诉我们他在监狱里……这非常奇怪，不仅是因为你像跳降伞一样进入他人的生活（而他们也进入了你的生活），像一种受邀的闯入者。还有这种真实随机性带来的诡异快感——下一个会出现谁，或什么？（p.\
  \ 1）\n\n## 5.5 网络性成瘾\n\n研究人员花费了一些时间研究参与在线性行为的负面影响。网络性成瘾是一个受到研究人员关注的话题（例如，参见 Griffiths,\
  \ 2000a, 2000b, 2001）。对性活动的成瘾可以包括一系列活动，如网络性和观看色情内容。正如本章早期提到的，Cooper、Delmonico 和\
  \ Burg (2000) 发现一小部分个人的在线性行为具有明显的强迫性。他们还发现，在他们识别出的网络性强迫者群体中，女性和同恋男性的比例都高于异性恋男性。Daneback、Ross\
  \ 和 Månsson (2006) 发现在线性强迫者更有可能是处于关系中的男性、双性恋者以及患有性传播疾病。Schneider (2000) 认为网络性成瘾是导致分离和离婚的主要因素。此外，Schneider\
  \ 的研究发现，约一半（52%）的网络性用户对关系性性失去了兴趣。最近，Brand 等人 (2011) 在一项针对 89 名异性恋男性的研究中发现，从观看色情图片获得更大性兴奋的人在生活中面临更多问题。这些人也更容易对网络性成瘾。Corley\
  \ 和 Hook (2012) 在一项针对自认性成瘾者的女性的研究中发现，这些女性与非成瘾者相比，更有可能参与过度性网络行为。\n\n## 5.6 作为风险线下性会面推动者的互联网\n\
  \n网络空间不仅为性行为提供了新方式，还为在现实世界寻找参与性活动的人提供了新机会。随着 `Gay` 等网站以及 `Badoo`、`Grindr` 和 `Hornet`\
  \ 等应用程序的存在，网络空间成为性约会的热门场所这并不意外，尤其是男性之间的匿名性（Gass, Hoff, Stephenson & Sullivan, 2012）。Malu、Challenor、Theobald\
  \ 和 Barton (2004) 在对英国参与者的样本中发现，利用互联网寻找性伴侣在同性恋男性中更为普遍（47%），而异性恋男性（14%）和女性（7%）的比例较低。性工作者特别指出，互联网在增加商业性会面机会方面起了巨大的作用（Parsons,\
  \ Koken & Bimbi, 2004）。Liau、Millett 和 Marks (2006) 在一项针对同性恋男性的线下调查中发现，40% 的参与者通过互联网寻找性伴侣。\n\
  \n使用互联网寻找性伴侣的人数令人担忧，因为人们已发现在线寻找性伴侣与感染性传播疾病之间存在关联。例如，在线结识的男性之间的匿名性参与，与更多 HIV 相关的风险行为有关（Kakietek,\
  \ Sullivan & Heffelfinger, 2011; Klein, 2012）。Lee、Tam、Mak 和 Wong (2011) 在一项针对 77\
  \ 名中国 HIV 感染男性的研究中发现，其样本过半（58%）在感染年前通过互联网找到了伴侣。\n\n\n\n\n上述研究表明，仅仅通过互联网寻找伴侣会增加参与不安全性行为的风险。然而，学者们发现还有其他我们人类考虑的因素。例如，研究人员认为可能存在队列效应，与年轻一代相比，年龄较大的男性男性者（MSM）群体可能更有可能参与高风险的性行为（Kubicek,\
  \ Carpineto, McDavitt, Weiss & Kipke, 2011）。Garofalo, Herrick, Mustanski 和 Donenberg\
  \ (2007) 发现了支持这一观点的证据。在他们对 270 名年轻男性男性者的样本中，发现 68% 的样本对象使用过互联网寻找性伴侣。其中，48% 的人成功找到了伴侣，而约一半的这些人（53%）坚持使用避孕套。Coleman\
  \ 等人 (2010) 在对 2,716 名男性男性者的样本调查中发现，强迫性性行为得分较高的人更有可能进行无保护的无肛交。\n\n然而，并非所有研究人员都发现在线寻找性伴侣与参与不安全性行为之间存在直接关系。在一项针对男性性工作者的研究中，Parsons\
  \ 等人 (2004) 发现，一些男性伴游认为互联网让他们对客户提出的性要求拥有了更多控制权。此外，他们表示，这给了他们一个教育客户安全性实践的机会。他们访谈的一位男性伴游是这样说的：\n\
  \n> 当我更年轻的时候，我在一家伴游服务机构工作，我会和别人做性，我以前会做一些我不想做的事。我讨厌那样。那让我感到很糟糕，让我觉得自己像个妓子。所以，当我开始独立做这件事[在互联网上投放广告]，尽管我某种程度上确实是个妓子，但我说，我要安排好让我自己不像个妓子。所以我不做任何我不想做的事。任何我不想做的事……我不进行不安全的性。他们会说“你做无套吗？”，我说“不”。就这样，你懂的。这是他们想听的全部。但我不想撒谎，我试着给他们上一小课……我也三十六岁了。我的意思是，我在电话里说我三十二岁，但我其实三十六岁。我觉得这些年轻孩子，这些\
  \ 21 岁的孩子，没见过他们那一代人死于艾滋病。(p. 1030)\n\n## 5.7 互联网与性健康信息\n\n虽然关于通过互联网寻找伴侣的人性风险增加的证据相当充分，但硬币的另一面是互联网提供性健康信息方面的用途，这反过来可以预防性风险。Malu\
  \ 等人 (2004) 发现，使用互联网寻找性伴侣的人也可能通过互联网获取性健康信息。研究发现，互联网为男性男性者了解性健康和关系提供了一个独特的平台（Brown,\
  \ Maycock & Burns, 2005）。Kubicek 等人 (2011) 在对 526 名年轻男性的样本中发现，互联网不仅是这些年轻人寻找性伴侣的重要场所，也是他们获取性行为和健康信息的渠道。他们认为，互联网为许多年轻男性提供了一个学习健康信息以及分享他们故事的新空间（我们将在第\
  \ 15 章中详细探讨互联网在健康方面的使用）。样本中的许多男性在线下见面之前，会花时间先在线上了解潜在的性伴侣。作者得出结论，“希望启动在线干预计划的提供者应该意识到年轻人是如何使用互联网的以及目的是什么，以便最有效地触及他们的目标群体”(p.\
  \ 812)。其他人也发现互联网对于个人学习性健康信息（如艾滋预防）很有用（Mustanski, Lyons & Garcia, 2011）。Hooper, Rosser,\
  \ Horvath, Oakes 和 Danilenko (2008) 发现，他们样本中的大多数男性男性者通过互联网获取性健康信息（生理性健康比例为 86%，艾滋预防比例为\
  \ 69%）。\n\n研究人员发现，女性性工作者可以并愿意参加在线艾滋/STI 预防干预计划（Hong, Li, Fang, Lin & Zhang, 2011）。在对\
  \ 1,022 名女性性工作者的样本中，Hong 等人发现，样本中 40% 的人在线搜索过艾滋/STI 信息，约二分之的人愿意参加在线艾滋/STI 预防计划。\n\
  \n尽管互联网是提供性健康信息的合适空间，且研究发现一些个人愿意利用互联网学习更多性健康知识（这将在第 15 章中进行详细讨论），但并非所有这些信息都是可靠的。例如，在一项元分析中，Eysenbach,\
  \ Powell, Kuss 和 Sa (2022) 发现，在回顾的 79 项研究中，70%的研究认为在线大部分健康信息是不准确、过期或不完整的。Lindley,\
  \ Friendman 和 Struble (2012) 发现，并非所有女同恋者的性健康网站都涵盖了她们所需的所有信息。\n\n## 5.8 社会支持与性探索\n\
  \n互联网也可以为那些应对性取向的人提供支持。已有大量文献探讨了互联网可以为有性问题的人或希望了解性的人提供的支持类型。\n\n青少年时期是认同探索的时期，而认同领域之一就是性（Erikson,\
  \ 1964; Marcia, 1966）。正如将在第 7 章中详细讨论的，互联网为青少年探索性认同提供了新机会。Subrahmanyam, Smahel 和\
  \ Greenfield (2006) 检查了受监控和未监控的青少年聊天室的大量对话。在他们的研究中，发现 5% 的对话是关于性的。自称是女性的参与者产生了更多内含的性交流，而识别为男性的参与者则产生了更显性的性交流。Suzuki\
  \ 和 Calzo (2004) 发现性健康是公告板上的一个热门话题。他们认为，对于青少年来说，“公告板证明是一个提供个人观点、可操作建议、具体信息和情感支持的价值论坛，允许青少年坦诚地讨论性和人际关系等敏感话题”(p.\
  \ 685)。\n\n\n\n\n自互联网研究早期以来，研究人员就发现，互联网可能是个人（尤其是青少年）“出柜”的一个潜在的安全空间。McKenana 和 Bargh\
  \ (1998) 发现，所有年龄（15–62 岁，`M` = 34 岁）具有边缘化性倾向的个体在在线上表达自己的性倾向以及出柜让他们感到舒适。此外，他们在这些在线群组中获得的认可赋予了他们在线下向朋友和家人出柜的信心。Bond、Hefner\
  \ 和 Drogos (2009) 在一个包含 56 名自我认同为 LGB 的参与者的小样本中发现，大多数参与者报告说，在出柜过程中更多地使用媒体而非面对面交流作为获取信息的手段。这种情况在年轻参与者中比年长参与者更为常见。有趣的是，作者发现，在出柜过程中使用更多媒体的参与者，其向家人透露性倾向的开放程度较低。此外，研究未发现感到孤独或自尊心低与媒体使用之间存在某种关系。更最近，Mustanski\
  \ 等人 (2011) 在对 329 名年轻男性（18–24 岁）的调查中发现，参与者报告说互联网在出柜过程中提供了支持，并对那些收到恐同歧视信息的人提供了支持。\n\
  \n## 5.9 青少年的在线高风险性行为\n\n尽管网络空间可以为青少年探索其边缘化性倾向和出柜提供一个安全空间，但参与在线性行为所涉及的风险是不容忽视的。在\
  \ 2010 年代，一种被称为“色情短信”（sexting）的新行为给青少年带来了许多问题。色情短信是指使用手机或类似的电子设备分发性显性图像。青少年可能会将自己的这些照片发送给朋友或伴侣，结果发现图像随后被分发到了他们的社交网络中。此外，这些图像可能会被发送给恋童癖者。\n\
  \nLenhart (2009) 在美国发现，在 12–17 岁的拥有手机的青少年中，有 4%的人表示他们曾通过短信向他人发送过自己带有暗示性的裸体或近裸体图像。她还发现，15%的\
  \ 12–17 岁拥有手机的青少年表示，他们曾通过手机接收过他们认识的人的带有暗示性的裸体或近裸体图像。此外，年龄较大的青少年更有可能发送和接收这些图像：8%拥有手机的\
  \ 17 岁青少年曾通过短信发送过具有性挑逗性的图像，而 30%的人在手机上接收过裸体或近裸体图像。\n\nLenhart 还发现，自己支付手机费的青少年更有可能发送“色情短信”：17%支付所有手机相关费用的青少年曾通过短信发送过暗示性图像，而仅有\
  \ 3%未支付或仅支付了部分手机费的青少年发送过这些图像。此外，她主持的焦点小组显示，色情短信有三种主要场景：(1) 仅在两个浪漫伴侣之间的图像交换；(2) 伴侣之间的交换并与关系之外的人共享；以及(3)\
  \ 尚未建立关系但至少有一人希望建立关系的人之间的交换（我们将在第 14 章中再次讨论色情短信，及其与 18 岁以下裸露法律的关系）。\n\n青少年决定参与的在线高风险性行为类型，在一定程度上取决于同伴规范（Baumgartner,\
  \ Valkenburg & Peter, 2011）。Baumgartner 等人 (2011) 关注了四种在线性行为：在互联网上寻找可以谈论性爱的人；在互联网上寻找可以发生性关系的人；向仅在网上认识的人发送部分裸露的照片或视频；以及在网络上向仅在网上认识的人发送地址或电话号码。作者发现，描述性（descriptive）和指令性（injunctive）同伴规范均能预测青少年是否会参与在线高风险性行为。然而，研究发现描述性规范更为强大。研究人员得出，“在解释青少年的在线高风险性行为时，感知的同伴行为可能比青少年感知的同伴所认同的行为更重要”（第\
  \ 757 页）。尽管上述研究发现了同伴规范的影响，但有趣的是，同样的研究人员在先前的研究中发现，青少年在在线性风险方面的承担并不比成年人多（Baumgartner,\
  \ Valkenburg & Peter, 2010）。\n\n然而，接触在线显性材料可能会影响青少年的性爱 at 度。Peter 和 Valkenburg (2006)\
  \ 从其调查的荷兰参与者中发现，接触在线显性材料与更具娱乐性的性态度有关。然而，这种关系受到青少年性别的影响，并受到他们对在线材料真实性感知程度的调节。\n\n\
  ## 5.10 远程性交技术与网络空间的未来\n\n正如本书中所述，在线关系和性倾向在未来极有可能发生变化。网络空间将继续演变并吸引新用户。一个潜在的新进展是远程性交技术（teledildonics），它涉及物理世界（即使用性玩具）与网络空间的整合。在这些类型的互动中，通常由另一个人或一组人远程操控性玩具。目前，手机手机应用程序连接这些设备，包括\
  \ `KissPhone`、`LovePalz` 和 `VIVI vibrator`。一旦激活，所有设备都能提供一种旨在模拟身体感觉的感觉。例如，`KissPhone`\
  \ 被描述为：“KissPhone 设计用于远程接吻。它有一个你可以亲吻的嘴——随后会测量你嘴的压力、敲击速度、温度和吸力，并将这些参数传输到远程用户的 Kissphone\
  \ 上，在那里重现你的吻”（Halon, 2009）。这些设备未来将如何发展尚待观察，而使用这些设备的心理影响也尚未实现。\n\n## 5.11 结论\n\n\
  正如在线关系一样，即使在互联网仅作为文本媒介时代，人们也参与了在线性活动。正如本章所示，参与在线性活动既有积极面也有消极面。尽管目前的研究表明，在线寻找性伴侣的人参与线下性行为的风险更高，但未来可能并非如此。互联网可以用于促进安全性行为，并可以被构建为提供（尤其是年轻人）探索和学习性知识的安全空间。然而，在线性活动的阴暗面不容忽视。正如后续章节将深入讨论的，有些人对在线活动（包括网络性交）成瘾，有些人则通过性活动来背叛伴侣。\n\
  \n### 讨论问题\n\n1. AAA 模型对于解释人们参与在线性活动是否仍然适用？\n2. 你如何定义网络性交？\n3. 网络是参与在线性行为的积极还是消极空间？\n\
  4. 你认为参与在线互动色情游戏（如 Chatroulette）是健康还是不健康的行为？\n5. 根据理论和实证文献，对在线性行为成瘾意味着什么？\n\n\n\n\
  \n\n# 6. 你如何看待网络空间中的性未来？\n\n### 推荐阅读\n\n1. Baumgartner, S. E., Valkenburg, P. M.\
  \ & Peter, J. (2011). 描述性与指令性同伴规范对青少年风险性性行为的影响。*Cyberpsychology, Behavior, and Social\
  \ Networking*, *14*(12), 753–758。\n2. Brand, M., Laier, C., Pawlikowski, M., Schachtle,\
  \ U., Scholer, T. & Alstotter‐Gleich, C. (2011). 在网上观看色情图片：过度使用性网站时性唤醒评分和心理-精神精神症状的作用。*Cyberpsychology,\
  \ Behavior, and Social Networking*, *14*(6), 371–377。\n3. Cooper, A., Delmonico,\
  \ D. L. & Burg, R. (2000). 网络性使用者、滥用者和强迫症患者：新发现与启示。*Sexual Addiction & Compulsivity:\
  \ The Journal of Treatment and Prevention*, *7*, 5–29。\n4. McKenna, K. Y. A. & Bargh,\
  \ J. A. (1998). 网络时代的出柜：通过参与虚拟小组实现身份的“去边缘化”。*Journal of Personality and Social Psychology*,\
  \ *75*(3), 681–694。\n5. Parsons, J. T., Koken, J. A. & Bimbi, D. S. (2004). 男同性恋和双性恋男性伴游对互联网的使用：作为性教育者的性工作者。*AIDS\
  \ Care*, *16*(8), 1021–1035。\n6. Wysocki, D. K. (1998). 让你的手指为你说话：成人聊天线上的性。*Sexualities*,\
  \ *1*, 425–452。\n\n# 网络不轨\n\n> Ashley Madison（艾莉·麦迪逊）背后的公司是一家面向试图背叛配偶的人的流行在线约会服务。该公司周一表示，网站已被黑客入侵，黑客可能获取了该服务数百万成员的个人数据。\n\
  \n> 攻击背后的黑客组织名为“Impact Team”，他们声称偷取了 Ashley Madison 3700 万成员的信息。黑客表示，为了防止数据被泄露，公司需要完全关闭网站。\n\
  \n> 黑客承诺，如果 Ashley Madison 不满足这一要求，他们将发布成员的真实姓名、密码和财务交易记录。黑客已经在在线上泄露了一些信息，但那些数据似乎并不是他们所收集信息的大部分。(Grandoni,\
  \ 2015)\n\n上述摘自新闻文章的文字强调了互联网支持的背叛是一门大门生意。网络空间为背叛伴侣创造了新的机会，并在许多方面让实施外遇（无论在线还是线下）变得更加容易。对网络不轨（Internet\
  \ infidelity）的研究已经了可能被视为不忠的在线性活动类型，以及哪些活动可能给人们带来最大的困扰。本章质疑了是否所有的在线性行为（包括与虚拟化身进行网络性行为）都可能被视为背叛行为。我们还研究了其他形式的关系违背行为，例如情感背叛。通过社会进化理论和社会认知理论等视角，研究了男性和女性在理解不轨方面的差异。然而，正如读者将注意到的，研究人员需要更深入地理解在网络上可能发生的背叛，以便开发出涵盖物理和网络领域发生的关系违背的理论——特别是考虑到数字技术在许多人生活中具有重要性和频繁使用率。\n\
  \n## 6.1 定义网络不轨\n\n多年来，学者们一直在争网络不轨是否是一个真实的现象（例如，Cooper, 2002; Maheu & Subotnik,\
  \ 2001; Whitty, 2003b; Young, 1998）。如今，人们已达成共识，即人们可以在互联网上且确实在背叛他们的伴侣。然而，对于哪些行为可能被视为不忠，存在矛盾的观点。\n\
  \n网络不轨通过多种方式进行操作定义。Shaw (1997) 将网络不轨定义为“在行为上与其他类型的不忠不同；然而，当我们考虑它如何影响伴侣之间的关系方式时，其影响因素和结果是相似的”（第\
  \ 29 页）。Young, Griffin-Shelley, Cooper, O’Mara 和 Buchanan (2000) 提出了一个更具体的定义，他们认为网络外遇（cyberaffair）是“通过在线接触发起，并主要通过电子邮件以及在聊天室、互动游戏或新闻组等虚拟社区中的电子对话维持的浪漫和/或性关系”（第\
  \ 60 页）。相比之下，Maheu 和 Subotnik (2001) 对不轨提供了一个通用定义：“不轨发生在两个人拥有一项承诺而该承诺被打破时——无论发生在何地、如何发生或与谁发生。不轨是对一个真实人的承诺的违背，无论性刺激来自虚拟世界还是现实世界”（第\
  \ 101 页）。\n\n正如本书已强调的，互联网将继续演变，因此在任何网络不轨的定义中包含个人可能进行背叛的特定在线空间（例如电子邮件、社交网络）是困难的。此处给出的网络不轨定义如下：\n\
  \n> 当一个人通过与伴侣以外的至少一个人在情感或性方面表现得不当，而打破了关系规则时，就发生了网络不轨。不同夫妇的规则可能有所不同，但大多数关系都有一些基本的预期。互联网可能是不当情感或性互动发生的唯一、主要或部分空间。\n\
  \n## 6.2 不忠的在线性活动\n\n与线下不轨一样，被认为是不忠的行为类型被归类为情感的/或性的。然而，人们可以参与的一系列性活动并非所有活动都一定被认为是不忠的。\n\
  \n### 6.2.1 网络性行为 (Cybersex)\n\n第 5 章考虑了网络性并提供了一个定义，称网络性“通常被理解为网络空间中的同步通信，两个或多个个人在其中进行性幻想的交流”（Whitty\
  \ & Carr, 2006, 页）。指出对于网络性的内涵具有多种理解，但人们主要将其视为一种描述性的、互动性的活动，会导致性唤醒并可能包含视觉元素。以往的研究一致发现，网络性被视为一种不忠行为（Mileham,\
  \ 2007; Parker & Wampler, 2003; Whitty, 2003b, 2005）。这不仅局限于询问参与者如果发现伴侣正在从事此类活动是否会感到痛苦的研究。例如，Mileham\
  \ (2007) 采访了 76 名男性和 10 名女性，这些人是从雅虎的“已婚调情”和 MSN 的“已婚但调情”聊天室招募的。已婚人士活跃这些网站并进行网络调情和网络性行为，有时还会安排线下见面。她发现这些参与者中的有些人承认在线活动可能被视为是不忠。\n\
  \n### 6.2.2 其他在线性活动\n\n第 5 章概述了一系列在线性活动，但并非所有活动都被网络不轨的研究人员考虑过。除了网络性行为外，Parker 和\
  \ Wampler (2003) 识别了一系列参与者认为是不忠的其他在线性互动，包括在成人聊天室互动以及成为成人网站的会员。最近，Schneider, Weiss\
  \ 和 Samenow (2012) 识别了一系列个人认为是不忠的在线性活动，包括独自观看色情片、性聊天和观看色情片，以及性聊天后与聊天对象见面。这些网络活动可能可能通过电脑和/或智能手机进行。\n\
  \n\n\n\n\n### 6.2.3 色情片\n\n该研究调查的大多数参与者并不认为观看色情片是一种不忠行为（尽管个人在得知伴侣观看色情片时通常仍会感到心痛）。Parker\
  \ 和 Wampler (2003) 发现，访问成人聊天室但不进行互动，以及访问各种成人网站，也不被视为关系越轨。有人建议，观看色情片不太可能被理解为关系越轨，因为它是一种被动行为，通常不涉及与他人的互动。此外，这种行为没有现实可能导致与被观察的对象产生互动。\n\
  \n## 6.3 虚拟还是真实？\n\n既然在线性活动仅仅是`virtual`的，为什么大多数人仍认为它们是不忠行为呢？根据 Whitty (2003b, 2005,\
  \ 2011) 的说法，答案在于对更传统的关系越轨行为的研究。以往对不忠行为的研究发现，“心理排他性”与“性排他性”同样重要（Yarab & Allgeier,\
  \ 1998）。例如，Roscoe、Cavanaugh 和 Kennedy (1988) 发现，生本科生认为，与伴侣以外的人进行接吻、调情和抚摸等性互动理应被视为不忠。Yarab、Sensibaugh\
  \ 和 Allgeier (1998) 揭示了除了性交之外的一系列不忠性行为，包括热激情的接吻、性幻想、性吸引和调情。Yarab 和 Allgeier (1998)\
  \ 发现，在考虑性幻想时，性幻想对当前关系的威胁越大，该幻想被评定为不忠的可能性就越高。例如，大多数人认为，对伴侣的好友产生幻想比对电影星产生幻想具有更大的威胁，因此被认为更不不忠。\n\
  \n回到这个问题，实证研究表明，对他人的性欲望才是背叛行为。因此，这种性欲望的表达以及对欲望对象的幻想都可能让伴侣感到心痛。但这种欲望需要被看作可能是相互的且是可以实现的。因此，如果一个人对布拉德·皮特（Brad\
  \ Pitt）或一个男应郎产生性幻想，其伴侣的担心程度远低于幻想与好朋友或在网上与其进行性爱的陌生人发生关系。\n\n## 6.4 情感不忠\n\n对线下不忠的研究已经确定，并非所有不忠都是性的——它也可以是情感的。情感不忠被理解为爱上伴侣以外的另一个个人，或与伴侣以外的受吸引的人分享关于自己的亲密和/或秘密细节。研究发现，无论情感不忠发生在线上还是线下，都同样令人心心。结合第\
  \ 3 章中关于在线关系的总结研究，这一发现是合理的——对于某些人来说，这种关系被认为与线下关系一样亲密且在情感上令人满足。下面的摘说明了情感不忠，摘自一项研究，该研究要求参与者在关于网络不忠的提示后完成一个故事（Whitty,\
  \ 2005）：\n\n> “这是出轨，”她相当平静地说道。\n\n> “不，我没有出轨。我又不是在和她发生关系。你才是我在一起的人，而且正如我所说，我完全`NO`打算去见她。”他跳上床。\n\
  \n> “这是‘情感’上的出轨，”她不耐烦地说道。\n\n> “怎么说？”他问道，眼中闪过一丝笑意。\n\n> “出轨并不一定是身体上的。那只是其中方面……”他拉过被子盖住自己翻了个身。“好吧……我知道你`还没`见过她，所以才这样，但我还是有点不爽，马克（Mark）。”她坐在床边。\n\
  \n> “别生气。你是我爱的人。所以这`怎么`是情感出轨呢？”他坐了起来。\n\n> “你在对我隐瞒事情。关系是关于信任的！如果你一直关于那个‘网女孩’的事对我隐瞒，我怎么能信任你？”（第\
  \ 62–63 页）\n\n## 6.5 性别差异：哪种更糟——性还是爱？\n\n总的来说，男性和女性在经历传统形式的不忠时，嫉妒或心痛的程度或频率似乎没有区别（Buss,\
  \ 2000）。尽管如此，一些研究人员发现，男女在“对触发嫉妒的线索的权重分配”上存在差异（Buss, 2000, p. 46）。正如 Buss (2000)\
  \ 所解释的：“预测男性会对性不忠的线索给予更多权重，而预测女性会对长期投入转移的线索给予更多权重，例如与他人的情感投入”（p. 46）。他通过进化的视角解释了这一点。根据这一理论，通过自然选择，人类继承了某些特征和情感反应。Buss\
  \ 等研究人员认为，祖先男性面临着绿妻带来的严重威胁——即对伴侣子女的父身份不确定。因此，男性比女性对性不忠做出更强烈的嫉妒反应。另一方面，祖先女性面临着不忠的男性伴侣可能将其资源转移给另一个女性及其子女的风险。因此，女性对情感不忠产生了先天的嫉妒（假设是男性会将资源投入到与其在一起的‘另一个女人’身上）。\n\
  \n对线下不忠的研究发现，当被迫选择性不忠还是情感不忠最令人心痛时，女性比男性更认为情感行为更令人心痛（Shackelford & Buss, 1996）。在参与者不被强制做出决定时，一些人发现了这一结果。例如，Roscoe\
  \ 等人 (1988) 要求参与者列出他们认为哪些行为属于关系越轨。在这项研究中，男性更有可能认为与不同的伴侣发生性关系是不忠的典范。相比之下，女性更有可能认为与他人相处和对伴侣隐瞒秘密是不忠行为。然而，值得注意的是，男女都认为跨性行为比跨性情感行为更不可接受，且是更大的背叛（Shackelford\
  \ & Buss, 1996）。\n\n并非所有理论家都同意关于不忠的进化解释。例如，DeSteno、Bartlett、Braverman 和 Salovey\
  \ (2002) 认为，Buss 及其同事测试其主张的方法论是不可靠的。其中之一原因是，当采用不同的方法论测试这一假设时，并不总能得到相同的结论。\n\n\n\n\
  \n\n目前已经产生了一些替代理论来解释背叛导致的嫉妒和不悦。一些理论者认为，现有的性别差异并不一定反映先天的模块。相反，这些差异可以通过社会认知方法或发展理论得到更好的解释（例如：DeSteno\
  \ & Salovey, 1996; Harris, 2004; Harris & Christenfeld, 1996）。这些理论的支持者认为，理解男性和女性如何解读伴侣的不忠行为至关重要。这被称为“**双重打击假设**”（DeSteno\
  \ & Salovey, 1996）或“**二合一假设**”（Harris & Christenfeld, 1996），这两种假设本质上都认为男性在想到女性伴侣与其他男性发生性关系时会感到双倍的痛苦，因为男性伴侣认为这极可能意味着她爱上了那个男人。因此，性不忠意味着情感上的不忠。相比之下，女性认为男性可以发生性关系而不产生爱，因此不认为性不忠意味着情感上的不忠。相反，如果女性认为自己的男性伴侣爱上了另一个女性，她们会受到双重打击。这是因为她们认为情感不忠意味着性不忠。然而，男性并不假设他们的女性伴侣正在与另一个她爱的男性发生性关系。因此，他不会因为这种想法产生任何额外的痛苦。\n\
  \n为了测试他们的主张，Harris 和 Christenfeld (1996) 要求受访者回想他们过的一段严肃浪漫关系，并想象这段伴侣曾与其他人发生性关系。在五点利克特量表上，参与者必须对伴侣爱上那个刚刚发生性关系的人的可能性进行评分。此外，他们被要求再次回想一段他们过的严肃浪漫关系，并想象伴侣爱上了另一个人。在五点利克特量表上，参与者必须对伴侣与其爱的人发生性关系的可能性进行评分。正如预测的那样，他们发现男性更倾向于说伴侣爱上了与其发生性关系的人，而女性更倾向于说伴侣正与他们爱的人发生性关系。\n\
  \n### 6.5.1 互联网上的性别差异\n\n关于网络不忠的性别差异结果不一，不像对传统不忠的研究那样明确。与以往对线下不忠的研究一致，Whitty (2005)\
  \ 在一项故事写作任务中发现，女性比男性更多在他们的网络不忠故事中提到情感背叛。此外，与以往对线下背叛的研究一致（例如：Amato & Previti, 2003;\
  \ Paul & Galloway, 1994），她发现女性比男性更有可能写道如果他们发现伴侣在互联网上出轨，他们将结束这段关系。此外，Whitty (2005)\
  \ 研究中的女性比男性更可能谈论不忠导致的时间以及与关系的疏远感。\n\n有趣的是，当被要求对场景进行评分时，发现的任何性别差异都与传统不忠理论所预测的方向相反。Parker\
  \ 和 Wampler (2003) 考虑了在线性活动的研究，发现女性比男性更严肃地看待这些活动。Whitty (2003b) 的研究发现，女性比男性更可能相信性行为是一种背叛行为。Whitty\
  \ 和 Quigly (2008) 考虑了“双重打击假设”或“二合一假设”是否适用于对网络不忠的态度。他们的研究没有发现任何性别差异，也没有发现发现对这些假设的支持。此外，他们发现，参与者认为网络性爱意味着爱或在线恋爱意味着网络性爱的可能性，远低于他们认为性交意味着爱或爱意味着性交的可能性。他们认为这可能是由于由于几个原因。首先，鉴于以往的研究发现大多数人没有参与过在线性活动，因此将爱与网络性爱联系起来并不容易。其次，鉴于网络性爱在性质上与性交不同，尽管个体可能仍将其视为一种关系违背，但他们并不像对待线下关系违背那样必然将其与爱联系起来。\n\
  \n## 6.6 在线与线下外轨的质性差异\n\n关于在线和线下外轨之间差异的研究仍然匮乏。然而，根据我们对在线关系的了解，我们可以理论化出两点差异。首先，由于我们知道“**超个人**”关系可以在网上形成，在线关系可能比线下关系更具诱惑力。其次，由于虚拟世界在理论上很容易从人们的日常生活中“分离”出来，在线外轨在心理上可能更容易发生。\n\
  \n### 6.6.1 理想化在线关系\n\n`Chapter 3` 指出，在网上建立的关系有时是“超个人的”（Walther, 1996, 2007; Walther,\
  \ Slovacek & Tidwell, 2001）。鉴于计算机媒介交流（CMC）期间可以实现的超亲密性，存在一种风险，即这些关系在在线时，可能看起来更有吸引力和诱惑，从而导致理想化。由于\
  \ CMC 的某些特征，个体可以在自我呈现中采取策略性，创造出一个比他们在其他空间中通常被感知的形象更讨人的人。人们对这个精心塑造的、讨人的自我所收到的反应，可能比对日常生活中平庸自我所收到的反应更有吸引力。此外，如果沟通的对象也采用同样的策略，他们看起来可能也比人们日常生活中认识的人更讨人。因此，有人认为这种在线联结的诱人吸引力很容易导致在线外轨（Whitty,\
  \ 2010; Whitty & Carr, 2005）。\n\n### 6.6.2 客体关系：分裂\n\n\n\n\n梅兰妮·克莱因（Melanie Klein）关于“分裂”的研究对于解释在线关系的吸引力同样有用（Whitty\
  \ & Carr, 2005, 2006）。她认为分裂是防御焦虑的最原始或最基本的防御机制之一。根据克莱因（1986）的观点，自我通过分裂并剥离自身的一部分，防止对象的坏部分污染对象的良好部分。婴儿在与母亲乳房的关系中，将乳房视为好客体也是坏客体。乳房既带来满足也带来挫败，婴儿会同时将爱和恨投射其上。一方面，婴儿理想化这个好客体；另一方面，坏客体被认为是恐怖的、令人挫败的，是一个威胁摧毁婴儿和好客体的迫害者。婴儿投射爱并理想化好客体，但并仅仅于这种投射，还试图诱导母亲对坏客体产生情感，而母亲必须为此承担责任（即投射性认同的过程）。克莱因将这一发展阶段称为“偏执性分裂样位”。作为针对这种发育不成熟自我的另一种防御机制，婴儿可能会试图否认迫害对象的现实。虽然我们在正常发育过程中会经历这一阶段，但这种针对焦虑的原始防御是一种退行反应，在某种“永远可用”的意义上，它永远不会被超越。发育后的超自我中的好客体代表了想象中的自我理想，因此代表了“回到自恋的可能性”（Schwartz,\
  \ 1990, p. 18）。\n\n与克莱因的对象关系理论一致，将与发生在线婚外情的个人视为好客体可能是有帮助的。鉴于网络空间中发生的互动通常被看作与外部世界分离（Whitty\
  \ & Carr, 2006），将在线婚外情从个体的其他世界中分裂出来可能更容易。在线关系可能满足一种不受束缚的、无能的幻想，而这种幻想在现实中是企及的。因此，在线婚外情可能导致自恋性的撤退。\n\
  \n有人认为，线外不轨的发生是因为关系中存在问题，或者由于某些性格特征（见 Fitness, 2001）。Buss 和 Shackelford（1997）确定了人们背叛伴侣的一些关键原因，包括抱怨伴侣将他人性化、表现出高水平的嫉妒和占有欲、态度傲慢、拒绝性行为或滥用酒精。这些也许是个体发起在线婚外情的相同动机。然而，借鉴克莱因的理论，有人认为在线婚外情可能比线外婚外情更容易维持——在线关系可以通过分裂过程变得理想化，同时否认与其婚外情的对象的坏面，以及同时否定自身的坏面。当一个人可以更容易地过滤掉关系中潜在的负面方面（坏客体）时，在线上理想化一个个人（好客体）可能更容易。关系可以随心所欲地开启或关闭，沟通内容在某种程度上更容易控制。此外，互联网确实提供了一个环境，更容易构建更积极的自我形象并避免展示自我的负面方面。相比之下，在线外婚外情中沉溺于完美的幻想并不那么容易，因为你仍然必须与真实的人打交道。鉴于这些关系在心理上与线外婚外情不同的本质，本章随后认为治疗需要考虑这些差异；然而，在考虑治疗方法之前，准确界定什么是“网络不轨”是重要的。\n\
  \n## 6.7 与虚拟形象的虚拟婚外情\n\n本章检查了在线上可能许多类型的关系违背行为。我们关注了研究在线真实真人之间发生的违背行为的研究。然而，在游戏或虚拟世界中使用虚拟形象（avatar）进行在线性行为又是怎样的？夫妻双方会认为这种行为是一种背叛行为吗？尽管为了回答这个问题进行的研究很少，但轶事证据可能在某种程度上帮助开始思考使用虚拟形象的虚拟婚外情是否属于一种“真实”的关系违背行为。\n\
  \nMorris（2008）报道了一个英国夫妇的故事，他们离婚是因为丈夫的替身在*《第二人生*》（*Second Life*）中与另一个女性热聊。“*第二人生*”是一款大型多人在线角色扮演游戏（MMORPG），个体在其中创建自己的虚拟形象（人格）并在幻想世界中互动。Morris\
  \ 写道，这对夫妇最初在网上相识，此后他们的虚拟形象在《第二人生》中变成了伴侣——直到艾米·泰勒（Amy Taylor，《第二人生》中名为 Laura Skye）发现她的丈夫大卫·波拉德（David\
  \ Pollard，《第二人生》中名为 Dave Barmy）在《第二人生》中与一名妓女进行网络性。正如 Morris 所报道的：\n\n> 泰勒感到震惊，结束了\
  \ Skye 和 Barmy 之间的在线关系，但在现实生活中留在波拉德身边。\n\n> 此时，事实与虚构真正开始碰撞。泰勒决定通过转向一个名为 Markie Macdonald\
  \ 的虚拟女性私侦探来测试 Dave Barmy——以及波拉德的忠诚度。他们设置了一个“蜜罐陷阱”，一个迷人的虚拟形象调戏了 Barmy。他非常出色地通过了测试，整晚都在谈论\
  \ Laura Skye。Barmy 和 Skye 在网络空间重复合，在一个在美丽的热带树林举行的仪式上结婚。在现实生活中，在康沃尔郡的公寓里，泰勒看着仪式流下了泪；2005\
  \ 年——再次回到现实——这对夫妇在环境不那么体面的圣奥斯泰尔（St. Austell）登记处结婚了。但泰勒察觉到了不对，最终发现 Dave Barmy 正与一个不是\
  \ Laura Skye 的女性亲密地聊天。她发现这比他之前的约会更让她感到不安，因为其中似乎有真的情的情，而且在现实生活中——她申请了离婚。\n\n尽管涉及到虚拟形象，但在这种情境下，背后仍有真实的人在互动。此外，正如本章早期强调的，情感上的背叛与性背叛同样令人痛苦。这可能解释了泰勒的情绪波动。然而，尽管泰勒在这种情境中显然认为她的丈夫背叛了她，我们仍然需要考虑大多数人是否会同样的视角看待问题。在她的案例中，他们在幻想世界（被认为是游戏）中共同度过了激烈的生活。也许泰勒很难区分游戏与现实。\n\
  \n\n\n\n\n关于网络出轨，我们仍有很多需要学习的。我们还需要关注互联网不断变化的本质。Web 2.0 带来了更具互动性的互联网（利用应用程序增加互动性），而且它将继续以日益复杂的方式发展。今天，个人经常将数字技术用于社交目的，这可能导致很大比例的关系违背行为是在线发起和/或进行的。在互联网更具娱乐性的区域发展出的浪漫和/或性关系是否可以被解释为关系违背，这一问题尚有待妥善研究。由于数字技术的影响，婚外情可能很容易发起和维持，这些技术在大多数形式的不忠中无疑发挥了重要作用。如果伴侣希望继续他们的关系，他们如何处理此类婚外情也需要进一步的研究。\n\
  \n### 讨论问题\n\n1. 为什么你认为个人通常认为网络性行为和性交一样是同一种背叛？\n2. 为什么你认为个人认为，发现伴侣看过色情片并不像发现他们在网上与陌生人进行网络性那样令人沮丧？\n\
  3. 你认为社会进化论理论在解释网络出轨方面有多用？\n4. 考虑将克莱因的分裂理论应用于解释在线婚外情。这是一种解释虚拟婚外情的有用理论吗？\n5. 你认为在游戏中与虚拟形象发生婚外情是一种关系违背吗？请结合心理学理论解释你的答案。\n\
  6. 你如何展望网络空间不忠行为的未来？\n\n### 建议阅读\n\n1. DeSteno, D. & Salovey, P. (1996). 嫉妒性别差异的进化起源？对该模型“适应性”的质疑。*Psychological\
  \ Science*, *7*, 367–371.\n2. Gilbert, R. L., Murphy, N. A. & Avalos, C. (2011).\
  \ 现实主义、理想化和 3D 虚拟关系的潜在影响。*Computers in Human Behavior*, *27*(5), 2039–2046.\n3.\
  \ Hertlein, K. M. & Piercy, F. P. (2008). 治疗师对网络出轨案例的评估与治疗。*Journal of Marital and\
  \ Family Therapy*, *34*(4), 481–497.\n4. Roscoe, B., Cavanaugh, L. & Kennedy, D.\
