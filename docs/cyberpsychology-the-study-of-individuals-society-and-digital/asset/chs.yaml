  \ Security & Privacy*, *13*(4), 84–87.\n\n# 13 网络犯罪：网络骚扰、仇恨犯罪与网络战争\n\n第 12 章关注的是与财务相关的网络犯罪。本章侧重于针对个人、组织以及更广泛的社会的犯罪。此类犯罪——包括网络骚扰和网络攻击——通常由仇恨驱动。英国及许多其他国家已经制定了新法律来打击这些犯罪，但受害者所经历的心理伤害最近才得到更好的理解。这些犯罪的受害者可能会遭受极其有害的影响。此外，对于某些人来说，害怕成为这些犯罪的受害者可能会导致他们丧失行动。尽管这些犯罪可以在物理世界中发生且往往会发生，但本章主要关注它们在网络上的对应形式。此外，我们将涉及有关利用监控作为检测和预防这些犯罪方法的争议。\n\
  \n## 13.1 网络骚扰与跟踪\n\n> 当纽瓦克的眼科医生马图维维（David Matusiewicz）和前妻子贝尔福（Christine Belford）在\
  \ 2006 年生下三个孩子后离婚时，他们的监护纠纷看起来相当典型。\n\n> 今天，他们的故事充满了指控与反指控、谎言、绑架、监视、被黑掉的 Facebook\
  \ 账号、社交媒体上的毒性帖子，以及贝尔福和她的朋友 Laura“贝丝”穆福德（Laura ‘Beth’ Mulford）的惨杀——两人在 2013 年进入纽卡斯尔县法院大厅参加抚养费听证会时，被大卫的父亲托马斯·马图维维（Thomas\
  \ Matusiewicz）开枪杀死。\n\n> 大卫·马图维维、他的妹妹艾米·冈萨雷（Amy Gonzalez）和他的母亲莉诺尔·马图维维（Lenore Matusiewicz）是美国首批因导致死亡的网络跟踪指控的被告——这种犯罪如果被陪审团认为与贝尔福的死亡有关，可能会导致终身监禁\
  \ Reyes & Spencer, 2015）。\n\n骚扰通常是一个法律意义上的术语，指被认为具有威胁性或干扰性的行为。在工作场所进行不违背且持续的性追求是性骚扰的一个例子。电子通信可以用于以物理骚扰类似或新颖的方式进行骚扰。网络骚扰可能发生由于感情关系破裂的结果，或源于不违愿的浪漫和/或性关注。它可以发生在工作场所内或组织之间。与离线世界一样，各种形式的骚扰都在网上发生，包括但不限于性骚扰和种族骚扰。Barak\
  \ (2005) 指出了网络空间可能发生的三种性骚扰类型：性别骚扰、不违愿的性关注和性胁迫。除了 Barak (2005) 讨论的性骚扰形式外，个人还可以通过访问个人电脑、监控个人击键、发送病毒或破坏个人声誉来实施网络骚扰。\n\
  \n研究人员注意到，网络骚扰在采用替代物理身份的网络空间（如*第二人生*及其他虚拟世界）中也显而易见（Behm‐Morawitz & Schipper, 2015）。在\
  \ Behm-Morawitz 和 Schipper 的研究中，网络骚扰被操作化为“通过计算机媒介的淫秽评论、性骚扰以及旨在贬低和/或驱逐虚拟世界用户的骚扰行为”。这些作者创建了一份问卷，由\
  \ 216 名*第二人生*用户回答，提供了关于他们的虚拟外观和虚拟世界体验的信息。Behm-Morawitz 和 Schipper 发现，网络骚扰在*第二人生*中相当常见，大约三分之二的样本报告了骚扰经历。与男性相比，女性报告感到遭受网络骚扰的可能性显著更高，这主要是由于虚拟形象的性化导致的。\n\
  \n跟踪（Stalking）被理解为更严重的骚扰形式，尽管学术文献经常混用这些术语（这可能是因为学者之间没有统一的定义）。从法律角度来看，跟踪是一种相对新的犯罪，事实上，直到\
  \ 20 世纪 90 年代它才被认为是非法行为。例如，1990 年，加利福尼亚州通过了第一个专门将跟踪定为犯罪的法律。这是由于演员瑞贝卡·谢弗（Rebecca\
  \ Schaeffer）遭到跟踪并最终遇杀。尽管这是一种相对新的犯罪，但研究人员指出这种活动可以追溯到古代，为了报仇目的而对他人的执着追求在文学中早已显而易见（Spitzberg,\
  \ 2002）。\n\n正如本节开头所强调的，互联网为跟踪个人和组织提供了新机会。从在线来源获取的数据可用于在物理世界中定位某人以便对其跟踪；然而，个人可能仅在网络上被跟踪——这造成的伤害与物理跟踪相比可能是等量的，在某些情况下甚至更严重。为了尝试将该术语操作化，McGrath\
  \ 和 Casey (2002）认为：\n\n> 跟踪是对受害者生活和活动反复的、未经邀请的监控和/或入侵，这通常（但并非总是）目的是为了恐吓或恐吓受害者及其周围的人……网络跟踪仅仅是利用互联网进行信息收集、监控和接触害者的跟踪。（第\
  \ 88–89 页）\n\nBocij (2004) 对网络跟踪的定义更为全面，包含了群体、组织以及个人：\n\n> [网络跟踪是]个人、群体或组织利用信息通信技术骚扰另一个个人、群体或组织的行为。此类行为可能包括但不限于传输威胁和虚假指控、身份盗窃、对数据或设备的破坏、计算机监控、出于性目的的招募未成年人以及任何形式的侵略行为。骚扰被定义为：在理性人在拥有相同信息的情况下，认为这会导致另一个理性人遭受情感困扰的一系列行为。（第\
  \ 14 页）\n\n当然，网络跟踪并不一定停留在网上。网络跟踪行为可能从网上开始，但进展为离线跟踪方法，包括所有的传统的线下跟踪行为，如使用电话、跟随目标、发送信件等。它也可以与传统的跟踪行为结合发生。此外，潜在受害者可能仅仅在网上被识别，然后在线下遭到跟踪。\n\
  \n## 13.2 网络跟踪与法律\n\n某些跟踪法律已经重写以包含网络跟踪。例如，在南澳大利亚，法律将网络跟踪定义为：\n\n> 指跟踪者利用信息技术，要么对受害者造成身体或心理伤害，要么使受害者感到严重的忧虑或恐惧。网络跟踪是指一个人在至少两个独立场合，出于造成严重伤害的意图，利用互联网或其他形式的电子通信发布或传输攻击性材料，或与该人或关于该人的他人进行交流，其方式合理预期引起忧虑或恐惧。（南澳犯罪法\
  \ 1990 年）\n\n\n\n\n\n在美国司法部长（1999 年）的一份报告中，网络骚扰（cyberstalking）被定义为“使用互联网、电子邮件或其他电子通信设备跟踪他人”。有趣的是，英国和威尔士的\
  \ 1997 年《反骚扰保护法》在对骚扰行为的定义中，既没有包含网络骚扰，也没有专门包含“跟踪”。相反，它规定\n\n> 一个人不得从事构成对他人骚扰的行为轨迹。这并不要求主观意图：而是使用“理性人”测试，该法案通过“在拥有相同信息”这一措辞对其进行了限定。造成骚扰的犯罪之所以特殊，在于，它并不总是需要证明某人实际上知道该行为构成了骚扰。骚扰中的心理要素建立在证明嫌疑人知道或应当知道该行为构成了骚扰的基础上（第\
  \ 1 条第 1 款）。该行为对受害者的影响决定了该行为是否构成“骚扰”。这样做的优势是，任何持续的、违背意的都可能构成骚扰——允许警方在行为升级为暴力之前进行介入。（大都会警察局，1997\
  \ 年）\n\n## 13.3 犯罪分子与受害者的心理画像\n\n鉴于关于网络骚扰的研究匮乏，很难得出互联网是为跟踪者骚扰受害者提供了另一个空间和手段，还是网络骚扰是一个独立的社会问题。从理论上讲，鉴于研究（本书已讨论过）发现个人在某些在线空间中会感到更不受抑制，从而导致了更大的风险承担和反社会行为，因此预测某些可能参与传统跟踪的人可能会参与网络骚扰可能是合理的。然而，一些研究试图将跟踪行为者和受害者与网络骚扰行为者和受害者区分开来。\n\
  \n关于更有可能进行跟踪以及进行网络骚扰的人格特征，目前有一些文献。Fisher、Cullen 和 Turner (2002) 认为，鉴于自认跟踪者的比例很高，收集从事其他犯罪的个人数据更容易（尽管在公开承认该行为的人与否认该行为的人之间存在潜在的偏差）。对线下跟踪的研究发现，跟踪者更有可能是经历过童年创伤、依恋关系不安全且具有人格心理问题的男性（Dye\
  \ & Davis, 2003; Dutton & Winstead, 2006; Spitzberg & Cupach, 2033; Spitzberg &\
  \ Veksler, 2007）。药物和酒精问题在跟踪者中更为常见（Rosenfeld, 2004）。关于网络骚扰，Menard 和 Pincus (2012)\
  \ 发现，跟踪者和网络骚扰者比非跟踪者更容易遭受虐待。他们还发现，对于男性，自恋性脆弱性与其性侵待的互动预测了跟踪和网络骚扰；而对于女性，不安全依恋和酒精预期预测了跟踪和网络骚扰。Alexy、Burgess、Baker\
  \ 和 Smoyak (2005) 发现，网络骚扰者比公开的跟踪者更容易伤害自己。\n\n研究发现女性比男性更容易成为跟踪的受害者（Basile, Swahn,\
  \ Chen & Saltzman, 2006）。相比之下，对网络骚扰的研究发现受害者更有可能是男性（Alexy et al., 2005）。然而，还需要更多具有代表性样本的研究来证实这一差异。跟踪的受害者会因为被跟踪而导致社交和就业领域发生变化，而网络骚扰的受害者更有可能经历家庭和朋友的损失（Sheridan\
  \ & Grant, 2007）。值得注意的是，Sheridan 和 Grant 发现，与被跟踪的受害者相比，跟踪受害者在心理、社交和财务方面没有显著差异。\n\
  \n## 13.4 仇恨犯罪\n\n仇恨犯罪被广泛理解为受文化界定的群体的负面态度所驱动的犯罪行为（Brax & Munthe, 2015）。某些网络骚扰、网络跟踪甚至恐怖主义犯罪也可以被理解为仇恨犯罪。然而，仇恨犯罪很难操作化。正如\
  \ Brax 和 Munthe 指出的：\n\n> 在仇恨犯罪的辩论中，我们发现对于究竟什么让一种犯罪成为仇恨犯罪存在不同的观点。这不仅仅是一个口头问题，它还影响到哪些具体的罪行被认为是法律和政策措施的目标。这种概念差异存在于国家之间、单一国家内的机构之间，以及不同的公共政策部门之间。在将仇恨犯罪作为研究课题的学术学科之间以及各学科内部，也存在概念差异。（第\
  \ 1688 页）\n\n与网络骚扰一样，犯罪分子可能在互联网上实施他们的仇恨犯罪，也可能利用互联网获取有关某人的信息以便在线对其造成伤害。心理学对仇恨犯罪的研究（特别是涉及互联网的研究）相当稀少。这可能是因为这些犯罪没有明确的定义，并且与其他定义明确的犯罪相重叠。以下是发生于英国的一起仇恨犯罪案例：\n\
  \n> 因此，Mumsnet——一个“以女性为主的空间”——也会遭到攻击或许是令人沮丧但不可避免的。随着其受欢迎程度的增加，侮辱也随之增加，多年来一直成为 48\
  \ 岁的 Roberts [Mumsnet 的所有者] 所所描述的“各种奇怪的抗议”的目标——据她所，包括活动小组“正义之父父亲”（Fathers 4 Justice）向工作人员邮寄了内裤。与此同时，Twitter\
  \ 上充斥着“回到厨房洗水槽去，认清你的本分”之类的评论。然后，在 [2015 年] 8 月的一个晚上，侮辱和攻击升级到了 Roberts 无法预测的程度。警方接到一个匿名电话，报称她被杀害，四个孩子被持枪者劫持人质。八名警察在半夜被紧急集合并派往她的伦敦家中，五人配备了机枪，并配有警犬。事实上，这家人正在度假，全都安全无事。只有他们\
  \ 21 岁的西班牙保姆在家里面对这一骚乱。这就是所谓的 `swatting attack`（虚假报案）——通过虚报犯罪导致特警突击队冲入受害者家门。这种现象在美国很常见，但这被认为是英国的首起此类案件。在同一时期，网上出现了威胁\
  \ Mumsnet 的信息，并且由于由于一个自称为 `@DadSecurity` 的小组发起的拒绝服务攻击攻击（通过向服务器涌入数据）导致网站暂时崩溃。用户的详细信息在一次钓鱼行动中被骗取，两名在\
  \ Twitter 上公开反对攻击的 Mumsnet 成员也遭遇了虚假报案。\n\n> 这一事件对 Roberts 打击很大。“这压力非常巨大，在一段时间内，我几乎每晚都会醒来，以为家里有一个持枪的匪徒——这是不理性的，因为显然我知道那是骗局，但那是一段非常焦虑时期，”她说，“我对用户和员工的福利感到非常有责任。”（Silverman,\
  \ 2015）\n\n\n\n\n\n极右组织（也称为右翼极端主义组织）在网上显而易见。三 K 党、伊斯兰教极端主义组织、英国民族党和国家行动（英国）只是此类拥有网络呈现的少数例子——这些网站通常是为了招募新成员而建立的。Hale\
  \ (2012) 研究了这类组织如何利用在线媒体吸引年轻人。在论文中，他指出，能够快速下载仇恨材料有助于招募，因为这让用户感到安全，减少了被捕获或引起不必要的关注的风险。Hale\
  \ 还注意到，这些组织试图通过浏览在线聊天论坛的帖子来招募成员，并跟踪网站用户的人口统计数据，以便通过发送培训手册和宣传材料来定位潜在成员。Hale 认为，定制的社交网络（如\
  \ `Stormfront`）是有用的招募工具，因为它们不仅发布信息和消息，还鼓励成员互动，从而形成强大的社区。尽管 Hale 为研究人员考虑仇恨组织的招募提供了一些重要的观点，但仍需要更多的研究来寻找更有效的方法检测和威慑这些组织的方法（参阅\
  \ 第 7 章 关于网络激进化的详细讨论）。\n\n## 13.5 网络战\n\n> 《时代》杂志消息来源，入侵美国官方网络的黑客不仅将中国系统作为发射平台，而且他们就位于中国。他们的故事是：2004\
  \ 年 11 月 1 日的某一天，黑客坐在中国南方电脑前，再次开始了他们对美国秘密的每日狩猎。自 2003 年以来，该小组一直在对美国政府目标进行广泛攻击以窃取敏感信息，这是由美国调查人员代称为\
  \ `泰坦之雨` 的大规模网络间谍活动的一部分。在那个特定的晚上，黑客的目标是军事数据，他们配备了一种新武器来跨越网络空间获取这些数据。\n\n> 根据一位协助追踪\
  \ `泰坦之雨` 的政府网络分析师介绍，这是一个“预热泵”的扫描程序，通过在庞大的军事网络中搜索具有漏洞的单机，供攻击者以后利用。与他们的许多工具一样，这是一个简单的程序，但经过了巧妙修改以适应他们的需求，并以无情的效率用于针对大量的美国网络。据消息人士说，在执行扫描后，几乎可以确定攻击者会在一两天内回来，并像他们在几十个军事网络中所做的那样，闯入计算机尽可能地窃取数据而不被发现。（Thornburgh,\
  \ 2005）\n\n网络战本质上是由主权国家实施的行为，旨在渗透另一个国家的网络以造成损害，例如破坏或干扰。上面的摘录是 2004 年发生的著名网络攻击案例，被称为“泰坦之雨”。损害范围可以从对国家基础设施产生影响到财务损失或盗窃，任何一种都可能导致物理伤害。\n\
  \n随着新科技的发展，战争规则随时间发生了变化；然而，新的发明和技术意味着我们以不断加快的速度重写战争规则（Singer, 2009）。然而，国际社会尚未制定并批准一套规范网络空间国家行为的标准（Beidleman,\
  \ 2009）。像 Singer 这样的学者曾问，为什么关于伦理和技术的问题如此困难，特别是在战争领域。他引用了奥马尔·布拉德将军在 1948 年 11 月的一场演讲中的话：“世界取得了辉煌但缺乏智慧，拥有权力没有良知。我们是一个核巨头和伦理婴儿的世界。我们对战争的了解比对和平的多，对杀戮的了解比对生活的更多”（引自\
  \ Singer, 2010, p. 300）。Singer 提出的一个重要观点是，社会科学、人文与物理科学之间存在脱节，导致许多可能用于战争的新技术在开发时没有考虑到任何伦理问题。正如本书中反复提到的，跨学科研究可以为问题提供更丰富的发现和潜在的解决方案。网络战是一个很好的例子，来自不同领域的专家需要汇聚在一起以寻找最佳解决方案。\n\
  \n网络战具有许多特点，使其与传统武器的使用有所不同：往往很难确定网络攻击的来源，产生了归因问题，而且许多网络攻击并非直接致命，且不会对物理物体造成永久性损坏（Dipert,\
  \ 2010）。此外，参与网络战在心理体验上与参与物理战争可能是不同的。\n\n网络技术也改变了战争的性质。例如，有人认为，在战争中使用无人机使杀戮变得容易，因为操作员与目标之间有距离，这意味着杀手与其目标之间的物理距离越远，产生的道德距离就越远。目标与攻击者之间距离缩短会为杀戮带来情感和共情障碍（Coeckelbergh,\
  \ 2013）。\n\n正如本书的几个章节所讨论的（特别参阅 第 3 章），心理学家注意到网络空间中存在“去抑制效应”。提醒一下，Suler (2004) 将这种效应描述为双刃剑。虽然有些人会透露秘密的情绪、恐惧和愿望，或表现出异常的善良和慷（Suler\
  \ 称为“良性抑制”），但在其他时候，人们比面对面更加粗鲁、更批判、更愤怒或更具威胁性。Suler 将此称为“毒性抑制”。本章早些描述的网络骚扰就是这种毒性抑制的例子。去抑制效应被用来解释为什么网络罪犯会实施犯罪。它可以降低人们对犯罪产生责任感的可能性，以及产生负面情绪（如羞愧，因为没有被感知的观众见证犯罪）（Guitton,\
  \ 2012）。然而，考虑到情报和政府如何应对网络攻击，或他们何时可能决定发起攻击，考虑去抑制效应可能同样重要。例如，如果他们在物理世界中面对敌人，他们产生报复的意愿可能较弱，或者报复造成的伤害较小。\n\
  \n\n\n\n\n关于无人机使用的伦理问题已引起许多学者的质疑。他们质疑战争中的物理距离是否导致个人做出了伤害性的决策，而如果敌人更近，他们可能不会做出这些决定。Coeckelbergh\
  \ (2013) 写道：“虽然远程战斗意味着一种不那么具身的、社会化的且参与性的世界存在方式（用海德格尔的话说）这可能是事实，但无人机飞行员仍然是具身的、社会化的赋予意义的生物，而且他们也以具身的方式体验他们的战斗和杀戮”（第\
  \ 94 页）。根据 Coeckelbergh 的观点，更具实践性的实证问题是更多地了解这些飞行员经历了怎样的具身经验。此外，他认为这些飞行员需要对目标进行近距离监视——通常是长时间的——这意味着他们确实看到了目标的“脸”，并可能会花时间构建关于目标生活的叙述，这使得道德距离更近而非更远，并可能使杀戮变得困难。Coeckelbergh\
  \ 关注的是那些让人员看到（近距离）目标的无人机和监控方法；然而，对于网络战中的所有攻击/防御方法并非如此（例如，拒绝服务攻击，个人或一群人可能保持匿名状态）。了解非具身的分析师和其他战争参与者在监控或策划攻击、或对网络犯罪分子发动攻击时的感受可能很有趣。\n\
  \n### 13.5.1 黑客主义者\n\n参与网络战的一些个人或群体被称为黑客行动主义者（hacktivists）。然而，黑客行动主义者做的远不止于参与网络战。此外，某些黑客行动主义者并不。本质上，黑客行动主义者未经授权访问计算机文件或网络，通常是为了进一步社会或政治目的。人们通常会将白帽黑客和黑帽黑客区分开。白帽黑客被认为是伦理黑客，并获得客户的授权（例如，进入系统发现其漏洞并向所有者报告系统的缺陷以便改进安全性）。另一方面，黑帽黑客是意图造成伤害的网络犯罪分子。\n\
  \n某些黑客行动主义者并非明确的黑帽或白帽，因为他们在他们在恶意的非法伤害和伦理行为之间摇摆。这些个人或群体通常被称为“灰帽”。一个著名的灰帽组织自称为“匿名者（Anonymous）”。它本质上构成了一个具有松散且去中心化指挥结构的国际活动网络。它因对政府、宗教和公司网站进行\
  \ `DDoS`（分布式拒绝服务攻击，即试图使机器或网络服务对预定用户不可用）而闻名。例如，他们曾对激进伊斯兰教分子宣布网络战。正如《卫报》报道的，2015 年，他们将注意力转向了仇恨组织，如三克鲁克斯党：\n\
  \n> 黑客团体“匿名者”已开始履行其承诺，泄露三克鲁克斯党成员的身份，发布了一份包含 350 多名涉嫌成员名单的数据转储，以及指向社交媒体账户的链接。许多身份已处于公共领域。\n\
  \n> 在匿名共享网站 `Pastebin` 上列出的名单中，只有一个名字附带了电话号码。少于五个人有电子邮箱。没有人回应评论请求。\n\n> 发布名单中的许多人已经处于公众视野，至少在社交媒体上。其中一名三克鲁克斯党成员詹姆斯·普拉特（James\
  \ Pratt）的 Twitter 简介写道：“一个退伍士兵，一个父亲，三克鲁克斯党传统主义美国骑士团（TAK）的成员。”\n\n> 弗兰克·安康纳（Frank\
  \ Ancona）的名字包含在名单中，他是 KKK 传统主义美国骑士团（TAK）的帝国巫师，他曾作为该小组代表过电视。前领袖大卫·杜克（David Duke）列在名单中；还有白人至上主义网站\
  \ Stormfront 的创始人唐·布莱（Don Black）。(Woolf, 2015)。\n\n### 13.6 监控与监测\n\n考虑到在线犯罪的规模、互联网引发线下犯罪的功能以及这些犯罪可能造成的危害，政府认为需要强大而有效的措施来预防和检测这些犯罪，并抓住背后的犯罪分子。其中一种措施是对互联网数据进行监控和监测。然而，监控的问题之一在于，尽管可能被用于预防和检测犯罪行为，但监控无疑会导致对无辜人员个人生活的监控。因此，在国家和国际范围内，关于多少监控在伦理和社会上是可以接受的，以及谁应该有权接触这些情报引发了许多辩论。\n\
  \n在爱德华·斯诺登（Edward Snowden）泄露美国和其他国家的监控做法后，人们对监控的担忧增加了。这次泄露导致政府考虑是否需要监控透明度，以及是否需要重新修订立法。英国的“监听者宪章”（《通信数据法案草案））是政府重新考虑其监控立场的一个例子。然而，这一新宪章引起了巨大动荡：\n\
  \n> 我从未想过我会说这句话，但乔治·奥威尔（George Orwell）缺乏远见。间谍们走得比他想象的还要远，他们在秘密且没有民主授权的情况下创建了终极的全景监狱。现在，他们希望英国民众能使其合法化。\n\
  \n> 这项法案的特点是具有明显的反民主态度。掌权者被认为是好的，因此被赋予了疑从的利益。“如果……行为在所有目的上都是合法的”以及“某人（无论该人是否获得授权或要求）对于……的行为均不承担任何民事责任”：这些是授予间谍和警察豁免责任的条款。\n\
  \n> 间谍的监控活动也免于法律正当程序。在任何法律程序中，都不能询问可能表明发生过监控或拦截的问题。这是为了确保普通大众永远不会得知真实的人受到影响。这种豁免的代价是巨大的。这意味着英国检察官无法利用现有的证据——拦截信息——来起诉恐怖分子，而这些证据是全球重大案件起诉的关键部分。\n\
  \n> 间谍的监控活动也免于法律正当程序。在任何法律程序中，都不能询问可能表明发生过监控或拦截的问题……（此处重复了上述逻辑结构）\n\n> 没有权力的人——例如公民（或更准确地说说是臣民）是潜在危险的，因此必须被严密且持续地观察和监测。法案中提到的保护措施是为了利益国家而非公民。刑事制裁并不是为了阻止间谍或警察滥用权力，而是为了封住批评者或潜在吹哨者的嘴。这一点很清楚，因为遍布法案的禁令中没有公共利益豁免。保护海量个人数据的安全措施与其说是为了保护公众，不如说是防止任何人发现这些数据究竟有多大或隐私，以及它们是如何获取的。再次，我们知道这是因为没有公共利益豁免。\n\
  \n> 当国家的担忧占据主导地位时，公民的担忧却无处可见。法案中几乎没有提到大规模监控对隐私的民主成本，也没有对国家使用和滥用其广泛权力进行严肃的追责。(Brooke,\
  \ 2015)\n\n关于个人在线隐私，有许多问题需要考虑。Sparck-Jones (2003) 标记了收集的信息中若干具有隐私后果的特定属性：\n\n\n\n\
  \n\n*   **持久性 (Permanence)**：一旦被记录，信息就很难消失。因此，关于个人的存在细粒度、可搜索且持久的数据，而且存在复杂的、廉价的数据挖掘设备，也可以用于分析这些信息。\n\
  *   **海量 (Volume)**：技术使得信息的记录变得容易，导致了海量数据集。此外，存储成本低廉，因此大量信息可以长期存在。\n*   **不可见性 (Invisibility)**：所有收集的信息似乎都存在于一个不透明系统中，因此收集的任何信息对于相关人员来说可能都是“不可见的”。即便即使收集的信息对某人可用，由于使用了难以理解的编码，该人可能无法对其解读。\n\
  *   **中性性 (Neutrality)**：收集信息的便利性意味着任何分类属性的信息可能会丢失。因此，无论其元数据如何，信息都会被吸收；也就是说，隐私、敏感信息与非敏感信息之间没有区别。\n\
  *   **可访问性 (Accessibility)**：有许多访问信息的工具，这意味着任何收集的信息都可能被许多人阅读。信息通过电子方式复制、传输、整合和倍增的便利性进一步增加了这种可访问性。\n\
  *   **汇编 (Assembly)**：有很多有效的工具可以从许多完全独立的来源搜索、汇编和重新组织信息。\n*   **遥远性 (Remoteness)**：收集的信息在物理和逻辑上通常与其所指的用户是遥远的。然而，这些信息可以被用户不认识的人访问和使用。\n\
  \n正如 Whitty 和 Joinson (2009) 所言，上述每种特征都以独特的方式影响隐私，并在与其他威胁结合时产生影响。尽管在许多环境中，大规模的数据收集和存储是可行的，但互联网的结构本身及其连接性这一额外功能进一步加剧了在线隐私问题。互联网允许交互式的双向通信，并以比其他某些媒体更亲密的方式织入人们的生活，因为它连接了人与地方、人与人之间的关系。因此，它对信息隐私构成了独特的威胁。\n\
  \n关于在线隐私的较近的问题之一是，“大数据”如何被重新组合，以提供用户可能没有察觉和/或可能从未猜想过可以使用其数据做出的关于一个人的洞察。例如，某些机构已使用大数据来预测怀孕，尽管这可能不是政府监控的目标，但这个例子证明了个人数据很可能以公众未想象的方式被使用。这个故事在下面的摘录中得到了总结：\n\
  \n> 当营销人员向 Pole 解释时——正如 Pole 后来向我解释的那样，在我们还在说话且 Target 告诉他停止之前——新父母是零售商的圣杯。大多数购物者不会在一家商店购买他们需要的一切。相反，他们在杂货店买食品，在玩具店买玩具，只有当他们需要某些与\
  \ Target 相关的特定物品时才会光顾 Target——比如清洁用品、新袜子或六个月供应量的卫生纸。但 Target 售卖从牛奶到填充动物，再从草坪家具到电子产品的所有商品，因此该公司的首要目标之一是说服客户，他们需要的商店只有\
  \ Target。但这是一个很难传达的信息，即使采用最精妙的广告活动，因为消费者的购物习惯一旦根深蒂固，改变它们是非常极其的。\n\n> 然而，人一生中会有一些短暂的时期，旧的习惯会崩溃，购买习惯突然发生变化。其中一个时刻——真正地说是*那个*时刻——就在孩子出生前后，那时父母们精疲力竭、不知所措，他们的购物模式和品牌忠诚度正处于待人宰的状态。但正如\
  \ Target 的营销人员向 Pole 解释的那样，时机就是一切。因为出生记录通常是公开的，一对夫妇有了新宝宝的瞬间，他们几乎会立刻来自各种公司的优惠、激励和广告的轰炸。这意味着关键在于更早地接触他们，在任何其他零售商知道有宝宝要出生之前。具体来说，营销人员说，他们想向怀孕三个个月的女性发送专门设计的广告，那是大多数准产妈妈开始购买各种新东西的时候，比如产前维生素片和孕妇装。“你们能给我们一份清单吗？”营销人员问道。\n\
  \n> “我们知道，如果能在她们怀孕三个个月时识别出她们，我们很有可能留住她们多年，”Pole 告诉我，“只要他们开始从我们这儿买尿布，他们就会开始购买其他所有东西。如果你在商店里匆忙穿梭寻找水瓶，经过橙汁时，你会顺拿一盒。噢，还有我想要的那个新\
  \ DVD。很快，你就会从我们这儿买麦片和纸巾，并不断回来。”……\n\n> Andrew Pole [的] 任务是分析购物者之间所有的“线索-习惯-奖励”循环，并帮助公司弄清楚如何利用这些循环。他部门的大部分工作是直观的：找到有孩子的客户并给他们发送包含圣诞节前玩具的目录。寻找四月份习惯性购买泳衣的购物者，并在七月份给他们发送防晒霜优惠券，在十二月给他们发送减肥书。但\
  \ Pole 最重要的任务是识别消费者生活中那些独特的时刻，在这些时刻，他们的购物习惯变得特别灵活，正确的广告或优惠券就会让他们开始以新的方式消费……\n\n\
  > 但当某些客户经历重大的生活事件时，如大学毕业、找新工作或搬到新城市，他们的购物习惯变得灵活，且这种灵活性既是可预测的，又是零售商的潜在金矿。研究发现，当某人结婚时，他或她更有可能开始购买一种新咖啡。当一对夫妇搬进新家时，他们更有可能购买不同种麦片。当他们离婚时，他们开始购买不同品牌啤酒的概率就会增加……\n\
  \n> 随着 Pole 的电脑爬取数据，他能够识别出大约 25 种产品，这些产品分析在一起允许他为每个购物者分配一个“怀孕预测”分数。更重要的是，他还能估计出产期，且范围很小，这样\
  \ Target 就能根据怀孕的非常具体的阶段发送优惠券。（Duhigg, 2012）\n\n使用监控来预防和检测网络犯罪（即使是像恐怖主义这样严重的犯罪）将是一个持续的争议，一个需要跨学科方法的问题。心理学可以通过增加我们对物理和网络领域身份的认知，以及公民对他人如何观察和使用其个人身份的态度来做出贡献。\n\
  \n## 13.7 结论\n\n本章关注了网络支持的犯罪，这些犯罪都可能对个人、组织和或社会造成巨大伤害。在某种程度上，法律已经过修订以承认这些犯罪，但这些法律在各国之间往往是不一致的（使得处理跨国犯罪变得特别困难）。作为学者，我们尚未明确地操作化这些犯罪（仇恨犯罪就是一个尚未明确定义的良好例子）。\n\
  \n### 讨论问题\n\n\n\n\n\n1. **网络跟踪与观察他人的在线活动之间，应该如何划定界限？**\n\n2. **目前在网络骚扰和网络跟踪研究方面，存在哪些局限性？**\n\
  \n3. **在你看来，可以采取哪些策略来预防仇恨犯罪？**\n\n4. **你认为心理学家在网络战争领域做出了哪些贡献（例如在预防以及对报复、威慑和检测的决策方面）？**\n\
  \n5. **无人机是符合伦理的武器和/或监控手段吗？为什么或为什么不是？**\n\n6. **你对利用在线个人数据进行监测和预防犯罪有何看法？如何最好地进行这种监控？谁（如果有的话）应该有权接触个人的隐私数据？**\n\
