- pgno: 184
  md: '# Multistage Fuzzy Control


    # Abstract


    This chapter is related to the design of a multistage fuzzy control system. A
    general method to generate fuzzy rules for a multistage fuzzy controller from
    the performance index of the control system is presented. The simulation results
    using three-stage fuzzy inference showed that the good performance is achieved
    using this approach.


    # 5.1 Introduction


    The recent success of fuzzy logic has encouraged its use in complex applications
    that have large amounts of rules and require real-time responses [1]. The typical
    fuzzy logic models contain various inputs and outputs and can be divided into
    three types: single-input and single-output (SISO), multiple-input and single-output
    (MISO), and multiple-input and multiple-output (MIMO) shown in Fig. 5.1. As application
    systems become more complicated, they would contain more complex knowledge which
    may be expressed in more complex ways, and they involve a large number of fuzzy
    rules that will increase quickly with the growing numbers of inputs, outputs and
    membership functions. For example, in a system of N input variables and single
    output variable with M fuzzy values for each variables, the total number of complete
    fuzzy rules is M^N. The completeness of fuzzy rules means that at any point in
    the input space there is at least one rule that will be fired. This large size
    of fuzzy rules would need great efforts to develop them and the inference computation
    time will be lengthy. Consequently, the typical single-stage fuzzy inference may
    not be suitable for human intelligent activities.


    To reduce the complexity of the fuzzy systems, they are often performed via decentralized
    into a number of small fuzzy subsystem or divided into multistage inference system
    to solve complex problems. Since the decentralized control approach is reliable
    and practical in view of the implementation, it is the most popular approach which
    attempts to design control schemes where each subsystem is controlled independently
    based on local information. For example, a three-link robot may be treated as
    three subsystems and each subsystem is controlled independently. However, some
    complex systems are difficult to divide into subsystems; thus some of the complex
    systems are suitable to be controlled by hierarchical controllers (multistage).'
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_185_0.png)


    # Figure 5.1 SISO, MISO, and MIMO fuzzy systems


    To reduce the number of fuzzy rules for complex systems, the multistage fuzzy
    logic inference has been proposed [2]-[5]. In addition to input and output'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'variables, intermediate variables are adopted in fuzzy rules to mimic human
    knowledge. The key advantage of using hierarchical structure (multistage) is that
    the number of fuzzy rules will increase quadratically ($O(N^2)$) with the number
    of input variables and (or) membership functions [2, 3]; for example, if a six-input
    and single-output fuzzy control system uses seven fuzzy values for each input
    variable, and the system is divided into five-stage in which instead of $7^6$.
    In this multistage inference system shown in Fig. 5.2, there are two input variables
    and each stage has two inputs and one output. The number of fuzzy rules is reduced
    to $5*7^2$ intermediate output variables in the first stage; from the second to
    fourth stage, there are one input variable, one intermediate input variable and
    one intermediate output variable; in the final stage, there are one input variable,
    one intermediate input variable and one output variable. Thus, comparing the fuzzy
    rule number and the developing efforts between the single stage and multistage
    fuzzy systems, the multistage systems for complex applications will require less
    efforts in developing the fuzzy rules and less computation time. Before reviewing
    the related studies, the multistage fuzzy systems are briefly introduced in the
    following.


    ![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_186_0.png)


    Figure 5.2 The architecture of multistage fuzzy logic inference


    # 5.1.1 Multistage fuzzy systems


    For large-scale systems, which are composed of interconnected subsystems, the
    essential problem is the interactions between the subsystems. Many approaches
    have been proposed to control complex interconnected systems such as the decomposition-coordination
    approach, and the decentralized control approach [6]-[9]. Since the decentralized
    control approach is reliable and practical'
