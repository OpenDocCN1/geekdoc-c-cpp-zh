    # 6.5 Interpretation Preservation


    If allowed to adapt freely, the membership functions of a learning fuzzy system
    may lose the meaning which was initially assigned to them. They may change their
    relative positions such that, for example, “low” may become greater than “high”,
    or the range of their activations may become excessively wide or narrow [7, 11,
    12, 28].


    Although the adapted membership functions may have attained a new significance,
    after the original meaning has been lost, it may be very difficult or'
