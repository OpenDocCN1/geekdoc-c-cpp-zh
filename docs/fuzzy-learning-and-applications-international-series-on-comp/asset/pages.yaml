- pgno: 373
  md: 'Some selected logical operators and fuzzy implications were also investigated
    with respect to their behavior in the inference processes. The fuzzy if-then rules
    have on one hand a conjunction interpretation and on the other hand the interpretation
    in terms of classical logical implication. The inference algorithms based on conjunctive
    implication interpretation of if-then rules were simpler and faster with relation
    on algorithms used for the logical interpretation of such rules. Additionally,
    applying conjunctive implication interpretation of if-then rules leads to intuitively
    better inference results. In the chapter we present an inference with specific
    defuzzification that leads to simpler, faster and intuitively acceptable results.
    An artificial neural network that automatically generates this kind of fuzzy if-then
    rules has been described.


    In literature, several methods of automatic fuzzy rule generation from given numerical
    data have been described [3], [12], [14], [17], [21], [29]. The simplest method
    of rule generation is based on a clustering algorithm and estimation of proper
    fuzzy relations from a set of numerical data [17], [29]. Another type of method,
    which use the learning capability of neural networks and the fact that both fuzzy
    systems and neural nets are universal approximators, has been successfully applied
    to various tasks. The problem here is the difficulty in understanding the identified
    fuzzy rules since they are implicitly acquired into the network itself. Mitra
    et al. [21] have proposed a fuzzy multilayer perceptron generating fuzzy rules
    from the connection weights. Several methods of extracting rules from the given
    data are based on a class of radial basis function networks (RBFNs). The fact
    that there is a functional equivalence between radial basis function networks
    (RBFNs) and the fuzzy system has been used by Jang et al. [13] to construct a
    Sugeno type of adaptive network based fuzzy inference system (ANFIS) which is
    trained by the back propagation algorithm. More general fuzzy reasoning schemes
    in ANFIS are employed by Horikawa et al. [12]. Such developed radial basis function
    based adaptive fuzzy systems have been described by Cho and Wang [3] and applied
    to system identification and prediction. Another type of fuzzy system with moving
    fuzzy set in consequents of if-then rules is shown in [19].


    The aim of this chapter is the theoretical description and structure presentation
    of a new artificial neural network based on logical interpretation of if-then
    rules (ANBLIR). The novelty of the system is the introduction of the logical interpretation
    of fuzzy if-then rules with moving fuzzy sets in that rules consequent. The described
    system is applied to benchmark pattern recognition problems.


    The chapter is divided into 7 sections. Some introductory remarks are contained
    in Section 1. Section 2 presents a short review of the study concerning an axiomatic
    approach to the definition of a fuzzy implication with a location of fuzzy implications
    within the interval [0,1]. Section 3 recalls the main ideas of the fuzzy inference
    process. Section 4 introduces the basics of fuzzy systems. In Section 5 the structure
    of ANBLIR and the estimation of its pa-'
