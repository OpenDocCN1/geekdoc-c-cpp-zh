- pgno: 336
  md: 'applications quite flexible to the networking scenarios. In this section, we
    formulate a dynamic scheduling problem where, at each SI, the multimedia server
    dynamically adapts to the non-stationary work-load. The objective is to minimize
    a multi-variable function for QOP degradation due to AUS losses. The scheduling
    problem is formally presented in the following subsection.


    # 10.5.1 A Multi-criteria Scheduling Problem


    The main functionality of the scheduler is to determine the order and time at
    which the AUSs should be transmitted over the given m channels. If the resources
    are severely constrained, the multimedia server needs to invoke an AUS filtering
    process. For this purpose, as discussed in Section 10.3.3, each AUSi is assigned
    an importance factor Ii which quantifies the relative importance of the AUSi within
    a group of AUSs. To formulate an objective function for the AUS filter, first
    define a filtering factor(Fi) as follows:


    ```

    F_i = { 0 if AUS_i ∈ S, 1 otherwise. }

    ```


    Here S represents the schedule obtained after observing AUS-filtering. In other
    words, IiFi represents the cost incurred when an AUSi is dropped at the server.


    In addition of minimizing the number of AUSs dropped, the scheduler also needs
    to minimize the AUS losses due to deadline miss or destination buffer overflow.
    Let Σ Ld and Σ Lb, respectively, represent the total number of AUSs lost due to
    deadline misses and destination buffer overflow. Note that Σ Ld and Σ Lb are two
    conflicting objectives. Specifically, Σ Ld can be minimized by pre-fetching as
    much AUSs as possible. However, extensive pre-fetching may yield extremely high
    data (AUSs) losses due to buffer overflow.


    For a given Scheduling Interval (SI), the scheduler''s objective depends on the
    state of the system (resource availability) and the SI''s work-load. For example,
    based on the state of the system and work-load of the SI, the scheduler needs
    to identify when to follow the AUS-filtering process, i.e., minimization of Σ
    IiFi objective. Similarly, if the SI''s work-load is significantly less than the
    total capacity of the m channels, and the scheduler selects minimization of Σ
    Ld as the objective. Such a selection will yield a high number of losses due to
    buffer overflow condition. Hence, the objective of the scheduler is to minimize
    all types of AUS losses for every SI considered. In other words, the objective
    is to minimize the following:


    ```

    ∑_{SI} { ∑_{AUS_i ∈ SI} ( L_d + L_b + I_i F_i ) } . (10.2)

    ```'
