    By providing relatively small intelligent components that may be more easily integrated
    into more general software products, we can try to solve problems that could not
    be solved using a large and complex software system. The provision of facilities
    for the inclusion of multiple fuzzy modeling problem solving paradigms in a single
    software system has several advantages: different strategies may be applied to
    solve different aspects of a problem with the most appropriate approach being
    selected for each aspect.


    As an application of the use of this flexible architecture of learning agents
    a hybrid fuzzy-genetic agent based system for autonomous robots in uncertain environments
    is described. These agents are composed of two components: first a collection
    of fuzzy controllers that implement the different behaviours-based schemes of
    the robot, and second, a fuzzy meta-controller that combines the different behaviours
    and where the weights associated to each behaviour are learned using a genetic
    algorithm. In this way this meta-controller coordinates conflicts and competition
