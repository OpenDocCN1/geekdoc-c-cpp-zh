  md: '# Abstract


    Based on the concept of the active rule set, this chapter presents a multiplexed
    mixed-signal architecture for high-speed fuzzy controller chips. The proposed
    architecture consists of a programmable analog core which implements the active
    rule, a RAM memory which stores the parameters (global rule set) and a selection
    circuitry to identify the input subregion and retrieve the proper parameters from
    the memory. Thus, the global controller surface response is realized through dynamic
    programming and multiplexing of the analog core. This architecture can be programmed
    or trained by a set of input-output data pairs by means of a simple hardware-oriented
    learning rule which does not need to compute derivatives. The chapter presents
    also the circuit building blocks needed for implementation of the proposed architecture
    and illustrates the performance of the whole system through a chip realized in
    0.7µm CMOS technology.


    # 2.1. Introduction


    Fuzzy controllers are used to map a multidimensional input signal x = {x1, x2,
    ... xM}T onto a scalar output y, in accordance to a well-defined nonlinear relationship
    [1],


    y = f(x)  (2.1)


    In control applications the inputs are usually called facts, the output action,
    and the mapping law surface response. For instance, a fuzzy controller for a washing
    machine must univocally set the water level (action) as a nonlinear function (surface
    response) of the clothes’ mass, the water impurity, and the time differential
    of impurity (facts) [2].


    Fuzzy controllers employ the procedure of fuzzy logic inference[1] to construct
    the surface response. Some characteristic features of this procedure are [4][5]:


    +   - The surface response, which is a global model predicting the system behavior
    for any input, is obtained as a composition of local functions, each one predicting
    this behavior only for inputs comprised in a limited region of the input space.

    +   - These local functions represent insights in the system operation, and are
    described through inference rules of the type,'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'IF x₁ is A₁ₖ AND x₂ is A₂ₖ AND ... xₘ is Aₘₖ THEN Consequent Action

    where Aᵢₖ are called fuzzy labels, and the consequent action assigns values to
    y depending on the outcome of the combination of the antecedent clause statements.


    +   - The validity of the statements “IF xᵢ is Aᵢₖ” is continuously graded from
    0 to 1; the actual grade of each statement is calculated by evaluating a nonlinear
    membership function sᵢₖ(xᵢ) which is different from zero only inside a subinterval
    of the whole xᵢ interval.


    Because the statements involved in the fuzzy rules are in natural language, for
    instance “if the temperature is low”, this modeling technique is very well suited
    for capturing and emulating human expertise. On the other hand, the continuous
    grading guarantees generalization of the local pieces of knowledge and, hence,
    smooth surface responses. Finally, any change which affects only a limited region
    of the input space can be easily incorporated into the global model by just modifying
    the affected local functions – the transparency property [4].


    There are many fuzzy controller applications where the inputs and the output are
    analog signals acquired from sensors and applied to actuators, respectively [1][2].
    The hardware required for these applications can be implemented in two alternative
    ways [3]. One realizes the fuzzy processing in the digital domain by means of
    either general-purpose processors or dedicated ASICs [6]-[9]. Obviously, this
    approach must include A/D and D/A converters at the sensor/actuator interface
    circuitry. The other one realizes the fuzzy processing itself in the analog domain,
    thus precluding the use of data converters in the input-output signal path [12]-[17].


    Generally speaking, analog fuzzy controllers feature larger operation speed and
    lower power consumption than their digital counterparts; they also occupy smaller
    silicon areas. As a counterpart, they have poorer programmability and reconfigurability,
    and obtain lower accuracy in the realization of the fuzzy operations. The problem
    of accuracy becomes especially relevant with the circuits employed for global
    computations [4][5], like the center of gravity computation, where errors are
    aggregated and may become prohibitively large except for low-dimension systems.
    This is especially true in control applications, where lattice partitions of the
    universe of discourse are common [5], and thus the curse of dimensionality – exponential
    increase of the number of rules with input count – appears.


    The mixed-signal architecture discussed in this chapter overcomes these'
