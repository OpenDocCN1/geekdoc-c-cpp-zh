  md: '# 1.3 GEFREX


    # 1.3.1 General description


    The algorithm proposed is a GA. The genetic population is placed on a rectangular
    grid. The core of the algorithm foresees a number of iterations, each of them
    consisting of the choice of two parents, the generation of only one offspring
    and its re-insertion in the population. The genetic coding of the fuzzy rules
    involves only the premises of the rules. It will be demonstrated that in the least
    squares sense the best consequents can be found in a robust manner with a SVD
    algorithm regardless of whether or not the WS or the WM defuzzification is used.


    ![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_17_0.png)


    Figure 1.2 The GA used in GEFREX. Firstly, two parents are selected. Then, an
    offspring is generated. From the offspring the best consequents are computed.
    If the fitness improves the best value obtained so far, then the neuro hill climbing
    operator is used. Lastly, the individual is inserted in the population. The algorithm
    is repeated until the end criterion is met.'
  merge: -1
  img_proc: true
