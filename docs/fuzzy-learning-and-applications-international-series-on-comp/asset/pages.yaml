- pgno: 187
  md: 'in view of the implementation, it is the most popular approach which attempts
    to design control schemes where each subsystem is controlled independently based
    on local information. Considering a control system, a generic fuzzy controller
    can be implemented as


    ```

    Y_i = (X_1 × X_2) o R_f

    ```


    where R_f denotes the controller input/output fuzzy relation in V × V × W, V is
    the input space and W is the output space, X_1 and X_2 are the fuzzy variables
    obtained from the tracking error variable and its derivative, e_i and e_dot_i,
    respectively, Y_i is the fuzzy output of the controller, × denotes the Cartesian
    product and o denotes the maximum-minimum compositional rule of inference. When
    e_i and e_dot_i are calculated as fuzzy singletons as I_1 and I_2, respectively,
    and R_f is converted into the form of a look-up decision matrix Φ, the defuzzified
    controller output of the i-th subsystem can be expressed as


    ```

    u_i = GU_i * Φ(I_1, I_2)

    ```


    where Φ(I_1, I_2) is the element of Φ at the position Φ(I_1, I_2), I_1 and I_2
    are converted into index values of the decision matrix and GU_i is the output
    scaling factor. When a large-scale system has more than two input variables, it
    may be controlled by using multistage fuzzy controllers.


    # Definition 1.1 A multistage fuzzy system is defined as follows:


    In a multistage fuzzy system, the fuzzy rules use three kinds of linguistic variables.
    They are input variables, output variables, and intermediate variables. The input
    variables only appear in the antecedent part (i.e., IF-part) of fuzzy rules. While
    the output variables are found only in the consequent part (i.e., THEN-part) of
    fuzzy rules. Only intermediate variables can appear in both parts of fuzzy rules.


    Therefore, if a set of fuzzy rules contain intermediate variables, the rules are
    called multistage fuzzy rules. From a systematic point of view, intermediate variables
    refer to approximate outputs in current stage when humans are engaged in a complex
    activity such as decision-making. In rule representation, intermediate variables
    are included in THEN-parts in the current stage and in IF-parts of the next stage;
    the IF-parts variables in the current stage include the intermediate variable(s)
    of the previous stage and input variables. When facts are given, fuzzy rules in
    the present stage (except the final stage) are inferred; the consequence of an
    intermediate variable in the inference stage is passed to the next stage as a
    fact. Finally, the conclusions of the output variables are obtained from the final
    stage. Thus, in mimicking human knowledge by using intermediate variables, approximate
    concepts, which in some way are related to the system goals, are created in hierarchical
    structure. These approximate, qualitative concepts are hierarchically organized
    to provide'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'concept association and reasoning. Other possible architectures of multistage
    fuzzy logic inference are shown in Fig. 5.3 and Fig. 5.4.


    ![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_188_0.png)


    Figure 5.3 The skew-tree architecture of multistage fuzzy logic inference


    The architectures of Fig. 5.3 and Fig. 5.4 can support various structures involving
    skew tree and ternary tree, respectively. Assuming that there are five input variables,
    the architecture may have two stages with three input variables and single output
    for each stage, where every variable is characterized by seven fuzzy membership
    functions. When the number of input variables increases by one, the architecture
    can be designed as either skew-tree structure (e.g., Fig. 5.3) or ternary tree
    structure (e.g., Figure 5.4). Considering the architecture shown in Figure 5.3,
    there are six inputs and a single output, which then can be partitioned into three
    stages. The first inference stage has two inputs and single output while the second
    stage and the third stage have three inputs. The outputs of the first stage and
    the second stage are intermediate variables, which are passed on to their next
    stages as input facts. Thus, the total complete rule number in Fig. 5.3 has 1
    × 7² + 2 × 7³ = 735.'
