    # 8.8.3 FMS Performance Optimization


    No example of FMS performance optimization solved by the Hopfield neural network
    is available in literature. For this reason the authors can not compare the performance
    of the neural solution obtained using the coefficients found by the fuzzy approach
    versus the performance obtained using some other set of coefficients. What it
    is possible to say is that the choice of the values of the HCs was very hard.
    By using an heuristic approach (i.e., by manually varying the coefficients), the
    authors were not able to find a set of coefficients which guarantee valid solutions.
    The use of the Fuzzy method described in the previous section allowed to identify
    a set of coefficients which guarantee a high percentage of valid solutions. The
    set of coefficients that were found is


    ```

    HCs = { A = 80

    B = 385

    C = 295 } (8.32)

    ```


    and the percentage of valid and optimal solution can be assessed about at 25%.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 8.9 Conclusions


    The chapter has presented the use of fuzzy inferences for the automatic determination
    of the coefficients of the energy function linked to the surrounding conditions
    of the problem to be solved. Until now the only methodology known for this tuning
    is manual heuristic search, essentially based on the know-how of the human operator.
    This procedure is not only very time-consuming but it cannot assure optimal solutions.
    In fact, the set of coefficients determined could provide solutions which are
    very far from the optimal solution to the problem.


    The chapter has focused on the possibility of using the automatic HC search algorithm
    to reach two different goals. As has been stressed, it is, in fact, possible to
    force the automatic search towards coefficients which provide robust or good-quality
    solutions.


    This feature is particularly interesting as it allows us to meet the different
    requirements that arise when optimization methods are used. It is possible to
    find HCs that provide optimal solutions or coefficients which allow good solutions
    but of not such high quality, in exchange for a lower computational effort.


    The results reported in the chapter effectively show that the approach proposed
    features a search for the set of coefficients which guarantees valid solutions
    very close to the global minima of the energy function, or ones which guarantee
    very robust solutions. The robustness and quality features obtained were much
    higher than those provided by classical heuristic approaches.


    Due to the inherent features of this automatic tool based on fuzzy logic, we believe
    that it greatly enhances the real use of the Hopfield network for solving very
    complex optimization problems.'
  merge: -1
  img_proc: true
