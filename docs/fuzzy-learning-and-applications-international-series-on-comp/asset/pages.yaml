    # Figure 3.6 Agents Architecture Elements


    # Reactive control


    This is the most important and crucial agent, which implements some basic reactive
    behaviours. These make extensive use of fuzzy logic in the form of fuzzy rule
    bases. These rules have been obtained both from previous experience [50, 51] (and
    even trial and error) and fuzzy modeling techniques (as described in section 3.2).
    A human user executes some control commands based on sensory data (i.e., wall-robot
    alignment, speed control, and so on). These are recorded and then passed to one
    or more fuzzy modeling agents. The latter will perform some cluster analysis and
    then produce the required fuzzy rules. Thus using the MAS architecture (see sections
    3.3.2 and 3.4), these agents correspond to Rule Generation and Clustering ones.
    For the present application, we have identified and implemented the following
    reactive behaviours:


    +   - *obstacle-avoider*: drives the robot in the opposite direction to the nearest
    obstacle (Listing 5).

    +   - *align-right*: holds the robot at a given distance from the wall at its
    right (Listing 2).

    +   - *align-left*: holds the robot at a given distance from the wall at its left
    (Listing 2).

    +   - *move-to-goal*: drives the robot in the direction of the current goal.

    +   - *move-backwards*: drives the robot backwards to the opposite direction to
    the nearest obstacle (Listing 1).'
