    of the controller. In particular four kinds of disturbances were considered:


    +   - a set of step signals;

    +   - a Gaussian white noise with zero mean and unit variance;

    +   - a band-limited white noise;

    +   - a sequence of sinusoidal signals, which simulate the disturbance due to
    the disk rotations.


