- pgno: 129
  md: '# Genetic Operators


    Since solutions contain two different types of information (denoted as rule set
    and control set) it is necessary to use different genetic operators to achieve
    completely the recombination process. We have used the following genetic operators:


    +   - **Rule set genetic operators**

    +     - *Simple crossover*

    +     - *Arithmetical crossover*

    +     - *Max-Min crossover*

    +     - *Simple mutation*

    +     - *Non-uniform mutation*


    +   - **Control set genetic operators**

    +     - As control set is a bit string, simple binary crossover and mutation [27]
    are used in this case.


    # Parameters


    The most significant parameters used by GA have been maximal generation number
    ($T$), population size ($popsize$), probabilities F1, F2 and F3 used in obtaining
    initial population ($p_1$, $p_2$ and $p_3$, respectively), probability of crossover
    ($p_c$) and probability of mutation ($p_m$). Note that to achieve the generating
    and tuning task when there is no initial rule base, it is necessary to set $p_1
    = 0$, $p_2 = 0$ and $p_3 = 1$ in obtaining initial population. Note also that
    probabilities $p_c$ and $p_m$ correspond to the sums of the probabilities of all
    crossover and mutation operators respectively described above.


    # 3.5 Robotics Application Example


    # 3.5.1 Introduction


    The operation of a mobile autonomous robot in an unstructured environment, as
    it occurs in the real world, needs to take into account many details. Mainly,
    the controller has to be able to operate under conditions of imprecision and uncertainty.
    For instance, the a priori knowledge of the environment, in general, is incomplete,
    uncertain, and approximate. Typically, the perceptual information acquired is
    also incomplete and affected by the noise. Moreover, the execution of a control
    command is not completely reliable due to the complexity and unpredictability
    of the real world dynamics. To cope with these difficulties, the controller should
    respond reactively to unpredicted events as soon as they are perceived.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_130_0.png)


    The use of cooperative intelligent agents, which implement the navigational control
    by means of fuzzy logic, is highly recommended due to the nature of the behavior
    an autonomous robot must follow. Autonomous robots literature contains many examples
    of approximations that look for decompositions of the global control function
    in smaller ones named behaviours [48]. Each behaviour is responsible for producing
    certain actions (typically sensing and control actions) in order to accomplish
    or hold a given objective, such as avoid obstacles. This interpretation fits into
    the notion of agent. Agents are autonomous entities capable of developing tasks
    either by themselves or by collaborating with other agents. If, in addition to
    that, we want our agents to be able to operate under imprecise and uncertain environments,
    fuzzy logic has been proven to be a valuable framework [10]. Moreover, intelligence
    is the degree of reasoning and acquired behaviour: the agent ability to accept
    objectives given by the user and to carry on such tasks. At least, there should
    be some kind of orders, maybe in rules form, with an inference motor or another
    kind of reasoning mechanism to actuate over them. Thus, it is feasible to apply
    fuzzy logic to manage imprecision and uncertainty [7, 1, 61]. Upper intelligence
    degrees include a user model or another form of knowledge and reasoning about
    what the user wants to do, and planning the way to reach that goal.


    We will show how we put into practice these concepts by applying fuzzy logic in
    different aspects of a robot control application. As a test platform we have designed
    and built a custom autonomous mobile robot [50, 51], which is kinematically holonomic.
    The robot has a 40x40 cm square-shaped base'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'and 55 cm of height. It has differential steering, with two wheels driven by
    D.C. motors and two smaller casters to provide stability in all ways. The total
    weight is roughly 15 Kg (batteries included). A 486DX2 based board is in charge
    of processing, while a MC68HC11 based board is in charge of sensors data acquisition
    and actuators control. The robot presents the following sensors and actuators:


    +   - Two optical encoders mounted on the steering wheels.

    +   - Four Polaroid 6500 ultrasonic range sonars working at the same frequency.

    +   - A ring of switches mounted on bumpers to detect collisions.

    +   - Three proprioceptive sensors to measure batteries’ levels.

    +   - A LynxArm mechanical arm with 4 degrees of freedom.

    +   - A 256 gray scale tones QuickCam camera.


    In order for this simple robot to perform some relatively complex tasks, some
    tools and techniques are needed. In the following sections we will describe the
    techniques we use: the BG programming language, as the fundamental component of
    our architecture for autonomous mobile robots modeling, and its underlying blackboard
    based agent design. Next we will describe the different agents we have implemented
    and their decomposition in behaviours, and then how we apply learning techniques
    to the behaviour blending problem. Finally, we will present some results and conclusions.


    # 3.5.2 The BG programming language


    Several robot control languages have been proposed in the literature. Each one
    of them has its own pros and cons. As our main goal was to tackle the behaviour
    blending problem and the learning of the rules that drive the blending process,
    we chose COLBERT [39] as the working base. This makes extensive use of fuzzy rule
    bases both for the behaviours and the blender. As we wanted to try some different
    functionalities, we decided to define and implement a new high level programming
    language, named BG, which is based on the C language syntax and semantics and
    most of the COLBERT language features. It is based on the multi-agent paradigm,
    where each agent possesses a series of behaviours. Its intended use is robotics
    and control applications, mainly autonomous mobile robots. The examples in this
    chapter yield in the latter field, and it is supposed that a robot will execute
    them. In fact that robot is our custom one described in the previous section.
    The main goal of the language is to aid in the development cycle of robotics applications
    and in the behaviour modeling (as it is a robotics oriented high level language
    with built in fuzzy logic operations), as well as to expedite it (by using automated
    tuning systems). BG, in its current version, incorporates many traditional'
