- pgno: 236
  md: '# An Application of Fuzzy Modeling to Analysis of Rowing Boat Speed


    # Abstract


    Fuzzy modeling has distinct features, which are applicability to nonlinear systems
    and ability to extract knowledge. Fuzzy neural network (FNN) enables automatic
    acquisition of knowledge. The authors have proposed an uneven division of input
    space for the FNN which reduces the number of fuzzy rules without sacrificing
    the precision of the model.


    In many sports, nonlinear factors affect the performance. In rowing competitions,
    the performance criterion is the boat speed. In this chapter, fuzzy modeling is
    applied to reveal the relationships between the supplied power and the boat speed.


    The forces and the angles of on-water rowing are measured. The subjects are candidates
    of Japanese national team rowers. The total propulsive work, consistency and uniformity
    of the propulsive power were calculated from the force and the angle data. The
    relationships between these factors and the performance were identified with fuzzy
    modeling. Compared to linear regression, a more precise and simpler model was
    obtained.


    # 7.1 Introduction


    Fuzzy modeling [1] is a method to describe the characteristics of nonlinear systems
    using fuzzy rules. For automatic acquisition of fuzzy rules, combinations of fuzzy
    logic and neural networks have been studied [2]. The Fuzzy Neural Network (FNN)
    in [2] is capable of identifying fuzzy rules and tuning the membership functions
    by means of back propagation learning. This FNN has been applied to the fuzzy
    modeling of nonlinear systems.


    The authors have proposed a method of input space division [3]. The proposed method
    divides the input space unevenly according to the input-output relationships of
    the data. This method works effectively in reducing the number of fuzzy rules
    without sacrificing the precision of the FNN. It is easy to understand a concise
    model with a smaller number of fuzzy rules.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Many sports contain nonlinear problems. Nonlinear modeling is necessary to
    analyze the relationships between the performance and its influential factors.
    A precise and simple model of the performance will provide coaches and athletes
    with effective feedback.


    This chapter presents the study of a fuzzy modeling of rowing boat speed. Discriminant
    analysis of biomechanical factors was done for ergometer rowing [4]. This analysis
    obtained linear equations to classify novice, good and elite rowers. But, there
    is nonlinearity in the rowers-boat system. The proposed fuzzy modeling technique
    is applied to the analysis of rowing performance. In rowing races except for those
    of single scull, many rowers propel a boat together. The ultimate purpose is to
    run the boat faster than everyone else. Forces exerted by the rowers accelerate
    the boat. The boat speed is not linear to the sum of the forces. Hydrodynamic
    and aerodynamic resistances, which do not have linear characteristics, slow the
    boat down. There are nonlinear relationships between water, air, rowers’ motions
    and the boat speed.


    We have developed a measuring device of on-water rowing motions. It measures forces
    exerted on oars and angles of oars. Candidates of national team rowers participated
    the experiments. Three factors, which are total propulsive work, consistency of
    the power and uniformity of the power, are prepared for the fuzzy modeling from
    the measured data. The relationships between these factors and the boat speed
    are identified by a fuzzy model in this chapter.


    # 7.2 Complexities in rowing


    In rowing competitions, maximizing the boat speed is the purpose of coaches and
    rowers. The boat speed is the result of the following complex factors:


    +   1. Rowers propel the boat with oars. This process has nonlinearities because
    the body of a rower has multiple segments.

    +   2. Opposite direction force is generated to the boat when a rower moves forward
    or backward. The shift of the mass on the boat generates another complexity.

    +   3. Hydrodynamic and aerodynamic resistances decelerate the boat. These negative
    forces also have nonlinear characteristics.


    These effects are too complicated to analyze as a whole. This chapter focuses
    on the relation between the power supplied to the boat and the average speed of
    the boat. The forces exerted on oars and the angles of oars are measured during
    on-water rowing.


    Fuzzy modeling uses the following three kinds of data as its inputs to infer the
    boat speed: total work provided to the boat during the test, the consistency of
    the power and the uniformity of the power. It is natural to regard the propulsive
    work as an important determinant of the boat speed. It is said that'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'the volume of supplied power in a stroke should be kept the same as the other
    strokes for effective run of the boat. The uniformity of the power is the most
    distinctive character of rowing from any other sports.


    The relationships between the three factors and the boat speed are considered
    to be nonlinear. Fuzzy Modeling is applied to identify the relationships.


    # 7.3 Fuzzy modeling


    Distinct advantages of fuzzy modeling are linguistic expression with fuzzy rules
    and applicability to nonlinear systems.


    This section describes fuzzy modeling. Fuzzy neural network described in subsection
    7.3.1 is a combination of fuzzy inference and neural network. This combination
    enables automatic acquisition of fuzzy models. Uneven division of input space
    described in subsection 7.3.2 reduces the number of fuzzy rules. This allows constructing
    a comprehensive fuzzy model.


    # 7.3.1 Fuzzy neural network


    The FNN presented by the authors is a multi-layered back-propagation model with
    a specially designed structure for easy extraction of fuzzy rules from the trained
    FNN. We use Type I of the FNNs in [2]. Fig. 7.1 shows an example of the FNN.


    This is a case where the FNN has two inputs x1 and x2, one output y and three
    membership functions for each input. The Back Propagation (BP) learning algorithm
    can be applied to modify the connection weights wc, wg, and wb. Suppose the model
    has M-inputs and N-outputs; the following simplified fuzzy inference can be extracted
    from this type of FNN:


    ```

    R^i : IF x is A^i THEN y is B^i (7.1)

    ```


    ```

    x = (x1, x2, ..., xM), y = (y1, y2, ..., yN),

    A^i = (A1^i, A2^i, ..., AM^i), B^i = (B1^i, B2^i, ..., BN^i) (7.2)

    ```


    ```

    μ^i(x) = ∏_{m=1}^M A_m^i(x_m) (7.3)

    ```


    ```

    μ̂^i(x) = μ^i(x) / Σ_{j=1}^{NOR} μ^j(x) (7.4)

    ```


    ```

    y_n^*(x) = Σ_{i=1}^{NOR} μ̂^i(x) b_n^i (7.5)

    ```'
