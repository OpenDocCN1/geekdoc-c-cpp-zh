    # 10.4 Work-Load Characterization


    As mentioned above, to deal with the unpredictable nature of the work-load offered
    by the browsing process, we use a dynamic interval based approach where SIs are
    based on the limited a priori knowledge about the resource availability and the
    stored information being retrieved. In this section, we propose a set of three
    parameters that are used to characterize the capacity requirement profile of an
    SI; these include Required Amortized Capacity (RAC), Pre-fetch Activity Ratio
    (PAR) and Capacity Deviation (CD). RAC quantifies the capacity requirement of
    an SI while PAR and CD represent the destination buffering requirement. The algorithm
    (1) computes these parameters. In the following, we elaborate more on these parameters
    and the working of algorithm (1).


    RAC corresponds to the minimum capacity requirement of an SI to ensure synchronization.
    It is important to recognize that RAC is not an arithmetic mean of the capacity
    requirement computed over the SI; as in an SI, AUSs can be scheduled earlier but
    cannot be made late. In fact, capacity averaging effect within an SI can only
    be achieved based on the SI’s work-load profile. Algorithm (1) uses a priori knowledge
    about the temporal relationships among the AUSs to compute the RAC value. In the
    following, we first outline details of algorithm (1) for the computation of RAC
    value.


    Recall, from Section 10.2, that in order to facilitate synchronization, objects
    are segmented into AUSs of equal duration Δ. In algorithm (1), the term s_i/Δ
    represents the capacity requirement of an AUS_i with size s_i. Also, AUSs with
    the same presentation deadline are logically grouped together, as shown in Fig.
    10.2. Let an SI consist of L such groups represented by the set {G_1, G_2, …,
    G_L} with G_i denoting the group of AUSs that belong to the temporal period [(i−1)Δ,
    iΔ). The capacity requirement of group G_i is given by Σ_{AUS_j ∈ G_i} s_j/Δ.
    Algorithm (1) analyses the L groups of AUSs within the SI and computes RAC_i which
    denotes the minimum capacity required to ensure a timely delivery of all AUSs
    up to the i th period (or over time interval [0, iΔ)). At the (i+1)st iteration,
    based on the value for RAC_i, the algorithm checks whether or not the AUSs belonging
    to group G_{i+1} can be transported with RAC_i capacity. In other words, it compares
    the value for RAC_i with the capacity requirement of G_{i+1}. If G_{i+1} does
    not demand an increase in the overall capacity requirement, the value for RAC_{i+1}
    is set to RAC_i. Otherwise, RAC_{i+1} is updated, by allowing pre-fetching of
    relevant information of the (i+1)st period, as detailed in algorithm (1).


