  md: 'According to these criteria, we propose three different alternatives (F1, F2
    and F3) to initialize the solutions, which will be applied with probabilities
    p1, p2 and p3 respectively. F1 and F2 forms assume the existence of an initial
    rule base with k rules (1 ≤ k ≤ MAX).


    (F1) All k rules of the initial rule base are introduced in random positions of
    the solution, and corresponding values in the control set are set to 1. Remainder
    rules (MAX − k) are obtained randomly according to the domains of input and output
    variables, and corresponding values in the control set are set to 0.

    Example:

    Initial rule base (k = 4):

    R1 R2 R3 R4

    Initial solution (MAX = 7):

    Rnd R3 R2 Rnd R1 R4 Rnd 0 1 1 0 1 1 0

    where Rnd denote that a rule has been obtained randomly. Although other approaches
    can be used to obtain randomly fuzzy rules, we propose the following:

    For each trapezoidal fuzzy number ũ = (u1, u2, u3, u4) do

    Step 1. Δ ← (b − a)/(m − 1);

    Step 2. u1 ← random real number ∈ [a − Δ, b + Δ];

    u2 ← random real number ∈ [u1, b + Δ];

    u3 ← random real number ∈ [u2, b + Δ];

    u4 ← random real number ∈ [u3, b + Δ];

    where [a,b] is the domain of the variable, and m is the number of linguistics
    values associated with a variable (typically seven).


    (F2) Each rule of the solution, with equal probability, either is selected from
    the initial rule base or is obtained randomly. All values in the control set are
    generated randomly.

    Example:

    Initial rule base (k = 4):

    R1 R2 R3 R4

    Initial solution (MAX = 7):

    R2 Rnd Rnd R4 Rnd R1 Rnd 1 0 1 0 1 1 1


    (F3) All MAX rules of the solution and all values in the control set are obtained
    randomly.

    Example:

    Initial solution (MAX = 7):

    Rnd Rnd Rnd Rnd Rnd Rnd Rnd 0 1 0 1 1 0 1'
