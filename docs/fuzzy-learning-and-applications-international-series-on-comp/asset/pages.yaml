  md: '# Figure 8.3 The procedure for determining a suitable set of coefficients


    Fig. 8.3 illustrates the general procedure for determining a suitable set of coefficients.
    The Tolerance parameter is initially set at a reasonable high value and is lowered
    by a pre-defined amount indicated with δ, if the network reaches a valid, good
    solution. If it does not succeed in providing a valid good solution with a certain
    Tolerance value, the latter is increased, still by an amount δ. Following each
    increase or decrease in the Tolerance parameter, δ is halved. Increases and decreases
    in the Tolerance parameter are therefore made on the basis of a binary search
    in order to speed the search process up.


    The Enough Tries test refers to the attempt to find a valid, good solution with
    a certain Tolerance value. If no valid good solution is found after a pre-defined
    maximum number of iterations the Tolerance value is increased by δ.


    Vice versa, if after this maximum number of tries at least one valid good solution
    is found, then the Tolerance value is decreased by δ.


    The process of increasing or decreasing the Tolerance value ends when the parameter
    δ is lower than a previously defined threshold indicated with ε,'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 8.4.1 A Detailed Description of the Algorithm for Coefficient Determination


    guaranteeing the end of our procedure in a finite time interval. In this way it
    is possible to identify the minimum Tolerance values below which no good solution
    can be found.


    The flow-chart shown in Fig. 8.4 and named main() is a detailed description of
    the algorithm used to determine a suitable set of HCs for a generic Hopfield problem.
    The algorithm comprises a cycle, which is terminated by a comparison between δ
    and ε, as explained above. Within this cycle there is another one which modifies
    the coefficients and checks up on quality. This second cycle ends when a valid
    good solution is reached or when too many consecutive non-valid solutions have
    been found (i.e., Iterations≥IterDelta).


    If the cycle has ended because a valid good solution has been found, the Tolerance
    is decreased by δ; otherwise it is increased by the same amount. In any case,
    δ is halved.


    As seen in Fig. 8.4, at each iteration, the validity and the quality of the neural
    solution is tested. This is done by the GoodSolution() function, whose representative
    flow-chart is shown in Fig. 8.5. Essentially its dual task is to determine the
    Hopfield solution and evaluate it.


    Determination of the Hopfield solution is easily performed by iteration of the
    Hopfield network until it reaches a stable output.


    Evaluation of the Hopfield solution consists of testing whether the solution is
    valid and, if it is, whether it is a good one. If the solution is not valid, the
    cause of non-validity is evaluated. A variable, c, is considered, whose admissible
    values fall within the integer range of [0,Coefficients], where Coefficients represents
    the number of HCs involved in the optimization problem to be solved. It was assumed
    that all the surrounding conditions are numbered from 1 to Coefficient, so if
    c takes a positive value it identifies the surrounding condition which has caused
    the neural solution to be non-valid or, if the solution is valid but not good,
    the surrounding condition which has led to poor quality. If the solution is both
    valid and good, c = 0.


    It is often possible, depending on the initial conditions, that two or more consecutive
    solutions correspond to two totally different minima. We therefore decided to
    evaluate the neural solution considering a number of consecutive solutions. This
    number is indicated in Fig. 8.5 with IterMaxGood. We then considered a percentage
    of this value (indicated as PercIterMaxGood): if the number of valid good solutions
    (i.e., ones for which c = 0) is higher than this value, the set of coefficients
    determined is considered to be both valid and good. In this case, the set of HCs
    found is saved.


    As can be seen from Fig. 8.5, there is a cycle which ends either when the number
    of neural solutions determined (CountFuzzy) is equal to IterMaxGood'
