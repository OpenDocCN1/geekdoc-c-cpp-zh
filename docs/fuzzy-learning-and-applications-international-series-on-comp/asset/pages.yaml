    In summary, asynchronous nature of the browsing process, changing level of concurrency
    and characteristics of the member objects within an MMD, user interaction, etc.
    make the work-load generated by the server non-stationary in nature. This poses
    a new set of challenges in supporting multimedia Web applications that are quite
