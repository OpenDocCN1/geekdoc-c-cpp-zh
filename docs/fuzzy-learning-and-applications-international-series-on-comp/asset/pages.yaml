  md: '![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_194_0.png)


    # Figure 5.6 The architecture of multistage fuzzy logic inference


    +   4. Calculate the conclusion by deriving the consequences of intermediate output
    variables of the i-th stage, where i is not the final one, and normalize these
    derived consequences.

    +   5. Pass the conclusions in the i-th stage onto the next stage as input facts.
    By the similar process, the conclusion may be defuzzified and then passed onto
    the next stage as a fact when the conclusion is too fuzzy in the reasoning. Repeat
    step 1 to step 5 until the multi-stage fuzzy rules in all inference stages are
    inferred.

    +   6. Perform the conclusions of output variables of the final stage when all
    fuzzy rules in every stage have been inferred.

    +   7. Calculate defuzzification to obtain a singleton to be the control input.


