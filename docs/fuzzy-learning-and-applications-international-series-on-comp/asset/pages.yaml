  md: 'Using (11.46) we obtain:


    ```

    R_k(\underline{x}_0) = exp\left[ -\sum_{j=1}^{n} \frac{\left(x_{j0} - c_j^{(k)}\right)^2}{2\left(s_j^{(k)}\right)^2}
    \right]. \tag{11.48}

    ```


    Additionally, we assume that consequents B^{(k)} of k-th if-then rule have symmetric
    triangle (isosceles triangle) membership functions with the width of the triangle
    base w^{(k)}. For computing the system output we must calculate Area (B^{*(k)}).
    From (11.28) and (11.32) we have:


    ```

    B^{*(k)}(y) = I\left[R_k(\underline{x}_0), B^{(k)}\right] - \alpha_k. \tag{11.49}

    ```


    For implication satisfying condition I9 we assume:


    ```

    \alpha_k = 1 - R_k(\underline{x}_0). \tag{11.50}

    ```


    For example if we use the Reichenbach implication we get:


    ```

    Area\left(B^{*(k)}\right) = 2 \int_{y^{(k)} - \frac{w^{(k)}}{2}}^{y^{(k)}} \left\{
    I\left[R_k(\underline{x}_0), B^{(k)}\right] - \alpha_k \right\} dy =

    2 \int_{y^{(k)} - \frac{w^{(k)}}{2}}^{y^{(k)}} \left[1 - R_k(\underline{x}_0)
    + R_k(\underline{x}_0) B^{(k)} - 1 + R_k(\underline{x}_0)\right] dy =

    2 R_k(\underline{x}_0) \int_{y^{(k)} - \frac{w^{(k)}}{2}}^{y^{(k)}} \left[\frac{2(y
    - y^{(k)})}{w^{(k)}} - 1\right] dy = \frac{w^{(k)}}{2} R_k(\underline{x}_0) :=
    g\left[R_k(\underline{x}_0), w^{(k)}\right]. \tag{11.51}

    ```


    This situation is graphically illustrated in Figure 11.7.


    The respective formulas for g\left[R_k(\underline{x}_0), w^{(k)}\right] for other
    implications are presented in Table 11.2 (for simplicity, the abbreviated forms
    are used: R \triangleq R_k(\underline{x}_0), w \triangleq w^{(k)}). If we use
    symbols from the table, formula (11.45) has the form:


