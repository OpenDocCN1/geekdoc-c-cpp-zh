- pgno: 113
  md: 'share the same ADL definition could be implemented differently and even with
    different programming languages. ADL allows us to define agents in a hierarchical
    way, using the well known concepts of class and inheritance. Services offered,
    goals to achieve, resources needed, internal data structures and possible policies
    to apply can be specified with ADL as well. Examples of agent definitions using
    ADL can be seen in [43, pg. 73-80]. For the definition of a concrete agent, the
    following elements must be declared:


    +   1. Net address of the machine where the YP_agent is located.

    +   2. Default language to be used for writting ontologies.

    +   3. Default ontologies used, in the concrete application domain.

    +   4. C++ libraries used for implemententing services offered by the agent.

    +   5. Agents can be organized in a class hierarchy with inheritance, so this
    structure must be specified.


    # 3.2.7 Exchanging Information Objects with MAST


    Once we have defined agents that make up the systems, we should be able to exchange
    knowledge between them. CKRL(Common Knowledge Representation Language) [16] is
    the language used in MAST for declaring knowledge objects to be sent, received
    and managed by agents. It has been developed by the MLT Consortium under European
    ESPRIT PROJECT 2154.


    # 3.3 A MAS Architecture for Fuzzy Modeling (MASAM)


    In the following section, the MAS architecture for learning in the fuzzy modeling
    process is described. This architecture has been arranged to serve as a generic
    meta-learning mechanism based on agents. Nowadays, this system has been particularized
    to a GEneric data MINing System(GEMINIS) [14] in order to learn what data mining
    techniques can be suitable for a given learning task, learning requirements by
    the user and some data set features. What is proposed here is the use of this
    architecture for fuzzy modeling(FM).


    In the following, all agents taking some part in the system are presented.


    +   - User Agents: they behave as front-ends of the system. Their tasks are clearly
    separated in two groups:

    +     - User support tasks to help the user to manage the available modeling techniques,
    showing information about them, upgrading the system with new techniques, removing
    unsuitable techniques, relocating resources and so on.'
