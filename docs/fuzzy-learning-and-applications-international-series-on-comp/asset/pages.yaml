  md: '# A Novel Fuzzy Approach to Hopfield Coefficients Determination


    # Abstract


    The Hopfield-type neural model is a suitable tool for the solution of optimization
    problems featuring NP-hard computational complexity. The solution of such problems
    using a Hopfield model requires determination of the values of a certain number
    of coefficients linked to the surrounding conditions of the optimization problem
    itself. It is quite difficult to determine these values, because a heuristic search
    is necessary. This is not only time-consuming, but may lead to the determination
    of a set of coefficients which provide neural solutions that are far from optimal,
    or even non-valid ones. So far there have been no reported research in literature
    offering a general method for the search for coefficients which will guarantee
    optimal or close to optimal solutions. This chapter proposes a method which allows
    automatic determination of Hopfield coefficients. The results obtainable can be
    user-defined. It is, in fact, possible to specify whether the user wishes high
    quality solutions or prefers greater robustness, i.e., a high percentage of valid
    solutions.


    # 8.1 Introduction


    In literature there exists a category of combinatorics problems which are extremely
    complex, due to the need to explore all the possible solutions.


    For this reason heuristic solutions are often preferred; although they do not
    always guarantee optimal solutions, the computation times involved are limited.


    The autoassociative memory model proposed by Hopfield [1] has attracted considerable
    interest as a method for solving difficult optimization problems. Its particular
    capacity to solve NP-hard combinatorics problems in a very short time has led
    to the successful application of Hopfield networks to a large number of real problems
    [2–8].


    Many researchers have studied the properties of Hopfield networks for solving
    optimization problems [9,10]. It has generally been found that although these
    networks do produce some useful results, a great drawback is that at'
