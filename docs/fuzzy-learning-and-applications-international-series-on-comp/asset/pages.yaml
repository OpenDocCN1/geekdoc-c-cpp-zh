    easy to understand for coaches and athletes. The rules were reasonable. The more
    the total work was given, the faster the boat speed became. In the case where
    the total work was large and the consistency was high, the boat speed was very
    high. Nonlinear relationships were revealed by this model. The consistency did
    not affect the boat speed if the total work was not large. It had an effect only
