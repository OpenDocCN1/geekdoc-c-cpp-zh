    in the subthreshold, where the operation speed would become significantly degraded.
    Note, on the other hand, that this current mirror has with L^{M-1} output branches
    to generate the membership function output replicas s_ij|^r for 1 ≤ r ≤ L^{M-1}
    for the different rules. The second step is also realized in the label block and
