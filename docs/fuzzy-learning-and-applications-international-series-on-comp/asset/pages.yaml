    One problem with the SFBF model is that, since it must have as many units as classification
    classes, it cannot be used for complex classification tasks. This constraint can
    be removed by introducing a new level of competition among units. The new defined
    network, called Extended Simplified FBF system (ESFBF), possesses n_j units associated
    to each class j, for a total of J = Σ_{j=1}^I n_j units. During learning the output
    of each unit is computed and the best unit for each class is selected, i.e., for
    each class j the unit i_j^* ∈ Idx_j = {1,…,n_j} such that i_j^* = arg max_{i ∈
    Idx_j} {φ_i} is selected. In that way the number of selected units is equal to
    the number of classes and the learning rules of the SFBF network can be applied.
    Thus, at each learning step, only the selected rules have the weights changed.
    During the operational phase, the input pattern is classified by the class label
    associated with the unit having maximum activity.


