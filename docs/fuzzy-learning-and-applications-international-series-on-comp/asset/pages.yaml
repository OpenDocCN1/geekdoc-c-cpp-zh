    # 1.3.11 Computational complexity evaluation


    In this section an experimental study regarding the computational complexity of
    GEFREX in comparison with previous work is reported.


    The previous section showed that GEFREX achieves better results than previous
    works. Now it will be shown that GEFREX is able to reach a prefixed learning error
    in a shorter time than any other similar work. Furthermore, the improvement achievable
    with GEFREX increases with the number R of rules, i.e., the greater the R value,
    the greater the improvement.


    As explained before, GEFREX uses the SVD extensively. This operation is particularly
    onerous with regard to the CPU resource. More precisely, in GEFREX a SVD of a
    square matrix R × R is calculated for each iteration. Using the big oh notation
    [36] we can say that this SVD decomposition has a complexity O(R³) [19]. Although
    the C++ objects regarding the matrices have been completely rewritten and in spite
    of the fact that these objects were designed taking into account, above all, the
    final speed of all matrix operations (no matter what the memory allocation), the
    limitation of the polynomial complexity of the SVD remains. So it could seem that
    GEFREX requires a lot of computer resources in comparison with previous works,
    particularly when the number R of rules increases.'
