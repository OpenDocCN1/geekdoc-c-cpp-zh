    # 9.8 Implementation details


    The designed Fuzzy controller was implemented using an ST52 microcontroller manufactured
    by STMicroelectronics and was tested on the Philips ROM65200 CD-ROM system. ST52
    is a microcontroller that executes Boolean and fuzzy algorithms. The versatility
    of the I/O configuration of this microcontroller allows it to interface with a
    wide set of external devices such as D/A converters, power control devices (SCR,
    TRIAC) and external sensors. The ST52 is supported by the software tool Fuzzystudio
    3.0 which develops each project graphically and automatically converts it into
    an optimized microcode. The fundamental component of the chip is the fuzzy core,
    which consists of four 8-bit input channels, 16 membership functions for each
    input and two 8-bit outputs.


    Fig. 9.25 shows the control algorithm implemented in FuzzyStudio 3.0.


    Once the ST52 was programmed the microcontroller was inserted on a small board.
    The input of the ST52 was connected to the focus system output (focus error) while
    the output was connected to a suitable driver for the coil of the focus system.
    A set of measurements was performed validating the controller performance obtained
    in simulation.'
