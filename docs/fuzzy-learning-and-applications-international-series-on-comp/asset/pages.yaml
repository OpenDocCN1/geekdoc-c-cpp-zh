- pgno: 246
  md: 'Three factors, the total propulsive work, the consistency of power and the
    uniformity of power, were derived as follows:


    Propulsive power is the product of the propulsive force and the angular velocity
    of the oar. For the i-th oar (i = 1, ⋯, 4), the propulsive force F_ip is the product
    of the force F_i and cosine of the oar angle θ_i, given by the following equation:


    F_ip(t) = F_i(t) cos(θ_i(t))    (7.11)


    where t represents the time step. Angular velocity ω_i is the difference of the
    oar angle:


    ω_i(t) = θ_i(t) − θ_i(t − 1).    (7.12)


    The propulsive power of i-th oar is:


    P_ip(t) = F_ip(t) ω_i(t),    (7.13)


    omitting the oar outboard length. The total propulsive power at the t-th time
    step P(t) is the sum of those of the four oars:


    P(t) = Σ_{i=1}^{4} P_ip(t).    (7.14)


    The total work given to the boat is the sum of the total power during the 100
    m test:


    Total Work = Σ_t P(t)    (7.15)


    The consistency of power was given by the coefficient of variation of the supplied
    power for each stroke:


    Power Consistency = 100(1 − σ(P_j)/P̄_j)    (7.16)


    where P_j is the power supplied during the j-th stroke. σ(P_j) and P̄_j represent
    the standard deviation and the average of supplied power for strokes, respectively.


    The uniformity of power is the similarity of four oars on transition of supplying
    the propulsive power. The power uniformity at the t-th time step is given by the
    following equation:


    Power Uniformity(t) = 100(1 − σ_i(P_ip(t))/max_t(P̄_ip(t)))    (7.17)


    where σ_i(P_ip(t)) is the standard deviation of propulsive power for oars at the
    time step t. Average power for the four oars at the time step t is represented
    by P̄_ip(t). Maximal value of P_ip(t) normalizes the standard deviation of power
    at each time step. The average of Power Uniformity(t) during the test is used
    as the third factor.'
  merge: -1
  img_proc: true
