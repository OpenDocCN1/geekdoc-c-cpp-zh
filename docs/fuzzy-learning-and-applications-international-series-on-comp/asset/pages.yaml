    +   - **Coefficients of the fitness function.** In section 1.3.8 there is already
    an extensive explanation regarding the coefficients of the fitness function. So
    in this paragraph only some short guidelines regarding the choice of these coefficients
    are given.

    +   Generally, when no simplifications and no feature selection are required and
    the error cannot reach the 0 value, $K_{num}$=100, $K_{red}$=$K_{red_2}$=$K_{den}$=0
    and $K_{err}$=1 are fixed. These values are used in the examples reported in the
    chapter when they are not specified.

    +   When the user wants to simplify the final fuzzy system he can give a value
    to $K_{red}$ ranging from 0.1 to 0.01. Typically, 0.01 is a good choice. The same
    discourse is valid for $K_{red_2}$ when GEFREX is also used for the feature selection.


    +   - **Termination criterion.** Many termination criteria can be used to stop
    an iterative learning method. At the moment only two have been implemented in
    GEFREX: The maximum number of genetic iterations (number of offspring) and the
    final error to reach. Normally from 10000 to 100000 iterations are required for
    convergence. 10000 iterations are used in the examples reported in the chapter
