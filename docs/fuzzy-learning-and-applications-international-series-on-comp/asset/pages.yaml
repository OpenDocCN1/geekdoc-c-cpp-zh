  md: '+   - *noise*: drives the robot in a random direction to escape from a hole.


    The blending fuzzy rules (Listing 6) have been derived manually by trial and error.
    As an example, it is worth noting how we obtained the move-to-goal behaviour.
    We used a robot simulator and drove the robot performing a line following. This
    line was supposed to be the goal heading at each instant. The control and line
    heading data were passed on to a tabu search based fuzzy clustering agent (see
    3.4.2). Then the result (fuzzy clusters) was used as the basis of the rule generation
    agent (see 3.4.3).


    # Vehicle control


    This agent is composed of two kinds of behaviours: sensor related and actuator
    related ones. The first are in charge of processing and filtering the information
    provided by the sensors, and the second are in charge of sending the right signals
    to the actuators to perform the given control commands. In our system we have
    the following behaviours:


    +   - Range sensors acquisition and filtering.


    +   - Collision detection.


    +   - Robot control vector (v, θ) execution.


    The navigation of the robot depends completely on the range information. Ultrasounds
    [12] are characterized by producing an imprecise perception of the environment,
    due to well-known problems: crosstalking, noise, and low reliability over polished
    surfaces at incidence angles greater than 15 degrees. Due to this, a failure in
    the ultrasonic subsystem can condition the performance of the whole system. To
    avoid the special treatment of these situations by all dependent agents, some
    agents are designed to get the ultrasonic information, process it, and give a
    reliable result. This method reduces the complexity of the system and, moreover,
    increments the reliability of it. To accomplish this, a fuzzy filter [22] is applied
    to each of the ultrasonic sensors. Basically, it is composed of three parts: a
    state memory, a predictor block, and an inference block. The memory block will
    remember the last n readings of the sensor. The predictor block will estimate
    the next sensor value. The inference block will give an output fusing the input
    value and the estimated one, trying to discard the a priori bad readings.


    The state memory is implemented as a finite array of values. The predictor block
    implements a simple Kalman filter: the average of the state memory values. The
    inference block is implemented by way of a fuzzy inference system. The whole fuzzy
    filtering block works in the following way:


    +   - The predicted measure is calculated, based on the state memory by the predictor
    block.'
