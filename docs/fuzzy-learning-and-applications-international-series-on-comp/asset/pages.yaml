    \ on the channel that yields the transmission start time of an AUS closest to\
    \ its playout deadline. In this regard, B-ECT heuristic articulates a controlled\
    \ pre-fetching of multimedia data. The B-ECT algorithm is outlined in the following,\
    \ using the same set of notation as used earlier in describing F-ECT algorithm.\n\
    \n# Backward-Earliest Completion Time (B-ECT) Algorithm\n\n+   - **B-ECT.1** Sort\
    \ AUSs to be scheduled during the SI in non-decreasing order of their playout\
    \ deadlines. Put the sorted AUSs in a list W. If two AUSs have the same deadlines,\
    \ then apply the shortest processing time (SPT) rule, i.e., the AUS with a smaller\
    \ size precedes the one with a larger size.\n+   - **B-ECT.2** Initialize S_j\
    \ := ∅ and α_j := max₁≤i≤n {d_i} for all j.\n+   - **B-ECT.3** Starting from the\
    \ tail of the list, schedule each AUS on the channel that maximizes its start\
    \ time, i.e.,\n+   \n+     S_j = {AUS_(i)} ∪ S_j if j = argmax₁≤k≤m {min{d_(i),\
    \ α_k} − s_(i)/c_k − J_k}.\n+   - **B-ECT.4** Update α_j to α_j = A_(i) − s_(i)/c_j.\n\
    +   - **B-ECT.5** Repeat Steps 1 to 4 until all AUSs in SI have been scheduled.\n\
    \nFor the cases where resources are severely constrained and multimedia presentation\
    \ cannot be supported without degrading the performance, both F-ECT and B-ECT\
    \ algorithms result in uncontrolled data losses due to buffer overflow or deadline\
    \ misses. In the following, we present an AUS-Filtering (AUS-F) algorithm that\
    \ addresses a resource constrained setup by following"
