    e.g., *Variable Bit Rate (VBR)* video source. In particular, traffic variations
    within a multimedia object are due to inter-frame compression employed to reduce
    object size, etc. On the other hand, traffic generated by a multimedia server
    contains not only intra-object variations but also variations due to browsing
