  md: 'productivity of the FMS as a whole.


    One of the most known theoretical solutions to this problem is presented in [31].
    The approach proposed is based on the use of Event Graphs, which is a Petri Net
    [32,33] in which each place (graphically represented by a circle) is connected
    with only one output transition (graphically represented by a thin bar) by means
    of an arc going from the place to the transition and with only one input transition
    by means of an arc going from the transition to the place. Like Petri Nets, in
    a Event Graph each transition can have an associated firing time, in which case
    the Event Graph is called timed, and each place can contain one or more tokens
    (graphically represented by black dots). The arrival of a token in a place enables
    firing of the output transition for that place. Firing may occur in null time,
    if the transition is immediate, or in the time associated with the transition
    if it is timed. When the fire occurs, the token is removed from the input place
    and transferred to the output place for the transition which fired.


    Modelling an FMS by Event Graphs is very easy and consists of representing each
    FMS resource (buffer, machine, robot, etc.) by a place and each activity performed
    by a resource by a transition, to which the time required to complete the activity
    is associated [31] [32] [34].


    An Event Graph is said to be strongly connected if there is a sequence of transitions
    connecting any pair of places in the graph.


    In a strongly connected event graph we can identify elementary circuits, each
    of which is a sequence of transitions that goes from one place back to the same
    place, while any other place is not repeated. A particular elementary circuit
    is called the command circuit, and specifies the operations sequentially performed
    by a single resource. For a more detailed explanation of the theory related to
    strongly connected event graph, the reader is suggested to refer to [31] [34].


    Let Γ be the set of elementary circuits in the Event Graph, M(γ) the number of
    tokens in the generic elementary circuit γ ∈ Γ, μ(γ) the sum of all the firing
    times of the transitions belonging to the elementary circuit γ, Γᶜ the set of
    command circuits, γᶜ the generic command circuit ∈ Γᶜ, Γ* = Γ − Γᶜ and γ* the
    generic elementary circuit ∈ Γ*.


    As shown in [31], the FMS optimization problem, for a strongly connected Event
    Graph, can be formulated as:


    ```

    minimize(∑ᵢ₌₁ⁿ uᵢ · xᵢ) (8.16)

    ```


    where uᵢ are positive integer numbers, called P-Invariants [32] [33], xᵢ represents
    the number of tokens in place Pᵢ, and n is the number of places of the Event Graph.
    Condition (8.16) must be constrained by:'
