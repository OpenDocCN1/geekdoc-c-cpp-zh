  md: 'maintain a given distance from the robot to a wall, it can be accomplished
    with the following code (Listing 2). Right is the input variable that measures
    the distance from the robot to the wall at the right. Turn is the output variable
    that controls if the robot should steer to the left (fuzzy sets TSL and TL), to
    the right (fuzzy set TSR) or none (fuzzy set TN).


    # Grid based calculations


    The BG language provides a basic structure (grid) and methods to manage bidimensional
    spatial information. When a grid is initialized, the user provides three parameters:
    the number of square cells (N and M, for a N × M matrix) and the length in metres
    of the cell sides. The left-bottom cell is used as the origin of co-ordinates.
    Each cell has a value, ranging from 0 to 1, corresponding to the degree of certainty
    that the cell is an obstacle [26]. As the robot moves, the following data are
    processed:


    +   - The current absolute location (x, y) of the robot.

    +   - The current absolute location (x, y) of the goal place.

    +   - The absolute location (x, y) of a possible obstacle.

    +   - A relative sonar reading (x, y, θ, sonar_measure) from the given absolute
    location.


    Using a triangle scan-line algorithm, the values of the cells that are in each
    sensor cone are updated: the certainty of being a free cell is augmented inside
    the cone, and is reduced along the base of the cone. With these values an A* algorithm
    searches for the shortest path to the goal from the current robot position. Then
    an absolute heading, which can be used for planning, is returned. A typical example
    of grid use is shown below (Listing 3). The robot has four sonar sensors (sonar0,
    sonar1, sonar2, sonar3), at different angles (+40, +15, -15, -40 degrees). For
    each control loop cycle, the current location and the current goal are updated.
    If the sonar measures are less than a given value (5 metres) the grid is updated
    with them. As a result, the variable heading is updated using the A* output.


    # Agents and behaviours definition


    The organizational units in the BG language are based in the agent notion [32].
    We arrange these agents using a blackboard based architecture [31, 59] as the
    main paradigm for communication and control. Under this model, a series of agents
    (also known as knowledge bases) share the available information about the system
    and the environment. Each agent can read from the blackboard the information that
    is relevant for it, perform its own processing, and then write each possible result
    onto the blackboard. The proposed architecture has been designed according to
    the following principles:'
