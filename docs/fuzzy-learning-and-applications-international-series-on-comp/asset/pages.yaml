    # 3.6 Conclusions and Future Work


    In this chapter a multiagent system for fuzzy modeling based on learning agents
    that implement different intelligent techniques is described. This architecture
    lets the user analyse the combination of different techniques that can be applied
    to the identification of a model by means of the integration and collaboration
    of the agents that encapsulate the intelligent techniques. Due to the use of several
    learning techniques, the system will tend to use those techniques that produce
    better results for each particular task. Our fuzzy modeling schema could use different
    agents that implement:


