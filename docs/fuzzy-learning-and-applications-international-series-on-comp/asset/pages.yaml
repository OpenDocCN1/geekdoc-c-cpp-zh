  md: '# 9.6 The indirect optimization strategy


    In this section a different optimization strategy is used to design the fuzzy
    controller for the focusing system. More specifically a 2-step optimization strategy
    is adopted. The first step uses a genetic optimization strategy to derive a fuzzy
    controller which approximates the classical PD. The classical PD controller described
    in Section 4 was discretized as follows:


    y(k) = a e(k) + b de(k) (9.6)


    where y is the controller output, e is the error signal (difference between the
    reference and the output of the system) and de is the error derivative. The controller
    output was then computed for a number of (e, de) values and the patterns obtained
    were used as training patterns for a neuro-fuzzy network. At the end of the training
    a set of fuzzy rules which interpolates the classical PD controller is obtained
    (FC1). The FC1 rules do not introduce any improvement with respect to the classical
    PD. The FC1 rules were then used as a starting point for a second optimization
    phase, i.e., the initial population for a GA was built allowing a variation of
    10% around the membership function and the consequents of the FC1 rules. A GA
    was therefore used to minimize the quadratic performance index used in the direct
    approach. Finally, a set of optimized fuzzy rules representing the fuzzy controller
    was obtained (FC2).


    # 9.6.1 Approximation of the classical controller by a set of fuzzy rules


    In order to perform the desired approximation, the classical controller is simulated
    using a white noise as input. The simulation allows us to obtain the set of I/O
    values which can be used to identify the fuzzy model of the controller. After
    a trial and error phase, five fuzzy sets were chosen for each of the input variables.
    Both the membership functions and the consequences were maintained symmetrical
    with respect to the origin. The number of fuzzy sets and rules was selected a
    priori and a genetic algorithm was used to train the neurofuzzy network to minimize
    the quadratic error between the target and the output of the fuzzy controller
    on the whole set of learning patterns. The genetic algorithm parameters were fixed
    as follows:


    +   - population size: 40;

    +   - number of generations: 60;

    +   - range of the error variable: [−0.01, 0];

    +   - range of the error derivative variable: [−0.001, 0];

    +   - range of the consequents: [−0.03, 0]


    The fuzzy rules obtained are given in Fig. 9.10.'
