- pgno: 384
  md: '# 11.4 Fundamentals of fuzzy systems


    In approximate reasoning realized in fuzzy systems the if-then fuzzy rules play
    an essential role. Often they are also used to capture the human ability to make
    a decision or control in an uncertain and imprecise environment. In this section
    we will use such fuzzy rules to recall the important approximate reasoning methods
    which are basic in our further considerations. Assume that m numbers of n-input
    and one-output (MISO) fuzzy if-then rules are given. The k-th rule in which the
    consequent is represented by a linguistic variable Y may be written in the following
    forms:


    ```

    R^{(k)} : if X₁ is A₁^{(k)} and ... and Xₙ is Aₙ^{(k)} then Y is B^{(k)}    (11.23)

    ```


    or in a pseudo-vector notation


    ```

    R^{(k)} : if X̲ is A̲^{(k)} then Y = B^{(k)},    (11.24)

    ```


    where:


    ```

    X̲ = [X₁ X₂ ... Xₙ].    (11.25)

    ```


    X₁, X₂, ..., Xₙ and Y are linguistic variables which may be interpreted as inputs
    of a fuzzy system and the output of that system. A₁^{(k)}, ..., Aₙ^{(k)} are linguistic
    values of the linguistic variables X₁, X₂, ..., Xₙ and B^{(k)} is a linguistic
    value of the linguistic variable Y.


    A collection of the above written rules for k = 1, 2, ... K creates a rule base
    which may be activated (fired) under the singleton inputs:


    ```

    X₁ is x₁₀ and ... and Xₙ is xₙ₀    (11.26)

    ```


    or


    ```

    X̲ is x̲₀.    (11.27)

    ```


    It can easily be concluded from (11.22) that such a type of reasoning, where the
    inferred value of k-th rule output for crisp inputs (singletons), may be written
    for logical implication interpretation in the form:


    ```

    B^{I(k)}(y) = Rₖ(x̲₀) ⟹ B^{(k)}(y) = I(Rₖ(x̲₀), B^{(k)}(y))    (11.28)

    ```


    and for conjunctive implication interpretation:


    ```

    B^{I(k)}(y) = Rₖ(x̲₀) *ₜ B^{(k)}(y) = *ₜ(Rₖ(x̲₀), B^{(k)}(y)),    (11.29)

    ```


    where ⟹ stands for fuzzy implication, *ₜ for t-norm T and


    ```

    Rₖ(x̲₀) = A₁^{(k)}(x₁₀) and ... and Aₙ^{(k)}(xₙ₀) = A̲^{(k)}(x̲₀)    (11.30)

    ```'
