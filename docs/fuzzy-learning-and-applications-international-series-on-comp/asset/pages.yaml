    # 6.3 Learning Fuzzy Systems


    # 6.3.1 History


    A very first introduction of learning fuzzy systems was in 1979 when Procyk and
    Mamdani [23] proposed a Self-Organising Control (SOC) policy for fuzzy controllers
    which was able to develop and improve as more data became available. There were
    some further studies exploring the concept of SOC [5]. The other method to aggregate
    the learning ability of fuzzy systems is to use the learning ability of Neural
    Networks (NNs) [8]. The combined system is known as a neural-fuzzy system [2,
    12, 10, 28]. The advantage of this method is that we are able to use the properties
    and training algorithms developed for neural networks in “learning” the underlying
    parameters of a neural-fuzzy system.


    # 6.3.2 Neural-fuzzy Systems


    A strong synergetics relationship between fuzzy system and neural network exists
    that has been exploited to integrate fuzzy and neural systems. There are mainly
    two ways that the integration of these two systems can work. Either the neural
    network is used to realise a fuzzy system or the fuzzy system is used to influence
    the dynamics of a neural network. When a fuzzy concept is used to assist a neural
    system it is referred to as a fuzzy-neural system. When a neural network assists
    a fuzzy system to induce rules or tune the membership functions it is referred
    to as a neural-fuzzy or neuro-fuzzy system [21]. It is to be noted that the terminologies
    neural-fuzzy and fuzzy-neural are widely used interchangeably in the literature,
    though we insist on using the term neural-fuzzy for learning fuzzy systems where
    the neural network is used to emulates fuzzy system features, such as rules, membership
    functions and inference mechanism.


    One of the main advantages of learning fuzzy systems over classical learning systems
    and neural networks is their ability to utilise intuitive knowledge, which may
    be presented in a linguistic form. Though, once the membership functions and rules
    of the system are stored, it is desirable to preserve the'
