- pgno: 161
  md: 'We show the details on how gradient descent can be applied to the FBF network
    and we compare, on a handwritten digit recognition task, its performances versus
    two other learning machines, namely Multi-Layer Perceptrons (MLPs), and Radial
    Basis Functions Networks (RBF). Moreover, we discuss a structural feature of the
    proposed model, i.e., the Semantic Phase Transition observed when passing from
    the training of a model with less rules than classification classes to a model
    with a number of rules which is equal to or greater than the number of classification
    classes.


    The performance of the FBFNs are very interesting; however, very often, the resulting
    systems are very complex and may require long training times. Thus, it is of paramount
    importance to devise simple systems which are fast to train and still hold a very
    good generalization performance. For this reason, starting from the original formulation,
    it is possible to derive a simplified version of the model (SFBF), faster in training
    and still retaining much of the performance in classification of the original
    model. In fact, at the expenses of an increased training time, but still not so
    heavy as in the case of the original model, the SFBF model can be improved by
    introducing competition among rules belonging to the same class.


    Finally, we show that performance can be further improved in a significant way
    by using the k-Nearest-Neighbour (k-NN) Rule [8] over input instances which cannot
    be classified with high confidence by the SFBF system. This time, the computational
    cost which must be paid for the increase in generalization is in terms of the
    average response time of the system. The tradeoff between the increase in performance
    and response time can be controlled by using both off-line or on-line editing
    strategies for the k-Nearest-Neighbour Rule.


    # 4.2 The Fuzzy Basis Function Network


    Fuzzy Logic Systems with *singleton fuzzification*, *max-product* composition,
    *product inference* and *height* defuzzification can be represented as [19]


    $$y = f(\mathbf{x}) = \sum_{l=1}^{M} \bar{y}^l \phi_l(\mathbf{x}) \tag{4.1}$$


    where $\bar{y}^l$ denote the center of gravity of the output fuzzy set, and $\phi_l(\mathbf{x})$
    are called *fuzzy basis functions* and are given by


    $$\phi_l(\mathbf{x}) = \frac{\prod_{i=1}^{p} \mu_{F_i^l}(x_i)}{\sum_{l=1}^{M}
    \prod_{i=1}^{p} \mu_{F_i^l}(x_i)} \tag{4.2}$$'
  merge: -1
  img_proc: true
- pgno: 162
  md: "where l = 1, 2, ..., M. We can refer to these FLS as fuzzy basis expansions\
    \ or networks of fuzzy basis functions (FBF network)¹. The relationships between\
    \ fuzzy basis expansions and other basis functions have been extensively studied\
    \ in [15].\n\nIt is worth noting that the FLS with universal function property\
    \ studied by Mendel and Wang [28, 29], which is a singleton FLS using product\
    \ inference, product implication, Gaussian membership and height defuzzification,\
    \ can be rewritten as a FBF network expansion². The universal function approximation\
    \ property gives a strong mathematical ground when applying FLSs in critical applications,\
    \ ranging from control, to time series prediction, to pattern recognition.\n\n\
    In this chapter we study a fuzzy logic system based on a Multi-Input-Multi-Output\
    \ (MIMO) version of this FBF network. Specifically, if there are K units in the\
    \ input layer, J fuzzy inference rules and I outputs, the rule activations can\
    \ be expressed as:\n\n```\nr_j = ∏_k μ_{jk}(x_k),    (4.3)\n```\n\nwhere μ_{jk}(x_k)\
    \ is the value of the membership function of the component x_k of the input vector\
    \ for the jth rule and is defined as:\n\n```\nμ_{jk}(x_k) = exp( - (x_k - m_{jk})²\
    \ / (2σ²_{jk}) ),    (4.4)\n```\n\nwhere m_{jk} and σ²_{jk} are the means and\
    \ the variances of the Gaussian membership functions. The values of the output\
    \ units are:\n\n```\ny_i = (∑_j r_j \bar{y}_{ij}) / (∑_j r_j) = ∑_j \bar{y}_{ij}\
    \ φ_j(x) ,    (4.5)\n```\n\nwhere \\bar{y}_{ij} is the center of gravity of the\
    \ output fuzzy membership function of the jth rule associated with the output\
    \ y_i,³ and\n\n```\nφ_j = (∏_k μ_{jk}(x_k)) / (∑_j ∏_k μ_{jk}(x_k))    (4.6)\n\
    ```\n\nis the fuzzy basis function associated to rule j, and represents its normalized\
    \ activation."
