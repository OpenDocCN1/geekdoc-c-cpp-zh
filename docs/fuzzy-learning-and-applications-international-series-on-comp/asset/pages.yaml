- pgno: 230
  md: 'maximum and minimum limits of fuzziness after adaptation. If the similarity
    between the initial membership function and the membership function during training
    is measured, when the similarity measure exceeds its limit, the linguistic meaning
    assigned to the membership function is said to be lost.


    # 6.5.2 Constraint Learning Rule


    Consider the updating rules given in Equations (6.6-6.8). They can be modified
    for constraint learning by updating the parameters after each iteration using
    the following update rule.


    B''_i = B_i - η ∂J/∂B_i × ℛ_{B_i} (6.12)

    c''_{j,k} = c_{j,k} - η ∂J/∂c_{j,k} × ℛ_{c_{j,k}} (6.13)

    σ''_{j,k} = σ_{j,k} - η ∂J/∂σ_{j,k} × ℛ_{σ_{j,k}} (6.14)


    The restriction functions, ℛ_σ, ℛ_c and ℛ_B, are introduced to limit the freedom
    of updating the parameters and they are governed by the following equations.


    ℛ_σ = 1/(1 + e^{-(σ-σ̲)/ν_σ}) - 1/(1 + e^{-(σ-σ̄)/ν_σ}) (6.15)

    ℛ_c = 1/(1 + e^{-(c- c̲)/ν_c}) - 1/(1 + e^{-(c- c̄)/ν_c}) (6.16)

    ℛ_B = 1/(1 + e^{-(B- B̲)/ν_B}) - 1/(1 + e^{-(B- B̄)/ν_B}) (6.17)


    where ν_σ, ν_c and ν_B are respectively dispersion parameters of σ, c and B. These
    are introduced so that a “gentle roll off” is achieved. As the parameters approach
    their predefined maximum and minimum limits, smaller and smaller updates are performed.
    By controlling the parameter ν, this can be controlled.


    Hence, regardless of whether or not a minimum solution for the cost function,
    J, is achieved or not, the restriction bounds do not permit the free parameters
    to move beyond the defined limits. It preserves the interpretation at the possible
    expense of yielding a less optimal solution.


