    # Figure 6.4 Neural network representation of a fuzzy system with 2 inputs, 3
    membership functions for each input, 9 rules and 1 output


    linguistic information. That is, one would like to be able to use the same intuitive
    understanding, which was used to create the fuzzy system, to interpret its behaviour
    at all times in the future. In general, this ideal cannot be guaranteed in a learning
    fuzzy system.


    A neuro-fuzzy model is built using a multilayer neural network and it has a total
    of five layers [14]. A neuro-fuzzy model with two inputs and a single output is
    considered here for convenience and it is shown in Figure (6.4). Accordingly,
    there are two nodes in layer 1 and one node in layer 5. Nodes in layer 1 are input
    nodes that directly transmit input signals to the next layer. Layer 5 is the output
    layer. Nodes in layer 2 and 4 are “term nodes” and they act as membership functions
    to express the fuzzy values of linguistic variables. Each node of layer 3 is a
    “rule node” and represents a single fuzzy rule [6]. In total, there are K1 × K2
    nodes in layer 3. K1 and K2 are the number of individual membership functions
    for each input.'
