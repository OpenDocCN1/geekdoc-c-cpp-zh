  md: 'is the approach taken by hybrid systems. Over the past few years we have seen
    an increasing number of hybrid algorithms, in which two or more soft computing
    technologies have been integrated to improve the overall algorithm performance
    [11].


    Those hybrid systems are composed of several different and interchangeable techniques.
    The best combination of such techniques may vary from problem to problem. This
    leads us to the idea of a multiple loosely coupled co-processing distributed system.
    Each technique can be developed as a system component and encapsulated to offer
    a homogeneous interface in a distributed environment. Mechanisms apt for intelligent
    cooperation among these components (agents) should be supported to allow the design
    and implementation of cooperative distributed applications.


    In this chapter we propose the use of intelligent agents which collaborate by
    means of a multiagent architecture, as a framework to investigate different learning
    techniques in a fuzzy modeling context. This approach involving agents, which
    embody the different problem solving methods, is a potentially useful strategy
    for enhancing the power of fuzzy modeling systems. Our objective is to show how
    this framework let us experiment with different techniques in order to select
    the combination that better approximated the system behavior.


    # 3.2 Fuzzy Modeling and Agents


    In recent times, several different techniques, which may be subsumed in the frame
    of Soft-computing, have appeared in the literature related with fuzzy modeling.
    Thus we find proposals that include fuzzy neural networks [58], and fuzzy subset
    theory combined with descent gradient techniques [62], or with clustering techniques
    [63, 62, 8], etc. ... Recently combinations of those techniques have been used
    to try to solve different problems related with systems modeling [60, 55].


    Fuzzy modeling is an approach used to form a fuzzy systems model. In fuzzy modeling,
    the most important problem is the identification method of a system. The identification
    of a fuzzy model using input-output data such as the ones we are concerned with
    consists of two aspects: structure identification and parameter identification
    [54]. Fuzzy modeling is based on the idea of finding a set of local input-output
    relations describing a process. So it is expected that the method of fuzzy modeling
    can express a nonlinear process better than an ordinary method. A fuzzy model
    consists of a number of fuzzy if-then rules. There are two parts in a fuzzy rule:
    the premise and the consequent part. These parts are formed by the combination
    of fuzzy sets defined in the different domains of the variables. Each input-output
    relation is described by a fuzzy rule. The fuzzy rules are formed by partitioning,
    in a fuzzy way, the'
