  md: 'is reached. ε has to be as low as possible to make the search for an optimal
    set of HCs as exhaustive as possible. It should be noted, however, that too low
    an ε value could make the calculation time too long. Lastly, δ has to be chosen
    according to the Tolerance value, bearing in mind that it represents the first
    increase or decrease performed on Tolerance (0.5·Tolerance is a cautious choice).


    The only three parameters that really affect the results of the method proposed
    are IterDelta, IterMaxGood and PercIterMaxGood. According to their value they
    can affect the set of HCs determined as they are evidently correlated with the
    quality and robustness of the solutions.


    More specifically, as IterDelta increases a greater number of attempts are made
    to find a good solution before increasing δ. This parameter thus directly affects
    the quality of the neural solution and an increase in it means trying to obtain
    better-quality solutions.


    The other two parameters - IterMaxGood and PercIterMaxGood - are decisive in determining
    the robustness of the solution. As the ratio PercIterMaxGood / IterMaxGood tends
    towards 1, in fact, HCs which make the neural network converge are always sought.
    It should be pointed out that an increase in PercIterMaxGood may cause a degradation
    in the quality of the solution. Asking for a large number of valid good solutions,
    in fact, may lead to a search for such a “flat” energy function minimum as to
    guarantee a large number of valid good solutions. But this minimum, which is difficult
    to get out of, may also turn out to be a local one.


    The parameter IterMaxGood also affects the quality of the solution on its own.
    The greater the number of solutions found, the higher the probability of finding
    one very close to optimal.


    Being able to set these parameters arbitrarily is, in our opinion, very important,
    as the user of an optimizer based on a Hopfield model may prefer a close to optimal
    solution obtained in a few attempts to the optimal one that can be obtained with
    a much larger number of tries. Vice versa, he may require the best solution whatever
    the price in terms of time.


    # 8.7 Description of the Fuzzy Inferences trained


    With FuGeNeSys we trained two separate fuzzy inferences. The first, which we called
    Fuzzy Worst Case Modifier (FWCM), refers to modification of the Hopfield Network
    coefficient which has caused the solution to be non-valid or not good. The second
    inference, called the Fuzzy Mean Modifier (FMM), refers to modification of the
    mean of the remaining coefficients. It should be pointed out that the fuzzy approach
    proposed behaves differently according to whether the FWCM refers to a coefficient
    causing non-validity or poor quality. In the former case, the FMM output is used
    to modify all the remaining coefficients.'
