  md: '# 10.2 Quality and Synchronization Requirement of Multimedia Information


    In contrast to live data, the multimedia Web applications provide more flexibility
    in enforcing synchronization. This is because the multimedia server can regulate
    the transmission rates of data streams. In this Section we elaborate on the synchronization
    and presentation requirements of multimedia information in a multimedia Web environment.


    # 10.2.1 Synchronization Requirements


    Synchronous playback of multimedia information at the client site requires enforcing
    intra and inter-object temporal relationships. Intra-object synchronization mechanisms
    are required to smoothen the delivery of multimedia objects and to minimize the
    impact of jitter delay over the presentation process. Failure of such synchronization
    can cause unacceptable interruptions at the time of presentation. For example,
    for NTSC quality video transmission, we must ensure a delivery rate of 30 frames
    per second to avoid unpleasant interruptions. On the other hand, inter-object
    synchronization needs to be observed to avoid the so called lip-sync problem [20].


    In a networked environment, synchronization is typically observed by segmenting
    each media object into a stream of some generic Atomic Unit of Synchronization
    (AUS). The transmission of an object then implies the transmission of a stream
    of AUSs. The playout duration of an AUS is the atomic time unit used by the presentation
    process. To facilitate inter-object synchronization, all objects are segmented
    into AUSs of equal presentation duration. Let Δ be the presentation duration of
    an AUS. For example, in Fig. 10.2, the Δ = 1/30 th second duration of a video
    frame is selected as the synchronization period for concurrent presentation of
    a video and an audio along with an image object. In this fashion, concurrent AUSs
    can be considered belonging to a group, say G_i, with all AUS_j ∈ G_i having the
    same presentation deadline. For example, in Fig. 10.2 the group set G_1 consists
    of AUS_1 and AUS_2 with deadline 1/30 second.


    As mentioned earlier, in contrast to live data, the multimedia Web appli-'
