  md: 'width or center) the offspring''s parameter $q_s$ will be given by:


    ```

    $$q_s = q_f a + q_m (1 - a)\tag{1.4}$$

    ```


    where $a$ is a real value in [0,1]. The $a$ value is randomly selected once for
    each offspring, i.e., the eq. (1.4) is applied with the same $a$ to all the real
    parameters of the same offspring.


    # Mutation


    Also in this case two different mutation operators are defined.


    # Binary genes:


    With a user-definable probability $p_m$ regarding only these bits, each of them
    can be inverted. At the beginning all the binary values are set to 1. In this
    manner all inputs are enabled. If the user''s GEFREX does not want to eliminate
    inputs the mutation probability $p_m$ needs only to be set to zero. In case of
    feature detection $p_m$ is 0.01.


    # Real genes:


    Both the center and the gamma are modified following the same procedure. Each
    of these parameters is changed in accordance to its value. In practice GEFREX
    adopts a multiplication mutation for which each parameter $q_s$ is modified as:


    ```

    $$q_s = q_s \left(1 - \frac{\delta}{2} + \text{rnd}(\delta)\right)\tag{1.5}$$

    ```


    where rnd($x$) is a random real number comprised in the interval [0,$x$]. The
    $\delta$ value is autonomously changed by GEFREX to sustain a minimum level of
    difference in the genetic population. Practically, the $\delta$ value is raised
    or lowered depending on the standard deviation $\sigma$ of the fitness values,
    which has to reach a few percents of the average fitness. At each iteration, if
    $\sigma$ exceeds some percents of the average fitness, $\delta$ is multiplied
    by 0.5. If it becomes too little it is multiplied by 1.1.


    # 1.3.5 The error


    The learning error formula is very important because the mathematical operations
    to calculate the best consequents derive directly from its definition. Further,
    a general formula, such as the one adopted in this chapter, permits the same learning
    tool to be applied in very different application fields. The error formula will
    be described in the following subsection. GEFREX uses supervised learning. Suppose
    there are $P$ patterns each constituted by $I + O$ values. Therefore the generic
    $p$th pattern will be:'
