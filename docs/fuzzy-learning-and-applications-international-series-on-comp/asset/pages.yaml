  img_proc: true
- pgno: 382
  md: 'by


    $$\left(A_1^{(k)}\times\cdots\times A_n^{(k)}\right)(x_1,\ldots,x_n)=A_1^{(k)}(x_1)*_T\cdots
    *_T A_n^{(k)}(x_n)=A^{(k)}(x),$$


    (11.13)


    where $*_T$ denotes respective t-norm $T$.


    Fuzzy if-then rules may be interpreted in two ways: as a conjunction of the antecedent
    and the consequent (Mamdani combination) or as a fuzzy implication [6], [7], [8],
    [28], [30]. In this chapter we mainly exploit the second interpretation.


    Approximate reasoning is usually executed in a fuzzy inference system, which performs
    a mapping from an input fuzzy set $A''$ in $X$ to a fuzzy set $B''$ in $Y$ via
    a fuzzy rule base. Two methods of approximate reasoning can be used: composition
    based inference (first aggregate then inference - FATI) and individual rule based
    inference (first inference then aggregate - FITA).


    In composition based inference, a finite number of rules $k=1,\ldots,K$ is aggregated
    via intersection or average operations, i.e.:


    $$R=\bigcap_{k=1}^{K}{}_{T,\Sigma}R^{(k)},$$


    (11.14)


    where $\bigcap_{T,\Sigma}$ denotes the symbol of aggregation operation using t-norm
    $T$ or averages (e.g., normalized arithmetic sum) aggregation of respective membership
    functions:


    $$R(x,y)=R^{(1)}(x,y)\begin{bmatrix}*_T\\+\end{bmatrix}\cdots\begin{bmatrix}*_T\\+\end{bmatrix}R^{(K)}(x,y).$$


    (11.15)


    Taking into account an arbitrary input fuzzy set $A''$ in $X$ and using the generalized
    modus ponens we obtain the output of fuzzy inference (FATI):


    $$B''=A''\circ R=A''\circ\bigcap_{k=1}^{K}{}_{T,\Sigma}R^{(k)}=A''\circ\bigcap_{k=1}^{K}{}_{T,\Sigma}\left(A^{(k)}\Longrightarrow
    B^{(k)}\right)$$


    (11.16)


    or in terms of membership functions:


    $$B''(y)=\sup_{x\in X}\left[A''(x)*_T R(x,y)\right]=\sup_{x\in X}\left[A''(x)*_T\begin{bmatrix}\displaystyle\bigwedge_{k=1}^{K}{}_T\\[2pt]\displaystyle\sum_{k=1}^{K}\end{bmatrix}R^{(k)}(x,y)\right],$$


    (11.17)'
