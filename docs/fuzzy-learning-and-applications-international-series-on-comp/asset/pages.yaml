    [0,1].


    Let ⋆₁, ⋆₂ : [0,1]² → [0,1] be measurable functions treated as two-argument operations
    in [0,1]. The distance between the operations ⋆₁ and ⋆₂ with respect to the values
    of their arguments is calculated as follows [6]:


    ```

    d(⋆₁, ⋆₂) = ∫₀¹ ∫₀¹ |x ⋆₁ y − x ⋆₂ y| dx dy,  (11.9)

    ```


    where d is here a pseudometric distance.


    For constant operations, i.e., for x ⋆₁ y = 0, x ⋆₂ y = 1, for all x, y ∈ [0,1]
    we get d(⋆₁, ⋆₂) = 1. Because constant operations differ from drastic operations
    only by boundary conditions, the distance for drastic operations is obtained as
