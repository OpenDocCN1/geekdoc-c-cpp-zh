    # 11.3 Reasoning using fuzzy implications and generalized modus ponens


    Fuzzy implications are mostly used as a way of interpretation of the if-then rules
    with fuzzy antecedent and/or fuzzy consequent. Such rules constitute a convenient
    form of expressing pieces of knowledge and a set of if-then rules forms a fuzzy
    rule base. Let us consider the canonical form of fuzzy if-then rule R^{(k)}, which
    includes other types of fuzzy rules and fuzzy proposition as special cases, in
    the (MISO) form:


    ```

    R^{(k)} : if X_1 is A_1^{(k)} and ... and X_n is A_n^{(k)} then Y is B^{(k)},    (11.11)

    ```


    where X_i and Y stand for linguistic variables of the antecedent and consequent
    and A_i^{(k)}, B^{(k)} are fuzzy sets in universes of discourse X_i ⊂ ℝ, Y ⊂ ℝ
    respectively.


    Such a linguistic form of fuzzy if-then rules can be also expressed as a fuzzy
    relation:


    ```

    R^{(k)} = (A_1^{(k)} × ... × A_n^{(k)} ⇒ B^{(k)}) = (A^{(k)} ⇒ B^{(k)}),    (11.12)

    ```


    where A^{(k)} = A_1^{(k)} × ... × A_n^{(k)} is a fuzzy relation in X = X_1 × ...
    × X_n defined'
