    # 10.3.2 Dynamic Bandwidth and Resource Constraints


    In some networking scenarios, multiple independent channels for each object involved
    in multimedia Web application may not be available. An example of such a situation
    is multimedia Web delivery to a residential user who may only have a single ISDN
    line or a Web TV connection with a limited bandwidth. Another example of such
    applications is Web service to a mobile user where we are restricted to a limited
    number of independent channels. Furthermore, even if the bandwidth restriction
    does not exist and channels can be requested on-the-fly (e.g., in an ATM network),
    use of an independent channel for the transport of each object is expensive from
    the signaling and routing point of view. This is because Web applications typically
    involve documents that consist of a large number of small objects [13]. Consequently,
    a large number of channels needs to be released and re-established as a user hops
    from an MMD to an MMD during browsing. Support for standard VCR-type operations
    further complicates the problem. Hence, it is desirable to re-use the same channel
    for the transport of several multimedia objects in a Web session.


    The problem of supporting multimedia Web applications becomes more challenging
    when QOS guarantees provided by the network are soft and may vary drastically
    during the course of a multimedia session. An example of such a networking scenario
    is the Reservation Setup Protocol (RSVP) running on an IP network [17]. Available
    Bit Rate (ABR) channels in ATM networking [18] and RF channels in mobile networking
    [19] are also examples of such networking environments. In RSVP, the resources
    are guaranteed for a short time and need to be refreshed on a periodic basis.
    Similarly, resource availability on an ABR channel depends on the congestion state
    of the network and resource availability in a mobile networking environment is
    affected by hand-off, etc. In short, in a number of networking scenarios, network
    resource availability may vary during the course of a multimedia Web session.


    In this chapter, we assume that resources are only guaranteed for a short'
