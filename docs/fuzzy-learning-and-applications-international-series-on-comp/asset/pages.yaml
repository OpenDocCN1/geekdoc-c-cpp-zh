  md: 'summarize our results as follows:


    +   - The programming interfaces are simple and intuitive, thus speeding up the
    development phase of the system’s life cycle.

    +   - The system is quite reliable in terms of fault tolerance and protection
    against noise.

    +   - The architecture permits the integration of several resolution methods,
    and the use of learning techniques in the fusion of behaviours output.


    Finally, as we have indicated when we described the MASAM Architecture, one of
    the final objectives of our system is to develop an intelligent agent that learns
    about the learning process. Hence it can help the user in the decision about the
    combination of the learning algorithms to be used in the fuzzy modeling. This
    Meta-Learning Agent (MLA) is actually in an implementation phase, and we hope
    it could be included in our MAS system.'
