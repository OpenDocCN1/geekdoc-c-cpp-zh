- pgno: 24
  md: 'applied. These points will be placed approximately in the middle of the ellipsoids
    represented in Fig. 1.5. If a learning phase using only these points is executed,
    the information regarding the importance of each of these points is lost. In fact,
    the point representative of the greater ellipsoid should have a weight twice as
    great as the others. If there are a large number of learning patterns a clustering
    technique could be used. It would permit a decrease in the learning time. After
    obtaining the codewords it is possible to associate their weights w_p to each
    of them, i.e., the number of learning patterns closest to them. In this manner,
    the number of learning patterns is reduced and the statistic is not lost. Of course,
    the so-called quantization error (QE) is introduced. However, the QE can be lowered
    by increasing the number of codewords and consequently reducing the compression
    ratio.


    With this technique and with the aid of formula (1.6) any of the previously described
    errors can be adopted. For example the RMSE can be calculated simply by putting
    k_op = sqrt(w_p) ∀o,p. Furthermore it is necessary that the P_eq = sum_{p=1}^P
    ω_p. Section 1.3.12 gives a significant example.


    ![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_24_0.png)


    Figure 1.5 These 32 bi-dimensional samples characterize three different clusters.
    The error formula introduced permits the use, in the learning phase, of only the
    centroids of the clusters, with weights proportional to the number of samples
    belonging to each cluster, rather than all the samples.'
