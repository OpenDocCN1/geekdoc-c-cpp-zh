    y_0 = \frac{\sum_{k=1}^{K} g\left[R_k(\underline{x}_0), w^{(k)}\right] \underline{p}^{(k)T}
    \underline{x}_0''}{\sum_{k=1}^{K} g\left[R_k(\underline{x}_0), w^{(k)}\right]}.
    \tag{11.52}

    ```


    For n inputs and K if-then rules we have to establish the following unknown parameters:


    +   - c_j^{(k)}, s_j^{(k)}; j = 1, 2, ..., n; k = 1, 2, ..., K the parameters
    of membership functions of input sets,'
