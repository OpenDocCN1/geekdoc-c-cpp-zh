    Figure 1.23 clearly states that the implementation of GEFREX gains significantly
    in performance when many PEs are used. Given that the network is always utilized
    less than 10% of its maximum possibility the results are surprising: PARGEFREX
    is particularly suited for commodity supercomputers rather than very expensive
    servers with few processors.


    Figure 1.23 confirms our discussion regarding too long simulations. If one p233
    is used and the simulations last for 300s the speedup is particularly high: almost
    450! This phenomenon is due to the fact that after 100-200s all the simulations
    converge and do not succeed in improving significantly. If we evaluated the average
    error when the simulation time was greater we would have a huge speedup, because
    the error would be almost identical to that found in 300s. Simulations using a
    p233 that last for 75s and 150s are more suited to evaluating the speedup.


    The reader can see that the speedup is always greater than one. This fact implies
    a clear concept: the use of several PEs rather than only one permits the finding,
    on average, of very low learning errors. It is very improbable to find the same
    error with only one PE even if many very long simulations are launched. In this
    sense we can say that PARGEFREX is more effective than GEFREX.


    To understand how important inter-slave communication is, PARGEFREX was used avoiding
    any exchange of individuals. Table 1.14 shows the results obtained when all PEs
