    In individual rule based inference (FITA) each rule in the fuzzy rule base determines
    an output fuzzy set and after that an aggregation via intersection or average
    operation is performed. So the output fuzzy set is expressed by means of the formulas:


    B'''' = ⋂_{k=1}^{K}_{T,Σ} { A'' ∘ (A^{(k)} ⇒ B^{(k)}) }  (11.18)


    or:


    B''''(y) = [ ⋀_{k=1}^{K}_T  ∑_{k=1}^{K} ] sup_{x∈X} [ A''(x) *_T'' R^{(k)}(x,y)
