  md: '# 3.2.1 Distributed Artificial Intelligence(DAI)


    DAI has been configured as a term to reference all systems that show some kind
    of collective behaviour of particular entities to reach a common and global goal.
    Those particular entities are the so-called agents. Following [46], we can say
    that there are three different approaches, corresponding to three different periods
    of research in AI(Artificial Intelligence), to look at DAI:


    +   - Classic DAI, centered in the collective behaviour rather than in the individual
    one and understanding that the society formed by particular agents is more important
    than those individually considered;

    +   - Autonomous DAI, focused in the individual study of agents, but taking into
    account that they are in a social world, and

    +   - Commercial DAI, centered in the application of classic and autonomous DAI
    to practical problems of the real world.


    Following the classical approach, research has been divided in the following two
    groups:


    +   - **Distributed Problem Solving** (DPS) tries to solve particular problems
    using distributed modules(or nodes), and shared knowledge representing the problem.

    +   - **Multi-agent Systems** (MAS) studies the coordination of the behaviours
    between intelligent and autonomous agents.


    The main difference between the two groups is that DPSs are designed taking into
    account the particular problem from the beginning; so they are, in a sense, *ad
    hoc* solutions. Indeed, there is often a central coordinator and a preliminary
    established plan. However, MAS are very general mechanisms that present more autonomy
    in its particular members and the control is decentralized.


    Nowadays, MAS have taken almost all attention among DAI researchers; so DPSs will
    not be mentioned anymore in this work. Instead, the study will be focused on MAS.


    # 3.2.2 Tasks in MAS Development


    The following typical tasks(or problems) have to be undertaken in the development
    of a MAS:


    +   1. Formulation, description, decomposition and assignation of problems for
    a group of agents, in order to reach the desired results,

    +   2. design of communication protocols to give the agents the capability to
    communicate and them to cooperate,

    +   3. design of control mechanism to avoid the agents, make decisions or actions
    that are not compatible or suitable with the common goal'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'of the overall system,


    +   4. to make the agents capable of representing and reasoning about actions
    and the state of other agents in the system,


    +   5. how to detect and resolve conflicts between different points of view in
    the society of agents, and


    +   6. the use of software engineering techniques to develop the MAS as the software
    system that it actually should be.


    All points mentioned above are critical in the implementation process. However,
    the last point is very important in order to achieve a suitable software system.


    In this engineering process, using an agent-oriented methodology is a necessary
    requirement, as building a MAS systems is not a trivial task. In section 3.2.3,
    issues related with agent-oriented methodologies are discussed. Moreover, in the
    implementation phase of this task, work can be started from scratch, building
    all necessary software needed to implement the designed agents, although this
    implies an enormous work to be done. Instead, a MAS platform, or toolkit, can
    be used for this task. This type of platform is composed of a set of software
    tools to help in the design and implementation of multi-agent systems. This point
    will be detailed in section 3.2.4.


    # 3.2.3 An Agent-oriented Methodology


    There are two main approaches in engineering methodologies to develop a MAS [35].
    Each approach is determined by a particular main stream of influence on the basic
    concepts framework. The first group comes from extending object oriented methodologies
    and the second comes from the starting point of knowledge engineering techniques.
    The particular case in our work has been to use MAS-CommonKADS [35] as a methodology
    to develop MAS and MAST(Multi-agent Systems Tool) [30] as a software tool to build
    the whole system. This methodology extends CommonKads [49], that is a knowledge
    engineering methodology. MAS are, in a sense, knowledge based systems; so it seems
    natural to build a MAS methodology over it. Developing a system using MAS-CommonKADS
    is based on the description of the following models:


    +   Agent Model: describe the agents, in the terms of reasoning capabilities,
    skills, services, goals, etc.


    +   Task Model: describe the global task of the problem, its decomposition into
    subtasks and the correspondence between particular tasks and agents carrying out
    them.


    +   Expertise Model: this model focus on the knowledge based part of the problem.
    It follows the KADS approach that differentiate four types of knowledge: domain,
    task, inference and problem solving.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   - Coordination Model: describe the interactions between agents, i.e., protocols
    and capabilities. There is a first stage of modeling protocols and a second one
    to test them in negotiation and self-organization situations.

    +   - Organisation Model: describes the organisation in which the MAS is introduced
    and also the particular agents and their possible organisational structures.

    +   - Communication Model: for describing the interaction between humans and the
    system.

    +   - Design model: it is divided into three sub-designs, i.e., application design,
    architecture design and platform design.


    There are a few more interesting methodologies extended from the same Knowledge
    engineering approach as CommonKADS. A concrete one will be mentioned here: CoMoAS.
    This methodology uses most of the models mentioned above, i.e., Agent, Expertise,
    Task, Cooperation and Design models. Models of expertise, in MAS-CommonKADS and
    CoMoMAS, are very similar, and the agent model includes the MAS-CommonKADS communication
    model and, in some way, its organization model is very similar to a new one in
    CoMoMAS: the System model.


    # 3.2.4 MAST. The Multi-agent System Toolbox


    Once the methodology is described, filling the gap between the design model and
    the final software product is needed. The concrete platform to be applied on the
    problem will be described.


    Any multi-agent platform has, from the very beginning, a concrete agent model
    that the designer has to adopt if all features offered by the platform are made
    to be available. That is: the platform determines the concrete agent’s basic capabilities.
    Hence, the agent model will be introduced first.


    # 3.2.5 The MIX Agent model


    In this section, the MIX agent reference model is introduced. MIX [23, 36, 43]
    is the reference architecture for all systems developed with MAST. This presents
    two basic models: the agent model and the network model.


    The former sees an agent as a set of elements:


    +   - Services: functionality offered to other agents.

    +   - Goals: functions that an agent performs for self-interest(not as a result
    of a petition from another agent).

    +   - Resources: information on external resources like services, libraries, ontologies,
    etc.'
