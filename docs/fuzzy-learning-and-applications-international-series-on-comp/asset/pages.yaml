    # 3.5.4 Learning behaviour fusion


    A key issue of behaviour-based control is how to efficiently coordinate conflicts
    and competition among different types of behaviour to achieve a good performance.
    Instead of just inhibiting and suppressing strategies according to assigned priorities,
    a fusion method is used [51]. A fuzzy rule base carries on this fusion, enabling/disabling
    the output of the different behaviours, both totally and partially [7, 3, 48].
    The use of learning techniques [7, 10, 24, 34, 57] in the fusion rule base can
    result in robot navigation performance improvement. This way, the system can be
    trained with only some simple behaviours, and then new behaviours can be added
    without modifying the previous ones: only the fusion rule base needs to be re-trained.


    Genetic Algorithms [28] are adaptive procedures of optimization and search that
    find solutions to problems, inspired by the mechanisms of natural evolution. They
    imitate, on an abstract level, biological principles such as a population based
    approach, the inheritance of information, the variation of information via crossover/mutation,
    and the selection of individuals based on fitness.


    GAs start with an initial set (population) of alternative solutions (individuals)
    for the given problem, which are evaluated in terms of solution quality (fitness).
    Then, the operators of selection, replication and variation are applied to obtain
    new individuals (offspring) that constitute a new population. The interplay of
    selection, replication and variation of the fitness leads to solutions of increasing
    quality over the course of many iterations (generations). When finally a termination
    criterion is met, such as a maximum number of generations, the search process
    is terminated and the final solution is shown as output.


    As our main concern is the learning of the fusion rule base, we apply GAs for
    the task [52]. The user selects an agent, which will serve as the base of the
    learning procedure. The key idea is to start with a predefined set of fuzzy rules
    for behaviour blending, and then to apply a learning method to them (rule tuning
    mode). This set can even be the empty set (rule discovery mode). In either case,
    the individuals of the GA are fuzzy rule bases, and the result of the GA is the
    proposed fusion fuzzy rule base.


    # Initial population and representation


    If the algorithm is run in the rule discovery mode the initial population is set
    randomly. Otherwise, the initial population will consist of the user-defined rules
    and random modifications of them. The latter corresponds to a typical'
