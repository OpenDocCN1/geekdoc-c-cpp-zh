  md: 'respectively. Each membership function consists of one or two sigmoid functions.
    The outputs of the units in the (D)-layer are the values of membership functions.
    The products of these values are the inputs to the units in the (E)-layer and
    the outputs of the units are the normalized activation value in the antecedent
    μ̂ⁱ in eq.(7.4). The output of the unit in the (F)-layer is the sum of the products
    of the connection weights w_b and the normalized activation values. The connection
    weights w_b correspond to the singletons in the consequence b_nⁱ as shown in figure
    7.2(b). The output in the (F)-layer is, therefore, the inferred value y_n* in
    eq.(7.5).


    The model infers y* (x^s) = (y_1* (x^s), ⋯, y_N* (x^s)) for a supervised signal
    (x^s, y^s). Error e^s for this supervised signal is given by:


    ```

    e^s = (e_1^s, e_2^s, ⋯, e_N^s)

    ∀n(n = 1, ⋯, N) e_n^s = y_n* (x^s) − y_n^s. (7.6)

    ```


    The parameters of FNN is updated so that


    ```

    minimize  E = Σ_n^N Σ_s^NOD (e_n^s)^2 (7.7)

    ```


    where NOD is the number of sample data.


    Since the center-of-gravity method is used in the (E)-layer, the updating method
    of connection weights, i.e., BP algorithm, needs some modifications. The learning
    algorithm for the FNN is well described in [2].


    The feature of this FNN is that fuzzy rules can be extracted easily from the trained
    FNN. The three layered neural network can identify the input-output relationships.
    However, it is hard to extract rules from the three layered neural network.


    # 7.3.2 Uneven division of input space


    The uneven division of input space for the fuzzy modeling in [3] is described
    in this subsection. The input space is divided so that the variances of data outputs
    across the subspaces are minimized. The procedure of input space division is as
    follows:


    +   1. If the given data have M input variables, M dimensional input space is
    divided. The input space initially has no division, i.e., the number of subspaces
    equals to 1. A fuzzy rule is assigned to one subspace, so the number of rules
    NOR is the same as the number of subspaces. Initially, NOR is also 1. The subspace,
    which covers the whole input space, is denoted by S¹. Figure 7.3 shows a case
    where two inputs x_k, x_l are given. The top figure shows the initial division
    of input space. A fuzzy model with one rule is made with an FNN and trained. The
    training of the FNN here is only to adjust the singleton in the consequence for
    efficient training.'
