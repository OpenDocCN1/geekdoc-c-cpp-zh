- pgno: 271
  md: 'problem is an NP-hard one, since the number of permutations to be considered
    in order to determine a solution is at most equal to $\frac{n!}{2^{n}}$. Several
    solutions to this problem by Hopfield-type neural network are well known in literature.
    In the following the original work by Hopfield and Tank [2] and by Szu [5] will
    be shown.


    # TSP: Hopfield and Tank''s Solution by the Hopfield Network


    In order to solve the TSP using a Hopfield network, a model with $n^2$ neurons
    was considered by Hopfield and Tank [2]. The neurons were logically subdivided
    into $n$ groups of $n$ neurons each. Henceforward we will identify each neuron
    with a double index, $xi$ (where the index $x = 1..n$ relates to the group corresponding
    to the city $x$, whereas the index $i = 1..n$ refers to the neurons in each group
    representing the order in which the city $x$ is visited), its output with $O_{xi}$,
    the weight for neurons $xi$ and $yj$ with $w_{xi,yj}$, and the external bias current
    for the $xi$-th neuron with $I_{xi}$. The grid of neurons can be seen as constituting
    a matrix in which each row corresponds to a group $x$ and each column corresponds
    to the visiting order index $i$. According to this convention, the Lyapunov energy
    function becomes:


    ```

    $$E = -\frac{1}{2} \sum_{x,i,y,j} w_{xi,yj} O_{xi} O_{yj} - \sum_{x,i} I_{xi}
    O_{xi} \tag{8.11}$$

    ```


    If the output of the generic $xi$-th neuron, $O_{xi}$, assumes a value of 1, it
    indicates whether the optimal solution determined is such that $i$ is the order
    in which the city $x$ is visited. Determination of the optimal solution by the
