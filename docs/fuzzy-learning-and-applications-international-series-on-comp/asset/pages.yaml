  md: '# 3.3.1 Agents Architecture


    The agents architecture appears at figure 3.2. Two MASAM sites and a user environment
    appear in it. MASAM sites can be organized over DSAs databases of ALAs, depending
    on computing environments or even organizations inside different universities
    or such. To compound a user environment, it is planned that only a Web browser
    with a Java virtual machine will be needed to access the system. To give some
    idea of the front-end, different snapshots can be seen in figures 3.3, 3.4 and
    3.5. They show a prototypical implementation, done in TCL/TK, of a client and
    a ALA acting like a wrapper for a backpropagation network [25]. In figure 3.3
    the different learning related services that can be called can be seen. For example,
    in figure 3.4, and after calling Configuration, that interface appears in order
    to configurate the network topology. Once the topology is defined, and after calling
    Learning, the window appearing in figure 3.4 allows the user to configurate typical
    training parameters for a backpropagation algorithm.


    # 3.3.2 Fuzzy Modeling in our MAS Architecture


    Once we have defined the multiagent architecture we return our attention to the
    learning techniques our agents implement, and that constitute the ALA agents.


    We will consider, without losing generality, a MISO system. We want to find a
    system that approaches the function φ: X^p ⟶ Y that models the system. We have
    a sample set of the behavior of the system in the space (X^p × Y), ω = ((x_t1,
    x_t2, …, x_tp), y_t), t = 1,2,K,n, where X1,X2,…,Xp are the domains of the inputs
    and Y is the domain of the output. Suppose we have a collection of data that represent
    the behavior tendencies of the system. We want to obtain a characterization of
    such behavior using k fuzzy rules that will have this form:


    R_h: If x is A_h then y is B_h, h = 1,…,k (3.1)


    where A_h and B_h are, respectively, the fuzzy sets in X^p and Y. Once all of
    those rules have been created (section 3.4 is dedicated to showing how they are
    created) an inference mechanism can be used for any new input, using approximate
    reasoning.


    We have implemented in our MASAM architecture several different learning agents,
    using techniques like genetic algorithms, neural networks, fuzzy decision trees,
    and many others, although we will just describe the learning agents that are significant
    for the application domain in this chapter. In order to see other combinations
    see [20] [29].'
