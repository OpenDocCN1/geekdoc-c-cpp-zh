- pgno: 363
  md: '# 10.9 Appendix


    This appendix outlines the approach that is used to randomly generate traffic
    profiles for a given set of parameters, RAC, PAR and CD. The appendix also describes
    how these profiles are used to generate data for AUS sizes.


    The SI work-load generation is based on the fact that RAC represents average capacity
    requirement over time interval [0, PAR · L] ¹. Furthermore, CD quantifies the
    variation around the RAC value. Consequently, uniformly distributed random with
    distribution parameters set to meet RAC and CD. The work-load of the remainder
    of the SI is then generated using a truncated normal distribution. The parameters
    for the normal distribution are also selected randomly.


    In the following, we outline how work-load profiles are used to determine sizes
    of individual AUSs. The work-load defines the cumulative capacity requirement
    of an SI for each Δ period. Let WΔ be the capacity requirement for a given Δ period.
    Recall, a Δ period presents a group Gi of AUSs. The problem is to find sizes for
    each AUSj ∈ Gi. For this purpose, number of AUSs contained in Gi are generated
    using U[1,10]. Let n be the total number of AUSs in group Gi. The work-load WΔ
    is distributed into n bins by observing the following procedure. First generate
    n − 1 uniformly distributed random numbers and sort them in ascending order. Let
    {r1,r2,⋯,rn−1} be the set of sorted numbers. It can be seen that this set partitions
    WΔ value into n bins. Given such partitioning, size of AUS1 is given by s1 = r1Δ.
    Similarly, s2 = (r2 − r1)Δ, sn = (WΔ − rn−1)Δ, etc. are determined.'
  merge: -1
  img_proc: true
