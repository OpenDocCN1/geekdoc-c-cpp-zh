  md: '# Rule Block


    The k-th rule block is first intended to calculate the current w_k and, secondly,
    to generate an output current given by:


    y_k = y_k^* (w_k / sum_{k=1..N} w_k)  (2.11)


    These currents are then routed to a common node to implement (2.4) through KCL.


    There are three main approaches for the analog implementation of (2.11) and/or
    (2.4): using an extension of Mead’s [32] follower-aggregation circuit with weighting
    capability [16][36]; using weighting-plus-division circuits [14][34] [35]; using
    normalization-plus-weighting circuits [25][23]. The first uses an elegant circuit
    concept (see Fig.2.9(a)) to implement a nonlinear version of (2.4) with a voltage
    output. However, because of the feedback, its transient response is not optimal;
    also, because a large signal current w_k is applied at the TA bias terminal, the
    linear operation range and the transient response are largely non-homogeneous
    over the university of discourse; finally, additional MDACs are required to incorporate
    digital programmability of the singletons. Fig.2.9(b) and (c) show the concepts
    of the other two approaches. Both permit transparent digital programmability of
    the singletons. However, different reasons lead us to use the normalization-plus-weighting
    approach. First, the weighting-plus-division approach requires replication of
    the input currents and the use of wide-range linear current-mode dividers, while
    the normalization can be realized through a collective computation circuit with
    only two transistors per input; the chosen approach results, hence, in simpler
    circuits. Secondly, because the transmission path for the numerator and the denominator
    of (2.4) are not the same in Fig.2.9(b), this approach is more sensitive to mismatching.
    Thirdly, the transient response of Fig.2.9(b) is largely dependent on the signal
    level. Fourthly, there is no simple way to compensate for the errors in the divider
    – the only way is using very accurate dividers.


