    has been designed for it. The latter comprises the circuitry needed to build the
    bias current sources, and the circuitry needed to interface to an 8255/8253 I/O
    Card for a PC. The PC interface provides read and write access to program the
    chip memory. It also provides write access to the D/A converters and read access
    to the A/D converter; thus the board works as a simplified data acquisition board.
    In addition, a TEKTRONIX TDS 520 digitizing oscilloscope is used to measure the
    dynamic response as well as to obtain sections of the dc control surface.


    Fig.2.20 shows some experimental results obtained from this test environment.
    Fig.2.20(a) and Fig.2.20(b) depict the section of an example dc control surface
    and the transient response to a step input, respectively, both measured with the
    oscilloscope. The former illustrates the response (bottom) to a ramp in one input
    (top), while the other input remains constant, in a kind of Mexican-hat surface.
    The latter corresponds to a falling edge in one input which forces the output
    to change from its maximum to its minimum value, as well as to jump to a different
    interpolation interval, which means a dynamic programming of the analog core.
    The measured delay time is around 500ns. Since the oscilloscope is not able to
