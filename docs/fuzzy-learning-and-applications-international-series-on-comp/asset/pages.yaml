    # 10.3.3 AUS Filtering Process


    When resources are severely constrained, the presentation of multimedia information
    to the end user cannot be supported without degrading the performance. In such
    cases, the goal of a multimedia data scheduler is to degrade performance in a
    graceful manner. Different AUS filtering mechanisms, such as dropping AUSs at
    the server site, can be employed for this purpose. For example, for an MPEG encoded
    video data, an AUS filter may drop several B- and P- frames, thus reducing the
    overall capacity requirement of the video stream.


    For discrete media objects like multi-resolution images, the resolution level
    can be adjusted based on the availability of resources [19]. For isochronous objects
    such as video and audio, in addition to reducing resolution, the presentation
    rate ratio can also be adjusted. However, the rate adjustment process needs to
    take into account the type of the media object being transmitted. For example,
    audio objects are more sensitive to AUS losses; therefore, the presentation rate
    ratio for audio streams should be set to a high value, if possible, close to one.
    On the other hand, for video objects the presentation rate ratio can be set to
    a low value [19].


