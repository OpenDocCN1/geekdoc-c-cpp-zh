  md: '+   - **W-JIT.1** Sort AUSs in SI in non-decreasing order of the weight $m(m-1)
    \cdot \frac{s_i}{\sum_j c_j} + m \cdot d_i$. Put the sorted AUSs in a list $\mathcal{W}$.
    If two AUSs have the same weight, then apply the LPT rule.

    +   - **W-JIT.2** Initialize $\mathcal{S}_j := \{\emptyset\}$ and $\alpha_j :=
    0$ for all channels, $1 \le j \le m$.

    +   - **W-JIT.3** Starting from the head of the list, schedule each AUS in $\mathcal{W}$
    to reach the destination at its deadline on the channel that results in ECT. If
    all channels are busy before the deadline then schedule it on the channel resulting
    in ECT.

    +     $$\mathcal{S}_j \ = \ \mathcal{S}_j \cup \{\text{AUS}_i\} \quad \text{if}
    \quad j = \arg \min_{1 \le k \le m} \{\alpha_k + \frac{s_i}{c_k} + J_k\}.$$

    +   - **W-JIT.4** Update $\alpha_j$, i.e., $\alpha_j = \max\{(\alpha_j + \frac{s_i}{c_j}),
    d_i\}$.

    +   - **W-JIT.5** Repeat Steps 1 to 4 until all AUSs in $\mathcal{W}$ have been
    scheduled.


    # 10.7 Performance Evaluation


    To evaluate the effectiveness of the proposed methodology, performance of the
    neuro-fuzzy scheduler is compared with several known heuristics and a branch and
    bound algorithm that provides an optimal solution to a restricted version of the
    multi-criteria scheduling problem considered in this chapter. For this purpose,
    we have implemented the neuro-fuzzy scheduler on a Sun SPARC platform. A learning
    rate of 0.05 and the error tolerance of 0.01 were used in our implementation.
    Various test cases that are representative of the network environment and multimedia
    information characteristics have been used for training as well as observing the
    performance of scheduling algorithm under different conditions.


    # 10.7.1 The Learned Fuzzy Logic Rules


    Recall, each node in layer $L_3$ of the underlying connectionist model of the
    neuro-fuzzy scheduler represents a fuzzy logic rule. As mentioned earlier, the
    connectionist model dynamically learns the fuzzy logic rules and reconciles the
    $L_3$ nodes accordingly. Tables 10.2 and 10.3 (at the end of the chapter) list
    the learned rules. The first three columns of the table represent the input linguistic
    variables quantifying the SI''s work-load while the succeeding two columns depict
    input linguistic variables representing the system state. These linguistic variables
    are defined in Section 10.6. The last four columns of the table represent the
    results of these inputs indicating the scheduling algorithm'
