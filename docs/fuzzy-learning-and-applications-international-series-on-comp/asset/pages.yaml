  md: 'In the following, we map the multimedia information scheduling problem to a
    new type of parallel machine scheduling problem which has not been considered
    in the standard scheduling literature.


    Consider the SI which consists of n AUSs represented by the set AUS = {AUS1, AUS2,
    ..., AUSn}. Given an SI, the problem of AUS scheduling onto communication channels
    can be mapped to an equivalent machine scheduling problems. Specifically, m heterogeneous
    channels can be modeled as m uniform machines with different processing speeds.
    A set of AUS''s is equivalent to a set of independent tasks. The processing time
    of a task is given by the size of an AUS. Furthermore, to facilitate the synchronization
    at the client''s site, the server transmits an AUS on a designated channel without
    interruption, which corresponds to a non-preemptive environment. Similarly, the
    objective given by Equation( 10.2) can also be mapped to objectives commonly used
    in the scheduling literature.


    In standard scheduling terminology, an AUS that misses its deadline can be considered
    as a tardy AUS. Specifically, define the term tardiness of an AUSi in a schedule
    S as:


    Ti = max(0, ai − di),


    where ai denotes the arrival time of an AUS at the destination. Define,


    Ui = { 1 if Ti > 0, 0 otherwise. }


    Clearly, Ui = 1 for a tardy AUS. Hence object Oi in Equation 10.2 is equivalent
    to minimize the total number of tardy AUSs. In other words the objective O1 is
    to minimize ΣSI ( ΣAUSi∈SI Ui ).


    As mentioned earlier, as objective O1 is to minimize the number of deadline misses,
    it may result in extensive losses of AUSs due to buffer overflow. To control buffer
    overflow conditions, we need to consider earliness of AUSs. Specifically, first
    define the term earliness of AUSi in a schedule S as:


    Ei = max(0, di − ai).


    Since early AUSs must be kept in memory until consumption, such AUSs may be a
    liability when destination buffers are close to being full. In these circumstances,
    it is desirable to control a weighted number of early AUSs. In particular, the
    objective O2 in Equation( 10.2) is to minimize ΣSI ( ΣAUSi∈SI wiEi ).


    Here wi''s are inversely related to the size of the AUSi. The idea is to complete
    transmission of bigger AUSs as close to their deadline as possible.'
