- pgno: 218
  md: '# Learning Fuzzy Systems


    # Abstract


    The main advantage of a fuzzy system is its ability to utilise information expressed
    in linguistic form. The design of a fuzzy system is very much an art. The designer
    considers the knowledge accumulated and crafts the membership function(s) and/or
    the inference mechanism in the system. Often, these membership functions are fixed
    once the design process has terminated. It would be desirable to have a fuzzy
    system whose membership function parameters can be "adapted" or "learned" from
    input and output data. This will facilitate the design process much easier. In
    this chapter, a review of techniques available for updating/learning the parameters
    of a fuzzy system is presented.


    # 6.1 Introduction


    One of the superior capabilities of fuzzy systems is that they can use the information
    expressed in a linguistic pattern. Though most fuzzy systems have been formed
    to emulate human decision making behaviour, the linguistic information stated
    by an expert may not be precise, or it may be difficult for the expert to articulate
    the accumulated knowledge to encompass all circumstances. Hence, it is essential
    to provide a learning capability for fuzzy systems, namely, to generate or modify
    the expert rules based on experiences.


    There are, essentially, two different approaches in the definition of fuzzy rules.
    The rules are either defined using an empirical experience or applying an adaptive/learning
    scheme to adjust the free parameters of the fuzzy system commencing with some
    arbitrary initial values. The learning fuzzy systems can be implemented using
    parameter adjustment algorithms and, in most cases, the gradient of a cost function
    with respect to each adjustable parameter is calculated and the parameters will
    be updated accordingly. There are also some derivative-free optimisations such
    as genetic algorithms (GAs) and random search methods. GAs have been successfully
    applied to generate fuzzy rules and adjust membership functions of fuzzy systems
    [6, 9, 22]. The readers are referred to [15] for a review of using GAs to tune
    the membership functions of fuzzy systems.


    In the literature, the parameter adjustment procedure in fuzzy systems is called
    variously, e.g., adaptive [7, 25], tuning [3, 19, 29], and learning fuzzy'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'systems [11, 12, 20, 28]. Nevertheless, we intend to clearly differentiate
    the goals of adaptation from those of learning. A model that treats each operating
    situation independently is limited to adaptive or tuning operation, whereas a
    system that correlates past experiences with current situations is capable of
    learning [1]. It is to be noted that, because of the multidisciplinary nature
    of the fuzzy system, it is known by numerous other names such as fuzzy rule-based
    system (FRBS), fuzzy model [26, 27], fuzzy associative memory (FAM) [13] and fuzzy
    logic controller (FLC)[18]. In this chapter simply the term “fuzzy system” will
    be used.


    The structure of this chapter is as follows: fuzzy systems will be introduced
    in the next section followed by a history and description of learning fuzzy systems.
    An application of the learning fuzzy system to non-linear function approximation
    is employed as an illustration example. The preservation of the integrity of fuzzy
    systems is presented in section 6.5.


    # 6.2 Fuzzy Systems


    There are many different types of fuzzy systems, such as those first proposed
    by (and named after) Mamdani [17], and Takagi and Sugeno [27]. The one which will
    be utilised in this chapter is a special case of the Mamdani type in which the
    rules always have crisp consequents. This model has been used extensively to express
    the relationship between output and input variables either for control or for
    system modelling.


    R^i: If x_1 is Ã_1^i and ... x_j is Ã_j^i ... and x_p is Ã_p^i then y is B^i


    The label of the i^th rule is R^i. The j^th input variable is x_j : j = 1,2,...,p
    and y is the output. Ã_j^i (i = 1,2,...,n and j = 1,2,...,p) are fuzzy labels,
    and B^i are real numbers. n and p are the numbers of rules and input variables,
    respectively. The number of distinguishable membership functions for a specific
    input variable x_j (Ã_j^1, Ã_j^2,..., Ã_j^i,..., Ã_j^n) is K_j. It is assumed
    that the universe of input variables is limited to lower limit (LL) and upper
    limit (UL) bounds, i.e., x_j ∈ [LL_j, UL_j], j = 1,...,p.


    The output y, as a function of input variables x_j : j = 1,2,...,p, is given in
    the following equation [28]:


    ```

    y = Σ_{i=1}^n B^i f^i   (6.1)

    ```'
