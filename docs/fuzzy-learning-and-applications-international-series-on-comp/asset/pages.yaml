- pgno: 220
  md: '![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_220_0.png)


    # Figure 6.1 Arbitrary training data.


    ```

    f^i = \frac{\prod_{j=1}^{p} \mu_{\tilde{A}_j^i}(x_j)}{\sum_{i=1}^{n} \prod_{j=1}^{p}
    \mu_{\tilde{A}_j^i}(x_j)} \quad (6.2)

    ```


    Different shape of fuzzy values, \tilde{A}_j^i, can be employed, e.g., triangular
    or Gaussian. The Gaussian membership functions are a good choice for learning
    fuzzy systems as the first and second derivative of the function are continuous
    functions. They can be written as follow:


    ```

    \mu_{\tilde{A}_j^k}(x_j) = exp\left(-\left(\frac{x_j - c_{j,k}}{\sigma_{j,k}}\right)^2\right)
    \quad j = 1,2,...,p \quad k = 1,2,K_j \quad (6.3)

    ```


    where c_{j,k} : j = 1...p, k = 1...K_j and σ_{j,k} : j = 1...p, k = 1...K_j are
    respectively the offset from the origin and the width of the Gaussian hump. The
    free parameters,i.e., c_{j,k} and σ_{j,k}, and the consequent parameters of rules,
    B^i, can be set manually or using a learning method.'
