    steady-state, and fitness proportional [25], as was the previous tool FuGeNeSys.


    In fine-grain models there are two types of selections: global and local. In this
    case, global selection is fitness-proportional and identifies the center of the
    subpopulation deme. In GEFREX this radius is one, i.e., the subpopulation is a
    3 × 3 subgrid. Local selection uses the same selection method but only in the
    subpopulation deme. Two parents generate a single offspring using the customized
    crossover and mutation operators described below. Whenever an individual is generated
    with a fitness value higher than the best one obtained so far a hill climbing
    operator is used too. The generated offspring replaces the individual in the subpopulation
    with the lowest fitness value.


