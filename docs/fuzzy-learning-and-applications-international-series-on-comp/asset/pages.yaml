    # 8.5.2 Flexible Manufacturing System Performance Optimization


    The aim of this section is to give another example of the application of the method
    described above. The example refers to the performance optimization problem of
    a Flexible Manufacturing System (FMS). This example is widely treated in [27–29],
    where it is shown that it is a NP-hard problem. In the following a brief overview
    of the problem itself will be given.


    A FMS is an interconnected system of resources (machine tools, robots, etc.) capable
    of automatically processing a wide variety of products simultaneously and under
    computer control [30]. Each product (called also part type) is the result of a
    sequence of processes (called production cycle) according to its technological
    requirements. In a FMS several parts of the same type (i.e., of the same kind
    of product) may be simultaneously processed in each production cycle.


    Full exploitation of available resources is extremely important to optimize the
    productivity (or performance) of the FMS as a whole. One of the parameters on
    which to act in order to maximize exploitation of the resources is the number
    of parts processed in the same production cycle. Too low a number of parts processed
    underexploits the available resources, while too high a number causes conflicts
    between resources which slow down the productivity of the system. The aim to be
    reached is to determine a number of parts to be simultaneously processed in each
    production cycle such as to optimize the'
