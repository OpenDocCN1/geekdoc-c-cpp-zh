  md: 'The key advantage of using multi-stage structure of fuzzy logic is that the
    number of rules will increase only linearly (not exponentially) with the number
    of variables. But the latency time (i.e., inferring time) of the multi-stage fuzzy
    logic inference, the number of fuzzy set operations of input, output, and intermediate
    variable must be reduced as much as possible. This can be solved by pre-computing
    the fuzzy set operations on several multi-stage fuzzy rules to shorten the latency
    time. Thus, the number of the match-degree calculations for input variables may
    decrease as well as the numbers of the conclusion formulations and defuzzification
    operations for output variables may decrease. For the intermediate variables,
    the fuzzy set operations can be pre-computed at compiling time; besides, the numbers
    of intersection and union scalar operations can be reduced in order to speed up
    reasoning at execution time. Therefore, the latency time involved in multi-stage
    fuzzy logic inference can be effectively reduced.


    # If-part evaluations of fuzzy rules at any stage


    To describe the method, the notation of fuzzy values of variables is adopted in
    which the fuzzy values of the intermediate variable y_{i-1} are {FuzzyValue_h}
    of the intermediate variable y_{i-1} in the i-th stage, which are denoted by {FV_h^i(y_{i-1})},
    1 ≤ i ≤ m, h ∈ {1,⋯,l_i}, and the linguistic terms of IF-part are expressed as


    A_{j,k}^i ∈ {FV_h^i(y_{i-1})}, (5.15)

    1 ≤ i ≤ m, j ∈ {1,⋯,n_i}, 1 ≤ k ≤ m − 1, h ∈ {1,⋯,l_i}


    where n_i is the number of the i-th stage fuzzy rules, and l_i is the number of
    fuzzy values of the intermediate variable y_{i-1} in the i-th stage. When an input
    fact or an inferred one occurs, the match-degrees among FV_h^i(y_{i-1})s in the
    i-th stage are performed with the fact as follows:


    α_h^i(y_{i-1}) = max_{u^{i-1} ∈ U_{y_{i-1}}} (μ_{FV_h^i(y_{i-1})}(u^{i-1}) ∧ μ_{Ã_i}(u^{i-1}))
    (5.16)

    1 ≤ i ≤ m, h ∈ {1,⋯,l_i}


    where ∧ means a T-norm operator. The T-norm operators commonly chosen for the
    intersection operations are the logical, algebraic, bounded, and drastic product
    operators, whereas the S-norm operators for the corresponding union operations
    are the logical, algebraic, bounded, and drastic sum operators.


    When these non-zero match-degrees are evaluated, they are broadcasted to those
    if-clauses which involve the fuzzy value FV_h^i(y_{i-1}). So the firing strength
    of rule R_j^i can also be derived from Eq. (5.17):


    α_{jT}^i = ∧ α_h^i(y_{i-1}), 1 ≤ i ≤ m, j ∈ {1,⋯,n_i}, h ∈ {1,⋯,l_i} (5.17)'
