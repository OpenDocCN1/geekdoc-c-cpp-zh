  md: 'Once we select from the collection of possible rules, for each antecedent the
    consequent corresponding to the fuzzy rule with the great weight w_ij, we need
    to generate finally fuzzy sets in each of the domains of the input variables.
    These fuzzy sets will be obtained by means of projecting the fuzzy clusters of
    the input space in each domain of the variables, then making the extensional hull
    of the fuzzy sets obtained, and finally we approximate them by trapezoidal fuzzy
    sets. As a consequence of this method we have a collection of k1 * k2 fuzzy rules:

    R_h : If x1 is A1h and ... and xp is Aph then y is Bh, h = 1, ..., k1 * k2.


    So, basically, each method has to:


    +   1. Define the number of rules to be created.

    +   2. Set the centers of the A_jh fuzzy numbers that constitute the antecedent
    of the rules.

    +   3. Define the membership degree μ_Ajh(x_j) to be used.

    +   4. Set the output value (v_j).


    # 3.4.4 A Genetic Algorithm Based Method to Generate and/or Tune Fuzzy Rules


    The fuzzy modeling normally is accomplished by a two step procedure. The first
    step is generation of a first approximation to the fuzzy model that describes
    the system. Implicit in this step is the determination of the necessary number
    of rules. The output of this step is a collection of rules which can be seen as
    rough estimates of the final rule base. The second step consists of a tuning of
    the initial rough rules to give us our final rule base.


    Genetic Algorithms (GAs) have shown good results in obtaining fuzzy rule bases,
    although normally using different GAs in the generation and in the tuning process,
    or just using GAs only in one of these steps [33] [37]. We have defined an agent
    that implements a nonstandard GA to achieve either of the following tasks:


    +   1. Only tuning: GA is used to tune a rule base with k rules (previously obtained
    by means of an expert or using the fuzzy clustering agent for rule generation).
    The final rule base will contain exactly k rules.

    +   2. Generating and tuning: GA is used in this case to generate and to tune
    a rule base directly from data. It is also possible to incorporate an initial
    rule base with k rules as in the previous method, that “help” the search process.
    Final rule base will contain any number N of rules, with 1 ≤ N ≤ MAX, where MAX
    is given by user.


    Genetic Algorithms (GAs) [27] [44] are adaptive procedures of optimization and
    search that find solutions to problems by an evolutionary process inspired'
