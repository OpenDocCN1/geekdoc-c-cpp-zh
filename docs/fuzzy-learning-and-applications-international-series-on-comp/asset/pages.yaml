    # 3.5.3 Robot agents architecture


    We wanted our robot to perform simple navigational tasks; so we decided that our
    final goal was to find some objects in our laboratory (with different rooms and
    corridors), both in known and unknown locations, then bring them back to a home
    position, neither colliding nor getting frozen in an infinite loop, of course.
    In addition to that, the robot will not have a model of the environment before
    it starts running. To accomplish this goal the robot must be able to perform certain
    tasks: navigation with obstacle avoidance, goal seeking, map building and localization,
    and some form of high level planning, etc. We have made a decomposition of such
    a system (robot and goal), extracting the most important elements [2], and defined
    a series of agents using the BG language and its implicit architecture. We have
    identified the following agents (3.6) that will be described in the next sections:


    +   - Reactive Control. This is the agent that is in charge of the reactive navigation.

    +   - Planning. This is the agent that is in charge of high level planning and
    global goal completion supervision.

    +   - Localization. This is the agent that is in charge of building a more or
    less precise model of the environment, and then locating the robot on it.

    +   - Vehicle Control. This is the agent that is in charge of low level elements
    control and signal filtering: sensors and actuators.'
