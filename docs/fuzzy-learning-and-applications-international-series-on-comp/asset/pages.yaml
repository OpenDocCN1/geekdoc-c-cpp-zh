    # 10.6.1 Hybrid Learning Algorithm


    The learning algorithm is based on a two-phase learning scheme. In phase I, a
    self organizing learning scheme is used to construct the presence of the rule
    and to locate an initial membership function. In phase II, a supervised learning
    scheme is used to optimally adjust the membership functions for the desired outputs.
    To initiate the learning scheme, the size of the term set for each input/ output
    linguistic variable and training data are provided. The term set setting and the
    training data is based on the work-load profile observed during the browsing process
    of the hypermedia system of Fig. 10.1. An extensive set of training and testing
    data is generated using these profiles. To complement these profile based training
    examples, more profiles are randomly generated and used in training the neuro-fuzzy
    scheduler. The desired output for each of these training input parameter sets
    is obtained through simulation. Section 10.7 provides further details about the
    generation of the training and testing data. Note that in the following, we drop
    superscript $(k)$ for layer $L_k$.


    The problem for self-organized learning can be stated as follows: Given the training
    input data set for $PAR$, $NAC$, $NCD$, $\delta$ and $\kappa$, the corresponding
    desired output value $\hat{y}_i$, $1 \le i \le 4$, and the fuzzy partition for
    input and output term sets locate the membership functions and find the fuzzy
    logic rules. In this phase, the network operates in a dual manner. The nodes and
    links in the layer $L_4$ are set in the up-down transmission mode so that the
