  md: 'To perform an accurate comparison, GEFREX was compared with FuGeNeSys, the
    other genetic rule generator that seems the most similar in literature [18] as
    regards to learning method and application domains. As both tools are based on
    a genetic approach, it is very important to execute several runs in the same hypothesis
    to have significant information. Each reported value in the following graphs corresponds
    to the average of 10 different runs.


    As a case-study the same example used for the testing of FuGeNeSys was considered.
    It is the approximation of the single-input single-output function [29]:


    ```

    y = 0.2 + 0.8(x + 0.7 sin(2πx))    (1.23)

    ```


    The 21 learning patterns were taken to be uniformly distributed in [0,1]. As there
    are only 21 learning patterns, the behavior of the tools was studied only up to
    9 rules. As Fig. 1.14 shows GEFREX reaches a negligible error with R=9. For this
    reason the use of more rules has no sense.


    ![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_42_0.png)


    Figure 1.13 Time required by FuGeNeSys and GEFREX to reach 10000 genetic iterations
    during the learning phase of eq. (1.23.)


    The first case analyzed regards the time needed to reach the same number of genetic
    iterations, i.e., 10000. Fig. 1.13 shows the results obtained, which indicates
    that the requirements of the CPU results grow faster for GEFREX than for FuGeNeSys.
    This figure shows the quality of the GEFREX software, too. In fact, up to 7 rules,
    GEFREX is faster than FuGeNeSys, even if it requires a SVD computation for each
    iteration and it is written in C++ (FuGeNeSys was written in C).


    In the following Fig. 1.14 the obtained final errors (RMNSE) are reported.'
