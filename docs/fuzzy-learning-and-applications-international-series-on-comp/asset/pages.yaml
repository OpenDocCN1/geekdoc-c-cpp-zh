    B_i'' = B_i − η ∂J/∂B_i (6.9)


    c_j,k'' = c_j,k − η ∂J/∂c_j,k (6.10)


    σ_j,k'' = σ_j,k − η ∂J/∂σ_j,k (6.11)


    where B_i'', c_j,k'', and σ_j,k'' are the new values of the free parameters and
    η is the “learning rate” which determines the size of the adjustments made.


