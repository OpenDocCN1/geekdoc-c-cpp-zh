- pgno: 313
  md: '# 9.9 Conclusion


    This chapter has described the fuzzy control design of the focus system of a CD
    player. The fuzzy controller is a classical Sugeno type Fuzzy-PD. The system was
    tuned in two different ways, based on optimization, by means of a simulator, of
    the membership function shape and of the consequents. The first method consisted
    of direct optimization of the controller, using a genetic algorithm to minimize
    the mean square error of the output. In this case the performance obtained was
    comparable with that of a classical PD. The second method consisted of two steps.
    The aim of the first step was to learn the behaviour of a classically-designed
    linear controller, using a fuzzy controller. Then in the second step the parameters
    of the fuzzy controller were optimized. In this case the results showed that this
    controller outperforms the linear one. In particular it was shown that the fuzzy
    controller is equivalent to a set of several PD controllers. A practical implementation
    on a real system was performed using a fuzzy microcontroller and the measurements
    confirmed the results obtained in simulation.'
  merge: -1
