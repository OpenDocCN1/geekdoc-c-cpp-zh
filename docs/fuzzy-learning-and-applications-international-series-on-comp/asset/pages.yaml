- pgno: 164
  md: "# 4.3 Bayes Optimal Classifier Approximation\n\nIn the neural network literature,\
    \ it has been demonstrated that a classifier based on an MLP can approximate the\
    \ Bayes optimal discriminant function, for suitable choices of the cost function\
    \ to be minimized during the training phase, and in the large training set limit\
    \ [2,11,14,20,25].\n\nIn [18], we generalized this result and demonstrated, following\
    \ Ruck et al. [25], that a classifier based on a system holding the universal\
    \ function approximation property can approximate the Bayes discriminant function⁴.\
    \ The demonstration we present here concerns the two-class case.\n\nLet c₁ e c₂\
    \ be two classes of patterns. Let χᵢ be the set of all possible patterns x belonging\
    \ to class cᵢ; then χ = χ₁ ∪ χ₂ represents the set of all patterns. The training\
    \ set consists of a subset of possible patterns belonging to the two classes.\
    \ In general, it is a finite set X = X₁ ∪ X₂, where X₁ = {x₁,x₂,...,xₙ₁} ⊂ χ₁,\
    \ X₂ = {xₙ₁+1,...,xₙ₁+ₙ₂} ⊂ χ₂, and n₁ + n₂ = N.\n\nLet w be the set of adaptive\
    \ parameters, g(x) be the discriminant function of a Bayes dichotomizer\n\ng(x)\
    \ = P(c₁ | x) − P(c₂ | x), (4.7)\n\nand F(x, w) be the system output.\n\nMoreover,\
    \ let us suppose that the system is trained in such a way that its response is\
    \ +1 when x belongs to the class c₁, and −1 when x belongs to c₂:\n\nF(x, w) =\
    \ { +1 if x ∈ c₁\n            −1 if x ∈ c₂ }. (4.8)\n\nThis is accomplished by\
    \ minimizing (e.g., with the error backpropagation technique [26]) the sample\
    \ data error function:\n\nEₛ(w) = Σ_{x∈X₁}[F(x,w)−1]² + Σ_{x∈X₂}[F(x,w)+1]². (4.9)\n\
    \nWe shall demonstrate that in the large N limit, when w minimizes Eₛ(w), then\
    \ w minimizes also:\n\nε²(w) = ∫_χ [F(x,w)−g(x)]² p(x) dx, (4.10)\n\ni.e., F(x,\
    \ w) approximates g(x)."
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Let us define the *average error function* as the function


    ```

    $$E_a(\mathbf{w}) = \lim_{N\to\infty} \frac{1}{N} E_s(\mathbf{w}) \tag{4.11}$$

    ```


    where $N$ is the total number of pattern vectors. $E_a(\mathbf{w})$ represents
    the error surface that is obtained when all possible vectors are used for the
    computation.


    As assumed, in the large $N$ limit, we can suppose that the function $E_s$ is
    a reasonable approximation for $E_a$.


    Let us rewrite the function $E_a$ as follows:


    ```

    $$E_a(\mathbf{w}) = \lim_{N\to\infty} \left[ \frac{n_1}{N} * \frac{1}{n_1} \sum_{\mathbf{x}\in
    X_1} [F(\mathbf{x},\mathbf{w})-1]^2 + \frac{n_2}{N} * \frac{1}{n_2} \sum_{\mathbf{x}\in
    X_2} [F(\mathbf{x},\mathbf{w})+1]^2 \right] \tag{4.12}$$

    ```


    where $n_i$ is the number of vectors belonging to the class $c_i$, and $\frac{n_1}{N}$
    and $\frac{n_2}{N}$ represent, in the large $N$ limit, the a priori probabilities
    $P(c_1)$ and $P(c_2)$, respectively.


    The quantities $\frac{1}{n_i} \sum_{\mathbf{x}\in X_i} [F(\mathbf{x},\mathbf{w})
    - 1]^2$ represent the average value of $[F(\mathbf{x},\mathbf{w}) - 1]^2$, over
    the patterns, provided that $\mathbf{x} \in c_i$.


    By exploiting the strong law of large number [23], we can rewrite Eq. 4.12 as


    ```

    $$\begin{aligned}

    E_a(\mathbf{w}) &= P(c_1) \int_{\chi} [F(\mathbf{x},\mathbf{w}) - 1]^2 p(\mathbf{x}
    \mid c_1) d\mathbf{x} + \\

    &+ P(c_2) \int_{\chi} [F(\mathbf{x},\mathbf{w}) + 1]^2 p(\mathbf{x} \mid c_2)
    d\mathbf{x} \\

    &= \int_{\chi} [F^2(\mathbf{x},\mathbf{w}) + 1] [p(\mathbf{x} \mid c_1)P(c_1)
    + p(\mathbf{x} \mid c_2)P(c_2)] d\mathbf{x} + \\

    &-2 \int_{\chi} F(\mathbf{x},\mathbf{w}) [p(\mathbf{x} \mid c_1)P(c_1) - p(\mathbf{x}
    \mid c_2)P(c_2)] d\mathbf{x}

    \end{aligned}\tag{4.13}$$

    ```


    The probability density function of the input vectors can be expressed as:


    ```

    $$p(\mathbf{x}) = p(\mathbf{x} \mid c_1)P(c_1) + p(\mathbf{x} \mid c_2)P(c_2)
    \tag{4.14}$$

    ```


    Moreover, by using the Bayes rule, we can write:


    ```

    $$\begin{aligned}

    g(\mathbf{x})p(\mathbf{x}) &= [P(c_1 \mid \mathbf{x}) - P(c_2 \mid \mathbf{x})]p(\mathbf{x})
    \\

    &= P(c_1 \mid \mathbf{x})p(\mathbf{x}) - P(c_2 \mid \mathbf{x})p(\mathbf{x}) \\

    &= p(\mathbf{x} \mid c_1)P(c_1) - p(\mathbf{x} \mid c_2)P(c_2)

    \end{aligned}\tag{4.15}$$

    ```'
