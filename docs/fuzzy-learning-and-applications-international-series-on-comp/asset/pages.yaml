- pgno: 318
  md: '# A Neuro-Fuzzy Scheduler for a Multimedia Web Server


    # Abstract


    In this chapter, we consider the problem of multimedia synchronization in a Web
    environment. The work-load generated by the multimedia server during a Web session
    exhibits variations that are quite different from the traffic fluctuation offered
    by a single media stream, e.g., a Variable Bit Rate (VBR) video source. We propose
    a set of parameters that can be used to characterize the work-load generated by
    the multimedia server in a Web-type browsing environment. Specifically, three
    parameters: Required Amortized Capacity (RAC), Pre-fetch Activity Ratio (PAR)
    and Capacity Deviation (CD) factor are proposed. The work-load characterization
    scheme is subsequently used in designing a server-based synchronization scheme.
    The problem of scheduling multimedia information to ensure media synchronization
    in a Web environment is identified as a multi-criteria scheduling problem which
    is NP-hard.


    The ability of fuzzy control to deal with multi-variables makes it a good alternative
    for the multi-criteria scheduling problem considered in this chapter. Consequently,
    we propose a Neuro-Fuzzy Scheduler (NFS) that makes an intelligent compromise
