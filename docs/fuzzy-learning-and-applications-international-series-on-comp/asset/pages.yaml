    by starting its transmission on or before the following deadline:


    ```

    d_i^s = d_i - s_i / c_j - J_j, (10.1)

    ```


    where d_i^s denotes the transmission start deadline of the AUSi at the server
    site, s_i / c_j represents the time it takes to pump AUSi onto the available channel
    Cj and Jj is the worst case propagation and jitter delays. Similarly, transmission
    start deadline for all AUSs can be computed and observed.


    The synchronization problem becomes more acute in a multimedia Web environment
    considered in this chapter. Specifically, due to non-stationary work-load of the
    browsing process and varying level of network resources, availability of a channel
    at around the transmission start deadline of an AUS given by Equation 10.1 cannot
    be guaranteed. Section 10.3 elaborates more on these issues.


    # 10.2.2 QOP Requirements


    Synchronization failures cause degradation of perceivable quality of multimedia
    information. In practice, the related object streams may still give the effect
    that the data is in sync and gives some constraints under which skew among related
    media streams may be tolerated [21]. A detailed study on human perception to multimedia
    synchronization presented in [21] shows that the quality requirements of multimedia
    presentation are quite soft. Nonetheless, for a given resource setup, the goal
    of a multimedia system is to provide the best possible Quality Of Presentation
    (QOP) to the end users.


    In the following we discuss some parameters that affect the quality of a multimedia
    presentation.


    +   - Deadline Misses: Strict presentation requirements demand that multimedia
    objects be played out with zero skew [20]. Deadline miss by an AUS may cause considerable
    skew among concurrent data streams, as streams with missed deadlines start lagging
    while the data on other streams is continuously used up during presentation.


    +   - Buffer Overflow: Pre-fetched and the early arrived AUSs need to be buffered
    at the client site. How early a transmission is to be scheduled depends on the
    availability of buffers at the client site. Care must be taken in pre-fetching
    data since extensive pre-fetching can also result in synchronization failure due
    to client’s buffer overflow. This can be a serious problem since data lost due
    to buffer overflow cannot be recovered. Retransmission strategies to overcome
    such failures are not feasible in real-time multimedia applications.


    +   - Resolution: Video, audio and images are more bandwidth intensive media than
    plain text. Some applications may require high resolution images'
