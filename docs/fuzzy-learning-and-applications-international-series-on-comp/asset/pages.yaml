    information is sent to them. After there is a synchronization phase. This phase
    is optional and has been implemented only for speedup evaluation. In this phase
    slaves and master synchronize their clocks, so they can start simultaneously.
    The beginning time is sent from the master to the slaves in the previous phase.
    This solution has been adopted, because when many PEs are involved in the simulation
    it is practically impossible to use the network to send a message that indicates
    the starting time to all PES contemporarily. In fact, in the PVM there is not
    the real broadcast function, but only a simulated one. When a broadcast message
    is sent there are as many equal messages sent as the number of receivers. So,
    when there are several PEs the start message arrives at the first addressee slave
    a long time before the last one. Obviously neither the implemented synchronizing
    method does guarantee that all slaves start exactly at the same moment, but the
    maximum difference in starting times is much less in respect of using the PVM
    broadcast.


    Then the slaves start to work. At each iteration they see if a message has been
    delivered from another slave. Further, at random times they sent their best individual
    to other random slaves. In this simulation the average sending time was fixed
    to 1s. Two particular phases are characterized in the graph, the neuro and genetic
    ones. The slave starts to work in the neuro phase. In this phase it generates
    its population of 400 individuals. This phase lasts about 0.4s and it is forbidden
    to send anything to other slaves. After, the genetic phase starts. It lasts 2.6s.
    Finally, there is the collecting phase where the master receives all the best
    individuals found by the slaves and after kills them. This simulation clarifies
    which is the simulation time specified in the termination condition: the neuro
    phase time plus the genetic one.


    Figure 1.20 shows another simulation in which all available PEs were used. The
    whole run lasted about 6s. The average sending time was fixed to 0.1s. Also in
    this simulation there is a synchronization phase of 1s. The termination criterion
    was CI with 0.5s of simulation time. The figure shows that the initialization
    phase is greatly enlarged due to the larger number of PEs. The neuro phase lasts
    about 0.3s and the genetic one only 0.2. So, the slaves exchange information for
    only 40% of the simulation time.


