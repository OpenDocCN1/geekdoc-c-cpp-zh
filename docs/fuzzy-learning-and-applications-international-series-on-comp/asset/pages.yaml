    # Figure 6.7 Membership functions Ãⁱ: i = 1, 2, 3, 4, 5 after N = 150 epochs training
    without constraints.


    otherwise undesirable to interpret this. In some cases a learning fuzzy system
    may have changed to such a degree that a conventional linguistic interpretation
    is no longer possible. In such a case, the learning fuzzy system may be viewed
    as a “black box” function approximator similar in function to a neural network.
    All these possibilities make a conventional learning fuzzy system unsuitable for
    many industrial applications in which maintainability and reliability are of importance,
    despite their likely performance superiority.


    # 6.5.1 Constraint Learning


    In [16], a constrained training algorithm, which maintains the interpretation
    of learning fuzzy system during training, is proposed. It is a paradigm which
    will enable the learning fuzzy controller to adapt and optimise itself while still
    remaining conceptually comprehensible to a human expert. This may be achieved
    at the cost of a slight degradation of the performance of the learning fuzzy system,
    in the sense that the error function may attain a higher value than if the membership
    functions are allowed to adapt freely. In most cases, this trade-off is acceptable,
    as it is often more important to be able to interpret the behaviour of the learning
    fuzzy system than to achieve a lower minimum in the cost function.


    The membership function assigned to a fuzzy value should not exceed certain'
