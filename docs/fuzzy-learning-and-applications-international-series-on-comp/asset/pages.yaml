  md: '# 1.3.3 Genetic coding


    Fig. 1.4 shows the genetic coding in detail. Each individual consists of two parts.
    The first part involves the Gaussians of all antecedents. The second part is dedicated
    to the enable bits. The number of inputs I depends on the application fields,
    whereas the number of rules R has to be specified by the user of GEFREX. In the
    same way as a multilayer perceptron, where the number of neurons implies the performance
    during the learning phase, too few hidden neurons imply high error whereas too
    many imply overfitting; the number of rules must be fixed taking into account
    the complexity of the problem to be learned by GEFREX.


    Once these quantities are fixed, the coding size is given too. In fact, at maximum
    R × I antecedents (one for each rule and for each input) are required. Two parameters
    for each antecedent are required (the center and the width related parameters
    shown in formula (1.1)). So, the first part of the GEFREX coding requires 2 ×
    R × I real values. Instead, the second part requires only I bits. These bits are
    used when the feature selection option is enabled during the learning phase of
    GEFREX. In a first approximation, these last I bits, in respect of the bits required
    to code the antecedents, can be ignored. Afterwards, the genetic coding in GEFREX
    requires a number of bits proportional to the quantity R × I.


    In the next sections of this chapter it will be demonstrated that the number of
    rules required is generally very small. That is, GEFREX needs fewer rules than
    previous works to reach the same learning error. Furthermore, GEFREX often reaches
    a lower error than previous work with a smaller number of rules. Besides, R is
    not tied to the number of inputs, but only to the complexity of the application
    itself.


    The coding of the individuals is made as follows:


    Binary genes: A string of I bits is associated to each individual. They represent
    the enabled inputs in the coded inference. More precisely if, for example, I =
    4 and the string is {0,1,1,0}, it means that in the fuzzy inference the first
    and the fourth inputs are not present. In this case GEFREX does not consider the
    information related to these inputs.


    Real genes: Each individual in the population is made up of a set of R × I FSs
    too. They are respectively the I FSs of the premise of the first rule, the second
    I FSs of the second rule, ...., and the last I FSs of the premise of the last
    rule. As the MFs of the input FSs'
