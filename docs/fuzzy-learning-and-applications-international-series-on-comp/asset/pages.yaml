  md: '# 2.4. A/D Converters, Interval Selector and Digital Memory


    # 2.4.1. A/D Converters


    Many possible implementations of A/D converters have been reported and could be
    used for this block. However, since a resolution of i_s(log₂L) bits is required
    and L (number of labels) is rarely higher than seven, a simple and fast flash
    converter like the one depicted in Fig.2.14(a) can be used. Although it is a common
    flash converter, some implementation details are worthy of comment here. First,
    the array of linear resistors generates twice the voltage levels needed for the
    A/D conversion. The “extra” voltage levels are used as programming values for
    the rule antecedent; thus they are a kind of analog read only memory. Note also
    that this array of resistors can be shared by all the converters (one per input)
    as long as the comparators have high impedance inputs. Secondly, these comparators
    are designed to have hysteresis, which is needed to filter the noise associated
