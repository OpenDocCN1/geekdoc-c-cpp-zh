  md: 'Now we note that fuzzy systems with Larsen’s product operation as conjunctive
    "fuzzy implication" of the if-then rules and symmetric triangle (isosceles triangle)
    membership functions for consequents B*^(k) we can write in well known from literature
    formula [15]:


    ```

    y0 = (∑_{k=1}^{K} (w^(k)/2) R_k (x_0) y^(k)) / (∑_{k=1}^{K} (w^(k)/2) R_k (x_0))
    , (11.36)

    ```


    where w^(k) is the width of the triangle base for k-th rule.


    It should be noted that the w^(k)/2 factor may be interpreted as a respective
    weight of k-th rule or its certainty factor.


    Another very important fuzzy system is called Takagi-Sugeno-Kang. Assume that
    m numbers of n-input and one-output (MISO) fuzzy implicative rules or fuzzy conditional
    statements are given. The k-th rule may be written in the following forms:


    ```

    R^(k) : if X1 is A1^(k) and ... and Xn is A_n^(k) then Y = f^(k) (X1, ..., Xn)
    (11.37)

    ```


    or in a pseudo-vector notation


    ```

    R^(k) : if X is A^(k) then Y = f^(k) (X) . (11.38)

    ```


    A crisp value of the output for Larsen’s fuzzy relation (product) and aggregation
    (normalized sum) can be evaluated from [3]:


    ```

    y0 = (∑_{k=1}^{K} A_k (x_0) f^(k) (x_0)) / (∑_{k=1}^{K} A_k (x_0)) . (11.39)

    ```


    Take into account that function f^(k) is of the form:


    ```

    f^(k) (x_0) = p0^(k) (11.40)

    ```


    where p0^(k) is crisply defined constant in the consequent of the k-th rule.


    Such a model is called a zero-order Sugeno fuzzy model. The more general first-order
    Sugeno fuzzy model is of the form:


    ```

    f^(k) (x_0) = p0^(k) + p1^(k) x10 + ... + p_n^(k) x_n0, (11.41)

    ```


    where p0^(k), p1^(k), ..., p_n^(k) are all constants.'
