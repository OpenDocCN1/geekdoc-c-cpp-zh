  md: '![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_261_0.png)


    # Figure 8.2 Integration of neural and fuzzy modules


    other hand, is much more difficult as the global minimum in any combinatorics
    problem is never known. In order to assess the quality of the solution, we consider
    a LowerBound parameter (defined as the one possible lower bound of the optimal
    solution) and a Tolerance parameter. If the minimum of the energy function determined
    by the Hopfield network is lower than the Tolerance-LowerBound value, then the
    valid solution is also considered to be good. The Solution.Check module therefore
    has the task of checking the validity and quality of the solution provided by
    the neural network following the strategies outlined above.


    The output of the Solution_Check module is made up of two parameters, indicated
    in the figure as I1 and I2. The first corresponds to the HC value determining
    non-validity of the solution or, if the solution is valid, the HC which mainly
    makes its quality poor. Parameter I2 is set as equal to the average of the remaining
    HCs. On the basis of these parameters the Fuzzy Inference module determines a
    new coefficient value for I1 (output O1) and varies the average of the remaining
    coefficients (output O2). Choice of the inputs I1 and I2 was due to two reasons.
    The first depends on experience. In a heuristic, manual approach, the HCs are
    varied by determining the coefficient which has caused the solution to be non-valid
    or of poor quality. Its value is then increased according to the values assumed
    by the remaining coefficients; so input I2 was considered to be significant. The
    second reason lies in the generalization of the approach presented. This choice
    allows the fuzzy approach to be applied to any optimization problem, as the inputs
    I1 and I2 and the outputs O1 and O2 are not directly linked to the number of coefficients
    in the problem to be solved.'
