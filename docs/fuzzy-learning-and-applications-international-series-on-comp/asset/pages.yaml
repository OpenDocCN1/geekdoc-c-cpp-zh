    Obviously, the number of if-then rules is unknown. Let us observe that equation
    (11.48) and (11.52) describes a radial neural network. The unknown parameters
    (except the number of rules K) are estimated by means of a gradient method performing
    the steepest descent on a surface in the parameter space. Therefore the so-called
    learning set is necessary, i.e., a set of inputs for which the output values are
    known {z0(i), t0(i)}; i = 1,2,...,N. The measure of the error of output value
    may be defined for a single pair from the training set:


    ```

    E = 1/2 (t0 - y0)^2 , (11.53)

    ```


    where t0 - the desired (target) value of output.'
