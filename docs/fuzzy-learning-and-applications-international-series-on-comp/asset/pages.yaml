    \ to\n        // obtain input facts\n        If-clause-evaluate();\n        //\
    \ input facts are broadcasted to all\n        // if-clauses to compute match-degrees\n\
    \        If-part-evaluate();\n        // Match-degrees are taken as inputs\n \
    \       // to evaluate firing strengths\n\n        // intermediate variable derived\
