    \ function of the $m$-th stage is obtained from $f_m(e_m, u_{m-1})$ in which $e_m$\
    \ and $u_{m-1}$ are replaced by their index $I_m$ and $I_{m-1}$ of the fuzzy subsets\
    \ $A_{I_m}$ and $A_{I_{m-1}}$ in Eq. (5.5), respectively,\n\n$f_m(I_m, I_{m-1})\
    \ = sat(n, - \\frac{|I_m| I_m + |I_{m-1}| I_{m-1}}{\\Delta'})$ (5.10)\n\nwhere\
    \ $\\Delta' = \\sqrt{I_m^2 + I_{m-1}^2}$, and $sat(n, x)$ stands for a saturation\
    \ function:\n\n$Sat(n, x) = n,$ if $x \\ge n$ $= round(x),$ if $-n < x < n$ (5.11)\
    \ $= -n,$ if $x \\le -n$\n\nwhere $n$ is the maximum index of fuzzy linguistic\
    \ terms and $round(x)$ can truncate $x$ into an integer.\n\nFrom Eq. (5.8), the\
    \ most negative gradient $-|\nabla I_j|$ implies that $u_{m-1}$ is maximum. Thus\
    \ we take the positive gradient of $u_j$ for the $j$-th stage as\n\n$|\nabla u_j|\
    \ = \\left[ \\frac{|e_j(k)|}{\\Delta_j} \\quad \\frac{|u_{j-1}(k)|}{\\Delta_j}\
    \ \right]$ (5.12)\n\nwhere $\\Delta_j = u_j$. Using a similar method, the output\
    \ of the $j$-th stage is chosen as\n\n$y_j(k) = GU_j(|\nabla u_j|) \\left[ \b\
    egin{array}{c} e_j(k) \\ u_{j-1}(k) \\end{array} \right] = GU_j(\\frac{|e_j(k)|\
    \ e_j(k)}{\\Delta_j} + \\frac{|u_{j-1}(k)| u_{j-1}(k)}{\\Delta_j}) = GU_j * f_j(e_j,\
