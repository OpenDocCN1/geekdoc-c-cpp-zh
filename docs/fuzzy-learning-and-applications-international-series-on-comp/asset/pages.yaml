    # ## Effect of Pre-fetching Activity Ratio


    In this section, we evaluate the effect of PAR on the performance of various algorithms
    including the neuro-fuzzy scheduler. Again the simulations were performed using
    SIs traces obtained from the hypermedia system shown in Fig. 10.1 as well as randomly
    generated SIs. Results of this set of experiment are plotted in Fig. 10.14.


    To study the effect of changing PAP values onto various scheduling algorithms,
    we consider two separate sets of fixed parameters in Fig. 10.14(a) and Fig. 10.14(b).
    In this case, several problem instances are generated by using channels with different
    characteristics. It can easily be seen that F-ECT performs better for SI’s with
    low PAR while B-ECT outperforms the F-ECT algorithms for high PAP values. Furthermore,
    the neuro-fuzzy scheduler recognizes this fact and most of the time selects the
    right algorithm. Plots given in Fig. 10.14(c) and Fig. 10.14(d) also validate
    this fact. These figures present results for randomly generated SIs.


    # ## Effect of Capacity Deviations, Buffering and Delay Margin


    In this section we study the performance of the neuro-fuzzy scheduler under various
    values of NCD, κ and δ. Fig. 10.15(a) shows the result for an SI trace with a
    set of fixed parameters. In this case, several problem instances are generated
    by using channels of different characteristics. κ is also varied to study the
    impact of such variations on the scheduling problems. It can be noticed from the
    figure that when buffer resources are constrained, AUS-F outperforms the other
    algorithms. Furthermore, the neuro-fuzzy scheduler learns about this fact and
    yields consistent performance for various values of the destination buffer. The
    results are also complemented by Fig. 10.15(b) where a randomly generated SI is
    used.'
