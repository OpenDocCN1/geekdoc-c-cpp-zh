    B''(y) = B''''(y) = [ ⋁_{k=1}^{K}_S  ∑_{k=1}^{K} ] [ A^{(k)}(x_0) *_T'' B^{(k)}(y)
    ]  (11.21)


    or with logical interpretation of fuzzy implication:


    B''(y) = B''''(y) = [ ⋀_{k=1}^{K}_T  ∑_{k=1}^{K} ] I( A^{(k)}(x_0), B^{(k)}(y)
    ).  (11.22)'
