- pgno: 398
  md: 'The inference algorithms based on conjunctive operators in some cases seem
    to be faster, simpler and more exact than the fuzzy implication based inference
    system. Moreover, the interpretation of the fuzzy if-then rules based on fuzzy
    implications is sounder from the logical point of view.


    In this chapter a new artificial neural network based logical interpretation of
    if-then rules (ANBLIR) has been described. Such a system can be used for an automatic
    if-then rule generation. The innovations of that system in comparison with the
    well known from literature are the logical interpretation of fuzzy if-then rules
    and the moving fuzzy set in consequent. A combination of gradient and least squares
    methods of parameter optimization for ANBLIR has been used. For initialization
    of calculations preliminary fuzzy c-means clustering has been used. A promising
    application of the presented system to standard pattern recognition problems has
    been shown.'
  merge: -1
  img_proc: true
