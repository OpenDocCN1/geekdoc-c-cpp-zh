    In this sense, the results are less biased than in comparison with results obtained
    by a single person advocating a specific learning method, and more accurately
    reflect the generalization behavior of the learning techniques as applied by knowledgeable
    users. There are three MONK’s problems. The domains for all MONK’s problems are
    the same. One of the MONK’s problems has noise added. For each problem, the domain
    has been partitioned into a training and testing set. The vector of features for
    each pattern consists of 7 features which take the following values: first feature
    - 1,2,3, second one - 1,2,3, third - 1,2, fourth - 1,2,3, fifth - 1,2,3,4, sixth
    - 1,2. The patterns are classified into two classes. Taken from [26], the results
    of testing for various methods are collected in Table 11.6. It should be pointed
    out that methods, which gave the highest percentage of correct classification,
    have been selected. The testing results obtained by means of the method described
    in this chapter are presented in Table 11.6 as well. The number of if-then rules
    varied from 2 to 4 and the number of executed iterations varied from 25 to 6000
    depending on the considered problem.


    | Method | MONKS-1 | MONKS-2 | MONKS-3 |

