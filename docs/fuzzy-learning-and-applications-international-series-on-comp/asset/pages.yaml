    # 10.3.4  Interval Based Dynamic Scheduling


    To deal with the unpredictable nature of the work-load generated by a multimedia
    Web server and to adapt to dynamically varying network resources, we propose an
    interval based dynamic scheduling methodology. The scheduling problem is divided
    into small intervals called *Scheduling Intervals (SI)*. The selection of an SI
    is based on the duration over which resources are reserved and/or the period for
    which limited a priori knowledge about the information requested by the user is
    available. For the scheme proposed in this chapter, the minimum of the two intervals
    is used to define SIs. The SIs selected in this fashion have varying durations.
    In general, determination of size of an SI presents a trade-off among various
    factors. In particular, if SI is too small, it cannot make use of the capacity
    averaging effect of the MMDs. On the other hand, a large SI can cause erroneous
    behavior for the scheduler while it tries to adapt to the changing state of the
    system. Furthermore, at any time, an interactive operation performed by a user,
    e.g., skip, pause, rewind, etc., is regarded as the start of a new SI. Some alternate
    methodology, e.g., a neural network based scheme, which can optimize the SIs selection
    process using reinforcement learning, can also be used to further improve the
    system performance. Note that the dynamic scheduling methodology presented in
    this chapter is not restricted by the specifics of the SI selection process.


    The interval based dynamic scheduling concept is proposed using a neuro-fuzzy
    system. The proposed neuro-fuzzy scheduler adapts to the offered work-load and
    the available resources by intelligently switching to the scheduling mechanism
    which is expected to yield the best QOP for the given SI. For this purpose, the
    SI’s work-load and information about the system resources are used by the neuro-fuzzy
    scheduler.


