    # Figure 9.2 A section of the physical track


    Each physical track on the disk forms a 360 degree turn in a continuous spiral
    line and consists of a succession of depressions, called pits, in the reflective
    layer. The encoded information is represented by variations in the pit length
    and by variation in the distance between pits. The physical track spirals outward
    when the disk rotates counter-clockwise as seen by the optical stylus. The scanning
    velocity during recording is between 1.2 m/s and 1.4 m/s with a channel bit rate
    of 4.3218 Mbit/s. The information in the reflective layer is read by an optical
    beam from an optical stylus focusing on this layer through the transparent substrate.
    During reading, the scanning light spot is diffracted by the pits of the reflective
    information layer. The optical power that is diffracted back into the lens of
    the optical system is modulated according to the encoded digital information.
    A section of the track is shown in Fig. 9.2.


    Due to the uniformity of the linear dimension of the pits along the whole of the
    spiral line, the revolution speed of the CD must depend on the pickup position,
    in order to have a constant bit rate. The revolution speed gradually decreases
    from 500 rpm to 200 rpm when the pickup moves from inside to outside. The optical
    apparatus is maintained on the track by a servomechanism. Disk irregularities
    cause a focal plane movement that should be taken into account. It is therefore
    necessary to use a servo focusing system that is able to keep the focal plane
    at the optimal distance, with a maximum error of 1μm. The servo focusing system
    is represented in Fig. 9.3.


