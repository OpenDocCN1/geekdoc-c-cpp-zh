    # 5.2.1 Multistage fuzzy inference engine


    The multistage fuzzy inference engine is decision-making logic, which employs
    fuzzy rules from the fuzzy rule bases, to determine a mapping from the fuzzy sets
    in the input universe of discourse Ux to the fuzzy set in the output universe'
