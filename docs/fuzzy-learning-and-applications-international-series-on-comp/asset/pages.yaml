    10.6.2 elaborates more on these algorithms, In the following we first discuss
    the underlying structure of the neuro-fuzzy scheduler.


    The neuro-fuzzy scheduler is in a form of a five layer network that realizes a
    fuzzy logic system [38]. As shown in Fig 10.8, nodes in layer L_1 are the input
    linguistic nodes which represent input linguistic variables. Layer L_5 is the
    output layer. Two kinds of output linguistic nodes are used in this layer L_5.
    One is for the training data (desired output) that needs to be fed into the net
