- pgno: 340
  md: '# 10.6 The Proposed Neuro-Fuzzy Scheduler


    The last Section formulates controlled transmission of AUSs in a multimedia Web
    session as a multi-criteria dynamic scheduling problem, Q_m / J_j / ∑U_i + ∑_i
    w_i E_i + ∑_i I_i F_i . It also shows that even the static version of the problem
    is NP-hard for which polynomial time solutions are unlikely to exist. In this
    chapter, therefore, we are not interested in designing an optimal scheduler but
    a dynamic and real-time scheduler which can react to changing SI work-load and
    varying system resources in a timely fashion while maximally meeting the multi-criteria
    objective.


    The ability of fuzzy systems to deal with multi-variables makes them attractive
    for the multi-criteria scheduling problem [28]. Neural networks, on the other
    hand, have been successfully used in designing real-time systems [12,18,23,29-37].
    Furthermore, several contributions are made to show that fuzzy logic and neural
    computing are complementary techniques [38-42]. We also use a neuro-fuzzy framework
    to provide a heuristic approach to solve the scheduling problem Q_m | J_j | ∑U_i
    + ∑ w_i E_i + ∑ I_i F_i . The neuro-fuzzy scheduler proposed in this chapter combines
    the scheduling algorithms proposed in Section 10.6.2. These scheduling algorithms
    are tailored to meet a particular objective and are suitable for a specific state
    of the system.


    The input to the neuro-fuzzy scheduler consists of two state vectors, χ and ω_sI
    with χ describing the system''s state and ω_sI summarizing the SI''s work-load.
    All input parameters of the system are normalized so that the neuro-fuzzy scheduler
    can be used to solve scheduling problems at numerous scales (e.g., for channel
    capacities starting from Kbps to and ranging up to Gbps).


    In particular, the SI work-load vector ω_sI is defined as: ω_sI = [NAC_sI, PAR_sI,
    NCD_sI], (10.3) where NAC represents required amortized capacity, RAC_sI value,
    normalized by the total capacity available for the SI. Similarly, NCD_sI is the
    capacity deviation factor CD_sI normalized by the RAC_sI value. In particular,
    NAC_sI = RAC_sI / C_total , NCD_sI = CD_sI / RAC_sI . (10.4)


    Recall that the SI related parameters, RAC_sI , PAR_sI and NCD_sI , are defined
    by the work-load determination algorithm presented in Section 10.4.


    The system state vector χ is defined by the following parameters. χ = [κ, δ],
    where κ represents the size of destination buffer normalized by CD_sI , i.e.,
    κ = K / (L · CD_sI ), (10.5)'
