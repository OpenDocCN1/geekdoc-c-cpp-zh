  md: '# 3.3.3 Fuzzy Clustering: a Central Component for Fuzzy Modeling


    In the area of system identification the procedure of fuzzy clustering has been
    utilized in several modes. In [47] a standard form of the Fuzzy C-Means algorithm
    is exploited to construct linguistic labels treated as basic chunks of information,
    although then the construction of the fuzzy model is obtained using fuzzy relational
    equations; so this kind of technique can be considered the type of templated based
    models. Fuzzy clusters can also give rise to “local” regression models - this
    is in fact the essence of the idea introduced originally in [53] [56] and that
    has been used by others [54, 6, 5]. The overall model is then structured into
    a series of IF-THEN statements. The condition part of the statement might includes
    linguistic labels of the input variables, or directly fuzzy relations on the product
    space of the input variables, while the action part contains a linear (or generally
    nonlinear) numerical relationship between input and output variables. The clustering
    method applies to the formation of the condition part.


    There are several advantages of the model development techniques based on fuzzy
    clustering:


    +   - An automatic way of formation of fuzzy sets (fuzzy relations). The clustering
    techniques are unsupervised learning schemes and as such they do not require any
    initial knowledge about the structure in the data.

    +   - We can treat all system variables uniformly and develop a fuzzy model in
    terms of the obtained clusters of data. By doing this the resulting model becomes
    structure-free and can be exploited from many different points of view. These
    methods exhibits reversibility, which means that any variable of the model can
    be accessed with the same level of flexibility.


    Fuzzy Clustering in this way can be used in:


    +   - obtaining the fuzzy sets in the product space X^p and in the output space
    Y - in this case if we have no information about a partition of the output space,

    +   - obtaining the tendencies of the data in the product space of the behaviour
    (X^p × Y), so these tendencies can serve to assign a weight to the fuzzy rules
    that can be generated considering the different combinations of fuzzy sets detected
    in the input space X^p and the output space Y.


    Once we have the possible rules with a weight assigned to them, it is possible
    to obtain first a description of the model considering the projection in each
    domain of discourse of the fuzzy sets that correspond to the fuzzy clusters'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 3.4 Clustering Agents


    We present some of the different clustering agents that our multi-agent architecture
    can integrate. We have implemented in MASAM fuzzy clustering agents like the classical
    fuzzy C-Means algorithm [9], and several variants of it. Next we will explain
    two of these variants.


    In any case we consider that we know, in some way, the existence of k clusters
    in the data. In this chapter we are not considering how the correct number of
    fuzzy cluster is obtained. In several papers the number of rules is decided by
    cluster validation using some of the validity measures present in the literature.
    We have made the use of preprocessing of the data by means of a Hierarchical Clustering
    over the data, where we can study and select the better partitions of the data
    [19]. Moreover these partitions then can serve as initialization of the fuzzy
    clustering algorithm, obtaining in this way a better performance of the algorithm.


    We do not need to know any other information of the data structure (for example,
    linearity or non-linearity). We will use a clustering algorithm to find k centroids.
    An important aspect to stand out is that the clustering process is performed over
    the input and output product space. The objective of this process is, as is shown
    in several works [40, 41], to perform a better detection of the clusters that
    exists in the data. This is not only because the interactivity between input product
    spaces is taken into account but also the consequences of its interrelation with
    the output space. So the clustering will be performed over the (X^p × Y), that
    is, we will also take into account the output values of the examples. In this
    way, we will obtain k centroids C_h with this form (c_{h1}, c_{h2}, ..., c_{hp},
    c_{h p+1}), h = 1, 2, ..., k, where c_{h1}, c_{h2}, ..., c_{hp} belong, respectively,
    to the domain X_1, X_2, ..., X_p and c_{h p+1} belongs to the domain of Y.


    found in the input product space, and if it is neccesary making a linguistic approximation
    if we want a qualitative model using a collection of predefined linguistic values.
    Using this approach we can reduce the solution search space, as we do not need
    to consider the amount of possible fuzzy rules as would be neccesary if we work
    with the collection of fuzzy sets defined in each domain of the input variables,
    although we can express in any case the model obtain using them. Moreover, as
    the model must be validate, by the expert, what is more important in the first
    step is to try to obtain a prototype model in a rapid way. So then this preliminary
    model can be tuned and pruned in as later step. It is important to note that,
    as we are obtaining an initial model, the methods we consider must be as simple
    as possible but with a good approximative capacity as well.'
