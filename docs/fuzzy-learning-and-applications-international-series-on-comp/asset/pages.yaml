    work and exchanges data with the other slaves. At the end the master collects
    results from slaves and kills them.


    Effectively, there are not two different softwares, one for the slaves and another
    for the master. There is only one software that detects if it has been spawned
    from another copy of itself or not. If not, it acts as master; otherwise it is
    a slave. When the master starts it reads a configuration file which indicates
    how many PEs must be used. Further, for each PE this file specifies how many slaves
    must be run.


    After the reading of the configuration file the master spawns all slaves, sends
    them initialization information and waits for results from slaves. After slaves
    run and their initialization phase ends, they start to exchange information among
    themselves excluding the master process. The data exchanged is the best individual
    found so far from the slave which is sent to another slave. They send their best
    individual at random times, but the average sending time is user definable. The
    receiving slave is randomly chosen too. The individual received replaces the worst
    one in the local population.


    Several stopping criteria have been implemented. They are:


    CI: The number of iterations. When all slaves reach a pre-fixed number of iterations
