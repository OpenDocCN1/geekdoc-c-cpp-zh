    The algorithm (1) also computes the Pre-fetch Activity Period (PAP) parameter
    that characterizes the shape of an SI’s capacity requirement profile by identifying
    whether the SI contains higher activity at its beginning or at its end. For this
    purpose it keeps track of a pre-fetch activity index that stores the time up to
    which pre-fetch is possible. The PAP value of the SIs of Fig. 10.6 is also indicated
    in the figure. Note, since the SI of Fig. 10.6(a) has a relatively higher capacity
    activity at the beginning of the SI, pre-fetching is viable up to point a, as
    shown in this figure. Hence, PAP value for this example is given by a. The SI
    of Fig. 10.6(b) has relatively higher activity towards the end; the PAP extends
    towards the end of the SI. The algorithm then normalizes the PAP value and computes
    the Pre-fetch Activity Ratio (PAR) which is defined as PAR = PAP / L, where L
    represents the length of the SI. Note that PAR = 0.34 for the SI of Fig. 10.6(a)
    that has a relatively higher capacity activity at the beginning of the SI and
    PAR = 1 for the SI of Fig. 10.6(b) which has relatively higher activity towards
    the end.


    The Capacity Deviation (CD) factor characterizes the deviation of an SI’s capacity
    requirement profile above the RAC value. The algorithm (1) computes the value
    for CD based on Pre-fetch Activity Density (PAD) factor for each pre-fetching
    Δ period. In algorithm (1), for the pre-fetching period Δi, RACi ≠ RACi−1. The
    density of the pre-fetch data during period i is given by the deviation of RACi
    value from RACi−1 value. In particular, PADi = (RACi − RACi−1)iΔ. Hence, given
    PADi ∀i = 1,2,⋯,L, we can compute


    ```

    CD = (∑_{i=1}^{PAP} PAD_i) / (PAP Δ)

    ```


    Clearly, the SI of Fig. 10.6(b) has much more deviation from the RAC value as
    compared with the SI of Fig. 10.6(a). The value of CD is 0.12Mbps in the formal
    case while it is 10kbps for the later.


    In Section 10.6, parameters RAC, PAR and CD are used to describe the work-load
    of an SI. We provide fuzzy logic rules for selecting a scheduling mechanism that
    is expected to yield the best results for the given work-load and system state.
    In the following, we elaborate on the requirement of the neuro-fuzzy scheduler.


    # 10.5 Dynamic Scheduling at the Server'
