    # 11.6 Application of ANBLIR to pattern recognition


    In this section, we present an application of the fuzzy system described prior
    to a pattern recognition problem. If patterns from a learning set belong to classes
    ω₁ and ω₂ then we can build a fuzzy system whose output takes positive values
    for patterns from class ω₁ and negative or zero values for class ω₂. If we denote
    a fuzzy system as y₀ = FNN(x₀), we get:


    ```

    y₀(k) = FNN₁₂[x₀(k)] { > 0, if x₀(k) ∈ ω₁, ≤ 0, if x₀(k) ∈ ω₂. }  (11.72)

    ```'
