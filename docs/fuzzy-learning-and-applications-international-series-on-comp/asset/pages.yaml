- pgno: 257
  md: 'assumes values ranging between 0 and 1, is linked to the input of the same
    neuron, U_i, by a sigmoidal monotonic increasing function g_i. Each feedback between
    the output of the j-th neuron and the input of the i-th neuron has an associated
    weight, w_ij, which determines the influence of the j-th neuron on the i-th neuron.
    An external bias current, I_i, is then supplied to the i-th neuron. The dynamics
    of the Hopfield network for the i-th neuron, O_i, are described by:


    ```

    dU_i/dt = -U_i/τ + Σ_j w_ij O_j + I_i  (8.1)

    ```


    where τ is a user-selected decay constant. Hopfield [21] showed that if the weights
    matrix W = [w_ij] is symmetrical and if the function g_i is a steep-like curve,
    the dynamics of the neurons described by (8.1) follow a gradient descendent of
    the quadratic energy function, also known as the Lyapunov function:


    ```

    E = -1/2 Σ_{i,j} w_ij O_i O_j - Σ_i I_i O_i  (8.2)

    ```


    Under the same hypothesis, Hopfield [21] showed that the minima of the energy
    function (8.2) coincide at the corners of the hypercube defined by O_i ∈ {0,1}.


    # 8.3 Fuzzy Logic


    The aim of this section is to describe the approach adopted to calculate the fuzzy
    rules trained (see section 8.7) for automatic modification of the Hopfield network
    coefficients.


    In classical set theory, given a value x ∈ X and a subset A of X (A ⊆ X) the element
    x either belongs to the set A or not. So it is possible to associate a Boolean
    numerical value (that is, one belonging to the set {0,1}) to each of the elements
    of X, specifying whether it belongs to A or not.


    However, the human way of thinking does not reproduce classical theory: in the
    human mind sets have much less clear outlines.


    Considering, for instance, some commonly used adjectives such as tall, intelligent,
    tired, ill and so on, it is obvious that their outlines are not at all clear.
    The point is that we do not refer to these properties in terms of classical binary
    logic but in terms of a generalization with multiple values.


    The concept of a fuzzy set is a step towards this generalization. As introduced
    by Zadeh [22], a fuzzy set is a set whose membership function can take any value
    within the closed interval [0,1] ⊆ ℝ. A fuzzy subset A, called the Universe of
    Discourse, has a membership function of:'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'μ_A : X → [0, 1] (8.3)


    which associates each element, x, of X with a number μ_A(x) ranging from 0 to
    1, representing the degree of membership of x in A.


    In general a fuzzy conditional rule is made of a premise and a conclusion:


    if premise then conclusion (8.4)


    The premise is made up of a number of fuzzy predicates P_i (henceforward also
    called antecedents) of the general form (Tom IS speed) that are eventually negated
    or combined by different operators such as AND or OR computed with t-norms or
    t-conorms (which according to Zadeh are minimum and maximum respectively).


    In the latter example Tom is the value of the linguistic variable defined in the
    Universe of the Discourse of men and speed is one of the names of the term set
    of the linguistic variable (for example slow, normal, speed).


    The following is an example of a fuzzy conditional rule using such operators:


    if P₁ and P₂ or P₃ then P₄ (8.5)


    where, for example:


    P₁=(car IS light),

    P₂=(power IS medium),

    P₃=(power IS high),

    P₄=(car IS fast).


    To apply an inference method to the conclusion, it is first necessary to assess
    the degree of membership θ of the premise, through assessment of the degrees of
    membership α_i of each predicate P_i = (X_i IS A_i) in the premise. The membership
    degree α_i is calculated by assessing the degree of membership of a generic value
    of X_i in the fuzzy set A_i. If X_i is made up of a fuzzy set, its degree of membership
    α_i is determined by making an intersection between the fuzzy value of X_i and
    the fuzzy set A_i and choosing the maximum value of membership; if X_i is a crisp
    value, its degree of membership in the fuzzy set A_i is made up of the value the
    membership function of A assumes corresponding to X_i. The degree of membership,
    θ, of the premise can thus be calculated by assessing the fuzzy operations on
    the predicates. We recall that according to Zadeh the operator AND corresponds
    to the minimum operation between two degrees of membership, while OR corresponds
    to the maximum. Once the value of θ is known, an inference method can be applied
    to assess the conclusion.


    Finally, having obtained the output fuzzy set, defuzzification is performed to
    transform the fuzzy information obtained into numerical values.'
