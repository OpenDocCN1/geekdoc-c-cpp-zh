    f^i] (6.7)


    ∂J/∂σ_j,k = − 2ε(x_j − c_j,k)^2[ Σ_{i=1}^n d_i,j,k f^i(B^i − y)] / [(σ_j,k)^3
    Σ_{i=1}^n f^i] (6.8)


    where d_i,j,k is 1 if the i-th rule is dependent on the k-th membership function
