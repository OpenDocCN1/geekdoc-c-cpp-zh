  md: 'If the matrix \overline{K}_2 is invertible the solution of this system, which
    minimizes the residual, coincides with the solution of the system:


    \overline{T}'' \overline{Z} = \overline{Q}'' \tag{1.10}


    where \overline{T}'' = \overline{\Theta}^T \overline{K}_1^T \overline{K}_1 \overline{\Theta}
    and \overline{Q}'' = \overline{\Theta}^T \overline{K}_1^T \overline{K}_1 \overline{Y}.


    # 1.3.7 Hill climbing operator


    A hill climbing operator was introduced. It is only used whenever an individual
    is generated with a fitness value higher than the best one obtained so far.


    Initially, the individual selected is transformed into a neuro-fuzzy system. That
    is, the equivalent neural network is built and all the trainable weights are initiated.
    Then, the system is trained. In this phase it is possible that some neurons can
    be deleted too. Finally, the trained system is retransformed into a genetic individual
    and introduced into the genetic grid in place of the starting individual selected.
    The neural network is trained with the gradient descending method.


    GEFREX automatically adjusts the learning rate and proceeds until the error decreases.
    To give more detail, the learning rate starts from the value 0.5. If the error
    decreases, it is multiplied by 1.5, otherwise by 0.1. The iterations follow until
    the error reaches a local minimum.


    # Gradient descending formulas


    For simplicity q_{ir} indicates one of the two coefficients {γ_{ir}, c_{ir}}.
    If θ_{rp} ≠ α_{ir} then ∂E/∂q_{ir}=0. Otherwise we obtain:


    ∂E/∂q_{ir} = 1/(O P_{eq} E) Σ_{o=1}^{O} Σ_{p=1}^{P} (y_{op} - y''_{op}) k_{op}^2
    ∂y_{op}/∂q_{ir} \tag{1.11}


    ∂y_{op}/∂q_{ir} = { z_{or} θ_{rp} ∂q''_{irp}/∂q_{ir} if WS ; (z_{or} - y_{op})
    \overline{θ}_{rp} ∂q''_{irp}/∂q_{ir} if WM } \tag{1.12}


    where q''_{irp} = -γ_{ir}^2 (x_{ip} - c_{ir})^2.


    ∂q''_{irp}/∂q_{ir} = { -2γ_{ir} (x_{ip} - c_{ir})^2 if q_{ir}=γ_{ir} ; +2γ_{ir}^2
    (x_{ip} - c_{ir}) if q_{ir}=c_{ir} } \tag{1.13}


    In Fig. 1.6 there is an example with only two inputs, one output and two rules.
    When the WS is assumed (as shown in Fig. 1.6) the neuro-fuzzy system has four
    layers.


    +   - The first is the input layer and it has a maximum of I neurons.'
