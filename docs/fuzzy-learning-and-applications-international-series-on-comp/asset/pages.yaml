    Notice that in both models the consequent is crisp.


    In equation (11.35) the value describing the location of COG''s consequent fuzzy
    set in if-then rules is constant and equals y^{(k)} for k-th rule. A natural extension
    of the above-described situation is an assumption that the location of the consequent
    fuzzy set is a linear combination of all inputs for k-th rule:


    ```

    y^{(k)}(\underline{x}_0) = \underline{p}^{(k)T} \underline{x}''_0. \quad (11.44)

    ```


    Hence we get the final output value in the form:


    ```

    y_0 = \frac{\sum_{k=1}^{K} \text{Area}\left(B^{*(k)}\right) \underline{p}^{(k)T}
    \underline{x}''_0}{\sum_{k=1}^{K} \text{Area}\left(B^{*(k)}\right)}, \quad (11.45)

    ```


    where B^{*(k)} is the conclusion for the k-th rule before aggregation.


    # 11.5 Fuzzy system with logical interpretation of if-then rules


    We assume that premises of if-then rules A_1^{(k)},...,A_n^{(k)} have Gaussian
    membership functions:


    ```

    A_j^{(k)}(x_{j0}) = \exp\left[ -\frac{\left(x_{j0} - c_j^{(k)}\right)^2}{2\left(s_j^{(k)}\right)^2}
    \right], \quad (11.46)

    ```


    where c_j^{(k)}, s_j^{(k)}, j = 1,2,...,n; k = 1,2,...,K are the parameters.


    On the basis of (11.30) and for explicit connective AND taken as product we get:


    ```

    \underline{A}^{(k)}(\underline{x}_0) = \prod_{j=1}^{n} A_j^{(k)}(x_{j0}). \quad
    (11.47)

    ```'
