  md: '# 10.7.3 Performance Results


    This section provides performance results for the neuro-fuzzy scheduler based
    on an extensive set of simulations. This section also provides details on how
    the test data are generated. The training data is also generated in the same fashion.


    To evaluate the performance of the neuro-fuzzy scheduler, two sets of computational
    simulations are conducted. The objective of the first set of simulations is to
    measure the performance of the neuro-fuzzy scheduler relative to an optimal solution
    obtained using the branch and bound algorithm proposed in [16]. However, due to
    high time complexity of the branch and bound algorithm, we have to restrict the
    size of SIs in the first set to 8 to 16 groups of AUSs. In order words, the length
    of SIs in this set of simulation is restricted to about one second. More realistic
    SIs are considered in the second set of simulations where performance of the neuro-fuzzy
    scheduler is compared against the F-ECT, B-ECT, JIT and AUS-F heuristics. For
    the sake of better presentation, in the following, we first discuss the results
    obtained from the second set of simulation.


    SI work-load defined by (NAC, PAR, NCD) and system state related information indicated
    by (κ, δ) are the input parameters of the neuro-fuzzy scheduler. This set of input
    parameters produces a multi-dimensional space of problem instances. To produce
    every point in this space is neither practical nor desirable. Therefore, we approach
    the comparison problem by taking several cuts of this space. We vary the NAC,
    PAP, NCD, κ and finally δ values one by one and evaluate neuro-fuzzy scheduler’s
    performance for several settings for the other parameters. In other words, we
    explore the behavior of the neuro-fuzzy scheduler in several planes of the state
    space. To get higher confidence on the simulation results, it is necessary to
    generate a substantial number of problem instances. Each simulation result is
    based on the outcome of a 100 randomly generated problem instances. Note that
    a simulation result only states performance of the algorithm at a fixed point
    in the multi-dimensional problem space described above.


    The second objective of the performance evaluation is to study the effectiveness
    of the NAC, PAR and NCD parameters for characterizing an SI’s work-load. Two types
    of SIs are considered in our simulations. The first set is based on SI profiles
    observed in the example hypermedia system of Fig 10.1. Example profiles for this
    set are plotted in Figure 10.3 and Figure 10.6. In the second set, SI profiles
    are randomly generated. The Appendix (1) gives an algorithm that is used for generating
    SI profiles of the desired work-load characteristic. The Appendix (1) also describes
    how SI profile is used to generate data for the individual AUSs. Furthermore,
    in all the cases, parameter m, representing the number of channels, is randomly
    selected using a uniform distribution with parameters U[2,4]. Jitter characteristic
    of a given channel'
