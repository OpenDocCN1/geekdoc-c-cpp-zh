- pgno: 163
  md: 'The FBF network can be regarded as a feedforward connectionist system with
    one hidden layer whose units correspond to the fuzzy rules. In Figure 4.1 a connectionist
    interpretation of the FBF network is shown. In the drawing, circles represent
    adaptive units, while squares stand for not-adaptive units, and free parameters
    are evidenced near the corresponding units.


    The FBF network can be identified both by exploiting the linguistic knowledge
    available (*structure identification problem*) [16] and by using the information
    contained in a data set (*parameter estimation problem*) [16].


    ![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_163_0.png)


    Figure 4.1 Connectionist interpretation of the FBF network.'
