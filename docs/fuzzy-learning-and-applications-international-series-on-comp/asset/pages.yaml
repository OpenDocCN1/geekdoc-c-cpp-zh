  md: 'and high fidelity sound while for other applications low resolution may be
    acceptable. A user can specify another quality parameter dictating the desired
    and acceptable resolution for a media object. For example, for audio objects,
    several levels of resolution are possible, such as telephone quality, mono CD
    quality, stereo quality, etc. Similarly, for video data numerous multi-resolution
    hierarchical compression techniques are available that can provide the user with
    a wide range of options for resolution. For example, hierarchical codes offer
    scalable resolution mechanisms that allow partitioning of compressed data into
    multi-resolution groups. In this case, one group acts as the base group while
    others provide quality enhancement to the base group [22]. Most of the standard
    compression schemes including MPEG-4 are based on this concept and offer multi-resolution
    and hierarchical partitioning of compressed data [19].


    +   - **Presentation Rate Ratio:** *Presentation Rate Ratio* is defined as the
    ratio of the actual presentation rate to the minimum acceptable presentation rate
    for a continuous media object such as video and audio. For the continuous media
    objects, in addition to reducing resolution, Presentation Rate Ratio can also
    be adjusted to cope with a constrained resource setup.


    # 10.3 Synchronization in a Multimedia Web Environment


    In this section, we discuss issues that are involved in observing synchronization
    in a multimedia Web environment. Note that the issues involved in ensuring synchronized
    presentation in a multimedia Web are quite different from the ones that are faced
    in transporting a single media object. We start our discussion by establishing
    the fact that the traffic generated by a multimedia Web server is non-stationary
    in nature.


    # 10.3.1 Non-stationary Work-Load


