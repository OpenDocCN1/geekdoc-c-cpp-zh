  md: 'The degree of invalidity or not goodness of Cause(c) is specified by the clause:


    (Cause(c) IS invalid(c))


    The membership function μ_invalid(c)(Cause(c)) (see Fig. 8.7) has only three values
    - m(c), t(c) and M(c) - where m(c) ≤ t(c) ≤ M(c). If the value of the c-th surrounding
