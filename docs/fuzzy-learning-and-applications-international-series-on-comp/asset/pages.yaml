    When facts are given, the fuzzy rules in the first stage are inferred, and then
    the consequences of the intermediate variables in the inference stage are formulated
    before they are passed on to the next stage as facts. This can easily be illustrated
    by an example with two inputs and one output at inference stage 1, and three fuzzy
    rules. The general scheme and reasoning structure of multistage inference are
    shown in Fig. 5.5 and Fig. 5.6, respectively.


    ![](img/ffb89ef8c668ade3e6e47a9ee7de70e5_193_0.png)


    Figure 5.5 A general scheme of multistage fuzzy inference system


    # 5.2.2 Multistage fuzzy inference procedure


    In general, the fuzzy inference procedure consists of the following steps:


    +   1. Read inputs and fuzzify inputs into input facts.

    +   2. Perform match-degrees among inputs and those if-clauses of fuzzy rules
    that involve input variables.

    +   3. Compute the firing strengths of the fired fuzzy rules.'
