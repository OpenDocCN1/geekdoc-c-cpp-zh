    Existing synchronization schemes can be broadly classified as feedback based,
    resource controlled, and deadline based. Feedback technique proposed in [8] runs
    at the application level and is effective to maintain synchronization among continuous
    media streams across remote user stations in the absence of globally synchronized
    clocks. As clock drift is a very slowly varying phenomenon, the scheme addresses
    the case where multimedia objects have long presentation duration, e.g., in video-on-demand
    services and is not suitable to multimedia Web applications. Transport level resource
    controlled schemes [7,9,10] use an independent channel for communication of each
    object. In these schemes, synchronization is achieved by controlling resources
    for these channels. In a multimedia Web environment, the use of an independent
    channel for each component object is expensive in terms of signaling and routing
    overheads [11,12]. This is because Web applications typically involve MMDs consisting
    of a large number of small objects [13]. Consequently, a large number of channels
    need to be released and re-established as a user hops from multimedia document
    to multimedia document during browsing. Support for standard VCR-type operations
    further complicates the problem. Hence, it is desirable to re-use the same channel
    for the transport of several multimedia objects during a Web session. The deadline
    based synchronization schemes [14–16], on the other hand, can re-use the same
    channel for the transport of several multimedia objects during a Web session.
    However, such schemes do not address dynamically changing resource requirements
    of a multimedia Web session.


    The earlier proposed synchronization schemes also assume that the underlying networking
    infrastructure provides *hard* QOS guarantees. The synchronization problem becomes
    more acute when QOS guarantees provided by the network are *soft* and can vary
    during the course of a multimedia session. Examples of such networking environments
    include *Reservation Setup Protocol* (RSVP) running on an *IP* network [17]. *Available
    Bit Rate* (ABR) channels in ATM networking [18] and RF channels in mobile networking
    [19] are also examples of such networking environments.


    For distributed multimedia Web systems, light-weight synchronization protocols
    that can readily adapt to the non-stationary work-load of the browsing process
    and changing network configurations are needed. In this chapter, we propose a
    framework that allows multimedia servers to *intelligently* adapt to the changing
    work-load generated by the Web browsing environment of Fig. 10.1 and to variations
    in the availability of network resources. This goal is achieved by using a *dynamic
    scheduler* based on a *neuro-fuzzy* framework.'
