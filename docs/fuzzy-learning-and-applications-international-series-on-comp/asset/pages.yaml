- pgno: 25
  md: 'Increasing the importance of some points: In a similar way as explained in
    the previous case it is possible to link a weight to some patterns to increase
    or decrease their weight in respect of the others.


    Other considerations: Considering the generality of formula (1.6) it is possible
    to think of several other applications. For example, it is possible to give a
    weight to the outputs, too.


    # 1.3.6 Output singletons


    Now it will be shown that the information regarding the conclusion of all rules
    can be calculated using standard linear algebra. In the following the degree of
    truth of the rth rule deriving from the pth learning pattern will be denoted by
    the symbol θ_rp.


    If we know all θ_rp in the case of WS or the normalized thetas \bar{θ}_{rp} =
    \frac{θ_{rp}}{\sum_{r=1}^{R} θ_{rp}} in the WM, it follows that the output is
    a linear combination of these values. Let us indicate with \bar{Θ} the matrix
    of P rows and R columns containing the thetas (in the WS case) or the normalized
    ones (in the WM case). Let us indicate with \bar{Z} the matrix of R rows and O
    columns containing the output singletons z_{or} and with \bar{Y} the matrix P
    rows and O columns containing the desired output values y''_{op} ∀o,p. The linear
    system must be solved:


    ```

    \bar{Θ} \bar{Z} = \bar{Y} (1.7)

    ```


    The system, which generally has many more equations than variables, can easily
    be solved in a robust manner with a SVD.


    From linear algebra we know that the best solution of system (1.7), which minimizes
    the residual, is that obtainable with the aid of the pseudo-inverse of Moore-Penrose
    [19]. So system (1.7) can be rewritten:


    ```

    \bar{T} \bar{Z} = \bar{Q} (1.8)

    ```


    where \bar{T} = \bar{Θ}^T \bar{Θ} and \bar{Q} = \bar{Θ}^T \bar{Y}. In this case
    the dimensions of the two matrices \bar{T} and \bar{Q} are respectively R × R
    and R × O that are generally much smaller than those of \bar{Θ} and \bar{Y}.


    As eq. (1.6) is fully supported in GEFREX, some modifications are needed in the
    above matrix equations. Even if in eq. (1.6) only one k_{op} is different from
    the numerical value 1 we cannot use formulae (1.8). To simplify this it was imposed
    that k_{op} = k_{1p}k_{2o} ∀p,o. If we define \bar{K}_1 and \bar{K}_2 the two
    diagonal matrices are built respectively with the values of the vectors k_{1p}
    and k_{2o} we must solve:


    ```

    \bar{K}_1 \bar{Θ} \bar{Z} \bar{K}_2 = \bar{K}_1 \bar{Y} \bar{K}_2 (1.9)

    ```'
