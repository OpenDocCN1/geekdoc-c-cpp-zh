- pgno: 14
  md: '# Evolutionary Fuzzy Learning


    # Abstract


    This chapter presents the fusion of neural networks and genetic algorithms for
    fuzzy supervised learning. It is demonstrated that this approach is superior for
    tasks such as classification, function approximation, and time series prediction.


    # 1.1 Introduction


    Linguistic rules to describe systems are being used successfully in many application
    domains [1–7]. Fuzzy systems are very suitable to describe very complex systems
    where it is very difficult to give a mathematical description.


    Until now, there has been no systematic procedure for the design of Fuzzy Logic
    (FL) systems. To overcome this problem some papers propose automatic methods to
    extract fuzzy rules using Neural Networks (NNs) [8,9], fuzzy clustering [10–12],
    genetic algorithms (GAs) [13–17], or GAs+NNs methods [18]. Some of these techniques
    generate fuzzy logic controllers [9,13,15,16]. Other methods are used for fuzzy
    classification, fuzzy function approximation, or time series prediction.


    This chapter presents a hybrid GAs+NNs approach (called GEFREX, which stands for
    GEnetic Fuzzy Rule EXtractor) for fuzzy supervised learning. It is able to deal
    with tasks such as classification, function approximation, and time series prediction.
    Its main characteristic is the low number of parameters needed in the description
    of the systems learnt.


    The chapter is divided into two parts. In the former we have included in detail
    GEFREX and its capabilities. In the latter the distributed version of GEFREX is
    explained. This new software has been called PARGEFREX and shows very interesting
    properties in finding very difficult minima of the error function.


    # 1.2 Fuzzy knowledge representation'
