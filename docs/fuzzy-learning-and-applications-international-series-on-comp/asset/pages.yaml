- pgno: 372
  md: '# A Neuro-Fuzzy System Based on Logical Interpretation of If-Then Rules


    # Abstract


    Initially, an axiomatic approach to the definition of fuzzy implication has been
    recalled in this chapter. Based on this definition several important fuzzy implications
    and their properties have been described. Then, the idea of approximate reasoning
    using generalized modus ponens and fuzzy implication is considered. The elimination
    of the non-informative part of a final fuzzy set before defuzzification plays
    the key role in this chapter. After reviewing well-known fuzzy systems, a new
    artificial neural network based on logical interpretation of if-then rules (ANBLIR)
    is introduced. Another novelty incorporated in the system is the moving fuzzy
    consequent in if-then rules. The location of this fuzzy set is determined by a
    linear combination of system inputs. Moreover, this system automatically generates
    rules from numerical data. The proposed system operates with Gaussian membership
    functions in the premise part and triangular in the consequence part. Parameter
    estimation has been made by combination of both gradient and least squares methods.
    For initialization of unknown parameter values of premises, a preliminary fuzzy
    c-means clustering method has been employed. The applications of ANBLIR to pattern
    recognition on numerical examples using benchmark databases (FORENSIC GLASS, IRIS,
    WINE and MONKS) are shown.


    # 11.1 Introduction


    An investigation of inference processes when premises and/or conclusions in if-then
    rules are fuzzy is still a subject of many papers [2], [4], [6], [9], [11], [16],
    [20], [22], [28]. In such processes, a sound and proper choice of logical operators
    plays an essential role. The theoretical (mathematical) and the practical (computational)
    behavior of logical operators in inference processes has to be known before such
    a choice is made. Both types of the above mentioned knowledge related to well-known
    families of triangular norms and implications can also be found in the literature
    [9], [11], [28].'
