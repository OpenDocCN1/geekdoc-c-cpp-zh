  md: '# 4.7 Example


    Let us consider the continuous stirred tank reactor (CSTR) as outlined in Chapter
    1. The system is described by


    $$\frac{dx_1}{dt} = -(2 + u)(x_1 + 0.25) + (x_2 + 0.5)\exp\left[\frac{25x_1}{x_1
    + 2}\right]\quad (4.7)$$


    $$\frac{dx_2}{dt} = 0.5 - x_2 - (x_2 + 0.5)\exp\left[\frac{25x_1}{x_1 + 2}\right]\quad
    (4.8)$$


    where $x_1$ represents deviation from dimensionless steady-state temperature and
    $x_2$ represents deviation from dimensionless steady-state concentration. In the
    present work, the initial conditions $x_1(0)=0.09$ and $x_2(0)=0.09$ are used.
    We consider the case where the control $u$ is unbounded. The optimal control problem
    is to determine $u$ in the time interval $0 \le t < t_f$ that will minimize the
    performance index


    $$I = \int_0^{t_f} (x_1^2 + x_2^2 + 0.1u^2)dt\quad (4.9)$$


    where the dimensionless final time $t_f$ is specified as 0.78. To evaluate the
    performance index conveniently and without introducing any unnecessary approximation,
    we introduce a new state variable $x_3$ by


    $$\frac{dx_3}{dt} = x_1^2 + x_2^2 + 0.1u^2\quad (4.10)$$


    with the initial condition $x_3(0)=0$, and integrate this equation along with
    the other two equations to yield the performance index. However, the x-grid pertains
    to $x_1$ and $x_2$ only. Suppose we divide the given time interval into 13 stages,
    each of length 0.06 ($P=13$). To test the basic procedure, Luus [5] took the centre
    of the x-grid as (0,0) and for control 3.0. The initial region size for each $x_i$
    was taken as 0.09 and for the control 3.0. A reduction factor of 0.90 was used
    after every iteration. The convergence profile is given in Figure 4.2, where the
    specification of number of grid points and number of allowable values for control
    is given as $(N \times N, M)$. For adequate convergence, it is clear that more
    than 20 iterations are required even when a relatively large number of grid points
    are used.


    # 4.8 Use of accessible states as grid points


    Although easy to program, the method described above is not computationally attractive,
    since a very large number of calculations are required even for the 2-dimensional
    CSTR problem. The use of a coarse grid with region contraction to provide an accurate
    answer worked well with three test problems [5]. But even here the curse of dimensionality
    comes to the forefront. If we visualize an x-grid having only 5 values'
