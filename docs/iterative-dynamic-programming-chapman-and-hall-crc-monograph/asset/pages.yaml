    Figure 3.2: Cross-current extraction system


    The state equation can then be written as


    $$x(k+1)=\frac{x(k)}{1+\alpha u(k+1)},\qquad k=0,1,2.\tag{3.35}$$


    We would like to choose the flow rates $w(1), w(2),$ and $w(3)$, or in normalized
    form $u(1), u(2),$ and $u(3)$, so that we remove the maximum amount of solute
    from the raffinate stream. However, there is a cost associated with the use of
    the extract solvent. Therefore, the performance index to be maximized is chosen
    as


    $$I[x(0),3]=[x(0)-x(3)]-\theta[u(1)+u(2)+u(3)],\tag{3.36}$$


    where $\theta$ is a cost factor associated with the use of extract solvent. This
    optimization problem is well suited for dynamic programming. When there are $P$
    stages, then the performance index becomes


    $$I[x(0),P]=[x(0)-x(P)]-\theta\sum_{i=1}^{P}u(i).\tag{3.37}$$


    As we did with the simple optimal control problem earlier, we solve this optimization
    problem by first considering $P=1$ and then increasing $P$ until we reach $P=3.$


    $P = 1$


    When we have a single stage, the performance index is


    $$I[x(0),1]=[x(0)-x(1)]-\theta u(1)\tag{3.38}$$


    where


    $$x(1)=\frac{x(0)}{1+\alpha u(1)}.\tag{3.39}$$'
