  md: '# Chapter 2


    # Steady-state optimization


    # 2.1  Introduction


    We consider the general problem of minimizing or maximizing the real-valued performance
    index


    $$I=f(x_1,x_2,\ldots,x_n) \tag{2.1}$$


    subject to the set of equality constraints


    $$\phi_i(x_1,x_2,\ldots,x_n)=0,\qquad i=1,2,\ldots,m \tag{2.2}$$


    with $m\leq n$, and a set of inequality constraints


    $$g_j(x_1,x_2,\ldots,x_n)\leq 0,\qquad j=1,2,\ldots,s, \tag{2.3}$$


    through the appropriate choice of $x_1,x_2,\ldots,x_n$.


    There are many excellent books written to deal with steady-state optimization
    as described by Equations (2.1)-(2.3). For example, one may refer to the books
    by Himmelblau [7] and Edgar and Himmelblau [4]. Here we wish to outline only two
    optimization procedures: linear programming and the direct search optimization
    procedure of Luus and Jaakola [29], referred to as the LJ optimization procedure.
    Linear programming is important to give the reader an understanding of shadow
    prices that provide useful sensitivity information. The shadow prices are related
    to Lagrange multipliers, which in turn are similar to the adjoint variables encountered
    in optimal control. The LJ optimization procedure provides the basis for iterative
    dynamic programming where we use a systematic reduction in the size of the regions
    allowed for control candidates.


    # 2.2  Linear programming


    One of the most useful and powerful means of solving multi-dimensional steady-state
    optimization problems is *linear programming*. There are three requirements for
    its'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'use. First, the performance index must be a linear function of the variables.
    Second, the model, as expressed by the constraining equations, must be linear,
    and, third, the variables must be positive semi-definite. Specifically, the problem
    for linear programming can be posed as follows.


    # Problem:


    Determine the values of the variables $x_1, x_2, \cdots, x_n$ such that the performance
    index


    ```

    $I = p_1 x_1 + p_2 x_2 + \cdots + p_n x_n \quad (2.4)$

    ```


    is maximized, subject to the constraints


    ```

    $\mathbf{Ax} = \mathbf{b} \quad (2.5)$

    ```


    and


    ```

    $x_i \ge 0, \quad i = 1, 2, \cdots, n \quad (2.6)$

    ```


    where $\mathbf{b}$ is an $(m \times 1)$ vector with $b_j \ge 0, j = 1, 2, \cdots,
    m$. Also, the $(m \times n)$ matrix $\mathbf{A}$ has the special form


    ```

    $\mathbf{A} = \begin{bmatrix} 1 & 0 & 0 & \cdots & 0 & 0 & a_{1,m+1} & \cdots
    & a_{1j} & \cdots & a_{1n} \\ 0 & 1 & 0 & \cdots & 0 & 0 & a_{2,m+1} & \cdots
    & a_{2j} & \cdots & a_{2n} \\ . & . & . & . & . & . & . & . & . & . & . \\ . &
    . & . & . & . & . & . & . & . & . & . \\ . & . & . & . & . & . & . & . & . & .
    & . \\ 0 & 0 & 0 & \cdots & 1 & 0 & a_{m-1,m+1} & \cdots & a_{m-1,j} & \cdots
    & a_{m-1,n} \\ 0 & 0 & 0 & \cdots & 0 & 1 & a_{m,m+1} & \cdots & a_{mj} & \cdots
    & a_{mn} \end{bmatrix} \quad (2.7)$

    ```


    where the first $m$ columns of $\mathbf{A}$ consisting of elementary $(m \times
    1)$ unit vectors make up an $(m \times m)$ identity matrix.


    # Solution:


    Picture $\mathbf{A}$ as being partitioned into $n$ column vectors, so that Eq.
    (2.5) may be written as


    ```

    $\mathbf{b} = x_1 \mathbf{a}_1 + x_2 \mathbf{a}_2 + \cdots + x_m \mathbf{a}_m
    + x_{m+1} \mathbf{a}_{m+1} + \cdots + x_n \mathbf{a}_n. \quad (2.8)$

    ```


    Since $\mathbf{b}$ is a vector of $m$ elements, only $m$ of the vectors $\mathbf{a}_1,
    \mathbf{a}_2, \cdots, \mathbf{a}_n$ can be linearly independent. Let us choose
    these to be the first $m$ vectors, since these vectors constitute the natural
    basis for the $m$-dimensional space. Then a feasible solution to Eq. (2.8) is


    ```

    $\mathbf{x}^T = [b_1 \; b_2 \; \cdots \; b_m \; 0 \; 0 \; \cdots \; 0], \quad
    (2.9)$

    ```


    and the corresponding value of the performance index as calculated from Eq. (2.4)
    is


    ```

    $I = p_1 b_1 + p_2 b_2 + \cdots + p_m b_m + p_{m+1} 0 + \cdots + p_n 0. \quad
    (2.10)$

    ```'
