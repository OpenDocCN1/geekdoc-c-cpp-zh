    by 750 algebraic equations


    # 1.9.3 Application to multicomponent distillation


    In simulation of multicomponent distillation at steady state, we encounter a very
    large number of nonlinear algebraic equations called the MESH equations that include
    the material balance (M), equilibrium equations (E), the summation of mole fractions
    (S) and the heat balance equations (H). For a distillation column consisting of
    n stages, in which a feed of m components is distilled, there are a total of 2mn
    + 3n equations to be solved simultaneously. A feed consisting of 11 components
    fed into a distillation column of 30 stages thus presents a problem of solving
    750 algebraic equations, many of which are nonlinear.


    By using the thermodynamic data given by Seppala and Luus [27] for 11 components,
    and using a distillation column of 30 stages with feed to the 11th stage and a
    reflux ratio of 0.4, by grouping of equations, the 750 algebraic equations were
    solved in 0.11 s on a PentiumII/350 digital computer giving a mass imbalance of
    less than'
