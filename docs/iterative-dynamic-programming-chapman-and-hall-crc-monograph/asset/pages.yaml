    and


    $$h_2 = 2x_1^2 + x_2^2 - 2x_3^2 - 2 = 0.$$


    We construct the augmented performance index


    $$J = I - \theta[(h_1-s_1)^2 + (h_2-s_2)^2],$$


    where $\theta$ is a positive penalty function factor and the shifting terms are
    initially put to zero and then, after every pass $q$, are updated by


    $$s_i^{q+1}=s_i^q-h_i, \qquad i=1,2.$$


    To observe the convergence of the iterative scheme, we look at the performance
    index $I$ and the norm of the constraint violation defined by


    $$S=|h_1|+|h_2|.$$


    To solve this problem with the LJ optimization procedure, we took the initial
    value for each $x_i$ to be zero, and the region size for each variable to be 10.
    We used the region contraction factor of $\gamma=0.95$, and allowed 5 iterations
    per pass. For the first five passes the region size was restored to 0.80 of its
    value at the beginning of the previous pass ($\eta=0.80$), and for the rest of
    the passes the region size was determined by the extent of the variation of the
    variables, with $10^{-6}$ being the minimum value. We chose $R=25$ random points
