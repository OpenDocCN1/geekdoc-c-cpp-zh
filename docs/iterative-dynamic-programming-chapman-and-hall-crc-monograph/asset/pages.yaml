  md: '![](img/06ae75163df4fdf5e1eec243d497d393_124_0.png)


    Figure 6.1: Optimal control policy for the two-stage CSTR system using 30 stages
    of piecewise constant control


    The problem is to find the control vector u(t) in the time interval 0 ≤ t < 1
    that minimizes the performance index


    I = 10 x^T(1) x(1) + ∫₀¹ (x^T x + u^T u) dt. (6.41)


    To put the problem into standard form, we introduce an additional variable by
    the differential equation


    dx_{n+1}/dt = x^T x + u^T u (6.42)


    with the initial condition x_{n+1}(0) = 0, so the performance index to be minimized
    is in the standard form


    I = 10 x^T(1) x(1) + x_{n+1}(1) (6.43)


    where the final time t_f = 1 has been used. We are interested in establishing
    the optimal control for this system when the number of state variables and the
    number of control variables n is chosen to be 20. Here the goal is to show the
    effects of the region restoration factor η, the region contraction factor γ, and
    the number of random points chosen at each grid point R on the convergence of
    IDP, while using a single grid point (N = 1). The state equation is linear and
    the performance index is quadratic, so the problem is relatively simple.'
  merge: -1
  img_proc: true
