    # 3.3 Limitations of dynamic programming


    Although dynamic programming has been successfully applied to some simple optimal
    control problems, one of the greatest problems in using dynamic programming for
    optimal control of nonlinear systems, however, is the interpolation problem encountered
    when the trajectory from a grid point does not reach exactly the grid point at
    the next stage [4]. This interpolation difficulty coupled with the dimensionality
    restriction and the requirement of a very large number of grid points limits the
    use of dynamic programming to only very simple optimal control problems. The limitations
    imposed by the “curse of dimensionality” and the “menace of the expanding grid”
    for solving optimal control problems kept dynamic programming from being used
    for practical types of optimal control problems.


    # 3.4 References


    [1] ARIS, R.: *Discrete dynamic programming*, Blaisdell Publishing Co., New York,
    1964.


    [2] BELLMAN, R.E.: *Dynamic programming*, Princeton University Press, 1957.


    [3] BELLMAN, R. AND DREYFUS, S.: *Applied dynamic programming*, Princeton University
    Press, 1962.


    [4] LAPIDUS, L. AND LUUS, R.: *Optimal control of engineering processes*, Blaisdell,
    Waltham, Mass., 1967.'
