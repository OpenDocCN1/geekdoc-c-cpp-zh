- pgno: 23
  md: 'where the transition matrix Φ(T) is given by


    ```

    Φ(T) = exp(A T) = Σ_{i=0}^{∞} (A T)^i / i! .    (1.28)

    ```


    Eq. (1.27) can be written as


    ```

    x(T) = Φ(T) c + Ψ(T) u(0)    (1.29)

    ```


    where we have introduced the (n × m) matrix


    ```

    Ψ(T) = ∫₀^T exp[A(T - λ)] dλ B = T Σ_{i=0}^{∞} (A T)^i / (i + 1)! B.    (1.30)

    ```


    Let us now repeat the procedure but integrate from t = T to t = 2T using a constant
    value of u(T). Since we are integrating again over a time interval of the same
    length as before, we get


    ```

    x(2T) = Φ(T) x(T) + Ψ(T) u(T).    (1.31)

    ```


    Continuing the procedure, we obtain


    ```

    x[(k + 1)T] = Φ(T) x(kT) + Ψ(T) u(kT),    k = 0, 1, 2, … .    (1.32)

    ```


    The sampling time T is usually dropped to give a simpler looking equation


    ```

    x(k + 1) = Φ x(k) + Ψ u(k),    (1.33)

    ```


    which is a special case of a linear difference equation. If the series expansion
    for Φ is asymptotic, then the most convenient way of getting the matrices is to
    take a truncated series of N + 1 terms:


    ```

    Θ = Σ_{i=0}^{N} (A T)^i / (i + 1)! .    (1.34)

    ```


    Then


    ```

    Φ = I + Θ A T    (1.35)

    ```


    and


    ```

    Ψ = Θ B T.    (1.36)

    ```


    Such a procedure with N = 20 was used by Luus and Smith [23] to convert a differential
    equation describing a gas absorber into a difference equation. If the series is
    not asymptotic, we can always use the identity


    ```

    exp(A T) = [exp(A T / β)]^β    (1.37)

    ```


    and choose the constant β sufficiently large to make the series asymptotic.'
