- pgno: 193
  md: 'Jacobson et al. [7] reported a value I = 0.1717, and Chen and Huang [1] managed
    to improve the result to I = 0.1683, which is still quite far from the optimal
    value of I = 0.1666667.


    To put the problem into the form that allows us to use IDP with variable stage
    lengths, we introduce the augmented performance index


    J = x2(tf) + θ(tfc − tf − s)²

    (10.8)


    where tfc is the sum of the variable stage lengths, θ is a positive penalty function
    factor, and s is a shifting term, chosen initially zero, and is then updated after
    every pass by the deviation of the calculated final time from the specified final
    time tf


    s^{q+1} = s^{q} − (tfc − tf)

    (10.9)


    where q is the pass number. The goal then is to minimize the augmented performance
    index J. However, to keep track with respect to progress made, we report the value
    of the original performance index I and check whether the final time that is calculated
    is sufficiently close to the specified final time.


    ![](img/06ae75163df4fdf5e1eec243d497d393_193_0.png)


    Figure 10.1: Convergence profile for Example 1 with P = 20 time stages, showing
    the deviation from I = 0.1666666'
