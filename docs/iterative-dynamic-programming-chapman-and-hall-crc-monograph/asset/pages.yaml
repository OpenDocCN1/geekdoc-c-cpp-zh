  md: 'Now we let Δt → 0 to yield a first order ordinary differential equation


    $$\frac{dh(v_0)}{dv_0}=\frac{v_0}{g+k v_0^2},\qquad (3.6)$$


    which can be immediately integrated with the given initial condition to give


    $$h(v_0)=\frac{1}{2k}\ln\left(1+\frac{k v_0^2}{g}\right).\qquad (3.7)$$


    When $k$ is negligibly small then we see that $h(v_0)\to v_0^2/2g$, a result which
    can be obtained by equating the kinetic energy at the initial time and the potential
    energy at the maximum height.


    # 3.2.4 Simple optimal control problem


    Let us consider a rather simple optimal control problem where a linear discrete
    scalar system is given in the form


    $$x(k+1)=a x(k)+b u(k),\qquad k=0,1,2,\cdots,P-1,\qquad (3.8)$$


    where the initial state $x(0)$ is given, and the final state $x(P)=0$. We assume
    there are no constraints placed on the control $u(k)$. The optimal control problem
    is to choose $u(k),k=0,1,2,\cdots,P-1$ so that the performance index


    $$I[x(0),P]=\sum_{k=1}^{P}[x^2(k)+u^2(k-1)]\qquad (3.9)$$


    is minimized. Here we have shown the explicit dependence of the performance index
    on the initial state and the number of steps $P$. Naturally the performance index
    is also a function of the control policy which has to be chosen for minimization.
    To solve this problem by dynamic programming we first consider a single stage
    problem and then progressively increase the number of stages until the posed problem
    is solved.


    $P = 1$


    When we have a single stage problem, the performance index is


    $$I[x(0),1]=x^2(1)+u^2(0)\qquad (3.10)$$


    and no minimization is possible, since the specification of the final condition
    requires that we use


    $$u(0)=\frac{x(1)-a x(0)}{b}=-\frac{a}{b}x(0).\qquad (3.11)$$


    The value of the performance index is


    $$I[x(0),1]=\frac{a^2}{b^2}x^2(0).\qquad (3.12)$$'
