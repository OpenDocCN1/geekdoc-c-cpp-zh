  md: 'Let us now proceed to stage 1 where 5 jobs are to be considered. There is only
    one set to consider. We ask ourselves which job is to be done last. If \(J_4\)
    is done last, then the minimum cost of doing the other 4 jobs is obtained from
    the last line of Table 3.3 and we simply add the cost of doing \(J_4\), namely,
    \(c_4(\tau_1+\tau_2+\tau_3+\tau_4+\tau_5)\). Similarly, we find from the second
    line of Table 3.3 the order and the minimum cost of doing the first four jobs
    if \(J_2\) is done last and simply add the cost \(c_2(\tau_1+\tau_2+\tau_3+\tau_4+\tau_5)\).
    We continue the process for when \(J_3\) is done last, when \(J_4\) is done last,
    and when \(J_1\) is done last. These 5 values of cost are compared and the minimum
    of these gives us the order of the 5 jobs such that the cost is minimized.


    We see in this example that the calculations proceed in a systematic way, so that
    at each stage the optimization involves only the addition of a single job to those
    that have been already optimally calculated. The procedure is ideally suited for
    the use of a digital computer where the same calculational procedure is used repeatedly
    numerous times. Instead of simply providing a numerical approach to optimization
    problems, dynamic programming also provides functional relationships as can be
    seen in the next example.


    # 3.2.3  The stone problem


    Let us illustrate the use of dynamic programming in solving the problem of how
    high a stone rises when tossed upwards with a velocity of \(v_0\). Let us assume
    that air resistance cannot be ignored, so the equation of motion for the stone
    can be written as


    $$\frac{dv}{dt}=-g-kv^2 \tag{3.2}$$


    with the initial condition \(v=v_0\) at \(t=0\). It is clear that the height is
    a function of the initial velocity. Let us break the trajectory into two parts:
    the first part is the short distance the stone travels in a short time \(\Delta
    t\) and the second part is the remainder of the trajectory


    $$h(v_0)=v_0\Delta t+h\left(v_0+\frac{dv}{dt}\Delta t\right)+O(\Delta t^2). \tag{3.3}$$


    Now let us expand the second term on the right hand side by Taylor series, retaining
    only the first two terms, and using Eq. (3.2) to give


    $$h(v_0)=v_0\Delta t+h(v_0)-[(g+kv_0^2)\Delta t]\frac{dh(v_0)}{dv_0}+O(\Delta
    t^2). \tag{3.4}$$


    When we rearrange Eq. (3.4) and divide by \(\Delta t\), we get


    $$\frac{dh(v_0)}{dv_0}=\frac{v_0}{g+kv_0^2}+O(\Delta t). \tag{3.5}$$'
