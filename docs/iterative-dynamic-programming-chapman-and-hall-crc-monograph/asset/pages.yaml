- pgno: 105
  md: '# Chapter 5


    # Allowable values for control


    # 5.1  Introduction


    There are several ways in which the candidates for control can be chosen. The
    simplest way, which was used in the early work on IDP, involves taking allowable
    values of control uniformly inside the given region. This means taking one point
    at the center of the region, one point at each end of the region, and then the
    rest of the points uniformly inside the interval. This scheme is easy to program
    and is also easy to visualize. For each control variable we therefore have a minimum
    of 3 values, namely −r, 0, and r distance from the optimum value obtained at the
    previous iteration, where r is the region size. If there are two control variables,
    the minimum number of candidates is then 9. For m control variables we must examine
    then 3^m candidates at each grid point. This is fine if m is less than 5, but
    if m is large, this number becomes excessively large. Even with m = 5, the examination
    of 243 candidates for control at each grid point may be too much.


    To reduce the minimum number of candidates for control, Tassone and Luus [7] suggested
    an alternative method of examining only the vertices of the region plus the center
    point. This reduces the minimum number of candidates for control from 3^m to 2^m
    + 1, so that with m = 4, only 17 candidates for control need to be examined. Instead
    of vertices, the same reduction is obtained by using the center of the faces of
    the region. However, a better approach for high dimensional systems, as shown
    by Bojkov and Luus [1], is to choose control candidates at random inside the allowable
    region. This means that in theory there is no upper limit on m. Conceptually m
    could be greater than 100 and iterative dynamic programming could still be used.
    In fact, IDP was used successfully on a system with 130 differential equations
    and 130 control variables [4] and later with 250 differential equations with 250
    control variables [5].


    To gain insight into choosing control candidates and to see the relationship between
    choosing the candidates over a uniform distribution and choosing them at random,
    we consider an example involving 3 control variables.'
  merge: -1
  img_proc: true
