    Figure 15.1: Optimal control policy obtained with \(P = 10\) stages, each of length
    0.93 min, giving \(I = 0.35211\)


    The reactor and jacket temperature profiles for \(UA = 1500\), giving \(I = 0.35228\),
    are shown in Figure 15.5. As can be seen, the reactor temperature does not violate
    the upper and lower bounds that were specified. This yield is only 0.4% below
    the theoretical optimum of 0.35382 and is 1.3% above the best isothermal yield
    of 0.34763 mol/L. Even with \(UA = 400\), the yield of 0.35169 is 1.2% above the
    yield expected from the best isothermal operation.


    Suppose that while applying the optimal control policy for some value for \(UA\),
    from measurements in the first two minutes it becomes clear that the heat transfer
    term \(UA\) is different from the one used. This creates no problems, since for
    all the control policies the initial portion is \(w = 5\); so, the only change
    is the length of time that this control policy is kept, followed by the recalculated
    control policy for the remaining stages. Since a good initial control policy is
    already available, such a calculation can be done with a single grid point and
    no more than 2 or 3 passes. Such a calculation can be performed in less than 1
    minute of computation time, which gives adequate time for implementation of the
    optimal control policy “on-line”. The computational aspects with stages of equal
    length have been illustrated by Luus and Okongwu [5].


    # 15.3  Future directions


    Although the inclusion of additional differential equations to handle the flow
    rates as control increases the computational effort quite significantly, the computation
    time'
