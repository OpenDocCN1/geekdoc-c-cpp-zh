- pgno: 191
  md: '# Chapter 10


    # Singular control problems


    # 10.1 Introduction


    When the structure of the mathematical model is such that the control vector appears
    linearly in the state equation, i.e.,


    $$\frac{d\mathbf{x}}{dt} = \mathbf{f}(\mathbf{x}) + \mathbf{B}(\mathbf{x})\mathbf{u}\tag{10.1}$$


    and if conditions exist such that over some finite time interval(s) the gradient
    of the Hamiltonian with respect to the control vector


    $$\frac{\partial H}{\partial \mathbf{u}} = \mathbf{B}^T(\mathbf{x})\mathbf{z}\tag{10.2}$$


    is zero, where **z** is the adjoint vector, then we have a *singular* optimal
    control problem. Singular optimal control problems are very difficult to solve,
    since the gradient of the Hamiltonian does not provide any information with respect
    to control when it is zero. In using IDP we are not concerned with such auxiliary
    variables, as the adjoint vector **z** or the Hamiltonian *H*. Nevertheless, computationally
    such problems are still difficult since the sensitivity of the performance index
    with respect to changes in control is very low, and care must be exercised to
    obtain accurately the optimal control policy. Such low sensitivity of singular
    control problems was pointed out by Luus [12], and a large number of figures have
    to be retained in the performance index to get an accurate optimal control policy.
    The initial intent for the development of IDP was to handle problems of this type
    [9-11], but now it is apparent that there is a wide variety of problems for which
    IDP is well suited.


    We have already encountered a singular optimal control problem in Chapter 9, dealing
    with the determination of the optimal feed rate policy for the fed-batch reactor
    problem of Park and Ramirez [16]. Although care must be taken, we saw that the
    solution can be obtained quite readily with IDP, using the computer program for
    variable stage lengths given in Appendix D. Due to the low sensitivity, a large
    number of passes is usually required to obtain an adequately accurate solution.'
  merge: -1
  img_proc: true
