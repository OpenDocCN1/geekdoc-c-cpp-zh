- pgno: 15
  md: '# Chapter 1


    # Fundamental concepts


    # 1.1　Introduction


    Optimization, or optimal control, in the sense to be used in this book, is concerned
    with determining the largest value or the smallest value for some criterion of
    performance. For example, if we are dealing with economic benefit, then we would
    like to choose the conditions for operating the system so that the economic benefit
    would be maximized. If, however, the criterion of performance is chosen to be
    the cost, then the system should be operated to minimize the cost. In each case
    we seek the operating conditions that yield the extreme value for the performance
    criterion.


    It is obvious that the operating procedure is dictated by the choice of the criterion
    of operation. The choice of such criterion is not straightforward, since there
    are numerous factors that must be taken into consideration, such as productivity,
    profit, cost, environmental impact, reliability, yield of a reactor, quality of
    product, etc. We may want to have more than one criterion for optimization. For
    the present work, however, we assume that all the objectives can be expressed
    in terms of an appropriate scalar criterion of performance which we call *performance
    index*, with the understanding that the optimization results will be dependent
    on such a choice. It is also important to express this performance index in terms
    of the same variables that are used in the mathematical model of the physical
    system or process under consideration.


    For the development of the *mathematical model* of the system, we need some insight
    into the behavior of the physical system, and how the variables at our disposal
    may be used to change its behavior. Such a relationship may be expressed in terms
    of algebraic equations, ordinary differential equations, difference equations,
    partial differential equations, integral equations, or combinations of them. The
    simplest situation arises, of course, if the model is described in terms of algebraic
    equations only. In this case we have a *steady-state optimization problem*, or
    we may simply call the process of finding the extreme value of the performance
    index *optimization*. If, however, the model consists of differential equations,
    difference equations, or integral'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'equations, the optimization is carried out over a *trajectory* and we call
    such a problem an *optimal control* problem. The mathematical procedure to be
    used for optimization is primarily dependent on the structure of the mathematical
    model. Since there is usually a considerable amount of freedom in the choice of
    a model, one usually tries to choose the simplest model that is suitable. The
    suitability of the model is usually established from the interpretation of the
    results obtained from the optimization.


    In this book we are concerned mainly with optimal control problems. However, to
    gain insight into complex problems, it is useful to understand some fundamental
    ideas used in solving sets of algebraic equations and in solving steady-state
    optimization problems. Therefore, in the present chapter we examine the solution
    of sets of algebraic equations and in Chapter 2 we consider some aspects of steady-state
    optimization.


    One of the most difficult problems in optimization or optimal control is establishing
    with some element of certainty that the global optimum has been obtained. The
    difficulty arises when the equations describing the system are highly nonlinear
    and a large number of local optima are present. Therefore, it is necessary to
    cross-check the results, even when one is quite certain that the global optimum
    has been obtained. If such cross-checking is done by a totally different optimization
    procedure, then the confidence in accepting the result is increased. The main
    goal of this book is to present a computational procedure called *iterative dynamic
    programming* and to show how it may be used to solve a variety of optimal control
    problems.


    # 1.2  Fundamental definitions and notation


    To present a unified picture throughout this book, we will present certain definitions
    and consistent notations. For purposes of clarity, it is worthwhile to briefly
    outline some of these items.


    # 1.2.1  Operator


    An operator α is a symbol for some mathematical procedure which changes one function
    into another function. For example let us consider different operators operating
    on the continuous function $f(x)=x^3+\sin x$:


    | Operator operating on $f(x)=x^3+\sin x$ | Resulting function |

    |---|---|

    | $c=\mathrm{const}$ | $cx^3+c\sin x$ |

    | $D=d/dx$ | $3x^2+\cos x$ |

    | square root | $(x^3+\sin x)^{1/2}$ |


    The operator α is *linear* if


    $\alpha[f(x)+g(x)]=\alpha f(x)+\alpha g(x)$'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'and


    ```

    $\alpha[c f(x)] = c \alpha[f(x)]$

    ```


    where $c$ is a constant. Thus the constant $c$ and $D$ operators above are linear.
    By contrast, an operator that is not linear is called *nonlinear*, an example
    being the square root operator.


    If a relationship of the type


    ```

    $\alpha f(x) = c f(x)$

    ```


    exists, where $c$ is a constant, then $c$ is said to be an *eigenvalue* of the
    operator $\alpha$. For example,


    ```

    $\frac{d}{dx} e^{3x} = 3 e^{3x}, \qquad (1.1)$

    ```


    so 3 is an eigenvalue of the operator $d/dx$ and $e^{3x}$ is the corresponding
    *eigenfunction*.


    Another example of an eigenvalue relationship is


    ```

    $\frac{d^2}{dt^2} \sin a t = -a^2 \sin a t, \qquad (1.2)$

    ```


    and we see that $-a^2$ is an eigenvalue of the operator $d^2/dt^2$ with a corresponding
    eigenfunction $\sin a t$. Note that the same relationship holds for $\cos a t$,
    so the eigenfunction is not necessarily unique.


    Also eigenvalues corresponding to an operator may not be unique. For example,
    when we write the energy balance for the hydrogen atom in the form


    ```

    $H \psi = E \psi, \qquad (1.3)$

    ```


    where the Hamiltonian operator $H$ expresses the sum of kinetic and potential
    energies and $E$ denotes the total energy, we find numerous values for $E$ for
    which the equation holds. These values of $E$, which are eigenvalues of the operator
    $H$, are frequently called “energy levels”.


    We will be encountering eigenvalues when dealing with matrices. In that case the
    operator is a matrix, operating on a vector to give a constant times the vector.
    Then the constant is said to be an eigenvalue of the matrix and the vector is
    called the *eigenvector* corresponding to that particular eigenvalue.


