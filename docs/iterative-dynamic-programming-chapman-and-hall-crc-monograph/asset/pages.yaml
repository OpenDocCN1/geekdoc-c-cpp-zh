    for each state variable, we see that for \(n = 3\) there are 125 grid points to
    consider at every stage, which is still manageable; but when \(n = 5\), the number
    of grid points would increase to 3,125, which is a very large number even for
    fast computers. We also observe that most of such grid points are inaccessible
    from the initial state specified; thus the computational procedure as outlined
    up to now is not very efficient.


    This problem of very large number of grid points is overcome by using only the
    points that can actually be reached from the given state by applying the control.
    Therefore, instead of choosing the x-grid points independently, it was suggested
    [4] to *generate* the grid points by applying different values for control. Then
    all the grid points are accessible from the specified initial state. Furthermore,
    the dimensionality of the state vector then does not matter, and a small number
    of grid points are required. The computational scheme can now be summarized as
    follows.


    # 4.9  Algorithm for IDP


