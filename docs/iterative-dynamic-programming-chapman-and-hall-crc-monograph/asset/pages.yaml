    so that


    $$1+\alpha u(1)=\left[\frac{x(0)\alpha}{\theta}\right]^{\frac{1}{4}}.\tag{3.56}$$


    Therefore, the optimal value for control to the first stage is


    $$u^0(1)=\left[\frac{x(0)}{\alpha^3\theta}\right]^{\frac{1}{4}}-\frac{1}{\alpha},\tag{3.57}$$'
