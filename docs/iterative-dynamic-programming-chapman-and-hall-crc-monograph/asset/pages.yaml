    A → B in such a CSTR are given by


    ```

    V c_P ρ dT_R/dθ = q c_P ρ (T_0 − T_R) − V U* + (−ΔH) V R   (1.52)

    ```


    ```

    V d c_A / dθ = q (c_A0 − c_A) − V R   (1.53)

