  md: 'performance index to be minimized:


    $$J = -I + \theta_1 (x_4(t_f) - 10 - s)^2 + \theta_2 x_5(t_f) + \theta_3 x_6(t_f).
    \tag{11.148}$$


    Here we take all the penalty function factors to be equal, i.e.,


    $$\theta = \theta_1 = \theta_2 = \theta_3. \tag{11.149}$$


    Since the computations are very time-consuming and a small number of passes is
    intended, instead of after every pass, we are updating the shifting term $s$ after
    every iteration according to


    $$s^{j+1} = s^j - (x_4(t_f) - 10), \tag{11.150}$$


    where $j$ denotes the iteration number in the optimization procedure.


    To solve this problem with IDP we chose $P = 15$ time stages of equal length,
    initial control policy $u^{(0)} = 11.9$, initial region size $r_{in} = 10$, region
    contraction factor $\gamma = 0.90$, region restoration factor $\eta = 0.80$, $R
    = 11$, and allowed 5 passes, each consisting of 30 iterations, with $\theta =
    5$ and $\theta = 50$, for different values of the number of grid points $N$. As
    can be seen in Tables 11.7 with penalty function factor $\theta = 5$, the global
    optimum $I = 87.970$ was difficult to obtain because of the existence of local
    optima. The volume constraint is well satisfied. We have entered only those values
    for which the volume is not greater than 10 and for which $x_5(t_f)$ and $x_6(t_f)$
    are zero, because even a small constraint violation can have a large effect on
    the performance index. The value of the shifting parameter was $s = -2.89$. For
    the volume constraint, a small amount in excess of 10 will increase the performance
    index substantially, as can be seen from the relatively large value of the shifting
    term $s$, where we would expect an increase in $I$ of $2.89 \times 10^{-3}$ if
    the volume constraint is relaxed by $10^{-4}$.


    The set of runs was repeated with the use of $\theta = 50$. As can be seen in
    Table 11.8, the penalty function factor $\theta$ does not have much influence
    in getting the global optimum. Here the shifting parameter obtained at the optimum
    was $s = -0.289$. The global optimum $I = 87.970$ was again obtained only once.


    To improve the chances for getting the global optimum, we can examine the findings
    of Luus and Galli [15] that a larger initial region size promotes convergence
    to the global optimum. Therefore, the set of runs was repeated, using the same
    parameters, except the initial region size was doubled from 10 to 20 and 10 passes
    were allowed. The penalty factor $\theta = 5$ was used to get the results of Table
    11.9. The global optimum $I = 87.970$ was obtained with $N = 3, 5$ and 7. The
    use of $N = 13$ led to the second best local optimum $I = 87.9572$, and the other
    two values for $N$ gave two other local optima: $I = 87.924$ and $I = 87.920$.
    The control policies corresponding to these four local optima are shown in Table
    11.10. Trajectories for the three constrained state variables obtained with the
    use of the global optimum control policy are shown in Figure 11.19. It is clear
    that the constraints are not violated.'
