- pgno: 194
  md: '![](img/06ae75163df4fdf5e1eec243d497d393_194_0.png)


    Figure 10.2: Convergence profile for Example 1 with P = 15 time stages, showing
    the deviation from I = 0.1666666


    To solve this as a preliminary problem by IDP, we chose P = 20 stages, initially
    each of length 0.1, θ = 100, 60 passes, each of 30 iterations with γ = 0.95 and
    η = 0.88. We chose an initial control policy of u = 0, initial region size for
    the control 1.0, and initial region size for the stage lengths 0.2. For the first
    5 passes, the stage-lengths were kept constant and after this the stage-lengths
    were considered as additional control variables, as in Chapter 9. The number of
    randomly chosen points was chosen to be R = 25, and the number of grid points
    N was allowed to be a parameter, chosen as 1 for the first run and 5 for the second
    run. As is shown in Figure 10.1, rapid convergence to I = 0.1666667 was obtained
    with both N = 1 and N = 5 grid points, yielding the control policy obtained analytically,
    i.e., u = −1 for the time interval 0 ≤ t < 1 followed by u = 0. The choice of
    P = 20 made the problem very easy, since the switching occurred exactly at the
    end of a sampling period. Suppose we had chosen P = 15. Then the use of flexible
    stage-lengths should still allow accurate switching from −1 to zero, but the convergence
    rate is expected to be slower.


    A series of runs was performed with P = 15 stages with the same parameters for
    IDP as earlier with P = 20. As is shown in Figure 10.2, the choice of N = 5 grid
    points is no longer adequate. After 100 passes, convergence to I = 0.1666988 occurs.
    With N = 9 we get convergence to I = 0.1666672, and with N = 25, convergence to
    I = 0.1666667 results, giving the switch from −1.0 to 0.0 at almost exactly at
    t = 1.000. The optimal control policy obtained with N = 25 is shown in Figure
    10.3.


    Therefore, for this seemingly simple singular control problem we require more
    than just a few grid points to ensure accurate switching time. If multiple switchings
    are required, then it is even more important to use time stages of varying lengths.'
