    Here we include, with the permission of the authors, the subroutine DVERK written
    in FORTRAN by Hull, Enright and Jackson, to integrate nonstiff ordinary differential
    equations.


    ```

    SUBROUTINE DVERK(N,FCN,X,Y,XEND,TOL,IND,C,NW,W)

    INTEGER N,IND,NW,K

    DOUBLE PRECISION X,Y(N),XEND,TOL,C(1),W(NW,9),TEMP

    EXTERNAL FCN

    IF (IND.LT.1.OR.IND.GT.6) GO TO 500

    GO TO (5,5,45,1111,2222,2222),IND

    5

    IF (N.GT.NW .OR. TOL.LE.0.0D0) GO TO 500

    IF (IND.EQ.2) GO TO 15

    DO 10 K = 1, 9

    C(K) = 0.0D0

    10 CONTINUE

    GO TO 35

    15 CONTINUE

    DO 20 K = 1, 9

    C(K) = DABS(C(K))

    20 CONTINUE

    IF (C(1).NE.4.0D0 .AND. C(1).NE.5.0D0) GO TO 30

    DO 25 K = 1, N

    C(K+30) = DABS(C(K+30))

    25 CONTINUE

    30 CONTINUE

    35 CONTINUE

    C(10) = 2.D0**(-56)

    C(11) = 1.D-35

    C(20) = X

    DO 40 K = 21, 24

    C(K) = 0.0D0

    40 CONTINUE

    GO TO 50

    45 IF (C(21).NE.0.0D0 .AND.

    + (X.NE.C(20).OR. XEND.EQ.C(20))) GO TO 500

    C(21) = 0.0D0

    GO TO 50

    50 CONTINUE

    9999 CONTINUE

