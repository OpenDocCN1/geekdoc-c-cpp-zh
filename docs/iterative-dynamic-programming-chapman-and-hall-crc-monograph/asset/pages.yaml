- pgno: 97
  md: '# ### 4.5.1  Stage *P*


    Let us start the calculations at stage *P*, which corresponds to the time interval
    \(t_f-L\le t<t_f\). For each x-grid point evaluate \(M^m\) values of the performance
    index:


    \[ I[\mathbf{x}(t_f-L),1]=\Psi(\mathbf{x}(t_f))+\int_{t_f-L}^{t_f}\phi(\mathbf{x}(t),\mathbf{u}(P-1),t)\,dt,
    \tag{4.6} \]


    where each of the \(M^m\) allowable values of control are used for \(\mathbf{u}(P-1)\)
    in turn. Compare these \(M^m\) values of the performance index and choose the
    particular value of \(\mathbf{u}(P-1)\) that gives the minimum value. This is
    the best control to use at that particular x-grid point. When we continue for
    the \(N^n\) grid points, we know the optimal control policy to use at the last
    stage for each of the grid points.


    # ### 4.5.2  Stage *P* − 1


    Let us now step backward to stage *P* − 1 corresponding to the time interval \(t_f-2L\le
    t<t_f-L\). For each grid point, we again consider \(M^m\) allowable values for
    control. However, when we integrate Eq. (4.1) from \(t_f-2L\) to \(t_f-L\), it
    is unlikely that the state \(\mathbf{x}(t_f-L)\) will be exactly one of the grid
    points at stage *P*. This problem of not hitting a grid point exactly is illustrated
    in **Figure 4.1**, where for simplicity we have taken \(n=2\), \(N=5\), \(m=1\),
    and \(M=4\). Therefore the grid consists of a \((5\times5)\) matrix. At the grid
    point \((2,3)\) of stage *P* − 1 we have shown 4 trajectories to stage *P*, corresponding
    to the use of the four allowable values of control, namely \(u=a,b,c\), and \(d\).
    None of these trajectories hits a grid point at stage *P*.


    To continue integration to the final time \(t_f\), we take the optimal control
    policy corresponding to the grid point that is *closest* to the state \(\mathbf{x}(t_f-L)\).
    As has been shown by DeTremblay and Lauus [3], this gives a good approximation
    if a sufficiently large number of grid points and of allowable values for control
    are used. As is shown in **Figure 4.1**, to continue the integration for the first
    trajectory, we use the optimal control at stage *P* corresponding to the grid
    point \((2,3)\); to continue the second trajectory corresponding to \(u=b\), we
    use the best control policy at \((3,3)\); for \(u=c\) we use \((5,5)\); and to
    continue the trajectory corresponding to \(u=d\), we use the optimal control policy
