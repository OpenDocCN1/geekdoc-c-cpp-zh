  md: 'also obtained by Dadebo and McAuley [2]. By using IDP with flexible stage-lengths
    Luus [13] reported a further improvement to I = 0.2683941 with a 4-stage control
    policy and I = 0.2683938 with a 5-stage control policy. Here we wish to provide
    some computational details to show how IDP can be used to solve this optimal control
    problem. Since we are using stages of varying lengths, as before, we introduce
    the augmented performance index


    $$J = x_3(t_f) + \theta(t_{fc} - t_f - s)^2 \tag{10.15}$$


    where $t_{fc}$ is the sum of the variable stage lengths, $\theta$ is a positive
    penalty function factor, and $s$ is a shifting term, chosen initially zero, and
    is then updated after every pass by the deviation of the calculated final time
    from the specified final time $t_f$


    $$s^{q+1} = s^q - (t_{fc} - t_f) \tag{10.16}$$


    where $q$ is the pass number. The goal then is to minimize the augmented performance
    index $J$. As before, to keep track with respect to progress made in solving the
    optimal control problem, we report the value of the original performance index
    $I$ and check whether the final calculated time is sufficiently close to the specified
    final time $t_f = 5.$


    The parameters chosen to solve this problem were essentially the same as in the
    previous example, except here we chose $P = 10$ stages rather than 20 stages.
    With $R = 25$, $\gamma = 0.95$, $\eta = 0.88$, 30 iterations per pass, and allowing
    100 passes, the convergence rate was very much dependent on the choice of the
    number of grid points $N$. Generally lower values of the performance index were
    obtained with larger $N$, as is shown in Table 10.1. In each case, after 100 passes
    the calculated value of the final time was 5.0000.


    The convergence profiles for three values of $N$ are shown in Figure 10.4. It
    is clear that no matter how many grid points are taken, it is not likely that
    the optimum control policy is obtained in a single run with initial control policy
    of zero.


    Also, it is wise not to take too many grid points, since the computation time
    increases substantially when $N$ is increased, as is shown in Figure 10.5. The
    best approach, therefore, is to perform several runs with a relatively small number
    of grid points, using as the initial control policy the best control policy that
    can be chosen by using the information gained in the previous run. To illustrate
    this approach, we examine the control policies in Figures 10.6 and 10.7, and note
    that the control for the first two stages is on the lower and upper bounds respectively.
    The control at the third stage is becoming more negative as the performance index
    is improved very slightly from $I = 0.268423$ obtained with $N = 25$ to $I = 0.268405$
    with $N = 101$ grid points.'
