    Let us now compare the two different methods of choosing candidates for control.


    By taking 3 uniformly distributed values for each control variable at −r, 0, and
    r from the best value means taking 81 candidates for control at each grid point
    at each time step. As is seen in Table 5.4, the region contraction factor γ can
    be taken smaller, and a smaller number of iterations yield convergence. In making
    the runs, the maximum number of iterations allowed was 150.


    To reduce the number of candidates for uniform search, we may take the vertices
    of the region as candidates for control as suggested by Tassone and Luus [7].
    Then instead of 81 values we may take 17 values for control. Although candidates
    chosen at random may appear to provide an inefficient means of getting the optimum,
    we shall see in Chapter 6, how the scheme is incorporated into a multi-pass method
    where the sensitivity of the parameters is reduced and the global optimum is more
    readily obtained.


    If the number of control variables is small (less than 5), either method may be
    used for choosing the candidates for control. However, if the number of control
    variables is larger than 5, then choosing the candidates at random is a considerably
    better approach. This idea is illustrated with several examples by Bojkov and
    Luus [1] who also considered a problem with 20 control variables. For the latter,
    the only feasible approach was to use randomly chosen candidates for control.
    We consider the optimal control of high-dimensional systems later in Chapter 7.'
