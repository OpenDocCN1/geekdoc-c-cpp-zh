- pgno: 253
  md: 'We therefore choose the augmented performance index


    $$J=t_f+\theta[(x_1(t_f)-1S-s_1)^2+(x_2(t_f)-s_2)^2+(x_3(t_f)-s_3)^2+(x_4(t_f)-s_4)^2],
    \tag{12.21}$$


    where $\theta$ is a positive penalty function factor and the shifting terms $s_i$
    are updated after every pass of IDP according to Eq. (12.7).


    To solve this problem, we made two preliminary runs with $P=5$ time stages, each
    chosen initially to be of length 1.0. We chose the initial control policy to be
    zero, and initial region sizes for both control and stage lengths to be 1.0. The
    penalty function factor $\theta$ was chosen to be 10, $R=50$, region contraction
    factor $\gamma=0.80$, region restoration factor $\eta=0.95$, and 100 passes each
    consisting of 30 iterations were performed. The runs were made with $N=3$ grid
    points, and with $N=5$. The convergence profiles of these runs were very similar,
    but a smaller value for $t_f$ was obtained with $N=5$, namely, 8.58012 versus
    $t_f=8.58162$ with $N=3$. The convergence profile with $N=5$ is shown in Figure
    12.1. The resulting control policy consisted of 4 stages with $u(0)=1.0$, $u(1)=-1.0$,
    $u(2)=1.0$, and $u(3)=-1.0$, with the length of the stages 2.98534, 1.30471, 1.30394,
    and 2.98492 respectively. There was also a very short stage of length 0.00119
    with a control value of 0.2963 before the last stage. The shifting terms were
    $s_1=0.0090816$, $s_2=-0.038988$, $s_3=0.054761$, and $s_4=-0.110204$.


    To refine these results, we dropped the very short stage, and used the results
    of this preliminary run as the initial conditions, including the values for the
    shifting terms, and performed a run with $R=25$, putting the region size for control
    to zero, and reducing the value of the region size for stage lengths to 0.1. After
    100 passes, the final time was reduced to $t_f=8.58010$ and the sum of absolute
    value norm of deviations was $1.098\times10^{-7}$. The stage lengths converged
    to $v(1)=2.98534$, $v(2)=1.30471$, $v(3)=1.30471$, and $v(4)=2.98534$. It is interesting
    to note the symmetry where $v(1)=v(4)$ with $u(0)=1$, $u(3)=-1$, and $v(2)=v(3)$
    with $u(1)=-1$, $u(2)=1$. The run was repeated with $\theta=1$, and $\theta=100$.


    Convergence patterns for all the three values of $\theta$ were very similar, as
    is shown for $\theta=1$ and $\theta=10$ in Figure 12.2. Identical values were
    obtained for the stage lengths. However, the shifting terms, given in Table 12.1,
    for the three cases are different, yielding the same value for the sensitivity,
    as given in the fifth column. In fact, the factor $-2\theta s_i$ gives the adjoint
    variable at the final time, corresponding to the variable $i$, and should be the
    same for all the values of $\theta$. It should be noted that the values for the
    sensitivity in the fifth column of Table 12.1 are close to the final values of
    the adjoint variables obtained by Moon and VanLandingham [13], given in the sixth
    column of Table 12.1.


    The time optimal control policy is shown in Figure 12.3.'
