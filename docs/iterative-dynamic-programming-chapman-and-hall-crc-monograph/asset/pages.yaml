- pgno: 96
  md: '# 4.2 Construction of time stages


    To set up the problem into a sequence of stages, as required for dynamic programming,
    we may approximate the optimal control problem by requiring a piecewise constant
    control policy instead of a continuous control policy, over $P$ stages, each of
    length $L$, so that


    $$L=\frac{t_f}{P}. \tag{4.4}$$


    Then the performance index is approximated by


    $$I[\mathbf{x}(0),P]=\Psi(\mathbf{x}(t_f))+\sum_{k=1}^{P}\int_{t_{k-1}}^{t_k}\phi(\mathbf{x}(t),\mathbf{u}(k-1),t)\,dt,
    \tag{4.5}$$


    where $t_{k-1}$ is the time at the beginning of the stage $k$, and $\mathbf{u}(k-1)$
    is the constant control in the time interval $t_{k-1}\leq t\leq t_k$, and we can
    consider the system at the grid points set up at these $P$ stages. We may also
    use a piecewise linear approximation and the stages do not necessarily have to
    be of equal length. These ideas are developed in later chapters. At present we
    wish to keep everything as simple as possible.


    # 4.3 Construction of grid for x


    Each component $x_i$ of the state vector $\mathbf{x}$ is allowed to take on $N$
    values over a region $s_i$ at each time stage, with the exception of the first
    stage, which is taken as the specified initial condition. Thus there are $N^n$
    grid points at stages 2, 3, $\ldots$, $P$. The centre point of the grid is taken
    as the best value for $\mathbf{x}$ obtained from the previous iteration.


    # 4.4 Allowable values for control


    Each component $u_j$ of the control vector $\mathbf{u}$ is allowed to take $M$
    values over a region $r_j$ at each stage. The centre point is taken as the best
    value from the previous iteration. If the constraints in Equation (4.2) are violated
    for the component $u_j$, the clipping technique is used to substitute for that
    value the upper or lower bound. Thus there are $M^m$ allowable values for the
    control vector at each of the grid points for $\mathbf{x}$.


    # 4.5 First iteration


    From the given initial condition $\mathbf{x}(0)$ and the constraints specified
    by Eq. (4.2) we can choose the centre point for the x-grid and the allowable range
    for control, and also the regions $s_i$ and $r_j$. The example will show how this
    choice may be made.'
