    where γ is a region contraction factor such as 0.95, and j is the iteration index.
    This procedure is continued for a number of iterations and the results are examined.


    To increase the efficiency of this optimization procedure and to make it applicable
    to high-dimensional optimization problems, it was found by Luus et al. [27] in
    solving an 84-dimensional cancer chemotherapy optimization problem that the use
    of a multi-pass procedure (in which a relatively small number of randomly chosen
    points is used in each iteration) improved the computational efficiency. In the
    multi-pass method the three-step procedure is repeated after a given number of
    iterations, usually with a smaller initial region size than that in the previous
    pass. Recently, Luus [22] showed that the strategy of choosing the region size
    at the beginning of a pass to be the range over which the variables have changed
    during the previous pass is an effective way of increasing the efficiency.


    The procedure is easy to program and, with the availability of very fast personal
    computers, computational inefficiency can be tolerated. One of the great advantages
    of the method is that no auxiliary variables are required, so that the user is
    closer to the problem at hand.


    This optimization procedure enabled several difficult optimization problems to
    be solved in the original paper [29], and provided a means to solve a wide variety
    of problems in optimal control, such as time suboptimal control [10,11] and gave
    good approximation to optimal control by providing a means of obtaining the elements
    for the feedback gain matrix [12]. The possibility of using LJ optimization procedure
    for general optimal control problems was demonstrated by Bojkov et al. [2]. LJ
    optimization procedure was found very useful for stabilizing systems through shifting
    of poles [30] and testing stabilizability of linear systems [14]. Research was
    done to improve the likelihood of getting the global optimum for non-unimodal
    systems [38], but even without any modification, the reliability of the LJ procedure
    was found to be very good [39], even for the difficult bifunctional catalyst blend
    problem [26]. Therefore, the LJ optimization procedure could be used effectively
    for optimization of complex systems such as heat exchanger networks [19], a transformer
    design problem [37], design of structural columns in such a way that the amount
    of material would be minimized [3], study of plant expansion possibilities [17],
    and problems dealing with metallurgical processes [35]. The simplicity of the
    method was illustrated by the computer program given in its entirety in reference
    [19].


    When the variables are restricted to be integers, special procedures may be necessary
    [16], since we cannot simply search on integer values to obtain the global optimum.
    Thus the scope of problems where LJ optimization procedure has been successfully
    applied is quite wide. In parameter estimation, Kalogerakis and Luus [8] found
    that by LJ optimization reliable estimates could be obtained for parameters in
    very few iterations, so that these estimates could then be used as starting values
    for the quadratically convergent Gauss-Newton method, without having to worry
    about'
