- pgno: 286
  md: '# Chapter 15


    # Toward practical optimal control


    # 15.1 Introduction


    In establishing the optimal control of chemical reactors, the control variable
    used most frequently is the temperature of the reacting mixture. Although the
    optimal control policy, consisting of the temperature profile, is useful for understanding
    the reactor behavior, it does not lend itself to practical use, since the temperature
    can not be changed directly. As such, temperature is not a practical control variable.
    The temperature of the reactor can be changed by withdrawing heat, or adding heat
    by means of flowing coolant or heating fluid around the reactor. Then the flow
    rates of these streams become the real practical control variables which can be
    manipulated to maximize the appropriate performance criterion.


    Using flow rates to change the reactor temperature makes the optimal control determination
    much more difficult. When faced with the problem of determining the optimal flow
    rates of heating and cooling fluids, so that the yield of a desired product in
    a batch reactor is maximized, we encounter two additional differential equations
    to handle the heat balances for the reactor and the surrounding jacket. Furthermore,
    the problem is more difficult, since the constraints on the reactor temperature
    now become state constraints, which are more difficult to handle than simple constraints
    on the control. Such practical aspects of optimal control were considered by Luus
    and Okongwu [5], who showed that the speed of our present-day computers makes
    the on-line optimal control of chemical reactors now possible. Even if there is
    uncertainty in the heat transfer coefficient, the optimal control problem can
    be solved sufficiently fast to enable on-line application. To illustrate these
    ideas, we consider the oil shale pyrolysis problem that we considered in Chapter
    9. This time, however, instead of simply determining the optimal temperature profile,
    we consider the problem of determining the optimal flow rates of coolant and heating
    fluid.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 15.2 Optimal control of oil shale pyrolysis


    Let us consider the oil shale pyrolysis problem used for optimal control studies
    by Wen and Yen [7] and by Luus [1], and for which we determined the optimal temperature
    profile in Chapter 9. The equations describing the chemical reactions are


    $$\frac{dx_1}{dt}=-k_1x_1-(k_3+k_4+k_5)x_1x_2$$ \tag{15.1}


    $$\frac{dx_2}{dt}=k_1x_1-k_2x_2+k_3x_1x_2$$ \tag{15.2}


    $$\frac{dx_3}{dt}=k_2x_2+k_4x_1x_2$$ \tag{15.3}


    $$\frac{dx_4}{dt}=k_5x_1x_2$$ \tag{15.4}


    where the rate constants are given by


    $$k_i=\exp\left(a_i-\frac{b_i}{T}\right),\quad i=1,2,\cdots,5,$$ \tag{15.5}


    and the kinetic parameters $a_i$ and $b_i$ are given in Table 9.2. The residence
    time or batch time $t_f$ is not specified, but should be approximately 9.3 min.
    The problem is to maximize the yield of bitumen $x_2(t_f)$ when starting with
    $x_1(0)=1$ and the rest of the concentrations equal to zero. By using the control
    policy in Figure 9.9, we showed that we could get $x_2(t_f)=0.35382$, which is
    1.8% better than the yield of 0.34763 obtained by the best isothermal policy of
    $T=712.5$ K. Now let us examine this problem by using as control variables the
    flow rates of coolant and heating fluids.


    By using a reactor volume of 1.2 m³ and realistic parameters, Luus and Okongwu
    [5] obtained expressions for the heat balances for the reactor temperature $T=x_5$
    and the jacket temperature $x_6$:


    $$\frac{dx_5}{dt}=\frac{602.4k_1x_1-0.833(UA/\rho)(x_5-x_6)}{C_p}$$ \tag{15.6}


    $$\frac{dx_6}{dt}=u_1(873-x_6)+u_2(373-x_6)+0.01357UA(x_5-x_6)$$ \tag{15.7}


    where the slurry density is given by


    $$\rho=2139x_1+760x_2+560x_3+1800x_4,$$ \tag{15.8}


    and the heat capacity is given by


    $$C_p=1.16x_1+0.827(1-x_1)+[3.4x_1+0.92(1-x_1)](x_5-298)\times10^{-3}.$$ \tag{15.9}


    The product of the heat transfer coefficient $U$ and the heat transfer area $A$,
    namely $UA$, is kept as a parameter and allowed to be in the range 400 to 1500
    kJ/min K.'
  merge: -1
  img_proc: true
