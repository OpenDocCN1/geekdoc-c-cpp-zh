  md: 'column vectors. To obtain a row vector, we take the *transpose* of the vector
    denoted by the superscript $T$. Similarly, the transpose of a matrix results in
    having the rows and columns interchanged. The designation $(m \times n)$ for either
    a vector or a matrix will mean $m$ rows and $n$ columns:


    ![](img/06ae75163df4fdf5e1eec243d497d393_18_0.png)


    ![](img/06ae75163df4fdf5e1eec243d497d393_18_1.png)


    It is relatively easy to verify that


    $$(\mathbf{A}\mathbf{x})^T=\mathbf{x}^T\mathbf{A}^T. \tag{1.4}$$


    When a square matrix (one in which $m=n$) equals its transpose,


    $$\mathbf{A}=\mathbf{A}^T \tag{1.5}$$


    the matrix **A** is called *symmetric*. Symmetric matrices have some desirable
    properties which help in calculations. If the columns of a square matrix **A**
    are *linearly independent*, inverse of the matrix denoted by $\mathbf{A}^{-1}$
    exists, having the property


    $$\mathbf{A}^{-1}\mathbf{A}=\mathbf{A}\mathbf{A}^{-1}=\mathbf{I}, \tag{1.6}$$


    where **I** is the *identity* matrix, which is a diagonal matrix with 1’s along
    the diagonal. Therefore, the identity matrix has the property


    $$\mathbf{A}\mathbf{I}=\mathbf{I}\mathbf{A}=\mathbf{A}. \tag{1.7}$$


    The convenience of using vector-matrix notation is realized when we consider the
    quadratic form


    $$\mathbf{x}^T\mathbf{A}\mathbf{x}=\sum_{j=1}^{n}\sum_{i=1}^{n}x_i a_{ij}x_j,
    \tag{1.8}$$


    where $a_{ij}$ are the elements of **A**.


    Frequently, a situation arises where all the elements of a vector are equal to
    the same numerical value, let us say 2. Then, instead of writing $r_i=2, i=1,2,\ldots,n$,
    or $\mathbf{r}=[2\ 2\ \cdots\ 2]^T$, we will use the shorthand $\mathbf{r}=2$.
    Sometimes, however, we wish to emphasize some entries in a table of results, by
    using boldface to make them stand out. No confusion with respect to this notation
    is expected.'
