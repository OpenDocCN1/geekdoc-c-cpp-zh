- pgno: 24
  md: '# 1.6 The performance index


    In most of the book we denote the performance index by $I$. There are times, however,
    when an augmented form of the performance index is used, and a different letter
    such as $J$ may be used, or when a profit function is implied, the letter $P$
    is sometimes used.


    When the model describing the system is a set of algebraic equations, the performance
    index is an algebraic expression in the form


    $$I = f(x_1, x_2, ..., x_n). \tag{1.38}$$


    When the system is described by differential equations or difference equations,
    there are different forms that the performance index can take. For example, we
    may have the performance index


    $$I = \int_0^{t_f} \phi(\mathbf{x}, \mathbf{u}) dt, \tag{1.39}$$


    where $t_f$ denotes final time, or we may have a performance index of the form


    $$I = \mathbf{k}^T \mathbf{x}(t_f) = \sum_{i=1}^{n} k_i x_i(t_f). \tag{1.40}$$


    Both of these are equivalent, as we will now show. Suppose we define a new state
    variable $x_{n+1}$ by the equation


    $$\frac{dx_{n+1}}{dt} = \phi(\mathbf{x}, \mathbf{u}), \quad x_{n+1}(0) = 0. \tag{1.41}$$


    Then the performance index in Eq. (1.39) is equivalent to


    $$I = x_{n+1}(t_f). \tag{1.42}$$


    This is a special form of Eq. (1.40). Therefore, for most of our work, we choose
    the performance index as an explicit function of the state at the final time in
    the form


    $$I = \Phi(\mathbf{x}(t_f)), \tag{1.43}$$


    with the understanding that we have the freedom to choose the state variables
    accordingly. There are situations, however, when the performance index can not
    be expressed as a function of the final state. Then we have a *nonseparable* performance
    index that requires special attention. That will be illustrated and discussed
    in Chapter 13.'
