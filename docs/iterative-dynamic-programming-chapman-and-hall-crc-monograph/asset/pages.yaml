    # 12.5  High dimensional systems


    The use of IDP for time optimal control of high dimensional systems has not been
    fully explored. The approaches used by Bojkov and Luus [2] have been found very
    useful in the time optimal control of a 20-plate gas absorber. Here we want to
    just outline the main ideas and the interested reader can refer to this paper
    for the details. To simplify the discussion, let us assume that the variables
    have been transformed so that the desired state is the origin.


    Rosen et al. [16] showed that there is a significant effect of the tolerance to
    which the origin is reached on the final time $t_f$ in the time optimal control.
    Although mathematically it is nice to reach the origin to within the computational
    accuracy of the computer, this is not necessary. For the 6-plate gas absorber,
    for example, to get to the origin within $10^{-6}$ tolerance gives a minimum time
    of $t_f = 6$ min, whereas to get to within $10^{-3}$ of the origin (within the
    measurement error) reduces the time'
