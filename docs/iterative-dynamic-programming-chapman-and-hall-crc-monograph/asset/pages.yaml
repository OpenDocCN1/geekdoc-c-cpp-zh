  md: 'Also, in using IDP, the progress can be followed after every iteration and
    after every pass, whereas in solving the Riccati equation intermediate results
    are not available. Although there is a systematic and regular reduction of the
    performance index from pass to pass, during each individual pass there are three
    distinct sections as is shown for pass 20 in Figure 7.17. In the first section,
    consisting of 13 iterations, the performance index does not change at all because
    the region over which the allowable values for control are taken is too large.
    In the next section consisting of 8 iterations the performance index becomes larger,
    reaching a peak at the 21st iteration. In the last section the performance index
    decreases in size to a value lower than the one at the start of the pass. The
    analysis of this convergence pattern allows one to determine whether the region
    size is adequate and whether a proper number of iterations have been used in a
    particular pass. This type of convergence profile was observed by Luus [5] for
    this system with $n = 100$. Further results are given in that paper. The listing
    of the computer program for this problem is given in Appendix D.


