  md: '# 10.2.3 Example 3


    In this example the quadratic term $x_2^2$ is added to the integrand of the performance
    index in Example 2, so the system of equations is


    \[\frac{dx_1}{dt} = x_2\] (10.17)


    \[\frac{dx_2}{dt} = u\] (10.18)


    \[\frac{dx_3}{dt} = x_1^2 + x_2^2\] (10.19)


    with $\mathbf{x}(0) = \begin{bmatrix}0 & 1 & 0\end{bmatrix}^T$, and final time
    $t_f = 5$. The constraints on the control are


    \[ -1 \le u \le 1. \] (10.20)


    It is required to find the control policy that minimizes the performance index


    \[ I = x_3(t_f). \] (10.21)


    For this problem Jacobson *et al.* [7] reported a minimum performance index $I
    = 0.8285$, which was improved by Dadebo and McAuley [2] to $I = 0.754016$ by the
    use of 80 time stages of equal length, and further improved by Luus [13] to $I
    = 0.7539848$ with the use of a 10-stage control policy, where the stages were
    of varying lengths. Since we are using stages of varying lengths, as before, we
    introduce the augmented performance index


    \[ J = x_3(t_f) + \theta(t_{fc} - t_f - s)^2 \] (10.22)


    where $t_{fc}$ is the sum of the variable stage lengths, $\theta$ is a positive
    penalty function factor and $s$ is a shifting term. As before, the shifting term
    is chosen initially zero, and is then updated after every pass by the deviation
    of the calculated final time from the specified final time $t_f$


    \[ s^{q+1} = s^q - (t_{fc} - t_f) \] (10.23)


    where $q$ is the pass number.


    The additional term $x_2^2$ in Eq. (10.19) makes the problem easier to solve than
    Example 2. With the use of a single grid point $N = 1$, convergence was rapid
    and systematic, leading to the control policy in Figure 10.10, yielding $I = 0.7539845$.
    The first 6 stages collapsed into a single stage at the beginning, giving in essence
    a 15-stage optimal control policy. By using now a larger number of stages, and
    rerunning the problem, the performance index can be improved marginally, as was
    done by Luus [13] to get a 19-stage optimal control policy with $I = 0.7539839$
    with the use of 19 stages. The improvement, however, is very slight, and quite
    negligible.'
