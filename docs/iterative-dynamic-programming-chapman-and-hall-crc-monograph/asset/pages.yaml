  md: "The next step is to improve the performance index by changing the basis of\
    \ the $m$-dimensional vector space. We accomplish this by bringing into the basis\
    \ one of the $\\mathbf{a}_j$ where $j > m$, and removing one of the vectors from\
    \ the basis. Since the basis $\\{\\mathbf{a}_1, \\mathbf{a}_2, \\cdots, \\mathbf{a}_m\\\
    }$ consists of unit vectors, we can expand $\\mathbf{a}_j$ immediately in terms\
    \ of its elements as\n\n$$\\mathbf{a}_j = a_{1j}\\mathbf{a}_1 + a_{2j}\\mathbf{a}_2\
    \ + \\cdots + a_{mj}\\mathbf{a}_m.\\tag{2.11}$$ \n\nWe can now write Eq. (2.8),\
    \ by assigning the values of $x_i$ from Eq. (2.9), as\n\n$$\\mathbf{b} = \\sum_{i=1}^{m}\
    \ b_i\\mathbf{a}_i + \\alpha\\mathbf{a}_j - \\alpha\\mathbf{a}_j,\\tag{2.12}$$\
    \ \n\nwhere we have given the flexibility of including $\\mathbf{a}_j$ through\
    \ the positive constant $\\alpha$. By using Eq. (2.11), Eq. (2.12) can be rearranged\
    \ into the form\n\n$$\\mathbf{b} = \\sum_{i=1}^{m} (b_i - \\alpha a_{ij})\\mathbf{a}_i\
    \ + \\alpha\\mathbf{a}_j.\\tag{2.13}$$ \n\nThe new value of the performance index\
    \ now becomes\n\n$$I_{new} = \\sum_{i=1}^{m} (b_i - \\alpha a_{ij})p_i + \\alpha\
    \ p_j,\\tag{2.14}$$ \n\nwhich can be rearranged into\n\n$$I_{new} = \\sum_{i=1}^{m}\
    \ b_i p_i + \\alpha\\left[p_j - \\sum_{i=1}^{m} a_{ij}p_i\\right].\\tag{2.15}$$\
    \ \n\nSince the first term of Eq. (2.15) is simply the old value of the performance\
    \ index given by Eq. (2.10), we can rewrite this equation as\n\n$$I_{new} = I_{old}\
    \ + \\alpha(p_j - z_j)\\tag{2.16}$$ \n\nwhere\n\n$$z_j = \\sum_{i=1}^{m} a_{ij}p_i.\\\
    tag{2.17}$$ \n\nTo ensure that the performance index $I$ is increased in value,\
    \ the quantity $(p_j - z_j)$ should be positive. Therefore, to choose which vector\
    \ $\\mathbf{a}_j, j = m+1,\\cdots,n$ should come into the basis, we choose the\
    \ $\\mathbf{a}_j$ for which $(p_j - z_j)$ is maximum. We would like to choose\
    \ $\\alpha$ as large as possible, but constraint (2.6) must be satisfied. Thus,\
    \ from Eq. (2.13) with the new value $x_i = (b_i - \\alpha a_{ij})$, the largest\
    \ value of $\\alpha$ that can be chosen is\n\n$$\\alpha = \\min_k\\left[\\frac{b_k}{a_{kj}}\\\
    right] > 0,\\quad k = 1,2,\\cdots,m.\\tag{2.18}$$ \n\nIf for all replacement $j$\
    \ we find that $(p_j - z_j) \\le 0$, then we have arrived at the solution if it\
    \ exists. The quantity $(z_j - p_j)$ is called the *shadow price* of the variable\
    \ $j$ and"
  merge: -1
  img_proc: true
