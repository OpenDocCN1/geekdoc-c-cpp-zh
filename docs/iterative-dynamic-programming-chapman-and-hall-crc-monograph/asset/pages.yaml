- pgno: 163
  md: '# Chapter 9


    # Variable stage lengths


    # 9.1  Introduction


    We saw in Chapter 7 that in using piecewise constant control, increasing the number
    of time stages always increases the accuracy with which the control policy is
    approximated for a linear system with a quadratic performance index. However,
    there are nonlinear optimal control problems where an increase in the number of
    stages does not necessarily improve the performance index. For example, when the
    optimal control policy involves a sudden change from one extreme value to the
    other, the time of this switching is very important. In time optimal control problems
    one anticipates this type of “bang-bang” control. There are other occasions when
    one would least expect such a change in the optimal control policy, and it may
    come as a surprise. To get a good approximation to the optimal control policy
    then is determined not so much by the number of time stages one uses, but how
    well the switching time can be approximated. Let us use a simple example for illustration.


    Let us consider the optimal control problem of Ko and Stevens [6] involving a
    first-order, reversible, exothermic chemical reaction $A \rightleftharpoons B$
    in a chemical reactor. The material and energy balances of the reactor are given
    by:


    $$\frac{dx_1}{dt}=(1-x_1)k_1-x_1k_2$$  (9.1)


    $$\frac{dx_2}{dt}=300[(1-x_1)k_1-x_1k_2]-u(x_2-290)$$  (9.2)


    with the initial condition


    $$x^T(0)=[\ 0\quad 410\ ]$$  (9.3)


    The state variable $x_1$ is the concentration of the desired component $B$, and
    $x_2$ denotes the absolute temperature. The control $u$ is a normalized heat transfer
    term dependent on the coolant flow rate, and is bounded by


    $$0\leq u\leq 0.5.$$  (9.4)'
