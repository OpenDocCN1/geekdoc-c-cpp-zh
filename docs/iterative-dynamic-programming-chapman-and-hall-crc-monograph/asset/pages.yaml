- pgno: 250
  md: '# Chapter 12


    # Time optimal control


    # 12.1 Introduction


    There are numerous situations where time optimal control problems arise. For example,
    in startup of a chemical reactor, it is frequently desired to reach the desired
    state of operation as fast as possible. In operating a crane system, one frequently
    would like the trolley to reach a desired point in minimum time. In the drug displacement
    problem, it is desirable to reach some specified concentration of drugs in a patient’s
    bloodstream in minimum time. In the operation of a robot arm to deliver a payload
    to a certain location, we encounter the time optimal control problem. Therefore,
    a considerable amount of research effort has gone into solving the time optimal
    control problem. For linear systems, linear programming may be used to determine
    the minimum number of time steps to reach the desired state, but for high dimensional
    nonlinear systems the determination of time optimal control policy is generally
    very difficult.


    In this chapter we wish to examine several approaches that have been used with
    IDP to solve some time optimal control problems.


    # 12.2 Time optimal control problem


    Let us consider the system described by the differential equation


    d**x**/dt = **f**(x, u)  (12.1)


    where the initial state **x**(0) is given. The state vector **x** is an (n × 1)
    vector and **u** is an (m × 1) control vector bounded by


    α_j ≤ u_j ≤ β_j,   j = 1, 2, ⋯, m.  (12.2)


    At the final time t_f the state variables must be at the desired values, i.e.,


    h_i = x_i(t_f) − x_i^d = 0,   i = 1, 2, ⋯, n.  (12.3)'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'The time optimal control problem is to find the control policy **u**(t) in
    the time interval 0 ≤ t < t_f that minimizes the performance index


    I = t_f.  (12.4)


    Numerically, it is required that in a minimum value of the final time t_f, we
    satisfy the constraint


    |x_i(t_f) − x_i^d| ≤ ε_i,      i = 1, 2, ⋯ , n,  (12.5)


    where ε_i is some tolerance, such as the measurement error.


    # 12.3  Direct approach to time optimal control


    To solve this optimal control problem, we follow the suggestion of Luus [10] to
    choose the augmented performance index to be minimized as


    J = t_f + θ Σ_{i=1}^n (x_i(t_f) − x_i^d − s_i)^2,  (12.6)


    and update the shifting terms s_i after every pass of IDP according to


    s_i^{q+1} = s_i^q − (x_i(t_f) − x_i^d),  (12.7)


    where q is the pass number in IDP.


    To measure the closeness of the final states to the desired states we use the
    norm of the sum of absolute deviations from the desired state, namely


    S = Σ_{i=1}^n |x_i(t_f) − x_i^d|.  (12.8)


    In order to solve the time optimal control problem by IDP, we transform the continuous
    control policy into a piecewise constant control problem by dividing the time
    interval [0, t_f] into P stages, each of variable length,


    v(k) = t_k − t_{k−1},      k = 1, 2, ⋯ , P.  (12.9)


    Computationally, we impose the condition


    v(k) > 0,      k = 1, 2, ⋯ , P,  (12.10)


    so that we do not deal with negative stage lengths.


    As we did in Chapter 9, based on the idea of Bojkov and Luus [3], we transform
    the time variable through the relationship


    dt = v(k) P dτ  (12.11)'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'so that in normalized time all the time stages are of equal length


    ```

    $$\tau_k = \frac{k}{P}, \quad k = 1, 2, \cdots, P.$$ (12.12)

    ```


    The differential equation in the time interval $\tau_{k-1} \le \tau < \tau_k$
    becomes


    ```

    $$\frac{d\mathbf{x}}{d\tau} = v(k) P f(\mathbf{x}, \mathbf{u}).$$ (12.13)

    ```


    With this transformation, at $t = t_f$, the transformed time variable $\tau =
    1$, and the time to reach the desired state is


    ```

    $$t_f = \sum_{k=1}^{P} v(k).$$ (12.14)

    ```


    Minimization of the augmented performance index in Eq.(12.6) should give the minimum
    value to $t_f$ and ensure that the state variables at the final time are close
    to the desired values. In order to test the computational viability of this approach,
    we consider several examples. In all the examples we used the DVERK [7] subroutine,
    listed in Appendix E, to integrate the differential equations.


    # 12.4 Examples


    # 12.4.1 Example 1: Bridge crane system


    Let us consider the bridge crane system used by Moon and VanLandingham [13], where
    the system is described by four differential equations


    ```

    $$\frac{dx_1}{dt} = x_2$$ (12.15)

    ```


    ```

    $$\frac{dx_2}{dt} = u$$ (12.16)

    ```


    ```

    $$\frac{dx_3}{dt} = x_4$$ (12.17)

    ```


    ```

    $$\frac{dx_4}{dt} = -0.98 x_3 + 0.1 u$$ (12.18)

    ```


    with $\mathbf{x}^T(0) = \mathbf{0}$, and the desired final state is $\mathbf{x}^d
    = [\ 15\ 0\ 0\ 0\ ]^T$. The constraints on the control are


    ```

    $$-1 \le u \le 1.$$ (12.19)

    ```


    It is required to find the control policy that minimizes the performance index


    ```

    $$I = t_f.$$ (12.20)

    ```'
