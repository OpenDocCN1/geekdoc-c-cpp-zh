  img_proc: true
- pgno: 170
  md: '# 9.2.1 IDP algorithm


    For this free final-time problem we can consider the stage length as an additional
    control variable and augment the control vector to an ((m + 1) × 1) vector, but
    for clarity of presentation we keep it separate. It is clear that, as before,
    for greatest efficiency, IDP should be used in a multi-pass fashion, where after
    a pass the region is restored to a fraction η of its value at the beginning of
    the previous pass. The algorithm can be presented in eight steps:


    +   1. Choose the number of time stages P, the number of grid points N, the number
    of allowable values for control (including stage lengths) R at each grid point,
    the region contraction factor γ, the region restoration factor η, initial values
    for the control and the stage lengths, the initial region sizes, the number of
    iterations to be used in every pass, and the number of passes.

    +   2. By choosing N values for control and the stage length, evenly distributed
    inside the specified regions, integrate Eq. (9.16) from τ = 0 to τ = 1 to generate
    N trajectories. The N values for x at the beginning of each time stage constitute
    the N grid points at each stage.

    +   3. Starting at stage P, corresponding to the normalized time τ = (P − 1)/P,
    for each grid point generate R sets of values for control and stage length:

    +      u(P) = u* j(P) + D r j(P)   (9.17)

    +      v(P) = v* j(P) + ω s j(P)   (9.18)

    +   where D is an m × m diagonal matrix with different random numbers between
    −1 and 1 along the diagonal and ω is another random number between −1 and 1; u*
    j(P) is the best value for control, and v* j(P) is the best value for the stage
    length, both obtained for that particular grid point in the previous iteration.
    Integrate Eq. (9.16) from (P − 1)/P to τ = 1 once with each of the R allowable
    values for control and stage length to yield x(t_f) so that the performance index
    can be evaluated. Compare the R values of the performance index and choose the
    control and stage length which give the maximum value. The corresponding control
    and stage length are stored for use in step 4.

    +   4. Step back to stage P − 1, corresponding to time τ = (P − 2)/P. For each
    grid point generate R allowable sets of control and stage lengths. Integrate Eq.
    (9.16) from (P − 2)/P to (P − 1)/P once with each of the R sets. To continue integration,
    choose the control and the stage length from step 3 that corresponds to the grid
    point that is closest to the x at τ = (P − 1)/P. Now compare the R values of the
    performance index and store the control policy and the stage length that yield
    the maximum value.

    +   5. Step back to stage P − 2, and continue the procedure in the previous step.
    Continue until stage 1 corresponding to τ = 0 with the given initial state as
    the grid point is reached. Make the comparison of the R values of the performance
    index to give the best control and the stage length for this stage. We now have
    the best control'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'policy and the stage length for each stage in the sense of maximizing the performance
    index from the allowable choices.


    +   6. In preparation for the next iteration, reduce the size of the allowable
    regions


    $$\mathbf{r}^{j+1}(k)=\gamma\mathbf{r}^{j}(k),\quad k=1,2,\ldots,P \tag{9.19}$$


    $$\mathbf{s}^{j+1}(k)=\gamma\mathbf{s}^{j}(k),\quad k=1,2,\ldots,P \tag{9.20}$$


    where $\gamma$ is the region reduction factor and $j$ is the iteration index.
    Use the best control policy and the stage lengths from step 5 as the midpoint
    for the next iteration.


    +   7. Increment the iteration index $j$ by 1 and go to step 2 to generate another
    set of grid points. Continue for the specified number of iterations.


    +   8. Increment the pass number index by 1, set the iteration index $j$ to 1
    and go to step 2. Continue for the specified number of passes, and examine the
    results.


    A reasonable number of iterations per pass is 20 or 30 with the region contraction
    factor $\gamma=0.95$, since the region is then well covered. For many problems
    the optimum is not found within reasonable accuracy in a single pass. Therefore
    the region should be restored to some reasonable value before the iterations are
    carried out again. An easy way to restore the region size is to take as its value
    a fraction $\eta$ of its value at the beginning of the previous pass. To help
    in deciding what value of $\eta$ to use, we can refer to [Table 9.1](#) where
    it is shown how the initial region is reduced by the choice of $\eta$ if 20 or
    30 passes are made. If 30 passes are used and $\eta$ is chosen as 0.95, then the
    initial region size after 30 passes becomes 0.2146 times its value at the beginning
    of the first pass; if $\eta$ is chosen as 0.85, then the initial region size after
    30 passes becomes 0.0076 times its value at the beginning of the first pass. Therefore,
    a balance is sought between premature collapse of the region size and the speed
    of convergence.


    Although this method of restoring the region size after every pass is not the
    best method, since it depends very much on the initial choice of the region size,
    we will use this method for all the examples in this book. Recently Luus [11]
    showed that the use of the extent over which a variable changes during a pass
    as the value to use as the region size for the next pass in steady state optimization
    yielded significant improvement in the convergence rate, and that approach enabled
    difficult fed-batch reactor problems to be optimized with great accuracy [13].


    # ## 9.3  Problems where final time is not specified


    The best way to gain insight about the choice of parameters in IDP is to examine
    some optimal control problems. Here we look at problems where the final time $t_f$
    is not specified.'
