    +   T_R = temperature of reactants leaving reactor

    +   T_0 = temperature of feed stream to reactor

    +   θ = time

    +   V = volume of reactor

    +   q = volumetric flow rate of feed and output streams

    +   R = reaction rate term

    +   −ΔH = heat of reaction

    +   c_P = heat capacity

    +   ρ = density

    +   U* = heat transfer term corresponding to cooling coil in reactor


    As shown by Lapidus and Luus [11], these equations may be put into dimensionless
    form and, through a choice of a convenient set of parameters, transformed into
