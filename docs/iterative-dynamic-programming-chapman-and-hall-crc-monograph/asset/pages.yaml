  md: '# ### 1.8.3 Photochemical reaction in CSTR


    A more challenging problem of higher dimension consists of a photochemical reaction
    in an isothermal CSTR, as formulated by Jensen [10] and used for optimal control
    studies in [11] and [25]. It served as an ideal system for testing iterative dynamic
    programming for moderate dimensional nonlinear optimal control problems [13].
    The mechanism for the reactions among the species $A,B,C,D,E,F,$ and $G$ is given
    by


    $$\begin{aligned}

    A+B &\xrightarrow{k_1} 2D\\

    C+B &\xrightarrow{k_2} CB\\

    CB+B &\xrightarrow{k^*} 3E\\

    E+D &\xrightarrow{k_3} 2F\\

    A+F &\xrightarrow{k_4} 2G

    \end{aligned}$$


    where the fifth reaction is photochemical and its rate is proportional to the
    square root of the light intensity. The intermediate compound $CB$ is postulated
    to be present in immeasurably small quantities, so it satisfies the stationary
    condition, namely $d(CB)/dt=0$. By using a convenient set of parameters, Lapidus
    and Luus [11] showed that the system is described by the eight differential equations


    $$\begin{aligned}

    \frac{dx_1}{dt} &= u_4-qx_1-17.6x_1x_2-23x_1x_6u_3 \tag{1.57}\\

    \frac{dx_2}{dt} &= u_1-qx_2-17.6x_1x_2-146x_2x_3 \tag{1.58}\\

    \frac{dx_3}{dt} &= u_2-qx_3-73x_2x_3 \tag{1.59}\\

    \frac{dx_4}{dt} &= -qx_4+35.2x_1x_2-51.3x_4x_5 \tag{1.60}\\

    \frac{dx_5}{dt} &= -qx_5+219x_2x_3-51.3x_4x_5 \tag{1.61}\\

    \frac{dx_6}{dt} &= -qx_6+102.6x_4x_5-23x_1x_6u_3 \tag{1.62}\\

    \frac{dx_7}{dt} &= -qx_7+46x_1x_6u_3 \tag{1.63}\\

    \frac{dx_8}{dt} &= 5.8(qx_1-u_4)-3.7u_1-4.1u_2+q(23x_4+11x_5+28x_6+35x_7)-5u_3^2-0.099
    \tag{1.64}

    \end{aligned}$$


    where


    +   - $x_1,x_2,\ldots,x_7$ = weight fractions of species $A$, $B$, $\ldots$, $G$

    +   - $k_1,k_2,\ldots,k_4$ = reaction rate constants

    +   - $u_1,u_2,u_4$ = inlet feed rate of pure components $A$, $B$ and $C$

    +   - $u_3$ = square root of light intensity'
