- pgno: 95
  md: '# Chapter 4


    # Iterative dynamic programming


    # 4.1 Introduction


    We consider the continuous dynamic system described by the vector differential
    equation


    $$\frac{d\mathbf{x}}{dt}=\mathbf{f}(\mathbf{x},\mathbf{u},t)\tag{4.1}$$


    with the initial state $\mathbf{x}(0)$ given, where $\mathbf{x}$ is an $(n\times1)$
    state vector and $\mathbf{u}$ is an $(m\times1)$ control vector bounded by


    $$\alpha_j \le u_j(t) \le \beta_j,\quad j=1,2,\cdots,m.\tag{4.2}$$


    For the performance index we choose a scalar function of special form to allow
    the discussion of the optimization procedure:


    $$I[\mathbf{x}(0),t_f]=\Psi(\mathbf{x}(t_f))+\int_{0}^{t_f}\phi(\mathbf{x},\mathbf{u},t)dt,\tag{4.3}$$


    where the final time $t_f$ is specified. The optimal control problem is to choose
    the control policy $\mathbf{u}(t)$ in the time interval $0\le t < t_f$ such that
    this performance index is minimized. We may have also state constraints, but for
    simplicity we shall leave these for later consideration in Chapter 11.


    The initial ideas on iterative dynamic programming were developed and tested by
    Luus [5] and then refined [4] to make the computational procedure much more efficient.
    The fundamental ideas about using dynamic programming are based on the optimal
    path problem considered in Chapter 3, and are adapted to the solution of the optimal
    control problem.'
