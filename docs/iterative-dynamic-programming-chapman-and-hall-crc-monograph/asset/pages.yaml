  img_proc: true
- pgno: 239
  md: '![](img/06ae75163df4fdf5e1eec243d497d393_239_0.png)


    Figure 11.16: Optimal state trajectories for Example 6 resulting from the use
    of the control policy in Figure 11.15


    # 11.3.2  State constraint variables


    To deal with inequality constraints on the state, we follow the approach of Luus
    [10], which was also used in Example 6 in the previous section, with a small variation.
    Instead of difference equations, we use differential equations as suggested by
    Mekarapiruk and Luus [21] to construct the penalty functions. We therefore introduce
    *k state constraint variables* through the differential equations


    $$\frac{dx_{n+i}}{dt}=\begin{cases}0 & \text{if } \psi_i(\mathbf{x})\leq 0\\ \psi_i(\mathbf{x})
    & \text{if } \psi_i(\mathbf{x})>0\end{cases} \tag{11.121}$$


    for $i=1,2,\ldots,k$, with the initial condition


    $$x_{n+i}(0)=0,\qquad i=1,2,\ldots,k. \tag{11.122}$$


    At the final time $t_f$, $x_{n+i}(t_f)$ therefore gives the total violation of
    the $i^{th}$ inequality constraint integrated over time. The advantage of taking
    such value is that sometimes a violation may occur for a short time inside a time
    stage, and such a violation may go by unnoticed if the difference equation approach
    is used where the violations are checked only at the ends of the time stages.
    We choose the augmented performance index to be minimized as


    $$J=I+\sum_{i=1}^{k}\theta_i x_{n+i}(t_f) \tag{11.123}$$


    where $\theta_i>0$ are penalty function factors for the inequality state constraints.
    Let us consider some illustrative examples.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Example 7: Chemical reactor control


    Let us consider the optimal control of a chemical reactor involving a first-order
    chemical reaction as studied by Ko and Stevens [7], Reddy and Husain [24], Luus
    [10,12], and by Mekarapiruk and Luus [21]. The system is described by two differential
    equations


    ```

    \frac{dx_1}{dt} = (1 - x_1)k_1 - x_1 k_2 \tag{11.124}

    ```


    ```

    \frac{dx_2}{dt} = 300[(1 - x_1)k_1 - x_1 k_2] - u(x_2 - 290) \tag{11.125}

    ```


    with the initial condition


    ```

    \mathbf{x}^T(0) = [\ 0\ 380\ ]. \tag{11.126}

    ```


    The state variable $x_1$ is the concentration of the desired component, and $x_2$
    denotes the absolute temperature. The control $u$ is a normalized coolant flow
    rate bounded by


    ```

    0 \le u \le 0.5. \tag{11.127}

    ```


    The reaction rate constants are dependent on the temperature $x_2$ in the following
    manner:


    ```

    k_1 = 1.7536 \times 10^5 \exp\left(\frac{-1.1374 \times 10^4}{1.9872 x_2}\right)
    \tag{11.128}

    ```


    and


    ```

    k_2 = 2.4885 \times 10^{10} \exp\left(\frac{-2.2748 \times 10^4}{1.9872 x_2}\right).
    \tag{11.129}

    ```


    In addition, there is an upper constraint on the temperature


    ```

    x_2(t) \le 460. \tag{11.130}

    ```


    The problem is to find $u$ in the time interval $0 \le t < t_f$ such that the
    performance index


    ```

    I = x_1(t_f), \quad t_f = 5\ \text{min} \tag{11.131}

    ```


    is maximized.


    In order to deal with the inequality state constraint in Eq. (11.130), we introduce
    the state constraint variable $x_3$ by


    ```

    \frac{dx_3}{dt} = \begin{cases} 0 & \text{if } x_2 - 460 \le 0 \\ x_2 - 460 &
    \text{if } x_2 - 460 > 0 \end{cases} \tag{11.132}

    ```


    with the initial condition $x_3(0) = 0$. Therefore, whenever there is a state
    constraint violation, $x_3$ is increased in value. If at $t_f$, $x_3(t_f)$ is
    zero, then no violations of the constraint equation have occurred.


    Since the performance index $I$ is to be maximized, we choose as the augmented
    performance index to be minimized as


    ```

    J = -I + \theta x_3(t_f) \tag{11.133}

    ```'
  merge: -1
  img_proc: true
