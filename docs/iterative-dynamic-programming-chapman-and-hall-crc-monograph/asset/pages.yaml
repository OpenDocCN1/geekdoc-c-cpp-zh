- pgno: 160
  md: 'By substituting Eqs. (8.29)-(8.30) into Eqs. (8.18)-(8.19), we get the approximate
    non-delay system


    $$\begin{aligned}

    \frac{dx_1}{dt} &= f_1 \tag{8.31}\\

    \frac{dx_2}{dt} &= f_2 \tag{8.32}\\

    \frac{dx_3}{dt} &= x_1-x_3-\tau f_1-R_2+0.25 \tag{8.33}\\

    \frac{dx_4}{dt} &= x_2-2x_4-u_2[x_4+0.25]-\tau f_2+R_2-0.25 \tag{8.34}\\

    \frac{dx_5}{dt} &= x_1^2+x_2^2+x_3^2+x_4^2+0.1(u_1^2+u_2^2). \tag{8.35}

    \end{aligned}$$


    We considered this non-delay system with $\tau=0.1$ in Chapter 6, and found that
    more than one grid point was required for obtaining the optimal control. With
    the use of 11 grid points, the optimal 30-stage piecewise constant control policy
    was obtained without any difficulty. From this 30-stage piecewise constant control
    policy, we can get an approximation for the 10-stage piecewise linear control
    policy that may be used as a starting policy for the delay-time system.


    By taking the delay term $\tau=0.1$, with $\gamma=0.95$, $\eta=0.85$, and initial
    region size of 0.05, and allowing 50 passes, each consisting of 50 iterations,
    we found that the effect of the number of randomly chosen points $R$ had very
    little effect if $R$ was at least 25. Convergence from the initial value of $I=0.085504$
    to the vicinity of 0.023 was very rapid. The use of $R=15$, however, gave inadequate
    convergence. The results are given in Table 8.3, where it is quite clear that
    at least 25 randomly chosen points are required. In none of these runs was the
    optimum obtained within 5 figures; so, a second run was necessary. For subsequent
    runs the initial region was chosen as 0.0001 and 30 passes were performed, where
    the best control policy was used at the start. After 3 such runs the optimum $I=0.023166$
    for $\tau=0.1$ was obtained. Now using the optimal control policy for $\tau=0.1$
    as the initial control policy, the optimal control policy for $\tau=0.2$ was obtained.
    Such a continuation approach was used to establish the optimal control policies
    for the higher values of the time delay factor, giving the results in Table 8.4.


    As can be seen in Figure 8.4, the control policies do not change too much when
    the delay factor is increased from 0.1 to 0.8.


    Luus et al. [7] showed that almost the same values for the performance index can
    be obtained with the use of 7 rather than 10 stages for piecewise continuous control.
    For larger values of $\tau$, the values for the performance index are somewhat
    better than were reported by Oh and Luus [8] using control vector iteration procedure.
    For example, for $\tau=0.8$, by IDP we obtained $I=0.02550$ versus the value $I=0.02561$
    reported by Oh and Luus [8]. To carry out 30 passes, each consisting of 50 iterations,
    with $R=25$ took about 4 min of computation time on the PentiumII/350 personal
    computer.'
