- pgno: 153
  md: '# Chapter 8


    # Time-delay systems


    # 8.1 Introduction


    Engineering systems often contain delayed elements such as recycle streams, transportation
    lags, and time delays associated with the measurement of output variables. These
    time delays can have significant effect on the control of the system under consideration,
    so it is important to incorporate them into the mathematical model. This gives
    rise to differential equations with delayed arguments.


    Due to the difficulty of solving the optimal control of nonlinear time-delay systems,
    Oh and Luus [8] suggested a suboptimal control approach based on the use of Taylor
    series expansion of the delayed state to retain sufficient dynamic features of
    the original time-delay system, and then using direct search to obtain the best
    feedback gain matrix in the sense of minimizing the associated performance index.
    For small time delays this approach gave very good results.


    With IDP there are no conceptual difficulties, since no equations have to be integrated
    backwards. The first attempt to use IDP with time-delay systems was made by Dadebo
    and Luus [3], who used piecewise constant control policy, and obtained good results
    with several problems. In the present chapter, instead of using only piecewise
    constant control, we wish to use also piecewise linear continuous control, so
    that better results could be obtained with a fewer number of time stages. Here
    we will use a single grid point (N = 1). If a single grid point is used, then
    the problem of how to determine the initial profiles, which are required for the
    delay terms, does not arise. The only difficulty is that of determining sufficiently
    good starting conditions for highly nonlinear systems to ensure convergence. The
    recent work by Luus et al. [7] shows that a good way of overcoming such difficulty
    is to use the Taylor series expansion for the delay terms to convert the given
    system into a nondelay system for which the optimal control policy can be readily
    established. Then the optimal control policy for the nondelay system provides
    the starting control policy for the time-delay system. We will illustrate this
    approach with the last example.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 8.2 Problem formulation


    Let us consider the system described by the vector differential equation with
    a constant time delay τ


    $$\frac{d\mathbf{x}}{dt}=\mathbf{f}[\mathbf{x}(t),\mathbf{x}(t-\tau),\mathbf{u}(t)]\tag{8.1}$$


    with the given initial state profile


    $$\mathbf{x}(t)=\mathbf{g}(t),\quad -\tau \le t < 0\tag{8.2}$$


    and the initial condition


    $$\mathbf{x}(0)=\mathbf{k}.\tag{8.3}$$


    Here **x** is an $(n\times1)$ state vector, **u** is an $(m\times1)$ control vector,
    $\tau$ is a constant delay factor and **g** is a given function of time that gives
    the initial profile for the state. Let us assume that each element in the control
    vector is bounded by


    $$\alpha_j \le u_j \le \beta_j,\quad j=1,2,\cdots,m.\tag{8.4}$$


    Associated with the system is a performance index to be minimized:


    $$I=\Phi(\mathbf{x}(t_f))\tag{8.5}$$


    where $\Phi$ is some function of the final state and the final time $t_f$ is specified.
    The optimal control problem is to find the control $\mathbf{u}(t)$ in the time
    interval $0\le t < t_f$ such that the performance index is minimized.


    Let us divide the given time interval into $P$ subintervals $(0,t_1),(t_1,t_2),\cdots,(t_{P-1},t_P)$,
    each of length $L$, so that


    $$L=\frac{t_f}{P}.\tag{8.6}$$


    Instead of seeking only piecewise constant control policy, we will use IDP to
    also find a piecewise linear control policy that minimizes the performance index.
    Conceptually there are no difficulties and the algorithm used earlier can be used.
    For integration of the differential equations with time delay we use the integration
    routine given by Hairer *et al.* [4]. To get an appreciation of IDP for the time
    delay problems, we consider several examples.


    # 8.3 Examples


    # 8.3.1 Example 1


    Let us consider the linear time-delay system used for optimal control studies
    by Chan and Perkins [2], Oh and Luus [8], Dadebo and Luus [3], and Luus [6]. The
    system is described by the differential equations


    $$\frac{dx_1}{dt}=x_2(t)\tag{8.7}$$'
  merge: -1
  img_proc: true
