  md: 'The reaction rate constants are dependent on the temperature in the following
    manner:


    $$k_1 = 1.7536 \times 10^5 \exp\left(\frac{-1.1374 \times 10^4}{1.9872 x_2}\right)
    \tag{9.5}$$


    and


    $$k_2 = 2.4885 \times 10^{10} \exp\left(\frac{-2.2748 \times 10^4}{1.9872 x_2}\right).
    \tag{9.6}$$


    The problem is to find $u$ in the time interval $0 \le t < t_f$ such that the
    performance index


    $$I = x_1(t_f), \quad t_f = 5 \tag{9.7}$$


    is maximized. This problem corresponds to Case II of Reddy and Husain [15], who
    examined the difficulties in solving this optimal control problem using methods
    based on the gradient. Case I has been considered in some detail by Luus [9].


    To obtain a piecewise constant optimal control policy by IDP presents no difficulties.
    However, what causes difficulties is choosing the number of time stages to solve
    this problem, since the improvement in the performance index is not very regular
    when the number of time stages is increased, as is shown in Figure 9.1. However,
    there is a definite pattern, as the three peaks occur at $P = 17$, $P = 26$, and
    $P = 35$.


