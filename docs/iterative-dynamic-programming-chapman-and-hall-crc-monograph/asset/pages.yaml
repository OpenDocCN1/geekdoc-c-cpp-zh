  md: '![](img/06ae75163df4fdf5e1eec243d497d393_159_0.png)


    Figure 8.3: Piecewise linear continuous control policy for Example 2


    The initial state profiles are given by


    x₁(t) = 0.15,    −τ ≤ t ≤ 0    (8.25)

    x₂(t) = −0.03,    −τ ≤ t ≤ 0    (8.26)

    x₃(0) = 0.10    (8.27)

    x₄(0) = 0.    (8.28)


    The optimal control problem is to find the controls u₁(t) and u₂(t) in the time
    interval 0 ≤ t < 2 so that the performance index given in Eq. (8.21) is minimized
    for different values of the delay factor τ. Rather than piecewise constant control
    as was done by Dadebo and Luus [3], here we seek piecewise linear control. In
    order to get convergence with N = 1, as is required for piecewise linear continuous
    control, we need a good initial estimate of the control policy. We can obtain
    that by approximating the delay-time system by a nondelay system where we still
    retain the dynamic characteristics. We expand the delay terms by Taylor series
    expansion retaining only the linear terms:


    x₁(t − τ) = x₁(t) − τ dx₁/dt + ⋯ ≈ x₁(t) − τ f₁(t)    (8.29)


    and


    x₂(t − τ) = x₂(t) − τ dx₂/dt + ⋯ ≈ x₂(t) − τ f₂(t).    (8.30)'
