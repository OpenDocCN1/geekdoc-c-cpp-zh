  md: '# Chapter 14


    # Sensitivity considerations


    # 14.1 Introduction


    Sensitivity is a measure of a change in one variable with respect to a change
    in another variable. For example, a very small variation in the E/R ratio, where
    E is the activation energy and R is the gas constant, has a large effect on the
    rate of a typical chemical reaction. In fact, Luus [4] showed that by using for
    the gas constant the value 2.00 cal/gm mole K instead of 1.9872, the expected
    rate of that particular reaction under consideration was increased by 30%. Such
    high sensitivities must be taken into account in the design of reactors.


    However, there are situations where very low sensitivities create computational
    difficulties. For example, in parameter estimation, Kalogerakis and Luus [2] introduced
    the information index which relates the effect of the changes in parameters to
    changes in the measured output that is used to estimate the parameters, and therefore
    provides the sensitivity information. If the information index is very small in
    some interval of time, then the data in that time interval can not be used to
    get reliable values for the parameters no matter what parameter estimation procedure
    is used. For parameter estimation, it was shown that the use of the data in the
    time interval where the information index is high not only leads to reliable parameter
    estimates, but also avoids computational difficulties.


    In optimal control, the problem of low sensitivity of the control policy on the
    performance index was addressed by Luus [6]. Although from the practical point
    of view, low sensitivity is good, since it means that even if the control policy
    differs somewhat from the optimal, the loss is not great. However, from the point
    of view of trying to establish the optimal control policy, low sensitivity creates
    difficulties, since the iterative procedure may be terminated prematurely, or
    some crude approximation may be inadvertently accepted as the optimal one when
    the performance index is within reasonable proximity (such as 0.01%) of the optimum.
    Often the nonoptimal control policies exhibit highly oscillatory sections that
    are quite smooth in the optimal control policy. For example, the control policy
    obtained with accelerated simulated'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'annealing by Yang and Wu [10] for maximizing the yield of the fed-batch reactor
    of Park and Ramirez [8] that we considered in Chapter 9 exhibited a highly fluctuating
    initial portion of the control policy, as is shown in Figure 14.1. The corresponding
    performance index of 32.68319 is within 0.01% of the optimum value of 32.68602.
    The optimal control policy is quite smooth, as is seen in Figure 14.2. It was
    shown by Luus [6] that even the control policy giving I = 32.68601 is quite oscillatory.
    Often, very high oscillations have minimal effect on the performance index [4].
    However, the performance index is quite sensitive to the time of switching; it
    was shown by Luus and Hennessy [7] that a better value of the performance index,
    namely I = 32.68687, is obtained by using P = 45 stages rather than 80, because
    the switching times are very slightly different. As we saw in Chapter 9 by using
    flexible stage lengths, we can improve the value further to I = 32.6939 with only
    20 time stages, because the switching times can be obtained very accurately by
    having stages of flexible length.


    Although there is very low sensitivity with respect to changes in control policy,
    the performance index is very sensitive to the choice of the final time, as was
    pointed out in [5], and illustrated in Chapter 9.


    ![](img/06ae75163df4fdf5e1eec243d497d393_279_0.png)


