  md: 'It is readily observed that the use of 17 time stages gives a better value
    for the performance index than the use of 40 time stages. To understand the underlying
    reason, let us examine the optimal control profiles obtained for P = 16, 17, and
    18. In Figure 9.2 with P = 16 it is seen that after two time intervals with t
    = 0.625, we are a bit late for switching to the maximum allowed value. Therefore,
    there is a small value for control during the second time step.


    In Figure 9.3 with P = 17, after the second time step with t = 0.588, the switching
    is approximately right and therefore in the third time step we have the control
    at the maximum allowed value. This enables the performance index I = 0.72387 to
    be obtained.


    In Figure 9.4 with P = 18, after two time steps with t = 0.555 the switching is
    too early, and the switch is made to a value less than the maximum, and the performance
    index of I = 0.72378 is not quite as good as the value obtained with P = 17.


    ![](img/06ae75163df4fdf5e1eec243d497d393_165_0.png)


    Figure 9.2: Optimal control policy obtained with P = 16 time stages


    Therefore, we see a need for using flexible stage lengths, rather than stages
    of constant length. The goal in this chapter is to show how flexible stage lengths
    can be used in IDP and the improvements that can be obtained. Just to finish off
    this example, let us look at the type of control policies that are obtained with
    flexible stage lengths. By using 7 stages of varying length, we obtained the 6-stage
    optimal control policy in Figure 9.5. Here both stages 2 and 3 gave the same upper
    bound for the control. The performance index I = 0.723886 is marginally better
    than the value obtained with 17 stages of equal length.'
