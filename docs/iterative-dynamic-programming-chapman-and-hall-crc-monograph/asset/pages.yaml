    # 7.4.3 Linear system with quadratic performance index


    In Chapter 6 we considered the mathematical problem presented by Nagurka et al.
    [8] to show the determination of piecewise constant control policy and concluded
    that the solution of this problem by solving the Riccati equation was much faster
    than IDP when the number of state variables and control variables was 20. Here
    we consider this problem again, but use piecewise linear control. Since a fewer
    number of stages are required, we shall show that the computational disadvantage
    of IDP decreases as the number of variables n increase. Therefore, let us consider
    the problem again where the nth-order linear time-invariant system is described
    by


    d**x**/dt = A**x**(t) + **u**(t) (7.18)'
