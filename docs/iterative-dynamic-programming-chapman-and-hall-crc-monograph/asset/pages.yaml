- pgno: 113
  md: '# Chapter 6


    # Evaluation of parameters in IDP


    # 6.1 Introduction


    In iterative dynamic programming there are numerous parameters that can be varied.
    Already in Chapter 5 we saw the different ways of choosing candidates for control
    and the effects of the number of such values chosen at each grid point, and also
    the effect of the region contraction factor γ. If γ is too small, we get premature
    collapse of the region, and if γ is too large then either the convergence rate
    may be rather slow or convergence may not be obtained at all. Fortunately there
    is generally a wide range over which acceptable values for γ may be chosen to
    yield convergence to the optimum. There is a balance between the number of allowable
    values for control R and the region contraction factor γ. If R is chosen to be
    sufficiently large, then γ can be chosen to be quite small such as 0.7 without
    fear of premature region collapse. However, if a small value for R is used, then
    γ must be increased to a value closer to 0.9. Normally we would like to choose
    R as small as possible to reduce computational effort.


    The choice for the number of grid points, however, is not quite as clear. In a
    very difficult nonlinear optimal control problem involving the determination of
    the optimal catalyst blend along a tubular reactor [7], convergence to the global
    optimum was readily obtained by using a single grid point at each time stage [6].
    A straightforward fed-batch reactor optimization problem, on the other hand, required
    a minimum of 23 grid points for convergence to the global optimum [3]. Bojkov
    and Luus [2] studied the effects of the parameters in IDP and concluded that for
    many typical chemical engineering systems the region contraction factor γ should
    be in the range 0.75 to 0.95, and the use of more than 3 grid points does not
    increase the likelihood of getting the global optimum nor improve the convergence
    rate. Although surprising, with the exception of a few reactor problems such as
    the fed-batch reactor considered by Hartig et al. [3] and the two-stage CSTR we
    consider later in this chapter, the requirement of only a small number of grid
    points appears to be generally true for many optimal control problems. Therefore,
    we may use a single grid point at each time stage for'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'many problems and still obtain fast and accurate convergence to the global
    optimum.


    The goal here is to illustrate the effects of the parameters used in IDP, such
    as the region reduction factor γ used after every iteration to reduce the size
    of the region, the region restoration factor η which is used to restore the region
    size after every pass, the initial region size, number of allowable values for
    control, and the number of grid points used at each time step. The use of several
    examples is the best way to show the relationship among the parameters used in
    IDP.


    # 6.2 Number of grid points


    In the early work with iterative dynamic programming, the number of grid points
    used was chosen to be quite large, usually greater than 20. The motivation for
    the use of large number of grid points was due to the vectorization capability
    of the CRAY supercomputer that was used, enabling the calculations to be done
    in parallel fashion. When calculations were switched from the CRAY to personal
    computers, the need to examine the effect of the number of grid points became
    necessary, since doubling the number of grid points more than doubled the computation
    time. The investigation of Bojkov and Luus [2] made it clear that a large number
    of grid points is not always necessary. Furthermore, it is obvious that if the
    number of grid points can be reduced without sacrificing convergence rate, then
    we should use the minimum number, namely N = 1, whenever possible.


    The choice of the initial region size over which candidates for control are chosen
    is also very important, especially when numerous local optima are present. To
    illustrate the effects of grid points, the choice of the initial region size,
    and the relationship of other parameters, we choose two examples from chemical
    engineering. In the first example we use a single grid point, since convergence
    to the global optimum is so readily obtained that there is no need to examine
    the use of a larger number of grid points. In the second example, the effect of
    the use of a different number of grid points is illustrated. In Section 6.3 we
    examine the multi-pass approach and present another example for which we need
    several grid points to get accurate convergence.


    # 6.2.1 Bifunctional catalyst blend optimization problem


    In the optimization of the blend of a bifunctional catalyst in converting methylcyclopentane
    to benzene in a tubular reactor, the blend of two monofunctional catalyst components
    involving hydrogenation and isomerization is characterized by the mass fraction
    u given by


    $$u = \frac{\text{mass of hydrogenation component}}{\text{total mass of the catalyst}}.$$
    (6.1)'
