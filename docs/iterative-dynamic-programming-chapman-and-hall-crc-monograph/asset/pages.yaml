  md: '# 7.4.4 Gas absorber with a large number of plates


    Let us consider the model of the *n*-plate gas absorber discussed in Chapter 1,
    where the model consists of the linear time-invariant system described by


    $$\frac{d\mathbf{x}}{dt}=\mathbf{A}\mathbf{x}(t)+\mathbf{B}\mathbf{u}(t)$$  \\(7.21\\)


    where **A** is a tridiagonal coefficient matrix given by


    $$\mathbf{A}=\operatorname{tridiag}[\ 0.538998\quad -1.173113\quad 0.634115\ ]$$  \\(7.22\\)


    and the (*n* × 2) control coefficient matrix **B** is given by


    $$\mathbf{B}^{T}=\begin{bmatrix}0.538998&0&\cdots&0&0\\0&0&\cdots&0&0.634115\end{bmatrix}.$$  \\(7.23\\)


    The initial condition is chosen as


    $$x_i(0)=-0.0307-\left(\frac{i-1}{n-1}\right)(0.1273-0.0307),\qquad i=1,2,\ldots,n.$$  \\(7.24\\)


    The performance index to be minimized is


    $$I=\int_0^{t_f}(\mathbf{x}^{T}\mathbf{x}+\mathbf{u}^{T}\mathbf{u})\,dt.$$  \\(7.25\\)


    where we choose the final time $t_f=15$ min. We keep the number of plates $n$
    as a parameter to investigate the effect of increasing the dimensionality of the
    problem.


    Since there are only two control variables, we expect rapid convergence with a
    very small number of randomly chosen values for control. For all the runs we choose
    $P=20$, $R=7$, $r_{in}=0.05$, $\mathbf{u}^{(0)}=0$, $\gamma=0.85$, $\eta=0.25$,
    and allow 2 passes of 20 iterations each, for $n=10$, 25, 50, and 100. For all
    the runs convergence was obtained within the two passes. Comparison of the computation
    times with IDP and the results obtained by solving the Riccati equation with $P=100$
    are shown in [Table 7.2](#).


    It is interesting to note that the computation time for IDP increases linearly
    with $n$, whereas with the Riccati equation the computation time goes up as $n^3$.
    Already with $n=50$, IDP is 3 times faster than solving the Riccati equation.
    When $n=100$, IDP is 25 times faster. Actually with $n=100$, the solution of the
    Riccati equation yielded $I=9.73327$ with $P=100$. The optimum value of $I=9.73326$
    was obtained with $P=200$, requiring 500.9 s of computation time.


    The optimal control policy for $n=100$ is given in [Figure 7.18](#) and the trajectories
    for typical state variables are given in [Figure 7.19](#).'
  merge: -1
