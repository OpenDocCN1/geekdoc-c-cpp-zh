    (x_4(t_f)-0.522-s_4)^2], \tag{12.28}

    ```


    where $\theta$ is a positive penalty function factor and the shifting terms $s_i$
    are updated after every pass of IDP. To keep track of the convergence, we record
    after every pass the norm of the absolute value deviations of the final state
    from the desired state


    ```

    S = |x_1(t_f)| + |x_2(t_f)| + |x_3(t_f)-0.5| + |x_4(t_f)-0.522|. \tag{12.29}

