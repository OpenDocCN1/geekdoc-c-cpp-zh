    # Case 3: n = 250


    Increasing the number of variables to 250 did not present any difficulties in
    the use of IDP. By taking P = 11 and choosing the initial region r_in = 250, with
    R = 40 and 70 iterations per pass and γ = 0.95, convergence to I = 1.31030 × 10^7
    was systematic and regular for η = 0.90, but the use of η = 0.89 caused the region
    size to collapse around the 60th pass, giving I = 1.31031 × 10^7. The convergence
    profiles are shown in Figure 7.14. One effective means of preventing the region
    from collapsing is to use initially a small value for η and then switch to a larger
    one. This scheme was used by Luus [5] who took for this problem η = 0.89 for the
    first 40 passes and then switched to η = 0.91 for the remainder of the passes
    to obtain convergence to I = 1.31030 × 10^7. Typical optimal control profiles
    and typical state variables are shown in Figure 7.15 and 7.16. The computation
    time for 70 passes was 8.4 h on a PentiumII/350 personal computer.


    Attempts to solve the Riccati equation for this problem on the PentiumII/350 with
    P = 200 and P = 100 caused memory problems, but with P = 75 the Riccati equation
    was solved in 4.1 h, yielding I = 1.31037 × 10^7. Luus [5] solved the Riccati
    equation with P = 200 on a Pentium/120 to give I = 1.31030 × 10^7 without any
    difficulty, except that the computation time was 55.0 h. No attempt was made to
    reduce the number of equations to be solved in the Riccati equation from 62500
    to 32500 because the Riccati matrix is symmetric. For this case IDP is clearly
    preferred.'
