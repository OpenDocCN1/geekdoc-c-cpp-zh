- pgno: 88
  md: 'Next we consider $P = 2$ stages.


    # $P = 2$


    With two stages we start at $x(0)$ proceed to $x(1)$ and then go to $x(2)=0$.
    The performance index to be minimized is


    $$I[x(0),2]=x^2(1)+u^2(0)+x^2(2)+u^2(1)=x^2(1)+u^2(0)+u^2(1). \tag{3.13}$$


    Once we get to $x(1)$, we already know how to get to $x(2)=0$, because that is
    a 1-stage problem that was solved above. We therefore have


    $$u(1)=-\frac{a}{b}x(1). \tag{3.14}$$


    The performance index becomes


    $$I[x(0),2]=\left(1+\frac{a^2}{b^2}\right)x^2(1)+u^2(0). \tag{3.15}$$


    By using Eq. (3.8) with $k=0$, we can rewrite the performance index as an explicit
    function of $u(0)$ only, namely,


    $$I[x(0),2]=\left(1+\frac{a^2}{b^2}\right)[ax(0)+bu(0)]^2+u^2(0). \tag{3.16}$$


    Differentiating Eq. (3.16) with respect to $u(0)$ gives


    $$\frac{dI[x(0),2]}{du(0)}=2b\left(1+\frac{a^2}{b^2}\right)[ax(0)+bu(0)]+2u(0).
    \tag{3.17}$$


    Since the second derivative of the performance index is positive, the choice of
    $u(0)$ to minimize the performance index is obtained from the stationary condition
    that yields


    $$u(0)=-\left(\frac{ab+(a^3/b)}{1+a^2+b^2}\right)x(0). \tag{3.18}$$


    We are now ready to consider $P=3$ stages.


    # $P = 3$


    The pattern for calculations becomes clear with the addition of one more stage.
    With $P=3$, the performance index is


    $$I[x(0),3]=x^2(1)+u^2(0)+x^2(2)+u^2(1)+u^2(2), \tag{3.19}$$


    since $x(3)=0$. Here we know that the optimal choices for $u(2)$ and $u(1)$, as
    determined before, are


    $$u(2)=-\frac{a}{b}x(2). \tag{3.20}$$'
