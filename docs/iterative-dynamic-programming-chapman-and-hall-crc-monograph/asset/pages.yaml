    three times, whereas the stationary point related to the maximum distance was
    obtained 21 times. To solve the algebraic equations from the 200 starting points
    took a minimum of 6 iterations and a maximum of 15 iterations, with a total computation
    time of 0.11 s on the Pentium/120 for the 200 starting points. Therefore, the
