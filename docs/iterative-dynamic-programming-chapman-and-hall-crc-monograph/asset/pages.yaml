- pgno: 89
  md: 'and


    $$u(1)=-\left(\frac{ab+(a^3/b)}{1+a^2+b^2}\right)x(1). \tag{3.21}$$


    The performance index can now be expressed as an explicit function of $u(0)$,
    and the process can be repeated.


    Although analytically this process is tedious after a while, numerically such
    optimization can be done very easily. By using dynamic programming, the solution
    of $P$ simultaneous equations is replaced by a procedure which handles one single
    equation, but does it $P$ times. Thus parallel computation is replaced by serial
    computation.


    # 3.2.5  Linear optimal control problem


    As a further example we consider a linear optimal control problem where the system
    is described by


    $$\mathbf{x}(k+1)=\boldsymbol{\Phi}\mathbf{x}(k)+\boldsymbol{\Psi}\mathbf{u}(k),\qquad
    k=0,1,\ldots,P-1, \tag{3.22}$$


    where $\boldsymbol{\Phi}$ and $\boldsymbol{\Psi}$ are constant matrices, and the
    initial condition $\mathbf{x}(0)$ is given. The performance index is assumed to
    have the quadratic form


    $$I[\mathbf{x}(0),P]=\sum_{k=1}^{P}\left[\mathbf{x}^{T}(k)\mathbf{Q}\mathbf{x}(k)+\mathbf{u}^{T}(k-1)\mathbf{R}\mathbf{u}(k-1)\right].
    \tag{3.23}$$


    where $\mathbf{R}$ is a positive definite symmetric matrix and $\mathbf{Q}$ is
    a positive semi-definite symmetric matrix. Let us define


    $$I^0[\mathbf{x}(0),P]=\min I[\mathbf{x}(0),P] \tag{3.24}$$


    such that $I^0[\mathbf{x}(0),P]$ is the optimal value of the performance index
    over $P$ stages of control. Thus


    $$I^0[\mathbf{x}(0),P]=\min_{\mathbf{u}(0)}\min_{\mathbf{u}(1)}\cdots\min_{\mathbf{u}(P-1)}\sum_{k=1}^{P}\left[\mathbf{x}^{T}(k)\mathbf{Q}\mathbf{x}(k)+\mathbf{u}^{T}(k-1)\mathbf{R}\mathbf{u}(k-1)\right].
    \tag{3.25}$$


    We can use the principle of optimality in dynamic programming to rewrite the expression
    as


    $$I^0[\mathbf{x}(0),P]=\min_{\mathbf{u}(0)}\left[\mathbf{x}^{T}(1)\mathbf{Q}\mathbf{x}(1)+\mathbf{u}^{T}(0)\mathbf{R}\mathbf{u}(0)+I^0[\mathbf{x}(1),P-1]\right],
    \tag{3.26}$$


    which provides a recurrence relationship of dynamic programming.


    Let us assume that the optimum performance index can be written as


    $$I^0[\mathbf{x}(0),P]=\mathbf{x}^{T}(0)\mathbf{J}_P\mathbf{x}(0). \tag{3.27}$$'
