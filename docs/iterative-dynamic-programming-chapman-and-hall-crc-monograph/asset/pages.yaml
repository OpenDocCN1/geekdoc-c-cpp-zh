    # 8.3.2 Example 2


    Let us consider the linear time-delay system considered by Palanisamy et al. [9]
    for the optimal control of linear time-varying delay systems via single term Walsh
    series, which was also used by Dadebo and Luus [3] to test IDP. The system is
    described by the delay differential equations


    ```

    dx₁(t)/dt = t x₁(t) + x₁(t − τ) + u(t)    (8.12)

    ```


    ```

    dx₂(t)/dt = x₁²(t) + u²(t)    (8.13)

    ```


    with the initial state profile


    ```

    x₁(t) = 1.0,   −1 ≤ t ≤ 0,   x₂(0) = 0.    (8.14)

    ```


    The optimal control problem is to find the control u in the time interval 0 ≤
    t < 2, so that the following performance index is minimized:


    ```

    I = x₂(t_f),   t_f = 2.    (8.15)

    ```'
