  md: 'Eq. (1.85) is a linear equation which can be easily solved by Gaussian elimination
    for δx and the next value of x is then chosen as


    ```

    x^{j+1} = x^{j} + δx. (1.86)

    ```


    It is noted that the partial derivatives are calculated in the presence of the
    simple equality constraints, so that these are difficult to obtain analytically,
    because x_{n+1}, x_{n+2}, ..., x_N are functions of the particular variable under
    consideration. This is illustrated by the first example. Computationally, however,
    the partial derivatives are easily obtained by perturbing the particular variable,
    and we can write


    ```

    ∂f_j(x_1, x_2, ..., x_i, ..., x_N) / ∂x_i = [f_j(x_1, x_2, ..., x_i + h_i, ...,
    x_N) - f_j(x_1, x_2, ..., x_i - h_i, ..., x_N)] / (2 h_i) (1.87)

    ```


    where h_i is taken as a very small perturbation such as 10^{-6} x_i if x_i ≠ 0.


    One great advantage of this method is the very rapid convergence in the vicinity
    of the solution. There is also considerable freedom in choosing how many and which
    equations to include in each of the two groups. Generally we try to have as many
    equations as possible in the first group, so that we have the smallest number
    of difficult equations. Since this method is so simple to program, and does not
    encounter the types of problems reported by the various methods considered by
    Shacham [28], it should really be the “first” approach to try.


