    # 2.3.5 Handling equality constraints


    In many of the problems if equality constraints are present, they are simple and
    can be eliminated by proper substitution. For example in the optimization of the
    alkylation plant, there are 7 equality constraints. However, these 7 equality
    constraints were rearranged to reduce the dimensionality of the optimization problem
    from 10 to 3. This then became a very simple optimization problem for which the
    solution could be obtained in a fraction of a second. The question arises about
    what to do in cases where we have difficult equality constraints. Suppose that
    in addition to the inequality constraints in Eq. (2.3), we also have $m$ equality
    constraints


    ```

    $$h_i(x_1, x_2, ..., x_n) = 0, \quad i = 1,2,...,m\tag{2.83}$$

    ```'
