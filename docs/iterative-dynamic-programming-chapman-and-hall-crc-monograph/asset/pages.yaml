  md: '# 13.3.2 Example 2 – Li-Haimes problem


    Let us consider the nonseparable optimization problem of Li and Haimes [1], where
    the system is described by the three scalar equations


    x(1) = x(0)^{u(0)}  (13.12)


    x(2) = [1 + u(1)]x(1)  (13.13)


    x(3) = x(2) + u(2)  (13.14)


    with the initial condition x(0) = 15. The control at each stage is constrained
    by


    -1 ≤ u(k) ≤ 1,      k = 0, 1, 2.  (13.15)


    The performance index to be minimized is nonseparable in the form


    I = [x²(0)+x²(1)+(2x²(2)+x²(3))exp(x²(1))][50+u²(0)+(u²(1)+u²(2))exp(u²(0))]^{½}.  (13.16)


    To solve this problem with IDP, we chose initial value for control of zero and
    the initial region size r = 2, N = 1, R = 5, and used 5 passes, each consisting
    of 40 iterations with γ = 0.85 and η = 0.25. The convergence was fast as is seen
    in Figure 13.7 where the convergence profile is given for the first pass. After
    4 passes, convergence to the values given in Table 13.5 was obtained with I =
    1596.4796778. The computation time for 5 passes was 0.5 s on a PentiumII/350 personal
    computer.


    # 13.4 References


    [1] LI, D. AND HAIMES, Y.Y.: “New approach for nonseparable dynamic programming
    problems”, JOTA 66 (1990), 311-330.


    [2] LUUS, R.: “Application of iterative dynamic programming to optimal control
    of nonseparable problems”, Hung. J. Ind. Chem. 25 (1997), 293-297.


    [3] LUUS R. AND TASSONE V.: “Optimal control of nonseparable problems by iterative
    dynamic programming”, Proc. 42nd Canadian Chem. Eng. Conf., October 18-21, 1992,
    Toronto, Canada, pp. 81-82.'
