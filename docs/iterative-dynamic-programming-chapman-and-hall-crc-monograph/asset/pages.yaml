  md: '![](img/06ae75163df4fdf5e1eec243d497d393_125_0.png)


    Figure 6.2: State trajectories for the two-stage CSTR system resulting from the
    application of the control policy in Figure 6.1


    # 6.4.1  Effect of region restoration factor η


    To keep the computational requirements reasonably small and yet have a control
    policy which approximates the continuous control policy, we choose P = 40 time
    stages of equal length and seek a piecewise constant control policy. A reasonable
    choice for the region restoration factor η is 0.90. Choosing the region contraction
    factor to be γ = 0.95 causes the region to be reduced quite gradually and after
    30 iterations the region is 0.215 of the value at the beginning ((0.95)³⁰ = 0.215).
    We choose 30 iterations in each pass. The initial region size for each control
    variable at the beginning of the first pass is chosen as 20, and the initial value
    for each control variable is chosen as 0. For integration we use the fourth-order
    Runge-Kutta method with an integration step-size of 0.0125, which gives accuracy
    to three decimal places for this problem.


    As is seen in Figure 6.3, convergence to I = 6226.047 is readily obtained with
    the use of η = 0.70 and γ = 0.95. With the use of R = 3, convergence was obtained
    in 27 passes, each consisting of 30 iterations. The use of R = 5 reduced the number
    of passes required for convergence to 24, but the computation time for 30 passes
    was increased from 104 s to 158 s on a PentiumII/350 digital computer.


    When η was reduced to 0.65, as is shown in Figure 6.4, premature collapse of the
    search region occurs when R = 3 is used. However, with the use of R = 5 there
    are no convergence difficulties and the use of R = 11 improves the convergence
    rate only marginally, but doubles the computation time to 343 s for 30 passes.'
  merge: -1
