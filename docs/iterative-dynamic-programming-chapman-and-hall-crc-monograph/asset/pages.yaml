- pgno: 19
  md: '# ### 1.2.3 Differentiation of a vector


    Given a vector


    $$\mathbf{f}(\mathbf{x}) = \begin{bmatrix} f_1 \\ f_2 \\ \vdots \\ \vdots \\ \vdots
    \\ f_n \end{bmatrix},$$


    we may differentiate this vector with respect to **x** by first taking the transpose
    and then simply using matrix algebra, i.e.,


    $$\frac{\partial \mathbf{f}^{T}}{\partial \mathbf{x}} = \begin{bmatrix} \frac{\partial}{\partial
    x_1} \\ \frac{\partial}{\partial x_2} \\ \vdots \\ \vdots \\ \vdots \\ \frac{\partial}{\partial
    x_n} \end{bmatrix}[f_1\quad f_2\quad \cdots\quad f_n] = \begin{bmatrix} \frac{\partial
    f_1}{\partial x_1} & \frac{\partial f_2}{\partial x_1} & \cdots & \frac{\partial
    f_n}{\partial x_1} \\ \frac{\partial f_1}{\partial x_2} & \frac{\partial f_2}{\partial
    x_2} & \cdots & \frac{\partial f_n}{\partial x_2} \\ \vdots & \vdots & \cdots
    & \vdots \\ \frac{\partial f_1}{\partial x_n} & \frac{\partial f_2}{\partial x_n}
    & \cdots & \frac{\partial f_n}{\partial x_n} \end{bmatrix}.$$


    The second derivative of a continuous *scalar* function $f(\mathbf{x})$ with respect
    to **x** is


    $$\frac{\partial^2 f}{\partial \mathbf{x}^2} = \frac{\partial}{\partial \mathbf{x}}\left(\frac{\partial
    f}{\partial \mathbf{x}}\right)^T = \begin{bmatrix} \frac{\partial^2 f}{\partial
    x_1^2} & \frac{\partial^2 f}{\partial x_1\partial x_2} & \cdots & \frac{\partial^2
    f}{\partial x_1\partial x_n} \\ \frac{\partial^2 f}{\partial x_2\partial x_1}
    & \frac{\partial^2 f}{\partial x_2^2} & \cdots & \frac{\partial^2 f}{\partial
    x_2\partial x_n} \\ \vdots & \vdots & \cdots & \vdots \\ \frac{\partial^2 f}{\partial
    x_n\partial x_1} & \frac{\partial^2 f}{\partial x_n\partial x_2} & \cdots & \frac{\partial^2
    f}{\partial x_n^2} \end{bmatrix}.$$


    It is noted that this $(n \times n)$ matrix is symmetric, since the order of differentiation
    does not matter for a continuous function.


    # ### 1.2.4 Taylor series expansion


    It is convenient at times to expand a vector function **f**(**x**) in terms of
    a small perturbation $\delta\mathbf{x}$. Such an approximation can be represented
    by


    $$\mathbf{f}(\mathbf{x}+\delta\mathbf{x}) = \mathbf{f}(\mathbf{x}) + \left(\frac{\partial
    \mathbf{f}^{T}}{\partial \mathbf{x}}\right)^T\delta\mathbf{x} + \cdots \tag{1.9}$$


    and a scalar continuous function $f(\mathbf{x})$ can be conveniently expanded
    as


    $$f(\mathbf{x}+\delta\mathbf{x}) = f(\mathbf{x}) + \left(\frac{\partial f}{\partial
    \mathbf{x}}\right)^T\delta\mathbf{x} + \frac{1}{2}\delta\mathbf{x}^T\frac{\partial^2
    f}{\partial \mathbf{x}^2}\delta\mathbf{x} + \cdots \tag{1.10}$$'
