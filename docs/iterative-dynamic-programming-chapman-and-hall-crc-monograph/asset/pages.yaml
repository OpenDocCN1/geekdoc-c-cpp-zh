- pgno: 25
  md: '# 1.7 Interpretation of results


    An important part of optimization is the interpretation of the results. It is
    realized that the optimal solution is dependent on the mathematical model and
    the performance index. Therefore, the results of the optimization must be considered
    with care. If the mathematical model is an inadequate representation of the physical
    system, the results are not optimal with respect to the application that has been
    intended. In the same way, the results are dependent on the choice of the performance
    index. The choice of the final time $t_f$ has a substantial effect on the optimal
    control policy [14], but it is frequently chosen quite arbitrarily. Only thorough
    familiarity with the physical system will ensure successful application of optimization.


    Another important aspect of optimization is to determine whether a local optimum
    or a global optimum has been obtained. In a highly nonlinear problem this can
    be quite a challenge. The best way to assure oneself that a global optimum has
    been obtained is to cross-check the optimization by using a different optimization
    procedure. Simply taking different starting conditions may not yield the global
    optimum if there is a very large number of local optima. This was recently pointed
    out in [19] in the optimization of a bifunctional catalyst blend along a tubular
    reactor to maximize the yield of a desired product. Although 100 different starting
    conditions chosen at random were used with sequential quadratic programming (SQP),
    the global optimum was not obtained with that well-established optimization procedure.
    With iterative dynamic programming, however, the global optimum was readily obtained
    by Luus and Bojkov [17].


    When numerical methods are used for optimization of nonlinear systems, some form
    of iteration is usually used. There is therefore the additional feature that must
    be considered, namely the convergence of the iterative procedure itself. The iterations
    may be ended prematurely, or the iterative procedure itself may fail to converge
    because of the nature of the problem or the parameters chosen. The problem of
    convergence is very challenging when a large change in the control policy has
    a very small effect on the performance index, and one is tempted to accept a highly
    fluctuating control policy as being optimal. Establishing the optimal control
    policy for low sensitivity problems is difficult [15]. These are some of the aspects
    of optimization that we wish to explore in later chapters.


    # 1.8 Examples of systems for optimal control


