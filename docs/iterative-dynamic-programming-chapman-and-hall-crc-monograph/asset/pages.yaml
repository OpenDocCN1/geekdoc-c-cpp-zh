- pgno: 22
  md: 'or, in vector form, the system can be described more compactly by


    $$\frac{d\mathbf{x}}{dt} = \mathbf{f}(\mathbf{x}, \mathbf{u}, t)\tag{1.19}$$


    with the initial state specified


    $$\mathbf{x}(0) = \mathbf{c}.\tag{1.20}$$


    Here $\mathbf{x}$ is an $(n \times 1)$ state vector and $\mathbf{u}$ is an $(m
    \times 1)$ control vector.


    We can remove the explicit time dependence on the right hand side of Eq. (1.19)
    by introducing an additional state variable $x_{n+1}$ by the differential equation


    $$\frac{dx_{n+1}}{dt} = 1, \quad x_{n+1}(0) = 0\tag{1.21}$$


    and incorporating $x_{n+1}$ into the state vector $\mathbf{x}$. Then we have a
    simpler form


    $$\frac{d\mathbf{x}}{dt} = \mathbf{f}(\mathbf{x}, \mathbf{u})\tag{1.22}$$


    with


    $$\mathbf{x}^T(0) = [\mathbf{c}^T \quad 0].\tag{1.23}$$


    Therefore, the number of state variables describing a particular system is not
    unique, since auxiliary state variables may be introduced for convenience to describe
    the same system.


    # 1.5 Discrete-time system model


    We assume that the discrete-time system model of a physical system can be written
    in the form


    $$\mathbf{x}(k + 1) = \mathbf{h}(\mathbf{x}(k), \mathbf{u}(k))\tag{1.24}$$


    with the given initial state


    $$\mathbf{x}(0) = \mathbf{c}.\tag{1.25}$$


    Such a difference equation can arise if the system consists of a number of stages
    or units, as in an extraction train in chemical engineering. We can also obtain
    a difference equation by integrating the differential equation repeatedly over
    a sampling period. For example, suppose we have a linear continuous-time system


    $$\frac{d\mathbf{x}}{dt} = \mathbf{A}\mathbf{x} + \mathbf{B}\mathbf{u}\tag{1.26}$$


    and suppose $\mathbf{u}$ is kept constant at its value $\mathbf{u}(0)$ over the
    entire time interval from 0 to $T$. Then integration of Eq. (1.26) gives


    $$\mathbf{x}(T) = \mathbf{\Phi}(T)\mathbf{c} + \int_{0}^{T} \mathbf{\Phi}(t -
    \lambda)\mathbf{B}\mathbf{u}(0) d\lambda\tag{1.27}$$'
