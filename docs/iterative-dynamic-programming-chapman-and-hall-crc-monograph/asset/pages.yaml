  md: '# 3.2.1 A simple optimal path problem


    Let us consider a situation depicted in Figure 3.1, where there are different
    paths that could be taken in going from A to B. The costs for sections of the
    paths are shown by the numbers. Suppose we wish to find the path, always moving
    to the right, such that the total cost in going from A to B is minimized. For
    ease of discussion, the nodes are labelled by the letters a, b, …, l.


    ![](img/06ae75163df4fdf5e1eec243d497d393_82_0.png)


    Figure 3.1: Optimal path problem


    Starting at node a, we find that there is only one way to go to B and the associated
    cost is 5, so we associate the minimum cost 5 with node a. Similarly, there is
    only one way to proceed from node b and the cost is 3 plus the cost from going
    from node a to B. Thus we associate the minimum cost 8 with the node b. Proceeding
    to node c, since we are always going from left to right, we see that there is
    only one way to get to B and the associated cost is 7. At the node d, there are
    two options: one is to proceed to node c and the other is to proceed to node a.
    It is noted that here it does not make any difference, since the cost with each
    alternative is 11. Therefore we assign the minimum cost 11 to node d.


    At node e there are also two ways of proceeding. We can go to either node d or
    to node b. In the former, the cost is 5 + 11 = 16, and for the latter the cost
    is 5 + 8 =13. We compare these two numbers and choose the path that gives the
    smaller number, namely the path e to b, and associate with node e the minimum
    cost 13. Similarly at node f we compare the two costs 9 + 13 = 22 and 4 + 8 =
    12, and associate the minimum cost 12 with the node f and the path f to b rather
    than f to e. At node g there is only one way of proceeding, so the minimum cost
    associated with node g'
