- pgno: 268
  md: '# Chapter 13


    # Nonseparable problems


    # 13.1  Introduction


    In using iterative dynamic programming to solve optimal control problems up to
    now, we have broken up the problem into a number of stages and assumed that the
    performance index could always be expressed explicitly in terms of the state variables
    at the last stage. This provided a scheme where we could proceed backwards in
    a systematic way, carrying out optimization at each stage. Suppose, however, that
    the performance index can not be expressed in terms of the variables at the last
    stage only. In other words, suppose the performance index is also a function of
    controls and variables at the other stages. Then we have a *nonseparable* optimal
    control problem. The goal of this chapter is to formulate this problem in general
    terms and to provide an approach that enables IDP to be used. Throughout this
    chapter we use difference equations rather than differential equations.


    # 13.2  Problem formulation


    Let us consider a nonlinear system described by a difference equation


    $$\mathbf{x}(k+1)=\mathbf{f}(\mathbf{x}(k),\mathbf{u}(k)),\qquad k=1,2,\ldots,P-1,
    \tag{13.1}$$


    where **x** is an $(n \times 1)$ state vector and **u** is an $(m \times 1)$ control
    vector. We consider problems where the initial state **x**(0) and the number of
    stages $P$ are given. The performance index is a nonseparable general function
    of all the controls and states, which we write as


    $$I=g[\mathbf{x}(0),\mathbf{x}(1),\ldots,\mathbf{x}(P),\mathbf{u}(0),\mathbf{u}(1),\ldots,\mathbf{u}(P-1)].
    \tag{13.2}$$


    The control variables at each stage are constrained by


    $$\alpha_j \leq u_j(k) \leq \beta_j,\qquad j=1,2,\ldots,m;\quad k=1,2,\ldots,P-1.
    \tag{13.3}$$'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'The optimal control problem is to find **u**(0), **u**(1), ⋯, **u**(P − 1),
    such that the performance index in Eq. (13.2) is minimized.


    The strategy for solving problems where the performance index is not an explicit
    function of the final state only was suggested by Luus and Tassone [3]. It was
    suggested to use for the variables upstream of calculations the best values available
    from the previous iteration. The downstream variables are obtained by simply solving
    Eq. (13.1). As the iterations proceed and the region is contracted, the effect
    of such approximations is expected to become negligibly small. In fact, using
    two examples, including the nonseparable problem of Li and Haimes [1], Luus [2]
    showed that this scheme works very well.


    Here we illustrate the use of this scheme with two nonlinear nonseparable problems.


    # 13.3  Examples


    # 13.3.1  Example 1 — Luus-Tassone problem


    Let us first consider the nonseparable optimization problem that we looked at
    in Chapter 2. This example was introduced by Luus and Tassone [3], and used to
    examine the convergence properties of IDP. The system is described by three difference
    equations:


    $$x_1(k+1)=\frac{x_1(k)}{1+0.01u_1(k)(3+u_2(k))} \tag{13.4}$$


    $$x_2(k+1)=\frac{x_2(k)+u_1(k)x_1(k+1)}{1+u_1(k)(1+u_2(k))} \tag{13.5}$$


    $$x_3(k+1)=\frac{x_3(k)}{1+0.01u_2(k)(1+u_3(k))} \tag{13.6}$$


    with the initial condition


    $$\mathbf{x}(0)=[2\quad 5\quad 7]^T. \tag{13.7}$$


    The control variables are constrained by


    $$0\leq u_1(k)\leq 4 \tag{13.8}$$


    $$0\leq u_2(k)\leq 4 \tag{13.9}$$


    $$0\leq u_3(k)\leq 0.5. \tag{13.10}$$


    The performance index to be minimized is


    $$I=x_1^2(P)+x_2^2(P)+x_3^2(P)+\left[\left(\sum_{k=1}^{P}x_1^2(k-1)+x_2^2(k-1)+2u_3^2(k-1)\right)\left(\sum_{k=1}^{P}x_3^2(k-1)+2u_1^2(k-1)+2u_2^2(k-1)\right)\right]^{1/2}
    \tag{13.11}$$'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'where $P$ is the number of stages; Luus and Tassone [3] used $P = 20$, and
    Luus [2] used $P = 100$. Here we wish to examine the convergence properties for
    using IDP to solve this problem for three different values of $P$. In each case
    we take as the initial region size for the first pass $\mathbf{r}_{in} = [4\ 4\
    0.5]^T$ and the initial control policy $\mathbf{u}^{(0)} = [2\ \ 2\ \ 0.25]^T$.
    For all the runs we take the region contraction factor $\gamma = 0.85$, the region
    restoration factor $\eta = 0.5$, and allow 7 passes, each consisting of 30 iterations.


    # Case 1: $P = 20$


    With the use of $P = 20$, the results in Table 13.1 show that the global optimum
    $I = 209.26937$ was readily obtained with the use of a single grid point. The
    convergence was quite regular, as is shown in Figure 13.1. Also the local optimum
    with $I = 209.27547$ was obtained three times. When the number of grid points
    was increased, the local optimum $I = 209.27320$ was obtained much more frequently.
    In the global optimum solution, there is a sudden change in the control variables
    at the 15th stage, as is shown in Figure 13.2.


