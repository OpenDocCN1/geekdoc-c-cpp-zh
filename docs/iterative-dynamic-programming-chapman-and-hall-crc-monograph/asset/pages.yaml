- pgno: 21
  md: '# 1.2.7 Stationary and maxima (minima) points


    If ∂f(x)/∂x = 0 at some value x = x0, then x0 is said to be a stationary point.
    However, this is not necessarily the maximum or a minimum of the function f(x).
    If ∂²f/∂x² is negative definite, then x0 is a local maximum and if ∂²f/∂x² is
    positive definite, then x0 is a local minimum. The point x0 is an absolute or
    global maximum if


    ```

    f(x) ≤ f(x0)

    ```


    and a global minimum if the inequality sign is reversed. For an unconstrained
    continuous function with continuous first derivative, the global maximum or minimum
    may be obtained by examining all the stationary points of the function and comparing
    the values of the function at those stationary points.


    # 1.3 Steady-state system model


    For a steady-state model we assume the system under consideration can be represented
    in terms of the variables x1, x2, ⋯, xn. The model is given by a set of equality
    constraints


    ```

    φi(x1, x2, ..., xn) = 0,      i = 1, 2, ..., m    (1.14)

    ```


    where m ≤ n, and a set of inequality constraints


    ```

    gj(x1, x2, ..., xn) ≤ 0,      j = 1, 2, ..., s.    (1.15)

    ```


    # 1.4 Continuous-time system model


    In the major portion of this book, we shall assume that the physical system is
    described mathematically by a set of deterministic lumped-parameter ordinary differential
    equations, where the initial conditions are given. There are two types of variables
    under consideration. The state variables, denoted by xi, represent the state of
    the system. The other type of variables, denoted by uj, represent the control
    variables, or inputs into the system. The model showing the effect of the inputs
    on the state of the system is assumed to have the general form


    ```

    dx1/dt = f1(x1, x2, ..., xn, u1, u2, ..., um, t)    (1.16)

    ```


    ```

    dx2/dt = f2(x1, x2, ..., xn, u1, u2, ..., um, t)    (1.17)

    ```


    ```

    ... ... ... ...

    ```


    ```

    dxn/dt = fn(x1, x2, ..., xn, u1, u2, ..., um, t)    (1.18)

    ```'
