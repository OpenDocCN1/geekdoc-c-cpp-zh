  md: 'Here, the control policies obtained by IDP and LJ optimization procedure are
    almost identical, where a sudden change at stage 69 occurs in the control variables
    $u_1$ and $u_2$. Therefore, LJ optimization procedure is ideally suited for checking
    results obtained by other methods, especially when the optimal control policy
    differs from what is expected, as is the case with this particular example. There
    are some problems, for example, model reduction, where LJ optimization method
    is well suited [24]. To illustrate the procedure, we consider several examples.


    # 2.3.2 Simple example — 5 food diet problem


    Let us first consider the food problem as specified in Table 2.1 which we solved
    by linear programming earlier. To solve this with the LJ optimization procedure
    is straightforward, since the number of variables is small and no auxiliary variables
    are required.


    By denoting the amount of each food by $x_i$, let us choose as starting conditions
    $x_i = 0.5, i = 1, \cdots, 5$, and the initial region size for each variable 2.0.
    Although the initial starting point is infeasible, that does not matter, because
    the initial starting point simply sets the centre point around which the randomly
    chosen points will be chosen. Let us choose the reduction factor for reducing
    the region sizes after every iteration $\gamma = 0.95$, 101 iterations per pass,
    and a maximum of 20 passes. Let us use the number of randomly chosen points per
    iteration as a parameter and use the 50, 100, 150, 200, and 300 for this parameter.
    After every pass we put the region sizes equal to the extent of the variation
    of that particular variable. If the variation is less than $10^{-6}$, then the
    region size is put equal to $10^{-6}$. This scheme of determining the initial
    region sizes for variables has been found effective in solving several optimization
    problems [22, 23, 25]. The listing of the computer program for this problem is
    given in Appendix C.


    The results of the computations are given in Table 2.2. When more than 50 randomly
    chosen points were chosen, there was no problem in getting convergence to the
    maximum utility of $I = 247.06390$ with $x_1 = 2.0000, x_2 = 0.3368, x_3 = 1.2090,
    x_4 = 0.0000$ and $x_5 = 0.0000$. These values correspond very closely to the
    values obtained by linear programming and reported in Figure 2.2. It is interesting
    to note that with $R = 200$ randomly chosen points, convergence results already
    after 4 passes. The computation time for 20 passes with $R = 200$ was 5.83 s on
    a Pentium/120 digital computer, which is considerably greater than required by
    linear programming, but is still quite small.


