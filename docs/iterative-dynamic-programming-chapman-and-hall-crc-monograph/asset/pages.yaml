  md: '# Case 2: n = 150


    When the number of state variables and control variables was increased to 150,
    some changes were made to cope with the larger number of variables. The number
    of iterations in a pass was increased to 50, and the region restoration factor
    η was kept closer to 0.90, but the region reduction factor γ was kept at 0.95.
    The number of time stages was chosen as P = 11, to give sufficient accuracy. To
    compensate for the larger values in the initial condition, the initial region
    size was chosen to be r_in = 300. By taking R = 25 allowable values for control,
    it was found that convergence to I = 2.81317×10^6 was regular and systematic as
    is shown in Figure 7.11. In each case a slightly better performance index was
    obtained after 70 passes than I = 2.81318×10^6 obtained by solving the Riccati
    equation with P = 200. The computation time for 70 passes with IDP was 5776 s
    which compares favorably with 3515 s required to solve the optimal control problem
    through the Riccati equation with DVERK [1] subroutine.


    The optimal control policy for typical control variables is given in Figure 7.12
