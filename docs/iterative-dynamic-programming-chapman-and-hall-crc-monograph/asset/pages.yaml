- pgno: 292
  md: '![](img/06ae75163df4fdf5e1eec243d497d393_292_0.png)


    Figure 15.2: Optimal control policy obtained with P = 5 stages of varying length,
    giving I = 0.35222


    with IDP is not excessive. The effect of the heat transfer coefficient is quite
    important, and, therefore, accurate modelling is required when implementation
    of optimal control is considered in practice. However, even with inaccurate modelling,
    the parameters can be updated while running the reactor. With the updated parameters
    reoptimization can be carried out over the rest of the batch time even with complex
    systems.


    Since personal computers now are very fast and will be even faster in the future,
    the optimal control approach as outlined here appears to be quite practical. Although
    the resulting control policy is open loop in nature, during the course of reaction
    the parameters can be updated and the optimization problem can be solved repeatedly.
    This means that appropriate changes can be made during the operation of the reactor.
    In essence then the optimal control will be feedback in nature, where the control
    action is determined from the knowledge of the state of the system at any particular
    time.


    Iterative dynamic programming is well suited for solving complex optimal control
    problems, such as the ones encountered by chemical engineers [2]. The main advantage
    lies in its robustness in obtaining the global optimum. Although the possibility
    of getting a local optimum exists, changing the parameters in IDP such as initial
    region size, number of grid points and the number of randomly chosen points per
    iteration usually allows one to obtain the global optimum. It must be remembered
    that IDP is not an algorithm that can be applied directly to solve any optimal
    control problem; IDP is an approach in applying the principle of optimality in
    dynamic programming in an iterative manner to obtain the optimal control policy
    to complex systems.'
