  md: '# Example 2


    Let us consider the first example used by Chen and Mills [1], which was also used
    by Luus and Storey [19]. The dynamics of the system are described by two state
    variables, but we introduce the third variable to put the performance index into
    the standard form for use of IDP:


    \[\frac{dx_1}{dt} = x_2 + u_1\]\[\frac{dx_2}{dt} = -x_1 + u_2\]\[\frac{dx_3}{dt}
    = u_1^2 + u_2^2\]


    with **x**(0) = [ -1 1 0 ]^T, and final time t_f = π/2. There are no constraints
    on the control variables, but there are two equality constraints to be satisfied
    at the final time


    h_1 = x_1(t_f) - 1


    and


    h_2 = x_2(t_f) + 1.


    It is required to find the unconstrained control policy that minimizes the performance
    index


    I = x_3(t_f).


    The augmented performance index to be minimized is therefore chosen as


    J = I + θ[(h_1 - s_1)^2 + (h_2 - s_2)^2].


    To determine how closely the equality constraints are satisfied, we consider the
    sum of squares of deviations


    Q = h_1^2 + h_2^2.


    For optimization with IDP, we chose P = 15 stages, each of equal length and sought
    to find piecewise linear control policy for each of the control variables. We
    chose the initial control policy **u** = **0**, the initial region size **r**_in
    = 2, the reduction factor γ = 0.85 and the region restoration factor η = 0.90,
    R = 5, and allowed 100 passes, each consisting of 30 iterations. We used a range
    of values for the penalty function factor θ. The computation time for 100 passes
    was 41 s on a PentiumII/350.


    As is shown in Table 11.2, there is a wide range 1 ≤ θ ≤ 500 for which convergence
    to I = 2.5464796 occurs, the shifting parameter s_1 is very small, and the factor
    −2θs_2 is constant at 2.54648 which is equal to the optimum value of the performance
    index. As in Example 1, this is not a numerical coincidence, but can be proven,
    since this example can also be solved analytically, as we see shortly, to give
    the optimum value for the performance index I = 8/π = 2.546479. Therefore, the
    value obtained with 15 stages of piecewise linear control is excellent. The optimal
    control policy is given in Figure 11.3 and the state trajectories are given in
    Figure 11.4.'
