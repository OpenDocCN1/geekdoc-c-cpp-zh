  md: '![](img/06ae75163df4fdf5e1eec243d497d393_166_0.png)


    Figure 9.3: Optimal control policy obtained with P = 17 time stages


    Figures 9.6 and 9.7 show that by increasing the number of stages, the performance
    index can be improved, but very slightly. The portion of the control policy after
    the maximum bound is not very important. This very low sensitivity of this part
    of the control policy makes accurate determination of the optimal control difficult.
    The most important part of the policy is the switching time, and it is essential
    to obtain the switching time from 0 to 0.5 at time t = 0.5796 as accurately as
    possible.


    We can therefore see benefits in using stages of varying lengths for establishing
    the optimal control policy. In this chapter we will outline the algorithm to incorporate
    the optimization of the stage lengths into IDP and also consider the problem where
    the final time is specified as in the example that we just considered.'
