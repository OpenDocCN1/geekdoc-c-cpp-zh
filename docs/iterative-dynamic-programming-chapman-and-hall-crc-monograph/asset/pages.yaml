- pgno: 213
  md: '# Chapter 11


    # State constraints


    # 11.1 Introduction


    In optimal control problems constraints are frequently imposed on state variables.
    For example, if one of the state variables is the reactor temperature, then it
    should be quite obvious that there should be an upper limit on the temperature.
    If a state variable is the volume of the reaction mixture, this volume should
    not surpass the physical volume of the reactor. Such constraints take a form of
    inequalities that should be incorporated into the model of the system.


    Another occasion when we encounter state constraints is in transferring a system
    from one state of operation to another. For example, in starting up a reactor,
    the system starting conditions are usually not the same as the desired conditions
    of the system operation. In these situations the constraints on the system state
    variables are in the form of equality constraints at the final time $t_f$, where
    we want some of the state variables to have the specified desired values at time
    $t_f$. The methods of dealing with these two types of state constraints are somewhat
    different; so, we consider these separately.


    # 11.2 Final state constraints


    # 11.2.1 Problem formulation


    Let us consider the system described by the differential equation


    $$\frac{dx}{dt} = \mathbf{f}(\mathbf{x}, \mathbf{u}) \tag{11.1}$$


    where the initial state $\mathbf{x}(0)$ is given. The state vector is $\mathbf{x}$
    is an $(n \times 1)$ vector and $\mathbf{u}$ is an $(m \times 1)$ control vector
    bounded by


    $$\alpha_j \le u_j \le \beta_j, \quad j = 1,2,\cdots,m. \tag{11.2}$$'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'At the final time $t_f$, there are $k$ state variables that must be at the
    desired values, i.e.,


    $$h_i=x_i(t_f)-x_i^d=0,\qquad i=1,2,\ldots,k\leq n.$$


    The optimal control problem is to find the control policy $\mathbf{u}(t)$ in the
    time interval $0\leq t<t_f$ that minimizes the performance index


    $$I=\Phi(\mathbf{x}(t_f))$$


    where the final time $t_f$ is specified. This problem differs from what we have
    considered earlier by having the $k$ equality constraints that must be satisfied
    at the final time. Numerically the equality constraints are expressed explicitly
    as


    $$\left|x_i(t_f)-x_i^d\right|\leq\epsilon_i,\qquad i=1,2,\ldots,k,$$


    where $\epsilon_i$ is the tolerance for the $i^{th}$ constraint and is chosen
    sufficiently small. We would also like to know how the choice of the tolerance
    $\epsilon_i$ affects the value of the performance index $I$ at the optimum.


    # 11.2.2  Quadratic penalty function with shifting terms


    Let us construct an augmented performance index to take into account the $k$ equality
    constraints by adding to the performance index a quadratic penalty function containing
    shifting terms


    $$J=I+\theta\sum_{i=1}^{k}(h_i-s_i)^2$$


    where $\theta$ is a positive penalty function factor and the shifting terms $s_i$
    are chosen so that computationally Eq. (11.3) becomes satisfied and the performance
    index in Eq. (11.4) becomes minimized as the iterative procedure progresses. The
    use of such shifting terms in the quadratic penalty function was first explored
    by Luus [13] for steady state optimization. It is noted that


    $$(h_i-s_i)^2=h_i^2-2s_i h_i+s_i^2$$


    so that near the optimum when Eq. (11.3) is almost satisfied, the term $h_i^2$
    is negligibly small with respect to the other two terms and the minimization of
    the augmented performance index in Eq. (11.6) becomes equivalent to minimizing


    $$J=I-2\theta\sum_{i=1}^{k}s_i h_i$$


    since the term involving the square of the shifting term is simply a constant.
    Thus, the product $-2\theta s_i$ gives the Lagrange multiplier or sensitivity
    of the performance index to the change in the $i^{th}$ equality constraint in
    Eq. (11.3). This aspect of the'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'shifting term was pointed out by Luus [13], in using penalty functions in dealing
    with difficult equality constraints in steady state optimization, and has been
    outlined in Chapter 2. The use of shifting terms was illustrated with IDP by Luus
    [14], and by Luus and Storey [19], and was outlined here in Chapter 10. When prior
    information on the sensitivity is not available, we choose initially the shifting
    term $s_i$ equal to zero, and then, after every pass of IDP, update it according
    to


    $$s_i^{q+1} = s_i^{q} - h_i \tag{11.9}$$


    where $s_i^{q}$ is the value of $s_i$ at pass number $q$. We may choose to update
    the shifting terms after every iteration instead of after every pass if a very
    small number of passes is used. To show the computational aspects of the use of
    the quadratic penalty function with shifting terms, we consider several examples.


    # Example 1


    Let us consider a very simple example with final state constraint that can be
    readily solved by Pontryagin’s maximum principle. This problem was considered
    by Goh and Teo [4] and optimized by IDP by Luus [10] and by Dadebo and McAuley
    [3]. The system is described by


    $$\frac{dx_1}{dt} = u \tag{11.10}$$


    $$\frac{dx_2}{dt} = x_1^2 + u^2 \tag{11.11}$$


    with the initial state $\mathbf{x}(0) = \begin{bmatrix}1 & 0\end{bmatrix}^T$,
    and final time $t_f = 1$. There are no constraints on the scalar control variable
    $u$, but there is the equality constraint to be satisfied at the final time


    $$h_1 = x_1(t_f) - 1 = 0. \tag{11.12}$$


    It is required to find the unconstrained control policy that minimizes the performance
    index


    $$I = x_2(t_f). \tag{11.13}$$


    The augmented performance index to be minimized is therefore chosen as


    $$J = I + \theta (h_1 - s_1)^2. \tag{11.14}$$


    To determine how closely the equality constraint is satisfied, we examine the
    absolute value of the deviation from the desired state at the final time $|x_1(t_f)
    - 1|$.


