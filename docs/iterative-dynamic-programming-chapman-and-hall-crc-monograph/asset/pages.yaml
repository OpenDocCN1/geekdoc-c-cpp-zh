    # ### 9.3.2 Modified Denbigh reaction scheme


    Let us now consider the system of reactions used by Denbigh [3] and by Aris [1]
    with a small modification by adding the reaction where the desired product is
    converted into waste, as was done by Luus and Dong [12]. The reaction scheme is


    $$\begin{aligned}

    A + B &\longrightarrow X\\

    A + B &\longrightarrow P\\

    X &\longrightarrow Y\\

    X &\longrightarrow Q\\

    Y &\longrightarrow Z

    \end{aligned}$$


    where $X$ is an intermediate, $Y$ is the desired product, and $P$, $Q$, and $Z$
    are waste products. It is desired to maximize the yield of $Y$ by choosing the
    temperature of the reactor as a function of time. Although there are seven chemical
    species, we are concerned only with the concentrations of $A$, $X$, and $Y$, and
    therefore choose as state variables their concentrations expressed as mole fractions,
    respectively. The equations describing the system are


    $$\frac{dx_1}{dt} = -k_1x_1-k_2x_1 \tag{9.29}$$


    $$\frac{dx_2}{dt} = k_1x_1-(k_3+k_4)x_2 \tag{9.30}$$'
