    # Example 6: Crane problem


    Let us consider the problem of transferring a container from a ship to a cargo
    truck by a crane so that the container does not sway too much and it comes to
    rest on the truck in the specified time. The hoist and a trolley motor provide
    two control variables to achieve the goal. This problem was first presented by
    Sakawa and Shindo [25], and then considered for optimal control studies by Goh
    and Teo [4], Luus [10], Teo et al. [26], Dadebo and McAuley [3], and by Mekarapiruk
    and Luus [22]. There are six state variables; so, with the addition of the performance
    index integrand, we have seven differential equations:


    dx₁/dt = 9x₄  (11.96)


    dx₂/dt = 9x₅  (11.97)


    dx₃/dt = 9x₆  (11.98)'
