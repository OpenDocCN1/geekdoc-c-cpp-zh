    \n```\n#include <iostream>\n\nint multiply(int x, int y) {\n    return x * y;\n\
    }\n\nint main() {\n    int product = multiply(4, 6);\n    int tripleProduct =\
    \ 3 * product; // Using the returned value in an expression\n    std::cout <<\
