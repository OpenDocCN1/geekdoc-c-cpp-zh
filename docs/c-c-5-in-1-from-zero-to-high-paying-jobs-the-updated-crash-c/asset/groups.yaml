    }\n```\n\n在此示例中，来自 `multiply` 函数的返回值被赋值给 `product` 变量。然后该值被用来计算乘积的三倍。\n\n## 返回值的优点：\n\
    \n- 1. **数据共享：** 返回值允许函数将结果传回调用者，从而实现计算或处理数据的重用。\n- 2. **模块化：** 带返回值的函数可以看作是执行特定任务并提供结果的“黑盒”，从而促进模块化代码设计。\n\
