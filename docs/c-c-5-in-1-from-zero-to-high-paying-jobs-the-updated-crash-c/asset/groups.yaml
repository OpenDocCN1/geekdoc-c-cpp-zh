    \n## 练习 11：高级 ASP.NET Core Web API\n\n从之前的练习中扩展 Web API，以支持使用 JWT（JSON Web Tokens）进行基于令牌的身份验证和授权。\n\
    \n将基于令牌的身份验证和授权添加到 ASP.NET Core Web API 是一个有价值的练习，可以了解如何保护你的 API。以下是帮助你实现此目标的逐步指南：\n\
