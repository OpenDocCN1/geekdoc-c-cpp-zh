    - 1. 在开发环境中生成类库项目。

    - 2. 创建单独的控制台应用程序以测试你的神经网络库。


    ### 步骤 8：测试神经网络


    - 1. 创建用于训练和测试的小型数据集。

    - 2. 使用你的神经网络库在数据集上训练和预测。

    - 3. 观察网络的准确率如何通过迭代提高。


