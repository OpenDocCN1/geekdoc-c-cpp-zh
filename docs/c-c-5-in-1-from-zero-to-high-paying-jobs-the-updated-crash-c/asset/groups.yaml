    # Exercise 10: Observer Pattern in UI


    Create a C# WPF application that demonstrates the Observer pattern.

    Implement a simple notification system where one component notifies others about
    state changes.


    Implementing the Observer pattern in a WPF application is a great way to understand
    how components can communicate and respond to changes.

    Here''s a step-by-step guide to help you achieve this:


    # Step 1: Create a New WPF Application


    +   1. Open Visual Studio.

    +   2. Create a new WPF application project.


    # Step 2: Define Subject and Observer Interfaces


    +   1. Define an `ISubject` interface with methods to attach, detach, and notify
    observers.

    +   2. Define an `IObserver` interface with a method to update when the subject''s
    state changes.


    # Step 3: Implement Subject and Observer Classes


    +   1. Create a class that implements the `ISubject` interface. This will manage
    a list of observers and notify them of state changes.

    +   2. Create classes that implement the `IObserver` interface. These classes
    will respond to state changes by updating their content.


    # Step 4: Create WPF Components


    +   1. Design your WPF window with components that represent the subject and observers.

    +   2. Add buttons or triggers to simulate state changes that will trigger notifications.


    # Step 5: Wire Up Components


    +   1. In the code-behind, create instances of the subject and observer classes.

    +   2. Attach the observer instances to the subject.

    +   3. Handle button clicks or triggers to change the subject''s state and notify
    observers.


    # Step 6: Build and Run


    +   1. Build the project.

    +   2. Run the application to see how the observer pattern works in the context
    of a WPF application.'
