  mdcn: "\n## 多态\n\n继承支持多态，你可以将派生类的对象当作其基类的对象来对待。这使你能够编写可与不同对象互换使用的通用代码。\n\n```\n\
    Animal myPet = new Cat();\nmyPet.Eat(); // Calls the Eat() method of Cat\n```\n\
    \n## 总结\n\n继承是面向对象编程中的强大工具，可促进代码复用和可扩展性。它允许你创建类层次结构、基于现有功能进行构建，并设计模块化且可维护的代码。通过继承属性和行为，你可以高效地创建新类，同时利用现有类的能力。\n\
    \n## 接口：\n\n接口在支持多重继承和支持依赖注入等设计模式方面发挥着重要作用。让我们详细探讨每个概念：接口支持多重继承\n\n## 什么是接口？\n\
    \nC# 中的接口定义了类必须实现的方法、属性、事件或索引器的契约。它为类可以采用的一组行为提供了蓝图。与类不同，接口不提供实现；它们只定义方法签名。\n\n\
    ## 多重继承的挑战\n\n在传统继承中，一个类只能继承自单个基类。当你想整合来自多个来源的行为时，尤其是当这些来源来自不同的类层次结构时，这可能会变得受限。\n\
    \n## 解决方案：接口\n\n接口通过允许一个类实现多个接口来解决多重继承的挑战。这意味着一个类可以采用来自多个来源的行为，而不受单个基类的约束。\n\n\
    ```\ninterface ICanFly\n{\n    void Fly();\n}\ninterface ICanSwim\n{\n    void\
    \ Swim();\n}\nclass Bird : ICanFly\n{\n    public void Fly()\n    {\n        Console.WriteLine(\"\
    The bird is flying.\");\n    }\n}\nclass Duck : ICanFly, ICanSwim\n{\n    public\
    \ void Fly()\n    {\n        Console.WriteLine(\"The duck is flying.\");\n   \
    \ }\n\n    public void Swim()\n    {\n        Console.WriteLine(\"The duck is\
    \ swimming.\");\n    }\n}\n```\n\n在此示例中，`Bird` 和 `Duck` 类都实现了接口，使它们能够独立地表现出飞行和游泳行为。\n\
    \n## 接口支持设计模式：依赖注入\n\n## 依赖注入（DI）\n\n依赖注入是一种设计模式，可促进软件中的松耦合和模块化。它涉及从外部来源提供类的依赖项（协作对象），而不是让类自己创建它们。\n\
    \n## 接口在依赖注入中的作用\n\n接口是依赖注入的关键组成部分，因为它们定义了类之间的契约。通过依赖接口而不是具体类，你在抽象与其实现之间创建了分离。\n\
    \n我们将首先定义一个名为 `Vehicle` 的基类。该类将具有 `Brand` 和 `Year` 等公共属性，以及所有车辆都可以使用的 `Start()`\
    \ 方法。\n\n```\nclass Vehicle\n{\n    public string Brand { get; set; }\n    public\
    \ int Year { get; set; }\n\n    public Vehicle(string brand, int year)\n    {\n\
    \        Brand = brand;\n        Year = year;\n    }\n\n    public void Start()\n\
    \    {\n        Console.WriteLine($\"{Brand} is starting.\");\n    }\n}\n```\n\
    \n### 第2步：创建子类\n\n接下来，我们将创建 `Vehicle` 的两个子类来表示特定类型的车辆：`Car` 和 `Motorcycle`。\n\n\
    ```\nclass Car : Vehicle\n{\n    public Car(string brand, int year) : base(brand,\
    \ year)\n    {\n    }\n\n    public void OpenTrunk()\n    {\n        Console.WriteLine($\"\
    Opening trunk of {Brand} car.\");\n    }\n}\nclass Motorcycle : Vehicle\n{\n \
    \   public Motorcycle(string brand, int year) : base(brand, year)\n    {\n   \
    \ }\n\n    public void Wheelie()\n    {\n        Console.WriteLine($\"{Brand}\
    \ motorcycle is doing a wheelie!\");\n    }\n}\n```\n\n### 第3步：使用类层次结构\n\n现在让我们创建子类的实例，看看它们如何继承公共属性和方法，同时还拥有自己的特定行为。\n\
    \n```\nclass Program\n{\n    static void Main(string[] args)\n    {\n        Car\
    \ myCar = new Car(\"Toyota\", 2022);\n        Motorcycle myMotorcycle = new Motorcycle(\"\
    Harley-Davidson\", 2021);\n        myCar.Start();\n        myCar.OpenTrunk();\n\
    \        Console.WriteLine();\n        myMotorcycle.Start();\n        myMotorcycle.Wheelie();\n\
    \    }\n}\n```\n\n### 输出：\n\n```\nToyota is starting.\nOpening trunk of Toyota\
    \ car.\n\nHarley-Davidson is starting.\nHarley-Davidson motorcycle is doing a\
    \ wheelie!\n```\n\n## 总结：\n\n在此示例中，我们构建了一个类层次结构来演示继承的概念。`Vehicle` 基类提供了公共属性和方法，而\
    \ `Car` 和 `Motorcycle` 子类继承了这些内容，并添加了它们自己的特定行为（`OpenTrunk()` 和 `Wheelie()`）。这展示了继承如何让我们高效地复用和扩展代码，从而创建结构化且可维护的类层次结构。\n\
    \n## 实现接口：\n\n你将学习如何创建接口并在不同的类中实现它。这将突显接口在强制实施共同契约方面的强大能力。\n\n场景：让我们为不同类型的电子设备（例如\
    \ `Laptop` 和 `Smartphone`）创建一个接口。每个设备都应该能够 `TurnOn()` 和 `TurnOff()`，但它们可能拥有自己的特定实现。\n\
    \n### 第1步：定义接口\n\n我们将首先定义一个名为 `IElectronicDevice` 的接口，其中包含 `TurnOn()` 和 `TurnOff()`\
    \ 方法。\n\n```\ninterface IElectronicDevice\n{\n    void TurnOn();\n    void TurnOff();\n\
    }\n```\n\n### 第2步：实现接口\n\n接下来，我们将创建实现 `IElectronicDevice` 接口的 `Laptop` 和 `Smartphone`\
    \ 类。每个类都将提供自己的 `TurnOn()` 和 `TurnOff()` 方法实现。\n\n```\nclass Laptop : IElectronicDevice\n\
    {\n    public void TurnOn()\n    {\n        Console.WriteLine(\"Laptop is booting\
    \ up.\");\n    }\n    public void TurnOff()\n    {\n        Console.WriteLine(\"\
    Laptop is shutting down.\");\n    }\n}\nclass Smartphone : IElectronicDevice\n\
    {\n    public void TurnOn()\n    {\n        Console.WriteLine(\"Smartphone is\
    \ powering on.\");\n    }\n    public void TurnOff()\n    {\n        Console.WriteLine(\"\
    Smartphone is turning off.\");\n    }\n}\n```\n\n### 第3步：使用接口\n\n最后，让我们创建 `Laptop`\
    \ 和 `Smartphone` 类的实例，并调用 `TurnOn()` 和 `TurnOff()` 方法。\n\n```\nclass Program\n\
    {\n    static void Main(string[] args)\n    {\n        IElectronicDevice myLaptop\
    \ = new Laptop();\n        IElectronicDevice mySmartphone = new Smartphone();\n\
    \        Console.WriteLine(\"Using laptop:\");\n        UseDevice(myLaptop);\n\
    \        Console.WriteLine(\"\\nUsing smartphone:\");\n        UseDevice(mySmartphone);\n\
    \    }\n    static void UseDevice(IElectronicDevice device)\n    {\n        device.TurnOn();\n\
    \        // Perform some actions\n        device.TurnOff();\n    }\n}\n```\n\n\
    ### 输出：\n\n```\nUsing laptop:\nLaptop is booting up.\nLaptop is shutting down.\n\
    \nUsing smartphone:\nSmartphone is powering on.\nSmartphone is turning off.\n\
    ```\n\n## 总结：\n\n在此示例中，我们定义了一个包含 `TurnOn()` 和 `TurnOff()` 方法的接口 `IElectronicDevice`，并在\
    \ `Laptop` 和 `Smartphone` 类中实现了它。通过使用该接口，我们强制实施了一个两个类都必须遵守的共同契约。这展示了接口如何确保不同的类实现同一组方法，从而使代码能够以统一的方式与不同对象协作。\n\
    \n## 应用多态：\n\n通过动手示例，你将见证多态如何让你编写可对来自不同类的对象进行操作的通用代码，从而增强代码灵活性。\n\n多态允许你编写通用代码，这些代码可以操作共享共同接口或继承层次结构的不同类的对象。这增强了代码灵活性，并促进了代码库的可重用性。让我们通过一个示例来演示这个概念。\n\
    \n**场景：** 我们将创建一个简单的程序来管理各种形状（例如圆形和矩形）。我们将使用多态来操作这些形状，而不管它们的具体类型如何。\n\n### 第1步：定义基类\n\
    \n首先定义一个基类 `Shape`，其中包含一个将在子类中重写的公共方法 `CalculateArea()`。\n"
