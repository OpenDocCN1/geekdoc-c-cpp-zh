    `<iomanip>` 库提供用于格式化输出流的工具，例如设置字段宽度、精度和对齐方式。\n\n```cpp\n#include <iostream>\n\
    #include <iomanip>\n\nint main() {\n    double num = 3.14159;\n    std::cout <<\
    \ std::fixed << std::setprecision(2) << num; // Outputs: 3.14\n    return 0;\n\
    }\n```\n\n## 使用格式化 I/O 读取和写入结构化数据：\n\n## 格式化输出：\n你可以使用流插入（`<<`）将结构化数据（如变量和文本）输出到文件。\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\n\nint main() {\n    std::ofstream\
    \ outputFile;\n    outputFile.open(\"data.txt\");\n\n    int age = 25;\n    outputFile\
