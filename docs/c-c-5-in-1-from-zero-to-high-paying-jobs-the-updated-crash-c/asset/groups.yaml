    # Summary


    Inheritance is a powerful tool in object-oriented programming that promotes code
    reuse and extensibility. It allows you to create class hierarchies, build upon
    existing functionality, and design modular and maintainable code. By inheriting
    attributes and behaviors, you can efficiently create new classes while leveraging
    the capabilities of existing ones.


    # Interfaces:


    Interfaces play a significant role in enabling multiple inheritance and supporting
    design patterns like dependency injection. Let''s explore each concept in detail:
    Interfaces Enable Multiple Inheritance


    # What is an Interface?


    An interface in C# defines a contract of methods, properties, events, or indexers
    that a class must implement. It provides a blueprint for a set of behaviors that
    classes can adopt. Unlike classes, interfaces do not provide implementation; they
    only define method signatures.


