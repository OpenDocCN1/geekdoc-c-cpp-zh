    \n## 第 2 章：异常处理：\n- 使用 try-catch 块优雅地处理运行时错误。\n- 抛出和捕获异常。\n- 为特定错误场景创建自定义异常类。\n\
    - 编写具有适当错误处理的健壮代码。\n\n## 使用 try-catch 块处理运行时错误：\n\n## 引言：\n异常处理是一种机制，使你能够优雅地管理代码中的运行时错误和意外情况。你可以捕获并处理异常，而不是突然终止程序，从而确保程序继续合理地执行。\n\
    \n## 使用 try-catch 块：\n\n```cpp\ntry {\n    // Code that might throw an exception\n\
    }\ncatch (ExceptionType1& ex1) {\n    // Handle exception of type ExceptionType1\n\
    }\ncatch (ExceptionType2& ex2) {\n    // Handle exception of type ExceptionType2\n\
    }\n// ...\n```\n\n## 抛出和捕获异常：\n\n## 抛出异常：\n可以使用 `throw` 关键字后跟异常对象来抛出异常。这会触发对相应\
    \ `catch` 块的搜索。\n\n```cpp\nvoid divide(int numerator, int denominator) {\n   \
    \ if (denominator == 0) {\n        throw std::runtime_error(\"Division by zero\"\
    );\n    }\n    // Perform division\n}\n```\n\n## 捕获异常：\n`catch` 块按它们出现的顺序进行求值。第一个匹配的\
    \ `catch` 块会被执行。如果未找到匹配的 `catch` 块，程序将终止。\n\n```cpp\ntry {\n    divide(10, 0);\n\
    }\ncatch (const std::runtime_error& ex) {\n    std::cerr << \"Error: \" << ex.what()\
    \ << std::endl;\n}\n```\n\n## 创建自定义异常类：\n\n## 定义自定义异常：\n你可以通过继承标准 `std::exception`\
    \ 类或其派生类来定义自己的异常类。这允许你创建捕获独特错误场景的特定异常类型。\n\n异常处理使你能够创建健壮的程序，优雅地处理意外情况。它将错误处理与主逻辑分离，从而提高代码清晰度。\n\
    \n## 最佳实践：\n- 捕获特定异常，而不是使用捕获所有异常的方法。\n- 针对不同的错误场景使用异常层次结构。\n- 在异常类的 `what()` 方法中提供有意义的错误消息。\n\
