    ### Step 5: Implement Backward Propagation


    - 1. Implement a method to perform backward propagation to calculate gradients.

    - 2. Calculate gradients of weights and biases using the chain rule.


    ### Step 6: Implement Gradient Descent


    - 1. Implement a method to update weights and biases using gradient descent.

    - 2. Adjust weights and biases based on calculated gradients and learning rate.


