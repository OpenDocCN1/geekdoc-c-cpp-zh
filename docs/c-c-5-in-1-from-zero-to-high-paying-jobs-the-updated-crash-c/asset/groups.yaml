    \ `Startup.cs` 文件中使用 `AddAuthentication` 和 `AddJwtBearer` 方法配置 JWT 身份验证。\n- 2.\
    \ 使用 `AddAuthorization` 方法设置授权策略。按需定义角色和策略。\n\n### 步骤 4：生成 JWT 令牌\n- 1. 实现一个令牌生成服务，在用户成功登录时创建\
