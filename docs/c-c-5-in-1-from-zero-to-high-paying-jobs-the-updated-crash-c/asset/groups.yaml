    # Dependency Injection (DI)


    Dependency Injection is a design pattern that promotes loose coupling and modularity
    in software. It involves providing the dependencies (collaborating objects) of
    a class from external sources rather than having the class create them itself.


    # Role of Interfaces in Dependency Injection


    Interfaces are a crucial component of Dependency Injection because they define
    the contracts between classes. By relying on interfaces instead of concrete classes,
    you create a separation between the abstraction and its implementation.'
