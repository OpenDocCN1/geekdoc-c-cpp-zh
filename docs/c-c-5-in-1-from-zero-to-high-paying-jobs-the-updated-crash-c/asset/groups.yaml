    \ as follows:\n\n```\nif (condition) {\n    // Code to execute if the condition\
    \ is true\n}\n```\n\nHere's how it works:\n\n+   1. The keyword `if` indicates\
    \ the start of the conditional statement.\n+   2. The condition is enclosed in\
    \ parentheses `()` . It's an expression that evaluates to either `true` or `false`\
    \ .\n+   3. If the condition is true, the code block inside the curly braces `{}`\
    \ is executed. If the condition is false, the code block is skipped.\n\n# Example:\
    \ Using the `if` Statement:"
