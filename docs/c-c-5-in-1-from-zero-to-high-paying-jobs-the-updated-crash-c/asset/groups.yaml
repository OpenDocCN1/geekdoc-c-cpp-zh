    - 2. 确定输入和输出神经元数量、隐藏层和激活函数。


    ### 步骤 3：实现激活函数


    - 1. 将 sigmoid、ReLU 等常见激活函数实现为单独的类。

    - 2. 添加计算激活值及其导数的方法。


    ### 步骤 4：实现前向传播


    - 1. 实现通过神经网络执行前向传播的方法。

    - 2. 使用加权输入和激活函数计算每个神经元的输出。


    ### 步骤 5：实现反向传播


    - 1. 实现执行反向传播以计算梯度的方法。

    - 2. 使用链式法则计算权重和偏置的梯度。


    ### 步骤 6：实现梯度下降


    - 1. 实现使用梯度下降更新权重和偏置的方法。

    - 2. 根据计算出的梯度和学习率调整权重和偏置。


