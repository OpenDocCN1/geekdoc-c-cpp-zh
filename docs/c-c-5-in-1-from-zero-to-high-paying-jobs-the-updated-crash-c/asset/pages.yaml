- pgno: 60
  md: "```\nvoid divide(int numerator, int denominator) {\n    if (denominator ==\
    \ 0) {\n        throw std::runtime_error(\"Division by zero\");\n    }\n    //\
    \ Perform division\n}\n```\n\n# Catching Exceptions:\n\nThe `catch` blocks are\
    \ evaluated in the order they appear. The first matching `catch` block is executed.\
    \ If no matching `catch` block is found, the program terminates.\n\n```\ntry {\n\
    \    divide(10, 0);\n}\ncatch (const std::runtime_error& ex) {\n    std::cerr\
    \ << \"Error: \" << ex.what() << std::endl;\n}\n```\n\n# Creating Custom Exception\
    \ Classes:\n\n# Defining Custom Exceptions:\n\nYou may define your own exception\
    \ classes by inheriting from the standard `std::exception` class or its derived\
    \ classes. This allows you to create specific exception types that capture unique\
    \ error scenarios."
