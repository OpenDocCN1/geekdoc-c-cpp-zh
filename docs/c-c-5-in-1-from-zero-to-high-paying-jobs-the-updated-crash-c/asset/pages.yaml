    \    bool isEmpty() const;\n};\n```\n```\n\n# Step 4: Implement the Stack Methods\n\
    \nImplement the methods of the `Stack` class:\n\n```\n```cpp\ntemplate <typename\
    \ T>\nvoid Stack<T>::push(const T& item) {\n    if (top < MAX_SIZE - 1) {\n  \
    \      items[++top] = item;\n    }\n}\n\ntemplate <typename T>\nvoid Stack<T>::pop()\
    \ {\n    if (top >= 0) {\n        --top;\n    }\n}\n\ntemplate <typename T>\n\
    T& Stack<T>::peek() {\n    return items[top];\n}\n\ntemplate <typename T>\nbool\
    \ Stack<T>::isEmpty() const {\n    return top == -1;\n}\n```\n```\n\n# Step 5:\
    \ Create the Main Program\n\nWrite the `main` function to test the template stack\
    \ with different data types:"
