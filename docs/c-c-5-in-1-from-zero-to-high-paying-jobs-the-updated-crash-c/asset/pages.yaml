- pgno: 21
  md: '# Operators in C++


    Operators are symbols that represent actions or computations on variables and
    values. They allow you to perform a wide range of operations, from basic arithmetic
    calculations to complex logical evaluations. Operators are essential because they
    facilitate data manipulation and enable you to create dynamic and interactive
    programs.


    # Arithmetic Operators:


    Arithmetic operators will run basic mathematical operations on all numeric data
    types:


    +   - `+` : Addition

    +   - `-` : Subtraction

    +   - `*` : Multiplication

    +   - `/` : Division

    +   - `%` : Modulus (remainder after division)


    # Assignment Operators:


    Assignment operators are used to assign values to variables:


    +   - `=` : Assigns the value on the right to the variable on the left.

    +   - `+=`, `-=`, `*=`, `/=`, `%=` : Combine an operation with assignment. For
    example, `x += 5` is equivalent to `x = x + 5`.


    # Comparison Operators:


    Comparison operators are used to compare two values and evaluate expressions:


    +   - `==` : Equal to

    +   - `!=` : Not equal to

    +   - `<` : Less than

    +   - `>` : Greater than

    +   - `<=` : Less than or equal to

    +   - `>=` : Greater than or equal to


    # Logical Operators:


    Logical operators are utilized to make and combine multiple conditions and then
    evaluate the results:


    +   - `&&` : Logical AND (returns `true` if both conditions are `true` )'
