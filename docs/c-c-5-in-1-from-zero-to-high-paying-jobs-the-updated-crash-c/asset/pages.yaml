    \ {\n    // Code to repeat\n} while (condition);\n```\n\n# Example: Using a `do-while`\
    \ Loop:\n\n```\n#include <iostream>\n\nint main() {\n    int count = 0;\n\n  \
    \  do {\n        std::cout << \"Count: \" << count << std::endl;\n        count++;\n\
    \    } while (count < 5);\n\n    return 0;\n}\n```\n\n# 3. `for` Loop:\n\nThe\
    \ `for` loop is designed for iterating a specific number of times. It consists\
    \ of an initialization step, a condition, and an update statement.\n\n# Syntax:"
