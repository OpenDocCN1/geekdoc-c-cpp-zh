    \nThe concept of variable scope refers to the region of code where a variable\
    \ can be accessed or manipulated. Depending on where a variable is declared, it\
    \ can have different levels of visibility and lifetime within your program. There\
    \ are two main types of scope: local scope and global scope.\n\n**Local Scope:**\n\
    A variable declared within a block of code, such as within a function or a loop,\
    \ has local scope. It's accessible only within that specific block where it's\
    \ defined. Once the block is exited, the variable goes out of scope and cannot\
    \ be accessed anymore.\n\n**Example of Local Scope:**\n\n```\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int x = 5; // x has local scope within the main\
    \ function\n    std::cout << x << std::endl; // x is accessible here\n\n    {\n\
    \        int y = 10; // y has local scope within this block\n        std::cout\
    \ << y << std::endl; // y is accessible here\n    }\n\n    // Cannot access y\
    \ here (out of scope)\n    return 0;\n}\n```\n```\n\nIn this example, `x` is declared\
    \ within the `main` function, making it accessible throughout the function. `y`,\
    \ on the other hand, is declared within a nested block and is only accessible\
    \ within that block.\n\n**Global Scope:**"
