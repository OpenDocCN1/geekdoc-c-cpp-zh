  md: 'Design patterns are proven solutions to recurring problems in software design.
    They provide structure and best practices for creating maintainable and scalable
    applications.


    +   - **Singleton Pattern**: Ensures a class has only one instance and provides
    a global point of access.

    +   - **Factory Pattern**: Creates objects without specifying the exact class
    of object that will be created.

    +   - **Observer Pattern**: Defines a dependency between objects so that when
    one object changes state, all its dependents are notified.


