  md: '+   - **Manipulate Data:** You can perform calculations, modifications, and
    transformations on the data stored in variables. For example, adding numbers,
    concatenating strings, or comparing values.

    +   - **Enable Flexibility:** Variables enable your program to adapt and respond
    dynamically to changing conditions and user interactions.

    +   - **Enhance Readability:** Giving meaningful names to variables improves code
    readability and makes your intentions clear.

    +   - **Reuse Values:** Once you''ve stored a value in a variable, you can use
    it multiple times throughout your program without having to re-enter or recalculate
    it.


    In summary, variables are the foundation of any program, enabling you to work
    with data in a flexible and organized manner. By declaring, assigning, and utilizing
    variables effectively, you can create powerful and dynamic programs tailored to
    specific tasks and requirements.


    **Data Types:** C++ supports various data types, each with its own purpose and
    storage requirements. We''ll explore fundamental types like integers, floating-point
    numbers, characters, and more.


    In C++, data types are utilized to specify which types of data that a variable
    may hold. Each data type has its own set of values, storage requirements, and
    operations that can be performed on it. Here are some fundamental data types in
    C++: 1. Integers:

    Integers represent whole numbers without decimal points. C++ provides various
    sizes of integer data types:


    +   - *int*: Represents signed integers, typically using 4 bytes.

    +   - *short int*: Represents smaller signed integers, often using 2 bytes.

    +   - *long int*: Represents larger signed integers, commonly using 4 or 8 bytes.

    +   - *long long int*: Represents very large signed integers, introduced in C++11.


    # 2. Floating-Point Numbers:


    Floating-point numbers are used to represent decimal values. C++ offers two primary
    floating-point data types:


    +   - *float*: Represents single-precision floating-point numbers, typically using
    4 bytes.

    +   - *double*: Represents double-precision floating-point numbers, often using
    8 bytes.'
