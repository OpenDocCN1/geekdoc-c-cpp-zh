  md: "# Chapter 3: Control Structures\n\n# Control Structures: if Statements, Loops,\
    \ Switches\n\n# if Statements:\n\nConditional statements allow your program to\
    \ make decisions based on conditions. We'll explain the syntax of the `if` statement\
    \ and show how it controls the flow of your program.\n\nThe `if` statement is\
    \ a fundamental control structure in C++ that allows you to make decisions in\
    \ your program based on a condition. It controls the flow of your program by executing\
    \ a certain block of code only if the specified condition is true.\n\n# Syntax\
    \ of the `if` Statement:\n\nThe basic syntax of the `if` statement is as follows:\n\
    \n```\nif (condition) {\n    // Code to execute if the condition is true\n}\n\
    ```\n\nHere's how it works:\n\n+   1. The keyword `if` indicates the start of\
    \ the conditional statement.\n+   2. The condition is enclosed in parentheses\
    \ `()` . It's an expression that evaluates to either `true` or `false` .\n+  \
    \ 3. If the condition is true, the code block inside the curly braces `{}` is\
    \ executed. If the condition is false, the code block is skipped.\n\n# Example:\
    \ Using the `if` Statement:"
  merge: -1
  img_proc: true
- pgno: 24
  md: "Let's see a practical example. Suppose we want to determine whether a given\
    \ number is positive. If it is, we'll display a message indicating that it's positive.\n\
    \n```\n```cpp\n#include <iostream>\n\nint main() {\n    int number;\n\n    std::cout\
    \ << \"Enter a number: \";\n    std::cin >> number;\n\n    if (number > 0) {\n\
    \        std::cout << \"The number is positive.\" << std::endl;\n    }\n\n   \
    \ return 0;\n}\n```\n```\n\nIn this example:\n\n+   - We declare an integer variable\
    \ `number` to store the user's input.\n+   - We prompt the user to enter a number\
    \ using `std::cin`.\n+   - The `if` statement checks whether the `number` is greater\
    \ than 0.\n+   - If the condition is true, the message \"The number is positive.\"\
    \ is displayed.\n\n# Flow Control:\n\nThe `if` statement controls the flow of\
    \ your program by allowing certain code blocks to be executed conditionally. If\
    \ the condition specified in the `if` statement evaluates to true, the code within\
    \ the associated block of curly braces is executed. If false, it is skipped entirely.\n\
    \nThis flow control enables you to create dynamic behavior in your program. You\
    \ can have multiple `if` statements, combine them with `else` and `else if` clauses,\
    \ and create intricate decision-making processes.\n\nIn summary, the `if` statement\
    \ is a powerful tool for controlling program flow based on conditions. It empowers\
    \ you to create logic that adapts to different situations, making your programs\
    \ more interactive and responsive."
  merge: -1
  img_proc: true
