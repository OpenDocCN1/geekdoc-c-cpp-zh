- pgno: 88
  md: "# 1. Getter (`get`) Method:\n\nThe getter method retrieves the value of the\
    \ associated attribute. It's called when you access the property. It returns the\
    \ value of the attribute.\n\n# 2. Setter (`set`) Method:\n\nThe setter method\
    \ sets the value of the associated attribute. It's called when you assign a value\
    \ to the property. It validates and assigns the value to the attribute.\n\n# Benefits\
    \ of Using Properties\n\n+   - **Encapsulation**: Properties encapsulate access\
    \ to attributes, allowing you to control how data is accessed and modified. This\
    \ protects the internal state of objects.\n+   - **Data Validation**: You can\
    \ add validation logic within the setter method to ensure that only valid values\
    \ are assigned to the attribute.\n+   - **Flexibility**: With properties, you\
    \ can modify the behavior of attribute access without changing the public interface\
    \ of your class. This promotes maintainability.\n\n# Using Properties for Encapsulation\n\
    \n```\nclass BankAccount\n{\n    private decimal balance;\n    public decimal\
    \ Balance\n    {\n        get { return balance; }\n        set\n        {\n  \
    \          // Validate and set the balance\n            if (value >= 0)\n    \
    \        {\n                balance = value;\n            }\n        }\n    }\n\
    }\n```\n\n# Automatic Properties"
  merge: -1
