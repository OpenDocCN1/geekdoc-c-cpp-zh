  md: 'Names in different enumerations must be distinct. Values need not be in the
    same enumeration.


    Enumerations provide a convenient way to associate constant values with names,
    an alternative to #define with the advantage that the values can be generated
    for you. Although variables of enum types may be declared, compilers need not
    check what you store in such a variable is a valid value for the enumeration.
    Nevertheless, enumeration variables offer the chance of checking and so often
    better after #defines. In addition, a debugger may be able to print values of
    enumerations in their symbolic form.


    # 2.4 Declarations


    All variables must be declared before use, although certain declarations can be
    made implicitly by content. A declaration specifies a type, and contains a list
    of one or more variables of that type, as in


    ```

    int lower, upper, step;

    char c, line[1000];

    ```


    Variables can be distributed among declarations in any fashion; the lists above
    could be written as


    ```

    int lower;

    int upper;

    int step;

    char c;

    char line[1000];

    ```


    The latter form takes more space, but is convenient for adding a comment to each
    declaration for subsequent modifications.


    A variable may also be initialized in its declaration. If the name is followed
    by an equals sign and an expression, the expression serves as an initializer,
    as


    ```

    char esc = ''\\'';

    int i = 0;

    int limit = MAXLINE+1;

    float exp = 1.0-5;

    ```


    If the variable is not automatic, the initialization is done once only, conceptually
    before the program starts executing, and the initializer must be a constant expression.
    An explicitly initialized automatic variable is initialized each time the function
    or block it is entered; the external and static variables are initialized to zero
    by default. Automatic variables for which is no explicit initializer are undefined
    (i.e., garbage) values.


    The qualifier const can be applied to the declaration of any variable to specify
    that its value will not be changed. For an array, the const qualifier says that
    the elements will not be altered.


    ```

    const double e = 2.7182818245905;

    const char msg[] = "warning";

    ```


    The const declaration can also be used with array arguments, to indicate that
    the function does not change array:


    ```

    int strlen(const char[]);

    ```'
