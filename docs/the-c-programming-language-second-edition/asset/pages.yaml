  md: '# 7.4 Formatted Input - Scanf


    The function scanf is the input analog of printf, providing many of the same conversion
    facilities in the opposite direction.


    ```

    int scanf(char *format, ...)

    ```


    scans reads characters from the standard input, interprets them according to the
    specification in format, and stores the results through the remaining arguments.
    The format argument is described below; the other arguments, each of which must
    be a pointer, indicate where the converted input should be stored. With printf,
    this section is a summary of the most useful features, not an exhaustive list.


    scanf stops when it exhausts its format string, or when some input fails to match
    the control specification. It returns as its value the number of successfully
    matched and assigned input items. On the end of file, EOF is returned; note that
    this is used to decide how many items were found. This is different from 0, which
    means the next input character does not match the first specification in the format
    string. The next call to scanf resumes searching immediately after the last character
    converted.


    There is also a fscanf that reads from a string instead of the standard input:


    ```

    int fscanf(char *string, char *format, arg arg1, arg2, ...)

    ```


    It scans the string according to the format in and stores the resulting values
    into arg1, arg2, etc. These arguments are pointers.


    The format string usually contains conversion specifications, which are used to
    control conversion of input. The format string may contain:


    +   * Blanks or tabs, which are not ignored.

    * Ordinary characters (not %), which are expected to match the next non-white
    space character of the input stream.

    * Conversion specifications, consisting of the character %, an optional assignment
    specifying a maximum width, an optional h, l or L indicating the width of the
    target, and a conversion character.


    A conversion specification directs the conversion of the next input field. Normally
    the result is places in the variable pointed to by the argument; however, if the
    assignment fails, the input field is skipped; no assignment is made. An input
    field is defined as a string of non-white space characters; it extends to the
    next white space character or until the field width is, exhausted. This implies
    that scanf will read across boundaries to find its input, as newlines are white
    space. (White space characters are blank, tab, newline, carriage return, vertical
    tab, and formfeed)


    The conversion character indicates the interpretation of the input field. The
    corresponding argument must be a pointer, as required by the call-by-value semantics
    of C. Conversion characters are shown in Table 7.2.


    Table 7.2: Basic Convers Convers


    | Character | Input Data; Argument type |'
