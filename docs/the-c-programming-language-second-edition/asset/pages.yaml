  md: "The more serious problem is because we have used integer arithmetic, the Celsius\
    \ temperatures are not very accurate; for instance, 0°F is actually about -17.8°C,\
    \ not -17. To get more accurate answers, we should use floating-point arithmetic\
    \ instead of integer. This requires some changes in the program. Here is the second\
    \ version:\n\n```\n#include <stdio.h>\n\n/* print Fahrenheit-Celsius table\nfor\
    \ jahr = 0, 20, ..., 300; floating-point version */\nmain() {\n    float f, celsius;\n\
    \    float lower, upper, step;\n\n    lower = 0;          /* lower limit of temperature\
    \ scale */\n    upper = 300;        /* upper limit */\n    step = 20;        \
    \  /* step size */\n\n    fahr = lower;\n    while (fahr <= upper) {\n       \
    \ celsius = (5.0/9.0) * (fahr-32.0);\n        printf(\"%.3f %6if\\n\", fahr, celsius);\n\
    \        fahr = fahr + step;\n    }\n}\n```\n\nThis is much the same as before,\
    \ except that fahr and celsius are declared to be float and the formula for conversion\
    \ is written in a more natural way. We were unable to use 5/9 in the previous\
    \ version because integer division would truncate it to zero. A decimal point\
    \ in a constant indicates that it is floating, however, so 5/9.0 is not truncated\
    \ because it is the ratio of two floating-point values.\n\nIf an arithmetic operation\
    \ has operands, an integer operation is performed. If an arithmetic operator has\
    \ one floating-point operand and one integer operand, the integer will be converted\
    \ to floating point before the operation is done. If we had (fahr-32), the 32\
    \ would be automatically converted to floating point. Nevertheless, writing floating-point\
    \ counts with explicit decimal points when they have integral values emphasizes\
    \ their floating-point nature for human readers.\n\nThe detailed rules when integers\
    \ are converted to floating point are in Chapter 2. For now, notice the assignment\n\
    \n```\nfahr = lower;\nand the test\n\nwhile (fahr <= upper)\nwork in the natural\
    \ way - the int is converted to float the operation is done.\n```\n\nThe printf\
    \ conversion specification %3.0f says that a floating-point number (here fahr)\
    \ is to be printed at least three characters wide, with no decimal point and no\
    \ fraction digits. %6.1f describes another number (celsius) that is to be printed\
    \ at least six characters wide, with 1 digit after the decimal point. The output\
    \ looks like this:\n\n```\n0   -17.8\n20  -6.7\n40  4.4\n...\n```"
