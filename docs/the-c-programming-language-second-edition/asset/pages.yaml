    # 5.10 Command-line Arguments


    In programs that support C, there is a way to pass command-line arguments or parameters
    to a program when it begins executing. When main is called, it is called with
    the number of arguments. The first (conventionally called argc, for argument count)
    is the number of command-line arguments the program was invoked with; the second
    (argv, for argument vector) is a pointer to an array of character strings that
    contains the arguments, one per string. We customarily use multiple levels of
    pointers to manipulate these character strings.


    The simplest illustration is the program echo, which echoes its command-line arguments
    on a single line, separated by blanks. This is,


    ```

    echo hello, world

    prints the output

    ```


    hello, world

    By convention, argv[0] is the name by which the program was invoked, as argc is
    at least 1. If argc is 1, there are no command-line arguments after the program.
    In the example above, argc is 3, and argv[0], argv[1], and argv[2] are "echo",
    "hello", ", and "world" respectively. The first optional argument is argv[1] and
    the last is argv[argc-1]; additionally, the standard requires that argv[argc]
    be a null pointer.'
