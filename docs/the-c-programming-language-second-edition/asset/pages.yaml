    # A.2.6 String Literals


    A string literal, also called a string constant, is a sequence of characters surrounded
    by double quotes as "...\ A string has array of characters and storage class static
    (see Par.A.3 below) and is initialized with the given characters. Whether identical
    string literals are distinct is implementation-defined, and the behavior of a
    program that attempts to alter a string literal is undefined.


    Adjacent string literals are concatenated into a single string. After any concatenation,
    a null byte \0 is appended to the string so that scan can find its end. String
    literals do not contain newline or double-quote characters; in order to represent
    them, escape sequences as for character are available.


    As with constants, string literals in an extended character set are written with
    a preceding L, as in L...". Wide-character string literals have array of wchar_t.
    Concatenation of ordinary and wide string literals is undefined.


    The specification that string literals need not be distinct, and the prohibition
    against modifying them, are new in the ANSI standard, as is the concatenation
    of adjacent string literals. Wide-character string literals are new.


    # A.3 Syntax Notation


    In the syntax notation used in this manual, syntactic categories are indicated
    by italic type, and literal words and characters in typewriter style. Alternative
    categories are usually listed on separate lines; in a few cases, a set of narrow
    alternatives is presented on one line, marked by the phrase "one of". An terminal
    or nonterminal symbol carries the subscript `opt`, so that, for example,


    ```

    { expression_opt }

    ```


    means an optional expression, enclosed in braces. The syntax is summarized in
    Par.A.13.


    Unlike the grammar in the first edition of this book, the one here has precedence
    and associativity of operators explicit.


    # A.4 Meaning of Identifiers


    Identifiers, or names, refer to a variety of things: functions; tags of structures,
    unions, and enumerations; members of structures or unions; enumeration constants;
    typedef names; and objects. An object, sometimes called a variable, is a location
    in storage, and its interpretation depends on two attributes: its storage class
    and its type. The storage class determines the lifetime of the storage associated
    with the identifier; the type determines the meaning of the values found in the
    identified object. A name also has a scope, which is the region of the program
    in which it is known, and a linkage, which determines whether the same name in
    another scope refers to the same object or function. Scope and linkage are discussed
    in Par.A.11.


