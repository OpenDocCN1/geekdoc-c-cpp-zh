  md: "As discussed in Chapter 1, while and for loops test the termination condition\
    \ at the top. By contrast, the third loop in C, the do-while, tests at the bottom\
    \ after each pass through the loop; the body is always executed at once.\n\nThe\
    \ syntax of the do is\n\n```\ndo\n  statement\n  while (expression);\n```\n\n\
    The statement is executed, then expression is evaluated. If it is true, statement\
    \ is evaluated again, and so on. When the expression becomes false, the loop terminates.\
    \ Except for the sense of the test, do-while is equivalent to the Pascal repeat-until\
    \ statement.\n\nExperience shows that do-while is much less used than while and\
    \ for. Nonetheless, from time to time it is valuable, as in the function itoa\
    \ which converts a number to a character string (the name of atoi). The job is\
    \ significantly more complicated than might be thought at first, because easy\
    \ methods of generating digits generate them in the wrong order. We have chosen\
    \ to generate the string backwards, then reverse it:\n\n```\n/* itoa: convert\
    \ n to characters in s */\nvoid itoa(int n, char s[])\n{\n  if ((sign = n) < 0)\
    \      /* record sign */\n    n = -n;                 /* make n positive */\n\
    \  do {                      /* generate digits in reverse order */\n    s[i++]\
    \ = n % 10 + '0';   /* get next digit */\n  } while (n-- > 0);         /* delete\
    \ it */\n  if (sign < 0)\n    s[i++] = '-';\n  s[i] = '\\0';\n  reverse(s);\n\
    }\n```\n\nThe-while is necessary, or at least convenient, since at least one character\
    \ must be installed in the array s, even if n is not. We also used braces around\
