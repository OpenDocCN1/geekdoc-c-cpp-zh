    Rather than allocating a compiled-fixed-size array, malloc will request space
    from the operating system as needed. Since other activities in the program may
    also request space without calling this allocator, the space that malloc manages
    may not be contiguous. Thus its free storage is kept as a list of free blocks.
    Each block contains a size, a pointer to the next block, and the space itself.
    The blocks are kept in order of increasing storage address, and the last block
    (highest address) points to the first.


    # free list


    | in | | in | | in |

    |---|---|---|---|--|

    | use | | use | | use |

    | free, owned by malloc |

    | in use, owned by malloc |

    | not owned by malloc


    When a request is made, the free list is scanned until a big-enough block is found.
    This algorithm is called "first fit", by contrast "best fit", which looks for
    the smallest block that will satisfy the request. If the block is exactly the
    size requested it unlinked from the list and returned to the user. If the block
    is too big, it is split, and the proper amount is returned to the user while the
    residue remains on the free list. If no big-enough block is found, another large
    chunk is obtained by the operating system and linked into the free list.


    Freeing also causes a search of the free list, to find the pointer to insert the
    block freed. If the block being freed is adjacent to a free block on either side,
    it is coalesced into a single bigger block, so storage does not become too fragmented.
    Determining the adjacency is easy the free list is maintained in order of decreasing
    address.


