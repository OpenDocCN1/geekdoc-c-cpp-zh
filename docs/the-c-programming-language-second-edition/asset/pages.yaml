  md: "# The line\n\nnl = nw = nc = 0;\nsets all three variables to zero. This is\
    \ not a special case, but a consequence of the fact that an\nassignment is an\
    \ expression with the value and assignments associated from right to left. It's\n\
    as if we have written\n\n```\nnl = {nw = (nc = 0)};\n```\n\nThe operator || means\
    \ OR, so the line\nif (c == ' ' || c == '\\n' || c == '\\t')\nsays \"if c is a\
    \ blank or c is a newline or c is a tab.\" (Recall that the escape sequence \\\
    t is a\\visible representation of the tab character). There is a corresponding\
    \ operator && for AND; its precedence is higher than ||. Expressions by && ||\
    \ || are evaluated to\right, and it is guaranteed that evaluation stops as soon\
    \ as the truth or falsehood is known.\nIf c is a blank, there is no need to test\
    \ whether it is a newline or tab, so these tests are not\nmade. This is not particularly\
    \ important here, but is significant in more complicated situations,\nas we will\
    \ soon see.\n\nThe example also shows an else, which specifies an alternative\
    \ action if the condition part of\nan statement is false. The general form is\n\
    \n```\nif (expression)\n    statement;\nelse\n    statement;\n```\n\nOne and only\
    \ one of the two statements associated with an if-else is performed. If the\n\
    expression is true, statement is executed; if not, statement is executed. Each\
