    # 4.3 External Variables


    A C program consists of a set of external objects, which are either variables
    or functions. The adjective "external" is used in contrast to "internal", which
    describes the arguments and variables defined inside functions. External variables
    are defined outside of any function, and are potentially available to many functions.
    Functions themselves are always external, because C does not allow functions to
    be defined inside other functions. By default, external variables and functions
    have the property that all references to them by the same name, from functions
    compiled separately, are references to the same name. (Standard calls this property
    external linkage.) In this sense, external variables are analogous to Fortran
    COMMON blocks or variables in the outermost block of Pascal. We will see later
    on how external variables are globally accessible, they provide an alternative
    to function arguments and return values for communicating data between functions.
    Any function may access an external variable by referring to it by name, if it
    has been declared somehow.


    If a large number of variables must be shared among functions, external variables
    are more convenient and efficient with long argument lists. As pointed out in
    Chapter 1, however, this reasoning beside itself, can have a bad effect on program
    structure, and leads to too many connections between functions.


    External variables are also useful because of their scope and lifetime. Automatic
    variables are internal to a function; they exist when the function is entered,
    and disappear when it is left. External variables, on the other hand, are permanent,
    so they can retain values from one invocation to the next. If two functions must
    share data, neither calls the other is most convenient if the shared data is kept
    in external variables rather than being passed in or out via arguments.


