  md: '# Chapter 2 - Types, Operators and Expressions


    Variables and constants are the basic data objects manipulated in a program. Declarations
    list the variables to be used, and state what type they have and perhaps what
    their initial values are. Operators specify what is to be done to them. Expressions
    combine variables and produce new values. The type of an object determines the
    set of values it can have and what operations can be performed on it. These building
    blocks are the topics of this chapter.


    The ANSI standard has made many small changes and additions to basic types and
    expressions. There are now signed and unsigned forms of all integer types, and
    notations for unsigned constants and hexadecimal constants. Floating-point operations
    may be done in single precision; there is also a long double for extended precision.
    String constants may be concatenated at compile time. Enumerations have become
    part of the language, formalizing a length of string. Objects may be declared
    const, which prevents them from being changed. Rules for automatic coercions among
    arithmetic types have been augmented to handle the right set of types.


    # 2.1 Variable Names


    Although we did not say in Chapter 1, there are some restrictions on the names
    of variables and symbolic constants. Names are made up of letters and digits;
    the first character must be a letter. The underscore _ counts as a letter; it
    is sometimes useful for improving the readability of variable names. Don''t begin
    variable names with underscore, however, since library routines often use such
    names. Upper and lower case letters are distinct, x and X are two different names.
    Traditional C practice is to use lower case for variable names, and all upper
    case for constants.


    At least the first 31 characters of an internal name are significant. For function
    names and external variables, the name may be less than 31, but external names
