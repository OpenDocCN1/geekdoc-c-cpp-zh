  md: '# Appendix B - Standard Library


    This appendix is a summary of the library defined by the ANSI standard. The standard
    library is not part of the C language proper, but an environment that supports
    standard C will provide the function declarations and type definitions of this
    library. We have omitted a few functions that are of limited utility or easily
    synthesized from others; we have omitted multi-byte characters; and we have omitted
    discussion of locale uses; that is, properties depend on local language, nationality,
    or culture.


    The functions, types and macros of standard library are defined in standard headers:


    ```

    <assert.h> <float.h> <math.h> <stdarg.h> <stdlib.h>

    <ctype.h> <limits.h> <setjmp.h> <stddef.h> <string.h>

    <errno.h> <locale.h> <signal.h> <stdio.h> <time.h>

    ```


    A header can be accessed by


    ```

    #include <header>

    ```


    Headers may be included in any order and number of times. A header must be included
    outside of any external declaration or definition and before use of anything it
    declares. A header need not be a  source file.


    External identifiers that begin with an underscore are reserved for the library,
    as are all other identifiers that begin with an underscore and an upper-case letter
    or another underscore.


    # B.1 Input and Output: <stdio.h>


    The input and output functions, types, and macros defined in <stdio.h> represent
    nearly one third of the library.


    A stream is a source or destination of data that may be associated with a disk
    or other peripheral. The library supports text and binary streams, although on
    some systems, notably UNIX, these are identical. A text stream is a sequence of
    lines; each line has zero or more characters and is terminated by ''\n''. An environment
    may need to convert a text stream to or from some other representation (such as
    mapping ''\n'' to carriage return and linebreak). A binary stream is a sequence
    of unsequenced bytes that record internal data, with the property that if it is
    written, then read back on the same system, it will compare equal.


    A stream is connected to a file or device by opening it; the connection is broken
    by closing the stream. Opening a file returns a pointer to an object of type FILE,
    which records whatever information is necessary to control the stream. We will
    use `file pointer` and `stream` interchangeably when there is no ambiguity.


    When a program begins execution, the three streams stdin, stdout, and stderr are
    already open.


    # B.1.1 File Operations'
