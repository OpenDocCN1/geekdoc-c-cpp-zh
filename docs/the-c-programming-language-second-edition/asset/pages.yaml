  md: '# Chapter 8 - The UNIX System Interface


    The UNIX operating system provides its services through a set of system calls,
    which are in effect functions within the operating system that may be called by
    user programs. This chapter describes how to use some of the most important system
    calls from C programs. If you use UNIX, this should be directly helpful, for it
    is sometimes necessary to employ system calls for maximum efficiency, or to access
    some facility that is not in the library. Even if you use C on a different operating
    system, however, you should be able to gle into C programming from studying these
    examples; although vary, similar code will be found on any system. Since the ANSI
    C library is in many cases modeled on UNIX facilities, this code may help your
    understanding of the library as well.


    This chapter is divided into three major parts: input/output, file system, and
    storage allocation. The first two parts assume a most familiarity with the external
    characteristics of UNIX systems.


    Chapter 7 was concerned with an input/output interface that is uniform across
    operating systems. On any particular system the routines of the standard library
    have to be written in terms of the facilities provided by the host system. In
    the next sections we will describe the UNIX system calls for input and output,
    and show how parts of the standard library can be implemented with them.


    # 8.1 File Descriptors


    In the UNIX operating system, all input and output is done by reading or writing
    files, because all peripheral devices, every keyboard and screen, are files in
    the file system. This means that a single homogeneous interface handles communication
    between a program and peripheral devices.


    In the most general case, before you read and write a file, you must inform the
    system to do so, a process called opening the file. If you are writing to a file
    it may also be necessary to create it or discard its contents. The system checks
    your you to do so (Does the file exist? Do you have permission to access it?)
    and if all is well, returns to the program a small non-negative integer called
    a file descriptor. Whenever input or output is done on the file, the file descriptor
    is used instead of the name to identify the file. (A file descriptor is analogous
    to the file pointer used by the standard library, or to the file handle of MS-DOS.)
    All information about an open file is maintained by the system; the user program
    refers to the file only by the descriptor


    Since input and output involving keyboard and screen is so common, special arrangements
    exist to make this convenient. When the command interpreter (`shell`) runs a program,
    three files are open, with descriptors 0, 1, and 2, called the standard input,
    the standard output, and the standard error. If a program reads 0 and writes 1
    and 2, it can do input and output without worrying about opening files.


    The user of a program can redirect I/O to and from files with < >:


    ```

    prog <infile >outfile

    ```'
