  md: '# 1.5 Character Input and Output


    We are going to consider a family of related programs for processing data. You
    will find that many programs are just expanded versions of the prototypes that
    we discuss here.


    The model of input and output supported by the standard library is very simple.
    Text input or output, regardless of where it originates or where it goes, is dealt
    with as streams of characters. A text stream is a sequence of characters divided
    into lines; each line consists of zero or more characters followed by a newline
    character. It is the responsibility of the library to make each input or output
    conform to this model; the C programmer will not need worry about how lines are
    represented on the screen.


    The standard library provides several functions for reading or writing one character
    at a time, of which getchar and putchar are simple. Each time it is called, getchar
    reads the next input from a text stream and returns it as its value. That is,
    after


    ```

    c = getchar();

    ```


    the variable c contains the next character of input. The characters normally come
    from the keyboard; input from files is discussed in Chapter 7.


    The function putchar prints a character each time it is called:


    ```

    putchar(c);

    prints the contents of the integer value c as a character, usually on the screen.
    Calls

    and printf may be interleaved; the output will appear in the order in which the
    calls

    are made.

    ```


    # 1.5 File Copying


    Given getchar and putchar, you can write a surprising amount of useful code without
    knowing anything more about input and output. The simplest example is a program
    that copies its input to its output one character at a time:


    ```

    read a character

    while (charater is not end-of-file indicator)

    output the character just read

    read a character

    ```


    Converting this into C gives:


    ```

    #include <stdio.h>

    /* copy input to output; 1st version */

    main()

    {

    int c;

    c = getchar();

    while (c != EOF) {

    putchar(c);

    c = getchar();

    }

    }

    ```


    The relational operator != means ``not equal to".'
