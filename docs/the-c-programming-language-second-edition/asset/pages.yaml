  md: "# # Chapter 1 - A Tutorial Introduction\n\nLet us begin with a quick introduction\
    \ in C. Our aim is to show the essential elements of the language in real programs,\
    \ but without getting bogged down in details, rules, and exceptions. At this point,\
    \ we are not trying to be complete or even precise (save that the examples are\
    \ meant to be correct). We want to get as quickly as possible to the point where\
    \ you can write useful programs, and to do that we have to concentrate on the\
    \ basics: variables and constants, arithmetic, control flow, functions, and the\
    \ rudiments of input and output. We are intentionally leaving out features of\
    \ C that are important for writing better programs. include pointers, structures,\
    \ most of C's rich set of operators, several control-flow statements, and the\
    \ standard library.\n\nThis approach and its drawbacks. Most notable is that the\
    \ complete story on any particular feature is not found here, and the tutorial,\
    \ by being brief, may also be misleading. because the examples do not use the\
    \ full power of C, they are not as concise and elegant as they might be. We have\
    \ tried to minimize these effects, but are warned. Another drawback is that later\
    \ chapters will necessarily repeat some of this. We hope that the repetition will\
    \ help you more than it annoys.\n\nIn any case, experienced programmers should\
    \ be able to extrapolate from the material in this chapter to their own programming\
    \ needs. Beginners should supplement it by writing small, similar programs of\
    \ their own. Both groups can use it as a framework on which to hang the more detailed\
    \ descriptions that begin in Chapter 2.\n\n# ## 1.1 Getting Started\n\nThe only\
    \ way to learn a new programming language is by writing programs in it. The first\
    \ program to write it is the same for all languages:\n\n*Print the words*\n\n\
    hello, world\n\nThis is a big hurdle; to leap over it you have to be able to create\
    \ the program text somewhere, compile it successfully, run it, and find out where\
    \ your output went. With these mechanical details mastered, everything else comes\
    \ easily.\n\nIn C, the program to print `hello, world`\n\n```\n#include <stdio.h>\n\
    main() {\n    printf(\"hello, world\\n\");\n}\n```\n\nJust how to run this depends\
    \ on the system you are using. As a specific example, on the UNIX operating system\
    \ you must create the program in a file whose name ends in `.c`, such as `hello.c`,\
    \ then compile it with the command\n\n```\ncc hello.c\n```"
  merge: -1
  pgno: 8
- img_proc: true
  md: "If you haven't botched anything, as omitting a character or misspelling something,\
    \ the compilation will proceed silently, and make an executable file called a.out.\
    \ If you run a.out by typing the command\n\n```\na.out\nit will print\n```\n\n\
    hello, world\nOn systems, the rules will be different; check with a local expert.\n\
    \nNow, for some explanations about the program itself. A C program, whatever its\
    \ size, consists of functions and variables. A function contains statements that\
    \ specify the computing operations to be done, and variables store value during\
    \ the computation. C functions are the subroutines and procedures in Fortran or\
    \ the procedures and functions of Pascal. One example is a function main. Normally\
    \ you are at liberty to give functions whatever names you like, but `main` is\
    \ special - your program begins executing at the beginning of main. This means\
    \ every program must have a main somewhere.\n\nmain will usually call other functions\
    \ to perform its job, some that you write, and others from libraries are provided\
    \ for you. The first line of the program,\n\n```\n#include <stdio.h>\ntells the\
    \ compiler to include information about the standard input/output library; the\
    \ line appears at the beginning of many C source files. The standard library is\
    \ described in Appendix 7 and Appendix B.\n```\n\nOne method of communicating\
    \ data between functions is for the calling function to provide a list of values,\
    \ called arguments, to the function it calls. The parentheses after the function\
    \ name around the list. In this example, main is defined to be a function that\
    \ expects no arguments, which is indicated by the empty list ().\n\n```\n#include\
    \ <stdio.h>\ninclude information about standard\nmain() {\n\tprintf(\"hello, world\\\
    n\");\n}\n```\n\n# The first C program\n\nThe statements of a function are enclosed\
    \ in braces { }. The main function contains only one statement,\n\n```\nprintf(\"\
    hello, world\\n\");\n```"
  merge: -1
  pgno: 9
- img_proc: true
  md: "A function is called by naming it, followed by a parenthesized list of arguments,\
    \ so this calls the function printf with the argument \"hello, world\\n\". printf\
    \ is a library function that prints output, in this case the string of characters\
    \ between the quotes.\n\nA sequence of characters in double quotes, like \"hello,\
    \ world\\n\", is called a character or string constant. Our only use of character\
    \ strings will be as arguments for printf and other functions.\n\nThe sequence\
    \ \\n in the string is C for the newline character, when printed advances the\
    \ output to the left margin on the next line. If you leave out the \\n (a worthwhile\
    \ experiment), you will find that there is no line advance after the output is\
    \ printed. You use \\n to include a newline character in the printf argument;\
    \ if you try something like\n\n```\nprintf(\"hello, world\\n\");nThe C compiler\
    \ will produce an error message.\n```\n\nprintf never supplies a newline character\
    \ automatically, so several calls may be used to build up an output line in stages.\
    \ Our first program could just as well been written\n\n```\n#include <stdio.h>\n\
    \nmain() {\n    printf(\"hello, \");\n    printf(\"world\");\n    printf(\"\\\
    n\");\n}\nto produce identical output.\n```\n\nNotice that \\n represents only\
    \ a single character. An escape sequence \\n provides a general and extensible\
    \ mechanism for representing hard-to-type or invisible characters. Among the others\
    \ that C provide are \\t for tab, \\b for backspace, \\\" for the double quote\
    \ and \\\\ for the backslash itself. There is a complete list in Section 2.3.\n\
    \nExercise 1-1. Run the \"hello, world\" program on your system. Experiment with\
    \ leaving parts of the program, to see what error messages you get.\n\nExercise\
    \ 1-2. Experiment to find out what happens when printf's argument contains c,\
    \ where c is some character not listed above.\n\n# 1.2 Variables and Arithmetic\
    \ Expressions\n\nThe next program uses the formula °=(5/9)(°F-32) to print the\
    \ following table of Fahrenheit temperatures and their centigrade or Celsius equivalents:"
  merge: -1
  pgno: 10
- img_proc: true
  md: "12\n\n```\n1 -17\n20 -6\n40 4\n60 15\n80 26\n100 37\n120 48\n140 60\n160 71\n\
    180 82\n200 93\n220 104\n240 115\n260 126\n280 137\n300 148\n```\n\nThe program\
    \ itself consists of the definition of a single function named main. It is longer\
    \ than the one that printed ``hello, world`` but not complicated. It introduces\
    \ several new ideas, including comments, declarations, variables, arithmetic expressions,\
    \ loops , and formatted output.\n\n```\n#include <stdio.h>\n\n/* print Fahrenheit-Celsius\
    \ table\nfor f = 0, 20, ..., 300 */\nmain() {\n    int fahr, celsius;\n    int\
    \ lower, upper, step;\n\n    lower = 0;      /* lower limit of temperature scale\
    \ */\n    upper = 300;    /* upper limit */\n    step = 20;      /* step size\
    \ */\n\n    fahr = lower;\n    while (fahr <= upper) {\n        celsius = 5 *\
    \ (fahr-32) / 9;\n        printf(\"%d%t\\dn\\n\", fahr, celsius);\n        fahr\
    \ = fahr + step;\n    }\n}\n```\n\nThe two lines\n\n/ print Fahrenheit-Celsius\
    \ table\nfor fahr = 0, 20, ..., 300 */\nare a comment, which fairly explains what\
    \ the program does. Any characters between /* and */ are ignored by the compiler;\
    \ they may be used freely to make a program easier to understand. Comments may\
    \ appear anywhere a blank, or newline can.\n\nIn C, all variables must be declared\
    \ before they are used, at the beginning of the function before any executable\
    \ statements. A declaration announces the properties of variables; it consists\
    \ of a name and a list of variables, such as\n\n```\nint fahr, celsius;\nint lower,\
    \ upper, step;\nThe type int means that the variables listed are integers; by\
