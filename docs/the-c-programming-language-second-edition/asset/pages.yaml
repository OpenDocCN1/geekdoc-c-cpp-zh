  md: "What appears to be a character on the keyboard or screen is of course, like\
    \ everything else, stored internally just as a bit pattern. The type char is specifically\
    \ meant for storing such data, but any integer type can be used. We use int for\
    \ a subtle but important reason.\n\nThe problem is distinguishing the end of input\
    \ from valid data. The solution is that getchar returns a distinctive value when\
    \ there is no more, a value that cannot be confused with any real character. This\
    \ value is called EOF, for 'end of file'. We must declare c to be a big enough\
    \ to hold any value that getchar returns. We cannot use char since c must be big\
    \ enough to hold EOF in addition to any possible char. Therefore we use int.\n\
    \nEOF is an integer defined in <stdio.h>, but the specific value doesn't matter\
    \ as long as it is not the same as any char value. By using the symbolic constant,\
    \ we are assured that nothing in the program depends on the specific value.\n\n\
    The program for copying would be written more concisely by experienced C programmers.\
    \ In C, any assignment, such as\n\n```\nc = getchar();\nis an expression and has\
    \ a value, since it is the value of the left hand side after the assignment. This\
    \ means that an assignment can appear as part of a larger expression. If the assignment\
    \ of a character to c is put inside the test part of a loop, the copy program\
    \ can be written this way:\n```\n\n```\n#include <stdio.h>\n/* copy input to output;\
    \ 2nd version */\nmain() {\n    int c;\n    while ((c = getchar()) != EOF)\n \
    \       putchar(c);\n}\n```\n\nThe while gets a character, assigns it to c, and\
    \ then tests whether the character was the end-of-file signal. If it was not,\
    \ the body of the while is executed, printing the character. The while repeats.\
    \ When the end of the input is finally reached, the while terminates and does\
    \ main.\n\nThis version centralizes the input - there is only one reference to\
    \ getchar - shrinks the program. The resulting program is more compact, and once\
    \ mastered, is easier to read. You'll see this style often. (It's possible to\
    \ get ahead and create impenetrable code, however a tendency that we try to curb.)\n\
    \nThe parentheses around the assignment, within the condition are necessary. The\
    \ precedence of != is higher than that of =, which means that in the absence of\
    \ parentheses the test ! would be done before the assignment =. So the statement\n\
    \n```\nc = getchar() != EOF\nis equivalent to\nnc = (getchar()) != EOF\n```"
