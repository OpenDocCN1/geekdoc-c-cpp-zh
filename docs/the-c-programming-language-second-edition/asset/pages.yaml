  md: '# 7.2 Formatted Output - printf


    The output function printf translates internal values to characters. We have used
    printf informally in previous chapters. The description here covers most typical
    uses but is not complete; for the full story, see Appendix B.


    ```

    int printf(char *format, int arg1, arg2, ...);

    printf converts, and prints its arguments on the standard output under control
    of

    format. It returns the number of characters printed.

    ```


    The format string contains two types of objects: ordinary characters, which are
    copied to

    t output stream, and conversion specifications, each of which causes conversion
    and printing of

    t next successive argument to printf. Each conversion specification begins with
    a %

    ends with a conversion character. Between the % and the conversion character there
    may be,

    in order:


    +   - A minus sign, which specifies left adjustment of the converted argument.

    - A number that specifies the minimum field width. The converted argument will
    be

    printed in a field of at least this wide. If necessary it will be padded on the
    left (or right,

    left adjustment is called for) to make up the field width.

    - A period, which separates the field width from precision.

    - A number, the precision, that specifies the maximum number of characters to
    be

    printed from a string, or the number of digits after the decimal point of a floating-point

    value, or the minimum number of digits for an integer.

    - An h if the integer is to be printed as a short, or l (letter ell) if as a long.


    Conversion characters are shown in Table 7.1. If the character after the % is
    not a conversion

    specification, the behavior is undefined.


    # Table 7.1 Basic Prinf Conversions


    | Character | Argument type; Printed As |

    |---|---|

    | d, I | int; decimal number |

    | o | int; unsigned character (without a leading zero) |

    | x, X | int; unsigned hexadecimal character (without a leading 0x or 0X), using
    abcdef for 10, ...,15. |

    | u | int; unsigned decimal number |

    | c | int; single character |

    | s | char *; print characters from the string until a ''\0'' or the number of
    characters given by the precision. |

    | f | double; [-]m.ddddd, where the number of ds is given by the precision (default
    6). |

    | e, E | double; [-]m.ddddde/+xx or [-]m.ddddde+/-xx, where the number of ds is
    given by the precision (default 6). |

    | g, G | double; use %e or %E if the exponent is less than -4 or greater or equal
    to the precision; otherwise use %f. Trailing zeros and a trailing decimal point
    are not printed. |

    | p | void *; pointer (implementation-dependent representation). |'
