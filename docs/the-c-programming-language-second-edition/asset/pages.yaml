    \n\nmain() /* copy input to output */\n{\n\tchar buf[BUFSIZE];\n\tint n;\n\n\t\
    while ((n = read(0, buf, BUFSIZE)) > 0)\n\ttwrite(1, buf, n);\n}\n```\n\nWe collected\
    \ function prototypes for the system into a file syscall.h so we can include it\
