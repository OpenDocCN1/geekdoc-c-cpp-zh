    \ are compared, rather than adjacent ones in simpler interchange sorts. This eliminates\
    \ large amounts of disorder quickly, so later stages have less work to do. The\
    \ interval between compared elements is gradually decreased to one, at which point\
    \ the sort effectively becomes an adjacent interchange method.\n\n```\n/* shellsort:\
    \ sort v[0]...v[n-1] into increasing order */\nvoid shellsort(int v[], int n)\n\
    ```"
