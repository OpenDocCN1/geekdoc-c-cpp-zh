  md: "It is sometimes convenient to be able to exit a loop other than by testing\
    \ at the top or bottom. The break statement provides an early exit from for, while,\
    \ and do, just as from switch. A break causes the innermost enclosing loop or\
    \ switch to be executed immediately.\n\nThe following function, trim, removes\
    \ trailing blanks, tabs and newlines from the end of a string, using a break to\
    \ exit a loop when the rightmost non-blank, non-tab, non-newline is found.\n\n\
    ```\n/* trim: remove trailing blanks, tabs, newlines */\nint trim(char s[])\n\
    {\n    int n;\n    for (n = strlen(s)-1; n >= 0; n--)\n        if (s[n] != ' '\
    \ && s[n] != '\\\\n')\n            break;\n    s[n+1] = '\\0';\n    return n;\n\
    }\n```\n\nstrlen returns the length of the string. The loop starts at the end\
    \ and scans backwards looking for the first character that is not a blank or tab.\
    \ The loop is broken when one is found, or when n becomes negative (that is, the\
    \ entire string has been scanned). You should verify that this is correct even\
    \ when the string is empty or contains only white space characters.\n\nThe continue\
    \ statement is related to break, but less often used; it causes the next iteration\
    \ of the enclosing loop. for, while, or do to loop. In the while and do, this\
    \ means that the test is executed immediately; in the for, control passes to the\
    \ increment step. The continue statement applies only to loops, not to switch.\
    \ A continue inside a switch inside a loop causes the next loop iteration.\n\n\
