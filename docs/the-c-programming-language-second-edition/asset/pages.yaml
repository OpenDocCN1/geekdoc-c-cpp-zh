  md: '# Appendix C - Summary of Changes


    Since the publication of the first edition of this book, the definition of the
    C language has undergone changes. Almost all extensions of the original language,
    and were carefully designed to remain compatible with existing practice; some
    ambiguities in the original description; and some represent modifications that
    change existing practice. Many of the new facilities were adopted by AT&T, and
    have subsequently been adopted by other suppliers of C compilers. Many recently,
    the ANSI committee standardized the language incorporated most of the changes,
    and also introduced significant modifications. Their report was in part participated
    by some commercial compilers even before issuance of the C standard.


    This Appendix summarizes the differences between the language defined by the first
    edition of this book, and expected to be defined by the final standard. It treats
    only the language itself, although these are important part of the standard, there
    is little to compare with, because the first edition did not attempt to prescribe
    an environment or library.


    +   - Preprocessing is more carefully defined in the Standard than the first edition,
    and is extended; it explicitly tokens; there are new operators for concatenation
    of tokens (##), and declaration of strings (#); there are control lines like #elif
    and #pragma; redeclaration of the same token sequence is explicitly permitted;
    parameters are no longer replaced. Splicing of lines by \ is permitted everywhere,
    not just in strings and macro definitions. Par.A.12.

    - The minimum significance of all identifiers introduced to 31 characters; the
    smallest magnified of identifiers with external linkage remains 6 lowercase letters.
    (Many implementations provide more.)

    - Trigraph sequences introduced by ?? represent characters of lettering in some
    character sets. Escapes for ^\|[]|~ are defined, Par.A.12.1. Observe that the
    introduction of trigraph may change the meaning of strings containing the sequence
    ??.

    - New keywords (void, const, volatile, signed, enum) are introduced. The therein
    keyword is withdrawn.

    - New escape sequences, for use within character constants and string literals,
    are defined. The effect of \ by a character not part of an escape sequence is
    undefined. Par.A.2.5.

    - Everyone''s favorite true: 8 is not oct.

    - The standard introduces a larger set of suffixes to make the type of constants
    explicit: U for integers, F or L for floating. It also refines the rules for the
    type of unsixed constants (Par.A.2).

    - Adjacent string literals are concatenated there is no notation for wide-character
    string literals and character constants; see Par.A.2.

    - Characters as other types, may be explicitly declared to carry, or not to carry,
    a sign by using the keywords signed or unsigned. The location long float as a
    synonym for double is withdrawn, but long double may be used to declare an extra-precision
    quantity.

    - For some time, type unsigned char has been available. The standard introduces
    the signed keyword to make signedness explicit for char and other integral objects.'
