    described in Chapter 2.


    Certain idioms appear frequently:


    ```

    flags |= EXTERNAL | STATIC;

    turns on the EXTERNAL and STATIC bits in flags, while

    ```


    ```

    flags &= ~(EXTERNAL | STATIC);

    turns them off,

    if ((flags & STATIC)) == 0) ...

    ```


    Although these idioms are readily mastered, an alternative C offers the capability
    of defining and accessing fields within a word directly rather than by bitwise
    operators. A bit-field, or field, is a set of adjacent bits within a single implementation-defined
    storage unit that can be called a “word.” For example, the symbol table #defines
    above could be replaced by the definition of three fields:


    ```

    struct {

    unsigned int is_keyword = 1;

    unsigned int is_extern = 1;

    unsigned int is_static = 1;

    } flags;

    ```


    This defines a variable called flags that contains three 1-bit fields. The following
    column represents the field width in bits. The fields are declared unsigned int
    to ensure they are unsigned quantities.


    Individual fields are referenced in the same way as other structure members: flags.is_keyword,
    flags.is_extern, etc. Fields behave like small integers, and may participate in
    arithmetic expressions like other integers. The previous examples may be written
    more naturally as


    ```

    flags.is_extern = flags.is_static = 1;

    turn to the bits on,

    flags.is_extern = flags.is_static = 0;

    turn them off, and

    if (flags.is_extern == 0 && flags.is_static == 0)

    ...

    to test them.

    ```


    Almost everything about fields is implementation-dependent. Whether a field may
    overlap a word boundary not be names; unnamed fields (a colon and width only)
    are used for padding. The special width 0 may be used to force alignment at the
    next word boundary.'
