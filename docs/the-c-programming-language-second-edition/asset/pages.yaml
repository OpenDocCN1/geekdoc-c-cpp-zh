  md: 'The variables named in a structure are called members. A structure member or
    tag and an ordinary (i.e., non-member) variable can have the same name without
    conflict, since they can always be distinguished by context. Furthermore, the
    same member names may occur in different structures, although as a matter of style
    one would normally use the same names for closely related objects.


    A struct declaration declaration defines a type. The right brace that terminates
    the list of members may be followed by a list of variables, just as for any basic
    type. That is,


    ```

    struct { ... } X, y, z;

    syntactically analogous to

    ```


    int X, y, z;

    in the sense that each statement declares x, y and z to be variables of the named
    type and causes space to be set aside for.


    A structure declaration is not followed by a list of variables reserves storage;
    it merely describes a template or shape of a structure. If the declaration is
    tagged, however, the tag can be used in later definitions of instances of the
    structure. For example, given the declaration of point above,


    ```

    struct point pt;

    defines a variable pt which is of structure type struct point. A structure can
    be initialized by its following definition with a list of initializers, a constant
    expression, for the members:

    ```


    ```

    struct maxpt = { 320, 200 };

    an automatic structure may also be initialized by assignment or by calling a function
    that returns a structure of the right type.

    ```


    A form of a particular structure is referred to in an expression by a construction
    of the form


    ```

    structure-name.member

    ```


    The structure member operator `.` connects the structure name and the member name.
    It prints the coordinates of the point pt, for instance,


    ```

    printf("%d,%d", pt.x, pt.y);

    or to compute the distance from the origin (0,0) to pt,

    ```


    ```

    double dist, sqrt(double);

    dist = sqrt((double)pt.x * pt.x + (double)pt.y * pt.y);

    ```


    Structures can be nested. One representation of a rectangle is a pair of points
    that denote the diagonally opposite corners:'
