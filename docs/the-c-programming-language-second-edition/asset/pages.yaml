  md: "Most of the work done in the body of the loop. The Celsius temperature is computed\
    \ and assigned to the variable celsius the statement\n\n```\ncelsius = 5 * (fahr-32)\
    \ / 9;\n```\n\nThe reason for multiplying by 5 and dividing by 9 instead of just\
    \ multiplying by 5/9 is that in C, as many other languages, integer division truncates\
    \ any fractional part is discarded. Since 5 and 9 are integers, 5/9 would be truncated\
    \ to zero and all the Celsius temperatures would be reported as zero.\n\nThis\
    \ example shows a bit more of how printf works. printf is we will describe in\
    \ detail Chapter 7. Its first argument is a string of characters to be printed,\
    \ with each % indicating where one of the other (second, third, ...) arguments\
    \ is to be substituted, and what it is for to be printed. For %d specifies an\
    \ integer argument, the statement\n\n```\nprintf(\"%d\\t%d\\n\", fahr, celsius);\n\
    ```\n\ncauses the values of the two integers fahr and celsius to be printed, with\
    \ a tab (\t) between them.\n\nEach % in the first argument of printf is paired\
    \ with the corresponding second argument, etc.; they must match up by number and\
    \ type, or you will get wrong answers.\n\nBy the way, printf is not part of the\
    \ C language; there is no input or output defined in itself. printf is just a\
    \ useful function from the standard library of functions that are accessible to\
    \ C programs. The behaviour of printf is defined in the ANSI standard, however,\
    \ so properties should be the same with any compiler and library that conforms\
    \ to the standard.\n\nIn order to concentrate on C itself, we don't talk much\
    \ about input and output until chapter 7. In particular, we will defer formatted\
    \ input until then. scanf if you have to input numbers, the discussion of the\
    \ function scanf in Section 7.4, is like printf, except that it reads input instead\
    \ of writing output.\n\nThere are a couple of problems with the temperature conversion\
    \ program. The simpler one is that the output isn't pretty because the numbers\
    \ are not right-justified. That's easy to fix; if we each % in the printf statement\
    \ with a width, the numbers will be right-justified in their fields. In instance,\
    \ we might\n\n```\nprintf(\"%3d %d\\n\", fahr, celsius);\n```\n\nto print the\
    \ first number of each line in field three digits wide, and the second in field\
    \ six digits wide, like this:\n\n```\n0 -17\n20 -6\n40 4\n60 15\n80 26\n100 37\n\
    ```"
