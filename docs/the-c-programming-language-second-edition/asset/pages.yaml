    * How are declarations arranged so all the pieces are properly connected the program
    is loaded?

    * How are declarations organized so there is only one copy?

    * How are external variables initialized?


    Let us discuss these topics by reorganizing the calculator program into several
    files. As a practical matter, the calculator is too small to worth splitting,
    but it is a fine illustration of the issues that arise in large programs.


    The scope of a name is part of the program which can be used. For an automatic
    variable declared at the beginning of a function, the scope is the function which
    the name is declared. Local variables of the same name in different functions
    are unrelated. The same is true of the parameters of the function, which are in
    effect local variables.


    The scope of an external variable or a function lasts from the point at which
    it is declared to the end of the file being compiled. For example, if main, sp,
    val, push, and pop are defined in one file, in the order shown above, that is,


    ```

    main() { ... }


