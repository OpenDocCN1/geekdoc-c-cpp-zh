  md: "Each case is labeled by one or more integer-valued constants or constant expressions.\
    \ If a case matches the expression value, execution starts at that case. All cases\
    \ must be different. The default case is executed if none of the other cases are\
    \ satisfied. A default is optional; if it isn't there and none of the cases match,\
    \ no action takes place. Cases and the default clause can cause no conflict in\
    \ order.\n\nIn Chapter 1 we wrote a program to count the occurrences of each digit,\
    \ white space, and all other characters, using a sequence of if ... else if ...\
    \ else the same. Here is the program with a switch:\n\n```\n#include <stdio.h>\n\
    \nmain()    /* count digits, white space, others */\n{\n    int c, i, nwhite,\
    \ neither, ndigit[10];\n    nwhite = 0;\n    for (i = 0; i < 10; i++)\n      \
    \  ndigit[i] = 0;\n    while ((c = getchar()) != EOF) {\n        switch (c) {\n\
    \            case '1': case '2': case '3': case '4':\n            case '5': case\
    \ '6': case '7': case '8': case '9':\n                ndigit[c-'0']++;\n     \
    \           break;\n            case ' ':\n            case '\\n':\n         \
    \   case '\\t':\n                nwhite++;\n                break;\n         \
    \   default:\n                neither++;\n                break;\n        }\n\
    \    }\n    printf(\"digits=%d\", ndigit[i]); // error fixed\n    for (i = 0;\
    \ i < 10; i++)\n        printf(\"white space %d, other = %d\\n\", nwhite, neither);\n\
    \    return 0;\n}\n```\n\nThe break statement causes an immediate exit from the\
    \ switch. Because cases serve just as labels, the code for one case executes,\
    \ falls through to the next one unless you take explicit action to escape. break\
    \ and return are the most common ways to leave a switch. A break statement can\
    \ be used to force an immediate exit from while, for, and do loops, as will be\
    \ discussed later in this chapter.\n\nFalling through is a blessing. On one hand\
    \ it allows several cases to be attached to a single action, as the digits in\
    \ this example. But it also implies that normally each case must end with a break\
    \ to prevent falling through the next. Falling from one case to another is not\
    \ robust, but prone to disintegration when the program is modified. With the exception\
    \ of multiple labels for a single computation, fall-throughs should be used sparingly\
    \ and carefully."
