    \ output associated with a pipe. In all cases, the file assignments are changed\
    \ by the shell, not by the program. The program does not know where its input\
    \ comes from or where its output goes, so long as it uses 0 for input and 1 for\
    \ output\n\n# 8.2 Low Level I/O - Read and Write\n\nInput and output use the read\
    \ and write system calls, which are accessed from C programs through two functions\
    \ called read and write. For both, the first argument is a file descriptor. The\
    \ second argument is an array in program where the data is to go to or come from.\
    \ The third argument is the number of bytes to be transferred.\n\n```\nint n_read\
    \ = read(int fd, char *buf, int n);\nint n_write = write(int fd, char *buf, int\
    \ n);\nEach call returns a number of bytes returned. On reading, the number of\
    \ bytes returned may be less than the number requested. A return value of zero\
    \ implies end of file, and -1 indicates an error of some sort. For writing, the\
    \ return value is the number of bytes written; an error has occurred if it is\
    \ not equal to the number requested.\n```\n\nAny number of bytes can be read or\
    \ written in one case. The most common values are 1, which means one character\
    \ at a time (`buffered`), and a number 1024 or 4096 corresponds to a physical\
    \ block size on a peripheral device. Larger sizes will be more efficient fewer\
    \ system calls will be made.\n\nPutting these factors together, we can write a\
    \ simple program to copy its input to its output, the equivalent of the file copying\
