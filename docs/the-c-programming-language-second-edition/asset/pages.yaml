  md: "is done once, before the loop proper is entered. The second part is the\ntest\
    \ or condition that controls the loop:\n\n```\nfahr <= 300\n```\n\nThis condition\
    \ is evaluated; if it is true, the body of the loop (here a single ptintf)\nexecuted.\
    \ Then the increment step\n\n```\nfahr = fahr + 20\n```\n\nis executed, and the\
    \ condition re-evaluated. The loop terminates if the condition has become\nfalse.\
    \ As with the while, the body of the loop can be a single statement or a group\
    \ of\nstatements in braces. The initialization, condition and increment can be\n\
    expressions.\n\nThe choice between while and for is arbitrary, based on which\
    \ seems clearer. The for\nusually appropriate for loops in which the initialization\
    \ and increment are single statements\nand logically linked, since it is more\
    \ compact than while and it keeps the loop control\nstogether in one place.\n\n\
    Exercise 1-5. Modify the conversion program to print the table in reverse order,\n\
    that is, from 300 degrees to 0.\n\n# 1.4 Symbolic Constants\n\nA magic observation\
    \ before we leave temperature forever. It's bad practice to bury\n`magic numbers`\
    \ like 300 and 20 in a program; they convey little to someone\nwho might have\
    \ to read the program later, and they are hard to change in a systematic way.\n\
    One way to deal with magic numbers is to give them meaningful names. A #define\
    \ line\ndefines a symbolic name or symbolic constant to be a particular string\
    \ of characters:\n\n```\n#define name replacement list\n```\n\nTherefore, any\
    \ occurrence of name (not in quotes and not part of any name) will be\nreplaced\
    \ by the corresponding replacement text. The name has the form as a variable\n\
    name: a sequence of letters and digits that begins with a letter. The replacement\
    \ text can be\nai sequence of characters; it is not limited to numbers.\n\n```\n\
    #include <stdio.h>\n\n#define LOWER 0   /* lower limit of table */\n#define UPPER\
    \ 300 /* upper limit */\n#define STEP 20    /* step size */\n\n/* print Fahrenheit-Celsius\
    \ table */\nmain()\n{\n  int fahr;\n\n  for (fahr = LOWER; fahr <= UPPER; fahr\
    \ = fahr + STEP)\n    printf(\"%3d %.1f\\n\", fahr, (5.0/9.0)*(fahr-32));\n}\n\
    ```\n\nThe quantities LOWER, UPPER and STEP are symbolic constants, so they do\
    \ not\nappear in declarations. Symbolic constants are conventionally written in\
    \ upper case so\nthey can be readily distinguished from lower case variable names.\
    \ Notice that there is no\nicolon at the end of a #define line."
