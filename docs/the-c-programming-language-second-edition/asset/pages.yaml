    There are two storage classes: automatic and static. Several keywords, together
    with the context of an object''s declaration, specify its storage class. Automatic
    objects are local to a block (Par.9.3), and are discarded on exit from the block.
    Declarations create automatic objects if no storage class is mentioned, or if
    the auto specifier is used. Objects declared register are automatic, and (if possible)
    stored in fast registers of the machine.


    Static objects may be local to a block or external to all blocks, but in either
    case they retain their values across exit from reantry to functions and blocks.
    Within a block, including a block that provides the code for a function, static
    objects are declared with the keyword static. The objects declared outside blocks
    are, at the same level as functions, are always static. They may be made local
    to a particular translation unit by use of the static keyword; gives them internal
    linkage. They become global to an entire program by omitting this storage class,
    or by using the keyword extern; this gives them external.


    # A.4.2 Basic Types


    There are several fundamental types. The standard header <limits.h> described
    in Appendix B defines the largest and smallest values of each type in the local
    implementation. The numbers given in Appendix B show the acceptable magnitudes.


    Objects declared as characters (char) are large enough to store any member of
    the character set. If a genuine character that is stored in a char object, its
    value is equivalent to the integer code for the character, and non-negative. Other
    quantities may be stored into char variables, but the available range of values,
    and especially whether the value is signed, is implementation-dependent.


    Unsigned characters unsigned char consume the same amount of space as plain characters,
    but always appear non-negative; explicitly signed characters declared signed likewise
    take the same space as plain characters.


    unsigned char type does not appear in the first edition of this book, but is in
    common use. signed char is new.


    Besides the char types, to three sizes of integer, declared short int, and long
    int, are available. Plain int objects have the natural size suggested by the host
    machine architecture; other sets are provided to meet more needs. Longer integers
    provide as much storage as shorter ones, but the implementation may make plain
    integers equivalent to either short integers, or long integers. The int types
    represent signed values unless specified otherwise.


    Unsigned integers, declared using the keyword unsigned, obey the laws of arithmetic
    modulo 2^n where n is the number of bits in the representation, and arithmetic
    on unsigned quantities can never overflow. The set of non-negative values that
    can be stored in a signed object is a subset of the values that can be stored
    in the corresponding unsigned object, and the representation for the overlapping
    values is the same.


    Any of single precision floating point (float), double precision floating point
    (double), and extra precision floating point (long double) may be synonymous,
    but the ones later in the list are at least as precise as those before.'
