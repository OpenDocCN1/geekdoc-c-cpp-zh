  md: "The escape sequences used in string constants are also legal in character constants,\
    \ so '\\\\n'\nstands for the value of the newline character, which is 10 in ASCII.\
    \ You should note carefully\nthat '\\\\n' is a single character, and in expressions\
    \ is an integer; on the other hand, '\\\\n' is\na string constant that happens\
    \ to contain only one character. The topic of strings versus\ncharacters is discussed\
    \ further in Chapter 2.\n\n# Exercise 1-9. Write a program to count blanks, tabs,\
    \ and newlines.\n\nExercise 1-9. Write a program to copy its input to its output,\
    \ replacing each string of one\nmore by a single blank.\n\nExercise 1-10. Write\
    \ a program to copy its input to its output, replacing each tab by \\t, each\n\
    backspace by \\b, and each backslash by \\\\. This makes tabs and backspaces visible\
    \ in\nunambiguous way.\n\n# 1.5.4 Word Counting\n\nThe fourth in our series of\
    \ useful programs counts lines, words, and characters, with the loose\ndefinition\
    \ that a word is any sequence of characters that does not contain a blank, tab\
    \ or\nnewline. This is a bare-bones version of the UNIX program wc.\n\n```\n#include\
    \ <stdio.h>\n\n#define IN  1 /* inside a word */\n#define OUT 0 /* outside a word\
    \ */\n\n/* count lines, words, and characters in input */\nmain() {\n    int c,\
    \ nl, nw, nc, state;\n    state = OUT;\n    nl = nw = nc = 0;\n    while ((c =\
    \ getchar()) != EOF) {\n        ++nc;\n        if (c == '\\n') {\n           \
    \ ++nl;\n        }\n        if (c == ' ' || c == '\\t') {\n            state =\
    \ OUT;\n        } else if (state == OUT) {\n            state = IN;\n        \
    \    ++nw;\n        }\n    }\n    printf(\"%d %d %d %d\\n\", nl, nw, nc, state);\n\
    }\n```\n\nEvery time the program encounters the first character of a word, it\
    \ counts one more word. The\nvariable state records whether a program is currently\
    \ in a word or not; initially it is `not` in\na word, which is assigned the value\
    \ OUT. We prefer the symbolic constants IN and OUT to the\nliterals 1 and 0 because\
    \ they make the program more readable. In a program as tiny as\nthis, it makes\
    \ little difference, but in larger programs, the increase in clarity is worth\
    \ the\nmodest extra effort to write it this way from the beginning. You'll also\
    \ find that it's easier to\nmake extensive changes where numbers appear only as\
    \ symbolic\nconstants."
