    A character constant is an integer, written as one character within single quotes,
    such as ''x''. The value of a character constant is the numeric value of the character
    in the machine''s character set. For example, in the ASCII character set the character
    constant ''0'' has the value 48, if we use ''0'' instead of a numeric value 48
    that depends on the character the program is independent of the particular value
    and easier to read. Character constants participate in numeric operations just
    any other integers, although they are most used in comparisons with other characters.


    Certain characters can be represented by character and string constants by escape
    sequences \n (newline); these sequences look like two characters, but represent
    only one. In addition, an arbitrary byte-sized bit can be specified by


    \ooo''

    where ooo is to three octal digits (0...7) or by


    \xh''

    where hh is one or hexadecimal digits (0...9, a...f, A...F). So we might write


    ```

    #define VTAB ''\013''    /* ASCII vertical tab */

    #define BELL ''\007''   /* ASCII bell character */

    ```


    ```

    #define VTAB ''\xb''     /* ASCII vertical tab */

    #define BELL ''\x?''     /* ASCII bell character */

    ```


    The complete set of escape sequences is


    | \a alert (bell) character | \ \

    | --- | --- |

    | \b backspace | ? |

    | \f form | '' single quote |

    | \n newline | " double quote |

    | \r carriage return | \ooo octal number |

    | \t horizontal | \xh hexadecimal number |

    | \v vertical tab |


    The character constant ''\0'' represents the character with value zero, the null
    character. ''\0'' is often written instead of 0 to emphasize the character nature
    of some expression, but the numeric value is 0.


    A constant expression is an expression that involves constants. Such expressions
    may be evaluated during compilation rather than run-time, and accordingly may
    be used in any place that a constant can occur, as in


    ```

