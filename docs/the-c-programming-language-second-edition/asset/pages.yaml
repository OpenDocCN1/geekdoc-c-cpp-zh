    # A.6.1 Integral Promotion


    A short integer, or an integer bit-field, all either signed or not, or an object
    of enumeration type, may be used in an expression wherever an integer may be used.
    If an int can represent all the values of the original type, then the value is
    converted to int; otherwise the value is converted to unsigned int. This process
    is called integral promotion.


    # A.6.2 Integral Conversions


    Any integer is converted to a unsigned type by finding the smallest non-negative
    value that is congruent to that integer, modulo one less the largest value that
    can be represented in the unsigned type. In a two''s complement representation,
    this is equivalent to left-truncation if the bit of the unsigned type is narrower,
    and to zero-filling unsigned values and sign-extending values if the unsigned
    type is wider.


    When any integer is converted to a signed type, the value is unchanged if it can
    be represented in the new type and is implementation-defined otherwise.


    # A.6.3 Integer and Floating


    When a value of floating type is converted to integral type, the fractional part
    is discarded; if the resulting value cannot be represented in the integral type,
    the behavior is undefined. In particular, the result of converting negative floating
    values to unsigned integral types is not specified.


    When a value of integral type is converted to floating type, and the value is
    in the representable range but not exactly representable, the result may be either
    the next higher or next lower representable value. If the result is out of range,
    the behavior is undefined.


    # A.6.4 Floating Types


    When a less precise floating value is converted to an equal or more precise floating
    type, the value is unchanged. When a more precise floating value is converted
    to a less precise floating type, and the value is within representable range,
    the result may be either the next higher or the next lower representable value.
    If the result is out of range, the behavior is undefined.


