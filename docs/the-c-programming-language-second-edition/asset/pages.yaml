  md: "Width and precision may be omitted from a specification: %6f says the number\
    \ to be at least six characters wide; %.2f specifies two characters after the\
    \ decimal point, but the width is not constrained; and %f merely to print the\
    \ number as floating point.\n\n| %d | print as decimal integer |\n| %6d | print\
    \ as decimal integer, at least 6 characters wide |\n| %f | print as floating point\
    \ |\n| %6f | print as floating point, at least 6 characters wide |\n| %.2f | print\
    \ as floating point, 2 characters after decimal point |\n| %6.2f | print as floating\
    \ point, at least 6 wide and 2 characters after decimal point |\n\nAmong others,\
    \ printf also recognizes %o for octal, %x for hexadecimal, %c for character, %s\
    \ for character string and %s for itself.\n\nExercise 1-3. Modify the temperature\
    \ conversion program to print a heading above the table.\n\nExercise 1-4. Write\
    \ a program to print the corresponding Celsius to Fahrenheit table.\n\n# 1.3 The\
    \ for statement\n\nThere are plenty of different ways to write a program for a\
    \ particular task. Let's try a variation on the temperature converter.\n\n```\n\
    #include <stdio.h>\n\n/* print Fahrenheit-Celsius table */\nmain() {\n    int\
    \ fahr;\n\n    for (fahr = 0; fahr <= 300; fahr = fahr + 20)\n        printf(\"\
    %3d %6.1f\\n\", fahr, (5.0/9.0)*(fahr-32));\n}\n```\n\nThis produces the answers,\
    \ but it certainly looks different. One major change is the elimination of the\
    \ variables; only fahr remains, and we have made it an int. The lower and upper\
    \ limits and the step size appear only as constants in the for statement, itself\
    \ a new construction, and the expression that computes the temperature now appears\
    \ as the third argument of printf instead of a separate assignment statement.\n\
    \nThis change is an instance of a general rule - in any context where it is permissible\
    \ to use the value of some type, you can use a more complicated expression of\
    \ type. The third argument of printf must be a floating-point value to match the\
    \ %6.lf, any floating-point expression can occur here.\n\nThe for statement is\
    \ a loop, a generalization of the while. If you compare it to the earlier while,\
    \ its operation should be clear. Within the parentheses, there are three parts,\
    \ separated by semicolons. The first part, the initialization\n\n```\nfahr = 0\n\
    ```"
