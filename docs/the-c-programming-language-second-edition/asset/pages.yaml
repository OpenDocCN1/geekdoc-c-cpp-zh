  md: "This has the undesired effect of setting c to 0 or 1, depending on whether\
    \ or not the call of getchar returned end of file. (More on this in Chapter 2).\n\
    \nExercise 1-6. Verify that the expression getchar() != EOF is 0 or 1.\n\nExercise\
    \ 1-7. Write a program to print the value of EOF.\n\n# 1.5.2 Character Counting\n\
    \nThe next program counts characters; it is similar to the copy program.\n\n```\n\
    #include <stdio.h>\n\n/* count characters in input; 1st version */\nmain() {\n\
    \n    long nc;\n\n    nc = 0;\n    while (getchar() != EOF) {\n        ++nc;\n\
    \        printf(\"%ld\\n\", nc);\n    }\n}\n```\n\nThe Statement\n\n++nc presents\
    \ a new operator, ++, which means increment by one. You could instead write nc\
    \ = nc + 1 but nc is more concise and often more efficient. There is a corresponding\
    \ operator to increment by 1. The operators ++ and -- can be either prefix operators\
    \ (++nc) or postfix operators (nc++); these two forms have different values in\
    \ expressions, as will be shown in Chapter 2, but ++nc and nc++ both increment\
    \ nc. For the moment we will stick to the prefix form.\n\nThe character counting\
    \ program accumulates its count in a long variable instead of an int. long integers\
    \ are at least 32 bits. On some machines, int and long are the same size, on others\
    \ int is 16 bits, with a maximum value of 32767, and it would take relatively\
    \ little input to overflow an int counter. The conversion specification %ld tells\
    \ printf that the corresponding argument is a long integer.\n\nIt may be possible\
    \ to cope with even bigger numbers by using a double (double precision float).\
    \ We will also use a while, instead of a for statement, to illustrate another\
    \ way to write the loop.\n\n```\n#include <stdio.h>\n\n/* count characters in\
    \ input; 2nd version */\nmain() {\n\n    double nc;\n\n    for (nc = 0; gechar()\
    \ != EOF; ++nc) {\n        printf(\"%f\\n\", nc);\n    }\n}\n```"
