  md: '# Chapter 7 - Input and Output


    Input and output are not part of the C language itself, so we have not emphasized
    them in our presentation thus far. Nonetheless, programs interact with their environment
    in much more complicated ways than those we have shown before. In this chapter
    we will describe the standard library, a set of functions that provide input,
    string handling, storage management, mathematical routines, and a variety of other
    services for C programs. We will concentrate on input and output


    The ANSI standard defines these library functions precisely, so that they can
    exist in compatible form on any system where C exists. Programs that confirm their
    system interactions to facilities provided by the standard library can be moved
    from one system to another without change.


    The properties of library functions are specified in more than a dozen headers;
    we have already seen several of them, including <stdio.h>, <string.h>, and <ctype.h>.
    We will not present the entire library here, since we are more interested in writing
    C programs that use it. The library is described in Appendix B.


    # 7.1 Standard Input and Output


    As we said in Chapter 1, the library implements a simple model of input and output.
    A text stream contains of a sequence of lines; each line with a newline character.
    The system does not operate whatever necessary to make it appear as it does. For
    instance, the library may convert carriage return andfeed to newline on input
    and back again on output.


    The simplest input mechanism is to read one character at a time from the standard
    input, normally the keyboard, with getchar:


    ```

    int getchar(void)

    getchar returns the next input each time it is called, or EOF when it encounters
    end of file. The symbolic constant EOF is defined in <stdio.h>. The value is typically
    -1, but tests should be written in terms of EOF so as be independent of the specific
    value.

    ```


    In many environments, a file may be substituted for the keyboard using the < convention
    for input redirection: if a program uses getchar, then the command line


    ```

    prog <infile

    causes prog to read characters from infile instead. The switching of the input
    is done in such a way that is oblivious to the change; in particular, the string
    "<infile" is not included in the command-line arguments in argv. Switching is
    also invisible if the input comes from another program via a pipe mechanism: on
    some systems, the command line

    ```


    ```

    otherprog | prog

    ```'
