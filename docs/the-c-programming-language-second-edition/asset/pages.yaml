    # # 5.6 Pointer Arrays; Pointers to P


    Since pointers are variables, they can be stored in arrays as other variables.
    Let us illustrate by writing a program that will sort a set of text lines into
    alphabetical order, a stripped-down version of the UNIX program sort.


    In Chapter 3, we presented a Shell sort function that would sort an array of integers,
    and in Chapter 4 we improved it with a quicksort. The same algorithms will work,
    except that now we have to deal with lines of text, which are of different lengths,
    and, unlike integers, can''t be compared or moved in a single operation. We need
    a data representation that will cope efficiently and conveniently with variable-length
    text lines.


    This is where the array of pointers enters. If the lines to be sorted end-to-end
    in one long array, each line can be accessed by a pointer to its first character.
    The pointers themselves can be stored in an array. Two lines can be compared by
    passing their pointers to strcmp. When out-of-order lines have to be exchanged,
    the pointers in the pointer array are exchanged, not the text lines.


    ![](img/e219abed0732ebef038c412a88cfb1b2_95_0.png)


    This eliminates the twin problems of complicated storage management and high overhead
    that would go with moving the lines themselves.


