  md: 'The void type has been available in most implementations for some years. The
    Standard introduces the use of the `void *` type as a generic pointer type; previously
    `char *` played this role. At the same time, explicit rules are enacted against
    mixing pointers and integers, and pointers of different type, without the use
    of cases.


    The Standard places limits on the ranges of the arithmetic types, and mandates
    `<limits.h>` and `<float.h>` giving the characteristics of each particular implementation.


    Enumerations are new since the first edition of this book.


    The Standard adopts from C++ the new notion of type qualifier, for example `const`
    (Par.A.7.8).


    Strings are no longer modifiable, and so may be placed in read-only memory.

    The `usual arithmetic conversions` are changed, essentially from `int`, `unsigned`
    always wins; for floating point, always use `double` to “promote to the smallest-capacity
    type”. See Par.A.6.5.


    The old assignment operators like `+=` are true gone. Also, assignment operators
    are no single tokens; in the first edition, they were pairs, and could be separated
    by white space.


    A compiler’s license to treat associative operators as computationally associative
    is revoked.


    A unary + operator is introduced as a function descriptor without an explicit
    `*` operator. See Par.A.7.3.2.


    Structures are now permitted, passed to functions, and arrays is permitted, and
    returned by functions.


    Applying the address-of to arrays is permitted, and the result is a pointer to
    the array.


    The `sizeof` operator is introduced, yielded type int; subsequently, implementations
    made it explicitly implementation-dependent, but requires the type, `size_t`,
    to be defined in a standard header `<stddef.h>`. A similar change occurs in the
    `(ptrdiff_t)` of the difference between pointers. See Par.A.7.4.8 and Par.A.7.7.


    The address-of operator `&` may not be applied to an object declared `register`,
    even if the implementation chooses not to keep the object in register.


    The type of a shift expression is that of the left operand; the right operand
    can promote the result. See Par.A.7.8.


    The Standard legalizes the conversion of pointer beyond the end of an array, and
    allows arithmetic and relations on it; See Par.A.7.6.


    The Standard introduces from C++ the notion of function prototype declaration
    that incorporates the types of parameters, and includes an explicit recognition
    of varied functions together with an approved way of dealing with them. See Par.A.7.3.2,
    Par.A.8.6.3, Par.A.8. The old style is still accepted, with restrictions.


    Empty declarations, which have no declarations and do not declare a structure,
    union, or enumeration, are forbidden by the Standard. On the other hand, a declaration
    with a structure or union tag declares even if it was declared in an outer scope.


    External data declarations without any specifiers or (just a nested declar) are
    forbidden.


    Some implementations, when presented with an `extern` declaration in an inner
    block, would export the declaration to the rest of the file. The Standard makes
    clear that the scope of such a declaration is just the block.


    The scope of parameters is injected into a function statement, so that variable
    declarations at the top level of the function can hide the parameters.'
