  md: "# 2.11 Conditional Expressions\n\nThe statements\n\n```\nif (a > b)\n    z\
    \ = a;\nelse\n    z = b;\n```\n\ncompute z the maximum of a and b. The conditional\
    \ expression, written with the ternary operator `?:`, provides an alternative\
    \ way to write this and similar constructions. In the expression\n\nexpr1 ? expr2\
    \ : expr3;\nif it is non-zero (true), then the expr2 is evaluated first, and the\
    \ value is of the conditional expression. Otherwise expr3 is evaluated, and that\
    \ is the value of the conditional expression. Used to set z to the maximum of\
    \ a and b.\n\n```\nz = (a > b) ? a : b; /* z = max(a, b) */\n```\n\nIt should\
    \ be noted that the conditional expression is indeed an expression, and it can\
    \ be used wherever any other expression can be. If expr2 and expr1 are of different\
    \ types, the type of the result is determined by the conversion rules discussed\
    \ earlier in this chapter. For example, if f is a float and n an int, then the\
    \ expression\n\n```\n(n > 0) ? f : n\n```\n\nParentheses are not necessarily around\
    \ the first expression of a conditional expression, since the precedence of ?:\
    \ is very low, just above assignment. They are advisable anyway, however, since\
    \ they make the condition part of the expression easy to see.\n\nThe conditional\
    \ expression often leads to succinct code. For example, this loop prints elements\
    \ of an array, 10 per line, with each followed by one blank, and with each line\
    \ (including the last) terminated by a newline.\n\n```\nfor (int i = 0; i < n;\
    \ i++)\n    printf(\"%6d%c\", a[i], i==10 || i==n-1 ? '\\n' : ' ' ');\n```\n\n\
    A newline is printed every tenth element, and the n-th followed by one. This might\
    \ look tricky, but it's more compact than the equivalent if-else. Another example\
    \ is\n\n```\nprintf(\"You have %d items.\\n\", n==1 ? \"\" : \"s\");\n```\n\n\
    Exercise 20-1. Rewrite the function lower, which converts upper case letters to\
