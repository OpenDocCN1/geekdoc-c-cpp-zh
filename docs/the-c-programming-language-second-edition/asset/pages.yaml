  md: "# # Chapter 6 - Structures\n\nA structure is a collection of one or more variables,\
    \ possibly of different types, grouped together under a single name for convenient\
    \ handling. (Structures are called `records` in some languages, notably Pascal.)\
    \ Structures help to organize complicated data, particularly in large programs,\
    \ because they permit a group of related variables to be treated as a unit instead\
    \ of as separate entities.\n\nOne traditional example of a structure is the payroll\
    \ record: an employee is described by a set of attributes such as name, address,\
    \ social security number, salary, etc. Some of these in turn could be structures:\
    \ a name has several components, as as an address and even a salary. Another example,\
    \ more typical for C, comes from graphics: a point is a pair of coordinate, a\
    \ rectangle is a pair of points, and so on.\n\nThe main change made by the ANSI\
    \ standard is to define structure assignment - structures may be copied and assigned\
    \ to, passed to functions, and returned by functions. This has been supported\
    \ by most compilers for many years, but the properties are now precisely defined.\
    \ Automatic structures and arrays may now also be initialized.\n\n# ## 6.1 Basics\
    \ of Structures\n\nLet us create a few structures suitable for graphics. The basic\
    \ object is a point, which we will assume has an *x* coordinate and a *y* coordinate,\
    \ both integers.\n\n![](img/e219abed0732ebef038c412a88cfb1b2_113_0.png)\n\nThe\
    \ two components can be placed in a structure declared like this:\n\n```\nstruct\
    \ {\n  int x;\n  int y;\n};\n```\n\nThe keyword `struct` introduces a structure\
    \ declaration, which is a list of declarations enclosed in braces. An optional\
    \ name called a *structure tag* may follow the word `struct` (as with *point*\
    \ here). The tag names this kind of structure, and can be used subsequently as\
    \ a shorthand for the part of the declaration in braces."
