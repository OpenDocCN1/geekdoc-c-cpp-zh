  md: '+   * The name spaces of identifiers are somewhat different. The Standard puts
    all tags in single name space, and also introduces a separate name space for labels;
    see Par.A.11.1. Also, member names are associated with the structure or union
    of which they are a part. (This has been common practice from some time.)

    * Unions may be initialized; the initializer refers to the first member.

    * Automatic structures, unions, and arrays may be initialized, albeit in a restricted
    way.

    * Character arrays with an explicit size may be initialized by a string literal
    with exactly that many characters (the \0 is quietly squeezed out).

    * The controlling expression, and the case labels, of a switch may have any integral
    type.'
