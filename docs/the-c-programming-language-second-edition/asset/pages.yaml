  md: "The last else part handles the ``none of the above`` or default case where\
    \ none of the other conditions are satisfied. Sometimes there is no explicit action\
    \ for the default; in that case the trailing\n\n```\nelse\nstatement\n```\n\n\
    can be omitted, or it may be used for error checking to catch an ``impossible''\
    \ condition.\n\nTo illustrate a three-way decision, it is a binary search function\
    \ that defines if a particular value x occurs in the sorted array v. The elements\
    \ of v are in increasing order. The function returns the (number between 0 and\
    \ n-1) if x occurs in v, and -1 if not.\n\nBinary search first compares the input\
    \ value x to the middle element of the array v. If x is greater than the middle\
    \ value, searching on the lower half of the table, otherwise on the upper half.\
    \ In either case, the next step is to compare x to the middle element of the selected\
    \ half. This process of dividing the range in two continues until the value is\
    \ found or the range is empty.\n\n```\n/* binarysearch: find x in v[0] <= v[1]\
    \ <= ... <= v[n-1] */\nint binarysearch(int x, int v[], int n)\n{\n    int low,\
    \ high;\n    low = 0;\n    high = n - 1;\n    while (low <= high) {\n        mid\
    \ = low + (high-low)/2;\n        if (x < v[mid])\n            high = mid - 1;\n\
    \        else if (x > v[mid])\n            low = mid + 1;\n        else\n    \
    \        /* found match */\n            return mid;\n    }\n    return -1; /*\
    \ no match */\n}\n```\n\nThe fundamental decision is whether x is less than, greater\
    \ than, or equal to the middle element v[mid] at each step; this is a natural\
    \ for else-if.\n\n**Exercise 3-1.** Our binary search makes two tests inside the\
    \ loop, when one would suffice (at the price of more tests outside.). Write a\
    \ version with only one test inside the loop and measure the difference in run-time.\n\
    \n# 3.4 Switch\n\nThe switch statement is a multi-way decision that tests whether\
    \ an expression matches one of a number of constant values, and branches accordingly.\n\
    \n```\nswitch (expression) {\n    case const-expr: statements\n    case const-expr:\
    \ statements\n    default: statements\n}\n```"
