  md: '# Chapter 5 - Pointers and Arrays


    A pointer is a variable that contains the address of a variable. Pointers are
    much used in C, partly because they are sometimes the only way to express a computation,
    and partly because they usually lead to more compact and efficient code than can
    be obtained in other ways. Pointers and arrays are closely related; this chapter
    explores this relationship and shows how to exploit it.


    Pointers have been lumped in with the goto statement as a marvelous way to create
    impossible-to-understand programs. This is certainly true when they are used carelessly,
    and it is easy to create pointers that point somewhere unexpectedly. With discipline,
    however pointers can also be used to achieve clarity and simplicity. This is the
    aspect that we will to illustrate.


    The main change in ANSI C is to make the rules about how pointers can be manipulated,
    in effect mandating what good programmers already practice and enforce. In addition,
    the type void * (pointer to) replaces char * as the proper type for a generic
    pointer.


    # 5.1 Pointers and Addresses


    Let us begin with a simplified picture of how memory is organized. A typical machine
    has an array of consecutively numbered or addressed memory cells that may be manipulated
    individually or in contiguous groups. One common situation is that any byte can
    be a char, a pair of one-bytes can be a short integer, and four adjacent bytes
    form a long. A pointer is a group of cells (often two or four) that can hold an
    address. So if c is a char and p is a pointer that points to it, we could represent
    the situation this way:


    ![](img/e219abed0732ebef038c412a88cfb1b2_82_0.png)


    The unary operator & gives the address of an object, so the statement


    ```

    p = &c;

    ```


    assigns the address of c to the variable p, and p is said "point to" c. The &
    operator applies to objects in memory: variables and array elements. It cannot
    be applied to expressions, constants, or register variables.


    The unary operator * is the indirection or dereferencing operator; when applied
    to a pointer, it accesses the memory pointer points to. Suppose that x and y are
    integers and ip is a pointer to int. This artificial sequence shows how to declare
    a pointer and how to use & and *:


    ```

    int x = 1, y = 2, z[10];

    int *ip;          /* ip is a pointer to int */

    ```'
