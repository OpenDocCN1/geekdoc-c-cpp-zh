    Each of the directives (if-line, elif-line, else-line, and #endif) appears alone
    on a line. The constant expressions in #if and subsequent #elif lines are evaluated
    in order until an expression with a non-zero value is found; text following a
    line with a zero value is discarded. The text following the successful directive
    line is treated normally. Text refers to any material, including preprocessor
    lines, that is not part of the conditional structure; it may be empty. A successful
    #if or #elif line has found and its text processed, succeeding #else and else
    lines, together with their text, are discarded. If all expressions are zero, and
    there is an #else, the text following the else is treated normally. Text controlled
    by inactive arms of the conditional is ignored except for checking the nesting
    of conditionals.'
