  md: '# 6.5 Self-referential Structures


    Suppose we want to handle the more general problem of counting the occurrences
    of all the words in some input. Since the list of words is not known in advance,
    we can''t conveniently sort it and use a binary search. Yet we can''t do a linear
    search for each word as it arrives, to see if it is already seen; the program
    would take too long (More precisely, its running is likely to grow quadratically
    with the number of input words). How can we organize the data copy efficiently
    with a list or arbitrary words?


    One solution is to keep the set of words so far sorted at all, by placing each
    word into its proper position in the order as it arrives. This shouldn''t be done
    by shifting words in a linear array, though - also takes too long. Instead we
    will use a data structure called a binary tree.


    The tree contains one `node` per distinct word; each node contains


    +   * A pointer to the text of the word,

    * A count of the number of occurrences,

    * A pointer to the left child node,

    * A pointer to the right child node.


    No node may have more than two children; it might have zero or one.


    The nodes are maintained so that any node the left subtree contains only words
    that are lexicographically less than the word at the node, and the right subtree
    contains only words that are greater. This is the tree for the sentence `now is
    the time for all good men to come to the aid of their party`, as built by inserting
    each word as it is encountered:


    ![](img/e219abed0732ebef038c412a88cfb1b2_123_0.png)


    Find out whether a new word is already in the tree, start at the root and compare
    the new word to the word stored at that node. If they match, the question is answered
    affirmatively. If the record is less than the tree, continue searching at the
    left child, otherwise at the right child. If there is no child in the required
    direction, the new word is not in the tree, and in fact the empty slot is the
    proper place to add the new word. This process is recursive, since the search
    from any node uses a search from one of its children. Recursively, routines for
    insertion and printing will be most natural.


    Going back to the description of a node, it is most conveniently represented as
    a structure with four components:'
