    # B.1.4 Character Input and Output Functions


    ```

    int fgetc(FILE *stream)

    fgetc returns the next character as an unsigned char (converted to an int), or
    EOF if end of file or error occurs.

    char *fgets(char *s, int n, FILE *stream)

    gets reads from the next n-1 characters into the array s, a stopping is encountered;
    the newline is included in the array, which is terminated by ''\0''. fgets returns
    s, or NULL if end of file or error occurs.

    int fputc(int c, FILE *stream)

    fputs the character c (converted to an unsigned char) on stream. It returns the
    character written, or EOF for error.

    int fputs(const char *s, FILE *stream)

    fputs writes the string s (which may not contain \n) on stream; it returns nonnegative,
    or EOF for error.

    int get(FILE *stream)

    get is equivalent to getc except if it is a macro, it may evaluate stream more
    than once.

    int getchar(void)

    getchar is equivalent to getc(stdin).

    char *gets(char *s)

    gets reads the next input line into the array s; it replaces the terminating newline
    with ''\0''. It returns s, or NULL if end of file or error occurs.

    int put(int c, FILE *stream)

    put is equivalent to fputc except if it is a macro, it may evaluate stream more
    than once.

    int putchar(int c)

    putchar(c) is equivalent to putc(c, stdout).

    int puts(const char *s)

    puts writes the string s and a newline to stdout. It returns EOF if an error occurs,
    non-negative otherwise.

    int unget(int c, FILE *stream)

    unget pushes c (converted to an unsigned char) back onto stream, it will be returned
    on the next read. Only one character of pushback per stream is guaranteed.\EOF
    may not be pushed back. unget returns the character pushed back, or EOF for error.

