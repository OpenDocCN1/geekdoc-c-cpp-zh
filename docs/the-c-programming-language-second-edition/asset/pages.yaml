  md: "21\n\nprintf uses %f for both float and double; %.0f suppresses the printing\
    \ of the decimal point and the fraction part, which is zero.\n\nThe body of this\
    \ for loop is empty, because all the work is done in the test and increment parts.\
    \ The grammatical rules of C require that a for statement have a body. The isolated\
    \ semicolon, called a null statement, is there to satisfy that requirement. You\
    \ put it on a separate line to make it visible.\n\nBefore we leave the counting\
    \ program, observe if the input contains no characters, the while or for test\
    \ fails on the very first call to getchar, and the program produces zero, the\
    \ right answer. This is important. One of the things about while and for is that\
    \ they sit at the top of the loop, before executing it. If there is nothing to\
    \ do, nothing is done, even if that means never going through the loop body. Programs\
    \ should act intelligently when given zero-length input. The while and for statements\
    \ ensure that programs do reasonable things with boundary conditions.\n\n# 1.5.3\
    \ Line Counting\n\nThe next program counts input lines. As we mentioned above,\
    \ the standard library ensures that an input stream appears as a sequence of lines,\
    \ each terminated by a newline. Hence, counting lines is just counting newlines:\n\
    \n```\n#include <stdio.h>\n\n/* count lines in input */\nmain()() {\n    int c,\
    \ nl;\n\n    nl = 0;\n    while (c = getchar()) != EOF) {\n        if (c == '\\\
    \\n')\n            nl++;\n        printf(\"%d\\n\", nl);\n    }\n}\n```\n\nThe\
    \ body of the while loop consists of an if, which in turn controls the increment\
    \ ++nl. The if statement tests the parenthesized condition, and if the condition\
    \ is true, executes the statement (or group of statements in braces) that follows.\
    \ We have again indented to show what is controlled by what.\n\nThe double equals\
    \ == is the C for \"is equal to\" (like Pascal's = or Fortran's EQ.). This symbol\
    \ is used to distinguish the equality test from equal = that C uses for assignment.\
    \ A word of newcomers: C occasionally runs when we mean ==. As we see in Chapter\
    \ 2, the result is a legal expression, so you will get no warning.\n\nA character\
    \ written between single quotes represents an integer value equal to the numerical\
    \ value of the character in the machine's character set. This is called a character\
    \ constant; although it is just another way to write a small integer. So, for\
    \ 'A' is a character constant; in the ASCII character set its value is 65, the\
    \ internal representation of the character A. Of course, 'A' is to be preferred\
    \ over 65: its meaning is obvious, and it is independent of a particular character\
    \ set."
