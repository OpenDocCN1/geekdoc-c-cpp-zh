  md: '# A.2.5.2 Character Constants


    A character constant is a sequence of one or more characters enclosed in single
    quotes as in ''\''. The value of a character constant with only one character
    is the numeric value of the character in the machine''s character set at execution
    time. The value of a multi-character constant is implementation-defined.


    Character constants do not contain the ''\'''' or newlines; in order to represent
    them, and certain other characters, the following escape sequences may be:


    | newline | NL (LF) | backslash | \|\ |

    | --- | --- | --- | --- |

    | horizontal tab | HT | \t question ? | ? |

    | vertical tab | VT | \v single quote | ''\'''' |

    | backspace | BS | \b double quote | \" |

    | carriage return | CR | \r octal number | \ooo |

    | | | \f hex number | \xhh |

    | alert | BEL | |


    The escape \ooo consists of the backslash followed by 1, 2, or 3 octal digits,
    which are taken to specify the value of the desired character. A common example
    of this construction is \0 (not followed by a digit), which represents the character
    NUL. The escape \xhh consists of the backslash followed by hexadecimal digits,
    which are taken to specify the value of the desired character. There is no limit
    on the number of digits, but the behavior is undefined if the resulting character
    exceeds that of the largest character. For either octal or hexadecimal constants,
    if the implementation treats the char as signed, the value is sign-extended as
    if cast to char type. If the character following the \ is not one of those specified,
    the behavior is undefined.


    In some implementations, there is an extended set of characters that cannot be
    represented in the char type. A constant in this set is written with a preceding
    L, for L'', and is called a wide constant. Such a constant has wchar_t, an integer
    type defined in the standard header <stddef.h>. As ordinary character constants,
    hexadecimal constants may be used; the effect is undefined if the specified value
    exceeds representable with wchar_t.


    > Some of escape sequences are new, in particular the hexadecimal character representation.
    Extended constants are also new. The characters commonly used in the Americas
    and western Europe can be encoded to fit in the char type; the main intent in
    adding wchar_t was to accommodate Asian languages.


    # A.2.5.3 Floating Constants


    A floating constant consists of an integer part, a decimal part, a fraction part,
    and an e or E, an optionally signed exponent, of of f, L or l. The integer and
    fraction parts consist of a sequence of digits. Either the integer part, or the
    fraction part (not both) may be missing; either the decimal point or the exponent
    (not both) may be missing. The type is determined by the decimal point or F or
    f makes L or l makes makes it long double, otherwise it is double.


    # A.2.5.4 Enumeration Constants'
