    \ same conversion for floating-point numbers).\n\nThe structure of the program\
    \ space reflects the form of the input:\n\n+   * skip white space, if any\n* get\
    \ sign, if any\n* get integer part and convert it\n\nEach step does its part,\
    \ and leaves things in a clean state for the next. The whole process terminates\
    \ on the first character that cannot be part of a number.\n\n```\n#include <ctype.h>\n\
    \n/* atoi: convert s to integer; version 2 */\nint atoi(char s[])\n{\n    int\
    \ i, sign;\n    for (i = 0; isspace(s[i]); i++) /* skip white space */\n     \
    \   sign = (s[i] == '-') ? -1 : 1;\n        if (s[i] == '+' || s[i] == '-') /*\
    \ skip sign */\n        i++;\n    for (n = 0; isdigit(s[i]); i++)\n        n =\
    \ 10 * n + (s[i] - '0');\n    return sign * n;\n}\n```\n\nThe standard library\
    \ provides a more elaborate function strtol for conversion of strings to integers;\
    \ see Section 5 of Appendix B.\n\nThe advantages of keeping loop control centralized\
    \ are even more obvious when there are nested loops. The following function is\
