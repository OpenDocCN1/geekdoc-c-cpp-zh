    The following functions deal with operations on files. The type size_t is the
    unsigned integral produced by the sizeof operator.

    FILE fopen(const char *filename, const char *mode)

    fopen the named file, and returns a stream, or NULL if the attempt fails. Legal
    values for mode include:


    +   * "r" open file for reading

    * "w" create file for writing; discard previous contents if any

    * "a" append; or create file for writing at end of file

    * "r+" create file for update, (i.reading) and writing

    * "w+" create file for update, discard previous contents if any

    * "a+" append; or create file for update, at at end


    Update permits reading and writing the same file; fflush or a file-positioning
    function must be called between a reader and a writer versa. If the mode b after
    the initial letter, as in "rb" or "wb", indicates a binary file. Filenames are
    limited to FILE_MAX characters. All FOPEN_MAX files may be open at once.

    FILE fopen(const char *filename, const char *mode, FILE *stream)

    fopen the file with the specified mode and associates the stream with it. returns
    stream, or NULL if an error occurs. freep is normally used to change the files
    associated with stdin, stdout, or stderr.


    int fflush(FILE *stream)

    On an output stream, fflush flushes any buffered data to be written; on an input
    stream, the effect is undefined. It returns EOF for a write error, and zero otherwise.
    fflush (NULL) flushes all output streams.


    int fclose(FILE *stream)

    fclose any unwritten data for stream, discards any unread buffered input, frees
    any automatically allocated buffer, then closes the stream. It returns EOF if
    any errors occurred, and zero otherwise.


    int remove(const char *filename)

    remove the named file, so that a subsequent attempt to open it will fail. returns
    non-zero if the attempt fails.


    int rename(const char *oldname, const char *newname)

    rename changes the name of a file; it returns non-zero if the attempt fails.


    FILE tmpfile(void)

    tmpfile creates a temporary file of mode "wb" that will be automatically removed
    when closed or when the program terminates. tmpfile returns a stream, or NULL
    if it could create


    char * tmpnam(char *L_filename)

    tmpnam (NULL) creates a string that is not the name of any existing file, and
    returns a pointer to an internal static array. tmpnam(s) returns the string s
    as L_filename characters as well as returning it as the function value; s must
    have room for at least L_filename. tmpnam generates a different name each time
    it is called; at most TMP_MAX names are guaranteed during execution of the program.
    Note that tmpnam creates a name, for


    int setbuf(FILE *stream, char *buf, int mode, size_t size)

    setbuf controls buffering for the stream; it must be called before reading or
    writing. A mode of _IOBF causes full buffering, IOLBF line buffering of text files,
    and _IONBF no buffering. If buf is NULL, it will be used as the buffer, otherwise
    a buffer will be allocated. size determines the buffer size. setbuf returns non-zero
