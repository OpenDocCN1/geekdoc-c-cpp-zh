    # Fixed-Size Buffers


    We use fixed-size buffers to declare in-line arrays of C-style as struct members.
    They are very useful when you want to interface with an unmanaged API.


    # Fixed-Size Buffer Declarations


    A fixed-size buffer is a member used to represent the storage of fixed-length
    buffers of specified type variables. A declaration of a fixed-size buffer brings
    in at least one fixed-size buffer of a specified element type. We can only use
    fixed-size buffers in a struct declaration and they can only be declared in an
    unsafe context.


