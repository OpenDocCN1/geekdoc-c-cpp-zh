  md: '# Stack vs. Heap


    Although we don’t really need to worry too much about actively managing memory
    and garbage collection with the .NET framework, we do need to keep both in mind
    to ensure that our applications are running at optimal performance. It doesn’t
    hurt to have, at the very least, a basic understanding of the way memory management
    works because it will help you understand how the variables we use in every program
    actually work. What I’ll be talking about here is Stack and Heap basics, variable
    types and why some variable behave the way they do.


    In the .NET framework, there are two places where items are stored in the memory
    while your code is being executed. Those two places are the Stack and the Heap.
    Both are useful to help the code run and they both live in the operating memory
    on your computer containing the data needed to make everything happen as it should.


    # Stack vs. Heap: What''s the difference?


    The Stack is responsible for monitoring what gets executed or called in your code
    while the Heap is responsible for monitoring the objects, or most of the data.


    You can consider the Stack to be nothing more than a pile of boxes, each stacked
    on top of one another neatly. Whenever a method is called, another box is stacked
    on top and we call that a Frame. At any given time, we can only make use of what
    is in the box at the top of the stack. When we are finished with it, i.e. the
    method has been executed, the top box is discarded, and we move to the next box.


    The Heap isn’t much different but its purpose is to store data and not track the
    execution. This means that we can access anything in the Heap at any time regardless
    of where it is. Think of it as being a heap of laundry that needs to be put away
    but hasn’t been – when you want something, you grab it, no matter where in the
    heap it is.


    The Stack will look after its own memory management; the top box is automatically
    discarded when no longer needed. By contrast, the'
