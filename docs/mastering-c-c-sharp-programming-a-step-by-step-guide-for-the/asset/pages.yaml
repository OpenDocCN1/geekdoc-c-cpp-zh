  md: "```\npublic class B: A\n{\n    public unsafe override void F(char* p) {...}\n\
    }\n```\n\nBecause the signature for F has a pointer type in it, we can only write\
    \ it in the unsafe context. We can do this in two ways – as we did with A, we\
    \ can make the whole class into an unsafe context, or, as we did with B, we can\
    \ add the unsafe modifier into the method declaration.\n\n# Pointer Types\n\n\
    In the unsafe context, a type can be a value_type, a reference_type, or a pointer_type.\
    \ However, you can also use a pointer_type in expressions external to unsafe contexts\
    \ because this type of use is not considered to be unsafe:\n\n```\ntype_unsafe\n\
    \  : pointer_type\n  ;\n```\n\nWe write pointer_types as unmanaged_types or we\
    \ use the void keyword and a * token:\n\n```\npointer_type\n  : unmanaged_type\
