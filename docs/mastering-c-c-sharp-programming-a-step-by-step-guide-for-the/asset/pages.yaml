- pgno: 168
  md: 'ushort


    # Reference Types


    Anything that is declared with the declaration types listed below are Reference
    Types. They will inherit from System.Object with the exception of the object itself
    – this System.Object.


    +   - class

    +   - interface

    +   - delegate

    +   - object

    +   - string


    # Pointers


    The third type that goes into memory management is a pointer, which is a reference
    to a type. These are not used explicitly; the CLR (Common Language Runtime) manages
    them. Pointers differ from reference types in that anything that is a reference
    type is accessed via a pointer, which is a space in the memory that points to
    another space in the memory. Pointers take up space, the same as anything else
    that goes in the Stack and the Heap and it has a value of a memory address or
    of null.


    # Instructions


    Lastly, instructions and we will see how they work later on in this section.


    # What Goes Where?


    One last thing, there are two rules that determine what goes where:


    +   - Reference types always go on the Heap.

    +   - Pointers and Value types go to where they were declared. This is a bit more
    complicated and, to fully understand it, you need to fully understand how a Stack
    works so that you can work out where the value type or pointer was declared.'
