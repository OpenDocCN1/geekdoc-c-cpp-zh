  md: "# Fixed-Size Buffers In Expressions\n\nA member lookup on fixed-size buffer\
    \ members is exactly the same as member lookup on fields.\n\nUsing simple_name\
    \ or member_access, you can reference a fixed-size buffer. When you use simple_name\
    \ to reference it, you get the same effect as member access of this I, in which\
    \ I is the fixed-size buffer member.\n\nWith member access of form E.I, where\
    \ E is a struct type, and member lookup of I in that type results in a fixed-size\
    \ member being identified, then E.I will be evaluated and classified in this way:\n\
    \n+   - A compile-time error happens if expression E.I is not in an unsafe context\n\
    +   - A compile-time error will happen if E gets classified as a value\n+   -\
    \ Otherwise, where E is a moveable variable and E.I isn’t a fixed_pointer_initializer,\
    \ then an error will occur at compile time\n+   - Otherwise, where E is referencing\
    \ a fixed variable and the expression result is a pointer to the initial element\
    \ of the fixed-size buffer member of I inside E, the result will be S* type –\
    \ S is I’s element type and is a value\n+   - We can use pointer operations from\
    \ the initial element to access all subsequent buffer elements. Unlike array access,\
    \ element access in a fixed-size buffer is considered an unsafe operation. and\
    \ as such, isn’t range checked.\n\nIn the next example, we are declaring a struct\
    \ and using it with a fixed-size buffer member:\n\n```\nunsafe struct Font\n{\n\
    \    public int size;\n    public fixed char name[32];\n}\n```"
