    # Quick Primer


    +   - Classes usually go into a file of their own, even though C# doesn''t require
    this to happen – it''s just easier.

    +   - You can add variables to classes and they are known as instance variables.

    +   - You can add however many constructors you want to a class.

    +   - Methods can also be added to classes and these will work on the instance
    variables in the class.

    +   - When you use the private keyword with instance variables or methods, you
    are saying that it can only be used from within the class.

    +   - When you use the public keyword with an instance variable or a method, you
    are saying that it can be accessed from anywhere, in or out of the class.

    +   - We also looked at name hiding, variable scope and the ‘this’ keyword.


