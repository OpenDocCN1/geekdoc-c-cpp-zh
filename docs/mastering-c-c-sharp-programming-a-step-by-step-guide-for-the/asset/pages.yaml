    For now, let’s go back to our static keyword.


    # Static Methods, Variables, and Classes


    Up to now, we’ve been doing a lot of work with variables, specifically instance
    variables, and with methods belonging to class instances. What this means is that
    several instances of a class can be created and each will have its own set of
    data. When you call one of them, it will do the work it needs to by using a set
    of variables specific to it.


    However, previously, all of our methods were static. What does that mean? Any
    class-level method or variable that has the static keyword belongs to the entire
    class, not just one instance of it.


    As far as variables go, any instance that uses the variable will have the exact
    same values. For example, if an instance changes the value of a static class value
    to, let’s say 4, another instance will be able to see the new value and this is
    because the variables are shared with every class instance.'
