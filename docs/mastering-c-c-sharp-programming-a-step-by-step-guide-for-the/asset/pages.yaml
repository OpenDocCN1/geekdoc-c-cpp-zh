- pgno: 169
  md: "We know that the Stack has the responsibility for monitoring each thread while\
    \ the code is executing. Think of it as being a thread state, with each thread\
    \ having its own Stack. When a call is made by the code to a method, the thread\
    \ will begin to execute the instructions that were JIT (Just In Time) compiled\
    \ and that live in the method table. Plus, it will also place the parameters for\
    \ the method onto the Stack for the relevant thread. Then, as the code runs through\
    \ and we come up against variables in the method, they also go onto the Stack.\n\
    \nHere’s an example to make this clearer:\n\nTake this method:\n\n```\npublic\
    \ int AddFive(int pValue)\n{\n    int result;\n    result = pValue + 5;\n    return\
    \ result;\n}\n```\n\nSo, what goes on at the top of the Stack? Just bear in mind\
    \ that what we are currently seeing is what goes to the top of the Stack, on top\
    \ of all the other items already in there. Once the method begins executing, the\
    \ parameters for that method go to the Stack (we’ll discuss passing parameters\
    \ later). The method itself will not live on that Stack, only the parameters.\n\
    \nAfter that, control, which is the thread that is executing the current method,\
    \ goes to the instructions which for our method are called AddFive() – this method\
    \ is on the method table for the type. If this is the first hit on the method,\
    \ a JIT compilation will be carried out.\n\nAs the method continues to execute,\
    \ we are going to require memory for the variable called result and this will\
    \ be allocated on the Stack. The method execution completes and the result is\
    \ returned."
