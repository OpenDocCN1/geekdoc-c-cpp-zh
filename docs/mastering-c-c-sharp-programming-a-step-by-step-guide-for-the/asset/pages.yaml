  md: '# LINQ


    LINQ stands for Language Integrated Query and those who already have some familiarity
    with databases already know just what a query is. For those who don’t, a query
    is nothing more than a way for a programmer to interact with a database and manipulate
    the data. A programmer accesses a table in a database using a query so that they
    can insert data, delete it, edit what’s there, or retrieve it. However, unlike
    that usual way that we query data, C# provides developers with an entirely new
    way of accessing multiple data types and working with them and that includes databases,
    XML files, dynamic data, and Lists. That way is using LINQ.


    There are two basic units in a LINQ function – elements and sequences. LINQ sequences
    are sets of items that implement the interface called IEnumerable<T>. Each of
    the items in a set are known as elements and an example of a sequence that implements
    this particular interface is the array. Look at this:


    ```

    string[] cities = {"Berlin", "New York ", "Sofia", "Istanbul", "London"};

    ```


    This array is of the string type and it has the names of several different cities.
    We call this collection type a ‘local’ sequence because all of the items are stored
    in the system’s local memory.


    # Query Operators


    A LINQ query operator is used to take LINQ sequences as input, transform the entire
    sequence, and then return the new sequence as the output. In the System.Linq namespace
    is the class call Enumerable and that contains roughly 40 of these query operators
    and we’re going to be looking at the ones you will use the most.


    # Where Operator


    We use this operator to filter sequences based on a specified condition. For example,
    if you wanted to retrieve the names of every city in the array called cities,
    where the city length is greater than or equal to 6, you would do it like this:


    using System;'
