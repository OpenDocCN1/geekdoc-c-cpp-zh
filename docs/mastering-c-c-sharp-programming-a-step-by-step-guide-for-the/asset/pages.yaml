  md: 'Again, this works the same as any other variable, even if you want to do something
    like a comparison in an if statement:


    ```

    DaysOfWeek today = DaysOfWeek.Sunday;

    ```


    ```

    if(today == DaysOfWeek.Sunday)

    {

    // ...

    }

    ```


    # Why Enumerations are Useful


    There is an excellent reason why you should use enumerations. At the beginning,
    we used the int type with the days of the week. We defined dayOfWeek = 3 and that
    was Tuesday. What if we had put dayOfWeek = 17. As far as the computer is concerned,
    this is perfectly valid because dayOfWeek has been defined as a variable of int
    type. Why shouldn’t it be 17? However, that doesn’t really make any sense because
    we only want 1 through 7.


    With an enumeration, you can force both programmers and computer to use specified
    values only, values that you have defined. Using them prevents so many errors
    and it makes things so much easier to read. For example, if you saw dayOfWeek
    = DaysOfWeek.Sunday, you would understand it better than dayOfWeek = 1.


    # More Details


    Before we move on, there is one more detail we need to look at. All C# is doing
    is wrapping the enumeration around the ints. So, essentially they are nothing
    but numbers. When an enumeration is created, it starts by providing them all with
    values, beginning at 0, and increasing by 1 for each one after. With our enumeration,
    Sunday is valued at 0, Monday at 1, Tuesday at 2, and so on.


    This means that we can cast to an int or another number, and cast from it, like
    this:'
