    # Pointer Increment and Decrement


    In unsafe contexts, you can apply the ++ operator and the -- operators to pointer
    variables of any type except for void*. As such, for every T* type pointer, these
    are the implicitly defined operators:


    +   - T* operator ++(T* x);

    +   - T* operator --(T* x);


    The first operator produces the result of x + 1 and the second produces a result
    of x − 1. So, for a type T* pointer variable, the ++ operator will add sizeof(T)
    to the address the variable contains and the -- operator will do the opposite
    – subtract sizeof(T) from the address the variable contains.


    If an increment or a decrement of a point overflows the pointer type domain, the
    result will be implementation-defined but there will not be any exceptions thrown.


