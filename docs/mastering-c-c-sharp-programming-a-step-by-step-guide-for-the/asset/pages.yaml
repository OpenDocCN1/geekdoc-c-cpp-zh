- pgno: 19
  md: '# .NET Framework


    .NET is a framework developed by Microsoft for software applications. It is used
    by developers to build web applications, mobile, and Window applications and offers
    wide support for industry standards along with a huge range of functionalities.


    Inside .NET you will find the FCL, or the Framework Class Library, a large number
    of class libraries. Software that is written in .NET executes in the CLR, or Common
    Language Runtime environment and both of these are core parts of the framework.


    .NET provides a number of different services, such as networking, memory management,
    memory safety, and security, and it provides full support for multiple programming
    languages, of which C# is one.


    These are all the parts that make up the framework:


    +   - **CLR -** The Common Language Runtime is an execution engine, an interface
    between the operating system and the framework.

    +   - **FCL -** The Framework Class Library contains a collection of thousands
    of classes that you can use to build your applications. The core of the library
    is BCL, or Base Class Library, which provides the basic functionalities.

    +   - **WinForms –** Windows Forms is a collection of managed libraries, smart
    client technology for the framework that makes it much simpler to do common tasks,
    such as reading and writing to file systems.

    +   - **ASP .NET –** A web framework that Microsoft designed and developed, used
    for developing websites, web services, and web applications. It helps with the
    integration of JavaScript, CSS, and HTML.

    +   - **ADO .NET –** A .NET framework module that establishes the connection between
    data sources and the applications. Those data services could be XML or SQL Server,
    for example. ADO .NET is made up of classes that are used for retrieving connecting,
    inserting, and deleting data.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - **WPF – Windows Presentation Foundation** is a Microsoft graphical subsystem
    that is used in Windows applications for rendering the UI and it makes use of
    DirectX.

    +   - **WCF – Windows Communication Foundation** is a framework used to build
    applications that are service-oriented. With WCF, asynchronous messages can be
    sent between service endpoints.

    +   - **WF – WorkFlow Foundation** is another technology from Microsoft that provides
    users with an API, a re-hostable designer and an in-process workflow engine to
    help with the implementation of long-running processes in .NET applications.

    +   - **LINQ – Language Integrated Query** was first introduced with .NET 3.5
    and is used for making queries with C# for data sources.

    +   - **Entity Framework –** An ORM-based framework, open-source, used for working
    with databases that use .NET objects. It takes a lot of effort out of the developer’s
    work in handling the database and is the recommended database technology.

    +   - **Parallel LINQ –** Otherwise known as PLINQ, this is a parallel implementation
    of LINQ to objects, combining the readability and simplicity of LINQ with the
    power of parallel programming. It can speed up LINQ query execution by ensuring
    that all computer capabilities available are used.


    Apart from all this, there are other APIs and models in .Net to improve and enhance
    it. Over the course of this guide, we will be looking at some of the above in
    detail.


    # .NET Common Language Runtime (CLR)


    This is a runtime environment used for managing and executing any code written
    in a language supported by .NET. It can turn code into native code so that the
    CPU can execute it. Its functions include:


    +   - Conversion of programs into native code

    +   - Exception handling

    +   - Ensures type-safety

    +   - Memory management'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   - Security

    +   - Performance improvements

    +   - Independent of any one language

    +   - Independent of any one platform

    +   - Provides garbage collection


    It also provides language features, i.e. interfaces, overloading, and inheritance
    for object-oriented programming.


    +   - **BCL Support** – Base Class Library is the library that provides .NET applications
    with class support

    +   - **Thread Support** – management of parallel execution for multi-threaded
    applications

    +   - **COM Marshaller** – provides communication between applications and COM
    objects

    +   - **Type Checker** – checks types in the application to ensure they match
    the CLR standards

    +   - **Code Manager** – manages the code at execution runtime

    +   - **Garbage Collector** – releases any portions of unused memory, and allocates
    it to other applications

    +   - **Exception Handler** – handles runtime exception so the application doesn’t
    fail

    +   - **ClassLoader** – loads the classes at runtime


    # .NET Framework Class Library


    This is a large collection of classes, interfaces, namespaces, and value types
    used in .NET applications. The large number of classes support:


    +   - Data types – base and user-defined

    +   - Exception handling

    +   - I/O and stream operations

    +   - Communication with the underlying operating system

    +   - Data access

    +   - Creation of GUI applications – Windows-based

    +   - Creation of web-client and server applications

    +   - Creation of web services.'
  merge: -1
  img_proc: true
