    Still with me?


    Explicit casting is also incredibly important. There will be times when you want
    to go from a wide to a narrow type and doing this is a simple case of putting
    the required type to cast to inside a set of parentheses before what you are casting.
    Let’s see this in an example, to make it clearer; here, we cast a long to an int:


    ```

    long a = 3;

    int b = (int)a;

    ```


    What is worth bearing in mind is that casting really isn’t magic and it can’t
