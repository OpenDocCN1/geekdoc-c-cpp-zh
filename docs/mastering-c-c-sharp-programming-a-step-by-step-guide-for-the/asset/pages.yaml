    you only add strings. The compiler will know that no other type can be added and
    that makes it type-safe. All we had to do was define one generic list class.


    Really, that is the basics of generics covered, but this List class is one of
    the most useful so we’ll take time to look at it closer.


    There are a couple of ways of adding new items to your list. The first way is
    the Add method:


    ```

    List<string> strings = new List<string>();

