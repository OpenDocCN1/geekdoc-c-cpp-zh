  md: '# Basic Math


    If you are familiar with any other computer programming language then you’ll find
    C# arithmetic very easy to grasp, especially as it is much the same as C, C++,
    and Java.


    Now that we have a grasp on variables, we can delve into math; it’s pretty simple,
    basic arithmetic, much like what you learned at school. Let’s face it, computers
    just love math, mainly because it’s just about all they can do and they can do
    it fast.


    What we are going to look at here is some of the more basic C# arithmetic – we’ll
    be going deeper in another chapter. We’ll start with addition, subtraction and
    move on to multiplication, division, and the modulus operator, which is a new
    one. From there, we’ll look at numbers (positive and negative), the order of operations
    (operator precedence), and then finish by looking at compound assignment operators
    – these can do the math and assign values in one swift operation.


    # Addition, Subtraction, Multiplication, and Division


    This bit is straightforward, even if you have never looked at another computer
    programming language. We’ll start with a basic math problem, one that you most
    likely did in first or second grade. We are going to add two numbers together
    and store the value in a variable with the name of ‘a’. Here’s the code:


    ```

    int a = 4 + 5;

    ```


    The same principle works for subtraction, this time the value is stored in a variable
    named ‘b’:


    ```

    int b = 5 - 4;

    ```


    You are not limited to using numbers only in your math; you can also use variables:


    ```

    int c = a + 3;

    ```


    ```

    int d = a - b;

    ```'
