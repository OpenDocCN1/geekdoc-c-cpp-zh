    +   - Explicit casting from one type to another can be done by inserting the type
    you want to cast to inside a set of parentheses in front, for example, (float
    a = (float) 3.4948393;).


    +   - Division by zero will result in an exception being thrown for int types
    and, for the floating point types, in infinity.


    +   - Positive Infinity, NegativeInfinity, and NaN are all designed for the double
