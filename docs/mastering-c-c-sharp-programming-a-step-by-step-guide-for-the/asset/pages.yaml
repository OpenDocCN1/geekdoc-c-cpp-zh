    “plscr”, would you remember what it meant later on? Will you have to sit and really
    think hard about it? You are not playing a word search game or a fill-in-the-missing-blanks
    game – if you have to guess, don’t do it.


    The name of a variable should have a minimum of three letters (although there
    are exceptions) so don’t worry if your name is longer. It’s better to have a name
    that properly describes it and we no longer have the old limit of eight characters
    for the name. However, don’t go too mad and have a name that is too long.


    If you find yourself adding numbers to the end of your name, you are doing something
    wrong. Think about renaming your variables instead. For example, rather than score1
    and score2, consider something like playerScore and gameScore. Do you see where
    I’m going? Also, don’t use words like ‘text’, ‘data’, ‘number’, or ‘item’ as they
    don’t offer enough description.


    Mostly, we use nouns to name a variable, such as a person, a thing, a place, an
    idea or use a noun phrase, such as ‘playerScore’.


    Ensure that each word in your variable name stands out from the next one. This
    makes it infinitely more readable and, because spaces are not allowed, there are
    a couple of ways you can do this. The first is to capitalize second and subsequent
    words in the name, leaving the first with a lower-case – playerScore, for example.
    The second is to use an underscore, for example, player_score. Both of these look
    far better than playerscore and are more readable. Either is acceptable, although
