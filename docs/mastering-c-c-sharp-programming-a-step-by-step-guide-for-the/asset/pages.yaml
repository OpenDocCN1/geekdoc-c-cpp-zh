- pgno: 83
  md: 'C# has several special numbers – infinity, NaN, pi, e MaxValue and MinValue.


    # Infinity


    The two types, float and double, define special values for infinity, both positive
    and negative, representing, as you would expect, positive and negative infinity.
    Remember, if you do any math with a number that is infinity, some strange things
    will happen. A positive infinity plus 1 will not be anything other than a positive
    infinity, as will positive infinity minus 1.


    Pick one of these two options to use:


    ```

    double a = double.PositiveInfinity;

    ```


    ```

    float b = float.PositiveInfinity;

    ```


    or:


    ```

    double a = Double.PositiveInfinity;

    ```


    ```

    float b = Single.PositiveInfinity;

    ```


    # NaN


    NaN stands for Not a Number and this is another one of the special values. This
    can also come up when you do something a little mad, such as trying to divide
    infinity with infinity. There is also a specific way to access the value:


    ```

    double a = double.NaN;

    ```


    ```

    float b = float.NaN;

    ```


    ```

    double c = Double.NaN;

    ```


    ```

    float d = Single.NaN;

    ```


    # E and PI


    These are both special numbers that may be made use of a lot, depending on what
    you are doing. It is worth understanding a little about them right now although
    we will touch on them again later.'
