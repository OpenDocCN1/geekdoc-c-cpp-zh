  md: '# Defining Other Form Properties


    As well as the border style, there are several other properties in the Form class
    that are used to control many parts of the behavior and appearance of the Form.
    Some of the more common ones that the Form class exposes are:


    +   - **BackColor** – This is used to specify the form’s background color. The
    value is set by default, to Control and that will specify that the background
    color should be the one used by the Windows color scheme currently in use.

    +   - **Size** – This specifies the form dimensions.

    +   - **StartPosition** – This specifies the location where the form is to be
    created.

    +   - **Text** – This specifies the caption for the form. By default, the value
    is the name given to the form, but usually, this should be changed to something
    that has more meaning.

    +   - **WindowState** – This is used to specify the current form state and that
    comes from the WindowState enumeration.


    The Color structure represents the .NET framework 32-bit color values. The color
    will be specified as a value of 32-bits made up of ARGB – alpha, red, green, blue
    – components. The Color type has many different predefined colors, not just the
    common ones like Red, Green, Blue or White, but some more exotic ones like BurlyBrown,
    AliceBlue, SeaGreen, and more. The code snippet below shows the color type required
    to change the color of the form background:


    ```

    BackColor = Color.SeaGreen;

    ```


    The StartPosition property is used to specify the position of a new form, and
    by default, it is set as WindowsDefaultLocation.


    The FormWindowState property is updated when the application is executing and
    is set as one of these values, depending on what the current state is:


    +   - Minimized  Form is currently minimized.

    +   - Maximized  Form is currently maximized.

    +   - Normal  Form is currently at its normal size.'
