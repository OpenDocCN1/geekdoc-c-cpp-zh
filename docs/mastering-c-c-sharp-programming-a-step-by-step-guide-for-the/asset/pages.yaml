    \ class. Then we had a parameter within the constructor that we also called name\
    \ and this has method scope because it can only be used in the method or constructor.\n\
    \nThis creates something known as name hiding. While we can use the instance variable\
    \ called name within the class, including our constructor, there is now another\
    \ one on the constructor that has the same name and is also usable. Which one\
    \ are we referring to when"
