    : 'extern'? 'unsafe'? 'static'\n| 'unsafe'? 'extern'? 'static'\n| 'extern'? 'static'\
    \ 'unsafe'?\n| 'unsafe'? 'static' 'extern'?\n| 'static' 'extern'? 'unsafe'?\n\
    | 'static' 'unsafe'? 'extern'?\n;\n\nembedded_statement_unsafe\n: unsafe_statement\n\
