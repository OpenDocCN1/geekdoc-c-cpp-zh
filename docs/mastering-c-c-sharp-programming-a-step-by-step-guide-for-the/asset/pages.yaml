    # Typecasting


    Usually, when you use two things of the same type in a math calculation, like
    two ints, for example, the result will be of the same type. But what about doing
    a math calculation using two types that are not the same? What if, for example,
    you wanted to add an int and a long type? The answer lies in typecasting or casting
    for short.


    Casting is a great C# feature because it lets you convert one type to another
    type. C# has two types of casting – implicit and explicit. Implicit casting is
    automatic, magic if you like, where the conversion happens without you needing
    to do anything. Explicit, on the other hand, is where you have to indicate that
    you want the conversion or it won’t be done.


    In general, implicit casting happens automatically when you are going from a narrow
    to a wider type. What does that even mean? Go back to the section on types and
    look over the byte size. In C#, an int will use 32 bits and a long will use 64
    bits. C# will implicitly cast ints to longs wherever it thinks they need to be
    cast without you telling it to do it.


    So, you could do this:


    ```

    int a = 8521;

    long b = 159842965;

    long sum = a + b;

    ```


    When the adding is done, a is taken and cast to a long; it is added to b, and
    then put back into the variable called sum.


    A floating point type is wider than an integer type, so, where needed, C# converts
    or casts ints to floats.


    For example:'
