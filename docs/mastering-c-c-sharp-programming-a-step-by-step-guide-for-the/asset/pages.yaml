  md: '# # C# Comments


    Comments are a way for you to write notes on your code to tell you what it is
    doing and, written correctly, the computer will ignore them. To write a comment,
    you simply add a pair of slashes (//) in front of the comment and, if you want
    to add a comment that goes over several lines, you use slashes and asterisks –
    for example


    ```

    /* this is a comment

    that goes over multiple

    lines*/

    ```


    What we are going to look at is what they are, why and how you need to use them.
    There are three ways. Many programming tutorials either ignore these or they hide
    them away toward the back of the book. I choose to put them under your nose right
    at the start – that’s how important they are!


    So, what is a comment? Basically, it is a piece of text that the human eye can
    read and that the computer ignores. You should get into the habit of using them
    in your code. They are useful to describe what a piece of code does – you might
    come back to it later or someone else might read it, and comments will tell you
    exactly what’s what.


    However, it isn''t enough just to write any old text. Your comments have to be
    good because they are the only explanation you have for code that is potentially
    tricky. It is the main way that a coder will communicate with other coders who
    look at their work, be it five minutes after you write it or five years.




    Basically, there are three ways to do this. We’ll only look at two because the
    third way doesn’t apply to anything we will be doing for some time.


    The first way is to use a pair of slashes at the start of the comment and anything
    that follows it is considered part of the comment and ignored by the computer.
    You will note that, in Visual Studio, when'
