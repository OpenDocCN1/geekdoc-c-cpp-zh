    edit the code while, on another tab, C# .NET will keep the form in design mode
    open. Below is the standard contents of Form1.cs:


    ```

    using System;

    using System.Drawing;

    using System.Collections;

    using System.ComponentModel;

    using System.Windows.Forms;

    ```'
