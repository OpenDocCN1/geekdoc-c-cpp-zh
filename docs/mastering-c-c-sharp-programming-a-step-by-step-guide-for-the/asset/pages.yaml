  md: '+   - A managed object is one that is created, managed or otherwise within
    the CLR scope; is pure .NET code that is runtime-managed; is within the .NET scope;
    any .NET framework classes – string, bool, int variables (all referenced as managed
    code).

    +   - An unmanaged object has been created externally to the .NET library control,
    is not CLR-managed and examples include COM objects, connection objects, file
    streams, Interop objects, pretty much any third-party library that is referenced
    within the .NET code.


    # Cleaning up Unmanaged Resources


    When unmanaged objects are created, GC cannot clean them; it is up to the programmer
    to explicitly release the object when they are no longer needed. On the whole,
    unmanaged objects tend to be wrapped around or hidden around resources in the
    operating system, such as database connections, file streams, network-related
    instances, class handles, pointers, registries, etc. GC takes responsibility for
    tracking the lifecycle of every managed and unmanaged resource but it is still
    up to you to release the unmanaged objects. There are a few ways this can be done:


    +   - Implementation of the Dispose method and the IDisposable interface

    +   - Through a “using” code block


    Implementation of the Dispose method is done in two ways:


    +   - Use the SafeHandle class. This is an abstract class that is built-in and
    contains the IDisposable interface and CriticalFinalizerObject, implementing both.

    +   - Override the Object.Finalize method, which will clean the unmanaged resources
    that a specific object uses before the object is destroyed.


    Let’s have a look at some code which is used to dispose of the unmanaged resources:


