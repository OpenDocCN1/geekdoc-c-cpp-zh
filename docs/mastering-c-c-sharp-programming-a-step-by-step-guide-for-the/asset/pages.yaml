  md: '# Delegates


    Before we start on delegates in C#, it would help to understand what a delegate
    is in the real world. You probably already know this but a delegate is someone
    (in some cases, something) that does something or takes on responsibility for
    something on behalf of someone else (or something).


    You’ll have heard the terms, ‘delegate’ and ‘delegation’, which is a just a group
    of delegates usually in connection with politics and government. Most of today’s
    governments run on a system of votes where a person or group of people is chosen
    to do some work. These people are the politicians, the representatives, or the
    delegates of the people who put their cross in the box and, in theory, it is down
    to them to take on responsibility for something that they were chosen to do, in
    whatever way is best.


    # Delegates in C#


    In C#, we don’t have people, we have our methods. These are nothing more than
    code blocks that do certain things. They do that task in their own way and, to
    all intents and purposes, we really don’t care how it’s done, so long as it is
    done satisfactorily. Not all methods will do the exact same kind of work. Some
    will print something for a user to see, others do the math, and then there are
    those that just cause the program to crash.


    One concept in C# is delegates and, I will be the first to admit that it may not
    be all that easy to grasp – but that is why it is in the advanced section, after
    all. As basic as I can put it, a C# delegate is saying that it has some work that
    has to be done and it wants to palm it off to someone or something that can do
    it. A delegate will indicate what information they are handing off, i.e. the work
    they need to be done, along with an indication of what they want back.


    They do this by stating that, if a method wants to take on the work, it must have
    specific parameters and it must return a specific type. However, unlike the interface,
    it really doesn’t matter what the'
