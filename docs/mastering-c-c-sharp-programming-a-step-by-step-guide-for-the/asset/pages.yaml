- pgno: 195
  md: 'we reference it within the constructor? It would be the one that was created
    with method scope because it has the smaller scope.


    What we have is a situation where a variable is hiding another one, based just
    on the variable name. That''s fine,but what happens if we want to access the instance
    variable that has the larger scope?


    There are a couple of ways we can do this. First and simplest way would be to
    give each variable a different name so that one wouldn’t hide the other. There’s
    nothing wrong with that. We could have given the parameter a name of playerName
    rather than just name but trying to think of different names all the time will
    get tiring quickly because the names would still have to be similar enough that
    you know what they were.


    A second way of doing things is the more common approach. It involves naming your
    instance variables in such a way that you know exactly what they refer to while
    maintaining consistency. For example, you could add m_ to the start of all the
    names of your instance variables, so you would have m_livesLeft, m_score, for
    example. Using this, your names are easily identifiable but are not the same as
    the method scope variables.


    Let’s be clear – this is a common approach but it really isn’t the best one. Why?
    Because it does not add to the readability of your code. At the end of the day,
    we’re all about making that code easy to read. All of the em’s dotted throughout
    mean you have to sit and think about what the variable actually does. What about
    when you read your code out loud? You find yourself having to actually say “em
    underscore and then the variable name. However, at the end of the day, it all
    comes down to which approach you find easier.


    There is another one that we haven’t discussed yet and, personally, I think this
    is the best one. Because of that, this is how I will be demonstrating to you throughout
    the code examples. If you want to use a different way, make sure you are consistent
    in changing things throughout your code.'
