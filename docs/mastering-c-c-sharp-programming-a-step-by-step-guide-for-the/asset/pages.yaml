  md: '# Enumerations


    Enumerations are refreshingly easy to grasp. Enumerations are often called enums
    for short and they are a great way of defining a variable of your own – the first
    of several ways that you will learn.


    Enumeration is derived from enumerate and that means “to count off, one after
    another” and that is pretty much what we will be doing. We’ll start by looking
    at how to use enumerations, then, we’ll discuss why they are valuable. It makes
    sense to look at what they are before learning how helpful they are – you will
    see what I mean. Lastly, we’ll recap how to use them.


    # The Basics of Enumerations


    Knowing when to use an enumeration could be helpful.


    Let’s assume that you want to track something that has a known set of values,
    albeit a small and specific set, that we can use. The most obvious one would be
    the days of the week and you could do this by defining Sunday as 1, Monday as
    2, and so on.


    ```

    int dayOfWeek = 3;


    if(dayOfWeek == 3)

    {

    // Do something because this is Tuesday.

    }

    ```


    What would be better to make things easier to read, you could create a variable
    for each day:


    ```

    int sunday = 1;

    int monday = 2;

    int tuesday = 3;

    ```'
