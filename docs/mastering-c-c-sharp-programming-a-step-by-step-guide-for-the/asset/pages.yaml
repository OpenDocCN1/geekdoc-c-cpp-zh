  md: '# Interfaces


    In our last OOP topic, we are going to look at C# interfaces. These are much like
    the abstract classes we already used earlier so we’ll start off by talking about
    what they are, and how to create one, before talking about multiple inheritance,
    the lack of support for it, and how we can use an interface to get a similar effect.


    # What is an Interface?


    As a concept, an interface is nothing more than a list of things seen by the outside
    world, presented by the object, and allowing users/players to interact. Take your
    television, for example. No doubt it has buttons on it and they are how you interact
    with it. The interface for an object can be seen as a contract between the object
    and the outside world, which allows it to do specific things.


    In C#, we have a built-in construct called an interface and this does exactly
    the same – provides a list of methods that a class that makes use of what the
    interface must provide.


    In the last section, we looked briefly at abstract classes and the interface is
    very similar. In fact, if you had one of the abstract base classes and every method
    in it was abstract too, and your class didn’t have any properties or methods,
    you would pretty much have an interface. That kind of abstract class is called
    a pure abstract base class in C++ because it has no interface construct built-in.


    # How to Create an Interface


    If you can create a class, you can create an interface because they are incredibly
    similar. Let’s assume that our program needs to write files out (we’ll discuss
    that later) but you also want the ability to write multiple file formats. A different
    class can be created for each type of file writer but all of them will do pretty
    much the same as far as calling code goes. Each will have the exact same interface,
    so we create a file writers interface like this:


    ```

    using System;

    ```


    ```

    using System.Collections.Generic;

    ```'
