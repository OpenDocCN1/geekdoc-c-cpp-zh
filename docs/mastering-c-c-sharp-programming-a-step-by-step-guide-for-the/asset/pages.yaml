    (more about classes later, at which point, we’ll be back to math again) and we
    use code like this:


    ```

    double radius = 3;


    double area = Math.PI * radius * radius;


    // pi is more likely to be used than e.

    double eSquared = Math.E * Math.E;

    ```


    Do you remember that we created a pi variable a while back? There isn’t any need
    to do that anymore because, as you can see, there is already one.


    # MinValue and MaxValue


    Let’s look at these two values. Most numeric types in C# will define both a MinValue
    and a MaxValue inside them and these are used to hold the minimum and maximum
    values the type is able to hold. These are accessed in the same way as infinity
    and NaN for the floating points:


    ```

    int maximum1 = Int32.MaxValue;


    int maximum2 = int.MaxValue;


    int minimum1 = Int32.MinValue;


    int minimum2 = int.MinValue;

    ```


    # Overflow and Underflow


    So, let’s think about this. The short type has a value that can go up to 32767.
    What would happen if we did this:


    ```

    short a = 30000;


    short b = 30000;

    ```'
