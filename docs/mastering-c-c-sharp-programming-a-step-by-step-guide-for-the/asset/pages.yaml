    # Implicit Fall-Through


    If you have been using Java or C++ you might already know the little trick of
    when the break statement is left off, a case block will “fall through” to the
    next one. So, in those two languages, you could do this:


    ```

    // This won’t work in C#

    switch (menuChoice)

    {

    case 1:

    Console.WriteLine("You chose option 1.");

    case 2:

    Console.WriteLine("You chose option 2.  Or maybe you chose option 1.");

    break;

    }

    ```


    Because we don’t have the break with the first case, the code is executed and
    then carries on down to the second case, until a break statement is reached. In
    C#, this cannot happen because every case block has to have a break statement.'
