    \ unmanaged_type '[' expression ']'\n  ;\n```\n\nThe unmanaged_type indicates\
    \ the item type to be stored in the location that was just allocated and the expression\
    \ is used to indicate how many items there are. Together, these two are used to\
    \ specify the allocation size that is required. Because the stack allocation size\
    \ is not allowed to be negative, specifying the item number as a constant_expression\
    \ that will evaluate as a negative value will result in a compile-time error.\n\
    \nA form stackalloc T[E] is a stack allocation initializer that requires T to\
    \ be an unmanaged type and that E is an int expression. E* sizeof(T) bytes is\
    \ allocated by the construct from the call stack and a type T* pointer is returned\
    \ to the allocated block. Should E be a negative value, the result is undefined\
    \ behavior. Should E be zero, there won’t be any allocation and the returned pointer\
    \ will be implementation-defined. If there is insufficient memory for allocation\
    \ of a specified size of block, the result will be a System.StackOverflowException.\n\
    \nThe newly allocated memory content is undefined.\n\nStackalloc cannot be used\
    \ to free memory explicitly. All the stack allocated blocks of memory that are\
    \ created when a function member is executed will be discarded automatically when\
    \ the function member returns.\n\nFor example:"
