- pgno: 79
  md: '– it is a simple one. You should have one of two answers – 3.5 or 3 with a
    remainder of 1. Both of these are right.


    Now, open C# and input the following code in the window – look at the result to
    see what happens:


    ```

    int a = 7;

    int b = 2;

    int result = a / b;

    ```


    See it? 3. Just 3. Not 3 with a remainder of 1 and not 3.5. Just plain and simple,
    3. Why? This is not your standard division, not the stuff you learned in school
    anyway. Instead, it is called integer division and, in that, fractional numbers
    do not exist.


    How does integer division work?


    It takes the biggest number that it can evenly divide and, regardless of how close
    it may be, it will ignore the fractional bit. For example, 99/100 would be 0,
    even though the actual answer is 0.99.


    When you do any division using the int type, integer division comes into play,
    as it does when you use the long, short or byte type, or an unsigned equivalent
    – ulong, ushort, or ubyte.


    When you mix up the data types, things start to get a bit tricky:


    ```

    int a = 7;

    int b = 2;

    float c = 4;

    float d = 3;

    float result = a / b + c / d;

    ```


    In this, a/b is 3 as it was before. However, c/d takes care of the floating point
    division, which is the division you are familiar with, providing a result of 1.33333.
    Adding both together provides a result of 4.33333.'
