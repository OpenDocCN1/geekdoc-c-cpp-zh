  md: '# Parallel Class and PLINQ


    PLINQ or Parallel LINQ is nothing more than a parallel implementation of a LINQ
    pattern. PLINQ queries are very much like standard LINQ queries to Objects. And
    like a standard LINQ query, the PLINQ query operates on any in-memory IEnumerable
    or any IEnumerable<T> data source. Their execution is deferred, meaning that execution
    does not start until the specified query has been enumerated.


    The main difference is PLINQ tries to make use of every processor on a system
    and this is done by partitioning each data source into segments; the data query
    is then executed on each of the segments on a separate worker thread on multiple
    processors and in parallel. In some cases, using PLINQ will ensure that the query
    is much faster.


    Using parallel execution, PLINQ can provide some serious improvements to performance
    against the legacy code for some query types and that can often be achieved simply
    by adding a query called AsParallel to the data source. However, with some query
    types, using parallelism will only slow them down so it is important that you
    understand PLINQ.


    We will be using Lambda expressions to define delegates and we are going to go
    over PLINQ classes, and how PLINQ queries are created. What you won’t get is an
    in-depth look at everything, but more of an overview with examples.


    # The ParallelEnumerable Class


    Most of the PLINQ functionality is exposed in the class called System.Linq.ParallelEnumerable.
    Both this and the other namespace types for System.Linq are compiled into the
    assembly called System.Core.dll and the default projects in Visual Studio (C#
    and Visual Basic) will all referencing the assembly and they will import the relevant
    namespace.


    With ParallelEnumerable, you get the implementations of every standard query operator
    that is supported by LINQ to Object but'
