    # Using Message Boxes to Display Information


    The class called MessageBox is used to provide user interaction; a message box,
    which is a special type of dialog box with a message in it, is displayed to the
    user. The box may also contain buttons and an optional icon. We tend to use these
    to present information that we can format into a text message.


    The one thing that you can’t do with the MessageBox class is create an instance
    of it. Instead, the box is displayed using the static Show method:


    ```

    MessageBox.Show("A simple message box");

    ```


    This will show a very basic message box and this has the string that was passed
    in as a parameter and a button that says OK. There are no less than 12 overloaded
    Show method versions that provide you with a lot more flexibility in how your
    message box behaves, and that includes the icons and buttons that are shown on
    the box.


    The next section explains what options the overloaded method versions provide.


    If you want a title or a caption on the message box, a second string needs to
    be passed to MessageBox.Show, like this:


    ```

    MessageBox.Show("A simple message box", "MessageBox demo");

    ```


    # Specifying Message Box Buttons'
