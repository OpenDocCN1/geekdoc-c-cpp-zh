    The idea behind the name is to make it easy to know what the variable is for,
    not just by you but by anyone who looks at your code. It’s no good giving it a
    name only to find that six months later you can’t for the life of you remember
    what it was for because the name meant nothing. Writing readable code includes
    writing good variable names and you cannot ignore this.


    To start with, there are a number of rules built-in to C# programming regarding
    naming variables. Every variable name must start with a letter, either a lower-case
    or an upper-case letter. After that, you can have any combination of letters,
    numbers, and the _ (underscore) character. Do anything else and the compiler will
    throw a hissy fit and will refuse to compile your program.


    Most importantly is naming your variables in a way that describes what goes into
    them. For example, if you are storing game scores in'
