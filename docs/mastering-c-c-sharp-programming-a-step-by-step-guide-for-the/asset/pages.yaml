    # Controlling a Windows Forms Application


    We use the class called Application to provide Windows Forms applications with
    application-level behavior. You do not directly create instances of this class.
    Instead, static methods and properties that the class exposes are invoked. The
    Application class provides several static methods; like Run, or Exit, and this
    lets you control the way your application starts and stops. The static properties
    that the class exposes will let you determine details such as the path the application
    data is stored on. While you can’t create an instance of the class, we will look
    at how context objects and event handlers can be used to control how the application
    behaves.


    # Starting an Application


    We call the static method of Application.Run to start a Windows Form application,
    like this:


    ```

    Application.Run(new Form1());

    ```


    The Run method has three overloaded versions and the example above is using the
    most common version – it will accept the application’s top-level form as a parameter.
    The Run method creates a message loop and the form that was passed in as a parameter
    is displayed. This Run version is automatically called .NET Windows Forms projects.


    You could also call the method without any parameters:


    ```

    Application.Run();

    ```'
