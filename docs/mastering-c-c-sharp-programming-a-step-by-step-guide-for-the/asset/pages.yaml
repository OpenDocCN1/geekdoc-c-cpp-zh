    \  : 'unsafe'\n  ;\n\nmethod_modifier_unsafe\n  : 'unsafe'\n  ;\n\nproperty_modifier_unsafe\n\
    \  : 'unsafe'\n  ;\n\nevent_modifier_unsafe\n  : 'unsafe'\n  ;\n\nindexer_modifier_unsafe\n\
    \  : 'unsafe'\n  ;\n\noperator_modifier_unsafe\n  : 'unsafe'\n```"
