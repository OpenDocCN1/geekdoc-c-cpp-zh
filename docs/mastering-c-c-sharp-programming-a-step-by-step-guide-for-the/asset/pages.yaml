  img_proc: true
- pgno: 279
  md: 'the issue or how it should be fixed. All it knows is, there is a problem, and
    it just doesn’t know how to move on.


    Exceptions give methods a way to say that they ran into a problem and they cannot
    continue in an intelligent manner. The error, together with any available information
    about the problem, is sent back to where the code or method was originally called
    from, with the hope that someone else, somewhere, can come up with a way to fix
    it.


    If something else can fix the problem, the message will be intercepted and that
    something will do something to solve it. It could be as simple as letting the
    user know that there is an issue and they need to try again.


    If there isn’t anything that can handle the error, it will continue to go to higher
    method calls, right back to the Main method. If the Main method can’t handle it,
    the program will end and the user will be left wondering how to get their lost
    file back.


    The idea is that, regardless of what the error is, something should be able to
    handle it so the program can continue in some way regardless of the problem because
    the exception was handled.


    # "Catching" Exceptions


    You could think of an exception as being something like the Hot Potato game. Never
    played it? It has a very simple concept. A group of people standing a circle and
    they throw an object, the hot potato (it may not actually be a potato) from one
    person to the next as quickly as they can. There will be some music playing and,
    when that stops, the person who is left holding the object is out of the game.
    The idea is to throw it to the next person and get rid of it as quickly as you
    can.


    When your computer program has a problem and something goes badly wrong, if the
    computer cannot fix it, you will get an error message created, all neatly packed
    into an object that has the Exception type. That message is then passed up the
    chain very quickly back to the method responsible for calling it. That method
    will'
