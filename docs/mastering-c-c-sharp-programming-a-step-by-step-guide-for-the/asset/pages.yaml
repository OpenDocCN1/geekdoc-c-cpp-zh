  md: 'what it won’t do is try to parallelize each of them. As well as those query
    operators, you will also find some methods in the ParallelEnumerable that enable
    certain behaviors that are specific only to parallel execution. You can see what
    these methods are below:


    | ParallelEnumerable Operator | Description |

    |---|---|

    | el | This is the PLINQ entry point and it is used to specify parallelization
    of the remainder of the query if it can be done. |

    | ential | This is used to specify that the remainder of the query should be run
    as a non-parallel LINQ query and sequentially. |

    | ed | This is used to specify that the source sequence ordering should be preserved
    by PLINQ for the remainder of the query or until there is a change to the ordering,
    for example, if an orderBy clause is used. |

    | ered | This is used to specify that there is no requirement for the source sequence
    ordering to be preserved by PLINQ for the remainder of the query. |

    | cellation | This is used to specify that the state of the cancellation token
    provided should be monitored periodically by PLINQ and, if requested, execution
    should be canceled. |'
