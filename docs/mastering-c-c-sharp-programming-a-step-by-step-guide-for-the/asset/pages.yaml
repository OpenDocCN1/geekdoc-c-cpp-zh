    would include squares, triangles, rectangles, pentagons, and so on. You could
    create a class called Polygon that contains the number of sides on the polygon
    and perhaps also has an array in it that contains the vertices or corner positions
    of the polygon.


    You could use this Polygon class to represent any one of the polygons but, using
    a square as an example, you might want to do something else with it. For instance,
    you might want to create a square using a single size – the height and width of
    a square are the same lengths – or you might want to create a method to return
    the square area.


    One way of doing it would be to create a class called Square and this class would
    contain everything from the Polygon class but everything else you need. So, what’s
    the problem?


    The problem is that you now have a class that is completely different and you
    if wanted to change how polygons were worked with, you would also need to change
    how squares are worked with. On top of that, while you could have an array of
    polygons (Polygon[] polygon) there is no way of adding squares to it - yes, I
    know that a square is a polygon and we should be able to treat it as such.


    This leads us to the section on inheritance.


    A square is most definitely a polygon but it is a bit more specific than that
    – a square is a special polygon type that has special attributes. Whatever a polygon
    can do, a square can do it too because, yes, that square is a polygon.


    This is known, in programming circles, as an ‘is-a’ type of relationship and it
    is such a common thing that most programming languages facilitate it by creating
    constructs.


    The C# construct that lets us do this is known as inheritance and this lets us
    create that class called Polygon and create a class called'
