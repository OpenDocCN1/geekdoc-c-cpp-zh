  md: "Anonymous methods were first introduced with v2.0 of C# and they are code blocks\
    \ that are used with delegates parameters. You can use the anonymous method wherever\
    \ you want and, if you remember back a few sections, the delegate is defined in\
    \ the line – there is no method name but there is a method body and optional parameters.\
    \ The parameter scope in an anonymous method is the anonymous code block for the\
    \ method. Lastly, you can use generic parameter types with the anonymous method,\
    \ just like you would with any other method.\n\nLet’s see if we can make this\
    \ clearer.\n\nFor a piece of client code to handle an event, a method should be\
    \ defined and that method should match the associated delegate’s signature. We\
    \ call this an event handler, for example:\n\n```\nPredicate<Employee> empPredicate\
    \ = new Predicate<Employee>\n(FindEmp);\n```\n\n```\nEmployee empl = listEmp,Find\
    \ (emp => FindEmp(emp));\n```\n\n2 references\n\n```\nPrivate static bool FindEmp(Employee\
    \ emp)\n{\n    Return emp.ID == 05;\n}\n```\n\nThese are two separate pieces of\
    \ one piece of code. What we have done is placed an overhead coding in the instantiation\
    \ of delegates because we need a separate method. It is worth noting that we only\
    \ call the event handlers from the part of the program that invokes the delegate,\
    \ and nowhere else.\n\nYou can associate delegates straight to statement block\
    \ at the time the event is registered. To delegate the code block, we use the\
    \ delegate keyword and it is called an inline delegate or an anonymous method."
