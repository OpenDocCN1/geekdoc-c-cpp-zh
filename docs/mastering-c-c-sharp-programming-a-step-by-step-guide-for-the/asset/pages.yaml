- pgno: 358
  md: 'As we said before, if your program knows there is an extension method, we can
    do this:


    ```

    string message = "I''m so sorry, Simon.  I really can''t do that.";

    ```


    ```

    Console.WriteLine(message.ToRandomCase());

    ```


    The extension method can be used as if it was part of our original class.


    # Quick Primer


    +   - Extension methods help us to create methods that seem as though they are
    part of a class, like the string class, when you can’t access the class to modify
    it, and then help us to add the method.

    +   - You must add an extension method as a static method in a static class. The
    first parameter must be the type for the class you want the method added to and
    you must use the ‘this’ keyword, i.e. public static class StringExtensions { public
    static string ToRandomCase(this text for the string){ /*. We put the method implementation
    here */} }.

    +   - When you have created an extension method, it can be called just as if it
    were a proper part of the class: string text = “Hello World!”; randomCaseText
    = text.ToRandomCase();.

    +   - An extension method is just a way of making your code look presentable and
    easier to read. Whatever you write, the compiler will rewrite it whenever the
    extension is method is used to call the static method directly.


    Well, that brings us to the end of this advanced section, but we are not finished,
    not by a long shot. First, we’ll take a break. I’ve given you some questions to
    answer in the next section (answers at the back of the book) and then we’ll move
    on to more advanced topics.'
