  md: '# Part 2: Intermediate Guide


    # Methods


    Just think for a minute about programs like Microsoft Word or games like Gears
    of War. How much code do you think is involved in creating programs of that size?
    Let’s face it; they are massive programs, worlds away from the tiny ones we’ve
    been looking at.


    How would you manage and keep track of that code? How would you know where to
    look if a bug arose?


    As a programmer, you will learn that, when you have large programs like this,
    the easiest way to deal with big programs is to break them down. Like you would
    any large task, taking it down into smaller chunks makes it easier to manage.
    What’s even better, is you get the chance to reuse each chunk too. This is an
    approach you will see very often and it’s known as “divide and conquer”.


    C# has a neat feature that lets us break our programs down and it’s called a method.
    You might know these as functions or procedures from other languages and the way
    they work is really quite simple. You can place code inside a method and then
    you can access it whenever and wherever you want. A method can be reused as many
    times as you want, which means you don’t need to keep on writing the same piece
    of code over and over again. Think of the time this can save you!


    We’re going to look at how methods are created, and how they are used – a process
    known as calling a method. Then we’ll look at how to retrieve data from a method
    and how to send to it as well. That will be followed by a discussion on a process
    known as overloading – creating many methods with the same name – followed by
    yet another look at our Math class and how it works with methods. Lastly, we’ll
    look at a very powerful trick that can be used with a method, called recursion.


    # Creating a Method'
