- pgno: 51
  md: '# Variables


    Variables are an incredibly important fundamental of C# programming - well, of
    any programming really. We use variables to store data and when you write a program
    that does something real, it will use those variables. We’ll be looking at what
    they are, how to create them, and how to add to them, as well as looking at all
    the different variable types.


    What are they?


    One of the most important parts of any language and any program you write in that
    language is being able to store information and data. For example, if you were
    writing a game, you might need to store data on how many lives a specific player
    had left or their game score.


    From your math classes, you might remember discussing variables but these would
    have been unknown quantities that you needed to solve. With programming, things
    are different. Your variable is a box, something that you put things into. You
    can put anything you like into the box so that it contains varying or variable
    contents, hence the name.


    Like most programming languages C# has many of these boxes, each one able to store
    a different kind of data, such as characters, numbers, and so on. It may (or may
    not) be of interest to you but languages like this are known as “strongly typed”
    because they have so many boxes. Those languages that have just one box that can
    hold anything are called “weakly typed”.


    We’ll look at the different types of variables in C# but first, we need to see
    how to create one.


    # Creating Variables


    The best way to learn how to create a variable is to actually do it. So go ahead
    and open Visual Studio and create a new console project (refer back to the first
    chapter if you can’t remember how to do this).'
