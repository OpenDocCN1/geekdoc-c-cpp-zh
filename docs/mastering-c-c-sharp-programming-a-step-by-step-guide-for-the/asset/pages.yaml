- pgno: 28
  md: 'using System


    This is the source code for your program and is what you will be working with
    – we’ll take a closer look at it in a minute.


    Project Explorer should be on the right side of the screen and this is where you
    will see all the files contained in your project and that includes the main file
    we’ll be doing some work on shortly. This is called Program.cs and the .cs file
    extension tells you that it is a text file with C# code. To see the code in any
    of the files in Explorer, just double-click on them.


    At the bottom of the screen is Error List. When you are writing C# code, if you
    make a mistake and the computer can’t work out what it should mean, you will see
    an error in that part of the screen – it’s very helpful as it tells you exactly
    where the error is and what is wrong with it so you can figure out how to fix
    it.


    At the bottom right of the screen, you may see a window called Properties – this
    shows you all the properties associated with an item or file you select – don’t
    worry about this right now.


    If you want a window on view that you can’t see, click on View -> Other Windows
    and click the window you want. Right now, all you need is the main editor windows
    and the Program.cs code showing in it.


    # Saving Your Project


    Your project has not been saved automatically; this is important – if you were
    to spend ages writing a load of code, editing it, compiling it, and then running
    it, only to have it crash, you would lose everything. Get into the habit of saving
    your program! Click on File -> Save All and save it in the default directory called
    Projects.


    # Modifying Your Project


    Right! Now down to work.


    In your Editor window, you should see this code:


    ```

    using System;

    ```'
