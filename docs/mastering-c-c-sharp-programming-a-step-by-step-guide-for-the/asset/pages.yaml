    # Cancellation


    PLINQ has full integration with .NET Framework 4 cancellation types. Because of
    that, we can cancel a PLINQ query, unlike the sequential LINQ to Object query.
    If you want to create a PLINQ that can be canceled, the WithCancellation operator
    should be used on the query and a CancellationToken instance used as the argument.
    When the IsCancellationRequested token property is set as true, it will be noticed
    by PLINQ which will then cease processing on the threads and an OperationCancelledException
    will be thrown.


    # Exceptions


    When a PLINQ query is executed, exceptions might be thrown from different threads
    all at the same time. Plus, the code needed to handle the exception may be on
    a separate thread than the code that caused the exception to be thrown. The AggregateException
    type is used by PLINQ for encapsulating every exception a query throws and sends
    the exceptions right back to the calling thread. On this thread, we only need
    a single try-catch block, but it is possible to iterate through every encapsulated
    exception in AggregateException; any that can be recovered from safely will be
    caught. There are rare cases where exceptions can be thrown that aren’t wrapped
    up in the AggregateException; ThreadAbortExceptions will also not be wrapped.


    When an exception is allowed back up to the joining thread, the query may continue
    processing a few items after the exception is raised.


    # Custom Partitioners'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'There will be cases where the query performance can be improved and that is
    done by writing a custom partitioner that will take full advantage of a source
    data characteristic. Inside the query, the enumerable object that is queried is
    the custom partitioner:


    ```

    int[] arr = new int[9999];

    Partitioner<int> partitioner = new MyArrayPartitioner<int>(arr);

    var query = partitioner.AsParallel().Select(x => SomeFunction(x));

    ```


    PLINQ has support for a set number of partitions, although, during run time, there
    is the chance that the data can be dynamically assigned to the partitions for
    the sake of load balancing. The for and foreach statements only support dynamic
    partitioning and this means that, at run time, the number of partitions will change.


    # Measuring PLINQ Performance


    Sometimes we can parallelize a query but there are costs to this – setting up
    parallel queries has overheads that far outweigh what benefit is gained in terms
    of performance. If a query doesn’t need to do a lot of computation or if there
    is a small data source, PLINQ queries can still be slower than sequential LINQ
    to Object queries. The Parallel Performance Analyzer can be used in Visual Studio
    Team Server to find any bottlenecks in processing, to compare how various queries
    perform, and to work out whether sequential or parallel processing is being used.'
  merge: -1
  img_proc: true
