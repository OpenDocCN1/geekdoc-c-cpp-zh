  md: '# Error Handling: Exceptions


    On occasion, things will go wrong. It happens even with the most seasoned of programmers.
    A user might have clicked a wrong button; they may have clicked a sequence of
    buttons in the wrong order. Perhaps a freak hurricane wind took out your network
    cable.


    The point I am trying to make is that anything can go wrong and that’s what we
    are going to talk about here – how to handle these errors properly in a way that
    keeps the negative effect on the user to an absolute minimum while the problem
    is fixed in the section of code that caused the error.


    Let’s start with an example. A user types in the wrong input, perhaps a piece
    of text or a letter when it was meant to be a number. The code we start with could
    look like this:


    ```

    Console.Write("Type in a number: ");

    string userInput = Console.ReadLine();

    int number = Convert.ToInt32(userInput);

    ```


    If you are not aware of what might happen if you were to input abc and not a number,
    try it and see what happens.


    If your program is being run in debug mode, it will just freeze up, and Visual
    Express will indicate to you where the problem was – in this example, it will
    tell you that the error was on the line that reads Convert.ToInt32. If your program
    is being run in normal mode, that is the non-debug mode, all that will happen
    is your program will die.


    We have an error here and it needs to be fixed.


    Thankfully, there is a built-in way on C# that lets us do this – it’s called exceptions.


    Exception handling is a very powerful way of dealing with errors. Let’s say that
    one of your methods is attempting to do something and it has gone badly wrong.
    Right now, it’s all a bit of a mess and the method that found the problem might
    not know what bit caused'
