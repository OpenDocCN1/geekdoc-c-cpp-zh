- pgno: 315
  md: "Remember, the C# events are based on the C# delegates so the method we use\
    \ must match the requirements of our delegate – EventHandler. This delegate requires\
    \ a return type of void and it requires two parameters (a sender object, which\
    \ is what triggered the event, and the EventArgs object, which contains information\
    \ about the event that we are raising – this won’t have a lot of information in\
    \ it for this particular situation, but in other events, that could change).\n\
    \nSomewhere in your code (continue to use the Main method for now), create your\
    \ method that will handle that event. Something like this:\n\n```\npublic void\
    \ HandlePointChanged(object sender, EventArgs eventArgs)\n{\n    // When the pointer\
    \ changes, something intelligent should be done; maybe draw the GUI again,\n \
    \   // or update a different data structure or anything you can think of, really.\n\
    }\n```\n\nAttaching event handlers to an event is really quite easy to do and,\
    \ again, the code below can go wherever it needs to go:\n\n```\nPoint point =\
    \ new Point();\n\n// This is the most important bit:\npoint.PointChanged += HandlePointChanged;\n\
    \n// Now, if the point is changed, the event called PointChanged is raised,\n\
    // and HandlePointChanged is called.\npoint.X = 3;\n```"
  merge: -1
  img_proc: true
- pgno: 316
  md: 'The important line in this is the line that attaches the event handle – point.PointChanged
    += HandlePointChanged;. We use the += operator for adding the method to the event;
    if you attempted to attach methods that do not meet the requirements of the delegate
    used by the event the result will be a compile-time error.


    It is also worth noting that you can add as many event handlers as you want to
    any event.


    We can also detach an event handler too, and this is an important thing to do
    when you don’t need to be notified of the event anymore. Depending on how your
    code is organized, if you do not detach events, you could find yourself with one
    event handler attached to an event several times – best case, this will affect
    performance, and worst case, your program will break.


    Detaching an event requires to use the -= operator in a very similar way to using
    the += operator to attach an event:


    ```

    point.PointChanged -= HandlePointChanged;

    ```


    Once the code has been executed, HandlePointChanged is no longer going to be told
    when the PointChanged event happens.


    # Quick Primer


    +   - Events are a very easy way for a piece of code to tell other pieces of code
    that a specific condition is met.

    +   - Events require delegates to do the work so you need to have a basic understanding
    of the way delegates work.

    +   - Creating events in classes requires code much like this: public event EventHandler
    PointChanged;. EventHandler is the delegate that is used by the event handlers
    and PointChanged is an event name.

    +   - Events are raised by checking whether event handlers have been attached
    and then raising it like this: if(PointChanged != null) {PointChanged(this, EventArgs.Empty);
    }.

    +   - When you attach a method it has to meet the needs of the delegate in use
    and it is done by using the += operator: PointChanged += PointChangedHandler;.'
