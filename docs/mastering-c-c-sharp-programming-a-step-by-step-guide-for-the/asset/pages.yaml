    Often, the new keyword is confused with overriding abstract and virtual methods
    and there are two reasons for that – first, it looks much the same. The new keyword
    is being used the same way that override is used. Second, if you omit the new
    keyword and the override keyword, when there is meant to be one of them there,
    the compiler warns you, telling you that one of those keywords needs to be used;
    if you leave the keyword out, by default it will just do what the new keyword
    already does.


    # Quick Primer


    +   - Polymorphism is a Greek term that translates to “many forms”. In OOP, it
    means that derived classes can be created to implement methods in different ways
    from one another and from the base class.

    +   - Base class methods can be marked virtual so that the derived classes can
    use the override method and provide their own implementation.

    +   - Anyone using the derived or base class can call the base class defined method
    and the compiler automatically calls the right method in the derived class. This
    means that the code doing the calling needn’t worry about the implementation that
    is being run.

    +   - You can mark a class as abstract so that an instance cannot be created of
    it. Instead, a derived class instance would need to be created instead.

    +   - Methods in abstract classes can also be marked abstract and no method implementation
    would be provided. The abstract method must be implemented by the derived class
    though, or a compile-time error is thrown.

    +   - When you attach the new keyword to any method, you are saying that you are
    creating a new method that is not related in any way to any base class method
    that has the same name.'
