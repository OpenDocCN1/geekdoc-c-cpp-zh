  md: '# Part 4: More Advanced Section


    # C# Reflection


    We left our advanced section after covering extension methods and now it’s time
    to continue. We start with Reflection, a feature that we use to get the metadata
    on the types we use at runtime. What that means is that you can inspect, look
    at the metadata on those types inside your program – dynamically – and get the
    information that is on the loaded assemblies, along with the types that were defined
    inside them. If you have a C++ background, then you will see that C# Reflection
    is very similar to RTTI, or Runtime Type Information.


    With .Net, using reflection requires that you include a namespace called System.Reflection
    in your program. When you use reflection, get objects of the type called Type,
    are used for representing modules, types, and assemblies. Reflection can also
    be used for dynamically creating instances of types and invoking methods of the
    type.


    In the System.Reflection namespace, there are some types that have already been
    defined:


    +   - Assembly

    +   - ConstructorInfo

    +   - Enum

    +   - EventInfo

    +   - FieldInfo

    +   - MemberInfo

    +   - MethodInfo

    +   - Module

    +   - ParameterInfo

    +   - PropertyInfo

    +   - Type


    Let’s have a look at some code that uses reflection. Here, we start with a class
    named Customer:


    ```

    public class Customer

    ```'
