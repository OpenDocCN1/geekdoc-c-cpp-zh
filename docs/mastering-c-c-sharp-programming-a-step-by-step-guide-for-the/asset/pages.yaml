    There are many different ways of writing the same code.


    # Quick Primer


    +   - When something goes wrong in your program, an exception will give you a
    way of having the bit of your code that found the problem, tell you that something
    is wrong, and then send the execution back to another bit of the code that can
    deal with the reported problem.

    +   - If you are running a piece of code that you think might cause a problem,
    you should wrap the code inside a try-catch block ensuring that the exception
    type is placed inside the catch block parentheses. For example, try {/* code that
    could throw errors goes here */} catch (Exception e) {/* the code that will handle
    the problem will go here */}.

    +   - You are not limited to using the Exception class; you can make use of any
    type that was derived from that class too, such as the FormatException class.
    If you do this, you will only handle exceptions of a specified type while others
    get thrown higher up the call stack.

    +   - Several catch blocks can be strung together, starting with the most specific
    exception type and going to the least specific type. For example, try {} catch(FormatException
    e) {/* format errors are handled here */} catch(Exception e) {/* all other errors
    get handled here */}.

    +   - You can derive from the Exception class to create your own exception types

    +   - To get the process started in your code, the throw keyword is used. For
    example, throw new Exception ("An error occurred").


