- pgno: 327
  md: '# Thread-safety


    That covers the basics of C# threading, but now we will move on to something to
    do with threading that is more advanced. If you’re finished with threads then,
    by all means, go to the next section but I think that what we are going to talk
    about is very important.


    In the last example, each of our threads had its own piece of work to do and we
    had absolutely no overlapping. What if they had to share something? Remember,
    all threads are swapped out at a time the operating system chooses, and at that
    point, a thread could very well be doing some important task.


    Try to imagine that you have a game and it has hundreds of objects in it, such
    as objects and players controlled by the computer. All of these objects have to
    be updated. They are all in one array and an index indicated which object is to
    be updated next.


    We could split all of this work so that separate threads takes care of a different
    bit of it – each thread would be responsible for updating a section of objects.
    Because some of the objects will update quickly and some will take longer, we
    need to look at an approach where the worker threads update the objects, one after
    the other, until all of them are updated.


    When a worker thread has nothing to do, it will call a method to help it work
    out what to do next. Inside the method, the thread can get a reference to the
    object that needs working on and push the index, showing what object needs to
    be worked on, to the next object. This way, when the next thread calls the method,
    it will be given the next object.


    However, this is not quite as easy as we think it should be. What would happen
    if one thread got some more work, picked up the reference to an object to work
    on, but, before it can move the index to the next item, the operating system makes
    the decision to swap'
