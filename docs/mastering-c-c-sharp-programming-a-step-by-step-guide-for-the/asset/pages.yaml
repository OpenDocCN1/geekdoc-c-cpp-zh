  md: 'out the thread; that thread will be paused and the next thread will go in and
    get an object to update and our index hasn’t been updated so the new thread grabs
    the object that the previous thread had. That means that a specific object will
    be updated twice.


    It doesn’t end there. Now the second thread will change that index to the next
    object so the third thread will get the correct object when it requests work.
    That leaves the second thread to carry on with its own updating work. While all
    this is going on, the operating system makes yet another switch and now our first
    thread is back in the mix again. This thread already knows which of the objects
    needs to be updated -the one at index 0 but thread 2 is also updating this. The
    first thread moves on and it moves the index again, onto 2 so the next object
    (1) is skipped over completely. One is updated twice while another is skipped
    altogether.


    There is one main underlying issue – we have two different threads each trying
    to get access to or change the same data and neither has checked that it is safe
    to do this. This can be fixed. There is a way to mark bits of code and ensure
    that one thread can access that section at any one time. We call this thread-safety.
    If a thread reaches the section of code while another one is in it, it will need
    to wait until the first thread has gone.


    This can slow things down quite a bit but the upside is you have consistent data.
    If your code doesn’t need to be made thread-safe, don’t do it, but when you do
    need it, make sure you do it.


    Let’s discuss how to make your code thread-safe. We will need two pieces of code
    for this. When a thread is getting ready to go into a piece of code that has to
    be thread-safe, we use a different keyword – lock. With this, we also need to
    have an object to lock on. The easiest way is to lock on an instance variable
    marked as private so you should go ahead and add one where the method that has
    to be thread-safe is in your main thread controller class:


    ```

    private object threadLock = new object();

    ```'
