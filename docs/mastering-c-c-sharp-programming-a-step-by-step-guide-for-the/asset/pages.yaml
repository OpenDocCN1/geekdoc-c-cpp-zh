    That’s a variable. Not much to it really. There’s a little more to it than that
    though. Creating a variable or defining it as it is known, requires two steps.
    The first step is to indicate the variable type and C# has specific keywords used
    for doing that.


    Remember; the variable type will determine what can be stored inside it. In our
    case, we used an int type which indicates that the variable can store integer
    values. An integer value is a whole number and their corresponding negatives –
    0, 1, 2, 3 4 … and -1, -2, -3, -4 and so on. In the variable type that we defined,
    we can store 100 or we could store 2578, for example, but we cannot store 2.854
    because it is not an integer. We also could store “hotdog” because that isn’t
    an integer either – more about types shortly.


    The second part is to provide your variable with a name. Just keep in mind that
    this name is really only for human use – the computer really doesn’t care what
    the name is and once you pass it to the computer it will rename it to a memory
    location only. Make sure you choose a name that makes sense for what is going
    into the variable.


    In math terms, variables are often named with a single letter, for example, ‘X’.
    In computer programming, variable names are more precise, for example, “score”
    Also, every statement in C# ends with a semi-colon (;), which is how the computer
    knows that it is the end of the statement.


    # Assigning a Value to a Variable


    Once you have declared the type and the name of the variable, you need to give
    it a value. We call this “assigning a value” and we use the assignment operator
    to do it (=). We’ll be discussing operators later in the guide but, for now, add
    this line underneath the last one you input:


    ```

    score = 0;

    ```'
