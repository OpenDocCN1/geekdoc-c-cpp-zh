    # Modulus Operator


    Back in your school days after learning division, you would do something like
    “23 divided by 7 is 3 with a remainder of 2”. In computer programming, there is
    a special operator for that remainder calculation and it’s called the modulus
    operator, often just called the ‘mod’. The operator will only give you the remainder
    of the division calculation, not the actual division result. The percentage symbol
    (%) is the sign used for the modulus so, wherever you see the % in C# programming,
    remember that it does not mean percentage, it means ‘get the remainder’.


    Just to refresh, 7 goes into 23 3 times with a remainder of 2. This is how you
    would do this in your C# code, assuming that we are dividing 23 oranges between
    7 people:


    ```

    int totalOranges = 23;

    ```


    ```

    int people = 7;

    ```


    ```

    int remainingOranges = totalOranges % people; // this is 2.

    ```


    At first look, you might think it isn’t that useful an operator but once you learn
    how to use it, I guarantee you will find plenty of ways.


