- pgno: 449
  md: 'In a pointer_type, the type that we specify before the * token is known as
    a referent type of a pointer type. It is used to represent the variable type that
    the pointer type value is pointing at.


    Unlike a value of a reference type, the garbage collector will not track a pointer.
    In fact, the garbage collector doesn’t even know the pointers exist, much less
    the data they are pointing to. This is why pointers are not allowed to point at
    references or at structs that have references; also, the pointer’s referent type
    has to be an unmanaged type.


    Unmanaged types are any that are not constructed types, reference_types, and do
    not contain, at any nested level, a field of constructed type or a field of reference_type.
    Basically, unmanaged types are any of the following:


    +   - sbyte

    +   - byte

    +   - short

    +   - ushort

    +   - int

    +   - uint

    +   - long

    +   - ulong

    +   - char

    +   - float

    +   - double

    +   - decimal

    +   - bool

    +   - any of the enum_types

    +   - any of the pointer_types

    +   - any struct_type defined by a user – mustn’t be a constructed type and it
    must have fields that only have unmanaged_types in them


    The rule that should be followed to mix references and pointers is reference or
    object referents can have pointers in them but pointer referents can’t have references
    in them.'
  merge: -1
  img_proc: true
- pgno: 450
  md: 'You can see some of the pointer types here:


    | Pointer Type | Description |

    |---|---|

    | `byte*` | Pointer to byte |

