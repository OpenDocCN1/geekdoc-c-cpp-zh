    code is similar to that used for those applications with a couple of differences.
    One is the using statements. At the top of the file, those using statements are
    referencing several namespaces that are commonly used in Windows Form applications,
    such as these:


    +   - **System.Collections** – This is the Collections namespace and it contains
    classes that will provide containment for other types in the style of collection
    containment.

    +   - **System.ComponentModel** – This namespace has classes used to implement
    the behavior of the controls and containers. A form will use a System.ComponentModel.Container
    instance to track the components that the form uses.

    +   - **System.Data** – This namespace has classes in it needed for access to
    Microsoft ADO.NET databases. You don’t use this namespace in default. applications
    so, if you are not doing any ADO.NET programming, you can take this using statement
    out of the code.

    +   - **System.Drawing** – This namespace includes the classes that give you access
    to the GDI+ drawing functions.

    +   - **System.Windows.Forms** – This namespace has all of the Windows Forms classes
    useful to call the namespace types using the much shorter and easier names.


    There is another difference between Windows Forms and console applications – the
    Form1 class has been derived from the base class of System.Windows.Forms.Form.
    As we said earlier, this is the base class for any form window that you will create
    in your .NET application.


    Note that there is a part of the source code that is protected using the preprocessor
    directives called #region and #endregion. Both of these define code regions for
    the Code Editor that are collapsible. In the region, we have in the file, we have
    some source code that the Forms Designer uses to store configuration information
    and properties for the form, and also child controls that the form owns.'
  merge: -1
  img_proc: true
- pgno: 495
  md: "When you include code related to design within a region, by default, it can\
    \ be collapsed and that protects it from accidental editing. If you want to see\
    \ that code in the Code Editor, look for the plus sign beside the region that\
    \ is labeled as Windows Form Designer Generated Code and click on it.\n\nIn a\
    \ Windows Form application, the Main method also has a call to Application.Run,\
    \ as you can see below:\n\n```\nstatic void Main()\n{\n    Application.Run(new\
    \ Form1());\n}\n```\n\nLater, when we discuss starting applications, the message\
    \ loop that all Windows applications require will be started by the Run method\
    \ and the main application form is displayed. Once that main form has been closed,\
    \ the Run method returns.\n\nLastly, every form class will interact with handles\
    \ in the operating system, more specifically with window handles, and that means\
    \ every form class will also implement a method called Dispose. If you include\
    \ resources that need disposing of, you should always use the Dispose method to\
    \ arrange for the resources to be disposed of.\n\nManaged sources can be references\
    \ only if disposing evaluates to true. If it evaluates to false, you cannot touch\
    \ managed references safely because the garbage collector may already have reclaimed\
    \ the object.\n\n# Executing Windows Forms Projects\n\nWe compile Windows Form\
    \ projects in the same way that we compile any project written in C#. Just open\
    \ the Build menu and click on Build Solution. If you want your Windows Form project\
    \ opened in debugger mode, press on the F5 key or click on the Debug Menu and\
    \ click Start. If you were to execute the SimpleForm code from above, you would\
    \ see a simple form on the screen with no buttons and no controls."
