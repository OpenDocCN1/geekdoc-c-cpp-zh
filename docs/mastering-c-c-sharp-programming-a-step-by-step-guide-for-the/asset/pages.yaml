  md: '# # Quick Primer


    +   - Structs and classes are very similar to one another.

    +   - The struct is created with the struct keyword rather than the class keyword.

    +   - Structs are created on the Stack, not on the Heap and this makes them perform
    faster but it also leads to them being passed by value and not reference.


    # # What''s Next?


    While the struct and the class are similar, they do have differences, with the
    main one being allocation of the struct on the Stack and not the Heap. As this
    means it is passed by value, the method gets a copy of the struct, not the original.


    It is a nice feature and you do need to know about them but the likelihood is
    you will use classes way more than you ever will use a struct.


    Next, we are going to delve into inheritance.'
