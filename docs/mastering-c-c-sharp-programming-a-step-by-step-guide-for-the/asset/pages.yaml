  md: '# Classes Part 1


    I’ve split this section into two because there is a lot to learn about classes
    – we’ll start by looking at how to use them.


    C# is an object-oriented programming language, OOP for short. All this means is
    that any code you write is going to belong to an object. To kick off this section,
    we’ll look at objects, what they are, and how we define them. Then, we will create
    and use them in C#.


    # What is an Object?


    People have been programming for years and, over time, it has become apparent
    that the best and the easiest way to structure a code is to emulate the real world.
    The real world has objects. Let’s take an example of a game player. The objects
    associated with this contain specific information – the player’s score, the number
    of lives they have left, and so on. In the real world, the objects can do some
    things by themselves or you can do some specific things with them, such as taking
    your turn in the game.


    With OOP, we attempt to emulate this. We have objects which have certain data
    associated with them and we can do specific actions or operations with them. We
    covered variables earlier and that is how data is stored in C#. As we go through
    the process, you will see how variables can be used inside an object to store
    the data. We also covered methods and we know that they are a way of doing specified
    code and, again, you will see how methods can be used for representing object
    actions – either what the object can do or what can be done to the object.


    Before we look at how all the pieces come together, we need to have a discussion
    about classes.


    # What is a Class?


    We need a way of defining in C# what a type of object will have or the actions
    it can do. In other words, we want to know what the whole class of objects can
    store inside variables or what can they do.'
