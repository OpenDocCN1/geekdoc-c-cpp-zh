    // It goes over several lines.


    // Isn''t it cool?

    ```

    ```


    That seems to be the most preferred method but you must use whatever suits you
    – both are perfectly valid.


    Another type of comment starts with three slashes (///) and is used for the automatic
    creation of technical for the code. It is only used in certain places though -
    so, when we get to them, I will go into it in more detail.


    # Writing Good Comments'
