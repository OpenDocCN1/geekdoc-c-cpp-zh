  md: '# Classes Part 2


    We now know what a class is and we know what an object is and how they are used.
    It’s time to look at how to create classes. This is a very important part of C#
    programming to learn and, by the end of this section, you will have an understanding
    of how to create a class – this is something you will do a lot of in programming
    so take your time to learn this.


    What we are going to do is create a simple class called Player and this would
    be used for representing a player in a game.


    Now, there is quite a lot to go through here so don’t worry if you struggle. Go
    back over whatever you need to and take your time over each section. With what
    you already learned about methods and what you will learn about classes, you will
    soon have the power of C# in your hands.


    # Creating a New Class


    It’s time to make a class. Remember that classes are blueprints for the actions
    that a specific object type needs to track and do.


    While you can place several classes in one file (as opposed to Java where each
    class can have only a single file), it is good practice to do just that – put
