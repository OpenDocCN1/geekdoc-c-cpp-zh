- pgno: 26
  md: '# Installing Visual Studio


    In order to start programming in C#, you need Microsoft Visual Studio Community
    Edition. There are a number of different versions available, including Professional,
    Community Edition, Premium, and Ultimate. The Community Edition is fine for learning
    C# and, unlike the others, it’s free. When you’re finished learning, have a look
    at the other versions and decide whether the investment is worth it – the Professional
    version has much the same features as the Community Edition but Ultimate and Premium
    have a lot more.


    The Community Edition is ideal for open source development, educational use. It
    is also ideal if you work for a company that has less than five developers, fewer
    than 250 computers, and makes less than $1 million in revenue.


    That said, you can do commercial development quite easily with Visual Studio Community
    Edition so you can use it for developing games or creating software applications,
    which you can sell for cash without any penalties.


    Great stuff!


    Let’s install it.


    +   1. Head to https://visualstudio.microsoft.com/vs/community/ and hit the download
    button – note, it is also available for Mac OS so make sure you choose the right
    version.

    +   2. Just follow the steps on the screen to install it, just as you would any
    other software. Be prepared - this can take some time, 20 minutes or more if your
    internet connection isn’t the best. You will also likely see other packages being
    installed, such as .NET Framework. Visual Studio needs these – so when you are
    asked for permission, do say ‘Yes’.

    +   3. Once it’s all nicely installed, you will be asked to create a Microsoft
    account. You may already have one in which case it’s easy. What you can be reassured
    of is that Microsoft will NOT use your email address irresponsibly. The most you
    will get'
  merge: -1
  img_proc: true
