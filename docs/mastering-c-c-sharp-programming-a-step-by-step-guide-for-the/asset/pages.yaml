  md: 'accessed from. With the private keyword, we are saying that the variable may
    only be accessed, which means changed or used, from within the class itself. Nothing
    that is outside of the class will even recognize that the variable exists.


    You will also see the public type. With the public access modifier, we are saying
    that the variable can be seen from outside the class. What making a variable public
    is that it can be modified by anyone from anywhere and that is not always a good
    thing.


    In general, classes should be responsible for all the changes made to their own
    instance variables – that job should not be done by anything that is external
    to that class. This way, everything that the class has responsibility for is kept
    inside the class and protected.


    As an aside, if you do not include one of the access modifiers, the variables
    are made private by default. This is the default level of accessibility for all
    class members. While you don’t necessarily need to specify this in our case, it
    is good practice to use them, not only to get into the habit but so that anyone
    who sees your code knows immediately that it is private.


    There are other access modifiers but we don’t need to discuss those now as they
    are a bit more advanced, we can look at them later. For now, we will concentrate
    on the public and private ones.


