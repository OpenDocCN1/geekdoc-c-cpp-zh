  md: '# An Introduction to Windows Forms


    Windows Forms, or WinForms, are classes contained in the .NET framework and used
    to create Windows-based GUI desktop applications. The most important class in
    the namespace is called Systems.Windows.Forms is the Form class. This is the base
    class that is used for just about every window in WinForms applications. It is
    the base class for all of the top-level windows, and that includes the main window
    in an application, the view windows, and the dialog boxes that you may make for
    the application.


    In this section, you will learn about the Form class and three other important
    classes from the same namespace:


    +   - **Application** – this is used for managing application-level program characteristics

    +   - **ApplicationContext** – This class is used to manage application behavior,
    i.e. how it is launched, how it is closed, etc.

    +   - **MessageBox** – This is used to display dialog boxes that the user will
    know as message boxes.


    We will also discuss some of the more common methods and properties that are associated
    with three of the classes – Form, MessageBox, and Application. Next, we will discuss
    the Microsoft Visual C# Forms designer and look at the source code that the designer
    generates for injection into your own source code. The .NET framework has several
    controls and forms that expose many properties that affect the behavior of the
    controls and forms, in every aspect and the Forms Designer is a visual interface
    for each of those properties.


    While we focus on the required classes that you need to program a Windows Forms
    application, we’ll move on to what controls you have at your disposal, how user
    input is collected, and some other advanced techniques.


    # Understanding Windows Forms'
  merge: -1
  img_proc: true
- pgno: 489
  md: 'Windows Forms is a rich framework that helps build client applications that
    are easier to use, offer supportive tools, and lower costs of deployment. You
    will often see desktop apps in Windows termed as rich-client apps as a way of
    differentiating them from the web apps that are browser-based and downloaded from
    one central place. We find the classes for creating these rich-client apps in
    the System.Windows.Forms namespace and, collectively these are called the Windows
    Form Classes. Here, you will find the Form class, control classes, clipboard interaction
    classes, menu classes, printing classes, and many more.


    # Using Forms as Dialog Boxes


    One of the most common uses of forms is interactive dialog boxes. These can be
    very basic forms with nothing more than a text box control or the most elaborate
    of forms that contain multiple controls. Most of what we will be discussing here
    are those controls.


    Some dialog box types are used so much that they now tend to be integrated into
    the operating system. Collectively known as common dialog boxes, these include
    the dialog boxes that are prebuilt to handle tasks like file selection, color
    specification, choosing fonts, printer settings configuration, and more. In the
    .NET framework, you will find several classes that give you access to those common
    boxes, and in the next few sections, we’ll cover those classes.


    More often than not, we use dialog boxes to show users a notification message.
    Rather than every programmer having to develop their own dialog boxes for generic
    messages, Microsoft built message box control into the Windows operating system.
    This is a special dialog box that makes it much easier to show a user a simple
    text message and it includes several button layouts and icons that have been predefined
    for you. The .Net framework wraps this message box in a class called MessageBox,
    which we will cover later.


    # Using Forms as Views'
