    \ and put it together in ways that it can be reused.\n+   - We can return a result\
    \ from a method simply by specifying what the return type is in the method definition.\
    \ We then add the return keyword inside the method where you want the value returned.\n\
    +   - You can pass a parameter into a method.\n+   - You can create several methods\
    \ with the same name so long as they all have different signatures.\n+   - Recursion\
