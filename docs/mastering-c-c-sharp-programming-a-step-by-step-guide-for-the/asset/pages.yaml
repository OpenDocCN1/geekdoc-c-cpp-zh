- pgno: 332
  md: '# Operator Overloading


    So far, throughout this guide, we’ve seen and used many different operators. Each
    has its own functionality built-in that will do specific things. Most of the time,
    these operators and their functions are defined by standard math although there
    are one or two that do some not-so-standard stuff – the + operator, for example,
    used for concatenating or adding two strings together. There is no way to do that
    in standard meth but there is in C#.


    When you create a class in C#, you can define the way the operators work with
    the class. For example, if you created an object called ‘Burger’, you could use
    the + operator to add a pair of Burger objects together and you also can determine
    exactly what it means. We call this operator overloading and it is one of the
    nicest C# features. Those of you who have a programming background will already
    know that, and you can also do operator overloading in C++, but you can’t do it
    in Java.


    Not all operators can be overloaded. For example, you cannot overload the assignment
    (=) operator; it isn’t possible for you to define what that operator does and
    that’s no bad thing – you could cause all sorts of problems if you could!


    Lots of them can be overloaded and you’ll obviously want to know which ones. These
    are the most common ones that you will use all of the time:


    +   - +

    +   - -

    +   - *

    +   - /

    +   - %

    +   - ++

    +   - --

    +   - ==

    +   - !=

    +   - >

    +   - <'
  merge: -1
  img_proc: true
- pgno: 333
  md: '+   - >=

    +   - <=


    There are some others including +=, -=, *=, /=, ad %=. However, when the + operator
    is overloaded, it will automatically overload the += operator.


    You should also know that when you overload a relational operator, you must do
    them in pairs. If the == operator is overloaded, so must the != operator be overloaded.
    And if the > operator is overloaded, you also need to overload the < operator,
    and so on.


    We mustn’t forget that some of the operators have two versions – unary and binary.
    Take the + operator, for example. The binary version will do operations on two
    things, for instance, adding 4 + 6 – the operator will apply to both numbers separately.
    The unary operator, on the other hand, will only do operations on one thing. Take
    -9 for example; the operator is only applied to the 9, no other number.


    What can’t be overloaded?


    +   - &&

    +   - ||

    +   - =

    +   - . (dot operator)

    +   - new

    +   - and a few others that we haven’t looked at.


    The [ and ] operator, which is used for indexing, may be overloaded by using indexers,
    but we will come onto that in the next section.


    # Overloading Operators


    Operators can be overloaded for any class that you want, but to keep things relatively
    simple here, I will choose a class that actually makes sense from the overloading
    perspective. We’ll use the Point class to do the overloading – this stores two
    coordinates of X and Y. If you understand vectors from physics and math then this
    will make some sense to you.'
