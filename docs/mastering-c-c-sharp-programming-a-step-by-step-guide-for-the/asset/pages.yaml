  md: 'Rather than writing text-based files, there is an alternative – we could write
    binary files. When we write these, you cannot open the files in a text editor.
    Well, you can actually, but it would look like complete and utter gibberish.


    However, there are a couple of great advantages to binary files. First, a binary
    file will take up a good deal less space than a text-based file. Second, to a
    certain extent, the data in binary files are encrypted. Because it isn’t text,
    it can’t just be opened up and read and that provides a certain level of protection
    for the data. However, this isn’t true encryption, not actual proper encryption;
    all it does is obscures the data. Any programmer worth their salt could still
    work out what is in it.


    # Writing the File


    This is much like the text-based method we talked about earlier. Writing to a
    binary file requires the same code with one exception – instead of a TextWriter,
    we use a BinaryWriter.


    ```

    FileStream fileStream =

    File.OpenWrite("C:/Users/RB/Desktop/test4.txt");


    BinaryWriter binaryWriter = new BinaryWriter(fileStream);


    binaryWriter.Write(3);

    binaryWriter.Write("Hello");


    binaryWriter.Flush();

    binaryWriter.Close();

    ```


    As before, the first thing we need to do is open a FileStream that has a connection
    to the file we are writing using the OpenWrite method. This time, we are not wrapping
    it in a TextWriter. We are wrapping it in a BinaryWriter.'
