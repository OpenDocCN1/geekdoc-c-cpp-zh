    # Methods as First-Class Citizens


    You might have realized that using a delegate is very much like using a variable
    or an object and this is done by design.


    A delegate lets you assign a method as you do with a variable; it lets you pass
    a method as a parameter to another method and it lets you return a method from
    another method.


    In computer programming, this has a name. A delegate will make it so that a method
    is a “first-class citizen”, much like the variables with a value type – the int,
    float, byte, etc. – and the structs and objects.


    This is a very powerful ability but only if you know exactly how to use it. Later,
    in the next part of this guide, we’ll be discussing events and these are also
    very useful, especially to those who want to get involved in GUI programming and
    create much better interfaces than the console.


    Aside from that, delegates are incredibly powerful all by themselves and that
    makes them worth knowing about.


