    # What is Polymorphism and Why Do We Need it?


    You will hear the word, polymorphism, quite a lot as a programmer. It is a Greek
    word and it literally means “many forms”. Now that we are looking at inheritance,
    it’s time to discuss what it is and why it is such a useful feature.


    Let’s assume that we are creating a game. We have lots of different player types;
    one is human and can use the arrow keys to navigate around the screen. You might
    also have a player controlled by the computer that can also navigate the screen
    but in a completely different way. To keep things simple, we’ll say it moves randomly.


    We could start by creating a new Player class and giving it a method named MakeMove().
    This method would return a direction the player is to move in. Then, taking what
    we learned in the last section about inheritance, we could make a derived class
    from this and call it HumanPlayer. This will take care of making moves by seeing
    which keys are pressed by the user and another derived class, called RandomAIPlayer
    would simply pick a random direction in which to move.


    All of this describes the core of polymorphism. We’ve got our base class, which
    is called Player, and this class knows that moves need to be made; for our point
    of view, how that happens specifically is not'
