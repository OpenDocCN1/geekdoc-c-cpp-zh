    \nThis is where a subject we’ll be discussing in more detail later comes in –\
    \ Garbage Collection (GC). When the program gets to a specified threshold of memory\
    \ and more Heap space is needed, GC starts, and GC stops any threads from running,\
    \ known as a Full Stop, and then it looks in the Heap for all objects that the\
    \ main program is not accessing; these are deleted. GC then reorganizes the remaining\
    \ objects in the Heap so more space is available and adjusts pointers to the remaining\
    \ objects in the Heap and in the Stack.\n\nYou can probably see that this is going\
