- pgno: 15
  md: '# Introduction


    If I had a dollar for every time I spoke to a person who dreamed of being a video
    game programmer believing it was going to make them rich and then admitted they
    didn’t know how to program, well, I’d be a millionaire by now.


    If you can’t program, how on earth are you going to become the next big thing
    in video games?


    Although, you could go into game design, I suppose, and pay others to do everything
    else for you.


    Let’s be honest, though, even a game designer needs to understand everything that
    goes into a game and that includes programming.


    So, whether you want a career as a game designer, developer or just want to learn
    how to program, C# is a great place to start. I have to be honest with you, though.
    When you first start to learn to program, it can be a little on the boring side
    –lots of theory and not a lot of programming. To try and make things better, I’ve
    added lots of examples in this guide that you can try for yourself and to break
    the theory up into more manageable sections.


    C# is one of the main programming languages used for gaming. While the focus of
    this guide is not on games and game design, but if that’s where you want to be
    aiming then this is the guide for you. Gaming requires all the main computer science
    fields — programming, data structures, algorithms, GUI design, networking, AI,
    computer graphics and more.


    So, read on for a brief look at what C# is and what it’s all about before we dive
    headfirst into programming.


    # What is C#?


    Generally, every computer program is nothing more than a set of instructions,
    sometimes simple, sometimes more complex, that the computer will follow. While
    computers are quite stupid on the one hand, they are very good at following instructions
    and it will be down to you to create those instructions.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'However, you can’t write your instructions in any old way because a computer
    can only understand binary, which is a language written in 0’s and 1’. In the
    old days, a series of switches would be used, turned on and off to represent the
    o’s and 1’s but this became tedious.


    That’s why programming languages were created; you write your instructions in
    good old-fashioned English text format – known as source code – and then you give
    that code to another program, which then translates your source code into a language
    that the computer understands. You will often see this called “compiled code”,
    “executable code”, “binary file” or just an “executable”.


    Do a quick search on the internet and you will find hundreds of different programming
    languages – each has its own purpose and not all languages can be used for everything.
    You can compare the computer languages to spoken languages – some are quite similar
    to one another while others are wildly different. Some are used all the time while
    others are only used by small numbers of people and most good programmers will
    be au fait with at least a few of them.


    Out of all of them, C# is undoubtedly one of the best. I wouldn’t say it was the
    easiest, but it is popular. It belongs to the C/C++ language family which means
    that syntax between the languages is very similar, and that includes Java too.
    Once you have learned C#, you will find it very easy to go on and learn C/C++
    and Java – if you don’t want to, at the very least, you will be able to read code
    written in those languages and understand it.


    Likewise, if you already have a good grounding in those languages then C# will
    be easy for you.


    # About This Guide


    This guide has been divided into five parts. In the first part, we’ll go over
    the basics of C# programming before moving onto intermediate and advanced subjects,
    and then we’ll take a look at some very advanced subjects. We’ll finish with an
    in-depth look at unsafe code, an important thing for you to learn, and then an
    introduction to'
  merge: -1
  img_proc: true
