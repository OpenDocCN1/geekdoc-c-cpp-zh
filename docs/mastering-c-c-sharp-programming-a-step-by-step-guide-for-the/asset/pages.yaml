    # What Goes On The Stack and Heap?


    There are four types of things that go in the Stack and Heap as the code we have
    written executes:


    +   - Value types

    +   - Reference types

    +   - Pointers

    +   - Instructions


    We’ll look at each one in turn.


    # Value Types


    In C#, anything that is declared with any of type declarations listed below is
    a Value Type because they come from System.ValueType.


    bool


    byte


    char


    decimal


    double


    enum


    float


    int


    long


    sbyte


    short


    struct


    uint


    ulong'
