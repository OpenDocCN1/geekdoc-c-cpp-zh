- pgno: 442
  md: '# Using Unsafe Code


    The one thing that puts C# apart from languages like C and C++ is that it doesn’t
    have pointers as data types. Instead, there are references and we have the ability
    to create objects that a garbage collector can manage. Together with some other
    cool features, this design is what makes C# one of the safest of all the programming
    languages. At its core, the language does not allow us to leave variables uninitialized.
    It doesn’t allow us to leave pointers hanging, and it doesn’t allow expressions
    of index arrays that go far beyond what its boundaries allow. The one thing this
    does is eliminates a host of bugs that you often find in the C and C++ languages.


    In both C and C++, almost every pointer of the construct type has a C# reference
    type equivalent. However, that doesn’t stop situations from arising where it is
    necessary to have access to a pointer type. For example, accessing devices that
    are memory-mapped, trying to interface with the operating system, and implementation
    of algorithms that are time-critical – these are neither practical nor generally
    possible if you can’t access a pointer and to help facilitate this, C# allows
    us to write unsafe code.


    With unsafe code, you can declare a pointer and you can operate on it, you can
    perform a conversion between an integral type and a pointer, you can take a variable,
    and so on. In all honesty, unsafe code is not really any different to include
    C or C++ code in your C# program.


    Unsafe code is, from the perspective of users, developers, and programmers actually
    a safe feature. However, there is a requirement for it to be marked using the
    unsafe modifier, thus explicitly declaring it, and stopping a programmer or developer
    from accidentally using features that are declared as unsafe. The way code execution
    works, unsafe code cannot and will not be executed in an environment that is not
    trusted.


    # Unsafe Contexts'
  merge: -1
  img_proc: true
- pgno: 443
  md: "It goes without saying that the C# unsafe features can only be used in an unsafe\
    \ context and we create that by adding an unsafe modifier to a member or type\
    \ declaration or we can use an unsafe_statement.\n\nIf you include an unsafe modifier\
    \ in struct, class, delegate or interface declaration, the entire declaration\
    \ for the type, which includes the interface, struct, or class, will be considered\
    \ to be an unsafe contest.\n\nYou may also add an unsafe modifier to a field,\
    \ property, method, operator, indexer, event destructor, instance constructor\
    \ or static constructor declaration and the whole member declaration becomes an\
    \ unsafe context.\n\nIf you use an unsafe_statement, it creates an unsafe context\
    \ for use and the whole extent from a contextual point of view becomes an unsafe\
    \ context.\n\nYou can see the syntax needed for each unsafe_statement type below:\n\
    \n```\nclass_modifier_unsafe\n  : 'unsafe'\n  ;\n```\n\n```\nstruct_modifier_unsafe\n\
    \  : 'unsafe'\n  ;\n```\n\n```\ninterface_modifier_unsafe\n  : 'unsafe'\n  ;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 444
