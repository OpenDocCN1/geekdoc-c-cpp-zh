    This is an excellent example of something called a Visitor Design Pattern. You
    won’t know what these are at this stage but, in short, a design pattern is a generalized
    solution designed for problems that are similar. These are not used by all programmers,
    but with the Visitor pattern, you can do all sorts of operations on an object
    type without needing to worry about the structure they were contained in.


    # Quick Primer


    +   - Real-world delegates are people or things that do something for people or
    things.

    +   - C# delegates provide a way for methods to be passed like variables or objects
    giving you the ability to delegate methods as you go, as and when needed.

    +   - The delegate keyword is needed to create them, i.e., public delegate float
    MathDelegate(float a, float b);. We could now use this to track methods that have
    the float return type and the same float, float list of parameters.

    +   - Once created, delegates can be used in a similar way to a variable, i.e.
    MathDelegate mathOperation = Add; float a = 5; float b = 7; float result = mathOperation(a,
    b);. Of course, the implication here is that you have an Add method that already
    returns a float and takes a pair of floats as its parameters, thus matching what
    the delegate requires.


    # What''s Next?


    Delegates are more than a little confusing but, like everything, you don’t need
    to have a thorough understanding of them, to begin with. At the end of the day,
    understanding the basics is enough to get you started and practice will improve
    your ability and understanding.'
