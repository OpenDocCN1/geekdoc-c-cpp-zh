    What really gives LINQ the edge over other similar technologies is the flexibility
    it has to work with several data types. What that means is that LINQ uses the
    same query syntax to handle incoming data independently of the source type for
    the data, where the other technologies require you to write a different query
    for each separate source. For example, you would need an SQL query if you wanted
    to interact with the SQL server and to interact with the XML data type, you would
    need an XQuery. What we are going to look at here is the relationship between
    LINQ and SQL, and LINQ and Lambda expressions.


