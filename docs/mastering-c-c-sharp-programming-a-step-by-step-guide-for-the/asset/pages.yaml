    # Protected Access Modifier


    Previously, we talked about the public and the private access modifier; public
    means that the variable or method is available to anyone, while private means
    it can only be accessed from within the class to which the variable or method
    belongs.


    Inheritance gives us a third option – the protected access modifier. If you mark
    a method, variable, or property as protected rather than public or private, it
    can only be accessed from within the class or any class derived from that class.


    So, if the NumberOfSides property in our Polygon class was protected rather than
    public, it could be accessed from the Polygon class, the Square class, and any
    other derived class but not from anywhere else.


    # The Base Class of Everything


    Even if you didn’t specify a class for inheritance purposes, every class you create
    is already derived from a base class. This is the base class of everything and
    it is the class called object.


