  md: '# # C# Keywords


    Like all computer programming languages, C# has its own set of reserved keywords.
    These words have a special meaning to the compiler and are reserved for use by
    the compiler only. This means you cannot use them when you are naming variables,
    classes, interfaces, or anything else.


    The C# keywords fall under these categories:


    # ## Modifier Keywords


    These keywords indicate who can modify the types and type members. They are used
    to prevent or allow parts of the program to be modified by other parts. The keywords
    are:


    +   - abstract

    +   - async

    +   - const

    +   - event

    +   - extern

    +   - new

    +   - override

    +   - partial

    +   - readonly

    +   - sealed

    +   - static

    +   - unsafe

    +   - virtual

    +   - volatile


    # ## Access Modifier Keywords'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'These keywords are applied to the class, method, property, field and other
    member declarations and are used for defining class and class member accessibility.
    The keywords and their meanings are:


    **public** – this modifier will allow parts of the program within the same or
    another assembly access to the type and the type members.


    **private** – this modifier places restrictions on other program parts from accessing
    the type and type members – access is granted only to code from the same class
    or same struct.


    **internal** – this modifier will allow code from the same assembly access to
    the type or type members. If no modifier is specified, this is the default.


    **protected** – this modifier allows code from the same class or from a derived
    class (of that class) access to the type and type members


    # Statement Keywords


    These keywords relate entirely to program flow:


    +   if

    +   else

    +   switch

    +   case

    +   do

    +   for

    +   foreach

    +   in

    +   while

    +   break

    +   continue

    +   default

    +   goto'
