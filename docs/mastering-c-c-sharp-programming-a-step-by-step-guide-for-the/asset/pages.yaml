- pgno: 32
  md: '# Compiling and Running Your Project


    Remember – right now your computer is not magic and it will not understand a word
    you have written. What it will understand are instructions given to it in binary
    format, a series of 0''s and 1''s. Visual Studio contains a compiler which takes
    your code and transforms it into binary so your computer can read it.


    That''s our next step – compile the code and run it.


    It is easy, I promise you.


    Press the F5 key on your keyboard or click on Debug -> Start Debugging in the
    menu.


    This will run the program in Debug Mode so, if anything happened while it was
    running, it wouldn’t just crash; Visual Studio would take care of it, stop the
    program and show you what the error is so you can fix it.


