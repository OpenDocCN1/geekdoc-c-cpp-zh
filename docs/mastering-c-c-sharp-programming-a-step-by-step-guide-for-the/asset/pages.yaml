  md: "# Structs\n\nNow that you understand classes, we can look at a construct that\
    \ is very similar – the struct. This word comes from C/C++ and is from the word\
    \ ‘structured’. A struct is representing a record or a set of data that has been\
    \ structured – in C language, this marked the beginning of OOP and lead to classes\
    \ in C++.\n\nStructs are much like classes and you could be forgiven, at first\
    \ glance, for mistaking one for another. However, there are some significant differences.\
    \ To really understand structs, it is worth going back over the section on the\
    \ Stack and Heap and on passing references by value – if you need a brush-up,\
    \ now is the time to do it.\n\n# Creating a struct\n\nThis is much like creating\
    \ a class and the code below will define a struct and a class that is identical\
    \ and does the exact same thing:\n\n```\nstruct TimeStruct\n{\n    private int\
    \ seconds;\n\n    public int Seconds\n    {\n        get\n        {\n        \
    \    return seconds;\n        }\n        set\n        {\n            seconds =\
    \ value;\n        }\n    }\n```"
