  md: "data source, as you can see in this example:\n\n```\nvar source = Enumerable.Range(1,\
    \ 10000);\n```\n\n```\n// Use AsParallel to opt into PLINQ.\nvar evenNums = from\
    \ num in source.AsParallel()\n    where num % 2 == 0\n    select num;\nConsole.WriteLine(\"\
    {0} even numbers out of {1} total\",\n    evenNums.Count(), source.Count());\n\
    ```\n\n```\n// This example will give us an output of:\n//     5000 even numbers\
    \ out of 10000 total\n```\n\nThis extension method will bind the query operators\
    \ that follow, the where and select operators in this case, to the implementations\
    \ of System.Linq.ParallelEnumerable.\n\n# Execution Modes\n\nPLINQ is conservative\
    \ by default. The PLINQ infrastructure will analyze the query structure at run\
    \ time and, if the query is likely to be sped up by the use of parallelization,\
    \ then PLINQ will split the source sequence into separate tasks that can be run\
    \ synchronously or simultaneously. If parallelization is not safe to do, the query\
    \ is run by PLINQ sequentially.\n\nIf there is a choice between using a parallel\
    \ algorithm that is potentially expensive or a cheaper sequential algorithm, PLINQ\
    \ will, by default, choose the sequential algorithm. If you want PLINQ to opt\
    \ for the parallel algorithm instead, you can use both the method called WithExecutionMode\
    \ and the System.Linq.ParallelExecutionMode enumeration. This makes it much easier\
    \ when you already know that a query will execute much faster in parallel because\
    \ you have tested and measured it.\n\n# Degree of Parallelism"
