  md: '# Arrays


    Arrays are an incredibly powerful feature in C# because they let us store groups
    or collections of objects that are related. We’ll be talking about how arrays
    are created, and how we use them. Then we’ll look at multi-dimensional arrays,
    otherwise known in math as a matrix, and then finish by looking at the for-each
    loop.


    # What is an Array?


    Arrays are a neat way of keeping track of collections or lists of multiple objects
    that are related. For example, let’s say that you have a game with a high scoreboard
    and it holds up to 20 different scores. Using what we learned, we could create
    a variable for each score that we want to track. It would look like this:


    ```

    int score1 = 98;

    int score2 = 92;

    int score3 = 85;

    // ...

    ```


    That’s not a bad way to do it if you only have a few scores. What if you want
    to track thousands of scores? Suddenly, creating one variable for each score becomes
    just too much.


    That’s where arrays come in. These are ideal for tracking things like this because
    you can use them to store 20 scores or 20,000 scores; they are easy to create
    and, once you have them, incredibly easy to work with.


    # Working with Arrays


    When you create an array, it is much like creating a variable. You provide it
    with a type, you give it a name and you initialize it; you can do all of that
    in one line if you want. Arrays are created using square brackets – [...]:


    ```

    int[] scores;

    ```'
