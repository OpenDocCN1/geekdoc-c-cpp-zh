    ```


    Note that you need implicit casts for either direction – from enum to int and
    int to enum.


    When an enumeration is created, you can assign your own values (numeric) aside
    from the default, if you need to:


    ```

    public enum DaysOfWeek { Sunday = 5, Monday = 6, Tuesday = 7, Wednesday = 8, Thursday
    = 9, Friday = 10, Saturday = 11 };

    ```


    # Quick Primer


    +   - Enumerations are a quick way of defining your own variable type with specific
    values.

    +   - You define an enumeration like this: public enum DaysOfWeek { Sunday, Monday,
    Tuesday, Wednesday, Thursday, Friday, Saturday };

    +   - An enumeration must be defined outside of any class that you already have
    in your program.

    +   - Because enumerations can take on only the specific values that you choose
    means that there is no way of ending up with meaningless or bad data.

    +   - It is possible to assign numeric values of your own to enumeration items:
    public enum DaysOfWeek { Sunday = 5, Monday = 6, Tuesday = 7, Wednesday = 8, Thursday
    = 9, Friday = 10, Saturday = 11 };


    # What''s Next?


    Enumerations are just one of several ways to create your own variables. You can
    use them in many different ways as you will find out as you gain experience.


    We are now finished with the beginner''s guide and it''s time to move on to the
    more intermediate topics in C#. We''ll start off with the methods.'
