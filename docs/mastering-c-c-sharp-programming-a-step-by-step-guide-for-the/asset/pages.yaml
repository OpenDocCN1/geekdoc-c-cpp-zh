  md: '# User-Defined Conversions


    With operator overloading, we can make the operators we use work in special ways
    with our classes and we can do much the same using the indexing operator. Now
    we want to look at how to custom define a way of ensuring that our classes can
    be cast or converted to different types. You will find that both cast and conversion
    are used interchangeably because they both mean the same thing – changing from
    a type into another type.


    # Implicit vs. Explicit Conversions


    Before we discuss the user-defined conversions, we should explain how conversions
    work.


    As an example, we’ll look at two types – float and double. Let’s say that we have
    a float; we can use this as a double if we want and it will be converted to a
    double automatically by the program. Here’s how:


    ```

    float a = 3.5f;

    ```


    ```

    double b = a; // the ‘a’ value gets converted into a double automatically when
    it gets assigned to ‘b’.

    ```


    However, if we tried to do it the other way around, all that would happen would
    be a compile time error:


    ```

    double b = 3.5;

    ```


    ```

    float a = b; // this will not compile because you are attempting to convert a
    double into a float.

    ```


    Why can’t we do this? It comes down to size. You cannot put a double into something
    as small as a float that doesn’t have the accuracy and precision of the double
    – all you will achieve is a loss of information.


    That said, there is a way to convert it; you need to state explicitly that this
    is what you want to do:


    ```

    double b = 3.5;

    ```'
