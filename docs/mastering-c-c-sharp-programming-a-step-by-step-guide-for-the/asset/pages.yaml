- pgno: 496
  md: '# SimpleForm Application


    Windows Form projects are far easier to debug than console applications. All Windows
    Form projects are classed as event-driven because they will respond to specified
    events, and that makes it much easier to look at their behavior in the debugger.
    To do this, you just put a breakpoint inside one of the event handlers.


    # Adding a New Form to a Project


    Most of the time, your Windows Forms projects will have more than one form. Most
    have several that are used to handle all the different parts of the applications
    and generally, a new form is nothing more than a class that descends from the
    base class of System.Windows.Forms.Form.


    You can add new forms in two ways — click on the Project Window and then click
    on Add New Form, or go to Solution Explorer and right-click on the project name;
    click on Add Windows Form from the menu. Both ways will open a dialog box to Add
    New Item.


    To add the form, just type in a name for the new class and click on the Open button.
    The new form class gets created by .Net and added to your project. Any forms that
    you add to your project will automatically have the Dispose method in them along
    with a method called InitializeComponent that the Forms Designer uses.


    # Modal Forms vs. Modeless Forms


    Forms can be displayed to users in two different ways:


    +   - **Modal Forms** – this type of form will not allow any other part of the
    application to be accessed while it is being displayed. This form is useful when
    your dialog box contains information that a user must accept or acknowledge before
    they can move on.

    +   - **Modeless Forms** – this type of form will allow access to other parts
    of the application while being displayed. This form is useful when you want a
    form that can be used over a period of time.'
  merge: -1
  img_proc: true
- pgno: 497
  md: 'Modal form examples include message boxes, dialog boxes with error information,
    and dialog boxes used to open or save files. Modeless forms are used when application
    interaction is required, for example, when child forms are displayed in MS Word.


    Most of the time, modeless forms are the preferred format as the user has more
    control over application flow. However, when there is a need for a user to acknowledge
    information or the user is required to input some information or some other kind
    of input is required before application execution can continue, modal forms are
    ideal.


    The form will be displayed as per the method used for calling it. For modeless
    forms we use the Show method, like this:


    ```

    Form addressForm = new AddressForm();

    ```


    ```

    addressForm.Show();

    ```


    And don’t forget that the Close method is required to destroy forms that use the
    Show method to display them:


    ```

    addressForm.Close();

    ```


    Or you could just make the form invisible by using the Hide method:


    ```

    addressForm.Hide();

    ```


    For modal forms, the ShowDialog method is used:


    ```

    addressForm.ShowDialog();

    ```


    The call to this method will not return until the user has dismissed or closed
    the dialog box.


    # The DialogResult Value


    A modal dialog box will return a value that is used to determine the method of
    the dialog box dismissal. You should know what this value is because the code
    that invokes the box can determine whether a valid date is contained in the dialog
    box, like this:


    ```

    Form addressForm = new AddressForm();

    ```


    ```

    DialogResult result = addressForm.ShowDialog();

    ```'
