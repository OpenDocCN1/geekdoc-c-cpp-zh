    # Division By Zero


    We all know that nothing good can come of dividing by zero; in terms of math,
    it just doesn’t work. What will happen in C# when you try to divide by zero? It
    is actually quite strange.


    If you try dividing by zero with ints, an exception is thrown. Now, we’ll be discussing
    these in detail later but, for now, what it means is that your program will just
    stop, right there in its tracks if you are not running it in debug mode. You may
    see an error message, you may not. If you are in debug mode, Visual Studio activates
    at the line with the error so you should be able to see what went wrong and, hopefully,
    fix it. You will see a message that says “DivideByZeroException was Unhandled”.


    What is interesting is if you are using a float or double, or any other floating
    point type, the program won’t crash. Instead, you get a value of Infinity which
    we will talk about right now.'
