  md: "On top of that, we want the static keyword to be on the class, thus ensuring\
    \ the entire class is a static class. To begin with, the basic class, no extension\
    \ methods yet, would look like this:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\n\nnamespace ExtensionMethods\n{\n    public\
    \ static class StringExtensions\n    {\n    }\n}\n```\n\nWe haven’t talked very\
    \ much about static classes yet so I will just explain briefly about what it means.\
    \ When a class is static, every method inside the class must also be static. That\
    \ also means that instances of static classes cannot be made – imagine saying\
    \ something like StringExtensions extensions = new StringExtensions();. You just\
    \ can’t do it and while that might seem to be somewhat restrictive, it does mean\
    \ that the compiler and .NET framework can handle things in a way that benefits\
    \ performance.\n\nDefining the extension method is simple – create a method as\
    \ static and make the first parameter as the object type that we want the extension\
    \ method for, i.e. string, and mark it using the ‘this’ keyword:\n\n```\npublic\
    \ static string ToRandomCase(this string text)\n{\n    // We will put the method\
    \ implementation here shortly...\n}\n```"
