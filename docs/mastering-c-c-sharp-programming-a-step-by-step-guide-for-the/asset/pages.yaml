- pgno: 355
  md: 'A return type can be indicated and, as well as the initial parameter that uses
    the ‘this’ keyword, we could add as many other parameters as we want.


    As it was indexers and operator overloading, this is nothing more than syntactic
    sugar. The compiler will go ahead and change anywhere that the extension method
    is called into nothing more than calling a method (the extension in this case).
    When we have finished, we can simply say:


    ```

    string title = "Hello World!"

    string randomCaseTitle = title.ToRandomCase();

    ```


    And the compiler will turn that into this:


    ```

    string title = "HelloWorld";

    string randomCaseTitle = StringExtensions.ToRandomCase(title);

    ```


    What we end up with is a piece of code that looks better, is far easier to read,
    and looks like nothing more than a proper method for the string class.


    But this isn’t all it seems to be. While the method will seem like it is part
    of the original string class, it isn’t. If your extension method isn’t in the
    same namespace as the original class, you could face a problem where your class
    is recognized but the extension method won’t be found, or you might move to another
    project only to find that what you saw as an original class method was actually
    an extension method that someone else wrote and now you can’t use it.


    I’m not saying don’t use these extension methods. You should use them or I wouldn’t
    be telling you about them, but you just need to keep in mind that, while methods
    may look like part of a class, it might not be; it might be an extension method.


    You might also need to have a using statement in the extension method, but that
    will be dependent on the namespace you used.


    Let’s complete the code example by finishing the ToRandomCase method body:'
