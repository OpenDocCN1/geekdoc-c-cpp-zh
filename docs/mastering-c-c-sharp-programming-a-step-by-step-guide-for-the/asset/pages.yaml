  md: '# Math Part 2


    Now, this is quite an involved section so don’t panic if you don’t understand
    it all first time around – go over it as many times as you need to.


    As I explained earlier, computers absolutely love math, which is great, because
    that is pretty much all they can do. We will be moving on to more exciting stuff
    soon, I promise but this is a very important subject to learn.


    One thing I do need to warn you is that the sections here are separate, not really
    related to one another at all. This is good because, if you need help on one specific
    thing, you can just jump straight to that section.


    What are we going to discuss?


    We’ll start off doing some division using integers, covering a very interesting
    problem that arises from it. Then we’ll move on to data conversion in a process
    called typecasting before we cover the subject of division by zero. After that,
    some of the special C# numbers, such is NaN, infinity, pi, and e, and then we’ll
    cover over and underflow. To finish, we’ll look at incrementing and decrementing,
    a very special C# feature.


    Even if you think you know the subject, please don’t be tempted to skip a section;
    it never hurts to have a refresher and especially do not skip the final section
    – you really will regret it!


    Above all, although there is so much to learn here, do try and have fun. Programming
    doesn’t have to be strait-laced, nose-to-the-grindstone theory.


    Let’s get started.


    # Integer Division


    A good way to begin is with a thought problem. Work out, in your head, what the
    result of seven divided by two (7/2) is. Done it? Seriously, don’t skip this and
    move on. Get that answer in your head'
