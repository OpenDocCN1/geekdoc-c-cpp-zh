    ```


    When a math operation makes something go over the range for the specific value,
    it’s called overflow and it is important that you understand what happens. With
    the integer type – short, long, int, and byte – the most significant of the bits
    are dropped which is strange because the computer will interpret this as wrapping
    around.


    Look at this:


    ```

    int aNumber = Int32.MaxValue;

    ```


    ```

    aNumber = aNumber + 1;

    ```


    ```

    Console.WriteLine(aNumber);// This prints a large negative number.

    ```


    As far as floating point types go, things are a little bit different. Because
    these types both have PositiveInfinity and NegativeInfinity defined, they will
    become infinity, rather than wrapping around.


    If you find overflow too much of a concern, you can run it in checked mode. With
    this, integer operations will not wrap around; instead, they throw exceptions.
    Again, we’ll come back to that later.


    Underflow is a similar thing that can happen with floating point types on occasion.
    Let’s assume that you have an extremely large floating point number, let’s say,
    1,000,000,000,000,000,000,000,000, for example. As you know, this size of number
    can be stored by a float. Let’s assume that we have an extremely small number,
    such as 0.000000000000000001. That can also be stored as a float but if you were
    to add these two numbers together, you could not store the result as a float.
    The result would be 1,000,000,000,000,000,000,000,000,000.000000000000000001.


    Floats cannot be that large and that precise – numbers that large are rarely precise!
    Instead, when you add them together, the result would be 1,000,000,000,000,000,000,000,000,000
    and that is probably close enough for many things. However, we are still losing
    information that is potentially valuable.'
