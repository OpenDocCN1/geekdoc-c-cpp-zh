  md: 'When you want to locate the files that your Windows Form application uses,
    more often than not, you will need to know the path information. In the Application
    class, there are properties that make it easy to find the paths that are used
    most commonly, like the application path, or the folder where application data
    is stored.


    You can obtain the path to the executable responsible for landing the current
    application by using the property called ExecutablePath, like this:


    ```

    string executablePath = Application.ExecutablePath;

    ```


    If you want the start-up directory path, use the property called StartupPath,
    like this:


    ```

    string startupPath = Application.StartupPath;

    ```


    According to the design guidelines for Windows applications, all application data
    has to be stored in certain ways to enable users to easily interact with the application.
    You should always store the application data in a subdirectory of the folder called
    Documents and Settings. The information that is specific to users should be stored
    in a path in My Documents – it should map to Documents and Settings\<user>name>.
    When you store data like this, users can have one location for the data and the
    application easily used in roaming profiles. To help you get this right, the Application
    class calculates all the paths for you.


    Where you have common data that all users of the Windows Form application share,
    it should be stored in a Documents and Settings subdirectory that is specific
    to the application. You use the property called CommonAppDataPath to see the location
    of that subdirectory, like this:


    ```

    string commonDataPath = Application.CommonAppDataPath;

    ```


    The directory location will be in a subdirectory of Documents and Settings called
    <company_name>\<product_name>\<version>. The names for company and product are
    determined through inspection of the assembly attributes from the file called
    AssemblyInfo.cs. If'
