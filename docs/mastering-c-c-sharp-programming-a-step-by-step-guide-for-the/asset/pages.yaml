  md: '# Extension Methods


    Jumping straight into this, let’s assume that we have a class but somebody else
    created it. It could be a part of the .NET framework, such as the String class,
    which is the equivalent of a type we have made good use of – the string type.


    Now let’s say that we have a method and we want to use it on the string type but
    you don’t have the class right there to modify. The String class or string type
    has two methods called ToUpper() and ToLower(), but what if we want to make a
    method that would convert it to another type, for example making it random as
    to whether each letter is lower or upper case, not one or the other? Actually
    making that method is quite simple. We want to say something along the lines of
    “Hello World!”.ToRandomCase() instead of saying ToUpper() or ToLower() and, without
    being able to access the class, we wouldn’t usually be able to add a new method
    of ToRandomCase(). That is not normal.


    However, C# has a way for us to do that, using something called extension methods.
    What we do is create a static method inside a static class, and using the ‘this’
    keyword, we create a method that can be used just like it belonged to the original
    class.


    # Creating an Extension Method


    It really isn’t difficult to create extension methods – first, we create a static
    class and then we put a static method in it to do exactly what we require for
    our extension method.


    The first thing to do is to add a new class file. You can call it what you want,
    but if I am going to be creating string class extension methods, I would call
    it StringExtensions. It is good practice to make one class for each of the classes
    that the extension methods are being made for. In short, every extension method
    that goes with the string class go into the class called StringExtensions; any
    extensions methods for the Point class would go in a class called PointExtensions,
    and so on – you get the idea. It lets the extension methods belong to the class
    without being in it.'
