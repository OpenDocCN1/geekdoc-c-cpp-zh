- pgno: 429
  md: '# Understanding PLINQ Speedup


    The primary purpose of PLINQ is to speed up LINQ to Object query execution. It
    does this through parallel execution of query delegates on multicore systems.
    PLINQ works the best when elements in source collections are processed independently
    of one another and there is no shared state among the individual delegates.


    Operations like this are common in both PLINQ and LINQ to Object queries and these
    operations are sometimes called “delightfully parallel” and this is because they
    easily lend themselves to being scheduled on several threads. However, not every
    query has these ‘delightfully parallel’ operations; most of the time, queries
    involve certain operators that will slow parallel execution down or simply can’t
    be parallelized at all. Even if a query is ‘delightfully parallel’, the data source
    still has to be partitioned by PLINQ and work still has to be scheduled on the
    threads. This usually ends in the results being merged on completion of the query.


    All of these kinds of operations cause the cost of parallelization to rise in
    terms of computation and these costs are known as overheads. For the best performance
    to be achieved in PLINQ queries, the ‘delightfully parallel’ parts need to be
    maximized and the parts that need the overhead should be minimized. To finish
    this section on PLINQ, we are going to look at writing PLINQ queries that are
    as efficient as they can be while still providing the right results.


    # What Can Impact PLINQ Query Performance?


    What we are going to look at now are some of the very important factors that can
    have an impact on the performance of parallel queries. These are general and,
    on their own, are simply not enough for a prediction on the performance of a query
    in all cases. As with everything, you should measure the real performance of a
    query on computers that offer a series of representative loads and configurations.


    +   - Computational cost – overall work'
  merge: -1
  img_proc: true
- pgno: 430
  md: "To be speeded up, PLINQ queries need to have sufficient ‘delightfully parallel’\
    \ work in order for the overhead to be offset. That work can be expressed in terms\
    \ of the computational cost of each individual delegate multiplied by how many\
    \ elements there are in the source collections. Assuming that parallelization\
    \ is possible on an operation then the more expensive it is in computational terms\
    \ and that means there is more opportunity for it to be sped up.\n\nFor example,\
    \ let’s say that a specific function will execute in one millisecond. If you have\
    \ a sequential query that goes over a thousand elements, the operation will take\
    \ one second to perform. On the other hand, a parallel query done on a computer\
    \ that has four cores could be done inside of 250 milliseconds. The speedup gained\
    \ here is 750 milliseconds. If the elements in the function needed one second\
    \ each to execute, the speedup would equate to 750 seconds. If the delegate works\
    \ out to be significantly expensive, PLINQ could offer sufficient speedup when\
    \ the source collection only has a few items. On the other hand, collections with\
    \ little source data and trivial delegates generally don’t make very good PLINQ\
    \ candidates.\n\nIn the example below, you can see that queryA is a good PLINQ\
    \ candidate assuming that there is a lot of work involved in the Select function.\
    \ However, queryB probably isn’t a great candidate because the Select statement\
    \ has insufficient work and the parallelization overhead cost will offset most,\
    \ if not all, of any speedup gained:\n\n```\nvar queryA = from num in numberList.AsParallel()\n\
    \    select ExpensiveFunction(num); //a great candidate for PLINQ\n```\n\n```\n\
    var queryB = from num in numberList.AsParallel()\n    where num % 2 > 0\n    select\
    \ num; //not such a good candidate for PLINQ\n```\n\n+   - Degree Of Parallelism"
  merge: -1
  img_proc: true
- pgno: 431
  md: 'In simple terms, determine how many logical cores the system has. This is an
    obvious follow-on because a ‘delightfully parallel’ query will clearly run faster
    on a system that has more cores simply because the work can be broken down into
    chunks and run concurrently on separate threads. How much speedup is gained will
    depend on the percentage of the query work is parallelizable. However, what you
    should not do is assume that every query is going to run at twice the speed on
    a computer with eight cores than on a computer with four cores. When queries are
    tuned for the best performance, you must measure the real results on computer
    systems with varying numbers of cores. In relation to the previous factor, if
    you have large computing resources, you need large datasets to take full advantage
    of it.


    # Type and Number of Operations


    The AsOrdered operator is provided by PLINQ when the element order inside the
    source sequence needs to be maintained. Ordering comes with a cost but this isn’t
    usually too much. The operations of Join and GroupBy also incur a cost. PLINQ
    works the best when you let it process the source collection elements in any order
    it wants to, and passing them to another operator when they are ready.


    # Query Execution Form


    If the results of a query are being stored, usually by calling ToList or ToArray,
    the results from every parallel thread have to merge into one data structure.
    To do this incurs an overhead that simply cannot be avoided. In the same way,
    if the results are iterated over with a foreach loop, the worker thread results
    must be serialized on to the enumerator thread. However, if you only want an action
    performed based on each thread result, the ForAll method can be used to do this
    on multiple threads.


    # Merger Option Types


    There are two ways to configure PLINQ – to buffer its own output and produce it
    in small chunks or in one go once the entire set of results has been produced,
    or to stream the results as they come in'
  merge: -1
  img_proc: true
- pgno: 432
  md: 'individually. With the first way, execution time is shorter and, with the second,
    latency in between the elements that result is reduced. While the merger options
    don’t always impact significantly on the overall performance of the query, they
    can have an impact on the perceived performance because they are in control of
    the length a time a user waits before they see the results.


    # Partitioning


    Sometimes, PLINQ queries over source collections that are indexable can result
    in a workload that isn’t very balanced. When this happens, you can create custom
    partitioners to try to increase the performance of the query.


    # When Sequential Mode is Chosen


    PLINQ always tries to execute queries at a speed that is as fast or faster than
    sequential execution. PLINQ doesn’t look to see the computational cost of the
    user delegates and it doesn’t look to see the size of the input source, but it
    will look for specific shapes in the queries. More specifically, it will look
    to see if operators or combinations of operators are in use that tends to slow
    down query execution when in parallel mode. When it sees them, by default, PLINQ
    will go back to sequential mode.


    However, if you measure the performance of a specific query and determine that
    parallel mode would be far better and quicker, you can make use of the flag called
    ParallelExecutionMode.ForceParallelism by using the method called WithExecutionMode,
    thus telling PLINQ that you want the query run in parallel mode.


    The next list describes each of the query shapes that will be executed sequentially
    by PLINQ:


    +   - Queries with an indexed Where, Select, ElementAt or indexed SelectMany clause
    once the filtering or ordering operator has either rearranged or removed altogether
    the original indices'
  merge: -1
  img_proc: true
- pgno: 433
  md: '+   - Queries with a Skip, SkipWhile, Take or TakeWhile operator and where
    the source sequence indices are no longer in their original order

    +   - Queries with SequenceEquals or Zip, with the exception of any data source
    whose index is in the original order and the other data source is an IList(T),
    array, or another one that can be indexed

    +   - Queries with Concat unless it has been applied to a data source that can
    be indexed

    +   - Queries with Reverse, unless it has been applied to a data source that can
    be indexed


    # PLINQ Order Preservation


    You already know that PLINQ has one main goal – maximum performance while keeping
    everything correct. Queries should be able to run as fast as they possibly can
    while producing the right results. Sometimes, the requirement for correct results
    will require preservation of the source sequence order, but ordering can come
    at a high computational cost. Therefore, PLINQ, by default, will not preserve
    that order. In this sense, it is much like a LINQ to SQL query but not like the
    LINQ to Objects query, where order preservation is required.


    You can, however, override the default and enable order preservation and you do
    that by using the operator called AsOrdered on the source sequence. Then, order
    preservation can be disabled later with the operator called AsUnordered. On both
    of these, the query processing will be based on whatever heuristic determines
    whether parallel or sequential execution should be done.


    In the next example, you can see a parallel query, unordered, and filtering for
    any element that matches a specific condition without attempting to order the
    results.'
  merge: -1
  img_proc: true
- pgno: 434
  md: "```\nvar cityQuery = (from city in cities.AsParallel()\n    where city.Population\
    \ > 10000\n    select city)\n    .Take(1000);\n```\n\nThe result of this query\
    \ will not necessarily be the first 1000 cities in the sequence that match the\
    \ condition. Instead, it may be a set of any 1000 cities meeting that condition.\
    \ The query operators in PLINQ will partition the sequence into several subsequences,\
    \ all of which are processed concurrently. If there is no specification for order\
    \ preservation, each partition’s results are handed off to the next part of the\
    \ query in an order that is not necessarily consistent. In addition, one of the\
    \ partitions may give a result subset before it continued processing the rest\
    \ of the elements. The order could be different every single time and your application\
    \ has no way of controlling this because it will all come down to how the threads\
    \ are scheduled by the operating system.\n\nIn the next example, the AsOrdered\
    \ operator is used on the source sequence to override the default behavior, thus\
    \ ensuring that the method called Take returns the first 1000 cities that meet\
    \ the specified condition:\n\n```\nvar orderedCities = (from city in cities.AsParallel().AsOrdered()\n\
    \    where city.Population > 10000\n    select city)\n    .Take(1000);\n```\n\n\
    However, this is unlikely to run at the speed of the unordered version. The ordered\
    \ version has to track the original ordering through each partition, and when\
    \ it comes to merging, must ensure consistent ordering. As such, it is recommended\
    \ that AsOrdered is used only when absolutely needed and only on bits of the query\
    \ that need it. When you don’t need order preservation any longer, make sure the\
    \ AsUnordered operator is used to disable it."
  merge: -1
  img_proc: true
- pgno: 435
  md: "The next example composes a pair of queries to achieve this:\n\n```\nvar orderedCities2\
    \ = (from city in cities.AsParallel().AsOrdered()\n    where city.Population >\
    \ 10000\n    select city)\n    .Take(1000);\n```\n\n```\nvar finalResult = from\
    \ city in orderedCities2.AsUnordered()\n    join p in people.AsParallel() on city.Name\
    \ equals p.CityName into details\n    from c in details\n    select new { Name\
    \ = city.Name, Pop = city.Population, Mayor = c.Mayor };\n```\n\n```\nforeach\
    \ (var city in finalResult) {/*...*/}\n```\n\nNote that, in PLINQ, the order of\
    \ a sequence is preserved by using operators that impose order for the remainder\
    \ of the query, In other words, ThenBy, OrderBy, and other similar operators are\
    \ treated as if an AsOrdered call follows them."
  merge: -1
  img_proc: true
- pgno: 436
  md: '# Query Operators and Ordering


    The query operators listed below are used to bring order preservation into all
    subsequent query operations until a call to AsUnordered is made:


    +   - *OrderBy*

    +   - *OrderByDescending*

    +   - *ThenBy*

    +   - *ThenByDescending*


    And these query operators may sometimes require the source sequences to be ordered
    for the correct results to be produced:


    +   - Reverse

    +   - SequenceEqual

    +   - TakeWhile

    +   - SkipWhile

    +   - Zip


    However, other operators behave in a different way depending on whether the source
    sequence is unordered or ordered. The operators are shown below together with
    the result on ordered and unordered source sequences:


    | Operator | Ordered | Unordered |

    |---|---|---|

    | egate | Nondeterministic where the operation is noncommutative or nonassociative
    for both ordered and unordered sequences | |

    |  | Not Applicable for either ordered or unordered sequences | |

    |  | Not applicable for either ordered or unordered sequences | |

    | umerable | Not applicable for either ordered or unordered sequences | |

    | age | Nondeterministic where the operation is noncommutative or nonassociative
    for both | |'
