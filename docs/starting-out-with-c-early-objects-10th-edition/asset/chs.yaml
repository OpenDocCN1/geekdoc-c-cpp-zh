  \ `names.dat` 文件中找到。\n\n# 第 10 章 指针\n\n## 10.1 指针与地址运算符\n\n## 概念\n每个变量都被分配了一个内存位置，该地址可以使用地址操作符\
  \ `&` 获取。内存位置的地址被称为指针。执行中的程序中的每个变量都分配了一段足够大的内存，以容纳该变量类型的值。运行在 PC 上的当前 C++ 编译器为 `char`\
  \ 类型变量分配 1 字节，为 `short` 类型变量分配 2 字节，为 `float` 和 `long` 类型变量分配 4 字节，并为 `double` 类型变量分配\
  \ 8 字节。\n\n内存的每个字节都有唯一的地址。变量的地址是分配给该变量的第一个字节的地址。假设程序定义了以下变量：\n\n```\nchar letter;\n\
  short number;\nfloat amount;\n```\n\n图 10-1 说明了它们在内存中可能的排列方式并显示了它们的地址。\n\n### 图\
  \ 10-1 变量及其地址\n在图 10-1 中，变量 `letter` 显示在地址 1200，`number` 在地址 1201，`amount` 在地址 1203。\n\
  \n图 10-1 中所示变量的地址具有任意性，仅用于说明目的。事实上，大多数编译器分配空间的方式使得单个变量被分配偶数地址。这是因为当前计算机硬件访问位于偶数地址的数据比访问位于奇数地址的数据快。\n\
  \nC++ 有一个地址操作符 `&`，可以获取任何变量的地址。要使用它，将其放在你想要地址的变量之前。这里是一个返回 `amount` 变量地址的表达式：\n\n\
  ```\n&amount\n```\n\n这是一个在屏幕上显示变量地址的语句：\n\n```\ncout << long(&amount);\n```\n\n\
  默认情况下，C++ 以十六进制打印地址。在这里我们使用了到 `long` 的函数转换，以常用的十进制格式打印地址。程序 10-1 展示了如何使用地址运算符显示变量地址。\n\
  \n值 `&amount` 指定了变量 `amount` 在计算机内存中的位置：从某种意义上说，它指向 `amount`。代表内存位置地址的值或持有某些变量地址的值被称为指针。\n\
  \n## 10.2 指针变量\n\n## 概念\n指针变量是存储内存位置地址的变量。就像其他数据值一样，内存地址或指针值也可以存储在适当类型的变量中。存储地址的变量被称为指针变量，但通常简称为指针。指针变量的定义（例如\
  \ `ptr`）必须指定 `ptr` 将指向的数据类型。这里有一个例子：\n\n```\nint *ptr;\n```\n\n\n\n\n\n变量名前的星号表示\
  \ `ptr` 是一个指针变量，而 `int` 数据类型表示 `ptr` 只能用于指向或保存整数变量的地址。这个定义可以读作“`ptr` 是一个指向 `int`\
  \ 的指针”。将 `ptr` 视为“`ptr` 所指向的变量”也是很有用的。从这个观点来看，刚刚给 `ptr` 的定义可以读作“`ptr` 所指向的变量类型为\
  \ `int`”。因为星号（`*`）允许你从指针跳转到指向的变量，所以它被称为`间接操作符`。\n\n有些程序员倾向于在类型名旁边使用星号声明指针，而不是变量名旁边。例如，上面的声明可以写成：\n\
  \n```\nint* ptr;\n```\n\n这种风格的声明在视觉上强化了 `ptr` 的数据类型不是 `int` 而是指向 `int` 的指针这一事实。两种声明风格都是正确的。\n\
  \n程序 10-2 展示了指针的一个非常简单的用法：存储并打印另一个变量的地址。\n\n在程序 10-2 中，定义了两个变量：`x` 和 `ptr`。变量 `x`\
  \ 是一个 `int`，而 `ptr` 是指向 `int` 的指针。变量 `x` 初始化为 `25`，而通过以下语句将 `x` 的地址赋值给 `ptr`：\n\n\
  ```\nptr = &x;\n```\n\n图 10-2 说明了 `ptr` 和 `x` 之间的关系。\n\n## 图 10-2 指向变量的指针\n\n![图表显示了一个标记为“x”的矩形。矩形显示数字\
  \ 25。一个注释写着“x 的地址: 0x7e00”。图表显示另一个标记为“ptr”的矩形。它显示为“0x7e00”。从这个矩形出的箭头指向标记为“x”的矩形。](img/FG_10_002.png)\n\
  \n如图 10-2 所示，变量 `x` 位于内存地址 `0x7e00` 并包含数字 `25`，而指针 `ptr` 包含地址 `0x7e00`。本质上，`ptr`\
  \ “指向”变量 `x`。\n\n你可以使用指针来间接访问和修改所指向的变量。例如，在程序 10-2 中，`ptr` 可以用来改变变量 `x` 的内容。当间接操作符放在指针变量名前之前时，它会对指针进行`解引用`（dereferences）。当你处理一个解引用的指针时，你实际上是在处理指针所指向的值。这在程序\
  \ 10-3 中得到了证明。\n\n每当表达式 `*ptr` 在程序 10-3 中出现时，程序都会间接使用变量 `x`。接下来的 `cout` 语句显示两次 `x`\
  \ 中的值：\n\n```\ncout ≪ x ≪ \" \" ≪ *ptr ≪ endl;\n```\n\n而接下来的语句将 100 存储在 `x` 中：\n\
  \n```\n*ptr = 100;\n```\n\n通过间接操作符，`ptr` 可以被用来间接访问它所指向的变量。程序 10-4 证明了指针可以被用来间接访问它指向的变量。\n\
  \n### 注意\n到目前为止你已经看到了星号的三种用法：\n\n- 作为乘法运算符，在语句中如：\n```\ndistance = speed * time;\n\
  ```\n- 在指针的定义中，如：\n```\nint *ptr;\n```\n- 作为间接操作符，在语句中如：\n```\n*ptr = 100;\n```\n\
  \n## 10.3 数组与指针之间的关系\n\n## 概念\n数组名可以作为指针常量，指针可以使用数组名。你之前学过不带下标的数组名代表数组的起始地址。这意味着数组名实际上是一个指针。程序\
  \ 10-5 通过显示使用间接操作符的数组名来说明了这一点。\n\n由于 `numbers` 类似于数组起始地址的指针，当 `numbers` 被解引用时，获取的是第一个元素。那么，如何使用间接操作符获取整个数组的内容？记住，数组元素在内存中是连续存储的，如图\
  \ 10-3 所示。\n\n#### 图 10-3 数组元素存储在连续的位置\n![存储显示了一个包含 5 个矩形的数组，下标从“numbers[0]”到“numbers[4]”。每个矩形由虚线分割。第一个矩形旁的注释写着“numbers”。](images/FG_10_003.png)\n\
  \n如果 `numbers` 是 `numbers[0]` 的地址，那么将值加上 `numbers` 以获取数组中其他元素的地址是合理的。然而，重要的是，指针在数学语句中的工作方式不像普通变量。在\
  \ C++ 中，当你给指针加上一个值时，你实际上是在加上该值乘以指针引用的类型的大小。换句话说，如果你给 `numbers` 加上 1，你实际上是给 `numbers`\
  \ 加上 `1 * sizeof(short)`。如果你给 `numbers` 加上 2，结果是 `numbers + 2 * sizeof(short)`，以此类推。在\
  \ PC 上，由于 `short` 整数占用 2 字节，这意味着以下成立：\n\n```\n*(numbers + 1) 是地址 numbers + 1*2 处的值\n\
  *(numbers + 2) 是地址 numbers + 2*2 处的值\n*(numbers + 3) 是地址 numbers + 3*2 处的值\n```\n\
  \n以此类推。这种自动转换意味着可以通过下标或通过指针加上下标获取数组中的元素。如果表达式 `*numbers`（相当于 `*(numbers + 0)`）获取的第一个元素，那么\
  \ `*(numbers + 1)` 获取第二个元素。同样，`*(numbers + 2)` 获取第三个元素，以此类推。图 10-4 显示了下标法和指针表示法的等效性。\n\
  \n#### 图 10-4 下标法与指针法\n![存储显示了一个包含 5 个矩形的数组，下标从“numbers[0]”到“numbers[4]”。](images/FG_10_004.png)图\
  \ 10-4 完整替代文本\n\n### 注意\n在给指针加上值时，括号是关键的。`*`运算符的优先级高于 `+` 运算符，因此表达式 `*numbers +\
  \ 1` 不等于 `*(numbers + 1)`。表达式 `*numbers + 1` 给数组第一个元素的内容加 1，而 `*(numbers + 1)` 是给\
  \ `numbers` 中的地址加 1，然后对其进行解引用。\n\n程序 10-6 显示了使用指针表示法访问数组的全部内容。\n\n在处理数组时，记住以下规则：\n\
  \n```\narray[index] 等同于 *(array + index)\n```\n\n## 警告！\n记住，C++ 对数组不进行边界检查。在使用指针遍历数组时，可能会给指针一个数组范围外的地址。\n\
  \n\n\n\n为了演示数组名与指针之间的关系是有多紧密，请查看程序 10-7。它定义了一个 `double` 数组和一个 `double` 指针，并将数组的起始地址赋值给指针。不仅在数组名上使用了指针表示法，甚至在指针上使用了下标表示法！\n\
  \n注意，当将数组的地址赋值给指针时，不需要使用地址操作符。因为数组名本身就是一个地址，所以使用 `&` 运算符将是错误的。然而，你可以使用地址操作符来获取数组中单个元素的地址。例如，`&numbers[1]`\
  \ 获取 `numbers[1]` 的地址。这种技术用于程序 10-8。\n\n数组名与指针变量唯一的区别在于，你不能改变数组名所指向的地址。例如，给定以下定义：\n\
  \n```\n double readings[20], totals[20];\ndouble *dptr;\n```\n\n这些语句是合法的：\n\n```\n\
  \ dptr = readings; // 让 dptr 指 readings\ndptr = totals;   // 让 dptr 指 totals\n```\n\
  \n但这些是非法的：\n\n```\n readings = totals; 非非法！不能改变 readings\ntotals = dptr;     //\
  \ 非法！不能改变 totals\n```\n\n数组名是`指针常量`。你不能让它们指向除它们代表的数组以外的任何内容。\n\n# 10.4 指针算术\n\n\
  ## 概念\n\n指针可以通过加或减整数值来修改。\n\n指针变量的内容可以通过执行加法或减法的数学语句进行更改。这在程序 10-9 中得到了演示。第一个循环增加指针变量，使其遍历数组的每个元素。第二个循环递减指针，使其反向遍历数组。\n\
  \n### 注意\n\n由于 `numPtr` 是一个指针，递增运算符向 `numPtr` 加上一个整数的大小，因此它指向数组中的下一个元素。同样，递减运算符从指针中减去一个整数的大小。\n\
  \n并不是所有的算术操作都可以用于指针。例如，你不能对指针使用乘法或除法。以下操作是允许的：\n\n* 可以使用 `++` 和 `--` 运算符增加或递减指针变量。\n\
  * 可以在指针变量上加或减一个整数。这可以通过 `+` 和 `–` 运算符，或者 `+=` 和 `-=` 运算符完成。\n* 一个指针可以从另一个指针中减去。\n\
  \n# 10.5 初始化指针\n\n## 概念\n\n指针可以使用现有对象的地址进行初始化。\n\n记住，指针的设计目的是指向特定数据类型的对象。当指针用一个地址初始化时，它必须是该指针可以指向的对象的地址。例如，以下对\
  \ `pint` 的定义是合法的，因为 `myValue` 是一个整数：\n\n```\n int myValue;\nint *pint = &myValue;\n\
  ```\n\n以下也是合法的，因为 `ages` 是一个整数数组：\n\n```\n int ages[20];\nint *pint = ages;\n```\n\
  \n但以下对 `pint` 的定义是非法的，因为 `myFloat` 不是一个 `int`：\n\n```\n float myFloat;\nint *pint\
  \ = &myFloat; \t// 非法！ \n```\n\n指针可以在同一语句中与其他相同类型的其他变量一起定义。以下声明定义了一个整数变量 `myValue`，然后定义了一个指针\
  \ `pint`，该指针用 `myValue` 的地址初始化：\n\n```\n int myValue, *pint = &myValue;\n```\n\n\
  以下定义定义了一个数组 `readings` 和一个指针 `marker`，该指针用数组中第一个元素的地址初始化：\n\n```\n double readings[50],\
  \ *marker = readings;\n```\n\n当然，指针只能用已经定义的对象的地址进行初始化。以下是非法的，因为 `pint` 正在用一个尚不存在对象的地址初始化：\n\
  \n```\n int *pint = &myValue;\t// 非法！\nint myValue;\n```\n\n未初始化的本地指针变量不持有有效地址，尝试使用此类指针会导致运行时错误。旧版\
  \ C++ 的惯例是将地址 0 赋值给当前没有指向任何有效内存位置的指针：\n\n```\n int *ptrToint = 0;\ndouble *ptrToDouble\
  \ = 0;\n```\n\n在许多计算机中，地址 0 被操作系统数据占用，用户程序无法访问。许多头文件（包括 `iostream`、`fstream` 和 `cstdlib`）定义了常量\
  \ `NULL` 来表示无效地址。因此，以下等同于：\n\n```\n int *ptrToint = NULL;\ndouble *ptrToDouble =\
  \ NULL;\n```\n\n在 C++ 中，在变量末尾加上大括号 `{}` 将变量初始化为默认值。对于 `int`、`long` 和 `double` 等数值类型，默认值为零，而指针类型的默认值是\
  \ `nullptr`。因此，以下定义\n\n```\n int myInt = 0;\ndouble myDouble = 0.0;\n int *ptrToInt\
  \ = nullptr;\n```\n\n等同于\n\n```\n int myInt{ };\ndouble myDouble{ };\n int *ptrToInt{\
  \ };\n```\n\n一眼看出指针是否已赋值是非常重要的。出于这个原因，指针应该在定义附近初始化或赋值。此外，不再指向有效位置的指针应被 `nullptr`，除非该指针超出作用域或程序即将终止。\n\
  \n# 节点\n\n1. 10.1 写一条语句显示变量 `count` 的地址。\n2. 10.2 写一个语句定义 `dPtr`。它应该是一个指向 `double`\
  \ 的指针。\n3. 10.3 列出 C++ 中 `*` 符号的三种用法。\n4. 10.4 下述程序的输出是什么？\n\n```\n#include <iostream>\n\
  using namespace std;\nint main()\n{\n   int x = 50, y = 60, z = 70;\n   int *ptr\
  \ = nullptr;\n\n   cout << x << \" \" << y << \" \" << z << endl;\n   ptr = &x;\n\
  \   *ptr *= 10;\n   ptr = &y;\n   *ptr *= 5;\n   ptr = &z;\n   *ptr *= 2;\n   cout\
  \ << x << \" \" << y << \" \" << z << endl;\n   return 0;\n}\n```\n\n5. 10.5 重写以下循环，使用指针符号（配合间接运算符）而不是下标表示法。\n\
  \n```\nfor (int x = 0; x < 100; x++)\n    cout << array[x] << endl;\n```\n\n6. 10.6\
  \ 假设 `ptr` 是指向 `int` 的指针并持有地址 12000。在整数为 4 字节的系统中，执行以下语句后 `ptr` 中的地址是多少？\n\n```\n\
  ptr += 10;\n```\n\n7. 10.7 假设 `pint` 是一个指针变量。对于以下每个语句，判断它是有效的还是无效的。对于无效的，解释原因。\n\
  \n    1. `pint++;`\n    2. `--pint;`\n    3. `pint /= 2;`\n\n\n\n4. `pint *= 4;`\n\
  5. `pint += x; // Assume x is an int.`\n\n## 10.8\n对于以下每个变量定义，确定该语句是有效的还是无效的。对于无效的，请解释原因。\n\
  \n1. `int ivar;`\n   `int *iptr = &ivar;`\n\n2. `int ivar, *iptr = &ivar;`\n\n3.\
  \ `float fvar;`\n   `int *iptr = &fvar;`\n\n4. `int nums[50], *iptr = nums;`\n\n\
  5. `int *iptr = &ivar;`\n   `int ivar;`\n\n# 10.6 比较指针\n\n## 概念\nC++ 的关系运算符可以比较指针值。\n\
  \n可以使用 C++ 的任何关系运算符来比较指针：\n\n```\n > < == != >= <=\n```\n\n如果一个内存地址位于另一个地址之前，则第一个地址被认为“小于”第二个地址。在数组中，所有元素都存储在连续的内存位置，因此元素\
  \ 1 的地址大于元素 0 的地址。这在图 10-5 中所示所示。\n\n## 图 10-5 数组元素的地址\n![图表显示了 5 个整数的数组存储。](img/FG_10_005.png)图\
  \ 10-5 完整替代文本\n\n由于数组中每个后续元素的地址都会变大，以下布尔表达式均为真：\n\n```\n &array[1] > &array[0]\n\
  array < &array[4]\narray == &array[0]\n&array[2] != &array[3]\n```\n\n### 注意\n比较两个指针不等同于比较这两个指针所指向的值。例如，以下\
  \ `if` 语句比较存储在指针变量 `ptr1` 和 `ptr2` 中的地址：\n\n```\n if (ptr1 < ptr2)\n```\n\n然而，以下语句比较的是\
  \ `ptr1` 和 `ptr2` 指向的值：\n\n```\n if (*ptr1 < *ptr2)\n```\n\n比较地址的能力为你提供了另一种方法，确保指针不会超出数组的边界。程序\
  \ 10-10 将指针 `numPtr` 初始化为数组 `numbers` 的起始地址。然后，指针 `numPtr` 遍历数组，直到它包含的地址等于数组最后一个元素的地址相等。然后，指针反向遍历数组，直到指向第一个元素。\n\
  \n大多数涉及指针的比较都是将指针与 `0、NULL 或 nullptr` 进行比较，以确定该指针是否指向合法地址。例如，假设 `ptrToInt` 已定义为指向\
  \ `int` 的指针，代码\n\n```\n if  (ptrToInt != nullptr)\n    cout ≪ *ptrToInt;\nelse\n\
  \    cout ≪ \"null pointer\";\n```\n\n只有在验证 `ptrToInt` 不是空指针后，才会打印该指针指向的整数。\n\n\
  # 10.7 作为函数参数的指针\n\n## 概念\n指针可以作为函数参数。它让函数能够访问原始参数，就像引用参数一样。\n\n在第 6 章中，你学习了将引用变量作为函数参数的概念。引用变量是用作参数的原始变量的别名。这使得函数能够访问原始参数变量，允许它更改变量的内容。当变量被传递给引用参数时，该参数被称为“按引用传递”。\n\
  \n按引用传递参数的替代方案是使用指针变量作为参数。诚然，引用变量比指针要容易处理得多。引用变量隐藏了所有关于解引用和间接访问的“机制”。然而，你仍然应该学习使用指针作为函数参数，因为某些任务（特别是在处理\
  \ C 字符串时）用指针完成效果最好。⁵ 此外，C++ 中有许多使用指针作为参数的函数。\n\n这是一个使用指针参数的函数定义：\n\n```\n void doubleValue(int\
  \ *val)\n{\n   *val *= 2;\n}\n```\n\n该函数的作用是通过以下语句使 `val` 指向的变量翻倍：\n\n```\n *val\
  \ *= 2;\n```\n\n当 `val` 被解引用时，`*=` 运算符作用于 `val` 指向的变量。该语句将存储在 `val` 中的原始变量乘以 2。当然，在调用函数时，必须使用要翻倍变量的地址作为参数，而不是变量本身。\n\
  \n以下是调用 `doubleValue` 函数的示例：\n\n```\n doubleValue(&number)\n```\n这使用 `&` 运算符将 `number`\
  \ 的地址传递给 `doubleValue` 函数。\n\n\n\n\n\n```cpp\n const int SIZE = 6;\nconst double\
  \ payRates[SIZE] = { 18.55, 17.45,\n\t\t\t\t12.85, 14.97,\n\t\t\t\t10.35, 18.89\
  \ };\n```\n\n在这段代码中，`payRates` 是一个 `const` 类型双精度数的数组。这意味着数组中的每个元素都是 `const double`，编译器将不允许我们编写更改数组内容的代码。如果我们想将\
  \ `payRates` 数组传递给指针参数，该参数必须声明为指向 `const double` 的指针。下面的函数展示了示例：\n\n```cpp\n void\
  \ displayPayRates(const double *rates, int size)\n{\n   // 设置数值输出格式\n   cout ≪ setprecision(2)\
  \ ≪ fixed ≪ showpoint;\n\n   // 显示所有的薪率\n   for (int count = 0; count < size; count++)\n\
  \   {\n   \tcout ≪ \"Pay rate for employee \" ≪ (count + 1)\n\t     ≪ \" is $\"\
  \ ≪ *(rates + count) ≪ endl;\n   }\n}\n```\n\n在函数头中，注意 `rates` 参数被定义为指向 `const`\
  \ double 的指针。需要注意的是，`const` 词作用于 `rates` 指向的内容，而不是 `rates` 本身。这在图 10-6 中有所说明。\n\n\
  ## 图 10-6 指向持有常量的内存指针\n\n![图像显示了文本“const double asterisk symbol rates.”在“const double”旁边的注释写着“这是\
  \ rates 指向的内容”。星号符号旁边的另一个注释写着“星号表示 rates 是一个指针”。](img/FG_10_006.png)\n\n由于 `rates`\
  \ 是指向 `const` 的指针，编译器将不允许我们编写更改 `rates` 所向的内容的代码。\n\n将常量的地址传递给指针变量时，该变量必须定义为指向常量的指针。如果在\
  \ `rates` 参数的定义中漏掉了 `const` 词，将导致编译器错误。\n\n## 将非常量参数传递常量指针\n\n虽然常量的地址只能传递给指向 `const`\
  \ 的指针，但指向 `const` 的指针也可以接收非常量项的地址。例如，查看程序 10-13。\n\n### 注意\n\n在编写使用指针参数的函数时，如果该函数并不打算更改参数所指向的数据，将参数设为指向\
  \ `const` 的指针始终是一个好主意。这不仅可以防止你在函数中编写意外更改参数的代码，而且函数还能够接受常量和非常量参数的地址。\n\n## 常量指针\n\
  \n在上一节中，我们讨论了指向 `const` 的指针，即指向 `const` 数据的指针。你也可以使用 `const` 关键字来定义常量指针。以下是指向 `const`\
  \ 的指针与 `const` 指针之间的区别：\n\n* 指向 `const` 的指针指向一个常量项。指针指向的数据不能改变，但指针本身可以改变。\n* 对于\
  \ `const` 指针，指针本身是常量的。一旦指针用地址初始化，它就不能指向其他任何内容。\n\n下面的代码展示了一个 `const` 指针的示例：\n\n\
  ```cpp\n int value = 22;\nint * const ptr = &value;\n```\n\n注意 `ptr` 的定义中，`const`\
  \ 词出现在星号之后。这意味着 `ptr` 是一个 `const` 指针。这在图 10-7 中有所说明。在代码中，`ptr` 用变量 `value` 的地址初始化。由于\
  \ `ptr` 是常量指针，如果我们编写让 `ptr` 指向其他任何内容的代码，将导致编译器错误。然而，如果我们使用 `ptr` 来更改 `value` 的内容，则不会产生错误。因为\
  \ `value` 不是常量，且 `ptr` 并不是指向 `const` 的指针。\n\n## 图 10-7 常量指针\n\n![图像显示了文本“int asterisk\
  \ const ptr.”在“int”旁边的注释写着“这是 ptr 指向的内容。”在“asterisk symbol const”旁边的另一个注释写着“星号符号\
  \ const 表示 ptr 是一个常量指针”。](img/FG_10_007.png)\n\n常量指针必须用一个初始值初始化，如之前的示例代码所示。如果将常量指针用函数参数，编译器将不允许我们编写更改\
  \ `ptr` 所向的内容的代码。由于 `ptr` 是指向 `const` 的指针，我们无法用它来更改 `value` 的内容。这是一个示例：\n\n```cpp\n\
  \ void displayZero(int const ptr)\n{\n   ptr = 0; // ERROR\n}\n```\n\n由于 `rates`\
  \ 是指向 `const` 的指针，编译器将不允许我们编写更改 `rates` 所向的内容的代码。将常量的地址传递给指针变量时，该变量必须定义为指向常量的指针。如果在\
  \ `rates` 参数的定义中漏掉了 `const` 词，将导致编译器错误。\n\n## 指向常量的常量指针\n\n到为止，在使用 `const` 时，我们已经看到了指向常量的指针，也看到了常量指针。在\
  \ `ptr` 的定义中，`const` 词出现在星号之后。这意味着 `ptr` 是一个 `const` 指针。这在图 10-7 中有所说明。在代码中，`ptr`\
  \ 用变量 `value` 的地址初始化。由于 `ptr` 是常量指针，如果我们编写让 `ptr` 指向其他任何内容的代码，将导致编译器错误。然而，如果我们使用\
  \ `ptr` 来更改 `value` 的内容，则不会产生错误。因为 `value` 不是常量，且 `ptr` 并不是指向 `const` 的指针。\n\n常量指针必须用一个初始值初始化，如之前的示例代码所示。如果将常量指针用函数参数，如果如果在\
  \ `rates` 参数的定义中漏掉了 `const` 词，将导致编译器错误。\n\n## 10.9 动态内存分配\n\n## 概念\n\n变量可以在程序运行时创建和销毁。\n\
  \n只要你知道在程序执行期间需要多少个变量，就可以预先定义这些变量。例如，一个计算矩形面积的程序需要三个变量：一个用于矩形的长度，一个用于矩形的宽度，一个用于存储面积。如果你正在编写一个计算\
  \ 30 名员工工资的程序，你可能会创建一个包含 30 个元素的数组来存储每个人的工资金额。\n\n\n\n\n但当你不知道需要多少个变量时，该怎么办？例如，假设你想写一个测试平均值程序，它可以计算任意数量测试的平均值。显然，这个程序将非常非常通用，但如果你不知道要定义多少个变量，你该如何在内存中存储各个测试分数呢？简单来说，你可以允许程序“动态地”创建它自己的变量。这被称为动态内存分配，并且只有通过使用指针才能实现。\n\
  \n动态分配内存意味着程序在运行时，请求计算机留出一块足够大的未闲内存，其大小恰好容纳一个特定数据类型的变量。假设一个程序需要创建一个整数变量。它会向计算机请求分配足够的字节空间来存储一个\
  \ `int`。当计算机完成这一请求时，它会找到并留出某块足够容纳该变量的未闲内存。然后，它会将该块内存的起始地址赋给程序。程序只能通过该地址访问新分配的内存，因此使用这些字节空间需要指针。\n\
  \nC++ 程序请求动态分配内存的方法是通过 `new` 运算符。假设一个程序定义了一个指向 `int` 的指针，定义如下：\n\n```\nint *iptr\
  \ = nullptr;\n```\n\n你可以使用 `new` 运算符动态分配一个整数变量，并将新分配变量的地址赋给 `iptr`，如下：\n\n```\n\
  iptr = new int;\n```\n\n`new` 运算符的操作数是所创建变量的数据类型。这在图 10-9 中说明了这一点。一旦该语句执行，`iptr`\
  \ 将包含新分配内存的地址。可以通过解引用指针在这一新变量中存储一个值：\n\n```\n*iptr = 25;\n```\n\n# 图 10-9 指向动态分配内存的指针\n\
  \n![图表显示 10 个大小相同的矩形上下堆叠。](img/FG_10_009.png)图 10-9 完整替代文本\n\n只需通过使用解引用指针，就可以对新变量执行任何其他操作。以下是一些示例语句：\n\
  \n```\ncout << *iptr;\t// 显示新变量的内容。\ncin >> *iptr;\t// 让用户输入一个值。\ntotal += *iptr;\t\
  // 在计算中使用新变量。\n```\n\n尽管这些语句说明了 `new` 运算符的使用，但动态分配单个变量的意义并不大。`new` 运算符更实用的用法是动态创建一个数组。以下是如何分配一个包含\
  \ 100 个元素的整数数组的示例：\n\n```\niptr = new int[100];\n```\n\n一旦数组创建完成，就可以使用下标法配合指针来访问它。例如，可以使用以下循环在每个元素中存储值\
  \ 1：\n\n```\nfor (int count = 0; count < 100; count++)\n   iptr[count] = 1;\n```\n\
  \n每次调用 `new` 都会从程序内存中一个称为 `堆`（heap）的特殊区域分配存储空间。如果程序对动态内存提出大量请求，堆最终将耗尽，且对 `new` 的额外调用将失败。当这种情况发生时，C++\
  \ 运行时系统将抛出一个 `bad_alloc` 异常，通知调用程序请求的内存无法分配。异常是一种机制，用于通知程序正在执行的操作发生了严重错误，且操作结果不可信。异常的默认操作是强制执行的程序终止。\n\
  \n程序完成对动态分配内存块的使用后，应该释放该内存并将其返回堆，以便供以后使用。这是通过调用 `delete` 运算符并传递要去分配的内存地址来实现的。在 `delete`\
  \ 完成后，应将指针的值设为 `nullptr`，以指示它不再有效。该规则的唯一例外是：某些情况下（例如在程序结束时），可以明确知道被删除的指针永远不会被再次使用。以下是使用\
  \ `delete` 释放由 `iptr` 指向的单个变量的示例：\n\n```\ndelete iptr;\niptr = nullptr;\n```\n\n\
  如果 `iptr` 指向一个动态分配的数组，则在 `delete` 和 `iptr` 之间必须放置一对括号：\n\n```\ndelete [] iptr;\n\
  iptr = nullptr;\n```\n\n除非指针离开作用域，否则在对指针调用 `delete` 之后，立即将其值设为 `nullptr` 是一个良好的做法。这会让程序的其他部分明确该指针不再指向一个有效的内存位置。它还避免了对同一个指针多次调用\
  \ `delete` 可能会产生的问题。这是因为 `delete` 设计为在对空指针进行调用时什么都不做。\n\n# 悬空指针和内存泄漏\n\n如果指针指向的内存位置已通过调用\
  \ `delete` 释放，则称该指针为悬空指针（dangling pointer）。当你访问悬空指针时，你正在尝试使用已经释放并返回堆的内存。事实上，这种内存可能已经被另一次调用\
  \ `new` 重新分配。你可以通过以下方式避免使用悬空指针：\n\n1. 在释放内存后立即将指针设为空，以及\n2. 在尝试访问内存之前验证指针不为空。\n\n\
  如果在程序中使用由 `new` 分配的内存块后，忘记通过 `delete` 释放它，则称发生了内存泄漏。泄漏的内存块在程序终止之前一直无法使用。内存泄漏发生在循环中时尤为严重。对于\
  \ Web 服务器等预期运行数月甚至数年的网络程序，内存泄漏问题更为严重。随着时间的推移，带有内存泄漏的 Web 服务器将耗尽运行其计算机的所有内存，导致其和计算机都需要重启。\n\
  \n## 警告！\n\n只有对之前使用 `new` 使用过的指针才使用 `delete`。如果你对未引用动态分配内存的指针使用 `delete`，可能会导致意外问题！\n\
  \n程序 10-14 演示了 `new` 和 `delete` 的用法。它请求任意天数的销售额。这些金额存储在动态分配的数组中，然后计算总和平均值。\n\n#\
  \ 10.10 从函数返回指针\n\n## 概念\n\n函数可以返回指针，但你必须确保指针引用的项存在。\n\n函数为对象动态分配存储空间、填充对象数据并返回其地址通常是有用的。考虑一个函数，它根据给定的正整数\
  \ `n*` 返回前 `n` 个整数平方序列。例如，如果给函数传递值 4，它将返回一个元素为 1、4、9 和 16 的数组。\n\n当被调用时，函数分配一个指定大小的数组，将元素设置为所需的值，并返回数组基地址的地址。\n\
  \n\n\n\n```cpp\n int *squares(int n)\n{\n   // 分配一个大小为 n 的数组\n   int *sqarray =\
  \ new int[n];\n   // 用平方填充数组\n   for (int k = 0; k < n; k++)\n   \tsqarray[k] =\
  \ (k+1) * (k+1);\n   // 返回所分配数组的起始地址\n   return sqarray;\n}\n```\n\n程序 10-15 显示了另一个示例。该程序包含一个返回随机数数组指针的函数。该函数接受一个整数大小，动态分配一个给定大小的数组，然后用随机值填充数组。该函数使用系统时钟作为随机数生成器的种子。请注意，包含随机数的数组只有在函数\
  \ `main` 执行完毕**之后*才会被删除。\n\n函数可以安全地返回指向尚未删除的动态分配存储的指针。相反，函数不应该返回指向局部变量的指针，因为这些变量的存储在返回时会被自动释放。考虑以下函数，它返回一个局部数组的地址：\n\
  \n```cpp\n int *errSquares(int n)\n{\n\t// 假设 n 小于 100，使用局部数组\n\tint array[100];\n\
  \n\t// 用平方填充数组\n\tfor (int k = 0; k < n; k++)\n\t\tarray[k] = (k+1) * (k+1);\n\n\
  \t// 返回局部数组的起始地址\n\treturn array;\n}\n```\n\n如下所示的调用\n\n```cpp\n int * arr = errSquares(5);\n\
  ```\n\n将返回一个已经释放的数组的地址。尝试访问此类数组的元素，例如：\n\n```cpp\n cout << arr[0];\n```\n\n将导致对不存在的存储的引用并引发错误。\n\
  \n### 注意\n\n静态局部变量的存储在返回时不会被释放，因此返回此类变量指针的函数不会触发我们正在讨论的这类错误。然而，这样的函数可能会引起其他类型的错误，这些讨论超出了本书的范围。\n\
  \n# 停止内存泄漏\n\n对于使用动态分配内存的程序来说，确保每个对 `new` 调用最终都有对应的 `delete` 调用来释放分配的内存并将其归堆，是非常重要的。未能做到点的程序将遭受内存泄漏，内存泄漏是指程序失去了对动态分配存储的追踪，因此永远不会调用\
  \ `delete` 来释放内存。在尝试避免内存泄漏时，有两个非常有用的经验法则：\n\n- 只要可能，调用 `new` 分配存储的函数也应该是调用 `delete`\
  \ 释放存储的函数。\n- 需要动态分配存储的类应该在它的构造函数中调用 `new` 并在析构函数中调用相应的 `delete`。因为系统在对象被删除或超出作用域时会自动调用析构函数，所以放置在析构函数中的\
  \ `delete` 语句始终会被调用。\n\n通过尽可能地遵循这些规则，你将始终找到与给 `new` 调用对应的 `delete` 操作，从而验证特定的 `new`\
  \ 调用不会导致内存泄漏。程序 10-16 是遵循这些规则的程序示例。注意，`Squares` 类在构造函数中分配了动态内存，并在析构函数中有一个 `delete`\
  \ 语句。此外，`Squares` 对象的内存分配（第 57 行）及其随后的删除（第 61 行）位于同一个函数中，即 `main`。程序在策略性位置带有输出语句，以显示构造函数和析构函数中的\
  \ `new` 和 `delete` 运算符何时被调用。\n\n## 检查\n\n1. 10.9 假设 `array` 是一个 `int` 数组，以下程序段哪些将显示“True”，哪些将显示“False”？\n\
