  \ = fmod(m, n);``` ` |\n| `isalnum(ch)` | 头文件：`cctype` 描述：接受一个 `char` 参数。如果参数是字母或数字，则返回\
  \ true；否则返回 false。示例：```if (isalnum(ch)) cout << ch << \" is alphanumeric.\\n\"\
  ;``` ` |\n| `isalpha(ch)` | 头文件：`cctype` 描述：接受一个 `char` 参数。如果参数是字母表中的字母，则返回 true；否则返回\
  \ false。示例：```if (isalpha(ch)) cout << ch << \" is a letter.\\n\";``` ` |\n| `isdigit(ch)`\
  \ | 头文件：`cctype` 描述：接受一个 `char` 参数。如果参数是数字 0–9，则返回 true；否则返回 false。示例：```if (isdigit(ch))\
  \ cout << ch << \" is a digit.\\n\";``` ` |\n| `islower(ch)` | 头文件：`cctype` 描述：接受一个\
  \ `char` 参数。如果参数是小写字母，则返回 true；否则返回 false。示例：```if (islower(ch)) cout << ch << \"\
  \ is lowercase.\\n\";``` ` |\n| `isprint(ch)` | 头文件：`cctype` 描述：接受一个 `char` 参数。如果参数是打印字符（包括空格），则返回\
  \ true；否则返回 false。示例：```if (isprint(ch)) cout << ch << \" is printable.\\n\";```\
  \ ` |\n| `ispunct(ch)` | 头文件：`cctype` 描述：接受一个 `char` 参数。如果参数是数字、字母或空格以外的打印字符，则返回\
  \ true；否则返回 false。示例：```if (ispunct(ch)) cout << ch << \" is punctuation.\\n\";```\
  \ ` |\n| `isspace(ch)` | 头文件：`cctype` 描述：接受一个 `char` 参数。如果参数是空白字符，则返回 true。空白字符是任何一个：空格\
  \ ` `、换行 `\\n`、制表符 `\\t`。 | |\n\n\n\n\n\n- `vertical tab`......... `'\\v'` 否则，返回\
  \ false。\n\n**示例：**\n\n```cpp\nif (isspace(ch))\n    cout << ch << \" is whitespace.\\\
  n\";\n```\n\n### `isupper(ch)`\n**头文件：** `cctype`\n**描述：** 接受一个 `char` 参数。如果参数是大写字母，则返回\
  \ true。否则，返回 false。\n**示例：**\n\n```cpp\nif (isupper(ch))\n    cout << ch << \" is\
  \ uppercase.\\n\";\n```\n\n### `itoa(value, str, base)`\n**头文件：** `cstdlib`\n**描述：**\
  \ 将整数转换为 C 字符串。第一个参数 `value` 是该整数。结果将存储在第二个参数 `str` 所指向的位置。第三个参数 `base` 是一个整数。它指定了转换后的整数应采用的计数系统（8\
  \ = 八进制，10 = 十进制，16 = 十六进制，等）。\n**示例：**\n\n```cpp\n char str[10];\nint value = 1024;\n\
  itoa(value, str, 10);\n```\n\n### `log(m)`\n**头文件：** `cmath`\n**描述：** 接受一个 `double`\
