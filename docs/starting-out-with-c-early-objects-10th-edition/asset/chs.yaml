  \ 下列哪个语句在定义时正确初始化了 `max` 变量？\n   1. `int max = 10;`\n   2. ```cpp\n      int max;\n\
  \      max = 10;\n      ```\n   3. `int max(10);`\n   4. `int max{10};`\n\n7. 8.14\
  \ 下列代码的输出是什么？\n   ```cpp\n   const int SIZE 5;\n   int count;\n   int time[SIZE]\
  \ = {1, 2, 3, 4, 5},\n       speed[SIZE] = {18, 4, 27, 52, 100},\n       dist[SIZE];\n\
  \   for (count = 0; count < SIZE; count++)\n      dist[count] = time[count] * speed[count];\n\
  \   for (count = 0; count < SIZE; count++)\n   {\n      cout << setw(3) << time[count]\
  \ << setw(5) << speed[count]\n           << setw(5) << dist[count] << endl;\n  \
  \ }\n   ```\n\n# 8.8 `typedef` 语句\n\n## 概念 (Concept)\n\n`typedef` 语句允许为简单或结构化数据类型关联别名。\n\
  \n`typedef` 语句允许程序员为现有数据类型创建一个别名或同义词。这可以是简单数据类型（如 `int`），也可以是复杂的数据类型（如数组）。该语句最简单的形式是：\n\
  \n```cpp\ntypedef <existing data type> <alias>;\n```\n\n例如，以下语句将 `examScore` 声明为\
  \ `int` 的名称，然后定义两个 `examScore` 类型的变量。\n\n```cpp\ntypedef int examScore;\nexamScore\
  \ score1, score2;   // score1 和 score2 的类型为 examScore\n```\n\n这使得 `score1` 和 `score2`\
  \ 成为整数变量，并明确了它们将用于存储考试分数。\n\n`typedef` 语句最常用的用途之一是为特定用途的数组提供具有描述性的别名。当与数组一起使用时，保存数组大小的\
  \ `[]` 写在别名后面，而不是数据类型后面。以下语句为大小为 100 的 `double` 数组创建了名为 `score` 的别名。\n\n```cpp\n\
  typedef double score[100];\n```\n\n这意味着任何定义为 `score` 的内容都是包含 100 个 `double` 元素的数组，用于存储分数。现在，以下两个语句的作用相同：\n\
  \n```cpp\ndouble finalExam[100];\nscore finalExam;\n```\n\n有时，希望在不指定大小的情况下为特定数据类型的数组创建别名。以下语句为\
  \ `int` 数组创建了名为 `arrayType` 的别名。\n\n```cpp\ntypedef int arrayType[];\n```\n\n在下一节中，当你学习如何将数组作为参数时，就会发现\
  \ `typedef` 的便利之处。\n\n# 8.9 作为参数的数组 (Arrays as Arguments)\n\n## 概念 (Concept)\n\n\
  单个元素和整个数组都可以作为传递。你经常需要编写处理数组、显示数组或计算其平均值的函数。\n\n当传递数组的单个元素时，它的处理方式与其他变量相同。例如 程序\
  \ 8-16 显示了 `collection` 是如何逐个传递的。当传递整个数组时，会在函数头中指定。注意，在传递数值数组的同时，数组的大小也被传递给了函数。\n\
  \n如果函数需要访问原始元素，则应按引用传递。仅传递数组的起始内存地址类似于按引用传递变量，区别在于在这种情况下没有使用 `&`。\n\n当将整个数组传递给函数时，它绝不会按值传递。想象一下，每次传递给函数时都要创建一个包含\
  \ 10,000 个元素的数组需要多少 CPU 时间和内存！通过该地址和下标，可以定位单个元素。当我们把数组传递给函数时，传递的是数组的名称。这意味着我们实际上发送的是数组的地址，以便它可以访问元素。\n\
  \n如果 `showValues` 函数被写为接受整个数组作为参数，那么其设置将会有不同。在下面的函数定义中，参数 `nums` 后面跟着一对空括号。这表示参数是整个数组的地址，而不是单个值。\n\
  \n```cpp\nvoid showValues (int nums[], int size)\n{\n   for (int index = 0; index\
  \ < size; index++)\n      cout << nums[index] << \" \";\n   cout << endl;\n}\n```\n\
  \n\n\n\n仔细观察第 5 行的 `showValues` 原型和第 22 行的函数头标。在这两种情况下，第一个参数名后都紧跟一对大括号。这让程序知道该参数接受一个数组的地址。如果函数原型没有使用参数名，它看起来会像这样：\n\
  \n```\n void showValues(int [], int);\n```\n\n这仍然表示第一个 `showValues` 参数接收一个整数数组的地址，而第二个参数接收单个整数值。\n\
  \n再看程序第 13 行如何通过以下语句调用 `showValues` 函数：\n\n```\n showValues(collection, ARRAY_SIZE);\n\
  ```\n\n第一个参数是传递给函数的数组名称。在此次函数调用中，传递的是 `collection` 数组的地址。第二个参数是数组的大小。\n\n在 `showValues`\
  \ 函数中，`collection` 数组的起始地址被复制到 `nums` 参数变量中。图 8-13 插明了 `collection` 数组与 `nums` 参数变量之间的关系。当显示\
  \ `nums[0]` 时，屏幕上显示的实际上是 `collection[0]` 的内容。\n\n# 图 8-13 collection 数组与 nums 参数变量之间的关系\n\
  \n![数组显示了 8 个矩形，每个矩形显示一个整数。](img/FG_08_013.png)图 8-13 完整备用文本\n\n### 注意\n\n尽管 `nums`\
  \ 不是引用变量，但它的工作方式就像引用一样。\n\n`showValues` 函数中的 `nums` 参数变量可以接受任何整数数组的地址，并可以使用它来引用该数组。因此，我们可以通过传递数组名称及其大小作为参数，使用\
  \ `showValues` 函数来显示任何整数数组的内容。程序 8-18 使用此函数来显示两个不同数组的内容。注意，它们的大小不必相同。同样注意此程序中 `typedef`\
  \ 语句的使用。它使名称 `arrayType` 成为整数数组的别名。该名称随后被用于 `showValues` 原型和函数头中，而不是使用 `int[]`，以指示第一个参数接收\
  \ `int` 数组的起始地址。\n\n注意，当在第 14 行和第 15 行声明 `set1` 和 `set2` 时，没有使用大小声明符。我们本可以使用一个，但请记住，使用初始化列表时不需要大小声明符。\n\
  \n同样回想一下第 6 章，当引用变量被用作参数时，它会允许函数访问原始参数。对引用变量所做的任何更改实际上都是在对变量所引用的参数上进行的。数组参数的工作方式非常类似于引用变量。它们允许函数直接访问原始数组。对数组参数所做的任何更改实际上都是在作为参数的原始数组上进行的。程序\
  \ 8-19 中的函数 `doubleArray` 利用这种能力将数组中每个元素的内容翻倍。\n\n注意，在程序 8-19 的第 16 行中，`set` 数组被定义为类型\
  \ `arrayType` 而不是 `int` `set[]` 或 `int` `set[ARRAY_SIZE]`，尽管它也可以用这两种方式进行定义。与程序 8-18\
  \ 一样，没有必要指示数组的大小，因为它在创建时已经使用初始化列表进行了初始化。\n\n同样注意，在第 7 行的 `typedef` 语句中、第 11 行的 `showValues`\
  \ 原型中以及第 48 行的 `showValues` 函数中，没有 `&`。\n\n### 注意\n\n在 C++ 中，当传递数组名时，`&` 意味着函数。然而，由于数组名已经是内存地址，所以不需要使用\
  \ `&`。\n\n# 使用 const 参数\n\n有时你希望函数能够修改数组，但有时并不希望。例如，程序 8-19，我们需要 `doubleArray` 函数能够修改内容，但我们并不希望\
  \ `showValues` 函数这样做。通过使用 `const` 可以防止函数意外修改数组。这是使用 `const` 时的 `showValues` 原型样式：\n\
  \n```\n void showValues(const arrayType [], int);\n void showValues(const arrayType,\
  \ int);\n```\n\n如果函数尝试修改数组，将发生错误。\n\n# 一些实用的数组函数\n\n8.6 节介绍了诸如数组求和以及查找最大/最小值的算法。现在我们可以编写执行这些操作的通用函数。程序\
  \ 8-20 使用了 `sumArray`、`getHighest` 和 `getLowest`。由于这些函数都不应该修改数组，因此都具有 `const` 数组参数。\n\
