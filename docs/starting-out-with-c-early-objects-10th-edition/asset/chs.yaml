  \ kph。\n\n`mph` = `kph`⁰.6214\n\n### 6. 海平面上升\n\n假设地球海洋平面继续以每年约 3.1 毫米的速度上升，编写一个程序显示在未来\
  \ 25 年内海洋每年上升的累计（即总计）毫米数。\n\n### 7. 圆面积\n\n计算圆面积的公式是 area=radius²，因此如果半径增加一倍（即乘以\
  \ 2），面积将变为原来的四倍。使用 3.14 作为 PI 值。\n\n### 8. 分币薪酬\n\n编写一个程序，计算一个人一个月的工资，如果第一天的工资是一美分，第二天是两美分，第三天是四美分，以此类推，薪水每天翻倍。程序要求用户输入该月内的工作天数，验证其是否在\
