  \ `code` 按目前写的方式无法工作，以及应该如何进行纠正。\n\n## 编程挑战\n\n### 1. ASCII 码字符\n\n编写一个程序，使用循环显示\
  \ ASCII 码 32 到 127 的每个字符。每行显示 16 个字符，字符之间用空格分隔。\n\n### 2. 数字求和\n\n编写一个程序，要求用户输入一个正整数，并使用循环验证输入。程序随后使用第二个循环计算从\
  \ 1 到用户输入数字的所有整数之和。例如，如果用户输入 20，循环将找到 1 + 2 + 3 + ... + 20 的和。\n\n### 3. 行程距离\n\n\
  车辆行驶的距离可以如下计算：\n\n```\ndistance = speed * time\n```\n\n例如，如果一火车以每小时 40 英里的速度行驶 3\
  \ 小时，则行驶距离为 120 英里。\n\n编写一个程序，询问用户车辆的速度（英里/小时）以及行驶了多少小时。它应该使用循环显示在该时间段内每小时结束时的总行驶距离。以下是输出示例：\n\
  \n```\nWhat is the speed of the vehicle in mph? 40\nHow many hours has it traveled?\
  \ 3\n\nHour         Miles Traveled\n----------------------------\n 1           \
  \     40\n 2                80\n 3               120\n```\n\n### 4. 摄氏度华氏度表\n\n\
  在编程挑战之一中，你被要求编写一个将摄氏度温度转换为华氏度的程序。修改该程序，使用循环显示从 0 到 30 的摄氏度温度及其对应的华氏度表格。\n\n`F` =\
  \ 9/5`C` + 32\n\n### 5. 速度转换表\n\n编写一个程序，显示每小时公里（kph）的速度表，并将其值转换为每小时英里（mph）。表格应显示从每小时\
