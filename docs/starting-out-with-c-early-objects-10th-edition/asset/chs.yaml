  \ Person {\n   string name;\n   int age;\n}\n```\n\n在现实生活中，这些结构可能有许多成员并占用大量内存，使得在排序时移动`Person`对象的计算开销很大。你可以定义一个辅助数组\
  \ `Person *pData[10]`，将 `pData[k]` 的每一项指向 `data[k]` 的相应项。编写一个程序对指针数组进行排序，使得当你按照索引\
  \ `k` 的增加顺序遍历 `pData` 时，项 `pData[k]` 指向按名称字母升序排列的 `Person` 对象。\n\n## 4. 指针间接排序 #2\n\
  \n编写一个程序解决编程挑战 3 中的问题，但指针数组按年龄降序指向数据数组。\n\n## 5. Pie a la Mode\n\n\n\n\n在统计学中，一组数值的`mode`（众）是指出现次数最多的数值。编写一个程序，确定大多数人每年吃多少块派。设置一个整数数组，其可以存储来自\
  \ 30 个人的响应。对于每一个人，输入他们自称每年吃的派的块。然后编写一个函数来找到这 30 个数值的`mode`。这将是大多数人所吃的派的块。找到并返回 `mode`\
  \ 的函数应接受两个参数：一个整数数组和一个指示数组中元素个数的数值。\n\n# 6. 中位数函数\n\n在统计学中，一组数值的中位数（median）是当数值按从小到大的顺序排列时位于中间位置的数值。如果集合中的数值个数为偶数，则中位数取为两个中间数值的平均值。编写一个函数来确定已排序数组的中位数。该函数应该接收一个数字数组和一个指示数组大小的整数，并返回数组中数值的中位数。你可以假设数组已经排过序。尽可能多使用指针表示法。\n\
  \n# 7. 电影统计\n\n编写一个程序，用于收集关于大学生每月看电影数量的统计数据。该程序应该询问用户调查了多少学生，并动态分配一个该大小的数组。程序随后允许用户输入每个学生看过的电影数量。然后程序应该计算所输入数值的平均值、中位数和`mode`。\n\
  \n# 8. 当前月份的天数\n\n编写一个程序，能够确定指定年份和年份月份的天数。该程序允许用户输入两个代表月份和年份的整数，并它应该确定指定月份有多少天。整数\
  \ 1 到 12 将用于识别从 1 月到 12 月的月份。用户通过对月份和年份输入 `0 0` 来表示输入结束。此时，程序打印当前月份的天数并终止。\n\n使用以下标准来识别闰年：\n\
  \n1. 年份 `Y` 能被 100 整除。那么当且仅当 `Y` 能被 400 整除时，`Y` 为闰年。例如，2000 年是闰年，但 2100 年不是。\n2.\
  \ 年份 `Y` 不能被 100 整除。那么当且仅当 `Y` 能被 4 整除时，`Y` 为闰年。例如，2008 年是闰年，但 2009 年不是。\n\n以下是程序的运行示例：\n\
  \n```\n Enter month and year: 2 2008[Enter]\n29 days\nEnter month and year: 0 0[Enter]\
  \ \n\nThe current month, September 2009, has 30 days.\n```\n\n# 9. 年龄\n\n编写一个程序，询问用户的姓名和出生年份，用名字问候用户，并声明用户的年龄。假设用户出生在\
  \ 1800 年到 2099 年之间，并应以三种格式之一 `18XX`、`19XX` 或 `20XX` 输入出生年份。一个典型的输出应该是“Hello Caroline,\
  \ you are 23 years old.”\n\n# 10.\n\n修改程序 `Pr10-16`，使其使用智能指针而不是原始指针。\n\n# 第 11 章\
  \ 更多关于类和面向对象编程\n\n## 11.1 `this` 指针和常量成员函数\n\n## 概念\n\n默认情况下，编译器为类的每个成员函数提供一个隐式参数，该参数指向调用该成员函数的对象。该隐式参数称为\
  \ `this`。常量成员函数是不修改通过其调用的对象的函数。\n\n### `this` 指针\n\n考虑以下类\n\n```\n class Example\n\
  {\n   int x;\n   public:\n      Example(int a){ x = a;}\n      void setValue(int);\n\
  \      int getValue();\n};\n```\n\n带有成员函数：\n\n```\n int Example::getValue()\n{\n\
  \   return x;\n}\n```\n\n它只需返回类对象的值。例如，`getValue` 函数可以在这样的程序中调用：\n\n```\n int main()\n\
  {\n   Example ob1(10), ob2(20);\n   cout << ob1.getValue() << \" \" << ob2.getValue();\n\
  \   return 0;\n}\n```\n\n在这种情况下，程序将打印值 `10 20`。\n\n你在前面的章节中学习过，结构或类类型的不同对象被称为该类的`instances`（实例），类的每个实例都拥有类中列出的数据成员的副本。这些数据成员被称为\
  \ `instance members`（实例成员），因为它们属于类的实例，在不同的对象中可以有不同的值。因此，在前面的示例中，`ob1` 对象中的实例成员 `x`\
  \ 的值为 `10`，而 `ob2` 中的 `x` 值为 `20`。\n\n现在再次考虑成员函数的代码：\n\n```\n int Example::getValue()\n\
  {\n   return x;\n}\n```\n\n此函数应该返回 `Example` 类某个对象的 `x` 成员，但它如何知道使用哪个对象呢？发生的是，默认情况下，编译器为每个类的每个成员函数提供一个指向该类对象的隐式参数。因此，例如，`getValue`\
  \ 函数配备了一个指向该类对象的隐式参数。因此，例如，`getValue` 函数配备了一个类型为 `Example` 对象的指针。同样地，成员函数\n\n```\n\
  \ void Example::setValue(int a)\n{\n   x = a;\n}\n```\n\n尽管程序员编写了一个类型为 `int` 的单个参数，但实际上有两个参数：一个指向\
  \ `Example` 对象的指针和一个程序员指定的参数 `a`。在所有情况下，隐式参数都是调用函数的对象的地址。因此，在调用\n\n```\nob1.getValue()\n\
  ```\n\n传递给 `getValue` 的隐式参数是 `ob1` 的地址，而在调用\n\n```\nob2.setValue(78)\n```\n\n时，传递给\
  \ `setValue` 的隐式参数是 `&ob2`。\n\n编译器传递给成员函数的隐式指针可以通过关键字 `this` 在函数内部访问。因此，例如，`Example`\
  \ 类的成员函数可以通过表达式\n\n```\n*this\n```\n\n访问其调用的对象，并且还可以通过同一个指针访问该对象的任何成员。程序 11-1 说明了这些概念。它修改了\
  \ `Example` 类以包含一个成员函数，该函数使用 `this` 指针打印其调用的对象的地址以及实例成员 `x` 的值。\n\n作为 `this` 指针的一种常见用法示例，考虑成员函数\n\
  \n```\n void Example::setValue(int a)\n{\n   x = a;\n}\n```\n\n人们很自然地会将用于设置成员 `x`\
  \ 值的参数命名为一个使其与 `x` 的连接显式的标识符，也许是 `xValue` 或 `x` 本身。然而，成员函数中与类成员具有相同标识符的形式参数会隐藏类成员，使其在函数内部无法访问。可以使用\
  \ `this` 指针来限定类成员的名字使其再次可见。以下是以这种方式重写的 `setValue` 成员函数：\n\n```\n void Example::setValue(int\
  \ x)\n{\n   this−>x = x;\n}\n```\n\n从第 10 章回顾，`this−>x` 符号等同于 `(*this).x`。\n\n成员函数\n\
  \n通过引用或指针传递给函数的参数可能会被该函数修改。`const` 关键字用于参数以防止调用的函数修改它。例如，声明如下的函数：\n\n```\nvoid fun(const\
  \ string &str);\n```\n\n\n\n接收一个字符串对象的引用作为参数，但无法修改该对象。可以使用类似的机制来保护隐式参数 `*this` 不被成员函数修改。在成员函数的定义中，紧跟参数列表之后放置\
  \ `const` 关键字，可以向编译器指示该成员函数不应允许修改其所属的对象。如果成员函数定义在类外，则类内声明和定义都必须带有 `const`。这里有一个示例：\n\
  \n```cpp\n class ConstExample\n{\n   int x;\npublic:\n   ConstExample(int a){ x\
  \ = a;}\n   void setValue(int);\n   int getValue() const;\n};\n```\n\n`getValue`\
  \ 函数的定义如下：\n\n```cpp\n int ConstExample::getValue() const\n{\n   return x;\n}\n\
  ```\n\n带有常量参数 `x` 的函数不能反过来将 `x` 作为非常量参数传递给另一个函数。换句话说，承诺不修改 `x` 的函数可能将 `x` 传递给另一个函数，除非第二个函数也承诺不修改\
  \ `x`。这有时会以不明显的方式发生。以下程序使用带有常量参数的函数来打印数组的第一个元素。它无法编译，因为它在 `const` 的使用上不一致。\n\n```cpp\n\
  \ #include <iostream>\nusing namespace std;\n\nclass K\n{\npublic:\n    void output()\
  \   // 缺少 const!\n    {\n        cout << \"Output of a K object\" << endl;\n   \
  \ }\n};\n\nvoid outputFirst(const K arr[])\n{\n   arr[0].output();\n}\n\nint main(int\
  \ argc, char** argv)\n{\n    K arr[] = { K() };\n    outputFirst(arr);\n    return\
  \ 0;\n}\n```\n\n该程序无法编译，是因为编译器无法保证当 `const` 数组的元素作为隐式 `this` 参数传递给 `output` 成员函数时不会被修改：\n\
  \n```\narr[0].output();\n```\n\n你可以通过将 `output()` 变为 `const` 成员函数来让程序通过，以表示它有一个常量的\
  \ `this` 参数：\n\n```cpp\nclass K\n{\npublic:\n    void output() const\n    {\n  \
  \      cout << \"Output of a K object\" << endl;\n    }\n};\n```\n\n# 11.2 静态成员\n\
  \n## 概念\n\n如果成员变量被声明为 `static`，则该类的对象都可以访问该变量。如果成员函数被声明为 `static`，则可以在定义任何类实例之前进行调用。\n\
  \n默认情况下，每个类对象（类的实例）都拥有类成员变量的独立拷贝。对象的成员变量与同类其他对象的成员变量是分开且不同的。例如，考虑以下声明：\n\n```cpp\n\
  \ class Widget\n{\n   private:\n      double price;\n      int quantity;\n   public:\n\
  \      Widget(double p, int q)\n          { price = p; quantity = q; }\n      double\
  \ getPrice() const\n          { return price; }\n      int getQuantity() const\n\
  \          { return quantity; }\n};\n```\n\n假设在程序中通过以下声明创建了两个独立的 `Widget` 类实例：\n\
  \n```cpp\nWidget w1(14.50, 100), w2(12.75, 500);\n```\n\n该语句创建了 `w1` 和 `w2` 两个不同的对象。它们都有自己的\
  \ `price` 和 `quantity` 成员变量。这可以通过图 11-1 所示。\n\n# 图 11-1 类的非静态成员\n\n![图像显示两个对象，标记为“w1\
  \ Object”和“w2 Object”。](img/FG_11_001.png)图 11-1 完整替代文本\n\n当调用任实例的 `getQuantity`\
  \ 成员函数时，它返回存储在调用对象的 `quantity` 变量中的值。根据对象中初始存储的值，语句\n\n\n\n```cpp\ncout << w1.getQuantity()\
  \ << \" \" << w2.getQuantity();\n```\n\n将导致 `100 500`。\n\n# 静态成员变量\n\n可以创建一个被同类所有对象共享的成员变量。要创建此类成员，只需在变量声明前放置\
  \ `static` 关键字，如下所示类所示：\n\n```cpp\n class StatDemo\n{\n  private:\n     static int\
  \ x;\n     int y;\n  public:\n     void setx(int a) const { x = a; }\n     void\
  \ sety(int b) const { y = b; }\n     int getx() { return x; }\n     int gety() {\
  \ return y; }\n};\n```\n\n接下来，在类外对变量进行单独定义，例如：\n\n```cpp\nint StatDemo::x;\n```\n\
  \n在这个示例中，成员变量 `x` 将被 `StatDemo` 类的所有对象共享。当一个类对象向 `x` 一个值时，出现以下语句：\n\n```cpp\nStatDemo\
  \ obj1, obj2;\nobj1.setx(5);\nobj2.sety(10);\ncout << \"x: \" << obj1.getx() <<\
  \ \" \" << obj2.getx() << endl;\ncout << \"y: \" << obj1.gety() << \" \" << obj2.gety()\
  \ << endl;\n```\n\n成员变量 `x` 将被 `StatDemo` 类的所有对象共享。值 `5` 将出现在所有对象中。这通过图 11-2 所示。\n\
  \n# 图 11-2 类的静态成员\n\n![图表显示了 3 个矩形。](img/FG_11_002.png)图 11-2 完整替代文本\n\n静态变量的一个更实用的用法在程序\
  \ 11-2 中演示。`Budget` 类使用静态成员 `corpBudget` 来收集所有预算。当调用成员函数 `addBudget` 时，其参数会被加到 `corpBudget`\
  \ 中。当程序结束时，`corpBudget` 将包含所有值。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nclass Budget\n{\nprivate:\n    double amount;\n    static double corpBudget;\n\
  public:\n    Budget(double a) : amount(a) { corpBudget += amount; }\n    void addBudget(double\
  \ a) { corpBudget += a; }\n    static double getCorpBudget() { return corpBudget;\
  \ }\n};\n\ndouble Budget::corpBudget = 0;\n\nint main()\n{\n    Budget b1(100.50),\
  \ b2(200.75);\n    cout << \"Total budget: \" << Budget::getCorpBudget() << endl;\n\
  \    b1.addBudget(50.25);\n    cout << \"Total budget: \" << Budget::getCorpBudget()\
  \ << endl;\n    return 0;\n}\n```\n\n### 注意\n\n静态成员变量提供了 C++ 声明和定义的一个很好的示例。*声明*提供了关于变量或函数的存在和类型的信息。*定义*提供了声明中的所有信息，并且为变量或函数分配内存。静态成员变量必须在类内*声明*，在类外*定义*。\n\
  \n通常，我们将类的成员变量和函数分为两组：*实例成员*和*静态成员*。实例成员是指必须与特定实例关联的成员。特别是类的实例变量必须通过特定的类实例访问，实例成员函数必须通过特定的类实例调用。\n\
  \n相比之下，静态成员的使用或静态成员函数的调用不需要与任何实例关联。只需要指定静态成员所属的类即可。\n\n# 静态成员函数\n\n成员函数可以通过在其声明前前缀\
  \ `static` 关键字来声明为静态。其通用形式如下：\n\n```cpp\nstatic <return type><function name>(<parameter\
  \ list>)\n```\n\n静态成员函数通常用于处理类的静态成员变量。\n\n\n\n\n\n程序 11-3 是程序 11-2 的修改版本，展示了这一点。它要求用户在输入任何部门请求之前，先输入主办公室的预算请求。`Budget`类已经过修改，包含一个名为`mainOffice`的静态成员函数。该函数将其参数添加到静态变量\
  \ `corpBudget` 中，并在定义任何 `Budget` 类的实例之前被调用。`getCorpBudget()` 函数也被改为了静态函数。\n\n注意调用静态函数\
  \ `mainOffice` 的语句：\n\n```\nBudget::mainOffice(amount);\n```\n\n调用静态成员函数通常是通过使用作用域解析运算符将函数名与类名连接来实现的。如果已经定义了类的对象，也可以通过点运算符将它们的名称与对象连接来调用静态成员函数。因此，程序\
  \ 11-3 的最后一个输出语句可以写为：\n\n```\ncout << divisions[0].getCorpBudget() << endl;\n```\n\
  \n静态成员函数不能使用 `this` 指针，因为静态成员函数不是通过类的任何实例调用的。此外，静态成员函数无法访问类的实例成员，除非它指定了该成员属于哪个实例。例如，在类中：\n\
  \n```cpp\n class StatAccess\n{\n   private:\n      int x;\n   public:\n   static\
  \ void output()\n      {\n         cout << x;  // 错误访问非静态成员\n      }\n   StatAccess(int\
  \ x) { this->x = x; }\n};\n```\n\n在语句 `cout << x` 中尝试访问 `x` 是错误的，因为这等同于隐式使用 `this`\
  \ 指针，而静态函数 `output` 并不拥有该指针。相比之下，在下面同一个类的类的修改示例中，静态成员函数 `print` 正确地访问了非静态成员 `x`，因为它通过传递给它的参数的类对象名称对其进行了限定。\n\
  \n```cpp\n class StatAccess\n{\n   private:\n      int x; \n   public:\n      static\
  \ void print(StatAccess a)\n      {\n         cout << a.x;\n      }\n   StatAccess(int\
  \ x) { this->x = x; }\n};\n```\n\n静态成员函数的一个优势是它们可以在类的任何实例创建之前被调用。这允许它们被用于执行必须在类对象创建之前完成的复杂初始化任务。\n\
  \nC++ 使用 `static` 关键字来描述静态类成员和静态局部变量。为了理解这一点，查看实例成员和静态类成员之间的区别是有帮助的。类的每个对象都有其自己的实例成员副本，但所有对象共享相同的静态成员。同样，每次函数调用都有其自己的非静态局部变量副本，但所有函数调用共享相同的静态局部变量。在这个类比中，函数定义对应于类，函数调用对应于类对象，非静态局部变量对应于实例成员。\n\
  \n# 11.3 类的朋友（Friends of Classes）\n\n## 概念\n\n友元是一个不是类的成员但有权访问该类私有成员的函数。\n\n私有成员对类外部的所有程序部分都是隐藏，访问它们需要调用公共成员函数。有时你可能希望为该规则创建一个例外。`friend`\
  \ 函数是一个不是类的成员但有权访问类私有成员的函数。换句话说，友元函数被处理就像它是类的成员一样。友元函数可以是普通的独立函数，也可以是另一个类的成员。（事实上，整个类都可以被声明为另一个类的朋友。）\n\
  \n为了让一个函数或类成为另一个类的朋友，必须由授予访问权限的类进行声明。类维护着一个它们的的“列表”，只有出现在列表中的外部函数或类才被授予访问权限。通过在函数原型前面放置\
  \ `friend` 关键字来声明一个函数为朋友。通用格式如下：\n\n```cpp\nfriend <return type><function name>(<parameter\
  \ type list>);\n```\n\n在接下来的 `Budget` 类声明中，另一个类 `Aux` 的 `addBudget` 函数已被声明为友元：\n\
  \n```cpp\n class Budget\n{\nprivate:\n   static double corpBudget;\n   double divBudget;\n\
  public:\n   Budget() { divBudget = 0; }\n   void addBudget(double b)\n      { divBudget\
  \ += b; corpBudget += divBudget; }\n   double getDivBudget() const { return divBudget;\
  \ }\n   static double getCorpBudget() { return corpBudget; }\n   static void mainOffice(double\
  \ amount);\n```\n\n假设另一个类 `Aux` 代表一个部门。该部门提出预算请求，该请求必须添加到总预算中。`friend` 声明告诉编译器该函数可以访问私有成员。\n\
  \n```cpp\nclass Aux\n{\nprivate:\n   double auxBudget;\npublic:\n   Aux() { auxBudget\
  \ = 0; }\n   void addBudget(double b);\n   double getDivBudget() { return auxBudget;\
  \ }\n};\n```\n\n这里是 `Aux addBudget` 成员函数的定义：\n\n```cpp\n void Aux::addBudget(double\
  \ b)\n{\n   auxBudget += b;\n   Budget::corpBudget += auxBudget;\n}\n```\n\n参数 `b`\
  \ 被添加到总预算，通过 `Budget::corpBudget` 访问。程序 11-4 在完整程序中演示了这些类。\n\n### 注意\n\n如前所述，可以将整个类变为朋友。`Budget`\
  \ 类可以通过以下声明将 `Aux` 类变为它的朋友：\n\n```cpp\nfriend class Aux;\n```\n\n但这可能不是一个好主意。`Aux`\
  \ 的成员函数（包括以后可能添加的）都可以访问 `Budget` 的私有成员。最佳实践仅对必须访问私有成员的函数声明为朋友。\n\n## 练习\n\n1.  11.1\
  \ 实例成员变量和静态成员变量有什么区别？\n2.  11.2 静态成员变量在类声明中声明。静态成员变量在哪里定义？\n3.  11.3 静态成员变量是在其类的任何实例产生之前、同时还是之后产生的？\n\
  4.  11.4 静态成员函数有什么限制？\n5.  11.5 静态成员函数可以执行什么操作是实例成员函数不能执行的？\n6.  11.6 如果类 `X` 将函数\
  \ `f` 为朋友，函数 `f` 会成为类 `X` 的成员吗？\n7.  11.7 假设类 `Y` 是类 `X` 的朋友，这意味着类 `Y` 的成员函数可以访问类\
  \ `X` 的所有成员。friend 关键字应该出现在类 `Y` 的声明中，还是类 `X` 的声明中？\n\n\n\n\n与其他变量（数组除外）一样，对象可以使用\
  \ `=` 运算符相互赋值。例如，考虑程序 11-5，它使用了一个 `Rectangle` 类，该类与第 7 章中讨论的类似：\n\n如所示，语句\n\n```\n\
  box2 = box1\n```\n\n将 `box1` 的 `width` 和 `length` 变量直接复制到了 `box2` 的 `width` 和 `length`\
  \ 变量中。\n\n当用另一个对象的值初始化一个对象时，也会发生成员级赋值。记住赋值和初始化之间的区别：赋值发生在两个已经存在的对象之间，而初始化发生在正在创建的对象上。考虑以下程序段：\n\
  \n```\nRectangle box1(10, 50);\nRectangle box2 = box1;\n```\n\n第二条语句定义了一个 `Rectangle`\
  \ 对象 `box2` 并将其初始化为存储在 `box1` 中的值。由于发生了成员级赋值，`box2` 对象将包含与 `box1` 对象相同的值。\n\n# 11.5\
  \ 拷贝构造函数\n\n## 概念\n\n拷贝构造函数是一种特殊的构造函数，每当创建一个新对象并用同类另一个对象的数据对其进行初始化时，它就会被调用。\n\n\
  很多时候，创建一个对象并让它的初始数据与另一个之前创建的对象相同是有意义的。例如，如果 Mary 和 Joan 住在同一个房子里，并且已经创建了 Mary 的地址对象，那么将\
  \ Joan 的地址对象初始化为 Mary 地址的拷贝是合理的。特别是，假设我们有如下类来表示地址：\n\n```cpp\n class Address\n{\n\
  private:\n   string street;\npublic:\n   Address() { street = \"\"; }\n   Address(string\
  \ st) { setStreet(st); }\n   void setStreet(string st) { street = st; }\n   string\
  \ getStreet() const { return street; }  \n};\n```\n\n我们随后可以使用以下代码创建 Mary 的地址，并将\
  \ Joan 的地址初始化为 Mary 地址的拷贝：\n\n```cpp\nAddress mary(\"123 Main St\");\nAddress joan\
  \ = mary;\n```\n\n记住，每当创建对象时，构造函数都必须执行。当创建一个对象并用同类的另一个对象的数据对其初始化时，编译器会自动调用一个名为*拷贝构造函数*的特殊构造函数，使用现有对象的数据执行初始化。这个拷贝构造函数可以由程序员指定，我们稍后会展示。\n\
  \n# 默认拷贝构造函数\n\n如果程序员没有为类指定拷贝构造函数，那么编译器会自动调用*默认拷贝构造函数*。这个默认拷贝构造函数仅使用成员级赋值将现有对象的数据复制到新对象中。\n\
  \n大多数情况下，默认拷贝构造函数提供了我们需要的行为。例如，如果在用 Mary 的地址初始化 Joan 的地址后，Joan 后来搬了出去并有了自己的地方，我们可以更改\
  \ Joan 的地址而不影响 Mary 的地址。这在程序 11-6 中所示。\n\n# 默认拷贝构造函数的缺陷\n\n然而，某些时候，默认拷贝构造函数的行为并不是我们预期的。考虑一个类\n\
  \n```cpp\n class NumberArray\n{\nprivate:\n   double *aPtr;\n   int arraySize;\n\
  public:\n   NumberArray(int size, double value);\n   // ~NumberArray(){ if (arraySize\
  \ > 0) delete [] aPtr;}\n   void print() const;\n   void setValue(double value);\n\
  };\n```\n\n它封装了一个 `double` 类型数字数组（在实践中，该类可能还有其他成员）。为了给不同大小的数组提供灵活性，类包含指向数组的指针而不是直接包含数组本身。该类的构造函数代码所示，分配了一个指定大小的数组，然后将数组的所有元素设置为给定的值。该类具有用于打印数组以及将数组元素设置为给定（可能不同）值的成员函数。类的析构函数使用\
  \ `delete []` 语句来释放数组（参见第 10 章），但目前被注释掉以避免由默认拷贝构造函数引起的问题。我们将稍后指出这些问题的具体性质。\n\n程序\
  \ 11-7 创建一个该类的对象，用第一个对象的数据创建并初始化第二个对象，然后更改第二个对象中的数组。如程序的输出所示，更改第二个对象的数据会改变第一个对象的数据。在许多情况下，这是不希望的并且会导致错误。\n\
  \n更改一个对象中的数据会影响另一个对象的原因是，默认拷贝构造函数执行的成员级赋值将第一个对象中的指针值复制到第二个对象的指针中，*导致两个指针指向相同的数据*。因此，当其中一个对象通过其指针更改数据时，它也会影响另一个对象。这在图\
  \ 11-3 中所示。\n\n# 图 11-3 指向同一数组的两个指针\n\n![图显示了两个指针，first 和 second。都命名为“aPtr”并指向显示\
  \ 10.5、10.5 和 10.5 的数组](img/FG_11_003.png)\n\n两个指针指向同一内存的事会在析构函数尝试释放相同内存时引发问题。通常，带有指针成员的类在默认构造函数下无法正常工作。它们必须提供拷贝构造函数。\n\
  \n# 程序员定义的拷贝构造函数\n\n程序员可以为类定义拷贝构造函数。程序员定义的拷贝构造函数必须具有一个参数，该参数是同类的引用。因此，在之前的例子中，拷贝构造函数的原型为\n\
  \n```cpp\nNumberArray::NumberArray(const NumberArray &obj)\n```\n\n拷贝构造函数通过为新对象的指针分配单独内存来避免默认拷贝构造函数的问题：\n\
  \n```cpp\nNumberArray::NumberArray(const NumberArray &obj)\n{\n   arraySize = obj.arraySize;\n\
  \   aPtr = new double[arraySize];\n   for(int index = 0; index < arraySize; index++)\n\
  \      aPtr[index] = obj.aPtr[index];\n}\n```\n\n拷贝构造函数不应修改被复制的对象，因此将其参数声明为 `const`。程序\
  \ 11-8 展示了修改后带有拷贝构造函数的 `NumberArray` 类。类声明位于 `NumberArray2.h` 文件中，其成员函数的实现在 `NumberArray2.cpp`\
  \ 中。\n\n### 注意\n\n拷贝构造函数必须具有一个参数，是同类的引用。遗漏标识引用参数的 `&` 将导致编译错误。此外，参数应该是 `const` 引用，因为拷贝构造函数不应修改被复制的对象。\n\
  \n每当在函数调用中按*值*传递对象时，编译器也会自动调用拷贝构造函数来创建该对象的拷贝。这就是为什么拷贝构造函数的参数必须按引用传递的原因；如果在调用构造函数时按值传递的，那么构造函数将立即再次被调用以创建要按值传递的拷贝，从而导致构造函数调用的无限链。\n\
  \n\n\n\n每当通过另一个同类对象的初始化来创建一个对象时，系统会自动调用拷贝构造函数。例如，对于以下初始化语句中的每条语句，`Rectangle`类的拷贝构造函数都会被调用：\n\
  \n```\n Rectangle box(5, 10);\nRectangle b = box;    // 初始化语句\nRectangle b1(box);\
  \    // 初始化语句\n```\n\n当函数调用接收到一个类类型的值参数时，拷贝构造函数也会自动调用。例如，对于形式如下的函数\n\n``` void fun(Rectangle\
  \ rect)\n{\n}\n```\n\n如下调用\n\n```\nfun(box);\n```\n\n将导致`Rectangle`拷贝构造函数的调用。最后，当函数按值返回一个类对象时，拷贝构造函数也会自动调用。因此，在函数\n\
  \n```\n Rectangle makeRectangle()\n{\n    Rectangle rect(12, 3);\n    return rect;\n\
  }\n```\n\n中，执行返回语句时将调用拷贝构造函数。这是因为返回语句必须创建一个对象的临时的、非类的副本，该副本在函数返回后供调用者使用。总而言之，在以下情况下会调用类的拷贝构造函数：\n\
  \n*   从同类对象初始化变量时\n*   调用带有类值参数的函数时\n*   函数返回一个类对象的值时\n\n### 注意\n\n当类的参数通过引用或指针传递时，或者当函数返回类对象的引用或指针时，不会调用拷贝构造函数。\n\
  \n## 检查点\n\n1. 11.8 简要描述成员级赋值（memberwise assignment）的含义。\n2. 11.9 描述发生成员赋值的两种场景。\n\
  3. 11.10 描述一种不应使用成员赋值的情况。\n4. 11.11 什么时候会调用拷贝构造函数？\n5. 11.12 编译器如何知道一个成员函数是拷贝构造函数？\n\
  6. 11.13 类的默认拷贝构造函数执行什么操作？\n\n# 11.6 运算符重载\n\n## 概念\n\nC++允许你重新定义标准运算符与类对象一起使用的工作方式。\n\
  \n# 重载 `=` 运算符\n\n正如我们看到的，拷贝构造函数的设计是为了解决包含指针的对象通过成员级赋值用另一个同类对象的数据进行初始化时出现的问题。在对象赋值中也会出现类似的问题。例如，对于上一节中的`NumberArray`类，我们可能有一个程序定义了该类的两个对象：\n\
  \n```\nNumberArray first(3, 10.5);\nNumberArray second(5, 20.5);\n```\n\n现在，由于 C++允许将赋值运算符用于类对象，我们可能会执行语句\n\
  \n```\nfirst = second;\n```\n\n如果我们想将第一个对象设置为与第二个对象完全相同的值。此时，C++将再次执行从第二个对象到第一个对象的成员级拷贝，导致两个对象中的指针都指向同一块内存。\n\
  \n由于默认对象赋值遇到与默认拷贝构造函数相同的问题，我们可能认为可以使用程序员定义的拷贝构造函数来解决由默认赋值引起的问题，但事实并非如此。拷贝构造函数只有在对象在创建时进行*初始化*时才会起作用。特别是，拷贝构造函数不会在*赋值*中被调用。为了理解初始化和赋值的区别，假设对象`first`已经创建。那么语句\n\
  \n```\nNumberArray second = first;    // 调用了拷贝构造函数\n```\n\n创建`second`并用`first`的值对其进行初始化，这是一个*初始化*过程，会导致调用拷贝构造函数来执行初始化。然而，语句\n\
  \n```\nsecond = first;                // 未调用拷贝构造函数\n```\n\n假设两个对象之前都已创建，这是一个*赋值*，因此没有调用任何构造函数。\n\
  \n为了解决对象成员级赋值产生的问题，我们需要修改赋值运算符的行为，使其在应用于具有指针成员的类对象时，执行执行除成员级赋值以外的操作。实际上，我们为该类的对象提供了一个不同版本的赋值运算符供使用。通过这种方式，我们说是在*重载*了赋值运算符。\n\
  \n重载给定类赋值运算符的一种方法是作为类的成员函数定义一个名为`operator=`的*运算符函数*。要为`NumberArray`类实现这一点，我们将编写如下类声明：\n\
  \n```\n class NumberArray\n{\nprivate:\n   double *aPtr;\n   int arraySize;\npublic:\n\
  \   void operator=(const NumberArray &right);  // 重载运算符\n   NumberArray(const NumberArray\
  \ &);\n   NumberArray(int size, double value);\n   ~NumberArray() { if (arraySize\
  \ > 0) delete [ ] aPtr; }\n   void print() const;\n   void setValue(double value);\n\
  };\n```\n\n在查看运算符函数本身的实现之前，让我们先看看函数头文件（或原型）。我们将头文件拆分为几个主要部分，如图 11-4 所示。\n\n# 图 11-4\
  \ 重载赋值运算符的原型\n\n![一张图像显示了头文件，“NumberArray &=(const NumberArray &).”](img/FG_11004.png)图\
  \ 11-4 文本\n\n函数的名称为`operator=`。由于运算符函数是类的实例成员，它只能通过类对象调用。调用它的类对象被视为赋值运算符的左操作数，而传递给参数被视为赋值运算符的右操作数。为了说明这一点，假设程序中定义了两个对象`left`和`right`：\n\
  \n```NumberArray left(3,10.5);\nNumberArray right(5,20.5);\n```\n\n为了将`right`的值赋值给`left`，我们通过`left`对象调用成员函数`operator=`，并将`right`对象作为参数传递：\n\
  \n```\nleft.operator=(right);\n```\n\n虽然你可以这样调用运算符函数，编译器也允许你使用更传统的符号\n\n```\nleft\
  \ = right;\n```\n\n### 注意\n\n运算符函数的参数不需要通过引用传递，也不需要声明为`const`。在本示例中，我们使用了引用参数：引用参数避免了拷贝传递对象的开销。`const`用于保护参数不被修改。\n\
  \n# 类赋值运算符的返回值\n\n图 11-4 显示重载的赋值运算符返回`NumberArray`的引用。这样做是为了与 C++内置赋值运算符保持一致，后者允许级联赋值语句，如\n\
  \n```\na = b = c;\n```\n\n级联赋值之所以有效，是因为内置赋值运算符的实现方式是在执行赋值后返回其左操作数的引用。因此，在这一语句中，表达式`b\
  \ = c`导致`c`赋值给`b`，然后返回`b`的引用。随后，将此返回引用的值赋值给`a`。\n\n# 类赋值运算符的实现\n\n现在让我们考虑赋值运算符的实现。首先注意到，如果语句如下\n\
  \n```\nx = x; \n```\n\n则不需要进行任何拷贝。\n\n\n这会导致对象被赋值给自身。（在大型程序中，这种赋值可能会以接的方式发生。）我们可以通过检查赋值号左侧对象的地址\
  \ `this` 是否与右侧对象的地址不同来测试这种可能性：\n\n```\nif(this != &right)  { /* 拷贝对象 …*/ }\n```\n\
  \n赋值运算符函数首先删除为被赋值对象中的指针所分配的内存。之后，它会以与类的拷贝构造函数非常相似的方式对另一个对象进行拷贝。该函数的最后一个动作是返回（通过引用）赋值号左侧的对象\
  \ `*this`。以下是该函数的代码：\n\n```\n NumberArray& NumberArray::operator=(const NumberArray\
  \ &right)\n{\n    if (this != &right)\n    {\n      if (arraySize > 0) \n      {\
  \ \n          delete [] aPtr; \n      }\n      arraySize = right.arraySize;\n  \
  \    aPtr = new double[arraySize];\n      for (int index = 0; index < arraySize;\
  \ index++)\n      {\n        aPtr[index] = right.aPtr[index];\n      }\n    }\n\
  \    return *this;\n}\n```\n\n在本节讨论的赋值运算符也称为 `copy assignment`（拷贝赋值），以区别于稍后我们将学习的\
  \ `move assignment`（移动赋值）运算符。通常，在构造函数中分配动态内存（或任何资源）的类应该定义析构函数、拷贝构造函数、移动构造函数、拷贝赋值运算符和移动赋值运算符。你将在本章稍后的部分学习移动赋值和移动构造函数。\n\
  \n`NumberArray` 类通过修改以包含拷贝构造函数和重载的赋值运算符，在程序 11-9 中进行了演示。\n\n# 重载其他运算符\n\nC++ 允许程序员在除赋值运算符之外的重载其他运算符。在很多情况下，重载某些\
  \ C++ 内置运算符是自然的，以便它们与程序员定义的类协同工作。例如，假设存在一个名为 `Date` 的类，且 `Date` 类对象在成员变量中存储了日、月、年。假设\
  \ `Date` 类有一个名为 `add` 的成员函数。`add` 成员函数向日期增加天数，如果日期跨到另一个月份或年份，则调整成员变量。例如，以下语句向 `today`\
  \ 对象中存储的日期增加了五天：\n\n```\ntoday.add(5);\n```\n\n虽然该语句是向 `today` 中存储的日期增加五天这看起来是显而易见的，但使用运算符可能更符合直觉。例如，看以下语句：\n\
  \n```\ntoday += 5;\n```\n\n该语句使用标准的 `+=` 运算符为 `today` 加上 5。然而，这种行为并不会自动发生。要执行此操作，必须重载\
  \ `+=` 运算符。在本节中，你将学习重载 C++ 的许多运算符，以便对类对象执行特殊操作。\n\n## 注意事项\n\n你已经经历过重载运算符的行为。`/`\
  \ 运算符执行两种类型的除法：浮点除法和整数除法。如果运算符的操作数之一是浮点类型，则结果将是一个浮点值。然而，如果 `/` 运算符两个操作数都是整数，则会发生不同的行为：结果是一个整数，且小数部分被丢弃。\n\
  \n# 运算符重载的一些通用问题\n\n现在你已经对运算符重载有了初步了解，让我们来看这种编程技术涉及的一些通用问题。\n\n首先，如果你想这样做，你可以更改一个运算符的整个含义。没有什么可以阻止你将\
  \ `=` 符号从赋值运算符更改为“显示”运算符。例如，以下类恰恰就是了这一点：\n\n```\n class Weird\n{\nprivate:\n   int\
  \ value;\npublic:\n   Weird(int v)\n      {value = v; }\n   void operator=(const\
  \ Weird &right)\n      { cout << right.value << endl; }\n};\n```\n\n虽然 `operator=`\
  \ 函数重载了赋值运算符，但该函数并没有执行赋值。重载运算符所做的只是显示 `right.value` 成员的内容。考虑以下程序段：\n\n```\nWeird\
  \ a(5), b(10);\na = b;\n```\n\n尽管语句 `a = b` 看起来像是一个赋值语句，但它实际上会导致 `b` 的 `value` 成员的内容显示在屏幕上：\n\
  \n```\n10\n```\n\n另一个运算符重载问题是，你不能更改运算符所接受的操作数个数。`=` 符号必须始终二进制运算符。同样，`++` 和 `--`\
  \ 必须始终是一元运算符。\n\n最后一个问题是，虽然你可以重载大多数 C++ 运算符，但你不能重载所有的运算符。表 11-1 显示了所有可以重载的 C++ 运算符。唯一不能重载的运算符是\n\
  \n```?:  .*sizeof```\n\n# 运算符重载的方法\n\n重载运算符有两种方法：\n\n1. 将重载运算符作为类的成员函数。这允许运算符函数访问私有成员。它还允许函数使用隐式的\
  \ `this` 指针访问调用对象。\n2. 将重载的成员函数作为独立的全局函数。以这种方式重载时，运算符函数必须声明为类的友元（friend），以便访问私有成员。\n\
  \n某些运算符，如流输入输出运算符 `>>` 和 `<<`，必须作为独立函数重载。其他运算符可以作为成员函数，也可以作为独立函数重载。考虑一个类\n\n```\n\
  \ class Length\n{\nprivate:\n    int len_inches;\npublic:\n    Length(int feet,\
  \ int inches)\n    {\n        setLength(feet, inches);\n    }\n    Length(int inches)\
  \ { len_inches = inches; }\n    int getFeet() const { return len_inches / 12; }\n\
  \    int getInches() const { return len_inches % 12; }\n    void setLength(int feet,\
  \ int inches)\n    {\n        len_inches = 12 *feet + inches;\n    }\n};\n```\n\n\
  其设计用于表示长度测量。该类内部用英寸表示长度，但允许客户端通过 `setLength` 函数指定英尺和英寸。该类提供了成员函数 `getFeet()` 和 `getInches()`，以便单独检索测量值的英尺和英寸部分。\n\
  \n# 重载算术和关系运算符\n\n类的客户端必须能够加和减测量值。此外，它们应该能够比较两个测量值，以查看它们是否相等，或者一个是否小于另一个。我们将通过作为独立函数重载运算符\
  \ +、`−`、< 和 == 来提供这些功能。我们首先在 `Length` 类中添加以下声明：\n\n```\nfriend Length operator+(Length\
  \ a, Length b);\nfriend Length operator−(Length a, Length b);\nfriend bool operator<(Length\
  \ a, Length b);\nfriend bool operator==(Length a, Length b);\n```\n\n\n\n为了了解我们是如何得出这些声明的，请考虑`addition`（加法）和`less-than`（小于）运算符。加法需要两个\
  \ `Length` 对象 `a` 和 `b` 作为参数，并产生 `a` 和 `b` 之和的 `Length` 对象。同样，小于运算符需要两个 `Length`\
  \ 对象作为参数并返回一个 `Boolean` 值。\n\n要编写实现这些函数的代码，再次考虑加法运算符。给定两个输入参数 `a` 和 `b`，它需要返回一个\
  \ `Length` 对象，其 `len_inches` 成员是 `a` 和 `b` 的 `len_inches` 成员之和。可以通过以下方式实现：\n\n```cpp\n\
  \ Length operator+(Length a, Length b)\n{\n    Length result(a.len_inches + b.len_inches);\n\
  \    return result;\n}\n```\n\n或者更简洁地：\n\n```cpp\n Length operator+(Length a, Length\
  \ b)\n{\n    return Length(a.len_inches + b.len_inches);\n}\n```\n\n我们可以以类似的方式来推出运算符函数\
  \ `−`、`<` 和 `==` 的定义。这里有一个完整的程序，展示了类及其重载运算符，并说明了它们的用法。\n\n## `Length.h` 的内容\n\n\
  ```cpp\n 1 #ifndef _LENGTH_H\n 2 #define _LENGTH_H\n 3 #include <iostream>\n 4 using\
  \ namespace std;\n 5\n 6 class Length\n 7\n 8 private:\n 9     int len_inches;\n\
  10 public:\n11     Length(int feet, int inches)\n12     {\n13         setLength(feet,\
  \ inches);\n14     }\n15     Length(int inches){ len_inches = inches; }\n16    \
  \ int getFeet() const { return len_inches / 12; }\n17     int getInches() const\
  \ { return len_inches % 12; }\n18     void setLength(int feet, int inches)\n19 \
  \    {\n20         len_inches = 12 *feet + inches;\n21     }\n22     friend Length\
  \ operator+(Length a, Length b);\n23     friend Length operator−(Length a, Length\
  \ b);\n24     friend bool operator< (Length a, Length b);\n25     friend bool operator==\
  \ (Length a, Length b);   \n26 };\n27 #endif\n```\n\n## `Length.cpp` 的内容\n\n```cpp\n\
  \ 1 #include \"Length.h\"\n 2\n 3 //*************************************\n 4 //\
  \ Overloaded operator +              *\n 5 //*************************************\n\
  \ 6 Length operator+(Length a, Length b)\n 7 {\n 8     return Length(a.len_inches\
  \ + b.len_inches);\n 9 }\n10\n11 //*************************************\n12 //\
  \ Overloaded  operator −             *\n13 //*************************************\n\
  14 Length operator−(Length a, Length b)\n15 {\n16     return Length(a.len_inches\
  \ − b.len_inches);\n17 }\n18\n19 //************************************\n20 // Overloaded\
  \ operator ==            *\n21 //************************************\n22 bool operator==(Length\
  \ a, Length b)\n23 {\n24     return a.len_inches == b.len_inches;\n25 }\n26\n27\
  \ //************************************\n28 // Overloaded operator <          \
  \   *\n29 //************************************\n30 bool operator<(Length a, Length\
  \ b)\n31 {\n32     return a.len_inches < b.len_inches;\n33 }\n```\n\n## 在独立运算符和成员函数运算符之间选择\n\
  \n考虑到我们已经编写的独立重载，代码：\n\n```\nLength a(4, 2), b(1, 8), c(0);\nc = a + b;\n```\n\n\
  被编译器解释为：\n\n```\nLength a(4, 2), b(1, 8), c(0);\nc = operator+(a, b);\n```\n\n编译器允许程序员使用友好的中缀表示法。但在内部，它将运算符视为仅仅是一个名为\
  \ `operator+` 的普通函数。这产生了一个并非显而易见的影响。语句：\n\n```\nc = 2 + a;\n```\n\n等同于：\n\n```\n\
  c = operator+(2, b);\n```\n\n这两个语句都能正确编译并执行，因为 `Length` 类的*转换构造函数*（convert constructor）能够根据整数参数\
  \ 2 创建一个 `Length` 对象。你将在第 11-9 节中学习转换构造函数。\n\n我们同样可以可以将算术和关系运算符重载为成员函数。以下是实现加法运算符的方法。首先，修改类内声明，使运算符成为成员函数：\n\
  \n```cpp\n class Length\n{\nprivate:\n    int len_inches;\npublic:\n    // 修改后的\
  \ operator+ 声明\n    Length operator+(Length b);\n    // 类的其余部分省略\n};\n```\n\n注意，运算符现在声明为接收一个\
  \ `Length` 类型参数。这是因为作为成员函数，第一个参数是隐式的 `this`。\n\n\n\n对于编译器而言相当于\n\n```cpp\nLength\
  \ b(4, 8), c(2, 5);\noperator<<(cout, b);\noperator(cout, b + c);\n```\n\n这种等效性具有以下含义：\n\
  \n1. 重载的运算符 `<<` 接受两个参数，第一个是一个 `ostream` 对象，第二个是正在重载运算符的类的对象。对于 `Length` 类，其原型应为\
  \ `operator<<(ostream &strm, Length a)`。\n\n2. 为了允许在第二个参数中使用表达式（例如 `b + c`），第二个参数应该按值传递。第一个参数应该按引用传递，因为\
  \ `ostream` 参数永远不应该按值传递。\n\n此外，流插入运算符应该返回其流参数，以便多个输出表达式可以链式在一起，例如：\n\n```cpp\nLength\
  \ b(4, 8), c(2, 5);\ncout << b << \"  \" << b + c;\n```\n\n将这一切结合在一起，我们看到流插入运算符应该写成：\n\
  \n```cpp\n ostream &operator<<(ostream& out, Length a)\n{\n   out << a.getFeet()\
  \ << \" feet, \" << a.getInches() << \" inches\";\n   return out;\n}\n```\n\n重载流输出运算符是有用的，因为它允许在输出时为复杂类的各个字段标记标签。\n\
  \n重载流输入运算符也类似，但表示要读入对象的类参数按引用传递。因此，流输入运算符的头文件如下：\n\n```cpp\nistream &operator>>(istream\
  \ &in, Length &a);\n```\n\n该函数的完整实现可以在以下 `Length1.cpp` 列表的第 3–18 行找到。从初看，该函数是有用的，因为它减轻了程序员在用户通过屏幕和键盘输入数据时为对象的不同部分发布提示的麻烦。但请注意，如果该运算符用于从非键盘源（如文件或网络连接）读取\
