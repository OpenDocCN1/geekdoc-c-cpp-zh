  \n# 第 20 章 二叉树\n\n## 20.1 二叉树的定义与应用\n\n## 概念\n\n二叉树与链表的区别在于，链表中的节点最多有一个后继节点，而二叉树中的节点可以多有两个后继节点。\n\
  \n*二叉树*是节点集合，其中每个节点都与最多两个后继节点关联，分别称为*左*孩子和*右*孩子。二叉树中的并非每个节点都有两个孩子：一个或两个节点可能被省略。二叉树中没有子节点的称为*叶子节点*。\n\
  \n二叉树中拥有子节点的称为*父节点*。空节点集合被视为空树。链表与二叉树之间存在相似之处。二叉树的 `root` 对应链表的头，二叉树的子节点对应后继，而二叉树的父节点对应先驱。\n\
  \n### 二叉树的实现\n\n二叉树用于在其节点中存储值。因此，二叉树中的节点将是一个包含值的结构或类：\n\n```\nstruct TreeNode\n\
  {\n   int value;\n   TreeNode *left;\n   TreeNode *right;\n};\n```\n\n二叉树本身由指向根节点的指针表示。未显示值的二叉树示例见图\
  \ 20-1。如果该节点没有孩子，其 `left` 或 `right` 指针将设置为 `nullptr`。\n\n# 图 20-1 二叉树\n\n![树状图展示了一棵二叉树。](img/001.png)\n\
  \n二叉树之所以被称为树，是因为它们看起来像一棵倒置的树。任何非空树都可以划分为其根节点、*左子树*和*右子树*。直观上，子树是从某个特定节点开始的整个分支。图\
  \ 20-2 展示了[图 20-1]中二叉树的左子树。\n\n# 图 20-2 二叉树的左子树\n\n![图展示了之前的二叉树。树左侧的部分被虚线圈起来并标记为“左子树”。](img/002.png)\n\
  \n### 二叉树的应用\n\n当结构包含大量信息时，搜索任何线性数据结构（如数组或标准链表）都是缓慢的。这是因为线性数据结构的顺序性。二叉树及其泛化形式是搜索大量信息的极佳数据结构。它们通常用于数据库应用程序以组织索引记录的关键值。当用于辅助搜索时，二叉树被称为*二叉搜索树*。二叉搜索树是本章的重点。\n\
  \n信息在二叉搜索树中的存储方式使得在树中搜索信息变得简单。例如，查看图 20-3。\n\n# 图 20-3 带有存储值的二叉树\n\n\n\n\n\n![插图显示了早期的二叉树。](img/FG_20_003.png)图\
  \ 20-3 完整替代文本\n\n该图描绘了一个二叉搜索树，其中每个节点存储一个字母表中的字母。注意根节点持有字母 `M`。根节点的左孩子持有字母 `F`，右孩子持有字母\
  \ `R`。值存储在二叉搜索树中，使得节点的左孩子包含的数据值小于该节点的数据，而节点的右孩子包含的数据值大于该节点的数据。对于树中所有拥有子节点的节点都是如此。\n\
  \n事实上，在二叉搜索树中，一个节点左侧的`所有`节点包含的值都小于该节点的值。同样，一个节点右侧的所有节点包含的值都大于该节点。当应用程序搜索二叉搜索树时，它从根节点开始。如果根节点不包含搜索值，应用程序将分支到左孩子或右子节点，取决于搜索值小于还是大于根节点的值。这个过程一直持续，直到找到该值或确定搜索值不在树中。图\
  \ 20-4 展示了在所示二叉树中查找字母 `P` 的搜索模式。\n\n## 图 20-4 查找值“P”的搜索模式\n\n![插图显示了非阴影部分带有字母的二叉树。](img/FG_20_004.png)图\
  \ 20-4 完整替代文本\n\n这种搜索二叉树的方法让人想起用于排序数组的二分查找技术。假设二叉树是平衡的（意味着在每个节点处，左右两个子树的节点数量大致相同），搜索每一步都会将待搜索树的大小缩小一半。这使得在相对较少的步骤内搜索包含大量信息的树成为可能。\n\
  \n## 检查点 (Checkpoint)\n\n1. 20.1 描述二叉树和链表之间的区别。\n2. 20.2 什么是根节点？\n3. 20.3 什么是子节点？\n\
  4. 20.4 什么是叶子节点？\n5. 20.5 什么是子树？\n6. 20.6 为什么二叉树适用于必须搜索大量信息的算法？\n\n## 20.2 二叉搜索树的操作\n\
  \n## 概念\n\n二叉搜索树上可以执行许多操作，包括创建二叉搜索树、插入、查找和删除节点。\n\n在本节中，你将学习可以在二叉搜索树上执行的一些基本操作。我们将学习一个用于存储整数值的二叉树的简单类。\n\
  \n## 创建二叉搜索树\n\n我们将使用 `IntBinaryTree` 类演示基础的二叉树操作。我们二叉树节点的基础是以下 `structure` 声明：\n\
  \n```\nstruct TreeNode\n{     \n   int value;\n   TreeNode *left;\n   TreeNode *right;\n\
  \   TreeNode(int value1, \n            TreeNode *left1 = nullptr, \n           \
  \ TreeNode *right1 = nullptr)\n   {\n      value = value1;\n      left = left1;\n\
  \      right = right1;\n   }\n};\n```\n\n注意，树的每个节点都有一个 `value` 成员，以及两个用于跟踪节点左、右孩子的指针。该类将仅供以下\
  \ `IntBinaryTree` 类的方法使用。\n\n### `IntBinaryTree.h` 的内容\n\n```\n1 class IntBinaryTree\n\
  2 {\n3 private:\n4    // TreeNode 结构体用于构建树。\n5    struct TreeNode\n6    {     \n\
  7       int value;\n8       TreeNode *left;\n9       TreeNode *right;\n10      \
  \ TreeNode(int value1, \n11                TreeNode *left1 = nullptr,\n12      \
  \          TreeNode *right1 = nullptr)\n13       {\n14          value = value1;\n\
  15          left = left1;\n16          right = right1;\n17       }\n18    };\n19\
  \ \n20    TreeNode *root;     // 指向树根节点的指针\n21 \n22    // 各种辅助成员函数。\n23    void\
  \ insert(TreeNode *&, int);\n24    void destroySubtree(TreeNode *);\n25    void\
  \ remove(TreeNode *&, int);\n26    void makeDeletion(TreeNode *&);\n27    void displayInOrder(TreeNode\
  \ *) const;\n28    void displayPreOrder(TreeNode *) const;\n29    void displayPostOrder(TreeNode\
  \ *) const;\n30 \n31 public:\n32    // 这些成员函数是公共接口。\n33    IntBinaryTree()     \
  \         // 构造函数\n34    {\n35       root = nullptr;\n36    }\n37    ~IntBinaryTree()\
  \             // 析构函数\n38    {\n39       destroySubtree(root);\n40    }\n41    void\
  \ insert(int num)\n42    {\n43       insert(root, num);\n44    }\n45    bool search(int\
  \ num) const;\n46    void remove(int num)\n47    {\n48       remove(root, num);\n\
  49    }\n50    void showInOrder() const\n51    {\n52       displayInOrder(root);\n\
  53    }\n54    void showPreOrder() const\n55    {\n56       displayPreOrder(root);\n\
  57    }\n58    void showPostOrder() const\n59    {\n60       displayPostOrder(root);\n\
  61    }\n62 };\n```\n\n### 二叉搜索树操作实现\n\n许多二叉树操作有非常自然的递归实现。这是因为二叉树是一种本质上是递归的数据结构：每个非空二叉树由一个根节点以及左右子树组成，而这些子树本身也是二叉树。许多二叉树操作可以通过对根节点执行某些处理，然后对左右子树递归地执行该操作来实现。例如，如果根节点由一个指针表示\n\
  \n```\nTreeNode *tree;\n```\n或\n\n```\nTreeNode *root;\n```\n并认为它们都代表这棵树。\n\n\n\n\
  \n那么根节点的值将是 `tree−>value`，左、右子树分别由 `tree−>left` 和 `tree−>right` 提供。递归操作可能会首先处理 `tree−>value`，然后递归地处理\
  \ `tree−>left` 和 `tree−>right`。\n\n# 插入元素\n\n向二叉搜索树插入数字的工作由私有成员函数完成：\n\n```cpp\n\
  insert(TreeNode *&tree, int num)\n```\n\n该函数接收一个指向二叉搜索树根节点的指针 `tree` 和一个要插入树的数字\
  \ `num`。它使用递归策略：如果二叉树为空（这是递归的基准情况），它创建一个新的 `TreeNode` 对象，其 `value` 成员为给定的数字，并将其设置为树的根：\n\
  \n```cpp\nif (!tree)\n{\n   tree = new TreeNode(num);\n   return;\n}\n```\n\n然而，如果二叉搜索树不为空，`insert`\
  \ 函数会将 `num` 与根节点的值 `tree−>value` 进行比较。根据比较的结果，将新值递归地插入到左子树或右子树中：\n\n```cpp\nif\
  \ (num < tree−>value)\n   insert(tree−>left, num);\nelse\n   insert(tree−>right,\
  \ num);\n```\n\n这里是完整的函数：\n\n```cpp\nvoid IntBinaryTree::insert(TreeNode * &tree,\
  \ int num)\n{\n   // 如果树为空，创建一个新节点并将其\n   // 树的根\n   if (!tree)\n      {\n     \
  \   tree = new TreeNode(num);\n        return;\n      }\n\n   // 如果 num 已经在树中：返回\n\
  \   if (tree−>value == num)\n     return;\n\n   // 树不为空：将新节点插入\n   // 左或右子树\n  \
  \ if (num < tree−>value)\n      insert(tree−>left, num);\n   else\n      insert(tree−>right,\
  \ num);\n}\n```\n\n注意，该函数传递的是指针的引用，因为传递的指针可能需要被函数修改。这也是为什么 `remove` 和 `makeDeletion`\
  \ 函数通过引用传递参数的原因。\n\n## 注意事项\n\n树的形状由图 20-5 所示的形状取决于值插入的顺序。根节点持有值 5，因为它是第一个插入的值。通过执行函数，你可以看到其他节点是如何出现在它们所示的位置的。\n\
  \n# 遍历树\n\n遍历非空二叉树并处理每个节点值的常用方法有：`inorder`（中序）、`preorder`（前序）和 `postorder`（后序）。这些方法每种最好实现为递归函数。算法描述如下。\n\
  \n*   **中序遍历**\n    1. 遍历节点的左子树。\n    2. 处理节点的数据。\n    3. 遍历节点的右子树。\n*   **前序遍历**\n\
  \    1. 处理节点的数据。\n    2. 遍历节点的左子树。\n    3. 遍历节点的右子树。\n*   **后序遍历**\n    1. 遍历节点的左子树。\n\
  \    2. 遍历节点的右子树。\n    3. 处理节点的数据。\n\n`IntBinaryTree` 类可以使用这三种算法中的显示树中的所有值。这些算法通过以下内联公有成员函数启动：\n\
  \n```cpp\nvoid showInOrder(void)\n   { displayInOrder(root); }\nvoid showPreOrder()\n\
  \   { displayPreOrder(root); }\nvoid showPostOrder()\n   { displayPostOrder(root);\
  \ }\n```\n\n每个公有成员函数都调用一个递归私有成员函数，并将根指针作为参数传递。这些递归函数非常简单直接：\n\n```cpp\nvoid IntBinaryTree::displayInOrder(TreeNode\
  \ *tree) const\n{\n   if (tree)\n   {\n      displayInOrder(tree−>left);\n     \
  \ cout << tree−>value << \"  \";\n      displayInOrder(tree−>right);\n   }\n}\n\n\
  void IntBinaryTree::displayPreOrder(TreeNode *tree) const\n{\n   if (tree)\n   {\n\
  \      cout << tree−>value << \"  \";\n      displayPreOrder(tree−>left);    \n\
  \      displayPreOrder(tree−>right);\n   }\n}\n\nvoid IntBinaryTree::displayPostOrder(TreeNode\
  \ *tree) const\n{\n   if (tree)\n   {\n      displayPostOrder(tree−>left);   \n\
  \      displayPostOrder(tree−>right);\n      cout << tree−>value << \"  \";\n  \
  \ }\n}\n```\n\n程序 20-2 演示了每种遍历方法。\n\n# 搜索树\n\n`IntBinaryTree` 类有一个公有成员函数 `search`，如果在树中找到值则返回\
  \ `true`，否则返回 `false`。该函数从根开始。函数将 `num`（要搜索的值）与根的值进行比较。如果值不匹配，则在左或右子树中继续搜索，直到树为空。\n\
  \n```cpp\nbool IntBinaryTree::search(int num) const\n{\n   TreeNode *tree = root;\n\
  \n   while (tree)\n   {\n      if (tree−>value == num)\n         return true;\n\
  \      else if (num < tree−>value)\n         tree = tree−>left;\n      else\n  \
  \       tree = tree−>right;\n   }\n   return false;\n}\n```\n\n# 元素\n\n要删除元素，我们首先找到元素节点，然后删除该节点。删除节点的程序取决于孩子的数量。如果\
  \ X 没有孩子，我们首先找到父节点，将父节点指向 X 的孩子设置为 `nullptr`，然后释放给 X 的内存。如果 X 是树的根，我们描述的方法将不起。在这种情况下，我们只需删除\
  \ X 并根设置为 `nullptr`。\n\n删除非叶子节点的程序必须确保该节点连接的子树仍然是树的一部分。删除方法取决于被删除节点拥有一个还是两个子树。图\
  \ 20-6 显示了一个我们正准备删除带有一个子树节点的树。\n\n# 图 20-6 删除只有一个节点的节点\n\n![树形图显示一个根节点和位于左右不同层级的两个节点。](img/FG_20_06)\n\
  \n然而，当我们准备删除的节点拥有两个子树时，问题就不那么容易解决了。例如，查看图 20-8。\n\n# 图 20-8 准备删除拥有两个孩子的节点\n\n![树形图显示一个根节点和两个孩子节点。左侧的孩子节点显示有两个孩子节点。左侧树根节点孩子节点的注释写着“此节点将被删除。”](img/FG_20_008)\n\
  \n\n\n显然，我们无法将节点的两个子树都连接到它的父节点，因此必须有一个替代方案。解决此问题的一种方法是将节点的右子树连接到父节点，然后在右子树中找到一个位置来连接左子树。结果如图图\
  \ 20-9 所示。注意在将左子树连接到右子树时，我们必须注意维护二叉树的搜索属性。\n\n## 图 20-9 删除具有两个节点的简单策略\n\n![插图显示了一个二叉树。](img/FG_20_009.png)图\
  \ 20-9 完整备用文本\n\n从 `IntBinaryTree` 对象中删除值是通过调用公共成员函数 `remove` 完成的，该函数反过来调用同名的私有成员函数。该函数接收一个二叉搜索树\
  \ `tree`（根节点）和一个要从树中删除的值 `num`：\n\n```\nremove(TreeNode *&tree, int num)\n```\n\n\
  该函数使用递归策略。如果树为空，它会立即返回。否则，如果 `num` 小于根节点存储的值，该函数将递归地从左子树删除 `num`；但如果 `num` 较大，该函数将递归地从右子树删除\
  \ `num`。在根节点中找到 `num` 的情况将交给一个函数：\n\n```\nmakeDeletion(TreeNode *&tree)\n```\n\n\
  以下是 `remove:` 的代码：\n\n```\nvoid IntBinaryTree::remove(TreeNode *&tree, int num)\n\
  {\n   if (tree == nullptr) return;\n   if (num < tree−>value)\n      remove(tree−>left,\
  \ num);\n   else if (num > tree−>value)\n      remove(tree−>right,num);\n   else\n\
  \      // 我们找到了要删除的节点。\n      makeDeletion(tree);\n}\n```\n\n`makeDeletion` 函数的设计是删除作为参数传递的二叉搜索树的根节点，留下一个由剩余节点组成的二叉搜索树。让我们来看\
  \ `makeDeletion` 背后的逻辑。有几种情况需要考虑：\n\n1. 传递给 `makeDeletion` 的树根没有孩子。在这种情况下，我们删除根节点并将树替换为\
  \ `nullptr`。\n\n2. 树根只有一个孩子。在这种情况下，我们删除根节点并将树替换为被删除根节点的节点：\n\n   ```\n   TreeNode\
  \ *nodeToDelete = tree;\n   if (tree−>right == nullptr)\n      tree = tree−>left;\n\
  \   else if (tree−>left == nullptr)\n      tree = tree−>right;\n   ```\n\n   注意，这段代码同样适用于第一种情况。\n\
  \n3. 传递给 `delete` 的树有两个孩子。删除根节点将留下两个子树，我们需要对这两个子树进行处理。我们采用的策略是将两个子树合并为一个二叉搜索树，然后用由合并后的子树构建的树替换原始树。如图图\
  \ 20-9 所示，我们可以通过将原始树的左子树连接到原始树右子树中最小节点（最左侧节点）的左子树来实现。以下是整个函数的代码。\n\n   ```\n   void\
  \ IntBinaryTree::makeDeletion(TreeNode *&tree)\n   {\n      // 用于保存将要删除的节点\n   \
  \   TreeNode *nodeToDelete = tree;\n\n      // 用于定位左子树\n      // 连接的位置\n      TreeNode\
  \ *attachPoint;\n\n      if (tree−>right == nullptr)\n      {\n          // 将树替换为其左子树\n\
  \          tree = tree−>left;\n      }\n      else if (tree−>left == nullptr)\n\
  \      {\n          // 将树替换为其右子树\n          tree = tree−>right;\n      }\n     \
  \ else\n          // 节点有两个孩子\n          {\n             // 移动到右子树\n            \
  \ attachPoint = tree−>right;\n\n             // 通过尽可能向左移动，\n             // 在右子树中找到最小节点\n\
  \             while (attachPoint−>left != nullptr)\n             attachPoint = attachPoint−>left;\n\
  \n             // 将原始树的左子树\n             // 连接为右子树中最小节点的左子树\n             attachPoint−>left\
  \ = tree−>left;\n\n             // 将原始树替换为其右子树\n             tree = tree−>right;\n\
  \          }\n       // 删除原始树的根节点\n      delete nodeToDelete;\n   }\n   ```\n\n\
  程序 20-4 演示了这些函数。\n\n为了参考，`IntBinaryTree` 文件的完整内容在此：\n\n# `IntBinaryTree.cpp` 的内容\n\
  \n\n\n\n\n```cpp\n#include <iostream>\n#include \"IntBinaryTree.h\"\nusing namespace\
  \ std;\n\n//**************************************************\n// 此版本的 insert 会将一个数字插入到*\n\
  // 主二叉搜索树的给定子树中。*\n//**************************************************\nvoid IntBinaryTree::insert(TreeNode\
  \ * &tree, int num)\n{\n   // 如果树为空，创建一个新节点并将其\n   // 设置为树的根\n   if (!tree)\n  \
  \    {\n        tree = new TreeNode(num);\n        return;\n      }\n\n   // 如果\
  \ num 已经存在树中：返回\n   if (tree->value == num)\n      return;\n\n   // 树不空：将新节点插入到\n\
  \   // 左子树或右子树\n   if (num < tree->value)\n      insert(tree->left, num);\n   else\n\
  \      insert(tree->right, num);\n}\n\n//***************************************************\n\
  // destroySubTree 由析构函数调用。它会*\n// 删除树中的所有节点。                   *\n//***************************************************\n\
  void IntBinaryTree::destroySubtree(TreeNode *tree)\n{\n      if (!tree) return;\n\
  \      destroySubtree(tree->left);\n      destroySubtree(tree->right);\n      //\
  \ 删除根节点节点\n      delete tree;\n}\n\n//***************************************************\n\
  // searchNode 确定一个值是否存在于*\n// 树中。如果是，函数返回 true。      *\n// 否则，它返回 false。       \
  \              *\n//***************************************************\nbool IntBinaryTree::search(int\
  \ num) const\n{\n   TreeNode *tree = root;\n\n   while (tree)\n   {\n      if (tree->value\
  \ == num)\n         return true;\n      else if (num < tree->value)\n         tree\
  \ = tree->left;\n      else\n         tree = tree->right;\n   }\n   return false;\n\
  }\n\n//********************************************\n// remove 删除给定树中成员变量与*\n//\
  \ num 相同的节点。  *\n//********************************************\nvoid IntBinaryTree::remove(TreeNode\
  \ *&tree, int num)\n{\n   if (tree == nullptr) return;\n   if (num < tree->value)\n\
  \      remove(tree->left, num);\n   else if (num > tree->value)\n      remove(tree->right,num);\n\
  \   else\n      // 我们找到了要删除的节点\n      makeDeletion(tree);\n}\n\n//***********************************************************\n\
  // makeDeletion 接收一个根节点将被删除的\n// 树的引用。如果树只有一个孩子，        *\n// 在删除其根节点后，该树将由该\n//\
  \ 唯一的孩子替换。如果树有两个孩子，   *\n// 将被删除节点的左子树挂载到*\n// 右子树的适当位置，然后*\n// 右子树将替换原始树。     \
  \       *\n//***********************************************************\nvoid IntBinaryTree::makeDeletion(TreeNode\
  \ *&tree)\n{\n   // 用于保存将要删除的节点\n   TreeNode *nodeToDelete = tree;\n\n   // 用于定位左子树挂载的\
  \   // 位置\n   TreeNode *attachPoint;\n\n   if (tree->right == nullptr)\n      {\n\
  \        // 将树替换为其左子树\n        tree = tree->left;\n      }\n   else if (tree->left\
  \ == nullptr)\n      {\n        // 将树替换为其右子树\n        tree = tree->right;\n    \
  \  }\n   else\n      // 节点有两个孩子\n      {\n         // 移动到右子树\n         attachPoint\
  \ = tree->right;\n\n         // 通过尽可能向左移动\n         // 找到右子树中最小的节点\n         while\
  \ (attachPoint->left != nullptr)\n            attachPoint = attachPoint->left;\n\
  \n         // 将原始树的左子树挂载\n         // 右子树中最小节点的左子树\n         attachPoint->left =\
  \ tree->left;\n\n         // 将原始树替换为其右子树\n         tree = tree->right;\n      }\n\
  \   // 删除原始树的根节点\n   delete nodeToDelete;\n}\n\n//*****************************************\n\
  // 此函数按中序遍历显示树中\n// 存储的值。                                            \n//*****************************************\n\
  void IntBinaryTree::displayInOrder(TreeNode *tree) const\n{\n   if (tree)\n    \
  \  {\n        displayInOrder(tree->left);\n        cout << tree->value;\n      \
  \  displayInOrder(tree->right);\n      }\n}\n\n//*****************************************\n\
  // 此函数按中序遍历显示树中\n// 存储的值。                                            \n//*****************************************\n\
  void IntBinaryTree::displayPreOrder(TreeNode *tree) const\n{\n   if (tree)\n   \
  \   {\n        cout << tree->value;\n        displayPreOrder(tree->left);\n    \
  \    displayPreOrder(tree->right);\n      }\n}\n\n//*****************************************\n\
  // 此函数按后序遍历显示树中\n// 存储的值。                                          \n//*****************************************\n\
  void IntBinaryTree::displayPostOrder(TreeNode *tree) const\n{\n   if (tree)\n  \
  \    {\n        displayPostOrder(tree->left);\n        displayPostOrder(tree->right);\n\
  \        cout << tree->value;\n      }\n}\n```\n\n#  own 点检查\n\n1. 20.7 描述中序遍历的事件序列。\n\
