  // Write the avgArray function here.\n```\n\n# 8.10 二维数组\n\n## 概念\n\n二维数组就像是将几个相同的数组组合在一起。它对于存储多组数据非常有用。\n\
  \n数组用于存储和处理一组数据。然而，有时有必要处理多组数据。例如，在一个成绩平均分计算程序中，老师可能会将一个学生的所有测试成绩记录在一个 `doubles`\
  \ 类型的数组中。如果老师有 30 名学生，这意味着需要 30 个 `doubles` 数组来记录整个班的成绩。然而，与其定义 30 个独立的数组，不如定义一个二维数组。\n\
  \n你到目前为止所学习的数组被称为`一维数组`，因为它们只能包含一组数据。`二维数组`（也称为 `2D arrays`）可以包含多组数据。最好将二维数组想象成具有行和列元素的表格，如图\
  \ 8-14 所示。该图显示了一个具有三行四列的测试成绩数组。注意，三行的编号为 0 到 2，四列的编号为 0 到 3。数组中总共有 12 个元素。\n\n##\
  \ 图 8-14 二维数组\n\n![表格显示了一个二维数组。](img/FG_08_014.png)图 8-14 完整替代文本\n\n要定义二维数组，需要两个尺寸声明符。第一个用于行数，第二个用于列数。以下是一个三行四列二维数组的定义示例：\n\
  \n![数组定义显示为“double score [3][4]”。对“3”的注释为“行”，对“4”的注释为“列”。](images/UNFG_08_001.png)\n\
  \n注意，每个数字都包含在自己的括号对内。\n\n为了处理二维数组中的信息，每个元素都有两个下标，一个表示行，另一个表示列。在 `score` 数组中，第 0\
  \ 行的元素引用方式为：\n\n```\nscore[0][0]\nscore[0][1]\nscore[0][2]\nscore[0][3]\n```\n\n\
  第 1 行的元素是：\n\n```\nscore[1][0]\nscore[1][1]\nscore[1][2]\nscore[1][3]\n```\n\n第\
  \ 2 行的元素是：\n\n```\nscore[2][0]\nscore[2][1]\nscore[2][2]\nscore[2][3]\n```\n\n下标引用在程序中的用法与一维数组中的元素引用一样。例如，以下语句将值\
  \ 92.25 赋值给 `score` 数组中第 2 行第 1 列的元素：\n\n```\nscore[2][1] = 92.25;\n```\n\n接下来的语句显示第\
  \ 0 行第 2 列的元素：\n\n```\ncout << score[0][2];\n```\n\n遍历二维数组每个元素的程序通常使用嵌套循环实现。程序 8-21\
  \ 展示了一个示例。\n\n和一维数组一样，二维数组可以在创建时进行初始化。在初始化二维数组时，将每行的初始化列表包含在一组括号中会有帮助。例如：\n\n```cpp\n\
  int hours[3][2] = {{8, 5}, {7, 9}, {6, 3}};\n```\n\n相同的语句也可以写为：\n\n```cpp\nint hours[3][2]\
  \ = {{8, 5},\n                   {7, 9},\n                   {6, 3}};\n```\n\n在任何一种情况下，值都如下所示赋值给\
  \ `hours`：\n\n```\nhours[0][0] 被设置为 8\nhours[0][1] 被设置为 5\nhours[1][0] 被设置为 7\n\
  hours[1][1] 被设置为 9\nhours[2][0] 被设置为 6\nhours[2][1] 被设置为 3\n```\n\n图 8-15 展示了初始化。\n\
  \n## 图 8-15 二维数组初始化\n\n![表格显示了数组的初始化值。](img/FG_08_015.png)图 8-15 完整替代文本\n\n包含每行的额外括号是可选的。以下两个语句执行相同的初始化：\n\
  \n```cpp\nint hours[3][2] = {{8, 5}, {7, 9}, {6, 3}};\nint hours[3][2] = {8, 5,\
  \ 7, 9, 6, 3};\n```\n\n由于额外的括号在视觉上分离了每一行，使用它们是一个好主意。此外，括号允许你在不省略后续行的情况下省略行初始化。例如，查看以下数组定义：\n\
  \n```cpp\nint table[3][2] = {{1}, {3, 4}, {5}};\n```\n\n`table[0][0]` 初始化为 1，`table[1][0]`\
  \ 初始化为 3，`table[1][1]` 初始化为 4，`table[2][0]` 初始化为 5。未初始化的元素（在本例中的 `table[0][1]` 和\
  \ `table[2][1]`）自动设为零。\n\n## 向函数传递二维数组\n\n程序 8-22 展示了如何向函数传递二维数组。当将二维数组传递给函数时，参数类型必须包含列数的声明符。C++\
  \ 需要此信息来将下标引用（如 `table[2][1]`）正确转换为该元素存储在内存中的地址。以下是 `showArray` 函数的头文件，来自程序 8-22：\n\
  \n```cpp\nvoid showArray(const int array[][NUM_COLS], int numRows)\n```\n\n`showArray`\
  \ 函数可以接受任何二维整数数组，只要它有四列。在程序 8-22 中，该函数显示两个独立数组的内容。\n\n由于二维数组在内存中的存储方式，C++ 要求在函数原型和头文件中指定列数。一行实际上紧跟着另一行，如图\
  \ 8-16 所示。\n\n## 图 8-16 二维数组的内存布局\n\n![内存存储展示了内存布局。存储显示了 12 个矩形。每 4 个连续的矩形分为一组。第一组\
  \ 4 个矩形标记为“row 1”，第二组 4 个矩形标记为“row 2”，第三组 4 个矩形标记为“row 3”。](img/FG_08_016.png)\n\
  \n当编译器生成访问二维数组元素的代码时，它需要知道内存中行之间隔了多少字节。列数是此计算的关键因素。\n\n这种所需的列信息也可以 `typedef` 语句提供。以下是二维数组的\
  \ `typedef` 定义示例：\n\n```cpp\ntypedef int intTable[][4];\n```\n\n该语句使 `intTable`\
  \ 成为任意行数四列二维数组的别名。如果此 `typedef` 语句包含在程序 8-22 中，那么 `showArray` 函数的原型就可以写为：\n\n```cpp\n\
  void showArray(intTable, int);\n```\n\n并且其函数头可以写为：\n\n```cpp\nvoid showArray(intTable\
  \ array, int numRows)\n```\n\n\n\n\n\n在程序 8-21 中，我们使用嵌套循环并将每个数组元素的内容添加到累加器中，从而求出了二维数组中所有数据的和。你记得求和数组元素的代码看起来如下：\n\
  \n```\n for (div = 0; div < NUM_DIVS; div++)\n{  for (qtr = 0; qtr < NUM_QTRS; qtr++)\n\
  \      totalSales += sales[div][qtr];\n}\n```\n\n`NUM_DIVS` 是数组的行数。`NUM_QTRS` 是列数。外层循环为数组中的每一行迭代一次，内层循环为该行的每一列迭代一次。\n\
  \n# 二维数组的行求和\n\n然而，有时你需要单独计算二维数组中每行的和。例如，假设有一个二维数组用于存储一组学生的测试分数。数组中的每一行都是一个学生的得分情况。为了计算每个学生的总分，你再次使用一对嵌套循环。内层循环用于相加某行的所有分数，即一个学生的所有分数。外层循环为每个学生执行一次。但现在，在开始累加值之前，必须为*每*行将累加器重置为\
  \ 0。此外，在开始新行之前，需要将该行的和存储在某处或显示。这里有一个示例。\n\n```\n const int NUM_STUDENTS = 3;   \
  \    // 学生人数\nconst int NUM_SCORES = 5;         // 测试分数数量\ndouble total;       \
  \              // 累加器\ndouble average;                   // 存储给定学生的平均分\ndouble scores[NUM_STUDENTS][NUM_SCORES]\
  \ = {{88, 97, 79, 86, 94},\n                                           {86, 91,\
  \ 78, 79, 84},\n                                           {82, 73, 77, 82, 89}};\n\
  // 计算每个学生的测试分数总和，以便\n// 计算并显示其平均分 \nfor (int row = 0; row < NUM_STUDENTS; row ++)\n\
  {\n   // 为该学生重置累加器为 0\n   total = 0;\n   // 求和一行 \n   for (int col = 0; col < NUM_SCORES;\
  \ col++) \n      total += scores[row][col];\n   // 计算并显示该学生的平均分\n   average = total\
  \ / NUM_SCORES; \n   cout << \"Score average for student \"\n        << (row + 1)\
  \ << \" is \" << average << endl;\n}\n```\n\n# 二维数组的列求和\n\n有时你可能需要计算二维数组每列的和。使用上一个示例中的测试分数数组，假设你想计算每次测试的平均分，而不是每个学生的平均分。要做到这一点，你必须计算数组每列的平均值。与上一个示例一样，这是通过嵌套循环完成的。然而，现在两个循环的顺序反过来了。内层循环用于加上某列的所有分数，即某次测试的所有分数。外层循环为每次测试执行一次。以下代码说明了这一点。\n\
  \n```\n const int NUM_STUDENTS = 3;     // 学生人数\nconst int NUM_SCORES = 5;     \
  \  // 测试分数数量\ndouble total;                   // 累加器\ndouble average;          \
  \       // 存储给定测试的平均分\ndouble scores[NUM_STUDENTS][NUM_SCORES] = {{88, 97, 79, 86,\
  \ 94},\n                                           {86, 91, 78, 79, 84},\n     \
  \                                      {82, 73, 77, 82, 89}};\n// 计算并显示每次测试\n//\
  \ 班级平均分\nfor (int col = 0; col < NUM_SCORES; col++)\n{\n   // 为本次测试重置累加器为 0\n  \
  \ total = 0;\n   // 求一列\n   for (int row = 0; row < NUM_STUDENTS; row++)\n     \
  \  total += scores[row][col];\n   // 计算并显示本次测试的班级平均分\n   average = total / NUM_STUDENTS;\n\
  \   cout << \"Class average for test \" << (col + 1) \n        << \" is \" << average\
  \ << endl;\n}\n```\n\n# 8.11 三维或更多维数组\n\n## 概念\n\nC++ 允许数组具有多个维度。\n\nC++ 允许你创建几乎任意维数的数组。以下是一个三维（3D）数组定义的示例：\n\
  \n```\n double seat[3][5][8];\n```\n\n这个数组可以被认为三组五行，每行有八个元素。例如，该数组可能用于存储拥有三个区域的剧院的座位价格，每个区域有五行，每行八个座位。\n\
  \n图 8-1 展示了将二维数组作为“页”的三维数组概念![8-17 三维数组。它显示了三个矩形，彼此排列。它们被标记为 0、1 和 2。每个矩形被分为 5 行。](img/08_17)\
  \ 超过三个维的数组很难可视化，但在某些问题很有用。在编写接受多维数组的函数时，必须明确指定第一个维度。\n\n## Check\n\n1. 8.19 定义以下数组：\n\
