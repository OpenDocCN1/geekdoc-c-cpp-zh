  \n# 第 19 章 栈与队列\n\n## 19.1 栈引言\n\n## 概念\n\n栈是一种按照“后进先出”方式存储和检索项的数据结构。\n\n### 定义\n\
  \n与数组或链表一样，栈也是一种持有元素序列的数据结构。然而，与数组和列表不同，栈是 `后进先出 (LIFO)` 结构。这意味着当程序从栈中检索元素时，最后插入栈的元素是第一个被检索的元素（反之亦然，第一个插入的元素是最后一个被检索的元素）。\n\
  \n在视觉化栈的工作方式时，想象食堂排队起点处的一叠盘子。当食堂工作人员补充盘子供应时，他或她放在栈上的第一个盘子是最后一个被拿走的那个。这在图 19-1 中均所示。\n\
  \n### # 图 19-1 一叠盘子是后进先出的结构\n\n![插图显示了 5 个堆叠在一起的盘子。它们从底部到顶部编号为 1 到 5。针对底部和顶部盘子的注释分别为“第一个进入，最后一个先出”和“最后一个进入，第一个先出”。](img/FG_19_001.png)\n\
  \n食堂盘子栈的 LIFO 特性也是栈数据结构的主要特征。最后放在栈上的数据元素是第一个从栈中检索的数据元素。\n\n### 栈的应用\n\n栈是对于首先处理系列中最后一个保存元素的算法非常有用的数据结构。例如，计算机系统在执行程序时会使用栈。当函数被调用时，计算机系统会将程序的返回地址、函数的参数以及函数的局部变量存储在栈上。当函数返回时，局部变量、参数和返回地址会从栈中移除。\n\
  \n### 静态栈与动态栈\n\n栈数据结构有两种：静态栈和动态栈。`静态栈`具有固定的大小，并用数组实现。`动态栈` 根据需要按大小增长，并用链表实现。在本节中，你将看到静态栈和动态栈的示例。\n\
  \n### 栈操作\n\n栈有两个主要操作：`push` 和 `pop`。`push` 操作导致一个值被存储或推入栈中。例如，假设我们有一个可以容纳三个值的空整数栈。在该栈上，我们执行以下\
  \ push 操作。\n\n```\n push(5);\npush(10);\npush(15);\n```\n\n图 19-2 展示了在执行这些 push\
  \ 操作后栈的状态。\n\n### # 图 19-2 栈上的 push 操作\n\n![插图显示了 3 次 push 操作。](img/FG_19_002.png)图\
  \ 19-2 完整备用文本\n\n`pop` 操作从栈中检索（从而移除）一个值。假设我们对图 19-2 所示的栈上连续执行三次 pop 操作。图 19-3 描绘了结果。\n\
  \n### # 图 19-3 栈上的 pop 操作\n\n![插图显示了 3 次 pop 操作。](img/FG_19_003.png)图 19-3 完整备用文本\n\
  \n正如你从图 19-3 中看到的，pop 操作会让栈变空。\n\n### 静态栈\n\n现在我们检查一个存储静态整数栈的 `IntStack` 类。它具有表\
  \ 19-1 所示的成员变量。\n\n### 表 19-1 栈的成员变量\n\n| 成员变量 | 描述 |\n| --- | --- |\n| `stackArray`\
  \ | 指向数组的 `unique_ptr`。当执行构造函数时，它动态分配数组。 |\n| `capacity` | 栈的大小整数，而不是栈中当前元素的数量。\
  \ |\n| `top` | 用于标记栈顶的整数。它指定了将添加的元素的位置。 |\n\n类的成员函数列在表 19-2 中。\n\n### 表 19-2 栈的成员函数\n\
  \n| 成员函数 | 描述 |\n| --- | --- |\n| 构造函数 | 类的构造函数接收一个整数参数，指定栈的大小。动态分配该大小的整数数组。此外，变量\
  \ `top` 初始化为 0，以指示栈为空。 |\n| `push` | `push` 函数接收一个整数参数，将其推入栈顶。 |\n| `pop` | `pop`\
  \ 函数使用整数引用参数。栈顶的值被移除并复制到引用参数中。 |\n| `isEmpty` | 如果栈为空则返回 `true`，否则返回 `false`。当 `top`\
  \ 设置为 0 时栈是空的。 |\n\n### 注意\n\n尽管构造函数动态分配了栈数组，它仍然被视为静态栈，因为栈的大小在分配后就不会改变。\n\n类的代码所示：\n\
  \n# `IntStack.h` 内容\n\n```\n 1 #include <memory>\n 2 using namespace std;\n 3 class\
  \ IntStack\n 4 {\n 5    unique_ptr<int []>stackArray;\n 6    int capacity;\n 7 \
  \   int top;\n 8 public:\n 9    // 构造函数\n 10    IntStack(int capacity);  \n 11 \
  \   \n 12    // 成员函数\n 13    void push(int value);\n 14    void pop(int &value);\n\
  \ 15    bool isEmpty() const;\n 16   \n 17    // 栈异常\n 18    class Overflow {};\n\
  \ 19    class Underflow {};\n 20 };\n```\n\n\n\n\n\n除了表 19-2 中描述的栈成员外，`IntStack`\
  \ 类还定义了两个名为 `Overflow` 和 `Underflow` 的内部类，用作栈异常。异常在第 16 章中会有介绍，但为了方便可能跳过该章节的读者，我们在这里简要解释一下它们。\n\
  \n### 异常、溢出与下溢\n\n当一段代码在执行过程中遇到无法完成其设计设计的任务的情况时，就称该代码导致了 `exception`。对于静态栈来说，如果在调用\
  \ `push` 时栈上没有更多空间，就会发生 `overflow`（溢出）异常。同样地，如果在调用 `pop` 时栈上没有内容可供 `pop` 返回，就会发生\
  \ `underflow`（下溢）异常。\n\n检测到异常发生的代码可以通过创建一个描述异常的值，并使用 `throw` 语句将该值传递给程序的其他部分，来通知程序的其他部分。例如，`push`\
  \ 函数通过执行语句宣布溢出异常的发生：\n\n```cpp\nthrow IntStack::Overflow();\n```\n\n而 `pop` 函数执行语句：\n\
  \n```cpp\nthrow IntStack::Underflow();\n```\n\n来通知程序发生了下溢异常。默认情况下，当程序的任何部分抛出异常时，程序会带错误消息终止。这种默认行为可以通过被称为“捕异常”（catching\
  \ the exception）的过程来更改。你可以在第 16 章中学习更多关于异常的知识。\n\n`IntStack` 构造函数分配一个指定容量的数组并将成员变量\
  \ `top` 设置为 0。所有的栈函数使用 `top` 的方式都是使其始终指向栈数组中的下一个空槽。当 `top` 等于 `capacity` 时，没有更多可用槽位来存储值，此时调用\
  \ `push` 将抛出异常。同样，当 `top` 为 0 时，栈为空，调用 `pop` 将抛出异常。由于程序中没有捕获这任一异常的规定，因此任何一个异常的发生都会带有错误消息终止程序。注意，`push`\
  \ 在向栈中添加值后递增 `top`，而 `pop` 在返回存储在 `stackArray[top]` 中的值之前递减 `top`。\n\n# `IntStack.cpp`\
  \ 的内容\n\n```cpp\n 1 #include \"intstack.h\"\n 2 //************************************\n\
  \ 3 // 构造函数                       *\n 4 //************************************\n\
  \ 5 IntStack::IntStack(int capacity)\n 6 {\n 7    stackArray = make_unique<int[]>(capacity);\n\
  \ 8    this−>capacity = capacity;\n 9    top = 0;\n10 }\n 11 \n12 //***********************************\n\
  \ 13 // 向栈中添加值        *\n 14 //***********************************\n 15 void IntStack::push(int\
  \ value)\n 16 {\n 17    if (top == capacity) throw IntStack::Overflow();\n 18  \
  \  stackArray[top] = value;\n 19    top++;\n 20 }\n 21 \n 22 //****************************************\n\
  \ 23 // 判断栈是否为空 *\n 24 //****************************************\n 25 bool IntStack::isEmpty()\
  \ const\n 26 {\n 27    return top == 0;\n 28 }\n 29 \n 30 //************************************************\n\
  \ 31 // 从栈中移除一个值并返回 *\n 32 //************************************************\n\
  \ 33 void IntStack::pop(int &value)\n 34 {\n 35    if (isEmpty()) throw IntStack::Underflow();\n\
  \ 36    top––;\n 37    value = stackArray[top];\n 38 }\n```\n\n程序 19-1 展示了栈类及其成员函数。注意，推入栈中的值在被弹出时是反序弹出的。\n\
  \n在程序 19-1 中，调用构造函数时传入参数为 5。这设置了成员变量，如图 19-4 所示。由于 `top` 被设置为 0，因此栈是空的。\n\n# 图 19-4\
  \ 容量为 5 的空栈\n![插图显示了一个标记为 `stackArray` 的 5 个正方形组成的垂直栈。正方形从下到上标记为 [0], [1], [2],\
  \ [3], [4], 和 [5]。插图还显示 `top` 值为 0，`capacity` 值为 5。](images/FG_19_004.png)\n\n#\
  \ 图 19-5 向空栈推入一个值\n![插图显示了一个标记为 `stackArray` 的 5 个正方形组成的垂直栈。](img/FG_19_005.png)\n\
  图 19-5 替代文本\n\n# 图 19-6 满栈\n![插图显示了一个标记为 `stackArray` 的 5 个正方形组成的垂直栈。正方形从下到上标记为\
  \ 5, 10, 15, 20, 和 25。插图还显示 `top` 值为 5，`capacity` 值为 5。](img/FG_19_006.png)\n\n\
  # 图 19-7 从栈中弹出值\n![插图显示了一个带有 5, 10, 15, 20, 25 值的栈。一个来自 25 的箭头指向标记为 `value` 的正方形。显示了数字\
  \ 25。`top` 值为 4，`capacity` 值为 5。](img/FG_19_007.png)\n\n程序继续调用 `pop` 函数直到所有的值都从栈中移除。\n\
  \n# 处理栈异常\n\n正如你在第 16 章中所学习到的，C++ 的 `try/catch` 语句可以捕获并恢复异常，从而允许程序避免终止。程序 19-2 展示了使用\
  \ `IntStack` 类的程序如何捕获它抛出的异常。程序尝试向栈中存储比栈能处理更多的值，导致 `push` 抛出 `Overflow` 异常。`main`\
  \ 函数捕获该异常并打印一条解释性的错误消息。\n\n\n\n\n溢出（overflow）和下溢（underflow）的区别可以总结如下：`push` 操作中的栈溢出通知调用者栈资源已耗尽，而栈下溢则通知调用者程序逻辑出现错误。与溢出不同，栈下溢可以通过细致的编程来避免。因此，程序不应该使用\
  \ `try/catch` 来处理下溢。相反，它们应该在调用 `pop` 之前通过调用 `isEmpty` 来确保不会发生下溢。\n\n# 栈模板\n\n本章所示的栈类仅适用于整数。栈模板可以很容易地设计为适用于任何数据类型。这被留作一项“编程挑战”（Programming\
  \ Challenge）供你完成。\n\n# 19.2 动态栈\n\n## 概念\n\n栈可以实现为链表，并随着每次 `push` 或 `pop` 操作进行扩展或缩小。\n\
  \n动态栈构建在链表上而不是数组上。与基于数组的栈，基于链表的栈有两个优势：首先，不需要指定栈的初始大小。动态栈仅从空链表开始，每当推入一个值时扩展一个节点。其次，只要系统有足够的可用内存，动态栈永远不会满。\n\
  \n在本节中，我们将查看一个动态栈类 `DynIntStack`。该类是之前讨论的 `IntStack` 类的动态版本。类声明所示：\n\n## `DynIntStack.h`\
  \ 的内容\n\n```cpp\n 1 class DynIntStack\n 2 {\n 3      struct StackNode\n 4      {\
  \     \n5         int value;\n6         StackNode *next;\n 7         // 构造函数\n8\
  \         StackNode(int value1, StackNode *next1 = nullptr)\n 9         {\n10  \
  \          value = value1;\n11            next = next1;\n12         }\n13      };\n\
  14      StackNode *top;\n15 public:\n16    DynIntStack() { top = nullptr; }\n17\
  \    ~DynIntStack();\n18    void push(int);\n19    void pop(int &););\n20    bool\
  \ isEmpty() const;\n21 \n22    // 栈异常\n23    class Underflow {};\n24 };\n```\n\n\
  `StackNode` 类是链表中每个节点的数据类型。因为在列表头部添加和删除项很容易，所以我们将链表的头部作为栈的顶端（top），并使用指针 `top` 指向列表中的第一个节点。该指针由栈的构造函数初始化为\
  \ `nullptr`，表示栈被创建时为空。动态栈没有用于填充的静态分配的数组，因此没有溢出异常。然而，该类定义了 `Underflow` 异常，当尝试弹出空栈时抛出该异常。\n\
  \n该栈类的成员函数所示如下：\n\n## `DynIntStack.cpp` 的内容\n\n```cpp\n 1 #include <iostream>\n\
  \ 2 #include \"DynIntStack.h\"\n 3 #include <cstdlib>\n 4 using namespace std;\n\
  \ 5 \n6 //**************************************************\n 7 // 成员函数 push 将参数推入\
  \   *\n8 // 栈中。                                      *\n9 //**************************************************\n\
  10 void DynIntStack::push(int num)\n11 {\n12    top = new StackNode(num, top);\n\
  13 }\n14 \n15 //*****************************************************\n16 // 成员函数\
  \ pop 栈顶部的值   *\n17 // 被移除并复制到作为参数       *\n18 // 传入的变量中。                      \
  \       *\n19 //*****************************************************\n20 void DynIntStack::pop(int\
  \ &num)\n21 {\n22    StackNode *temp;\n23 \n24    if (isEmpty()) { throw DynIntStack::Underflow();\
  \ }\n25    else  \n26    {\n27       // 从栈顶弹出值      \n28       num = top->value;\n\
  29       temp = top;\n30       top = top->next;\n31       delete temp;\n32    }\n\
  33 }\n34 \n35 //*****************************************************\n36 // 成员函数\
  \ isEmpty 如果栈为空\n37 // 则返回 true，否则返回 false。              *\n38 //*****************************************************\n\
  39 bool DynIntStack::isEmpty() const\n40 {\n41    return top == nullptr;\n42 }\n\
  43 \n44 //*****************************************************\n45 // 析构函数。   \
  \                                     *\n46 //*****************************************************\n\
  47 DynIntStack::~DynIntStack()\n48 {\n49    StackNode * garbage = top;\n50    while\
  \ (garbage != nullptr)\n51    {\n52       top = top->next;\n53       garbage->next\
  \ = nullptr;\n54       delete garbage;\n55       garbage = top;\n56    }\n57   \n\
  58 }\n```\n\n`push` 函数特别简单。它仅仅是创建一个新节点，其值为要推入栈的数字，其后继指针指向当前栈顶节点，然后将新创建的节点变为栈的新顶：\n\
  \n```cpp\ntop = new StackNode(num, top);\n```\n\n注意，即使在 `push` 操作之前栈是空的，这也能正常工作，因为后继指针将是\
  \ `nullptr`。\n\n现在让我们来看 `pop` 函数。正如 `push` 函数必须在头部插入节点，`pop` 也必须在头部删除节点。首先，函数调用\
  \ `isEmpty` 来确定栈中是否有任何节点。如果没有，则抛出异常。\n\n```cpp\nif (isEmpty()) { throw DynIntStack::Underflow();\
  \ }\n```\n\n如果 `isEmpty` 返回 `false`，则执行以下语句：\n\n```cpp\nelse\n{\n   num = top->value;\n\
  \   temp = top;\n   top = top->next;\n   delete temp;\n}\n```\n\n# 19.3 STL `stack`\
  \ 容器\n\n## 概念\n\n标准模板库（STL）提供了一个栈模板，它可以基于 `vector`、`list` 或 `deque` 实现。\n\n到目前为止，你学过的\
  \ STL 容器是 `vector` 和 `list`。`stack` 容器可以基于 `vector` 或 `list` 实现。（它也可以基于 `deque`\
  \ 实现，你将在本章的晚些部分学习。）如果一个类为另一个类提供了新接口，则说该类*适配*（adapt）另一个类。由于 `stack` 容器被用于适配 list、vector\
  \ 和 deque 容器，因此通常被称为*容器适配器*（container adapter）。\n\n以下是声明基于 `vector`、`list` 和 `deque`\
  \ 实现的 `int` 栈的示例：\n\n```cpp\nstack< int, vector<int>> iStack; // Vector 栈\nstack<\
  \ int, list<int>> iStack    // List 栈\nstack< int > iStack;             // Deque\
  \ 栈（默认）\n```\n\n### 注意\n\n在 C++11 之前，`iStack` 声明中的成对右角括号 `>>` 必须写成 `> >`，它们之间至少有一个空格，以防止编译器将其误认为流提取运算符\
  \ `>>`。\n\n表 19-3 列出了并描述了栈模板的一些成员函数。\n\n# 表 19-3 STL 栈成员函数\n\n| 成员函数 | 示例和描述 |\n\
  | --- | --- |\n| `empty` | |\n\n\n\n\n\n```\nif (myStack.empty())\n```\n\n`empty`\
  \ 成员函数在栈为空时返回 `true`。如果栈中有元素，它则返回 `false`。\n\n| `pop` | \n\n```\nmyStack.pop();\n\
  ```\n\n`pop` 函数移除栈顶的元素。\n\n| `push` | \n\n```\nmyStack.push(x);\n```\n\n`push` 函数将一个值为\
  \ `x` 的元素推入栈中。\n\n| `size` | \n\n```cpp\ncout << myStack.size() << endl;\n```\n\n\
  `size` 函数返回栈中当前的元素个数。\n\n| `top` | \n\n```\nx = myStack.top();\n```\n\n`top` 函数返回栈顶元素的引用。\n\
  \n## 注意事项\n\n栈模板中的 `pop` 函数不会从栈顶取回值；它只是将其移除。要获取该值，必须先调用 `top` 函数。\n\n程序 19-4 是一个演示用\
  \ vector 实现 STL 栈的驱动程序。\n\n# 练习\n\n1. 19.1 描述什么是 LIFO。\n2. 19.2 静态栈和动态栈有什么区别？动态栈相比静态栈有什么优势？\n\
  3. 19.3 栈的两个主要操作是什么？请描述这两个操作。\n4. 19.4 STL 栈容器适配哪些 STL 类型？\n\n# 19.4 队列简介\n\n##\
  \ 概念\n\n队列是一种以先入先方式存储和检索项的数据结构。\n\n## 定义\n\n与栈一样，`queue`（读作“cue”）也是一种包含元素序列的数据结构。然而，队列以`先入先出\
  \ (FIFO)` 顺序提供对其元素的访问。队列中的元素处理方式就像在杂货店结账处排队的顾客：队中的第一个顾客是第一个被服务的。\n\n## 队列的应用\n\n\
  队列数据结构常用于计算机操作系统。它们在多用户/多任务环境中尤为重要，在这些环境中，可能有多个用户或任务同时请求相同的资源。例如，打印功能由队列控制，因为一次只能打印一个文档。队列被用于存放系统用户提交的打印作业，而打印机一个接一个地处理这些作业。\n\
  \n通信软件也使用队列来保存通过网络和拨号连接接收到的信息。有时信息传输到系统的速度快于其处理速度，因此在接收时会被放入队列中。\n\n## 静态队列和动态队列\n\
  \n队列像栈一样，可以用数组或链表实现。动态队列相比静态队列提供的优势与动态栈相比静态栈提供的优势相同。事实上，队列和栈的主要区别在于每种结构中访问数据元素的方式。\n\
  \n## 队列操作\n\n队列像杂货店的结账线一样有一个头部（front）和一个尾部（rear）。这在图 19-8 中所示。当元素被添加到队列时，它被添加到尾部。当元素从队列中移除时，它从头部移除。两个主要的队列操作是入队（enqueuing）和出队（dequeuing）。`enqueue`\
  \ 意味着在队列尾部插入一个元素，而 `dequeue` 意味着从队列头部移除一个元素。有多种算法可以实现这些操作。我们将从简单的开始看。\n\n## 图 19-8\
  \ 基于数组的队列\n\n![一个基于数组的队列插图显示了一行排列的 7 个正方形。左侧第一个正方形和右侧最后一个正方形旁的注释分别为“front”和“rear”。](img/FG_19_008.png)\n\
  \n假设我们有一个空的静态整数队列，最多可以容纳三个值。使用该队列我们执行以下入队操作：\n\n```\nenqueue(3);\nenqueue(6);\n\
  enqueue(9);\n```\n\n图 19-9 展示了每次这些入队操作后的队列状态。\n\n## 图 19-9 一系列入队操作\n\n![图像显示了 3\
  \ 个基于数组的队列插图。](img/FG_19_009.png)图 19-9 完整备用文本\n\n注意，头部索引（一个持有下标或指针的变量）始终引用同一个物理元素。随着元素的入队，尾部索引在数组中移动。现在让我们如何执行出队操作。图\
  \ 19-10 展示了每次出队操作后的状态。\n\n## 图 19-10 出队操作序列\n\n![图像显示了 3 个出队操作的插图。](img/FG_19_010.png)图\
  \ 19-10 完整备用文本\n\n在出队操作中，队列头部元素被移除。这是通过将其之后的所有元素向前移动一位来实现的。在第一次出队后，`3` 被移除，`6` 在头部。在第二次出队后，`6`\
  \ 被移除，`9` 在头部。当在图 19-10 执行最后一次出队时，队列为空。空队列可以通过将头部和尾部设置为 `-1` 来表示。\n\n该算法的问题是效率低下。每次出队，剩余元素都会向前移动。队列中的元素越多，每次操作所需的时间就越长。\n\
  \n解决此问题的方法是：让头部和尾部索引在数组中移动。之前，当入队元素时，尾部索引移动以留出空间。但在这种设计中，当出队元素时，头部索引向尾部移动。这消除了移动剩余元素的需要。\n\
  \n通过这种方法，随着元素的添加和移除，队列逐渐“爬”向数组末尾。这在图 19-11 中所示。阴影部分代表队列（头部和尾部之间）。\n\n## 图 19-11\
  \ 队列操作混合序列\n\n![图像显示了 4 个数组。](img/FG_19_011.png)图 19-11 完整备用文本\n\n这种方法的问题是尾部索引无法越过数组的最后一个元素。解决方案是将数组视为环形的，而不是线性的。当元素越过数组末尾时，它只需绕回开头。例如，考虑图\
  \ 19-12 所示的队列。\n\n## 图 19-12 即将环绕队列\n\n![数组显示了 9 个正方形。下标从 [0] 到 [8]。最后 4 个正方形显示数字\
  \ 7, 9, 6 和 3。其余的是空的。显示数字 7 和 3 的方形旁的注释分别为“front”和“rear”。](images/FG_19_012.png)\n\
  \n值 `3` 在队列尾部，值 `7` 在队列头部。现在，假设执行入队操作，将值 `4` 插入队列。图 19-13 展示了队列尾部是如何绕回数组开的。\n\n\n\
  \n\n![一个数组显示了 9 个正方形。它的下标从 [0] 到 [8]。](images/FG_19_013.png)图 19-13 完整替代文本\n\n那么，将尾部标记回绕到数组另一端的代码是什么？一种直接的方法是使用\
  \ `if` 语句，例如\n\n```\n if (rear == queueSize − 1)\n   rear = 0;\nelse\n   rear++;\n\
  ```\n\n另一种方法是使用模数运算：\n\n```\nrear = (rear + 1) % queueSize;\n```\n\n该语句使用 `%` 运算符将\
  \ `rear` 中的值调整到适当的位置。虽然这种方法看起来更优雅，但使用哪种代码由你决定。\n\n# 使用循环数组检测全队列和空队列\n\n在我们使用循环数组实现队列队列中，我们采用了这样的约定：`front`\
  \ 和 `rear` 索引均引用*仍在队列中*的项，且 `front` 和 `rear` 索引都将设置为 −1 以表示队列*空*。为了保持这一约定，当从只有一个元素的队列中删除一个元素时，出队操作必须将\
  \ `front` 和 `rear` 都设置为 −1。出队操作可以通过测试 `front` 是否等于 `rear` 来检查队列是否只有一个元素。为了防止队列溢出，入队操作在添加另一个元素之前必须首先检查队列是否已满。我们可以通过测试表达式来检查队列是否满\n\
  \n```\n(rear + 1) % queueSize == front\n```\n\n查看其是否为真。\n\n检测全队列和空队列还有另一种方法：可以使用计数器变量来记录队列中当前存储的项数。按照这种约定，计数器在每次入队操作时增加，在每次出队操作时减少。当计数器为零时，队列为空；当计数器等于为队列分配的大小时，队列为满。\n\
  \n由于记录队列中的项数可能有助于帮助，我们将在实现中使用第二种方法。因此，我们引入了以下变量\n\n```\nunique_ptr<int []> queueArray;\n\
  int queueSize;\nint front;\nint rear;\nint numItems;\n```\n\n其中 `numItems` 是计数器变量，`queueArray`\
  \ 是指向大小为 `queueSize` 的动态分配数组的智能指针。我们采用以下两个约定：\n\n* `rear` 指向队列中存放最后添加到队列的项的位置。\n\
  * `front` 指向队列中曾持有最后从队列中移除的项的位置。\n\n由于尾部索引指向的约定，入队操作在添加新项 `num` 之前必须（循环地）将 `rear`\
  \ 向右移动一位：\n\n```\nrear = (rear + 1) % queueSize;\nqueueArray[rear] = num;\nnumItems\
  \ ++;\n```\n\n同样，由于 `front` 处的任何内容已经被移除，出队操作在检索队列项之前必须先移动 `front`。\n\n# 静态队列类\n\n\
  `IntQueue` 类的声明如下：\n\n## `IntQueue.h` 的内容\n\n```cpp\n 1 #include <memory>\n 2 using\
  \ namespace std;\n 3 class IntQueue\n 4 {\n 5 private:\n 6    unique_ptr<int []>\
  \ queueArray;\n 7    int queueSize;\n 8    int front;\n 9    int rear;\n10    int\
  \ numItems;\n11 public:\n 12    IntQueue(int);\n 13  \n 14    void enqueue(int);\n\
  \ 15    void dequeue(int &);\n 16    bool isEmpty() const;\n 17    bool isFull()\
  \ const;\n 18    void clear();\n 19 };\n```\n\n注意，除了本节讨论的操作外，该类声明了一个名为 `clear` 的成员函数。该函数通过重置\
  \ `front` 和 `rear` 索引并将 `numItems` 成员设置为 0 来清空队列。成员函数的定义列在此：\n\n## `IntQueue.cpp`\
  \ 的内容\n\n```cpp\n 1 #include <iostream>\n 2 #include \"IntQueue.h\"\n 3 #include\
  \ <cstdlib>\n 4 using namespace std;\n 5 \n 6 //*************************\n 7 //\
  \ 构造函数.           *\n 8 //*************************\n 9 IntQueue::IntQueue(int s)\n\
  10 {\n 11    queueArray = make_unique<int []>(s);\n 12    queueSize = s;\n 13  \
  \  front = −1;\n 14    rear = −1;\n 15    numItems = 0;\n 16 }\n 17 \n18 //********************************************\n\
  \ 19 // 函数 enqueue 将值 num 插入到 *\n20 // 队列的尾部。                 *\n 21 //********************************************\n\
  22 void IntQueue::enqueue(int num)\n23 {\n 24    if (isFull())\n 25    {\n 26  \
  \     cout << \"The queue is full.\\n\";\n 27       exit(1);\n 28    }\n 29    else\n\
  \ 30    {\n 31       // 计算新的尾部位置\n 32       rear = (rear + 1) % queueSize;     \
  \ \n 34       // 插入新项\n 35       queueArray[rear] = num;\n 36       numItems ++;\n\
  \ 37    }\n 38 }\n 39 \n40 //**********************************************\n 41\
  \ // 函数 dequeue 移除队列 *\n 42 // 前部的值，并将其复制到 num 中。\n43 //**********************************************\n\
  44 void IntQueue::dequeue(int &num)\n45 {\n 46    if (isEmpty())\n 47    {\n 48\
  \       cout << \"The queue is empty.\\n\";\n 49       exit(1);\n 50    }\n 51 \
  \   else\n 52    {\n 53       // 移动 front\n 54       front = (front + 1) % queueSize;\n\
  \ 55       // 获取队列项\n 56       num = queueArray[front];\n 57       // 更新项数\n 58\
  \       numItems--;\n 59    }\n60 }\n61 \n62 //*********************************************\n\
  63 // 函数 isEmpty 在队列 *\n64 //为空时返回 true，否则返回 false。*\n65 //*********************************************\n\
  66 bool IntQueue::isEmpty() const\n67 {\n68    return numItems == 0;\n69 }\n70 \n\
  71 //********************************************\n72 // 函数 isFull 在队列 *\n73 //\
  \ 满时返回 true，否则返回 false。*\n74 //********************************************\n75\
  \ bool IntQueue::isFull() const\n76 {\n77    return numItems == queueSize;\n78 }\n\
  79 \n80 //*******************************************\n81 // 函数 clear 重置 front 和\
  \ rear *\n82 // 索引，并将 numItems 设置为 0。*\n83 //*******************************************\n\
  84 void IntQueue::clear()\n85 {\n86    front = −1;\n87    rear = −1;\n88    numItems\
  \ = 0;\n89 }\n```\n\n程序 19-5 是 `IntQueue` 类的驱动程序。\n\n# 静态队列中的溢出和下溢异常\n\n我们队列类中的\
  \ `enqueue` 和 `dequeue` 函数在无法执行执行的任务时会终止调用程序。但终止调用者并不总是正确的做法。更好的行动方案是抛出异常，允许准备好处理此类异常的调用者采取适当行动。在捕获此类异常时，某些调用者确实可能决定终止程序。然而，其他调用者可能恢复并继续执行。例如，捕获队列溢出异常的程序可能会创建一个更大的队列并切换到新的。\n\
  \n静态队列更好的设计是让 `enqueue` 和 `dequeue` 抛出 `overflow` 和 `underflow` 异常。让 `enqueue` 抛出\
  \ `overflow` 消除了对公共 `isFull` 函数的需求，因为调用者可以使用 `try/catch` 块在溢出发生时处理它们。通过将所有 `enqueue`\
  \ 的调用放在 `try` 块中，调用者可以在一个地方处理由这些调用之一抛出的异常：`catch` 块。如果没有异常处理，每次调用 `enqueue` 之前都必须先调用\
  \ `isFull`，并在 `isFull` 返回真时附带恢复代码。\n\n# 19.5 动态队列\n\n## 概念\n\n队列可以使用链表实现，并随着每次入队或出队操作而扩展或缩小。\n\
  \n\n\n动态队列基于链表构建，比静态队列更直直观。动态队列起始于一个空链表。在第一次入队（enqueue）操作时，会添加一个节点，该节点由 `front`\
  \ 和 `rear` 指针指向。当向队列添加每个新元素时，会在列表末尾添加一个新节点，并更新 `rear` 指针指向该新节点。当每个元素被出队（deque）时，使\
  \ `front` 指向列表中的下一个节点，然后删除之前位于列表头部的节点。图 19-14 展示了动态队列的结构。\n\n# 图 19-14 基于链表的队列\n\
  \n![一个节点的插图解释了基于链表的队列。](img/FG_19_014.png)图 19-14 完整替代文本\n\n这里列出了动态整数队列类：\n\n# `DynIntQueue.h`\
  \ 的内容\n\n```\n 1 class DynIntQueue\n 2 {\n 3    struct QueueNode\n 4    {      \n\
  \ 5       int value;\n 6       QueueNode *next;\n 7       QueueNode(int value1,\
  \ QueueNode *next1 = nullptr)\n 8       {\n 9          value = value1;\n10     \
  \     next = next1;\n11       }\n12    };\n13    // 这些跟踪队列的头部和尾部\n14    QueueNode\
  \ *front;\n15    QueueNode *rear;\n16 public:\n17    // 构造函数和析构函数\n18    DynIntQueue();\n\
  19    ˜DynIntQueue();\n20 \n21    // 成员函数\n22    void enqueue(int);\n23    void\
  \ dequeue(int &);\n 2    bool isEmpty() const;\n 25    void clear();\n26 };\n```\n\
  \n# `DynIntQueue.cpp` 的内容\n\n```\n 1 #include <iostream>\n 2 #include \"DynIntQueue.h\"\
  \n 3 #include <cstdlib>\n 4 using namespace std;\n 5 \n 6 //************************\n\
  \ 7 // 构造函数.          *\n 8 //************************\n 9 DynIntQueue::DynIntQueue()\n\
  10 {\n11    front = nullptr;\n12    rear = nullptr;\n13 }\n14 \n15 //************************\n\
  16 // 析构函数.           *\n17 //************************\n18 DynIntQueue::˜DynIntQueue()\n\
  19 {\n20    QueueNode * garbage = front;\n21    while (garbage != nullptr)\n22 \
  \   {\n23       front = front−>next;\n24       garbage−>next = nullptr;\n25    \
  \   delete garbage;\n26       garbage = front;\n27    }\n28 }\n29 \n30 //********************************************\n\
  31 // 函数 enqueue 将值 num 插入到 *\n32 // 队列的尾部。                 *\n33 //********************************************\n\
  34 void DynIntQueue::enqueue(int num)\n35 {\n36    if (isEmpty())\n37    {\n38 \
  \      front = new QueueNode(num);\n39       rear = front;\n40    }\n41    else\n\
  42    {\n43       rear−>next = new QueueNode(num);\n44       rear = rear−>next;\n\
  45    }\n46 }\n47 \n48 //**********************************************\n49 // 函数\
  \ dequeue 队列 **\n50 // 头部的值，并将其复制到 num。 *\n51 //**********************************************\n\
  52 void DynIntQueue::dequeue(int &num)\n53 {\n54    QueueNode *temp = nullptr;\n\
  55    if (isEmpty())\n56    {\n57       cout << \"The queue is empty.\\n\";\n58\
  \       exit(1);\n59    }\n60    else\n61    {\n62       num = front−>value;\n63\
  \       temp = front;\n64       front = front−>next;\n65       delete temp;\n66\
  \    }\n67 }\n68 \n69 //*********************************************\n70 // 函数\
  \ isEmpty 如果队列为空则 *\n71 // 返回 true，否则返回 false。             *\n72 //*********************************************\n\
  73 bool DynIntQueue::isEmpty() const\n74 {\n75    if (front == nullptr)\n76    \
  \   return true;\n77    else\n78       return false;\n79 }\n80 \n81 //********************************************\n\
  82 // 函数 clear 出队队列中的所有  *\n83 // 元素。                             *\n84 //********************************************\n\
  85 void DynIntQueue::clear()\n86 {\n87    int value;   // 用于 dequeue 的哑变量\n88 \n\
  89    while (!isEmpty())\n90       dequeue(value);\n91 }\n```\n\n程序 19-6 是一个演示 `DynIntQueue`\
  \ 类的驱动程序。\n\n# 19.6 STL 的 `deque` 和 `queue`\n\n标准模板库（STL）提供了两个容器 `deque` 和 `queue`\
  \ 用于实现类队列的结构。在本节中，我们将检查标准模板提供的两个容器之一：`deque`。\n\n# `deque` 容器\n\n将 `deque` 容器想象成双端队列。它与\
  \ vector 类似，但允许高效访问头部和尾部。由于我们关注的是类队列特性，我们将重点关注 `push_back`、`pop_front` 和 `front`\
  \ 成员函数。表 19-4 描述了它们。\n\n# 表 19-4 `deque` 成员函数\n\n| 成员函数 | 示例 |\n| --- | --- |\n\
  | `push_back` | ```iDeque.push_back(7);```<br>接受一个插入到 deque 尾部的值 |\n| `pop_front`\
  \ | ```iDeque.pop_front();```<br>移除 deque 的第一个元素 |\n| `front` | ```cout << iDeque.front()\
  \ << endl;```<br>返回 deque 第一个元素的引用 |\n\n程序 19-7 演示了容器。\n\n# `queue` 容器适配器\n\n`queue`\
  \ 容器适配器可以基于 vector、list 或 deque 构建。默认情况下，它使用 deque 作为基础。\n\n`queue` 支持的插入和删除操作与\
  \ stack 相似：`push`、`pop` 和 `front`。然而它们的行为有所不同。`queue` 版本的 `push` 总是向队列尾部插入元素。`queue`\
  \ 版本的 `pop` 总是从头部移除元素。`front` 函数返回头部元素的值。程序 19-8 演示了队列。\n\n# 19.7 消除递归\n\n虽然递归是一种非常有用的编程技术，但它带来了解决问题过程中需要多次函数调用的开销。通过重构递归算法来消除递归，通常可以大大提高解决方案的效率。在本节中，我们将研究如何使用栈来消除快速排序中的递归。\n\
  \n快速排序的主要问题是一个范围，即数组 `arr` 中两个索引 `start` 和 `end` 之间的段。自然地，这只有在 `start` 小于 `end`\
  \ 时才需要执行。正如在第 14 章中所中学的，这通过调用一个过程 `partition` 来实现，该过程确定一个整数 `pivot`，使得：\n\n1.  枢值左侧段内的所有数组元素都小于枢值元素元素，即：\n\
  \n    `arr[k] < arr[pivot]` 对于范围 `start .. pivot–1` 内的所有 `k` 成立\n\n2.  枢值右侧段内的所有数组元素都大于或等于枢值元素元素，即：\n\
  \n    `arr[k] >= arr[pivot]` 对于范围 `pivot+1..end` 内的所有 `k` 成立\n\n\n\n完成此操作后，枢轴所在的数组项就处于其排序位置。因此，`partition`\
  \ 过程的一个重要效果是将枢轴元素放在其最终的排序位置。通过在调用 `partition` 时记录左、右子范围，稍后对这些子范围调用 `partition`，我们可以在不使用递归的情况下排序整个数组。我们需要跟踪这些子范围，并最终按照\
  \ Quicksort 递归调顺序对它们进行划分。由于 Quicksort 的递归调用是按照 LIFO（后进先出）顺序触发并返回的，我们使用栈来跟踪等待划分的范围。\n\
  \n我们解决方案的核心思想是定义一个类：\n\n```cpp\n class Range\n{\n   int start;\n   int end;\npublic:\n\
  \   Range(int s, int e)\n   {\n      start = s; \n      end = e;\n   }\n};\n```\n\
  \n用于跟踪待划分的数组范围。因此，我们使用 STL 的 `stack` 类来定义一个这些范围的栈：\n\n```cpp\n stack<Range> qStack;\n\
  ```\n\n然后我们使用函数 `qSort(int arr[ ], int size)`，该函数通过最初将从 `0` 到 `size–1` 的范围推入栈来排序数组\
  \ `arr`，然后反复从栈中取出范围、划分该范围，并将左、右子范围放回栈。从栈中移除的空子范围将被丢弃。算法如下：\n\n```text\n将 Range(0,\
  \ size–1) 推入栈\n当栈不为空\n   从栈中弹出范围 r\n   如果 r 不空\n      将范围 r 围绕枢轴划分为两个较小的范围\n   \
  \   将这两个较小的范围推入栈\n   结束如果\n结束循环\n```\n\n## Note\n\n语句 `qStack.push(Range(0, size–1));`\
  \ 通过调用构造函数创建一个 `Range` 对象。然后将该 `Range` 对象推入栈中。\n\n完整的解决方案复用了第 14 章 中的 `partition`\
  \ 函数，在程序 19-9 中。注意，我们将 `qSort` 函数声明为 `Range` 的友元，以便访问 `Range` 的私有成员。\n\n## Note\n\
  \n使用友元（friend）概念时应谨慎，因为它通过将类成员声明为私有，绕过了类为这些成员提供的保护。请注意，在我们的情况下，`Range` 类的 `start`\
  \ 和 `end` 成员永远不会被友元函数 `qSort` 修改。\n\n## 复习题与练习\n\n## 简答\n\n1. LIFO 是什么意思？\n2. 通过\
