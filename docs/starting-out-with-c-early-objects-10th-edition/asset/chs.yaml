  \n# 17. 抛硬币赢美元\n\n使用来自编程挑战 16 的 `Coin` 类创建一个游戏程序。该程序应该有三个 `Coin` 类的实例：分别代表一个四分之一（quarter）、一个美角（dime）和一个五美分（nickel）。\n\
  \n游戏开始时，你的初始余额为 $0。在游戏的每回合中，程序将抛出每一枚模拟硬币。当抛出的硬币正面朝上时，硬币的价值加入你的余额。例如，如果四分之一正面朝上，余额将增加\
  \ 25 分。反面朝上的硬币不增加余额。当你的余额达到美元或更多时，游戏结束。如果你的余额*恰好*是一美元，你就赢了游戏。如果你的余额超过一美元，你就输了。\n\
  \n# 18. 钓鱼游戏模拟\n\n编写一个模拟钓鱼游戏的程序。在游戏中，通过投掷六面骰子来决定用户钓到了什么。每个可能的物品都有相应的钓鱼分。这些分数在用户结束钓鱼之前将保持隐藏，然后根据获得的钓鱼分数显示一条祝贺用户的消息。\n\
  \n以下是对游戏设计的一些建议：\n\n*   游戏的每回合都是循环的一次迭代，只要玩家想继续钓更多物品，循环就会重复。\n*   在每回合结束时，程序将询问用户是否想继续钓鱼。\n\
  *   程序模拟投掷六面骰子的过程。\n*   每个可以钓到的物品由骰子生成的数字表示——例如，1 代表“大鱼”，2 代表“旧鞋”，3 代表“小鱼”，以此此类推。\n\
  *   用户钓到的每个物品的分值不同。\n*   你作为程序设计者，可以决定每个数字代表什么鱼或物体，以及每个“捕获”关联多少分。\n*   循环记录用户钓鱼分的总和。\n\
  *   当退出循环时，显示钓鱼分的总数。\n\n# 19. 患者费用项目\n\n编写一个计算患者账单的程序。程序应：\n\n*   询问用户住院天数。\n* \
  \  询问每日费率。\n*   询问检查项目数量。\n*   询问用户每项检查的费用。\n*   计算总费用。\n*   计算折扣 10% 后的费用。\n* \
  \  显示最终账单。\n\n# 第 8 章 数组与向量\n\n## 8.1 数组存储多个值\n\n## 概念\n\n数组允许你存储和处理多个相同类型的值。你到目前为止使用的变量设计上只能包含一个值。图\
  \ 8-1 中的每个变量定义只预留了存储一个指定类型的内存。\n\n### 变量一次只能持有一个值\n\n![图表显示了变量、值以及每个变量对应的注释。](img/FG08_001.png)\n\
  \n数组就像一个存储一组相同值的变量。这些值存储在连续的内存位置中。这是一个整数数组的定义：\n\n```\nint hours[6];\n```\n\n该数组的名称是\
  \ `hours`。括号内的数字是数组的*大小声明符*。它指示数组可以包含的*元素*（或值）的数量。`hours` 数组可以存储六个元素，每个元素都是整数。\n\
  \n\n\n\n\n```cpp\n float temperature[100];         // 100 个 float 的数组\nchar letter[26];\
  \                 // 26 个字符的数组\ndouble size[1200];               // 1200 个 double\
  \ 的数组\nstring name[10];                 // 10 个 string 对象的数组\n```\n\n# 数组的内存需求\n\
  \n数组使用的内存量取决于数组的数据类型和元素数量。此处定义的 `age` 数组是一个包含六个 `short` `int` 值的数组。\n\n```cpp\n\
  \ short age[6];\n```\n\n在典型的 PC 上，一个 `short` `int` 使用 2 字节内存，因此 `age` 数组将占用 12 字节。这在图\
  \ 8-3 中所示。\n\n# 图 8-3 数组内存使用\n\n![一个内存存储显示一个被分为 6 个等大矩形，每个矩形内部都有一个分区。大矩形旁的注释写道“每个\
  \ age 数组元素使用 2 字节。”这 6 个矩形标记为“Element 0”到“Element 5”。](img/FG_08_003.png)\n\n数组的大小可以通过存储单个元素所需的字节数乘以数组中的元素数量来计算。表\
  \ 8-1 显示了典型系统上各种数组的大小。\n\n# 表 8-1 示例数组及其大小\n\n| 数组声明 | 元素数量 | 每个元素的大小 | 数组的大小 |\n\
  | --- | --- | --- | --- |\n| `char letter[26];` | 26 | 1 字节 | 26 字节 |\n| `short\
  \ ring[100];` | 100 | 2 字节 | 200 字节 |\n| `int mile[84];` | 84 | 4 字节 | 336 字节 |\n\
  | `float temp[12];` | 12 | 4 字节 | 48 字节 |\n| `double distance[1000];` | 1000 | 8\
  \ 字节 | 8,000 字节 |\n\n# 8.2 访问数组元素\n\n## 概念\n\n数组的每个元素被分配了唯一的下标。这些下标被用于访问元素。\n\n\
  尽管整个数组只有一个名称，但可以作为单独变量访问和使用元素。这是可能的因为每个元素都被分配了一个名为 `subscript`（下标）的数字。下标用作索引来准确定数组中的特定元素。第一个元素分配下标\
  \ 0，第二个元素分配下标 1，依此类推。我们在上一节中定义的 `hours` 数组中的六个元素将具有下标 0 到 5。这在图 8-4 中所示。\n\n# 图\
  \ 8-4 数组下标\n\n![一个内存存储显示一个被分为 6 个等大矩形。箭头指向 6 个矩形中的每一个，并被标记为 0 到 5。](img/FG_08_004.png)\n\
  \n## 注意事项\n\nC++ 中的下标编号始终从零开始。数组中最后一个元素的下标比数组元素总数少一。这意味着在图 8-4 所示的数组中，不存在 `hours[6]`\
  \ 元素。数组中的最后一个元素是 `hours[5]`。\n\n`hours` 数组中的每个元素通过其下标访问时，都可以作为 `int` 变量使用。这里有一个在数组第一个元素中存储数字\
  \ 20 的语句示例：\n\n```cpp\n hours[0] = 20;\n```\n\n## 注意事项\n\n表达式 `hours[0]` 的读法是“hours\
  \ sub zero”。你可以将这条赋值语句读作“hours sub zero is assigned twenty”。\n\n图 8-5 显示了语句将 20\
  \ 赋值给 `hours[0]` 后 `hours` 数组的内容。\n\n# 图 8-5 hours 数组的内容\n\n![一个内存存储显示 hours 数组。6\
  \ 个矩形标记为“hours [0]”到“hours [5]”。“hours [0]”矩形显示数字 20，其他矩形显示问号。](images/FG_08_005.png)\n\
  \n## 注意事项\n\n由于没有给数组的其他元素赋值，因此使用问号表示这些元素的内容未知。如果全局定义了一个数值数组，其所有元素默认初始化为零。然而，局部数组没有默认值。以下语句在\
  \ `hours[3]` 中存储了整数 30。\n\n```cpp\n hours[3] = 30;\n```\n\n图 8-6 显示了语句执行后的数组内容。\n\
  \n# 图 8-6 更新后的 hours 数组\n\n![一个内存存储显示更新后的 hours 数组。“hours [0]”矩形显示数字 20，“hours [3]”矩形显示\
  \ 30，其他矩形显示问号。](images/FG_08_006.png)\n\n## 注意事项\n\n理解数组大小声明符和下标之间的区别非常重要。数组定义括号内的数字是大小声明符，它指定数组包含多少元素。赋值语句或任何处理数组内容的语句括号内的数字是下标，它指定访问哪个元素。数组元素可以像变量一样通过赋值语句接收值。然而，整个数组不能一次接收值。假设定义了以下数组：\n\
  \n```cpp\n int doctorA[5];     // 存储医生 A 每天看的病人人数\n int doctorB[5];     // 存储医生\
  \ B 每天看的病人人数\n```\n\n以下都是法的赋值语句：\n\n```cpp\n doctorA[0] = 31;           // doctorA[0]\
  \ 现在持有 31。\n doctorA[1] = 40;           // doctorA[1] 现在持有 40。\n doctorA[2] = doctorA[0];\
  \   // doctorA[2] 也持有 31。\n doctorB[0] = doctorA[1];   // doctorB[0] 现在持有 40。\n\
  ```\n\n然而，以下语句是非法的：\n\n```cpp\n doctorA = 15;              // 非法！整个数组不能赋值。这必须通过下标逐个元素地进行。\n\
  ```\n\n# 8.3 输入和显示数组数据\n\n数组元素也可以像普通变量一样使用 `cin` 对象读取信息并使用 `cout` 对象显示值，只要是逐个元素进行的。程序\
  \ 8-1 显示了上一节讨论的 `hours` 数组用于存储和显示值。\n\n图 8-7 显示了 `hours` 数组的内容，其值为用户在程序 8-1 示例输出中输入的值。\n\
  \n# 图 8-7 程序 8-1 填充的 hours 数组\n\n![一个内存存储显示 hours 数组的内容。矩形分别为“hours[0]”、“hours[1]”、“hours[2]”、“hours[3]”、“hours[4]”和“hours[5]”显示数字\
  \ 20, 12, 40, 30, 30 和 15。(images/FG_08_007.png)\n\n尽管大多数 C++ 编译器要求数组定义的大小声明符为常量或字面量，但下标数字可以存储在变量中。这使得使用循环来“遍历”整个数组并对每个元素执行相同操作成为可能。例如，程序\
  \ 8-1 可以通过两个循环来简化：一个用于将值输入数组，另一个用于显示数组的内容。这在程序 8-2 中所示。\n\n\n\n\n让我们仔细观察一下[程序 8-2]。在第\
  \ 9 行，`hours` 数组使用命名常量 `NUM_EMPLOYEES` 作为大小声明符。这创建了一个包含六个元素的 `hours` 数组，即从 `hours[0]`\
  \ 到 `hours[5]`。在第 13 到 18 行中，使用一个 `for` 循环向每个数组位置输入一个值。注意，循环控制变量 `count` 也被用作 `hours`\
  \ 数组的下标。循环每次迭代，`count` 都会有一个不同的值，从而访问不同的数组元素。\n\n由于 `for` 循环将 `count` 初始化为 0，因此在循环第一次迭代时，用户输入的值被读入\
  \ `hours[0]`。循环下次迭代时，`count` 等于 1，因此此时用户输入的值被读入 `hours[1]`。以此此类推，直到最后一次迭代时，`count`\
  \ 等于 5，最后一个用户输入的值被读入 `hours[5]`。`for` 循环的测试条件编写方式使得，当 `count` 达到等于 6 的 `NUM_EMPLOYEES`\
  \ 时，循环将停止。\n\n程序的第二个 `for` 循环出现在第 23 和 24 行。它的工作方式类似，不同在于这个循环使用 `cout` 来显示每个数组元素的值，而不是使用\
  \ `cin` 将值读入每个数组元素。在第 23 行，`count` 变量被重新初始化为 0，因此循环第一次迭代时，会显示 `hours[0]` 中存储的值。循环下次迭代时，`count`\
  \ 等于 1，因此此时显示 `hours[1]` 中存储的值。以此此类推，直到最后一次迭代时，`count` 等于 5，并显示 `hours[5]` 中存储的值。\n\
  \n# 将数组内容写入文件\n\n将数组的内容写入文件也是一件简单的事情。首先，打开一个由 `ofstream` 对象指向的输出文件，这正如你在第 5 章中学会的那样。然后，简单地使用一个循环遍历数组的每个元素，并将输出重定向到文件而不是计算机屏幕。\n\
  \n# C++ 中没有边界检查\n\n从历史角度来看，C++ 受到欢迎的原因之一是它赋予了程序员操作计算机内存的自由。然而，这意味着其他语言提供的许多防止程序不安全访问内存的保护机制在\
  \ C++ 中是缺失的。例如，C++ 不执行数组边界检查。这意味着你可以编写一个无意中允许数组下标超出其边界的程序。这就是为什么 [程序 8-3] 的第 23\
  \ 行测试了循环控制变量的值，以确保它小于数组大小 `NUM_EMPLOYEES`，然后允许循环继续迭代并读入值。如果程序尝试从一个包含项多于数组能容纳数量的文件文件中读取所有项，可能会导致严重问题。具体发生了什么取决于你的系统如何管理内存。在许多系统上，这会导致相邻的其他变量的内容被被覆盖，从而丢失其正确的值。在某些系统上，这甚至可能导致计算机崩溃。\n\
  \n[程序 8-4] 展示了当数组下标越界时，作者的计算机上会发生什么。它显示了存储在一个数组中的数据会覆盖另一个数组中的数据。它还在第 10 行显示了在定义数组时如何用数据初始化数组。这种技术在接下来的章节中将进一步讨论。\n\
  \n让我们更仔细地观察发生的情况。注意数组 `A` 初始值为 1, 1, 1，但最终变成了 5, 5, 5。这种发生是因为程序第 21 和 22 行的循环将值\
  \ 5 存储了七个数组 `B` 元素中，尽管数组 `B` 分配的内存只足够存储三个值。其余的值存储在了不属于 `B` 的相邻内存位置。在这种情况下，某些值属于\
  \ `A`，因此其内容被覆盖并破坏了。[如图 8-8 所示]。\n\n# 图 8-8 在数组边界之外存储\n\n![一个图显示了内存存储矩形。](img/FG_08_008.png)\n\
  \n你可以看出为什么在每次给数组元素赋值时，确保值在数组边界内写入是重要的。\n\n# 注意差一错误\n\n在处理数组时，一种常见的错误是差一错误。这是一个很容易犯的错误，因为数组下标是从\
  \ 0 而不是 1 开始。例如，看下面的代码：\n\n```\n 这段代码有一个差一错误\nconst int SIZE = 100;\nint numbers[SIZE];\n\
  for (int count = 1; count <= SIZE; count++)\n    numbers[count] = 0;\n```\n\n这段代码的意图是创建一个包含\
  \ 100 个元素的整数数组，并在每个元素中存储 0。然而，这段代码有一个差一错误。循环使用它的计数器 `count` 作为 `numbers` 数组的下标。在循环执行期间，变量\
  \ `count` 取值从 1 到 100，而它应该是 0 到 99。结果是，下标为 0 的第一个元素被跳过了。此外，循环在最后一次迭代时尝试使用 100 作为下标。因为\
  \ 100 是无效下标，程序将向数组之外写入数据。\n\n## 检查点\n\n8.1 定义以下数组：\n\n    1.  `empNum`，一个包含 100\
  \ 个 `int` 的数组\n\n    2.  `payRate`，一个包含 25 个 `double` 元素的数组\n\n    3.  `lightYears`，一个包含\
  \ 14 个 `long` 元素的数组\n\n    4.  `stateCapital`，一个包含 50 个 `string` 对象的数组\n\n\n\n5.\
  \ `age`，一个包含 8 个元素的整数数组，初始化值为 `9, 14, 15, 17, 18, 19, 21 和 23`\n6. `deptCode`，一个包含\
