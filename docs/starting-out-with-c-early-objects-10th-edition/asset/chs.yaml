  \ (DVR)。程序使用一个省略了 `break` 的 `switch` 语句来打印所选型号的特征。\n\n## 4.13 枚举类型\n\n## Concept\n\
  \n枚举数据类型在 C++ 中是一种程序员定义的类型，其合法值是一组命名的常量。\n\n到目前为止，我们使用的是 C++ 语言内置的数据类型，如 `int` 和\
  \ `double`，以及由 C++ 类提供的类型，如 `string`。然而，C++ 也允许程序员创建自己的类型。*枚举数据类型*是一种程序员定义的类型，其唯一的合法值与一组命名的常量相关。它之所以被称为枚举类型，是因为这些命名的常量在类型定义中被枚举（或列出）。这里有一个枚举类型的声明示例：\n\
  \n``` enum Roster { Tom, Sharon, Bill, Teresa, John };\n```\n\n这创建了一个名为 `Roster`\
  \ 的类型。因为 `enum` 是 C++ 的关键字，所以必须是小写。然而，注意数据类型名称本身是以大写字母开头的。虽然这不是要求的，但大多数程序员都会大写它。与\
  \ `Roster` 数据类型相关的命名整数常量被称为*枚举器*。`Roster` 类型变量只能具有这些枚举器相关的值之一。但它们的值是多少呢？默认情况下，编译器将第一个枚举器设置为\
  \ 0，下一个设置为 1，以此类推。在我们的示例中，`Tom` 的值为 0，`Sharon` 的值为 1，依此类推。最后的枚举器 `John` 将具有值 4。在本节的后半部分，你将学习如何在需要时为这些命名的常量关联不同的值。\n\
  \n\n\n\n\n重要的是意识到，`enum` 语句实际上并没有创建任何变量。它只是定义了数据类型。它告诉我们，当我们以后创建这种数据类型的变量时，它们的样子将会是这样——整数，其值限于枚举集合集中与符号名称相关的整数。下面的语句显示了如何定义一个\
  \ `Roster` 数据类型的变量。\n\n```\n Roster student;\n```\n\n该语句的格式与其他任何变量定义都一样：首先是数据类型名称，然后是变量名称。注意数据类型名称是\
  \ `Roster`，而不是 `enum Roster`。\n\n现在 `student` 变量已经创建，可以给它赋值，如下所示：\n\n```\n student\
  \ = Sharon;\n```\n\n然后可以像这样测试变量的值：\n\n```\n if (student == Sharon)\n```\n\n注意在这两个示例中，`Sharon`\
  \ 周围没有引号，因为它是一个命名常量，而不是字符串字面量。\n\n尽管枚举数据类型中的值实际上是以整数形式存储的，但你并不总是能用整数值代替符号名称。例如，我们不能像这样将\
  \ `Sharon` 赋值为 `student` 值：\n\n```\n student = 1;   // Error!\n```\n\n然而，你可以使用整数值而不是符号名称来测试枚举变量。例如，因为\
  \ `Bill` 被存储为 2，所以下面的两个 `if` 语句是等等的。\n\n```\n if (student == Bill)\nif (student\
  \ == 2)\n```\n\n你还可以使用关系运算符来比较两个枚举变量。例如，下面的 `if` 语句判断 `student1` 中存储的值是否小于 `student2`\
  \ 中存储的值：\n\n```\n if (student1 < student2)\n```\n\n如果 `student1` 等于 `Bill`（存储为 2），且\
  \ `student2` 等于 `John`（存储为 4），则该语句为真。然而，如果 `student1` 等于 `Bill` 且 `student2` 等于\
  \ `Sharon`（存储为 1），该语句将为假。\n\n如前面提到的，枚举列表中的符号默认被分配整数值 0、1、2 等。如果这不符合要求，你可以指定要分配的值，如接下来的示例所示。\n\
  \n```\nenum Department { factory = 1, sales = 2, warehouse = 4 };\n```\n\n记住，如果你确实为枚举符号分配了值，它们必须是整数。下面的值赋值将产生错误。\n\
  \n```\n enum Department { factory = 1.0, sales = 2.0, warehouse = 4.0 };\n     \
  \                                                     // Error!\n```\n\n虽然没有要求分配的整数值必须按升序排列，但通常认为这样做是一个好主意。\n\
  \n如果你省略了一个或多个符号的赋值赋值，它们将被分配默认值，如下面的两个示例所示。\n\n```\n enum Colors { red, orange, yellow\
  \ = 9, green, blue };\n```\n\n在这个示例中，命名常量 `red` 将被分配值 0，`orange` 将为 1，`yellow` 将为\
  \ 9，`green` 将为 10，`blue` 将为 11。\n\n```\n enum Rooms { livingroom = 1, den, bedroom,\
  \ kitchen };\n```\n\n在这个示例中，`livingroom` 将被分配值 1，`den` 将为 2，`bedroom` 将为 3，而 `kitchen`\
  \ 将为 4。\n\n枚举数据类型的一个目的是，符号名称有助于使程序具有自文档性。然而，因为这些名称不是字符串，它们仅供程序内部使用。使用本节开头定义的 `Roster`\
  \ 数据类型，接下来的两个语句将输出 `2`，而不是名称 `Sharon`。\n\n```\n Roster topStudent = Sharon;\ncout\
  \ << topStudent;\n```\n\n由于枚举数据类型的符号名称与整数值相关，它们可以用于 `switch` 语句中，如程序 4-28 所示。该程序还演示了可以在不实际创建该类型变量的情况下使用枚举数据类型。\n\
  \n你将在后面的章节中学习更多关于处理枚举数据类型的知识。\n\n## Checkpoint\n\n1. 4.42 找出以下声明中的所有错误之处。\n\n  \
  \ ```\n     Enum Pet = { \"dog\", \"cat\", \"bird\", \"fish\" }\n   ```\n\n2. 4.43\
  \ 按照指示完成以下程序段。\n\n   ```\n     enum Paint { red, blue, yellow, green, orange, purple\
  \ };\n   Paint color = green;\n\n   // 写一个 if/else 语句，如果 color 是 red、blue 或 yellow，\n\
  \   // 则打印 \"primary color\"，否则打印\n   // \"mixed color\"。if 测试应使用关系 \n   // 表达式。\n\
  \   ```\n\n## 4.14 重点关注测试与调试：验证输出结果\n\n## 概念\n\n在测试新创建或修改的程序时，必须对它产生的输出进行仔细检查，以确保其正确。\n\
  \n一旦正在开发的程序经过设计、用编程语言编写并发现可以编译和链接，就很容易得出它可以工作的结论。如果程序在运行过程中没有错误并产生了“合理”的输出，这种结论尤其为成立。然而，仅仅因为程序运行并产生了输出并不意味着它是正确的。它可能仍然包含导致输出不正确的逻辑错误。为了确定程序是否实际上正常工作，必须使用可以预测输出的数据进行测试，并检查输出以确保其准确性。程序\
  \ 4-29 运行并产生了最初看起来合理的输出。然而，它包含一个导致产生错误错误的 bug。乍一看，程序可能运行正常。成人的每人费用是 $8.25，所以如果有\
  \ 100 名成人客人，价格将是 $825。但有 69 名客人，其中 4 名是儿童，使得成本大约为三分之二。$571.20 听起来“差不多”。\n\n然而，“差不多”并不是准确性的足够测试。如果程序使用可以进一步检查输出的数据运行，程序员将很快发现存在错误。以下是使用精心挑选的样本数据再次运行同一程序的输出。\n\
  \n# 使用不同示例输入的输出\n\n```\n 此程序计算自助午餐的总费用。\n输入成人人数（12 岁及以上）：1[Enter]\n 输入儿童人数（2-11\
  \ 岁）：0[Enter]\n\n午餐总费用为 $8.00\n```\n\n# 使用同样不同的示例输入的输出\n\n```\n 此程序计算自助午餐的总费用。\n\
  输入成人人数（12 岁及以上）：0[Enter]\n 输入儿童人数（2-11 岁）：1[Enter]\n\n午餐总费用为 $4.80\n```\n\n从输出输出我们可以看到，儿童餐的费用被正确计算为成人餐费的\
  \ 60%，但成人餐费是错误的。对于一名成人，得结果是 $8.00，而本应为 $8.25。\n\n\n\n\n\n为了找到问题，程序员应该确定哪些代码行可能导致了问题。最可能的问题出现在：第\
  \ 10 行 `ADULT_MEAL_COST` 的初始化或存储中；第 14、16、27 和 29 行 `adultMealTotal` 或 `totalMealCost`\
  \ 的计算或存储中；或者第 33 行 `totalMealCost` 的打印中。由于单份成人午餐的费用错误地显示为整数金额（尽管它被格式化为浮点数显示），需要检查的内容之一是：所有需要存储浮点值的变量是否都定义为\
