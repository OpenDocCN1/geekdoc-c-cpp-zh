  ```\n\n# 第 9 章\n\n## 9.1\n\n线性搜索算法简单的使用循环遍历数组的每个元素，将每个元素的值与要查找的值进行比较。二分搜索算法要求数组中的值是有序的，它从数组的中间元素开始搜索。如果中间元素的值大于要查找的值，算法接下来将测试前半部分的中间元素。如果中间元素的值小于要查找的值，算法接下来将测试后半部分的中间元素。每当数组测试一个数组元素且未找到要查找的值时，它就会排除数组剩余部分的一半。这种方法会持续下去，直到找到该值，或者没有更多元素可以测试。二分搜索比线性搜索更高效。\n\
  \n\n\n\n\n## 9.2 升序排序意味着将数据值从小到大排列。降序排序意味着将数据值从大到小排列。\n\n## 9.3 数值必须按升序或降序排列。\n\n\
