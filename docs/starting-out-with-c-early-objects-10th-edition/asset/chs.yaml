  注意，负数的最高位始终被设置为 1，而正数或零的最高位始终被设置为 0。\n\n# 位运算运算符\n\nC++ 提供了各种运算符，允许你对整数值的每个单独位执行逻辑操作，并将位向右或向左平移。\n\
  \n# 位取反运算符\n\n位取反运算符是 `~` 符号。它是一个一元运算符，对字段中的每个位执行取反操作或反码操作。表达式\n\n```\n~val\n```\n\
