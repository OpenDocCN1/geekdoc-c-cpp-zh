  \ 1 到 20 之间的整数作为班人数，然后循环读取相应数量的名字。当所有名字读取完毕后，程序应该报告哪个学生将在队首，以及哪个学生将在队末尾。你可以假设没有两个学生的名字相同。\n\
  \n### 16. 通货胀率\n\n年度通货胀率是货币贬值的速率。例如，如果年度通货胀率为 3.0%，那么一年后，购买今天花费 $1,000 即可购买的商品需要\
  \ $1,030。换句话说，一年后的 $1,000 只能买到价值 1/1.03 * $1,000 或 $970.87 的商品。两年后，$1,000 只能买到 $970.87\
  \ 的 1/1.03，即 $942.59 的商品。编写一个程序，允许用户输入一个 1% 到 10% 之间的年度通货胀率，然后显示一个表格，今天的 $1,000\
  \ 在未来 10 年内每年的价值。\n\n### 17. 人口数量\n\n编写一个预测生物人口数量的程序。该程序应该询问用户初始生物数量、平均每日人口增长（占当前人口的百分比）以及它们繁殖的天数。使用循环来显示每一每天的人口数量。\n\
