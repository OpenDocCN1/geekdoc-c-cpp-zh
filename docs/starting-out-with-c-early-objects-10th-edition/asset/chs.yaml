  \n### 15. 驾照考试\n\n州交通管理局（DMV）要求你编写一个程序，为驾照考试的笔试部分评分，该考试包含 20 道单选题。以下是正确答案：\n\n$$\\\
  boxed{\\begin{array}{rrrrr} {1.\\text{B}} & {5.\\text{C}} & {9.\\text{C}} & {13.\\\
  text{D}} & {17.\\text{C}} \\\\ {2.\\text{D}} & {6.\\text{A}} & {10.\\text{D}} &\
  \ {14.\\text{A}} & {18.\\text{B}} \\\\ {3.\\text{A}} & {7.\\text{B}} & {11.\\text{B}}\
  \ & {15.\\text{D}} & {19.\\text{D}} \\\\ {4.\\text{A}} & {8.\\text{A}} & {12.\\\
  text{C}} & {16.\\text{C}} & {20.\\text{A}} \\end{array}}$$\n\n为了实现这一点，你应该创建一个 `TestGrader`\
  \ 类。该类将有一个包含 20 个字符的 `answers` 数组，用于存储正确测试答案。它有两个公共成员函数，允许用户程序与类进行交互：`setKey` 和\
  \ `grade`。`setKey` 函数接收一个包含正确答案的 20 个字符字符串，并将这些信息复制到 `answers` 数组中。`grade` 函数接收一个包含受试者答案的\
  \ 20 个字符数组，并将其每个答案与正确答案进行比较。申请人必须正确回答 15 个或更多问题才能通过考试。在“评分”考试后，`grade` 函数应该创建并向用户返回一个包含以下信息的字符串：\n\
  \n*   一条指示申请人通过或未通过考试的消息\n*   正确答案的数量和错误答案的数量\n*   所有回答错误题目的题号列表\n\n创建并使用 `TestGrader`\
  \ 对象的客户端程序首先应调用一次 `setKey`，传递一个包含 20 个正确答案的字符串。一旦完成，它就应该允许输入受试者的 20 个答案，确保只接受 A–D\
  \ 之间的答案，并将它们存储在一个包含 20 个字符的数组中。然后，它应该调用 `grade` 函数对考试进行评分，并显示函数返回的字符串。程序应该循环运行以允许输入额外的测试。\n\
