  \n# 17.7 函数对象与 Lambda 表达式简介\n\n## 概念\n\n函数对象（function object）是一个重载了函数调用运算符的类对象。函数对象的行为就像函数一样，可以作为参数传递给其他函数。Lambda\
  \ 表达式是创建函数对象的方便方法。\n\n`function object` 也称为 `functor`（仿函数），是一个行为像函数的对象。函数对象可以像函数一样被调用。它们接受参数。要创建一个函数对象，你需要编写一个重载了\
  \ `()` 的类。让我们来看一个简单的 `Sum` 类示例。\n\n# `Sum` 内容\n\n```cpp\n#ifndef SUM_H\n#define\
  \ SUM_H\n\nclass Sum\n{\npublic:\n    int operator()(int a, int b) { return a +\
  \ b; }\n};\n#endif\n```\n\n`Sum` 类有一个成员函数 `operator()`。该 `operator()` 有两个参数 `a`\
  \ 和 `b`。在 `Sum` 类中，`operator()` 返回 `a` 和 `b` 的和。程序 17-30 演示了如何使用该函数。让我们仔细查看 程序 17-31：\n\
  \n* 第 8 到 10 行定义了三个 `int` 变量：`x`、`y` 和 `z`。\n\n* 第 13 行创建了 `Sum` 类的实例。该对象名为 `sum`。\n\
  \n* 第 16 行像调用函数一样调用了 `sum` 对象。\n\n* 第 19 行显示了变量 `z`。\n\n在之前的算法章节中，你看到了接受函数指针的 STL\
  \ 模板。如果你愿意，可以传递一个函数对象。`count_if` 函数遍历一个范围，并将每个元素作为参数。你提供的函数必须接受一个参数，并返回 `true` 或\
  \ `false`。`count_if` 函数返回返回 `true` 的元素个数。\n\n# `IsEven` 内容\n\n```cpp\n#ifndef IS_EVEN_H\n\
  #define IS_EVEN_H\n\nclass IsEven\n{\npublic:\n    bool operator()(int x) { return\
  \ x % 2 == 0; }\n};\n#endif\n```\n\n`IsEven` 类有一个成员函数 `operator()`。该 `operator()`\
  \ 有一个 `int` 参数 `x`。如果 `x` 是偶数，该函数返回 `true`，否则返回 `false`。程序 17-32 创建了 `IsEven` 类的实例，并将其作为函数对象用于\
  \ `count_if` 函数。\n\n# 构建匿名函数对象\n\n在程序 17-32 的第 13 行中，我们创建了 `IsEven` 类的实例，并将其命名为\
  \ `isNumberEven`。然后，在第 16 行我们将该对象传递给 `count_if()` 函数。然而，函数对象可以在创建时直接被调用，而无需赋予名称。例如，以下代码创建了一个\
  \ `IsEven` 函数对象并用参数 2 调用了它，而从没有给该函数对象命名：\n\n```cpp\nif (IsEven()(2))\n   cout <<\
  \ \"The number is even.\\n\";\nelse\n   cout << \"The number is not even.\\n\";\n\
  ```\n\n\n\n\n在没有赋予名称的情况下创建并使用的对象被称为 `anonymous`（匿名的）。在段代码段中，`IsEven()` 是匿名函数对象，而\
  \ `IsEven()(2)` 是调用该函数对象并传递参数 2 的表达式。\n\n程序 17-35 与 程序 17-34 类似，不同之处 `IsEven` 类的匿名实例被传递给了\
  \ `count_if()` 函数。\n\n# 谓词术语\n\n返回布尔值的函数或函数对象被称为 `predicate`（谓词）。只接受一个参数的谓词被称为 `unary\
  \ predicate`（一元谓词）。（之前显示的 `IsEven` 类的实例就是一个一元谓词。）接受两个参数的谓词被称为 `binary predicate`（二元谓词）。熟悉这些术语非常重要，因为它们出现在大量的\
  \ C++ 文档和文献中。\n\n# Lambda 表达式\n\n`lambda expression`（lambda 表达式）是一种创建函数对象的紧凑方式，而无需编写类声明。它是一个仅包含对象\
  \ `operator()` 成员函数逻辑的表达式。当编译器遇到 lambda 表达式时，它可以使用你在 lambda 表达式中提供的 `operator()`\
  \ 成员函数代码自动在内存中生成一个函数对象。\n\n通常，lambda 表达式采用以下通用格式：\n\n```\n[](parameter list) { \
  \ function body  }\n```\n\n表达式开头的 `[]` 被称为 `lambda introducer`（lambda 引导符）。它标记了\
  \ lambda 表达式的开始。`parameter list` 是函数对象 `operator()` 成员函数的参数声明列表，而 `function body`\
  \ 是应该作为对象 `operator()` 成员函数体的代码。\n\n例如，计算两个整数之和的函数对象的 lambda 表达式为：\n\n```\n[](int\
  \ a, int b) { return x + y; }\n```\n\n以及，判断整数是否为偶数的函数对象的 lambda 表达式为：\n\n```\n[](int\
  \ x) { return x % 2 == 0;}\n```\n\n另一个例子，接收整数作为输入并打印该整数的 lambda 表达式编写如下：\n\n```\n\
  [](int a) { cout << a * a << \" \"; }\n```\n\n### 注意\n\n可选地，lambda 表达式括号 `[]` 内部可以出现\
  \ `capture list`（捕捉列表）。捕捉列表是 lambda 表达式周围作用域内的变量列表，这些变量可以在 lambda 函数体中访问。\n\n调用\
  \ lambda 表达式时，你在表达式紧后写出一个括在圆括号中的参数列表。例如，以下代码段显示了 7，它是变量 `x` 和 `y` 之和。\n\n```\nint\
  \ x = 2;\nint y = 5;\ncout << [](int a, int b) {return a + b;}(x, y) << endl;\n\
  ```\n\n以下代码段以 程序 17-35 的方式计算 `vector` 中的偶数。然而，它使用 lambda 表达式代替了 `IsEven()` 函数对象作为\
  \ `count_if()` 函数的第三个参数。\n\n```cpp\n// 创建一个整型 vector。\nvector<int> v = { 1, 2, 3,\
  \ 4, 5, 6, 7, 8 };\n\n// 获取偶数的数量。\nint evenNums = count_if(v.begin(), v.end(), [](int\
  \ x) {return x % 2 == 0;});\n\n// 显示结果。\ncout << \"The vector contains \" << evenNums\
  \ << \" even numbers.\\n\";\n```\n\n由于 lambda 表达式会生成函数对象，你可以将 lambda 表达式赋值给相应类型的变量，然后通过变量名调用它。例如，以下代码所示的\
  \ lambda 表达式为我们提供了一个两个两个整数的函数对象。该函数对象被赋值给名为 `sum` 的变量：\n\n```cpp\nauto sum = [](int\
  \ a, int b) {return a + b;};\n```\n\n一旦语句执行，我们就可以使用 `sum` 变量调用该函数对象，如下：\n\n```cpp\n\
  int x = 2;\nint y = 5;\nint z = sum(x, y);\n```\n\n在此代码执行后，变量 `z` 将赋值为 7。程序 17-36\
  \ 显示了另一个例子。它与 程序 17-35 类似。不同之处在于使用 lambda 表达式代替了 `IsEven()` 函数对象作为 `count_if()`\
  \ 函数的第三个参数。\n\n# STL 中的函数类\n\n函数对象非常有用，C++ 标准库定义了许多你可以用来实例化的类。为了使用这些类，你需要 `#include`\
  \ `<functional>` 头文件。17-35 列出了这些。\n\n# 17-14 函数类\n\n| 函数类 | 说明 |\n| --- | --- |\n\
  | `less<T>` | `less<T>(a, b)` 如果 `a < b` 为真 |\n| `greater<T>` | `greater<T>(a, b)`\
  \ 如果 `a > b` 为真 |\n| `less_equal<T>` | `less_equal<T>(a, b)` 如果 `a <= b` 为真 |\n\
  | `greater_equal<T>` | `greater_equal<T>(a, b)` 如果 `a >= b` 为真 |\n\n例如，STL `sort`\
  \ 函数通常按升序对范围排序。但如果你想使用比较函数进行排序呢？你可以传递 `greater<T>` 类实例作为比较函数。程序 17-37 展示了如何对 `vector`\
  \ 进行降序排序。\n\n## 检查点\n\n1. 17.43 什么是函数对象？\n2. 17.44 在类用于创建函数对象之前，必须重载哪个运算符？\n3. 17.45\
