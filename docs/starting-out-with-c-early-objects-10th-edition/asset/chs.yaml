  **示例：**\n\n```cpp\na = sin(m);\n```\n\n### `sqrt(m)`\n**头文件：** `cmath`\n**描述：**\
  \ 接受一个 `double` 参数。以 `double` 类型返回参数的平方根。\n**示例：**\n\n```cpp\na = sqrt(m);\n```\n\
