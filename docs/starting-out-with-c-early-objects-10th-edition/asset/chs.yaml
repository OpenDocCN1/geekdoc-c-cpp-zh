  \ 1、2 或 3 的数字，则打印错误信息。\n\n## 4.6 嵌套 `if` 语句\n\n为了测试多个条件，可以将一个 `if` 语句嵌套在另一个语句中。可以将一个\
  \ `if` 语句或 `if/else` 语句放在另一个内部。这种结构被称为嵌套 `if`，允许你测试多个条件以确定执行哪个代码块。例如，考虑一个判断银行客户是否符合贷款特殊利率的程序。要符合条件，必须满足两个条件：\n\
  \n1. 客户目前有工作。\n2. 客户最近大学毕业（两年内）。\n\n图 4-7 显示了此类程序的算法流程图。\n\n如果我们遵循该图的执行流，可以看到首先测试了表达式\
  \ `employed == 'Y'`。如果该表达式为假，则不需要进行其他测试。我们知道客户不符合特殊利率。然而，如果表达式为真，我们需要测试第二个条件。这是通过一个嵌套决策结构测试表达式\
  \ `recentGrad == 'Y'` 完成的。如果该表达式也为真，那么客户符合特殊利率。如果这个第二个表达式为假，客户则不符合。程序 4-11 显示了与流程图逻辑对应的代码。它在另一个语句内部嵌套了一个\
  \ `if/else` 语句。\n\n\n\n\n让我们仔细观察这个程序。从第 21 行开始的 `if` 语句测试表达式 `employed == 'Y'`。如果表达式为真，则执行从第\
  \ 23 行开始的内部 `if` 语句。然而，如果外部表达式为假，程序将跳转到第 33 行，并执行外部 `else` 块中的语句。\n\n在调试带有嵌套 `if/else`\
  \ 语句的程序时，知道每个 `else` 对应哪个 `if` 语句是非常重要的。将每个 `else` 与相应 `if` 匹配的规则是：`else` 与之前最近且还没有对应\
  \ `else` 的 `if` 语句匹配。当语句有正确的缩进时，这更容易看出。图 4-8 显示了与程序 4-11 中第 21 到 37 行类似的代码。它说明了每个\
  \ `else` 应该如何与其所属的 `if` 对齐。这些视觉提示很重要，因为嵌套的 `if` 语句可能很长且复杂。\n\n# 图 4-8 正的 if/else\
