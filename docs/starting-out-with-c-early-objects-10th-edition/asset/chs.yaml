  \n## 概念\n\n继承应该建模派生类与基类之间的“is −a”关系，而不是“has −a”关系。\n\n\n\n\n\n面向对象语言中的`类继承`（Class\
  \ inheritance）应该用于描述派生类类型是基类类型的一种特殊情况这一事实。实际上，一个类可以被看作是从它所创建的所有对象的`set`（set）。因为派生类是基类的特殊情况，所以对应于派生类的对象集合将是对应于基类的对象集合的子集（subset）。因此，派生类的每个对象也是基类的对象。换句话说，每个派生类对象都是（is\
  \ a）基类对象。\n\n每当一个类包含另一个类的对象作为其成员变量之一时，就发生了`类组合`（Class composition）。组合在第 11 章;\n\
  \      void setLine2(string);\n      string getLine1();\n      string getLine2();\n\
  };\n```\n\n由于一个人的数据包含姓名和街道地址，表示某人数据的恰当类定义将以如下方式使用组合：\n\n```\nclass PersonData\n\
  {\n   private:\n      string name;\n      StreetAddress address;\n   public:\n \
  \     ...\n};\n```\n\n我们留下了 `PersonData` 类声明的其余部分，因为对我们的目的来说不需要它。\n\n可以使用继承而不是组合来定义这个类。例如，我们可以如下定义一个类\
  \ `PersonData1`：\n\n```\nclass PersonData1:public StreetAddress\n{\n   private:\n\
  \      string name;\n   public:\n      ...\n};\n```\n\n虽然这个新定义可以正确编译，但在概念上是错误的做法，因为它将人的数据视为一种特殊的\
  \ `StreetAddress` 类型，而事实并非如此。设计中的这种概念性错误可能导致程序难以理解且难以维护。在可能的情况下，优先使用组合而非继承是一种良好的设计实践。原因之一是，继承通过将基类的受保护（protected）成员暴露给派生类的方法，从而破坏了基类的封装性。\n\
  \n接下来，让我们考虑一个使用继承比组合更有意义的例子。假设我们有一个表示所有狗的类 `Dog`。假设每个 `Dog` 对象都有一个类型为 `double` 的成员变量\
  \ `weight`（重量）和一个成员函数 `void` `bark()`（吠叫），我们可能有如下类：\n\n```\nclass Dog\n{\n   protected:\n\
  \      double weight;\n   public:\n      Dog(double w)\n         { weight = w; }\n\
  \      virtual void bark() const\n         {\n             cout << \"I am dog weighing\
  \ \"\n                  << weight << \" pounds.\" << endl;\n         }\n};\n```\n\
  \n该类还有一个构造函数来允许 `Dog` 对象初始化。注意，我们将 `bark()` 成员函数声明为虚函数（virtual），以便在派生类中对其进行重写。\n\
  \n假设我们需要一个表示所有羊狗（sheep dogs）的类。由于每只羊狗也是狗，因此从 `Dog` 类派生出新的 `SheepDog` 类是有意义的。这样，`SheepDog`\
  \ 对象将继承 `Dog` 类的每个成员。除了具有每只狗的所有特征外，预计羊狗还可以具有其他羊狗特有的特征，例如一个整数成员 `numberSheep`，表示该狗被训练放牧的羊的最大数量。此外，羊狗可能有一种与普通狗不同的吠叫方式，也许是适应于照料羊群。这通过重写\
  \ `Dog` 类的 `bark()` 成员函数来实现。\n\n```\nclass SheepDog : public Dog\n{\nprivate:\n\
  \   int numberSheep;\npublic:\n   SheepDog(double w, int nSheep) : Dog(w)\n   {\n\
  \      numberSheep = nSheep;\n   }\n   virtual void bark() const override\n   {\n\
  \      cout << \"I am a sheepdog weighing \"\n           << weight << \" pounds\
  \ \\n and guarding \"\n           << numberSheep << \" sheep.\" << endl;\n   }\n\
  };\n```\n\n为了演示这个类，我们将建立一个狗的向量（vector），其中一些狗是羊狗。为了规避向量无法持有两种不同类型的限制，我们将使用指向 `Dog`\
  \ 指针的向量。回想第 15.1 节，指向基类（在本例中为 `Dog`）的指针可以指向任何派生类对象（在本例中为 `SheepDog`）。因此，我们可以创建一个指向\
  \ `Dog` 指针的向量，并让其中一些指针指向 `Dog` 对象，而另一些指向 `SheepDog` 对象：\n\n```\nvector<shared_ptr<Dog>>\
  \ kennel\n{\n   make_shared<Dog>(40.5),\n   make_shared<SheepDog>(45.3, 50),\n \
  \  make_shared<Dog>(24.7)\n};\n```\n\n最后，我们可以使用循环调用向量中每个 `Dog` 对象的 `bark()` 函数：\n\
  \n```\nfor (int k = 0; k < kennel.size(); k++)\n   {\n      cout << k+1 << \": \"\
  ;\n      kennel[k]->bark();\n   }\n```\n\n由于多态性，并且 `bark()` 函数被声明为虚函数，循环中的相同代码会对普通狗调用原始\
  \ `bark()` 函数，而对羊狗调用专门的 `bark()` 函数。完整程序见程序 15-7。在这个例子中，继承是比组合更好的选择，因为使用组合等同于说羊狗“拥有”一只狗，而不是说羊狗“是”一只狗。\n\
  \n\n\n\n\n# 理解问题\n\n在第 9 章;\n   virtual  ~Encryption();\n   // 纯虚函数\n   virtual\
