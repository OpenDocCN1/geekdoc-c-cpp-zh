  \ 的第 3 位从 1 变为 0。\n\n# 测试位的值\n\n要测试单个位的值，可以使用 `AND` 运算符。例如，如果我们想测试变量 `bitvar` 以检查第\
  \ 2 位是否开启，我们使用一个第 2 位被开启的掩码。以下是一个测试示例：\n\n```\nif ((bitvar & 4) == 4)\n   cout <<\
  \ \"Bit 2 is on.\\n\";\n```\n\n记住，与掩码进行 `AND` 运算会产生一个值，该值会隐藏除掩码中开启之外的所有位。还要记住，二进制\
  \ 4 表示为 100，只有第 2 位是的。因此，如果 `bitvar` 的第 2 位开启，表达式 `bitvar & 4` 将返回值 4，导致 `if` 测试条件为真，从而显示消息。\n\
  \n`bitvar & 4` 周围的括号是必要的，以确保在进行相等测试之前执行 `AND` 操作，因为 `==` 运算符的优先级高于 `&` 运算符。\n\n\
  # 位左移运算符\n\n按位左移运算符的符号是两个小于号 `<<`。该运算符接受两个操作数。左侧的操作数是要移动的操作数，右侧的操作数是要移动的位数。当位值左移时，右侧空出的位置将用\
  \ 0 填充，移出字段的位将丢失。假设有以下变量：\n\n```\nchar val = 2, shiftval;\n```\n\n以下语句将 `val` 左移\
  \ 2 位后的值存储在 `shiftval` 中。\n\n```\nshiftval = val << 2;\n```\n\n图 M-9 显示了 `val` 中的值在背后发生的情况。\n\
  \n# 图 M-9\n\n![图表显示了两个区域，“移位前”和“移位后”。移位前”的二进制数是 0, 0, 0, 0, 0, 0, 1, 0，“移位后”的二进制数是\
  \ 0, 0, 0, 0, 1, 0, 0, 0。](img/FG_AppM_009.png)\n\n然而，注意 `val` 本身并没有被移动。只有变量 `shiftval`\
  \ 发生了变化。它被设置为 `val` 左移 2 位后的值。如果我们想移动 `val` 本身，我们需要说：\n\n```\nval = val << 2;\n\
  ```\n\n或者，我们可以使用左移运算符的组合赋值版本，如下：\n\n```\nval <<= 2;\n```\n\n将一个数字左移 `n` 位等于将其乘以\
  \ $2^n$。因此，这个例子等同于：\n\n```\nval *= 4;\n```\n\n然而，位移几乎总是运行更快。\n\n# 位右移运算符\n\n按位右移运算符的符号是两个大于号\
  \ `>>`。与左移运算符一样，它接受两个操作数。左侧的操作数是要移动的操作数，右侧的操作数是要移动的位数。当位值右移且变量是有符号的时，左侧空出的位置填充什么取决于机器。它们可以用\
  \ 0 填充，也可以用符号位的值填充。如果变量无符号的，这些位置将用 0 填充。移出字段的位将丢失。假设有以下变量：\n\n```\nchar val = 8,\
  \ shiftval;\n```\n\n以下语句将 `val` 右移 2 位后的值存储在 `shiftval` 中。\n\n```\nshiftval = val\
  \ >> 2;\n```\n\n图 M-10 显示了 `val` 中的值在背后发生的情况。\n\n# 图 M-10\n\n![图表显示了两个区域，“移位前”和“移位后”。移位前”的二进制数是\
  \ 0, 0, 0, 0, 1, 0, 0, 0，“移位后”的二进制数是 0, 0, 0, 0, 1, 0, 0, 0。](img/FG_AppM_009.png)\n\
