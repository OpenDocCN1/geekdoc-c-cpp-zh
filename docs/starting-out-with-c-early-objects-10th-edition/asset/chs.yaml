  \ position.getLatitude();`\n\n2. 7.21 为一个名为 `Circle` 的类编写类声明，该类有一个数据成员 `radius`（`double`\
  \ 类型）以及成员函数 `setRadius` 和 `calcArea`。请以内联的形式编写这些代码。\n\n3. 7.22 为一个名为 `Pizza` 的类编写类声明，该类有数据成员\
