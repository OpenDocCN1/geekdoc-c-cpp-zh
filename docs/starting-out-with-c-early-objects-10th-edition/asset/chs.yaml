  \ const { return advisor; }\n33 };\n34\n35 class Faculty :public Person\n36 {\n\
  37 private:\n38     Discipline department;\n39 public:\n40     // 构造函数\n41     Faculty(const\
  \ string& fname, Discipline d) : Person(fname)\n42     {\n43         department\
  \ = d;\n44     }\n45\n46     void setDepartment(Discipline d) { department = d;\
