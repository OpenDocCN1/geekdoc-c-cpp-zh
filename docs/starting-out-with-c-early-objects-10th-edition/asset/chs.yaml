  \ `=` 运算符。以下是使用大括号符号定义 `value` 变量并将其初始化为 5 的方法：\n\n```\n int value{5};      // 这仅适用于\
  \ C++11 或更高版本。\n```\n\n大多数程序员继续使用赋值运算符来初始化普通变量，正如我们在本书中所做的那样。然而，大括号表示法有一个优势。它会检查你用于初始化变量的值是否与变量的数据类型匹配。例如，假设\
