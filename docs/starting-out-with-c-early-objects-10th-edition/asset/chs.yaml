  \n## 编程挑战\n\n### 1. 每加仑\n\n编写一个计算汽车油耗的程序。该程序应该要求用户输入油箱的容积以及满油后可以行驶的英里数。然后应该计算并显示每加仑英里数。\n\
  \n### 2. 体育馆座位\n\n体育馆有三个座位区域。对于垒球比赛，A 类座位 15 美元，B 类座位 12 美元，C 类座位 9 美元。编写一个程序询问每个类别座位卖出了多少张票，然后显示门票销售收入。将你的金额格式化为固定点表示法，保留两位小数，并确保始终显示小数点。\n\
  \n### 3. 住房成本\n\n编写一个程序，要求用户输入以下住房支出的*每月*费用：\n\n*   房租或房贷\n\n*   电话\n\n*   互联网服务公用事业\n\
  \n*   线电视\n\n程序应该显示这些支出的每月总费用和年度总费用。\n\n### 4. 需要多少保险？\n\n许多财务专家建议房主为其房屋或建筑购买保险至少相当于重建成本的\
  \ 80%。编写一个程序，要求用户输入建筑的重建成本，然后显示该物业应购买的最低保险金额。\n\n\n\n\n编写一个程序来计算棒球球员的击打率。程序应要求用户输入球员的打数次数和获得的安打数。将击打率显示为\
  \ `.000` 到 `1.000` 之间的小数。例如，如果一个球员上场了 40 次，并获得了 10 次安打（占比 25%），他的击打率将是 `.250`。\n\
  \n### 6. 测试平均分\n\n编写一个程序要求输入五个测试成绩。程序应计算平均测试分并显示。显示的数字应以固定点法格式化，保留一位小数。\n\n### 7.\
