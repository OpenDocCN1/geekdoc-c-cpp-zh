  ## 概念\n\n函数可以向调用它的程序部分发送一个值。\n\n你已经看到数据可以通过参数变量传入函数。数据也可以从函数返回到调用它的语句。返回值的函数被称为*有值的函数*。\n\
  \n```\n double x;\nx = pow(4.0, 2.0);\n```\n\n\n\n\n\n虽然可以向函数传递多个参数，但它只能返回一个值。可以将函数想象为拥有多个接收数据（参数）的通信通道，但只有一个发送数据（返回值）的通道。这在图\
