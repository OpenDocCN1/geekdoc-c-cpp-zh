  \ 1 时，它表示负数；当它被设置为 0 时，该数字为正数。然而，这样做的问题在于，对于数字 0，会有两种位模式。全 0 的模式表示正 0，而 1 后面跟全 0\
  \ 的模式表示负 0。正因如此，大多数系统使用补码表示来表示负整数。\n\n要计算一个数的补码，首先必须得到所谓的“反码”（one’s complement）。这意味着将每个\
