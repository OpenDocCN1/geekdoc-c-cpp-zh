  \n# 5.9 决定使用哪种循环\n\n## 概念\n\n虽然大多数重复算法可以使用三种循环中的任何一种来编写，但每种循环在不同的情况下效果最好。\n\nC++\
  \ 的三种循环在特定情况下都是理想的。以下是何时使用每种循环的简要总结。\n\n## `while` 循环\n\n`while` 循环是一种预测试循环。在条件为假时你不希望循环迭代的情况下，它是理想的。例如，验证输入：\n\
  \n```cpp\nwhile (num != 99)\n{   cout << \"Enter an integer, or 99 to quit: \";\n\
  \    cin >> num;\n}\n```\n\n## `do-while` 循环\n\n`do-while` 循环是一种后测试循环。在始终希望循环至少迭代一次的情况下，它是理想的。\n\
  \n```cpp\ncout << \"This program squares any integer.\\n\";\ndo {cout << \"Enter\
  \ an integer: \";\n    cin >> num;\n    cout << num << \" squared is \" << endl;\n\
  } while (\"Do you want to square another? (Y/N) \");\n```\n\n## `for` 循环\n\n`for`\
  \ 循环是一种预测试循环，内置了用于初始化、测试和更新计数器的表达式。在已知确切迭代次数的情况下，它是理想的。\n\n```cpp\ncout << \"This\
  \ program squares the integers from 1 to 8.\\n\";\nfor (num = 1; num <= 8; num++)\n\
  {\n    ---\n}\n```\n\n包含所有类型循环的程序可以在书籍网站的 `loopExamples.cpp` 文件找到。\n\n## 5.10 嵌套循环\n\
  \n## 概念\n\n在另一个循环内部的循环被称为*嵌套循环*。\n\n在第 4 章中，你看到了一个 `if` 语句如何在另一个语句内部。同样可以将一个循环嵌套在另一个循环内部。第一个循环被称为*外层循环*。嵌套在内部的被称为*内层循环*。\n\
  \n```cpp\nwhile (condition1)         // 外层循环开始\n{   ---\n    while (condition2)\
  \     // 内层循环开始\n    {  ---\n       ---\n    }                     // 内层循环结束\n}\
  \                         // 外层循环结束\n```\n\n嵌套循环用于当在外层循环的每次迭代中，某些操作需要重复多次的情况。这里是日常生活中的例子：\n\
  \n*   对于每批要烘烤的饼干，我们必须将每个饼干放在饼板上。\n*   对于每位销售员，我们必须相加每笔销售额以确定总佣金。\n*   对于每位老师，我们必须为他们的每班课制作一份学生级名单。\n\
  *   对于每个学生，我们必须相加每次测试的分以找到该学生的测试平均分。\n\n无论任务是什么，每当外层循环执行一次，内层循环都会执行其所有的迭代。程序 5-13\
  \ 说明了，它处理了最后一个任务：寻找学生的测试平均分。任何类型的循环都可以嵌套在任何其他类型的循环中。该程序使用了两个 `for` 循环。\n\n\n\n让我们使用显示的示例数据，追踪程序\
  \ 5-13 中发生的情况。在这种情况下，对于两个学生中的每一个人，我们都输入并相加了他们的三个分数。首先，在第 23 行进入外层循环并将 `snum` 设置为\
  \ 1。然后，当该学生的 `total` 累加器初始化为 0 后，进入了从第 26 行开始的内循环。当外层循环仍在第一次迭代且 `snum` 仍为 1 时，内循环执行了所有的迭代，处理了该学生的第\
  \ 1、2 和 3 次测试。随后，它退出内循环，并在第 36 到 38 行计算并输出了学生 1 的平均分。只有这时，程序才到达外层循环的底部并返回向上进行第二次迭代。外层循环的第二次迭代处理学生\
  \ 2。对于外层循环的*每一次*迭代，内循环都会执行其*所有*迭代。\n\n将每个循环想象成一个旋转的轮子可能会有所帮助。外层循环是一个缓慢移动的大轮。内循环是一个快速旋转的小轮。大轮每旋转一次，小轮就会旋转很多圈。由于我们的示例中外层循环执行了两次，而内循环每次外层循环都执行了三次，因此内循环总共执行了六次。这对应于用户输入的六个分数，总结如下：\n\
  \n*   对于外层循环的每一次迭代，内循环都会执行其所有的迭代。\n*   内循环完成迭代的速度比外层循环快。\n*   要获取内循环的总迭代次数，将外层循环的迭代次数乘以每次外层循环运行时内循环所执行的迭代次数。\n\
  \n## 5.11 跳出循环\n\n## 概念\n\nC++ 提供了提前跳出循环或退出循环迭代的方法。\n\n有时有必要在循环执行完所有迭代之前停止它。`break`\
  \ 语句在第 4 章中与 `switch` 配合，也可以放置在循环内部。当遇到它时，循环会立即停止，程序跳转到循环后的语句。\n\n这里是一个带有 `break`\
  \ 语句的循环示例。以下程序段中的 `while` 循环看起来执行了 10 次，但 `break` 语句导致它在第五次迭代后停止。\n\n```\nint count\
  \ = 1;\nwhile (count <= 10)\n{\n     cout << count << endl;\n     count++;\n   \
  \  if (count == 6)\n        break;\n}\n```\n\n展示这个示例仅仅是为了说明循环内部 `break` 语句的作用。然而，你通常不想以这种方式使用它，因为它违反了结构化编程的规则，并使代码更难以理解、调试和维护。循环的退出应该由其循环顶部的条件测试来控制（如\
  \ `while` 循环或 `for` 循环），或者由底部的控制（如 `do-while` 循环）。通常在循环内部使用 `break` 语句的唯一情况是在发生错误条件时提前退出循环。程序\
  \ 5-14 提供了一个示例。\n\n# 在嵌套循环中使用 `break`\n\n在嵌套循环中，`break` 语句只会中断它所处的那个循环。以下程序段在屏幕上显示三行星号。外层循环控制行数，内循环控制每行星号的数量。内循环设计为显示\
  \ 20 个星号，但 `break` 语句在第 11 次迭代时停止了它。\n\n```\nfor (row = 0; row < 3; row++)\n{  \
  \ for (star = 0; star < 20; star++)\n    {   cout << '*';\n        if (star == 10)\n\
  \            break;\n    }\n    cout << endl;\n}\n```\n\n该程序段的输出是：\n\n```\n***********\n\
  ***********\n***********\n```\n\n## 警告！\n\n由于 `break` 语句绕过了循环条件来终止循环，它违反了结构化编程的规则，并使代码更难以理解、调试和维护。因此，我们***不***建议使用它来退出循环。然而，由于它是\
  \ C++ 语言的一部分，我们仍然引入了它。\n\n# `continue` 语句\n\n有时你想留在循环中，但让当前的循环迭代立即结束。这可以通过 `continue`\
  \ 语句实现。当遇到 `continue` 时，体中的所有语句都会被忽略。在 `while` 循环中，程序跳转到顶部的测试表达式。如果 `continue` 为真，循环重新开始。在\
  \ `do-while` 循环中，程序跳转到底部的测试表达式。在 `for` 循环中，程序跳转到更新表达式。以下程序段演示了 `continue` 的用法：\n\
  \n```\nint testVal = 0;\nwhile (testVal < 10)\n{\n    testVal++;\n    if (testVal\
  \ == 4)\n       continue;\n    cout << testVal << \" \";\n}\n```\n\n这个循环看起来显示的是\
  \ 1-10。然而，输出如下：\n\n```\n1 2 3 5 6 7 8 9 10\n```\n\n注意数字 4 没有打印。这是因为当 `testVal` 等于\
  \ 4 时，`continue` 语句跳过了 `cout` 语句。\n\n# 警告\n\n与 `break` 语句一样，`continue` 语句违反了结构化编程规则，并使代码更难以理解、调试和维护。因此，你应该谨慎使用\
  \ `continue`。\n\n# Check\n\n1.  5.21 在以下情况下哪种循环（`while`、`do-while` 或 `for`）最好？\n\
  \n    1.  用户必须输入 14 个数字。\n    2.  必须显示一个菜单供用户选择。\n    3.  计算需要执行未知次数（可能不执行）。\n \
  \   4.  用户必须输入一组数字，由哨兵值终止。\n    5.  必须输入一系列值。用户指定数量。\n\n2.  5.22 以下程序段每个将显示多少个总星号？\n\
  \n    1.  ```\n        for (row = 0; row < 20; row++)\n        {  for (star = 0;\
  \ star < 30; star++)\n           {   cout << '*';\n           }\n           cout\
  \ << endl;\n        }\n        ```\n\n    2.  ```\n        for (row = 0; row < 20;\
  \ row++)\n        {    for (star = 0; star < 30; star++)\n             {   if (star\
  \ > 10)\n                      break;\n                 cout << '*';\n         \
  \    }\n             cout << endl;\n        }\n        ```\n\n3.  5.23 以下程序段将显示什么？\n\
  \n    ```\n    int addOn = 0, subTotal = 0;\n    while (addOn < 5)\n    {\n    \
  \    addOn++;\n        if (addOn == 3)\n           continue;\n        subTotal +=\
  \ addOn;\n        cout << subTotal << \"   \";\n    }\n    ```\n\n\n\n\n你日常使用的大多数商业软件程序将数据存储在文件中。以下是几个例子。\n\
  \n*   **文字处理器**：文字处理程序用于编写信函、备忘录、报告和其他文档。这些文档随后保存在文件中，以便在稍后进行查看、编辑和打印。\n*   **电子表格**：电子表格程序用于处理数值数据。数字和数学公式可以插入到电子表格的行和列中。然后，电子表格可以保存到文件中供以后使用。\n\
  *   **图像编辑器**：图像编辑程序用于绘制图形和编辑图像，例如你用数码相机拍摄的照片。你用图像编辑器创建或编辑的图像会保存在文件中。\n*   **业务运营软件**：日常业务运营中使用的程序高度依赖文件。工资程序将员工数据存储在文件中，库存管理程序将公司产品数据存储在文件中，会计系统将公司的财务运营数据存储在文件中，以此此类推。\n\
  *   **网络浏览器**：有时当你访问网页网页时，浏览器会在你的计算机上存储一个名为 `cookie` 的小文件。Cookie 通常包含有关浏览会话的信息，例如购物车的内容。\n\
  *   **游戏**：许多电脑游戏将数据存储在文件中。例如，某些游戏会将包含玩家名称及其得分的列表存储在文件中。这些游戏通常按分数从高到低的顺序显示玩家名称。某些游戏还允许你将当前游戏状态保存到文件中，这样你就可以退出并在稍后恢复游戏，而不需要从头开始。\n\
  \n程序员通常将将数据保存到文件的过程称为向文件`写入数据`（writing data）。当一段数据被写入文件时，它从内存（RAM）中的一个变量复制到文件中。这在图\
  \ 5-8 中所示。`输出文件`（output file）一词用于描述数据被写入的文件。它被称为输出文件是因为程序将输出内容存储其中。\n\n# 图 5-8 向文件写入数据\n\
  \n![一张插图说明了向文件中写入数据的过程。](img/FG_05_008.png)图 5-8 完整替代文本\n\n从文件中检索数据的过程被称为从文件中`读取数据`（reading\
  \ data）。当一段数据从文件中被读取时，它从文件中复制到内存（RAM）中的一个变量中。请参阅图 5-9 查看插图。`输入文件`（input file）一词用于描述从文件中读取数据的文件。它被称为输入文件是因为程序从该文件中获取输入。\n\
  \n# 图 5-9 从文件读取数据\n\n![一张插图说明了从文件中读取数据的过程。](img/FG_05_009.png)图 5-9 完整替代文本\n\n#\
  \ 文件类型\n\n通常情况下，文件有两种类型：文本文件和二进制文件。`文本文件`（text file）包含使用 ASCII 或 Unicode 等方案编码为文本的数据。即使文件中包含数字，这些数字也是作为一系列字符存储在文件中的。因此，该文件可以在记事本等文本编辑器中打开并查看。`二进制文件`（binary\
  \ file）包含未转换成文本的数据。因此，你无法用文本编辑器查看二进制文件的内容。在这里我们将只处理文本文件。在第 13 章显示了名为 `jpg`、`txt`\
  \ 和 `doc` 的三个文件。\n\n每个操作系统都有自己的文件命名规则。许多系统（包括 Windows）支持使用`文件名扩展名`（filename extensions），它是文件名末部的短字符序列，前面有一个点。点被称为“点”。例如，文件名\
  \ `resume.doc` 读作“点 doc”。扩展通常表示文件中存储的数据类型。例如，`.jpg` 扩展通常表示文件包含 JPEG 图像。`.txt` 扩展通常表示文件包含文本。`.doc`\
  \ 扩展通常表示文件包含 Microsoft Word 文档。\n\n## 图 5-10 三个文件\n\n![图片显示了三个文件的图标。文件名为 cat、txt\
  \ 和 doc。](img/FG_05_010)\n\n为了让程序处理磁盘上的文件，程序必须在内存中创建一个文件流对象。`文件流对象`（file stream\
  \ object）是一个与特定文件关联并为程序提供处理该方式的对象。它被称为“流”对象是因为它允许数据流从内存复制到文件，以及从文件复制到内存。\n\n文件流对象的工作方式与\
  \ `cout` 和 `cin` 对象非常。数据流可以发送到 `cout`，将值显示在屏幕上。同样，数据流也可以发送到文件流对象，将其写入其关联的文件中为了从键盘获取输入，我们可以使用\
  \ `cin`。它读取数据并存储在变量中。\n\n# 设置程序的文件输入/输出\n\n当程序使用文件时，必须采取五个步骤：\n\n1. 包含执行文件输入输出所需的头文件。\n\
  2. 定义文件流对象。\n3. 打开文件。\n4. 使用文件。\n5. 关闭文件。\n\n让我们检查这些每一个步骤，从第 1 步开始。\n\n\n正如你需要在程序中包含\
  \ `iostream` 文件来使用 `cin` 和 `cout` 一样，你还需要另一个头文件来操作文件。`fstream` 文件包含了文件操作所需的所有声明。你可以通过以下语句包含它：\n\
  \n```\n#include <fstream>\n```\n\n`fstream` 头文件定义了数据类型 `ofstream`、`ifstream` 和 `fstream`。在\
  \ C++ 程序能够与文件交互之前，它必须定义一个其中这些数据类型之一的对象。该对象将与计算机磁盘上的实际文件“链接”，并且对文件可以执行的操作取决于你为文件流对象选择了这三种数据类型中的哪一个。表\
  \ 5-1 列出并描述了文件流数据类型。\n\n## 表 5-1 文件流对象\n\n| 文件流数据类型 | 描述 |\n| --- | --- |\n| `ofstream`\
  \ | 这代表输出文件 `stream`，读作‘o’ ‘f’ stream。这种数据类型的对象可以用于创建文件并为其写入数据。 |\n| `ifstream`\
  \ | 这代表输入文件 `stream`，读作‘i’ ‘f’ stream。这种数据类型的对象可以用于打开现有文件并从中读取数据。 |\n| `fstream`\
  \ | 这代表文件 `stream`，读作‘f’ stream。这种数据类型的对象可以打开文件进行读取、写入或两者兼顾。 |\n\n### 注意\n\n在本章中，我们只讨论\
  \ `ofstream` 和 `ifstream` 数据类型。`fstream` 类型将在第 13 章 中介绍。\n\n## 创建文件流对象并打开文件\n\n\
  在向文件写入或读取数据之前，必须发生两件事：\n\n* 必须创建一个文件流对象。\n* 必须打开文件并将其链接到文件流对象。\n\n以下代码显示了打开文件进行输入（读取）的示例。\n\
  \n```\nifstream inputFile;\ninputFile.open(\"customers.txt\");\n```\n\n第一个语句定义了一个名为\
  \ `inputFile` 的 `ifstream` 对象。第二个语句调用该对象的 `open` 成员函数，并将字符串 `\"customers.txt\"`\
  \ 作为参数传递。在这一语句中，`open` 成员函数打开 `customers.txt` 文件并将其与 `inputFile` 对象链接。此代码执行后，你将能够使用\
  \ `inputFile` 从 `customers.txt` 文件中读取数据。\n\n### 注意\n\n存储数据的文本文件通常使用 `.txt` 或 `.dat`\
  \ 作为文件扩展名。\n\n以下代码显示了打开文件进行输出（写入）的示例。\n\n```\nofstream outputFile;\noutputFile.open(\"\
  employees.txt\");\n```\n\n第一个语句定义了一个名为 `outputFile` 的 `ofstream` 对象。第二个语句调用该对象的\
  \ `open` 成员函数，并将字符串 `\"employees.txt\"` 作为参数传递。这打开了一个名为 `employees.txt` 的文件并将其与\
  \ `outputFile` 链接。如果指定的文件不存在，它将被创建。如果指定的文件已存在，它将被擦除并创建一个同名的新文件。此代码执行后，你将能够使用 `outputFile`\
  \ 向 `employees.txt` 文件写入数据。\n\n有时，在打开文件时，你还需要指定它的完整路径以及名称。例如，在 Windows 系统上，以下语句打开文件\
  \ `C:\\data\\inventory.txt` 并将其与 `inputFile` 链接：\n\n```\ninputFile.open(\"C:\\\\\
  data\\\\inventory.txt\");\n```\n\n### 注意\n\n注意文件路径中使用了两个反斜杠。如前所述，字符串字面量中需要两个反斜杠来表示一个反斜杠。\n\
  \n可以在一个语句中定义文件流对象并打开文件。这里是一个示例，定义了一个名为 `inputFile` 的 `ifstream` 对象，打开 `customers.txt`\
  \ 文件，并将 `inputFile` 与其关联：\n\n```\nifstream inputFile(\"customers.txt\");\n```\n\n\
  这里是示例，定义了一个名为 `outputFile` 的 `ofstream` 对象，打开 `employees.txt` 文件，并将 `outputFile`\
  \ 与其关联：\n\n```\nofstream outputFile(\"employees.txt\");\n```\n\n## 关闭文件\n\n打开文件的反面是关闭文件。虽然程序在关闭时会自动关闭文件，但编写显式关闭它们的语句是一个良好的编程习惯。以下是程序在完成文件后应关闭文件的两个原因：\n\
  \n* 大多数操作系统在将数据写入文件之前，会将其临时存储在 `file buffer`（文件缓冲区）中。文件缓冲区是内存中的一个小型“持有区域”，文件绑定的数据首先写入此处。只有当缓冲区满时，数据才会实际写入文件。这样做是为了提高系统性能，因为执行文件\
  \ I/O 的速度比处理内存中的数据慢得多。关闭文件会导致缓冲区中任何未保存的数据被写入到文件中。这确保了程序意图保存的所有数据都已保存。\n* 某些操作系统限制了同时打开的文件数量。当程序关闭不再使用的文件时，将释放更多资源。\n\
  \n调用文件流的 `close` 成员函数可以关闭文件。这是一个示例：\n\n```\ninputFile.close();\n```\n\n## 向文件写入数据\n\
  \n你已经知道如何在 `cout` 中使用插入运算符（`<<`）。它也可以用于 `ofstream` 对象以向文件写入数据。假设 `outputFile` 是一个\
  \ `ofstream` 对象，以下语句使用了 `<<` 运算符：\n\n```\noutputFile << \"I love C++\";\n```\n\n\
  该语句将字符串 \"I love C++\" 写入文件。如果你想字符串后添加换行符，可以使用 `endl` 操符：\n\n```\noutputFile <<\
  \ \"I love C++\" << endl;\n```\n\n`endl` 操符插入一个换行字符并刷新缓冲区。这里另一个示例显示了如何向文件写入变量：\n\
  \n```\nint score = 95;\noutputFile << \"The score is: \" << score;\n```\n\n该语句将字符串\
  \ \"The score is: \" 以及变量 `score` 的值写入文件。\n\n## 从文件中读取数据\n\n要从文件中读取数据，你需要使用 `ifstream`\
  \ 对象和提取运算符（`>>`）。以下是从文件中读取一个整数的示例：\n\n```\nint grade;\ninputFile.open(\"data.txt\"\
  );\ninputFile >> grade;\n```\n\n提取运算符 `>>` 从 `data.txt` 文件中读取下一个整数并将其存储在变量 `grade`\
  \ 中。要从文件中读取多个值，你可以使用 `while` 循环：\n\n```\nint value;\nwhile (inputFile >> value)\
  \ {\n    cout << value << endl;\n}\n```\n\n该循环从文件中读取每个整数并将其打印到控制台，直到到达文件尾。\n\n\n\
  \n## 在旧版本的 C++ 中使用 `c_str` 成员函数\n\n在 C++ 语言的旧版本（C++11 之前），文件流对象的 `open` 成员函数不允许\
  \ `string` 对象作为参数。`open` 成员函数要求你以空结尾字符串的形式传递文件名，这也被称为 **C 字符串**。字符串字面量在内存中的存储形式为空结尾的\
  \ C 字符串（这解释了为什么你可以将它们传递给 `open` 函数），但 `string` 对象不是。\n\n幸运的是，`string` 对象有一个名为 `c_str`\
  \ 的成员函数，它可以返回格式化为空结尾的 C 字符串的对象内容。以下是调用该函数的通用格式：\n\n```\nstringObject.c_str()\n```\n\
  \n在通用格式中，`stringObject` 是 `string` 对象的名称。`c_str` 函数返回存储在 `stringObject` 中的字符串的拷贝，格式为空结尾的\
  \ C 字符串。\n\n例如，[Program 5-18] 中的第 27 行可以重写如下，以便程序与旧版本的 C++ 兼容：\n\n```cpp\ninputFile.open(fileName.c_str());\n\
  ```\n\n\n\n\n程序 5-18 询问用户文件中有多少个值，并根据该数量读取相应的数据项。然而，在从文件中读取数据时，并不需要用户指定有多少个数据值或数据在何时结束。这是因为文件在末尾有一个文件结束（`EOF`）标记。你看不见它，但它确实在那里，程序可以测试是否已到达该标记。这个测试非常重要，因为如果程序尝试读取末尾之外的内容，将会出错。\n\
  \n测试是否到达文件末尾简单的方法是使用 `>>` 运算符。该运算符不仅可以从文件中读取数据，还会返回一个真或假值，表示数据是否被成功读取。如果运算符返回真，则表示成功读取了一个值。如果运算符返回假，则意味着没有从文件中读取到任何值，即已到达\
  \ `EOF`。\n\n程序 5-19 修订了 程序 5-18，以便在不知道文件中有多少个数字的情况下读取并求和文件中的值。它在读取的同时也对数字进行了计数。\n\
  \n现在，让我们仔细观察第 25 行，它控制着循环。\n\n```\nwhile (inputFile >> value)\n```\n\n注意，从文件中提取数据的语句被用作\
  \ `while` 循环中的布尔测试表达式。它的工作原理如下：\n\n*   执行表达式 `inputFile >> value`。\n*   如果成功从文件中读取到一个项，该项将存储在\
  \ `value` 变量中，表达式返回真以表示成功。在这种情况下，第 26 行和第 27 行的语句将执行并循环。\n*   当文件中没有更多项可读时，表达式 `inputFile\
  \ >> value` 返回假，表示没有读取到值。在这种情况下，循环终止。\n\n# 文件打开错误的测试\n\n在某些情况下，`open` 成员函数将无法工作。例如，如果文件\
  \ `info.txt` 不存在或在预定目录无法找到，以下代码将失败：\n\n```\nfstream inputFile;\ninputFile.open(\"\
  info.txt\");\n```\n\n幸运的是，有一种方法可以判断 `open` 成员函数是否成功打开了文件。在调用 `open` 成员函数后，你可以像测试布尔表达式一样测试文件流对象。程序\
  \ 5-20 展示了如何操作。\n\n让我们仔细观察代码的某些部分。第 12 行调用 `open` 成员函数打开文件 `list_of_numbers.txt`，并将其与名为\
  \ `inputFile` 的 `ifstream` 对象关联。然后，第 15 行的 `if` 语句测试 `inputFile` 的值，就像它是布尔表达式一样。这样测试时，如果文件成功打开，`inputFile`\
  \ 将给出一个真值；否则，将给出一个假值。如示例输出所示，如果无法打开文件，程序将显示错误消息。\n\n检测打开文件失败的另一种方法是使用 `ifstream`\
  \ 类中名为 `fail` 的成员函数，如下所示：\n\n```\nifstream inputFile;\ninputFile.open(\"customers.txt\"\
  );\n\nif (inputFile.fail())\n   cout << \"Error opening file.\\n\";\nelse\n{\n \
  \  // Process the file\n}\n```\n\n`fail` 成员函数在尝试的文件失败（即未成功）时返回真，在其他情况下返回假。在使用文件\
  \ I/O 时，始终测试文件流对象是一个好习惯，以确保在尝试使用之前文件已成功打开。如果无法打开文件，应该告知用户并让程序以适当的方式处理该情况。\n\n##\
  \ 检查点\n\n1.  5.24\n    *   什么是输出文件？\n    *   什么是输入文件？\n2.  5.25 在程序中必须包含哪个头文件才能使用文件？\n\
  3.  5.26 当程序使用文件时必须采取哪五个步骤？\n4.  5.27 文本文件和二进制文件之间的区别是什么？\n5.  5.28 顺序访问和随机访问之间的区别是什么？\n\
  6.  5.29 如果你想写入，你会创建什么类型的文件流对象？\n7.  5.30 如果你想读取，你会创建什么类型的文件流对象？\n8.  5.31 如果 `dataFile`\
  \ 是一个与名为 `pay.dat` 文件关联的 `ofstream` 对象，以下哪个语句会将 `hourlyPay` 的值写入文件？\n    *   `ifStream\
  \ << hourlyPay;`\n    *   `ifStream >> hourlyPay;`\n    *   `dataFile << hourlyPay;`\n\
  \    *   `dataFile >> hourlyPay;`\n9.  5.32 如果 `dataFile` 是一个与名为 `pay.dat` 文件关联的\
  \ `ifstream` 对象，以下哪个语句将从文件中读取一个值并放入 `hourlyPay`？\n    *   `ifStream << hourlyPay;`\n\
  \    *   `ifStream >> hourlyPay;`\n    *   `dataFile << hourlyPay;`\n    *   `dataFile\
  \ >> hourlyPay;`\n10. 5.33 假设你有一个名为 `numbers.txt` 的输出文件，已打开并与名为 `outfile` 的 `ofstream`\
  \ 关联。编写一个使用 `for` 循环将 1 到 10 写入文件的程序。\n\n#5.13 专注于测试与调试：创建测试数据\n\n## 概念\n\n测试程序需要良好的测试数据。一旦程序经过设计、编写并确认通过编译，就必须进行彻底测试以发现任何逻辑错误并确保其符合规范。在创建测试数据时，质量比数量重要。也就是说，一组良好的测试用例比许多未经思考的用例提供更多关于程序运行的信息。每个测试用例都应该设计用于测试程序的某个方面，并且你应该始终知道每次测试在检查什么。作为示例，请查看\
  \ 程序 5-21。它使用哨兵控制循环计算班级每个学生的分数，且所有分数都在 0 到 100 之间。程序可以编译、链接并运行，但包含了几个逻辑错误。\n\n尝试使用表\
  \ 5-2 所示的四个测试用例运行程序。程序包含了五个逻辑错误。然而，如果只用这四个测试用例运行，没有任何错误会被发现。测试数据设计不足以捕获它们。测试 1、2\
  \ 和 3 实际上是同一个测试的三个版本。它们只是检查程序是否能计算出一个没有小数的单个学生的正确平均分。最后一个测试检查程序是否能捕到一个过小或过大的无效值，但没有检查如果输入同一个输入第二个无效值会发生什么。表\
  \ 5-3 包含了更好的测试集，并说明了你在测试程序时应该检查的一些情况。这些测试将揭示程序所有的五个错误。\n\n# 表 5-2 程序 5-21 的初步测试计划\n\
  \n| | 姓名 | 分数 1 | 分数 2 | 预期结果 |\n| --- | --- | --- | --- | --- |\n| 测试 1: | Mary\
  \ | 80 | 80 | 80.0 程序退出 |\n| 测试 2: | Bill | 70 | 80 | 75.0 程序退出 |\n| 测试 3: | Tom\
  \ | 80 | 90 | 85.0 程序退出 |\n| 测试 4: | Sam | -1 然后 1 | 999 然后 99 | 50.0 程序退出 |\n\n\
  \n\n\n\n# 表 5-3 程序 5-21 的修改后测试计划\n\n| 测试 | 名称 | 分数 1 | 分数 2 | 目的 | 预期结果 |\n| ---\
