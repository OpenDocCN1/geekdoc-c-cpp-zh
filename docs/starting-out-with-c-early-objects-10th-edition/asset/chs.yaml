  \ << \"Chocolate: 9 fat grams.\\n\";\n          else if (/*在此处插入代码 */)\n       \
  \      cout << \"Vanilla: 10 fat grams.\\n\";\n          else if (/*在此处插入代码 */)\n\
  \             cout << \"Pralines and Pecan: 14 fat grams.\\n\";\n          else\
  \ \n             cout << \"That's not one of our flavors!\\n\";\n          return\
  \ 0;\n       }\n    ```\n\n\n\n存储为字符串的数字与存储为数值的数字之间存在区别。字符串 `\"2679\"` 并不是一个数字：它是组成数字\
  \ 2679 的各个数字字符的 ASCII 码序列。由于字符串 `\"2679\"` 不是一个数字，编译器将不允许对其进行加法、乘法和除法等算术操作。表示数字的字符串在用于算术运算符之前，必须先转换为数值形式。同样，处于\
  \ `int`、`long` 和 `double` 等数值类型形式程序值有时需要转换为字符串形式。生成的字符串可以立即输出到文件或其他输入/输出设备，也可以存储在内存字符串对象中以供以后使用。\n\
  \n当用户通过键盘输入一个数字时，该数字是以字符串形式以用户输入的字符（数字）序列的形式进入的。在 C++ 中，这种数字通常通过流提取运算符 `>>` 读取。该运算符在存储入数值类型的变量之前，会自动根据需要执行转换。在输出时，通过流输出运算符\
  \ `<<` 执行从数值到字符串的反向转换。\n\n# 使用字符串流对象进行数值转换\n\nC++ 有两个类，`ostringstream` 和 `istringstream`，可以用于对内存中的值执行字符串/数值转换。`ostringstream`\
  \ 类是 `ostream` 的子类（`cout` 所属的类），并使用流插入运算符 `<<` 将数值转换为字符串。`ostringstream` 类型对象的工作方式与\
  \ `cout` 和文件对象相同，不同之处在于，`ostringstream` 不是将数据写入屏幕或文件，而是将其数据写入其内部包含的字符串对象中。每当你对 `ostringstream`\
  \ 对象使用 `<<` 时，它都会执行任何必要的数值到字符串的转换，并将结果附加到字符串的末尾。除了支持 `ostream` 类的所有成员函数和运算符外，`ostringstream`\
  \ 对象还支持表 12-4 所示的 `str` 成员函数。\n\n# 表 12-4 `ostringstream` 和 `istringstream` 类的成员函数\n\
  \n| 成员函数 |  |\n| --- | --- |\n| `istringstream(string s)` | `istringstream:` 的构造函数：设置对象输入流的初始值。示例：`istringstream\
  \ istr(\"50 64 28\");` |\n| `ostringstream(string s)` | `ostringstream:` 的构造函数：设置对象输出流的初始值。示例：`ostringstream\
  \ ostr(\"50 64 28\");` |\n| `string str()` | 返回 `ostringstream` 或 `istringstream`\
  \ 对象中包含的字符串。\n```\n示例: string is = istr.str();\n            string os = ostr.str();\n\
  ``` | |\n| `void str(string &s)` | 设置作为对象输入或输出流的字符串。\n```\n示例: ostr.str(\"50 64\
  \ 28\");\n            istr.str(\"50 64 28\");\n``` | |\n\n`istringstream` 类派生自 `istream`。它内部包含一个字符串对象，作为可以从中“读取”的输入流。输入流可以在对象创建时通过\
  \ `istringstream` 构造函数设置，也可以在对象创建后通过调用 `str(string s)` 函数设置。流提取运算符 `>>` 从封装的字符串中读取，并在必要时将字符串转换为数值。`istringstream`\
  \ 的成员函数也列在表 12-4 中。你必须在程序中包含 `<sstream>` 头文件才能使用这些类。\n\n程序 12-11 展示了这些类的用法。\n\n\
  注意，这些类具有 `ostream` 和 `istream` 对象的完整功能，包括使用八进制和十六进制等不同进制将数字转换为字符串的能力。然而，它们也有一个缺点，即它们迫使你创建\
  \ `sstream` 对象仅仅是为了使用它们的插入和提取运算符执行转换。\n\n# 数值转换函数\n\nC++ 11 提供了几个 `to_string(T value)`\
  \ 函数，用于将类型 `T` 的数值值转换为字符串形式。以下是几个 `to_string()` 函数的列表：\n\n```\nstring to_string(int\
  \ value)\nstring to_string(long value)\nstring to_string(double value)\n```\n\n\
  以下代码段\n```\nint a = 5;\nstring str = to_string(a*a);\ncout << \"The square of 5\
  \ is \" << str;\n```\n说明了如何使用该函数。\n\n```\n5 的平方是 25\n```\n`to_string()` 函数无法处理 10\
  \ 以外的进制。如果你需要这种功能，应该使用 `ostringstream` 对象。\n\n字符串到数值的转换由该函数执行。`int`、`long` 和 `float`\
  \ 的成员如下：\n```\nint stoi(const string& str, size_t pos = 0, int base = 10)\nlong\
  \ stol(const string& str, size_t pos = 0, int base = 10)\nfloat stof(const string&\
  \ str, size_t pos = 0)\ndouble stod(const string& str, size_t pos = 0, int base\
  \ = 10)\n```\n第一个参数 `str` 是要转换的字符串（例如 `\"3.48\"`）。`size_t` 定义在标准库中，通常表示数组、vector\
  \ 或字符串的大小。`pos` 参数是可选的，可以省略。如果省略 `pos`，则不存储无法转换的字符索引。`base` 参数适用于整数转换，指示使用的进制。如果省略\
  \ `base`，则假设为 10。如果字符串 `str` 有无效值，例如 `\"is even\"`，则无法进行转换且函数会抛出 `invalid_argument`\
  \ 异常。我们将在第 16 章 中进一步学习异常。\n\n程序 12-12 展示了字符串转换函数的用法。\n\n# 习题\n\n1.  12.13 为每个函数写一个简短描述。你的描述应该讨论函数每个参数的类型及其默认值（如果有），并标识函数的返回类型。\n\
