  4. 4.33 判断这些字符测试函数将返回 true 还是 false。\n    1. `isalpha('B')`\n    2. `isalnum('B')`\n\
  \    3. `isdigit('B')`\n    4. `islower('B')`\n    5. `isprint('B')`\n    6. `ispunct('B')`\n\
  \    7. `isupper('B')`\n    8. `isspace('B')`\n\n\n\n你可以使用条件运算符来创建类似于 `if/else`\
  \ 语句的短表达式。\n\n条件运算符强大且独特。它提供了一种表示简单 `if/else` 语句的简写方法。该运算符由问号（`?`）和冒号（`:`）组成。其格式如下：\n\
  \n```\n expression ? expression : expression;\n```\n\n这是一个使用条件运算符的语句示例：\n\n```\n\
  \ x < 0 ? y = 10 : z = 20;\n```\n\n该语句被称为`条件表达式”，由三个用 `?` 和 `:` 符号分隔的子表达式组成。这些表达式为\
  \ `x < 0`、`y = 10` 和 `z = 20`。\n\n![该语句被称为条件表达式，由用 ? 和 : 符号分隔的三个子表达式组成](img/Page_211_001.png)\n\
  \n上面的条件表达式执行的操作与此 `if/else` 语句相同：\n\n```\n if (x < 0)\n    y = 10;\nelse\n    z\
  \ = 20;\n```\n\n条件表达式中位于问号之前的部分是待测试的条件。它类似于 `if` 语句括号中的表达式。如果条件为真，则执行 `?` 和 `:`\
  \ 之间的语句部分。否则，执行 `:` 之后部分。图 4-9 展示了三个子表达式所扮演的角色。\n\n## 图 4-9 条件表达式\n\n![图片解释了条件表达式。](img/FG_04_009.png)图\
  \ 4-9 完整替代文本\n\n如果有帮助的话，你可以在子表达式周围加上括号，如下：\n\n```\n (x < 0) ? (y = 10) : (z = 20);\n\
  ```\n\n### 注意\n\n因为条件运算符需要三个操作数，所以它是一个`三元`运算符。\n\n# 使用条件表达式的值\n\n记住，在 C++ 中，所有表达式都有值，这包括条件表达式。如果第一个子表达式为真，则条件表达式的值为第二个子表达式的值。否则，它是第三个子表达式的值。这是一个使用条件表达式值的赋值语句示例：\n\
  \n```\n a = (x > 100) ? 0 : 1;\n```\n\n赋值给变量 `a` 的值将是 0 或 1，取决于 `x` 是否大于 100。该语句的逻辑与以下\
  \ `if/else` 语句相同：\n\n```\n if  (x > 100)\n    a = 0;\nelse\n    a = 1;\n```\n\n\
  程序 4-22 可以用于帮助顾问计算她的费用。她的费率是每小时 50 美元，但她的最低收费是五个小时。条件运算符用于一个语句中，确保小时数不会低于五个。\n\n\
  让我们仔细查看第 20 行使用条件表达式的语句：\n\n```\n hours = hours < MIN_HOURS ? MIN_HOURS : hours;\n\
  ```\n\n如果变量 `hours` 的值小于 `MIN_HOURS`，它会将 `MIN_HOURS` 存储在 `hours` 中。否则，它将给 `hours`\
  \ 分配原有值。这确保了 `hours` 在第 23 行计算顾问费用时，其值不会小于 `MIN_HOURS`。\n\n正如你所见，条件运算符让你能够将决策能力封装在简洁的代码行中。只要发挥想象力，它可以应用于许多其他编程问题。例如，考虑以下语句：\n\
  \n```\n cout << \"Your grade is: \" << (score < 60 ? \"Fail.\" : \"Pass.\");\n```\n\
  \n如果你使用 `if/else` 语句，该语句将写如下：\n\n```\n if (score < 60)\n   cout << \"Your grade\
  \ is: Fail.\";\nelse\n   cout << \"Your grade is: Pass.\";\n```\n\n### 注意\n\n括号放在条件表达式周围是因为\
  \ `<<` 运算符的优先级高于 `?:` 运算符。如果没有括号，只有表达式 `score < 60` 的值会被发送到 `cout`。\n\n# 知识点点\n\n\
