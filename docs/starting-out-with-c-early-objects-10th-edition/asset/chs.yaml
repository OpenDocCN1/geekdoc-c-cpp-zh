  \ 完整替代文本\n\n### 注意\n\n为了从函数返回多个值，必须以某种方式对它们进行“封装”，使它们被视为单个值。你将在第 7 章中学习如何这样做。\n\n\
  ## 定义返回值函数\n\n当你编写返回值函数时，必须决定函数将返回什么类型的值。这是因为你必须在函数头和函数原型中指定返回值的数据类型。到目前，我们编写的所有函数都是\
  \ `void` 函数。这意味着它们不返回任何值。这些函数在函数头和函数原型中使用关键字 `void` 作为返回类型。相比之下，返回值函数在头部中使用 `int`、`double`、`bool`\
  \ 或其他有效的数据类型。以下是一个返回 `int` 值的函数示例：\n\n```cpp\n int sum(int num1, int num2)\n{\n\
  \    int result;\n    result = num1 + num2;\n    return result;\n}\n```\n\n该函数的名称为\
  \ `sum`。注意函数头中的返回类型为 `int`，如图图 6-10 所示。\n\n## 图 6-10：函数返回类型\n\n![函数读取“int sum(int\
  \ num1, int num2)”。函数中的“int”部分被标记为“返回类型”。](img/FG_06_010.png)\n\n这段代码定义了一个名为 `sum`\
  \ 的函数，它接受两个 `int` 参数。参数被传递给参数变量 `num1` 和 `num2`。在函数内部定义了变量 `result`。在函数内部定义的变量被称为*局部变量*。在变量定义之后，参数变量\
  \ `num1` 和 `num2` 的值相加，并将它们的和赋值给 `result` 变量。函数中的最后一个语句是：\n\n```cpp\n return result;\n\
  ```\n\n该语句会导致函数结束，并将 `result` 变量的值传回调用该函数的语句。返回值函数必须按照以下通用格式编写 `return` 语句：\n\n\
  ```cpp\n return expression;\n```\n\n在通用格式中，`expression` 是要返回的值。它可以是任何具有值的表达式，例如变量、字面量或数学表达式。表达式的值将被转换为函数返回的数据类型，并传回调用该函数的语句。在这种情况下，`sum`\
  \ 函数返回 `result` 变量中的值。\n\n然而，我们可以完全省略 `result` 变量并直接返回表达式 `num1 + num2`，如下代码所示：\n\
  \n```cpp\n int sum(int num1, int num2)\n{\n    return num1 + num2;\n}\n```\n\n返回值函数的原型遵循我们之前介绍的约定。以下是\
  \ `sum` 函数的原型：\n\n```cpp\n int sum(int num1, int num2);\n```\n\n# 调用返回值函数\n\n程序\
