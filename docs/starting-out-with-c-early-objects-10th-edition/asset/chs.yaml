  \ 语句来实现这种选择结构。\n\n# 分支结构\n\n分支结构是一种更复杂的选择结构形式，根据整数或字符变量或整数表达式的值，可以采取许多不同的行动。图 N-10\
  \ 显示了这种分支结构的通用形式。\n\n\n\n\n![一张图表说明了 case 结构。图表显示了一个决策框。框的输出被分为 4 条路径，每条路径指向一个不同的过程。](img/FG_AppN_010.png)\n\
  \n图 N-11 所示的流程图描述了程序 4-23 的逻辑，该程序也来自第 4 章。程序 4-23 说明了 C++ 如何使用 `switch` 语句来实现 case\
  \ 结构。在该程序中，将遵循四条可能路径之一，这取决于变量 `choice` 中存储的值。\n\n# 图 N-11\n\n![一个流程图显示了程序的逻辑。](img/FG_AppN_011.png)图\
  \ N-11 完整备用文本\n\n# 重复结构\n\n重复结构表示一段重复执行的程序代码块。这种结构通常被称为循环。图 N-12 展示了一个重复结构的示例。\n\
  \n# 图 N-12\n\n![一张图表说明了重复结构。](img/FG_AppN_012.png)图 N-12 完整备用文本\n\n注意菱形符号的使用。重复结构会测试一个语句，该语句用于指示某个条件是否存在。如果语句为真（意味着条件存在），则执行一组操作。然后再次测试该语句。如果它仍然为真，则条件仍然存在并重复这些操作。这会一直持续，直到该语句不再为真。\n\
  \n在刚刚显示的流程图段中，测试了语句 `x < y`。如果它为真，则执行组成过程 A 的语句并再次评估 `x < y`。只要 x 小于 y，过程 A 就会重复。当\
  \ x 不再小于 y 时，重复停止并退出该结构。\n\n重复结构有两种形式：前置测试和后置测试。前测试结构在执行操作或一组操作*之前*测试其条件。我们刚刚检查的流程图段展示了一个前测试结构。注意，如果条件\
  \ `x < y` 从初不成立，则过程 A 将完全不执行。前测试重复结构在 C++ 中被编码为 `while` 循环或 `for` 循环。\n\n后测试重复结构在执行操作或一组操作*之后*测试其条件。这种循环始终至少执行一次代码。图\
  \ N-13 展示了一个代表后测试结构的流程图段。\n\n# 图 N-13\n\n![一张图表说明了后测试重复结构。](img/FG_AppN_013.png)图\
  \ N-13 完整备用文本\n\n后测试重复结构在 C++ 中被编码为 `do-while` 循环。\n\n图 N-14 显示了一个描述程序 5-6 逻辑的流程图，该程序出现在第\
  \ 5 章。使用了前测试循环。\n\n# 图 N-14\n\n![一个流程图说明了一个前测试循环。](img/FG_AppN_014.png)图 N-14 完整备用文本\n\
  \n# 模块\n\n程序模块（如 C++ 中的函数）在流程图中由此符号表示。![图中显示了一个水平矩形。图中还显示了矩形两端的垂直线。](img/FG_AppN_003)\n\
  \n图 N-15 说明了它的用法。模块代码在流程图中符号所在的位置执行。\n\n# 图 N-15\n\n![一个流程图显示了逻辑。](img/FG_AppN_015.png)图\
  \ N-15 完整备用文本\n\n然后可以为模块构建一个独立的流程图。图 N-16 显示了 `main` 函数的程序 6-14 的流程图，该程序出现在第 6 章。注意它是如何“调用”其他几个模块的，这些其他模块执行程序的部分活动。\n\
  \n# 图 N-16\n\n![一个流程图逻辑。](img/FG_AppN_016.png)图 N-16 完整备用文本\n\n"
