  \n计算机世界有一句著名的格言是“垃圾进，垃圾出（garbage in, garbage out）”。程序输出的完整性完全取决于输入的质量，因此你应该尽量确保没有垃圾数据进入你的程序。`输入验证`（Input\
  \ validation）是检查用户给程序的信息并判断其是否有效的过程。良好的程序应该对于接受的输入类型给出的指令，但仍然不要假设用户已经遵循了这些指令。以下是程序执行的几类输入验证示例：\n\
  \n*   检查数字以确保它们在可能值的范围内。例如，一周有 168 小时。一个人在一周内工作时间不可能超过 168 小时。\n*   检查数值的“合理性”。虽然一个人每周工作\
  \ 168 小时可能是可能的，但并不常见。\n*   检查从菜单或其他选择集中勾选的项目，以确保它们是可用选项。\n*   检查变量是否存在可能导致问题的值，例如除以零。\n\
