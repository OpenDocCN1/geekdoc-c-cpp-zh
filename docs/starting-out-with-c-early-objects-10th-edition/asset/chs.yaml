  \ 7, 9}; // 非法！\n```\n\n此外，如果你留了一个元素未初始化，则你必须将其后的所有元素也留为未初始化。C++ 不提供在初始化列表中跳过元素的方法。这是另一个非法的示例。\n\
  \n```\n int numbers[7] = {1, , 4, , 3, 5, 7};      // 非法！\n```\n\n# 隐式数组大小\n\n你可以通过提供一个包含每个元素值的初始化列表来定义一个不指定大小的数组。C++\
  \ 会统计初始化列表中项的个数，并赋予数组相应数量的元素。例如，以下定义创建了一个五元素的数组：\n\n```\n double ratings[] = {1.0,\
