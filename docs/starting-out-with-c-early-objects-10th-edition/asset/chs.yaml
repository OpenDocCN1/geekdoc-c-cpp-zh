  \n# 附录 N 流程图简介\n\n本附录简要介绍了流程图。它包含了第 1 章–第 6 章中出现的某些程序的示例流程图。\n\n流程图是描述程序“执行流”的图表。它包含了代表程序每一步的符号。图\
  \ N-1 是程序 1-1 的流程图，该程序是第 1 章中的工资计算程序。\n\n# 图 N-1\n\n![流程图显示了程序 8 个步骤的逻辑。流程图用不同的符号表示各个过程步骤。](img/FG_AppN_001.png)图\
  \ N-1 完整替代文本\n\n注意此流程图中三类型的符号：圆矩形（表示终端）、平行四边形（表示输入/输出操作）和矩形（表示过程）。\n\n![图表显示了 3\
  \ 个流程图符号及其标签。](img/UNFG_AppN_001.png)N.1-1 完整替代文本\n\n圆矩形或终端点表示流程图的起点和终点。平行四边形指定输入或输出操作。矩形描述了一个过程，例如数学计算或变量赋值。注意这些符号是用箭头连接的，箭头指示了程序流的方向。\n\
  \n# 连接符\n\n有时流程图会被分成两个或多个更小的图表。这通常在流程图无法在单页上显示，或者必须分成若干部分时进行。连接符符号（内部带有字母或数字的小圆圈）允许你连接两个流程图。\n\
  \n![插图显示了一个带有字母“A”的圆圈。](img/UNFG_AppN_002.png)\n\n在图 N-2 中，A 连接符表示第二个流程图段从第一个流程图段结束的地方开始。\n\
  \n# 图 N-2\n\n![图表显示了流程图的 2 部分。第一个流程图显示了终端“START”、2 个顺序步骤，以及连接符“A”。第二个流程图显示了连接符“A”、2\
  \ 个顺序步骤，以及终端“END”。](img/FG_AppN_002.png)\n\n# 流程图结构\n\n有四种通流程图结构：\n\n*   顺序（Sequence）\n\
  *   选择（Decision）\n*   分支（Case）\n*   重复（Repetition）\n\n顺序结构表示一系列按顺序执行的动作或步骤。工资计算程序的流程图就是顺序结构的一个示例。下图图\
  \ N-3 中程序 2-20 中执行的步骤。\n\n# 图 N-3\n\n![流程图显示了一系列步骤。](img/FG_AppN_003.png)图 N-3 完整替代文本\n\
