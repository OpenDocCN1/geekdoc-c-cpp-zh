  \    ![图中显示了跨行的星号和井号符号。](img/Page_611.png)8.4-5 完整替代文本\n\n## 第 9 章搜索、排序与算法分析\n\n\
  *   当用户选择 `request tickets` 菜单选项时，程序应提示顾客所需的座位数、所需的行号以及所需的起始座位号。随后，应调用 `TicketManager`\
  \ 票务请求函数并传递这些信息，以便其处理票请求。如果请求的座位中有任何不存在或不可用，则应返回一个适当的消息由客户端程序显示。如果座位存在且可用，则应创建并返回一个字符串，列出请求的座位数量、请求行中每个座位的价格以及这些座位的总价。然后用户程序应询问顾客是否希望购买这些座位。\n\
  \n*   如果顾客表示他们想要购买请求的座位，应调用 `TicketManager` 购买座位模块来处理实际销售。该模块必须能够接收资金，确保资金足够继续销售；如果足够，则将座位标记为已售出，并创建并返回一个包含每个售出座位票的字符串（带有正确的行号、座位号和价格）。\n\
  \n*   当用户选择 `sales report` 菜单选项时，应调用 `TicketManager` 报告模块。该模块必须创建并返回一个包含报告的字符串，告知已售出多少座位、仍有多少座位可用，以及目前为止为售出座位收取了多少钱。考虑你的团队将如何计算或收集并存储这些信息，以便在需要报告时可以使用。\n\
  \n*   当票务销售日结束且选择了 `quit` 菜单选项时，程序需要能够将更新后的座位可用性数据写回文件。执行此操作明显的地方是在 `TicketManager`\
  \ 析构函数中。\n\n## 9.1 搜索算法简介\n\n## 概念\n搜索算法是在数据集中定位特定项目的方法。\n\n程序不仅不仅存储和处理存储在数组中的数据，还会在数组中搜索特定项目，这非常常见。本节将向你展示搜索数组的方法：线性搜索和二分搜索。每种方法都有优缺点。\n\
  \n### 线性搜索\n`linear search`（线性搜索）是一种非常简单的算法。也称为 `sequential search algorithm`（顺序搜索算法），它使用循环从第一个元素开始顺序遍历数组。它将每个元素与正在搜索的值进行比较，并在找到该值或遇到数组末尾时停止。如果正在搜索的值不在数组中，该算法将搜索到数组末尾。\n\
  \n以下是执行线性搜索的函数伪代码：\n\n```\n Set found to false\nSet position to −1\nSet index to\
  \ 0\nWhile index < number of elements and found is false\n   If array[index] is\
  \ equal to search value\n      found = true\n      position = index\n   End If\n\
  \   Add 1 to index\nEnd While\nReturn position\n```\n\n接下来的 `linearSearch` 函数是一个在整数数组上执行线性搜索的\
  \ C++ 代码示例。该具有 `size` 个元素的数组被用于搜索存储在 `value` 中的数字的出现情况。如果找到了该数字，则返回其数组下标。否则，返回 −1，表示该值不在数组中。\n\
  \n```cpp\n int linearSearch(const int array[], int size, int value)\n{\n   int index\
  \ = 0;        // 用作下标搜索数组\n   int position = −1;    // 用于记录搜索值的位置\n   bool found\
  \ = false;   // 用于指示是否找到该值的标志位\n                         //      初始化为 false，因为\n\
  \                         //      值尚未被找到\n   while (index < size && !found)\n  \
  \ {\n      if (array[index] == value)     // 如果找到了该值\n      {\n          found =\
  \ true;              // 设置标志位\n          position = index;          // 记录值的下标\n\
  \      }\n      index++;                       // 移动到下一个元素\n   }\n   return position;//\
  \ 返回位置，或 −1\n} \n```\n\n### 注意\n选择 −1 来表示在数组中未找到搜索值的原因是 −1 不是一个有效的下标。任何其他非有效的下标值也可用来指示此信号。\n\
  \n程序 9-1 是一个使用 `linearSearch` 函数的完整程序。它搜索五个元素的 `tests` 数组以寻找分数为 100。\n\n### 线性搜索的低效性\n\
  线性搜索的优点是简单。它很容易理解和实现。此外，它不要求数组中的数据按任何特定顺序排列。然而，它的缺点是效率低下。如果搜索的数组有 20000 个元素，线性搜索必须查看所有\
  \ 20000 个元素才能确定值不在数组中。\n\n在通常情况下，项目在数组开头找到或在结尾找到的概率相等。对于具有 N 个元素的数组，线性搜索平均需 N/2\
  \ 次尝试找到项目。如果数组有 20,000 个元素，平均将进行 10,000 次比较。当然，这假设项目在数组中。（N/2 是平均比较次数。最大比较次数总是 N。）\n\
  \n当线性搜索无法定位项目时，它必须与每个元素进行比较。随着失败尝试次数的增加，平均比较次数也随之增加。当速度很重要时，在大数组上应避免使用线性搜索。\n\n\
  ### 二分搜索\n`binary search`（二分搜索）是一种比线性搜索高效多的巧妙算法。它的唯一要求是数组中的值按升序或降序排列。如果数组值按 `ascending\
  \ order`（升序）存储，意味着它们从低到高排列。如果按 `descending order`（降序）存储，则从高到低排列。该算法不是测试数组的第一个元素，而是从中间元素开始。如果该元素恰好包含所需的值，则搜索结束。否则，中间元素的值大于或小于正在搜索的值。如果它大于所需值，则该值（如果在列表中列表中）将在数组的前半部分找到。如果它小于所需值，则该值（再次，如果在列表中）将在数组的后半部分找到。在任何情况下，一半的数组元素都被排除在进一步搜索之外。\n\
  \n如果在中间元素没有找到所需值，则对可能包含该值的区域重复该过程。例如，如果要搜索数组的后半部分，算法将立即测试*其*中间元素。这个过程一直持续，直到找到正在搜索的值或没有更多元素可以测试为止。\n\
  \n\n\n\n\n以下是一个对升序存储元素的数组进行二分查找的函数伪代码。\n\n```\n Set first to 0\nSet last to the\
  \ last subscript in the array\nSet position to −1\n Set found to false\nWhile found\
  \ is not true and first is less than or equal to last\n   Set middle to the subscript\
  \ halfway between first and last\n   If array[middle] equals the desired value\n\
  \      Set found to true\n      Set position to middle\n   Else If array[middle]\
  \ is greater than the desired value\n       Set last to middle − 1\n   Else\n  \
  \     Set first to middle + 1\n   End If\nEnd While\nReturn position\n```\n\n该算法使用了三个索引变量：`first`、`last`\
  \ 和 `middle`。`first` 和 `last` 变量标记了当前正在搜索数组部分的边界。它们被初始化为数组第一个元素和最后一个元素的下标。计算 `first`\
  \ 和 `last` 之间中间元素的下标，并将其存储在 `middle` 变量中。如果没有精确的中间元素，用于计算 `middle` 的整数除法将选择中点之前的那个元素。如果数组中间的元素不包含搜索值，则会调整\
  \ `first` 或 `last` 变量，以便在下次迭代中只搜索数组的上半或下半部分。这使得每次循环未能找到搜索值时，待搜索数组的部分减半。\n\n在下面的示例\
  \ C++ 代码，函数 `binarySearch` 用于对整数数组进行二分查找。第一个参数 `array` 具有 `size` 个元素，用于查找存储在 `value`\
  \ 中的数字出现的位置。如果找到了该数字，则返回其数组下标。否则，返回 −1，表示该值不在数组中。\n\n```\n int binarySearch(const\
  \ int array[], int size, int value)\n{\n   int  first = 0,          // First array\
  \ element\n        last = size − 1,    // Last array element\n        middle,  \
  \           // Midpoint of search\n        position = −1;      // Position of search\
  \ value\n   bool found = false;      // Flag to indicate if the value was found\n\
  \   while (!found && first <= last)\n   {\n     middle = (first + last) / 2;   \
  \   // Calculate midpoint\n     if (array[middle] == value)       // If value is\
  \ found\n     {\n        found = true;\n        position = middle;\n     }\n   \
  \  else if (array[middle] > value)   // If value is in lower half\n        last\
  \ = middle − 1;\n     else\n        first = middle + 1;           // If value is\
  \ in upper half\n   }\n   return position;\n}\n```\n\n`Program 9-2` 是一个使用 `binarySearch`\
  \ 函数的完整程序。它在员工 ID 数组中搜索特定值。\n\n## 警告！\n\n注意 `Program 8-2` 中的数组在初始化时值已经按升序排序。除非数组中的值是排序的，否则二分查找算法将无法正常工作。\n\
  \n## 二分查找的效率\n\n显然，二分查找比线性查找高效得多。每当它进行比较并未能找到所需项目时，它都会排除待搜索剩余部分的一半。例如，考虑一个拥有 20,000\
  \ 个元素的数组。如果二分查找在第一次尝试未找到项目，剩余待搜索的元素数量为 10,000 个。如果第二次尝试未找到项目，剩余待搜索的元素数量为 5,000 个。这个过程一直持续，直到二分查找找到所需值或确定其不在数组中。对于一个拥有\
  \ 20,000 个元素的数组，这最多需要 15 次比较。（与线性查找相比，后者平均需要进行 10,000 次比较！）\n\n使用 2 的幂来计算二分查找在任何大小的数组上可能需要的最大比较次数。（2\
  \ 的幂是 2 加上某个整数指数的幂）。只需找到大于数组元素数量的最小 2 的幂即可。这将告诉你找到一个元素或确定其不存在所需的最大比较次数。例如，在 50,000\
  \ 个元素的数组中找到一个项目最多需要进行 16 次比较（`2¹⁶ = 65,536`），在 1,000,000 个元素的数组中找到一个项目最多需要进行 20\
  \ 次比较（`2²⁰ = 1,048,576`）。\n\n## 9.2 搜索对象数组\n\n## 概念\n\n线性查找和二分查找也可以用于搜索对象数组中的条目。\n\
  \n```cpp\nclass Inventory {\nprivate:\n    string itemCode;\n    string description;\n\
  \    double price;\npublic:\n    Inventory(string code, string desc, double p) {\n\
  \        itemCode = code;\n        description = desc;\n        price = p;\n   \
