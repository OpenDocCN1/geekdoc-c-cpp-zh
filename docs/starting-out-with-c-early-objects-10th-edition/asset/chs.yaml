  **头文件：** `cmath`\n**描述：** 接受一个 `double` 参数。以 `double` 类型返回参数的以十数为对数。\n**示例：**\n\n\
  ```cpp\na = log10(m);\n```\n\n### `pow(m, n)`\n**头文件：** `cmath`\n**描述：** 接受两个 `double`\
