  \ 3-2 显示了一些表达式及其值。\n\n# 表 3-2 一些简单的 C++ 算术表达式及其值\n\n| 表达式 | 值 |\n| --- | --- |\n\
  | `5 + 2 * 4` | `13` |\n| `10 / 2 − 3` | `2` |\n| `8 + 12 * 2 − 4` | `28` |\n| `4\
  \ + 17 % 2 − 1` | `4` |\n| `6 − 3 * 2 + 7 − 1` | `6` |\n\n# 结合性\n\n结合性是运算符与其操作数结合的顺序。结合性可以是`从左到右`或`从右到左`。除法运算符的结合性是从左到右，因此它将左侧的操作数除以右侧的操作数。表\
  \ 3-3 显示了算术术运算符及其结合性。\n\n# 表 3-3 算术运算符的结合性\n\n| 运算符 | 结合性 |\n| --- | --- |\n| `(unary\
  \ negation) −` | 从右到左 |\n| `*  /  %` | 从左到右 |\n| `+ −` | 从左到右 |\n\n# 使用括号分组\n\n\
  数学表达式的部分可以用括号分组，以强制某些操作在其他操作之前执行。遇到一对括号时，括号内的表达式在任何外部表达式之前先求值。因此，在以下语句中，`a` 加上 `b`\
  \ 先求值。然后将其和除以 4。\n\n```\naverage = (a + b) / 4;\n```\n\n如果没有括号，`b` 将在将 `a` 加到结果之前除以\
  \ 4，因为除法运算符的优先级高于加法运算符。表 3-4 显示了更多表达式及其值。\n\n# 表 3-4 更多的算术表达式及其值\n\n| 表达式 | 值 |\n\
  | --- | --- |\n| `(5 + 2) * 4` | 28 |\n| `10 / (5 − 3)` | 5 |\n| `8 + 12 * (6 −\
  \ 2)` | 56 |\n| `(4 + 17) % 2 − 1` | 0 |\n| `(6 − 3) * (2 + 7) / 3` | 9 |\n\n# 将代数表达式转换为编程语句\n\
  \n在代数中，并不总是需要使用乘法运算符。然而，C++ 要求任何数学运算都需要一个运算符。表 3-5 显示了一些执行乘法的代数表达式和等效 C++ 表达式。\n\
  \n# 表 3-5 代数表达式与 C++ 乘法表达式对比\n\n| 代数表达式 | 操作 | C++ 等效表达式 |\n| --- | --- | --- |\n\
  | 6B | 6 乘以 B | `6 * B` |\n| (3)(12) | 3 乘以 12 | `3 * 12` |\n| 4xy | 4 乘以 x 乘以 y\
  \ | `4 * x * y` |\n\n在将某些代数表达式转换为 C++ 时，你可能需要插入代数表达式中未出现的括号。例如，看以下表达式：\n\n$$x =\
  \ \\frac{a + b}{c}$$\n\n要将其转换为 C++ 语句，`a` + `b` 必须包含在括号内，以便在和除以 `c` 之前将 `a` 与 `b`\
  \ 相加。\n\n```\nx = (a + b) / c;\n```\n\n表 3-6 显示了更多代数表达式及其 C++ 等效表达式。\n\n# 表 3-6\
  \ 更多的代数表达式和 C++ 表达式\n\n| 代数表达式 | C++ 表达式 |\n| --- | --- |\n| $y = 3\\frac{x}{2}$\
  \ | `y = x / 2 * 3;` |\n| $z = 3b + 4$ | `z = 3 * b + 4;` |\n| $a = \\frac{3x +\
  \ 2}{4}$ | `a = (3 * x + 2) / (4)` |\n\n# 幂\n\n与许多编程语言不同，C++ 没有幂运算符。计算幂需要使用库函数。C++\
  \ 库不是检查的地方，而是特殊函数的集合。将库函数视为执行特定操作的“程序”。其中一个库函数称为 `pow`，其目的是计算数的幂。以下是它的使用示例：\n\n\
  ```\narea = pow(4.0, 2);\n```\n\n该语句包含了对 `pow` 函数的调用。括号内的是参数。`pow` 函数将第一个参数作为第二个参数的幂。在这个例子中，`4.0`\
  \ 是 `2` 次幂。结果从函数返回并在语句中使用。`pow` 函数期望浮点数参数。在某些 C++ 编译器上，整数参数也可以，但由于许多编译器要求第一个参数为\
  \ `double`，这是我们书中的惯用方法。函数返回的值始终是 `double`。在这种情况下，`16.0` 从 `pow` 返回并赋值给变量 `area`。这在图\
  \ 3-3 中所示。\n\n# 图 3-3 pow 函数\n\n![图像显示了“pow”函数的使用](img/FG_03_003.png)图 3-3 替代文本\n\
  \n语句 `area = pow(4.0, 2)` 等同于以下代数语句：\n\n```\narea=4\n```\n\n这是另一个使用 `pow` 函数的示例。它将\
  \ 3 乘以 6 赋值给 `x`：\n\n```\nx = 3 * pow(6.0, 3);\n```\n\n以下语句显示 5 的 4 次幂：\n\n```\n\
  cout << pow(5.0, 4);\n```\n\n将 `pow` 视为一个接受两个数字并输出第三个数字的“黑盒”可能会有所帮助。输出的数字是第一个数字的第二个数字的幂，如图\
  \ 3-4 所示。\n\n# 图 3-4 作为黑盒的 pow 函数\n\n![图像将“pow”函数作为一个黑盒](img/FG_03_004.png)图 3-4\
