  \n*   *输入验证：决定程序如何处理小于 0 的输入*。\n\n### 10. 几何计算器\n\n编写一个程序，显示以下菜单：\n\n```几何计算器\n\
  \       1. 计算圆形面积\n       2. 计算矩形面积\n       3. 计算三角形面积\n       4. 退出\n输入选择 (1–4):\n\
  ```\n\n*   如果用户输入 `1`，程序应该询问半径并显示面积。使用 `3.14159` 作为 `Π`。\n*   如果用户输入 `2`，程序应该询问矩形的长度和宽度，然后显示矩形的面积。\n\
