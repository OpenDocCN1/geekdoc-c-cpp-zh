  # 16.2 函数模板\n\n## 概念\n\n函数模板是一种可以与各种数据类型工作的“泛型”函数。程序员编写规格，但为类型使用占位符。当编译器遇到对函数的调用时，它会检查所使用的数据类型。重载函数使得编程变得方便，因为对于一组函数只需要记住一个函数名称。然而，每个函数仍然必须编写。例如，考虑以下重载的\
  \ `square` 函数。\n\n```\nint square(int number)\n{\n   return number * number;\n}\n\
  double square(double number)\n{\n   return number * number;\n}\n```\n\n这两个函数之间唯一的区别是它们的返回值和参数的数据类型。在这种情况下，编写`函数模板`比编写重载函数更方便。\n\
  \n函数模板不是实际的函数，而是编译器用于生成更多函数的“模具”。在编写函数模板时，你不需要为参数、返回值或局部变量指定实际类型。相反，你使用`类型参数`（type\
  \ parameter）来指定一个泛型数据类型。当编译器遇到对函数的调用时，它会检查其参数的数据类型，并生成与这些类型工作的函数代码。\n\n这里是 `square`\
  \ 函数的函数模板：\n\n```cpp\ntemplate <class T>\nT square(T number)\n{\n   return number\
  \ * number;\n}\n```\n\n函数模板的开头由 `template` 前缀标记，它以关键字 `template` 开头。接下来是一组尖括号，其中包含模板中使用的一个或多个泛型数据类型。泛型数据类型以关键字\
  \ `class` 开头，后跟一个代表数据类型的参数名。给出的示例只使用了一个，命名为 `T`。（如果有多个，将用逗号隔开。）之后，函数定义按照通常方式编写，只是用类型参数替换了实际的数据类型名称。在示例中，函数头为\n\
  \n```\nT square(T number)\n```\n\n`T` 是类型参数或泛型数据类型。该头文件定义 `square` 为一个返回类型 `T` 值并使用同样类型\
  \ `T` 的参数 `number` 的函数。\n\n如前所述，编译器检查对 `square` 的每次调用并为 `T` 填充适当的数据类型。例如，以下调用使用了\
  \ `int` 参数：\n\n```cpp\nint y, x = 4;\ny = square(x);\n```\n\n此代码会导致编译器生成函数：\n\n\
  ```cpp\nint square(int number)\n{\n   return number * number;\n}\n```\n\n语句\n\n\
  ```cpp\ndouble y, d = 6.2\ny = square(d);\n```\n\n将导致生成函数\n\n```cpp\ndouble square(double\
  \ number)\n{\n   return number * number;\n}\n```\n\n\n\n\n\n程序 16-6 展示了如何使用此函数模板。\n\
  \n### 注意\n\n在函数模板中定义的所有类型参数必须在函数参数列表中至少出现一次。\n\n由于编译器在程序 16-6 中遇到了两次对 `square` 的调用，且每次调用的参数类型都不同，因此为函数的两个实例生成了代码：一个具有\
  \ `int` 参数和 `int` 返回类型，另一个具有 `double` 参数和 `double` 返回类型。这在图 16-1 中予以所示。\n\n# 图 16-1\
  \ 从函数模板生成的代码\n\n![一张图表显示了从函数模板生成的代码。](img/FG_16_001.png)图 16-1 完整替代文本\n\n注意程序 16-6\
  \ 中的模板在所有对 `square` 的调用之前出现。与普通函数一样，编译器在遇到对模板函数的调用时，必须已经知道模板的内容。因此，模板应该放置在程序的顶部或头文件中。\n\
  \n### 注意\n\n函数模板仅仅是函数的规范，其本身不会导致内存的使用。当编译器遇到对模板函数的调用时，会在内存中创建函数的实际实例。\n\n# `swap`\
  \ 函数模板\n\n在许多应用程序中，需要交换两个相同类型变量的内容。例如，在对整数数组排序时，需要如下函数：\n\n```cpp\nvoid swap(int\
  \ &a, int &b)\n{\n   int temp = a;\n   a = b;\n   b = temp;\n}\n```\n\n而在对字符串对象数组排序时，则需要如下函数：\n\
  \n```cpp\nvoid swap(string &a, string &b)\n{\n   string temp = a;\n   a = b;\n \
  \  b = temp;\n}\n```\n\n由于这两个函数在代码实现上的唯一区别是所交换变量的类型，因此这两个函数的逻辑以及所有其他类似函数的逻辑可以用一个模板函数来捕：\n\
  \n```cpp\ntemplate<class T>\nvoid swap(T &a, T &b)\n{\n   T temp = a;\n   a = b;\n\
  \   b = temp;\n}\n```\n\n这种模板函数在标准 C++ 编译器自带的库中是可以使用的。该函数在 `algorithm` 头文件中声明。程序\
  \ 16-7 演示了如何使用此库模板函数来交换变量对的内容。\n\n# 在函数模板中使用运算符\n\n本节稍早展示的 `square` 函数模板对其参数应用了运算符\
  \ `*`。只要传递给它的的参数类型支持 `*` 运算符，`square` 模板就能正常工作。例如，它适用于 `int`、`long` 和 `double` 等数值类型，因为所有这些类型都有乘法运算符\
  \ `*`。此外，`square` 模板将适用于任何重载了 `*` 运算符的用户定义类类型。如果对不支持 `*` 运算符的类型使用 `square`，则会导致错误。\n\
  \n始终记住，模板仅适用于支持模板中所用操作类型。例如，只有当类重载了 `<`、`<=` 和 `!=` 等关系运算符时，该类才能用于对类型参数应用这些运算符的模板。\n\
  \n例如，由于 `string` 类重载了所有关系运算符，因此它可以用于计算项目数组最小值的模板函数。程序 16-8 说明了这一点。\n\n# 带有多个类型的函数模板\n\
  \n函数模板中可以使用多个泛型类型。程序 16-9 是一个接受任何可打印类型并反向打印的模板示例。\n\n### 注意\n\n在模板中定义的每个类型参数必须在函数参数列表中至少出现一次。\n\
  \n# 使用函数模板重载\n\n函数模板也可以被重载。与普通函数一样，函数模板通过不同的参数列表进行重载。例如，`sum` 函数有两个版本程序 16-10，第一个版本接受两个参数，第二个版本接受三个。\n\
  \n还有其他使用模板进行重载的方法。例如，程序包含一个普通版本和一个模板版本。只要它们有参数列表，就可以共存。\n\n# 定义模板函数\n\n在定义模板函数时，先编写函数的非模板版本然后转换为模板可能会帮助。这种转换通过为函数加上适当的模板头来实现，例如\n\
  \n```cpp\ntemplate<class T>\n```\n\n然后系统地将类型替换为泛型类型 `T`。我们在定义 `swap` 函数时遵循了类似的步骤。\n\
  \n### 注意\n\n从 C++11 开始，你可以在 `template` 前缀中使用 `typename` 代替 `class`。因此 `template`\
  \ 前缀可以写成 `template <typename>`。\n\n# 思考点\n\n1. 16.6 编译器何时为函数模板生成代码？\n2. 16.7 函数\n\
