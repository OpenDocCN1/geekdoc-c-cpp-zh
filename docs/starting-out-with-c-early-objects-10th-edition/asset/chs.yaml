  \n### 14. 字符转换类\n\n创建一个 `CharConverter` 类，对字符串执行各种操作。它最初应该具有以下两个公共成员函数。你的老师可能会要求你向类中添加更多函数。\n\
  \n*   `uppercase` 成员函数接受一个字符串并返回其副本，并将所有小写字母转换为大写。如果字符已经是大写字母或不是字母，则保持原样。\n*   `properWords`\
