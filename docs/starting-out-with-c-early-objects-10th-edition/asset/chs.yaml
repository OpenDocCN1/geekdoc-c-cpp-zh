  \n# 8.5 范围 for 循环\n\n## 概念\n\n范围 for 循环是针对数组中每个元素的循环。范围 for 循环是在 C++11 中引入的。范围 for\
  \ 循环作用于数组，每次循环它都会将数组中的元素复制给变量。例如，如果你对八元素的数组使用范围 for 循环，它将迭代八次。第一次迭代时，变量将包含元素 0，第二次时包含元素\
  \ 1，以此类推。\n\n以下是范围 for 循环的通用格式：\n\n```\nfor(dataType rangeVariable : array)\n  \
  \  statement;\n```\n\n让我们仔细观察格式的各个部分：\n\n- `dataType`: 范围变量的数据类型。它必须与数组元素的数据类型相同，或者是元素可以转换的类型。\n\
  - `rangeVariable`: 范围变量的名称。该变量在每次循环中都会接收一个数组元素的值。在第一次循环中，它接收第一个元素的值。\n- `array`:\
  \ 你希望循环操作的数组名称。\n- `statement`: 在每次循环期间执行的语句。要在循环中执行多个语句，请将这些语句封装在大括号中。\n\n例如，假设你有如下的数组定义：\n\
  \n```\nint numbers[] = {3, 6, 9};\n```\n\n你可以使用范围 for 循环这样显示 `numbers` 数组的内容：\n\n\
  ```\nfor(int val : numbers)\n{\n    cout << \"The next value is \"; \n    cout <<\
  \ val << endl;\n}\n```\n\n由于 `numbers` 数组有三个元素，此循环将迭代三次。第一次迭代时，`val` 变量将接收 `numbers[0]`\
  \ 的值。第二次迭代时，`val` 将接收 `numbers[1]` 的值。第三次迭代时，`val` 将接收 `numbers[2]` 的值。这段代码将产生以下输出：\n\
  \n```\nThe next value is 3\nThe next value is 6\nThe next value is 9\n```\n\n\n\n\
  \n\n如果你愿意，可以使用第 2 章中引入的 `auto` 关键字来指定范围变量的数据类型，而不是由自己来指定。正如你记得的，它允许编译器根据初始化变量时使用的数据类型自动检测变量的数据类型。这里有一个示例：\n\
  \n```\nfor(auto val : numbers)\n{\n    cout << \"The next value is \"; \n    cout\
  \ << val << endl;\n}\n```\n\n程序 8-8 使用基于范围的 `for` 循环显示 `string` 数组的元素。\n\n# 使用范围的\
  \ `for` 循环修改数组\n\n当范围 `for` 循环执行时，它的范围变量仅包含数组元素的副本。因此，除非你将范围变量声明为引用，否则你无法使用范围 `for`\
  \ 循环来修改数组的内容。回想一下第 6 章，引用变量是另一个值的别名。对引用变量所的任何更改实际上都是对它所别名的值进行的。\n\n要将范围变量声明为引用变量，请在循环头中的名称前加上地址符（`&`）。程序\
  \ 8-9 显示了一个示例。它使用基于范围的 `for` 循环将用户输入的数据存储在数组中。\n\n注意在第 12 行，范围变量 `val` 的名称前面写有一个地址符（`&`）。这将\
  \ `val` 声明为引用变量。随着循环的执行，`val` 变量将不仅包含数组元素的副本，而是将是元素本身的别名。因此，对 `val` 变量所的任何更改实际上都是应用到它当前引用的数组元素上的。\n\
  \n相比之下，注意在第 20 行，范围变量的名称前面没有地址符。这是因为在这里没有必要将 `val` 声明为引用变量。此循环仅仅是显示数组元素，而不是改变它们。\n\
  \n# 范围的 `for` 循环与普通的 `for` 循环\n\n在任何你需要遍历数组所有元素且不需要使用元素下标的情况下，都可以使用范围的 `for` 循环。然而，在由于某些目的需要元素下标的情况下，它将无法工作。如果循环控制变量被用于访问两个或多个不同数组的元素，也无法工作。在这些情况下，你需要使用普通的\
  \ `for` 循环。\n\n### 注意\n\n你可以对引用范围变量使用 `auto` 关键字。例如，程序 8-9 中第 12 行到 16 行的代码可以写成：\n\
  \n```\nfor (auto &val : numbers)\n{\n   cout << \"Enter an integer value: \";\n\
  \   cin  >> val;\n}\n```\n\n# 8.6 处理数组内容\n\n## 概念\n\n单个数组元素的处理方式与其他变量相同。\n\n处理数组元素与处理变量没有区别。例如，以下语句将\
  \ `hours[3]` 乘以变量 `rate`：\n\n```\npay = hours[3] * rate;\n```\n\n以下是对数组元素进行自增和后自增操作的示例：\n\
  \n```\nint score[5] = {7, 8, 9, 10, 11};\n++score[2];    // 对 score[2] 中的值进行自增操作\n\
  score[4]++;    // 对 score[4] 中的值进行后自增操作\n```\n\n### 注意\n\n使用递增递减运算符时，注意不要将下标与数组元素混淆。下面的示例说明了这种区别。\n\
  \n```\namount[count]--;  // 递减存储在 amount[count] 中的值\namount[count--];  // 递减变量 count，但\n\
  \                  // 对存储在 amount[count] 中的值什么都没做\n```\n\n程序 8-10 展示了在简单语句中使用数组元素。数组元素可以在简单语句中使用。数组元素可以像普通变量一样用在关系表达式中。例如，以下\
  \ `if` 语句测试元素是否小于 0：\n\n```\nif (amount[count] < 0)\n   count++;\n```\n\n# 将一个数组复制到另一个\n\
  \n要将一个数组复制到另一个，不能简单地将一个数组赋值给另一个。相反，你必须一个一个地赋值。以下代码演示了如何这样做：\n\n```\nconst int SIZE\
  \ = 6;\nint arrayA[SIZE] = {10, 20, 30, 40, 50, 60};\nint arrayB[SIZE];\n\nfor (int\
  \ index = 0; index < SIZE; index++)\n{\n   arrayB[index] = arrayA[index];\n}\n```\n\
  \n# 比较两个数组\n\n正如不能用一个语句将一个数组复制到另一个，你不能用一个语句比较两个数组的内容。也就是说，你不能对数组名称使用 `==` 运算符判断它们是否相等。以下代码似乎在比较数组的内容，但实际上并没有：\n\
  \n```\nint arrayA[] = {5, 10, 15, 20, 25};\nint arrayB[] = {5, 10, 15, 20, 25};\n\
  \nif (arrayA == arrayB) // 这是一个错误\n   cout << \"The arrays are the same.\\n\";\n\
  else\n   cout << \"The arrays are not the same.\\n\";\n```\n\n当你对数组名称使用 `==` 运算符时，比较的是数组的起始地址，而不是数组的内容。代码中的两个数组显然不同的内存地址。因此，表达式\
  \ `arrayA == arrayB` 的结果为假。\n\n要比较两个数组的内容，你必须比较它们的单个元素。例如，看以下代码：\n\n```\nconst int\
  \ SIZE = 5;\nint arrayA[SIZE] = { 5, 10, 15, 20, 25 };\nint arrayB[SIZE] = { 5,\
  \ 10, 15, 20, 25 };\nbool arraysEqual = true;  // 标记变量\nint count = 0;         \
  \   // 循环计数变量\n\n// 确定元素是否包含相同的数据\nwhile (arraysEqual && count < SIZE)\n{\n    \
  \  if (arrayA[count] != arrayB[count])\n         arraysEqual = false;\n      count++;\n\
  }\n// 显示适当的消息\nif (arraysEqual)\n   cout << \"The arrays are equal.\\n\";\nelse\n\
  \   cout << \"The arrays are not equal.\\n\";\n```\n\n这段代码确定 `arrayA` 和 `arrayB`\
  \ 是否包含相同的值。一个初始化为 `true` 的 `bool` 变量 `arraysEqual` 表示数组是否相等。另一个变量 `count` 初始化为 0，用作循环计数器。\n\
  \n\n\n\n接后的 `while` 循环只要 `arraysEqual` 保持为 `true` 就会执行，这意味着目前没有发现差异，且 `count` 小于\
  \ `SIZE`，表示仍有元素需要比较。变量 `count` 同时也用作数组的下标。由于它在循环中不断递增，因此每次迭代都会比较一对不同的对应数组元素。如果它发现两个值不同的对应元素，则\
  \ `arraysEqual` 变量被设置为 `false`，这允许循环直接退出，而无需再检查其他值。循环结束后，通过一个 `if` 语句来测试 `arraysEqual`\
  \ 变量。如果该变量仍为 `true`，说明没有发现差异。数组是相等的，并显示一条指示此的消息。否则，它们不相等，将显示另一条消息。这段代码可以在书籍辅助网站的第\
  \ 8 章程序文件夹中的 `arrayCompare.cpp` 文件找到。\n\n# 数值数组值的求和\n\n要对数组中的值求和，必须使用一个带有累加器变量的循环。该循环将每个数组元素的值加到累加器中。例如，假设以下语句出现在程序中。\n\
  \n```cpp\n const int NUM_UNITS = 6;\nint units[NUM_UNITS] = {16, 20, 14, 8, 6, 10};\n\
  int total = 0;              // 初始化累加器\n```\n\n以下几行使用常规 `for` 循环将数组中每个元素的值加到 `total`\
  \ 变量中。代码完成后，`total` 将包含 `units` 数组元素的和。\n\n```cpp\n for (int count = 0; count <\
  \ NUM_UNITS; count++)\n   total += units[count];\n```\n\n在 C++ 11 中，你也可以使用基于范围的\
  \ `for` 循环来累计总和，如下所示：\n\n```cpp\n for (int val : units)\n    total += val;\n```\n\
  \n### 注意\n\n注意 `total` 被初始化为 0。回想第 5 章 累加器变量在使用它来保持运行总和之前必须设置为 0；否则，总和将是不正确的。\n\n\
  # 查找数值数组值的平均值\n\n计算数组中所有值的平均值的第一步是对这些值求和。第二步是将总和除以数组中的元素个数。假设以下语句出现在程序中。\n\n```cpp\n\
  \ const int NUM_SCORES = 5;\ndouble scores[NUM_SCORES] = {90, 88, 91, 82, 95};\n\
  ```\n\n以下代码计算 `scores` 数组值的平均值，并将结果存储在 `average` 变量中。\n\n```cpp\n double total =\
  \ 0;         // 初始化累加器\ndouble average;           // 将存储平均值\n\nfor (int count =\
  \ 0; count < NUM_SCORES; count++)\n    total += scores[count];\naverage = total\
  \ / NUM_SCORES;\n```\n\n与之前的示例相同，在 C++ 11 中可以使用基于范围的 `for` 循环来累计总和，而不是所示常规 `for`\
  \ 循环。无论选择哪种循环，将 `total` 除以 `NUM_SCORES` 以求平均值的语句都不应该放在循环内部。该语句应在循环完成所有迭代后执行一次。\n\
  \n# 查找数值数组中的最大值和最小值\n\n查找数组中最大和最小值的算法非常相似。首先，让我们查找数组中最大值的代码。假设以下语句出现在程序中。\n\n```cpp\n\
  \ const int SIZE = 10;\nint numbers[SIZE] = {15, 6, 3, 11, 22, 4, 0, 1, 9, 12};\n\
  ```\n\n查找数组中最大值的代码如下。\n\n```cpp\n int count, highest;\n\nhighest = numbers[0];\n\
  for (count = 1; count < SIZE; count++)\n{\n   if (numbers[count] > highest)\n  \
  \    highest = numbers[count];\n}\n```\n\n首先，我们将数组第一个元素的值复制到名为 `highest` 的变量中。然后循环从下标\
  \ 1 开始，将所有剩余数组元素与存储在 `highest` 中的值进行比较。每当在数组中发现大于 `highest` 的值时，就会将其复制到 `highest`。循环结束后，`highest`\
  \ 将包含数组中的最大值。\n\n以下代码查找数组中的最小值。如你所见，它与查找最大值的代码几乎相同。\n\n```cpp\n int count;\nint\
  \ lowest;\nlowest = numbers[0];\nfor (count = 1; count < SIZE; count++)\n{\n   if\
  \ (numbers[count] < lowest)\n      lowest = numbers[count];\n}\n```\n（注：原文最后代码块\
  \ `if (numbers[count] < lowest)` 有误，已根据查找最小值的逻辑修正。）\n\n当循环结束，`lowest` 将包含数组中的最小值。\n\
  \n# 部分数组\n\n有时你需要在数组中存储一系列项目，但你不知道确切的项目数量。因此，你必须使数组大到容纳可能的项目。部分填充数组通常配合一个变量使用，用于告知数组中有多少元素。例如，假设程序使用下面的代码。注意\
  \ `numValues` 被初始化为 0，因为尚未在数组中存储值。\n\n```cpp\n const int SIZE = 100;\nint array[SIZE];\n\
  int numValues = 0;\n```\n\n每次向数组添加项目时，必须递增 `numValues`。演示如下：\n\n```cpp\n int number;\n\
  cout << \"输入数字或输入 -1 退出：\";\ncin  >> number;\nwhile (number != -1 && numValues <\
  \ SIZE)\n{\n   array[numValues] = number;\n   numValues++;\n   cout << \"输入数字或输入\
  \ -1 退出：\";\n   cin  >> number;\n}\n```\n\n此哨兵控制循环的每次迭代允许用户输入一个数字存储在数组中，或输入 -1 退出。存储存储值后，`numValues`\
  \ 增加以持有可用元素的下标。当用户输入 -1 或 `numValues` 超过 99 时，循环停止。以下代码显示数组中所有的有效项目。\n\n```cpp\n\
  \ for (int index = 0; index < numValues; index++)\n{\n   cout << array[index] <<\
  \ endl;\n}\n```\n\n# 为什么要使用数组？\n\n程序 8-11 在数组中存储了一组数字以便求和并找到平均值、最大值最小值。然而，这完全可以在不使用数组的情况下完成。可以将销售数据逐个放入一个简单的变量中，加到总和，并在读取时与最大值和最小值进行比较。如下代码段所示：\n\
  \n```cpp\n dataIn >> salesAmt;     // 输入第一个办公室的数据\ntotalSales = highestSales = lowestSales\
  \ = salesAmt; \nfor (office = 2; office <= numOffices; office++)\n{   dataIn >>\
  \ salesAmt;\n    totalSales += salesAmt;\n    if (salesAmt > highestSales)\n   \
  \    highestSales = salesAmt;\n    else if (salesAmt < lowestSales)\n       lowestSales\
  \ = salesAmt;\n}\naverageSales = totalSales / numOffices;\n```\n\n\n\n那么为什么要使用数组呢？有很多原因。其中最重要的一点是，一旦数据进入数组，就可以多次使用，而无需重新输入。例如，假设我们不是要寻找最高和最低销售额，而是想创建一个报告，告诉我们哪些办公室的销售额低于平均水平。程序\
  \ 8-12 修改了程序 8-11 来实现这一点。请注意，这需要查看两次每条数据。首先，每个值都被输入并求和，以找到并显示平均值。然后再次检查每个数据值，以便将其与平均值进行比较，并显示任何低于平均值的值。\n\
  \n程序 8-12 还说明了部分填充数组的使用。它允许 `sales` 数组存储最多 20 个值，然后使用 `while` 循环的控制变量来计数从文件中读取时存储在其中的实际值数量。数据是从与程序\
  \ 8-11 使用相同的 `sales.dat` 文件中读取的。\n\n让我们来看程序 8-12 中的几个关键点。首先，看第 29 行。该行控制 `while`\
  \ 循环并读取数据。\n\n```cpp\nwhile (count < SIZE && dataIn >> sales[count])\n```\n\n只要\
  \ `count` 小于数组的大小且成功从文件中读取入一个数据值（即未遇到文件末尾），循环就会重复。`while` 循环测试表达式的第一部分 `count <\
  \ SIZE` 防止循环写入到数组边界之外。测试表达式的第二部分在文件中没有更多数据可读时停止循环。回想第 4 章，`&&` 运算符执行短路求值，因此 `while`\
  \ 循环测试表达式的第二部分 `dataIn >> sales[count]` 只在 `count` 小于 `SIZE` 时才会执行。第 17 行定义的 `sales`\
  \ 数组有空间存储最多 20 个值，但由于数据文件只有 12 个值，`while` 循环在读取这 12 项后就会终止。\n\n注意循环控制变量 `count`\
  \ 除了控制循环执行外，还起着两个作用。因为它初始化为零，并在每次循环迭代时在第 31 行增加，它记录了下一个读取的项目应该存储在哪个数组位置，正确地允许来自\
  \ `sales.dat` 文件的 12 个值存储在数组位置 0 到 11 中。它还记录了读取了多少值。当循环在我们的示例运行中终止时，`count` 为 12，等于读取的项目数。\n\
  \n我们说过，当数据值需要被查看多次时，使用数组特别有帮助。这正是在程序 8-12 中发生的情况。第 30 行的语句将每个存储的数据添加到它正在累积的所有值总中。该总和稍在第\
  \ 37 行用于计算平均值。然后，在第 49 到 53 行的 `for` 循环内部，再次检查每个存储的数据项，将其与平均值比较，如果低于平均值则显示。\n\n\
  当你继续编程时，你会遇到许多需要多次检查数据值的算法，并将发现许多数组是组织和存储数据的特别有用的方法。\n\n# 处理字符串\n\n字符串在内部存储为字符数组。它们与其他数组的区别在于，元素可以被视为一组字符，也可以作为一个单个实体。以下代码定义了一个\
  \ `string` 对象并将其作为单个实体处理。\n\n```cpp\nstring name;\ncout << \"Enter your name: \"\
  ;\ncin >> name;\ncout << \"Hello, \" << name << endl;\n```\n\n事实上，字符串是这样处理的。然而，C++\
  \ 提供了通过下标对其进行索引的能力，以便像数组一样处理它们。如果在之前的代码中输入了 `\"Warren\"`，它将存储在 `name` 对象中，如图 8-11\
  \ 所示。\n\n## 图 8-11 字符串存储为一组字符\n\n![name[0] 到 name[5] 显示了 ‘W’‘a’‘r’‘e’]()\n\n###\
  \ 注意\n\n`string` 对象和 C 字符串都存储为连续的字节，如图 8-11)所示。C 字符串通过在最后一个字符之后放置 `'\\0'` 来终止。然而，如果我们想像数组一样逐字符处理\
  \ `string` 对象，我们可以这样做。例如：\n\n```cpp\ncout << name[0];\ncout << name[1];\n```\n\n\
  程序 8-12 提供了逐字符处理的另一个示例。\n\n字符串处理的更多示例将在第 12 章介绍。\n\n8.7 使用并行数组\n\n## 概念\n\n通过使用相同的下标，你可以在多个数组之间建立联系。\n\
  \n有时将相关数据存储在多个数组中是有用的。当相关数据类型不同时，这特别有用。我们在程序 8-5 和 8-6 中这样做，其中 `name` 数组存储了 12 个月份的名字，`days`\
  \ 数组存储了给定月份的天数。月份名称和它的天数通过具有相同的下标相关。例如，`days[3]` 存储了 `month[3]` 中存储的月份的天数。\n\n当存储在两个或多个数组中的数据项以这种方式相关时，这些数组被称为*并行数组*。程序\
  \ 8-15 是工资资程序的变体，它使用了并行数组。一个 `int` 数组存储每个员工的工作小时，一个 `double` 数组存储每个员工的小时薪率。\n\n\
  注意在循环中，使用了相同的下标来访问两个数组。这是因为特定员工的数据存储在每个数组的相同相对位置。例如，1 号员工的工作小时存储在 `hours[0]` 中，该员工的薪率存储在\
  \ `payRate[0]` 中。下标将两个数组中的数据相关起来。这一概念在图 8-12 中得到了说明。\n\n\n\n\n![图表显示了两个相互平行的数组](img/FG_08_012.png)图\
  \ 8-12 完整备用文本\n\n## 检查点 (Checkpoint)\n\n1. 8.8 给定以下数组定义：\n   ```\n   int age[] =\
