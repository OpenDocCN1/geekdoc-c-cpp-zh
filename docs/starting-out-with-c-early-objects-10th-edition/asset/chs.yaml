  \ GB 数据。然后创建账单。它还应该显示 A 套客户购买 C 套可以节省多少钱。在可能的情况下，使用命名常量代替数字。\n\n# 第 5 章 循环\n\n##\
  \ 5.1 循环简介：`while` 循环\n\n## 概念\n\n循环是程序中重复的部分。\n\n第 4 章包含了几个根据学生的数字分数报告字母等级的程序。但如果我们想找出\
  \ 20 名学生班级中每个学生的字母等级呢？我们必须运行程序 20 次。如果我们能简单地指示代码在单次运行中重复 20 次，不是更方便吗？幸运的是，有一种机制可以做到这一点。它被称为循环。\n\
  \n*循环*是一种语句或一组语句重复的控制结构。C++ 有三种循环控制结构：`while` 循环、`do-while` 循环和 `for` 循环。这些循环之间的区别在于它们如何控制重复。\n\
  \n## `while` 循环\n\n`while` 循环有两个重要的部分：(1) 用于测试真假值的表达式，以及 (2) 只要表达式为真就会重复的语句或块。图\
  \ 5-1 显示了 `while` 循环的一般格式以及视觉化展示其工作原理的流程图。\n\n\n\n\n\n让我们来看一下 `while` 循环的每个部分。第一行有时称为*循环头*（loop\
  \ header），由关键字 `while` 后面跟一个括在括号内的待测试*条件*（condition）。该条件由任何可以求值为为真或为假的表达式表示。接下来是循环的*体部*（body）。它包含一个或多个\
  \ C++ *语句*（statements）。\n\n以下是循环的工作原理：测试条件表达式，如果为真，则执行循环体中的每条语句。然后，再次测试条件。如果它仍然为真，则再次执行每条语句。这个循环会一直重复，直到条件为假。\n\
  \n注意，与 `if` 语句一样，循环体内根据条件执行的每条语句都以分号结尾，但括号中的条件表达式后面没有分号。这是因为如果没有跟随其后的语句，`while`\
  \ 循环就是不完整的。此外，与 `if` 语句一样，当循环体包含两个或多个语句时，这些语句必须用大括号 `{}` 包起来。当循环体只包含一条语句时，可以省略大括号。本质上，`while`\
  \ 循环的作用就像一个可以反复执行的 `if` 语句。只要括号中的表达式为真，根据条件执行的语句就会重复。\n\n[Program 5-1] 使用 `while`\
  \ 循环打印五次“Hello”。\n\n让我们仔细观察这个程序。在第 7 行，定义了一个整数变量 `count` 并将其初始化为值 1。在第 9 行，`while`\
  \ 循环以该语句开始：\n\n```cpp\nwhile (count <= 5)\n```\n\n该语句测试变量 `count` 以确定其值是否小于或等于 5。因为值确实如此，循环体中的语句（第\
  \ 11 行和第 12 行）被执行：\n\n```\ncout << \"Hello   \";\ncount = count + 1;\n```\n\n第 11\
  \ 行的语句打印单词“Hello”。第 12 行的语句将 `count` 加 1，使其变为 2。这是循环体中的最后一条语句，因此在执行执行后，循环重新开始。它再次测试表达式\
  \ `count <= 5`，由于仍然为真，循环体中的语句再次被执行。这个循环不断重复，直到 `count` 的值等于 6，使得表达式 `count <= 5`\
  \ 为假。然后退出循环。这如图 5-2 所示。\n\n### 图 5-2 while 循环的工作原理\n\n![一张图像显示了 while 循环并解释了它的元素。](img/FG_05_002.png)\n\
  \n循环的每次执行被称为一次*迭代*（iteration）。在表达式 `count <= 5` 被测试并发现为假导致循环终止之前，此循环将执行五次迭代。程序随后从紧随循环后的语句继续执行。控制循环迭代次数的变量被称为*循环控制变量*（loop\
  \ control variable）。在我们刚刚看到的示例中，`count` 就是循环控制变量。\n\n### `while` 是预测试循环\n\n`while`\
  \ 循环是一个*预测试*（pretest）循环。这意味着它在每次迭代之前都会先测试其条件。如果测试表达式初始为假，循环将永远不会迭代。因此，如果你想确保 `while`\
  \ 循环至少执行一次，你必须以这种方式初始化相关数据，使得测试表达式开始为真。例如，注意 [Program 5-1] 第 7 行中 `count` 的变量定义：\n\
  \n```cpp\nint count = 1;\n```\n\n`count` 变量被初始化为 1。如果 `count` 被初始化为大于 5 的值（如下程序段所示），则循环将永远不会执行：\n\
  \n```cpp\nint count = 6;\nwhile (count <= 5)\n{\n   cout << \"Hello    \";\n   count\
  \ = count + 1;\n}\n```\n\n## 死循环\n\n在所有极少数情况下，循环必须包含一种终止方式。这意味着循环内部某些内容最终必须使测试表达式变为为假。[Program\
  \ 5-1] 中的循环在 `count <= 5` 变为假时停止。\n\n如果一个循环没有停止的方法，它被称为*死循环*（infinite loop）。死循环会不断重复。这里有一个示例：\n\
  \n```cpp\nint count = 1;\nwhile (count <= 5)\n{\n    cout << \"Hello   \";\n}\n\
  ```\n\n### 注意分号\n\n不小心在第一行后面放置分号也可能创建一个死循环。这里有一个示例：\n\n```cpp\nint count = 1;\n\
  while (count <= 5); // 错误：注意这个分号。\n{\n    cout << \"Hello   \";\n    count = count\
  \ + 1;\n}\n```\n\n因为编译器在第一行的末尾看到了分号。\n\n### 别忘记大括号\n\n如果你写了一个根据条件执行语句块的循环，请不要忘记将所有语句括在大括号中。如果不小心漏了大括号，`while`\
  \ 语句将只根据条件执行紧随的一条语句。例如，看下面的代码：\n\n```cpp\nint count = 1;\n// 这个循环缺少大括号！\nwhile (count\
  \ <= 5)\n    cout << \"Hello   \";\n    count = count + 1;\n```\n\n在这段代码中，只有一条语句（`cout`\
  \ 语句）位于 `while` 循环体内。增加 `count` 值的语句不在循环中，因此 `count` 的值保持为 1，循环测试条件保持为真。循环将不断打印“Hello”，直到用户停止程序。\n\
  \n### 不要混淆 `=` 和 `==`\n\n循环的另一个常见陷阱是在意图使用 `==` 运算符时，不小心使用了 `=` 运算符。以下是一个死循环，因为测试表达式在每次求值时都会将\
  \ 1 赋值给 `remainder`，而不是测试 `remainder` 是否等于 1：\n\n```cpp\nwhile (remainder = 1) //\
  \ 错误：注意赋值操作。\n{\n     cout << \"Enter a number: \";\n     cin  >> num;\n     remainder\
  \ = num % 2;\n}\n```\n\n记住，任何非零值都被求值为真。\n\n### 编程风格与 `while` 循环\n\n你可以创建这样的循环：\n\
  \n```cpp\nwhile (count <= 5) { cout << \"Hello   \"; count = count + 1; }\n```\n\
  \n然而，请避免这种编程风格。你应该配合 `while` 循环使用的编程布局风格与 `if` 语句相似：\n\n*   如果循环重复一条语句，它应该出现在 `while`\
  \ 语句之后的行，并缩进一级。\n\n*   如果循环重复一个语句块，该块应该从 `while` 语句之后的行开始，大括号内的每一行都应该缩进。\n\n在本章介绍的其他类型循环中，你将看到类似的布局风格。\n\
  \n\n\n\n\n既然你已经理解了 `while` 循环，让我们来看看它有多用。程序 5-2 修订了上一章中的程序 4-9，用以计算多个学生的字母等级成绩。\n\
  \n让我们来看看程序 5-2 的一些关键特征。`while` 循环的循环头位于第 28 行。循环体（包含每次迭代时要执行的语句）位于第 29 行和 57 行的大括号之间。循环控制变量是\
  \ `student`，它在循环之前的第 25 行初始化为 1。注意，该变量在循环内部的第 56 行被修改。这非常重要。因为每次通过循环时都会加 1，它最终将大于\
  \ `numStudents`，从而退出循环。虽然循环控制变量的主要目的是控制循环迭代的次数，但它也可以用于其他目的。注意程序 5-2 是如何在第 31 行和第\
  \ 32 行将其当前值作为用户提示的一部分显示出来的。\n\n## 检查点\n\n1. 5.1 以下每个 `while` 循环将显示多少行？\n\n    1.\
  \ ```cpp\n       int count = 1;\n       while (count < 5)\n       {  cout << \"\
  My favorite day is Sunday \\n\";\n          count = count + 1;\n       }\n     \
  \  ```\n\n    2. ```cpp\n       int count = 10;\n       while (count < 5)\n    \
  \   {  cout << \"My favorite day is Sunday \\n\";\n          count = count + 1;\n\
  \       }\n       ```\n\n    3. ```cpp\n       int count = 1;\n       while (count\
  \ < 5);\n       {  cout << \"My favorite day is Sunday \\n\";\n          count =\
  \ count + 1;\n       }\n       ```\n\n    4. ```cpp\n       int count = 1;\n   \
  \    while (count < 5)\n          cout << \"My favorite day is Sunday \\n\";\n \
  \         count = count + 1;\n       ```\n\n2. 5.2 执行以下代码行时会显示什么？\n\n    ```cpp\n\
  \    int count = 1;\n    while (count < 10)\n    {  cout << count << \"  \";\n \
  \      count = count + 2;\n    }\n    ```\n\n# 5.2 使用 `while` 循环进行输入验证\n\n## 概念\n\
  \n`while` 循环可以用于输入程序，直到输入可接受的数据为止重复。\n\n第 4 章引入了数据验证的概念，并展示了如何使用 `if` 语句验证用户输入的数据。然而，`if`\
  \ 结构只能捕捉一个错误值。如果用户在被提示重新输入原始值后输入了第二个错误值，它将不会被检查。\n\n`while` 循环解决了这个问题，特别对于验证输入非常有用。如果输入了无效值，循环可以要求用户多次重新输入，直到接收到可接受的值为止。例如，以下循环要求输入\
  \ 1 到 100 范围内的数字：\n\n```cpp\ncout << \"Enter a number in the range 1 − 100: \";\n\
  cin  >> number;\nwhile ((number < 1) || (number > 100))\n{\n   cout << \"ERROR:\
  \ Enter a value in the range 1 − 100: \";\n   cin  >> number;\n}\n```\n\n这段代码首先允许用户输入一个数字。这发生在循环之前。如果输入是有效的，`while`\
  \ 条件为假，循环将不会执行。然而，如果输入是无效的，`while` 条件为真，循环体中的语句将执行。它们将显示错误消息并要求用户输入另一个数字。循环将继续执行，直到用户输入有效数字为止。执行输入验证的通用逻辑如图\
  \ 5-3 所示。\n\n# 图 5-3 使用 while 循环进行输入验证\n\n![显示了一个部分流程图。](img/FG_05_003.png) 图 5-3\
  \ 文本\n\n发生在循环之前的第一次读取操作被称为引导读取（priming read）。它为循环提供了第一个值。如果需要，后续值由循环获得。程序 5-3 根据给定的人数和每队人数计算该联赛可能创建的足球球队数量。程序使用\
  \ `while` 循环（第 26 到 32 行以及 37 到 41 行）来验证输入。\n\n## 5.3 增减运算符\n\n## 概念\n\nC++ 了一了一对用于增减变量的运算符。增一个值意味着增加它，减一个值意味着减少它。在示例中，`qtyOrdered`\
  \ 增了 10，`numSold` 减了 3。\n\n```cpp\nqtyOrdered = qtyOrdered + 10;\nnumSold = numSold\
  \ - 3;\n```\n\n虽然变量中的值可以增加或减少任何数量，但将其增加或减少 1 是非常常见的。我们在程序 5-1 和 5-2 中，在每次 `while`\
  \ 循环迭代时将循环控制变量增了 1。事实上，将变量的值增加或减少 1 是如此常见，以至于当我们说一个值增或减而没有指定具体数值时，默认它是增或减了 1。C++\
  \ 提供了一对运算符来执行此操作。它们都是一元运算符。这意味着它们只操作一个操作数。`++` 运算符将其操作数加 1。`--` 运算符将其操作数减 1。例如，在表达式\
  \ `num++` 中，单个操作数是变量 `num`。该表达式将其增加了 1。\n\n### 注意\n\n表达式 `num++` 读作“num plus plus”，“num--”\
  \ 读作“num minus minus”。是变量 `num` 的值增 1 的三种不同方式：\n\n```cpp\nnum = num + 1;\nnum +=\
  \ 1;\nnum++;    // 该语句使用了增运算符\n```\n\n这里是将其减 1 的三种不同方式：\n\n```cpp\nnum = num - 1;\n\
  num -= 1;\nnum--;    // 该语句使用了减运算符\n```\n\n注意，`++` 中的两个加号之间或它们与被增变量名之间没有空格。同样，`--`\
  \ 中的两个减号之间或它们与被减变量名之间也没有空格。还要注意 `++` 和 `--` 运算符不能作用于字面量。它们只能操作左值（lvalue），例如变量。以下是使用\
  \ `++` 和 `--` 的合法和非法表达式示例。\n\n```cpp\ncount++;       // 合法\ncount--;        // 合法\n\
  5++            // 非法\n5--            // 非法\n```\n\n程序 5-4 展示了 `++` 和 `--` 运算符的正确用法。它使用其中的每一个来改变循环控制变量的值。\n\
  \n## 后置和前缀模式\n\n我们目前为止的示例显示了后后置模式增减运算符，这意味着运算符放在变量之后。运算符也适用于前缀模式，即运算符放在变量名之前。程序\
  \ 5-4 的第 14 行和第 22 行的语句可以这样写：\n\n```cpp\n++countUp;\n--countDown;\n```\n\n在前缀和后置模式下，这些运算符都对其操作数加\
  \ 1 或减 1。那么它们之间的区别是什么呢？\n\n\n\n\n在像程序 5-4 中使用的那些简单语句中，没有区别。然而，当这些运算符被用于不仅仅是增加或减少变量的语句时，这种区别就非常重要。例如，看以下几行：\n\
  \n```\nnum = 4;\ncout << num++;\n```\n\n这条 `cout` 语句做了两件事：显示 `num` 的值并增加 `num`。但哪个先发生呢？如果\
  \ `num` 先增加，`cout` 显示的值将与最后增加时不同。答案取决于递增运算符的模式。\n\n后置模式（Postfix mode）导致递增在变量值在表达式中使用之后发生。在示例中，`cout`\
  \ 将显示 4，然后 `num` 将增加到 5。然而，前缀模式（Prefix mode）会导致先执行递增。在以下语句中，`num` 将先增加到 5，然后 `cout`\
  \ 将显示 5：\n\n```\nnum = 4;\ncout << ++num;\n```\n\n程序 5-5 通过在 `cout` 语句中放置递增和递减运算符，进一步说明了这些动态变化。这使得很容易看出在前缀模式和后置模式下使用它们的区别。然而，通常不应该这样做。也就是说，在实际编程应用中，不建议在\
  \ `cout` 语句中使用递增或递减运算符。\n\n让我们分析该程序中的语句。在第 8 行，`num` 初始化为值 4，因此第 11 行的 `cout` 语句显示\
  \ 4。然后，第 12 行将表达式 `num++` 发送到 `cout`。由于 `++` 运算符以后置模式使用，值 4 首先被送到 `cout`，然后 `num`\
  \ 加 1，使其其值变为 5。\n\n当执行第 13 行时，`num` 将保持值 5，因此显示 5。然后，第 14 行将表达式 `++num` 发送到 `cout`。由于\
  \ `++` 运算符以前缀模式使用，1 先加到 `num` 上（使其变为 6），然后将值 6 发送到 `cout`。同样的事件序列发生在第 17 行到第 20\
  \ 行之间，只是这里使用的是 `--` 运算符。\n\n对于另一个例子，看以下代码：\n\n```\nint x = 1;\nint y;\ny = x++;\
  \    // 后置递增\n            // 将 x 的旧值赋值给 y，然后增加 x\n```\n\n第一条语句定义了变量 `x`（初始化值为 1），第二条语句定义了变量\
  \ `y`。第三条语句做了两件事：\n\n* 它将 `x` 的值（即 1）赋值给变量 `y`。\n* 然后变量 `x` 增加。\n\n在语句执行后，`y` 将包含\
  \ 1，`x` 将包含 2。现在让我们看看相同的代码，但在前缀模式下使用 `++` 运算符：\n\n```\nint x = 1;\nint y;\ny = ++x;\
  \    // 前缀递增\n```\n\n这次第三条语句在前缀模式下使用 `++` 运算符，因此在赋值发生之前变量 `x` 增加了。代码执行后，`x` 和 `y`\
  \ 都将包含 2。\n\n# 在数学表达式中使用 `++` 和 `--`\n\n递增和递减运算符也可以用于数学表达式中的变量。就像在算术表达式中，后置模式和前缀模式的区别至关重要。考虑以下程序段：\n\
  \n```\na = 2;\nb = 5;\nc = a * b++;\ncout << a << \" \" << b << \" \" << c;\n```\n\
  \n在语句 `c = a * b++` 中，`c` 被赋值为 `a` 乘以 `b` 的值，即 10。然后变量 `b` 增加，因此 `cout` 语句将显示\n\n\
  ```\n2 6 10\n```\n\n如果我们将语句改为\n\n```\nc = a * ++b;\n```\n\n变量 `b` 在乘以 `a` 之前就会增加，因此\
  \ `cout` 语句将显示\n\n```\n2 6 12\n```\n\n你可以使用递增和递减运算符在单个语句中封装很多操作，但不要把它们玩得太花。你可能会倾向于尝试类似下面的代码，认为\
  \ `c` 将赋值为 11：\n\n```\na = 2;\nb = 5;\nc = ++(a * b);    // 错误！\n```\n\n但这条赋值语句根本无法工作，因为正如前面提到的，递增和递减运算符的操作操作数必须是一个左值（lvalue）。\n\
  \n# 在关系表达式中使用 `++` 和 `--`\n\n`++` 和 `--` 运算符也可以用于关系表达式。就像在算术表达式中，后置模式和前缀模式的区别至关重要。考虑以下程序段：\n\
  \n```\nx = 10;\nif (x++ > 10)\n    cout << \"x is greater than 10\";\n```\n\n这个\
  \ `if` 语句中发生了两个操作：测试 `x` 的值是否大于 10，然后 `x` 增加。由于使用了后置模式，10 并不 10，因此 `if` 语句不会执行。然而，如果使用前缀模式，`x`\
  \ 在 `if` 条件之前就会增加：\n\n```\nx = 10;\nif (++x > 10)\n    cout << \"x is greater than\
  \ 10\";\n```\n\n## Checkpoint\n\n5.3. 以下各项将显示什么？\n\n1.\n```\nx = 1;\ny = x++;\n\
  ```\n2.\n```\nx = 1;\ny = ++x;\n```\n3.\n```\nx = 1;\ny = x++;\n```\n4.\n```\nx\
  \ = 1;\ny = ++x;\n```\n5.\n```\nx = 99;\nif (x++ < 100)\n    cout << \"true\";\n\
  ```\n6.\n```\nx = 99;\nif (++x < 100)\n    cout << \"true\";\n```\n\n## 5.4 计数器\n\
  \n## Concept\n\n计数器是一个在每次循环迭代时都会被定期增加或减少的变量。\n\n有时，程序跟踪循环执行的次数是非常重要的。例如，程序 5-6 显示\
  \ 1 到 5 的数字以及它们的平方，因此它的循环必须迭代五次。\n\n在程序 5-6 中，循环控制变量 `num` 从 1 开始，每次循环都会增加。当 `num`\
  \ 达到 6 时，条件 `num <= 5` 变为假，退出循环。变量 `num` 也充当了*计数器*，记录目前为止循环迭代的次数。注意程序第 15 行中 `num`\
  \ 的增加。因为计数器通常按 1 计数，因此经常使用递增运算符。\n\n## Note\n\n正确初始化 `num` 是很重要的。记住，函数内部定义的变量没有确定的值。\n\
  \n# 5.5 保持运行总和\n\n## Concept\n\n运行总和是在每次循环迭代时累加的数字和。用于保持运行总和的变量被称为累加器（accumulator）。\n\
  \n\n\n\n许多编程任务需要你累加一系列数字。例如，如果你想找到一组数字的平均值，必须先将它们相加。累加一系列数字的程序通常使用两个元素：\n\n*   一个用于读取序列中每个数字的循环。\n\
  *   一个在读取数字时将这些数字累加到总和中的变量。\n\n用于累加数字总和的变量被称为 `accumulator`（累加器）。人们通常说该循环保持了一个 `running\
  \ total`（运行总和），因为它在读取序列中的每个数字时都会将其累加到其中。图 5-4 显示了计算运行总和的循环的通用逻辑。\n\n# 图 5-4 使用循环保持运行总和\n\
  \n![一个流程图显示了使用循环保持运行总和的方法](img/FG_05_004.png)图 5-4 完整备用文本\n\n当循环结束时，`accumulator`\
  \ 将包含循环读取的数字的总和。注意流程图的第一步是将 `accumulator` 变量设置为 `0`。这是一个关键步骤。循环每读取一个数字，就会将该数字加到\
  \ `accumulator` 中。如果 `accumulator` 的初始值是 `0` 的其他任何值，那么当循环结束时它将不会包含正确的总和。\n\n让我们来看一个保持运行总和的程序。程序\
  \ 5-8 通过读取每日销售额并将其加到 `accumulator` 中，计算了某公司一周的总销售额。\n\n让我们更仔细地观察一下该程序中的几行关键代码。第\
  \ 9 行创建了一个名为 `NUM_DAYS` 的具名常量，其设置为 `5`。这将被用于控制从第 17 行开始的循环迭代次数。在第 12 行，定义了 `totalSales`\
  \ 变量。这就是 `accumulator`。注意它被初始化为 `0`。在第 10 行定义的变量 `day` 在第 16 行（即循环开始前）被赋值为 `1`。该变量是控制循环的计数器，用于跟踪当前正在读取和处理哪一天的销售额。循环测试条件规定，只要\
  \ `day` 小于或等于 `NUM_DAYS`，循环就会重复。第 22 行在每次循环迭代结束时将 `day` 加 1。\n\n在每次循环迭代中，第 20 行由用户输入某一天的销售金额。该金额存储在\
  \ `dailySales` 变量中。然后，在第 21 行，该金额被加到 `totalSales` 变量中有的值上。注意，第 21 行并不是将 `dailySales`\
  \ *赋值*给 `totalSales`，而是通过 `dailySales` 的金额来*增加* `totalSales` 中存储的值。在循环完成所有迭代后，`totalSales`\
  \ 将包含所有录入的每日销售总额，并在第 26 行显示出来。\n\n# 5.6 哨兵 (Sentinels)\n\n## 概念\n\n哨兵是一个标记值列表结束的特殊值。\n\
  \n上一节中的程序 5-8 使用了一个具名常量来指示内有销售额数据的天数。它的循环随后迭代相应的次数，允许用户输入销售数据。但如果这个数字是可以变动的呢？在这种情况下，我们可以要求用户输入天数。当用户知道要输入和处理的项目数量时，这种方法是有效的。然而，有时用户并不知道有多少项。\n\
  \n在这种情况下可以使用的一种技术是要求用户在列表末尾输入一个哨兵。`sentinel` 是一个特殊值，它不会被误认为是列表的成员，并标志着没有更多值需要输入。允许数据输入的循环会持续迭代，直到用户输入哨兵。然后循环终止。这种循环被称为\
  \ `sentinel-controlled loop`（哨兵控制循环）。\n\n程序 5-9 包含一个哨兵控制循环。该程序计算一支足球队在一系列比赛中获得的总分。它允许用户输入到目前每场比赛的得分，然后输入\
  \ `−1` 来指示列表的结束。\n\n值 `−1` 被选作哨兵。\n\n## 检查\n\n1.  5.4 在下面的程序中，哪个变量是计数器，哪个是累加器？\n\
  \n```\nint number, maxNums, x = 0, t = 0;\ncout << \"你想输入多少个数？\";\ncin >> maxNums;\n\
  while (x < maxNums)\n{\n   cout << \"输入数字：\";\n   cin >> number;\n   t += number;\n\
  \   x++;\n}\ncout << \"这些数的总和为 \" << t << endl;\n```\n\n2.  5.5 找到下面尝试累加代码中的错误。\n\
  \n```\nint val, count, sum;\ncout << \"我将累加 5 个数\";\nwhile (count < 5)\n{\n   cout\
  \ << \"输入一个数字：\";\n   cin >> val;\n}\ncout << \"和是 \" << sum << endl;\n```\n\n3.\
  \  5.6 写一个哨兵控制的 `while` 循环，累加用户输入的分数，直到输入 99 为止。代码还应统计分数数量。不要将 99 计入分数。\n\n\n\n\n\
  当你想要确保循环至少执行一次时，应该使用 `do-while` 循环。例如，程序 5-10 在用户是否想用另一组分数重复过程之前，计算并显示一组测试分数的平均值。与\
  \ `while` 循环一样，`do-while` 循环可以写为迭代固定次数，也可以允许用户控制循环的次数。程序 5-10 了让用户控制循环的另一种方法。只要用户输入“Y”或“y”表示是，循环就会重复。\n\
  \n## `toupper` 函数\n\n让我们仔细观察 程序 5-10 中包含 `do-while` 循环测试表达式的行。\n\n```\nwhile (again\
  \ == 'Y' || again == 'y');\n```\n\n注意如何使用逻辑或运算符 `||` 允许用户输入大写或小写的“Y”来执行循环的下一次迭代。\n\
  \n虽然这种方法测试这两个字符时效果良好，但使用名为 `toupper`（读作“to upper”）的 C++ 函数可以更容易实现。该函数接收一个字符并返回该字符的整数\
  \ ASCII 代码。如果接收到的字符是小写字母，它返回其对应大写字母的 ASCII 代码。如果接收到的字符不是小写字母，它则返回所传入原始字符的 ASCII\
  \ 代码。\n\n如果打印 `toupper` 返回的值，打印的将是 ASCII 代码。然而，如果将其赋值给一个 `char` 变量并打印，打印的将字符本身。以下示例说明了这一点。\n\
  \n```\nchar letter1, letter2, letter3;\n\nletter1 = toupper('?');\ncout << letter1;\
  \          // 显示 ?\n\nletter2 = toupper('A');\ncout << letter2;          // 显示 A\n\
  \nletter3 = toupper('b');\ncout << letter3;          // 显示 B\n\ncout << toupper('c');\
  \     // 显示 67，即 C 的 ASCII 代码\n```\n\n在第一个示例中，传递给 `toupper` 函数的字符根本不是字母，因此返回相同字符的\
  \ ASCII 代码并赋值给 `letter1` 用于打印。在第二个示例中，传递给 `toupper` 的字符已经是大写字母，因此再次返回接收到的相同字符的 ASCII\
  \ 代码。在第三个示例中，`toupper` 接收到一个小写字母，因此返回其对应大写字母的 ASCII 代码。在最后一个示例中，`toupper` 再次接收到一个小写字母并返回其对应大写字母的\
  \ ASCII 代码。然而，这次打印的是返回的值而不是赋值给 `char` 变量，因此显示的是 ASCII 代码本身的整数值。\n\n传递给 `toupper`\
  \ 的值不需要是字符字面量。它也可以是字符变量，如下：\n\n```\nchar letter1 = 'b';\nchar letter2 = toupper(letter1);\
  \   // 现在 letter2 的值是 'B'\n```\n\n`toupper` 函数在用于 `do-while` 循环的测试表达式时特别有用。它可以测试存储用户输入的变量，以检查在询问是否再次迭代循环时，用户是否输入了“Y”或“y”。以下两个\
  \ `do-while` 测试在逻辑上是等价的：\n\n```\nwhile (again == 'Y' || again == 'y');\nwhile (toupper(again)\
  \ == 'Y');\n```\n\n重要的是，最后一个测试表达式不会改变存储在 `again` 变量中的值。相反，它将 `toupper` 返回的值与一个字符字面量进行比较。要实际更改\
  \ `again` 中存储的值，必须将函数返回的值赋值给它，如下：\n\n```\nagain = toupper(again);\n```\n\nC++ 提供了一个类似的函数来将大写字母转换为其对应的小写字母。该函数名为\
  \ `tolower`（读作“to lower”）。以下是它的两个用法示例：\n\n```\nwhile (tolower(again) == 'y');\n\
  again = tolower(again);\n```\n\n### 注意\n\n要使用 `toupper` 和 `tolower`，你必须在程序中包含 `cctype`\
  \ 头文件。可以使用以下语句包含它：\n\n```\n#include <cctype>\n```\n\n## 在菜单中使用 `do-while`\n\n`do-while`\
  \ 循环是重复菜单的良好选择。回想 程序 4-27\n{\n    statement;\n    statement;\n    //  根据需要在此放置尽可能多的语句。\n\
  }\n```\n\n与你使用的其他循环一样，如果循环体中只有一个语句，可以省略括号。\n\n## 检查点\n\n1. 5.7 下一个程序将显示什么？\n```\n\
  int count = 3;\ndo\n    cout << \"Hello World\\n\";\n    count++;\nwhile (count\
  \ < 5);\n```\n\n2. 下一个程序将显示什么？\n```\nint val = 5;\ndo\n    cout << \" \";\nwhile\
  \ (val >= 5);\n```\n\n3.\n```\nint count = 0, number = 0, limit = 0;\ndo\n{\n  \
  \  number++;\n    count++;\n} while (count < limit);\ncout << number;\n```\n\n2.\
  \ 5.8 编写一个 `do-while` 循环，显示用户输入的整数是偶数还是奇数。代码随后询问用户是否想测试另一个数字。只要用户输入“Y”或“y”，循环就会重复。在\
  \ `do-while` 循环测试表达式中使用逻辑或运算符 `||`。\n\n3. 5.9 修改你对问题 5.8 的答案，在 `do-while` 循环测试表达式中使用\
  \ `toupper` 函数。\n\n\n\n\n`for` 循环的第一行是 `loop header`（循环头）。在关键字 `for` 之后，括号内有三个表达式，用分号分隔。（注意第三个表达式后面没有分号。）第一个表达式是\
  \ `initialization expression`（初始化表达式）。它通常用于将计数器初始化为起始值。这是循环执行的第一个动作，且只执行一次。\n\n\
  第二个表达式是 `test expression`（测试表达式）。它的测试方式与 `while` 和 `do-while` 循环中的测试表达式相同，用于控制循环的执行。只要该条件为真（true），`for`\
  \ 循环体就会重复执行。与 `while` 循环一样，`for` 循环是一个预测试循环，因此在每次迭代之前都会评估测试表达式。\n\n第三个表达式是 `update\
  \ expression`（更新表达式）。它在每次迭代结束时执行，在再次测试表达式之前执行。通常，这是一个增加循环计数器变量的语句。\n\n这里是一个简单的 `for`\
  \ 循环示例，打印五次“Hello”：\n\n```\nfor (count = 1; count <= 5; count++)\n    cout << \"\
  Hello\" << endl;\n```\n\n在这个循环中，初始化表达式是 `count = 1`，测试表达式是 `count <= 5`，更新表达式是 `count++`。循环体包含一条语句，即\
  \ `cout` 语句。图 5-6 展示了循环执行期间发生的事件序列。注意，只要测试表达式为 `true`，步骤 2 到 4 就会重复执行。\n\n# 图 5-6\
  \ for 循环的工作原理\n\n![一张图像显示了一个“for”循环并解释了它的元素。](img/FG_05_006.png)图 5-6 完整替代文本\n\n\
  图 5-7 以流程图的形式显示了循环的逻辑。\n\n# 图 5-7 打印五次语句的 for 循环逻辑\n\n![部分流程图显示了打印五次语句的“for”循环的逻辑。](img/FG_05_007.png)图\
  \ 5-7 完整替代文本\n\n注意计数器变量 `count` 如何控制循环迭代的次数。它从值 1 开始，并在每次循环迭代后递增。只要表达式 `count <=\
  \ 5` 保持为真，循环就会再次迭代。然而，在第五迭代之后，`count` 将变为 6。这会导致测试表达式变为假，因此循环终止。还要注意，在这个示例中，`count`\
  \ 变量仅用于循环头以控制循环迭代的次数。它没有用于任何其他目的。然而，在循环体内使用计数器变量也是可能的。例如，查看以下代码：\n\n```\nfor (number\
  \ = 1; number <= 5; number++)\n    cout << number << \" \";\n```\n\n此循环中的计数器变量是\
  \ `number`。除了控制迭代次数外，它也被用于循环体。此循环将产生以下输出：\n\n```\n1 2 3 4 5\n```\n\n你可以看到，循环在每次迭代期间都会显示\
  \ `number` 变量的内容。\n\n程序 5-12 是 程序 5-6 的新版本，它使用 `for` 循环代替 `while` 循环显示数字 1–5 及其平方值。\n\
  \n## `for` 循环是一个预测试循环\n\n由于 `for` 循环在执行迭代之前会测试其表达式，因此可以编写一个永远不会迭代的 `for` 循环。这是一个示例：\n\
  \n```\nfor (count = 11; count <= 10; count++)\n    cout << \"Hello\" << endl;\n\
  ```\n\n由于变量 `count` 初始化为一个从一开始就让测试表达式为假的值，循环体从不被执行。该循环一开始就会终止。\n\n# 避免修改计数器变量\n\n\
  由于 `for` 循环在执行迭代之前会测试其表达式，因此可以编写一个永远不会迭代的 `for` 循环。这是一个示例：\n\n```\nfor (count =\
  \ 11; count <= 10; count++)\n    cout << \"Hello\" << endl;\n```\n\n由于变量 `count`\
  \ 初始化为一个从一开始就让测试表达式为假的值，循环体从不被执行。该循环一开始就会终止。\n\n\n\n\n\n```\nfor (int x = 1, y =\
  \ 1; x <= 5; x++, y++)\n{\n    cout << x << \" plus \" << y << \" equals \" << (x\
  \ + y) << endl;\n}\n```\n\n循环的更新表达式同时递增了 `x` 和 `y` 变量。该循环产生的输出为：\n\n```\n1 plus\
  \ 1 equals 2\n2 plus 2 equals 4\n3 plus 3 equals 6\n4 plus 4 equals 8\n5 plus 5\
  \ equals 10\n```\n\n在初始化表达式和更新表达式中，允许用逗号连接多个语句，但在测试表达式中是不这样做。如果你想在测试表达式中组合多个表达式，必须使用\
  \ `&&` 或 `||` 运算符。\n\n以下是一个实现此功能的 `for` 循环头部示例：\n\n```\nfor (int count = 1; count\
  \ <= 10 && moreData; count++)\n```\n\n只要 `count` 小于 `10` 且布尔变量 `moreData` 为真，该循环就会执行。一旦其中任何一个条件变为假，循环就会退出。\n\
  \n# 省略 `for` 循环的表达式或循环体\n\n尽管这通常被认为是不良好的编程风格，但 `for` 循环的一个或多个表达式，甚至其循环体都可以省略。\n\n\
  如果初始化已经执行，或者不需要初始化，则可以省略 `for` 循环括号内的初始化表达式。这里有一个在循环之前执行初始化的循环示例：\n\n```cpp\nint\
  \ num = 1;\nfor ( ; num <= maxValue; num++)\n    cout << num << \"      \" << (num\
  \ * num) << endl;\n```\n\n如果更新表达式在循环的其他地方执行，或者不需要，则可以省略它。虽然不推荐这种代码，但下面的 `for` 循环工作原理与\
  \ `while` 循环完全相同：\n\n```cpp\nint num = 1;\nfor ( ; num <= maxValue; )\n{  cout <<\
  \ num << \"      \" << (num * num) << endl;\n   num++;\n}\n```\n\n同样可以（尽管不推荐）写一个没有正式循环体的\
  \ `for` 循环。在这种情况下，循环的所有工作都由循环循环头部的语句完成。这是一个显示从 1 到 10 数字的示例。更新表达式中的组合递增操作和 `cout`\
  \ 语句执行了每次迭代的工作。\n\n```cpp\nfor (number = 1; number <= 10; cout << number++);\n```\n\
