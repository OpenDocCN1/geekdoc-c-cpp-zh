  \ 文件中找到。\n\n# 5.14 中山信用合作社案例研究\n\n中山信用合作社的经理要求你编写一个贷款摊还程序，供他的贷款官员在笔记本电脑上运行。以下是程序的功能要求。\n\
  \n## 问题描述\n\n当给定贷款金额、年利率和贷款年限时，程序必须确定并显示每月还款金额。然后它必须创建并显示摊还表，列出贷款每个月的以下信息：\n\n*\
  \ 还款期数\n* 该月还款中用于利息的金额\n* 该月还款中用于本金的金额\n* 该还款后的余额。\n\n可以使用以下报告作为模型。它显示了金额为 $2,000、年利率为\
  \ 7.5%、期限为 0.5 年（即 6 个月）贷款的所有所需信息。\n\n```\n每月付款：$340.66\n```\n\n| `月份` | `利息` |\
  \ `本金` | `余额` |\n| --- | --- | --- | --- |\n| `1` | `12.50` | `328.16` | `1671.84`\
  \ |\n| `2` | `10.45` | `330.21` | `1341.62` |\n| `3` | `8.39` | `332.28` | `1009.34`\
  \ |\n| `4` | `6.31` | `334.35` | `674.99` |\n| `5` | `4.22` | `336.44` | `338.55`\
  \ |\n| `6` | `2.12` | `338.55` | `0.00` |\n\n## 计算\n\n该信用合作社使用以下公式计算贷款的每月还款额：\n\n\
  $$\\text{Payment} = \\frac{\\text{Loan}*\\text{Rate/12}*\\text{Term}}{\\text{Term}\
  \ - 1}$$\n\n其中：\n\n$$\\begin{array}{cll} \\text{Loan} & = & \\text{贷款金额} \\\\ \\\
  text{Rate} & = & \\text{年利率} \\\\ \\text{Term} & = & (1 + \\text{Rate}/12)^{\\text{Years}}\
  \ \\end{array}$$\n\n## 变量\n\n表 5-4 列出了程序所需的变量。\n\n### 表 5-4 中山信用合作社使用的变量\n\n| 变量\
  \ | 描述 |\n| --- | --- |\n| `loan` | `double` 类型。存储贷款金额。 |\n| `rate` | `double` 类型。存储年利率。\
  \ |\n| `moInterestRate` | `double` 类型。存储月利率。 |\n| `years` | `double` 类型。存储贷款年限。\
  \ |\n| `balance` | `double` 类型。存储待付余额。 |\n| `term` | `double` 类型。用于每月还款计算。 |\n|\
  \ `payment` | `double` 类型。存储每月还款金额。 |\n| `numPayments` | `int` 类型。存储总还款次数。 |\n|\
  \ `month` | `int` 类型。循环控制变量，存储当前还款期数。 |\n| `moInterest` | `double` 类型。存储每月利息金额。\
  \ |\n| `principal` | `double` 类型。存储每月还款中偿还本金的部分。 |\n\n## 程序设计\n\n图 5-18 显示了程序的层级图。\n\
  \n### 图 5-18 中山信用合作社程序层级图\n\n![一张树图显示了中山信用合作社程序的层级图。](img/FG_05_018.png) 图 5-18\
  \ 完整替代文本\n\n## 详细伪代码（包含变量名）\n\n```\n输入 loan, rate, years\nnumPayments = years *\
  \ 12\nmoInterestRate = rate / 12\nterm = (1 + moInterestRate)\npayment = (loan *\
  \ moInterestRate) / (term - 1)\n显示 payment\nbalance = loan\n对于贷款的每个月\n   moInterest\
  \ = moInterestRate * balance\n   如果 不是最后一个月\n       principal = payment - moInterest\n\
  \   否则 // 是最后一个月\n       principal = balance\n   balance = balance - principal\n\
  \   显示 month, principal, balance\n```\n\n### 程序\n\n在检查伪代码的逻辑错误后，下一步将其扩展为最终程序。这在程序\
  \ 5-22 中所示。\n\n### 注意\n\n你可能在输出中注意到某些月份（如 5 月和 6 月）利息金额加上本金金额并不等于每月付款金额。此外，某些月份的之前的余额减去本金并不等于新余额。这些问题是由计算机存储精度与显示精度之间的舍入误差引起的。目前不要担心这个问题，你以后会学习如何处理。\n\
