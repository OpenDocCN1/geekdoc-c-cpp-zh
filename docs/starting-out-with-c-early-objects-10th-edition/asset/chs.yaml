  \ 关于字符和字符串\n\n## 概念\n\n关系运算符也可以用于比较字符和 `string` 对象。\n\n`string` 对象。\n\n## 比较字符\n\
  \n正如你在`第 3 章` 中学到的，字符实际上是以整数的形式存储在内存中的。在大多数系统上，这个整数是字符的 ASCII 值。例如，字母 'A' 用数字 65\
  \ 表示，字母 'B' 用数字 66 表示，以此此类推。`表 4-11` 显示了对应某些常用字符的 ASCII 数字。\n\n## 表 4-11 常用字符的 ASCII\
  \ 值\n\n| 字符 | ASCII 值 |\n| --- | --- |\n| '0'–'9' | 48–57 |\n| 'A'–'Z' | 65–90 |\n\
  | 'a'–'z' | 97–122 |\n| blank | 32 |\n| period | 46 |\n\n\n\n\n每一个字符，甚至是空格，都有与其对应的\
  \ ASCII 码。注意，大写字母 `'A'`–'Z'` 的编码与小写字母 `'a'`–'z'` 的编码不同。同样注意，代表数字的字符（如 `'1'` 或 `'2'`）的\
  \ ASCII 码与数字本身的值并不相等。显示所有字符 ASCII 值的完整表格可以在 附录 A 中找到。\n\n当比较两个字符时，实际上比较的是它们的 ASCII\
  \ 值。`'A' < 'B'` 是因为 `'A'` 的 ASCII 值 (65) 小于 `'B'` 的 ASCII 值 (66)。同样，`'1' < '2'`\
  \ 是因为 `'1'` 的 ASCII 值 (49) 小于 `'2'` 的 ASCII 值 (50)。然而，如表 4-11 所示，小写字母的数字比大写字母大，所以\
  \ `'a' > 'Z'`。程序 4-19 展示了如何使用关系运算符对字符进行比较。\n\n## 比较 `string` 对象\n\n`string` 对象也可以用关系运算符进行比较。与单个字符一样，当比较两个\
  \ `string` 对象时，实际上比较的是构成字符串的字符的 ASCII 值。例如，假设程序中存在以下定义：\n\n```\n string str1 = \"\
  ABC\";\nstring str2 = \"XYZ\";\n```\n\n`string` 对象 `str1` 被认为小于 `string` 对象 `str2`，因为字符“ABC”在字母顺序上优先于（ASCII\
  \ 值小于）字符“XYZ”。因此，以下 `if` 语句将在屏幕上显示“str1 is less than str2.”的消息。\n\n```\n if (str1\
  \ < str2)\n    cout << \"str1 is less than str2.\";\n```\n\n第一个操作数中的每个字符逐个与第二个操作数对应位置的字符进行比较。如果两个\
  \ `string` 对象中的所有字符都匹配，则两个字符串相等。如果对应位置的两个字符不匹配，就可以确定其他关系。如果第一个操作数中的第一个不匹配字符小于第二个操作数中的对应字符，则第一个操作数小于第二个操作数。同样，如果第一个操作数的第一个不匹配字符大于第二个操作数的对应字符，则第一个操作数大于第二个操作数。\n\
  \n例如，假设程序有以下定义：\n\n```\n string name1 = \"Mary\";\nstring name2 = \"Mark\";\n```\n\
  \n`name1` 中的值“Mary”大于 `name2` 中的值“Mark”。这是因为 `name1` 的前三个字符的 ASCII 值与 `name2` 的前三个字符相同，但“Mary”第四个位置的\
  \ 'y' 的 ASCII 值比“Mark”对应位置的 'k' 大。\n\n可以使用任何关系运算符来比较两个 `string` 对象。以下是 `name1` 和\
  \ `name2` 的一些有效比较。\n\n```\n name1 > name2       // true\nname1 <= name2      //\
  \ false\nname1 != name2      // true\n```\n\n当然，`string` 对象也可以与字符串字面量进行比较：\n\n```\n\
  \ name1 < \"Mary Jane\" // true\n```\n\n程序 4-20 进一步演示了如何将关系运算符用于 `string` 对象。\n\n\
  ## 注意事项\n\nC 字符串与 `string` 对象不同，不能用关系运算符进行比较。要比较 C 字符串（你记得它们是定义为字符数组的字符串），你必须使用\
  \ `strcmp` 函数，该函数将在第 12 章中讨论。\n\n## 测试字符\n\n程序 4-19 将用户输入的字符与某些字符字面量进行比较，以测试输入的字符是否是数字、大写字母或小写字母。我们也可以通过库提供的字符测试函数来测试这些以及其他内容。这些布尔函数测试字符的\
  \ ASCII 码并返回 `true` 或 `false`。例如，以下程序使用 `isupper` 函数来判断传递它的字符是否是大写字母。如果是，函数返回 `true`；否则，返回\
  \ `false`。\n\n```\n char letter = 'a';\nif (isupper(letter))\n   cout << \"Letter\
  \ is uppercase.\";\nelse\n   cout << \"Letter is not uppercase.\";\n```\n\n因为此示例中的\
  \ `letter` 包含一个小写字符，`isupper` 返回 `false`。`if` 语句将显示“Letter is not uppercase”的消息。表\
  \ 4-12 列出了 C++ 提供的一些常用字符测试函数。要使用这些函数，你需要在程序中包含 `cctype` 头文件。\n\n## 表 4-12 字符函数\n\
