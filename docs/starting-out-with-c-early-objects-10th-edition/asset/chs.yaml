  \ 18-8 添加 12.6 之后的完整替代文本\n\n## 有序的链表\n\n有时，将添加到链表中的元素保持按顺序排列是有用的。例如，列表可以按升序排列其元素，这意味着列表中的每个元素都小于或等于它的后续元素。在这种情况下，我们不能像\
  \ `NumberList` 类的 `add` 函数那样通过将元素放在列表末尾来添加，因为这样做会破坏列表中元素的顺序。我们需要一种不同的方法。\n\n考虑一个\
  \ `SortedNumberList` 类，它按升序维护其元素。它与 `NumberList` 类相似，不同之处在于 `add` 函数经过了修改，以便在放置新元素时保持列表有序。由于有序列表仍然是一个列表，因此使用继承并派生自\
  \ `NumberList`是有意义的。\n\n## `SortedNumberList.h` 的内容\n\n```\n 1 #include \"NumberList.h\"\
  \n 2 class SortedNumberList : public NumberList\n 3 {\n 4 public:\n 5     void add(double\
  \ number);  \n 6 };\n```\n\n## 向有序列表中插入节点\n\n假设我们有一个按升序排列的数字链表。我们想要编写 `add` 函数，使其参数\
  \ `number` 插入到列表的一个保持列表排序的位置。\n\n需要考虑两种情况。第一种情况是新插入的数字应该放在列表中已有的每个节点之前。这发生在列表为空，或者列表中的第一个数字大于或等于\
  \ `number` 时：\n\n```\n if (head == nullptr || head−>value >= number)\n   head =\
  \ new ListNode(number, head);\n```\n\n注意，这两个测试的顺序不应反转：在尝试访问 `head−>value` 之前，你应该确保\
  \ `head` 不是 `nullptr`：如果 `head` 是 `nullptr`，尝试评估表达式 `head−>value` 将会导致错误。\n\n应该考虑的第二种情况是新数字需要放在列表中已有节点之一之后。在这种情况下，新数字需要放在第一个大于或等于该数字的节点之前。为了找到这样一个节点，我们使用一个名为\
  \ `nodePtr` 的指针。我们将 `nodePtr` 从第二个节点开始，然后在列表中不断向前移动，直到它移出列表末尾（这在 `nodePtr` 变为 `nullptr`\
  \ 时发生）或它指向一个值大于或等于 `number` 的节点（这在表达式 `nodePtr−>value >= number` 为真时发生）。为了在 `nodePtr`\
  \ 之前插入新节点，我们需要一个指向 `nodePtr` 指向节点的前一个指针。为此，我们使用一个名为 `previousNodePtr` 的指针，它始终指向\
  \ `nodePtr` 指向节点的前一个。寻找插入点的整个过程通过以下代码完成：\n\n```\n previousNodePtr = head;\nnodePtr\
  \ = head−>next;\n\n// 寻找插入点\nwhile (nodePtr != nullptr && nodePtr−>value < number)\n\
  {\n   previousNodePtr = nodePtr;\n   nodePtr = nodePtr−>next;\n}\n```\n\n整个函数（包括创建新节点并将其插入在\
  \ `previousNodePtr` 之后、`nodePtr` 之前位置的代码）在此给出：\n\n## `SortedNumberList.h` 的内容\n\n\
  ```\n 1 #include \"SortedNumberList.h\"\n 2\n 3 //*********************************************\n\
  \ 4 // 向有序列表添加一个数字。          *\n 5 // 此函数重写了 NumberList 中的 add。 *\n 6 //*********************************************\n\
  \ 7 void SortedNumberList::add(double number)\n 8 {\n 9    ListNode *nodePtr, *previousNodePtr;\n\
  10\n11    if (head == nullptr || head−>value >= number)\n12    {\n13       // 新节点位于列表开头\n\
  14       head = new ListNode(number, head);\n15    }\n16    else\n17    {\n18  \
  \     previousNodePtr = head;\n19       nodePtr = head−>next;\n21\n22       // 寻找插入点\n\
  23       while (nodePtr != nullptr && nodePtr−>value < number)\n24       {\n25 \
  \         previousNodePtr = nodePtr;\n26          nodePtr = nodePtr−>next;\n27 \
  \      }\n28       // 在 nodePtr 之前插入新节点\n29       previousNodePtr−→next = new ListNode(number,\
  \ nodePtr);\n30    }\n31 }\n```\n\n整个函数（包括创建新节点并将其插入在 `previousNodePtr` 之后、`nodePtr`\
  \ 之前位置的代码）在此给出：这是在 `while` 循环执行之后。这导致了图 18-8 所示的情况。\n\n## 图 18-8 添加 12.6 之后\n\n\
  ![插图显示了一个阴影头部、一个阴影“nodeptr”和三个节点。](img/FG_18_008.png)图 18-8 添加 12.6 之后的完整替代文本\n\n\
  \n\n\n\n`remove` 成员函数使用指针 `nodePtr` 来搜索包含要删除的值 `number` 的节点。在此过程中，第二个指针 `previousNodePtr`\
  \ 会紧随 `nodePtr` 后，始终指向 `nodePtr` 所指向节点的前一个节点。当 `nodePtr` 指向要删除的节点时，`previousNodePtr->next`\
  \ 被设置为 `nodePtr->next`。这导致列表中的后继指针跳过包含 `number` 的节点，从而允许使用 `delete` 释放其内存。整个函数显示在这里：\n\
  \n```cpp\n 25 //**********************************************\n26 // 从列表中删除一个数字。该函数\
  \  *\n27 // 不假设列表是有序的。            *\n28 //**********************************************\n\
  29 void NumberList::remove(double number)\n30 {\n31   ListNode *nodePtr, *previousNodePtr;\n\
  33\n    // 如果列表为空，则什么都不做\n34    if (!head) return;\n36\n    // 确定第一个节点是否要删除的节点\n\
  37    if (head->value == number)\n38    {\n39      nodePtr = head;\n40      head\
  \ = head->next;\n41      delete nodePtr;\n42    }\n43    else\n44    {\n45     \
  \ // 将 nodePtr 初始化为列表的头部\n46      nodePtr = head;\n48\n4      // 跳过值成员不是 number\
  \ 的节点\n49      while (nodePtr != nullptr && nodePtr->value != number)\n50      {\n\
  51         previousNodePtr = nodePtr;\n52         nodePtr = nodePtr->next;\n53 \
  \     }\n54      // 将前一个节点连接到 nodePtr 之后的节点\n55      // 然后删除 nodePtr\n56      if\
  \ (nodePtr)\n57      {\n58         previousNodePtr->next = nodePtr->next;\n59  \
  \       delete nodePtr;\n60      }\n61    }\n62 }\n```\n\n注意，`remove()` 函数是 `NumberList`\
  \ 的成员，而不是 `SortedNumberList` 的成员。与 `add()` 不同，`remove()` 函数同时适用于有序和无序列表，因此不需要重写。在书籍配套网站上找到的\
  \ `RNumberList.cpp` 文件是 `NumberList.cpp` 的简单修改：它仅添加了 `remove()` 的实现。程序 18-5` 类似，此函数使用\
  \ `nodePtr` 和 `previousNodePtr` 来遍历列表。`while` 循环在找到值 7.9 时终止。此时，列表头部和其他指针将处于 [图\
  \ 18-12] 所示的状态。\n\n# 图 18-12 为 7.9 定位删除点\n\n![一张插图显示了一个阴影的头部、一个阴影的“nodeptr”、一个阴影的“previousnodeptr”，以及三个节点。](img/FG_18_012.png)[图\
  \ 18-12 为 7.9 定位删除点 完整替代文本]\n\n接下来，执行以下语句。\n\n```cpp\n previousNodePtr->next = nodePtr->next;\n\
  ```\n\n这条语句导致列表中的链接跳过 `nodePtr` 所指向的节点。尽管该节点仍然存在于内存中，但这将其从列表中移除，如 [图 18-13] 所示。\n\
  \n# 图 18-13 从构成列表的节点序列中取出 7.9\n\n![一张插图显示了一个阴影的头部、一个阴影的“nodeptr”、一个阴影的“previousnodeptr”，以及三个节点。](img/FG_18_013.png)[图\
  \ 18-13 从构成列表的节点序列中取出 7.9 完整替代文本]\n\n最后一条语句使用 `delete` 运算符释放被删除节点使用的内存。\n\n## 检查点\n\
  \n1.  18.8 从链表中删除节点涉及哪两个步骤？\n2.  18.9 在删除节点时，为什么不能直接使用 `delete` 运算符将其从内存中移除？为什么必须采取你在问题\
  \ 18.8 回答中列出的步骤？\n3.  18.10 在使用多个链表的程序中，如果类析构函数没有破坏链表，最终可能会发生什么？\n\n# 18.3 链表模板\n\
  \n`NumberList` 类的一个主要局限性是它只能持有 `double` 类型的值。列表类在可以用于持有不同类型的值时最有用。我们接下来介绍的 `LinkedList`\
  \ 类使用模板来实现类型灵活性。它使用了与 `NumberList` 类相同的逻辑。\n\n# `LinkedList.h` 的内容\n\n\n\n\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\ntemplate <class T>\nclass LinkedList\n\
  {\nprotected:\n    // 声明列表节点结构体\n    struct ListNode\n    {\n        T value;\n\
  \        ListNode *next;\n        ListNode(T value1, ListNode *next1 = nullptr)\n\
  \        {\n           value = value1;\n           next = next1;\n        }\n  \
  \  };\n    ListNode *head;                      // 列表头指针\npublic:\n    LinkedList()\
  \ { head = nullptr;      // 构造函数\n    ~LinkedList();                       // 析构函数\n\
  \    void add(T value);\n    void remove(T value);\n    void displayList() const;\n\
  };\n\n//*****************************************************\n// 在列表末尾添加新元素。  \
  \                       *\n//*****************************************************\n\
  template <class T>\nvoid LinkedList<T>::add(T value)\n{\n   if (head == nullptr)\n\
  \      head = new ListNode(value);\n   else\n      {\n        // 列表不为空\n       \
  \ // 使用 nodePtr 遍历列表\n        ListNode *nodePtr = head;\n        while (nodePtr−>next\
  \ != nullptr)\n           nodePtr = nodePtr−>next;\n\n        // nodePtr−>next 为\
  \ nullptr，所以 nodePtr 指向最后一个节点\n        // 创建新节点并将其放在最后一个节点之后\n        nodePtr−>next\
  \ = new ListNode(value);\n      }\n}\n\n//**********************************************\n\
  // 从列表中删除一个数字。该函数             *\n// 不假设列表是有序的。                           *\n//**********************************************\n\
  template <class T>\nvoid LinkedList<T>::remove(T value)\n{\n   ListNode *nodePtr,\
  \ *previousNodePtr;\n\n   // 如果列表为空，则什么都不做\n   if (!head)  return;\n\n   // 判断第一个节点是否为要删除的节点\n\
  \   if (head−>value == value)\n   {\n      nodePtr = head;\n      head = head−>next;\n\
  \      delete nodePtr;\n    }\n   else\n    {\n      // 将 nodePtr 初始化为列表头\n    \
  \  nodePtr = head;\n\n      // 跳过 value 成员不等于目标值的节点\n      while (nodePtr != nullptr\
  \ && nodePtr−>value != value)\n      {\n         previousNodePtr = nodePtr;\n  \
  \       nodePtr = nodePtr−>next;\n      }\n      // 将前一个节点连接到 nodePtr 之后的节点\n  \
  \    // 然后删除 nodePtr\n      if (nodePtr)\n      {\n         previousNodePtr−>next\
  \ = nodePtr−>next;\n         delete nodePtr;\n      }\n    }\n}\n\n//***************************************************\n\
  // displayList 输出当前存储在列表中\n// 所有值的序列。                               *\n//***************************************************\n\
  template <class T>\nvoid LinkedList<T>::displayList() const\n{\n   ListNode *nodePtr\
  \ = head;   // 从列表头开始\n   while (nodePtr)\n   {\n       // 打印当前节点中的值\n       cout\
  \ << nodePtr−>value << \"    \";\n       // 移动到下一个节点\n       nodePtr = nodePtr−>next;\n\
  \    }\n}\n\n//******************************************************\n// 析构函数释放列表使用的内存。\
  \                 *\n//******************************************************\n\
  template <class T>\nLinkedList<T>::~LinkedList()\n{\n   ListNode *nodePtr = head;\
  \   // 从列表头开始\n   while (nodePtr != nullptr)\n   {\n       // garbage 跟踪待删除的节点\n\
  \       ListNode *garbage = nodePtr;\n       // 移动到下一个节点（如果有的话）\n       nodePtr\
  \ = nodePtr−>next;\n       // 删除“垃圾”节点\n       delete garbage;\n   }\n}\n```\n\n\
  请注意，类成员函数的实现之前位于单独的 `.cpp` 文件，现在已折叠到头文件中。这样做是为了避免编译和链接使用模板的多文件程序时所面临的极其复杂的复杂性。\n\
  \n该模板类适用于任何支持 `==` 和 `<=` 等比较操作符的数据类型。特别地，它适用于所有数值类型以及 `string` 类型。\n\n\n\n\n\n\
  [Program 18-7] 将这两个函数结合在一起并演示了它们的用法。该程序从文件 `Numberfile.dat` 读取数据，该文件可以在书籍配套网站上找到。\n\
  \n# 递归成员函数\n\n让我们编写一个新的 `NumberList` 类，其中添加元素、删除元素和显示列表的成员函数采用了递归实现。该类 true 一个 `size()`\
  \ 函数。以下是类的声明：\n\n## `NumberList2.h` 的内容\n\n```cpp\n 1 #include <iostream>\n 2 using\
  \ namespace std;\n 3 class NumberList2\n 4 {\n 5 protected:\n 6     // 为列表节点声明一个类\n\
  \ 7     struct ListNode\n 8     {\n 9        double value;\n10        ListNode *next;\n\
  11        ListNode(double value1, ListNode *next1 = nullptr)\n12        {\n13  \
  \         value = value1;\n14           next = next1;\n15        }\n16     };\n\
  17     ListNode *head;                        // 列表头指针\n18 public:\n19     NumberList2()\
  \ { head = nullptr; }      // 构造函数\n20     ~NumberList2();                     \
  \   // 析构函数\n21     void add(double value) { head = add(head, value);}\n22     void\
  \ remove(double value) {head = remove(head, value);}\n23     void displayList()\
  \ const {displayList(head);}\n24     int size() const {return size(head);}\n25 private:\n\
  26     // 递归实现\n27     ListNode *add(ListNode *aList, double value);\n28     ListNode\
  \ *remove(ListNode *aList, double value);\n29     void displayList(ListNode *aList)\
  \ const;\n30     int size(ListNode *aList) const;\n31 };\n```\n\n如果你查看该类，你会发现第 20–24\
  \ 行中的每个公共成员函数在第 27–30 行都有对应的私有成员函数。私有成员函数为其对应的公共函数提供了递归实现。注意，每个私有成员函数都有一个类型为 `ListNode*`\
  \ 的参数。递归运行需要这个参数。\n\n你可能会疑惑为什么我们不将递归函数设为公共。原因是 `ListNode*` 类型的参数是实现细节，因此不应暴露给类的用户。类公共接口的用户不需要知道列表内部是使用命名为\
  \ `head` 的 `ListNode` 指针实现的。\n\n# 递归的 `add` 成员函数\n\n注意递归的 `add` 成员函数\n\n```cpp\n\
  \ ListNode *add(ListNode *aList, double value);\n```\n\n它接受输入列表和一个值作为参数，并返回向输入列表添加该值后生成的列表。从技术上讲，该函数将第一个参数取为指向链表头的指针，并返回结果列表的头指针。`NumberList2.h`\
  \ 代码列表的第 21 行显示了如何调用递归函数向列表添加一个值。\n\n让我们看看 `add` 函数是如何工作的。如果输入列表为空（基准情况），函数将创建一个包含该值的新节点并返回指向该节点的指针：\n\
  \n```cpp\n return new ListNode(value);\n```\n\n如果列表不为空，函数按以下步骤进行：首先，它将输入列表拆分为它的头节点和尾部。\n\
  \n```cpp\n ListNode *tail = aList−>next;  // 固定尾部\naList−>next = nullptr;      \
  \   // aList 现在指向头\n```\n\n尾部比原始输入列表短，因此更接近基准情况。通过递归，函数将该值添加到列表的尾部，产生一个“更大”的尾部：\n\
  \n```cpp\n ListNode *biggerTail = add(tail, value);\n```\n\n最后，被 `aList` 指向的原始头被重新连接到更大的尾部，并返回指向原始头的指针：\n\
  \n```cpp\n aList−>next = biggerTail;  // 重新连接头\nreturn aList;              // 返回指向增强后列表的指针\n\
  ```\n\n将这一切整合起来，我们得到了 `add` 函数的以下代码：\n\n```cpp\n 42 NumberList2::ListNode *NumberList2::add(ListNode\
  \ *aList, double value)\n43 {\n44     if (aList == nullptr)\n45         return new\
  \ ListNode(value);\n46     else\n47     {\n48         // 拆分为基础的头和尾\n49         ListNode\
  \ *tail = aList−>next;   // tail\n50         aList−>next = nullptr;          //\
  \ 分离的头\n51         // 递归地将值添加到尾部\n52         ListNode *biggerTail = add(tail, value);\n\
  53         // 重新连接头\n54         aList−>next = biggerTail;\n55         // 返回指向更大列表头的指针\n\
  56         return aList;\n57     }\n58 }\n```\n\n该函数中的代码可以缩短。首先，注意第 50 行是不需要的。在第\
  \ 52 行对尾部进行递归调用之前，不需要分离头节点，只要在第 54 行将其“重新连接”即可。然后，我们可以消除 `tail` 变量，并直接在第 52 行使用\
  \ `aList−next`。\n\n```cpp\n ListNode *biggerTail = add(tail, value);\naList−>next\
  \ = biggerTail;\nreturn aList;\n```\n\n这又可以进一步缩短为\n\n```cpp\n aList−>next = add(aList−next,\
  \ value);\nreturn aList;\n```\n\n因此，`add` 函数可以写如下：\n\n```cpp\n 28 NumberList2::ListNode\
  \ *NumberList2::add(ListNode *aList, double value)\n29 {\n30     if (aList == nullptr)\n\
  31         return new ListNode(value);\n32     else\n33     {\n34         // 将值添加到尾部末\n\
  35         aList−>next = add(aList−next, value);\n36         return aList;\n37 \
  \    }\n38 }\n```\n\n# 递归的 `remove` 成员函数\n\n`remove` 函数\n\n```cpp\n ListNode *remove(ListNode\
  \ *aList, double value)\n```\n\n接受输入列表和一个值作为参数，从输入列表中删除该值，并返回生成的列表。如果要删除的值不在列表中，函数将返回未更改的输入列表。\n\
  \n函数的工作原理如下：如果列表为空，函数返回 `nullptr`。\n\n```cpp\n if(aList == nullptr) return nullptr;\n\
  ```\n\n否则，函数将该值与列表中第一个（头）节点中存储的值进行比较。如果找到了该值，则删除由 `aList` 指向的头节点并返回尾部：\n\n```cpp\n\
  \ if (aList−>value == value)\n{\n   ListNode *tail = aList−>next;\n   delete aList;\n\
  \   return tail;\n}\n```\n\n最后考虑的情况是列表不为空且列表头不包含要删除的值。在这种情况下，函数递归地从列表尾部删除该值，将原始头重新连接到修改后的尾部，并返回指向可能修改过的）列表头的指针。使用与\
  \ `add()` 函数相同的推理，可以将此情况写为\n\n```cpp\n aList−>next = remove(aList−next, value);\n\
  return aList;\n```\n\n再次将这一切整合起来，我们得到了实现文件 `NumberList2.cpp` 第 10–60 行的完整函数。\n\n\
  \n\n\n\n```cpp\n#include \"NumberList2.h\"\n\n//*******************************************\n\
  // 返回列表中元素的个数 *\n//*****************************************\nint NumberList2::size(ListNode\
  \ *aList) const\n{\n    if (aList == nullptr)\n        return 0;\n    else\n   \
  \     return 1 + size(aList->next);\n}\n\n//*******************************************\n\
  // 打印链表中存储的所有元素     *\n//*******************************************\nvoid NumberList2::displayList(ListNode\
  \ *aList) const\n{\n    if (aList != nullptr)\n    {\n        cout << aList->value\
  \ << \"  \";\n        displayList(aList->next);\n    }\n}\n//***********************************************\n\
  // 在列表末尾添加一个值            *\n//***********************************************\n\
  NumberList2::ListNode *NumberList2::add(ListNode *aList, double value)\n{\n    if\
  \ (aList == nullptr)\n        return new ListNode(value);\n    else\n    {\n   \
  \     // 将该值添加到尾部\n        aList->next = add(aList->next, value);\n        return\
  \ aList;\n    }\n}\n\nNumberList2::ListNode *NumberList2::remove(ListNode *aList,\
  \ double value)\n{\n    if (aList == nullptr) return nullptr;\n    // 列表为空\n\n \
  \   // 检查值是否在列表的第一个\n    // 如果是，删除该值并返回尾部\n    if (aList->value == value)\n    {\n\
  \       ListNode *tail = aList->next;\n        delete aList;\n        return tail;\n\
  \    }\n    else\n    {\n        // 值不是列表的第一个\n        // 返回从列表尾部删除该值后的列表\n    \
  \    aList->next = remove(aList->next, value);\n        return aList;\n    }\n}\n\
  \nNumberList2::~NumberList2()\n{\n    ListNode *ptr = head;\n    while (ptr != nullptr)\n\
  \    {\n        // 指向要删除的节点\n        ListNode *garbage = ptr;\n        // 继续指向下一个节点\n\
  \        ptr = ptr->next;\n        // 删除当前节点\n        delete garbage;\n    }\n}\n\
  ```\n\n`Program 18-8` 展示了这些成员函数的用法。\n\n# 18.5 链表的各种变体\n\n## 概念\n\n有许多方法可以将动态分配的数据结构连接在一起。链表的两种变体是双向链表和循环链表。\n\
  \n我们讨论过的链表示例是`单向链表`：每个节点只连接到另一个节点。它的一个变体是`双向链表`。在这种类型的列表中，每个节点不仅指向下一个节点，还指向上一个节点。这在[图\
  \ 18-14]中所示。\n\n## 图 18-14 双向链表\n\n![一张解释双向链表的图。](img/FG_18_014.png)\n\n在[图 18-14]中，列表的最后一个节点和第一个节点指向\
  \ `nullptr` 地址。当程序遍历列表时，它知道自己何时到达了末端。\n\n另一种变体是`循环链表`。这种类型的列表最后一个节点指向第一个节点，如[图 18-15]所示。\n\
  \n## 图 18-15 循环链表\n\n![一张解释循环链表的图。](img/FG_18_015.png)\n\n# 在原始指针和智能指针之间选择\n\n智能指针旨在解决\
  \ C++ 中出现的问题。这些问题包括：由于未删除导致的内存泄漏；过早删除；重复删除；以及所有权不不明。一个重要问题是我们是否应该始终使用智能指针。我们在工作中选择了使用原始指针，是因为有几个理由不使用智能指针。\n\
  \n# 18.6 STL 的 `list` 和 `forward_list` 容器\n\n## 概念\n\n标准模板库提供了两种不同的链表容器，称为 `list`\
  \ 和 `forward_list`。\n\n标准模板库中的 `list` 容器被实现为双向链表，而 `forward_list` 容器被实现为单向链表。这些容器执行插入和就地操作的速度比\
  \ `vector` 更快，因为链表在添加新元素时不需要移动元素。`list` 和 `forward_list` 容器在末尾添加元素时也是高效的，因为它们有指向最后一个元素的内置指针（不需要遍历）。\n\
  \n与其他序列容器相比，`list` 和 `forward_list` 容器有一个缺点：你无法使用索引一次访问元素。要访问 `list` 或 `forward_list`\
  \ 中间的元素，你必须逐个通过元素，直到找到你寻找的那个。\n\n## `list` 容器\n\n要使用 `list` 类，你需要在程序中包含 `<list>`\
  \ 头文件。然后，你可以使用四个 `list` 构造函数之一来定义 `list` 对象。[表 18-1]显示了使用每个构造函数定义 `list` 语句的通用格式。[表\
  \ 18-2]列出了 `list` 类的许多（但不是所有）成员函数。\n\n# 表 18-1 `list` 构造函数\n\n| 构造函数 | 说明 |\n| :---\
  \ | :--- |\n| 默认构造函数 | `list<dataType> name;` 创建一个空的 `list` 对象。在通用格式中，`dataType`\
  \ 是每个元素的数据类型，`name` 是 `list` 的名称。 |\n| 拷贝构造函数 | `list<dataType> name(const list<dataType>\
  \ &other);` 创建一个 `other` 的拷贝的新 `list`。 |\n| 范围构造函数 | `list<dataType> name(iterator_type\
  \ first, iterator_type last);` 创建一个包含从 `first` 到 `last` 元素的新 `list`。 |\n| 填充构造函数\
  \ | `list<dataType> name(size_type n, dataType value);` 创建一个包含 `n` 个元素的新 `list`，每个元素均初始化为\
  \ `value`。 |\n\n\n\n\n\n| 构造函数类型 | 描述 |\n| :--- | :--- |\n| 填充构造函数 | `list<dataType>\
  \ name(size);` 创建一个指定大小的 `list` 对象。在通用格式中，`dataType` 是每个元素的数据类型，`name` 是 `list`\
  \ 的名称。`size` 参数是一个无符号整数，指定了 `list` 初始拥有的元素数量。如果元素是对象，则通过它们的默认构造函数进行初始化。否则，元素用值 0\
  \ 初始化。 |\n| 填充构造函数 | `list<dataType> name(size, value);` 创建一个指定大小的 `list` 对象，其中每个元素初始都被赋予一个指定的值。在通用格式中，`dataType`\
  \ 是每个元素的数据类型，`name` 是 `list` 的名称。`size` 参数是一个无符号整数，指定了 `list` 初始拥有的元素数量，`value`\
  \ 参数是填充到每个元素的值。 |\n| 范围构造函数 | `list<dataType> name(it1, it2);` 创建一个 `list` 对象，其初始包含由指向另一个集合的两个迭代器指定的数值范围。在通用格式中，`dataType`\
  \ 是每个元素的数据类型，`name` 是 `list` 的名称。迭代器 `it1` 和 `it2` 标记了将存储在 `list` 中的值范围的起始和结束。 |\n\
  | 拷贝构造函数 | `list<dataType> name(list2);` 创建一个作为另一个 `list` 或对象的拷贝的 `list` 对象。在通用格式中，`dataType`\
  \ 是每个元素的数据类型，`name` 是 `list` 的名称，`list2` 是要拷贝的 `list`。 |\n\n# 表 18-2 许多 `list` 成员函数\n\
  \n| 成员函数 | 描述 |\n| :--- | :--- |\n| `back()` | 返回容器中最后一个元素的引用。 |\n| `begin()` |\
  \ 返回指向容器起始的迭代器。 |\n| `cbegin()` | 返回指向容器起始的 `const_iterator`。 |\n| `cend()` | 返回指向容器末尾的。\
  \ |\n| `clear()` | 移除容器中的所有元素。 |\n| `crbegin()` | 返回指向容器（反向）末尾的 `const_reverse_iterator`。\
  \ |\n| `crend()` | 返回指向容器（反向）起始的 `const_reverse_iterator`。 |\n| `emplace(it, args...)`\
  \ | 构建一个新对象作为元素，将 `args...` 作为元素构造函数的参数传递。`it` 参数是指向容器中现有元素的迭代器。新元素将插入到 `it` 所指向的元素之前。\
  \ |\n| `emplace_back(args...)` | 在容器末尾构造一个新对象作为元素。`args...` 参数被传递给元素的构造函数。 |\n|\
  \ `emplace_front(args...)` | 在容器头部构造一个新对象作为元素。`args...` 参数被传递给元素的构造函数。 |\n| `empty()`\
  \ | 如果容器为空，则返回 `true`，否则返回 `false`。 |\n| `end()` | 返回指向容器末尾的迭代器。 |\n| `erase(it)`\
  \ | 移除迭代器 `it` 所指向的元素。此函数返回一个指向被删除元素之后的元素的迭代器（如果被删除的元素是最后一个元素，则指向容器的末尾）。 |\n| `erase(it1,\
  \ it2)` | 移除元素范围。迭代器 `it1` 和 `it2` 标记了将被删除的值范围的起始和结束。此函数返回一个指向被删除范围之后的元素的迭代器。 |\n\
  | `front()` | 返回容器中第一个元素的引用。 |\n| `insert(it, value)` | 插入一个具有 `value` 值的元素。`it`\
  \ 是指向容器中元素的迭代器。返回指向插入元素的迭代器。 |\n| `insert(it, n, value)` | 插入 `n` 个具有 `value` 值的元素。`it`\
  \ 是指向容器中元素的迭代器。返回指向第一个插入元素的迭代器。 |\n| `insert(it1, it2, it3)` | 插入元素范围。迭代器 `it1`\
  \ 和 `it2` 标记了要插入元素范围的起始和结束。`it3` 指定了插入的位置。返回指向插入元素的迭代器。 |\n| `max_size()` | 返回容器的理论最大大小。\
  \ |\n| `merge(second)` | `second` 参数必须是与调用对象相同类型的 `list` 对象。此函数合并调用对象的内容，且 `second`\
  \ 列表必须是排序过的。函数执行后，`second` 列表为空。 |\n| `pop_back()` | 移除容器的最后一个元素。 |\n| `pop_front()`\
  \ | 移除容器的第一个元素。 |\n| `push_back(value)` | 在容器末尾添加一个包含 `value` 的新元素。 |\n| `push_front(value)`\
  \ | 在容器头部添加一个包含 `value` 的新元素。 |\n| `rbegin()` | 返回指向容器末尾的反迭代器。 |\n| `remove(value)`\
  \ | 移除所有等于 `value` 的元素。 |\n| `remove_if(function)` | `function` 是一个元谓词函数（接受一个参数并返回布尔值的函数或函数对象）。此函数将每个元素作为参数传递给\
  \ `function`，并移除返回 `true` 的元素。 |\n| `rend()` | 返回指向容器起始的反迭代器。 |\n| `size()` | 返回容器中元素的数量。\
  \ |\n| `sort()` | 按升序排序元素。使用 `<` 运算符比较元素。 |\n| `swap(second)` | `second` 参数必须是与调用对象相同类型的\
  \ `list` 对象。此函数交换调用对象与 `second` 对象的内容。 |\n| `unique()` | 如果容器中有任何连续的重复元素，则移除除第一个元素之外的所有重复元素。\
  \ |\n\n\n\n\n\n程序 18-9 展示了 `list` 容器的一些简单操作。\n\n# `forward_list` 容器\n\n由于 `forward_list`\
  \ 是以单链表的形式实现的，因此每个节点只保留一个指针：指向下一个节点的指针。与 `list` 容器（每个每个节点保留两个指针：一个指向下一个节点，一个指向上一个节点）相比，`forward_list`\
  \ 使用的内存比 `list` 更少。然而，你只能向前遍历 `forward_list`。如果你需要同时向前和向后移动，应该使用 `list` 容器。\n\n\
  `forward_list` 容器提供了与 `list` 容器大部分相同的成员函数，但少数例外。你可以在良好的在线参考网站（如 `cppreference.com`\
  \ 或 `cplusplus.com`）上找到 `forward_list` 容器的文档。\n\n# 18.7 Reliable Software Systems,\
  \ Inc., 案例研究\n\n## 问题描述\n\nReliable Software Systems, Inc. 为全球范围的程序员编写并销售 C++ 类库。该公司的产品之一是一个库包，包含了在本章第\
  \ 2 节引入的 `NumberList` 类。它的客户需要在涉及 `NumberList` 对象的拷贝和赋值的程序中使用该类。你被要求修改该类以支持拷贝构造函数和赋值运算符。\n\
  \n# 更改规划与类设计\n\n`NumberList` 类至少需要添加两个函数。与其修改原始类，你选择使用继承来创建一个具有所请求增强的新类。拷贝构造函数和赋值都需要对被复制的\
  \ `NumberList` 对象内部的节点链表进行拷贝。为了避免代码重复，我们将添加一个成员函数\n\n```\n ListNode *copyList(ListNode\
  \ *aList);\n```\n\n该函数会创建并返回节点列表的独立副本。此外，当赋值运算符应用于如下语句时：\n\n```\n x = y;\n```\n\n\
  需要释放为 `NumberList` 对象 `x` 中的链表分配的存储空间。因此，我们在类中添加了一个成员函数\n\n```\n void destroyList(ListNode\
  \ *aList);\n```\n\n该设计工作的结果是 `ReliableNumberList.h` 文件所示的 `ReliableNumberList` 类。\n\
  \n# `ReliableNumberList.h` 的内容\n\n```\n 1 #include \"numberlist.h\"\n 2\n 3 class\
  \ ReliableNumberList : public NumberList\n 4 {\n 5 public:\n 6     // 拷贝构造函数\n 7\
  \     ReliableNumberList(const ReliableNumberList& original);\n 8     // 现在我们需要一个默认构造函数\n\
  \ 9     ReliableNumberList(){}\n10     // 赋值运算符\n11     ReliableNumberList& operator=(ReliableNumberList\
  \ right);\n12 private:\n 13     static ListNode* copyList(ListNode *aList);\n14\
  \     static void destroyList(ListNode *aList);\n15 };\n```\n\n我们添加了默认构造函数（9 行），允许创建初始为空列表。注意辅助函数\
  \ `copyList` 和 `destroyList` 被声明为静态（static）。这是因为它们是通用的工具函数，不需要访问特定的 `NumberList`\
  \ 对象即可完成工作。\n\n# 类成员函数的实现\n\n我们在实现 `copyList` 和 `destroyList` 时采用了了递归策略。如果列表为空，`copyList`\
  \ 返回 `nullptr`。如果列表不空，则函数会创建一个头节点的拷贝，将其附加到递归创建的尾部拷贝上，并返回结果列表。\n\n现在考虑 `destroyList`\
  \ 的工作。如果参数列表为空，则没有需要销毁的内容。如果参数列表为空，函数将递归销毁尾部，然后释放头节点的存储空间。`copyList` 和 `destroyList`\
  \ 的编码细节可以见随后的 `ReliableNumberList.cpp` 列表。\n\n有了 `copyList` 函数后，编写拷贝构造函数变得几乎轻而易举：构造函数只需拷贝现有对象中的链表，并将结果赋值给正在创建的对象的头指针：\n\
  \n```\n head = copylist(original.head);\n```\n\n编写赋值运算符并没有困难多少。该运算符首先释放调用对象中链表的存储空间，然后将其右操作数中的列表拷贝赋值给调用对象的头成员。\n\
  \n```\n destroyList(head);\nhead = copyList(right.head);\n```\n\n你可以在接的列表中找到完整的实现细节以及此新类的用法说明。\n\
  \n# `ReliableNumberList.h` 的内容\n\n```\n 1 #include \"reliablenumberlist.h\"\n 2\
  \  \n 3 //***************************************************\n 4 // 拷贝构造函数    \
  \                           *\n 5 //***************************************************\n\
  \ 6 ReliableNumberList::\n 7 ReliableNumberList(const ReliableNumberList& original)\n\
  \ 8 {\n 9     head = copyList(original.head);\n10 }\n11\n12 //****************************************************\n\
  13 // 重载的赋值运算符                    *\n14 //****************************************************\n\
  15 ReliableNumberList&\n16 ReliableNumberList::operator=(ReliableNumberList right)\n\
  17 {\n18     // 首先销毁此对象中的链表\n19     destroyList(head);\n20     // 赋值另一个操作数中的列表拷贝\n\
  21     head = copyList(right.head);\n22 }\n23\n24 //****************************************************\n\
  25 // 在 NumberList 对象内部创建链表的独立*\n26 // 拷贝                                      *\n\
  27 //****************************************************\n28 NumberList::ListNode\
  \ *\n29 ReliableNumberList::copyList(ListNode *aList)\n30 {\n31     if (aList ==\
  \ nullptr)\n32         return nullptr;\n33     else\n34     {\n35         // 先拷贝尾部\n\
  36         ListNode *tailCopy = copyList(aList->next);\n37         // 返回附加到尾部拷贝的头节点\n\
  38         return new ListNode(aList->value, tailCopy);\n39     }\n40 }\n41\n42\
  \ //******************************************************\n43 // 通过释放所有节点来销毁列表\
  \               *\n44 //******************************************************\n\
  45 void ReliableNumberList::destroyList(ListNode *aList)\n46 {\n47    if (aList\
  \ != nullptr)\n48    {\n49       // 递归销毁尾部\n50       destroyList(aList->next);\n\
  51       // 释放头部\n52       delete aList;\n53    }\n54 }\n```\n\n程序 18-10 展示了前面的代码为\
  \ `NumberList` 类添加的拷贝构造函数和赋值运算符。\n\n## 复习题与练习\n\n# 填充\n\n1. 头指针指向链表中的第一个节点。\n2.\
  \ 指向相同类型对象的数据结构被称为递归型数据结构。\n3. 为了指示链表为空，应将其头指针设置为 `nullptr`。\n4. `push_back` 意味着将其添加到列表的末尾。\n\
  5. `insert_front` 意味着将其添加到列表但不一定在末尾。\n6. 遍历意味着走遍列表。\n7. 在循环链表中，最后一个节点指向第一个节点。\n\
  8. 在双向链表中，每个节点都有一个指向前一个节点和后一个节点的指针。\n\n# 算法工作坊\n\n9. 使用本章引入的 `ListNode` 结构体，编写一个函数\n\
  \n   ```\n     void printFirst(ListNode *ptr);\n   ```\n\n   该函数打印作为参数传递的列表第一个节点存储的值。如果传递的列表为空，函数应打印错误信息并终止程序。\n\
  \n10. 编写一个函数\n\n    ```\n     void printSecond(ListNode *ptr);\n    ```\n\n    该函数打印作为参数传递的列表第二个节点存储的值。如果传递的列表少于两个节点，函数应打印错误信息并终止程序。\n\
  \n\n\n\n\n## 11. 写一个函数\n\n```\ndouble lastValue(ListNode *ptr)\n```\n\n该函数返回作为参数的非空链表中最后一个节点存储的值。如果传递的列表为空，函数应打印错误信息并终止程序。\n\
  \n## 12. 写一个函数\n\n```\nListNode *removeFirst(ListNode *ptr)\n```\n\n该函数接收一个链表作为参数并返回列表的尾部：即它移除第一个节点并返回剩余部分。该函数应该释放被删除节点的存储空间。如果传递的列表为空，则函数返回\
  \ `nullptr`。\n\n## 13. 写一个函数\n\n```\nListNode *ListConcat(ListNode *list1, ListNode\
