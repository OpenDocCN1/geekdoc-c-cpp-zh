  \ function templates`（编写函数模板），1013–1016。参见函数模板\n\n# 附录 E 面向对象编程简介介绍\n\n到底什么是面向对象编程？面向对象系统意味着什么？为了回答这个问题，让我们首先看看它之前的编程范式。\n\
  \n# 过程化编程\n\n直到 20 世纪 90 年代中期，大多数开发的计算机程序都是`过程化程序`。这些程序设计为一组过程或函数，用于执行共同提供程序功能的各种任务。每个过程由编程语言语句组成，由计算机逐条执行，以处理程序必须执行的任务之一。这些语句可能会从用户处收集输入、处理存储在内存中的数据、进行计算或执行任何其他操作。\n\
  \n# 图 E-1\n\n在运行过程化程序的文本环境中，用户会对程序的提示做出响应。例如，图 E-1 显示了一台旧款 MS-DOS 计算机运行薪酬计算程序的屏幕。用户输入的数字以**粗体**显示。\n\
  \n```\n你工作了多少小时？10\n每小时工资多少？15\n你赚了 $150.00\nC>_\n```\n\n\n\n\n\n## 引言\n过程化编程以创建过程为中心，而面向对象的编程以创建对象为中心。`object`（对象）是一个编程实体，通常模拟某些现实世界中的实体，例如学生、银行账户，甚至是计算机屏幕。对象`know`关于它自身的某些事情，并可以`do`某些事情。它所知道的事情被称为它的`attributes`（属性），并通过将其存储为数据来“记住”。它能做的事情被称为它的`methods`（方法），由它通过函数执行的动作或行为组成。从概念上说，对象是一个由数据（`attributes`）和函数（`methods`）组成的自包含单元。\n\
  \n面向对象编程（OOP）彻底改变了 GUI 软件开发。例如，在 GUI 环境中，计算工资的程序可能会显示为图 E-2 所示的窗口。\n\n### 图 E-2\n\
  ![“工资计算器”应用程序的界面显示了用户控件。](img/FG_AppE_002.png)图 E-2 完整替代文本\n\n这个窗口可以被视为对象。它包含了其他对象，例如文本输入框和命令按钮。每个对象都有决定其外观的属性。例如，看这些命令按钮。其中一个标题为“计算总工资”（Calculate\
  \ Gross Pay），另一个显示为“关闭”（Close）。这些标题以及按钮的大小和位置都是按钮对象的属性。对象还可以存储用户输入的数据。例如，其中一个文本输入框允许用户输入工作小时。当输入这些数据时，它们将作为文本输入框的属性被存储起来。\n\
  \n对象还具有动作或方法。例如，当用户用鼠标点击“计算总工资”按钮时，程序将显示总工资金额。与标记为“计算总工资”的按钮相关的方法或函数会执行此动作。\n\n\
  ## 面向对象编程的优势\nGUI 软件开发的复杂性并不是过程化程序员所面临的首个困难挑战。在 Windows 和其他 GUI 出现很久以前，程序员就在苦于代码/数据分离的问题。在过程化编程中，数据和程序代码之间有明确的分离。数据存储在特定数据类型的变量以及程序员定义的数据结构中。程序代码将数据传递给设计用于接收和处理数据的模块。但是，当程序的规范发生变化，导致重新设计数据结构、更改数据类型并向程序中添加新变量时，会发生什么？在过程化程序中，当数据结构发生变化时，操作数据的模块也必须进行更改以接受新格式。这增加了程序员的工作量，并为代码中出现漏洞的机会。\n\
  \n面向对象编程（OOP）通过封装（encapsulation）和数据隐藏（data hiding）解决了代码/数据分离的问题。`Encapsulation`（封装）指的是将数据及其处理过程封装在一个单一对象中。`Data\
  \ hiding`（数据隐藏）是指对象能够向使用该对象的程序隐藏数据存储细节的能力。对象外部的代码只能通过调用对象的方法来访问数据。这些方法或过程提供了一个接口，外部程序通过该接口访问存储在对象中的数据。程序不需要知道数据是如何存储的。它们只需要知道如何与对象的方法交互。如果程序员需要更改对象内部数据的类型或结构，那么提供对象数据与外部程序之间接口的方法也将同时被更改。但从外部程序的角度来看，什么都没有变化；它像以前一样访问数据。这在图\
  \ E-3 中有所说明。\n\n### 图 E-3\n![图表显示一个带有文字“使用该对象的程序”的框与另一个标记为“对象”的框进行交互。](img/FG_AppE_003.png)图\
  \ E-3 完整替代文本\n\n## 组件复用\n软件开发中鼓励使用 OOP 的另一个趋势是`component reusability`（组件复用）。组件是执行特定、定义良好的操作的或提供特定服务的软件对象。组件不是一个独立的程序，而是可以被需要该组件服务的程序使用的对象。例如，Sharon\
  \ 是一个开发了渲染 3D 图像组件的程序员。她是一个数学天才，对计算机图形非常了解，因此她的组件被编码为可以执行所有必要的 3D 数学运算并处理计算机视频硬件。Tom\
  \ 正在为一家建筑公司编写程序，他需要他的应用程序显示建筑的 3D 图像。为了节省时间和工作，他可以使用 Sharon 的组件来执行 3D 渲染。\n\n##\
  \ 对象的日常实例\n将一个简单的数字闹钟想象为一个对象。它具有以下属性：\n\n* `hour`（1–12 之间的值）\n* `minute`（0–59）\n\
  * `second`（0–59）\n* `day/night`（上午/下午）\n* `alarm set time`（闹钟设定时间）\n* `alarm status`（开启/关闭）\n\
  \n正如所见，属性仅仅是定义闹钟`state`的数据值。表 E-1 列出了闹钟的方法。这些是时钟执行的动作。\n\n### 表 E-1\n| 方法 | 执行时\
  \ | 动作 |\n| --- | --- | --- |\n| `Increment second` | 每秒 | `second` 属性加 1。如果是 59，则变为\
  \ 0。 |\n| `Increment minute` | `second` 从 59 变为 0 | `minute` 属性加 1。如果是 59，则变为 0。激活\
  \ `Check alarm time` 方法。 |\n| `Increment hour` | `minute` 从 59 变为 0 | `hour` 属性加\
  \ 1。如果是 12，则变为 1。 |\n| `Change am/pm indicator` | `hour` 从 11 变为 12 | 更改指示器状态。 |\n\
  | `Set current time` | 用户点击设置按钮 | 将 `hour`、`minute` 和 `day/night` 设置为用户的值。 |\n|\
  \ `Set alarm time` | 用户点击闹钟按钮 | 将 `alarm set time` 设置为用户的值。 |\n| `Check alarm time`\
  \ | `Increment minute` 方法触发 | 检查当前时间是否等于 `alarm set time` 且 `alarm status` 为开启。如果是，则激活\
  \ `Sound alarm` 方法。 |\n| `Turn alarm on` | 用户将开关拨到开启位置 | 将 `alarm status` 设置为开启。\
  \ |\n| `Sound alarm` | `Check alarm time` 方法触发 | 响响闹钟，直到 `Turn alarm off` 方法被激活。\
  \ |\n| `Turn alarm off` | 用户将开关拨到关闭位置 | 将 `alarm status` 设置为关闭。 |\n\n在表 E-1 中描述的方法是闹钟对象私有内部工作的一部分。外部实体（如你）无法直接访问闹钟的属性，但这些方法可以。该对象被设计为自动执行这些方法，并向你（用户）隐藏细节。这些方法与对象的属性共同构成了闹钟的`private\
  \ persona.`。\n\n\n\n\n然而，闹钟的一些方法对你是开放的。特别是，你可以执行“设置当前时间”、“设置闹钟时间”、“开启闹钟”和“关闭闹钟”方法。你通过按下各种按钮和移动各种开关来实现这些，这些开关作为公共\
  \ `interface`（接口）的一部分，允许外部实体与对象进行交互。\n\n# 类与对象\n\n类是对象的一种类型或类别。它规定了该类的对象所拥有的属性和方法。然而，类并不是对象。它仅仅描述了该类的对象在创建时看起来什么样。对象本身是类的实例，一旦定义了一个类，就可以从它创建多个实例（对象）。让我们用闹钟的例子来进一步探讨这个概念。\n\
  \n在生产闹钟之前，必须对其进行设计。它将看起来什么样？它将拥有什么种的内部组件？以及如何控制它们？接口将由什么组成？设计完成后，必须安排实际机械进行组装。一旦完成，就可以根据相同的设计使用相同的设备生产出多个闹钟。\n\
  \n现在让我们来看一个软件示例。杰西卡（Jessica）是一个计算机程序员，她有一个蝴蝶花园，并以研究蝴蝶为嗜爱好。她决定创建一个程序来帮助她对蝴蝶信息进行分类。\n\
  \n![图像显示了 5 只蝴蝶。它们的大小不同，翅膀上的设计也不同。](img/UNFG_AppE_001.png)\n\n然而，在编写实际程序之前，她设计了一个\
  \ `Butterfly`（蝴蝶）类，该类规定了用于存储和操作所有蝴蝶通用数据的属性（变量）和方法。在创建该类之后，她编写了程序。该程序创建并使用了许多不同的\
  \ `Butterfly` 对象。每个对象都有不同的名称，例如 `monarch`（黑蝶）、`hollyBlue`（寿蓝）、`swallowTail`（凤蝶）等。然而，它们都是\
  \ `Butterfly` 的实例。\n\n# 面对象系统\n\n组件重用性和面向对象编程技术为大型计算机应用程序成为由独特的协作实体（组件）组成的整个系统奠定了基础。随着你继续学习，你将变得越来越熟悉编写面向对象的程序。你还将学习如何有效地使用现有组件、如何创建新组件，以及如何让组件协同工作以创建整个面向对象的系统。\n\
  \n# 附录 F 在类设计中使用 UML\n\n在设计类时，绘制 UML 图通常很有帮助。`UML` 代表 `Unified Modeling Language`（统一建模语言）。UML\
  \ 提供了一系列标准图，用于图形化地描述面向对象的系统。你的教材和本附录介绍了其中一些常用的图。图 F-1 显示了类 UML 图的通用布局。请注意，该图是一个分为三个部分的框。顶部部分是书写类名的地方。中间部分包含类成员变量列表。底部部分包含类成员函数列表。\n\
  \n# 图 F-1\n\n![一个图表显示了一个被分为 3 个水平部分的框。](img/FG_AppF_001.png)图 F-1 完整替代文本\n\n例如，在第\
  \ 7 章中，你学习了一个 `Rectangle`（矩形）类，它可以用于处理矩形的程序中。该类具有以下成员变量：\n\n*   `length`（长度）\n*\
  \   `width`（宽度）\n\n该类还有以下成员函数：\n\n*   `setLength`\n*   `setWidth`\n*   `getLength`\n\
  *   `getWidth`\n*   `getArea`\n\n根据这些信息，我们可以为该类构造一个简单的 UML 图，如图 F-2 所示。\n\n图 F-2\
  \ 中的 UML 图告诉我们类名、成员变量名以及成员函数名。将此图与随后的实际 C++ 类声明进行比较。\n\n# 图 F-2\n\n![一个图表显示了“Rectangle”类的\
  \ UML 图。](img/FG_AppF_002.png)图 F-2 完整替代文本\n\n```\nclass Rectangle\n{\n   private:\n\
  \       double length;\n       double width;\n   public:\n       void setLength(double);\n\
  \       void setWidth(double);\n       double getLength();\n       double getWidth();\n\
  \       double getArea();\n};\n```\n\n图 F-2 中显示的 UML 图告诉我们类名、成员变量名和成员函数名。UML 图包含了许多细节，如访问权限说明、成员类型和返回类型。\n\
  \n# 访问权限说明在 UML 图中\n\n图 F-2 中的 UML 图列出了类的哪些成员是私有的，哪些是公共的。如果你要在 UML 图中包含这些信息，可以在成员名前放置\
  \ `–` 字符表示私有，放置 `+` 字符表示公共。图 F-3 显示了修改后的 UML 图。\n\n# 图 F-3\n\n![一个图表显示了矩形的 UML 图。](img/FG_AppF_003.png)图\
  \ F-3 完整替代文本\n\n# 数据类型和参数符号在 UML 图中\n\n统一建模语言还提供了你可以用来说指示成员变量、成员函数和参数的数据类型。要指示成员变量的数据类型，在变量名后放置冒号和数据类型。例如，`Rectangle`\
  \ 类中的 `width` 变量是 `double`，因此可以在 UML 图中这样列出：\n\n```\n– width : double\n```\n\n###\
  \ 注意\n\n在 UML 表示中，变量名在前，数据类型在后。这与要求数据类型前面的 C++ 语法相反。成员函数的返回类型可以用相同的方式列出：在函数名后放置冒号和返回类型。`Rectangle`\
  \ 类 `getLength` 返回 `double`，因此可以在 UML 图中这样列出：\n\n```\n+ getLength(): double\n```\n\
  \n参数变量及其数据类型可以列在成员函数的括号内。例如，`Rectangle` 类 `setLength` 函数有一个名为 `len` 的 `double` 参数，因此可以在\
  \ UML 图中这样列出：\n\n```\n+ setLength(len : double) : void\n```\n\n图 F-4 显示了包含数据类型、返回类型和参数符号的\
  \ `Rectangle` 类 UML 图。\n\n# 图 F-4\n\n![一个图表显示了“Rectangle” 类的 UML 图。](img/FG_AppF_004.png)图\
  \ F-4 完整替代文本\n\n# 在 UML 图中显示构造函数和析构函数\n\n在 UML 图中有多种接受显示构造函数的方法。在本附录中，我们将像显示任何其他方法一样显示构造函数，只是不列出返回类型。图\
  \ F-5 显示了 `Sale` 类的 UML 图，该类在第 7 章中也被讨论过。该类有两个重载的构造函数，还有一个 `calcSaleTotal` 方法。\n\
  \n# 图 F-5\n\n\n\n\n![图表显示了“Sale”类的 UML 图。](img/FG_AppF_005.png)图 F-5 完整替代文本\n\n\
  # UML 图中的对象组合\n\n该书的 `第 11 章` 介绍了对象组合。当一个类包含另一个类的类的实例作为其成员时，就会发生对象组合。在 UML 图中，对象组合通过一条连接两个类的线来表示，线条的一端有一个空心菱形。菱形最靠近包含其他类实例的那个类。\n\
  \n例如，假设我们有`图 F-6` 所示的 `PersonInfo` 类，它存储关于人的信息。\n\n## 图 F-6\n\n![图表显示了“PersonInfo”类的\
  \ UML 图。](img/FG_AppF_006.png)图 F-6 完整替代文本\n\n假设我们还有`图 F-7` 所示的 `BankAccount` 类，它持有银行账户的余额，并可以执行存款和取款等操作。\n\
  \n## 图 F-7\n\n![图表显示了“BankAccount”类的 UML 图。](img/FG_AppF_007.png)图 F-7 完整替代文本\n\n\
  `图 F-8` 显示了另一个类 `BankCustomer` 的 UML 图，它包含 `PersonInfo` 和 `BankAccount` 类的实例作为成员。类之间的关系通过带有空心菱形的连接线表示。空心菱形最靠近\
  \ `BankCustomer` 类，因为它是一个包含其他类实例作为成员的类。\n\n## 图 F-8\n\n![图表显示了“BankCustomer”、“PersonInfo”和“BankAccount”类。](img/FG_AppF_008.png)图\
  \ F-8 完整替代文本\n\n# 显示保护成员\n\n该书的`第 11 章` 还介绍了继承，允许从现有类派生出新类。如果一个类将作为其他类派生的基类，那么通常最好将其某些成员指定为\
  \ `protected`，而不是 `public` 或 `private`（私有）。正如`第 11 章`所解释的，类的保护成员像私有成员一样受到防止外部使用的保护，但它们可以被派生类的成员函数访问。UML\
  \ 图中可以用 `#` 符号表示保护类成员。`图 F-9` 显示了一个具有两个保护变量和一个保护方法的类的 UML 图。\n\n## 图 F-9\n\n![图表显示了“GradedActivity”类的\
  \ UML 图。](img/FG_AppF_009.png)图 F-9 完整替代文本\n\n# UML 图中的继承\n\n在 UML 图中，你通过连接两个类的一端带有空心箭头的线来表示继承。箭头指向基类。例如，`图\
  \ F-10` 显示了 `GradedActivity` 和 `FinalExam` 的 UML 图。箭头指向基类。\n\n## 图 F-10\n\n![图表显示了“GradedActivity”类的\
  \ UML 图。](img/FG_AppF_010.png)图 F-10 完整替代文本\n\n# 源文件程序\n\n编程学生通常从在单个文件中编写开始。然而，一旦程序规模变大，就有必要将其拆分为多个文件。通常，多文件程序由两种类型组成：包含定义的文件和包含声明的文件。\n\
  \n作为一个示例，考虑一个包含 `loans`（贷款）、`checking`（支票）和 `savings`（储蓄）的银行程序。`图 G-1` 说明了所使用的不同文件：\n\
  \n*   每个 `.cpp` 文件包含定义。\n*   每个 `.h` 头文件包含声明。\n\n## 图 G-1\n\n![图表显示了 8 种不同的文件类型，每种类型描述了文件的内容](img/FG_AppG_001.png)图\
  \ G-1 完整替代文本\n\n# 编译和链接多文件程序\n\n在具有多个源文件的程序中，所有的 `.cpp` 文件都被编译成独立的*对象*（object）文件。然后，这些对象文件被链接成单个可执行文件。如\
  \ Netbeans、Eclipse 和 Microsoft Visual Studio 等集成开发环境促进了这一过程，允许你将一组源代码文件组织成一个*项目*（project），然后使用菜单项将文件添加到项目中。\n\
  \n如果你正在使用如 `g++` 类的命令行编译器，可以通过将源文件名作为命令行参数传递给编译器，来编译所有源文件并创建一个可执行文件：\n\n```\ng++\
  \ -o bankprog bank.cpp loans.cpp checking.cpp savings.cpp\n```\n\n此命令将编译四个源文件并将它们链接成名为\
  \ `bankprog` 的可执行文件。注意，`-o` 之后列出的文件是放置可执行文件的文件名。\n\n# 多文件程序中的全局变量\n\n通常，全局变量只能在定义它的文件中被访问。出于考虑，它们被认为具有*文件作用域*（file\
  \ scope）。然而，通过在第二个文件中放置该变量的 `extern` 声明，可以扩展在一个文件中定义的全局变量的作用域，使其对另一个文件中的函数可见，如下所示：\n\
  \n```cpp\nextern int accountNum;\n```\n\n\n\n\n\n`extern` 声明并没有定义另一个变量；它只是允许访问在其他文件中定义的变量。\n\
  \n只有真正的变量（而不是常量变量）应该被声明为 `extern`。\n\n```\nconst int maxCustomers = 35;      //不要将此声明为\
  \ extern。\n```\n\n这是因为某些编译器会将特定类型的常量变量直接编译到代码中，而不在内存中为它们分配空间，导致无法从另一个文件访问该常量变量。那么，如何允许一个文件中的函数使用另一个文件中定义的变量的值，同时确保它们不会更改该值的值呢？解决方案是使用\
  \ `const` 关键字结合 `extern` 声明。因此，变量在原始文件中定义，如下所示：\n\n```\n string nameOfBank = “First\
  \ Federal Savings Bank”;\n```\n\n在允许访问该变量的另一个文件中，将 `const` 关键字放在 `extern` 声明上，如下所示：\n\
  \n```\n extern const string nameOfBank;\n```\n\n如果你想防止全局变量被其定义文件之外的任何使用，可以将该变量声明为\
  \ `static`。这将其作用范围限制在定义它的文件中，并从其他文件中隐藏了它的名称：\n\n```\n static double balance;\n```\n\
  \n[图 G-2] 显示了示例银行程序中的一些全局变量声明。`customer` 和 `accountNum` 变量定义在 `bank.cpp` 中。因为它们没有被声明为\
  \ `static` 变量，它们的作用范围扩展到 `loans.cpp`、`savings.cpp` 和 `checking.cpp`，这三个文件包含了这些变量的\
  \ `extern` 声明。尽管这些变量是在 `bank.cpp` 中定义的，但可以被其他三个文件中的任何函数访问。\n\n# 图 G-2\n\n![图表显示了\
  \ 4 个文件中的全局变量声明。](img/FG_AppG_002.png)图 G-2 完全替代文本\n\n[图 G-2] 包含了静态全局变量的示例。这些变量无法在定义它们的文件之外被访问。例如，变量\
  \ `interest` 在 `loans.cpp` 和 `savings.cpp` 中都被定义为静态全局变量。这意味着这两个文件中的每个文件都有自己的名为 `interest`\
  \ 的变量，且该变量在定义它的文件之外无法访问。`balance` 和 `deposit` 变量也是如此，它们定义在 `savings.cpp` 和 `checking.cpp`\
  \ 中。\n\n在我们的示例中，变量 `customer` 被定义为字符数组。它本可以被定义为 `string` 对象，但将其制为 C 字符串是为了说明 `extern`\
  \ 声明如何处理数组。注意在 `bank.cpp` 中，该数组带有一个大小说明符定义：\n\n```\n char customer[35];\n```\n\n\
  但在其他文件找到 `extern` 声明中，它被引用为：\n\n```\nextern char customer[];\n```\n\n在一个一维数组中，数组的大小通常在\
  \ `extern` 声明中省略。在多维数组中，第一维的大小通常会被省略。例如，在一个文件中定义的二维数组为：\n\n```\n int myArray[20][30];\n\
  ```\n通过在其他文件中放置以下声明，可以使其他文件访问它。\n\n```\n extern int myArray[][30];\n```\n\n# 面向对象的多文件程序\n\
  \n在创建定义类并创建这些类对象的面向对象程序时，将类声明和成员函数定义存储在单独文件中是常见的。通常，程序组件以以下方式存储：\n\n*   类声明——类声明存储在它自己的头文件中，该文件被称为*类规范文件*。规范文件的文件名通常与类名相同，扩展名为\
  \ `.h`。\n*   成员函数定义——该类的成员函数定义存储在单独的 `.cpp` 文件中，该文件被称为*类实现文件*。该文件必须 `#include` 类规范文件，通常与类名相同，扩展名为\
  \ `.cpp`。\n*   使用该类的客户端函数——任何包含创建和使用类对象的函数的文件也应该 `#include` 类规范文件。它们随后必须与编译后的类实现文件进行链接。\n\
  \n这些组件在接下来的示例中得到了说明，该示例创建并使用了一个 `Address` 类。注意单个程序是如何被拆分成单独文件的。组成程序的 `.cpp` 文件可以单独编译，然后链接以创建可执行程序。\n\
  \n```\n //**********************************************************************\n\
  // address.h 内容\n// 这是包含类声明的规范文件。\n//**********************************************************************\n\
  #include <string>\nusing namespace std;\n\nclass Address\n{private:\n   string name;\n\
  \   string street;\n   string city;\n public:\n   Address(string name, string street,\
  \ string city);\n   Address();\n   void print();\n};\n//***********************************************************************\n\
  // address.cpp 内容\n// 这是包含类成员函数定义的实现文件\n//***********************************************************************\n\
  #include “address.h”\n#include <iostream>\n\nAddress::Address(string name_in, string\
  \ street_in, string city_in)\n{\n   name = name_in;\n   street = street_in;\n  \
  \ city = city_in;\n}\nAddress::Address()\n{\n   name = street = city = ““;\n}\n\
  void Address::print()\n{\n   cout ≪ name << endl\n   ≪ street << endl\n   ≪ city\
  \ << endl;\n}\n//***********************************************************************\n\
  // userfile.cpp 内容\n// 此文件包含使用类的类的代码。\n//***********************************************************************\n\
  #include “address.h”\n\nint main()\n{\n   //创建一个地址并打印它。\n   Address addr(“John Doe”,\
  \ “123 Main Street”, “Hometown, USA”);\n   addr.print();\n\n   // 其他代码可以放在这里。\n\
  \   return 0;\n}\n```\n\n# 附录 H 多继承与虚继承\n\n# 引言\n\n与所有的面向对象编程语言一样，C++ 支持继承的概念。与大多数其他语言不同，C++\
  \ 还支持多重继承。*多重继承*是一种新类同时派自两个或多个基类的继承类型。当程序员在建模一个似乎同时属于一个类类的对象时，应该考虑使用多重继承。例如，可能会有一个\
  \ `Home` 类来建模人类居住的结构，以及另一个 `Automobile` 类来建模人类用于运输目的的某些类型的机器。然后，可以想象一个 `MobileHome`\
  \ 类，其对象同时是 `Home` 和 `Automobile` 类的实例。这种关系在[图 H-1]中所示。\n\n# 图 H-1\n\n![图表显示“MobileHome”通过两个箭头与“Home”和“Mobile”链接。](img/FG_AppH_001.png)\n\
  \n在图中，向上的箭头描绘了*is*-*a*关系，说明了移动房屋既是房屋也是汽车。在 C++ 中，这种关系将通过类声明来表示：\n\n```\n class Automobile\n\
  {\n   // 汽车成员\n};\nclass Home\n{\n  // 房屋成员\n};\nclass MobileHome : public Automobile,\
  \ public Home\n{\n  // MobileHome 的额外成员\n};\n```\n\n\n\n\n\n作为另一种适用于多继承场景的示例，考虑一个拥有各种类型员工的职业体育组织。球员和教练都是员工，因此图\
  \ H-2 所示的继承层级是完全自然的。\n\n## 图 H-2\n\n![图表显示“Player”和“Coach”通过两个独立的箭头连接到“Employee”。](img/FG_AppH_002.png)\n\
  \n现在考虑一种既既是球员又是教练的员工。这类人传统上被称为 `player-coaches`（球员兼教练）。由于球员兼教练既是球员又是教练，我们得到了图 H-3\
  \ 所示的继承图。\n\n## 图 H-3\n\n![图表显示“Player”和“Coach”通过两个独立的箭头连接到“Employee”。图表还显示“PlayerCoach”通过单独箭头连接到“Player”和“Coach”。](img/FG_AppH_003.png)\n\
  \n我们将图 H-3 所示的情况称为 `multiple inheritance diamond`（多继承菱形结构）。图的上半部分是标准的单继承结构，因为它显示\
  \ `Player` 和 `Coach` 都有同一个基类。图的下半部分描述了多继承：它显示 `PlayerCoach` 有两个基类。\n\n## 多继承的 C++\
  \ 实现\n\n在 C++ 中，图 H-3 上半部分所示的继承层级可以使用如下代码实现：\n\n### `PlayerCoach.h` 内容\n\n```cpp\n\
  \ 1 #include <string>\n2 #include <iostream>\n3 using namespace std;\n4 class Employee\n\
  5 {\n6     string name;\n7 public:\n8     string getName(){ return name; }\n9  \
  \   Employee(string name){ this->name = name; }\n10 };\n11\n12 class Player : public\
  \ Employee\n13 {\n14     int salary;\n15 public:\n16     int getSalary(){ return\
  \ salary; }\n17     void play()\n18     {\n19          cout << getName() << \" is\
  \ playing.\\n\";\n20     }\n21      //Constructor\n22     Player(string name, int\
  \ salary):\n23          // Constructor initialization\n24          Employee(name),\
  \ salary(salary)\n25     {\n26     }\n27 };\n28\n29 class Coach : public Employee\n\
  30 {\n31     int salary;\n32 public :\n33     int getSalary(){ return salary; }\n\
  34     void coach()\n35     {\n36          cout << getName() << \" is coaching.\\\
  n\";\n37     }\n38     //Constructor\n39     Coach(string name, int salary):\n40\
  \          // Constructor initialization\n41          Employee(name), salary(salary)\n\
  42     {\n43     }\n44 };\n```\n\n### `PlayerCoach.cpp` 内容\n\n```cpp\n 1 #include\
  \ \"PlayerCoach.h\"\n2 int main()\n3 {\n4   // Create Player and Coach objects\n\
  5   Player phil(\"Phillip\", 20000);\n6   Coach carol(\"Carol\", 30000);\n7   //\
  \ Call play and coach member functions\n8   phil.play();\n9   carol.coach();\n10\n\
  11   return 0;\n12 }\n```\n\n## 程序输出\n\n```\nPhillip is playing.\nCarol is coaching.\n\
  ```\n\n现在让我们考虑使用多继承来定义一个 `PlayerCoach` 类。在此之前，我们应该提到，多继承在 C++ 中很少使用，而且事实上，它可能是使用它的它的程序中许多问题的根源。我们在处理\
  \ `PlayerCoach` 示例时将指出其中一些困难。\n\n同时派生自 `Player` 和 `Coach` 的简单类是：\n\n```cpp\n #include\
  \ \"playercoach.h\"\nclass PlayerCoach : public Player, public Coach\n{\n};\n```\n\
  \n注意，`PlayerCoach` 除了从它的两个基类继承的成员外，没有其他成员。我们刻意这样做是为了让示例尽可能简单。在更真实的情况下，派生类将拥有其基类中没有的额外成员。遗憾的是，这个类将无法编译。原因是它的两个基类都有非默认构造函数，并且需要传递参数。\n\
  \n\n\n\n\n在处理继承自多个具有共同基类 `B` 的类 `K` 的声明时，如果 `B` 被声明为虚基（virtual），编译器将确保 `K` 中只包含一个\
  \ `B` 的拷贝。在解决共享基类多个拷贝问题的同时，虚继承也带来了其自身的一些问题。再次查看 `PlayerCoachMult.h` 中 `PlayerCoach`\
  \ 类第 7 行的构造函数初始化列表：\n\n```\n Player(name, playerSalary), Coach(name, coachSalary)\n\
  ```\n\n由于 `Employee` 是虚基类，`PlayerCoach` 类只有一个 `它的`拷贝。`Player` 和 `Coach` 构造函数的调用会导致\
  \ `PlayerCoach` 内部单个 `Employee` 对象的构造函数被调用两次。这一事实将导致另一个编译器错误。\n\n为了解决虚基类的多次初始化问题，C++\
  \ 编译器将忽略所有派生链中中间类对虚基类构造函数的调用。为了确保虚基类被初始化，C++ 要求**最末端派生类**（most derived class，即多个派生链共同终点的类）来指定共同虚基类的初始化。例如，请查看图\
  \ H-3。那里所示的继承菱形有两条派生链（菱形的左侧和右侧），这两条链上的中间类分别为 `Player` 和 `Coach`。因此，编译器将忽略这两个类构造函数中的\
  \ `Employee(name)` 调用。为了确保 `Employee` 对象被初始化，必须在 `PlayerCoach` 的构造函数初始化列表中包含对其构造函数的调用，而\
  \ `PlayerCoach` 然是最末端派生类。这种修改在下面的代码列表中所示。\n\n# `vPlayerCoach.h` 的内容\n\n```\n 1 #include\
  \ <string>\n2 #include <iostream>\n3 using namespace std;\n4 class Employee\n5 {\n\
  6    string name;\n7 public:\n8    string getName(){ return name; }\n9    Employee(string\
  \ name){ this->name = name; }\n10 };\n12 class Player : virtual public Employee\n\
  13 {\n14    int salary;\n15    public:\n16    int getSalary(){ return salary; }\n\
  17    void play()\n18    {\n19        cout << getName() << \" is playing.\\n\";\n\
  20    }\n21     //Constructor\n22    Player(string name, int salary):\n23      \
  \    // Constructor initialization\n24          Employee(name), salary(salary)\n\
  25    {\n26    }\n27 };\n29 class Coach : virtual public Employee\n30 {\n31    int\
  \ salary;\n32    public :\n33    int getSalary(){ return salary; }\n34    void coach()\n\
  35    {\n36        cout << getName() << \" is coaching.\\n\";\n37    }\n38    //Constructor\n\
  39    Coach(string name, int salary):\n40         // Constructor initialization\n\
  41         Employee(name), salary(salary)\n42    {\n43 };\n```\n\n# `vPlayerCoachMult.h`\
  \ 的内容\n\n```\n 1 #include \"playerCoach.h\"\n2 using namespace std;\n3 class PlayerCoach\
  \ : public Player, public Coach\n4 {\n5     public:\n6     PlayerCoach(string name,\
  \ int playerSalary, int coachSalary):\n7     Player(name, playerSalary), Coach(name,\
  \ coachSalary),\n8     Employee(name)\n9     {\n10    }\n11 };\n```\n\n注意，支持虚继承所需的更改并不广泛。在我们案例中，我们在\
  \ `PlayerCoach.h` 文件的第 12 行和第 29 行增加了关键字 `virtual`，并在最后一个文件的第 8 行增加了对 `Employee`\
  \ 构造函数的调用。与之前示例相同的 `main` 函数对程序进行测试。\n\n# 附录 I 头文件和库函数引用\n\n附录提供了书中讨论的 C++ 库函数的参考。下表（表\
