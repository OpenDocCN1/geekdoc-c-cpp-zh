  \ 意味着存在正常数 `K`，使得对于所有 `n`  ≥ 1，都有 `f(n)` ≤ `K*g(n)`。这意味着对于大规模问题，复杂度函数为 `f(n)` 的算法并不比\
  \ `g(n)` 的差。\n\n## 9.14 要证明 `100*n³+50*n²+75` 属于 `O(20*n³)`，我们必须证明对于所有 `n`  ≥ 1，存在某个常数\
  \ `K` 使得 `100*n³+50*n²+75`≤ `K*(20*n³)`。\n观察对于所有 `n`  ≥ 1\n\n$$\\frac{100n³ +50n²+75}{20n³}\
  \ = 5 + \\frac{50}{2n} + \\frac{75}{20n³} \\leq 5 + 5 + 75 \\leq 85$$\n\n因此，我们找到了一个常数\
  \ `K`，即 `K=85`。\n\n## 9.15 假设对于所有 `n`  ≥ 1，`g(n)` ≥ 1，则对于所有 `n`  ≥ 1，都有 `100≤ 100*g(n)`。这意味着对于所有\
  \ `n`  ≥ 1，都有 `g(n)+100≤ g(n)+100*g(n)=101*g(n)`。现在，如果 `f(n)` 属于 `O(g(n)+100)`，则存在正数\
  \ `K` 使得对于所有 `n`  ≥ 1，都有 `f(n)`≤ `K*(g(n)+100)`≤ 101*g(n)`。取 `K=101`，我们看到对于所有 `n`\
  \  ≥ 1，都有 `f(n)`≤ `K[1]*g(n)`。\n\n# 第 10 章\n\n## 10.1 `cout << &count;`\n\n## 10.2\
