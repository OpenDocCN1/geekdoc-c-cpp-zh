  \ int numRows)`\n4. `void displayData(double const A[][numCols], int numRows)`\n\
  \n## 8.12 STL `vector` 简介\n\n## 概念\n\n标准模板库（Standard Template Library）包含一种名为 `vector`\
  \ 的类型。它类似于一维数组，但与标准数组相比有许多优势。\n\n`Standard Template Library` (STL) 是一组`程序员定义`的数据类型和算法的集合，供你在\
  \ C++ 程序中使用。这些数据类型和算法并不是 C++ 语言的一部分，而是在内置数据类型之外额外创建的。如果你计划在计算机科学领域继续学习，你应该应该熟悉 STL。本节将介绍\
  \ STL 的数据类型之一：`vector`。\n\n## 注意事项\n\n要使用 vector，你的程序头文件必须指示你正在使用 `namespace std`，因为\
  \ vector 包含在那个命名空间中。许多旧版本的编译器不允许命名空间或不支持 STL。\n\n在 STL 中定义的数据类型通常被称为 `containers`（容器）。之所以被称为容器，是因为它们存储并组织数据。STL\
  \ 中有两种类型的容器：序列容器（sequence containers）和关联容器（associative containers）。`sequence container`\
  \ 按照顺序的方式组织数据，类似于数组。`associative containers` 通过键组织数据，允许快速、随机访问存储在容器中的元素。\n\n`vector`\
  \ 数据类型是一种序列容器，它在以下方面类似于一维数组：\n\n* vector 包含一个连续的值序列或元素序列。\n* vector 将其元素存储在连续的内存位置中。\n\
  * 你可以使用数组下标运算符 `[]` 来访问 vector 中的单个元素。\n\n然而，vector 比数组提供了许多优势。这里只是其中几点：\n\n* 你不需要声明\
  \ vector 将有的元素数量。\n* 如果你向已经满的 vector 添加一个值，vector 将自动增加其大小以容纳新值。\n* Vector 可以报告它们包含的元素数量。\n\
  \n### 定义和初始化 Vector\n\n要在程序中使用 vector，你必须通过以下语句包含 `vector` 头文件：\n\n```cpp\n#include\
  \ <vector>\n```\n\n要创建一个 vector 对象，你使用一个语句，其语法与定义普通变量或数组的语法略有不同。这是一个示例：\n\n```cpp\n\
  vector<int> numbers;\n```\n\n该语句将 `numbers` 定义为 `int` 类型的 vector。注意数据类型括在尖括号内，紧跟在\
  \ `vector` 单词之后。因为 vector 会随着你添加值而扩大大小，所以不需要声明大小。不过，如果你愿意，也可以声明一个起始大小。这是一个示例：\n\n\
  ```cpp\nvector<int> numbers(10);\n```\n\n该语句将 `numbers` 定义为包含 10 个 `int` 的 vector，但这只是起始大小。如果你向它添加了超过\
  \ 10 个值，它的大小将会扩大。\n\n## 注意事项\n\n注意，如果你为 vector 指定起始大小，大小声明符是括在括号内的，而不是方括号。\n\n当你为\
  \ vector 指定起始大时，还可以指定一个初始化值。初始化值会被复制到每个元素。这是一个示例：\n\n```cpp\nvector<int> numbers(10,\
  \ 2);\n```\n\n这把 `numbers` 定义为包含 10 个 `int` 的 vector，其中每个元素都初始化为 2。\n\n你还可以使用另一个\
  \ vector 中的值来初始化 vector。例如，如果 `set1` 是一个已经有值的 `int` 类型 vector，以下语句将创建一个名为 `set2`\
  \ 的新 vector，它是 `set1` 的精确拷贝。\n\n```cpp\nvector<int> set2(set1);\n```\n\n在该语句执行后，vector\
  \ `set2` 将具有与 `set1` 相同的元素数量，并持有相同的值集合。\n\n如果你在使用 C++ 11，还可以使用值列表来初始化 `vector`，如下例所示：\n\
  \n```cpp\nvector<int> numbers { 10, 20, 30, 40 };\n```\n\n该语句定义了一个名为 `numbers` 的\
  \ `int` 类型 vector。该 vector 将有四个元素，初始化为值 10、20、30 和 40。注意初始化列表被括在一组括号中，但你不需要在列表之前使用\
  \ `=` 运算符。\n\n表 8-2 总结了我们讨论过的 vector 定义过程。\n\n### 表 8-2 Vector 定义的示例\n\n| 定义格式 |\
  \ 描述 |\n| :--- | :--- |\n| `vector<string> names;` | 这将 `names` 定义为空的 `string` 对象的\
  \ vector。 |\n| `vector<int> scores(15);` | 这将 `scores` 定义为包含 15 个 `int` 的 vector。\
  \ |\n| `vector<char> letters(25, 'A');` | 这将 `letters` 定义为包含 25 个字符的 vector。每个元素都初始化为‘A’。\
  \ |\n| `vector<double> values2(values1);` | 这将 `values2` 定义为 `double` 类型的 vector。`values1`（一个\
  \ vector）的所有元素都被复制。 |\n| `vector<int> length{12, 10, 6};` | 在 C++ 11 中，这将 `length`\
  \ 定义为 `int` 类型的 vector。 |\n\n### 在 Vector 中存储和检索值\n\n要在已存在的 vector 中存储值，或访问存储在 vector\
  \ 中的数据，你可能可以使用数组下标 `[]`。\n\n让我们看看程序 8-24 中的某些行。首先注意第 5 行。它包含了使用 vector 的预处理指令。\n\
  \n```cpp\n#include <vector>\n```\n\n第 10 行和第 11 行定义了两个 vector。\n\n```cpp\nvector<int>\
  \ hours(NUM_EMPS); // 定义整数 vector\nvector<double> payRate(NUM_EMPS); // 定义 double\
  \ vector\n```\n\n因为每个 vector 名称后面都有大小声明符，它们将带有起始大小。在这种情况下，命名常量 `NUM_EMPS` 等于 5，因此两个\
  \ vector 都将从五个元素开始。由于它们已经有了元素，可以像数组一样的方式对其进行读取或赋值。\n\n18 行开始了一个 `for` 循环，其目的是输入用户数据。循环第\
  \ 21 行和第 23 行具有读取输入并将其放入由循环变量 `index` 指定 vector 元素的语句。\n\n```cpp\ncin >> hours[index];\n\
  cin >> payRate[index];\n```\n\n29 行开始了第二个 `for` 循环。其目的是计算并显示每个员工的毛工资。循环 31 行具有执行此计算的语句，使用了从每个\
  \ vector 指定元素获取的数据。\n\n```cpp\ngrossPay = hours[index] * payRate[index];\n```\n\n\
  如果你比较程序 8-24 和程序 8-15，你会发现第 14 行到第 36 行是相同的。\n\n### 在 C++ 11 中配合 `vector` 使用范围 for\
  \ 循环\n\n在 C++ 11 中，你还可以使用范围 `for` 循环来遍历 vector 的元素，就像你在本章早些时候遍历数组元素的那样。程序 8-25 演示了这一点。\n\
  \n\n\n\n\n然而，你不能使用 `[]` 运算符来访问尚未存在的 vector 元素。要将一个值存储在没有初始大小或已经满的 vector 中，你应该使用\
  \ `push_back` 成员函数。该函数接受一个值作为参数，并将其存储在放置于 vector 末尾的新元素中。（它将该值“推”（push）到 vector\
  \ 的“末尾”。）\n\n这里是一个示例，向一个名为 `numbers` 的 `int` 类型 vector 中添加一个元素。\n\n```\nnumbers.push_back(25);\n\
  ```\n\n该语句创建一个持有 25 的新元素，并将其放置在 `numbers` 的末尾。如果 `numbers` 之前没有元素，则该新元素将成为它的唯一元素。\n\
  \n程序 8-26 是 程序 8-24 的修改。然而，这个版本允许用户指定员工的数量。两个 vector `hours` 和 `payRate` 在定义时没有指定初始大小。由于这些\
  \ vector 没有初始元素，因此使用 `push_back` 成员函数向它们中存储值。\n\n注意第 40 行到第 45 行的 程序 8-26 循环，它计算并显示了每个员工的总工资，并使用了\
  \ `[]` 运算符来访问 `hours` 和 `payRate` vector 的元素。这是可以行的，因为第 25 行到第 36 行的第一个循环已经使用 `push_back`\
  \ 成员函数创建了两个 vector 中的元素。\n\n# 确定 vector 的大小\n\n与数组不同，vector 可以报告它们包含的元素数量。这是通过 `size`\
  \ 成员函数实现的。这里是一个使用 `size` 成员函数的语句示例：\n\n```\nnumValues = set.size();\n```\n\n在该语句中，假设\
  \ `numValues` 是一个 `int` 类型，`set` 是一个 vector。在语句执行后，`numValues` 将包含 `set` 中的元素数量。\n\
  \n`size` 成员函数对于编写接受 vector 作为参数的函数特别有用。例如，查看以下关于 `showValues` 函数的代码：\n\n```\nvoid\
  \ showValues(vector<int> vect)\n{\n   for (int count = 0; count < vect.size(); count++)\n\
  \      cout << vect[count] << endl;\n}\n```\n\n因为 vector 可以报告它的大小，所以这个函数不需要第二个参数来指示\
  \ vector 中元素的数量。程序 8-27 展示了这个函数。\n\n注意，当 程序 8-27 中的 vector 在第 11 行定义时，它没有被赋予任何元素。因此，第\
  \ 15 行向 vector 中存储值的语句使用了 程序 8-26 中引入的 `push_back` 函数。`push_back` 函数每调用一次，就会创建一个新的\
  \ vector 元素来持有该值。\n\n# 从 vector 中删除元素\n\n要从 vector 中删除最后一个元素，你可以使用 `pop_back` 成员函数。以下语句从名为\
  \ `collection` 的 vector 中删除最后一个元素。\n\n```\ncollection.pop_back();\n```\n\n程序 8-28\
  \ 展示了 `pop_back` 函数。\n\n### 注意\n\n`pop_back` 函数是一个 `void` 函数，它不返回从 vector 中移除的值。下面的一行代码将无法工作：\n\
  \n```\ncout << \"The value being removed from the vector is \" << values.pop_back()\
  \ << endl;\n```\n\n# 清空 vector\n\n要完全清空 vector 的内容，使用 `clear` 函数，如下所示：\n\n```\n\
  numbers.clear();\n```\n\n执行该语句后，`numbers` 将清空所有元素。程序 8-29 展示了该函数。\n\n# 检测 vector\
  \ 是否为空\n\n要确定 vector 是否为空，使用 `empty` 函数。如果 vector 为空，它返回 `true`；如果包含元素，则返回 `false`。假设\
  \ `numberVector` 是一个 vector，其用法如下：\n\n```\nif (numberVector.empty())\n    cout <<\
  \ \"No values in numberVector.\";\n```\n\n# vector 函数总结\n\n程序 8-30 总结了我们讨论过的 vector\
  \ 函数，以及一些额外的：\n\n| 成员函数 | 描述 |\n| --- | --- |\n| `at(position)` | 返回 vector 中位于\
  \ `position` 位置的值。示例：`x = vect.at(5);` |\n| `clear()` | 清空 vector 的所有元素。示例：`vect.clear();`\
  \ |\n| `empty()` | 如果 vector 为空返回 `true`；否则返回 `false`。示例：`if (vect.empty()) cout\
  \ << \"The vector is empty.\";` |\n| `pop_back()` | 从 vector 中删除元素。示例：`vect.pop_back();`\
  \ |\n| `push_back(value)` | 在 vector 的最后一个元素处存储值。如果 vector 已满或为空，将创建一个新元素。示例：`vect.push_back(7);`\
  \ |\n| `resize(n)`, `resize(n, value)` | 将 vector 调整为具有 `n` 个元素（n 大于当前大小）。如果包含可选参数\
  \ `value`，每个新元素将初始化为该值。示例 `vect` 目前有四个元素：`vect.resize(6,99);` // 向 vector 添加两个元素，每个初始化为\
  \ 99。 |\n| `size()` | 返回 vector 中元素的数量。示例：`numElements = vect.size();` |\n| `swap(vector2)`\
  \ | 将 vector 的内容与 `vector2` 的内容交换。示例：`vect1.swap(vect2);` |\n\n# 练习\n\n1. 8.27 定义\
  \ vector 对象需要包含哪个头文件？\n2. 8.28 为以下 vector 对象编写定义语句：`frogs`（一个空的 `int` vector）、`lizards`（包含\
  \ 20 个 `double` 的 vector）和 `toads`（包含 100 个 `char` 的 vector，每个元素初始化为 'Z'）。\n3. 8.29\
  \ 定义 `gators` 为一个空的 `int` vector，并将 `snakes` 为一个 10 元素的 `double` vector。然后写一个语句将\
  \ 27 存储在 `gators` 中，并在一个语句将 12.89 存储在 `snakes` 的第 4 个元素中。\n\n# 8.13 对象数组\n\n## 概念\n\
  \n数组的元素可以是类对象。\n\n你已经学习了数组的所有元素必须是相同类型，并且见过许多不同的简单类型数组，如 `int` 数组和 `string` 数组。然而，数组也可以包含更复杂的类型，例如程序员定义的结构或对象。要求是每个元素持有相同类型的结构或相同类的对象。\n\
  \n让我们来看看对象数组。定义对象数组的方法与定义任何数组的方法相同。例如，如果已经定义了一个名为 `Circle` 的类，你可以这样创建一个可以容四个 `Circle`\
  \ 对象的数组：\n\n```cpp\nCircle circle[4];\n```\n\n\n\n这四个对象分别是 `circle[0]`、`circle[1]`、`circle[2]`\
  \ 和 `circle[3]`。\n\n请注意，类名是 `Circle`，首字母大写。数组名是 `circle`，首字母小写。你可能记得在第 7 章 中提到过，惯例是类名以大写字母开头，变量或对象名以小写字母开头。为这些对象中的一个调用类函数与调用任何其他对象的类函数相同，区别在于必须包含下标以标识引用数组中的哪一个对象。例如，以下语句将调用\
  \ `circle[2]` 的 `findArea` 函数。\n\n```\ncircle[2].findArea();\n```\n\n程序 8-31 通过创建和使用\
  \ `Circle` 类对象数组说明了这些思想。以下是它所使用的 `Circle` 类的定义。它是第 7 章中引入的 `Circle` 类的变体。\n\n在查看下面的程序\
  \ 8-31 时，请特别注意它的关键部分。第 5 行包含了 `Circle.h` 头文件，其中包含 `Circle` 类的定义。然后，在第 12 行，程序创建了一个四个\
  \ `Circle` 对象的数组。在第 15 到 20 行中，它使用循环来调用每个对象的 `setRadius` 方法。第 26 到 29 行使用第二个循环来调用每个对象的\
  \ `findArea` 方法并显示结果。\n\n### 注意\n\n每当在不带构造函数参数的情况下创建对象数组时，如果存在默认构造函数，它会为数组中的每个对象运行。这在程序\
  \ 8-31 中就发生过。\n\n当 `Circle` 对象数组首次创建时，默认构造函数为数组中的每个对象执行，并将其半径赋值为值 1.0。我们从未看到过这一点，因为对每个对象的\
  \ `setRadius` 成员函数的调用将传递给 `setRadius` 的新值替换了原来的 1.0。如果我们注释掉程序 8-31 的第 15 到 20 行，将不会对\
  \ `setRadius` 进行调用。因此，当第 26 到 29 行的循环获取并打印面积时，数组中的每个对象的半径仍为 1.0。输出将如下：\n\n```\n\
  Here are the areas of the 4 circles.\ncircle 1    3.14\ncircle 2    3.14\ncircle\
  \ 3    3.14\ncircle 4    3.14 \n```\n\n此版本的程序 8-31 可以在书籍配套网站的第 8 章程序文件夹中找到，名为 `pr8-31B.cpp`。\n\
  \n也可以创建一个对象数组并为每个对象调用另一个构造函数。要做到这一点，必须使用初始化列表。下面的数组定义和初始化列表创建了四个 `Circle` 对象，并将它们初始化为在原始程序\
  \ 8-31 中输入的四个相同值。\n\n\n\n\n```cpp\nclass Yard\n{\nprivate:\n   int length, width;\n\
  public:\n   Yard()\n      { length = 0; width = 0; }\n   void setLength(int len)\n\
  \      { length = len; }\n   void setWidth(int w)\n      { width = w; }\n};\nint\
  \ main ()\n{\n   // 完成此程序。\n}\n```\n\n# 结构体数组\n\n如本节前面提到的，数组元素也可以是结构体。当你想要存储一组包含多个数据字段的记录，但又不使用对象时，这种方法非常有用。我们之前看过的程序\
  \ 8-15 展示了如何通过并行数组存储不同数据类型的相关信息。这些是两个或多个通过其下标之间建立关系的数组。由于结构体可以包含多种不同数据类型的项目，因此可以使用单个结构体数组来代替多个普通变量数组。\n\
  \n结构体数组的定义方式与其他任何数组相同。假设程序中存在以下结构体声明：\n\n```cpp\n struct BookInfo\n{\n   string\
  \ title;\n   string author;\n   string publisher;\n   double price;\n};\n```\n\n\
  以下语句定义了一个名为 `bookList` 的数组，它有 20 个元素。每个元素都是一个 `BookInfo` 结构体。\n\n```cpp\n BookInfo\
  \ bookList[20];\n```\n\n可以通过下标访问数组的每个元素。例如，`bookList[0]` 是数组中的第一个结构体，`bookList[1]`\
  \ 是第二个，以此此类推。由于结构体的成员默认是公开的，你不需要像使用类对象那样使用函数来访问它们。你只需要在下标后加上点运算符和成员名称，即可访问任何元素的某个成员。\n\
  \n例如，以下表达式指向 `bookList[5]` 的 `title` 成员：\n\n```cpp\n bookList[5].title\n```\n\n\
  以下循环遍历数组，显示存储在每个元素中的数据：\n\n```cpp\n for (int index = 0; index < 20; index++)\n{\n\
  \  cout << bookList[index].title << endl;\n  cout << bookList[index].author << endl;\n\
  \  cout << bookList[index].publisher << endl;\n  cout << bookList[index].price <<\
  \ endl << endl;\n}\n```\n\n由于成员 `title`、`author` 和 `publisher` 是 `string` 对象，因此组成字符串的单个字符也可以被访问。以下语句显示\
  \ `bookList[10]` `title` 成员的第一个字符：\n\n```cpp\n cout << bookList[10].title[0];\n\
  ```\n\n以下语句将字符 ‘t’ 存储在 `bookList[2]` `publisher` 成员的第四个位置：\n\n```cpp\n bookList[2].publisher[3]\
  \ = 't';\n```\n\n程序 8-33 是程序 8-15 的修改版本，用于计算并显示一组员工的薪资信息。原始程序使用两个并行数组来存储员工的工时和薪率。这个修改版本使用单个结构体数组。\n\
  \n你可以像初始化类对象数组一样，使用构造函数来初始化结构体数组。以下是来自程序 8-33 的结构体声明，修改后包含了一个构造函数。它接受两个参数，但也具有默认值，以防在不向构造函数传递任何值的情况下创建结构体变量。\n\
  \n```cpp\n struct PayInfo\n{\n   int hours;                           // 工时\n  \
  \ double payRate;                      // 小时薪率\n\n   PayInfo(int h = 0, double p\
  \ = 0.0)   // 构造函数\n   {  hours = h;\n      payRate = p;\n   }\n};\n```\n\n使用该结构体，现在程序\
  \ 8-33 中的数组可以如下初始化：\n\n```cpp\n PayInfo workers[NUM_EMPS] = { PayInfo(10,  9.75),\n\
  \                              PayInfo(15,  8.65),\n                           \
  \   PayInfo(20, 10.50) };\n```\n\n注意，初始化结构体数组的语法与初始化对象数组相同。它与第 7 章中初始化单个结构体的语法不同。\n\
  \n# 练习题 (Checkpoint)\n\n对于 8.34–8.38，假设 `Product` 结构体如下：\n\n```cpp\n struct Product\n\
  {\n   string description; // 描述\n   int partNum;         // 编号\n   double cost;\
  \         // 价格\n};\n```\n\n1. 8.34 为 `Product` 结构体添加两个构造函数。第一个应该是默认构造函数，将 `description`\
  \ 成员设置为空字符串并将 `partNum` 和 `cost` 成员设置为零。第二个构造函数应有三个参数：一个 `string`、一个 `int` 和一个 `double`。它将参数的值赋给\
  \ `description`、`partNum` 和 `cost` 成员。\n\n2. 8.35 定义一个名为 `items` 的数组，可以容纳 100 个\
  \ `Product` 结构体。\n\n3. 8.36 编写语句，将以下信息存储在 8.35 定义的 `items` 数组的第一个元素中：\n\n    ```\n\
  \     描述: 羊锤       编号: 547       价格: $8.29\n    ```\n\n4. 8.37 编写一个循环，显示你在 8.40\
  \ 创建的整个 `items` 数组。\n\n5. 8.38 编写 `Product` 结构体数组的定义，用以下信息初始化前三个元素：\n\n| 描述 | 编号\
  \ | 价格 |\n| --- | --- | --- |\n| 螺丝刀 | 621 | $1.72 |\n| 套筒套装 | 892 | 18.97 |\n|\
  \ 羊锤 | 547 | 8.29 |\n\n6. 8.39 编写一个名为 `Measurement` 的结构体声明，包含一个 `int` `miles` 和一个\
  \ `double` `hours`。\n\n7. 8.40 编写一个名为 `Destination` 的结构体声明，具有以下成员：\n\n```cpp\n \
