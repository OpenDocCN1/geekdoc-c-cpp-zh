  6. 20.12 描述删除有两个孩子节点的步骤。\n\n# 20.3 二叉搜索树的模板考虑\n\n## 概念\n\n二叉搜索树可以实现为模板，但与它们使用的任何数据类型必须支持\
  \ `<`, `>`, `==` 运算符。\n\n二叉树模板的实际实现留给学习过第 16 章的学生。在设计模板时，记住存储在二叉树中的任何数据类型必须支持 `<`,\
  \ `>`, `==` 运算符。如果你使用树存储类对象，则必须重载这些运算符。\n\n## 复习题与练习\n\n### 空选题与简答\n\n1. 二叉树中的第一个节点被称为\
