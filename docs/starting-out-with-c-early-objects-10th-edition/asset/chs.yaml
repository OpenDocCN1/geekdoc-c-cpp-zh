  \ wedge`，然后让它们相互移动直到在中间相遇。这两个形状在相遇时应形成一个领结。\n\n# 第 16 章 异常与模板\n\n## 16.1 异常\n\n\
  ## 概念\n\n异常用于信号程序运行期间发生的错误或意外事件。\n\n错误测试通常是一个涉及 `if` 语句或其他控制机制的直接过程。例如，以下代码段将在除以零错误发生前捕获到它：\n\
  \n```cpp\nif (denominator == 0)\n   cout << \"ERROR: Cannot divide by zero.\\n\"\
  ;\nelse\n   quotient = numerator / denominator;\n```\n\n但如果类似代码是返回商的函数的一部分时，如下例所示呢：\n\
  \n```cpp\n// 一个不可靠的除法函数\ndouble divide(double numerator, double denominator)\n{\n\
  \    if (denominator == 0)\n       {\n         cout << \"ERROR: Cannot divide by\
  \ zero.\\n\";\n         return 0;\n      }\n   else\n       return numerator / denominator;\n\
  }\n```\n\n函数通常通过返回预定义的值来信号错误状态。在这个例中，当尝试除以零时，函数返回 0。然而，这是不可靠的，因为 0 是除法操作有效的结果。尽管函数显示了错误消息，调用该函数的程序部分也不知道何时发生了错误。这类问题需要更高级的错误处理技术。\n\
  \n### 抛出异常\n\n处理复杂错误条件的一种方法是使用 `exceptions`。异常是一个信号错误的值或对象。当错误发生时，异常被认为被“抛出”（thrown），因为控制将传递给程序中捕获并处理该类型错误的部分。例如，以下代码显示了后的\
  \ `divide` 函数，当尝试除以零时会抛出一个异常。\n\n```cpp\ndouble divide(double numerator, double\
  \ denominator)\n{\n   if (denominator == 0)\n        throw string(\"ERROR: Cannot\
  \ divide by zero.\\n\");\n   else\n        return numerator / denominator;\n}\n\
  ```\n\n以下语句导致异常被抛出。\n\n```cpp\nthrow string(\"ERROR: Cannot divide by zero.\\n\"\
  );\n```\n\n`throw` 关键字后面跟着一个参数，可以可以是任何值。正如你所看到的，参数的类型用于确定错误的性质。上述函数只是抛出一个包含描述性错误消息的字符串对象。\n\
  \n包含 `throw` 语句的行被称为“抛点”（throw point）。当执行 `throw` 语句时，控制传递给程序的另一个部分，即“异常处理器”（exception\
  \ handler）。\n\n### 处理异常\n\n为了处理异常，程序必须有一个 `try/catch` 结构。`try/catch` 结构的通用格式为\n\n\
  ```cpp\ntry\n{\n   // 此处的代码调用可能抛出异常的\n   // 函数或对象\n}\ncatch(exception parameter)\n\
  {\n   // 此处的代码处理异常\n}\n// 根据需要重复多个 catch 块\n```\n\n结构的第一个部分是 `try` 块。它以 `try` 关键字开头，后面跟着代码块，执行可能直接或间接导致抛出异常的语句。`try`\
  \ 块紧接着是一个或多个 `catch` 块，它们是异常处理器。`catch` 块以 `catch` 关键字开头，后面跟着包含异常参数声明的括号。例如，这是一个可以与\
  \ `divide` 函数使用的 `try/catch` 结构：\n\n```cpp\ntry\n{\n   quotient = divide(num1, num2);\n\
  \   cout << \"The quotient is \" << quotient << endl;\n}\ncatch (string exceptionString)\n\
  {\n   cout << exceptionString;\n}\n```\n\n由于 `divide` 函数抛出的类型为字符串的异常，必须有一个捕获字符串的异常处理器。所示的\
