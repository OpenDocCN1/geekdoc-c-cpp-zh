  \n# 12. `Stats` 类与降雨统计\n\n\n\n\n\n## Stats 类\n\n创建一个 `Stats` 类，其成员数据包含一个能够存储 30\
  \ 个 `double` 值的数组，其成员函数包括 `total`、`average`、`lowest` 和 `highest` 函数，用于向客户端程序返回数据信息。这些函数是你在“编程挑战\
  \ 8”中创建的函数的通用版本，但现在它们属于 `Stats` 类，而不是属于应用程序。除了这些函数外，`Stats` 类还应该有一个布尔类型的 `storeValue`\
  \ 函数，它接受来自客户端程序的 `double` 值并将其存储在数组中。该函数的任务是跟踪数组中当前有多少个值，这样它就知道了该将接收到的下一个值存放在什么位置，并在执行其他函数时知道有多少个值需要处理。该函数的另一个任务是确保接受的值不超过\
  \ 30 个。如果 `storeValue` 函数能够成功存储其发送给它的值，它应该向客户端程序返回 `true`。然而，如果客户端程序尝试存储第 31 个值，该函数不应存储该值并向客户端程序返回\
  \ `false`。\n\n客户端程序应该创建并使用 `Stats` 对象来完成与“编程挑战 8”中相同的降雨分析。注意，`Stats` 对象不进行 I/O。所有的输入和输出都由客户端程序完成。\n\
