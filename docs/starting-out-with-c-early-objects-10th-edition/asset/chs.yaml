  \ 或 4）\n* 季度销售额\n\n应要求用户输入东、西、北、南四个部门的四个季度的销售数据。每个部门的每个季度的信息应被写入文件。\n\n# 14. 公司销售数据输入\n\
  \n编写一个程序，读取编程挑战 13 程序创建的文件。程序应计算并显示以下数据：\n\n* 每个季度的公司总销售额\n* 每个部门的年度总销售额\n* 年度总销售额\n\
  * 部门的平均季度销售额\n\n# 15. 库存程序\n\n编写一个程序，使用结构体在文件中存储以下库存：\n\n* 描述\n* 数量\n* 批发价格\n* 零售价格\n\
  * 添加日期\n\n程序应有一个菜单，允许用户执行以下任务：\n\n* 向文件添加新记录\n* 显示文件中的任何记录\n* 修改文件中的任何记录\n\n# 16.\
