  \ feetPerSecond << \" feet per second.\\n\";\n```\n\n## 3.6 多赋值与复合赋值 (Multiple and\
  \ Combined Assignment)\n\n## 概念 (Concept)\n\n多赋值意味着一条语句为多个变量分配相同的值。\n\nC++ 允许你同时为多个变量赋值。如果程序有几个变量，例如\
  \ `a`、`b`、`c` 和 `d`，且每个变量都需要赋予相同的值（例如 12），可以写成：\n\n```\na = b = c = d = 12;\n```\n\
  \n值 12 将赋值给语句中列出的每个变量。之所以有效，是因为赋值操作是从右向左执行的。首先将 12 赋值给 `d`。然后将 `d` 的值（现在是 12）赋值给\
  \ `c`。接着将 `c` 的值赋值给 `b`，最后将 `b` 的值赋值给 `a`。\n\n这是另一个示例。在该语句之后，`store1` 和 `store2`\
  \ 将包含相同的值。\n\n```\nstore1 = store2 = value;\n```\n\n## 复合赋值 (Combined Assignment)\n\
  \n程序经常会有如下赋值语句：\n\n```\nnumber = number + 1;\n```\n\n右侧的表达式给出 `number` 加 1 的值。然后将结果赋值给\
  \ `number`。\n\n```\nnumber += 1;\n```\n\n如果你从未见过这种语句，它可能会引起一些困惑，因为同一个变量出现在两边。\n\n\
  ## 表 3-8 改变变量值的赋值\n\n| 语句 | 操作 | x 的值 |\n| --- | --- | --- |\n| `x = x + 4;` | 将\
  \ x 加 4 | 10 |\n| `x = x − 3;` | 从 x 减去 3 | 3 |\n| `x = x * 10;` | 将 x 乘以 10 | 60\
  \ |\n| `x = x / 2;` | 将 x 除以 2 | 3 |\n| `x = x % 4;` | 使 x 等于 x 对 4 | 2 |\n\n由于这类操作非常常见，C++\
  \ 提供了一组专门为这些设计的运算符。\n\n## 表 3-9 复合运算符 (Combined Operators)\n\n| 运算符 | 示例用法 | 等于\
  \ |\n| --- | --- | --- |\n| `+=` | `x += 5;` | `x = x + 5;` |\n| `-=` | `y −= 2;`\
  \ | `y = y − 2;` |\n| `*=` | `z *= 10;` | `z = z * 10;` |\n| `/=` | `a /= b;` |\
  \ `a = a / b;` |\n| `%=` | `c %= 3;` | `c = c % 3;` |\n\n如所示，复合赋值运算符不需要程序员输入两次变量。\n\
  \n更复杂的语句也可以用复合赋值运算符表示。这里有一个示例：\n\n```\nresult *= a + 5;\n```\n\n在该语句中，`result` 乘以\
  \ `a + 5` 的和。注意，复合赋值运算符的优先级低于普通算术运算符，因此上述语句等同于\n\n```\nresult = result * (a + 5);\n\
  ```\n\n## 表 3-10 使用复合运算符和算术运算符的示例\n\n| 示例用法 | 等于 |\n| --- | --- |\n| `x += b + 5;`\
