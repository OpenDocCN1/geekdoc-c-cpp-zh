  ## 概念\n\n有时候有必要将值从一种数据类型转换为另一种。C++ 提供了实现这一点的方法。\n\n如果将一个浮点值赋值给 `int` 变量，变量将接收什么值？如果一个\
  \ `int` 乘以一个 `float`，结果将是什么数据类型？如果一个 `double` 除以一个 `unsigned` `int` 会怎样？是否有办法可以预测这些情况下发生的情况？答案是肯定的。当运算符的操作数具有不同数据类型时，C++\
  \ 会自动将它们转换为相同的数据类型。在这样做时，它遵循一套规则，理解这些规则将帮助你防止微妙的错误侵入你的程序。\n\n就像军队中的军官一样，数据类型是有等级的。如果一个数值数据类型可以存放更大的数字，那么它的优先级就高于另一种。例如，`float`\
  \ 的优先级高于 `int`，而 `double` 的优先级高于 `float`。表 3-7 按从高到低的优先级顺序列出了数值数据类型。\n\n## 表 3-7\
  \ 数据类型排序\n\n| `long double` | `double` | `float` | `unsigned long int` | `long long\
  \ int` | `unsigned long int` | `long int` | `unsigned int` | `int` |\n\n表 3-7 排序中的一个例外是\
  \ `int` 和 `long int` 的大小相同时。在这种情况下，`unsigned` `int` 的优先级高于 `long int`，因为它可以持有更高的值。\n\
  \n当 C++ 处理运算符时，它力求将操作数转换为相同类型。这种隐式或自动的转换被称为`类型强制转换` (`type coercion`)。当一个值转换为更高数据类型时，被称为`提升`\
  \ (`promoted`)。将一个值`降级` (`demote`) 意味着将其转换为较低的数据类型。让我们来看控制数学表达式求值的具体规则。\n\n**规则\
  \ 1：** `char`、`short` 和 `unsigned` `short` 值会自动提升为 `int` 值。\n\n你会发现 `char`、`short`\
  \ 和 `unsigned short` 没有出现在表 3-7 中。这是因为每当这些数据类型的值在数学表达式中使用时，它们都会自动提升为 `int`。¹\n\n\
  **规则 2：** 当一个运算符处理两个不同数据类型的值时，较低优先级的值会被提升为较高优先级值的类型。\n\n在下面的表达式中，假设 `years` 是一个\
  \ `int` 变量，`interestRate` 是一个 `double` 变量：\n\n```cpp\nyears * interestRate\n```\n\
  \n\n\n\n由于括号内的操作在其他操作之前执行，因此除法运算符将对其两个整数操作数执行整数除法，表达式 `books / months` 的结果将为 4。然后，4\
  \ 将转换为 `double` 值 4.0，这个值将被赋值给 `booksPerMonth`。\n\n## 警告！\n\n为了防止整数除法的发生，在执行除法操作之前，应将一个操作数转换为\
  \ `double`。这将强制 C++ 自动将另一个操作数的值转换为 `double`。\n\n程序 3-8 显示了类型转换的另一种用法。\n\n让我们仔细观察这个程序。在第\
  \ 7 行，`int` 变量 `number` 初始化为 65。在第 10 行，`number` 被发送到 `cout`。在第 14 行，使用类型转换表达式在将\
  \ `number` 发送到 `cout` 之前将其值转换为 `char` 类型。字符在内存中被存储为整数 ASCII 码。由于 65 是字母 ‘A’ 的 ASCII\
  \ 码，第 14 行的语句导致显示字母 ‘A’。\n\n### 注意\n\nC++ 提供了多种类型转换表达式。`static_cast` 是最常用的类型转换表达式，因此我们在书中主要使用它。关于类型转换的更多信息请参阅附录\
  \ K 以及本书的配套网站 [sonhighered.com/gaddis](http://sonhighered.com/gaddis)。\n\n## C 风格和预标准\
  \ C++ 类型转换表达式\n\n尽管 `static_cast` 是目前首选的类型转换表达式，但 C++ 也支持两种旧形式：C 风格形式和预标准 C++ 形式。C\
  \ 风格转换将要转换的数据类型放在括号内，位于要转换的操作数之前。由于类型转换运算符位于操作数之前，这种表示法被称为`前缀表示法`（prefix notation）。这是一个示例：\n\
  \n```\nbooksPerMonth = (double)books / months;\n```\n\n预标准 C++ 形式的类型转换表达式也将将要转换的数据类型放在要转换的操作数之前，但它将括号放在操作数周围。这种类型转换被称为`函数表示法`（functional\
  \ notation）。这是一个示例：\n\n```\nbooksPerMonth = double(books) / months;\n```\n\n## 检查点\n\
