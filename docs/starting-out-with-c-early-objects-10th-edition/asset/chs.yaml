  \n*   1 美元 = 111 日元\n*   1 美元 = .86 欧元\n\n### 16. 月销售税\n\n一家零售公司必须提交每月销售税报告，列出当月的销售额和收缴的销售税金额。编写一个程序询问月份、年份以及收银台收到的总金额（即销售额加销售税）。假设州销售税为\
