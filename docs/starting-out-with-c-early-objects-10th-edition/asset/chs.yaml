  \n# 软技能 (Soft Skills)\n\n20. 本章学习的所有三种二叉树遍历方法在遍历右子树之前都会遍历左子树。这是西方文化的产物，人们习惯于从左到右阅读页面上打印的材料。在在全球化日益增强的世界里，提供给海外市场的产品和服务必须设计成能够轻松修改，以针对不同的市场。与你的同学讨论一下这些国际化考量如今如何影响计算机软件和硬件的设计。与修过国际商务课程的朋友讨论一下，或者你自己去修一门此类课程，以便更好地地认识到企业在进入国际市场时面临的一些问题。\n\
  \n# 编程挑战 (Programming Challenges)\n\n## 1 简单的二叉搜索树类\n\n编写一个类来实现一个能够存储数字的简单二叉搜索树。该类应包含成员函数：\n\
