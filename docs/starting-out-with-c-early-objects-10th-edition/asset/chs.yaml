  file.seekg(30L, ios::cur);\n```\n6. [13-33] 描述以下每个操作会导致文件以什么模式打开：\n```\nfile.open(\"\
  info.dat\", ios::in | ios::out);\nfile.open(\"info.dat\", ios::in | app);\nfile.open(\"\
  info.dat\", ios::in | ios::out | ate);\nfile.open(\"info.dat\", ios::in | ios::out\
  \ | binary);\n```\n\n# 在线社交案例研究\n\nOnline Connections 是一项帮助人们见面和交朋友的在线服务。想要加入俱乐部并使用其服务的人填写注册表，说明他们的姓名、年龄、联系信息、性别、爱好、个人兴趣以及关于自己的其他相关信息。他们还指定了希望在朋友身上寻找特质。如果提交的个人信息显示有很大概率匹配成功，该服务将尝试将两个人聚在一起。\n\
  \n# 对象序列化\n\nOnline Connections 将在文件中存储其成员的信息。成员信息将由 C++ 程序进行处理，并存储在设计适当的类对象中。这些对象可能涉及指向其他对象的指针，形成对象网络，在将数据存储到文件时，必须以某种方式保留这种结构。当稍后从文件中读回数据时，该结构将得到重建。将通过指针相互连接的复杂对象网络转换为可以存储在磁盘文件（或中央内存之外的某些介质）的形式的过程被称为`对象序列化`。\n\
  \n在本节中，我们将通过查看一个包含 C++ `string` 对象的对象序列化的简单案例，说明序列化对象时的一些技术。记住，C++ 字符串通常是使用指向动态分配的\
  \ `char` 数组的指针实现的。\n\n# 设计程序所需的类\n\n一个存储 Online Connections 成员提交的部分信息的简单类可能包括成员的名字、中间首字母、姓氏和年龄。除了通常的\
  \ getter（get）和 setter（set）函数外，我们还需要用于序列化（`serializing`）对象的成员函数：即将对象转换为存储在文件中数据的成员函数：\n\
  \n```\nvoid store(ofstream &outFile);\n```\n\n我们还需要一个用于反序列化（`deserializing`）对象的成员函数：从之前由\
  \ `store` 放置在文件中读取数据，恢复其结构并正确设置对象的数据成员：\n\n```\nvoid load(ifstream &inFile);\n```\n\
  \n在添加构造函数和 `display` 成员函数后，我们得到了如下类：\n\n# `serialization.h` 的内容\n\n```\n#include\
  \ <iostream>\n#include <fstream>\n#include <string>\nusing namespace std;\n\nclass\
  \ Person\n{\n  string fname, lname;\n  char mi;\n  int age;\npublic:\n  string getFname()\
  \ const {return fname;}\n  string getLname() const {return lname;}\n  char getMi()\
  \ const {return mi;}\n  int getAge() const {return age;}\n\n  void setFname(string\
  \ name){fname = name;}\n  void setLname(string name){lname = name;}\n  void setMi(char\
  \ ch){mi = ch;}\n  \n  // 从文件中读取数据\n  void load(ifstream &inFile);\n  // 存储到文件中\n\
  \  void store(ofstream &outFile);\n  \n  // 构造函数\n  Person(string fname = \"\",\
  \ char mi = 0,\n         string lname = \"\", int age = 0);\n\n  void display()\n\
  \  {\n    cout << fname << \" \" << mi << \" \" << lname << endl\n         << \"\
  Age : \" << age << endl;\n  }\n};\n```\n\n# 确定序列化方案\n\n\n\n\n我们不能直接将 `Person` 对象的内容写入磁盘文件，因为字符串成员包含指向字符数组的指针，这些指针需要被存储起来，以便在以后反序列化对象时能够重新构造字符串对象。由于字符串的长度不一，`Person`\
  \ 对象在反序列化时在磁盘上占据的空间也不同。一种简单有效的序列化方案是：首先写入对象中所有占用常数空间的成员，然后将每个空间需求变化的成员写入磁盘，并在其前面加上该成员所占的字节数。对于\
  \ `Person` 类，我们可以使用图 13-5 所示的方案。\n\n# 图 13-5 简单的序列化方案\n\n![插图显示一个矩形被分为 6 个等大的水平部分。](img/FG_13_005.png)图\
  \ 13-5 完整替代文本\n\n`store` 函数的代码非常简单直观，可以在 `serialization.cpp` 文件的列表中看到。设计 `load`\
  \ 函数时，我们注意到需要通过首先将数据部分读入内存中的 `buffer`（这是一个字符数组）中，来重构 `fname` 和 `lname` 字符串。为了对 `fname`\
  \ 执行此操作，我们首先从文件中读取其数据部分所占的字节数：\n\n```cpp\nint firstNameLength;\ninFile.read(addr(&firstNameLength),\
  \ sizeof(int));\n```\n\n然后我们必须读取相应字节数的缓冲区中，并对缓冲区进行空终止处理，以将其转换为 C 字符串：\n\n```cpp\n\
  inFile.read(buffer, firstNameLength);\nbuffer[firstNameLength] = '\\0';\n```\n\n\
  最后，我们通过将 C 字符串赋值给 `fname` 成员，将其转换为字符串对象。C++ 字符串有一个 `convert` 构造函数，可以自动将 C 字符串转换为字符串对象，使得这种赋值成为可能。\n\
  \n```cpp\nframe = buffer;\n```\n\n`buffer` 数组被用作临时存放地。将其变为类的实例成员将会在每个对象中为其分配空间并浪费大量内存。更好的主意是将其变为类的静态成员，这样对象的所有成员就可以共享这个临时空间。然而，我们注意到它只被\
  \ `load` 成员函数使用。出于此原因，我们将其设为局部静态。这样，缓冲区的空间只分配一次，而不是每次调用 `load` 时都分配新的。静态局部变量在第 6\
  \ 章中描述过。\n\n实现 `Person` 类所需的其余成员函数在 `serialization.cpp` 文件的列表中。\n\n# `serialization.cpp`\
  \ 内容\n\n```cpp\n 1 #include \"serialization.h\"\n 2 \n 3 Person::Person(string fname,\
  \  char mi,\n 4                string lname,  int age)\n 5 {\n 6    this–>fname\
  \ = fname;\n 7    this–>lname = lname;\n 8    this–>mi = mi;\n 9    this–>age =\
  \ age;\n10 }\n11  \n12 //*********************************************\n13 // 存储\
  \ mi, age，然后 fname 的长度，      *\n14 // 然后是 fname 的数据，然后 lname 的长度， *\n15 // 然后是 lname\
  \ 的数据                        *\n16 //*********************************************\n\
  17 void Person::store(ofstream &outFile)\n18 {\n19    outFile.write(&mi, sizeof(mi));\n\
  20    outFile.write(reinterpret_cast<char *>(&age),\n21                  sizeof(age));\n\
  22  \n23    // 写入 fname 和 lname 的长度和数据\n24    int firstNameLength = fname.length();\n\
  25    outFile.write(reinterpret_cast<char *>(&firstNameLength),\n26            \
  \      sizeof(int));\n27    outFile.write(fname.data(), firstNameLength);   \n28\
  \    int lastNameLength = lname.length();\n29    outFile.write(reinterpret_cast<char\
  \ *>(&lastNameLength),\n30                  sizeof(int));  \n31    outFile.write(lname.data(),\
  \ lastNameLength); \n32  }\n33  \n34  //**********************************************\n\
  35  // 按照 Person::store 写入的格式读取     *\n36  // 数据                               \
  \      *\n37  //**********************************************\n38  void Person::load(ifstream\
  \ &inFile)\n39  {\n40     const int BUFFER_SIZE = 256;\n41     static char buffer[256];\
  \ //用于读取名称\n42  \n43     inFile.read(&mi, sizeof(mi));\n44     inFile.read(reinterpret_cast<char\
  \ *>(&age), sizeof(age));\n45  \n46     // 首先获取 fname 的长度和数据\n47     int firstNameLength;\n\
  48     inFile.read(reinterpret_cast<char *>(&firstNameLength),\n49             \
  \    sizeof(int));\n50     // 将 fname 的数据读入缓冲区\n51     inFile.read(buffer, firstNameLength);\n\
  52     // 对缓冲区空终止\n53     buffer[firstNameLength] = '\\0';\n54     fname = buffer;\n\
  55     // 同样处理 lname 的长度和数据\n56     int lastNameLength;\n57     inFile.read(reinterpret_cast<char\
  \ *>(&lastNameLength),\n58                 sizeof(int));\n59     // 将 lname 的数据读入缓冲区\n\
  60     inFile.read(buffer, lastNameLength);\n61     // 对缓冲区空终止\n62     buffer[lastNameLength]\
  \ = '\\0';\n63     lname = buffer;\n64 }\n```\n\n我们需要两个程序来演示 `Person` 类的能力。13-5\
  \ 序列化这些对象并将其写入文件。13-20 反序列化文件中的对象并在屏幕上显示它们。\n\n## 复习题与练习题\n\n## 选题与简答\n\n1. 所有文件都分配一个供操作系统和用户识别的\
