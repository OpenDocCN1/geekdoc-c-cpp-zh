  11. 13.11 显示如何使用 `fstream` 类的构造函数打开一个用于输入的文件，而无需调用 `open` 函数。\n12. 13.12 考虑两个大小相同的并行数组，一个包含字符串，第二个包含整数。编写\
  \ C++ 语句，将两个数组中的信息以名称和数字表格的形式输出。表格的第一列将包含在 20 个字符字段内左对齐的名称，第二列将包含在 10 个字符字段内右对齐的整数。这里数组大小为\
  \ 2 时的数据示例。\n\n```\nconst int SIZE = 2;\nstring names[SIZE] = {\"Catherine\", \"\
  Bill\"};\nint numbers[SIZE] = {12, 2005};\n```\n\n# 13.2 更详细的错误测试\n\n## 概念 (Concept)\n\
  \n所有流对象都有错误状态位，用于指示流的状态。\n\n所有流对象包含一组作为标志的位。这些标志指示流当前的状态。表 13-3 列出了这些位。\n\n# 表 13-3\
  \ 文件状态位标志\n\n| 位 | 描述 |\n| --- | --- |\n| `ios::eofbit` | 当遇到输入流末尾时设置。 |\n| `ios::failbit`\
  \ | 当尝试的操作失败时设置。 |\n| `ios::hardfail` | 当发生不可恢复的错误时设置。 |\n| `ios::badbit` | 当尝试无效操作时设置。\
  \ |\n| `ios::goodbit` | 当上述所有标志均未设置时设置。表示流处于良好状态。 |\n\n可以通过表 13-4 列出的成员函数对这些位进行测试。表列出的函数之一\
  \ `clear()` 可用于设置状态位。\n\n# 表 13-4 报告位标志的成员函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `eof()`\
  \ | 如果 `eofbit` 标志被设置，返回 true（非零）；否则返回 false。 |\n| `fail()` | 如果 `failbit` 或 `hardfail`\
  \ 标志被设置，返回 true（非零）；否则返回 false。 |\n| `bad()` | 如果 `badbit` 标志被设置，返回 true（非零）；否则返回\
  \ false。 |\n| `good()` | 如果 `goodbit` 标志被设置，返回 true（非零）；否则返回 false。 |\n| `clear()`\
  \ | 不带参数调用时，清除上述列的所有标志。可以带参数调用。 |\n\n```\nvoid showState(fstream &file)\n{\n   cout\
  \ << \"File Status:\\n\";\n   cout << \"eof bit: \" << file.eof() << endl;\n   cout\
  \ << \"fail bit: \" << file.fail() << endl;\n   cout << \"bad bit: \" << file.bad()\
  \ << endl;\n   cout << \"good bit: \" << file.good() << endl;\n   file.clear();\
  \ // 清除任何位\n}\n```\n\n上述函数 `showState` 显示了在各种操作后 `dataFile` 的状态。首先，创建文件并将整数 10 存储其中。然后关闭文件并重新打开以进行输入。从文件中读取该整数，然后执行\
  \ 第二次读取操作。由于文件中只有一个项目，第二次读取将导致错误。\n\n出于错误测试之目的，流对象的行为类似于一个布尔表达式，在没有设置错误标志时为 `true`，否则为\
  \ `false`。要检查对 `dataFile` 执行的最后操作是否成功，你可以写：\n\n```\nif (dataFile) {\n   cout <<\
  \ \"Success!\";\n}\n```\n\n要检查操作是否由于某些错误而失败，你可以调用 `fail()` 成员函数，或者：\n\n```\nif (!dataFile)\
  \ {\n   cout << \"Failure!\";\n}\n```\n\n# 13.3 用于读取和写入的成员函数\n\n## 概念 (Concept)\n\
  \n文件流对象具有用于更专门读取和写入的成员函数。\n\n如果空白字符是信息的一部分，当使用 `>>` 运算符读取文件时就会出现问题。由于运算符将空白字符视为分隔符，因此它不会读取它们。例如，考虑包含内容的文件\
  \ `murphy.txt`：\n\n* Jayne Murphy\n* 47 Jones Circle\n* Almond, NC 28702\n\n图 13-1\
  \ 显示了信息在文件中记录的方式。\n\n# `getline` 函数\n\n解决程序 13-5 中问题的一种方法是使用读取整行文本的函数。string 库中有一个全局函数可以用于此目的：\n\
  \n```\nistream& getline (istream& is, string& str, char delim = '\\n');\n```\n\n\
  该函数从流 `is` 中读取一行文本并将其存储在字符串变量 `str` 中。该函数有一个可选参数 `delim`，标记要读取的行的结束标记。分隔符会从流中移除并丢弃。如果调用\
  \ `getline` 时没有第三个参数，则假设分隔符是换行符 `'\\n'`。\n\n\n\n\n第一个参数 `is` 必须是 `istream` 类的对象。它也可以是\
  \ `istringstream`、`ifstream` 或 `fstream` 类的任何对象（如果传递了 `fstream` 对象，则它必须已经以输入模式打开）。返回的值是刚刚读取的输入流的引用。这允许对返回值进行测试，以确定调用的成功或失败，如下代码片段所示：\n\
  \n```\nstring str;\nif (getline(inputstream, str))\n{\n   // 读取了一行并存储在 str 中\n \
  \  cout << str << endl;\n}\nelse\n{\n   // 发生了错误或到达了文件末尾\n}\n```\n\n或者，你可以忽略返回值，并在调用后的语句中对流进行测试：\n\
  \n```cpp\nstring str;\ngetline(inputstream, str);\nif (inputstream)\n{\n    // 读取了一行并存储在\
  \ str 中\n    cout << str << endl;\n}\nelse\n{\n    // 发生了错误或到达了文件末尾\n}\n```\n\n\
  程序 13-6 是 程序 13-5 的修改版本，它使用 `getline` 函数逐行读取文件，从而保留单词之间的空格。\n\n由于在 程序 13-6 中省略了\
  \ `getline` 函数的第三个参数，它的默认值为 `\\n`。有时你可能想指定另一个分隔符。例如，考虑一个包含多个姓名和地址的文件，其内部格式如下所示：\n\
  \n### `addresses.txt` 的内容\n\n```\nJayne Murphy$47 Jones Circle$Almond, NC 28702\\\
  n$Bobbie Smith$\n217 Halifax Drive$Canton, NC 28716\\n$Bill Hammet$PO Box 121$\n\
  Springfield, NC 28357\\n$\n```\n\n将此文件视为由三条记录组成。记录是关于单个条目的完整信息集。此外，文件中的记录由三个字段组成。第一个字段是人的姓名。第二个字段是人的街道地址或邮箱号。第三个字段包含人的城市、州和邮政编码。注意每个字段都以\
  \ `$` 字符结束，每条记录都以 `\\n` 字符结束。程序 13-7 演示了如何使用 `getline` 函数来检测 `$` 字符。\n\n注意，标记每条记录结束的\
  \ `\\n` 字符也是输出的一部分。它们会导致屏幕上打印出额外的空行，从而分隔不同的记录。\n\n### 注意\n\n在使用如 `$` 等可打印字符来分隔文件中的信息时，请务必选择一个不会实际出现在信息本身的字符。由于任何人的姓名或地址都不可能包含\
  \ `$` 字符，因此这是一个可以接受的分隔符。然而，如果文件中包含金额，则会选择另一个分隔符。\n\n### `get` 系列成员函数\n\n每个输入类 `ifstream`、`fstream`\
  \ 和 `istringstream` 都有一系列 `get` 成员函数，可以用于读取单个字符：\n\n```cpp\nint get();\nistream&\
  \ get(char& c);\n```\n\n第一个版本读取单个字符。如果成功，它会返回一个表示所读字符的整数代码。如果失败，它会设置流上的错误代码并返回特殊值\
  \ `EOF`。程序 13-8 使用 `get` 函数将文件复制到屏幕。第 27-32 行的循环在 `get()` 返回 `EOF` 时终止。\n\n程序 13-8\
  \ 将显示任何文件的内容。因为 `get` 函数不会跳过空格，所有字符将按照它们出现的方式精确显示。`get` 的第二个版本接受一个用于读取的字符引用并返回流。如果失败，它会设置流上的错误代码并返回特殊值\
  \ `EOF`。\n\n\n\n\n输入流类的成员函数（文件“寻址”到文件中的某个位置；“`g` 代表“get”（获取），表示该函数作用于输入流，因为我们从输入流中“获取”数据）。文件中要寻址到的新位置由两个参数给出：新位置位于距离由\
  \ `place` 确定的起始点 `offset` 字节的偏移处。`offset` 参数是一个 `long` 型整数，而 `place` 可以是 `ios` 类中定义的三个值之一。起始位置可以是文件的开头、文件中的当前位置，也可以是文件的末尾。这些位置分别由常量\
  \ `ios::beg`、`ios::cur` 和 `ios::end` 指示。\n\n关于在文件中移动的更多信息将在稍后的章节节中给出。在这里，我们感兴趣的是移动到文件的开头。要移动到文件开头，请使用\n\
  \n```cpp\nseekg(0L, ios::beg);\n```\n\n以相对于文件开头移动 `0` 个字节。\n\n## Note\n\n如果你已经处于文件末尾，则在调用此函数*之前*必须清除文件末尾标志。因此，为了将刚刚读取到末尾的文件流\
  \ `dataIn` 移动到开头，你需要以下两个语句\n\n```cpp\ndataIn.clear();\ndataIn.seekg(0L, ios::beg);\n\
  ```\n\nProgram 13-10 展示了如何回溯文件。它创建一个文件，向其中写入一些文本并关闭文件。然后打开文件进行输入，读取到末尾，回溯，然后再次读取。\n\
