  \ | 头文件：`cmath` 描述：接受一个以弧度表示的角度参数。返回该角度的余弦。示例：```a = cos(m);``` ` |\n| `exit(status)`\
  \ | 头文件：`cstdlib` 描述：接受一个 `int` 参数。终止程序并将值传递给操作系统。示例：```exit(0);``` ` |\n| `exp(m)`\
  \ | 头文件：`cmath` 描述：接受一个 `double` 参数。计算参数的指数函数 $e^x$。返回值为 `double`。示例：```a = exp(m);```\
