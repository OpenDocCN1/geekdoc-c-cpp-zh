  **示例：**\n\n```cpp\na = abs(m);\n```\n\n### `cos(m)`\n**头文件：** `cmath`\n**描述：** 接受一个\
  \ `double` 参数。返回参数的余弦值。参数应为以弧度表示的角度。返回类型为 `double`。\n**示例：**\n\n```cpp\na = cos(m);\n\
  ```\n\n### `exp(m)`\n**头文件：** `cmath`\n**描述：** 接受一个 `double` 参数。计算参数的指数函数，即 e^x。返回类型为\
  \ `double`。\n**示例：**\n\n```cpp\na = exp(m);\n```\n\n### `fmod(m, n)`\n**头文件：** `cmath`\n\
  **描述：** 接受两个 `double` 参数。以 `double` 类型返回第一个参数除以第二个参数的余数。其工作类似于模运算符，但参数是浮点数。（模运算符仅适用于整数）。注意不要将\
  \ 0 作为第二个参数，这样做会导致除零。\n**示例：**\n\n```cpp\na = fmod(m, n);\n```\n\n\n\n\n\n| `log10(m)`\
  \ | **头文件:** `cmath` **描述:** 接受一个 `double` 类型参数。以 `double` 类型返回参数以 10 为底的对数。**示例:**\
  \ \n\n```\na = log10(m);\n``` |\n\n| `pow(m, n)` | **头文件:** `cmath` **描述:** 接受两个\
  \ `double` 类型参数。返回参数 1 快速参数 2 次方的值。**示例:** \n\n```\na = pow(m, n);\n``` |\n\n| `sin(m)`\
  \ | **头文件:** `cmath` **描述:** 接受一个 `double` 类型参数。以 `double` 类型返回参数的正弦值。该参数应为以弧度为表示的角度。**示例:**\
  \ \n\n```\na = sin(m);\n``` |\n\n| `sqrt(m)` | **头文件:** `cmath` **描述:** 接受一个 `double`\
  \ 类型参数。以 `double` 类型返回参数的平方根。**示例:** \n\n```\na = sqrt(m);\n``` |\n\n| `tan(m)`\
  \ | **头文件:** `cmath` **描述:** 接受一个 `double` 类型参数。以 `double` 类型返回参数的正切值。该参数应为以弧度为表示的角度。**示例:**\
  \ \n\n```\na = tan(m);\n``` |\n\n# 表 I-4 选定的 `cstring` 函数\n\n| 函数 | 详情 |\n| ---\
  \ | --- |\n| `strcat(str1, str2)` | **头文件:** `cstring` **描述:** 接受两个 C 字符串作为参数。该函数将第二个字符串的内容附加到第一个字符串的末尾。（第一个字符串会被修改；第二个字符串保持不变。）**示例:**\
  \ \n\n```\nstrcat(string1, string2);\n``` |\n\n| `strcmp(str1, str2)` | **头文件:**\
  \ `cstring` **描述:** 接受指向两个字符串参数的指针。如果 `string1` 和 `string2` 相同，此函数返回 0。如果 `string2`\
  \ 在字母顺序上大于 `string1`，则返回正数。如果 `string2` 在字母顺序上小于 `string1`，则返回负数。**示例:** \n\n```\n\
  \ if (strcmp(string1, string2) == 0)\t\n    cout << \"The strings are equal.\\n\"\
  ;\n``` |\n\n| `strcpy(str1, str2)` | **头文件:** `cstring` **描述:** 接受两个 C 字符串作为参数。该函数将第二个字符串拷贝到第一个字符串。第二个字符串保持不变。**示例:**\
  \ \n\n```\nstrcpy(string1, string2);\n``` |\n\n| `strlen(str)` | **头文件:** `cstring`\
  \ **描述:** 接受一个 C 字符串作为参数。返回字符串的长度（不包括空终止符）。**示例:** \n\n```\nlen = strlen(name);\n\
  ``` |\n\n| `strncpy(str1, str2, n)` | **头文件:** `cstring` **描述:** 接受两个 C 字符串和一个整数参数。第三个参数（整数）指示了从第二个字符串拷贝到第一个字符串的字符数量。如果\
  \ `string2` 的字符数少于 `n` 个，则 `string1` 将用 ‘\\0’ 字符填充。**示例:** \n\n```\nstrncpy(string1,\
  \ string2, n);\n``` |\n\n| `strstr(str1, str2)` | **头文件:** `cstring` **描述:** 在 `string1`\
  \ 中搜索 `string2` 第一次出现的位置。如果找到了 `string2`，该函数返回指向它的指针。否则，返回一个 NULL 指针（地址 0）。**示例:**\
  \ \n\n```\ncout << strstr(string1, string2);\n``` |\n\n# 表 I-5 选定的 `cctype` 函数\n\
  \n| 函数 | 详情 |\n| --- | --- |\n| `isalnum(ch)` | **头文件:** `cctype` **描述:** 接受一个 `char`\
  \ 类型参数。如果参数是字母或数字，则返回真。否则，返回假。**示例:** \n\n```\nif (isalnum(ch))\n    cout << ch\
  \ << \" is alphanumeric.\\n\";\n``` |\n\n| `isalpha(ch)` | **头文件:** `cctype` **描述:**\
  \ 接受一个 `char` 类型参数。如果参数是字母，则返回真。否则，返回假。**示例:** \n\n```\n if (isalpha(ch))\n    cout\
  \ << ch << \" is a letter.\\n\";\n``` |\n\n| `isdigit(ch)` | **头文件:** `cctype` **描述:**\
  \ 接受一个 `char` 类型参数。如果参数是数字 0 - 9，则返回真。否则，返回假。**示例:** \n\n```\n if (isdigit(ch))\n\
  \    cout << ch << \" is a digit.\\n\";\n``` |\n\n| `islower(ch)` | **头文件:** `cctype`\
  \ **描述:** 接受一个 `char` 类型参数。如果参数是小写字母，则返回真。否则，返回假。**示例:** \n\n```\n if (islower(ch))\n\
  \    cout << ch << \" is lowercase.\\n\";\n``` |\n\n| `isprint(ch)` | **头文件:** `cctype`\
  \ **描述:** 接受一个 `char` 类型参数。如果参数是可打印字符，则返回真。否则，返回假。**示例:** \n\n```\n if (islower(ch))\n\
  \    cout << ch << \" is lowercase.\\n\";\n``` |\n\n| `ispunct(ch)` | **头文件:** `cctype`\
  \ **描述:** 接受一个 `char` 类型参数。如果参数不是字母、数字或空格的打印字符，则返回真。否则，返回假。**示例:** \n\n```\n if\
  \ (islower(ch))\n    cout << ch << \" is lowercase.\\n\";\n``` |\n\n| `isspace(ch)`\
  \ | **头文件:** `cctype` **描述:** 接受一个 `char` 类型参数。如果参数是空白字符，则返回真。否则，返回假。空白字符包括：\n\n\
  *   空格\n*   换行\n*   制表符\n*   垂直制表符\n\n否则，返回假。**示例:** \n\n```\n if (isspace(ch))\n\
  \    cout << ch << \" is whitespace.\\n\";\n``` |\n\n| `isupper(ch)` | **头文件:**\
  \ `cctype` **描述:** 接受一个 `char` 类型参数。如果参数是大写字母，则返回真。否则，返回假。**示例:** \n\n```\n if (isupper(ch))\n\
  \    cout << ch << \" is uppercase.\\n\";\n``` |\n\n| `tolower(ch)` | **头文件:** `cctype`\
  \ **描述:** 接受一个 `char` 类型参数。返回参数的小写形式。**示例:** \n\n```\nch = tolower(ch);\n``` |\n\
  \n| `toupper(ch)` | **头文件:** `cctype` **描述:** 接受一个 `char` 类型参数。返回参数的大写形式。**示例:**\
  \ \n\n```\nch = toupper(ch);\n``` |\n\n# 附录 J 命名空间\n\n## 引言\n\n*命名空间*是 ANSI C++\
  \ 的功能，允许为标识符创建范围。当多个全局声明使用相同名称时非常有用。\n\n例如，假设你是某公司财务部门的程序员。你的公司从软件供应商处购买了两个类库。一个库用于处理客户账户，包含一个名为\
  \ `payable` 的类对象；另一个库用于处理公司工资，也有一个名为 `payable` 的类对象。你正在编写一个集成这两个类的程序，但编译器由于两个类对象的名称相同产生了错误。\n\
  \n当软件供应商将每组类放在它们自己的命名空间时，这个问题就可以解决了。每个命名空间都有自己的名称，必须使用该名称来限定成员。例如，客户账户库中的 `payable`\
  \ 对象可能存在于命名为 `customer` 的命名空间中，而工资库中的对象可能存在于命名为 `payroll` 的命名空间中。当你（应用程序程序员）处理这些对象时，必须指定对象所属的命名空间。\n\
  \n实现这一点的一种方法是使用作用解析符扩展对象的名称。例如，属于 `customer` 命名空间的 `payable` 对象被指定为 `customer::payable`，而属于\
  \ `payroll` 命名空间的对象被指定为 `payroll::payable`。\n\n\n\n同样，以下语句指示编译器源文件使用了 `payroll`\
  \ 命名空间的成员：\n\n```\n using namespace payroll;\n```\n\n当在源文件中放置了 `using` `namespace`\
  \ 语句后，在该源文件中的语句就不再需要使用命名空间名称和作用域解析符来限定命名空间成员的名称。\n\n# 定义命名空间\n\n命名空间按照以下方式定义：\n\n\
  ```\nnamespace 命名空间名称\n{\n   声明…\n}\n```\n\n\n\n例如，查看程序 J-1。它定义了 `test` 命名空间，该空间包含三个成员：`x`、`y`\
  \ 和 `z`。\n\n在程序 J-1 中，变量 `x`、`y` 和 `z` 定义在 `test` 命名空间的作用域内。程序每次访问这些变量之一时，必须在变量名前之前置上\
  \ `test::`。否则，将发生编译器错误。\n\n程序 J-2 演示了程序员如何使用命名空间来解决命名冲突。该程序定义了两个命名空间，`test1` 和 `test2`。这两个命名空间都拥有名为\
  \ `x`、`y` 和 `z` 的变量作为成员。\n\n限定命名空间成员名称的另一种方法是使用 `using` `namespace` 语句。该语句告诉编译器，当在当前作用范围内找不到标识符时，应该在哪个命名空间中查找。程序\
  \ J-3 演示了该语句。\n\n`using namespace demo;` 语句消除了在 `testObject` 前置上 `demo::` 的需要。编译器自动使用\
  \ `demo` 命名空间来查找标识符。\n\n# ANSI C++ 与 `std` 命名空间\n\nANSI 标准头文件中所有的标识符都是 `std` 命名空间的一部分。在\
  \ ANSI C++ 中，`cin` 和 `cout` 写为 `std::cin` 和 `std::cout`。如果你不希望为 `cin` 或 `cout`（或任何\
  \ ANSI 标准标识符）指定 `std::`，你必须在程序中编写以下语句：\n\n```\n using namespace std;\n```\n\n# 附录\
  \ K C++ 强制转换与运行时类型识别\n\n## 引言\n\n在许多情况下，程序员需要使用类型转换来告诉编译器将表达式的类型转换为另一种类型。例如，假设你有一个整数变量\
  \ `sum` 存储 `n` 个整数值的和，你想计算平均值并存储在类型为 `float` 的变量 `average` 中。在这种情况下，你必须通过类型转换告诉编译器在执行除法之前先将\
  \ `sum` 转换为 `double`：\n\n```\ndouble average;\naverage = (double)sum / n;\n```\n\
  \n这种类型的转换被称为 C 风格强制转换。或者，你可以使用新的 C++ 函数式风格强制转换：\n\n```\ndouble average;\naverage\
  \ = double(sum) / n;\n```\n\n函数式强制转换适用于 `char`、`float`、`int` 和 `double` 等基本内置类型，也适用于提供转换构造函数的用户定义类类型。在大多数情况下，函数式转换的效果与\
  \ C 风格转换相同。\n\n另一个转换的示例频繁出现在从 I/O 设备（如网络连接或磁盘）读取数据，数据以字节流的形式到达。在这种情况下，为了将数据存储某种类型的数据项中，例如如下结构：\n\
  \n```\nstruct PersonData\n{\n   char name[20];\n   int age;\n};\nPersonData data;\n\
  ```\n\n`data` 的地址必须被处理为存储字节序列的位置的地址。换句话说，指向 `data` 的指针必须被处理为指向字节的指针。\n\n由于 C++ 将字节处理就像字符一样，这意味着指向类型\
  \ `PersonData` 的指针必须被看作指向 `char` 的指针。同样，这是通过使用类型转换实现的：\n\n```\n char *pChar = (char\
  \ *)&data;\n```\n\n该语句获取结构体 `data` 的指针，使用类型转换将其处理为指向 `char` 的指针，并使用结果的值初始化新创建的指针变量\
  \ `pChar`。\n\n显然，这两个转换示例是不同的，不仅在目的上不同，而且在编译器的实现方式也不同。在将 `int` 转换为 `double` 时，编译器必须更改内部位。在转换\
  \ `int` 到 `double` 时，编译器必须更改内部位，而在第二个示例中，编译器已经知道了如何进行转换。语言引入了四种不同的转换方式：\n\n1. `static_cast`\n\
  2. `reinterpret_cast`\n3. `const_cast`\n4. `dynamic_cast`\n\n在本附录中，我们将讨论这些转换，并简要触及\
  \ `typeid` 运算符。\n\n# `static_cast`\n\n最常用的类型转换是 `static_cast`。例如，为了将表达式转换为指定的类型，你会编写：\n\
  \n```\nstatic_cast<类型 >(表达式)\n```\n\n程序员通过类型转换运算符向编译器提供了如何进行转换的信息。例如，考虑以下 `FeetInches`\
  \ 类：\n\n```\nclass FeetInches\n{\n   private:\n    int feet;\n    int inches;\n\
  \   public:\n    FeetInches(int f, int i)\n    {\n       feet = f;\n       inches\
  \ = i;\n    }\n    // 类型转换运算符\n    operator double()\n    {\n      return feet +\
  \ inches/12.0;\n    }\n};\n```\n\n该类为编译器提供了将 `FeetInches` 对象转换为 `double` 的信息。结果，下面的\
  \ `main` 函数将正确编译并在执行时打印 3.5 和 3。\n\n```cpp\n#include <iostream>\n#include \"FeetInchesEx.h\"\
  \nusing namespace std;\n\nint main()\n{\n   FeetInches ftObject(3, 6);\n   // 使用\
  \ static_cast 转换为 double\n   double ft = static_cast< double >(ftObject);\n   cout\
  \ << ft;\n   // 使用 static_cast 转换为 int\n   cout << endl << static_cast< int >(ftObject);\n\
  \   return 0;\n}\n```\n\n在这里我们假设类声明存储在指示头文件中。由于类型转换运算符，`double` 的静态转换成功，而 `int`\
  \ 的转换成功是因为编译器已经知道如何将 `double` 转换为 `int`。\n\n然而，使用之前的 `FeetInches` 声明，下面的 `main`\
  \ 函数将无法编译。\n\n```cpp\nint main()\n{\n   FeetInches ftObject(3, 6);\n   // 非法使用 static_cast\n\
  \   char *pInt = static_cast< int * >(&ftObject);\n   cout << *pInt;\n   return\
  \ 0;\n}\n```\n\n这是因为编译器没有获得关于如何将指向 `FeetInches` 对象的指针转换为指向 `int` 指针的信息。\n\n\n\n\
  最后，`static_cast` 可以用于将基类指针转换为派生类指针。我们将在本附录的最后一节中看到这一示例。\n\n# `reinterpret_cast`\n\
  \n当编译器不知道以何种进行类型转换时，`reinterpret_cast` 用于强制编译器将一个值视为另一种类型。`reinterpret_cast` 主要用于指针，即当一个指向某种类型的指针需要被视为指向另一种类型的指针时，它就派上了用场。换句话说，`reinterpret_cast`\
  \ 对于介绍言部分中讨论的第二种类型转换非常有用。其位表示不会发生任何变化。被转换的值仅按原样使用。\n\n`reinterpret_cast` 的写法与 `static_cast`\
  \ 相似。为了强制将表达式 `expr1` 视为类型 `type1` 的值，我们可以写成：\n\n```\n type1 var1 = reinterpret_cast<\
  \ type1 >(expr1);\n```\n\n而不是旧的 C 风格强制转换。例如，如果由于某种原因，我们需要将一个 `FeetInches` 对象视为一对整数，我们可以设置一个\
  \ `int` 指针指向该对象，然后通过对指针解引用来访问对象的整数部分。`reinterpret_cast` 将用于强制更改指针的类型。下面的 `main`\
  \ 程序将在一行打印 3，在下一行打印 6。\n\n```\nint main()\n{\n   FeetInches ftObject(3, 6);\n  \
  \ // 指向对象起始\n   int *p = reinterpret_cast< int * >(&ftObject);\n   cout << *p <<\
  \ endl;\n   // 指针移动一个 int 大小\n   p++;\n   cout << *p;\n   return 0;\n}\n```\n\n\
  如果编译器已经有足够的信息知道如何执行类型转换，它将拒绝使用 `reinterpret_cast`。特别是，以下语句将产生编译错误：\n\n```\ncout\
  \ << reinterpret_cast< int >(ftObject);\n```\n\n设计良好的且不直接与硬件交互的程序很少需要这种类型转换。事实上，需要使用\
  \ `reinterpret_cast` 很有可能是设计错误的指示。\n\n# `const_cast`\n\n这种类型转换仅用于**指向常量的指针**，用于将指向常量的指针视为普通指针。指向常量的指针不能更改它所指向的内存位置。例如，我们可以如下所示定义一对整数变量和一个指向常量\
  \ `int` 的指针：\n\n```\nint k = 4;\nint m = 20;\nconst int *pToC;\n```\n\n我们然后可以让指针\
  \ `pToC` 指向不同的整数变量，如下：\n\n```\npToC = &k;\ncout << *pToC; // 输出 4\npToC = &m;\n\
  cout << *pToC; // 输出 20\n```\n\n但我们不能使用 `pToC` 来更改 `pToC` 指向的任何变量。例如，以下代码\n\n```\n\
  *pToC = 23;\n```\n\n是非法的。此外，你不能将指向常量的指针的值赋值给另一个本身不是指向常量的指针，因为这时该常量可能会通过第二个指针被修改：\n\
  \n```\nint *p1;        // 不是指向常量的指针\np1 = pToC;      // 错误！！\n```\n\n出于相同的原因，只有当相应的形式参数是指向常量的指针时，才能将指向常量的指针传递给函数。因此，对于函数定义：\n\
  \n```\nvoid print(int *p)\n{\n   cout << *p;\n}\n```\n\n调用\n\n```\nprint(pToC);\n\
  ```\n\n将是非法的。然而，如果将函数修改为接收一个指向常量的指针作为参数，那么这种调用就是正确的。因此，在存在\n\n```\nvoid constPrint(const\
  \ int *p)\n{\n   cout << *p;\n}\n```\n\n的情况下，调用\n\n```\nconstPrint(pToC);\n```\n\
  \n将被允许。\n\n这些示例特意保持了简单。在实际程序中，类成员函数返回指向常量的指针可能指向类中某个需要保护免受修改的成员。然而，如果这个指针需要传递给一个不幸没有编写为接收指向常量的指针的函数——例如上面所示的\
  \ `print`——可以通过 `const_cast` “丢弃”指针的“常量属性”来说服编译器接受该调用，如下所示。\n\n```\n print( const_cast<\
  \ int * >(pToC) );\n```\n\n自然，`const_cast` 也可以允许将指向常量的指针赋值给普通指针：\n\n```\n int *p\
  \ = const_cast< int * >(pToC);\n```\n\n与 `reinterpret_cast` 的情况一样，我们注意到在大多数设计良好的程序中不应使用\
  \ `const_cast`。\n\n# `dynamic_cast`\n\n多态代码是指能够在同一继承层次结构内通过不同类的对象调用的代码。由于不同类的对象具有不同的存储需求，多态代码并不直接使用对象。相反，它通过引用或指针来访问它们。在本附录中，我们将主要处理通过指针访问多态对象：通过引用的访问是类似的。\n\
  \n多态代码通过将不同类的对象视为同一个基类来处理它们。然而，有时需要在运行时确定对象的具体类，以便调用其方法。多态对象内部携带类型信息以使这种识别可能。在 C++\
  \ 中，多态类是指至少有一个虚函数的类。`dynamic_cast` 用于指向多态对象的指针（或引用）。如果对象不能被视为目标类，`dynamic_cast`\
  \ 返回特殊的指针值 `0`。\n\n`dynamic_cast` 的典型用法如下。假设 `pExpr` 是指向某个派生类对象的指针，且 `DerivedClass`\
  \ 是派自 `PolyClass` 的类，我们可以通过以下代码判断 `pExpr` 所指向的对象是否为 `DerivedClass`：\n\n```\nDerivedClass\
  \ *dP = dynamic_cast<DerivedClass *>(pExpr);\nif (dP)\n{\n    // *dP 属于 DerivedClass\n\
  \    …\n }\nelse {\n   // *dp 不属于 DerivedClass\n   …\n }\n```\n\n这里 `DerivedClass`\
  \ 是我们所说的目标类。\n\n作为一个例子，考虑一个既有牛产牛奶又有狗看守的农场。所有动物都吃东西（有一个 `eat` 函数），牛产奶（有一个 `giveMilk`\
  \ 函数），狗守卫（有一个 `guardHouse` 函数）。我们可以通过使用以下类层次结构来描述所有这些：\n\n```\n#include <iostream>\n\
  using namespace std;\n\nclass DomesticAnimal\n{\n   public:\n     virtual void eat()\n\
  \      {\n        cout << \"动物在吃东西：吧嚼。\" << endl;\n      }\n};\nclass Cow:public\
  \ DomesticAnimal\n{\n  public:\n    void giveMilk()\n    {\n      cout << \"牛在产奶。\"\
  \ << endl;\n    }\n};\nclass Dog:public DomesticAnimal\n{\n   public:\n     void\
  \ guardHouse()\n     {\n       cout << \"狗在守家。\" << endl;\n     }\n};\n```\n\n注意，`eat`\
  \ 成员函数已声明为虚成员函数，以便所有类都成为多态。\n\n许多应用程序处理集合，通常是属于同一继承层次的对象的数组。例如，我们的农场可能有两只牛和两只狗，它们可以这样存储在数组中：\n\
  \n```\nDomesticAnimal *a[4] = {new Dog, new Cow,\n                        new Dog,\
  \ new Cow\n                        };\n```\n\n我们必须使用指针数组，因为 `DomesticAnimal` 数组无法存放\
  \ `Dog` 或 `Cow` 对象，这些对象通常比比 `DomesticAnimal` 需要更多的存储空间。现在，假设我们要遍历整个动物数组并挤出所有的牛。我们不能仅仅用如下循环遍历数组：\n\
  \n\n\n\n\n```cpp\nfor (int k = 0; k < 4; k++)\n  a[k]->giveMilk();\n```\n\n因为每当\
  \ `a[k]` 指向 `Dog` 时，这会导致运行时错误。然而，`dynamic_cast` 会获取像 `a[k]` 这样的指针，查看所指向对象的实际类型，如果该类型与\
  \ `dynamic_cast` 的目标类型匹配，则返回对象的地址。如果对象不匹配转换后的目标类型，则返回 `0` 而不是地址。\n\n如所述，将表达式 `expr1`\
  \ 转换为目标类型 `TargetType` 的通用格式为：\n\n```\ndynamic_cast< TargetType >(expr1);\n```\n\
  \n其中 `TargetType` 必须是一个指针或引用类型。在我们情况下，为了判断 `a[k]` 指向的家畜是否为牛，我们会写道：\n\n```cpp\n Cow\
  \ *pC = dynamic_cast< Cow * >(a[k]);\n```\n\n然后测试 `pC` 以检查它是否为 `0`。如果是 `0`，我们就知道该动物不是牛，尝试挤奶是徒劳的；否则，我们可以通过调用以下代码来挤奶：\n\
  \n```cpp\na[k]->giveMilk();\n```\n\n这是一个整合了所有上述内容的 `main` 函数。\n\n```cpp\nint main()\n\
  {\n   DomesticAnimal *a[4] = {new Dog, new Cow,\n\t                    new Dog,\
  \ new Cow,\n                          };\n   for (int k = 0; k < 4; k++)\n   {\n\
  \     Cow *pC = dynamic_cast<Cow *>(a[k]);\n     if (pC)\n       {\n         //\
  \ pC 不是 0，所以我们找到了一头牛\n\t pC->giveMilk();\n       }\n     else\n      {\n       \
  \ cout << \"This animal is not a cow.\" << endl;\n      }\n   }\n   return 0;\n\
  }\n```\n\n执行时，输出将是：\n\n```\nThis animal is not a cow.\nCow giving milk.\nThis animal\
  \ is not a cow.\nCow giving milk.\n```\n\n`dynamic_cast` 之所以如此，是因为多态类对象的类型不能总是静态确定的，即在不运行程序的情况下在编译时确定。例如，在语句\n\
  \n```cpp\na[k]->giveMilk();\n```\n\n中，在编译时无法确定 `a[k]` 指向 `Dog` 还是 `Cow`，因为它可以指向任一类型的对象。相比之下，`static_cast`\
  \ 使用编译时可用的信息。\n\n# 运行时类型识别 (RTTI)\n\n正如我们所见，`dynamic_cast` 可用于运行时识别继承层次结构中多态对象的类类型。更通用地说，`typeid`\
  \ 运算符可以在运行时识别任何表达式的类型。它可以同时应用于数据表达式和类型表达式：\n\n```\ntypeid(data_expression)\n```\n\
  \n或者\n\n```\ntypeid(type_expression)\n```\n\n例如，假设我们有如下定义：\n\n```cpp\nint i;\nCow\
  \ c;\nCow *pC;\n```\n\n那么我们可以将 `typeid` 运算符应用于数据项 `i+12`、`c` 和 `pC`，得到：\n\n```\n\
  typeid(i+12)\ntypeid(c)\ntypeid(pC)\n```\n\n这等同于对相应的类型表达式应用 `typeid` 得到的结果：\n\n\
  ```\ntypeid(int)\ntypeid(Cow)\ntypeid(Cow *)\n```\n\n在上一节的程序中，评估表达式\n\n```\ntypeid(a[k])\
  \ == typeid(DomesticAnimal)\n```\n\n始终得到值 `true`。要找出 `a[k]` 指向的动物是否为牛，我们需要测试表达式\n\
  \n```\ntypeid(*a[k]) == typeid(Cow)\n```\n\n查看它是否为 `true`。如果是 `true`，我们就可以使用 `static_cast`\
  \ 将 `a[k]` 转换为相应的类型以便挤奶：\n\n```cpp\nstatic_cast<Cow *>(a[k])->giveMilk();\n```\n\
  \n这种转换是必要的，因为如果没有它，语句\n\n```cpp\na[k]->giveMilk();\n```\n\n将无法编译。这是因为 `a[k]` 的类型是指向\
  \ `DomesticAnimal` 的指针，而家畜没有 `giveMilk()` 成员函数。\n\n# 附录 L 命令行参数\n\n如果你在 UNIX、Linux\
  \ 或 DOS 提示符等命令行环境中工作，编写从命令行接收参数的程序可能会有所帮助。例如，假设我们有一个名为 `sum` 的程序，它接受两个数字作为命令行参数并显示它们的和。我们可以在操作系统提示符处输入以下命令：\n\
  \n```\nsum 12 16\n```\n\n用空格分隔的参数是 `12` 和 `16`。由于 C++ 程序从 `main` 函数开始执行，因此命令行参数被传递给\
  \ `main`。`main` 函数可以选择性带有两个特殊参数，传统上命名为 `argc` 和 `argv`。`argc` 参数是一个 `int`，而 `argv`\
  \ 参数是一个 `char` 指针数组。这里是使用这两个参数的 `main` 函数示例头：\n\n```cpp\nint main(int argc, char\
  \ *argv[])\n```\n\n`argc` 参数包含命令行上输入的项数，包括 `argv`。`argv` 参数是 `char` 指针数组。（注：此处原文逻辑存在重复性描述，已按要求翻译保留）。\n\
  \n现在，让我们看看 `sum` 程序的代码。\n\n（该程序名为 `argdemo.cpp`。）\n\n# 附录 M 二进制数与位运算\n\nC++ 赋予程序员的许多能力之一是处理整数的单个位。本附录的目的是给出数据类型的概述。最后，我们将查看位域，它允许我们将单个位视为独立的实体。\n\
  \n# 整数形式\n\nC++ 提供的整数类型如下：\n\n```\nchar\nint\nlong\nunsigned char\nunsigned short\n\
  unsigned long\n```\n\n在给 C++ 赋值常量时，可以使用进制、八进制或十六进制。在第一位放置零创建八进制。例如，`0377` 被解释为八进制。十六进制通过在数字前加上\
  \ `0x` 或 `0X`（零-x）创建。数字 `04B` 被解释为十六进制。\n\n# 二进制表示\n\n无论如何表示常量，整数值都以相同的方式存储——二进制格式。让我们快速回顾一下二进制数的表示。\n\
  \n假设我们有一个字节字段。图 M-1 显示了该字段拆分为各个位。\n\n# 图 M-1\n\n（一个 1 字节字段拆分为 8 位的图）\n\n左侧位称为*高位*，右侧位称为*低位*。位\
  \ 7 是最高位，因此它被称为*最有效位*。\n\n这些位中的每一个位都分配了一个值。图 M-2 显示了每个位的值。\n\n# 图 M-2\n\n（显示每个位二进制值的\
  \ 128, 64, 32, 16, 8, 4, 2, 1 的图）\n\n\n\n\n这些值实际上是 2 的幂。位 0 的值为 $2⁰$，等于 1。位 1 的值为\
  \ $2¹$，等于 2。位 2 的值为 $2²$，等于 4。这种值的模式持续到最后一位。\n\n当一个数字存储在该字段中时，每个位可能被设置为 1 或 0。图\
  \ M-3 显示了一个示例。\n\n# 图 M-3\n\n![一张图表显示了 8 个矩形及其对应的值和“Bit（位）”标签。矩形从左到右显示的数字为 0, 1,\
  \ 1, 0, 0, 1, 1 和 0。](img/FG_AppM_003.png)\n\n在这里，位 1、2、5 和 6 被设置为 1。要计算此位模式的总体值，我们所有所有设置为\
  \ 1 的位值相加。\n\n| 位 1 的值 | 2 |\n| 位 2 的值 | 4 |\n| 位 5 的值 | 32 |\n| 位 6 的值 | 64 |\n\
  | | —– |\n| 总体值 | 102 |\n\n因此，位模式 `01100110` 的十进制值为 102。\n\n# 负整数值\n\n计算机存储负整数的一种方法是使用左侧的位作为符号位。当该位设置为\
  \ 1 时，它表示负数；当它被设置为 0 时，该数字为正数。然而，这样做的问题在于，对于数字 0，会有两种位模式。全 0 的模式表示正 0，而 1 后面跟全 0\
  \ 的模式表示负 0。正因如此，大多数系统使用补码表示来表示负整数。\n\n要计算一个数的补码，首先必须得到所谓的“反码”（one’s complement）。这意味着将每个\
  \ 1 改变为 0，将每个 0 改变为 1。接下来，在结果上加 1。这就得到了补码。以下是计算机存储值 -2 的方式。\n\n| 2 存储为 | `00000010`\
  \ |\n| 获取反码 | `11111101` |\n| 加 1 | `1` |\n| | ———— |\n| 补码结果为 | `11111110` |\n\n\
  注意，负数的最高位始终被设置为 1，而正数或零的最高位始终被设置为 0。\n\n# 位运算运算符\n\nC++ 提供了各种运算符，允许你对整数值的每个单独位执行逻辑操作，并将位向右或向左平移。\n\
  \n# 位取反运算符\n\n位取反运算符是 `~` 符号。它是一个一元运算符，对字段中的每个位执行取反操作或反码操作。表达式\n\n```\n~val\n```\n\
  \n返回 `val` 的反码。它不会改变 `val` 的内容。它可以按如下方式使用：\n\n```\nnegval = ~val;\n```\n\n这将 `val`\
  \ 的反码存储在 `negval` 中。\n\n# 位按与运算符\n\n位按与运算符是 `&` 符号。该运算符对两个操作数的每个位执行逻辑按与操作。这意味着它逐位比较两个操作数。对于每个位置，如果两个位都是\
  \ 1，则结果为 1。如果其中一个或两个位为 0，则结果为 0。这是一个示例：\n\n```\nandval = val & 0377;\n```\n\n按与操作的结果存储在\
  \ `andval` 中。该运算符还有一个组合赋值版本。这是一个示例：\n\n```\nval &= 0377;\n```\n\n这等同于：\n\n```\n\
  val = val & 0377;\n```\n\n# 位按或运算符\n\n位按或运算符是 `|` 符号。该运算符对两个操作数的每个位执行逻辑按或操作。这意味着它逐位比较两个操作数。对于每个位置，如果两个位中有一个为\
  \ 1，则结果为 1。否则，结果为 0。这是一个示例：\n\n```\norval = val | 0377;\n```\n\n按或操作的结果存储在 `orval`\
  \ 中。该运算符还有一个组合赋值版本。这是一个示例：\n\n```\nval |= 0377;\n```\n\n这等同于\n\n```\nval = val |\
  \ 0377;\n```\n\n# 位按异或运算符\n\n位按异或运算符是 `^` 符号。该运算符对两个操作数的每个位执行逻辑按异或操作。这意味着它逐位比较两个操作数。对于每个位置，如果两个位中有一个为\
  \ 1 但不同为 1，则结果为 1。否则，结果为 0。这是一个示例：\n\n```\nxorval = val ^ 0377;\n```\n\n按异或操作的结果存储在\
  \ `xorval` 中。该运算符还有一个组合赋值版本。\n\n```\nval ^= 0377;\n```\n\n这等同于：\n\n```\nval = val\
  \ ^ 0377;\n```\n\n# 使用掩码使用位运算符\n\n假设我们有以下声明：\n\n```\nchar value = 110, cloak = 2;\n\
  ```\n\n图 M-4 显示了这两个变量的每个二进制模式。\n\n# 图 M-4\n\n![这两个变量的每个二进制模式。](img/FG_AppM_004.png)\n\
  \n语句\n\n```\nvalue = value & cloak;\n```\n\n将对变量 `value` 和 `cloak` 执行逻辑位按与操作。图 M-5\
  \ 显示了一个示例。\n\n# 图 M-5\n\n![一张图表显示了 8 个矩形及其对应的值和“Bit（位）”标签。矩形从左到右显示的数字为 0, 1, 1,\
  \ 0, 0, 1, 1 和 0。](img/FG_AppM_003.png)\n\n在这里，位 1、2、5 和 6 被设置为 1。要计算此位模式的总体值，我们所有所有设置为\
  \ 1 的位值相加。\n\n| 位 1 的值 | 2 |\n| 位 2 的值 | 4 |\n| 位 5 的值 | 32 |\n| 位 6 的值 | 64 |\n\
  | | —– |\n| 总体值 | 102 |\n\n因此，位模式 `01100110` 的十进制值为 102。\n\n# 负整数值\n\n计算机存储负整数的一种方法是使用左侧的位作为符号位。当该位设置为\
  \ 1 时，它表示负数；当它被设置为 0 时，该数字为正数。然而，这样做的问题在于，对于数字 0，会有两种位模式。全 0 的模式表示正 0，而 1 后面跟全 0\
  \ 的模式表示负 0。正因如此，大多数系统使用补码表示来表示负整数。\n\n要计算一个数的补码，首先必须得到所谓的“反码”（one’s complement）。这意味着将每个\
  \ 1 改变为 0，将每个 0 改变为 1。接下来，在结果上加 1。这就得到了补码。以下是计算机存储值 -2 的方式。\n\n| 2 存储为 | `00000010`\
  \ |\n| 获取反码 | `11111101` |\n| 加 1 | `1` |\n| | ———— |\n| 补码结果为 | `11111110` |\n\n\
  注意，负数的最高位始终被设置为 1，而正数或零的最高位始终被设置为 0。\n\n# 位运算运算符\n\nC++ 提供了各种运算符，允许你对整数值的每个单独位执行逻辑操作，并将位向右或向左平移。\n\
