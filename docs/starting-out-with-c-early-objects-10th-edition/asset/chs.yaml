  \n# 56. 写下你对 `第 7 章` 中面向对象编程材料的某个问题。例如，你可以提到你想解释关于类是如何设计和创建的、对象如何与类相关联，或者重载构造函数是如何运作的。\n\
  \n## 编程挑战\n\n## 1. 日期\n\n设计一个名为 `Date` 的类，它具有整数成员来存储月份、日期和年份。该类应该有一个三参数的默认构造函数，允许在创建\
