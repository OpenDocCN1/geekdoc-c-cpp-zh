  \        << days[month] << \" days.\\n\";\n}\n```\n\n\n\n\n注意图 8-10，其中未初始化的元素都已设置为\
  \ 0。这是当数值数组被部分初始化时发生的情况。当一个 `string` 对象数组被部分初始化时，未初始化的元素将都包含空字符串，即长度为 0 的字符串。即使部分初始化的数组是局部定义的，情况也是如此。然而，如果局部数组是`完全`未初始化的，它的元素将包含“垃圾”值，就像其他局部变量一样。\n\
  \n程序 8-7 显示了 `numbers` 数组在部分初始化后的内容。\n\n数组初始化列表的值可以少于数组的元素个数，但不允许的值多于数组所能容纳的个数。以下语句是非法的，因为\
