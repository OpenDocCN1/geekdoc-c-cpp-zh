  \n# 警告！你必须将函数定义或函数原型放在所有函数调用之前。否则程序将无法编译。\n\n## 6.4 将数据发送到函数\n\n## 概念\n\n当调用一个函数时，程序可能会向函数发送值。\n\
  \n发送到函数中的值被称为 `arguments`（参数）。你已经熟悉如何在函数调用中使用参数。在下面的语句中，调用了 `pow` 函数，并向其传递了两个参数\
  \ `2.0` 和 `3.0`：\n\n```\nresult = pow(2.0, 3.0);\n```\n\n`pow` 函数使用传递给它的信息来计算第一个参数的第二个参数的幂值。在这种情况下，它将计算\
  \ `2.0` 的三次幂，并返回值 `8.0` 存储在 `result` 中。\n\n`parameter`（形参）是一个特殊的变量，用于保存作为参数传递到函数的值。通过使用参数，你可以设计这种这种方式接收数据的函数。\n\
  \n这是一个带有参数的函数定义。该参数是 `num`。\n\n```\n void displayValue(int num)\n{\n    cout <<\
