  \ number: \";\n    cin >> inputValue;\n    return inputValue;\n}\n```\n\n# 软技能 (Soft\
  \ Skills)\n\n程序员需要培养将一个大问题拆分为一组可管理的组件（或模块）的能力，每个组件专注于处理一个任务。如果这些任务很大，它们可以进一步划分为一组子任务。每个组件然后可以被编写为独立的函数。通常，将程序划分为模块并组织它们的方法不止一种。但通常情况下，如果模块\
