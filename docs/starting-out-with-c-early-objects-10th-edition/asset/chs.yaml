  \ 评估值 2 的税率，房产税为 2370.72。除了减免外，老年人被允许分四次缴纳房产税。该房屋的每季度还为 592.68。编写一个程序要求用户输入房屋的实际价值和税率。程序随后计算并报告年度房产税以及账单。\n\
  \n### 19. 数学老师\n\n编写一个可以作为学生数学老师的程序。程序应显示两个 1 到 9 之间的随机数进行相加，例如：\n\n$$\\begin{array}{r}\
  \ 2 \\\\ \\underline{+1} \\end{array}$$\n\n在学生输入答案并按下 `Enter` 键后，程序应显示正确答案，以便学生检查是否正确。\n\
  \n# 20. 利息收益\n\n假设原始投资外没有其他存款，储蓄账户一年后的余额可以计算为：\n\n$$\\text{Final~Balance} = Principal^{*}\\\
  left( {1 + \\frac{Rate}{T}} \\right)^{T}$$\n\n*   其中 `Principal` 是账户的初始余额\n*   `Rate`\
  \ 是年利率\n*   `T` 是每年内复利的次数（例如，如果按季度复利，`T` 为 4；如果按月复利，则为 12）。\n\n编写一个程序询问本金、年利率和复利次数。它应显示一份类似下面的报告：\n\
  \n```\nInterest Rate:              4.25%\nTimes Compounded:            12\nPrincipal:\
  \             $ 1000.00\nInterest:              $   43.33\nFinal balance:      \
  \   $ 1043.33\n```\n\n\n\n\n- `Rate` 是月利率，即年利率除以 12。（12% 的年利率对应 1% 的月利率。）\n- `N`\
  \ 是还款次数。\n- `L` 是贷款金额。\n\n编写一个程序，询问这些值并显示一份与下文所示内容相似的报告：\n\n```\nLoan Amount:  \
  \            $ 10000.00\nMonthly Interest Rate:            1%\nNumber of Payments:\
  \               36\nMonthly Payment:          $   332.14\nAmount Paid Back:    \
  \     $ 11957.15\nInterest Paid:            $  1957.15\n```\n\n# 22. 披萨切\n\nJoe's\
  \ 披萨店需要一个程序来计算任意尺寸的披萨可以切成多少片。该程序应执行以下步骤：\n\n1. 询问用户披萨的直径（英寸）。\n2. 将直径除以 2 得到半径。\n\
  3. 如果每片披萨的面积为 14.125 平方英寸，计算该尺寸的披萨可以切出多少片。\n4. 显示一条消息告知披萨的片数。\n\n整个披萨的总平方英寸可以使用公式计算：\n\
  \n`Area = π`r`²`\n\n其中变量 `r` 是披萨的半径，`π` 是希腊字母 PI。在你的程序中，将 `PI` 设为值为 `3.14` 的命名常量。以整数形式显示披萨的片数（即不带小数）。\n\
  \n# 23. 需要多少个披萨？\n\n修改你在 [编程挑战 22] 中编写的程序，使得如果预计每位参加派对的人平均吃四片披萨，程序能够报告你需要购买的披萨数量。程序应该询问用户参加派对的人数以及订购披萨的直径。然后它应该计算并显示需要购买的披萨数量。由于无法购买部分披萨，所需的披萨数量应以整数形式显示。\n\
  \n### 24. 角度计算器\n\n编写一个程序，询问用户一个以弧度为单位的角度。程序随后显示该角度的正弦、余弦和正切。（使用 `sin`、`cos` 和 `tan`\
  \ 库函数来确定这些值。）输出应以定点计数法显示，并保留四位小数。\n\n# 25. 种植葡萄藤\n\n一位葡萄园主正在种植几排新葡萄藤，她需要知道每行要种多少棵葡萄藤。她确定，在测量了未来某行的长度后，可以使用以下公式来计算该行可以容纳的葡萄藤数量，以及每行末端需要建造的架端柱组件：\n\
  \n$$V = \\frac{R - 2E}{S}$$\n\n公式中的项为：\n\n- `V` 是行内可以容纳的葡萄藤数量。\n- `R` 是行的长度（英尺）。\n\
  - `E` 是一个端柱组件占据的空间。\n- `S` 是葡萄藤之间的距离（英尺）。\n\n编写一个为葡萄园主进行计算的程序。该程序应要求用户输入以下内容：\n\n\
  - 行的长度（英尺）\n- 端柱组件占据的空间（英尺）\n- 葡萄藤之间的距离（英尺）\n\n一旦输入了数据，程序将计算并显示行内可以容纳的葡萄藤数量。\n\n\
  # 第 4 章 决策\n\n## 4.1 关系运算符\n\n## 概念\n\n关系运算符允许你比较数值和 `char` 值，并判断一个是否大于、小于、等于或不等于另一个。\n\
  \n到目前为止，你编写的程序遵循这一简单方案：\n\n- 收集用户输入。\n- 执行一个或多个计算。\n- 在屏幕上显示结果。\n\n计算机擅长计算，但它们也非常擅长比较值，以判断一个值是否大于、小于或等于另一个。这类操作对于许多任务非常有价值，例如检查销售数据、确定盈亏、检查数字以确保其在接受范围内，以及验证用户提供的输入。\n\
  \n在 C++ 中，使用关系运算符对数值数据进行比较。字符也可以用这些运算符进行比较，因为字符在 C++ 中被视为数值值。每个关系运算符都确定两个值之间是否存在特定的关系。例如，大于运算符（`>`）判断一个值是否大于另一个。等号运算符（`==`）判断两个值是否相等。[表\
  \ 4-1] 列出了 C++ 所有的关系运算符。\n\n## 表 4-1 关系运算符\n\n| 关系运算符 | 含义 |\n| --- | --- |\n| `>`\
  \ | 大于 |\n| `<` | 小于 |\n| `>=` | 大于或等于 |\n| `<=` | 小于或等于 |\n| `==` | 等于 |\n| `!=`\
  \ | 不等于 |\n\n### 注意\n\n所有的关系运算符都是二标记的。这意味着它们使用两个操作数。这里有一个使用大于运算符的示例：\n\n```\nx >\
  \ y\n```\n\n## 关系的值\n\n那么，关系表达式在程序中是如何使用的？记住，关系表达式是布尔表达式，这意味着它们的值只能是*true*（真）或*false*（假）。如果\
  \ `x` 大于 `y`，则 `x > y` 为真，`x < y` 为假。`==` 运算符判断左侧是否等于右侧。如果 `a` 是 4，以下表达式为真：\n\n\
  ```\na == 4\n```\n\n以下表达式为假：\n\n```\na == 2\n```\n\n# 警告\n\n注意等号运算符是两个 `=` 符号。不要将此运算符与单个\
  \ `=` 符号的赋值运算符混淆。`==` 运算符判断变量是否相等，而 `=` 运算符将右侧的值赋予左侧变量。稍会有更多介绍。\n\n两个关系运算符实际上测试的是一对关系。`>=`\
  \ 运算符判断其左侧是否大于或等于右侧。如果 `a` 是 4，`b` 是 6，且 `c` 是 4，以下表达式均为真：\n\n```\nb >= a\na >=\
  \ c\n```\n\n以下表达式为假：\n\n```\na >= 5\n```\n\n`<=` 运算符判断左侧是否小于或等于右侧。再次，如果 `a` 是 4，`b`\
  \ 是 6，且 `c` 是 4，以下表达式均为真：\n\n```\na <= c\nb <= 10\n```\n\n以下表达式为假：\n\n```\nb <=\
  \ a\n```\n\n最后一个关系运算符是 `!=`，它是不等于运算符。它判断左侧的操作数是否不同（即不等于）右侧的操作数，这与 `==` 运算符相反。与之前一样，如果\
  \ `a` 是 4，`b` 是 6，且 `c` 是 4，以下表达式均为真：\n\n```\na != b\nb != c\n```\n\n这些表达式为真，是因为\
  \ `a` 不等于 `b` 且 `b` 不等于 `c`。然而，以下表达式为假，因为 `a` 等于 `c`：\n\n```\na != c\n```\n\n[表\
  \ 4-2] 显示了其他关系表达式及其真假值。\n\n# 表 4-2 关系表达式示例（假设 `x` 为 10，`y` 为 7。）\n\n| 表达式 | 值 |\n\
  | --- | --- |\n\n\n\n\n\n| `x < y` | False，因为 `x` 不小于 `y`。 |\n| `x > y` | True，因为\
  \ `x` 大于 `y`。 |\n| `x >= y` | True，因为 `x` 大于或等于 `y`。 |\n| `x <= y` | False，因为 `x`\
  \ 不小于等于 `y`。 |\n| `y != x` | True，因为 `y` 不等于 `x`。 |\n\n## 什么是真？\n\n如果一个关系表达式可以求值为真（true）或假（false），那么这些值在程序内部是如何表示的？计算机如何在内存中存储\
  \ `true`？它又是如何存储 `false` 的？\n\n正如你在程序 2-16 中看到的，这两个抽象状态被转换成了数字。这可能会让人困惑，特别是对于初学者来说，因为在\
  \ C++ 中，零被认为假，任何非零值被认为真。C++ 关键字 `false` 被存储为 `0`，而关键字 `true` 被存储为 `1`。当一个关系表达式为假时，它的求值为\
  \ `0`。然而，当一个关系表达式为真时，它并不总是求值为 `1`。虽然通常如此，但它实际上可以求值为任何非零值。\n\n为了更充分地说明这一点，请看程序 4-1。\n\
  \n让我们仔细观察一下包含关系表达式的语句：\n\n```\ntrueValue = (x < y);\nfalseValue = (y == x);\n```\n\
  \n这些语句看起来可能很奇怪，因为它们正在将比较的结果赋值给变量。在第一个语句中，变量 `trueValue` 被赋值为 `x < y` 的结果。因为 `x`\
  \ 小于 `y`，该表达式为真，变量 `trueValue` 被赋值为一个非零值。在第二个语句中，表达式 `y == x` 为假，所以变量 `falseValue`\
  \ 被设置为 `0`。\n\n在编写此类语句时，大多数程序员都会将关系表达式括在括号中（如上所示），以使其更加清晰。\n\n然而，实际上并不需要括号，因为即使没有括号，关系操作也会在赋值操作之前执行。这是因为关系运算符的优先级高于赋值运算符。同样，算术运算符的优先级高于关系运算符。\n\
  \n语句\n\n```\nresult = x < y - 8;\n```\n\n等同于语句\n\n```\nresult = x < (y - 8);\n```\n\
  \n在两种情况下，`y - 8` 都会先求值。然后这个值会与 `x` 进行比较。然而，请注意第二个语句要清晰得多。当算术表达式的结果将用于关系表达式时，给算术表达式加上括号总是一个好主意。\n\
  \n表 4-3 显示了包含关系表达式的其他语句示例。\n\n# 表 4-3 包含关系表达式的语句（假设 `x` 为 10，`y` 为 7，`z` 为 `int`\
  \ 或 `bool`。）\n\n| 语句 | 结果 |\n| --- | --- |\n| `z = x < y` | `z` 被赋值为 `0`，因为 `x`\
  \ 不小于 `y`。 |\n| `cout << (x > y);` | 显示 `1`，因为 `x` 大于 `y`。 |\n| `z = (x >= y);`\
  \ | `z` 被赋值为 `1`，因为 `x` 大于或等于 `y`。 |\n| `cout << (x <= y);` | 显示 `0`，因为 `x` 不小于等于\
  \ `y`。 |\n| `z = (y != x);` | `z` 被赋值为 `1`，因为 `y` 不等于 `x`。 |\n| `cout << (x == (y\
  \ + 3));` | 显示 `1`，因为 `x` 等于 `y + 3`。 |\n\n关系运算符之间也有优先级顺序。测试相等或不相等的两个运算符（`==` 和\
  \ `!=`）优先级彼此相同。另外四个测试相对大小的关系运算符优先级彼此相同。这四个相对关系运算符的优先级高于两个相等关系运算符。表 4-4 显示了关系运算符的优先级。\n\
  \n# 表 4-4 关系运算符的优先级（从高到低）\n\n| `> >= < <=` |\n| `== !=` |\n\n这是一个如何运应用的示例。当 `a =\
  \ 9`，`b = 24` 且 `c = 0` 时，如下：\n\n```\ncout << (a > b);\n```\n\n由于优先级关系，`a > b` 先求值。由于\
  \ `9` 不大于 `24`，它求值为假，或 `0`。然后插入 `c`。\n\n在本章的剩余部分中，你将看到如何更多地使用关系表达式。\n\n## 检查\n\n\
  1. 4.1 假设 `x` 为 5，`y` 为 6，`z` 为 8，指明以下各项为真为假：\n   - `x < y`\n   - `z <= y`\n   -\
  \ `x != y`\n   - `x >= y`\n   - \n\n2. 4.2 指出以下语句是否正确或错误：\n   - `x <= y`\n   - `y\
  \ != x`\n   - `z`\n\n3. 4.3 用“是”或“否”回答以下问题：\n   - 如果 `x > y` 为真且 `z` 也为真，这意味着 `z`\
  \ 吗？\n   - 如果 `x == y` 为真且 `z` 也为真，这意味着 `z` 吗？\n\n4. 4.4 下段代码将显示什么？\n   ```\n  \
  \ int a = 0, b = 2, c = 4;\n   cout << (a > b);\n   cout << (c <= a);\n   cout <<\
  \ (a == b);\n   ```\n\n## 4.2 if 语句\n\n## 概念\n\n`if` 语句可以根据条件执行其他语句。你可以将过程程序的语句视为步骤。为了到达目的地，你必须从开始执行每一步。目前为止编写的代码就像程序的“路径”。\n\
  \n图 4-1 中的代码类型被称为*顺序结构*，因为语句是顺序一个一个执行的，没有分支。然而，程序通常需要多条路径。许多算法要求在某些情况下执行某些语句。这可以通过*决策结构*来实现。\n\
  \n# 图 4-1 顺序结构\n\n![源代码显示一个计算矩形面积的程序](img/FG_04_001.png)图 4-1 替代文本\n\n在决策结构的简单形式中，动作或一组动作仅在特定条件存在时执行。如果条件不存在，则不执行这些动作。图\
  \ 4-2 显示决策结构的逻辑。菱形符号表示是/否问题或真/假条件。如果问题的答案是“是”（或条件为真），程序流遵循一条路径，从而执行动作。如果问题的答案是“否”（或条件为假），程序流遵循另一条路径，跳过动作。由于决策结构决定了程序遵循哪条路径或分支，它有时被称为*分支结构*。\n\
  \n## 图 4-2 决策结构\n\n![流程图显示一个决策结构](img/FG_04_002.png)图 4-2 替代文本\n\n\n\n\n\n在流程图中，“穿外套”、“戴帽子”和“戴手套”这些动作只在外面很冷时才会执行。如果外面不冷，这些动作就会被跳过。这些动作是`条件条件执行`的，因为它们只有在特定条件（外面冷）存在时才会执行。\n\
  \n我们每天都会进行类似这样的心理测试。这里有一些其他例子：\n\n*   如果汽车燃油不足了，就在服务站停下加油。\n*   如果外面下雨，就进入室内。\n\
  *   如果你饿了，找点东西吃。\n\n在 C++ 中编写决策结构最常用的方法是使用 `if` 语句。图 4-3 展示了 `if` 语句的一般格式以及视觉化描述其工作原理的流程图。\n\
  \n# 图 4-3 if 语句的格式与逻辑\n\n![图表显示了一个决策结构和 2 个“if 语句”程序。](img/FG_04_003.png)图 4-3 完整替代文本\n\
  \n注意，`if` 结构体内部的语句包含在一组大括号内。这创建了 C++ 中称为 `block`（块），并让编译器知道哪些语句与 `if` 相关。左大括号必须位于\
  \ `if` `condition` 之后、正体中第一条语句之前。然而，在遵循这一要求的同时，不同的程序员选择了不同的位置来放置它。两种最常见的放置方式如图 4-3\
  \ 所示。本书使用了左侧的形式。你的老师会告诉你他或她希望你使用哪种形式。\n\n程序 4-2 说明了 `if` 语句的使用。用户输入三个测试分数，程序计算它们的平均分。如果平均分等于\
  \ 100，程序将祝贺用户获得了满分。\n\n让我们仔细观察程序 4-2 的第 21–24 行，这些行导致了祝贺信息的打印。\n\n```\n if (average\
  \ == 100)\n{   cout << \"Congratulations! \";\n    cout << \"That's a perfect score!\\\
  n\";\n}\n```\n\n有四点需要注意。首先，引导语句的单词 `if` 是一个 C++ 关键字，必须写为小写。其次，要测试的条件（`average ==\
  \ 100`）必须包含在括号内。第三，测试条件之后`没有`分号，尽管在每个与 `if` 结构相关的动作之后`确实有`分号。我们稍后会解释原因。最后，要条件条件执行的语句块被大括号包围。每当一个\
  \ `if` 语句相关联有两个或多个动作时，这都是必须的。\n\n如果只有一个语句需要条件执行，则可以省略大括号。例如，在程序 4-2 中，如果将两个 `cout`\
  \ 语句合并为一个语句，它们可以像这里这样写：\n\n```\n if(average == 100)\n   cout << \"Congratulations!\
  \ That's a perfect score!\\n\";\n```\n\n然而，某些老师更倾向于让你在条件执行块周围`始终`放置大括号，即使它只包含一个语句。\n\
  \n表 4-5 显示了 `if` 语句的其他示例及其结果。\n\n## 表 4-5 if 语句示例\n\n| 语句 | 结果 |\n| --- | --- |\n\
  | `if (hours > 40) { overTime = true; payRate *= 2; }` (```\\nif (hours > 40)\\\
  n{   overTime = true;\\n    payRate *= 2;\\n}\\n```) | 当 `hours` 大于 40 时，将 `true`\
  \ 赋值给布尔变量 `overTime` 并使 `payRate` 翻倍。 |\n| `if (hours > 40)` (```\\nif (temperature\
  \ > 32)\\n    freezing = false;`) | 当 `temperature` 大于 32 时，将 `false` 赋值给布尔变量 `freezing`。因为只有一个语句，`{}`\
  \ 是可选的。 |\n\n# if 语句的样式\n\n尽管 `if` 语句通常跨越一行，例如以下内容是相同的：\n\n```\nif (a >= 100) cout\
  \ \"The number is out of range.\";\nif (a >= 100)\n```\n\n为了易读，第一种是更好的样式。这里有关于 `if`\
  \ 的两个重要规则：\n\n*   条件执行语句应该位于 `if` 之后\n*   条件执行语句应该缩进\n\n# 需要注意的三种常见错误\n\n编写 `if`\
  \ 语句时，有三种常见的错误需要注意：\n\n1. 位置错误的分号\n2. 缺少大括号\n3. 混淆 `=` 与 `==\n\n# 注意分号\n\n如果你不经意在\
  \ `if` 之后放了一个分号，编译器将认为你放置了一个空语句。这将其与后面的语句隔离开。例如，如果 `if` 语句被分号提前终止，如下所示：\n\n```\n\
  \ if (average == 100); // 错误。分号提前终止了 if 语句。\n{\n    cout << \"Congratulations!\"\
  ;\n    cout << \"That's a perfect score!\";\n}\n```\n\n# 显示示例输入的修改后程序 4-2 输出\n\n\
  ```\n 输入 3 个测试分数我将为你计算平均分：80 90 70\n 平均值为 80.0\n恭喜！满分！\n```\n\n由于 `if` 语句在遇到分号时结束，大括号内的\
  \ `cout` 语句不再是它的一部分。因此，它们*总是*执行，无论 `average` 是否等于 100。这个错误的程序 4-2 版本可以在书籍配套网站的第\
  \ 4 章程序文件夹中找到，作为程序 4-2B。\n\n\n\n\n\n如果你打算使用 `if` 语句条件地执行一组语句而不仅仅是单条语句，请不要忘记大括号。如果没有大括号，`if`\
  \ 条件将只决定随后的第一条语句是否执行。任何随后的后续语句都被视为 `if` 语句之外，并且会被 `always` 执行。例如，请注意如果在原始的 程序 4-2\
  \ 中省略了包裹两个 `cout` 语句的大括号，会发生什么。\n\n```\n if (average == 100)\n    cout << \"Congratulations!\
  \ \";          // 这里没有大括号。\n    cout << \"That's a perfect score!\\n\";  // 这在 if\
  \ 之外。\n```\n\n# 程序 4-2 第二次修改后的输出（示例输入已加粗）\n\n```\n Enter 3 test scores and I will\
  \ average them: 80 90 70[Enter]\nYour average is 80.0\nThat's a perfect score! \n\
  ```\n\n在需要条件执行的语句组周围没有大括号的情况下，这些语句中只有第一条属于 `if` 结构。由于我们测试用例中的条件 `(average == 100)`\
  \ 为假，因此 `Congratulations!` 消息被跳过了。然而，打印 `That's a perfect score!` 的 `cout` 语句被执行了，无论\
  \ `average` 是否等于 100，它每次都会执行。这个错误的 程序 4-2 版本可以在书籍辅助网站的 第 4 章 程序文件夹中找到，标记为 程序 4-2C。\n\
  \n# 不要混淆 `==` 和 `=`\n\n之前你看到过警告，提醒不要将相等运算符 `(==)` 与赋值运算符 `(=)` 混淆，如下所示：\n\n```\n\
  \ if (x = 2)                // 注意！\n    cout << \"It is True!\";\n```\n\n这条语句并没有判断\
  \ `x` 是否等于 2；相反，它将值 2 赋值给 `x`！此外，`cout` 语句将被 `always` 执行，因为表达式 `x = 2` 的值为 2，C++\
  \ 将其视为真。\n\n发生这种情况是因为赋值表达式的值是赋值给 `=` 运算符左侧变量的值。因此，表达式 `x = 2` 的值为 2。早些你学过 C++ 将值\
  \ `true` 存储为 1。然而，它实际上认为所有非零值（不仅仅是 1）都是真。因此，2 代表一个真条件。\n\n让我们通过查看另一个原始 程序 4-2 的变体来更仔细地观察。这次请注意如果\
  \ `if` 条件中的相等关系运算符被替换为赋值运算符（所示），会发生什么。\n\n```\n if (average = 100)        // 错误。将\
  \ 100 赋值给 average。\n{\n    cout << \"Congratulations! \";\n    cout << \"That's\
  \ a perfect score!\\n\";\n}\n```\n\n# 程序 4-2 第三次修改后的输出（示例输入已加粗）\n\n```\n Enter 3\
  \ test scores and I will average them: 80 90 70[Enter]\nYour average is 80.0\nCongratulations!\
  \ That's a perfect score!\n```\n\n`if` 语句并没有将 `average` 与 100 比较，而是给它 `assigns`\
  \ 值 100。这导致 `if` 测试的结果为 100，这被视为真。因此，无论用户输入什么测试分数，两个 `cout` 语句每次都会执行。这个错误的 程序 4-2\
  \ 版本可以在书籍辅助网站的 第 4 章 程序文件夹中找到。\n\n\n\n\n\n如果 `bool` 变量 `salesQuotaMet` 为 `true`，这段代码将显示“You\
  \ have met your sales quota!”。否则，它不会显示任何内容。就像测试表达式以检查其值是否为非零或零一样，只需命名 `bool` 变量就可以测试其值是否等于\
  \ `true` 或 `false`。因此，上述代码等于以下内容：\n\n```\n if (salesQuotaMet == true)\n   cout <<\
  \ \"You have met your sales quota!\\n\";\n```\n\n你将在章节后续部分学习更多测试布尔变量。\n\n# 整数标志\n\
  \n尽管程序员在想创建一个标志位时通常使用 `Boolean` 变量，但也可以使用整数变量。在之前描述的销售佣金程序中，可以通过以下语句定义 `salesQuotaMet`\
  \ 为一个整数变量：\n\n```\n int salesQuotaMet = 0;   // 0 表示 false\n```\n\n与之前一样，我们将变量初始化为\
  \ `0`（表示 `false`），因为我们还不知道是否达到了销售额。在计算销售额后，我们可以使用下面的代码：\n\n```\n if (sales >= QUOTA_AMOUNT)\n\
  \   salesQuotaMet = 1;    // 1 表示 true\n```\n\n在程序的后部分，我们可以这样测试标志：\n\n```\n if (salesQuotaMet)\
  \      // 除 0 以外的任何值都为 true\n   cout << \"You have met your sales quota!\\n\";\n\
  ```\n\n或者像这样：\n\n```\n if (salesQuotaMet != 0)\n   cout << \"You have met your sales\
  \ quota!\\n\";\n```\n\n## 检查点\n\n1. 4.5 写一个 `if` 语句执行以下逻辑：如果变量 `price` 的值大于 `500`，则将\
  \ `0.2` 赋值给变量 `discountRate`。\n\n2. 4.6 写一个 `if` 语句，如果 `hours` 大于 `40`，则将 `payRate`\
  \ 乘以 `1.5`。\n\n3. 4.7 写一个 `if` 语句执行以下逻辑：如果变量 `sales` 大于 `50,000`，则将 `0.25` 赋值给 `commissionRate`\
  \ 变量，并将 `250` 赋值给 `bonus` 变量。\n\n4. 4.8 对或错：以下两个 `if` 语句执行相同的操作。\n\n    ```\n  \
  \   if (calls == 20)                    if (calls = 20)\n        rate *= 0.5;  \
  \                      rate *= 0.5;\n    ```\n\n5. 4.9 写一个 `if` 语句执行以下逻辑：如果名为 `ticketsSold`\
  \ 的变量等于 `200`，则将布尔标志变量 `soldOut` 设置为 `true`；\n\n6. 4.10 写一个 `if` 语句，如果布尔标志变量 `soldOut`\
  \ 设置为 `true`，则打印“The performance is sold out!”。\n\n7. 4.11 虽然以下代码段在语法上是正确的，但每个段都包含一个错误。找出错误并说明问题所在。\n\
  \n    1. ```\n         hours = 12;\n        if (hours > 40);\n           cout <<\
  \ hours << \" hours qualifies for over-time.\\n\";\n        ```\n\n    2. ```\n\
  \        interestRate = .05;\n        if (interestRate = .07)\n           cout <<\
  \ \"This account is earning the maximumrate.\\n\";\n        ```\n\n    3. ```\n\
  \         interestRate = .05;\n        if (interestRate > .07)\n           cout\
  \ << \"This account earns a $10 bonus.\\n\";\n        balance += 10.0;\n       \
  \ ```\n\n# 4.3 `if/else` 语句\n\n## 概念\n\n`if/else` 语句在 `if` 条件为真时执行一组语句，在条件为假时执行另一组语句。\n\
  \n`if/else` 语句是 `if` 语句的扩展。图 4-4 显示了该语句的通用格式以及视觉描述其工作原理的流程图。\n\n## 图 4-4 if/else\
  \ 语句的格式和逻辑\n\n![图表显示了一个决策结构流程图和“if/else”语句的格式。](img/FG_04_004.png)图 4-4 完整替代文本\n\
  \n与 `if` 语句一样，会测试一个条件。如果条件为真，则执行包含一个或多个语句的块。然而，如果条件为假，则执行另一组语句。程序 4-3 使用了 `if/else`\
  \ 语句结合模运算来判断一个数字是奇数还是偶数。\n\n`if` 语句末尾的 `else` 部分指定了条件为假时要执行的一个或多个语句。当 `number %\
  \ 2` 不等于 `0` 时，会打印一条消息。注意 `if/else` 语句遵循两条路径之一。将 `if/else` 语句想象成路上的分叉口。`else` 与\
  \ `if` 处于级。这使得两种可能的路径在视觉上清晰可见。\n\n## 何时使用 `if` 何时使用 `if/else`\n\n有时新的编程学生不确定应该使用两个\
  \ `if` 语句还是一个单一的 `if/else` 语句。基本规则如下：如果两个条件都可能为真或都可能为假，请使用两个独立的 `if` 语句。例如：\n\n\
  ```\n if (score >= 60)               // 使用 2 个 if 语句\n   cout << \"You passed. \\\
  n\";\nif (score >= 80)\n   cout << \"Good job. \\n\";\n```\n\n如果条件是互斥的（即一个必须为真而另一个为假），请使用两个\
  \ `if` 语句。例如：\n\n```\n if (score >= 60)                // 不要使用 2 个 if 语句\n   cout\
  \ << \"You passed. \\n\";\nif (score < 60)\n   cout << \"You failed. \\n\";\n```\n\
  \n然而，如果两个条件是互斥的，应该使用 `if/else` 语句。这是一个 `if/else` 语句的示例：\n\n```\n if (score >= 60)\n\
  \   cout << \"You passed. \\n\";\nelse\n   cout << \"You failed. \\n\";\n```\n\n\
  因此，这两个语句应该合并为一个单一的 `if/else` 结构，如下：\n\n```\n if (score >= 60)                //\
  \ 使用单一的 if/else 语句\n   cout << \"You passed. \\n\";\nelse\n   cout << \"You failed.\
  \ \\n\";\n```\n\n程序 4-3 使用单一的 `if/else` 语句来测试整数变量 `number` 是否是奇数还是偶数，因为这些是互斥的条件。如果一个数字能被\
  \ `2` 整除，它就是偶数。否则，它必须是奇数。程序 4-4 包含了另一个适合 `if/else` 结构的情况。它展示了如何确保程序不会尝试除以零。\n\n\
  除以零在数学上是不可能实现的，它通常会导致程序崩溃。这意味着程序会提前停止运行，有时会附带错误消息。\n\n\n\n\n注意 程序 4-4 的第 15 行是如何测试\
  \ `num2` 的值的。如果用户输入零以外的任何内容，由 `if` 控制的行就会执行，允许执行除法并显示结果。但如果用户为 `num2` 输入零，则执行由 `else`\
  \ 控制的行，导致显示错误信息。同样注意第 22 行和第 26 行的大括号。与 `if` 结构中的 `if` 部分一样，如果你想在 `else` 部分执行多条语句，则必须将这些语句放在一组大括号内。否则，`else`\
  \ 只控制单条语句。\n\n# 比较浮点数\n\n对浮点数进行相等性测试有时会得到错误的结果。由于缺乏精度或舍入误差，数学上应该与另一个相等的数字可能并不相等。在\
  \ 程序 4-5 中，数字 6 乘以 0.666667（2/3 的小数版本）。当然，6 乘以 2/3 等于 4。然而，程序的结果并不如此。\n\n通常，`result`\
  \ 中的值将是一个略小于 4 的数字，例如 3.999996。为了防止此类错误，在使用浮点数时，坚持大于和小于的比较是明智的。例如，与其测试结果是否等于 4.0，不如测试它是否非常接近\
  \ 4.0。程序 4-6 展示了这种技术。\n\n程序的第 16 行使用了 第 3 章 的 `abs` 函数。记住它返回参数的绝对值。通过使用它，我们确保只要\
  \ `result` 与 4.0 之间的差小于 .0001，测试条件就为真，无论 `result` 是比 .0001 小一点点还是大一点点。\n\n## 检查点\
