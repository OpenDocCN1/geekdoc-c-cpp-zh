  \ `peek()` 函数。\n\n# 11. 文件上的插入排序 I\n\n编写一个程序，使用一个初始为空的文件来存储用户输入的排序整数列表。整数以二进制形式存储。每当运行程序时，它都会打开文件并将存储的整数列表输出到屏幕上。然后程序要求用户输入一个新整数\
  \ `X`。程序随后查看文件末尾的整数。如果该整数小于或等于 `X`，程序将 `X` 存储在文件末尾并关闭文件。否则，程序从文件末尾开始向开头移动，将文件中每个大于\
  \ `X` 的值移动一个位置，直到到达 `X` 应该存储的文件位置。然后程序在相应位置写入 `X` 并关闭文件。\n\n# 12. 文件上的插入排序 II\n\n\
  修改为编程挑战 11 编写的程序，使文件包含人的记录。每个记录应包含一个 10 个字符的数组以存储姓名，和一个存储个人年龄的整数。文件应按名的字母顺序排序。\n\
