  \ 50n² + 75)` 属于 `O(20n³)`。\n6. 9.15 假设对于所有 `n ≥ 1` 都有 `g(n) ≥ 1`，证明 `O(g(n) + 100)`\
  \ 中的每一个函数也属于 `O(g(n))`。\n\n## 9.7 案例研究\n\n以下案例研究包含了第 9 章介绍材料的应用，可以在本书的配套网站 [pearsonhighered.com/gaddis](http://pearsonhighered.com/gaddis)\
  \ 的第 9 章文件夹中找到。\n\n## Demetris 领导力——第 1 & 2 部分\n\n第 9 章包含了说明如何搜索的程序。这两个案例研究展示了如何搜索和排序，DLC,\
  \ Inc. 这家出版书籍、DVD 和音频 CD 的虚拟公司。\n\n创建抽象数据类型——第 2 部分\n\n`IntList` 类作为第 8 章中的案例研究开始，现在扩展为包含搜索和排序功能。\n\
  \n## 复习题与练习题\n\n## 空题与简答\n\n1. 搜索算法遍历数组，将每个项目与搜索值进行比较。\n2. 搜索算法反复将搜索部分分为一半。\n3.\
  \ 线性搜索也被称为顺序算法。\n4. 搜索算法要求数组的内容是排序的。\n5. 在具有 N 个元素的数组中，线性搜索的`平均`比较次数是。\n6. 在具有 N\
  \ 个元素的数组中，线性搜索的`最大`比较次数是。\n7. 如果目标值存储在数组元素，线性搜索只需一次比较即可找到该值。\n8. 如果目标值存储在数组中，二分查找只需一次比较即可找到该值。\n\
  9. 在二分查找中，经过三次比较后，只剩下数组的几需要搜索。\n10. 在具有 2,000 个元素的数组中，二分查找查找某个值时，最大比较次数是。\n11. 如果数组是有序的，值是从从小到大排列的。\n\
  12. 如果数组是有序的，值是从从大到小排列的。\n13. 泡排序在每次通过数据时将若干项放在正确位置。\n14. 选择排序在每次通过数据时将若干项放在正确位置。\n\
  15. 为了排序 N 个数字，对于一个已经排好字的数组，泡排序需要多少次通过：\n    1. 如果它不包含发现数组已完全排序后停止的代码？\n    2. 如果它包含发现数组已完全排序后停止的代码？\n\
  16. 为了排序 N 个数字，选择排序总是需要多少通过？\n17. 为什么在大数组上，选择排序几乎总是比泡排序更有效？\n18. 在排序对象或结构体数组时，如果两个元素的搜索键值顺序错误，算法必须进行交换。\n\
  19. 完成下表，计算线性搜索执行的平均和最大比较次数，以及二分查找执行的最大比较次数。\n\n| 数组大小→ | 100 个元素 | 1000 个元素 | 10,000\
  \ 个元素 | 100,000 个元素 | 1,000,000 个元素 |\n| --- | --- | --- | --- | --- | --- |\n|\
  \ 线性搜索（平均比较次数） | | | | | |\n| 线性搜索（最大比较次数） | | | | | |\n| 二分查找（最大比较次数） | | | | |\
  \ |\n\n\n\n\n\n1. 编写一个尽可能高效的伪代码算法，用于查找具有特定 `customerID` 的记录，假设从 101 到 500 的每一个客户\
  \ ID 都被使用，且数组有 400 个元素。\n2. 编写一个尽可能高效的伪代码算法，用于查找客户 ID 在列表末尾附近（例如 494）的记录，假设 101\
  \ 到 500 范围内并非每一个客户 ID 都被使用，且数组大小仅为 300。\n\n## 软技能\n\n决定如何组织和访问数据是程序设计的一个重要部分。你已经熟悉了许多允许你组织数据的结构和方法。这些包括一维数组、向量、多维数组、并行数组、结构体、类、结构体数组以及类对象数组。你现在还熟悉了一些排列数据（即排序数据）和准位数据项（即搜索数据项）的技术。\n\
  \n22. 与两到三名学生组成小组，共同决定如何对以下应用程序中组织、排序和定位所使用的数据。准备向全同学展示你们小组的设计。\n\n要开发的程序是一个菜单驱动型程序，用于跟踪雇佣你的村庄签发的停车罚单。当开具罚单时，程序必须接受并存储以下信息：罚单号、警员编号、车辆车牌州份和号码、地点、违规代码（这指示违反了哪项停车法律）以及开具日期时间。程序必须存储与每个违规代码相关的罚金金额。当罚单被支付时，程序必须能够接受并存储已支付的信息、支付金额以及收到付款的日期。程序必须能够接受此类查询，例如在输入罚单号时显示整个罚单记录。程序还必须能够生成以下报告：\n\
  \n* 在特定日期开具的所有罚单列表，按罚单号排序\n* 在特定日期收到付款的所有罚单列表，以及当天收到的总金额\n* 一个月内开具的所有罚单报告，按警员编号排序，并统计每个警员开具的罚单数量\n\
  * 所有尚未支付或收到的金额少于应付金额的罚单报告，按车辆车牌号排序。\n\n## 编程挑战\n\n这些编程挑战中的许多可以使用类或不使用类来编写。你的老师会告诉你你应该使用哪种方法。\n\
  \n# 1. 信用卡账户验证\n\n编写一个程序，允许用户输入信用卡账户号。程序应通过检查以下列表来确定该数字是否有效：\n\n| 5658845 | 4520125\
  \ | 7895122 | 8777541 | 8451277 | 1302850 |\n| 8080152 | 4562555 | 5552012 | 5050552\
  \ | 7825877 | 1250255 |\n| 1005231 | 6545231 | 3852085 | 7576651 | 7881200 | 4581002\
  \ |\n\n用这些值初始化一个维数组。然后使用简单的线性查找来定位用户输入的数字。如果用户输入的数字在数组中，程序应显示一条数字有效的消息。如果用户输入的数字不在数组中，程序应显示一条该数字无效的消息。\n\
  \n# 2. 彩票中奖者\n\n彩票购买者每周购买 10 张票，总是玩相同的 10 组五位数“幸运”组合。编写一个程序，用这些数字初始化数组，然后让玩家输入本周的中奖五位数。程序应对玩家的数字列表进行线性查找，并报告本周是否有某张票中奖。以下是这些数字：\n\
  \n| 13579 | 26791 | 26792 | 33445 | 55555 | 62483 | 77777 | 79422 | 85647 | 93121\
  \ |\n\n# 3. 彩票中奖者修改\n\n修改你为[编程挑战 2]（彩票中奖者）编写的程序，使其执行二分查找而不是线性查找。\n\n# 4. 打击率\n\n\
  编写一个程序，创建并显示 12 名小联盟棒球员及其打击率的报告，按打击率从高到低的顺序排列。程序应使用结构体数组或类对象数组来存储数据，每个结构体或对象持有球员的名字和他们的打击率。通过让\
  \ `main` 调用不同的函数来输入数据、排序数据、执行交换和显示报告，使程序模块化。\n\n# 5. 滑雪坡道\n\n编写一个可以供滑雪场用于跟踪一周雪况的程序。它应该有一个包含七个元素的结构体或类对象数组，其中每个结构体或对象持有日期和雪深（英寸）。程序应让用户输入月份、测量期间的开始和结束日期，以及基础深度。然后程序应按升序排列数据并显示结果。以下是示例报告的开头。\n\
  \n```\n 12 月报告\n   日期  深度\n    13  42.3\n    12  42.5\n    14  42.8\n```\n\n# 6.\
  \ 字符串排序\n\n修改本章提供的 `selectionSort` 函数，使其对字符串数组而不是整数数组。使用驱动程序进行测试。\n\n# 7. 二分字符串\n\
  \n修改本章提供的 `binarySearch` 函数，使其搜索字符串数组而不是 `int` 数组。使用驱动程序进行测试。（数组必须先排序，二分查找才能工作。）\n\
  \n### 8. 搜索基准\n\n编写一个程序，其中包含至少 20 个按升序存储在数组中的整数。它应该调用一个使用线性查找算法查找其中一个值的函数。该函数应记录找到该值之前的比较次数。程序随后应调用一个使用二分查找算法查找相同值的函数。它也统计比较次数。在屏幕上显示这两个计数。\n\
  \n# 9. 降序排序基准\n\n编写一个程序，使用两个包含至少 20 个随机顺序整数的相同数组。它应该调用一个修改后的冒泡排序算法对其中一个数组进行降序排序。该函数应计算交换次数。程序随后应调用一个修改后的选择排序算法对另一个数组进行降序排序。它也应计算交换次数。在屏幕上显示排序后的数据以及这两个标记清晰的计数。\n\
  \n### 10. 排序顺序\n\n编写一个程序，使用两个包含八个随机整数的相同数组。它应该显示第一个数组的内容，然后调用一个修改后的升序冒泡排序函数对其排序，并在每轮后打印数组内容。接下来程序应该显示第二个数组的内容，然后调用一个修改后的升序选择排序函数对其排序，并在每轮后打印数组内容。\n\
