  \ processArray(int * const array, int size)`\n\n5. 10.13 假设 `ip` 是一个整数指针。写一个语句动态分配一个整数变量并将其地址存在\
  \ `ip`，然后写一个语句释放该语句的内存。\n\n6. 10.14 假设 `ip` 是一个整数指针。写一个语句动态分配一个 500 个整数的数组将其地址存在\
  \ `ip`，然后写一个语句释放该语句的内存。\n\n7. 10.15 什么是空指针？\n\n8. 10.16 给出一个正确返回指针的函数示例。\n\n9. 10.17\
  \ 给出一个错误返回指针的函数示例。\n\n# 10.11 指向类对象的指针\n\n## 概念\n\n指针和动态内存分配可以类对象和结构。\n\n指向类的指针与声明任何指针类型相同。例如，如果\
  \ `Rectangle` 定义为：\n\n```cpp\nclass Rectangle\n{\n   int width, height;\n};\n```\n\
  \n你可以通过以下代码声明指向 `Rectangle` 的指针并创建一个 `Rectangle` 对象：\n\n```cpp\nRectangle *pRect\
  \ = nullptr; // 指向 Rectangle 的指针\nRectangle rect;             // Rectangle 对象\n\
  ```\n\n并且可以将 `rect` 的地址赋值给 `pRect`：\n\n```cpp\n pRect = &rect;\n```\n\n现在假设你想通过指针\
  \ `pRect` 访问 `Rectangle` 对象的成员。由于 `*pRect` 是访问 `rect` 的另一种方式，你可能认为\n\n```cpp\n *pRect.width\n\
  ```\n\n将访问 `rect.width`，但事实并非如此。由于点选择符的优先级高于 `*` 运算符，因此 `*pRect.width` 等同于 `*(rect.width)`。最后一个表达式是一个类型错误。为了得到正确结果，你必须使用括号强制间接运算符\
  \ `*` 先应用，如下：\n\n```cpp\n (*pRect).width\n```\n\n以下语句将正确地将矩形的尺寸设置为 10 和 20。\n\n\
  ```cpp\n (*pRect).width = 10;\n(*pRect).height = 20;\n```\n\n\n\n\n将括号、间接引用运算符和点选择符结合使用通过指针访问类对象的成员，可能会导致难以阅读的表达式。为了解决这个问题，C++\
  \ 提供了结构指针运算符 `->`，当你想要通过指针访问类对象的成员时可以使用它。它由一个连字符 `-` 和一个紧挨在其后的大于符号 `>` 组成，看起来像一个箭头。使用该运算符，你可以通过这些语句设置矩形的尺寸：\n\
  \n```\n pRect->width = 10;\npRect->height = 20;\n```\n\n类对象的成员函数可以通过指针进行调用。特别是，如果\
  \ `ptr` 是一个指向具有成员函数 `fun()` 对象的指针，那么可以使用以下两个（等效的）表达式中的任意一个调用该函数：\n\n```\n (*ptr).fun();\n\
  ptr->fun();\n```\n\n# 类对象的动态分配\n\n动态分配的类对象用于构建和管理高级数据结构的程序，例如列表（在第 17 章中学习）和二叉树（在第\
  \ 19 章中学习）。`new` 运算符用于分配此类对象，方式与分配与其他类型的变量相同。例如，以下语句分配了一个单个 `Rectangle` 对象并设置了它的尺寸：\n\
  \n```\n pRect = new Rectangle;\npRect->width = 10;\npRect->height = 3;\n```\n\n\
  如果 `Rectangle` 有一个接受两个整数参数的构造函数，那么你可以这样同时分配对象并调用构造函数：\n\n```\n pRect = new Rectangle(10,\
  \ 30);\n```\n\n程序 10-17 说明了这些概念。\n\n# 作为函数参数的类对象指针\n\n结构和类变量的指针可以作为参数传递给函数。接收指针的函数可以使用它来访问或修改结构的成员。这在\
  \ 程序 10-18 中显示。\n\n# 10.12 选择对象的成员\n\n有时结构和类包含指针作为成员。例如，以下结构声明包含一个 `int` 指针成员：\n\
  \n```\n struct GradeInfo\n{\n   string name;     // 学生姓名\n   int *testScores; //\
  \ 动态分配的数组\n   double average;  // 测试平均分\n};\n```\n\n记住，结构指针运算符（->`）用于对结构或类对象的指针进行解引用，而不是指向结构或类成员的指针。如果程序解引用示例结构中的\
  \ `testScores` 指针，则必须使用间接引用运算符。例如，假设定义了以下变量：\n\n```\n GradeInfo student1;\n```\n\
  \n以下语句将显示 `testScores` 成员所指向的值：\n\n```\n cout << *student1.testScores;\n```\n\n\
  仍然可以定义一个包含指针成员的结构指针。例如，以下语句将 `stPtr` 定义为指向 `GradeInfo` 结构的指针：\n\n```\n GradeInfo\
  \ *stPtr;\n```\n\n假设 `stPtr` 指向一个有效的 `GradeInfo` 变量，以下语句将显示其 `testScores` 成员指向的值：\n\
  \n```\n cout << *stPtr->testScores;\n```\n\n在该语句中，`*` 运算符解引用了 `stPtr->testScores`，而\
  \ `->` 运算符解引用了 `stPtr`。记住表达式\n\n```\n stPtr->testScores\n```\n\n等于\n\n```\n (*stPtr).testScores\n\
  ```\n\n所以，表达式\n\n```\n *stPtr->testScores\n```\n\n等同于\n\n```\n *(*stPtr).testScores\n\
  ```\n\n这个表达式的笨拙显示了 `->` 运算符的必要性。表 10-1 列出了一些使用 `*`、`->` 和 `.`  运算符的表达式，并描述了每个运算符引用的内容。如果你记住选择结构成员的\
  \ `->` 和 `.` 运算符的优先级高于解引用运算符 `*`，那么表格将更容易理解。\n\n# 表 10-1 结构指针的解引用\n\n| 表达式 |  |\n\
  | --- | --- |\n| `s->m` | `s` 是指向结构变量或类对象的指针，`m` 是一个成员。该表达式访问 `s` 指向的结构或类对象的 `m`\
  \ 成员。 |\n| `*a.p` | `a` 是结构变量或类对象，`p` 指针是 `a` 的成员。该表达式访问 `a.p` 所指向的值。 |\n| `(*s).m`\
  \ | `s` 是指向结构变量或类对象的指针，`m` 是一个成员。`*` 运算符解引用 `s`，导致表达式访问对象的 `m` 成员。 |\n| `*s->p`\
  \ | `s` 是指向结构变量或类对象的指针，`p` 指针是其成员。该表达式访问 `s` 指向的成员。 |\n| `*(*s).p` | `s` 是指向结构变量或类对象的指针，`p`\
  \ 指针是其成员。该表达式访问 `s` 指向的对象。 |\n\n## 检查点\n\n假设存在以下结构声明，用于问题 10.18 到 10.20：\n\n```\n\
  \ struct Rectangle\n{\n   int length;\n   int width;\n};\n```\n\n1. 10.18 定义指向 `Rectangle`\
  \ 的指针。\n2. 10.19 假设该指针指向有效的 `Rectangle` 结构。通过该指针显示结构的语句。\n3. 10.20 假设 `rptr` 是指向\
  \ `Rectangle` 结构的指针。以下表达式 A、B 或 C 中的哪一个等于表达式\n\n```\n rptr->width\n```\n1. `*rptr.width`\n\
  2. `(*rptr).width`\n3. `rptr.(*width)`\n\n\n\n\n\n`Shared pointers`（共享指针）共同维护一个当前共享某个对象所有权的指针计数。当设置额外的指针指向该对象时，该\
  \ `reference count`（引用计数）增加；当指针与对象分离时，计数减少。当引用计数降零时，对象将被删除。我们本书中不会讨论弱指针（weak pointers）。\n\
  \n`unique_ptr`、`shared_ptr` 和 `weak_ptr` 类定义在 `<memory>` 头文件中，因此在使用这些类的程序中，你需要包含语句：\n\
  \n```cpp\n #include <memory>\n```\n\n# `unique_ptr` 类\n\n智能指针实际上是一个封装了指向所占有对象的普通指针的对象。我们将被封装的普通指针称为\
  \ `raw pointer`（原始指针）。智能指针类根据所指向的对象的类型进行参数化。例如，`unique_ptr<int>` 是一个指向 `int` 的指针；而\
  \ `unique_ptr<double>` 是一个指向 `double` 的指针。以下代码展示了如何创建唯一指针。\n\n```cpp\n unique_ptr<int>\
  \ uptr1(new int);\nunique_ptr<double> uptr2(new double);\n```\n\n或者，你可以定义一个未初始化的唯一指针，并在之后给它赋值：\n\
  \n```cpp\n unique_ptr<int> uptr3;\nuptr3 = unique_ptr<int>(new int);\n```\n\n为了避免内存泄漏，由智能指针管理的对象不应该有其他指向它们的引用。换句话说，指向动态分配存储的指针应该立即传递给智能指针构造函数，而不是先将其赋值给指针变量。例如，你应该避免编写如下代码：\n\
  \n```cpp\n int *p = new int;\nunique_ptr<int> uptr(p);\n```\n\n智能指针不支持指针算术，因此如下语句：\n\
  \n```cpp\n uptr1 ++;\nuptr1 = uptr1 + 2;\n```\n\n将导致编译错误。然而，智能指针通过运算符重载支持常用的指针操作\
  \ `*` 和 `->`，这个主题我们将在第 11 章学习。以下代码对指向动态分配内存位置的唯一指针进行解引用，为该位置赋值，将该值加 1，然后打印结果：\n\n\
  ```cpp\n unique_ptr<int> uptr(new int);\n*uptr = 12;\n*uptr = *uptr + 1;\ncout ≪\
  \ *uptr ≪ endl;\n```\n\n你不能用另一个 `unique_ptr` 对象的值初始化 `unique_ptr`。同样，你不能将一个 `unique_ptr`\
  \ 对象赋值给另一个。因为此类操作会导致两个唯一指针共享同一个对象的所有权。因此，以下语句会导致编译错误：\n\n```cpp\n unique_ptr<int>\
  \ uptr1(new int);\nunique_ptr<int> uptr2 = uptr1; // 非法初始化\nunique_ptr<int> uptr3;\
  \ \t\t// OK\nuptr3 = uptr1; \t\t\t// 非法赋值\n```\n\nC++ 提供了一个 `move()` 库函数，可以将所有权从一个唯一指针转移到另一个：\n\
  \n```cpp\n unique_ptr<int> uptr1(new int);\n*uptr1 = 15;\nunique_ptr<int> uptr3;\
  \    // OK\nuptr3 = move(uptr1);      // 所有权从 uptr1 转移到 uptr3\ncout ≪ *uptr3 ≪ endl;\
  \    // 打印 15\n```\n\n当执行如下移动语句时：\n\n```cpp\n U = move(V); \n```\n\n会发生两件事。首先，当前由\
  \ `U` 拥有的任何对象会被释放。其次，被移动的指针 `V` 放弃对其对象的所有权并变为 `empty`，而 `U` 接管之前由 `V` 拥有的对象。\n\n\
  你不能通过值传递将唯一指针传递给函数，因为按值传递涉及实际参数的拷贝。如果你有一个按值传递接受唯一指针的函数，在调用函数时必须对实际参数使用 `move()`\
  \ 函数：\n\n```cpp\n // 函数使用按值传递\nvoid fun(unique_ptr<int> uptrParam)\n{\n   cout ≪\
  \ *uptrParam ≪ endl;\n}\n\nint main()\n{ \n   unique_ptr<int> uptr(new int);\n \
  \  *uptr = 10; \n   fun(move(uptr)); // 在调用中使用 move\n}\n```\n\n上述代码将在函数 `fun()`\
  \ 内部打印 10。或者，如果你使用按引用传递，则可以省略实际参数上的 `move()`：\n\n```cpp\n // 函数使用按引用传递\nvoid fun(unique_ptr<int>&\
  \ uptrParam)\n{\n   cout ≪ *uptrParam ≪ endl;\n}\n\nint main()\n{\n   unique_ptr<int>\
  \ uptr1(new int);\n   *uptr1 = 15;\n   fun(uptr1); \t// 调用时不需要 move\n}\n```\n\n\
  上述程序执行时将打印数字 15。\n\n有趣的是，你可以从函数返回一个唯一指针。这是因为编译器会对返回 `unique_ptr` 对象的函数返回值自动应用 `move()`\
  \ 操作。\n\n```cpp\n // 返回一个指向动态分配 \n // 资源的唯一指针\nunique_ptr<int> makeResource()\n\
  {\n   unique_ptr<int> uptrResult(new int);\n   *uptrResult = 55;\n   return uptrResult;\n\
  }\n\nint main()\n{\n   unique_ptr<int> uptr = makeResource();\n   cout ≪ *uptr ≪\
  \ endl;\n}\n```\n\n# 数组的唯一指针\n\n上述创建的智能指针会调用 `delete` 处理其封装的指针。为了确保数组被释放，你应该在类型后加上一对括号\
  \ `[]`。例如：\n\n```cpp\nunique_ptr<int[]> up(new int[5]);\n```\n\n记得智能指针 `up` 可以像普通\
  \ `int` 指针一样使用。通过回顾数组符号，我们可以编写程序在数组中存储整数的平方：\n\n```cpp\n int main()\n{\n   // 数组的唯一指针\n\
  \   unique_ptr<int[]> up(new int[5]);\n\n   // 设置数组元素为整数平方\n   for (int k = 0; k\
  \ < 5; k++)\n   {\n   up[k] = (k + 1)*(k + 1);\n   }\n\n   // 打印数组元素\n   for (int\
  \ k = 0; k < 5; k++)\n   {\n   cout ≪ up[k] ≪ \" \";\n   }\n   cout ≪ endl;\n}\n\
  ```\n\n打印的结果将是 1 4 9 16 25。\n\n用于创建 `T` 类型对象的数组唯一指针时，`make_unique<T[]>( ) 需要一个整数参数作为数组的大小：\n\
  \n```cpp\nunique_ptr<int[]> up = make_unique<int[]>(5);\n```\n\n# `unique_ptr` 类的成员函数\n\
  \n`unique_ptr` 类有一些通常非常有用的实例成员函数。它们如表 10-2。\n\n## 表 10-2 | 成员函数 | 说明 |\n| --- |\
  \ --- | --- |\n| `reset()` | 销毁智能指针管理的对象（如果有）。智能指针变为空。 |\n| `reset(T* ptr)` | 销毁智能指针当前管理的对象（如果有）。智能指针接管原始指针\
  \ `ptr` 所指向的对象。 |\n| `get()` | 返回该智能指针管理的对象的原始指针。如果需要将此类指针传递给不知道如何处理智能指针的函数，则非常有用。\
  \ |\n\n\n\n\n\n程序 10-19 展示了唯一智能指针的使用。一个 `Thing` 类与一个全局变量关联，该变量用于在创建每个 `Thing` 对象时为其分配某种序列号，且该类的每个对象在创建时\
  \ 都会被分配一个唯一的数字。`Thing` 类有一个构造函数和一个析构函数，用于追踪类实例的创建和销毁。\n\n`Thing` 类包含一个 `to_string()`\
  \ 函数，该函数返回一个包含实例“序列号”的字符串。该方法调用了一个也称为 `to_string()` 的库函数，该函数定义在标准命名空间 `std` 中，用于将整数\
  \ `instanceNumber` 转换为字符串形式。使用作用域解析运算符 `std::` 来解决歧义。\n\n注意，此程序中没有对 `delete` 的调用。通过检查代码及其输出，你可以看到智能指针是如何工作删除不再需要的内存的。\n\
  \n# `shared_ptr` 类\n\n共享指针用于管理可以有多个所有者的动态分配对象。特别是，类型 `shared_ptr<T>` 用于管理类型为 `T`\
  \ 的对象的所有权。类构造函数 `shared_ptr<T>(T * ptr)` 可用于创建一个共享指针，管理由原始指针 `ptr` 提供的地址的对象。\n\n\
  `shared_ptr` 类重载了指针运算符 `*` 和 `->`。这里有一个简单的示例，它创建了一个由共享指针管理的动态分配整数，然后通过该指针访问它：\n\n\
  ```\n int main()\n{\n   shared_ptr<int> p(new int);\n   *p = 45;\n   cout ≪ *p +\
  \ 1;\n\n   return 0;\n}\n```\n\n这段代码将打印值 46。\n\n这是另一个示例。假设我们想要管理以下类的共享所有权：\n\n```\n\
  \ class Person\n{ \n   string name;\n   int age;\npublic:\n   string to_string()\n\
  \   {\n     return name + \" \" + to_string(age) + \"\\n\";\n   }\n   // 构造函数\n\
  \   Person() {name = \"\"; age = 0;}\n   Person(const string& name, int age)\n \
  \  {\n     this–>name = name;\n     this–>age = age;\n   }\n}\n```\n\n我们可以创建两个共享指针，每个管理不同的对象，如下：\n\
  \n```\n shared_ptr<Person> p1(new Person());\nshared_ptr<Person> p2(new Person(\"\
  Maria Wu\", 23));\n```\n\n或者，我们可以写成\n\n```\n shared_ptr<Person> p1 = shared_ptr<Person>(new\
  \ Person());\nshared_ptr<Person> p2 = shared_ptr<Person>(new Person(\"Maria Wu\"\
  , 23));\n```\n\n# 共享指针组\n\n假设你设置了一个共享指针来管理由原始指针 `rPtr` 指的对象：\n\n```\n T * rPtr =\
  \ new T();\nshared_ptr<T> sPtr1(rPtr);\n```\n\n此时，`sPtr1` 成为共享指针组的唯一成员，该组拥有 `rPtr`。该组维护一个引用计数，该计数仅仅是属于该组的共享指针的数量。这个“组”被称为*控制块*，它本身实际上是一个动态分配的对象，负责跟踪引用计数和指向被管理对象的原始指针。控制块负责在引用计数归零时删除被管理的对象。你可以认为共享指针指向控制块，而控制块指向被管理的对象。\n\
  \n现在，如果用 `sPtr1` 初始化另一个共享指针，\n\n```\n shared_ptr<T> sPtr2 = sPtr1;\n```\n\n那么 `sPtr2`\
  \ 成为与 `sPtr1` 同一组的成员，共享 `rPtr` 对象的所有权，并且该组的引用计数增加一。如果之后，`sPtr2` 被赋值另一个共享指针的值：\n\n\
  ```\n sPtr2 = sPtr3;\n```\n\n那么 `sPtr2` 将放弃对 `rPtr` 的所有权，离开 `sPtr1` 组并加入 `sPtr3`\
  \ 组。第一个组的引用计数减一，而第二个组的引用计数增加。\n\n# 双重入的危险\n\n在使用共享指针时，你应该避免可能导致两组指针管理同一个对象的情况。例如，在代码中\n\
  \n```\n T * rPtr = new T();\nshared_ptr<T> sPtr1(rPtr);\nshared_ptr<T> sPtr2(rPtr);\n\
  ```\n\n这两个共享指针指向两个不同的控制块，而它们管理同一个对象。引用计数先归零的第一个组将删除该对象，导致另一组留下悬空指针。为了避免这个问题，给定的原始指针最多应初始化一个共享指针。\n\
  \n# `make_shared<T>()` 函数\n\n再次考虑共享指针的创建：\n\n```\n shared_ptr<Person> p1(new Person());\n\
  ```\n\n该语句的执行涉及两次独立的内存分配：一个用于分配控制块，另一个用于分配 `Person` 对象。内存分配会产生开销，因此分配一次足够容纳控制块和对象的内存更有效率。使用该函数，我们可以重写上述语句\n\
  \n```\n shared_ptr<Person> p1 = make_shared<Person>();\n```\n\n`make_shared` 接收参数。为了消除双重入的可能，我们可以写成\n\
  \n```\n shared_ptr<Person> p2 = make_shared<Person>(\"Maria Wu\", 23);\n```\n\n\
  `make_shared` 函数是创建共享指针的推荐方法。\n\n# 选定的共享指针成员函数\n\n表 10-3 列出了操作共享指针的最用函数。\n\n# 表\
  \ 10-3 shared_ptr 成员函数\n\n| 成员函数 | 说明 |\n| --- | --- |\n| `get()` | 返回指向管理对象的原始指针，如果没有对象则返回空指针。\
  \ |\n| `reset()` |释放管理对象（如果有）。调用指针变为空。 |\n| `reset(T * ptr)` | Release 当前管理的对象并获取\
  \ ptr 指向的对象。 |\n| `use_count()` | 返回指向同一对象的共享指针数量。 |\n\n此外，你可以通过测试共享指针的值来检查它是否正在管理对象：\n\
  \n```\n shared_ptr<T> p = ...\nif ( p )\n{\n   // 正在管理对象\n}\nelse\n{\n   // 共享指针为空\n\
  }\n```\n\n# 数组共享指针\n\n默认情况下，`shared_ptr` 使用 `delete` 来销毁管理对象。与 `unique_ptr` 不同，你无法写\n\
  \n```\n shared_ptr<T[]> sPtr; // 错误！\n```\n\n来指定管理对象的类型为数组。绕过此限制的一种简单方法是使用指向 `T`\
  \ 向量的共享指针：\n\n```\n shared_ptr<vector<T>> sVecPtr; \n```\n\n当向量被销毁时，它的析构函数将运行并销毁所有的向量元素。\n\
