  \ 7-5 分离类规格、实现和客户端代码文件的完整替代文本\n\n这些步骤执行的具体细节在每个 C++ 开发系统中都是不一样的。幸运的是，大多数系统会自动为你完成所有这些步骤。例如，在\
  \ Microsoft Visual C++ 中，你创建一个项目，然后只需将所有文件添加到项目中即可。当你编译项目时，这些步骤会自动为你完成并生成一个可执行文件。一旦创建了可执行文件，你就可以运行程序。当为\
  \ `boxLength` 和 `boxWidth` 输入有效值时，输出应与 程序 7-3 所示所示相同。\n\n### 注意\n\n关于创建多文件项目的附加信息，可以在该书的配套网站\
  \ [pearsonhighered.com/<wbr>gaddis](http://pearsonhighered.com/gaddis)上的 附录 G。\n\
  \n# 使用多个文件的优点\n\n将客户端程序与其所使用的类的细节分离被认为是一种良好的编程实践。类是抽象数据类型的一个示例，正如你在本章前面学到的那样，编写使用该类的应用程序的程序员唯一需要知道的是该类做什么、它能存储什么类型的数据、它提供了哪些函数以及如何调用它们。程序员以及任何使用该类的程序都不需要了解关于类实现的任何信息。此外，通常许多不同的程序会使用特定的类。如果定义类成员函数的实现代码位于单独的文件中，那么这些代码不需要存在于所有这些程序中。每个程序只需简单\
  \ `#include` 包含定义的文件即可。\n\n将类分离为规格文件和实现文件也被认为是一种良好的编程实践。如果你想将你的类提供给其他程序员，你不必共享所有的源代码。你只需要提供规格文件的副本和类实现的编译后的对象文件即可。其他程序员只需在他们的程序中插入必要的\
  \ `#include` 指令，对它们进行编译，并将它们与你的类对象文件链接。这防止了可能不了解你代码所有细节的其他程序员做出引入 bug 的更改。\n\n将类分离为规格和实现文件在必须修改类成员函数时也会让事情变得更容易。你只需要修改实现文件并重新编译它以创建一个新的对象文件。使用该类的程序不需要重新编译。它们只需要与新的对象文件链接即可。\n\
  \n# 在类对象中执行输入输出\n\n你可能已经注意到 程序 7-12 中我们避免了在 `Rectangle` 类内部进行任何 I/O 操作。通常，让类成员函数避免使用\
  \ `cin` 和 `cout` 被认为是一种良好的设计。这样，任何编写使用该类的程序都不会被限制在类执行输入或输出的特定上。除非类被专门设计用于执行 I/O，否则将用户输入输出等操作交给设计应用程序的人。作为一条一般规则，类应该提供成员函数来获取数据值而不并在屏幕上显示它们。同样，它们应该提供在不使用\
  \ `cin` 的情况下将数据存储到私有成员变量中的成员函数。程序 7-12 遵循了这两项实践。\n\n### 注意\n\n在某些情况下，类执行 I/O 是合适的。例如，类可以被设计为在屏幕上显示菜单并获取用户的选择。另一个例子是处理程序文件\
  \ I/O 的类。然而，持有和操作数据的类不应与任何特定的 I/O 程序绑定。这使得它们更加通用。\n\n## 检查点\n\n1. 7.24 假设以下类组件存在：\n\
  \    * `BasePay` 类声明\n    * `Overtime` 类声明\n    * `BasePay` 成员函数\n    * `Overtime`\
  \ 成员函数\n2. 7.25 应该包含哪些文件？\n\n# 7.12 结构\n\n## 概念\n\nC++ 允许将一组变量组合进称为结构（structure）的单元中。结构是一种程序员定义的数据类型，可以存储许多数据。在过去，在面向对象编程变得常见之前，程序员通常使用这些结构将逻辑连接的数据分组到一个单个单元中。\n\
  \n结构的声明方式与类的声明方式相似，但有以下不同：\n\n* 使用 `struct` 关键字代替 `class` 关键字。\n* 虽然结构可以包含成员函数，但它们很少包含。因此通常结构声明只声明成员变量。\n\
  * 结构声明通常不包含访问说明符 `public` 或 `private`。\n* 与默认私私的类成员不同，结构的成员默认是公开（public）。程序员通常希望它们保持公开并简单地使用默认值。\n\
  \n这里是一个组合了五个存储员工数据的变量的结构声明示例。该特定结构名为 `Payroll`。注意它以大写字母开头。惯例是结构名和类名一样以大写字母开头。注意，与类声明一样，在大括号后必须有一个分号。\n\
  \n```cpp\nstruct Payroll\n{\n   int     empNumber;\n   string  name;\n   double\
  \  hours,\n           payRate,\n           grossPay;\n};\n```\n\n正如类声明在创建类对象之前不会实例化，结构声明也不会创建结构的实例。结构声明只是告诉编译器\
  \ `Payroll` 结构看起来是什么样。它本质上创建了一个名为 `Payroll` 的新数据类型。\n\n你定义 `Payroll` 结构变量的方式与定义任何变量一样，首先列出数据类型，然后是变量名。以下定义创建了\
  \ `Payroll` 结构变量。\n\n```cpp\nPayroll deptHead, foreman, associate;\n```\n\n每个都是\
  \ `Payroll` 结构的实例，都分配了自己的内存来存储其成员数据。注意，尽管这三个结构变量名称不同，但每个结构都包含同名的成员。图 7-6 阐明了这一点。\n\
  \n\n\n\n\n# 访问结构体成员\n\n结构体的成员访问方式与类的公共成员相同，使用点运算符（.）。然而，类的数据成员通常是私有的，必须通过函数进行访问。由于结构体的数据成员是公开的，因此可以直接访问并像普通变量一样使用它们。以下语句为我们创建的每个\
  \ `Payroll` 变量的 `empNumber` 成员赋值。\n\n```\ndeptHead.empNumber = 475;\nforeman.empNumber\
  \ = 897;\nassociate.empNumber = 729;\n```\n\n接下来的语句将显示 `deptHead` 所有成员的内容。\n\n```\n\
  cout << deptHead.empNumber << endl;\ncout << deptHead.name << endl;\ncout << deptHead.hours\
  \ << endl;\ncout << deptHead.payRate << endl;\ncout << deptHead.grossPay << endl;\n\
  ```\n\n程序 7-13 是一个使用 `Payroll` 结构体的完整程序。注意各个结构体成员如何在 `cin` 语句、`cout` 语句和数学运算中像普通变量一样被使用。\n\
  \n在 程序 7-13 中，变量 `employee` 在第 17 行定义为 `Payroll` 结构体的实例。随后，可以通过变量名通过点运算符访问它的五个数据成员。例如，在第\
  \ 22 行中，以下语句将一个值读入变量的 `empNumber` 成员中。\n\n```\ncin  >> employee.empNumber;     \
  \  // 正确\n```\n\n尝试通过结构体类型的名称访问此成员是错误的。\n\n```\ncin  >> Payroll.empNumber;     \
  \   // 错误！\n```\n\n# 显示和比较结构体变量\n\n在 程序 7-13 中，`employee` 结构体变量的每个成员都被单独显示。这是必要的，因为无法通过简单将整个变量传递给\
  \ `cout` 来显示结构体变量的所有内容。例如，以下语句不起作用。\n\n```\ncout << employee << endl;          \
  \     // 错误！\n```\n\n同样，虽然可以比较两个单独成员的内容，但不能对整个结构体执行比较操作。例如，如果 `employee1` 和 `employee2`\
  \ 都是 `Payroll` 结构体变量，这种比较会导致错误。\n\n```\nif (employee1 == employee2)            \
  \ // 错误！\n```\n\n然而，下面的比较是完全合。\n\n```\nif (employee1.hours == employee2.hours) //\
  \ 合法\n```\n\n# 初始化结构体\n\n结构体变量在定义时有两种初始化方式：使用初始化列表或使用构造函数。\n\n初始化结构体变量成员最简单的方法是使用初始化列表。初始化列表是用于初始化一组内存位置的值列表。列表中的项用逗号分隔，并用大括号括起来。假设，已经声明了以下\
  \ `Date` 结构体：\n\n```\nstruct Date\n{  int day,\n       month,\n       year;\n};\n\
  ```\n\n现在可以通过在变量名后跟随赋值运算符和初始化列表来定义并初始化 `Date` 变量，如下所示：\n\n```\nDate birthday = {23,\
  \ 8, 1983}; \n```\n\n该语句定义 `birthday` 为一个 `Date` 结构体变量。大括号内的值会按顺序分配给它的成员。因此，`birthday`\
  \ 的数据成员已如图 7-7 所示进行了初始化。\n\n# 图 7-7 使用数据初始化的生日对象\n\n![图表显示了生日 对象的成员及其初始化值。](img/FG_07_007.png)图\
  \ 7-7 完整替代文本\n\n也可以只初始化结构体变量的部分成员。例如，如果我们知道要存储的生日是 8 月 23 日，但不知道年份，可以写成：\n\n```\n\
  Date birthday = {23, 8};\n```\n\n需要注意的是，如果使用了初始化列表，列表中未指定的任何成员都将初始化为零。\n\n# 嵌套结构体\n\
  \n就像一个类的对象可以嵌套在另一个类中，一个结构体的实例也可以嵌套另一个结构体中。例如，考虑以下声明：\n\n```\nstruct Costs\n{\n \
  \  double wholesale;\n   double retail;\n};\n\nstruct Item\n{\n   string partNum;\n\
  \   string description;\n   Costs pricing;\n};\n```\n\n`Costs` 结构体有两个 `double` 成员：`wholesale`\
  \ 和 `retail`。`Item` 结构体有三个成员。前两个 `partNum` 和 `description` 是 `string` 对象。第三个 `pricing`\
  \ 是一个嵌套的 `Costs` 结构体。如果 `widget` 定义为 `Item` 结构体，图 7-8 说明了它的成员。\n\n它们的访问方式如下：\n\n\
  ```\nwidget.partnum = \"123A\";\nwidget.description = \"iron widget\";\nwidget.pricing.wholesale\
  \ = 100.0;\nwidget.pricing.retail = 150.0;\n```\n\n\n\n\n注意 `wholesale` 和 `retail`\
  \ 并不是 `widget` 的成员；而 `pricing` 才是。要访问 `wholesale` 和 `retail`，必须先访问 `widget` 的 `pricing`\
  \ 成员，然后由于它是一个 `Costs` 结构，就可以访问它的 `wholesale` 和 `retail` 成员。同样请注意，与所有结构一样，访问成员时必须使用\
  \ `member` 的名称而不是 `structure` 的名称。以下语句是不合法的。\n\n```\ncout << widget.retail;    \
  \        // 错误！\ncout << widget.Costs.wholesale;   // 错误！\n```\n\n当你决定是否使用嵌套结构时，请考虑各种成员之间的逻辑关系。结构将逻辑上属于同一类的条目打包在一起。通常情况下，结构的成员是描述某个对象的属性。在我们的示例中，对象是一个\
  \ `widget`，它的零件号、描述以及批发价和零售价就是它的属性。当某些属性相互相关并形成对象属性的逻辑子组时，将它们打包在一起并使用嵌套结构是有意义的。注意程序\
  \ 7-14 内部结构中属性的关联性，它使用了嵌套结构。\n\n# # 检查点\n\n1. 7.26 为一个名为 `Student` 的结构编写声明，用于存储关于学生的以下数据：\n\
  \    * ID (`int`)\n    * 入学年份 (`int`)\n    * GPA (`double`)\n\n    然后编写定义语句创建以下两个\
  \ `Student` 变量并使用初始化列表对其进行初始化。\n    * 变量 `s1` 应该有一个 ID 号 1234，入学年份 2008，GPA 为 3.41。\n\
  \    * 变量 `s2` 应该有一个 ID 号 5678，入学年份 2010。`GPA` 成员应保持未初始化。\n\n2. 7.27 为一个名为 `Account`\
  \ 的结构编写声明，用于存储储蓄账户的以下数据。包含一个构造函数，允许为所有四个成员传递数据值。\n    * 账号 `(string)`\n    * 账户余额\
  \ `(double)`\n    * 利率 `(double)`\n    * 平均月余额 (`double`)\n\n    现在为一个 `Account`\
  \ 变量编写一个定义语句，用以下数据初始化成员：\n    * 账号：ACZ42137\n    * 账户余额：$4512.59\n    * 利率：4%\n\
  \    * 平均月余额：$4217.07\n\n3. 7.28 下面的程序骨架在完成后将要求用户输入关于其最喜电影的以下信息：\n    * 电影名称\n \
  \   * 电影导演名称\n    * 电影年份\n\n    通过声明持有这些信息的结构、定义一个结构变量并编写所需的各个语句来完成程序。\n\n```cpp\n\
  #include <iostream>\n#include <string>\nusing namespace std;\n\n// 编写用于存储电影信息的结构声明。\n\
  \nint main()\n{\n   // 在处定义结构变量。\n\n   cout << \"Enter the following information\
  \ about your \"\n        << \" favorite movie.\\n\" << \"Name: \";\n   // 在处编写一条语句让用户输入电影名称。\n\
  \   // 将其存储在适当的结构成员中。\n\n   cout << \"Director: \";\n   // 在处编写一条语句让用户输入导演\n   //\
  \ 姓名。将其存储在适当的结构成员中。\n\n   cout << \"Year of Release: \";\n   // 在处编写一条语句让用户输入电影\n\
  \   // 发布年份。将其存储在适当的结构成员中。\n\n   cout << \"\\nHere is information on your favorite\
  \ movie:\\n\";\n   // 在处编写语句显示刚刚\n   // 输入到结构变量中的信息。\n   return 0;\n}\n```\n\n4.\
  \ 7.29 为一个名为 `Location` 的结构编写声明，带有以下三个 `double` 成员变量：`latitude`、`longitude` 和 `height`。\n\
  \n5. 7.30 为一个名为 `City` 的结构编写声明，它拥有成员 `cityName`（一个 `string`）和 `position`（一个上面定义的\
  \ `Location` 结构）。然后定义一个名为 `destination` 的变量，它是 `City` 结构的实例。\n\n6. 7.31 编写赋值语句，将以下信息存储在\
  \ `destination` 中。\n\n```text\ncity name    :   Tupelo\nlatitude     :   34.28 \
  \     // 北纬 34.28 度\nlongitude    :   −88.77     // 西经 88.77 度\nheight       : \
  \  361.0      // 海平面以上 361 英尺\n```\n\n# # 将结构传递给函数\n\n结构变量就像类对象一样，可以通过值、引用和常量引用传递给函数。默认情况下，它们通过值传递。这意味着会创建整个原始结构的副本并将其传递给函数。除非结构非常小，否则花费时间复制整个结构是不明智的，因此结构通常通过引用传递给函数。然而，这使得函数可以访问原始结构的成员，并允许其进行修改。如果你不想函数更改任何变量，则应将结构作为常量引用传递给它。\n\
  \n# # 从函数返回结构\n\n结构变量也可以从函数返回。在这种情况下，函数的返回类型是结构的名称。程序 7-15 可以被重写，允许 `getItemData`\
  \ 函数创建一个 `InvItem` 局部实例，将数据放入其成员中，然后传回 `main`，而不是从 `main` 接收。这是修改后的 `getItemData`\
  \ 函数的样子。\n\n```cpp\n/********************************\n *                      \
  \  getItemData                          \n * 此函数将用户输入的数据存储在局部 InvItem \n * 的成员中，然后返回它。\
  \  \n *********************************************/\n\nInvItem getItemData()  \
  \ \n{\n   InvItem item;          // 创建局部 InvItem 变量\n                          //\
  \ 以存储数据直到返回。\n   cout << \"Enter the part number: \";\n   cin >> item.partNum;\n\
  \   cout << \"Enter the part description: \";\n   cin.get();             // 跳过输入缓冲区中留下的\
  \ '\\n'。\n   getline(cin, item.description);\n   cout << \"Enter the quantity on\
  \ hand: \";\n   cin >> item.onHand;\n   cout << \"Enter the unit price: \";\n  \
  \ cin >> item.price;\n\n   return item;\n}\n```\n\n这是在 `main` 中调用它的方式。\n\n```cpp\n\
  part = getItemData();\n```\n\n此版本的程序 7-15 可以在书籍配套网站的第 7 章程序文件夹中作为 `pr7-15B.cpp`\
  \ 找到。\n\n# # 注意\n\n在第 6 章中，你学到 C++ 只允许从函数返回一个值。然而，类和结构提供了一种解决这一局限性的方法。尽管它们可能有多个成员，但类或结构的每个实例在技术上都是单个对象。通过将多个值封装在类或结构中，你可以从函数返回任意数量的值。\n\
  \n使用以下结构声明来回答本节的问题。\n\n\n\n\n\n```\nstruct Rectangle\n{\n   int length;\n   int\
  \ width;\n};\n```\n\n1. 7.32 编写一个函数，接受上面定义的 `Rectangle` 结构体作为参数，并在屏幕上显示该结构体的内容。\n\
  2. 7.33 编写一个函数，使用 `Rectangle` 结构体引用变量作为参数，并将用户的输入存储在结构体的成员中。\n3. 7.34 编写一个返回 `Rectangle`\
  \ 结构体的函数。该函数应该创建一个局部 `Rectangle` 变量，将用户的输入存储在它的成员中，然后将其返回。\n\n# 7.13 关于枚举数据类型的更多\n\
  \n## 概念\n\n枚举数据类型可以提高程序的可读性。\n\n在第 4 章中，你已经接触了枚举数据类型。正如你所记得的，这些是程序员定义的数据类型，由一组被称为枚举符（enumerators）的值组成，这些值表示整数常量。在本节中，我们将进一步探索它们的用法，并检查对它们可以做什么和不能做什么。\n\
  \n## 在一条语句中声明 `enum` 数据类型并定义变量\n\n以下代码使用两行来声明枚举数据类型并定义该类型的变量。\n\n```\nenum Car {\
  \ PORSCHE, FERRARI, JAGUAR };\nCar sportsCar;\n```\n\n然而，C++ 允许你在同一语句中声明枚举数据类型并定义一个或多个该类型的变量。因此，之前的代码可以这样写：\n\
  \n```\nenum Car { PORSCHE, FERRARI, JAGUAR } sportsCar;\n```\n\n以下语句声明了 `Car` 数据类型并定义了两个变量，`myCar`\
  \ 和 `yourCar`。\n\n```\nenum Car { PORSCHE, FERRARI, JAGUAR } myCar, yourCar;\n```\n\
  \n# 给 `enum` 变量赋值整数\n\n尽管枚举数据类型的枚举符在内存中是以整数形式存储的，但你不能直接给 `enum` 变量赋值整数。例如，假设我们有一个程序包含以下声明：\n\
  \n```\nenum Day { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY };\nDay today;\n\
  ```\n\n我们现在可以写下面的赋值语句：\n\n```\ntoday = THURSDAY;\n```\n\n然而，正如你在第 4 章中学到的，以下语句是非法的，如果你尝试编译它，它将产生错误消息。\n\
  \n```\ntoday = 3;  // 错误！ \n```\n\n在给 `enum` 变量赋值时，你应该使用有效的枚举符。然而，如果情况需要你在 `enum`\
  \ 变量中存储整数值，你可以通过将整数转换为 `enum` 数据类型来实现。这里是一个例子：\n\n```\ntoday = static_cast<Day>(3);\n\
  ```\n\n该语句产生的结果与以下代码相同：\n\n```\ntoday = THURSDAY;\n```\n\n# 给 `int` 变量赋值枚举符\n\n\
  虽然你不能直接给 `enum` 变量赋值整数，但你*可以*直接将枚举符赋值给整数变量。例如，以下代码将可以正常工作。\n\n```\nenum Day { MONDAY,\
  \ TUESDAY, WEDNESDAY, THURSDAY, FRIDAY };\nint today = THURSDAY;\nDay workday =\
  \ FRIDAY;\nint tomorrow = workday;\ncout << today << \"  \" << tomorrow << endl;\n\
  ```\n\n当这段代码运行时，它将显示 3 4。\n\n# 使用数学运算符更改 `enum` 变量的值\n\n尽管枚举符实际上是整数，且 `enum` 变量实际上持有整数值，但当你尝试对它们进行数学运算时，可能会遇到问题。例如，看下面的代码。\n\
  \n```\nDay day1, day2;    // 定义两个 Day 变量\nday1 = TUESDAY;    // 将 TUESDAY 赋值给 day1\n\
  day2 = day1 + 1;   // 错误！ 这不起作用\n```\n\n第三语句导致了问题，因为表达式 `day1 + 1` 产生整数值 2。赋值运算符接着尝试将整数值\
  \ 2 赋值给枚举变量 `day2`。由于之前讨论过的 C++ 无法隐式地将 `int` 转换为 `Day`，因此发生了错误。你可以通过像我们上面那样使用类型转换来显式地将结果转换为\
  \ `Day` 数据类型来修复此，所示：\n\n```\nday2 = static_cast<Day>(day1 + 1); // 这可以工作\n```\n\n\
  # 使用枚举符输出值\n\n正如你已经看到的，将枚举符发送到 `cout` 会导致枚举符的整数值被显示。例如，假设我们使用之前描述的 `Day` 类型，以下语句显示\
  \ 0。\n\n```\ncout << MONDAY << endl;\n```\n\n如果你想使用枚举符来显示诸如“Monday”之类的字符串，你必须编写产生字符串的代码。例如，如果\
  \ `workDay` 是 `Day` 类型，下面的 `switch` 语句将显示名称。\n\n```cpp\nswitch (workDay)\n{\n  case\
  \ MONDAY: cout << \"Monday\"; break;\n  case TUESDAY: cout << \"Tuesday\"; break;\n\
  \  case WEDNESDAY: cout << \"Wednesday\"; break;\n  case THURSDAY: cout << \"Thursday\"\
  ; break;\n  case FRIDAY: cout << \"Friday\"; break;\n}\n```\n\n# 使用枚举符控制循环\n\n由于枚举符在内存中存储为整数，你可以使用它们来控制循环。然而，如上所述，你不能直接使用\
  \ `++` 运算符。以下代码不起作用。\n\n```cpp\nfor (Day day = MONDAY; day < FRIDAY; day++) // 错误\n\
  ```\n\n我们可以通过让循环变量变为 `int` 来解决这个问题。然后你可以这样写循环：\n\n```cpp\nfor (int day = MONDAY;\
  \ day < FRIDAY; day++)\n```\n\n# C++ 中的强类型枚举\n\nC++ 不允许在同一作用域内有重名的枚举符。也就是说，相同的枚举名不能是两个数据类型的成员。然而，C++11\
  \ 引入了一种新的枚举类型，被称为强类型枚举（也称为 *enum class*），以绕过这一限制。这里是强类型枚举的两个例子：\n\n```\nenum class\
  \ Presidents { MCKINLEY, ROOSEVELT, TAFT };\nenum class VicePresidents { ROOSEVELT,\
  \ FAIRBANKS, SHERMAN };\n```\n\n这些语句声明了两个强类型枚举 `Presidents` 和 `VicePresidents`。注意它们看起来像普通的\
  \ `enum` 声明，只是 `enum` 后面出现了 `class`。尽管两个枚举包含相同的枚举符 `ROOSEVELT`，这些声明编译时都不会报错。\n\n\
  然而，当你使用强类型枚举数据类型时，必须为引用的每个枚举符加上它所属的枚举名称，以及 `::` 运算符。这里有三个例子：\n\n```\nPresidents\
  \ prez = Presidents::ROOSEVELT;\nVicePresidents vp1 = VicePresidents::ROOSEVELT;\n\
  VicePresidents vp2 = VicePresidents::SHERMAN;\n```\n\n第一个语句定义了一个名为 `prez` 的 `Presidents`\
  \ 变量，并用 `Presidents::ROOSEVELT` 枚符初始化它。第二个语句定义了一个名为 `vp1` 的 `VicePresidents` 变量，并用\
  \ `VicePresidents::ROOSEVELT` 枚符初始化它。第三个语句定义了一个名为 `vp2` 的 `VicePresidents` 变量，并用\
  \ `VicePresidents::SHERMAN` 枚符初始化它。注意，尽管枚举符 `SHERMAN` 只是其中一个数据类型的成员，但仍然必须以它所属的枚举名为前缀。\n\
  \n\n\n\n\n这是一个 `if` 语句的示例，它将变量 `prez` 与枚举值进行比较：\n\n```cpp\nif (prez == Presidents::ROOSEVELT)\n\
  \    cout << \"Roosevelt is president!\\n\";\n```\n\n强类型枚举值像普通枚举值一样存储为整数。然而，如果你想获取强类型枚举的底层整数值，必须使用类型转换运算符。以下示例了将\
  \ `Presidents::ROOSEVELT` 枚举的底层整数值赋值给变量 `x`：\n\n```cpp\nint x = static_cast<int>(Presidents::ROOSEVELT);\n\
  ```\n\n这是另一个示例。它显示了 `Presidents::TAFT` 和 `Presidents::MCKINLEY` 枚举的整数值：\n\n```cpp\n\
  cout << static_cast<int>(Presidents::ROOSEVELT) << \"  \" \n     << static_cast<int>(Presidents::TAFT)\
  \ << endl;\n```\n\n当你声明一个强类型 `enum` 时，可以选择指定任何整数数据类型作为底层类型。你只需要在 `enum` 名称后写一个冒号\
  \ `(:)`，然后跟上所需的数据类型。例如，接下来的语句声明了一个使用 `char` 数据类型作为枚举类型的 `enum`：\n\n```cpp\nenum\
  \ class Day : char { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY };\n```\n\n以下语句是另一个示例。该语句声明了一个名为\
  \ `Water` 的 `enum`，它使用 `unsigned` 作为枚举的数据类型。此外，还给枚举分配了值。\n\n```cpp\nenum class Water\
  \ : unsigned { FREEZING = 32, BOILING = 212 };\n```\n\n`Program 7-16` 展示了强类型枚举数据类型的使用。\n\
  \n# 7.14 Home Software 公司 OOP 案例研究\n\n你是 Home Software 公司的一名程序员，负责开发一个模拟银行账户基本运作的类。该类应该执行以下任务：\n\
  \n* 保存账户余额。\n* 保存账户上执行的交易次数。\n* 允许向账户存款。\n* 允许从账户中取款。\n* 计算期间的利息。\n* 随时报告当前账户余额。\n\
  * 随时报告当前交易次数。\n\n# 私有成员变量\n\n`Table 7-2` 列出了类所需的私有成员变量。\n\n# 表 7-2 Account 类的私有成员变量\n\
  \n| 变量 | 描述 |\n| --- | --- |\n| `balance` | 一个存储当前账户余额的 `double` 类型 |\n| `intRate`\
  \ | 一个存储该期间利率的 `double` 类型 |\n| `interest` | 一个存储本期所得利息的 `double` 类型 |\n| `transactions`\
  \ | 一个存储当前交易次数的整数 |\n\n# 公有成员函数\n\n`Table 7-3` 列出了类中的公共成员函数。\n\n# 表 7-3 Account\
  \ 类的公共成员函数\n\n| 函数 | 描述 |\n| --- | --- |\n| 构造函数 | 接收参数并将其初始存储在 `balance` 和 `intRate`\
  \ 成员中。余额的默认值为 0，利率的默认值为 0.045。 |\n| `makeDeposit` | 接收一个 `double` 类型参数作为存款金额。该参数被加到\
  \ `balance` 中。 |\n| `withdraw` | 接收一个 `double` 类型参数作为取款金额。除非取款金额大于余额，否则从余额中减去该值。如果发生这种情况，函数将报告错误。\
  \ |\n| `calcInterest` | 不接收任何参数。此函数计算当前期间的利息金额，将此值存储在 `interest` 成员中，然后将其加到 `balance`\
  \ 成员中。 |\n| `getBalance` | 返回当前余额（存储在 `balance` 成员中）。 |\n| `getInterest` | 返回本期所得利息（存储在\
  \ `interest` 成员中）。 |\n| `getTransactions` | 返回本期的交易次数（存储在 `transactions` 成员中）。 |\n\
  \n# 类声明\n\n下面的列表显示了类的声明。\n\n# `Account.h` 的内容\n\n```cpp\n1 // Account.h 是 Account\
  \ 类的规范文件。\n2 class Account\n3 {\n4  private:\n5    double balance;\n6    double\
  \ intRate;\n7    double interest;\n8    int transactions;\n9  public:\n10\n11 //\
  \ 构造函数\n12    Account(double rate = 0.045, double bal = 0.0)\n13    {balance = bal;\
  \ intRate = rate;\n14       interest = 0.0; transactions = 0;\n15    }\n16\n17 \
  \   void makeDeposit(double amount)\n18    {balance += amount;\n19       transactions++;\n\
  20    }\n21\n22    bool withdraw(double amount); // 定义在 account.cpp 中\n23\n24  \
  \  void calcInterest()\n25    {interest = balance * intRate;\n26       balance +=\
  \ interest;\n27    }\n28\n29    double getBalance()\n30    {return balance;}\n31\
  \    }\n32\n33    double getInterest()\n34    {return interest;}\n35    }\n36\n\
  37    int getTransactions()\n38    {return transactions;}\n39 };\n```\n\n# `withdraw`\
  \ 成员函数\n\n类声明中未定义的唯一成员函数是 `withdraw`。该函数的目的是从 `balance` 成员中减去取款金额。然而，如果取款金额大于余额，则不进行取款。如果执行了取款，函数返回\
  \ true；如果账户余额则返回 false。\n\n# `Account.cpp` 的内容\n\n```cpp\n1 // Account.cpp 是 Account\
  \ 类的函数文件。\n2 #include \"Account.h\"\n3 \n4 bool Account::withdraw(double amount)\n\
  5 {\n6    if (balance < amount)\n7       return false;   // 账户余额不足\n8    else\n\
  9    {\n10       balance -= amount;\n11       transactions++;\n12       return true;\n\
  13   }\n14\n```\n\n# 类接口\n\n`balance`、`intRate`、`interest` 和 `transactions` 成员变量是私有的，因此对类外部隐藏。这是因为直接访问这些变量的程序员可能会犯以下错误：\n\
  \n* 存款或取款时可能增加 `transactions` 成员。\n* 取款金额可能超过账户余额。这将导致 `balance` 成员为负值。\n* 可能计算了利率并调整了\
  \ `balance` 成员，但利息金额可能记录在 `intRate` 成员中。\n* 可能会使用错误的利率。\n\n由于可能出现这些错误，类包含了公共成员函数，以确保在操作账户时采取正确的步骤。\n\
  \n# 实现类\n\n`Program 7-17` 展示了 `Account` 类的实现。它提供了一个菜单用于显示储蓄账户的余额、交易次数和收益利息。它还允许用户向账户存款、从账户取款以及计算本期所得利息。该程序所需的文件位于书籍配套网站的第\
  \ 7 章程序文件夹中。\n\n\n\n\n到目前为止，你已经学习了类的基本编写、从类创建对象以及使用对象来执行操作。这些知识对于创建面向对象的应用程序是必要的，但它并不是设计应用程序的第一步。首先，程序员或分析师必须仔细分析要解决的问题，以准确确定程序必须能够做什么。在面向对象编程（OOP）术语中，程序开发的这一阶段被称为`面向对象分析阶段`。在此期间，将确定需要哪些类。\n\
  \n面向对象分析的过程通常包括以下步骤：\n\n1.  识别程序中将使用的类和对象。\n2.  为每个类定义属性。\n3.  为每个类定义行为。\n4.  定义类与类之间的关系。\n\
  \n让我们更仔细地观察每一个步骤。\n\n# 1. 识别类和对象\n\n记住，类是一个由数据和对数据执行操作的过程组成的包。为了确定出现在程序中的类，程序员应该考虑主要的元素元素，并决定每个类需要哪些过程或动作。例如，考虑一家使用面向对象编程的程序来输入客户订单的餐厅。客户订单是一份包含菜单项及其相应价格列表。餐厅使用此列表向客户收费，因此可以创建一个类来对其进行建模。此外，餐厅的菜单有几个主菜、前菜、配菜和饮料可供选择。也可以设计一个类来表示菜单项。\n\
  \n类可以很容易地设计以模拟现实世界的对象，例如客户订单和餐厅菜单项。以下是其他可能作为程序中类候选的项类型：\n\n*   用户界面组件，如窗口、菜单和对话框\n\
  *   输入/输出设备，如键盘、鼠标、显示器和打印机\n*   物理对象，如车辆、机器或制造产品\n*   记录项目，如客户历史记录和薪资记录\n*   人类扮演的角色（员工、客户、教师、学生等）\n\
  \n# 2. 定义每个类的属性\n\n类的`attributes`（属性）是用于描述从类实例化的对象的数据元素。它们是对象在程序中正常运行所需的值。使用餐厅的例子，这里是一个可能的`menuItem`类说明的开头。\n\
  \n```\nClass name: MenuItem\nAttributes: itemName\n               price\n      \
  \         category      // 1 = 前菜, 2 = 沙拉,   3 = 主菜\n                          \
  \   // 4 = 配菜, 5 = 甜点, 6 = 饮料\n```\n\n这里是一个可能的`CustomerOrder`类说明的开头。\n\n```\nClass\
  \ name: CustomerOrder\nAttributes: orderNumber\n               tableNumber\n   \
  \            serverNumber\n               date\n               items      // MenuItem\
  \ 对象的列表\n               totalPrice\n               tip\n```\n\n# 3. 定义每个类的行为\n\n\
  一旦定义了类的属性，程序员必须识别每个类必须能够执行的活动或`behaviors`（行为）。例如，`MenuItem`类应该能够执行的一些活动包括：\n\n*\
  \   更改价格\n*   显示价格\n\n`CustomerOrder`类应该能够执行的某些活动包括：\n\n*   接受新订单的信息\n*   向现有订单中添加项目\n\
  *   返回之前存储的订单的任何信息\n*   计算订单上所有项目的总价格\n*   为厨房打印已点项目列表\n*   为顾客打印账单\n\n在 C++ 中，类的行为是它的`member\
  \ functions`（成员函数）。\n\n# 4. 定义类之间的关系\n\n我们面向对象分析阶段的最后一步是定义程序中类与类之间之间存在的关系。可能的关系可以正式表述为：\n\
  \n*   访问（Access）\n*   所有权（组合，Ownership (Composition)）\n*   继承（Inheritance）\n\n非正式地，这三种关系可以描述为：\n\
  \n*   使用（Uses-a）\n*   拥有（Has-a）\n*   是一个（Is-a）\n\n第一种关系“访问”，允许一个对象修改另一个对象的属性。通常情况下，一个对象具有该对象之外的程序部分无法访问的属性。这些被称为私有属性（private\
  \ attributes）。两个对象之间的访问关系意味着一个对象将访问另一个对象的私有属性。当这种关系存在时，可以说一个对象`uses`（使用）另一个对象。\n\
  \n第二种关系“所有权”，意味着一个对象拥有另一个对象作为其成员之一。例如，在我们的餐厅示例中，`CustomerOrder`类有一个`MenuItem`对象的列表作为它的属性之一。在\
  \ OOP 术语中，这种关系也被称为`composition`（组合）。\n\n第三种关系是继承。有时一个类基于另一个类。这意味着一个类是另一个类的特例情况。例如，考虑一个使用代表汽车、卡车和喷气式类的程序。虽然现实世界中的这三类类非常不同，但它们有许多共同特征：它们都是交通工具，并且都携带一定数量的乘客。因此，这三个类中的每一个都可以基于一个`Vehicle`类，该类具有它们共同拥有的属性和行为。这在图\
  \ 7-9 中所示。\n\n# 图 7-9 基类和三个派生类\n\n![一张树图说明了一个基类和三个派生类。](img/FG_07_009.png)图 7-9\
  \ 基类和三个派生类的完整替代文本\n\n在 OOP 术语中，`Vehicle`类是`base class`（基类），`Car`、`Truck`和`Jet Plane`类是`derived`（派生）类。`Vehicle`类的的所有属性行为都被`Car`、`Truck`和`Jet\
  \ Plane`类继承。这种关系意味着汽车`is a`车辆，卡车`is a`车辆，而喷气式飞机`is a`车辆。\n\n除了继承基类的属性和行为外，派生类还额外添加了它们自己的。例如，`Car`类可能具有属性和行为，用于设置和指示它是轿车还是跑跑以及它的引擎类型。`Truck`类可能具有属性和行为，用于设置和指示它可以承载的最大重量以及在两次加油之间可以行驶的英里。`Jet\
  \ Plane`类可能具有属性和行为，用于设置和指示它的高度和航向。这些额外的派生类的组件使得它们更具特殊性。\n\n类之间的这三种关系——`访问`、`所有权`和`继承`将在第\
  \ 11 章中进一步讨论。\n\n一旦对企业及其操作进行了分析，就可以对每个类进行设计，并开发一组程序来自动执行某些操作。\n\n# 寻找类\n\n让我们进一步仔细观察分析过程中的第一步：识别类。多年来，软件专业人员开发了许多此类技术，但它们都涉及识别问题中不同的现实对象类型，以便为其创建类。一种简单且流行的技术涉及以下步骤：\n\
  \n1.  获取问题领域的书面描述。\n2.  识别描述中所有的名词（包括代词和名词短语）。每一个都是潜在的类。\n3.  精炼列表，只包含与问题相关的类。\n\
  \n\n\n\n`problem domain`（问题领域）是与问题相关的现实世界对象、实体和主要事件的集合。如果你理解你正在尝试解决的问题本质，就可以自己编写一份问题领域的描述。如果你不完全理解它，应该让专家来为你编写描述。\n\
  \n例如，假设我们正在编写一个应用程序，Joe 汽车商店的经理将用它为客户打印服务报价单。以下可能是由一位专家（也许 Joe 本人）编写的描述：\n\nJoe\
  \ 汽车商店提供外国汽车服务，并专门维修奔驰、保时捷和宝马制造的汽车。当客户把车开到店店里时，经理获取客户的名字、地址和电话号码。然后，经理确定汽车的品牌、型号和年份，并给客户提供服务报价单。服务报价单显示了预估零件费用、预估人工费用、销售税以及总预估费用。\n\
  \n问题领域的描述应包含以下任何内容：\n\n* 物理对象，如车辆、机器或产品\n* 人员的任何角色，例如经理、员工、客户、老师或学生\n* 业务事件的结果，例如客户订单，或者在本例中为服务报价单\n\
  * 记录项，如客户历史记录和薪资记录\n\n# 识别所有名词\n\n下一步是识别所有的名词和名词短语。（如果描述中包含代词，也把它们包含进来。）再次查看之前的问题领域描述。这次名词和名词短语以粗粗显示。\n\
  \n> `Joe’s Automotive Shop` 提供 `foreign cars` 服务，并专门维修由 `Mercedes, Porsche,` 和 `BMW`\
  \ 制造的 `cars`。当 `customer` 把 `car` 带到 `shop,` 时，`manager` 获取了 `customer’s name, address,`\
  \ 和 `telephone number`。`manager` 然后确定 `car` 的 `make, model,` 和 `year`，并给 `customer`\
  \ 一份 `service quote.`。`service quote` 显示了 `estimated parts charges, estimated labor\
  \ charges, sales tax,` 以及 `total estimated charges.`。\n\n注意，有些名词是重复的。以下列表列出了所有名词，且不重复任何项。\n\
  \n| address | foreign cars | Porsche |\n| BMW | Joe’s Automotive Shop | sales tax\
  \ |\n| car | make | service quote |\n| cars | manager | shop |\n| customer | Mercedes\
  \ | telephone number |\n| estimated labor charges | model | total estimated charges\
  \ |\n| estimated parts charges | name | year |\n\n# 精炼名词列表\n\n出现在问题描述中的名词仅仅是成为类的候选者。可能没有必要为它们中的每一个都创建类。下一步是精炼列表，只包含解决当前特定问题必需的类。以下是名词从潜在类列表中删除的常见原因。\n\
  \n## 某些名词的含义实际上相同\n\n在这个示例中，以下名词组指代的是同一个东西：\n\n* `cars` 和 `foreign cars` 都指汽车的通用概念。\n\
  * `Joe’s Automotive Shop` 和 `shop` 都指同一家商店。\n\n我们可以为这些中的每组项确定一个单一的类。在这个示例中，我们任意地从列表中删除\
  \ `foreign cars` 并使用单词 `cars`。同样，我们将从列表中删除 `Joe’s Automotive Shop` 并使用单词 `shop`。更新后的潜在类列表如下：\n\
  \n| address | ~~foreign cars~~ | Porsche |\n| BMW | ~~Joe’s Automotive Shop~~ |\
  \ sales tax |\n| car | make | service quote |\n| cars | manager | shop |\n| customer\
  \ | Mercedes | telephone number |\n| estimated labor charges | model | total estimated\
  \ charges |\n| estimated parts charges | name | year |\n\n## 某些名词可能代表我们在解决问题时不需要关心的项目\n\
  \n快速回顾问题描述可以提醒我们应用程序应该做什么：打印服务报价单。为了做到这一点，我们列出的潜在类中有两个是不需要的。\n\n* 我们可以从列表中划掉 `shop`，因为我们的应用程序只需要关注单份服务报价单。它不需要处理或确定任何公司范围内的信息。如果问题描述要求我们保留所有服务报价单的合计（总计），那么为商店创建一个类就是合理的。\n\
  * 我们也不需要为 `manager` 创建一个类，因为问题陈述没有要求我们处理任何关于经理的信息。如果有多个商店经理，且问题描述要求我们记录是哪位经理写了每份服务报价单，那么为经理创建一个类就是合理的。\n\
  \n此时，更新的潜在类列表为：\n\n| address | ~~foreign cars~~ | Porsche |\n| BMW | ~~Joe’s Automotive\
  \ Shop~~ | sales tax |\n| car | make | service quote |\n| cars | ~~manager~~ | ~~shop~~\
  \ |\n| Customer | Mercedes | telephone number |\n| estimated labor charges | model\
  \ | total estimated charges |\n| estimated parts charges | name | year |\n\n## 某些名词可能代表对象，而不是类\n\
  \n我们可以排除 `Mercedes`、`Porsche` 和 `BMW` 作为类，因为在这个示例中，它们都代表特定的汽车，可以被视为单个 `cars` 类的实例。我们也可以从列表中删除\
  \ `car` 这个词，因为在描述中，它指的是客户带到店里的特定汽车。因此，它也会代表 `cars` 类的的一个实例。此时，更新的潜在类列表为：\n\n| address\
  \ | ~~foreign cars~~ | ~~Porsche~~ |\n| ~~BMW~~ | ~~Joe’s Automotive Shop~~ | sales\
  \ tax |\n| car | make | service quote |\n| cars | ~~manager~~ | ~~shop~~ |\n| customer\
  \ | ~~Mercedes~~ | telephone number |\n| estimated labor charges | model | total\
  \ estimated charges |\n| estimated parts charges | name | year |\n\n## 某些名词可能代表可以存储在变量中的简单值，不需要类\n\
  \n记住，类包含属性和成员函数。属性是存储在类对象中的相关项目，定义了它的状态。成员函数是类对象可以执行的操作或行为。如果一个名词代表的类型没有任何可识别的属性或成员函数，那么它可能从列表中删除。为了帮助判断一个名词是否代表具有属性和成员函数的项，可以就它提出以下问题：\n\
  \n* 你会使用一组相关值来表示该项目的状态吗？\n* 该项目是否有任何明显的操作需要执行？\n\n如果这两个问题的答案都是“否”，那么这个名词可能代表一个可以存储在简单变量中的值。如果我们对列表中剩余的每个名词应用此测试，我们可以得出以下项可能不是类：`address`、`estimated\
  \ labor charges`、`estimated parts charges`、`make`、`model`、`name`、`sales tax`、`telephone\
  \ number`、`total estimated charges` 和 `year`。这些都是存储在变量中的简单字符串或数值。\n\n这里是更新后的潜在类列表：\n\
  \n| ~~address~~ | ~~foreign cars~~ | ~~Porsche~~ |\n| ~~BMW~~ | ~~Joe’s Automotive\
  \ Shop~~ | ~~sales tax~~ |\n| ~~car~~ | ~~make~~ | service quote |\n| cars | ~~manager~~\
  \ | ~~shop~~ |\n| customer | ~~Mercedes~~ | ~~telephone number~~ |\n| ~~estimated\
  \ labor charges~~ | ~~model~~ | ~~total estimated charges~~ |\n| ~~estimated parts\
  \ charges~~ | ~~name~~ | ~~year~~ |\n\n正如你从列表中看到的，除了 `cars`、`customer` 和 `service\
  \ quote` 之外，我们删除了所有内容。这意味着在我们的应用程序中，我们需要表示汽车、客户和报价报价单的类。最终，我们将编写一个 `Car` 类、一个 `Customer`\
  \ 类和一个 `ServiceQuote` 类。\n\n\n\n\n\n# 识别类的职责\n\n一旦确定了类，下一个任务就是确定每个类的职责。类的 `responsibilities`（职责）包括：\n\
  \n*   类负责知道的内容\n*   类类负责执行的动作\n\n当你确定了一个类负责知道的内容时，你就确定了类的属性（attributes）。同样，当你确定了一个类负责执行的动作时，你就确定了它的成员函数（member\
  \ functions）。\n\n提问这类问题：“在这个问题的背景下，类必须知道什么？类必须做什么？”通常很有帮助。寻找答案的第一个地方是问题领域的描述。类必须知道和知道的很多事情都会在其中被提到。然而，某些类的职责可能没有直接在问题领域中提到，因此通常需要额外的分析。让我们把这种方法应用于我们之前从问题领域中识别出的类。\n\
  \n# `Customer` 类\n\n在我们问题领域的背景下，`Customer` 类的任何对象必须知道什么？描述中提到了以下项目，它们都是客户的属性：\n\n\
  *   客户的名字\n*   客户的地址\n*   客户的电话号码\n\n这些都可以表示为字符串并存储在类的成员变量中的值。`Customer` 类还可能知道许多其他事情。在这一阶段可以犯的错误是识别了太多对象负责知道的事情。例如，在某些应用程序中，`Customer`\
  \ 类可能知道客户的电子邮件地址。然而，这个特定的问题领域并没有提到客户的电子邮件地址被用于任何用途，因此知道它并不是该类的职责，我们不应该将其包含为属性。\n\
  \n现在让我们识别类的成员函数。在我们问题领域的背景下，`Customer` 类必须做什么？唯一而见的动作是：\n\n*   创建一个 `Customer` 类的对象。\n\
  *   设置和获取客户的名字。\n*   设置和获取客户的地址。\n*   设置和获取客户的电话号码。\n\n从这个列表中可以看出，`Customer` 类需要一个构造函数，以及每个属性的访问器函数（accessors）和修改器函数（mutators）。\n\
  \n图 7-10 显示了 `Customer` 类的 UML 类图。注意该图看起来像一个分三部分的简单矩形。顶部部分包含类的名称。中间部分列出类的属性，即它的成员变量。底部列出它的成员函数。每个属性左侧的减号表示它是私有的（private）。每个函数左侧的加号表示它是公有的（public）。每个属性名后面跟着一个冒号和数据类型。每个函数名后面跟着一对括号。如果函数接受任何参数，其参数将列在括号内，并带有每个参数的数据类型。括号后面是一个冒号，然后是函数的返回类型。\n\
  \n# 图 7-10 Customer 类的 UML 图\n\n![一张“UML”图显示了一个水平分为 3 部分的矩形。](img/FG_07_010.png)\n\
  图 7-10 Customer 类的 UML 图完整备用文本\n\n## Note\n\n关于 UML 类图的更多信息可以在此书辅助网站 [pearsonhighered.com/gaddis](http://pearsonhighered.com/gaddis)\
  \ 上的附录 F](#fileP70010160890000000000000000012A58.xhtml_P70010160890000000000000000012A58)\
  \ 中找到。\n\n# `Car` 类\n\n在我们问题领域的背景下，`Car` 类的对象必须知道什么？以下项目都是汽车的属性，并在问题领域中提到：\n\n*\
  \   汽车的品牌\n*   汽车的型号\n*   汽车的年份\n\n现在让我们识别类的成员函数。在我们问题领域的背景下，`Car` 类必须做什么？再次，唯一明显的动作是我们在大多数类中找到的标准成员函数：构造函数、访问器和修改器。具体动作如下：\n\
  \n*   创建一个 `Car` 类的类的对象。\n*   设置和获取汽车的品牌。\n*   设置和获取汽车的型号。\n*   设置和获取汽车的年份。\n\n\
  图 7-11 显示了此时 `Car` 类的 UML 类图。\n\n# 图 7-11 Car 类的 UML 图\n\n![一张“UML”图显示了 Car 类。](img/FG_07_012.png)\n\
  图 7-11 Car 类的 UML 图完整备用文本\n\n# `ServiceQuote` 类\n\n在我们问题领域的背景下，`ServiceQuote` 类的对象必须知道什么？问题领域提到：\n\
  \n*   预估费用\n*   预估工费\n*   销售税\n*   总预估费用\n\n仔细思考会发现，这些项目中的两个是计算结果：销售税和总预估费用。为了避免持有过期数据的风险，我们不会将这些值存储在成员变量中。相反，我们将提供计算这些值的函数。我们需要的其他成员函数是构造函数以及针对预估费用和估工费的访问器和修改器。\n\
  \n图 7-12 显示了 `ServiceQuote` 类的 UML 类图。\n\n# 图 7-12 ServiceQuote 类的 UML 图\n\n![一张“UML”图显示了一个水平分为\
  \ 3 部分的矩形。](img/FG_07_012.png)\n图 7-12 ServiceQuote 类的 UML 图完整备用文本\n\n# 这仅仅是开始\n\
  \n你应该把我们在本节中讨论的过程仅仅视为起点。重要的是，设计面向面向的应用程序是一个迭代过程。你可能需要多次尝试才能识别你所需的所有类，并确定它们的所有职责。随着设计过程的展开，你将对问题有更深层次的理解，从而会发现改进设计的方法。\n\
  \n# 对象重用性\n\n我们提到了面向对象编程所提供的许多优势。另一个优势是对象重用性。类不是一个独立的程序。它是为需要服务的程序创建对象的机制。理想情况下，为一个程序创建的类可以做得足够通用，以便供其他程序使用。例如，`Customer`\
  \ 类可以被设计用于许多具有客户的应用程序。`Car` 类可以被设计用于许多涉及车辆的程序。\n\n# 面向对象编程与面向对象的编程\n\n虽然类和对象是面向对象编程的基础，但仅靠它们本身不足以构成真正的面向对象编程。使用它们可能更准确地称为面向对象的编程。当我们增加定义不同对象类之间关系的能力、从其他类创建对象的类的能力（继承），以及根据调用成员函数的对象来确定成员函数的行为（多态）时，它就变成了真正的面向对象编程。你将在书后的部分学习这些高级的面向对象编程特性。\n\
  \n## Checkpoint\n\n1. 7.35 什么是问题领域？\n\n\n\n\n\n## 2. 7.36 在设计面向对象的应用程序时，谁应该编写问题域的描述？\n\
  \n## 3. 7.37 如何在问题域描述中识别潜在的类？\n\n## 4. 7.38 为了确定一个类的职责，你应该问哪两个问题？\n\n## 5. 7.39\
  \ 查看以下关于一个问题域的描述：\n\n一位医生在她的诊所看病人。当患者来到诊所时，医生会对患者执行一项或多项操作。执行的每项操作都有描述和标准费用。当患者离开时，他们会收到一份账单，上面显示他们的姓名和地址，以及执行过的操作和这些操作的总费用。\n\
  \n假设你正在创建一个应用程序来生成一份可以打印并交给患者的账单。\n\n1. 识别该问题域中所有潜在的类。\n2. 精炼列表，只包含该问题所需的的一个类或多个类。\n\
  3. 识别你在步骤 B 中识别出的类或类类的职责。\n\n## 7.16 屏幕控制\n\n## 概念\n\n操作系统函数允许你控制输出在控制台屏幕上的显示方式。\n\
  \n### 在屏幕上定位光标\n\n在[第 5 章]的“整合一切”部分中，你学习了 C++ 编译器提供了调用操作系统函数的特殊库。到目前为止，在[第 5 章]和[第\
  \ 6 章]中，我们使用了 Windows 的 `SetConsoleTextAttribute` 函数来彩色显示屏幕输出。现在我们将查看用于在屏幕上定位光标的\
  \ Windows 操作系统函数。该函数是 `SetConsoleCursorPosition`。\n\n### 注意\n\n回想[第 5 章]，操作系统是针对特定操作系统定制的。因此，使用它们的程序只会在编写它们时所在的系统上运行。这里描述的函数适用于\
  \ Windows 2000 及更高版本的操作系统。如果你使用的是 Linux 或 Mac OS，你的老师可能会为你提供在这些系统上运行的类似函数。\n\n到目前为止，你创建的所有程序都从屏幕的第一行开始显示输出。每当用户按下\
  \ [Enter] 键或程序输出 `endl` 或 `\"\\n\"` 时，输出就会逐行向下移动。但如果你在屏幕的第五行写内容并想回到第二行呢？或者，你想在屏幕正中央显示某些内容呢？在\
  \ Windows 系统上，你可以通过使用 `SetConsoleCursorPosition` 函数在写入输出之前将光标移动到所需位置。\n\n要使用此函数，你需要执行在[第\
  \ 5 章]和[第 6 章]中使用颜色时所做的同样两件事。你必须：\n\n* 在程序中 `#include <windows.h>`。\n* 通过在程序中包含以下定义，创建一个标准输出屏幕的*句柄*（handle）。\n\
  \n```cpp\nHANDLE screen = GetStdHandle(STD_OUTPUT_HANDLE);\n```\n\n典型的文本屏幕有 25 行，每行有\
  \ 80 个打印位置。这些位置中的每一个被称为一个*单元格*（cell）。*单元格*是一个可以显示单个字符的小块，通过它的行号和在行行上的位置来标识。行范围从\
  \ 0 到 24，0 是屏幕的顶端行。每行的打印位置（通常称为列）范围从 0 到 79，0 位于最左侧。单元格的行和列确定了它在屏幕上的位置，被称为*坐标*（coordinates）。\n\
  \n要将光标放在特定的屏幕单元格中，你必须通过设置 Windows 中已定义的 `COORD` 结构体中的两个变量来指定其单元格坐标。该结构体有两个名为 `X`\
  \ 和 `Y` 的成员变量，其中 `X` 保存列号，`Y` 保存行号。该结构如下所示。\n\n```cpp\nstruct COORD\n{\n   short\
  \ int X;  // 列位置\n   short int Y;  // 行位置\n};\n```\n\n以下是使用方法。以下代码段在标准输出屏幕上居中写入\
  \ `Hello` 单词。\n\n```cpp\nHANDLE screen = GetStdHandle(STD_OUTPUT_HANDLE);\nCOORD\
  \ position;    // position 是一个 COORD 结构体\nposition.X = 38;   // 设置靠近中心的列\nposition.Y\
  \ = 11;   // 设置靠近中心的行\n                   // 将光标放在那里，然后打印\nSetConsoleCursorPosition(screen,\
  \ position);\ncout << \"Hello\" << endl;\n```\n\n### 注意\n\n当你设置屏幕位置时，必须在程序在该处写入的所有输出后跟一个\
  \ `endl`。这是为了确保输出实际上显示在此处，这是必要的。如果不使用 `endl`，输出可能会被缓冲，并在光标位置改变后很晚才写入屏幕。在输出后紧跟换行符\
  \ `'\\n'` 是不起作用的，因为它不会刷新屏幕。\n\n[程序 7-18] 将光标定位以在中心附近显示一组框。注意它使用了在[第 5 章]中见过的 `Sleep`\
  \ 函数。它会暂停程序，以免操作对用户来说发生太快。传递给它的参数告诉它应该暂停多少毫秒。*毫秒*是秒的千分之一。例如，为了暂停半秒，以下调用将有效：\n\n\
  ```cpp\nSleep(500);\n```\n\n[程序 7-18] 使用 `Sleep(750)` 在每个框显示后暂停 3/4 秒。\n\n### 创建屏幕输入表单\n\
  \n[程序 7-18] 运行很有趣，但[程序 7-19] 展示了在屏幕上定位光标更实用的应用。与其一次提示用户输入一系列条目，我们可以设计一个*屏幕输入表单*。这种更专业的获取用户输入的方法涉及创建并显示显示所有提示的屏幕。然后将光标放置在用户需要响应的特定提示旁边。当用户输入此提示的数据并按下\
  \ [Enter] 时，光标移动到下一个提示。\n\n## 复习题与练习\n\n### 空空题与简答\n\n1. ADT 是什么缩写？\n2. 为了使用 ADT，程序员必须知道它的哪些信息？\n\
