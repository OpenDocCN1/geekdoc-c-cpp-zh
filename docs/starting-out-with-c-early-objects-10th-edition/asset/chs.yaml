  \ 9-5 至 7 时存在部分重复和逻辑跳跃，译文严格遵循原文逻辑进行翻译，并确保了格式的一致性。)\n\n以下是后续需要翻译的文本\n\n[content]\n\
  (注：用户提供的待翻译文本在“以下是需要翻译的文本”之后未提供具体的英文内容，仅包含了前面的关于泡泡排序的描述。此处已对前面的描述完成翻译。若有后续文本请提供。)\n\
  \n\n\n\n该循环在每一轮排序中执行一次。如果数组中有 `N` 个元素，则将有 `N-1` 轮。这是因为冒泡排序的每一轮都会将一个元素放置在它的正确位置。一旦\
  \ `N-1` 个元素被放置好，最后一个元素必然已经在其正确位置上了。`maxElement` 变量存储了当前轮次中最后查看的元素的下标。请注意，它从数组最后一个元素的下标开始，并在每次通过循环时递减\
  \ 1。这可以防止后续的循环迭代检查已经持有正确数值的数组位置。\n\n第二个循环嵌套在第一个循环内部，从第 5 行开始如下：\n\n```\nfor (int\
  \ index = 0; index < maxElement; index++)\n```\n\n在每一轮中，该循环会为数组中每个未排序的元素执行一次迭代。它将\
  \ `index` 初始化为 0，并递增到 `maxElement-1`。在每次迭代中，都会执行第 7 行的比较操作：\n\n```\nif (array[index]\
  \ > array[index + 1])\n```\n\n此 `if` 语句将存储在 `array[index]` 中的值与后续元素 `array[index\
  \ + 1]` 中的值进行比较。如果后续元素的值更大，则调用第 8 行的 `swap` 函数来交换这两个元素。\n\n## 交换元素\n\n正如你在冒泡排序描述中所见的，当算法遍历数组时，某些元素会被交换。以下是用于交换两个\
  \ `int` 参数的 `swap` 函数代码：\n\n```\nvoid swap(int &a, int &b) {\n   int temp = a;\n\
  \   a = b;\n}\n```\n\n请注意，需要三条语句来交换由 `a` 和 `b` 引用的内存位置中存储的值。首先，将局部变量 `temp` 赋值为\
  \ `a` 的当前值，这样当第二条语句用 `b` 的副本替换其值时，该值不会“丢失”。然后，第三条语句将 `temp` 中的值（即 `a` 的旧值）赋值给 `b`。\n\
  \n同样注意，`swap` 函数的参数是引用变量。这是必要的，因为这样函数才能更改作为参数传递的项的值。如果参数没有声明为引用变量，`swap` 将只会处理分配给函数的局部内存。传递给函数的参数中存储的值将发生改变。\n\
  \n[Program 9-4] 在一个完整的程序演示了 `bubbleSort` 和 `swap` 函数。\n\n## 更高效的冒泡排序\n\n冒泡排序算法非常简单直接，但它并不高效，因为在每一轮中（仅将一个值放置在其正确位置），需要大量的交换。这在数组很大时尤为如此。然而，关于冒泡排序有一个有趣的的事实：如果在特定轮中不需要交换，则意味着数组已经完全排序。因此不再需要后续轮次。利用这种特性的算法可以防止许多不必要的循环迭代。以下是实现此功能的增强冒泡排序算法代码：\n\
  \n```\nvoid bubbleSort(int array[], int size) {\n   bool madeAswap = true; // 这允许\
  \  开始迭代\n   for (int maxElement = size - 1; maxElement > 0 && madeAswap; maxElement--)\
  \ {\n      madeAswap = false; // 这一轮尚未发生任何交换\n      for (int index = 0; index <\
  \ maxElement; index++) {\n         if (array[index] > array[index + 1]) {\n    \
  \          swap(array[index], array[index + 1]);\n              madeAswap = true;\n\
  \         }\n      }\n   }\n}\n```\n\n外层 `for` 循环每轮执行一次。请注意，在每次新迭代开始时，布尔变量 `madeAswap`\
  \ 必须被置回 `false`。否则，一旦某轮发生了交换且该变量被设置为 `true`，它将保持为 `true`，即使数组已完全排序，循环也不会提前退出。然而，如果某轮中不需要交换，`madeAswap`\
  \ 将保持为 `false`，`for` 循环测试条件将导致循环退出。\n\n[Program 9-4B] 修改了 [Program 9-4] 以使用这种改进的冒泡排序算法，可以在书籍配套网站的第\
  \ 9 章程序文件夹中找到。除了上面显示的代码外，它还有一个 `bubbleSort` 函数来计算所需的轮数。该数组包含的数据与 [Program 9-4] 中显示的略有不同。\n\
  \n## 选择排序\n\n即使有了上述的增强，冒泡排序仍然低效，因为值每次只向其最终位置移动一个。选择排序之所以得名，是因为它在每一轮中都会确定哪个值属于数组并将其移动到正确位置。选择排序从\
  \ 0 开始扫描数组，找到值最小的元素。然后，将该元素的内容与元素 0 的内容交换。这个过程一直持续直到所有元素都被放置好。\n\n\n\n\n在第三次遍历中，算法从元素\
  \ `2` 开始扫描。数组未排序部分中的最小值位于元素 `5` 处，因此将其与元素 `2` 中的值进行交换。现在数组显示如图 9-11 所示。\n\n## 图\
  \ 9-11：第三次遍历后的数组\n\n![一张图表显示了一个数组。数组中的值为 1, 2, 5, 8, 9 和 7。在第三个和最后一个矩形旁注释道：“这些元素被交换了”。前三个矩形涂有阴影。](img/FG_09_011.png)\n\
  \n第四次遍历从元素 `3` 开始。它的值与元素 `5` 中的值进行交换，导致数组显示如图 9-12.) 所示。## 图 9-12：第四次遍历后的数组\n\n\
  ![一张图表显示了一个数组。数组中的值为 1, 2, 5, 7, 9 和 8。在第四个和最后一个矩形旁注释道：“这些元素被交换了”。前四个矩形涂有阴影。](img/FG_09_012.png)\n\
  \n到此为止，只剩下两个元素需要排序。算法发现元素 `5` 中的值小于元素 `4` 中的值，因此对两者进行交换。这使得数组处于最终顺序，如图 9-13 所示。##\
  \ 图 9-13：完全排序后的数组\n\n![一张图表显示了一个数组。数组中的值为 1, 2, 5, 7, 8 和 9。在最后两个矩形旁注释道：“这些元素被交换了”。所有矩形都涂有阴影。](img/FG_09_013.png)\n\
  \n以下是选择排序的伪代码：\n\n```cpp\n For start = each array subscript, from the first to the\
  \ next-to-last\n   minIndex = start\n   minValue = array[start]\n   For index =\
  \ start + 1 To size − 1 // size − 1 is the last element\n      If array[index] <\
  \ minValue\n         minValue = array[index]\n         minIndex = index\n      End\
  \ If\n   End For\n   swap array[minIndex] with array[start]\nEnd For\n```\n\n选择冒泡排序一样使用一对嵌套循环，在本例中是两个\
  \ `for` 循环。外层循环为每次排序遍历迭代一次。它的循环控制变量 `start` 存储将在本次遍历中获得正确值的数组元素的下标。在第一次遍历中，`start`\
  \ 等于 `0`，找到最小值并将其放在位置 `0`，与之前存储在位置 `0` 的值交换位置。在第二次遍历中，`start` 等于 `1`，找到剩余值中的最小值并将其放在位置\
  \ `1`，与之前存储在位置 `1` 的值交换位置。这个过程一直持续直到顺序正确的值位于位置 `0` 到倒数第二个下标位置。一旦完成此操作，数组最后一个位置剩余的值将是最大的，因此外层循环无需再次迭代。对于\
  \ N 个数据，将有 N-1 次遍历。\n\n在每次遍历中，内层循环的任务是在数组仍未排序部分中找到最小值，以便将其与位置 `start` 的值进行交换。在开始迭代之前，`minIndex`\
  \ 被设置为 `start`，`minValue` 被设置为当前位置 `start` 的值。然后内层循环从索引 `start + 1` 开始遍历数组的其余部分。如果找到比当前存储在\
  \ `minValue` 中更小的值，就用这个新的较小值替换它，并将存储在 `minIndex` 中的下标替换为这个新索引。一旦内层循环完成迭代，`minIndex`\
  \ 将存储最小元素的索引。外层循环随后将该元素的内容与 `array[start]` 的内容交换，然后返回循环顶部，增加 `start` 并开始下一次排序遍历。注意，如果没有找到比位置\
  \ `start` 处更小的元素，`minIndex` 仍然等于 `start`，因此 `array[start]` 中的值本质上将与自身交换，保持保持不变。\n\
  \n与冒泡排序算法一样，一旦选择排序将一个值放在其正确位置，该值和该位置在后续遍历中就不需要再次检查。然而，如前所述，选择排序比冒泡排序更高效，因为它每次遍历所需的交换次数更少。事实上，如上面的伪代码所示，它每次遍历只需要一次数据交换。另一方面，注意到选择排序并不像冒泡排序那样使用标记来判断数组是否已排序。\n\
  \n## 检查点\n\n1. 9.7 冒泡排序中的哪一行代码需要修改以变为降序而不是升序？\n2. 9.8 冒泡排序遍历后的哪个值？\n3. 9.9 哪种排序通常需要的交换更少：冒泡排序还是选择排序？\n\
  \n\n\n\n在上一章中，你学习了作为标准模板库（STL）一部分的 `vector` 类。一旦正确定义了 STL `vector` 并向其填充了值，就可以可以使用本章介绍的算法对该\
  \ vector 进行排序和搜索。在需要时，只需将数组语法替换为 vector 语法即可。\n\n程序 9-7 演示了如何对字符串类型的 vector 使用选择排序和二分查找算法。\n\
  \n注意程序 9-7 与程序 9-5 之间的相似之处和不同之处。程序 9-7 中用于选择排序算法对 vector 进行排序的代码与程序 9-5 中排序数组的代码几乎相同。但请注意，在程序\
  \ 9-7 中，vector 是通过引用传递给 `selectionSort` 函数的。这是必要的，因为与数组不同，除非程序员使用引用变量作为参数，否则 vector\
  \ 是按值传递的。同样注意在程序 9-7 中，我们不需要向处理它的的函数传递 vector 的大小，因为 vector 的 `size` 成员函数可以告诉我们它包含多少元素。\n\
  \n## 9.6 算法分析导论\n\n## 概念\n\n我们可以通过计算算法解决问题所需的步骤数来估计算法的效率。\n\n算法是解决问题的一种机械化逐步步骤，是设计程序时使用的基本策略。对于一个给定的问题，通常有多种算法可以解决。例如，我们在本章前面看到，搜索排序数组的问题可以通过两种不同的方法解决：`sequential\
  \ search`（顺序查找）和 `binary search`（二分查找）。\n\n我们如何判断解决问题的两个算法哪一个更好？为了回答这个问题，我们需要建立判断算法“优劣”或效率的标准。最常用的两个标准是空间和时间。*空间*标准指的是算法解决问题所需的内存量，而*时间*标准指的是执行时间的长短。在本章中，我们将使用时间标准来评估算法的效率。\n\
  \n比较两种算法的其中一种可能的方法是将它们编写成代码，然后对生成的 C++ 程序的执行时间进行计时。这种实验性方法可以产生有用的信息，但它存在以下缺点：\n\n\
  *   它衡量的是程序的效率，而不是算法的效率。\n*   结果取决于用于编写算法的编程语言，以及用于生成机器码的编译器的质量。如果使用不同的语言编写或由不同的编译器编译，程序的运行速度可能会更快或更慢。\n\
  *   结果取决于操作系统如何执行程序，以及运行程序的硬件性质。如果我们在不同的计算机和不同的操作系统上运行这些程序，其执行时间可能会有所不同。\n*   结果仅适用于执行运行过程中包含的输入，可能无法代表使用不同输入集时算法的性能。\n\
  \n一种更好的方法是计算算法处理给定大小输入所需的基步骤数。为了使这种方法具有意义，我们需要对计算问题、问题输入、输入大小和基本步骤有更精确的定义。\n\n##\
  \ 计算问题与基本步骤\n\n*计算问题*（*computational problem*）是通过算法要解决的问题。这类问题是若干实例（*instances*）的集合，每个实例由按照规定格式提供的输入数据指定。例如，如果问题\
  \ `P` 是对整数数组进行排序，那么 `P` 的一个实例就是一个特定的待排序整数数组。实例的*大小*指的是存储输入所需的内存量。输入大小通常由数据所占据的位数给出。如果问题\
  \ `P` 是对整数数组进行排序，那么 `P` 的一个实例就是一个特定的待排序整数数组。如果元素占据的位数是固定的，例如 64 位，那么数组的长度就是良好的输入衡量标准。相反，如果元素的大小可以变化，数组的长度就不是良好的输入衡量标准。\n\
  \n算法执行的步骤如果能够在常数时间内完成，则被称为*基本步骤*（*basic step*，也称为基本操作）。在排序数组时，\n\n```\nSwap the\
  \ elements in k and k+1\n```是基本的，因为交换元素的时间是常数。相反，如下步骤\n\n```\nFind the largest element\
  \ of the array\n```不是基本的，因为完成该步骤的时间取决于数组的长度。直观地说，基本步骤是可能构建在某些物理硬件中的步骤。\n\n基本步骤的定义没有指定限制执行步骤的常数大小。忽略这些常数的具体值反映了相同的操作在不同硬件上执行速度不同，在一个计算机上可以通过指令执行的操作在另一个计算机上可能需要几条指令。这种定义的后果是将任何常数基步骤计为一个基本步骤。例如，一个执行\
  \ `5n` 个基本步骤的算法可以准确地描述为执行 `n` 个基本步骤。\n\n重要的是，普通的算术和逻辑操作（如加法和比较）除非对相加或比较的数量有常数界限，否则它们不是基本步骤。只要界限是常数，可以是\
  \ 32、64、128、1024 位甚至更大，这些操作仍然是基本步骤。在接后的讨论中，我们假设算法中作为输入、输出或计算中间结果的所有数字大小都是受限的。这允许我们将对它们的操作视为基本操作。\n\
  \n在描述算法之前，我们必须描述问题。计算问题的描述是通过说明输入看起来什么样、有多大，以及解决问题的算法应该产生什么输出。这些描述必须清晰，以消除歧义，并且通常以便算法能够处理任何符合描述的数据集。\n\
  \n让我们来看一个例子。假设问题 `P` 是对一维数组中的所有整数求和。我们可以这样描述这个问题：输入数据是一个包含 *n* 个整数值的数组，要产生的输出是这些值的整数和。形式化地，写如下：\n\
  \n*   输入：大小为 `n` 的整数数组 `a[]`\n*   输入大小：数组条目的数量 `n`\n*   输出：代表数组存储值总和的整数 `sum`\n\n\
  \n\n\n\n请注意，此处使用的 `INPUT` 一词并不意味着用户输入的一组数据。它指的是解决问题时算法所使用的数据形式。同样，此处使用的 `OUTPUT`\
  \ 一词并不意味着程序在计算机屏幕上显示的内容。它指的是解决问题的算法所产生的结果。由于我们假设所有数组条目的都是都是固定（例如 32 位或 64 位），数组中的元素数量\
  \ `n` 是衡量输入大小的良好标准。\n\n一旦描述了一个计算问题，就可以设计出许多不同的算法来解决它。正如我们很快将看到的，其中某些算法显然优于其他算法。这里是解决上述计算问题的一种可能算法。注意，它是用伪代码表示的，而不是\
  \ C++ 或任何其他特定的编程语言。\n\n## 算法 1\n\n```\n 1: sum = 0 \n2: k = 0 //数组索引 \n3: While\
  \ k < n do \n4:     sum = sum + a[k] \n5:     k = k + 1 \n6: End While\n```\n\n\
  ## 算法复杂度\n\n我们可以通过确定解决计算问题的算法对于大小为 `n` 的输入所需的基本步骤数来衡量该算法的复杂度。让我们数一数算法 1 所需的步骤。该算法由第\
  \ 1 行和第 2 行的两个语句（各执行一次）以及第 4 行和第 5 行循环内的两个语句（每次循环迭代都会执行一次）组成。由于第 1 行和第 2 行的语句执行的是基本操作，可以将它们归为类并计为一个基本操作。我们将此操作称为\
  \ `A`。\n\n此外，由于循环中的两个语句都在常数时间内执行，且独立于 `n` 的大小，因此它们也是基本操作。由于循环体只包含基本操作，算法执行单次迭代所需的时间也是常数，不依赖于\
  \ `n` 的大小。这允许我们认为每次循环迭代都是单个基本操作。我们将此操作称为 `B`。\n\n无论 `n` 有多大，操作 `A` 只执行一次。操作 `B`\
  \ 在每次循环迭代时执行一次。因为循环迭代了 `n` 次，所以操作 `B` 执行了 `n` 次。因此，执行的计算总数为 1+ `n`。例如，当 `n` = 10\
  \ 时，执行了 11 次操作。当 `n` = 1000 时，执行了 1001 次操作。当 `n` = 10,000 时，执行了 10,001 次操作。注意，随着\
  \ `n` 变得很大，1 变得微不足道，执行的操作数约为 `n`。因此我们说算法处理大小为 `n` 的输入集所需的执行时间与 `n` 成比例。\n\n我们还有另一种方法来看算法\
  \ 1 并确定它需要多少操作。在对数组求和时，关键操作是将每个值加到累加和的变量。这发生在第 4 行，数组值的加法次数与循环迭代次数相同。\n\n因此，我们只需要计算数组元素的加法就可以得到相同的结果。事实证明，对于大多数算法，只需要识别并计算一两个对所解决的问题至关重要的基本操作就足够。例如，在许多数组搜索和排序算法中，只需计算数组元素比较次数就足够了。\n\
  \n刚刚考虑的数组求和算法分析起来特别简单，因为它对给定大小的所有输入集都执行相同的工作。\n\n并非所有算法都是如此。考虑本章之前介绍的线性搜索算法。它遍历一个值数组，寻找与搜索键匹配的项。我们将该键称为\
  \ `X`。算法的输入是包含 `n` 个值的数组和键值 `X`。算法的输出是值所在数组位置的下标；或者如果没有找到，则判定循环控制变量已大于最后一个数组元素的下标。从形式上说，这个问题可以表述为：\n\
  \n*   输入：大小为 `n` 的整数数组 `a[]` 和一个整数 `X`\n*   输入大小：数组条目的数量 `n`\n*   输出：范围在 0 ≤ `k`\
  \ ≤ `n` − 1 整数 `k`，使得 `a[k]` = `X`，或 `k` = `n`\n\n此处所示算法 2 使用线性搜索算法解决这个问题。\n\n##\
  \ 算法 2\n\n```\n1: k = 0\n2: While k < n\n3:    if a[k] == X\n4:        return k\n\
  5:    k = k + 1\n6 return -1\n```\n\n## 算法的最坏情况复杂度\n\n算法的最坏情况复杂度 `f(n)` 是算法在大小为\
  \ `n` 的输入上执行的、工作量最多的步骤数。它给出了算法可能花费的最长时间的指示。\n\n让我们确定之前介绍的二分搜索的最坏情况复杂度。该算法用于在数组中定位项目\
  \ `X`。最坏情况发生在 `X` 未找到时。在这种情况下，正如我们将看到的，它执行了 L+1 步，其中 `L` 是循环迭代次数。这里是搜索包含 `n` 个元素的数组的二分搜索算法。\n\
  \n## 算法 3\n\n```\n 1: first = 0\n2: last = n − 1   // n − 1 是最后一个元素的下标\n3: found\
  \ = false\n4: position = −1\n5: While found is not true and first <= last\n6:  \
  \   middle = (first + last) / 2\n7:     If a[middle] = X\n8:        found = true\n\
  9:        position = middle\n10:     Else if a[middle] > X\n11:        last = middle\
  \ − 1\n12:     Else\n13:        first = middle + 1\n14:     End If\n15: End While\n\
  16: // 当循环终止时，position 存储了\n17: // 找到 X 值的下标；如果未找到，则\n18: // 存储 −1。\n```\n\n该算法由一些变量初始化和随其后的循环组成。初始化需要常数时间，因此可以被视为一个基本操作。同样，循环的每次迭代都是基本步骤，因为增加数组条目的数量不会增加单次迭代所需的时间。这表明二分搜索所需的步骤数为\
  \ L+1。现在 `L` 大约等于 `log[2]*n` 的整数部分，即 `n` 以 2 为底的对数。为了理解这一点，注意初始搜索数组的大小为 `n`，每次迭代都会将剩余搜索部分的大小大约缩小一半。由于每次循环迭代最多执行两次比较，二分搜索总共执行了\
  \ 2 2log[2]*n 次比较。我们可以将发现总结如下：\n\n*   在最坏情况下，二分搜索所需的时间与 log[2]*n* 成比例。\n\n\n\n\n\
  \n让我们再看另一个算法来确定它的最坏情况复杂度。解决的计算问题是将一组 `n` 个整数按升序排列。\n\n* 输入：一个包含 `n` 个整数的数组 `a[]`\n\
  * 输入规模：数组项的个数 `n`\n* 输出：重排后的数组 `a[]`，使得 `a[0]` ≤ `a[1]` ≤ ... ≤ `a(n − 1)`\n\n我们将使用的算法是本章早些介绍的选择排序算法的修改版本。这个版本在每一轮中扫描最大元素（而不是最小元素），并将其移动到末尾。\n\
  \n## 算法 4\n\n```\n 1: For (k = n−1; k ≥ 1; k ----)\n2:      // a[0..k] 是剩余待排序的部分\n\
  3:      确定 a[0..k] 中最大元素的位置 p\n4:         交换 a[p] 与 a[k]\n5:   End For\n```\n\n\
  为了分析该算法的复杂度，我们首先确定它在排序一个包含 `n` 个元素的数组时所进行的数组项之间的比较次数。这些比较发生在第 3 步。第 3 步显然不是基本步骤，因为所需时间与\
  \ `k` 成比例，且 `k` 随着循环的每次迭代而变化。为了更好地理解发生的情况，让我们用基本操作重新表述第 3 步。\n\n* 输入：包含 `k + 1`\
  \ 个元素的数组 `a[0..k]`\n* 输入规模：数组项的个数 `k + 1`\n\n```\n3.0: p = 0 // 数组未排序部分最大值的位置\n\
  3.1: For (m = 1; m ≤ k; m++)\n3.2:    If a[m] > a[p] Then\n3.3:      p = m\n3.4:\
  \    End if\n3.5: End For\n```\n\n我们可以看到第 3.1 行到 3.5 行的循环迭代了 `k` 次，并且第 3.2 行每次迭代时进行一次比较。因此，该算法在数组项之间需要\
  \ `k` 次比较。\n\n现在回到主排序算法，我们观察到从第 1 行开始到第 5 行结束的循环将执行 `n − 1` 次迭代，对应 `n − 1` 到 1 范围内每个\
  \ `k` 值的迭代。在第一次迭代中，`k` 等于 `n − 1`，因此根据我们对第 3.0 行到 3.5 行的分析，第 3 步在数组元素之间执行 `n − 1`\
  \ 次比较。在第二次迭代中，`k` 等于 `n − 2`，因此第 3 步执行 `n − 2` 次比较。以此此类推，直到最后一次迭代，`k` 等于 1，第 3 步执行\
  \ 1 次比较。情况如下：\n\n$$\\begin{array}{crc} k & = & {n - \\,\\text{1:~step~3~performs~}n\
  \ - \\text{1}\\,\\text{comparisons}} \\\\ k & = & {n - \\text{2:~step~3~performs~}n\
  \ - \\text{2}\\,\\text{comparisons}} \\\\ \\cdot & & \\\\ \\cdot & & \\\\ k & =\
  \ & {\\text{1:~step~3~performs~}1}\\,\\text{comparison}}\\end{array}$$\n\n泛化来说，我们可以得出对于从\
  \ `n − 1` 到 1 的每一个 `k` 值，在第 `k` 次迭代中，该步骤将执行 `k` 次比较。\n\n因此，该简单排序算法执行的总比较次数由表达式给出\n\
  1 + 2 + 3 + ... + (n − 1) = (n − 1)n/2\n\n对于较大的 `n`，这个表达式接近 `n²/2`。所以说：在最坏情况下，选择排序的时间与\
  \ `n²` 成比例。\n\n## 平均情况复杂度\n\n然而，最坏情况复杂度并不能很好说明算法在实际情况下的表现。我们通常感兴趣的是确定典型情况，即平均情况的复杂度。当我们知道不同输入出现的相对频率时，可以使用平均情况函数。平均情况函数利用这些频率形成每个输入上执行步骤的加权平均值。尽管它提供了算法预期性能的良好衡量，但准确估计输入频率可能困难。\n\
  \n## 渐近复杂度与大 O 表示法\n\n我们可以通过比较复杂度函数来比较两个算法 `F` 和 `G`。具体来说，如果 `f(n)` 和 `g(n)` 是两个算法的复杂度函数，我们可以通过观察\
  \ `n` 很大时比率 `f(n)/g(n)` 的情况来比较这些算法。如果这个比率趋于某个极限，则最容易理解。让我们考虑一些例子。在整个过程中假设对于所有 `n\
  \ ≥ 1`，`f(n) ≥ 1` 且 `g(n) ≥ 1`。\n\n* `f(n) = 3n² + 5n` 且 `g(n) = n²`。在这种情况下\n$$\\\
  frac{f(n)}{g(n)} = \\frac{3n^{2} + 5n}{n^{2}} = 3 + \\frac{5}{n}\\rightarrow 3\\\
  ,\\text{as}\\, n\\rightarrow\\infty.$$\n也就是说，随着 `n` 变大，`f(n)/g(n)` 的值越来越接近 3。这意味着对于较大的输入规模，`F`\
  \ 执行的操作数是 `G` 的三倍。由于两个算法之间仅存在常数因子，我们认为它们是等价。\n\n* `f(n) = 3n² + 5n` 且 `g(n) = 100n`。在这种情况下\n\
  $$\\frac{f(n)}{g(n)} = \\frac{3n^{2} + 5n}{100n} = \\frac{3n}{100} + \\frac{5}{100}\\\
  rightarrow\\infty\\,\\text{as}\\, n\\rightarrow\\infty.$$\n这里，随着 `n` 变大，`f(n)/g(n)`\
  \ 越大。这意味着在大规模下，`F` 执行的工作比 `G` 多得多。这使得 `G` 是大输入下的更好的算法。\n\n* `f(n) = 3n² + 5n` 且\
  \ `g(n) = n³`。在这种情况下\n$$\\frac{f(n)}{g(n)} = \\frac{3n^{2} + 5n}{n^{3}} = \\frac{3}{n}\
  \ + \\frac{5}{n^{2}}\\rightarrow 0\\,\\text{as}\\, n\\rightarrow\\infty.$$\n这意味着对于大输入，算法\
  \ `G` 执行的工作比 `F` 多得多，使得 `F` 是更高效的算法。\n\n通常来说，我们可以通过观察 `n` 变大时 `f(n)/g(n)` 的情况来比较两个复杂度函数\
  \ `f(n)` 和 `g(n)`。虽然从该比率极限的角度考虑有助于比较两个算法，但我们不能假设这样的极限总是存在。事实证明，只要我们能找到一个正系数 `K`\
  \ 使得，就可以从这个比率中获得有用信息：\n$$\\frac{f(n)}{g(n)} \\leq K\\,\\text{for}\\, n \\geq 1$$\n\
  \n如果可以做到，意味着对于大问题，算法 `F` 不比 `G` 倍 `K`。在这种情况下，我们说 `f(n)` 属于 `O(g(n))`，读作“f 属于 g 的\
  \ O”。定义 `f(n)` 属于 `O(g(n))` 的条件通常写成：\n`f(n) ≤ K*g(n)`，当 `n ≥ 1` 时。\n\n证明 `f(n)`\
  \ 属于 `O(g(n))` 通常很直接。你观察比率 `f(n)/g(n)` 并尝试找到一个正系数 `K`，使得对于所有 `n ≥ 1` 都有 `f(n)/g(n)\
  \ ≤ K`。例如，要证明 `3n² + 5n` 属于 `O(n²)`，观察以下比率并注意到对于所有 `n ≥ 1`，`5/n` 最多为 5。因此 `3 + 5/n\
  \ ≤ 8`。因此对于 `K = 8`，`f(n)/g(n) ≤ K`。\n\n$$\\frac{3n^{2} + 5n}{n^{2}} = 3 + \\frac{5}{n}$$\n\
  \n要证明 `f(n)` 不属于 `O(g(n))`，你需要证明没有方法找到一个正系数 `K` 使得对于所有 `n ≥ 1` 都 `f(n)/g(n) ≤ K`。例如，函数\
  \ `3n² + 5n` 不属于 `O(n)`，因为没有常数 `K` 满足\n$$\\frac{3n^{2} + 5n}{\\text{n}} = 3n + 5\
  \ \\leq K\\,\\text{for}\\, n \\geq 1.$$\n\n\n\n\n\n虽然“大 O”（Big O）表示法和术语是为函数定义的，但它也被用于刻画算法和计算问题。因此，如果算法\
  \ `F` 的最坏情况复杂度函数 `f(n)` 属于 `g(n)` 的大 O，我们就说算法 `F` 对于某个函数 `g(n)` 属于 `O(g(n))`。相应地，数组的顺序查找是\
  \ `O((n))`，而二分查找是 `O(log[2]n)`。\n\n同样地，如果某个计算问题存在一种算法，其最坏情况复杂度函数属于 `O(g(n))`，则称该问题属于\
  \ `O(g(n))`。因此，数组排序问题的复杂度是 `O(n²)`，而搜索已排序数组问题的复杂度是 `O(log[2]n)`。\n\n如果 `g(n)` 是一个函数，`O(g(n))`\
  \ 可以被视为一组增长速度不超过 `g(n)` 的函数。这些函数族被称为 `复杂度类`，其中一些重要到足以拥有特定的名称。我们在这里按照增长率从快到慢列出它们。\n\
  \n1. `O(1)`：如果存在常数 `K > 0` 使得对于所有 `n ≥ 1` 都有 `f(n) ≤ K`，则函数 `f(n)` 属于此类。属于此类类的算法以`常数时间`运行。\n\
  \n2. `O(log[2]n)`：此类类的算法以`对数时间`运行。由于 `log n` 的增长速度远慢于 `n`，问题规模的巨大增加导致算法运行时间的微小增加。这种复杂度是搜索问题的特征，即每次基本操作都能消除一半的搜索空间。`二分查找`算法就属于此类。\n\
  \n3. `O(n)`：此类类的算法以`线性时间`运行。问题规模的任何增加都会导致算法运行时间的按比例增加。这种复杂度是像`顺序查找`这样的算法的特征，它们对输入进行单次通过（或常数次通过）扫描。\n\
  \n4. `O(n log[2]n)`：此类类被称为“n log n”。问题规模的增加会导致算法运行时间的略微增加。`Quicksort`（快速排序）这种排序算法的平均情况复杂度属于此类，你将在第\
  \ 14 章中学习它。\n\n5. `O(n²)`：此类类被称为`二次时间`。这种性能是使用两个嵌套循环对输入数据进行多次通过的算法的特征。问题规模的增加会导致算法运行时间的大幅增加。`bubble\
  \ sort`（泡排序）、`selection sort`（选择排序）和 `Quicksort`（快速排序）的最坏情况复杂度函数都属于此类。\n\n## 检查点\n\
