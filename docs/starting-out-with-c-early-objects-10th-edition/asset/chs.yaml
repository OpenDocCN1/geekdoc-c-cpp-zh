  `outcome` 将存储什么值？取决于加法操作还是除法操作，可能是 6 或 14。答案是 14，因为除法运算符的优先级高于加法运算符。数学表达式从左到右求值。当有两个运算符且其中一个优先级更高时，会先执行。示例语句的操作如下：\n\
  \n*   首先，6 除以 3，得到结果 2。\n*   然后，12 加上 2，得到结果 14。\n*   最后，14 被存储在 `outcome` 变量中。\n\
  \n这些步骤可以用以下方式图化：\n\n```\noutcome=12+6/3︸2outcome=12+  2︸outcome=   14\n```\n\n表\
  \ 3-1 显示了算术运算符的优先级。顶部的运算符比下面的优先级更高。\n\n# 表 3-1 算术运算符优先级（从高到低）\n\n| 运算符 | 类型 | 描述\
