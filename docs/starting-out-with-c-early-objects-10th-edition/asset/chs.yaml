  bool isEven(int number)\n{  bool answer = false;\n   if (number % 2 == 0)\n    \
  \  answer = true;\n   return answer;\n}\n``` ```\n\n虽然程序 6-13)中使用的代码很短，但它有两个 `return`\
  \ 语句。许多教师倾向于让返回值的函数只有一个 `return` 语句。\n\n## 检查点\n\n1. 函数可以有多少个返回值？\n2. 6.12 为 `distance`\
  \ 写一个头文件。该函数应该返回 `double` 并有两个参数。\n3. 6.13 为 `days` 写一个头文件。该函数应该返回 `int` 并有三个参数：`years`、`months`。\n\
  4. 6.14 为 `getKey` 写一个头文件。该函数应该返回 `char` 且没有参数。\n5. 6.15 为 `years` 写一个头文件。该函数应该返回\
  \ `long` 并有一个参数：`miles`。\n\n## 6.9 在菜单中使用函数\n\n## 概念\n\n函数非常适合菜单驱动程序。通常需要一个函数来测试参数并返回一个\
  \ `true` 或 `false` 值，以指示条件是否满足。这样的函数将返回一个 `bool` 值。例如，下面所示的 `isValid` 函数接受一个 `int`\
  \ 参数，如果参数在 1 到 100 范围内，则返回 `true`，否则返回 `false`。\n\n```cpp\n bool isValid(int number)\n\
  {\n  bool status;\n  if (number >= 1 && number <= 100)\n     status = true;\n  else\n\
  \       status = false;\n  return status;\n}\n```\n\n下面的代码显示了一个调用该函数的 `if/else`\
  \ 语句：\n\n```cpp\n int value = 20;\nif (isValid(value))\n    cout << \"The value\
  \ is within range.\\n\";\nelse\n    cout << \"The value is out of range.\\n\";\n\
  ```\n\n由于 `value` 等于 20，这段代码在执行时将显示消息“The value is within range.”。\n\n程序 6-13 显示了另一个返回类型为\
  \ `bool` 的函数示例。该程序有一个名为 `isEven` 的函数，如果它的参数是偶数，则返回 `true`。否则，函数返回 `false`。\n\n注意\
  \ `isEven` 函数在第 18 行是通过以下语句调用的：\n\n```cpp\n if (isEven(val))\n```\n\n回想第 4 章，这这是在询问函数调用\
  \ `isEven(val)` 是否返回了值 `true`。当 `if` 语句执行时，会用 `val` 作为参数调用 `isEven`。如果 `val` 是偶数，`isEven`\
  \ 返回 `true`；否则返回 `false`。\n\n同样注意从第 31 行开始的 `isEven` 函数是如何使用 `if` 语句来返回值 `true`\
  \ 或值 `false` 的。该函数还有其他几种编写方法。让我们比较三种不同的编写方式。\n\n| 程序 6–13 代码 | 版本 2 | 版本 3 |\n|\
  \ :--- | :--- | :--- |\n| ```cpp\nbool isEven(int number)\n{\n   if (number % 2\
  \ == 0)\n      return true;\n   else\n      return false;\n}\n``` ``` | ```cpp\n\
  bool isEven(int number)\n{  bool answer;\n   if (number % 2 == 0)\n      answer\
  \ = true;\n   else\n      answer = false;\n   return answer;\n}\n``` ``` | ```cpp\n\
  bool isEven(int number)\n{  bool answer = false;\n   if (number % 2 == 0)\n    \
  \  answer = true;\n   return answer;\n}\n``` ```\n\n虽然程序 6-13 中中使用的代码很短，但它有两个 `return`\
  \ 语句。许多教师倾向于让返回值的函数只有一个 `return` 语句。\n\n## 检查点\n\n1. 函数可以有多少个返回值？\n2. 6.12 为 `distance`\
  \ 写一个头文件。该函数应该返回 `double` 并有两个参数。\n3. 6.13 为 `days` 写一个头文件。该函数应该返回 `int` 并有三个参数：`years`、`months`。\n\
  4. 6.14 为 `getKey` 写一个头文件。该函数应该返回 `char` 且没有参数。\n5. 6.15 为 `years` 写一个头文件。该函数应该返回\
  \ `long` 并有一个参数：`miles`。\n\n\n\n\n有时在程序中，你可能想要清除屏幕并将光标回到顶部。这在编写一个菜单驱动的程序时特别有用。在用户做完菜单选择并执行了处理该选择的函数后，如果能在重新显示菜单之前清除屏幕，那就将非常不错。这可以通过在程序中插入一条命令来实现，该命令请求操作系统为你清除屏幕。以下适用于基于\
  \ Unix 的操作系统（如 Linux 和 Mac OS）的命令：\n\n```\nsystem(\"clear\");\n```\n\n这里是适用于 Windows\
  \ 系统的命令。你可能已经注意到它出现在程序 6-14 第 54 行，紧邻菜单显示之前。\n\n```\nsystem(\"cls\");\n```\n\n这会在用户选择显示新报告之前，从屏幕上移除之前的报告。然而，重要的是不要在报告显示后过快地清除屏幕，否则它会在用户来得及查看之前就消失。请查看程序\
  \ 6-14 的第 95 到 98 行。这些行保持了报告屏幕，直到用户按下 [回车] 键，表示准备好返回菜单并开始新操作。\n\n## 6.10 局部变量与全局变量\n\
  \n## 概念\n\n局部变量定义在函数内部，在函数外部无法访问。全局变量定义在所有函数之外，其范围内的所有函数都可以访问。\n\n## 局部变量\n\n定义在函数内部的变量对于该函数是`局部`的。它们对其他函数中的语句是隐藏的，这些语句通常无法访问它们。程序\
  \ 6-15 显示，因为定义在函数中的变量被隐藏了，其他函数可能拥有具有相同名称的独立、不同的变量。\n\n尽管有两个名为 `num` 的变量，但程序每次只能“看到”其中一个，因为它们位于不同的函数中。当程序在\
  \ `main` 中执行时，`main` 中定义的 `num` 变量是可见的。然而，当调用 `anotherFunction` 时，只有定义在其内部的变量是可见的，因此\
  \ `main` 中的 `num` 变量被隐藏了。图 6-13 说明了这两个函数的封闭性。方框代表变量的范围。\n\n### 图 6-13 局部变量的可见性\n\
  \n![一个程序显示了 2 个模块。](img/FG_06_013.png)图 6-13 完整替代文本\n\n### 注意\n\n函数的参数也是局部变量。它们的范围局限于函数体。\n\
  \n## 局部变量的生命周期\n\n局部变量仅在定义它的函数执行时存在。这被称为局部变量的`生命周期`。当函数开始时，它的参数变量和它定义的任何局部变量会在内存中创建，当函数结束时，它们就会被销毁。这意味着存储在函数参数或局部变量中的任何值在函数调用之间将会丢失。\n\
  \n## 使用参数值初始化局部变量\n\n可以使用参数变量来初始化局部变量。有时这可以简化函数中的代码。这是我们之前看过的 `sum` 函数的修改版本。在这个版本中，函数的参数被用于初始化局部变量\
  \ `result`。\n\n```\nint sum(int num1, int num2)\n{\n    int result = num1 + num2;\n\
  \    return result;\n}\n```\n\n## 全局变量\n\n全局变量是程序中程序所有函数（包括 `main`）之外的任何变量。全局变量的范围是从变量定义处到整个程序结束的部分。这意味着在全局变量定义之后定义的所有函数都可以访问该全局变量。程序\
  \ 6-16 显示了两个函数，`main` 和 `anotherFunction`，它们访问同一个全局变量 `num`。\n\n在程序 6-16，`num` 定义在函数之外。由于它的定义出现在\
  \ `main` 和 `anotherFunction` 之前，这两个函数都可以访问它。\n\n在 C++ 中，除非你显式初始化全局变量，否则它们会被初始化。\n\
  \n### 注意\n\n记住，局部变量不像全局变量那样会被自动初始化。程序员必须处理这一点。\n\n虽然全局变量很有用，但你应该限制对它们的使用。当学生初学编写带有多个函数的程序时，他们会被诱将所有变量设为全局变量，这样不需要传递就可以被任何函数访问。虽然这种方法可能让程序更容易编写，但通常会导致问题。原因如下：\n\
  \n- 全局变量让调试变得困难。程序中的任何语句都可以更改全局变量的值。如果你发现全局变量中存储了错误的值，你需要追踪访问它的每一个语句，以确定错误值从哪里来。在数千行代码的程序中，这很难。\n\
  - 使用全局变量的函数通常依赖于这些变量。如果你想在另一个程序中使用这样的函数，你可能需要重新设计它，使其不再依赖全局变量。\n- 全局变量让程序难以理解。全局变量可以被程序中的任何语句修改。因此，要理解使用全局变量的任何部分，你必须意识到程序访问它的其他部分。\n\
  \n因此，最好不要使用全局变量来存储、处理和检索数据。相反，应该局部声明变量，并作为参数传递给需要访问它们的函数。\n\n## 全局常量\n\n虽然你应该避免使用全局变量，但在程序中使用全局常量通常是许可的。`全局常量`是程序中每个函数都可用的命名常量。由于全局常量的值在程序执行期间不能更改，所以你不需要担心与使用全局变量相关的潜在危险。\n\
  \n\n\n\n\n程序 6-18 展示了如何使用全局常量的示例。该程序计算公司管理实习生的总工资，包括加班费。所有实习生的每小时薪资都是相同的。除了 `main`\
  \ 之外，此程序有两个函数：`getBasePay` 和 `getOvertimePay`。`getBasePay` 函数接收工作小时数，并返回非加班小时的工资金额。`getOvertimePay`\
  \ 函数接收工作小时数，如果有加班，则返回加班小时的工资金额。\n\n让我们仔细观察该程序。在第 7、8 和 9 行定义了三个全局常量。`PAY_RATE` 常量设置为员工的每小时薪资，即\
  \ 22.55。`BASE_HOURS` 常量设置为 40.0，这是员工在一周内不获得加班费的情况下可以工作的小时。`OT_MULTIPLIER` 常量设置为\
  \ 1.5，这是加班小时的薪资倍率。这意味着员工的所有加班小时的小小时薪资都要乘以 1.5。\n\n由于这些常量是全局的，并且在程序中所有函数之前定义，因此所有函数都可以访问它们。例如，`getBasePay`\
  \ 函数在第 53 和 54 行访问 `BASE_HOURS` 常量，并在第 54 和 56 行访问 `PAY_RATE` 常量。`getOvertimePay`\
  \ 函数在第 70 行访问 `BASE_HOURS` 常量，并在第 73 行访问三个常量。\n\n# 同名的局部和全局变量\n\n你不能在同一个函数中拥有两个同名的局部变量。这同样适用于参数变量。参数变量本质上是一个局部变量。因此，你不能在同一个函数中给参数变量和局部变量相同的名称。\n\
  \n然而，你可以拥有与全局变量或常量同名的参数或局部变量。当你这样做时，参数或局部变量的名字会*遮蔽*（shadow）全局变量或常量的名称。这意味着全局变量或常量的名称被参数或局部变量的名字所隐藏。因此，在该程序的这部分，全局变量或常量无法被看到或使用。程序\
  \ 6-19 说明了这一点。它有一个名为 `BIRDS` 的全局常量，设置为 500，以及在 `california` 函数中有一个名为 `BIRDS` 的局部常量，设置为\
  \ 10000。\n\n当程序在 `main` 函数中执行时，设置为 500 的全局常量 `BIRDS` 是可见的。第 12 行的 `cout` 语句显示“In\
  \ main there are 500 birds.”（对于拼写差异，向缅州的朋友表示歉意。）然而，当程序在 `california` 函数中执行时，局部常量\
  \ `BIRDS` 遮蔽了全局常量 `BIRDS`，因此使用的是局部常量 `BIRDS`。这就是为什么第 24 行的 `cout` 语句显示“In california\
  \ there are 10000 birds.”\n\n## 6.11 静态局部变量\n\n如果函数在程序中被调用多次，存储在函数局部变量中的值在函数调用之间不会保留。这是因为局部变量在函数终止时会被销毁，并在函数再次启动时重新创建。这在\
  \ 程序 6-20 中所示。\n\n尽管在第 25 行 `showLocal` 函数的最后语句在 `localNum` 中存储了 99，但该变量在函数终止时被销毁了。下次调用该函数时，`localNum`\
  \ 会重新创建并再次初始化为 5。\n\n然而，有时程序在函数调用之间“记住”局部变量中存储的值是理想的。这可以通过将变量声明为 `static` 来。静态局部变量在函数返回时不会被销毁。它们在程序的整个生命周期内都存在，尽管它们的作用仅限于定义它们的函数。程序\
  \ 6-21 使用静态局部变量来计算函数被调用的次数。\n\n## 检查点\n\n1. 静态变量和全局变量之间的区别是什么？\n2. 以下程序的输出是什么？\n\
  ```cpp\n#include <iostream>\nusing namespace std;\n\nvoid showVar() {\n    static\
  \ int var = 50;\n    cout << var << endl;\n}\n\nint main() {\n    showVar();\n \
  \   showVar();\n    return 0;\n}\n```\n3. 以下程序的输出是什么？\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nvoid myFunc() {\n    static int var = 10;\n    cout << var\
  \ << endl;\n}\n\nint main() {\n    myFunc();\n    myFunc();\n    return 0;\n}\n\
  ```\n\n## 6.12 默认参数\n\n## 概念\n\n当未提供参数时，会自动向参数传递默认参数。\n\n可以函数参数分配默认参数。当省略实际参数时，会传递默认参数。默认参数通常在函数声明中列出。例如：\n\
  \n```cpp\nvoid showArea(double length = 20.0, double width = 10.0);\n```\n\n由于函数声明不需要参数名称，示例声明也可以这样写：\n\
  \n```cpp\nvoid showArea(double = 20.0, double = 10.0);\n```\n\n在任何情况下，默认参数（必须是字面量或常量）前面都有\
  \ `=` 运算符。\n\n注意在两个示例声明中，`showArea` 有两个 `double` 参数。第一个分配了默认参数 20.0，第二个分配了默认参数 10.0。这是函数的定义：\n\
  \n```cpp\nvoid showArea(double length, double width)\n{\n    double area = length\
  \ * width;\n    cout << \"The area is \" << area << endl;\n}\n```\n\n`length` 的默认参数是\
  \ 20.0，`width` 的默认参数是 10.0。因为两个参数都有默认参数，所以在函数调用时可以选择地省略，如下：\n\n```cpp\nshowArea();\n\
  ```\n\n在此函数调用中，两个默认参数都将传递给参数。参数 `length` 将接收值 20.0，`width` 将接收值 10.0。函数的输出将是\n\n\
  ```\nThe area is 200\n```\n\n默认参数仅在从函数调用中省略实际参数时使用。在下面的调用中，指定了第一个参数，但省略了第二个：\n\n\
  ```cpp\nshowArea(12.0);\n```\n\n值 12.0 将传递给 `length`，而默认值 10.0 将传递给 `width`。函数的输出将是\n\
  \n```\nThe area is 120\n```\n\n\n\n\n当然，所有的默认参数都可以被覆盖。在下面的函数调用中，为两个参数都提供了参数：\n\n\
  ```\n showArea(12.0, 5.5);\n```\n\n此函数调用的输出将是：\n\n```\n The area is 66\n```\n\n\
  ## 注意事项\n\n函数的默认参数应该在函数名第一次出现的地方进行赋值。这通常是函数原型。然而，如果函数没有原型，则可以在函数头中指定默认参数。`showArea`\
  \ 函数可以定义如下：\n\n```\n void showArea(double length = 20.0, double width = 10.0)\n\
  \    {\n       double area = length * width;\n       cout << \"The area is \" <<\
  \ area << endl;\n    }\n```\n\n程序 6-22 展示了默认函数参数的使用。它包含一个在屏幕上显示星号的函数。该函数接收指定要显示多少行星号以及每行打印多少个星号的参数。提供默认参数是为了显示一行\
  \ 10 个星号。\n\n尽管 C++ 的默认参数非常方便，但它们在用法上并不完全灵活。当函数调用中省略了某个参数时，紧随其后的所有参数也必须被省略。在程序 6-22\
  \ 中的 `displayStars` 函数中，无法在不省略 `numRows` 参数的情况下省略 `starsPerRow` 参数。例如，下例函数调用将是非法的：\n\
  \n```\n displayStars(, 3);      // 非法函数调用！\n```\n\n然而，函数可以具有一些带有默认参数的参数而另一些没有。例如，在下面的函数中，只有最后一个参数有默认参数：\n\
  \n```\n // 函数原型\nvoid calcPay(int empNum, double payRate, double hours = 40.0);\n\
  \n// 函数 calcPay 的定义\nvoid calcPay(int empNum, double payRate, double hours)\n{\n\
  \    double wages;\n    wages = payRate * hours;\n    cout << \"Gross pay for employee\
  \ number \";\n    cout << empNum << \" is \" << wages << endl;\n}\n```\n\n调用此函数时，必须为前两个参数（`empNum`\
  \ 和 `payRate`）指定参数，因为它们没有默认参数。以下是有效的调用示例：\n\n```\n calcPay(769, 15.75);      //\
  \ 使用 hours 的默认参数\ncalcPay(142, 12.00, 20);  // 指定了小时数\n```\n\n当函数混合使用带默认参数和不带默认参数的参数时，带默认参数的参数必须声明在最后。在\
  \ `calcPay` 函数中，`hours` 不能在其他任何参数之前声明。以下原型是非法的：\n\n```\n // 非法原型\nvoid calcPay(int\
  \ empNum, double hours = 40.0, double payRate);\n\n```\n\n // 非法原型\nvoid calcPay(double\
  \ hours = 40.0, int empNum, double payRate);\n```\n\n以下是关于默认参数要点的总结：\n\n* 默认参数的值必须是一个字面量值或命名常量。\n\
  * 当函数调用中省略某个参数时（因为其有默认值），紧随其后的所有参数也必须被省略。\n* 当函数混合使用带默认参数和不带默认参数的参数时，带默认参数的参数必须定义在最后。\n\
  \n# 6.13 使用引用变量作为参数\n\n## 概念\n\n引用变量是引用另一个变量内存位置的变量。对引用变量进行的任何更改实际上都是对它所引用的变量进行的。引用变量有时被用作函数参数。\n\
  \n之前你已经看到参数通常是通过传值传递给函数的。这意味着参数只接收发送给它们的值的副本，并将其存储在函数的局部内存中。对参数值进行的任何更改都不会影响原始参数的值。\n\
  \n然而，有时我们希望函数能够更改调用函数（即调用该函数的函数）中的值。这可以通过将参数设为引用变量来实现。\n\n你已经在第 1 章中学习过，变量是可能存储数据的内存位置名称。当我们使用变量时，我们是在访问存储在分配给它的内存位置中的数据。`引用变量`是另一个变量的别名。它没有自己用于存储数据的内存位置，而是访问另一个变量的内存位置。对引用变量数据的任何更改实际上都是存储在另一个变量内存位置中的数据进行的。当我们使用引用变量作为参数时，它就变成了对应变量的别名。当以这种方式传递参数时，它被称为`按引用传递`。引用变量的定义与普通变量一样，只是在类型和名称之间有一个引用符号\
  \ `&`。例如，下面的函数定义使 `refVar` 成为引用变量：\n\n```\n void doubleNum(int &refVar)\n{\n  refVar\
  \ *= 2;\n}\n```\n\n你可以将空格放在符号之前或之后。`doubleNum` 函数头也可以写成：\n\n```\n void doubleNum(int&\
  \ refVar)\n```\n\n## 注意事项\n\n变量 `refVar` 是“对 int 的引用”。\n\n`doubleNum` 函数通过乘以 2 使\
  \ `refVar` 中存储的值翻倍。因为 `refVar` 是引用变量，此操作实际上发生在作为参数传递的变量上。\n\n引用参数的函数原型也必须引用符号。与函数头一样，它位于类型和变量名之间。如果原型中省略了变量名，引用符号直接跟随类型。以下所有\
  \ `doubleNum` 原型都是正确的：\n\n```\n void doubleNum(int &refVar);\n void doubleNum(int&\
  \ refVar);\n void doubleNum(int &);\n void doubleNum(int&);\n```\n\n你的老师会告诉你使用哪种形式。\n\
  \n## 注意事项\n\n任何使用引用变量作为参数的函数在其原型和头中必须出现引用符号。它在函数调用中不出现。\n\n程序 6-23 演示了使用引用变量作为参数的使用。\n\
  \n程序 6-23 中的参数 `refVar` “指向” `main` 函数中的 `value` 变量。当程序处理引用变量时，它实际上是在处理它所引用或指向的变量。这在图\
  \ 6-14 中所示。\n\n## 图 6-14 引用变量\n\n![图像显示了一个标记为“原始参数”的矩形。矩形内部显示数字 4。针对“4”的注释写着“引用变量”。](img/FG_06_014.png)\n\
  \n将引用变量作为函数参数在函数的目的是接受并存储在调用函数变量中的输入值时特别有用。引用参数的另一个用法是当必须从函数返回多个值时。如果函数是计算并返回单个值，通常认为使用返回值的函数并使用\
  \ `return` 语句发送该值更为合适。\n\n\n\n\n\n程序 6-24 是对程序 6-23 的修改。它添加了一个函数 `getNumNum()`，该函数接受用户输入并将其存储在\
  \ `userNum` 中。然而，参数 `userNum` 是 `main` 函数中变量 `value` 的引用，因此输入数据实际上存储在那里。程序 6-24\
  \ 还将函数 `doubleNum()` 重写为一个带返回值的函数。注意第 19 行，`main` 现在必须在 `doubleNum()` 返回值时将其存储起来。\n\
  \n## 注意事项\n\n只有变量可以按引用传递。如果你尝试将非变量参数（如字面量、常量或表达式）传递给引用参数，将导致错误。\n\n如果一个函数有多个参数是引用变量，在函数原型和函数头中，你必须为每个参数使用一个\
  \ 符号 `&`。以下是一个使用四个引用变量参数函数的原型：\n\n```\n void addThree(int& num1, int& num2, int&\
  \ num3, int& sum);\n```\n\n这里是函数的定义：\n\n```\n void addThree(int& num1, int& num2,\
  \ int& num3, int& sum)\n{\n    cout << \"Enter three integer values: \";\n    cin\
  \  >> num1 >> num2 >> num3;\n    sum = num1 + num2 + num3;\n}\n```\n\n然而，注意 `addThree()`\
  \ 函数实际上只需要一个引用参数 `sum`。其他三个参数可以通过传值接收参数，因为函数并没有修改它们。\n\n## 警告！\n\n只在绝对需要的地方使用引用变量。每当你允许函数修改函数外部的变量时，你就制造了潜在的调试问题。\n\
  \n# 何时按引用传递参数，何时按值传递参数\n\n新程序员经常在确定何时应该按引用将参数传递给函数，何时应该按值传递时遇到困难。如果必须将一个值“传回”调用函数，则有两种方法实现：使用引用参数或使用\
  \ `return` 语句。这使得问题变得更加复杂。以下是一些通用指南。\n\n*   当参数是常量时，它必须按值传递。只有变量可以按引用传递。\n*   当作为参数传递的变量不应该改变其值时，它应该按值传递。这可以保护它不被修改。\n\
  *   当恰好有一个值需要从函数“传回”调用程序时，通常应该通过 `return` 语句返回，而不是通过引用参数。\n*   当传递给函数的两个或多个变量需要由该函数改变其值时，它们应该按引用传递。\n\
  *   当无法合理或正确创建参数的副本时（例如参数是文件流对象时），它必须按引用传递。\n\n以下是引用参数的三个常见用法：\n\n*   当在函数中输入的数据值需要调用函数知道时\n\
  *   当函数必须更改调用函数中的现有值时\n*   当将文件流对象传递给函数时\n\n程序 6-25 说明了上述前两种用法。`getNums()` 函数使用引用变量作为参数，以便它可以将输入的值存储在\
  \ `main` 函数的 `small` 和 `big` 变量中。`orderNums()` 函数使用引用变量作为参数，以便当它交换传递给它的两个项时，这些值实际上会在\
  \ `main` 函数中交换。\n\n# 将文件传递给函数\n\n如前所述，当将文件流对象传递给函数时，应始终使用引用参数。程序 6-26 展示了如何将文件传递给函数。该程序使用的\
  \ `weather.dat` 文件包含以下七个值：72  83  71  69  75  77  70。它可以在章节 中找到。\n\n也可以将一个打开的文件传递给函数并让其读取文件。`weather.dat`\
  \ 文件程序 6-24 展示了这种用法。每当 `read()` 被调用时，它通过引用参数存储数据，这样 `main` 函数就能看到这些数据。\n\n\n\n\n\
  有时，你会创建两个或多个执行相同操作但使用不同参数集或不同数据类型参数的函数。例如，在程序 6-12 中有一个使用 `double` 参数的 `square`\
  \ 函数。但假设你还想要一个专门用于整数类型并接受 `int` 作为参数的 `square` 函数。这两个函数的作用相同：返回其参数的平方。唯一的区别是操作中涉及的数据类型。如果你在同一个程序中使用这两个函数，可以为每个函数分配一个唯一的名称。例如，其中一个可以命名为\
  \ `squareInt`，另一个命名为 `squareDouble`。然而，C++ 允许你对函数进行**重载**（`overload`）。这意味着只要参数列表不同，就可以为多个函数分配相同的名称。程序\
  \ 6-28 说明了这一点。\n\n以下是程序 6-28 中使用的 `square` 函数头头：\n\n```\n int square(int number)\n\
  double square(double number)\n```\n\n在 C++ 中，每个函数都有一个签名。**函数签名**（`function signature`）是函数的名称以及按正确排列的函数参数的数据类型。程序\
  \ 6-28 中的 `square` 函数将具有以下签名：\n\n```\n square(int)\nsquare(double)\n```\n\n当调用重载函数时，C++\
  \ 使用函数签名将其与其他相同名称的函数区分开来在程序 6-28](#fileP7001016089000000000000000004FCC.xhtml_P7001016089000000000000000004FD9)中，当将\
  \ `int` 参数传递给 `square` 时，将调用带有 `int` 参数的函数版本。同样，当将 `double` 参数传递给 `square` 时，将调用带有\
  \ `double` 参数的版本。\n\n注意函数的返回值不是签名的一部分。以下函数**不能**在同一个程序中使用，因为它们的参数列表不同：\n\n```\n\
  \ int square(int number)\n{\n    return number * number\n}\ndouble square(int number)\
  \  // 错误！参数列表必须不同\n{\n    return number * number\n}\n```\n\n当存在使用不同数量参数的相似函数时，重载也非常方便。例如，考虑一个返回整数和的函数程序。一个返回两个整数之和，另一个返回三个整数之和，还有一个一个返回四个整数之和。以下是它们的函数头：\n\
  \n```\n int sum(int num1, int num2)\nint sum(int num1, int num2, int num3)\nint\
  \ sum(int num1, int num2, int num3, int num4)\n```\n\n由于每个函数的参数数量不同，它们都可以在同一个程序中使用。程序\
  \ 6-29 使用了两个命名为 `calcWeeklyPay` 的函数来确定员工的周薪。该函数的一个版本使用 `int` 和 `double` 参数，而另一个版本只使用一个\
  \ `double` 参数。\n\n# 6.15 `exit()` 函数\n\n## 概念\n\n`exit()` 函数会导致程序终止，无论正在执行哪个函数或控制机制。\n\
  \n当在函数 `main` 中遇到 `return` 语句时，C++ 程序会停止执行。然而，当其他函数结束时，程序不会停止。程序的控制权返回到函数调用后的位置。然而，在某些罕见情况下，必须在\
  \ `main` 以外函数中终止程序。为了实现这一点，使用了 `exit` 函数。\n\n当调用 `exit` 函数时，无论调用位于哪个函数，它都会导致程序停止。程序\
  \ 6-30 说明了这一点。\n\n\n\n\n```\n 健身俱乐部会员菜单 \n1. 标准成人会员\n2. 儿童会员\n3. 老年人会员\n4. 退出程序\n\
  \n1[回车] \n几个月？3[回车] \n调用 showFees 函数时传入的参数为：\n成员类型: 成人\n费率: 120.00\n月份: 3\n\n  \
  \     健身俱乐部会员菜单\n1. 标准成人会员\n2. 儿童会员\n3. 老年人会员\n4. 退出程序\n\n4[回车]\n```\n\n如你所见，通过用存根（stub）替换实际函数，你可以将测试精力集中在程序中调用函数部分。主要，存根允许你确定程序是否在预期的时刻调用了函数，并确认是否向函数传递了有效值。如果存根代表一个返回返回值的函数，那么存根就应该返回一个测试值。这有助于你确认返回值是否被正确处理。当调用函数的程序部分调试到你满意时，就可以开始测试和调试函数本身了。这就是驱动程序（driver）派上用场的地方。\n\
  \n`driver` 是通过简单调用函数来测试函数的程序。如果函数接受任何参数，驱动程序就会传递测试数据。如果函数返回一个值，驱动程序会在屏幕上显示该返回值。这允许你看到函数在独立于其最终所属的其他程序部分时的表现。程序\
  \ 6-31 是测试健身俱乐部会员程序中 `showFees` 函数的驱动程序。\n\n如程序 6-31 所示，驱动程序可以用来测试函数。它可以反复使用不同的测试值作为参数调用该函数。当函数执行符合预期时，就可以将其放入它所属的实际程序中。\n\
  \n# 6.17 小乐透案例研究\n\n## 问题描述\n\n杰斐逊初中学的数学部门希望开发一个程序，以一种趣味的方式向学生演示基础概率论。特别是，他们想要开发一个名为“小乐透”的程序来模拟抽票。在程序中，学生可以指定选择集中的数字数量（1–12）以及顾客必须选择并与中奖号码匹配的数字数量（1\
  \ 到选择集大小之间）。所选数字的顺序并不重要。\n\n## 示例输出\n\n此示例输出精确地说明了部门希望程序执行的操作。\n\n```\n 本程序将告诉你赢得“小乐透”的概率。\n\
  \n有多少个数字 (1-12) 可供选择？12\n你必须选择几个数字来玩？5\n\n你中奖票的机会是 792 次中的 1 次。\n该概率为 0.0013\n```\n\
  \n## 程序设计\n\n### 程序步骤\n\n程序必须执行以下通用步骤：\n\n1. 获取并验证可选数字的数量 (`n`)。\n2. 获取并验证这些数字中必须被选择的数量\
  \ (`k`)。\n3. 计算从包含 `n` 个元素的集合中选择 `k` 个元素的组合数。\n4. 向玩家报告其中奖机会和中奖概率。\n\n### 程序模块\n\
  \n程序将设计为一组模块，每个模块都有一个特定的函数。6-1 描述了将使用的模块：\n\n### 表 6-1 程序模块\n\n| 模块名称 | 描述 |\n|\
  \ --- | --- |\n| `main` | 组织函数并报告结果。 |\n| `getLottery` | 获取 n 并验证 k。 |\n| `computeWays`\
  \ | 计算从 n 中选择 k 的。 |\n| `factorial` | 被 `computeWays` 调用。 |\n\n## 程序组织\n\n在之前的章节中，使用了层次图来展示程序逻辑。然而，程序被组织成一组函数，以展示程序必须执行的操作。图\
  \ 6-15 展示了程序的组织。\n\n### 图 6-15 小乐透层次图\n\n![显示小乐透程序的层次图](img/FG_0601.png)\n\n###\
  \ 输入变量\n\n```\n int pickFrom         // 可选数字的数量\n int numicks         // 必须选择的数字数量\n\
  ```\n\n### 输出变量\n\n```\n float ways          // 中奖概率\n```\n\n### 每个模块的详细伪代码\n\n\
  在模块化程序中，应为每个函数创建一个独立的伪代码以捕捉逻辑。以下是小乐透程序中每个函数的伪代码。\n\n```\n main \n    显示程序的功能\n \
  \   Call getLottery       // 传入 pickFrom 和 numicks\n    Call computeWays       //\
  \ 返回可能的组合数\n    将返回的结果存储在 ways 变量中\n    显示 ways 和 1\nEnd main\n\ngetLottery    \
  \            // 传入变量\n    输入 pickFrom\n    当 pickFrom < 1 或 pickFrom > 12\n    \
  \    显示错误消息\n        输入 pickFrom\nEnd while\n    输入 numPicks\n    当 numPicks < 1\
  \ 或 numPicks > pickFrom\n        显示错误消息\n        输入 pickFrom\nEnd getLottery\n\n\
  computeWays        // 接收 pickFrom 为 n，numicks 为 k\n    调用 factorial 多次以获取信息\n  \
  \  Return factorial(n)\n    Return factorial(k) * factorial (n-k)\nEnd computeWays\n\
  \nfactorial        // 接收要计算的阶乘\n    factTotal = 1\n    循环 count 从数字 到 1\n      \
  \  factTotal = factTotal * count\n```\n```\n\n### 程序\n\n在对伪代码进行逻辑检查后，下一步是将伪代码扩展为最终程序。这在程序\
  \ 6-32 中所示。\n\n## 高险旅行社案例研究\n\n以下额外的案例研究可以在本书的配套网站 [pearsonhighered.com/gaddis](http://pearsonhighered.com/gaddis)\
  \ 上找到。它包含了对第 6 章](#fileP7001016089000000000000000000511D.xhtml_P700101608900000000000000000454F)材料的应用，演示了开发一个模块化程序以计算并列出高险旅行社提供的旅游套餐所需的所有步骤。\n\
