  \ N-4 完整替代文本\n\n# 选择结构\n\n在选择结构中，下一个执行的操作取决于真/假测试的结果。该语句为真或假。在最简单的选择结构中，如果测试结果为真，则执行一组指令；如果结果为假，则跳过这些指令。在流程图中，使用新符号——菱形来表示真/假语句。图\
  \ N-5 显示了这种选择结构的通用形式。\n\n# 图 N-5\n\n![图表显示了一个选择结构。](img/FG_AppN_005.png)图 N-5 完整替代文本\n\
  \n图 N-6 说明了这种选择结构的用法。在这个流程图中，对称为“条件”的语句 `x < y` 被测试。如果该条件为真，则执行过程 A 中的语句。如果条件为假，则跳过过程\
  \ A 的语句。这种选择结构在 C++ 中编码为 `if` 语句。\n\n# 图 N-6\n\n![图表显示了一个选择结构。](img/FG_AppN_006.png)图\
  \ N-6 完整替代文本\n\n一种稍微复杂一点的选择结构允许在测试条件为真时执行一组语句，在测试条件为假时执行另一组语句。图 N-7 说明了这种形式的选择结构。\n\
