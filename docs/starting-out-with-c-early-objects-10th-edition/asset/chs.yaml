  \ 和 `updateLosses` 成员函数，每个函数各加 1。它还应有一个 `displayRecord` 函数，产生一个格式良好的显示，包含团队名称、到目前为止的胜、平、负次数以及积分。通过创建一个菜单驱动程序来演示该类，该程序创建一个\
  \ `teamScore` 对象，然后包含一个循环根据用户选择调用相应的函数。\n\n# 11. 预算表\n\n一名学生建立了以下每月预算：\n\n| 住房 |\
