  \ d;\n10     advisor = adv;\n11 }\n```\n\n重要的是，基类构造函数的参数必须指定在派生类构造函数的*定义*中，而不是在*声明*中。以\
  \ `Student` 类为例，构造函数的声明位于 `inheritance2.cpp` 文件的第 26 行。对应的定义位于 `inheritance2.cpp`\
  \ 文件的第 5 行。\n\n# 思考\n\n1. 11.48 为什么基类构造函数会在派生类构造函数之前调用？\n\n2. 11.49 你认为为什么基类构造函数的参数指定在派生类构造函数的定义中而不是声明中？\n\
  \n3. 11.50 向基类构造函数传递参数解决了继承中选择基类构造函数的问题。组合组合中也会出现类似的问题吗？也就是说，是否可能在某些情况下，类的构造函数必须将参数传递给包含的类的构造函数？如果是这样，猜测用于传递参数的语法，并构造一个简单的示例来验证你的猜测。\n\
  \n4. 11.51 以下程序将显示什么？\n\n\n\n\n\n```cpp\n#include <iostream>\n#include <memory>\n\
  using namespace std;\n\nclass Base\n{\npublic:\n   Base() { cout << \"Entering the\
  \ base.\\n\"; }\n    virtual ~Base() { cout << \"Leaving the base.\\n\"; }\n};\n\
  class Camp : public Base\n{\npublic:\n   Camp() { cout << \"Entering the camp.\\\
  n\"; }\n   virtual ~Camp() { cout << \"Leaving the camp.\\n\"; }\n};\nint main()\n\
