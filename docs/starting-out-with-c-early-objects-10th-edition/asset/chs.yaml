  \ 什么时候应该使用 `static` 局部变量？\n\n# 算法工作台 (Algorithm Workbench)\n\n33. 下述语句调用了一个名为 `half`\
  \ 的函数，该函数返回传递给它的参数值的一半。\n\n```\nresult = half(number);\n```\n\n34. 假设 `result` 和\
  \ `number` 都已定义为 `double` 变量。编写 `half` 函数。\n\n35. 程序包含以下函数。\n\n```cpp\nint cube(int\
  \ num)\n{\n    return num * num * num;\n}\n```\n\n36. 写一条语句，将值 4 传递给此函数并将其返回值赋值给变量\
  \ `result`。\n\n37. 写一个名为 `timesTen` 的函数，接受一个整数参数。当函数被调用时，它应该显示其参数乘以 10 的积。\n\n38.\
  \ 程序包含以下函数。\n\n```cpp\nvoid display(int arg1, double arg2, char arg3)\n{\n    cout\
  \ << \"Here are the values: \"\n         << arg1 << \" \" << arg2 << \" \" << arg3\
