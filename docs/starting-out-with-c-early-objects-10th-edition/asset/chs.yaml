  \ 和 `costPerSqIn`。请以内联的形式编写这些代码。\n\n4. 7.23 编写四行代码，这些代码可能出现在使用 `Pizza` 类的客户端程序中，用于以下操作：\n\
  \n* 定义一个名为 `myPizza` 的 `Pizza` 类实例。\n* 调用 `Pizza` 函数设置价格。\n* 调用 `Pizza` 函数设置尺寸（即半径）。\n\
  * 调用 `Pizza` 函数返回每平方英寸的价格并将其打印。\n\n# 7.11 分离类规范、实现和客户端代码\n\n## 概念\n\n通常，类声明存储在各自的头文件中，而成员函数定义存储在各自的\
  \ `.cpp` 文件中。\n\n在我们目前为止过的程序中，类声明、成员函数定义以及使用该类的应用程序都存储在一个文件中。一种更常规的 C++ 程序设计方法是将这些内容存储在三个独立的文件中。通常，程序组件以以下方式存储：\n\
  \n* 类声明存储在它们各自的头文件中。包含类声明的头文件被称为*类规范文件*（class specification file）。类规范文件的文件名通常与类名相同，扩展名为\
  \ `.h`。例如，`Rectangle` 类将在 `Rectangle.h` 文件中声明。\n* 任何使用该类的程序都应该 `#include` 这个头文件。\n\
  * 类的成员函数定义存储在一个单独的 `.cpp`文件中，该文件被称为*类实现文件*（class implementation file）。该文件通常与类名相同，扩展名为\
  \ `.cpp`。例如，`Rectangle` 类的成员函数将在 `Rectangle.cpp` 文件中定义。\n* 类的 `.cpp` 文件应该与使用该类的应用程序一起编译和链接。该程序也被称为*客户端程序*（client\
  \ program）或*客户端代码*（client code），它是包含 `main` 函数的文件。这个过程可以通过 `project` 或 `make` 工具实现自动化。如\
  \ Visual Studio 等集成开发环境也提供了创建多文件项目的方法。\n\n让我们看看如何使用这种设计方法重写 [程序 7-3]（矩形程序）。首先，`Rectangle`\
  \ 类声明将存储在下面的 `Rectangle.h` 文件中。\n\n# `Rectangle.h` 内容\n\n```cpp\n 1 // Rectangle.h\
  \ 是 Rectangle 类规范文件。\n 2 #ifndef RECTANGLE_H\n 3 #define RECTANGLE_H\n 4 \n 5 //\
  \ Rectangle 类声明\n 6 class Rectangle\n 7 {\n 8    private:\n 9       double length;\n\
  10       double width;\n11    public:\n12       bool setLength(double);\n13    \
  \   bool setWidth(double);\n14       double getLength();\n15       double getWidth();\n\
  16       double calcArea();\n17 };\n18 #endif\n```\n\n这是 `Rectangle` 类的规范文件。它只包含\
  \ `Rectangle` 类的声明，不包含任何成员函数定义。当我们编写其他使用 `Rectangle` 类的程序时，可以使用一个 `#include` 指令来包含此文件。这样，我们就不需要在使用\
  \ `Rectangle` 类的程序中重复编写类声明。\n\n该文件还引入了两个新的预处理器指令：`#ifndef` 和 `#endif`。出现在第 2 行的\
  \ `#ifndef` 指令被称为*包含保护*（include guard）。它防止头文件被意外包含多次。当你的主程序文件包含对某个头文件的 `#include`\
  \ 指令时，始终存在该头文件包含对另一个头文件的 `#include` 指令的可能性。如果你的主程序文件也有对第二个头文件的 `#include` 指令，预处理器将两次包含第二个头文件。除非在第二个头文件中编写了包含保护，否则将发生错误，因为编译器会处理两次第二个头文件中的声明。让我们看看包含保护是如何工作的。\n\
  \n`ifndef` 词代表“if not defined”（如果未定义）。它用于确定某个特定常量是否已通过另一个 `#define` 指令定义。当正在编译 `Rectangle.h`\
  \ 文件时，`#ifndef` 指令会检查名为 `RECTANGLE_H` 的常量是否存在。如果该常量尚未定义，它会立即在第 3 行被定义，并包含文件的其余部分。然而，如果常量已经定义，则意味着该文件已经被包含。在这种情况下，它不会被第二次包含。相反，`#ifndef`\
  \ 和 `#endif` 指令之间的所有内容将被跳过。注意，在 `#ifndef` 和 `#define` 指令中使用的常量应该全大写，并且习惯上命名为 `FILENAME_H`，其中\
  \ `FILENAME` 是头文件的文件名。\n\n接下来，我们需要一个包含类成员函数定义的实现文件。`Rectangle` 类的实现文件是 `Rectangle.cpp`。\n\
  \n# `Rectangle.cpp` 内容\n\n\n\n\n\n```cpp\n1 // Rectangle.cpp 是 Rectangle 类函数的实现文件。\n\
  2 #include \"Rectangle.h\"\n3 \n4 /*******************************************************************\n\
  5 *                    Rectangle::setLength                         *\n6 * 如果传递给\
  \ setLength 函数的参数为零或     *\n7 * 大，它将被复制到成员变量 length 中，并返回 true *\n8 * 如果参数为负数，length\
  \ 的值将保持不变   \n9 * 并返回 false。                        *\n10 ****************************************************/\n\
  11 bool Rectangle::setLength(double len)\n12 {\n13    bool validData = true;\n14\
  \ \n15    if (len >= 0)               // 如果 len 有效\n16       length = len;     \
  \       // 拷贝给 length\n17    else\n18       validData = false;       // 否则保持 length\
  \ 不变\n19    \n20    return validData;\n21 }\n22 \n23 /**************************************************\n\
  24 *                    Rectangle::setWidth                         *\n25 * 如果传递给\
  \ setWidth 函数的参数为零或     *\n26 * 大，它将被复制到成员变量 width 中，并返回 true *\n27 * 如果参数为负数，width\
  \ 的值将保持不变   \n28 * 并返回 false。                       *\n29 ***************************************************/\n\
  30 bool Rectangle::setWidth(double w)\n31 {\n32    bool validData = true;\n33 \n\
  34    if (w >= 0)                 // 如果 w 有效\n35       width = w;              \
  \ // 拷贝给 width\n36    else\n37       validData = false;       // 否则保持 width 不变\n\
  38    \n39    return validData;\n40 }\n41 \n42 /**************************************************************\n\
  43 *                     Rectangle::getLength                   *\n44 * 此函数返回成员变量\
  \ length 的值。 *\n45 ***************************************************************/\n\
  46 double Rectangle::getLength()\n47 {\n48    return length;\n49 }\n50 \n51 /**************************************************************\n\
  52 *                     Rectangle::getWidth                    *\n53 * 此函数返回成员变量\
  \ width 的值。  *\n54 ***************************************************************/\n\
  55 double Rectangle::getWidth()\n56 {\n57    return width;\n58 }\n59 \n60 /*******************************************************************\n\
  61 *                        Rectangle::calcArea                      *\n62 * 此函数计算并返回矩形的面积。\
  \ *\n63 ********************************************************************/\n\
  64 double Rectangle::calcArea()\n65 {\n66    return length * width;\n67 }\n```\n\
  \n查看这五个函数的代码。请注意，三个访问器函数 `getLength`、`getWidth` 和 `calcArea` 与 程序 7-3 中出现的是相同的。然而，对两个修改器函数\
  \ `setLength` 和 `setWidth` 进行了更改，以说明公共类函数保护私有成员数据的另一种方法。在 程序 7-3 中，`setLength` 和\
  \ `setWidth` 函数在向它们传递无效数据时会对 `length` 和 `width` 使用默认值。在 `Rectangle.cpp` 代码中，这两个函数返回一个布尔值，用于指示接收的值是否已存储在成员变量中。如果接收到有效参数，则将其存储在成员变量并返回\
  \ `true`。如果接收到无效参数，则成员变量保持不变并返回 `false`。使用该类的客户端程序必须测试返回的布尔值以决定如何继续。\n\n现在看第 2 行，它包含以下\
  \ `#include` 指令：\n\n```cpp\n#include \"Rectangle.h\"\n```\n\n该指令包含了 `Rectangle.h`\
  \ 文件，该文件包含了 `Rectangle` 类声明。注意，头文件的名称被包含在双引号（`\" \"`）中，而不是尖括号（`< >`）。当你包含 C++ 系统头文件（如\
  \ `iostream`）时，你将文件名称包含在尖括号中。这表示该文件位于编译器的*包含头文件目录*（include file directory）中。也就是说，它是所有标准\
  \ C++ 头文件所在的目录或文件夹。当你包含包含自己编写的头文件（例如类规范文件）时，你将文件名包含在双引号中。这表示该文件位于当前项目目录。\n\n任何使用\
  \ `Rectangle` 类的文件都必须有 `Rectangle.h` 文件的 `#include` 指令。我们需要在类规范文件中包含 `Rectangle.h`，因为该文件中的函数属于\
  \ `Rectangle` 类。在编译器处理带有 `Rectangle::` 的函数之前，它必须已经处理了 `Rectangle` 的声明。程序 7-3 是修改后的版本。\n\
  \n现在我们已经创建了该程序的文件，必须执行以下步骤来创建执行文件：\n\n*   首先，编译实现文件 `Rectangle.cpp` 以生成对象文件。该文件通常命名为\
  \ `Rectangle.obj`。\n*   接下来，编译主程序文件 `pr7–12.cpp` 以生成对象文件。该文件通常命名为 `pr7–12.obj`。\n\
  *   最后，将对象文件 `pr7–12.obj` 和 `Rectangle.obj` 链接在一起以生成执行文件，其文件名可能是 `pr7–12.exe`。\n\
  \n所有的 `.h` 和 `.cpp` 文件都可以在书籍配套网站的第 7 章程序文件夹中找到。\n\n# 表 7-1 程序 7-12 使用的文件\n\n| 文件\
