  \ 继承层次结构中的类型兼容性\n\n## 概念\n\n在任何期望基类对象的地方，都可以派生类对象。\n\n### 继承层次结构\n\n正如你在第 11 章 中中学到的，如果新类是现有类的特殊版本，那么基于现有类创建一个新类通常是有意义的。派生类本身随后可以作为其他类的基类，从而形成继承层次结构。例如，在第\
  \ 11 章中，我们使用继承过程创建了一个包含几个类的层次结构：`Person`、`Student`、`Faculty` 和 `TFaculty`。继承关系通常用矩形表示类，并用从派生类指向基类的箭头表示，如图\
  \ 15-1 所示。\n\n# 图 15-1 继承层次结构\n\n![树状图显示了继承层次结构。](img/FG_15_001.png)图 15-1 继承层次结构完整替代文本。\n\
  \n当然，这种层次结构可以扩展。例如，`Student` 类本身可以被用另外两个派生类 `CStudent` 和 `RStudent` 的基类。最后这两个类可能用于表示一种通勤的学生类型和另一种类住在校园的学生类型。\n\
  \n### 继承中的类型兼容性\n\n在继承层次结构的不同类之间存在某些类型兼容性关系。由于继承层次结构中的对象通常通过指针访问，我们以指针的形式阐述这些规则：\n\
  \n*   `派生类指针始终可以赋值给基类指针`。这意味着基类指针可以指向派生类对象。\n*   `执行基类指针到派生类指针的反向赋值需要进行类型转换`。\n\n\
  \n\n\n```cpp\n1 #include <string>\n2 #include <memory>\n3 using namespace std;\n\
  4\n5 enum class Discipline { ARCHEOLOGY, BIOLOGY, COMPUTER_SCIENCE };\n6 enum class\
  \ Classification { FRESHMAN, SOPHOMORE, JUNIOR, SENIOR };\n7 class Person\n{\nprotected:\n\
  \    string name;\npublic:\n    Person() { setName(\"\"); }\n    Person(const string&\
  \ pName) { setName(pName); }\n    void setName(const string& pName) { name = pName;\
  \ }\n    string getName() const { return name; }\n};\n\n18 class Student : public\
  \ Person\n{\nprivate:\n    Discipline major;\n    shared_ptr<Person> advisor;\n\
  public:\n    Student(const string& sname, Discipline d,\n            const shared_ptr<Person>&\
  \ adv) : Person(sname)\n    {\n        major = d;\n        advisor = adv;\n    }\n\
  \    void setMajor(Discipline d) { major = d; }\n    Discipline getMajor() const\
  \ { return major; }\n    void setAdvisor(shared_ptr<Person> p) { advisor = p; }\n\
  \    shared_ptr<Person> getAdvisor() const { return advisor; }\n};\n\n36 class Faculty\
  \ :public Person\n{\nprivate:\n    Discipline department;\npublic:\n    Faculty(const\
  \ string& fname, Discipline d) : Person(fname)\n    {\n        department = d;\n\
  \    }\n    void setDepartment(Discipline d) { department = d; }\n    Discipline\
  \ getDepartment() const { return department; }\n};\n\n49 class TFaculty : public\
  \ Faculty\n{\nprivate:\n    string title;\npublic:\n    TFaculty(const string& fname,\
  \ Discipline d, string title)\n        : Faculty(fname, d)\n    {\n        setTitle(title);\n\
  \    }\n    void setTitle(const string& title) { this->title = title; }\n\n    //\
  \ Override getName()\n    string getName() const\n    {\n        return title +\
  \ \" \" + Person::getName();\n    }\n};\n```\n\n以下是将派生类指针赋值给基类指针的其他示例：\n\n```cpp\n\
  shared_ptr<Person> ptp;\nshared_ptr<TFaculty> ptf;\n// 将派生类指针赋值给基类指针\nptp = make_shared<TFaculty>(\"\
  Indiana Jones\",\n                            Discipline::ARCHEOLOGY, \"Dr.\");\n\
  // 将基类指针赋值给派生类指针\n// 需要进行类型转换\nptf = static_pointer_cast<TFaculty>(ptp);\n```\n\n\
  在这段代码中，一个新创建的派生类 `TFaculty` 对象指针被赋值给基类指针 `ptp`。然后，该基类指针通过类型转换被赋值给 `ptf`。\n\n这些类型兼容性规则还适用于另外两种情况：声明为基类指针的函数参数可以接受指向派生类对象的指针。此外，一个声明返回类型为指向特定类\
  \ `C` 指针的函数，可以返回指向自自 `C` 的派生类对象的指针。\n\n# 基类指针的类型转换\n\n我们已经看到，指向特定类的指针实际上可能指向一个派生类对象。在这种情况下，指针的类类型将与对象的类类型不同。例如，考虑以下语句\n\
  \n```cpp\nshared_ptr<Person> pPerson = \nmake_shared<Faculty>(\"Donald Knuth\",Discipline::COMPUTER_SCIENCE);\n\
  ```\n\n尽管这种赋值是合法的，但 `pPerson` 指针无法感知除从 `Person` 继承之外以外的 `Faculty` 类成员。因此，通过 `pPerson`\
  \ 访问 `Faculty` 类的非继承成员会被编译器拒绝：\n\n```cpp\npPerson->setDepartment(Discipline::BIOLOGY);\
  \ // 错误！\n```\n\n如果我们确实知道 `pPerson` 实际上指向一个 `Faculty` 对象，我们可以使用类型转换来引导编译器接受该语句：\n\
  \n```cpp\nstatic_pointer_cast<Faculty> (pPerson)\n           -> setDepartment(Discipline::BIOLOGY);\n\
  ```\n\n类型转换告诉编译器 `pPerson` 实际上指向一个 `Faculty` 对象。或者，我们可以先将 `pPerson` 转换为存储在 `pFaculty`\
  \ 中的指向 `Faculty` 的指针，然后使用它来访问 `Faculty` 特有的成员：\n\n```cpp\nshared_ptr<Faculty> pFaculty\
  \ = static_pointer_cast<Faculty>(pPerson);\npFaculty->setDepartment(Discipline::BIOLOGY);\n\
  ```\n\n通常情况下，指向派生类对象的基类指针在可以使用派生类的额外功能之前，必须经过适当的类型转换。回想第 11 章。\n\n# 15.2 多态与虚成员函数\n\
  \n## 概念\n\n虚函数允许选择继承层次结构中最具体的成员函数版本。虚函数使得多态成为可能。\n\n如果执行代码时使用不同类型会产生不同的行为，则称这段代码是*多态的*。例如，如果给一个函数传递了不同的类型，则该函数被认为是多态的。\n\
  \n为了说明多态，请考虑以下程序 程序 15-2。该程序创建了一个包含 `Student`、`Faculty` 和 `TFaculty` 类型的 `Person`\
  \ 对象（指针）的向量。然后它使用相同的代码打印所有名称。由于向量只能存储一种类型的元素，我们必须使用基类指针的向量。\n\n\n\n\n\n```cpp\n\
  class B\n{\npublic:\n   void mfun()\n   {\n      cout << \"Base class version\"\
  ;\n   }\n};\nclass D : public B\n{\npublic:\n   void mfun()\n   {\n      cout <<\
  \ \"Derived class version\";\n   }\n};\nshared_ptr<Base> ptr = make_shared<D>();\n\
  ```\n\n我们想要告诉编译器，每当我们写\n\n```\nptr−>mfun()\n```\n\n编译器都应该选择派生类中更具体的 `mfun()` 版本。在\
  \ C++ 中，我们可以通过在基类中将 `mfun()` 声明为 `virtual` 函数来实现这一点。虚函数在 C++ 中用于支持多态行为。因此，为了让类 `B`\
  \ 及其所有派生类中的 `mfun()` 实现多态行为，我们必须如下修改 `B` 的定义：\n\n```cpp\nclass B\n{\npublic:\n \
  \  virtual void mfun()\n   {\n      cout << \"Base class version\";\n   }\n};\n\
  ```\n\n虚函数特性是可以继承的：也就是说，如果派生类的成员函数重写了基类中的虚函数，那么该成员函数本身也会变成虚函数。因此，在 `B` 中将 `mfun`\
  \ 声明为虚函数使得 `D` 以及所有派生自 `D` 的类中的 `mfun` 都变成了虚函数。\n\n虽然并非必须，但许多程序员会为所有虚函数标记 `virtual`\
  \ 关键字以便于识别。这是一种良好的 get，因此，`D` 的定义应该如下所示：\n\n```cpp\nclass D : public B\n{\npublic:\n\
  \   virtual void mfun()\n   {\n      cout << \"Derived class version\";\n   }\n\
  };\n```\n\n在这个示例中，虚函数在类声明内部进行了定义。如果虚成员函数定义在类声明之外，则 `virtual` 关键字将放在类内部的声明中，而不是定义处中。\n\
  \n接下来的程序 程序 15-3 是 程序 15-2 的修改。在其中，`Person` 类的 `getName` 函数被声明为虚函数。它包含了 `inheritance5.h`\
  \ 文件，该文件是对 `inheritance4.h` 文件的修改，使得 `Person` 类中的 `getName` 函数变为虚函数。\n\n# 动态绑定与静态绑定\n\
  \n我们说编译器在调用函数名时选择应该执行的代码，它便对函数名进行了*绑定*（*bind**。换句话说，当函数被调用时，编译器将名称绑定到函数定义。\n\n*静态绑定*发生在编译时，并将名称绑定到固定的函数定义上，该定义在每次调用该名称时都会执行。例如，在上一节的\
  \ 程序 15-2 中，编译器使用静态绑定将语句中的 `getName` \n\n```cpp\nfor (int k = 0; k < people.size()\
  \ k++)\n{\n   cout << people[k]−>getName() << endl;\n}\n```\n\n绑定到 `Person` 类中 `getName`\
  \ 的定义。\n\n在静态绑定中，编译器使用编译时的可用类型信息。如果代码正在操作继承层次结构中不同类的对象，编译器可获得的唯一类型信息将是用于访问所有对象的基类指针类型。因此，静态绑定将始终使用成员函数的基类版本。\n\
  \n相比之下，*动态绑定*（*dynamic binding*）发生在运行时。只有当编译器能够在运行时确定子类对象所属的切类时，动态绑定才能起作用。然后编译器使用此运行时类型信息来调用在该类中定义的函数版本。为了使动态绑定成为可能，编译器在具有虚函数的类的每个对象中存储运行时类型信息。动态绑定始终使用对象实际类中的成员函数版本，无论用于访问对象的指针属于什么类。\n\
  \n关于动态绑定和运行时类型信息的更多信息，可以在书籍辅助网站的 附录 K 中找到。\n\n# 11 C++ 11 的 `override` 和 `final`\
  \ 关键字\n\nC++ 11 引入了 `override` 关键字以帮助防止重写虚函数时出现细微错误。例如，你能找到 程序 15-4 中的错误吗？\n\n#\
  \ 防止成员函数被重写\n\n在某些派生类中，你可能希望确保虚函数在类层次结构的更深无法被重写。当成员函数用 `final` 关键字声明时，它不能在派生类中被重写。下面的成员函数原型是一个\
  \ `final` 关键字的示例：\n\n```cpp\nvirtual void message() const final;\n```\n\n# 15.3\
  \ 抽象基类与纯虚函数\n\n## 概念\n\n抽象类和纯虚函数可以定义派生类必须实现的接口。\n\n为继承层次结构创建一个基类通常很有方便，定义一个每个派生类都实现的成员函数，但基类本身无法实现它——合理实现的细节只能在派生类中找到。在这种情况下，C++\
  \ 语言允许程序员将该函数声明为纯虚函数，即类未提供任何实现的成员函数。C++ 声明纯虚函数的方法是在类声明中原本放置函数体的地方放置 `=` `0`。例如，如果一个成员函数\
  \ `draw()` 被声明为纯虚函数，那么它在类中的声明看起来如下：\n\n```cpp\nvoid draw() = 0;\n```\n\n纯虚函数有时被称为*抽象*函数（*abstract\
  \ function*），包含至少一个纯虚函数的类被称为*抽象*类（*abstract class*）。C++ 编译器不允许你实例化抽象类。抽象类只能被子类化：也就是说，你只能将它们作为基类来派生其他类。\n\
  \n\n\n\n派生自抽象类的类继承了基类中的所有函数，并且除非它重写了所继承的所有抽象函数，否则它本身仍然是一个抽象类。抽象类的用处在于它们定义了一个接口，该接口必须由所有派生于该抽象类的对象来支持。\n\
  \n你可以将抽象类类为除了属于某些子类的实例外，没有其他实例的类。现实生活中有很多抽象类的例子。例如，在动物界中，所有动物的“动物（Animal）”类就是一个抽象类。不存在不实际属于某个子类的动物实例。有动物是狗、鸡或狐狸的动物，但不存在仅仅是“动物”的动物。\n\
  \n考虑一个图形系统，它由一组形状组成，这些形状必须在屏幕上的特定位置进行绘制。每个形状对象都应该有一些成员变量来跟踪它的位置，并有一个成员函数用于在正确的位置绘制该形状。系统支持的不同形状可能包括矩形、六边形等。因为矩形是一种形状，六边形也是一种形状，因此拥有一个\
  \ `Shape` 类并让 `Rectangle` 和 `Hexagon` 成为派自 `Shape` 的类是有意义的。`Shape` 类将有一个用于设置形状位置的成员函数\
  \ `setPosition`，以及一个用于绘制形状的成员函数 `draw`。然而，由于 `Shape` 是一个抽象类（没有任何形状仅仅是“形状”；它必须是矩形、六边形、三角形或其他），绘制特定形状的逻辑必须委托给适当的子类。因此，`draw()`\
  \ 函数不能在 `Shape` 类中实现，而必须成为纯虚函数。\n\n[程序 15-6 显示了一个带有两个派生类的 `Shape` 类：`Rectangle`\
  \ 和 `Hexagon`。该类声明了一个纯虚函数 `draw()`，该函数由它的两个子类实现。`main` 函数使用指针向量维护了一个 `Shape` 对象的集合。\n\
  \n[程序 15-6 提供了动态绑定和多态的另一个演示。特别考虑以下语句\n\n```\nshapes[j]−>draw();\n```\n\n该语句在循环中执行了多次：\n\
  \n```\nfor (int j = 0; j < shapes.size(); j++)\n{\n   shapes[j]−>draw();\n}\n```\n\
  \n第一次执行该语句时，它调用了六边形对象的 `draw` 函数，而第二次执行时，它调用了矩形对象的 `draw` 函数。由于两个 `draw` 函数位于不同的类中，它们产生不同的行为。\n\
  \n记住关于抽象基类和纯虚函数的以下几点：\n\n*   当一个类包含纯虚函数时，它就是一个抽象基类。\n*   抽象基类不能实例化。\n*   纯虚函数用 `=\
  \ 0` 符号声明，并且没有体或定义。\n*   在需要实例化的派生类中，纯虚函数*必须*被重写。\n\n## 检查\n\n1. 15.1 解释静态绑定和动态绑定之间的区别。\n\
  \n2. 15.2 虚函数是静态绑定的还是动态绑定的？\n\n3. 15.3 下一个程序将显示什么？\n\n```\n#include <iostream>\n\
  #include <memory>\nusing namespace std;\nclass First\n{\nprotected:\n   int a;\n\
  public:\n   First(int x = 1) { a = x; }\n   int getVal() const { return a; }\n};\n\
  class Second : public First\n{\nprivate:\n   int b;\npublic:\n   Second(int y =\
  \ 5) { b = y; }\n   int getVal() const { return b; }\n};\nint main()\n{\n   shared_ptr<First>\
  \ object1 = make_shared<First>();\n   shared_ptr<Second> object2 = make_shared<Second>();\n\
  \   cout << object1−>getVal() << endl;\n   cout << object2−>getVal() << endl;\n\
  \   return 0;   \n}\n```\n\n4. 15.4 下一个程序将显示什么？\n\n```\n#include <iostream>\n#include\
  \ <memory>\nusing namespace std;\nclass First\n{\nprotected:\n   int a;\npublic:\n\
  \   First(int x = 1) { a = x; }\n   void twist() { a *= 2; }\n   int getVal() {\
  \ twist(); return a; }\n};\nclass Second : public First\n{\nprivate:\n   int b;\n\
  public:\n   Second(int y = 5) { b = y; }\n   void twist() { b *= 10; }\n};\nint\
