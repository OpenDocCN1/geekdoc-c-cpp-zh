  \ndoubleVal = integer1 / integer2;\ncout << doubleVal;\n\ndoubleVal = static_cast<double>(integer1)\
  \ / integer2;\ncout << doubleVal;\n\ndoubleVal = static_cast<double>(integer1 /\
  \ integer2);\ncout << doubleVal;\n```\n\n## 3.4 溢出与下溢\n\n## 概念\n\n当值无法放入变量时，就会发生溢出或下溢。就像如果你向桶里加更多水桶就会溢出一样，变量也会遇到类似的问题。让我们来看一个例子。假设一个使用\
  \ 2 字节的 `short int` 有以下值：\n\n```cpp\nshort s = 32767;\ns = s + 1;\ncout << s;\n\
  ```\n\n这是 `short` 能保存的最大值。当给它加 1 时，1 “溢入”了符号位。这被称为`溢出`（overflow）。\n\n同样，当一个整数变量持有其数据类型负数范围末端的值，并从中减去\
  \ 1 时，其高位中的 1 将变成 0，结果数字将被解释为正数。这是另一个溢出的例子。\n\n除了溢出，浮点值还可能经历`下溢`（underflow）。这是当一个值太接近零，以至于其所需的位数超过了变量能够存储的位数时发生的。[程序\
  \ 3-9](#fileP700101608900000000000000001905.xhtml_P7001016089000000000000001915）说明了溢出和下溢。\n\
  \n尽管某些系统在发生溢出或下溢时会显示错误消息，但大多数系统不会。变量只是持有一个错误的值，程序继续运行。因此，为每个变量选择能够存储值的数据类型是非常重要的。\n\
  \n## 3.5 命名常量\n\n## 概念\n\n字面量可以赋予名称，并在程序中表示它们。\n\n对于在程序运行时不会改变的值，有时这并非理想状态。例如，假设以下语句出现在一个计算贷款数据的程序中：\n\
  \n```\namount = balance * 0.069;\n```\n\n在这样的程序中，会出现两个潜在问题。首先，除了原始程序员之外，其他人不知道 0.069\
  \ 是什么。它看起来像是一个利率，但在某些情况下，贷款还涉及相关的费用。在不仔细检查程序其余的情况下，如何确定该语句的目的？\n\n第二个问题是，如果这个数字在程序的各个计算中都被使用并且必须定期更改。\n\
  \n\n\n\n这两个问题都可以通过使用命名常量来解决。`named constant`（命名常量，也称为 `constant variable`常量）类似于变量，但其内容是只读的，在程序运行时不能更改。以下是一个命名常量的定义：\n\
  \n```\nconst double INTEREST_RATE = 0.069;\n```\n\n它看起来和普通变量定义一样，区别在于数据类型名称之前出现了\
  \ `const` 单词。关键字 `const` 是一个限定符，告诉编译器将变量设为只读。这确保了它的值在整个程序执行过程中保持不变。如果程序中的任何语句尝试更改它的值，程序在编译时就会产生错误。命名常量可以使用任何合法的\
  \ C++ 标识符名称，但许多程序员在名称中使用全大写字母（正如我们在这里所做的），以便与普通变量区分开。\n\n定义命名常量时，必须用一个值对其初始化。它不能先定义稍后通过赋值语句赋值值。\n\
  \n```\nconst double INTEREST_RATE;     // 非法\nINTEREST_RATE = 0.069;          //\
  \ 非法\n```\n\n使用命名常量的额外优点是它们使程序更具自文档性。一旦正确定义了命名常量 `INTEREST_RATE`，程序语句\n\n```\nnewAmount\
  \ = balance * 0.069;\n```\n\n就可以更改为\n\n```\nnewAmount = balance * INTEREST_RATE;\n\
  ```\n\n新程序员可以阅读第二条语句并更好地理解正在发生什么。显而易见，`balance` 正在乘以利率。这种方法的另一个优点是可以轻松地对程序进行广泛的更改。假设利率出现在程序中的十几处不同的语句中。如果利率发生变化，则命名常量定义中的初始化值是唯一需要修改的值。如果利率增加到\
  \ 7.2%，只需将定义更改为如下：\n\n```\nconst double INTEREST_RATE = 0.072;\n```\n\n程序就可以准备重新编译。每个使用\
  \ `INTEREST_RATE` 的语句都将使用新值。\n\n命名常量还可以帮助防止程序代码中的拼写错误。例如，假设你在执行各种几何计算的程序中使用数字 3.14159\
  \ 作为 `PI` 的值。每当你在程序代码中输入数字 3.14159 时，你都有可能写错一个或多个数字。为了帮助防止此类错误，你可以为 `PI` 定义一个命名常量，并根据所需的精度用你想要的位数对其进行初始化。然后你可以在所有需要其取值的公式中使用该常量。\n\
  \n[Program 3-10] 计算圆面积使用了命名常量。它定义在第 9 行，并在第 19 行使用。\n\n## 检查点 (Checkpoint)\n\n1.\
