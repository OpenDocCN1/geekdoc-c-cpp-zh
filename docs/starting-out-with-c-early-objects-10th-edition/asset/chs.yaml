  \ `payroll.dat` 文件找到。\n\n## 17. 自动卖货机模拟器\n\n创建一个模拟并管理自动饮料售机的类。每种饮料的信息应该存储在一个结构中，该结构具有持有饮料名称、价格和机器当前数量的数据成员。\n\
