  \ `<` 运算符比较的类型的模板。\n3. 16.8 对于使用运算符（如 `*` 或 `>`）的类对象是什么？\n4. 16.9 编写函数模板的好方法是什么？\n\
  \n# 16.3 类模板\n\n## 概念\n\n模板也可以用于创建泛型类和抽象数据类型。\n\n当我们需要若干个逻辑相同但仅参数类型不同的函数时，可以使用函数模板。当我们需要若干个仅在数据成员类型或成员函数参数类型上不同的类时，可以使用类模板。\n\
  \n声明类模板与声明函数模板相似：使用泛型标识符（如 `T`、`T1`、`T2` 或你选择的任何标识符）编写类，然后在类声明前加上适当的模板头。例如，假设我们想要定义一个类似于第\
  \ 11 章学习的 `NumberArray` 的类，它表示一个泛型数组，并添加了执行边界检查的重载运算符 `[]`。\n\n\n\n\n\n```\ntemplate\
  \ <class T>\nclass SimpleVector\n{\n    unique_ptr<T []> aptr;\n    int arraySize;\
  \   \npublic:\n    SimpleVector(int);                   // 构造函数\n    SimpleVector(const\
  \ SimpleVector &);  // 拷贝构造函数\n    int size() const { return arraySize; }\n    T\
  \ &operator[](int);                  // 重载 [] 运算符\n    void print() const;     \
  \             // 输出数组元素\n};\n```\n\n此类模板将在动态生成的数组中存储类型为 `T` 的元素。这解释了为什么指向该数组基地址的指针\
  \ `aptr` 被声明为 `T []` 类型。我们对 `aptr` 的类型使用了 `unique_ptr`，因为 `SimpleVector` 对象不会与程序的任何其他部分共享动态分配的数组。同样，重载的数组下标运算符返回一个类型为\
  \ `T`的值。但请注意，`size` 成员函数的返回值和成员变量 `arraySize` 都是 `int` 类型。这是合理的，因为数组中的元素个数始终是一个整数，无论数组存储的元素类型是什么。\n\
  \n你可以将 `SimpleVector` 模板看作一种通用模式，可以通过特化化来创建持有 `double`、`long`、`string` 或任何你定义的类型的\
  \ `SimpleVector` 类。其规则是：通过将一组用尖括号括起来的实际类型附加到类模板的名称后面，来形成此类实际类的名称：\n\n* `SimpleVector<double>`\
  \ 是存储 `double` 数组的类的名称。\n* `SimpleVector<string>` 是存储 `string` 数组的类的名称。\n* `SimpleVector<char>`\
  \ 是存储 `char` 数组的类的名称。\n\n以下是一个使用转换构造函数创建一个包含 10 个 `double` 类型元素的数组，并定义 `SimpleVector`\
  \ 对象的示例：\n\n```\nSimpleVector<double> dTable(10);\n```\n\n该语句使用转换构造函数创建了一个包含 10\
  \ 个 `double` 类型元素的数组。\n\n在类内部定义模板类的成员函数是非常直接的：`SimpleVector` 类中 `size()` 的定义提供了一个示例。若要在类外定义成员函数，你必须在成员函数的定义前加上一个指定类型参数列表的模板头，然后在定义内部，每当需要使用`类名`\
  \ 时，都使用类模板名称后跟一组尖括号括的类型参数列表。\n\n让我们使用运算符 `[ ]` 函数来说明在类外定义成员函数。\n\n```\ntemplate\
  \ <class T>\nT &SimpleVector<T>::operator[](int sub)\n{\n   if (sub < 0 || sub >=\
  \ arraySize)\n      throw IndexOutOfRangeException(sub)\n   return aptr[sub];\n\
  }\n```\n\n在此定义中，在作用域解析运算符之前需要类名，因此我们在该处使用了 `SimpleVector<T>`。另一个例子是，考虑转换构造函数的定义：\n\
  \n```\ntemplate <class T>\nSimpleVector<T>::SimpleVector(int s)\n{\n   arraySize\
  \ = s;\n   aptr = make_unique<T[]>(s);\n   for (int count = 0; count < arraySize;\
  \ count++)\n       aptr[count] = T();\n}\n```\n\n在这里，我们需要在作用域解析运算符之前使用 `SimpleVector<T>`，但在之后只需要\
  \ `SimpleVector`，而不需要带 `<T>`。这是因为在作用域解析运算符之后需要的不是类名，而是成员函数的名称，而在这种情况下，它恰好是一个构造函数。\n\
  \n将类型参数列表附加到模板类名称上的这一规则有一个例外。每当类名位于模板类的作用范围内时，就可以省略该列表以及括住它的尖括号。因此，当类名在类内部的任何地方，或者在类外定义的成员函数的局部作用范围内使用时，都可以省略该列表。例如，拷贝构造函数：\n\
  \n```\ntemplate <class T>\nSimpleVector<T>::SimpleVector(const SimpleVector &obj)\n\
  {\n   arraySize = obj.arraySize;\n   aptr = make_unique<T[]>(arraySize);\n   for\
  \ (int count = 0; count < arraySize; count++)\n       aptr[count] = obj[count];\n\
  }\n```\n\n不需要在表示其参数类型的 `SimpleVector` 之后附加 `<T>`。\n\n`SimpleVector` 的转换构造函数假设在执行赋值\
  \ `aptr[count] = T();` 时，类型参数 `T` 具有一个默认构造函数 `T()`。如果 `T` 是基本内置类型，C++ 编译器将使用默认值\
  \ 0 代替 `T()`。例如，如果 `T` 是 `int`，则赋值等同于 `aptr[count] = int();`，并将值 0 存储在 `aptr[count]`\
  \ 中。\n\n`SimpleVector` 模板的代码列在 `SimpleVector.h` 文件中。\n\n# `SimpleVector.h` 内容\n\n\
  ```\n 1 #include <iostream>\n 2 #include <cstdlib>\n 3 #include <memory>\n 4 using\
  \ namespace std;\n 5 \n 6 // 索引越界异常\n7 struct IndexOutOfRangeException\n8 {\n 9\
  \     const int index;\n10     IndexOutOfRangeException(int ix) : index(ix)\n11\
  \ };\n12 \n13 template <class T>\n14 class SimpleVector\n15 {\n16     unique_ptr<T\
  \ []> aptr;\n17     int arraySize;   \n18 public:\n19     SimpleVector(int);   \
  \                // 构造函数\n20     SimpleVector(const SimpleVector &);  // 拷贝构造函数\n\
  21                            \n22     int size() const { return arraySize; }\n\
  23     T &operator[](int);                  // 重载 [] 运算符\n24     void print() const;\
  \                  // 输出数组元素\n25 };\n26 \n27 //***************************************\n\
  28 // SimpleVector 类构造函数。设置数组\n29 // 大小并分配内存。\n30 //***************************************\n\
  31 template <class T>\n32 SimpleVector<T>::SimpleVector(int s)\n33 {\n34     arraySize\
  \ = s;\n35     aptr = make_unique<T[]>(s);\n36     for (int count = 0; count < arraySize;\
  \ count++)\n37         aptr[count] = T();\n38 }\n39 //**************************************\n\
  40 // SimpleVector 拷贝构造函数。\n41 //**************************************\n42 template\
  \ <class T>\n43 SimpleVector<T>::SimpleVector(const SimpleVector &obj)\n44 {\n45\
  \     arraySize = obj.arraySize;\n46     aptr = make_unique<T[]>(arraySize);\n47\
  \     for (int count = 0; count < arraySize; count++)\n48         aptr[count] =\
  \ obj[count];\n49 }\n50 \n51 \n52 //***************************************\n53\
  \ // 重载 [] 运算符。参数是下标。*\n54 // 此函数返回由下标索引的数组\n55 //元素的引用。\n56 //***************************************\n\
  57 template <class T>\n58 T &SimpleVector<T>::operator[](int sub)\n59 {\n60    \
  \ if (sub < 0 || sub >= arraySize)\n61         throw IndexOutOfRangeException(sub);\n\
  62     return aptr[sub];\n63 }\n64 //****************************************\n\
  65 // 打印数组中的所有项。*\n66 //****************************************\n67 template <class\
  \ T>\n68 void SimpleVector<T>::print() const\n69 {\n70     for (int k = 0; k < arraySize;\
  \ k++)\n71         cout << aptr[k] << \"  \";\n72     cout << endl;\n73 }\n```\n\
  \n[程序 16-11] 演示了 `SimpleVector` 模板。\n\n### 注意\n\n包含模板代码的文件已包含在驱动程序文件中，以避免链接单独编译的模板文件时的复杂性。\n\
  \n# 16.4 类模板与继承\n\n继承可以应用于类模板。例如，在以下模板中，`SearchableVector` 继承自 `SimpleVector` 类。\n\
  \n# `SearchVect.h` 内容\n\n\n\n\n\n```cpp\n #include \"SimpleVector.h\"\n\n template\
  \ <class T>\nclass SearchableVector : public SimpleVector<T>\n{\npublic:\n   //\
  \ 构造函数。\n   SearchableVector(int s) : SimpleVector<T>(s)\n   { }\n   // 拷贝构造函数。\
  \                \n   SearchableVector(const SearchableVector &);\n   // 额外的构造函数。\
  \ \n   SearchableVector(const SimpleVector<T> &obj) :\n       SimpleVector<T>(obj)\
  \ { }\n   int findItem(T);\n};\n\n//******************************************\n\
  // 拷贝构造函数的定义。\n//******************************************\ntemplate <class T>\n\
  SearchableVector<T>::\nSearchableVector(const SearchableVector &obj) :\n    SimpleVector<T>(obj)\n\
  {\n}\n\n//******************************************\n// findItem 接收类型 T 的参数\n//\
  \ 并在数组内搜索该项。\n//******************************************\ntemplate <class T>\n\
  int SearchableVector<T>::findItem(T item)\n{\n    for (int count = 0; count < this->size();\
  \ count++)\n    {\n        if (this->operator[](count) == item)\n            return\
  \ count;\n    }\n    return -1;\n}\n```\n\n让我们通过这个例子来仔细观察从模板基类派生类的过程。首先，我们必须告诉编译器，我们正在基于另一个已存在的类模板定义一个新的类类模板：\n\
  \n```cpp\ntemplate <class T>\nclass SearchableVector : public SimpleVector<T>\n\
  {\n   // 类的成员变量将放在这里\n};\n```\n\n这里正在定义的新类模板是 `SearchableVector`，而现有的基类模板是 `SimpleVector<T>`。该类有三个构造函数。所示的第一个构造函数：\n\
  \n```cpp\nSearchableVector(int size) : SimpleVector<T>(size){ }\n```\n\n旨在动态分配一个包含\
  \ `size` 个类型 `T` 元素的数组，这是通过调用基类构造函数并传递参数 `size` 实现的。此构造函数将创建一个指定大小的数组，并将所有元素初始化为类型\
  \ `T` 的默认值。该类还有另一个构造函数：\n\n```cpp\nSearchableVector(const SimpleVector<T> &obj):\
  \ SimpleVector<T>(obj){ }\n```\n\n它接收一个基类对象作为参数，并搜索该对象的拷贝。该构造函数简单地将其参数传递给基类的拷贝构造函数。剩下的构造函数是\
  \ `SearchableVector` 类的拷贝构造函数：\n\n```cpp\nSearchableVector(const SearchableVector<T>\
  \ &obj): SimpleVector<T>(obj){ }\n```\n\n由于 `SearchableVector` 的初始化与 `SimpleVector`相同，`SearchableVector`\
  \ 的拷贝构造函数只需将其参数传递给基类的拷贝构造函数。成员函数 `findItem` 接收一个 `T` 项作为参数，并返回该项在数组中的位置。如果在数组中没有找到项，则返回\
  \ -1。`SearchableVector` 通过在两个 `SearchableVector` 对象中存储值然后搜索特定值来演示该类的用法。\n\n`SearchableVector`\
  \ 类演示了类模板可以派生自另一个模板。此外，类模板可以派生自普通类，而普通类也可以派生自类模板。\n\n## 检查点\n\n1. **16.10** 假设你的程序使用一个名为\
