  \ |\n| 获取反码 | `11111101` |\n| 加 1 | `1` |\n| | ———— |\n| 补码结果为 | `11111110` |\n\n\
  注意，负数的最高位始终被设置为 1，而正数或零的最高位始终被设置为 0。\n\n# 位运算运算符\n\nC++ 提供了各种运算符，允许你对整数值的每个单独位执行逻辑操作，并将位向右或向左平移。\n\
  \n# 位取反运算符\n\n位取反运算符是 `~` 符号。它是一个一元运算符，对字段中的每个位执行取反操作或反码操作。表达式\n\n```\n~val\n```\n\
  \n返回 `val` 的反码。它不会改变 `val` 的内容。它可以按如下方式使用：\n\n```\nnegval = ~val;\n```\n\n这将 `val`\
  \ 的反码存储在 `negval` 中。\n\n# 位按与运算符\n\n位按与运算符是 `&` 符号。该运算符对两个操作数的每个位执行逻辑按与操作。这意味着它逐位比较两个操作数。对于每个位置，如果两个位都是\
  \ 1，则结果为 1。如果其中一个或两个位为 0，则结果为 0。这是一个示例：\n\n```\nandval = val & 0377;\n```\n\n按与操作的结果存储在\
  \ `andval` 中。该运算符还有一个组合赋值版本。这是一个示例：\n\n```\nval &= 0377;\n```\n\n这等同于：\n\n```\n\
  val = val & 0377;\n```\n\n# 位按或运算符\n\n位按或运算符是 `|` 符号。该运算符对两个操作数的每个位执行逻辑按或操作。这意味着它逐位比较两个操作数。对于每个位置，如果两个位中有一个为\
  \ 1，则结果为 1。否则，结果为 0。这是一个示例：\n\n```\norval = val | 0377;\n```\n\n按或操作的结果存储在 `orval`\
  \ 中。该运算符还有一个组合赋值版本。这是一个示例：\n\n```\nval |= 0377;\n```\n\n这等同于\n\n```\nval = val |\
  \ 0377;\n```\n\n# 位按异或运算符\n\n位按异或运算符是 `^` 符号。该运算符对两个操作数的每个位执行逻辑按异或操作。这意味着它逐位比较两个操作数。对于每个位置，如果两个位中有一个为\
  \ 1 但不同为 1，则结果为 1。否则，结果为 0。这是一个示例：\n\n```\nxorval = val ^ 0377;\n```\n\n按异或操作的结果存储在\
  \ `xorval` 中。该运算符还有一个组合赋值版本。\n\n```\nval ^= 0377;\n```\n\n这等同于：\n\n```\nval = val\
