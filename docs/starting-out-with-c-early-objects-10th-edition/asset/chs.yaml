  \ Green Fields Landscaping 案例研究——部分 2\n\n## 问题描述\nGreen Fields Landscaping 其他服务是销售常绿树，价格根据高度定价。客户可以选择“现款自提”购买树、购买树并送货，或者购买树并同时送货和种植。你被要求开发一个程序，根据购买的树的数量、高度以及送货和种植信息来创建客户发票。为了简化程序，你可以假设客户购买的所有树高度相同。\n\
  \n## 表 4-13 常绿树信息\n\n| 高于 3 英尺以下 | 39.00（含税） |\n| 3 到 5 英尺高 | 69.00（含税） |\n| 6 到\
  \ 8 英尺高 | 99.00（含税） |\n| 高于 8 英尺 | 199.00（含税） |\n| 仅送货（每棵） | 20.00（每个订单最多 100.00）\
  \ |\n| 送货 +种植 | 树价的 50% |\n\n## 程序设计\n\n### 程序步骤\n程序必须执行以下通用步骤：\n1. 让用户输入购买树的数量和高度。\n\
  2. 让用户指示树是否由 Green Fields 。\n3. 如果不需要种植服务，让用户指示是否需要送货。\n4. 计算树的总费用。\n5. 计算种植和送货费用。\n\
  6. 计算所有费用合计。\n7. 打印显示购买信息和所有费用的账单。\n\n### 命名常量\n```\ndouble PRICE_1 = 39.00\ndouble\
  \ PRICE_2 = 69.00\ndouble PRICE_3 = 99.00\ndouble PRICE_4 = 199.00\ndouble PER_TREE_DELIVERY\
  \ = 20.00\ndouble MAX_DELIVERY = 100.00\n```\n\n### 输入值的变量\n```\nint numTrees  \
  \       // 购买的常绿树数量\nint height           // 接近英尺的树高\nchar planted          // 是否要种植？('Y'/'N')\n\
  char delivered        // 是否送货？('Y'/'N')\n```\n\n### 输出值的变量\n```\ndouble treeCost\
  \             // 每棵树的费用\ndouble totalTreeCost        // 所有树的总价\ndouble deliveryCost\
  \         // 所有树的送货费用\ndouble plantingCost         // 所有树的种植费用\ndouble totalCharges\
  \         // 总总金额\n```\n\n### 详细伪代码（包含实际变量名和所需的计算）\n```\n初始化 deliveryCost 和 plantingCost\
  \ 为 0 \n显示屏幕标题\n输入 numTrees, height, planted\nIf planted = 'N'\n    输入 delivery\n\
  End If\nIf height < 3\n    treeCost = PRICE_1\nElse If height <= 5\n    treeCost\
  \ = PRICE_2\nElse If height <= 8\n    treeCost = PRICE_3 \nElse\n    treeCost =\
  \ PRICE_4\nEnd If\ntotalTreeCost = numTrees * treeCost\nIf planted = 'Y'\n    plantingCost\
  \ = totalTreeCost / 2        // deliveryCost 保持 0\nElse If delivered = 'Y'\n   \
  \ If numTrees <= 5\n      deliveryCost = PER_TREE_DELIVERY * numTrees\n    Else\n\
  \      deliveryCost = MAX_DELIVERY\n    End If\nEnd If\ntotalCharges = totalTreeCost\
  \ + deliveryCost + plantingCost\n显示发票标题\n显示 numTrees, treeCost, totalTreeCost, deliveryCost,\
  \ plantingCost, totalCharges\n```\n\n### 程序\n在检查伪代码逻辑后，下一步是将伪代码扩展为最终程序。这在程序 4-30\
  \ 中所示。\n\n## Crazy’s Computer Emporium 案例研究\n附加案例可以在配套网站上找到，它包含了第 4 章介绍的内容。Crazy\
