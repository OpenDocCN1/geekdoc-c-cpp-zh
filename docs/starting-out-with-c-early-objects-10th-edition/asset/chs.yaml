  \n### 11. 有多少小部件？\n\nYukon Widget 公司制造每个重量为 12.5 磅的小部件。编写一个程序，根据托盘的总重量计算托盘上堆叠了多少个小部件。程序应要求用户输入托盘自身的重量以及堆叠小部件后的重量。然后它应计算并显示托盘上堆叠的小部件数量。\n\
