  \ 从文件中读取一行文本。\n20. 成员函数 `get()` 从文件中读取单个字符。\n21. 成员函数 `put()` 向文件写入单个字符。\n22. 文件包含未格式化的数据，且这些数据不一定存储为\
  \ ASCII 文本。\n23. 文件包含以 ASCII 文本格式化的信息。\n24. 记录（record）是关于单个条目的完整信息集，它由若干部分组成。\n\
  25. 在 C++ 中，`struct` 提供了一种将信息组织成字段（fields）和记录（records）的方便方法。\n26. 成员函数 `write()`\
  \ 向文件写入“原始”二进制数据。\n27. 成员函数 `read()` 从文件中读取“原始”二进制数据。\n28. 如果向问题 26 和 27 中提到的两个函数的第一个参数传递\
  \ `char` 指针以外的任何内容，则必须使用 `>>` 运算符。\n29. 在 `sequential`（顺序）文件访问中，按照内容在文件中出现的顺序，从文件开始到结束读取文件内容。\n\
  30. 在 `random`（随机）文件访问中，文件内容可以任何顺序读取。\n31. 成员函数 `seekg()` 将文件的读取位置移动到文件中指定的字节处。\n\
  32. 成员函数 `seekp()` 将文件的写入位置移动到文件中指定的字节处。\n33. 成员函数 `tellg()` 返回文件的当前读取位置。\n34. 成员函数\
  \ `tellp()` 返回文件的当前写入位置。\n35. `ios::beg` 模式标志导致从文件开头计算偏移量。\n36. `ios::end` 模式标志导致从文件末尾计算偏移量。\n\
  37. `ios::cur` 模式标志导致从文件的当前位置计算偏移量。\n38. 负偏移量会导致文件的读取或写入位置根据模式指定的位置向后移动。\n\n# 算法工作台\
