  \ 类重载函数调用 `operator () (int i, int j)`，返回从位置 `i` 到 `j` 的所有向量项的字符串连接。\n\n## 11.7\
  \ 右值引用与移动操作\n\n## 概念\n\n右值引用是指一个没有名称的临时对象。移动操作是从一个对象转移资源到另一个对象。\n\n左值与右值\n\n在书之前的章节，你已经了解到引用是一个可以访问的变量。例如，在语句\n\
  \n```\nint &lRef = x;\n```\n中，`lRef` 是一个引用。在左值中，左值表示一个可以访问的内存位置。而右值是指一个没有名称的临时对象。C++11\
  \ 引入了右值引用来引用一个本没有名称的临时对象。右值引用的声明与左值引用类似，只是使用了双安培符号 (`&&`)。下面的代码使用右值引用打印两次 5 的平方。\n\
  \n右值引用赋值赋值：\n\n```\nint && rRef = square(5);\ncout << rRef << endl;\ncout << rRef\
  \ << endl;\n\n```\n x = 0;\n```\n\n在这个程序中，`x` 是一个左值。这是因为 `x` 在多个部分被访问。另一方面，`square(5)`\
  \ 是一个右值，因为它代表一个临时的内存位置。右值的本质是它缺乏一个可以从程序其他部分访问的名称。\n\n右值引用不能绑定到左值，所以下面的代码无法编译：\n\n\
  ```\nint x = 0;\nint && rRefX = x;\n```\n\n在初始化语句\n\n```\nint && rRef1 = square(5);\n\
  ```\n\n之后，`square(5)` 的内存位置拥有了名称，即 `rRef1`，因此 `rRef1` 本身变成了左值。这意味着随后的初始化语句\n\n```\n\
  int && rRef2 = rRef1; \n```\n\n将无法编译，因为右侧的 `rRef1` 不再是右值。这一切的结论是，临时对象最多只有一个左值引用指向它。如果一个函数拥有临时对象的左值引用，你可以确定没有程序的其他部分可以访问该对象。事实对于理解移动操作如何工作非常重要。我们将讨论移动操作。\n\
  \n## 移动构造函数与移动赋值运算符\n\n再次考虑程序 11-9 中的 `NumberArray` 类，我们通过添加一个默认构造函数对其进行了修改：\n\n\
  \n\n\n\n```cpp\n class NumberArray\n{\nprivate:\n  double *aPtr;\n  int arraySize;\n\
  public:\n  // 拷贝赋值和拷贝构造函数\n  NumberArray& operator=(const NumberArray &right); \
  \   \n  NumberArray(const NumberArray &);\n\n  // 默认构造函数和普通构造函数\n  NumberArray();\n\
  \  NumberArray(int size, double value);\n\n  // 析构函数\n  ~NumberArray() { if (arraySize\
  \ > 0) delete [ ] aPtr; }\n  void print() const;\n  void setValue(double value);\n\
  };\n```\n\n该类的每个对象拥有一个资源，即指向动态分配内存的指针。此类类需要程序员定义的拷贝构造函数和重载的拷贝赋值运算符。这些是必要的，以避免因成员级拷贝操作（memberwise\
  \ copy）导致无意共享资源而产生的错误。\n\n从 C++ 11 开始，类可以定义`move constructor`（移动构造函数）和`move assignment`\
  \ 赋值运算符。为了更好地理解这些概念，我们需要仔细观察析构函数、拷贝构造函数和拷贝赋值运算符的操作。为了帮助我们监控这些函数何时被调用，我们修改了 `NumberArray`\
  \ 析构函数和所有构造函数，包含了一个打印语句来跟踪这些函数的执行情况。例如，我们对拷贝构造函数修改如下：\n\n```cpp\n NumberArray::NumberArray(const\
  \ NumberArray &obj)\n{\n   cout << \"Copy constructor running\\n\";\n   arraySize\
  \ = obj.arraySize;\n   aPtr = new double[arraySize];\n   for(int index = 0; index\
  \ < arraySize; index++)\n   {\n      aPtr[index] = obj.aPtr[index];\n   }\n}\n```\n\
  \n同样，我们在析构函数以及其他构造函数和拷贝赋值运算符中添加了以下语句：\n\n```cpp\ncout << \"Destructor running\\\
  n\";\ncout << \"Default constructor running\\n\";\ncout << \"Regular constructor\
  \ running\\n\";\ncout << \"Assignment operator running\\n\";\n```\n\n构成[程序 11-9]的文件修改版本可以在\
  \ `overload2.h` 和 `overload2.cpp` 文件中找到。[程序 11-14] 演示了拷贝构造函数和拷贝赋值运算符的作用。\n\n输出中的行号不是由程序生成的：我们添加它们是为了方便讨论。输出中的行\
  \ (1)是由程序第 12 行的默认构造函数生成的。行 (2) 是在 `makeArray()` 函数创建本地对象时第 28 行生成的。输出中的行 (3) 是当调用拷贝构造函数拷贝本地对象并创建函数返回的临时对象时生成的。\n\
  \n\n\n\n\n```cpp\n#include <iostream>\n#include \"overload3.h\" \nusing namespace\
  \ std;\n\n//***************************************************\n// 赋值运算符重载函数.*\n\
  //***************************************************\nNumberArray& NumberArray::operator=(const\
  \ NumberArray &right)\n{\n    cout << \"Copy Assignment operator running\\n\";\n\
  \    if (this != &right)\n    {\n        if (arraySize > 0)\n        {\n       \
  \     delete[] aPtr;\n        }\n        arraySize = right.arraySize;\n        aPtr\
  \ = new double[arraySize];\n        for (int index = 0; index < arraySize; index++)\n\
  \        {\n            aPtr[index] = right.aPtr[index];\n        }\n    }\n   \
  \ return *this;\n}\n\n//**********************************************\n// 拷贝构造函数。\
  \                            *\n//**********************************************\n\
  NumberArray::NumberArray(const NumberArray &obj)\n{\n    cout << \"Copy constructor\
  \ running\\n\";\n    arraySize = obj.arraySize;\n    aPtr = new double[arraySize];\n\
  \    for (int index = 0; index < arraySize; index++)\n    {\n        aPtr[index]\
  \ = obj.aPtr[index];\n    }\n}\n\n//**********************************************\n\
  // 普通构造函数。                                 \n//**************************************************************\n\
  NumberArray::NumberArray(int size1, double value)\n{\n    cout << \"Regular constructor\
  \ running\\n\";\n    arraySize = size1;\n    aPtr = new double[arraySize];\n   \
  \ setValue(value);\n}\n\n//**********************************************\n// 默认构造函数。\
  \                         *\n//**************************************************************\n\
  NumberArray::NumberArray()\n{\n    cout << \"Default constructor running\\n\";\n\
  \    arraySize = 2;\n    aPtr = new double[arraySize];\n    setValue(0.0);\n}\n\n\
  //****************************************************\n// 设置数组中所有元素存储的值。 *\n//****************************************************\n\
  void NumberArray::setValue(double value)\n{\n    for (int index = 0; index < arraySize;\
  \ index++)\n    {\n        aPtr[index] = value;\n    }\n}\n\n//***************************************\n\
  // 打印数组中的所有元素。   *\n//***************************************\nvoid NumberArray::print()\
  \ const\n{\n    for (int index = 0; index < arraySize; index++)\n    {\n       \
  \ cout << aPtr[index] << \"  \";\n    }\n}\n\n//*************************************\n\
  // 析构函数。                        *\n//*************************************\nNumberArray::~NumberArray()\n\
  {\n    cout << \"Destructor running\\n\";\n    if (arraySize > 0)\n    {\n     \
  \   delete[] aPtr;\n    }\n}\n\n//***********************************************************\n\
  // 移动赋值运算符。                                *\n//***********************************************************\n\
  NumberArray & NumberArray::operator=(NumberArray&& right)\n{\n    cout << \"Move\
  \ assignment is running\\n\"; // 追踪\n\n    if (this != &right)\n    {\n        swap(arraySize,\
  \ right.arraySize);\n        swap(aPtr, right.aPtr);\n    }\n    return *this;\n\
  }\n\n//***********************************************************\n// 移动构造函数。 \
  \                                       \n//***********************************************************\n\
  NumberArray::NumberArray(NumberArray && temp)\n{\n    // 从 temp 对象中“窃取”资源\n    this->arraySize\
  \ = temp.arraySize;\n    this->aPtr = temp.aPtr;\n\n    // 将 temp 对象置于安全状态\n   \
  \ // 以供其析构函数运行\n    temp.arraySize = 0;\n    temp.aPtr = nullptr;\n}\n```\n\n通过检查程序输出的第\
  \ (4) 行，你可以看到当赋值的源是一个临时对象时，在第 1 行调用了移动赋值。\n\n\n\n\n同样，接下来的语句将 `d` 中的值转换为整数（截断小数部分）并将其存储在\
  \ `i` 中：\n\n```\ni = d;\n```\n\n类对象也可以具有相同的功能。例如，假设 `distance` 是一个 `Length` 对象，而\
  \ `d` 是一个 `double` 类型，如果 `Length` 写得恰当，以下语句将方便地将 `distance` 存储到存储 `d` 中的浮点数中：\n\n\
  ```\nd = distance;\n```\n\n为了能够使用像这样的语句，必须编写一个运算符重载来执行转换。这里有一个将 `Length` 对象转换为 `double`\
  \ 的运算符重载：\n\n```\nLength::operator double() const\n{\nreturn len_inches /12 + (len_inches\
  \ %12) / 12.0;\n}\n```\n\n此函数计算以英尺为单位的长度量的实际小数值。例如，4 英尺 6 英寸的测量值将转换为数字 4.5。\n\n\
  ## Note\n\n函数头中没有指定返回类型，因为返回类型是从运算符函数的名称中推断出来的。此外，由于该函数是成员函数，它作用于调用对象且不需要其他参数。\n\
  \n`[Program 11-16]` 展示了修改后的 `Length` 类，该类同时包含 `double` 和 `int` 转换运算符。`int` 运算符简单返回\
  \ `Length` 对象的英寸数。\n\n# `Length2.h` 的内容\n\n```\n 1 #ifndef _LENGTH1_H\n 2 #define\
  \ _LENGTH1_H\n 3 #include <iostream>\n 4 using namespace std;\n 5\n6 class Length\n\
  7 {\n 8 private:\n 9   int len_inches;\n10 public:\n11   Length(int feet, int inches)\n\
  12   {\n13       setLength(feet, inches);\n14   }\n15   Length(int inches){ len_inches\
  \ = inches; }\n16   int getFeet() const { return len_inches / 12; }\n17   int getInches()\
  \ const { return len_inches % 12; }\n18   void setLength(int feet, int inches)\n\
  19   {\n20       len_inches = 12 *feet + inches;\n21   }\n22   // 类型转换运算符\n23  \
  \ operator double() const;\n24   operator int() const { return len_inches;  }\n\
  25\n26   // 重载的流输出运算符\n27   friend ostream &operator<<(ostream &out, Length a);\n\
  28 };\n29 #endif\n```\n\n# `Length2.cpp` 的内容\n\n```\n 1 #include \"Length2.h\"\n\
  \ 2\n3 //***********************************************\n 4 // Operator double\
  \ 将 Length 转换为 double  *\n 5 //***********************************************\n\
  6 Length::operator double() const\n7 {\n 8    return len_inches /12 + (len_inches\
  \ %12) / 12.0;\n 9 }\n10\n11 //*******************************************\n12 //\
  \ 重载的流插入运算符 <<  *\n13 //*******************************************\n14 ostream\
  \ &operator<<(ostream& out, Length a)\n15 {\n16    out << a.getFeet() << \" feet,\
  \ \" << a.getInches() << \" inches\";\n17    return out;\n18 }\n```\n\n# 11.9 转换构造函数\n\
  \n## Concept\n\n除了提供创建对象的方法，转换构造函数还为编译器提供了一种方法，将给定类型的值转换为该类的对象。\n\n一个接受非其类类型的单一参数的构造函数可以被看作是将参数转换为该类的对象。这种构造函数被称为`转换构造函数`（convert\
  \ constructor）。\n\n除了创建其类对象的功能外，转换构造函数还为编译器提供了执行隐式类型转换的方法。每当在期望类类型的地方提供构造函数参数类型的值时，编译器就会执行此类类型转换。\n\
  \n举个简单的例子，考虑以下类：\n\n```cpp\n class IntClass\n{\nprivate:\n   int value;\npublic:\n\
  \   // 从 int 的转换构造函数\n   IntClass(int intValue)\n   {\n      value = intValue;\n\
  \   }\n   int getValue() const { return value; }\n};\n```\n\n由于构造函数 `IntClass(int)`\
  \ 接受一个非 `IntClass` 类型的单一参数，因此它是转换构造函数。\n\n每当上下文需要类对象但提供了构造函数参数类型的值时，编译器会自动调用转换构造函数。这种情况发生在四种不同的上下：\n\
  \n1.  用转换构造函数参数类型的值初始化类对象：例如：\n\n    ```cpp\n    IntClass intObject = 23;\n    ```\n\
  \n2.  给类对象赋值转换构造函数参数类型的值：例如：\n\n    ```cpp\n    intObject = 24;\n    ```\n\n3. \
  \ 一个期望类类型值参数的函数实际上传递了构造函数参数类型的值。例如，我们定义一个函数：\n\n    ```cpp\n     void printValue(IntClass\
  \ x)\n    {\n       cout << x.getValue();\n    }\n    ```\n\n    然后调用它：\n\n    ```cpp\n\
  \    printValue(25);\n    ```\n\n4.  一个声明类类型返回值的函数实际上返回了构造函数参数类型的值。注意，尽管返回类型声明为类类型，但函数返回的是整数：\n\
  \n    ```cpp\n     IntClass f(int intValue)\n    {\n        return intValue;\n \
  \   ```\n\n    编译器将隐式调用构造函数将 `intValue`  `IntClass` 对象。以下程序说明了转换构造函数的作用。\n\n# `Convert.h`\
  \ 的内容\n\n```cpp\n 1 #include <iostream>\n 2 using namespace std;\n 3\n4 class IntClass\n\
  5 {\n 6 private:\n 7   int value;\n 8 public:\n 9   // 从 int 的转换构造函数\n10   IntClass(int\
  \ intValue)\n11   {\n12     value = intValue;\n13   }\n14   int getValue() const\
  \ { return value; }\n15 };\n```\n\n# `Convert.cpp` 的内容\n\n```cpp\n 1 #include \"\
  Convert.h\"\n 2 //*******************************************\n3 // 此函数返回整数，尽管*\n\
  4 // 声明为 IntClass 对象的*\n5 // 返回类型。                             *\n6 //*******************************************\n\
  7 IntClass f(int intValue)\n8 {\n 9    return intValue;\n10 }\n11\n12 //*******************************************\n\
  13 // 打印 IntClass 对象内部的*\n14 // 整数值。                                  *\n15 //*******************************************\n\
  16 void printValue(IntClass x)\n17 {\n18    cout << x.getValue();\n19 }\n```\n\n\
  每当需要从某种类型到类类型的自动转换时，都应该考虑使用转换构造函数。转换构造函数的实际示例可以在 C++ `string` 类中找到。该类提供了从字符串字符串的转换构造函数：\n\
  \n```cpp\n class string\n{\n   // 只显示转换构造函数\n   public:\n      string(char *);\n\
  };\n```\n\n此转换构造函数的存在允许程序员将字符串传递给期望 `string` 对象参数的函数，将字符串赋值给 `string` 对象，并将字符串作为\
  \ `string` 对象的初始值：\n\n```cpp\nstring str = \"Hello\";\nstr = \"Hello There!\";\n\
  ```\n\n事实上，转换构造函数的工作方式与之前介绍过的类型转换运算符相反：类型转换运算符将对象转换为另一种类型的值，而转换构造函数将给定类型的值转换为对象。\n\
  \n## Checkpoint\n\n1.  11.37 具有执行对象转换的运算符函数有什么好处？\n\n2.  11.38 为什么执行数据类型转换的运算符函数不需要指定返回类型？\n\
  \n\n\n\n\n3. 11.39 假设有一个名为 `BlackBox` 的类。为一个成员函数编写原型，该函数将 `BlackBox` 转换为 `int`。\n\
  \n4. 11.40 假设有两个类，`Big` 和 `Small`。为转换构造函数编写原型，该构造函数将 `Small` 类型的对象转换为 `Big` 类型的对象。\n\
  \n# 11.10 聚合与组合\n\n## 概念\n\n当一个类的对象拥有另一个类的对象时，就会发生类聚合。类组合是聚合的一种形式，所有者类控制被包含类对象的生命周期。\n\
  \n在第 7 章中，你学习了类可以包含本身是其他类对象的成员。当类 `C` 包含一个作为另一个类 `D` 对象的成员时，每个 `C` 对象内部都会包含一个类 `D`\
  \ 的对象。这在 `C` 和 `D` 之间创建了一种“拥有”（has-a）的关系。在这种关系中，`C` 的每个实例都拥有或拥有类 `D` 的实例。这在图 11-5\
  \ 中所示。\n\n## 图 11-5 通过实例包含实现的聚合\n\n![图表显示了一个形状像正方形的容器，标记为“C 类对象”。内部是另一个矩形容器，标记为“D\
  \ 类对象”。](img/FG_11_005.png)\n\n在 C++ 中，这种所有关系通常是由于 `C` 拥有类型为 `D` 的成员导致的，但也可能是由于\
  \ `C` 拥有指向 `D` 对象的指针导致的，如图 11-6 所示。\n\n## 图 11-6 通过指向对象的指针实现的聚合\n\n![图表显示了两个矩形容器。它们被标记为“C\
  \ 类对象”和“D 类对象”。有一个箭头从“C 类对象”的主体指向“D 类对象”的名称。](img/FG_11_006.png)\n\n## 成员初始化列表\n\
  \n在第 7 章中，你学习了初始化类成员的方法之一是使用构造函数配合初始化列表。以下是一个示例。\n\n```cpp++\n class Date\n{\n \
  \  string month;\n   int day, year;\npublic:\n   Date(string m, int d, int y):\n\
  \      month(m), day(d), year(y)  // 初始化列表\n   {\n   }\n};\n```\n\n## 注意事项\n\n记住在使用成员初始化列表时要包含所需的冒号。\n\
  \n*聚合*（aggregation）一词通常被泛泛用于描述一个类的对象拥有其他类的对象的情况。\n\n为了查看当一个类拥有另一个类的对象时，如何使用成员初始化列表，这里有一个拥有\
  \ `Date` 类实例的 `Person` 类的定义部分。\n\n```cpp++\n class Person\n{\n   String name;\n\
  \   Date dateOfBirth;\npublic:\n   // 构造函数\n   Person(string theName, string mo,\
  \ int day, int year):\n      name(theName),\n      dateOfBirth(mo, day, year)\n\
  \   {\n   }\n   ... 后接其他函数\n};\n```\n\n注意，在调用包含的 `Date` 对象的构造函数时，使用的是*对象的名称* `dateOfBirth`\
  \ 而不是*对象的类* `Date`。\n\n## 通过指针实现的聚合\n\n现在让我们假设，除了出生日期外，每个人都有一个居住国家。国家有一个名称，可能还有许多其他属性：\n\
  \n```cpp++\n class Country\n{\n   string name;\n   // 附加字段\n};\n```\n\n由于许多人将“拥有”同一个国家，`Person`\
  \ 和 `Country` 之间的拥有关系不应通过在每个 `Person` 对象中嵌入 `Country` 类的实例来实现。因为许多人共享同一个居住国家，通过包含来实现拥有关系会导致数据不必要的重复并浪费内存。此外，每当一个国家的任何数据发生变化时，都需要更新许多\
  \ `Person` 对象。使用指针来实现拥有关系可以避免这些问题。以下是 `Person` 类的版本，已修改为包含一个指向居住国家的指针：\n\n```cpp++\n\
  \ class Person\n{\n   string name;\n   Date dateOfBirth;   \n   shared_ptr<Country>\
  \ pCountry;  // 指向居住国家的指针\npublic:\n   Person(string theName, string month, int\
  \ day, \n          int year, shared_ptr<Country>& pC):       \n          name(theName),\
  \ dateOfBirth(month, day, year),\n          pCountry(pc)\n   {\n   }\n};\n```\n\n\
  ## 聚合、组合与生命周期\n\n*组合*（composition）一词用于描述聚合的特殊情况，即被包含对象的生命周期与所有者一致。一个良好的例子是当类 `C`\
  \ 包含另一个类 `D` 的成员时，被包含的 `D` 对象与 `C` 对象同时创建，并在 `C` 对象销毁时被销毁。另一个例子是当类 `C` 包含指向 `D`\
  \ 对象的指针时，`D` 对象由 `C` 的构造函数创建，由 `C` 的析构函数销毁。\n\n以下程序包含了用于说明聚合、组合和对象生命周期的类。每个类都有构造函数来宣布对象的创建，以及析构函数来宣布它们的终结。`Person`\
  \ 类有一个静态成员\n\n```cpp++\nint Person::uniquePersonID;\n```\n\n用于创建 `Person` 对象时生成数字。这些数字作为一种身份标识，就像社会安全号码识别人们一样。数字存储在\
  \ `personID` 字段中。\n\n## 拥有关系\n\n当一个类包含另一个类的实例时，第一个类被认为与第二个类维持拥有（has-a）关系。例如，`Person`\
  \ 类通过其 `dateOfBirth` 拥有 `Date` 类，而 `Date` 类通过其 `month` 拥有 `string` 对象。拥有关系在面向对象系统建模类与对象之间的关系时很重要。程序中的另一个重要关系是“是”（is-a）关系，我们将在稍后的章节中讨论继承的概念后介绍它。因此，对象组合实现了拥有关系，而正如我们以后看到的，继承是实现是关系的方式。\n\
  \n# 11.11 继承\n\n## 泛化与特化\n\n在现实世界中，你可以发现许多其他对象的特化版本。例如，“昆虫”一词描述了一种具有许多特征的通用生物。因为蝗虫和蜜蜂都是昆虫，它们拥有昆虫的所有通用特征。此外，它们还有自己的特殊特征。例如，蝗虫有跳跃能力，而蜜蜂有刺。蝗虫和蜜蜂是昆虫的特化版本。这在图\
  \ 11-7 中所示。\n\n## 图 11-7 继承中的共性与差异\n\n\n\n\n\n![树图解释了继承中的共同点和差异。](img/FG_11_007.png)图\
  \ 11-7 完整替代文本\n\n# 继承与“是一个……”的关系 (Is-a Relationship)\n\n当一个对象是另一个对象的专门化版本时，它们之间存在“是一个……””的关系。例如，蚂蚱是一种昆虫。这里是“是一个……””关系的其他几个例子：\n\
  \n*   贵宾犬是一种狗。\n*   汽车是一辆交通工具。\n*   矩形是一个形状。\n\n当对象之间存在“是一个……””的关系时，意味着专门化的对象具有通用对象的所有特征，以及使其变得特殊的额外特征。在面向对象编程中，继承被用于在类之间建立“是一个……””的关系。\n\
  \n继承涉及基类（base class）和派生类（derived class）。基类是通用类，派生类是专门化类。派生类基于基类或派自基类。你可以将基类类为父类，派生类类为子类。这在图\
  \ 11-8 中所示。\n\n## 图 11-8 继承中的父子关系\n\n![图表说明了父子关系。](img/FG_11_008.png)图 11-8 完整替代文本\n\
  \n派生类继承基类的成员变量和成员函数，而无需对其中任何一个进行重写。此外，可以添加新的成员变量和函数。举一个具体的例子，考虑一个既有学生又有教职人员的大学环境。假设我们有一个\
  \ `Person` 类，它包含一个 `name` 数据成员以及处理 `name` 成员的成员函数：\n\n```cpp\n class Person\n{\n\
  private:\n    string name;\npublic:\n    Person() { setName(\"\"); }\n    Person(const\
  \ string& pName) { setName(pName); }\n    void setName(const string& pName) { name\
  \ = pName; }\n    string getName() const { return name; }\n};\n```\n\n进一步假设我们有以下枚举类型\n\
  \n```cpp\nenum class Discipline {ARCHEOLOGY, BIOLOGY, COMPUTER_SCIENCE};\nenum class\
  \ Classification {FRESHMAN, SOPHOMORE, JUNIOR, SENIOR};\n```\n\n用于定义提供课程学科范围以及学生的分类。我们可以使用这些类型来定义继承自\
  \ `Person` 的 `Student` 和 `Faculty` 类。这是合理的，因为 `Student` 是一个 `Person`，而 `Faculty`\
  \ 成员也是一个 `Person`。\n\n要通过继承定义一个类，我们需要指定基类以及派生类为基类添加的额外成员。假设除了具有 `Person` 的所有特征外，`Student`\
  \ 必须声明某个学科的专业，并拥有一位是 `Person` 的学术导师。`Student` 类可以定义如下：\n\n```cpp\n class Student\
  \ : public Person\n{\nprivate:\n    Discipline major;\n    shared_ptr<Person> advisor;\n\
  public:\n    void setMajor(Discipline d) { major = d; }\n    Discipline getMajor()\
  \ const { return major; }\n    void setAdvisor(shared_ptr<Person> p) { advisor =\
  \ p; }\n    shared_ptr<Person> getAdvisor() const { return advisor; }\n};\n```\n\
  \n我们假设许多不同的学生可能有同一个导师。`Student` 对象存储一个指向导师的共享智能指针，以避免内存管理问题。\n\n类声明第一行的第一部分指定 `Student`\
  \ 为正在定义的类名，并指定现有类 `Person` 为其基类：\n\n![类声明第一行的第一部分指定了。](img/Page_789.png)\n\n位于基类名称之前的关键字\
  \ `public` 是基类访问说明符。它影响了派生类的成员函数以及类这两个类之外的代码如何访问基类成员的方式。我们将在后的章节中更详细地讨论基类访问说明符。\n\
  \n一个类可以作为多个派生类的基类。特别是，`Faculty` 类也可以如下所示从 `Person` 类派生：\n\n```cpp\n class Faculty\
  \ : public Person\n{\nprivate:\n  Discipline department;\npublic:\n  void setDepartment(Discipline\
  \ d) { department = d; }\n  Discipline getDepartment( ) const { return department;\
  \  }\n};\n```\n\n因此，`Faculty` 对象是一个在某些学科中拥有所属部门的 `Person` 对象。同样重要的是，派生类的每个对象都包含基类的所有成员。这在图\
  \ 11-9 中所示。\n\n## 图 11-9 派生过程中的新增\n\n![图表解释了派生过程中的添加。](img/FG_11_009.png)图 11-9\
  \ 完整替代文本\n\n只要涉及继承，所有对象都应该是动态分配并通过指针访问的。为了理解这一点，考虑一个同时处理 `Student` 和 `Person` 类型的程序。因为\
  \ `Student` 是一个 `Person`，我们应该能够将 `Student` 对象传递给期望 `Person` 类型参数的函数，或将 `Student`\
  \ 对象赋值给 `Person` 变量：\n\n```cpp\nPerson p;\nStudent s;\np = s;\n```\n\n## Inheritance.h\
  \ 内容\n\n（此处代码块保持不变，不翻译）\n\n\n\n\n我们可以将类理解为对所有具有某些特征的对象的描述。派生类的对象继承了基类的所有特征，因此可以被认为属于基类。所以，派生类的对象仅仅是基类的特化对象。出于此，派生类通常被称为基类的\
  \ `subclass`（子类），而基类被称为派生类的 `superclass`（父类）。\n\n# 多重继承\n\nC++ 支持`multiple inheritance`（多重继承），派生类同时继承两个或多个基类。虽然多重继承很有趣，但它会导致程序非常难以理解，而且在实践中很少有用。你可以在书籍配套网站的附录\
  \ H 中找到相关讨论。\n\n书籍配套网站的附录 F 展示了如何使用 UML 表示继承。\n\n# 11.12 保护成员与类访问\n\n## 概念\n\n基类的保护成员与私有成员相似，区别在于它们可以被派生类访问。基类访问规范决定了当派生类继承基类时，私有、保护和公共基类成员的访问类型。\n\
  \n到目前为止，你在类内部使用了两种访问规范：`private` 和 `public`。C++ 提供了第三种访问规范：`protected`。基类的保护成员与私有成员相似，区别在于它们可以被派生类的成员函数访问。保护成员对程序中所有其他代码都是不可访问的。^[⁶\n\
  \n假设我们想为 `Faculty` 类添加一个构造函数，将教授的名字和部门作为参数。实现这一点的最佳方法是让构造函数调用从 `Person` 类继承的 `setName()`\
  \ 成员函数。然而，为了说明保护成员的使用，我们将 `Person` 类中 `name` 字段的访问规范改为 `protected`，并让 `Faculty`\
  \ 构造函数直接访问它。对 `Student` 类进行了类似的修改，添加了一个接受参数并设置保护成员 `name` 的构造函数。结果代码存储在 `inheritance1.h`\
  \ 文件中：\n\n## inheritance1.h 内容\n\n```\n 1 #include <string>\n 2 #include <memory>\n\
  \ 3 using namespace std;\n 4\n 5 enum class Discipline {ARCHEOLOGY, BIOLOGY, COMPUTER_SCIENCE};\n\
  \ 6 enum class Classification {FRESHMAN, SOPHOMORE, JUNIOR, SENIOR};\n 7\n 8 class\
  \ Person\n 9 {\n10 protected:\n11     string name;\n12 public:\n13     Person()\
  \ { setName(\"\"); }\n14     Person(const string& pName) { setName(pName); }\n15\
  \     void setName(const string& pName) { name = pName; }\n16     string getName()\
  \ const { return name; }\n17 };\n18\n19 class Student : public Person\n20 {\n21\
  \ private:\n22     Discipline major;\n23     shared_ptr<Person>advisor;\n24 public:\n\
  25     // Constructor\n26     Student(const string& sname, Discipline d, \n27  \
  \           const shared_ptr<Person>& adv);\n28\n29     void setMajor(Discipline\
  \ d) { major = d; }\n30     Discipline getMajor() const { return major; }\n31  \
  \   void setAdvisor(const shared_ptr<Person>&  p) { advisor = p; }\n32     shared_ptr<Person>\
  \ getAdvisor() const { return advisor; }\n33 };\n34\n35 class Faculty:public Person\n\
  36 {\n37 private:\n38     Discipline department;\n39 public:\n40     // Constructor\n\
  41     Faculty(const string& fname, Discipline d)\n42     {\n43         // Access\
  \ the protected base class member\n44         name = fname;\n45         department\
  \ = d;\n46     }\n47     // Other member functions\n48     void setDepartment(Discipline\
  \ d) { department = d; }\n49     Discipline getDepartment() const { return department;\
  \ }\n50 };\n```\n\n## inheritance1.cpp 内容\n\n```\n 1 #include \"inheritance1.h\"\
  \n 2 //********************************************* \n 3 // Constructor for the\
  \ Student class.         *\n 4 //*********************************************\n\
  \ 5 Student::Student(const string& sname, Discipline d, \n 6                  const\
  \ shared_ptr<Person>& adv)\n 7 {\n 8     // Access the  protected member name\n\
  \ 9     name = sname;\n10 \n11     // Access the other members\n12     major = d;\n\
  13     advisor = adv;\n14 }\n```\n\n程序 11-20 显示了保护成员的使用。\n\n# 基规范\n\n注意不要将基类规范与成员规范混淆。成员访问决定了类中的访问类型，而基类访问规范决定了继承成员的访问类型。\n\
  \n```\nclass Cat : protected Feline {};\nclass Dog : private Canine {};\n```\n\n\
  | 基类规范 | 基类成员在派生类中的呈现形式 |\n| :--- | :--- |\n| `private` | * 基类的私有成员对派生类不可访问。<br>*\
  \ 基类的保护成员变为派生类的私有成员。<br>* 基类的公共成员变为派生类的私有成员。 |\n| `protected` | * 基类的私有成员对派生类不可访问。<br>*\
  \ 基类的保护成员变为派生类的保护成员。<br>* 基类的公共成员变为派生类的保护成员。 |\n| `public` | * 基类的私有成员对派生类不可访问。<br>*\
  \ 基类的保护成员变为派生类的保护成员。<br>* 基类的公共成员变为派生类的公共成员。 |\n\n## 图 11-10 对基类的访问层级\n\n![一张图表说明了对基类的访问层级。](img/FG_11_010.png)\n\
  \n## 单元练习\n\n1. 继承实现了类之间什么类型的关系？\n2. 为什么将基类看作派生类的父类是合理的？\n3. 什么是基类访问规范？\n4. 设两个类，其中一个是另一个类的特例，并编写这两个类的声明，将特例类写为派生类。\n\
  5. 私有成员和保护成员的区别是什么？\n6. 成员访问规范和基类访问规范的区别是什么？\n7. 假设一个程序有以下类声明：\n\n   ```\n    class\
