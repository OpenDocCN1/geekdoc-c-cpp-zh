  \      cout << \"You have won more than 50% of your games. \\n\";\n}\nelse\n   cout\
  \ << \"Good luck in the rest of your games. \";\n```\n\n## 4.7 逻辑运算符\n\n## 概念\n\n\
  逻辑运算符将两个或多个关系表达式连接为一个，或者反转表达式的逻辑。\n\n在上一节中，你看到了程序如何通过两个独立的 `if` 语句测试两个条件。在本节中，你将看到如何使用逻辑运算符将两个或多个关系表达式合并为一个。表\
  \ 4-6 列出了 C++ 的逻辑运算符。\n\n## 表 4-6 C++ 逻辑运算符\n\n| 运算符 | 含义 | 效果 |\n| --- | --- |\
  \ --- |\n| `&&` | 与 (AND) | 将两个表达式合并为一个。只有当两个表达式都为真时，整个表达式为真。 |\n| `&#124;&#124;`\
  \ | 或 (OR) | 将两个表达式合并为一个。一个或两个表达式为真时，整个表达式为真。只需要其中一个真，哪一个并不重要。 |\n| `!` | 非 (NOT)\
  \ | 反转表达式的“真值”。它让真的表达式变为假，让假的表达式变为真。 |\n\n## `&&` 运算符\n\n`&&` 运算符被称为逻辑与与运算符。它接受两个表达式作为操作数，并创建一个只有当两个子表达式都为真时才真的表达式。这是一个使用\
  \ `&&` 运算符的 `if` 语句示例：\n\n```\nif ((temperature < 20) && (minutes > 12))\n cout\
  \ << \"The temperature is in the danger zone.\";\n```\n\n注意，被与运算连接的两个表达式都是完整的、求值为真或假的表达式。首先求\
  \ `temperature < 20` 产生真或假的结果。然后求 `minutes > 12` 产生真或假的结果。最后，将这两个结果进行与运算，以得到整个表达式的最终结果。只有当\
  \ `temperature` 小于 20 且 `minutes` 大于 12 时，才会执行 `cout` 语句。如果任何一个关系测试为假，整个表达式即为假，`cout`\
  \ 语句不会执行。表 4-7 显示了 `&&` 运算符的真值表。真值表列出了两个表达式所有可能的组合以及 `&&` 运算符返回的结果。如表所示，两个子表达式都为真，`&&`\
  \ 运算符才会返回真值。\n\n## 表 4-7 逻辑与\n\n| 表达式 | 表达式的值 |\n| --- | --- |\n| `false && false`\
  \ | `false (0)` |\n| `false && true` | `false (0)` |\n| `true && false` | `false\
  \ (0)` |\n| `true && true` | `true (1)` |\n\n### 注意\n\n如果 `&&` 运算符左侧的子表达式为假，则不会检查右侧的表达式。因为只要一个子表达式为假，整个表达式就为假，这被称为“短路求值”。\n\
  \n`&&` 运算符可以用于简化嵌套 `if` 语句的程序。程序 4-12 与程序 4-11 类似，后者判断银行客户是否符合优惠利率。然而程序 4-12 使用逻辑\
  \ `&&` 运算符而不是嵌套 `if` 语句。\n\n注意，尽管这个程序与程序 4-11 类似，但它们并不是逻辑等价的。在程序 4-12 中，当申请人不符合条件时，会显示以下消息：“你必须有工作并在过去两年内大学毕业才能享受优惠利率。”程序\
  \ 4-11 根据贷款申请人不符合条件的原因显示不同的消息。\n\n## `||` 运算符\n\n`||` 运算符被称为逻辑或运算符。它接受两个表达式作为操作数，并在其中任一子表达式为真时创建一个真的表达式。这是一个使用\
  \ `||` 运算符的 `if` 语句示例：\n\n```\nif ((temperature < 20) || (temperature > 100))\n\
  \     cout << \"The temperature is in the danger zone.\";\n```\n\n如果 `temperature`\
  \ 小于 20 或 `temperature` 大于 100，将执行 `cout` 语句。如果任何一个关系测试为真，整个表达式即为真，并执行 `cout` 语句。\n\
  \n### 注意\n\n进行或运算的两个对象都应该是求值为真或假的逻辑表达式。这样写 `if` 条件是不正确的：\n\n```\nif (temperature\
  \ < 20 || > 100)\n```\n\n电脑键盘上没有 `||` 键。使用两个 `|` 符号。这个符号在反斜线键上。按下 Shift 和反斜线即可输入。表\
  \ 4-8 显示了 `||` 运算符的真值表。\n\n### 表 4-8 逻辑或真值表\n\n| 表达式 | 表达式的值 |\n| --- | --- |\n\
  | `false || false` | `false (0)` |\n| `false || true` | `true (1)` |\n| `true ||\
  \ false` | `true (1)` |\n| `true || true` | `true (1)` |\n\n一个或表达式要为真，只需要其中一个子表达式为真。另一个子表达式是假还是真并不重要。\n\
  \n\n\n\n`Program 4-13` 执行了不同的测试来判断某人是否符合贷款条件。该程序判断客户年收入是否至少达到 $35,000 或者工作年是否超过五年。\n\
  \n当表达式 `income >= MIN_INCOME` 或 `years > MIN_YEARS` 其中一个或两个都为真时，会显示消息“You qualify\
  \ for a loan.”如果这两个表达式都为假，则会打印不符合条件的消息。\n\n## NOTE\n\n`||` 运算符也执行短路计算。如果 `||` 运算符左侧的子表达式为真，则不会检查右侧的子表达式，因为只要子表达式中有一个为真，整个表达式就会为真。\n\
  \n## `!` 运算符\n\n`!` 运算符执行逻辑非（NOT）。它接受一个操作数并反转其真假值。换句话说，如果表达式为真，`!` 运算符返回假；如果表达式为假，它返回真。这里是一个使用\
  \ `!` 运算符的 `if` 语句：\n\n```\n if (!(temperature > 100))\n   cout << \"You are below\
  \ the maximum temperature.\\n\";\n```\n\n首先，测试表达式 `(temperature > 100)` 为真还是假。然后对该值应用\
  \ `!` 运算符。如果表达式 `(temperature > 100)` 为真，`!` 运算符返回假。如果为假，`!` 运算符返回真。在示例中，这等同于询问“温度是否大于\
  \ 100？”或“温度大于 100 是否为假？”\n\n`Table 4-9` 显示了 `!` 运算符的真值表。\n\n## Table 4-9 逻辑非真值表\n\
  \n| 表达式 | 表达式的值 |\n| --- | --- |\n| `!false` | `true (1)` |\n| `!true` | `false\
  \ (0)` |\n\n`Program 4-14` 执行与 `Program 4-13` 相同的任务。然而，if` 语句使用 `!` 运算符来判断申请人收入至少达到\
  \ $35,000 或者工作超过五年这一点是否为假。\n\n## 布尔变量与 ! 运算符\n\n正如你在本章前面学到的，可以通过直接引用变量名来测试布尔变量是否被设置为真。例如，如果\
  \ `moreData` 是一个布尔变量，那么测试\n\n```\n if (moreData == true)\n```\n\n可以简单写为\n\n```\n\
  \ if (moreData)\n```\n\n通过使用逻辑非运算符，可以进行类似的操作来测试布尔变量是否被设置为假。测试\n\n```\n if (moreData\
  \ == false)\n```\n\n可以简单写为\n\n```\n if (!moreData)\n```\n\n本质上，这是在测试 `moreData`\
  \ 是否**没有**被设置为真。这种测试布尔变量值的第二种方法实际上更好。这是因为尽管 C++ 常量 `true` 的值始终为 1，但求值为真的条件可能具有任何非零值。例如，C++\
  \ 有一个名为 `isalpha()` 的函数，它用于测试一个字符是否为字母字符。正如你预期的那样，测试 `isalpha('?')` 的结果为假，而测试 `isalpha('x')`\
  \ 的结果为真。然而，对于某些字母字符，该函数返回一个非 1 的值来表示真。`Program 4-15` 证明了这一点。\n\n在第 14 行，当测试条件 `isalpha('x')\
  \ == true` 时，程序没有产生预期的结果。`isalpha` 函数返回的值 2 与值 1 进行了比较，因此该条件的评估为假，尽管实际上被测试的两个值都代表真。第\
  \ 20 行的代码正常工作，因为 `isalpha` 函数返回的值 2 被正确地解释为真。\n\n## 逻辑运算符的优先级和结合性\n\n`Table 4-10`\
  \ 显示了 C++ 逻辑运算符的优先级，从高到低排序如下。\n\n## Table 4-10 逻辑运算符的优先级\n\n| `!` |\n| `&&` |\n\
  | `&#124;&#124;` |\n\n`!` 运算符的优先级比许多 C++ 运算符高。因此，为了避免错误，最好的做法是始终将其操作数括在括号内，除非你打算将其应用于变量或没有其他运算符的简单表达式。例如，考虑以下表达式：\n\
  \n```\n !(x > 2)\n!x > 2\n```\n\n第一个表达式将 `!` 运算符应用于表达式 `x > 2`。它在询问“`x` 是否不大于 2？”然而，第二个表达式仅将\
  \ `!` 运算符应用于 `x`。它在询问“`x` 的逻辑非是否大于 2？”假设 `x` 被赋值为 5。\n\n## 使用逻辑运算符检查数值范围\n\n逻辑运算符对于判断一个数字是否在范围内非常有效。要检查一个数字是否在范围内，最好使用\
  \ `&&` 运算符。例如，以下 `if` 语句检查 `x` 的值，以确定它是否在 20 到 40 之间。\n\n```\n if ((x >= 20) &&\
  \ (x <= 40))\n   cout << x << \" is in the range.\\n\";\n```\n\n只有当 `x` 同时大于等于 20\
  \ 且小于等于 40 时，`if` 语句中的表达式才为真。`x` 的值必须在 20 到 40 的范围内，该表达式才成立。\n\n要检查一个数字是否在范围之外，最好使用\
  \ `||` 运算符。以下语句判断 `x` 的值是否在 20 到 40 的范围之外：\n\n```\n if ((x < 20) || (x > 40))\n\
  \   cout << x << \" is outside the range.\\n\";\n```\n\n不要混淆这些逻辑运算符的逻辑。例如，以下 `if`\
  \ 语句永远不会为真：\n\n```\n if ((x < 20) && (x > 40))\n   cout << x << \" is outside the\
  \ range.\\n\";\n```\n\n显然，`x` 不可能同时小于 20 又大于 40。\n\n## Note\n\nC++ 不允许使用 `5 < x\
  \ < 20` 这样的表达式来检查数值范围。相反，你必须使用逻辑运算符连接两个关系表达式，如之前所述。\n\n## Checkpoint\n\n1. 4.23\
