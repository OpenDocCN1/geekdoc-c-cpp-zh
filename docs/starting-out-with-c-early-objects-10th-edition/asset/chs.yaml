  \ value）文件对象。除了简单地告诉文件需要按引用传递（by reference）之外，你还能告诉他什么来帮助他理解**为什么**？\n\n    现在假设你需要向其他人演示这一点。错误通常出现在较大程序的上下文中，这使得不熟悉程序的人很难理解正在发生了什么。编写一个尽可能短但仍然包含文件传递错误的程序。\n\
  \n# 编程挑战 (Programming Challenges)\n\n## 1. 文件预览器 (File Previewer)\n编写一个程序，要求用户输入文件名。程序显示文件的前\
  \ 10 行。如果文件少于 10 行，则显示整个文件并提示已显示整个文件。\n\n## 2. 文件显示程序 (File Display Program)\n编写一个程序，要求用户输入文件名。程序在屏幕上显示文件内容。如果文件内容无法在一个屏幕显示，程序应每次显示\
  \ 24 行并暂停。每次暂停时，程序应等待用户按键后再显示下 24 行。\n\n## 3. 笑话梗 (Punch Line)\n编写一个程序，从两个文件中读取并打印一个笑话及其梗。第一个文件包含笑话但没有梗。第二个文件的最后一行是梗，前面有“垃圾信息”。你的程序的主函数应该打开这两个文件，然后调用两个函数，分别传递所需的文件。第一个函数应该读取并显示它接收文件的每一行（笑话文件）。第二个函数只显示它接收的文件最后一行（梗文件）。它应该通过跳转到文件末尾然后返回到最后行的开头来找到该行。\n\
  \n## 4. 文件尾部 (Tail of a File)\n编写一个程序，要求用户输入文本文件名。程序在屏幕上显示文件的最后 10 行（文件的“尾部”）。如果文件少于\
  \ 10 行，则显示整个文件，并提示已显示整个文件。程序应通过跳转到文件末尾然后返回到倒数第 10 行来实现。\n\n## 5. 字符串搜索 (String Search)\n\
  编写一个程序，要求用户输入文件名和要搜索的字符串。程序将在文件中搜索指定字符串的所有出现位置，并显示包含该字符串的行。在定位所有出现位置后，程序应报告该字符串在文件中出现的次数。\n\
  \n## 6. 句子过滤器 (Sentence Filter)\n\n\n\n\n\n处理输入文件并生成输出文件的程序称为 `filter`（过滤器）。编写一个程序，要求用户输入两个文件名。第一个文件将作为输入打开，第二个文件将作为输出打开。（假设第一个文件包含以句号结尾的句子。））该程序将读取第一个文件的内容，并将除句子的首字母以外的所有字母都改为小写。句子的首字母应改为大写。修改后的内容应存储在第二个文件中。\n\
  \n# 7. 文件加密过滤器\n\n文件加密是使用秘密代码编写文件内容的门科学。你的加密程序应该像 `filter` 一样工作：读取一个文件的内容，将信息修改为代码，然后将编码后的内容写入第二个文件。第二个文件将是第一个文件的版本，但是用秘密代码编写的。\n\
  \n尽管有复杂的加密技术，但你应该自己设计一个简单的算法。例如，你可以一次读取第一个文件中的一个字符，在每个字符写入第二个文件之前，将它的 ASCII 码加上\
  \ 10。\n\n# 8. 文件解密过滤器\n\n编写一个程序，解密编程挑战 7 程序产生的文件。解密程序应该读取编码文件的内容，将信息恢复到原始状态，并写入另一个文件。\n\
  \n# 9. 字母频率\n\n字母 `e` 是英语散文中使用频率最高的字母，而字母 `z` 使用频率最低。你的一位正在社会学实验的朋友认为，这对于大一学生的写作可能并不成立。为了测试他的理论，他要求你写一个程序，读取一个文本文件，并为英语字母表中的每个字母打印该字母在文件中出现的次数。\n\
  \n提示：使用一个大小为 128 的整数数组，并使用字母的 ASCII 值作为数组索引来存储和检索字母的计数。\n\n# 10. 放回去\n\nC++ 输入流类有两个成员函数，`unget()`\
