  \ 2014 年冠军的名称。（注意，1994 年没有世界系列赛。）\n\n编写一个程序，将这些文件的内容读取到数组或向量中。然后然后在屏幕上显示 `teams.dat`\
  \ 文件的内容，并提示用户输入一个球队名称。当用户输入球队名称时，程序应显示该球队在 1950 年到 2014 年期间获得世界系列冠军的次数。\n\n### 11.\
