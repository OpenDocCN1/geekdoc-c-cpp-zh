  \n## 概念\n\n你可以设计自己的用于处理字符串的专用函数。\n\n\n\n\n通过将数组作为参数传递，你可以编写自己的函数来处理 C 字符串。例如，程序\
  \ 12-13 使用一个函数将一个 C 字符串从一个数组复制到另一个数组。\n\n注意，程序 12-13 中的 `stringCopy` 函数不接受指示数组大小的参数。它只是地将字符从源字符串复制到目标字符串，直到在源字符串中遇到空终止符。当找到空终止符时，循环已到达\
  \ C 字符串的末尾。函数中的最后一个语句将空终止符（`'\\0'` 字符）赋值给 `string2` 的末尾，使其能够正确终止。\n\n## 警告！\n\n\
  由于 `stringCopy` 函数不知道目标数组的大小，因此程序员有责任确保目标数组足够大，以容纳源字符串数组。\n\n程序 12-14 使用了另一个 C 字符串处理函数：`nameSlice`。该程序要求用户输入名和姓，并用空格分隔。该函数在字符串中查找空格并将其替换为空终止符。效果上，这截断了字符串的姓氏。\n\
  \n`nameSlice` 中的以下循环从数组中的第一个字符开始并扫描字符串，寻找空格或空终止符：\n\n```\nwhile (userName[k] !=\
  \ ' ' && userName[k] != '\\0')\n   k++;\n```\n\n如果 `userName[k]` 中的字符不是空格或空终止符，则\
  \ `k` 加增，并检查下一个字符。以输入示例“`Jimmy` `Jones`”为例，循环在 `userName[5]` 处找到分隔“`Jimmy`”和“`Jones`”的空格。当循环停止时，`k`\
  \ 被设置为 5。这在图 12-3 中所示。\n\n## 图 12-3 在字符串中查找空格\n\n![内存存储显示了 13 个下标从 0 到 12 的矩形。](img/FG_12_003.png)图\
  \ 12-3 完整替代文本\n\n## Note 释\n\n循环如果遇到空终止符将会停止，因此如果用户没有输入空格，它就不会超出数组边界。\n\n一旦循环结束，`userName[k]`\
  \ 将包含空格或空终止符。如果它包含空格，接下来的 `if` 语句（其操作在图 12-4\n   userName[k] = '\\0';\n```\n\n##\
  \ 图 12-4 用空终止符替换空格\n\n![内存存储显示了 13 个下标从 0 到 12 的矩形。](img/FG_12_004.png)图 12-4 完整替代文本\n\
  \n新的空终止符现在成为了字符串的末尾。\n\n## 使用指针传递 C 字符串参数\n\n指针对于编写处理 C 字符串的函数非常有用。如果字符串的起始地址被传递到指针参数变量中，可以假设从该地址到持有空终止符的字节的所有字符都是字符串的一部分。（不需要知道存储字符串的数组长度。）\n\
  \n程序 12-15 展示了一个函数 `countChars`，它使用指针来统计特定字符在 C 字符串中出现的次数。在函数 `countChars` 中，使用指针统计特定字符在\
  \ C 字符串中出现的次数。`strPtr` 指向要搜索的字符串，`ch` 包含查找的字符。`while` 循环只要 `strPtr` 指向的字符不是空终止符就会继续：\n\
  \n```\nwhile (*strPtr != '\\0')\n```\n\n在循环内部，`if` 语句比较两者是否相等，如果相等，`count` 就会递增：\n\
  \n```\nif (*strPtr == ch)\n   count++;\n```\n\n`str++` 语句增加了 `strPtr` 的值。当 `strPtr`\
  \ 遇到空终止符时，循环结束。`count` 记录了该字符出现的次数。\n\n## 12.7 关于 C++ 类\n\n从编程便利的角度来看，`string` 类相比\
  \ C 字符串具有许多优势。正如你在文中所示，`string` 类具有成员函数和重载运算符。这些简化了诸如在字符串中查找字符等任务，这些任务在 C 字符串上执行非常繁琐。\n\
  \n使用 `string` 类的程序必须包含 `string` 文件。String 对象可以使用表 12-5 所示的任何构造函数创建。\n\n### 表 12-5\
  \ 构造函数\n\n| 定义 | 描述 |\n| :--- | :--- |\n| `string()` | 默认构造函数：创建一个空字符串。`string str;`\
  \ |\n| `string(const char *s)` | 类型构造函数：从 C 字符串创建字符串对象。`string name(\"William\"\
  );` |\n| `string(const string &s)` | 拷贝构造函数：从现有字符串创建一个新字符串。`string name1(s);` |\n\
  \n### 表 12-6 运算符\n\n| 重载运算符 | 描述 |\n| :--- | :--- |\n| `>>` | 从流中提取字符并插入字符串。直到遇到空白字符或输入结束。\
  \ |\n| `<<` | 将字符串插入流。 |\n| `=` | 将右侧字符串赋值给左侧字符串对象。 |\n| `+=` | 将右侧字符串的拷贝添加到左侧对象。\
  \ |\n| `+` | 返回两个字符串拼接后的字符串。 |\n| `[]` | 实现数组下标法，如 `name[x]`。返回 `x` 位置字符的引用。 |\n\
  | 关系运算符 | 实现了所有的关系运算符：`< > <= >= !=` |\n\n`string` 类还有许多成员函数。例如，`size` 函数返回字符串的长度。表\
  \ 12-7 列出了许多 `string` 类成员函数及其重载变体。在某些情况下，传递给成员函数的参数可能导致请求的操作无法实现。在这种情况下，成员函数将通过抛出异常来信号错误的发生。异常在第\
