  \ 13 章 高级文件与 I/O 操作\n\n## 13.1 输入/输出流\n\n## 概念\n\n`ifstream` 对象用于文件输入，`ofstream`\
  \ 对象用于文件输出，`fstream` 对象同时用于输入和输出。\n\n*输入流*是一个可以从中读取数据的序列；*输出流*是一个可以向其写入数据的序列；*输入-输出*流是一个允许同时读取和写入的数据序列。键盘是输入流的标准示例，显示器屏幕是输出流的标准示例。\n\
  \nC++ 提供了各种用于处理流的类，包括 `istream` 和 `ostream`。\n\n### 文件流类\n\n`ifstream`、`ofstream`\
  \ 和 `fstream` 类非常相似。每个类都有一个默认构造函数来创建实例：\n\n```cpp\nifstream()\nofstream()\nfstream()\n\
  ```\n\n此外，每个类都有接收两个参数：要打开的文件名和打开模式。文件名由 C 字符串给出。打开模式是决定如何使用文件的设置。初始化构造函数的原型如下：\n\
  \n```cpp\nifstream(const char* filename, ios::openmode mode = ios::in)\nofstream(const\
  \ char* filename, ios::openmode mode = ios::out)\nfstream(const char* filename,\n\
  \         ios::openmode mode = ios::in | ios::out);\n```\n\n从 C11 开始，你可以使用 `string`\
  \ 对象作为文件名：\n\n```cpp\nifstream(const string& filename, ios::openmode mode = ios::in)\n\
  ofstream(const string& filename, ios::openmode mode = ios::out)\nfstream(const string&\
  \ filename,\n         ios::openmode mode = ios::in | ios::out);\n```\n\n打开模式参数是可选的。如果没有指定，打开模式默认为初始化构造函数所示。这些打开模式值以及类似值的含义请参见表\
  \ 13-1。\n\n# 表 13-1 文件模式标志\n\n| 文件模式标志 | 含义 |\n| --- | --- |\n| `ios::app` | 附加：输出始终发生在文件末尾。\
  \ |\n| `ios::ate` | 在末尾：输出最初发生在文件末尾。 |\n| `ios::binary` | 二进制：读取或写入文件的数据为二进制形式。\
  \ |\n| `ios::in` | 输入：文件允许输入操作。如果文件不存在，则打开将失败。 |\n| `ios::out` | 输出：文件允许输出操作。如果文件不存在，则创建一个名为给定的空文件。\
  \ |\n| `ios::trunc` | 截断：如果打开的文件存在，则其内容将被丢弃且大小被截断为零。 |\n\n\n\n\n\n这三个文件流类都拥有参数与初始化构造函数相似的成员函数，这些函数可以打开文件。例如，`fstream`\
  \ 的 `open` 函数具有以下原型：\n\n```\nvoid open(const char* filename,\n           ios::openmode\
  \ mode = ios::in | ios::out);\nvoid open(const string& filename,\n           ios::openmode\
  \ mode = ios::in | ios::out);\n```\n\n每个这些类都有一个 `close` 成员函数，用于在程序完成文件操作后断开连接：\n\
  \n```\nvoid close();\n```\n\n打开的文件会占用操作系统的资源，因此在用完文件后立即关闭文件是非常重要的。此外，程序写入文件流对象的数据通常会在操作系统中进行缓冲，而不会立即写入磁盘。当你关闭文件时，操作系统会将这些数据写入磁盘，这个过程被称为`刷新缓冲区`（`flushing\
  \ the buffer`）。关闭文件可以确保在发生断电或其他导致你的程序异常终止的情况的情况下，缓冲区中的数据不会丢失。\n\n`fstream` 类本身结合了\
  \ `ifstream` 和 `ofstream` 的功能。因此，`fstream` 拥有这两个类所具备的所有成员函数和操作符。特别地，你可以使用提取操作符 `>>`\
  \ 和插入操作符 `<<` 在 `fstream` 对象上读写数据。默认情况下，`ifstream` 对象打开文件用于输入，`ofstream` 对象打开文件用于输出，而\
  \ `fstream` 对象则同时用于输入和输出打开文件。\n\n程序 13-1 给出了一个使用 `fstream` 对象打开一个用于读读写的文件的简单示例。它打开文件，读取内容，然后在文件末尾写入“Hello”一词。如果你从一个名为\
  \ `inout.txt` 的空文件开始，重复执行该程序将导致每次运行时都向文件中添加“Hello”一词。第 22–25 行的循环只有在提取操作符无法读取文件末尾的下一个单词时才会终止。每当输入或输出操作失败时，文件流对象都会设置一个标志。一旦设置了错误标志，在清除错误标志之前，流将不允许对其进行任何进一步的操作。第\
  \ 28 行对 `clear` 函数的调用会清除这些标志，使得第 31 行和 32 行的语句执行成功。\n\n# 文件打开模式\n\n文件打开模式是一个决定如何使用文件的设置。`openmode`\
  \ 类型定义在流相关的类 `ios` 中。该类型的值是 `ios` 类的静态成员。每个此类值代表一个在打开文件时可以设置的标志或选项。表 13-1 列出了模式标志及其含义。\n\
  \n`|` 算符可以用于组合两个或多个标志的效果。例如，打开模式 `ios::in | ios::out | ios::ate` 会导致文件以输入和输出模式打开，且输出最初发生在文件末尾。以下是一个使用\
  \ `fstream` 打开三个用于输入、输出和输入输出输出文件的示例：\n\n```\nfstream inFile, outFile, inOutFile;\n\
  inFile.open(\"in.txt\", ios::in);\noutFile.open(\"out.txt\", ios::out);\noutFile.open(\"\
  inout.txt\", ios::in | ios::out);\n```\n\n### 注意\n\n当单独使用时，`ios::out` 标志会导致现有文件的内容被删除，前提是程序员想要覆盖该文件。如果\
  \ `ios::out` 与 `ios::app` 结合，则现有文件的内容将被保留，所有新数据将追加到文件末尾。\n\n# 使用构造函数打开文件\n\n使用初始化构造函数之一，你可以在一条语句中创建流对象并打开文件：\n\
  \n```\nfstream outFile(\"inout.txt\", ios::in | ios::out);\n```\n\n# 输出格式化和 I/O\
  \ 操符\n\n你在第 3 章中学过的 I/O 操符可以用于流对象。特别是，这些操符\n\n```\nsetw(n)            fixed\nshowpoint\
  \          setprecision(n)\nleft               right\n```\n\n可以用于 `fstream`、`ofstream`\
  \ 和 `ostringstream` 对象。为了说明这一点，考虑一个函数，它接受一个 `double` 类型的参数代表以美元的商品价格，并返回一个以美元符号\
  \ `$` 开头且表示两位小数位价格值的字符串。例如，作为参数传递的 `12.5` 额将导致函数返回字符串 `$12.50`。我们可以利用从第 12 章学到的\
  \ `ostringstream` 知识轻松地编写此函数：\n\n```\nstring dollarFormat(double amount)\n{\n  //\
  \ 创建 ostringstream 对象\n  ostringstream outStr;\n\n  // 设置格式信息并写入 outStr。\n  outStr\
  \ << showpoint << fixed << setprecision(2);\n  outStr << '$' << amount;\n\n  //\
  \ 提取并返回 outStr 内部字符串\n  return outStr.str();\n}\n```\n\n程序 13-2 使用 `dollarFormat`\
  \ 函数写入一个格式整齐的价格表格。价格以二维数组的形式给出。程序将每个价格格式化为在宽度 10 的列中右对齐。\n\n# 表 13-2 I/O 操符\n\n\
  | 操符 | 说明 |\n| --- | --- |\n| `dec` | 以十进制格式显示随后的数字。 |\n| `endl` | 写入换行并刷新输出流。 |\n\
  | `fixed` | 浮点数使用固定舍入法。 |\n| `flush` | 刷新输出流。 |\n| `hex` | 以十六进制输入或输出。 |\n| `left`\
  \ | 输出左对齐。 |\n| `oct` | 以八进制输入或输出。 |\n| `right` | 输出右对齐。 |\n| `scientific` | 浮点数使用科学计数法。\
  \ |\n| `setfill(ch)` | 将 `ch` 设置为填充字符。 |\n| `setprecision(n)` | 将浮点数精度设置为 `n`。 |\n\
  | `setw(n)` | 设置输出字段宽度为 `n`。 |\n| `showbase` | 打印数字时显示基数。 |\n| `noshowbase` | 打印数字时不显示基数。\
  \ |\n| `showpoint` | 强制显示小数点和尾部零。 |\n| `noshowpoint` | 不打印尾部零并在可能时省略小数点。 |\n| `showpos`\
  \ | 对非负数打印 `+` 号。 |\n| `noshowpos` | 对非负数不打印 `+` 号。 |\n\n你已经在第 3 章中遇到过这些操符了。`oct`、`dec`\
  \ 和 `hex` 操符可以用于输入和输出流；它们允许使用八进制、十进制或十六进制系统读数字。程序 13-3 展示了如何使用 `cin` 和 `cout` 读写十进制、十六进制和八进制值。\n\
  \n\n\n\n回想，当程序向打开的文件写入数据时，数据并不会直接写入文件。相反，数据被存储在与文件关联的输出缓冲区，稍后通过一个称为刷新缓冲区（flushing）的过程传输到文件中。通常，只有当缓冲区满或文件关闭时，才会刷新缓冲区。`endl`\
  \ 和 `flush` 操符允许程序员在任何时间刷新缓冲区，从而强制将缓冲区数据传输到文件中。例如，以下语句会刷新输出流的缓冲区：\n\n```\noutFile\
  \ << flush;\n```\n\n`scientific` 操符使浮点数以科学计数法输出，即以 `d.dddEdd` 的形式输出。`fill` 字符是当打印的数字没有填满其打印的整个字段时写入的字符。默认情况下，填充字符是空格。程序员可以使用\
  \ `setfill` 操符指定不同的填充字符。例如，\n\n```\noutFile << setfill('%');\n```\n\n这会将百分号字符（`%`）设置为填充字符。\n\
