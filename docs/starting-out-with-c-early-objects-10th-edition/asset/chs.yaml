  \n# Artistic Solutions 油漆作业估算器 (Artistic Solutions Paint Job Estimator)\n\nArtistic\
  \ Solutions 油漆公司确定，每 160 平方英的墙面需要一桶油漆和三小时的人工。公司每小时收取 28 美元人工费。设计一个模块化程序，允许用户输入要粉刷的房间数量、每个房间的大致平方英尺面积（房间之间可能不同）以及每桶油漆的价格。然后，它应该创建一个报告，其中包含一个精美的公司抬头，并显示以下信息：\n\
  \n\n\n\n\n- 所需油漆的加仑（向上取整到下一个整数加仑）\n- 所需人工的小时\n- 油漆成本\n- 工资费用\n- 涂漆作业的总成本\n\n## 编程挑战\n\
  \n## 1. 加价率 (Markup)\n\n编写一个程序，要求用户输入商品的批发价和加价百分比。然后程序应显示该商品的零售价。例如：\n\n- 如果一件商品的批发价为\
  \ $5.00，加价百分比为 100%，则该商品的零售价为 $10.00。\n- 如果一件商品的批发价为 $5.00，加价百分比为 50%，则该商品的零售价为\
  \ $7.50。\n\n该程序应包含一个名为 `calculateRetail` 的函数，该函数接收批发价和加价百分比作为参数，并返回商品的零售价。\n\n##\
  \ 2. 摄氏温度表\n\n将温度从华氏度转换为摄氏度的公式为：\n\n$$C = \\frac{5}{9}\\left( {F - 32} \\right)$$\n\
  \n其中 `F` 是华氏温度，`C` 是摄氏温度。编写一个名为 `celsius` 的函数，接受华氏温度作为参数，并返回转换为摄氏度的温度。通过在循环中调用该函数来演示其功能，显示一个从\
  \ 0 到 100 每隔 5 度的华氏温度及其对应的摄氏温度表格。\n\n## 3. 下落距离 (Falling Distance)\n\n以下公式可以确定物体在特定时间范围内由于重力下落的距离：\n\
  \n$$d = \\frac{1}{2}gt^{2}$$\n\n公式中的变量如下：\n\n- `d` 是以米为单位的距离，\n- `g` 是 9.8，\n- `t`\
  \ 是物体下落的秒。\n\n编写一个名为 `fallingDistance` 的函数，接受物体下落的时间（秒）作为参数。该函数应返回物体在该时间段内下落的距离（米）。编写一个程序，通过循环调用该函数来演示其功能，将值\
  \ 1 到 10 作为参数传递并显示返回值。\n\n## 4. 动能 (Kinetic Energy)\n\n在物理学中，运动中的物体被称为具有动能。以下公式可以确定移动物体的动能：\n\
  \n$$KE = \\frac{1}{2}mv^{2}$$\n\n公式中的变量如下：\n\n- `KE` 是以焦耳为单位的动能，\n- `m` 是以公斤为单位的物体质量，\n\
  - `v` 是以米/秒为单位的物体速度。\n\n编写一个名为 `kineticEnergy` 的函数，接受物体的质量（公斤）和速度（米/秒）作为参数。该函数应返回物体拥有的动能量。通过在程序中调用该函数来演示其功能，该程序要求用户输入质量和速度的值。\n\
  \n## 5. 冠军部门 (Winning Division)\n\n编写一个程序，确定公司四个部门（东北部、南部、西北部和西南）中哪一个在一个季度的销售额最高。它应该包含以下两个函数，这两个函数由\
  \ `main` 调用：\n\n- `double getSales()` 接收部门名称。它要求用户输入部门的季度销售额，验证输入值不小于 0，然后返回该值。每个部门应被调用一次。\n\
  - `void findHighest()` 接收四个销售总额。它确定哪一个是最大的，并打印销售额最高的部门名称及其销售额。\n\n## 6. 运费 (Shipping\
  \ Charges)\n\n快速货运运公司收取以下费率：\n\n| 包裹重量（公斤） | 每 500 英里的费率 |\n| --- | --- |\n| 2 kg\
  \ 或以下 | $3.10 |\n| 超过 2 kg 但不超过 6 kg | $4.20 |\n| 超过 6 kg 但不超过 10 kg | $5.30 |\n\
  | 超过 10 kg | $6.40 |\n\n不是 500 的倍数的英里将按下一个更高的费率收费。例如，520 英里将按 1000 英里收费。\n\n编写一个程序，询问包裹重量和要运输的距离。这两个数据项应作为参数传递给\
  \ `calculateCharge` 函数，该函数负责计算并返回要显示的运费。`main` 函数应循环处理多个包裹，直到输入重量为 `0` 为止。\n\n##\
  \ 7. 最省油汽车 (Most Fuel Efficient Car)\n\n三辆汽车行驶一段 500 英里的路线。编写一个程序，输入每辆汽车的品牌和消耗的燃料加仑数。每辆汽车调用一次\
  \ `calcMPG()` 函数后，让 `main` 确定并显示哪辆汽车最省油，以及它的每加仑行驶英里数。`calcMPG()` 函数应将行驶距离和耗油量作为参数，并返回每加仑英里数。\n\
  \n## 8. 字符串比较 (String Compare)\n\n你知道 `==` 运算符可以测试两个 `string` 对象是否相等。然而，你可能记得，即使它们包含完全相同的字母，如果任何字母的大小写不同，它们也不被认为是相等的。例如，如果\
  \ `name1 = \"Jack\"` 且 `name2 = \"JACK\"`，它们不被认为是相同的。编写一个程序，要求用户输入两个名称并将它们存储在 `string`\
  \ 对象中。然后应报告在忽略大小写的情况下它们是否相同。为了帮助程序完成任务，除了 `main` 之外还应使用两个函数 `upperCaseIt()` 和 `sameString()`。它们的原型如下：\n\
  \n```\nstring upperCaseIt(string s)\nbool sameString(string s1, string s2)\n```\n\
  \n`sameString` 函数接收两个要比较的字符串，将需要对每个字符串调用 `upperCaseIt`。`upperCaseIt` 函数应使用循环以便对字符串中的每个字符调用\
  \ `toupper` 函数。\n\n## 9. 去除最低分 (Lowest Score Drop)\n\n编写一个程序计算一组分数的平均分，其中最低分会被舍除。它应该使用以下函数：\n\
  \n- `void getScore()` 要求用户输入一个分数，将其存储在引用变量中，并验证其不低于 0 也不高于 100。该函数应被 `main` 调用五次，以获取五个分数。\n\
  - `void calcAverage()` 计算并显示平均分。\n- `int findLowest()` 查找并返回传递的分数中的最低分。它应被 `calcAverage`\
  \ 调用，由该函数决定要舍除哪一个分数。\n\n\n\n\n\n质数是一个大于 1 且只能被 1 和自身整除的整数。例如，数字 5 是质数，因为它只能被 1 和\
  \ 5 整除。然而，数字 6 不是质数，因为它可以被 1、2、3 和 6 整除。\n\n编写一个名为 `isPrime` 的布尔函数，接受一个整数作为参数，如果该参数是质数则返回\
  \ `true`，否则返回 `false`。在一个完整的程序中演示该函数。\n\n# 提示\n\n记住 `%` 运算符将一个数除以另一个数并返回余数。在像 `num1\
  \ % num2` 这样的表达式中，如果 `num1` 能被 `num2` 整除，则 `%` 运算符将返回 0。\n\n# 12. 现值\n\n假设你想向储蓄账户存入一定金额，然后让它放置\
  \ 10 年以赚利息。在 10 年（120 个月）后，你希望账户里有 $10,000。你现在需要存入多少钱才能实现这一目标？要找到答案，你可以使用以下公式，该公式被称为现值公式：\n\
  \n$$P = \\frac{F}{\\left( {1 + i} \\right)^{t}}$$\n\n公式中的各项如下：\n\n*   `P` 是**现值**，或者你现在需要存入的金额。\n\
  *   `F` 是你希望在账户中的**未来值**（在本例中为 $10,000）。\n*   `i` 是**月利率**（以小数形式表示，例如 .0025）。这等同于用户输入的年利率的\
  \ 1/12。\n*   `t` 是你计划让资金留在账户中的**月数**。这将是用户输入的年数的 12 倍。\n\n编写一个带有名为 `presentValue`\
  \ 函数的程序来执行此计算。用户应该输入未来值、年利率和资金增长的年数。程序在将这些值连同未来值传递给 `presentValue` 函数之前，应该将年利率转换为月利率，并将年数转换为月数。\n\
  \n该函数应接受这三个参数，并使用它们计算并返回现值，即你现在需要存入的金额。在一个程序中演示该函数，让用户可以尝试不同的输入值。\n\n# 13. 未来值\n\
  \n假设你的储蓄账户中有一笔钱，按月产生复利息，你想计算在特定月数后将拥有的金额。该公式被称为*未来值公式*，如下：\n\n`F = P × (1 + i)^t`\n\
  \n公式中的变量如下：\n\n*   `F` 是指定时间段后账户的**未来值**。\n*   `P` 是账户的**现值**。\n*   `i` 是**月利率**。\n\
  *   `t` 是**月数**。\n\n编写一个程序，提示用户输入账户的现值、月利率以及资金留在账户中的月数。程序应将这些值传递给名为 `futureValue`\
  \ 的函数，该函数计算并返回指定月数后账户的未来值。程序应显示账户的未来值。\n\n# 14. 股票利润\n\n出售股票的利润可以如下计算：\n\n`Profit\
  \ = ((NS × SP) - SC) - ((NS × PP) + PC)`\n\n*   其中 `NS` 是股数，\n*   `SP` 是每股卖价格，\n\
  *   `SC` 是支付的销售佣金，\n*   `PP` 是每股买价格，\n*   以及 `PC` 是支付的购买佣金。\n\n如果计算结果为正值，则出售股票产生了利润。如果计算结果为负数，则出售导致了亏损。\n\
  \n编写一个函数，接受股数、每股买价、支付的购买佣金、每股售价和支付的销售佣金作为参数。该函数应返回出售股票的利润（或亏损）。\n\n在一个程序中演示该函数，要求用户输入必要的数据并显示利润或亏损金额。\n\
  \n# 15. 订单状态\n\nMiddletown 批发铜线公司每卷 $100 销售铜线线，每卷收取 $10 运费。编写一个显示订单状态的程序。它应该使用两个函数。第一个函数请求以下数据并将输入值存储在引用参数中：\n\
  \n*   订购的卷数。\n*   库存中的卷数。\n*   任何特殊的运费和手续费（高于常规的 $10 费率）。\n\n第二个函数接收计算和显示以下信息所需的任何值作为参数：\n\
  \n*   当前库存中准备好发货的订购卷数。\n*   欠单的订购卷数（如果订购数量大于库存量）。\n*   发货部分的总销售价格（卷数乘以 $100）。\n\
  *   发货部分的总运费和手续费（默认为 $10）。\n\n# 16. 重载医院\n\n编写一个程序计算并显示医院住院的费用。首先，程序应该询问患者是住院患者还是门诊患者。如果患者是住院患者，应输入以下数据：\n\
  \n*   住院天数\n*   每日费率\n*   医疗服务费（实验室检查等）\n*   药品费用\n\n如果患者是门诊患者，应输入以下数据：\n\n*   医疗服务费（实验室检查等）\n\
  *   药品费用\n\n使用一个单一的独立函数来验证输入是否小于零。如果是，应重新输入。\n\n一旦输入了所需数据，程序应使用两个重载函数来计算总费用。其中一个函数接受住院数据参数，另一个函数接受门诊数据参数。两个函数都应返回费用。\n\
  \n# 17. 使用文件——医院报告\n\n修改编程挑战 16（重载医院），将其创建的报告写入文件。打印文件内容以提交。\n\n# 18. 人口\n\n在人口中，出生率是由于出生的人口增长百分比，死亡率是由于死亡的人口减少百分比。编写一个程序询问以下内容：\n\
  \n*   初始人口（至少 2）\n*   年出生率\n*   年死亡率\n*   显示的年数（至少 1）\n\n程序随后应显示初始人口以及年底的预测人口。它应该使用一个函数计算并返回每年后的预测新规模。公式为：\n\
  \n`N = P * (1 + B) * (1 - D)`\n\n*   `N` 是新人口规模，\n*   `P` 是之前的人口规模，\n*   `B` 是出生率，\n\
  *   以及 `D` 是死亡率。\n\n# 19. 流动人口\n\n\n\n\n修改编程挑战 17，使其也考虑迁入或离开某一地理区域对人口造成的影响。输入初始人口规模、年出生率、年死亡率、每年通常进入该地区的人数以及每年通常离开该地区的人数，程序应预测\
  \ `numYears` 年后的人将是多少。你可以提示用户输入 `numYears` 的值，也可以在程序中设置它。\n\n# 20. 差旅费用小组项目\n\n\
  该程序应该由一个学生小组设计并编写。\n\n从分析程序需求开始。决定需要哪些函数以及每个函数必须做什么。分配工作，使每个学生都获得大致相等的工作量。例如，一个学生可以设计主函数，而其他学生则设计主函数将调用的独立函数。然后，在开始编写任何代码之前，确定函数名称、参数和返回类型，以确保所有完成的模块在组合成最终程序时能够正常协同工作。\n\
  \n以下是作业内容。编写一个程序，计算并显示公司员工旅行途中的总差旅费用。程序应包含相应的函数，用于询问并返回以下内容：\n\n*   旅行日期\n*   旅行期间离开家园的总晚数\n\
  *   任何往返机票的金额\n*   任何租车的金额\n*   如果使用了私家车，则行驶里程数。车辆补贴为每英里 0.58 美元\n*   停车费\n*   出租费\n\
  *   会议或研讨会注册费\n*   酒店费用。公司允许住宿费每晚最高 120 美元。\n*   餐饮费用\n\n程序应该执行任何必要的计算，例如计算里程报销和允许的酒店报销。然后，它应该创建一个格式良好的费用报告，其中包含每个类别的支出金额以及整个旅行的总支出金额。此报告应写入文件。\n\
  \n# 第 7 章 类和对象简介\n\n## 注意事项\n\n如果老师希望在介绍类和对象之前介绍数组，本章可以在[第 8 章](#fileP70010160890000000000000000068F8.xhtml_P70010160890000000000000000068F8）之后讲解。\n\
  \n# 7.1 抽象数据类型\n\n## 概念\n\n抽象数据类型（ADT）是一种数据类型，它规定了该数据类型可以持有的值以及可以对其进行的操作，而不涉及该数据类型如何实现的细节。\n\
  \n## 抽象\n\n`abstraction` 是某个事物的通用模型。它是一个定义，包含了对象的通用特征，而不包含描述对象特定实例的细节。\n\n汽车提供了一个抽象的说明。大多数人理解汽车是什么，许多人知道如何开车。然而，很少有人能完全理解汽车是如何工作的，或者它的所有部分是什么。这就是抽象的特征。对象的内部组件、组织和操作的细节与它能做什么以及如何操作它的描述隔离开来。在日常生活中，我们被这类抽象示例所包围，从微波炉、洗衣机到\
  \ DVD 播放机和电脑。我们知道这些对象可以做什么，也理解如何操作它们，但我们大多数人并不知道不在乎它们内部是如何工作的。我们不需要关心这些信息。\n\n##\
  \ 抽象在软件开发中的应用\n\n抽象也出现在编程中。为了专注于创建可运行应用程序的大局局，程序员需要能够使用某些对象和例程，而无需担心它们的实现细节。从本文开始开始，你就在这样做，当你使用诸如\
  \ `cin` 和 `cout` 等对象以及诸如 `sqrt` 和 `pow` 等函数时。使用这些对象或函数只需要知道它们是做什么的以及使用它们的接口。例如，要使用\
  \ `sqrt` 函数，你只需要知道它的名称以及调用时必须带一个数值参数（即要返回平方根的值）。要使用 `pow` 函数，你只需要知道它的名称以及调用时必须带两个数值参数。第一个是要求幂的值，第二个是指数。在在这两种情况下，你都不需要知道函数使用什么算法来计算它返回的结果。\n\
  \n抽象也适用于数据。要使用任何数据类型，你只需要知道关于它的两点：它可以持有什么值以及哪些操作适用于它。例如，要使用 `double`，你只需要知道它只能持有数值（如\
  \ `5.0` 或 `-5.1`），而不能字符串（如 `\"5.1\"`）。要使用 `double`，你还需要知道可以对其执行哪些操作。它可以与加、减、乘、除运算符配合使用，但不能与模运算符配合（模运算仅适用于整数操作数，如表达式\
  \ `8 % 3`）。在使用 `double` 时，你不需要知道关于它的任何其他信息。你不需要知道它是如何存储在内存中的，或者计算机是如何执行对其进行的算术运算的。这种将数据类型的逻辑属性与其实现细节分离的方法被称为\
  \ `data abstraction`。\n\n# 抽象数据类型\n\n`abstract data type`（`ADT`）一词描述任何实现细节与使用它所需的逻辑属性隔离开的数据类型。但通常，该术语指的是程序员创建的数据类型。通常这些数据类型可以持有多个值，就像类一样（你将在本章中学习类）。程序员定义了数据类型可以持有的值集，定义了可以对数据执行的操作集，并创建一组函数来执行这些操作。在\
  \ C++ 和其他面向对象的语言中，程序员创建的 ADT 通常被实现为类。\n\n# 7.2 面向对象编程\n\n## 概念\n\n面向对象编程以对象为中心，对象封装了数据以及操作这些数据的函数。\n\
  \n在实践中有两种常用的编程方法：过程化编程和面向对象编程（OOP）。在这一章之前，你已经学习了编写过程化程序。\n\n过程化编程是以执行程序动作的过程（或函数）为中心的软件编写方法。程序的数据（通常存储在变量中）与这些过程是分离的。因此，你必须将变量传递给需要处理这些变量的函数。另一方面，面向对象编程以对象为中心。\n\
  \n过程化编程多年来对软件开发者一直有效。然而，随着程序变得越来越大复杂，程序数据与操作它的代码的分离可能会导致问题。例如，程序的规范经常发生变化，导致需要更改数据格式或数据结构的设计。当数据结构发生变化时，操作数据的代码也必须更改以接受新格式。寻找所有需要更改的代码为程序员增加了额外工作量，并为在代码中引入漏洞的机会。\n\
  \n\n\n\n这个问题影响了从过程化编程向面向对象编程的转变。`OOP` 以创建和使用对象为中心。`object`（对象）是一个软件实体，它将数据和处理这些数据的过程结合在一个单元中。对象的数据项也称为其\
  \ `attributes`（属性），存储在 `member variables`（成员变量）中。对象执行的过程被称为它的 `member functions`（成员函数）。这种将对象的数据和过程结合在一起被称为`encapsulation`（封装）。\n\
  \n## Note\n\n在某些面向对象的编程语言中，对象执行的过程被称为 `methods`（方法）。\n\n图 7-1 展示了一个 `Circle` 对象可能的样子的样子。它只有一个成员变量来存储数据，并有两个成员函数。`Circle`\
  \ 对象的成员变量是 `radius`。它的 `setRadius` 成员函数设置半径，而它的 `calcArea` 成员函数计算并返回面积。\n\n## 图\
  \ 7-1 类包含数据和函数\n\n![一个类解释了一个 Circle 对象。](img/FG_07_001.png)图 7-1 类包含数据和函数的完整备用文本\n\
  \n成员变量和成员函数都是 `Circle` 对象的成员，被绑定在一个单一单元中。当需要执行某个操作时（例如计算圆的面积），会向对象传递一条消息，告诉它执行 `calcArea`\
  \ 函数。由于 `calcArea` 是 `Circle` 对象的成员，它自动拥有访问对象的成员变量权限。因此，不需要向 `calcArea` 函数传递 `radius`。\n\
  \n除了将关联的数据和函数封装在一起外，对象还允许数据隐藏。`data hiding`（数据隐藏）是指对象向外部代码隐藏其数据的能力。只有对象的成员函数才能直接访问并修改它的数据。对象通常会隐藏其数据，但允许外部代码通过其某些成员函数访问这些数据。如图\
  \ 7-2 所示，对象的成员函数为对象外部的编程语句提供了间接访问对象数据的方法。\n\n## 图 7-2 只有对象的成员函数可以访问对象的数据\n\n![图表说明了函数访问对象数据的方式。](img/FG_07_002.png)图\
  \ 7-2 只有对象的成员函数可以访问对象数据的完整备用文本\n\n为什么隐藏信息是一件好事？当对象的内部数据对外部代码隐藏，且这些数据只能通过通过对象的成员函数来访问时，数据就免受意外或故意损坏的侵害。此外，对象外部的程序代码不需要了解对象数据的格式或内部结构。代码只需要与对象的函数交互。当程序员更改对象内部数据的结构时，对象的成员函数也会随之修改，以确保它们仍能正常对该数据进行操作。然而，这些更改对外部代码是隐藏的。这些代码不需要更改，它们可以像以前完全一样调用和使用这些成员函数。\n\
  \n早些我们用汽车作为抽象对象的示例，可以在不了解其工作细节的情况下使用它。它有一个非常简单的接口，由点火开关、方向盘、油门、刹车踏板和挡位选择器组成。（手动变速器车辆还提供离合器踏板）。如果你想驾驶汽车，只需要学会操作这些的这些元素即可。要启动电机，只需转动点火开关中的钥匙。内部发生了什么与驾驶员无关。如果你想让汽车向左转，只需向左转动方向盘。所有连接方向盘和前轮的连杆运动都在你察不到的情况下发生。如果制造商重新设计车辆以以不同的方式执行某些幕后操作，驾驶员不需要学习新的接口。\n\
  \n由于汽车具有简单的用户界面，没有机械知识的人也可以驾驶。这对汽车制造商来说是好事，因为这意味着可能有更多人成为客户。这对汽车用户来说也是好事，因为他们只需要学习几个简单的程序就可以操作几乎任何车辆。\n\
  \n这些在软件开发中也是同样关注的问题。一个程序很少由一个人编写。即使是你到目前为止创建的小程序也不是完全由你编写的。如果你整合了 C++ 库函数，或者像 `cin`\
  \ 和 `cout` 这样的对象，你就使用了别人编写的代码。在专业软件开发领域，程序员通常以团队形式工作，买卖代码并在项目上协作。通过 `OOP`，程序员可以创建具有强大引擎隐藏在“引擎盖下”的对象，但同时具有简单的接口来保护对象的算法和数据。\n\
  \n## 7.3 类类\n\n## 概念\n\n在 C++ 中，类是用于创建对象的结构。在我们创建和使用对象之前，必须有一个关于它将拥有什么的描述。`class`\
  \ 是由程序员定义的数据类型，描述了对象在创建时的样子。\n\n### 使用你已经熟悉的类\n\n从本书开始，你一直在使用 `string` 类来创建和使用 `string`\
  \ 对象。记住，在任何使用 `string` 类的程序中必须包含以下 `#include` 指令：\n\n```cpp\n#include <string>\n\
  ```\n\n这是必要的，因为 `string` 头文件是定义 `string` 类的地方。在程序中包含此头文件后，你现在定义任意数量的 `string` 对象。要做到这一点，只需写类名，后面跟上你想给对象起的名称。这是一个示例：\n\
  \n```cpp\nstring city,\n       state;\n```\n\n这条语句创建了两个 `string` 对象。一个命名为 `city`，另一个命名为\
  \ `state`。两个对象都是 `string` 实例，尽管它们可以分配不同的数据值，但两个对象本质上看起来是一样的。也就是说，它们都有一个可以存储字符串的成员变量，并且拥有同一组可以操作字符串的函数。\n\
  \n一旦创建了 `string` 对象，你就可以从中存储数据。由于 `string` 类设计用于赋值运算符，你可以将字符串字面量赋值给 `string` 对象。这是一个示例：\n\
  \n```cpp\ncity  = \"Chicago\";\nstate = \"Illinois\";\n```\n\n这些语句将 `\"Chicago\"\
  ` 存储在 `city` 对象的成员变量中，将 `\"Illinois\"` 存储在 `state` 对象的成员变量中。\n\n`string` 类包含了许多对\
  \ `string` 对象持有的数据执行操作的成员函数。在之前的章节中介绍了其中几个。其中一个名为 `length` 的成员函数，它返回 `string` 对象存储的字符串的长度。以下代码演示了这一点：\n\
  \n```cpp\ncout << city.length()   << endl;   // 输出 7\ncout << state.length()  <<\
  \ endl;   // 输出 8\n```\n\n这些语句都调用它们相同的成员函数，但在每个情况下都是处理对象自身的数据。存储在 `city` 中的数据是长度为\
  \ 7 的字符串。存储在 `state` 中的数据是长度为 8 的字符串。\n\n\n\n\n需要注意的是，为了创建和使用 `string` 对象，我们不需要了解任何关于\
  \ `string` 类如何实现的知识。我们只需要知道它能存储什么类型的数据，以及我们可以调用哪些函数来操作这些数据。\n\n# 创建你自己的类\n\n要创建一个你自己的类，你必须编写一个类声明。这里是类声明的通用格式。\n\
  \n```cpp\nclass ClassName        // 类声明开始于\n{                      // 关键字 class\
  \ 和一个名称。\n\n   类成员变量的\n   和成员函数的声明写在这里。\n\n};                     // 注意末尾必须有分号。\n\
  ```\n\n我们将通过逐步构建一个类来学习如何实现一个类。我们的示例将是图 7-1 所示的简单 `Circle` 类。第一步是确定该类应该拥有哪些成员变量和成员函数。在这种情况下，正如已经描述的那样，我们已经确定该类需要一个成员变量来存储圆的半径，以及两个成员函数：`setRadius`\
  \ 和 `calcArea`。\n\n### 注意\n\n这些信息与其他设计信息一起，有时使用视觉建模工具来表达，这些工具是面向对象建模“语言”的一部分，被称为统一建模语言，或\
  \ UML。图 7-1 ) )示了一种常用的 UML 图类型，称为`类图`（class diagram）。你将在本章的后部分看到更多此类示例。\n\n一旦设计好类，下一步是编写类声明。这告诉编译器该类包含什么内容。这里是我们的\
  \ `Circle` 类的声明。注意类名以大写字母开头。虽然这不是强制要求的，但按照习惯，总是以大写字母开头类名。\n\n```cpp\nclass Circle\n\
  {  private:\n       double radius;\n\n   public:\n      void setRadius(double r)\n\
  \      {   radius = r; }\n\n      double calcArea()\n      {   return 3.14 * pow(radius,\
  \ 2);  }\n};\n```\n\n# 访问修饰符\n\n类声明非常像图 7-1， 只是增加了每个成员函数的实际代码以及两个关键字：`private` 和\
  \ `public`。这些被称为`访问修饰符`(access specifiers），因为它们指定了谁可以访问类的各种成员。注意每个访问修饰符后面都跟着一个冒号。公共成员变量可以被类外函数访问，公共成员函数可以被类外函数调用。另一方面，私有成员变量只能由同一类的成员函数访问，私有成员函数只能由该类的其他成员函数调用。如果我们完全省略了\
  \ `public` 和 `private` 单词，所有内容都将默认为私有。这将非常没有用，因为除非特殊情况下，否则类外的任何函数都无法使用该类。\n\n在我们的\
  \ `Circle` 类中，成员变量 `radius` 被声明为私有，成员函数被声明为公共。这是很常见的。成员数据通常是私有的。\n\n\n\n\n现在半径已经设置好了，我们可以调用\
  \ `calcArea` 成员函数来返回 `Circle` 对象的面积：\n\n```\ncout << \"The area of circle1 is \"\
  \ << circle1.calcArea () << endl;\ncout << \"The area of circle2 is \" << circle2.calcArea\
  \ () << endl;\n```\n\n程序 7-1 是一个完整的程序，演示了 `Circle` 类。注意，创建和使用 `Circle` 对象的语句位于 `main`\
  \ 中，而不是在类声明中。\n\n## 访问器与修改器 (Accessors and Mutators)\n\n在程序 7-1 的第 13 行和第 16 行，注意类成员函数\
  \ `setRadius` 和 `calcArea` 是如何使用成员变量 `radius`。它们不需要使用点运算符来引用它，因为类的成员函数可以像普通变量一样访问同一类的成员变量，而无需任何额外的符号。同样注意，类成员函数\
  \ `calcArea` 只使用但并不修改成员变量 `radius`。这种使用类变量的值但不改变它的函数被称为 `accessor`（访问器）。另一方面，`setRadius`\
  \ 函数修改了 `radius` 的内容。这种将值存储在成员变量中或更改其取值的成员函数被称为 `mutator`（修改器）。一些程序员将修改器称为 `set\
  \ functions`（设置函数）或 `setter functions`（set 器函数），因为它们设置了类变量的值；并将访问器称为 `get functions`（获取函数）或\
  \ `getter functions`（get 器函数），因为它们仅仅是取回或使用该值。\n\n## 7.5 定义成员函数\n\n## 概念\n\n类成员函数可以在类声明内部定义，也可以在类外部定义。\n\
  \n类成员函数的定义方式与普通函数类似。除了我们稍后将看到的少数特殊情况外，它们都有一个函数头，其中包含一个返回类型（可以是 `void`）、一个函数名和一个参数列表（可能为空）。执行函数操作的语句包含在跟在函数头的一对大括号中。\n\
  \n当我们在上一节中定义 `Circle` 类时，我们直接在类声明内部定义了它的两个成员函数。当类函数在类内部被定义时，它被称为 `inline function`（内联函数）。内联函数提供了一种方便的方法，将函数信息包含在类声明中，但它们只能在函数体非常短（通常只有一行）时使用。当函数体较长时，我们在类声明中放置该函数的原型，而不是函数定义本身。然后，我们将函数定义放在于类声明之外，既可以跟在声明之后，也可以放在单独的文件中。\n\
  \n尽管我们 `Circle` 类中的两个函数短到可以写成内联函数，但我们仍然把它们重写为位于类声明外的普通函数，以演示如何这样做。在类声明内部，这些函数将被替换为以下原型：\n\
  \n```\nvoid setRadius(double);\ndouble calcArea();\n```\n\n在类声明之后，我们将放置一个 `function\
  \ implementation`（函数实现）部分，包含以下函数定义：\n\n```\nvoid Circle::setRadius(double r)\n{\
  \   radius = r;\n}\n\ndouble Circle::calcArea()\n{   return 3.14 * pow(radius, 2);\n\
  }\n```\n\n注意，这些看起来像普通函数，但类名和双冒号（`::`）位于函数返回类型之后、函数名之前。`::` 符号被称为 `scope resolution\
  \ operator`（作用域解析运算符）。它用于指示这些是类成员函数，并告诉编译器它们属于哪个类。\n\n## 警告！\n\n类名和作用域解析运算符是函数名的扩展。当函数在类声明之外定义时，这些符号必须存在，并且必须位于函数头中函数名的之前。\n\
  \n以下是一些额外的示例，说明当类函数在类声明之外定义时，如何使用作用域解析：\n\n```\ndouble calcArea()              \
  \ // 错误！缺少类名和作用域\n                                // 解析运算符。\n\nCircle::double calcArea()\
  \       // 错误！类名和作用域\n                                // 解析运算符位置错错。\n\ndouble Circle::calcArea()\
  \       // 正确！\n```\n\n程序 7-2 修改了程序 7-1，在类类之外定义了类成员函数。\n\n## 类成员函数的命名规范\n\n程序 7-3\
  \ 提供了另一个使用类的示例。它声明并实现了一个 `Rectangle` 类，该类有两个成员变量和公共成员函数。注意程序 7-1 中成员函数的名称是以 `set`\
  \ 或 `get` 开头的。`setLength` 和 `setWidth` 是修改器（或 set 函数）。正如你预期的那样，修改器以 `set` 加上它要设置的成员变量命名；`setLength`\
  \ 函数设置 `length` 成员变量的值，`setWidth` 函数设置 `width` 成员变量的值。\n\n成员函数 `getLength` 和 `getWidth`\
  \ 是访问器（或 get 函数）。访问器通常以 `get` 加上它要获取的成员变量命名，如果它所做的只是返回存储在变量中的值。`getLength` 返回存储在\
  \ `length` 成员变量中的值，而 `getWidth` 返回存储在 `width` 成员变量中的值。最后一个成员函数 `calcArea` 是一个访问器函数，因为它使用但不改变存储在类变量中的任何值。\n\
  \n我们之前提到过，在设计类时，通常做法是将成员变量设为私有，并提供公共的 set 和 get 函数来访问这些变量。这保护了数据。类外部函数可以通过调用公共成员函数访问访问数据，而这些函数可以编写为防止数据被损坏或以可能影响对象行为的方式进行修改。注意程序\
  \ 7-3 中两个 set 函数是如何编写以过滤无效数据的。与其允许无效值存储在成员变量中，如果传递给它们的数据无效，它们会使用默认值。\n\n### 避免过期数据\n\
  \n在 `Rectangle` 类中，`getLength` 和 `getWidth` 成员函数返回存储在 `length` 和 `width` 成员变量中的值，但\
  \ `calcArea` 成员函数返回计算结果。你可能会奇怪为什么矩形的面积也不存储在成员变量中。不存储面积是因为它可能会变得过期。当一个项目的值依赖于其他数据，并且当其他数据发生变化时该项目没有更新，我们就说该项目已变得\
  \ `stale`（过期的）。如果矩形的面积存储在成员变量中，那么只要 `length` 或 `width` 成员变量发生变化，它的值就会变成错误的。\n\n\n\
  \n\n[content]\n\n在设计类时，通常不应该使用成员变量来存储可能变得过时的计算值。相反，应该提供一个成员函数，使用最新的数据来计算该值，然后返回计算结果。\n\
  \n## 关于内联函数的更多信息\n\n在设计类时，你需要决定哪些成员函数要在类声明中写为内联函数（inline functions），哪些要在类外定义。编译器处理内联函数的方式与处理普通函数完全不同。理解这种差异可能帮助你决定何时使用哪种。\n\
  \n每当调用普通函数时，后台都会发生很多操作。许多特殊项目，例如函数执行完毕后返回的地址以及函数参数的值，必须存储在名为 `stack`（栈）的内存区域中。此外，局部变量会被创建，并预留一个位置来存放函数的返回值。所有这些为函数调用做准备的开销都会消耗\
  \ CPU 时间。虽然所需时间很少，但如果函数被调用多次（例如在循环中），这些开销就会累积。\n\n另一方面，内联函数在传统意义上并没有被调用。相反，在一个名为\
  \ `inline expansion`（内联展开）的过程中，编译器会将对函数的每一次调用替换为函数本身的实际代码。这意味着如果函数在程序中的多个处被调用，其整个代码体将会被插入多次，从而增加程序的大小。这就是为什么只有代码行非常少的函数才应该被写为内联函数。事实上，如果函数太大到不便于进行内联展开，编译器将忽略以这种方式处理函数的请求。然而，当成员函数很小时，将其写为内联函数可以提高性能，因为当你不进行实际函数调用时，开销更小。\n\
  \n## 检查点\n\n1. 7.1 下列哪个显示了成员函数定义中作用域解析运算符的正确用法？\n    1. `InvItem::void setOnHand(int\
  \ units)`\n    2. `void InvItem::setOnHand(int units)`\n\n2. 7.2 对象的私有成员变量可以通过以下方式从对象外部访问\n\
  \    1. 公有成员函数\n    2. 任何函数\n    3. 点运算符\n    4. 作用域解析运算符\n\n3. 7.3 假设 `soap` 是\
  \ `Inventory` 类的实例，以下哪个是对 `setOnHand` 成员函数的有效调用？\n    1. `setOnHand(20);`\n    2.\
  \ `soap::setOnHand(20);`\n    3. `soap.setOnHand(20);`\n    4. `Inventory.setOnHand(20);`\n\
  \n4. 7.4 完成以下代码骨架以声明名为 `Date` 的类。该类应该包含成员变量和函数，用于存储和检索日期的月、日、年组件。\n```\nclass Date\n\
  {  private:\n   public:\n}\n```\n\n## 7.6 构造函数\n\n## 概念\n\n构造函数是在类对象创建时自动调用的成员函数。\n\
  \n构造函数是一种特殊的公有成员函数，在类对象创建时被自动调用以“构造”（construct）类对象。如果程序员没有写构造函数，C++ 会自动提供一个。你永远看不到它，但每当程序定义对象时，它都会后台默默运行。然而，程序员通常在创建类时会编写自己的构造函数。如果他们这样做，除了构造类的每个新创建的对象外，还会执行程序员包含在其中的任何代码。程序员通常使用构造函数来初始化对象的成员变量。然而，它可以执行任何普通函数可以做的操作。\n\
  \n### 注意\n\n关于如何在 UML 中表示构造函数的信息可以在该书配套网站的 [pearsonhighered.com/<wbr>gaddis](http://pearsonhighered.com/gaddis)\
  \ 中的 附录 F 中找到。\n\n构造函数看起来像普通函数，但它的名称必须与它所属的类的名称相同。编译器通过此识别某个特定的成员函数是构造函数。此外，构造函数不允许有返回值。\n\
  \n程序 7-4 包含一个名为 `Demo` 的类，该类有一个除了打印消息外什么都不做的构造函数。这样写是为了演示构造函数执行的时机。由于 `Demo` 对象是在两个\
  \ `cout` 语句之间创建的，构造函数将在这两个语句产生的输出行之间打印它的消息。\n\n在 程序 7-4 中，我们将构造函数定义为类声明内部的内联函数。然而，当成员函数很小时，将其写为内联函数可以提高性能，因为当你不进行实际函数调用时，开销更小。\n\
  \n```\nDemo::Demo()\n{\n    cout << \"Now the constructor is running.\\n\";\n}\n\
  ```\n\n程序 7-4 中，我们将构造函数定义为类声明内部的内联函数。然而，当成员函数很小时，将其写为内联函数可以提高性能，因为当你不进行实际函数调用时，开销更小。\n\
  \n## 重载构造函数\n\n回想 第 6 章，当两个或多个函数共享相同的名称时，它们被称为认为重载（overloaded）。只要参数列表不同，C++ 程序中可以存在多个同名的函数。\n\
  \n就像其他函数一样，类成员函数也可以重载，包括构造函数。例如，一个构造函数可能接受一个 `int` 参数，而另一个构造函数接受 `double`。甚至可以有第三个接受两个整数的构造函数。只要每个构造函数都有不同的参数列表创建了唯一的签名，编译器就能区分它们。\n\
  \n程序 7-6 声明并使用了一个名为 `Sale` 的类，该类有两个构造函数。第一个接受一个销售税率的参数。第二个（用于免税销售）没有参数。这种没有参数的构造函数被称为“默认构造函数”（default\
  \ constructor）。\n\n注意 [程序 7-6] 第 29 行和第 30 行](#fileP70010160890000000000000000005827.xhtml_P70010160890000000000000000058B3)，两个\
  \ `Sale` 对象是如何定义的。\n\n```\nSale cashier1(.06);\nSale cashier2;\n```\n\n在 `cashier1`\
  \ 后面有一对括号，用于存放发送给单参数构造函数的值。然而，`cashier2` 后面没有括号，表示不发送任何参数。在 C++ 中，使用默认构造函数定义对象时，与其传递参数，不如说不有任何括号。\n\
  \n```\nSale cashier2();        // 错误！\nSale cashier2;          // 正确\n```\n\n\n\n\
  \n`Sale` 类需要一个默认构造函数来处理免税销售。其他类可能看起来不需要构造函数——例如，如果从这些类创建的对象总是预期要向构造函数传递参数。然而，每当你设计一个带有构造函数的类时，包含一个默认构造函数被认为是一种良好的编程实践。如果你没有定义它，并且程序尝试在不传递任何参数的情况下创建对象，它将无法编译。这是因为必须有一个构造函数来创建对象。为了创建一个不传递任何参数的对象，必须有一个不接受任何参数的构造函数——即默认构造函数。如果程序员没有为类编写任何构造函数，编译器会自动为该类创建一个默认构造函数。但是，当程序员编写了一个或多个构造函数时（即使这些构造函数都带有参数），编译器就不会再创建默认构造函数。因此，这是程序员的责任。\n\
  \n一个类可以有多个构造函数，但只能有一个默认构造函数。这是因为如果多个函数具有相同的名称，编译器必须能够根据它们的参数列表确定在任何时刻调用的是哪一个。它通过传递给函数的参数数量和类型来确定调用哪一个重载函数。由于类名函数中只能有一个能够不接受任何参数，因此只能有一个默认构造函数。\n\
  \n通常，如 `Sale` 类所示，默认构造函数没有参数。然而，如果所有参数都有默认值，则可以拥有带有参数的默认构造函数，这样就可以在不带参数的情况下调用。创建一个不接受参数的构造函数和另一个带有参数但为所有参数都允许默认值的构造函数是错误的。这在本质上会创建两个“默认”构造函数。下面的类声明是非法地这样做的。\n\
  \n```\nclass Sale                // 非法声明！\n{ private:\n    double taxRate;\n\n \
  \ public:\n    Sale()                // 无参数的默认构造函数\n    {  taxRate = 0.05; }\n \
  \   Sale(double r = 0.05) // 带有默认参数的默认构造函数\n    {  taxRate = r; }\n    double calcSaleTotal(double\
  \ cost)\n    {  double total = cost + cost * taxRate;\n       return total;\n};\n\
  ```\n\n可以看出，第一个构造函数没有参数。第二个构造函数有一个参数，但它有一个默认参数。如果定义对象时没有参数列表，编译器将无法判断执行哪一个构造函数。\n\
  \n# 初始化成员变量的其他方法\n\n## 使用成员初始化列表\n\n在创建对象时，有两种额外方法初始化成员变量。第一种是使用成员初始化列表。`成员初始化列表`是一个成员变量名称及其初始值的列表，它出现在构造函数头部之后、正体左大括号之前。\n\
  \n以下是 程序 7-6 中 `Sale` 类构造函数的示例，每个构造函数都重写为使用成员初始化列表而不是赋值语句：\n\n```\nSale(double rate)\
  \ : taxRate(rate)\n{\n}\n\nSale() : taxRate(0.0)\n{\n}\n```\n\n注意函数头部结尾有一个冒号。这标志着后面跟着一个成员初始化列表。列表可以放在与头部同一行，也可以放在下一行。成员初始化列表包含了要初始化的每个变量名称，后面是括在括号中的其初始值。在这种情况下，只初始化了一个变量，但也可以在初始化列表中初始化一组变量。在这种情况下，项之间应该用逗号分隔。\n\
  \n以下是为 程序 7-3 写构造示例，用于初始化 `Rectangle` 类的 `length` 和 `width` 变量。\n\n```\nRectangle(double\
  \ len, double w) :\n   length(len), width(w)\n{\n}\n```\n\n### 注意\n\n注意初始化列表后面*不能*有分号。\n\
  \n当构造函数具有成员初始化列表时，初始化发生在执行执行任何执行之前。在上面的示例中，构造函数的体都是空的，因为成员变量的初始化是由初始化列表处理的，所以构造函数不需要做其他事情。\n\
  \n许多程序员倾向于使用成员初始化列表而不是构造函数体内的赋值语句，因为在某些情况下，它允许编译器生成更高效的代码。\n\n## 使用地成员初始化\n\n在 C++\
  \ 11 之前，你不能在类声明内部初始化成员变量。为了在创建类对象时设置初始值，代码必须调用一个要么给类成员分配初始值要么具有成员初始化列表的构造函数。从 C++\
  \ 11 开始，你可以在类声明内部定义成员变量时对其初始化。这被称为`原地初始化`（in-place initialization）。这是一个示例：\n\n```\n\
  class Rectangle\n{\nprivate:\n   double width = 0.0;\n   double length = 0.0;\n\
  public:\n    公共成员函数放在此处。\n};\n```\n\n# 构造函数委托\n\n通常，一个类会有多个执行相似步骤的构造函数，其中某些步骤是相同的。例如，查看下面的\
  \ `Contact` 类：\n\n```\nclass Contact\n{\nprivate:\n   string name;\n   string email;\n\
  \   string phone;\npublic:\n   // 默认构造函数\n   Contact()\n   {  name = \"\";\n   \
  \   email = \"\";\n      phone = \"\";\n   }\n\n   // 构造函数 #2\n   Contact(string\
  \ n, string e, string p)\n   {  name = n;\n      email = e;\n      phone = p;\n\
  \   }\n\n   其他成员函数放在此处。\n};\n```\n\n在这个类中，两个构造函数都执行了相似的操作。它们为 `name`、`email` 和 `phone`\
  \ 成员变量赋值。默认构造函数为成员分配空字符串，而带有参数的构造函数为它们分配指定的值。\n\n在 C++11 中，一个构造函数可以调用同类中的另一个构造函数。这被称为`构造函数委托`（constructor\
  \ delegation）。下面的示例展示了如何使用构造函数委托来避免 `Contact` 类中的重复代码：\n\n```\nclass Contact\n{\n\
  private:\n   string name;\n   string email;\n   string phone;\npublic:\n   // 默认构造函数\n\
  \   Contact() : Contact(\"\", \"\", \"\")\n   { }\n\n   // 构造函数 #2\n   Contact(string\
  \ n, string e, string p)\n   {  name = n;\n      email = e;\n      phone = p;\n\
  \   }\n\n   其他成员函数放在此处。\n};\n```\n\n# 7.7 析构函数\n\n## 概念\n\n析构函数是在对象销毁时自动调用的成员函数。\n\
  \n析构函数是与类名相同且带有波浪号（`~`）的公共成员函数。例如，`Rectangle` 类的析构函数将命名为 `~Rectangle`。\n\n\n\n\n\
  析构函数在对象销毁时会被自动调用。与构造函数可以用于在对象创建时进行设置一样，析构函数用于在对象不再存在时执行清理程序。这种情况发生在，例如当带有对象的程序停止执行时，或者你从创建了对象的函数返回时。\n\
  \n## 备注\n关于如何在 UML 中表示析构函数的信息，可以在本书的配套网站 [pearsonhighered.com/gaddis](http://pearsonhighered.com/gaddis)上的附录\
  \ F 中找到。\n\n程序 7-7 显示了一个带有构造函数和析构函数的简单类。它说明了它们在程序执行过程中何时被调用。\n\n除了析构函数在对象销毁时会被自动调用这一点外，还应该提到以下几点：\n\
  \n*   像构造函数一样，析构函数没有返回值。\n*   析构函数不能接受参数，因此它们永远没有参数列表。\n*   由于析构函数不能接受参数，所以只能有一个析构函数。\n\
  \n析构函数在处理动态分配的对象时最有用。你将在第 10 章中学习相关内容。\n\n## 检查点\n1. 7.5 简述构造函数的目的。\n2. 7.6 构造函数的名称与以下哪个相同：\n\
