  ## 4.9 关于块和作用域\n\n## 概念\n\n变量的作用域局限于定义它的块。\n\nC++ 允许你在程序的几乎任何地方创建变量。将函数的所有变量定义在函数顶部（紧跟在标记函数体开始的左括号之后）是一种常见做法。然而，特别是在较长的程序中，变量有时会被定义在它们使用的附近。只要它们在被之前被定义，这是允许的。\n\
  \n你在本章前面学过，用大括号包围一个或多个编程语句定义了一个代码块。函数 `main` 的体必须被括号包围，它是一个代码块。`if/else` 语句中与 `if`\
  \ 或 `else` 相关的语句也是如此。每当在块内部定义变量时（你可以在任何块内部定义变量），它的作用域就是从定义处到块结束括号之间的程序部分。因此，定义在函数顶部的变量的作用域本质上是整个函数，而定义在内部块中的变量的作用域仅仅是该块。\n\
