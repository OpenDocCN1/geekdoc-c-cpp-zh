  \   return 0;\n}\n```\n\n# 8.4 数组初始化\n\n## 概念\n\n数组可以在定义时进行初始化。\n\n有时，在程序内部设置变量值比通过输入设置它们更合适。然而，为数组的每个元素编写单独的赋值语句意味着大量的输入工作，特别是对于大型数组而言。例如，考虑一个需要创建一个存储每年每月天数的数组的程序。可以通过包含如下所示的语句来实现：\n\
  \n```cpp\nconst int NUM_MONTHS = 12;\nint days[NUM_MONTHS];\n\ndays[0] = 31; //\
  \ 一月\ndays[1] = 28; // 二月\ndays[2] = 31; // 三月\ndays[3] = 30; // 四月\n...\ndays[11]\
  \ = 31; // 十二月\n```\n\n但这需要 12 条单独的赋值语句，每个月一条。\n\n幸运的是，还有另一种替代方案。正如你在程序 8-4 中简要看到的，C++\
  \ 允许你在定义数组时使用初始化列表来初始化它。下面的语句展示了如何操作。它定义了 `days` 数组并用每个月的天数对其初始化。\n\n```cpp\nint\
  \ days[NUM_MONTHS] = {31, 28, 31, 30, 31, 30, 31, 31, 30, 30, 31};\n```\n\n当执行该语句时，值将按照它们出现的顺序放入数组元素中。第一个值\
  \ `31` 存储在 `days[0]` 中，第二个值 `28` 存储在 `days[1]` 中，依此类推。\n\n# 图 8-9 初始化后的 days 数组内容\n\
  \n内存存储器显示一个划分为 12 个等大小矩形的矩形。矩形的下标从 `0` 到 `11`。矩形中的值值分别为 `31, 28, 31, 30, 31, 30,\
  \ 31, 31, 30, 30 和 31`。\n\n程序 8-5 包含了上述声明和初始化语句。它还包含了一个类似的语句，用于创建并初始化一个存储月份名称的字符串数组。注意这些初始化列表是如何跨多行分布的。\n\
  \n到目前为止，我们已经演示了如何向数组填充值然后显示所有值。然而，有时我们想从数组中取回一个特定的值。程序 8-6 是程序 8-5 的变体，它显示了用户选择的月份有多少天。\n\
  \n# 从数组元素 1 开始\n\n某些老师倾向于让你不要使用数组元素 0，而是在对逻辑上从 1 开始的现实世界事物进行建模时，改为从元素 1 开始存储实际数据。月份就是一个很好的例子。在这种情况下，你声明\
  \ `name` 和 `days` 数组各包含 13 个元素，并像如下所示初始化：\n\n```cpp\nstring name[NUM_MONTHS+1] =\
  \ \n           { \" \", \"January\", \"February\", \"March\", \"April\", \n    \
  \              \"May\", \"June\", \"July\", \"August\",\n                  \"September\"\
  , \"October\", \"November\", \"December\" };\nint days[NUM_MONTHS+1] = {0, 31, 28,\
  \ 31, 30,\n                             31, 30, 31, 31,\n                      \
  \       30, 31, 30, 31};\n```\n\n注意数组元素 0 没有被使用。它只是持有一个占位值。这允许第一个月份一月存储在 `name[1]`\
  \ 中，第二个月份二月存储在 `name[2]` 中，依此类推。同样，一月的天数在 `days[1]` 中，二月的天数在 `days[2]` 中，依此类推。\n\
  \n如果数组按此处定义和初始化，那么程序 8-5 第 22 行到 26 行的循环将如下所示：\n\n```cpp\nfor (int month = 1; month\
