  \ 500 卡路的热量摄，他们通常每月可以减轻 4 磅。编写一个程序让用户输入初始体重，然后创建并显示一个表格，显示他们在坚持这种饮食的未来 6 个月内每个月底的预期体重。\n\
  \n### 10. 消耗的热量\n\n在特定的跑步机上跑步，你每分钟消耗 3.9 卡路里。编写一个程序，使用循环显示在 5、10、15、20、25 和 30 分钟后消耗的热路里数。\n\
  \n### 11. 会费上涨\n\n某乡村俱乐部目前每年收取 3,000 美元的会员费，宣布在未来五年内每年将将其会员费提高 3%。编写一个程序，使用循环显示未来五年的预计费率。\n\
