  \n# 11.14 重写基类函数\n\n## 概念\n\n派生类可以通过定义一个具有相同名称和参数列表的派生类成员函数，来重写其基类的成员函数。\n\n派生类定义其继承自基类的成员函数的自己的版本通常是很有用的。这可能是为了根据派生类的需求对成员函数进行特化。当这种情况发生时，基类成员函数被认为被派生类*重写*或*重定义*。\n\
  \n举一个简单的例子，假设我们想要有一个 `TFaculty` 类，允许我们为教职人员的每个成员关联一个如“博士”、“教授”或“院长”之类的头衔。为了实现这一点，我们通过从\
  \ `Faculty` 类派生新类，添加一个 `title` 数据成员、适当的构造函数、一个设置头衔的成员函数，然后重写继承的 `getName()` 成员函数以返回一个“带头衔的”名称。\n\
  \n```cpp\n class TFaculty: public Faculty\n{\nprivate:\n  string title;\npublic:\n\
  \  // 此构造函数允许指定头衔\n  TFaculty(const string& fname, Discipline d, string title)\n\
  \  : Faculty(fname, d)\n  {\n    setTitle(title);\n  }\n  void setTitle(const string&\
  \ title) { this−>title = title; }\n\n  // 重写 getName 函数\n  string getName( ) const\
  \ { return title + \" \" + name; }\n};\n```\n\n程序 11-22 展示了类及其重写成员函数的使用。它使用了 `inheritance3.h`\
  \ 和 `inheritance3.cpp` 文件。`inheritance3.h` 文件只是在 `inheritance2.h` 的基础上增加了 `TFaculty`\
  \ 的类声明，而 `inheritance3.cpp` 与 `inheritance2.cpp` 相同。`inheritance2.h` 和 `inheritance2.cpp`\
  \ 的代码列表可以在第 11-13 节末尾找到。所有文件的副本都包含在书籍辅助网站上。\n\n## 在重写函数的基类和派生类版本之间进行选择\n\n重写了基类成员函数的派生类对象包含了该成员函数的多个版本。编译器将通过使用调用成员函数时表达式中的类型信息来决定调用多个版本中的哪一个。例如，在程序\
  \ 11-22 中，有两个对 `getName()` 的调用：\n\n1. 调用 `prof.getName()` 返回 `Dr. Indiana Jones`，因为函数是通过\
  \ `prof` 调用的，`prof` 的类型是 `TFaculty`。编译器调用 `TFaculty` 版本的 `getName()`。\n\n2. 调用 `pAdvisor−getName()`\
  \ 返回 `Indiana Jones`，不带“Dr.”，因为函数是通过指针 `pAdvisor` 调用的，`pAdvisor` 是指向 `Person` 的指针。编译器调用\
  \ `Person` 版本的 `getName()`。\n\n## 重载与重写的区别\n\n重载和重写都涉及定义相同名称的不同函数。然而，这两个概念之间存在差异。重写只能在继承的上下文中进行，并指当基类已经有一个具有相同名称和参数列表的成员函数时，派生类对该成员函数的定义。重载是指在同一个类中定义具有相同但*不同*参数列表的不同函数。重载也可以指在全局层级定义具有不同参数列表的不同函数。\n\
  \n## 获取重写的成员函数\n\n如果派生类重写了基类成员函数，那么派生类中原本会调用被重写的基类成员函数的成员函数，现在将调用派生类中的版本。有时能够调用被重写的版本是很有用的。事实上，派生类的新成员函数可能想要调用它正在重写的基类成员函数。这是通过使用作用域运算符来指定所访问的重写成员函数的类来实现的。例如，`TFaculty`\
  \ 中调用 `Person` 的 `getName` 函数的成员函数可以这样做：\n\n```cpp\nPerson::getName();\n```\n\n\
  因此，`TFaculty`类的更好的版本如下：\n\n```cpp\nclass TFaculty : public Faculty\n{\nprivate:\n\
  \  string title;\npublic:\n  TFaculty(const string& fname, Discipline d, string\
  \ title)\n  : Faculty(fname, d)\n  {\n    setTitle(title);\n  }\n  void setTitle(const\
  \ string& title) { this−>title = title; }\n\n  // 重写 getName 函数\n  string getName(\
  \ ) const { return title + \" \" + name; }\n};\n```\n\n## 复习题与练习题\n\n## 空题与简答\n\n\
