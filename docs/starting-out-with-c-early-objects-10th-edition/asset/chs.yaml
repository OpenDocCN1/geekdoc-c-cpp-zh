  # 7.10 对象组合 (Object Composition)\n\n## 概念\n\n类可以拥有一个另一个类的实例成员变量。有时将一个类的对象嵌套另一个类内部是有帮助的。例如，考虑以下声明：\n\
  \n```\nclass Rectangle\n{\n   private:\n      double length;\n      double width;\n\
  \   public:\n      void setLength(double);\n      void setWidth(double);\n     \
  \ double getLength();\n      double getWidth();\n      double calcArea();\n};\n\n\
  class Carpet\n{\n   private:\n      double pricePerSqFt;\n      Rectangle size;\n\
  \   public:\n      void setPricePerSqFt(double);\n      void setDimensions(double,\
  \ double);\n      double getTotalPrice();\n};\n```注意 `Carpet` 类有一个名为 `size` 的成员变量，它是\
  \ `Rectangle` 类的实例。`Carpet` 类可以使用此对象来存储房间尺寸并计算地毯面积。`Figure 7-4` 说明了这两个类之间的关系。当一个类这样嵌套在另一个类内部时，被称为`对象组合`（object\
  \ composition）。\n\n# 图 7-4 对象组合\n\n![图表显示一个水平方向分为三部分的矩形](img/FG_07_004.png) `图 7-4\
  \ 对象组合全文`\n\n`Program 7-11` 使用这两个类来创建一个计算地毯价格的应用。\n\n让我们仔细观察 `Program 7-11`。注意，定义\
  \ `purchase`（一个 `Carpet` 对象）的客户端程序只使用它来调用 `Carpet` 类的函数，而不是 `Rectangle` 类的函数。它甚至不知道\
  \ `Carpet` 类内部有一个 `Rectangle` 对象。同样注意在第 39、40 和 44 行，`Carpet` 类函数是如何调用 `Rectangle`\
  \ 函数的。就像用户程序通过其 `Carpet`对象的名称调用 `Carpet` 函数一样，`Carpet` 类函数必须通过其 `Rectangle` 对象的名称调用\
  \ `Rectangle` 函数。第 32 行定义的 `Rectangle` 对象命名为 `size`。这就是为什么 `Carpet` 函数进行如下调用：\n\n\
  ```\nsize.calcArea()\n```\n\n## Checkpoint\n\n1. 7.20 假设一个 `Map` 类有一个名为 `position`\
  \ 的成员变量，该变量是 `Location` 类的实例。`Location` 类有一个名为 `latitude` 的私有成员变量和一个名为 `getLatitude`\
  \ 的公共成员函数。以下哪行代码可以正确获取并返回存储在 `latitude` 中的值？\n\n\n\n\n\n1. `return Location.latitude;`\n\
