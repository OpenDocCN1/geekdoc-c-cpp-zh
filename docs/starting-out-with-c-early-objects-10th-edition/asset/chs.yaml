  \ 5 章 程序文件夹中的 `lineUp.txt` 文件找到。\n\n# 30. 使用文件——储蓄账户余额修改\n\n修改“编程挑战 25”中描述的“储蓄账户余额”程序，将报告写入文件。程序运行后，打印该文件以提交给您的讲师。\n\
  \n# 第 6 章 函数\n\n## 6.1 模块化编程\n\n## 概念\n\n程序可以被分成一组易于管理的函数或模块。这被称为模块化编程。\n\n函数是执行特定任务的语句集合。到目前为止，你已经以两种方式使用了函数：(1)\
  \ 你在你写的每个程序中都创建了一个名为 `main` 的函数，(2) 你调用了如 `pow` 和 `sqrt` 等库函数。在本章中，你将学习如何创建自己的可以像库函数一样使用的函数。\n\
  \n函数通常用于将问题分解成较小的、易于管理的片段或模块。与其编写一个包含解决问题所需的所有语句的长函数，不如编写几个较小的函数，每个函数负责解决问题的特定部分。然后，可以按照所需的顺序执行这些小函数来解决问题。这种方法有时被称为*分而治之*，因为一个大问题被分成了几个更容易解决的小问题。图\
  \ 6-1 通过比较两个程序说明了这一思想：一个程序使用包含解决问题所需所有语句的单个模块，另一个程序将问题划分为一组较小的问题，每个问题由一个独立的函数处理。\n\
  \n## 图 6-1 模块化编程\n\n![一张显示 2 个程序的截图。](img/FG_06_001.png)图 6-1 完整替代文本\n\n编写函数的另一个原因是它们简化了程序。如果某个特定任务在程序的多个地方被执行，则可以编写一次函数来执行该任务，并在需要时随时执行。使用函数的这种好处是代码复用。\n\
  \n## 6.2 定义和调用函数\n\n## 概念\n\n函数调用是导致函数执行的语句。函数定义包含函数的语句。在创建函数时，你必须编写以下部分：\n\n| 名称\
  \ | 每个函数必须有一个名称。通用的规则适用于函数名称。 |\n| 参数列表 | 调用函数的程序可以向其传递数据。如果函数有任何参数，它们将列在括号内。即使参数列表为空，也必须包含括号。\
  \ |\n| 函数体 | 函数体是执行任务的语句集合。这些语句封装在大括号中。 |\n| 返回类型 | 函数可以向调用它的程序返回一个值。返回类型是返回值的数据类型。\
  \ |\n\n图 6-2 显示了简单函数的定义，带有各种标签。\n\n## 图 6-2 函数定义\n\n![图像显示了一个函数并解释了它的部分。](img/FG_06_001.png)图\
  \ 6-2 完整替代文本\n\n定义中的第一行被称为*函数头*。让我们仔细观察它的三个部分。首先是函数的返回类型。然后是它的名称。头部以一组括号结束。如果函数有任何参数，它们将列在括号内。然而，即使参数列表为空，也必须包含括号，如图\
  \ 6-2](#fileP700101608900000000000000045BC.xhtml_P700101608900000000000000045D)\
  \ 所示。\n\n## Void 函数\n\n你已经知道函数可以返回值。然而，某些函数只是执行一个或多个语句然后返回。在 C++ 中，这些被称为 *void 函数*。这里显示的\
  \ `displayMessage` 函数是一个示例：\n\n```\n void displayMessage()\n{\n    cout << \"Hello\
  \ from the function displayMessage.\\n\";\n}\n```\n\n函数的名称是 `displayMessage`。这个名称是描述性的，函数名称应该是这样的。它指示了函数的功能。它显示一条消息。因为函数不需要接收任何信息来执行其工作，所以括号内没有参数。函数的返回类型是\
  \ `void`。这意味着函数在执行完毕并返回到调用它的程序部分时不会返回任何值。因为没有返回值，所以不需要 `return` 语句。当函数中的语句执行完毕并遇到结束右括号时，程序会自动返回。\n\
  \n## 调用函数\n\n\n\n\n\n函数在被`called.` 时会执行。当程序启动时，函数 `main` 会被自动调用，但所有其他函数都必须通过 `function\
  \ call` 语句来执行。当函数被调用时，程序会跳转到该函数并执行其体内的语句。让我们来看程序 6-1，它包含了两个函数：`main` 和 `displayMessage`。\n\
  \n与所有的 C++ 程序一样，程序从 `main` 开始执行。其他函数只有在被调用时才会执行。在程序 6-1 中，`displayMessage` 函数是通过\
  \ `main` 第 14 行的以下语句调用的：\n\n```\ndisplayMessage();\n```\n\n注意函数调用的形式。它仅仅是函数名后后跟一组括号和一个分号。让我们将其与函数头进行比较：\n\
  \n| 函数头 | $$\\overset{\\mspace{90mu}}{\\rightarrow}$$ | `void displayMessage()`\
  \ |\n\n| 函数调用 | $$\\overset{\\mspace{90mu}}{\\rightarrow}$$ | `displayMessage();`\
  \ |\n\n函数头是函数定义的一部分。它声明了函数的返回类型、名称和参数列表。它*不能*以分号结束，因为函数体的定义紧随其后。\n\n函数调用是一个执行函数的语句，因此它像所有其他\
  \ C++ 语句一样*以*分号结束。注意，函数调用不包含返回类型。\n\n你可能在好奇程序 6-1 第 6 行的语句是做什么。它被称为`函数原型`（function\
  \ prototype），它的工作仅仅是让编译器知道程序稍后会出现某个函数。注意，它看起来和函数头一样，只不过它是一个语句，所以它以分号结尾。在下一节中，你将学习更多关于函数原型的知识。\n\
  \n现在让我们来看看程序 6-1 是如何流动的。它当然 main 函数 函数。当遇到对 `displayMessage` 的调用时，程序跳转到该函数并执行其语句。一旦\
  \ `displayMessage` 执行完毕，程序跳转回 `main` 函数并从函数调用之后的行继续执行。这在图 6-3 中得到了说明。\n\n## 图 6-3\
  \ 函数调用\n\n![一个程序解释了函数调用。](img/FG_06_003.png)图 6-3 完整替代文本\n\n函数调用语句可以用于控制结构，如循环、`if`\
  \ 语句和 `switch` 语句。程序 6-2 将 `displayMessage` 函数调用放在循环内部。\n\n程序中可以有很多函数和函数调用。程序 6-3\
  \ 包含三个函数：`main`、`first` 和 `second`。\n\n在程序 6-3 第 15 行和 16 行中，`main` 函数包含了对 `first`\
  \ 的调用和对 `second` 的调用：\n\n```\nfirst();\nsecond();\n```\n\n每个调用语句导致程序跳转到一个函数，并在函数完成后返回\
  \ `main`。图 6-4 说明了程序的运行路径。\n\n## 图 6-4 程序运行路径\n\n![图像显示了代码并解释了程序的路径。](img/FG_06_004.png)图\
  \ 6-4 完整替代文本\n\n函数也可以以分级或分层的方式被调用。程序 6-4 包含了三个函数：`main`、`deep` 和 `deeper`。在程序 6-4\
  \ 中，`main` 函数只调用了 `deep` 函数。相反，`deep` 调用了 `deeper`。该程序的运行路径如图 6-5 所示。\n\n## 图 6-5\
  \ 层调用\n\n![![模块的程序解释了函数调用。](img/FG_06_005.png)图 6-5 完整替代文本\n\n## 知识点\n\n使用以下信息回答问题\
  \ 6.1–6.6。每个函数内的行号已供参考。\n\n一个程序包含以下函数：\n\n```\n1 void printHeading()\n2 {\n3   \
  \ cout << \"The History of Computers \\n\";\n4 }\n```\n\n程序的 `main` 函数包含以下代码：\n\n\
  ```\n12 for (int count = 0; count < 3; count++)  \n13 {   printHeading ();\n14 \
  \    cout << \"I called printHeading \\n\";\n15 }\n```\n\n1. 6.1 第一行是函数头还是函数调用？\n\
  2. 6.2 十三是函数头还是函数调用？\n3. 6.3 `printHeading` 函数被调用了次？\n4. 6.4 哪一行的代码导致程序离开 `printHeading`\
  \ 函数并返回 `main`？\n5. 6.5 当程序返回 `main` 时，下执行哪一行的代码？\n6. 6.6 当执行 `main` 的 12–15 行时会显示什么？\n\
  \n## 6.3 函数原型\n\n## 概念\n\n函数原型消除了在所有函数调用之前放置函数定义的需要。\n\n在编译器遇到特定函数的调用之前，它必须已经知道关于函数的某些信息。特别是，它必须知道函数使用的参数数量、每个参数的数据类型以及函数的返回类型。这通常通过为程序中的除\
  \ `main` 之外每个函数包含函数原型来实现。`main` 函数永远不需要原型，因为它是程序的起点。\n\n你在本章目前看到的函数没有从调用它们的函数接收任何信息，因此它们没有参数。除了\
  \ `main` 之外，它们没有返回任何信息，因此它们的返回类型是 `void`。让我们仔细查看程序 6-1 中 `displayMessage` 函数的原型：\n\
  \n```\nvoid displayMessage();\n```\n\n这个原型看起来与函数头相似，但结尾有一个分号。该语句告诉编译器 `displayMessage`\
  \ 函数没有使用参数且具有 `void` 返回类型，意味着它不返回值。\n\n注意程序 6-1 中 `displayMessage` 函数的原型被放在 `main`\
  \ 函数上方。如果没有那里的原型为编译器提供所需信息，整个 `displayMessage` 函数定义必须放在 `main` 函数之前才能被调用。程序 6-5\
  \ 修订了程序 6-1，展示了在如果没有函数原型的情况下需要如何重新组织。\n\n\n\n\n\n一些程序员倾向于使用这种组织结构，并将主函数放在最后。然而，大多数程序员发现，为\
