  \n## 软技能\n\n\n\n\n\n## 案例研究：维护\n\n贵公司的软件是市场领导者，但由于它是用 `C` 语言编写的且没有使用面向对象的概念，导致维护非常困难。客户已经发现了必须立即修复的软件问题，并指出了竞争产品中希望你们支持的功能。最佳解决方案需要完全的面向对象（OOP）重新设计和随后的实现，但这需要三年的。给公司管理层写一份备忘录，概述你对公司应该采取的行动建议。\n\
  \n## 编程挑战\n\n## 1. 支票编写\n\n设计一个 `Numbers` 类，用于将 0 到 9999 范围内的整数美元金额转换为数字的英文描述。例如，数字\
  \ 713 将翻译为字符串 `seven hundred thirteen`，而 8203 将翻译为 `eight thousand two hundred three`。\n\
  \n该类应该有一个整数成员变量：\n\n```cpp\nint number;\n```\n\n以及一组静态字符串成员集合，用于指定如何将关键美元金额转换为所需的格式。例如，你可以使用如下静态字符串：\n\
  \n```cpp\nstring lessThan20[ ] =\n    {\"zero\", \"one\", …, \"eighteen\", \"nineteen\"\
  \ };\nstring hundred = \"hundred\";\nstring thousand = \"thousand\";\n```\n\n该类应该有一个接受非负整数并用其来初始化\
  \ `Numbers` 对象的构造函数。它应该有一个成员函数 `print()`，用于打印 `Numbers` 对象的英文描述。通过编写一个主程序来演示该类，该程序要求用户输入一个范围内的数字，然后打印其英文描述。\n\
  \n## 2. 一年中的一天\n\n假设一年有 365 天，编写一个名为 `DayOfYear` 的类，它接收一个代表一年某天的整数，并将其转换为由月份和日期组成的字符串。例如：\n\
  \n*   第 2 天是 `January 2`。\n*   第 32 天是 `February 1`。\n*   第 365 天是 `December 31`。\n\
  \n该类的构造函数应接受代表一年某天的整数作为参数，该类应该有一个成员函数 `print()`，以“月-日”的格式打印日期。该类应该有一个整数成员变量来表示日期，并有\
  \ `string` 类型的静态成员变量来辅助从整数格式到“月-日”格式的转换。\n\n通过输入代表不同日的各种整数并打印它们在“月-日”格式下的表示来测试你的类。\n\
  \n## 3. 一年中的天的修改\n\n修改之前编程挑战中编写的 `DayOfYear` 类，添加一个接受两个参数的构造函数：一个代表月份的字符串和一个在 0\
  \ 到 31 范围内的代表日期的整数。该构造函数应该初始化类的整数成员，以表示由月份和日期参数指定的日期。如果输入的日期数字超出给定月份的天数范围，则构造函数应带有适当的错误信息终止程序。\n\
  \n添加以下重载运算符：\n\n*   `++` 前置和后置递增运算符。这些运算符应该修改 `DayOfYear` 对象，使其表示下一天。如果日期已经是年底，对象的新值将代表新年的第一天。\n\
  *   `--` 前置和后置递减运算符。这些运算符应该修改 `DayOfYear` 对象，使其表示前一天。如果日期已经是年的第一天，对象的新值将代表一年的最后一天。\n\
  \n## 4. 工作天数\n\n设计一个名为 `NumDays` 的类。该类的目的是存储一个代表工作小时数的值并将其转换为天数。例如，8 小时将转换为 1 天，12\
  \ 小时将转换为 1.5 天，18 小时将转换为 2.25 天。该类应该有一个接受小时数的构造函数，以及用于存储和检索小时数与天数的成员函数。该类还应该以下重载运算符：\n\
  \n*   加法运算符 `+`。两个对象之和的小时数是各个对象小时数之和。\n*   减法运算符 `−`。两个对象 `X` 和 `Y` 之差的小时数是 `X`\
  \ 的小时数减去 `Y` 的小时数。\n*   前置和后置递增运算符 `++`。对象的小时数加 1。\n*   前置和后置递减运算符 `−−`。对象的小时数减\
  \ 1。\n\n## 5. 回文测试\n\n回文是一个正读和反读都相同的字符串。例如，`mom`、`dad`、`madam` 和 `radar` 词都是回文。编写一个派自\
  \ STL `string` 类的 `Pstring` 类。`Pstring` 类增加了一个成员函数\n\n```cpp\nbool isPalindrome()\n\
  ```\n\n用于判断字符串是否为回文。包含一个接受 STL `string` 对象作为参数并将其传递给 `string` 基类构造函数的构造函数。通过一个主程序测试你的类，该程序要求用户输入一个字符串。程序使用该字符串初始化\
  \ `Pstring` 对象，然后调用 `isPalindrome()` 判断输入的字符串是否为回文。\n\n你可能会发现字符串类的下标运算符 `[]` 很有用：如果\
  \ `str` 是字符串对象且 `k` 是整数，那么 `str[k]` 返回字符串中位置 `k` 处的字符。\n\n## 6. 字符串加密\n\n编写一个派自\
  \ STL `string` 类的 `EncryptableString` 类。该字符串类增加了一个成员函数\n\n```cpp\nvoid encrypt()\n\
  ```\n\n通过将每个字母替换为它的后续字符来加密对象中的字符串。例如，`baa` 将加密为 `cbb`。假设 `EncryptableString` 对象的所有字符都是\
  \ `a`..`z` 和 `A`..`Z`，并且 `z` 的后续是 `a`，`Z` 的后续是 `A`。用一个程序测试你的类，程序要求用户输入字符串，然后进行加密并打印。\n\
  \n## 7. 销售额\n\n一家公司有六个部门，每个部门负责不同地区的销售。设计一个 `DivSales` 类来保留部门的销售数据，具有：\n\n*   一个包含四个元素的数组，用于持有该部门四个季度的销售额。\n\
  *   一个用于持有所有部门全年总额的静态变量。\n*   一个接受四个参数的成员函数，每个参数假设为一个季度。参数的值应复制到持有销售数据的数组中。四个参数的总和应加到持有总额的静态变量中。\n\
  *   一个接受 0 到 3 范围内整数参数的函数。该参数用作季度销售数组的索引。该函数返回该索引数组元素的值。\n\n编写一个程序创建一个 `DivSales`\
  \ 对象数组。程序要求用户输入每个部门四个季度的销售额。输入数据后，程序应显示显示每个部门季度销售情况的表格。程序最后显示全年的总销售额。\n\n## 8. 有理数运算\
  \ I\n\n*有理数*是两个整数的商。例如，12/5、12/–`4`、`–`3/4 和 4/6 都是有理数。如果分母为正且分子和分母没有除 1 外的公约数，则该有理数处于*约简形式*。例如，上述有理数的约简形式为\
  \ 12/5、`–`3/1、`–`3/4 和 2/3。\n\n\n\n\n编写一个名为 `Rational` 的类，其构造函数 `Rational(int, int)`\
  \ 接收两个整数，即分子和分母，并将这两个值以约分形式存储在相应的私有成员中。该类应有一个私有成员函数 `void reduce()`，用于完成向约分形式的转换。该类应有一个重载的插入运算符\
  \ `<<`，用于类对象的输出。\n\n# 9. 有理数算术 II\n\n修改编程挑战 8 中的 `Rational` 类，添加重载的运算符 `+`、`-`、`*`\
  \ 和 `/`，用于加、减、乘、除法。通过从键盘（或文件）读取并处理一系列有理数表达式来测试该类，例如：\n\n```\n2 / 3 + 2 / 8\n2 /\
  \ 3 * – 2 / 8\n2 / 3 – 2/ 8\n2 / 3 / 2 / 8\n```\n\n为了方便解析输入，你可以假设数字和算术运算符之间由空格分隔。\n\
  \n# 10. 姓名与分数 HTML 表格\n\n编写一个类，其构造函数接收一个 `Student` 对象向量，其中每个 `Student` 拥有一个类型为 `string`\
  \ 的名字和一个类型为 `int` 的分数。该类内部存储传递给构造函数的数据。该类应有一个重载的输出运算符，以 HTML 表格的形式输出其数据。设计合适的输入并用它测试你的类。\n\
  \n# 第 12 章更多关于 C 字符串和 `string` 类\n\n## 12.1 字符测试\n\n## 概念\n\nC++ 库提供了几个用于测试字符的函数。要使用这些函数，必须包含\
  \ `<cctype>` 头文件。\n\nC++ 库提供了几个允许你测试字符取值的函数。这些函数测试单个 `char` 参数并返回 `true` 或 `false`。例如，下面的程序段使用\
  \ `isupper` 函数来判断作为参数传递的字符是否为大写字母。如果是，该函数返回 `true`；否则，返回 `false`。\n\n```\nchar letter\
  \ = 'a';\nif (isupper(letter))\n   cout << \"Letter is uppercase.\\n\";\nelse\n\
  \   cout << \"Letter is lowercase.\\n\";\n```\n\n由于在这个例子中变量 `letter` 包含一个小写字符，`isupper`\
  \ 返回 `false`。`if` 语句将导致显示 `\"Letter is lowercase\"`。\n\n表 12-1 列出了几个个字符测试函数。这些函数中的每一个在\
  \ `<cctype>` 头文件中都有原型，因此在使用这些函数时务必包含该文件。\n\n### 表 12-1 `<cctype>` 中的字符测试函数\n\n|\
  \ 字符函数 | 描述 |\n| --- | --- |\n| `isalpha` | 如果参数是字母表中的字母，返回 `true`（非零值）。如果参数不是字母，则返回\
  \ 0。 |\n| `isalnum` | 如果参数是字母或数字，返回 `true`（非零值）。否则，返回 0。 |\n| `isdigit` | 如果参数是\
  \ 0 到 9 的数字，返回 `true`（非零值）。否则，返回 0。 |\n| `islower` | 如果参数是小写字母，返回 `true`（非零值）。否则，返回\
  \ 0。 |\n| `isprint` | 如果参数是可打印字符（包括空格），返回 `true`（非零值）。否则返回 0。 |\n| `ispunct` | 如果参数是除数字、字母或空格以外的可打印字符，返回\
  \ `true`（非零值）。否则返回 0。 |\n| `isupper` | 如果参数是大写字母，返回 `true`（非零值）。否则，返回 0。 |\n| `isspace`\
  \ | 如果参数是空白字符，返回 `true`（非零值）。空白字符是以下任何一种：空格 `''`、垂直制表符 `'\\v'`、换行符 `'\\n'`、制表符 `'\\\
  t'`。否则返回 0。 |\n\n程序 12-1 使用表 12-1 中的几个函数。它要求用户输入一个字符，然后根据每个函数的返回值显示不同的消息。\n\n程序\
  \ 12-2 显示了字符测试函数更实际的应用。它要求用户输入一个字符，然后根据每个函数的返回值显示不同的消息。在这种情况下，`isalpha` 函数测试字符是否为字母。`isdigit`\
  \ 函数测试它是否为数字。`islower` 和 `isupper` 函数分别测试字符是否为小写或大写。`isprint` 和 `ispunct` 函数测试字符是否为可打印字符或标点符号，而\
  \ `isspace` 函数测试字符是否为空白字符。\n\n## 12.2 字符大小写\n\n## 概念\n\nC++ 库提供了将字符转换为大写或小写的函数。这些函数\
  \ `toupper` 和 `tolower` 在表 12-2 中描述（这些函数在 `<cctype>` 中定义，请务必包含它）。\n\n### 表 12-2\
  \ `<ctype>` 中的大小写转换函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `toupper` | 返回其参数的大写等价物。\
  \ |\n| `tolower` | 返回其参数的小写等价物。 |\n\n\n\n\n\n程序 12-3 在输入验证循环中演示了 `toupper` 函数的用法。\n\
  \n在第 28 行和第 29 行中，提示用户输入 Y 或 N 来表示其是否想计算另一个面积。我们不希望程序如此挑剔，至于只接受大写的 Y 或大写的 N。小写的\
  \ y 或小写的 n 也是接受的。输入验证循环必须写为拒绝除 `'Y'`、`'y'`、`'N'` 或 `'n'` 以外的所有内容。实现这一点的方法是在四个关系表达式中测试\
  \ `goAgain` 变量，如下所示：\n\n```\nwhile (goAgain != 'Y' && goAgain != 'y' &&\n      goAgain\
  \ != 'N' && goAgain != 'N')\n```\n\n虽然这段代码没有问题，但我们可以使用 `toupper` 函数获取 `goAgain`\
  \ 的大写等效值并仅进行两次比较。这是第 32 行采用的方法：\n\n```\nwhile (toupper(goAgain) != 'Y' && toupper(goAgain)\
  \ != 'N')\n```\n\n另一种方法是使用 `tolower` 函数获取 `goAgain` 的小写等效值。这里是一个示例：\n\n```\nwhile\
  \ (tolower(goAgain) != 'y' && tolower(goAgain) != 'n')\n```\n\n两种方法将产生相同的结果。\n\n\
  ## 检查点 (Checkpoint)\n\n1. 12.1 为以下每个函数写一个简短描述：\n\n```\nisalpha\nisalnum\nisdigit\n\
  islower\nisprint\nispunct\nisupper\nisspace\ntoupper\ntolower\n```\n\n2. 12.2 编写一条语句将\
  \ `char` 变量 `big` 的内容转换为小写。转换后的值应赋值给变量 `little`。\n\n3. 12.3 编写一个 `if` 语句，如果变量 `ch`\
  \ 包含数字，则显示单词“digit”。否则，显示“Not a digit.”。\n\n4. 12.4 下述语句的输出是什么？\n\n```\ncout <<\
  \ toupper(tolower('A'));\n```\n\n5. 12.5 编写一个循环，询问用户“你想重复运行程序还是退出？(R/Q)”。该循环应一直持续直到用户输入\
  \ R 或 Q（大写或小写均可）。\n\n# 12.3 C 字符串 (C-Strings)\n\n## 概念 (Concept)\n\nC 字符串是存储在连续内存位置的字符序列，并空字符终止。\n\
  \n许多程序大量使用字符串。C++ 提供了两种不同的数据类型来处理字符串：C 字符串和 `string` 类。`string` 类库有许多处理字符串的函数。这些函数执行许多实用的字符串相关功能，并具有\
  \ C 字符串处理函数所缺乏的编程安全保障。由于由于这些原因，你应该优于使用 `string` 类而不是 C 字符串。\n\n尽管如此，每位 C++ 程序员都应该对\
  \ C 字符串有良好的理解。`string` 类是构建在 C 字符串之上的，因此理解 C 字符串有助于你理解 `string` 类。此外，许多程序是在 `string`\
  \ 类库并入 C++ 标准之前编写的。此类程序需要理解 C 字符串的程序员来维护。最后，编写和维护低级代码（如 `string` 类库和操作系统部分）的程序员必须使用\
  \ C 字符串来表示字符串数据。\n\nC 字符串是存储在连续内存位置的字符序列，并空字符终止。回想空字符是 ASCII 代码为 0 的字符。在程序中，空字符通常写为\
  \ ‘\\0’。使用整数 0 或常量 `NULL` 来表示程序中的空字符也是常见的。因此，以下语句都会将空字符存储到字符变量中：\n\n```\nchar ch1,\
  \ ch2, ch3;\nch1 = '\\0';\nch2 = 0;\nch3 = NULL;\n```\n\n由于数组存储相同类型值的连续内存位置序列，因此\
  \ C 字符串实际上是一个空字符终止的字符数组。C 字符串在程序中以三种形式之一出现：\n\n*   “硬编码”字符串字面量\n*   程序员定义的字符数组\n\
  *   指向字符的指针\n\n无论 C 字符串在程序中以这三种形式中的哪种出现，它始终是一个空字符终止的字符数组，并在程序中通过指向数组第一个字符的指针表示。换句话说，C\
  \ 字符串的类型是：\n\n```\nchar *\n```\n\n也就是说，C 字符串的类型是 char 指针。\n\n# 字符串字面量 (String Literals)\n\
  \n字符串字面量也称为字符串常量，直接作为由双引号括的字符序列写入程序中：例如，\n\n```\n\"What is your name?\"\n\"Bailey\"\
  \n```\n\n两者都是字符串字面量。\n\n当编译器遇到如 `\"Bailey\"` 这样的字符串字面量时，它分配一个包含七个字符的数组，将 `\"Bailey\"\
  ` 的六个字符存储在数组的前六个条目中，然后在最后一个条目中存储空字符，如图 12-1 所示。\n\n当编译器遇到如 `\"Bailey\"` 这样的字符串字面量时，它分配一个包含七个字符的数组，将\
  \ `\"Bailey\"` 的六个字符存储在数组的前六个条目中，然后在最后一个条目中存储空字符，如图 12-1 所示。\n\n# 图 12-1 存储在内存中的\
  \ C 字符串\n\n![内存显示了字符 B, i, l, e, y 和正斜杠 0](img/FG_12_001.png)\n\n程序 12-4 说明了编译器将字符串字面量视为类型\
  \ `char *` 的值。关键字 `const` 表示编译器不期望修改字符串字面量的内容。\n\n前两次程序 12-4 显示通过将字符串字面量赋值给类型为 `char\
  \ *` 的变量。指针 `p` 和 `q` 然后持有字符串字面量的地址。通过将指针转换为 `int`，我们可以看到字符串字面量的存储位置。注意在这种情况下，编译器将字符串字面量存储在连续内存位置。\n\
  \n# 程序员定义的字符数组 (Programmer-Defined Arrays of Character)\n\n字符串字面量只能包含硬编码到程序的 C 字符串。要获得从键盘或文件读取字符的\
  \ C 字符串，你必须显式定义一个数组来存放字符。这样做时，你应该确保为数组留出一个额外的条目用于空字符。例如，如果你的 C 字符串最多长为 19 个字符，你需要分配一个\
  \ 20 个字符的数组，如下：\n\n```\nconst int SIZE = 20;\nchar company[SIZE];\n```\n\n与字面量的情况一样，编译器通过字符串第一个字符的地址来表示\
  \ C 字符串，在这种情况下，即数组标识符。回想第 8 章，不带括号的数组标识符被编译器解释为数组第一个条目的地址。\n\n定义为数组的 C 字符串可以通过使用字符串字面量初始化来赋予值、通过从键盘或文件读取字符到位，或通过逐个将字符复制到数组。以下是初始化的一些示例：\n\
  \n```\nconst int SIZE = 20;\nchar company[SIZE] = \"Robotic Systems, inc.\";\nchar\
  \ corporation[] = \"C. K. Graphics\";\n```\n\n以这种方式使用字符串字面量初始化数组时，数组定义中的大小是可选的。如果没有指定，编译器会将大小设置为比初始化字面量字符数多一（从而为空终止符留出空间）。\n\
  \n\n\n\n\n正如第 3 章 所述，定义为数组的 C 字符串可以使用输入输出流类中的各种对象、运算符和成员函数进行读取和写入。存储为程序员定义数组的 C\
  \ 字符串可以使用标准的下标表示法进行处理。程序 12-5 是一个示例。它逐字符地输出字符串，并在找到空终止符时停止。它使用 `getline` 成员函数（在第\
  \ 3 章 中介绍过）来读取要输出的字符串。\n\n# 指向 `char` 的指针\n\n正如我们看到的，C 字符串可以表示为字符串字面量或字符数组。这两种方法都会分配一个数组，然后使用数组地址作为指向\
  \ `char` 的指针来实际表示字符串。两者的区别在于，在第一情况下，用于存储字符串的数组由编译器隐式分配，而在第二情况下，数组是由程序员显式分配的。\n\n\
  表示 C 字符串的第三种方法使用指向 `char` 的指针指向一个已经通过另外两种方法分配了存储的 C 字符串。以下是这样使用 C 字符串的一些示例：\n\n\
  ```cpp\nchar name[] = \"John Q. Public\";\nchar *p;\np = name;                //\
  \ 指向现有的 C–字符串\ncout << p << endl;       // 打印\np = \"Jane Doe\";          // 指向另一个\
  \ C–字符串\ncout << p << endl;       // 打印\n```\n\n使用指针变量表示 C 字符串的一个主要优势是可以让指针指向不同的\
  \ C 字符串。\n\n使用指向 `char` 的指针作为 C 字符串的另一种方法是定义指针，然后将其设置为指向由 `new` 运算符返回的动态分配存储。这在程序\
  \ 12-6 中所示。\n\n使用指向 `char` 的指针作为 C 字符串时的一个常见错误是在指针没有指向正确分配的 C 字符串时使用了该指针。例如，这段代码\n\
  \n```cpp\nchar *pname;\ncout << \"Enter your name: \";\ncin  >> pname;\n```\n\n\
  这段代码是错误的，因为程序尝试将字符串读入 `pname` 所指向的内存位置，而 `pname` 尚未被正确初始化。\n\n# 12.4 用于 C 字符串的库函数\n\
  \n## 概念\n\nC++ 库提供了许多用于处理 C 字符串的函数。C++ 库提供了许多可以用于处理 C 字符串的函数。有确定字符串长度、连接两个字符串、比较两个字符串以及在另一个字符串中搜索一个字符串出现处的函数。你必须包含\
  \ `<cstring>` 头文件来使用这些函数。\n\n## `strlen` 函数\n\n`strlen` 函数接受 C 字符串作为参数并返回字符串的长度。这是直到空终止符之前但不包括空终止符的字符数。例如，在代码段中\n\
  \n\n\n```cpp\nchar str[] = \"Hello\";\nint length = strlen(str);\n```\n\n变量 `length`\
  \ 中将存储数字 5。\n\n字符串的长度不应与持有它的数组的大小混淆。请记住，传递给 `strlen` 的唯一信息是 C 字符串的开头。它不知道数组何时结束，因此它寻找空终止符来指示字符串的结束。\n\
  \n## 传递 C 字符串参数\n\n由于 C 字符串是指向 `char` 的指针，因此 C 字符串处理函数取的参数是 `char` 数组，或者等价于指向 `char`\
  \ 的指针。C 字符串可以以 C 字符串采取的三种形式中的任何一种传递给函数：\n\n* 字符串字面量\n* 存储 C 字符串的数组名\n* 存放 C 字符串地址的指针变量\n\
  \n## `strcat` 函数\n\n另一个 C 字符串处理函数的示例是 `strcat`。`strcat` 函数接受两个字符串作为参数并将它们连接，返回一个由第一个字符串的所有字符后跟第二个字符串的字符所组成的单个字符串。以下是它的用法示例：\n\
  \n```cpp\nconst int SIZE = 13;\nchar string1[SIZE] = \"Hello \";\nchar string2[]\
  \ = \"World!\";\ncout << string1 << endl;\ncout << string2 << endl;\nstrcat(string1,\
  \ string2);\ncout << string1 << endl;\n```\n\n这些语句将产生：\n\n```\nHello\nWorld!\nHello\
  \ World!\n```\n\n`strcat` 函数将 `string2` 的内容复制到 `string1` 的末尾。在这个例中，`string1` 在调用前包含字符串“Hello\
  \ ”。图 12-2 在调用后包含字符串“Hello World!”。注意 `string1` 在空终止符之前的字符是空格。`strcat` 函数不会插入空格，因此程序员有责任确保\
  \ `string1` 足够容纳 `string2` 加上一个空终止符。这里有一个使用 `sizeof` 运算符来测试 `strcat` 的程序：\n\n```cpp\n\
  if (sizeof(string1) >= (strlen(string1) + strlen(string2) + 1))\n    strcat(string1,\
  \ string2);\nelse\n    cout << \"Not too large\";\n```\n\n如果持有第一个字符串的数组不够大，`strcat`\
  \ 将溢出数组。\n\n# `strcpy` 函数\n\n`strcpy` 函数可以用于将一个 C 字符串复制到另一个中。以下是它的用法示例：\n\n```cpp\n\
  const int SIZE = 20;\nchar name[SIZE];\nstrcpy(name, \"Albert Einstein\");\n```\n\
  \n第二个 C 字符串被复制到第一个参数指定的地址。如果第一个参数引用的位置已经存储了任何内容，它将被重写，如下代码段所示：\n\n```cpp\nchar string1[]\
  \ = \"Hello \";\ncout << string1 << endl;\nstrcpy(string1, \"World!\");\ncout <<\
  \ string1;\n```\n\n这里是输出：\n\n```\nHello\nWorld!\n```\n\n**警告！** 根据 C++ 的特性，`strcpy`\
  \ 不进行边界检查。如果第一个参数指定的数组无法容纳第二个参数指定的字符串，则将溢出。\n\n# 比较 C 字符串\n\n赋值和关系运算符适用于 C++ `string`\
  \ 类，因为它们已经针对该类进行了重载。然而，由于赋值运算符不能用于赋值 C 字符串，关系运算符 `<=` `<` `>=` `!=` 和 `==` 也不能用于比较\
  \ C 字符串。由于当与 C 字符串使用时，这些运算符比较的是 C 字符串存储的地址，而不是比较组成 C 字符串的实际字符序列。程序 12-7 显示了尝试使用相等运算符比较\
  \ C 字符串的错误结果。\n\n即使输入了两个相同的字符串，[程序 12-7] 始终会报告它们不相等。这是因为表达式\n\n```cpp\nfirstString\
  \ == secondString\n```\n\n\n\n\n用于 `if` 语句的比较的是两个数组的内存地址，而不是存储在这些地址上的字符字符串。由于这些地址是不同的，比较的结果为\
  \ false。实际上，在 C++ 中，即使是比较\n\n```\n\"abc\" == \"abc\"\n```\n\n通常也会得到 false 的结果。这是因为编译器不会检查字符串字面量之前是否出现过，并将这两个字符串存储在不同的内存地址上。编译器随后将比较这两个不同的地址，导致结果的值为\
  \ false。\n\n# `strcmp` 函数\n\n为了正确地比较 C 字符串，你应该使用库函数 `strcmp`。该函数接受两个 C 字符串作为参数，并返回一个整数，表示两个字符串之间的比较结果。它的原型如下：\n\
  \n```\nint strcmp(char *string1, char *string2);\n```\n\n这表示该函数接受两个 C 字符串作为参数（记住\
  \ `char *` 是 C 字符串的类型），并返回一个整数结果。结果的值根据以下约定设置：\n\n-   如果两个字符串按字符比较是**相等**的，则结果为\
  \ `zero`。\n-   如果 `string1` 在字母顺序上在 `string2` **之前**，则结果为 `negative`。\n-   如果 `string1`\
  \ 在字母顺序上在 `string2` **之后**，则结果为 `positive`。\n\n这里是一个使用 `strcmp` 判断两个字符串是否相等的示例：\n\
  \n```\nif (strcmp(string1, string2) == 0)\n    cout << \"The strings are equal\"\
  ;\nelse\n    cout << \"The strings are not equal\";\n```\n\n程序 12-7 错误地使用关系运算符测试了两个\
  \ C 字符串，可以使用 `strcmp` 函数进行正确重写，如 程序 12-8 所示。\n\n`strcmp` 函数在比较字符串时对大小写敏感。如果用户在 程序\
  \ 12-8 中输入“Dog”和“dog”，它将报告它们不同。某些编译器提供了 `strcmp` 的非标准版本，可以执行不区分大小写的比较。此类函数与 `strcmp`\
  \ 工作原理相同，只是忽略了字符的大小写。\n\n程序 12-9 是关于 `strcmp` 如何使用的更实用的示例。它要求用户输入他们想要购买的计算机零件编号。零件编号包含数字、字母和连字符，因此它必须存储为字符串。一旦用户输入了零件编号，程序就会显示其价格。\n\
  \n# 在 `strcmp` 中使用 `!`\n\n某些程序员在测试字符串相等性时，倾向于与 `strcmp` 配合使用逻辑非运算符 `!`。由于 0 在逻辑上被视为\
  \ `false`，` `!` 运算符会将该值转换为 `true`。表达式 `!strcmp(string1, string2)` 在两个字符串相同时会返回 `true`，在它们不同时返回\
  \ `false`。以下两个语句在执行时的效果完全相同。\n\n```\nif(strcmp(str1, str2) == 0) cout << \"equal\"\
  ;\nif(!strcmp(str1, str2)) cout << \"equal\";\n```\n\n# 字符串排序\n\n由于 `strcmp` 返回关于所比较的两个字符串的相对字母顺序的信息，因此它可以用于对\
