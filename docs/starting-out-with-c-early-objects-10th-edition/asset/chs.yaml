  \n## 概念\n\n当参数通过值传递给参数时，只传递了参数值的拷贝。对参数的修改不会影响原始参数。\n\n正如你在本章中看到的，参数是定义在函数定义括号内的特殊用途变量。它们的作用是存储由参数传递给它们的信息，这些信息列在函数调用的括号内。通常情况下，当信息传递给函数时，它是*按值传递*的。这意味着参数接收了传递给它的值的拷贝。如果函数内部更改了参数的值，它对原始参数没有影响。程序\
  \ 6-9 演示了这一概念。\n\n[程序 6-9]还说明了，如果函数原型列出了变量名以及数据类型，它所使用的名称只是*虚拟名称*。它们并没有被编译器实际使用，不需要与函数头中使用的名称一致。第\
