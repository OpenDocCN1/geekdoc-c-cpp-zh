  \ 语句的功能与左侧所示的两个独立的 `if` 语句完全相同吗？\n\n   ```\n   if (x < y)       if (x < y)\n   \
  \   cout << 1;      cout << 1;\n   if (x > y)       else\n      cout << 2;     \
  \ cout << 2;\n   ```\n\n# 4.4 `if/else if` 语句\n\n## 概念 (Concept)\n\n`if/else if`\
  \ 语句是 `if` 语句链。它们一个接一个地执行测试，直到发现其中一个为真。\n\n我们通过一组不同但相关的规则做出某些心理决策。例如，我们可能会通过参考以下规则决定穿什么样的外套或夹克：\n\
  \n* 如果非常冷，穿厚外套，\n* 否则，如果很冷，穿薄夹克，\n* 否则，如果有风，穿风衣，\n* 否则，如果很热，不穿外套，\n\n这些规则的目的是决定穿什么衣服。如果非常冷，第一条规则规定穿厚外套。如果第一条规则不适用，则考虑第二条规则。如果不适用，则考虑第三条规则，以此类推。\n\
  \n（注：提供的原始文本存在大量重复和混乱，此处已根据逻辑含义进行了清理和翻译。）\n\n\n\n\n结构中的每个 `if` 条件都依赖于其之前的所有 `if`\
  \ 条件均为假。在特定 `else if` 之后的语句会在与该 `else if` 关联的条件表达式为真且所有之前的条件表达式都为假时执行。为了演示这种互连接关系是如何工作的，让我们来看程序\
  \ 4-8，它使用了独立的 `if` 语句，而不是 `if/else if` 语句。\n\n在程序 4-8 中，所有的 `if` 语句都会执行，因为它们是独立的语句。在示例输出中，`testScore`\
  \ 被赋值为 88，但学生却得到了 F。以下是发生的情况：首先，程序运行到第 24 行的 `if` 语句。因为学生的分数没有至少 90，所以第 25 行的赋值语句被跳过。接下来，程序运行到第\
  \ 27 行的 `if` 语句。因为学生的分数至少为 80，所以执行第 28 行的语句，`grade` 被赋值为 `'B'`。然而，由于没有任何 `if` 语句与其上方的语句连接，第\
  \ 30、33 和 36 行的 `if` 语句也都全部执行了。由于 `testScore` 也至少为 70，它导致 `'C'` 被赋值给 `grade`，替换了之前存储在存储处的\
  \ `'B'`。这种情况一直持续，直到所有的 `if` 语句执行完毕。最后一个语句会将 `'F'` 赋值给 `grade`。（学生会对这种方法感到非常不满，因为\
  \ 'F' 是它给出的唯一成绩！）\n\n# 使用尾随 `else`\n\n放置在 `if/else if` 语句末尾最后的 `else` 被称为尾随 `else`（trailing\
  \ else）。尾随 `else` 在所有 `if` 表达式都不为真时提供一个默认操作或一组操作，通常用于捕获错误。这一功能将非常有帮助，例如在程序 4-7 中。在那个程序的当前版本中，如果用户意外输入了一个小于零的测试分数会发生什么？`if/else\
  \ if` 语句处理了从零到以下的所有分数，但不处理更低的分。例如，如果用户输入 −88，程序不会为变量 `grade` 赋值任何值，因为没有处理负分数的代码。我们可以通过向\
  \ `if/else if` 语句添加一个尾随的 `else` 来解决这个问题。这在程序 4-9 中完成。\n\n## 检查点\n\n1. 4.17 下面程序段将显示什么？\n\
