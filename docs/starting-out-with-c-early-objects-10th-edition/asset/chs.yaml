  \ Package()\n          { value = 7; cout << value << endl; }\n       Package(int\
  \ v)\n          { value = v; cout << value << endl; }\n       ~Package()\n     \
  \     { cout << \"goodbye\" << endl; }\n    };\n\n    int main()\n    {  Package\
  \ obj1(4);\n       Package obj2;\n       return 0;\n    }\n    ```\n\n## 7.8 私有成员函数\n\
  \n## 概念\n私有成员函数只能从同一类的成员函数中被调用。\n\n到目前为止，你见过的所有类成员函数都是公共函数。这意味着它们可以被类外的代码调用。然而，类通常需要用于内部处理的函数，这些函数不应该被类外的代码调用。这些函数应该被设为私有。\n\
  \n## 备注\n关于如何在 UML 中表示私有和公共成员的信息，可以在本书的配套网站 [pearsonhighered.com/gaddis](http://pearsonhighered.com/gaddis)上的附录\
  \ F 中找到。\n\n程序 7-8 显示了一个带有私有函数的类示例。`SimpleStat` 类设计用于从一组发送它的非负整数中查找并报告信息，例如平均值和最大数。然而，一旦某个数字被接收并加到运行总量中，它就不会被保留。因此，该类以后无法确定哪个数字是最大的。它必须通过检查读取的每个数字来判断它是否比之前读取的任何数字都大。私有的\
  \ `isNewLargest` 函数就是做此的。\n\n在程序 7-8 中，`isNewLargest` 函数是为实现更模块化的类而编写的。\n\n## 7.9\
  \ 向函数传递对象\n\n## 概念\n类对象可以作为参数传递。你在第 6 章中学会了如何使用变量，类对象也可以作为参数传递。例如，以下函数接收一个 `Rectangle`\
  \ 对象。\n\n```\nvoid displayRectangle(Rectangle r)\n{\n   cout << \"Length = \" <<\
  \ r.getLength() << endl;\n   cout << \"Width  = \" << r.getWidth() << endl;\n  \
  \ cout << \"Area   = \" << r.calcArea() << endl;\n}\n```\n\n下面的代码行创建一个长度为 15 宽度为\
  \ 10 的 `Rectangle` 对象，然后将其传递给 `displayRectangle` 函数。\n\n```\nRectangle box(15, 10);\n\
  displayRectangle(box);\n```\n\n假设 `Rectangle` 类包含了示例中使用的成员函数，`displayRectangle`\
  \ 函数将输出以下\n\n```\n\nLength = 15\nWidth  = 10\nArea   = 150\n```\n\n与普通变量一样，对象也可以按值或按引用传递。在\
  \ `Rectangle` 示例中，`box` 是按值传递给 `displayRectangle` 函数的。这意味着 `displayRectangle` 接收的是\
  \ `box` 的副本。如果 `displayRectangle` 调用任何 `Rectangle` 类修改函数，它们将改变副本而不是原始对象。如果函数需要存储或更改对象的数据，则必须按引用传递对象。\n\
  \n程序 7-9 说明了这一点。它有两个接收 `InventoryItem` 对象的函数。对象按引用传递给 `storeValues`，因为该函数需要调用将新值存储到对象中的类修改函数。对象按值传递给\
  \ `showValues`，因为该函数只需要检索并使用存储在对象数据成员中的值访问函数。注意在程序 7-9 中，`InventoryItem` 类声明出现在\
  \ `storeValues` 和 `showValues` 函数的原型之前。这很重要。因为这两个函数都以 `InventoryItem` 对象作为参数，编译器在遇到任何引用它的内容之前知道\
  \ `InventoryItem` 是什么。否则会发生错误。\n\n\n\n\n在`Program 7-9` `部分`中，`InventoryItem` 对象被按值传递给了\
  \ `showValues` 函数。然而，按值传递对象需要对对象的所有成员进行复制。这可能会减慢程序的执行速度，特别是当对象有许多成员时。按引用传递对象速度更快，因为函数可以直接访问原始对象，因此不需要进行任何复制。正由于这个原因，通常倾向于按引用传递对象。\n\
  \n然而，按引用传递对象也有缺点。由于函数可以访问原始对象，它可以调用它的变异器函数（mutator functions）并更改其成员数据。这就是为什么当我们想要保护变量的内容时，通常不会按引用传递变量。幸运的是，这有一个解决方案。为了在对象作为参数传递时保护该对象，而又无需创建副本，可以将其作为`常量引用`（constant\
  \ reference）传递。这意味着传递的是指向原始对象的引用，但它无法调用任何变异器函数或更改对象的任何成员数据。它只能调用那些已被指定为`常量函数`（constant\
  \ functions）的访问器函数。\n\n要将参数声明为常量引用参数，我们必须在函数原型和函数头部的参数列表中放入关键字 `const`。以下是`Program\
  \ 7-9`中`showValues` 函数的原型和头部如果将它们更改为使用常量引用参数，看起来将是数所示：\n\n```\nvoid showValues (const\
  \ InventoryItem&)        // 函数原型\nvoid showValues (const InventoryItem &item)  \
  \ // 函数头部\n```\n\n现在，`showValues` 函数只能调用在其函数原型和头部中也列出了 `const` 关键字的 `InventoryItem`\
  \ 函数，例如：\n\n```\ndouble getPrice() const \n```\n\n如果 `showValues` 尝试调用任何其他 `InventoryItem`\
  \ 函数，就会发生编译错误。注意，当 `showValues` 被修改为具有常量引用参数时，只有函数原型和头部被更改以包含 `const` 单词。`showValues`\
  \ 函数体以及对 `showValues` 的调用并没有改变。\n\n# 从函数返回对象\n\n就像函数可以写为返回 `int`、`double`或其他数据类型一样，它们也可以设计为返回一个对象。事实上，你之前从函数返回字符串时已经做过这一点，因为字符串是一个对象。当函数返回对象时，它通常会创建一个类的局部实例，设置其数据成员，然后将其返回。这里示例了如何在`Program\
  \ 7-9`中使用的 `InventoryItem` 对象如何在 `storeValues` 函数中被创建并返回给调用函数。注意，这个新版本的 `storeValues`\
  \ 不接受任何参数，且它的返回类型现在是 `InventoryItem` 而不是 `void`。\n\n```\nInventoryItem storeValues()\n\
  {\n   InventoryItem tempItem;    // 创建局部 InventoryItem 对象\n   int partNum;     \
  \          // 用于存储用户输入的局部变量\n   string description;  \n   int qty;          \n \
  \  double price;\n\n   // 获取数据的代码\n\n   // 将数据存储在 InventoryItem 对象中并返回\n   tempItem.storeInfo(partNum,\
  \ description, qty);\n   return tempItem;\n}\n```\n\n`main` 函数可以像这样创建 `part`，用 `storeValues`\
  \ 函数返回的 `InventoryItem` 对象对其进行初始化：\n\n```\nInventoryItem part = storeValues(); \n\
  ```\n\n`Program 7-10` 根据我们刚刚讨论的技术修订了 `Program 7-9`。名为 `storeValues` 的函数被重命名为 `createItem`，因为它现在创建一个\
  \ `InventoryItem` 对象并将其返回给 `main`。`showValues` 函数现在按常量引用接收 `part`。\n\n## Checkpoint\n\
  \n1. 7.15 私有类成员函数可以被\n    1. 任何函数调用\n    2. 同类的公共函数调用\n    3. 同类的私有函数调用\n    4.\
  \ 同类的任何函数调用\n2. 7.16 当将对象传递给函数时，创建它的副本是因为\n    1. 按值传递\n    2. 按引用传递\n    3. 按常量传递\n\
  \    4. 以上都不是\n3. 7.17 如果函数接收到一个对象并需要更改它，最好是将其传递\n    1. 按值传递\n    2. 按引用传递\n  \
