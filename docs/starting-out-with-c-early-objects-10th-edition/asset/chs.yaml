  \ C++ 字符串类。请说明你支持还是反对该建议，并解释原因。\n\n## 编程挑战\n\n# 1. 单词计数器\n\n编写一个函数，接受一个 C 字符串作为参数并返回其中包含的单词数。例如，如果字符串参数是“Four\
  \ score and seven years ago”，函数应返回 6。在一个程序中演示该函数，要求用户输入一个字符串，然后将其传递给函数。在屏幕上显示字符串中的单词数。\n\
  \n# 2. 字母平均数\n\n修改你为问题 1 编写的程序（`单词计数器`），使其也能显示每个单词的平均字母数。\n\n# 3. 句子首字母大写\n\n编写一个函数，接受一个\
  \ C 字符串作为参数，并将字符串中每个句子的第一个字母大写。例如，如果字符串参数是“`hello. my name is Joe. what is your\
  \ name?`”，函数应处理该字符串，使其包含“`Hello. My name is Joe. What is your name?`”。在一个程序中演示该函数，要求用户输入一个字符串，然后将其传递给函数。在屏幕上显示修改后的字符串。\n\
  \n# 4. 元音和辅音\n\n编写一个函数，接受一个 C 字符串作为参数。该函数应统计字符串中出现的元音数量并返回该数字。\n\n编写另一个接受 C 字符串作为参数的函数。该函数应统计字符串中出现的辅音数量并返回该数字。\n\
  \n在一个程序中演示这两个函数，执行以下步骤：\n\n1. 要求用户输入字符串。\n2. 程序显示以下菜单：\n    1. 统计字符串中元音的数量\n   \
  \ 2. 统计字符串中辅音的数量\n    3. 同时统计字符串中的元音和辅音\n    4. 输入另一个字符串\n    5. 退出程序\n3. 程序执行用户选择并重复，直到用户选择\
  \ `E` 退出程序。\n\n# 5. 姓名排列器\n\n编写一个程序，要求用户输入名、中间名和姓。这些名字应存储在三个不同的字符数组中。然后程序在第四个数组中按以下方式存储姓名：姓后面跟着一个逗号和空格，然后是名以及一个空格，最后是中间名。例如，如果用户输入“`Carol\
  \ Lynn Smith`”，它应该在第四个数组中存储“`Smith, Carol Lynn`”。在屏幕上显示第四个数组的内容。\n\n# 6. 字符串中数字之和\n\
  \n编写一个程序，要求用户输入一系列没有分隔符的单位数字。将输入读取为 C 字符串或 `string` 对象。程序应显示字符串中所有单位数字的和。例如，如果用户输入\
  \ 2514，程序应显示 12，即 2、5、1 和 4 之和。程序还应显示字符串中最大和最小的数字。\n\n# 7. 最频繁出现的字符\n\n编写一个函数，接受\
  \ C 字符串指针或 `string` 对象作为其参数。该函数应返回字符串中出现频率最高的字符。在一个完整的程序中演示该函数。\n\n# 8. `replaceSubstring`\
  \ 函数\n\n编写一个名为 `replaceSubstring` 的函数。该函数接受三个 C 字符串或 `string` 对象参数。我们称它们为 `string1`、`string2`\
  \ 和 `string3`。它应该在 `string1` 中搜索所有 `string2` 出现的位置。当它找到 `string2` 的出现处时，将其替换为 `string3`。例如，假设三个参数如下：\n\
  \n```\nstring1: \"the dog jumped over\"\nstring2: \"the\"\nstring3: \"that\"\n```\n\
  \n使用这些参数，函数将返回一个包含“that dog jumped over”的 `string` 对象。在一个完整的程序中演示该函数。\n\n# 9. 大小写转换\n\
  \n编写一个带有三个函数的程序：`upper`、`lower` 和 `flip`。`upper` 函数接受一个 C 字符串作为参数，它遍历字符并将其转换为大写。`lower`\
  \ 函数同样接受一个 C 字符串作为参数，它遍历字符并将其转换为小写。`flip` 函数也接受一个 C 字符串作为参数，它遍历字符并切换大小写。在 `main`\
