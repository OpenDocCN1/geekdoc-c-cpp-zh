  \ const { return description; }\n    double getPrice() const { return price; }\n\
  };\n```\n\n假设我们设置了一个 `Inventory` 对象数组。我们可能想要搜索一个 `itemCode` 为 K 的对象，这样我们就可以调用 `getPrice`\
