  \ 对象数组。回顾第 7 章，当对象作为常量引用时，接收函数调用的任何对象的成员函数必须定义为 `const`。当对象数组传递给函数时也是如此。\n\n```cpp\n\
  int search(const Inventory array[], int size, string key) {\n    for (int i = 0;\
  \ i < size; i++) {\n        if (array[i].getItemCode() == key) {\n            return\
  \ i;\n        }\n    }\n    return -1;\n}\n```\n\n## 检查点\n\n1. 描述线性查找和二分查找的区别。\n\
  \n2. 升序排序和降序排序有什么区别？\n\n3. 如果在数组上进行二分查找，数组的内容应该如何排序？\n\n4. 对于一个拥有 1,000 个元素的数组，线性查找平均会执行多少次比较？（假设搜索的项目始终能在数组中找到。）\n\
  \n5. 对于一个拥有 1,000 个元素的数组，二分查找最多执行多少次比较？\n\n6. 如果在数组上进行线性查找，并且已知某些项目的搜索频率比其他项目高，如何重新排列数组的内容以提高搜索的平均性能？\n\
  \n## 9.3 排序算法简介\n\n## 概念\n\n排序算法用于将数据按某种顺序排列。\n\n\n\n\n许多编程任务需要它们所处理的数据按照某种顺序进行排序。例如，客户列表通常按字母顺序排序。学生成绩可能从高到低排序。邮件标签记录可以按邮政编码排序。要对数组中的数据进行排序，程序员必须使用适当的排序算法。`排序算法`是一种遍历数组并按照特定顺序排列其内容的技术。\n\
  \n本节介绍了两种简单的排序算法：`泡泡排序`和`选择排序`。像许多排序算法一样，它们会对数据进行多次通过，检查每个仍待排序的每部分数据，并在每次通过中将一个值放置在它正确的位置。\n\
  \n# 泡泡排序\n\n泡泡排序是按升序或降序排列数据的简单方法。它之所以被称为`泡泡排序`算法，是因为当它以升序对数据数组排序时，每次排序都会导致较大的值“沉”到数组底部，而较小的值“浮”到顶部，就像向池塘里扔了一块石头一样。石头掉到底部，气泡则向表面浮起。当然，通过微小的修改，该算法也可以将数据按降序排序。在这种情况下，每次排序都会导致较小的值沉到底部，而较大的值浮到顶部。在本节中，你将看到如何使用泡泡排序算法按升序对数组进行排序。\n\
  \n假设我们有图 9-1 所示的数组。让我们看看如何使用泡泡排序将数组元素按升序排列。\n\n## 图 9-1 未排序的数组\n\n![一个图表显示了一个数组，其下标从“元素\
  \ 0”到“元素 5”。数组中的值为 7, 2, 3, 8, 9 和 1。](img/FG_09_001.png)\n\n泡泡排序从比较数组中的前两个元素开始。如果元素\
  \ 0 的值大于元素 1 的值，则交换它们。数组将将所示图 9-2 所示。\n\n## 图 9-2 第一次交换后的数组\n\n![一个图表显示了一个数组。数组中的值为\
  \ 2, 7, 3, 8, 9 和 1。前两个矩形旁边的注释为“这些元素被交换了”。](img/FG_09_002.png)\n\n此步骤在元素 1 和 2 上重复。如果元素\
  \ 1 的值大于元素 2 的值，则交换它们。数组将将所示图 9-3 所示。\n\n## 图 9-3 第二次交换后的数组\n\n![一个图表显示了一个数组。数组中的值为\
  \ 2, 3, 7, 8, 9 和 1。第二个和第三个矩形旁边的注释为“这些元素被交换了”。](img/FG_09_003.png)\n\n接下来，比较元素 2\
  \ 和 3。这些元素已经处于正确的顺序，所以没有值被交换。随着循环继续，比较元素 3 和 4。再次，没有必要交换值，因为它们已经处于正确的顺序。\n\n然而，当比较元素\
  \ 4 和 5 时，发现它们的值顺序不对（9 大于 1），因此它们必须交换。数组现在将所示图 9-4 所示。\n\n## 图 9-4 第一次通过后的数组\n\n\
  ![一个图表显示了一个数组。数组中的值为 2, 3, 7, 8, 1 和 9。最后两个矩形旁边的注释为“这些元素被交换了”。最后一个矩形有阴影。](img/FG_09_004.png)\n\
  \n在此时，排序的第一次通过完成。这意味着整个数组已扫描了一次。泡泡排序已将最大值 9 放置在数组末尾的正确位置。然而，还有其他元素不在它们的最终位置。因此，算法将再次通过数组，再次将每个元素与其邻居进行比较。但这次通过将停止在到达倒数第二个元素，因为最后一个元素已经包含了正确的值。第二次通过从比较元素\
  \ 0 和 1 开始。因为它们的值处于正确的顺序，所以它们没有被交换。接下来比较元素 1 和 2。由于它们的值处于正确的顺序，它们没有被交换。当比较元素 4 和\
  \ 5 时，发现它们的值顺序不对（9 大于 1），因此它们必须交换。数组现在将所示图 9-5 所示。\n\n## 图 9-5 第二次通过后的数组\n\n![一个图表显示了一个数组。数组中的值为\
