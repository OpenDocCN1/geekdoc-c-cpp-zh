  \n*输入验证：不要接受负数。*\n\n## 2. 测试分数 #2\n\n修改编程挑战 1 中的程序，允许用户输入名称-分数对。对于每个参加测试的学生，用户输入代表学生名的字符串，后面跟着代表分数的整数。修改排序和计算平均函数，使其接收结构数组，每个结构包含一个学生的名字和分数。在遍历数组时，使用指针而不是数组索引。\n\
