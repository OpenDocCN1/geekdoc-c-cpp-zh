  \n## 3. 加密/解密密钥\n\n编写一个程序，创建一个加密/解密密钥并将其存储在文本文件中。要加密/解密的消息将仅使用小写字母、空格字符和换行符。加密密钥（同时也作为解密密钥）将是一对字符序列，'a'到'z'、空格字符和换行符。第一个序列将按某种顺序列出所有字符，第二个序列是第一个序列的随机排列。程序应将原始序列和打乱后的序列都存储在名为\
  \ `keyfile.txt` 的文件中并关闭文件。然后程序应打开文件进行读取并将将其内容回显到屏幕上。这里是程序可能的输出。\n\n```\nabcdefghijklmnopqrstuvwxyz\n\
  \nebatq\njy spcxdhrkfiwuzlvngmo\n```\n\n在这种情况下，`'a'` 映射到 `'e'`，`'b'` 映射到自身，`'c'`\
  \ 映射到 `'a'`，`'e'` 映射到 `'q'`，`'f'` 映射到换行符，`'g'` 映射到 `'j'`，`'i'` 映射到空格，`'z'` 映射到 `'g'`，空格映射到\
  \ `'m'`，换行符映射到字符 `'o'`。\n\n## 4. 文件加密\n\n编写一个加密程序，读取两个文本文件：上一个问题创建的 `keyfile.txt`\
  \ 和另一个包含待加密消息的 `plain.txt` 文件（使用 `keyfile.txt` 中的密钥进行加密）。消息将仅由小写字母、空格和换行符组成。通过将原始序列中的每个字符替换为打乱序列中相同位置的字符来加密消息。输出应显示在屏幕上同时写入文件\
  \ `cipher.txt`。\n\n## 5. 文件解密\n\n编写一个解密程序，读取前两个问题创建的两个文件 `keyfile.txt` 和 `cipher.txt`。`cipher.txt`\
  \ 文件包含一个要使用 `keyfile.txt` 中的密钥进行解密的消息。通过将打乱序列中的每个字符替换为原始序列中相同位置的字符来解密。\n\n## 6.\
  \ 单词频率\n\n编写一个程序读取文本文件的内容。该程序创建一个 `map`，其键为找到的单词，值为这些单词出现的次数。例如，如果单词 `the` 出现了 128\
  \ 次，map 将包含 `the` 作为键，128 作为值。\n\n## 7. 单词索引\n\n编写一个程序读取文本文件的内容。该程序创建一个 `map`，其键值对如下：\n\
  \n*   键——找到的单词\n*   值——包含单词出现行号的 `set`\n\n例如，假设单词 `robot` 出现在第 7、18、94 和 138 行。map\
  \ 将包含 `robot` 作为键，以及一个包含 7,18、94 和 138 的 `set`。一旦构建了 map，程序应创建另一个文本文件（单词索引），以索引的形式列出单词及其在原始文件中出现的行号。\n\
  \n## 8. 质数生成\n\n如果大于 1 的整数除了 1 和它本身外没有其他因子，则被称为*质数*。如果不是质数，则称为合数。编写一个程序要求用户输入一个大于\
  \ 1 的整数，然后显示小于或等于该数的所有质数。该程序的工作方式如下：\n\n*   一旦用户输入数字，程序应在 `vector` 中填充从 2 到该值的所有整数。\n\
  *   然后程序应使用 STL 的 `for_each` 函数遍历 `vector`。`for_each` 函数应将每个元素传递给函数对象，如果该元素是质数则显示它。\n\
  \n## 9. 油价\n\n在本章的学生程序文件中，你会发现一个名为 `GasPrices.txt` 的文本文件。该文件包含美国每周的汽油平均价，从 1993\
  \ 年 4 月 5 日到 2013 年 8 月 26 日。\n\n文件中的每行包含特定日期的汽油平均价。每行的格式如下：\n\n```\nMM-DD-YYYY:Price\n\
  ```\n\n`MM` 是两位数月份``DD` 是两位日期，`YYYY` 是四位年份。`Price` 是指定日期的汽油平均价。\n\n\n\n\n\n对于本次作业，你需要编写一个或多个程序来读取文件内容并执行以下计算：\n\
  \n*   每年平均价格：计算文件中每年的汽油平均价格。（文件数据始于 1993 年 4 月，结束于 2013 年 8 月。请使用 1993 年和 2013 年这两个年份存在的数据。）\n\
  *   每月平均价格：计算文件中每个月的平均价格。\n*   每年最高和最低价格：对于文件中的每一年，确定最低价和最高价的日期和金额。\n*   价格列表（从低到高）：生成一个文本文件，按价格从低到高排序并列出日期和价格。\n\
  *   价格列表（从高到低）：生成一个文本文件，按价格从高到低排序并列出日期和价格。\n*   你可以编写一个程序执行所有这些计算，也可以编写不同的程序，每个计算写一个程序。无论你采取哪种方法，都应该读取\
  \ `GasPrices.txt` 文件的内容，并将其数据提取到一个或多个适用于你算法的 STL 容器中。\n\n# 10. 二维数据\n\n假设存储表示人员列表及其想要访问的地方列表的文件格式如下：\n\
  \n*   3\n*   0 Paul\n*   1 Peter\n*   2 David\n*   0 3 Chicago Boston Memphis\n\
  *   1 1 Boston\n*   2 0\n\n文件的第一个数字 `n` 表示列表中有多少人。这里 `n` 是 3，所以有三个人。列表中的每个人都被分配了一个\
  \ `0..n-1` 范围内的数字，用于标识该人员。对于每个人，文件列出该人的数字标识符，随后是其想要访问的地方数量，最后是这些地方名称。例如，Boston 是\
  \ Peter 想要访问的地方，而 David 则不想访问任何地方。\n\n编写一个程序从文件中读取此类数据并将其存储在合适的 STL 数据结构中。例如，你可以使用\
  \ `vector` 以及嵌套 `vector`（vector of vectors）来表示这些信息。该程序允许用户输入姓名并打印其喜好的目的地列表。如果该人不在数据库中，程序将打印错误信息。\n\
  \n# 11. 单词转换器修改\n\n修改程序 17-38，使其在两次排序期间保留中间单词列表，而不是保留交换索引列表。\n\n# 12. 杨格华三角形\n\n\
  杨格华三角形的前七行如下：\n\n*   1\n*   1 1\n*   1 2 1\n*   1 3 3 1\n*   1 4 6 4 1\n*   1 5\
  \ 10 10 5 1\n*   1 6 15 20 15 6 1\n\n所示的第一行索引为 0，最后一行索引为 6。三角形的第 0 行由单个数字 1 组成。对于任何正整数\
  \ `k`，索引为 `k` 的行有 `k+1` 个数字，且首都是 1。除了第一个和最后一个以外的每个位置 `p`，第 `k` 行 `p` 处的元素是第 `k-1`\
  \ 行位置 `p` 和 `p-1` 处的两个元素之和。\n\n编写一个函数\n\n```cpp\nvector<int> pascalTriangleNextRow(vector<int>\
  \ row)\n```\n\n该函数接收一个 vector 形式的杨格华三角形行，并返回三角形的下一行。通过编写一个 main 函数来测试你的函数，要求用户输入一个整数\
  \ `N`，并通过重复调用上述函数打印杨格华三角形的前 `N` 行。\n\n# 第 18 章 链表\n\n## 18.1 链表简介\n\n## 概念\n\n动态分配的数据结构可以在内存中链接在一起形成一条链。\n\
  \n链表是一系列连接的节点，每个节点都是一个数据结构。链表的节点通常是动态分配、使用然后删除的，这使得链表的大小可以随着程序的运行而增长或缩小。如果需要向链表中添加新信息，程序只需分配另一个节点并将其插入序列中。如果需要从链表中移除某条特定信息，程序将删除包含该信息的节点。\n\
  \n## 链表相对于数组和 vector 的优势\n\n尽管链表的代码编写和管理上比数组和 vector 复杂，但它们有一些独特的优势。首先，链表的大小可以很容易增长或缩小。事实上，程序员不需要知道列表中会有多少节点。它们只是在需要时在内存中创建的。\n\
  \n人们可能会认为链表并不优于 vector（标准模板库中的容器），因为 vector 也可以扩展或缩小。然而，链表相对于 vector 的优势在于节点插入列表或从列表中删除的速度。在\
  \ vector 的中间位置插入一个值需要将插入点之后的所有元素向 vector 的末尾移动一个位置，从而为新值腾出空间。同样，从 vector 中移除一个值需要将移除点之后的所有元素向\
  \ vector 的开头移动一个位置。当节点插入到链表或从链表中删除时，其他节点都不需要移动。\n\n## 链表的结构\n\n链表中的每个节点都包含一个或多个存储数据的成员。（例如，存储在节点中的数据可以是库存记录；也可以是包含姓名、地址和电话号码的客户信息记录。）除了数据外，每个节点还包含一个指向列表中下一个节点的后继指针。单个节点的组成如图\
  \ 18-1 所示。\n\n# 图 18-1 节点\n\n![一个节点的插图显示一个矩形被分成两个不相等的部分。较大的部分显示“数据成员”。较小的部分被填充，一个标记为“指针”的箭头从该部分内部指向矩形外部。\n\
  \n非空链表的第一个节点被称为链头（head）。要访问链表中的节点，你需要一个指向链头的指针。从链头开始，你可以通过存储在每个节点中的后继指针来访问列表中的其余节点。最后一个节点的后继指针被设置为\
  \ `nullptr`，以指示列表的结束。\n\n由于指向链头的指针用于定位链头，我们可以认为它代表链头。同一个指针也可以通过从链头开始并跟随后继指针来定位整个链表，因此也自然地认为它代表整个链表。图\
  \ 18-2 描述了一个包含三个节点的链表，显示了指向链头的指针、链表的三个节点以及表示列表结束的 `nullptr` 值。\n\n# 图 18-2 由指针链接的节点\n\
  \n图 18-2 将链表中的节点描绘得彼此靠近，整齐地排列成一行。实际上，节点可能散布在内存的不同区域。\n\n\n\n\n在 C++ 中表示链表，我们需要一个表示链表中单个节点的数据类型。查看图\
  \ 18-1，我们可以看到，自然的方法是将该数据类型定义为一个结构体，其中包含要存储的数据，以及一个指向相同类型另一个节点的指针。假设每个节点将存储一个 `double`\
  \ 类型的单个数据项，我们可以声明以下类型来持有节点：\n\n```\n struct ListNode\n{\n   double value;\n   ListNode\
  \ *next;\n};\n```\n\n在这里，`ListNode` 是存储在列表中的节点类型，结构成员 `value` 是节点的数据部分，而声明为指向 `ListNode`\
  \ 指针的结构成员 `next` 是指向下一个节点的后继指针。\n\n`ListNode` 结构体有一个有趣的属性：它包含一个指向相同类型数据结构的指针，因此可以说它是一个包含自身引用的类型。这类类型被称为*自引用数据类型*或*自引用数据结构*。\
  \ \n\n在声明了表示节点的数据类型后，我们可以通过定义一个用作列表头的指针并将其初始化为 `nullptr` 来定义一个初始为空的链表：\n\n```\n\
  \ ListNode *head = nullptr;\n```\n\n现在我们可以创建一个由存储 12.5 的单个节点组成的链表，如下：\n\n```\n head\
  \ = new ListNode;      // 分配新节点\nhead−>value = 12.5;       // 存储值\nhead−>next =\
  \ nullptr;     // 表明列表结束\n```\n\n现在让我们看看如何创建一个新节点，在其中存储 13.5，并使其成为列表中的第二个节点。我们可以使用第二个指针指向一个新分配的节点，13.5\
  \ 将存储在其中：\n\n```\n ListNode *secondPtr = new ListNode;\nsecondPtr−>value = 13.5;\n\
  secondPtr−>next = nullptr;   // 第二个节点是列表末尾\nhead−>next = secondPtr;      // 第一个节点指向第二个\n\
  ```\n\n注意，我们现在通过将其后继指针 `secondPtr−>next` 设置为 `nullptr` 使得第二个节点成为列表的末尾，并更改了列表头的后继指针以指向第二个节点。程序\
  \ 18-1 展示了简单链表的创建。\n\n# 使用构造函数初始化节点\n\n回想一下，C++ 结构体可以有构造函数。为定义列表节点类型的结构体提供一个或多个构造函数通常非常方便，允许节点在创建时立即进行初始化。同样回想，就像普通函数一样，构造函数也可以带有默认参数定义。为节点的后继指针提供\
  \ `nullptr` 作为默认参数是非常常见的。这里是 `ListNode` 结构的另一种定义：\n\n```\n struct ListNode\n{\n\
  \   double value;\n   ListNode *next;\n   // 构造函数\n   ListNode(double value1, ListNode\
  \ *next1 = nullptr)\n   {\n      value = value1;\n      next = next1;\n   }\n};\n\
  ```\n\n通过这种声明，可以用两种不同的方式创建节点：\n\n1. 仅指定其 `value` 部分并让后继指针默认为 `nullptr`，或者\n2. 同时指定\
  \ `value` 部分和指向列表中紧跟在该节点之后的节点指针\n\n当我们正在创建一个要放置在链表末尾的节点时，第一种方法非常有用；而当新创建的节点要插入到列表中的某个将拥有后继节点的位置时，第二种方法非常有用。\n\
  \n使用这种节点的新声明，我们可以用更短的代码创建之前的 `12.5` 紧跟 `13.5` 的列表：\n\n```\n ListNode *secondPtr\
  \ = new ListNode(13.5);\nListNode *head = new ListNode(12.5, secondPtr);\n```\n\n\
  我们实际上可以省去第二个指针，并将上述代码写为：\n\n```\n ListNode *head = new ListNode(13.5);\nhead = new\
  \ ListNode(12.5, head);\n```\n\n这段代码与之前的代码等效，因为赋值语句\n\n```\n head = new ListNode(12.5,\
  \ head);\n```\n\n是从右到左求值的：首先在构造函数中使用 `head` 的旧值，然后将 `new` 运算符返回的地址赋值给 `head`，成为它的新值。\n\
  \n# 构建列表\n\n使用 `ListNode` 的构造函数版本，可以很容易通过从文件中读取值并将每个新读取的值添加到已累积值的列表开头来创建一个列表。例如，使用\
  \ `numberList` 作为列表头，使用 `numberFile` 作为输入文件对象，以下代码将读取文本文件中存储的数字并将它们排列成列表：\n\n```\n\
  \ ListNode *numberList = nullptr;\ndouble number;\nwhile (numberFile >> number)\n\
  {\n   // 创建一个节点持有这个数字\n   numberList = new ListNode(number, numberList);\n}\n```\n\
  \n# 遍历列表\n\n从列表头开始遍历整个列表，并在每个节点处进行某些处理的过程被称为*遍历*列表。例如，如果我们需要打印列表中每个节点的内容，我们就必须遍历列表。要遍历一个列表，假设一个列表头指针为\
  \ `numberList` 的列表，我们取另一个指针 `ptr` 并将其指向列表的开头：\n\n```\n ListNode *ptr = numberList;\n\
  ```\n\n然后我们可以通过操作表达式 `*ptr` 或使用结构体指针运算符 `−>` 来处理 `ptr` 指向的节点。例如，如果我们需要打印节点的值，可以写下代码\n\
  \n```\n cout << ptr−>value;\n```\n\n一旦完成节点处的处理，如果存在下一个节点，我们通过写入移动指针到下一个节点：\n\n```\n\
  \ ptr = ptr−>next;\n```\n\n从而将指向节点的指针替换为指向该节点后继节点的指针。程序 18-2 展示了这些技术，通过读取一个数字文件，将其排列成链表，然后遍历列表打印数字。\n\
  \n## 检查点\n\n1. 18.1 描述节点的两个部分。\n2. 18.2 什么是列表头？\n3. 18.3 什么标志着列表结束？\n4. 18.4 什么是自引用数据结构？\n\
  \n# 18.2 链表操作\n\n## 概念\n\n链表的基本操作包括向列表添加元素、从列表中删除元素、遍历列表以及销毁列表。\n\n在本节中，我们开发了一些列表类。这些类中的第一个我们称为\
  \ `NumberList`，将存储 `double` 类型。它基于前节定义的 `ListNode` 结构，并在此处显示。\n\n# `NumberList.h`\
  \ 的内容\n\n```\n 1 #include <iostream>\n 2 using namespace std;\n 3 class NumberList\n\
  \ 4 {\n 5 protected:\n 6      // 为节点声明一个类\n 7      struct ListNode\n 8      {\n\
  \ 9         double value;\n10         ListNode *next;\n11         ListNode(double\
  \ value1, ListNode *next1 = nullptr)\n12         {\n13            value = value1;\n\
  14            next = next1;\n15         }     \n16      };\n 17      ListNode *head;\
  \                       // 列表头指针\n 18 public:\n19      NumberList() { head = nullptr;\
  \  }     // 构造函数\n20      ~NumberList();                        // 析构函数\n21    \
  \  void add(double number);\n22      void remove(double number);\n23      void displayList()\
  \ const;\n24 };\n```\n\n由于 `ListNode` 不需要 `NumberList` 外部的任何代码访问，因此将其声明在 `NumberList`\
  \ 类内部。我们还将 `ListNode` 声明在保护区域中，以便以后派生自 `NumberList` 的类可以访问。\n\n\n\n\n注意，构造函数将 `head`\
  \ 指针初始化为 `nullptr`，这表示列表初始时为空。该类有一个 `add` 函数，它可以接收一个值并将其添加到列表末尾；还有一个 `displayList`\
  \ 函数，用于在屏幕上打印列表中存储的所有值。析构函数通过删除所有节点来销毁列表。除了 `remove()` 之外，所有这些函数都定义在 `NumberList.cpp`\
  \ 中。`remove()` 函数将在稍后添加。\n\n# `NumberList.cpp` 的内容\n\n```\n 1 #include \"NumberList.h\"\
  \n 2 using namespace std;\n 3\n4 //*****************************************************\n\
  \ 5 // add adds a new element to the end of the list.     *\n 6 //*****************************************************\n\
  \ 7 void NumberList::add(double number)\n 8 {\n 9     if (head == nullptr)\n10 \
  \       head = new ListNode(number);\n11     else\n12       {\n13         // The\
  \ list is not empty\n14         // Use nodePtr to traverse the list\n15        \
  \ ListNode *nodePtr = head;\n16         while (nodePtr−>next != nullptr)\n17   \
  \         nodePtr = nodePtr−>next;\n18\n19         // nodePtr−>next is nullptr so\
  \ nodePtr points to last node\n20         // Create a new node and put it after\
  \ the last node\n21         nodePtr−>next = new ListNode(number);\n22       }\n\
  23 }\n24\n25 //***************************************************\n26 // displayList\
  \ outputs a sequence of all values     *\n27 // currently stored in the list.  \
  \                  *\n28 //***************************************************\n\
  29 void NumberList::displayList() const\n30 {\n31     ListNode *nodePtr = head;\
  \   // Start at head of list\n32     while (nodePtr)\n33     {\n34        // Print\
  \ the value in the current node\n35        cout << nodePtr−>value << \"    \";\n\
  36        // Move on to the next node\n37        nodePtr = nodePtr−>next;\n38  \
  \   }\n39 }\n40\n41 //******************************************************\n42\
  \ // Destructor deallocates the memory used by the list. *\n43 //******************************************************\n\
  44 NumberList::~NumberList()\n45 {\n46    ListNode *nodePtr = head;  // Start at\
  \ head of list\n47    while (nodePtr != nullptr)\n48    {\n49        // garbage\
  \ keeps track of node to be deleted\n50        ListNode *garbage = nodePtr;\n51\
  \        // Move on to the next node, if any\n52        nodePtr = nodePtr−>next;\n\
  53        // Delete the \"garbage\" node\n54        delete garbage;\n55    }\n56\
  \ }\n```\n\n由于 `NumberList` 类包含指向动态分配内存的指针，因此在需要创建列表副本的情况下安全使用它之前，需要配备拷贝构造函数和重载的赋值运算符。\n\
  \n# 向列表中添加元素\n\n`add` 成员函数接受一个 `double` 类型的数字作为参数，创建一个包含该数字的节点，并将其添加到列表末尾。基本思想如下：如果一方面，列表为空的，那么新创建的节点将成为列表中的唯一节点：\n\
  \n```\n head = new ListNode(number);\n```\n\n如果另一方面，列表不为空，我们获取一个指针 `nodePtr`，将其设置为列表的开头，并沿着列表向下移动，直到它指向最后一个节点。当\
  \ `nodePtr−>next` 等于 `nullptr` 时，我们就知道它指向最后一个节点。将指针从列表开始并向下移动到末尾的代码如下：\n\n```\n\
  \ ListNode *nodePtr = head;\nwhile (nodePtr−>next != nullptr)\n       nodePtr =\
  \ nodePtr−>next;\n```\n\n一旦 `nodePtr` 指向最后一个节点，我们就可以使用代码在它之后添加新节点：\n\n```\n nodePtr−>next\
  \ = new ListNode(number);\n```\n\n将所有内容整合在一起，我们得到了 `NumberList.cpp` 第 7–23 行所示的\
  \ `add` 函数。\n\n# 显示列表\n\n第 29–39 行的 `displayList` 成员函数代码是基于上一节介绍的遍历列表的算法。\n\n# 销毁列表\n\
  \n类的析构函数释放列表使用的所有内存是非常关重要的。它通过遍历列表、一次删除一个节点来实现这一点。该代码位于 `NumberList.cpp` 文件的第 44–56\
  \ 行。指针 `nodePtr` 从列表的开头（头部）开始，逐个节点遍历列表。第二个指针 `garbage` 紧跟在 `nodePtr` 后面，并在 `nodePtr`\
  \ 移动到后继节点后立即删除每个节点。\n\n[程序 18-3] 展示了 `NumberList` 类成员函数的操作。[程序 18-3] 逐步演示了 `add`\
  \ 函数如何构建链表以存储所使用的三个参数。`head` 指针（是 `NumberList` 类的成员变量）在列表创建时会自动初始化为 `nullptr`。这表示列表为空。第一次调用\
  \ `add` 时传递 `2.5` 作为参数。由于此时列表为空，执行 `NumberList.cpp` 第 10 行的代码：\n\n```\n head = new\
  \ ListNode(number);\n```\n产生如图 18-3 所示的情况。\n\n# 图 18-3 向空列表添加 2.5\n\n插图显示了一个阴色的头部和一个节点。节点的“数据”部分显示为\
  \ 2.5。头部指针指向 2.5。节点的阴影部分标记为“nullptr”。没有更多语句执行，因此返回到 `main`。在第二次调用 `add` 时，传递 `7.9`\
  \ 作为参数。`if` 语句的 `else` 分支将被执行，将 `nodePtr` 指向列表的第一个节点，如图 18-4 所示。\n\n# 图 18-4 向列表添加\
  \ 7.9\n\n插图显示了一个阴色的头部、一个阴色的“nodeptr”和一个节点。此时，指针 `nodePtr−>next` 的值为 `nullptr`，`while`\
  \ 循环终止。随后执行循环后的语句\n\n```\n nodePtr−>next = new ListNode(number);\n```\n产生如图 18-5\
