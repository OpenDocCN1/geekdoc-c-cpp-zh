  \ 完成下列程序框架中的 `if` 语句。\n\n    ```cpp\n    #include <iostream>\n       using namespace\
  \ std;\n\n       int main()\n       {\n          const int LENGTH = 20;\n      \
  \    char iceCream[LENGTH];\n          cout << \"你最喜欢什么口味的冰淇淋？ \";\n          cout\
  \ << \"巧克力、香草还是杜松仁？ \";\n          cin.getline(iceCream, LENGTH);\n          cout\
