  # 处理由 `new` 抛出的 `bad_alloc` 异常\n\n如果 `new` 运算符无法分配请求的存储，它会抛出一个类型为 `bad_alloc` 的系统定义异常。例如，以下程序尝试在\
  \ `try` 块内部使用 `new` 运算符分配一个包含两个整数的数组。如果分配失败，产生的 `bad_alloc` 异常将被关联的 `catch` 块捕获，程序将带有相应的错误信息终止。如果分配成功，程序将继续打印数字\
  \ 10 和 20。`bad_alloc` 类型在头文件 `new` 中定义，引用它的程序必须包含该头文件。\n\n# 栈回溯（Unwinding the Stack）\n\
  \n如果在具有能够处理该异常的 `catch` 块的 `try` 块中抛出了异常，控制将从 `throw` 点转移到 `catch` 块。假设 `catch`\
  \ 块执行完毕且没有抛出进一步的异常、从函数返回或终止程序，执行将从 `try` 块关联的一系列 `catch` 块之后的第一个语句开始继续。\n\n如果函数不包含能够处理该异常的\
  \ `catch` 块，控制将传出函数，异常将在调用函数的调用点自动重新抛出。通过这一过程，异常可以沿着函数调用链向后传播，直到异常抛出一个具有可以处理它的 `catch`\
  \ 块的 `try` 块。如果从未找到这样的 `try` 块，异常最终将抛出主函数，导致程序终止。这种将未捕获的异常从函数传播到其调用者的过程被称为函数调用的栈回溯（unwinding\
  \ the stack）。\n\n# 重新抛出异常\n\n`try` 块是可以嵌套的。例如，看这段代码段：\n\n```\n void main()\n{\n\
  \   try\n   {\n      doSomething();\n   }\n   catch(exception1)\n   {\n      处理异常\
  \ 1 的代码\n   }\n    catch(exception2)\n   {\n      处理异常 2 的代码\n   }\n}\n```\n\n在这个\
  \ `try` 块中，调用了函数 `doSomething`。有两个 `catch` 块，一个处理 `exception1`，另一个处理 `exception2`。如果\
  \ `doSomething` 函数包含一个 `try` 块，那么它就嵌套在所示的块内部。\n\n在嵌套的 `try` 块中，有时需要内部异常处理器将异常传递给外部异常处理器。有时，当抛出特定异常时，内部和外部\
  \ `catch` 块都必须执行操作。这些情况要求内部 `catch` 块重新抛出（rethrow）异常，以便外部 `catch` 块可以捕获它。\n\n`catch`\
  \ 块可以使用无参数的 `throw;` 语句重新抛出异常。例如，假设 `doSomething` 函数（在上述 `try` 块中调用）执行可能抛出 `exception1`\
  \ 或 `exception3` 的代码。假设我们不想在 `doSomething` 中处理 `exception1` 错误，而是将其重新抛出给外部块。以下代码段说明了如何实现。\n\
  \n```\n void doSomething()\n{\n   try\n   {\n      可能抛出异常 1 和 3 的代码\n   }\n   catch(exception1)\n\
  \   {\n      throw; // 重新抛出异常\n   }\n   catch(exception3)\n   {\n      处理异常 3 的代码\n\
  \   }\n}\n```\n\n当第一个 `catch` 块捕获 `exception1` 时，`throw;` 语句再次抛出该异常。外部 `try/catch`\
  \ 结构中的 `catch` 块（在本例中是 `main` 函数中的那一个）将处理该异常。\n\n# 检查点（Checkpoint）\n\n1. 16.1 `try`\
