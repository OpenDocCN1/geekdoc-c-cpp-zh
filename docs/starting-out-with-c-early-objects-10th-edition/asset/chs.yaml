  \ `displayValue` 可以接受整数值作为参数。程序 6-6 是一个使用此函数的完整程序。\n\n注意第 6 行中 `displayValue` 的函数原型：\n\
  \n```\n void displayValue(int num);      // Function prototype\n```\n\n它同时列出了函数参数变量的数据类型和名称。然而，实际上没有必要在括号内列出参数变量的名称。只需要变量的数据类型。函数原型可以写成：\n\
  \n```\n void displayValue(int);          // Function prototype\n```\n\n由于某些老师倾向于让你在函数原型中仅列出每个参数的数据类型，而另一些老师则倾向于同时列出数据类型和名称，因此我们在本书书中使用了这两种版本。你的老师会告诉你应该使用哪种版本。\n\
  \n### 注意\n\n你的老师还会告诉该如何称呼函数参数。在本文中，传递到函数的值被称为 `arguments`（实参），而接收这些值的变量被称为 `parameters`（形参）。然而，这些术语有几种变体。有些人将参数称为\
