  \n```\n3/15/2020\nMarch 15, 2020\n15 March 2020\n```\n\n编写一个使用该类的程序进行演示。确保你的程序只接受月份和日的合理值。月份应在\
  \ 1 到 12 之间。\n\n## 2. 报告标题\n\n设计一个 `Heading` 类，它具有数据成员来保存公司名称和报告名称。双参数默认构造函数应允许在创建新的\
  \ `Heading` 对象时指定这些内容。如果用户在不传递任何参数的情况下创建 `Heading` 对象，应使用 `ABC Industries` 作为公司名称的默认值，使用\
  \ `Report` 作为报告名称的默认值。该类应该具有成员函数，以单行格式打印标题：\n\n```\nPet Pals Payroll Report\n```\n\
  \n或者以四行的框格式：\n\n```\n************************\n                       Pet Pals\n\
  \                    Report\n************************\n```\n\n尝试找到一种根据长度在屏幕上居中标题的方法。编写一个简单的程序演示该类。\n\
  \n## 3. 零件工厂\n\n为零件制造工厂设计一个类。假设每小时可以生产 10 个零件，类对象将计算生产任何数量零件需要多少天。（工厂每天运行两个 8 小时班次。）编写一个程序询问用户订单的零件数量，然后显示生产这些零件所需的天数。思考你的程序应该接受什么值的订单零件数量。\n\
  \n## 4. 类类\n\n编写一个名为 `Car` 的类，它具有以下成员变量：\n\n*   `year` 一个 `int`，保存汽车的型号年份。\n*  \
  \ `make` 一个 `string` 对象，保存汽车的品牌。\n*   `speed` 一个 `int`，保存汽车当前的运行。\n\n此外，该类应该具有以下成员函数。\n\
  \n*   `Constructor`。构造函数接受汽车的 `year` 和 `make` 作为参数，并将这些值赋值给对象的 `year` 和 `make` 成员变量。构造函数应将\
  \ `speed` 成员变量初始化为 0。\n*   `Accessors`。创建适当的访问器函数，允许从对象的 `year`、`make` 和 `speed`\
  \ 成员变量中检索值。\n\n\n\n\n* `accelerate()` `accelerate` 函数每次被调用时应将 `speed` 成员变量加 5。\n\
  * `brake() ` `brake` 函数每次被调用时应从 `speed` 成员变量中减 5。\n\n编写一个程序来演示该类，该程序创建一个 `Car` 对象，然后调用\
  \ `accelerate` 函数五次。在每次调用 `accelerate` 函数后，获取汽车的当前速度并显示。然后调用 `brake` 函数五次。在每次调用\
  \ `brake` 函数后，获取汽车的当前速度并显示。\n\n# 5. 人口\n\n在人口中，出生率和死亡率的计算方式如下：\n\n$$\\begin{array}{l}\
  \ {\\text{Birth~Rate} = \\text{Number~of~Births} \\div \\text{Population}} \\\\\
  \ {\\text{Death~Rate} = \\text{Number~of~Deaths} \\div \\text{Population}} \\end{array}$$\n\
  \n例如，在一个人口为 100,000 的群体中，每年有 5,000 人出生和 2,000 人死亡，\n\n$$\\begin{array}{l} {\\text{Birth~Rate}\
  \ = \\text{5,000} \\div \\text{100,000} = \\text{0}\\{.05}} \\\\ {\\text{Death~Rate}\
  \ = \\text{2,000} \\div \\text{100,000} = \\text{0}\\{.02}} \\end{array}$$\n\n设计一个\
  \ `Population` 类，用于存储某个地理区域当前人口、年出生人数和年死亡人数。该类应允许通过两种方式设置这三个值：创建新的 `Population`\
  \ 对象时通过向三参数构造函数传递参数，或者通过调用 `setPopulation`、`setBirths` 和 `setDeaths` 类成员函数。在任何情况下，如果传递给类的口数字小于\
  \ 2，则使用默认值 2。如果传递的出生或死亡人数小于 0，则使用默认值 0。该类还应有 `getBirthRate` 和 `getDeathRate` 函数，用于计算并返回出生率和死亡率。编写一个短程序使用\
  \ `Population` 类并演示其功能。\n\n# 6. 小费计算器\n\n设计一个 `Tips` 类，用于计算餐厅用餐的小费。它唯一的类成员变量 `taxRate`\
  \ 应通过一个参数构造函数进行设置，其值为创建 `Tips` 对象时传递给它的任何费率。如果没有传递参数，则应使用 .085 的默认税率。该类应仅有一个公共函数\
  \ `computeTip`。此函数需要接受两个参数：账单总金额和小费率。它应该使用账单总金额以及存储在 `taxRate` 成员变量中的值，计算加税前的用餐费用。然后它应将小费率应用于账单中的用餐费用部分，以计算并返回小费金额。通过创建一个程序来演示该类，该程序创建一个单个\
