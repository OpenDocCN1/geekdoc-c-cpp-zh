- pgno: 22
  md: 'If you wanted the union to be usable in multiple structures, you could declare
    it outside of the structure and give it a name (e.g., `union SomeValue { ... };`).
    You could then use it within the structure as, for example, `SomeValue Value;`.
    It''s usually better to keep it as an anonymous union though, since you do not
    need to worry about the side effects of making a change except within the structures
    in which it is defined.


    Unions can have constructors, destructors, and member functions. But since they
    can have only one active data member ever, it rarely makes any sense to write
    member functions for a union. You will rarely see them, perhaps never.


    # typedef


    The first thing to understand about typedef is that despite the implications of
    its name, typedef does not create new types. It is an aliasing mechanism that
    can be used for many things.


    It is used a lot in implementing the C++ Standard Library and other template-based
    code. This is, arguably, its most important use. We will explore it more in the
    chapter on templates.


    It can save you from a lot of typing (though this argument lost some of its force
    with the repurposing of the auto keyword for type deduction in C++11). If you
    have a particularly complicated data type, creating a typedef for it means you
    only need to type it out once. If your complicated data type’s purpose is unclear,
    giving it a more semantically meaningful name with a typedef can help make your
    program easier to understand.


    It is sometimes used as an abstraction by developers to easily change a backing
    type (e.g., from a `std::vector` to a `std::list`) or the type of a parameter
    (e.g., from an int to a long). For your own internal-use-only code, this should
    be frowned upon. If you are developing code that others will be using, such as
    a library, you should never try to use a typedef in this way. All you are doing
    is decreasing the discoverability of breaking changes to your API if you change
    a typedef. Use them to add semantic context, sure, but do not use them to change
    an underlying type in code that others rely on.


    If you need to change the type of something, remember that any change to a function’s
    parameters is a breaking change as is a change in return type or the addition
    of a default argument. The proper way to handle the possibility of a future type
    change is with abstract classes or with templates (whichever is more suitable
    or whichever you prefer, if both will serve). This way the public interface to
    your code will not change, only the implementation will. The Pimpl idiom is another
    good way to keep a stable API while retaining the freedom to change implementation
    details. We will explore the Pimpl idiom, short for “pointer to implementation,”
    in a later chapter.


    Here is a small code block illustrating the syntax for typedef.


    ```

    ```cpp

    class ExistingType;


    typedef ExistingType AliasForExistingType;

    ```

    ```


    And the following is a brief sample showing how typedef might be used. The purpose
    of this sample is to illustrate a simplified but realistic use of a typedef. In
    practice, a typedef like this would go into a namespace and would then be included
    in a header file. Since we haven’t covered any of that, this example has been
    kept simple intentionally.


    # Sample: TypedefSample\TypedefSample.cpp


    ```

    ```cpp

    #include <iostream>

    #include <ostream>

    #include <vector>

    #include <algorithm>

    #include "../pch.h"

    ```

    ```'
