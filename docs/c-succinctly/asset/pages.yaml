  md: "properly, so you should implement proper exception specifications if your code\
    \ needs to be compiled with another compiler.\n\n> **Note:** Exception specifications\
    \ using the `throw()` syntax (called dynamic-exception specifications) are deprecated\
    \ as of C++11. As such, they may be removed from the language in the future. The\
    \ `noexcept` specification and operator are replacements for this language feature\
