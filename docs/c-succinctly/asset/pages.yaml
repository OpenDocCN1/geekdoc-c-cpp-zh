- pgno: 122
  md: 'If you aren’t having any luck on your own, go to MSDN and type the first part
    of the error message. You’ll probably find some helpful links to discussions on
    the MSDN forums, on StackOverflow, perhaps an MSDN article or an MSDN blog post—maybe
    even just the error code’s page itself will have the hint you need. If all else
    fails, post a question on a forums site: MSDN, the appropriate StackExchange site,
    or App Hub.


    A linker error is typically an unresolved symbol, which usually means you have
    a mismatch in declaration and definition, have an inline outside of its header,
    or don’t have the right library added to the project’s extra dependencies in the
    project’s linker options. If it’s something else, try the strategies from the
    previous paragraph; they apply just as well to linker errors as to compiler errors.'
