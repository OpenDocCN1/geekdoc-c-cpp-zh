    Because the throw exception specification syntax is deprecated, you should only
    use the empty parentheses form of it, throw(), in order to specify that a particular
    function does not throw exceptions; otherwise, just leave it off. If you want
    to let others know what exceptions your functions can throw, consider using comments
    in your header files or in other documentation, making sure to keep them up-to-date.


    noexcept(bool expression) is also an operator. When used as an operator, it takes
    an expression that will evaluate to true if it can throw an exception, or false
    if it can throw an exception. Note that the result is a simple evaluation; it
    checks to see if all functions called are noexcept(true), and if there are any
    throw statements in expressions. If it finds any throw statements, even ones that
    you know are unreachable, (e.g., if (x % 2 < 0) { throw "This computer is broken";
    }) it can, nonetheless, evaluate to false since the compiler is not required to
    do a deep-level analysis.


    # Pimpl (Pointer to Implementation)


    The pointer-to-implementation idiom is an older technique that has been getting
    a lot of attention in C++. This is good, because it is quite useful. The essence
    of the technique is that in your header file you define your class’ public interface.
    The only data member you have is a private pointer to a forward-declared class
    or structure (wrapped in a std::unique_ptr for exception-safe memory handling),
    which will serve as the actual implementation.


    In your source code file, you define this implementation class and all of its
    member functions and member data. The public functions from the interface call
    into the implementation class for its functionality. The result is that once you’ve
    settled on the public interface for your class, the header file never changes.
    Thus, the source code files that include the header will not need to be recompiled
    due to implementation changes that do not affect the public interface.


    Whenever you want to make changes to the implementation, the only thing that needs
    to be recompiled is the source code file where that implementation class exists,
    rather than every source code file that includes the class header file.


    Here is a simple sample.


    **Sample: PimplSample\\Sandwich.h**


    ```

    ```cpp

    #pragma once

    #include <memory>


    class SandwichImpl;

    ```

    ```'
