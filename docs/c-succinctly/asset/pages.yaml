- pgno: 27
  md: '# # Chapter 3 Functions and Classes


    # ## Declaration vs. Definition


    > > **Tip:** This first section, “Declaration vs. Definition,” is a bit dense.
    Understanding these concepts before looking at a sample will help you understand
    the sample. In turn, looking at a sample will help you understand these concepts.
    I recommend you read this and then look through the samples in the next two sections.
    If parts of this section weren''t clear, come back to reread this section.


    In C#, classes and other types are declared and defined at the same time. Even
    with the `partial` keyword, the class definition is simply allowed to spread over
    multiple files; it does not change the combination of declaration and definition.
    The only exception to this rule is when doing interop (which uses `DllImportAttribute`
    and the `extern` keyword to declare a function defined in an external DLL). In
    that case, the definition isn''t in C# but is almost certainly in some non-.NET
    library. (If the DLL was a .NET assembly, you could just add a reference to it
    and use it without any interop code being necessary.)


    I write this because in C++, declaration and definition can usually be separated,
    and frequently are. It is common to see a class declared in a header file (which,
    by convention, has a .H suffix) and defined in a source file (which, by convention,
    has a .CPP suffix). This is true not just for classes, but also for standalone
    functions and even structures and unions when they have member functions associated
    with them.


    Expect to see one or more `#include "SomeHeader.h"` lines at the top of a .CPP
    file. These statements tell the compiler (or, more accurately, the preprocessor)
    that there are declarations and possibly definitions in that file, or in files
    included from it, that are necessary for the compiler to make sense of parts of
    the C++ code that follows.


    With Visual C++, when including a header that is part of your project or is not
    found in the build system''s include path, use the `#include "HeaderFile.h"` syntax.
    When including a system include file, such as Windows.h, use the `#include <windows.h>`
    syntax. Lastly, when including an include file that is part of the C++ Standard
    Library (which we will discuss in more detail later), use the `#include <vector>`
    syntax (i.e. no .h is included). The meaning of the `" "` versus the `< >` syntax
    for including files is implementation-defined, though both GCC and Visual C++
    use quoted syntax for local header files and bracketed syntax for system header
    files.


    > > **Note:** The reason the .H suffix was left off from the C++ Standard Library
    include files was to avoid naming collisions with C++ compilers that already provided
    header files that used those names when the C++ Standard Library was introduced.
    They are normal header files, have no fear.


    To understand why the difference between declaration and definition matters in
    C++, it''s important to have a basic understanding of the C++ build process. Here''s
    what generally happens:


    +   1. The preprocessor examines a source file, inserts the text of the files
    specified by the include statements (and the text of the files specified by their
    include statements, etc.), and also evaluates and acts on any other *preprocessor
    directives* (e.g., expanding macros) and any *pragma directives*.

    +   2. The compiler takes the output from the preprocessor and compiles that code
    into machine code, which it stores, along with other information needed for the
    linking phase, in an OBJ file.

    +   3. Steps 1 and 2 are repeated for each source file within the project.

    +   4. The linker examines the output files from the compiler and the library
    files that your project links. It finds all of the places where the compiler identified
    something as being declared but not defined within that particular source file.
    It then locates the appropriate address for the definition and patches that address
    in.'
