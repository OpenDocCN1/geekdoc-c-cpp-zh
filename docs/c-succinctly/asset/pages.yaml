  md: "If you define a constructor with no parameters, it is an explicit default constructor.\
    \ It is also possible to define a constructor that takes parameters and still\
    \ make it a default constructor using default arguments, which we will discuss\
    \ in a moment.\n\nIf you define a constructor that has at least one required parameter,\
    \ then the compiler will not generate a default constructor. You must define an\
    \ explicit default constructor if you want one.\n\n# Default Arguments in Function\
    \ Declarations\n\nConstructors in C++, and functions in general, can have default\
    \ arguments specified for some or all of their parameters as part of their declaration\
    \ (similar to C#'s optional arguments). In C++ functions, all parameters with\
    \ default arguments must occur to the right of any parameter without a default\
    \ argument in the function declaration. C++ does not support C-style named arguments,\
    \ but you can accomplish something similar using the [named parameter idiom](#).\n\
    \nWhy mention default arguments here? Well, it turns out that if you have a constructor\
    \ in which all the parameters have default arguments, that constructor is a default\
    \ constructor. It makes sense, since if you have a constructor with the signature\
    \ `Vehicle(VehicleType type = VehicleType::Car, double odometerReading = 0.0);`\
    \ then you can call that constructor with empty parentheses, and those default\
    \ arguments will be used. If you define a default constructor, you can have only\
    \ one, regardless whether it has no parameters, or whether its parameters all\
    \ have default arguments.\n\nThis principle goes further still. No two functions\
    \ with the same name that are declared in the same scope can have the same parameter\
    \ types in exactly the same positions. You guessed it: Parameters with default\
    \ arguments are disregarded for the purpose of distinct function signatures.\n\
    \nIt all makes sense because default arguments make it impossible to distinguish\
    \ between `double Add(double a, double b = 0.0);` and `double Add(double a, int\
    \ a = 0);` given that both could be called as `double dbl = Add(5.0);`. The compiler\
    \ cannot know which you intended in that case, so it simply fails to compile and\
    \ displays an error message.\n\n# Parameterized Constructors\n\nA parameterized\
    \ constructor has one or more parameters. A parameterized constructor where all\
    \ of the parameters have default arguments is also the default constructor for\
    \ a class. There is nothing special about parameterized constructors in C++.\n\
    \n# Conversion Constructors\n\nA conversion constructor has at least one parameter.\
    \ If there is more than one, then those additional parameters must have default\
    \ arguments.\n\nIf you do not want a constructor to be a conversion constructor,\
    \ you can mark it with the function specifier: explicit. Let’s look at an example:\n\
    \n```\n```cpp\n#include <string>\n\nclass SomeClass\n{\npublic:\n        SomeClass(const\
    \ wchar_t* value) :\n                m_strValue(value),\n                m_intValue()\n\
    \        {\n        }\n};\n```\n```"
