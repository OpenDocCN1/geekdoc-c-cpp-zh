- pgno: 13
  md: '# # C++11


    In 2011, a new major version of the C++ language standard was adopted by the ISO/IEC
    working group responsible for the design and development of C++ as a language.
    When compared with C++98 and C++03, C++11 feels like a different language. Because
    C++11 is so new, there are no compilers that support every single feature, and
    there are some that support less than others. I have targeted Visual C++ and the
    features it implements in its most current release (Visual Studio 2012 RC at the
    time of this writing), though I have mentioned a few features that Visual C++
    does not currently support and have pointed this out when appropriate.


    It is unlikely that Visual C++ will change much between Visual Studio 2012 RC
    and Visual Studio 2012 RTM. There are plans to do an out-of-band update, which
    will add additional C++11 language support, sometime after the RTM is released.
    Since I cannot predict which features will be added and do not have any inside
    knowledge about it, I mostly did not cover things which are not supported in the
    RC.


    If you have previous experience with C++ from five years ago, or perhaps longer,
    you are likely to be very pleasantly surprised—which is not to say that it has
    everything C# has.


    There are features of C# and .NET that I miss when working in C++. But there are
    also features of C++ that I miss when working in C#. I miss the simplicity of
    casting in C# that the CLR''s type system provides when I''m working in C++. I
    also miss .NET''s fuller set of exceptions and the frequently better IntelliSense
    that .NET provides. In C++, I find myself referring to documentation a lot more
    than in C# to figure out things like what argument values I can and should pass
    to a particular function, and what values to expect back from it.


    When I''m working in C#, I find myself missing the breadth that C++''s different
    storage durations provide. In C#, most things just wind up on the GC-managed heap,
    which greatly simplifies memory management. But sometimes I don''t necessarily
    want a class instance to be on the heap. In C#, I have no choice but to rewrite
    the class as a structure; while in C++, I can easily choose between the two without
    needing to change the class definition itself. I also miss stand-alone functions
    (even though they can be mostly emulated with static methods in static classes
    in C#). I also like that my C++ programs end up as heavily optimized (and thus
    difficult to understand) machine code when I compile them, so I don''t really
    need to worry about trying to obfuscate my programs if I want my code to stay
    secret (like I do with .NET, though there are some very good obfuscation tools
    out there).


    Each language targets its own set of problems and has its own history and quirks
    associated with it. Hopefully you will find C++ an interesting and useful language
    to add to your programming repertoire.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# # Chapter 1 Types


    # ## Fundamental Types


    C++ contains the same familiar keywords (e.g., `int`) that you recognize from
    C#. This is unsurprising given that both are C-like languages. There is, however,
    one potential landmine that can throw you into trouble. While C# explicitly defines
    the sizes of fundamental types (a `short` is a 16-bit integer, an `int` is a 32-bit
    integer, a `long` is a 64-bit integer, a `double` is a 64-bit double-precision
    IEEE 754 floating point number, etc.), C++ makes no such guarantees.


    The smallest fundamental unit in C++ is `char`, which only needs to be at least
    large enough to hold the 96 basic characters that the C++ standard specifies,
    plus any other characters in the implementation''s basic character set. In theory,
    some implementation of C++ could define a `char` as 7 bits or 16 bits ... almost
    anything is possible. But in practice you don''t need to worry too much about
    a `char` being anything other than 8 bits (the equivalent of the byte or sbyte
    type in C#), which is its size in Visual C++.


    In C++, `char`, `signed char`, and `unsigned char` are three distinct types. All
    three are required to take up the same amount of storage in memory. So a `char`
    in practice is either signed or unsigned. Whether it is signed or unsigned is
    implementation defined (see the sidebar). In Visual C++ the `char` type is, by
    default, signed. But you can use a compiler switch to have it treated as unsigned
    instead. In GCC, whether it is signed or unsigned depends on which CPU architecture
    you are targeting.


    The signed integer types, in size order from smallest to largest, are:


    +   1. `signed char`

    +   2. `short int`

    +   3. `int`

    +   4. `long int`

    +   5. `long long int`


    > > **Implementations**

    > > Like many programming languages, there are multiple C++ implementations from
    various companies and organizations. Two of the most popular C++ implementations
    are Visual C++ and GCC. The C++ standard leaves some of its details to be defined
    by the implementer. If you are writing cross-platform code, you need to keep these
    implementation-defined details in mind, lest you find a program working fine on
    one OS and failing in weird ways on another.


    The only guarantee of the size of each of these integer types is that each one
    is at least as large as the next smallest integer type. In Visual C++, an `int`
    and a `long int` are both 32-bit integers. It is only the `long long int` that
    is a 64-bit integer.


    > > **Note:** *You can simply write Long or Long Long; you do not need to write
    Long Int or Long Long Int, respectively. The same is also true for short int (i.e.
    you can just write short). The short type is a 16-bit signed integer in Visual
    C++.*


    Each of the integer types has a corresponding unsigned integer type. You just
    put the keyword `unsigned` in front to get the unsigned version (except for `signed
    char`, which you change to `unsigned char`).


    If you need to ensure that you are using specific sizes, you can include the C++
    Standard Library header file `cstdint` (e.g., `#include <cstdint>`), which defines,
    among other things, the types:


    +   - `int8_t`

    +   - `int16_t`

    +   - `int32_t`'
