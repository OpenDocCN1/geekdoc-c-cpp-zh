  md: '# # Chapter 6 Resource Acquisition is

    # Initialization


    # ## What Is RAII?


    RAII stands for “resource acquisition is initialization.” RAII is a design pattern
    using C++ code to eliminate resource leaks. Resource leaks happen when a resource
    that your program acquired is not subsequently released. The most familiar example
    is a memory leak. Since C++ doesn''t have a GC the way C# does, you need to be
    careful to ensure that dynamically allocated memory is freed. Otherwise, you will
    leak that memory. Resource leaks can also result in the inability to open a file
    because the file system thinks it''s already open, the inability to obtain a lock
    in a multi-threaded program, or the inability to release a COM object.


    # ## How Does RAII Work?


    RAII works because of three basic facts.


    +   1. When an automatic storage duration object goes out of scope, its destructor
    runs.

    +   2. When an exception occurs, all automatic duration objects that have been
    fully constructed since the last try-block began are destroyed in the reverse
    order they were created before any catch handler is invoked.

    +   3. If you nest try-blocks, and none of the catch handlers of an inner try-block
    handles that type of exception, then the exception propagates to the outer try-block.
    All automatic duration objects that have been fully constructed within that outer
    try-block are then destroyed in reverse creation order before any catch handler
    is invoked, and so on, until something catches the exception or your program crashes.


    RAII helps ensure that you release resources, without exceptions occurring, by
    simply using automatic storage duration objects that contain the resources. It
    is similar to the combination of the System.IDisposable interface along with the
    using statement in C#. Once execution leaves the current block, whether through
    successful execution or an exception, the resources are freed.


    When it comes to exceptions, a key part to remember is that only fully constructed
    objects are destroyed. If you receive an exception in the midst of a constructor,
    and the last try block began outside that constructor, since the object isn''t
    fully constructed, its destructor will not run.


    This does not mean that member variables, which are objects, will not be destroyed.
    Any member variable objects that were fully constructed within the constructor
    before the exception occurred are fully constructed automatic duration objects.
    Thus, those member objects will be destroyed the same as any other fully constructed
    objects.


    This is why you should always put dynamic allocations inside either std::unique_ptr
    or std::shared_ptr. Instances of those types become fully constructed objects
    when the allocation succeeds. Even if the constructor for the object you are creating
    fails further in, the std::unique_ptr resources will be freed by its destructor
    and the std::shared_ptr resources will have their reference count decremented
    and will be freed if the count becomes zero.


    RAII isn''t about shared_ptr and unique_ptr only, of course. It also applies to
    other resource types, such as a file object, where the acquisition is the opening
    of the file and the destructor ensures that the file is properly closed. This
    is a particularly good example since you only need to create that code right just
    once—when you write the class—rather than again and again, which is what you need
    to do if you write the close logic every place you have to open a file.'
