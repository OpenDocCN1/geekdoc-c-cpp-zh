  md: 'Note that the generated assembly uses MASM macros (find them on MSDN). If you
    don’t know what a particular assembly instruction means (e.g., LEA), you can search
    the internet for it or download the appropriate programming manual from Intel’s
    site (assuming x86/Itanium), AMD’s site (assuming x64) or ARM Holding’s site (assuming
    ARM). If you’ve never learned any assembly, I definitely recommend doing so (try
    creating a simple Windows console app).


    Understanding assembly gives you a better understanding of how computers really
    work internally. Combine that with the knowledge that computers are all hardwired
    to begin executing the same code every time they are powered on (traditionally
    the BIOS on PCs, though that is now being replaced by UEFI), and the mystery of
    how and why computers work quickly begins to fade.


    # Terrifying Build Errors


    If you come across a build error that looks completely horrible, chances are it’s
    from the linker. You’ll see messages like this, for instance:


    ```

    Error    2    error LNK2019: unresolved external symbol "__thiscall

    SomeClass::SomeClass(wchar_t const *)" (??0SomeClass@@QAE@P?W@Z) referenced in

    function "void __cdecl DoSomething(void)" (?DoSomething@@YAXXZ)

    D:\VS2010\ProjCppSandbox\CppSandbox\CppSandbox.obj    CppSandbox

    ```


    All that’s saying is it cannot find a function you said it should be able to find.
    In this case, I added the inline keyword to a constructor function definition
    in the CPP file without remembering to relocate that definition to the header
    file. Any inline functions need to be in the header so the linker won’t have to
    look for it.


    All those ??s and @@ands are just how C++ mangles names when it has compiled code
    into object files. Name mangling is internally consistent for the compiler in
    question, but the ISO/IEC standard doesn’t mandate any particular schema for name
    mangling. Different compilers can, and often will, mangle things differently.


    Normally, if you see a horrifying build error message, chances are it’s from the
    linker, and it’s an unresolved symbol error. If it’s saying it can’t find something
    you wrote, then check to make sure your declaration in the header file matches
    the definition, usually in the code file but maybe in the header, or maybe you
    forgot to write it, or maybe you declared it inline but still have it in the code
    file.


    An example of this is in the previous case: my SomeClass::SomeClass(wchar_t const
    *) constructor function (I always write const type not type const, so even that
    bit is reconstructed).


    If it’s someone else’s function or other symbol, then chances are you didn’t tell
    the linker about the .LIB file that contains it.


    In .NET, you just add a reference to an assembly to get both the declaration bits
    and the actual definition all in one. In C++, the declaration is the header file,
    while the definition code—excluding inline code, which needs to be in the header
    file too—is in a separate library. Search the MSDN library for the missing symbol
    and find the name of the library file you need to add.


    C++ build errors can look pretty scary, especially when you receive a build error
    involving a template. Those can make you want to quit. But don’t. Never let the
    horrible error messages win. First, figure out if it’s coming from the compiler
    (it’ll have a C#### error number format) or the linker (LNK#### error number format).


    If from the compiler, it usually means a syntax error. Check things like whether
    you forgot the #pragma once at the top of your header file. Another problem could
    be where you used something from the Standard Library (e.g., endl) but forgot
    to have a #using namespace std; or to prefix it with std:: (i.e. std::endl).


    You can do either or both, but you must do at least one. Some things might be
    in a different namespace. In Visual Studio 2010, some functionality is in the
    stdext namespace, for example. The same goes for any namespaces in your own code.'
  merge: -1
