    \n                inline VehicleCondition GetVehicleCondition(void);\n\n     \
    \           void SetVehicleCondition(VehicleCondition condition);\n\n        \
    \        inline double GetBasis(void);\n\n        private:\n                VehicleCondition\
    \                 m_condition;\n                double                       \
    \    m_basis;\n        };\n\n        VehicleCondition Vehicle::GetVehicleCondition(void)\n\
