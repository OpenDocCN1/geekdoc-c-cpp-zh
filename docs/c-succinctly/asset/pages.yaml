    In our _pmain function, first we create an object of type Y within its own scope.
    We then call its GetSomeInt member function. This helps ensure that the compiler
    will not optimize away the creation of Y in a release build in case you mess around
    with the code. It also serves as a marker between construction and destruction.


    We then exit the scope of Y, triggering its destruction. After this, we write
    another marker string to separate the instantiation of a Y instance from the instantiation
    of the Z instance that follows. We create the Z instance in its own scope so we
    can follow its construction and destruction the same way as with Y.


    So what do we see? Quite a lot. Let''s focus on Y first.


    When we call the Y constructor, the first thing it does is call the default constructor
    for A. This might seem terribly wrong for several reasons, but it is, in fact,
    right. The Y constructor says to follow this order:


    +   1. Initialize base class C.

    +   2. Initialize Y''s member variable m_someInt.

    +   3. Initialize base class D.

    +   4. Initialize base class B.


    Instead, we wind up with this order:


    +   1. Initialize base class A via its default constructor.

    +   2. Initialize base class B.

    +   3. Initialize base class C.

    +   4. Initialize base class D.

    +   5. Initialize Y''s member variable m_someInt.


    Since we know B inherits virtually from A, and that B is the only source of inheritance
    from A, we can conclude that B is given priority over the others and that A is
    given priority over B.'
