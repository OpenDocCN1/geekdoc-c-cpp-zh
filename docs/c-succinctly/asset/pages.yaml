  md: "# # Chapter 13 C++ Standard Library\n\n# ## Introduction\n\nThere are far more\
    \ things in the C++ Standard Library than we have time to cover. We will limit\
    \ ourselves to looking at some of the most commonly used features that we haven’t\
    \ yet explored.\n\n# ## Iterators\n\nIterators serve the same purpose as IEnumerable\
    \ and related interfaces in .NET, such as providing a common way to navigate through\
    \ collections. Given a `std::vector`, for example, you can loop through its collection\
    \ of items using the following code:\n\n```\n```cpp\nvector<int> vec;\nvec.push_back(1);\n\
    vec.push_back(4);\nvec.push_back(7);\nvec.push_back(12);\nvec.push_back(8);\n\n\
    for (auto i = begin(vec); i != end(vec); i++)\n{\n    wcout << *i << endl;\n}\n\
    ```\n```\n\nThe `std::begin` function provides an iterator pointing to the first\
    \ item of the collection. `std::end` provides an iterator that signals we have\
    \ reached the end of a collection; the last item of the collection, assuming the\
    \ collection has any items, is one item before the item we are given by `std::end`.\
    \ That’s why we check for `!=` in the `for` loop. If no items are in the collection,\
    \ then `std::begin` and `std::end` will return the same value.\n\nIn addition\
    \ to the iterators from those two template functions, many collections provide\
    \ iterators via member functions named `cbegin` and `cend`, reverse iterators\
    \ (that loop through a collection backwards) via `rbegin` and `rend`, and const\
    \ reverse iterators via `crbegin` and `crend`. In the previous example, you can\
    \ replace `begin(vec)` with `vec.rbegin()` and `end(vec)` with `vec.rend()` to\
    \ go through the vector in reverse.\n\n# ## Range-Based for Loops\n\nC++11 has\
    \ added an additional type of for loop, called the range-based for loop, which\
    \ provides functionality similar to the `foreach` loop in C#. The range-based\
    \ for loop uses iterators and provides you the trouble of de-referencing pointers\
    \ and the possibility of improperly checking for the end. The range-based for\
    \ loop equivalent to the for loop in the previous example looks like this:\n\n\
    ```\n```cpp\nfor (auto item : vec)\n{\n    wcout << item << endl;\n}\n```\n```"
