  md: '# # How Do I Use RAII?


    RAII use is described by its name: Acquiring a dynamic resource should complete
    the initialization of an object. If you follow this one-resource-per-object pattern,
    then it is impossible to wind up with a resource leak. Either you will successfully
    acquire the resource, in which case the object that encapsulates it will finish
    construction and be subject to destruction, or the acquisition attempt will fail,
    in which case you did not acquire the resource; thus, there is no resource to
    release.


    The destructor of an object that encapsulates a resource must release that resource.
    This, among other things, is one of the important reasons why destructors should
    never throw exceptions, except those they catch and handle within themselves.


    If the destructor threw an uncaught exception, then, to quote Bjarne Stroustrup,
    “All kinds of bad things are likely to happen because the basic rules of the standard
    library and the language itself will be violated. Don’t do it.”


    As he said, *don’t do it*. Make sure you know what exceptions, if any, everything
    you call in your destructors could throw so you can ensure that you handle them
    properly.


    Now you might be thinking that if you follow this pattern, you will end up writing
    a ton of classes. You will occasionally write an extra class here and there, but
    you aren’t likely to write too many because of smart pointers. Smart pointers
    are objects too. Most types of dynamic resources can be put into at least one
    of the existing smart pointer classes. When you put a resource acquisition inside
    a suitable smart pointer, if the acquisition succeeds, then that smart pointer
    object will be fully constructed. If an exception occurs, then the smart pointer
    object’s destructor will be called, and the resource will be freed.


    There are several important smart pointer types. Let’s have a look at them.


    # ## `std::unique_ptr`


    The unique pointer, `std::unique_ptr`, is designed to hold a pointer to a dynamically
    allocated object. You should use this type only when you want one pointer to the
    object to exist. It is a template class that takes a mandatory and an optional
    template argument. The mandatory argument is the type of the pointer it will hold.
    For instance `auto result = std::unique_ptr<int>(new int());` will create a unique
    pointer that contains an `int*`. The optional argument is the type of deleter.
    We see how to write a deleter in a coming sample. Typically, you can avoid specifying
    a deleter since the `default_deleter`, which is provided for you if no deleter
    is specified, covers almost every case you can imagine.


    A class that has `std::unique_ptr` as a member variable cannot have a default
    copy constructor. Copy semantics are disabled for `std::unique_ptr`. If you want
    a copy constructor in a class that has a unique pointer, you must write it. You
    should also write an overload for the copy operator. Normally, you want `std::shared_ptr`
    in that case.


    However, you might have something like an array of data. You may also want any
    copy of the class to create a copy of the data as it exists at that time. In that
    case, a unique pointer with a custom copy constructor could be the right choice.


    `std::unique_ptr` is defined in the `<memory>` header file.


    `std::unique_ptr` has four member functions of interest.


    The `get` member function returns the stored pointer. If you need to call a function
    that you need to pass the contained pointer to, use `get` to retrieve a copy of
    the pointer.'
