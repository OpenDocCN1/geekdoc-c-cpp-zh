  md: '# # Chapter 7 Pointers, References, and Const-Correctness


    # ## Pointer Overview


    A pointer is nothing more than a variable that holds a memory address. When used
    properly, a pointer holds a valid memory address that contains an object, which
    is compatible with the type of the pointer. Like references in C++, all pointers
    in a particular execution environment have the same size, regardless of the type
    of data the pointer points to. For example, when a program is compiled for and
    run on a 32-bit operating system, a pointer will typically be 4 bytes (32 bits).


    Pointers can point to any memory address. You can, and frequently will, have pointers
    to objects that are on the stack. You can also have pointers to static objects,
    to thread local objects, and, of course, to dynamic (i.e., heap allocated) objects.
    When programmers with only a passing familiarity with pointers think of them,
    it’s usually in the context of dynamic objects.


    Because of potential leaks, you should never allocate dynamic memory outside of
    a smart pointer. The C++ Standard Library provides two smart pointers that you
    should consider: `std::shared_ptr` and `std::unique_ptr`.


    By putting dynamic duration objects inside one of these, you guarantee that when
    the `std::unique_ptr`, or the last `std::shared_ptr` that contains a pointer to
    that memory goes out of scope, the memory will be properly freed with the correct
    version of delete (delete or `delete[]`) so it won’t leak. That’s the RAII pattern
    from the previous chapter in action.


    Only two things can happen when you do RAII right with smart pointers: The allocation
    succeeds, and therefore the memory will be properly freed when the smart pointer
    goes out of scope or the allocation fails, in which case there was no memory allocated
    and thus no leak. In practice, the last situation should be quite rare on modern
    PCs and servers due to their large memory and their provision of virtual memory.


    If you don’t use smart pointers, you''re just asking for a memory leak. Any exception
    between allocating the memory with `new` or `new[]` and freeing the memory with
    `delete` or `delete[]` will likely result in a memory leak. If you aren’t careful,
    you could accidentally use a pointer that was already deleted, but was not set
    equal to `nullptr`. You would then be accessing some random location in memory
    and treating it like it’s a valid pointer.


    The best thing that could happen in that case is for your program to crash. If
    it doesn’t, then you’re corrupting data in strange, unknown ways and possibly
    saving those corruptions to a database or pushing them across the web. You could
    be opening the door to security problems too. So use smart pointers and let the
    language handle memory-management issues for you.


    # ## Const Pointer


    A const pointer takes the form `SomeClass* const someClass2 = &someClass1;`. In
    other words, the `*` comes before const. The result is that the pointer itself
    cannot point to anything else, but the data the pointer points at remains mutable.
    This is not likely to be very useful in most situations.


    # ## Pointer to Const


    A pointer to const takes the form `const SomeClass* someClass2 = &someClass1;`.
    In this case the `*` comes after const. The result is that the pointer can point
    to other things, but you cannot modify the data it points to. This is a common
    way to declare parameters that you simply want to inspect without modifying their
    data.'
