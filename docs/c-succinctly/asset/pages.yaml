- pgno: 50
  md: "```\n```cpp\nprivate:\n        Toppings             m_toppings;\n        Flavor\
    \               m_flavor;\n\n        // Other member data and member functions...\n\
    };\n```\n```\n\nThe three lines after #pragma once tell the compiler everything\
    \ it needs to know. It’s told that SomeClassA is a class, so it can establish\
    \ its type for linkage purposes. It’s told that Flavor is an enum class, and thus\
    \ it knows that it needs to reserve space for an int (the default underlying type\
    \ of an enum class). Lastly, it’s told that Toppings is an enum with an underlying\
    \ type of int, and thus it can reserve space for it as well.\n\nIf the definitions\
    \ of those types in **SomeClassA.h**, **Flavor.h**, and **Toppings.h** did not\
    \ match those forward declarations, then you would receive compiler errors. If\
    \ you wanted a SomeClassA instance to be a member variable of SomeClassB, or if\
    \ you wanted to pass one as an argument directly rather than as a pointer or a\
    \ reference, then you would need to include SomeClassA. The compiler would then\
    \ need to reserve space for SomeClassA and would need its full definition in order\
    \ to determine its size in memory. Lastly, you still need to include those three\
    \ header files in the **SomeClassB.cpp** source code file since you will be working\
    \ with them within the SomeClassB member function definitions.\n\nSo what have\
    \ we gained? Anytime you include **SomeClassB.h** in a source code file, that\
    \ code file will not automatically contain all the code from **SomeClassA.h**,\
    \ **Flavor.h**, and **Toppings.h** and compile with it. You might choose to include\
    \ them if you need them, but you’ve eliminated their automatic inclusion and that\
    \ of any header files they include.\n\nLet’s say **SomeClassA.h** includes **Windows.h**\
    \ because, in addition to giving you some value, it also works with a window in\
    \ your application. You’ve suddenly reduced the lines of code (by thousands and\
    \ thousands) that need to be compiled in any source code file that includes **SomeClassB.h**\
    \ but does not include **SomeClassA.h** or **Windows.h**. If you include **SomeClassB.h**\
    \ in several dozen files, you’re suddenly talking about tens to hundreds of thousands\
    \ of lines of code.\n\nForward declarations can save a few milliseconds, or minutes,\
    \ or hours (for large projects). They are not a magic solution to all problems\
    \ of course, but they are a valuable tool that can save time when used properly."
