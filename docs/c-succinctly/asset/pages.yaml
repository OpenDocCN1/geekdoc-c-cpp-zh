  md: '`std::shared_ptr` is defined in the `<memory>` header file.


    `std::shared_ptr` has five member functions of interest.


    The get member function works the same as the `std::unique_ptr::get` member function.


    The use_count member function returns a long, which tells you what the current
    reference count for the target object is. This does not include weak references.


    The unique member function returns a bool, informing you whether this particular
    shared pointer is the sole owner of the target object.


    The swap member function works the same as the `std::unique_ptr::swap` member
    function, with the addition that the reference counts for the resources stay the
    same.


    The reset member function decrements the reference count for the underlying resource
    and destroys it if the resource count becomes zero. If a pointer to an object
    is passed in, the shared pointer will store it and begin a new reference count
    for that pointer. If `nullptr` is passed in, or if no parameter is passed, then
    the shared pointer will store null.


    # ## std::make_shared


    The `std::make_shared` template function is a convenient way to construct an initial
    `std::shared_ptr`. As we saw previously in **SharedPtrSample**, you pass the type
    as the template argument and then simply pass in the arguments, if any, for the
    desired constructor. `std::make_shared` will construct a heap instance of the
    template argument object type and make it into a `std::shared_ptr`. You can then
    pass that `std::shared_ptr` as an argument to the `std::shared_ptr` constructor
    to create more references to that shared object.


    # ## ComPtr in WRL for Metro-Style Apps


    The Windows Runtime Template Library (WRL) provides a smart pointer named `ComPtr`
    within the Microsoft::WRL namespace for use with COM objects in Windows 8 Metro-style
    applications. The pointer is found in the `<wrl/client.h>` header, as part of
    the Windows SDK (minimum version 8.0).


    Most of the operating system functionality that you can use in Metro-style applications
    is exposed by the Windows Runtime (WinRT). WinRT objects provide their own automatic
    reference counting functionality for object creation and destruction. Some system
    functionality, such as Direct3D, requires you to directly use and manipulate it
    through classic COM. ComPtr handles COM''s IUnknown-based reference counting for
    you. It also provides convenient wrappers for QueryInterface and includes other
    functionality that is useful for smart pointers.


    The two member functions you typically use are As to get a different interface
    for the underlying COM object and Get to take an interface pointer to the underlying
    COM object that the ComPtr holds (this is the equivalent of `std::unique_ptr::get`).


    Sometimes you will use Detach, which works the same way as the `std::unique_ptr::release`
    but has a different name because Release in COM implies decrementing the reference
    count and Detach does not do that.


    You might use ReleaseAndGetAddressOf for situations where you have an existing
    ComPtr that could already hold a COM object and you want to replace it with a
    new COM object of the same type. ReleaseAndGetAddressOf does the same thing as
    the GetAddressOf member function, but it first releases its underlying interface,
    if any.'
