- pgno: 47
  md: "```\n```cpp\n// You can also create an IWriteData pointer to an instance of\
    \ a\n// class that derives from IWriteData.\nIWriteData* p_iwd = &cwd;\n\ncwd.WriteLine(10);\n\
    r_iwd.WriteLine(14.6);\np_iwd->WriteLine(L\"Hello Abstract World!\");\n\nreturn\
    \ 0;\n}\n```\n```\n\nThe previous sample demonstrates how to implement an interface-style\
    \ class in C++. The IWriteData class could be inherited by a class that writes\
    \ data to a log file, to a network connection, or to any other output. By passing\
    \ around a pointer or a reference to IWriteData, you could easily switch output\
    \ mechanisms.\n\nThe syntax for an abstract member function, called a pure virtual\
    \ function, is simply to add = 0 after the declaration, as in IWriteData class:\
    \ void Write(int value) = 0; You do not need to make a class purely abstract;\
    \ you can implement member functions or include member data common to all instances\
    \ of the class. If a class has even one pure virtual function, then it is considered\
    \ an abstract class.\n\nVisual C++ provides a [Microsoft-specific way to define\
    \ an interface](#). Here's the equivalent of IWriteData using the Microsoft syntax:\n\
    \n# ### Sample: AbstractClassSampleIWriteData.h\n\n```\n```cpp\n#pragma once\n\
    \ninterface IWriteData\n{\n    virtual void Write(const wchar_t* value) = 0;\n\
    \    virtual void Write(double value) = 0;\n    virtual void Write(int value)\
    \ = 0;\n\n    virtual void WriteLine(void) = 0;\n    virtual void WriteLine(const\
    \ wchar_t* value) = 0;\n    virtual void WriteLine(double value) = 0;\n    virtual\
    \ void WriteLine(int value) = 0;\n};\n```\n```\n\nRather than define it as a class,\
    \ you define it using the __interface keyword. You cannot define a constructor,\
    \ a destructor, or any member functions other than pure virtual member functions.\
    \ You also cannot inherit from anything other than other interfaces. You do not\
    \ need to include the public access specifier since all member functions are public.\n\
    \n# ## Precompiled Header Files\n\nA precompiled header file is a special type\
    \ of header file. Like a normal header file, you can stick both include statements\
    \ and code definitions in it. What it does differently is help to speed up compile\
    \ times."
