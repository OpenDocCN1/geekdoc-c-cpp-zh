- pgno: 11
  md: "```\n```cpp\n#include <tchar.h>\n\nint _tmain(int argc, _TCHAR* argv[])\n{\n\
    \    // Your program starts here.\n\n    // Returning 0 signifies success.\n \
    \   return 0;\n}\n```\n```\n\nThe Windows SDK provides the tchar.h header file,\
    \ which you can (and should) use when you need to build a project that will be\
    \ used on both Unicode and non-Unicode versions of Windows. I do not use it in\
    \ the samples because, to the extent possible, I wanted to make the samples portable\
    \ and standards-compliant.\n\nInstead, I have written a small header file, pchar.h,\
    \ which simplifies the entry-point portability issue. This does not solve most\
    \ portability issues that crop up when dealing with strings; unfortunately, string\
    \ portability is one area which simply isn't easy in C++. Indeed, my header file\
    \ here is not a good example of what to do when you actually need the command-line\
    \ arguments. We will discuss strings in much more detail later in the book. For\
    \ now, first, here's the header file:\n\n# ### Sample: pchar.h\n\n```\n```cpp\n\
    #pragma once\n\n#if !defined( _PCHAR_H )\n#define _PCHAR_H 1\n\n#if defined(WIN32)\
    \ && defined(UNICODE)\n#define _pmain wmain\n#define _pchar wchar_t\n#else\n#define\
    \ _pmain main\n#define _pchar char\n#endif\n\n#endif\n```\n```\n\nSecond, here's\
    \ what the entry point now looks like (I have omitted the inclusion of the header\
    \ file here):\n\n```\n```cpp\nint _pmain(int /*argc*/, _pchar* /*argv*/[])\n{\n\
    \    // Your program starts here.\n\n    // Returning 0 signifies success.\n \
    \   return 0;\n}\n```\n```\n\nAs you can see, the parameter names are commented\
    \ out (using the C-style comment, i.e. /*...*/). This is perfectly legal in C++\
    \ and is something you should do whenever you have a function that is required\
    \ to have certain parameters, although you may not intend to use those parameters.\
    \ By commenting out the parameter names, you ensure that you will not accidentally\
    \ use them."
