- pgno: 52
  md: '> **Note:** The `auto` keyword used to be a way of explicitly selecting automatic
    storage duration. In C++11, that usage was removed. It now is the equivalent of
    the `var` keyword in C#. If you try to compile something using the old meaning
    of `auto`, you''ll receive a compiler error since `auto` as a type specifier must
    be the only type specifier.


    # ## Dynamic Duration


    Dynamic duration is the result of using either the new operator or the new []
    operator. The new operator is used to allocate single objects, while the new []
    operator is used to allocate dynamic arrays. You must keep track of the size of
    a dynamically allocated array. While the C++ implementation will properly free
    a dynamically allocated array, provided you used the delete [] operator, there
    is no easy or portable way to determine the size of that allocation. It will likely
    be impossible. Single objects are freed with the delete operator.


    When you allocate memory using new or new [], the return value is a pointer. A
    pointer is a variable that holds a memory address. In C#, if you set all your
    references to an object to null or some other value, then the memory is no longer
    reachable in your program, so the GC can free that memory for other uses.


    In C++, if you set all of your pointers to an object to nullptr or some other
    value, and you cannot figure out the original address using pointer arithmetic,
    then you have lost your ability to release that memory using the delete or delete[]
    operators. You have thereby created a memory leak. If a program leaks enough memory,
    eventually it will crash because the system will run out of memory addresses for
    it. Even before that, though, the computer will slow horribly, as it is forced
    to increase paging to accommodate the ever-increasing memory footprint of your
    program (assuming it has virtual memory, which is absent from most smart phones).


    > **Note:** A const pointer, such as `someStr` in the statement `const wchar_t*
    someStr = L"Hello World!";` is not a dynamic duration pointer. That memory is
    just part of the program itself. If you try to call `delete` or `delete[]` on
    it, the program will simply crash. A string is an array of characters, however,
    so if it were okay to delete it, then the `delete[]` operator would be the correct
    one to use.


    When dealing with dynamic memory, to eliminate potential leaks and limit the possibility
    of other related bugs, you should always use a smart pointer such as `std::unique_ptr`
    or `std::shared_ptr`. We will discuss these in the chapter that covers pointers.


    # ## Thread Duration


    Thread duration is the least commonly used storage duration. It has only recently
    been standardized. As of this writing, few, if any, C++ compiler vendors have
    implemented support for the new `thread_local` keyword from the C++11 standard.


    This is certain to change, but for now you can use vendor-specific extensions
    such as the Microsoft-specific extension `__declspec(thread)` or the GCC-specific
    extension `__thread` if you need functionality of this sort.


    Thread duration is similar to static duration except instead of lasting the life
    of the program, these variables are local to each thread; the thread''s copy exists
    for the duration of the thread. Each thread''s instance of a thread duration object
    is initialized when it is first used in the thread, and it is destroyed when the
    thread exits. A thread duration object does not inherit its value from the thread
    that started the thread it exists in.'
