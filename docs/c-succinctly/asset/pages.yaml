- pgno: 25
  md: "Global variables are bad. Avoid them whenever possible. There is a common convention\
    \ when using them in C++, which is to prefix the variable name with g_, as in\
    \ the previous example. While this helps to alert you and other programmers to\
    \ the fact that this is a global variable, it does not change the fact that it\
    \ is a global variable, having all the problems I described. This isn’t a book\
    \ on bad programming practices, so I’m not going to spend time explaining [why\
    \ global variables are bad](#). All you need to know is this feature exists in\
    \ C++, but you should avoid using it whenever possible.\n\n# The Scope Resolution\
    \ Operator `::`\n\nIn C++, `::` is the scope resolution operator. It is used for\
    \ separating nested namespaces, for separating types from their namespace, and\
    \ for separating member functions and variables from their type.\n\nNote that\
    \ it is only used in the last situation when performing the following:\n\n+  \
    \ - Defining a member function.\n+   - Accessing a member of a base class within\
    \ a member function definition.\n+   - Accessing a static member function or variable.\n\
    +   - Assigning a value to a static member variable.\n+   - Fetching the address\
    \ of a member function.\n\nIn other instances, you use either the `.` operator\
