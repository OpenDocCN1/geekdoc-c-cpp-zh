  md: '# std::move


    The std::move function helps you write move constructors and move assignment operators.
    It’s in the <utility> header file. It takes a single argument and returns it in
    a condition suitable for moving. The object passed in will be returned as an rvalue
    reference, unless move semantics were disabled for it, in which case you will
    get a compiler error.


    # Move Assignment Operator


    Whenever you write a move constructor for a class, you should also write a move
    assignment operator. The result of this operator should be that the returned value
    contains all the data of the old class. A proper move assignment operator can
    be called from your move constructor in order to avoid code duplication.


    A move assignment operator should have the following declaration: SomeClass& operator=(SomeClass&&);.


    # Removing Copy or Move Semantics


    If you need to remove copy or move semantics, there are two ways to do this. First,
    to remove copy semantics, you can declare the copy constructor and copy assignment
    operator as private and leave them unimplemented. C++ only cares about an implementation
    of a function if you attempt to use it. By doing this, any attempt to compile
    a program that is trying to use copy semantics will fail, producing error messages
    saying you are trying to use a private member of the class and there is no implementation
    for it (if you accidentally use it within the class itself). The same pattern
    of making the constructor and assignment operator private works equally well for
    move semantics.


    The second way is new to C++11 and is currently unsupported by Visual C++ as of
    Visual Studio 2012 RC. With this way, you would declare the functionality as explicitly
    being deleted. For example, to explicitly delete a copy constructor, you would
    write SomeClass(const SomeClass&) = delete;. The same = delete syntax applies
    to assignment operators, the move constructor, and any other functionality. However,
    until Visual C++ supports it, you will need to stick with the first way.


    # Destructors and Virtual Destructors


    Any class serving as the base class of another class should have a virtual destructor.
    You declare a virtual destructor using the virtual keyword, (e.g.,: virtual ~SomeClass(void);).
    This way, if you cast an object down to one of its subclasses, and then subsequently
    destroy the object, the proper constructor will be called, ensuring that all of
    the resources the subclass had captured are freed.


    Proper destructors are critical to the RAII idiom, which we will explore shortly.
    You should never allow an exception to be thrown in a destructor unless you catch
    and handle that exception within the destructor. If there is an exception you
    cannot handle, you should perform safe error logging and then exit from the program.
    You can use the std::terminate function in the <exception> header file to invoke
    the current terminate handler. By default, the terminate handler invokes the abort
    function from the <cstdlib> header. We will discuss this functionality further
    in our exploration of C++ Standard Library exceptions.


    # Operator Overloading


    Operator overloading is a powerful, advanced feature of C++. You can overload
    operators on a per-class basis or globally with a stand-alone function. Almost
    every operator in C++ can be overloaded. We will see examples of overloading the
    copy assignment, move assignment, &, |, and |= operators shortly. For a list of
    other operators you can overload, and how such overloads work, I recommend visiting
    the MSDN documentation on the subject. It’s a useful feature, but one you may
    not commonly use. Looking it up when you need it is often faster than trying to
    memorize it right away.'
