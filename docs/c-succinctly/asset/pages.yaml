  md: "The release member function also returns the stored pointer, but release invalidates\
    \ the unique_ptr in the process by replacing the stored pointer with a null pointer.\
    \ If you have a function where you want to create a dynamic object and then return\
    \ it, while still maintaining exception safety, use std::unique_ptr to store the\
    \ dynamically created object, and then return the result of calling release. This\
    \ gives you exception safety while allowing you to return the dynamic object without\
    \ destroying it with the std::unique_ptr's destructor when the control exits from\
    \ the function upon returning the released pointer value at the end.\n\nThe swap\
    \ member function allows two unique pointers to exchange their stored pointers,\
    \ so if A is holding a pointer to X, and B is holding a pointer to Y, the result\
    \ of calling A::swap(B); is that A will now hold a pointer to Y, and B will hold\
    \ a pointer to X. The deleters for each will also be swapped, so if you have a\
    \ custom deleter for either or both of the unique pointers, be assured that each\
    \ will retain its associated deleter.\n\nThe reset member function causes the\
    \ object pointed to by the stored pointer, if any, to be destroyed in most cases.\
    \ If the current stored pointer is null, then nothing is destroyed. If you pass\
    \ in a pointer to the object that the current stored pointer points to, then nothing\
    \ is destroyed. You can choose to pass in a new pointer, nullptr, or call the\
    \ function with no parameters. If you pass in a new pointer, then that new object\
    \ is stored. If you pass in nullptr, then the unique pointer will store null.\
    \ Calling the function with no parameters is the same as calling it with nullptr.\n\
    \n# std::shared_ptr\n\nThe shared pointer, std::shared_ptr, is designed to hold\
    \ a pointer to a dynamically allocated object and to keep a reference count for\
    \ it. It is not magic; if you create two shared pointers and pass them each a\
    \ pointer to the same object, you will end up with two shared pointers—each with\
    \ a reference count of 1, not 2. The first one that is destroyed will release\
    \ the underlying resource, giving catastrophic results when you try to use the\
    \ other one or when the other one is destroyed and tries to release the already\
    \ released underlying resource.\n\nTo use the shared pointer properly, create\
    \ one instance with an object pointer and then create all other shared pointers\
    \ for that object from an existing, valid shared pointer for that object. This\
    \ ensures a common reference count, so the resource will have a proper lifetime.\
    \ Let's look at a quick sample to see the right and wrong ways to create shared_ptr\
    \ objects.\n\n**Sample: SharedPtrSample\\\\SharedPtrSample.cpp**\n\n```\n```cpp\n\
    #include <memory>\n#include <iostream>\n#include <ostream>\n#include \"../pchar.h\"\
    \n\nusing namespace std;\n\nstruct TwoInts\n{\n        TwoInts(void) : A(), B()\
    \ { }\n        TwoInts(int a, int b) : A(a), B(b) { }\n        int A;\n      \
    \  int B;\n};\n\nwostream& operator<<(wostream& stream, TwoInts* v)\n{\n     \
    \   stream << v->A << L\" \" << v->B;\n        return stream;\n}\n```\n```"
