- pgno: 28
  md: '+   5. Once everything has been linked successfully, the linker binds everything
    together and outputs the finished product (typically either an executable program
    or a library file).


    An error during any of those phases will stop the build process, of course, and
    the previous description is only a rough sketch of the Visual C++ build chain.
    Compiler authors have some flexibility in exactly how they do things. For example,
    there’s no requirement that any intermediate files be produced, so in theory,
    the whole build process could be done in memory, though in practice, I doubt anyone
    would ever do that. So consider that list as just a rough outline, not an exact
    description.


    I’ve been referring to everything as source files to keep the terminology simple.
    Within the C++ standard, these combinations of a source file plus all of its include
    files is referred to as a compilation unit. I mention that now only because I
    will be using the term a bit further along. Let’s consider the three build phases
    in turn.


    The preprocessor doesn’t care about C++ declarations and definitions. Indeed,
    it doesn’t even care if your program is in C++. The only business it has with
    your source files is to take care of all lines that begin with a #, thus marking
    them as preprocessor directives. As long as those lines are properly formed, and
    it can find all of the included files, if any, the preprocessor will do its work,
    adding and removing text as directed. It will pass the results on to the compiler,
    typically without writing its result out to a file since compilation immediately
    follows preprocessing.


    The compiler does care about declarations and definitions and very much is concerned
    with whether your program is valid C++ code or not. However, it doesn’t need to
    know what a function does when it comes across it. It just needs to know what
    the function signature is—such as int AddTwoNumbers(int, int);.


    The same is true for classes, structures, and unions; as long as the compiler
    knows the declaration (or in the case of a pointer, simply that the particular
    token is a class, a structure, a union, or an enum), then it doesn’t need any
    definitions. With just the declaration, it knows if your call to AddTwoNumbers
    is syntactically correct and that the class Vehicle; is in fact a class, so it
    can create a pointer to it when it sees Vehicle* v;, which is all it cares about.


    The linker does care about definitions. Specifically, it cares that there is one,
    and only one, definition matching each of the declarations in your project. The
    lone exception is inline functions, which end up being created in each compilation
    unit in which they are used. However, they are created in a way that avoids any
    issues with multiple definitions.


    You can have duplicate declarations among the compilation units for your program;
    doing so is a common trick for improving build times, as long as only one definition
    matches a declaration (except for inlines). In order to ensure this one definition
    rule is met, C++ compilers tend to use something called name mangling.


    This ensures each declaration is matched up with its proper definition, including
    issues such as overloaded functions and namespaces (which allow the same name
    to be reused if the uses are in different namespaces), and class, structure, union,
    and enum definitions nested within classes, structures, or unions.


    This name mangling is what results in terrifying linker errors, which we will
    see an example of in the [“Inline Member Functions”](#) section.


    The severability of declarations from definitions lets you build your C++ projects
    without recompiling each source file every time. It also lets you build projects
    that use libraries for which you do not have the source code. There are, of course,
    other ways to accomplish those goals ([C# uses a different build process](#) for
    instance). This is the way C++ does it; understanding that basic flow helps make
    sense of many peculiarities in C++ that you do not encounter in C#.'
