    \n        switch (data.Type)\n        {\n        case SomeValueDataType::Int:\n\
    \                std::wcout << L\"Int data is \" << data.Value.iData << L\",\"\
    \ \n                        << std::endl;\n                break;\n        case\
    \ SomeValueDataType::Float:\n                std::wcout << L\"Float data is \"\
    \ << data.Value.fData << L\"F,\" \n                        << std::endl;\n   \
    \             break;\n        case SomeValueDataType::Double:\n              \
    \  std::wcout << L\"Double data is \" << data.Value.dData << L\",\" \n       \
    \                 << std::endl;\n                break;\n        default:\n  \
    \              std::wcout << L\"Data type is unknown.\" << std::endl;\n      \
    \          break;\n        }\n        return 0;\n}\n```\n```\n\nAs you can see,\
    \ we define an enum that has members representing each of the types of members\
