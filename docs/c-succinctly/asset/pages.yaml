    \nIn this case, we can eliminate all three of those include statements. Why? Because\
    \ to compile this class definition, the compiler just needs to know the type of\
    \ SomeClassA and the underlying data types of Flavor and Toppings. We can tell\
    \ the compiler all of this with forward declarations.\n\n```\n```cpp\n#pragma\
    \ once\n\nclass SomeClassA;\nenum class Flavor;\nenum Toppings : int;\n\nclass\
    \ SomeClassB\n{\npublic:\n    SomeClassB(void);\n    ~SomeClassB(void);\n\n  \
