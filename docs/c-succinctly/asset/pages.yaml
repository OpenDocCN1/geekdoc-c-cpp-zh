    \    return 0;\n}\n~~~\n```\n\n***Note:*** *Many of the member functions in the\
    \ previous sample are declared as const by including the const keyword after the\
    \ parameter list in the declaration. This notation is part of the concept of const-correctness,\
    \ which we will discuss elsewhere. The only thing that the const-member-function\
    \ notation means is that the member function is not changing any member data of\
    \ the class; you do not need to worry about side effects when calling it in a\
    \ multi-threading scenario. The compiler enforces this notation so you can be\
    \ sure a function you mark as const really is const.*\n\nThe previous sample demonstrates\
    \ the difference between virtual member functions and non-virtual member functions.\
    \ The Id function in class A is non-virtual while the VirtId function is virtual.\
    \ The result is that when creating a base class reference to NonVirtualClass and\
