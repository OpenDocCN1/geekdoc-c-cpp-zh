  md: "The precompiled header will be compiled the first time you build your program.\
    \ From then on, as long as you don't make changes to the precompiled header, or\
    \ to anything included directly or indirectly in the precompiled header, the compiler\
    \ can reuse the existing compiled version of the precompiled header. Your compile\
    \ times will speed up because a lot of code (e.g., Windows.h and the C++ Standard\
    \ Library headers) will not be recompiled for each build.\n\nIf you use a precompiled\
    \ header file, you need to include it as the first include statement of every\
    \ source code file. You should not, however, include it in any header files. If\
    \ you forget to include it, or put other include statements above it, then the\
    \ compiler will generate an error. This requirement is a consequence of how precompiled\
    \ headers work.\n\nPrecompiled header files are not part of the C++ standard.\
    \ Their implementation depends on the compiler vendor. If you have any questions\
    \ about them, you should look at the compiler vendor's documentation and make\
    \ sure to specify which compiler you are using if you ask in an online forum.\n\
    \n# # Forward Declarations\n\nAs we've discussed, when you include a header file,\
    \ the preprocessor simply takes all the code and inserts it right into the source\
    \ code file that it is currently compiling. If that header file includes other\
    \ header files, then all of those come in too.\n\nSome header files are huge.\
    \ Some include many other header files. Some are huge and include many other header\
    \ files. The result is that a lot of code can wind up being compiled again and\
    \ again simply because you include a header file in another header file.\n\nOne\
    \ way to avoid the need to include header files within other header files is to\
    \ use forward declarations. Consider the following code:\n\n```\n```cpp\n#pragma\
    \ once\n\n#include \"SomeClassA.h\"\n#include \"Flavor.h\"\n#include \"Toppings.h\"\
    \n\nclass SomeClassB\n{\npublic:\n    SomeClassB(void);\n    ~SomeClassB(void);\n\
    \n    int GetValueFromSomeClassA(\n        const SomeClassA* value\n        );\n\
    \n    bool CompareTwoSomeClassAs(\n        const SomeClassA& first,\n        const\
    \ SomeClassA& second\n        );\n\n    void ChooseFlavor(\n        Flavor flavor\n\
    \        );\n\n    void AddTopping(\n        Toppings topping\n        );\n};\n\
    ```\n```"
