- pgno: 36
  md: '![](img/e4d68f5a79326a8404dad75080806b64_36_0.png)


    *Figure 1: The result of leaving the `inline` keyword off of the `Vehicle::GetVehicleCondition`
    member function.*


    Linker errors are always horrible looking, by the way. The reason is that the
    linker no longer knows what your variables and functions were named in the source
    file. It only knows what the compiler transformed those names into in order to
    make all the names unique. This includes overloaded methods, which need a unique
    name at the linking stage so the linker can connect a call to an overloaded member
    function to the correct overloaded version of that function.


    The errors in Figure 1 are simply telling us that we defined `Inventory::Vehicle::GetVehicleCondition(void)`
    more than once. Now, we know we only defined it once, just in the header file,
    but we have included the header file in both **Vehicle.cpp** and in **Main.cpp**
    in the **SimpleClassSample** project.


    Since we intentionally forgot to add the `inline` keyword to the `Vehicle::GetVehicleCondition`
    function declaration, the compiler doesn’t make the code inline. Instead, it compiles
    it as a function in both **Main.cpp** and **Vehicle.cpp**.


    This, of course, is something the compiler is fine with because it treats each
    source file as a unique compilation unit. The compiler doesn’t know any better,
    since, by the time the code reaches it, the code has already been inserted by
    the preprocessor stage. Only when the linker gets all the compiled code and tries
    to match everything up do we reach a phase where the build process says, “Hey,
    I already have another version of this function!” and then fails.


    As you can see, there are two ways of making member functions inline. Both must
    be done within the header file since the compiler will evaluate the header-file
    code as many times as they are included, but it will only run through source files
    once. If you use the second method and forget an inline keyword, then you will
    have horrible linker errors. If you use the second method and remember the inline
    keyword, but define the functions within the source file, you will get horrible
    linker errors—this time saying there is no definition.


    > **Tip:** Don’t try to make everything inline. You will just end up with slow
    compile times that kill your productivity. Do inline things that make sense, like
    simple getter and setter functions for member variables. Like anything else, profile
    first, and then optimize if needed.


