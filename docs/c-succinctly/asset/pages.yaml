- pgno: 44
  md: 'The same is true for VirtualClass, of course. Though the sample is careful
    to always specify virtual and override the defaults of VirtId (and you should
    be too), as long as A::VirtId is declared as being virtual, then all derived classes
    with the same signature will be considered virtual overrides of VirtId.


    The previous sample also demonstrates the diamond problem that multiple-inheritance
    can produce as well as how virtual inheritance solves it. The diamond problem
    moniker comes from the idea that if class Z derives from class X and class Y,
    which both derive from class W, a diagram of this inheritance relationship would
    look like a diamond. Without virtual inheritance, the inheritance relationship
    does not actually form a diamond; instead, it forms a two-pronged fork with each
    prong having its own copy of W.


    NonVirtualClass has non-virtual inheritance from B1, which has virtual inheritance
    from A, and from B3, which has non-virtual inheritance from A. This results in
    a diamond problem, with two copies of the A class’ member data becoming a part
    of NonVirtualClass’ member data. DemonstrateNonVirtualInheritance function shows
    the problems that result from this and also shows the syntax used to resolve which
    A you want when you need to use one of A’s members.


    VirtualClass has virtual inheritance from both B1, which has virtual inheritance
    from A, and from B2, which also has virtual inheritance from A. Since all the
    inheritance chains that go from VirtualClass to A are virtual, there is only one
    copy of A’s data; thus, the diamond problem is avoided. DemonstrateVirtualInheritance
    function shows this.


    Even with virtual inheritance, VirtualClass still has one ambiguity. B1::Conflict
    and B2::Conflict both have the same name and same parameters (none, in this case),
    so it is impossible to resolve which one you want without using the base-class-specifier
    syntax.


    Naming is very important when dealing with multiple-inheritance if you wish to
    avoid ambiguity. There is, however, a way to resolve ambiguity. The two commented-out
    using declarations in NonVirtualClass demonstrate this resolution mechanism. If
    we decided we wanted to always resolve an ambiguity in a certain way, the using
    declaration lets us do that.


    ![](img/e4d68f5a79326a8404dad75080806b64_44_0.png)


    > > *Note: The using declaration is useful for resolving ambiguity outside of
    a class too (within a namespace or a function, for instance). It is also useful
    if you wish to bring only certain types from a namespace into scope without bringing
    the entire namespace into scope with a using namespace directive. It is okay to
    use a using declaration within a header, provided it is inside a class, structure,
    union, or function definition, since using declarations are limited to the scope
    in which they exist. You should not use them outside of these since you would
    be bringing that type into scope within the global namespace or within whatever
    namespace you were in.*


    One thing I did not touch on in the sample is inheritance access specifiers other
    than public. If you wanted, you could write something like class B : protected
    class A { ... }. Then class A’s members would be accessible from within B’s methods,
    and accessible to any class derived from B, but not publicly accessible. You could
    also say class B : private class A { ... }. Then class A’s members would be accessible
    from within B’s methods, but not accessible to any class derived from B, nor would
    they be publicly accessible.


    I mention these in passing simply because they are rarely used. You might, nonetheless,
    come across them, and you may even find a use for them. If so, remember that a
    class that privately inherits from a base class still has full access to that
    base class; you are simply saying that no further-derived classes should have
    access to the base class’ member functions and variables.


    More common, you will come across mistakes where you or someone else forgot to
    type public before a base class specifier, resulting in the default private inheritance.
    You will recognize this by the slew of error messages telling you that you can’t
    access private member functions or data of some base class, unless you are writing
    a library and don’t test the class. In that case, you will recognize the issue
    from the angry roars of your users. One more reason unit testing is a good idea.'
