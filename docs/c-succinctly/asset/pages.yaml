  md: "# # Choosing the Right Storage Duration\n\nAutomatic storage duration is usually\
    \ the right form of storage duration for objects, unless you need them to survive\
    \ the scope they were created in. If that is the case, you should pick one of\
    \ the remaining storage durations that best fits your needs.\n\n+   - If the object\
    \ should exist for the whole length of the program’s execution, use static storage\
    \ duration.\n+   - If the object should exist for the whole length of a particular\
    \ thread, use thread storage duration.\n+   - If the object will only exist for\
    \ part of the program or thread’s duration, use dynamic storage duration.\n\n\
    You can deviate from those recommendations if doing so makes sense, but in most\
    \ cases, this guidance will steer you correctly.\n\n# ## Storage Duration Sample\n\
    \nThe following sample is intended to help clarify these concepts. The sample\
    \ is heavily documented, so no additional commentary is included. I strongly encourage\
    \ you to build and run this particular sample. Seeing the output while stepping\
    \ through the code will help you grasp these concepts more easily than simply\
    \ reading the code.\n\n**Sample: StorageDurationSample\\SomeClass.h**\n\n```\n\
    ```cpp\n#pragma once\n#include <string>\n#include <memory>\n\nclass SomeClass\n\
    {\npublic:\n    explicit SomeClass(int value = 0);\n\n    SomeClass(\n       \
    \ int value,\n        const wchar_t* stringId\n    );\n\n    ~SomeClass(void);\n\
    \n    int GetValue(void) { return m_value; }\n\n    void SetValue(int value) {\
    \ m_value = value; }\n\n    static std::unique_ptr<SomeClass> s_someClass;\n\n\
    private:\n    int                 m_value;\n    std::wstring        m_stringId;\n\
    };\n```\n```\n\n**Sample: StorageDurationSample\\SomeClass.cpp**\n\n```\n```cpp\n\
    #include \"SomeClass.h\"\n#include <string>\n#include <memory>\n```\n```"
