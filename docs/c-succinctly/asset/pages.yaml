  md: "```\n```cpp\nvoid RemoveTopping(\n    Toppings topping\n);\n\nprivate:\n  \
    \  Toppings             m_toppings;\n    Flavor               m_flavor;\n\n  \
    \  // Other member data and member functions...\n};\n```\n```\n\nWe’ve included\
    \ the **SomeClassA.h**, **Flavor.h**, and **Toppings.h** header files. SomeClassA\
    \ is a class. Flavor is a scoped enum (specifically an enum class). Toppings is\
