  md: "```\n~~~cpp\ncase Chocolate:\n    flavor = L\"Chocolate\";\n    break;\ncase\
    \ Strawberry:\n    flavor = L\"Strawberry\";\n    break;\ncase Mint:\n    flavor\
    \ = L\"Mint\";\n    break;\ndefault:\n    break;\n}\n\nstd::wcout << L\"Flavor\
    \ is \" << flavor.c_str() << L\" (\" << f <<\n    L\"). Color is \" << color.c_str()\
    \ << L\" (\" <<\n    static_cast<int>(color) << L\").\" << std::endl;\n    L\"\
    The size of Flavor is \" << sizeof(Flavor) <<\n    L\", \" << std::endl;\n   \
    \ L\"The size of Color is \" << sizeof(Color) <<\n    L\".\" << std::endl;\n\n\
    return 0;\n}\n~~~\n```\n\n> > **Note:** In C++, the scope resolution operator\
    \ is `::`. We’ll discuss this in more detail later on. For now, just think of\
    \ it as serving many of the same purposes as the `.` operator in C#.\n\nThis code\
    \ will give the following output:\n\n```\n~~~text\nFlavor is Mint (3). Color is\
    \ Orange (1).\nThe size of Flavor is 2.\nThe size of Color is 4.\n~~~\n```\n\n\
    As you can see in the sample, the scoped Color enumeration requires you to access\
    \ its members in the same way as C# by prefixing the enumeration member with the\
    \ enumeration’s name and the scope resolution operator. By contrast, the un-scoped\
    \ Flavor enumeration allows you simply to specify the members without any prefix.\
    \ For this reason, I think it’s better to practice to prefer scoped enumerations:\
    \ You minimize the risks of naming collisions and lessen namespace pollution.\n\
    \nNotice that there is another difference with scoped enumerations: When we wanted\
    \ to output the numerical value of the scoped Color enum, we had to use the static_cast\
    \ operator to convert it to an int, while we did not need to do any casting for\
    \ the un-scoped Flavor enumeration.\n\nFor the Flavor enumeration, we specified\
    \ the underlying type as being an unsigned short int. You can also specify the\
    \ underlying type for scoped enumerations. Specifying the underlying type is optional,\
    \ but is mandatory if you wish to use forward declaration with an un-scoped enumeration.\
    \ Forward declaration is a way to speed up program compile times by only telling\
    \ the compiler what it needs to know about a type rather than forcing it to compile\
    \ the whole header file the type is defined in.\n\nWe will look at this later\
    \ on. For now, just remember that an un-scoped enumeration must have its underlying\
    \ type explicitly specified in order to use a forward declaration of it; a scope\
    \ enumeration does not require specification of its underlying type to use a forward\
    \ declaration of it (the underlying type will be int if none is specified)."
