    # Volatile


    I mention volatile only to caution against using it. Like const, a variable can
    be declared volatile. You can even have a const volatile; the two are not mutually
    exclusive.


    Here’s the thing about volatile: It likely does not mean what you think it means.
    For example, [it is not good for multithreaded programming](https://). The actual
    use case for volatile is extremely narrow. Chances are, if you put the volatile
    qualifier on a variable, you are doing something horribly wrong.


    Eric Lippert, a member of the C# language team at Microsoft, described the use
    of volatile as, “A sign that you are doing something downright crazy. You’re attempting
    to read and write the same value on two different threads without putting a lock
    in place.” He’s right, and his argument carries over perfectly into C++.


    The use of volatile should be greeted with more skepticism than the use of goto.
    I say this because I can think of at least one valid general-purpose use of goto:
    breaking out of a deeply nested loop construct upon the completion of a non-exceptional
    condition. volatile, by contrast, is really only useful if you are writing a device
    driver or writing code for some type of ROM chip. On that point, you really should
    be thoroughly familiar with the ISO/IEC C++ Programming Language Standard itself,
    the hardware specs for the execution environment your code will be running in,
    and probably the ISO/IEC C Language Standard too.


    > > **Note: You should also be familiar with assembly language for the target
    hardware, so you can look at code that is generated and [make sure the compiler
    is generating correct code (PDF)](https://) for your use of volatile.**


    I have been ignoring the existence of the volatile keyword and shall continue
    to do so for the remainder of this book. This is perfectly safe, since:


    +   - It’s a language feature that doesn’t come into play unless you actually
    use it.

    +   - Its use can safely be avoided by virtually everyone.


    One last note about volatile: The one effect it is very likely to produce is slower
    code. Once upon a time, people thought volatile produced the same result as atomicity.
    It doesn’t. When properly implemented, atomicity guarantees that multiple threads
    and multiple processors cannot read and write'
