- pgno: 34
  md: '# ## Member Functions


    As discussed earlier, member functions are part of a class, structure, or union.
    Simply, I will talk about them as class members from here on.


    Static member functions can call other static class member functions, regardless
    of protection level. Static member functions can also access static class member
    data either explicitly (i.e. `SomeClass::SomeFloat = 20.0f;`) or implicitly (i.e.
    `SomeFloat = 20.0f;`), regardless of protection level.


    The explicit form is helpful if you have a parameter with the same name as a class
    member. Prefixing member data with an `m_`, such as `m_SomeFloat`, eliminates
    that problem and makes it clear when you are working with class member data versus
    local variables or parameters. That''s just a style choice, not a requirement.


    Instance (i.e. non-static) member functions are automatically assigned a `this`
    pointer to the instance data for the instance on which they were called. Instance
    member functions can call other class member functions and access all class member
    data either explicitly—the same as static members using `this->m_count++;` for
    instance data—or implicitly—the same as static and instance data (e.g., `m_data++`);,
    regardless of protection level.


    # ## Inline Member Functions


    In `SampleClass\Vehicle.h`, the `GetVehicleCondition` and `GetBasis` member functions
    are both declared and defined. This combination of declaration and definition
    is called an inline member function in C++. Since this is similar to writing methods
    in C#, it might be inviting to do so in C++ as well. With some exceptions, you
    shouldn''t do this.


    As we discussed previously, when you build a C++ project, the compiler goes through
    each of your source files only once. It may make many passes at the same source
    files to optimize them, but it''s not going to come back again after it is finished.


    In contrast, the compiler will come back to your header files every time they
    are included in another file, regardless of whether it''s a source file or another
    header file. This means the compiler can end up running through the code in the
    header files many times, during a build.


    At the beginning of the `SampleClass\Vehicle.h` header file, you see the `#pragma
    once` directive. This is a useful and important line. If you include the header
    file `A.h` in a source file and then include another header file that has `A.h`,
    the `#pragma once` directive would tell the preprocessor not to include the contents
    of `A.h` again. This prevents the preprocessor from bouncing back and forth between
    two header files that include each other indefinitely. It also prevents compiler
    errors. If `A.h` was included multiple times, the compiler would fail when it
    reached a type definition from the second inclusion of `A.h`.


    Even with that directive, the compiler still needs to include and parse that header
    file code for each source file that includes it. The more things you put into
    your header file, the longer it takes to build each source file. This increases
    compilation time, which, as you will discover, can be quite lengthy with C++ projects
    when compared with C#.


    When you do include a member function''s definition inline in the header file,
    the C++ compiler can make that code inline in any source file where that function
    is used. This typically results in faster program executions since, rather than
    needing to make a call to a function, the program can simply run the code in place.


    Scope is preserved by the compiler, so you don''t need to worry about naming collisions
    between variables defined in the inline function and in a function where it is
    used. When dealing with code, such as the previous examples, where you are simply
    retrieving a member variable''s value, inline definitions can improve speed, especially
    if the code is executing within a loop.'
