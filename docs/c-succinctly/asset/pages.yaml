- pgno: 24
  md: "# # Chapter 2 Namespaces\n\n# ## The Global Namespace\n\nConsider the following\
    \ code:\n\n**Sample: GlobalNamespaceSample\\GlobalNamespaceSample.cpp**\n\n```\n\
    ```cpp\n#include <iostream>\n#include <ostream>\n#include \"../pch.h\"\n\nint\
    \ g_x = 10;\n\nint AddTwoNumbers(int a, int b)\n{\n        return a + b;\n}\n\n\
    int _pmain(int /*argc*/, _pchar* /*argv*/[])\n{\n        int y = 20;\n       \
    \ std::cout << L\"The result of AddTwoNumbers(g_x, y) where g_x = \" <<\n    \
    \            g_x << L\" and y = \" << y << L\" is \" << AddTwoNumbers(g_x, y)\
    \ <<\n                L\".\" << std::endl;\n\n        if (true == 1)\n       \
    \ {\n                std::cout << L\"true == 1!\" << std::endl;\n        }\n \
    \       return 0;\n}\n```\n```\n\nIn the previous sample, we define two functions,\
    \ AddTwoNumbers and _pmain. These two functions are both in the global namespace.\
    \ The global namespace is the base level in which everything else within the program\
    \ exists. C++, owing to its C heritage, allows you to define anything within the\
    \ global namespace (so you can define namespaces, classes, structures, variables,\
    \ functions, enums, and templates).\n\nC# also has the concept of a global namespace,\
    \ but it does not allow you to define anything within it other than namespaces\
    \ and types. In the previous example, we have the statement `int g_x = 10;` which\
    \ defines an integer named g_x within the global namespace and assigns it a value\
    \ of 10. This is what is commonly referred to as a global variable. In C# global\
    \ variables are illegal.\n\n> > **About functions**\n> >\n> > C++ lets you have\
    \ methods that are not part of a class. These are called functions. More particularly,\
    \ they are often called stand-alone functions since the C++ terminology for a\
    \ class method is a class member function. We will discuss functions in much more\
    \ detail in a later chapter.\n\nAs a brief aside, every programming language I\
    \ have ever worked with has had its share of bad features—things the language\
    \ allows, but things that usually lead to issues. These issues include hard-to-debug\
    \ problems, subtle errors that go unnoticed for a long time, maintainability problems,\
    \ readability problems, and all the other frustrating things that add many hours\
    \ to development time without any benefit. C++ is no different. When we come across\
    \ something that fits this description, I will do my best to call it out. This\
    \ is one of those times."
