- pgno: 38
  md: "C++ does not have a separate interface type. In general, multiple-inheritance\
    \ should be avoided except as a workaround for lack of a separate interface. In\
    \ other words, a class should have only zero or one real base class along with\
    \ zero or more purely abstract classes (interfaces). This is just a personal style\
    \ recommendation, though.\n\nThere are some good arguments for multiple-inheritance.\
    \ For instance, say you have three groups of functionality. Each one consists\
    \ of functions and data. Then say each group is unrelated to the other—there’s\
    \ no connection between them, but they aren’t mutually exclusive. In this case,\
    \ you may wish to put each functionality group into its own class. Then if you\
    \ have a situation where you want to create a class needing two of these groups,\
    \ or even all three, you can simply create a class that inherits from all three,\
    \ and you’re done.\n\nOr, you’re done as long as you didn’t have any naming conflicts\
    \ in your public and protected members’ functions and variables. For example,\
    \ what if all three of the functionality groups have a member function `void PrintDiagnostics(void);`?\
    \ You’d be doomed, yes? Well, it turns out that no, you are not doomed (usually).\
    \ You need to use some weird syntax to specify which base class `PrintDiagnostics`\
    \ function you want. And even then you aren’t quite done.\n\nC++ lets you specify\
    \ whether you want a class to be a plain base class or a virtual base class. You\
    \ do this by putting or not putting the keyword virtual before the class’ name\
    \ in the base class specifier. We’ll look at a sample shortly that addresses all\
    \ of this, but before we do, it’s important to understand that if you inherit\
    \ a class at least twice, and two or more of the inheritances are not virtual,\
    \ you will end up with multiple copies of that class’ data members\n\nThis causes\
    \ a whole bunch of problems when trying to specify which of those you wish to\
    \ use. Seemingly, the solution is to derive from everything virtually, but that\
    \ has a run-time performance hit associated with it due to how C++ implementations\
    \ tend to resolve virtual members. Better still, try to avoid having this ever\
    \ happen in the first place, but as that’s not always possible, do remember virtual\
    \ inheritance.\n\nAnd now a sample to help make this all make sense:\n\n# Sample:\
    \ InheritanceSample\\\\InheritanceSample.cpp\n\n```\n```cpp\n#include <iostream>\n\
    #include <ostream>\n#include <string>\n#include <typeinfo>\n#include \"../pchar.h\"\
    \n\nusing namespace std;\n\nclass A\n{\npublic:\n    A(void) : SomeInt(0) { }\n\
    \    virtual ~A(void) { }\n\n    const wchar_t* Id(void) const { return L\"A\"\
    ; }\n\n    virtual const wchar_t* VirtId(void) const { return L\"A\"; }\n\n  \
    \  int GetSomeInt(void) const { return SomeInt; }\n    int                 SomeInt;\n\
    };\n\nclass B1 : virtual public A\n```\n```"
