    One last note about volatile: The one effect it is very likely to produce is slower
    code. Once upon a time, people thought volatile produced the same result as atomicity.
    It doesn’t. When properly implemented, atomicity guarantees that multiple threads
    and multiple processors cannot read and write an atomically accessed chunk of
    memory at the same time. The mechanisms for this are locks, mutexes, semaphores,
    fences, special processor instructions, and the like. The only thing volatile
    does is force the CPU to fetch a volatile variable from memory rather than use
    any value it might have cached in a register or on a stack. It is the memory fetching
    that slows everything down.


