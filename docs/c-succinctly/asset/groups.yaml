    };\n```\n\n#pragma once 后面的三行告诉编译器它需要知道的一切。编译器被告知 SomeClassA 是一个类，因此它可以为链接目的确定其类型。编译器被告知\
    \ Flavor 是一个 enum class，因此它知道需要为 int 预留空间（enum class 的默认底层类型）。最后，编译器被告知 Toppings\
    \ 是一个底层类型为 int 的枚举，因此它也可以为其预留空间。\n\n如果 **SomeClassA.h**、**Flavor.h** 和 **Toppings.h**\
    \ 中这些类型的定义与这些前向声明不匹配，那么你会收到编译器错误。如果你希望 SomeClassA 实例作为 SomeClassB 的成员变量，或者希望直接将其作为参数传递而不是作为指针或引用传递，那么就需要包含\
