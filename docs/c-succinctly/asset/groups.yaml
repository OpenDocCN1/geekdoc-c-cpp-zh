  md: "\nproperly, so you should implement proper exception specifications if your\
    \ code needs to be compiled with another compiler.\n\n> **Note:** Exception specifications\
    \ using the `throw()` syntax (called dynamic-exception specifications) are deprecated\
    \ as of C++11. As such, they may be removed from the language in the future. The\
    \ `noexcept` specification and operator are replacements for this language feature\
    \ but are not implemented in Visual C++ as of Visual Studio 2012 RC.\n\nC++ functions\
    \ can specify via the `throw()` exception specification keyword whether or not\
    \ to throw exceptions, and if so, what kind to throw.\n\nFor example, `int AddTwoNumbers(int,\
    \ int) throw();` declares a function that, due to the empty parentheses, states\
    \ it does not throw any exceptions, excluding those it catches internally and\
    \ does not re-throw. By contrast, `int AddTwoNumbers(int, int) throw(std::logic_error);`\
    \ declares a function that states it can throw an exception of type `std::logic_error`,\
    \ or any type derived from that.\n\nThe function declaration `int AddTwoNumbers(int,\
    \ int) throw(...);` declares that it can throw an exception of any type. This\
    \ syntax is Microsoft-specific, so you should avoid it for code that may need\
    \ to be compiled with something other than the Visual C++ compiler.\n\nIf no specifier\
    \ appears, such as in `int AddTwoNumbers(int, int);`, then the function can throw\
    \ any exception type. It is the equivalent of having the `throw(...)` specifier.\n\
    \nC++11 added the `noexcept(bool expression)` specification and operator. Visual\
    \ C++ does not support these as of Visual Studio 2012 RC, but we will discuss\
    \ them briefly since they will undoubtedly be added in the future.\n\nThe specifier\
    \ `noexcept(false)` is the equivalent of both `throw(...)` and of a function without\
    \ a throw specifier. For example, `int AddTwoNumbers(int, int) noexcept(false);`\
    \ is the equivalent of both `int AddTwoNumbers(int, int) throw(...);` and `int\
    \ AddTwoNumbers(int, int);`.\n\nThe specifiers `noexcept(true)` and `noexcept`\
    \ are the equivalent of `throw()`. In other words, they all specify that the function\
    \ does not allow any exceptions to escape from it.\n\nWhen overriding a virtual\
    \ member function, the exception specification of the override function in the\
    \ derived class cannot specify exceptions beyond those declared for the type it\
    \ is overriding. Let’s look at an example.\n\n```cpp\n#include <stdexcept>\n#include\
    \ <exception>\n\nclass A\n{\npublic:\n        A(void) throw(...);\n        virtual\
    \ ~A(void) throw();\n\n        virtual int Add(int, int) throw(std::overflow_error);\n\
    \        virtual float Add(float, float) throw();\n        virtual double Add(double,\
    \ double) throw(int);\n};\n\nclass B : public A\n{\npublic:\n        B(void);\
    \ // Fine, since not having a throw is the same as throw(...).\n        virtual\
    \ ~B(void) throw(); // Fine since it matches ~A.\n\n        // The int Add override\
    \ is fine since you can always throw less in\n        // an override than the\
    \ base says it can throw.\n        virtual int Add(int, int) throw() override;\n\
    \n        // The float Add override here is invalid because the A version says\n\
    \        // it will not throw, but this override says it can throw an\n      \
    \  // std::exception.\n        virtual float Add(float, float) throw(std::exception)\
    \ override;\n\n        // The double Add override here is invalid because the\
    \ A version says\n        // it can throw an int, but this override says it can\
    \ throw a double,\n        // which the A version does not specify.\n        virtual\
    \ double Add(double, double) throw(double) override;\n};\n```\n\nBecause the throw\
    \ exception specification syntax is deprecated, you should only use the empty\
    \ parentheses form of it, throw(), in order to specify that a particular function\
    \ does not throw exceptions; otherwise, just leave it off. If you want to let\
    \ others know what exceptions your functions can throw, consider using comments\
    \ in your header files or in other documentation, making sure to keep them up-to-date.\n\
    \nnoexcept(bool expression) is also an operator. When used as an operator, it\
    \ takes an expression that will evaluate to true if it cannot throw an exception,\
    \ or false if it can throw an exception. Note that the result is a simple evaluation;\
    \ it checks to see if all functions called are noexcept(true), and if there are\
