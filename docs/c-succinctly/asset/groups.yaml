    \n由于可能发生泄漏，你绝不应在智能指针之外分配动态内存。C++ 标准库提供了两种你应该考虑的智能指针：`std::shared_ptr` 和 `std::unique_ptr`。\n\
    \n通过将动态存储期对象放入其中一种智能指针，你可以保证当 `std::unique_ptr` 或包含指向该内存的指针的最后一个 `std::shared_ptr`\
    \ 超出作用域时，内存将使用正确的 delete 版本（delete 或 `delete[]`）被正确释放，从而不会泄漏。这就是上一章中 RAII 模式的实际应用。\n\
    \n当你用智能指针正确实现 RAII 时，只可能发生两种情况：分配成功，因此当智能指针超出作用域时内存将被正确释放；或者分配失败，在这种情况下没有分配内存，因此也没有泄漏。实际上，最后一种情况在现代\
    \ PC 和服务器上应该相当罕见，因为它们拥有大内存并提供虚拟内存。\n\n如果你不使用智能指针，那你就是在自找内存泄漏。在用 `new` 或 `new[]`\
    \ 分配内存与用 `delete` 或 `delete[]` 释放内存之间出现的任何异常，都很可能导致内存泄漏。如果你不小心，你可能会意外地使用一个已经被删除但未被设置为\
    \ `nullptr` 的指针。然后你会访问内存中的某个随机位置，并将其当作有效指针来使用。\n\n在那种情况下，最好的结果就是程序崩溃。如果没有崩溃，那么你就在以奇怪、未知的方式破坏数据，并可能将这些损坏的数据保存到数据库或通过网络传输。你也可能为安全问题敞开大门。所以请使用智能指针，让语言为你处理内存管理问题。\n\
    \n## 常量指针\n\n常量指针的形式为 `SomeClass* const someClass2 = &someClass1;`。换句话说，`*` 位于\
    \ const 之前。结果是指针本身不能指向其他任何东西，但指针所指向的数据保持可变。在大多数情况下，这不太可能非常有用。\n\n## 指向常量的指针\n\n\
    指向常量的指针的形式为 `const SomeClass* someClass2 = &someClass1;`。在这种情况下，`*` 位于 const 之后。结果是指针可以指向其他东西，但你不能修改它所指向的数据。这是一种常见的方式，用于声明你只想检查而不修改其数据的参数。\n\
    \n"
