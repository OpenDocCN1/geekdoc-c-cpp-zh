    \ 类的其余代码应该很清楚。\n\n> **注意：** 虽然不要求你采用 **ClassName.h** 或 **ClassName.cpp** 的文件命名约定，但你几乎到处都会看到它被使用，因为它使代码的使用和维护更容易。\n\
    \n**VehicleCondition.h** 中的 **GetVehicleConditionString** 内联函数返回的是该函数中创建的 **std::wstring**\
    \ 的副本，而不是局部值本身。如果你来自 C#，可能会觉得这有点奇怪，因为没有使用 new 关键字。我们将在讨论存储持续时间的章节中讨论自动持续时间类型时探讨这一点。\n\
    \n入口点函数使用了 C++ 标准库的一些 I/O 格式化功能。\n\n### 成员函数\n\n如前所述，成员函数是类、结构体或联合体的一部分。简单来说，从这里开始，我将把它们作为类成员来讨论。\n\
    \n静态成员函数可以调用其他静态类成员函数，无论保护级别如何。静态成员函数还可以显式（即 `SomeClass::SomeFloat = 20.0f;`）或隐式（即\
    \ `SomeFloat = 20.0f;`）访问静态类成员数据，无论保护级别如何。\n\n如果有一个与类成员同名的参数，显式形式会很有帮助。为成员数据添加\
    \ `m_` 前缀，例如 `m_SomeFloat`，可以消除这个问题，并清楚表明你正在处理的是类成员数据而不是局部变量或参数。这只是一种风格选择，不是要求。\n\
    \n实例（即非静态）成员函数会自动获得一个 `this` 指针，指向调用它们的实例的实例数据。实例成员函数可以调用其他类成员函数，并访问所有类成员数据，无论是显式地——与静态成员使用\
    \ `this->m_count++;` 访问实例数据一样——还是隐式地——与静态和实例数据一样（例如 `m_data++`），无论保护级别如何。\n\n\
    ### 内联成员函数\n\n在 `SimpleClassSample\\Vehicle.h` 中，`GetVehicleCondition` 和 `GetBasis`\
    \ 成员函数都同时被声明和定义。这种声明与定义的组合在 C++ 中称为内联成员函数。由于这类似于在 C# 中编写方法，可能也会诱使你在 C++ 中这样做。除了一些例外情况，你不应该这样做。\n\
    \n正如我们之前讨论的，当你构建 C++ 项目时，编译器只会遍历每个源文件一次。它可能会对相同的源文件进行多遍处理以优化它们，但在完成后不会再回来。\n\n\
    相比之下，每当头文件被包含到另一个文件中时，编译器都会重新处理你的头文件，无论该文件是源文件还是另一个头文件。这意味着在一次构建过程中，编译器最终可能会多次遍历头文件中的代码。\n\
    \n在 `SimpleClassSample\\Vehicle.h` 头文件的开头，你会看到 `#pragma once` 指令。这是一行有用且重要的代码。如果你在某个源文件中包含头文件\
    \ `A.h`，然后又包含另一个包含 `A.h` 的头文件，`#pragma once` 指令会告诉预处理器不要再次包含 `A.h` 的内容。这可以防止预处理器在两个相互包含的头文件之间无限地来回跳转。它还可以防止编译器错误。如果\
    \ `A.h` 被多次包含，编译器在遇到第二次包含 `A.h` 时的类型定义时会失败。\n\n即使有了该指令，对于每个包含该头文件的源文件，编译器仍然需要包含并解析该头文件代码。你放入头文件的内容越多，构建每个源文件所需的时间就越长。这会增加编译时间；正如你将发现的，与\
    \ C# 相比，C++ 项目的编译时间可能相当长。\n\n当你确实在头文件中内联包含成员函数的定义时，C++ 编译器可以在任何使用该函数的源文件中将该代码内联。这通常会使程序执行更快，因为程序可以直接就地运行代码，而不需要进行函数调用。\n\
    \n编译器会保留作用域，因此你无需担心内联函数中定义的变量与其使用位置所在函数中的变量之间发生命名冲突。对于像前面示例那样只是检索成员变量值的代码，内联定义可以提高速度，尤其是在代码在循环中执行时。\n\
    \n"
