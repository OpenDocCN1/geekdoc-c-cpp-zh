  - "[PAGE 18]\n\nYou can do the same thing with enumerations in C++ as you can in\
    \ C# in terms of explicitly assigning values to members, and in terms of creating\
    \ flag enumerations. You do it all the same way, except you don’t need to apply\
    \ anything like the FlagAttribute in C# to create flag enumerations; you just\
    \ assign the correct values and proceed from there.\n\n# std::wcout, std::wcerr,\
    \ std::wcin\n\nThe std::wcout << L\"Flavor... code outputs wide character data\
    \ to the standard output stream. In the case of a console program such as this,\
    \ the standard output is the console window. There is also a std::wcerr output\
    \ stream, which will output wide character data to the standard error output stream.\
    \ This is also the console window, but you can redirect std::wcout output to one\
    \ file and std::wcerr output to another file. There is also a std::wcin for inputting\
    \ data from the console. We won’t explore this, nor will we explore their byte\
    \ counterparts: std::cout, std::cerr, and std::cin.\n\nJust to let you see how\
    \ the input looks, here’s an example.\n\n**Sample: ConsoleSample\\\\ConsoleSample.cpp**\n\
    \n```\n```cpp\n#include <iostream>\n#include <ostream>\n#include <string>\n#include\
    \ \"../pchar.h\"\n\nstruct Color\n{\n        float ARGB[4];\n\n        void A(float\
    \ value) { ARGB[0] = value; }\n        float A(void) const { return ARGB[0]; }\n\
    \        void R(float value) { ARGB[1] = value; }\n        float R(void) const\
    \ { return ARGB[1]; }\n        void G(float value) { ARGB[2] = value; }\n    \
    \    float G(void) const { return ARGB[2]; }\n        void B(float value) { ARGB[3]\
    \ = value; }\n        float B(void) const { return ARGB[3]; }\n};\n\n// This is\
    \ a stand-alone function, which happens to be a binary\n// operator for the <<\
    \ operator when used with a wostream on\n// the left and a Color instance on the\
    \ right.\nstd::wostream& operator<<(std::wostream& stream, const Color & c)\n\
    {\n        stream << L\"ARGB:{\" << c.A() << L\", \" << c.R() << L\", \"\n   \
    \            << c.G() << L\", \" << c.B() << L\"}\";\n        return stream;\n\
    }\n\nint _pmain(int /*argc*/, _pchar* /*argv*/[])\n{\n        std::wcout << L\"\
    Please input an integer and then press Enter: \";\n        int a;\n\n        std::wcin\
    \ >> a;\n\n        std::wcout << L\"You entered '\" << a << L\"'. \" << std::endl;\n\
    \n        std::wcout << std::endl <<\n```\n```"
  - "[PAGE 19]\n\n```\n```cpp\nL\"Please enter a noun (one word, no spaces) \" <<\n\
    L\"and then press Enter: \";\n\nstd::wstring noun;\n\n// wcin breaks up input\
    \ using white space, so if you include a space or\n// a tab, then it would just\
    \ put the first word into noun and then\n// would still be a second word waiting\
    \ in the input buffer.\nstd::wcin >> noun;\n\nstd::wcerr << L\"The \" << noun\
    \ << L\" is on fire! Oh no!\" << std::endl;\n\nColor c = { { 100.0f/255.0f, 149.0f/255.0f,\
    \ 237.0f/255.0f, 1.0f } };\n\n// This uses our custom operator from above. Come\
    \ back to this sample\n// later when we've covered operator overloading and this\
    \ should make\n// much more sense.\nstd::wcout << std::endl <<\n    L\"Cornflower\
    \ Blue is \" << c << L\".\" << std::endl;\n\nreturn 0;\n}\n```\n```\n\nThe previous\
    \ code is a fairly simple demo. It has no error checking, for instance. So, if\
    \ you enter an incorrect value for the integer, it will just run through to the\
    \ end with std::wcin returning instantly without any data (that's what it does\
    \ unless and until you resolve the error).\n\nIf you are interested in iostream\
    \ programming, including using things like std::wofstream to output data to a\
    \ file and std::wifstream to read data in from a file (they work the same as std::wcout\
    \ and std::wcin, just with added functionality for dealing with the fact that\
    \ they work with files), see the MSDN iostream programming pages. Learning all\
    \ the ins and outs of streams could easily fill a book just on its own.\n\nOne\
    \ last thing though. You've undoubtedly noticed that the stream functionality\
    \ looks a bit odd with the bit shifting operators << and >>. That's because these\
    \ operators have been overloaded. While you would expect the bit shift operators\
    \ to act a certain way on integers, there isn't any specific expectation you're\
    \ likely to have about how they should work when applied to an output stream or\
    \ an input stream, respectively. So the C++ Standard Library streams have co-opted\
    \ these operators to use them for inputting and outputting data to streams. When\
    \ we want the ability to read in or write out a custom type that we've created\
    \ (such as the previous Color structure), we simply need to create an appropriate\
    \ operator overload. We'll learn more about operator overloading later in the\
    \ book, so don't worry if it's a bit confusing right now.\n\n# # Classes and Structures\n\
    \nThe difference between a class and a structure in C++ is simply that a structure's\
    \ members default to public whereas a class' members default to private. That's\
    \ it. They are otherwise the same. There is no value-type versus reference-type\
    \ distinction as there is in C#.\n\nThat said, typically you will see programmers\
    \ use classes for elaborate types (combinations of data and functions) and structures\
    \ for simple data-only types. Normally, this is a stylistic choice that represents\
    \ the non-object-oriented origins of structure in C, making it easy to differentiate\
    \ quickly between a simple data container versus a full-blown object by looking\
    \ to see if it's a structure or a class. I recommend following this style."
  - "[PAGE 20]\n\n> > **Note:** An exception to this style is where a programmer is\
    \ writing code that is meant to be used in both C and C++. Since C does not have\
    \ a class type, the structure type might instead be used in ways similar to how\
    \ you would use a class in C++. I'm not going to cover writing C-compatible C++\
    \ in this book. To do so, you would need to be familiar with the C language and\
    \ the differences between it and C++. Instead, we are focusing on writing clean,\
    \ modern C++ code.\n\nIn Windows Runtime (“WinRT”) programming, a public structure\
    \ can only have data members (no properties or functions). Those data members\
    \ can only be made up of fundamental data types and other public structures—which,\
    \ of course, have the same data-only, fundamental, and public-structures-only\
    \ restrictions. Keep this in mind if you are working on any Metro-style apps for\
    \ Windows 8 using C++.\n\nYou will sometimes see the `friend` keyword used within\
    \ a class definition. It is followed by either a class name or a function declaration.\
    \ What this code construct does is give that class or function access to the non-public\
    \ member data and functions of the class. Typically, you’ll want to avoid this\
    \ since your class should normally expose everything you want to expose through\
    \ its public interface. But in those rare instances where you do not wish to publicly\
    \ expose certain data members or member functions, but do want one or more classes\
    \ or functions to have access to it, you can use the `friend` keyword to accomplish\
    \ this.\n\nAs classes are a very important part of C++ programming, we will explore\
    \ them in much more detail later in the book.\n\n# Unions\n\nThe union type is\
    \ a bit odd, but it has its uses. You will encounter it from time to time. A union\
    \ is a data structure appearing to hold many data members, but only allowing you\
    \ to use one of its data members at any one time. The end-result is a data structure\
    \ that gives you many possible uses without wasting memory. The size of the union\
    \ is required to be large enough only to contain the largest member of the union.\
    \ In practice, this means the data members overlap each other in memory (hence,\
    \ you can only use one at a time). This also means you have no way of knowing\
    \ what the active member of a union is unless you keep track of it somehow. There\
    \ are many ways you could do that, but putting a union and an enum in a structure\
    \ is a good, simple, tidy way of doing it. Here's an example.\n\n**Sample: UnionSample\\\
    UnionSample.cpp**\n\n```\n```cpp\n#include <iostream>\n#include <sstream>\n#include\
    \ \"../pchard.h\"\n\nenum class SomeValueDataType\n{\n        Int = 0,\n     \
    \   Float = 1,\n        Double = 2\n};\n\nstruct SomeData\n{\n        SomeValueDataType\
    \ Type;\n        union\n        {\n                int iData;\n              \
    \  float fData;\n                double dData;\n        } Value;\n};\n```\n```"
