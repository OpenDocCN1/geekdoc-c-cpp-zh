    # ## Copy Constructor\n\nA copy constructor has only one mandatory parameter:\
    \ a reference to a variable having the same type as the constructor’s class. A\
    \ copy constructor can have other parameters as long as they are all provided\
    \ with default arguments. Its purpose is to allow you to construct a copy of an\
    \ object.\n\nThe compiler will provide you with a default copy constructor if\
    \ it can, and it can as long as all the member variables that are classes, structures,\
    \ or unions have a copy constructor. The copy constructor it provides is a shallow\
    \ copy constructor. If you have a pointer to an array of data, for instance, the\
    \ copy gets a copy of the pointer, not a new array containing a copy of the same\
