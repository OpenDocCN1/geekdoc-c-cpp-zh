  mdcn: "\n预编译头会在你第一次构建程序时被编译。此后，只要你不修改预编译头，也不修改预编译头直接或间接包含的任何内容，编译器就可以复用预编译头现有的已编译版本。编译时间会加快，因为大量代码（例如\
    \ Windows.h 和 C++ 标准库头文件）不会在每次构建时重新编译。\n\n如果使用预编译头文件，需要将其作为每个源代码文件的第一个 include\
    \ 语句包含进来。但是，不应将其包含在任何头文件中。如果忘记包含它，或在它上面放置了其他 include 语句，那么编译器将产生错误。这一要求是预编译头工作方式的必然结果。\n\
    \n预编译头文件不属于 C++ 标准的一部分。其实现取决于编译器供应商。如果对它们有任何疑问，应查阅编译器供应商的文档，并且如果在在线论坛提问，务必说明你使用的是哪个编译器。\n\
    \n### 前向声明\n\n正如我们讨论过的，当你包含一个头文件时，预处理器只是取出所有代码，并将其直接插入到当前正在编译的源代码文件中。如果该头文件又包含其他头文件，那么所有这些头文件也会一并进入。\n\
    \n有些头文件非常庞大。有些包含许多其他头文件。有些既庞大又包含许多其他头文件。结果就是，仅仅因为你在一个头文件中包含了另一个头文件，大量代码就可能被反复编译。\n\
    \n避免在一个头文件中包含其他头文件的一种方法是使用前向声明。请考虑以下代码：\n\n```cpp\n#pragma once\n\n#include \"\
    SomeClassA.h\"\n#include \"Flavor.h\"\n#include \"Toppings.h\"\n\nclass SomeClassB\n\
    {\npublic:\n    SomeClassB(void);\n    ~SomeClassB(void);\n\n    int GetValueFromSomeClassA(\n\
