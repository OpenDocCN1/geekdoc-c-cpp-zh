  mdcn: "\n如果你定义一个没有参数的构造函数，它就是显式默认构造函数。也可以定义一个带参数的构造函数，并通过默认实参使其仍然成为默认构造函数，我们稍后会讨论这一点。\n\
    \n如果你定义一个至少有一个必需参数的构造函数，那么编译器不会生成默认构造函数。如果你想要默认构造函数，就必须显式定义一个。\n\n## 函数声明中的默认实参\n\
    \nC++ 中的构造函数以及一般函数，可以在其声明中为部分或全部参数指定默认实参（类似于 C# 的可选参数）。在 C++ 函数中，函数声明里所有带默认实参的参数都必须出现在任何不带默认实参的参数的右侧。C++\
    \ 不支持 C 风格的命名实参，但你可以使用[命名参数惯用法](#)实现类似效果。\n\n为什么这里要提到默认实参？事实证明，如果某个构造函数的所有参数都有默认实参，那么该构造函数就是默认构造函数。这很合理，因为如果你有一个签名为\
    \ `Vehicle(VehicleType type = VehicleType::Car, double odometerReading = 0.0);`\
    \ 的构造函数，那么你可以用空括号调用该构造函数，并使用那些默认实参。如果你定义默认构造函数，那么只能有一个，无论它没有参数，还是它的所有参数都有默认实参。\n\
    \n这一原则还可进一步推广。在同一作用域中声明的同名函数，不能在这些完全相同的位置上具有相同的参数类型。你猜对了：为了区分函数签名，带默认实参的参数会被忽略。\n\
    \n这一切都说得通，因为默认实参使得无法区分 `double Add(double a, double b = 0.0);` 和 `double Add(double\
    \ a, int b = 0);`，因为二者都可以像 `double dbl = Add(5.0);` 这样调用。编译器在这种情况下无法知道你想要哪一个，所以它干脆编译失败并显示错误消息。\n\
    \n## 带参构造函数\n\n带参构造函数有一个或多个参数。如果带参构造函数的所有参数都有默认实参，那么它也是类的默认构造函数。C++ 中的带参构造函数没有什么特别之处。\n\
    \n## 转换构造函数\n\n转换构造函数至少有一个参数。如果有多个参数，那么这些额外参数必须具有默认实参。\n\n如果你不希望某个构造函数成为转换构造函数，可以用函数说明符\
    \ explicit 标记它。看一个示例：\n\n```cpp\n#include <string>\n\nclass SomeClass\n{\npublic:\n\
    \        SomeClass(const wchar_t* value) :\n                m_strValue(value),\n\
    \                m_intValue()\n        {\n        }\n\n        explicit SomeClass(int\
    \ value) :\n                m_strValue(),\n                m_intValue(value)\n\
    \        {\n        }\n\n        ~SomeClass(void) { }\n\n        const wchar_t*\
    \ GetStringValue(void)\n        {\n                return m_strValue.c_str();\n\
    \        }\n\n        int GetIntValue(void) { return m_intValue; }\n\nprivate:\n\
    \        std::wstring        m_strValue;\n        int                 m_intValue;\n\
    };\n\nvoid DoSomething(void)\n{\n    // Normal constructor use.\n    SomeClass\
