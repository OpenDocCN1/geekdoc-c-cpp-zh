    ### Volatile


    我提到 volatile 只是为了提醒不要使用它。与 const 一样，变量可以声明为 volatile。你甚至可以有 const volatile；两者并不互斥。


    这里关于 volatile 的关键是：它很可能并不是你以为的意思。例如，[它并不适合多线程编程](https://)。volatile 的实际用例极其狭窄。很可能，如果你在变量上加上
    volatile 限定符，你就是在做一件极其错误的事情。


    Microsoft C# 语言团队成员 Eric Lippert 将 volatile 的用途描述为：“这表明你正在做一件彻头彻尾疯狂的事。你试图在两个不同线程上读写同一个值，却没有加锁。”他说得对，而且他的论点完全适用于
    C++。


    对 volatile 的使用应该比 goto 受到更多质疑。我这么说是因为我至少能想到一个有效的通用 goto 用例：在非异常条件完成后跳出深度嵌套的循环结构。相比之下，volatile
    实际上只有在你编写设备驱动程序或为某种 ROM 芯片编写代码时才有用。在这一点上，你确实应该彻底熟悉 ISO/IEC C++ 编程语言标准本身、你的代码将运行所在执行环境的硬件规范，可能还应该熟悉
    ISO/IEC C 语言标准。


    > **注意：你还应该熟悉目标硬件的汇编语言，这样你才能查看生成的代码，并[确保编译器针对你对 volatile 的使用生成了正确的代码（PDF）](https://)。**


    我一直忽略 volatile 关键字的存在，并且将在本书剩余部分继续这样做。这完全安全，因为：


    -   它是一种语言特性，除非你实际使用它，否则不会发挥作用。

    -   几乎所有人都可以安全地避免使用它。


    关于 volatile 的最后一点说明：它很可能产生的一个效果是代码变慢。从前，人们认为 volatile 能产生与原子性相同的结果。并非如此。正确实现时，原子性保证多个线程和多个处理器不能同时读写一块以原子方式访问的内存。实现这一点的机制包括锁、互斥量、信号量、栅栏、特殊处理器指令等。volatile
    唯一做的事情是强制 CPU 从内存中获取 volatile 变量，而不是使用它可能缓存在寄存器或栈中的任何值。正是这种内存获取拖慢了所有事情。


    ### `dynamic_cast`


    `dynamic_cast` 运算符对于通过虚继承进行转换很有用。`static_cast` 可以从派生类转换到基类，无论继承是否为虚继承。然而，假设你得到一个
    A 类型的对象，但你知道它实际上是 B 类型的对象——并且 B 虚继承自 A。如果你想将这个对象转换回 B，以使用只有 B 提供的成员函数，就需要使用 `dynamic_cast`。


    关于 `dynamic_cast` 有几点。首先，它只适用于指针到指针或引用到引用的转换。其次，如果对象实际上不是 B（也不是从 B 派生的类型），它就不能真正将
    A 对象转换为 B。指针到指针的 `dynamic_cast` 失败时返回空指针。引用到引用的转换失败时抛出 `std::bad_cast` 异常。


    ### `reinterpret_cast`


    `reinterpret_cast` 运算符是一种直接转换，几乎没有好的用途。它的大多数操作都会给出未定义结果。这在实践中意味着，在使用它做任何事情之前，你应该阅读编译器供应商的文档。


    它的一个用途，正如我们在 **StorageDurationSample** 中看到的，是将指针转换为足够大、能容纳它的整数类型。这会给出指针的内存地址，这对于调试和跟踪操作（例如将数据转储到日志文件并创建核心转储，但可能无法轻松运行调试器）可能有用。你会看到它有时被正当地用于其他目的，但一般来说，它应该被视为最后才考虑的转换（不包括
    C 风格转换，它排在 `reinterpret_cast` 之后）。


