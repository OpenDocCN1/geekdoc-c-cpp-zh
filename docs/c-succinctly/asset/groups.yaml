    \ a common convention when using them in C++, which is to prefix the variable\
    \ name with g_, as in the previous example. While this helps to alert you and\
    \ other programmers to the fact that this is a global variable, it does not change\
    \ the fact that it is a global variable, having all the problems I described.\
    \ This isn’t a book on bad programming practices, so I’m not going to spend time\
    \ explaining [why global variables are bad](#). All you need to know is this feature\
    \ exists in C++, but you should avoid using it whenever possible.\n\n# The Scope\
    \ Resolution Operator `::`\n\nIn C++, `::` is the scope resolution operator. It\
    \ is used for separating nested namespaces, for separating types from their namespace,\
    \ and for separating member functions and variables from their type.\n\nNote that\
    \ it is only used in the last situation when performing the following:\n\n+  \
    \ - Defining a member function.\n+   - Accessing a member of a base class within\
    \ a member function definition.\n+   - Accessing a static member function or variable.\n\
    +   - Assigning a value to a static member variable.\n+   - Fetching the address\
    \ of a member function.\n\nIn other instances, you use either the `.` operator\
    \ or the `->` operator, depending on whether you are accessing the member directly\
    \ or via a pointer.\n\nThis can seem complicated since C# just uses the `.` operator\
    \ for all of the purposes that `::`, `.`, and `->` are used for in C++.\n\n> **Note:**\
    \ We'll discuss the `.` and `->` operators later. For now, you just need to know\
    \ that they are used for accessing member variables and non-static member functions\
    \ (which you use depending on whether or not you are working with a pointer).\n\
    \nFor the most part, you’ll be fine. The only place you’re likely to trip up is\
    \ if you try to access a base class member by using the `.` operator rather than\
    \ the `::` operator, or if you try to specify an enum member using something other\
    \ than `::`. If you ever compile your program and receive a syntax error complaining\
    \ about “missing ';' before '::'”, it's a good bet you used a `.` where you should've\
    \ used a `::` instead.\n\n# Defining Namespaces\n\nA namespace is defined in much\
    \ the same way as it is in C#. Here is an example:\n\n**Sample: NamespacesSample\\\
    \\NamespacesSample.cpp**\n\n```\n```cpp\n#include <iostream>\n#include <ostream>\n\
    #include <string>\n#include \"../pochar.h\"\n\nusing namespace std;\n\nnamespace\
    \ Places\n{\n        namespace Cities\n        {\n                struct City\n\
    \                {\n```\n```"
