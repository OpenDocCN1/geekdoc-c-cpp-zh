  - '[PAGE 8]


    # # About the Author


    Michael B. McLaughlin is a software developer, an author, a consultant, a retired
    lawyer, and a Microsoft XNA/DirectX MVP. He is the proprietor of Bob Taco Industries™,
    an independent software vendor (micro-ISV) currently focused on development and
    consulting work on Windows Phone, Windows 8, and other Microsoft platforms. He
    has been developing software and providing platform expertise either professionally
    or as a hobbyist since 1994. He lives in New York''s Mid-Hudson Valley and has
    recently discovered the joys of motorcycling.'
  - '[PAGE 9]


    # Introduction


    *C++ Succinctly* was written to help professional C# developers learn modern C++
    programming. The aim of this book is to leverage your existing C# knowledge in
    order to expand your skills. Whether you need to use C++ in an upcoming project,
    or simply want to learn a new language (or reacquaint yourself with it), this
    book will help you learn all of the fundamental pieces of C++ so you can understand
    projects and samples written in C++ and begin writing your own C++ programs.


    As with any large subject, there simply wasn’t room to cover everything (an example
    being the new atomic features added in C++11), and others might have decided to
    order the topics differently. I’m thinking particularly of pointers, a topic I
    cover in depth only further into the book. They are important, so some might have
    chosen to cover them earlier, but I feel you do not need to understand pointers
    to understand the material that precedes their coverage; understanding the preceding
    topics will make it much easier for you to understand them.


    I’ve done my best to be as accurate as possible without sounding like a language
    specification or documentation file. I hope I have succeeded. I consulted the
    C++11 language specification frequently while writing this, and I also read everything
    from StackOverflow posts, to MSDN docs, to GCC docs, and beyond. There are areas
    where I intentionally simplified things. As you continue to expand your knowledge
    of C++, you will undoubtedly reach issues where you need to have a more comprehensive
    understanding in order to accomplish your goal or eliminate a bug. If reading
    this book imparts enough knowledge—and a good-enough feel for the language that
    you are able to recognize, diagnose, and resolve those issues—then I will be content
    that I have succeeded in my goals. Welcome to C++!'
  - "[PAGE 10]\n\n# Preface\n\n# Trademarks, etc.\n\nBeing a retired lawyer, I feel\
    \ compelled to include this brief section, which you probably don’t care about\
    \ unless you are a lawyer for one of these companies or organizations. The remainder\
    \ of this preface is much more enjoyable reading for non-lawyers, so please don’t\
    \ let this put you off. Microsoft®, Visual Studio®, Visual C++®, Visual C#®, Windows®,\
    \ Windows NT®, Win32®, MSDN®, Silverlight®, DirectX®, and IntelliSense® are registered\
    \ trademarks of Microsoft Corporation. GNU® is a registered trademark of the Free\
    \ Software Foundation. ISO® is a registered service mark of the International\
    \ Organization for Standardization. IEC® is a registered service mark of International\
    \ Engineering Consortium, Inc. Unicode® is a registered service mark of Unicode,\
    \ Inc. (a.k.a. The Unicode Consortium). Intel® is a registered trademark of Intel\
    \ Corporation. Other trademarks and service marks are the properties of their\
    \ respective owners.\n\n# Program Entry Point\n\nIn C#, the entry point for a\
    \ program is a static method named Main. Often you will not actually see it since\
    \ various frameworks provide their own (e.g., Silverlight), but it is there, somewhere,\
    \ since without it the operating system would not know where to begin executing\
    \ your program.\n\nThe entry point of a C++ program is the main function. A simple\
    \ version looks like this:\n\n```\n```cpp\nint main(int argc, char* argv[])\n\
    {\n        // Your program starts here.\n\n        // Returning 0 signifies success.\n\
    \        return 0;\n}\n```\n```\n\nThe parameters are the argument count followed\
    \ by an array of the command-line arguments (as strings). In Windows programming,\
    \ you will often see this as the entry point:\n\n```\n```cpp\nint wmain(int argc,\
    \ wchar_t* argv[])\n{\n        // Your program starts here.\n\n        // Returning\
    \ 0 signifies success.\n        return 0;\n}\n```\n```\n\nThis wmain entry point\
    \ is Microsoft-specific. It is used as the entry point for Windows Unicode programs\
    \ (as opposed to older ASCII/code page programs). Microsoft operating systems\
    \ that support Unicode (everything from Windows 2000 and Windows NT 4 on, and\
    \ even Win 9X-based systems when you install a special add-on) use UTF-16 encoding.\
    \ As such, you really should always use Unicode when writing your programs unless\
    \ you absolutely need to support older systems that do not have Unicode support.\n\
    \nYou will frequently also see this as the entry point for Windows programs:"
