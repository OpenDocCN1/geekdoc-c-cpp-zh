    \n    //// Illegal since the int constructor is not a\n    //// conversion constructor.\n\
    \    //SomeClass sc4 = 1;\n\n    // ...\n}\n```\n\n如你所见，转换构造函数让我们可以通过直接将 sc2 设置为字符串值来构造它。编译器看到该语句，检查\
    \ SomeClass 是否有一个能接收这类值的转换构造函数，然后继续调用适当的 SomeClass 构造函数。如果我们对注释掉的 sc4 行尝试这样做，编译器会失败，因为我们使用\
