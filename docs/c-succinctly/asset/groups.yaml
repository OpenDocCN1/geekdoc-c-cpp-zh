    \nFor the Flavor enumeration, we specified the underlying type as being an unsigned\
    \ short int. You can also specify the underlying type for scoped enumerations.\
    \ Specifying the underlying type is optional, but is mandatory if you wish to\
    \ use forward declaration with an un-scoped enumeration. Forward declaration is\
    \ a way to speed up program compile times by only telling the compiler what it\
    \ needs to know about a type rather than forcing it to compile the whole header\
    \ file the type is defined in.\n\nWe will look at this later on. For now, just\
    \ remember that an un-scoped enumeration must have its underlying type explicitly\
    \ specified in order to use a forward declaration of it; a scoped enumeration\
    \ does not require specification of its underlying type to use a forward declaration\
    \ of it (the underlying type will be int if none is specified).\n"
  mdcn: "\n## 第 1 章 类型\n\n### 基本类型\n\nC++ 包含你在 C# 中熟悉的相同关键字（例如 `int`）。鉴于两者都是类 C 语言，这并不奇怪。然而，有一个可能让你陷入麻烦的潜在陷阱。C#\
    \ 显式定义了基本类型的大小（`short` 是 16 位整数，`int` 是 32 位整数，`long` 是 64 位整数，`double` 是 64 位双精度\
    \ IEEE 754 浮点数，等等），而 C++ 不提供这样的保证。\n\nC++ 中最小的基本单元是 `char`，它只需要至少大到足以容纳 C++ 标准规定的\
    \ 96 个基本字符，以及实现的基本字符集中的任何其他字符。理论上，某些 C++ 实现可以将 `char` 定义为 7 位或 16 位……几乎任何情况都有可能。但在实践中，你不需要太担心\
    \ `char` 不是 8 位（相当于 C# 中的 byte 或 sbyte 类型），在 Visual C++ 中它就是 8 位。\n\n在 C++ 中，`char`、`signed\
    \ char` 和 `unsigned char` 是三种不同的类型。三者都必须占用相同大小的内存存储空间。因此，`char` 在实践中要么是有符号的，要么是无符号的。它是有符号还是无符号由实现定义（参见侧栏）。在\
    \ Visual C++ 中，`char` 类型默认是有符号的。但你可以使用编译器开关让它按无符号处理。在 GCC 中，它是有符号还是无符号取决于你面向的\
    \ CPU 架构。\n\n有符号整数类型按大小从小到大依次为：\n\n- `signed char`\n- `short int`\n- `int`\n-\
    \ `long int`\n- `long long int`\n\n> **实现**\n> 与许多编程语言一样，C++ 有来自不同公司和组织的多种实现。两个最流行的\
    \ C++ 实现是 Visual C++ 和 GCC。C++ 标准将一些细节留给实现者定义。如果你在编写跨平台代码，就需要牢记这些由实现定义的细节，以免发现程序在一个操作系统上运行正常，却在另一个操作系统上以奇怪的方式失败。\n\
    \n对于这些整数类型中每一种的大小，唯一的保证是：每种类型至少与比它小的下一种整数类型一样大。在 Visual C++ 中，`int` 和 `long int`\
    \ 都是 32 位整数。只有 `long long int` 是 64 位整数。\n\n> **注意：** 你可以直接写 `long` 或 `long long`；不必分别写成\
    \ `long int` 或 `long long int`。`short int` 也是如此（也就是说，你可以直接写 `short`）。在 Visual\
    \ C++ 中，`short` 类型是 16 位有符号整数。\n\n每种整数类型都有对应的无符号整数类型。你只需在前面加上关键字 `unsigned`，就能得到无符号版本（`signed\
    \ char` 除外，要把它改成 `unsigned char`）。\n\n如果你需要确保使用特定的大小，可以包含 C++ 标准库头文件 `cstdint`（例如\
    \ `#include <cstdint>`），它定义的类型包括：\n\n- `int8_t`\n- `int16_t`\n- `int32_t`\n- `int64_t`\n\
    - `uint8_t`\n- `uint16_t`\n- `uint32_t`\n- `uint64_t`\n\n这些类型有其用途，但你会发现大多数 API\
    \ 并不使用它们，而是直接使用基本类型。这可能会让你的编程变得令人困惑，因为你需要不断检查底层基本类型，以确保不会出现意外的截断或扩展。\n\n这些类型以后可能会得到更多使用，因此我建议不时检查它们在主要库和\
    \ API 中的使用情况，并且如果它们被广泛采用，就相应地调整你的代码。当然，如果你绝对需要一个变量是例如无符号 32 位整数，那你当然应该使用 `uint32_t`，并根据需要为\
    \ API 调用和可移植性做出调整。\n\n浮点数在大小顺序规则方面也一样。它们从 float 到 double 再到 long double。在 Visual\
    \ C++ 中，float 是 32 位浮点数，而 double 和 long double 都是 64 位浮点数（换句话说，long double 并不比\
    \ double 大）。\n\nC++ 没有任何原生类型能与 C# 的 decimal 类型相比。不过，C++ 的一个好处是通常有大量免费或便宜的库可以获得许可使用。例如，有\
    \ decNumber 库、Intel Decimal Floating Point Math Library 和 GNU Multiple Precision\
    \ Arithmetic Library。它们都不能与 C# 的 decimal 类型完全兼容，但如果你只为 Windows 系统编写代码，那么可以在需要时使用\
    \ DECIMAL 数据类型来获得这种兼容性，同时还可使用 Decimal Arithmetic Functions 和 Data Type Conversion\
    \ Functions。\n\n还有一种布尔类型 bool，它可以为 true 或 false。在 Visual C++ 中，bool 占用一个字节。与 C#\
    \ 不同，bool 可以转换为整数类型。当它为 false 时，其等价的整数值为 0；当它为 true 时，值为 1。因此，语句 `bool result\
    \ = true == 1;` 可以编译，并且该语句执行后 result 的求值结果为 true。\n\n然后是 `wchar_t` 类型，它保存宽字符。宽字符的大小因平台而异。在\
    \ Windows 平台上，它是 16 位字符。它相当于 C# 的 `char` 类型。它经常用于构造字符串。我们将在另一章讨论字符串，因为字符串可以使用许多变体。\n\
    \n最后是 `void` 类型，其用法与 C# 中相同。还有一个 `std::nullptr_t` 类型，要准确解释它很麻烦，但基本上它是 `nullptr`\
    \ 字面量的类型；你应该使用它而不是 `NULL` 或字面量 0（零）来检查空值。\n\n### 枚举\n\n枚举在 C++ 和 C# 中彼此相当相似。C++\
    \ 有两种枚举：有作用域枚举和无作用域枚举。\n\n有作用域枚举定义为 `enum class` 或 `enum struct`。两者之间没有区别。无作用域枚举定义为普通的\
    \ `enum`。让我们看一个示例：\n\n**示例：EnumSample\\EnumSample.cpp**\n\n```cpp\n#include <iostream>\n\
    #include <ostream>\n#include <string>\n#include \"../pchar.h\"\n\nenum class Color\n\
    {\n    Red,\n    Orange,\n    Yellow,\n    Blue,\n    Indigo,\n    Violet\n};\n\
    \n// You can specify any underlying integral type you want, provided it fits.\n\
    enum Flavor : unsigned short int\n{\n    Vanilla,\n    Chocolate,\n    Strawberry,\n\
    \    Mint,\n};\n\nint _pmain(int /*argc*/, _pchar* /*argv*/[])\n{\n    Flavor\
    \ f = Vanilla;\n    f = Mint; // This is legal since the Flavor enum is an un-scoped\
    \ enum.\n\n    Color c = Color::Orange;\n    //c = Orange; // This is illegal\
    \ since the Color enum is a scoped enum.\n\n    std::wstring flavor;\n    std::wstring\
    \ color;\n\n    switch (c)\n    {\n    case Color::Red:\n        color = L\"Red\"\
    ;\n        break;\n    case Color::Orange:\n        color = L\"Orange\";\n   \
