    \ L-value references and R-value references. An L-value reference is marked by\
    \ an && appended to the type name (e.g., SomeClass&), whereas an R-value reference\
    \ is marked by an && appended to the type name (e.g., SomeClass&&). For the most\
    \ part, they act the same; the main difference is that R-value references is extremely\
