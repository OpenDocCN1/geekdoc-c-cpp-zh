  - "[PAGE 47]\n\n```\n```cpp\n// You can also create an IWriteData pointer to an\
    \ instance of a\n// class that derives from IWriteData.\nIWriteData* p_iwd = &cwd;\n\
    \ncwd.WriteLine(10);\nr_iwd.WriteLine(14.6);\np_iwd->WriteLine(L\"Hello Abstract\
    \ World!\");\n\nreturn 0;\n}\n```\n```\n\nThe previous sample demonstrates how\
    \ to implement an interface-style class in C++. The IWriteData class could be\
    \ inherited by a class that writes data to a log file, to a network connection,\
    \ or to any other output. By passing around a pointer or a reference to IWriteData,\
    \ you could easily switch output mechanisms.\n\nThe syntax for an abstract member\
    \ function, called a pure virtual function, is simply to add = 0 after the declaration,\
    \ as in IWriteData class: void Write(int value) = 0; You do not need to make a\
    \ class purely abstract; you can implement member functions or include member\
    \ data common to all instances of the class. If a class has even one pure virtual\
    \ function, then it is considered an abstract class.\n\nVisual C++ provides a\
    \ [Microsoft-specific way to define an interface](#). Here's the equivalent of\
    \ IWriteData using the Microsoft syntax:\n\n# ### Sample: AbstractClassSampleIWriteData.h\n\
    \n```\n```cpp\n#pragma once\n\ninterface IWriteData\n{\n    virtual void Write(const\
    \ wchar_t* value) = 0;\n    virtual void Write(double value) = 0;\n    virtual\
    \ void Write(int value) = 0;\n\n    virtual void WriteLine(void) = 0;\n    virtual\
    \ void WriteLine(const wchar_t* value) = 0;\n    virtual void WriteLine(double\
    \ value) = 0;\n    virtual void WriteLine(int value) = 0;\n};\n```\n```\n\nRather\
    \ than define it as a class, you define it using the __interface keyword. You\
    \ cannot define a constructor, a destructor, or any member functions other than\
    \ pure virtual member functions. You also cannot inherit from anything other than\
    \ other interfaces. You do not need to include the public access specifier since\
    \ all member functions are public.\n\n# ## Precompiled Header Files\n\nA precompiled\
    \ header file is a special type of header file. Like a normal header file, you\
    \ can stick both include statements and code definitions in it. What it does differently\
    \ is help to speed up compile times."
  md: "\nThe same is true for VirtualClass, of course. Though the sample is careful\
    \ to always specify virtual and override the defaults of VirtId (and you should\
    \ be too), as long as A::VirtId is declared as being virtual, then all derived\
    \ classes with the same signature will be considered virtual overrides of VirtId.\n\
    \nThe previous sample also demonstrates the diamond problem that multiple-inheritance\
    \ can produce as well as how virtual inheritance solves it. The diamond problem\
    \ moniker comes from the idea that if class Z derives from class X and class Y,\
    \ which both derive from class W, a diagram of this inheritance relationship would\
    \ look like a diamond. Without virtual inheritance, the inheritance relationship\
    \ does not actually form a diamond; instead, it forms a two-pronged fork with\
    \ each prong having its own copy of W.\n\nNonVirtualClass has non-virtual inheritance\
    \ from B1, which has virtual inheritance from A, and from B3, which has non-virtual\
    \ inheritance from A. This results in a diamond problem, with two copies of the\
    \ A class’ member data becoming a part of NonVirtualClass’ member data. DemonstrateNonVirtualInheritance\
    \ function shows the problems that result from this and also shows the syntax\
    \ used to resolve which A you want when you need to use one of A’s members.\n\n\
    VirtualClass has virtual inheritance from both B1, which has virtual inheritance\
    \ from A, and from B2, which also has virtual inheritance from A. Since all the\
    \ inheritance chains that go from VirtualClass to A are virtual, there is only\
    \ one copy of A’s data; thus, the diamond problem is avoided. DemonstrateVirtualInheritance\
    \ function shows this.\n\nEven with virtual inheritance, VirtualClass still has\
    \ one ambiguity. B1::Conflict and B2::Conflict both have the same name and same\
    \ parameters (none, in this case), so it is impossible to resolve which one you\
    \ want without using the base-class-specifier syntax.\n\nNaming is very important\
    \ when dealing with multiple-inheritance if you wish to avoid ambiguity. There\
    \ is, however, a way to resolve ambiguity. The two commented-out using declarations\
    \ in NonVirtualClass demonstrate this resolution mechanism. If we decided we wanted\
    \ to always resolve an ambiguity in a certain way, the using declaration lets\
    \ us do that.\n\n![](img/e4d68f5a79326a8404dad75080806b64_44_0.png)\n\n> *Note:\
    \ The using declaration is useful for resolving ambiguity outside of a class too\
    \ (within a namespace or a function, for instance). It is also useful if you wish\
    \ to bring only certain types from a namespace into scope without bringing the\
    \ entire namespace into scope with a using namespace directive. It is okay to\
    \ use a using declaration within a header, provided it is inside a class, structure,\
    \ union, or function definition, since using declarations are limited to the scope\
    \ in which they exist. You should not use them outside of these since you would\
    \ be bringing that type into scope within the global namespace or within whatever\
    \ namespace you were in.*\n\nOne thing I did not touch on in the sample is inheritance\
    \ access specifiers other than public. If you wanted, you could write something\
    \ like class B : protected A { ... }. Then class A’s members would be accessible\
    \ from within B’s methods, and accessible to any class derived from B, but not\
    \ publicly accessible. You could also say class B : private A { ... }. Then class\
    \ A’s members would be accessible from within B’s methods, but not accessible\
    \ to any class derived from B, nor would they be publicly accessible.\n\nI mention\
    \ these in passing simply because they are rarely used. You might, nonetheless,\
    \ come across them, and you may even find a use for them. If so, remember that\
    \ a class that privately inherits from a base class still has full access to that\
    \ base class; you are simply saying that no further-derived classes should have\
    \ access to the base class’ member functions and variables.\n\nMore common, you\
    \ will come across mistakes where you or someone else forgot to type public before\
    \ a base class specifier, resulting in the default private inheritance. You will\
    \ recognize this by the slew of error messages telling you that you can’t access\
    \ private member functions or data of some base class, unless you are writing\
    \ a library and don’t test the class. In that case, you will recognize the issue\
    \ from the angry roars of your users. One more reason unit testing is a good idea.\n\
    \n## Abstract Classes\n\nAn abstract class has at least one pure virtual member\
