    \n有几种重要的智能指针类型。我们来看看它们。\n\n## `std::unique_ptr`\n\n唯一指针 `std::unique_ptr` 旨在持有指向动态分配对象的指针。仅当希望该对象只存在一个指针时，才应使用此类型。它是一个模板类，接受一个必需模板实参和一个可选模板实参。必需实参是它将持有的指针类型。例如，`auto\
    \ result = std::unique_ptr<int>(new int());` 将创建一个包含 `int*` 的唯一指针。可选实参是删除器的类型。我们将在后续示例中了解如何编写删除器。通常可以避免指定删除器，因为如果未指定删除器，就会为你提供\
    \ `default_deleter`，它几乎涵盖你能想象到的所有情况。\n\n以 `std::unique_ptr` 作为成员变量的类不能有默认复制构造函数。`std::unique_ptr`\
    \ 的复制语义被禁用。如果希望在有唯一指针的类中提供复制构造函数，就必须自己编写。还应编写复制运算符的重载。通常在这种情况下，你需要的是 `std::shared_ptr`。\n\
    \n然而，你可能拥有类似数据数组的东西。你还可能希望该类的任何副本都创建当时存在的数据副本。在这种情况下，带有自定义复制构造函数的唯一指针可能是正确选择。\n\
    \n`std::unique_ptr` 定义在 `<memory>` 头文件中。\n\n`std::unique_ptr` 有四个值得关注的成员函数。\n\n\
