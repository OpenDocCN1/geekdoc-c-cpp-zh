  - '[PAGE 71]


    If you then had a delete statement in the destructor for that class, you would
    have one copy in an invalid state when the other was destroyed, and you’d have
    a runtime error when you tried to delete the memory for the second time when the
    remaining copy was destroyed, assuming your program had not already crashed. This
    is one of many reasons you should always use smart pointers. We will cover them
    in the [chapter on RAII](#).


    If you do not wish to use the compiler-provided copy constructor, or if the compiler
    cannot provide one, but you want to have one anyway, you can write a copy constructor.
    For example, perhaps you want a deeper copy of the data, or perhaps your class
    has a `std::unique_ptr` and you decide what an acceptable “copy” of it would be
    for the purposes of your class. We will see an example of this in **ConstructorsSample**.


    A copy constructor should typically have the following declaration: `SomeClass(const
    SomeClass&);` To avoid weird errors, the constructor should always take a `const`
    value reference to the class you copy from. There’s no reason you should change
    the class you are copying from in a copy constructor. Making it const does no
    harm and provides some guarantees about your operation. A copy constructor should
    not be defined as `explicit`.


    # ## Copy Assignment Operator


    If you define a custom copy constructor, you should also define a custom copy
    assignment operator. The result of the operator should be that the returned value
    is a copy of the class it is copying. This is what is invoked when you have a
    statement such as `a = b;` where a and b are both of the same type (e.g., `SomeClass`).


    This operator is a non-static member function of its class, so it is only invoked
    when you are copy-assigning to an existing instance of the class. If you had something
    like `SomeClass a = b;` then it would be a copy constructor, not a copy assignment.


    A copy assignment operator should have the following declaration: `SomeClass&
    operator=(const SomeClass&);`.


    # ## Move Constructor


    In C++, if all you had was a copy constructor, and you wanted to pass a class
    instance into a `std::vector` (similar to a .NET `List<T>`) or return it from
    a function, you would need to make a copy of it. Even if you had no intention
    of using it again, you would still incur the time it takes to make a copy. If
    you’re adding many elements to a `std::vector`, or if you wrote a factory function
    that you use a lot, it would be a big performance hit.


    This is why C++ has a move constructor. The move constructor is new in C++11.
    There are some circumstances in which the compiler will provide you one, but generally
    you should write your own for the classes you will need it for.


    It’s easy to do. Note that if you write a move constructor, then you will also
    need to write a copy constructor. Visual C++ does not enforce this rule as of
    Visual Studio 2012 RC, but it is part of the C++ language standard. If you need
    to compile your program with another compiler, you should make sure that you write
    copy constructors and copy assignment operators when you write a move constructor.


    A move constructor should typically have the following declaration: `SomeClass(SomeClass&&);`
    It cannot be const (because we will be modifying it) or `explicit`.'
