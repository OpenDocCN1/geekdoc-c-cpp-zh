    \n## C++ 中的异常\n\n与 .NET 不同，在 .NET 中所有异常都派生自 `System.Exception`，并具有保证的方法和属性；而 C++\
    \ 异常不要求派生自任何东西，甚至不要求是类类型。在 C++ 中，`throw \"Hello World!\"` 对编译器来说完全可以接受，`throw\
    \ 5;` 也是如此。基本上，异常可以是任何东西。\n\n话虽如此，许多 C++ 程序员会不高兴看到不派生自 `std::exception`（位于 `<exception>`\
    \ 头文件中）的异常。让所有异常都派生自 `std::exception` 提供了一种方法：可以捕获未知类型的异常，并在重新抛出它们之前通过 `what`\
    \ 成员函数从中检索信息。`std::exception::what` 不接受参数并返回一个 `const char*` 字符串，你可以查看或记录该字符串，从而知道异常是由什么引起的。\n\
    \nC++ 异常没有堆栈跟踪——这里不计调试器提供的堆栈跟踪能力。因为捕获异常的 try 块作用域内具有自动存储期的对象会在相应的 catch 处理程序（如果有）被激活之前自动销毁，所以你没有余裕去检查可能导致异常的数据。最初你只能使用来自\
    \ `what` 成员函数的消息。\n\n如果很容易重现导致异常的条件，你可以设置断点并重新运行程序，从而单步执行问题区域，并可能发现问题所在。因为并不总是能够这样做，所以尽可能精确地提供错误消息很重要。\n\
    \n当从 `std::exception` 派生时，你应确保重写 `what` 成员函数，以提供有用的错误消息，帮助你和其他开发者诊断出了什么问题。\n\n\
    一些程序员使用一条规则的变体，该规则要求你应始终抛出派生自 `std::exception` 的异常。这些程序员记得入口点（`main` 或 `wmain`）返回一个整数，因此当他们的代码可以恢复时，会抛出派生自\
    \ `std::exception` 的异常；但如果失败不可恢复，就只抛出一个定义良好的整数值。入口点代码将包裹在 try 块中，该块有一个针对 `int`\
    \ 的 catch。catch 处理程序将返回捕获到的 `int` 值。在大多数系统上，程序返回 0 表示成功。任何其他值表示失败。\n\n如果发生灾难性失败，那么抛出一个定义良好的非\
    \ 0 整数值有助于提供一些含义。除非你所在项目偏好这种风格，否则你应坚持使用派生自 `std::exception` 的异常，因为它们让程序可以使用简单的日志系统记录未处理异常的消息，并执行任何安全的清理。抛出未派生自\
    \ `std::exception` 的内容会干扰这些错误日志记录机制。\n\n最后要注意的一点是，C# 的 `finally` 构造在 C++ 中没有等价物。RAII\
    \ 惯用法在正确实现后，使这一构造变得不必要，因为所有内容都会被清理。\n\n### C++ 标准库异常\n\n我们已经讨论过 `std::exception`，但标准库中可用的类型不止这一种，还有额外功能可以探索。让我们先看看\
    \ `<exception>` 头文件中的功能。\n\n`std::terminate` 函数默认会使任何应用程序崩溃退出。应尽量少使用它，因为调用它而不是抛出异常将绕过所有正常的异常处理机制。如果你愿意，可以编写一个没有参数和返回值的自定义\
    \ terminate 函数。一个示例将在 **ExceptionsSample** 中看到，它即将出现。\n\n要设置自定义 terminate，你调用\
    \ `std::set_terminate` 并传入该函数的地址。你可以随时更改自定义 terminate 处理程序；最后设置的函数将在调用 `std::terminate`\
    \ 或发生未处理异常时被调用。默认处理程序会调用 `<cstdlib>` 头文件中的 `abort` 函数。\n\n`<stdexcept>` 头文件提供了一个基本的异常框架。它定义了两个继承自\
    \ `std::exception` 的类。这两个类作为其他几个类的父类。\n\n`std::runtime_error` 类是由运行时抛出的异常或由于 C++\
    \ 标准库函数中的错误而抛出的异常的父类。它的子类有 `std::overflow_error` 类、`std::range_error` 类和 `std::underflow_error`\
    \ 类。\n\n`std::logic_error` 类是由于程序员错误而抛出的异常的父类。它的子类有 `std::domain_error` 类、`std::invalid_argument`\
