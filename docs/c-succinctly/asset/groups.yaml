    # # Chapter 10 C++ Language Usages and Idioms


    # ## Overview


    We’ve discussed the RAll idiom. Some language usages and programming idioms in
    C++ might seem foreign or pointless at first glance, but they do have a purpose.
    In this chapter, we will explore a few of these odd usages and idioms to understand
    where they came from and why they are used.


    # ## Incrementing and Decrementing


    You will commonly see C++ increment an integer by using the syntax ++i instead
    of i++. The reason for this is partly historic, partly useful, and partly a sort
    of secret handshake. One of the common places you will see this is in a for loop
    (e.g., for (int i = 0; i < someNumber; i++) { ... }). Why do C++ programmers use
    ++i rather than i++? Let’s consider what these two operators mean.


    ```

    ```cpp

    int i = 0;

    int x = ++i;

    int y = i++;

    ```

    ```


    In the previous code, when all three statements finish executing, i will be equal
    to 2. But what will x and y equal? They will both equal 1. This is because the
    pre-increment operator in the statement, ++i, means “increment i and give the
    new value of i as the result.” So when assigning x its value, i goes from 0 to
    1, and the new value of i, 1, is assigned to x. The post-increment operator in
    the statement i++ means “increment i and give the original value of i as the result.”
    So when assigning y its value, i goes from 1 to 2, and the original value of i,
    1, is assigned to y.


    If we were to decompose that sequence of instructions step-by-step as written,
    eliminating the pre-increment and post-increment operators and replacing them
    with regular addition, we would realize that to perform the assignment to y, we
    need an extra variable to hold the original value of i. The result would be something
    like this:


    ```

    ```cpp

    int i = 0;


    // int x = ++i;

    i = i + 1;

    int x = i;


    // int y = i++;

    int magicTemp = i;

    i = i + 1;

    int y = magicTemp;

    ```

    ```


    Early compilers, in fact, used to do things like that. Modern compilers now determine
    that there are no observable side effects to assigning y to first, so the assembly
    code they generate, even without optimization, will typically look like the assembly-language
    equivalent of this C++ code:


    ```

    ```cpp

    int i = 0;


    // int x = ++i;

    i = i + 1;

    ```

    ```'
