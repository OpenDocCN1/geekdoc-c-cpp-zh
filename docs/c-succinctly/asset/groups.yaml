    \    return m_toppingsString.c_str();\n}\n```\n\n## Chapter 10 C++ Language Usages\
    \ and Idioms\n\n### Overview\n\nWe’ve discussed the RAII idiom. Some language\
    \ usages and programming idioms in C++ might seem foreign or pointless at first\
    \ glance, but they do have a purpose. In this chapter, we will explore a few of\
    \ these odd usages and idioms to understand where they came from and why they\
    \ are used.\n\n### Incrementing and Decrementing\n\nYou will commonly see C++\
    \ increment an integer by using the syntax ++i instead of i++. The reason for\
    \ this is partly historic, partly useful, and partly a sort of secret handshake.\
    \ One of the common places you will see this is in a for loop (e.g., for (int\
    \ i = 0; i < someNumber; i++) { ... }). Why do C++ programmers use ++i rather\
    \ than i++? Let’s consider what these two operators mean.\n\n```cpp\nint i = 0;\n\
    int x = ++i;\nint y = i++;\n```\n\nIn the previous code, when all three statements\
    \ finish executing, i will be equal to 2. But what will x and y equal? They will\
    \ both equal 1. This is because the pre-increment operator in the statement, ++i,\
    \ means “increment i and give the new value of i as the result.” So when assigning\
    \ x its value, i goes from 0 to 1, and the new value of i, 1, is assigned to x.\
    \ The post-increment operator in the statement i++ means “increment i and give\
    \ the original value of i as the result.” So when assigning y its value, i goes\
    \ from 1 to 2, and the original value of i, 1, is assigned to y.\n\nIf we were\
    \ to decompose that sequence of instructions step-by-step as written, eliminating\
    \ the pre-increment and post-increment operators and replacing them with regular\
    \ addition, we would realize that to perform the assignment to y, we need an extra\
    \ variable to hold the original value of i. The result would be something like\
    \ this:\n\n```cpp\nint i = 0;\n\n// int x = ++i;\ni = i + 1;\nint x = i;\n\n//\
    \ int y = i++;\nint magicTemp = i;\ni = i + 1;\nint y = magicTemp;\n```\n\nEarly\
    \ compilers, in fact, used to do things like that. Modern compilers now determine\
    \ that there are no observable side effects to assigning y to first, so the assembly\
    \ code they generate, even without optimization, will typically look like the\
    \ assembly-language equivalent of this C++ code:\n\n```cpp\nint i = 0;\n\n// int\
    \ x = ++i;\ni = i + 1;\n```\n\nC++11 has added a new keyword, `nullptr`, which\
    \ can and should be used in place of 0, NULL, and anything else when you need\
    \ to assign a null value to a pointer or check to see if a pointer is null. There\
    \ are several good reasons to use it.\n\nThe `nullptr` keyword is a language keyword;\
    \ it is not eliminated by the preprocessor. Since it passes through to the compiler,\
    \ the compiler can detect errors and generate usage warnings that it couldn’t\
    \ detect or generate with the literal 0 or any macros.\n\nIt also cannot be redefined\
    \ either accidentally or intentionally, unlike a macro such as NULL. This eliminates\
    \ all the errors that macros can introduce.\n\nLastly, it provides future proofing.\
    \ Having binary zero as the null value was a practical decision when it was made,\
    \ but it was arbitrary nonetheless. Another reasonable choice might have been\
    \ to have null be the max value of an unsigned native integer. There are positives\
    \ and negatives to such a value, but there’s nothing I know of that would have\
    \ made it unusable.\n\nWith `nullptr`, it suddenly becomes feasible to change\
    \ what null is for a particular operating environment without making changes to\
    \ any C++ code that has fully adopted `nullptr`. The compiler can take a comparison\
    \ with `nullptr`, or the assignment of `nullptr` to a pointer variable, and generate\
    \ whatever machine code the target environment requires from it. Trying to do\
    \ the same with a binary 0 would be very difficult, if not impossible. If in the\
    \ future someone decides to design a computer architecture and operating system\
    \ that adds a null flag bit for all memory addresses to designate null, modern\
    \ C++ could support that because of `nullptr`.\n\n### Strange-Looking Boolean\
    \ Equality Checks\n\nYou will commonly see people write code such as `if (nullptr\
    \ == p_a) { ... }`. I have not followed that style in the samples because it simply\
    \ looks wrong to me. In the 18 years I have been writing programs in C and C++,\
    \ I have never had a problem with the issue this style avoids. Nonetheless, other\
    \ people have had such problems. This style might possibly be part of the style\
    \ rules you are required to follow; therefore, it is worth discussing.\n\nIf you\
    \ wrote `if (p_a = nullptr) { ... }` instead of `if (p_a == nullptr) { ... }`,\
    \ then your program would assign the null value to `p_a` and the `if` statement\
    \ would always evaluate to false. C++, owing to its C heritage, allows you to\
    \ have an expression that evaluates to any integral type within the parentheses\
    \ of a control statement, such as `if`. C# requires that the result of any such\
    \ expression be a Boolean value. Since you cannot assign a value to something\
    \ like `nullptr` or to constant values, such as 3 and 0.0F, if you put that rvalue\
    \ on the left side of an equality check, the compiler will alert you to the error.\
    \ This is because you would be assigning a value to something that cannot have\
    \ a value assigned to it.\n\nFor this reason, some developers have taken up writing\
    \ their equality checks this way. The important part is not which style you choose,\
    \ but that you are aware that an assignment inside of something such as an `if`\
    \ expression is valid in C++. That way, you know to look out for such problems.\n\
    \nWhatever you do, do not intentionally write statements like `if (x = 3) { ...\
    \ }`. That is very bad style, which makes your code harder to understand and more\
    \ prone to developing bugs.\n\n### `throw()` and `noexcept(bool expression)`\n\
    \n![](img/e4d68f5a79326a8404dad75080806b64_106_0.png)\n\n> **Note:** As of Visual\
    \ Studio 2012 RC, the [Visual C++ compiler accepts but does not implement exception\
    \ specifications](#). However, if you include a `throw()` exception specification,\
    \ the compiler will likely optimize away any code it would otherwise generate\
    \ to support unwinding when an exception is thrown. Your program may not run properly\
    \ if an exception is thrown from a function marked with `throw()`. Other compilers\
    \ that do implement `throw` specifications will expect them to be marked\n"
