    \ 及相关接口具有相同的目的，例如提供一种遍历集合的通用方式。例如，给定一个 `std::vector`，你可以使用以下代码循环访问其项集合：\n\n```cpp\n\
    vector<int> vec;\nvec.push_back(1);\nvec.push_back(4);\nvec.push_back(7);\nvec.push_back(12);\n\
    vec.push_back(8);\n\nfor (auto i = begin(vec); i != end(vec); i++)\n{\n    wcout\
    \ << *i << endl;\n}\n```\n\n`std::begin` 函数提供一个指向集合第一项的迭代器。`std::end` 提供一个迭代器，用于表示我们已经到达集合末尾；假设集合中有项，那么集合的最后一项就是\
    \ `std::end` 所给项之前的一项。这就是我们在 `for` 循环中检查 `!=` 的原因。如果集合中没有项，那么 `std::begin` 和 `std::end`\
    \ 将返回相同的值。\n\n除了来自这两个模板函数的迭代器之外，许多集合还通过名为 `cbegin` 和 `cend` 的成员函数提供迭代器，通过 `rbegin`\
    \ 和 `rend` 提供反向迭代器（向后遍历集合），并通过 `crbegin` 和 `crend` 提供常量反向迭代器。在前面的示例中，你可以将 `begin(vec)`\
    \ 替换为 `vec.rbegin()`，将 `end(vec)` 替换为 `vec.rend()`，以反向遍历该 vector。\n\n### 基于范围的\
    \ for 循环\n\nC++11 增加了一种额外的 for 循环类型，称为基于范围的 for 循环，它提供的功能类似于 C# 中的 `foreach` 循环。基于范围的\
    \ for 循环使用迭代器，免去了解引用指针的麻烦，也避免了错误检查结束位置的可能性。与上一示例中的 for 循环等价的基于范围的 for 循环如下所示：\n\
    \n```cpp\nfor (auto item : vec)\n{\n    wcout << item << endl;\n}\n```\n\n"
