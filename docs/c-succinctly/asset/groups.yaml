    \ a call to `std::terminate` or an unhandled exception. The default handler calls\
    \ the abort function from the `<cstdlib>` header file.\n\nThe `<stdexcept>` header\
    \ provides a rudimentary framework for exceptions. It defines two classes that\
    \ inherit from `std::exception`. Those two classes serve as the parent class for\
    \ several other classes.\n\nThe `std::runtime_error` class is the parent class\
    \ for exceptions thrown by the runtime or due to a mistake in a C++ Standard Library\
    \ function. Its children are the `std::overflow_error` class, the `std::range_error`\
    \ class, and the `std::underflow_error` class.\n\nThe `std::logic_error` class\
    \ is the parent class for exceptions thrown due to programmer error. Its children\
    \ are the `std::domain_error` class, the `std::invalid_argument` class, the `std::length_error`\
    \ class, and the `std::out_of_range` class.\n\nYou can derive from these classes\
    \ or create your own exception classes. Coming up with a good exception hierarchy\
    \ is a difficult task. On one hand, you want exceptions that will be specific\
    \ enough that you can handle all the exceptions based on your knowledge at build-time.\
    \ On the other hand, you do not want an exception class for each error that could\
    \ occur. Your code would end up bloated and unwieldy, not to mention the waste\
    \ of time matching catchholders for every exception class.\n\nSpend time at a\
    \ whiteboard, or with a pen and paper, or however you want thinking about the\
    \ exception tree your application should have.\n\nThe following sample contains\
