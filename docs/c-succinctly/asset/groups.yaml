    \    return m_toppingsString.c_str();\n}\n```\n\n## 第 10 章 C++ 语言用法与惯用法\n\n###\
    \ 概述\n\n我们已讨论过 RAII 惯用法。C++ 中的一些语言用法和编程惯用法乍看可能显得陌生或毫无意义，但它们确实有其目的。在本章中，我们将探讨其中一些奇怪的用法和惯用法，以理解它们的由来以及为何使用它们。\n\
    \n### 递增与递减\n\n你经常会看到 C++ 使用 ++i 而不是 i++ 的语法来递增整数。其原因部分源于历史，部分出于实用，部分则像一种秘密暗号。常见出现位置之一是在\
    \ for 循环中（例如 for (int i = 0; i < someNumber; i++) { ... }）。为什么 C++ 程序员使用 ++i 而不是\
    \ i++？让我们考虑这两个运算符的含义。\n\n```cpp\nint i = 0;\nint x = ++i;\nint y = i++;\n```\n\
    \n在前面的代码中，当三条语句全部执行完毕后，i 将等于 2。但 x 和 y 将等于多少？它们都将等于 1。这是因为语句 ++i 中的前置递增运算符表示“递增\
    \ i，并将 i 的新值作为结果”。因此，在给 x 赋值时，i 从 0 变为 1，而 i 的新值 1 被赋给 x。语句 i++ 中的后置递增运算符表示“递增\
    \ i，并将 i 的原始值作为结果”。因此，在给 y 赋值时，i 从 1 变为 2，而 i 的原始值 1 被赋给 y。\n\n如果我们按所写内容逐步分解该指令序列，消除前置递增和后置递增运算符，并用普通加法替换它们，就会意识到，为了执行对\
    \ y 的赋值，我们需要一个额外的变量来保存 i 的原始值。结果将类似下面这样：\n\n```cpp\nint i = 0;\n\n// int x = ++i;\n\
    i = i + 1;\nint x = i;\n\n// int y = i++;\nint magicTemp = i;\ni = i + 1;\nint\
    \ y = magicTemp;\n```\n\n事实上，早期的编译器曾这样做。现代编译器现在会判定，先给 y 赋值不存在可观察的副作用，因此它们生成的汇编代码即使未优化，通常也会类似于以下\
    \ C++ 代码的汇编语言等价形式：\n\n```cpp\nint i = 0;\n\n// int x = ++i;\ni = i + 1;\n```\n\
    \nC++11 新增了一个关键字 `nullptr`，当你需要将空值赋给指针或检查指针是否为空时，可以而且应该用它代替 0、NULL 以及其他任何东西。使用它有若干充分理由。\n\
    \n`nullptr` 关键字是一种语言关键字；它不会被预处理器消除。由于它会传递到编译器，编译器可以检测错误并生成使用警告，而使用字面量 0 或任何宏时，它无法检测或生成这些警告。\n\
    \n它也不能被意外或有意重定义，不像 NULL 这样的宏。这消除了宏可能引入的所有错误。\n\n最后，它提供了面向未来的保障。将二进制零作为空值在当时是一个实用决定，但无论如何它是任意的。另一个合理选择可能是将空值设为无符号原生整数的最大值。这样的值有利有弊，但据我所知，没有什么会使其不可用。\n\
    \n有了 `nullptr`，突然就可以在不对任何已完全采用 `nullptr` 的 C++ 代码进行更改的情况下，改变特定运行环境中空值是什么。编译器可以接受与\
    \ `nullptr` 的比较，或将 `nullptr` 赋给指针变量的赋值，并据此生成目标环境所需的任何机器代码。试图用二进制 0 做同样的事情即使并非不可能，也会非常困难。如果将来有人决定设计一种计算机体系结构和操作系统，为所有内存地址增加一个空标志位来表示空值，那么现代\
    \ C++ 由于 `nullptr` 而可以支持这一点。\n\n### 看起来奇怪的布尔相等性检查\n\n你经常会看到人们编写类似 `if (nullptr\
    \ == p_a) { ... }` 的代码。我在示例中没有遵循那种风格，因为它在我看来就是错的。在我用 C 和 C++ 编写程序的 18 年里，我从未遇到过这种风格所避免的问题。尽管如此，其他人遇到过此类问题。这种风格可能属于你被要求遵循的风格规则的一部分；因此，值得讨论。\n\
    \n如果你写成 `if (p_a = nullptr) { ... }` 而不是 `if (p_a == nullptr) { ... }`，那么程序会将空值赋给\
    \ `p_a`，并且 `if` 语句将始终求值为 false。C++ 由于其 C 语言传统，允许在控制语句（例如 `if`）的括号内使用求值为任意整型的表达式。C#\
    \ 要求任何此类表达式的结果必须是布尔值。由于你不能给 `nullptr` 之类的东西或常量值（例如 3 和 0.0F）赋值，如果你将该右值放在相等性检查的左侧，编译器就会提醒你这个错误。这是因为你会在给不能赋值的东西赋值。\n\
    \n出于这个原因，一些开发者开始用这种方式编写相等性检查。重要的不是选择哪种风格，而是你要意识到，在诸如 `if` 表达式这样的结构中，赋值在 C++ 中是合法的。这样，你就知道要留意此类问题。\n\
    \n无论你做什么，都不要有意编写类似 `if (x = 3) { ... }` 的语句。那是非常糟糕的风格，会使你的代码更难理解，也更容易产生 bug。\n\
    \n### `throw()` 和 `noexcept(bool expression)`\n\n![](img/e4d68f5a79326a8404dad75080806b64_106_0.png)\n\
    \n> **注意：** 截至 Visual Studio 2012 RC，[Visual C++ 编译器接受但不实现异常规范](#)。但是，如果你包含 `throw()`\
    \ 异常规范，编译器很可能会优化掉它原本会生成的、用于在抛出异常时支持栈展开的任何代码。如果从标记为 `throw()` 的函数中抛出异常，你的程序可能无法正常运行。其他确实实现了\
    \ `throw` 规范的编译器会期望它们被标记\n"
