    Well, we inherit from B before we inherit from the other classes. So that could
    be it, but why doesn''t D become initialized right after B? It''s because D is
    directly inherited while C is virtually inherited. The virtuals come first.


    Here are the rules:


    +   1. Virtual base classes are constructed in a left-to-right order as they are
    written in the list of base classes.

    +   2. If you do not call a specific constructor for a base class you have virtually
    inherited from, the compiler will automatically call its default constructor at
    the appropriate time.

    +   3. When determining the order of base classes to construct, base classes are
    initialized before their derived classes.

    +   4. When virtual base classes have all been constructed, then direct base classes
    are constructed in their left-to-right declaration order—the same as virtual base
    classes.

    +   5. When all of its base classes have been constructed, a member variable of
    a class is:

    +      - Default-initialized if there is no initializer for it.

    +      - Value-initialized if the initializer is an empty set of parentheses.

    +      - Initialized to the result of the expression within the initializer''s
    parentheses.

    +   6. Member variables are initialized in the order they are declared in the
    class definition.

    +   7. When all the initializers in a constructor have run, any code inside the
    constructor''s body will be executed.


    When you put all of these rules together, you initially find the order B, C, D
    because B and C have virtual inheritance and thus come before D. Then we add A
    before B because B derives from A. So we end up with A, B, C, D.


    Because of the rule that base classes are initialized before derived classes,
    and because A comes in through virtual inheritance, A is initialized with its
    default constructor before we even get to its initializer in the B constructor
    that we call. Once we do get to the B constructor, because A is already initialized,
    its initializer in the B constructor is simply ignored.


    Class B''s member variables are initialized in the order m_a, m_b because that
    is the order they are declared in the class, even though in the constructor we
    list their initializations in the opposite order.


    > > **Default Initialization and Value Initialization**

    > >

    > > Default initialization gives no initialization for fundamental types and for
    pointers. It calls the default constructor for class types. Integers, pointers,
    and the like will just have arbitrary values.

    > >

    > > Value initialization initializes fundamental types to zero or the equivalent
    (e.g., false for bool and null for pointers). It calls the default constructor
    for class types.


