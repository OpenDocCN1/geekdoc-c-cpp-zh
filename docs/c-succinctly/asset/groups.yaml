    \ 中，作用域解析运算符是 `::`。我们稍后会更详细地讨论它。现在，只需把它看作承担与 C# 中 `.` 运算符许多相同用途的运算符。\n\n这段代码将产生以下输出：\n\
    \n```text\nFlavor is Mint (3). Color is Orange (1).\nThe size of Flavor is 2.\n\
    The size of Color is 4.\n```\n\n正如你在示例中看到的，有作用域的 Color 枚举要求你像 C# 一样访问其成员：在枚举成员前加上枚举名称和作用域解析运算符。相比之下，无作用域的\
    \ Flavor 枚举允许你直接指定成员，无需任何前缀。因此，我认为更好的做法是优先使用有作用域枚举：这样可以最大程度降低命名冲突的风险，并减少命名空间污染。\n\
    \n注意，有作用域枚举还有另一个区别：当我们想输出有作用域 Color 枚举的数值时，必须使用 static_cast 运算符将其转换为 int，而对于无作用域的\
    \ Flavor 枚举，我们不需要做任何强制转换。\n\n对于 Flavor 枚举，我们将底层类型指定为 unsigned short int。你也可以为有作用域枚举指定底层类型。指定底层类型是可选的，但如果你想对无作用域枚举使用前向声明，则必须指定。前向声明是一种加快程序编译时间的方法：它只告诉编译器关于某个类型它需要知道的信息，而不是强制编译器编译定义该类型的整个头文件。\n\
    \n我们稍后会讨论这一点。现在，只需记住：无作用域枚举要使用其前向声明，必须显式指定其底层类型；有作用域枚举使用前向声明则不要求指定其底层类型（如果未指定，底层类型将是\
    \ int）。\n\n"
