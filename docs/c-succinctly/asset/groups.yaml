    C++11 has added a new keyword, `nullptr`, which can and should be used in place
    of 0, NULL, and anything else when you need to assign a null value to a pointer
    or check to see if a pointer is null. There are several good reasons to use it.


    The `nullptr` keyword is a language keyword; it is not eliminated by the preprocessor.
    Since it passes through to the compiler, the compiler can detect errors and generate
    usage warnings that it couldn’t detect or generate with the literal 0 or any macros.


    It also cannot be redefined either accidentally or intentionally, unlike a macro
    such as NULL. This eliminates all the errors that macros can introduce.


    Lastly, it provides future proofing. Having binary zero as the null value was
    a practical decision when it was made, but it was arbitrary nonetheless. Another
    reasonable choice might have been to have null be the max value of an unsigned
    native integer. There are positives and negatives to such a value, but there’s
    nothing I know of that would have made it unusable.


    With `nullptr`, it suddenly becomes feasible to change what null is for a particular
    operating environment without making changes to any C++ code that has fully adopted
    `nullptr`. The compiler can take a comparison with `nullptr`, or the assignment
    of `nullptr` to a pointer variable, and generate whatever machine code the target
    environment requires from it. Trying to do the same with a binary 0 would be very
    difficult, if not impossible. If in the future someone decides to design a computer
    architecture and operating system that adds a null flag bit for all memory addresses
    to designate null, modern C++ could support that because of `nullptr`.


    # ## Strange-Looking Boolean Equality Checks


    You will commonly see people write code such as `if (nullptr == p_a) { ... }`.
    I have not followed that style in the samples because it simply looks wrong to
    me. In the 18 years I have been writing programs in C and C++, I have never had
    a problem with the issue this style avoids. Nonetheless, other people have had
    such problems. This style might possibly be part of the style rules you are required
    to follow; therefore, it is worth discussing.


    If you wrote `if (p_a = nullptr) { ... }` instead of `if (p_a == nullptr) { ...
    }`, then your program would assign the null value to `p_a` and the `if` statement
    would always evaluate to false. C++, owing to its C heritage, allows you to have
    an expression that evaluates to any integral type within the parentheses of a
    control statement, such as `if`. C# requires that the result of any such expression
    be a Boolean value. Since you cannot assign a value to something like `nullptr`
    or to constant values, such as 3 and 0.0F, if you put that R-value on the left
    side of an equality check, the compiler will alert you to the error. This is because
    you would be assigning a value to something that cannot have a value assigned
    to it.


    For this reason, some developers have taken up writing their equality checks this
    way. The important part is not which style you choose, but that you are aware
    that an assignment inside of something such as an `if` expression is valid in
    C++. That way, you know to look out for such problems.


    Whatever you do, do not intentionally write statements like `if (x = 3) { ...
    }`. That is very bad style, which makes your code harder to understand and more
    prone to developing bugs.


