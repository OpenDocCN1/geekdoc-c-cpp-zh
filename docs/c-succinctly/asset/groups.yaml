    \    m_description.append(L\".\");\n\n    return m_description.c_str();\n}\n\n\
    Sandwich::Sandwich(void)\n    : m_pImpl(new SandwichImpl())\n{\n}\n\nSandwich::~Sandwich(void)\n\
