    # std::vector and Other Containers


    The collection you are likely to use most is `std::vector`. It is a fast, general-purpose
    collection similar to `List<T>` in .NET. It is found in the `<vector>` header
    file.


    To add an item to the end of a vector, use the member function `push_back`. To
    remove an item from the end of a vector, use `pop_back`. You can access items
    at their index using `[]` the same way you would an array. To add an element or
    range of elements at a specific zero-based index, use the `insert` member function.
    To remove an element or range of elements at a specific zero-based index, use
    the `erase` member function.


    A neat feature added in C++11 is the in-place construction functionality provided
    by the `emplace` and `emplace_back` member functions. Rather than constructing
    an object and then using `insert` or `push_back` to add it to the vector, you
    can call `emplace_back` and simply pass it the same arguments you would pass to
    the constructor for the type that the vector will hold. The vector will then construct
    and add a new instance of the object without the extra calculations that come
    with a copy or a move, and without using extra local memory.


    The `emplace` function works the same, except you start by passing it an iterator
    that specifies the location. You can use `c`begin()` or `c`end()` to add items
    to the beginning or end of the vector. If you have a specific zero-based index
    you want to emplace an item at, you can use `c.begin() + idx`. You can also subtract
    from `c.end()` if you want to place an item some number of spaces from the end.


    `vector` offers more functionality, so you should definitely explore it further.
    The `at` member function will give you an item at an index, for example. There
    are ways to tell the vector to resize its internal capacity so you have more room
    free—if you knew you would need exactly 125 items, for instance—or so you minimize
    memory usage—if you added all the elements it will ever need and memory constraints
    are tight.


    In addition to `std::vector`, several similar containers have different use cases.
    `std::vector` itself is the best choice when you need extremely fast, random access—when
    you will mostly be adding items to and removing items from the very end of the
    collection. If you also need to add items frequently to the front of the collection,
    you should consider using `std::deque` instead.


    Use `std::queue` for a first-in, first-out container. Use `std::stack` for a last-in,
    first-out container.


    The `std::map` class provides a sorted dictionary. `std::unordered_map` provides
    a hash table.


    The `std::set` class is a sorted, keyed collection where the item stored is its
    own key, so each element must be unique. `std::unordered_set` is the unsorted
    equivalent of `std::set`.


    The `std::list` class provides a doubly linked list. `std::forward_list` provides
    a singly linked list.


    # The `<algorithm>` Header


    The `<algorithm>` header contains many very useful functions: things such as find,
    sort, copy, and all their related methods. The best way to learn them is to experiment
    with them.


    # The C Run-Time Library (CRT)


    Some functionality from the C Runtime Library can be useful. Generally, the best
    way to access the library is to include the relevant `<c_____>` header file, such
    as `<cstdlib>`.'
