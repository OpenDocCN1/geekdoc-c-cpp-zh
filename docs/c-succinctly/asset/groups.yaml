    \n## Introduction\n\n*C++ Succinctly* was written to help professional C# developers\
    \ learn modern C++ programming. The aim of this book is to leverage your existing\
    \ C# knowledge in order to expand your skills. Whether you need to use C++ in\
    \ an upcoming project, or simply want to learn a new language (or reacquaint yourself\
    \ with it), this book will help you learn all of the fundamental pieces of C++\
    \ so you can understand projects and samples written in C++ and begin writing\
    \ your own C++ programs.\n\nAs with any large subject, there simply wasn’t room\
    \ to cover everything (an example being the new atomic features added in C++11),\
    \ and others might have decided to order the topics differently. I’m thinking\
    \ particularly of pointers, a topic I cover in depth only further into the book.\
    \ They are important, so some might have chosen to cover them earlier, but I feel\
    \ you do not need to understand pointers to understand the material that precedes\
    \ their coverage; understanding the preceding topics will make it much easier\
    \ for you to understand them.\n\nI’ve done my best to be as accurate as possible\
    \ without sounding like a language specification or documentation file. I hope\
    \ I have succeeded. I consulted the C++11 language specification frequently while\
