    \ if your code needs to be compiled with another compiler.\n\n> **Note:** Exception\
    \ specifications using the `throw()` syntax (called dynamic-exception specifications)\
    \ are deprecated as of C++11. As such, they may be removed from the language in\
    \ the future. The `noexcept` specification and operator are replacements for this\
    \ language feature but are not implemented in Visual C++ as of Visual Studio 2012\
    \ RC.\n\nC++ functions can specify via the `throw()` exception specification keyword\
    \ whether or not to throw exceptions, and if so, what kind to throw.\n\nFor example,\
    \ `int AddTwoNumbers(int, int) throw();` declares a function that, due to the\
    \ empty parentheses, states it does not throw any exceptions, excluding those\
    \ it catches internally and does not re-throw. By contrast, `int AddTwoNumbers(int,\
    \ int) throw(std::logic_error);` declares a function that states it can throw\
    \ an exception of type `std::logic_error`, or any type derived from that.\n\n\
    The function declaration `int AddTwoNumber(int, int) throw(...);` declares that\
    \ it can throw an exception of any type. This syntax is Microsoft-specific, so\
    \ you should avoid it for code that may need to be compiled with something other\
    \ than the Visual C++ compiler.\n\nIf no specifier appears, such as in `int AddTwoNumbers(int,\
    \ int);`, then the function can throw any exception type. It is the equivalent\
    \ of having the `throw(...)` specifier.\n\nC++11 added the `noexcept(bool expression)`\
    \ specification and operator. Visual C++ does not support these as of Visual Studio\
    \ 2012 RC, but we will discuss them briefly since they will undoubtedly be added\
    \ in the future.\n\nThe specifier `noexcept(false)` is the equivalent of both\
    \ `throw(...)` and of a function without a throw specifier. For example, `int\
    \ AddTwoNumbers(int, int) noexcept(false);` is the equivalent of both `int AddTwoNumbers(int,\
    \ int) throw(...);` and `int AddTwoNumbers(int, int);`.\n\nThe specifiers `noexcept(true)`\
    \ and `noexcept` are the equivalent of `throw()`. In other words, they all specify\
    \ that the function does not allow any exceptions to escape from it.\n\nWhen overriding\
    \ a virtual member function, the exception specification of the override function\
    \ in the derived class cannot specify exceptions beyond those declared for the\
    \ type it is overriding. Let’s look at an example.\n\n```\n```cpp\n#include <stdexcept>\n\
    #include <exception>\n\nclass A\n{\npublic:\n        A(void) throw(...);\n   \
    \     virtual ~A(void) throw();\n\n        virtual int Add(int, int) throw(std::overflow_error);\n\
    \        virtual float Add(float, float) throw();\n        virtual double Add(double,\
    \ double) throw(int);\n};\n\nclass B : public A\n{\npublic:\n        B(void);\
    \ // Fine, since not having a throw is the same as throw(...).\n```\n```"
