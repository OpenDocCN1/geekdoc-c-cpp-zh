    \ namespace std;\n\n// We can make any changes we want to the implementation class\
    \ without\n// triggering a recompile of other source files that include Sandwich.h\
    \ since\n// SandwichImpl is only defined in this source file. Thus, only this\
    \ source\n// file needs to be recompiled if we make changes to SandwichImpl.\n\
    class SandwichImpl\n{\npublic:\n        SandwichImpl();\n        ~SandwichImpl();\n\
    \n        void AddIngredient(const wchar_t* ingredient);\n        void RemoveIngredient(const\
    \ wchar_t* ingredient);\n        void SetBreadType(const wchar_t* breadType);\n\
    \n        const wchar_t* GetSandwich(void);\n\nprivate:\n        vector<wstring>\
    \         m_ingredients;\n        wstring                 m_breadType;\n     \
    \   wstring                 m_description;\n};\n\nSandwichImpl::SandwichImpl()\n\
    {\n}\n\nSandwichImpl::~SandwichImpl()\n{\n}\n\nvoid SandwichImpl::AddIngredient(const\
