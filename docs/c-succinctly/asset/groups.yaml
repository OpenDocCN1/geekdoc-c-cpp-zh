  mdcn: "\n因此，如果你的代码需要使用其他编译器进行编译，就应当实现正确的异常规范。\n\n> **注意：** 使用 `throw()` 语法（称为动态异常规范）的异常规范从\
    \ C++11 起已弃用。因此，将来可能会从语言中移除它们。`noexcept` 规范与运算符是此语言特性的替代方案，但截至 Visual Studio 2012\
    \ RC，Visual C++ 尚未实现它们。\n\nC++ 函数可以通过 `throw()` 异常规范关键字来指定是否抛出异常，以及如果抛出，则抛出何种类型的异常。\n\
    \n例如，`int AddTwoNumbers(int, int) throw();` 声明了一个函数；由于空括号，它表示该函数不抛出任何异常，但不包括它在内部捕获且不再重新抛出的异常。相比之下，`int\
    \ AddTwoNumbers(int, int) throw(std::logic_error);` 声明了一个函数，表示它可以抛出 `std::logic_error`\
    \ 类型的异常，或任何派生自该类型的异常。\n\n函数声明 `int AddTwoNumbers(int, int) throw(...);` 声明它可以抛出任意类型的异常。此语法是\
    \ Microsoft 专用的，因此对于可能需要使用 Visual C++ 编译器以外的编译器进行编译的代码，应避免使用它。\n\n如果未出现说明符，例如\
    \ `int AddTwoNumbers(int, int);`，则该函数可以抛出任何异常类型。这等同于具有 `throw(...)` 说明符。\n\nC++11\
    \ 添加了 `noexcept(bool expression)` 规范与运算符。截至 Visual Studio 2012 RC，Visual C++ 不支持这些内容，但我们会简要讨论它们，因为将来无疑会添加它们。\n\
    \n说明符 `noexcept(false)` 等同于 `throw(...)`，也等同于没有 throw 说明符的函数。例如，`int AddTwoNumbers(int,\
    \ int) noexcept(false);` 等同于 `int AddTwoNumbers(int, int) throw(...);` 和 `int\
    \ AddTwoNumbers(int, int);`。\n\n说明符 `noexcept(true)` 和 `noexcept` 等同于 `throw()`。换句话说，它们都指定该函数不允许任何异常从其中逃逸。\n\
    \n重写虚成员函数时，派生类中重写函数的异常规范不能指定超出它所重写类型所声明异常的异常。让我们看一个示例。\n\n```cpp\n#include <stdexcept>\n\
    #include <exception>\n\nclass A\n{\npublic:\n        A(void) throw(...);\n   \
    \     virtual ~A(void) throw();\n\n        virtual int Add(int, int) throw(std::overflow_error);\n\
    \        virtual float Add(float, float) throw();\n        virtual double Add(double,\
    \ double) throw(int);\n};\n\nclass B : public A\n{\npublic:\n        B(void);\
    \ // Fine, since not having a throw is the same as throw(...).\n        virtual\
    \ ~B(void) throw(); // Fine since it matches ~A.\n\n        // The int Add override\
    \ is fine since you can always throw less in\n        // an override than the\
    \ base says it can throw.\n        virtual int Add(int, int) throw() override;\n\
    \n        // The float Add override here is invalid because the A version says\n\
    \        // it will not throw, but this override says it can throw an\n      \
    \  // std::exception.\n        virtual float Add(float, float) throw(std::exception)\
    \ override;\n\n        // The double Add override here is invalid because the\
    \ A version says\n        // it can throw an int, but this override says it can\
    \ throw a double,\n        // which the A version does not specify.\n        virtual\
    \ double Add(double, double) throw(double) override;\n};\n```\n\n由于 throw 异常规范语法已弃用，为了指定某个特定函数不抛出异常，你应只使用其空括号形式\
    \ `throw()`；否则，就不要使用它。如果你想让其他人知道你的函数可能抛出哪些异常，可以考虑在头文件或其他文档中使用注释，并确保这些注释保持最新。\n\
    \n`noexcept(bool expression)` 也是一个运算符。作为运算符使用时，它接受一个表达式；如果该表达式不能抛出异常，则求值为 true，如果可能抛出异常，则求值为\
    \ false。请注意，结果只是一次简单求值；它会检查所调用的所有函数是否都是 noexcept(true)，以及表达式中是否存在任何 throw 语句。如果发现任何\
    \ throw 语句，即使你知道它们不可达（例如，if (x % 2 < 0) { throw \"This computer is broken\"; }），它仍可能求值为\
    \ false，因为编译器不需要进行深层分析。\n\n## Pimpl（指向实现的指针）\n\n指向实现的指针惯用法是一种较老的技术，但在 C++ 中一直备受关注。这是好事，因为它非常有用。该技术的本质是：在头文件中定义类的公共接口。你唯一的数据成员是一个私有指针，指向一个前向声明的类或结构（包装在\
    \ std::unique_ptr 中，以实现异常安全的内存处理），它将作为实际实现。\n\n在源文件中，你定义这个实现类及其所有成员函数和成员数据。接口中的公共函数会调用实现类来获得其功能。结果是，一旦确定了类的公共接口，头文件就永远不需要更改。因此，包含该头文件的源文件不会因为不影响公共接口的实现更改而需要重新编译。\n\
    \n每当你想要更改实现时，唯一需要重新编译的是包含该实现类的源文件，而不是每个包含该类头文件的源文件。\n\n下面是一个简单示例。\n\n### 示例：PimplSample\\\
    Sandwich.h\n\n```cpp\n#pragma once\n#include <memory>\n\nclass SandwichImpl;\n\
    \nclass Sandwich\n{\npublic:\n    Sandwich(void);\n    ~Sandwich(void);\n\n  \
    \      void AddIngredient(const wchar_t* ingredient);\n        void RemoveIngredient(const\
    \ wchar_t* ingredient);\n        void SetBreadType(const wchar_t* breadType);\n\
    \        const wchar_t * GetSandwich(void);\n\nprivate:\n        std::unique_ptr<SandwichImpl>\
