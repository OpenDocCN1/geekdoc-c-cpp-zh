    \n编译器确实关心声明和定义，并且非常关心你的程序是不是有效的 C++ 代码。然而，当它遇到一个函数时，并不需要知道这个函数做什么。它只需要知道函数签名是什么——例如\
    \ `int AddTwoNumbers(int, int);`。\n\n类、结构和联合也是如此；只要编译器知道声明（或者对于指针而言，仅仅知道那个特定标记是类、结构、联合或枚举），它就不需要任何定义。仅凭声明，它就知道你对\
    \ AddTwoNumbers 的调用在语法上是否正确，以及 class Vehicle; 确实是一个类，因此当它看到 Vehicle* v; 时，就能创建一个指向它的指针，而这正是它所关心的全部。\n\
    \n链接器确实关心定义。具体来说，它关心对于项目中的每个声明，都存在一个且仅一个与之匹配的定义。唯一的例外是内联函数，它们最终会在使用它们的每个编译单元中被创建。不过，它们的创建方式会避免任何多重定义问题。\n\
    \n在程序的各编译单元之间，你可以有重复的声明；只要只有一个定义与某个声明匹配（内联函数除外），这样做就是缩短构建时间的常见技巧。为了确保满足这一单一定义规则，C++\
    \ 编译器往往会使用一种称为名称修饰的机制。\n\n这确保每个声明都与其正确的定义匹配，并处理诸如重载函数和命名空间（当使用位于不同命名空间时，命名空间允许重用同一名称）之类的问题，以及嵌套在类、结构或联合中的类、结构、联合和枚举定义。\n\
    \n正是这种名称修饰导致了可怕的链接器错误，我们将在[“内联成员函数”](#)一节中看到一个例子。\n\n声明与定义的可分离性使你无需每次重新编译每个源文件就能构建\
