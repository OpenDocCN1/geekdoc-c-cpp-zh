    \ ones that you know are unreachable, (e.g., if (x % 2 < 0) { throw \"This computer\
    \ is broken\"; }) it can, nonetheless, evaluate to false since the compiler is\
    \ not required to do a deep-level analysis.\n\n## Pimpl (Pointer to Implementation)\n\
    \nThe pointer-to-implementation idiom is an older technique that has been getting\
    \ a lot of attention in C++. This is good, because it is quite useful. The essence\
    \ of the technique is that in your header file you define your class’ public interface.\
    \ The only data member you have is a private pointer to a forward-declared class\
    \ or structure (wrapped in a std::unique_ptr for exception-safe memory handling),\
    \ which will serve as the actual implementation.\n\nIn your source code file,\
    \ you define this implementation class and all of its member functions and member\
    \ data. The public functions from the interface call into the implementation class\
    \ for its functionality. The result is that once you’ve settled on the public\
    \ interface for your class, the header file never changes. Thus, the source code\
    \ files that include the header will not need to be recompiled due to implementation\
    \ changes that do not affect the public interface.\n\nWhenever you want to make\
    \ changes to the implementation, the only thing that needs to be recompiled is\
    \ the source code file where that implementation class exists, rather than every\
    \ source code file that includes the class header file.\n\nHere is a simple sample.\n\
    \n### Sample: PimplSample\\Sandwich.h\n\n```cpp\n#pragma once\n#include <memory>\n\
