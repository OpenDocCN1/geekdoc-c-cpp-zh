  mdcn: "\n## std::move\n\nstd::move 函数可帮助你编写移动构造函数和移动赋值运算符。它位于 <utility> 头文件中。它接受单个参数，并以适合移动的条件返回该参数。传入的对象将作为右值引用返回，除非已为其禁用移动语义；在这种情况下，你会遇到编译器错误。\n\
    \n## 移动赋值运算符\n\n每当你为一个类编写移动构造函数时，也应该编写一个移动赋值运算符。该运算符的结果应当是：返回的值包含旧类的全部数据。可以在移动构造函数中调用一个正确的移动赋值运算符，以避免代码重复。\n\
    \n移动赋值运算符应采用以下声明：SomeClass& operator=(SomeClass&&);。\n\n## 移除复制或移动语义\n\n如果需要移除复制或移动语义，有两种方法。第一种，要移除复制语义，可以将复制构造函数和复制赋值运算符声明为\
    \ private，并且不实现它们。C++ 只在你尝试使用某个函数时才会关心它的实现。这样做之后，任何试图使用复制语义的程序在编译时都会失败，并产生错误消息，指出你试图使用该类的私有成员，而且它没有实现（如果你在类自身内部意外使用了它）。将构造函数和赋值运算符设为\
    \ private 的同一模式同样适用于移动语义。\n\n第二种方法是 C++11 新增的，截至 Visual Studio 2012 RC，Visual\
    \ C++ 尚不支持它。使用这种方法，你会将该功能声明为显式删除。例如，要显式删除复制构造函数，可以写 SomeClass(const SomeClass&)\
    \ = delete;。同样的 = delete 语法适用于赋值运算符、移动构造函数以及任何其他功能。然而，在 Visual C++ 支持它之前，你需要坚持使用第一种方法。\n\
    \n## 析构函数和虚析构函数\n\n任何作为另一个类的基类的类都应当具有虚析构函数。使用 virtual 关键字声明虚析构函数（例如：virtual ~SomeClass(void);）。这样，如果你将对象向下转型为其某个子类，然后销毁该对象，就会调用正确的析构函数，确保子类所捕获的所有资源都被释放。\n\
    \n正确的析构函数对 RAII 惯用法至关重要，我们很快会探讨它。绝不应允许在析构函数中抛出异常，除非你在析构函数内部捕获并处理该异常。如果存在无法处理的异常，应执行安全的错误日志记录，然后退出程序。可以使用\
    \ <exception> 头文件中的 std::terminate 函数来调用当前的终止处理程序。默认情况下，终止处理程序会调用 <cstdlib> 头文件中的\
    \ abort 函数。我们将在探讨 C++ 标准库异常时进一步讨论此功能。\n\n## 运算符重载\n\n运算符重载是 C++ 的一项强大的高级特性。你可以按类重载运算符，也可以使用独立函数全局重载运算符。C++\
    \ 中几乎每个运算符都可以重载。我们很快会看到重载复制赋值、移动赋值、&、| 和 |= 运算符的示例。有关可重载的其他运算符列表以及这些重载如何工作，我建议访问\
