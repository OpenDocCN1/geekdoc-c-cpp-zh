  - '[PAGE 93]


    # ## Const Pointer to Const


    A const pointer to const takes the form `const SomeClass* const someClass2 = &someClass1;`.
    Here, the * is sandwiched between two const keywords. The result is that the pointer
    cannot point to anything else, and you cannot modify the data it points to.


    # ## Const-correctness and Const Member Functions


    Const-correctness refers to using the const keyword to decorate both parameters
    and functions so the presence or absence of the const keyword properly conveys
    any potential side effects. You can mark a member function const by putting the
    const keyword after the declaration of the function''s parameters.


    For example, `int GetSomeInt(void) const;` declares a const member function—a
    member function that does not modify the data of the object it belongs to. The
    compiler will enforce this guarantee. It will also enforce the guarantee that
    when you pass an object into a function that takes it as const, that function
    cannot call any non-const member functions of that object.


    Designing your program to adhere to const-correctness is easier when you start
    doing it from the beginning. When you adhere to const-correctness, it becomes
    easier to use multithreading, since you know exactly which member functions have
    side effects. It''s also easier to track down bugs related to invalid data states.
    Others who are collaborating with you on a project will also be aware of potential
    changes to the class'' data when they call certain member functions.


    # ## The * & and -> Operators


    When working with pointers, including smart pointers, three operators are of interest:
    *, &, and ->.


    The indirection operator, *, de-references a pointer, meaning you work with the
    data that is pointed to, instead of the pointer itself. For the next few paragraphs,
    let''s assume that p_someInt is a valid pointer to an integer with no const qualifications.


    The statement `p_someInt = 500000;` would not assign the value 500000 to the integer
    that is pointed to. Instead, it would set the pointer to point to the memory address
    500000, 0X004C4B40 on a 32-bit system. What is at memory address 0X004C4B40? Who
    knows? It could be your integer, but chances are it is something else. If you
    are lucky, it is an invalid address. The next time you try to use p_someInt properly,
    your program will crash. If it is a valid data address though, then you will likely
    corrupt data.


    The statement `*p_someInt = 500000;` will assign the 500000 to the integer pointed
    to by p_someInt. This is the indirection operator in action; it takes p_someInt
    and replaces it with an L-value that represents the data at the address pointed
    to (we''ll discuss L-values soon).


    The address-of operator, &, fetches the address of a variable or a function. This
    allows you to create a pointer to a local object, which you can pass to a function
    that wants a pointer. You don''t even need to create a local pointer to do that;
    you can simply use your local variable with the address-of operator in front of
    it as the argument, and everything will work just fine.


    Pointers to functions are similar to delegate instances in C#. Given this function
    declaration: `double GetValue(int idx);` this would be the right function pointer:
    `double (*SomeFunctionPtr)(int);`.


    If your function returned a pointer, say like this: `int* GetIntPtr(void);` then
    this would be the right function pointer: `int* (*SomeIntPtrDelegate)(void);`.
    Don''t let the double asterisks bother you; just remember the first set of parentheses
    around the * and function pointer name so the compiler properly interprets this
    as a function pointer rather than a function declaration.


    The -> member access operator is what you use to access class members when you
    have a pointer to a class instance. It functions as a combination of the indirection
    operator and the . member access operator. So `p_someClassInstance->SetValue(10);`
    and `(*p_someClassInstance).SetValue(10);` both do the same thing.'
