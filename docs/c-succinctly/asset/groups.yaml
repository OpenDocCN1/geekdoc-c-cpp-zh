    ## std::vector 及其他容器


    你最可能使用的集合是 `std::vector`。它是一种快速、通用的集合，类似于 .NET 中的 `List<T>`。它位于 `<vector>` 头文件中。


    要向 vector 末尾添加项，请使用成员函数 `push_back`。要从 vector 末尾移除项，请使用 `pop_back`。你可以像使用数组一样，使用
    `[]` 按索引访问项。要在从零开始的特定索引处添加一个元素或一系列元素，请使用 `insert` 成员函数。要在从零开始的特定索引处移除一个元素或一系列元素，请使用
    `erase` 成员函数。


    C++11 增加的一个巧妙特性是由 `emplace` 和 `emplace_back` 成员函数提供的原地构造功能。与其先构造对象，再用 `insert`
    或 `push_back` 将其添加到 vector 中，你可以调用 `emplace_back`，并直接向它传入与传给该 vector 将保存类型的构造函数相同的参数。然后
    vector 会构造并添加该对象的新实例，而无需复制或移动附带的额外计算，也不会使用额外的局部内存。


    `emplace` 函数的工作方式相同，只是需要先向它传入一个指定位置的迭代器。你可以使用 `c.begin()` 或 `c.end()` 将项添加到 vector
    的开头或末尾。如果你希望将项原地构造在某个特定的从零开始索引处，可以使用 `c.begin() + idx`。如果你希望将项放在距离末尾若干位置处，也可以从
    `c.end()` 中减去。


    `vector` 提供了更多功能，因此你绝对应该进一步探索它。例如，`at` 成员函数会返回指定索引处的项。有些方法可以让 vector 调整其内部容量，以便腾出更多可用空间——例如，如果你确切知道自己将需要
    125 个项——或者以便最小化内存使用——如果你已经添加了它永远需要的所有元素，而内存约束又很紧张。


    除了 `std::vector`，还有几种类似容器具有不同的使用场景。当你需要极快的随机访问时——当你主要向集合最末尾添加项和从最末尾移除项时——`std::vector`
    本身是最佳选择。如果你还需要频繁向集合前端添加项，则应考虑改用 `std::deque`。


    使用 `std::queue` 作为先进先出容器。使用 `std::stack` 作为后进先出容器。


    `std::map` 类提供有序字典。`std::unordered_map` 提供哈希表。


    `std::set` 类是一个有序的键控集合，其中存储的项本身就是键，因此每个元素必须唯一。`std::unordered_set` 是 `std::set`
    的无序等价物。


    `std::list` 类提供双向链表。`std::forward_list` 提供单向链表。


    ## `<algorithm>` 头文件


    `<algorithm>` 头文件包含许多非常有用的函数：诸如 find、sort、copy 之类的函数及其所有相关方法。学习它们的最佳方式是亲自试验。


    ## C 运行时库（CRT）


    C 运行时库中的某些功能可能很有用。通常，访问该库的最佳方式是包含相关的 `<c...>` 头文件，例如 `<cstdlib>`。


    ## 第14章 Visual Studio 和 C++


    ### IntelliSense


    如果你使用几乎任何 Visual Studio 键盘映射，键入 Ctrl+J 都会调出 IntelliSense。在 Visual Studio 2012
    中，IntelliSense 在 C++ 中应自动出现。在 Visual Studio 2010 及更早版本中，你需要手动调用它。


    ### 代码片段


    代码片段是 Visual Studio 2012 中 C++ 的新功能。早期版本中没有这些功能。如果你从未在任何语言中使用过它们，那么在一个 C# 项目中，开始键入“for”以开始一个
    for 循环；一旦 IntelliSense 选择了 for 代码片段，按两次 Tab 键，然后观察一个 for 循环出现，并带有可编辑的自动字段。使用 Tab
    键在字段之间切换。完成字段编辑后，按 Enter。光标将被移动到循环体内，你所做的字段编辑会作为普通文本出现。


    对于根据枚举进行切换的 switch 语句，代码片段尤其方便，因为它们会自动用该枚举的所有成员填充 switch 语句。


    ### 包含库


    在 C++ 中，通常仅包含头文件是不够的。通常你需要告诉链接器链接到一个库，该库实现头文件中声明的代码。为此，你需要编辑项目属性，可通过 **项目** 菜单中的
    **项目名 属性...** 访问。


    在属性中，**配置属性 > 链接器 > 输入** 下有一个字段是 **附加依赖项**。这是一个以分号分隔的 **.LIB** 文件列表，这些文件是你需要链接的库。它应以
    `%(AdditionalDependencies)` 结尾，以便通过 MSBuild 链接的任何附加库都会被添加。


    例如，对于一个典型的 DirectX 11 Metro 风格游戏，你可能会看到以下内容：


    ```

    d2d1.lib; d3d11.lib; dxgi.lib; ole32.lib; windowscodecs.lib; dwrite.lib;

    xaudio2.lib; xinput.lib; mfcore.lib; mfplat.lib; mfreadwrite.lib; mfuuid.lib;

    %(AdditionalDependencies)

    ```


    如果你收到链接器错误，提示找不到你正在使用的某项内容的定义，请在 MSDN 上查找该函数或类；文档会同时告诉你需要的头文件和库文件。


    ### 生成汇编代码文件


    如果你想查看代码编译成的汇编代码的非常接近的近似结果，请在项目属性中的 **配置属性 > C/C++ > 输出文件** 下，将 **汇编输出** 选项设置为
    **无列表** 以外的某个值。


    我建议使用 **仅汇编列表 (/FA)** 或 **带源代码的汇编 (/FAs)**。**仅汇编列表** 会散布足够的行号注释，通常你可以将其与源文件交叉对照，以查看哪些
    C++ 代码对应哪段汇编代码。如果你希望在一个地方查看所有内容，而不必在打开 .ASM 文件的程序（我使用 Notepad++）和 Visual Studio
    之间来回切换，这会很有帮助。


    注意，生成的汇编使用 MASM 宏（可在 MSDN 上找到它们）。如果你不知道某条特定汇编指令的含义（例如 LEA），可以在互联网上搜索它，或从 Intel
    网站（假设是 x86/Itanium）、AMD 网站（假设是 x64）或 ARM Holdings 网站（假设是 ARM）下载相应的编程手册。如果你从未学过任何汇编，我绝对推荐你学一学（试着创建一个简单的
    Windows 控制台应用）。


    理解汇编能让你更好地理解计算机内部真正如何工作。将此与以下知识结合起来：计算机每次通电时都硬连线开始执行相同的代码（传统上是 PC 上的 BIOS，不过现在正被
    UEFI 取代），计算机如何以及为何工作的神秘感就会迅速消退。


    ### 可怕的生成错误


    如果你遇到一个看起来完全糟糕的生成错误，那很可能是来自链接器。例如，你会看到如下消息：


    ```

    Error    2    error LNK2019: unresolved external symbol "__thiscall

    SomeClass::SomeClass(wchar_t const *)" (??0SomeClass@@QAE@P?W@Z) referenced in

    function "void __cdecl DoSomething(void)" (?DoSomething@@YAXXZ)

    D:\VS2010\ProjCppSandbox\CppSandbox\CppSandbox.obj    CppSandbox

    ```


    它只是在说，它找不到你说它应该能找到的函数。在这个例子中，我在 CPP 文件中的构造函数定义里添加了 `inline` 关键字，却忘了把该定义移到头文件。任何内联函数都需要放在头文件中，这样链接器就不必再寻找它。


    那些 ?? 和 @@ 只是 C++ 在将代码编译到目标文件时修饰名称的方式。名称修饰对于相关编译器来说在内部是一致的，但 ISO/IEC 标准并未规定任何特定的名称修饰方案。不同的编译器可以、而且经常会以不同方式修饰名称。


    通常，如果你看到可怕的生成错误消息，那很可能是来自链接器，并且是未解析符号错误。如果它说找不到你编写的某项内容，请检查以确保头文件中的声明与定义匹配，定义通常在代码文件中，但也可能在头文件中；或者也许你忘了编写它，或者也许你将其声明为内联，却仍把它留在代码文件中。


    这方面的一个例子就是前一个案例：我的 `SomeClass::SomeClass(wchar_t const *)` 构造函数（我总是写 `const type`
    而不是 `type const`，所以甚至连这一点也被重构了）。


    如果是别人的函数或其他符号，那很可能你没有告诉链接器包含它的 .LIB 文件。


    在 .NET 中，你只需添加对程序集的引用，就能一次性获得声明部分和实际定义。在 C++ 中，声明是头文件，而定义代码——不包括内联代码，内联代码也需要位于头文件中——位于单独的库中。在
    MSDN 库中搜索缺失的符号，并找到需要添加的库文件的名称。


    C++ 生成错误可能看起来相当吓人，尤其是当你收到涉及模板的生成错误时。那些错误可能让你想放弃。但不要放弃。永远不要让可怕的错误消息获胜。首先，弄清楚它来自编译器（它将具有
    `C####` 错误号格式）还是链接器（`LNK####` 错误号格式）。


    如果来自编译器，通常意味着语法错误。检查你是否忘记在头文件顶部写 `#pragma once` 等问题。另一个问题可能是你使用了标准库中的某项内容（例如 `endl`），但忘记加上
    `using namespace std;`，或忘记给它加上 `std::` 前缀（即 `std::endl`）。


    你可以二者择一，也可以两者都做，但必须至少做一项。有些内容可能位于不同的命名空间中。例如，在 Visual Studio 2010 中，某些功能位于 `stdext`
    命名空间中。你自己代码中的任何命名空间也是如此。

    '
