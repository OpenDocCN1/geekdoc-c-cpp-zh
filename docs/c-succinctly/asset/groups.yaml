    \ 的做法；理解这一基本流程有助于理解 C++ 中许多你在 C# 中不会遇到的特殊之处。\n\n## 函数\n\nC++ 中有两类函数：独立函数和成员函数。它们的主要区别在于，成员函数属于类、结构或联合，而独立函数不属于。\n\
