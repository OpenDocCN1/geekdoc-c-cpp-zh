  mdcn: "\n当然，对于 VirtualClass 也是如此。尽管示例中总是小心地指定 virtual 并覆盖 VirtId 的默认行为（你也应该如此），但只要\
    \ A::VirtId 被声明为 virtual，那么所有具有相同签名的派生类都将被视为对 VirtId 的虚拟覆盖。\n\n前面的示例还演示了多重继承可能产生的菱形问题，以及虚拟继承如何解决该问题。菱形问题这个名称来源于这样一种想法：如果类\
    \ Z 派生自类 X 和类 Y，而这两个类又都派生自类 W，那么这种继承关系的图示看起来就像一个菱形。如果没有虚拟继承，这种继承关系实际上并不会形成菱形；相反，它会形成一个双叉叉，每个叉都拥有自己的\
    \ W 副本。\n\nNonVirtualClass 从 B1 和 B3 继承，其中 B1 虚拟继承自 A，而 B3 非虚拟继承自 A。这导致了菱形问题：A\
    \ 类成员数据的两份副本成为 NonVirtualClass 成员数据的一部分。DemonstrateNonVirtualInheritance 函数展示了由此产生的问题，也展示了当你需要使用\
    \ A 的某个成员时，用来解析你到底想要哪个 A 的语法。\n\nVirtualClass 虚拟继承自 B1 和 B2，而 B1 和 B2 也都虚拟继承自\
    \ A。由于从 VirtualClass 到 A 的所有继承链都是虚拟的，因此 A 的数据只有一份副本；这样就避免了菱形问题。DemonstrateVirtualInheritance\
    \ 函数展示了这一点。\n\n即使使用了虚拟继承，VirtualClass 仍然存在一个歧义。B1::Conflict 和 B2::Conflict 具有相同的名称和相同的参数（本例中都没有参数），因此如果不使用基类说明符语法，就无法解析你想要哪一个。\n\
    \n在处理多重继承时，如果想要避免歧义，命名非常重要。不过，有一种方法可以解决歧义。NonVirtualClass 中被注释掉的两个 using 声明展示了这种解析机制。如果我们决定总是以某种方式解决歧义，using\
    \ 声明可以让我们做到这一点。\n\n![](img/e4d68f5a79326a8404dad75080806b64_44_0.png)\n\n> *注意：using\
    \ 声明在类之外（例如在命名空间或函数中）也同样适用于解决歧义。如果你只想将命名空间中的某些类型引入作用域，而不想通过 using namespace 指令将整个命名空间引入作用域，它也非常有用。在头文件中使用\
    \ using 声明是可行的，前提是它位于类、结构体、联合或函数定义内部，因为 using 声明仅限于其所在的作用域。你不应在这类位置之外使用它们，因为那样你会将该类型引入全局命名空间或你所在任何命名空间的作用域中。*\n\
    \n在示例中我没有涉及的一点是除 public 之外的继承访问说明符。如果你愿意，可以编写类似 class B : protected A { ... }\
    \ 的代码。这样，类 A 的成员可以在 B 的方法内部访问，并且对从 B 派生的任何类也可访问，但不能公开访问。你也可以用 class B : private\
    \ A { ... }。这样，类 A 的成员可以在 B 的方法内部访问，但对从 B 派生的任何类不可访问，也不能公开访问。\n\n我顺带提到这些，仅仅是因为它们很少使用。不过，你可能会遇到它们，甚至可能找到它们的用途。如果是这样，请记住：私有继承自基类的类仍然可以完全访问该基类；你只是在说，任何进一步派生的类都不应有权访问基类的成员函数和变量。\n\
    \n更常见的是，你会遇到这样的错误：你或其他人忘记在基类说明符前输入 public，导致默认的私有继承。你可以通过大量错误消息来识别这个问题，这些消息告诉你无法访问某个基类的私有成员函数或数据，除非你正在编写库并且没有测试该类。在这种情况下，你会从用户的愤怒咆哮中意识到这个问题。这也是单元测试是个好主意的又一个原因。\n\
    \n## 抽象类\n\n抽象类至少有一个纯虚成员函数。下面的示例展示了如何模拟 C# 接口。\n\n### 示例：AbstractClassSample\\\
    IWriteData.h\n\n```cpp\n#pragma once\n\nclass IWriteData\n{\npublic:\n       \
    \ IWriteData(void) { }\n        virtual ~IWriteData(void) { }\n\n        virtual\
    \ void Write(const wchar_t* value) = 0;\n        virtual void Write(double value)\
    \ = 0;\n        virtual void Write(int value) = 0;\n\n        virtual void WriteLine(void)\
    \ = 0;\n        virtual void WriteLine(const wchar_t* value) = 0;\n        virtual\
    \ void WriteLine(double value) = 0;\n        virtual void WriteLine(int value)\
    \ = 0;\n};\n```\n\n### 示例：AbstractClassSample\\ConsoleWriteData.h\n\n```cpp\n\
    #pragma once\n\n#include \"IWriteData.h\"\n\nclass ConsoleWriteData :\n      \
    \  public IWriteData\n{\npublic:\n        ConsoleWriteData(void) { }\n       \
    \ virtual ~ConsoleWriteData(void) { }\n\n        virtual void Write(const wchar_t*\
    \ value);\n        virtual void Write(double value);\n        virtual void Write(int\
    \ value);\n\n        virtual void WriteLine(void);\n        virtual void WriteLine(const\
    \ wchar_t* value);\n        virtual void WriteLine(double value);\n        virtual\
    \ void WriteLine(int value);\n};\n```\n\n### 示例：AbstractClassSample\\ConsoleWriteData.cpp\n\
    \n```cpp\n#include <iostream>\n#include <ostream>\n#include \"ConsoleWriteData.h\"\
    \n\nusing namespace std;\n\nvoid ConsoleWriteData::Write(const wchar_t* value)\n\
    {\n        wcout << value;\n}\n\nvoid ConsoleWriteData::Write(double value)\n\
    {\n        wcout << value;\n}\n\nvoid ConsoleWriteData::Write(int value)\n{\n\
    \        wcout << value;\n}\n\nvoid ConsoleWriteData::WriteLine(void)\n{\n   \
    \     wcout << endl;\n}\n\nvoid ConsoleWriteData::WriteLine(const wchar_t* value)\n\
    {\n        wcout << value << endl;\n}\n\nvoid ConsoleWriteData::WriteLine(double\
    \ value)\n{\n        wcout << value << endl;\n}\n\nvoid ConsoleWriteData::WriteLine(int\
    \ value)\n{\n        wcout << value << endl;\n}\n```\n\n### 示例：AbstractClassSample\\\
    AbstractClassSample.cpp\n\n```cpp\n#include \"IWriteData.h\"\n#include \"ConsoleWriteData.h\"\
    \n#include \"../pchar.h\"\n\nint _pmain(int /*argc*/, pchar* /*argv*/[])\n{\n\
    \        /// The following line is illegal since IWriteData is abstract.\n   \
    \     //IWriteData iwd = IWriteData();\n\n        ///// The following line is\
    \ also illegal. You cannot have an\n        ///// instance of IWriteData.\n  \
    \      //IWriteData iwd = ConsoleWriteData();\n\n        ConsoleWriteData cwd\
    \ = ConsoleWriteData();\n\n        // You can create an IWriteData reference to\
    \ an instance of a class\n        // that derives from IWriteData.\n        IWriteData&\
    \ r_iwd = cwd;\n\n        // You can also create an IWriteData pointer to an instance\
    \ of a\n        // class that derives from IWriteData.\n        IWriteData* p_iwd\
    \ = &cwd;\n\n        cwd.WriteLine(10);\n        r_iwd.WriteLine(14.6);\n    \
    \    p_iwd->WriteLine(L\"Hello Abstract World!\");\n\n        return 0;\n}\n```\n\
    \n前面的示例演示了如何在 C++ 中实现接口风格的类。IWriteData 类可以被一个将数据写入日志文件、网络连接或任何其他输出的类继承。通过传递指向\
    \ IWriteData 的指针或引用，你可以轻松切换输出机制。\n\n抽象成员函数（称为纯虚函数）的语法很简单，就是在声明后面加上 = 0，如 IWriteData\
    \ 类中的：void Write(int value) = 0; 你不需要让一个类完全抽象；你可以实现成员函数，或包含对该类所有实例通用的成员数据。如果一个类哪怕只有一个纯虚函数，它就被视为抽象类。\n\
    \nVisual C++ 提供了一种 [Microsoft 特定的定义接口的方式](#)。以下是使用 Microsoft 语法的等价 IWriteData：\n\
    \n### 示例：AbstractClassSample\\IWriteData.h\n\n```cpp\n#pragma once\n\ninterface\
    \ IWriteData\n{\n    virtual void Write(const wchar_t* value) = 0;\n    virtual\
    \ void Write(double value) = 0;\n    virtual void Write(int value) = 0;\n\n  \
    \  virtual void WriteLine(void) = 0;\n    virtual void WriteLine(const wchar_t*\
    \ value) = 0;\n    virtual void WriteLine(double value) = 0;\n    virtual void\
    \ WriteLine(int value) = 0;\n};\n```\n\n与将其定义为类不同，你可以使用 __interface 关键字来定义它。你不能定义构造函数、析构函数，也不能定义除纯虚成员函数之外的任何成员函数。你也不能从除其他接口之外的任何内容继承。你不需要包含\
    \ public 访问说明符，因为所有成员函数都是 public 的。\n\n## 预编译头文件\n\n预编译头文件是一种特殊类型的头文件。与普通头文件一样，你可以在其中放置\
    \ include 语句和代码定义。它的不同之处在于有助于加快编译速度。\n\n"
