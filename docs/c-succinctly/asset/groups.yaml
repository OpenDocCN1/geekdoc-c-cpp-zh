    # # Exceptions in C++


    Unlike .NET, where all exceptions derive from `System.Exception` and have guaranteed
    methods and properties, C++ exceptions are not required to derive from anything;
    nor are they even required to be class types. In C++, throw "Hello World!" is
    perfectly acceptable to the compiler as is throw 5;. Basically, exceptions can
    be anything.


    That said, many C++ programmers will be unhappy to see an exception that does
    not derive from `std::exception` (found in the `<exception>` header). Deriving
    all exceptions from `std::exception` provides a way to catch exceptions of unknown
    type and retrieve information from them via the what member function before re-throwing
    them. `std::exception::what` takes no parameters and returns a `const char*` string,
    which you can view or log so you know what caused the exception.


    There is no stack trace—not counting the stack-trace capabilities your debugger
    provides—with C++ exceptions. Because automatic duration objects within the scope
    of the try-block that catches the exception are automatically destroyed before
    the appropriate catch handler, if any, is activated, you do not have the luxury
    of examining the data that may have caused the exception. All you have to work
    with initially is the message from the what member function.


    If it is easy to recreate the conditions that led to the exception, you can set
    a breakpoint and rerun the program, allowing you to step through execution of
    the trouble area and possibly spot the issue. Because that is not always possible,
    it is important to be as precise as you can with the error message.


    When deriving from `std::exception`, you should make sure to override the what
    member function to provide a useful error message that will help you and other
    developers diagnose what went wrong.


    Some programmers use a variant of a rule stating that you should always throw
    `std::exception`-derived exceptions. Remembering that the entry point (main or
    wmain) returns an integer, these programmers will throw `std::exception`-derived
    exceptions when their code can recover, but will simply throw a well-defined integer
    value if the failure is unrecoverable. The entry-point code will be wrapped in
    a try-block that has a catch for an int. The catch handler will return the caught
    int value. On most systems, a return value of 0 from a program means success.
    Any other value means failure.


    If there is a catastrophic failure, then throwing a well-defined integer value
    other than 0 can help provide some meaning. Unless you are working on a project
    where this is the preferred style, you should stick to `std::exception`-derived
    exceptions, since they let programs handle exceptions using a simple logging system
    to record messages from exceptions not handled, and they perform any cleanup that
    is safe. Throwing something that doesn’t derive from `std::exception` would interfere
    with these error-logging mechanisms.


    One last thing to note is that C#’s `finally` construct has no equivalent in C++.
    The RAII idiom, when properly implemented, makes it unnecessary since everything
    will have been cleaned up.


    # ## C++ Standard Library Exceptions


    We’ve already discussed `std::exception`, but there are more types than that available
    in the standard library, and there is additional functionality to explore. Let’s
    look at the functionality from the `<exception>` header file first.


    The `std::terminate` function, by default, lets you crash out of any application.
    It should be used sparingly, since calling it rather than throwing an exception
    will bypass all normal exception handling mechanisms. If you wish, you can write
    a custom terminate function without parameters and return values. An example of
    this will be seen in **ExceptionsSample**, which is coming.'
  - "[PAGE 86]\n\nTo set the custom terminate, you call `std::set_terminate` and pass\
    \ it the address of the function. You can change the custom terminate handler\
