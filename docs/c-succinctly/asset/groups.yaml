    \ Runtime C++ Template Library (WRL) provides a smart pointer named `ComPtr` within\
    \ the `Microsoft::WRL` namespace for use with COM objects in Windows 8 Metro-style\
    \ applications. The pointer is found in the `<wrl/client.h>` header, as part of\
    \ the Windows SDK (minimum version 8.0).\n\nMost of the operating system functionality\
    \ that you can use in Metro-style applications is exposed by the Windows Runtime\
    \ (WinRT). WinRT objects provide their own automatic reference counting functionality\
    \ for object creation and destruction. Some system functionality, such as Direct3D,\
    \ requires you to directly use and manipulate it through classic COM. `ComPtr`\
    \ handles COM's `IUnknown`-based reference counting for you. It also provides\
    \ convenient wrappers for `QueryInterface` and includes other functionality that\
    \ is useful for smart pointers.\n\nThe two member functions you typically use\
    \ are `As` to get a different interface for the underlying COM object and `Get`\
    \ to take an interface pointer to the underlying COM object that the `ComPtr`\
    \ holds (this is the equivalent of `std::unique_ptr::get`).\n\nSometimes you will\
    \ use `Detach`, which works the same way as `std::unique_ptr::release` but has\
    \ a different name because `Release` in COM implies decrementing the reference\
    \ count and `Detach` does not do that.\n\nYou might use `ReleaseAndGetAddressOf`\
    \ for situations where you have an existing `ComPtr` that could already hold a\
    \ COM object and you want to replace it with a new COM object of the same type.\
    \ `ReleaseAndGetAddressOf` does the same thing as the `GetAddressOf` member function,\
    \ but it first releases its underlying interface, if any.\n\n## Exceptions in\
    \ C++\n\nUnlike .NET, where all exceptions derive from `System.Exception` and\
    \ have guaranteed methods and properties, C++ exceptions are not required to derive\
    \ from anything; nor are they even required to be class types. In C++, `throw\
    \ \"Hello World!\"` is perfectly acceptable to the compiler, as is `throw 5;`.\
    \ Basically, exceptions can be anything.\n\nThat said, many C++ programmers will\
    \ be unhappy to see an exception that does not derive from `std::exception` (found\
    \ in the `<exception>` header). Deriving all exceptions from `std::exception`\
    \ provides a way to catch exceptions of unknown type and retrieve information\
    \ from them via the `what` member function before re-throwing them. `std::exception::what`\
    \ takes no parameters and returns a `const char*` string, which you can view or\
    \ log so you know what caused the exception.\n\nThere is no stack trace—not counting\
    \ the stack-trace capabilities your debugger provides—with C++ exceptions. Because\
    \ automatic-duration objects within the scope of the try-block that catches the\
    \ exception are automatically destroyed before the appropriate catch handler,\
    \ if any, is activated, you do not have the luxury of examining the data that\
    \ may have caused the exception. All you have to work with initially is the message\
    \ from the `what` member function.\n\nIf it is easy to recreate the conditions\
    \ that led to the exception, you can set a breakpoint and rerun the program, allowing\
    \ you to step through execution of the trouble area and possibly spot the issue.\
    \ Because that is not always possible, it is important to be as precise as you\
    \ can with the error message.\n\nWhen deriving from `std::exception`, you should\
    \ make sure to override the `what` member function to provide a useful error message\
    \ that will help you and other developers diagnose what went wrong.\n\nSome programmers\
    \ use a variant of a rule stating that you should always throw `std::exception`-derived\
    \ exceptions. Remembering that the entry point (`main` or `wmain`) returns an\
    \ integer, these programmers will throw `std::exception`-derived exceptions when\
    \ their code can recover, but will simply throw a well-defined integer value if\
    \ the failure is unrecoverable. The entry-point code will be wrapped in a try-block\
    \ that has a catch for an `int`. The catch handler will return the caught `int`\
    \ value. On most systems, a return value of 0 from a program means success. Any\
    \ other value means failure.\n\nIf there is a catastrophic failure, then throwing\
    \ a well-defined integer value other than 0 can help provide some meaning. Unless\
    \ you are working on a project where this is the preferred style, you should stick\
    \ to `std::exception`-derived exceptions, since they let programs handle exceptions\
    \ using a simple logging system to record messages from exceptions not handled,\
    \ and they perform any cleanup that is safe. Throwing something that doesn't derive\
    \ from `std::exception` would interfere with these error-logging mechanisms.\n\
    \nOne last thing to note is that C#'s `finally` construct has no equivalent in\
    \ C++. The RAII idiom, when properly implemented, makes it unnecessary since everything\
    \ will have been cleaned up.\n\n### C++ Standard Library Exceptions\n\nWe've already\
    \ discussed `std::exception`, but there are more types than that available in\
    \ the standard library, and there is additional functionality to explore. Let's\
    \ look at the functionality from the `<exception>` header file first.\n\nThe `std::terminate`\
    \ function, by default, lets you crash out of any application. It should be used\
    \ sparingly, since calling it rather than throwing an exception will bypass all\
    \ normal exception handling mechanisms. If you wish, you can write a custom terminate\
    \ function without parameters and return values. An example of this will be seen\
    \ in **ExceptionsSample**, which is coming.\n\nTo set the custom terminate, you\
    \ call `std::set_terminate` and pass it the address of the function. You can change\
    \ the custom terminate handler at any time; the last function set is what will\
    \ be called in the event of either a call to `std::terminate` or an unhandled\
    \ exception. The default handler calls the `abort` function from the `<cstdlib>`\
    \ header file.\n\nThe `<stdexcept>` header provides a rudimentary framework for\
    \ exceptions. It defines two classes that inherit from `std::exception`. Those\
    \ two classes serve as the parent class for several other classes.\n\nThe `std::runtime_error`\
    \ class is the parent class for exceptions thrown by the runtime or due to a mistake\
    \ in a C++ Standard Library function. Its children are the `std::overflow_error`\
    \ class, the `std::range_error` class, and the `std::underflow_error` class.\n\
    \nThe `std::logic_error` class is the parent class for exceptions thrown due to\
    \ programmer error. Its children are the `std::domain_error` class, the `std::invalid_argument`\
    \ class, the `std::length_error` class, and the `std::out_of_range` class.\n\n\
    You can derive from these classes or create your own exception classes. Coming\
    \ up with a good exception hierarchy is a difficult task. On one hand, you want\
    \ exceptions that will be specific enough that you can handle all the exceptions\
    \ based on your knowledge at build-time. On the other hand, you do not want an\
    \ exception class for each error that could occur. Your code would end up bloated\
    \ and unwieldy, not to mention the waste of time matching catch handlers for every\
    \ exception class.\n\nSpend time at a whiteboard, or with a pen and paper, or\
    \ however you want, thinking about the exception tree your application should\
    \ have.\n\nThe following sample contains a class called `InvalidArgumentExceptionBase`,\
    \ which is used as the parent of a template class called `InvalidArgumentException`.\
    \ The combination of a base class, which can be caught with one exception handler,\
    \ and a template class, which allows us to customize the output diagnostics based\
    \ on the type of the parameter, is one option for balancing between specialization\
    \ and code bloat.\n\nThe template class might seem confusing right now; we will\
    \ be discussing templates in an upcoming chapter, at which point anything currently\
    \ unclear should clear up.\n\n**Sample: ExceptionsSample\\InvalidArgumentException.h**\n\
    \n```cpp\n#pragma once\n#include <exception>\n#include <stdexcept>\n#include <string>\n\
    #include <sstream>\n\nnamespace CppForCsExceptions\n{\n    class InvalidArgumentExceptionBase\
    \ :\n        public std::invalid_argument\n    {\n    public:\n        InvalidArgumentExceptionBase(void)\
    \ :\n            std::invalid_argument(\"\") { }\n\n        virtual ~InvalidArgumentExceptionBase(void)\
    \ throw() { }\n\n        virtual const char* what(void) const throw() override\
    \ = 0;\n    };\n\n    template <class T>\n    class InvalidArgumentException :\n\
    \        public InvalidArgumentExceptionBase\n    {\n```\n"
