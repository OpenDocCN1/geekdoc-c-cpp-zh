    \ const 关键字放在函数参数声明之后，将成员函数标记为 const。\n\n例如，`int GetSomeInt(void) const;` 声明了一个\
    \ const 成员函数——一个不修改其所属对象数据的成员函数。编译器将强制执行这一保证。它还将强制执行这样的保证：当把一个对象传递给一个将该对象作为 const\
    \ 接收的函数时，该函数不能调用该对象的任何非 const 成员函数。\n\n从开始就遵循 const 正确性来设计程序会更容易。当你遵循 const 正确性时，使用多线程会变得更容易，因为你确切知道哪些成员函数有副作用。追踪与无效数据状态相关的错误也会更容易。与你共同参与项目的其他人也会在调用某些成员函数时意识到类数据可能发生的变化。\n\
    \n### *、& 和 -> 运算符\n\n在处理指针（包括智能指针）时，有三个运算符值得关注：*、& 和 ->。\n\n间接寻址运算符 * 对指针进行解引用，这意味着你操作的是所指向的数据，而不是指针本身。在接下来的几段中，我们假设\
    \ p_someInt 是一个指向整数的有效指针，且没有 const 限定。\n\n语句 `p_someInt = 500000;` 不会将值 500000\
