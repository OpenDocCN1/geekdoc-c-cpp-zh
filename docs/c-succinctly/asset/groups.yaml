    \ `std::unique_ptr`，而你需要为类的用途决定它的何种“副本”是可以接受的。我们将在 **ConstructorsSample** 中看到一个示例。\n\
    \n拷贝构造函数通常应具有以下声明：`SomeClass(const SomeClass&);` 为避免奇怪的错误，构造函数应始终对你所拷贝的类采用 `const`\
    \ 值引用。在拷贝构造函数中，你没有理由改变所拷贝的类。将其设为 const 不会造成损害，并能为你的操作提供一些保证。拷贝构造函数不应定义为 `explicit`。\n\
    \n## 拷贝赋值运算符\n\n如果你定义了自定义拷贝构造函数，那么你也应该定义自定义拷贝赋值运算符。该运算符的结果应是：返回的值是它所拷贝的类的一个副本。当你有一条诸如\
    \ `a = b;` 的语句，且 a 和 b 都是同一类型（例如 `SomeClass`）时，被调用的就是这个运算符。\n\n该运算符是其类的非静态成员函数，因此只有当你向类的现有实例进行拷贝赋值时，才会调用它。如果你有类似\
    \ `SomeClass a = b;` 的写法，那么这会调用拷贝构造函数，而不是拷贝赋值运算符。\n\n拷贝赋值运算符应具有以下声明：`SomeClass&\
    \ operator=(const SomeClass&);`。\n\n## 移动构造函数\n\n在 C++ 中，如果你只有拷贝构造函数，并且你想将类实例传入\
    \ `std::vector`（类似于 .NET 的 `List<T>`）或从函数返回它，那么你就需要制作它的一个副本。即使你无意再次使用它，也仍然要付出制作副本所需的时间。如果你要向\
    \ `std::vector` 添加许多元素，或者编写了一个频繁使用的工厂函数，那么这会造成很大的性能损失。\n\n这就是 C++ 拥有移动构造函数的原因。移动构造函数是\
    \ C++11 新增的。在某些情况下，编译器会为你提供一个移动构造函数，但一般来说，对于需要移动构造函数的类，你应该自己编写。\n\n这很容易做到。注意，如果你编写了移动构造函数，那么你还需要编写拷贝构造函数。截至\
    \ Visual Studio 2012 RC，Visual C++ 并未强制执行这条规则，但它是 C++ 语言标准的一部分。如果你需要使用其他编译器编译程序，那么你应该确保在编写移动构造函数时，也编写拷贝构造函数和拷贝赋值运算符。\n\
    \n移动构造函数通常应具有以下声明：`SomeClass(SomeClass&&);` 它不能是 const（因为我们将修改它），也不能是 `explicit`。\n"
