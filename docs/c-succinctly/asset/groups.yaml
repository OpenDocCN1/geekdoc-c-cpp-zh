    C 风格转换（例如 `auto someData = (SomeType*)dataOfSomeOtherType;`）不是你的朋友。你无疑从 C# 中熟悉它，在那里它非常有用。在
    C# 中，如果你尝试使用该语法进行转换，而转换无效，就会产生 InvalidCastException。发生这种情况是因为 CLR 会跟踪你创建的所有内容的类型，并检测错误的转换。


    C++ 不会检查你的 C 风格转换是否有效，当然，前提是它能编译。C++ 只是假定它有效。如果这是一次糟糕的转换，而你又幸运，程序会立即崩溃。如果不幸运，你最终会得到处于未知状态的数据，这肯定会以微妙而隐蔽的方式损坏。


    此外，与其他转换不同——你可以通过查找 `_cast` 轻松发现它们——C 风格转换并不显眼。当你快速浏览大量代码时，包裹文本的圆括号看起来既像函数调用，也像转换操作。你可以在
    Visual Studio 2012 中使用正则表达式搜索：`\(.*\)[A-Z-a-z]`。即便如此，你仍然放弃了其他转换的所有好处和保护。


    C 风格转换能做而其他转换不能做的一件事是：将对象转换为其受保护或私有继承的基类之一。你真的不应该这样做，因为如果你需要公有继承，就应该使用公有继承。


    简而言之，不要使用 C 风格转换。


