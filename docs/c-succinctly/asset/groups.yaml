    \ C++11 中 auto 关键字被重新用于类型推导，这一论点的说服力有所减弱）。如果你有一个特别复杂的数据类型，为它创建 typedef 意味着你只需要完整写一次。如果你复杂数据类型的用途不明确，用\
    \ typedef 给它一个语义更有意义的名称，有助于让程序更易于理解。\n\n开发者有时会把它当作一种抽象手段，以便轻松更改底层类型（例如，从 `std::vector`\
    \ 改为 `std::list`）或参数类型（例如，从 int 改为 long）。对于仅供自己内部使用的代码，这种做法应当避免。如果你正在开发其他人会使用的代码，比如库，你绝不应该以这种方式使用\
    \ typedef。如果你更改 typedef，这样做只会降低 API 破坏性变更的可发现性。当然，可以用它们来增加语义上下文，但不要用它们来更改其他人所依赖代码中的底层类型。\n\
    \n如果你需要更改某个东西的类型，请记住，对函数参数的任何更改都是破坏性变更，返回类型的更改或添加默认参数也是如此。处理未来可能发生类型变更的正确方式是使用抽象类或模板（如果两者都可行，选择更合适的或你更偏好的方式）。这样，代码的公共接口不会改变，只有实现会改变。Pimpl\
    \ 惯用法是另一种保持 API 稳定、同时保留更改实现细节自由的好方法。我们将在后面的章节中探讨 Pimpl 惯用法（“pointer to implementation”的缩写）。\n\
    \n下面是一个小代码块，演示 typedef 的语法。\n\n```cpp\nclass ExistingType;\n\ntypedef ExistingType\
    \ AliasForExistingType;\n```\n\n下面是一个简短示例，展示 typedef 可能如何使用。这个示例的目的是说明 typedef\
    \ 的一种简化但贴近实际的使用方式。在实践中，这样的 typedef 会放入命名空间，然后被包含在头文件中。由于我们还没有介绍这些内容，所以这个示例有意保持简单。\n\
    \n**示例：TypedefSample\\TypedefSample.cpp**\n\n```cpp\n#include <iostream>\n#include\
    \ <ostream>\n#include <vector>\n#include <algorithm>\n#include \"../pch.h\"\n\n\
    // This makes WidgetIdVector an alias for std::vector<int>, which has\n// more\
    \ meaning than std::vector<int> would have, since now we know that\n// anything\
    \ using this alias expects a vector of widget IDs\n// rather than a vector of\
    \ integers.\ntypedef std::vector<int> WidgetIdVector;\n\nbool ContainsWidgetId(WidgetIdVector\
    \ idVector, int id)\n{\n    return (std::end(idVector) !=\n            std::find(std::begin(idVector),\
    \ std::end(idVector), id)\n           );\n}\n\nint _pmain(int /*argc*/, _pchar*\
    \ /*argv*/[])\n{\n    WidgetIdVector idVector;\n\n    // Add some id numbers to\
    \ the vector.\n    idVector.push_back(5);\n    idVector.push_back(8);\n\n    //\
    \ Output a result letting us know if the id is in the\n    // WidgetIdVector.\n\
    \    std::wcout << L\"Contains 8: \" <<\n        (ContainsWidgetId(idVector, 8)\
    \ ? L\"true.\" : L\"false.\") <<\n        std::endl;\n\n    return 0;\n}\n```\n\
    \n## 第2章 命名空间\n\n### 全局命名空间\n\n请看以下代码：\n\n**示例：GlobalNamespaceSample\\GlobalNamespaceSample.cpp**\n\
    \n```cpp\n#include <iostream>\n#include <ostream>\n#include \"../pch.h\"\n\nint\
    \ g_x = 10;\n\nint AddTwoNumbers(int a, int b)\n{\n        return a + b;\n}\n\n\
    int _pmain(int /*argc*/, _pchar* /*argv*/[])\n{\n        int y = 20;\n       \
    \ std::wcout << L\"The result of AddTwoNumbers(g_x, y) where g_x = \" <<\n   \
    \             g_x << L\" and y = \" << y << L\" is \" << AddTwoNumbers(g_x, y)\
    \ <<\n                L\".\" << std::endl;\n\n        if (true == 1)\n       \
    \ {\n                std::wcout << L\"true == 1!\" << std::endl;\n        }\n\
    \        return 0;\n}\n```\n\n在前面的示例中，我们定义了两个函数：AddTwoNumbers 和 _pmain。这两个函数都位于全局命名空间中。全局命名空间是程序内其他一切事物所在的基础层级。由于继承了\
    \ C 的传统，C++ 允许你在全局命名空间中定义任何内容（因此你可以定义命名空间、类、结构体、变量、函数、枚举和模板）。\n\nC# 也有全局命名空间的概念，但它不允许你在其中定义除命名空间和类型之外的任何内容。在前面的示例中，我们有语句\
    \ `int g_x = 10;`，它在全局命名空间中定义了一个名为 g_x 的整数，并将其赋值为 10。这就是通常所说的全局变量。在 C# 中，全局变量是非法的。\n\
    \n> **关于函数**\n>\n> C++ 允许你拥有不属于类的方法。这些被称为函数。更具体地说，它们通常被称为独立函数，因为 C++ 中类方法的术语是类成员函数。我们将在后面的章节中更详细地讨论函数。\n\
    \n顺便说一句，我合作过的每一种编程语言都有其自身的糟糕特性——语言允许这些特性，但它们通常会导致问题。这些问题包括难以调试的故障、长期未被注意的隐蔽错误、可维护性问题、可读性问题，以及所有其他只会给开发时间增加许多小时却毫无益处的恼人事情。C++\
    \ 也不例外。当我们遇到符合这种描述的东西时，我会尽力指出来。现在就是其中一次。\n\n"
