    \ 中有一个指向 SomeClassA 的指针。在 CompareTwoSomeClassAs 中有两个对 SomeClassA 的引用。然后还有 Flavor\
    \ 和 Toppings 的各种用法。\n\n在这种情况下，我们可以消除那三个 include 语句。为什么？因为要编译这个类定义，编译器只需要知道 SomeClassA\
    \ 的类型，以及 Flavor 和 Toppings 的底层数据类型。我们可以通过前向声明把这一切告诉编译器。\n\n```cpp\n#pragma once\n\
    \nclass SomeClassA;\nenum class Flavor;\nenum Toppings : int;\n\nclass SomeClassB\n\
    {\npublic:\n    SomeClassB(void);\n    ~SomeClassB(void);\n\n    int GetValueFromSomeClassA(\n\
    \        const SomeClassA* value\n    );\n\n    bool CompareTwoSomeClassAs(\n\
