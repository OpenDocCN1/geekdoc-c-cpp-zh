    \n为了保持术语简单，我一直把所有内容都称为源文件。在 C++ 标准中，源文件加上其所有包含文件的组合被称为编译单元。我现在提到这一点，只是因为稍后我会用到这个术语。让我们依次考虑三个构建阶段。\n\
