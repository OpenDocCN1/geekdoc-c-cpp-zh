  mdcn: "\n> **注意：** `auto` 关键字过去曾用于显式选择自动存储期。在 C++11 中，这种用法已被移除。它现在相当于 C# 中的 `var`\
    \ 关键字。如果你尝试使用 `auto` 的旧含义编译代码，将会收到编译器错误，因为作为类型说明符的 `auto` 必须是唯一的类型说明符。\n\n###\
    \ 动态存储期\n\n动态存储期是使用 new 运算符或 new[] 运算符的结果。new 运算符用于分配单个对象，而 new[] 运算符用于分配动态数组。你必须跟踪动态分配数组的大小。虽然只要你使用了\
    \ delete[] 运算符，C++ 实现就会正确释放动态分配的数组，但没有简单或可移植的方法来确定该分配的大小。这很可能是不可能的。单个对象使用 delete\
    \ 运算符释放。\n\n当你使用 new 或 new[] 分配内存时，返回值是一个指针。指针是保存内存地址的变量。在 C# 中，如果你将指向某个对象的所有引用都设置为\
    \ null 或其他值，那么该内存在程序中就不再可达，因此垃圾回收器（GC）可以释放该内存以供其他用途。\n\n在 C++ 中，如果你将指向某个对象的所有指针都设置为\
    \ nullptr 或其他值，并且无法使用指针算术计算出原始地址，那么你就失去了使用 delete 或 delete[] 运算符释放该内存的能力。你由此造成了内存泄漏。如果程序泄漏了足够多的内存，最终它会崩溃，因为系统将用尽可供它使用的内存地址。不过，甚至在此之前，计算机也会变得极其缓慢，因为它被迫增加分页以容纳程序不断增长的内存占用（假设它有虚拟内存，而大多数智能手机没有虚拟内存）。\n\
    \n> **注意：** 常量指针，例如语句 `const wchar_t* someStr = L\"Hello World!\";` 中的 `someStr`，不是动态存储期指针。那块内存只是程序本身的一部分。如果你尝试对它调用\
    \ `delete` 或 `delete[]`，程序会直接崩溃。然而，字符串是字符数组，所以如果可以删除它，那么 `delete[]` 运算符才是正确的选择。\n\
    \n处理动态内存时，为了消除潜在泄漏并限制其他相关错误的可能性，你应始终使用智能指针，例如 `std::unique_ptr` 或 `std::shared_ptr`。我们将在涵盖指针的章节中讨论这些内容。\n\
