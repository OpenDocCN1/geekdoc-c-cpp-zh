    ## 第5章 构造函数、析构函数和运算符\n\n### 概述\n\nC++ 构造函数比 C# 的构造函数更复杂。首先，构造函数有五种类型。虽然你很少会为某个特定类或结构编写全部五种类型，但你需要知道它们是什么、做什么以及长什么样。否则，你可能会遇到一些非常令人困惑的\
    \ bug 或编译错误。\n\nC++ 构造函数比 C# 构造函数更复杂的原因是 C++ 类可以具有多种存储期。默认情况下，C++ 对象具有值语义，而 C#\
    \ 类具有引用语义。下面是一个示例：\n\n```cpp\nVehicle someVehicle = vehicle;\n```\n\n假设 vehicle\
    \ 不为 null，而是一个有效的 Vehicle 类型对象，并且 Vehicle 类型是类类型，而不是结构或其他类型。\n\n让我们将前面的代码语句视为\
    \ C# 代码。在 C# 中，vehicle 所引用的对象存在于 GC 管理的堆中的某个位置。前面的代码语句将该对象的引用存储在 someVehicle 变量中，该引用来自现有的\
    \ vehicle 对对象的引用。该对象仍然只有一个实例，但有两个引用指向它。\n\n现在让我们将前面的语句视为 C++ 代码。在 C++ 中，vehicle\
    \ 所引用的对象很可能是一个自动存储期对象，但也可能是静态存储期对象，甚至可能是线程存储期对象。默认情况下，前面的代码语句会创建 vehicle 对象的副本，并将其存储在自动存储期的\
    \ someVehicle 变量的地址中。这是通过一种称为复制赋值运算符的东西完成的，它是复制构造函数的近亲。\n\n现在有两个副本，而之前只有一个。除非\
    \ Vehicle 类有指针、`std::shared_ptr`、引用或类似性质的成员变量，否则这两个副本是完全独立的。更改甚至销毁其中一个，对另一个不会有任何影响。\n\
    \n当然，如果你希望 someVehicle 成为 vehicle 对象的引用，你可以稍微修改代码来实现。但如果你希望 someVehicle 变成 vehicle，并让\
    \ vehicle 不再存在——被销毁而不带走其原有资源，该怎么办？C++ 通过所谓的移动构造函数和移动赋值运算符使这成为可能。\n\n如果你想有意禁用复制语义（包括赋值和构造）或移动语义，那也是可能的。\n\
    \n### 默认构造函数\n\n我们从默认构造函数开始。默认构造函数可以在没有参数的情况下调用。一个类最多只能有一个默认构造函数。如果你定义一个类且不包含任何构造函数，则会产生一个隐式默认构造函数，由编译器为你创建。但是，如果你有一个类成员变量，它是没有默认构造函数的类、结构或联合，那么你必须至少定义一个构造函数，因为编译器无法创建隐式默认构造函数。\n\
    \n"
