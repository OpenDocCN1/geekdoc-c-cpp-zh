    \    m_intValue(value)\n{\n}\n\n~SomeClass(void) { }\n\nconst wchar_t* GetStringValue(void)\n\
    {\n    return m_strValue.c_str();\n}\n\nint GetIntValue(void) { return m_intValue;\
    \ }\n\nprivate:\n    std::wstring        m_strValue;\n    int                \
    \ m_intValue;\n};\n\nvoid DoSomething(void)\n{\n    // Normal constructor use.\n\
    \    SomeClass sc1 = SomeClass(L\"Hello World\");\n\n    // Fine because the const\
    \ wchar_t* constructor\n    // is a conversion constructor.\n    SomeClass sc2\
    \ = L\"Hello World\";\n\n    // Normal constructor use.\n    SomeClass sc3 = SomeClass(1);\n\
    \n    //// Illegal since the int constructor is not a\n    //// conversion constructor.\n\
    \    //SomeClass sc4 = 1;\n\n    // ...\n}\n```\n```\n\nAs you can see, the conversion\
    \ constructor lets us construct sc2 by directly setting it equal to a string value.\
    \ The compiler sees that statement, checks to see if SomeClass has a conversion\
    \ constructor that will receive the sort of value, and proceeds to call the appropriate\
    \ SomeClass constructor. If we tried that with the commented-out sc4 line, the\
    \ compiler would fail because we used explicit to tell the compiler that the constructor,\
    \ which takes int, should not be treated as a conversion constructor, but instead\
    \ should be like any other parameterized constructor.\n\nConversion constructors\
    \ can be useful, but they can also lead to bugs. For example, you could accidentally\
    \ create a new object and assign it to an existing variable when you merely mistyped\
    \ a variable name and really meant an assignment. The compiler won’t complain\
    \ if there is a valid conversion constructor, but will complain if there isn’t.\
    \ So keep that in mind and remember to mark single parameter constructors as explicit,\
    \ except when you have a good reason for providing a conversion constructor."
