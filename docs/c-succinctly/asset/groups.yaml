    \ 块内已完全构造的所有自动存储期对象，会在调用任何 catch 处理程序之前按创建时的相反顺序销毁，依此类推，直到某个东西捕获该异常，或者你的程序崩溃。\n\
    \nRAII 通过简单地使用包含资源的自动存储期对象，帮助确保你在没有异常发生的情况下释放资源。它类似于 C# 中 System.IDisposable 接口与\
    \ using 语句的组合。一旦执行离开当前块，无论是通过成功执行还是通过异常，资源都会被释放。\n\n涉及异常时，需要记住的一个关键点是：只有完全构造的对象才会被销毁。如果你在构造函数执行到一半时收到异常，而最后一个\
    \ try 块是在该构造函数之外开始的，那么由于对象尚未完全构造，它的析构函数不会运行。\n\n这并不意味着作为对象的成员变量不会被销毁。在异常发生之前，在构造函数内已完全构造的任何成员变量对象都是完全构造的自动存储期对象。因此，这些成员对象会像任何其他完全构造的对象一样被销毁。\n\
    \n这就是为什么你应该始终将动态分配放入 std::unique_ptr 或 std::shared_ptr 中。当分配成功时，这些类型的实例会成为完全构造的对象。即使你正在创建的对象的构造函数在后续过程中失败，std::unique_ptr\
    \ 的资源也会由其析构函数释放，而 std::shared_ptr 的资源引用计数会递减，如果计数变为零就会被释放。\n\n当然，RAII 并不只关乎 shared_ptr\
    \ 和 unique_ptr。它也适用于其他资源类型，例如文件对象：获取资源就是打开文件，而析构函数确保文件被正确关闭。这是一个特别好的例子，因为你只需要在编写类时创建那段代码一次，而不是一次又一次地创建；如果你在每个需要打开文件的地方都编写关闭逻辑，那就需要反复编写。\n\
    \n"
