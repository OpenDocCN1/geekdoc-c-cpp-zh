    # Template specialization


    If we want to define a different implementation for a template when a specific
    type is passed as template parameter, we can declare a specialization of that
    template.


    For example, let''s suppose that we have a very simple class called size_return
    that returns the sum of size of the data type and the value passed for all data
    types except integers. For integers we want to return the value only. So, it would
    be more convenient to have a completely different implementation with a function
    member int, so we decide to declare a class template specialization for that type.


    The syntax used in the class template specialization is:


    ```

    template <>

    class size_return <int>

    {

    //Statements

    };

    ```


    First of all, notice that we precede the class template name with an empty template<>
    parameter list. This is to explicitly declare it as a template specialization.
    Another thing is the <int> specialization parameter after the class template name.
    This parameter itself identifies the type for which we are going to declare a
    template class specialization. Notice the differences between the generic template
    class and the specialization:


    ```

    template <class T> class size_return{ //Statements };

    ```


    ```

    template <> class size_return <int> { //Statements};

    ```


    The first line is the generic template, and the second one is the specialization.
    When we declare specializations for a template class, we must also define all
    its members, even those exactly equal to the generic template class, because there
    is no "inheritance" of members from the generic template to the specialization.'
