    Fishing in C\n\n## 黑客：利用Aman进行计算机安全利用\n\n看这里，从逻辑上你可以认为我正在向函数传递一个地址；在那个地址处我正在更改值。因此，main函数中的值也应该改变，但这个程序的输出清楚地表明情况并非如此。这意味着我们的逻辑在某处是错误的。假设ch1存储在从243145开始的地址处。现在，“Fishing\
