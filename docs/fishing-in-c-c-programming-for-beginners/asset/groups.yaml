    \n## 变量、常量和关键字\n\n计算机的金科玉律是：没有存储就无法使用任何东西。这并不意味着编译器总会显示值已被存储。包括 C++ 和 Python 在内的许多编程语言并不总是显示它们正在使用的值正在被存储。常量是定义后无法修改的数据类型。相反，变量是可以反复修改的数据类型。假设我们想要操作一个初始值为\
