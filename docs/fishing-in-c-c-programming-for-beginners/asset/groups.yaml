    \  cout<<\"Second number is divisible by 10\";\n    else\n        cout<<\"Both\
    \ cases are false\";\n}\n```\n\nOutput\n\nEnter a number\n\n5\n\nEnter another\
    \ number\n\n3\n\nSecond number is greater than 5\n\n## Logical operators\n\nThere\
