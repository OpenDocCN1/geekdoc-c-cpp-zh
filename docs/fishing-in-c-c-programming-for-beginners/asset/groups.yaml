    Output


    7 7 5


    To solve such types of programs, at first we calculates the values from right
    to left. For all those expressions which involves ++ or – operator, the value
    is whatever we got from calculation. So, in the above problem, we get the value
    of two of the expression 7 ? 5. Now, to get the value of a, the value which is
    finally stored while calculating from right to left is taken, so from right to
    left at first value stored in a is 5, which is post incremented in right most
    expression, now in middle expression this value has not been changed and in leftmost
    expression, this value is increased to 7, by preincrement operation. So, the final
    value stored in a is 7. So, the value which is displayed for 2nd expression will
    be 7. So, 7 7 5 has been displayed.


    The whole logic explained above works same for –operator.


    # Type casting


    Converting one type of variable to another type is called type casting. Type can
    be both automatic and manual. Consider the following program


    ```

    #include<iostream>

    using namespace std;

    int main()

    {

    int a=255;

    float b=182;

    char d=a-b;

    cout<<d;

    }

    ```


    This program may seem incorrect, but there is no error in this program. Since
    d=a-b=255-182-73,so the ASCII character of 73 which is capital i will be stored
    in d. So, output will be printed as I'
