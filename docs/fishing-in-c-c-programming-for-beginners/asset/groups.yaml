    \ 1111 >> 2\n= 0011\n= 3\n```\n\nConsider the following program:\n\n```\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    int a = 15;\n    int c = a >> 2;\n  \
    \  cout << c;\n}\n```\n\nHere, the output will be 3\n\n## NOT operator\n\n! is\
    \ the NOT operator\n\n| x | !(x) |\n|---|---|\n| 0 | 1 |\n| 1 | 0 |\n\nNow, consider\
    \ the following amazing program\n\n```\n#include<iostream>\nusing namespace std;\n\
    int main()\n{\n    int a = 13;\n    int c = (!a);\n    cout << c;\n    return\
