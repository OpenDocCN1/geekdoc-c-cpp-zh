    inside it and then returns to the main() function. Again, when the function is
    called, the same process is repeated again. This process has two disadvantages:


    +   1. It is slight more time consuming than the program without a function

    +   2. It breaks continuity


    To solve these problems, we use an arrangement called inline functions. If we
    declare a function inline, then we are in fact suggesting the compiler to copy
    the statements written in functions in the calling function itself instead of
    calling the function. It is not necessary that function will be inlined but most
    of the very small functions got inlined whenever they are declared so.


