    }\n```\n\n输出\n20\n\n这里 return*this; 返回整个对象。请记住 this 表现为一个对象指针。\n\n![](img/5340985153962870d4e4a3b9453b9146_197_0.png)\n\
    \n## 继承\n\n这是面向对象编程的一项惊人功能。此功能允许我们从现有类继承一个类。此功能使我们免于编写大量代码，并且我们可以使用权限进行继承，以便我们控制未来的继承功能。\n\
