    \n## this 指针\n\n很多时候，我们希望在同一个类的函数定义内创建该类的一个对象，以便我们可以计算并返回该对象来将其存储在另一个对象中。例如，假设我们定义一个类\
    \ rectangle。现在，我们想要从一个对象（比如说 obj1）计算面积，并且我们想要返回整个对象并将其存储在另一个对象（比如说 obj2）中。这时 this\
    \ 指针就非常有用了。\n\n考虑以下程序：\n\n```\n#include<iostream>\nusing namespace std;\nclass\
    \ rectangle\n{\nint length,breadth,area;\npublic:\nvoid set_values(int a,int b){length=a;breadth=b;}\n\
    rectangle calc_area();\nvoid display_area(){cout<<area;}\n};\nrectangle rectangle::calc_area()\n\
    {\narea=length*breadth;\nreturn *this;\n}\nint main()\n{\n    rectangle obj1,obj2;\n\
