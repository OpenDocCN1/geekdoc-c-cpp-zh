    \    cout<<a<<endl;\n    }\n    {\n        using namespace ns2;\n        cout<<a<<endl;\n\
    \    }\n}\n```\n\n输出\n1\n3.33\n\n### 命名空间别名\n\n命名空间的一个惊人特性是可以为其创建别名。创建别名后，旧名称和新名称都可以使用。\n\
    \n重命名命名空间的语法如下：\n\n```\nnamespace new_name=old_name;\n```\n\n考虑以下程序：\n\n```\n\
    #include<iostream>\nusing namespace std;\nnamespace ns1\n{\n    int a=1;\n}\n\
    namespace ns2=ns1;\nint main()\n{\n    using namespace ns1;\n    cout<<a<<endl;\n\
    \    using namespace ns2;\n    cout<<a;\n}\n```\n\n输出\n\n1\n1\n\n这次变量 a 不是歧义的。\n\
    \n![](img/5340985153962870d4e4a3b9453b9146_257_0.png)\n\n## 模板\n\n模板，也称为“泛型”或“参数化类型”，使你能够构建一组相关的函数或类。当你需要编写大量几乎相同的内容时，会使用它。这是\
    \ C++ 的一项特殊功能，属于其 **代码重用和回收** 属性。在这里，你将看到如何高效地重用代码。\n\n假设我们定义如下函数：\n\n```\nint\
    \ random(int a, int b)\n{\n    return a+b+sizeof(int);\n}\n```\n\n一个非常简单的函数，对吧！现在，假设我们不仅希望上述函数适用于整数，还希望在程序中适用于\
    \ double、short 和 long double 数据类型。这里出现了一个问题，我们需要为每个对应的数据类型定义四个不同的函数。难道就没有方法来减少这项工作吗？这时模板就很有用了。\n\
    \n首先，我们来看看这个繁琐的程序，然后我们将使用模板对其进行简化：\n\n```\n#include<iostream>\nusing namespace\
    \ std;\nshort random(short a,short b)\n{\n    return a+b+sizeof(short);\n}\nint\
    \ random(int a,int b)\n{\n    return a+b+sizeof(int);\n}\ndouble random(double\
    \ a,double b)\n{\n    return a+b+sizeof(double);\n}\nlong double random(long double\
    \ a,long double b)\n{\n    return a+b+sizeof(long double);\n}\n\nint main()\n\
    {\n    short xa=5,ya=6;\n    int xb=5,yb=6;\n    double xc=5,yc=6;\n    long double\
    \ xd=5,yd=6;\n    short p=random(xa,ya);\n    int q=random(xb,yb) ;\n    double\
    \ r=random(xc,yc);\n    long double s=random(xd,yd);\n    cout<<p<<endl<<q<<endl<<r<<endl<<s<<endl;\n\
    }\n```\n\n| 64 位编译器上的输出 | 32 位编译器上的输出 |\n| :--- | :--- |\n| 13 | 13 |\n| 15 |\
    \ 13 |\n| 19 | 19 |\n| 27 | 21 |\n\n你现在已经了解，在定义模板时，我们需要针对数据类型而非值进行工作。我们可以说，我们将定义一个以数据类型作为参数并对值进行操作的模板，而不考虑其数据类型。\n\
    \n模板有两种类型\n\n- 1. 函数模板\n- 2. 类模板\n\n### 函数模板\n\n函数模板可以通过两种方式定义，即使用两个不同的关键字 class\
    \ 和 typename。两者可以以相同的方式使用。\n\n声明模板的语法如下：\n\n```\ntemplate <typename identifier>\
    \ function_declaration;\n```\n\n另一种非常流行的语法是：\n\n```\ntemplate <class identifier>\
    \ function_declaration;\n```\n\n因此，声明示例可以是：\n\n```\ntemplate <class myDataType>\
    \ myDataType GetMax(myDataType a, myDataType b);\n```\n\n```\ntemplate <typename\
    \ myDataType> myDataType GetMax(myDataType a, myDataType b);\n```\n\n函数模板可以像其他函数一样定义，但不同之处在于我们不使用\
    \ int、float 等，而是到处使用 myDataType。\n\n因此，上面定义的 random 函数的相应定义将是：\n\n```\ntemplate\
    \ <typename T>\n\nT random(T a, T b)\n\n{\n     return a+b+sizeof(T);\n}\n```\n\
    \n但是，请记住 Turbo C++ 不支持 typename 关键字。如果你使用 Turbo C++，那么本章中实现的各种程序将无法工作，因为 Turbo\
    \ C++ 未更新。你应当立即放弃它，切换到 Borland C++ 编译器。你可以切换到 Dev C++、Code::Blocks 以及其他各种流行编译器。所有这些都是免费且易于使用的。\n\
    \n我们还可以在函数定义中创建对象。因此，上面的代码片段也可以写成：\n\n```\ntemplate <typename T>\n\nT random(T\
    \ a, T b)\n```\n\n"
