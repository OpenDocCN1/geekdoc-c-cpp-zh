    \n```\n#include<iostream>\nusing namespace std;\nint main()\n{\n    int i=5;\n\
    \    for(i=7;i<10;i++)\n    cout<<i;\n}\n```\n\n上述程序将打印 789，这意味着 for 循环中的第一条语句是初始化，\n\
    第二条语句是条件。for 循环下的语句块将\n一直执行，直到该条件为 true。一旦该条件变为 false，控制权\n就会退出循环。第三条语句在 for 循环内每条语句执行后执行。\n\
    关于第三条语句的一个惊人事实是，每次它\n都在第二条语句之前执行。否则，结果本应是 78910\n\n请参考以下程序\n\n```\n#include<iostream>\n\
