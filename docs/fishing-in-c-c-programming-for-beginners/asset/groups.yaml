    \    cout << c;\n}\n```\n\nHere, the output will be 12.\n\na = 9 = 1001, b = 5\
    \ = 101\nSo, c = a ^ b = 1001 ^ 101\n= 1001 ^ 0101\n= 1100\n= 12\n\n## Left shift\
