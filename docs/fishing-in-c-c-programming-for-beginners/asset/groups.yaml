    \ a 地址处的值更改为 6。当我们在 main() 函数中打印相同的值时，我们可以看到 main() 函数中的值也已更改。\n\n## 按值调用和按引用调用\n\
    \n函数可以以两种方式调用\n\n- 1. 按值调用\n- 2. 按引用调用\n\n按引用调用又可以细分为两部分\n\n- i. 使用指针调用\n- ii.\
    \ 不使用指针调用\n\n## 按值调用\n\n当我们按值调用函数时，会创建传递给函数的局部变量的副本并将其传递给函数。因此，函数执行后，局部变量的原始值不会改变。\n\
    \n例如，请考虑以下程序\n\n#include<iostream>\nusing namespace std;\nint display1(int);\n\
    int main()\n{\n    int a=5;\n    display1(a);\n    cout<<a;\n}\nint display1(int\
    \ a)\n{\na = 6;\n}\n\n在这个程序中，输出将是 5，尽管我们在 display1() 函数中将 a 的值更改为了 6。这称为按值调用函数。在这里，a\
    \ 值的一个副本被传递给 display1() 函数。因此，main() 函数中的值保持不变，因为原始地址处存储的值没有被更改，而是 display1()\
    \ 函数中的值的副本被更改了，并且此更改将持续存在，直到函数 display1() 将控制权返回给 main()。\n\n如果上述说法正确，那么如果我们尝试在以下程序中访问\
    \ num 的内存位置，它应该给出两个不同的值，这可以轻松查看。\n\n![](img/5340985153962870d4e4a3b9453b9146_92_0.png)\n\
    \n## 使用指针的按引用调用\n\n当我们通过使用指针或使用地址按引用调用函数时，变量的地址会被传递给函数。因此，无论我们在函数中做什么更改，相同的更改都会发生在局部变量的原始内存位置。\n\
    \n请考虑以下程序：\n\n#include<iostream>\nusing namespace std;\nint display1(int*);\n\
    int main()\n{\n    int a=5;\n    cout<<a;\n    display1(&a);\n    cout<<a;\n}\n\
