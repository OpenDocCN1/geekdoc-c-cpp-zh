    \ << 2\n= 10100\n= 20\n```\n\nConsider the following program:\n\n```\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    int a = 5;\n    int c = a << 2;\n   \
    \ cout << c;\n}\n```\n\nHere, the output will be 20\n\n## Right shift operator\n\
    \n>> is called the right shift operator. E.g. 15 >> 2 means that it shifts the\
