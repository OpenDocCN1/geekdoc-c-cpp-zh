    \n```cpp\n#include<iostream>\n#include<string.h>\nusing namespace std;\nint main()\n\
    {\n    char ch[]=\"Aman\";\n    char ch1[10];\n    strcpy(ch1,ch);\n    puts(ch1);\n\
