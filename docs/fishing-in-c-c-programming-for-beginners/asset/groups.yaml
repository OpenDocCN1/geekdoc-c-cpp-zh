    }\n\n![](img/5340985153962870d4e4a3b9453b9146_87_0.png)\n\n## 指针\n\n本部分包含两个特殊符号\
    \ & 和 *\n\n& - 它称为变量的地址。\n\n请考虑以下程序：\n\n#include<iostream>\nusing namespace std;\n\
    int main()\n{\n    int a=5;\n    cout<<&a;\n    return 0;\n}\n\n在这里，它将显示存储变量的内存地址。输出取决于编译器，在我的编译器中它显示了\
    \ 0x22fe4c。在你的编译器中，可能会不同。\n\n* 星号，也称为地址处的值，用于访问存储在变量地址处的值。\n\n指针可以声明为\n\nint *a;\n\
    \n请考虑以下程序：\n\n#include<iostream>\nusing namespace std;\nint main()\n{\n    int\
    \ *a;\n    cout<<*a;\n    return 0;\n}\n\n在这个程序中，我们没有给 a 分配任何地址，但我们正在尝试访问该地址处存储的值。这会简单地导致程序崩溃，输出如下：\n\
    \n![](img/5340985153962870d4e4a3b9453b9146_89_0.png)\n\n请考虑以下程序\n\n#include<iostream>\n\
