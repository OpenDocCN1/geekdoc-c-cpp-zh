  mdcn: "\n\n## 从文件读取字符\n\n假设我们想从文件中只读取一个字符，那么必须使用 `ios::in` 打开它。下面的程序演示了如何从文件读取一个字符。\n\
    \n```cpp\n#include<iostream>\n#include<fstream>\nusing namespace std;\nint main()\n\
    {\n    fstream fin;\n    fin.open(\"example.txt\",ios::in);\n    if(fin==NULL)\n\
    \    {\n        cout<<(\"Can't open the file\");\n        return -1;\n    }\n\
    \    char ch;\n    fin>>ch;\n    cout<<ch;\n    fin.close();\n    return 0;\n\
    }\n```\n\n### 输出\n\nb\n\n现在，考虑以下程序：\n\n```cpp\n#include<iostream>\n#include<fstream>\n\
    using namespace std;\nint main()\n{\n    fstream fin;\n    fin.open(\"example.txt\"\
    , ios::in);\n    if(fin==NULL)\n    {\n        cout<<(\"Can't open the file\"\
    );\n        return -1;\n    }\n    char ch;\n    while(!(fin.eof()))\n    {\n\
    \        fin>>ch;\n        cout<<ch;\n    }\n    fin.close();\n    return 0;\n\
    }\n```\n\n### 输出\n\nb5IamAman\n\n请看，我们使用了 `fin.eof()` 来检测文件末尾。输出未格式化。输出中还缺少换行符和空格等特殊字符。这意味着就像\
    \ `cin>>` 一样，文件指针也无法检测空白字符。所以，现在是时候寻找一种更可靠的读取字符的方法，它可以给我们一个更正确的结果。\n\n## 逐字符读取整个文件\n\
    \n在下面的程序中，我们使用了 `get()` 函数来读取文件中的每一个字符。\n\n考虑以下程序：\n\n```cpp\n#include<iostream>\n\
    #include<fstream>\nusing namespace std;\nint main()\n{\n    fstream fin;\n   \
    \ fin.open(\"example.txt\",ios::in);\n    if(fin==NULL)\n    {\n        cout<<\"\
    Can't open the file\");\n        return -1;\n    }\n    char ch;\n    while(!fin.eof())\n\
    \    {\n        fin.get(ch);\n        cout<<ch;\n    }\n    fin.close();\n   \
    \ return 0;\n}\n```\n\n### 输出\n\nb\n5\nI am Aman\n\n请看，每一个字符和空白字符都已按原样显示。\n\n\
    ## 从文件读取字符串\n\n我们也可以从文件读取字符串。为此，我们使用 `getline()` 函数\n\n```cpp\n#include<iostream>\n\
    #include<fstream>\nusing namespace std;\nint main()\n{\n    fstream fin;\n   \
    \ fin.open(\"example.txt\",ios::in);\n    if(fin==NULL)\n    {\n        cout<<\"\
    Can't open the file\");\n        return -1;\n    }\n    char ch[10];\n    while(!fin.eof())\n\
    \    {\n        fin.getline(ch,10);\n        cout<<ch;\n    }\n    fin.close();\n\
    \    return 0;\n}\n```\n\n### 输出\n\nb5I am Aman\n\n请看，`getline()` 函数识别空格，但不能识别换行符。\n\
    \n## 文件位置指针\n\n使用文件位置指针，我们可以在文件中从一个位置移动到另一个位置。\n\n`seekg(offset,whence)` – 此函数将“获取”光标放置在从\
    \ `whence` 开始计数的 `offset` 位置。当我们想要从文件读取内容时使用此函数。这里 `whence` 可能有三个值。\n\n- `ios::beg`\
    \ – 用于从文件开头开始计算偏移位置。\n- `ios::cur` – 用从当前位置开始计算偏移位置。\n- `ios::end` – 用从文件末尾开始计算偏移位置。\n\
    \n考虑以下程序：\n\n```cpp\n#include<iostream>\n#include<fstream>\nusing namespace std;\n\
    int main()\n{\n    fstream fin;\n    fin.open(\"example.txt\",ios::out);\n   \
    \ if(fin==NULL)\n    {\n        cout<<(\"Can't open the file\");\n        return\
    \ -1;\n    }\n    fin<<\"Hacking: Exploiting computer security with Aman\";\n\
    \    fin.close();\n    fin.open(\"example.txt\",ios::in);\n    char ch;\n    fin.seekg(3,ios::beg);\n\
    \    ch=fin.get();\n    cout<<ch;\n    fin.close();\n    return 0;\n}\n```\n\n\
    ### 输出\n\nk\n\n从输出中，您可以轻松看出第一个字符的偏移值设为零。该程序将文件内的光标放置在从文件开头算起的第四个位置，即偏移量为三。在这里，您可以看到我们以读写模式打开了文件。以读写模式打开文件时，必须注意，由于文件也以读取模式打开，因此相应位置必须存在同名的现有文件。如果不存在同名的现有文件，将显示错误，因为文件不会自动创建。在这种情况下，上述程序将显示错误“Can't\
    \ open the file”。在这种情况下，您可以先以输出模式打开文件，然后关闭它，再以读取模式重新打开。以下程序展示了执行此任务的示例程序：\n\n\
    ```cpp\n#include<iostream>\n#include<fstream>\nusing namespace std;\nint main()\n\
    {\n    fstream fin;\n    fin.open(\"example.txt\",ios::out);\n    if(fin==NULL)\n\
    \    {\n        cout<<\"Can't open the file\");\n        return -1;\n    }\n \
    \   fin<<\"Hacking: Exploiting computer security with Aman\";\n    fin.close();\n\
    \    fin.open(\"example.txt\",ios::in);\n    char ch;\n    fin.seekg(3,ios::beg);\n\
    \    ch=fin.get();\n    cout<<ch;\n    fin.close();\n    return 0;\n}\n```\n\n\
    上述程序不会显示错误。因为，如果文件“example.txt”不存在，则会创建它。在这里，我们需要从文件读取一些数据，因此使用了 `seekg()`。\n\n\
    `seekg()` 是一个重载函数。因此，它还有一个原型：\n\n```\nseekg(offset);\n```\n\n此函数始终假设偏移量从文件开头开始。因此，它是\
    \ `seekg(offset,ios::beg)` 的替代方案。\n\n`seekp(offset,whence)` – 此函数将“放置”光标放置在从 `whence`\
    \ 开始计数的 `offset` 位置。当我们想要向文件写入内容时使用此函数。\n\n```cpp\n#include<iostream>\n#include<fstream>\n\
    using namespace std;\nint main()\n{\n    fstream fin;\n\n    fin.open(\"example.txt\"\
    ,ios::in | ios::out);\n\n    if(fin==NULL)\n    {\n        cout<<(\"Can't open\
    \ the file\");\n        return -1;\n    }\n\n    fin<<\"I am Aman\";\n    fin.seekp(4,ios::beg);\n\
