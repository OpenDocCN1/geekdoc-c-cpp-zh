    ;\n    modify_string(ch);\n    puts(ch);\n    return 0;\n}\n\nvoid modify_string(char\
    \ *ch)\n{\n    ch=\"Fishing in C\";\n    puts(ch);\n}\n```\n\n输出\n\nFishing in\
    \ C\n\n## 黑客：利用Aman进行计算机安全利用\n\n许多人认为指针赋予了他们使用计算机的全部权力，他们开始认为使用指针可以交换地址。好吧，这是错误的。使用指针我们可以执行以下任务：\n\
