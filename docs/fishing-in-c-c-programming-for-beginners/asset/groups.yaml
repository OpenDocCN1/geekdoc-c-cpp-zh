    \    float var=5;\n}\nint main()\n{\n    cout<<ns1::var<<endl;\n    cout<<ns2::var;\n\
    }\n```\n\n输出\n\n3\n\n5\n\n但是，请记住 Turbo C++ 不支持 **命名空间** 关键字。如果你使用 Turbo C++，那么本章中实现的各种程序将无法工作。你应当立即放弃它，切换到\
    \ Borland C++ 编译器。你可以切换到 Dev C++、Code::Blocks 以及其他各种流行编译器。所有这些都是免费且易于使用的。\n\n\
    这里，你可以看到访问每个元素时我们使用了域运算符 (::)。为每个元素都使用此运算符是一项繁琐的工作。因此使用了关键字 **using**。\n\n###\
    \ using 关键字\n\n这是一个多用途关键字。它有两种用途：一种是在程序中访问命名空间，另一种是在程序中使用特定命名空间的变量。\n\n### 访问命名空间\n\
    \nusing 的语法如下：\n\n```\nusing namespace namespace_name;\n```\n\n一旦声明上述语句，后续语句将被视为属于该命名空间，除非遇到另一条类似的上述语句。\n\
    \n考虑以下程序：\n\n```\n#include<iostream>\nusing namespace std;\nnamespace ns1\n{\n\
    \    int a=1;\n    int b=2;\n}\nnamespace ns2\n{\n    float a=3.33;\n    double\
    \ b=4.44;\n}\nint main()\n{\n    using namespace ns1;\n    cout<<a<<endl;\n  \
    \  cout<<b;\n}\n```\n\n输出\n1\n2\n\n### 使用特定命名空间的元素\n\n此处语法如下：\n\n```\nusing namespace_name::element_name;\n\
    ```\n\n考虑以下程序：\n\n```\n#include<iostream>\nusing namespace std;\nnamespace ns1\n\
    {\n    int a=1;\n    int b=2;\n    int add(int x,int y){return x+y;}\n}\nnamespace\
    \ ns2\n{\n    float a=3.33;\n    double b=4.44;\n    int add(int x,int y){return\
    \ 2*x+y;}\n}\nint main()\n{\n    using ns1::a;\n    using ns1::b;\n    using ns1::add;\n\
    \    cout<<a<<endl;\n    cout<<b<<endl;\n    cout<<add(a,b);\n}\n```\n\n输出\n1\n\
    2\n3\n\n### 同时使用多个命名空间\n\n命名空间还允许我们同时使用多个命名空间。我们可以告诉编译器使用一个命名空间的变量和另一个命名空间的其他变量。\n\
    \n考虑以下程序：\n\n```\n#include<iostream>\nusing namespace std;\nnamespace ns1\n{\n\
    \    int a=1;\n    int b=2;\n}\nnamespace ns2\n{\n    float a=3.33;\n    double\
    \ b=4.44;\n}\nint main()\n{\n    using ns1::a;\n    using ns2::b;\n    cout<<a<<endl;\n\
    \    cout<<b;\n}\n```\n\n输出\n\n1\n\n4.44\n\n这里，你可以看到 ns1::a 不是命名空间，而是一个变量。因此，我们不能使用\
    \ using namespace ns1::a；这里，a 来自 ns1，b 来自 ns2。\n\n现在考虑以下程序：\n\n```\n#include<iostream>\n\
    using namespace std;\nnamespace ns1\n{\n    int a=1;\n}\nnamespace ns2\n{\n  \
    \  float a=3.33;\n}\nint main()\n{\n    using namespace ns1;\n    cout<<a<<endl;\n\
