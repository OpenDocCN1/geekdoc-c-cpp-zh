    # Class Templates


    You use a class template (also called a generic class or class generator) to define
    a pattern for class definitions. Generic container classes are good examples.
    Whether you have a list of integers or any other type, the basic operations are
    the same (insert, delete, index, etc.). You can define the class structure with
    generic operations once, and let the system generate class definitions on the
    fly:


    ```

    template <class T>

    class List

    {

    T *v;

    int size;

    public:

    List(int);

    T& operator[](int i) { return v[i];}

    };

    ```


    // Out-of-class definitions require a special syntax:


    ```

    template <class T> List<T>::List(int n)

    {

    v = new T[n];

    size = n;

    }

    ```'
