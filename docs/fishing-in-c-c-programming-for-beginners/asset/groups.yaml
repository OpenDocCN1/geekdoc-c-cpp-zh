    \    cout<<\"\\nRoll number of the student is: \"<<s2.roll;\n    return 0;\n}\n\
    \nstruct student input()\n{\n    struct student s1;\n    cout << \"Enter the name\
    \ of student\\n\";\n    gets(s1.name);\n    cout << \"Enter the section of student\\\
    n\";\n    cin>>s1.section;\n    cout << \"Enter the roll number of the student\\\
    n\";\n    cin>>s1.roll;\n    return s1;\n}\n```\n\nHere, input() is a function\
    \ which returns an entire structure.\n\n## Structure as a pointer\n\nStructure\
    \ can have pointers. With pointer, dot operator is not used rather arrow operator(->)\
    \ is used. Consider the following program\n\n```cpp\n#include<iostream>\nusing\
    \ namespace std;\nstruct student\n{\nchar name[50];\nchar section;\nint roll;\n\
    };\nint main()\n{\n    struct student s1;\n\n    cout << \"Enter the name of student\\\
    n\";\n    gets(s1.name);\n\n    cout << \"Enter the section of student\\n\";\n\
    \    cin>>s1.section;\n    cout << \"Enter the roll number of the student\\n\"\
    ;\n    cin>>s1.roll;\n    struct student* s2=&s1;\n\n    cout<<(\"\\nThe name\
    \ of student is: \");\n    puts(s2->name);\n    cout<<(\"\\nThe section of the\
    \ student is: \"<<s2->section);\n    cout<<(\"\\nRoll number of the student is:\
    \ \"<<s2->roll);\n    return 0;\n}\n```\n\n## File operations\n\n### Useful functions\n\
    \nTo operate a file, we use various functions. Some of those are\n\n- open() –\
    \ This function is used to open a file and returns NULL if not successfully opened.\n\
    - close() – This function is used to close the file and returns -1 if cannot close\
    \ and 0 if successfully closed\n- get() – This function is used to get a character\
    \ from file.\n- getline()- This function is used to get a string from the file.\n\
    \n### Useful macros\n\nThree macros are frequently used to operate a file:\n\n\
    - fstream – This class is used to declare a file pointer\n- NULL – This has various\
    \ uses, one of them is to check whether the file is opened successfully or not\n\
    - EOF – This macro is used to detect end of file\n\n### Modes to open a file\n\
    \nFiles can be operated in various modes. Let us see those modes:\n\n- ios::in:\
    \ - reading from the file If the file is opened successfully it is loaded into\
    \ memory and sets up a pointer which points to the first character in it. If the\
    \ file cannot be opened NULL is returned.\n- ios::out: -writing to the file If\
    \ the file is opened successfully it is loaded into memory and a pointer is sets\
    \ up which points to the place for writing first character to the file. Existing\
    \ data in the file will be lost. If there does not exist such file, then a new\
    \ file will be automatically created. If the file cannot be opened NULL is returned.\n\
    - ios::app: - Append output to the end of the file (Should be used in combination\
    \ with ios::out) If the file is opened successfully then it is loaded into memory\
    \ and sets up a pointer that points to the last character in it. If the file doesn't\
    \ exist, a new file is created. Returns NULL, if unable to open file. It does\
    \ not write anything if not used with ios::out\n- ios::trunc: - Discard the file's\
    \ existing contents (Should be used with ios::out) It is used to reduce the file\
    \ size to zero, so that a new data can be written to the file.\n- ios::binary:\
    \ - Open the file in binary mode\n- ios::ate: - If used with ios::app then it\
    \ writes to the end of file. If not used with ios::app then it first truncates\
    \ the file and then performs the operations we want. (Should be used with ios::out)\n\
    \n## Writing to a file\n\nNow, we are going to write in a file. For simplicity\
    \ I am writing into a file named \"example.txt\". You can write your desired name\
    \ in place of \"example.txt\".\n\nFollowing program illustrates the simple write\
    \ operation:\n\n```cpp\n#include<iostream>\n#include<fstream>\nusing namespace\
    \ std;\nint main()\n{\n    fstream fout;\n    fout.open(\"example.txt\",ios::out);\n\
    \    if(fout==NULL)\n    {\n        cout<<(\"Can't open the file\");\n       \
    \ return -1;\n    }\n\n    char ch='b';\n    char *name=\"I am Aman\";\n    int\
    \ num=5;\n    fout<<ch<<endl;\n    fout<<num<<endl;\n    fout<<name;\n\n    fout.close();\n\
    \    cout<<\"Process completed\";\n    return 0;\n}\n```\n\nOutput to example.txt\n\
    b\n5\nI am Aman\n\nAt first we created an object fout of the class fstream. Then,\
    \ we used dot operator to access open() function defined in the class. You can\
    \ create any object of your choice instead of fout and use in similar manner.\n\
    \nfout<< works same as cout<<. So, it can be used to write thrice data, character\
    \ and string to the file, very simply. Here, in the above program, I have written\
    \ a character, a number and a string to the file. Similarly, we can use fout>>\
    \ like cin>>\n\nfout.close() - This function closes the file.\n"
