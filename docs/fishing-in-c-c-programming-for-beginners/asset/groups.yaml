    \    return 0;\n}\nvoid display(char* n, char c, int i)\n{\n    cout<<(\"\\nThe\
    \ name of student is: \");\n    puts(n);\n    cout<<(\"\\nThe section of the student\
    \ is: \"<<c);\n    cout<<(\"\\nRoll number of the student is: \"<<i);\n}\n```\n\
    \n## Passing entire structure to the function\n\nEntire structure can also be\
    \ passed to the function. Following program illustrates this.\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nstruct student\n{\n    char name[50];\n    char section;\n\
    \    int roll;\n};\nvoid display(struct student s2);\nint main()\n{\n    struct\
    \ student s1;\n    cout << \"Enter the name of student\\n\";\n    gets(s1.name);\n\
    \    cout << \"Enter the section of student\\n\";\n    cin>>s1.section;\n    cout\
    \ << \"Enter the roll number of the student\\n\";\n    cin>>s1.roll;\n    display(s1);\n\
    \    return 0;\n}\n\nvoid display(struct student s2)\n{\n    cout<<(\"\\nThe name\
    \ of student is: \");\n    puts(s2.name);\n    cout<<(\"\\nThe section of the\
    \ student is: \"<<s2.section);\n    cout<<(\"\\nRoll number of the student is:\
    \ \"<<s2.roll);\n}\n```\n\n## Structure as return type\n\nStructure can be used\
    \ as a return type also. Following program illustrates this fact:\n\n```cpp\n\
    #include<iostream>\nusing namespace std;\nstruct student\n{\n    char name[50];\n\
    \    char section;\n    int roll;\n};\nstruct student input();\nint main()\n{\n\
    \    struct student s2=input();\n    cout<<(\"\\nThe name of student is: \");\n\
