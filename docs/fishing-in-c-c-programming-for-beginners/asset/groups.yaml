    #include<iostream>\nusing namespace std;\nint main()\n{\n    int a[3]={1,2,4,5};\n\
    }\n```\n\nThis program will give an error \"Too many initializers for int[3]\"\
    \n\n## Passing array elements to the function\n\nArray is passed to the function\
    \ in the same way as normal variables.\n\nE.g. Consider the following program:\n\
    \n```cpp\n#include<iostream>\nusing namespace std;\nvoid disp1(int);\nint main()\n\
    {\n    int a[32],i;\n    for(i=0;i<32;i++)\n    {\n        a[i]=i;\n        disp1(a[i]);\n\
    \    }\n}\nvoid disp1(int x)\n{\n    cout<<x<<endl;\n}\n```\n\nThis will print\
    \ 0 to 31 in different lines.\n\n## Passing Entire array to the function\n\nEntire\
    \ array can also be passed to the function.\n\nMethod1: Consider the following\
    \ code:\n\n```cpp\n#include<iostream>\nusing namespace std;\nvoid disp(int*,int);\n\
    int main()\n{\n    int num[5]={3,2,0,1,4};\n    disp(num,5);\n}\nvoid disp(int*x,int\
    \ y)\n{\n    int i;\n    for(i=0;i<y;i++,x++)\n    cout<<*x;\n}\n```\n\nHere,\
    \ you can see that we have passed only num to the function. In array the variable\
    \ name is in fact its base address. So, num is equivalent to &num[0]. Then using\
    \ pointer arithmetic, we increased the address of x which is actually num in 3rd\
    \ statement in for loop. So, the output will be 32014\n\nMethod2: The above program\
    \ can also be written as:\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    void disp(int*,int);\nint main()\n{\n    int num[5]={3,2,0,1,4};\n    disp(num,5);\n\
    }\nvoid disp(int*x,int y)\n{\n    int i;\n    for(i=0;i<y;i++)\n    cout<<*(x+i);\n\
    }\n```\n\nMethod3: Consider the following program:\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nvoid disp(int&,int);\nint main()\n{\n    int num[5]={3,2,0,1,4};\n\
    \    disp(num[0],5);\n}\nvoid disp(int&x,int y)\n{\n    int i;\n    for(i=0;i<y;i++,x++)\n\
    \    cout<<x;\n}\n```\n\nConsider the following program:\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    cout<<main;\n}\n```\n\nFunction name\
    \ is also the address of the function itself. This program will display the address\
    \ of the main() function.\n\nConsider the following program:\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    cout<<cout;\n}\n```\n\nThis program will\
    \ display the address of cout macro.\n\n## Multidimensional array\n\nAn array\
    \ can be one dimensional or multidimensional. e.g. int array[3][4][2];\n\nConsider\
    \ the following program\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    int main()\n{\n    int num[3][2][5],i,j,k;\n    for(i=0;i<3;i++)\n        for(j=0;j<2;j++)\n\
    \            for(k=0;k<5;k++)\n                num[i][j][k]=i+j+k;\n}\n```\n\n\
    In this program, we have declared a three-dimensional array and assigned values\
    \ to it.\n\nA 2D array can also be initialized as follows\n\n```cpp\nint num[4][2]\
    \ = {{ 1214, 86 },{ 1612, 53 },{ 24, 8 },{ 22,8 }};\n```\n\nIt is important to\
    \ remember that while initializing a 2-D array it is necessary to mention the\
    \ second dimension, whereas the first dimension is optional.\n\nSo the declarations:\n\
    \n```cpp\nint num[2][3] = { 1, 3, 2, 4, 98, 78 };\nint num[][3] = { 2, 4, 2, 4,\
    \ 6, 5 };\n```\n\nare acceptable, whereas,\n\n```cpp\nint num[2][] = { 12, 34,\
    \ 23, 45, 56, 45 };\nint num[] [] = { 12, 34, 23, 45, 56, 45 };\n```\n\nwould\
    \ give the error \"Array type has incomplete element type\"\n\nConsider the following\
    \ program:\n\n```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n\
    \    int num[2][3]={{0,1,5},{6,7,8}};\n    int i;\n    for(i=0;i<2;i++)\n    {\n\
    \        cout<<\"\\nAddress of num[\"<<i<<\"] is \"<<num[i];\n    }\n}\n```\n\n\
    When you will run this program, you will see that the difference between address\
    \ of num[0] and num[1] is of 12 bytes. It means that num[0] contains three memory\
    \ blocks num[0][0], num[0][1] and num[0][2], then the memory block of num[1] starts.\
    \ More amazingly this program shows that each array whose dimension is one less\
    \ than the actual array represents the address of the actual array. It means we\
    \ can access the elements of multidimensional array by efficient use of pointers.\n\
    \n## Returning an array\n\nAn array can be returned also. We can return an array\
    \ either by using pointers or by reference.\n\n### Method1: Returning the array\
    \ using pointers\n\nEntire array can be returned using pointers. Following program\
    \ illustrates this:\n\n```cpp\n#include<iostream>\nusing namespace std;\nint*arr();\n\
    int main()\n{\n    int*a=arr();\n    cout<<*a<<*(a+1)<<\"\\n\";\n}\nint*arr()\n\
    {\n    int num[2]={1,2};\n    return num;\n}\n```\n\nOutput\n\n12\n\n### Method2:\
    \ Returning an array using reference\n\nArray can be returned using reference.\
    \ Following program illustrates this method:\n\n```cpp\n#include<iostream>\nusing\
    \ namespace std;\nint&arr();\nint main()\n{\n    int a=arr();\n    cout<<a<<(a+1)<<\"\
    \\n\";\n}\nint&arr()\n{\n    int num[2]={1,2};\n    return num[0];\n}\n```\n\n\
    Output\n\n12\n\n![](img/5340985153962870d4e4a3b9453b9146_104_0.png)\n"
