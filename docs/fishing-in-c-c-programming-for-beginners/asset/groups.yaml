    \ false。你错了；这是现代计算机能力的一个演示。我们的计算机是多任务的，这并不意味着它们在程序中同时执行多个任务；相反，它们在任务之间跳转得太快，以至于我们无法察觉。但后果体现在结果上。这里，首先\
