    \  cout<<i;\n}\n```\n\n该程序将不打印任何内容，因为第一条语句总是首先执行，然后在进入循环内的语句之前，会检查条件。所以，条件为 false，因此不会打印任何内容。\n\
    \n其他有效的 for 循环格式包括\n\n```\nfor(i=0,j=5;i<5&&j>3;i++,j=j-5)\n{\n/*Statements*/\n\
    }\n```\n\n请仔细观察，我们不能在第二条语句中使用多于一条语句，如果想要这样做，则必须用逻辑运算符将它们连接起来。\n\n请参考以下程序：\n\n\
    ```\n#include<iostream>\nusing namespace std;\nint main()\n{\n     int i=5;\n\
    \     for(i=1;i<10&&i=11;i++)\n     cout<<i;\n}\n```\n\n在这里，我们使用了逻辑运算符，但编译器会将其读作\
