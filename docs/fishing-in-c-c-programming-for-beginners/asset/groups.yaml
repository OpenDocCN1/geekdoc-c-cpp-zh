    \     puts(ch1);\n     return 0;\n}\nchar*modify_string()\n{\n     char *ch=\"\
    Fishing in C++\";\n     return ch;\n}\n```\n\n输出\n\nFishing in C++\n\n## strlen\n\
    \n该函数返回字符串的长度。\n\n考虑以下程序\n\n```cpp\n#include<iostream>\n#include<string.h>\nusing\
