    \n### 显示字符\n\n以下是显示字符（例如 's'）的示例：\n\n```\n#include<iostream>\nusing namespace\
    \ std;\nint main()\n{\n    cout<<'s';\n}\n```\n\n输出\n\ns\n\n### 显示字符串\n\n```\n\
    #include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"This is a\
