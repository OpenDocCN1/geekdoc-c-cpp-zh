    \ int | 2 | 4 |\n| signed int | 2 | 4 |\n| long | 4 | 4 |\n| unsigned long | 4\
    \ | 4 |\n| signed long | 4 | 4 |\n| float | 4 | 4 |\n| unsigned float | 不存在 |\
    \ |\n| signed float | 不存在 | |\n| double | 8 | 8 |\n| unsigned double | 不存在 | |\n\
    | signed double | 不存在 | |\n| long double | 10 | 16 |\n| unsigned long double |\
    \ 不存在 | |\n| signed long double | 不存在 | |\n\n| 已分配内存（字节） | 范围 |\n|---|---|\n|\
    \ 1 | -128 到 +127<br>无符号：0 到 +255<br>有符号：-128 到 +127 |\n| 2 | -32768 到 32767<br>无符号：0\
