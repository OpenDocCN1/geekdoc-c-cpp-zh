    \ to other.\n\nConsider the following program:\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nstruct student\n{\n char name[50];\n char section;\n int\
    \ roll;\n};\nint main()\n{\n struct student s1;\n cout << \"Enter the name of\
    \ student\\n\";\n gets(s1.name);\n cout << \"Enter the section of student\\n\"\
    ;\n cin>>s1.section;\n cout << \"Enter the roll number of the student\\n\";\n\
    \ cin>>s1.roll;\n\n struct student s2;\n s2.name=s1.name; //Here name is being\
    \ copied\n s2.roll=s1.roll;//Here roll is being copied\n s2.section=s1.section;//Here\
    \ section is being copied\n\n cout<<(\"\\nThe name of student is: \");\n puts(s2.name);\n\
    \ cout<<(\"\\nThe section of the student is: \"<<s2.section);\n cout<<(\"\\nRoll\
    \ number of the student is: \"<<s2.roll);\n\n return 0;\n}\n```\n\n### Output\n\
    \nEnter the name of student\nAman Kumar Jha\nEnter the section of the student\n\
    D\nEnter the roll number of the student\n12\n\nThe name of student is Aman Kumar\
    \ Jha\nThe section of the student is: D\nRoll number of the student is: 12\n\n\
    ### Method2: Copying the structure itself\n\nCompiler also gives us the feature\
    \ to copy the structure itself instead of copying each and every element. Suppose\
    \ there is a structure s1 and another s2. Then by just writing s2=s1; all the\
    \ corresponding elements will be copied. E.g. Consider the following program:\n\
    \n```cpp\n#include<iostream>\nusing namespace std;\nstruct student\n{\n char name[50];\n\
    \ char section;\n int roll;\n};\n\nint main()\n{\n    struct student s1;\n   \
    \ cout << \"Enter the name of student\\n\";\n    gets(s1.name);\n    cout << \"\
    Enter the section of student\\n\";\n    cin>>s1.section;\n    cout << \"Enter\
    \ the roll number of the student\\n\";\n    cin>>s1.roll;\n\n    struct student\
    \ s2;\n    s2=s1;//Here entire structure is copied\n    cout<<(\"\\nThe name of\
    \ student is : \");\n    puts(s2.name);\n    cout<<(\"\\nThe section of the student\
    \ is: \"<<s2.section);\n    cout<<(\"\\nRoll number of the student is: \"<<s2.roll);\n\
    \n    return 0;\n}\n```\n\nThis program will give the same output as the previous\
    \ one.\n\n## Passing structure elements to a function\n\nStructure elements can\
    \ be passed as arguments to the function like ordinary variables. Following program\
    \ illustrates this method:\n\n```cpp\n#include<iostream>\nvoid display(char* n,\
    \ char c, int i);\nusing namespace std;\nstruct student\n{\n    char name[50];\n\
    \    char section;\n    int roll;\n};\nint main()\n{\n    struct student s1;\n\
