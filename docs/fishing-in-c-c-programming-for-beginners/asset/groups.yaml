    n\";\n    }\n    return 0;\n}\n```\n\n## 输出\n\n```\nCDEF HIJK MNOP RSTU\nDEFG\
    \ IJKL NOPQ STUV\nEFGH JKLM OPQR TUVW\nFGHI KLMN PQRS UVWX\nGHIJ LMNO QRST VWXY\n\
    ```\n\n好吧，这个程序使用了一个exit(0)函数。这是一个用于返回到父函数并返回一个值（这里为零）的函数。这个函数有时需要process.h头文件。因此，如果你的编译器显示错误exit()没有原型或exit()未声明，那么只需在程序中添加一行#include<process.h>\n\
    \n## 将字符串传递给函数\n\n字符串也可以传递给函数。它可以以两种方式传递：\n\n- i. 按值调用\n- ii. 按引用调用\n\n考虑以下程序：\n\
