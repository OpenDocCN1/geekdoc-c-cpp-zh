  md: "\n## Hello World\n\nSee, here \\b moves the cursor back to character 'c' and\
    \ then we overwrite c with a space. We can also overwrite any character by space.\n\
    \n### Consider the following program:\n\n```cpp\n#include<iostream>\nusing namespace\
    \ std;\nint main()\n{\n    cout<<\"Helloc\\b World\";\n}\n```\n\n### Output\n\n\
    Hello World\n\nHere, we have left a space just after \\b and so c is overwritten\
    \ with space and we get our desired output Hello World.\n\n## \\f Formfeed\n\n\
    This character is negligibly used in programs but it is widely used if a printer\
    \ or word file is involved. This character signals the OS that the current form\
    \ has ended and it is time to start a new form. But, in program output it only\
    \ displays the character that plays this role for a printer or file. So, if we\
    \ want to insert a new page in a word file through a program, we use \\f there.\
    \ Since most books cover only text files and binary files, they do not tell you\
    \ about this.\n\nTo verify what we have learnt here, after studying about files,\
    \ come here and run the following program:\n\n```cpp\n#include<iostream>\n#include<fstream>\n\
    using namespace std;\nint main()\n{\n    fstream fout;\n    fout.open(\"A.doc\"\
    , ios::out);\n\n    if(!fout)\n    {\n        cout<<\"Can't open\";\n        return\
    \ -1;\n    }\n\n    fout<<\"Hello World\\fHello World\";\n\n    fout.close();\n\
    }\n```\n\nHere, a file A.doc will be created and written. When you open A.doc,\
    \ you will see Hello World written on two different pages. This confirms that\
    \ the character \\f separates the forms.\n\n![](img/5340985153962870d4e4a3b9453b9146_31_0.png)\n\
    \n## \\n Newline\n\nThis character is for line feed, i.e., whatever we write after\
    \ this character is written on a new line. Consider the following program:\n\n\
    ```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"\
    Hello\\nWorld\";\n}\n```\n\n### Output\n\nHello\n\nWorld\n\nHere, Hello and World\
    \ will be displayed on different lines.\n\n## \\r Carriage return\n\nThis is not\
    \ like \\n. The problem with people is that they are generally never explained\
    \ where to use \\r. So they ask many questions about its use on forums. Well,\
    \ \\r moves the cursor to the beginning of the current line being displayed. For\
    \ example, consider the following program:\n\n```cpp\n#include<iostream>\nusing\
    \ namespace std;\nint main()\n{\n    cout<<\"Hello world\\rBlack\";\n}\n```\n\n\
    ### Output:\n\nBlack world\n\nSee, here after printing Hello World, the cursor\
    \ moves to the beginning of the line, and then since it has to write Black, it\
    \ overwrites it with Black. Now you have understood that \\r is something like\
    \ \\b but not like \\n at all. You can also say this is equivalent to the Home\
    \ button on our keyboard.\n\n## \\t Tab\n\nThis is used to leave a tab space on\
    \ the output screen. A tab space is generally equal to five spacebars. For example,\
    \ consider the following program:\n\n```cpp\n#include<iostream>\nusing namespace\
    \ std;\nint main()\n{\n    cout<<\"Hello world\\tBlack\";\n}\n```\n\n### Output\n\
    \nHello world   Black\n\nThis is generally used to create a menu bar on the output\
    \ screen. For example, consider the following program:\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    cout<<\"1.File\\t2.Edit\\t3.View\\t4.Search\\\
    t5.Exit\";\n}\n```\n\n### Output\n\n1.File   2.Edit   3.View   4.Search   5.Exit\n\
    \n## Various uses of backslash\n\nSuppose we are illustrating \\b to someone,\
    \ and we have to display \\b and not its effect. You may think that `cout<<\"\\\
    b\";` will display \\b, but then you will realize that it will instead try to\
    \ move the cursor one step backward. So, how to print \\b? The solution is to\
    \ use a double backslash. For example, consider the following program:\n\n```cpp\n\
    #include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"\\\\b\";\n\
    \    cout<<\"\\\\n\";\n    cout<<\"\\\\n\";\n    cout<<\"\\\\n\";\n    cout<<\"\
    \\\\\"\";\n}\n```\n\n### Output\n\n\\b\n\n\n\n\"\n\nSee here, to print a single\
    \ apostrophe, double apostrophe, and backslash, we have to use a backslash before\
    \ them.\n\n## puts() function\n\nputs() is a function used to print string output\
    \ and then place a line feed. This function is defined in stdio.h. So, if at compile\
    \ time the compiler gives an error that puts() should have a prototype or puts()\
    \ is undeclared, then just add `#include<stdio.h>` at the beginning of the program.\
    \ All latest compilers include this function in iostream too.\n\nFor example,\
    \ consider the following program:\n\n```cpp\n#include<iostream>\nusing namespace\
    \ std;\nint main()\n{\n    puts(\"Aman\");\n    puts(\"Kumar\");\n}\n```\n\n###\
    \ Output:\n\nAman\nKumar\n\nHere, Aman and Kumar will be printed on separate lines\
    \ instead of using the newline character. This is one of the features of puts().\n\
    \n## cout.put()\n\nThis function places a character on the screen. Unlike puts(),\
    \ it does not insert any line feed. Consider the following program:\n\n```cpp\n\
    #include<iostream>\nusing namespace std;\nint main()\n{\n    cout.put('a');\n\
    \    cout.put('k');\n}\n```\n\n### Output:\n\nak\n\nNow, consider the following\
    \ program:\n\n```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n\
    \    cout.put('a').put('k');\n}\n```\n\n### Output:\n\nak\n\nThis program shows\
    \ that .put() can be cascaded multiple times.\n\n## cout.write()\n\nThis is used\
    \ to display a particular number of bytes on the output screen. For example, consider\
    \ the following program:\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    int main()\n{\n    cout.write(\"Aman Kumar Jha\", 7);\n}\n```\n\n### Output:\n\
    \nAman Ku\n\nHere, only the initial seven bytes of the string passed will be displayed.\n\
    \n## endl\n\nThis macro produces a newline character, exactly like inserting `\\\
    n`, but it also has an additional behavior when used with buffered streams: the\
    \ buffer is flushed. For example, consider the following program:\n\n```cpp\n\
    #include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"Hello\"<<endl;\n\
    \    cout<<\"world\";\n}\n```\n\n### Output\n\nHello\n\nworld\n\nSee, the use\
    \ of endl is shown in the line above. Consider the following program:\n\n```cpp\n\
    #include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"Hello\"<<endl<<\"\
    world\";\n}\n```\n\nThis program will have the same output as the previous one.\n\
    \n## oct, dec, hex\n\nThese are some of the macros used to display the octal and\
    \ hexadecimal values of a variable or constant. For example, consider the following\
    \ program:\n\n```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n\
    \    cout<<17<<endl;\n    cout<<oct<<17<<endl;\n    cout<<hex<<17<<endl;\n   \
    \ cout<<dec<<17;\n}\n```\n\n### Output\n\n17\n21\n11\n17\n\nThese macros also\
    \ work fine with functions. After reading the functions chapter, come here and\
    \ see the following program:\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    int add(int, int);\nint main()\n{\n    cout<<add(5, 6)<<endl;\n    cout<<oct<<add(5,\
    \ 6);\n}\n\nint add(int a, int b)\n{\n    return a + b;\n}\n```\n\n### Output\n\
    11\n13\n\n## iomanip.h\n\nThis is a header file used for input/output manipulation.\
    \ We shall include it for various purposes. It includes various functions, macros,\
    \ and classes. Some of them are very useful, and we shall discuss them.\n\n- setprecision()\n\
    - setbase()\n- setw()\n\n### setbase()\n\nsetbase() is an alternative to the three\
    \ different macros oct, dec, and hex.\n\n```cpp\n#include<iostream>\n#include<iomanip>\n\
    using namespace std;\nint main()\n{\n    cout<<setbase(8)<<17<<endl;\n    cout<<setbase(10)<<17<<endl;\n\
    \    cout<<setbase(16)<<17;\n}\n```\n\n### Output\n21\n17\n11\n\nAny number cannot\
    \ be passed as an argument to setbase(), as it will display only octal, decimal,\
    \ or hexadecimal values, so only 8, 10, 16 can be used.\n\n### setprecision()\n\
    \nIt is used to set the precision points. Suppose you have a value, say 21.23456789,\
    \ and you want to display this number up to five digits; then the program will\
    \ be:\n\n```cpp\n#include<iostream>\n#include<iomanip>\nusing namespace std;\n\
    int add(int, int);\nint main()\n{\n    float a = 21.23456789;\n    cout<<setprecision(5)<<a;\n\
    }\n```\n\n### Output\n21.345\n\nNow, think about what the output will be if we\
    \ try to set the precision point to less than 2. See the following program:\n\n\
    ```cpp\n#include<iostream>\n#include<iomanip>\nusing namespace std;\nint add(int,\
    \ int);\nint main()\n{\n    float a = 21.23456789;\n    cout<<setprecision(1)<<a;\n\
    }\n```\n\n### Output\n2e+001\n\nSo, it starts converting the number to scientific\
    \ notation as the value in setprecision() decreases. However, using it we cannot\
    \ decide the number of digits to display after the decimal point using rounding.\
    \ Here, setw() is used.\n\n### setw()\n\nThis function allows us to display a\
    \ fixed number of digits after the decimal point with rounding. For example, consider\
    \ the following program:\n\n```cpp\n#include<iostream>\n#include<iomanip>\nusing\
    \ namespace std;\nint add(int, int);\nint main()\n{\n    float a = 21.23456789;\n\
    \    cout<<setw(4)<<a;\n}\n```\n\n### Output\n21.2346\n"
  mdcn: "\n\n## Hello World\n\n看，这里 \\b 将光标移回字符 'c'，然后我们用空格覆盖 c。我们也可以用空格覆盖任何字符。\n\n\
    ### 请参考以下程序：\n\n```cpp\n#include<iostream>\nusing namespace std;\nint main()\n\
    {\n    cout<<\"Helloc\\b World\";\n}\n```\n\n### 输出\n\nHello World\n\n这里，我们在 \\\
    b 后留了一个空格，因此 c 被空格覆盖，我们得到了所需的输出 Hello World。\n\n## \\f 换页符\n\n该字符在程序中很少使用，但如果涉及打印机或\
    \ Word 文件，则广泛使用。该字符向操作系统发出信号，表明当前页面已结束，是时候开始新页面了。但是，在程序输出中，它只显示用于打印机或文件的该字符所起的作用。因此，如果我们想通过程序在\
    \ Word 文件中插入新页面，我们会在那里使用 \\f。由于大多数书籍只介绍文本文件和二进制文件，因此它们不会告诉你这一点。\n\n要验证我们在这里学到的内容，在学习完文件知识后，请返回此处并运行以下程序：\n\
    \n```cpp\n#include<iostream>\n#include<fstream>\nusing namespace std;\nint main()\n\
    {\n    fstream fout;\n    fout.open(\"A.doc\", ios::out);\n\n    if(!fout)\n \
    \   {\n        cout<<\"Can't open\";\n        return -1;\n    }\n\n    fout<<\"\
    Hello World\\fHello World\";\n\n    fout.close();\n}\n```\n\n这里，将创建并写入一个名为 A.doc\
    \ 的文件。当你打开 A.doc 时，你会看到 Hello World 写在两个不同的页面上。这证实了字符 \\f 分隔了页面。\n\n![](img/5340985153962870d4e4a3b9453b9146_31_0.png)\n\
    \n## \\n 换行\n\n该字符用于换行，即在该字符之后写的任何内容都将写在新行上。请参考以下程序：\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    cout<<\"Hello\\nWorld\";\n}\n```\n\n\
    ### 输出\n\nHello\n\nWorld\n\n这里，Hello 和 World 将显示在不同的行上。\n\n## \\r 回车\n\n这与 \\\
    n 不同。问题在于，人们通常从未被解释过在哪里使用 \\r。因此，他们在论坛上关于其用法提出了许多问题。嗯，\\r 将光标移动到当前显示行的开头。例如，请参考以下程序：\n\
    \n```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"\
    Hello world\\rBlack\";\n}\n```\n\n### 输出：\n\nBlack world\n\n看，这里在打印 Hello World\
    \ 之后，光标移动到行首，然后由于需要写入 Black，它用 Black 覆盖了它。现在你已经理解了，\\r 有点像 \\b，但与 \\n 完全不同。你也可以说这相当于键盘上的\
    \ Home 键。\n\n## \\t 制表符\n\n这用于在输出屏幕上留出一个制表符空格。一个制表符空格通常等于五个空格。例如，请参考以下程序：\n\n\
    ```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"\
    Hello world\\tBlack\";\n}\n```\n\n### 输出\n\nHello world   Black\n\n这通常用于在输出屏幕上创建菜单栏。例如，请参考以下程序：\n\
    \n```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"\
    1.File\\t2.Edit\\t3.View\\t4.Search\\t5.Exit\";\n}\n```\n\n### 输出\n\n1.File  \
    \ 2.Edit   3.View   4.Search   5.Exit\n\n## 反斜杠的各种用法\n\n假设我们正在向某人演示 \\b，并且我们必须显示\
    \ \\b 而不是其效果。你可能会认为 `cout<<\"\\b\";` 会显示 \\b，但随后你会发现它反而会尝试将光标向后移动一步。那么，如何打印 \\\
    b 呢？解决方案是使用双反斜杠。例如，请参考以下程序：\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    int main()\n{\n    cout<<\"\\\\b\";\n    cout<<\"\\\\n\";\n    cout<<\"\\\\n\"\
    ;\n    cout<<\"\\\\n\";\n    cout<<\"\\\\\"\";\n}\n```\n\n### 输出\n\n\\b\n\n\n\n\
    \"\n\n看，要打印单个撇号、双撇号和反斜杠，我们必须在它们前面使用反斜杠。\n\n## puts() 函数\n\nputs() 是一个用于打印字符串输出然后换行的函数。该函数在\
    \ stdio.h 中定义。因此，如果在编译时编译器报错说 puts() 应该有原型或 puts() 未声明，那么只需在程序开头添加 `#include<stdio.h>`。所有最新的编译器也在\
    \ iostream 中包含此函数。\n\n例如，请参考以下程序：\n\n```cpp\n#include<iostream>\nusing namespace\
    \ std;\nint main()\n{\n    puts(\"Aman\");\n    puts(\"Kumar\");\n}\n```\n\n###\
    \ 输出：\n\nAman\nKumar\n\n这里，Aman 和 Kumar 将分别打印在不同的行上，而不是使用换行符。这是 puts() 的一个特性。\n\
    \n## cout.put()\n\n此函数在屏幕上放置一个字符。与 puts() 不同，它不插入任何换行。请参考以下程序：\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    cout.put('a');\n    cout.put('k');\n\
    }\n```\n\n### 输出：\n\nak\n\n现在，请参考以下程序：\n\n```cpp\n#include<iostream>\nusing namespace\
    \ std;\nint main()\n{\n    cout.put('a').put('k');\n}\n```\n\n### 输出：\n\nak\n\n\
    此程序显示 .put() 可以级联多次。\n\n## cout.write()\n\n这用于在输出屏幕上显示特定数量的字节。例如，请参考以下程序：\n\n\
    ```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n    cout.write(\"\
    Aman Kumar Jha\", 7);\n}\n```\n\n### 输出：\n\nAman Ku\n\n这里，只会显示传递字符串的前七个字节。\n\n\
    ## endl\n\n该宏产生一个换行字符，就像插入 `\\n` 一样，但当与缓冲流一起使用时，它还有一个额外行为：缓冲区会被刷新。例如，请参考以下程序：\n\
    \n```cpp\n#include<iostream>\nusing namespace std;\nint main()\n{\n    cout<<\"\
    Hello\"<<endl;\n    cout<<\"world\";\n}\n```\n\n### 输出\n\nHello\n\nworld\n\n看，上面一行展示了\
    \ endl 的用法。请参考以下程序：\n\n```cpp\n#include<iostream>\nusing namespace std;\nint main()\n\
    {\n    cout<<\"Hello\"<<endl<<\"world\";\n}\n```\n\n此程序的输出与前一个程序相同。\n\n## oct,\
    \ dec, hex\n\n这些是用于显示变量或常量的八进制和十六进制值的一些宏。例如，请参考以下程序：\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    cout<<17<<endl;\n    cout<<oct<<17<<endl;\n\
    \    cout<<hex<<17<<endl;\n    cout<<dec<<17;\n}\n```\n\n### 输出\n\n17\n21\n11\n\
    17\n\n这些宏也与函数配合使用良好。在阅读完函数章节后，请返回此处并查看以下程序：\n\n```cpp\n#include<iostream>\nusing\
    \ namespace std;\nint add(int, int);\nint main()\n{\n    cout<<add(5, 6)<<endl;\n\
    \    cout<<oct<<add(5, 6);\n}\n\nint add(int a, int b)\n{\n    return a + b;\n\
    }\n```\n\n### 输出\n11\n13\n\n## iomanip.h\n\n这是一个用于输入/输出操作的头文件。我们将出于各种目的包含它。它包括各种函数、宏和类。其中一些非常有用，我们将讨论它们。\n\
    \n- setprecision()\n- setbase()\n- setw()\n\n### setbase()\n\nsetbase() 是 oct、dec\
    \ 和 hex 三个不同宏的替代方案。\n\n```cpp\n#include<iostream>\n#include<iomanip>\nusing namespace\
    \ std;\nint main()\n{\n    cout<<setbase(8)<<17<<endl;\n    cout<<setbase(10)<<17<<endl;\n\
    \    cout<<setbase(16)<<17;\n}\n```\n\n### 输出\n21\n17\n11\n\n不能将任何数字作为参数传递给 setbase()，因为它只会显示八进制、十进制或十六进制值，因此只能使用\
    \ 8、10、16。\n\n### setprecision()\n\n它用于设置精度点。假设你有一个值，例如 21.23456789，并且你想显示该数字直到五位数字；那么程序将是：\n\
    \n```cpp\n#include<iostream>\n#include<iomanip>\nusing namespace std;\nint add(int,\
    \ int);\nint main()\n{\n    float a = 21.23456789;\n    cout<<setprecision(5)<<a;\n\
    }\n```\n\n### 输出\n21.345\n\n现在，想想如果我们尝试将精度点设置为小于 2，输出会是什么。请参考以下程序：\n\n```cpp\n\
    #include<iostream>\n#include<iomanip>\nusing namespace std;\nint add(int, int);\n\
    int main()\n{\n    float a = 21.23456789;\n    cout<<setprecision(1)<<a;\n}\n\
    ```\n\n### 输出\n2e+001\n\n因此，随着 setprecision() 中的值减小，它开始将数字转换为科学计数法。但是，使用它我们无法决定使用四舍五入显示小数点后的位数。在这里，使用了\
    \ setw()。\n\n### setw()\n\n此函数允许我们使用四舍五入显示小数点后固定数量的数字。例如，请参考以下程序：\n\n```cpp\n\
    #include<iostream>\n#include<iomanip>\nusing namespace std;\nint add(int, int);\n\
    int main()\n{\n    float a = 21.23456789;\n    cout<<setw(4)<<a;\n}\n```\n\n###\
    \ 输出\n21.2346\n\n"
