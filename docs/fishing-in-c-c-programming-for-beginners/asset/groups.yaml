    \ 函数一样，setbase() 也可以与 cin 一起使用。\n\n## 自增与自减运算符 (++ & --)\n\n这是一个非常重要的运算符。它有以下几种类型：\n\
    \n- 1. 预自增：++variable_name：该运算符先将值加一，然后开始计算\n- 2. 预自减：--variable_name：该运算符先将值减一，然后开始计算\n\
    - 3. 后自增：variable_name++：该运算符先计算，然后将值加一\n- 4. 后自减：variable_name--：该运算符先计算，然后将值减一\n\
    \n请考虑以下示例：\n\n```\n#include<iostream>\nusing namespace std;\nint main()\n{\nint\
    \ a=5;\ncout<<a++<<endl;\ncout<<a;\n}\n```\n\n### 输出\n\n5\n6\n\n这里，首先显示变量 a 中存储的值\
    \ 5，然后将其值加一，现在 a 中的值是 6。因此，当我们第二次打印 a 时，它显示 6。\n\n请考虑以下程序：\n\n```\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    int a=5;\n    cout<<++a<<endl;\n    cout<<a;\n\
    }\n```\n\n### 输出\n\n6\n6\n\n这里，首先将 a 中的值加一，然后打印 a 中存储的值。\n\n现在，请考虑以下程序：\n\n```\n\
    #include<iostream>\nusing namespace std;\nint main()\n{\nint a=5;\ncout<<++a<<\"\
    \ \"<<a<<\" \"<<a++;\n}\n```\n\n### 输出\n\n7 7 5\n\n要解决此类程序，首先我们从右向左计算值。对于所有涉及\
    \ ++ 或 -- 运算符的表达式，其值即为计算所得的值。因此，在上述问题中，我们得到两个表达式的值 7 和 5。现在，为了得到 a 的值，取从右向左计算时最终存储的值，因此从右向左，首先\
    \ a 中存储的值是 5，在最右侧表达式中被后自增，现在在中间表达式中该值未改变，而在最左侧表达式中，该值通过预自增操作增加到 7。因此，a 中最终存储的值是\
    \ 7。所以，第二个表达式显示的值将是 7。因此，显示了 7 7 5。\n\n上面解释的整个逻辑对 -- 运算符也同样适用。\n\n## 类型转换\n\n\
    将一种类型的变量转换为另一种类型称为类型转换。类型转换可以是自动的，也可以是手动的。请考虑以下程序\n\n```\n#include<iostream>\n\
    using namespace std;\nint main()\n{\nint a=255;\nfloat b=182;\nchar d=a-b;\ncout<<d;\n\
    }\n```\n\n这个程序看起来可能不正确，但程序中没有错误。由于 d = a - b = 255 - 182 = 73，所以 ASCII 字符 73（即大写字母\
    \ I）将存储在 d 中。因此，输出将打印为 I。\n\n"
