    \ in C”的开头，即343233处，但是……我们不想要那样，我们的愿望是更改ch1地址处的值，而我们必须把ch的值放在那里。\n\n## 按值调用\n\n\
    考虑以下程序：\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nvoid modify_string(char\
    \ ch[]);\n\nint main()\n{\n\n    char ch[50]=\"Hacking: Exploiting computer security\
