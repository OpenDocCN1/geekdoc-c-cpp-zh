    \ a 是歧义的。但是，命名空间仅在整个块内有效，块外无效。因此，你可以按以下方式编写上述程序：\n\n```\n#include<iostream>\n\
    using namespace std;\nnamespace ns1\n{\n    int a=1;\n}\nnamespace ns2\n{\n  \
