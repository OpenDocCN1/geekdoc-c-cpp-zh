    \ (<<) 之后放置变量名。\n\n```\n#include<iostream>\nusing namespace std;\nint main()\n\
    {\n    cout<<5;\n    return 0;\n}\n```\n\n输出\n\n5\n\n### 显示变量中存储的值\n\n要显示变量，我们只需将变量名放在左移符号\
    \ (<<) 旁边。例如：\n\n```\n#include<iostream>\nusing namespace std;\nint main()\n{\n\
