    操作文件时经常使用以下三个宏：\n\n- fstream – 此类用于声明文件指针\n- NULL – 此宏有多种用途，其中之一是检查文件是否成功打开\n\
    - EOF – 此宏用于检测文件末尾\n\n### 打开文件的模式\n\n文件可以以多种模式操作。让我们来看看这些模式：\n\n- ios::in: - 从文件读取。如果文件成功打开，它会被加载到内存中，并设置一个指向文件中第一个字符的指针。如果无法打开文件，则返回\
    \ NULL。\n- ios::out: - 写入文件。如果文件成功打开，它会被加载到内存中，并设置一个指向文件中写入第一个字符位置的指针。文件中现有的数据将丢失。如果不存在该文件，则会自动创建一个新文件。如果无法打开文件，则返回\
