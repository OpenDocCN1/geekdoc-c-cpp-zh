    \ \"<<s2->roll);\n    return 0;\n}\n```\n\n## 文件操作\n\n### 有用的函数\n\n操作文件时，我们使用各种函数。其中一些是\n\
    \n- open() – 此函数用于打开文件，如果打开不成功则返回 NULL。\n- close() – 此函数用于关闭文件，如果无法关闭则返回 -1，如果成功关闭则返回\
