    \ typed language, it expects the types of the parameters x and y to be declared\
    \ at compile time. Without using templates, many overloaded versions of max()\
    \ are required (one for each data type to be supported), even though the code\
    \ for each version is essentially identical. Each version compares the arguments\
    \ and returns the larger.\n\nBy using a template, you can define a pattern for\
    \ a family of related overloaded functions by letting the data type be a parameter:\n\
    \n```\ntemplate <class T>\n\nT max(T x, T y)\n{\n    return (x > y) ? x : y;\n\
