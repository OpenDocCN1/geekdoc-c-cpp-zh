  md: "# Left shift operator\n\n<< is Left shift operator. This is a very amazing\
    \ operator. It shifts the binary equivalent of a number to the number of bits.\
    \ e.g. 5<<2 means shifting the number 5 by 2 bits.\n\n```\ne.g. 5<<2=101<<2\n\
    =00101<<2\n=10100\n=20\n```\n\nConsider the following program:\n\n```\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    int a=5;\n    int c=a<<2;\n    cout<<c;\n\
    }\n```\n\nHere, the output will be 20\n\n# Right shift operator\n\n>> is called\
    \ the right shift operator. E.g. 15>>2 means that it shifts the binary equivalent\
    \ of the number 15 to right by 2 bits\n\n```\ne.g. 15>>2=1111>>2\n=0011\n=3\n\
    ```\n\nConsider the following program:\n\n```\n#include<iostream>\nusing namespace\
    \ std;\n```"
