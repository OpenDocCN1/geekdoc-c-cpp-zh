  md: "# # Templates\n\nTemplates, also called \"generics\" or \"parameterized types\"\
    , enable you to construct a family of related functions or classes. It is used\
    \ when you need to write lots of nearly identical things. This is a special feature\
    \ of C++ comes under its property **code reuse and recycle**. Here, you will see\
    \ how to reuse a code efficiently.\n\nSuppose we define a function as follows:\n\
    \n```\nint random(int a, int b)\n{\n    return a+b+sizeof(int);\n}\n```\n\nA very\
    \ simple function , right! Now, suppose we not only want the above function for\
    \ integer but also for double, short and long double data types in our program.\
    \ Here comes a problem, we shall have to define four different functions for each\
    \ corresponding data type. Is there not any way to reduce this task? Here templates\
    \ are useful.\n\nAt first we see our tedious program then we shall simplify it\
    \ using templates:\n\n```\n#include<iostream>\nusing namespace std;\nshort random(short\
    \ a,short b)\n{\n    return a+b+sizeof(short);\n}\nint random(int a,int b)\n{\n\
    \    return a+b+sizeof(int);\n}\ndouble random(double a,double b)\n{\n    return\
    \ a+b+sizeof(double);\n}\n```"
