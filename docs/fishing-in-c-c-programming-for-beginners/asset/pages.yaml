    function, through an object of base_area class which is b1 using private inheritance
    but public members are not accessible through the private inheritance outside
    the derived class i.e. in main() function. That''s why the compiler gives the
    corresponding error.


    To remember the above chart, just remember the position of yes. You will see a
    pattern 123,122,122.


    # Note:


    +   1. Any member defined in a class is always accessible to all the functions
    declared or defined in that class

    +   2. Private members of the base class cannot be inherited


