    }\n```\n\n# Standard exceptions\n\nThere are various predefined exceptions which\
    \ have been defined for standard cases. Even C++ Standard library provides a base\
    \ class specifically designed to declare objects to be thrown as exceptions, its\
    \ name is exception and is defined in the <exception> header file. This class\
