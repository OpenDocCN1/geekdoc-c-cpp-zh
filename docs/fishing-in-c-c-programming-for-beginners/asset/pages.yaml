  md: "# # Polymorphism\n\nThis is the ability to process the variable, functions,\
    \ operators, objects and class in multiple ways. Function overloading, function\
    \ overriding, constructor overloading, operator overloading, pointer to base class,\
    \ virtual members etc. are various ways to introduce polymorphism in our program.\n\
    \n# ## Function overriding\n\nThe difference between function overloading and\
    \ function overriding is that in overloading the arguments are of different data\
    \ types in different functions with same name, while in overriding even the arguments\
    \ are of same data types but in different levels of classes. Here, different level\
    \ means that one function is defined in a base class, while the other one in the\
    \ derived class.\n\nConsider the following program:\n\n```\n#include <iostream>\n\
    using namespace std;\nclass polygon\n{\n    protected:\n        int length, breadth;\n\
    \    public:\n        void assign_values (int a, int b){length=a; breadth=b;}\n\
    \        int area () {return 0;}\n};\n\nclass triangle: public polygon\n{\n  \
    \  public:\n        int area() {return (length * breadth / 2); }\n}\n```"
