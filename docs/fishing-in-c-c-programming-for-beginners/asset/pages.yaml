  md: "```\nint main()\n{\n    int a=15;\n    int c=a>>2;\n    cout<<c;\n}\n```\n\n\
    Here, the output will be 3\n\n# NOT operator\n\n! is NOT operator\n\n| x | !(x)\
    \ |\n|---|---|\n| 0 | 1 |\n| 1 | 0 |\n\nNow, consider the following amazing program\n\
    \n```\n#include<iostream>\nusing namespace std;\nint main()\n{\n    int a=13;\n\
    \    int c=(!a);\n    cout<<c;\n    return 0;\n}\n```\n\nHere, output is 0, while\
    \ it should be !(13)=!(1101)=0010=2. The reason is that NOT operator considers\
    \ everything other than zero to be true. Hence 13 is non zero. So, it is true,\
    \ hence its negation will be false. So, output is zero. In the above program,\
    \ if we replace 13 by (-13) then again the output will be zero. While if we replace\
    \ 13 by 0 then the output will be 1."
