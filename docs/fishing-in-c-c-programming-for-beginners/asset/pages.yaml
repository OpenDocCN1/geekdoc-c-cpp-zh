    \ any mathematical meaning except than abstaining from displaying the corresponding\
    \ files. That’s why, whatever files you delete even from the recycle bin, are\
    \ not permanently deleted and can be recovered from various simple software such\
    \ as Recuva . So, the question arise how to delete a character from output screen?\
