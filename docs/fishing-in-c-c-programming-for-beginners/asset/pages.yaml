    \ any object with no argument, we have to declare and define a corresponding constructor\
    \ too.\n\n# Copy Constructor\n\nCopy constructors are especially useful when we\
    \ want to copy in our own fashion. Like the default constructor, the copy constructor\
    \ is important, important enough that C++ thinks no class should be without one.\
    \ If you don’t provide your own copy constructor, C++ generates one for you. (This\
    \ differs from the default constructor that C++ provides unless your class has\
    \ constructors defined for it.) The copy constructor provided by C++ performs\
    \ a member-by-member copy of each data member. The copy constructor that early\
    \ versions of C++ provided performed a bit-wise copy. The difference is that a\
    \ member-by-member copy invokes all copy constructors that might exist for the\
    \ members of the class, whereas a bit-wise copy does not.\nWe can also define\
    \ our own copy constructor.\nConsider the following program:\n\n```\n#include<iostream>\n\
    using namespace std;\n```"
