  md: "# # Variables, constants and Keywords\n\nThe golden rule of computer is that\
    \ nothing can be used without storing it. It does not mean that compiler will\
    \ always show you that value has been stored. Many of the programming languages\
    \ even including C++ and python do not always show that the value they are using\
    \ are being stored. Constants are those data types which cannot be modified, once\
    \ it is defined. On the contrary, variables are those data types which can be\
    \ modified, again and again. Suppose we want to operate a number whose initial\
    \ value is 5 and final value depends on the intermediate operations, then we store\
    \ it in a variable and then operate that variable according to our desire. In\
    \ variable section, we shall learn how to store and use the numbers, characters\
    \ and strings in a variable.\n\n# ## Character sets\n\nFollowing character set\
    \ can be used in a C++ program\n\n+   **Alphabets:** A,B,...,Z,a,b,...,Z,\n+ \
    \  \n+   **Digits:** 0,1,...,9\n+   \n+   **Special characters:** ~!@#$%^&*()-+=[]{}|;':\"\
    ,<>?/_\n\n# ## Keywords\n\nThese are special words which is required for special\
    \ purposes. You must not use it for variable names else compiler will show you\
    \ the errors. These words will be discussed in detail wherever required. Now let\
    \ us see the keywords used in the program\n\n| asm | auto | bool | break | case\
    \ | catch | char | class |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\
    | const | const_cast | continue | default | delete | do | double | dynamic_cast\
    \ |\n| else | enum | explicit | export | extern | false | float | for |\n| friend\
    \ | goto | if | inline | int | long | mutable | namespace |\n| new | operator\
    \ | private | protected | public | register | reinterpret_cast | return |\n| short\
    \ | signed | sizeof | static | static_cast | struct | switch | template |\n| this\
    \ | throw | true | try | typedef | typeid | typename | union |\n| unsigned | using\
    \ | virtual | void | volatile | wchar_t | while | |\n\n# ## Variables\n\nA variable\
    \ is the alias for a memory location, where some data can be stored. E.g.\n\n\
    ```\nint num=5;\n```\n\nIn this assignment, the value 5 is assigned to the variable\
    \ num which is an int type variable. Now, a basic question arises. Can we store\
    \ any number in integer type variable? The answer is no. Following is the range\
    \ of the data types we can use:"
