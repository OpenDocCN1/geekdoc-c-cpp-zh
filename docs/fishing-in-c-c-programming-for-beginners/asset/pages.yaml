    \ program will display an error saying “[Error] conflicting declaration ‘float\
    \ var’”.\n\nBut it is possible to define two variables with the same name using\
    \ namespaces!\n\nTo declare a namespace, we use the following syntax:\n\n```\n\
    namespace namespace_name\n{\n//statements\n}\n```\n\nAfter writing the above line,\
    \ whatever we write those are parts of this namespace.\n\nIf we are in another\
    \ namespace then we use resolution operator (::) to access the elements of that\
    \ namespace.\n\nConsider the following program:\n\n```\n#include<iostream>\nusing\
    \ namespace std;\nnamespace ns1\n{\n    int var=3;\n```"
