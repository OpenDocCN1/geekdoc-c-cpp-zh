  md: "# Variables Revisited\n\nInitially, we talked of variables there we did not\
    \ talk about the type of variables on the basis of accessibility. Well, On the\
    \ basis of accessibility variables are of four types:\n\n+   1. Automatic storage\
    \ class\n+   2. Static storage class\n+   3. Register storage class\n+   4. Extern\
    \ storage class\n\nAuto – It is the default data type for all the variables used\
    \ inside a function, hence we did not write auto anywhere.\n\ne.g. auto int a=5;\n\
    \nDefault initial value – An unpredictable value, which is often called a garbage\
    \ value.\nLife – Till the control remains within the block in which the variable\
    \ is defined.\nScope – Local to the block in which the variable is defined.\n\
    Storage – Memory.\n\nStatic–The peculiarity of static variable is that it remembers\
    \ the last value stored.\n\nConsider the following program\n\n```\n#include<iostream>\n\
    using namespace std;\nvoid change();\nint main()\n{\n    change();\n    change();\n\
    }\nvoid change()\n{\n    static int a=0;\n    a++;\n    cout<<a;\n}\n```\n\nThis\
    \ program will display 12. This displays the fact that initially value of a was\
    \ increased to 1 from 0. Now, when the function was called second time, its value\
    \ was increased from 1 to 2."
