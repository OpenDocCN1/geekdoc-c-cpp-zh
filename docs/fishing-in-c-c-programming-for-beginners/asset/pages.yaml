    \ the first beep you will listen. Why? You may think that it takes about 0.887\
    \ milli second for sound to reach from the computer to our ears, then eardrum\
    \ vibrates and then accordingly the signal is sent to our brain. While it takes,\
    \ about 1.0167 nano second to reach from computer to our eye sensors and then\
    \ signal is directly to our brain. So, the time lag which arises in vibrating\
    \ the sensors speakers, reaching sound to our ears and then vibrating the ear\
    \ drums does not arises while displaying the output. So, we see Hello World before\
    \ even hearing first beep. Well, you are right but there is another strong reason\
    \ behind this, If we want to perform any task using command line, it is much faster\
    \ than the GUI approach. This means our GUI computers are the extended version\
    \ of command line computers, and not vice versa. If anyone is thinking that his\
    \ computer is much advanced having very powerful and colourful GUI, and command\
    \ line is added to it externally only for those who are accustomed to it, then\
    \ he has to rethink again. Well scientist is busy in extending command line to\
    \ GUI but they are not working to design any computer which can perform tasks\
    \ more faster in GUI than through command line. So, program pass the signal to\
    \ produce the beep to operating system, then it gave the signal to display the\
    \ Hello World, but the OS needs more time to convert an electrical signal to sound\
    \ signal than to display. Well the speed order is as follows:\n\n+   Command line\
    \ signal>Display signal>Sound signal\n\n# \\b Backspace\n\nSuppose you want to\
