  md: "```\n}\ncatch(...)\n{\n    cout<<\"External Error occurred\";\n}\nreturn 0;\n\
    }\n```\n\nOutput\n\nExternal error occurred\n\n# Limiting exceptions types for\
    \ functions\n\nWhile declaring a function we can limit the exception type it might\
    \ directly or indirectly throw by appending a throw suffix to the function declaration.\
    \ So the function can be declared in any of the following three ways:\n\n+   return_type\
    \ func_name(arg1,arg2,...) throw(int); //Only integral exceptions allowed\n+ \
    \  return_type func_name(arg1,arg2,...) throw(char); //only char exceptions allowed\n\
    +   return_type func_name(arg1,arg2,...) throw(); // No exceptions allowed\n+\
    \   return_type func_name(arg1,arg2,...); //All exceptions allowed\n\nHere see,\
    \ if throw function is passed no arguments, then no exceptions will be thrown\
    \ to catch. If we do not write throw() then all types of exceptions are allowed.\n\
    \nAn example is:\n\n```\n#include<iostream>\nusing namespace std;\nvoid allocate_memory()throw();\n\
    void allocate_memory()throw()\n{\n    long double*array=new long double[10000000000000000];\n\
    }\n```"
