    | Permission level | private members | protected members | public members |

    |---|---|---|---|

    | Accessibility | | | |

    | Accessible in base class | yes | yes | yes |

    | Accessible in derived class | no | yes | yes |

    | Accessible outside the derived class | no | no | yes |


