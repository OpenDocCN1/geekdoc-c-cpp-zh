  md: '# File operations


    # Useful functions


    To operate a file, we use various functions. Some of those are


    open() – This function is used to open a file and returns NULL if not successfully
    opened.


    close() – This function is used to close the file and returns -1 if cannot close
    and 0 if successfully closed


    get() – This function is used to get a character from file.


    getline()- This function is used to get a string from the file.


    # Useful macros


    Three macros are frequently used to operate a file:


    fstream – This class is used to declare a file pointer


    NULL – This has various uses, one of them is to check whether the file is opened
    successfully or not


    EOF – This macro is used to detect end of file


    # Modes to open a file


    Files can be operated in various modes. Let us see those modes:


    ios::in:- reading from the file If the file is opened successfully it is loaded
    into memory and sets up a pointer which points to the first character in it. If
    the file cannot be opened NULL is returned.


    ios::out:-writing to the file If the file is opened successfully it is loaded
    into memory and a pointer is sets up which points to the place for writing first
    character to the file. Existing data in the file will be lost. If there does not
    exist such file, then a new file will be automatically created. If the file cannot
    be opened NULL is returned.


    ios::app:- Append output to the end of the file (Should be used in combination
    with ios::out) If the file is opened successfully then it is loaded into memory
    and sets up a pointer that points to the last character in it. If the file doesn''t
    exist, a new file is created. Returns NULL, if unable to open file. It does not
    write anything if not used with ios::out


    ios::trunc:- Discard the file''s existing contents (Should be used with ios::out)
    It is used to reduce the file size to zero, so that a new data can be written
    to the file.


    ios::binary:- Open the file in binary mode'
