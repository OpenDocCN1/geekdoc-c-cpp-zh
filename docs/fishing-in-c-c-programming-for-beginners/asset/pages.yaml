  md: "2. Class templates\n\n# # Function templates\n\nFunction templates can be defined\
    \ in two ways, i.e. by using two different keywords class and typename. Both can\
    \ be used in same way.\n\nThe syntax of declaring a template is as follows:\n\n\
    ```\n```\ntemplate <typename identifier> function_declaration;\n```\n```\n\nAnother\
    \ syntax which very popular is:\n\n```\n```\ntemplate <class identifier> function_declaration;\n\
    ```\n```\n\nSo, examples of declarations can be:\n\n```\n```\ntemplate <class\
    \ myDataType> myDataType GetMax(myDataType a, myDataType b);\n```\n```\n\n```\n\
    ```\ntemplate <typename myDataType> myDataType GetMax(myDataType a, myDataType\
    \ b);\n```\n```\n\nA function template can be defined like other functions but\
    \ instead of using int, float etc. we use myDataType everywhere.\n\nSo, the corresponding\
    \ definition of random function defined above will be:\n\n```\n```\ntemplate <typename\
    \ T>\n\nT random(T a, T b)\n\n{\n     return a+b+sizeof(T);\n}\n```\n```\n\nHowever,\
    \ remember that Turbo C++ does not support typename keyword. If you are using\
    \ Turbo C++ then various programs implemented in this chapter will not work as\
    \ Turbo C++ are not updated. You should immediately leave that and switch to a\
    \ compiler of Borland C++. You can switch to Dev C++, Code block and various other\
    \ popular compilers. All of these are free and easy to use.\n\nWe can also create\
    \ objects in a function definition. So the above snippet can also be written as:\n\
    \n```\n```\ntemplate <typename T>\n\nT random(T a, T b)\n```\n```"
