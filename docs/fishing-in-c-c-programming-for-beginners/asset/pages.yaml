  md: "# Recursion\n\nRecursion is a method of calling function in which a function\
    \ is called from itself and within itself. It makes the program elegant, attractive\
    \ and compact. But, it makes the program slow to a little extent as C++ maintains\
    \ a stack while calling the functions.\n\nConsider the following program:\n\n\
    ```\n#include<iostream>\nusing namespace std;\nint factorial(int);\nint main()\n\
    {\n    int a=5;\n    cout<<factorial(a);\n}\nint factorial(int x)\n{\n    if(x==1\
    \ || x==0)\n        return 1;\n    else\n        return x*factorial(x-1);\n}\n\
    ```\n\nOutput will be 120. Here, see inside the definition of factorial function,\
    \ we have again called the factorial of (x-1). This program will be executed in\
    \ the following sequence:\n\n+   5*(5-1)\n+   5*((5-1)*(5-2))\n+   5*((5-1)*((5-2)*(5-3)))\n\
    +   5*((5-1)*((5-2)*((5-3)*(5-4))))\n+   5*((5-1)*((5-2)*((5-3)*1)))\n+   =120"
  merge: -1
