  md: '# 184 CHAPTER NINE To Eat Or Not to Eat


    # Cut the Fast Food


    If there is one thing in your diet that you absolutely do not need, it is fast
    food! Sure, it has its level of convenience for when you are on the run, but the
    consequences far outweigh the benefits it might offer.


    The fact is that fast food just does not have the nutrition that you need in a
    well-balanced diet, but it does have an awful lot of other elements that you should
    never put into your body.


    These include chemicals such as preservatives and flavor enhancers, sugars, sodium
    (salt), as well as an unbelievably high amount of trans-fats, one of the leading
    contributors to heart problems and obesity across the country.


    There really is not any excuse for eating fast food. There are so many other wonderful
    foods out there that can be just as quick and easy to eat. It is more a matter
    of breaking the habit of going for the burger, fries, soda, than actually finding
    something tasty and convenient.


    The trouble usually starts in school. They offer fast foods because they are cheap
    and popular among the students. However, this sets up bad eating habits for those
    kids for the rest of their lives! This is why many schools across the country
    and around the world are re-thinking their cafeteria strategies. It just makes
    good sense in the long run.


    Do yourself a favor and break the fast-food habit in your life. Bring your own
    lunches, and keep them interesting, so that the temptation is never there to go
    elsewhere.


    Alternatively get together with a group of five of your work-friends and have
    each of you supply a healthy lunch one day per week. This way, you will only have
    to make lunch once per week. You will have a surprise the other days, and you
    will always have something good and healthy to eat!


