    an emotional trauma, time has no meaning, and you can get stuck in that feeling.
    By writing out the feelings of frustration, anger, pain, sadness, and hurt that
    you are feeling, you are in fact helping to bring yourself out of the trauma,
    time and hurtful event, feeling and past, into the present and the here-and-now,
    the new, where you can understand the situation with new clarity and interpretations.


    This is one of the most effective ways to become aware of yourself, and integrate
    your experiences into recognition of who you are and who you are capable of being.
    It will not be long into your journal writing, that you discover that there are
    certain patterns in your life that repeat. This can include different thoughts,
    behaviors and revelations (some that may even remind you of your parents and other
    important people in your life).


    By writing out in a journal, you will become much more aware of beliefs and patterns
    that had previously been hidden, even though they were still impacting you on
