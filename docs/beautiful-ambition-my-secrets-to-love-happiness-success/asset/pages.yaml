- pgno: 145
  md: '# Four-step program


    # Step One: Add Up Your Income


    To set up a monthly budget, you need to know how much money you have available
    to spend every month, after you pay your taxes. This is your net household income,
    because it is the number that is left AFTER you have paid out your deductions
    to the government.


    If you get paid once a month, just look on your pay stub to see your net monthly
    income.


    If you get paid weekly, every two weeks or twice a month, you will need to do
    some math to figure out your net monthly income:


    +   - For weekly pay, multiply the weekly amount by 4.333


    +   - For every-two-week pay, multiply the amounts by 2.167


    +   - For twice-a-month pay, multiply the amounts by 2


    # Step Two: Estimate Your Expenses


    Here is where you write down what you think you will be spending your money on.
    It is easier to remember all the places your money goes if you divide your expenses
    into groups.


    You can lump them into big groups, like “shelter” and “loans,” or you can get
    really specific, and figure out how much you spend monthly on more particular
    things like “clothes” and “transportation.” Divide your expenses up in whatever
    way is easiest for you to keep track of.


    # Step Three: Figure Out the Difference


    After you have created your budget, you need to keep records of your actual monthly
    income and expenses. This will help you understand the difference between the
    amount you plan to spend on something, and the'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'amount you actually spend. Save your receipts, so you can really know where
    your money is going. You would be surprised how much money gets spent on that
    daily latte.


    You may be surprised to discover a lot of gaps between these two areas in the
    beginning. That is exactly why coming up with a budget is such a good idea. It
    shows how you really spend your money.


    # Step Four: Track, Trim, and Target


    After you pay attention to your spending habits for a little while, you may realize
    that you are spending more money than you are actually making. You will also see
    where you are spending too much money.


    In some cases, it is then also NOT too hard to cut expenses!


    In others, though it is and can be very hard and challenging. For example, you
    have to pay your rent and electricity bill, but you do *not* have to buy a new
    pair of purple suede shoes with a *really* cute silver buckle. (and the “must
    have” handbag to match!)


    Once you get used to only spending as much as you have coming in, you will probably
    feel much more relaxed. You will not feel the pressure of dealing with bills that
    you do not have the money to pay for.


    And you might not have enough left over to treat yourself from time to time, or
    to save some money for the future.


    **SIDEBAR:** When I was not making a lot of money early on, it meant more to me
    to have something saved in the bank, than a great pair of jeans. I would rather
    know I had something to fall back on.


    You can always get jeans later, but sometimes you need that savings as a safety
    net when when things happen that you were not expecting and when you are on your
    own, things always come up.'
