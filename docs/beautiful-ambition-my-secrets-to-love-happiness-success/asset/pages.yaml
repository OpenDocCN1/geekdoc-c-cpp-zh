  md: '# BUDGETING


    This is a word that most of us women hate to hear and think about (let alone doing
    it!). After all, who wants to live life with financial limitations? As unattractive
    as it might seem, though, it will serve you well to buy only what you can afford,
    over-spend, or go into debt.


    These fiscal discipline and good habits will ensure that your road to success
    is a much smoother one. If you choose to live beyond your means now, you will
    pay the price along the way with poor credit scores, lack of saving, debt, and
    STRESS!


    We all have budgets—some may be larger with more spending freedom than some others—but
    even when you reach your financial goals, you still have to watch what you spend
    so that you do not lose your hard-earned money. No one wants to reduce the lifestyle
    they become accustomed to.


    Furthermore, you will want to learn how to make money work for you so it can grow
    into larger amounts, which will permit you to enjoy your life in the long run,
    help the ones that you love, and give to worthy causes.


    If you want to make sure that you are not spending more than you are earning,
    you need to make a budget. A budget is a plan for your money that maps out how
    much you make (your income) and how much you spend (your expenses). The chart
    below offers some advice on how to divide and allocate your after-tax household
    income wisely.


    Guideline for after-tax expenses:


    +   - 30%: shelter


    +   - 10%: fixed expenses


    +   - 10%: loan payments


    +   - 10%: personal spending


    +   - 10%: savings'
