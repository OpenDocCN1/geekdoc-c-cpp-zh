    so that you can know when you have achieved your goal).


    +   - Set priorities (so that when you have several goals, you won''t feel overwhelmed,
    you''ll know which ones are the most important).


    +   - Write your goals down (this solidifies them and makes them feel more important).


    +   - Keep your operational goals small (having many smaller goals is better than
    one large goal, since it''s easier to see your progress and stay motivated).


    +   - Instead of setting an outcome, set a performance goal (this way, there is
    a control factor to your achievement. Nothing is more dispariting than failing
    due to reasons beyond your control, such as bad business environments, or just
