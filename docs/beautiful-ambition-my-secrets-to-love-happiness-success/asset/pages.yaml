    journals are not written for others to read, so they do not need to make sense
    to anybody but you/me. Just make sure that you keep your journal in a safe place
    that will be well away from any tempted, curious hands or eyes, in your home.


    Give yourself sufficient amounts or allocations of your precious time every day
    to dedicate to your journal. Usually, twenty to thirty minutes is good enough
    every day. It may sound like a significant time-commitment at first if you have
    never written in a journal before, but if you try it for a month, you will find
    that this is a perfectly natural length of time for getting things down on paper.


    Remember that since you are the only one who will ever see your journal, and that
    since you may or may not ever read it again, you should not worry about completing
    sentences, using neat writing, and being accurate with your spelling or grammar.
    All you need to do is express yourself. Just get it all down and in front of yourself.
