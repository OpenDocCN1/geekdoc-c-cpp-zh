  md: '# A FINAL NOTE


    Living a happy, resilient, and optimistic life is wonderful, and is also good
    for your health and longevity. Being happy actually protects you from the stresses
    of life.


    Each of us has the power to make the changes that are necessary in our lives.
    Even if we find ourselves in an unbearable situation, we can always find solace
    in the knowledge that it, too, will, and MUST change!


    Support groups and great relationships are essential to happiness. Happiness is
    actually found in everyone. Increasing it is a way to make a life more wonderful
    and also healthier, more balanced, rewarding and satisfying.


    Now that you have read this book, it is not hard to understand why so many people
    claim that being happy is easy; all you have to decide is to be a happy person!
    In fact, it was Abraham Lincoln who said “Most people are about as happy as they
    make up their minds to be.\” The choice is simple really, choose to be happy.


    Think about it—you already have so much to be thankful for! God has granted you
    many great gifts, and you should not take these gifts for granted or lightly.
    Make the effort to be happy in your life, taking advantage of all that has been
    bestowed upon you. One step at a time, one day at a time… for 30 days and then
