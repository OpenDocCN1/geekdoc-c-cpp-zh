    a difference between these types of tools.


    +   - A diary is laid out in a way that you will use it to report different events
    as if you were writing it to someone else. (In fact, if someone else was to read
    it, it would be linear enough to make sense of them).


    +   - On the other hand, a journal is a notebook that allows you to write down
    your thoughts, feelings, and reactions to things that happened to you. It might
    include certain insights you have had or discoveries made, as well as lists of
    things that you want, need, value, and wish to include among your goals.


    You can also write about dreams—both those you dream during sleep-time, and those
