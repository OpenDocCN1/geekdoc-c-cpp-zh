  md: '# 136 CHAPTER SEVEN Money Management that Makes Cents


    **EXAMPLE:** If you had $100 in a savings account that paid 2% per year simple
    interest, you would earn $2 in interest by the end of the first year.


    $100 x 0.02 x 1 = $2


    At the end of two years, you would have earned $4. The account would continue
    to grow at a rate of $2 per year, despite the fact that, at the end of the first
    year you had $102 in the account.


    # Compound Interest Calculation


    With the compound interest calculation, interest is paid on the original amount
    of the deposit, plus any interest earned.


    The formula is:


    (Original dollar amount + Earned interest) x Interest rate x Length of time =
    Amount earned


    **EXAMPLE:** If you had $100 in a savings account that paid 2% interest compounded
    annually, the first year you would earn $2 in interest. The calculation the first
    year would look like this:


    $100 x 0.02 x 1 = $2 (interest for the first year)


    $100 + $2 = $102 (total amount in account at the end of the year)


    With compound interest, at the end of the second year you would earn $2.04 in
    interest—more than the first year, because the interest would be calculated on
    your new total of $102, and not just on your original deposit as it did in the
    simple interest example. By the end of the third year, you would have earned $6.12
    in total interest. The calculations for the second and third years look like this:


