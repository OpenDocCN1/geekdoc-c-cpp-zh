- pgno: 14
  md: '# Foreword


    I remember meeting Tara in 1997 because she was a beautiful and striking model,
    motivated and ambitious and truly unforgettable. In 1998 I was surprised to learn
    she was stepping away from a blossoming career after meeting her future husband
    Jason. Now, after more than 13 years of marriage and two gorgeous children later,
    it no surprise to me that Tara is back in the forefront with a new dream and passion:
    her mission is to help all women achieve their personal dreams. In her book Beautiful
    Ambition: My Secrets to Love, Happiness & Success, Tara openly and honestly shares
    the struggles she dealt with from an early age. Her story is written with great
    enthusiasm and confidence and it becomes evident that the early years not only
    served as a training ground on how to survive, but it also helped shape the person
    she would become.


    In Beautiful Ambition Tara provides earnest women, either young or mature, with
    a step-by-step approach to setting clear goals, ultimately empowering them to
    obtain their dreams. The frankness is energizing and her ability to focus on the
    most difficult and challenging situations is truly encouraging. As you are guided
    along, Tara will inspire and motivate you and from her own personal experiences,
    she will give you key inside tips that can save you time and frustration.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# xiv FOREWORD


    This book is more than just another manual on how to fulfill your desires. It’s
    a real life action plan for self-empowerment and tools for persistence that will
    bring results. I highly recommend Beautiful Ambition for every woman who wants
    an extraordinary life. No matter what your background may be, Tara’s key message
    is clear: Success is not reserved only for a small, select group of people—it
    is for every individual who has a dream. If your vision is not yet clear and you
    are unsure of the direction you want to take or where to start, this book is bound
    to push you forward and assist in illuminating your unique path to achieving your
    goals. Success is out there for anyone willing to work for it!


    > —Janie Buss, Executive Vice President, Business Operations of Five Time World
    Champion Los Angeles Lakers and Author of Laker Girl'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/605e87565d30a27c4d415c90ab8e778a_16_0.png)


    # # Chapter 1


    # My Life:

    The Early Years


    > > “Life is the only real counselor; wisdom unfiltered through personal experience
    does not become a part of the moral tissue.”


    —Edith Wharton


    When I decided to write this book, I did it for many reasons. The first reason
    being that I felt I had much life-experience and knowledge on these topics to
    share and a willingness and passion to impart it to others.


    I am excited to sharing my life experiences with you, knowing that YOU may be
    going through a difficult time now, or you are just starting out and wanting to
    make excellent choices right from the beginning. It is always easier when you
    can learn from the mistakes of others, as well as from their triumphs.'
