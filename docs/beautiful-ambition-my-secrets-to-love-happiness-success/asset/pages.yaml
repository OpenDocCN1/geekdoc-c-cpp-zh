  img_proc: true
- pgno: 17
  md: '# 2 CHAPTER One My Life: The Early Years


    Furthermore, I am also drawing from my personal history, life-realities and circumstances,
    even from an early age onward, which also form part of my journey and life-story.


    Throughout my life, I have always embraced and loved the idea, that I could offer
    great advice to other people—even if making a difference, just for one person!—Which
    could help them, in turn, then realize their dreams.


    Encouragement comes naturally to me and I know that I am at my best when I am
    living my purpose. I do that by imparting my thoughts and life lessons onto those
    that have an interest in hearing it. Being able to help others has been and (for
    me at least), the real “juice”, reward and satisfaction, for which I have live!


    This is uniquely consistent with the person I was while growing up and continue
    to choose to today. I was always there to help and at the time, even rescuing
    others from dangers, harm and risks, giving advice, sound-boarding, guiding, listening...
    I knew that in some sense, I was an “old soul” and I found comfort in helping
    out other fellow-travelers!


    Not unlike many of you reading this book, in my childhood, there were challenges.
    I came from a family that went through a time of trauma during my parents’ divorce
    the years proved to be extremely hard on all of us. I know for myself, there was
    a lot of sadness, loneliness, as well as extreme financial hardships that placed
    us in situations where my faith as a very young girl would be put to the test.
    My mother and I found ourselves moving month to month from one new location and
    school to the next. For many years there was absolutely no sense of security.


    Living that type of lifestyle, I had to grow up and mature quickly, in order to
    address these and other significant life-challenges, which came my way. Through
    it all however—throughout even these very difficult years and troubling times—I
    learned so much! It helped me become who and what I am today.


    For many, the one thing that helped me be lacking in their lives may very well
    be LOVE. It''s the one true ingredient that can really make or break your life.
    Many'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# BEAUTIFUL AMBITION 3


    know its many faces, its relentless sting or its cruel absence... In my case;
    LOVE in many ways did in fact turn my life around.


    My family was not perfect. There were lots of mistakes along the way, but everyone
    has things to overcome and challenges to face. However, this is something of key
    importance—my parents always made sure that I knew that I was loved and they always
    told me that I could grow up to be anything I wanted to be. They always made me
    feel special and gave me the confidence that I would need to go after my dreams.
    I also had a fantastic relationship with both my parents. I just understood them
    and what we were all going through. Believe me, I got it! In fact, today they
    both play an extremely significant role in my life. My dad is amazing! He is uniquely
    blessed with an incredible sense of humor. (No kidding! I like to think I got
    that from him... ha-ha!).


    On the other hand, my mother is beautiful, tender and loving. We are very close
    and share a special relationship.


    I knew as a young girl that I wanted to have an amazing life. I wanted to travel
    the world, to live a model, marry the handsome prince and live happily ever after.
    I wanted to live the dream, the fairly-tale life—I wanted it all (and then some!).
    It was a tall order, even back then, with the odds pretty much stacked against
    me. However, I always knew and continued to believe that I could do it, reach
    for and realize it all. This was MY dream, MY life, MY future, MY reality-to-be.
    I would it into being if I had to. I was determined!


    Throughout the life-journey in this book, I am going to show you how you, too,
    can reach for the stars—how you can become anything dream of.


    The most important ingredient in all of this is BELIEVE! It''s the ONE difference-maker,
    to making it all come to pass! (Stay tuned!)


    Once I entered high school, it was becoming increasingly clear to me that the
    responsibility for my life-success rested on none other than my own two shoulders.
    I was not going to have anyone get there for me or pave the road on my myself...
    and for ME, that road was long and uphill! This journey that lay ahead,'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 4 CHAPTER ONE My Life: The Early Years


    this time, was up to me and I knew it. I would have to make it happen, no ifs
    or buts about it—no-one was going to do it for me.


    Looking back on it all, I now know that this was the best thing ever for me. We
    live in and with a culture of co-dependency and ‘entitlement’. So many kids today
    grow up expecting their parents to do everything for them and become dependent
    on their parents that they can’t imagine ever doing ‘it’ (anything), for and by
    themselves. Our parents are there to take care of us, love us, feed us and provide
    a safe place for us. HOWEVER, when it comes to our ideals, our hopes and dreams,
    we have to reach for them ourselves. That is the long and short of it.


    Now, if you are reading this and your family has provided you with a really great
    launching pad towards realizing your dreams and helps you financially, that is
    great! Count your blessings and be thankful.


    But for those of you that might be able to relate to how it was when I was growing
    up and my life-story, OR perhaps you might very well be faced with no-one alongside
    you, nobody looking out for you, or championing and enabling you (like many others—you
    are NOT alone!), there is hope, I assure you. Take heart! Know that hard work
    and dedication WILL get you there.


    # YOU CAN DO IT!

    YOU HAVE TO BELIEVE IN YOURSELF!


    You need that vision and reminder in your mind every day of your life. Focus on
    wanting and starting to plan out how you are going to achieve it.


    I know that when I turned sixteen, I bought my first car! I worked forty hours
    a week at Long’s drug store, went to high school riding the bus until I had enough
    money for my car. Later, I also held down a second job at night and weekends,
    waiting tables, to get ahead and make ends meet, while working to reach for my
    dream. I did whatever it took and made it work.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# BEAUTFUL AMBITION 5


    I went to a performing arts high school to learn about all the things I loved
    deeply and dearly. This included dance, drama and music. I was an average, to
    ''okay'' student. I was always daydreaming about my future, my tomorrows, and
    my life after school, so I had a hard time staying focused.


    I did not want to go to college. I wanted to graduate and move to Los Angeles
    and hit the ground running. I stayed out of trouble in high school, mostly because
    I worked all the time and that kept me away from the parties. Also, I was not
    really interested in being the social butterfly in school.


    Having lived through the taunts of kids growing up, various forms of bullying
    and ridicule, when things were really difficult, these events actually opened
    my eyes to the realities and challenges in school, so for me it was all about
    getting out and moving on with my life.


    I really only had one boyfriend in eleventh grade and we dated for a while. I
    lived with my dad and he was adamant about NOT dating, it was as he felt like
    getting a boyfriend would keep me from reaching my goals. The one thing that was
    always important to me was showing my parents that I could make it. I wanted to
    make them proud.


    Life was not easy for them and I wanted to show them that I could do anything
    to mind. Believe me, I was not a perfect angel, but for the most part I did stay
    out of trouble and I really never “rebelled”. I had a clearly defined goal...
    to ensure that I would graduate and move to Los Angeles and that''s EXACT what
    I did! After years of waiting, I was finally ready to make it happen!


    I moved to Los Angeles and got an apartment. I had just enough money saved to
    last me about 12 months if I was careful. This would give me the time needed to
    get out there and get settled, find work and be well on my way to living my dream.


    My first order of business was securing an agency and getting my portfolio together.
    I found a reasonable photographer that had worked with tons of models. He shot
    most of my first book I created. I had my ticket and now I was off to the races!'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 6 CHAPTER One My Life: The Early Years


    I started going out on auditions right away. This industry is not for the faint.
    You cannot decide that you want to be a model and get rejected. Rejection is the
    main ingredient in the modeling recipe and process. You simply have to be able
    to understand and look at it realistically from perspective. The bottom line is
    that IF you are just not ''the look'' they are going for, maybe your look will
    be the right-fit for the next one. You keep going...


    Los Angeles is full of pitfalls and traps. If you are a beautiful young woman
    the world is, but it also comes with a heavy price to pay if you are not careful.


    I had my foot in the door at all the right spots and loved every minute of it.
    But I also had to take care of myself FIRST, so it was important that I was up
    early, working out, looking good and ready to go at the drop of a hat. At these
    types of auditions you cannot and will not get hired if/when you are hung over.


    Staying focused on why you are there is of the utmost importance. I landed my
    first magazine cover in the first sixty days. I felt so happy and I had a real
    sense of accomplishment and purpose. It made it real to me and I felt like I could
    do anything! My modeling career seemed to be taking off and it was turning a corner
    into the fitness and swimsuit arena (which I loved).


    Having to stay in bikini-shape year-round helped me stay committed to working
    out and eating right. I met some amazing people along the way. Soon I started
    to make a lot of money and good money at that! I had really changed my life for
    the better and I was beginning to achieve my dreams.


    As time passed and things progressed for me, I had steady covers and layouts and
    I started to work in front of the camera as a spokesperson, which I really loved.
    Others were throwing words like ''icon'', role model and such around. It was so
    much fun too.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# BEAUTFUL AMBITION 7


    I was able to travel, meet great people and have a new set of opportunities and
    challenges to take full advantage of, embracing being a significant part of it
    all. It was right around the time that I was starring in three of my own workout
    tapes, that I would meet me my Prince Charming.


    Let tell you ladies; do NOT listen to the women that say they don''t exist, because
    they do!


    I had just turned twenty-three years old. I was independent and taking care of
    myself. To top it off, I had reached my goal to be a working model and now a spokeswoman
    that others could look up to—others to whom I could now lend a voice, which they
    had none before.


    In fact, I was working as a spokes-model for a business that had created a diet
    product for another organization. (The latter owned by my very-soon-to-be husband).


    My boss had asked me to fly into Las Vegas for a meeting with some-or-other nutrition
    company. He said that they wanted to meet me. Well, when I walked into the Bally''s
    hotel for the meeting, a very tall and extremely handsome guy came to me and said:
    “Are you in our group?”


    I affirmed and said yes. He then escorted me to the table at the restaurant where
    we would all be meeting. He seated me right across him and throughout the course
    of the meeting, he kept kicking my foot. Of every time he did this, I would look
    up and smile, so he was clearly getting the response he wanted. (Long after I
    found out that my boss was trying to play match maker between the two of us. Of
    I had no inkling or idea of any of this, until much later!).


    Jason asked for my number and then several weeks later we set up our first date.
    There were a few things that gave me enough reason to pause and look before I
    leapt!The reality is, I really liked him, but I was ready for a committed relationship?
    Perhaps I was just a little afraid to commit so after just starting on my success-path
    in life, realizing my dream, pursuing my professional career-goals? Challenges!
    All relationships have them, but for me, there were many positives! Some initial
    concerns and hurdles kept harping and nagging at us (probably me!), like:'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 8 CHAPTER One My Life: The Early Years


    What stage of life was I in? What were my needs? What about Jason and his needs,
    wants and desires? Is this what I needed at this point in my life (or not?)


    There was also the fact that I was not really looking to be in a serious relationship
    at all, let alone a long-distance connection. Personally and professionally, I
    had just started on this road to success, inching ahead and my blossoming dreamcareer
    was beginning to really take off. For all intents and purposes, I did not want
    the distraction.


    Another complicating factor (for me) was that Jason lived in Arizona and I lived
    in Los Angeles. How was that going to work when we both had busy lives? But, today
    I can tell you this... Jason pursued me with great determination and there were
    times that I did not make it easy on him.


    I basically had the man of my dreams right before my eyes and I almost let him
    get away or fall through my fingers.


    The good news is that it all turned out incredibly well in the end. We started
    dating exclusively soon after. He would come out on weekends, or I would fly there.
    It worked well for the two of us, this long-distance relationship-thing.


    We were dating only thirty days, when on the evening of February 13th Jason had
    invited me down to his company''s event. (I suspected NOTHING!). When I came into
    the room, he had rented the Presidential Suite.


    The room was stocked with beautiful bouquets of flowers—purple roses and white
    Casablanca''s (my favorite). They were all over—myriads of dreams! The fire was
    on


    I had no idea that it was the night he would propose to me. We went out on the
    balcony lit with long white candles and flowers'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# BEAUTFUL AMBITION 9


    My head was spinning. It took me what must have felt like an eternity to him,
    to answer his question, BUT finally I did reply and said, “Yes, I will marry you!”
    So there was. That was it! Everything from that moment on seemed a dream—the perfect
    dream! My dream! We were married on March 1st, just two weeks later, in front
    of our family and friends, at a black-tie wedding at the Ritz Carlton in Pasadena,
    CA, USA. It was incredible. It was a fairy tale come true!


    Jason had an amazing team (mostly his incredible assistant at the time who is
    now like family to me) that helped us plan the most incredible wedding. We pulled
    it off and it was perfect. I wore a Vera Wang gown and I truly felt like Cinderella.
    After our honeymoon in Hawaii, we found our home in Newport Beach, CA, USA, where
    we still live today.


    Now fast forward a bit... we are close to celebrating our 13th year anniversary
    as husband and wife have two amazing twins, son our Jaden Brooks and our darling
    daughter Skye Isabela. They bring us so much joy our family is complete and I
