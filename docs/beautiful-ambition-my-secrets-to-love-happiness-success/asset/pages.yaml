    # The Power of $50 a Month


    Even though you do not always have to pay off the entire balance on your credit
    card every month, you do need to pay something. This is called the “minimum payment.”
    Sometimes people do not realize how long it will take them to pay off their debt
    if they pay only this every month. If you can afford to pay a little bit more
    than the minimum payment every month—say, $50 extra—it can make a big difference
    to how quickly you can pay off your whole debt.


    # Debt


    Debt load is a term that is used to describe how much debt a person has. It is
    often used to understand if you are carrying a “safe” or reasonable amount of
    debt. Creditors look at how much debt you have, compared to how much income you
    have. This is called a debt/income ratio. The debt/income ratio is calculated
    monthly. It shows creditors how good, or bad, your financial health is.


    You can figure out this ratio by adding up all of your monthly payments except
    for those that have to do with housing, utilities or taxes. This is your monthly
    debt.


    Next, divide your total gross (before any deductions are made) annual income by
    twelve to get your gross monthly income. Then divide your monthly debt by your
    gross monthly income. This is monthly non-housing debt/income ratio. It is usually
    expressed as a percentage, so move the decimal point two places to the right.'
