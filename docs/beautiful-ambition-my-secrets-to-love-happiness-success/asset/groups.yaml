    # Four-step program


    # Step One: Add Up Your Income


    To set up a monthly budget, you need to know how much money you have available
    to spend every month, after you pay your taxes. This is your net household income,
    because it is the number that is left AFTER you have paid out your deductions
    to the government.


    If you get paid once a month, just look on your pay stub to see your net monthly
    income.


    If you get paid weekly, every two weeks or twice a month, you will need to do
    some math to figure out your net monthly income:


    +   - For weekly pay, multiply the weekly amount by 4.333


    +   - For every-two-week pay, multiply the amounts by 2.167


    +   - For twice-a-month pay, multiply the amounts by 2


    # Step Two: Estimate Your Expenses


    Here is where you write down what you think you will be spending your money on.
    It is easier to remember all the places your money goes if you divide your expenses
