    # What You Need:


    +   - 4 cups bitter salad greens (any mixture of watercress, arugula, Belgian
    endive, bok choy, spinach), rinsed and spun dry

    - 1 tablespoon rice vinegar

    - 2 boneless, skinless chicken breasts (10 ounces total), split and pounded to
    ¼inch thickness

    - ½ onion, sliced

    - 2 tablespoons oil


    # Sauce:


    +   - 1 garlic clove, pressed

    - ¼ teaspoon sugar

    - 2 tablespoons dry sherry


    Compose the greens on two dinner plates and drizzle with vinegar, then set them
    aside.


    Whisk together the ingredients for the sauce in a small bowl.

    Cut the pounded chicken across the grain into 1-inch wide strips.


    Heat the skillet or wok over high heat, then add the oil and onion. Stir-fry until
    the onion edges begin to brown. Scoop the onion into a bowl and reserve.


    Add the chicken and stir-fry until it begins to brown on the edges and is thoroughly
    opaque and cooked though, about 2 minutes.


    Scoop the chicken into a bowl with the onions.

    Add the sauce mixture into the wok and stir to free any browned bits. Return the
