    is a new purchase, something you bought in the past and never paid off, a cash
    advance, or a balance transfer.


    Pay attention to what you are purchasing, and remember you are in the building
    phase of your financial life. Stay focused on the goal of getting ahead, and avoiding
    getting behind on bills and credit cards.


    ## The Power of $50 a Month


    Even though you do not always have to pay off the entire balance on your credit
    card every month, you do need to pay something. This is called the “minimum payment.”
    Sometimes people do not realize how long it will take them to pay off their debt
    if they pay only this every month. If you can afford to pay a little bit more
    than the minimum payment every month—say, $50 extra—it can make a big difference
    to how quickly you can pay off your whole debt.


    ## Debt


    Debt load is a term that is used to describe how much debt a person has. It is
    often used to understand if you are carrying a “safe” or reasonable amount of
    debt. Creditors look at how much debt you have, compared to how much income you
    have. This is called a debt/income ratio. The debt/income ratio is calculated
    monthly. It shows creditors how good, or bad, your financial health is.


    You can figure out this ratio by adding up all of your monthly payments except
    for those that have to do with housing, utilities or taxes. This is your monthly
    debt.


    Next, divide your total gross (before any deductions are made) annual income by
    twelve to get your gross monthly income. Then divide your monthly debt by your
    gross monthly income. This is monthly non-housing debt/income ratio. It is usually
    expressed as a percentage, so move the decimal point two places to the right.


    ## BEAUTIFUL AMBITION 141


    RULE OF THUMB—If your non-housing debt is 10% of your income or less, you''re
    in great financial shape. If your non-housing debt is between 10% and 20%, then
    you will probably be able to get credit. But the closer you get to 20%, the closer
    you get to the edge of a reasonable debt load.


    ## What are you worth?


    Assets are things that you own. Even if you still owe money on them, they are
    assets. These can be things like your car, house, entertainment system, patio
    furniture, and jewelry. Your list of assets also includes the contents of your
    bank accounts; cash in your wallet, and investments.


    To figure out your total assets, you have to know how much everything on your
    list is worth. Consider what you could expect to sell something for—and honest
    with your guesses. Remember that when you are making your purchases, it is key
    to understand the real value for the items that you are buying.


    For example, if you are buying your first car, it may be in your best interest
    to consider a pre-owned car versus the new one that will lose twenty percent of
    its value once you drive it out of the showroom.


    If you are purchasing real estate, pay attention to the market. Are you buying
    at the right time? Is the market high? If so, will you be over-paying? Is the
    market slowing down? In this case you may decide to wait a little longer to see
    where things go, and where the interest rate is headed.


    Your home is likely the largest purchase you will ever make, so you will want
    to make sure that you get a good deal. This is important so that when you decide
    to sell it, you will have achieved a favorable amount of equity.


    If you buy when the market is high, chances the market will correct itself. This
    means that you are risking only a slim amount of money, breaking even, or even
    losing money when you decide to sell it. Learn to pay attention to issues such
    as the interest rate, and buy when things make sense.


    ## 142 CHAPTER SEVEN Money Management that Makes Cents


    DO NOT just buy because you want it and you are trying to desperately compete
    with your group of friends! It is better to start small and work your way up.
    There will be a day when you get everything you want. After all, that is what
    this book is all about! Having it all—how to get it, and how to get it!


    Liabilities are what you owe, including finance charges. For example, your liability
    is not the cost of your car, but the total amount of the car loan to be repaid—including
    interest. You can figure this out by multiplying the payment amount, by the number
    of payments left to pay off the loan.


    Ideally, your list of assets will be worth more than your list of liabilities.
    If it is not, remember that this is a snapshot in time. Everything—your assets
    and liabilities—may very well always be changing.


