    # Talking to Bill Collectors


    Talk sooner than later. Do not wait for a bill collector to call you. When you
    are in financial trouble, it is very important to talk to your creditors as soon
    as possible. Why? Because your creditors might be charging you more in the mean
    time.


    You would also be taken more seriously by addressing your financial difficulties
    immediately, rather than ignoring them.


    The bill collector''s job is to ask you to pay everything you owe as soon as possible.
    With that in mind, follow these tips:


    - Do not lose your temper

    - If it is a bad time, get the collector''s number, make an appointment and call
    back

    - Be prepared with the details of how much you owe

    - Keep your worksheet information by the phone so you can talk intelligently

    - Be ready to suggest a plan for dealing with your debt

    - Listen to the suggestions of the bill collector

    - If you are having trouble with one bill collector, ask for another


    # Your Rights


    Debt does not give your creditors license to pester you. They must behave according
    to certain rules.


    Debt collectors are required to:


    - Inform you, in writing, of the amount of your debt and the name of the creditor

    - Give you information about your right to dispute the debt

    - Give you written proof of the debt if you dispute it


    Money is not always an easy topic. In fact, for most people, it is one of the
    largest concerns in their lives. As long as you learn and practice proper money
    management, however, you will ensure that you are much better off. You will also
    be able to keep your goals on track, and your achievements in sight!


    # WHAT YOU SHOULD LEARN FROM THIS CHAPTER


    Key-reminders and insights from Chapter 7 highlight:


    - You can take control of your financial situation, no matter what your income
    situation may be.

    - Budgeting is a major part of your ability to obtain financial stability, as
    well as a great way to plan for your future and your goals.

    - Debt is a serious issue, and should be dealt with now. There are many ways to
    deal with debt, and there are lots of different services out to help you to decrease
    or remove your debt while maintaining the best possible credit score that you
    can achieve.

    - The most important part of your money is to know your rights—what you can and
    cannot do, and what can or cannot be done to you.


    # Chapter 8


    # Finding Mr. Right and Keeping Him


    > "True love does not come by finding the perfect person, but by learning to see
    an imperfect person perfectly."

    — Jason Jordan


    It goes without saying, that we are in a time when it seems like everyone is single
    and currently looking for the perfect partner. If you are a single woman, then
    you understand how frustrating the process can be to find Mr. Right when you may
    have convinced yourself by now that he doesn''t exit. You tell yourself that the
    only people that seem to have it made are the Barbie-dolls of the world and those
    with money and power.


    Well, let me dispel that myth right now, because we all know that Hollywood is
    filled with beautiful lonely starlets that cannot seem to keep a husband, or even
    find true love themselves.


    So, you inevitably ask, yourself: *If they can''t find Mr. Right how can I?*


    Let us all then just take a minute to read about a little girl that grew up to
    find her Prince Charming.


    # A GREAT EXAMPLE: FAITH HILL


    Faith Perry was born in Jackson, Mississippi, but raised in the nearby town of
    Star. She began singing at a very early age. After briefly attending college,
    she moved to Nashville to attempt launching her singing career.


    Faith''s voice caught the attention of Warner Brothers Records executives, who
    eagerly gave her a record-deal. During this time, she married Dan Hill, an executive
    and songwriter, to whom she remained wed between 1988 and 1994.


    Unfortunately, this relationship came to an end, but she kept her strength and
    life together. Shortly after being signed to Warner, Hill was given the opportunity
    to open for fellow country superstar Tim McGraw. You just never know when fate
    is going to bring you at the door to your opportunities and in Faith''s case it
    is exactly what happened.


    Hill began the Spontaneous Combustion Tour with country singer Tim McGraw and
    later seeing him, breaking off her engagement to her former producer, Scott Hendricks.
    When McGraw proposed marriage to her in one of his tour trailers, he had to go
    perform right then, so she took a permanent marker and wrote her answer on the
    mirror. Hill, after touring with McGraw, married him on October 6, 1996. They
    have three daughters together: Gracie Katherine (b. 1997), Maggie Elizabeth (b.
    1998) and Audrey Caroline (b. 2001).


    # BEAUTIFUL AMBITION


    The year 2000 was also very successful in a concert setting, as Hill and Tim McGraw
    staged the joint Soul2Soul Tour, one of the best-grossing concert tours of 2000.
    In April 2006, Hill and husband Tim McGraw embarked on their Soul2Soul II Tour
    2006, which stands as the highest grossing country music tour to date, with a
    gross of $89 million.


    Faith was not just blessed by a lot of luck. She worked hard to achieve her goals,
    and lived her life to the fullest, meeting lots of people. It is therefore no
    accident that she met Tim McGraw, the man who is perfect for her, and who she
    can love both romantically, and as a terrific person to work with!


    Understand that you do not always get it right the first time. We all have dreams
    of the perfect wedding, honeymoon, and all the great things that follow, but life
