    When featured on the front cover of People magazine in the March 11, 2008 issue
    (when they were 4 weeks old), J. Lo was not returning to work until they were
    15 months old and is now currently starring in “The Back-up Plan” (2010). She
    and her husband Marc are also celebrity part and co-owners of the Miami Dolphins.
    She is proud of who she is, how she looks, and how she chooses to live, with no
    excuses or apologies! If there is anything that we can learn from Jennifer Lopez,
    it is that we are all beautiful in our own way. The key to getting the most out
    of your appearance is to try to be healthy, and not forget to treat yourself on
    occasion.


    In our own words...


    > “We’ve had a love of our life and failed love affairs. I’m just the biggest
    romantic—it’s really sad. I tell people that, but nobody listens.


    I''ve always had a huge fear of dying or becoming ill. The thing I''m most afraid
    of, though, is being alone, which I think lot of performers fear. It''s why we
    seek the limelight—so we''re not alone, we''re adored. We''re loved, so people
    want to be around us. The fear of being alone drives my life.


    In every movie they want you to look so thin as you can look. Selena, it was the
    other way around: “How can we shoot her butt so it looks like Selena’s?”


    I only do what my gut tells me. I think it''s smart to listen to other people''s
    advice, but at the end of the day, you''re the only one who can tell you what''s
    right for you.


    Part of my business is about being in shape and looking good. You can''t lie to
    yourself about it. But I''m not the monster I used to be in the exercise department.
    You get past your 20s, you''ve got kids... you''re kind of unmotivated. You want
    to be healthy and look good, but you want to do the least amount to maintain that.


    ## STAYING HEALTHY AND FEELING VIBRANT


    In addition to teaching good social skills, an important lesson that my mother
    taught and showed me, was the importance of taking care of my body, especially
    my skin. My mother has the most beautiful skin I have ever seen on a woman. She
    has passed her secrets to me and I would like to pass them to you, so that you
    may incorporate them into your daily routine. These are not new; they are very
    simple, yet I still know women today do not take care of their skin. This will
    certainly help and is easy to do!


    Your skin needs to be important to you now because as you age, the years of slacking
    on your skin will begin to show. It is why it is so important for good care to
    start today—so that tomorrow you will have healthier skin.


    Find out what type of skin you have. Is it normal, oily, or dry? Chances are if
    you are anything like me, a combination of these things works. You do not have
    to spend tons of money to get good skin care. In the morning, get up and wash
    your face. In the evening, use a good eye cream and moisturizer. This will be
    different than the moisturizer you wear during the day. Most people forget to
    do this and it can create bacteria. Clean your brushes once a week. On a daily
    basis, leave them out overnight to help keep your skin cleaner.


    ## Food for Life


    Before you get started making radical changes, it is important to consult your
    doctor. After all, we are all different and will all react differently to dietary
    changes. Even when taking “natural” and herbal treatments, you risk allergies.
    You always hear that drinking water is the best thing you can do for yourself,
    and I have to tell you I could not agree more. I drink water throughout the day.
    To add some flavor and get a good dose of vitamin C, I like the fact that I am
    getting lots of vitamin C. I am a strong proponent of nutritional supplements
    and believe that taking vitamins and minerals should be high on your list of priorities
    in order to feel your best. If you are lacking the vitamins your body requires,
    you are going to feel tired and worn out, which could certainly lead to depression.
    Add a good multivitamin along with 500 milligrams of calcium that contains magnesium
    to your diet and you are surely going to notice a difference. I also take a shot
    of liquid minerals each morning. It is also important that you get plenty of omega
    fatty acids. This will help keep your skin looking young and your hair soft and
    shiny. As women, there are important vitamins and foods that can help us feel
    great all the time... things like Soy, B12 and B6 for energy, plus folic acid,
    which is wonderful for women’s nutritional needs and physical well-being.


    Black cohosh and evening primrose help maintain a healthy temperament while we
    go through our monthly menstrual cycle. They can help with our emotional, hormonal
    ups-and-downs, as well as alleviating cramps associated with our period.


    What you put into your mouth will determine how you feel. That is the rule of
    thumb here. It really is just that simple. If you become a lazy eater, you will
    get fat, feel tired and lethargic. That is not to say that you cannot treat yourself
    to your favorite meal and dessert. But your overall diet will determine so many
    things, including how you treat others. If you are eating too much sugar, you
    will become accustomed to it. You will find yourself and your body constantly
    craving more and more sugar.


    If you eat a lot of salty foods, you will be bloated, and you will not be at your
    best, with no healthy glow. In order to feel and look your best, all areas of
    your life must be maintained.


    Eat as close to nature as possible and maybe one day a week is all vegetarian.
    Cut back on the red meat. Incorporate fresh fish—all different types if you can.
    It is the healthier option. As some types of fish have slight levels of mercury
    in them, it is important that you eat reasonable portions and only one or two
    times every week. Though mercury levels in fish on the shelves are within the
    FDA''s safety limits, you still do not want to overdo it.


    Add lean turkey meat and buy organic much as possible. This means for the meat
    products as well as the fruits and vegetables. If you cannot get what you want,
    or if you want to change the variety in your diet, change where you shop.


    If you know the supermarket so well that every time you walk down a certain aisle,
    the bag of cookies automatically jumps into your cart, then skip that aisle! Change
    how you shop. You must be proactive when you are deciding to make a change.

