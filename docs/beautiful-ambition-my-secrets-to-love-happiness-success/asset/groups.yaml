    opaque and cooked through, about 2 minutes.


    Scoop the chicken into a bowl with the onions.

    Add the sauce mixture into the wok and stir to free any browned bits. Return the
    chicken and onions to the pan and stir until the sauce cooks down, about 3 minutes
