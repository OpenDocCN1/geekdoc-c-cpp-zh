    即使是那些看似微不足道的极小能力，对你的生活也会变得非常重要（影响他人）。记住：大多数伟大的想法都始于非常小的事，然后成长变得真正非凡。手握纸笔，深入审视你的内心，列出所有定义了你的优秀品质。


    你还会想要发现自己的性格类型。这对于你在个人生活、人际关系、职业以及生活中所有其他重要方面能够成功取得的道路，将起着巨大的作用。


    自然，我们每个人都有自己的性格，无论你是多么独特，你的性格很有可能属于某种特定的类型，这可以帮助你确定你最喜欢做的事情。


