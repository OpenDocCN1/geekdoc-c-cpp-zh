    This has been critical for me, especially while writing this book. In that light,
    I painted my office dark green. Of course, you are probably now thinking that
    I do not have any taste at all. It is true, many people do not like the color
    green, let alone one in their office as a wall-color, or they consider green to
    be a "Kitchen" or "bathroom" color (since it is considered to be a color of cleanliness,
    freshness, and health). However, although everybody has a similar reaction to
    each color, we also have our own special and very personal reactions to each different
    shade of color.


    Dark green gives me a sense of power, so I thought that it would work well in
    my office. But as I worked in the space, I found that I did not like how I felt,
    so I decided to re-paint it to my favorite color: pink. I hung gorgeous chandeliers
    and added a black-and-white hair chair. Now the space makes me feel completely
    loved! It is customized and to my own personal style and liking, I might add.
    Others might not like or ''see'' it, but for me it is PERFECTION!


    # 212 CHAPTER TEN Full Circle


    I have fresh flowers and plants in my office, (the fresh-cut flowers, usually
    on a weekly basis). They are straight from my garden, picked by my husband, for
    me, because he knows how much I love flowers. It makes me very happy. I have also
    included my favorite scented candles and a small fountain.


    I have created an environment that inspires me. You can, too. Below, is a list
    of things that can get you started in creating your “space of love”.


    Create the space of love all around you with these seven simple steps.


    - 1. Color—this can be anything from the walls to furniture, throw pillows, to
    rugs.

    - 2. Lighting—you may enjoy a room with a beautiful hanging chandelier, or prefer
    the flicker of soft scented candles.

    - 3. Life—add your favorite plants and flowers to a room to bring life to your
    home, and lightness to your mood.

    - 4. Sound—create your music library with all your favorite songs on your cd player
    or I-pod. But do not just store the music, play it throughout your home!

    - 5. Snooze—fresh new sheets and bedding (400 thread count and up are the best).
    You want a soft, comfortable bed that keeps you cool in the summer and warm in
    the winter. For extra comfort, give a featherbed a test drive!

    - 6. Accessories—shake things up a bit. Try putting new covers on your pillows,
    or get new matching “everyday” dishes. Nothing too expensive; just something different
    and special.

    - 7. Prepare—get ready for the day!


    # BEAUTIFUL AMBITION 213


    This will give you much better odds of success, and will give you a better chance
    for building those good habits in an effective and positive way.


