    # BEAUTIFUL AMBITION 189


    +   A diet containing an optimum level of carbohydrates may help prevent body
    fat accumulation.


    +   Starch and sugars provide readily accessible fuel for physical performance,
    (just make sure you get these in small portions).


    +   Dietary fiber, which is a carbohydrate, helps keep the bowel functioning correctly.


    +   Apart from the direct benefits of carbohydrates for the body, they are found
    in a wide range of foods which themselves bring a variety of other important nutrients
    to the diet. For this reason it is recommended that carbohydrates be supplied
    from diverse food sources to ensure that the overall diet contains adequate nutrients.


    +   Carbohydrates are needed for the central nervous system, the kidneys, the
    brain, the muscles (including the heart) to function properly.


    +   Carbohydrates are important in intestinal health and waste elimination.


    +   It is also important to remember that carbohydrates contribute to the taste,
    texture, and appearance of foods and help to make the diet more varied and enjoyable.


    Carbohydrates are the macro-nutrient that we need in the largest amounts.


    According to the Dietary Reference Intakes published by the USDA, 45% - 65% of
    calories should come from carbohydrates. They are mainly found in starchy foods
    (like grain and potatoes), fruits, milk, and yogurt. Other foods like vegetables,
    beans, nuts, seeds and cottage cheese contain carbohydrates, but in lesser amounts.


    Carbohydrates in all shapes and forms are good for your health. They can help
    control body weight, especially when combined with exercise, they are vital for
    proper gut function, and are an important fuel for the brain and active muscles.'
