    # 194 CHAPTER NINE To Eat Or Not to Eat


    Go online and look up some of your favorite things to eat and teach yourself how
    to make them. You may be surprised at how much you enjoy the process. you eat
    at home more often you will stay leaner because you are in total control of how
    you prepare your food. It will also ending costing you less money. When you decide
    to go out to eat, you can really splurge.


    This book is about helping you find the balance in all areas of your life. I wish
    you all the health and happiness that I know you deserve. If you are good to yourself,
    others will be good to you.


    # INSIDE TARA’S KITCHEN


    Savoring the aromas, tastes and textures of foods is one of life’s greatest pleasures.
    Eating healthy never has to mean denying yourself a pleasure this great. You just
    need to have some nutritional know-how and some really great cookbooks.


    These are some of my favorite recipes. These, and more can be found in the The
    High-Protein Cookbook by Linda West Eckhardt and Katherine West Defoy (Clarkson
    Potter Publishers, New York, 2000). ** These recipes and others from health-minded
    cookbooks can help you properly balance your nutrients while enjoying zesty, palate-pleasing
    gourmet meals.


    # Garlic Lime Chicken


    Marinating chicken breasts with the flavors of garlic and lime creates a delicious
    contrast in flavors. When the chicken is cooked on an outdoor or indoor grill,
    the charred grill marks, which are the caramelized sugars in the meat, give this
    chicken a touch of sweet and sour. Ideal to serve on top of a vegetable purée.'
  - '[PAGE 210]


    # Countdown:


    Preparation time: 5 minutes

    Marinating time: 20 minutes

    Cooking time: 10 minutes


    # What You Need:


    +   - 2 tablespoons low-sodium soy sauce

    - Grated zest and juice of 1 lime

    - 1 teaspoon Worcestershire sauce

    - 1 garlic clove, minced

    - 2 boneless, skinless chicken breasts (10 ounces total), split and pounded to-¼
    inch thickness

    - ½ teaspoon cracked black pepper

    - ½ teaspoon mustard


    # Directions:


    Combine the soy sauce, lime juice and zest, Worcestershire sauce, garlic and mustard
    in a glass dish or reseal-able plastic bag. Add chicken and turn to coat with
    mixture. Cover the chicken and refrigerate for 20 minutes.


    Remove the chicken from the marinade and pepper it thoroughly. Discard the marinade.


    Preheat a grill or skillet over medium-high heat. Brush with olive oil. Cook chicken
    until golden on both sides, opaque and cooked through, about 10 minutes in total.


    Serve hot or at room temperature and garnished with additional lime zest.'
  - '[PAGE 211]


    # Nutritional Analysis:


    +   - 302 calories

    - 11 g. fat

    - 44 g. protein

    - 3 g. carbohydrates


    # Cooking Lesson:


    Sometimes half the battle is won with patience. Just let the chicken swim along
    in this aromatic marinade, and the flavor will be so much better.


    # Menu Suggestions:


    You can afford a sweet temptation with this meal. Buy or make sugar-free meringue
    shells and serve alongside ½ cup of berries. You''ll have added only 3.5 grams
    of carbohydrates with the meringues and 5 grams or so with ½ cup of raspberries
    or strawberries.


    # Salad Niçoise with Citrus


    This quick salad from the French Riviera is filled with olives, tomatoes, asparagus
    and tuna. You can add any other greens or left-over vegetables. These ingredients
    were chosen to give a variety of textures, colors and flavors: crisp, pale green
    lettuce; ripe, red tomatoes; soft, pink tuna; and dark green asparagus. Use this
    recipe as a base and create your own version of this classic.


    # Countdown:


    +   - Make dressing

    - Blanch asparagus

    - Assemble salad'
  - '[PAGE 212]


    # What You Need:


    +   - 1/4 cup red wine vinegar

    - 2 tablespoons Dijon mustard

    - 1/4 cup diced red onion

    - 2 tablespoons water

    - 2 tablespoons olive oil

    - Salt and freshly ground pepper to taste

    - 2 (6-ounce) cans low-salt, soft pink tuna packed in water, drained and rinsed

    - 1/2 pound fresh asparagus

    - 4 cups washed, ready-to-eat field greens or French-style salad

    - 2 medium tomatoes, cut into wedges

    - 8 pitted black olives, quartered


    # Directions:


    To prepare the vinaigrette dressing, whisk the vinegar and mustard together in
    a large bowl, with onion and water. Whisk in the oil to a smooth consistency.
    Season with salt and pepper, to taste. Flake the tuna into the vinaigrette.


    Cut or snap off the 1-inch-long fibrous base of the asparagus and discard. Slice
    the remaining asparagus into 2-inch pieces (you should have about 2 1/2 cups).
    Bring a medium saucepan of water to a boil.


    Add the asparagus. As soon as the water comes back to a boil, drain the asparagus
    and refresh in cold water. (If using thick asparagus, boil 5 minutes.)


    To microwave the asparagus instead, place asparagus in a microwave-safe bowl and
    microwave on for 4 minutes. Add the asparagus to the tuna mixture and toss gently.
    Divide the lettuce between two plates. Spoon the tuna-asparagus mixture over the
    lettuce. Arrange the tomato wedges around the plate, sprinkle the olives over
    the top and serve.


    Makes 2 servings.'
  - '[PAGE 213]


    # Nutritional Analysis:


    +   - 424 calories

    - 51 g. protein

    - 14 g. carbohydrates

    - 20 g. fats


    # Citrus:


    +   - 2 medium oranges.


    Divide the oranges between two plates and serve. Makes 2 servings.


    # Nutritional Analysis:


    +   - 62 calories

    - 1 g. protein

    - 15 g. carbohydrates

    - 0 g. fats


    # Helpful hints:


    Use the dressing recipe provided here or purchase a no-sugar-added oil-and-vinegar
    dressing and add diced red onions.


