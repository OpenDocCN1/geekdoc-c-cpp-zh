    ## Chapter 5: Forgiveness — The Key to a Happier and Longer Life


    > To forgive is to set a prisoner free and discover that the prisoner was you.

    > — Lewis B. Smedes


    It is easy to say, “I forgive you” to someone who has wronged you. It is NOT however,
    easy to mean it! Oftentimes, we let this phrase slip out, to solve our problems
    in-the-moment and short-term, but, when we simply say it for the sake of ending
    an argument, the effects last: wounds remain, unhealed, and your quality of life
    and life-style suffers, to boot!


    Forgiveness is an essential part of your life... or it should be. Your mind was
    not meant to harbor ill memories, nor your emotions remain stagnant with anger.
    But, without forgiveness as an integral part of your life, that is what will happen
    if you refuse to let go of the wrongs done to you (not forget, but accept for
    your advantage), you will never be able to experience the joys of life. You will
    be too consumed with anger.


    You must learn to forgive, to cultivate a lifestyle of goodwill. This is not to
    say that you should experience darker emotions; they are part of you. But, to
    allow them to control you and your actions is definitely NOT the way. Instead,
    you must learn to control them. Only then will you reap the benefits of a ''forgiving''
    life:


    - Physiological: Do not sneer. Holding onto negative thoughts and wishes does
    affect your body negatively. You can, literally, yourself sick with these feelings.
    By focusing on wrongs done to you, you do not allow your mind the chance to absorb
    other stimulation, or even allow your body the chance to relax itself. You are
    bringing unneeded stress into your body. This will have an undeniable effect with
    long-term, future implications. With a forgiving attitude, however, you let your
    body and mind relax, and then move on. This is of the utmost importance.


    - Emotional: The more obvious benefits of leading a ''forgiving life'' is the
    emotional qualities and maturity that you will reach and showcase. If you continue
    to harbor grudges, or think only of retribution, you will ruin your emotional
    self (and, yes, there is such a thing!). Your quality of life will be tainted.
    Through forgiveness, however, you can learn to experience the world for every
    aspect of it, allowing yourself the emotional ability to appreciate it.


    ## BEAUTIFUL AMBITION 81


    Forgiveness is a choice, and not an easy one. After all, if a wrong has been committed,
    why forgive it? Is that not simply condoning the action?


    No!


    You are not giving your permission to continue this wrong; you are not telling
    someone that they can keep doing it without fear of consequence. You are not forgetting
    what was done to you. You have simply learned to move away from it, to grow from
    it.


    ## A GREAT EXAMPLE: OPRAH WINFREY


    A very famous example of a forgiving woman who has used this positive lifestyle
    to live her life to its fullest, is Oprah Winfrey. Today, we know her as the multiple
    Emmy-Award-winning host of the Oprah Winfrey Show, as well as an Academy Award
    nominated actress, the influential book critic and magazine publisher. However,
    remember that she was not born into this lifestyle of success, attributed to the
    world''s only female black billionaire. She created it herself, overcoming a number
    of hardships and setbacks along the way.


    She has fought her way through rounds of criticisms and controversies, and has
    allowed herself to forgive, so that she can move on in a healthy, positive, and
    winning way.


    Beyond the problems she had growing up, like living part of her childhood in a
    lower-class, rough neighborhood, and suffering because of a lack of a support
    structure, and even sexual abuse from her cousin, Oprah has also experienced challenging
    hurdles throughout her professional career.


    In fact, when she changed the focus of her show mid-way through her successes
    caused many critics to blame her for popularizing "tabloid talkhow". These critics
    pointed the finger at Oprah for making shows such as The Jenny Jones Show, Ricki
    Lake, and even The Jerry Springer Show as popular as they are. However, Oprah
    held her own, maintained her own focus, and accepted that people will criticize
    her when she is so visible to the public. She allowed herself to recognize that
    a person with as much success and fame as she will bound to be criticized, and
    occasionally blamed for the actions of others—things that remain outside of her
    personal control.


    Ben Shapiro took a stab at her when she showed her anti-war perspective on her
    show at the time leading up to the US-led invasion of Iraq. He wrote cutting remarks,
    and belittling statements about her opinions, and about her overall. She claimed
    that she is a “dangerous political force... with unpredictable and mercurial attributes
    towards the major issues of the day.” Still, Oprah continued with grace and forgiveness.
    Not did this highly influential woman with her popular magazine and television
    show, bring herself to the level of lashing out at Mr. Shapiro in the many ways
    she could have done. Instead, she allowed her own integrity to speak for itself,
    and she continued to progress in the way that she felt right for her.


    As recently as 2006, rappers such as Ice Cube, 50 Cent, and Ludacris criticized
    Oprah for what they claimed to be an anti-hip-hop attitude. Winfrey had indeed
    made a comment about hip-hop in an interview with GQ magazine, and she had quoted
    lyrics by Ludacris to substantiate her opinion.


