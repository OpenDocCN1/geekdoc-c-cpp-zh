    \ you need to do is make better food choices during the week, ensuring that you\
    \ are cutting out those carbohydrates and added fats that are going to lead to\
    \ more over-eating and binging.\n\nDrink lots of water and stay hydrated, take\
    \ your supplements, get your greens every day, eat several pieces of fresh fruit\
    \ and lean proteins on your menu.\n\nThen on the weekends, you can reward yourself\
    \ with a great meal out with a loved one or friends and enjoy a glass of wine,\
    \ or a dessert. Maybe you love sushi. Well then, go for it! All in moderation\
    \ of course! You have been good all week long, now you can indulge, a little bit\
    \ at least. You see, the key here is watching yourself and being good most of\
    \ the time. I am not a perfect eater all the time, not by any stretch of the imagination,\
    \ but we can all try and make some small changes that add up over time on the\
    \ positive side.\n\nI try to eat close to nature as possible during the week,\
    \ like having lots of veggies and salads with homemade dressings made with fresh\
    \ lemon, olive oil, and a bit of mustard. I mix it up and I love the taste. I\
    \ also make sure that I eat oatmeal three days a week in the mornings and the\
    \ other days I have egg white omelets, with veggies and soy cheese.\n\nThen on\
    \ the weekends I splurge (within reason and in moderation) and I enjoy myself.\
    \ If I want chocolate, I have it. But I do not eat tons of it at a time. I have\
    \ one or two bites and that is enough for me. I love meat! I wish I could be a\
    \ vegetarian, but for that does not work. I feel stronger and I have more energy\
    \ when I eat meat.\n\nSo, I try to have red meat times a month. The rest of the\
    \ time I focus on lean-meats like turkey, fresh fish (all types) and organic chicken.\
    \ Here is what I stay clear from: white and refined flours, that includes all\
    \ baked goods. Now granted, I will cheat now and again and have cookies (come\
    \ on, give me a break, I am human too!) I am talking about the 90 % of the time\
    \ that I am a clean eater.\n\nInstead of eating carbohydrates loaded with sugar\
    \ and starch like white rice and mashed potatoes, I try to eat whole-grains and\
    \ brown rice and even then, I eat small portions of these things. To tell the\
    \ truth, you really do not need a lot. I use the “hand-rule” when it comes to\
    \ portion-size and here is the rule: take a look at your hand. The inner part,\
    \ called the palm of the hand, determines how much protein you need at a meal.\
    \ Next are your fingers. They determine your carbohydrate intake—that means both\
    \ veggies and whole grains—so as you can see, you do not need a lot here. Your\
    \ thumb represents the fat that should be in your meal.\n\nWith this in mind,\
    \ use your hand as a cheat-type guide and a visual reminder when you sit down\
    \ for your meal or load your plate. If your meal is bigger than your hand, take\
    \ half of it home and eat it later. If you do this, you will lose weight and keep\
    \ your weight stable without going up and down. These are simple things that I\
    \ do to keep myself lean and strong.\n\nIt is not enough to think, you have to\
    \ be healthy as well. If you do not have enough energy and find that you are always\
    \ tired, most of the time your diet is the problem. You are eating all the wrong\
    \ things. Take this opportunity to turn those bad eating habits around today.\n\
    \nClean out your fridge and pantry. Donate the food that you have or give it away.\
    \ Stop buying food from the market where you currently shop; instead find a new\
    \ health-food store to shop at.\n\n## Fats\n\nDietary fats are important for good\
    \ health. This may sound a bit far-fetched, if not strange, but it is true.\n\n\
    Wait. As far back as 1929, dietary fats were found to be “essential” in our diet.\
    \ Balance is the key to making fats work for you. There are two important considerations:\n\
    \n- Consume a variety of good fats. These include unrefined oils, such as safflower\
    \ and sesame. Fats from butter, meats, eggs and dairy are good as well, as long\
    \ as they are part of a balanced diet.\n- Avoid hydrogenated (or partially hydrogenated)\
    \ fats. These include margarine and many of the fats used to make breads and other\
    \ products (read labels). Hydrogenated fats can disturb the metabolism of fats\
    \ in the body. Also, fried or cooked fats should be avoided for similar reasons.\n\
    \nWhy are fats so good? \n\n- Source of energy\n- Essential to supporting the\
    \ hormonal system\n- Natural insulator\n- Supports and protects your body from\
    \ strain and damage\n- Vital for prostaglandins cell function\n- Regulate your\
    \ vitamins and minerals\n- Essential to your health and that of your baby during\
    \ pregnancy and lactation\n- Help protect your body against the harmful effects\
