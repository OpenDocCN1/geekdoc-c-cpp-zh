  - '[PAGE 126]


    # BEAUTIFUL AMBITION 111


    The people around you can influence you, but ultimately, it is your decision!
    Whether you will or will not take control and do what is best for you, is entirely
    up to you. There is something very reassuring and affirming about this!


    Every time you wake up and declare that this is going to be a great day and something
    wonderful is going to happen to you today, every time that you follow that up
    with writing out your goals and your affirmation, saying them out loud—you will
    begin to feel empowered and you will begin to believe that good things are really
    going to happen for you.


    You will also begin to realize that you deserve good things once you believe about
    yourself. There is no stopping you! Watch out world, here you come!!! Hear me
    roar!!!!!!


    Once you start to activate these powerful universal laws, you will begin to change
    and grow. Again, think of your self-esteem and self-confidence, as you would a
    new plant that needs to be taken care of in order to grow.


    You have to become a disciplined thinker and not allow yourself to fall into the
    trap of negativity. You will have days when you feel bad, upset, or angry—we all
    do that and life is life—IT IS NORMAL! However, try to have more days in which
    you feel happy, and that will keep you on the right course.


    Here are some examples of things people do have low self-esteem. I want to highlight
    them, in order for you to see IF they apply to you. (Once you realize this about
    yourself you can start to make the changes).


    +   - Negative self-talk—“I could never be good enough to do that”.

    - Blaming bad luck—“She always gets the best luck, and I am always stuck with
    this mess”.

    - Blaming the past—“I would be doing really well if I had never met So-And-So
    who messed everything up for me”.

    - Wishing with no action—“I wish I could have a great job. Oh well... I am off
    to the job that I hate”.'
  - '[PAGE 127]


    # 112 CHAPTER SIX The Sisterhood


    +   - Waiting for the impossible to make a change—I will be able to straighten
    everything out... as soon as I win the lottery”.


    Now, here are examples of things that YOU can do NOW, to start building your self-esteem:


    Write out ten things that you like yourself (it can be anything from your eyes)
    for your sense of humor. Be creative when you are making the list and really give
    it some thought).


    Now that you have your list, take a mirror and begin to tell yourself the following
    things aloud:


    +   - I am beautiful


    +   - I am ambitious,


    +   - Start telling yourself all the things that made your list—do this every
    day for a month (** NOTE: At the end of the month, you will begin to see a change
    in how you feel about yourself).


    +   - This is NOT arrogant at all. You are starting to develop and realize your
    self worth. Do not SELF-SABOTAGE or let anyone take that from you; especially
    you!


    +   - Start complimenting others on the things that you see in them that are GREAT—even
    if you DO NOT know them.


    +   - Smile when you pass by others. (You never know what that smile can do for
    someone who is feeling down).


    +   - If you see someone that has beautiful eyes, tell them, let them know! It
    will make them feel great, but you get the real blessing.


    +   - Practice more patience! We all hate to wait in lines, but sometimes that
    is the way it goes. We do not all get the red-carpet treatment and that is okay
    too.


    *'
  - '[PAGE 128]


    +   Take a deep breath and crack a joke, lighten the mood around you.


    +   Good deeds DO NOT go unnoticed. Do what you can if you see an opportunity
    to help someone.


    +   If you are at the gas pump and an elderly woman drives up looking as though
    she does not have the strength to pump her gas, offer to do it for her. Be her
    angel for the moment.


    All these seemingly ''little'' things, oftentimes overlooked, will bless you in
    ways that you do not even know. ''Karma'' is watching and when you need a break,
    something good in return occurs MOST of the time! It will come to you, especially
    if you have gone out of your way to help others (at least, that is how the philosophy
    goes and advocates!).


    If you begin to do these simple things today, I promise you, you will have a life
    of self-worth and immense inner-value. Do not settle for average or mediocre!


    Be bold! Be great! Find your passion and create your destiny! God gave you the
    desires of your heart so you could achieve them, not to let them lay dormant in
    your mind. Being great takes hard work, but it is also SO well worth the effort!


    Please take a chance on YOU for once. I believe that YOU CAN do it!


    # THE IMPORTANCE OF FRIENDSHIP AMONG WOMEN


    > There is a special kind of freedom sisters enjoy. Freedom to share innermost
    thoughts, to ask a favor, to show their feelings. The freedom is simply to be
    themselves."


    ---Unknown'
  - '[PAGE 129]


    # 114 CHAPTER SIX The Sisterhood


    What would we do without our girlfriends? Guys have their poker-pals golf or fishing,
    working, hunting and drinking buddies. Plenty of married couples call their spouse
    their best friend. But close friendships among women are well, just that... a
    whole heck of a lot different and totally worthwhile!


    **AN INTERESTING FACT:** Sixty four percent of women choose to talk to girlfriends
    rather than their spouses or mothers about relationships and sex. These revelations
    come as no surprise to researchers who have studied women’s friendships.


    **SIDEBAR:** My best friends are so important to me that I can barely quantify
    our relationships and do them justice in the process. I can be so honest here,
    and with them, without any fear or risk of the relationships being damaged or
    hurt in any way. Between us, there is no fear at all. We just understand what
    the other person is going through. After all, many of us share the same issues.


    I have chosen friends who have each of our best interests at heart, front of mind
    and are happy when something great happens in each other’s lives. We cheer one
    another on and lend a hand, whenever and wherever help is needed. That is what
    a good good girl friend does, after-all.


    That *depth of emotion* and *lack of fear*, are the essence of what makes women’s
    friendships different than men’s. In general, men’s friendships are based on common
    interests or skills (as I mentioned before)—a shared commonality of sorts. On
    the other hand, women’s friendships, relationships and connections are based on
    sharing feelings and emotions. All of this does not necessarily mean that men’s
    friendships with other men are any less in-depth, treasured or relevant. They
    are VERY DIFFERENT. Regardless, friendships may very well just as important and
    enduring, and the degree of emotional reliance and caring tends to be more implicit
    than explicit in the case of the women.'
  - '[PAGE 130]


    # BEAUTIFUL AMBITION 115


    Women are far more likely than men to join formal or informal support groups,
    in order to help one another deal with issues, for anything ranging from and including
    child care and/or work, social, emotional even relationship problems.


    However, women''s friendships can be more volatile than men''s, as well. This
    happens because, at times, they are more intense in a manner of speaking.


    In general, females may expect more time and emotional attention from their girlfriends
    than men do from their male friends. Women also are more likely to “carry issues”
    and hold grudges. It can get complex fast!


    These connections and differences are also increasingly becoming even more important
    in a society in which a growing number of people are single,(either by choice
    or circumstances).


    **By 2010, it is projected that 31 million Americans will live alone.**


    All of these factors make friendship MORE critical than ever. Every woman that
    I know, that is currently single, is out there looking for “Mr. Right”. Sure,
    they may say that they are happy being alone and that the time is good for them,
    yet they are all on dating websites and/or searching to be set up on dates.


    I completely NOT understand that they want to find the right guy, for we are certainly
    not made for or to be alone. God created Adam and Eve if we were meant to be alone,
    then Adam would have been so, and content! Yet, all the animals were also put
    in pairs, both male and female. It goes without saying that, we are meant to be
    together, almost BY OUR VERY DESIGN!


    This is also were it can get quite ‘sticky’ and complex. It seems like there are
    more women out there looking for love, there are greater men to go around!


    This is where competition and jealousy start. I believe that every one of us has
    “special someone” out there. I know it sounds incredibly cliché, but I think and
    believe it to be very true, the time in my life that I was NOT looking for Mr.
    Right was the time that “Mr. Right” came into my life! (you just never know when
    it is going to happen for YOU!)'
