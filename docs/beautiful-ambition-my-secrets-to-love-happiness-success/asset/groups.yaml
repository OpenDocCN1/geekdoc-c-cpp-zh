    # 26 CHAPTER TWO I Want it All and I Want Now


    I know the power of writing goals proved invaluable for me and this is something
    that I do now... and will continue doing for the rest of my life. Let this be
    a new habit that you learn to stick with. I promise that not only will it help
    you reach your goals, but you will also learn so much about yourself along the
    way!


    Never underestimate the power you have over your own fate. You are in control
    of your own future. Stay focused, and keep the end in mind as you take action,
    and YOU WILL get there!


    TIP: Here is a technique I still use to this day. I take 2 different sets of colored
    3x5 cards. On one of the colored set of cards, I write down my short-term goals.
    I use green colored ones for these (as it represents to me what is happening now).
    You can use whatever colors you want.


    On the other set of colored cards I write down my long-term goals. Then I tape
    them to my bathroom mirror, where I can see them each and every morning.


    Some mornings I stop to read and think about them. Other mornings I let my subconscious
    mind absorb them and go about my morning routine. This is a very powerful way
    to keep you on track. It also allows your sub-conscious mind to work in the background
    on other, new, and different ways to achieve your goals. This is sometimes known
    as the “ah-ha” moment. Try it. It will have a tremendous impact on all aspects
    of your life.


    Furthermore, motivation and confidence are two of the most essential “thinking
    like a winner” basics that can also help you reach your goals and you achieving
    success. They can easily be enforced through an extremely simple concept known
    as positive self-talk.


    Positive self-talk is a tremendously powerful utility you can rely on to help
    you out. It is used by many people and no matter what the situation, regardless
    of how good or bad it seems. All you have to do is talk to and tell yourself why
    things are not as bad as they appear, and inform yourself how you plan to and
    will fix things.


    I do this all the time when I find myself in any unfamiliar situation. I take
    a minute to think it through, by talking to myself, giving my ‘self’ the emotional'
