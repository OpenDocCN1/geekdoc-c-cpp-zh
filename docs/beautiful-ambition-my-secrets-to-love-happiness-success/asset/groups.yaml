    # 塔拉·布鲁克


    # 美丽野心


    我关于爱、幸福[以及]成功的秘诀


    # 读者对《美丽野心》的评价


    塔拉是一个极好的例子，证明无论你的童年有多么艰难你依然可以拥有一颗温暖仁的心、对生活的热爱以及一种引导你成为一个优秀的人的精神之光……就像塔拉今天成为的一样！


    > — 迈克尔·金，King World Productions 首席官


    King World 是全球领先的首播节目发行商，涵盖了两档收视率最高的分发节目《幸运轮盘》（Wheel of Fortune）和《危险边缘》（Jeopardy）、OPRA（奥普拉·温弗妮秀）、电视收视率最高的综合新闻杂志《内部编辑》（Inside
    Edition）、《菲尔博士》（Dr. Phil）、《每个人都爱雷蒙》（Everybody Loves Raymond）、《好莱坞广场》（Hollywood
    Squares）、《宝贝》（The Little Rascals）等。


    塔拉·布鲁克·博里科承诺，遵循一个精确的计划——一个她详细列出所有准则和禁忌的计划——将带给你一个“快乐、


    ## ii 其他人的评价……


    坚韧且乐观的生活。”在读了她的书《美丽野心》后，我相信她是正确的！当你想要一本将什么、何时、为什么和如何做完美融合在一个易于遵循的指南中的手册时，选择《美丽野心》准没错。塔拉展现出的那种纯真的脆弱感让人焕目一新并鼓励人们信任。如果成功有一个蓝图，塔拉就是一位出色的建筑师！


    > — 埃尔登·泰勒，博士，FAPA，脱口主持人，《纽约时报》畅销书《选择与幻象》及《心理编程》作者


    尊重且庄重的叙述，为**每个人**释放了更多、未来和成功的潜力。它为渴望带来改变、转型和影响的意愿观众带来了笑容和温暖人心的诚实。


    > — 特莉里·莱维恩，博士，畅销作家及商业导师专家


    每个女性都可以成为不凡的女性，过上一种富有影响力和意义的人生。通过塔拉富有创意地编织在一起的故事和接地气的建议，解锁你自己的“美丽野心”和潜力；她将用以前所未有的幽默、坦诚和洞察力触动并启发“你”，并提供一个可以遵循的行动计划蓝图！


    > — 布黛拉·L·莫森，国际励演讲作家。MsMorrisonSpeaks.com


    塔拉大师级地带领读者开启了一场冒险，字面上从封面到封底，穿过被称为生活的所有曲折、路径、挑战和机会！这是一本对所有人都有启发且用的书籍，绝对是你阅读清单、礼物清单和愿望清单中的必备之！


    > — 迈克尔·塔斯纳，畅销书作家，《当下营销》作者


    我强烈向每一位渴望不凡生活的女性推荐《美丽野心》。无论你的背景如何，塔拉的核心信息都非常明确——成功并不只属于少数精英——它属于每一个拥有梦想的人。


    — 珍妮·布斯，五次世界总冠军洛杉矶湖人队业务运营执行副总裁，《湖人女孩》作者


