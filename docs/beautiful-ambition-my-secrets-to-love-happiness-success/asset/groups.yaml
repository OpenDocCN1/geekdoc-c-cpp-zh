    # BEAUTIFUL AMBITION 101


    It is similar to some statements made earlier, when I alluded to ‘karma’. Everything
    that you have done in life will come around again to you, to ensure balance and
    fairness.


    I will never forget what happened to me in the ninth grade. I came to school early
    morning to meet up with my older friends. They were juniors and seniors and we
    hung out in a group of five. All of my friends were pretty popular, but I WAS
    the youngest.


    I became really good friends with this guy “RB” at school, and one of my good
    girl friends had a secret crush on him. Well, I did not know about it and I hung
    out all the time. She was so angry at me that she decided to yell at me in front
    of the entire first-period lunch-group. She argued that I should not think so
    much of myself, and that I had actually known how much she liked him, and that
    I was only trying to keep her from him. She carried on and on....


    Needless so say, I was completely embarrassed and felt deeply betrayed and utterly
    humiliated. Even worse, I had no idea that she was interested in him! I remember
    that I wanted to leave school and never come back.


    Consequently, like all things in high school, this too passed and we were friends
    again the following week. My point is, that we are so quick to hurt one another
    and judge indiscriminately. Usually at the end of the day, it is your girl-friends
    that will be with you in YOUR most important times of need.


    I know that in my life, I have met women with whom I wanted to have a friendship,
    but where they had had no interest in giving me a chance at all. It was NOT reciprocal,
    mutually desired! For whatever reason, they were simply NOT willing to get to
    know me. You can probably relate to this situation, and the real truth is that
    this is the case most of the time, not so uncommon! The rule, rather than the
    exception.


    Unfortunately too, this is generally rooted in their own jealousy and insecurities
    that they have yet to manage for themselves. Therefore, the fact is, it had nothing
    to do with me—or you—personally, but it had EVERYTHING to do with THEM! (they/we
    just did not realize or see it yet for what it is!)'
