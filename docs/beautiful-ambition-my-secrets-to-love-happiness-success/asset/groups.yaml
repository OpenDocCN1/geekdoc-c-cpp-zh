    为了确保你从生活中获得真正想要的，你必须采取的**一个**步骤是什么？不仅仅是财富，还有良好的人际关系、生活方式、精神财富和幸福？如果你知道，请写下来！（97%
    的哈佛毕业生每年都会在这道题上出错！）


    原因在于！！哈佛不教这个！**生活**教！事实上，你不会在任何大学的课程目录中找到它，在高中水平的课程中发现它也很不寻常，然而它却显而易见地“缺失”。你的父母或朋友可能也不知道答案。也许它只是太简单了：一个极其简单的步骤！！！


    20 第二章 我要一切，且现在就要


    3% 的哈佛毕业生采取了一个简单的步骤，做了一**件**稍微……**不同**的事！那是其他 97% 的人没做或没想过的**件事**……


    这导致了**巨大的**差异，并将继续区分成功与超越预期。正因如此，他们赚的钱比 97% 的人总和还要多，而且他们在个人和职业上都过得更快乐、更健康、更成功。


    注意：这些数字源于 60 年代对数万哈佛毕业生的一项研究。（该研究重复过几次，结果相似）。


    这种真正成功的人所采取的极其简单的步骤，是在纸上详细地规划生活（从开始）……**然后**，他们实际上执行他们的计划。当我说细节时——我是**每一个**细节。他们为生活的每一个方面都写下了计划，然后付诸行动。一步一步、一步一步、再一步一步！！


    现在让我们进入正题！这里有一个棘手的问题。你是否在按照别人的计划过你的生活？如果你**没有**得到你想要的生活，可能是因为你允许别人设计了你的生活计划。这可能是你的父母、配偶、老板、政府，甚至你的朋友也可能乐意并乐于**为你**规划和规划生活。但是，这不是通往成功的捷径——如果说有的话，它是通往平庸的慢船。成功是一个自我命：设计你想要且值得的生活，然后采取重大行动来实现它。


