    \ sure to reap the rewards of your extra efforts as you!).\n\n## Healthy Inside\
    \ and Out\n\nLike everyone, I love a good tan, I am also aware of and concerned\
    \ about risks like sun damage. Thank goodness, there are so many great selftanners\
    \ on the market that you really do not have to spend time in the sun to get great\
    \ color.\n\nWhen looking for a self-tanner, my advice is to purchase a product\
    \ that goes on color, so you can see if you have missed any spots.\n\nI recommend\
    \ using an exfoliating product in the shower before you apply the self-tanner.\
    \ You can use a salt or sugar scrub at any department store, drugstore or even\
    \ health-food store. They make some with great fragrances. (To save money, mix\
    \ your own with equal amounts of sea salt and baby oil. It works wonders!)\n\n\
    I also use a bristle brush on my skin for increased circulation. This is especially\
    \ helpful if you sit at a desk all day. You will need something to create extra\
    \ circulation in your hips, thighs and bottom. Make sure you brush your skin upward\
    \ motions going toward your heart and keep the dry. I like to do this before I\
    \ get in the shower and exfoliate. After exfoliating, you are ready for the self-tanner\
    \ and are just minutes away from a deep, dark tan.\n\n## BEAUTIFUL AMBITION 193\n\
    \nI use a self-tanner twice a week, and to avoid dry skin I always remember to\
    \ moisturize my body every evening with a creamy rich in emollients, like avocado,\
    \ vitamin E and cocoa butter.\n\nNow, let us talk about your hands and feet. As\
    \ I said before, men love soft, sexy feet. Whether you do them at home or go to\
    \ a salon, manicures and pedicures are a must! That does not mean just changing\
    \ the polish. cuticles, nails trimmed and filed. \n\nIf you are blessed with perfect\
    \ teeth, then you should do everything possible to keep your smile beautiful.\
    \ I make sure that I get my teeth cleaned every six months and I floss daily.\
    \ There are so many teeth-whitening products on the market today, in all price\
    \ ranges, that there really is no excuse for your smile not to be bright. A beautiful\
    \ smile is something people will always remember about.\n\nRemember that looking\
    \ and feeling your best is a combination that comes from feeling good BOTH on\
    \ the inside AND taking the steps that will keep your physical body healthy and\
    \ fit. If you do these things, then you will also feel good about yourself on\
    \ the outside.\n\nBelow are some of my favorite recipes... if you do not know\
    \ how to cook, this is a great time to learn! Like you, I also love eating out,\
    \ but it is very difficult to maintain your weight if you are eating out too often.\n"
