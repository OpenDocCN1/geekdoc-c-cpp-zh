    # 宏大的抱负 111


    周围的人可以影响你，但归根结底，这是你自己的决定！你是否掌握控制权并做对你最好的选择，完全取决于你自己。这本身就让人感到非常安心和肯定！


    每当你醒来并宣布今天将是极好的一天，今天会有妙的事情发生在你身上时；每当你紧接着写下你的目标和自我肯定言，并大声说出它们时——你将开始感到充满力量，并开始相信好事真的会发生在你身上。


    一旦你开始相信自己，你也会开始意识到你值得拥有好事。没有什么能阻挡你！世界，当心，我来来了！！！听听我的咆哮声！！


    一旦你开始激活这些强大的宇宙法则，你将开始改变和成长。再次，把你的自尊和自自信看作一株需要照料才能成长的新植物。


    你必须成为一个有纪律的思考者，不要让自己陷入负面情绪的陷阱。你会有某些感觉糟糕、沮丧或愤怒的日子——我们都会这样，生活本就是这样——**这是正常的！** 然而，尽力让自己拥有更多快乐的日子，这会让你保持在正确的轨道上。


    以下是一些自尊心低的人会做的事情例子。我想把它们列出来，让你看看它们**是否**适用于你。（一旦你意识到自己的这一点，你就可以开始改变了）。


    - 负面自我自语——“我永远没好能做这件事”。

    - 归咎于运气不好——她总是运气最好，而我总是陷入这团乱子”。

    - 归咎于过去——如果我从没有遇到那个把我一切都搞乱的某人，我本会过得很好”。

    - 只有幻想没有行动——我希望我有一份好工作。噢算了……我又要去那份我讨厌的工作了”。


    # 112 第六章 姐妹情


    - 等待不可能的事情发生改变——只要我中了彩票，我就能把一切理顺……”。


    现在，这里是一些你**现在**就可以做的事情，用来开始建立你的自尊心：


    写下十件你喜欢自己的事情（可以是从你的眼睛到你的幽默感等任何事情。列清单时要发挥创意，并认真思考）。


    现在你已经有了清单，对着镜子大声对自己说以下话：


    - 我是美丽的。

    - 我很有抱负。

    - 开始每天对自己说出你清单上的所有事情（注意：一个月后，你将开始发现对自己的感受发生了变化）。

    - 这完全不是傲慢。你正在开始发展并意识到自己的价值。不要**自我破坏**或让任何人夺走你的东西；尤其是你自己！

    - 开始赞美别人身上看到的**优秀**特质——即使你并不认识他们。

    - 在路过别人时保持微笑。（你永远不知道微笑对一个心情低落的人意味着什么）。

    - 如果你看到某人眼睛漂亮，告诉他们！这会让他们感觉很棒，而你也将获得真正的祝福。

    - 练习更多的耐心！我们都讨厌排队，但有时生活就是这样。我们并不是所有人都能得到地毯般的待遇，这也没关系。

    - 深吸一口气，开个笑话，活跃周围气氛。

    - 善行不会被忽视。当你看到机会帮助他人时，尽你所能。

    - 如果你在加油站，看到一个看起来没有力加油的女性，提议帮她。成为那一刻的天使。


    这些看似被忽视的“小”事，往往会以你无法想象的方式赐予你。“因果”在观察，当你需要休息时，很多时候好事会发生！尤其是当你特意去帮助他人时（至少哲学是这么说的！）。


    如果你从今天开始做这些简单的事情，我向你保证，你将拥有自尊和巨大的价值。不要满足于平凡或平庸！


    勇敢起来！变得伟大！找到你的激情并创造你的命运！上帝赋予了你内心的愿望是为了让你实现它们，而不是让它们沉睡在你的脑海里。变得伟大需要努力，但也非常值得！


    请给自己自己一次机会。我相信你**可以**做到！


