    school, let us just face it... it is all about the boys and wanting to be the
    best.


    Unfortunately, when it comes down to it, we DO NOT particularly care whose lives
    we have to ruin to get there, in the process!


    However, this is also NOT the BEST way to achieve what we want, since everything
    else in life does not work the same way as in high school. In the “Real World,”
    if you continue this behavior long enough, it becomes a really bad habit, second
    nature if you will. You will find people not want to be around you if you keep
    acting this way. Why? Well, it is simple! You have now officially become ‘the’__itch!
