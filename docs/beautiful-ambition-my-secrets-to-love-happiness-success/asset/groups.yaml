    That is really the key-question, the core of what we need to do: SYNERGIZE! Put
    it all together.


    That is what this chapter is all about; taking everything that you have learned
    and applying it to your life to become the happy, healthy, well-rounded person
    that you want to be.


    ## 206 CHAPTER TEN Full Circle


    ## 30-DAY TRIAL UNDERTAKING: A GETTING HEALTHIER ADVENTURE


    The true test of any new lifestyle habit that you are trying to develop is in
    the "30-day trial" concept. Just like "as seen on TV" products that often advertise
    their 30-day guarantee so that you can test the product without risking losing
    your money if it''s a lemon, you can also try new self-improvement habits for
    30 days BEFORE you go all-out, go with gusto, for the full version!


    The one GOLDEN rule however is: for those thirty days, you need to dedicate yourself
    to your techniques and goals, and not cheat once. (After all, you are doing this
    for you! If you cheat on your self-improvement efforts, you are only cheating
    yourself out of the results that you want so badly!)


    Remember, it is the first few weeks of establishing a new habit—whether it is
    eating healthy, starting an exercise program, writing in your journal, or sticking
    to a budget—those are the most difficult. By sticking to it for the first 30 days,
    you will already be past the hardest part and will have built up some inertia,
    which makes it much easier to keep going! Take my word for it... it gets easier!


    The reality is that we really sabotage or trip ourselves up sometimes by mentally
    thinking about the change as something permanent BEFORE we have even begun. It
    seems too overwhelming to think about making a big change and sticking with it
    every day for the rest of your life. This holds especially true when you are still
    habituated to doing the opposite.


    The real catch-22 is: The more you think about the change as something permanent,
    the more you stay! But if you thought about making the change only—say for 30
    days—and then you are free to go back to your old habits? That does not seem so
    hard anymore.


    If it helps, exercise daily for just 30 days (nothing extreme, even a walk will
    do), then use what you have learned to form a schedule that works best for you.


    Stick to healthy meals for 30 days, then you will know how much time you will
    need for writing in your journal and when you enjoy it the most. It still requires
    a bit of discipline and commitment, but when you set a goal of only 30 days to
    start—as a trial run—it is not as daunting as making a permanent change.


    Now, if you actually complete a 30-day trial, what is going to happen? First,
    you will have established the habit far enough to maintain easier than it was
    to begin. Secondly, you will break your old habit cycles during this time. Thirdly,
    you will have thirty days of success behind you, which will give you greater confidence
    to continue. Finally, you will gain thirty days worth of results which will give
    you practical feedback on what you can expect if you continue, putting you in
    a better place to make informed long-term decisions.


    Therefore, once you hit the end of a 30-day trial, your ability to make the habit
    permanent is vastly increased. But even if you aren''t ready to make it permanent,
    you can opt to extend your trial period to 60 or 90 days.


    ## 208 CHAPTER TEN Full Circle


    The longer you go with the trial period, the easier it will be to lock in the
    new habit for life.


    Another benefit of this approach is that you can use it to test new habits where
    you are really not sure if you even want to continue for life. Maybe you would
    like to try a new healthy diet but do not know if you would find it too restrictive.
    In that case, do a 30-day trial and then re-evaluate.


    There is absolutely no shame in stopping after 30 days if you know the new habit
    does not suit or work for you. Odds are that you will not need to stop altogether;
    you just need to have another look at the way you are approaching the new habit
    and do it in a different way. Your way. No harm, no foul!


    This 30-day method works best for daily habits, but there is nothing that says
