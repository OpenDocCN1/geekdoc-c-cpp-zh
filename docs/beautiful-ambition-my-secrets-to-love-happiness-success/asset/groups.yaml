    # 宏大的抱负 115


    女性比男性更容易加入正式或非正式的支持小组，以互相应对各种问题，从照顾孩子到工作、社交、情感。然而，女性的友谊可能更不稳定。这是因为有时这种情感更激烈。


    通常，女性对闺蜜期待的时间和关注比男性对男性朋友更多。女性更容易“带着问题”并记恨。这会很快变得复杂！


    这些联系和差异在单身人数越来越多的社会中也变得越来越重要。


    预计到2010年，将有3100万美国人独自生活。


    所有这些因素让友谊比以往任何时候都更**关键**。我认识的每一个单身女性都在寻找“真命天”。当然，她们可能会说自己一个人很快，这段时间对她们很好，但她们都在约会网站上和/或寻找约会。


    我完全**理解**她们想要找到一个正确的男人，因为我们绝不是为了孤独而生的。上帝创造了亚当和夏娃，如果我们注定要孤独，亚当本应该是孤独且知足的！然而，所有的动物也被分成了对，既有雄性的也有性的。不必说，我们注定要在一起，几乎是因为**我们的设计**！


    这也是可能变得非常“棘手”和复杂的地方。似乎有很多女性在寻找爱情，有很多优秀的男性可以选择！


    这就是竞争和嫉妒开始的地方。我相信我们每个人在这个世界上都有一个“特别的人”。我知道这听起来极其老生俗调，但我认为并相信这是真实的：在我生命中那个**没有**寻找真命天子的时刻，正是“真命天子”进入我生活的时刻！（你永远不知道它何时会发生在**你**身上！）


