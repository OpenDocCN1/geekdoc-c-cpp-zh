    *例子：* 接受新工作意味着学习新技能、搬到一个新城市等等。有这么多变量要处理，你最终会做出一个大决定——或者根本不做决定。计划是让你所做出的决定取得成果的关键。一旦你知道自己正在做出正确的选择，你就必须有一个伟大的计划来执行到达目标的每一步。


    **将那个大决定分解成更小、更容易管理的决定。**


