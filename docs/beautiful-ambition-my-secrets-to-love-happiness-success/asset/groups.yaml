    # BEAUTIFUL AMBITION 27


    support that I need. (Every day, I tell myself that I am achieving my dreams and
    that good things happen to me; that people like me, and that I am making a difference).


    So many times, we self-sabotage ourselves. DO NOT be afraid of the power that
    you have to be great. I know that it can be scary to have success fall into your
    life because of fear, but self-sabotage does happen a lot, tripping up many along
    the way. However, by using positive self-talk, you will recognize whether or are
    you not sabotaging your own progress.


    Here are a few examples of the things that I say everyday to affirm myself. These
    seem simplistic, yet they are powerfully effective!


    Try repeating the following to yourself:


    +   - I am achieving my dreams and desires every day. I am a success.

    - I like myself and what I see when I look in the mirror. I am a good person.

    - I make friends easily and people like me.

    - I make great financial decisions.

    - I am in the best shape of my life.

    - My body is healthy and strong

    - My mind is alert and sharp.

    - I can do all things


    DO NOT mock it, until you have tried it! Yes, they are simplistic and if you say
    the words, and believe them—no matter how bad the situation is, no matter how
    you got yourself—YOUR mind will be working to get out of it! This happens by YOU
    telling yourself that everything is fine, and it will all be over soon. (This
    is not denial or wishful thinking—it is affirmation, followed by deliberate, empowered
    action!).'
