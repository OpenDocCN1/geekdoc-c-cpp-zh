    # Living with Passion


    is the motto and inspiration behind the treasure-rich gem entitled Beautiful Ambition,
    as authentically penned by the author, model and businesswoman, Tara Brooket


    Open-hearted venturing into some of her own personal trials, struggles and challenges
    growing up, is done with grace and ease, looking to be inspiring and motivating
    for others to take


    an entire new outlook on their lives, future, dreams and opportunities. The messaging
    is fresh and inspirational: hard work and dedication enables achievement of dreams,
    beyond the wildest of expectations and imagination.


    Tara is an amazing example that no matter how difficult your childhood is... you
    can still have a warm heart, a love of life, and a spiritual light that will guide
    you into becoming a wonderful person... the kind that Tara has become today!


    > -Michael King

    CEO, King World Productions


    This book is a must-have that provides a step-by-step approach on what and how
    to go about life, how to embrace, be and do what you are and want to be. Whilst
    staying true to self, dedicated to making happen and having the life YOU have
    always dreamed of, become a reality. The core message: YOU CAN DO ANYTHING in
    life, putting your head, heart and mind to it! (P.S. Also remembering that it
    makes sense to find and utilize the short cuts and solid advice from people who
    have accomplished the things that you may want and admire yourself!)


    SELF-HELP / General

    ISBN 978-1-60037-978-9

