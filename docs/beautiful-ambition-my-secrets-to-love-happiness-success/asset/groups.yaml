    - 51 g. protein

    - 14 g. carbohydrates

    - 20 g. fats


    # Citrus:


    - 2 medium oranges.


    Divide the oranges into two plates.

    Makes 2 servings.


    # Nutritional Analysis:


    - 62 calories

    - 1 g. protein

    - 15 g. carbohydrates

    - 0 g. fats


    # Helpful hints:


    - If using thick asparagus, boil 5 minutes.


    # Turkey and Asparagus Penne


    This whole-wheat penne, with turkey, asparagus, tomato and basil, can be used
    like regular.


    # Countdown:


    - Cook pasta

    - Prepare turkey

    - Prepare tangerines


    # What You Need:


    - 1 cup whole-wheat penne

    - 1/4 pound asparagus

    - 1/2 cup sliced carrots

    - 1 medium tomato, cut into cubes

    - 1/4 pound smoked turkey breast

    - 1/2 cup fresh basil, snipped

    - 3 tablespoons sugar-added oil


    # Sauce:


    - 1 garlic clove, pressed

    - ¼ teaspoon sugar

    - 2 tablespoons dry sherry


    # Directions:


    Whisk together the ingredients for the sauce in a small bowl.

    Cut the pounded chicken across the grain into 1-inch wide strips.

    Bring a large saucepan filled with water to boil.

    Cook the pasta according to package instructions. (Do not overcook).


    Heat the skillet or wok over high heat, then add the oil and onion. Stir-fry until
