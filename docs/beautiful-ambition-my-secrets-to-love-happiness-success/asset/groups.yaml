    # BEAUTIFUL AMBITION 133


    If there is anything you are not sure of, ask yourself how your life would be
    improved if you had it (and how terrible it would be if you did not). This will
    help tell you whether it is a “want,” or a “need.” This part may be quite challenging,
    because it is easy to justify why you “need” pretty, impractical things. But be
    honest with what you can afford.


    Set Goals—Put aside your “want” list. Now, turn your “need” list into a collection
    of goals. Some people like to set daily, weekly, and yearly goals for themselves.
    Set up your “goal list” in whatever way works for you.


    Make a Plan—With goals in hand, you must now begin to develop a plan for achieving
    them. Imagine yourself moving toward each goal. Break it down into steps. If you
    can afford to set aside $10 a week purchasing a winter coat, for example, figure
    out how long it will take before you have enough money to buy it. Then make a
    calendar with an instruction to save $10 a week. Remember, writing your plan down
    makes it easier to achieve. I cannot say this enough.


    Take Action—Now you have a plan. Congratulations! Print several copies, look at
    them often, and take action.


    # Get S.M.A.R.T.


    A realistic goal is SMART (in more ways than one):


    +   - Specific

    - Measurable

    - Attainable

    - Relevant

    - Time-related'
