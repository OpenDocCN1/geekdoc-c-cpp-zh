    第二章 我要一切，且现在就要


    ## 你想要什么？


    > “让你的生活成为一项使命——而不是一次中场休息。”


    > —阿诺德·H·格拉斯哥


    选择。这关乎自由——即选择和做出更好决定的自由，即权衡优先级并在不同选项中取舍的自由。停下来思考这个关键问题：“你正在选择你想要的生活吗？”


    “噢，不，”回答道，“我做不到，因为……我的教育程度不够……我需要照顾家庭……我没有足够的钱……我没有时间。”


    所以，让我直开布公地问你：**你的**借口是什么？上面列出的所有内容也是我必须处理和解决的问题。难以置信吗？是的，但事实如此！毕竟，我只有高中学历，成长过程中家里面临着财务挑战（也就是说，我们那时穷得叮当！），如果我听从周围负能量人士的话，甚至听从我自己的恐惧，我永远无法走到今天，甚至无法达到我现在的高度。现实是：借口就像消弱意志的恐惧一样，会让你停滞不前，夺走所有的希望和梦想。


    事实是，我们生活的每一刻都有选择。然而，对于那些贫困的人来说，生活中的选择更少、更乏且更稀少（如果有的话！）。但对于我们其他人……让我们来明确一点！我们认为自己没有自由，仅仅是因为我们还没有主张行使不同选择的力量！


    你通常是如何做决定的？你是基于……吗？


    - “应该”——做你认为你应该做的事。

    - 讨悦他人——做别人想要或期待你做的事。


    ## 美好的雄心 19


    - 恐惧——因为害怕做不同的事情而选择安全路线。

    - 习惯和反应——你甚至不思考自己在做什么——你一直都是这样做的？


    另一方面，你拥有自己的选择权……当你基于……基础做出决定时……


    - 欲望——选择你想要的东西

    - 需要——响应更深层的欲望

    - 真实性——你知道自己是谁以及你代表什么

    - 创造性表达——你追求卓越。


    那么，你如何才能对选择“不同”且“更好”的事开放？这一次，明确你**到底**想要什么。要有目标感。有了目标，你就会知道什么最适合你。


