    回答这类问题将增加你做出正确人生选择的机会。然而，你没有理由急于寻找答案。只有当你花时间真正探索内在自我时，这些答案才会出现在你面前。


    那么，你究竟如何才能很好地审视自己并了解自己呢？这是一个好问题；答案就在七个重要的步骤中。


    在我们开始这些步骤之前，我想看看几个我认为在生活中做得非常出色的女性的经历；她们不仅实现了美国梦，还成为了我们的“榜样”。话虽如此，也让我明确一点，我们所有人都会犯错，名流也不例外。然而，在某种程度上，我所描述的这些每一个女性都能够从争议中走出来，并过上幸福、充实的生活。让我们近距离观察另一个故事。


    ## 佳例：贝塔尼·哈密尔顿（BETHANY HAMILTON）


    贝塔尼出生于一个冲浪狂热者家庭，在夏威夷海岸和凯考伊岛外充满诱人的浪花中，贝塔尼在水中遇到了改变她生活的对手。从她年幼时第一次被放在冲浪板上起，她对冲浪的热爱与增长；5岁时信奉耶稣基督；连年获得职业冲浪比赛冠军（8-13岁）。作为一名业余且有成就的冲浪运动员，在NSSA国家锦标赛中获得女子公开组第二名，通往职业冲浪的道路充满希望地开启。


    ## 美好的壮心 37（BEAUTIFUL AMBITION 37）


    但一次与鲨鱼的挑战性遭遇改变了一切，至少起初似乎如此！


    2003年10月31日，她在冲浪时，一只14英长的虎鲨发起了报复性攻击，在她平躺在板上时切断了她的左臂。她的失血非常严重（到达岸边时已失血60%），朋友和家人来营救她，并因止血救回了她的命而受到认可。


    她的积极态度是“感恩的心态让你获得高度”这句话的缩影。这也是过去和现在救了她生命的因素。经过多次手术，没有发生感染且愈合正在顺利进行，她是许多人继续坚持、深挖和追求更高目标的灵感！她依然坚定要实现梦想，继续前进，不断前进，过好自己的生活。她不再仅仅是一个鲨鱼袭击的青少年受害者。她从未想过自己能否再次冲浪，但在事故和遭遇鲨鱼后不到一个月，她就带着坚韧和决心再次回到水里。


    单手冲浪对她来说是一个巨大的挑战，但她坚持了下来！很快，她进入了赛场，并不需要同情或特殊对待，她只是关注。她在2004年NSSA国家锦标赛获得女子公开组第二名；2005年获得女子组冠军；2008年获得NSSA国家锦标赛获得第三名；她在Roxy
    Pro冲浪节获得第一名。她继续激励


    ## 38 第三章：我是谁？（CHAPTER THREE Who Am I?）


    有些人可能会将她描述为“复出的运动员”，但她想要与不同。用她自己的话来说：“我无法改变”


    由于她被描述为传奇运动员，但她关注周围周围的人。关于她的故事，她并不想要。


    ## 了解自己的七个步骤（THE SEVEN STEPS TO KNOWINGSELF）


    自我意识不是你可以立即发现的东西，而是一个通常需要七个步骤的过程。这些步骤并不像最初看起来那样是有定义的；相反，你可能会打破顺序进行，并且你会发现它们经常重叠。


    请记住，无论我们如何，我们都是不断发展的。虽然这七个步骤将帮助你开启了解自己的道路，但自我发现是一个一生的过程。


    ### 第一步：每天给自己留一些高质量的时间


    > “只有面对真相时，你才能找到自己。”

    —— 珍珠·贝莉（Pearl Bailey）


    为了了解你自己，你需要为自己留出高质量的时间。诚然，我们都很忙，并不总是容易为自己留时间，但请将其视为必做之事。每个人都需要花时间独处，执笔列出生活中想要的一切。


    当我读高中时，我想成为模特。然而，我也意识到为了让这个梦想变成现实，我需要几件事。所以，我做了你现在要采取执行的事（这也是我现在仍在做的！）我列出了一份成为模特需要的所有物品。


    这个过程不仅让你识别出在达到目标之前需要经过的不同阶段，还能让你深入审视内心，发现你把时间花在了哪里、如何花、以及和谁一起花。


    识别自己的行为模式是了解自己的重要部分。然而，同样重要的是观察你身边人的类型。人们对你的道路有巨大的影响，他们可以在过程中帮助你成长，也可能击垮你，阻碍你实现更大的潜力和梦想。


