    斯旺克是第一位获得两次奥斯卡奖的女性，加入了薇薇恩·李、海伦·海斯和路易斯·雷纳等人的行列，这属于她自己的类别！


    去某处或成为某人，在生活中，相信自己的梦想，努力实现它，最终获得了丰厚的回报。这意味着采取了正确的道路（在公园，或者那条铺金之路），这经常为你发生，提醒了其他人！


    生活中有很多事情可能在情感或身体上让人无所措。然而，她又一次一次发放异彩！希拉莉采取了一种新方法，


    ## 宏伟雄心 65


    激励他人，拥有非常明确的方向，并坚持计划和生活梦想。受欢迎且广受赞誉，她不断获得新的电影合约和银幕角色。她在1992年出道，从那时一直表现强劲。


    即使决定很难做出并看起来极其困难，有计划地地做出决定也会取得成效。这对你也有帮助！记住：她证明了自己是成功的，没有让别人的话阻碍她。她是一个勇敢的女士，这也是我喜欢她的原因之一！作为演员...


    用她自己的话：


    > “在生活中，你的思想可能是最大的障碍或工具，取决于你如何使用它。我发现许多生活上成功的人都说‘我能做到，我会去做这个’；而人们醒来时说‘噢，我做不到’，他们的思想阻碍了他们去完成梦想所需的事情。”


    ## 决策的七条规则


    以下是你应该执行的七条基本规则，以帮助建立良好的决策习惯：


    **关注最重要的事情**——这似乎显而易见，但它是最常被违反的决策原则。人们用许多变量过载决策过程，导致真正重要的事情往往丢失了。知道生活中的“为什么”是非常重要的。


    你想要这个或那个？它带给你什么？理解这背后的原因将让你专注于眼前的目标。


    例如：大多数决定只需要你回答一个是或问题，例如，我真的喜欢他吗？我想要这份工作吗？我们要发布这个产品吗？但有人会说：“这个呢？”另一个人说：“那个呢？”


