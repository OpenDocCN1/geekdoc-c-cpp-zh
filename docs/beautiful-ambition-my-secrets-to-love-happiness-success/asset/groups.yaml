    詹妮弗还注意自己的饮食，并坚持健康的饮食。她知道什么对她好，什么对她有害，并努力避开有害事物。虽然她偶尔会纵情吃点甜点，但她不会为了再次减肥而跳进新的节脂饮食。在接下来的一段时间里，她会更加谨慎，因为她知道自己需要再次恢复状态。


