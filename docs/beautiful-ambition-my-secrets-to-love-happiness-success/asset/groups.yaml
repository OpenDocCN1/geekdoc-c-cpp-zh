    not look like you are getting anything done, does not mean that the activity does
    not have any value. It is a powerful tool; as long as you use it in the right
    place and time, appropriately. Your inner-voice can help you clarify the image
    of the life that you want to live, and what you will need to do to get there.


    It is important that while you listen to your inner-voice, you never secondguess
    it. I never do, because I understand that it is there in order to guide me. If
    you choose NOT to listen to your inner-voice, it may be because you simply do
    not want to hear, or fear what it has to say, and that alone does not mean or
    justify that you shouldn''t!


    # BEAUTIFUL AMB 41


    **SIDEBAR:** For example, in my own experience when I was in my early twenties,
    I had a friend who was not good for me. I made many excuses for her behavior,
    certain that I would be able to help her. It was quite a while before I allowed
    myself to realize that she was not a true friend for me, and she was not equally
    concerned about what was best for me. It was not a two-way street or reciprocal,
    balanced, positive mutually-beneficial relationship. It was quite one-sided.


    It took a great deal of strength to make the decision to remove her from my life
    entirely. Even more difficult to take the necessary actions that I needed to follow
    to indeed get her out of my life. If I had listened to my inner-voice all long,
    it would not have to come to point. My inner-voice told me that she was not a
    good person for me to be around. But, I had to learn this lesson personally, the
    hard way, as many people do.


    I want to be clear that this can be very difficult. Make no mistake about it!
    When you decide to eliminate somebody from your life, it is not easy and you will
    feel a lot of different emotions. This is normal.


    However, if you find that you have several people in your life like this, do not
    attempt to make the whole shift all at once, because it can be emotionally draining.
    Start out by limiting phone calls and your association with these people. Little
    by little, it will become easier for you. You may need to change your email address,
    in addition to a new home and cell phone number. It may sound extreme, but in
    most cases, this is the easiest way not to have to hear them again.


    You will start to see that this is the right decision and you might very well
    be able to witness the growing positive changes, due to your ability to release
    them. You will even begin making new friends that are healthier influences and
    companions for you. I know now, that I have the most incredible group of friends
    anyone can wish for. People that I care deeply, and who want the best for each
    other, while being there for one another, in a positive, uplifting way. Having
    friends like that in your life is such a blessing!


    We have been given this inner guide as a compass, and by learning to get to know
    ourselves, we can learn to use that compass, and behave accordingly. Use your
    compass to take a full account of who you are, and who is in your life. Then,
    decide right away whether or not each of these people is good for you, or not!


    By learning to listen to myself and trust what my inner voice was saying, I started
    naturally attracting the right kind of friends for me. These are people who truly
    care about my happiness and support me in my dreams and my goals.


    This can include anybody with whom you choose to spend your out time. It may be
    a friend, boyfriend, family member, or other person that you have some boundaries
    and sense of shared control, give-and-take. It may seem difficult at first, but
    you need to weed out the negative people in your life in order to enable yourself
    to move forward, follow your inner voice, and achieve your dreams and your goals.


    Keeping a positive attitude must not only be something that you do to your surroundings,
    but it must be something you bring into yourself. Through this effort, you should
    arise each morning with a smile in your heart. If this is difficult at first,
    then reassure yourself by saying these words out loud:


    > “This is going to be a great day, and something wonderful is going to happen
    to me.”


    **BAR:** I personally say this phrase every morning with my husband, so that we
    can affirm that the day will be great, even before we have rolled out of bed.
    It helps me to start in a positive frame of mind, and start the day off right.
    By beginning every day focusing on how wonderful it will be, you will find that
    life is much better.


    Your next step is to find a way to express your thoughts. This will help you connect
    with your inner voice and de-clutter your mind. This could include writing, drawing,
    or even speaking out loud. Whatever method you choose, as long as you are consistent,
    you will see results.


    # BEAUTIFUL AMB 43


    Consider yourself a student of your own life. This means being willing to observe
    your thoughts, feelings, and actions without immediate judgment. By doing this,
    you can identify patterns that are not serving you and make conscious choices
    to align them with your true self.

