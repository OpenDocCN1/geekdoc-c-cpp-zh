    can tell you that dreams come true. Your past does not matter!


    What matters is what you decide to change, how you push forward, moving ahead,
    you are the only one that can truly define your life and how happy you will be.


    In this book, I will show you the very best ways to utilize gifts you do have
    and help you take courage, you to be motivated, and inspire you along the way
    as we journey together. It is my deepest wish that everyone reading this book
    will be blessed and has all of the desires of your own heart.


    Remember, we are all here with our own goals. They are all different as the roads
    that we take and the decisions we make. All of these have their impact, costs
    and consequences—some working for the better and some towards the not so great.


    What makes life so enriched with possibilities and opportunities considering both
    paths while navigating your way through life.


    Both of these life-paths—while learning along the way—keeping your faith and loving
    the people in your life, will keep catapulting you forward. The journey itself
    matters just as much, if not more, than only the destination!


    Although at times while on the path of life, the going can seem difficult, this
    is what reaps the most rewards. You can never stop learning, and if you commit
    to the challenges and principles I have laid out for you in the book you will
    be in the position to harvest great success in your lifetime.


    So, now that you know a little more about me, let us continue this journey together
    and get to the real reason you are reading this book and that is… it is all about
    you! So, let us have some fun, discover what that means and where it will take
    you!


    ## CHAPTER 2: I Want it All and I Want it All Now


    > “Life takes on meaning when you become motivated, set goals and charge after
    them in an unstoppable manner.”

    > —Les Brown


    Experts and women like you share simple tips for landing whatever your heart desires,
    whether it''s comfy shoes or your share of the American pie. But sometimes knowing—really
    knowing—what YOU want, is the hardest part of all!


    What further complicates this process for all women, I think, is our capacity
    for empathy... our penchant for caretaking. Yes, the way we can''t seem to be
    truly satisfied unless we are doing something for someone else, someone other
    than ourselves.


    I find myself wanting to save and rescue those around me and I always have to
    remind myself that I can only do so much and that the people I love are themselves
    responsible for their lives and their actions.


    This doesn''t, however, mean that you becoming unwilling to help when you can.
    Nevertheless, there is a big difference between helping a loved one out and trying
    to save or rescue them from their choices.


    Our generous nature is oftentimes the very best thing about us, but we run into
    trouble if this generosity turns into martyrdom and resentment. This is exactly
    when our good intentions toward those we love, deafen us to that quieter call
    of our own desires. We all have to stay focused on our dream(s) and understand
    that we count, and our own life matters also and very much so!


    Following a heart''s desire involves risks. Whether starting your own business,
    falling in love, writing fiction, running a marathon for the first time... You
    have to try your hand at it, and you have to be willing to fail.


    In my life I have had many "failed or less successful attempts", and to be really
    brutally honest, it truly makes the times much sweeter when I win or hit the mark,
    goal or target that I have set out for myself to achieve or out-perform.


    After all, how can I possibly write a book on reaching your dreams, if I do not
    understand the pain and disappointment that comes with failing or falling short?
    Yes, they say, "It''s not hard you fall it''s how you bounce back (I become the
    master of bouncing back and so will you!). Understand that life is about pressing
    on and finding the joy in the journey even the going gets tough. You can always
    find and see the positive in every situation.


    After all the soul-searching, second-guessing and the final banishment of doubt,
    the execution of these plans can seem like the easy part.


    Once you let yourself know that what you really want is to start a catering business,
    you head to Kinko''s for business cards and flyers, check the want ads for kitchen
    space, call up those rich friends who always rave about your cooking and see how
    much they would like to invest. If you''ve always wanted to write a novel but
    have three kids under 6, look into day care, call in a favor from your sister,
    and set the alarm for 3 a.m.


    Here is the crux of the matter: Don''t let hard work or a tough should keep you
    from going after your dreams. It does get easier and you will become "luckier"
    as you start hitting your marks because you will begin working in a positive flow
    with a plan of action. When this happens, start falling into place. You will start
    attracting the very things into your life, with enabled positive thinking, affirming
    type speech, and by deliberate action!


    We have the right, the tools, and the capacity, to live precisely the lives we
    want to. We are the generation of doers, the gender that lifts cars off babies,
    wins the Iditarod, and swims the English Channel, after all! Anyone who gets in
    the way of our heart''s desire once we have really made up our minds, better watch
    out!


    ## A GREAT EXAMPLE: ANGEL JOLIE


    One person who knew what she wanted, set goals for herself, and most certainly
    attained and exceeded them, is Angelina Jolie.


    One great example of a woman learning who she is and following her dreams and
    values along the path she feels is right for her, is Jolie. Though she is the
    daughter of famous actor Jon Voight, her parents divorced when she was only a
    year old, and she was raised exclusively by her mother in Palisades, New York,
