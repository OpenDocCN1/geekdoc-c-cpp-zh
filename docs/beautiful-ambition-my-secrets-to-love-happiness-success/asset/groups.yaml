    ## 宏大的抱负 107


    当我们不尊重自己（无论是充分还是完全不尊重！），没有给生活赋予足够的自我价值时，事情就会悄悄进入我们的生活。这只会导致灾难！


    你必须做的第一件事是预期并接受：你是一个居住在人类体内的灵性。尽管我们可以通过饮食和/或运动来改变对自己在身体上不喜欢的很多地方——当然，还可以通过更极端的选择性美容手术（谢天，不要因为错误的原因去这样做！）——但我们所有人，每一个人都必须理解，有些事情是你根本无法改变的！例如：你的体型。


    如果你腿短，你真的无法把它们拉长到超模的长度。这是你无法控制的，所以你应该决定从现在开始起，仅仅去爱你拥有的这双腿。现在，你可以提高它们的紧致度和线条，但是你**无法**你的骨骼结构！那是上帝、自然和基因意图并赋予你的礼物！


    我首先谈论的是生理特征和挑战，因为我们从小就被教导，人的价值一部分是通过你的外表来衡量的！例如，在留下第一印象时。我们的“价值”根本不是通过外表来衡量的！我认识很多美得动魄的女性，她们也是自我毁灭性最强的人之一；不仅在于她们对待别人的方式，还体现在她们私下对待自己的方式。


    这是一个令人悲痛的遗憾。“内在美”这句老话现在和第一次说出来时一样真实。你可以外表美丽但行为恶劣，你也可以通过可爱的行为成为一个整体上美丽的人。你可以学会爱你的外表，也爱你对自己的感受，因为这会创造健康的自尊和自信。


    ## 108 第六章 姐妹情


    今天，女性们，我们正受到媒体的轰炸，被让我们觉得就像在世界选美大赛中接受评审一样！我们不断地互相比较，并感到自己不符合标准。这是今天女性缺乏自尊的主要原因之一。她们仅仅是**不**觉得自己足够漂亮、足够年轻，甚至不够吸引人。


    **那么，女孩该怎么办？** 我们都知道，媒体**永远**不会停止向我们展示新的最火的阵容、当年的新面孔和身材。首先，你必须明白这样一个观点：美容行业的整个目的就是为公司产生销售额并赚钱。他们越是炫耀当月的当红女孩，你就得花更多的钱来看起来像她一样——或者至少尝试那样。他们正在为此计算、下注并讨价还价！


    因此我们作为女性（以及一些男性），变得痴迷于花费我们没有的钱，我们许多人陷入了不健康的饮食习惯和/或障碍中，因为我们没有简单的自律，或者没有以正确方式做事的方法门道、实践知识！


    我们继续或开始让生活陷入危险，而最终我们仍然对自己不满意——无论是在**内心**还是在**表面**。当你为了错误的原因参与不健康的行为、习惯或模式时，你永远无法获得完美的外表或无法让自己感觉最好！


    这是一个非常重要的讨论的话题，因为如果你理解你所做的某些选择源于缺乏自尊和低落或没有自信，那么你就可以意识到你需要进行心理转变，并从今天开始尝试不同的做法！


    **不要**因为你刚刚发现我是在谈论你而感到心心！意识到你现在意识到，感到毫无价值或觉得自己真的不配得上好事是有危险的。现在注意这些事情，这样你就可以开始修复它们……**相信我，它们是可以修复的！**
    永远都有希望和帮助（比你想象的要近！）。


    ## 宏大的抱负 109


    我知道对我来说，由于处于模特行业，我们承受着最高水平的评判和竞争——**不断地**！被拒绝是模特一直必须经历的事情（是的，姑娘们，这并不会变得更容易！）。


    **侧边栏：** 我必须在很早就做决定——并在脑海中明确——如果我没有得到模特工作，并不是因为我不够漂亮，或不够瘦，而是因为客户对他们寻找的东西有不同的想法。那是处理模特世界的**唯一方法**。你不能把它视为个人攻击！**这不针对个人！**


    我和你们中的许多人一样，不得不处理从女孩时期就开始的问题。这可能是家人说的一句话，或者是在你听到某人谈论你时，而他们并不知道你在听。


    因为父母离婚，我有太多的的问题了。我确实觉得是我的错（尽管事实如此）。当我爸爸谈论美丽的女性时，我开始对自己的外表感到不安全。我总是想，外表是否真的有那么重要。我也知道我对其他事情感兴趣；而不仅仅是我的外表。我想变得聪明，为自己创造一个美好的生活。


    长得好在人生中只能让你进步，然后你必须向他人展示，除了第一眼看到的，你还有更多东西。如果你不在其他领域成长——如果你只关注肤浅的事物——那么你的回报将只有这些。


    带着这种念头，我从很小就开始阅读自助书籍（像这本这样的）。我积极寻找那里任何有用的信息，以更好地理解我正在思考或经历的一些事情。


    我并不总是告诉家人我所面对的事情，因为我天性上是一个非常注重隐私的人。我把大多数事情留在了心里。我以为我可以自己解决。但并不是每个人都能自己做到。在几乎


    ## 110 第六章 姐妹情


    在几乎在所有情况下，与他人一起处理想法、问题和困难，比试图独自征服一切要更好也更有效。（我读了所有关于自尊和如何获得它的书。我意识到我可以拥有它，并学会了获得它的技巧，就像你现在学习的一样！）


    我学会培养自己的自尊的方法是珍惜上帝赋予我的天赋和才华。我决定感激我所拥有的，而不是关注我所没有的。


