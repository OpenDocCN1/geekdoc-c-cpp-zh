    * You know what past-due notices look like

    * You get an overdue balance on a credit card statement

    * You avoid opening letters

    * You rarely keep a running balance in your checkbook


    # ## Getting Out of Debt


    There are two great ways to change your debt load and debt/income ratio: cut spending
    and bring in more money.


    Cutting spending can be the fastest way to reduce debt load, unless additional
    work and income are readily available. Think of it as surgery for your money management.
    But as you heal with better financial health, you will probably also notice that
    your attitude, relations with others, emotions, and sense of humor improve too.


    You do not have to keep adding to your debt load by continuing to buy stuff. Remember,
