    # 184 CHAPTER NINE To Eat Or Not to Eat


    # Cut the Fast Food


    If there is one thing in your diet that you absolutely do not need, it is fast
    food! Sure, it has its level of convenience for when you are on the run, but the
    consequences far outweigh the benefits it might offer.


    The fact is that fast food just does not have the nutrition that you need in a
    well-balanced diet, but it does have an awful lot of other elements that you should
    never put into your body.


    These include chemicals such as preservatives and flavor enhancers, sugars, sodium
    (salt), as well as an unbelievably high amount of trans-fats, one of the leading
    contributors to heart problems and obesity across the country.


    There really is not any excuse for eating fast food. There are so many other wonderful
    foods out there that can be just as quick and easy to eat. It is more a matter
    of breaking the habit of going for the burger, fries, soda, than actually finding
    something tasty and convenient.


    The trouble usually starts in school. They offer fast foods because they are cheap
    and popular among the students. However, this sets up bad eating habits for those
    kids for the rest of their lives! This is why many schools across the country
    and around the world are re-thinking their cafeteria strategies. It just makes
    good sense in the long run.


    Do yourself a favor and break the fast-food habit in your life. Bring your own
    lunches, and keep them interesting, so that the temptation is never there to go
    elsewhere.


    Alternatively get together with a group of five of your work-friends and have
    each of you supply a healthy lunch one day per week. This way, you will only have
    to make lunch once per week. You will have a surprise the other days, and you
    will always have something good and healthy to eat!


    # Balanced Eating


    Of course, if you do not know what to buy, it will be hard to build a healthy
    diet for yourself. The key is not necessarily what you eat—it is what is in'
  - '[PAGE 200]


    # BEAUTIFUL AMBITION 185


    you eat. You need to eat moderate portions, and know what your body needs, and
    how much it is taking in.


    There has been an awful lot of press about cutting carbohydrates, cutting fats,
    and other efforts to lose weight. When it comes to maintaining a healthy diet,
    though, the key is not cutting things out; it is eating the right things in the
    right amounts, frequency and portions.


    Making the decision to cut out certain things can be good for you as long as you
    understand why you are cutting them out and what you are replacing them with.


    Your body needs certain basic building blocks, like fats, carbohydrates, and proteins
    in order for your body to be at its optimal health. This needs the input to give
    you its very best. Unfortunately, so many of us have terrible eating habits that
    we were raised with, that it becomes very difficult to change and we find that
    we lack the self-discipline to try something we know is good for us in the long-term.
    This is exactly why many people yo-yo diet, going up and down in weight, with
    no real results.


    What you need to do is make better food choices during the week, ensuring that
    you are cutting out those carbohydrates and added fats that are going to lead
    to more over-eating and binging.


    Drink lots of water and stay hydrated, take your supplements, get your greens
    every day, eat several pieces of fresh fruit and lean proteins on your menu.


    Then on the weekends, you can reward yourself with a great meal out with a loved
    one or friends and enjoy a glass of wine, or a dessert. Maybe you love sushi.
    Well then, go for it! All in moderation of course! You have been good all week
    long, now you can indulge, a little bit at least. You see, the key here is watching
    yourself and being good most of the time. I am not a perfect eater all the time,
    not by any stretch of the imagination, but we can all try and make some small
    changes that add up over time on the positive side.


    I try to eat close to nature as possible during the week, like having lots of
    veggies and salads with homemade dressings made with fresh lemon, olive oil, and'
  - '[PAGE 201]


    # 186 CHAPTER NINE To Eat Or Not to Eat?


    a bit of mustard. I mix it up and I love the taste. I also make sure that I eat
    oatmeal three days a week in the mornings and the other days I have egg white
    omelets, with veggies and soy cheese.


    Then on the weekends I splurge (within reason and in moderation) and I enjoy myself.
    If I want chocolate, I have it. But I do not eat tons of it at a time. I have
    one or two bites and that is enough for me. I love meat! I wish I could be a vegetarian,
    but for that does not work. I feel stronger and I have more energy when I eat
    meat.


    So, I try to have red meat times a month. The rest of the time I focus on lean-meats
    like turkey, fresh fish (all types) and organic chicken. Here is what I stay clear
    from: white and refined flours, that includes all baked goods. Now granted, I
    will cheat now and again and have cookies (come on, give me a break, I am human
    too!) I am talking about the 90 % of the time that I am a clean eater.


    Instead of eating carbohydrates loaded with sugar and starch like white rice and
    mashed potatoes, I try to eat whole-grains and brown rice and even then, I eat
    small portions of these things. To tell the truth, you really do not need a lot.
    I use the “hand-rule” when it comes to portion-size and here is the rule: take
    a look at your hand. The inner part, called the palm of the hand, determines how
    much protein you need at a meal. Next are your fingers. They determine your carbohydrate
    intake—that means both veggies and whole grains—so as you can see, you do not
    need a lot here. Your thumb represents the fat that should be in your meal.


    With this in mind, use your hand as a cheat-type guide and a visual reminder when
    you sit down for your meal or load your plate. If your meal is bigger than your
    hand, take half of it home and eat it later. If you do this, you will lose weight
    and keep your weight stable without going up and down. These are simple things
    that I do to keep myself lean and strong.


    It is not enough to think, you have to be healthy as well. If you do not have
    enough energy and find that you are always tired, most of the time your diet'
  - '[PAGE 202]


    # BEAUTIFUL AMBITION 187


    is the problem. You are eating all the wrong things. Take this opportunity to
    turn those bad eating habits around today.


    Clean out your fridge and pantry. Donate the food that you have or give it away.
    Stop buying food from the market where you currently shop; instead find a new
    health-food store to shop at that can offer you great treats that are healthy.


    Believe me, these stores have all the food in them that you will need and you
    will not be tempted by things that you do not really need. Sometimes you change
    your routine to get the desired results that you want.


    Now let us take a closer look at what these foods are all about and how you can
    incorporate the good ones versus the bad ones, putting the right things in and
    leaving the wrong or harmful ones out of your diet.


    # Fats


    Dietary fats are important for good health. This may sound a bit far-fetched,
    if not outright strange, but it is true. As far back as 1929, dietary fats were
    found to be “essential” in our diet. Balance is the key to making fats work for
    you and your body. There are two important considerations:


    +   Consume a variety of good fats. These include unrefined oils, such as extra
    virgin olive and safflower and sesame. Fats from butter, meats, eggs and dairy
    are good as well, as long as they are part of a balanced diet.


    +   Avoid hydrogenated (or partially hydrogenated) fats. These include margarine
    and many of the fats used to make breads and other products (read labels). Hydrogenated
    fats can disturb the metabolism of fats in the body. Also, fried or cooked fats
    should be avoided for similar reasons.'
  - '[PAGE 203]


    # 188 CHAPTER NINE To Eat Or Not to Eat?


    Why are fats so good? Here are ten reasons:


    +   1. Source of energy


    +   2. Essential to supporting the hormonal system


    +   3. Natural insulator


    +   4. Supports and protects your body from strain and damage


    +   5. Vital for proper prostaglandins cell function


    +   6. Regulate your vitamins and minerals


    +   7. Essential to your health and that of your baby during pregnancy and lactation


    +   8. Help protect your body against the harmful effects of x-rays


    +   9. Important to proper digestion


    +   10. Tastes good, making a meal worth eating!


    Fat is important for good health. Dietary fats, however, must be balanced, to
    include a variety of natural oils, butter, meats, eggs and dairy in moderate amounts.


    Many people avoid fats because of misinformation and fear. As time goes on, the
    "low fat" trend will disappear, as much research has already shown the benefits
    of this necessary, healthy substance.


    # Carbohydrates


    Carbohydrates take the form of sugars, oligosaccharides, starches and fibers.
    It is one of the three major macro-nutrients which supply the body with energy
    (fat and protein being the others).


