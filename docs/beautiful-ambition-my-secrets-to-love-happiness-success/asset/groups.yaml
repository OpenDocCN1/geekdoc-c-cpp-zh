    # 206 CHAPTER TEN Full Circle


    # 30-DAY TRIAL UNDERTAKING:

    A GETTING HEALTHIER ADVENTURE


    The true test of any new lifestyle habit that you are trying to develop is in
    the "30-day trial" concept. Just like "as seen on TV" products that often advertise
    their 30-day guarantee so that you can test the product without risking losing
    your money if it''s a lemon, you can also try new self-improvement habits for
    30 days BEFORE you go all-out, go with gusto, for the full version!


    The one GOLDEN rule however is: for those thirty days, you need to dedicate yourself
    to your techniques and goals, and not cheat once. (After all, you are doing this
    for you! If you cheat on your self-improvement efforts, you are only cheating
    yourself out of the results that you want so badly!)


    Remember, it is the first few weeks of establishing a new habit—whether it is
    eating healthy, starting an exercise program, writing in a journal, or sticking
    to a financial budget—those are the most difficult. By sucking it and sticking
    to it for the first 30 days, you will already be past the hardest part and will
    have built up some inertia, which makes it much easier to keep going! Take my
    word for it... it gets easier!


    The reality is that we do really self-sabotage or trip ourselves up sometimes.
    We psyche ourselves out of getting started, by mentally thinking about the change
    as something permanent—BEFORE we have even begun. It seems too overwhelming to
    think about making a big change and sticking with it every day for the rest of
    your life. This holds especially true when you are still habituated to doing the
    opposite.


    The real catch-22 is: The more you think about the change as something permanent,
    the more you stay put!


    But if you thought about making the change only temporarily—say for 30 days—and
    then you are free to go back to your old habits? That does not seem so hard anymore.'
  - '[PAGE 222]


    Exercise daily for just 30 days (nothing extreme, even a walk will do), then,
    use what you have learned about your exercise habits to form a schedule that works
    best for you.


    Stick to healthy meals for 30 days, then when you have discovered that there are
    lots of tasty, healthy options out there that do not take much time to prepare,
    make some decisions for treating yourself every now-and-again.


    Write in your journal for thirty minutes every day for 30, then you will know
    how much time you will need for writing in your journal, and when you enjoy it
    the most.


    Could you do it? It still requires a bit of discipline and commitment, but when
    you set a goal of only 30 days to start—as a trial run—it is not nearly as daunting
    as making a permanent change. Any perceived deprivation is only temporary.


    If it will help you, you can also count down the days to achieving your goal.
    And for at least 30 days, you will gain lots of benefit. It is not so bad. You
    can handle it. It is only one month out of your life.


    Now, if you actually complete a 30-day trial, what is going to happen? First,
    you will go far enough to establish it as a habit, and it will be easier to maintain
    it than it was to begin.


    Secondly, you will break the “addiction” cycles and entrapments of your old habit
    during this time.


    Thirdly, you will have 30 days of success behind you, which will give you greater
    confidence that you can continue.


    Finally, you will gain 30 days worth of results, which will give you practical
    feedback on what you can expect if you continue, putting you in a better place
    to make informed long-term decisions.


    Therefore, once you hit the end of the 30-day trial, your ability to make the
    habit permanent is vastly increased. But even if you aren''t ready to make it
    permanent, you can opt to extend your trial period to 60, or 90 days.'
  - '[PAGE 223]


    # 208 CHAPTER TEN Full Circle


    The longer you go with the trial period,

    the easier it will be to lock in the new habit for life.


    Another benefit of this approach is that you can use it to test new habits where
    you really are not sure if you would even want to continue for life. Maybe you
    would like to try a new healthy diet, but do not know if you would find it too
    restrictive. In that case, do a 30-day trial and then re-evaluate.


    There is absolutely no shame in stopping after 30 days if you know the new habit
    does not suit or help, or work for you. Odds are that you will not need to stop
    altogether, you just need to have another look at the way you are approaching
    the new habit, and do it in a different way. Your way. No harm, no foul!


    This 30-day method works best for daily habits, but there is nothing that says
    you cannot it for a habit you want to build 3-4 times per week, such as a cardio
    workout. It can also work well if you apply it daily for the first 30 days and
    then cut back thereafter. This is what I would do starting a new exercise program,
    for example. Keep in mind that daily habits are the easiest to establish, so it
    is always better to start out with a daily habit that you can cut back on, instead
    of trying to build up, from fewer days per week.


    Here are some examples of tasks that you can take on every day, in order to build
    new habits that will help you with your self-improvement and journey to a better,
    healthier you, body and lifestyle:


    +   - Eat breakfast


    +   - Start each day by telling yourself—out loud—what a great day it will be


    +   - Write in your journal


    +   - Spend quality time with yourself


    +   - Take steps to get to know yourself better'
  - '[PAGE 224]


    # BEAUTIFUL AMBITION 209


    +   * Work on your latest goal

    * Phone someone in your support group for a good, comfortable talk

    * Try something new

    * Shower, do your hair, and put on make-up

    * Eat a very healthy meal

    * Go for a walk

    * Do Yoga/Pilates


    Certainly, there will be dozens of other things that you can do to improve your
    life in 30 days, based on what you have discovered in this book. The power of
    this approach lies in its simplicity. Even-though doing a certain activity every
    single day may be less efficient than following a more complicated schedule—weight
    training is a good example because adequate rest is a key component for success.


    You will often be more likely to stick with the daily habit. When you commit to
    doing something every single day without exception, you cannot easily rationalize
    or justify missing a day, nor can you promise to make it up later by reshuffling
    your schedule.


    My best advice: give trials a try!


    # Positive Changes


    Of course, you will only be able to benefit from your 30-day trial periods if
    you have prepared properly. Give yourself a month—call it a 30-day pre-trial period—to
    get yourself and your life set for your habit-building trials.


    This time can include anything you need to get done to ensure the success of your
    trial habits.'
