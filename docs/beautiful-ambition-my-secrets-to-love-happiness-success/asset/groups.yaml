    # 190 CHAPTER NINE To Eat Or Not to Eat?


    # Proteins


    The building blocks of protein are amino-acids. When protein is eaten, your digestive
    system and processes break it down into amino-acids, which pass into the blood
    and then are carried throughout the body. Your cells can then select the amino-acids
    they need for the construction of new body tissue, anti-bodies, hormones, enzymes,
    and blood cells.


    Protein is not one substance, but literally tens of thousands of different substances.
    The essential amino-acids must be consumed in the diet, because the body does
    not make them.


    The complete proteins that contain the eight essential amino-acids come from meat,
    poultry, fish, eggs, milk—all dairy, cheese and soy. They are basically anything
    that comes from the animal side of the spectrum. Nuts and legumes (peas and beans)
    contain some but not all of the essential amino-acids; (these are known as incomplete
    proteins).


    Proteins are necessary for tissue repair and for the construction of new tissue.
    Every cell needs protein to maintain its life. Protein is also the primary substance
    used to “replace” worn-out or dead cells:


    +   - Most white blood cells are replaced every ten days.

    - The cells in the lining of the gastrointestinal tract and blood platelets are
    replaced every four days.

    - Skin cells are replaced every 24 days.

    - More than 98 percent of the molecules in the body are completely replaced each
    year!


    Your muscles, hair, nails, skin, and eyes are made of protein. So the cells that
    make up the liver, kidneys, heart, lungs, nerves, brain, and your sex glands.
    The body’s most active protein users are the hormones secreted from the various'
  - '[PAGE 206]


    glands—thyrox from the thyroid, insulin from the pancreas, and a variety of hormones
    from the pituitary—as well as the soft tissues and hard-working major organs and
    muscles. They all require the richest stores of protein.


    It is important to understand the value of protein in our diet. Protein is the
    best nutrient to eat in order to maintain an even blood sugar level because it
    is metabolized over a long period of time. Protein can be converted to glucose
    if need be, to fuel our engines in a manner of speaking.


    # Things to Help You Feel Great


    +   25% Water (Reduce caffeine intake and try to eliminate soft drinks and fruit
    juice).


    +   25% Strength training (To stay toned and young—your bones will thank you later
    in life and you will burn more calories per hour when your body has more lean
    muscle mass).


    +   25% Cardiovascular exercise (You need this to keep your heart healthy, burn
    calories and keep up your level of endurance. This should be done three to five
    days a week, for a minimum of 30 minutes every time. If you want to lose weight,
    I recommend six days a week for 45-60 minutes: walking, running or cycling. My
    personal favorite is kick-boxing).


    +   25% Rest and recovery (This should be the most relaxing, quality time you
    give to yourself. You need to get a solid eight hours of sleep and your muscles
    need the recovery time. This is a great time to treat yourself to some time away
    or at a spa, or at the very least a hot bubble bath and salt rubdown, which is
    inexpensive and something you can do to yourself. Your skin will feel like a million
    bucks!)'
  - '[PAGE 207]


    # 192 CHAPTER NINE To Eat Not To Eat


    A regular routine of all of the above will add balance to your life and help you
    to feel your absolute best. Putting yourself first is not selfish at all. If you
    take care of YOU (for once, as well as on a regular basis), you will do a better
    job of taking care of your family!


    I also like to incorporate a relaxing workout like Yoga or Pilates into my schedule,
    at least once or twice a week. This will help with mental focus and give you time
    to reflect on your goals. I sometimes go with a friend or my mom or sister, giving
    us some special “girl-time” together.


    Regular exercise and a healthy diet undoubtedly help to make your skin glow, but
    there are other things you can do to help keep your skin clear, smooth and soft.
    (For those of you reading this who may be in your twenties, I urge you to start
    taking care of your skin now. If you develop good habits now, you''re sure to
    reap the rewards of your extra efforts as you!).


    # Healthy Inside and Out


    Like everyone, I love a good tan, I am also aware of and concerned about risks
    like sun damage. Thank goodness, there are so many great selftanners on the market
    that you really do not have to spend time in the sun to get great color.


    When looking for a self-tanner, my advice is to purchase a product that goes on
    color, so you can see if you have missed any spots.


    I recommend using an exfoliating product in the shower before you apply the self-tanner.
    You can use a salt or sugar scrub at any department store, drugstore or even health-food
    store. They make some with great fragrances. (To save money, mix your own with
    equal amounts of sea salt and baby oil. It works wonders!)


    I also use a bristle brush on my skin for increased circulation. This is especially
    helpful if you sit at a desk all day. You will need something to create extra
    circulation in your hips, thighs and bottom. Make sure you brush your skin in'
  - '[PAGE 208]


    # BEAUTIFUL AMBITION 193


    upward motions going toward your heart and keep the brush dry. I like to do this
    before I get in the shower and exfoliate. Do this and your skin will feel baby
    soft. After exfoliating, you are ready for the self-tanner and are just minutes
    away from a deep, dark tan.


    I use a self-tanner twice a week, and to avoid dry skin I always remember to moisturize
    my body every evening with a creamy lotion rich in emollients, like avocado, vitamin
    E and cocoa butter.


    Now, let us talk about your hands and feet. Whether you do them at home or go
    to a salon, manicures and pedicures are a must! That does not mean just changing
    the polish. cuticles, nails trimmed and filed, and your feet always looking sandal-ready.


    As I said before, men love soft, sexy feet. I make sure that I put lotion on my
    hands and feet every night. In fact, I apply hand every time I wash my hands.
    Keep a small tube in your purse. This will help keep your hands looking young.
    Getting your nails and toes done is also a great way to pamper yourself! Indulge
    and splurge a little!


    If you are blessed with perfect teeth, then you should do everything possible
    to keep your smile beautiful. I make sure that I get my teeth cleaned every six
    months and I floss daily. There are so many teeth-whitening products on the market
    today, in all price ranges, that there really is no excuse for your smile not
    to be bright. A beautiful smile is something people will always remember about.


    Remember that looking and feeling your best is a combination that comes from feeling
    good BOTH on the inside AND taking the steps that will keep your physical body
    healthy and fit. If you do these things, then you will also feel good about yourself
    on the outside. Take the steps that are outlined this chapter and be the best
    you possible.


    Below are some of my favorite recipes... if you do not know how to cook, this
    is a great time to learn! Like you, I also love eating out, but it is very difficult
    to maintain your weight if you are eating out too often.'
