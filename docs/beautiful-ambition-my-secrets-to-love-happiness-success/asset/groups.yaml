    - 今天的女性必须投入 100% 的精力，才能维持她们忙碌且多任务的生活方式。这 100% 由水分、力量训练、心血管运动以及休息和恢复组成。


    ## 宏伟雄心 203


    - 照顾身体的外表与照顾身体内部同样重要。建立一套健康的卫生和个人护理习惯，让你自己感觉更好、看起来更佳。

    - 健康饮食并不困难，也不耗费时间。只要你有正确的食谱，它并不贵。购买一两本非常棒的健康食谱书，享受生活中最好的部分。


    ## 第 10 章


    ## 圆满


    > “生命中唯一不变的是变化。”

    > 弗朗索瓦·德·拉·谢福古德


    你现在已经学习了许多关于为了充实生活而可以采取的关键步骤，从发现你是谁、知道你生活想要什么，到过健康的生活方式，甚至是财务管理。


    但你如何将所有这些概念转化为一个你实际上可以使用的计划呢？


    这才是关键问题，是我们需要做的核心：**协同效应！** 将这一切都整合在一起。


    这就是本章的全部：将你所学的一切应用到你的生活中，成为你想要成为的那个快乐、健康且全面的人。


    ## 206 页 第十章 圆满


    ## 30 天试验计划：一场通往健康的冒险


    你正在尝试培养任何新生活方式习惯的真正测试在于“30 天试验”这个概念。就像那些“电视购物”的产品一样，它们经常打出 30 天保证，让你在测试产品时不必担心买到劣质而损失资金；你也可以在全力以赴、热情投入执行完整版**之前**，尝试
    30 天新的自我提升习惯！


    然而，有一条**黄金法则**是：在这三十天里，你需要全身投入到你的技巧和目标中，不要作一次赖。（毕竟，你这样做是为了你自己！如果你在自我提升的努力上作弊，你只是在欺骗自己，让你失去了如此渴望的结果！）


    记住，建立新习惯的最初几周是最困难的——无论是健康饮食、开始运动计划、写日记还是坚持预算——这些都是最艰难的。只要坚持完前 30 天，你就已经度过了最困难的部分，并建立了一些惯性，这会让坚持下去变得容易得多！相信我的……它会变得更容易！


    现实情况是，有时我们在还没有开始之前，就在心理上把这种改变看作是永久性的，从而自我破坏或绊倒了自己。一一要做出巨大的改变并在余生的每一天都坚持下去，似乎太太大了。当你仍然习惯于做相反的事情时，这一点尤为如此。


    真正的两性困境是：你越是把这种改变看作是永久的，你就越停不下来！但如果你只考虑做出改变——比如持续 30 天——然后你就可以回到旧习惯？这听起来就不那么难了。


    如果有帮助的话，每天运动只需 30 天（不需要很极端的，即使是散步也可以），然后利用你所学到的知识制定一个最适合你的日程。


    坚持 30 天健康饮食，然后你就会知道写日记需要多少时间，以及你何时最享受它。这仍然需要一些自律和投入，但当你把目标设定为只开始 30 天——作为试运行时——它不像做出永久性改变那样令人生畏。


    现在，如果你真的完成了 30 天的试验，会发生什么？首先，你建立的习惯已经足够稳固，维护起来比开始时更容易。其次，你会在在此期间打破旧的习惯循环。第三，你将拥有三十天的成功经验，这将带给你更大的信心继续下去。最后，你将获得
    30 天的成果，这将为你对于如果继续下去可以期待什么提供实际反馈，让你处于更好的位置做出明智的长期决策。


    因此，一旦你达到了 30 天试验的终点，你将习惯永久化的能力将大大增加。即使你还没有准备好将其永久化，也可以选择将试验期延长到 60 或 90 天。


    ## 208 页 第十章 圆满


    试验期持续得越长，越容易将新习惯锁入终身。


    这种方法的另一个好处是，你可以用它来测试那些你并不确定是否想要长期为之的新习惯。也许你想尝试一种新的健康饮食，但不知道是否会觉得它太刻板。在这种情况下，进行
    30 天的试验，然后重新评估。


    如果你知道新习惯不适合或对你不起，在 30 天后停止完全没有耻辱。很有可能你不需要完全停止；你只需要重新审视你接触新习惯的方式，并用不同的方式去做。用你自己的方式。没害！


    这种 30 天方法对于日常习惯效果最好，但并没有规定你不能对你每周想要建立的 3-4 次的习惯使用它，例如有氧运动。如果你在前 30 天每天应用，之后再减少，效果也很好。例如，这就是我开始一项新运动计划时的做法。记住，日常习惯是最容易建立的，所以从一个以后可以减少的每日习惯开始，总是比尝试从每周少数几天开始要好。


    以下是一些你每天可以承担的任务示例，以建立新习惯，帮助你实现自我提升以及通往更好、更健康的身体和生活方式的程：


    - 吃早餐

    - 每天开始时，大声地对自己说这将会是极棒的一天

    - 写日记

    - 与自己共度高质量的时光

    - 采取步骤以更好地了解自己


    ## 宏伟雄心 209


    - 努力你的目标

    - 给支持小组的某人打电话，进行一次愉快舒适的交谈

    - 尝试新事物

    - 洗澡、做发型、化妆

    - 吃一顿非常健康的餐

    - 去散步

    - 练习瑜伽/普拉提


    当然，根据你在这本书中的发现，还有几十种其他你可以在 30 天内做来改善生活的事情。这种方法的力量在于它的简单。尽管每天做某项活动可能比遵循更复杂的日程表效率低——力量训练就是一个很好的例子，因为充足的休息是成功的关键要素。


    你通常更有可能坚持日常习惯。当你承诺每天都做某事而毫无例外时，你很难为漏掉一天寻找借口。


