    # # Money Management that Makes Cents


    > "Happiness is not in the mere possession of money; it lies in the joy of achievement,
    in the thrill of creative effort."


    —Franklin D. Roosevelt


    From budgeting and saving, to investing and spending, financial decisions are
    about weighing your choices and making informed decisions.


    Managing your money can seem confusing and overwhelming at first glance, but if
    you take it step-by-step, you can actually understand personal finance better
    than you ever thought possible.


    For many of you reading this, you may already have a good handle on your finances.
    However, I know that there are many things about managing'
  - '[PAGE 141]


    # 126 CHAPTER SEVEN Money Management that Makes Cents


    your money that all women should learn but that simply is not taught in school.
    This would include things like balancing your checkbook, investing, and other
    reasonable ways to make sure you are financially comfortable as you can be.


    It simply does not make sense for you to rely one someone (or anyone!) else—such
    as a boyfriend or husband—to take care of these matters. Sure, he may be in charge
    of the finances, but it is up to you to understand them as well, to ensure that
    you are a complete and whole person able to take care of herself (independently,
    when it matters!). My advice: Get wise, be smart, and take the time to learn all
    you can about finances!


    Let us get into one of my favorite success stories about how this incredible brilliant
    writer hit it big!


    # A GREAT EXAMPLE:

    JOANNE (JK) ROLLING


    Joanne Rowling is the famed author of the Harry Potter series of fantasy books
    under the pen name J.K. Rowling. She is not only a celebrity author, but she has
    also gained international attention, won multiple awards, and sold over three
    hundred million copies worldwide. In February 2004, Forbes magazine estimated
    her fortune at £576 million (just over US$1 billion), making her the first person
    ever to become a $US billionaire by writing books.


    By December of 1994, Rowling was still mourning her mother who died four years
    earlier. She had just gone through a divorce and moved to Edinburgh, Scotland
    with her daughter, to be near her sister.


    Unemployed and living on state benefits, she completed her first novel, doing
    some of the work in local Edinburgh cafés. In fact, it is rumored that she wrote
    in local cafés in order to escape from her unheated flat, but in a 2001 BBC interview,'
  - '[PAGE 142]


    # BEAUTIFUL AMBITION 127


    Rowling remarked, “I am not stupid enough to rent an unheated flat in Edinburgh
    in midwinter. It had heating.”


    In 1995, Rowling completed her manuscript for Harry Potter and the Philosopher’s
    Stone, an old manual typewriter. Upon the enthusiastic response of Bryony Evans,
    a reader who had been asked to review the first three chapters of the book, the
    Fulham-based Christopher Little Literary Agents agreed to represent Rowling in
    her quest for a publisher. The book was handed to twelve publishing houses, all
    of which rejected it. A year later, she was finally given the green light (and
    a £1500 advance) by the editor Barry Cunningham, from the small publisher Bloomsbury.


    Although Bloomsbury agreed to publish the book, Cunningham claims he advised Rowling
    to get a day-job, as she had little chance of making money in children’s books.


    Soon after, Rowling received an £800 grant from the Scottish Arts Council to enable
    her to continue writing. The following spring, an auction was held in the United
    States for the rights to publish the novel, and was won by Scholastic Inc, who
    paid Rowling more than $100,000. Rowling has said she “nearly died” when she heard
    the news.


    In June 1997, Bloomsbury published Philosopher’s Stone with an initial print run
    of only 1000 copies, 500 of which were distributed to libraries. Today, such copies
    are valued at between £16,000 and £25,000 each. The Queen has honored Rowling
    by making her an Officer of the Order of the British Empire.


    The last three volumes in the series have all been the fastest-selling books in
    history, grossing more in their opening 24 hours than blockbuster films. Six of
    her series earned the Guinness World Records Award, for being the fastest selling
    book ever. In June 2006, the British public named Rowling “the greatest living
    British writer”.


    Harry Potter has made Rowling a well-known and a very successful author, but after
    Rowling finishes the final Harry Potter book, she plans to continue writing.'
  - '[PAGE 143]


    # 128 CHAPTER SEVEN Money Management that Makes Cents


    Rowling declared, in a recent interview, that she will most likely not use a pename,
    as the press would quickly discover her true identity.


    In 2001, the UK fundraiser Comic Relief asked three bestselling British authors
    to submit booklets related to their most famous works for publication. For every
    pound raised, a pound would go towards combating poverty and social inequality
    across the globe. Rowling’s two booklets, Fantastic Beasts and to Find Them and
    Quidditch Through the Ages, are ostensibly facsimiles of books found in the Hogwarts
    library, and are written under the names of their fictional authors, Newt Scamander
    and Kennilworth Whisp. Since going on sale in March 2001, the books have raised
    £15.7 million ($30 million) for the fund. The £10.8 million ($20 million) raised
    outside the UK has been channeled into a newly created International Fund for
    Children and Young People in Crisis. She has also personally given £22 million
    to Comic Relief.


    Rowling has contributed money and support to many other charitable causes, especially
    research and treatment of multiple sclerosis, from which her mother died in 1990.
    This death heavily affected her writing, according to Rowling. In 2006, Rowling
    contributed a substantial sum of money, towards the creation of a new Centre for
    Regenerative Medicine in Edinburgh.


    In January 2006, Rowling went to Bucharest to raise funds for the Children’s High
    Level Group, an organization devoted to enforcing the human rights of children,
    particularly in Eastern Europe. On August 1st and 2nd, 2006, she read alongside
    Stephen King and John Irving, at Radio City Music Hall in New York City. Profits
    from the event were donated to the Haven Foundation, a charity that aids actors
    left uninsurable and unable to work, and the medical NGO Médecins Sans Frontières.


    J.K. Rowling is a tremendous example of dedicating yourself to doing what you
    love, sticking to it with the right goals, and having the right management on
    your side, CAN help you to achieve all of your financial objectives. She also
    shows that money IS NOT everything! Though it allows quite a bit of freedom, she
    intends to continue writing—thus doing what she has always bested. Furthermore,
    she has not forgotten to spread her good fortune by contributing to worthy causes.'
