    # 132 CHAPTER SEVEN Money Management that Makes Cents


    # GOALS


    Remember back in chapter 2 when we discussed identifying your goals and then going
    after them? Well, managing your money has a lot to do with making goals and then
    setting up a strategy for achieving them. Remember, write down everything you
    do to make it concrete and defined. It will increase your chances chances of succeeding
    many times over.


    The only thing about money is that there are some obstacles involved that mean
    that you need to decide what things you need, like food, and a roof over your
    head, and things that you want, like a great car.


    # The Planning Process


    Would you like to own your own home one-day? Would you like to buy a car? Everybody
    has a dream that requires money to help make come true. The difference between
    those people who realize their dreams and those that do not is: those who do have
    a plan. Here''s a four-step model to help you make your dreams come true. Writing
    things down is the unwanted rule of thumb, for this entire process.


    Assess Needs—Your wants are anything that may make your life easier or more enjoyable,
    but which you do not need to live. You may want a new plasma screen TV for your
    bedroom, for example, but you do NOT NEED one. You do need a winter coat, and
    a bed. Without these things, your life would be very difficult. Just make sure
    the coat you buy is not the really cute one that will only use a few times a year
    because you live in sunny California near the beach! Opt for something that you
    can afford today, and remember that once you hit your financial goals, you can
    splurge on hot coat and matching boots. It is all about your timing and if you
    really want those things, you will work smarter and harder to get them.


    So make a list of everything that would be good to have in your life, and write
    it down. Next, divide the list. Go through every item, and mark it with a “W”
    (for want) or an “N” (for need).'
