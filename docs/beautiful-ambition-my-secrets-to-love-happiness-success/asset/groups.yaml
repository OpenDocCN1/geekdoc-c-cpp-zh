    # Nutritional Analysis:


    - 334 calories

    - 23 g. protein

    - 26 g. carbohydrates

    - 15 g. fat


    # Tangerine and Orange Yogurt:


    - 1 cup light orange-flavored yogurt

    - 2 medium tangerines, peeled and segmented


