    # 28 CHAPTER TWO I Want it All and I Want it Now


    Naturally, the above-mentioned example is not the only words you can use for self-talking/self-speak
    or inner-monologue. You should make up your own words to repeat that work for
    you, for your personal mantra, for any bad situation that you can think of.


    Be honest with (i) yourself and (ii) about ANY ''issue'' that you may face, whether
    positive or negative. This is the where you can be real and truthful. No one will
    judge you, because this is a completely private matter. Therefore, you can think
    about the things that you need to hear. Make a list, and repeat it to yourself
    every day. Love yourself and start building your own self-esteem. This positive
    self-talk is also not limited to bad situations. It can make advantageous positions
    even better.


    When coming up with positive self-talk phrases, think of a good situation as well
    as one of the worst situations that you can come up with. As you think each situation,
    try to create two or three phrases that can encourage you to do much better. Next,
    test them out when you take risks and put your goal into action to see if/how
    they work.


    If you find that they are NOT quite doing the trick, just keep thinking up new
    phrases and practice them, until you discover the best one for you.


    If you are NOT yet using positive self-talk, those people who are using it have
    substantial advantage over you. Only YOU can change this fact. These are the people
    who are taking advantage of a powerful universal reality: the spoken word.


    Every successful person in the world knows this, and therefore incorporates positive
    self-speak, enabling inner-monologue, into his or her ambitions in some form or
    another, because they know it works!


    # THE POWER OF VISUALIZATION


    Use the powerful tool of visualization to help you imagine with your minds-eye
    what your dreams and goals are... and then think about it all the time. Keep it
    front of mind.'
