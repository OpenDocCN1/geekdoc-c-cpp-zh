    # # Chapter 2


    # # I Want it All and I Want it All Now


    > > “Life takes on meaning when you become motivated, set goals and charge after
    them in an unstoppable manner.”


    > —Les Brown


    Experts and women like you share simple tips for landing whatever your heart desires,
    whether it''s comfy shoes or your share of the American pie. But sometimes knowing—really
    knowing—what YOU want, is the hardest part of all!


    What further complicates this process for all women, I think, is our capacity
    for empathy... our penchant for caretaking. Yes, the way we can''t seem to be
    truly satisfied unless we are doing something for someone else, someone other
    than ourselves.'
  - '[PAGE 27]


    # 12 CHAPTER TWO I Want it All and I Want Now


    I find myself wanting to save and rescue those around me and I always have to
    remind myself that I can only do so much and that the people I love are themselves
    responsible for their lives and their actions.


    This doesn''t, however, mean that you becoming unwilling to help when you can.
    Nevertheless, there is a big difference between helping a loved one out and trying
    to save or rescue them from their choices.


    Our generous nature is oftentimes the very best thing about us, but we run into
    trouble if this generosity turns into martyrdom and resentment. This is exactly
    when our good intentions toward those we love, deafen us to that quieter call
    of our own desires. We all have to stay focused on our dream(s) and understand
    that we count, and our own life matters also and very much so!


    Following a heart''s desire involves risks. Whether starting your own business,
    falling in love, writing fiction, running a marathon for the first time... You
    have to try your hand at it, and you have to be willing to fail.


    In my life I have had many "failed or less successful attempts", and to be really
    brutally honest, it truly makes the times much sweeter when I win or hit the mark,
    goal or target that I have set out for myself to achieve or out-perform.


    After all, how can I possibly write a book on reaching your dreams, if I do not
    understand the pain and disappointment that comes with failing or falling short
    of that very dream? Yes, it is that acknowledgement that empowers and engages
    others! Yes, it can and does happen to us all! However, they say, "It''s not how
    hard you fall it''s how you bounce back (I become the master of bouncing back
    and so will you!).


    Understand that life is about pressing on and finding the joy in the journey even
    though the journey is challenging, or the going gets tough. You can always find
    and see the positive in every situation. Believe me, by having this kind of attitude,
    you will become more inspired and motivated to work harder, despite any setbacks
    you may or may not experience.


    After all the soul-searching, second-guessing and the final banishment of lingering
    doubt, the execution of these plans can seem like the easy part.'
  - '[PAGE 28]


