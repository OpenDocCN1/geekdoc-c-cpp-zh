    # BEAUTIFUL AMBITION 29


    Take time every day to do this. Find a quiet space were you can be alone to dream
    and imagine everything you want for your life. (Maybe take out your personal journal
    and do a little doodling—creative self-expression).


    Focus on the dream becoming a reality. DARE TO DREAM! Fantasie about it. This
    is what I did throughout my childhood. I would go into my thought, possibilities
    and mind-world to then dream about a great life. Use that incredible imagination
    that you have to create your future! Once you know what you want to do, then you
    can focus on the details on how to make it happen!


    SIDE-BAR: An example where this worked exceptionally well for me would be... when
    I was out of high school I knew that I wanted to move to L.A. and I had a dream
    to be a model but I had to really focus on what steps I needed to take that happen.


