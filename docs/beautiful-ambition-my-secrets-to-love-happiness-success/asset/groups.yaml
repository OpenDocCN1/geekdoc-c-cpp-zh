    - One of the first steps to living a forgiving lifestyle is, to realize that life
    will happen, and it is not always great. Therefore, it is best to prepare yourself
    with actions and attitudes that will help you to accept that your life—and the
    people in it—will not always be perfect, but it does NOT mean that they are not
    worthy of forgiveness.

    - Forgiving will have an extremely positive impact on your relationships, family,
    and working life.


    # Personal Exercise


    Write down the names of the people who have hurt you and who you need to forgive.
    Below each name, leave some space for you to think about—and write down... the
    ways in which your life would be different if you decide right this second to
    forgive that person and move on with your life.


    # Chapter 6


    ## The Sisterhood

    Now, Now Ladies. Can We NOT ALL Just Get Along?


    > "For there is no friend like a sister, in calm or stormy weather, to cheer one
    on the tedious way, to fetch one if one goes astray, to lift one if one totters
    down, to strengthen whilst one stands." own> —Christina Rossetti


    Mean girls. Catfights. Queen bees...!

    There are many different ways to describe the way that women can be jealous, envious
    and all-round nasty to and with one another. By the time a young girl is eleven
    years old, she might very well already ‘know’ what type or category she falls
    into or would be stereotyped as.


    Is she the brainy one? The athlete? Or the popular one? These labels can very
    well directly affect both psyche and self-esteem, which girls can carry throughout
    their lives—including when they enter the workplace or find their first employment,
    or take a professional step towards realizing their dreams.


    Girls learn early-on that there are just so many good-looking boys to go around
    and that not everyone can be popular or beautiful. This is society''s messaging,
    however right or wrong this might seem.


    When resources are limited, we compete! That is the long-short of it. We fight
    very hard to get what we want. It creates competition around every corner, with
    envy and jealousy.


    If someone is at the top of the heap or ladder, it is so very hard to stay there.
    The pressure only keeps retching up in high school. Whoever is at the top, is
    always ready and watching for someone to knock them off their roost, so to speak.
    This is the ugly reality of the competitive culture of entitlement we are raised
    in and growing up to compete. There is no denying it. Ask anyone that has or is
    living it... we all know the truth.


    **FACT:** It is exactly this kind of thinking that can also easily turn us against
    one another. Leaving us to grow up thinking that women are the enemies in our
    lives, when reality is really our own insecurities that might be playing tricks
    on us. The very things that allow us to miss some of the greatest and most rewarding
    relationships possible potentially.


    As women, I think that we need to learn to support one another''s dreams and ambitions.
    That is NOT to say that you should trust every woman that you meet, because you
    simply cannot and should not!


    However, now that you are taking all of the steps in this book to better yourself,
    you will begin to read people and their very character early on. Armed with this
    knowledge, you can therefore more easily decide for yourself, if someone that
    you get to know, has the right motivations and intentions, as far as and where
    you are concerned.


    After all, as women, we share many of the same struggles and concerns and it would
    serve us better to help one another, rather then acting like prima-donnas, or
    drama-queens, gossiping and saying negative things that ultimately cut-down and
    hurt others (even ourselves in the process).


    Remember, what goes around comes around! Just as you want to have great women
    in your life that believe in you and want the best for you, you must start with
    yourself now, for once! Decide that you are going to start treating other women
    properly, with the respect they deserve. If you start this, you will begin to
    notice that positive people will migrate into your life and you will feel enriched
    and more confident in, around and with your friends.


    **FACT:** THIS CHANGE HAS TO START WITH YOU! You see, one of the main differences
    between men and women, is the way we think. Typically, women will choose friends
    with whom they feel an emotional bond, while men will select companions who share
    similar interests. In general, the emotional connection—while there in both cases—is
    expressed and pursued VERY DIFFERENTLY, in the friendships of men and of women.
    These discernly different drivers can easily be overlooked, misinterpreted or
    dismissed—wrongfully so!


