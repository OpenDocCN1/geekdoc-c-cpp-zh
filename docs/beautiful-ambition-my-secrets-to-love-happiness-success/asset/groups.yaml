    # 美丽的志 189


    - 含有适量碳水化合物的饮食可能有助于防止体脂堆积。

    - 淀粉和糖为身体活动提供易于获取的燃料（只需确保少量摄入即可）。

    - 膳食纤维是一种碳水化合物，有助于保持肠道功能正常。

    - 除了碳水化合物对身体的直接益处外，它们还存在于许多食物中，这些食物本身能为饮食带来许多其他重要的营养素。因此，建议从多种食物来源获取碳水化合物，以确保整体饮食含有充足的营养。

    - 中枢神经系统、肾脏、大脑、肌肉（包括心脏）正常运作需要碳水化合物。

    - 碳水化合物对于肠道健康和废物排出非常重要。

    - 同样重要的是，碳水化合物有助于食物的味道、质地和外观，帮助让饮食变得更加丰富和愉快。


    碳水化合物是我们需要量最大的宏量营养素。


    根据美国农业部（USDA）发布的饮食参考摄入量，热量的 45% - 65% 应来自碳水化合物。它们主要存在于淀粉食物（如谷物和土豆）、水果、牛奶和酸奶中。其他食物如蔬菜、豆类、坚果、种子和乡村奶也含有碳水化合物，但含量较少。


    各种形式的碳水化合物对你的健康都有好处。它们有助于控制体重，特别是与运动结合时；对于良好的肠道功能至关重要，也是大脑和活跃肌肉的重要燃料。


    ## 190 第九章 吃还是不吃


    ## 蛋白质


    蛋白质的构建块是氨基酸。当你吃蛋白质时，你的消化系统和过程会将其分解为氨基酸，氨基酸进入血液并运送到全身。然后你的细胞就可以选择它们构建新的机体组织、抗体、激素、酶和血细胞所需的氨基酸。


    蛋白质不是一种物质，而是字面上的成千上万种不同的物质。饮食中必须摄入必需氨基酸，因为人体无法产生它们。


    含有八种必需氨基酸的完全蛋白来自肉类、禽类、鱼类、蛋、牛奶——所有的乳制品、奶酪和大豆。它们基本上是任何来自动物谱系的的食物。坚果和豆类（豌豆和豆类）含有一些但并非所有的必需氨基酸；（这些被称为不完全蛋白）。


    蛋白质对于组织修复和构建新组织是必需的。每个细胞都需要蛋白质来维持其生命。蛋白质也是用于“替换”磨损或死亡细胞的主要物质：


    - 大多数白细胞每十天更换一次。

    - 胃肠道内壁细胞和血小板每四天更换一次。

    - 皮肤细胞每24天更换一次。

    - 身体内超过98%的分子每年都会完全替换！


    你的肌肉、头发、指甲、皮肤和眼睛是由蛋白质组成的。组成肝脏、肾脏、心脏、肺、神经、大脑和性腺的细胞也是如此。身体最活跃的蛋白质使用者是各种腺体分泌的激素——甲状腺的甲状腺素、胰腺的胰岛素以及垂体分泌的各种激素——以及软组织和高工作的主要器官及肌肉。它们都需要最丰富的蛋白质储备。


    了解蛋白质在我们饮食中的价值非常重要。蛋白质是维持稳定血糖水平的最佳营养素，因为它的代谢持续时间很长。如果需要，蛋白质可以转化为葡萄糖，可以说是为我们的引擎提供燃料。


    ## 让你感觉极佳的事情


    - 25% 水（减少咖啡因摄入，并尝试消除软饮料和果汁）。

    - 25% 力量训练（为了保持紧致和年轻——你的骨骼在以后会感谢你，而且当身体拥有更多瘦肌肉时，你每小时会燃烧更多热量）。

    - 25% 有氧运动（对于良好的肠道功能至关重要，也是大脑和活跃肌肉的重要燃料）。每周至少进行3-5次，步行、跑步或骑行。

    - 25% 放松活动（为了保持心理健康，我建议练习如瑜伽或皮拉提）。每周进行45-60分钟。

    - 25% 睡眠与恢复（身体最活跃的蛋白质使用者是各种腺体分泌的激素）。你需要每天保证8小时睡眠，这会让你感觉良好！


