    # 134 CHAPTER SEVEN Money Management that Makes Cents


    **SPECIFIC:** Smart goals are specific enough to move a person into action. For
    example


    **ATTAINABLE:** The steps toward reaching your goal need to be possible. For example,
    my budget must allow me to put aside enough money each week in order for me to
    meet my goal within one year.


    **RELEVANT:** The goal needs to make sense. You do not want to work toward a goal
    that does not fit your needs. For example, you do not need to save money for eighteen
    pairs of shoes!


    **TIME-RELATED:** It is important to set a definite target date. For example,
    the repairman says my refrigerator will not last another year. Therefore, I need
    to get my new refrigerator in the next eight months.


    # Balancing Your Checkbook


    It is important to keep track of all the activities in your account in your check
    register (the little notebook that comes with your checks). This keeps you organized,
    allows you to monitor your own financial activities more actively, and lets you
    spot every single inaccuracy that pops up from bank calculations—you may be surprised
    at how common they really are!'
