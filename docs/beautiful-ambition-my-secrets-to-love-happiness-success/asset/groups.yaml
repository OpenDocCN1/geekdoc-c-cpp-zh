    # The Other Woman in Your Life: Your Mother


    Call her what you will—mom, mother, mommy dearest—we all have a mother. She can
    be different things to different people. She can range from being the greatest
    joy and blessing in our lives perhaps, to the greatest challenge we may face,
    in life. (Remember of course, this is most likely also how our mothers see us,
    too!) I want to talk a little bit about the incredible relationship you have with
    your mom.


    If you are anything or even a little like me, then you have a very close relationship
    with your mother and you completely enjoy one another. Now that I am an adult,
    my relationship with my mom is better than ever.


    Of course, being a teenager was a difficult time, because I did not get along
    with anyone at that stage and anything that my mother had to say would frustrate
    me faster and further along, deeper than anyone else.


    I do not quite know why that is; after all, they really do so much for us! They
    gave birth to us, stayed up with us when we were sick, and wiped away'
  - '[PAGE 132]


    the tears when we had a fall. (I have often considered the natural inclination
    to blame our mothers for things when they are usually the ones that do the most
    for us).


    Moms do such a good job at showing love and affection to us, that we start to
    take them for granted, because we know they will always love us. This, of course,
    is NOT the best way to behave—especially to someone you love! Unfortunately, though,
    it happens quite a bit. The fact is, that sometimes we give the worst treatment
    to the ones we love and that love us the most—those closest to us.


    Conversely, you may have found that you were really perhaps NEVER able to bond
    with your mother and/or get really close to her. I have several friends that have
    experienced this kind of situation and it truly is the most difficult, because
    it follows you throughout your adult-life! You sink when you acknowledge and know
    that you do not have the “closeness” that you truly desire and so much long for.


    Many times, this lack of intimacy with your mother can lead to problems with eating
    disorders, substance, or drugs and alcohol abuse. Women start to seek out other
    things as replacements, just so they can “feel” better. With eating disorders,
    most are merely looking for love and attention for the majority of the time. In
    most cases, it very well have less, little, or nothing at all to do with the actual
    food itself.


    Other times, they withhold food, such as in the case of anorexia, because they
    do not feel as though they are worthy of food, or should not be deserving or able
    to fully enjoy it at all. Then you have those cases where girls decide to over-compensate,
    by trying to be the best in school, their career, maybe sports or whatever they
    do, in order to try to win affection, or make themselves feel like they do not
    need anyone at all.


    Of course, the truth is that we ALL need other people, and parents are fundamentally
    important to us, not only in how they raised us, but also in the we'
  - '[PAGE 133]


    # 118 CHAPTER SIX The Sisterhood


    love, kindness, and affection we get while growing up. This truly helps to shape
    our personalities and who we will become in our adult lives.


    When I talk about the importance of getting along with women in our lives, I place
    heavy emphasis on our mothers, because the relationship with our mothers is truly
    important to a woman''s life and well-being.


    I want to offer some encouragement to you if you are reading this and feel that
    maybe you do not have the best relationship—the one that you desire with your
    mother.


    The fact is that there are so many reasons why parents treat us a certain way
    while we are growing and growing up. However, the most important thing for you
    to know is, even if you were not shown the kind of love and affection that you
    wanted, I promise that you were and are still very much loved today!


    If you feel deprived of a loving relationship from your mother, this most likely
    has to do with the way she was shown love and affection by her mother and even
    her father.


    Perhaps she had a sibling that was favored, or she felt like she did not do things
    enough to receive praise. She could have been abused verbally, physically, and
    emotionally. All these things will contribute to how you were raised and if your
    mom did not seek help to work through these issues, then they are going to affect
    how she does things in her life. In turn, how you get raised and treated as an
    adult will also by extension, be affected.


    I decided to talk about this openly and honestly, because as women, our relationship
    with our mothers can really influence how we feel about ourselves. There is a
    direct correlation, cause-effect type relationship at play here, of sorts.


    After all, this book is about discovering what you can do to be the best YOU CAN
    BE.


    True ambition is about learning the keys and secrets that will help you develop
    into everything YOU have dreamed of.'
  - '[PAGE 134]


    # BEAUTIFUL AMBITION 119


    Many times, it is extremely difficult to get your parents to talk about the challenges
    they had growing up. However, if you do know how they were raised, it will help
    you understand a little better, the things in your own life.


    It helps learning about this, for you might very well connect the dots, to finally
    finding out how and why you were or were not treated a certain way.


    Sometimes, just realizing the reality that they had growing up, will help you
    have compassion for them, which then can lead to healing and forgiveness. It may
    not happen overnight the goal for you is to heal yourself of so very things that
    may have hurt you.


    Perhaps you were given everything that a child deserves. This could include all
    the love, affection, and attention from both parents. But you were a “problem”
    child and you have not forgiven yourself for things that you may have done while
    you were growing up.


    Teenage years can be extremely volatile and thus also very difficult on the parents!
    REMEMBER: they only want the very best for you (even if/when it does not feel
    like it!).


    Sometimes it takes years for you to understand that. Maybe they went about all
    wrong, they had good intentions. You are an adult now, so it may very well be
    the time to decide and opt to move on, putting the blame-game and finger pointing
    to rest.


    Once you turn 18 years old, you are responsible for who you become and what you
    accomplish. Let us forgive and learn to develop the ultimate female relationship,
    the one with our mothers, to its fullest potential and capacity. Let go of any
    resentment, anger or hostile emotions.


    If you are looking for a good way to rebuild a relationship with your mom, do
    it with loving-kindness and tender loving care (TLC). Here are some tips and suggestions:'
  - '[PAGE 135]


    # 120 CHAPTER SIX The Sisterhood


    Write her a letter, letting her know your side of things. Be open about things
    and situations that happened to you, that made you feel a certain way. Be sure
    to also include good things that she did for you, that made you feel good. Remind
    her that you love her and a good relationship is important to you. Let her know
    all the things that are in your heart.


    Yes, you are taking a chance here and you may not like the reaction that you may
    get, but this is important enough to take a chance on it. IT IS A MUST!


    As you begin to grow as a mature, self-confident woman, you need to deal with
    things that are not always pleasant —even things from your past.


    So, let us get started, by reaching out in love and trying to find common ground
    here! (After all, she is the only mother you have).


    On the other hand, if you are blessed and have a great relationship with your
    mom, then this is the perfect time to reach out to her and tell her again amazing
    she is, as well as how your relationship meant so much to you.


    Always tell her how much you love and respect her for how she treated you and
    raised you. When and if YOU become a mother and experience the joys and sadness
    of mothering/motherhood, YOU too will see how much hard work is put into raising
