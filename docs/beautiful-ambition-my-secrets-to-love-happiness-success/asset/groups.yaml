    Preheat a grill or skillet over medium-high heat. Brush with olive oil. Cook chicken
    until golden on both sides, opaque and cooked through, about 10 minutes in total.


    Serve hot or at room temperature and garnished with additional lime zest.


    # Nutritional Analysis:


    - 302 calories

    - 11 g. fat

    - 44 g. protein

    - 3 g. carbohydrates


    # Cooking Lesson:


    Sometimes half the battle is won with patience. Just let the chicken swim along
    in this aromatic marinade, and the flavor will be so much better.


    # Menu Suggestions:


    You can afford a sweet temptation with this meal. Buy or make sugar-free meringue
    shells and serve alongside ½ cup of berries. You''ll have added only 3.5 grams
    of carbohydrates with the meringues and 5 grams or so with ½ cup of raspberries
    or strawberries.


    # Salad Niçoise with Citrus


    This quick salad from the French Riviera is filled with olives, tomatoes, asparagus
    and tuna. You can add any other greens or left-over vegetables. These ingredients
    were chosen to give a variety of textures, colors and flavors: crisp, pale green
    lettuce; ripe, red tomatoes; soft, pink tuna; and dark green asparagus. Use this
    recipe as a base and create your own version of this classic.


    # Countdown:


    - Make dressing

    - Blanch asparagus

    - Assemble salad


    # What You Need:


    - 1/4 cup red wine vinegar

    - 2 tablespoons Dijon mustard

    - 1/4 cup diced red onion

    - 2 tablespoons water

    - 2 tablespoons olive oil

    - Salt and freshly ground pepper to taste

    - 2 (6-ounce) cans low-salt, soft pink tuna packed in water, drained and rinsed

    - 1/2 pound fresh asparagus

    - 4 cups washed, ready-to-eat field greens or French-style salad

    - 2 medium tomatoes, cut into wedges

    - 8 pitted black olives, quartered


    # Directions:


    To prepare the vinaigrette dressing, whisk the vinegar and mustard together in
    a large bowl, with onion and water. Whisk in the oil to a smooth consistency.
    Season with salt and pepper, to taste. Flake the tuna into the vinaigrette.


    Cut or snap off the 1-inch-long fibrous base of the asparagus and discard. Slice
    the remaining asparagus into 2-inch pieces (you should have about 2 1/2 cups).
    Bring a medium saucepan of water to a boil.


    Add the asparagus. As soon as the water comes back to a boil, drain the asparagus
    and refresh in cold water. (If using thick asparagus, boil 5 minutes.)


    To microwave the asparagus instead, place asparagus in a microwave-safe bowl and
    microwave on for 4 minutes. Add the asparagus to the tuna mixture and toss gently.
    Divide the lettuce between two plates. Spoon the tuna-asparagus mixture over the
    lettuce. Arrange the tomato wedges around the plate, sprinkle the olives over
    the top and serve.


