    When you decide to eliminate somebody from your life, it is not easy and you will
    feel a lot of different emotions. This is normal.


    However, if you find that you have several people in your life like this, do not
    attempt to make the whole shift all at once, because it can be emotionally draining.
    Start out by limiting phone calls and your association with these people. Little
    by little, it will become easier for you. You may need to change your email address,
    in addition to a new home and cell phone number. It may sound extreme, but in
    most cases, this is the easiest way not to have to hear them again.


