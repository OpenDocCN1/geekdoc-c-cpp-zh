  \ C++ 程序中看到广泛使用的简写表示法，因此你应该熟悉它。\n\n## 关键技能 7.12 使用 sizeof\n\n有时，知道数据类型的大小（以字节为单位）是有帮助的。由于\
  \ C++ 内置类型的大小在不同的计算环境之间可能不同，因此在所有情况下预先知道变量的大小是不可能的。为了解决这个问题，C++ 包含了 `sizeof` 编译时运算符，它具有以下通用形式：\n\
  \n`sizeof (*type*)`\n\n`sizeof *var-name`\n\n第一个版本返回指定数据类型的大小，第二个版本返回指定变量的大小。如你所见，如果你想知道某个数据类型（如\
  \ `int`）的大小，必须将类型名称括在括号中。如果你想知道变量的大小，则不需要括号，尽管你可以在需要时使用它们。\n\n要查看 `sizeof` 如何工作，请尝试以下短程序。对于许多\
  \ 32 位环境，它会显示值 1、4、4 和 8。\n\n![Image](img/00558.gif)\n\n你可以将 `sizeof` 应用于任何数据类型。例如，当它应用于数组时，它返回数组所占用的字节数。考虑这段代码：\n\
  \n![Image](img/00559.gif)\n\n假设整数为 4 字节，这段代码显示值为 16（即 4 字节乘以 4 个元素）。\n\n如前所述，`sizeof`\
  \ 是一个编译时运算符。计算变量或数据类型大小所需的所有信息在编译期间都是知的。`sizeof` 运算符主要帮助你生成依赖于 C++ 数据类型大小的可移植代码。记住，由于\
  \ C++ 中类型的大小是由实现定义的，因此在你编写的代码中对它们的大小做出假设是一种糟糕的编程风格。\n\n#### ![Image](img/00003.jpeg)\
