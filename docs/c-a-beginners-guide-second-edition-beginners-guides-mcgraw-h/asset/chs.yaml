  ### 关键技能 11.6 创建你自己的操纵符函数\n\n你可以创建自己的操纵符函数。操纵符函数有两种类型：带参数的都不带参数的。创建参数化操纵符需要使用本书范围之外的技术。然而，创建无参数的操纵符非常简单，并在此处描述。\n\
  \n所有无参数的操纵符输出函数都有如下骨架结构：\n\n![Image](img/00823.gif)\n\n在这里，`manip_name` 是操纵符的名字。重要的一点是，尽管操纵符的唯一参数是指其所操作的流的指针，但在输出表达式中使用操纵符时，并不指定该参数。\n\
  \n以下程序创建了一个名为 `setup()` 的操纵符，它开启左对齐，将字段宽度设置为 10，并指定美元符号为填充字符。\n\n![Image](img/00824.gif)\n\
  \n自定义操纵符有用两个原因。第一，你可能需要对某个没有预定义操纵符的设备执行 I/O 操作——例如，绘图仪。在这种情况下，创建自己的操纵符将使输出到设备变得更加方便。其次，你可能会发现你自己在多次重复相同的操作序列。正如前面的程序所示，你可以将这些操作合并到一个操纵符中。\n\
  \n所有无参数的输入操纵符函数都有如下骨架结构：\n\n![Image](img/00825.gif)\n\n例如，以下程序创建了 `prompt()` 操纵符。它显示一条提示消息，然后配置输入以接受十六进制。\n\
  \n![Image](img/00826.gif)\n\n记住，你的操纵符返回 `stream` 是至关重要的。如果不这样做，你的操纵符就无法用于输入或输出操作链中。\n\
  \n#### ![Image](img/00003.jpeg) **进度检查**\n\n**1**. `endl` 的作用是什么？\n\n**2**. `ws`\
  \ 的作用是什么？\n\n**3**. I/O 操纵符是否用于？\n\n## 文件 I/O\n\n你可以使用 C++ I/O 系统来执行文件 I/O。为了执行文件\
  \ I/O，你必须在程序中包含 `<fstream>` 头文件。它定义了一些重要的类和值。\n\n### 关键技能 11.7 打开和关闭文件\n\n在 C++\
  \ 中，文件通过与流关联来打开。正如你所知，有三种类型的流：输入、输出和输入输出。要打开输入流，必须将其声明为 `ifstream`。要打开输出流，必须声明为\
  \ `ofstream`。对于输入输出输出流，必须声明为 `fstream`。例如，此片段创建了一个输入流、一个输出流和一个可以进行输入输出的流：\n\n![Image](img/00827.gif)\n\
  \n一旦你创建了流，与文件关联的一种方法是使用 `open()`。该函数是三种流类的成员。其原型所示：\n\n![Image](img/00828.gif)\n\
  \n在这里，`filename` 是文件名；`mode` 值决定了如何打开文件。它必须是 `openmode` 定义的一个或多个，`openmode` 由 `ios`\
  \ 定义。这些值如下：\n\n```cpp\nios::app\nios::ate\nios::binary\nios::in\nios::out\nios::trunc\n\
  ```\n\n你可以通过按位或（OR）操作将这些值中的两个组合在一起。包含 `ios::app` 会导致对文件的所有输出追加到末尾。该值仅用于可以输出的文件。包含\
  \ `ios::ate` 会在打开文件时移动到末尾。尽管 `ios::ate` 导致初始移动到文件结束，但 I/O 操作仍然可以在文件的任何位置进行。\n\n\
  `ios::in` 值指定文件具有输入能力。`ios::out` 值指定文件具有输出能力。\n\n`ios::binary` 值导致文件以二进制模式打开。默认情况下，所有文件都以文本模式打开。在文本模式下，可能会发生各种字符转换，例如回车换行符序列转换为换行符。然而，当以二进制模式打开文件时，不会发生此类字符转换。理解任何文件，无论是包含格式化文本还是原始数据，都可以以二进制或文本模式打开。唯一的区别在于是否发生字符转换。\n\
  \n`ios::trunc` 值会导致同名的预存在文件的内容被破坏并将文件截断为零长度。在使用 `ofstream` 创建输出流时，任何同名的预存在文件都会自动截断。\n\
  \n以下片段为输出打开一个文本文件：\n\n![Image](img/00829.gif)\n\n由于 `open()` 的 `mode` 参数默认为适用于所打开的流类型的值，因此通常不需要在前面的示例中指定其值（某些编译器没有将\
  \ `fstream::open()` 的模式参数默认为 `in` | `out`，因此你可能需要显式地指定此值）。\n\n\n\n\n如果 `open()`\
  \ 失败，该流在布尔表达式中使用将求值为 `false`。你可以利用这一事实，通过类似下面的语句来确认打开操作是否成功：\n\n![Image](img/00830.gif)\n\
  \n通常情况下，在尝试访问文件之前，你应该始终检查 `open()` 调用的结果。\n\n你也可以使用 `is_open()` 函数来检查是否已成功打开了文件，该函数是\
  \ `fstream`、`ifstream` 和 `ofstream` 的成员函数。它的原型如下：\n\n```cpp\nbool is_open( );\n\
  ```\n\n如果流连接到一个已打开的文件，则它返回 `true`，否则返回 `false`。例如，下面的代码检查 `mystream` 当前是否处于打开状态：\n\
  \n![Image](img/00831.gif)\n\n虽然使用 `open()` 函数打开文件是完全正确的，但在大多数情况下，你不会这样做，因为 `ifstream`、`ofstream`\
  \ 和 `fstream` 类拥有构造函数，可以自动打开文件。构造函数使用的参数和默认值与 `open()` 函数相同。因此，你最常见的打开文件方式如例所示：\n\
  \n![Image](img/00832.gif)\n\n如果由于某种原因无法打开文件，关联流变量的值将求值为 `false`。\n\n要关闭文件，请使用成员函数\
  \ `close()`。例如，要关闭与名为 `mystream` 流关联的文件，你可以使用这条语句：\n\n![Image](img/00833.gif)\n\n\
  `close()` 函数不接受参数，也不返回值。\n\n### 关键技能 11.8 读写文本文件\n\n从文本文件读取或写入内容最简单的方法是使用 `<<` 和\
  \ `>>` 运算符。例如，此程序向名为 `test:` 的文件写入了一个整数、一个浮点数和一个字符串：\n\n![Image](img/00834.gif)\n\
  \n接下来的程序从上一个程序创建的文件中读取一个整数、一个 `float`、一个字符和一个字符串：\n\n![Image](img/00835.gif)\n\n\
  请记住，当使用 `>>` 运算符读取文本文件时，会发生某些字符转换。例如，空白字符会被跳过。如果你想防止任何字符转换，必须以二进制访问模式打开文件。还要记住，当使用\
  \ `>>` 读取字符串时，遇到第一个空白字符输入就会停止。\n\n### 专家问答\n\n**Q: 正如你在模块 1 中解释的，C++ 是 C 的超集。我知道\
  \ C 定义了自己的 I/O 系统。C 的 I/O 系统对 C++ 程序员可用吗？如果是，应该在 C++ 程序中使用它吗？**\n\n**A:** 第一个问题的答案是肯定的。C\
  \ I/O 系统对 C++ 程序员可用。第二个问题的答案是有条件的否定。C I/O 系统不是面向对象的。因此，你几乎总是发现 C++ I/O 系统与 C++ 程序更加兼容。然而，C\
