  \n### 专家问答\n\n**Q：鉴于 C++ 所有循环都固有的灵活性，我在选择循环时应该使用什么标准？也就是说，我该如何为特定任务选择正确的循环？**\n\n\
  **A：** 执行已知次数的迭代时，使用 `for` 循环。当你需要一个至少执行一次的循环时，使用 `do-while`。当循环重复次数未知时，使用 `while`\
  \ 最佳。\n\n## 项目 3-2 改进 C++ 帮助系统\n\n`Help2.cpp`\n\n此项目扩展了在项目 3-1 中创建的 C++ 帮助系统。此版本增加了\
