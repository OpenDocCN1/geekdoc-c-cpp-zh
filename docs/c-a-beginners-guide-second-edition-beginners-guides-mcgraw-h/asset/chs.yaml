  \n注意 `dictionary` 结尾有两个空字符串。这些字符串标记了数组的结束。回想，空字符串只包含终止空字符。`for` 循环一直运行到字符串中的第一个字符为空为止。该条件通过此表达式进行测试：\n\
  \n![Image](img/00326.gif)\n\n数组索引指定指向字符串的指针。`*` 获取该位置的字符。如果该字符为空，则表达式为假，循环终止。否则，表达式为真，循环继续。\n\
  \n### 空指针约定\n\n在指针声明之后、赋值赋值之前，它将包含一个任意值。如果你在给它赋值之前尝试使用该指针，可能会导致程序崩溃。虽然没有万妥的方法可以避免使用未初始化的指针，但\
  \ C++ 程序员采用了一种有助于防止某些错误的程序。根据惯例，如果指针包含空（零）值，则假设它指向空。因此，如果给所有未使用的指针都赋予空值，并且避免使用空指针，就可以避免意外误用未初始化的指针。这是一个值得遵循的好习惯。\n\
