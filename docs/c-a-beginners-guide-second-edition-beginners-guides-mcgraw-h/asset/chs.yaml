  \ 让你操作与 CPU 本身相同类型的数据。这是 C++ 能够编写非常高效的系统级代码的方法之一。\n\n理解，变量的数据类型非常重要，因为它决定了允许的操作以及可以存储的值的范围。C++\
  \ 定义了多种数据类型，每种类型都有独特的特性。由于数据类型不同，所有变量在使用之前必须先声明，且变量声明始终包含一个类型说明符。编译器需要这些信息来生成正确的代码。在\
  \ C++ 中，没有“无类型”变量的概念。\n\n![Image](img/00073..)\n\n**  2-1**    数值数据类型及其范围。\n\n![Image](img/00074.gif)\n\
  \n**表 2-2** 32 位环境下的 C++ 数据类型的典型宽度和范围\n\n#### 整数\n正如你在第 1 节所学的，`int` 类型的变量包含整数数量。由于整数对编程非常重要，C++\
  \ 定义了多种变体。默认情况下，整数是带符号的。要创建无符号整数，使用 `unsigned` 修饰符。\n\n带符号和无符号整数之间的区别在于符号位的解释方式。如果符号位是\
  \ 0，则数字为正数；如果是 1，则数字为负数。负数几乎总是使用*补码*表示的。在这种方法中，数字中的所有位（符号位除外）被反转，然后加 1。最后，将符号位设置为\
  \ 1。\n\n带符号整数对于许多算法都很重要，但它们的范围只有无符号类型的一半。例如，假设是一个 16 位整数，这里是 32767：\n\n0 1 1 1 1\
