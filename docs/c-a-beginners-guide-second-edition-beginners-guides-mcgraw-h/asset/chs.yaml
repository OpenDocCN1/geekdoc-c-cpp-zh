  \ `catch` 块都会忽略。\n\n#### 捕获基类异常\n\n关于多个 `catch` 语句，有一个与派生类的重要点。基类的 `catch` 子句也会匹配任何派生自该基类的类。因此，如果你想同时捕获基类类型异常和派生类类型异常，请将派生类先放在\
  \ `catch` 序列的前面。如果你不这样做，基类的 `catch` 也会捕获所有的派生类。例如，考虑以下程序：\n\n![Image](img/00864.gif)\n\
  \n在这里，由于 `derived` 是一个以 `B` 为基类的对象，它将被第一个 `catch` 子句捕获，第二个子句将永远不会执行。某些编译器会用警告消息标记此条件。其他编译器可能会发布错误消息并停止编译。无论如何，要修复这种状况，请反转\
  \ `catch` 子句的顺序。\n\n## 捕获所有异常\n\n在某些情况下，你希望异常处理器捕获所有异常，而不仅仅是特定类型。为了实现这一点，使用这种形式的\
  \ `catch:`\n\n![Image](img/00865.gif)\n\n在这里，省略号匹配任何类型的数据。\n\n下面的程序演示了 `catch(...)`：\n\
  \n![Image](img/00866.gif)\n\n该程序显示以下输出：\n\n![Image](img/00867.gif)\n\n`Xhandler()`\
  \ 抛出了三种异常：`int`、`char` 和 `double`。它们都通过 `catch(...)` 语句捕获。\n\n`catch(...)` 的一个很好的用途是作为一组\
  \ `catch` 中的最后一个 `catch`。在这种情况下，它提供了一个实用的默认或“全捕”语句。将 `catch(...)` 作为默认是捕获所有你不想显式处理的异常的好方法。此外，通过捕获所有异常，你可以防止未处理的异常导致程序异常终止。\n\
  \n### 指定函数抛出的异常\n\n你可以在函数外部指定该函数可以抛出的异常类型。事实上，你还可以防止函数抛出任何异常。为了实现这些限制，你必须在函数定义中添加\
  \ `throw` 子句。该子句的通用形式为\n\n![Image](img/00868.gif)\n\n\n\n在这里，只有在逗号分隔的 `type-list`\
  \ 中包含的数据类型才能由函数抛出。抛出任何其他类型的表达式将导致程序异常终止。如果你不想让函数能够抛出任何 `any` 异常，请使用一个空列表。\n\n**注意**\
