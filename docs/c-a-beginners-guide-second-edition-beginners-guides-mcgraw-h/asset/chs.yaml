  \ 3。\n\n## 项目 4-1 数组排序\n\n`Bubble.cpp`\n\n由于一维数组将数据组织成可索引的线性列表，因此它是排序的完美数据结构。在这个项目中，你将学习一种简单的数组排序方法。正如你可能知道，有很多不同的排序算法。快速排序（quick\
  \ sort）、摆动排序（shaker sort）和壳排序（shell sort）只是其中三个。然而，最已知、简单且最易理解的排序算法被称为`冒泡排序`（bubble\
  \ sort）。虽然冒泡排序并不高效——事实上，它的性能对于排序大型数组来说不可接受——但它可以有效地用于排序小数组。\n\n#### 逐步步骤\n\n**1.**\
