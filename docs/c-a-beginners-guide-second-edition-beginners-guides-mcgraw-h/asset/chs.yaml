  \n这个值显然不是 123.23！原因如下：在程序中，`p`（一个整数指针）被赋值了 `x` 的地址（它是一个 `double`）。因此，当 `y` 被赋值为\
  \ `p` 指向的值时，`y` 只接收了 4 个字节的数据（而不是 `double` 值所需的 8 个字节），因为 `p` 是一个整数指针。因此，`cout`\
  \ 语句显示的不是 123.23，而是一个垃圾值。\n\n## 通过指针赋值值\n\n你可以在赋值语句的左侧使用指针，为指针指向的位置分配值。假设 `p` 是一个\
