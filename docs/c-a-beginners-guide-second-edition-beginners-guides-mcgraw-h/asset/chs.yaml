  \ 可以。在 C++ 中，可以在 `if` 或 `switch` 的条件表达式中、`while` 循环的条件表达式中，或者 `for` 循环的初始化部分内声明变量。在这些地方之一声明的变量，其作用域仅限于该语句控制的代码块。\n\
