  \ `VCARS32.BAT`，它是 Visual C++ 提供的。（Visual Studio .NET 也提供了一个即用的命令行提示符环境，可以通过从任务栏\
  \ Microsoft Visual Studio .NET 项下的工具列表中选择 Visual Studio .NET Command Prompt 来激活。）使用\
  \ C++ Builder 编译 `Sample.cpp`，你将使用以下命令行：\n\n```\n![Image](images/00006.gif\n\n##\
  \ 运行程序\n\nC++ 程序在编译后，就准备好运行了。由于 C++ 编译器的输出是可执行的目标代码，运行程序时只需在命令提示符处输入其名称即可。例如，运行\
  \ `Sample.exe`，将使用以下命令行：\n\n```\n![Image](images/00007.gif\n```\n\n运行时，该程序将显示以下输出：\n\
  \n```\n![Image](images/00008.gif\n```\n\n\n\n\n如果你正在使用集成开发环境（IDE），可以通过选择菜单中的“运行”（Run）来执行程序。请参阅你特定编译器的说明。对于书中的程序，通常从命令行编译和运行会更简单。\n\
  \n最后一点：书中的程序是基于控制台的，而不是基于窗口的。这意味着它们在命令提示符（Command Prompt）会话中运行。C++ 与 Windows 编程完美契合。事实上，它是\
  \ Windows 开发中最常用的语言。然而，书中的没有任何一个程序使用 Windows 图形用户界面（GUI）。其原因显而易见：Windows 程序在本质上是大型且复杂的。即使是创建一个最简单的\
  \ Windows 骨架程序，也需要 50 到 70 行代码。编写演示 C++ 特性的 Windows 程序每个都需要数百行代码。相比之下，基于控制台的程序短得多，而且是通常用于教授编程的程序类型。一旦你掌握了\
  \ C++，你就能轻松地将知识应用到 Windows 编程中。\n\n## 逐行分析第一个示例程序\n\n尽管 `Sample.cpp` 非常短，但它包含了所有\
