  3. 每个对象都有类 _____________ 的副本。\n\n## 关键技能 8.3 为类添加成员函数\n\n到目前为止，`Vehicle` 只包含数据，没有函数。虽然纯数据类是完全有效的，但大多数类都有函数成员。通常，成员函数会操作类定义的数据，并在许多情况下提供对这些数据的访问。通常，程序的其他部分通过函数与类交互。\n\
  \n为了说明成员函数，我们将为 `Vehicle` 类添加一个函数。回顾之前的示例，`main()` 通过将油耗率乘以燃油容量来计算车辆范围。虽然在技术上是正确的，但这不是处理这种计算的最佳方式。车辆范围的计算最好由\
  \ `Vehicle` 类本身处理。得出这个结论很容易理解：车辆范围取决于油箱容量和油耗率，而这两个量都被 `Vehicle` 封装了。通过向 `Vehicle`\
  \ 添加一个计算范围的函数，你正在增强其面向对象的结构。\n\n\n\n\n要为 `Vehicle` 添加一个函数，请在 `Vehicle` 的声明中指定其原型。例如，以下版本的\
  \ `Vehicle` 规定了一个名为 `range()` 的成员函数，该函数返回车辆的行驶里程：\n\n![Image](img/00573.gif)\n\n\
  由于成员函数（如 `range()`）是在类定义内部进行声明原型的，因此它不需要在其他地方再次声明原型。\n\n要实现一个成员函数，你必须通过使用类名限定函数名来告诉编译器该函数属于哪个类。例如，这里是编写\
  \ `range()` 函数的一种方法：\n\n![Image](img/00574.gif)\n\n注意分隔类名 `Vehicle` 和函数名 `range()`\
  \ 的 `::`。`::` 被称为*作用域解析运算符*。它将类名与成员名关联起来，以告诉编译器该成员属于哪个类。在这种情况下，它将 `range()` 关联到\
  \ `Vehicle` 类。换句话说，`::` 表示该 `range()` 存在于 `Vehicle` 的作用域内。多个不同的类可以使用相同的函数名。得益于作用域解析运算符和类名，编译器知道哪个函数属于哪个类。\n\
  \n`range()` 的体仅包含这一行：\n\n![Image](img/00575.gif)\n\n该语句通过将 `fuelcap` 乘以 `mpg` 来返回车辆的行驶里程。由于每个\
  \ `Vehicle` 类型的对象都有它们自己的 `fuelcap` 和 `mpg` 副本，当调用 `range()` 时，里程计算将使用调用对象的这些变量的副本。\n\
  \n在 `range()` 内部，直接引用实例变量 `fuelcap` 和 `mpg`，而无需在它们前面加上对象名或点运算符。当成员函数使用由其类定义的实例变量时，它是直接执行的，不需要显式引用对象，也不使用点运算符。如果你这样想的话，这很容易理解。成员函数总是相对于其所属类的某个对象被调用的。一旦这种调用发生，对象就已确定。因此，在成员函数内部，没有必要再次指定对象。这意味着\
  \ `range()` 内部的 `fuelcap` 和 `mpg` 隐式引用调用 `range()` 的对象中这些变量的副本。当然，`Vehicle` 外部的代码必须通过对象并使用点运算符来引用\
  \ `fuelcap` 和 `mpg`。\n\n成员函数必须相对于特定的对象被调用。这种情况有两种发生方式。第一，成员函数可以由类外部的代码调用。在这种情况下，你必须使用对象名和点运算符。例如，此代码在\
  \ `minivan:` 上调用了 `range()`：\n\n![Image](img/00576.gif)\n\n调用 `minivan.range()`\
  \ 会导致 `range()` 在 `minivan` 的实例变量副本上操作。因此，它返回了 `minivan` 的行驶里程。\n\n成员函数的第二种调用方式是从同类的另一个成员函数内部调用的。当一个成员函数调用同\
  \ true 类的另一个成员函数时，它可以直接调用，而无需使用点运算符。在这种情况下，编译器已经知道正在操作哪个对象。只有当成员函数由不属于该类的代码调用时，才必须使用对象名和点运算符。\n\
  \n这里显示的程序整合了所有部分和缺失的细节，并说明了 `range()` 函数：\n\n![Image](img/00577.jpeg)\n\n![Image](img/00578.jpeg)\n\
  \n该程序显示以下输出：\n\n![Image](img/00579.gif)\n\n#### ![Image](img/00003.jpeg) **进度检查**\n\
