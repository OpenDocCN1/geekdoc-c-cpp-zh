  \ `case` 的代码序列可以运行到下一个 `case` 吗？解释原因。\n\n\n\n\n\n### 关键技能 4.1 一维数组\n\n一维数组（array）是一组相关变量的列表。这类列表在编程中非常常见。例如，你可能会使用一个一维数组来存储网络上活跃用户的账户密码。另一个数组可能存储棒球球队的当前击打率。在计算一组数值的平均值时，你通常会使用数组来存放这些数值。数组是现代编程的基础。\n\
