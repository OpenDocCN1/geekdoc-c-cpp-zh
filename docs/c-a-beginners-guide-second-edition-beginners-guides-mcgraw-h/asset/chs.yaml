  \ `nums` 的值是非法的。其原因是 `nums` 是一个指向数组开头的常量。因此，你不能对其递增。\n\n尽管数组名生成的是指针常量，但只要它不被修改，仍然可以参与指针风格的表达式。例如，以下语句是有效的，为\
  \ `nums[3]` 赋值为 100：\n\n![Image](img/0311.gif)\n\n## 字符串常量\n\n你可能会好奇像此处片段所示的字符串常量是如何被\
  \ C++ 处理的：\n\n![Image](img/0312.gif)\n\n答案是，当编译器遇到字符串常量时，它将其存储在*字符串表*中并生成指向该字符串的指针。因此，“Xanadu”产生指向其表中条目的指针。因此，以下程序是完全有效的，并打印短语\
  \ **指针增强了 C++**：\n\n![Image](img/0313.gif)\n\n在这个程序中，构成字符串常量的字符存储在字符串表中，`ptr` 被赋值为表中中的指针。\n\
  \n由于每当使用字符串常量时都会生成指向程序字符串表的指针，你可能会利用这一事实来修改字符串表的内容。然而，这通常不是一个好主意，因为许多 C++ 编译器创建优化表，其中一个字符串常量可能被程序的两个或多个地方使用。因此，更改字符串可能会导致意外的副作用。\n\
  \n### 原地反转字符串\n\n`StrRev.cpp`\n\n之前提到过，比较两个指针只有当这两个指针指向同一个对象（如数组）时才有意义。现在你理解了指针和数组之间的关系，就可以应用指针比较来简化某些类型的算法。在这个项目中，你将看到一个示例。\n\
  \n\n\n此处开发的程序可以原地反转字符串的内容。因此，它不是将字符串反向复制到另一个数组中，而是反转存储该字符串的数组内部的内容。该程序使用两个指针变量来实现此目标。一个指针最初指向字符串的开头，另一个指针最初指向字符串的最后一个字符。设置了一个循环，只要起始指针小于结束指针，循环就会继续运行。在循环的每次迭代中，指针所指向的字符会被交换，并且指针向后移动。当起始指针大于或等于结束指针时，字符串已经反转完成。\n\
