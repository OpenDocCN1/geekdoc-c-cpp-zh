  \n### 关键技能 11.12 检查 I/O 状态\n\nC++ I/O 系统维护有关 I/O 操作结果的状态信息。I/O 流的当前状态在 `iostate`\
  \ 类型对象中描述，该类型是由 `ios` 定义的枚举，包含这些成员。\n\n![Image](img/00851.gif)\n\n获取 I/O 状态信息有两种方法。首先，你可以调用\
  \ `rdstate()` 函数。它的原型如下：\n\n```cpp\niostate rdstate();\n```\n\n它返回错误标志的当前状态。正如你可能从前面的标志列表中猜到的，当没有发生错误时，`rdstate()`\
  \ 返回 `goodbit`。否则，某个错误标志会被激活。\n\n另一种确定是否发生错误的方法是使用这些一个或多个 `ios` 成员函数：\n\n```cpp\n\
  bool bad();\nbool eof();\nbool fail();\nbool good();\n```\n\n之前讨论过 `eof()` 函数。如果\
  \ `badbit` 被设置，`bad()` 函数返回 true。如果 `failbit` 被设置， `fail()` 函数返回 true。如果没有错误，`good()`\
  \ 函数返回 true。否则它们返回 false。\n\n一旦发生错误，在程序继续运行之前可能需要将其清除。要做到这一点，请使用 `ios` 成员函数 `clear()`，其原型所示：\n\
  \n```cpp\nvoid clear(iostate *flags = ios::goodbit);\n```\n\n如果 `flags` 是 `goodbit`（默认情况下如此），所有错误标志都将被清除。否则，将\
  \ `flags` 设置为你所需的设置。\n\n在继续之前，你可能想尝试一下使用这些状态报告函数为前面的文件示例添加扩展的错误检查。\n\n### ![Image](img/00069.jpeg)\
