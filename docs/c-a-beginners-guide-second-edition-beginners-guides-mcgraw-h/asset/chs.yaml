  \n# 3**. 给定一个整数 `x`，请出如何将 `x` 左移两位。\n\n## 项目 7-1 创建位循环旋转函数\n\n![Image](img/00538.gif)\n\
  \n尽管 C++ 提供了两个移位运算符，但它并没有定义旋转运算符。*旋转*（rotate）与移位相似，区别在于被移出一端的位会被插入到另一端。因此，位并不会丢失，只是移动了位置。旋转既有左旋转也有右旋转。例如，1010\
  \ 0000 向左旋转一位得到 0100 0001。相同的值向右旋转一位得到 0101 0000。在每种情况下，移出的位都被插入到另一端。虽然缺少旋转运算符似乎是\
  \ C++ 堪称典范的位运算符全集中的一个缺陷，但实际上并非如此，因为你可以使用其他位运算符轻松地创建左旋转和右旋转。\n\n此项目创建了两个函数：`rrotate()`\
  \ 和 `lrotate()`，它们分别向右或向左方向旋转一个字节。每个函数接受两个参数：第一个是待旋转的值，第二个是旋转的位数。每个函数返回结果。该项目涉及若干次位操作，并展示了位运算符的实际用法。\n\
  \n#### 逐步实现\n\n1. 创建名为 `rotate.cpp` 的文件。\n\n2. 添加所示的 `lrotate()` 函数。它执行左旋转。\n\n\
  ![Image](img/00539.gif)\n\n以下是 `lrotate()` 的工作原理。函数通过 `val` 接收要旋转的值，通过 `n` 接收旋转的位数。函数将\
  \ `val` 赋值给 `t`，`t` 是一个 `unsigned int` 类型。将值转换为 `unsigned int` 是必要的，因为这允许移出左侧的位被找回。原因如下：由于\
  \ `unsigned int` 比字节大，当一个位从字节值的左侧移出时，它仅仅是移动到了该整数值的第 8 位。然后，该位的值就可以复制到字节值的第 0 位，从而实现旋转。\n\
  \n实际的旋转执行如下：建立一个循环，按所需的次数逐执行旋转，每次执行一次。在循环内部，`t` 的值左移一位。这会在右侧引入一个 0。然而，如果结果的第 8 位（即从字节值中移出的位）为\
  \ 1，则将第 0 位设置为 1。否则，第 0 位保持为 0。\n\n使用以下语句测试第八 位：\n\n![Image](img/00540.gif)\n\n\
  数值 256 是只有第 8 位被设置的十进制值。因此，只有当 `t` 的第 8 位值为 1 时，`t & 256` 才会为真。\n\n旋转完成后，返回 `t`。由于\
  \ `lrotate()` 声明返回 `unsigned char` 值，因此仅返回 `t` 的低 8 位。\n\n3. 添加后续的 `rrotate()` 函数。它执行右旋转。\n\
  \n![Image](img/00541.gif)\n\n右旋转比左旋转稍微复杂一点，因为传入的 `val` 值必须移入 `t` 的第二个字节中，以便被移出右侧的位可以被捕捉。一旦旋转完成，必须将值移回\
  \ `t` 的低位字节，以便返回该值。由于移出的位移动到了第 7 位，以下语句检查该值是否为 1：\n\n![Image](img/00542.gif)\n\n\
  十进制值 128 只有第 7 位被设置。如果它被设置，则将 `t` 与 32768 进行按位或（32768 是第 15 位被设置而第 14 到 0 位均被清零的十进制值）。这会导致\
  \ `t` 的第 15 位被设置，而其他位保持不变。\n\n4. 这是一个演示 `lrotate()` 和 `rrotate()` 的完整程序。它使用 `show_binary()`\
