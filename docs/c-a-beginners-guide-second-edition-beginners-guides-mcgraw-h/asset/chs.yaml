  \n### **关键技能 8.4 构造函数和析构函数**\n\n在之前的示例中，每个 `Vehicle` 对象的实例变量必须通过一系列语句手动设置，例如：\n\n\
  ![Image](img/00589.gif)\n\n\n\n\n这种方法永远不会用于专业编写的 C++ 代码中。除了容易出错（你可能会忘记设置其中一个字段）之外，有更简单的方法来完成此任务：构造函数（constructor）。\n\
  \n`constructor`（构造函数）在对象被创建时对其进行初始化。它的名称与类名相同，语法上与函数相似。然而，构造函数没有显式的返回类型。构造函数的通用形式所示：\n\
  \n![Image](img/00590.gif)\n\n通常，你将使用构造函数为类定义的实例变量提供初始值，或者执行创建完全形成的对象所需的任何其他启动程序。\n\
  \n构造函数的互补物是 `destructor`（析构函数）。在许多情况下，对象在被销毁时需要执行某些操作或一系列操作。局部对象在进入代码块时创建，在离开代码块时销毁。全局对象在程序结束时被销毁。析构函数需要的理由有很多。例如，对象可能需要释放它之前分配的内存，或者需要关闭一个打开的文件。在\
  \ C++ 中，是由析构函数处理这些类型的操作。析构函数的名称与构造函数相同，但前面有一个 `~` 符号。与构造函数一样，析构函数没有返回类型。\n\n这是一个使用构造函数和析构函数的简单示例：\n\
  \n![Image](img/00591.gif)\n\n程序的输出所示：\n\n![Image](img/00592.gif)\n\n在此示例中，`MyClass`\
  \ 的构造函数是：\n\n![Image](img/00593.gif)\n\n注意，构造函数被指定在 `public` 下。这是因为构造函数将从类外部定义的代码调用。此构造函数为\
  \ `MyClass` 的实例变量 `x` 赋值为 10。该构造函数在对象创建时被调用。例如，在这一行中：\n\n![Image](img/00594.gif)\n\
  \n在 `obi` 对象上调用了构造函数 `MyClass()`，赋予 `obl.x` 值为 10。`ob2` 也是如此。构造完成后，`ob2.x` 的值也是\
  \ 10。\n\n`MyClass` 的析构函数所示：\n\n![Image](img/00595.gif)\n\n此析构函数只是显示消息，但在实际程序中，析构函数将用于释放类使用的一个或多个资源（例如文件句柄或内存）。\n\
  \n#### ![Image](img/00003.jpeg) 进度检查\n\n- **1**. 什么是构造函数？它在什么时候执行？\n- **2**. 构造函数是否有返回类型？\n\
  - **3**. 析构函数何时被调用？\n\n## 关键技能 8.5 参数化构造函数\n\n在上述的示例中，使用了无参数构造函数。虽然这在某些情况下是可以的，但大多数情况下，你需要一个有一个或多个参数的构造函数。参数添加到构造函数的方式与添加到函数相同：只需在构造函数名称后的括号内声明它们即可。例如，这里是\
  \ `MyClass` 的参数化构造函数：\n\n![Image](img/00596.gif)\n\n要向构造函数传递参数，你必须在声明对象时将传递的值或多个值与对象关联。C++\
  \ 提供了两种方法。第一种方法所示：\n\n![Image](img/00597.gif)\n\n此声明创建了一个名为 `ob1` 的 `MyClass` 对象并向其传递了值\
  \ 101。然而，这种形式（在此范围内）很少使用，因为第二种方法更短更直接。在第二种方法中，参数或多个参数必须跟在对象名称之后并放在括号内。例如，该语句的功能与之前的声明相同：\n\
  \n```cpp\nMyClass ob1(101);\n```\n\n这是声明参数化对象最常用的方法。使用这种方法，向构造函数传递参数的通用形式是\n\n`class-type\
  \ var(arg-list);`\n\n在这里，`arg-list` 是传递给构造函数的逗号分隔参数列表。\n\n**注意** ![Image](img/00070.gif)\n\
