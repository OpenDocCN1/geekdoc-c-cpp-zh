  \n## 关键技能 5.12 递归\n\n我们在本模块中将检查的最后一个主题是*递归*。递归有时被称为*循环定义*，递归是根据自身来定义某物的过程。在编程方面，递归是函数调用自身的过程。调用它自身的函数被称为*递归的*函数。\n\
  \n递归的经典例子是函数 `factr()`，它计算整数的阶乘。数字 `N` 的阶乘是 1 到 `N` 之间所有整数的乘积。例如，3 的阶乘是 1×2×3，即\
  \ 6。`factr()` 其迭代等效形式均所示：\n\n![Image](img/00397.gif)\n\n![Image](img/00398.gif)\n\
  \n非递归版本 `fact()` 的操作应该是易懂的。它使用一个从 1 开始的循环，逐步将每个数字与移动乘积相乘。\n\n递归 `factr()` 的操作要复杂一点。当用参数\
  \ 1 调用 `factr()` 时，函数返回 1；否则，它返回 `factr(n-1)*n` 的乘积。为了计算这个表达式，会用 `n-1` 调用 `factr()`。这种情况会一直发生，直到\
  \ `n` 等于 1 且函数调用开始返回。例如，计算 2 的阶乘时，第一次调用 `factr()` 将导致第二次调用，参数为 1。这次调用将返回 1，然后 1\
  \ 乘以 2（原始的 `n` 值）。答案是 2。你可能会发现在 `factr()` 中插入 `cout` 语句很有趣，它们会显示每一层的层级以及中间答案是什么。\n\
  \n\n\n\n\n在模块 4 中，你学习了一种名为冒泡排序的简单排序方法。当时提到过存在性能更好的排序方法。在这里，你将开发其中一种最优算法的版本：快速排序（Quicksort）。快速排序由\
  \ C.A.R. Hoare 发明并命名，是目前可用最好的通用排序算法。它之所以没有在模块 4 中展示，是因为快速排序的最佳实现依赖于递归。我们将开发的版本是对一个字符数组进行排序，但该逻辑可以调整用于排序任何类型的对象。\n\
  \n快速排序基于“分区”（partitions）的概念。通用步骤是选择一个值，称为`comparand`（比较数），然后将数组划分为两个部分。将所有大于或等于`comparand`的元素放在一侧，将小于该值的元素放在另一侧。然后对每个剩余的区域重复此过程，直到数组排序完成。例如，给定数组\
  \ `fedacb` 并使用值 `d` 作为比较数，快速排序的第一轮将把数组重新排列如下：\n\n![Image](img/00400.gif)\n\n然后对每个部分重复此过程——即\
  \ `bca` 和 `def`。如你所见，该过程本质上是递归的，而且，快速排序最简洁的实现确实是一个递归函数。\n\n你可以通过两种方式选择比较数值。你可以随机选择，也可以通过对数组中选取的一小组值取平均值来选择。为了实现最优排序，你应该选择一个恰好位于数值范围中间的值。然而，对于大多数数据集来说，这很难做到。在最坏的情况下，选中的值位于一端。但尽管如此，快速排序仍然能正确运行。我们将开发的快速排序版本选择数组的中间元素作为比较数。\n\
  \n另外一点：C++ 库包含一个名为 `qsort()` 的函数，它也执行快速排序。你可能会发现将其与这里展示的版本进行对比非常有趣。\n\n### 逐步教程\n\
