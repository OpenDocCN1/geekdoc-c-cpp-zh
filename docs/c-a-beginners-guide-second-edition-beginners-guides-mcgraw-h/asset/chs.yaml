  - **11.11** 使用随机访问文件 I/O](#part0016.html_ch11skill11)\n- **11.12** 检查 I/O 系统状态](#part0016.html_ch11skill12)\n\
  \n从本书开始，你一直在使用 C++ I/O 系统，但在没有太多正式解释的情况下使用的。由于 I/O 系统是基于类层次结构的，在不先讨论类和继承的情况下，是不可能的呈现理论和细节的。现在是时候详细检查\
  \ C++ I/O 系统了。\n\nC++ I/O 系统非常庞，在这里不可能讨论每一个类、函数或特性，但本模块将向你介绍最重要和最常用的部分。具体来说，它展示了如何重载\
  \ `«` 和 `»` 运算符，以便你能够输入或输出你设计的类对象。它描述了如何格式化输出以及如何使用 I/O 操纵符。本模块以讨论文件 I/O 结束。\n\n\
  ## 旧版与现代 C++ I/O\n\n目前在使用两个版本的 C++ 面对象 I/O 库：基于原始 C++ 规范的旧版本，以及由标准 C++ 定义的新版本。旧版\
  \ I/O 库由头文件 `<iostream.h>` 支持。新版 I/O 库由头文件 `<iostream>` 支持。在大多数情况下，这两个库对程序员来说看起来是一样的。这是因为新版\
  \ I/O 库本质上仅仅是旧版本的更新和改进版。事实上，两者之间的绝大多数差异发生在表面之下，即在库的实现方式上，而不是使用方式上。\n\n从程序员的角度来看，旧版和新版\
  \ C++ I/O 库有两个主要区别。首先，新版 I/O 库包含了一些额外的功能并定义了一些新的数据类型。因此，新版 I/O 库本质上是旧版的超集。几乎所有最初为旧库编写的程序在使用新库时，无需进行实质性更改即可编译。其次，旧式\
  \ I/O 库位于全局命名空间中。新式库位于 `std` 命名空间中（记住 `std` 命名空间被所有标准 C++ 库使用）。由于旧式 I/O 库现在已经过时，本书仅描述新版\
  \ I/O 库，但大部分信息也适用于旧版 I/O 库。\n\n## 关键技能 11.1 C++ 流\n\n理解 C++ I/O 系统最基础的一点是它运行在*流*（streams）上。流是一个产生或消费信息的抽象。流由\
  \ C++ I/O 系统连接到物理设备。所有流的行为都相同，即使它们连接的实际物理设备不同。由于所有流的作用都相同，相同的 I/O 函数和运算符可以作用于几乎任何类型的设备。例如，你用于写入屏幕的相同方法可以用于写入磁盘或打印机。\n\
  \n在最常见的形式下，流是到文件的逻辑接口。当 C++ 定义“文件”这一术语时，它可以指的是磁盘文件、屏幕、键盘、端口、磁带上的文件等。尽管文件的形式不同，但所有流的能力都是相同的。这种方式的优势是，对于你这个程序员来说，一个硬件设备看起来和其他设备大模一样。流提供了一致的接口。\n\
  \n流通过打开操作链接到文件。通过关闭操作与文件分离。\n\n有两种类型的流：*文本*（text）和*二进制*（binary）。文本流用于字符。当使用文本流时，可能会发生字符转换。例如，当输出换行符时，它可能会转换为回车换行序列。由于这个原因，发送到流的内容与写入文件的内容之间可能没有一一对应的关系。二进制流可以用于任何类型的数据。不会发生字符转换。\n\
  \n需要理解的另一个概念是*当前位置*（current location）。当前位置（称为当前位置）是文件访问的位置。例如，如果一个文件长 100 字节且读取了一半，那么下次读取操作将在\
  \ 50 字节处进行。\n\n总结：在 C++ 中，I/O 是通过称为*流*的逻辑接口进行的。所有流具有相似的属性，无论关联什么类型的文件，都通过相同的 I/O\
  \ 函数操作。文件是包含数据的实体。（当然，某些设备不支持所有操作，例如随机访问操作，因此相应的流也不会支持这些操作。）\n\n### C++ 预流\n\nC++\
  \ 包含了几个在你的 C++ 程序执行时自动打开的预流。它们是 `cin`、`cout`、`cerr` 和 `clog`。如你所知，`cin` 是关联标准输入的流，`cout`\
  \ 是关联标准输出的流。`cerr` 流链接到标准输出，`clog` 也是如此。这两个流之间的区别是 `clog` 有缓冲，而 `cerr` 没有。这意味着任何发送到\
  \ `cerr` 的输出都是立即输出，但到 `clog` 的输出只有在缓冲区满时才会写入。通常，`cerr` 和 `clog` 是写入程序调试或错误信息的流。\n\
  \nC++ 还打开了标准流的宽（16 位）字符版本，称为 `wcin`、`wcout`、`wcerr` 和 `wclog`。这些流的存在是为了支持像中文这样需要大型字符集的语言。我们在本书书中不会使用它们。\n\
  \n默认情况下，C++ 标准流链接到控制台，但你可以通过程序将其重定向到其他设备或文件。它们也可以由操作系统进行重定向。\n\n\n\n\n\n正如你在模块 1\
  \ 中学到的，C++ 在 `<iostream>` 中提供了对其 I/O 系统的支持。在这个头文件中，定义了一套相当复杂的类层次结构，用于支持 I/O 操作。I/O\
  \ 类从一套模板类开始。正如你将在模块 12 中学到的，模板定义了类的形状，而不完全指定其将在上面操作的数据。一旦定义了模板类，就可以创建该模板类的特定实例。在\
  \ I/O 库方面，标准 C++ 为这些模板类创建了两个特定版本：一个用于 8 位字符，另一个用于宽字符。这些特定版本的作用与其他任何类都一样，不需要熟悉模板即可充分利用\
  \ C++ I/O 系统。\n\nC++ I/O 系统构建在两个相关但不同的模板类层次结构之上。第一个是派生自名为 `basic_streambuf` 的低级\
  \ I/O 类。该类提供了基础的、低级的输入和输出操作，并为整个 C++ I/O 系统提供底层支持。除非你正在进行高级 I/O 编程，否则你不需要直接使用 `basic_streambuf`。你最常使用的类层次结构派生自\
  \ `basic_ios`。这是一个高级 I/O 类，提供了与流 I/O 相关的格式化、错误检查和状态信息。（`basic_ios` 的基类称为 `ios_base`，它定义了\
  \ `basic_ios` 使用的若干特性。）`basic_ios` 被用作几个派生类的基，包括 `basic_istream`、`basic_ostream`\
  \ 和 `basic_iostream`。这些类分别用于创建能够输入、输出和输入/输出的流。\n\n如所述，I/O 库为 I/O 类层次结构创建了两个特定版本：一个用于\
  \ 8 位字符，一个用于宽字符。本书仅讨论 8 位字符类，因为它们是目前为止最频繁使用的。以下是模板类名称到其基于字符版本的映射列表。\n\n![Image](img/00795.gif)\n\
  \n基于字符的名称将用于本书的其余部分，因为这些你在程序中使用的名称。它们也与旧 I/O 库使用的名称相同。这就是为什么旧和新的 I/O 库在源代码级别是兼容的。\n\
  \n最后最后一点：`ios` 类包含许多成员函数和变量，用于控制或监控流的基本操作。它会被频繁引用。只需记住，如果你在程序中包含 `<iostream>`，你就可以访问这个重要的类了。\n\
  \n#### ![Image](img/00003.jpeg) 进度检查\n\n1. **1**. 什么是流？什么是文件？\n2. **2**. 什么流连接到标准输出？\n\
  3. **3**. C++ I/O 由一套复杂的类层次结构支持。对还是错？\n\n### 关键技能 11.3 重载 I/O 运算符\n\n在之前的模块中，当程序需要输出或输入与类关联的数据时，会创建成员函数，这些成员函数的唯一目的就是输出或输入类的数据。虽然这种方法本身没有错，但\
  \ C++ 允许了一种更优的方法来对类执行 I/O 操作：通过重载 `«` 和 `»` I/O 运算符。\n\n在 C++ 语言中，`«` 运算符被称为*插入*（insertion）运算符，因为它将数据插入流中。同样，`»`\
  \ 运算符被称为*提取*（extraction）运算符，因为它从流中提取数据。重载插入和提取运算符的运算符函数通常称为*插入器*（inserters）和*提取器*（extractors）。\n\
  \n在 `<iostream>` 中，插入和提取运算符对所有 C++ 内置类型都被重载。在这里，你将看到相对于你创建的类如何定义这些运算符。\n\n## 创建插入器\n\
  \n作为一个简单的第一个示例，让我们为此处显示的 `ThreeD` 类版本创建一个插入器：\n\n![Image](img/00796.gif)\n\n要为类型为\
  \ `ThreeD` 的对象创建插入器函数，请为其重载 `«`。这里是实现此操作的方法：\n\n![Image](img/00797.gif)\n\n让我们仔细观察这个函数，因为它的许多特性对于所有插入器函数都是通用的。首先，注意它被声明为返回一个\
  \ `ostream` 类型对象的引用。这种声明是必要的，这样多个此类类型的插入器就可以在复合 I/O 表达式中组合。接下来，函数有两个参数。第一个是出现在 `«`\
  \ 运算符左侧的流的引用。第二个参数是出现在右侧的对象。（如果你喜欢的话，这个参数也可以是对象的引用。）在函数内部，类型为 `ThreeD` 的对象所包含的三个值被输出，并返回\
  \ `stream`。\n\n这是一个演示插入器的短程序：\n\n![Image](img/00798.jpeg)\n\n该程序显示以下输出：\n\n![Image](img/00799.gif)\n\
  \n如果你删除了特定于 `ThreeD` 的代码，就留下了插入器的骨架，如下所示：\n\n![Image](img/00800.gif)\n\n当然，通过引用传递\
  \ `obj` 是允许的。在宽泛的边界内，插入器函数实际上做了什么取决于你。然而，良好的编程习惯要求你返回 `stream`。\n\n#### 使用友元函数重载插入器\n\
  \n在之前的程序中，重载的插入器不是 `ThreeD` 的成员。事实上，插入器或提取器函数都不能是类的成员。原因在于，当 `operator` 函数是类的成员时，左操作数（隐式使用\
  \ `this` 指针传递）是该类的对象。没有办法改变这一点。然而，当插入器被重载时，左操作数是流，右操作数是类的对象。因此，重载的插入器必须是非成员函数。\n\
  \n插入器必须是其定义所在操作的类的成员这一事实引发了一个严重的问题：插入器如何访问类的私有元素？在之前的程序中，变量 `x`、`y` 和 `z` 被设为公共，以便插入器可以访问它们。但隐藏数据是面向对象编程（OOP）的重要部分，强制所有数据公开化是严重的不一致的。然而，有一个解决方案：插入器可以是某个类的友元（friend）。作为其所定义之类的友元，它可以访问私有数据。在这里，\
  \ `ThreeD` 类和示例程序经过重构，重载的插入器被声明为友元：\n\n![Image](img/00801.jpeg)\n\n注意变量 `x`、`y`\
  \ 和 `z` 现在是 `ThreeD` 的私有的，但仍然可以被插入器直接访问。将插入器（和提取器）变为其所定义类的友元维护了封装原则。\n\n## 重载提取器\n\
  \n要重载提取器，使用与重载插入器时类似的通用方法。例如，以下提取器将三维坐标输入到类型为 `ThreeD` 的对象。注意它还提示了用户。\n\n![Image](img/00802.gif)\n\
  \n提取器必须返回一个 `istream` 类型对象的引用。此外，第一个参数必须是 `istream` 类型对象的引用。这就是出现在 `»`  左侧的流。第二个参数是将接收输入的变量的引用。因为它是引用，所以在在输入信息时可以修改第二个参数。\n\
  \n提取器的骨架如下：\n\n![Image](img/00803.gif)\n\n\n\n\n以下程序演示了针对 `ThreeD` 类型对象的提取器：\n\n\
  ![Image](img/00804.jpeg)\n\n![Image](img/00805.gif)\n\n这里显示了一个示例运行：\n\n![Image](img/00806.gif)\n\
  \n与插入器（inserters）一样，提取器函数（extractor functions）不能是它们所属类的成员。它们可以是友元函数（friends），也可以是独立的函数。\n\
  \n除了必须返回一个 `istream` 类型对象的引用外，你可以在提取器内部执行任何你想做的事情。然而，为了结构和清晰，最好仅将提取器用于输入操作。\n\n\
