  \n![Image](img/00283.gif)\n\n## 关键技能 4.8 指针\n\n指针是 C++ 最强大的特性之一。它也是最令人头疼的特性之一。尽管指针有误用的风险，但它们是\
  \ C++ 编程中至关重要的部分。例如，它们允许 C++ 支持如链表和动态内存分配等功能。它们还提供了一种函数修改参数内容的方法。然而，指针的这些和其他用法将在后续模块中讨论。在本模块中，你将学习指针的基础知识并了解如何操作它们。\n\
  \n在接后的讨论几处，有必要引用 C++ 几种基本数据类型的大小。为了讨论方便，假设字符长度为一个字节，整数为四字节，`floats` 为四字节，而 `doubles`\
  \ 的长度为八字节。因此，我们假设这是一个典型的 32 位环境。\n\n## 什么是指针？\n\n`pointer` 是一个包含内存地址的对象。通常，这个地址是另一个对象（例如变量）的位置。例如，如果\
  \ `x` 包含 `y` 的地址，则说 `x` “指向” y。\n\n指针变量必须声明为指针。指针变量声明的一般形式为\n\n`type *var-name;`\n\
  \n在这里，`type` 是指针的基类型。基类型决定了指针将指向什么类型的数据。`var-name` 是指针变量的名字。例如，要将 `ip` 声明为指向 `int`\
  \ 的指针，使用此声明：\n\n![Image](img/00284.gif)\n\n由于 `ip` 的基类型是 `int`，因此它可以用来指向 `int` 值。\n\
  \n这里声明了一个 `float` 指针：\n\n![Image](img/00285.gif)\n\n在这种情况下，`fp` 的基类型是 `float`，这意味着它可以用来指向一个\
  \ `float` 值。\n\n通常，在声明语句中，在变量名前前加上 `*` 会导致该变量变成指针。\n\n## 关键技能 4.9 指针运算符\n\n有两个与指针配合特殊运算符：`*`\
  \ 和 `&`。`&` 是一个一元运算符，返回操作数的内存地址。`&` 运算符只需要一个操作数。例如，\n\n![Image](img/00286.gif)\n\
  \n将 `total` 的内存地址放入 `ptr`。这个地址是 `total` 在计算机内存中的位置。这与 `total`的值无关。因此，前面的语句可以口述为\
  \ `ptr` 接收 `total` 的地址。\n\n第二个运算符是 `*`，它是 `&` 的对补。它是一个一元运算符，返回操作数所指定的变量的值。继续之前的示例，如果\
  \ `ptr` 包含 `total` 的内存地址，那么\n\n![Image](img/00287.gif)\n\n将 `total` 的值放入 `val`。例如，如果\
  \ `total` 原本值为 3200，那么 `val` 的值也将是 3200，因为那是存储在位置 100（即赋值给 `ptr` 的地址）的值。`*` 的操作可以记为“地址”。在这种情况下，语句可以读作\
  \ `val` 接收地址 `ptr` 的值。\n\n以下程序执行了上述的操作序列：\n\n![Image](img/00288.gif)\n\n乘法符号与“地址”符号相同非常遗憾。这一事实有时会让\
  \ C++ 语言的新手感到困惑。这些运算符之间没有关系。记住，`&` 和 `*` 的优先级都高于任何算术运算符，除了与一元负号相同。\n\n使用指针的行为通常被称为*间接引用*（indirection），因为你通过另一个变量间接访问一个变量。\n\
  \n### ![Image](img/00003.jpeg) 进度检查\n\n**[1]** 什么是指针？\n\n**[2]** 显示如何声明一个名为 `valPtr`\
  \ 的 `long int` 指针。\n\n**[3]** 当涉及指针时，`*` 和 `&` 运算符的作用是什么？\n\n## 指针的基类型很重要\n\n\n\n\
  \n在前面的讨论中，你已经看到可以通过指针间接地将 `total` 的值赋值给 `val`。此时，你可能想到了这个重要的问题：C++ 如何知道从 `ptr` 指向的地址向\
  \ `val` 拷贝多少字节？或者更通俗地说，编译器如何为任何涉及指针的赋值传输正确的字节数？答案是，指针的基类型决定了指针所操作的数据类型。在这种情况下，因为\
  \ `ptr` 是一个 `int` 指针，所以从 `ptr` 指向的地址向 `val` 拷贝了 4 个字节的信息（假设 `int` 是 32 位的）。然而，如果\
  \ `ptr` 是一个 `double` 指针（例如），那么将会拷贝 8 个字节。\n\n确保指针变量始终指向正确类型的数据至关重要。例如，当你声明一个指针为\
  \ `int` 类型时，编译器假设它所指向的任何内容都是一个整数变量。如果它指向的不是整数变量，那么麻烦通常就不远在尺了！例如，以下片段是不正确的：\n\n![Image](img/00289.gif)\n\
  \n该片段无效的，因为你不能将 `double` 指针赋值给整数指针。也就是说，`&f` 生成了一个指向 `double` 的指针，但 `p` 是一个指向 `int`\
  \ 的指针。这两种类型是不兼容的。（事实上，编译器会在该处标记一个错误且不会编译你的程序。）\n\n虽然两个指针必须具有兼容的类型才能将一个赋值给另一个，但你可以使用强制类型转换（风险自负）来覆盖这一限制。例如，以下片段在技术上现在是正确的：\n\
  \n![Image](img/00290.gif)\n\n向 `int ***` 的强制转换导致 `double` 指针转换为整数指针。然而，为了此目的使用强制转换是一种可疑的做法。其原因是，指针的基类型决定了编译器如何处理它所指向的数据。在这种情况下，尽管\
  \ `p` 实际上指向的是一个浮点值，但编译器仍然“认为” `p` 指向一个 `int`（因为 `p` 是一个 `int` 指针）。\n\n为了更好地理解为什么使用强制转换将一种类型的指针赋值给另一种类型通常不是一个好主意，请考虑以下短程序：\n\
