  \ `>` 返回 `true`，否则返回 `false`。\n\n\n\n继承的一个主要优势是，一旦你创建了一个定义一组对象公共属性的基类，就可以用它创建任意数量更具体的派生类。每个派生类都可以精确地定制自己的分类。例如，这里有另一个派生自\
  \ `TwoDShape` 的类，它封装了矩形：\n\n![Image](img/00740.gif)\n\n`Rectangle` 类包含了 `TwoDShape`\
  \ 并增加了函数 `isSquare()`（判断矩形是否为正方形）和 `area()`（计算矩形面积）。\n\n## 成员访问与继承\n\n正如你在模块 8 中所学习过的那样，类的成员通常被声明为私有（private），以防止其被未经授权的使用或篡改。继承一个类*不会*覆盖私有访问限制。因此，尽管派生类包含了其基类的所有成员，但它无法访问基类中的私有成员。例如，如果\
  \ `width` 和 `height` 在 `TwoDShape` 中被设为私有（如下），那么 `Triangle` 将无法访问它们。\n\n![Image](img/00741.jpeg)\n\
  \n`Triangle` 类将无法编译，因为 `area()` 函数内部对 `width` 和 `height` 的引用会导致访问违规。由于 `width` 和\
  \ `height` 现在是私有的，它们只能由所属类的其他成员访问。派生类无法访问它们。\n\n起，你可能会认为派生类无法访问基类的私有成员是一个严重的限制，因为这会在很多情况下阻止使用私有成员。幸运的是并非如此，因为\
  \ C++ 提供了多种解决方案。一种是使用 `protected` 成员，将在下一节中描述。另一种是使用公共函数提供对私有数据的访问。正如你在前面的模块中看到的，C++\
  \ 程序员通常通过函数授予类私有成员的访问权限。提供私有数据访问的函数称为*访问器函数*。以下是 `TwoDShape` 类的重写，它为 `width` 和 `height`\
  \ 添加了访问函数：\n\n![Image](img/00742.jpeg)\n\n![Image](img/00743.jpeg)\n\n![Image](img/00744.gif)\n\
  \n### ![Image](img/00003.jpeg) **进度检查**\n\n**1**. 派生类是如何继承基类的？\n\n**2**. 派生类是否包含其基类的成员？\n\
  \n**3**. 派生类是否有访问其基类私有成员的权限？\n\n### 关键技能 10.2 基类访问控制\n\n正如所解释的，当一个类继承另一个类时，基类的成员变成了派生类的成员。然而，派生类内部对基类成员的访问权限取决于继承基类时使用的访问修饰符。基类访问修饰符必须是\
  \ `public`、`private` 或 `protected`。如果没有使用访问修饰符，如果派生类是 `class`，则默认为 `private`。如果派生类是\
  \ `struct`，则认为 `public`。让我们检查使用 `public` 或 `private` 访问的影响。（`protected` 修饰符将在下一节中描述。）\n\
  \n### 专家提问\n\n**Q: 我在 Java 编程讨论中听过超类（superclass）和子类（subclass）这两个术语。这些术语在 C++ 中有意义吗？**\n\
  \n**A:** Java 中的 superclass 在 C++ 中称为基类（base class）。Java 中的 subclass 在 C++ 中称为派生类（derived\
  \ class）。你经常听到这两组术语应用于任何语言的类，但本书将继续使用标准的 C++ 术语。顺便说，C# 也使用基类、派生类的术语。\n\n当基类以 `public`\
  \ 方式继承时，基类的所有公共成员都成为派生类的公共成员。在所有情况下，基类的私有元素对于该类仍然是私有的，派生类的成员无法访问。例如，在下面的程序中，`B`\
  \ 的公共成员变成了 `D` 的公共成员。因此，程序的其他部分可以访问它们。\n\n![Image](img/00745.jpeg)\n\n由于 `set()`\
  \ 和 `show()` 在 `B` 中是 `public` 的，可以在 `main()` 函数中对类型为 `D` 的对象调用它们。由于 `i` 和 `j` 被指定为\
  \ `private`，它们对于 `B` 仍然是私有的。这就是为什么这一行\n\n![Image](img/00746.gif)\n\n被注释掉了。`D` 无法访问\
  \ `B` 的私有成员。\n\n公共继承的对面是私有继承。当基类以 `private` 方式继承时，基类的所有公共成员都成为派生类的私有成员。例如，接所示程序将无法编译，因为\
  \ `set()` 和 `show()` 现在都是 `D` 的私有成员，因此无法从 `main()` 调用。\n\n![Image](img/00747.jpeg)\n\
  \n复习：当基类以 `private` 方式继承时，基类的公共成员变成派生类的私有成员。这意味着它们仍然可以被派生类的成员访问，但不能被程序的其他部分访问。\n\
  \n## 关键技能 10.3 使用 protected 成员\n\n正如你所知，基类的私有成员是派生类无法访问的。这似乎意味着如果你想让派生类访问基类中的某个成员，它必须是公共的。当然，将成员变为公共会让所有代码都能访问，这可能并非所需。幸运的是，这种暗示是错误的，因为\
  \ C++ 允许你创建*保护成员*（protected member）。保护成员在类层次结构内部是公共的，但在层次结构外部是私有的。\n\n保护成员通过使用 `protected`\
  \ 访问修符创建。当类成员被声明为 `protected` 时，该成员除例外外都是私有的。例外发生在继承保护成员时。在这种情况下，基类的保护成员是可以是可以访问的。因此，通过使用\
  \ `protected`，你可以创建对类私有但仍可被派生类继承和访问的成员。`protected` 修饰符也可以用于结构体。\n\n考虑这个示例程序：\n\n\
  ![Image](img/00748.gif)\n\n在这里，由于 `D` 以 `public` 继承 `B`，且 `i` 和 `j` 被声明为 `protected`，`D`\
  \ 的函数 `setk()` 可以访问它们。如果 `i` 和 `j` 在 `B` 中被声明为 `private`，那么 `D` 将无法访问它们，程序将无法编译。\n\
  \n当基类以 `public` 方式继承时，基类的保护成员成为派生类的保护成员。当基类以 `private` 方式继承时，基类的保护成员成为派生类的私有成员。\n\
  \n`protected` 访问修饰符可以出现在类声明的任何位置，尽管它通常出现在（默认的）私有之后之后公共成员之前。因此，类声明最常见的形式是\n\n![Image](img/00749.gif)\n\
  \n当然，`protected` 是可选的。\n\n除了指定类的保护状态外，`protected` 关键字在继承基类时也可以作为访问修饰符。当基类以 `protected`\
  \ 方式继承时，基类的所有公共和保护成员都成为派生类的保护成员。例如，在之前的示例中，如果 `D` 继承 `B` 如下：\n\n![Image](img/00750.gif)\n\
  \n那么 `B` 的所有非私有成员将成为 `D` 的保护成员。\n\n\n\n\n-   1**. 当基类以私有方式被继承时，基类的公共成员将成为派生类的私有成员。这是正确还是错误？\n\
  \n-   2**. 基类的私有成员可以通过继承变为公共成员吗？\n\n-   3**. 为了让一个成员在类层次结构内部可访问，但在其他情况下为私有，你应该使用哪种访问说明符？\n\
  \n### 专家问答\n\n**Q：你能回顾一下公共（public）、保护（protected）和私有（private）吗？**\n\n**A:** 当类成员被声明为\
  \ `public` 时，程序的任何部分都可以访问它。当成员被声明为 `private` 时，只有该类的成员可以访问它。此外，派生类无法访问基类的私有成员。当成员被声明为\
  \ `protected` 时，只有该类的成员及其派生类可以访问它。因此，`protected` 允许成员被继承，但在类层次结构中仍保持私有性。\n\n当使用\
  \ `public` 继承基类时，基类的公共成员将成为派生类的公共成员，其保护成员将成为派生类的保护成员。当使用 `protected` 继承基类时，基类的公共和保护成员将成为派生类的保护成员。当使用\
  \ `private` 继承基类时，基类的公共和保护成员将成为派生类的私有成员。在所有情况下，基类的私有成员对于该基类仍然是私有的。\n\n## 构造函数与继承\n\
  \n在类层次结构中，基类和派生类都可以拥有它们自己的构造函数。这引发了一个重要问题：由哪个构造函数负责构建派生类对象？是基类中的、派生类中的，还是两者都有？答案是：基类的构造函数负责构建对象的基类部分，而派生类的构造函数负责构建派生类部分。这是合理的，因为基类对派生类中的任何元素无所不知也没有访问权限。因此，它们的构建过程必须是的。之前的示例依赖于\
  \ C++ 自动创建的默认构造函数，所以这并不是问题。但在实践中，大多数类都会定义构造函数。在这里你将看到如何处理这种情况。\n\n当只有派生类定义了构造函数时，过程非常简单：直接构建派生类对象。对象的基类部分将使用其默认构造函数自动构建。例如，这里有一个重构后的\
  \ `Triangle` 版本，它定义了一个构造函数。它还将 `style` 设置为私有，因为它现在由构造函数设置。\n\n![Image](img/00751.jpeg)\n\
  \n![Image](img/00752.jpeg)\n\n在这里，`Triangle` 的构造函数初始化了它继承的 `TwoDShape` 成员以及它自己的\
  \ `style` 字段。\n\n当基类和派生类都定义了构造函数时，过程变得复杂一些，因为基类和派生类的构造函数都必须执行。\n\n### 关键技能 10.4\
  \ 调用基类构造函数\n\n当基类有一个构造函数时，派生类必须显式调用它来初始化对象的基类部分。派生类可以通过使用派生类构造函数声明的扩展形式来调用其基类定义的构造函数。这种扩展声明的通用形式所示：\n\
  \n![Image](img/00753.gif)\n\n在这里，`base-cons` 是派生类继承的基类的名称。注意，冒号将派生类的构造函数声明与基类构造函数隔开。（如果一个类继承了多个基类，则基类构造函数之间用逗号隔开。）\n\
  \n下面的程序展示了如何向基类构造函数传递参数。它为 `TwoDShape` 定义了一个构造函数，用于初始化 `width` 和 `height` 属性。\n\n\
  ![Image](img/00754.gif)\n\n![Image](img/00755.jpeg)\n\n![Image](img/00756.gif)\n\
  \n在这里，`Triangle()` 使用参数 `w` 和 `h` 调用 `TwoDShape`，这使用这些值初始化了 `width` 和 `height`。`Triangle`\
  \ 不再自己初始化这些值。它只需要初始化对它特有的值：`style.`。这让 `TwoDShape` 能够以它选择的任何方式构建其子对象。此外，`TwoDShape`\
  \ 可以添加一些现有派生类无所知的功能，从而防止现有代码崩溃。\n\n基类定义的任何形式的构造函数都可以被派生类构造函数调用。执行的构造函数将是匹配参数的一个。例如，这里是\
  \ `TwoDShape` 和 `Triangle` 的扩展版本，它们包含了额外的构造函数：\n\n![Image](img/00757.jpeg)\n\n![Image](img/00758.jpeg)\n\
  \n![Image](img/00759.gif)\n\n![Image](img/00760.gif)\n\n这是该版本的输出：\n\n![Image](img/00761.gif)\n\
  \n#### ![Image](img/00003.jpeg) 进度检查\n\n1**. 派生类类如何执行其基类构造函数的？\n\n2**. 参数可以传递给基类构造函数吗？\n\
  \n3**. 哪个构造函数负责初始化派生对象的基类部分？\n\n### 项目 10-1 扩展 Vehicle 类\n\n`TruckDemo.cpp`\n\n\
  该项目创建了在 8 中首次开发的 `Vehicle` 类的子类。你应该记得，`Vehicle` 封装了有关车辆的信息，包括载客量、燃料容量和油耗率。我们可以使用\
  \ `Vehicle` 类作为起点来开发专门的类。例如，一种车辆是卡车。卡车的一个重要属性是货物容量。因此，为了创建一个 `Truck` 类，你可以继承 `Vehicle`\
  \ 并添加一个存储容量的实例变量。在这个项目中，你将创建 `Truck` 类。在此过程中，`Vehicle` 中的实例变量变为私有，并提供访问函数来获取它们的值。\n\
  \n#### 步骤说明\n\n1. 创建名为 `TruckDemo.cpp` 的文件，并将 8 中 `Vehicle` 的最后实现复制到文件中。\n2. 如下所示创建\
  \ `Truck` 类：\n\n![Image](img/00762.gif)\n\n在这里，`Truck` 继承 `Vehicle`，添加了 `cargocap`\
  \ 成员。因此，`Truck` 包含了由 `Vehicle` 定义的所有通用属性。\n3. 这里是演示 `Truck` 类的完整程序：\n\n![Image](img/00763.gif)\n\
  \n![Image](img/00764.gif)\n\n4. 该程序的输出所示：\n\n![Image](img/00765.gif)\n\n5. 许多其他类型的类都可以从\
  \ `Vehicle` 派生。例如，下面的骨架创建了一个存储车辆离地隙隙越野类：\n\n![Image](img/00766.gif)\n\n\n\n\n到目前为止，我们一直在使用仅包含一个基类和一个派生类的简单类层次结构。然而，你可以构建包含任意层数继承的层次结构。如所述，将一个派生类作为另一个类的基类是完全可以的。例如，给定三个名为\
  \ `A`、`B` 和 `C` 的类，`C` 可以派自 `B`，而 `B` 又派自 `A`。当出现这种情况时，每个派生类都会继承其所有基类中的所有特征。在这种情况下，`C`\
  \ 继承了 `B` 和 `A` 的所有方面。\n\n为了了解多级层次结构的用途，请考虑以下程序。在程序中，派生类 `Triangle` 被用作基类来创建一个名为\
  \ `ColorTriangle` 类。`ColorTriangle` 继承了 `Triangle` 和 `TwoDShape` 的所有特征，并添加了一个名为\
  \ `color` 的字段，用于存储三角形的颜色。\n\n![Image](img/00767.jpeg)\n\n![Image](img/00768.jpeg)\n\
  \n![Image](img/00769.jpeg)\n\n![Image](img/00770.gif)\n\n该程序的输出所示：\n\n![Image](img/00771.gif)\n\
  \n由于继承的引入，`ColorTriangle` 可以利用之前定义的 `Triangle` 和 `TwoDShape` 类，仅添加其自身特定应用所需要的额外信息。这就是继承的价值所在；它允许了代码的重用。\n\
  \n这个示例说明了另一个重要点。在类层次结构中，如果基类构造函数需要参数，那么所有派生类都必须将这些参数“向上层传递”。无论派生类本身是否需要参数，这一点都是成立的。\n\
  \n### 关键技能 10.6 继承多个基类\n\n在 C++ 中，一个派生类可以同时继承两个或多个基类。例如，在这个短程序中，`D` 同时继承了 `B1` 和\
  \ `B2`：\n\n![Image](img/00772.jpeg)\n\n如该示例所示，要导致继承多个基类，你必须使用逗号分隔的列表。此外，务必为每个继承的基类使用访问修饰符。\n\
  \n### 关键技能 10.7 构造函数和析构函数的执行时机\n\n由于基类、派生类或两者都可以包含构造函数和/或析构函数，因此理解它们的执行顺序非常重要。具体来说，当一个派生类对象产生时，构造函数按什么顺序调用？当对象消失时，析构函数按什么顺序被调用？为了回答这些问题，让我们从这个简单的程序开始：\n\
  \n![Image](img/00773.gif)\n\n如 `main()` 中的注释所示，该程序简单地构造并销毁了一个名为 `ob` 的对象，其类型为 `D`。执行时，该程序显示：\n\
  \n![Image](img/00774.gif)\n\n如输出所示，首先执行 `B` 的构造函数，然后执行 `D` 的构造函数。接下来（由于 `ob` 在程序中被立即销毁），调用\
  \ `D` 的析构函数，然后是 `B` 的析构函数。\n\n\n\n\n## 虚函数基础\n\n`virtual function`（虚函数）是指在基类中声明为\
  \ `virtual` 在一个或多个派生类中重新定义的函数。因此，每个派生类都可以有其自己的虚函数版本。虚函数的趣味性之处在于，当使用基类指针调用它时会发生什么。当通过基类指针调用虚函数时，C++\
  \ 会根据指针所指向对象的 `type`（类型）来决定调用哪个版本的函数。这种确定是在`at runtime`（运行时）完成。因此，当指向不同的对象时，会执行不同版本的虚函数。换句话说，是所指向的\
  \ `object`（对象）类型（而不是指针的类型）决定了将执行哪个版本的虚函数。因此，如果基类包含一个虚函数，并且从该基类派生了两个或多个不同的类，那么当通过基类指针指向不同类型的对象时，就会执行不同版本的虚函数。通过基类引用调用虚函数时也会产生相同的效果。\n\
  \n你在基类内部通过在函数声明前加上 `virtual` 关键字来将函数声明为 `virtual`。当派生类重新定义虚函数时，不需要重复 `virtual` 关键字（尽管这样做也不会报错）。\n\
  \n包含虚函数的类被称为 `polymorphic class`（多态类）。该术语也适用于继承了包含虚函数的基类的类。\n\n以下程序演示了虚函数：\n\n![Image](img/00777.jpeg)\n\
  \n![Image](img/00778.gif)\n\n该程序产生以下输出：\n\n![Image](img/00779.gif)\n\n让我们详细检查程序以理解它是如何工作的。\n\
  \n正如你所看到的，在 `B` 中，函数 `who()` 被声明为虚。这意味着函数可以被派生类重新定义。在 `D1` 和 `D2` 内部，`who()` 根据每个类进行了重新定义。在\
  \ `main()` 中，声明了四个变量：`base_obj` 是类型为 `B` 的对象；`p` 是指向 `B` 对象的指针；`D1_obj` 和 `D2_obj`\
  \ 是两个派生类的对象。接下来，将 `base_obj` 的地址赋值给 `p`，并调用 `who()` 函数。由于 `who()` 被声明为虚函数，C++ 会在运行时根据\
  \ `p` 指向的对象的类型决定执行哪个版本的 `who()`。在这种情况下，`p` 指向一个类型为 `B` 的对象，因此执行的是在 `B` 中声明的 `who()`\
  \ 版本。接下来，将 `D1_obj` 的地址赋值给 `p`。记得基类指针可以引用任何派生类的对象。现在，当调用 `who()` 时，C++ 再次检查 `p`\
  \ 指向什么类型的对象，并根据该类型决定调用哪个版本的 `who()`。由于 `p` 指向一个类型为 `D1` 的对象，使用了该版本的 `who()`。同样，当将\
  \ `D2_obj` 的地址赋值给 `p` 时，执行在 `D2` 内部定义的 `who()` 版本。\n\n**回顾：** 当通过基类指针调用虚函数时，实际执行的虚函数版本是在运行时由指向的对象类型决定的。\n\
  \n虽然虚函数通常通过基类指针调用，但也可以使用标准的点运算符语法以普通方式调用虚函数。这意味着在前面的示例中，使用以下语句访问 `who()` 在语法上是正确的：\n\
  \n![Image](img/00780.gif)\n\n然而，这种方式调用虚函数会忽略它的多态属性。只有当通过基类指针（或引用）访问虚函数时，才能实现运行时多态。\n\
  \n起初，在派生类中重新定义虚函数似乎是函数重载的一种特殊形式。然而，事实并非如此。事实上，这两个过程从根本上是不同的。首先，重载函数必须在类型和/或数量上不同，而重新定义的虚函数必须具有相同的类型和参数数量。事实上，虚函数及其重新定义的原型必须完全相同。如果原型不同，则该函数被简单地视为重载，并丢失其虚函数本质。另一个限制是，虚函数必须是其定义类的成员，而不是该类的友元（friend）。然而，虚函数可以是另一个类的友元。此外，析构函数可以是虚的，但构造函数不可以，这是允许的。\n\
  \n由于重载普通函数与重新定义虚函数之间的限制和差异，使用 `overriding`（重写）一词来描述虚函数的重新定义。\n\n# 虚函数会被继承\n\n一旦函数被声明为虚函数，无论它经过多少层派生类，都会一直是虚函数。例如，如果\
  \ `D2` 派自 `D1` 而不是 `B`（如下例所示），那么 `who()` 仍然是虚的：\n\n![Image](img/00781.gif)\n\n当派生类没有重写虚函数时，将使用基类中定义的函数。例如，尝试上述程序的版本。在这里，`D2`\
  \ 没有重写 `who()`：\n\n![Image](img/00782.gif)\n\n![Image](img/00783.gif)\n\n程序现在输出以下内容：\n\
  \n![Image](img/00784.gif)\n\n由于 `D2` 没有重写 `who()`，而是使用了在 `B` 中定义的 `who()` 版本。\n\n\
  请记住，虚函数的继承特性是层次化的。因此，如果将前面的示例更改为 `D2` 派自 `D1` 而不是 `B`，那么当对类型为 `D2` 的对象调用 `who()`\
  \ 时，执行的不是 `B` 内部的 `who()`，而是 `D1` 中声明的 `who()` 版本，因为它是离 `D2` 最近的类。\n\n# 为什么需要虚函数？\n\
  \n正如前面所述，虚函数结合派生类型允许 C++ 支持运行时多态。多态对于面向对象的编程至关重要，因为它允许通用类指定所有该类派生类共有的函数，同时允许派生类定义这些函数的部分或全部的具体实现。这种想法有时可以表述为：基类规定了派自该类的对象将拥有的通用\
  \ `interface`（接口），但允许派生类定义实现该接口的实际 `method`（方法）。这就是为什么“一种接口，多种方法”这个短语经常被描述多态。\n\n\
  成功应用多态的关键之一是理解基类和派生类形成了一个层次结构，该结构从高泛化到低泛化（从基类到派生类）。设计良好的情况下基类提供了派生类可以直接使用的所有元素。它还定义了派生类必须自行实现的函数。这允许派生类具有定义自己方法的灵活性，同时强制执行了一致的接口。也就是说，由于接口的形式是由基类定义的，因此任何派生类都共享该公共接口。因此，虚函数的使用使得基类能够定义所有派生类将使用的通用接口。\n\
  \n\n\n\n\n到此为止，你可能在质问自己，为什么具有多个实现的一致接口是重要的。答案再次可以追溯到面向对象编程的核心驱动力：它帮助程序员处理日益变得复杂的程序。例如，如果你正确地开发了程序，那么你就知道从基类派生出的所有对象都以相同的通用方式进行访问，即使具体的操作在不同的派生类之间会有所不同。这意味着你只需要处理一个接口，而不是几个。此外，你的派生类可以自由地使用基类提供的任何或所有功能。你不需要重新发明这些元素。\n\
  \n接口与实现的分离允许类库的创建，这些库可以由第三方提供。如果这些库实现得正确，它们将提供一个通用接口，你可以用它派生出自己的类来满足你的特定需求。例如，微软基础类（`MFC`）和较新的\
  \ `.NET Framework` Windows Forms 类库都支持 Windows 编程。通过使用这些类，你的程序可以继承 Windows 程序所需的大部分功能。你只需要添加应用程序特有的功能。这在编写复杂系统时是一个巨大的优势。\n\
  \n## 应用虚函数\n\n为了更好地理解虚函数的威力，我们将它应用于 `TwoDShape` 类。在之前的示例中，每个派生自 `TwoDShape` 的类都定义了一个名为\
  \ `area()` 的函数。这表明，将 `area()` 变为 `TwoDShape` 类的虚函数可能更好，允许每个派生类重写它，从而定义该类封装的形状类型如何计算面积。下面的程序就是这样做。为了方便起见，它还给\
  \ `TwoDShape` 添加了一个名称字段。（这使得演示类更容易。）\n\n![Image](img/00785.jpeg)\n\n![Image](img/00786.jpeg)\n\
  \n![Image](img/00787.jpeg)\n\n![Image](img/00788.jpeg)\n\n程序的输出显示在此：\n\n![Image](img/00789.gif)\n\
  \n让我们仔细检查这个程序。首先，`area()` 在 `TwoDShape` 类中被声明为 `virtual`，并被 `Triangle` 和 `Rectangle`\
  \ 重写。在 `TwoDShape` 内部，`area()` 被赋予了一个占位实现，仅仅告知用户该函数必须由派生类重写。每次对 `area()` 的重写都提供了一个适用于派生类封装的对象类型的实现。因此，如果你实现一个椭圆类，那么\
  \ `area()` 将计算椭圆的面积。\n\n在之前的程序中还有另一个重要特征。注意 `main()` 中，`shapes` 被声明为指向 `TwoDShape`\
  \ 对象的指针数组。然而，该数组的元素被赋值为指向 `Triangle`、`Rectangle` 和 `TwoDShape` 对象的指针。这是有效的，因为基类指针可以指向派生类对象。程序随后遍历数组，显示每个对象的信息。虽然非常简单，但它说明了继承和虚函数的强大之处。基类指针所指向的对象的类型在运行时确定的，并据此进行相应操作。如果一个对象派生自\
  \ `TwoDShape`，那么可以通过调用 `area()` 获取其面积。无论使用何种类型的形状，此项操作的接口都是相同的。\n\n#### ![Image](img/00003.jpeg)\
