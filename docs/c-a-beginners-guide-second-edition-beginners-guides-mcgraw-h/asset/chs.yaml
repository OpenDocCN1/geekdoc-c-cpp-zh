  \n![Image](img/00546.gif)\n\n5. 程序的输出所示：\n\n![Image](img/00547.gif)\n\n### 关键技能\
  \ 7.9 ![Image](img/00548.gif) 运算符\n\nC++ 最令人迷人的运算符之一是 `?`。`?` 运算符通常用于替换此类 `if-else`\
  \ 语句。`?` 运算符被称为三元运算符，因为它需要三个操作数。它采取的通用形式为：\n\n```\ncondition ? expression1 : expression2\n\
  ```\n\n`?` 的结果取决于 `condition`。如果 `condition` 为真，则执行 `expression1`；如果为假，则执行 `expression2`。使用\
  \ `if-else` 语句编写相同的代码如下：\n\n```\nif (condition) {\n    result = expression1;\n}\
  \ else {\n    result = expression2;\n}\n```\n\n这里是 `?` 的另一个例子。该程序进行除法，但允许除以零。\n\n\
  ![Image](img/0050.gif)\n\n在这里，如果 `j` 非零，则 `i` 除以 `j`，并将结果赋值给 `result`。否则，调用 `div_zero()`，并将零赋值给\
  \ `result`。\n\n## 关键技能 7.10 逗号运算符\n\n另一个有趣的 C++ 运算符是逗号。你已经在 `for` 循环中见过逗号的示例，它被允许用于初始化或增加语句。然而，逗号可以作为表达式的一部分。它将多个表达式连接在一起。逗号列表的值是最后一个表达式的值。这意味着其他表达式的值将被丢弃。右侧的值将成为整个逗号表达式的值。例如：\n\
  \n![Image](img/0051.gif)\n\n首先给 `count` 赋值 19，给 `incr` 赋值 10，然后 `count` 加 1，最后将整个逗号表达式的值\
  \ 20 赋值给 `var`。括号是必要的，因为逗号运算符的优先级低于赋值运算符。\n\n为了看到逗号的效果，请尝试运行以下程序：\n\n![Image](img/0052.gif)\n\
  \n该程序在屏幕上打印“1010”。原因如下：`j` 从值 10 开始。然后 `j` 递增到 11。接下来，`j` 加上 100。最后，`j`（仍为 11）加上\
  \ 999，得到结果 1010。\n\n从本质上，逗号的作用是引起一系列操作。当它在赋值语句的右侧使用时，赋值的值是逗号列表中最后一个表达式的值。在某些情况下，你可以将逗号运算符理解为英语中“do\
  \ this and this and this”短语中“and”词的含义。\n\n#### ![Image](img/00003.jpeg) 进度检查\n\n\
