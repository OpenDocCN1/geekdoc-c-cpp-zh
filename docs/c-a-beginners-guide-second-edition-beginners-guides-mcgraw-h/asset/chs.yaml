  \ 11.9 非格式化与二进制 I/O\n\n虽然格式化地读写文件非常方便，但并非总是如此。当你需要处理非格式化数据时，应以二进制模式打开文件。在执行格式化操作时，会发生字符转换。使用\
  \ `ios::binary` 标志打开文件可以避免这些转换。\n\n要读写块数据，使用 `read()` 和 `write()` 成员函数。\n\n####\
  \ 使用 get() 和 put()\n\n`get()` 函数有多种形式，但最常用的与 `put()` 形式如下：\n\n```cpp\nistream &get(char\
  \ *buf);\nostream &put(char *);\n```\n\n`get()` 函数从流中读取单个字符并存入缓冲区。`put()` 函数将缓冲区中的字符写入流。\n\
  \n`get()` 还可以读取直到遇到定界符：\n\n![Image](img/00836.gif)\n\n在 `while` 循环中，有更紧凑的写法：\n\n\
  ![Image](img/00837.gif)\n\n此程序使用 `put()` 向文件写入字符串：\n\n![Image](img/00838.gif)\n\n\
  执行此程序后，文件将包含字符串“hello there”并跟一个换行符。\n\n\n\n第一种形式将字符读入 `buf` 指向的数组中，直到读取了 `num−1`\
  \ 个字符、发现换行符或遇到文件末尾为止。`buf` 指向的数组将由 `get()` 加上空字符终止符。如果在输入流中遇到换行符，它*不会*被提取。相反地，它将保留在流中，直到下一次输入操作。\n\
  \n第二种形式将字符读入 `buf` 指向的数组中，直到读取了 `num−1` 个字符、发现了由 `delim` 指定字符或遇到文件末尾为止。`buf` 指向的数组将由\
  \ `get()` 加上空字符终止符。如果在输入流中遇到分隔符，它*不会*被提取。相反地，它将保留在流中，直到下一次输入操作。\n\n`get()` 的第三种重载形式返回流中的下一个字符。如果遇到文件末尾，它将返回\
  \ `EOF`（一个表示文件结束的值）。`EOF` 是由 `<iostream>` 定义的。\n\n`get()` 的一个良好用途是读取包含空格的字符串。如你所知，当你使用\
  \ `>>` 读取字符串时，它在遇到第一个空白字符时就会停止读取。这使得 `>>` 对于读取包含空格的字符串毫无用。然而，你可以通过使用 `get(buf, num)`\
  \ 来解决这个问题，如下程序所示：\n\n![Image](img/00840.gif)\n\n在这里，`get()` 的分隔符允许默认为换行符。这使得 `get()`\
  \ 的行为非常类似于标准的 `gets()` 函数。\n\n### getline()\n\n另一个执行输入的函数是 `getline()`。它是每个输入流类的成员函数。它的原型显示在此处：\n\
  \n```\nistream &getline(char **buf*, streamsize *num);\nistream &getline(char **buf*,\
  \ streamsize *num*, char *delim);\n```\n\n第一种形式将字符读入 `buf` 指向的数组中，直到读取了 `num–1`\
  \ 个字符、发现换行符或遇到文件末尾为止。`buf` 指向的数组将由 `getline()` 加上空字符终止符。如果在输入流中遇到换行符，它会被提取，但不会放入\
  \ `buf` 中。\n\n第二种形式将字符读入 `buf` 指向的数组中，直到读取了 `num−1` 个字符、发现了由 `delim` 指定字符或遇到文件末尾为止。`buf`\
  \ 指向的数组将由 `getline()` 加上空字符终止符。如果在输入流中遇到分隔符，它会被提取，但不会放入 `buf` 中。\n\n如你所示，`getline()`\
  \ 的两个版本与 `get()` 的 `get(buf, num)` 和 `get(buf, num, delim)` 版本几乎相同。两者都从输入中读取字符并放入\
  \ `buf` 指向的数组中，直到读取了 `num–1` 个字符或遇到分隔符。`get()` 和 `getline()` 的区别在于 `getline()` 会读取并从输入流中移除分隔符；而\
  \ `get()` 不。\n\n### 检测 EOF\n\n你可以使用成员函数 `eof()` 来检测何时到达文件末尾，该函数的原型如下：\n\n```\nbool\
  \ eof( );\n```\n\n当到达文件末尾时它返回 true；否则返回 false。\n\n### peek() 和 putback()\n\n你可以使用\
  \ `peek()` 获取输入流中的下一个字符，而不将其从流中移除。它的原型如下：\n\n```\nint peek( );\n```\n\n`peek()`\
  \ 返回流中的下一个字符，如果遇到文件末尾则返回 `EOF`。该字符包含在返回值的低字节中。\n\n你可以使用 `putback()` 将最后读取的字符返回给流。它的原型显示在此处：\n\
  \n```\nistream &putback(char c);\n```\n\n其中 `c` 是最后读取的字符。\n\n### flush()\n\n执行输出时，数据不会立即写入与流关联的物理设备。相反，信息存储在内部缓冲区中，直到缓冲区填满。只有那时，缓冲区的内容会被写入磁盘。然而，你可以通过调用\
  \ `flush()` 在缓冲区填满之前强制将信息物理写入磁盘。它的原型显示在此处：\n\n```\nostream &flush( );\n```\n\n当程序将在恶劣环境中使用（例如经常发生停电的情况）时，调用\
  \ `flush()` 可能是必要的。\n\n**注意** ![Image](img/00070.gif)\n\n关闭文件或终止程序也会刷新所有缓冲区。\n\n\
