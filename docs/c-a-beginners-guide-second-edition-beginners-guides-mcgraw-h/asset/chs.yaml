  这是一个示例运行。（具体的值可能与这些不同。）\n\n![Image](img/00301.gif)\n\n## 指针比较\n\n指针可以使用关系运算符进行比较，如\
  \ `==`、`<` 和 `>`。通常为了让指针比较的结果具有意义，两个指针之间必须存在某种关系。例如，它们可能指向同一个数组内的元素。（你将在项目 4-2 中看到这种示例。）然而，还有另一种类型的指针比较：任何指针都可以与空指针（零）进行比较。\n\
  \n## 进度检查\n\n1. 所有指针算术都是相对于 _____________ 进行的。\n2. 假设 `double` 类型是 8 个字节，当 `double`\
  \ 指针递增时，其值增加了多少？\n3. 通常，两个指针在什么情况下可以有意义地比较？\n\n## 关键技能 4.11 指针与数组\n\n在 C++ 中，指针和数组之间存在紧密的关系。事实上，指针和数组经常是可以互换的。考虑以下片段：\n\
  \n![Image](img/00302.gif)\n\n\n\n在这里，`str` 是一个包含 80 个字符的数组，`p1` 是一个字符指针。然而，我们感兴趣的是第三行。在这一行中，`p1`\
  \ 被赋值为 `str` 数组第一个元素的地址。（也就是说，在赋值后，`p1` 将指向 `str[0]`。）原因如下：在 C++ 中，使用不带索引的数组名会生成一个指向数组第一个元素的指针。因此，该赋值语句\n\
  \n![Image](img/00303.gif)\n\n将 `str[0]` 的地址赋值给 `p1`。这是一个至关重要的理解理解点：当在表达式中使用不带索引的数组名时，它会产生一个指向数组第一个元素的指针。\n\
  \n由于在赋值后，`p1` 指向了 `str` 的开头，你可以使用 `p1` 来访问数组中的元素。例如，如果你想访问 `str` 中的第五个元素，可以使用\n\n\
  ![Image](img/00304.gif)\n\n或者\n\n![Image](img/00305.gif)\n\n这两条语句都获取了第五个元素。记住，数组索引从零开始，所以当对\
  \ `str` 进行索引时，使用 4 来访问第五个元素。指针 `p1` 也被加了 4 来获取第五个元素，因为 `p1` 目前指向 `str` 的第一个元素。\n\
  \n`p1+4` 外围的括号是必要的，因为 `*` 操作的优先级高于 `+` 操作。如果没有这些括号，表达式将首先找到 `p1` 所指向的值（数组中的第一个位置），然后对其加\
  \ 4。\n\n实际上，C++ 允许通过两种方法访问数组元素：`指针算术`和`数组索引`。这非常重要，因为指针算术有时比数组索引更快——尤其是当你以严格的顺序顺序访问数组时。由于速度在编程中通常是一个考虑因素，因此在\
  \ C++ 程序中，使用指针访问数组元素是非常常见的。此外，你还有时可以通过使用指针而不是数组索引来编写出更紧凑的代码。\n\n这里有一个示例演示了使用数组索引和指针算术访问数组元素的区别。我们将创建两个版本的程序，用于反转字符串中字母的大小写。第一个版本使用数组索引。第二个版本使用指针算术。第一个版本所示：\n\
