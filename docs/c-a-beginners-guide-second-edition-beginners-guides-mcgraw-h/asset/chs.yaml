  \ 进度检查\n\n**1**. 非成员二元运算符函数有多少个参数？\n\n**2**. 使用非成员运算符重载 `++` 时，必须如何传递操作数？\n\n**3**.\
  \ 使用友元运算符函数的一个优点是允许使用内置类型（如 **int**）作为左操作数。对还是错？\n\n\n\n\n重载运算符应用于其定义所在的类时的行为，不需要与该运算符应用于\
  \ C++ 内置类型时的默认用法有任何关系。例如，应用于 `cout` 和 `cin` 的 `<<` 和 `>>` 运算符，与应用于整数类型的相同运算符几乎没有共同点。然而，为了代码的结构和可读性，重载运算符应当尽可能反映该运算符原始使用的精神。例如，相对于\
  \ `ThreeD` 而言，`+` 在概念上与相对于整数类型的 `+` 相似。如果在定义某个类的 `+` 运算符时，使其行为更像你所预期的 `||` 运算符的操作，那么这样做将几乎没有用处。这里的核心概念是，尽管你可以赋予重载运算符任何你含义，但为了清晰起见，新含义与其原始含义相关是最好的。\n\
  \n### 专家问答\n\n**问：重载关系运算符时，有什么需要考虑的特殊问题吗？**\n\n**答：重载关系运算符（如 `==` 或 `<`）是一个直接的过程。但是有一个小问题。如你所知，重载运算符函数通常返回其重载所属的类对象。然而，重载的关系运算符通常返回\
  \ `true` 或 `false`。这与关系运算符的正常用法一致，并允许重载的关系运算符用于条件表达式。在重载逻辑运算符时也遵循同样的原理。\n\n为了向你展示如何实现重载的关系运算符，以下函数相对于\
  \ `ThreeD` 类重载了 `==`：\n\n![Image](img/00710.gif)\n\n一旦实现了 `operator==()`，以下代码段就是完全有效的：\n\
  \n![Image](img/00711.gif)\n\n重载运算符存在一些限制。首先，你不能更改任何运算符的优先级。其次，你不能更改运算符所需的操作数数量，尽管你的运算符函数可以选择忽略其中一个操作数。最后，除了函数调用运算符外，运算符函数不能有默认参数。\n\
  \n几乎所有的 C++ 运算符都可以被重载。这包括特化运算符，例如数组索引运算符 `[]`、函数调用运算符 `()` 和 `->` 运算符。你不能重载的运算符在此所示：\n\
  \n![Image](img/00712.gif)\n\n`.*` 是一个特殊用途的运算符，其用法超出了本书的论述范围。\n\n## 项目 9-1 创建集合类\n\
  \n`Set.cpp`\n\n重载运算符可以帮助你创建能够完全集成到 C++ 编程环境中的类。考虑这一点：通过定义必要的运算符，你使得一个类类型在程序中的方式与使用内置类型完全相同。你可以通过运算符对该类的对象进行操作，并在表达式中使用该类的对象。为了说明将新类创建并集成到\
  \ C++ 环境中，本项目创建一个名为 `Set` 的类，它定义了一个集合类型。\n\n在开始之前，准确理解我们所说的“集合”至关重要。对于本项目而言，集合是一个唯一元素的集合。也就是说，在任何给定集合中，没有两个元素是相同的。集合成员的顺序是不紧要的。因此，集合\n\
  \n![Image](img/00713.gif)\n\n与集合\n\n![Image](img/00714.gif) 是相同的。\n\n集合也可以为空。\n\n\
  集合支持许多操作。我们将实现的是：\n\n![Image](img/00157.jpeg) 向集合中添加元素\n\n![Image](img/00157.jpeg)\
  \ 从集合中移除元素\n\n![Image](img/00157.jpeg) 集合并集\n\n![Image](img/00157.jpeg) 集合差集\n\n\
  向集合中添加元素和从集合中移除元素是自言易懂的操作。另外两个需要一些解释。\n\n两个集合的*并集*是一个包含两个集合中所有元素的集合。（当然，不允许有重复元素。）我们将使用\
  \ `+` 运算符来执行集合并集。\n\n两个集合的*差集*是一个包含第一个集合中但不属于第二个集合的元素的集合。我们将使用 `−` 运算符来执行集合差集。例如，两个集合\
  \ `S1` 和 `S2`，该语句从 `S1` 中移除 `S2` 的元素，并将结果放入 `S3`：\n\n![Image](img/00715.gif)\n\n\
  如果 `S1` 和 `S2` 相同，则 `S3` 将为空集。\n\n`Set` 类还将包含一个名为 `isMember()` 的函数，用于确定指定元素是否为给定集合的成员。\n\
