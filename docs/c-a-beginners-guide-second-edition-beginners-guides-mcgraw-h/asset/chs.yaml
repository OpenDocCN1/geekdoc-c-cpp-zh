  \n![Image](img/00231.gif)\n\n`nums` 看起来像这样：\n\n![Image](img/00232.gif)\n\n数组在编程中很常见，因为它们让你能够轻松处理一组相关变量。这里有一个示例。以下程序创建一个包含十个元素的数组，并为每个元素分配一个值。然后它计算这些值的的平均值，并找到最小值和最大值。\n\
