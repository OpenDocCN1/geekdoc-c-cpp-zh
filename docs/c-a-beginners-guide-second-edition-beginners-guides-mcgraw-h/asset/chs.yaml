  \n![Image](img/00142.gif)\n\n### 2 模块掌握情况\n\n**1**. C++ 支持哪些类型的整数？\n\n**2**. 默认情况下\
  \ `12` 是什么类型？\n\n**3**. `bool` 变量可以取哪些值？\n\n**4**. `long` 整数类型是什么？\n\n**5**. 什么转义序列产生制表符？什么产生铃？\n\
