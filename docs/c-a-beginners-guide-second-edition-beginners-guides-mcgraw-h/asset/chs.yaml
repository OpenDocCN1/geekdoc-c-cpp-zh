  \n### 关键技能 12.4 动态分配\n\nC++ 程序在计算机主内存中存储信息主要有两种方式。第一种是通过使用变量。变量提供的存储空间在编译时是固定的，在程序执行期间无法更改。存储信息的第二种方法是使用\
  \ C++ 的动态分配系统。在这种方法中，数据的存储空间根据需要从你的程序（及其永久存储区域）与栈之间的空闲内存区域进行分配。该区域被称为*堆*（*heap*）。（图\
  \ 12-1 从概念上展示了 C++ 程序在内存中是如何显示的。）\n\n![Image](img/00899.gif)\n\n**图 12-1** C++ 程序中内存使用的概念视图\n\
  \n动态分配的存储是在运行时确定的。因此，动态分配使得你的程序能够在执行期间创建其所需的变量。它可以根据情况创建任意数量或或少的变量。动态分配通常用于支持如链表、二叉树和稀疏数组等数据结构。当然，你可以在任何你认为有价值的地方使用动态分配。出于各种目的的动态分配是几乎所有真实世界程序的重要部分。\n\
  \nC++ 提供了两个动态分配运算符：`new` 和 `delete`。`new` 运算符分配内存并返回指向该内存起始位置的指针。`delete` 运算符释放之前使用\
  \ `new` 分配的内存。`new` 和 `delete` 的通用形式在此所示：\n\n![Image](img/00900.gif)\n\n在这里，`p_var`\
  \ 是一个指针变量，接收一个指向内存的指针，该内存足够容纳一个 `type` 类型的项目。\n\n由于堆是有限的，它可能会被耗尽。如果没有足够的可用内存来满足分配请求，则\
  \ `new` 将失败并产生 `bad_alloc` 异常。该异常定义在头文件 `<new>` 中。你的程序应该处理此异常并在发生失败时采取适当措施。如果你的程序没有处理此异常，那么你的程序将被终止。\n\
  \n如上述，`new` 在失败时的行为是由标准 C++ 规定的。问题是，某些旧版编译器会以不同的方式实现 `new`。当 C++ 刚发明时，`new` 在失败时返回一个空指针。后来，这被更改为让\
  \ `new` 在失败时抛出异常，如上所述。如果你正在使用旧版编译器，请检查你编译器的文档，以查看它是具体如何实现 `new` 的。\n\n由于标准 C++ 规定\
  \ `new` 在失败时产生异常，因此书中的代码是这样编写的。如果你的编译器以不同的方式处理分配失败，那么你需要进行相应的更改。\n\n这里是一个分配内存来存储整数的程序：\n\
  \n![Image](img/00901.gif)\n\n该程序为 `p` 分配了堆中的一个地址，该地址足够容纳一个整数。然后它为该内存赋值 100 并在屏幕上显示内存的内容。最后，它释放了动态分配的内存。\n\
  \n`delete` 运算符必须与之前通过 `new` 分配的有效指针一起使用。使用 `delete` 使用任何其他类型的指针都是未定义的，并且几乎肯定会导致严重问题，例如系统崩溃。\n\
  \n#### 初始化已分配的内存\n\n你可以通过在 `new` 语句的类型名之后放置一个初始化器，将分配的内存初始化为某些已知值。这里是包含初始化时的 `new`\
  \ 通用形式：\n\n![Image](img/00902.gif)\n\n当然，初始化器的类型必须与为分配内存所需的数据类型兼容。\n\n### 专家问答\n\
  \n**Q：我看到一些 C++ 代码使用 `malloc()` 和 `free()` 函数进行动态分配。**\n\n**A：** C 语言不支持 `new` 和\
  \ `delete` 运算符。相反，它使用 `malloc()` 和 `free()` 函数来处理动态分配。`malloc()` 分配内存而 `free()`\
  \ 释放内存。C++ 也支持这些函数，你有时会在 C++ 代码中看到它们，特别是代码是从旧 C 更新而来的。然而，你应该使用 `new` 和 `delete`。`new`\
  \ 和 `delete` 不仅提供了更方便的动态分配方法，而且防止了在处理 `malloc()` 和 `free()` 时常见的某些错误。另一点：虽然没有正式规则规定这一点，但最好不要在同一个程序中混合使用\
  \ `new`/`delete` 和 `malloc()`/`free()`。无法保证它们是互兼容的。\n\n此程序赋予分配的整数一个初始值 87：\n\n![Image](img/00903.gif)\n\
