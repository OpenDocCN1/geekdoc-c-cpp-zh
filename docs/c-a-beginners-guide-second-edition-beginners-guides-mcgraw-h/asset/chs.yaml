  \n## 关键技能 7.6 typedef\n\nC++ 允许你使用 `typedef` 关键字定义新的数据类型名称。当你使用 `typedef` 时，你并不是在创建一个新的数据类型，而是为现有类型定义了一个新名称。这个过程可以帮助依赖机器的程序具有可移植性；只需更改\
