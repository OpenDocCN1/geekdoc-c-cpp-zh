  \n有一个你必须注意的数组限制。在 C++ 中，你不能将一个数组赋值给另一个数组。例如，以下操作是违法的：\n\n![Image](img/00236.gif)\n\
  \n要将一个数组的内容传输到另一个数组，你必须单独赋值每个值，如下所示：\n\n![Image](img/00237.gif)\n\n## 无边界检查\n\n\
  C++ 对数组不进行边界检查。这意味着没有任何机制阻止你越越数组的末尾。换句话说，你可以超出尺寸对数组进行索引而不产生错误。例如，以下代码会导致程序崩溃：\n\n\
  ```cpp\nint nums[5] = {1, 2, 3, 4, 5};\nnums[10] = 10;\n```\n\n## 关键技能 4.2 二维数组\n\
  \nC++ 允许多维数组。多维数组最简单的形式是二维数组。二维数组本质上是一个一维数组的列表。要声明一个大小为 10x5 的二维数组 `twoD`，你会写：\n\
  \n![Image](img/00239.gif)\n\n请仔细注意声明。与某些使用逗号分隔数组维度的语言不同，C++ 将每个维度放在它自己的括号中。同样，访问元素时，请将索引放在它们各自的括号对中。例如，对于\
  \ `twoD` 的 `[3][5]` 元素，你将使用 `twoD[3][5]`。\n\n在下一个示例中，二维数组被加载了 1 到 12 的数字。\n\n![Image](img/00240.gif)\n\
  \n在这个示例中，`nums[0][0]` 的值为 1，`nums[0][1]` 的值为 2，`nums[0][2]` 的值为 3，依此类推。`nums[2][3]`\
  \ 的值将是 12。从概念上讲，数组看起来如下所示：\n\n![Image](img/00241.gif)\n\n二维数组存储在行列矩阵中，第一个索引表示行，第二个索引表示列。这意味着当按照元素在内存中实际存储的顺序访问元素时，右侧索引的变化比左侧索引快。\n\
  \n## 关键技能 4.3 多维数组\n\nC++ 允许超过两个维度的数组。以下是多维数组声明的一般形式：\n\n![Image](img/00242.gif)\n\
