  \ `BigInt` 为 `long int` 的另一个名称。\n\n## 关键技能 7.7 位运算符\n\n由于 C++ 的设计初衷是允许完全访问计算机硬件，因此它赋予了你直接操作字节或字内位（bits）的能力。为了这一目的，C++\
  \ 包含了位运算符。*位运算*指的是对字节或字中的实际位进行测试、设置或位移，这些位对应于 C++ 的字符和整数类型。位运算不能用于 `bool`、`float`、`double`、`long\
  \ double`、`void` 或其他复杂的数据类型。位运算在许多系统级编程中非常重要，特别是当必须查询或构建设备的状态信息时。表 7-1 列出了位运算符。我们将将逐一检查每个运算符。\n\
