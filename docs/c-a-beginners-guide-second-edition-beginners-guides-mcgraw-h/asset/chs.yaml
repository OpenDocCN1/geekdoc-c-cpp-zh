  \n### 关键技能 11.11 随机访问\n\n到目前为止，文件都是顺序读取或写入的，但你也可以随机访问文件。在 C++ 的 I/O 系统中，你使用 `seekg()`\
  \ 和 `seekp()` 函数执行随机访问。它们常用的形式显示在此处：\n\n```\nistream &seekg(off_type *offset, seekdir\
  \ *origin);\nostream &seekp(off_type *offset, seekdir *origin);\n```\n\n在这里，**off_type**\
  \ 是由 **ios** 定义的整数类型，能够包含 *offset* 可能具有的最大有效值。**seekdir** 是一个具有以下值的枚举：\n\n![Image](img/00848.gif)\n\
  \n\n\n\nC++ I/O 系统管理两个与文件关联的指针。一个是 `get pointer`（读取指针），它指定下一次输入操作发生在文件的位置。另一个是 `put\
  \ pointer`（输出指针），它指定下一次输出操作发生在文件的位置。每当发生输入或输出操作时，相应的指针会自动向前移动。通过使用 `seekg()` 和 `seekp()`\
  \ 函数，可以移动这些指针并以前顺序的方式访问文件。\n\n`seekg()` 函数将关联文件的当前读取指针从指定的 `origin`（起始位置）移动 `offset`（偏移量）个字节。`seekp()`\
  \ 函数将关联文件的当前输出指针从指定的 `origin`（起始位置）移动 `offset` 个字节。\n\n通常，随机访问 I/O 只应该在那些以二进制模式打开的文件上进行。文本文件中可能发生的字符转换会导致位置请求与文件的实际内容不同步。\n\
  \n以下程序演示了 `seekp()` 函数。它允许你在命令行上指定文件名，随后跟上你想要在文件中更改的特定字节。程序随后会在指定位置写入 `X`。请注意，文件必须以读写模式打开。\n\
  \n![Image](img/00849.gif)\n\n下一个程序使用了 `seekg()`。它显示文件的内容，从你在命令行上指定的位置开始。\n\n![Image](img/00850.gif)\n\
  \n你可以使用这些函数确定每个文件指针的当前位置：\n\n```\npos_type tellg();\npos_type tellp();\n```\n\n\
  在这里，`pos_type` 是由 `ios` 定义的类型，能够容纳这两个函数返回的最大值。\n\n`seekg()` 和 `seekp()` 有重载版本，可以将文件指针移动到由\
  \ `tellg()` 和 `tellp()` 返回指定的位置。它们的原型所示：\n\n```cpp\nistream &seekg(pos_type *position);\n\
  ostream &seekp(pos_type *position);\n```\n\n#### ![Image](img/00003.jpeg) 进度检查\n\
