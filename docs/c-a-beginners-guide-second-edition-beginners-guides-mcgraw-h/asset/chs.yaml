  \n![Image](img/00562.gif)\n\n\n\n\n\n此处 `class-name` 指定了类的名称。该名称将成为一个新的类型名称，用于创建该类的对象。你也可以通过在\
  \ `object-list` 中的类声明之后立即指定它们来创建类对象，但这是可选的。一旦声明了类，就可以在需要的地方创建对象。\n\n一个类可以包含私有成员，也可以包含公共成员。默认情况下，类中定义的所有项都是私有的。这意味着它们只能由该类的其他成员访问，而不能被程序的任何其他部分访问。这是实现封装的一种方式——通过将某些数据项保持为私有，你可以紧密控制对这些特定数据的访问。\n\
  \n要将类的部分内容设为公共（即程序的其他部分可以访问），你必须在 `public` 关键字之后声明它们。在 `public` 指定符之后定义的所有变量或函数都可以被程序的其他部分访问。通常，你的程序会通过类的公共函数来访问类的私有成员。注意\
  \ `public` 关键字后面跟着一个冒号。\n\n尽管没有强制此要求的语法规则，但一个设计良好的类应该定义且仅定义一个逻辑实体。例如，存储名称和电话号码的类通常不会同时存储有关股票市场、平均降雨量、太阳黑子周期或其他无关信息。这里的重点是，设计良好的类会将逻辑上相关的信息分组。将不相关的信息放在同一个类中会迅速破坏你的代码结构！\n\
  \n让我们回顾一下：在 C++ 中，`class` 创建了一个可以用于创建对象的新数据类型。具体来说，类创建了一个逻辑框架，定义了其成员之间的关系。当你声明一个类类型的变量时，你实际上是在创建一个对象。对象具有物理存在性，是类的一个特定实例。也就是说，对象占用内存空间，而类型定义则不会。\n\
  \n### 关键技能 8.2 定义类和创建对象\n\n为了说明类，我们将演化一个封装了有关车辆（如汽车、箱货车和卡车）信息的信息的类。这个类被称为 `Vehicle`，它将存储关于车辆的三项信息：它可以承载的乘客人数、燃油箱容量以及平均油耗（每加仑英里）。\n\
  \n`Vehicle` 的第一个版本所示。它定义了三个实例变量：`passengers`、`fuelcap` 和 `mpg`。注意，`Vehicle` 不包含任何函数。因此，它目前是一个纯数据类。（随后的章节将向其添加函数。）\n\
  \n![Image](img/00564.gif)\n\n`Vehicle` 定义的实例变量说明了实例变量的般声明方式。声明实例变量的通用格式所示：\n\n```\n\
  type var-name;\n```\n\n在这里，`type` 指定变量的类型，`var-name` 是变量的名称。因此，你声明实例变量的方式与声明其他变量相同。对于\
  \ `Vehicle`，这些变量前面跟有 `public` 访问指定符。正如所解释的，这允许 `Vehicle` 外部的代码访问它们。\n\n`class` 定义创建了一个新的数据类型。在这种情况下，这个新数据类型被称为\
  \ `Vehicle`。你将使用这个名称来声明 `Vehicle` 类型的对象。记住，`class` 声明只是一个类型描述；它不会创建实际的对象。因此，之前的代码并没有导致任何\
  \ `Vehicle` 类型的对象产生。\n\n要实际创建一个 `Vehicle` 对象，只需使用声明语句，例如：\n\n![Image](img/00565.gif)\n\
