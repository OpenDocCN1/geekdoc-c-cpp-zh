  ### 使用多个 catch 语句\n\n如前所述，你可以将多个 `catch` 语句与一个 `try` 语句关联。事实上，这样做很常见。但是，每个 `catch`\
  \ 必须捕获不同类型的异常。例如，接下来的程序同时捕获了整数和字符指针。\n\n![Image](img/00862.jpeg)\n\n该程序产生以下输出：\n\
