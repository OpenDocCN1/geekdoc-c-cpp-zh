  \n![Image](img/00218.gif)\n\n## 关键技能 3.8 嵌套循环\n\n正如你在之前的一些示例中看到的，一个循环可以嵌套另一个循环内部。嵌套循环用于解决各种问题，是编程中的重要组成部分。因此，在离开\
  \ C++ 循环语句主题之前，让我们再看一个嵌套循环示例。以下程序使用嵌套的 `for` 循环来寻找 2 到 100 之间数字的因子：\n\n![Image](img/00219.gif)\n\
  \n这里是程序产生的输出部分：\n\n![Image](img/00220.gif)\n\n在程序中，外层循环 `i` 从 2 运行到 100。内层循环连续测试从\
  \ 2 到 `i` 的所有数字，打印整除 `i` 的数字。\n\n## 关键技能 3.9 使用 `goto` 语句\n\n`goto` 是 C++ 的无条件跳转语句。因此，当遇到它时，程序流会跳转到\
  \ `goto` 指定的位置。该语句多年前就不受程序员青睐了，因为它导致了“意大利面代码”的产生。然而，`goto` 偶尔仍会被使用——而且有时非常有效。本书不会对其作为一种程序控制形式的有效性做出判断。但应当说明，没有任何编程场景需要使用\
  \ `goto` 语句；它并不是完善语言所需的。相反，它是一种便利工具，如果使用得当，可以在某些编程情况下产生益处。因此，本书在这一节之外不再使用 `goto`。大多数程序员对\
  \ `goto` 主要担忧它倾向于让程序变得混乱并使其几乎不可读。然而，在某些情况下，使用 `goto` 可以澄清程序流而不是混淆它。\n\n`goto` 需要一个标签来执行操作。*标签*是一个后面跟一个冒号的有效\
  \ C++ 标识符。此外，标签必须与使用它的 `goto` 位于同一个函数中。例如，一个从 1 到 100 的循环可以使用 `goto` 和标签来编写，所示：\n\
  \n![Image](img/00221.gif)\n\n`goto` 的一个良好用途是退出深层嵌套的例程。例如，考虑以下代码段：\n\n![Image](img/00222.gif)\n\
  \n消除 `goto` 将强制执行若干额外的测试。一个简单的 `break` 语句在这里不起作用，因为它只会导致程序从最内层的循环退出。\n\n## ![Image](img/00069.jpeg)\
