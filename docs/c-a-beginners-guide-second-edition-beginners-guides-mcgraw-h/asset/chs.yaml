  \n### 项目 8-1 创建一个帮助类\n\n`HelpClass.cpp`\n\n如果有人尝试用一句话来总结类的精髓，那可能是这样的：类封装了功能。当然，有时的技巧在于知道一个“功能性”在何处结束，另一个功能性又在何处开始。作为一条通用规则，你希望你的类成为更大型应用程序的构建模块。为了做到这一点，每个类必须代表一个执行清晰划分的单一功能单元。因此，你希望你的类尽可能小——但不能再小了！也就是说，包含多余功能的类会混淆并破坏代码结构，但包含功能过少的类却是碎片化的。平衡点在哪里？正是在这一点上，编程的*科学*变成了编程的*艺术*。幸运的是，大多数程序员发现，这种平衡动作随着经验的增加而变得更容易。\n\
  \n为了开始获得这些经验，你把模块 3 中项目 3-3 的帮助系统转换为 `Help` 类。让我们看看为什么这是一个好主意。首先，帮助系统定义了一个逻辑单元。它只是显示了\
  \ C++ 控制语句的语法。因此，它的功能是紧凑且定义良好的。其次，将帮助放在类中是一种更符合美学的方法。每你想向用户提供帮助系统时，只需实例化帮助系统对象即可。最后，由于帮助被封装了，可以对其进行升级或更改而不会产生副作用。\n\
