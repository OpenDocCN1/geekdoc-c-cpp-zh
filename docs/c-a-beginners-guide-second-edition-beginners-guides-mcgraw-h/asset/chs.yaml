  \n## 第 9 ：深入了解类\n\n### 关键技能\n\n1. 重载构造函数\n2. 赋值对象\n3. 将对象传递给函数\n4. 从函数返回对象\n5. 创建拷贝构造函数\n\
  6. 使用友函数\n7. 了解结构体和联合体\n8. 理解 `this`\n9. 了解运算符重载基础\n10. 使用成员函数重载运算符\n11. 使用非成员函数重载运算符\n\
  \n\n\n\n\n本模块继续了在模块 8 中开始的关于类的讨论。它探讨了许多与类相关的话，包括构造函数重载、向函数传递对象以及返回对象。它还描述了一种特殊类型的构造函数，称为`拷贝构造函数`（copy\
  \ constructor），它在需要对象的拷贝时使用。接下来将介绍友元函数，然后是结构体、联合体以及 `this` 关键字。本模块以讨论运算符重载结束满，这是\
  \ C++ 最令人兴奋的特性之一。\n\n### 关键技能 9.1 重载构造函数\n\n尽管构造函数发挥着独特的作用，但它们与其他类型的函数并没有多区别，它们也可以被重载。要重载类的构造函数，只需声明它将采取的各种形式即可。例如，以下程序定义了三个构造函数：\n\
  \n![Image](img/00636.gif)\n\n![Image](img/00637.gif)\n\n输出所示：\n\n![Image](img/00638.gif)\n\
  \n该程序创建了三个构造函数。第一个无参数构造函数，它将 `x` 和 `y` 都初始化为零。该构造函数成为了默认构造函数，取代了 C++ 自动提供的默认构造函数。第二个接受一个参数，将该值赋值给\
  \ `x` 和 `y`。第三个构造函数接受两个参数，分别初始化 `x` 和 `y`。\n\n重载构造函数有几个层面的益处。首先，它们为你创建的类添加了灵活性，允许对象以多种方式被构造。其次，它们通过允许对象以最符合给定任务自然的方式被构造，为该类的用户提供了便利。第三，通过同时定义默认构造函数和参数化构造函数，你允许创建已初始化的和未初始化的对象。\n\
  \n## 关键技能 9.2 对象的赋值\n\n如果两个对象的类型相同（即，它们都是同一个类的对象），则可以将一个对象赋值给另一个对象。仅仅让两个类在物理上相似是不够的——它们的类型名称必须相同。默认情况下，当一个对象赋值给另一个对象时，第一个对象数据的位拷贝会被赋值给第二个对象。因此，在赋值后，两个对象将是相同的，但是独立的。以下程序演示了对象赋值：\n\
  \n![Image](img/00639.gif)\n\n![Image](img/00640.gif)\n\n该程序显示以下输出：\n\n![Image](img/00641.gif)\n\
  \n如程序所示，将一个对象赋值给另一个创建了两个包含相同值的对象。在其他方面，这两个对象仍然是完全独立的。因此，对其中一个对象数据的后续修改对另一个对象没有影响。然而，你可能需要注意副作用，副作用仍然发生。例如，如果对象\
  \ A 包含一个指向其他对象 B 的指针，那么当创建 A 的拷贝时，该拷贝也将包含一个指向 B 的字段。因此，更改 B 将影响这两个对象。在这样的情况下，你可能需要通过为类定义自定义的赋值运算符来跳过默认的位拷贝，这将在模块稍后部分解释。\n\
  \n## 关键技能 9.3 向函数传递对象\n\n对象可以像任何其他数据类型一样传递给函数。对象使用标准的 C++ 按值传递（call-by-value）参数传递约定传递函数。这意味着传递给函数的是对象的`copy`，而不是对象本身。因此，在函数内部对对象进行的更改不会影响作为函数参数使用的对象。以下程序说明了这一点：\n\
  \n![Image](img/00642.gif)\n\n![Image](img/00643.gif)\n\n输出所示：\n\n![Image](img/00644.gif)\n\
  \n如输出所示，在 `change()` 内部更改 `ob` 的值对 `main()` 中的 `a` 没有影响。\n\n### 构造函数、析构函数和对象传递\n\
  \n虽然将简单对象作为参数传递给函数是一个直接的过程，但发生了一些与构造函数和析构函数相关的意外事件。为了理解为什么，请考虑这个短程序：\n\n![Image](img/00645.gif)\n\
  \n![Image](img/00646.gif)\n\n该程序产生了以下意外之外的输出：\n\n![Image](img/00647.gif)\n\n如你所见，构造函数被调用一次（在创建\
  \ `a` 时发生），但析构函数被调用了*两次*。让我们看看为什么这样。\n\n当一个对象传递给函数时，会创建该对象的拷贝。（这个拷贝就变成了函数的参数。）这意味着产生了一个新对象。当函数终止时，参数的拷贝（即参数）会被销毁。这引出了了两个基本问题：第一，在创建拷贝时，对象的构造函数会被调用吗？第二，在拷贝销毁时，对象的析构函数会被调用吗？答案起初可能会让你感到惊讶。\n\
  \n在函数调用期间创建参数的拷贝时，普通的构造函数*没有*被调用。相反，调用的是对象的`拷贝构造函数`（copy constructor）。拷贝构造函数定义了如何创建对象的拷贝。（在模块的稍后部分，你将看到如何创建拷贝构造函数。）然而，如果类没有显式地定义拷贝构造函数，那么\
  \ C++ 会提供一个默认的。默认拷贝构造函数创建一个对象的`位`（即完全相同）拷贝。如果你仔细考虑，创建位拷贝的原因是很容易理解的。由于普通构造函数用于初始化对象的某些方面，因此不能调用它来创建已存在对象的拷贝。这种调用会改变对象的内容。在向函数传递对象时，你希望使用对象的当前状态，而不是它的初始状态。\n\
  \n然而，当函数终止且作为参数的对象拷贝被销毁时，析构函数*会被*调用。这是必要的，因为该对象已经离开了作用域。这就是为什么前面的程序有两次析构调用。第一次是\
  \ `display()` 的参数离开作用域。第二次是 `main()` 的 `a` 在程序结束时被销毁。\n\n总结一下：当创建对象的拷贝作为函数的参数时，普通的构造函数没有被调用。相反，默认拷贝构造函数创建一个位相同的拷贝。然而，当拷贝被销毁（通常是在函数返回时离开作用域）时，析构函数会被调用。\n\
  \n### 通过引用传递对象\n\n另一种向函数传递对象是通过引用。在这种情况下，传递的是对象的引用，函数直接对作为参数的对象进行操作。因此，对参数进行的更改*会*影响参数，而且通过引用传递并不适用于所有情况。但在适用的情况下，会产生两个益处。首先，由于传递的是对象的地址而不是整个对象，通过引用传递对象可以快得多且更高效。其次，通过引用传递对象时，不会产生新对象，因此不需要浪费时间构造或销毁临时对象。\n\
  \n这是一个演示通过引用传递对象的示例：\n\n![Image](img/00648.gif)\n\n![Image](img/00649.gif)\n\n输出是\n\
  \n![Image](img/00650.gif)\n\n\n\n\n在该程序中，`display()` 和 `change()` 都使用了引用参数。因此，传递的是参数的地址而不是参数的副本，函数直接对参数进行操作。例如，当调用\
  \ `change()` 时，`a` 是通过引用传递的。因此，在 `change()` 中对参数 `ob` 的修改会影响 `main()` 函数中的 `a`。此外，请注意只调用了一次构造函数和一次析构函数。这是因为程序只创建和销毁了唯一一个对象\
  \ `a`。程序不需要任何临时对象。\n\n### 传递对象时的潜在问题\n\n即使通过普通的值传递（call-by-value）参数传递机制将对象传递给函数（这种机制在理论上可以保护并隔离调用时的参数），仍然可能发生可能会影响甚至损坏作为参数的对象的副作用。例如，如果一个对象在创建时分配了某些系统资源（如内存），并在销毁时释放该资源，那么函数内部的局部副本在析构函数被调用时也会释放该相同的资源。这是一个问题，因为原始对象仍在使用该资源。这种情况通常会导致原始对象损坏。\n\
  \n解决此问题的一种方法是如上一节所示，通过引用传递对象。在这种情况下，不会创建对象的副本，因此在函数返回时不会销毁任何对象。正如所解释的，通过引用传递对象还可以加快函数调用，因为传递的只是对象的地址。然而，通过引用传递对象可能并不适用于所有情况。幸运的是还有一种更通用的解决方案：你可以创建自己的版本的拷贝构造函数（copy\
  \ constructor）。这样做可以让你精确地定义对象副本是如何创建的，从而避免上述描述的那类问题。不过，在检查拷贝构造函数之前，让我们看看另一个也能从拷贝构造函数受益的相关情况。\n\
  \n### 关键技能 9.4 返回对象\n\n正如对象可以传递给函数一样，函数也可以返回对象。要返回一个对象，首先将函数的返回类型声明为类。其次，使用标准的 `return`\
  \ 语句返回该类型的对象。以下程序有一个名为 `mkBigger()` 的成员函数。它返回一个对象，使 `val` 的值变为调用者对象值的两倍。\n\n![Image](img/00651.gif)\n\
  \n![Image](img/00652.gif)\n\n生成了以下输出：\n\n![Image](img/00653.gif)\n\n在这个示例中，`mkBigger()`\
  \ 创建了一个名为 `o` 的局部对象，其 `val` 值是调用者对象的两倍。然后该对象被函数返回并赋值给 `main()` 中的 `a`。接着 `o` 被销毁，导致显示了第一个“Destructing（析构中）”消息。但第二次析构函数的调用是如何解释的？\n\
  \n当函数返回一个对象时，会自动创建一个临时对象来持有返回值。函数实际返回的正是这个对象。在值返回后，该对象就会被销毁。这就是为什么输出在“After mkBigger()\
  \ returns.”消息之前又显示了第二个“Destructing”消息的原因。这就是正在被销毁的临时对象。\n\n与将对象传递给函数的情况一样，从函数返回对象时也存在潜在问题。在某些情况下，此临时对象的销毁可能会导致意想不到的副作用。例如，如果函数返回的对象拥有一个释放资源（如内存或文件句柄）的析构函数，那么即使赋值返回值的对象仍在使用该资源，该资源也会被释放。解决此类问题的方法涉及使用拷贝构造函数，我们将在文中介绍。\n\
  \n最后一点：函数可以通过引用返回对象，但你需要小心被引用的对象在函数终止时不会超出作用范围。\n\n### 进度检查\n\n![Image](img/00003.jpeg)\n\
  \n1**. 构造函数不能被重载。对或错？\n\n2**. 当对象以值的方式传递给函数时，会创建一个副本。这个副本在函数返回时会被销毁吗？\n\n3**. 当从函数返回一个对象时，会创建一个包含返回值的临时对象。对或错？\n\
  \n### 关键技能 9.5 创建和使用拷贝构造函数\n\n正如早些的示例所示，当对象传递给函数或从函数返回对象时，会创建该对象的副本。默认情况下，该副本是原始对象的按位克隆（bitwise\
  \ clone）。这种默认行为通常是可以接受的，但在不允许的情况下，你可以通过为类显式定义拷贝构造函数，来精确地控制对象副本是如何创建的。拷贝构造函数是一种特殊的重载构造函数，当需要对象的副本时，它会被调用。\n\
  \n首先，让我们回顾一下为什么你可能需要显式定义拷贝构造函数。默认情况下，当对象传递给函数时，会创建该对象的按位（即精确的）拷贝，并将其传递给接收该对象的函数参数。然而，在某些情况下，这种完全相同的拷贝并不是理想的。例如，如果对象使用了某种资源（如打开的文件），那么副本将与原始对象使用相同的资源。因此，如果副本对该资源进行了修改，原始对象的该资源也会随之改变！此外，当函数终止时，副本将被销毁，导致其析构函数被调用。这可能会释放原始对象仍在使用的资源。\n\
  \n类似的情况也发生在函数返回对象时。编译器会生成一个临时对象来持有函数返回值的拷贝。（这是自动完成的，你无法控制。）一旦值返回到调用程序，该临时对象就会超出作用范围，导致其析构函数被调用。然而，如果析构函数破坏了调用代码需要的内容，麻烦就会随。\n\
  \n这些问题的核心是对象的按位拷贝。为了防止这些问题，你需要精确地定义创建对象副本时发生了什么，从而避免产生的影响。你实现这一点的方法就是创建拷贝构造函数。\n\
  \n在探索拷贝构造函数的使用之前，重要的是你需要理解 C++ 定义了两种不同的情况，将一个对象的值赋予另一个对象。第一种情况是赋值。第二种情况是初始化，可以通过以下三种方式发生：\n\
  \n![Image](img/00157.jpeg) 一个对象显式初始化另一个对象，例如在声明中\n\n![Image](img/00157.jpeg) 在传递给函数时创建对象的副本\n\
  \n![Image](img/00157.jpeg) 生成临时对象时（最常见作为返回值）\n\n拷贝构造函数仅适用于初始化。拷贝构造函数不适用于赋值。\n\n\
  拷贝函数最常见的形式所示：\n\n![Image](img/00654.gif)\n\n在这里，`obj` 是指向用于初始化另一个对象的引用。例如，假设有一个名为\
  \ `MyClass` 的类，`y` 是类型为 `MyClass` 的对象，那么以下语句将调用 `MyClass` 的拷贝构造函数：\n\n![Image](img/00655.gif)\n\
  \n\n\n在前两种情况下，`y` 的引用将被传递给拷贝构造函数。在第三种情况下，由 `func2()` 返回的对象的引用将传递给拷贝构造函数。因此，当对象作为参数传递、由函数返回或在初始化中使用时，就会调用拷贝构造函数来复制该对象。\n\
  \n请记住，当一个对象赋值给另一个对象时，不会调用拷贝构造函数。例如，以下序列将不会调用拷贝构造函数：\n\n![Image](img/00656.gif)\n\
  \n再次，赋值是由赋值运算符处理的，而不是拷贝构造函数。\n\n以下程序演示了拷贝构造函数：\n\n![Image](img/00657.gif)\n\n![Image](img/00658.gif)\n\
  \n该程序显示以下输出：\n\n![Image](img/00659.gif)\n\n以下是程序运行时发生的情况：当在 `main()` 内部创建 `a` 时，它的\
  \ `copynumber` 的值由普通构造函数设置为 0。接下来，`a` 被传递给 `display()` 的 `ob`。当这发生时，会调用拷贝构造函数并创建\
  \ `a` 的副本。在此过程中，拷贝构造函数递增加了 `copynumber` 的值。当 `display()` 返回时，`ob` 离开了作用范围。这导致它的析构函数被调用。最后，当\
  \ `main()` 返回时，`a` 离开了作用范围。\n\n你可能想对上述程序进行一些实验。例如，创建一个返回 `MyClass` 对象的函数，并观察拷贝构造函数何时被调用。\n\
  \n#### ![Image](img/00003.jpeg) 进度检查\n\n- **1**. 当使用默认拷贝构造函数时，是如何创建对象的副本的？\n- **2**.\
  \ 当一个对象赋值给另一个对象时，会调用拷贝构造函数。正确还是错误？\n- **3**. 为什么你可能需要为一个类显式地定义拷贝构造函数？\n\n### 关键技能\
  \ 9.6 友元函数\n\n通常情况下，只有类的其他成员可以访问类的私有成员。然而，通过将非成员函数声明为类的*友元*（friend），可以允许非成员函数访问类的私有成员。要使一个函数成为类的友元，你需要在类声明的**public**\
  \ 部分包含其原型，并在其前面加上 **friend** 关键字。例如，在这一段代码中，`frnd()` 被声明为类 `MyClass` 的友元：\n\n![Image](img/00660.gif)\n\
  \n如你所见，`friend` 关键字位于原型其余部分之前。一个函数可以是多个类的友元。\n\n这是一个简短的示例，它使用友元函数来判断 `MyClass` 的私有字段是否有共同分母：\n\
  \n![Image](img/00661.gif)\n\n![Image](img/00662.gif)\n\n在这个示例中，`comDenom()` 函数不是\
  \ `MyClass` 的成员。然而，它仍然拥有完全访问 `MyClass` 私有成员的权限。具体来说，它可以访问 `x.a` 和 `x.b`。请注意 `comDenom()`\
  \ 是正常调用的——也就是说，不是结合对象和点运算符调用的。由于它不是成员函数，因此不需要用对象的名称进行限定。（事实上，它*不能*用对象进行限定。）通常，友元函数会接收其作为友元的类的一个或多个对象，正如\
  \ `comDenom()` 所示。\n\n虽然将 `comDenom()` 为友元而不是 `MyClass` 的成员函数并没有带来额外收益，但在某些情况下，友元函数是非常有价值的。首先，友元对于重载某些类型的运算符非常有用，正如本模块稍后描述的那样。其次，友元函数简化了某些类型\
  \ I/O 函数的创建，如第 11 节所述。\n\n友元函数可能需要的第三个原因是，在某些情况下，两个或多个类可能包含相对于你程序其他部分相互关联的成员。例如，想象两个名为\
  \ `Cube` 和 `Cylinder` 的不同类，它们定义了立方体和圆体的特征，其中其中一个特征是对象的颜色。为了让立方体和圆体的颜色能够容易比较，你可以定义一个友元函数来比较每个对象的颜色组件，如果颜色匹配则返回\
  \ true，如果不同则返回 false。以下程序说明了这一概念：\n\n![Image](img/00663.jpeg)\n\n![Image](img/00664.gif)\n\
  \n该程序产生的输出所示：\n\n![Image](img/00665.gif)\n\n注意，该程序对 `Cylinder` 类使用了*前向声明*（forward\
  \ declaration，也称为*前向引用*）。这是必要的，因为 `Cube` 内部的 `sameColor()` 声明在 `Cylinder` 定义之前就引用了它。要为类创建前向声明，只需使用程序中所所示的形式即可。\n\
  \n一个类的友元可以是另一个类的成员。例如，这里是重写的程序，使得 `sameColor()` 是 `Cube` 的成员。注意在声明 `sameColor()`\
  \ 为 `Cylinder` 的友元时使用了作用域解析运算符。\n\n![Image](img/00666.gif)\n\n![Image](img/00667.gif)\n\
  \n由于 `sameColor()` 是 `Cube` 的成员，它必须在 `Cube` 对象上调用。因此，只有 `Cylinder` 类型的对象需要传递给 `sameColor()`。\n\
  \n#### ![Image](img/00003.jpeg) 进度检查\n\n- **1**. 什么是友元函数？用什么关键字声明它？\n- **2**. 友元函数是通过对象使用对象调用的吗？\n\
  - **3**. 一个类的友元可以是另一个类的成员吗？\n\n### 关键技能 9.7 结构体与联合\n\n除了 **class** 关键字外，C++ 还提供了两种创建类类型的方法。首先，你可以创建一个*结构体*（structure）。其次，你可以创建一个*联合*（union）。这里将两者。\n\
  \n### 结构体\n\n结构体继承自 C 语言并使用 **struct** 关键字声明。**struct** 在语法上与 **class** 相似，并且创建一个类类型。在\
  \ C 语言中，**struct** 只能包含数据成员，但这种限制并不适用于 C++。在 C++ 中，**struct** 本质上只是指定类的另一种方式。事实上，在\
  \ C++ 中，**class** 和 **struct** 之间的唯一区别在于默认情况下所有成员在 **struct** 中是公共的而在 **class**\
  \ 中是私有的。在所有其他方面，结构体和类都是等价的。\n\n这是一个结构体的示例：\n\n![Image](img/00668.gif)\n\n这个简单的程序定义了一个名为\
  \ `Test` 的结构类型，其中 `get_i()` 和 `put_i()` 是公共的，`i` 是私有的。注意使用 **private** 关键字指定结构的私有元素。\n\
  \n以下程序显示使用 **class** 代替 **struct** 的对应程序：\n\n![Image](img/00669.gif)\n\n### **专家问**\n\
  \n**Q：既然 struct 和 class 如此相似，为什么 C++ 还要有两个？**\n\n**A：从表面上看，结构体和类具有几乎相同的能力，这似乎是冗余的。许多\
  \ C++ 初学者好奇为什么会有这种形式的重复。事实上，经常听人建议 **class** 或 **struct** 关键字其中一个是不必要的。**\n\n\n\n\
  \n这一系列逻辑的答案源于保持 C++ 与 C 兼容的愿望。按照目前 C++ 的定义，一个标准的 C 结构体也是完全有效的 C++ 结构体。在没有公共或私有结构成员概念的\
  \ C 语言中，所有结构成员默认都是公开的。这就是为什么 C++ 结构体的成员默认是公开的（而不是私有的）。由于 `class` 关键字被专门设计用于支持封装，因此其成员默认是私有的这是合合理的。因此，为了避免在该问题上与\
  \ C 产生不兼容，结构体的默认设置不能被更改，而是增加一个新的关键字。然而，从长远来看，结构体（struct）和类（class）分离还有一个重要的原因。因为\
  \ `class` 在语法上是独立于 `struct` 的实体，类的定义可以自由演变为可能与类 C 风格结构体在语法上不兼容的方式。由于两者是分离的，C++ 的未来方向将不受与类\
  \ C 风格结构体兼容性的限制。\n\n在大多数情况下，C++ 程序员将使用 `class` 来定义包含成员函数的对象的类型，并使用 `struct` 这种更传统的角色来创建仅包含数据成员的对象。有时会使用缩写“POD”来描述不包含成员函数的结构体。它代表“纯旧数据”（plain\
  \ old data）。\n\n## 联合体 (Unions)\n\n*union*（union）是两个或多个不同变量共享的内存位置。联合体使用 `union`\
  \ 关键字创建，其声明与结构体相似，如下所示：\n\n![Image](img/00670.gif)\n\n这定义了一个 `union`，其中一个 `short\
  \ int` 值和一个 `char` 值共享同一个位置。请明确一点：它*不可能*让这个联合体*同时*持有一个整数和一个字符，因为 `i` 和 `ch` 是重叠的。相反，你的程序可以在任何时候将联合体中的信息视为整数或字符。因此，联合体为你提供了两种或两种以上查看同一块数据的方式。\n\
  \n你可以通过在 `union` 声明的末尾放置变量名称来声明联合体变量，或者使用单独的声明语句。例如，要声明一个类型为 `utype`、名为 `u_var`\
  \ 的联合体变量，你可以写：\n\n![Image](img/00671.gif)\n\n在 `u_var` 中，短型整数 `i` 和字符 `ch` 共享相同的内存位置。（当然，`i`\
  \ 占用两个字节，而 `ch` 只使用一个字节。）图 9-1 显示了 `i` 和 `ch` 如何共享相同的地址。\n\n![Image](img/00672.gif)\n\
  \n**图 9-1** `u_var` 的 `i` 和 `ch` 如何共享相同的地址\n\n对于 C++ 而言，联合体本质上是一个所有元素都存储在相同位置的类。事实上，联合体定义了一个类类型。联合体可以包含构造函数、析构函数以及成员函数。由于联合体继承自\
  \ C，它的成员默认是公开的，而不是私有的。\n\n这里是一个使用联合体显示组成短型整数低位和高位字节字符的程序（假设短型整数为两个字节）：\n\n![Image](img/00673.gif)\n\
  \n![Image](img/00674.gif)\n\n输出所示：\n\n![Image](img/00675.gif)\n\n如输出所示，使用 `u_type`\
  \ 联合体可以以两种不同的方式查看相同的数据。\n\n与结构体一样，C++ 联合体源自它的 C 前身。然而，在 C 语言中，联合体只能包含数据成员；不允许包含函数和构造函数。在\
  \ C++ 中，联合体拥有类的扩展功能。但仅仅因为 C++ 赋予了联合体更大的力和灵活性并不意味着你必须使用它。通常联合体只包含数据。然而，在你可以将联合体与操作它的例程封装在一起的情况下，通过这样做将为你的程序增加相当的结构性。\n\
  \n使用 C++ 联合体时，必须遵守几项限制。其中大部分与本书稍后将讨论的 C++ 特性有关，但为了完整起见，在这里提到了。首先，`union` 不能继承类。此外，`union`\
  \ 不能作为基类。`union` 不能具有虚成员函数。`static` 变量不能是 `union` 的成员。不能使用引用成员。`union` 不能包含任何重载了\
  \ `=` 运算符的对象。最后，如果对象具有显式构造函数或析构函数，则该对象不能作为联合体的成员。\n\n### 匿名联合体 (Anonymous Unions)\n\
  \nC++ 中有一种特殊类型的 `union` 称为*anonymous union*（匿名联合体）。匿名联合体不包含类型名称，且不能声明该联合体的变量。相反，匿名联合体告诉编译器其成员变量共享相同的位置。然而，变量本身是直接引用的，而不使用正常的点运算符语法。例如，考虑此程序：\n\
  \n![Image](img/00676.gif)\n\n如你所见，联合体的元素引用就像它们被声明为普通的局部变量一样。事实上，相对于你的程序，你确实是这样使用它们的。此外，尽管它们定义在\
  \ `union` 声明内部，但它们与同一块内的任何其他局部变量处于相同的作用域级。这意味着匿名联合体的成员名称不能与其他标识符冲突。所有涉及联合体的限制都适用于匿名联合体，补充如下：首先，匿名联合体的元素必须是数据。不允许成员函数。匿名联合体不能包含\
  \ `private` 或 `protected`元素。（`protected` 修饰符将在第 10 章讨论。）最后，全局匿名联合体必须指定为 `static`。\n\
  \n## 技能 9.8 this 关键字\n\n在继续运算符重载之前，有必要描述另一个 C++ 关键字：`this`。每当成员函数被调用时，它都会接收一个指向调用对象的指针，称为\
  \ `this`。`this` 指针是所有成员函数的隐式参数。因此，在成员函数内部可以使用 `this` 来引用调用对象。\n\n正如你所知，成员函数可以直接访问其类的私有数据。例如，给定这个类：\n\
  \n![Image](img/00677.gif)\n\n在 `f()` 内部可以使用以下语句为 `i` 赋值为 10：\n\n![Image](img/00678.gif)\n\
  \n实际上，上述语句是以下语句的形式：\n\n![Image](img/00679.gif)\n\n为了看到 `this` 指针的作用，请查看以下短程序：\n\n\
  ![Image](img/00680.gif)\n\n该程序显示数字 100。这个例子显然是微不足道的，没有人会这样使用 `this` 指针。然而，很快你就会看到为什么\
  \ `this` 指针对 C++ 编程很重要。\n\n另一点：友元函数没有 `this` 指针，因为友元不是类的成员。只有成员函数才有 `this` 指针。\n\
  \n#### ![Image](img/00003.jpeg) 进度检查\n\n**1**. `struct` 可以包含成员函数吗？\n\n**2**. `union`\
  \ 的定义特征是什么？\n\n**3** `this` 指向什么？\n\n### 技能 9.9 运算符重载\n\n本模块的剩余部分将探索 C++ 最令人兴奋和强大的功能之一：*运算符重载*。在\
  \ C++ 中，可以相对于你创建的类类型重载运算符。重载运算符的主要优势是允许你将新数据类型无缝集成到你的编程环境中。\n\n\n\n\n\n当你重载一个操作符时，你是在为特定的类定义操作符的含义。例如，一个定义链表的类可能会使用\
  \ `+` 运算符将对象添加到列表中。实现栈的类可能会使用 `+` 将对象推入栈中。另一个类可能会以完全不同的方式使用 `+` 运算符。当操作符被重载时，它的原始含义并不会丢失。它仅仅是相对于某个特定的类定义了一个新的操作。因此，例如，通过重载\
  \ `+` 来处理链表并不会导致其相对于整数的含义（即相加法）发生改变。\n\n操作符重载与函数重载紧密相关。要重载一个操作符，你必须定义该操作相对于其所应用的类的含义。为了做到这一点，你需要创建一个\
  \ `operator` 函数。`operator` 函数的通用形式如下：\n\n```cpp\ntype classname::operator#(*arg-list*)\n\
  {\n    // operations\n}\n```\n\n在这里，你正在重载的操作符替换了 `#`，而 `type` 是指定操作返回的值的类型。尽管它可以是你选择的任何类型，但返回值通常与重载该操作符的类类型相同。这种相关性便于在复合表达式中使用重载的操作符。`arg-list`\
  \ 的具体性质由后续章节中描述的几个因素决定。\n\n操作符函数可以是类的成员，也可以是非成员。然而，非成员操作符函数通常是类的友元函数（friend functions）。尽管相似，但成员操作符函数的重载方式与非成员操作符函数的重载方式之间存在一些差异。这里描述了每种方法。\n\
  \n**注意** ![Image](img/00070.gif)\n\n由于 C++ 定义了许多操作符，操作符重载这一主题非常庞大，书中无法描述它的每一个方面。关于操作符重载的全面描述，请参阅我的书籍\
  \ *C++: The Complete Reference*（Osborne/McGraw-Hill）。\n\n### 关键技能 9.10 使用成员函数重载操作符\n\
  \n在研究成员操作符之前，让我们从一个简单的示例开始。以下程序创建了一个名为 `ThreeD` 的类，它维护三维空间中对象的坐标。该程序相对于 `ThreeD`\
  \ 类重载了 `+` 和 `=` 运算符。请仔细观察。\n\n![Image](img/00681.gif)\n\n![Image](img/00682.jpeg)\n\
  \n![Image](img/00683.jpeg)\n\n该程序产生以下输出：\n\n![Image](img/00684.gif)\n\n在你检查程序时，你可能会惊讶地发现，两个操作符函数都只有一个参数，尽管它们重载的是二元操作。这种表面表矛盾的原因的原因是，当使用成员函数重载二元操作符时，只显式地向传递了一个参数。另一个参数通过\
  \ `this` 指针隐式地传递。因此，在这一行中：\n\n![Image](img/00685.gif)\n\n`x` 指的是 `this->x`，即与调用操作符函数的对象相关的\
  \ `x`。在所有情况下，都是操作左侧的对象导致了对操作符函数的调用。右侧的对象则被传递给函数。\n\n通常情况下，当你使用成员函数时，重载一元操作符时不需要任何参数，而重载二元操作符时只需要一个参数。（你不能重载三元运算符\
  \ `?`）。无论哪种情况，调用操作符函数的对象都通过 `this` 指针隐式地传递。\n\n为了理解操作符重载是如何工作的，让我们仔细检查前面的程序，从重载的操作符\
  \ `+` 开始。当两个 `ThreeD` 类型的对象被 `+` 运算符处理时，它们各自坐标的幅度被加在一起，如 `operator+()` 所示。然而，请注意，此函数没有修改任何操作数的值。相反，函数返回一个包含操作结果的\
  \ `ThreeD` 类型对象。为了理解为什么 `+` 操作不会改变任何对象的内容，请标准算术 `+` 操作应用如下：`10 + 12`。该操作的结果是 `22`，但\
  \ `10` 和 `12` 都没有被改变。虽然没有规则规定重载的 `+` 运算符不能改变其一个操作数的值，但让重载操作符的行为与其原始含义保持一致是最好的。\n\
  \n注意 `operator+()` 返回一个 `ThreeD` 类型的对象。虽然函数可以返回任何有效的 C++ 类型，但返回 `ThreeD` 对象的这一使得\
  \ `+` 运算符可以在复合表达式中使用，例如 `a+b+c`。在这里，`a+b` 生成了一个类型为 `ThreeD` 的结果。该值随后可以加到 `c` 上。如果\
  \ `a+b` 生成了其他类型的值，这种表达式将无法工作。\n\n与 `+` 运算符相反，赋值运算符确实会导致其其中一个操作数被修改。（毕竟，这正是赋值的本质。）由于\
  \ `operator=` 函数是由位于等号左侧的对象调用的，因此是该对象被赋值操作所修改的。大多数情况下，重载赋值操作符的返回值是赋值完成后的左侧对象。（这与\
  \ `=` 运算符的传统行为一致。）例如，为了允许如下语句的操作：\n\n![Image](img/00686.gif)\n\n`operator=` 必须返回\
  \ `this` 所指向的对象，该对象将是出现在赋值语句左侧的对象。这使得链式赋值成为可能。赋值操作是 `this` 指针的最重要用处之一。\n\n在前面的程序中，实际上没有必要重载\
  \ `=`，因为 C++ 提供的默认赋值运算符对于 `ThreeD` 类来说足够了。（正如本模块早些部分解释的那样，默认赋值操作是位拷贝。）重载 `=` 仅仅是为了展示正确的步骤。通常情况下，只有当无法使用默认位拷贝时，你才需要重载\
  \ `=`。由于默认 `=` 运算符对于 `ThreeD` 是足够的，本模块随后的示例将不再重载它。\n\n#### 顺序很重要\n\n在重载二元操作符时，记住在很多情况下，操作数的顺序是有区别的。例如，虽然\
  \ `A + B` 满足交换律，但 `A - B` 不。（也就是说，`A - B` 不等于 `B - A`！）因此，在实现非交换操作符的重载版本时，你必须记住哪个操作数在左侧，哪个在右侧。例如，这是为\
  \ `ThreeD` 类重载减法：\n\n![Image](img/00687.gif)\n\n记住，是左侧的操作调用操作符函数。右侧的操作被显式传递。\n\n\
