  \n### 关键技能 10.10 纯虚函数和抽象类\n\n有时你可能想要创建一个基类，它只定义一个供其所有派生类共享的通用形式，将细节留给每个派生类去填充。这样的类决定了派生类必须实现的函数性质，但它本身并不提供其中一个或多个这些函数的实现。这种情况发生的一种方式是，基类无法为某个函数创建有意义的实现。之前示例中使用的\
  \ `TwoDShape` 版本就是如此。`area()` 的定义仅仅是一个占位符。它不会计算并显示任何类型对象的面积。\n\n正如你在创建自己的类库时将看到的，一个函数在其基类的语境下没有意义的定义并不罕见。你可以通过两种方式处理这种情况。一种方法（如之前的示例所示）是简单地让它报告一个警告消息。虽然这种方法在某些情况下（如调试）很有用，但通常并不合适。你可能拥有某些必须由派生类重写的函数，以便派生类具有任何意义。考虑\
  \ `Triangle` 类，如果未定义 `area()`，它就没有意义。在这种情况下，你需要某种方法来确保派生类确实重写了所有必要的函数。C++ 解决此问题的方案是纯虚函数。\n\
  \n纯虚函数是在基类中声明的、相对于基类没有定义的函数。因此，任何派生类都必须定义自己的版本。要声明纯虚函数，使用此通用形式：\n\n```\nvirtual\
  \ type func-name(parameter-list*) = 0;\n```\n\n在这里，`type` 是函数的返回类型，`func-name` 是函数的名称。\n\
  \n使用纯虚函数，你可以改进 `TwoDShape` 类。由于对于未定义的二维形状没有意义的面积概念，上述程序的版本在 `TwoDShape` 中将 `area()`\
  \ 声明为纯虚函数。这意味着所有派生自 `TwoDShape` 的类必须重写 `area()`。\n\n![Image](img/00790.jpeg)\n\n\
  ![Image](img/00791.jpeg)\n\n![Image](img/00792.jpeg)\n\n![Image](img/00793.jpeg)\n\
  \n如果一个类至少有一个纯虚函数，那么该类就被称为抽象类。抽象类有一个重要的特征：不能创建该类的对象。为了向自己证明这一点，尝试从之前程序的 `Triangle`\
  \ 类中移除对 `area()` 的重写。当你尝试创建 `Triangle` 实例时将收到错误。相反，抽象类只能作为其他类继承的基。抽象类不能用于声明对象的原因是它的一个或多个函数没有定义。因此，之前程序中的\
  \ `shapes` 数组已缩短为 4，并且不再创建通用 `TwoDShape` 对象。正如程序所示，即使基类是抽象的，你仍然可以使用它来声明其类型的指针，该指针可以指向派生类对象。\n\
