  \ 函数使用头文件 `<cctype>`。\n\n注意 `for` 循环的测试条件仅仅是控制变量索引的数组。这之所以有效是因为任何非零值都是真。记住，所有的字符值都非零，但终止字符串的空终止符是零。因此，循环一直运行直到遇到空终止符，导致\
