  \ `for` 循环的变量只用于循环本身，不在其他地方使用。在这种情况下，可以在 `for` 的初始化部分内部声明该变量。例如，以下程序计算数字 1 到 5 的总和和阶乘。它在\
  \ `for:` 内部声明了循环控制变量 `i`：\n\n![Image](img/00189.gif)\n\n以下是程序产生的输出：\n\n![Image](img/00190.gif)\n\
  \n当你在 `for` 循环内部声明变量时，有一个重要的点需要记住：该变量仅在 `for` 语句内部可见。因此，在编程语言中，该变量的作用域限于 `for` 循环。在\
  \ `for` 循环之外，该变量将不再存在。因此，在前面的示例中，`i` 无法在 `for` 循环之外访问。如果你需要在程序的其他地方使用循环控制变量，你将无法在\
  \ `for` 循环内部声明它。\n\n**注意** ![Image](img/00070.gif)\n\n在 `for` 循环初始化部分声明的变量是否被限制在该循环内，随着时间发生了变化。最初，该变量在\
  \ `for` 之后仍然可用，但在 C++ 标准化过程中改变了这一点。如今，ANSI/ISO 标准 C++ 将变量限制在 `for` 循环的作用域内。然而，某些编译器并没有这样做。你需要检查这一特性。在继续之前，你可能想对你自己的\
  \ `for` 变体进行实验。正如你发现的，这是一个有趣的特性。\n\n#### 进度检查\n\n![Image](img/00003.jpeg)\n\n- 在\
  \ `for` 循环初始化部分声明的变量是否限制在该循环内？\n- `for` 语句的部分可以是空的吗？\n- 如何使用 `for` 创建无限循环？\n- `for`\
  \ 内部声明变量的作用域是什么？\n\n## 关键技能 3.4 while 循环\n\n另一种循环是 `while`。`while` 的通用形式是\n\n```\n\
  while(expression) statement;\n```\n\n其中 `statement` 可以是一个单独语句或一个语句块。`expression`\
  \ 定义了控制循环的条件，当条件为真时执行 `statement`。当条件变为假时，程序跳转到下一行。\n\n下一个程序通过简短但有趣的程序演示了 `while`。几乎所有计算机都支持\
  \ ASCII 定义之外扩展字符集。扩展字符（如果存在）通常包括外语言符号和科学计数法。ASCII 字符使用的值小于 128。扩展字符集从 128 开始到 255。此程序打印\
  \ 32（空格）到 255 之间的所有字符。当你运行此程序时，你可能会看到非常有趣的字符。\n\n![Image](img/00191.gif)\n\n检查前面程序中的循环表达式。你可能疑惑为什么只用\
  \ `ch` 来控制 `while`。由于 `ch` 是无符号字符，它只能持有 0 到 255 的值。当它持有 255 并被递增时，它的值将“绕回”到零。因此，测试\
  \ `ch` 是否为零是一个方便的终止条件。\n\n与 `for` 循环一样，`while` 在循环顶部检查条件表达式，这意味着循环代码可能完全不执行。这消除了在循环之前执行单独测试的需要。以下程序演示了\
  \ `while` 循环的这一特性。它显示一行点。显示的点号数量等于用户输入的值。程序不允许行超过 80 个字符。对允许的点号数量的测试是在循环的条件表达式内部进行的，而不是在循环外部。\n\
  \n![Image](img/00192.gif)\n\n如果 `len` 超出范围，则 `while` 循环一次也不会执行。否则，循环将一直执行到 `len`\
  \ 达到零。\n\n\n\n\n\n`while` 循环体内不需要任何语句。这里是一个示例：\n\n![Image](img/00193.gif)\n\n该循环一直持续，直到\
  \ `rand()` 生成的随机数等于 100。\n\n## 关键技能 3.5 do-while 循环\n\nC++ 的最后一种循环是 `do-while` 循环。与\
  \ `for` 循环和 `while` 循环不同（后者在循环顶部进行条件测试），`do-while` 循环在循环底部检查其条件。这意味着 `do-while`\
  \ 循环至少会执行一次。`do-while` 循环的一般形式为：\n\n![Image](img/00194.gif)\n\n虽然只有一个语句时不需要大括号，但通常会使用它们来提高\
  \ `do-while` 结构的可读性，从而防止与 `while` 循环产生混淆。只要条件表达式为真，`do-while` 循环就会执行。\n\n以下程序将一直循环直到输入数字\
  \ 100 为止：\n\n![Image](img/00195.gif)\n\n使用 `do-while` 循环，我们可以进一步改进“魔数字”程序。这次，程序将一直循环直到你猜中数字为止。\n\
  \n![Image](img/00196.gif)\n\n![Image](img/00197.gif)\n\n以下是运行示例：\n\n![Image](img/00198.gif)\n\
  \n最后一点：与 `for` 和 `while` 循环一样，`do-while` 循环的体可以是空的，但在实践中很少这样做。\n\n#### ![Image](img/00003.jpeg)\
