  \n### 专家问答\n\n**Q: 指针和数组可以互换吗？**\n\n**A:** 正如前几页所示，指针和数组关系紧密，并且在许多情况下是可以互换的。例如，指向数组开头的指针可以使用指针算术或数组风格索引来访问该数组。然而，指针和数组并不是完全互换的。例如，考虑这段代码：\n\
