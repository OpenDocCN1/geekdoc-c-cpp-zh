  \ `while` 循环内部，检查并更改 `p` 处的字母，然后对 `p` 进递增。当 `p` 指向结束 `str` 的空终止符时，循环停止。\n\n由于某些\
  \ C++ 编译器生成代码的方式，这两个程序在性能上可能并不等价。通常情况下，对数组进行索引所需的机器指令比对指针进行算术操作更多。因此，在专业编写的 C++\
  \ 代码中，经常看到更频繁地使用指针版本。然而，作为一名初级 C++ 程序员，在你熟悉指针之前，尽管使用数组索引。\n\n### 索引指针\n\n正如你刚刚看到的，使用指针算术访问数组是可能的。你可能会感到惊讶的是，反过来亦然。在\
  \ C++ 中，可以像对待数组一样对指针进行索引。这里有一个示例。这是大小写转换程序的第三版本。\n\n![Image](img/00309.gif)\n\n\
