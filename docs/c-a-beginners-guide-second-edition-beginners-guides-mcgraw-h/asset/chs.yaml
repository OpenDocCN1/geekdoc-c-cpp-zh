  ## 关键技能 4.4 字符串\n\n到目前，一维数组最常用的用途是创建字符串。C++ 支持两种类型的字符串。第一种也是最常用的是`空终止字符串`（null-terminated\
  \ string），它是一个以空字符结尾的字符数组。（空字符为零。）因此，一个空终止字符串包含组成字符串的字符，后面紧跟一个空字符。空终止字符串被广泛使用，是因为它们提供了很高的效率，并让程序员对字符串操作进行详细的控制。当\
  \ C++ 程序员使用 `string` 术语时，他或她通常指的是空终止字符串。C++ 定义的第二种字符串类型是 `string` 类，它是 C++ 类库的一部分。因此，`string`\
