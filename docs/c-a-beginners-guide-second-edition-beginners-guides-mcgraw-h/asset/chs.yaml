  \ `int` 并重试程序。这将导致一个错误。（如前所述，目前 Visual C++ 并不限制函数可以抛出的异常。）\n\n重要的一点是，函数只能限制其抛回给调用它的\
  \ `try` 块的异常类型。也就是说，函数*内部*的 `try` 块可以抛出任何类型的异常，只要该异常在函数*内部*被捕获。限制仅适用于在函数外部抛出异常。\n\
  \n### 重新抛出异常\n\n你可以通过在异常处理器内部单独调用 `throw`（不带任何异常）来重新抛出异常。这将导致当前异常传递给外部的 `try/catch`\
  \ 序列。这种方式调用 `throw` 最可能的原因是允许多个处理程序访问该异常。例如，可能一个异常处理程序管理异常的一个方面，而第二个处理程序处理另一个方面。异常只能在\
  \ `catch` 块内部（或从该块内部调用的任何函数中）重新抛出。当你重新抛出异常时，它不会被同一个 `catch` 语句捕获。它将传播到下一个 `catch`\
