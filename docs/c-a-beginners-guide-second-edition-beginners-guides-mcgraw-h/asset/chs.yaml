  \n该程序的输出所示：\n\n![Image](img/00034.gif)\n\n### 专家问答\n\n**问: 为什么 C++ 为整数和浮点值提供了不同的数据类型？也就是说，为什么所有的数值不都是同一种类型呢？**\n\
  \n**答:** C++ 提供了不同的数据类型以便你编写高效的程序。例如，整数算术比浮点计算快。因此，如果你不需要小数，就不需要引入与类型 `float` 或\
  \ `double` 相关的开销。此外，一种数据类型所需的内存可能比另一种所需的少。通过提供不同的类型，C++ 能够使你最优化地利用系统资源。最后，某些算法需要（或至少受益于）使用特定类型的数据。C++\
  \ 提供了许多内置类型以给你提供最大的灵活性。\n\n如你所见，当 `ivar` 除以 3 时，执行的是整数除法，结果是 33——小数部分丢失了。然而，当 `dvar`\
  \ 除以 3 时，小数部分被保留了。\n\n程序中还有另一个新内容。注意这一行：\n\n![Image](img/00035.gif)\n\n它输出了一个换行。每当你想在输出中添加空行时，请使用此语句。\n\
