  \n#### **初始化替代方案**\n\n如果构造函数只有一个参数，那么你可以使用另一种方法来初始化它。考虑以下程序：\n\n![Image](img/00605.gif)\n\
  \n![Image](img/00606.gif)\n\n在这里，`MyClass` 的构造函数有一个参数。注意 `main()` 中如何声明 `ob`。它使用了这种声明：\n\
  \n![Image](img/00607.gif)\n\n在这种初始化形式下，5 被自动传递给 `MyClass()` 构造函数的参数 `i`。也就是说，编译器处理该语句就像：\n\
  \n```cpp\nob = 5;\n```\n\n通常，只要你有只需要一个参数的构造函数，可以使用 `ob(x)` 或 `ob = x` 来初始化对象。因为每当你创建一个带有一个参数的构造函数时，你也隐含地创建从该参数类型到类类型的转换。\n\
  \n请记住，这里所示的替代方案仅适用于恰有一个参数的构造函数。\n\n#### ![Image](img/00003.jpeg) 进度检查\n\n- **1**.\
  \ 假设有一个类名为 `Test`，显示如何声明一个接受名为 `count` 的 `int` 参数的构造函数。\n- **2**. 该语句如何重写？\n\n![Image](img/00609.gif)\n\
  \n- **3**. 第二个问题中的声明还可以如何重写？\n\n\n\n\n\n在我们继续探索该类之前，有必要进行一个小小但重要的旁题。虽然它并不专门针对面向对象编程，但\
  \ C++ 中一个非常实用的特性——`inline function`（内联函数），在类定义中被频繁使用。`inline function` 是一种在调用处直接进行内联展开的函数，而不是实际被调用。创建内联函数有两种方法。第一种是使用\
  \ `inline` 修饰符。\n\n### 提问专家\n\n**问：可以在一个类内部嵌套声明另一个类吗？也就是说，类可以嵌套吗？**\n\n**答：** 是的，可以在一个类内部定义另一个类。这样做创建了一个\
  \ `nested class`（嵌套类）。由于 `class` 声明确实定义了一个作用域，因此嵌套类仅在包含类的作用域内有效。坦率地说，由于 C++ 其他特性（如本书后后将讨论的继承）具有丰富的丰富性和灵活性，创建嵌套类的需求几乎不存在。\n\
  \n例如，为了创建一个名为 `f`、返回 `int` 且不带参数的内联函数，你可以这样声明它：\n\n![Image](img/00610.gif)\n\n`inline`\
  \ 修饰符位于函数声明的所有其他方面之前。\n\n`inline` 函数的原因是为了效率。每次调用函数时，都必须执行一系列指令，既为了设置函数调用（包括将任何参数推入栈），也为了从函数返回。在某些情况下，许多\
  \ CPU 周期被用于执行这些过程。然而，当函数被内联展开时，就不存在这种开销，程序的整体速度将提高。尽管如此，如果内联函数很大，程序的整体体积也会增加。出于因此，最好的内联函数是那些短函数。大多数大函数应该保持为普通函数。\n\
  \n下面的程序演示了 `inline:`：\n\n![Image](img/00611.gif)\n\n重要的是，从技术上讲，`inline` 是编译器生成内联代码的**“请求”，而不是一个“命令”。有多种情况可能会阻止编译器遵守该请求。以下是一些示例：\n\
  \n![Image](img/00157.jpeg) 如果函数包含循环、`switch` 或 `goto`，某些编译器将不会生成内联代码。\n\n![Image](img/00157.jpeg)\
  \ 通常情况下，你不能拥有内联递归函数。\n\n![Image](img/00157.jpeg) 包含 `static` 变量的内联函数通常是不允许的。\n\n\
  记住：内联限制取决于实现，因此你必须检查编译器的文档，以了解适用于你情况的任何限制。\n\n## 在类内部创建内联函数\n\n创建内联函数的第二种方法是在类定义*内部*定义成员函数的代码。任何在类定义内部定义的函数都会自动变成内联函数。没有必要在它的声明前加上\
  \ `inline` 关键字。例如，之前的程序可以重写如下：\n\n![Image](img/00612.gif)\n\n注意函数代码的排列方式。对于非常短的函数，这种排列反映了常见的\
