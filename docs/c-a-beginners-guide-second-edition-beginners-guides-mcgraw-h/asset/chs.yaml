  括号是必要的，因为 `*` 运算符的优先级低于 `++` 运算符。\n\n以下程序演示了通过指针进行赋值：\n\n![Image](img/00295.gif)\n\
  \n程序的输出在此处：\n\n![Image](img/00296.gif)\n\n## 关键技能 4.10 指针表达式\n\n指针可以用于大多数 C++ 表达式。然而，某些特殊规则仍然适用。请记住，你可能需要用括号将指针表达式的部分括起来，以确保结果是你预期的。\n\
  \n## 指针算术\n\n只有四种算术运算符可以用于指针：`++`、`--`、`+` 和 `-`。为了理解指针算术中发生了什么，设 `p1` 为当前值为 2000\
  \ 的 `int` 指针（即它包含地址 2000）。假设整数是 32 位，在执行表达式\n\n![Image](img/00297.gif)\n\n之后，`p1`\
  \ 的内容将是 2004，而不是 2001！这是因为每当 `p1` 递增时，它都会指向下一个 `int`。递减的情况也是如此。例如，再次假设 `p1` 的值为\
  \ 2000，表达式\n\n![Image](img/00298.gif)\n\n会导致 `p1` 的值为 1996。\n\n从前述示例中泛化，以下规则适用于指针算术。每当指针递增时，它都会指向其基类型下一个元素的内存位置。每当它递减时，它都会指向其基类型上一个元素的位置。对于字符指针，递增或递减看起来像是“正常”的算术，因为字符是一个字节。然而，每次增加或减少小都会按基类型的长度变化。\n\
  \n指针并不限于只有递增和递减操作。你还可以对指针加或减整数。表达式\n\n![Image](img/00299.gif)\n\n使 `p1` 指向其当前指向元素之后的第九个元素。\n\
