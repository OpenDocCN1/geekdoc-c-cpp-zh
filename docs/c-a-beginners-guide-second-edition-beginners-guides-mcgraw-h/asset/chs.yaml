  \n## 格式化 I/O\n\n到此为止，输入或输出信息的格式一直由 C++ I/O 系统提供的默认设置决定。然而，你有两种方式精确地控制数据的格式。第一种使用\
  \ `ios` 类的成员函数。第二种使用一种称为 `manipulator`（操符）的特殊类型函数。我们将开始查看使用 `ios` 成员函数进行格式化。\n\n\
  ### 关键技能 11.4 使用 `ios` 成员函数进行格式化\n\n每个流都关联有一组格式标志（format flags），用于控制流格式化信息的方式。`ios`\
  \ 类声明了一个名为 `fmtflags` 的位掩码枚举，其中定义了以下值。（从技术上说，这些值定义在 `ios_base` 中，它是 `ios` 的基类。）\n\
  \n![Image](img/00807.gif)\n\n这些值用于设置或清除格式标志。某些旧版本的编译器可能没有定义 `fmtflags` 枚举类型。在这种情况下，格式标志将编码为一个长整型（long\
  \ integer）。\n\n当设置 `skipws` 标志时，在对流执行输入操作时，会丢弃前导空白字符（空格、制表符和换行符）。当清除 `skipws` 时，空白字符不会被丢弃。\n\
  \n当设置 `left` 标志时，输出左对齐。当设置 `right` 时时，输出右对齐。当设置 `internal` 标志时，数值会在任何符号或基数字符之间插入空格，以填充填满一个字段。如果未设置这些标志中的任何一个，输出默认为右对齐。\n\
  \n默认情况下，数值以十进制输出。然而，可以更改数字基数（base）。设置 `oct` 标志会导致输出以八进制形式显示。设置 `hex` 标志会导致输出以十六进制形式显示。要将输出恢复为十进制，请设置\
  \ `dec` 标志。\n\n设置 `showbase` 会导致显示数值的基数。例如，如果转换基数是十六进制，值 `1F` 将显示为 `0x1F`。\n\n默认情况下，当显示科学计数法时，`e`\
  \ 是小写的。同样，当显示十六进制值时，`x` 是小写的。当设置 `uppercase` 时，这些字符将大写形式显示。\n\n设置 `showpos` 会导致在正值之前显示一个前导加号。\n\
  \n设置 `showpoint` 会导致所有浮点输出显示小数点和尾随零——无论是否需要。\n\n通过设置 `scientific` 标志，浮点数值将使用科学计数法显示。当设置\
  \ `fixed` 时，浮点值将使用普通计数法显示。当两个标志都没有设置时，编译器将选择合适的方法。\n\n当设置 `unitbuf` 时，在每次插入操作后都会刷新缓冲区（flush）。\n\
  \n当设置 `boolalpha` 时，可以使用 `true` 和 `false` 关键字输入或输出布尔值。\n\n由于经常引用 `oct`、`dec` 和 `hex`\
  \ 字段，它们可以统称为 `basefield`。同样，`left`、`right` 和 `internal` 字段可以称为 `adjustfield`。最后，`scientific`\
  \ 和 `fixed` 字段可以引用 `floatfield`。\n\n## 设置和清除格式标志\n\n要设置标志，请使用 `setf()` 函数。该函数是 `ios`\
  \ 的成员。其最常见的形式所示：\n\n```\nfmtflags setf(fmtflags *flags);\n```\n\n该函数返回格式标志的先前设置，并开启\
  \ `flags` 指定的标志。例如，要开启 `showbase` 标志，你可以使用此语句：\n\n![Image](img/00808.gif)\n\n在这里，*stream*\
  \ 是你想要影响的流。注意使用 `ios::` 来限定 `showbase`。因为 `showbase` 是由 `ios` 类定义的枚举常量（enumerated\
  \ constant），在引用它时必须由 `ios` 限定。这一原则适用于所有格式标志。\n\n以下程序使用 `setf()` 同时开启了 `showpos`\
  \ 和 `scientific` 标志：\n\n![Image](img/00809.gif)\n\n该程序产生的输出所示：\n\n![Image](img/00810.gif)\n\
  \n你可以在单次调用中按意愿通过位或（OR）操作组合任意数量的标志。例如，通过对 `scientific` 和 `showpos` 进行位或操作，如下所示，你可以更改\
  \ `setf()`：\n\n![Image](img/00811.gif)\n\n要关闭某个标志，请使用 `unsetf()` 函数，其原型所示：\n\n```\n\
  void unsetf(fmtflags *flags);\n```\n\n由 `flags` 指定的标志将被清除。（其他标志不受影响。）\n\n有时了解当前的标志设置是有用的。你可以使用\
  \ `flags()` 函数获取当前的标志值，其原型所示：\n\n```\nfmtflags flags();\n```\n\n该函数返回相对于调用流的标志值。\n\
  \n`flags()` 的形式会将标志值设置为 `flags` 指定的值并返回先前的标志值：\n\n```\nfmtflags flags(fmtflags *flags);\n\
  ```\n\n以下程序演示了 `flags()` 和 `unsetf()`：\n\n![Image](img/00812.gif)\n\n![Image](img/00813.gif)\n\
  \n程序产生输出：\n\n![Image](img/00814.gif)\n\n在程序中，注意类型 `fmtflags` 前有 `ios::`。这是因为 `fmtflags`\
  \ 是由 `ios` 定义的类型。通常，当你使用由类定义的类型或枚举常量时，必须使用该类名对其进行限定。\n\n## 设置字段宽度、精度和填充字符\n\n除了格式标志外，`ios`\
  \ 定义了三个成员函数来设置这些额外值：字段宽度、精度和填充字符。设置这些值的函数分别是 `width()`、`precision()` 和 `fill()`。每个函数依次执行。\n\
  \n默认情况下，当输出值时，它只占据显示该值所需的空间。然而，你可以通过 `width()` 函数指定最小字段宽度。其原型所示：\n\n```\nstreamsize\
  \ width(streamsize *w);\n```\n\n在这里，*w* 成为字段宽度，并返回之前的字段宽度。在某些实现中，必须每次输出之前设置字段宽度。如果没有，则使用默认字段宽度。`streamsize`\
  \ 类型由编译器定义为某种形式的整数。\n\n设置最小字段宽度后，当值使用的空间小于指定的宽度时，字段将使用当前的填充字符（默认为空格）填充以达到字段宽度。如果值超过最小字段宽度，则字段将溢出。值不会被截断。\n\
  \n当以科学计数法输出浮点值时，你可以使用 `precision()` 函数确定小数点后显示的数字位数。其原型所示：\n\n```\nstreamsize precision(streamsize\
  \ *p);\n```\n\n\n\n在这里，精度被设置为 `p`，并返回旧值。默认精度为 6。在某些实现中，必须在每次浮点数输出之前设置精度。如果不设置，则将使用默认精度。\n\
  \n默认情况下，当一个字段需要填充时，它将用空格填充。你可以通过 `fill()` 函数来指定填充字符。它的原型是：\n\n```cpp\nchar fill(char\
  \ *ch);\n```\n\n调用 `fill()` 之后，`ch` 变为新的填充字符，并返回旧字符。\n\n下面是一个演示这三个函数的程序：\n\n![Image](img/00815.jpeg)\n\
  \n该程序显示了此输出：\n\n![Image](img/00816.gif)\n\n如所述，在某些实现中，有必要在每次输出操作之前重置字段宽度。这就是为什么在前面的程序中反复调用\
  \ `width()` 的原因。\n\n`width()`、`precision()` 和 `fill()` 都有重载形式，它们可以获取但不改变当前的设置。这些形式显示在这里：\n\
  \n```cpp\nchar fill( );\nstreamsize width( );\nstreamsize precision( );\n```\n\n\
