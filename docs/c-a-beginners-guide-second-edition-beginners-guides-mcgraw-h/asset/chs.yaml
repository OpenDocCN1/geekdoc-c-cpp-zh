  \n![Image](img/00331.gif)\n\n### 问答\n\n**Q: 鉴于指针的力量，我能看出误用它们很容易给程序造成巨大损害。你有什么避免指针错误的建议吗？**\n\
  \n**A:** 首先，在使用指针变量之前确保它们已初始化。也就是说，在尝试使用指针之前，确保它确实指向某个地方！其次，确保指针所指向的对象类型与指针的基类型相同。第三，不要通过空指针执行操作。回想，空指针表示指针指向无处。最后，不要为了“让代码编译”而强制转换指针。通常，指针类型匹配错误意味着你对某些事情理解有问题。将一种类型的指针转换为另一种类型通常只在特殊情况下需要。\n\
