  \n#### 未定义数组初始化\n\n在声明初始化数组时，可以让 C++ 自动确定数组的维度。要这样做，不要为数组指定大小。相反，编译器通过计算初始化值的数量并创建一个足够容纳它们的数组来确定大小。例如，\n\
  \n```\nint nums[] = {1, 2, 3, 4};\n```\n\n创建一个名为 `nums` 的数组，长度为四个，包含值 1, 2, 3 和\
  \ 4。因为没有指定式大小，像 `nums` 这样的数组被称为*未定义数组*（unsized array）。\n\n未定义数组非常有用。例如，假设你正在使用数组初始化构建一个地址表，所示：\n\
  \n![Image](img/00273.gif)\n\n正如你可能到的到的手动计算每个地址的字符以确定正确的数组维度是非常繁琐的。这也容易出错，因为可能会数错并导致数组大小错误。让编译器来确定数组大小更好，所示：\n\
  \n![Image](img/00274.gif)\n\n\n\n\n除了不那么繁琐之外，未指定大小的数组初始化方法允许你更改任何字符串，而无需担心意外忘记调整数组大小。\n\
  \n未指定大小的初始化不仅限于一维数组。对于多维数组，最左侧的维度可以是空的（然而，其他维度必须指定，以便对数组进行正确索引）。使用未指定大小的初始化，你可以构建不同长度的表格，编译器会自动为它们分配足够的存储空间。例如，这里\
  \ `sqrs` 被声明为一个未指定大小的数组：\n\n![Image](img/00275.gif)\n\n这种声明相比于指定大小版本的优势在于，可以在不改变数组维度的情况下对表格进行加长或缩短。\n\
