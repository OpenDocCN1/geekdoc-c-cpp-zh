  \ 找到。\n\n## 第 6 章：深入研究函数\n\n### 关键技能\n\n6.1 了解两种参数传递方式\n\n6.2 理解 C++ 如何向函数传递参数\n\
  \n6.3 使用指针创建引用传递\n\n6.4 将引用传递给函数\n\n6.5 返回引用\n\n6.6 使用独立的引用\n\n6.7 重载函数\n\n6.8 使用默认函数参数\n\
  \n6.9 在重载函数时避免歧义\n\n\n\n\n\n本模块继续我们对函数的探讨。它讨论了 C++ 中三个最重要的函数相关主题：引用、函数重载和默认参数。这些特性极极地扩展了函数的功能。引用是一个隐式指针。函数重载是一种允许一个函数以两种或多种不同的方式实现，每种方式都执行一个独立的任务。函数重载是\
  \ C++ 支持多态的一种方式。通过使用默认参数，可以为参数指定一个值，当没有指定相应的参数时，系统将自动使用该值。\n\n我们将首先解释传递给函数的两种方式，以及这两种方法的影响。为了理解引用，需要先理解参数传递。\n\
  \n### 关键技能 6.1 参数传递的两种方法\n\n通常情况下，计算机语言有两种方式可以向子程序传递参数。第一种是`值传递`（call-by-value）。这种方法将参数的`value`\
  \ 复制到子程序的参数中。因此，对子程序参数所做的任何更改都不会对调用它的实际参数产生任何影响。\n\n`引用传递`（call-by-reference）是子程序传递参数的第二种方式。在这种方法中，参数的`address`（而不是它的值）被复制到参数中。在子程序内部，该地址被用于访问调用中指定的实际参数。这意味着对参数所做的更改*将影响*用于调用子程序的实际参数。\n\
  \n## 关键技能 6.2 C++ 如何传递参数\n\n默认情况下，C++ 使用`值传递`来传递参数。这意味着函数内部的代码无法更改调用该函数时使用的参数。在本书中，在此之前的所有程序都使用了值传递方法。例如，考虑此程序中的\
  \ `reciprocal()` 函数：\n\n![Image](img/00407.gif)\n\n程序的输出显示在此：\n\n![Image](img/00408.gif)\n\
  \n如输出所示，当赋值语句\n\n![Image](img/00409.gif)\n\n在 `reciprocal()` 内部发生时，唯一被修改的是局部变量 `x`。作为参数使用的变量\
  \ `t` 的值仍为 10，且不受函数内部操作的影响。\n\n### 关键技能 6.3 使用指针创建引用传递\n\n尽管 C++ 的默认参数传递约定是值传递，但通过通过向函数传递参数的地址（即指针），可以手动创建引用传递。这样就可以在函数外部更改参数的值。你在前面的模块讨论指针传递时已经见过这个例子。正如你所知，指针传递给函数就像传递其他值一样。当然，必须将参数声明为指针类型。\n\
  \n为了看到传递指针如何让你手动创建引用传递，请考虑一个名为 `swap()` 的函数，它交换参数所指向的两个变量的值。这是实现它的方法：\n\n![Image](img/00410.gif)\n\
  \n`swap()` 函数声明了两个指针参数，`x` 和 `y`。它使用这些参数来交换传递给函数的参数所指向的变量的值。记住，`*x` 和 `*y` 指 `x`\
  \ 和 `y` 指向的变量。因此，语句\n\n![Image](img/00411.gif)\n\n将 `y` 指向的对象的值放入 `x` 指向的对象中。因此，当函数终止时，调用函数的变量的内容将发生交换。\n\
  \n由于 `swap()` 期望接收两个指针，你必须记住在调用 `swap()` 时使用要交换的变量的*地址*。程序显示了正确的方法：\n\n![Image](img/00412.gif)\n\
  \n![Image](img/00413.jpeg)\n\n在 `main()` 中，变量 `i` 被赋值为 10，`j` 被赋值为 20。然后用 `i` 和\
  \ `j` 的地址调用 `swap()`。一元运算符 `&` 用于产生变量的地址。因此，传递到 `swap()` 中 `i` 和 `j` 的地址而不是它们的值。当\
  \ `swap()` 返回时，`i` 和 `j` 的值将完成交换，如下输出所示：\n\n![Image](img/00414.gif)\n\n#### ![Image](img/00003.jpeg)\
  \ 进度检查\n\n1. 1 解释值传递。\n2. 2 解释引用传递。\n3. 3 C++ 默认使用什么参数传递机制？\n\n## 关键技能 6.4 引用参数\n\
  \n虽然可以使用指针手动通过使用指针来实现引用传递，但这种方法相当笨拙。首先，它强迫你在调用函数时传递参数的地址（而不是值）。其次，它要求你记住。幸运的是，在\
  \ C++ 中，可以通过在函数声明中在参数名前加上 `&` 来告诉编译器使用引用传递而不是值传递。\n\n为了理解引用参数，让我们从一个简单的示例开始。在下面，`f()`\
  \ 接收一个 `int` 引用参数：\n\n![Image](img/00415.gif)\n\n此程序显示如下输出：\n\n![Image](img/00416.gif)\n\
  \n特别这里 `f()` 的定义：\n\n![Image](img/00417.gif)\n\n注意 `i` 的声明。它的前面有一个 `&`，这使其成为一个引用参数。在函数内部，以下语句\n\
  \n![Image](img/00418.gif)\n\n并不是给 `i` 赋值 10。相反，它是给 `i` 引用的变量（在此例中为 `val`）赋值 10。注意此语句没有使用\
  \ `*` 运算符。\n\n由于 `i` 被声明为引用参数，编译器会自动向 `f()` 传递它被调用的任何参数的地址。因此，在 `main()` 中，语句\n\n\
  ![Image](img/00419.gif)\n\n将 `val` 的地址（而不是它的值）传递给 `f()`。不需要在 `val` 前加上 `&` 运算符。（这样做将是错误的。）由于\
  \ `f()` 以引用的形式接收 `val` 的地址，它可以修改 `val` 的值。\n\n为了在实际中使用引用参数——并充分演示其优势，下面的程序使用引用重写了\
  \ `swap()` 函数。仔细观察 `swap()` 是如何声明和调用的。\n\n![Image](img/00420.gif)\n\n![Image](img/00421.gif)\n\
  \n输出与之前的版本相同。再次注意，通过使 `x` 和 `y` 为引用参数，在交换值时不需要使用 `*` 运算符。记住，编译器会自动生成调用 `swap()`\
  \ 的参数的地址，并自动解引用 `x` 和 `y`。\n\n\n\n\n让我们回顾一下。当你创建一个引用参数时，该参数会自动引用（即隐式地指向）调用函数时使用的参数。此外，不需要对参数应用\
  \ `&` 运算符。同样，在函数内部，引用参数是直接被使用的；不需要使用 `*` 运算符。所有涉及引用参数的操作会自动引用调用函数时使用的参数。最后，当你给引用参数赋值时，你实际上是将该值赋值给引用所指向的变量。对于函数参数而言，这将会是调用函数时所使用的变量。\n\
  \n最后一点：C 语言不支持引用。因此，在 C 中创建引用调用的唯一方法是使用指针，正如早些在 `swap()` 的第一个版本中所示的那样。在将 C 代码转换为\
  \ C++ 时，在可行的情况下，你会希望将这些类型的参数转换为引用。\n\n### 专家问答\n\n**问：在某些 C++ 代码中，我看到一种声明样式，其中 `&`\
  \ 与类型名关联，如下所示：**\n\n![Image](img/00422.gif)\n\n**而不是与变量名关联，如下：**\n\n![Image](img/00423.gif)\n\
  \n**这两者有区别吗？**\n\n**答：** 短的回答是，这两种声明之间没有区别。例如，这里是编写 `swap()` 原型的另一种方式：\n\n![Image](img/00424.gif)\n\
  \n如你所见，`&` 紧邻 `int` 而不是 `x`。此外，某些程序员还通过将 `*` 与类型而非变量关联来指定指针，如下所示：\n\n![Image](img/00425.gif)\n\
  \n这类声明反映了某些程序员希望 C++ 包含独立的引用类型或指针类型的愿望。然而，将 `&` 或 `*` 与类型而非变量关联的棘手之处在于，根据正式的 C++\
  \ 语法，`&` 或 `*` 均不分配到变量列表的每一个上，这可能导致令人困惑的声明。例如，以下声明创建了*一个*（而不是*两个*）`int` 指针：\n\n\
  ![Image](img/00426.gif)\n\n在这里，`b` 被声明为整数（而不是整数指针），因为根据 C++ 语法规定，当在声明中使用时，`*` 或\
  \ `&` 会链接到其之前的单个变量，而不是其其后的类型。\n\n重要的一点是理解，对于 C++ 编译器而言，无论你写 `int p` 还是 `int* p`\
  \ 并不重要。因此，如果你倾向于将 `*` 或 `&` 与类型而非变量关联，请尽管这样做。然而，为了避免混淆，本书将继续将 `*` 和 `&` 与它们各自修改的变量名关联，而不是与类型关联。\n\
  \n#### ![Image](img/00003.jpeg) 进度检查\n\n**1**. 引用参数是如何声明的？\n\n**2**. 在调用使用引用参数的函数时，必须在参数前加\
  \ `&` 吗？\n\n**3**. 在接收引用参数的函数内部，对该参数的操作需要需要加 `*` 或 `&` 吗？\n\n## 关键技能 6.5 返回引用\n\n\
  函数可以返回引用。在 C++ 编程中，引用返回有几种用途。其中一些用法必须等到本书稍后后的部分才能讨论。然而，有些用法是你现在就可以使用的。\n\n当函数返回引用时，它返回的是指向其返回值的隐式指针。这产生了一个相当惊的可能性：函数可以用于赋值语句的左侧！例如，考虑这个简单的程序：\n\
