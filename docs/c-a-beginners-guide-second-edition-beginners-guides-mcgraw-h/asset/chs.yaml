  \ `getval()`。这种表示法将帮助你区分书中的变量名和函数名。\n\n### C++ 库\n\n正如刚才解释的，`abs()` 是你的 C++ 编译器提供的。该函数以及许多其他函数可以在*标准库*中找到。在本书的示例程序中，我们将使用库函数。\n\
  \nC++ 定义了大量包含在标准函数库中的函数。这些函数执行许多常见的需要的任务，包括 I/O 操作、数学计算和字符串处理。当你使用库函数时，C++ 编译器会将该函数的对象的代码链接到你程序的对象的代码中。\n\
  \n由于 C++ 标准库非常庞大，它已经包含了许多程序中可能需要的函数。库函数相当于构建块，你只需要对其进行组装。你应该探索你编译器的库文档。你可能会对库函数的多样性感到惊讶。如果你写了一个会反复使用的函数，它也可以存储在库中。\n\
  \n除了提供库函数外，每个 C++ 编译器还包含一个*类库*，它是一个面向对象的库。然而，你需要在学习类和对象之后才能使用该类库。\n\n#### ![Image](img/00003.jpeg)\
