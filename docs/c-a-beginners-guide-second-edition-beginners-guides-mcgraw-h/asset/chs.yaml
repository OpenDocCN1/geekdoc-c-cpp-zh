  \ 9.11 非成员运算符函数\n\n你可以通过使用非成员函数来重载某个类的运算符，该函数通常是该类的友元（friend）。正如你之前学到的，由于友元函数没有\
  \ `this` 指针。因此，当使用友元来重载运算符时，在重载二元运算符时，两个操作数都被显式传递；在重载一元运算符时，一个操作数显式传递。无法使用友元函数重载的运算符只有\
  \ `=`、`( )`、`[ ]` 和 `−−`。\n\n以下程序使用友元函数而非成员函数来重载 `ThreeD` 类的 `+` 运算符：\n\n![Image](img/00700.jpeg)\n\
  \n![Image](img/00701.jpeg)\n\n输出显示此处：\n\n![Image](img/00702.gif)\n\n通过观察 `operator()`，你可以看到，现在两个操作数都被传递给它。左侧操作数通过\
  \ `op1` 传递，右侧操作数通过 `op2` 传递。\n\n在很多情况下，在重载运算符时使用友元函数代替成员函数并没有益处。然而，有一种情况友元函数非常有用：当你想让一个内置类型的对象出现在二元操作的左侧时。为了理解为什么，请考虑以下情况。如你所知，调用成员运算符函数的对象的指针是通过\
  \ `this` 传递的。在二元运算符的情况下，左侧的对象调用了该函数。只要左侧的对象定义了指定的操作，这样做就是没问题的。例如，假设有一个名为 `T` 的对象，它定义了赋值和整数加法，那么下面是一个完全有效的语句：\n\
  \n![Image](img/00703.gif)\n\n由于对象 `T` 位于 `+` 运算符的左侧，它调用了其重载的运算符函数，该函数（可能）能够为 `T`\
  \ 的某个元素加上一个整数值。然而，这条语句无法工作：\n\n![Image](img/00704.gif)\n\n这条语句的问题在于，`+` 运算符左侧的对象是一个整数，这是一个内置类型，对于该类型，没有定义任何涉及整数和\
  \ `T` 类型对象的操作。\n\n上述问题的解决方案是使用两个友元函数来重载 `+`。在这种情况下，运算符函数显式地传递了两个参数，并像其他其他重载函数一样根据其参数的类型被调用。一个版本的\
  \ `+` 运算符函数处理 `object + integer`，另一个处理 `integer + object`。使用友元函数重载 `+`（或其他任何运算符）允许内置类型出现在左侧或右侧。以下程序说明了这一点。它为\
  \ `ThreeD` 对象定义了两个版本的 `operator()`。它们为 `ThreeD` 的实例变量加上一个整数值。整数可以在运算符的左侧或右侧。\n\n\
  ![Image](img/00705.jpeg)\n\n![Image](img/00706.gif)\n\n![Image](img/00707.gif)\n\
  \n输出显示此处：\n\n![Image](img/00708.gif)\n\n由于 `operator()` 函数被重载了两次，它可以适应整数和 `ThreeD`\
  \ 对象出现的两种方式。\n\n#### 使用友元重载一元运算符\n\n你也可以通过友元函数来重载一元运算符。然而，如果你正在重载 `++` 或 `−−`，你必须将操作数作为引用参数传递给函数。由于引用参数是参数的指针，对参数的会影响参数。使用引用参数允许函数影响对象。\n\
  \n在使用友元重载递增递减运算符时，前缀形式取一个参数（即操作数）。后置形式取两个参数。第二个参数是一个整数，且未使用。\n\n以下是为 `ThreeD` 类重载两种形式的友元\
