  ### 关键技能 12.5 命名空间 (Namespaces)\n\n在 模块 1 中简要描述了命名空间。这里将对其进行详细检查。命名空间的目的是将标识符名称局部化，以避免名称冲突。在\
  \ C++ 编程环境中，变量、函数和类名称呈爆炸式增长。在命名空间发明之前，所有这些名称都在全局命名空间中竞争位置，并引发许多冲突。例如，如果你的程序定义了一个名为\
  \ `toupper()` 的函数，它可能会（取决于参数列表）覆盖标准库函数 `toupper()`，因为这两个名称都存储在全局命名空间中。当同一个程序使用两个或多个第三方库时，名称冲突问题会更加严重。在这种情况下，一个库定义的名称很有可能——甚至可能——与另一个库定义的相同名称冲突。这种情况对于类名来说可能尤为棘手。例如，如果你的程序定义了一个名为\
  \ `Stack` 的类，而你的程序使用的某个库也定义了同名的类，就会产生冲突。\n\n`namespace` 关键字的创建是为了应对这些问题。因为它局部化了在其内部声明的名称的可见性，命名空间允许在不同的上下文中使用相同的名称而不会产生冲突。`namespace`\
  \ 最显著的受益者可能是 C++ 标准库。在 `namespace` 之前，整个 C++ 库都定义在全局命名空间中（当然，那是唯一的命名空间）。自从引入 `namespace`\
  \ 后，C++ 库现在定义在自己的命名空间中，称为 `std`，这减少了名称冲突的可能性。你还可以在程序中创建自己的命名空间，以局部化你认为可能引起冲突的任何名称的可见性。如果你正在创建类或函数库，这一点尤为重要。\n\
  \n## 命名空间基础\n\n`namespace` 关键字允许通过创建一个声明区域来划分全局命名空间。本质上，`namespace` 定义了一个作用域。`namespace`\
  \ 的通用形式所示：\n\n![Image](img/00913.gif)\n\n在 `namespace` 语句中定义的任何内容都在该命名空间的作用域内。\n\
  \n这是一个 `namespace` 的示例。它局部化了实现简单倒计时计数器类所使用的名称。命名空间中定义了实现计数器的 `counter` 类，以及变量 `upperbound`\
  \ 和 `lowerbound`，它们包含了适用于所有计数器的上限和下限。\n\n![Image](img/00914.gif)\n\n在这里，`upperbound`、`lowerbound`\
  \ 和 `counter` 类是 `CounterNameSpace` 命名空间定义的作用域的一部分。\n\n在命名空间内部，在该命名空间内声明的标识符可以直接引用，无需任何命名空间限定。例如，在\
  \ `CounterNameSpace` 内部，`run()` 函数可以在语句中直接引用 `lowerbound`：\n\n![Image](img/00915.gif)\n\
  \n然而，由于 `namespace` 定义了作用域，你需要使用作用域解析运算符从命名空间外部引用在命名空间内声明的对象。例如，要从 `CounterNameSpace`\
  \ 外部的代码为 `upperbound` 赋值 10，你必须使用这条语句：\n\n![Image](img/00916.gif)\n\n或者，从 `CounterNameSpace`\
  \ 外部声明一个 `counter` 类型的对象，你将使用这条语句：\n\n![Image](img/00917.gif)\n\n通常情况下，从命名空间外部访问命名空间的成员时，需要在成员名称前加上命名空间名称和作用域解析运算符。这里有一个演示\
  \ CounterNameSpace 的程序：\n\n![Image](img/00918.gif)\n\n![Image](img/00919.gif)\n\n\
  ![Image](img/00920.gif)\n\n注意，`counter` 对象的声明以及对 `upperbound` 和 `lowerbound` 的引用都通过\
  \ `CounterNameSpace` 限定。然而，一旦声明了类型为 `counter` 的对象，就不需要对其进一步限定。因此，可以直接调用 `ob1.run()`；命名空间已经解析。\n\
  \n命名空间可以多次声明。在这种情况下，命名空间是叠加的。这允许将命名空间划分在多个文件中，甚至在同一个文件中分离。例如：\n\n![Image](img/00921.gif)\n\
  \n在这里，`NS` 被分为两个部分，但每个部分仍在同一个命名空间 `NS` 之中。\n\n最后一点：命名空间可以嵌套。也就是说，一个命名空间可以定义另一个命名空间内部。\n\
  \n#### using\n\n如果你的程序频繁引用命名空间的成员，每次需要引用时都指定命名空间和作用域运算符会变得非常繁琐。`using` 语句的发明是为了解决这个问题。`using`\
  \ 语句有两种通用形式：\n\n```\nusing namespace name;\nusing name::member;\n```\n\n在第一形式中，`name`\
  \ 指定要访问的命名空间名称。指定的命名空间内定义的所有成员都被带入视野（即它们成为了当前命名空间的一部分），并且无需限定即可使用。在第二形式中，只有命名空间中的特定成员变得可见。例如，假设如上所示的\
  \ CounterNameSpace，以下 `using` 语句和赋值是有效的：\n\n![Image](img/00922.gif)\n\n以下程序通过重写之前的计数器示例，演示了\
  \ **using** 的用法：\n\n![Image](img/00923.gif)\n\n![Image](img/00924.gif)\n\n![Image](img/00925.gif)\n\
  \n\n\n\n\n该程序说明了另一个重要点：使用一个命名空间不会覆盖另一个。当你将一个命名空间引入视野时，它只是将其中的名称添加到当前生效的任何其他命名空间中。因此，在程序结束时，`std`\
  \ 和 `CounterNameSpace` 都被添加到了全局命名空间。\n\n## 匿名命名空间\n\n存在一种特殊的命名空间类型，称为无命名命名空间（unnamed\
  \ namespace），它允许你在文件中创建在文件内唯一的标识符。它的通用形式如下：\n\n![Image](img/00926.gif)\n\n无命名命名空间允许你建立仅在单个文件作用范围内已知的唯一标识符。也就是说，在包含该匿名命名空间的文件的内部，该命名空间的成员可以直接使用，而无需限定符。但在文件外部，这些标识符是未知的。\n\
  \n正如本书书前面提到的部分，限制全局名称作用范围到其声明所在文件的一种方法是将其声明为 `static`。虽然 C++ 仍然允许使用 `static` 全局声明，但实现此点的更好方法是使用无命名命名空间。\n\
  \n## std 命名空间\n\n标准 C++ 将其整个库定义在自己的命名空间中，称为 `std`。这就是为什么书中的大多数程序都包含了以下语句：\n\n![Image](img/00927.gif)\n\
  \n这会导致 `std` 命名空间被引入当前命名空间，从而让你能够直接访问库中定义的函数和类的名称，而无需为每个名称都使用 `std::` 进行限定。\n\n\
  当然，如果你喜欢，也可以显式地为每个名称使用 `std::` 进行限定。例如，你可以这样显式地限定 `cout`：\n\n![Image](img/00928.gif)\n\
  \n如果你的程序对标准 C++ 库的使用有限，或者这样做会导致名称冲突，你可能不想将标准 C++ 库引入全局命名空间。然而，如果你的程序包含数百个对库名称的引用，那么将\
  \ `std` 引入当前命名空间比逐个限定每个名称容易得多。\n\n## 进度检查\n\n**1**. 什么是命名空间？什么关键字创建它？\n\n**2**.\
  \ 命名空间是相加的吗？\n\n**3**. `using` 起什么作用？\n\n## 关键技能 12.6 static 类成员\n\n你在 第 7 模块 中学习过\
  \ `static` 关键字，当时它被用于修改局部和全局变量声明。除了这些用法外，`static` 还可以应用于类的成员。变量成员和函数成员都可以声明为 `static`。这里对每者进行了描述。\n\
  \n### static 成员变量\n\n当你在成员变量声明之前加上 `static` 时，你是在告诉编译器该变量只存在一个副本，并且类的所有对象将共享该变量。与普通数据成员不同，`static`\
  \ 成员变量的单独副本不会为每个对象创建。无论创建了多少个类对象，`static` 数据成员都只存在一个。因此，该类的所有对象都使用同一个变量。如果没有指定其他初始化，所有\
  \ `static` 变量都将初始化为零。\n\n当你在类内部声明 `static` 数据成员时，你*并没有*在定义它。相反，你必须在类外的地方为它提供一个全局定义。这是通过使用作用域解析运算符重新声明\
  \ `static` 变量以识别它属于哪个类来实现的。这为 `static` 变量分配存储。\n\n这是一个使用 `static` 成员的示例：\n\n![Image](img/00929.gif)\n\
  \n![Image](img/00930.gif)\n\n输出显示在此：\n\n![Image](img/00931.gif)\n\n在程序中，注意 `static`\
  \ 整数 `num` 既在 `ShareVar` 类内部声明，又被定义为全局变量。正如前面所述，这是必要的，因为 `ShareVar` 内部对 `num` 的声明*没有*为变量分配存储。由于没有提供其他初始化，C++\
  \ 将 `num` 初始化为 0。这就是为什么第一次调用 `shownum()` 时都显示 0。接下来，对象 `a` 将 `num` 设置为 10。然后 `a`\
  \ 和 `b` 都使用 `shownum()` 显示其值。因为 `a` 和 `b` 共享一个 `num` 副本，两次调用 `shownum()` 都显示 10。\n\
  \n当 `static` 变量是公有的时，可以通过它的类名直接引用，而无需引用任何特定对象。它也可以通过对象引用。例如：\n\n![Image](img/00932.gif)\n\
  \n![Image](img/00933.gif)\n\n注意这一行中如何使用其类名设置 `num` 的值：\n\n![Image](img/00934.gif)\n\
  \n它也可以通过对象访问，如这一行所示：\n\n![Image](img/00935.gif)\n\n两种方法都是有效的。\n\n### static 成员函数\n\
  \n成员函数也可以声明为 `static`，但这种用法并不常见。声明为 `static` 的成员函数只能访问其类的 `static` 成员。（当然，`static`\
  \ 成员函数没有 `this` 指针。不允许虚 `static` 成员函数。它不能声明为 `const` 或 `volatile`。）\n\n`static`\
  \ 成员函数可以通过类的对象调用，也可以独立于任何对象使用类名调用。例如，考虑这个程序。它定义了一个 `static` 变量 `count` 来记录当前存在的对象数量。\n\
  \n![Image](img/00936.gif)\n\n![Image](img/00937.gif)\n\n程序的输出在此：\n\n![Image](img/00938.gif)\n\
  \n在程序中，注意如何调用 `static` 函数 `numObjects()`。在前两次调用中，它通过类名使用以下语法调用：\n\n![Image](img/00939.gif)\n\
  \n第三次调用中，它通过对象的点运算符调用。\n\n## 关键技能 12.7 运行时类型识别 (RTTI)\n\n运行时类型信息对你来说可能是全新的，因为它不在非多态语言（如\
  \ C 或传统的 BASIC）中。在非多态语言中不需要运行时类型信息，因为每个对象的类型在编译时（即编写程序时）是已知的。然而，在 C++ 这样的多态语言中，可能会出现对象类型在编译时未知的情况，因为对象的精确性质直到运行时才能确定。正如你所知，C++\
  \ 通过使用类层次、虚函数和基类指针来实现多态。基类指针可以指向基类对象，也可以指向*派自该基类的任何对象*。因此，始终无法预知基指针在任何时刻指向什么类型的对象。这种确定必须在运行时使用运行时类型识别来进行。\n\
  \n要获取对象的类型，使用 `typeid`。你必须包含头文件 `<typeinfo>` 以使用 `typeid`。它最常用的形式所示：\n\n```\ntypeid(*object*)\n\
  ```\n\n在这里，*object* 是你将获取类型的对象。`typeid` 返回一个 `type_info` 类型对象的引用，用于描述 *object* 的类型。\n\
  \n`type_info` 类定义了以下公共成员：\n\n```\nbool operator==(const type_info &ob);\n\nbool\
  \ operator!=(const type_info &ob);\n\nbool before(const type_info &ob);\n\nconst\
  \ char *name( );\n```\n\n\n\n重载的 `==` 和 `!=` 提供了类型比较。`before()` 函数在调用对象在排序顺序上早于作为参数使用的对象时返回\
  \ `true`。（此函数主要供内部使用。其返回值与继承或类层级结构无关。）`name()` 函数返回一个指向类型名称的指针。\n\n这里是一个使用 `` `typeid:`\
  \ 的简单示例：\n\n![Image](img/00940.gif)\n\n![Image](img/00941.gif)\n\n该程序的输出在此所示：\n\n\
  ![Image](img/00942.gif)\n\n`typeid` 最重要的用处可能发生在通过多态基类的指针（即至少包含一个虚函数的类）应用它时。在这种情况下，它将自动返回所指向的实际对象的类型，该对象可能是一个基类对象，或派生自该基类的对象。（记住，基类指针可以指向基类对象，也可以指向派生自该基类的任何类对象。）因此，使用\
  \ `typeid`，你可以在运行时确定基类指针所指向的对象的类型。以下程序演示了这一原理：\n\n![Image](img/00943.gif)\n\n![Image](img/00944.gif)\n\
  \n该程序的输出在此所示：\n\n![Image](img/00945.gif)\n\n如输出所示，当 `typeid` 应用于多态类型的基类指针时，所指向的对象的类型将在运行时确定。\n\
  \n在所有情况下，当 `typeid` 应用于非多态类层级结构的指针时，将获得指针的基类型。也就是说，不会确定该指针实际上指向什么。作为一项实验，请注释掉 `Base`\
  \ 中的虚函数 `f()` 并观察结果。如你所见，每个对象的类型都将是 `Base`，因为那是指针的类型。\n\n由于 `typeid` 通常应用于解引的指针（即应用了\
  \ `*` 运算符的指针），因此创建了一个特殊异常来处理被解引的指针为空的情况。在这种情况下，`typeid` 会抛出 `bad_typeid` 异常。\n\n\
  对多态类层级结构对象的引用工作与指针相同。当 `typeid` 应用于多态类对象的引用时，它将返回实际实际引用的对象的类型，该类型可能是派生类型。你最常使用此特性的情况是对象通过引用传递给函数时。\n\
  \n`typeid` 有第二种形式，接受类型名称作为参数。这种形式所示所示：\n\n```\ntypeid(*type-name*)\n```\n\n例如，以下语句是完全允许的：\n\
  \n![Image](img/00946.gif)\n\n这种形式的 `typeid` 的主要用途是获取一个描述指定类型的 `type_info` 对象，以便可以在类型比较语句中使用。\n\
