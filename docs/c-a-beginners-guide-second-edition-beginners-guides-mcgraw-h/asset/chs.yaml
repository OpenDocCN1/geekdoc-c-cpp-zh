  \nC++ 支持广泛的字符串处理函数。最常用的有：\n\n`strcpy()`\n`strcat()`\n`strcmp()`\n`strlen()`\n\n\
  这些字符串函数都使用同一个头文件 `<cstring>`。现在让我们来看这些函数。\n\n#### strcpy\n\n调用 `strcpy()` 的通用形式如下：\n\
  \n```\nstrcpy(to, from);\n```\n\n`strcpy()` 函数将字符串 `from` 的内容复制到 `to` 中。请记住，形成 `to`\
  \ 的数组必须足够大，能够容纳 `from` 中的字符串。如果空间不够，`to` 数组将溢出，这可能会导致程序崩溃。\n\n#### strcat\n\n调用\
  \ `strcat()` 的形式如下：\n\n```\nstrcat(s1, s2);\n```\n\n`strcat()` 函数将 `s2` 追加到 `s1`\
  \ 的末尾；`s2` 保持不变。你必须确保 `s1` 足够大，能够容纳其原始内容以及 `s2` 的内容。\n\n#### strcmp\n\n调用 `strcmp()`\
  \ 的通用形式如下：\n\n```\nstrcmp(s1, s2);\n```\n\n`strcmp()` 函数比较两个字符串，如果它们相等则返回 0。如果 `s1`\
  \ 在字典序上大于 `s2`（即根据字典顺序），则返回一个正数；如果 `s1` 小于 `s2`，则返回一个负数。\n\n使用 `strcmp()` 的关键记住当字符串匹配时它返回假（false）。因此，如果你想在字符串相等时执行某些操作，则需要使用运算符\
  \ `!`。例如，当 `str` 等于“C++”时，控制后续 `if` 语句的条件为真：\n\n![Image](img/00257.gif)\n\n####\
  \ strlen\n\n调用 `strlen()` 的通用形式为\n\n```\nstrlen(s);\n```\n\n其中 `s` 是一个字符串。`strlen()`\
  \ 函数返回 `s` 所指向字符串的长度。\n\n## 字符串函数示例\n\n以下程序演示了四个字符串函数的使用：\n\n![Image](img/00258.gif)\n\
