  想学习 Windows 编程，我们建议以下 Schildt 的书籍：\n\n- *从零开始 Windows 98 编程*\n- *从零开始 Windows 2000\
  \ 编程*\n- *从零开始 MFC 编程*\n- *Windows 编程注释归集*\n\n如果你想学习 C 语言（它是所有现代编程的 same），那么以下标题将让你感兴趣：\n\
  \n- *C：完全参考*\n- *自学 C*\n\n当你需要可靠且快速的答案时，请查阅公认的编程权威 Herbert Schildt。\n\n## 模块 1：C++\
  \ 基础\n\n### 关键技能\n\n- **1.1** 理解 C++ 背后的历史\n- **1.2** 了解 C++ 如何与 C、C# 和 Java 关系\n\
  - **1.3** 学习面向对象编程的三大原则\n- **1.4** 创建、编译和运行 C++ 程序\n- **1.5** 使用变量\n- **1.6** 使用运算符\n\
  - **1.7** 从键盘读取输入\n- **1.8** 使用 `if` 和 `for` 语句\n- **1.9** 应用代码块\n- **1.10** 使用函数\n\
  - **1.11** 认识 C++ 关键字\n- **1.12** 理解 C++ 标识符规则\n\n### 关键技能 1.1 C++ 简史\n\nC++ 的历史始于\
  \ C。其原因很容易理解：C++ 是在 C 的基础之上构建的。因此，C++ 是 C 的超集。C++ 扩展并增强了 C 语言，以支持面向对象编程（在本模块稍后部分描述）。C++\
  \ 还对 C 语言增加了许多改进，包括一套扩展的库例程。然而，C++ 的大部分精神和风格直接继承自 C。因此，为了充分理解并欣赏 C++，你需要理解 C 背后的“如何”和“为什么”。\n\
  \n#### C：现代编程时代的开启\n\nC 的发明定义了现代编程时代的开启。它的影响不应被低估，因为它从根本上改变了编程的方法和思考方式。它的设计哲学和语法影响了此后的每种主流语言。C\
  \ 是计算领域主要的、革命性的力量之一。\n\nC 是由 Dennis Ritchie 在运行 UNIX 操作系统的 DEC PDP-11 上发明并首次实现的。C\
  \ 是一个从更老的语言 BCPL 开始的开发过程的成果。BCPL 由 Martin Richards 开发。BCPL 影响了一门名为 B 的语言，B 由 Ken\
  \ Thompson 发明，并导致了 20 世纪 70 年代 C 的诞生。\n\n\n\n在 C 语言发明之前，计算机语言通常是作为学术练习设计的，或者是由官僚委员会设计的。C\
  \ 语言则不同。它由真实、一线工作的程序员设计、实现并开发，反映了他们处理编程工作的方式。它的特性是由实际使用该语言的人经过磨炼、测试、思考和重新考虑的。因此，C\
  \ 吸引了许多支持者，并迅速成为全球程序员的首选语言。\n\nC 语言诞生于 20 世纪 60 年代的*结构化编程*革命。在结构化编程之前，大型程序很难编写，因为程序逻辑往往会退化为“面条代码”（spaghetti\
  \ code）——这是一种由跳转、调用和返回组成的错综复杂的混合体，难以追踪。结构化语言通过添加定义良好的控制语句、带有局部变量的子程序以及其他改进解决了这一问题。使用结构化语言使得编写中等规模程序成为可能。\n\
  \n尽管当时还有其他结构化语言（如 Pascal），但 C 是第一个成功结合了强大、优雅和表达能力的语言。它简洁而易于使用的语法，加上“由程序员（而非语言）主宰”的哲学，迅速赢得了许多追随者。从今天的视角来看，它可能有些难以理解，但\
  \ C 语言是程序员期待已久的一清风。因此，C 语言成为了 20 世纪 80 年代最常用的结构化编程语言。\n\n## C++ 的需求\n\n考虑到上述讨论，你可能会好奇为什么要发明\
  \ C++。既然 C 已经是一种成功的计算机编程语言，为什么还需要其他语言呢？答案是*复杂性*。在整个编程史上，程序复杂性的不断增加驱动了对更好方法来管理这种复杂性的需求。C++\
  \ 正是对这种需求的响应。为了更好地理解程序复杂性增加与计算机语言发展之间的联系，请考虑以下内容。\n\n自从计算机发明以来，编程方法发生了巨大的变化。例如，当计算机刚发明时，编程是通过使用计算机的前面板拨动开关二进制机器指令来完成的。只要程序只有几百条指令长，这种方法就是有效的。随着程序的规模扩大，汇编语言应运生，程序员可以使用机器指令的符号表示来处理更大、日益复杂的程序。随着程序的持续增长，高级语言也被开发出来，为程序员提供了更多工具来处理复杂性。\n\
  \n第一种被广泛使用的计算机语言无疑是 FORTRAN。虽然 FORTRAN 是一个令人印象深刻的第一步，但它很难说是一种鼓励编写清晰、易懂程序的语言。20 世纪\
  \ 60 年代诞生了结构化编程，这是 C 等语言所鼓励的编程方法。有了结构化语言，人们第一次可以相当容易地编写中等复杂的程序。然而，即使使用结构化编程方法，一旦项目达到一定规模，其复杂性就会超过程序员能够管理的范围。到\
  \ 20 世纪 70 年代后期，许多项目接近或达到了这一点。\n\n为了应对这个问题，一种新的编程方法开始出现：*面向对象编程*（OOP）。使用 OOP，程序员可以处理更大、更复杂的程序。问题是\
  \ C 不支持面向对象编程。对面向对象的版本的 C 的渴望最终导致了 C++ 的诞生。\n\n从总体来看，尽管 C 是世界上最受欢迎和使用最广泛的专业编程语言之一，但总会有其处理复杂性的能力被超越的时候。一旦程序达到某个规模，它就会变得极其复杂，至于难以作为一个整体来把握。C++\
  \ 的目的是打破这一障碍，帮助程序员理解和管理更大、更复杂的程序。\n\n## C++ 的诞生\n\nC++ 由比雅恩·斯特鲁斯特普（Bjarne Stroustrup）于\
  \ 1979 年在新泽西州默里·希尔的贝尔实验室发明。他最初将这种新语言称为“带类的 C 语言”。然而，在 1983 年，名称更改为 C++。\n\n斯特鲁斯特普在\
  \ C 的基础之上构建了 C++，包含了 C 的所有特性、属性和优点。他还遵循了 C 的底层哲学，即由程序员（而非语言）主宰。在这里，至关重要的一点是理解：斯特鲁斯特普并没有创建一个全新的编程语言。相反，他是增强了一种已经非常成功的语言。\n\
  \n斯特鲁斯特普为 C 添加的大部分特性都是为了支持面向对象编程。从本质上说，C++ 是 C 的面向对象版本。通过在 C 的基础上构建，斯特鲁斯特普提供了一条通向\
  \ OOP 的平滑迁移路径。C 程序员不需要学习一门完全新的语言，只需要学习几个新功能，就可以从面向对象的方法论中获益。\n\n在创建 C++ 时，斯特鲁斯特普知道保持\
  \ C 的原始精神（包括其效率、灵活性和哲学）很重要，同时又要增加对面向对象编程的支持。幸运的是，他的目标实现了。C++ 仍然为程序员提供了 C 的自由和控制，并结合了对象的强大。\n\
  \n尽管 C++ 最初设计用于辅助管理非常大的程序，但它绝不限于此用途。事实上，C++ 的面向对象属性可以有效应用于几乎任何编程任务。看到 C++ 用于编辑器、数据库、个人文件系统、网络工具和通信程序等项目并不罕见。因为\
  \ C++ 共享了 C 的效率，许多高性能系统软件都是使用 C++ 构建的。此外，C++ 通常是 Windows 编程的首选语言。\n\n## C++ 的演进\n\
  \n自从 C++ 发明以来，它经历了三次重大修订，每次修订都增加并改变了这种语言。第一次修订是在 1985 年，第二次是在 1990 年。第三次发生在 C++\
  \ 标准化期间。几年前，开始制定 C++ 标准。为了实现这一目标，成立了一个由 ANSI（美国国家标准协会）和 ISO（国际标准组织）组成的标准化委员会。拟议的标准的草案于\
  \ 1994 年 1 月 25 日创建。在那份草案中，ANSI/ISO C++ 委员会（我是其中的成员）保留了斯特鲁斯特普最初定义的特性，并增加了一些新特性。但总来说，这份初始草案反映了当时\
  \ C++ 的状态。\n\n在 C++ 标准草案完成后不久，发生了一个事件导致标准大大扩展：亚历山大·斯特潘帕诺夫（Alexander Stepanov）创建了标准模板库（STL）。STL\
  \ 是一组用于操作数据的泛型例程。它既强大又优雅，但也非常庞大。在第一草案之后，委员会投票将 STL 包含在 C++ 规范中。STL 的加入将 C++ 的范围远远超出了其原始定义。虽然很重要，但包括\
  \ STL 在内的其他因素减慢了 C++ 的标准化进程。\n\n\n\n本书中的内容描述的是标准 C++。这是所有主流 C++ 编译器（包括微软的 Visual\
  \ C++ 和 Borland 的 C++ Builder）都支持的 C++ 版本。因此，书中的代码和信息完全完全移植。\n\n### 关键技能 1.2 C++\
  \ 与 Java 及 C# 的关系\n\n除了 C++ 之外，还有两种重要的现代编程语言：Java 和 C#。Java 由太阳微系统公司（Sun Microsystems）开发，而\
  \ C# 由微软创建。由于人们有时对这两种语言与 C++ 的关系感到困惑，因此有必要简要讨论它们的关系。\n\nC++ 都是 Java 和 C# 的父类。尽管\
  \ Java 和 C# 都添加、删除并修改了各种特性，但总的来说，这三种语言的语法几乎完全相同。此外，C++ 使用的对象模型与 Java 和 C# 使用的模型相似。最后，这些语言的整体“外观和感受”非常相似。这意味着一旦你学会了\
  \ C++，就可以很容易地学习 Java 或 C#。反之亦然。如果你熟悉 Java 或 C#，学习 C++ 是很容易的。这也是 Java 和 C# 共享 C++\
  \ 语法和对象模型的原因之一；这有助于了大量经验丰富的 C++ 程序员快速采用它们。\n\nC++、Java 和 C# 之间的主要区别在于它们各自设计的计算环境类型。C++\
  \ 的创建是为了为特定的 CPU 和操作系统产生高性能程序。例如，如果你想编写一个运行在 Windows 操作系统下的 Intel Pentium 处理器上的程序，那么\
  \ C++ 是最好的语言。\n\n### 专家问答\n\n**Q：Java 和 C# 是如何创建跨平台的可移植程序的？为什么 C++ 做不到这一点？**\n\n\
  **A：** Java 和 C# 可以创建跨平台的可移植程序，而 C++ 不能，这是由于编译器产生的对象代码类型不同。对于 C++ 来说，编译器的输出是 CPU\
  \ 直接执行的机器码。因此，它取决于特定的 CPU 和操作系统。如果你想在不同的系统上运行 C++ 程序，你需要针对该环境专门将其重新编译为机器码。要创建一个可以在多种环境中运行的\
  \ C++ 程序，需要多个不同的可执行版本。\n\nJava 和 C# 通过将程序编译成伪代码（中间语言）来实现移植性。在 Java 中，这种中间语言被称为 `bytecode`（字节码）。对于\
  \ C#，它被称为 `Microsoft Intermediate Language`（MSIL）。在两种情况下，这种伪代码都由运行时系统执行。对于 Java\
  \ 来说，这个运行时系统被称为 Java 虚拟机（JVM）。对于 C#，它是通用语言运行时（CLR）。因此，Java 程序可以在任何可用 `JVM` 的环境中运行，而\
  \ C# 程序可以在任何实现了 `CLR` 的环境中运行。\n\n由于 Java 和 C# 的运行时系统位于程序和 CPU 之间，Java 和 C# 程序会产生\
  \ C++ 程序在执行时不存在具备额外开销。这就是为什么 C++ 程序通常运行得比用 Java 或 C# 编写的对应程序更快。\n\nJava 和 C# 的开发是为了响应互联网环境的独特编程需求。（C#\
  \ 的设计也是为了简化软件组件的创建。）互联网连接到许多不同类型的 CPU 和操作系统。因此，产生跨平台的可移植程序变成了一个首要考虑的问题。\n\n第一个解决这一需求的语言是\
  \ Java。使用 Java，可以编写出在各种环境中运行的程序。因此，Java 程序可以在互联网上自由移动。然而，你为移植性付出的代价是效率，Java 程序的执行速度比\
  \ C++ 程序慢。C# 也是如此。从根本来看，如果你想创建高性能软件，请使用 C++。如果你需要创建高移植性的软件，请使用 Java 或 C#。\n\n最后一点：记住，C++、Java\
  \ 和 C# 设计用于解决一组不同的问题。这并不是关于哪种语言本身最好的问题，而是哪种语言适合当前任务的问题。\n\n#### ![Image](img/00003.jpeg)\
  \ 进度检查\n\n**1**。C++ 派自什么种语言？\n\n**2**。驱动 C++ 创建的最主要因素是什么？\n\n**3**。C++ 是 Java 和\
  \ C# 的父类。正确还是错误？\n\n### 关键技能 1.3 面向对象编程\n\nC++ 的核心是面向对象编程（OOP）。正如刚才解释的，OOP 是创建 C++\
  \ 的动力。因此，在编写简单的 C++ 程序之前，理解 OOP 的基本原理是有用的。\n\n面向对象编程吸收了结构化编程的精良思想，并将其与几个新概念结合起来。结果是产生了一种不同且更好的组织程序的方式。从最广泛的意义上说，程序可以用两种方式之一组织：围绕其\
  \ `code`（发生了什么）或围绕其 `data`（谁受了影响）。仅使用结构化编程技术，程序通常围绕代码组织。这种方法可以认为是“代码作用于数据”。\n\n\
  面向对象程序的工作方式相反。它们围绕数据组织，核心原则是“数据控制对代码的访问”。在面向对象的语言中，你定义数据以及允许操作这些数据的例程。\n\n为了支持面向对象编程的原则，所有\
  \ OOP 语言（包括 C++）都有三个共同特征：封装、多态和继承。让我们检查每一项。\n\n### 封装\n\n`封装`是一种将代码与其操作的数据结合的编程机制，并使其免受外部干扰和误用。在面向对象的语言中，代码和数据可以这样绑定，从而创建一个自包含的`黑盒`。内部包含了所有必要的数据和代码。当代码和数据链接时，创建了一个对象。\n\
  \n### 专家问答\n\n**Q：我听过将方法术应用于子程序。方法和函数一样吗？**\n\n**A：** 通常情况下答案是肯定的。“方法”一词是由 Java\
  \ 流行起来的。C++ 程序员称为函数，Java 程序员称为方法。C# 程序员也使用方法一词。由于它变得如此广泛使用，有时在提到 C++ 函数时也会使用方法。\n\
  \n在对象内部，代码或数据或两者都可以是该对象的 `private`（私有的）或 `public`（公有的）。私有的代码或数据只有对象的其他部分已知并可以访问。也就是说，外部程序无法访问这些代码或数据。当代码或数据是公共的，即使它们定义在对象内部，程序的其他部分也可以访问。通常，对象的公共部分用于为私有元素提供一个受控的接口。\n\
  \n### 多态\n\n\n\n\n# 多态（源自希腊语，意为“多种形式”）允许通过一个接口访问一组通用操作的特性。多态的一个简单例子可以在汽车的方向盘中找到。无论使用何种实际的转向机构，方向盘（接口）都是相同的。也就是说，无论你的汽车是采用手动转向、助力转向还是齿条齿根转向，方向盘的工作方式都是一样的。因此，无论使用何种类型的转向，向左转方向盘都会导致汽车向左行驶。这种统一接口的好处显然是，一旦你学会了如何操作方向盘，你就可以驾驶任何类型的汽车。\n\
  \n同样的原理也适用于编程。例如，考虑一个 `stack`（后进先出的列表）。你可能有一个需要三种不同类型栈的程序。一个栈用于整数值，一个用于浮点值，第三个用于字符。在这种情况下，尽管存储的数据不同，但实现每个栈的算法是相同的。在非面向对象的语言中，你将会被要求创建三组不同的栈例程，每组例程都使用不同的名称。然而，由于多态的存在，在\
  \ C++ 中你可以创建一个通用的栈例程组，适用于所有三种情况。这样，一旦你学会了如何使用一个栈，你就可以使用所有的栈。\n\n更广泛地说，多态的概念通常用“一个接口，多个方法”这一短语来表达。这意味着为一组相关活动设计一个通用接口是可能的。多态通过允许同一个接口指定`一组通用操作`来帮助降低复杂度。编译器的任务是根据每个情况选择相应的`特定操作`（即方法）。你作为程序员，不需要手动进行这种选择。你只需要记住并利用通用接口即可。\n\
  \n## 继承\n\n`继承` 是一个对象获取另一个对象属性的过程。这非常重要，因为它支持了层级分类的概念。如果你仔细想一下，大多数知识都是通过层级（即自上而下）的分类变得易于管理的。例如，红富士苹果属于\
  \ `apple`（苹果）分类，而 `apple` 又是 `fruit`（水果）类的一部分，后者属于更大的 `food`（食物）类。也就是说，`food` 类具有某些特性（可食用、有营养等），这些特性在逻辑上也适用于它的子类\
  \ `fruit`。除了这些特性之外，`fruit` 类还具有特定的特征（多汁、甜等），这些特征将其与其他食物区分来。`apple` 类定义了苹果特有的特性（生长在树上、非热带水果等）。一个红富士苹果反将继承之前所有类的所有特性，并仅定义那些使其独一无二的特性。如果不使用层级结构，每个对象都必须显式地定义它的所有特征。使用继承，对象只需要定义使其在类中具有独特性的特性。它可以从父类继承其通用属性。因此，正是继承机制使得一个对象成为更通用情况的特定实例。\n\
  \n## 进度检查\n\n![Image](img/00003.jpeg)\n\n1. **1**。写出面向对象编程（OOP）的原理。\n2. **2**。C++\
  \ 中封装的基本单元是什么？\n3. **3**。C++ 中子例程的常用术语是什么？\n\n## 专家问\n\n**Q: 你提到面向对象编程 (OOP) 是管理大型程序的有效方法。然而，OOP\
  \ 似乎会给较小的程序增加大量的开销。对于 C++ 来说，这是真的吗？**\n\n**A:** 不。理解 C++ 的一个关键点是，它`允许`你编写面向对象的程序，但`并不要求`你这样做。在很大程度上，C++\
  \ 的面向对象特性在运行时是透明的，因此对于大多数程序，不会产生任何（或很少）开销。\n\n## 关键技能 1.4 一个简单的程序\n\n现在是时候编程了。让我们从编译和运行这里的示例程序开始：\n\
  \n![Image](img/0004.gif)\n\n你将遵循以下三个步骤：\n\n**1.** 输入程序。\n**2.** 编译程序。\n**3.** 运行程序。\n\
  \n在开始之前，让我们回顾两个术语：源代码和目标代码。`源代码`是程序的人类可读的形式，存储在文本文件中。`目标代码`是编译器创建的的可执行形式。\n\n##\
  \ 输入程序\n\n书中的程序可以通过 Osborne 的网站 [www.osborne.com](http://www.osborne.com) 获取。然而，如果你想手动输入程序，你可以自由这样做。自己输入程序通常有助于你记住关键概念。如果你选择手动输入程序，必须使用文本编辑器，而不是字处理器。字处理器通常会随文本存储格式信息。这些格式信息会干扰\
  \ C++ 编译器。\n\n## 编译程序\n\n如何编译 `Sample.cpp` 取决于你使用的编译器以及选项。此外，许多编译器（如微软的 Visual C++\
  \ 和 Borland 的 C++ Builder）提供了两种编译方式：命令行编译器和集成开发环境 (IDE)。尽管如此，如果你使用 Visual C++ 或\
  \ C++ Builder，编译和运行书中的程序最简单的方法是使用命令行编译器。例如，使用 Visual C++ 编译 `Sample.cpp`，你将使用以下命令行：\n\
