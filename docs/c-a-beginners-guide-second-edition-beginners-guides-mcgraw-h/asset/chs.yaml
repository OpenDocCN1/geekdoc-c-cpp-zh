  \ 页面找到。\n\n# 第 5 ：函数简介\n\n### 关键技能\n\n- 5.1 了解函数的通用形式\n- 5.2 创建函数\n- 5.3 使用函数参数\n\
  - 5.4 函数返回值\n- 5.5 在表达式中使用函数\n- 5.6 了解局部作用域\n- 5.7 了解全局作用域\n- 5.8 向函数传递指针和数组\n-\
  \ 5.9 从函数返回指针\n- 5.10 向 `main()` 传递命令行参数\n- 5.11 了解函数原型\n- 5.12 创建递归函数\n\n本节开始深入讨论函数。函数是\
  \ C++ 的构建块，牢固理解它们是成为成功 C++ 程序员的基础。在这里，你将学习如何创建一个函数。你还将学习关于参数传递、返回值、局部和全局变量、函数原型以及递归。\n\
  \n## 函数基础\n\n*函数*（function）是一个包含一个或多个 C++ 语句并执行特定任务的子程序。你到为止编写的每个程序都使用了一个函数：`main()`。它们被称为\
  \ C++ 的构建块，因为程序是函数的集合。程序中所有的“动作”语句都位于函数内部。因此，函数包含了你通常认为是程序可执行部分的语句。\n\n虽然非常简单的程序（如书中所示的许多程序）只有一个\
  \ `main()` 函数，但大多数程序将包含几个函数。事实上，一个大型商业程序将定义成百个函数。\n\n### 关键技能 5.1 函数的通用形式\n\n所有\
  \ C++ 函数都共享一种通用形式，所示：\n\n![Image](img/00332.gif)\n\n在这里，*返回类型*（return-type）指定函数返回的数据类型。这可以是任何有效类型，数组除外。如果函数不返回结果，则其返回类型必须是\
  \ `void`。函数的名称由*名称*（name）指定。这可以是任何未被占用的合法标识符。*参数列表*（parameter-list）是由逗号分隔的类型和标识符对的序列。参数本质上是变量，在函数被调用时接收传递给参数的值。如果函数没有参数，则参数列表将为空。\n\
  \n大括号括住了函数体。函数体由定义函数作用的 C++ 语句组成。当遇到右大括号时，函数终止并返回调用代码。\n\n## 关键技能 5.2 创建函数\n\n创建一个函数非常简单。由于所有函数都共享相同的通用形式，它们在结构上与你一直使用的\
  \ `main()` 函数相似。让我们从一个包含两个函数的简单示例开始：`main()` 和 `myfunc()`。在运行此程序（或阅读随后的描述）之前，仔细检查它，并尝试确定它在屏幕上具体显示了什么。\n\
  \n![Image](img/00333.gif)\n\n程序的运行如下：首先，`main()` 开始并执行第一个 `cout` 语句。接下来，`main()`\
  \ 调用 `myfunc()`。注意这是如何实现的：函数名后面跟着括号。在这种情况下，函数调用必须以分号结束。最后，`myfunc()` 执行其 `cout`\
  \ 语句，并在遇到右大括号时返回 `main()`。\n\n```cpp\nvoid myfunc() {\n    cout << \"Hello, myfunc!\"\
  \ << endl;\n}\n\nint main() {\n    cout << \"Hello!\" << endl;\n    myfunc();\n\
  \    return 0;\n}\n```\n（注：上述代码根据逻辑重构。）\n\n## 关键技能 5.3 使用参数\n\n向你创建的函数传递一个或多个值。传递给函数的值被称为*参数*（argument）。因此，参数是向函数输入信息的方式。\n\
  \n当你创建一个接受一个或多个参数的函数时，必须也声明接收这些参数的变量。这些变量被称为函数的*参数*（parameters）。这里有一个示例定义了一个名为 `box()`\
  \ 的函数，它可以计算箱子的体积并显示结果。它有三个参数。\n\n![Image](img/00336.gif)\n\n通常情况下，每次调用 `box()`，它都会通过乘以传递给其参数的值来计算体积：`length`（长）、`width`（宽）和\
  \ `height`（高）。注意参数是如何声明的。每个参数的声明之间用逗号分隔，参数包含函数名后的括号内。这种基本方法适用于所有使用参数的函数。\n\n要调用\
  \ `box()`，你必须指定三个参数。例如：\n\n![Image](img/00337.gif)\n\n\n\n括号之间指定的值是传递给 `box()` 的参数，每个参数的值都会复制到对应的形参数中。因此，在第一次调用\
  \ `box()` 时，7 被复制到 `length`，20 被复制到 `width`，4 被复制到 `height`。在第二次调用中，50 被复制到 `length`，3\
  \ 被复制到 `width`，2 被复制到 `height`。在第三次调用中，8 被复制到 `length`，6 被复制到 `width`，9 被复制到 `height`。\n\
  \n下面的程序演示了 `box()`：\n\n![Image](img/00338.gif)\n\n程序的输出所示：\n\n![Image](img/00339.gif)\n\
  \n**提示** ![Image](img/00340.jpeg)\n\n记住，术语*参数*（argument）指的是调用函数时使用的值。接收参数之值的变量被称为*形参数*（parameter）。实际上，接收参数的函数被称为*参数化函数*（parameterized\
  \ functions）。\n\n#### ![Image](img/00003.jpeg) **进度检查**\n\n**1.** 当函数被调用时，程序的执行会发生什么？\n\
  \n**2.** 参数和形参数之间的区别是什么？\n\n**3.** 如果一个函数需要一个形参数，它在哪里声明的？\n\n### 关键技能 5.4 使用 return\n\
  \n在之前的示例中，函数在遇到闭右大括号时返回给它的调用者。虽然这对于许多函数来说是可以接受的，但并不适用于所有函数。通常，你希望精确地控制函数何时以及如何返回。为了做到这一点，你将使用\
  \ `return` 语句。\n\n`return` 语句有两种形式：一种是返回值的，另一种是不返回值的。我们将从从不返回值的 `return` 版本开始学习。如果一个函数的返回类型是\
  \ `void`（即该函数不返回任何值），那么它就可以使用这种形式的 `return`：\n\n```\nreturn;\n```\n\n当遇到 `return`\
  \ 时，执行将立即返回到调用者。函数中任何剩余代码都会被忽略。例如，考虑这个程序：\n\n![Image](img/00341.gif)\n\n程序的输出所示：\n\
  \n![Image](img/00342.gif)\n\n如输出所示，`f()` 一旦遇到 `return` 语句就会返回到 `main()`。第二个 `cout`\
  \ 语句从未被执行。\n\n这里有一个更实用的 `return` 示例。下一个程序中显示的 `power()` 函数显示一个整数的正整数幂幂的结果。如果指数为负数，`return`\
  \ 语句将导致函数在尝试计算结果之前终止。\n\n![Image](img/00343.gif)\n\n![Image](img/00344.gif)\n\n\
  程序的输出所示：\n\n![Image](img/00345.gif)\n\n当 `exp` 为负数时（如在第二次调用中所示），`power()` 会返回，跳过函数的其余部分。\n\
  \n一个函数可以包含多个 `return` 语句。一旦遇到其中一个，函数就会返回。例如，这段片段是完全有效的：\n\n![Image](img/00346.gif)\n\
  \n但请注意，过多的 `return` 可能会破坏函数的结构并混淆其含义。最好只在多个 `returns` 有助于明确函数含义时才使用它们。\n\n## 返回值\n\
  \n函数可以向其调用者返回一个值。因此，返回值是从函数中获取信息的方法。要返回一个，请使用 `return` 语句的第二种形式，如下所示：\n\n```\nreturn\
  \ value;\n```\n\n在这里，`value` 是被返回的值。这种形式的 `return` 语句只能用于不返回 `void` 的函数。\n\n返回值的值的函数必须指定该值的类型。返回类型必须与\
  \ `return` 语句中使用的数据类型兼容。如果不是，将导致编译时错误。函数可以声明为返回任何有效的 C++ 数据类型，但函数不能返回数组。\n\n为了说明函数返回值的过程，可以将\
  \ `box()` 函数重写如下所示。在这个版本中，`box()` 返回体积。注意，将函数放在赋值语句的右侧会将返回值赋值给一个变量。\n\n![Image](img/00347.gif)\n\
  \n![Image](img/00348.gif)\n\n输出如下：\n\n![Image](img/00349.gif)\n\n在这个示例中，`box()`\
  \ 使用 `return` 语句返回 `length * width * height` 的值。该值随后赋值给 `answer`。也就是说，`return` 语句返回的值变成了调用程序中\
  \ `box()` 的值。\n\n由于 `box()` 现在返回一个值，因此它前面没有 `void` 关键字。（记住，`void` 仅在函数*不*返回值时使用）。相反，`box()`\
  \ 被声明为返回 `int` 类型的值。\n\n`int` 不是函数可以返回的唯一数据类型。例如，下面的程序重构了 `box()`，使其接受 `double`\
  \ 参数并返回 `double`：\n\n![Image](img/00350.gif)\n\n另一点：如果非 `void` 函数因为遇到闭大括号而返回，则返回一个未定义的（即未知的）值。由于\
  \ C++ 的特性，非 `void` 函数并不需要执行显式的 `return` 语句。\n\n## 关键技能 5.5 在表达式中使用函数\n\n在之前的示例中，`box()`\
  \ 返回的值被赋值给变量，然后通过 `cout` 显示该变量的值。虽然没有错误，但这些程序可以通过直接在 `cout` 中返回值返回值变得更高效。例如，之前程序中的\
  \ `main()` 函数可以写成这样：\n\n![Image](img/00352.gif)\n\n当 `cout` 语句执行时，`box()` 会自动调用以获取其返回值。该值随后被输出。没有必要先将其赋值给某个变量。\n\
  \n通常，非 `void` 函数可以用于任何类型的表达式。当表达式被求值时，函数会被自动调用以获取其返回值。例如，下面的程序汇总了三个箱子的体积，然后显示平均体积：\n\
  \n![Image](img/00353.gif)\n\n该程序的输出所示：\n\n![Image](img/00354.gif)\n\n#### 进度检查\n\
  \n**1.** 写出 `return` 语句的两种形式。\n\n**2.** `void` 函数可以返回结果吗？\n\n**3.** 函数调用可以作为表达式的一部分吗？\n\
  \n#### 作用域\n\n到目前为止，我们一直在使用变量，但还没有正式讨论它们可以在哪里声明、它们存在多久，以及程序的哪些部分可以访问它们。这些属性由 C++\
  \ 定义的*作用域规则*（scope rules）决定。\n\n\n\n\n通常情况下，语言的作用域规则规定了对象的可见性和生命周期。尽管 `C++` 定义了一个细粒度的作用域系统，但基本有两种类型：`local`（局部）和\
  \ `global`（全局）。在这两个作用域中，你都可以声明变量。在本节中，你将看到局部作用域内声明的变量与全局作用域内声明的变量之处，以及它们各自与函数的关系。\n\
  \n## 关键技能 5.6 局部作用域\n\n局部作用域是由块创建的。（记住，块以左大括号 { 开始，以右大括号 } 结束。）因此，每当你开始一个新块时，你就创建一个新的作用域。可以在任何块中声明变量。在块内部声明的变量被称为`局部变量`。\n\
  \n局部变量只能由其声明所在块内部的语句使用。换句话说，局部变量在它们自己的代码块之外是不可知的。因此，定义在块外的语句无法访问块内部定义的对象。从本质上说，当你声明局部变量时，是在将该变量局部化，并保护它免受未经授权的访问和/或修改。事实上，作用域规则为封装提供了基础。\n\
  \n关于局部变量，最重要的的一点之一是：它们只在声明它们的代码块执行时存在。局部变量在块内遇到其声明语句时被创建，在离开块时被销毁。由于局部变量在退出块时会被销毁，它的值也会丢失。\n\
  \n声明变量最常见的代码块是函数。每个函数都定义了一个代码块，该块以函数的左大括号开始，以其右大括号结束。函数的代码和数据对该函数来说是私有的，除了通过调用该函数外，任何其他函数的任何语句都无法访问。（例如，无法使用\
  \ `goto` 语句跳转到另一个函数的中间。）函数体对程序的其余部分隐藏，它既不会影响程序的其他部分，也不会受影响。因此，一个函数的内容与另一个函数的内容是完全分离的。换句话说，在一个函数内定义的代码和数据无法与函数中定义的代码或数据交互，因为这两个函数具有不同的作用域。\n\
  \n由于每个函数都定义了自己的作用域，因此在一个函数中声明的变量对另一个函数中声明的变量没有影响——即使这些变量共享相同的名称。例如，考虑以下程序：\n\n![Image](img/00355.gif)\n\
  \n这是输出结果：\n\n![Image](img/00356.gif)\n\n一个名为 `val` 的整数被声明了两次，一次在 `main()` 中，一次在\
  \ `fl()` 中。`main()` 中的 `val` 与 `fl()` 中的 `val` 没有联系或影响。原因是每个 `val` 仅对声明它的函数可见。如输出所示，尽管在\
  \ `fl()` 中声明的 `val` 被设置为 88，但 `main()` 中 `val` 的内容仍然是 10。\n\n由于局部变量随着进入和退出其所在的块而创建和销毁，因此局部变量在块的每次激活之间不会保留其值。在函数调用方面，这一点尤为重要。当函数被调用时，它的局部变量被创建。在返回时，它们被销毁。这意味着局部变量无法在调用之间保留它们的值。\n\
  \n如果局部变量声明包含初始化器，则该变量在每次进入块时都会初始化。例如：\n\n![Image](img/00357.gif)\n\n这里显示的输出确认了 `num`\
  \ 在每次调用 `f()` 时都会初始化：\n\n![Image](img/00358.gif)\n\n未初始化的局部变量在赋值之前将具有未知值。\n\n####\
  \ 局部变量可以在任何块中声明\n\n一种常见的做法是在函数代码块的开头声明该函数所需的所有变量。这样做主要是为了让任何阅读代码的人都能轻松确定使用了哪些变量。然而，函数块的开头并不是声明局部变量的唯一地方。局部变量可以在任何代码块的任何地方声明。在块内声明的变量对于该块是局部的。这意味着该变量在进入块之前不存在，并在退出块时被销毁。此外，该块之外的任何代码（包括函数中的其他代码）无法访问该变量。为了理解这一点，请尝试以下程序：\n\
  \n![Image](img/00359.gif)\n\n变量 `x` 在 `main()` 作用域的开始处声明，并且 `main()` 内部的所有后续代码都可以访问。在\
  \ `if` 块内部声明了 `y`。由于块定义了作用域，因此 `y` 仅对其块内部的其他代码可见。这就是为什么在它的块之外，这一行\n\n![Image](img/00360.gif)\n\
  \n被注释掉了。如果你移除开头的注释符号，将会发生编译时错误，因为 `y` 在其块之外是不可见的。在 `if` 块内部，可以使用 `x`，因为块内的代码可以访问由嵌套块声明的变量。\n\
  \n虽然局部变量通常在块的开头声明，但并非必须如此。只要在使用之前声明，就可以在块内的任何地方声明局部变量。例如，这是一个完全有效的程序：\n\n![Image](img/00361.gif)\n\
  \n在这个示例中，`a` 和 `b` 直到需要它们之前才被声明。坦率地说，大多数程序员会在使用它们的函数开头声明局部变量。\n\n#### 命名隐藏\n\n当内部块中声明的局部变量与外部块中声明的变量具有相同名称时，内部块声明的变量会*隐藏*外部块的变量。例如：\n\
  \n![Image](img/00362.gif)\n\n该程序的输出所示：\n\n![Image](img/00363.gif)\n\n`if` 块内部声明的\
  \ `i` 隐藏了外部的 `i`。在内部 `i` 上发生的更改对外部 `i` 没有影响。此外，在 `if` 块之外，内部 `i` 是未知的，外部 `i` 重新可见。\n\
  \n#### 函数参数\n\n函数的参数位于函数的作用域内。因此，它们对于函数是局部的。除了接收参数的值，参数的行为与其他任何局部变量一样。\n\n### 专家问\n\
  \n**问：`auto` 关键字的作用是什么？我听过它用于声明局部变量。对吗？**\n\n**答：C++ 语言包含 `auto` 关键字，可以用于声明局部变量。然而，由于所有局部变量默认被假设为\
  \ `auto`，因此几乎从不使用。所以，你不会在本书的任何示例中看到它。但是，如果你选择使用它，请将其放在变量类型之前，如下：**\n\n![Image](img/00364.gif)\n\
  \n再次，`auto` 是可选的，在本书的其他地方都没有被使用。\n\n## 关键技能 5.7 全局作用域\n\n由于局部变量仅在声明它们的函数内部可见，可能会产生一个问题：如何创建一个可以被多个函数共享的变量？答案是在全局作用域中声明变量。*全局作用域*是所有函数之外的声明区域。在全局作用域中声明变量会创建一个`全局变量`。\n\
  \n\n\n\n\n全局变量\n\n全局变量在整个程序中都是已知的。它们可以被任何代码段使用，并在程序的整个执行过程中保持其值。因此，它们的作用范围延伸到整个程序。你通过在任何任何之外之外声明它们来创建全局变量。由于它们是全局的，因此任何表达式都可以访问它们，而不论该表达式位于哪个函数中。\n\
  \n下面的程序演示了全局变量的使用。变量 `count` 已经在所有函数之外声明。它的声明位于 `main()` 函数之前。然而，它可以被放置在任何地方，只要不在函数内部即可。但请记住，由于你必须在使用变量之前对其进行声明，因此最好将全局变量声明在程序的顶部。\n\
  \n![Image](img/00365.gif)\n![Image](img/00366.gif)\n\n程序的输出在此所示：\n\n![Image](img/00367.gif)\n\
  \n仔细观察这个程序，可以很清楚 `main()` 和 `func1()` 都使用了全局变量 `count`。然而，在 `func2()` 中，声明了一个名为\
  \ `count` 的局部变量。当 `func2()` 使用 `count` 时，它指的是它的局部变量，而不是全局变量。重要一点，如果全局变量和局部变量具有相同的名称，那么在声明局部变量的函数内部对该变量名的所有引用都指向局部变量，并且对全局变量没有影响。因此，局部变量会隐藏同名的全局变量。\n\
  \n全局变量在程序启动时初始化。如果全局变量声明包含一个初始化器，则该变量被初始化为该值。如果全局变量不包含初始化器，则其值被设置为零。\n\n全局变量的存储位于你的程序为此目的预留的内存的固定区域中。当程序中的多个函数使用相同的数据时，或者当变量必须在整个程序运行期间保持其值时，全局变量是非常有用的。然而，你应该避免使用不必要的全局变量，原因有三点：\n\
  \n![Image](img/00157.jpeg) 它们在程序执行期间一直占用内存，而不仅仅是在需要它们的时候。\n\n![Image](img/00157.jpeg)\
  \ 在可以使用局部变量的地方使用全局变量会使函数的通用性降低，因为它依赖于某个必须在函数自身外部定义的实体。\n\n![Image](img/00157.jpeg)\
  \ 使用大量的全局变量会导致程序错误，因为存在未知且非希望的副作用。开发大型程序的一个主要问题是由于变量在程序其他地方被使用而意外修改了变量的值。在 C++ 中，如果你在程序中使用过全局变量，就会发生这种情况。\n\
  \n#### 进度检查\n\n![Image](img/00003.jpeg)\n\n**1.** 局部变量和全局变量之间的主要区别是什么？\n\n**2**.\
  \ 局部变量可以在块内的任何地方声明吗？\n\n**3**. 局部变量在声明它的函数的多次调用之间会保持其值吗？\n\n### 关键技能 5.8 向函数传递指针和数组\n\
  \n此前的示例使用了简单值（如 `int` 或 `double`）作为参数。然而，有时你可能想要使用指针和数组作为参数。虽然传递这些类型的参数是直接的，但某些特殊问题需要处理。\n\
  \n## 传递指针\n\n要将指针作为参数传递，必须将参数声明为指针类型。这里有一个例子：\n\n![Image](img/00368.gif)\n\n仔细研究这个程序。如你所示，`f()`\
  \ 接收一个参数：一个 `int` 指针。在 `main()` 中，`p`（一个 `int` 指针）被赋值为 `i` 的地址。接下来，将 `p` 作为参数调用\
  \ `f()`。当指针参数 `j` 接收到 `p` 时，它也指向 `main()` 中的 `i`。因此，赋值操作\n\n```\n![Image](img/00369.gif)\n\
  ```\n导致 `i` 被赋予值 100。对于一般情况，`f()` 将它调用的任何地址赋值 100。\n\n在先前的示例中，实际上没有必要使用指针变量 `p`。相反，在调用\
  \ `f()` 时，只需在 `i` 前加一个 `&` 即可。这会将 `i` 的地址传递给 `f()`。修改后的程序所示：\n\n```\n![Image](img/00370.gif)\n\
  ```\n理解关于向函数传递指针的一点至关重要：当你在函数内部执行使用指针的操作时，你是在操作该指针所指向的变量。因此，函数将能够更改参数所指向的对象的值。\n\
  \n## 传递数组\n\n当数组作为函数的参数时，传递的是数组第一个元素的地址，而不是整个数组的拷贝。（回想，没有任何索引的数组名是数组中第一个元素的指针。）这意味着参数声明必须是兼容的类型。声明接收数组的参数有三种。\n\
  \n首先，可以将其声明为数组，如下所示：\n\n```\n![Image](img/00371.gif)\n```\n尽管 `num` 被声明为十个元素的数组，C++\
  \ 编译器会自动将其转换为 `int` 指针。声明数组的另一种方法是指定为无尺寸数组，如下：\n\n```\n![Image](img/00372.gif)\n\
  ```\n由于 C++ 不提供数组检查，实际的尺寸与参数无关（但与程序有关）。声明 `num` 的最后方式是作为指针。这是专业编写的 C++ 程序中最常用的方法。这里有一个例子：\n\
  \n```\n![Image](img/00373.gif)\n```\n之所以可以将 `num` 声明为指针，是因为任何指针都可以使用 `[]` 进行索引，就像它是数组一样。意识到这三种声明数组的方法产生相同的结果：指针。\n\
  \n记住，当数组作为函数参数使用时，它的地址被传递给函数。这意味着函数内部的代码将操作并可能更改调用它的数组实际内容。例如，在下面的程序中检查 `cube()`\
  \ 函数，它将数组中的每个元素的值转换为立方。调用 `cube()` 时，将数组地址作为第一个参数，将数组的大小作为第二个参数。\n\n```\n![Image](img/00374.gif)\n\
  ![Image](img/00375.gif)\n```\n\n这是该程序的输出：\n\n```\n![Image](img/00376.gif)\n```\n\
  如所示，在调用 `cube()` 之后，`main()` 中数组 `nums` 内容将变为原始值的立方。也就是说，`nums`元素的值已经被 `cube()`\
  \ 内部语句修改了，因为 `n` 指向 `nums`。\n\n## 传递字符串\n\n由于字符串仅仅是以空字符结尾的字符数组，当你将字符串传递给函数时，实际传递的是字符串开头的指针。这是一个\
  \ `char*` 类型的指针。例如，考虑下面的程序。它定义了函数 `strInvertCase()`，该函数会反转字符串内字母的大小。\n\n```\n![Image](img/00377.gif)\n\
  ![Image](img/00378.gif)\n```\n\n\n\n\n这是输出结果：\n\n![Image](img/0037.gif)\n\n####\
  \ ![Image](img/00003.jpeg) 进度检查\n\n**1**. 显示如何声明一个名为 `count` 的 `void` 函数，该函数有一个名为\
  \ `ptr` 的 `long int` 指针参数。\n\n**2**. 当指针被传递给函数时，函数可以修改该指针所指向对象的内容吗？\n\n**3**. 数组可以被传递给函数吗？请解释。\n\
  \n### 关键技能 5.9 返回指针\n\n函数可以返回指针。指针的返回方式与其他任何数据类型相同，没有特殊问题。然而，由于指针是 C++ 中最令人困惑的特征之一，因此对指针返回类型进行简短讨论是必要的。\n\
  \n要返回指针，函数必须将其返回类型声明为指针。例如，这里 `f( )` 的返回类型被声明为 `int` 指针：\n\n![Image](img/00380.gif)\n\
  \n如果函数的返回类型是指针，那么其 `return` 语句中使用的值也必须是指针。（与所有函数一样，返回值必须与返回类型兼容。）\n\n以下程序演示了指针返回类型的使用。函数\
  \ `get_substr(()` 在字符串中搜索子字符串。它返回指向第一个匹配子字符串的指针。如果没有找到匹配项，则返回一个空指针。例如，如果字符串是“I like\
  \ C++”且搜索字符串是“like”，则该函数返回指向“like”中 `l` 的指针。\n\n![Image](img/00381.gif)\n\n![Image](img/00382.gif)\n\
  \n以下是程序产生的输出：\n\n![Image](img/00383.gif)\n\n#### main( ) 函数\n\n如你所知，`main( )` 函数是特殊的，因为它是程序执行时被调用的第一个函数。它标志着程序的开始。与某些总是从程序“顶部”开始执行的编程语言不同，C++\
  \ 每一个程序都从调用 `main( )` 函数开始，无论该函数位于程序的哪个位置。（不过，让 `main( )` 成为程序中的第一个函数是常见的，这样可以易于找到。）\n\
  \n一个程序中只能有一个 `main( )`。如果你尝试包含多个 `main( )`，你的程序将不知道从哪里开始执行。实际上，大多数编译器会捕获此类错误并报告它。如之前提到的，由于\
  \ `main( )` 由 C++ 预定义，因此它不需要原型。\n\n### 关键技能 5.10 向 main( ) 传递命令行参数\n\n有时，你可能想在运行程序时向其传递信息。这通常通过向\
  \ `main( )` 传递*命令行参数*来实现。命令行参数是操作系统命令行中紧跟在程序名后的信息。（在 Windows 中，“运行”命令也使用命令行。）例如，你可能通过输入类似的内容从命令行编译\
  \ C++ 程序：\n\n`cl *prog-name*`\n\n其中 `prog-name` 是你想要编译的程序名称。程序名称将作为命令行参数传递给 C++\
  \ 编译器。\n\nC++ 为 `main( )` 定义了两个内置但可选的参数。它们是 `argc` 和 `argv`，用于接收命令行参数。这些是 C++ 为\
  \ `main( )` 定义的唯一参数。然而，特定的特定的环境中可能支持其他参数，因此你可能需要检查编译器的文档。让我们更仔细地查看 `argc` 和 `argv`。\n\
  \n**注意**![Image](img/00070.gif)\n\n从技术上讲，命令行参数的名称是任意的——你可以使用任何喜欢的名称。然而，多年年来按照惯例一直使用\
  \ `argc` 和 `argv`，最好使用这些名称，这样任何阅读你程序的人都能快速识别出它们是命令行参数。\n\n`argc` 参数是一个整数，保存了命令行上的参数数量。它始终至少为\
  \ 1，因为程序名本身算作第一个参数。\n\n`argv` 参数是一个指向字符指针数组的指针。`argv` 数组中的每个指针指向一个包含命令行参数的字符串。`argv[0]`\
  \ 指向程序名；`argv[1]`指向第一个参数，`argv[2]`指向第二个参数，依此类推。所有命令行参数都作为字符串传递给程序，因此数字参数必须由你的程序转换为适当的内部格式。\n\
  \n正确声明 `argv` 是重要的。最常见的方法是\n\n![Image](img/00384.gif)\n\n你可以通过索引 `argv` 来访问各个参数。以下程序演示了如何访问命令行参数。它显示了执行时存在的所有命令行参数。\n\
  \n![Image](img/00385.gif)\n\n例如，如果程序被名为 ComLine，那么这样执行它：\n\n![Image](img/00386.gif)\n\
  \n会导致以下输出：\n\n![Image](img/00387.gif)\n\n要加两个数字，使用这种类型的命令行（假设程序名为 *add*）：\n\n![Image](img/00389.gif)\n\
  \n#### 传递数字命令行参数\n\n当你将数字作为命令行参数传递给程序时，这些数据将以字符串形式接收。你的程序需要使用 C++ 支持的库函数将其转换为二进制格式。这里显示了三个最常用的函数：\n\
  \n![Image](img/00391.gif)\n\n每个函数接收一个包含数值的字符串。它们都使用了 `<cstdlib>`。\n\n以下程序演示了如何将命令行参数转换为二进制表示。它计算命令行中跟在程序名后的两个数字之和。该程序使用\
  \ `atof(()` 函数将其数字参数转换为内部表示。\n\n![Image](img/00392.gif)\n\n![Image](img/00393.gif)\n\
  \n#### ![Image](img/00003.jpeg) 进度检查\n\n**[1]** `main( )` 的两个参数通常称为什么？解释它们包含什么。\n\
  \n**[2]** 第一个命令行参数总是什么？\n\n**[3]** 数字命令行参数以字符串传递。对还是错？\n\n## 关键技能 5.11 函数原型\n\n\
  在本模块开始时简要讨论过函数原型。现在是详细解释它们的时候。在 C++ 中，所有函数在使用之前都必须声明。通常通过使用函数原型来实现。原型指定了关于函数的三个方面：\n\
  \n\n\n\n\n![Image](img/00157.jpeg) 它的返回类型\n\n![Image](img/00157.jpeg) 它参数的类型\n\n\
  ![Image](img/00157.jpeg) 它参数的数量\n\n原型允许编译器执行三个重要的操作：\n\n![Image](img/00157.jpeg)\
  \ 它们告诉编译器在函数被调用时生成什么类型的代码。不同的返回类型必须由编译器进行不同的处理。\n\n![Image](img/00157.jpeg) 它们允许\
  \ C++ 发现并报告调用函数时使用的参数类型与参数类型定义之间任何非法类型转换。\n\n![Image](img/00157.jpeg) 它们允许编译器检测调用函数时使用的参数数量与函数参数数量之间的差异。\n\
  \n函数原型的一般形式所示。它与函数定义相同，只是没有函数体。\n\n`type func-name(type parm_name1, typeparm_name2,…\
  \ typeparm_nameN);`\n\n在原型中使用参数名是可选的。然而，使用它们可以让编译器在发生错误时通过名称识别任何类型不匹配，因此包含它们是一个好主意。\n\
  \n为了更好地理解函数原型的用处，请考虑以下程序。如果你尝试编译它，将发出一条错误信息，因为程序尝试用整数参数调用 `sqr_it()`，而不是它所需的整数指针。（没有从整数到指针的自动转换。）\n\
  \n![Image](img/00395.gif)\n\n如果函数定义出现在程序中第一次使用它之前，那么函数定义也可以作为它的原型。例如，这是一个有效程序：\n\
  \n![Image](img/00396.gif)\n\n在这里，函数 `isEven()` 在 `main()` 中使用之前就已经定义了。因此，它的定义也可以作为它的原型，不需要单独的原型。\n\
  \n通常情况下，为程序使用的每个函数简单地声明一个原型，比尝试确保每个函数在在使用之前都定义更容易且更好。这对于大型程序尤为如此，在大型程序中很难跟踪哪些函数使用了哪些其他函数。此外，可能存在相互调用的函数。在这种情况下，必须使用原型。\n\
  \n## 头文件包含原型\n\n在本书前面的部分，你已经接触了标准的 C++ 头文件。你已经了解到这些头文件包含了程序所需的信息。虽然这个部分解释是正确的，但它并没有说明全部。C++\
  \ 的头文件包含了标准库中函数的原型。（它们还包含了这些函数使用的各种值和定义。）就像你写的函数一样，标准库函数在使用之前也必须声明原型。因此，任何使用库函数的程序都必须包含该函数原型的头文件。\n\
  \n要确定库函数需要哪个头文件，请查看你编译器的库文档。除了每个函数的描述外，你还会找到使用该函数必须包含的头文件名称。\n\n### 进度检查\n\n![Image](img/00003.jpeg)\n\
