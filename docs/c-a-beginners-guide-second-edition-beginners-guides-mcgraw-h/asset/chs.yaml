  \n### for 循环的变体\n\n`for` 是 C++ 语言中最多功能的语句之一，因为它允许广泛的变体。例如，可以使用多个循环控制变量。考虑以下代码片段：\n\
  \n```\n![Image](img/00179.gif)\n```\n\n在这里，逗号分隔两个初始化语句和两个递增表达式。为了让编译器理解这里有两个初始化和两个递增语句，这是必要的。在\
  \ C++ 中，逗号是一种运算符，本质上意味着“做这个并做那个”。它最常用的用法是 `for` 循环。\n\n\n\n\n\n**A:** 是的！除了 `sqrt()`\
  \ 之外，C++ 还支持大量的数学库函数。例如，`sin()`、`cos()`、`tan()`、`log()`、`pow()`、`ceil()` 和 `floor()`\
  \ 只是其中几个。如果你对数学编程感兴趣，你将想要探索 C++ 的数学函数。所有的 C++ 编译器都支持这些函数，它们的描述可以在你编译器的文档中找到。它们都要求包含头文件\
  \ `<cmath>`。\n\n控制循环的条件可以是任何有效的 C++ 表达式。它不需要涉及循环控制变量。在下一个示例中，循环将继续执行，直到 `rand()`\
  \ 函数产生大于 20,000 的值。\n\n![Image](img/00180.gif)\n\n以下是示例运行：\n\n![Image](img/00181.gif)\n\
  \n每次循环时，都会通过调用 `rand()` 获取一个新的随机数。当生成大于 20,000 的值时，循环条件变为假，从而终止循环。\n\n## 缺失的部分\n\
  \nC++ 中 `for` 循环与许多计算机语言不同的另一个方面是，循环定义的某些部分并不存在。例如，如果你想写一个运行到键盘输入数字 123 为止的循环，它看起来像这样：\n\
  \n![Image](img/00182.gif)\n\n在这里，`for` 定义中的增量部分是空的。这意味着每次循环重复时，系统都会测试 `x` 是否等于 123，但不会发生任何进一步的操作。然而，如果你在键盘上输入了\
  \ 123，循环条件就会变为假，循环退出。如果循环中没有增量部分，`for` 循环将不会修改控制变量。\n\n`for` 的另一种变体是将初始化部分移动到循环之外，如下片段所示：\n\
  \n![Image](img/00183.gif)\n\n在这里，初始化部分被留空了，`x` 在进入循环之前被初始化。将初始化置于循环之外通常只在初始值是通过一个复杂的过程得出的，且该过程不便于包含在\
  \ `for` 语句内部时使用。注意，在这个示例中，`for` 的增量部分位于循环体内部。\n\n## 无限 for 循环\n\n你可以使用此 `for` 结构创建一个无限循环（永远不会终止的循环）：\n\
