  \n在 C++ 中，注释有两种。你刚刚看到的那种被称为*多行注释*（multiline comment）。这种类型的注释以 `/*`（斜杠后跟一个星号）开始。只有当遇到\
  \ `*/` 时才结束。这两个注释符号之间的任何内容都会被编译器完全忽略。多行注释可以是单行或多行。第二种注释（单行注释）出现在程序稍后的位置，很快就会进行讨论。\n\
