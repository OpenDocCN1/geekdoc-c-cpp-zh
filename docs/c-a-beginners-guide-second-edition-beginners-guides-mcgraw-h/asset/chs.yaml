  \n程序的输出显示在此：\n\n![Image](img/00470.gif)\n\n## 关键技能 6.8 默认函数参数\n\n下一个讨论的与函数相关的特性是*默认参数*。在\
  \ C++ 中，你可以为参数指定一个默认值，当在调用函数时没有指定与该参数对应的参数时，会自动使用该值。默认参数可以用于简化复杂函数的调用。此外，它们有时可以用作函数重载的“简写”形式。\n\
  \n默认参数的指定方式在语法上与变量初始化相似。考虑以下示例，它声明 `myfunc()` 接收两个 `int` 参数。第一个默认值为 0，第二个默认值为 100。\n\
  \n![Image](img/00471.gif)\n\n现在，可以通过此处所示的三方法之一调用 `myfunc()`：\n\n![Image](img/00472.gif)\n\
  \n第一次调用将值 1 传递给 `x`，将 2 传递给 `y`。第二次给 `x` 赋值 10 并允许 `y` 使用默认值 100。最后，第三次调用导致 `x`\
  \ 和 `y` 都使用默认值。以下程序演示了这个过程：\n\n![Image](img/00473.gif)\n\n此处显示的输出确认了默认参数的使用：\n\n\
  ![Image](img/00474.gif)\n\n在创建带有默认参数值的函数时，默认值只能指定一次，且必须在文件中第一次声明函数时进行。在前面的示例中，默认参数是在\
  \ `myfunc()` 的原型中指定的。如果你尝试在 `myfunc()` 的定义中指定新的（甚至是相同的）默认值，编译器将显示错误信息且不会编译你的程序。\n\
  \n尽管在程序中不能重新定义默认参数，但你可以为重载函数的每个版本指定不同的默认参数；也就是说，重载函数的不同版本可以有不同的默认参数。\n\n重要的一是，所有带有默认值的参数必须出现在不带默认值的参数的右侧。例如，以下原型是无效的：\n\
  \n![Image](img/00475.gif)\n\n一旦开始定义带有默认值的参数，你就不能再指定非默认参数。也就是说，如下的声明也是错误的且无法编译：\n\
  \n![Image](img/00476.gif)\n\n由于 `i` 已经被赋予了默认值，`j` 也必须被赋予一个。\n\nC++ 包含默认参数的原因之一是它们让程序员能够管理更大的复杂性。为了处理各种情况，函数包含的参数通常比其最常用用法所需的参数多。因此，当适用默认参数时，你需要记住并指定它们。\n\
  \n#### 默认参数与重载\n\n默认参数的一种应用是作为函数重载的简写形式。为了理解为什么如此，想象你想创建两个版本的标准 `strcat()` 函数。一个版本的作用类似于\
  \ `strcat()`，将一个字符串的内容连接到另一个字符串的末尾。另一个版本将接受第三个参数，指定要连接的字符数量。假设你将你的自定义函数命名为 `mystrcat()`，它们的原型如下：\n\
  \n![Image](img/00477.gif)\n\n第一个版本将 `s2` 的 `len` 个字符复制到 `s1` 的末尾。第二个版本将由 `s2` 指向的整个字符串复制到\
  \ `s1` 的末尾，并表现类似于 `strcat()`。虽然实现两个版本的 `mystrcat()` 来创建你需要的版本并不是错，但有一种更简单的方法。使用默认参数，你只需要创建一个版本的\
  \ `mystrcat()` 即可完成这两种操作。以下程序演示了这一点：\n\n![Image](img/00478.gif)\n\n![Image](img/00479.gif)\n\
  \n程序的输出显示在此：\n\n![Image](img/00480.gif)\n\n如程序所示，`mystrcat()` 将 `s2` 指向的字符串中的最多\
  \ `len` 个字符连接到 `s1` 指向的字符串的末尾。然而，如果 `len` 为 0（当它允许使用默认值时如此），`mystrcat()` 将将 `s2`\
  \ 指向的整个字符串连接到 `s1`。\n\n\n\n\n虽然默认参数在正确使用时是一个强大的工具，但它们也可能被误用。默认参数的目的是允许函数以一种高效、易用的方式执行任务，同时保持相当大的灵活性。为了实现这一目标，所有默认参数都应该反映函数的一般使用方式，或者一种合理的替代用法。当一个参数没有通常与之关联的单一值时，就没有理由声明默认参数。事实上，在没有足够依据的情况下声明默认参数会破坏你代码的结构，因为它们可能会误导并困扰任何阅读你程序的人。最后，默认参数不应该造成任何伤害。也就是说，意外使用默认参数不应该导致不可逆转的负面后果。例如，忘记指定参数不应导致重要数据文件被删除！\n\
