  ## 附录 B 使用旧版 C++ 编译器\n### 两个简单的更改\n\n\n\n\n本书的目的是教你 C++ 编程的基础知识。它采用循序渐进的方法，并包含了大量的示例、自测和项目。它假设你之前没有编程经验。本书从基础知识开始，例如如何编译和运行一个\
  \ C++ 程序。然后，它将讨论组成 C++ 语言的关键字、特性和结构。当你读完这本书时，你将牢牢掌握 C++ 编程的核心要素。\n\n在开头说明这一点非常重要：本书只是一个起点。C++\
  \ 是一门庞大且复杂的语言，成功的 C++ 编程不仅涉及定义语言的关键字、运算符和语法，它还涉及使用大量的类库和函数库，这些库有助于程序的开发。虽然书中讨论了若干几个库元素，但由于篇幅限制，大多数元素并未被涵盖。要成为一名顶尖的\
  \ C++ 程序员，意味着还要精通 C++ 库。在完成本书后，你将拥有探索这些库以及 C++ 所有其他层面的知识。\n\n## 本书的结构\n\n本书提供了一个节奏均匀的教程，每个章节都建立在上一节的基础上。它包含\
  \ 12 个模块，每个模块讨论 C++ 的一个方面。这本书的独特之处在于，它包含了几个特殊元素，用来强化你所学的内容。\n\n### 关键技能\n\n每个模块的开头都是一组关键技能，告诉你将学到什么。每个技能的位置会在模块内部标出。\n\
  \n### 掌握检查\n\n每个模块都以一个“掌握检查”结束，这是一项让你测试知识水平的自测。答案可以在本书的网页页面 [www.osborne.com](http://www.osborne.com)\
  \ 上找到。\n\n### 进度检查\n\n在每个主要章节的末尾，都有一个“进度检查”，用于测试你对所介绍要点的理解情况。这些问题的答案位于页底部。\n\n###\
  \ 提问专家\n\n书中穿插了特殊的“提问专家”框。这些框包含了关于某个主题的额外信息或有趣的评论。它们采用问答格式呈现。\n\n### 项目\n\n每个模块都包含一个或多个项目，向你展示如何应用所学的内容。这些是真实的示例，你可以将其作为编写自己程序的起点。\n\
  \n## 无需先前的编程经验\n\n本书假设你之前没有编程经验。因此，如果你以前从未编写过程序，可以使用这本书。当然，在当今，大多数读者至少会有一点先前的编程经验。对许多人来说，这种之前的经验可能是\
  \ Java 或 C#。正如你将学到的，C++ 是这两种语言的父语言。因此，如果你已经认识 Java 或 C#，你就能轻松学习 C++。\n\n### 需要的软件\n\
  \n要编译并运行书中的程序，你需要一个现代 C++ 编译器，例如最新版本的微软 Visual C++ 或 Borland 的 C++ Builder。\n\n\
  ### 不要忘记：网络上的代码\n\n记住，书中所有示例和项目的源代码可以在网络上的 [www.osborne.com](http://www.osborne.com)\
  \ 免费获取。\n\n## 进一步学习\n\n*C++: 入门指南*是你进入 Herb Schildt 系列编程书籍的大门。以下是其他你可能感兴趣的书。\n\n\
  想了解更多关于 C++ 的知识，可以尝试：\n\n- *C++：完全参考*\n- *从零开始 C++*\n- *自学 C++*\n- *从零开始学习 STL 编程*\n\
  - *C++ 程序员参考*\n\n想学习 Java 编程，我们推荐以下：\n\n- *Java 2: 入门指南*\n- *Java 2：完全参考*\n- *Java\
