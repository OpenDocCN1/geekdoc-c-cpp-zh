  \n\n\n\n你想要监控异常的代码必须是在 `try` 块内部执行的。（在 `try` 块内部调用的函数也会被监控。）监控代码可能抛出的异常将由紧跟在抛出异常的\
  \ `try` 语句之后的 `catch` 语句捕获。`try` 和 `catch` 的通用形式所示：\n\n![Image](img/00853.gif)\n\
  \n`try` 块必须包含你想要监控错误的程序部分。这部分可以短到只有一个函数中的几条语句，也可以长到像一个包围了 `main()` 函数代码的 `try` 块那样全面（这在实际上会导致整个程序都被监控）。\n\
  \n当异常被抛出时，它会被相应的 `catch` 语句捕获，然后由该语句处理异常。一个 `try` 语句可以关联多个 `catch` 语句。异常的类型决定了使用哪一个\
  \ `catch` 语句。也就是说，如果 `catch` 语句指定的数据类型与异常的类型匹配，则执行该 `catch` 语句（并跳过所有其他）。当异常被捕获时，`arg`\
  \ 将接收其值。可以捕获任何类型的数据，包括你创建的类。\n\n`throw` 语句的通用形式所示：\n\n```\nthrow exception;\n```\n\
  \n`throw` 生成由 `exception` 指定异常。如果该异常需要被捕获，那么 `throw` 必须在 `try` 块内部执行，或者从 `try` 块内部调用的任何函数（直接或间接）中执行。\n\
  \n如果抛出的异常没有适用的 `catch` 语句，将发生程序异常终止。也就是说，你的程序将以一种不可控的方式突然停止。因此，你希望捕获所有可能抛出的异常。\n\
  \n这是一个简单的示例，展示了 C++ 异常处理的操作原理：\n\n![Image](img/00854.gif)\n\n该程序显示以下输出：\n\n![Image](img/00855.gif)\n\
  \n仔细观察这个程序。如你所见，有一个 `try` 块包含三条语句，以及一个处理整数异常的 `catch(int i)` 语句。在 `try` 块内部，三条语句中只有两个会执行：第一个\
  \ `cout` 语句和 `throw`。一旦抛出异常，控制权就会传递给 `catch` 表达式，并且 `try` 块终止。也就是说，`catch` 没有被调用，而是程序执行被转移到了它那里（根据需要，程序的栈会自动重置以实现这一点）。因此，`throw`\
  \ 之后的 `cout` 语句将永远不会执行。\n\n通常，`catch` 语句内的代码尝试通过采取适当措施来补救错误。如果错误可以修复，执行将继续执行 `catch`\
  \ 之后的语句。否则，程序执行应以受控的方式终止。\n\n如前所述，异常的类型必须与 `catch` 语句中指定的类型匹配。例如，在前面的程序中，如果你将 `catch`\
  \ 语句中的类型更改为 `double`，则异常将不会被捕获并发生异常终止。此更改所示：\n\n![Image](img/00856.gif)\n\n该程序产生以下输出，因为整数异常不会被\
  \ `catch(double i)` 语句捕获。当然，指示异常终止的最终消息会因编译器不同而异。\n\n![Image](img/00857.gif)\n\n\
