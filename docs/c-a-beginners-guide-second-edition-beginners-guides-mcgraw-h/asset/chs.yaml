  \ `a` 和 `b` 的 `int` 参数，并为它们各提供一个默认值 0。\n\n**2**. 可以在函数的原型和定义中同时声明默认参数吗？\n\n**3**.\
  \ 这个声明是否正确？如果不正确，原因是什么？\n\n![Image](img/00481.gif)\n\n## 关键技能 6.9 函数重载与歧义\n\n在结束本模块之前，有必要讨论一种\
  \ C++ 特有的错误类型：*歧义*（ambiguity）。可能会创建一种情况，导致编译器无法在两个（或多个）正确重载的函数之间做出选择。当这种情况发生时，这种局面就被称为*歧义*。具有歧义的语句是错误，包含歧义的程序将无法编译。\n\
  \n到目前为止，歧义的主要原因涉及 C++ 的自动类型转换。C++ 会尝试尝试将调用函数时使用的参数类型转换为函数定义的参数类型。这是一个示例：\n\n![Image](img/00482.gif)\n\
  \n正如注释所示，这并不是一个错误，因为 C++ 会自动将字符 `c` 转换为其 `double` 等效值。实际上，在 C++ 中，很少有此类类型转换是不允许的。虽然自动类型转换很方便，但它们也是歧义的主要原因。考虑以下程序：\n\
  \n![Image](img/00483.gif)\n\n在这里，`myfunc()` 被重载，使其可以接受 `float` 类型或 `double` 类型参数。在没有歧义的一行中，调用了\
  \ `myfunc(double)`，因为除非显式指定为 `float`，否则 C++ 中所有的浮点数常量默认都是 `double` 类型。然而，当使用整数 `10`\
  \ 调用 `myfunc()` 时，引入了歧义，因为编译器无法知道应该将其转换为 `float` 还是 `double`。这两者都是有效的转换。这种混淆会导致显示错误信息并阻止程序编译。\n\
  \n上述示例所说明的核心问题是，导致歧义的并不是 `myfunc()` 相对于 `double` 和 `float` 的重载。相反，混淆是由使用不确定类型的参数对\
  \ `myfunc()` 进行特定调用引起的。换句话说，出错的不是 `myfunc()` 的重载，而是特定的调用。\n\n这是另一个由 C++ 自动类型转换引起的歧义示例：\n\
  \n![Image](img/00484.gif)\n\n在 C++ 中，`unsigned char` 和 `char` 本身并不具有歧义性。（它们是不同的类型。）然而，当使用整数\
  \ `88` 调用 `myfunc()` 时，编译器不知道应该调用哪个函数。也就是说，88 应该转换为 `char` 还是 `unsigned char`？两者都是有效的转换。\n\
  \n导致歧义的另一种方法是在重载函数中使用默认参数。要了解如何，请检查此程序：\n\n![Image](img/00485.gif)\n\n在第一次调用 `myfunc()`\
  \ 时，指定了两个参数；因此没有引入歧义，并调用了 `myfunc(int i, int j)`。然而，第二次调用 `myfunc()` 导致了歧义，因为编译器不知道调用接受一个参数的\
  \ `myfunc()` 版本，还是对接受两个参数的版本应用默认值。\n\n当你继续编写自己的 C++ 程序时，请准备好可能会遇到歧义错误。遗憾的是，在你变得更有经验之前，你会发现这些错误很容易创建。\n\
  \n![Image](img/00069.jpeg) ***模块 6 掌握检查***\n\n**1**. 参数传递给子程序的两种方式是什么？\n\n**2**.\
  \ 在 C++ 中，什么是引用？如何创建引用参数？\n\n**3**. 给定以下代码段，\n\n![Image](img/00486.gif)\n\n显示如何使用\
  \ `ch` 和 `i` 调用 `f()`。\n\n**4**. 创建一个名为 `round()` 的 `void` 函数，将其 `double` 参数的值四舍入到最近的整数。让\
  \ `round()` 使用引用参数并在参数中返回舍入后的结果。你可以假设所有待舍入的值都是正数。在程序中演示 `round()`。要解决这个问题，你需要 `modf()`\
  \ 标准函数，如下所示：\n\n```cpp\ndouble modf(double num, double *i);\n```\n`modf()` 函数将 *num*\
  \ 分解为整数和小数部分。它返回小数部分并将整数部分放在 *i* 指向的变量中。\n\n**5**. 修改 `swap()`，使其在交换参数值的同时，返回较小值的引用。将此函数命名为\
  \ `min_swap()`。\n\n**6**. 为什么函数不能返回引用？\n\n**7**. 重载函数的参数列表必须何不同？\n\n**8**. 在项目 6-1\
  \ 中，你创建了一组 `print()` 和 `println()` 函数。为这些函数添加一个指定缩进的第二个参数。例如，当这样调用 `print()` 时：\n\
  \n![Image](img/00487.gif)\n\n输出 18 个空格然后显示字符串 \"test\"。让缩进参数默认为 0，这样当它不存在时就不会缩进。\n\
  \n**9**. 给定此原型，\n\n![Image](img/00488.gif)\n\n显示调用 `myfunc()` 的方式。\n\n**10**. 简述重载如何引入歧义。\n\
  \n**注意**![Image](img/00070.gif)\n\n这些问题的答案可以在书的 [www.osborne.com](http://www.osborne.com)\
  \ 找到。\n\n## 第 7 章更多数据类型和运算符\n\n**关键技能**\n\n**7.1** 使用 `const` 和 `volatile`\n\n**7.2**\
  \ 使用 `extern`\n\n**7.3** 理解 `static` 变量。\n\n**7.4** 使用 `register` 变量增强性能\n\n**7.5**\
  \ 创建枚举\n\n**7.6** 使用 `typedef`\n\n**7.7** 学习位运算运算符\n\n**7.8** 应用位移运算符\n\n**7.9**\
  \ 使用 `?` 运算符\n\n**7.10** 理解逗号运算符\n\n**7.11** 利用复合赋值\n\n**7.12** 使用 `sizeof` 运算符\n\
  \n\n\n\n\n本模块回到了数据类型和操作符的话题。除了你为止使用的数据类型外，C++ 还支持其他几种类型。其中一些是在在你已熟悉的类型上添加的修饰符。其他数据类型包括枚举（enumerations）和\
  \ `typedefs`。C++ 还提供了几个额外的运算符，它们极大地扩展了 C++ 可应用的编程任务范围。这些运算符包括位运算符、移位运算符、`?` 和 `sizeof`\
  \ 运算符。\n\n## 关键技能 7.1 const 和 volatile 限定符\n\nC++ 有两种类型限定符，可以影响变量被访问或修改的方式。这些修饰符是\
  \ `const` 和 `volatile`。它们正式称为 `cv-限定符`，在声明变量时位于基础类型之前。\n\n### const\n\n用 `const`\
  \ 修饰符声明的变量在程序执行期间不能更改其值。因此，`const` “变量”实际上并不是可变的！不过，你可以为声明为 `const` 的变量赋予初始值。例如，\n\
  \n![Image](img/00489.gif)\n\n创建了一个名为 `max_users` 的 `int` 变量，其值为 9。该变量可以像其他变量一样在表达式中使用，但它的值不能被程序修改。\n\
  \n`const` 的一个常见用途是创建一个*命名常量*。程序通常在许多不同用途需要相同的值。例如，一个程序可能有多个大小完全相同的数组。在这种情况下，你可以使用\
  \ `const` 变量来指定数组的大小。这种方法的优处是，如果日后需要更改大小，你只需要更改 `const` 变量的值然后重新编译程序。你不需要在每个数组声明中更改大小。这种方法既避免了错误，也更加简单。下面的示例说明了\
  \ `const` 的这种应用：\n\n![Image](img/00490.gif)\n\n在这个示例中，如果你需要为数组使用新的大小，只需要更改 `num_employees`\
  \ 的声明然后重新编译程序即可。所有三个数组都将自动调整大小。\n\n`const` 的另一个重要用途是防止对象通过指针被修改。例如，你可能希望防止函数更改参数所指向的对象的值。要实现这一点，将指针参数声明为\
  \ `const`。这可以防止参数所指向的对象被函数修改。也就是说，当指针参数前面标有 `const` 时，函数中的任何语句都不能修改该参数所指向的变量。例如，以下程序中的\
  \ `negate()` 函数返回其参数所指向的值的反数。在参数声明中使用 `const` 可以防止函数内部的代码修改参数所指向的值。\n\n![Image](img/00491.gif)\n\
  \n由于 `val` 被声明为 `const` 指针，因此函数无法对 `val` 所指向的值进行任何更改。由于 `negate()` 没有尝试更改 `val`，程序可以正确编译并运行。然而，如果将\
  \ `negate()` 写成如下一个示例所示的样子，将导致编译时错误。\n\n![Image](img/00492.gif)\n\n在这种情况下，程序尝试更改\
  \ `val` 所指向的变量的值，但由于 `val` 被声明为 `const`，该操作被禁止了。\n\n`const` 修饰符也可以用于引用参数，以防止函数修改参数所引用的对象。例如，`negate()`\
  \ 的以下版本是错误的，因为它试图修改由 `val:` 引用的变量：\n\n![Image](img/00493.gif)\n\n### volatile\n\n\
  `volatile` 修饰符告诉编译器，变量的值可能会以程序未显式指定的方式发生改变。例如，全局变量的地址可能会传递给中断驱动的时钟例程，该例程会在时钟每次跳动时更新该变量。在这种情况下，在程序没有使用任何显式赋值语句的情况下，变量的内容被更改了。变量的外部更改之所以重要，是因为\
  \ C++ 编译器允许自动优化某些表达式，前提是如果变量的内容没有出现在赋值语句的左侧，则认为内容未改变。然而，如果程序控制之外的因素改变了变量的值就会出现问题。为了防止此类问题，你必须将此类变量声明为\
  \ `volatile`，如下：\n\n![Image](img/00494.gif)\n\n因为它被声明为 `volatile`，每次引用 `current_users`\
  \ 时都会获取其最新值。\n\n### 进度检查\n\n**1**。`const` 变量的值可以被程序更改吗？\n\n**2**。如果变量的值被程序外部的事件更改，该变量应该如何声明？\n\
  \n## 存储类说明符\n\nC++ 支持五种*存储类*说明符。它们是：\n\n`auto`\n`extern`\n`register`\n`static`\n\
  `mutable`\n\n这些用于告诉编译器应该如何存储变量。存储说明符位于变量声明的其他部分之前。\n\n`mutable` 说明符仅适用于 `class`\
  \ 对象，这些对象将在本书的稍后部分讨论。其他每个说明符在这里逐一进行检查。\n\n### auto\n\n`auto` 说明符声明一个局部变量。然而，它很少（如果用的话）被使用，因为局部变量默认就是\
  \ `auto` 的。极罕看到使用这个关键字，它是 C 语言的遗留。\n\n## 关键技能 7.2 extern\n\n你为止处理过的所有程序都很小。然而，在现实中，计算机程序往往要大得多。随着程序文件的增长，编译时间会变得令人厌烦。当发生这种情况时，你应该将程序拆分为两个或多个文件。这样，一个文件的更改就不需要重新编译整个程序。相反，你只需要重新编译更改的文件，并链接其他文件的对象代码。多文件方法在大型项目中可以节省大量时间。`extern`\
  \ 关键字有助于这种方法。让我们来看看如何实现。\n\n在由两个或多个文件组成的程序中，每个文件必须知道程序使用的全局变量的名称和类型。然而，你不能简单地在每个文件中声明全局变量的副本。原因是程序每个全局变量只能有一个。因此，如果你尝试在每个文件中声明程序所需的全局变量，当链接器尝试链接文件时就会出错。它会发现重复的全局变量无法链接你的程序。解决这个困境的方案在一个文件中声明所有全局变量，并在其他文件中使用\
  \ `extern` 声明，如图 7-1\n\n**图 7-1** 在单独编译的模块中使用全局变量\n\n文件一声明了 `x, y` 和 `ch`。文件二从文件一复制全局变量列表，并在声明中添加\
  \ `extern` 说明符。`extern` 说明符允许模块感知变量，但并没有实际创建该变量。也就是说，`extern` 让编译器知道这些全局变量的类型和名称，而不会再次为它们创建存储。当链接器将两个模块在一起时，所有对外部变量的引用都会得到解析。\n\
  \n\n\n\n\n虽然我们还没有考虑变量的声明（declaration）与定义（definition）之间的区别，但在此处这很重要。*声明*（declaration）声明变量名称和类型。*定义*（definition）则为变量分配存储空间。在大多数情况下，变量的声明也是定义。然而，通过在变量名之前加上\
  \ `extern` 限定符，你可以声明一个变量而不对其进行定义。\n\n## extern 链接规范 (The extern Linkage Specification)\n\
  \n`extern` 的一种变体提供了*链接规范*（linkage specification），这是告诉编译器关于链接器应如何处理某个函数的指令。默认情况下，函数被链接为\
  \ C++ 函数，但链接规范允许你为不同类型的语言链接函数。链接指定符（linkage specifier）的一般形式所示：\n\n`extern “*language*”\
  \ *function-prototype*`\n\n其中 *language* 表示所需的语言。例如，这指定了 `myCfunc() ` 将具有 C 链接：\n\
  \n![Image](img/00496.gif)\n\n所有 C++ 编译器都支持 C 和 C++ 链接。某些编译器可能允许针对 FORTRAN、Pascal\
  \ 或 BASIC 的链接指定符。（你可能需要检查你所编译器的文档。）你可以使用这种链接规范的形式一次指定多个函数：\n\n![Image](img/00497.gif)\n\
  \n对于大多数编程任务，你并不需要使用链接规范。\n\n## 关键技能 7.3 static 变量 (static Variables)\n\n`static`\
  \ 类型的变量在其所属的函数或文件中是永久变量。它们与全局变量的区别在于，它们在所属的函数或文件外部是不可知的。由于 `static` 对局部变量的影响与全局变量不同，因此局部变量和全局变量将被分别检查。\n\
  \n### static 局部变量 (static Local Variables)\n\n当将 `static` 修饰符应用于局部变量时，为该变量分配永久存储空间的方式与全局变量的方式非常相似。这使得\
  \ `static` 变量可以在函数调用之间保持其值。（也就是说，当函数返回时，它的值不会丢失，这与普通局部变量的值不同。）。`static` 局部变量与全局变量之间的关键区别在于，`static`\
  \ 局部变量仅对其声明所在的代码块可见。\n\n要声明 `static` 变量，请在其类型之前加上单词 `static`。例如，该语句将 `count` 声明为\
  \ `static` 变量：\n\n![Image](img/00498.gif)\n\n`static` 变量可以被赋予初始值。例如，该语句为 `count`\
  \ 赋了初始值 200：\n\n![Image](img/00499.gif)\n\n局部 `static` 变量只初始化一次，即程序执行开始时，而不是在每次进入其声明的代码块时初始化。\n\
  \n`static` 局部变量对于必须在调用之间保留值的函数来说非常重要。如果没有 `static` 变量，就必须使用全局变量——这为可能产生的副作用打开了大门。\n\
  \n要查看 `static` 变量的示例，请尝试这个程序。它维护用户输入数字的运行平均值。\n\n![Image](img/00500.jpeg)\n\n在这里，局部变量\
  \ `sum` 和 `count` 都被声明为 `static` 并初始化为 0。记住，对于 `static` 变量，初始化只发生一次——而不是每次进入函数时。程序使用\
  \ `running_avg()` 来计算并报告用户输入数字的当前平均值。由于 `sum` 和 `count` 都是 `static` 的，它们会在调用之间保持其值，从而使程序正常运行。为了向自己证明\
  \ `static` 修饰符是必要的，请尝试移除它并运行程序。正如你所看到的，程序不再正常工作，因为每次 `running_avg()` 返回时，运行总和都会丢失。\n\
  \n### static 全局变量 (static Global Variables)\n\n当将 `static` 指定符应用于全局变量时，它告诉编译器创建一个全局变量，该变量仅对声明该\
  \ `static` 全局变量的文件可见。这意味着尽管该变量是全局的，其他文件中的函数对它一无所知，也无法更改其内容。因此，它不受副作用的影响。因此，在局部 `static`\
  \ 变量无法胜任的少数情况下，你可以创建一个只包含该全局 `static` 变量的函数的小文件，单独编译该文件，并在不担心副作用的情况下使用它。\n\n关于全局\
  \ `static` 变量的示例，我们将重做上一节中的运行平均值程序。在这个版本中，程序被分为所示的两个文件。还添加了重置平均值的 `reset()` 函数。\n\
  \n![Image](img/00501.gif)\n\n![Image](img/00502.gif)\n\n在这里，`sum` 和 `count` 现在是局限于第二个文件的全局\
  \ `static` 变量。因此，它们可以被第二个文件的 `running_avg()` 和 `reset()` 访问，但在其他地方无法访问。这允许它们通过调用\
  \ `reset()` 进行重置，以便对第二组数字计算平均值。（当你运行程序时，可以通过输入 −2 来重置平均值。）然而，第二个文件之外没有任何函数可以访问这些变量。例如，如果你尝试从第一个文件访问\
  \ `sum` 或 `count`，你将收到错误信息。\n\n回顾一下：局部 `static` 变量的名称仅对其声明的函数或代码块可见，而全局 `static`\
  \ 变量的名称仅对其所在的文件可见。本质上，`static` 修饰符允许变量在需要它们的作用域内存在，从而控制并限制了副作用的可能性。`static` 类型的变量允许你隐藏程序的其他部分。\n\
  \n### 专家问答 (Ask the Expert)\n\n**问：我听说有些 C++ 程序员不使用全局变量。这是真的吗？**\n\n**答：尽管 `static`\
  \ 全局变量在 C++ 中仍然有效且被广泛使用，但 C++ 标准并不建议使用它们。相反，它推荐另一种控制全局变量访问的方法，即使用命名空间（namespaces），这将在本书后面介绍。然而，C\
  \ 程序员广泛使用 `static` 全局变量，因为 C 不支持命名空间。由于这个原因，在很长一段时间内你将继续看到 `static` 全局变量。\n\n##\
  \ 关键技能 7.4 register 变量 (register Variables)\n\n最重要的存储类指定符可能是 `register`。`register`\
  \ 修饰符告诉编译器以最快的方式存储变量。通常意味着将其存储在 CPU 寄存器或缓存内存中。正如你可能知道，访问 CPU 寄存器（或缓存内存）本质上快于访问计算机的主内存。因此，存储在寄存器中的变量访问速度比存储在\
  \ RAM 中快得多。因为变量的访问速度对程序的整体速度有巨大影响，仔细使用 `register` 是一项重要的编程技术。\n\n从技术上说，`register`\
  \ 只是编译器的请求，编译器可以忽略它。原因显而易见：寄存器（或快速访问内存）的数量是有限的，并且随环境而异。因此，如果编译器用尽了快速访问内存，它将按通常存储变量。通常这不会造成任何伤害，但当然失去了\
  \ `register` 的优势。你通常可以指望有两个变量针对速度进行了优化。\n\n\n\n\n由于实际上只有有限的变量可以获得最快的访问速度，因此仔细选择应用\
  \ `register` 修饰符的变量至关重要。（只有通过选择正确的变量，你才能获得最大的性能提升。）通常，变量被访问的频率越高，将其优化为 `register`\
  \ 变量所带来的益处就越大。因此，在循环中控制或在循环内被访问的变量是 `register` 限定符的理想人选。\n\n以下是一个使用 `register` 变量提高\
  \ `sum()` 函数性能的示例，该函数计算数组中值的总和。此示例假设只有两个变量会进行速度优化。\n\n![Image](img/00503.gif)\n\n\
  在这里，控制 `for` 循环的变量 `i` 和在循环内部访问的变量 `sum` 被指定为 `register`。由于它们都在循环内部使用，因此都从快速访问的优化中获益。此示例假设只有两个变量可以进行速度优化，因此\
  \ `n` 和 `nums` 没有被指定为 `register`，因为它们在循环内部的访问频率不如 `i` 和 `sum`。然而，在可以优化两个以上变量的环境中，它们也可以被指定为\
  \ `register` 以进一步提高性能。\n\n#### ![Image](img/00003.jpeg) 进度检查\n\n**1**. 一个 `static`\
  \ 局部变量在函数调用之间 ___________ 其值。\n\n**2**. 你使用 `extern` 来声明一个变量但不定义该变量。对还是错？\n\n**3**.\
  \ 哪个限定符请求编译器对变量进行速度优化？\n\n### 专家问答\n\n**问：当我尝试在程序中添加 register 限定符时，我没有看到性能有任何变化。为什么呢？**\n\
  \n**答：** 由于编译器技术的进步，如今的大多数编译器会自动优化你的代码。因此，在许多情况下，在声明中添加 `register` 限定符可能不会带来任何性能提升，因为该变量已经过优化。然而，在某些情况下，使用\
  \ `register` 仍然是有益的，因为它让你能告诉编译器你认为哪些变量是最需要优化的。这对于使用大量变量且所有变量都无法被优化的函数来说非常有价值。因此，尽管编译器设计有所进步，`register`\
  \ 仍然发挥着重要作用。\n\n## 关键技能 7.5 枚举\n\n在 C++ 中，你可以定义一个命名的整数常数列表。这样的列表被称为*枚举*（enumeration）。这些常量随后可以在任何可以使用整数的地方使用。枚举使用关键字\
  \ `enum` 定义，并具有以下通用格式：\n\n`enum type-name { value-list} variable-list;`\n\n在这里，`type-name`\
  \ 是枚举的类型名称。`value-list` 是一个由逗号分隔的名称列表，这些名称代表枚举的值。`variable-list` 是可选的，因为可以在稍后使用枚举类型名声明变量。\n\
  \n以下片段定义了一个名为 `transport` 的枚举以及两个类型为 `transport` 的变量，分别名为 `tl` 和 `t2`：\n\n![Image](img/00504.gif)\n\
  \n一旦你定义了枚举，就可以使用它的名称声明该类型的额外变量。例如，此语句声明了一个名为 `how` 的枚举类型 `transport` 变量：\n\n![Image](img/00505.gif)\n\
  \n该语句也可以写成这样：\n\n![Image](img/00506.gif)\n\n然而，在这里使用 `enum` 是多余的。在 C 语言（也支持枚举）中，这种形式是必须的，因此你可能会某些程序中看到它的用法。\n\
  \n假设前面的声明有效，以下代码为 `how` 赋值值 `airplane`：\n\n![Image](img/00507.gif)\n\n理解枚举的关键点是，每个符号都代表一个整数值。因此，它们可以在任何整数表达式中使用。除非另有初始化，第一个枚举符号的值为\
