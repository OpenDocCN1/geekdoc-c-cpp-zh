  \n## 第 2 模块：介绍数据类型和操作符\n\n### 关键技能\n- 2.1 了解 C++ 数据类型\n- 2.2 使用字面量\n- 2.3 创建初始化的变量\n\
  - 2.4 使用算术运算符\n- 2.5 使用关系运算符和逻辑运算符\n- 2.6 理解赋值运算符\n- 2.7 使用复合赋值运算符\n- 2.8 理解赋值中的类型转换\n\
  - 2.9 理解表达式中的类型转换\n- 2.10 使用强制类型转换 (cast)\n- 2.11 理解空格和括号\n\n编程语言的核心是它的数据类型和操作符。这些元素定义了语言的边界，并决定了它可以应用的任务。正如你预期的那样，C++\
  \ 支持丰富的各种类型和操作符，这使其适用于广泛编程。\n\n数据类型和操作符是一个庞大的课题。我们将从研究 C++ 的基础数据类型及其最常用的操作符开始。我们还将详细查看变量并研究表达式。\n\
  \n### 为什么数据类型非常重要\n变量的数据类型非常重要，因为它决定了允许的操作以及可以存储的值的范围。C++ 定义了多种数据类型，每种类型都有独特的特性。由于数据类型不同，所有变量在使用之前必须先声明，且变量声明始终包含一个类型说明符。编译器需要这些信息来生成正确的代码。在\
  \ C++ 中，没有“无类型”变量的概念。\n\n数据类型对 C++ 编程重要的第二个原因是，其中几种基本类型与计算机运行的构建块——字节（bytes）和字（words）紧密相关。因此，C++\
  \ 让你操作与 CPU 本身相同类型的数据。这是 C++ 能够编写非常高效的系统级代码的方法之一。\n\n### 关键技能 2.1 C++ 数据类型\nC++\
  \ 提供了对应整数、字符、浮点值和布尔值的内置数据类型。这些是程序通常存储和处理数据的方式。正如你将在本书的后半部分看到的，C++ 允许你构建更复杂的类型，例如类、结构体和枚举，但这些最终也由内置类型组成。\n\
  \nC++ 类型系统的核心是这里显示的七种基本数据类型：\n\n![Image](img/00071.gif)\n\nC++ 允许某些基本类型前面带有修饰符。修饰符会改变基础类型的含义，使其更精确地适应各种情况的需求。数据类型修饰符列如下：\n\
  \n- `signed`\n- `unsigned`\n- `long`\n- `short`\n\n修饰符 `signed`、`unsigned`、`long`\
  \ 和 `short` 可以应用于 `int`。修饰符 `signed` 和 `unsigned` 可以应用于 `char` 类型。`double` 类型可以被\
  \ `long` 修饰。表 2-1 显示了基本类型和类型修饰符的所有有效组合。该表还显示了 ANSI/ISO C++ 标准指定的每个类型的保证最小范围。\n\n\
