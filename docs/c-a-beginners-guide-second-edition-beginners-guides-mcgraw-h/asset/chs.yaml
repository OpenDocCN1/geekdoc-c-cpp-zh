  \ `Vehicle` 对象都将包含实例变量 `passengers`、`fuelcap` 和 `mpg` 自己的副本。要访问这些变量，你将使用点（`.`）运算符。点运算符将对象的名称与成员的名称连接起来。点运算符的通用格式所示：\n\
  \n```\nobject.member\n```\n\n因此，对象位于左侧，成员放在右侧。例如，要给 `minivan` 的 `fuelcap` 变量赋值 16，请使用以下语句：\n\
  \n![Image](img/00566.gif)\n\n通常，你可以使用点运算符来访问实例变量并调用函数。\n\n这里是一个使用 `Vehicle` 类的完整程序：\n\
  \n![Image](img/00567.jpeg)\n\n让我们仔细观察这个程序。`main()` 函数创建了一个名为 `minivan` 的 `Vehicle`\
  \ 实例。然后 `main()` 内部的代码访问与 `minivan` 关联的实例变量，为它们赋值，然后使用这些值。`main()` 内部的代码可以访问 `Vehicle`\
  \ 的成员，因为它们被声明为 `public`。如果它们没有指定为 `public`，它们的访问将被限制在 `Vehicle` 类中，`main()` 将无法使用它们。\n\
  \n运行程序时，你将看到以下输出：\n\n![Image](img/00568.gif)\n\n在继续之前，让我们回顾一个基本原则：每个对象都有其类所定义的实例变量的副本。因此，一个对象中变量的内容可能与另一个对象中变量的内容不同。这两个对象之间没有任何联系，除了它们都是同类型的对象这一事实。例如，如果你有两个\
