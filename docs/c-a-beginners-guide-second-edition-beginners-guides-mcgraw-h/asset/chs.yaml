  \ `cout` 语句显示字符 123。接下来，输出两个退格字符，删除了 2 和 3。最后，显示字符 4 和 5。\n\n#### ![Image](img/00003.jpeg)\
  \ 进度检查\n\n1. 默认情况下，字面量 10 的类型是什么？字面量 10.0 的类型是什么？\n2. 如何指定 100 为 `long int`？如何指定\
  \ 100 为 `unsigned int`？\n3. `b` 是什么？\n\n### 关键技能 2.3 深入观察变量\n\n变量在模块 1 中介绍。在这里我们将深入观察它们。正如你所学的，变量使用这种形式的语句进行声明：\n\
  \n```\ntype var-name;\n```\n\n\n\n\n\n其中 `type` 是变量的数据类型，`var-name` 是变量的名称。你可以声明任何有效类型的变量。当你创建一个变量时，你实际上是在创建该类型的一个实例。因此，变量的能力由其类型决定。例如，类型为\
  \ `bool` 的变量存储布尔值，它不能用于存储浮点值。此外，变量的类型在其整个生命周期内不能改变。例如，一个 `int` 变量不能变成一个 `double`\
  \ 变量。\n\n### 初始化变量\n\n你可以在声明变量的同时对其赋一个值。要做到这一点，请在变量名后跟一个等号和要赋的值。这被称为`变量初始化`（variable\
  \ initialization）。其通用形式所示：\n\n`type var = value;`\n\n在这里，`value` 是在创建 `var` 时赋给它的值。\n\
  \n以下是一些示例：\n\n![Image](img/00098.gif)\n\n当使用逗号分隔的列表声明两个或多个相同类型的变量时，你可以为其中一个或多个变量赋一个初始值。例如：\n\
  \n![Image](img/00099.gif)\n\n在这种情况下，只有 `b` 和 `c` 被初始化了。\n\n### 动态初始化\n\n虽然前面的示例仅使用了常量作为初始化器，但\
  \ C++ 允许使用变量声明时任何有效的表达式对变量进行动态初始化。例如，这里有一个短程序，它根据底底半径和高度计算圆柱的体积：\n\n![Image](img/00100.gif)\n\
  \n在这里，声明了三个局部变量——`radius`、`height` 和 `volume`。前两个变量 `radius` 和 `height` 由常量初始化的。然而，`volume`\
  \ 被动态初始化为圆柱的体积。这里的关键在于，初始化表达式可以使用初始化时有效的任何元素，包括对函数的调用、其他变量或字面量。\n\n### 运算符\n\nC++\
  \ 提供了丰富的运算符环境。`operator`（运算符）是一个符号，告诉编译器执行特定的数学或逻辑操作。C++ 有四类通义的运算符：`arithmetic`（算术）、`bitwise`（位运算）、`relational`（关系）和\
  \ `logical`（逻辑）。C++ 还有若干处理某些特殊情况的附加运算符。本章将检查算术、关系和逻辑运算符。我们还将检查赋值运算符。位运算和其他特殊将在稍后讨论。\n\
  \n## 关键技能 2.4 算术运算符\n\nC++ 定义了以下算术运算符：\n\n![Image](img/00101.gif)\n\n运算符 `+`、`−`、`*`\
  \ 和 `/` 在 C++ 中的工作方式与它们在代数中相同。它们可以应用于任何内置的数值数据类型，也可以应用于 `char` 类型的值。\n\n`%`（取模）运算符产生整数除法的余数。记住，当\
  \ `/` 应用于整数时，任何余数都会被截断；例如，在整数除法中 `10/3` 等于 `3`。你可以使用 `%` 运算符获得该除法的余数。例如，`10 % 3`\
  \ 等于 `1`。在 C++ 中，`%` 只能应用于整数操作数；不能应用于浮点类型。\n\n下面的程序演示了模运算符：\n\n![Image](img/00102.gif)\n\
  \n输出所示：\n\n![Image](img/00103.gif)\n\n#### 递增与递减\n\n在模块 1 中引入的 `++` 和 `−` 是递增和递减运算符。它们具有一些特殊属性，使得它们非常有趣。让我们先精确地回顾一下递增和递减运算符的作用。\n\
  \n递增运算符对其操作数加 1，递减运算符对其减 1。因此：\n\n![Image](img/00104.gif)\n\n等于\n\n![Image](img/00105.gif)\n\
  \n以及\n\n![Image](img/00106.gif)\n\n等于\n\n![Image](img/00107.gif)\n\n递增和递减运算符都可以位于操作数之前（前缀），也可以位于操作数之后（后置）。例如：\n\
  \n![Image](img/00108.gif)\n\n可以写成\n\n![Image](img/00109.gif)\n\n或\n\n![Image](img/00110.gif)\n\
  \n在这个示例中，递增作为前缀应用还是后置应用没有区别。然而，当递增或递减作为较大表达式的一部分时，存在着重要的区别。当递增或递减运算符位于操作数之前时，C++\
  \ 会先执行操作，获取操作数的值供表达式的其他部分使用。如果运算符位于操作数之后，那么 C++ 将在递增或递减之前获取操作数的值。考虑以下情况：\n\n![Image](img/00111.gif)\n\
  \n在这种情况下，`y` 将被设置为 `11`。然而，如果代码写成：\n\n![Image](img/00112.gif)\n\n那么 `y` 将被设置为 `10`。在两种情况下，`x`\
  \ 仍然被设置为 `11`；区别在于发生的时间。能够控制递增或递减操作发生的时间具有显著的优势。\n\n算术运算符的优先级所示：\n\n![Image](img/00113.gif)\n\
  \n位于相同优先级的运算符由编译器从左到右求值。当然，可以使用括号来改变求值顺序。\n\n### 专家问\n\n问：`++` 与名字有关系吗？\n\n答：是的！如你所知，C++\
  \ 构建在 C 之上。Stroustrup 最初将 C++ 命名为“带类的 C”，但在 Rick Masitti 的建议下，他将其更名为 C++。虽然这种新语言注定会成功，但\
  \ C++ 这个名字几乎保证了它在历史上的地位，因为每个 C 程序员都能立即识别。\n\n### 关键技能 2.5 关系与逻辑运算符\n\n在 `relational\
  \ operator`（关系运算符）和 `logical operator`（逻辑运算符）术语中，关系指的是值之间的关系，而逻辑指的是真假值连接的方式。由于关系运算符产生真假结果，它们经常与逻辑运算符一起工作。由于这种原因，我们将放在一起讨论。\n\
  \n关系和逻辑运算符见表 2-4。注意 C++ 中，*不等于*用 `!=` 表示，*等于*用双等号 `==` 表示。在 C++ 中，关系或逻辑表达式的结果产生一个\
  \ `bool` 结果。也就是说，关系或逻辑表达式的结果是 `true` 或 `false`。\n\n![Image](img/00114.gif)\n\n**表\
  \ 2-4** C++ 中的关系和逻辑运算符\n\n**注意**![Image](img/00070.gif)\n\n对于旧的编译器，关系或逻辑表达式的结果将是整数值\
  \ 0 或 1。然而，这种区别主要是学术上的，因为如前所述，C++ 会自动将 `true` 转换为 1，将 `false` 转换为 0，反之亦然。\n\n关系运算符的操作数可以是几乎任何类型，只要它们可以进行意义比较。逻辑运算符的操作数必须产生真或假的结果。由于任何非零值为真，零为假，这意味着逻辑运算符可以与任何求值为零或非零的表达式配合。因此，除了具有\
  \ `void` 结果的表达式外，任何表达式都可以使用。\n\n逻辑运算符用于支持基本的逻辑操作 AND、OR 和 NOT，如下真值表所示：\n\n![Image](img/00115.gif)\n\
  \n\n\n\n\n这是一个演示了若干关系运算符和逻辑运算符的程序：\n\n![Image](img/00116.gif)\n\n程序的输出在此处：\n\n![Image](img/00117.gif)\n\
  \n关系运算符和逻辑运算符的优先级都低于算术运算符。这意味着像 `10 > 1+12` 这样的表达式求值方式就像写成 `10 > (1+12)` 一样。结果显然是\
  \ `false`。\n\n你可以使用逻辑运算符将任意数量的关系操作连接在一起。例如此表达式连接了三个关系操作：\n\n![Image](img/00118.gif)\n\
  \n下表显示了关系运算符和逻辑运算符的相对优先级：\n\n![Image](img/00119.gif)\n\n### 项目 2-2 构建异或 逻辑操作\n\n\
  `XOR.cpp`\n\nC++ 没有定义执行异或操作（exclusive-OR，通常称为 XOR）的逻辑运算符。异或是一个二元运算，当且仅有一个操作数为 `true`\
  \ 时，其结果为 `true`。它的真值表如下：\n\n![Image](img/00120.gif)\n\n有些程序员认为遗漏 XOR 是一种缺陷。另一些人则认为，缺少\
  \ XOR 逻辑运算符仅仅是 C++ 精简设计的一部分，这避免了冗余的功能。他们指出，使用 C++ 提供的三个逻辑运算符可以很容易地创建异或逻辑操作。\n\n\
  在这个项目中，你将使用 `&&`、`||` 和 `!` 运算符来构建一个异或操作。你可以自己判断缺少 XOR 逻辑运算符是一个设计缺陷，还是一个优雅的特性！\n\
  \n#### 逐步完成\n\n**1**. 创建一个名为 `XOR.cpp` 的新文件。\n\n**2**. 假设有两个布尔值 `p` 和 `q`，逻辑异或的构建方式如下：\n\
  \n`(p || q) && !(p && q)`\n\n让我们仔细分析。首先，`p` 与 `q` 进行 OR（或运算）。如果该结果为 `true`，则说明至少有一个操作数为\
  \ `true`。接下来，`p` 与 `q` 进行 AND（与运算）。如果两个操作数都为 `true`，则该结果为 `true`。然后使用 NOT 运算符对该结果进行取反。因此，当\
  \ `p`、`q` 或两者都为 `false` 时，`!(p && q)` 的结果为 `true`。最后，此结果与 `(p || q)` 的结果进行 AND 运算。因此，当仅有有一个操作数为\
  \ `true` 时，整个表达式的结果为 `true`。\n\n**3**. 这里是整个 `XOR.cpp` 程序代码列表。它演示了所有四种可能的 `true/false`\
  \ 值组合的异或操作。\n\n![Image](img/00121.gif)\n\n![Image](img/00122.gif)\n\n**4**. 编译并运行程序。产生了如下输出：\n\
  \n![Image](img/00123.gif)\n\n**5**. 注意 `cout` 语句中包裹异或操作的外层括号。这些括号是必要的，这是由于 C++ 运算符的优先级导致的。`<<`\
  \ 运算符的优先级高于逻辑运算符。为了证明这一点，尝试移除外层括号，然后尝试编译程序。如你所看到的，系统将报告错误。\n\n#### ![Image](img/00003.jpeg)\
  \ 进度检查\n\n**[1]**. `%` 运算符的作用是什么？它可以应用于哪些类型？\n\n**[2]**. 如何声明一个初始值为 10 的名为 `index`\
  \ 的 `int` 变量？\n\n**[3]**. 关系表达式或逻辑表达式的结果是什么什么类型的？\n\n## 关键技能 2.6 赋值运算符\n\n从模块 1\
  \ 开始，你一直在使用赋值运算符。现在是时候正式观察一下它了。赋值运算符是单等号 `=`。赋值运算符在 C++ 中的工作方式与在任何其他计算机语言中一样。它具有如下通用形式：\n\
  \n`var = expression;`\n\n在这里，表达式的值被赋给 `var`。\n\n赋值运算符确实有一个有趣的属性：它允许你创建一个赋值链。例如，考虑这段代码：\n\
  \n![Image](img/00124.gif)\n\n这段代码使用单个语句将变量 `x`、`y` 和 `z` 设置为 100。这之所以可行，是因为 `=`\
  \ 是一个运算符，它会产生右侧表达式的值。因此，`z = 100` 的值是 100，然后被赋给 `y`，进而被赋给 `x`。使用“赋值链”是将一组变量设置为相同值的一种简便方法。\n\
  \n## 关键技能 2.7 复合赋值\n\nC++ 提供了特殊的复合赋值运算符，简化了某些赋值语句的编写。让我们从一个示例开始。这里显示的赋值语句：\n\n![Image](img/00125.gif)\n\
  \n可以使用复合赋值写为：\n\n![Image](img/00126.gif)\n\n运算符对 `+=` 告诉编译器给 `x` 赋值 `x` 加上 10 的值。\n\
  \n这是另一个例子。语句\n\n![Image](img/00127.gif)\n\n等同于\n\n![Image](img/00128.gif)\n\n对于大多数二元运算符（需要两个操作数的运算符），都有复合赋值运算符。因此，形式如下的语句\n\
  \n`var op = expression;`\n\n可以转换为这种复合形式：\n\n`var op expression;`\n\n由于复合赋值语句比它们的完整形式更短，复合赋值运算符有时被称为简写赋值运算符。复合赋值运算符提供了两个优点：首先，它们更紧凑；其次，它们可以产生高效的代码。由于这些原因，你经常会在编写\
  \ C++ 程序时看到复合赋值。\n\n## 关键技能 2.8 赋值中的类型转换\n\n当一种类型的变量与另一种类型的变量混合时，会发生类型转换。在赋值语句中，类型转换规则很简单：右侧（表达式侧）的值转换为左侧（目标变量）的类型，如下：\n\
  \n![Image](img/00129.gif)\n\n第一行，整数 `x` 的高位被去掉，给 `ch` 保留 8 位。如果 `x` 在 -128 到 127\
  \ 之间，`ch` 和 `x` 的值将相同。第二行，`x` 将接收 `f` 的整数部分。第三行，`f` 将把存储在 `ch` 中的 8 位整数值转换为相同值的浮点格式。第四行，`f`\
  \ 将一个整数值转换为浮点格式。\n\n当从整数转换为字符以及从长整型转换为整数时，会移除相应的高位位。在许多 32 位环境中，这意味着从整数转换为字符时会丢失\
  \ 24 位，从整数转换为短整型型时会丢失 16 位。当从浮点类型转换为整数类型时，小数部分将丢失。\n\n## 表达式\n\n运算符、变量和字面量是表达式的组成部分。你可能已经从其他编程经验或代数中知道了表达式的通用形式。然而，现在将讨论表达式的某些方面。\n\
  \n## 关键技能 2.9 表达式中的类型转换\n\n\n\n\n\n当不同类型的常量和变量在表达式中混合使用时，它们会被转换为相同的类型。首先，所有的 `char`\
  \ 和 `short int` 值都会被自动提升为 `int`。这个过程被称为*整型提升*（integral promotion*）。接下来，所有操作数都会“向上”转换为最大操作数的类型，这被称为*类型提升*（type\
  \ promotion*）。这种提升是基于逐个操作的。例如，如果其中一个操作数是 `int` 而另一个是 `long int`，那么 `int` 将被提升为 `long\
  \ int`。或者，如果任一操作数是 `double`，另一个操作数就会提升为 `double`。这意味着诸如从 `char` 到 `double` 的转换是完全有效的。一旦应用了转换，每对操作数都将具有相同的类型，且每个操作的结果将与两个操作数的类型相同。\n\
  \n#### 与 bool 之间进行转换\n\n如前所述，`bool` 类型的值在整数表达式中使用时，会自动转换为整数 0 或 1。当将整数结果转换为 `bool`\
  \ 类型时，0 变为 `false`，非零变为 `true`。虽然 `bool` 是 C++ 较晚引入的特性，但与整数之间的自动转换意味着它对旧代码几乎没有影响。此外，自动转换允许\
  \ C++ 保持其对真和假为零和非零的原始定义。\n\n## 关键技能 2.10 强制转换 (Casts)\n\n可以使用名为*强制转换*（cast）的结构来强制表达式转换为特定类型。强制转换是一种显式的类型转换。C++\
  \ 定义了五种强制转换。其中四种允许对转换进行详细且复杂的控制，将在书中后面解释对象后进行描述。然而，你现在就可以使用一种类型的强制转换。它是 C++ 最通用的强制转换，因为可以将任何类型转换为任何其他类型。它也是\
  \ C++ 早期版本支持的唯一强制转换。这种转换的通用形式为：\n\n```\n(type) expression\n```\n\n其中 `type` 是你想要将表达式转换的目标类型。例如，如果你想确保表达式\
  \ `x/2` 求值类型为 `float`，你可以写成\n\n![Image](img/00130.gif)\n\n强制转换被视为运算符。作为运算符，强制转换是单元运算符，且与任何其他一元运算符具有相同的优先级。\n\
  \n强制转换在某些情况下非常有用。例如，你可能想使用整数进行循环控制，但同时也对其进行需要小数部分的计算，如下所示的程序所示：\n\n![Image](img/00131.gif)\n\
  \n以下是该程序的输出：\n\n![Image](img/00132.gif)\n\n如果没有这个示例中的 `(float)` 强制转换，将只会执行整数除法。强制转换确保了答案的小数部分会被显示。\n\
  \n## 关键技能 2.11 间距与括号\n\nC++ 中的表达式可以包含制表符和空格，以提高其可读性。例如，以下两个表达式是相同的，但第二个更容易读：\n\n\
  ![Image](img/00133.gif)\n\n括号会增加其中包含的操作的优先级，就像在代数中一样。使用冗余或额外的括号不会导致错误，也不会减慢表达式的执行速度。鼓励你使用括号来明确精确的评估顺序，既是为了你自己，也是为了以后可能需要理清你程序的人。例如，以下两个表达式中哪一个更容易读？\n\
  \n![Image](img/00134.gif)\n\n#### 项目 2-3 计算贷款的定期还款额\n\n`RegPay.cpp`\n\n在这个项目中，你将创建一个计算贷款（如汽车贷款）定期还款额的程序。给定本金、期限、每年还款次数和利率，程序将计算还款金额。由于这是一项财务计算，你需要使用浮点数据类型进行计算。由于\
