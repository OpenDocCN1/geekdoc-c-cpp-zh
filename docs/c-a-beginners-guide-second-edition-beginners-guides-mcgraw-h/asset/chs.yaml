  \ `accessor functions`（访问器函数）。面向对象编程成功的要素部分是通过成员函数控制对数据的访问。由于大多数 C++ 程序员都在类内部定义访问器函数和其他短成员函数，因此本书中的后续\
  \ C++ 示例将遵循这一约定。这也是你应该使用的方法。\n\n这里是重写的 `Vehicle` 类，其构造函数、析构函数和 `range()` 函数被定义在类内部。此外，`passengers`、`fuelcap`\
