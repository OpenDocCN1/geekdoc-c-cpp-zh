  \n```cpp\nbool a = true;\nbool b = false;\nbool result = a && b; // result 为 false\n\
  bool result2 = a || b; // result2 为 true\nbool result3 = !a; // result3 为 false\n\
  ```\n\n#### 浮点类型\n\n`float` 和 `double` 类型用于表示小数部分的数字。`float` 是单精度浮点类型，而 `double`\
  \ 是双精度。\n\n```cpp\nfloat pi = 3.14159f;\ndouble distance = 1500.55;\n```\n\n`double`\
  \ 类型更常见，因为它比 `float` 提供了更高的。\n\n#### 整数类型\n\n`int`、`short`、`long` 和 `char` 类型用于表示整数。\n\
