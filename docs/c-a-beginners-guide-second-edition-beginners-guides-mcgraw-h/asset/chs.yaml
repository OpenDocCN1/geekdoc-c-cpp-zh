  数组中的单个元素通过索引（index）访问。`index` 描述元素在数组中的位置。在 C++ 中，所有数组的第一个元素的索引都是 0。因为 `sample`\
  \ 有十个元素，所以它的索引值是从 0 到 9。你通过使用元素的编号对数组进行索引来访问数组元素。要对数组进行索引，请指定你想要的元素编号并将其放在方括号中。因此，`sample`\
  \ 中的第一个元素是 `sample[0]`，最后一个元素是 `sample[9]`。例如，以下程序向 `sample` 加载了 0 到 9 的数字：\n\n\
