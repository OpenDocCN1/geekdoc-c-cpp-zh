  \ [www.osborne.com](http://www.osborne.com) 页面找到。\n\n## 附录 A 预处理器\n\n*预处理器*是编译器的一部分，在将你的源代码实际翻译成目标代码之前，对你的程序执行各种文本操作。你可以向预处理器提供文本操作命令。这些命令被称为*预处理器指令*，尽管它们在技术上不属于\
  \ C++ 语言的一部分，但它们扩展了其编程环境的范围。\n\n预处理器是 C 语言遗留，对于 C++ 来说不像 C 那么重要。此外，某些预处理器功能已被更新更好的\
  \ C++ 语言元素变得多余。然而，由于许多程序员仍在使用预处理器，而且因为它仍然是 C++ 语言环境的一部分，这里进行了简要讨论。\n\nC++ 预处理器包含以下指令：\n\
  \n![Image](img/00950.gif)\n\n显然，所有的预处理器指令都以 `#` 号开头。我们将逐一检查每一个。\n\n### #define\n\
  \n`#define` 用于定义一个标识符和一个字符序列，该字符序列会在源文件中每次遇到该标识符时被替换。该标识符被称为*宏名*，而替换过程被称为*宏替换*。该指令的一般形式为：\n\
  \n`#define macro-name character-sequence`\n\n注意这条语句中没有分号。标识符和字符序列开始之间可以有任意数量的空格，但一旦序列开始，仅由换行符终止。\n\
  \n例如，如果你想用单词“UP”表示值 1，用单词“DOWN”表示值 0，你可以声明以下两个 `#define`：\n\n![Image](img/00951.gif)\n\
  \n这些语句将导致编译器在你的源文件中每次遇到 `UP` 或 `DOWN` 名称时将其替换为 1 或 0。例如，以下内容将在屏幕上打印 **1 0 2**：\n\
  \n![Image](img/00952.gif)\n\n理解宏替换仅仅是将标识符替换为其关联的字符串是非常重要的。因此，如果你想定义一个标准消息，可以写类似这样的内容：\n\
  \n![Image](img/00953.gif)\n\n如果宏名出现在引号字符串中，则不会发生替换。例如，\n\n![Image](img/00954.gif)\n\
  \n不会打印\n\n![Image](img/00955.gif)\n\n如果字符串超过一行，你可以在行尾放置一个反斜杠来继续，如下例所示：\n\n![Image](img/00956.gif)\n\
  \nC++ 程序员的习惯是用大写字母作为宏名。这种习惯有助于阅读程序的人知道将进行宏替换。此外，最好将所有的 `#define` 放在文件开头，或者单独的包含文件中，而不是散落在程序中。\n\
  \n最后一点：C++ 提供了一种比使用 `#define` 更好的定义常量的方法，那就是使用 `const` 限定符。然而，许多 C++ 程序员是从 C 迁移过来的，那里\
  \ `#define` 常用于此。因此，你可能在 C++ 代码中经常看到它。\n\n字体 函数宏\n\n`#define` 指令还有另一个功能：宏名可以带有参数。每次遇到宏名，与其关联的参数就会被程序中的实际参数所替换。这创建了一个*函数宏*。这是一个示例：\n\
  \n![Image](img/00959.gif)\n\n当编译此程序时，表达式 `MIN(a,b)` 将被替换，只是 `x` 和 `y` 将作为操作数使用。也就是说，`cout`\
  \ 语句将被替换为：\n\n![Image](img/00960.gif)\n\n本质上，函数宏是一种定义函数的方式，其代码是内联展开而不是调用的。\n\n`MIN`\
  \ 宏周围看似多余的括号对于由于运算符的相对优先级而确保替换表达式的正确求是必要的。事实上，在几乎所有的函数宏中都应该应用额外的括号。否则，可能会出现意外的结果。例如，考虑这个短程序，它使用宏来判断一个值是偶数还是奇数：\n\
  \n![Image](img/00961.gif)\n\n由于宏替换的方式，该程序无法正常工作。编译时，`EVEN(9+1)` 被展开为\n\n![Image](img/00962.gif)\n\
  \n\n\n\n\n正如你可能记得的，`%`（取模）运算符的优先级高于加法运算符。这意味着 `%` 操作首先对 `1` 执行，然后将结果与 `9` 相加，这（当然）不等于\
  \ `0`。这导致 `EVEN` 宏错误地将 `9+1` 的值报告为奇数。为了解决这个问题，在 `EVEN` 宏定义中，必须在 `a` 周围加上括号，如下面的修正后的程序版本所示：\n\
  \n![Image](img/00963.gif)\n\n现在，`9+1` 在取模操作之前求值，得到的结果被正确地报告为偶数。通常情况下，在宏参数周围加上括号是一个好习惯，可以避免像刚才描述的那样的意料之外的问题。\n\
  \n使用宏替换代替真实函数有一个主要优点：由于宏替换代码是内联展开的，因此不会产生函数调用的开销，从而提高了程序的运行速度。然而，这种速度的提升可能以由于代码重复而导致程序体积增大为代价。\n\
  \n尽管在 C++ 代码中仍然很常见，但函数形式宏的使用已被 `inline` 饰符完全变得多余，后者能以更好、更安全的方式实现相同的目标。（记住，`inline`\
  \ 会导致函数被内联展开而不是被调用。）此外，`inline` 函数不需要大多数函数形式宏所需要的额外括号。然而，函数形式宏在未来的一段时间内几乎肯定仍会继续成为\
  \ C++ 程序的一部分，因为许多以前的 C 程序员由于习惯仍在继续使用它们。\n\n### #error\n\n当遇到 `#error` 指令时，它会强制编译器停止编译。该指令主要用于调试。该指令的一般形式为\n\
  \n```cpp\n#error error-message\n```\n\n注意 `error-message` 并不在双引号之间。当编译器遇到此指令时，它会显示错误消息和其他信息并终止编译。你的实现决定了实际上将显示哪些信息。（你可能想实验一下你的编译器以查看显示了什么。）\n\
  \n### #include\n\n`#include` 预处理器指令指示编译器将标准头文件或另一个源文件包含到包含 `#include` 指令的文件。标准头文件的名称应该包含在角括号之间，如书中各个程序所示。例如，\n\
  \n![Image](img/00964.gif)\n\n包含了文件 I/O 的标准头文件。\n\n包含另一个源文件时，其名称可以包含在双引号或角括号之间。例如，以下两个指令都指示\
  \ C++ 读取并编译名为 `sample.h` 的文件：\n\n![Image](img/00965.gif)\n\n在包含文件时，文件名是用引号还是角括号包含决定了如何进行对指定文件的搜索。如果文件名包含在角括号之间，编译器将在一个或多个实现定义的目录中搜索它。如果文件名包含在双引号之间，则编译器将在另一个实现定义的目录中搜索它，通常是当前工作目录。如果在该目录中未找到文件，则将重新搜索，就像文件名包含在角括号之间一样。由于搜索路径是由实现定义的，你可能需要检查编译器的用户手册以获取详情。\n\
  \n## 条件编译指令\n\n有几条指令允许你选择性地编译程序源代码的部分。这一过程被称为*条件编译*，被商业软件公司广泛使用，这些公司通常提供并维护一个程序的许多定制版本。\n\
  \n#### #if, #else, #elif, and #endif\n\n`#if` 指令背后的通用思想是，如果 `#if` 之后的常量表达式为真，则它与\
  \ `#endif` 之间的代码将被编译；否则，该代码将被跳过。`#endif` 用于标记 `#if` 块的结束。`#if` 的一般形式为\n\n```cpp\n\
  #if constant-expression\nstatement sequence\n#endif\n```\n\n如果常量表达式为真，则该代码块将被编译；否则，它将被跳过。例如：\n\
  \n![Image](img/00966.gif)\n\n此程序将在屏幕上显示消息，因为正如程序定义，`MAX` 大于 10。这个例子说明了一个重要的点。跟在\
  \ `#if` 之后的表达式是在*编译时求值的*。因此，它必须只包含之前定义的标识符和常量。不能使用任何变量。\n\n`#else` 指令的工作方式与 C++\
  \ 语言中的 `else` 语句非常相似：它在 `#if` 指令失败时建立一个备选方案。之前的例子可以扩展以包含 `#else` 指令，如下所示：\n\n![Image](img/00967.gif)\n\
  \n在此程序中，`MAX` 被定义小于 10，因此代码的 `#if` 部分没有编译，但 `#else` 备选部分被编译了。因此，显示消息 `Current memory\
  \ OK.`。\n\n注意，`#else` 被用于标记 `#if` 块的结束和 `#else` 块的开始。这是必要的，因为任何 `#if` 只能关联一个 `#endif`。\n\
  \n`#elif` 表示“else if”，用于为多个编译选项建立 if-else-if 阶梯。`#elif` 之后是一个常量表达式。如果该表达式为真，则该代码块被编译，并且不再测试或编译其他的\
  \ `#elif` 表达式。否则，将检查序列中的下一个。其一般形式为\n\n```cpp\n#if expression\nstatement sequence\n\
  #elif expression 1\nstatement sequence\n#elif expression 2\nstatement sequence\n\
  #elif expression 3 statement sequence\n//…\n#elif expression N\nstatement sequence\n\
  #endif\n```\n\n例如，此片段使用 `COMPILED_BY` 的值来定义是谁编译了程序：\n\n![Image](img/00968.gif)\n\
  \n`#if` 和 `#elif` 可以嵌套。在这种情况下，`#endif`、`#else` 或 `#elif` 与最近的 `#if` 或 `#elif` 关联。例如，以下是完全有效的：\n\
  \n![Image](img/00969.gif)\n\n#### #ifdef and #ifndef\n\n另一种条件编译方法使用 `#ifdef` 和 `#ifndef`\
  \ 指令，它们分别意味着“如果定义”和“如果未定义”，并引用宏名称。\n\n`#ifdef` 的一般形式为\n\n```cpp\n#ifdef macro-name\n\
  statement sequence\n#endif\n```\n\n如果 `macro-name` 之前在 `#define` 语句中已定义，则 `#ifdef`\
  \ 和 `#endif` 之间的语句序列将被编译。\n\n`#ifndef` 的一般形式为\n\n```cpp\n#ifndef macro-name\nstatement\
  \ sequence\n#endif\n```\n\n如果 `macro-name` 当前未被 `#define` 语句定义，则该代码块被编译。`#ifdef`\
  \ 和 `#ifndef` 都可以使用 `#else` 或 `#elif` 语句。**此外**，你可以像嵌套 `#if` 一样嵌套 `#ifdef` 和 `#ifndef`。\n\
  \n#### #undef\n\n`#undef` 指令用于移除之前定义的宏名称定义。其一般形式为\n\n```cpp\n#undef macro-name\n\
  ```\n\n考虑这个例子：\n\n![Image](img/00970.gif)\n\n在这里，`TIMEOUT` 和 `WAIT` 一直定义到遇到 `#undef`\
  \ 语句。`#undef` 的主要用途是允许宏名称局部化到只需要它们的代码部分。\n\n### 使用 defined\n\n除了 `#ifdef` 之外，还有另一种方法可以确定宏名称是否定义。你可以结合\
  \ `#if` 指令使用 `defined` 编译时运算符。例如，要确定宏 `MYFILE` 是否定义，你可以使用以下两个预处理命令之一：\n\n![Image](img/00970.gif)\n\
  \n或者\n\n![Image](img/00971.gif)\n\n\n\n\n\n你也可以在 `defined` 前面加上 `!` 来反转该条件。例如，只有当\
  \ `DEBUG` 未定义时，以下代码片段才会被编译：\n\n![Image](img/00972.gif)\n\n# #line\n\n`#line` 指令用于更改预定义宏名称\
  \ `__LINE__` 和 `__FILE__` 的内容。这两个是两个预定义的宏名称。`__LINE__` 包含当前正在编译的行号，而 `__FILE__`\
  \ 包含正在编译的文件名。`#line` 命令的基本形式为：\n\n`#line number \"filename\"`\n\n在这里，`number` 是任意正整数，可选的\
  \ `filename` 是任何有效的文件标识符。行号将变为当前源行的行号，文件名将变为源文件的名称。`#line` 主要用于调试和特殊应用。\n\n# #pragma\n\
  \n`#pragma` 指令是一个由实现定义的指令，它允许由编译器作者定义的各种指令传递给编译器。`#pragma` 指令的通用形式为：\n\n`#pragma\
  \ name`\n\n在这里，`name` 是你想要的 `#pragma` 名称。如果编译器无法识别该 `name`，则 `#pragma` 指令将被简单忽略，不会产生错误结果。\n\
  \n要查看你的编译器支持哪些 pragmas，请检查其文档。你可能会发现一些对你的编程工作非常有用的项。典型的 `#pragmas` 包括确定发布哪些编译器警告信息、如何生成代码以及链接哪个库的项。\n\
  \n# 的 # 和 ## 预处理器运算符\n\nC++ 支持两个预处理器运算符：`#` 和 `##`。这些运算符与 `#define` 结合使用。`#` 运算符使其其前的参数变成一个引用字符串。例如，考虑此程序：\n\
  \n![Image](img/00973.gif)\n\nC++ 预处理器将该行\n\n![Image](img/00974.gif)\n\n转换为\n\n![Image](img/00975.gif)\n\
  \n`##` 运算符用于连接两个标记符。这里有一个示例：\n\n![Image](img/00976.gif)\n\n预处理器将\n\n![Image](img/00977.gif)\n\
  \n转换为\n\n![Image](img/00977.gif)\n\n如果你觉得这些运算符看起来很奇怪，请记住，它们在大多数程序中并不需要或使用。它们存在的主要目的是允许预处理器处理某些特殊情况。\n\
  \n## 预定义宏名称\n\nC++ 规定了六个内置预定义宏名称。它们是：\n\n`__LINE__`\n\n`__FILE__`\n\n`__DATE__`\n\
  \n`__TIME__`\n\n`__STDC__`\n\n`__cplusplus`\n\n`__LINE__` 和 `__FILE__` 宏在讨论 `#line`\
  \ 时已经描述过。简而言之，它们包含了程序在编译时的当前行号和文件名。\n\n`__DATE__` 宏包含一个格式为 *月/日/年* 的字符串，即源文件翻译成目标代码的日期。\n\
  \n`__TIME__` 宏包含程序编译的时间。该时间用格式为 *小时:分:秒* 的字符串表示。\n\n`__STDC__` 的含义由实现定义。通常情况下，如果\
  \ `__STDC__` 被定义，则表示编译器遵循 C 标准。\n\n`__cplusplus` 宏定义了编译器支持的 C++ 标准。如果该宏未定义，则表示该编译器不是\
  \ C++ 编译器。\n\n# 附录 B：使用旧版本的编译器\n\n如果你在使用旧版本的编译器，你可能需要进行一些调整。现代 C++ 使用命名空间 `std`，但旧版本的编译器可能不支持。在旧版本中，所有标识符都在全局命名空间中。\n\
  \n为了在旧版本的编译器上工作，你可能需要进行以下更改：\n\n1.  使用旧版本的头文件（例如 `iostream.h` 而不是 `<iostream>`）。\n\
  2.  删除 `using namespace std;` 语句。\n\n例如，在旧版本的编译器中，代码可能写如下所示：\n\n```cpp\n#include\
