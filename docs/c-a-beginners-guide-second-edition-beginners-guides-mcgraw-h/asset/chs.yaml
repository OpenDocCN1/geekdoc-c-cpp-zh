  \ 关键技能 1.9 使用代码块\n\nC++ 的另一个关键元素是`代码块`。代码块是两个或多个语句的组合。这是通过将语句封装在左、右大括号之间完成的。一旦创建了代码块，它就变成了一个逻辑单元，可以用于任何单条语句可以使用的地方。例如，代码块可以作为\
  \ `if` 和 `for` 语句的目标。考虑这个 `if` 语句：\n\n![Image](img/00052.gif)\n\n在这里，如果 `w` 小于 `h`，则块内的两个语句都将被执行。因此，块内的两个语句形成了一个逻辑单元，如果一个语句不执行，另一个语句也无法执行。这里的关键点是，每当你需要逻辑上连接两个或多个语句时，都可以通过创建一个代码块来实现。代码块允许以更清晰、更高效实现许多算法。\n\
  \n这里是一个使用代码块防止除以零的程序：\n\n![Image](img/00053.gif)\n\n这里是示例运行：\n\n![Image](img/00054.gif)\n\
  \n在这种情况下，`if` 语句的目标是一个代码块，而不仅仅是单条语句。如果控制 `if` 的条件为真（如示例运行所示），则块内的三个语句将被执行。尝试对除数输入\
  \ 0 并观察结果。在这种情况下，块内的代码被跳过。\n\n正如你将在书后的部分看到的，代码块具有额外的属性和用途。然而，它们存在的主要原因是创建逻辑上不可分割的代码单元。\n\
  \n### 专家问答\n\n**Q: 使用代码块会引入任何运行时效率的下降吗？换句话说，在程序执行期间，`{` 和 `}` 会消耗额外时间吗？**\n\n**A:**\
  \ 不会。代码块不会增加任何开销。事实上，由于它们能够简化某些算法的编码，它们的使用通常会提高速度和效率。\n\n### 分号与位置\n\n在 C++ 中，分号表示语句的结束。这意味着，每条单独的语句都必须以分号结尾。如你所知，块是一组被大括号包围的逻辑连接的语句。块*不是*以分号终止的。由于块是语句的组，每条语句后都有分号，因此块不以分号结束是有意义的；相反，块的结束由右大括号指示。\n\
  \nC++ 不将行尾识别为语句的结束——只有分号会终止语句。出于这个原因，你将语句放在行的任何位置并不重要。例如，对于 C++ 来说，\n\n![Image](img/00055.gif)\n\
  \n等同于\n\n![Image](img/00056.gif)\n\n此外，语句的各个元素也可以放在单独的行。例如，以下写法是完全可以的：\n\n![Image](img/00057.gif)\n\
  \n以这种方式断开长行通常用于增加程序的可读性。它还可以帮助防止过长的行自动换行。\n\n#### 缩进规范\n\n你可能在之前的示例中注意到某些语句被缩进了。C++\
  \ 是一种自由格式的语言，这意味着在同一行内将语句相对于相对于彼此的位置并不重要。然而，多年来，形成了一种通用且接受的缩进风格，使得程序具有很的可读性。本书遵循这种风格，并建议你也这样做。使用这种风格，在每个左大括号后缩进一级，在每个右大括号后向回移动一级。某些语句会鼓励进行额外的缩进；这些将在稍后介绍。\n\
