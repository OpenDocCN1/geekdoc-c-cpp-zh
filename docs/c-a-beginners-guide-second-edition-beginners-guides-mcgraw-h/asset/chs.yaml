  \ `f()` 返回 `val` 的引用，该引用变成了赋值语句的目标。因此，`val` 的值被改为 99.1。这里有一个使用返回类型的示例程序：\n\n![Image](img/00434.gif)\n\
  \n![Image](img/00435.gif)\n\n该程序显示以下输出：\n\n![Image](img/00436.gif)\n\n让我们看看如何实现。`change_it()`\
  \ 函数声明为返回 `double` 的引用。具体来说，它返回 `vals` 元素的引用。\n\n![Image](img/00437.gif)\n\n在 `f()`\
  \ 中，局部变量 `i` 将在函数返回时超出作用域。因此，`f()` 返回的 `i` 的引用是未定义的。实际上，某些编译器将因为这个原因而不编译 `f()`。\n\
  \n## 关键技能 6.6 独立引用\n\n尽管引用引入 C++ 主要是为了支持引用参数传递和作为返回类型，但也可以声明独立的引用变量。这被称为独立引用。然而，必须说明，非参数引用变量很少使用，因为它们往往会让程序产生混乱。在考虑到这些的情况下，我们在这里简要介绍它们。\n\
  \n独立引用必须指向某个对象。因此，独立引用在声明时必须初始化。通常这意味着它将被赋值为之前声明的变量的地址。一旦完成，引用变量的名字就可以在其所引用的任何地方使用。事实上，两者之间几乎没有区别。例如，考虑所示的程序：\n\
  \n![Image](img/00438.gif)\n\n该程序显示以下输出：\n\n![Image](img/00439.gif)\n\n引用变量指向的地址是固定的；不能更改。因此，当评估语句\n\
  \n![Image](img/00440.gif) 时，复制到 `j`（由 `i` 引用）的是 `k` 的值，而不是它的地址。\n\n#### 使用引用时的一些限制\n\
  \n引用变量存在一些限制：\n\n![Image](img/00157.jpeg) 你不能引用引用变量。\n\n![Image](img/00157.jpeg)\
  \ 你不能创建引用数组。\n\n\n\n\n![Image](img/00157.jpeg) 你不能创建一个引用的指针。也就是说，你不能对引用应用 `&` 运算符。\n\
  \n#### ![Image](img/00003.jpeg) **进度检查**\n\n- **1**. 函数可以返回引用吗？\n- **2**. 什么是独立引用？\n\
  - **3**. 你可以创建一个对引用的引用吗？\n\n## 关键技能 6.7 函数重载\n\n在本节中，你将学习 C++ 最令人兴奋的特性之一：函数重载。在\
  \ C++ 中，只要参数声明不同，两个或多个函数就可以共享相同的名称。在这种情况下，共享相同的函数被称为*重载*（overloaded），这一过程被称为*函数重载*（function\
  \ overloading）。函数重载是 C++ 实现多态的一种方式。\n\n通常，要重载一个函数，只需声明它的不同版本即可。编译器会处理其余工作。你必须观察一个重要的限制：每个重载函数的参数类型和/或数量必须不同。仅两个函数在返回类型上不同是不够的。它们必须在参数的类型或数量上有所不同。（在所有情况下，返回类型并不能为\
  \ C++ 决定使用哪个函数提供足够的信息。）当然，重载函数在返回类型上也可以不同。当调用重载函数时，将执行参数与参数匹配的那个函数版本。\n\n让我们从一个短的示例程序开始：\n\
  \n![Image](img/00441.gif)\n![Image](img/00442.gif)\n\n该程序产生以下输出：\n\n![Image](img/00443.gif)\n\
  \n如你所示，`f()` 被重载了三次。第一个版本接受一个整数参数，第二个版本需要两个整数参数，而第三个版本有一个 `double` 参数。由于每个版本的参数列表是不同的，编译器能够根据调用时指定的参数类型调用每个函数的正确版本。\n\
  \n为了理解函数重载的价值，请考虑一个名为 `neg()` 的函数，它返回参数的取反值。例如，当用值 −10 调用时，`neg()` 返回 10。当用 9 调用时，它返回\
  \ −9。如果没有函数重载，如果你想为 `int`、`double` 和 `long` 类型的数据创建取反函数，你需要三个不同的函数，每个函数都有一个不同的名称，例如\
  \ `ineg()`、`lneg()` 和 `fneg()`。然而，通过使用函数重载，你可以使用一个名称（如 `neg()`）来引用所有返回参数取反值的函数。因此，重载支持“一种接口，多种方法”的多态概念。下面的程序演示了这一点：\n\
  \n![Image](img/00444.gif)\n![Image](img/00445.gif)\n\n输出所示：\n\n![Image](img/00446.gif)\n\
  \n该程序创建了三个相似但不同的函数，名为 `neg`，每个函数都返回其参数的绝对值。由于参数的类型，编译器知道在给定的情况下应该使用哪个函数。\n\n重载的价值在于，它允许使用通用名称访问相关的函数集。因此，名称\
  \ `neg` 代表正在执行的*通用操作*。让编译器为特定情况选择正确的*特定*版本即可。你，作为程序员，只需要记住正在执行的通用操作。因此，通过多态的应用，三件需要记忆的事情减少了一个。虽然这个例子相当简单，但如果你扩展这个概念，你就会看到重载如何帮助你管理更大的复杂性。\n\
  \n函数重载的另一个优势是可以定义相同函数的略有不同版本，这些版本针对它们操作的数据类型进行了专门处理。例如，考虑一个名为 `min()` 的函数，它确定两个值中的最小值。可以创建\
  \ `min()` 版本，使其对不同的数据类型产生不同的行为。比较两个整数时，`min()` 返回最小的整数。比较两个字符时，`min()` 可以返回字母表中顺序靠前的字母，忽略大小写差异。在\
  \ ASCII 序列中，大写字母的值比小写字母小 32。因此，在字母排序时，忽略大小写将很有用。比较两个指针时，可以让 `min()` 比较指针指向的值，并返回指向最小值的指针。这里是实现这些\
  \ `min()` 版本的程序：\n\n![Image](img/00447.gif)\n![Image](img/00448.jpeg)\n\n这里是程序产生的输出：\n\
  \n![Image](img/00449.gif)\n\n当你重载一个函数时，该函数的每个版本都可以执行你所要求的任何活动。也就是说，没有规则规定重载函数之间必须相互关联。然而，从风格的角度来看，函数重载暗示了一种关系。因此，虽然你可以使用相同的名称来重载不相关的函数，但你不应该这样做。例如，你可以使用名称\
  \ `sqr()` 创建返回 `int` 的*平方*和 `double` 的*平方根*的函数。然而，这两种操作从根本上是不同的，以这种方式应用函数重载将违背了它的初衷。（事实上，以这种方式编程被认为是不良风格！）在实践中，你应该只重载相关的操作。\n\
  \n#### 自动转换与重载\n\n正如你在模块 2 中回忆的那样，C++ 提供了某些自动转换。这些转换也适用于重载函数的参数。例如，考虑以下内容：\n\n![Image](img/00450.gif)\n\
  ![Image](img/00451.gif)\n\n程序的输出所示：\n\n![Image](img/00452.gif)\n\n在这个示例中，只定义了两个\
  \ `f()` 版本：一个有一个 `int` 参数，另一个有一个 `double` 参数。然而，可以给 `f()` 传递一个 `short` 或 `float`\
  \ 值。在 `short` 的情况下，C++ 自动将其转换为 `int`。因此，调用了 `f(int)`。在 `float` 的情况下，值被转换为 `double`\
  \ 并调用了 `f(double)`。\n\n然而，重要的是，自动转换仅在参数和参数之间没有直接匹配时才适用。例如，这里是之前的程序增加了一个指定 `short`\
  \ 参数的 `f()` 版本：\n\n![Image](img/00453.gif)\n![Image](img/00454.gif)\n\n现在运行程序时，产生了以下输出：\n\
  \n![Image](img/00455.gif)\n\n在这个版本中，由于存在接受 `short` 参数的 `f()` 版本，当用 `short` 值调用 `f()`\
  \ 时，调用了 `f(short)`，没有发生到 `int` 的自动转换。\n\n#### ![Image](img/00003.jpeg) **进度检查**\n\
  \n- **1** 当函数被重载时，必须满足什么条件？\n- **2** 为什么重载函数应该执行相关的操作？\n- **3** 函数的返回类型是否参与重载决议？\n\
