  \ 的作用是什么？\n\n**3**. 使用哪个函数来设置填充字符？\n\n### 关键技能 11.5 使用 I/O 操纵符\n\nC++ I/O 系统包含了另一种改变流的格式参数的方法。这种方法使用被称为*操纵符*（manipulators）的特殊函数，这些函数可以包含在\
