  \ 默认链接到哪个设备？\n- **[3]**. 如何输出一个换行？\n\n### 关键技能 1. 两种控制语句\n\n在函数内部，执行从一个语句到下一个语句，从上到下。然而，可以通过各种控制语句改变这种流程。虽然我们稍后会详细研究控制语句，但这里介绍了两种。\n\
  \n## if 语句\n\n你可以通过 C++ 的条件语句 `if` 来选择性地执行程序的部分。`if` 语句的工作类似于任何语言中的 if 语句。其简单的形式所示：\n\
  \n```cpp\nif (condition) statement\n```\n\n其中 `condition` 是一个求值为真或假的表达式。在 C++ 中，真为非零，假为零。如果条件为真，则执行语句。如果为假，则不执行语句。例如，以下片段会在屏幕上显示\
  \ **10 小于 11**，因为 10 小于 11。\n\n![Image](img/00043.gif)\n\n然而，考虑以下内容：\n\n![Image](img/00044.gif)\n\
