  \ 找到。\n\n## 3 模块程序控制语句\n\n### 关键技能\n\n**3.1**. 掌握 `if` 语句的完整形式。\n\n**3.2**. 使用 `switch`\
  \ 语句。\n\n**3.3**. 掌握 `for` 循环的完整形式。\n\n**3.4**. 使用 `while` 循环。\n\n**3.5**. 使用 `do-while`\
  \ 循环。\n\n**3.6**. 使用 `break` 退出循环。\n\n**3.7**. 使用 `continue` 语句。\n\n**3.8**. 利用嵌套循环。\n\
  \n**3.9**. 应用 `goto` 语句。\n\n\n\n\n\n本模块讨论了控制程序执行流的语句。程序控制语句分为三类：*选择*语句，包括 `if` 和\
  \ `switch`；*迭代*语句，包括 `for`、`while` 和 `do-while` 循环；以及*跳转*语句，包括 `break`、`continue`、`return`\
  \ 和 `goto`。除了本书中稍后讨论的 `return` 之外，其余的控制语句（包括你已经简要介绍过的 `if` 和 `for` 语句）都将在这里进行检查。\n\
  \n### 关键技能 3.1 if 语句\n\n`模块 1` 引入了 `if` 语句。现在是时候详细检查它了。`if` 语句的完整形式为：\n\n```\nif(expression)\
  \ statement;\nelse statement;\n```\n\n其中 `if` 和 `else` 的目标是单个语句。`else` 子句是可选的。`if`\
  \ 和 `else` 的目标也可以是语句块。使用语句块的 `if` 通般形式为：\n\n![Image](img/00144.gif)\n\n如果条件表达式为真，则执行\
  \ `if` 的目标；否则，如果存在 `else`，则执行 `else` 的目标。两者永远不会同时被执行。控制 `if` 的条件表达式可以是任何产生真或假结果的有效\
  \ C++ 表达式类型。\n\n接下来的程序通过玩一个简单版本的“猜魔法数字”游戏演示了 `if`。该程序生成一个随机数，提示你进行猜测，如果你猜中了魔法数字，则打印消息\
  \ **Right**（正确）。该程序还引入了另一个 C++ 库函数，用作 `rand()`，它返回一个随机选整数值。它需要 `<cstdlib>` 头文件。\n\
  \n![Image](img/00145.gif)\n\n该程序使用 `if` 语句来判断用户的猜测是否与魔法数字匹配。如果匹配，则在屏幕上打印该消息。\n\n\
  进一步完善“猜魔法数字”程序，下一个版本使用 `else` 在选错数字时打印一条消息：\n\n![Image](img/00146.gif)\n\n## 条件表达式\n\
  \n有时，C++ 的初学者会被任何有效的 C++ 表达式都可以用于控制 `if` 这一事实所困扰。也就是说，条件表达式不需要仅限于那些涉及关系运算符和逻辑运算符的表达式，也不限于\
  \ `bool` 类型的的操作数。唯一的要求是控制表达式求值为真或假结果。正如你从上一个模块中记得的，值 0 会自动转换为 `false`，而所有非零值都转换为\
  \ `true`。因此，任何产生 0 或非零值的表达式都可以用于控制 `if`。例如，此程序从键盘读取两个整数并显示商。为了避免除以零的错误，使用了由第二个数字控制的\
  \ `if` 语句。\n\n![Image](img/00147.gif)\n\n这里是两个示例运行：\n\n![Image](img/00148.gif)\n\
  \n注意，使用 `if(b)` 测试了 `b`（除数）是否为 0。这种方法有效是因为当 `b` 为 0 时，控制 `if` 的条件为假，从而执行 `else`。否则，条件为真（非零），并进行除法。没有必要像这里这样写这个\
  \ `if`（而且在许多 C++ 程序员看来这认为是不良好的风格）：\n\n![Image](img/00149.gif)\n\n这种形式的语句是冗余的，并且可能效率低下。\n\
  \n## 嵌套 if\n\n*嵌套 if* 是作为另一个 `if` 或 `else` 目标的 `if` 语句。嵌套 `if` 在编程中非常常见。关于 C++ 中嵌套\
  \ `if` 需要记住的主要点是：`else` 语句始终引用与 `else` 在同一个代码块内且尚未与 `else` 关联的最近 `if` 语句。这里有一个例子：\n\
  \n![Image](img/00150.gif)\n\n如注释所示，最后的 `else` 与 `if(j)` 关联（尽管它是最近的不带 `else` 的 `if`），因为它不在同一个代码块中。相反，最后的\
  \ `else` 与 `if(i)` 关联。内部的 `else` 与 `if(k)` 关联，因为那是最近的 `if`。\n\n你可以使用嵌套的 `if` 为“猜魔法数字”程序添加进一步的改进。这个添加为玩家提供了关于猜测错误的反馈。\n\
  \n![Image](img/00151.gif)\n\n![Image](img/00152.gif)\n\n#### if-else-if 阶梯\n\n基于嵌套\
  \ `if` 的常见编程结构是 `if-else-if` 阶梯，也称为 `if-else-if` 楼梯。它看起来如下：\n\n![Image](img/00153.gif)\n\
  \n条件表达式从上到下求值。一旦发现真条件，就会执行与其关联的语句，并跳过阶梯的部分。如果没有任何条件为真，将执行最后的 `else` 语句。最后的 `else`\
  \ 经常充当默认条件；也就是说，如果所有其他条件测试失败，则执行最后一个 `else` 语句。如果没有最后的 `else` 且所有其他条件为假，则不会发生任何操作。\n\
  \n以下程序演示了 `if-else-if` 阶梯：\n\n![Image](img/00154.gif)\n\n程序产生如下输出：\n\n![Image](img/00155.gif)\n\
  \n你可以看到，只有当之前的 `if` 语句都不成功时，才会执行默认 `else`。\n\n![Image](img/00003.jpeg) 进度检查\n\n\
  **1** 控制 `if` 的条件必须使用关系运算符。真还是假？\n\n**2** `else` 总是关联哪个 `if`？\n\n**3** 什么是 `if-else-if`\
  \ 阶梯？\n\n## 关键技能 3.2 switch 语句\n\nC++ 选择语句的第二个是 `switch`。`switch` 用于多分支。因此它允许程序在多种方案中进行选择。虽然一系列嵌套的\
  \ `if` 语句可以执行分支测试，但在许多情况下 `switch` 是一种更有效的方法。它的原理如下：表达式的值与一系列常量进行测试。一旦找到匹配，执行与其关联的语句。`switch`\
  \ 语句的一般形式为：\n\n![Image](img/00156.gif)\n\n`switch` 表达式求值为字符或整数。（例如，不允许浮点数表达式）。通常，控制\
  \ `switch` 的表达式简单是一个变量。`case` 常量必须是整数或字符字面量。\n\n如果没有找到匹配，则执行 `default` 语句序列。`default`\
  \ 是可选的；如果不存在，当所有匹配失败时不会发生任何操作。找到匹配后，执行与该 `case` 关联的语句，直到遇到 `break` 或者在结尾 `case`\
  \ 或 `default` 语句中直到 `switch` 结束。\n\n关于 `switch` 语句有四点重要的知识：\n\n![Image](img/00157.jpeg)\
  \ `switch` 与 `if` 的区别在于，`switch` 只能测试相等性（即测试 `switch` 表达式与 `case` 常量之间的匹配），而 `if`\
  \ 条件表达式可以是任何类型。\n\n![Image](img/00157.jpeg) 同一个 `switch` 中的没有两个 `case` 常量具有相同的值。当然，嵌套在外部\
  \ `switch` 中的 `switch` 语句可以具有相同的 `case` 常量。\n\n![Image](img/00157.jpeg) `switch`\
  \ 语句通常比嵌套的 `if` 更高效。\n\n\n\n\n\n![Image](img/00157.jpeg) 与每个 `case` 相关的语句序列*不是*块。然而，整个\
  \ `switch` 语句*确实*定义了一个块。随着你学习更多 C++ 知识，这一点将变得显而易见。\n\n下面的程序演示了 `switch`。它要求输入一个\
  \ 1 到 3 之间（包含边界）的数字。然后显示与该数字相关的格言。任何其他数字都会导致显示错误信息。\n\n![Image](img/00158.jpeg)\n\
  \n这里是两次运行示例：\n\n![Image](img/00159.gif)\n\n从技术上讲，`break` 语句是可选的，尽管大多数 `switch` 应用都会使用它。在\
  \ `case` 的语句序列中遇到 `break` 时，`break` 语句会导致程序流退出整个 `switch` 语句，并在 `switch` 外部的下一个语句继续。然而，如果\
  \ `break` 语句没有结束与 `case` 相关的语句序列，那么匹配的 `case` **及其及下方**的所有语句都将执行，直到遇到 `break`（或\
  \ `switch` 的结束）。例如，请仔细研究以下程序。你能猜出它会在屏幕上显示什么吗？\n\n![Image](img/00160.gif)\n\n该程序显示以下输出：\n\
  \n![Image](img/00161.gif)\n\n正如该程序所示，如果没有 `break` 语句，执行将继续进入下一个 `case`。\n\n你可以拥有空\
  \ `cases`，如此示例所示：\n\n![Image](img/00162.gif)\n\n在此片段中，如果 `i` 的值为 1、2 或 3，则显示消息\n\
  \n![Image](img/00163.gif)\n\n如果它是 4，则显示\n\n![Image](img/00164.gif)\n\n如此示例所示，这种\
  \ `case` 的“堆叠”在多个 `case` 共享公共代码时非常常见。\n\n## 嵌套 switch 语句\n\n可以将一个 `switch` 作为外层\
  \ `switch` 语句序列的一部分。即使内部和外部 `switch` 的 `case` 常量包含相同的值，也不会产生冲突。例如，以下代码片段是完全允许的：\n\
