  \ 0。\n\n程序末尾的大括号正式结束了程序。\n\n## 处理语法错误\n\n如果你还没有这样做，请输入、编译并运行前面的程序。正如你从之前的编程经验中可能知道的，向计算机输入代码时很容易输入错误。幸运的是，如果你在程序中输入了错误内容，编译器在尝试编译时会报告*语法错误*（syntax\
  \ error）消息。大多数 C++ 编译器都会尝试对你所写的任何内容理解其意义。因此，报告的错误并不总是反映问题的实际原因。例如，在前面的程序中，意外漏掉 `main()`\
  \ 之后的大括号可能会导致编译器将 `cout` 语句报告为语法错误的来源。当你收到语法错误消息时，准备好查看程序中的最后几行代码以找到错误。\n\n### 专家问\n\
  \n**问：除了错误消息外，我的编译器还提供了几种警告消息。警告和错误之间有什么区别？我应该使用哪种报告类型？**\n\n\n\n\n\n# **A:** 除了报告致命语法错误外，大多数\
  \ C++ 编译器还可以报告几种类型的警告信息。错误信息报告程序中明确存在错误的内容，例如遗漏分号。警告则指出虽然可疑但在技术上是正确的代码。然后由你，作为程序员，来判断这种疑虑是否合理。\n\
  \n警告还用于报告诸如低效率的结构或对过时特性的使用。通常情况下，你可以选择想要看到的特定类型的警告。书中的程序符合标准 C++ 标准，当输入正确时，它们不会产生任何令人困扰的警告信息。\n\
  \n对于书中的示例，你可能希望使用编译器的默认（或“正常”）错误报告。然而，你应该查看编译器的文档，看看你那里可以使用哪些选项。许多编译器具有复杂的功能，可以帮助你在错误变成大问题之前发现细微错误。理解编译器的错误报告系统是值得投入时间和精力的。\n\
