  \n### 关键技能 2.2 字面量：\n\n字面量是指固定的、人类可读的、不能被程序更改的值。例如，值 101 是整数字面量。字面量也被称为*常量*。在大多数情况下，字面量及其用法是非常直观的，因此之前所有的示例程序都已以某种形式使用过它们。现在是时候正式地解释它们了。\n\
  \nC++ 字面量可以是任何基本数据类型。每个字面量的表示方式取决于它的类型。正如之前解释的，`character` 字面量被包含在单引号之间。例如，‘a’ 和\
  \ ‘%’ 都是字符字面量。\n\n`Integer` 字面量指定为没有小数部分的数字。例如，10 和 `-100` 是整数常量。`Floating-point`\
  \ 字面量需要使用小数点后跟数字的小数部分。例如，11.123 是一个浮点常量。C++ 还允许你使用科学计数法来表示浮点数。\n\n所有字面量值都有一个数据类型，但这一事实引发了一个问题。如你所知，有几种不同的整数类型，如\
  \ `int`、`short int` 和 `unsigned long int`。还有三种不同的浮点类型：`float`、`double` 和 `long double`。问题是：编译器如何确定字面量的类型？例如，123.23\
  \ 是 `float` 还是 `double`？这个问题的答案包含两个部分：首先，C++ 编译器会自动对字面量的类型做出某些假设；其次，如果你愿意，可以显式地指定字面量的类型。\n\
  \n默认情况下，C++ 编译器会将整数字面量适配到容纳它的最小兼容数据类型中，从 `int` 开始。因此，假设整数是 16 位的，10 默认是 `int`，但\
  \ 103,000 是 `long`。即使值 10 可以放入 `char` 中，编译器也不会这样做，因为这意味着跨越了类型边界。\n\n在默认情况下，浮点字面量被假设为\
  \ `double`。因此，值 123.23 的类型是 `double`。\n\n对于你作为初学者编写的几乎所有程序，编译器的默认设置都完全足够。在 C++ 对数值字面量的默认假设不是你想要的情况下，C++\
  \ 允许你通过使用后缀来指定数值字面量的精确类型。对于浮点类型，如果你在数字后面跟着一个 `F`，则该数字被视为 `float`。如果后面跟着一个 `L`，该数字就变成\
  \ `long double`。对于整数类型，`U` 后缀代表 `unsigned`（无符号），`L` 代表 `long`（长）。（必须使用 `U` 和 `L`\
  \ 来指定 `unsigned long`）。这里是一些示例：\n\n![Image](img/00092.gif)\n\n#### 十进制和八进制字面量\n\n\
  你可能已经知道，在编程中，有时使用基于 8 或 16 的进位比基于 10 更简单。基于 8 的进位称为*八进制*，它使用 0 到 7 的数字。在八进制中，数字\
  \ 10 等于十进制的 8。基于 16 的进位称为*十六进制*，使用数字 0 到 9 加上字母 A 到 F，这些字母分别代表 10, 11, 12, 13, 14\
  \ 和 15。例如，十六进制的 10 等于十进制的 16。由于这两个数字系统的频率很高，C++ 允许你用十六进制或八进制指定整数字面量而不是十进制。十六进制字面量必须以\
  \ `0x` 开头（零后面跟着 x）。八进制字面量以零开头。这里是一些示例：\n\n![Image](img/00093.gif)\n\n#### 字符串字面量\n\
  \n除了预定义数据类型外，C++ 还支持另一种类型的字面量：字符串。*字符串*是一组被双引号括起来的字符。例如，“this is a test”就是一个字符串。你在之前的示例程序的某些\
  \ `cout` 语句中见过字符串的示例。记住一个重要的事实：虽然 `string` 不是内置类型，但它是可以使用的。\n\n#### 字符转义序列\n\n将字符括在单引号内适用于大多数字符，但某些字符（如单引号和双引号）具有特殊含义。由于这些原因，C++\
