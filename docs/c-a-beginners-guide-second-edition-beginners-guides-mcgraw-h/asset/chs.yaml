  \ `class` 声明内部声明吗？\n\n**3**。什么是访问器函数？\n\n## 项目 8-2 创建队列类\n\n`Queue.cpp`\n\n如你所知的，`data\
  \ structure`（数据结构）是组织数据的手段。简单的数据结构是 `array`（数组），它是一个支持对元素随机访问的线性列表。数组通常用作更复杂数据结构（如栈和队列）的基础。`stack`（栈）是一个元素只能按后进先出（FILO）顺序访问的列表。`queue`（队列）是一个元素只能按先入后出（FIFO）顺序访问的列表。因此，栈就像桌子上的一叠盘子；先放进去的最后被使用。队列就像银行的排队；先排队的先被服务。\n\
