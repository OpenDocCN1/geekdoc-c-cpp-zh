  - 7 和 8 表示数据中的低频趋势。图表边缘报告的百分比衡量了 Mayport 时间序列中总方差（离均值值）被特定向量解释的部分。相关三元组解释的偏差分别为：配对
    (1,2) 为 39.27% = 19.68% + 19.59%，配对 (3,4) 为 17.73% = 8.87% + 8.86%，配对 (5,6) 为
    5.65% = 2.83% + 2.82%。特征三元组 7 和 8（代表趋势）解释的偏差为 5.16% = 2.68% + 2.48%。这些组共同占了观测数据总方差的
    67.81%，远超过了一半。
