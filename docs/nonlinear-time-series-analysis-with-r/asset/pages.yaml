    \ $\\alpha$ is the value of the angle $\theta$ at time $t=0$. It is possible to\
    \ choose the origin of the axes such that $\\alpha=0$, and since $y(t)=dx/dt$,\
    \ the solution is then\n\n> $$\\begin{aligned} x(t) &= c\\cos(\\omega t) \\ \\\
    frac{y(t)}{\\omega} &= -c\\sin(\\omega t) \\end{aligned} (3.3)$\n\nThe constant\
    \ $c$ represents the amplitude of oscillation, i.e. the maximum value taken by\
    \ the angle $\theta$ ($A$ in Figure 3.2a).\n\nFigure 3.2b represents the time\
    \ evolution of the system in phase space. Clearly, the trajectory of the representative\
    \ point in phase space is no means same as the trajectory described by the bob\
    \ in real.\nFigure 3.3 shows the beginning of the trajectory in phase space with\
    \ integration $\\Delta t=0.1$, where $\\Delta t$ is step in the code $pend\\_id\\\
    _s\\_o.R$. (In Figure 3.2, $\\Delta t=0.01$ and the points are joined by line).\
    \ At $t=t_0=0$, the starting point is in $(1,1)$; after the integration step $0.1$\
    \ (i.e. at $t=t_0+0.1$), the representative point is at $(1.137, 0.687)$; at $t=t_0+0.2$,\
    \ the representative point is at $(1.137, 0.353)$; and so on. In this way, the\
    \ trajectory in phase space is constructed. Thus, at any step, we can know the\
    \ exact state, angle and angular velocity of the system. Why does such a trajectory\
    \ turn out to be an ellipse? The answer is easy: we can write eqn (3.3) as\n\n\
    ```\n$x^2(t) + \\frac{y^2(t)}{\\omega^2} = c^2\\cos^2(\\omega t) + c^2\\sin^2(\\\
    omega t) = constant$$\n```\n\nwhich is the equation of an ellipse."
