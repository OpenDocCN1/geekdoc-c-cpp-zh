  md: '# Surrogate Test 131


    surrogate, we estimate a suitable quantity, which for the observed data could
    be significantly different from that of the surrogates. If this is the case, then
    the null hypothesis of linearity is rejected: it is very unlikely that the original
    time series was generated by a Gaussian linear process. But if the statistic for
    the original series falls within the distribution of the results for the surrogates,
    we are not allowed to say that the null hypothesis is correct. The only thing
    we can do at this stage is to not reject H0. We could find a different discriminating
    statistic capable of distinguishing the original data and surrogates. The use
    of different discriminating statistics is therefore suggested, since there may
    be situations where a single discriminating statistic is not sufficient (Kugiumitzis,
    2001).


    In the R package nonlinearSeries the surrogateTest executes surrogate testing.
    The null hypothesis is that the observed series is generated by a linear stochastic
    process. Then it must be symmetric under time reversal. If the original data show
    a deviation from the distribution of the surrogates, then the hypothesis of linearity
    is to be rejected


    Theiler et al. (1992) discuss different methods for generating surrogates. For
    instance, surrogates can be obtained by randomizing the phases of the Fourier
    transform of the original series. In this manner the original mean and periodogram
    are preserved, but any further information is lost.


    We must pay attention to the selected discriminating statistic when we wish to
    investigate whether the dynamics are chaotic. There are several methods for the
    estimation of invariants, although not all of these are necessarily suitable to
    work as a discriminating statistic.


    We discuss a method to generate surrogates that are based on an algorithm developed
    by scientists in the construction of the first H-bomb: N. C. Metropolis, A. W.
    Rosenbluth, M. N. Rosenbluth, A. M. Harkanyi Teller and E. Teller. This algorithm
    is now called the Metropolis algorithm, or the M(RT) algorithm with reference
    to the initial letters of the authors'' names (Metropolis et al., 1953).


    Let x be a point of the phase space of the system. The state xi is derived from
    a suitable transition probability pj. This transition probability must be such
    that as the length of the sequence tends to infinity, the probability of the occurrence
    of the state x is given by the so-called Boltzmann probability distribution P{x}
    exp[-E(x)/kT], where E(x) is the energy of the state x and k is Boltzmann''s constant.


    In practice, suppose that the system is in the state xi with energy E(xi). A new
    state xj is proposed by changing xi via random numbers. The state xj is accepted
    with probability α(xi,xj)=min{1,exp[|E(xj)-E(xi)|/kT]}. In other words, if E(xj)≤
    E(xi), the new state xj is always accepted; if E(xj)>E(xi), it is accepted with
    a zero probability. If xj is rejected, then the current xi is counted as a ''new
    configuration''.


    We introduce a procedure, called simulated annealing, that consists of running
    the Metropolis algorithm more than once, lowering the temperature each time. In
    metallurgy, annealing is a process in which metal is heated and then cooled slowly,
    to bring it closer to its equilibrium state. Such a process can be simulated by'
