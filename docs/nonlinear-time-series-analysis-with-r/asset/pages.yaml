  md: '# Correlation Dimension 105


    of small segments increases, but their length decreases. The self-similarity property
    is clear: at the $nth$ iteration $(n \gg 1)$ we observe ‘with a microscope’ any
    tiny part of the figure, we always find the same scheme: two segments of equal
    length separated by a distance of same length. The geometrical figure thus created,
    the middle-third Cantor set, is formally defined as


    ```

    $C = \lim_{n\to\infty} I_n = \bigcap_{n=0}^{\infty} I_n$

    ```


    The set $C$ is the set of points that belong to all $I_n$, $\forall n$.

    At first sight, the Cantor set exhibits somewhat odd properties. What remains
    at ‘end’ of all the iterations? Summing the lengths of the removed segments, we
