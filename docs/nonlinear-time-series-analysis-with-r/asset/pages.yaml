    a jacket from a very small box. From the top of the box, we select two neighbours
    points and mark them. We then unpack the jacket and lay it flat. The marked neighbours
    need not remain close together on the unfolded jacket, and may even be on opposite
    sleeves.


    In the FNN method, one starts with a small $m$, even $m = 1$, and counts the numbers
    of neighbours of a point along the observed series. If the embedding dimension
    $m$ is increased from $m$ to $m + 1$, many of the previous neighbours will no
    longer be neighbours; they will be $false$ neighbours. In this way, one finds
    the estimated minimum embedding dimension $m$ when (almost) all the neighbours
    are real. The FNN method is implemented in `tseriesChaos` with the code `false.nearest`.
    We add the following instructions to the code lorenz_attractor.R:


    ```

    require(tseriesChaos)

    m.max<- 6 # embedding dimensions: from 1 to m_max

    tw<- 100 # tentative time delay (see below)

    rt<- 10 # escape factor

    eps<- sd(x)/10 # neighbourhood diameter

    fn <- false.nearest(x,m,d,tw,rt,eps)

    plot(fn)

    ```


    The following parameters are selected:


    +   * m.max: the embedding dimension ranges from $m = 1$ to $m.max = 6$.

    * d: a tentative time delay $d$; we shall see how to estimate it in the following
    discussion.

    * tw: Theiler window; points separated by less than $tw$ in the series $x$ are
    excluded from the searching neighbours. For this subject, see Section 3.4.5

    * rt: escape factor; this is a factor for escaping from the neighbourhood.

    * eps: taking a point along the observed series as the centre of a diameter $eps$,
    all the points inside this ball are considered neighbours, no whether they are
    real or false. Here $eps$ is selected as $sd(x)/10$, where $sd(x)$ is the standard
    deviation of series $x$.


    It should be noted that the reference manual `tseriesChaos.pdf` comes with the
