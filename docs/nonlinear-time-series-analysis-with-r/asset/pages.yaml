    \ Are there further ways to do this? The answer is affirmative and will bring\
    \ us face to face with the fundamental notion of ergodic of dynamical systems.\
    \ We see one of the most important features of chaos: the dynamics of an individual\
    \ trajectory is highly unstable – the unpredictability of chaotic systems – but,\
    \ from a statistical perspective, some of predictability can emerge, even for\
    \ a single trajectory.\n\nThe interval [0,1] is divided into $N$ subintervals\
    \ $I_k$,\n\n$I_k = [(k-1)/N, k/N], \\ k=1,\\dots,N$\n\nand the number $m_k$ of\
    \ iterates in each interval $I_k$ is computed with Code 2.7 Logistic map: Density,\
    \ a slight variant of Code 2.3.\n\n```\n#Code 2.7 Density of the logistic map,\
    \ 1 trajectory\nf.x(x,r){\n    r*=x*(1-x)\n##### function to compute the time\
