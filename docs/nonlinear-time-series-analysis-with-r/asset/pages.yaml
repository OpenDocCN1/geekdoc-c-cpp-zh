    dynamical structures (such as nonlinear deterministic dynamics) in play.


    Surrogate data testing is an application of the bootstrapping resampling method
    from statistics (Efron, 1979). Appendix B further acquains readers with this important
    method.


    # 7.3 Surrogate Types


    We discuss three algorithms for generating surrogates that test data for various
    types of linear stochastic dynamics, as well as the associated null hypotheses
    tested (Small and Tse, 2003).


    # 7.3.1 Algorithm 1 Surrogates


    If the data are Gaussian (i.e. observations are drawn from a normal distribution),
    Algorithm 1 tests the null hypothesis that the time series is driven by linear
    dynamics subjected to Gaussian noise inputs:


    ```

    x_t = \sum_{i=1}^N a_i x_{t-i} + \sum_{i=0}^N b_i x_{t-i} \quad (7.1)

    ```


    The first sum is an autoregressive (AR) model of time-delayed data vectors, the
    second is a moving average (MA) model of time-delayed noise terms composed of
    Gaussian (i.e. normally distributed) random errors, and $a_i$ and $b_i$ are fixed
    parameters (Schreiber and Schmitz, 2000). Equation (7.1) is also referred to as
    linearly filtered noise (Small and Tse, 2003). Moreover, we must test the composite
    null hypothesis that the data are generated by a broad class of linear Gaussian
    process, that is by the process defined by a particular set of parameter values.
    We do this by testing for broad statistical properties. Algorithm 1 surrogates
    are designed to have the same Fourier power spectrum as the time series. This
    is accomplished by taking the Fourier transform of the time series, randomizing
    the phases, and generating the surrogates by inverting the transform (Theiler,
    1990). Consequently, testing the null hypothesis of linear stochastic dynamics
    with Algorithm 1 boils down to whether structure in the data is given by the Fourier
    power spectrum (Theiler et al., 1992).


    # 7.3.2 Algorithm 2 (AAAFT) Surrogates


    Alternatively, if the data are non-Gaussian, we generate Algorithm 2 amplitude-adjusted
    Fourier transform (AAFT) surrogates to test for stochastic linear dynamics. These
    are the most common surrogates in use. The data are transformed into a Gaussian
    series that randomized in a manner that produces surrogates preserving both the
    probability distribution and the Fourier power spectrum of the data. This is accomplished
    with a static monotonic nonlinear transformation of linearly filtered noise (Theiler
    et al., 1992; Small and Tse, 2003). Consequently, testing the null hypothesis
    of linear stochastic dynamics for non-Gaussian data boils down to whether all
    structure in the data is given by the probability distribution and the Fourier
    power spectrum. The mathematical details of how data are shuffled in Algorithm
    2 can be found in'
