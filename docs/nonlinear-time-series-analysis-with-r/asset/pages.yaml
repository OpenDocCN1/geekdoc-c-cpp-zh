    Poincaré refers here to his paper *Sur le probleme des trois corps et les équations
    de dynamique [On the three-body problem and the equations of dynamics]* (Poincaré,
    1890), for which he was awarded a prize by King Oscar II of Sweden and Norway
    on the occasion of his 60th birthday. This paper is famous not only because it
    introduced the concept of recurrence in conservative systems (known as Poincaré’s
    *recurrence theorem*) but also because it was here that Poincaré sowed the seeds
    of chaos theory. Poincaré’s recurrence theorem was at the time of Zermelo’s criticism
    of Boltzmann’s H-theorem. For details of the debate and other historical controversies,
    we refer to the classical book on the history of statistical mechanics by Brush
    (1986). Regarding recurrence plots, Marwan et al. (2007) provide a comprehensive
    overview of the subject, describing its application in various fields, where Marwan
    (2008) gives a historical review.


    The essential question concerns the recurrence of chaotic dynamics. We know that
    in a deterministic system, a return at time $j$ to state $x_i$ previously visited
    at time $i$ can occur only if the state $x_i$ is periodic, in which case the state
    recurs exactly every time period. Chaotic systems are deterministic but aperiodic.
    Can we speak of recurrence here? The answer is affirmative – if we define recurrence
    within a threshold, that is, that the state of a chaotic system is recurrent if
    it recurs, after a certain amount of time, not exactly, but in a sufficiently
    close way.


    Let $y_i$ be the reconstructed trajectory in the $m$-dimensional phase space ($d$
    is the time delay):


    ```

    $y_i = [s(t), s(t+d), s(t+2d), \dots, s(t+(m-1)d)], \quad t = 1, \dots, n$

    ```


    Each $y_i$ is a point in this space. We compute the distance $\delta_{ij}$ between
    two points at times $i$ and $j$, that is, at $t=i$ and $j$:


    ```

    $\delta_{ij} = |y_i - y_j|$

    ```'
