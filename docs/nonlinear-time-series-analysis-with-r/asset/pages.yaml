  md: '# Detecting Tipping Points


    cyclic dynamics. At its root, the strategy for detecting tipping points is to
    compute histograms for a sliding window through the time series, count histogram
    peaks in each window, and identify times when peaks abruptly change in number.


    We illustrate the mechanics of tipping-point detection with a synthetic time series
    (ts) at time t = 100. For t < 1000, the Lorenz equations are calibrated for a
    stable focus equilibrium (sigma = 10, beta = 8/3, rho = 5), while for 1000 < t
    ≤ 3000, they are calibrated for the chaotic butterfly attractor (sigma = 10, beta
    = 8/3, rho = 28) (Figure 10a).


    ![](img/efe2ac97775c9e906c844c2137d40d86_269_0.png)


    ![](img/efe2ac97775c9e906c844c2137d40d86_269_1.png)


    ![](img/efe2ac97775c9e906c844c2137d40d86_269_2.png)


    **Fig. 8.10 Detecting tipping points.** (a) Lorenz series constructed with a tipping
    point at t = 1000 between stable-focus and chaotic regimes. (b) Histograms with
    fitted spline-regression curves computed for sliding windows of 600 points to
    gauge how histogram peaks (measuring state numbers) varied across windows. The
    plots show histograms for four windows in the sequence. (c) Number of states computed
    for each window with corresponding real time on the second horizontal axis. Wide-ranging
    multiple states in initial times (0 < t ≤ 500) and later times (1000 < t ≤ 1400)
    are due to transitional dynamics as the system converges to a stable focus and
    a chaotic attractor, respectively. Once the system has settled into the chaotic
    attractor, histograms assume a broad peak with flat shoulders (right-most plot
    in (b)). The number of states alternates between three and two (when one of the
    shoulders disappears for a time).


    We use Code 8.8 to detect the tipping point (t = 1000). Roughly following Livina
    et al. (2011) and Linton and Livina (2016), the code computes histograms for a
    sliding window through the time series and makes a movie of how the histograms
    change over the series. It also fits a spline regression to the histogram bars
    to use counting'
