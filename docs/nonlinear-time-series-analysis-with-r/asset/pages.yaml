    iteration of loop $i$, the code is broken into running CCM without delay (Step
    2), CCM with backward delays (Step 3) and CCM with forward delays (Step 4).


    We run CCM without delay with the response series $B(t) = (B_1, B_2, \dots, B_N)$
    mapping the forcing series $A(t) = (A_1, A_2, \dots, A_N)$, where $N$ is the length
    of each series. We run CCM for a single period backward delay with the delayed
    response series $B(t) = (B_2, \dots, B_N)$ mapping the forcing series $A(t) =
    (A_1, A_2, \dots, A_{N-1})$, where the observations $B_1$ and $A_N$ are lost to
    the delay. Generally, formu 3 backward-crossed mappings with loop $j$, where the
    $j$th iteration maps $B(t) = (B_j, \dots, B_N)$ against $A(t) = (A_1, A_2, \dots,
    A_{N-j})$. We obtain the response series for the $j$th backward delay by embedding
    $B$ with embedding 2 and embedding delay $j$. In other words, we forward delay
    $B$ to cross map unadjusted $A$. Loop $j$ runs each backward-crossed mapping for
    random library $i$.


    In Step 4, we run CCM for forward-crossed mappings with loop $k$. We follow the
    same logic as for backward-delayed CCM, except that we embed the forcing series
    $A$ with embedding 2 and embedding delay $k$. In a $k$th backward-crossed mapping
    of $B(t) = (B_k, \dots, B_{N-k})$ against $A(t) = (A_k, A_2, \dots, A_N)$.


