    Theiler et al. (1992), Small and Tse (2003) and Kaplan and Glass (1995). We will
    rely on R package fractal (Constantine and Percival, 2015) to generate AAFT surrogates.


    # 7.3.3 PPS Surrogates


    If the data are characterized by aperiodic (nonrepeated) oscillations, we can
    generate PPS surrogates with an algorithm formulated by Small and Tse (2003).
    PPS surrogates test the null hypothesis that aperiodic oscillations are generated
    by a randomly shifting periodic orbit of noisy linear dynamics. Rejecting the
    null hypothesis opens the door to the possibility that such oscillations are generated
    by chaotic dynamics characterized by ''nonlinear nonperiodic determinism'' (Small
    and Tse, 2003). The PPS algorithm implements a random walk over a reconstructed
    shadow attractor and takes as a surrogate vector the first coordinates of the
    randomly selected points on the attractor. Consequently, PPS surrogates preserve
    deterministic features (e.g. periodic trends) but destroy fine structure (e.g.
    chaotic chaos) (Small and Tse, 2003).


    Since there is no R routine to run the PPS algorithm, Code 7.1 formulates a user-defined
    function PPS_udf based on Small and Tse (2003). The function takes x (the time
    series), nsur (the number of surrogates to be generated), and ub (determining
    respectively the smallest and largest distances from a reference point for which
    another point qualifies as a close neighbour). We import the signal separated
    from the Mayport sea line series included in Chapter 6. After computing the embedding
    data matrix Mx from the time series (Step 1), we compute the distance matrix whose
    columns give distances from a particular point on the attractor to the other points
    (Step 2). We then turn to a random walk on the attractor (Step 3). We first randomly
    select a reference row in Mx (Step 3a), and turn to the relevant column in the
    distance matrix to select neighbours rows within the lower (1b) and upper (ub)
    bounds (Step 3b). Finally, we pick one of these neighbouring rows at random (Step
    3c). The element of a surrogate data vector is given by the initial coordinate
    of that point, i.e. Mx[1]. The inner loop i fills the elements of a surrogate
    vector, and the outer loop j collects the surrogate vectors in the output matrix
    surf.PPS.


