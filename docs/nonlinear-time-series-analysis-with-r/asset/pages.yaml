  md: '# 70 Phase Space Reconstruction


    If the measurements $s(t)$ are represented as a histogram, then $p(x_i)$ is the
    probability that $s(t)$ lies in the $ith$ bin, and $p(x_i, y_j)$ is the joint
    probability that $s(t)$ lies in the $ith$ bin and $s(t+d)$ lies in the $jth$ bin.
    In other words, $I(X;Y)$ describes the information that the measurement $s(t)$
    at time $t$ brings to the measurement $s(t+d)$ at time $t+d$. In the series, the
    mutual information is averaged over all data $s(t)$ to yield the average mutual
    information (AMI). If $d$ is chosen as the value around the first minimum of the
    AMI, then $y(t)$ and $y(t+d)$ are partially but not totally independent.


    The AMI estimate is implemented in tseriesChaos with the code mutual(x, lag.max
    = lm), to yield the AMI as a function of the lag (from 1 to $lm$), i.e. as a function
    of $d$. We add the following instructions, to the code lorenz_attractor.R, after
    $plot(fn)$:


    ```

    plot(fn):

    lmm<- 60 # largest lag

    mutual(x,lag.max = lm) # average mutual information to suggest d

    ```


