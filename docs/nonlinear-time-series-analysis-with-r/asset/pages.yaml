    # 8.4 Network Plots


    We can use plots to graphically summarize causal interactions identified in adjacency
    matrices with the R package igraph (Csardi, 2015). Time series variables appear
    as nodes whose size and colour can represent binary attributes (such as gender)
    or continuous attributes (such as age or size). When the adjacency matrix has
    an element equal to 1, the network plot generates an edge (line) from the forcing
    to the response variable node. Directed edges have arrows indicating the direction
    of interaction. Weighted edges indicate the strength of interaction by edge width
    or colour.


