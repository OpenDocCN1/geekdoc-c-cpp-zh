    #  3.4.2 Embedding Time Delay


    The criterion for choosing the time delay $d$ is that $d$ must not be too small,
    but also not too large, compared with the internal timescales of the system. If
    the delays are small, then strongly correlated vectors are obtained at random,
    $\mathbf{y}(t+d)$ adds no information to $\mathbf{y}(t)$. As shown in Figure 3.6b,
    the points are distributed close to the bisector of the reconstructed phase space,
    suggesting a linear dependence that, in contrast, is completely absent from the
    original trajectory. If the delays are too large, $\mathbf{y}(t+d)$ and $\mathbf{y}$
    are practically measured per random, so the points in the embedding space appear
    to be randomly distributed. In fact, if we had an infinite and perfectly clean
    (noise-free) series, then the time delay could be arbitrary. However, in practice
    this is impossible, we will adopt some prescriptions.


    One could think of choosing for $d$ the first zero of the autocorrelation function
    (or the value of $d$ which is significantly reduced), but this criterion may lead
    to misleading results (Abaranel, 1996). As we have already seen, with nonlinear
    series, the autocorrelation function may find no correlation. A suggestion for
    the time delay choice is given by the estimate of the *mutual information*, of
    the series. a quantity with no relation to the linearity or nonlinearity of series.
    Let $X$ and $Y$ be discrete random variables. Then the mutual information between
    them, $I(X;Y)$, is defined


    ```

    I(X;Y) = \sum_{i,j} p(x_i, y_j) \log_2 \frac{p(x_i, y_j)}{p(x_i)p(y_j)}

    ```


    where $p(x_i, y_j)$ is the joint probability distribution function of $X$ and
    $Y$, and $p(x_i)$ and $p(y_j)$ are the marginal probability distribution functions
    of $X$ and $Y$, respectively. Note that $I(X;Y)$ is in units of bits. The mutual
    information is a measure of how much the knowledge of $X$ (Y) reduces uncertainty
    about $Y$ (X). This implies that $I(X;Y) = 0$ if and only if $X$ and $Y$ are independent
    random variables, that is, if $p(x_i, y_j) = p(x_i)p(y_j)$.'
