    In Step 2, we generate surrogate data vectors to run an upper-tailed hypothesis
    test using nonparametric order statistics. In Step 2a, we compute the required
    number of surrogate vectors to run the test at the alpha=0.05 significance level.
    Setting k=2 generates (k/alpha)-1=39 surrogate data. In each time record, we compute
    the CP scores for the surrogate vectors in descending order, and reject the null
    hypothesis if the CP score computed from the trend or oscillation component of
    the observed data is among the k=2 of the descending surrogate vectors.


    In Step 2b, we partition each surrogate vector into past and future series, the
    change-point-user-defined function st.ud on each partitioned series, and compute
    CP scores through time. This results in an output matrix z.surr whose columns
    contain the CP scores for each surrogate vector and whose rows contain the scores
    in each period across surrogate.


    In Step 2c, we write a user-defined function rank.ud to sort in descending order,
    and pick the value that must be exceeded for a selected significance level. We
    then apply rank.ud to rely on z.surr with the R command apply. This results in
    a time series of point-by-point 95% upper confidence limits z.high that a CP score
    must exceed to be statistically significant.


