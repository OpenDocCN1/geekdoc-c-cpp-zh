  md: '# 38 Linear and Nonlinear Dynamic Behaviour


    the iterations for(j in 1:nt) is nested, in which, after discarding the transient
    part of the trajectory ntrans, the instruction lambda<-log(abs(i*(1-y))) is executed,
    where i enumerates the values assumed by r, and y is the value of f(x_i) computed
    nt times for that value of r. Therefore, for each r, the code computes values
    of lambda, which are added at each step. After the end of the loop on r, the sum
    of these nt values of lambda is divided by nt to obtain their average, and the
    result is \lambda.


    Figure 2.20 shows results obtained using the code logistic_Lyap.R. Notice \lambda
    is less than 0 (or equal to 0 for certain values of r) before the chaotic regime,
    that is, for r < r^*_\infty. For r > r^*_\infty \lambda is greater than 0, apart
    from certain values of r.


    ![](img/efe2ac97775c9e906c844c2137d40d86_48_0.png)


    **Fig. 2.20** Lyapunov exponent estimate for the logistic map; the dash-dot line
    at r $\approx$ 3.5694 denotes the beginning of the chaotic regime.


    On Figures 2.20 and 2.11, one can see that the values of r for $\lambda=0$ correspond
    to the bifurcation points; that is, $r^*_1\approx$ 3 corresponds to the point
    at which the period-2 attractor begins, $r^*_2\approx$ 3.449 to at which the period-4
    attractor begins and $r^*_3\approx$ 3.544 to at which the period-8 attractor begins
    (after these values, the figure has insufficient resolution). The deep minimum
    at $r\approx$ 3.236 corresponds to a superstable point. Further superstable points
    can be seen at $r\approx$ 3.498 and $r\approx$ 3.554. If the step in r (at present
    0.002) is slightly varied, the shapes of these minima change significantly, at
    superstable points $\lambda\to-\infty$ and so in the neighbourhood of such a point
    the $\lambda$ is very sensitive to the value of r.


    In summary, if $r < r^*_\infty$, the Lyapunov exponent is never positive, so there
    is no exponential divergence— indeed, on the contrary, there is asymptotic stability.
    In the chaotic regime, $r > r^*_\infty$, the Lyapunov exponent is positive (except
    in some intervals), indicating the sensitive dependence on initial conditions.'
