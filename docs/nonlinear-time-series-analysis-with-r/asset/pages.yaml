    for 30 periods with an integration step of 0.01 (Figure 7.4). First, we solve
    the system from initial conditions $x(t=0) = 10$, $y(t=0) = 10$ and $z(t=0) =
    10$ (black line). Then we slightly increase $x(t=0) = 10$ to 10.0001 while leaving
    the other initial lines constant (grey line), the neighbouring trajectories are
    very close. After about 14 periods, they begin to separate, and finally become
    uncorrelated, although they are generated by the same dynamical system. The maximum
    Lyapunov exponent measures the separation rate averaged over the entire attractor,
    i.e. over all initial conditions (Kaplan and Grass, 1995). A key signature of
    deterministic chaos is that separation occurs at an exponential rate, as measured
    by a positive maximum Lyapunov exponent. A surprising implication of sensitivity
    to initial conditions is that, given the numerical imprecision of measuring initial
    conditions, long-term prediction in chaotic systems is impossible even though
    the governing equations are deterministic.


    We can numerically estimate the maximum Lyapunov exponent with the R package `lap.k(seriesChaos)`
    based on an algorithm in Kantz and Schreiber (1997). Code 7.5 illustrates how
    this algorithm works in the simpler setting of numerically characterizing sensitivity
