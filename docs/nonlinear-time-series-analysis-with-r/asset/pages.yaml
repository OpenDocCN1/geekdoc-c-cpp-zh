    Before ending this, we recall another bivariate approach to recurrence, namely
    the joint recurrence plot (JRP), proposed by Romano et al. (2004). Suppose that
    we have two trajectories, y and z, in two separate phase spaces. By means of the
    JRP, we can explore joint recurrences, that is, the occurrence of two simultaneous
    events. In the first event, the system described by the first trajectory y, at
    time j, is in the state yi and returns, at a distance less than ce to the state
    yi, previously visited at time i. The second event is the same as the first, where
    y is replaced by z. The probability that these events occur simultaneously, each
    in its phase space, is the product of the probabilities of each single event.
    Formally, eqn (4.2) becomes


    $J_{i,j} = \Theta(\epsilon_y - |y_i - y_j|) \times \Theta(\epsilon_z - |z_i -
    z_j|), \quad i, j = 1, 2, \dots, n$


    which is the product of the RP of each series. The JRP can be also seen as the
    Hadamard product of the RP of the first system and that of the second system.
    For a comparison between CRPs and JRPs, see Marwan and Webber (2015).


    # 4.4 Correlation Dimension


    The correlation dimension measures the geometric dimension of the attractor and
    also gives the minimum number of variables required to construct the phase space,
    which is the nearest integer above the correlation dimension. The dimension may
    be integer or fractal. There are several ways to calculate a fractal dimension,
    the correlation being one of these. We have already seen fractals in the context
    of the logistic map. Its bifurcation diagram (Figure 2.11) shows the self-similarity
    property. A fractal contains an infinite number of copies of itself; that is,
    it is similar to itself on all scales. Benoit Mandelbrot, in his book The Fractal
    Geometry of Nature, defines the term fractal (Mandelbrot, 1982, p. 15):


    A fractal is by definition a set for which the Hausdorff-Besicovitch dimension
    strictly exceeds the topological dimension.


    A brief digression on these concepts seems appropriate.


    # 4.4.1 Fractals


    Let us begin with the topological dimension. In Liebovich (1998, p. 46), we read
    (his italics):'
