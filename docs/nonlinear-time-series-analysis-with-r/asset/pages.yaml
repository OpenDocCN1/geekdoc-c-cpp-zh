  md: '# Analytical Construction of a Phase Diagram 339


    The trace of $A$ is $Tr(A) = 2+2 = 4$, the determinant is $|A| = (2)(2) - (2)(-36)
    = 40$ and the characteristic equation is


    ```

    $$\lambda^2 - 4\lambda + 40 = 0$

    ```


    with eigenvalues $\lambda_{1,2} = 2 \pm 6i$ and complex eigenvectors


    ```

    $v^1 = \begin{bmatrix} -(-36) & 0 \ a_{12} & -2 \end{bmatrix} + \begin{bmatrix}
    0 & 36 \ -6 & \beta \end{bmatrix}i = \begin{bmatrix} 0 \ 0 \end{bmatrix}$

    ```


    ```

    $v^2 = \begin{bmatrix} -(-36) & 0 \ 2 & -2 \end{bmatrix} + \begin{bmatrix} 0 &
    36 \ 0 & 0 \end{bmatrix}i$

    ```


    # C.2 Analytical Construction of a Phase Diagram


    We illustrate the analytical construction of a phase diagram with the following
    system:


    ```

    $$\begin{bmatrix} \dot{x}_t \ \dot{y}_t \end{bmatrix} = \begin{bmatrix} -3 & 2
    \ 2 & -3 \end{bmatrix} \begin{bmatrix} x_t \ y_t \end{bmatrix}$

    ```


    The nullclines setting each ODE to zero


    ```

    $$\dot{x}_t = -3x_t + 2y_t = 0 \implies y_{\dot{x}=0} = \frac{3}{2}x(t)$

    ```


    ```

    $$\dot{y}_t = 2x_t - 3y_t = 0 \implies y_{\dot{y}=0} = \frac{2}{3}x(t)$

    ```


    The nullclines (black lines) are plotted in phase space in Figure C.2a.


    The nullclines partition phase space into four nullectors. The black arrows in
    the background of Figure C.2 show the directions that follow in each nullector
    (the vector field). We can use the system (C2) to qualitatively determine these
    directions by using reference points. In experiment, we determine motion away
    from the $\dot{x}=0$ nullcline. We know that $x_t$ is constant along the nullcline,
    growth in $y_t$ is zero. In the left-hand panel of Figure C.2b, we increase $y_t$
    off the nullcline (upward-pointing dashed arrow). Growth in $x_t$ marginally increases,
    since $\partial x/\partial y=a_{12}=2>0$. This means that $x_t$ increases above
    the nullcline, by the rightward-pointing arrow. The opposite occurs below the
    nullcline. We would get the same result if we experimented with an incremental
    increase in $x_t$ off the nullcline and repeated the reasoning with $\partial\dot{x}/\partial
    x=a_{11}=-3<0$. In the other experiment, we determine motion away from the $\dot{y}=0$
    nullcline. In the right-hand diagram in Figure C.2b, we incrementally increase
    $x_t$ off the nullcline (rightward-pointing dashed arrow). Growth in $y_t$ marginally
    increases, since $\partial\dot{y}/\partial x=a_{21}=2>0$. This means that $y_t$
    increases below the nullcline'
  merge: -1
  pgno: 349
