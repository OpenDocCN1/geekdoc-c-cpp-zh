    # 4.2.1 Estimating the Maximum Characteristic Lyapunov Exponent


    Let $x_0$ and $x''_0$ be two close initial conditions in an $r$-dimensional phase
    space. The MCLE may then be defined as


    ```

    $\lambda = \lim_{n\to \infty} \lim_{\delta\to 0} \frac{1}{n} \ln \left| \begin{matrix}
    x_n - x''_n \ x_0 - x''_0 \end{matrix} \right|$

    ```


    where $\delta = ||x_0 - x''_0||$ is perturbation in the initial condition and
    $|\cdot||$ is an appropriate norm. This definition holds with probability equal
    to 1 for almost all initial conditions. In practice, however, we have only one
    measured scalar series available. We have learned that, thanks to the embedding
    procedure, we can construct a phase space equivalent to the physical one. Let
    $y_t$ be the reconstructed trajectory in the $m$-dimensional phase space ($d$
    is the time delay):


    ```

    $y_t = [s(t), s(t+d), s(t+2d), \dots, s(t+(m-1)d)], \quad t = 1, \dots, n$

    ```


    However even after the embedding, the trajectory remains only a single one. How
    can we follow two trajectories starting at two close initial conditions? The strategy
    is to look at nearby points as they were on different trajectories. The method
    was first proposed by Wolf *et al.* (1985) and then revisited by Rosenstein *et
    al.* (1993), and by Kantz (1994). The underlying algorithm is explained in details
    in Kantz and Schreiber (1997) and is included in the TISEAN package (Hegger *et
    al.*, 1999). Suppose, for example, that $m=2$ (Figure 4.1).


    ![](img/efe2ac97775c9e906c844c2137d40d86_95_0.png)


    **Fig. 4.1** Segments of reconstructed trajectory in two-dimensional phase space
    ($s(t), s(t+d)$) $t=1, \dots, n$: scheme for estimation of the of of the maximum
    characteristic Lyapunov exponent.'
