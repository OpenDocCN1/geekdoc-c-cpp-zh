  md: "# 180 Data Preprocessing\n\nThe sum of the test vector computes the first minimum\
    \ estimate d = 2.\n\nStep 2 of embed_ud computes the Theiler window parameter\
    \ tw, required by a subsequent test. The Theiler window corrects for the following\
    \ problem: neighbouring points in phase space may be determined to be close simply\
    \ because they are proximate in time. We mistake temporal correlation for the\
    \ attractor's geometric structure. Consequently, points within the Theiler window\
    \ are excluded in reconstructing the attractor (Kantz and Schreiber, 1997). Step\
    \ 2a follows a conventional method for selecting the Theiler window as the first\
    \ minimum of the autocorrelation function (ACF). The ACF measures the linear correlation\
    \ of a time series with copies of it at different points in time. We compute the\
    \ ACF with the routine acf. This routine requires input of the time series xi\
    \ and a maximum delay, which we set at lag_max = 100. The routine acf plot shown\
    \ in 6.15b. The output file acf reports numerical values, the ACF for the first\
    \ element as:\n\n```\n> acf.out[1:8]\n[1] 0.00000000 0.73553060 0.23422428 -0.06898751\
    \ -0.13652360 -0.1694746\n[7] -0.20160526 -0.17821465\n```\n\nWe see that the\
    \ first minimum occurs at a lag of six periods (since the first value, 1.00, is\
    \ associated with a zero lag), so that the Theiler window tw = 6. Step 2b uses\
    \ the embedding method formulated in Step 1b to numerically identify the Theiler\
    \ window. We note that space-time separation plots provide a more rigorous, and\
    \ potentially more effective, estimate of the Theiler window (Provenzale et al.,\
    \ 1992).\n\nStep 3 of embed_udf estimates the embedding dimension . The embedding\
    \ dimension is conventionally excluded with the false nearest neighbours test\
    \ (Kennel et al., 1992). This test reconstructs an attractor from the observed\
    \ time series for a given time series indices differ by large delay d in a given\
    \ embedding dimension, and computes the distances between points in phase space.\
    \ The test points which less than the Theiler window tw. It then repeats this\
    \ exercise in the next higher dimension and calculates the percentage of false\
    \ neighbours, which is, points that do remain close but grow apart. The embedding\
    \ dimension selected is for which the percentage of false neighbours falls below\
    \ a given tolerance level. An attractor reconstructed in fewer dimensions does\
    \ not have sufficient space to express itself, (Williams, 1997). In Chapter 3,\
    \ we illustrated false nearest neighbours with a couple of real-world examples\
    \ (see Section 3.4.1).\n\nStep 3a runs the false nearest R false.nearest(tseriesChaos).\
    \ This routine requires input of the time series xi, a maximum embedding dimension\
    \ set at m.max = 6, the embedding delay d, and the Theiler window tw. For our\
    \ example, d = 2 and tw = 6. The percentages of false neighbours from one dimension\
    \ to the next, fnp, are recovered from the output file fn.out:\n\n```\n> fn.out\n\
    m1 m2 m3 m4 m5\nfraction 6.7262950e-01 1.824837e-03 3.654080e-03 4.737270e-04\
