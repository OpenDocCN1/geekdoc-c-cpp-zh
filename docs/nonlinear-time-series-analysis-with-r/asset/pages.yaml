    # 10.2 Phase Space Reconstruction


    Having isolated strong stationary signals in each disease time series, we can
    justifiably attempt to reconstruct epidemic system dynamics from each signal.
    Takens (1981) proved that the shadow phase space reconstructed from lagged copies
    of a single variable preserves essential dynamic properties of the original phase
    space if the shadow phase space has an embedding dimension sufficiently large
    to accommodate the fractal dimension of the original attractor. We reconstruct
    a shadow attractor from each signal observe whether attractors exhibit apparent
    structure, and test the null hypothesis that observed structure is generated fortuitously
    by linear stochastic dynamics with surrogate data.


    We ran Code 7.7 to reconstruct shadow attractors from each disease signal. The
    scarlet fever (Figure 10.9a), measles (Figure 10.10a), and pertussis (Figure 10.11a)
    shadow attractors exhibit apparent structure. Animating the attractors with the
