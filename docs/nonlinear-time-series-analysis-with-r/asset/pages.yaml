  md: "2.18 also demonstrates how the noninvertibility of the logistic map precludes\
    \ predicting backwards through time (i.e. retrodiction). A map $x_{t+1} = f(x_t)$\
    \ is invertible if it is possible to define an inverse map $f^{-1}$ such that\
    \ $x_t = f^{-1}(x_{t+1})$. The logistic map is not invertible, because every point\
    \ $\\xi_k$, of $x_k$ has two precursors, one to the right, $\\xi_k$, and one to\
    \ the left, $f[x_k]=0.5$. Moreover, every precursor has two precursors. For example,\
    \ $\\xi_{k+1}$ has $2^{100} \\approx 1.3 \times 10^{30}$ precursors going back\
    \ 100 iterations. In general, a one-dimensional map must be noninvertible to be\
    \ chaotic. However, even invertible multidimensional maps may exhibit chaotic\
    \ behaviour.\n\n# 2.7.1 Quantifying Sensitive Dependence with Lyapunov Exponents\n\
    \nTo estimate the rate at which the trajectories diverge, we account for the distance\
    \ between them changes at each time (Figure 2.19). Recurring eqn (2.10), let $|x_0\
    \ - x'_0| = \\delta x_0$ be the very small distance (strictly, $\\delta x_0 \t\
    o 0$) between the points $x_0$ and $x'_0$. The initial distance is\n\n$\\delta\
    \ x_1 = |x_1 - x'_1| = |f(x_0) - f(x'_0)| \\approx |f'(x_0)| \\delta x_0$\n\n\
    At the second iteration, the distance is\n\n$\\delta x_2 = |x_2 - x'_2| \\approx\
    \ |f'(x_1)| \\delta x_1 \\approx |f'(x_1) \\cdot f'(x_0)| \\delta x_0$\n\nThe\
    \ distance at the n iteration is\n\n$\\delta x_n = |x_n - x'_n| \\napprox |f'(x_{n-1})\
    \ \\cdot f'(x_{n-2}) \\cdots f'(x_1) \\cdot f'(x_0)| \\delta x_0 \\quad (2.22)$\n\
    \nWe want to estimate the extent to which two trajectories diverge (or converge)\
    \ for progressively increasing times. The behaviour at short time intervals is\
    \ of no interest.\n\n![](img/efe2ac97775c9e906c844c2137d40d86_45_0.png)\n\n**Figure.\
    \ 2.19** Increase with time of the distance between two trajectories (solid and\
    \ dashed lines) starting from very close points (initial distance $\\delta x_0$)."
