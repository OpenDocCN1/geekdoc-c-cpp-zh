  md: '# 54 Phase Space Reconstruction


    The package deSolve (Soetaert et al. (2016)) is a family of codes that solve initial-value
    problems for systems of first-order ordinary differential equations (ODEs), of
    partial differential equations, of differential algebraic equations and of delay
    differential equations. If necessary deSolve can be installed with install.packages("deSolve",
    dep = TRUE). In pendid.s.o.r, to solve the system of first-order ODEs, Runge-Kutta
    fourth-order integration is used with the command rk4(cinit, time, params). The
    function rk4 has many parameters, but here only the essential ones are described.
    The vectorinit contains the initial conditions for the ODE system: in our case,
    the pendulum starts at x = 1, y = 1. The quantities tinit and tfin represent the
    extremes of the time interval for the system evolution; they are physical times,
    measured, for instance. The vector times contains the points at which the integration
    of the system (3.1) is computed. The integration step, has to be chosen with a
    bit of good sense, as we will see. The parameters params in our case are 1 and
    u² = 3. The function struct represents the system, t is the current time point
    in the integration, integ represents the computed current variables and p is the
    parameter vector. The result is matrix xy. There is the possibility of saving
    the matrix as a comma-separated file, with extension csv. The first column xy[,1]
    contains the components of the vector times: 0.00, 0.01, 0.02, ..., 0.99, 10.0.
    The second column xy[,2] and third column xy[,3] contain the computed values of
    x(t) and y(t), respectively. The first three rows of the output matrix xy are
