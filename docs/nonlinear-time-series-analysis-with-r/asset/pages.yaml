  md: 'We give a couple of definitions:


    If a measure $\mu$ is such that $\mu(\Omega) < \infty$, then it is called a *finite
    measure*.

    If a $\mu$ is such that $\mu(\Omega) = 1$, then it is called a *probability measure*
    or a *probability*.


    If $\mu$ is a probability measure, then the triple $(\Omega, \mathcal{F}, \mu)$
    forms a *probability space*. The probability $\mu$ is then defined as a particular
    measure associated with the measurable space $(\OmegaOmega \mathcal{F})$.


    Before going further into the formal aspects of the subject, let us recall that
    the word ''ergodic'' derives from the Greek *ergon* (ergon: ''work'', ''energy'')
    and *odos* (odon: ''route'', ''path''). The term was introduced by Boltzmann in
    statistical mechanics to describe the ''work trajectory'' covered in phase space
    by the representative point of the system. The system is ergodic if its work visits,
    sooner or later, all the points of phase space allowed by energy constraints.
    This hypothesis was later called the *ergodic hypothesis*; see also Brukh (1986)
    and von Plato (1994).


    Let us give some more definitions.


    A $\mu$ is *invariant* with respect to the map $f$ if


    ```

    $$\mu(S) = \mu(f^{-1}(S)) \quad (A.4)$

    ```


    where $S \subseteq R$ and $\mu(f^{-1}(S))$ is the preimage (inverse image) of
    $S$ under $f$.

    In analogy to the notion of ''natural density'', we define the *natural measure*
    of the set $S$. Consider the measure $\mu(x, S)$ it is the same for every initial
    condition $x_0$ (except for a set of measure zero), then $\mu(x, S) = \mu(S)$
    is a natural measure of $S$. In fact, there is a close connection between the
    invariant density and the invariant measure: an invariant density $\rho$ induces
    an invariant probability measure $\mu$ on $\Omega$. Indeed, it can be proved that
    for every subset $S \subseteq R$,


    ```

    $$\mu(S) = \int_{S} \rho(x) dx$

    ```


    and that $\mu(S)$ is an invariant probability measure. In addition to an invariant
    measure with respect to a map, we can define a map preserving the measure $f$
    preserves the measure $\mu$ if eqn $(A.4) holds.


    More generally, instead of ''map'', one speaks of ''transformation'' and $\mu$
    is a probability measure on $R^n$. Then the transformation $f$ is *measure-preserving*
    if


    ```

    $$\mu(S) = \mu(f^{-1}(S)) \\forall S \subseteq R^n$

    ```


    instance, if $S = [0, 1]$ and $\mu$ is the invariant probability measure corresponding
    to the probability density function $Beta(0.5,0.5)$ in eqn (2.25), then the logistic
    map, with $r=4$, preserves the measure $\mu$.


    ```

    $$\mu = p\mu_1 + (1-p)\mu_2, \quad 0 < p < 1 \quad (A.5)$

    ```'
