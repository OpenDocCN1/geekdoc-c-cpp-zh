  md: '# Introduction 125


    The following are important properties of the Shannon entropy:


    +   1. $H = 0$ if and only if $X$ is known with certainty, that is, if all but
    one of the probabilities $p_i$ are zero, with the remaining probability $p_j$
    being 1:


    ```

    $P\{X=j\} = 1 \quad \text{and} \quad P\{X=i\} = 0, \forall i \neq j$

    ```


    This means that $H$ takes the only value 0 when the result is certain; otherwise
    always $H > 0$.


    +   2. Given a certain dimension $n$, $H$ is maximal when all the probabilities
    $p_i$ are equal, $p_i = 1/n$; this is the uniform distribution, the situation
    with the maximum uncertainty.


    Suppose, for example, that we have an alphabet with only two symbols: H (heads)
    and T (tails). If $H(X) = 0$, since $\log_2 1 = 0$. If $P\{X=T\} = P\{X=H\} =
    0.5$, then we have


    ```

    $H(X) = (-0.50 \log_2 0.5 + 0.50 \log_2 0.5) = 1$

    ```


    log_2 0.5 = -1)$. If, for instance, $P\{X=T\} = 0.75$ and $P\{X=H\} = 0.25$, then


    ```

    $H(X) = (-0.75 \log_2 0.75 + 0.25 \log_2 0.25) = 0.8128$

    ```


    The quantity $-\log_2 P(x=i)$, or $-\log_2 p(x_i)$, is also called the *surprisal*.
    When $p_i$ is small (in which case the surprisal, $-\log_2 p(x_i)$, is large),
    we are ''surprised'' by the result that occurs with $x_i$, whereas $p_i$ is large
    (and the surprisal is therefore small), our degree of surprise is low. All of
    this is in agreement with the interpretation of $H$ as a measure of uncertainty:
    the more uncertain we are of a result, the more surprised we are if this result
    occurs.


    We can also interpret $H$ as a measure of the information content in a message.
    If $H$ is large, then knowledge about $X$ is highly informative. In other words,
    if an event is unexpected, it is very informative, whereas it is easily predictable,
    it is not informative. Surisal, uncertainty, randomness, and information are all
    related notions associated with the concept of entropy. As mentioned earlier,
    if a coin has two heads, then $H(X) = 0$, and no information is transmitted about
    the next toss, the result is certain. However, if the coin is fair, then $H(X)
    = 1$, and to express the result, we need a one-bit message, denoting heads 1 and
    tails by 0 (or the reverse). So, if we flip a fair coin 100 times, we need 100
    numbers (1 or 0) to send a message with the results, but if the coin has two heads,
    there is no need for any sequence of digits to describe the outcomes.


    We can also write $H(X) = -\sum_i p(x_i) \log_2 p(x_i)$ as


    ```

    $H(X) = \sum_i [-\log_2 p(x_i)] p(x_i) \n= E[-\log_2 p(x_i)]$

    ```


