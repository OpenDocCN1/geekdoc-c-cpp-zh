  md: '# Entropy and Surrogate Testing


    ''The program asks you how many lines you want in the poem, and you decide: ten,
    twenty, a hundred. Then the program randomizes the line numbers. In other words,
    a new arrangement each time. With ten lines you can make thousands and thousands
    of random poems.''nUmberto Eco, Foucault''s Pendulum


    # 5.1 Introduction


    The word ''entropy'' was introduced by the German physicist Rudolf Clausius, in
    his Die Mechanische Wärmetheorie (''The Mechanical Theory of Heat''). The middle
    of the nineteenth century. The term evokes ''energy'' and derives from the Greek
    εν (en: ''inside'') and τροπή (trope: ''turning'', ''change''). In thermodynamics,
    if a system at an absolute temperature $T$ (kelvin) receives an element $dQ$ of
    heat, its entropy $S$ increases by an amount $dS=dQ/T$. There is no interpretation
    involving lack of knowledge, or randomness, or the Second Law of Thermodynamics
    can be expressed by $dS/dt\ge0$; that is, entropy increases with time: this statistical
    presupposition a direction, an ''arrow of time''.


    In statistical mechanics, Ludwig Boltzmann linked entropy to the concept of probability,
    to tackle the Second Law of Thermodynamics, in particular to determine the equilibrium
    state of a gas. A gas is in an equilibrium state if all parameters (volume, temperature,
    pressure) have defined constant values. The answer is carved on Boltzmann''s grave
    $S=k\log W$, the entropy $S$ is proportional to the logarithm of the probability
    $W$ (Wahrscheinlichkeit) and the constant $k$ is called Boltzmann''s. In an irony
    of history, this formula was never written in this form by Boltzmann, but by Planck.
    The formula says that the system spontaneously reaches the maximum entropy $S$
    simply because all states are extremely unlikely. For an extended discussion of
    the concept of probability in classical statistical physics, see von Plato (1994).


    Let $X$ be a discrete random variable with support $S_X$, that is, the set of
    all possible values of $X$. In the context of information theory, the support
    is called the ''alphabet''. If I toss a coin, I am uncertain of the result. Is
    the coin fair or is it biased? To quantify this uncertainty To this end, we need
    a number, from the probability distribution measures the uncertainty of the results.
    Let this be denoted by $H(X)$


    > probability distribution: $\{p(x_1), \dots, p(x_n)\}, x_i \in S_X \longrightarrow
    \text{real number: } H(X)$'
