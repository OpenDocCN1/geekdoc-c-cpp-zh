    In this illustration, we keep the three matrices grouped separately.

    In Step le, Toeplitz-SSA measures the contribution of a matrix to the overall
    decomposition in relation to the total variance (from zero) in the time series.
    This provides an intuitive measure of signal strength for non-mathematicians.
    For example, we note from the diagonal of $C_X$ that the total variance of $x_t$
    is $c_{11}=4$ (eq.68). The variance of $C_X$ is $Tr(C_X)=4+4+4=3c_{11}$, so that
    $c_{11}=Tr(C_X)/3$. Since the trace of a square matrix equals the sum of its eigenvalues,
    we can compute the total variance of the time series (from zero) as the average
    of the eigenvalues of $C_X$:


    ```

    $c_{11} = \frac{1}{K(3)} \sum_{i=1}^{K(3)} \lambda_i = 4 \quad (6.22)

    ```


    The partial variance attributed to the itrix in the Toeplitz decomposition is


    ```

    $\frac{1}{3}\lambda_1 + \frac{1}{3}\lambda_2 + \frac{1}{3}\lambda_3 = \frac{\lambda_i}{\sum_{i=1}^{K}\lambda_i}
    \quad (6.23)

    ```


    In our example, the matrices in the decomposition, $X_1, X_2$ and $X_3$, account
    for 54%, 46%, and 0.004% of the variance (from zero) in the time series. If we
    want to measure the contribution in terms of total variance in the time series
    from mean, then we initially transform the data by subtracting the series mean
    from each observation.

    In Step 2, $X_1, X_2$, and $X_3$ are converted into corresponding time series
    with diagonal averaging. For our example, the decomposed time series are reported
    in Table 6.2.


    # 6.4.3 SSA in R


    In practice, we run SSA with the R package `ssa` (Korobybnikov et al., 2015).
    We present two codes that split `ssa` into the matrix decomposition and grouping
    steps (Code 6.9) and the time reconstruction step (Code 6.11). The reason is that
    Code 6.9 provides visual visual diagnostics that must be consulted before running
    Code 6.11. We illustrate the use of `ssa` to run processing on monthly sea levels
    (1928–2000) collected at the Mayport station on the Atlantic coast of Jacksonville,
    Florida (PSMSL, 2016). The plotted time series exhibits substantial variability
    (see Figure 6.10b, left-hand plot).'
