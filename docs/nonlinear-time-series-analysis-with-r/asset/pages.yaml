    # 4.3.1 Recurrence Quantification Analysis


    We have seen that lines parallel to the main diagonal mark that a segment of the

    tjectory runs almost parallel to another segment at different times. We can imagine

    a(hyper)tube in phase space with dimension ε through the trajectory passes

    at different times. The shorter the tube, the more predictable is the trajectory,
    and

    therefore the length of the diagonals may be linked to the probability of the
    system.

    These and similar considerations led RQA to quantify RPs; see also Zbilut and
    Webber (1992) to develop recurrence

    quantification analysis also Zbilut and Webber (1994),

    Marwan et al. (2007) and Marwan and Webber (2015). As we have already said for

    the Lyapunov exponents, and as we will say for the correlation dimension, when

    ha finite observed series, we estimate some quantities; that, they are statistics.

    Several statistics have been proposed for the RPs, mainly based on the density
    of the

    points and the conformation of the diagonals in the plots.


    The Comprehensive Archive Network (CRAN), the puh clearing house for

    R packages, contains further two packages, in addition to tseriesChaos, for

    an analysis of nonlinear time series, namely the package fNonlinear and the package

    nonlinearSeries. This latter package offers, several functions to compute

    nonlinear statistics, the possibility of RQA. We will see how RQA works for a
    very

    series, in order to introduce the most commonly used statistics of this technique.

    t RQA produces the following statistics:


    +   - Recurrence rate (REC): percentage of black points on the TRP.

    - Determinism (DET): percentage of recurrent points that form diagonal lines-

    al to the main diagonal (LOI). Points on the LOI are, or not excluded from a minimum

    threshold lmin are considered. Typically, lmin = 2.

    - Ratio (RATIO): ratio of DET to REC. This can be useful in discovering dynamic

    trans (Marwan et al., 2007).

    - Length of the longest diagonal (Lmax). As already mentioned, the diagonal

    lines are linked to the divergence of the trajectory segments.'
