    Nothing in the equations of the damped driven pendulum can reveal that the to
    the right of the vertical line is more preferred than that the left, or vice versa.
    This type of phenomenon is called symmetry breaking. Such symmetry breaking does
    not occur if the system is described by linear equations, but is intimately connected
    with the nonlinear behaviour of the system. However, that symmetry breaking of
    a single limit cycle leads to the emergence of a new symmetry if we imagine joining
    together the two attractors. We obtain two limit cycles that are symmetric with
    the vertical line. Figure 4.22b shows the two outermost cycles in Figure 4.22a,
    with the points connected with a line, and the impression of two symmetric cycles
    one outside the other.


    The interconnected concepts of symmetry, symmetry breaking, conservation laws
    and degeneracy play a central role in the physical sciences (e.g. Brading and
    Castellani 2013 and references therein). It is common knowledge that symmetry
    principles (or invariance principles) can be invoked to explain conservation laws.
    Examples from classical mechanics are energy conservation (related to invariance
    of the Hamiltonian under time translation) and momentum conservation (related
    to invariance of the Hamiltonian under spatial translation and rotation, respectively).
    In quantum mechanics, symmetry principles are even more powerful — recall, for
    instance, so-called quantum statistics are related to a new kind of symmetry,
    the interchange of identical particles. A further consequence of symmetry is degeneracy
    of energy levels: greater symmetry in the Hamiltonian leads to more degeneracy
    in the energy spectrum. A further concept connected to symmetry is that of symmetry
    breaking. As David Gross (1996) writes: The secret of nature is symmetry, but
    but much'
