  md: '# 262 Empirically Detecting Causality


    In Step 1, we use the saveVideo in the animation library (Xie, 27) to film the
    movie of sequenced histograms. Loop i iterates through the number of sliding windows
    calculated with the command win<-length(ts)-2b1. We partition the time series
    into windows (Step 1a) and then compute a histogram for the ith window with the
    hist() command (Step 1b). Setting freq=FALSE in histogram bars measuring probability
    densities instead of frequencies. We use the splinefun() command to fit a spline
    regression to histogram peaks. We plot the spline regression against the histogram
    with the command curve() and record the iterated sequence of histograms and regression
    lines with the command ani.record(). Figure 8.10 shows a sequence of histograms
    at times before and after the built-tipping point at t = 1000. Before the tipping
    point, histograms display a single peak corresponding to stable-focus dynamics
    (left-most plot). In the neighbourhood of the tipping point, histograms transitions
    towards the shape characterizing the chaotic butterfly attractor, namely a single
    broad peak with relatively flat shoulders (right-most plot).


    In Step 1c, we begin the process of using the spline regression to count histogram
    peaks. We retrieve the spline regression values with the command y<-f(x, deriv=0)
    and negative values to zero. We remove the (noise) floor that we observe, on either
    side of the single peak in Figure 8.10 (left-most plot). The noise floor contains
    minor peaks generated by numerical error, if counted, would greatly exaggerate
    the true number of states. Removing this noise floor can be done in several ways;
    we do it by setting regression points less than 5% of the maximum value to zero.


    In Step 1d we count the number of histogram peaks for the case of a peak (i.e.
    when the first is the highest), and interior peaks. We identify interior peaks
    by counting inflection points ip as the sign changes in the second derivatives
    of the spline-regression function with the command derivative.2<-f(x,deriv=2).
    We then calculate the number of states reflected in histogram i as states = 1+ip/2,
    b+window number and the corresponding real time (calculated as time = b+window-1).


    Figure 8.10 shows this plot generated for the Lorenz series in this illustration.
    Time starts at 300 for initial times t ≤ 500, the plot shows multiple transitional
    states as dynamics converges towards the stable-focus equilibrium. The plot then
    displays a single state corresponding to the stable focus. As windows begin to
    cover the tipping point (t = 1000), the plot reflects multiple states as the dynamics
    transition to the chaotic butterfly attractor. Once windows enters the attractor,
    histograms assume a single broad peak with rounded shoulders. The plot reflects
    this by alternating between three and two states (when one of the shoulders disappears
    for a time). The plot succeeds in identifying the tipping point built into the
    time series.


    # 8.8 Summary


    In this chapter, we have presented empirical causal-detection methods for the
    case in which the tested variables have continuous records and another case in
    which they have irregular-sporadic records.'
