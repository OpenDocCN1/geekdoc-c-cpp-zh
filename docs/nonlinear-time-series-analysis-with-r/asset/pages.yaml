    # 10.6 Summary


    The nonlinear data diagnostics that we applied to the New York disease data provide
    a rigorous empirical benchmark of real-world epidemic behaviour that can be used,
    along with other expert information, to guide the specification and testing of
    subsequent epidemiological modelling. Signal processing uncovered dominant cycles
    in the data and phase space reconstruction model provided geometric pictures of
    long-term epidemic dynamics, a mechanistic model should reproduce to match the
    complexity of real-world behaviour. The three-dimensional embedding space of the
    empirical attractors indicates the minimum dimensionality required for a mechanistic
    model to reproduce diagnosed dynamics. The phenomenological model extracted from
    the observed scarlet fever signal shows that diagnosed dynamics can be captured
    by an ODE model composed of second-order polynomial interaction terms. This can
    guide the selection of appropriate functional responses in a mechanistic model.


    In Chapter 11, we shall continue the disease application by investigating how
    extreme value statistics can be used to probabilistically model the noise isolated
    from observed data.'
