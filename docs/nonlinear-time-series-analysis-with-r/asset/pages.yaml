    # 8.5 Real-World Application


    A question in the epidemiological literature is whether outbreaks of infectious
    diseases interact. Using linear correlation and regression techniques, Rohani
    et al. (2003) found evidence of interactive disease dynamics between measles and
    whooping cough in five European cities. Since correlation and regression results
    do not imply causation, and linear techniques are not reliable when applied to
    data governed by nonlinear dynamics, we apply CCM to test multilayer dynamics
    in disease data first diagnosed with deterministic nonlinear structure. In particular,
    we test interactive dynamics between weekly weeks of scarlet fever and measles
    in New York City for the pre-vaccination period 1915–1947 (1722 observations)
    (Source: Project Tycho, http://www.tycho.pitt.edu/index.php). These data are found
    in the disease_1915.csv file in the C:/ directory of the book''s materials.


    We initially applied the Toeplitz method of signal analysis to test for structured
    variance (i.e. a signal). We isolated a signal in the scarlet fever series accounting
    for 72% of variation in the series from the mean. The signal is dominated by a
    strong typical annual cycle (62%) and semiannial (4%) cycles, where the percentages
    in parentheses measure the relative strengths of component cycles in accounting
    for overall variation. We isolated a signal of moderate strength in the measles
    series accounting for about 60% of variation in the series (window=520). The signal
    is dominated by a relatively strong annual cycle (30%), a 2.5-year cycle (13%),
    a 2-year cycle (9%) and a 37-month cycle (7%). Pre-vaccination cycling in measles
    was largely driven by school terms, since school-age children were the group for
    transmission (Bjørnstad et al., 2002). Plots of the two disease series (grey curves)
    and their respective isolated signals (black curves) show visual evidence that
    the signals successfully capture much of the observed variation in the data (Fig-'
