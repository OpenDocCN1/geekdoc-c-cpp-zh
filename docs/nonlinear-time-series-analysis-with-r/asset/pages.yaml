  md: "# 9\n\n# Phenomenological Modelling\n\n> In solving a problem of this sort,\
    \ the grand thing is\nto be able to reason backward.\n\nArthur Conan Doyle, A\
    \ Study in Scarlet\n\n# 9.1 Introduction\n\nPhenomenological models mathematically\
    \ describe relationships among empirically observed phenomena without attempting\
    \ to explain the underlying mechanisms (Hilborn and Mangel, 1997). Within the\
    \ context of NLTS , phenomenological modelling goes beyond phase space reconstruction\
    \ to extract equations governing real-world dynamics (Baker et al., 1996; Dong\
    \ et al., 2015; Guesbet and Maquet, 1992; Breeden and Huber, 1990; Brunton et\
    \ al., 2016). Brunton et al. (2016) explain that phenomenological modelling allows\
    \ us to ‘distill’ physical models of dynamical processes from big data. ...to\
    \ extrapolate the dynamics beyond the attractor where they were sampled and constructed\
    \ (p. 1). Data-driven phenomenological modelling is a valuable intermediary between\
    \ empirical observation and theory, because reliable explanation depends on accurate\
    \ descriptions of things actually work.\n\nIn this chapter, we illustrate phenomenological\
    \ modelling by showing how it works ‘in reverse’ to extract the Lorenz equations\
    \ from chaotic time series solutions: first from all three solutions and then\
    \ from just one. Long-run dynamics of the Lorenz model are captured by the famous\
    \ butterfly attractor, which successful phenomenological representations replicate.\n\
    \n# 9.2 Components of a Phenomenological Model\n\nPhenomenological models in NLTS\
    \ are systems of first-order ordinary differential equations (ODEs), often expressed\
    \ as polynomial equations of interacting variables:\n\n```\n$$\\frac{dx}{dt} =\
    \ \\dot{x} = \\alpha_1 + \\alpha_2z + \\alpha_3y + \\alpha_4yz + \\alpha_5x +\
    \ \\alpha_6xz + \\alpha_7xy + \\alpha_8xyz$$\n$$\frac{dy}{dt} = \\dot{y} = \\\
    beta_1 + \\beta_2z + \\beta_3y + \\beta_4yz + \\beta_5x + \\beta_6xz + \\beta_7xy\
    \ + \\beta_8xyz \\quad (9.1)$\n$$\frac{dz}{dt} = \\dot{z} = \\gamma_1 + \\gamma_2z\
    \ + \\gamma_3y + \\gamma_4yz + \\gamma_5x + \\gamma_6xz + \\gamma_7xy + \\gamma_8xyz$$\n\
    ```"
  merge: -1
  pgno: 274
