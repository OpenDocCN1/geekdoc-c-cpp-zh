  md: '# 4

    The Features of Chaos


    > ''And, while Belbo''s head followed the pull of the wire, his body at first
    in its final spasms, then with the disarticulated agility of a wooden marionette,
    arm here, leg there, described other arcs in the void, arcs independent of the
    head, the wire, and the sphere beneath.''


    Umberto Eco, Foucault''s Pendulum


    # 4.1 Introduction


    There is more than one strangeness in strange attractors. One so-called ''sensitivity
    to initial conditions''. A strangeness is dynamical in character, a quantitative
    measure of this sensitivity is given by the Lyapunov exponents, which reflect
    the average rate of divergence (if any) between two neighbouring trajectories.
    The dynamic ''strangeness'' of the system has its counterpart in the ''strangeness''
    of the attractor''s geometry and concerns with the texture woven by the system
    in phase space during its time evolution. Fractal dimensions are measures of such
    strange geometries.


    Lyapunov exponents are among the most famous quantities to characterize chaotic
    phenomena. As we have already seen, the nonlinear logistic map has one Lyapunov
    exponent, which can be negative, zero or positive. For a continuous system $\mathbf{x}(t)
    = [x_1(t), x_2(t), \dots, x_r(t)]$ in an $r$-dimensional physical space, there
    are as many exponents as space axes. Suppose the dimension of the phase space
    is 3 and the space axes are $(x, y, z)$. In this case, there are three Lyapunov
    exponents, $\lambda_1, \lambda_2, \lambda_3$. It may happen that $\lambda_1 >
    0, \lambda_2 = 0, \lambda_3 < 0$ (the convention is to order the exponents according
    to their magnitude, starting with the largest). This means that in the $x$ direction
    there is an exponential divergence of initially close trajectories, in the $z$
    direction convergence and in the $y$ direction neither a divergence, nor asymptotic
    stability.


    The set $\lambda_1, \lambda_2, \lambda_3$ is a measure of the contraction or expansion
    of the system in phase space. If one of the exponents is positive, then there
    are strong clues that the system is chaotic. Hence, from a practical point of
    view, it should be enough to test if the maximum Lyapunov exponent is positive.
    This is exactly what we will do in Section 4.2.


