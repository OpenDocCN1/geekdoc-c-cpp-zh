  md: '# Introduction


    sent’ when ‘public policy and public safety are at stake’. The European Commission''s
    Joint Research Centre conducts a formal audit of models used to assess the impacts
    of EU initiatives, legislation and policy.


    NLTS facilitates well-conducted scientific inquiry by providing a collection of
    mathematically rigorous procedures that help practitioners to extract information
    on real-world dynamics from observed data that often have a complex, highly volatile
    and random amplitude. Applied science disciplines conventionally presume that
    apparent randomness of volatile data reacts most from exogenous shocks to inherently
    stable systems (Feder, 1979; Uusito et al., 2015), and to stochastic methods without
    further justification. Alternatively, the theory of randomness teaches us that
    mathematically random output can be generated by both physically random (indeterministic)
    and physically nonrandom (deterministic) processes (Horan, 1994), and breakthroughs
    in nonlinear dynamics demonstrate that parsimonious deterministic models can produce
    surprisingly irregular and complex behaviour (Glendinning, 1994).


    NLTS allows us to replace replacement of stochasticity with empirical evidence.
    The data themselves serve as our initial guide for ascertaining whether observed
    volatility is driven by stochastic or deterministic nonlinear real-world dynamics.
    This distinction matters critically for both theory and its practical application.
    For example, the efficient-markets hypothesis in economics is based on the presumption
    that market instability results from exogenous shocks to otherwise stable market
    states. The hypothesis holds that markets tend to equilibrate in response to these
    shocks as economic agents process all available information in adjusting supply
    to demand (Fama, 1970). Observed volatility reflects corrective supply and demand
    adjustments. The hypothesis supports laissez-faire market policies that do not
    interfere with corrective adjustments.


    The failure of the efficient-markets hypothesis to predict the 2008 financial
    crisis awoke the profession to another possibility: real-world markets do not
    naturally liberate but be inherently unstable. Consequently, The Economist recommended
    that ‘like physicists, [economists] should study instability instead of assuming
    that economies naturally self-correct’ (Economist, 2016a). In striving to understand
    the economics of market instability, economists returned to the earlier work of
    Minsky (1992), who developed the financial hypothesis explaining how financial
    booms breed their own busts (see also Economist, 2016b). According to this hypothesis,
    markets do not provide a natural corrective mechanism, and public intervention
    should be geared to smoothing boom and bust cycles, and buffering their negative
    impacts on consumers and producers (Huffaker et al., 2016a).'
  merge: -1
  pgno: 13
