    | 0.0 | 7.0 | 8.6 | 8.7 |

    | 7.0 | 0.0 | 6.4 | 8.6 |

    | 8.6 | 6.4 | 0.0 | 3.0 |

    | 8.7 | 8.6 | 3.0 | 0.0 |


    Step 3 specifies threshold distance $\epsilon = 6.5$. We observe from the distance
    matrix that there are four distances below the threshold (excluding the diagonal
    distances), so that the fraction of distances below the threshold is $4/(4)(3)
    = 0.33$. We numerically calculate this fraction by first excluding the diagonal
    distances in the distance matrix (Step 3a). This is done by putting the zero distance
    between a point and itself above the threshold so that it is not counted. We then
    count the nondagonal distances under the threshold (Step 3b). If we relax the
    threshold to $\epsilon = 7.1$, the fraction of distances below the threshold increases
    to 0.5. Step 4 computes a correlation integral as the fraction of distances below
    the threshold.


    As explained in Chapter 4, the estimated correlation dimension of an attractor,
    $D_2$, is the exponent in a power law scaling the correlation integral to distances
    between:


    ```

    $C(\epsilon; N) \sim ke^{D_2}$

    ```


    We can solve for $D_2$ by first taking the logarithm of both sides and then taking
    a derivative $\epsilon \to 0$ and $N \to \infty$. Using this derivative to directly
    compute $D_2$ is generally infeasible in practice because the smallest $\epsilon$
    is bounded below by the shortest distance between two points on the reconstructed
    attractor, and the largest $N$ is bounded by the length of the time series and
    the magnitude of estimated embedding parameters.'
