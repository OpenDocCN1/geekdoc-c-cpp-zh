    The so-called ‘Theiler window’, mentioned earlier, deserves further comment, since
    it will reappear several time in the following, in particular cases for estimating
    invariants, as the maximum Lyapunov exponent or the correlation dimension. In
    fact, if the estimation procedures are based on the comparison between two or
    more Takens vectors, for instance their mutual distance, then the resulting estimates
    may be biased when the Takens vectors considered are not statistically independent.
    This may occur if points in phase space are close to each other because they are
