    et al. (2004) for a detailed discussion of issues concerning the definition, implementation
    and estimation of $S_p(k)$.


    The null hypothesis we test is that of independence, and we do this by resorting
    to a permutation scheme. The original sequence is randomly permuted, and the measure
    $S_p(k)$ is estimated on this new sequence. This procedure is repeated $B$ times
    ($B = 100-1000$) to obtain the bootstrap distribution of $S_p(k)$ under the null
    hypothesis and consequently the confidence intervals.


    We end this by mentioning that the moving block bootstrap (MBB) (see Appendix
    B) can be exploited as a test for independence. It has been applied to binary
    sequences of 0s and 1s by Gonzalez et al. (2006) on the basis of the following
    idea. Recall that, regarding data, instance realizations of i.i.d. binomial variables,
    the standard error of the estimator of the $p$ of 0s in the sequences is given
    by $\hat{\sigma} = \sqrt{\hat{p}(1-\hat{p})}$, where $\hat{p}$ denotes an estimate
    of $p$. In this instance, both the i.i.d. bootstrap and the MBB give the same
    results. If there is some form of dependence, that is, if the observations can
    no longer be considered realizations of mutually independent random variables
    with the same distribution function, the estimate given by the i.i.d. bootstrap
    is no longer valid, but the MBB is able not only to reveal the dependence but
    also to estimate the ‘true’ standard error $\sigma$.


    # 5.4 Surrogate Test


    Surrogate data tests are based on resampling methods: the original series is resampled,
    but with the constraint that one or more parameters are fixed. A very simple example,
    let us assume that we wish to test the hypothesis of independence. We shuffle
    the data so that each surrogate consists of the same data as in the original series,
    but now in a random temporal order. All the means have the same values (fixed
    parameters) as before, but the serial correlations might be significantly different
    in the original data and in the shuffled surrogates.


    The method of surrogate data was introduced by Theiler et al. (1992) and needs
    the following ingredients:


    +   1. The null hypothesis $H_0$ regarding the process that has generated the
    observed data.


    +   2. An ensemble of $B$ resampled series, called surrogate series, consistent
    with $H_0$, that is, considered as different realizations of the hypothesized
    process.


    +   3. A discriminating statistic that is computed on the surrogates and gives
    the distribution of this statistical ensemble.


    +   4. The significance level of the test, which is derived by comparing the value
    of the parameter estimated on the original series with that obtained on the surrogate
    distribution.


    For instance, suppose we have observed a time series that we presume has some
    degree of nonlinearity. We choose as the null hypothesis $H_0$: the time series
    has been generated by a Gaussian linear process. We generate $B$ new series according
    to this hypothesis, namely $B$ Gaussian linear series. Both for the original series
    and for each'
