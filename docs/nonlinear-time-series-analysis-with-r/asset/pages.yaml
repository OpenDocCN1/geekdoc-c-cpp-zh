  md: '# 1 Why Study Nonlinear Time Series Analysis?


    Nonlinear time series analysis (NLTS) requires time series data on only a single
    variable to diagnose, reconstruct, characterize and model the dynamics of the
    real-world system generating the data. This is possible because any single variable
    in an interdependent dynamic system encodes the history of its interactions with
    other system variables. The famous naturalist John Muir (1911) intuited this result
    in the early twentieth century, observing: ''When we try to pick something up
    by itself, we find it hitched to everything else in the universe.''


    Perhaps the most compelling reason for studying NLTS is that it facilitates scientific
    inquiry. However, demonstrating how NLTS diagnostics fit into the scientific method
    is complicated by the lack of consensus regarding what method is in the first
    place. The Stanford Encyclopedia of Philosophy concludes that ''there is not any
    unique, easily described scientific method'' because ''scientific activity varies
    so much across disciplines, times, places, and scientists that any account manages
    to unify it will all consist of overwhelming descriptive detail, or trivial generalizations''
    (Andersen and Hepburn, 2016).


    A conventional view is that scientific inquiry cycles between inductive reasoning
    that converts regularities in data into testable hypotheses, and deductive reasoning
    that elevates those to theories whose predicted consequences are corroborated
    by further observation or experiment (Andersen and Hepburn, 2016). This view is
    widely criticized as an overly simplistic representation of how science converts
    inquiry into knowledge. For one thing, there has been unending disagreement over
    epistemic issues, including the proper balance between empirical observation and
    deductive reasoning on the one hand the requirements of corroboration on the other.
    Moreover, the view excludes human, social and political aspects of science, including
    the talent, imagination and objectivity of scientists; the benefits of transdisciplinary
    collaboration; and disincentives created by science and political communities
    that discourage researchers from undertaking truly novel research projects'
  merge: -1
