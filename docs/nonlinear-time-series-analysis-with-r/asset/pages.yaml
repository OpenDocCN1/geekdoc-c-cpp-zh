    Step 1 embeds the series, and then the R routine d2(tseriesChaos) is used to compute
    several correlation integrals, each of which varies over the distance threshold
    for a fixed embedding dimension (Steps 1b, c). The D2(tseriesChaos) requires inputs
    including the series x, the maximum number of embedding dimensions for which to
    plot correlation integrals, the embedding dimension d, the Theiler window omitting
    pairs of points in the distance matrix with time indices differing by less than
    tw that supposedly correlated points are not mistaken for the attractor''s geometry
    (Kantz and Schreiber, 1997), and a minimum threshold distance eps.min. There is
    no rule for setting eps.min. In Step 1b, we set eps.min as a proportion r of the
    maximum distance in the distance matrix. Step 1c computes the correlation integral
    for each embedding dimension up to mmax (Figure 7.2a).


    The correlation integrals are plotted against distance thresholds ε on a double
    logarithmic scale that we can easily detect whether the data exhibit a power relationship
    (7.2) to estimate the correlation dimension v. The power law holds for a scaling
    range of ε for which the plots drawn for embedding dimensions are reasonably parallel
    lines . The correlation dimension D2 is estimated as the slope of these lines.
    This provides evidence of self-similar geometry in a reconstructed attractor,
    because the scaling exponent D2 is independent of scale (i.e. of m). Put another
    way, the attractor''s correlation dimension is independent of the dimensionality
    of phase space in which it is embedded. We can easily identify a scaling r in
    the correlation integrals computed from the Lorenz (Figure 7.2).


    After the problems with attempting to estimate the correlation dimension D2 from
    the slope of the correlation integral (Theiler, 1990). Consequently, Step 2 computes
    D2 by formulating a user-defined cd.takes to compute the Takens estimator. The
    Takens estimator is a maximum likelihood procedure that avoids the need to compute
    the slope (Takens, 1985):


    > $D_2(\varepsilon_0) = -log\frac{\varepsilon_{i,j}}{\varepsilon_0} \quad (7.3)$


    Here, $\varepsilon_0$ is an upper bound on the distance threshold and (·) is an
    arithmetic average of the logarithms of all distances less than the upper bound
    (Theiler, 1990).


    Step 3 of Code 7.3 plots the correlation dimension D2 against the embedding dimension
    m (Figure 7.2b). The estimated level is where the plot saturates at v $\approx$
    2.07,'
