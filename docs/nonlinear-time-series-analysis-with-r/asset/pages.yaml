  md: "# Linear and Nonlinear Dynamic Behaviour\n\nWe proceed by linearizing the map\
    \ around the fixed point. Let $x_t$ be the value of an iterate close to the fixed\
    \ point $x^*$ and let $\\delta x_t$ be the distance $|x^* - x_t|$, with $\\delta\
    \ x_t \\ll 1$. If $x_t > x^*$, for example, $x_t = x^* + \\delta x_t$. The iterate\
    \ at the subsequent time step\n\n```\n$x_{t+1} = x^* + \\delta x_{t+1} = f(x^*\
    \ + \\delta x_t)$ (2.9)\n```\n\nExpanding $f(x_t)$ as a Taylor series around $x^*$\
    \ gives\n\n```\n$x_{t+1} = f(x_t) \\approx f(x^*) + \\frac{df(x_t)}{dx_t} \\delta\
    \ x_t\\n\\approx x^* + \\frac{df(x_t)}{dx_t}|_{x_t=x^*} \\delta x_t$\n```\n\n\
    where we have substituted the definition of a fixed point from eqn (2.3) into\
    \ the second equation. Equating the second equation with eqn (2.9) results in\
    \ the linearized map\n\n```\n$\\delta x_{t+1} = \\frac{df(x_t)}{dx_t}|_{x_t=x^*}\
    \ \\delta x_t = f'(x^*) \\delta x_t$ (2.10)\n```\n\nThe term $f'(x^*)$ is the\
    \ fixed point multiplier:\n\n```\n$m = \\frac{df(x_t)}{dx_t}|_{x_t=x^*} = f'(x^*)$\
    \ (2.11)\n```\n\nEquation (2.10) has the same features as the linear equation\
    \ (2.1), $N_{t+1} = rN_t$, with $r = f'(x^*)$. Therefore, the same reasoning applied\
    \ converges, or diverges, the fixed point $x^*$ if $|f'(x^*)| < 1$, or $|f'(x^*)|\
