    Code 9.2 formulates a user-defined function polynomial_ud that computes nontrivial
    expansions. It requires input of the embedding dimension $m$ (i.e. the number
    of variables in the expansion) and the polynomial range parameter $M_p$. The function
    includes several statements to accommodate the polynomial ranges $M_p=2, 3, 4$
    ($m=2, 3$) and $M_p=2$ ($m=5$). It is straightforward (although tedious) to augment
    the code to accommodate other combinations. We are working with data generated
    by the Lorenz equations, we set $m=3$ and $M_p=2$. The user-defined function first
    specifies the monomial terms generated by combinations of $m$ and $M_p$ to use
    as leaves in output. The function is composed of two loops. Loop $n$ computes
    the powers in each monomial term using eqns (9.4). The output of this is a matrix
    containing powers like those computed in Table 9.2. Loop $i$ then populates the
    monomial terms with observed time series data. Finally, the function relies on
    the R package mpoly (Kahle, 2015) to express the monomial terms symbolically.


