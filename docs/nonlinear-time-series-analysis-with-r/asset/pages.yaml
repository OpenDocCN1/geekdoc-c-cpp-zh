    +   * They can be used to characterize the dynamics of variable interactions:
    for example, whether an incremental increase in one variable drives a marginal
    increase/decrease in the growth rate of another, and whether these dynamic interactions
    follow systematic patterns over time.


    +   * They provide an analytical framework for data-driven science still searching
    for credible theoretical explanation.


    +   * They set a descriptive standard for the real world operates so that theory
    is not misdirected in explaining fanciful behaviour.


    The success of phenomenological modelling depends critically on selection of governing
    parameters. Model dimensionality and the time delays used to synthesize dynamic
    variables are guided by statistical tests for phase reconstruction. Other regression
    and numerical integration parameters can be set on a trial-and-error basis within
    ranges providing numerical stability and successful reproduction of empirically
    detected dynamics.


    In this chapter, we have illustrated phenomenological modelling with solutions
    of the Lorenz model so that we would recognize the dynamics that needed to be
    reproduced. In Chapter 10, we extract a phenomenological model from real-world
    data.'
