  md: '# 11


    # Extreme Value Statistics


    ''Mr. Holmes, they were the footprints of a gigantic hound!''

    Arthur Conan Doyle, The Hound of the Baskervilles


    # 11.1 Introduction


    In Chapter 6, we used singular spectrum analysis to separate signal (capturing
    structured variation) from noise (capturing residual unstructured variation) in
    an observed time series. Positive (negative) noise measures the amount by which
    the time series exceeds (falls below) the signal. These discrepancies may include
    irregular behaviour falling outside detected behavioural patterns, behaviour following
    detected oscillatory patterns but at unexpectedly high or low amplitudes, oscillatory
    behaviour that cannot be resolved with limited data. A core objective of public
    policy is to mitigate extreme events such as floods, droughts or epidemics, whether
    they occur as signal or noise. We investigate the use of value statistics (EVS)
    to probabilistically model extreme events separated from unstructured noise. EVS
    models extreme events that are statistically independent (Katz, 2010). This condition
    is promoted by applying EVS to unstructured residual noise separated from observed
    time series data in signal processing. We apply a version of EVS that computes
    the likelihood of extreme discrepancies exceeding a selected value within a given
    time interval. In theory, extremes follows a generalized Pareto (GP) distribution,
    and we run diagnostics to determine how well the data actually fits this distribution.
    We find a reasonable fit, we can invert the GP distribution to solve for quantiles
    providing a useful diagnostic: return-level plots. Return-level plots show the
    return periods expected before particular extreme noise levels (return levels)
    are realized.


    # 11.2 The Generalized Pareto Distribution


    The GP cumulative distribution gives the conditional probability that a random
    variable X exceeds an observed value x given that X exceeds a threshold value
    u (Katz et al., 2005):


    ```

    P\{X > x | X > u\} = \begin{cases} 1 - (1 + \frac{\xi(x-u)}{\sigma})^{-1/\xi}
    & \text{for } \xi \neq 0 \ 1 - e^{-(x-u)/\sigma} & \text{as } \xi \to 0 \end{cases}
    \quad (11.1)

    ```'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 314 Extreme Value Statistics


    In eqn (11.1), $\sigma > 0$ is the scale parameter, and $-\infty < \xi < \infty$
    is the shape parameter determining whether the GP conforms to a light-tailed exponential
    distribution ($\xi = 0$), a heavy-tailed Pareto distribution ($\xi > 0$) or a
    bounded beta distribution ($\xi < 0$). Applying the definition of conditional
    probability


    $$P\{X > x\} = P\{X > x \mid X > u\}P\{X > u\}$


    we convert eqn (11.1) to the more unconditional distribution


    ```

    $$P\{X > x\} = \left[ \begin{array}{ll} 1 - (1 + \frac{\xi(x-u)}{\sigma})^{-1/\xi}
    \frac{k}{n} & \text{for } \xi \neq 0 \ (1 - (x-u)/\sigma)\frac{k}{n} & \text{as
    } \xi \to 0 \end{array} \right]$ (11.2)$

    ```


    In this equation, we estimate $P\{X > u\}$ as the sample proportion of observations
    over the threshold $u: k/n$, where $k$ is the number of exceedances and $n$ is
    the sample size.


    We compute quantiles by inverting the unconditional GP distribution (11.2) to
    solve for $x$ in terms of $P\{X > x\}$. In particular, we solve for the value
    of $x$, $x_m$, that exceeds the threshold $u$ once every $m$ periods. Then we
    set $P\{X > x\} = 1/m$ and solve for $x_m:$


    ```

    $$P\{X > x\} = 1/m = \left[ \begin{array}{ll} 1 - (1 + \frac{\xi(x-u)}{\sigma})^{-1/\xi}
    \frac{k}{n} & \text{for } \xi \neq 0 \ (1 - (x_m-u)/\sigma)\frac{k}{n} & \text{as
    } \xi \to 0 \end{array} \right]$ (11.3)$

    ```


    The resulting quantiles (Gilleand and Katz, 2013)


    ```

    $$x_m = \left[ u + \sigma \left[ \frac{mk}{n} \right]^{\xi} - 1 \right] \text{for
    } \xi \neq 0 \ u + \sigma \log(\frac{mk}{n}) & \text{as } \xi \to 0 \right]$ (11.4)$

    ```


    The $return$ level $x_m$ is the noise level that we expect to be exceeded every
    $m$ observations or time periods. By another way, the $return$ time $m$ is the
    expected waiting time before the noise level $x_m$ is exceeded. The $return-level$
    plots graph return levels against increasing return times.


    # 11.3 Extreme Value Statistics with R


    Code 11 computes return-level plots with a 95% confidence band for positive and
    negative noise discrepancies. Negative noise is simply positive noise multiplied
    by $-1$. We first model the positive noise separated from the pre-vaccine New
    York scarlet cases in Chapter 10. Initially, we plot the noise to visualize an
    initial estimate'
