  md: "# 34 Linear and Nonlinear Dynamic Behaviour\n\ntive dependence on initial conditions\
    \ renders chaotic dynamics unpredictable. A tiny imprecision in measuring initial\
    \ conditions results in exponentially large imprecise regarding future states.\
    \ There is a well-known metaphor for this sensitivity to initial conditions, the\
    \ so-called butterfly effect. In 1972, Edward Norton Lorenz, the 139th Annual\
    \ Meeting of the American Association for the Advancement of Science, delivered\
    \ a lecture with the title: Predictability: Does the Flap of a Butterfly's Wings\
    \ in Brazil set off a Tornado in Texas? (printed in Lorenz 1995). The phrase refers\
    \ to the idea that a tiny change in the initial conditions of the system, namely\
    \ the flapping wing, can cause catastrophic events through a chain of amplifications.\n\
    \nFinally, erratic and unpredictable dynamics surprisingly emerge from a relatively\
    \ simple deterministic model. Chaotic dynamics is not generated exogenously by\
    \ random variables or stochastic components.\n\nThe above characteristics derive\
    \ from the stretching and folding of chaotic trajectories in phase space. This\
    \ is often compared with how a baker stretches dough and folds it repeatedly.\
    \ During kneading, points in the dough that are initially close diverge substantially.\
    \ This offers an intuitive picture of why chaotic dynamics exhibit sensitivity\
    \ to initial conditions that precludes prediction and of how trajectories never\
    \ cross bounded in phase space.\n\nFigure 2.18 illustrates stretching and folding\
    \ for the logistic map in $x_t$ ($r=4$). The iterate of $x_t = 0$ is $f(x_t) =\
    \ 0$, and the iterate of $x_t = \frac{1}{2}$ is $f(x_t) = 1$. Consequently, the\
    \ half-segment $[0, \frac{1}{2}]$ is stretched over the interval $[0, 1]$ after\
    \ one iteration. In another example, the iterate of $x_t = 1$ is $f(x_t) = 0$,\
    \ and we see again the half-segment $[\frac{1}{2}, 1]$ is stretched on the whole\
    \ interval $[0, 1]$, in the opposite direction. In sum, the segment $[0, 1]$ doubles\
    \ its length on average by bending back on itself. We emphasize on average because\
    \ subsegments close to those in the central part of $[0, 1]$ may be contracted.\n\
    \n![](img/efe2ac97775c9e906c844c2137d40d86_44_0.png)\n\n**Fig. 2.18** (a) Graphical\
    \ representation of the mechanism of stretching and folding for the logistic map.\
    \ (b) The same process at the following iterate."
