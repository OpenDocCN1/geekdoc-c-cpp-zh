  md: '# 8 Why Nonlinear Time Series Analysis?


    (Huffaker et al., 2016b; Huffaker et al., 2016a).


    In Chapter 10, we provide a capstone to Part 2 by taking the reader step by step
    through the application of NLTS to diagnose and model system dynamics generating
    real-world infectious infectious disease epidemic data.


    # 1.3 The Contribution of NLTS Diagnostics to Theoretical Modelling


    We view NLTS diagnostics as a precursor to (and not a replacement for) theoretical
    modelling attempting to explain observed natural behaviour. NLTS provides a mathematically
    rigorous means of extracting as much information as we can from. NLTS data diagnostics
    provide a rigorous empirical benchmark to guide specification and testing of theoretical
    models corresponding to reality. Signal processing patterns in data that should
    be reproduced by theoretical models. Phase space reconstruction provides a geometric
    structure of real-world dynamics that should be reproduced by attractors simulated
    by theoretical models. For example, simulated dynamics approaching a stable equilibrium
    would not correspond to aperiodic cycling characterizing an empirically reconstructed
    attractor indicates the minimum dimensionality required by a theoretical model
    to reproduce diagnose long-term dynamics. Convergent mapping methods provide empirical
    evidence of causal interactions among observed variables that belong to the same
    real-world dynamic system. Phenomenological modelling sheds light on the type
    of interactions among system variables capable of reproducing an empirically reconstructed
    attractor. This offers valuable guidance in selecting among the wide variety of
    functional responses available to model theoretically positioned interactions
    among system variables.


    NLTS diagnostics open the door to true interdisciplinary theoretical modelling.
    Real-world dynamics systems integrate climatic, environmental, geopolitical and
    sociological processes whose interactions determine natural behaviour over time
    and space. Yet, conventional practice in applied science disciplines to delegate
    random exogenous forces. For example, the risk literature in agricultural economics
    relates natural processes to the realm of uncertainty, generally interpreted to
    mean that agricultural decisionmaking events are inherently owing to uncontrollable
    and random events, including weather, diseases, insect infestations, technological
    innovations, government, policies and so on (Feder, 1979). These events are certainly
    not viewed as inherently random by climatologists, entomologists, political scientists
    and so on. If we diagnose deterministic nonlinear dynamics in observed data, we
    must integrate multidisciplinary knowledge to formulate theoretical explanations
    corresponding to reality.


    # 1.4 Caveats in Application


    There are important caveats to applying NLTS diagnostics to short, noisy, and
    non-stationary time series data frequently encountered in empirical work. Faced
    with these data limitations, one gives up the ambition of reconstructing the very
    fine structure'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Summary 9


    of the real-world attractor including complex folding and fractal patterns (Vautard,
    1999). One is limited to reconstructing a sampling or a skeleton of a real-world
    attractor (Ghil *et al.*, 2001), and cannot hope to recover full dynamics from
    a recording of a single variable (Schreiber, 1999). In the worst case, NLTS may
    be unable to provide an adequate sampling of a real-world attractor if available
    data are insufficiently informative.


    Consequently, the literature strongly warns against NLTS diagnostics as positive
    evidence that natural systems are chaotic. Chaotic attractors exhibit distinct
    topological features, including self-similarity, and sensitive on initial conditions.
    Topological measures of these features are best met with vast amounts of high-quality
    data provided by laboratory experiments designed specifically for investigating
    chaos. The measures are unreliable when estimated from short and noisy real-world
    data (Schreiber, 1999; McSharry, 2011). In contrast, the topological measures
    perform reliably when the focus of inquiry is relaxed from attempting to prevent
    the existence of deterministic chaos in observed data as gauging whether deterministic
    dynamics might explain observed volatility (Schreiber, 1999). Our NLTS strategy
    follows this.


    or that a low-dimensional nonlinear attractor may not exist in the first place
    (Williams, 1997). When NLTS diagnostics fail, linear stochastic approaches remain
    a viable alternative. However, we propose that NLTS diagnostics be applied before
    preferring linear stochastic structures that potentially misrepresent real-world
    dynamics.


    # 1.5 Summary


    Nonlinear time series analysis (NLTS) provides a mathematically rigorous collection
    of techniques designed to reconstruct real-world dynamics from time series data
    on a single variable or multiple causally related variables. NLTS facilitates
    scientific inquiry that emphasizes strong support evidence, conducted and thorough
    inquiry, and realism. Data provide an evidentiary portal to a reality to which
    we have limited access. Random-appearing data do not prove that underlying dynamic
    process are subject to exogenous-random forces. The possibility exists that observed
    volatility is generated by inherently unstable, deterministic and nonlinear real-world
    dynamics. NLTS allows the to speak regarding which type of system dynamics generated
    them. It is capable of detecting linear as well as nonlinear deterministic system
    dynamics and of diagnosing the presence of linear stochastic dynamics. Our objective
    is to use NLTS to uncover the structure most closely responding to reality, whether
    that be linear, nonlinear, deterministic or stochastic. Accurate diagnosis of
    real-world dynamics from observed data is crucial to develop valid theory and
    to formulate public policy based on theory. Because of the short and noisy observed
    time series data that are frequently encountered in empirical work, NLTS diagnostics
    may fail to provide an adequate sampling of real-world dynamics. However, we propose
    NLTS diagnostics be applied before assuming linear stochastic structures that
    may not correspond to real-world dynamics.'
