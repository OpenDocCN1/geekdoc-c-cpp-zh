    Where does this leave us? Ideally, data preprocessing has eliminated nonstationarity
    in the data and mitigated the impact of noise. We say mitigated, because we cannot
    reasonably expect that SSA will filter all the noise from complex real-world data.
    The signal might still be corrupted by lingering noise (i.e. unstructured variation).
    Consequently, our remaining task in diagnosing deterministic nonlinear structure
    in the potentially noisy signal is to eliminate linear stochastic dynamics as
    a likely driver. We do this with surrogate data testing, covered in the next chapter.'
