- img_proc: true
  md: '# 7.4.4 Entropy Complexity Measure


    Permutation entropy (Brandt and Pompe, 2002) is a popular probability-based complexity
    measure that is used as a discriminating statistic in surrogate data tests (Gotoda
    and Kobayashi, 2017). It modifies the classic Shannon measure for application
    to noisy time series data. We briefly summarize important properties of H from
    Chapter 5: (1) H measures the information content in the time series; (2) if H
    = 0, the time series is perfectly predictable from past values; and (3) H achieves
    a maximum value when time series values are independent and identically distributed.
    In sum, relatively large values of H indicate more complex random behaviour as
    opposed to low-dimensional deterministic behaviour.


    We have also learned from Chapter 5 that H is a function of a discrete variable
    X. In the context of time series analysis, X represents a particular realization
    of a time series $\{x_t\}$, with support $S(X)$ providing the set of all possible
    values that X can take. When X can take infinite number of values, conventional
    practice is to partition these into a finite sequence (library) of symbols. Permutation
    entropy pursues a data-driven approach by taking partitions based on comparison
    of neighbouring time values. Following the notation of Brandt and Pompe (2002),
    the measure is based on $n$ permutations of order $n$, which enumerates the possible
    orderings of $n$ different numbers. The relative frequency of each permutation
    is given by


    ```

    p(\pi) = \frac{|{t \leq T - n, (x_{t+1},...,x_{t+n}) \text{ has type } \pi\}|}{T
    - n+1}

    ```


    where NUM means ''the number of'' and $T$ is the time series length. Equation
    (7.4) is a probability density function (PDF) extracted from time series data
    (Kowalski et al., 2012). It can be computed with the R package pdc (Braidmaier,
    2015).


    The permutation entropy measure is a function of this PDF:


    ```

    H(n) = -\sum p(\pi) \log p(\pi)

    ```


    where the sum runs over all $n$ permutations of order $n$ ($n \geq 2$). In summary,
    H(n) measures the information in the time series gained from comparing $n$ consecutive
    values. It lies within the interval $0 \leq H(n) \leq \log n!$, where the upper
    bound indicates the potential for structural dynamics. We shall a completely random
    system and an intermediate value indicate the potential presence of We compute
    $H(n)$ with the R package pdc (Braidmaier, 2015) in our surrogate data testing
    code.


    # 7.5 Rank Order Statistics


    We use non-parametric rank statistics to test the null hypothesis of linear stochastic
    dynamics in surrogate data testing (Theiler et al., 1992; Schreiber and Schmitz,
    2000). We need to set two parameters. One is $\alpha$, which sets the probability
    of false rejection and establishes the level of significance for the test: $(1
    - \alpha) \* 100$. The other is $k$, which determines the number of surrogates
    required for given values of $\alpha$. A twotailed hypothesis test requires $S=(2k/\alpha)-1$
    surrogates. We reject the null hypothesis if a discriminating statistic measured
    from the empirically reconstructed attractor is'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'among the $k$ largest or smallest values in the ensemble of statistics measured
    from surrogate attractors. Single-tailed tests require $S = (k/\alpha) - 1$ surrogates.
    We reject the null hypothesis if a discriminating statistic from the empirically
    reconstructed attractor is among the $k$ largest (for an upper-tailed test) or
    $k$ smallest (for a lower-tailed test). Reducing the probability of false rejection
    $(\alpha)$ or increasing $k$ enables the number of surrogates required, and produces
    more sensitive tests.


    We conduct an upper-tailed test for nonlinear prediction skill that the null hypothesis
    is rejected only when an attractor reconstructed from the time series predicts
    with more skill its surrogate counterparts. We conduct a lower-tailed test for
    the permutation entropy measure to reject the null hypothesis when the measure
    taken from the time series is significantly less than those taken from the collection
    of surrogate data vectors. We conduct two-tailed tests for the correlation dimension
    and maximum Lyapunov exponent discriminating statistics.


