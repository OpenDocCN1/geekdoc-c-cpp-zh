  md: "# 332 Appendix B\n\n# B.3 Bootstrapping in R\n\nThere are two packages for\
    \ bootstrapping in R: bootstrap and boot. As stated in the first of these, bootstrap\
    \ is of particular help for the book by Efron and Tibshirani (1993), and it gives\
    \ software (bootstrap, cross-validation, jackknife) and data discussed there.\
    \ The package boot offers a number of functions to deal with a variety of situations.\
    \ For a detailed description of the main components of the boot package and their\
    \ use, the article by Canty (2002) is recommended. For the purposes of illustration,\
    \ we show here the function boot as applied to the sample (B.1). The following\
    \ is the Code B.1 boot_std.dev R for obtaining bootstrapping estimates of the\
    \ standard deviation of the distribution of the mean:\n\n```\n# Code B.1 Bootstrap\
    \ estimates the standard deviation\n# of the distribution of the mean\n```\n\n\
    ```\n#install.packages(\"boot\", dep = TRUE) # if necessary\n\nlibrary(boot)\n\
    x<- c(5.24, 5.55, 4.69, 6.39, 6.87, 5.15, .461, 5.20, 5.49, 4.81,\n2.74, 3.50,\
    \ 5.19, 5.40, 6.38, 6.34, 4.50, 3.17) # observed sample\nset.seed(3)\n\nsamplemean\
    \ <- function(x, d) { # estimation function\n  return(mean(x[d]))\n}\n\nb = boot(x,\
    \ samplemean, R=1000) # 1000 replications\nprint(b)\nplot(b)\n```\n\nThis code\
    \ calls the estimation function R times, and each time, a new bootstrap sample\
    \ is generated, which the statistic is calculated. Note that the number of replications,\
    \ denoted by R in the code, is the number denoted by B in our earlier discussion.\
    \ The result consists of a table and a figure. The table reports the evaluated\
    \ statistic of the observed sample:\n\nBootstrap Statistics :\n\n| original |\
    \ std. error |\n| t1* 4.9096-0.009205 | 0.228821 |\n\nRecall that we found $\\\
    hat{se}(\\hat{\\mu})=0.24$ with the analytical formula (B.2). The code also produces\
    \ a graphical plot of the bootstrap replications t*, as shown in Figure B.1.\n\
    \nIt is possible to select other estimation functions: for example, if one desires\
    \ to obtain the median, the instruction\n\n```\nsamplemedian <- function(x, d)\
    \ {\n  return(median(x[d]))\n}\n```\n\nThe replication plot can also be made by\
    \ adding to Code B.1 the lines\n\n```\nquant<-quantile(b$t[,1], probs = c(0.025,\
    \ 0.16, 0.5, 0.84, 0.975))\nquant\n168.half<- (quant[4]-quant[2])/2\n168.half\n\
    windows()\n```"
  merge: -1
