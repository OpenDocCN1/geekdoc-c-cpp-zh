  md: 'The R package glmnet (Friedman et al., 2015) runs Ridge regression, LASSO or
    a combination of the two as controlled by an elastic-net mixing parameter α. Ridge
    regression is run for α = 0, LASSO for α = 1 (the default) or a mixed approach
    bridging the gap between the two approaches for intermediate α values. A mixed
    model can increase numerical stability (by reducing variability due to extreme
    correlations) while retaining the model selection benefits of LASSO.


    Adaptive LASSO can increase the consistency of LASSO (meaning that the probability
    that the estimated coefficient approaches its true value converges to 1 as the
    sample size increases indefinitely) by computing weights differentially penalizing
    coefficients in the $\ell_1$ constraint. Adaptive LASSO has *oracle properties*;
    in other words, it performs as well as the true underlying model had been given
    in advance (Zou, 2006). The *adaptive.weights* in the R package MESS (Ekstrom,
    2015) computes weights as


    ```

    1/β^nu

    ```


