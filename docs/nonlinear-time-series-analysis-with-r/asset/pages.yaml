  md: 'Jules Henri Poincaré makes two appearances this chapter: in Poincaré’s recurrence
    theorem and in the Poincaré section. He introduced the concept of recurrence,
    namely systems, under certain conditions and after a sufficiently long but finite
    time, return to a state as close as you to the initial state. A graphical analysis
    of the recurrence states of a dynamical system can be executed through recurrence
    plots (RPs), which can be quantified using recurrence quantification analysis
    (RQA). In this chapter, we have applied RPs to the logistic map and the Lorenz
    attractor. It is important to note that methods based on RPs allow trajectories
    in the m-dimensional phase space of a system to be analysed in terms of a two-dimensional
    representation of the system''s recurrences.


    For the study of the damped driven pendulum, we have exploited the Poincaré section.
    This is constructed by converting the trajectory of a continuous dynamical system
    in an N-dimensional phase space into a discrete trajectory (i.e. a map) in an
    (N-1)-dimensional phase space. We can view this geometric construction as a ‘stroboscopic’
    representation of dynamics of the system. The damped driven pendulum is the ideal
    pendulum, introduced in Chapter 3, made more realistic by the inclusion, in addition
    to force of gravity, of further forces acting on it: a damping force and a driving
    force. The damping force takes into account possible friction with the suspension
    point and air resistance. The driving force is an external force acting on the
    bob and supplying energy to the system. A wide variety of behaviours, including
    chaotic ones, are shown by the damped driven pendulum. Here, we have studied the
    bifurcation diagram, as for the logistic map, and the particular phenomenon called
    symmetry breaking.'
