    In Step 1, we partition the oscillatory component in past and future series whose
    lengths are set by the change-point window b. For example, given a general reference
    time $t_r$, the past series begins at $t=t_r-b$ and ends at before the reference
    time, $t=t_r-1$. The future series begins with a possible forward delay of $g$
    periods at time $t=t_r+g$ and ends at $t=t_r+g+b$ (Figure 8.8a). The earliest
    possible reference time is $t_r=b+1$, since the past series begins at the first
    observation. The associated future series begins $g$ periods later and ends at
    $t=2b+g$ (Figure 8.8b).

    Lastly, the latest possible reference point is $t_r=N-b-g+1$, since the future
    series ends at the last observation $N$ (Figure 8.8c). There are $N-2b-g+1$ feasible
    reference times (windows), which we calculate by subtracting the earliest from
    the latest possible reference time plus one. Loop i iterates over the feasible
    times to generate the corresponding past and future series for each.


    ![](img/efe2ac97775c9e906c844c2137d40d86_264_0.png)


