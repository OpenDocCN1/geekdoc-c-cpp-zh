    > ''Eliminate all other factors, and the one which remains must be the deterministically''

    Arthur Conan Doyle, The Sign of the Four


    # 6.1 Introduction


    Reconstructing real-world system dynamics from a single time series is challenging
    owing to the broad menu of possible reconstructions that are available. Consider,
    for example, the four series in Figure 6.1. The periodic cycling in Figure 6.1a
    is the regular behaviour of a linear system of ordinary differential equations
    (ODEs). The aperiodic (nonrepeated) cycling in Figures 6.1b and 6.1c is induced
    exogenously by subjecting the linear model to unknown random shocks (i.e. noise)
    each period (b), and to nonstationarity generated by a slowly evolving parameter
    through time (c). Finally, the aperiodic cycling in Figure 6.1d is generated deterministically
    with the Lorenz nonlinear system of ODEs (Lorenz, 1963).


    In practice, we face a quandary over whether irregular dynamics in real world
    data should be attributed to noisy or nonlinear behaviour or to deterministic
    dynamics. Real-world data are often corrupted by noise, meaning they exhibit unstructured
    variation that does not evolve systematically with time. Noise is typically attributed
    to measurement, processing or recording errors in collecting data or to randomly
    environmental shocks (Feder, 1979; Uisalito et al., 2015). Noise obscures detection
    of systematic dynamic structure in data by decreasing the resolution of reconstructed
    attractors, and increasing the embedding dimensions required to capture noisy
    phase space dynamics (Kot et al., 1988).


    In addition, real-world data are of short duration. Noise may be due to data length
    that does not adequately capture structure in slow-moving variables. For example,
    100 years of precipitation are insufficient to detect patterns in the occurrence
    of a 100-year flood that might appear as noise in a single century. Increasing
    the sample time to 400 years allows for four repetitions of the 100-year flood,
    but this may still be too short to establish a reliable pattern. A 100-year flood
    might appear as a slow-moving linear or nonlinear trend violating the standard
    of stationarity requiring that the duration of the measurement be long compared
    with the timescales of the system (Schreiber, 1999). In a stationary time series
    exhibits similar behaviour throughout its duration (Kaplan and Glass, 1995).


    Nonlinear Time Series Analysis with R Ray Huffaker, Martin Bottinelli and Rodolfo
    Rosa, Oxford University Press (2017).

