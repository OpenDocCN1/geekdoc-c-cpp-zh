  md: '# 124 Entropy and Surrogate Testing


    In the following, we shall write $p_i$ in place of $p(x_i)$. This $H(X)$ has to
    satisfy certain requirements:


    +   1. $H$ must be continuous in all its arguments $p_i$; that is, a small variation
    in the probability distribution $p_1, p_2, \dots, p_n$ corresponds to a small
    variation in $H$.

    2. If the probabilities $p_i$ are all the same (a uniform distribution), that
    is, $p_i = 1/n$, then $H$ is a monotonically increasing function of $n$.

    3. $H$ must be a function of the probability distribution $\{p_1, \dots, p_n\}$,
    independently of how events are gathered within this distribution.


    For the last point, consider the following example. Let $X$ be a random variable
    with distribution


    $P\{X = a\} = 0.5, \quad P\{X = b\} = 0.2, \quad P\{X = c\} = 0.3$


    Where $P\{\}$ denotes the probability. We can also say that the events $\{b\}$
    and $\{c\}$ are realized half the time: when it happens, the event $\{b\}$ occurs
    with probability 0.4 and the event $\{c\}$ with probability 0.6. Then, the above
    can be written as


    $P\{X = a\} = 0.5, \quad P\{X = Y\} = 0.5, \quad P\{Y = b\} = 0.4, \quad P\{Y
    = c\} = 0.6$


    $H$ must be the same in the two cases. Shannon (1948) demonstrated that there
    is exactly one function $H$ satisfying the above requirements,


    ```

    -k\sum_{x\in S} P\{x}\log P\{x}

    -k\sum_{i=1}^n p_i\log p_i

    ```


    The constant $k$ depends on the chosen unit of measurement. For $k=1$ and logarithms
    to base 2, Shannon called $H =\sum_{i=1}^n p_i \log p_i$ the entropy of the set
    of probabilities $\{p_1, p_2, \dots, p_n\}$. With the chosen basis 2, the unit
    of measurement is the first ‘binary digit’. Tribus (Tribus and Irvine, 1971) recounts
    that Shannon told him that John von Neumann suggested the name ‘entropy’ for Shannon’s
    measure, in the following words:


    You could call entropy, for two reasons. In the first place your uncertainty function
    has been used in statistical mechanics under that name. In the second place, and
    more importantly, no one knows what entropy really is, so in a debate you would
    always have the advantage.


    Turning to $H(X)$, it should be noted that the notation $H(X)$ for the entropy
    should not be taken to mean that $H$ is a function of $X$ (i.e. of the values
    taken by $X$), but rather that it is a function of the $X$ distribution $\{p_1,
    p_2, \dots, p_n\}$. Thus, $X$ is not the argument of a function, but is instead
    a label distinguishing, for instance, the entropy $H(X)$ of the random variable
    $X$ from the entropy $H(Y)$ of the random variable $Y$.'
