  md: '# 10

    Capstone: Application of NLTS to Real-World Data


    > > ''You know my methods. Apply them.''

    Arthur Conan Doyle, The Sign of the Four


    In this capstone chapter, we illustrate how concepts in the book come together
    to allow us to diagnose real-world dynamics from observed time series data. In
    particular, we attempt to diagnose multi-strain infectious disease dynamics from
    weekly cases of scarlet fever, measles and pertussis in New York during the pre-vaccine
    period 1924-1948 (source: Project Tycho, http://www.pitt.edu/index.php). These
    data are found in the disease_1924.csv file in the C:/Data directory of the book''s
    materials. This file includes the observed time series data and the isolated signal
    and noise series.


    The diagnostic question for our application is whether observed complexity in
    the New York data is most driven by linear stochastic dynamics best modelled with
    stochastic epidemic models or by low-dimensional nonlinear dynamics more informa-'
