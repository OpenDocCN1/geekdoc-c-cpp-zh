  md: "# Analyzing Period Doubling with Bifurcation Diagrams 27\n\nWhat is a bifurcation?\
    \ A dynamical system has a bifurcation when a tiny variation of a parameter causes\
    \ a sudden qualitative change in the system's dynamics. The parameter value for\
    \ which the bifurcation occurs is called the bifurcation point. For instance,\
    \ in the case of the logistic map, the bifurcation can be shown schematically\
    \ as in Figure 2.12. We can see how, for a certain value $r^*$ of the parameter,\
    \ and at the same time the fixed point $x^*$ goes from stable (solid line) to\
    \ unstable (dashed line), and gives birth to a period-2 cycle (solid line). This\
    \ kind of bifurcation is called a flip bifurcation or a period-doubling bifurcation.\
    \ The same scheme also represents the pitchfork bifurcation. Also, in this latter\
    \ type of bifurcation, a 'stable arm', that is, a sequence of stable fixed points,\
    \ becomes unstable and, at the same time, two new stable arms are born. The difference\
    \ between the two bifurcations lies in the following: after the change in the\
    \ stability of the fixed point, for the flip bifurcation system visits alternately\
    \ the states of both arms, while for the pitchfork bifurcation system stays only\
    \ one arm, and does not visit the states of the other one. However, in the literature,\
    \ sometimes bifurcations are called 'pitchfork bifurcations'.\n\n![](img/efe2ac97775c9e906c844c2137d40d86_37_0.png)\n\
    \n**Fig. 2.12** Scheme of a flip bifurcation: for a parameter value equal to $r^*$,\
    \ the fixed point $x^*$ goes from stable (solid line) to unstable (dashed line),\
    \ also giving birth to a stable 2-period cycle (solid lines).\n\nTable 2.1 lists\
    \ the period of the attractor and the value of $r_n^*$ (with six digits) at the\
    \ point at which the cycle with period $2^n$ is born. This cycle will live up\
    \ to $r_{n+1}^*$ when the cycle with double period $(2^{n+1})$ will be born. For\
    \ instance, the stable cycle with period $2^2 = 4$ is born from the cycle with\
    \ period $2^1 = 2$ when $r_2^* = 3.449490$ and lives up to $r_3^* = 3.544090$,\
    \ when the stable cycle with greater period; $2^3 = 8$ is born. As $r$ increases,\
    \ there are cycles with greater and greater period; that is, the number of visited\
    \ states becomes larger and larger. In the interval $(r_n^*, r_{n+1}^*)$, the\
    \ period is equal to $2^n$; thus, the period increases exponentially with $r$.\
    \ One might think if $n \to \\infty$, then $r$ also approaches infinity. But this\
    \ is not true."
