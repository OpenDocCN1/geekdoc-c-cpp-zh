    # 3.4.6 Alternative Embedding Procedure


    An alternative procedure for embedding is based on principal component analysis
    (PCA). Here we give a brief outline of PCA, limited to its application to the
    embedding process; for a comprehensive treatise, see for instance Jolliffe (2002)
    (although many multivariate statistics books deal with PCA). As the name suggests,
    PCA is a statistical technique to select the most important variables from a large
    set of (possibly correlated) variables. More technically, PCA is a linear transformation
    of the'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Phase Space Reconstruction with R packages


    into a lower-dimensional space that retains the maximal amount of information
    about the variables. The earliest description of this technique was given by Pearson
    (1901), and it was later developed by Hotelling (1933).


    Suppose we have to study a system. We start with a set of h variables; then, using
    PCA, we transform the original set into a new set of uncorrelated variables, called
    principal components. Each component is derived as linear function of the original
    variables. The transformation maximizes the variance and constrains each variable
    to be uncorrelated with all the others; thus, there are as many components as
    the information is among the first few components, with a negligible gain of information
    being obtained by considering the remaining components.


    Geometrically, this means we create a new system of orthogonal axes that contains
    the greatest fraction of the total variance of the data. The principal directions
    are obtained as those eigenvectors of the symmetric autocovariance matrix that
    correspond to the largest eigenvalues. In the remaining orthogonal directions,
    the variance is small, providing no useful information about the data, so these
    directions can be ignored.


    In fact, these components are sorted in decreasing order of their contribution
    to the total variance, with the first component having the maximum variance and
    the kth component the minimum. We can decide to negate the components of lesser
    significance and retain only the relevant ones. In this manner, the retained components
    can account for most of the information present in the data, with substantially
    fewer variables than otherwise present.


    There are several differences between different packages in the R environment
    for performing PCA. In the stats package, there are two functions: princomp and
    prcomp. The function princomp uses the spectral decomposition approach (in R,
    see the methods package), while the function prcomp uses the singular value decomposition
    (in R, see the svd package).


    This latter function is known to be numerically more stable in some cases, and
    we will employ it in the following. Code 3.5 lorenz.PCA shows how it is possible
    to execute the embedding of an observed series through PCA. The ‘observed’ series
    is the first component of the Lorenz system x(t) after the transient, as was the
    case in code lorenz.attractor.R.


    ```

    # 3.5 Lorenz PCA (lorenz.PCA.R)

    ```


