  md: "# Discrete Linear Dynamics\n\n$x_{t+1} = rx_t + b \\eqno (2.1)$\n\nwhere $r$\
    \ and $b$ are constant parameters, and the initial population is $x_0$. The solution\
    \ gives the sequence of population levels over time, $x_0, x_1, x_2, \\dots$,\
    \ satisfying eqn (2.1):\n\n```\n$x_t = \\begin{cases} (x_0 - x^*)^r + x^* & \\\
    text{if } r \\neq 1 \\ x_0 + bt & \\text{if } r = 1 \\end{cases} \\eqno (2.2)$\n\
    ```\n\nThe population $x^*$ is the steady-state equilibrium defined by $x(t) =\
    \ x(t+1)$. Once the population reaches $x^*$, it remains throughout time. Generally\
    \ speaking, a steady state is a *fixed point* of $f(x_t)$; that is, the value\
    \ such that\n\n```\n$x^* = f(x^*) \\eqno (2.3)$\n```\n\nWe can solve for the steady\
    \ state by inserting $x^*$ into eqn (2.1):\n\n```\n$x^* = rx^* + b \\Rightarrow\
    \ x^* = \\frac{b}{1-r}$\n```\n\nAn equilibrium solution $x^*$ is characterized\
    \ by its stability. An equilibrium is globally stable\n\n```\n$\\lim_{t\\to\\\
    infty} x_t = x^* \\quad \\forall x_0$\n```\n\nThat is, as time approaches infinity,\
    \ the function of eqn (2.1) asymptotically converges to $x^*$ from all initial\
    \ values $x_0$.\n\nCode 2.1 numerically solves eqn (2.1) to produce time series\
    \ plots of $x_t$ for selected values of $r$. It defines the model equation, sets\
    \ model parameters, and formulates an iteration loop to solve the model through\n\
    \n```\n#Code 2.1 Numerical solution of linear difference equations (lin_sol.R)\n\
    rm(list=is(all=TRUE))#clear values between runs\n\nf.x<-function(x,r,b) {r*x+b}\
    \ #Define model equation\n\nr<-0.8\n#stability parameter\nnb<-0.5\n#model parameter\n\
    x_initial<-10\n#initial condition\nnstep<- 25\n#number of iterations\n\n#Formulate\
    \ iteration loop\nxt<-numeric()\nx<- x_initial  #initialize loop\nxt[1]<- x\n\
    for(i in 2:nstep) {\n  y<- f.x(x,r,b)\n  x<- y\n  xt[i]<- x\n}\nplot(xt,type=\"\
    b\",xlab=\"time\",ylab=\"x(t)\",ylim=c(0,10),cex.lab=1.5,cex.axis=1.2,lwd=2)\n\
    ```\n\nFigure 2.1 displays plots for the stability parameter $r$ generating stable\
    \ solutions (a, b), unstable solutions (c, d) and two-period cycling (e)."
