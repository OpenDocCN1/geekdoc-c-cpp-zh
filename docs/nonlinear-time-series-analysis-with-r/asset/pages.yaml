  md: '# Linear and Nonlinear Dynamic Behaviour


    We have to take into account the behaviour at each step; that is, we have to compute
    the average of the product of the derivatives. Taking the logarithm of both sides
    of eqn (2.22) gives


    ```

    log|f''(x_{n-1}) \cdot f''(x_{n-2}) \cdots f''(x_1) \cdot f''(x_0)|

    ```


    ```

    = log|f''(x_0)| + log|f''(x_1)| + \dots + log|f''(x_{n-2}) + log|f''(x_{n-1})|

    ```


    Considering the whole trajectory, that is, $n \to \infty$, and remembering that
    $\delta x_0 \to 0$, the Lyapunov exponent is defined as


    ```

    \lambda = \lim_{n \to \infty} \lim_{\delta x_0 \to 0} \frac{1}{n} \sum_{t=0}^{n-1}
    log|f''(x_t)| (2.22)

    ```


    We take the $n \to \infty$ to exclude the transient part of the trajectory, and
    we assume that the initial discrepancy in all initial conditions is small: $\delta
    x_0 \to 0$. For one-dimensional maps, $\lambda$ is independent of all initial
    conditions (strictly, excluding a set of measure zero), so we denote $\delta x_0$
    simply by $\delta_0$. In summary, the Lyapunov exponent represents the average
    rate of separation (expansion or contraction) per iteration of two trajectories
    on an attractor with very close initial conditions.


    From eqn (2.22), by taking the logarithms of both sides, we obtain


    ```

    \delta_n \approx e^{\lambda} \delta_0 (2.24)

    ```


    It is clear that if $\lambda < 0$, the trajectories converge, while if $\lambda
    > 0$, they diverge. In Chapter 4, we will see that multidimensional dynamical
    systems have multiple Lyapunov exponents, in which case one positive Lyapunov
    exponent is a signature of a chaotic regime.


    There is no unambiguous definition of ''chaos'' that is universally accepted.
    Here, we shall simply summarize the features that we have discussed. System dynamics
    is chaotic if it is


    +   (1) deterministic

    (2) limited

    (3) aperiodic

    (4) sensitive to initial conditions


    # 2.7.2 Lyapunov Exponent of the Logistic Map


    For the logistic map, the derivative $|f''(x_t)|$ can be analytically computed
    as (see eqn 2.12)


    ```

    f''(x_t) = r(1 - 2x_t)

    ```


    For $1 < r < 3$, the stable fixed point is $x^* = (r-1)/r$. So eqn (2.23) gives
    (see also eqn 2.13)'
