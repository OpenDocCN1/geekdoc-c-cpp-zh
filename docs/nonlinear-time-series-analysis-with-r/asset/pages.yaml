    # 4.2 Lyapunov Exponent


    Let us extend to compute the Lyapunov exponent for a one-dimensional map to a
    discrete (or continuous) $r$-dimensional system. Consider the map, without noise,
    $x_{t+1} = f(x_t)$. Let $\delta x_t$ be a small perturbation on the orbit at step
    $t$; that is, the system at step $t + \Delta t$, expanding $f(x_t)$ in a Taylor
    series, we have given


    ```

    $x_{t+1} + \delta x_{t+1} = f(x_t + \delta x_t)$

    ```


    ```

    $$\approx Df(x_t) \cdot \delta x_t + f(x_t)$

    ```


    where $Df(x_t) = J$ is the $(r \times r)$ Jacobian matrix, computed on the points
    $x_t$ of the orbit. The perturbation $\delta x_t$,どうか remains ''small'', will
    evolve according to


    ```

    $$\delta x_{t+1} = Df(x_t) \cdot \delta x_t$

    ```


    and, to $t + k$ steps, $\delta x_{t+k}$ is given by


    ```

    $$\delta x_{t+k} = Df(x_{t+k-1}) \cdot Df(x_{t+k-2}) \cdot Df^k(x_t) = Df^k(x_t)
    \delta x_t$

    ```


    where $Df^k(x_t)$ is the product of the Jacobian matrices along the trajectory.
    Let the matrix (known as the Oseledec matrix)


    ```

    $O(x, k) = \[Df^k(x_t)]^T \cdot Df^k(x_t)^{\{1/2k}}$

    ```


    where T denotes the transpose. There is a theorem, by Oseledec (1968), ensuring
    the convergence of $O(x,k)$ for $k \to \infty$, to the limit $O(x)$. This is independent
    of x for for all the vectors $x$ belonging to the basin of attraction. The logarithms
    of the $r$ eigenvalues are global Lyapunov exponents of the system. If the eigenvalues
    are computed for the matrix $O(x,k)$, they are the local Lyapunov exponents, measuring
    how a perturbation in the point $x$ moves down the trajectory in a finite $k$
    of steps. A variety of estimates have been proposed, by many others, San and Sawada
    (1985), Eckmann et al. (1986), Brown et al. (1991), McCaffrey et al. (1992) and
    Nychka et al. (1992). We neither explore the mathematical details of the theory
    nor deal with these proposed approaches (for an extended discussion of this topic,
    see Chan and Tong (2001)), but in Section 4.2 we provide a computer code to estimate
    the maximum characteristic Lyapunov exponent (MLE) in tseriesChaos.


    It is worthwhile stressing that the theory of Lyapunov exponents is based entirely
    on the mathematical structure of rational (or analytical) mechanics. This determin-'
