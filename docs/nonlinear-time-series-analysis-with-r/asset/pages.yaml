    # 6.6.1 Time-Delay Embedding


    Selecting time-delay embedding parameters is not an exact science. Our hope is
    to unearth values that result in a faithful reconstruction of the real-world phase
    space. We could employ a brute force approach by reconstructing phase spaces over
    a grid of embedding values to identify ranges providing attractors with the most
    visual regularity. However, we can use a more directed search with the aid of
    statistical tests designed to help us. Code 6.13 formulates a user-defined function
    embed_ud to run these tests for a given time series by automating routines in
    the R package tseriesChaos (Di Nazaro, 2015). The first three steps estimate the
    embedding parameters in the order required by successive tseriesChaos routines.
    The fourthth step uses the parameters to embed the time series.


    ```

