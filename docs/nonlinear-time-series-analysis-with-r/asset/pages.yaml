    # 7.4 Discriminating Statistics


    Measures developed to quantify characteristic features of deterministic chaos
    are also used to discriminate between linear stochastic and nonlinear deterministic
    dynamics in surrogate data testing. Conventional statistics used to detect hallmarks
    of deterministic structure in time series data include the *correlation dimension*
    (measuring the fractional dimension of a reconstructed attractor), the *maximum
    Lyapunov exponent* (measuring the sensitivity to initial conditions) and the *nonlinear
    prediction error* (measuring the consequential spreading of trajectories over
    time) which a reconstructed attractor can forecast in the short term (Kaplan and
    Glass, 1995; Kantz and Schreiber, 1997). An extensive description of these discriminating
    statistics has been provided in Chapter 4. In this chapter we revisit these measures
    to further motivate them and introduce other ways to estimate them.


    The literature strongly advises against using measures as positive evidence that
    real-world systems are chaotic, because they are on asymptotic properties requiring
    vast amounts of high-quality data while practitioners are typically faced with
    noisy and possibly nonstationary resonances. However, there is general agreement
    that the measures can be used reliably to discriminate between deterministic and
    random structure in surrogate data testing (Kantz and Schreiber, 1997; Schreiber
    and Schmitz, 2000; McSherarry, 2011).


    # 7.4.1 Correlation Dimension


    Phase space trajectories in dissipative systems converge to a subspace where they
    remain oscillating periodically on an attractor. Unlike a zero-dimensional point,
    a one-dimensional line, a two-dimensional object with a fractional dimension or
    a three-dimensional volume, an attractor can be a fractal geometric object (noninteger)
    dimension. Fractal objects are characterized by *self-similarity*, i.e. by irregular
    patterns that repeat at different scales (Theiler, 1990). An attractor''s fractal
    dimension reduces the total *available degrees of freedom* in the system to the
    *active degrees of freedom* and thus provides an informative measure of system
    complexity (Theiler, 1990). The available degrees of freedom correspond to the
    number of variables in the system (i.e. system dimensionality).


    In this chapter, we focus on numerical estimation of the correlation dimension
    using the Grassberger–Procacia correlation algorithm (Grassberger and Procacia,
    1983b) and the Takens estimator (Takens, 1985).


    We begin with Code 7.2 to provide a simple example of how to compute the correlation
    integral at the core of the Grassberger–Procacia algorithm:


    ```

    # Code 7.2 A simple example of how to calculate C(epsilon;N)

    rm(ls(all=TRUE)) #remove values between runs


    x-c(5,8,2,0,1,3) #time series

    ```'
