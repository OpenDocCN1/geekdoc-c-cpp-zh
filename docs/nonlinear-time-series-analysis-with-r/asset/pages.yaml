  md: 'sects the $45^\circ$ reflection line. Consequently, the fixed points have coordinates
    $(x_{t+1}, x_t)$, with $x_{t+1} = x_t$ $\forall$.


    If we experiment with different starting point $x_0$, we see that the solution
    always converges to the nonzero fixed point $x^* = 0.6429$, which indicates that
    it is an attractor or sink of period one. The iterates reaches larger than $x^*
    = 0.6429$, but eventually converges on this final value. The growth process does
    not preserve the memory of the previous states and, in particular, the initial
    starting point. In contrast, the fixed point $x^* = 0$ repels initial conditions.
    More precisely, for $x_0$ close to 0 (i.e. for $x_0 = 0 + \epsilon$, where $\epsilon$
    is an arbitrarily small number), the iterates diverge from the origin towards
    the nonzero fixed point. The fixed point $x_0 = 0$ is referred to as a repeller
    or source.


    The iterates converging towards the nonzero fixed point are in a transient state.
    Figure 2.4 illustrates this by displaying two trajectories starting from different
    points. The time series plot (a) and cobweb plot (b) show that, while the follow
    oscillating trajectories, each trajectory converges to $x^* = 0.6429$. We used
    Code 2.3 to print the iterated solutions, we would see that approximately 20–30
    iterations are required to reach the fixed point at a precision of three decimal
    places: $x^* = 0.643$. We would also see that far more iterations are required
    to achieve greater precision: for example, approximately 70 iterations to reach
    $x^* = 0.6428571$. This illustrates that $f(x_t)$ asymptotically approaches a
    stable point.


