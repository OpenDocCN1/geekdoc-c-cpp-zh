    # 4.5 Poincaré Map


    Imagine that the phase space is something real and so is the representative point.
    Suppose that the representative point follows the trajectory sketched in Figure
    4.15a, a periodic orbit. Imagine now putting a piece of paper P parallel to the
    plane (x, 2). The representative point intersects the paper cuts ‘hole’ if the
    orbit has period 1, there is only one ‘hole’, A (Figure 4.15a). At every period,
    the representative point passes through the hole A. If the orbit is doubly periodic,
    there are two ‘holes’, A and B (Figure 4.15b), the representative point passes
    through A and B alternately. The ‘paper’ is the Poincaré section, and the ‘holes’
    form the Poincaré map, also known as first-return map. In Figure 4.15, the ‘holes’
    in the Poincaré section are mathematically points, but are enlarged for the sake
    of clarity, as will done also in the following. The process at the base of the
    Poincaré section construction consists of converting the trajectory of a continuous
    dynamical system in an N-dimensional phase space into a discrete trajectory (i.e.
    a map) in an (N–1)-dimensional phase space. We can look at this geometrical construction
    as a ‘stroboscopic’ representation


    Nie Wei'
