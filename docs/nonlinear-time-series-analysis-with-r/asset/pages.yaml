    In the scheme of the algorithm that we have outlined, the evolution of the distance
    between two points is considered: one reference point and its nearest neighbour.
    In contrast, this approach is the same as that adopted in Rosenstein et al. (1993).
    In Kantz (1994), the distance between the reference point and a set of neighbours
    is monitored. Actually, if the length $n$ of the series suffices, it is suggested
    that, to save time, one should not average over the entire trajectory but consider
    only a number of reference points less than $n$.


    There are advantages in using this type of estimators: (i) they do not involve
    any kind of modelling and (ii) their computation is easy compared with Jacobian
    estimators. Notice also that for non-chaotic systems, the scaling region is not
    linear and for stochastic systems, it tends to become flatter with increasing
    embedding dimension. Further comments about MLE estimation are given in Giannerini
    et al. (2007b)


    # 4.2.2 Estimating the MLE with tseriesChaos


    The estimate of the MLE is implemented in tseriesChaos with the code (the same
    notation as in tseriesChaos is adopted here)


    ```

    ly <- lyap_k(series,m,d,t,k,ref,s,eps)

    ```


    where


    +   - series: time series.

    - m: embedding dimension.

    - t: Theiler window. Points separated by less than t in the series are excluded
    from the search for neighbouring points.

    - k: number of neighbours considered.

    - ref: number of points in series taken into account.

    - s: iterations along which the neighbours of each point are followed.

    - eps: radius of the ball inside which neighbours are searched for.


    In practice, for each of the ref reference points (ref $\le n$) (where $n$ is
    the length of the reconstructed trajectory), we look for k neighbours that are
    closer than eps and have a temporal separation greater than t. Then, we compute
    the log-average distance between the point and its k neighbours, and we follow
    it for a finite number s of steps ahead in time. The instruction ly <- lyap_k()
    is followed by the two lines


