    We applied the Toeplitz method of singular spectrum analysis (SSA) to mean-adjusted
    time series (Codes 6.9 and 6.1). Each time series had sporadic missing observations
    filled with centered averages.


    We isolated a strong signal in the scarlet fever time series accounting for 74%
