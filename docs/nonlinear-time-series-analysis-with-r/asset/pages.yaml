  md: '# Preface


    Nonlinear Time Series Analysis with R joins the chorus of voices recommending
    ''getting-to know your data'' as an essential preliminary evidentiary step in
    scientific inquiry. Time series are often highly fluctuating, with a random appearance.
    Observed volatility is commonly attributed to exogenous random shocks to stabilize
    real-world systems. Consequently, investigators are driven to reproduce volatility
    with a variety of linear-stochastic and probabilistic methods. However, breakthroughs
    in nonlinear dynamics raise another possibility: highly complex dynamics can emerge
    endogenously from astingly parsimonious deterministic models.


    Nonlinear time series analysis (NLTS) is a collection of empirical tools that
    allow practitioners to diagnose whether observed data are most likely generated
    by stochastic or deterministic dynamics. In particular, practitioners can use
    NLTS in an attempt to reconstruct, characterize and model real-world dynamics
    from a single time series or multiple causality interactive time series. This
    information can be used, along with scientific principles and other expert information,
    to guide the specification of analytic models to build theory or support high-stakes
    public policy. Models used for public policy are increasingly subjected to formal
    government audit to ascertain how well they correspond to reality. The compatibility
    of audited models with NLTS-detected dynamics offers evidence of proper model
    specification.


    This book targets students and professionals in physics, engineering, agriculture,
    and other social sciences. Our major objectives are to put key concepts of NLTS
    – developed in the mathematical physics literature within the reach of non-mathematicians
    with limited knowledge of nonlinear dynamics, and in this way to pave the way
    for NLTS to be adopted in the conventional empirical toolbox and core coursework
    of other disciplines. Consistent with modern trends in university instruction,
    the book makes readers active learners with R coding them through NLTS methods.
    The computer code is explained in detail so that readers can adjust it for their
    use work. The book also provides readers with an explicit framework – condensed
    from sound empirical practices recommended in the literature – that proposes a
    strategy for implementing NLTS in real-world data analytics. Practitioners become
    ‘data detects’, accumulating empirical evidence directing scientific inquiry.


    We used R 3.3.1 and the following packages to construct the code in this book:

    animation 2.5; boot 1.3-18; craq 1.0.6; desvolve 1.12; extRem 2.0-7; fields 8.4-1;
    fractal 2.0-1; glmnet 2.0-5; gplots 3.0.1; graphics 3.3.1; igraph 1.0.1; MESS
    0.4-3; mpoly 1.0.3; multispatialCCM 1.0; nonlinearTseries 0.2.3; pdc 1.0.3; pdist
    1.2; phaseR 1.3; plotrix 3.6-3; ppls 1.6-1; psych 1.7.3.21; rgl; Rssa 0.13-1;
    scatterplot3d 0.3-37; stats 3.5; tseriesChaos 0.1-13; tseriesEntropy 0.6-0'
