  md: "# Approximation of Derivatives with Finite Differences 265\n\nThe system (9.1),\
    \ for example, is composed of three ODEs expressed as third-degree polynomials\
    \ in three observed time variables $(x_t, y_t, z_t)$, where the time series are\
    \ the observed signals $\\alpha_i$, $\beta_i$, and $\\gamma_i$ ($i=1, \\dots,\
    \ 8$) are unknown fixed coefficients. System dimensionality is guided by the embedding\
    \ dimension in phase space reconstruction, and system variables are reconstructed\
    \ with convergent cross mapping. The order of each polynomial is selected so that\
    \ the system faithfully reproduces empirically reconstructed dynamics.\n\nIn this\
    \ chapter, we construct $R$ codes that formulate a phenomenological model from\
    \ data on multiple observed variables (Code 9.7) and a single observed variable\
    \ (Code 9.8). Each of these codes is composed of a sequence of user-defined functions\
    \ that (1) approximate the time derivatives $\\dot{x}$, $\\dot{y}$ and $\\dot{z}$\
    \ with finite-differencing techniques, (2) compute polynomial expansions of selected\
    \ order, (3) estimate unknown coefficients with linear regression techniques (since\
    \ polynomial ODEs are linear in their coefficients), (4) compute the goodness\
    \ of fit of the estimated ODEs and (5) numerically solve the ODE system for values\
    \ of the observed variables. We construct the code in stages by investigating\
    \ each user-defined function in its entirety and then collapsing it to a run statement\
    \ when investigating the result. The time series used to illustrate each user-defined\
    \ functions are the solutions to the Lorenz equations generated by the user-defined\
    \ function `lorenz_udf` (Code 6.16). We can then present the final codes (9.7)\
    \ and (9.8) as a parsimonious sequence of run statements for the component user-defined\
    \ functions.\n\n# 9.3 Approximation of Derivatives with Finite Differences\n\n\
    Code 9.1 formulates a user-defined function diff that requires inputs of time\
    \ series $x_t$ and an integration step $\\delta$ to generate finite-difference\
    \ approximations of time derivatives associated with the time series. We apply\
    \ the following numerical recipe for computing fourth-order centred finite differences\
    \ (Goubes and Maquet, 1992):\n\n```\n$$\\dot{x}_t = \\frac{8(x_{t+1} - x_{t-1})\
    \ - (x_{t+2} - x_{t-2})}{12\\delta} + \\upsilon(\\\\delta^4) \\quad (9.2)$\n```\n\
    \nwhere $\\upsilon(\\\\delta^4)$ is the truncation error. The first centred difference\
    \ is computed in the third period ($t=3$) since two periods back in the equation\
    \ takes us to the first observation, and we cannot go further back than that.\
    \ Similarly, the last finite difference is computed two periods before the final\
    \ period so that two periods forward in the equation takes us to the final period.\
    \ Consequently, the first and last two observations are lost to differing. The\
    \ code uses this information to equate the length of the time series and differences.\n\
    \n```\n#Code 9.1 Specify user-defined function to compute fourth-order centred\
    \ finite differences\n# (finite_differences_udf.R)\n\nrm(list=ls(all=TRUE))  #remove\
    \ objects between runs\n```\n\n```\n# Load user-defined functions\nsetwd(\"C:/User\
    \ Defined Functions\")\ndump(\"lorenz_udf\", file=\"lorenz_udf.R\")\n```"
