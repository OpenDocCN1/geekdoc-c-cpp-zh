  md: '# Elements of Ergodic Theory 321


    indeed, the first notion is better defined from a mathematical point of view.
    Very briefly, the measure is a function that assigns a ''dimension'' to a subset
    of the phase space. For instance, consider the Lebesgue measure on the interval
    [0,1]; the measure of the interval [a,b] \subset [0,1] is its length $b-a$. In
    particular, we will use the probability measure. There are many excellent books
    on these topics, which see, for instance, Billingsley (1995) and Ash and Doléans-Dade
    (2000). We will give here a brief description of some basic concepts, referring
    to the literature for more extensive discussions and mathematical insights.


    Let $\Omega$ be an arbitrary set. The notion of an $algebra$ (or field) is introduced
    as a collection $\mathcal{F}$ of subsets of $\Omega$ such that the following holds:


    +   (1) $\Omega \in \mathcal{F}$.


    +   (2) If $S \in \mathcal{F}$, then $S^c$ denotes the complement of $S$.


    +   (3) If $S_1, S_2, \dots, S_n \in \mathcal{F}$, then $\bigcup_{i=1}^n S_i \in
    \mathcal{F}$.


    In words, $\mathcal{F}$ is closed under complement and finite union. If the union
    in (3) is replaced by a countable union, i.e.


    +   (3'') If $S_1, S_2, \dots \in \mathcal{F}$, then $\bigcup_{i=1}^\infty S_i
    \in \mathcal{F}$


    (in other words, $\mathcal{F}$ is closed under complement and countable union),
    then $\mathcal{F}$ is called a $\sigma$-algebra (or $\sigma$-field). For instance,
    the smallest $\sigma$-algebra of subsets of $\Omega$ is $\mathcal{F}=\{\varnothing,
    \Omega\}$, where $\varnothing$ is the empty set; while the largest $\sigma$-algebra
    is the collection of all subsets of $\Omega$, including $\Omega$ and itself.


    We define a measure of the elements (sets) of $\mathcal{F}$; in probability theory,
    these elements are called *events* and a probability (measure) is assigned. Consider
    the function


    ```

    $$\mu : \mathcal{F} \to [0,+\infty]$

    ```


    The function $\mu$ is a *measure* on a $\sigma$-algebra $\mathcal{F}$ of subsets
    of $\Omega$ if it the following:


    +   (1) $\mu(S) \geq 0 \ \forall S \in \mathcal{F}$ (non-negativity axiom).


    +   (2) If $S_i \in \mathcal{F} \ \forall i \in I$, such that $S_i \cap S_j =
    \varnothing \ \forall i, j, i \neq j$, then


    ```

    $$\mu(\bigcup_{i\in I} S_i) = \sum_{i\in I} \mu(S_i) \quad (\sigma-additivity
    axiom)$

    ```


    The $\sigma$-additivity axiom says that the measure of the union of the disjoint
    subsets $S_i$ is equal to the sum of the measures of the subsets themselves. Note
    that $S_1, S_2, \dots$ may form a finite or countably infinite collection of sets
    in $\mathcal{F}$. The triple $(\Omega, \mathcal{F}, \mu)$ is is called *measure
    space*.


    We define the *Dirac measure* $\delta_x$ ($x \in \Omega$)


    ```

    $$\delta_x(A) = \begin{cases} 1 & \text{if} x \in A \ 0 & \text{if} x \notin A
    \end{cases} \quad (A.3)$

    ```


    This is a measure centered on some fixed point $x$ in the measurable space $(\Omega,
    \mathcal{F})$.'
