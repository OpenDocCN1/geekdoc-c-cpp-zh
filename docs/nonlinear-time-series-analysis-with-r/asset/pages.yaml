    The PCA can also be profitably exploited to filter noise, since most of the noise
    is presumably contained in the discarded directions. In this manner, it may be
    possible (at least in theory) to separate noise, the components of lesser significance,
    from the most important components. A similar method to reduce noise is the singular
    spectrum analysis (SSA) technique, which will be discussed in Chapter 6. PCA offers
    further tools for data analysis in a great variety of disciplines, as testified
    by the wide literature on this technique. In the context of nonlinear time series
    analysis, see the clear introduction and discussion, with examples, in Kantz and
    Schreiber (1997).


    # 3.5 Summary


    The concept of ''phase space'' has been introduced as a central topic in the analysis
    of time series, for both linear and nonlinear series. Historically, this concept
    arises in the context of classical and statistical methods and allows the behaviour
    of a system to be represented in geometric form. The axes of this space are all
    the variables that describe the state of the system at any instant. A point (representative
    point) in phase space corresponds to a unique state of the system.


    The dynamics of the full system is described by the trajectory followed by the
    representative point in time.


    In addition to ''phase space'', we have introduced ''reconstructed phase space''.
    To determine the phase space of a system, we require knowledge of all the variables
    describing that system, but for a real process, we do not usually know all the
    state variables — indeed, in some cases, not of all can be measured. However,
    there are mathematical theorems ensuring that, with measurements of only one variable,
    it is possible to reconstruct a phase space that is ''similar'', in a topological
    sense, to the true phase space of the underlying system. This means that the characteristic
    invariants of the system (fractal dimensions, Lyapunov exponents, and others)
    are conserved in the'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# 82 Phase Space Reconstruction


    reconstructed phase space. Then, the features of the system derived from studying
    reconstructed dynamics also hold for the true dynamics. Delay-coordinate embedding
    can be considered as a standard method for this reconstruction. The *scalar* measured
    time series $s(1), s(2),\dots,s(N)$ can expand in an $m$-dimensional vector space,
    in which each point is represented by the vectors $y_t = s(t), s(t+d), s(t+2d),\dots,s(t+(m-1)d);
    t=1,\dots,n$ with $n=N-(m-1)$. Here, $m$ is the embedding dimension (i.e. the
    dimension of the reconstructed phase space) and $d$ is the time delay (the time
    shifts between the coordinates). A wide variety of methods and prescriptions have
    been proposed for the choice of the embedding parameters $m$ and $d$. In this
    chapter, we have encountered the ‘false nearest neighbour’ method and the use
    of mutual information for the choice of $m$ and $d$, respectively. We repeat here
    that the choice of embedding parameters depends also on the specific problem to
    which the embedding procedure is applied. The freely swaying ideal pendulum (with
    small swings, no air resistance, etc.) and the Lorenz attractor act as guides
    when starting out on the study of dynamic systems.


    We have illustrated a further method of embedding based on *principal component
    analysis* (PCA). In PCA, a new system of orthogonal axes is created that contains
    the largest fraction of the total variance of the data. The principal directions
    can be obtained as the eigenvectors of the symmetric autocovariance matrix that
    correspond to the largest eigenvalues. The remaining orthogonal directions presumably
    contain most of the noise, and PCA can thus be exploited to reduce noise.


    Lastly, a warning is in order. In the literature, and indeed elsewhere in this
    book, reconstructed phase space is also called ‘pseudo phase space’ or ‘shadow
    phase space’. The latter term could lead to confusion with the notion of ‘shadowing
    trajectory’. The question arises as to the relation (if any) between a *computer-simulated
    trajectory* and a *real trajectory*. It has been proved that, in the real word,
    there exists a real trajectory that stays close to (‘shadows’) the computed one
    (Grebogi et al., 1990). This is important since the fractal structures of chaotic
    attractors displayed by numerically simulations are actually real.'
