    \ The simplest and most popular way to estimate the correlation integral is the\
    \ empirical analogue:\n\n$$\\hat{C}(\\epsilon) = \\frac{2}{n(n-1)} \\sum_{i=1}^n\
    \ \\sum_{j=i+1}^n \\Theta(|y_i - y_j| - \\epsilon) \\quad (4.6)$\n\nwhere $\\\
    Theta(\\cdot)$ is the Heaviside function, which we have already encountered, with\
