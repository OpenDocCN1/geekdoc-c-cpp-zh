  md: '# Summary 219


    The null hypothesis of stochastic dynamics is rejected if the correlation dimension
    and maximum Lyapunov exponent computed from the time series fall within the $k$
    smallest or $k$ largest values. The code computes the upper limit on the $k$ smallest
    and the lower limit on the $k$ largest values. Consequently, the null hypothesis
    is rejected if the results of hypothesis testing fall outside the interval given
    by these limits. Step 5b specifies the upper-tailed test when nonlinear prediction
    skill is used as a discriminating statistic. The code computes the lower limit
    on $k$ largest values, and rejects the null hypothesis if the statistic computed
    for the time series rests above this limit. Step 6 computes the permutation entropy
    measure, and rejects the null hypothesis if the measure taken from the time series
    falls below the upper limit on the $k$ smallest values taken from the surrogates
    (surrogate.csv). The code exports a table summarizing results. A user-defined
    function `surr_table.ud` conforms table labels to the particular discriminating
    statistics tested. Finally, the code specifies possible error messages and corrections,
    and posts statements at the bottom of run summarizing results of hypothesis testing
    for each discriminating statistic.


