    # 10.3 Surrogate Data Testing


    We tested the null hypotheses that the disease signals used to reconstruct attractors
    are most likely generated by stochastic dynamics. We first tested for linear stochastic
    dynamics with AAFT surrogates, and then for shifting periodic orbits with PPS
    AAFTs. We tested the probability of false rejection at $\alpha = 0.05$, and the
    rank order parameter at $k = 15$. This generated $(k-1) = 299$ surrogate data
    for the single-tailed tests and $S = (2k/a)-1 = 599$ for the two-tailed tests.
    We selected nonlinear prediction skill as a discriminating measure for all diseases,
    and we specified upper-tailed tests so that the null hypotheses were rejected
    only when empirical attractors (i.e. those reconstructed from a disease signal)
    with significantly more skill than surrogate attractors. We also used permutation
    entropy as a discriminating statistic for all diseases, and we specified lower-tailed
    tests to'
