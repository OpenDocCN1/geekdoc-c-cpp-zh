  md: '# Why Study Nonlinear Time Series Analysis?


    (Haack, 1999; Geman and Geman, 2016). Also, it does not account for how science
    progresses cataclysmically as new paradigms overth old ones in scientific revolutions
    (Kuhn, 1962). The lack of consensus between us two extremes: the narrow epistemic
    framework of conventional views and the nihilistic positions that science is merely
    politics with no epistemic authority.


    Haack (1999) provides a middle ground:


    An adequate count of scientific knowledge and scientific inquiry must acknowledge
    a subtle interplay of logical, personal, and social aspects. The interplay begins
    at the beginning of, with talented individuals coming up with conjectures on which
    others build and are subject to the scrutiny of the relevant community, and it
    is present at every stage. The value of any empirical proposition depends in part
    on experimental evidence, i.e., on what individual observe(s) see(s) or hear(s),
    etc, and so, on how justified others are in thinking the observer(s) reliable.


    The chief epistemic value of this middle ground is a ''respect for evidence''
    that meets general standards of good inquiry, namely ''good, strong, supportive
    evidence and...well conducted, honest, imaginative inquiry'' (Haack, 1999).


    Data provide an evidentiary portal to the real world where there is only limited
    access. For example, Charles Darwin consolidated several months of studying marine
    and terrestrial samples collected in the Galapagos into his famous sketch of the
    evolutionary tree (Bera, 2009). In another example, Leonardo da Vinci compiled
    a lifetime of observing nature into notebooks explaining behaviours, water and
    sediment movement in river systems, waves in ponds, sound waves in air, and even
    spirits speak (Da Vinci, 1519). The contributions of both scientists are especially
    recognized because they detected patterns that were not obvious in the data, and
    processed information into astounding knowledge of systematic natural behaviour
    that has withstood the test of time.


    Haack (1999) sets ''realism'' as the goal of scientific inquiry. The results of
    scientific inquiry may agree with reality if they are to be put to reliable use.
    For example, policymakers expect that theory supporting high-stakes public policy
    represents the real world that they are charged with regulating. Otherwise, policies
    ''leave the real problem unattended, wasted resources, and implied learning''
    (Salteelli and Funtowicz, 2014). Recently, a 2010 US special hearing, Building
    a Science of Economics for the Real World (US Congress Subcommittee on Science
    and Technology, 2010), criticized the performance of macroeconomic models for
    failing to reproduce temporal patterns of booms and busts in the 2008 financial
    crisis. Congress concluded that ''if major crises are a recurrent feature of the
    economy then our models should incorporate this possibility'', and expressed frustration
    that ''because our experts'' way of looking at the economy left them blind to
    the crisis that was, while we were unprepared to deal with the reality. Mostly,
    Congress broadly questioned why ''we continue to rely upon [theoretical] models
    for many critical decisions, so much practical policy advice''.


    An economist empanelled on the 2010 hearing recommended that policy models should
    be formally audited by the National Science Foundation. An earlier recommendation
    by Oreskes et al. (1994) would place the burden on the modeller ''to demonstrate
    the degree of correspondence between the model and the material world it seeks
    to repre-'
