  md: "# Analyzing Period Doubling with Bifurcation Diagrams 31\n\n**Table 2.2** Logistic\
    \ map. Regularity in period doubling: attractor period, bifurcation point $r_n^*$,\
    \ length of stability interval $\\Delta_n$ and ratio between lengths.\n\n| $n\
    \ (\text{period} = 2^n)$ | $r_n^*$ | $\\Delta_n$ | $\\Delta_n/\\Delta_{n+1}$ |\n\
    |---|---|---|--|\n| 1 | 3 | | |\n| 2 | 3.449490 | $4.498490 \times 10^{-1}$ |\
