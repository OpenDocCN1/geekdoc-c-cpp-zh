  md: "Nonlinear cross prediction probes for nonstationarity in the signal separated\
    \ from time series data by applying nonlinear prediction methods to determine\
    \ the skill with which segments of the time series can predict the others. The\
    \ time series is stationary for purposes of NLTS if the nonlinear predictive skill\
    \ deteriorates substantially as segments become more remote in time. Code 6.15\
    \ runs nonlinear cross prediction. In a nutshell, the time series is divided into\
    \ equal segments and each segment is used as a learning set to nearly predict\
    \ the other segments as test sets. The segment size is a trade-off: longer segments\
    \ allow the system dynamics to evolve, while shorter segments contribute to finer\
    \ test resolution (Schreiber, 1997). The output is a matrix of Nash-Scliffe model\
    \ efficiencies (nse). A column in the output matrix measures the skill with which\
    \ a particular segment-predicts remote segments (rows in the output matrix). Declining\
    \ nse values from top to bottom in a column indicate nonstationarity over the\
    \ time interval for the particular learning segment.\n\n# 6.6.3 Nonlinear cross\
    \ prediction\n\n```\n#Code 6.15 Nonlinear cross prediction (1-step-ahead) to probe\
    \ nonstationarity\nrm(list=is(all=TRUE)) #remove objects between runs\n\n#Directories\n\
    dir.data<-as.character(\"C:/Data\")\ndir.ud<-as.character(\"C:/Defined Functions\"\
    )\n\n#Read in data\nsetwd(dir.data)\nts<-read.csv(\"Mayport.csv\")\\nx-ts$signal\
    \ #ssa signal\n\n#Load User-defined functions\nsetwd(dir.ud)\ndump(\"embed_ud\"\
    , file=\"embed_ud.R\")\nsource(\"embed_ud.R\")\ndump(\"predict_np_ud\", file=\"\
    predict_np_ud.R\")\nsource(\"predict_np_ud.R\")\n\n#Step 1: Segment time series\
    \ x(t)\n#Set number of segments\nseg<-5\nseg.length<-floor(length(x)/nseg) #length\
    \ of each segment\nx<-x[1:seg.length] #limit x to even multiple of seg.length\n\
    segs<-split(x,cut(as.long(x),nseg,labels=FALSE)) #Segment x(t)\n#Put segments\
    \ into matrix columns\nseg.matrix<-matrix(0,nrow=seg.length,ncol=nseg)\nfor (\
    \ i in 1:nseg) {nn  nseg<-unlist(segs[i])\n  seg.matrix[,i]<-nseg\n}\n#end i loop\n\
    seg.matrix<-seg.matrix #columns are nse segments of time series\n\n#Step 2: Nonlinear\
    \ cross prediction\n#Outer loop (i2) iterates over learning sets used to predict\
    \ test sets.\n#The matrix 'nse.matrix' stores Nash-Scliffe efficiencies where\
    \ the\n#columns are the learning sets, and the rows are predicted\n#test sets.\n\
    ```"
