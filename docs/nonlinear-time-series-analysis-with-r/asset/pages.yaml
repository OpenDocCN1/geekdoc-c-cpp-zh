    In Step 8, we turn to the job of pruning false positives from the adjacency matrix
    computed in $ccm.ud$. We formulate two rules for ruling a detected interaction
    as a false positive. First, the maximum average correlation coefficient for the
    associated delayed cross mapping occurs at a positive delay. Second, the maximum
    average correlation for a positive delay is significantly larger than the values
    for the other delays. We want to avoid declaring a false positive when, for example,
    the maximum value differs from the minimum value by a minuscule order of magnitude,
    or in other words, when the delayed CCM for a given cross mapping is relatively
    flat. There are several ways of deciding what constitutes ''significantly larger''
    – we propose a possible rule in Step 8b.


    Step 8 identifies the delay yielding the maximum average correlation coefficient
    for a given cross mapping. For example, in the $ccm.v\_as$ response variable matrix
    already mentioned, the maximum value (0.739408998) occurs at a delay equal to
