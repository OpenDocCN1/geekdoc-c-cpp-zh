  md: '# Correlation Dimension 107


    Remember different type of correlation integrals are used. An example is the so-called
    Gaussian correlation integral, in which two points $y_i$ and $y_j$ separated by
    a small distance are weighted more than those separated by large distances; in
    this case, a Gaussian weighting system is used. This algorithm is particularly
    suitable when the observations are contaminated by noise (Diks, 1996).


    The essential point is that $C(\epsilon)$ is linked to the fractal dimension of
    the attractor, which we wish to estimate. Supposing that the space is a one-dimensional
    curve, let us take a reference point and how many points are less than $\epsilon$.
    If $\epsilon$ is increased, the number of points increases by an amount proportional
    to $\epsilon$; that is, $C(\epsilon)=k\epsilon$. The same reasoning can be applied
    on a plane, considering how many points are within a circumference of radius $\epsilon$.
    With increasing $\epsilon$, the number of points increases by a factor $\pi^2$;
    that is, $C(\epsilon) = k\epsilon^2$. In three dimensions, the corresponding factor
    is $(4/3)\pi^3$. In general, if points are randomly distributed in a $D_2$-dimensional
    hyperspace, the number of points at less than $\epsilon$ from the reference point
    is proportional to $\epsilon^{D_2}$;


    $C(\epsilon) = k\epsilon^{D_2} \quad (4.7)$


    Taking the logarithm of both sides gives


    $log C(\epsilon) = D_2 \log \epsilon + \log k \quad (4.8)$


    The term $k$ is a constant, and then to plot $D_2$ we have to plot $C(\epsilon)$
    as a function of $\epsilon$ and evaluate the slope of the line in the linear region
    (called the *scaling region*) of the log-log plot. The quantity $D_2$ is the correlation
    dimension. The commonly used subscript ''2'' refers to the correlation dimension
    defined by Grassberger and Procaccia (1983a, 1983b). Henczel and Procaccia (1983)
    show how it is possible to associate with fractals an infinite number of generalized
    dimensions $D_q > 0$. Note also the difference between the correlation dimension
    $D_2$ and the Hausdorff-Besicovitch dimension, or the capacity dimension, or the
    box-counting dimension, or we call them. These latter dimensions are purely geometric
    concepts, and do not take into account the dynamic aspects of the system, namely
    the *seniority* of states, as it is by Grassberger and Procaccia (1983a). Certain
    states are visited more than others and thus they have higher seniority, they
    are equally weighted in the estimation of the dimension. In contrast, the correlation
    integral is sensitive to the sensitivity effect, that is, to the visiting rate
    of states.


    All of this reasoning leads to (constructed) series of infinite points. In fact,
