  md: "# 156 Data Preprocessing\n\n# Step 3: Time series reconstruction (diagonal\
    \ averaging)\n\n```\n# Step 3a: User-defined function for averaging of minor diagonals\n\
    diag.ave<-function(mat) {\n  hold<-matrix(0,nrow+(ncol-1))\n  for(i in 1:nrow+(ncol-1))\
    \ {\n    if(i==1) d<-mat[1,1]\n    if(i>1 & i<=ncol) d<-diag(mat[1:1,1:i])\n \
    \   if(i>ncol & i<=nrow) d<-diag(mat[1:(i-ncol)),1:ncol])\n    if(i>nrow & i<=nrow+(ncol-1))\
    \ d<-diag(mat[nrow:(i-(nrow-1)),(i-(nrow-1)):ncol])\n    if(i==nrow+(ncol-1))\
    \ d<-mat[nrow,ncol]\n    d.ave<-mean(d) # average minor diagonals\n    hold[i,\
    \ ]<-d\n  } # end loop\n  return(hold)\n}\n# end function\n```\n\n```\n# Step\
    \ 3b: Reconstructed time series\nx1-diag.ave(X1)\nx2-diag.ave(X2)\nx3-diag.ave(X3)\n\
    x12-diag.ave(X12)\n```\n\nStep 1 performs matrix decomposition . $x_t$ Step 1\
    \ computes a trajectory $X$ by embedding the time series . For SVD-SSA, we select\
    \ the embedding dimension $K$, but the embedding delay is fixed at $d=1$, so that\
    \ $X$ is an $L \times K$ matrix. The number of rows is determined by $L=N-K+1$\
    \ (where $N$ is the number of observations in the time series) and is referred\
    \ to as the window length. The first column of $X$ contains the first $L$ observations\
    \ of $x_t$ and the subsequent columns contain one-period-forward copies of $x_t$.\
    \ For our example, we select $K=3$, so that $L=6-3+1=4$ and $X$ is the following\
    \ $4 \times 3$ matrix:\n\n$$X_{L \\times K} = \\begin{pmatrix} 1 & 3 & 0 \\ 3\
    \ & 0 & -3 \\ 0 & -3 & -2 \\ -3 & -2 & -1 \\end{pmatrix} \\quad (6.6)$\n\nStep\
    \ 1b computes the $K \times K$ lagged covariance matrix $S=X^TX$. For this example,\
    \ S is\n\n$$S_{3 \\times 3} = \\begin{pmatrix} 19 & 9 & -6 \\ 9 & 22 & 8 \\ -6\
    \ & 8 & 14 \\end{pmatrix} \\quad (6.7)$\n\nStep 1c calculates the eigensystem\
    \ of $S$. In general, the eigensystem includes $K$ eigenvalues $\\lambda_i, i=1,\\\
    dots,K$. Each eigenvalue has a corresponding $K \times 1$ eigenvector $EV_i$ and\
    \ an $L \times 1$ left eigenvector $V_i$. We compute left eigenvectors using the\
    \ formula"
