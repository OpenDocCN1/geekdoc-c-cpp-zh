    time series in converted into a trajectory matrix whose first column is the time
    series and whose remaining columns are its delayed copies. SSA runs an eigensystem
    decomposition of the trajectory matrix as a sum of matrices. Each new matrix is
    computed as the product of eigensystem components (an eigentplet), including a
    left eigenvector that characterizes dynamic patterns in the data (Ide and Inoue,
    2005). Change-point detection operates off these left eigenvectors (as we shall
    explain). SSA proceeds by dividing the matrices into groups corresponding to trend,
    oscillations and noise (unstructured variation) components in the data, after
    which the matrix groups are reconstructed into time series vectors of the respective
    components.


    For the time series generated by eqns (8.3), we run the R package Rssa (Koberynnikov
    et al., 2015) to isolate the 24-period (eigentriplets 1 and 2) and 48-period (eigentriplets
    5 and 6) oscillations, accounting respectively for 50% and 10% of the total variation
    in the series, and the trend component (eigentriplets 3 and 4), accounting for
    25% of the total variation (Figure 8.7b, c). We use an SSA window length of 500
    periods (half of the length of the time series). We store the reconstructed time
    series components in the file sin_cp_ssa.csv (which can be found in the web materials
    for this book).'
