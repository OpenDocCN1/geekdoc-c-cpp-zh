  md: 'that is, as the fractional part of its eigenvalue $\lambda_i$ in the sum of
    all the eigenvalues in the SVD decomposition (Golyandina et al., 2001). For our
    example, the characteristic contributions of $X_1, X_2$ and $X_3$ are $0.55 =
    30.07/55, 0.40 = 22.15/55$ and $0.05 = 2.77/55$.


    Step 2 (**matrix grouping**) partitions the matrices in the SVD decomposition,
    $X_i$, into groups. In practice, we use a series of diagnostics to strategically
    group matrices so that groups capture various signal and noise components of the
    data. However, in our example, we simply group the first two matrices, $X_{12}
    = X_1 + X_2$:


    ```

    $$\begin{bmatrix} 1.56 & 2.45 & 0.69 \ 3.20 & -0.20 & -2.75 \ -0.14 & -2.90 &
    -2.17 \ -2.35 & -2.64 & -0.20 \end{bmatrix} = X_1 + X_2 $\quad (6.14)

    ```


    The characteristic contribution of the grouped matrix $X_{12}$ is


    ```

    $$\frac{\lambda_1 + \lambda_2}{\sum_{i=1}^K \lambda_i} = 0.95$\\quad (6.15)

    ```


    Step 3 (**series reconstruction**) converts the grouped matrices into corresponding
    vector time series. For our example, $X_{12}$ and $X_3$ are converted into corresponding
    time series $x_{12}$ and $x_3$. This is accomplished by taking the *minor diagonal
    averages* of $X_{12}$ and $X_3$. To illustrate how this diagonal averaging works
    in ideal circumstances, we apply it to convert the trajectory matrix $X$ back
    into the original vector time series $x_t$; in other words, to reverse the embedding
    process. The minor diagonals of $X$ are denoted by the rectangular boxes in Figure
    6.9. Starting from the upper left corner of $X$, the average of the first minor
    diagonal is 1, that of the second is $3 = (3+3)/2$, and so on. Combining the averages
    in a single array perfectly reproduces the original time series: $x_t = 1, 3,
    0, -3, -2, -1$. Diagonal averaging works ideally for *Hankel matrices* (like $X$),
