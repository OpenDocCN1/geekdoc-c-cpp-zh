  md: '# Phase Space Reconstruction with R packages 67


    We discuss the procedure to select the embedding parameters. Let us begin with
    the embedding dimension $m$.


    As we have already underlined, for a dynamical system, self-intersections of trajectories
    are not possible. Takens (1981) showed that to avoid self-intersections of the
    reconstructed trajectory, it is sufficient that the dimension $m$ be


    ```

    $m \ge 2d_A + 1$

    ```


    where $d_A$ is the attractor dimension (possibly fractal). Note that the condition
    (3.5) is a sufficient, but not necessary, so $m$ may be less than $2d_A + 1$;
    indeed, for practical purposes, it is advisable to reduce the value of $m$. A
    method that suggests the *minimal sufficient* embedding dimension $m$, called
    the *false neighbour (FNN) method*, was proposed by Kennel *et al.* (1992). The
    concept of this method is shown schematically in Figure 3.10. The point C appears
    to be a neighbour of the point A when it is projected onto one dimension, which
    is, onto the line labelled $m-1$, but if the points are observed in two dimensions,
    only the point B is a real neighbour of A; the point C is a *false* neighbour.


    ![](img/efe2ac97775c9e906c844c2137d40d86_77_0.png)


    **Fig. 3.10** Underlying principle of the false nearest neighbour method. The
    point C projected onto one dimension, the axis $m-1$, seems to be a neighbour
    of the point A, whereas in two dimensions, with the axis $m$ included, it can
    be seen that the point C is a false neighbour of the point A, while the point
    B is a real neighbour.


    We can illustrate false nearest neighbours with a couple of real-world examples.
    First, let us consider why ticket prices for sporting events, such as soccer,
    tend to be higher at midfield behind the goals (Didonato *et al.*, 2014). Spectators
    at midfield are in a better position to accurately gauge the distances between
    players, while spectators at the ends of the field tend to mistakenly perceive
    players towards the other end as closer to each other than they actually are.
    A larger percentage of players are false nearest neighbours from these seats,
    which makes it more difficult to watch attacks on the other goal unfold. As another
    example, consider cramming (not neatly folding)'
