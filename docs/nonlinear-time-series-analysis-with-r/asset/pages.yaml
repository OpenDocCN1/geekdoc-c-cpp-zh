  md: "Half of the width of the interval [16%, 84%], equal to 0.224, may be considered\
    \ as the 68% bootstrap confidence interval, in this case almost equal to the standard\
    \ error $\\hat{x} = 0.24$ (eqn B.2).\n\nConfidence intervals can be computed with\
    \ the function boot.ci. This function takes the output b of the instruction boot(x,\
    \ samplemean, R=1000) and returns up to five different types of bootstrap confidence\
    \ interval. See DiCiccio and Efron (1996) for bootstrap intervals. For example,\
    \ computation of the bootstrap normal interval and the bootstrap confidence interval\
    \ assumes an asymptotic normal distribution and uses the bootstrap estimation\
    \ of the standard deviation. Choosing the confidence levels as 68%, 90% and 95%,\
    \ the following line is added to Code B.1:\n\n```\nboot.ci(b,conf=c(0.68,0.90,0.95),type=c(\"\
    norm\", \"perc\"))\n```\n\nThe function boot.ci returns a matrix with three columns,the\
    \ first being the level and the other two boundaries of the intervals:\n\nIntervals:\n\
    Level Normal Percentile\n68% ( 4.692, 5.147 ) ( 4.680, 5.128 )\n90% ( 4.543, 5.296\
    \ ) ( 4.530, 5.278 )\n95% ( 4.471, 5.368 ) ( 4.449, 5.367 )\n\nThe small differences\
    \ with the values reported earlier are due to different sequences of random numbers.\n\
    \n# B.4 Comments\n\nThere is a version of the bootstrap method called parametric\
    \ bootstrap, and, in contrast, the bootstrap we have been discussing is also known\
    \ as nonparametric bootstrap. In the parametric version, the distribution function\
    \ $F$ is no longer estimated by the empirical distribution function $\\hat{F}$,\
    \ but by the distribution $\\hat{F}_{par}$ derived from a parametric model for\
    \ the data. So, instead of sampling with replacement from the data, we generate\
    \ $B$ samples of size $n$ from $\\hat{F}_{par}$. After that, we proceeded exactly\
    \ as in the nonparametric version. To use the parametric bootstrap with Code B.1,\
    \ the statement sim=\"parametric\" has been added to the boot() call. The parametric\
    \ bootstrap may be more useful to statisticians when it is applied to problems\
    \ of error propagation. Suppose that the probability distribution of each initial\
    \ experiment is known; that is, each measurement leads to results with normally\
    \ distributed errors, with zero mean and known standard deviation, which may be\
    \ a meter sensitivity or another quantity determined once for all appropriate\
    \ operations. We measure $n$ quantities, obtaining the results $x_i, i=1, \\dots,\
    \ n$, where $\\sigma_i$ are the standard deviations, assumed to be known. These\
    \ measures are the input of a complex code to obtain the value of the derived\
    \ quantity $\\hat{\theta}$ as output. The problem is that the evaluation of the\
    \ derived quantity in terms of the combined effect of the errors of the direct\
    \ measurements each of which is a repetition of the only one actually made. We\
    \ sample from a normal distribution of"
