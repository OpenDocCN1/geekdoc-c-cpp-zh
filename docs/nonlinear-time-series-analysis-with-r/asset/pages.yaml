    in eqn, a stable fixed point becomes unstable and gives birth to twins.


    In general, to locate the $n$-period cycle, we numerically solve


    ```

    f^{[n]}(x_t) = f(f(\dots f(x_t))) = x_t

    ```


    where $f^{[n]}(x)$ is the $n$th iterate. On a period-$n$ cycle of the map $f(x)$
    is a fixed point for the $n$th iterate $f^{[n]}(x)$. To assess the stability of
    the detected cycle, we compute the product $M$ of $n$ multipliers evaluated at
    the $n$-period points of the cycle $x_1^*, x_2^*, x_3^*, \dots, x_n^*:$'
