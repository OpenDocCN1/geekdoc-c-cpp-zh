  md: "# Ideal Simple Pendulum 53\n\nThe quantity $\\omega$ is the angular frequency\
    \ (pulsation), and $\\omega=2\\pi/T$, where $T$ is the period, the time for one\
    \ complete oscillation. As a young man, Galileo Galilei, seventeen years old in\
    \ 1581 (orabouts), observing the oscillations of a votive lamp hanging from the\
    \ ceiling of the Cathedral of Pisa, realized that the oscillation period of a\
    \ pendulum is independent of its amplitude. This property is called isochronism\
    \ (remember that we are speaking of an ideal pendulum in the small-angle approximation).\
    \ Recall that the period $T$ increases with the square root of the length of the\
    \ wire, $T=2\\sqrt{l/g}$, and do not confuse the angular frequency $\\omega^2=g/l$,\
    \ measured in radians per unit time, with the ordinary frequency $\\nu$, which\
    \ is the number of complete oscillations per unit time:\n\n$$\\nu=\\frac{\\omega}{2\\\
    pi}$\n\nIf $T$ is measured, then $\\nu$ is measured in $s^{-1}$, that is in hertz\
    \ (Hz). If $\\nu=1$ Hz, this means that there is one complete oscillation per\
    \ second and $\\omega=2\\pi/1$ rad/s. The solution of eq (3.1) can be obtained\
    \ analytically under the assumptions that we have made; nevertheless we present\
    \ here the R Code 3.1, pend_id_s_o.R, to show how differential equations can be\
    \ solved numerically with R.\n\n```\n#Code 3.1 Ideal pendulum: small oscillations\
    \ (pend_id_s_o.R)\n# params: 1, omega2 parameters\nomega2<- 3\nparams=(1,omega2)\n\
    tinit<-0\ntfincon<-10 # tfin-1 if one wishes to write xy, otherwise 10 or 20\n\
    step<-0.01 # 01 is OK, but with 0.5 and 1 to show that they are bad values.\n\
    time-seq=seq(tinit,tfincon,by=step)\nfunction<-function(t,integrate,parms) { #\
    \ the system of equations\nx<-integrate[1]\ny<-integrate[2]\\dx<-params[1]*y #\
    \ that is: dx/dt = 1\ndy<-params[2]*x # that is: dy/dt = -omega2\nlist(c(dx,dy))\n\
    \ # end of function\nrequire(deSolve)\n# ODE solver package\ncinit<-c(1,1)\nxy<-rk4(cinit,times,func,parms)\
    \ # also use cinit-lsoda(cinit,times,func,parms)\nprint(xy) # Comment if you do\
    \ not wish the xy values printed\nMyData<-data.frame(xy[,2,],xy[,3,])\nwrite.csv(MyData,\"\
    MyData.csv\") # to save the matrix xy as a comma-separated file\n\nplot(xy[,2,1],type=\"\
    l\",x=c(-3,3),xlim=c(-3,3),ylim=c(-3,3),xlab=\"x\",ylab=\"y\")\ncex.lab=1.7,cex.axis=1)\
    \ # phase space portrait\ncex.axis(1,3,lwd=4,lty=1,ylim=c(-2,2)) # (x(t) vs t\n\
    segments(0,0,0.14,0.5,lwd=2,col=black) # to add the line period T and the amplitude\
    \ oscillation A\n# better: col=\"black\" -> col=\"red\"\nsegments(0.944,0.5,0.58,0.5,lwd=4,col=\"\
    black\")\nsegments(7.25,0.77,1.11,lty=4,lwd=3,col=\"black\")\ntext(2.76,0.66,\
    \ labels=\"T\",cex=2,col=\"black\") \ntext(7.15,0.25, labels=\"A\",cex=2,col=\"\
    black\")\n```"
