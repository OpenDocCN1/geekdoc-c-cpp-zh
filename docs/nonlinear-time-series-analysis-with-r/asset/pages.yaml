    Further information can be extracted from prcomp with the command prcomp$object,
    where object is one of the following objects included in prcomp:


    +   - sdev: standard deviations of the principal components.

    - center: the values used to scale the data (center=TRUE in prcomp())

    - scale: the values used to scale the data (scale=TRUE in prcomp())

    - rotation: the loadings matrix, which is a matrix whose columns are the loadings
    for the principal components. This matrix gives the position of each new axis
    relative to the original system of axes

    - x: the scores matrix (in prcomp(), addText=TRUE), which gives the location of
    each data point along each of the new principal component axes.


