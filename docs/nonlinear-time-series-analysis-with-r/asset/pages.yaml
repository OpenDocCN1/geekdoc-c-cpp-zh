    # 7.2 Surrogate Data Testing in a Nutshell


    Surrogate data testing proceeds in three steps. First, we frame null hypotheses
    testing the simplest explanations for observed dynamics in the time series and
    generate surrogate data vectors compatible with these hypotheses (Schreiber and
    Schmitz, 2000). For example, the simplest hypothesis is that the signal observations
    are generated as *independent and identically distributed (IID)* random variables
    (Theiler et al., 1992), so that the reconstructed shadow attractor is simply IID
    noise . To generate surrogate data vectors compatible with this hypothesis, we
    shuffle the time order of the signal multiple times.uffling destroys serial structure
    in the signal, and the surrogates are effectively random draws (without replacement)
    from the same probability distribution as the signal (Small and Tse, 2003). IID
    surrogate tests test the null hypothesis that all structure in the signal is given
    by the probability distribution. In general, surrogates are developed to destroy
    temporal structure in the signal while preserving statistical properties hypothesized
    to account for dynamic behaviour.


    Second, we reconstruct the shadow phase space from the preprocessed signal and
    then from each surrogate vector. We estimate *discriminating statistics* measuring
    the extent to which shadow attractors satisfy characteristics of nonlinear deterministic
    behaviour.


    Finally, we test the null hypothesis that preserved statistical properties in
    the surrogates account for dynamical behaviour in the signal. Applying nonparametric
    rankorder statistics, we accept the null hypothesis if discriminating statistics
    taken from the signal attractor do not fall within the extreme ranges of values
    taken from surro'
