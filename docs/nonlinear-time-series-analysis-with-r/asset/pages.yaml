  md: "# 340 Appendix C\n\n![](img/efe2ac97775c9e906c844c2137d40d86_350_0.png)\n\n\
    **Fig. C.2** Phase diagram constructed for the case of stable node equilibrium:\
    \ (a) nulllines and vector field; (b) experiments run to determine directions\
    \ of motion; (c) phase diagram of a stable node equilibrium; (d) time series plot\
    \ of variables along a trajectory.\n\n(indicated by the upward-pointing arrow).\
    \ The opposite happens above the nullcline. We would get the same result if we\
    \ experimented with an incremental decrease in $y_t$ off the nullcline and repeated\
    \ the above reasoning with $\\partial j/\\partial y = a_{22} = -3 < c$.\n\nWe\
    \ can see from the directions of motion that the equilibrium is *globally* stable,\
    \ since it attracts all initial conditions. We can confirm this by running a stability\
    \ check with the eigenvalues. The eigenvalues are $\\lambda_1 = -1, \\lambda_2\
    \ = -5$, confirming that each term in the system (C.21) decays to equilibrium.\
    \ This is a *stable node* equilibrium.\n\n```\n$$\\begin{bmatrix} v_1^1 \\ v_2^1\
    \ \\end{bmatrix} = \begin{bmatrix} 2 \\ 2 \\end{bmatrix} \\quad (\\lambda_1 =\
    \ -1)$ (C.24)\n```\n\n```\n$$\\begin{bmatrix} v_1^2 \\ v_2^2 \\end{bmatrix} =\
    \ \begin{bmatrix} 2 \\ -2 \\end{bmatrix} \\quad (\\lambda_2 = -5)$ (C.25)\n```\n\
    \nThese eigenvectors are plotted in Figure C.2c as lines going through the equilibrium\
    \ (origin) with slope = 1 for $\\lambda_1 = -1$ and slope = -1 for $\\lambda_2\
    \ = -5$ (dashed lines). Eigenvectors are key trajectories in phase space that\
    \ can be viewed as ‘positioning’ other trajectories. Other trajectories run parallel\
    \ to an eigenvector towards equilibrium (if the corresponding eigenvalue is negative)\
    \ or away from equilibrium (if the corresponding eigenvalue is positive). The\
    \ figure also shows phase space trajectories"
  merge: -1
