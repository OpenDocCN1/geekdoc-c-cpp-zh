    The user-defined function (cd_takens.udf) requires input of the time series and
    the maximum embedding dimension m_max. The function estimates the correlation
    dimension for several embedding dimensions with a loop running from m=2 through
    m_max. Each iteration the loop initially computes the embedded data matrix and
    the associated distance matrix (Steps 1-3).


    Step 4 then adjusts the distance matrix to the Theiler window with time indices
    differing by less than two. Figure 7.3 illustrates this for a $4 \times 4$ distance
    matrix, where $d(i,j)$ is the distance between points $i$ and $j$. If $tu=2$,
    we are left with three: $d(1,3)$, $d(1,4)$ and $d(2,4)$. Since the distance matrix
    is symmetric, we omit the redundant $d(3,1)$, $d(4,1)$ and $d(4,2)$. We also omit
    the diagonal distances. Step 4 performs this in two steps: In step 4a, the first
    two rows and two columns are removed from the matrix, leaving the submatrix in
    the lower quadrant. In step 4b, loop $i$ is used to eliminate the remaining distances
    in the lower quadrant whose time indices differ by less than two (i.e. $d(2,3)$).
    During the first pass through the loop ($i=1$), the command column=dist[i:n-tw]
    picks out both elements of the first column of the submatrix, $d(1,3)$ and $d(1,4)$,
    of which satisfy the Theiler window. During the second column satisfying ($i=2$),
    the command picks out the second element of the second column satisfying the Theiler
    window with NA.


    | d(1,1) | d(2,1) | d(3,1) | d(4,1) |

    |---|---|---||}{

    | d(1,2) | d(2,2) | d(3,2) | d(4,2) |

    | d(1,3) | d(2,3) | d(3,3) | d(4,3) |

    | d(1,4) | d(2,4) | d(3,4) | d(4,4) |


    Figure 7.3 Illustration of adjustment of the distance matrix to the Theiler window.


    Step 5 takes the columns of the submatrix, removes NA elements and leaves with
    a vector of elements satisfying the Theiler window.


    Step 6 follows convention in setting the upper threshold $\varepsilon_0$ at half
    of the root-mean-squares (rms) amplitude of the time series (Theiler et al., 1992;
    Kantz and Schreiber, 1997) omits distances in the vector exceeding this bound.
    Finally, Step 7 calculates the Takens estimate of the correlation dimension for
    a particular embedding dimension using eq (7.3).


    # 7.4.2 Maximum Lyapunov Exponent


    The maximum Lyapunov exponent measures the average rate at which initially bouncing
    points on an attractor diverge or converge, and consequently to the extent that
    an attractor exhibits the sensitivity to initial conditions characteristic of
    deterministic chaos (Kaplan and Glass, 1995; Kantz and Schreiber, 1997). We illustrate
    this sensitivity in the chaotic Lorenz attractor by applying the user-defined
    function lorenz.udf to plot the x coordinate of a solution trajectory'
