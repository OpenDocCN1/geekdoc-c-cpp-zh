    # 6.2 Regular Behaviour of Linear ODE Models


    We begin by exploring the regular behaviour of two-dimensional linear ODE systems
    with the following model:


    ```

    $$\frac{dx}{dt} = \dot{x} = ax_t + by_t, \quad x_{t=0} = x_0$$

    $$$\frac{dy}{dt} = \dot{y} = cx_t + dy_t, \quad y_{t=0} = y_0$$

    ```


    or, in matrix form,


    ```

    $$\begin{bmatrix} \dot{x}_t \ \dot{y}_t \end{bmatrix} = \begin{bmatrix} a & b
    \ c & d \end{bmatrix}_A \begin{bmatrix} x_t \ y_t \end{bmatrix} \quad (6.1)$

    ```


    The system parameters are the constants a, b, c and d. The system is autonomous,
    because it is not explicitly a function of time. The solution comprises the trajectories
    of the variables $x_t$ and $y_t$ satisfying the differential equations from initial
    levels $x_0$ and $y_0$. The *nullclines* set each ODE equal to zero:


    ```

    $y|_{x=0} = \frac{a}{b}x_t$$

    $$y|_{y=0} = -\frac{c}{d}x_t$$

    ```


    The system is at equilibrium when the nullclines intersect. This occurs at the
    origin, the equilibrium is $x^* = y^* = 0$.

    The general solution to the system is (6.1)


    ```

    $$\begin{bmatrix} x_t \ y_t \end{bmatrix} = k_1(x_0, y_0)e^{\lambda_1 t}EV_{\lambda_1}
    + k_2(x_0, y_0)e^{\lambda_2 t}EV_{\lambda_2} \quad (6.2)$

    ```


    where $\lambda_1$ and $\lambda_2$ are real eigenvalues of the coefficient matrix
    $A$, $EV_{\lambda_1}$ and $EV_{\lambda_2}$ are their corresponding eigenvectors,
    and $k_1$ and $k_2$ are constants tying the general solution to the initial values
    $x_0$ and $y_0$. Appendix C presents a brief primer on computation of eigenvalues
    and eigenvectors. Casual observation of eqn (6.2) demonstrates that stability
    depends on the signs of the eigenvalues of $A$, because they are exponential in
    solution. When both eigenvalues are negative, each term in the solution dampens
    to a *stable node* equilibrium at $x^*=y^*=0$. Alternatively, when both are positive,
    each term explodes away from an *unstable node* equilibrium. When the eigenvalues
    have opposite sign, the term associated with the positive eigenvalue'
