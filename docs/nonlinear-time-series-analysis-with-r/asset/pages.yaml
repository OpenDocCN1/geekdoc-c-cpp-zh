    Although the points $x_i^*$ and $x_j^*$ are not fixed points of $f(x_t)$, they
    are stable points of $f^{[2]}(x_t)$ and correspond to the period-2 stable cycle
    (0.7995, 0.5130) of $f(x_t)$. Since $f(x_t)$ alternates between values $x_i^*$
    and $x_j^*$, we have


    ```

    $f^{[2]}(x_i^*) = f''(x_j^*) \cdot f''(x_i^*) = f^{[2]}(x_j^*)$

    ```


    indicating that the slope of $f^{[2]}(x_t)$ in the two fixed points is: $f^{[2]}(x_i^*)
    = f^{[2]}(x_j^*)$. Thus, we can compute either slope by computing $f''(x_t)$,
    for example, and squaring the result. Using the fixed point method (2.13), substituting
    for $x^0$ from eqn (2.15) and denoting $r'' := \sqrt{r^2-2r-3}$ gives


    ```

    $f^{[2]}(x_i^*) = f^{[2]}(x_j^*) = (r-2r(\frac{r+1}{r})) \times (r-2r(\frac{r-1}{r}))$$$

    = $(-1+r'') \times (-1-r'')$$

    = $1+(r'')^2-r^2+2r''+3$$

    = $4+2r-r^2$

    ```


