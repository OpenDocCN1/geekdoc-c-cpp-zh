    # 6.7 Endogenous Complexity with Nonlinear Dynamics


    We have observed how noisy and nonstationary data can exhibit irregular behaviour.
    We have also investigated how we can empirically test for these factors and begin
    to eliminate them as potential drivers of real-world dynamics. To conclude this
    chapter, we illustrate how irregular dynamics can be generated by a deterministic
    system of at least three nonlinear ODEs (Kantz and Schreiber, 1997). Put another
    way, these systems need at least three degrees of freedom (Theiler, 1990). This
    is a necessary but not sufficient condition for deterministic irregularity. Multidimensional
    nonlinear systems of ODEs introduce the complication of multiple equilibria, since
    nonlinear nullines can intersect more than once. However, depending on parameters,
    the local stability of these equilibria may be restricted to the types found in
    linear ODE systems (Glendinning, 1994). The presence of three or more degrees
    of freedom opens the door to endogenous irregular dynamics, but does not guarantee
    them.'
