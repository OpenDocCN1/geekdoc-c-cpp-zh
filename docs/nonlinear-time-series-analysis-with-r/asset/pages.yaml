    From now on, we will write $f(f(x_{t+1}))$ as $f^{[2]}(x)$. In terms of the logistic
    map (2.7) iterates, we solve for $f^{[2]}(x)$ as follows:


    ```

    $f^{[2]}(x_t) = f(x_{t+1}) - rx_{t+1}^2$

    = r(rx_t - rx_t^2) - r(rx_t - rx_t^2)^2$

    = r^2x_t - (r^2+r^3)x_t^2 + 2r^3x_t^3 - r^3x_t^4$

    ```


    Solution of this equation gives four fixed points:


    ```

    $x_1^* = 0$

    $x_2^* = \frac{r-1}{r}$

    $x_3^* = \frac{r+1+\sqrt{r^2-2r-3}}{2r}$

    $x_4^* = \frac{r+1-\sqrt{r^2-2r-3}}{2r}$ (2.15)

    ```


    Fixed points $x_3^*$ and $x_4^*$ arise when the discriminant under the square
    root, $r^2-2r-3=(r+1)(r-3)$, is positive, which holds for $r \geq 3$. Otherwise,
    the fixed points are complex, and only $x_1^*$ and $x_2^*$ exist (as in the case
    $r=2.8$).


    The stability of the fixed point $x_{t+2} = f^{[2]}(x_t)$ depends on the derivative:


    ```

    $f^{[2]}''(x^*) = f''(x^*) \cdot f''(x^*)$ (2.16)

    ```


