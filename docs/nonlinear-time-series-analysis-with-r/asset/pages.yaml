  md: '# Solution of Phenomenological Model 283


    The R package boot is used for bootstrapped resampling and the routine boot.ci
    is used to compute confidence intervals. For run boot, we formulate a user-defined
    function to compute nse for each resampling. We set up a loop to run boot routine
    ecdfstats for each ODE in the phenomenological model separately, and use the R
    function to compute an empirical cumulative distribution function (CDF) for the
    bootstrapped performance measure. We use the empirical CDF to compute the probabilities
    that the calculated nse is within various probability intervals, and the probability
    (p-value) that it exceeds the threshold value nse ≥ 0.65. Small p-values support
    the decision to accept the alternative hypothesis that the computed nse indicates
    an acceptable fit. On a last note, if the routine boot.ci fails to produce a confidence
    interval, a remedy is to increase the number of bootstrap replications (i.e. R
    in the boot() command).


    The output of Code 9.5 returns the results shown in Table 9.5, which columns are
    the fitted ODEs and rows are the computed nse, the p-value nse ≥ 0.65 and the
    probabilities that nse rests in various intervals. The code also returns plotteds
    for each fitted ODE (Figure 9.1). We observe that the ODEs estimated with Adaptive
    LASSO provide excellent fits to the computed finite differences (Code 9.1) from
    the Lorenz data, which the computed nse measures are almost 1 and the computed
    p-values are zero.


    Table 9.5 Code output: goodness-of-fit table for estimated ODEs

    | nse | y.ode | z.ode |

    |---|---|--|

    | 0.999 | 0.999 | 0.999 |

    | p-value (nse ≤ 0.65) | 0.000 | 0.000 | 0.000 |

    | Prob(nse < 0) | 0.000 | 0.000 | 0.000 |

    | Prob(0 < nse < 0.099) | 0.000 | 0.000 | 0.000 |

