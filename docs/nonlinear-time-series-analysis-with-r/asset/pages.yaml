    # 8.2.1 False Positives


    Sugihara et al. (2012) noted that CCM could give false positives in the case of
    ''generalized synchrony''. False positives occur when CCM incorrectly detects
    a unidirectional causal relationship between two variables that does not exist.
    Generalized synchrony occurs as nodes between two variables when, for example,
    x forces y, but y does not interact with x in the other direction . Consequently,
    system dynamics are synchronized to x, and CCM may miscontrue this as v forcing
    x (a false positive). Ye et al. (2015) illustrate generalized synchrony with model.2:


    ```

    $v(t+1) = v(t)[3.8 - 3.8v(t)]$\nnw(t+1) = w(t)[3.1 - 3.1w(t) - 0.8v(t)]$

    ```


    There is strong forcing of v(t) on w(t+1), with a delay of one period, but w does
    not interact with v in the first equation of (8.2). We use Code 8.1 to run CCM
    on this system with the commands model.1<-FALSE and model.2~TRUE. CCM generates
    the following adjacency matrix:


    | v w |

    |---|---|

    | 0 | 1 |


    CCM falsely detects that w drives v in the first equation of (8.2) (we know this
    from the 1 in the upper right of the matrix). The plot of the cross mapping v
    xmap w also displays this false positive, since prediction skill levels off at
    a high value (Figure 8.3a). Alternatively, CCM correctly detects that v drives
    w in the second equation (Figure 8.3b).'
