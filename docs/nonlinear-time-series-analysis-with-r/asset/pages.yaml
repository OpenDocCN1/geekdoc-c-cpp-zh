  md: 'left eigenvectors from the eigenplets associated with the $k$ largest singular
    values: $(vp_1,\dots,vp_k)$. These left eigenvectors span a hyperplane $vp\_k$
    given by


    ```

    $vp\_k = \text{span}\{vp_1,\dots,vp_k\} \quad (8.4)$

    ```


    From decomposition of the future series, we select the eigenvector from the triplet
    associated with the largest singular value: $vf.1$. Then, with one last bit of
    linear algebra, we can determine whether the dynamics have shifted from the past
    to the future series. Specifically, we project $vf.1$ (representing future behaviour)
    onto the hyperplane $vp\_k$ (representing past behaviour) by taking the inner
    product:


    ```

    $ip.vec = (vf.1)^T vp\_k \quad (8.5)$

    ```


    where superscript $T$ denotes the transpose. This projection allows us, in Step
    3, to estimate the distance between the vector $vf.1$ and the hyperplane $vp\_k$
    using a metric such as that proposed by Itoh and Marwan (2013):


    ```

    $z = 1 - \sum_{i=1}^k (ip.vec)^2 \quad (8.6)$

    ```


    The metric $z$, referred to as the *change-point* (CP) score, falls in the interval
    $0 \le z \le 1$. The CP score spikes at times (change points) when eqn (8.6) measures
    a relatively large distance, indicating a break between past and future dynamic
    behaviour.


    Loop $i$ repeats 2 and 3 for each reference time in the feasible interval:


    ```

    $b+1 \le t_r \le N-2b-g+1 \quad (8.7)$

    ```


