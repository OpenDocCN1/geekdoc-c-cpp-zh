  md: "# 330 Appendix B\n\n```\n$$\\sigma_{\\hat{F}}^2 = E_{\\hat{F}}[(X-\\mu_{\\\
    hat{F}})^2] = \\frac{1}{n}\\sum_{i=1}^n(x_i-\bar{x})^2$$\n```\n\nThe final result\
    \ is the same as eqn (B.7), with $n^2$ in place of $n(n-1)$. Obviously, if $n$\
    \ is not too small, one estimate is like the other.\n\nWe now estimate the standard\
    \ error with the bootstrap. Let $x=(x_1,x_2,\\dots,x_n)$ be the observed sample,\
    \ derived from an unknown probability distribution $F$. We have to estimate a\
    \ certain parameter $\theta=t(F)$ on the basis of $x$. For this purpose, we compute\
    \ an estimate $\\hat{\theta}$ of $\theta$:\n\n```\n$$\\hat{\theta} = s(x)=s(x_1,x_2,\\\
    dots,x_n)$$\n```\n\nThe function $s(x)$ may be the plug-estimate $t(F)$, but not\
    \ necessarily. In fact, $s(x)$ may be a complex function of the data, but it may\
    \ be a numerical procedure, a computer code, with input the sample $x$ and output\
    \ the estimate $\\hat{\theta}$. As a measure of statistical accuracy, we choose\
    \ the bootstrap estimate of the standard error. We will see this that:\n\n+  \
    \ (1) is completely automatic;\n\n+   (2) does not require theoretical calculations;\n\
    \n+   (3) can be obtained for any $s(x)$ (function or code).\n\nThe bootstrap\
    \ is based on two notions: bootstrap sample and bootstrap replication. A bootstrap\
    \ sample $x^*$ is a random sample of dimension $n$ drawn from $F$:\n\n```\n$x^*\
    \ = (x_1^*,x_2^*,\\dots,x_n^*)$\n```\n\nWe can regress $x=(x_1,x_2,\\dots,x_n)$\
    \ as the population of $n$ objects $(x_1,x_2,\\dots,x_n)$ and $(x_1^*,x_2^*,\\\
    dots,x_n^*)$ as a random sample of dimension $n$ drawn from the population. An\
    \ example of a bootstrap sample is eqn (B.3).\n\nWith the bootstrap sample $x^*$,\
    \ we compute the bootstrap replication $\\hat{\theta}^*$:\n\n```\n$$\\hat{\theta}^*\
    \ = s(x^*)=s(x_1^*,x_2^*,\\dots,x_n^*)$\n```\n\nIt is immediately evident that\
    \ we have to $x^*$ the same function (or code) we applied to $x$. For instance,\
    \ if the mean calculated on the sample $x$ (in our case $\bar{x}=4.91$), then\
    \ $\bar{x}^*$ is the mean of the bootstrap sample $x^*$, i.e.\n\n```\n$x^* = \\\
    frac{1}{n}\\sum_{i=1}^n x_i^*$$\n```\n\nIn our case, $\bar{x}^*=4.50$. We derive\
    \ $se_{\\hat{F}}(\\hat{\theta}^*)$ as the bootstrap estimate of $se_F(\\hat{\t\
    heta})$. Symbolically,\n\n```\n$se_{\\hat{F}}(\\hat{\theta}^*) \\xleftarrow{\t\
    ext{bootstrap estimate}} se_F(\\hat{\theta}) \\text{unknown}$\n```\n\nHowever,\
    \ to compute the empirical distribution function $\\hat{F}$, we need all the bootstrap\
    \ samples and we compute the replications $\\hat{\theta}^*$ for all the samples.\
    \ The number of"
