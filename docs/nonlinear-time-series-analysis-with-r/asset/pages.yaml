  md: '# Phenomenological Modelling


    in the ODEs We can select whether to use OLS, elastic-net or Adaptive LASSO coefficients
    to parameterize the model. If we select elastic-regression, the mixing parameter
    allows us to run ridge regression for α = 0, LASSO for α = 1 or a combination
    of the two regressions for intermediate values of α (Friedman et al., 2015). If
    we select Adaptive LASSO, we can manipulate the tuning parameter nu (Zou, 2006).
    Finally, we can lower the integration step δ to decrease the error in computing
    differences (Guesbet and Maquet, 1992) and to fine tune the numerical solution
    of the phenomenological model. Consistent with the Lorenz equations providing
    data, we set the number of equations to m = 3, the number of polynomial terms
    to Mm = 8, and the integration step to δ = 0.01. OLS regression worked to reproduce
    the terms and associated coefficients in the original model.


