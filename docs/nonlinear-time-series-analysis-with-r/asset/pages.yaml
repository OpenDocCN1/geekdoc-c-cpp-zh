    We use the solution to the Lorenz equations for our time series (Step 1). We embed
    the embedding dimension m, the embedding delay d and the Theiler window 72 (Step
    2). The time-series object x.ts. lyap_k(tseriesChaos) also requires that the data
    x to be converted to an R time series object x.ts (Step 3a). The command takes
    the form x.ts<-ts(start=(0,1), end=(periods,1),frequency). In this example, the
    periods equals the end=500 periods in solving for the Lorenz time series (Step
    2), and further is set to 10 since the integration step is set at delta=0.1 in
    the Lorenz solution. This means that each of the 500 periods is split into 10
    iterations, resulting in 5000 iterations (including the initial condition). In
    another example, if we convert 72 years of monthly data (864 observations) to
    an R time series, the conversion command would read x.ts<-ts(start=(0,1),end=(72,1),frequency=12).
    The lyap_k(tseriesChaos) further requires that we set the threshold distance parameter
    eps, which we can do with distance matrix from embedding (Step 3b).


    In Step 3c, we run lyap_k(tseriesChaos), which generates a semilogarithmic plot
    of the log of separation against time periods with the command lyap_out. The s
    parameter and the ref parameter sets the number of reference points to consider.
    (the x axis). Observe a strong linear section to the semilogarithmic plot (dashed
    line) running from 1 to 3.4 periods along the x axis (see Figure 4). The lyap_k(tseriesChaos)
    estimates the slope of the linear portion with the command LE.max<-lyap(lyap_out,1,3,4)
    (Step 3d). This slope gives an estimate of the maximum Lyapunov exponent LE.max=0.9,
    which is consistent with numerical estimates in the literature (Sprott, 2016).


    #  7.4.3 Nonlinear Prediction Skill


    A hallmark of deterministic behaviour is the skill with which an empirically reconstructed
    attractor (Kaplan and Glass, 1995). Nonlinear prediction skill is strongly recommended
    for using as a discriminating statistic in surrogate data testing, given the numerical
    challenges of estimating reliable measures of correlation dimension and maximum
    Lyapunov exponents with short and noisy series data (Kantz and Schreiber, 1997).
    Code 6.14 in Chapter 6 formulates a user function to run nonlinear prediction
    that we shall use in the surrogate data testing in the present'
