    # 2.5 Dynamics of the Logistic Map


    The logistic map (2.7) generates a wide variety of dynamic behaviours for increasing
    values of $r$. We can analyse the stability implications by substituting the fixed
    point $x^* = (r-1)/r$ into the fixed point multiplier (2.11):


    ```

    $m=r(1-2x^*) = r(1-2\frac{r-1}{r}) = 2-r$

    ```


    The fixed point is stable for $1 < r < 3$, since $|2-r| < 1$, and unstable for
    $3 < r < 4$. We now consider logistic maps when $r$ is increased into the beginning
    of the unstable range with value $r = 3.2$. This introduces the behaviour of *periodic
    point attractors*. Code 2.3 produces the resulting time series and cobweb plot
    from an initial value $x_0 = 0.002$ in Figure 2.6.'
