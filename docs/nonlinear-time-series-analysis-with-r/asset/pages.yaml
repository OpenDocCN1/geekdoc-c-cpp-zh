    \ and we plot a black dot at the point (i,j); otherwise, we plot a small white\
    \ circle, or we plot nothing. This kind of graph is called a recurrence plot (RP)\
    \ and was introduced for the analysis of dynamical systems in 1987 by J.-P. Eckmann\
