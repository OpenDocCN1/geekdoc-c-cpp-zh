    # 6.4 Singular Spectrum Analysis


    We signal processing methods to reduce the impact of noisy data on masking other
    potential drivers of complex behaviour. We focus on singular spectrum analysis
    (SSA) as a data-driven method that detects structural variation in highly irregular
    time series data without imposing ex ante theoretical presumptions regarding the
    source of irregularity (Elsner and Tsiopsis, 2010; Golyanda et al., 2001). SSA
    separates time series into structured variation (signal), including trend and
    oscillatory components, and residual unstructured (noise). It does in three steps:
    matrix decomposition, grouping and time series reconstruction. There are two methods
    of performing these steps: singular value decomposition (SVD)-SSA and Toeplitz-SSA.
    Each method takes a different approach to matrix decomposition, resulting in alternative
    mathematical measures of signal strength.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Singular Spectrum Analysis 155


    SSA provides a number of benefits beyond filtering noise. It may ease nonstationarity
    by allowing us to remove slow-moving trend components that may be at the root
    of the problem. It measures signal strength so that we can make an informed decision
    regarding whether to continue searching for deterministic structure in observed
    time series. Finally, SSA can be applied to fill in missing observations in observed
    data (Golyandina et al., 2001). It does so by using the structured variation in
    the entire time series rather than relying solely on immediately surrounding observations
    as moving average approaches.


    In practice, we use SSA using the R package Rssa (Korobeynikov et al., 2015).
    Rssa provides a number of visual diagnostics that the user must learn to interpret
    or the package. To aid interpretation, we illustrate how SSA operates inside Rssa
    with the simple time series $x_t = (1,3,0,-3,-2,-1)^T$ (superscript T denotes
    the transpose). We formulate code to illustrate the illustration using SVD-SSA
    and then Toeplitz-SSA.


    # 6.4.1 SVD-SSA


    Code 6.5 Illustration of SVD-SSA mechanics


    ```

    #Code 6.5 Illustration of SVD-SSA mechanics

    rm(list-is(all(TRUE)))


    x<-c(1,3,0,-3,-2,-1) #sample time series


    #Step 1: Matrix decomposition


    #Step 1a: Trajectory matrix

    library(tseriesChaos)

    X<-embed(x,3,1) #embedded trajectory matrix

    row<-nrow(X);ncol<-ncol(X)


    #Step 1b: Lagged covariance matrix

    S<-t(X)*%x


    #Step 1c: Eigensystem of S

    eigens<-eigen(S,symmetric=TRUE)

    eigenvalues<-eigenigens$values #eigenvalues

    eigenvectors<-eigenigens$vectors #eigenvectors

    #Left eigenvectors

    left[1,<-eigenvalues[1]/sqrt(eigenvalues[1])

    left[2,<-eigenvalues[2]/sqrt(eigenvalues[2])

    left[3,<-eigenvalues[3]/sqrt(eigenvalues[3])


    #Step 1d: Matrices in decomposition

    X1<-sqrt(eigenvalues[1])*left[1,*%vectors[,1]]

    X2<-sqrt(eigenvalues[2])*left[2,*%vectors[,2]]

    X3<-sqrt(eigenvalues[3])*left[3,*%vectors[,3]]


    #Step 1e: Characteristic contributions of Xi

    X1.ccc<-eigenvalues[1]/sum(eigenvalues)

    X2.ccc<-eigenvalues[2]/sum(eigenvalues)

    X3.ccc<-eigenvalues[3]/sum(eigenvalues)


    #Step 2: Matrix grouping

    X12<-X1+X2

    X12.cc<-(eigenvalues[1]+eigenvalues[2])/sum(eigenvalues)

    ```'
