    \ = \\begin{bmatrix} 1 \\ -2 \\\\end{bmatrix}$ (C.15)$\n```\n\n```\n$v_2^2 = \\\
    begin{bmatrix} v_2^2 \\ -\\frac{1}{2}v_2^2 \\\\end{bmatrix} = \\begin{bmatrix}\
    \ 2 \\ -1 \\\\end{bmatrix}$ (C.16)$\n```\n\nExample: *Complex eigenvalues.* We\
    \ compute the eigenvalues and eigenvectors associated with the matrix\n\n```\n\
    $A = \\begin{bmatrix} 2 & -36 \\ 1 & 2 \\\\end{bmatrix}$ (C.17)$\n```"
