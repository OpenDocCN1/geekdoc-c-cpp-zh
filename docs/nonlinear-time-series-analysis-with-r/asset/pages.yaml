  md: '# Embedding Procedure


    Suppose that we measured the angle $\theta$ every second and also that we are
    not acquainted with eqn (3.1). Can we obtain the information necessary to plot
    the phase space portrait of Figure 3.2? The answer is affirmative and the procedure
    is called *embedding*. Embedding a time series means reconstructing (approximately)
    the phase space in which the system evolves in time; in other words, showing how
    ''all'' the variables describing the system evolve in. By ''all'' here we mean
    more precisely ''the relevant ones''. Note that even if we have measured only
    one variable, i.e. we have a scalar series, we can construct a vector space whose
    axes represent all the (relevant) variables. The underlying idea is to make copies
    of the measured signal with fixed time delays and consider these delayed values
    as coordinates of a phase space, retrieved from the data.


    We have a time series with the following measured data:


    $s_1, s_2, \dots, s_N$


    In the $m$-dimensional reconstructed phase space, a point at time $t$ is given
    by a vector $y_t$ with the following components:


    +   - first component $s_t = s(t)$

    - second component $s_{t+d} = s(t+d)$

    - third component $s_{t+2d} = s(t+2d)$


    If $m=2$, then $y_t = (s_t, s_{t+d})$; if $m=3$, then $y_t = (s_t, s_{t+d}, s_{t+2d})$.


    The vectors of the reconstructed phase space are also called *Takens vectors*.
    Let us give a schematic example. Suppose that we have $N=10$ measurements of a
    certain variable $x(t)$ and let $s(t)$ be the results:


    measurements of $x(t) = s(t)$: $3, 5, 4, 2, 1, 4, 6, 7, 2$


    The measurements are numbered $1, 2, \dots, 10$. Suppose that the measurements
    are taken every time interval, $\Delta = 30$. Then the first measure, taken at
    time $t=1$, is $s_1 = 3$. After 30 seconds, at $t_2 = t+\Delta$, the second measure
    is $s_2 = 5$. The third measure is taken after 60 seconds at $t_3 = t+2\Delta$
    and $s_3 = 4$. After 90 seconds, at $t_4 = t+3\Delta$, the fourth measure is $s_4=2$,
    and so on.


    For the embedding, we choose (following certain criteria that we shall describe
    shortly) $m = 3$ and $d=1$. The variable $m$ is called the *embedding dimension*
    and $d$'
