    \ |\n| 6 | 3.569692 | $9.33000 \times 10^{-4}$ | 4.6645 |\n\n> $$\\lim_{n\\to\\\
    infty} \\frac{\\Delta_n}{\\Delta_{n+1}} = \\lim_{n\\to\\infty} \\frac{r_n^* -\
    \ r_{n+1}^*}{r_{n+1}^*} \\approx 4.6692016092909 \\equiv \\delta$\n\nThis result\
    \ was obtained at the end of the 1970s by Mitchell Jay Feigenbaum (Feigenbaum),\
    \ and the above limit is known as the *Feigenbaum delta*. The bifurcation diagram\
    \ in Figure 2.11 is also called the *Feigenbaum tree*. Ironically, in German,\
    \ *Baum* means 'tree' and the noun Feigenbaum means 'fig'. Feigenbaum not only\
    \ found the value of $\\delta$, but also demonstrated that this value is not exclusive\
    \ to the logistic map, but rather a *universal constant*, (unimodal maps) follow\
    \ the same *route to chaos* as the logistic map, namely through a *bifurcation\
    \ cascade* with the distances between doubling periods becoming shorter and shorter,\
    \ and in the limit approaching the Feigenbaum $\\delta$. The same dynamics are\
    \ followed also by real systems that approach the chaotic regime.\n\nThere is\
    \ a further constant characteristic of the Feigenbaum tree — it concerns the width\
    \ of the bifurcations, as shown in Figure 2.15. From the bifurcation diagram,\
    \ one can see that, as $n$ increases, not only the period doublings follow each\
    \ other at shorter and shorter distances, but also the widths of bifurcations\
    \ become smaller and smaller. Let $a_n$ be the width of the bifurcation in period-$2^n$\
    \ cycle, measured with respect to the line $x_l=0.5$. Then, as $n\\to\\infty$,\
    \ the ratio between the widths of consecutive bifurcations tends to follow:\n\n\
    > $$\\lim_{n\\to\\infty} \\frac{a_n}{a_{n+1}} \\approx 2.5029078750 \\equiv \\\
    alpha$\n\nBoth of the constants $\\delta$ and $\\alpha$ are known as *Feigenbaum\
    \ numbers*.\nIn conclusion, we can say that it is true that the values of the\
    \ Feigenbaum points are different for different maps, since the values of $r_\\\
    infty^*$ differ, but for unimodal maps the Feigenbaum numbers are the same."
