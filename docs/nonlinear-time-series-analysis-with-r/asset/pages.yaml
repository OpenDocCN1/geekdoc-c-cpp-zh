    > > ''It is more than possible, it is probable.''

    Arthur Conan Doyle, Silver Blaze


    # ## 7.1 Introduction


    The dynamics of real-world biophysical systems are conventionally investigated
    by relying on theory to formulate an abstract model, calibrating the model to
    available data and characterizing simulated model dynamics (Kaplan and Glass,
    1995). The conventional approach raises a number of concerns, including the following:


    +   - If everyone agrees on theory, there are multiple ways to model processes
    that can generate widely disparate behaviour. How can we tell which model specification
    corresponds best to the real-world behaviour that we want to understand?

    - Even if everyone agrees on theory and a particular model, the same model can
    be parameterized to display vastly different behaviour (Hornberger and Spear,
    1981). How can we tell which set of parameters is the most reasonable?

    - If there is disagreement over theory, and flexible models can be calibrated
    to produce behaviour consistent with the expectations of multiple theories, how
    can we reliably use models to distinguish between competing theories?


    These concerns cut across any attempt to capture real-world behaviour with abstract
    models, and boil down to one question: How can we demonstrate correspondence between
    our model and the real world? We must abstract from an open-ended reality to which
    there is only limited access. Moreover, we cannot logically verify that a particular
    abstraction is an accurate representation of reality (Oreskes et al., 1994). Similar
    to the courtroom, we are lawyers trying to convince a jury of peers that our model
    reasonably corresponds to the reality that we attempt to explain. In the European
    Union, the jury of peers informs a government agency that formally audits models
    used in public policy. What type of evidence makes a compelling case for real-world
    correspondence in a model audit?


    In this book, we join the chorus of voices recommending ''getting to know your
    data'' as a preliminary evidentiary step in modelling (Crawley, 2015). The first
    thing we notice about time series data is that they are often highly fluctuating,
    with a random appearance. Observed volatility is commonly attributed to external
    random shocks to real-world systems that are otherwise stable. If we believe this,
    we can model the'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'stable portion of the system with linear dynamics and excite volatility by
    adding random shocks. However, breakthroughs in nonlinear dynamics raise another
    possibility: Highly complex dynamics can emerge from astoundingly parsimonious
    deterministic nonlinear models (Glendinning, 1994). The implication is that we
    can no longer make a compelling case for our model by presumably that observed
    complexity is to exogenous random forces. We must find a way to replace presumption
    with hard empirical evidence regarding the driving dynamics.


    We can do this by following that noisy and nonstationary data distort deterministic
    structure, and make linear dynamical structure appear nonlinear. Consequently,
    we can begin with signal processing to separate signal (structured variation)
    from noise (i.e. unstructured variation) in the data, and a nonstationarity test
    to reveal shifting dynamical structure .


    Next, we attempt to reconstruct the dynamics of the entire system from the isolated
    stationary system and test the dynamics for deterministic structure. If the dynamics
    of the underlying real-world dynamical system are dissipative, trajectories converge
    to a subset of phase space where they oscillate along an attractor after we .
    We cannot realistically reconstruct a real-world attractor without direct evidence
    of deterministic dynamics, because we would need to know, and have histories of,
    all system variables. However, we can work to reconstruct a shadow version of
    a real-world attractor from times without prior knowledge of system equations
    (Kaplan and Weiss, 1995; Theiler et al., 1992). If we use conventional time-delay
    embedding, the coordinates of shadow phase space are the signal and delay-coordinate
    copies that serve as surrogates for unobserved system variables . Takens (1981)
    proved a sufficient condition guaranteeing that shadow space preserves essential
    mathematical properties of the original phase space, since time-delay embedding
    provides a one-to-one mapping of points from the shadow attractor to points on
    the original attractor (Figure 7.1). The sufficient condition is $m > 2D+1$, where
    $m$ is the embedding dimension of shadow phase space and $D$ is the fractal dimension
    of the real-world attractor. Since the dimension of the real-world attractor is
    unknown, we cannot use the sufficient condition to easily estimate the required
    embedding dimension. Statistical tests are available to choose time-delay embedding
    parameters approximating the ideal conditions.


    Successful reconstruction of a shadow attractor may be generated by deterministic
    dynamics. However, because we cannot realistically expect signal processing to
    purge the signal of all noise and because linear behaviour can be visually indistinguishable
    from nonlinear behaviour, the possibility remains that noticeable regularity detected
    in a shadow attractor may be fortuitiously reconstructed from data generated by
    a linear stochastic process (Schreiber and Schmitz, 2000; Kantz and Schreiber,
    1997; Theiler et al., 1992). This chapter investigates how we can test this null
    hypothesis using surrogate data testing. The combination of a noticeably regular
    shadow attractor, with strong statistical rejection of spurious regularity, increases
    the probability that observed data are generated by deterministic real-world dynamics.'
