    # 9.9 Phenomenological Model Extracted from Three Observed Variables


    Code 9.7 combines 9.1–9.6 into one program extracting a phenomenological model
    from three observed time series variables . In addition, we employ the defined
    function spectral (Code 6.8) to compute cycle lengths of the time series solutions
    from the model. Code 9.7 outputs table summarizing OLS, LASSO or Adaptive LASSO
    estimated coefficients; goodness-of-fit statistics; and Lorenz solutions simulated
    by the phenomenological representation. It plots the simulated solutions along
    with the Lorenz ‘butterfly’ attractor.


    In running Code 9.7, our strategy is to tune parameters on a trial-and-error basis
    within ranges providing numerical stability and successful reproduction of empirically
    detected dynamics. We can set the number of equations in the phenomenological
    models with m and the polynomial range with M$_p$ to fix the number of polynomial
    terms'
