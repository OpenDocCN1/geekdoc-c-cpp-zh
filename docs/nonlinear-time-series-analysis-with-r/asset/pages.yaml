  md: "# Testing for Nonstationarity in Time Data 185\n\nElements along the diagonal\
    \ measure zero distances between a row and itself. The matrix is symmetric because\
    \ $d(p_i, q_j) = d(p_j, q_i)$. If we identify the first row of $M$ as the reference\
    \ point, then we use the first column of the matrix to measure the Euclidean distances\
    \ from the reference point to the second $d(1,2) = 10.49$ and third $d(1,3) =\
    \ 12.88$ rows.\n\nStep 2b(1) proceeds by isolating the column in the distance\
    \ matrix, dist, giving the distances between the reference point and remaining\
    \ points on the attractor, and scales these distances to the largest distance\
    \ in the column. We apply the R command order to put the scaled distances in ascending\
    \ order from the closest to the farthest removed, and delete the zero distance\
    \ from the reference point to itself. Finally, we isolate the $m+1$ smallest distances\
    \ (where $m$ is the embedding dimension of the reconstructed attractor), identify\
    \ the corresponding points as nearest neighbours to the reference point, and determine\
    \ their next-period values. The $m+1$ nearest neighbours are the minimum required\
    \ to run the simplex averaging algorithm formulated by Sugihara et al. (2012)\
    \ to compute predicted points. The reconstructed Mayport attractor (Figure 6.16),\
    \ we use the next-period values of the $m+1$ nearest neighbours.\n\nStep 2b(2)\
    \ codes the simplex averaging algorithm formulated in the supplemental materials\
    \ to Sugihara et al. (2012). The algorithm computes predicted values from the\
    \ locally weighted mean of the next period values of the $m+1$ nearest neighbours.\
    \ The weight for a given nearest neighbour is its distance from the reference\
    \ point relative to the totals of all nearest neighbours from the reference point.\
    \ The output of Step 2b(2) is the predicted point on the attractor for the iteration.\
    \ The corresponding predicted time series observation is the first element of\
    \ the multidimensional attractor point. Step 2b(3) identifies the contemporaneous\
    \ test point on the attractor, and the corresponding test time series observation\
    \ (again the first element of the attractor point). When the iterations are completed\
    \ (i.e. all test values have been predicted), respectively.\n\nFinally, Step 3\
    \ adopts the dimensionless Nash–Sutcliffe coefficient of efficiency, nse (Nash\
    \ and Sutcliffe, 1970) prevalent in hydrological modelling (Ritter and Munoz-Carpena,\
    \ 2013) to measure the goodness of fit between the test and predicted values:\n\
    \n```\n$nse = 1 - \\frac{\\sum_{i=1}^{N}(x_i - x_{P_i})^2}{\\sum_{i=1}^{N}(x_i\
    \ - \\bar{x})^2} = 1 - \\left(\\frac{RMSE}{\\sigma}\\right)^2 \\quad (6.26)$\n\
    ```\n\nwhere $i$ denotes the period in the test base, $x_i$ is the test value\
    \ in period, $x_{P_i}$ is the contemporaneous predicted value, $\bar{x}$ and $\\\
    sigma$ are the mean and standard deviation of the time series, and $RMSE$ is the\
    \ root-mean-square error of the predicted against the test values. If $nse = 1$,\
    \ the predicted and test values are a perfect match. If $nse = 0$, the time series\
    \ average predicts equally well. A value $nse > 0.65$ is often proposed as a model\
    \ quality threshold (Ritter and Munoz-Carpena, 2013). Nonlinear prediction works\
    \ very well for the Mayport data, since $nse = 0.998$."
