  md: '# 126 Entropy and Surrogate Testing


    that is, as the expected value of the surprisal. From an informational perspective,
    we can say that entropy is a measure of the expected amount of information.


    We now return to the definition of mutual information, given in Section 3.4.2,
    which we repeat here for the reader''s convenience:


    ```

    $I(X;Y) = \sum_{i} \sum_{j} p(x_i, y_j) \log_2 \frac{p(x_i, y_j)}{p(x_i)p(y_j)}$

    ```


    Introducing the entropy $H(X)$, this equation can be rewritten as


    ```

    $I(X;Y) = \sum_{i} \sum_{j} p(x_i, y_j) \log \frac{p(x_i, y_j)}{p(x_i)p(y_j)}$

    = \sum_{i} \sum_{j} p(x_i, y_j) \log p(x_i, y_j) + \sum_{i} \sum_{j} p(x_i, y_j)
    \log \frac{1}{p(x_i)}$

    $+ \sum_{i} \sum_{j} p(x_i, y_j) \log p(y_j) \log \frac{1}{p(y_j)}$

    = \sum_{i} \sum_{j} p(x_i, y_j) \log p(x_i, y_j) - \sum_{i} p(x_i) \log p(x_i)
    - \sum_{j} p(y_j) \log p(y_j)\n= -H(X,Y) + H(X) + H(Y)$

    ```


    Thus,


    ```

    $I(X;Y) = H(X) + H(Y) - H(X|Y)\n= H(X) - H(X|Y)\n= H(Y) - H(Y|X)$ (5.1)

    ```


    As we anticipated in Section 3.4.2, the mutual information is a measure of the
    extent to which knowledge about $X$ reduces uncertainty about $Y$. This implies
    that $I(X;Y) = 0$ if and only if $X$ and $Y$ are independent random variables
    or if one of the variables has zero entropy. This measure is symmetric, that is,
    $I(X;Y) = I(Y;X)$, and it is always non-negative.


    Historically, the idea that entropy, even in statistical mechanics, signifies
    something ''lack of knowledge'' has been put forward by a number of physicists
    and philosophers. In this view, entropy is a measure of incompleteness of human
    knowledge, so it becomes a subjective notion, an anthropomorphic concept. For
    a critical analysis of this viewpoint, Denbigh and Denbigh (1985)


    In the next section, the Shannon entropy is computed for the logistic map, and
    we see how it is related to the bifurcation diagram.'
