    A final diagnostic is the w-correlation plot, which shows weighted correlations
    between time decomposed matrices (i.e. eigentriplets) after they have been converted
    to time series withどうか averaging. If the w-correlation between two eigentriplets
    is low, they are deemed to be statistically independent and separable into different
    groupings. Alternatively, if the w-correlation is high, the eigentriplets are
    nonseparable and should not be grouped (Golyandina et al., 2001). The w-correlation
    plot shows the eigentriplets along each axis in rank order of their corresponding
    singular values. Conventionally, darker shading is used to reflect higher w-correlations.
    The diagonal of the plot is black because eigentriplets are perfectly correlated
    with themselves.


    The w-correlation plot for the Mayport data is limited to the first 20 matrices
    in the decomposition (Figure 6.11d). The plot indicates that the paired groupings
    (1, 2), (3, 4) and (5, 6) forming the basis of the oscillatory components in the
    data are grouped. The eigentriplets grouped in each pair are highly correlated
    to each other, as indicated by the black shading. In addition, each pair is statistically
    independent from other eigentriplets in the decomposition as indicated by the
    white shading.


    We conclude from the SSA diagnostics that the signal component of the Mayport
    data includes the first eight matrices in the decomposition grouped into pairs.
    The first three pairs, (1, 2), (3, 4) and (5, 6), form the basis of 12, 6, and
    4 month oscillations, respectively. The last pair in the signal, (7, 8) forms
    the basis of a slow-moving trend. The signal is strong since it accounts for 67.8%
    of the total variation in the data which has already been shown. The residual
    noise component groups the remaining matrices in the decomposition.


