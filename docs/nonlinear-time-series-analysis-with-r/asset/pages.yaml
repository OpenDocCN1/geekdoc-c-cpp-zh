    we have seen, the laws of mechanics describing the dynamics of the pendulum are
    symmetric, but when F is greater than a critical value, the states visited by
    the system are no longer symmetric in phase space.


    # 4.6 Summary


    The strangeness of strange attractors is exhibited in the dynamics of trajectories
    and in the fractal warp woven by the system in (reconstructed) phase space. One
    of the main features of deterministic chaotic systems is their well-known sensitive
    dependence on initial conditions. Recall that historically von Mises, as far back
    as 1939, recognized sensitivity to initial conditions as the primary source of
    randomness in stochastic systems.


    The maximal characteristic Lyapunov exponent (MCLE) is an important measure of
    stability and one of the indicators of the presence of chaos. There are two classes
    of estimators for MCLE. The first measures the exponential divergence of trajectories
    that are initially close through estimation of the Jacobian matrix along the trajectories.
    The second directly measures the evolution in the distance between initially close
    points. We have focused in this chapter on the performance of the estimator of
    the MCLE implemented in Chaos, which belongs to the second class. For this type
    of estimator, computation is easy compared with that of Jacobian estimators, and
    they can also detect whether a system is non-chaotic. The presence of a sharp
    linear region in the plot of the logarithm of the mean distance between points
    is a strong signal of chaos. For stochastic systems, the linear region tends to
    become flatter with increasing embedding dimension. However, there are situations
    (the presence of a dynamic noise component and/or series of moderate size) in
    which these estimators can provide a linear scaling region giving a positive estimate
    of the MCLE even for non-chaotic systems.


    The ''strangeness'' of an attractor''s geometry is measured by its fractal dimension.
    There are a number of definitions of fractal dimension, one of which is the correlation
    dimension D2. This is estimated via the so-called correlation integral, which
    is the proportion of all pairs of reconstruction vectors closer than a distance
    ε in some norm. In the Grassberger-Procaccia correlation integral, if a point
    is less than a threshold ε, it counts as 0. In the Gaussian correlation integral,
    two points that are small distances apart are weighted (as a Gaussian weighting)
    the estimate of the correlation dimension is given by the slope of the log-log
    plot of the correlation integral versus ε. This estimate is repeated for increasing
    embedding dimensions m, for chaotic systems, it initially increases with m, but
    eventually - at least asymptotically reaches a plateau. The value m* at which
    this plateau begins is the next integer above D2. For instance, if the estimated
    correlation dimension is 2.056, for the Lorenz attractor, the minimum number of
    variables required to describe the system is 3. Other techniques to estimate D2.
    In Chapter 7, the entire procedure to estimate D2 for the Lorenz attractor will
    be repeated, except that, finally, it will be derived through a maximum likelihood
    procedure (the Takens estimator).'
