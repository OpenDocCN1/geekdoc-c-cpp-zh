- img_proc: true
  md: '# The Features of Chaos


    $\log N(\epsilon) = d \log L + d \log \left(\frac{1}{\epsilon}\right)$


    Then


    $d = \frac{\log N(\epsilon)}{\log L + \log(1/\epsilon)}$


    If $\epsilon \to 0$, then $\log L$ becomes negligible compared with the other
    two terms. The *Hausdorff–Besicovitch (H–B) dimension* is defined as


    $D_0 = \lim_{\epsilon \to 0} \frac{\log N(\epsilon)}{\log(1/\epsilon)} \quad (4.3)$


    The subscript ''0'' is to distinguish this dimension from other dimensions $D_q,
    q = 0, 1, 2,...$. For $q=1$, $D_1$ is the information dimension.


    Actually, (4.3) is not a rigorous definition of the Hausdorff-dimension dimension
    (see e.g. Falconer (2014)), but this definition has become common in the dynamical
    systems literature. Sometimes, the H–B dimension is also called the *capacity
    dimension* or the *box-counting dimension*, although in fact latter dimensions
    are similar but not identical to the H–B dimension. It is obvious for a line segment
    that $D_0(L)=1$, for a surface that $D_0(L^2)=2$, and analogously for a cube and
    a hypercube. In all these cases, the H–B dimension coincides with the usual Euclidean
    dimension, but let us see what happens for a fractal, namely the Cantor set, or
    more poetically Cantor dust, here denoted by C.


    The rules of the game to construct the Cantor set are sketched in Figure 4.12.
    At the beginning, the unit interval, which we shall denote as $I_0$, is divided
    into three equal parts and the middle part is deleted; that is, the open interval
    $(\frac{1}{3},\frac{2}{3})$ is cancelled, so there remains the set of points $I_1
    = [0,\frac{1}{3}] \cup [\frac{2}{3},1]$. The same procedure is executed in successive
    iterations. Thus, $I_2$ consists of 4 segments, each of length $\frac{1}{9}$,
    and in general $I_n$ consists of $2^n$ segments, each of length $(\frac{1}{3})^n$.
    As the process proceeds, the number


    ![](img/efe2ac97775c9e906c844c2137d40d86_114_0.png)


    **Figure 4.12** Construction of the Cantor set. At the beginning, the middle third
    of the unit interval is removed. In each iteration, all of the remaining parts
    are divided into three and the middle parts are deleted. Here three iterations
    are shown.'
