    **Fig. 6** Time series exemplifying the range of possible explanations for volatile
    dynamics: (a) periodic cycling in the linear model; (b) aperiodic (nonrepeated)
    cycling created exogenously by randomly shocking the linear model; (c) aperiodic
    behaviour created by introducing nonstationarity to the linear model; (d) aperiodic
    cycling endogenous to nonlinear Lorenz equations.


    Nonlinear time series (NLTS) methods search for system dynamics likely to have
    generated observed irregularity in data. Like Sherlock Holmes, we progressively
    eliminate factors, and the surviving factor remains a possible reconstruction
    of the system dynamics. In this chapter, we get to know factors contributing to
    real-world dynamics, and investigate how we can preprocess series data to begin
    eliminating them as possibilities.


    We start by reviewing how the regular behaviour of linear systems of ordinary
    differential equations is limited to exponential and periodic dynamics. We next
    illustrate how linear ODE models can be induced to mimic irregular behaviour exogenously
    with the introduction of noise and nonstationarity, and how data can be preprocessed
    to reduce their impact. In particular, we use a signal processing technique, *singular
    spectrum analysis (SSA)*, that separates unstructured variation (*noise*) from
    structural variation (*signal*) in real-world data. We also present a test based
    on *nonlinear cross prediction* to detect nonstationarity in the signal separated
    from observed (Schreiber, 1997). Beyond removing noise from the data, SSA may
    also eliminate detected nonstationarity by further purging the signal of slow-moving
    trend components possibly causing the problem. Finally, we see how irregular dynamic
    behaviour can be generated deterministically with nonlinear ODE systems composed
    of at least three equations.


    After we have preprocess the data, we have ideally removed nonstationarity as
    a possible driver of observed irregular dynamics and mitigated the impact of noise'
