    # 9.6 Estimating System Coefficients: Regularized Regression Methods


    Estimating phenomenological models with real-world data may introduce statistical
    problems of multicollinearity and overfitting. Multicollinearity arises when independent
    variables (regressors) are highly correlated. Estimated coefficients become unreliable,
    because they can shift erratically from small to large values with small changes
    in the data. Identifying redundant regressors is difficult, resulting in overly
    complex phenomenological models with an excessive number of coefficients. These
    models may fit the data perfectly, even absurd and incorrect models do so by including
    enough coefficients relative to sampled data. However, they are overfitted in
    the sense that they account for random variance in sampled data and thus cannot
    be reliably used to extrapolate dynamic structure outside of the sample. Polynomial
    models are particularly susceptible to multicollinearity and overfitting.


    Regularized (or penalized) regression techniques often purposely introduce bias
    into estimation (meaning that the estimator''s expected value differs from the
    estimator''s true value) to reduce the variance of estimated coefficients and
    to select essential regressors. In particular, ridge regression reduces variability
    by shrinking the size of coefficients of highly correlated regressors towards
    each other by imposing an $\ell_2$ constraint that restricts the sum of squares
    of estimated coefficients in OLS estimation. Alternatively, the least absolute
    shrinkage and selection operator (LASSO) reduces overfitting by simultaneously
    estimating coefficients and selecting essential regressors. Whose estimated coefficients
    are below given thresholds are driven from the model, which tends to select one
    of the highly correlated variables while discarding the others. LASSO does this
    by imposing an $\ell_1$ constraint restricting the sum of the absolute value of
    regression coefficients in OLS estimation (Tibirani, 1996). Brunton et al. (2016)
    have emphasized the value of regularized regression techniques , such as LASSO,
    in phenomenological modelling of real-world nonlinear dynamical systems that may
    be governed by only a few relevant terms. These techniques are geared to generate
    parsimonious models that balance accuracy with model complexity to avoid overfitting.'
