    $\int_{-\infty}^{+\infty} h(x)\delta(x-a)dx = h(a)$


    We can think of $\delta(x)$ as the limit of a sequence of functions $\delta(x)$
    that are different from zero only inside an interval around $x=0$, with their
    peaks becoming more and more spike with increasing $n$ but with their integrals
    remaining equal to 1.

    One approach to deriving $\delta(x-x_0)$ is sketched in Figure A.2. Consider the
    function


    ![](img/efe2ac97775c9e906c844c2137d40d86_335_0.png)


    has the value $1/(2a)$ (where $a$ is positive but otherwise arbitrary) in the
    interval $[x-a, x+a]$ and is 0 elsewhere, as depicted by the rectangle at the
    top (note that the figure is not to scale), whose area is equal to 1. Let us now
    imagine narrowing the base of this rectangle, i.e. the interval where the function
    is nonzero, but keeping the area equal to 1. As $a \to 0$, we arrive at a ''rectangle''
    with base=0, height $=\infty$ and area=1, which is precisely $\delta(x-x_0)$.


    The Dirac delta function has the following properties:


