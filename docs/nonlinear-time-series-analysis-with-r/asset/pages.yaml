  md: "# Singular Spectrum Analysis 163\n\n# Table 6.2 Toeplitz-SSA decomposition\
    \ of time series.\n\n| x(t) | x_{12} | x_3 |\n|---|---|---|\n| 1 | 1.72 | -0.72\
    \ |\n| 3 | 2.60 | 0.40 |\n| 0 | 0.10 | -0.10 |\n| -3 | -2.66 | -0.34 |\n| -2 |\
    \ -2.25 | 0.25 |\n| -1 | -0.82 | -0.18 |\n\nSSA requires specification of only\
    \ the SSA window parameter to run the matrix decomposition. In SVD-SSA, the window\
    \ length $L$ sets the number of rows in the trajectory matrix. In Toeplitz-SSA,\
    \ the window length $K$ sets the number of columns in the trajectory matrix. Since\
    \ there are no precise rules for setting the window length, guidance comes from\
    \ rules of thumb found in the literature. Ghil et al. (2001) present the choice\
    \ as a trade-off between competing objectives. On the hand, the window should\
    \ be sufficiently wide to capture the range of dynamic behaviour exhibited by\
    \ the time series. Golyandina et al. (2001) judge that matrix decomposition is\
    \ most precise when the window is set to approximately half the length of the\
    \ time series, $N/2$. On the other hand, the window should be sufficiently narrow\
    \ to generate statistical confidence in the results by allowing for as many repetitions\
    \ of the features of interest as possible, i.e as large a ratio of $N/K$ as possible\
    \ (Ghil et al., 2001). Hassani (2007) suggests that window length should be proportional\
    \ to a periodic component in the data, but should not exceed $N/2$. For example,\
    \ if data were characterized by a two-year cycle, and the time series length were\
    \ $N = 1000$, the window could be set at integer multiples (i.e. repetitions)\
    \ of 24 months not exceeding $N/2 = 500$, as $L = 24$ months $\times 20$ repetitions\
    \ $= 480$.\n\nWe identify components in time series data with the *Fourier spectrum*\
    \ (Kaplan and Glass, 1995). Initially, the *Fourier transform* converts the time\
    \ series from the *time domain* to the *frequency domain* by decomposing it into\
    \ a sum of sinusoidal functions of different frequencies. The Fourier spectrum\
    \ presents the frequency content of the time series in a graph plotting the importance\
    \ (i.e power*) of particular frequencies in the data over the spectrum of frequencies.\
    \ The power that a particular frequency contributes to the time series is identified\
    \ by the height of a spike above that frequency. Time series with strong periodic\
    \ components show sharp peaks at constituent frequencies forming the harmonics\
    \ of the data. A continuous *floor* appearing in the spectrum may be due to noise\
    \ or deterministic nonlinear dynamics resembling noise. We cannot distinguish\
    \ between the two without additional information (Kantz and Schreiber, 1997).\n\
    \nCode 6 formulates a user-defined function, `spectral_udf`, to run spectral analysis\
    \ with the R routine **spectrum**. We initially run a simple illustration using\
    \ a single sine wave"
