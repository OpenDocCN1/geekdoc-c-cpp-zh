  md: '# Correlation Dimension 103


    The topological dimension describes how points within an object are connected
    to each other. It tells us that an object is an edge, a surface, or a solid. Its
    value is always an *integer* (for example: 1 or 2).


    A line has topological dimension 1, a surface topological dimension 2 and a solid
    body topological dimension 3. Thus, in short, the topological dimension coincides
    with the Euclidean dimension for lines, planes and volumes.


    $N(\epsilon) = L\frac{1}{\epsilon}$


    An analogous reasoning holds when the covering object is a square of side $L$,
    as shown in Figure 4.11b, in which the square of side $L$ is covered by 4 squares
    each of side $L/2$ and by 16 squares each of side $L/4$.


    ![](img/efe2ac97775c9e906c844c2137d40d86_113_0.png)


    **Fig. 4.11** Covering method for evaluating the Hausdorff-Besicovitch dimension.


    In general, a square of side $L$ can be covered by


    $N(\epsilon) = L^2\frac{1}{\epsilon^2}$


    squares of side $\epsilon$. In $d$ dimensions, we have


    $N(\epsilon) = L^d\frac{1}{\epsilon^d}$


    where $\epsilon$ is the side of the $d$-dimensional hypercube. Taking logarithms,'
