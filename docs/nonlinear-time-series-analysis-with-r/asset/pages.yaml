  md: "# The Nonlinear Logistic Map\n\n$N_{t+1} = r(1 - N_t/K)N_t$\n\nwhich is parabolic\
    \ in $N_t$. This specification can be simplified by transforming it to a scaled\
    \ variable $x_t = N_t/K$, which measures the population as a fraction of carrying\
    \ capacity. The new variable $x_t$ is scaled between zero and one. It is zero\
    \ when no population is present ($N_t = 0$) and one when the population reaches\
    \ carrying capacity ($N_t = K$). Rewriting the scaled variable as $N_t = Kxt$\
    \ and substituting it into eqn (2.6) gives the Verhulst (1838) logistic growth\
    \ model:\n\n$x_{t+1} = rx_t(1 - x_t)$\n\nMathematically speaking, this is the\
    \ nonlinear logistic map. A unimodal map in $[0, 1]$ is unimodal in the interval\
    \ $[a, b]$ if it possesses a unique maximum value in $[a, b]$ and is a strictly\
    \ increasing function before the maximum and a strictly decreasing function after\
    \ the maximum. It was in a study of a nonlinear logistic map similar to the above\
    \ that the term 'chaotic' was introduced for the first time in a mathematical\
    \ context by Li and Yorke (1975, p. 986): 'In this we analyze a situation in which\
    \ the sequence $F^n(x)$ is non-periodic and might be called 'chaotic.' (The sequence\
    \ of iterates $F^n(x)$ in our notation will be see below.) The map has fixed points\
    \ $x^*$\n\n$x_t = rx_t(1 - x_t) \\Rightarrow x_t(r - rx_t) = 0$\n\n$x^* = 0$ and\
    \ $x^* = \\frac{r-1}{r}$\n\nWhen $x^* = 0$, there are no individuals in the population.\
    \ If $x_t = (r-1)/r$, the population has reached an equilibrium state and does\
    \ not increase or decrease. Clearly, the population cannot be in both states.\
    \ The value $x^*$ in the equilibrium state does not depend on the initial conditions,\
    \ but only on the value of $r$. In general, there is more than one fixed point\
    \ (and they are not cyclic), the system will reach only one of those fixed points,\
    \ depending on the initial conditions. Following the logic of Codes 2.1 and 2.2,\
    \ Code 2.3 portrays the time series and cobweb plots for selected values of $r$:\n\
    \n```\n#Code 2.3 Nonlinear logistic map: time series and cobweb plots (logistic).\n\
    f.function(x,r){\n  r*=x*(1-x)\n}\n\n##### function to draw the time plot ####\n\
