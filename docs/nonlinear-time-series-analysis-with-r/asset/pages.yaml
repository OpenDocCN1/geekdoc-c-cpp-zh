  md: '# Chaotic Behavior 33


    A first characterization of chaos is in terms of its dynamics, which describes
    how a system in a chaotic regime changes over time. Chaotic dynamics is aperiodic;
    that is, the system never returns to the same state. A population from generation
    to generation never has the same number of individuals. It might happen in computer
    simulations one finds iterates with the same values, but this is due to the rounding
    errors of computers. We have seen that with respect to fixed points or cycles,
    the initial conditions are irrelevant, since trajectories starting from different
    points converge on the same attractor. On the other hand, in a chaotic regime,
    differences in initial conditions are exponentially amplified.


    A further characterization of chaotic dynamics is that it is limited. Limited
    dynamics means that the variables defining the system states vary in finite intervals
    - in the case of the logistic map, they vary in the interval [0,1]. This is in
    contrast to linear equations, where, for example we have seen that in eqn (2.1)
    the variable Nx go to infinity if r >1. Thus, chaotic dynamics is aperiodic, limited
    and also deterministic. In fact, there are no random variables, no stochastic
    components, in the description of chaotic systems. Nevertheless, chaotic system
    is unpredictable, because of a third characterization of their dynamics, namely
    the so-called sensitive dependence on initial conditions.


    Unlike fixed points and cycles (where initial conditions are irrelevant), differences
    in initial conditions in a chaotic regime are exponentially amplified. This sensitivity
    is demonstrated in Figure 2.17. We plot two trajectories beginning from slightly
    different initial points. One trajectory (plotted with circles) starts from x0
    = 0.002. The second (plotted with crosses) starts from x''0 =0.00202. The two
    trajectories remain close for about six or seven steps, then begin to diverge
    along completely different paths. For example after 19 steps x0 = 0.0468, while
    x''0=0.9633. The sensi-


    ![](img/efe2ac97775c9e906c844c2137d40d86_43_0.png)


    **Fig. 2.17** Time series plot of two trajectories of the logistic map with r
    = 4 and initial conditions x0 = 0.002 (circles) and x''0 = 0.00202 (crosses)'
