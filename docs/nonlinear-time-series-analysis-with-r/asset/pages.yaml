    The time-dependent parameter a(t) is designed to drag the system through abrupt
    changes (i.e. bifurcations) in system dynamics through time. During the initial
    interval t=(0,5), a is negative, and the system dynamics are characterized by
    a stable focus (Figure 6.14a). At t = 6, a = 0, and the system shifts abruptly
    for an instant to a centre point dynamics (Figure 6.14b). During the remaining
    interval t=(7,12), a is positive, and the system dynamics converge to an unstable
    focus (Figure 6.14c). A trajectory over the entire time horizon mimics irregular
    nonlinear dynamics by seamlessly blending three linear dynamical structures (Figure
    6.14d). Initially, the trajectory approaches equilibrium at (0,0), orbits around
    it, and escapes in explosive oscillations.


    # 6.6 Testing for Nonstationarity in Time Series Data


    There are multiple tests for nonstationarity in time series data that depend on
    how one changes in dynamical behaviour (Schreiber, 1997). Linear time series analysis
    requires only weak stationarity in second-order moments, such as the mean and
    variance, do not fluctuate over time. Testing for weak stationarity generally
    divides


    ![](img/efe2ac97775c9e906c844c2137d40d86_185_0.png)'
