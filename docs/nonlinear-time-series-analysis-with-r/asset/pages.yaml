    Umberto Eco, The Name of the Rose


    # 3.1 Introduction


    We introduce some basic concepts concerning the study of both discrete and continuous
    dynamical systems. The first concept is that of *phase space* or ''state space''.
    This is an abstract mathematical construction with important applications in statistical
    mechanics, where it allows the time evolution of a dynamical system to be represented
    in geometric form. Phase space has as many dimensions as the number of variables
    to define the instantaneous state of the system. For instance, the state of a
    material point moving on a straight line is defined by its position and velocity
    at each instant, the phase space for this system is a plane in which one axis
    is the position and the other the velocity. In this case, the phase space is also
    called the ''phase plane''. For a planet orbiting the Sun, or a satellite on the
    Earth, the phase space has coordinates: $(x, y, z)$ defining the instantaneous
    position and $(v_x, v_y, v_z)$ defining the components of the instantaneous velocity
    vector $v$. More generally, for a system consisting of $N$ particles the phase
    space is a $6N$-dimensional space, where axes are $3N$ generalized coordinates
    and $3N$ generalized momenta, so we may have linear coordinates, or angular velocities
    and other variables. In an ecological model, the axes of the phase space may be,
    for instance, the number of individuals of a certain species and their rate of
    growth.


    In short, every single point of phase space represents the entire system. Corresponding
    to the motion of the system in real space, there is a trajectory in phase space
    traced out by the representing state of the system (the *representative point*).
    For a dynamical system, the trajectory may be a closed curve, as we will see,
    but intersections are not possible. If that were the case, then the state represented
    by the intersection point would have more than one successive point, and hence
    the temporal evolution of the system would not be unique. When we speak about
    stable or unstable fixed points, convergent or divergent trajectories, basin of
    attraction, fractal dimension, attractors (strange or not), we always refer to
    this abstract space.'
