    # 3.4 Phase Space Reconstruction with R packages


    The R package tseriesChaos offers a family of codes for the analysis of nonlinear
    time series. The author and maintainer is Di Narzo (2015). The work – as the author
    himself writes – largely inspired by the TISEAN project, by Hegger et al. (1999),
