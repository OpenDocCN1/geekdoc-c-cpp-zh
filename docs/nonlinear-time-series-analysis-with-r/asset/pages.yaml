  md: "# Comments 335\n\nmean ξ and standard deviation $\\sigma_i$, B values in order\
    \ to construct B 'measured' values of each quantity, after which we continue,\
    \ drawing the bootstrap samples as we have seen before.\n\nThere are situations,\
    \ for instance series analysis, where the observations can no longer be considered\
    \ the realization of mutually independent random variables with the same distribution\
    \ function $F$. In these cases, (nonparametric or parametric) is not applicable\
    \ in the form that we have outlined, because the dependence structure of the independent\
    \ and identically distributed (i.i.d) variables has to be replaced by techniques\
    \ on block resampling. This improvement amounts to 'robustifying' the original\
    \ bootstrap against serial dependence. Various variants of block-resampling bootstrap\
    \ have been proposed. We outline the first $l$ observations and consider all contiguous\
    \ blocks of moving bootstrap (MBB)\n\nWe define blocks, we draw all contiguous\
    \ blocks of length $l$. Since the blocks are as overlapping, we obtain $m$ possible\
    \ blocks, with $m = n - l + 1$. The original data can be wrapped in a circle before\
    \ blocking them. From these $m$ blocks, we draw at random with replacement $k$\
    \ blocks, with $k \times l = n$. In analogy with the i.i.d. scheme, a suitable\
    \ number $B$ of MBB replications is performed, each of which the statistic of\
    \ interest is computed and the MBB estimate of the standard error is divided.\n\
    \nThe underlying idea is that if the block length $l$ is large, observations belonging\
    \ to different blocks are nearly independent of one another, so the blocks are\
    \ actually i.i.d. random variables under the MBB scheme. At the same time, inside\
    \ each block, the correlation is retained. For an application of the MBB to statistical\
    \ mechanics, for time series see Mignani and Rosa (2001).\n\nIn the package boot,\
    \ the functionboot allows one to deal with resampling methods. For reviews of\
    \ such methods, see the article by Politis (2003) and the book by Lahiri (2003).\
    \ It must be noted, however, that, even if this is not mentioned in the statistical\
    \ literature, the bootstrap for dependent data appeared in a paper on high-energy\
    \ physics by Gottlieb et al. (1986). These authors, referring explicitly to Efron\
    \ (1979), explained the advantages of bootstrapping when handling dependent data.\n\
    \nThe name 'bootstrap' comes from the saying 'to pull oneself by one's bootstraps',\
    \ as Baron von Münhausen did in the book 1785 by Rudolf Ernst Raspe. This name\
    \ refers closely to the fact that in the original observed sample, after suitable\
    \ handling, all the properties of the whole population are readable. 'It is if\
    \ statisticians had discovered the statistical analogue of the 'hologram' (Diaconis\
    \ and Efron, 1983), referring to the fact that each piece of the surface of the\
    \ hologram retains the entire original scene, even though the pieces are broken\
    \ off. But, as these authors:\n\nThere are a few samples for which the bootstrap\
    \ does not work, and one cannot know in advance in which they are. The limitation\
    \ is not so much a failure of a bootstrap procedure as it is a restatement of\
    \ the conditions of uncertainty under which all statistical analyses proceed."
