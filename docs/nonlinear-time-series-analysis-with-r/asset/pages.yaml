    high. A further consideration with regard to reliable estimation of the correlation
    dimension is the length of the embedded time series. Ding et al. (1993) showed
    that the estimated correlation dimension for shorter series falls systematically
    below for longer series. The estimation of invariants is a sensitive matter— indeed,
    it has been said that ‘it] is often as much an art as it is a science’ (Diks,
    1999).


    To conclude this discussion of the estimation of invariants, for instance, suppose
    that we have measured a time series and, in the reconstructed space, estimated
    the MCLE as λ=0.072. We believe that we have a chaotic system? This depends on
    how precise our estimate is. If the standard error was, say, 0.8, it would actually
    be difficult to be confident about the chaotic nature of the system – hence the
    need to assign measures of precision to estimates. In an imaginary world of Oz,
    if we measured a series with one million observations, then we could divide this
    series into, 100 subsets, each 10000 observations long, and estimate the MCLE
    and correlation dimension in each. From them, it should be straightforward to
    divide the estimates of the original series and the confidence intervals. In our
    actual world, similar can be done, even with only a single available series of
    reasonable length. Suppose that we have measured a series of length, say, 10000
    observations. Then, by means of so-called bootstrap methods (see Appendix C),
    we can generate 100 new series of the same process, since these are in all respects
    like those of techniques, we can assign the standard deviation and confidence
    intervals to estimation of the MCLE and of the correlation dimension; the reader
    is referred to Giannini et al. (2007b) and Borovkova et al. (2011), respectively.
    Incidentally, the estimate λ=0.072 refers to the Rössler attractor, introduced
    by Rössler (1976) in his studies on chemical kinetics, and its standard error
