    ![](img/efe2ac97775c9e906c844c2137d40d86_186_0.png)


    **Fig. 6.14** Numerically generated phase space dynamics for a nonstationary linear
    model. We make the parameter a in the linear system (6.1) time-dependent, and
    the plots show how the dynamics undergoes three abrupt changes, from a stable
    focus (a), to a centre point (b) and finally to an unstable focus (c). A trajectory
    over the entire time horizon blends the three linear dynamical structures (d).
    The trajectory mimics irregular nonlinear dynamics by initially approaching equilibrium,
    orbiting around it, and then escaping from it in explosive oscillations.


    the time series for several segments and component mean and variance in each segment.
    The time series is considered stationary if the computed moments do not vary significantly
    across segments.


    Weak stationarity does not suffice in nonlinear time series analysis. Nor can
    we simply replace the mean and variance with nonlinear measures of complexity
    (e.g. the correlation dimension and Lyapunov exponents) in stationarity tests.
    This would be unreliable, because an attractor can change shape these measures
    largely unchanged (Schreiber, 1997). Consequently, Schreiber (1997) proposed a
    nonlinear cross-prediction stationarity test for when reconstructing nonlinear
    system dynamics from time series data (see also (Kantz and Schreiber, 1997; Heatconte
    and Elliott, 2011)). The tests look for nonlinear behaviour across the segments
    themselves rather than similar statistical parameters computed from each segment.
    In particular, it divides the time series into non-overlapping segments, and applies
    nonlinear prediction methods to measure the skill with which each segment cross-predicts
    the others. The time series is stationary if each segment cross-predicts the others
    with equal skill. In other words, cross-predictive skill does not decrease significantly
    when segments are further apart in time.


    In this section, we build R code to run the nonlinear cross-prediction stationarity
    test. The test is based on nonlinear prediction methods that require time-delay
    embed'
