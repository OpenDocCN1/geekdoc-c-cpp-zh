    space reconstruction. Taken (1981) derived sufficient conditions guaranteeing
    that a shadow phase preserves essential dynamic properties of the original phase
    space.

    In this clear-cut example, the dynamics reconstructed from the lynx population
    are already obvious in the cycling time series plots. The full potential of phase
    space reconstruction is appreciated when reconstructing dynamics in volatile and
    random-appearing time series. Consider an example by Kaplan and Gauss (1995).
    There are two time series: $x_t$ (plotted in Figure 1.2a) and $y_t$ (in Figure
    1.2d). One of these time series is randomly generated, while the other is the
    solution to a deterministic difference equation. We apply three methods to distinguish
    between the two: causal observation, autocorrelation functions for linear correlations
    in the data and NLTS time-delay embedding plots. First, neither exhibits obvious
    patterns in distinguishing between random and deterministic dynamics – any dynamic
    structure is well concealed. The autocorrelation functions do not exhibit patterns
    indicative of corresponding patterns in either time series (Figure 1.2b, e). Time-delay
    embedding plots successfully distinguish between the two. The time-delay plot
    using $x_t$ is randomly distributed on the plane, correctly detecting that this
    series was randomly generated (Figure 1.2c). In contrast, the time-delay plot
    using $y_t$ shows structure: a parabolic serialization missed by the autocorrelation
    functions (Figure 1.2f). Indeed, $y_t$ was generated by the deterministic parabolic
    logistic map which we investigate in Chapter 2:


    ```

    $x_{t+1}=4x_t(1-x_t), \quad x_t \in [0, 1]$

    ```


    In Part 2 (Chapters 6–11), we focus on the application of NLTS to reconstruct-world
    dynamic structure from observed time series data. We propose a strategy for implementing
    NLTS that is modified from previous versions in Huffaker (2015), Huffaker et al.
    (2016b) and (Huffaker et al., 2016a) (Figure 1.3). We emphasize from the outset
    that NLTS is capable of reconstructing linear well as nonlinear deterministic
    system dynamics, and of diagnosing the presence of linear stochastic dynamics.
    Our objective is not limited to finding evidence pointing to nonlinear deterministic
    structure, but extends to diagnosing whether the structure most closely corresponds
    to reality whether that be linear, nonlinear, deterministic or stochastic.'
