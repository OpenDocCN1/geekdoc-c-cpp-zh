    and not because of the geometry of the phase space. To avoid temporal nears, the
    distance between pairs of points must be greater than some time $w$ (tw in the
    code `false.nearest`), called the *Theiler window* (Theiler, 1986). Provenziale
    *et al.* (1992) introduced the *space-time separation* method to estimate the
    Theiler window. The number of pairs is computed as a function of the spatial separation
    and the separation in time. The result is displayed as contours of constant probability
    for the distribution of the spatial separation as a function of the time separation.
    In the package `nonlinearSeries`, the function `spaceTimePlot()` yields the space-time
    separation plot, as shown in Figure 3.15, where the contours are incremental values
    of 10% from the line below. The figure is obtained by adding the following lines
    to the code `loren.attractor.R`, after removing the transient:


    ```

    require nonlinearSeries

    spaceTimePlot(time,series=x,embedding.dim=3,time.lag=10,

    time.step=1,max.radius=400,number.time.steps=400,numberPercentages=10,plot=TRUE,

    main="",lab="Separation in time","Separation in space")

    ```


    where $max.radius$ is the radius of the sphere in which pairs of points are looked
    for. If this radius is not written, the code estimates `time.step` is the number
    of steps between two computations of the space-time plot, `number.time.steps`
    is the number of steps of the computed space-time plot and `numberPercentages`
    is the number of contour lines to be computed. The contour lines of constant probability
    at 10%, 20%..., 100% are shown in colour by `spaceTimePlot()`.


    A similar result obtained with TISEAN software is reported in Heathcote and Elliott
    (2011). As before, in the following, we set $w=100$, after this value almost-regular
    oscillations begin to appear. However, with $w=50$ or $200$, results are not significantly
