  md: '# 62 Phase Space Reconstruction


    Our aim is to teach the use of tseriesChaos and especially to highlight the underlying
    principles. The examples presented here is what is probably the most famous strange
    attractor, the Lorenz attractor. In his seminal paper Deterministic nonperiodic
    flow, Lorenz (1963) found that in dissipative hydrodynamic flow, nonperiodic solutions
    were unstable and highly dependent on initial conditions. He derived a set of
    equations that, in phase space, lead to the famous Lorenz attractor (Figure 2
    of his paper), which described the evolution of the convective process. The two
    portions of the trajectories in the attractor represented the states of steady
    connection.


    Lorenz derived these equations as a simplified model of atmospheric convection
    to study the unpredictable behaviour of weather. The Lorenz equations (Lorenz,
    1963) are often presented as the quintessential example of a nonlinear system:


    ```

    dx/dt = σ(y-x)

    dy/dt = x(ρ-z)

    dz/dt = xy-βz

    ```


    The variables x, y and z describe the up and down motion of a fluid in convective
    flow. Lorenz discovered that the parameter values σ = 10, β = 8/3 and ρ = 28,
    generate surprisingly complex periodic behaviour for a parsimonious deterministic
    model. With these parameters, the system displays chaotic behaviour. To solve
    the system (3.4), we can proceed as we did for the ideal pendulum, namely with
    Code 3.3 lorenz_attractor.R.


    ```

    # Code 3.3 Lorenz attractor (lorenz_attractor.R)

    params<- c(10,8/3,28) # parameters: sigma, beta, rho

    tinit<- 0

    tfin<- 100

    step<- 0.01

    time<-seq(tinit,tfin,by=step)

    func<- function(t,integ,parms){ # the system of equations

    x<-integer[1]

    y<-integer[2]

    z<-integer[3]

    sigma<-params[1]

    beta<-params[2]

    rho<-parms[3]

    dx<-sigma(y-x) # that is dx/dt = sigma(y-x)

    dy<-x(rho-z)-y # that is dy/dt = x(rho-z)-y

    dz<-xy-beta*z # that is dz/dt = xy-beta z

    list(c(dx,dy,dz))


    } # end of endunct

    ```


    ```

    require(dSolve)

    cinit<-c(1,1,1)

    xyz<-lsoda(cinit,times,parms)

    # # # comment if you do not wish the xyz values printed

    par(mfrow=c(3,1))

    par(mar= c(6.3, 4.8, 1., 3))

    par(cex.lab=2,cex.axis=1.6,lwd=1,lty=1)

    ```'
