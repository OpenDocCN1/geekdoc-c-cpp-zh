    Step 1d decomposes the trajectory matrix $X$ into a sum of new $L \times K$ matrices:
    $X = X_1 + X_2 + \dots + X_K$. Each new matrix in this decomposition is computed
    as the matrix product of the three components from the eigensystem of $S$ (an
    eigentriplet):


    > $X_i = \sqrt{\lambda_i} * V_i * EV_i^T$  (6.10)


    (Golyandina et al., 2001). For our example, the $K=3$ new matrices $X_i$ are


    | 1.65 | 2.42 | 0.59 | -0.09 | 0.04 | 0.01 | -0.56 | 0.55 | -0.69 |

    | 0.59 | 0.86 | 0.21 | 2.61 | -1.06 | -2.96 | -0.20 | 0.20 | -0.25 |

    | -1.56 | -2.29 | -0.56 | 1.42 | -0.58 | -1.61 | 0.14 | -0.13 | 0.17 |

    | -1.92 | -2.81 | -0.69 | -0.43 | 0.17 | 0.49 | -0.65 | 0.64 | -0.80 |

    | $X_1$ | | $X_2$ | | $X_3$ | | (6.11)


    Step 1e computes the strength of the individual contribution of one the new matrices
    $X_i$ relative to the overall decomposition of $X$. This contribution is measured
    in terms of the *Frobenius* norm of $X$:


    > $||X||_F^2 = \sum_{i=1}^K \lambda_i$ or $||X_i||_F^2 = \sum \lambda_i$  (6.12)


    That is, the square of the Frobenius norm is the sum of the eigenvalues in the
    decomposition. Then, the *characteristic contribution* of $X_i$ is measured as


    > $\frac{\lambda_i}{||X||_F^2}$ or $\frac{\lambda_i}{\sum_{i=1}^K \lambda_i}$  (6.13)'
