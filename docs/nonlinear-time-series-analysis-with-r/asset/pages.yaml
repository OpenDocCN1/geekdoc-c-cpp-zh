  md: '# Summary 295


    R package tseriesChaos (to compute delayed-coordinate vectors) (Di Narzo, 2015).

    Second, Code 9.8 resets parameter values so that the phase space attractor constructed
    from the phenomenological model corresponds to that reconstructed from the observed
    solution $x_t$ and its two delay-coordinate copies. In particular, we use the
    polynomial range parameter at $M_p=3$, and obtain numerical stability of the solution
    using estimated coefficients from a mixed ridge and weighted LASSO regression
    ($\alpha=0.5$), and fixing the integration step in deSolve at $\delta=0.01$. We
    model the fit with the LASSO parameter vectors associated with $\lambda.min; xp.min,
    yp.min$ and $zp.min$.


    Figure 9.2 shows a clear correspondence between the attractor reconstructed from
    the observed solution (a) and that produced from the phenomenological model (b).
    Table 9.7 shows that, compared with OLS, the mixed ridge and LASSO regressions
    succeed in identifying parsimonious models requiring only a small fraction of
    the range of monomial terms. Table 9.8 shows that the estimated model provides
    an excellent fit to the data ($x_t$ and its two delay-coordinate copies).


    ![](img/efe2ac97775c9e906c844c2137d40d86_305_0.png)


    **Fig. 9.2** Lorenz model extracted from a single solution: (a) attractor reconstructed
    from the observed solution $f(t)$ and delay-coordinate copies; (b) attractor reconstructed
    from the phenomenological model.


    # 9.11 Summary


    Phenomenological modelling opens the door to the possibility that one or more
    observed variables can be distilled into a system of ODEs that analytically reproduces
    empirically reconstructed dynamics. Phenomenological models provide several benefits:


    +   - They allow the data ‘to speak’ regarding their underlying structure rather
    than imposing this structure a priori with incompletely tested assumptions. In
    particular, they can provide a parsimonious representation of complex behavioural
    patterns composed of aperiodic (nonrepeating) oscillations. Armed with this information,
    we can characterize dynamic behaviour outside the range of observed data.'
