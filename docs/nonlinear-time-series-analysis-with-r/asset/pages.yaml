  md: "# Bootstrap Standard Error 331\n\nbootstrap samples is given by the number\
    \ of $k$-combinations with repetition:\n\n```\n$C_{n,R}^k = \\left(\\\binom{n+k-1}{k}\\\
    right)$\n```\n\nIn our case $k = n$, and then putting $C_{n,n}^R = q$, the number\
    \ of distinct bootstrap\nsamples is\n\n```\n$q = \\binom{2n-1}{n} = \\frac{(2n-1)!}{n!(n-1)!}$\n\
    ```\n\nIf $n = 20$, as in our example, then $q$ is the rather large number 68\
    \ 992 264 410. Therefore, the computation of $se_{\\hat{\\theta\\hat{\theta}^*)$\
    \ turns out to be impracticable, so it is rightly called the ideal bootstrap estimate.\
    \ One way to overcome this difficulty is to generate by Monte Carlo methods only\
    \ a number $B$ of bootstrap samples, obtaining the so-called Monte Carlo bootstrap\
    \ estimate $se_B(\\hat{\\theta}^*\\hat{)$, or, more simply, $se_B$. The bootstrap\
    \ algorithm can be outlined as follows:\n\n+   1. Let $x = (x_1, x_2, \\dots,\
    \ x_n)$ be the observed sample.\n\n+   2. Through the empirical distribution function\
    \ $\\hat{F}$, which puts $1/n$ on each observation $x_i$, generate $B$ bootstrap\
    \ samples $x_b^*$, $b=1, \\dots, B$, with dimension $n$ and independent of each\
    \ other:\n\n```\n$x^* = (x_1^*, x_2^*, \\dots, x_B^*)$\n```\n\n+   3. For each\
    \ bootstrap sample, calculate the corresponding bootstrap replication, obtaining\
    \ $B$ replications:\n\n```\n$\\hat{\\theta}_1^* = s(x_1^*), \\hat{\\theta}_2^*\
    \ = s(x_2^*), \\dots, \\hat{\\theta}_B^* = s(x_B^*)$\n```\n\nEstimate $se_{\\\
    hat{\\theta}\\hat{\theta}^*}$ with the estimator standard deviation of the $B$\
    \ replications $(\\hat{\\theta}_1^*, \\hat{\\theta}_2^*, \\dots, \\hat{\\theta}_B^*)$:\n\
    \n```\n$se_{\\hat{\\theta}\\hat{\theta}^*}} = \\left(\\frac{\\sum_{b=1}^B (\\\
    hat{\\theta}_b^* - \\hat{\\theta}^*\\hat{)}^{*2}{B-1}\\right)^{1/2}$ (B.10)\n\
    ```\n\nwhere\n\n```\n$\\hat{\\theta}^* = \\frac{1}{B}\\sum_{b=1}^B \\hat{\\theta}_b^*$\n\
    ```\n\nThere are no fixed rules for choosing the value of $B$, but the choice\
    \ depends on the problem under consideration. Sensible values of $B$ are in the\
    \ range 100–1000. The whole logical path can be briefly sketched out as follows:\n\
    \n| $se_F(\\hat{\\theta})$ | estimated by | $se_F(\\hat{\\theta}^*)$ | estimated\
    \ by | $se_B(\\hat{\\theta}^*)$ |\n|---|---|---|---|---|\n| of the statistic $\\\
    hat{\\theta}$ | | dev. of all the replicas. | | dev. of $B$ replicas."
