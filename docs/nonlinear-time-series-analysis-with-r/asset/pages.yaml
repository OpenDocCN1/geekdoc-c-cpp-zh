    \ -a_{12} \\ a_{11} - \\alpha + \beta i \\\\end{bmatrix} = \\begin{bmatrix} 0\
    \ \\ \beta \\\\end{bmatrix} + \\dots i$ (C.12)$\n```\n\nExample: *Real eigenvalues.*\
    \ We compute the eigenvalues and eigenvectors associated with\n\n```\n$A = \\\
