    We summarize the main results on the properties of the invariant density:


    +   * The invariant density describes the stationary behaviour of an ensemble
    of trajectories with different initial conditions. It can be derived both the
    temporal evolution of a single trajectory and from an ensemble of trajectories
    considered fixed instants in time.

    * The invariant density does not depend on the initial density.

    * The invariant density is different for different maps.

    * The speed of convergence to the invariant density depends on the map.

    * The speed of convergence to the invariant density depends on the initial conditions.

    * For the same map, both the invariant density and the speed of convergence are
    different for different dynamical regimes.


    The most important aspect of what we have discussed can be summarized as follows.
    In a chaotic system, we cannot make predictions about a single trajectory if we
    address it from an exclusively deterministic point of view. However, if we use
    a statistical approach, we can distinguish regions that are more or less probable,
    so we should observe an ensemble of trajectories with different initial conditions,
    even though we know only one trajectory.


    # 2.9 Summary


    In this chapter, we have seen how highly erratic dynamic behaviour can arise from
    a nonlinear logistic map and how this apparently random behaviour is governed
    by a surprising order. With this lesson, we should not be overly surprised that
    highly erratic and random-appearing observed data might also be generated by parsimious
    deterministic dynamic systems. As a minimum, we contend that researchers should
    apply NLTS to test for this possibility.


    We have also introduced tools to analyse the dynamic behaviour that forms the
    foundation for NLTS. In particular, we have stressed the quite unexpected capability'
