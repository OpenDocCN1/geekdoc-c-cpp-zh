  md: '# Nonlinear Dynamics and a Strategy for Applying NLTS


    In Chapter 6, we investigate how data preprocessing contributes to the successful
    application of NLTS. The success with which NLTS reconstructs real-world system
    dynamics critically on whether data are informative. This is a concern in practice
    that data are often noisy and of short duration. Similar to an out-of-focus photograph,
    noisy time series obscure the resolution of reconstructed phase space attractors
    (Kot et al., 1988). Short time series data may not adequately sample dynamics
    occurring at lower frequencies (Schreiber, 1999). If so, these cycles are lumped
    together linear or nonlinear trends, and the time series may be stationary within
    the sampled time frame. Similar to other time series methods, NLTS demands stationary
    data. Problems with noise and nonstationarity can be mitigated by applying signal
    processing techniques that separate data into structured variation (signal) and
    unstructured variation (noise), remove trends, and measure signal strength as
    the percentage of variation explained in the observed data. Strong signals found
    to be used to reconstruct real-world system dynamics. Weak signals indicate that
    conventional linear stochastic methods may be more effective. We model the noise
    separated from time series probabilistically with extreme value statistics (Katz,
    2010). This generates an informative diagnostic (return-level plots) estimating
    the time periods expected before a particular notice is realized (Chapter 11).


    In Chapter 7, we present surrogate data. Successful phase space reconstruction
    of real-world system dynamics provides only circumstantial evidence of deterministic
    real-world structure. We must further test the null hypothesis that noticeable
    geometric regularity observed in a reconstructed attractor is more likely mimicked
    by linear stochastic dynamics. In surrogate data, the observed time series is
    used to randomly generate a set of surrogate variables to demonstrate intertemporal
    patterns in the data while preserving various statistical properties. A phase
    space attractor is reconstructed for each surrogate variable and the measures
    of nonlinear structure developed in Chapters 4 and 5 are estimated. The null hypothesis
    of linear stochastic dynamics is rejected if there is statistically significant
    difference between the discriminating measures taken from the surrogateors and
    corresponding measures taken from the attractor reconstructed from the observed
    time series (Schreiber and Schmitz, 2000; Theiller et al., 1992).


    If surrogate data do not eliminate the possibility of nonlinear dynamics in observed
    data, we proceed to further nonlinear techniques that analyse reconstructed systems
    dynamics in depth. In Chapter 8, we present convergent mapping methods (Sugihara
    et al., 2012), which test whether multiple observed time series belong to the
    same dynamic system and thus interact. We also investigate change-point and tipping-point
    methods testing whether variables with continuous time records undergo abrupt
    changes in dynamics corresponding to the irregular timing of variables exhibiting
    only occasional activity. In Chapter 9, we investigate phenomenological (data-driven)
    modelling (Baker et al., 1996; Dong et al., 2015; Brunton et al., 2016), which
    extracts a set of ordinary differential equations governing system dynamics from
    a single time series or from multiple time series on causality interacting variables.
    We apply regularized regression techniques to extract a mathematical model of
    nonlinear system dynamics from the data, which can be used to provide valuable
    data-driven insight into real-world biophysical processes'
