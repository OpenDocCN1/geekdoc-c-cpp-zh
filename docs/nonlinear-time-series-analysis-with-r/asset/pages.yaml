  md: '# Why Study Nonlinear Time Series Analysis?


    The 2008 crisis led The Economist to endorse a more evidentiary approach for the
    profession in an article entitled If Economists Reformed Themselves (Economist,
    2016c):


    ''Economists are good at reducing a complicated world to a few assumptions, then
    adding bells and whistles to make their models more realistic. But problems arise
    when they mistake the map for the territory ... In future, big data and new "machine
    learning" techniques could help test the relative power of competing theories.''


    # 1.2 Nonlinear Dynamics and a Strategy for Applying NLTS


    Sophisticated application of NLTS requires a firm theoretical foundation in basic
    nonlinear dynamics that we provide in Part 1 of this book (Chapters 2-5). We investigate
    how complex behaviour can arise from a simple deterministic nonlinear specification
    (Chapter 2), how system dynamics can be reconstructed from a single variable with
    phase space reconstruction techniques (Chapter 3) and how tools from nonlinear
    dynamics can be used to measure characteristics of reconstructed dynamics (Chapters
    4 and 5).


    Phase space reconstruction is the centerpiece of NLTS (Kantz and Schreiber, 1997).
    Phase space records the level of (state) variables at each point in time. For
    example, assume that a dynamic system is fully expressed with two variables $x_t$
    and $y_t$ that change with time $t$. Phase space plots $y_t$ against $x_t$, so
    that one point could be their values in the year 2000: $(x_{2000}, y_{2000})$.
    Running a line through this past and future results depicts the evolution of the
    system through. In dissipative systems, trajectories converge to a subset of phase
    space where they oscillate periodically around an attractor—geometric structure
    with noticeable regularity—forever after (Brown, 1996). Consequently, an attractor
    encapsulates the long-term dynamic behaviour of the system. Prior to the 1980s,
    researchers assumed that all of the variables at work in dynamic systems were
    needed to construct phase space representations of dynamic systems. This is problematic
    in practice because we cannot necessarily identify all of the variables at work
    in real-world dynamic systems, and we might not be able to adequately measure
    many variables that we can identify. Researchers then discovered that phase space
    dynamics could be reconstructed from a single variable using delay coordinates
    (Breeden and Hubler, 1990). As a result, we can potentially reconstruct real-world
    dynamic systems from time series data on a single variable.


    Consider a simple preliminary example of phase space reconstruction using snowshoe
    hare (prey) and lynx (predator) collected by the Hudson Bay company in Canada
    from 1845 to 1935 (Odmus, 2003). The time series for each population cycles through
    through phase space by plotting lynx against hare at each point in time (Figure
    1.1b). The co-evolution repeatedly along a predator-prey cycle constructing the
    attractor for the system. A large predator population over-consumes available
    prey and crashes for want of food. This allows the prey to recover until pressed
    again by recovering predators, and cycling continues. A shadow version of the
    predator-prey attractor is reconstructed in phase space from a single variable
    by plotting the prey or predator population its level a period later (Figure 1.1c).
    This is the delay embedding method of phase'
