    # 8.7 Detecting Tipping Points


    We consider a probabilistic approach to detecting causality by a continuous record
    having a weak signal due to a high degree of noise. Again, we search for evidence
    of abrupt structural changes in the continuous record corresponding to spikes
    in sporadic records, but now rely on histograms of SSA to identify tipping points
    (Livina et al., 2011; Lenton and Livina, 2016). A histogram is a bar chart measuring
    frequencies with intervals of observations (bins) occur in the time series. Histograms
    destroy temporal patterns in the time series, but this becomes less costly as
    patterns account for relatively smaller fractions of total variability. The logic
    behind relying on histograms to detect systems is that bins containing stable
    equilibria occur relatively frequently in the time series, as displayed by higher
    peaks. For example, the histogram of a time series converging to a stable equilibrium
    with a single spiked peak over the corresponding bin. A tipping point occurs,
    for example, when a histogram transitions from a single peak to multiple peaks
    reflecting'
