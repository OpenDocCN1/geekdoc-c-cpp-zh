    \ #make terms f equal\nglength(x_minus);length(x_minus2)<-\n#Compute 4th-order\
    \ centre difference compatible for equally spaced data points\ndiff<--(x_plus2-8*x+x_minus1)/(12*delta)\n\
    #Make time series compatible to finite difference\n#Time series loses first and\
    \ last two observations (4 total).\n#To make length as equal *.remove two observations\
    \ from\n#each end.\nx<-x[3:length(x)] #remove first two observations\nx<-x[1:length(x)-2]\
    \ #remove last two observations\nreturn-list(x,diff)\n} #end-user-defined function\n\
    ```\n\n```\ndiff_x<-diff(x,delta) #run user-defined function\ndiff_x[[1::2]];x.diff<-diff_x[[2]]\n\
    ```\n\nTable 9.1 shows the output from Code 9.1 for the first six times (in the\
    \ first column), the time series (in the second column) and the computed finite\
    \ difference (in the third column).\n\n# 9.4 Multivariate Polynomial Expansions\n\
    \nThe standard multivariate polynomial function is\n\n> $F(x_1, x_2, ..., x_m)\
    \ = \\sum_{n=1}^{N_p} A_n x_1^{\\alpha_1} x_2^{\\alpha_2} \\cdots x_m^{\\alpha_m}\
    \ \\quad (9.3)$\n\nwhere $m$ is the number of variables in the expansion (three\
    \ in the Lorenz system) and $A_n$ are fixed unknown coefficients (Dong et al.,\
    \ 2015). The number of monomials in the expansion is calculated as $N_p = (M_p)^m$,\
    \ where $M_p$ sets the range of monomial (individual) terms. For example, the\
    \ number of monomials in each polynomial expansion in the system (9.1) is $N_p\
    \ = M_p = 2^{(m=3)} = 8$, and monomial terms contain $x_n^0$ ($n=1, 2, 3$)."
