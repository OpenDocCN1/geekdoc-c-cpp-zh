  md: '# Entropy Test 129


    $H_0 : X_t$ is a linear process and test. The alternative hypothesis is $H_1 :
    X_t$ is not a linear process. However, what exactly does ''nonlinear'' mean in
    this context? There are kinds of nonlinearity, and therefore a test to determine
    linearity implies testing for specific nonlinear features that are absent in the
    case of a linear process. For instance, as we have already seen, linear processes
    show no sensitivity to initial conditions. Giannini (2012) has classified and
    discussed various topics for nonlinearity; here, we mention the BDS test (Brock
    et al., 1986), based on the correlation integral (eqn 4.6), which has the form


    ```

    $BDS(m, \epsilon) = \frac{\sqrt{n}[\hat{C}_m(\epsilon) - [{\hat{C}_1(\epsilon)]^m]}{\hat{V}_m^{1/2}}$

    ```


    m is the embedding dimension, $\hat{C}_m(\epsilon)$ is given by eqn (4.6) (the
    subscript $m$ is added here for clarity) and $\hat{V}_m$ is an estimator of the
    asymptotic variance. Serial dependence implies that $\hat{C}_m(\epsilon) = [\hat{C}_1(\epsilon)]^m$;
    note, however, the reverse is not necessarily true.


    Nonparametric entropy measures of dependence are at the basis of a class of tests
    for nonlinearity. Here we present the metric entropy due to Granger et al. (2004),
    often denoted by $S_p$, which has been exploited by Gonzalez et al. (2006) and
    Gonzalez et al. (2008) in studies of DNA sequences. This entropy $S_p$ is a normalized
    version of the Bhattacharya-Hellinger-Matusita distance (Maasumi and Racine, 2002)
    and is defined as


    ```

    $S_p(k) = \frac{1}{2} \int_{-\infty}^{+\infty} \int_{-\infty}^{+\infty} \sqrt{[\hat{f}_{(X_t,X_{t+k})}(x_1,
    x_2) - \hat{f}_{X_t}(x_1)\hat{f}_{X_{t+k}}(x_2)]^2} dx_1 dx_2$ (5.2)

    ```


    where $\hat{f}_{X_t}(\cdot)$ and $\hat{f}_{(X_t,X_{t+k})}(\cdot)$ are the probability
    density functions of $X_t$ and of the vector $(X_t, X_{t+k})$, respectively. This
    measure can be interpreted as a nonlinear autocorrelation function; that is, if
    $S_p$ exceeds the confidence band at lag $k$, then there is a significant correlation
    between $X_t$ and $X_{t+k}$, which are separated by $k$ steps in the sequence.
    The measure satisfies the following properties:


    +   - It is defined for both continuous and discrete variables.

    - It is normalized and varies between 0 and 1.

    - It takes the value 0 if $X_t$ and $X_{t+k}$ are independent

    - It takes the value 1 if there is a measurable exact (nonlinear) relationship
    between the variables.

    - It reduces to a function of the linear correlation coefficient in the case of
    Gaussian variables.

    - It is a metric measure, not only a divergence measure; indeed, it obeys the
    triangle inequality and is a commutative operator.

    - It is invariant with respect to constant, strictly increasing transformations.


    The measure $S_p$ has shown to impressive and robust power for characterizing
    nonlinear processes (Giannini et al., 2007a). See also, for instance, Granger'
