  md: '# Summary 263


    Convergent cross mapping (CCM) requires variables have the continuous time records
    needed to reconstruct the shadow phase spaces used to measure causal interaction.
    Some practitioners rightly question how we can count on phase space reconstruction
    when ''it remains challenging to measure (and even define) noise and noneequilibrium
    behavior in natural systems'' and given uncertainty over whether ''systems are
    approximately deterministic'' (Colby and Baskerville, 2016). These concerns underlie
    the importance of applying CCM to signal-processed time series data diagnosed
    with deterministic, low-dimensional and nonlinear dynamics. Fortunately, we can
    make this diagnosis in a statistically rigorous manner with nonlinear time series
    methods. If we fail to detect evidence of deterministic dynamics in data, we should
    turn to more appropriate empirical causality tests. When it comes to CCM (and
    any other method): If the shoe doesn''t fit, don''t wear it!


    In the final sections, we have investigated methods designed to test whether variables
    with continuous records exhibit abrupt structural changes in behaviour corresponding
    to the irregular timing of variables exhibiting only occasional activity. If we
    uncover a strong signal in the continuous record, we can use a structural change-point
    detection approach based on singular spectrum analysis. Alternatively, if we detect
    a weak noisy signal, we can turn to a probabilistic tipping-point detection approach
    based on histograms constructed from the observed data. Armed with these methods,
    we can detect causal interactions when confronted with a broad array of heterogeneous
    historic records.'
