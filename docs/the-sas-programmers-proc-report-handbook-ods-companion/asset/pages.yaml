    Output 3.6.1, the PDF output, contains a number of changes. The data rows and
    the LINE statement rows have a gray background. The BORDERPADDING= attribute is
    applied between the rows and columns of the data portion of the table. The teal
    border that surrounds the table is narrower than the teal borders within the table.
    The width of the teal border that surrounds the table is determined by the BORDERWIDTH=attribute.
    The navy color specified in the style template was not applied to any of the text
    in the table.Output 3.6.2, the RTF output, contains a number of changes. Like
    the PDF output, the data rows and the LINE statement rows have a gray background.
    The BORDERPADDING= attribute is applied between the rows and columns of the data
    portion of the table. The teal border that surrounds the table is narrower than
    the teal borders within the table. The width of the teal border that surrounds
    the table is determined by the BORDERWIDTH=attribute. The navy color is applied
    to pretext above the table, which also has a gray background.


    Output 3.6.3, the HTML output, looks quite different from the PDF and RTF output
    at first glance. Like the PDF output, the data rows and the LINE statement have
    a gray background. However, for the HTML output, BORDERPADDING= attribute adds
    one space between the data rows and columns that space is not filled with the
    border. Instead, the border is restricted to the cell. The specified border width
    appears to be applied only to the border that surrounds the table. The output
    does not contain any text that have any navy-colored text , gray background, or
    teal borders.


    Output 3.6.4, the ODS output from Excel, does not contain any style changes. It
    does not have any navy-colored text , gray background, or teal borders.


    Output 3.6.5, the ODS output from PowerPoint, has a gray background for everything
    except the pretext. However, it does not contain the navy font or teal borders.'
