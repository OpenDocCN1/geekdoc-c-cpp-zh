    # 8.5 Images


    The HTML5 destination handles images differently than the HTML destination. ODS
    HTML5 uses SVG (Scalable Vector Graphic) as the default Universal Printer and
    device driver. Scalable graphics means that zooming in out is possible without
    losing resolution or clarity.


    HTML5 also packages tables, images and graphics into one. This allows ODS HTML5
    output to be treated like PDF or RTF in that the images are embedded and you only
    need to worry about one file. When an ODS HTML file is created a .html file is
    saved along with the required number of image files. You have to'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 176 The SAS Programmer''s PROC REPORT Handbook: ODS Companion


    make sure you use the .html file and all of the individual image files, like those
    created with a graphing procedure.


    In relation to PROC REPORT, the biggest change between the ODS HTML and ODS HTML5
    output is that ODS HTML5 does not support a background image inside a cell using
    the BACKGROUNDIMAGE= attribute. This is not a limitation of SAS. It is due to
    a change in the HTML5 standard. For the HTML5 destination, Cascading Style Sheets
    (CSS) must be used to insert a background image in a table cell.


    The other image attributes, PREIMAGE= and POSTIMAGE= will generate the same output
    in the HTML5 destination that it did in the HTML destination.


    # 8.6 Accessibility


    Accessibility standards are tremendously important and are increasingly required
    for many documents. In SAS 9.4 TS1M4, the ODS HTML5 destination generates the
    most accessible files of any destination in SAS. Assistive technology, such as
    screen readers, can access the file.


    The ODS HTML statement does not require any additional options for generating
    accessible tables. The ACCESSIBLE GRAPH statement option adds accessibility metadata
    to graphs that are created by ODS Graphics.


    More information about creating accessible output can be found in the SAS® 9.4
    Output Delivery System: User''s Guide.


    For HTML5 no changes are required for the PROC REPORT code to make the PROC REPORT
    accessible.


    # 8.7 Key Takeaways


    In this chapter I discussed the differences between the HTML and HTML5 destinations.
    The key takeaways from this chapter are:


    +   * The HTML and HTML5 destinations use different standards and should not be
    expected to behave exactly the same way.


    +   * The HTML5 destination should be used when creating new programs or updating
    old ones.


    +   * The BACKGROUNDIMAGE= attribute is not valid with the HTML5 destination.


    +   * The HTML5 destination is the most accessible destination in SAS.'
  merge: -1
  pgno: 191
