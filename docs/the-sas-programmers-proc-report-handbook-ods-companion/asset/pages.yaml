    +   The PA= statement is optional. It provides a style that the newly defined
    style can inherit from. When the PA= option is not specified, the style.Base.Style
    is automatically assigned as the parent. This ensures that at least a minimum
    set of styling is in place to create a consumable table Using the PA= statement
    is a quick way of establishing a style template that has most of the desired attributes.
    The style-path option in this statement specifies the path and name of the style
    to be inherited from.


    The name and location of the parent style is not checked when the new style is
    defined. The name of the parent is simply stored with the rest of the new style''s
    code. It is not until the new style is used in ODS that SAS looks for the parent
    name (either one-level or two-level) in the first template store in the ODS PATH.
    Then it looks in the second, and so on, until the parent style is found. If the
    parent cannot be found, a warning is issued and ODS reverts to the default style
    template for destination.


    ```

    WARNING: Could not restore referenced object: styles.XXX.

    WARNING: Could not find parent template: styles.XXX.

