  md: 'Use caution with the SPROWS option. It is known to cause Access violation errors
    and table misalignment of RTF and PDF files. Limit its use and test it in any
    new program or release of SAS to ensure that it has the desired effect. Because
    SPROWS increases the risk, a best practice is to test the use of SPROWS thoroughly
    and to remove the option from code when it is not needed.


    # 5.6 Accessibility


    Features that implement accessibility standards are tremendously important and
    are increasingly required for many documents. In SAS 9.4 TI1M5, the ODS PDF statement
    honors the ACCESSIBLE option. The ACCESSIBLE option is preproduction in SAS 9.4
    TIM4. This new option adds non-visual metadata to the PDF file. This means assistive
    technology, as screen readers, can access the file.


    The ACCESSIBLE option enables screen readers to read the headers and data within
    a PROC REPORT table. Because is an ODS PDF statement option, no changes are required
    for PROC REPORT code.


    However, it is important to understand that limitations related to PROC REPORT
    tables exist. For example, spanned row headers cause all the data cells under
    the header to be read as if it were one huge row.


    Also, if the rowheader style element is specified in a DEFINE statement, that
    row is not tagged as a row header.

    define customer_country / style (column)=row;


    The preceding statement makes CUSTOM_COUNTRY appear visually as a row header.
    However, since it is not tagged as a row header, a screen reader will read it
    as if it were a regular row.


    These issues do not affect the HTML5 destination, which also supports accessibility
    features.


    # 5.7 Key Takeaways


    This chapter focused on the PDF destination. This destination is one of the most
    robust ODS destinations. The following advice is in mind when creating ODS PDF
    output:


    +   - For best results, use one of the style templates that were created specifically
    for the Printer family destinations.

    - Specify both the width and color when manipulating borders.

    - The PDF destination will attempt to keep a grouping on the same page when SPROWS
    is in effect.


    Part of Section 5.4 is reproduced with permission from Eslinger, J. 2016. The
    SAS Programmer’s PROC REPORT Handbook: Basic to Advanced Reporting Techniques.
    Cary, NC: SAS Institute, Inc.'
