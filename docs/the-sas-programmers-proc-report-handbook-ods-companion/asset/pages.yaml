    #  9.7 Key Takeaways


    This chapter provided a lot of information about handling the unique aspects of
    the ODS destination for PowerPoint. The beginning of the chapter discussed the
    changes that can be made with the style template. The important takeaways regarding
    the style template are:


    +   - Always use PowerPointLight or PowerPointDark as the parent style when creating
    a custom style template for PowerPoint.

    - Make changes to the style elements only when those changes are needed for every
    table in the presentation.

    - BORDERSTYLE=HIDDEN removes the gray border lines inside the table.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'This chapter also covered programming techniques to help ensure that the PROC
    REPORT table displays as desired in the PowerPoint slide. Key takeaways include
    the following:


    +   - Limit the number of columns and rows in a table as much as possible.

    - Keep the number of header rows to a minimum.

    - Use the PAGE option in the DEFINE and BREAK statements to divide large tables
    into smaller tables.'
