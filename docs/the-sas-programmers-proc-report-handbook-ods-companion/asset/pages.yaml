    9.7 shows that just one small change (such as increasing four columns to five
    columns) can produce big consequences. Admittedly, the table could be made smaller
    so that it fits on one slide, without compromising readability. Changes could
    be made with the style template as demonstrated earlier in this chapter. However,
    template changes affect every table that is sent to the destination. For the ODS
    destination for PowerPoint, it is important to consider all of the output that
    is being generated. All tables need to be reduced slightly to allow to fit. Regardless
    of whether they are created by PROC REPORT, PROC TABULATE, PROC FREQ, or another
    procedure it makes sense to create a custom style template. If only one table
    within the presentation is not fitting as desired, it is better to make the changes
    that within one procedure.


    There is no right way to make sure that a table fits on each slide, but some of
    the same techniques can be used for each table. For example, the font size in
    Output 9.7 is 20pt. The font size can be reduced slightly to allow the table to
    fit. Example 9.8 demonstrates changing the font size for the table to 18pt. It
    also makes one other critical. It changes the label of the TOTAL_RETAIL_PRICE
    variable. Output 9.8 shows the table now contained on one slide.


    # 9.8 Creating a Table with 18pt Font Size


    ```

    title:

    ods powerpoint file="Output9-8.pptx"

    proc report data=orders=(obs=20)

    style(report)=[pretext=''this is pretex'']

    style(header)=[backgroundcolor=#F0F0F0]

    style(report column header summary lines)=[fontsize=18pt];

    ```'
