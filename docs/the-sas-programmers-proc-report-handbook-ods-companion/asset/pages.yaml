  md: '# RTF and Tagsets.RTF Destinations 123


    Many reports that are sent to the RTF file use the RULES= attribute to modify
    or remove the interior borders from a table. The SPANROWS option has several purposes
    for Tagsets,RTF but only one purpose for RTF. When the table is sent to RTF without
    interior borders, the SPANROWS option is not necessary because it does not have
    a noticeable effect.


    Use caution with the SPANROWS option. It is known to cause Read access errors
    and table misalignment of RTF and PDF files. Limit its use and test it in any
    new program or release of SAS to ensure that it has the desired effect. Because
    SPANROWS increases the risk, a best practice is to test the use of SPANROWS thoroughly
    and to remove the option from code when it is not needed.


    # 6.7 Raw RTF Commands


    Behind the scenes, RTF files consist of raw RTF commands or control words. The
    application that renders the document converts these commands into what is seen
    on the screen in the form of words, numbers, tables, and so on. The ODS RTF and
    Tagsets.RTF destinations allow RTF commands to be passed into the document. This
    was a common way to change alignment or indentation or add borders before the
    Output Delivery System (ODS) offered those capabilities. They are not needed as
    much in the most recent version of SAS.


    The capability to pass the commands into the file still exists. However, note
    these considerations when using this technique. First, SAS does not check these
    commands. It does not look for syntax errors, misspellings, or anything of the
    sort. It simply passes the command to the file as a string. The programmer is
    responsible for knowing the correct command and syntax to use.


    Secondly, ODS matures the raw RTF commands might negatively affect interactions.
    The commands could cause unwanted spacing or additional page breaks. When this
    happens, it might be possible to modify the command to get the desired behavior,
    but that is not guaranteed. In some instances, the only recourse is to remove
    the RTF command altogether.


    Raw RTF commands still have their place. They can be used to add a hanging indent,
    for which SAS does not have an attribute or function. However, use caution when
    including RTF commands to make PROC REPORT tables. Before resorting to using raw
    commands, first try using style attributes. The style attributes have been vetted
    and tested are are fully supported. Their behavior is also more predictable.


    # 6.8 Key Takeaways


    This chapter discussed both the RTF and Tagsets.RTF destinations. The key takeaways
    from this chapter are the following:


    +   - Many of the differences between Tagsets.RTF and RTF have only an indirect
    impact on PROC REPORT.

    - Tagsets.RTF does not use the attributes from a style template that RTF does.

    - Tagsets.RTF will automatically place a border at the bottom of each page of
    a table that spans pages. RTF does not support these features.

    - The SPANROWS option provides more capability in the Tagsets.RTF destination
    than the RTF destination.'
  merge: -1
