  md: "# 2.5 General Syntax of PROC TEMPLATE\n\nModifications can be made to the style\
    \ templates that are shipped with Base SAS. However, a best practice is to create\
    \ a style with a new name instead of overwriting the original style templates.\n\
    \nIn general, a style template created by modifying an existing template or by\
    \ writing a new one is referred to as a custom style template. Templates can be\
    \ created from scratch, but most programmers find it easier to make small modifications\
    \ to an existing template.\n\nHere are the benefits of custom style templates:\n\
    \n+   * A custom style provides a uniform look across multiple programs and reports.\n\
    * The code needs to be created only once and modifications to the style need to\
    \ be made only in one location.\n* Some attributes cannot be changed within procedures.\
    \ Therefore, the changes must be made within a custom style template.\n\nThe TEMPLATE\
    \ procedure creates and modifies style templates. Within a style template are\
    \ style attributes. Style attributes are individual properties that describe a\
    \ particular aspect of the output should look. BACKGROUNDCOLOR is an example of\
    \ a style attribute. Style attributes are grouped in style elements. Style elements\
    \ control certain areas of the output. For example, the Header style element controls\
    \ the header portion of tables. The Table, Header, and Data elements are the main\
    \ elements for tabular output, like that created by PROC REPORT.\n\nExample 2.7\
    \ shows the general syntax of PROC TEMPLATE:\n\nExample 2.7 General Syntax of\
    \ PROC TEMPLATE\n\n```\nproc template;\n  define style-path | Base.Template.Style\
    \ < STYLE=libref.template-store>;\n  parent = style-path;\n  class element-name(s)\
    \ <text>\n    </style-attribute-specification(s);\n  style element-name(s) <FROM\
    \ style-element | _SELF_ <text>\n    </style-attribute-specification(s);\nend;\n\
    ```\n\nThe DEFINE STYLE statement begins the creation of a new style. The style\
    \ created by this code can be used by any ODS destination that supports the use\
    \ of styles.\n\nThe style-path tells PROC TEMPLATE where to store the style within\
    \ the template store. Style-path can be a one-level or two-level name. Specifying\
    \ a two-level name is a to create directories within the template store. For example,\
    \ if the style-path is ABC, the style will be listed as an entry in the root directory\
    \ of the template store. If the style-path is styles.ABC, a directory called styles\
    \ will be created within the template store and the style. The ABC, will be stored\
    \ in a one-level or two-level style-path is user preference.\n\nSpecifying Base.Template.Style\
    \ in the DEFINE STYLE statement creates a style that becomes the parent of all\
    \ styles that do not contain a PARENT template. Base SAS already contains a"
