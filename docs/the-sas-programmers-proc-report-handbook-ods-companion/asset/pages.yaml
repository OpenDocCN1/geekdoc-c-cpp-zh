- img_proc: true
  md: '# 4.2 STYLE= Default Locations and Order of Precedence


    Style attributes can be applied from any or all of the PROC REPORT statements,
    using the STYLE=(location(s))= option. Specifying the location value is optional,
    but it is a best practice to include it. Attribute name and value pairs are listed
    in brackets after the equal sign. The valid and default values for location vary
    by statement. The location value can be any of the following:


    +   - column

    - header

    - summary

    - report

    - lines

    - calldef


    To specify more than one value for location in the same STYLE= option, separate
    each value with a space. For example, STYLE=(HEADER COLUMN)= will change the attributes
    in both the header and column areas of the report.


    The following statements use the STYLE=(location(s))= option. The default location
    is listed.


    +   - PROC REPORT: report

    - DEFINE: column and header

    - BREAK: summary and lines

    - RBREAK: summary and lines

    - COMPUTE: lines


    There are other ways to impact style without using the STYLE= option. The COLUMN
    statement accepts overrides via inline formatting. The CALL DEFINE statement is
    specifically designed for changing attributes at the cell or row level. The changes
    are made on the values in the second and third arguments.


    With the ability to change attributes in every statement, you need to know which
    statement wins. Style attributes are applied in the following order, with the
    last one taking precedence.


    +   1. Style template created by PROC TEMPLATE and specified on the ODS statement

    2. PROC REPORT statement

    3. DEFINE statement

    4. BREAK or RBREAK statement

    5. COMPUTE statement

    6. CALL DEFINE statement


    The precedence order means when specified in the PROC REPORT statement, the header
    location controls all header cells. When specified in a DEFINE statement, the
    header location controls the header cell for specific report item. The same is
    true for all of the other locations.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# 4.3 STYLE= in PROC REPORT Statement


    The power and convenience of the STYLE= option in the PROC REPORT statement is
    sometimes overlooked. Programmers copy code from one program to another or get
    caught in the details and forget to consider an easier or more efficient way to
    get the desired output.


    The PROC REPORT STYLE= option is extremely useful for setting attributes for all
    headers, all columns, and all summary rows. Example 4.1 creates a table with seven
    columns. All headers have a dark blue background color and a foreground color
    of white. The attributes are set once in the PROC REPORT statement. Output 4.1
    shows the PDF results.


    # Example 4.1 Change Attributes for All Headers


    ```

    ods pdf file="Output4-1.pdf";

    proc report data=orders(obs=1)

    style=[backgroundColor=#3D5AAE color=white];

    column customer_id customer_name customer_gender customer_age customer_country

    stomer_type customer_group;

    format customer_group $centry;

    run;

    ods pdf close;

    ```


