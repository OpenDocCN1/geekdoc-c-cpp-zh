- img_proc: true
  md: '# PROC TEMPLATE Overview 15


    information ODS needs to generate output. It might not look as pleasing to the
    eye as one hope, but it will be readable and functional.


    Taking advantage of the inheritance rules allows templates to be built without
    having to start from scratch. The concept of inheritance is relatively simple.
    However, for example, RTF inherits an attribute or element through each level
    of inheritance can be difficult. Styles.RTF inherits from Styles.Printer inherits
    from Styles.Default. This means that it might require looking in three different
    style definitions to determine the value of an attribute within a specific style
    element. Unfortunately, no tool is available for following a specific attribute
    within an element through all of the parent templates. To know where the value
    of an attribute is requires old fashioned detective work—open each template definition
    and look for it.


    # ## 2.8 Style Attributes


    This book does not list or demonstrate the use of every style attribute. ODS uses
    many to generate output. Instead of listing all attributes, the most commonly
    used attributes for PROC REPORT are shown in the examples.


    The SAS 9.4 Output Delivery System: User’s Guide contains a chapter about “ODS
    Style Reference," which contains a style attributes table. It lists each style
    attribute and what it does. The documentation is the best place to start when
    learning about specific style attributes.


    Please be aware that not all documented attributes have an effect on PROC REPORT
    tables. For example, the COLOR= attribute controls the color of the text in a
    PROC REPORT table. The attribute CONSTRAINT affects only graphics. When it is
    not easy to determine what effect the attribute will have by reading the documentation,
    the best thing to do is to try the attribute inside code to see anything changes
    within the PROC REPORT table. Chapter 3 digs deeper into style template changes
    and how to test them for the various ODS destinations.


    In some parts of the documentation, you may see references to destination types.
    Of the possible values, the common ones include markup, HTML, RTF, and printer
    family.


    Most of the values are easy to interpret. However, the markup family value can
    cause confusion. The markup family is the overall term for tagsets. SAS supplies
    many tagsets, but tagsets can also be created by programmers. The markup family
    includes these common destinations:


    +   * HTML

    * MSOFFICE2K

    * CSV

    * Tagsets.ExcelXP

    * SASReport


    The HTML destination is often listed by itself in the attribute table. This means
    that the attribute is supported for HTML but not necessarily for the remaining
    markup family.


    Theprinter value in the style attributes table includes the PDF, PCL, PostScript,
    and Printer destinations.'
