  md: "# 7.3.3 Border Manipulation\n\nSection 7.3.1 showed the results of using the\
    \ default style, Styles.Default, used by Tagsets.ExcelXP. Each cell is surrounded\
    \ by a thin white border. The color and width of the borders are reportspecific\
    \ and depend on the style template that is used. Each example in this section\
    \ uses Styles.Default as the parent. However, the techniques to manipulate borders\
    \ are regardless of which parent template is used.\n\nThe Tagsets.ExcelXP ignores\
    \ the FRAME= and RULES= attributes when applied within PROC REPORT code. It will\
    \ also ignore the BORDERCOLOR= attribute. Therefore, PROC TEMPLATE must be used\
    \ to change the borders within a table for Tagsets.ExcelXP.\n\nExample 7.24 removes\
    \ all borders from the table. First, the border attributes are changed within\
    \ the Table element. Then, the new style is specified in the ODS Tagsets.ExcelXP\
    \ statement. The results are shown in Output 7.24.\n\nExample 7.24 Remove Borders\
