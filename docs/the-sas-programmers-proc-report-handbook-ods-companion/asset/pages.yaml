  md: "# 6.3 Effect of Style Element Changes in Tagsets.RTF\n\nChapter 3 did not discuss\
    \ the Tagsets.RTF destination because the RTF destination is used more often than\
    \ the Tagsets.RTF destination. Like the results in Chapter 3, the output from\
    \ the two destinations looks similar, but is not always the same. It is important\
    \ to test style changes for the specific destination where the output will be\
    \ generated.\n\nFor some reports, it might be possible to use the same style template\
    \ and PROC REPORT code for both destinations. However, it is more likely that\
    \ one style template should be created for each destination. It might not be possible\
    \ to toggle between the two destinations for a specific report and its accompanying\
    \ code. Once the destination is chosen for a particular report, use that destination.\n\
    \nThis section uses the same PROC REPORT code that was used in Chapter 3. The\
    \ goal here is to highlight the differences between the two destinations. One\
    \ destination is not necessarily better than the other. Instead, the preferred\
    \ destination must be based on business and report requirements.\n\nSpecific attributes\
    \ are changed within the Header, LineContent, DataEmphasis, and Table style elements.\
    \ The difference between the table in Chapter 3, created with ODS TAGSETS.RTF\
    \ statements, and the corresponding ODS RTF table in Chapter 3, is detailed below\
    \ each output.\n\nExample 6.5 shows the code used in Examples 6.5-6.10. The style\
    \ name is changed for each of the examples to respect to the section of the report\
    \ being focused. See Chapter 3 for the accompanying programs for the complete\
    \ code with PROC TEMPLATE code.\n\n# Example 6.5 PROC REPORT Code Used in All\
    \ Chapter Examples\n\n```\nods tagsets.rtf file='output-x.rtf' style=stylename;\n\
    proc report data=orders (obs=20)\n\nstyle(report)=[pretext='this is pretext']\
    \ ①\nstyle(column)=[width=1.5in]; ②\n\ncolumn (\"Customer Info\" country customer_age_group)\n\
    (Order Info) order_type quantity); ③\n\ndefine customer_country / group format=$cntry;\n\
    define customer_age_group / group;\ndefine order_type / group format=typef;\n\n\
    compute customer_country;\n  line 'a statement for ' customer_country $cntry.;\
    \ ④\nendcomp;\ncompute after;\n  line 'this is a line statement'; ⑤\nendcomp;\n\
    \n  break after customer_country / summarize; ⑥\nrbreak after / summarize; ⑦\n\
    run;\nods tagsets.rtf close;\n```"
