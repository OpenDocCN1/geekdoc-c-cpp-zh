  md: '# Chapter 1


    # # Introduction: Overview of Chapters


    My previous book, *The SAS Programmer PROC REPORT Handbook: Basic to advanced
    Reporting Techniques*, (hereafter referred to as Reporting Techniques), provides
    details about the syntax of PROC REPORT, discusses the options, and shows how
    to use the statements within the procedure. It includes numerous examples for
    obtaining the desired report structure and the correct numbers. Chapter 6 of that
    book provides details and examples for changing the visual aspects of the report,
    such as coloring cells and adding images. However, because the book is focused
    on learning PROC REPORT, it does not provide a deep dive into all the ways that
    PROC REPORT interacts with the Output Delivery System (ODS).


    This book builds on Chapter 6 of my previous book. It explores how the style elements
    within a style template affect the output generated by PROC REPORT. Each ODS destination
    has its own unique purpose and underlying architecture, which means that each
    ODS destination renders PROC REPORT and its accompanying style attributes differently.
    The purpose of this book is to explore and understand these differences and to
    use PROC TEMPLATE and PROC REPORT code to get the best output.


    Chapter 2 in this book describes style templates. It explains where they are stored,
    and how to determine the names of styles styled with SAS, and how to use the general
    syntax of PROC TEMPLATE. PROC TEMPLATE is the mechanism for making changes to
    style templates or creating new style templates. The chapter addresses only PROC
    TEMPLATE with style templates. PROC TEMPLATE can be used with table template definitions.
    However, they are beyond the scope of this book.


    Chapter 3 provides an in-depth look at the style elements that are documented
    to affect PROC REPORT tables. Examples show how setting specific style attributes
    can change the appearance of the output in various destinations. ODS has many
    destinations to which PROC REPORT output can be saved. This chapter explores a
    handful of destinations, which include the following:


    +   - RTF

    - PDF

    - HTML'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# The SAS Programmer PROC Report Handbook: ODS Companion


    +   * ODS Destination for Excel

    * ODS Destination for PowerPoint

    * Tagsets.ExcelXP

    * SASReport


    I do not discuss the Listing destination in this book. The Listing destination
    monospace text output. It does not have the capabilities to add the formatting
    and style changes that are desired in most of today''s reports.


    Chapter 4 discusses style overrides that are specified within the PROC REPORT
    code. The STYLE= option is available in most statements within the procedure.
    This chapter discusses effective ways of using the option.


    All the common style changes for PROC REPORT tables were covered in my previous
    book. However, each ODS destination has unique capabilities and quirks. The remaining
    chapters in this book focus on the individual destinations and how to take advantage
    of their strengths or program around their weaknesses.


    In Chapter 5, I concentrate on the PDF destination. I discuss the style templates
    that provide the best results. The chapter explains border manipulation at length
    because PDF handles differently than any other destination. The chapter also covers
    the SPROWS option and the new accessibility feature available with SAS 9.4 TI1M5.


    Chapter 6 concentrates on the RTF and Tagsets.RTF destinations. It compares and
    contrasts the two destinations and shows how these affect PROC REPORT tables.
    I provide an in-depth discussion of the behavior of SPROWS option.


    Chapter 7 concentrates on the destinations that create output by Microsoft Excel.
    The ODS destination for Excel, ExcelXP, HTML, Office2K, and Office2K X create
    output that can be viewed in Excel. This chapter looks at the suboptions available
    in those destinations that can be used to alter PROC REPORT tables. It demonstrates
    how each destination can pass instructions that are specific to Excel to Microsoft.


    Chapter 8 concentrates on the HTML and HTML 5 destinations. The HTML 5 destination
    is slowly becoming the default HTML destination because it uses the latest HTML
    standard. In this chapter, I compare and contrast the HTML destination with the
    HTML 5 destination.


    Chapter 9 concentrates on the ODS destination for PowerPoint. The destination
    for PowerPoint is unique among all of the destinations discussed in this book.
    The destination uses a style template that does not inherit from a parent. The
    font and overall size are much larger than other destinations. This chapter discusses
    strategies for modifying PROC REPORT code to fit the output onto a slide and ensure
    its readability.


    Chapter 3 shows what the PROC REPORT output looks like in the SASReport destination,
    I do not devote an entire chapter to it. I have found that most production reports
    are created in one of the other destinations. the SASReport destination will remain
    available, but will be replaced by HTML 5 as the default destination in SAS Enterprise
    Guide. Like the other destinations, if SASReport is the desired destination for
    output, the style template and overrides should be written with SASReport in main.


    My goal with this is to teach you how to use style changes to produce your desired
    report to which the PROC REPORT table is. This book does not explain PROC REPORT
    syntax except in the context of style changes. Refer to The SAS Programmer''s
    PROC REPORT Handbook: Basic to Advanced Reporting Techniques for details about
    PROC REPORT syntax.'
  merge: -1
  pgno: 17
