  md: "# 74 The SAS Programmer PROC REPORT Handbook: ODS Companion\n\nPDF can be picky\
    \ when comes to manipulating borders. Here are some important things to know changing\
    \ borders in ODS PDF:\n\n+   - The visible border consists of one side of one\
    \ cell and one side of another. To alter two columns, the right border must be\
    \ changed for one column, and the left border must be changed for the adjoining\
    \ column. To alter a border between two rows, the top of one cell and the bottom\
    \ of the adjoining cell must be changed.\n- Any change to one border (TOP, BOTTOM,\
    \ LEFT, RIGHT) results in all four borders drawn. Therefore, when adding, removing,\
    \ or changing the top border, you might need to include the attributes for the\
    \ other three borders as well.\n- When adding a border, both the width and the\
    \ color must be specified.\n\n> > Tip: When manipulating borders in PDF, use bright\
    \ colors and thick widths to see which border is changing. Once the code is in\
    \ place, you can change the attributes to the desired color and thickness.\n\n\
    # 5.3.1 Manipulate Borders Already in the Table\n\nThe Styles.Pearl style template\
    \ sets the FRAME= attribute to BOX and the RULES= attribute to ALL. This results\
    \ in a table with a complete external border and borders around every cell, as\
    \ shown in Example 5.1 in the previous section. To demonstrate the preceding key\
    \ points, Example 5.2 attempts to add a teal border to the right side of the CUSTOMER_AGE_GROUP\
