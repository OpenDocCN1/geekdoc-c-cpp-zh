  pgno: 180
- img_proc: true
  md: '# 166 The SAS Programmer PROC REPORT Handbook: ODS Companion


    The destinations that generate HTML output are most similar to Excel destinations
    because they are not limited to a piece of paper RTF and PDF. HTML output is designed
    to be viewed on screen. The output is wide and long, with the consumers of the
    report using scroll bars to view more information. The browser plays an important
    role in how SAS HTML output is displayed. Chrome, Firefox, and Internet Explorer
    are all popular browsers, and each one might display the output differently. In
    some instances output that looks incorrect in one browser might look correct in
    another.


    The screenshots in this chapter were taken from a Chrome browser.


    # 8.2 Style Differences between the HTML and HTML5 Destinations


    Comparing the HTML5 destination output to the HTML destination output is quite
    difficult due to the differences between the underlying standards. The HTML5 standard
    contains new elements, attributes, and behaviors. Therefore, you should not assume
    that attributes within SAS are going to behave the same way in both the HTML and
    HTML5 destinations.


    This section uses the exact same code as Chapter 3. The goal of this is to highlight
    the differences between the two destinations. One destination is not necessarily
    better than the other; however, HTML5 is currently receiving the bulk of developmental
    enhancements moving forward. You should try to use the latest standard in new
    programs and code.


    Specific attributes are changed within the header, LineContent, dataemphasis,
    data, and table style elements. I detail below each the difference between the
    table in this chapter, created with ODS HTML5 statements, and the corresponding
    ODS HTML table in Chapter 3.


    In general, the ODS HTML5 output has a smaller font size. The spacing between
    rows also appears to be smaller. I would argue that in most cases, with the changes
    made to the style template, the ODS HTML5 output looks better than the ODS HTML
    output.


    Example 6.0 shows the code used by Examples 8-1-6. The style name is changed for
    each of the examples to correspond to the style of the report being focused on.
    See Chapter 3 or the accompanying programs for the full code with the PROC TEMPLATE
    changes.


    Example 8.0 PROC Report Code in All Chapter Examples


    ```

    ods html5 path=''file=Output-8-x.html'' style=classname;

    proc report data=orders(obs=20)

    ```


    ```

    style(report)=[pretext=this is pretext] 1

    style(column)=[width=1.5in]; 2

    ```


    ```

    column("Customer Info") customer_country customer_age_group

    ("Order Info") order_type quantity); 3

    ```


    ```

    define customer_country / group format=$cntry;

    define customer_age_group / group;

    define order_type / group format=typef.;

    ```'
