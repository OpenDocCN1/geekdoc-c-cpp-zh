    # 3.11 Key Takeaways


    This chapter has covered a lot of ground. It explored how attribute changes within
    specific style elements affect the output generated by PROC REPORT. These examples
    provide some very important takeaways:


    +   - Each ODS destination uses style elements, and the attributes within those
    elements, differently from the other. It is a good idea to develop a different
    style template for each destination.


    +   - The documentation lists five style elements used by PROC REPORT: Header,
    LineContent, DataEmphasis, Data, and Table.'
