  md: '# The SAS Programmer''s PROC REPORT Handbook ODS Companion


    # Output 5.10 Notches Present in the Vertical Border


    ![](img/63c9b1dfb2b2b113230735bf3dbdfedd_99_0.png)


    Output 5.10 almost makes so no sense. It appears that the vertical teal border
    is drawn first and then the horizontal purple borders are drawn. It seems that
    the exact opposite of what happened before is happening in this example.


    This behavior is unchangeable and can be perplexing. You must either accept it
    or rethink the borders that you want. Again, the problem with notches in borders
    is noticeable only when two different colors are applied. If both borders were
    the same color, the borders lines would appear smooth and neat.


    # 5.3.3 Border Width Values


    The border width is set to 1pt in Example 5.4, .5pt in Example 5.6, and .1pt in
    Example 5.8. The ability to discern the difference between these point size sizes
    varies. Sometimes an observed difference is determined by what color is used and
    whether it is a vertical or horizontal border. Also, don''t forget that the zoom
    level in Adobe also plays tricks on the width of borders. The BORDERWIDTH attribute
    in Styles.Pearl is set to .1pt. The same attribute is set to .75pt in Styles.Printer.
    In general, any value between .1 and .75pt looks the same. Even 1pt might be the
    same width as .75pt. Understand that a border can be only so thin. The border
    is either there or it is not there. When manipulating borders within PROC REPORT,
    a good practice is to use the width from the parent style template. Obviously,
    if a thicker border is needed, then any value that is greater than 1pt should
    look different.


    # 5.4 Paging


    Reporting Techniques covered a topic that is revisiting: how to control table
    and page breaks when sending long logs, wide tables, or long tables to PDF.


    The PDF destination is a true “paging” destination and meant to be printed. Printed
    output is limited to the size of the paper. However, the amount of output that
    fits on one page is extremely variable. Titles, footnotes, logos, margins, font
    face size, and borders all affect the output.


    PROC REPORT does not control the placement of the output. Each destination is
    responsible for placement. Each destination and the application used to output
    the output controls the paging. PROC REPORT does not know where a page break will
    occur in Non-Listing ODS destination. The PAGE option, in the DEFINE and BREAK
    statements, behaves differently for these destinations. PROC REPORT does not automatically'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'insert a page break. Instead, it creates a new table. The destination determines
    whether the new table will be placed on a new page.


    When the PAGE option is used in a DEFINE statement, a vertical break will occur.
    That is, a new table is created. However, all observations for the first set of
    columns will be printed, and then all the observations for the next set of columns
    will be printed. Any variables designated as ID will be printed with the next
    set of columns.


    For PDF, to interleave pages, the first set of columns is on the first page and
    the second set of columns is on the second page, you will need to add a variable
    to the input data set that can be used as a GROUP or ORDER variable. This new
    variable will set the number of observations for each table. The new variable
    must be placed in a BREAK statement with the PAGE option. This forces the destination
    to keep the observations. The PAGE option in a DEFINE statement places the second
    set of columns in a new table. destination then places each table on its own page.
    The value of the new variable is arbitrary. It should be based on the number of
    observations that can reasonably fit on a page when considering margins, font
    size, and business requirements.


    Because PROC REPORT does not know where the page break will be inserted by the
    destination, it does not know whether rows for a particular grouping will fit
    on a page. PROC REPORT will create a new table when the GROUP or ORDER variable
    in the BREAK statement changes values and the PAGE option is specified. If you
    want the value of a GROUP or ORDER variable to repeat at the top of a page or
    if you want all rows for a group to be together on one page, you must specify
    the PAGE option in the BREAK statement. This variable, with the use of the PAGE
    option, determines the number of observations and columns that you will see on
    a page.


    The only way to truly control page breaks occurs in the PDF destination is to
    specify a paging variable. This along with the use of the PAGE option, determines
    the number of observations and columns that you will see on a page.


    Review Sections 2.11, 3.4.1, and 4.4.5 of Reporting Techniques to learn how to
    control table and page breaks occur within a table. Remember that the PDF destination,
    more than the other destinations, will attempt to keep grouped columns or grouped
    rows together on a page.


    # 5.5 PROC REPORT SPANS Option


    The SPANS option was not discussed in great detail in Reporting Techniques. That
    book focused on the options that affect the numbers and structure of the table.
    The SPANS option is designed to affect the look of the table. SPANS will have
    an impact on all of the Non-Listing ODS destinations. However, SPANS requires
    special attention when used in the PDF destination.


    The SPANS option allows a GROUP or ORDER variable to be displayed in a single
    cell. It is applied when the value of a GROUP or ORDER variable is the same for
    multiple rows. The resulting look is a merged cell.'
  merge: -1
  pgno: 100
