  md: '# Output 7.8 Three Row Heights Are Applied to the Table


    | A | B | C | D |

    |---|---|---|---|

    | 1 | | Retail Info | Cost Info |

    | 2 | Customer Country | Order Info Quantity Ordered | Total Retail Price for
    This Product | Cost Per Unit |

    | 4 Canada | 105 | $11,951.08 | $2,293.80 |

    | 5 Germany | 106 | $15,394.60 | $4,065.55 |

    | 7 South Africa | 47 | $5,149.90 | $1,250.35 |

    | 8 Turkey | 43 | $5,175.80 | $1,651.15 |

    | 10 | | | | |


    Row 10 in Output 7.8 is also assigned a height of 25. For the Excel destination,
    a PROC REPORT table also includes one blank row below the last row with data.
    Therefore, that row also assigned one of the row height values from the ABSOLUTE_ROW_HEIGHT
    subthat is applied to the table.


    Listing more than one value in the ABSOLUTE_ROW_HEIGHT suboption has little practical
    purpose for most PROC REPORT tables.


    Notice that the value from the ABSOLUTE_ROW_HEIGHT suboption is applied to the
    top header row. This suboption does not distinguish between header rows and data
    rows. Also, if a row is hidden, it assumes the row height value at that point
    in the table.


    The ODS destination for Excel also has called ROW_HEIGHTS. This suboption delineates
    between header rows and data rows, as well as the rows created by other aspects
    of the program. Table 7.1 shows the value position and the row is controlled by
    that value.


    # Table 7.1 ROW_HEIGHTS Suboption Positional Parameters


    | | | |

    |---|---|---|

    | 1 | Header |

    | 2 | Table Body |

    | 3 | BY lines |

    | 4 | Titles |

    | 5 | Footnotes |

    | 6 | Page Break |

    | 7 | Paragraph Skip |


    The ROWS. ROW_HEIGHTS suboption overrides the ABSOLUTE_ROW_HEIGHT suboption. Example
    7.9 uses both ABSOLUTE_ROW_HEIGHT and ROW_HEIGHTS. Output 7.9 shows that the heights
    of the header and data rows correspond to those specified in the ROW_HEIGHTS suboption.'
