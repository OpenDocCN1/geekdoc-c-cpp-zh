    \ */\n/* if you are using EG or SAS on Windows, specify a location where you have\n\
    access */\n&let path=c:/temp/output;\n\nThe ODS destination statements create\
    \ an output file for every style in\nwork.gallery.\nOnly 4 destinations are shown.\
