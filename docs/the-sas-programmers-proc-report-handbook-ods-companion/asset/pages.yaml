  md: "# The SAS Programmer's PROC REPORT Handbook: ODS Companion\n\nTo have complete\
    \ control of where a table breaks in the PDF destination, PROC REPORT must control\
    \ the page breaks. To accomplish this, the PAGE option must be used in a BREAK\
    \ statement. One of the columns used in the report must be an obvious paging variable\
    \ and used in the BREAK statement. Otherwise, a paging variable must be created.\n\
    \nFor definition, a LINE statement or a BREAK statement inserts a row at the appropriate\
    \ location. This will break a spanning cell. When this happens, the grouping value\
    \ that belongs in that cell will not be repeated in the second half of the cell.\n\
    \nExample 5.13 uses the SPANROWS option, which creates a merged cell for both\
    \ the CUSTOMER COUNTRY and CUSTOMER GENDER values. A BREAK statement adds a summary\
    \ row beneath CUSTOMER GENDER value. The results, shown in Output 5.13, show that\
    \ the country value is blank for the male gender sections for Australia and the\
    \ United States. The Israel section does not have the same problem because it\
    \ contains only one gender value.\n\n# Example 5.13 BREAK Statement Affects SPANROWS\n\
    \n```\nods pdf file=\"Output5-13.pdf\" notoc;\nproc report data=orders(obs=50)\
    \ spanrows\n    style(column)=[width=1.5in]\n    style(header)=[backgroundcolor=#FDC689];\n\
    \n    column (\"Customer Info\" customer_country customer_gender customer_age_group)\n\
    \          (\"Order Info\" order_type quantity);\n\n    define customer_country\
    \ format=$cntry.\n    style(column)=[verticalalign=m];\n    define customer_gender\
    \ / group;\n    define customer_age_group / group;\n    define order_type / group\
    \ format=typef;\n```\n\n```\nbreak after customer_gender / summarize;\nods pdf\
    \ close;\n```"
