    # 7.2.6 Customized REPORT Summary Row


    Many PROC REPORT tables require customized text in summary rows. The text can
    range from simple text "Total" to "Total for Australia Sales in 2017.\ The biggest
    factor in adding customized text is whether the variable that creates column is
    character or numeric.


    For character variables, the length of the variable is the only factor to consider
    when adding customized text. The length must be long enough to hold the customized
    text. If the text is longer than length of the variable, the length must be changed.
    The length cannot be changed within PROC REPORT. A DATA step with a LENGTH statement
    must be included above the PROC REPORT step. The alternative is to create a character
    variable. The appropriate length can be set in the COMP statement, and the value
    of the original is assigned to the new computed variable.


    For example, the variable CUSTOM_COUNTRY is used throughout this book. The actual
    length is $2 because it holds the country abbreviation. Adding customized text
    to CUSTOM_COUNTRY would require changing the length of that variable or creating
    a new variable with the appropriate length.


    Numeric variables are not as easy to handle as character variables. The strategy
    for adding customized text depends on the destination used to generate the output.
    For the PDF, RTF, and HTML destinations, the PRETEXT= attribute can be used to
    add text to the summary rows for numeric variables. This includes the HTML-based
    destinations that generated output for Excel: HTML, MOffice2K, and MOffice2K_X.
    The ODS destination for Excel does not honor the PRETEXT= attribute within a cell
    for numeric variables.'
