  md: 'The examples in this chapter have limited the number of observations from the
    data set. Also, these examples do not have titles or footnotes. Hopefully, this
    demonstrates that even when using a small number of observations without titles
    or footnotes, and without a slide number, it is difficult to prevent a table from
    wrapping to a second or third slide. Even more adjustments might be required to
    fit tables on slides when multiple titles are used. Often, because company logos
    are placed on slides, they must be taken into account when altering tales to fit
    on slides.


    Trial and error is required to get tables to fit into a presentation and in a
    pleasing manner. Changes such as removing header rows or breaking the table apart
    are techniques that help achieve the desired appearance. This presentation is
    different. Remember to set and maintain reasonable expectations.


    The ODS destination for PowerPoint also allows the use of ODS LAYOUT. ODS LAYOUT
    allows multiple objects such as tables and graphs to be placed on a single slide.
    If a table does not fit inside a layout container, it will be suppressed. Keeping
    a table small and compact is vital when placing it inside a layout container for
    PowerPoint.


    # 9.5 Inline Formatting Functions


    PROC REPORT often contain extra formatting techniques (such as colors, images,
    dollar signs, and Unicode values) to enhance the display of information. Trafficlighting
    and numeric formatting work the same way in the PowerPoint destination as they
    do in all other destinations for PROC REPORT. Images require a specific image
    attribute, which is discussed in Section 9.6.


    Inline formatting is a popular way of adding features to the report, but not all
    functions are supported for the destination. The PowerPoint destination supports
    these inline functions:


    +   - dagger

    - nbspace

    - newline

    - sigma

    - style

    - sub

    - super

    - unicode


    This list covers most of the needs of PROC REPORT destination. However, it is
    important to note the inline functions that are not supported by the destination.
    Most of the functions that are generally used outside tables and are more likely
    found in TITLE and FOOTNOTE statements. Also, some of the functions are specific
    to other ODS destinations. The PowerPoint destination does not support these functions:


    +   - date

    - dest

    - lastpage

    - leaders'
