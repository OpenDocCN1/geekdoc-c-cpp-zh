    # 7.7 Key Takeaways


    Microsoft Excel can render files generated by multiple ODS destinations. This
    chapter discussed strategies for using new variables and style attribute changes
    for getting the report to look as desired in Excel. The key takeaways from this
    chapter are the following:


    +   - The ODS destination for Excel generates native Excel files that can contain
    images and have multiple worksheets.

