    The PAGE option was used in the BREAK statement in Example 9.11. The PAGE option
    can also be used in the DEFINE statement. The PAGE option used in the DEFINE statement
    causes a vertical page break. In other words, it divides sets of columns into
    smaller, tables. The PAGE option in the DEFINE statement is extremely useful for
    wide tables.


    The PAGE option in the DEFINE statement is a good strategy for dividing columns
