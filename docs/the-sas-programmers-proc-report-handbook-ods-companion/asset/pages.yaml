    # ## 3.1 Introduction


    Style elements within a style template affect different parts of a PROC REPORT
    table. PROC REPORT uses five main style elements. Each ODS destination uses these
    elements in its own way. This chapter demonstrates how to modify attributes within
    the style elements and how to determine the effect on the table for each of the
    main ODS destinations.


    Making changes to a style with PROC TEMPLATE is an effective way of creating output
    with the desired look and feel. This chapter demonstrates that report plays a
    vital role in the template style changes. Also, a separate template might be needed
    for each destination.'
