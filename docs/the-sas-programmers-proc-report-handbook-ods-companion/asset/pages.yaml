    # 4.7.4 CALL DEFINE STATEMENT


    Section 4.4.2 demonstrated how to apply colors (trafficlighting) via the STYLE=
    on that particular column. The DEFINE statement can control the colors only for
    that particular column. Trafficlighting can also be assigned to a call column
    based on the value of another column. In this situation, the color must be assigned
    with a CALL DEFINE statement in a compute block. It is important to pay attention
    to which variable is placed in the COMPUTE statement and which column is referenced
    as the first argument in the CALL DEFINE statement. You must make sure that you
    are not referencing a report item that is to the right of the one in the COMPUTE
    statement.


    CALL DEFINE statements can be used to do more than set the background color in
    just one column. They can be used to change multiple columns, to change multiple
    attributes, or to assign an attribute to an entire row.


    CUSTOMER_GROUP has three values, and one value contains the value “Gold.” Example
