  md: "# Excel Destinations 139\n\nof SAS 9.4 TAS1M5, the FRAME= RULES= attributes\
    \ that are often used with PROC REPORT style overrides are not supported by the\
    \ ODS destination for Excel.\n\nYou must use PROC TEMPLATE to generate a new style\
    \ that will insert these borders. You must also use PROC TEMPLATE when changing\
    \ the border color to border styles that already include the Excel gray lines,\
    \ and for style templates that do not produce borders of any kind.\n\nStyles.Ocean\
    \ does not produce any gray lines or borders. Example 7.14 changes the BORDER=\
    \ attribute for template that so borders are included in the output, Output 7.14.\n\
    \n# Example 7.14 Add All Borders to theTable\n\n```\nods path(prepend) work.templat(update);\n\
    proc template;\ndefine style styles._borders;\nparent=styles.ocean;\n  class data,\
    \ header, table, dataemphasis, linecontent /\n  borderstyle=solid;\nend;\nrun;\n\
    \nods excel file=\"Output7-14.xlsx\" style=_borders;\nproc report data=orders(obs=20)\n\
    \  style(report)=[ppretext='this is pretext']\n  style(column)=[width=1.5in];\n\
    \n  column (\"Customer Info\" customer_country customer_age_group\n         (\"\
    Order Info\" order_type quantity);\n\ndefine customer_country / group format=$cntry;\n\
    define customer_age_group / group;\ndefine order_type / group format=typef.;\n\
    \n  compute before customer_country;\n    line 'a line statement for ' customer_country\
    \ $cntry;\n  endcomp;\n  compute after;\n    line 'this is a line statement';\n\
    \  endcomp;\n  break after customer_country / summarize;\nbreak after / summarize;\n\
    run;\n excel close;\n```"
