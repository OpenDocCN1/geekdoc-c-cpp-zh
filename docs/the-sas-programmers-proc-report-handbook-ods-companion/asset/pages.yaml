    # 8.4 Hyperlinks


    One advantage of the HTML destinations over the other destinations is hyperlinks.
    HTML destinations allow separate words within a cell to be their own hyperlinks.
    This makes HTML a good choice for drilldown-style reports. Chapter 6 of Report
    Techniques has an entire section on applying the URL style attribute to create
    hyperlinks to a single location and multiple files. Therefore, this section concentrates
    on what makes the HTML destinations different.'
