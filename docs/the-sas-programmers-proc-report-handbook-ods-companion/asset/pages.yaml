    | 171 | Robert Bowerman | M | 33 |

    | 52 | Yan Kozlowski | M | 38 |


    The continued text does not have to be included in Tagsets.RTF output. The text
    can be removed in two ways. First, you could use the CONTINUE_TAG suboption. Or
    you could make a change to the style template used by Tagsets.RTF.


    Example 6.2 demonstrates using the CONTINUE_TAG suboption to remove the text.
    The suboption is placed within the OPTIONS option in the ODS TAGSETS.RTF statement.
    Output 6.2 shows the bottom of the page where the text is no longer present.'
