    # 7.6 Date Values


    Various date and datetime frames can be passed to Microsoft Excel so that they
    are displayed as desired. However, Excel does not necessarily categorize them
    as dates or times. For a value to be treated as a true Excel date, it must be
    specified in an ISO date format. This requires converting SAS date values to SAS
    datetime values and passing a type and format to Excel.


    Example 7.33 uses the ORDER_DATE variable, which is a SAS date variable with the
    DATE9 format applied. In the compute block, the DATE variable is created as a
    datetime variable. The DEFINE statement for DATE assigns the IS8601DT format.
    Using the TAGATTR attribute, the type and format are passed to Excel. In this
    example, the type is Datetime and Even though the type is datetime, only the date
    portion will be displayed in Excel.


    Output 7.31 shows how Excel categorizes the ORDER_DATE variable, which is a regular
    SAS date variable. Output 7.32 shows how Excel categorizes the NEW DATE variable,
    which was created as a datetime variable with the IS8601DT format.


    Example 7.33 Pass the Excel Datetime Format in the Destination


    ```

    ods excel file=Output7-34.xlsx;

    proc report data=orders(obs=5);

    column order_date date;

    define order_date date / ;

    define date / computed format=IS8601DT. style=(tagattr=''TYPE:DateTime

    format:mm/dd/yy;@'');

    compute date;

    date date = dhms(order_date,0,0,0);

    endcomp;

    run;

    ods excel close;

    ```


    run;

    ods excel close;


    Excel puts the ORDER_DATE variable in the "General" category.'
