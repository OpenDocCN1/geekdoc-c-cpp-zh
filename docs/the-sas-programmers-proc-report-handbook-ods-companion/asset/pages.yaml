  md: "# The SAS Programmer PROC REPORT Handbook ODS Companion\n\nTagsets.SASReport\
    \ is the default destination for Enterprise Guide. In Enterprise Guide, the tab\
    \ for this output is labeled '- SAS Report'. Notice that in Output 3.1.7, the\
    \ background for the entire page is gray. Also, the preset color is navy.\n\n\
    In general, the output is in all seven destinations. However, even with this plasplaint,\
    \ the output is slightly different depending on the destination. This emphasizes\
    \ the importance of developing a custom style template that is based on the destination\
    \ for the PROC REPORT output. As each style element is explored, the differences\
    \ among the destinations will become more apparent.\n\n# 3.5 Header Style Element\
    \ Changes\n\nThe header style element is fairly straightforward. Attributes within\
    \ this element are applied to only the header section of the table. This includes\
    \ any spanning headers created in the COLUMN statement. Attributes for spanning\
    \ headers cannot be controlled separately from column headers with a style template.\
    \ In Example 3.2, attributes that control the text, borders, and spacing are assigned\
    \ to demonstrate the portion of the table that is affected by the Header element.\n\
    \nExample 3.2 Assigning Attributes in the Header Element\n\n```\nproc template;\n\
    \  define style table /\n    fontfamily='Thorndale AMT'\n    color=black;\n  style\
    \ data /\n    fontfamily='Thorndale AMT'\n    color=black;\n  style header /\n\
    \    fontfamily='Albany AMT'\n    color=#264666\n    fontWeight=bold\n    fontstyle=italic\n\
    \    backgroundColor=#F0F0F0\n    borderwidth=2pt #F09F2F\n    borderstyle=solid\n\
    \    borders=5pt;\n  style dataemphasis /\n    fontfamily='Thorndale AMT'\n  \
    \  color=black;\n  style linecontent /\n    fontfamily='Thorndale AMT'\n    color=black;\n\
    end;\nrun;\n```\n\n+   Assign four attributes specific to the text within the\
    \ Header style element, along with background, border, and spacing attributes.\
    \ All other style elements specify a different font family and foreground color."
  merge: -1
  pgno: 39
