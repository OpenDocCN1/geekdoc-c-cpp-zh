- img_proc: true
  md: '18 The Programmer''s PROC REPORT Handbook: ODS Companion


    # 3.2 Style Elements Used by PROC REPORT


    The documentation states that PROC REPORT uses the following style elements, shown
    in Table 3.1, from the style template when creating the table.


    Table 3.1: Style Elements Used by PROC REPORT


    | Table | Report as a whole |

    | Data | Column cells |

    | Header | Column headings |

    | LineContent(9.4); NoteContent(9.3 and earlier) | LINE statements |

    | DataEmphasis | Summary lines |


    Each part of the PROC REPORT is explained and examined later in the chapter.


    Please note that PROC REPORT uses the Byline element when appropriate. The SystemTitle
    and SystemFooter elements also play a role in any output that is generated but
    they are not specific to PROC REPORT so they are not covered here.


    Theoretically, the preceding style elements control every aspect of a PROC REPORT
    table. However, it is important to note that every output type ODS creates is
    unique, and each ODS destination uses the elements as needed to create that file.
    Therefore, changing one attribute within a style element might affect each destination
    differently. In some cases, it might not affect the destination at all. The only
    way to determine whether a style element controls a section of a report in a specific
    destination is to test it and view the result.


    Also, due to this behavior, a different style template might need to be created
    for each destination to which the PROC REPORT output will be sent. The PDF and
    RTF destinations might be able to share a style template, but ODS HTML should
    have its own template, as any of the Excel destinations.


    # 3.3 Setup for Chapter Examples


    The examples in this chapter show how to create a new style template that does
    not inherit directly from a parent template. The purpose is to demonstrate which
    elements affect destinations. The best way to prevent inheritance is to remove
    any competing elements and attributes that might be part of a parent template.
    Recall from the last chapter that a style template that does not have a parent
    will inherit from Base.Template.


    The templates created in the examples will start with the five elements listed
    in Table 3.1, and then others that might also impact the table will be explored.
    The examples start with the style elements whose effects in the resulting table
    are easiest to understand. The complexity of the examples increases and includes
    the style elements that are harder to understand and whose behavior is more unpredictable.'
  merge: -1
