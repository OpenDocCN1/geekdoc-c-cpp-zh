- img_proc: true
  md: '# 7.1 Introduction


    Many PROC REPORT tables are viewed within Microsoft Excel, Excel is a widely used
    tool across companies and industries. SAS supports multiple destinations that
    create files for Excel to recognize and render, including the following:


    +   - ODS destination for Excel

    - Tagsets.ExcelXP

    - HTML

    - MSOOffice2K

    - MSOOffice2K_X*

    - CSV


    *This tagset is not shipped with Base SAS. It must be downloaded from http://support.sas.com/md/base/ods/odsmarkup/index.html.

    Each destination has strengths and weaknesses. The CSV destination creates files
    viewed by Excel, but it is in its own category because it is mostly used to create
    a file of raw data values. The other destinations are used to create formatted
    output and to use code for more capabilities of PROC REPORT. From the preceding
    list, destinations seem to be seen more than the others: MSOOffice2K and Tagsets.ExcelXP.
    The ODS destination for Excel is new to SAS 9.4 TS1m3 and is quickly gaining traction.


    This chapter contains a section for each of the destinations with the exception
    of HMTL, MSOOffice2K, MSOOffice2K_X, which are grouped together in a section.
    Each destination creates files for Excel differently than the other, and each
    destination has its own options and suboptions that affect PROC REPORT tables.
    The chapter explores settings for column width and row height, as well as code
    for handling rows, manipulating borders, and adding custom text.


    # 7.2 ODS Destination for Excel


    The ODS destination for Excel is the first ODS destination to create native Excel
    files (.XLSX) from SAS. It creates Microsoft Open XML format files. The destination
    is documented in the SAS 9.4 Output Delivery System: User’s Guide and works similarly
    to the other ODS destinations discussed in previous chapters.


    The ODS destination for Excel builds on the functionality of the other destinations
    that can create files by Excel. It combines the features of the Tagsets.ExcelXP
    and MSOOffice2K destinations by allowing graphics and creating multi-sheet workbooks.
    This destination will receive the bulk of developmental enhancements moving forward.


    One advantage of the Excel destination is that it automatically maps SAS formats
    to Microsoft Excel formats, which alleviates many of the display problems compared
    to the other destinations that create files for Excel. The files created by the
    ODS destination for Excel are smaller than those generated by other destinations.
    Unlike Tagsets.ExcelXP, the O destination for Excel cannot be modified through
    PROC TEMPLATE code. The ODS destination for Excel creates a new file each time.
    It does not have the ability to write to an existing file.'
  merge: -1
  pgno: 141
- img_proc: true
  md: "This section focuses on the Excel destination and how PROC REPORT code can\
    \ be altered to work with this destination.\n\n# 7.2.1 Column Widths\n\nThe width\
    \ of a column is critical for improving readability. In general, ODS destinations\
    \ set the width of a column based on the value, and the label. Each destination\
    \ does its own calculation to determine the width based on font sizes, cellpadding,\
    \ the number of other columns, and so on. The WIDTH= attribute is used in many\
    \ PROC REPORT steps to manually provide a column width. When a destination encounters\
    \ the WIDTH= override, it uses that value and adjusts all the necessary calculations.\n\
    \nThe ODS destination for Excel will have WIDTH= attribute. It also has the ABSOLUTE_COLUMN_WIDTH\
    \ suboption to assign a column width. One value can be assigned to all columns\
    \ or a list can be used to assign a width for multiple columns. This section looks\
    \ at the WIDTH=attribute, the ABSOLUTE_COLUMN_WIDTH suboption, and the interaction\
    \ between the two.\n\nExample 7.1 uses the WIDTH= attribute to set all columns\
    \ in the table to a specific width. Output 7.1 shows that all columns of the output\
    \ are equally wide.\n\nExample 7.1 Use WIDTH= to Set the Width for All Columns\n\
    \n```\nods excel file=\"Output7-1.xlsx\";nproc report data=orders\n  style(header)=[background=#8E2F8A\
    \ color=white]\n  style(column)=[width=50mm];\n  column customer_country ('Order\
    \ Info' quantity) ('Retail Info' total_retail_price) ('Cost Info' costprice_per_unit);\n\
    \  define customer_country / group format=$cntry;\nods close;\n```\n\nOutput 7.1\
    \ All Columns Have the Same Width\n\n| A | B | C | D |\n|---|---|---|---||\n|\
    \ | Order Info | Retail | | |\n Total Retail Price for This | Cost Width |\n|\
    \ 2 | Customer Country | Quantity Ordered | Product | 210 | $17,321.49 $4,951.35\
    \ |\n| 3 | Australia | | 105 | $11,951.08 | $2,293.80 |\n| 4 | Canada | | 106\
    \ | $15,394.60 | $4,066.85 |\n| 5 | Germany | | 28 | $1,559.90 | $5,516.95 |\n\
    | 6 | Italy | | 47 | $5,149.80 | $1,250.35 |\n| 7 | South Africa | | 43 | $5,175.80\
    \ | $1,836.15 |\n| 8 | Turkey | | 39 | $43,525.10 | $11,171.98 |"
  merge: -1
  pgno: 142
- img_proc: true
  md: "Example 7.2 adds an override to the DEFINITE statement for CUSTOMER COUNTRY.\
    \ This column will be twice as wide as the other columns. Output 7.2 shows the\
    \ resulting table.\n\n# Example 7.2 Apply Multiple Width= Style Attributes\n\n\
    ```\nods excel file='Output-7.2.xlsx';\nproc report data=orders\n  style(header)=[backgroundColor=#82F8A]\n\
    \  style(column)=[width=50mm]\n  column customer_country ('Order Info' quantity)\
    \ ('Retail Info'\n  total_price) ('Cost Info' costprice_per_unit)\n  define customer_country\
    \ / group format=$cnty. style(column)=[width=100mm]\nrun;\\ods excel close;\n\
    ```\n\n# Output 7.2 Customer Country Is Wider than the Others\n\n| | | Order Info\
    \ | Retail Info | Cost Info |\n|---|---|---|---|---|n| | Customer Country | Quantity\
    \ | Type Price Suc Th | Cost Per Unit |\n| 3 Australia | | 210 | $17,521.49 |\
    \ $4,851.95 |\n| 5 Sweden | | 115 | $15,617.96 | $5,205.99 |\n| 5 Germany | |\
    \ 106 | $15,294.60 | $5,065.55 |\n| 6 Italy | | 28 | $15,133.50 | |\n| 7 South\
    \ Africa | | 46 | $6,149.90 | $1,260.38 |\n| 8 Turkey | | 40 | $5,118.60 | $1,668.15\
    \ |\n| 9 United States | | 943 | $825.10 | $1,711.98 |\n\n**The ABSOLUTE.WIDTH\
    \ suboption plays a key role in sizing the width of a table within pages.** This\
    \ option is useful when the column should be a consistent size, regardless of\
    \ the data. Without this setting, the width of the column depends on the data\
    \ values or a width specification within the procedure.\n\n**ABSOLUTE_WIDTH is\
    \ one of the last features applied to the column.** It always wins, meaning that\
    \ a column width setting within the procedure will be overridden by ABSOLUTE_COLUMN_WIDTH.\
    \ Example 7.3 demonstrates how to apply a width of 25 to all columns with the\
    \ ABSOLUTE_WIDTH suboption. The results. Notice that all columns are the same\
    \ width, but they are not the same as shown in Output 7.2. The WIDTH= attribute\
    \ within PROC REPORT is overridden by the ABSOLUTE_COLUMN_WIDTH value.\n\n# Example\
    \ 7.3 Apply ABSOLUTE_COLUMN_WIDTH Subposition\n\n```\nods excel file='Output-7.3.xlsx';\n\
    options (absolute_column_width='25');\nproc report data=orders\n  style(header)=[backgroundColor=#82F8A]\n\
    \  style(column)=[width=50mm]\n  column customer_country ('Order Info' quantity)\
    \ ('Retail Info'\n  total_price) ('Cost Info' costprice_per_unit)\n  define customer_country\
    \ / group format=$cnty. style(column)=[width=100mm]\nrun;\\ods excel close;\n\
    ```"
