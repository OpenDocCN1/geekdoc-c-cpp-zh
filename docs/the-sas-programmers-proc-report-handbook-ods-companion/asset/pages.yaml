  md: '# 120 The SAS Programmer PROC REPORT Handbook: ODS Companion


    The RTF destination does not produce the same results as Output 6.22. A GROUP
    or ORDER value will not be repeated at the top of page 2. In some instances, the
    RTF destination will not break the table at the same row as the Tagsets.RTF destination.
    Microsoft Word will try to keep all the grouped rows together, so it will start
    on the next page instead of breaking the group in the middle of the rows. If Example
    6.22 was set to RTF, all of the South Africa would appear together on one page.
    They would appear on either page 1 or page 2 depending on the margins.


    For the RTF destination, PROC REPORT must control the page breaks to force a GROUP
    or ORDER value to be printed at the top of each page. To accomplish this, the
    PAGE option must be USED in a BREAK statement. One of the columns in the report
    might find an obvious paging variable, which can be used in the BREAK statement.
    Otherwise, a paging variable must be created, just like the variable shown in
    Example 6.12.


    The SPANROWS option has more capabilities when Tagsets.RTF with RTF. However,
    the option has one drawback with Tagsets.RTF. A LINE statement or a BREAK statement
    inserts a row. This will break apart spanning cell. When this happens, the grouping
    value that belongs in that cell will not be repeated in the second half of the
    cell.


    Example 6.23 uses the SPANROWS option, which creates a merged cell for both the
    CUSTOM COUNTRY and CUSTOM GENDER values. A BREAK statement adds a summary row
    below each CUSTOM GENDER value. The results in Output 6.23 show that the country
    value is blank for the male gender sections for Australia and the United States.
    The Israel section does not have the problem because it has only one gender value.


    # Example 6.23 BREAK Statement Effects SPANROWS


    ```

    ods tagsets.rtf file="Output6-23.rtf";nproc report data=orders(obs=50) spanrows

    style(column)=[width=1.5in]

    style(header)=[backgroundcolor=#6EC6F0]


    column="Customer Info" country_customer_gender customer_age_group

    ("Order Info" order_type quantity);


    define customer_country / group format=$cntry;

    style(column)=[verticalalign=m]

    define customer_gender / group;

    define customer_age_group / group;

    define order_type / group format=typef;


    break after customer_gender / summarize;\ods tagsets.rtf close;

    ```'
