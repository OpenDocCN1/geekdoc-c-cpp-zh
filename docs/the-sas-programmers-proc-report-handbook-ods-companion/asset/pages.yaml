  md: "# ODS Destination for PowerPoint 187\n\nThe ODS destination for PowerPoint\
    \ substitutes the SAS fonts Albany AMT, Cumberland AMT, and Thorndale AMT fonts\
    \ for the Windows Arial, Courier New, and New Times Roman, respectively.\n\n#\
    \ 9.4 Effects of Tables with Large Amounts of Data\n\nThe most difficult aspect\
    \ of learning to develop PROC REPORT code for the PowerPoint destination is deailing\
    \ with the change in scale. Again, PowerPoint presentations are meant to be viewed\
    \ on a large screen. Although not designed for printing, they are often printed\
    \ out as a convenience for later reading. An amount of data that can fit on one\
    \ slide is nearly the amount of data that can fit on one page in a PDF document.\
    \ This section discusses PROC REPORT techniques that you can use to get a table\
    \ to fit well in PowerPoint.\n\n# 9.4.1 Many Columns of Data\n\nThe table in Outputs\
    \ 9.1 and 9.2 has one row of pretext data, two header rows, and eleven rows of\
    \ data. The table also contains four columns. The table occupies the entire slide,\
    \ from top to bottom. The 11 rows of data just barely fit on the slide to define\
    \ the font size, spacing, and other attributes of the table. The entire table\
    \ that was used in previous chapters, like Chapter 3, did not fit on one. The\
    \ RBREAK summary row along with the FINAL LINE statement had to be removed in\
    \ order to get the table to fit on one slide. Even fewer rows of data would fit\
    \ on the slide if the code had a title or footnote. Including the RBREAK and LINE\
    \ forces the last row of data and the last row of text to flow to a second slide.\
    \ Adding both a title and statement\n\nIn addition, Examples 9.1 and 9.2 do not\
    \ specify any column widths for the data. The destination determines the width\
    \ of the columns based on the formatted values of the variables with the length\
    \ of the header text. For this table, none of the headers or data wrapped within\
    \ their cells have enough space on the slide.\n\nExample 9.7 includes a fifth\
    \ column, TOTAL_PRICE. The goal of this example is to demonstrate how adding another\
    \ column of data changes how the table fits on the slide. First, as shown in Output\
    \ 9.7, the table extends to a second slide. Second, all of the headers wrap within\
    \ their cells, The values of the ORDER TYPE wrap within their cells. Output 9.7\
    \ highlights the ORDER_TYPE column and the new column, TOTAL_PRICE.\n\n# Example\
    \ 9.7 Adding Another Column to the Table\n\n```\ntitle:\nods powerfile=\"Output-9-7.pptx\"\
    \nproc report data=orders(obs=20)\n\tstyle(report)=[pretext='this is pretext']\n\
    the header=(backgroundColor=#F0F0F0)\n\tcolumn(\"Customer Info\" customer_country\
    \ customer_age_group)\n\t(\"Order Info\" order_type total_retail_price);\nndefine\
    \ customer_country / group format=$scntry;\ndefine customer_age_group / group;\n\
    define order_type / group format=type. style (header\n\tcolumn)=[backgroundColor=#CCDF9C];\n\
    define total_retail_price / style (header)=[backgroundColor=#68C9D2];\n```"
  merge: -1
