    # 5.2 Style Templates with ODS PDF


    The PDF definition is robust when using style templates. It generally behaves
    the ways programmers expect it to. However, SAS created a number of style templates
    specifically for the Printer family destinations, which includes PDF. They are
    designed to work best with PDF and Adobe Acrobat. These templates should be used
    in the STYLE= option in the ODS PDF statement or as the parent within PROC TEMPLATE.
    The styles for PDF are:


    +   * FancyPrinter

    * FestivalPrinter

    * GrayscalePrinter

    * MeadowPrinter

    * MonoChromePrinter

    * Monospace

    * NormalPrinter

    * Pearl

    * Printer

    * Sapphire

    * SasDocPrinter

    * SeasidePrinter


    Again, other style templates can be used with PDF but they might cause unexpected
    and unwanted spacing and table alignment issues.


    Beginning with SAS 9.4, the default style template for the PDF destination is
    Styles.Pearl. Example 5.1 uses this template, with the results shown in Output
    5.1.


    # Example 5.1 Use Styles.Pearl Template


    ```

    ods pdf file="Output5-1.pdf" notoc;

    proc report data=orders(obs=20)

    style(report)=[pretext=''this is pretext'']

    style(column)=[width=1.5in];


    column("Customer Info" customer_country customer_age_group)

    ("Order Info" order_type quantity);


    define customer_country / group format=$cntryndefine customer_age_group / group;

    define order_type / group format=typef.;


    compute before customer_country;

    line ''a line statement for '' customer_country $cntry;

    ```'
