    +   The CLASS statement creates a element from a style element that has the same
    name. One or more style elements can be listed in the CLASS statement.


    +   THE STYLE statement creates or modifies one or more elements.


    +   In the CLASS or STYLE statement, after the forward slash (/), set the values
    for all desired attributes. Each attribute name followed by an equal sign (=)
    and the desired value. Depending on the attribute, its value might not require
    quotation marks.\ It is a best practice to specify a unit of measure for any attribute,
    such as BORDERWIDTH and FONTSIZE, HTML handles values that do not have a unit
    of better than other destinations because it uses a relative length rather the
    specific size that was requested. The other destinations calculate behind the
    scenes to determine what is the best fit. The results of the calculation might
    not be expected or desired.


    The semicolon follows all the attribute name and value pairs.


    +   The DEFINE STYLE statement actually begins an end statement block. An END
    statement is needed to finish the DEFINE STYLE block. Failure to include an END
    statement will result in an error:


    ```

    ERROR: Parse environments were left open. You might be missing an END statement.

    ```'
