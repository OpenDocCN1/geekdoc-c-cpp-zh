    The STYLE= option in the COMPUTE statement affects the attributes for the LINE
    statement within compute block. The attributes within the option are not applied
    to any other statements or cells that are controlled by that compute block. the
    attributes will be applied to all the LINE statements within that block. Style
    attributes for multiple LINE statements from the same compute block cannot be
    controlled separately.


    The location is omitted from the STYLE= option in the COMPUTE statement. It is
    redundant for this statement because the option can affect LINE statements only.
    The common attribute order includes font color and size, justification, background
    color, and borders. The justification attribute is important because ODS destinations,
    other than Listing, do not honor pointer controls, as does @1, to place the text.


