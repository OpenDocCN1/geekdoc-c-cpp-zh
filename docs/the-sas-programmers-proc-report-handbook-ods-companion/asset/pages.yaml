  md: "146 The SAS Programmer's PROC REPORT Handbook ODS Companion\n\n# 7.2.9 PROC\
    \ REPORT-Triggered Worksheets\n\nThe default behavior for the destination is to\
    \ place each table in its own worksheet. Be aware that the distinction between\
    \ a table and a procedure is very important, especially for PROC REPORT. By default,\
    \ PROC REPORT creates only one table, the output from the procedure would create\
    \ only one worksheet. However, using the PAGE option in a BREAK or DEFINE statement\
    \ generates multiple tables. Each table creates its own worksheet by default.\n\
    \nThe code in Example 7.20 uses the PAGE option with the break variable CUSTOMER_COUNTRY.\
    \ The result, shown in Output 7.20.1 and 7.20.2, are a workbook with seven worksheets,\
    \ one for each country.\n\n# Example 7.20 Use the PAGE Option in the BREAK Statement\n\
    \n```\nods excel file=\"Output7-20.xlsx\"\nproc report data=orders\n  style[header]=[backgroundColor=#E7ACC6\
    \ color=black];\n  column customer_country customer_group customer_age_group quantity\n\
    \    total_retail_price;\n  define customer_country / group format=$cntry.;\n\
    \  define customer_group / group;\n  define customer_age_group / group;\n    break\
    \ after customer_country / page;\nrun;\nods excel close;\n```\n\nExample 7.20.1\
    \ Sheet 1 of 7 Generated by the PAGE Option in the DEFINE Statement\n\n| A | B\
    \ |\n|---|---|\n| Customer Country | Customer Group Name |\n| Australia | Internet/Catalog\
    \ Customers |\n| 3 | Orion Gold members |\n| 4 | |\n| 5 | Orion Club members |\n\
    | 6 | |\n| Report 1 - Detailed and-or s | Report 2 - Detailed and-or s |"
  merge: -1
