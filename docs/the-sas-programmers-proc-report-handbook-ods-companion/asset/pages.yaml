    # 6.5 Tagsets.RTF Options That Affect PROC REPORT


    This chapter has looked at the general differences between the RTF and Tagsets.RTF.
    It explored how style affects Tagsets.RTF output differently than RTF output.
    The last section discussed borders and how they are placed differently in the
    two destinations. This section focuses on Tagsets.RTF and its options. The Tagsets.RTF
    destination contains options that RTF lacks. Some of these options affect PROC
    REPORT. This section demonstrates those options.


    # 6.5.1 TABLEROWS


    One TAGETS.RTF statement option that has an immediate impact on PROC REPORT tables
    is TABLEROWS. Usually, a page break occurs for one of reasons: the table reaches
    the end of the page and must be written to a second page or PROC REPORT inserts
    a page break with the PAGE option. The TABLEROWS option provides a third method
    for inserting a page break in Tagsets.RTF. The TABLEROWS offers the ability to
    specify the number of rows that should be printed on a page. Once that number
    has been reached, a page break is inserted.'
  merge: -1
  pgno: 125
