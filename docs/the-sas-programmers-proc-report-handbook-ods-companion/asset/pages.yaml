  md: "# The SAS Programmer's PROC REPORT Handbook: ODS Companion\n\nThe ODS destination\
    \ for Excel has a mechanism for controlling row height. Row heights for all rows\
    \ can be specified with the ABSOLUTE_ROW_HEIGHT suboption. Example 7.7 assigns\
    \ a height of 25 for all rows. The resulting output is shown in Output 7.7.1.\n\
    \nExample 7.7 Specify One Value for the ABSOLUTE_ROW_HEIGHT Suboption\n\n```\n\
    ods excel file=\"Output7-7.xlsx\"\n  options (absolute_row_height='25');\nproc\
    \ report data=orders\n  style(header)=[backgroundcolor=#F58220 color=black];\n\
    \  column customer_country ('Order Info' quantity) ('Retail Info'\n      total_retail_price)\
    \ ('Cost Info' costprice_per_unit);\n  define customer_country / group format=$cntry;\n\
    ods close;\n```\n\nOutput 7.7.1 All Rows Are the Same Height\n\n| | Order Info\
    \ | Cost Info |\n|---|---|---|---|---|n| 1 | Customer Country | Quantity Ordered\
    \ | Total Retail Price for This Product | Cost Per Unit |\n| 2 | Australia | 210\
    \ | $17,321.49 | $4,851.35 |\n| 3 | Canada | 105 | $11,951.08 | $2,293.90 |\n\
    | 4 | Germany | 106 | $15,394.60 | $4,065.55 |\n| 5 | Israel | 28 | $1,555.50\
    \ | $516.95 |\n| 6 | South Africa | 47 | $5,149.90 | $1,250.35 |\n| 7 | Turkey\
    \ | 43 | $5,175.80 | $1,656.15 |\n| 8 | United States | 539 | $43,525.10 | $11,171.98\
    \ |\n\nThe value specified by ABSOLUTE_ROW_HEIGHT is the value that you see when\
    \ right-click the column and select Row Height. It is not the pixel value that\
    \ you might see by manually increasing the row size. 7.7.2 shows how to view the\
    \ row height in Excel after setting ABSOLUTE_ROW_HEIGHT. Starting in SAS 9.4 TS1M4,\
    \ the ABSOLUTE_ROW_HEIGHT suboption will accept a unit of measure, if pixel is\
    \ specified that the width will be displayed in pixels."
  merge: -1
  pgno: 147
- img_proc: true
  md: "# Excel Destinations 133\n\n# Output 7.7.2 View the Row Height Setting in Excel\n\
    \n| A | B | C | D |\n|---|---|---|---|\n| 1 | Order Info | Retail Info | Cost\
    \ info |\n| 2 | Customer Country | Quantity Ordered | Total Retail Price for This\
    \ Product | Cost Price Per Unit |\n| 3 | Australia | 210 | $17,321.49 | $4,851.35\
    \ |\n| 4 | Canada | 105 | $11,951.08 | $2,293.80 |\n| 5 | Germany | 106 | $15,394.60\
    \ | $4,065.55 |\n| 6 | Israel | 28 | $1,559.50 | $516.95 |\n| 7 | | 47 | $5,149.90\
    \ | $1,250.35 |\n| 8 | Turkey | 43 | $5,175.80 | $1,656.15 |\n| 9 | United States\
    \ | 539 | $43,525.10 | $11,171.98 |\n\nProviding one value in the ABSOLUTE_ROW_HEIGHT\
    \ subjection forces the destination to apply that to all rows. The subjection\
    \ allows more than one value. When multiple values are specified, the first value\
    \ is applied to the first row, the second value is applied to the second row,\
    \ and so on. The pattern continues for the number of values specified. If there\
    \ are more rows than specified values, the pattern starts over. For example, if\
    \ three values are specified, every third row is assigned the first specified\
    \ height.\n\nAlso, a value of zero in the ABSOLUTE_ROW_HEIGHT subjection can be\
    \ used to set the height back to the default. The default row height is based\
    \ on calculations that are performed behind the scenes and account for the data\
    \ in each cell within a row.\n\nExample 7.8 lists three values in the ABSOLUTE_ROW_HEIGHT\
    \ subjection. In Output 7.8, the first row has a height of 25, the second row\
    \ has a height of 10, and the third row reverts to the default height. Row 4 goes\
    \ back to the beginning of the list, which has a height of 25.\n\nExample 7.8\
    \ Specify Multiple Values for the ABSOLUTE_ROW_HEIGHT Subjection\n\n```\nods file=\"\
    Output-7.8.xlsx\"\noptions(absolute_row_height='25,10,0');\nproc report data=orders\n\
    \  style(header)=[backgroundcolor=#F58220 color=black];\n  column customer_country\
    \ ('Order Info' 'Retail Info'\n  total_retail_price) ('Cost Info' costprice_per_unit);\n\
    \  define customer_country / group format=$cntry;\n\nrun;\nods close;\n```\n\n\
    ![](img/63c9b1dfb2b2b113230735bf3dbdfedd_148_0.png)"
