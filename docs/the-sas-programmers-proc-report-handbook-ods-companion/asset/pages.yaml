    # 6.6 PROC REPORT SPANROWS Option


    I did not detail the SPANROWS option in Reporting Techniques. That book focused
    on the options that affect the numbers and structure of the table. The SPANROWS
    option is designed to affect the look of the table. SPANROWS will have an impact
    on all of the non-Listing ODS destinations. However, it requires special attention
    when used with RTF and Tagsets.RTF. This section explores how SPANROWS works with
    RTF and Tagsets.


    The SPANROWS option allows a GROUP or ORDER variable to be displayed in a single
    cell. It is applied when the value of a GROUP or ORDER variable is the same for
    multiple rows. The resulting look is a merged cell.


    Example 6.19 creates a table that has CUSTOM GROUP defined as GROUP. Output 6.19
    shows what the table normally looks like, in both RTF and Tagsets.RTF.


    Example 6.19 Report without SPANROWS


    ```

    ods rtf file="Output-19.rtf"

    proc report data=orders(obs=50)

    style(column)=[width=1.5in]

    style(header)=[textcolor=#D35AAE color=white];

    ```


    ```

    column("Customer Info" customer_country customer_age_group)

    ("Order Info" order_type quantity);

    ```'
