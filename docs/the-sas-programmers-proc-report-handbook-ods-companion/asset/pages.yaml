  pgno: 189
- img_proc: true
  md: '# HTML and HTML5 Destinations 175


    When the URL attribute is applied via the CALL DEFINE statement is set at the
    cell level. The CALL DEFINE statement should not be used if the goal is to attach
    hyperlinks to individual words. Instead, HTML tags must be attached to the value
    attribute, the PROTECTSSPECIALCHARS=style attribute must be set to OFF so that
    the tags are interpreted as markup language tags. Example 8.9 demonstrates attaching
    hyperlink to two separate words within a cell. The results are shown in Output
    8.9.


    Example 8.9 Add Hyperlink to Multiple Words in Cell


    ```

    ods html5-path=''file=Output8-9.html'';

    proc data=orders;

    column customer_type customer_type2;

    define customer_type / group;

    define customer_type2 (column)=[With Hyperlinks''

    style(specialchars=off)];

    compute customer_type2 / char length=200;

    customer_type2 = transtr(customer_type, ''members'',''<A

    HREF="https://www.sas.com/sas/books.html">members</a><A

    customer_type2 = transtr(customer_type2, ''activity'',''<A

    HREF="http://support.sas.com/publishing/authors/

    eslinger.html">activity</a></A>);

    ```


