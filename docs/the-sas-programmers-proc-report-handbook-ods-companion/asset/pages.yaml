    suboption will appear special for how they are generated by the BREAK statement.


    # 7.2.4 FROZEN_ROWHEADERS Suboption


    The ODS destination for Excel also has a option called FROZEN_ROWHEADERS, which
    specifies that

    one column or a set of columns should remain static while the user scrolls left
    and right. When

    FROZEN_ROWHEADERS is set to yes, then the frozen is depends on the procedure.
    For example,

    PROC PRINT has an OBS column, which is considered as a row header and is therefore
    when the

    FROZEN_ROWHEADERS is set to yes. Currently, it is not possible to designate a
    column that is generated by PROC REPORT as a

    row header. Therefore, simply enabling the suboption will freeze the entire table.
    The scrolling capability will

    begin the last column.'
