    ## 5.1 Introduction

    The previous chapters of this book covered how style templates interact with the
    ODS destinations and how they both affect PROC REPORT tables. This chapter shifts
    the focus to a specific ODS destination – PDF. It builds on previous chapters
    but examines the characteristics that the PDF destination unique.


    The first section of this chapter discusses the default style template used by
    the PDF destination and the other templates designed for the Printer family. As
    shown in Chapter 3, changes to the style template had predictable results in the
    PDF destination. The biggest challenge was how to control borders. Border manipulation
    in PDF is covered more thoroughly in this chapter. The effect of the SPANROWS
    option on PDF is also discussed. Finally, the new accessibility feature and how
    it relates to PROC REPORT is discussed.


    In my opinion, PDF destination is the most reliable destination in PROC REPORT.
    The document is rendered by Adobe, which follows the directions set by SAS. Adobe
    does not alter the results, like Microsoft Word might do to RTF documents or various
    browsers might do to HTML files created by ODS. The destination is intended for
    print, and what you see is what is printed. PDF accepts inline formatting and
    most'
