- img_proc: true
  md: "It is difficult to predict any of the attributes inside the Table element will\
    \ be applied. When using the style element, it is extremely important to know\
    \ the destination the style template will be used for. Attributes within this\
    \ element are applied entirely differently to each of the destinations.\n\nIn\
    \ Example 3.6, attributes that control the text, borders, and spacing are assigned\
    \ to demonstrate the portion of the table that is affected by the Table Element.\n\
    \n# Example 3.6 Assigning Attributes in the Table Element\n\n```\nproc template;\n\
    \  define style _table;\n    style table /\n      fontfamily='Albany AMT'\n  \
    \    color=#264666\n      fontweight=bold\n      fontstyle=italic\n      backgroundColor=#F0F0F0\n\
    \      borderwidth=2pt\n      borderColor=#00292F\n      borderstyle=solid\n \
    \     padding=5pt;\n    style data /\n      fontfamily='Thorndale AMT'\n     \
    \ color=black;\n    style header /\n      fontfamily='Thorndale AMT'\n      color=black;\n\
    \    style dataemphasis /\n      fontfamily='Thorndale AMT'\n      color=black;\n\
    \    style linecontent /\n      fontfamily='Thorndale AMT'\n      color=black;\n\
    \  end;\nrun;\n```\n\n+   Assign four attributes specific to text within the Table\
    \ style element, along with background, border, and spacing attributes. All other\
    \ style elements specify a different font family and foreground color."
  merge: -1
  pgno: 56
