- img_proc: true
  md: '# The SAS Programmer''s PROC REPORT Handbook: ODS Companion


    In ODS PDF, the horizontal borders are drawn before the vertical borders, sometimes
    results in notches in the border. It is most noticeable when two different colors
    are applied between the cells. There is not a way to fix this problem. No matter
    how many ways you attempt to redraw the borders, the notch will persist.


    If you are experienced with manipulating borders, you can try removing all borders
    from the table using the following code:


    ```

    style(report)=[rules=none]

    ```


    Then, you can add back the ones that you need. However, this is a time-consuming
    process, and it might still not result in the borders that you need. But it is
    a handy technique to keep in mind if the desired borders do not conform to the
    choices for the FRAME= and RULES= attributes.


    The bottom line is that you either accept the notches or rethink the desired borders.


    One final point to consider when manipulating borders: in spanning headers, just
    because the cell is empty does not mean that the border cannot be changed. Example
    5.7 adds the PRODUCT LINE variable to the right side of the table. The column
    has no spanning header, as shown in Output 5.7.


    Example 5.7 Add PRODUCT LINE to the Right Side of the Table


    ```

    ods pdf file="output5-7.pdf" notoc;

    proc report data=orders(obs=20) style (column)=[width=1.5in];


    column ("-style [bordertopwidth=.5pt borderbottomcolor=#0092F]Customer

    Info" customer_country borderwidth=.5pt borderbottomcolor=#8E2F8A]Order

    Info" ("-style [bordertopwidth=.5pt borderbottom

    order_type quantity) product_line;


    define customer_country / group format=$cntry; "-style [bordertopwidth=.1pt bordertopcolor=#0092F]
    borderrightcolor=cx919191 borderrightwidth=.1pt]

    Customer";

    define customer_age / group style (header)=[bordertopwidth=.1pt bordertopcolor=#0092F];

    def order_type / group format=type. style (header)=[bordertopwidth=.1pt bordertopcolor=#8E2F8A];

    define quantity / style (header)=[bordertopwidth=.1pt bordertopcolor=#8E2F8A];

    define product_line / group;

    run;

    ods pdf close;

    ```'
