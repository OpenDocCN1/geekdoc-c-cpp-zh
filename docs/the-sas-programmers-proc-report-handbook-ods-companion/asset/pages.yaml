  md: '# 2.9 Key Takeaways


    This chapter gave an overview of style templates used byODS. The key takeaways
    from this chapter follow:


    +   - Each ODS destination has its own default style template.

    - The CLASS statement in PROC TEMPLATE is the recommended way to modify specific
    elements within a style template.

    - Parent style templates are not needed to create custom style templates but using
    inheritance rules allows for less code.


    Example 2.6 is reproduced with permission from SAS 9.4 Output Delivery System:
    Advanced Topics, Third Edition, Program for Viewing Multiple Styles, Third Edition.'
