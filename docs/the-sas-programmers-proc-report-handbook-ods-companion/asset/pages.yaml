    # 7.3 Tagsets.ExcelXP


    The Tagsets.ExcelXP destination generates XML files, specifically in the XML Spreadsheet
    (XMLSS) format. The tagset is capable of generating a workbook with multiple worksheets.
    However, it cannot contain images or graphics.


    For years, many programs have used Tagsets.ExcelXP. Unless an existing program
    lacks specific functionality, there is no need to rewrite it. The Tagset will
    continue to be part of Base SAS. However, in the future, more development is expected
    for the ODS destination for Excel than Tagsets.ExcelXP. The primary reason for
    changing code is that Tagsets.ExcelXP does not produce a native Excel file. As
    a result, when the file is opened, Excel produces a security pop-up window. The
    new destination does not have this behavior.


    One advantage for the Tagsets.ExcelXP destination is the underlying architecture
    that can be modified with PROC TEMPLATE. This means that some capabilities are
    not already part of the tagset can be added. The topic of altering the tagset
    code is beyond the scope of this book.


    This section focuses on many of the tasks as section 7.2. It demonstrates the
    code that is required for Tagsets.ExcelXP or points out how it behaves differently
    than the ODS destination for Excel.'
  merge: -1
