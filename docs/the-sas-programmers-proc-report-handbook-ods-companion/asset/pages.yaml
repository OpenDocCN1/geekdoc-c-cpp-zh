- img_proc: true
  md: "In order to explore the entire effect of a style template element, the output\
    \ needs to contain at least one element of each feature of PROC REPORT. The PROC\
    \ REPORT code in Example 3.0 contains all the necessary statements to report the\
    \ style elements. This code is used in every example in the remaining chapter.\n\
    \n# Example 3.0: PROC Report Code Used in All Chapter Examples\n\n```\nproc report\
    \ data=obs=20\nstyle(report)=[pretext='this is pretext']\nstyle(column)=[width=1.5in];\n\
    column \"Customer Info\" customer_country customer_age-group\n(\"Order Info\"\
    \ order_type quantity);\ndefine customer_country / group format=$cntry;\ndefine\
    \ customer_age / group;\ndefine order_type / group format=typef.\n\ncompute customer_country;\n\
    line 'a line statement for ' customer_country $cntry;\nendcomp;\ncompute after;\n\
    line 'this is a line statement';\nendcomp;\n\nbreak after customer_country / summarize;\n\
    break after summarize;\n```\n\n+   - Use the PRETEXT= attribute to add text to\
    \ the column headers of the table.\n- Control the width of the cells using WIDTH=.\
    \ This attribute is not affected by any specific style element. It is used to\
    \ make the output easier to read.\n- Insert spanning headers via the COLUMN statement.\n\
    - Add a row of text containing the customer value after each country section via\
    \ a LINE statement.\n- Add a row of text below the table via a LINE statement.\n\
    - Create a summary row for each country.\n- Create an overall summary row.\n\n\
    Please be aware that the attributes within the PROC TEMPLATE and PROC REPORT code\
    \ are documented in the SAS 9.4 Output Delivery System: User's Guide. Many of\
    \ the attributes have aliases. For example, COLOR sets the color of the text,\
    \ and its alias is FOREGROUND. Also, WIDTH is a commonly alias for WIDTH=. The\
    \ examples use BORDERSACING in order to be consistent with the documentation.\
    \ However, the CELLSPACING= is more frequently used.\n\nIn addition, each example\
    \ sends the to seven destinations. The STYLE= option in each ODS statement specifies\
    \ the style template that created in that.\n\n```\nods pdf file='test.pdf' style=style-name;\n\
    ods rtf file='test.rtf' style=style-name;\nods html file='test.html' style=style-name;\n\
    ods excel file='test.xlsx' style=style-name;\n* \n```"
  merge: -1
  pgno: 34
- img_proc: true
  md: "```\nods powerpoint file='test.pptx' style=typename;\nods tagsets.xlsx file='test.xml'\
    \ style=typename;\nods tagsets.sasreport13 file='test.srx' style=typename;\n```\n\
    \nFinally, for each example, the style template is stored in the temporary WORK\
    \ location by submitting the following statement by the PROC TEMPLATE step:\n\n\
    ```\nods path(prepend work.templat(update);\n```\n\n# 3.4 Plain Output Generated\
    \ without Attribute Changes\n\nIt is important to examine what PROC REPORT output\
    \ will look like before changing any specific attributes. The PROC REPORT code\
    \ contains at least one statement that will be affected by each style element.\
    \ Other statements will be, as necessary, to demonstrate the changes made in the\
    \ template. Example 3.1 generates a plain style template, with only the font and\
    \ foreground color specified for each of the main style elements.\n\nExample 3.1\
    \ Generate a PlainStyle Template\n\n```\nproc template;\n  define style plain;\n\
    \    table /\\n      fontfamily='Thorndale AMT'\n      color=black;\n    style\
    \ data /\\n      fontfamily='Thorndale AMT'\n      color=black;\n    style header\
    \ /\\n      fontfamily='Thorndale AMT'\n      color=black;\n    style dataemphasis\
    \ /\\n      fontfamily='Thorndale AMT'\n      color=black;\n    style linecontent\
    \ /\\n      fontfamily='Thorndale AMT'\n      color=black;\nend;\nrun;\n```\n\n\
    Output 3.1.1 PDF Plain Results\n\n| Customer Country | Customer Age Group | Order\
    \ Type | Quantity Ordered |\n|---|---|---|---||\n| Australia | 31-45 years | a\
    \ line statement for Australia | Internet Sale | 1 |\n| | | | Retail Sale | 4\
    \ |\n| | | 46-60 years | Internet Sale | 8 |\n| Australia | 15-30 years | a line\
    \ statement for United States | Internet Sale | 2 |\n| United States | | | Retail\
    \ Sale | 11 |\n| | | | Retail Sale | 7 |\n| | | | Retail Sale | 1 |\n| | 31-45\
    \ years | | Internet Sale | 21 |\n| | 61-75 years | | Retail Sale | 29 |"
