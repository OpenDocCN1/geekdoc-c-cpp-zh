    # 8.1 Introduction


    As of 9.4 TS1M, the HTML destination generates HTML output using the HTML 4.0
    standard, which is currently the default destination in DMS SAS. It is also the
    HTML version used by SAS Enterprise Guide when it is selected as one of the result
    formats. The default destination for SAS Studio is HTML, which uses the HTML 5.0
    standard. HTML5 output can be created from any SAS client using the ODS HTML statement.
    Note that the HTML5 destination does not have a surface tag, which means it cannot
    be modified and customized like the HTML destination.


    This chapter focuses on the effect of style template changes and style overrides
    for the HTML5 destination. Borders play a key role in many reports. In the next
    section of this chapter I discuss changing borders in HTML output. I follow with
    a section on applying hyperlinks to multiple words in a string by a discussion
    of images with PROC REPORT. Finally, I talk briefly about the accessibility capabilities
    in the HTML5 destination.'
