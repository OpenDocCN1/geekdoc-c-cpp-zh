  md: '# The SAS Programmer''s PROC REPORT Handbook: ODS Companion


    instead of BORDERCOLOR= and BORDERWIDTH= BORDER<LOCATION>COLOR= and BORDER<LOCATION>WIDTH=
    attributes.


    ```

    style header /

    fontfamily=''Albany AMT''

    color=#246666

    fontweight=bold

    fontstyle=italic

    backgroundcolor=#F0F0F0

    borderleftwidth=1pt

    borderleftcolor=#00929F

    bordrightwidth=1pt

    bordrightcolor=#00929F

    bordertopwidth=1pt

    bordertopcolor=#00929F

    bordertbottomwidth=1pt

    bordertbottomcolor=#00929F

    borderspadding=5pt;

    ```


    Chapter 9 delves into the border for the Powerpoint destination.


    The HTML, RTF, and PDF definitions (Output 3.2.1, 3.2.2, and 3.2.3) have a noticeable
    amount of white space between the gray cells of the header. In the HTML destination,
    the white space results from the BORDERSPACING=attribute. However, the visible
    white space in PDF and RTF does not result from the BORDERSPACING=attribute. The
    same white space will appear if that attribute is removed. The white space is
    a result of the behind-the-scenes style template and a lack of borders. The white
    space can be removed by setting the BORDERSPACING attribute to zero. The white
    space was present in the output of Example 3.1, but was not detectable because
    the background of the header cells was also. Inserting borders via the BORDER<LOCATION>COLOR=
    and BORDER<LOCATION>WIDTH= attributes will fill the white space.


    The SASReport destination (Output 3.2.7) has thicker teal lines between the header
    cells than any other destination. Each header cell has its own border, when placed
    against each other, the borders appear doubly thick.


    # 3.6 LineContent Style Element Changes


    The LineContent element is all straightforward. Attributes within this element
    are applied to all LINE statements no matter how compute the LINE statement is
    in. In Example 3.3, attributes that control the text, borders, and spacing are
    assigned to demonstrate the portion of the table that is affected by the LineContent
    element.


    Example 3.3 Assigning Attributes in the LineContent Element


    ```

    proc template;

    define style _linecontent;

    style table /

    fontfamily=''Thorndale AMT''

    color=black;

    style data /

    fontfamily=''Thorndale AMT''

    color=black;

    ```'
