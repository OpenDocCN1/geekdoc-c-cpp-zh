    #  6.1 Introduction


    The two destinations that generate Rich Text Format (.RTF) files are RTF and Tagsets.RTF.
    In general, RTF files are most often rendered by Microsoft Word, since RTF is
    a Microsoft specification. SAS writes the RTF instructions for what the file should
    contain and what it should look like. Word interprets the instructions and renders
    the document. Therefore, SAS does not have control over some aspects of the file''s
    appearance. If you use a word processing application other than Word, the RTF
    instructions might be interpreted differently.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# The SAS Programmer''s PROC REPORT Handbook: ODS Companion


    The first section of this chapter discusses the differences between the RTF and
    Tagsets.RTF destinations. The next section revisits the PROC TEMPLATE code from
    Chapter 3 to demonstrate how style changes affect Tagsets.RTF output.


    The chapter also contains a section on Tagsets.RTF options and suboptions that
    affect the PROC REPORT code and title. Finally, the PROC REPORT SPANROWS option
    is discussed in detail.


    # 6.2 Differences between the RTF and Tagsets.RTF Destinations


    Programmers must choose between RTF and Tagsets. RTF. Even experienced programmers
    have a difficult time deciding the pros and cons of the two destinations or why
    one is better than the other. In my role as a SAS Technical Analyst who supports
    PROC REPORT and ODS, I rarely recommend the use of Tagsets.RTF. Many PROC REPORT
    tables that span multiple pages and are sent to an RTF file require a paging variable.
    I believe this regrets the advantages of Tagsets.RTF.


    Tagsets.RTF is a measured destination, which enables the user to specify where
    page breaks occur within the document. For Tagsets.RTF, SAS is responsible for
    the implicit page breaks. SAS hands over the table to Microsoft Word, which is
    responsible for the implicit page breaks. Therefore, Tagsets.RTF does not making
    page breaks earlier than RTF for most PROC REPORT tables.


    Tagsets.RTF outputs supports readers other than Microsoft Word. Also, Tagsets
    has a smaller footprint when handling extremely large tables. A file created by
    Tagsets.RTF also maintains the specified margins no wider than what is in the
    normal .dot file for installation of Microsoft Word.


    The rest of this section explores the immediate differences between the two destinations.
    The differences are discussed only briefly, in general, they do not have an immediate
    impact on a PROC REPORT table.


    # 6.2.1 Titles and Footnotes


    For most programmers, the biggest difference between the files that are generated
    by these two destinations is how the titles and footnotes are handled. The RTF
    destination places the titles in the header section of the document, and it places
    the footnotes in the footer section. Double-clicking in that area of the document
    in Microsoft Word will show that it is considered to be a different section than
    the body. The titles and footnotes have a faded appearance. Even though might
    be written with black text, they will be muted or faded or look more gray black.


    Tagsets.RTF does not place the titles and footnotes in these other sections. They
    are placed directly into the body of the document.


    The RTF destination has an option, BODYTITLE, to force the titles and footnotes
    to be part of the document, as they are with Tagsets.RTF. BODYTITLE is placed
    in the ODS report statement.


    ```

    ods file="test.rtf" bodytitle;

    ```


    Note that the default behavior of the BODYTITLE option is to place the titles
    and footnotes with the table. If the table spans multiple pages, the title will
    appear once at the top of the first page. The footnote will appear once, below
    the end of the table, on the last page. Long tables must be divided into smaller
    tables that fit on one page in order for titles and footnotes to appear on every
    page.'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'RTf and Tagsets.RTF Destinations 97


    Tagsets.RTF destination does not have an option for forcing the titles to be part
    of the header and footer sections of a document.


    Although titles and footnotes are important, they are not a major focus of this
    chapter. The most direct impact that titles and footnotes have on PROC REPORT
    is the reduction of the amount of space available to the table. It does not matter
    whether they are part of the body of the document. The more titles and footnotes
    that are added to the document, the less space there is per page for a table.


    # 6.2.2 CONTINUED Text


    Another noticeable difference between the two destinations is that Tagsets.RTF
    will place “continued” text on the bottom of any page where the table continues
    to the next page. Also, for titles and footnotes, this does not directly impact
    PROC REPORT tables. For some report writers, the text is an important part of
    the final report. For others, the text extracts from the table.


    Example 6.1 generates default Tagsets.RTF output that spans multiple pages. Output
    6.1 shows the bottom of the page 1, which does not have to contain the text.


    ```

    ods tagsets.rtf output6-1.rtf;

    proc report data=orders(obs=50);

    column customer_id customer_name customer_gender customer_age;

    ```


    ```

    run;\ods tagsets.rtf close;

    ```


