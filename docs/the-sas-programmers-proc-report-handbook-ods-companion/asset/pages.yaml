    # 9.4.3 Many Header Rows


    Spanning headers and headers that are generated by ACROSS variables to make many
    rows of headers. In PDF or HTML, a table with three or four rows of headers is
    a common practice. However, in PowerPoint, excessive headers rows might not be
    a good idea. The number of header rows affects the data rows that can fit on a
    slide.


    Example 9.13 is an ACROSS variable, ORDER_DATE. The variable QUANTITY becomes
    almost like an ACROSS variable because three statistics are stacked below it.
    The result of having these two ACROSS variables is shown in Output 9.13. The header
    section has four rows of text, but it requires five to display two of the headers
    within the cell. The table length requires a second slide.


    # Example 9.13 Using Two ACROSS Variables


    title;


    ```

    ods powerpoint file="Output9-13.pptx";

    proc report data=orders(obs=70) style(header)=[background=#3D5AAE color=white];

    where (order_date)<2005

    ```


    ```

    column "Customer Info" customer_country customer_age_group

    order_date, (quantity, (sum min max));

    ```'
