  pgno: 70
- img_proc: true
  md: '+   * Other style elements within the style template might also have an impact
    on the output, as shown in Example 3.7, which makes changes within the Container
    element.


    +   * Style elements other than the five listed in the documentation might generate
    unexpected or undesired results. Therefore, it might be best to make changes only
    in the five documented elements.


    Also, the examples shed light on how specific attributes behave. Important takeaways
    regarding attributes are the following:


    +   * BORDERSPACING= allows the background color to bleed through in PDF and RTF
    output. This might not provide the desired look in the output.


    +   * BORDERWIDTH= and BORDERCOLOR= attributes might not insert borders. Insert
    BORDER<LOCATION>WIDTH= and BORDER<LOCATION>COLOR= should be used instead.


    +   * It is a good idea to test each of the attributes in the desired destination
    that will be needed for a particular report.'
