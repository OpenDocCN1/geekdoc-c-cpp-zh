    # 7.2.3 Hidden Rows


    PROC REPORT cannot conditionally execute or print a row generated by a BREAK statement.
    This means that the BREAK statement will have the same values as the detail row
    above because the grouping has only one subgroup value. The HIDDEN_ROWS suboption
    provides the ability to suppress redundant summary rows.


    Example 7.10 generates a table that has three summary rows, one for each value
    of CUSTOMER_GROUP. The summary rows have been assigned a background of yellow
    in Output 7.10.


    # Example 7.10 Create Table with Redundant Summary Rows


    ```

    ods excel file="Output7-10.xlsx"

    proc report data-orders style(summary)=[backgroundcolor=#FFE7A1];

    where customer_country=''AU'';

    col customer_country customer_group customer_age_group quantity

    total_retail_price;

    define customer_country / group=;

    define customer_group / group;

    define customer_age_group / group;

    break after customer_group / summarize;

    run;

    ods excel close;

    ```'
