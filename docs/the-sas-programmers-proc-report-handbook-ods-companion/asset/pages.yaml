    # 6.5.2 VSPACE


    The ODS TAGSETS.RTF statement contains an option called OPTIONS. Suboptions, specified
    within this option, provide target-specific instructions. Example 6.2 demonstrated
    one of the usages available with the destination CONTINUE. TAG. Another suboption
    that is for PROC REPORT tables is the VSPACE suboption. VSPACE controls the spacing
    between tables. You can add or remove space before and after tables. This suboption
    is handy when you are attempting to place two PROC REPORT tables on the same page
    within the document.


    The VSPACE suboption has the most impact when the STARTPAGE option is disabled
    (set to no). Example 6.16 generates two PROC REPORT tables. The STARTPAGE option
    places them on the same page, as shown in Output 6.16.


    ```

    Example 6.16 Two PROC REPORT tables with STARTPAGE=NO

    ods tagset.rtf file="Output6-16.rtf" startpage=no;

    proc report data=orders style(header)=[#6EC6F0];

    style(column)=[color=#E2F8A fontweight=bold];

    column customer_gender quantity;

    define customer_gender / group;

    run;

    ```'
