  md: "# 46 The SAS Programmer PROC REPORT Handbook: OS Companion\n\nOutput 3.6.6,\
    \ The Tagsets.Excel output, has a gray background for the data rows but not the\
    \ output from the\nLINE statements. It contains teal borders around all the data\
    \ rows. It does not contain the navy font.\n\nOutput 3.6.7, The Tagsets.SASReport13\
    \ output, looks different from the other six destinations. Data rows\nLINE statements\
    \ are in bold and italic but not in navy. The entity table has a light gray background.\
    \ The\ntable is surrounded by a teal border. However, the rest of the page has\
    \ a darker gray background. The pretext is\nin a navy color like it is in Output\
    \ 3.1.7. The output does not appear to have any additional spacing as\nseen in\
    \ the PDF, RTF, or HTML output.\n\nNotice that the RTF file seems to follow what\
    \ the documentation implies will happen to the text from the\nPRETEXT= attribute.\
    \ Again, each destination uses the style elements differently. This reiterates\
    \ the\nneed to create a custom style for each destination. Example 3.7 addresses\
    \ PRETEXT= attribute for the other\ndestinations.\n\n# 3.10 Other Style Elements\n\
    \nThe previous sections covered the five style elements listed in the documentation\
    \ that control the PROC\nREPORT output. However, other style elements might affect\
    \ the table. In fact, in four of the five destinations\nthat honor the PRETEXT=\
    \ attribute, none of the preceding examples altered the attributes of the text.\n\
    \nFor four destinations, PDF, HTML, Excel, and PowerPoint, the PRETEXT= attribute\
    \ is controlled within the\nContainer element. It is best to use this style element\
    \ with extreme caution, as shown in Example\n3.7that follows, the Container element\
    \ might affect more of the report output than desired.\n\nExample 3.7 Assigning\
    \ Attributes in the Container Element\n\n```\nproc template;\n  style container\
    \ = 1\n    style container /\n      fontfamily='Albany AMT'\n      color=#246666\n\
    \      fontweight=bold\n      fontstyle=italic\n      backgroundColor=#F0F0F0\n\
    \      borderwidth=2pt\n      bordercolor=#00929F\n      borderstyle=solid\n \
    \     borders=5pt;\n    style table /\n      fontfamily='Thorndale AMT'\n    \
    \  color=black;\n    style data /\n      fontfamily='Thorndale AMT'\n      color=black;\n\
    \    style header /\n      fontfamily='Thorndale AMT'\n      color=black;\n```"
