    Example 4.3 shows rethinking the statement used to apply attribute changes can
    make the program easier to read and understand.


    Another common programming inefficiency is to set attributes with style overrides
    that are already part of the style template. For example, many style templates
    use the font color for both the header and data sections of the table. Therefore,
    there is no need to set the foreground attribute to black in PROC REPORT. Remember,
    style overrides should be used only to change the attribute value that is used
    in the style template. The FONTSIZE attribute tends to be over. Do all headers
    or data values need to have the same font size? If so, set the FONTSIZE= attribute
    in the PROC REPORT statement instead of the DEFINE statements. The STYLE= option
    in the PROC REPORT statement is most effective for attributes that need to be
    set only once. Typical options to set once are FONTSIZE=, FRAME= and RULES=


    # 4.4 STYLE= in DEFINE Statement


    The STYLE= option in the DEFINE statement should be used only for the overrides
    that apply to that specific column. Again, use the PROC REPORT statement to apply
    table overrides, and then use the DEFINE statement for column overrides.


    # 4.4.1 Using CELLWIDTH= Style Attribute


    Of the most common style attributes that is applied via the DEFINE statement is
    WIDTH= the columns are often not the desired width. Each report is unique because
    of the business requirements and the data. The WIDTH= style attribute is vitally
    for generating a table that is easy to read. It also plays a key role in getting
    the table to fit in the paging destinations such as PDF and RTF.


    WIDTH= needs to be applied to each column, depending on the data. If a table does
    not fit within a PDF or RTF page, and a width value is applied to each column,
    trying removing one of the widths. Removal of a single'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# 62 The SAS Programmer''s PROC REPORT Handbook: ODS Companion


    width value provides the destination with a little wiggle, which often results
    in a table that fits correctly

    the page.


    Remember that the same report might look different once the data is updated. Therefore,
    never assume that the

    program will create the exact same output with new data or after an upgrade to
    a new release.


    None of the definitions require a unit of measure WIDTH= style attribute. When
    a unit of measure is not

    provided with the specified dimension value, the values called a relative value.
    The HTML and Excel

    destinations handle relative values better than the other destinations. Have absolute
    control over the

    width of a cell, it is best to supply a unit of measure. Doing so prevents the
    destination from doing

    calculations before the scenes can result in something other than the desired.


    Example 4.4 demonstrates how to specify style attribute in the DEFINE statements.

