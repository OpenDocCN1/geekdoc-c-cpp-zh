  md: "# 150 The SAS Programmer PROC REPORT Handbook: ODS Companion\n\nFor some programmers\
    \ and some applications, the results are acceptable. For others, the default style\
    \ template is not acceptable. The template used by programmers Tagsets.ExcelXP\
    \ varies widely based on individual needs. As discussed in Chapter 3, the template\
    \ that should be based on both needs of the report and the destination. When necessary,\
    \ a custom style template should be created specifically for Tagsets.ExcelXP output.\n\
    \n# 7.3.2 Hidden Rows\n\nThe Tagsets.ExcelXP destination does not have a suboption\
    \ that can hide rows like the ODS destination for Excel does. However, rows can\
    \ still be hidden with this destination. With the TAGATTR attribute, the command\
    \ to hide a row can be passed to Excel. Usually this command is passed with a\
    \ CALL DEFINE statement within a compute block. Note that a CALL DEFINE statement\
    \ must be created for each row that needs to be hidden.\n\nExample 7.23 demonstrates\
    \ how to use the TAGATTR attribute to hide the third and fifth rows of the PROC\
    \ table. The results are shown in Output 7.23.\n\nExample 7.23 Use TAGATTR to\
    \ hide rows in Tagsets.Excel Output\n\n```\nods tagsets.excelxp file=\"Output-7.23.xml\"\
    \ style=meadow;\nproc report data=orders\n  style(summary)=[backgroundColor=#FFE7A1]\n\
    \  style(column)=[width=2in];\n where customer_country='AU';\n column customer_country\
    \ customer_group customer_age_quantity\n total_retail_price;\ndefine customer_group\
    \ / group format=Scntry;\ndefine customer_group / group;\ndefine customer_age_group\
    \ / group;\ndefine total_retail_price / 'Total Retail Price';\n break after customer_group\
    \ /;\n```\n\n```\ncompute after customer_group\n if customer_group = 'AU' and\
    \ customer_group in ('Internet/Catalog\n Customers' 'Orion Club Gold members')\
    \ then\n define(ROW,\"style\",\"style=\"tagattr='hidden:yes\"\");\n endcompute;\n\
    ```\n\n```\nrun;\\ ods tagsets.excelxp close;\n```\n\n# Output 7.23 Rows 3 and\
    \ 5 Are Hidden\n\n| Customer Name | Customer Age Group | Quantity Ordered | Total\
    \ Retail Price |\n|---|---|---|---||\n| Australia | Internet/Catalog Customers\
    \ | 61-75 years | 13 | $1,061.50 |\n| | Orion Club Gold members | 48-60 years\
    \ | 24 | $1,548.50 |\n| | | 31-45 years | 104 | $657.59 |\n| | | 18-30 years |\
    \ 20 | $965.42 |\n| Australia | Orion Club members | 51-75 years | 49 | $6,201.70\
    \ |\n| | | | 173 | $14,714.69 |"
