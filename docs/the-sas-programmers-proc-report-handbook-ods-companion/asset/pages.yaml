    \ data=orders\n  style(header)=[#8E2F8A color=white];\n  column customer_country\
    \ ('Order Info' quantity) 'Retail Info' total_retail_price ('Cost Info' costprice_per_unit)\n\
    \  define customer_country / group format=$cntry.;\nrun;\nods excel close;\n```\n\
    \n# Output 7.4 ABSOLUTE_COLUMN_WIDTH Used for Multiple Columns\n\n| | | | |\n\
