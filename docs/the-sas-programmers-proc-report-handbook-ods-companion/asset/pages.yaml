    # 3.9 Table Style Element Changes


    The documentation states that the Table style element applies to the “report as
    a whole,” but it is not immediately clear what that means. The Table element is
    used by the PROC REPORT statement and is applied to the report location. Within
    that location, attributes in the following list affect only the text that is specified
    with the PRETEXT=, POSTTEXT=, PREHTML=, and POSTHTML= attributes.


    +   * Font

    * FontFamily

    * Fontsize

    * Fontstyle

    * FontWeight'
