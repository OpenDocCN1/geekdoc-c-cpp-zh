- img_proc: true
  md: "# 6.4 Table Bottom Border\n\nBorders are important to all tables. Programmers\
    \ spend a lot of time altering the borders to match specifications. Section 6.3\
    \ demonstrated that Tagsets.RTF does not use the style attributes from the style\
    \ template the same way that the RTF destination does.\n\nSection 6.3 of Reporting\
    \ Techniques demonstrated various techniques to generate tables in specific places.\
    \ This section does not cover the border attributes in the detail as as that.\
    \ However, it is important to see how borders are different between the RTF and\
    \ Tagsets.RTF destinations. This section explores how to alter the borders in\
    \ both destinations. For some tables, changing the border attributes within PROC\
    \ REPORT is preferable to changing the attributes within a style template. This\
    \ section shows how the two destinations apply borders for a table that spans\
    \ multiple pages.\n\nExample 6.11 generates a two-page table. The FRAME= style\
    \ attributes a border around the entire table. The RULES= style attributes places\
    \ a border around the header and the data sections of the table. Output 6.11.1\
    \ shows the bottom of page 1 for the Tagsets.RTF destination. Output 6.11.2 shows\
    \ the same section of the output for the RTF destination.\n\nExample 6.11 Create\
    \ a Table That Spans Multiple Pages\n\n```\nods tagsets.rtf file=\"Output6-11-1.rtf\"\
    ;nods rtf file=\"Output6-11-2.rtf\";nproc report data=orders(obs=50)\n  style\
    \ (report)=[frame=box rules=groups]\n  style (header)=[backgroundcolor=#68C9D2];\n\
    \  column customer_id= customer_name customer_gender customer_age;\nrun;\nods\
    \ _all_ close;\n```\n\nOutput 6.11.1 Tagsets.RTF Places Border at the Bottom of\
    \ Page 1 (Partial)\n\n| Customer ID | Customer Name | Customer Gender | Customer\
    \ Age |\n|---|---|---||}{\n| 49 | Annarie Leveille | F | 23 |\n| 52 | Yan Kozzlowski\
    \ | M | 38 |\n| 53 | Dericka Pockran | F | 53 |\n\n(Continued)\n\n| Customer ID\
    \ | Customer Name | Customer Gender | Customer Age |\n|---|---|---||}{\n| 171\
    \ | Robert Bowerman | M | 33 |\n| 52 | Yan Kozzlowski | M | 38 |"
  merge: -1
  pgno: 121
- img_proc: true
  md: "# Output 6.11.2 RTF Does Not Place Border at the Bottom of Page 1 (Partial)\n\
    \n| Customer ID | Customer Name | Customer Gender | Customer Age |\n|---|---|---|--|\n\
    | 53 | Dericka Pockran | F | 53 |\n| 171 | Robert Bowerman | M | 33 |\n| 52 |\
    \ Yan Kozlowski | M | 38 |\n| 34 | Alvan Gooleen | M | 23 |\n| 10 | Karen Ballinger\
    \ | F | 23 |\n\nOutput 6.11.1, created by Tagsets.RTF, has a border after the\
    \ last record on page 1. Output 6.11.2, created by RTF, does not have a border\
    \ after the last record on the page. Handling a border after the last record is\
    \ one of the most noticeable differences between Tagsets.RTF and RTF on PROC REPORT\
    \ tables. Recall that SAS controls the paging in Tagsets.RTF. Therefore, SAS breaks\
    \ the longer table into smaller ones and feeds one page at a time to Microsoft\
    \ Word. The result is that a border is placed at the bottom of each page. The\
    \ RTF destination does not know when the border of a page will occur. It only\
    \ knows when the bottom of the table occurs. Therefore, the table spans multiple\
    \ pages, and a border is not placed on the bottom of page 1 because it is not\
    \ the bottom of the. RTF will place a border at the bottom of a table.\n\nMany\
    \ programmers try to control borders with the FRAME= and RULES= attributes, with\
    \ either a style template or style overrides. However, the solution for RTF is\
    \ not related to style. Instead, the solution is related to data and PROC REPORT.\
    \ The RTF destination will put a frame border at the bottom of a table. Therefore,\
    \ a large table that spans multiple pages must be divided into smaller tables,\
    \ with each table having a border on one page.\n\nExample 6.12 Create the Table\
    \ That Spans Multiple Pages Using a Paging Variable\n\n```\ndata orders2;\n  set\
    \ orders;\n  if first.region then flag=0;\n  else flag+1;\n  if flag>=40 then\
    \ do;\n    pageit+1;\n    flag=0;\n  end;\nrun;\nods rtf file=\"Output6-12.rtf\"\
    ;\nproc report data=orders2(obs=50)\n  style(report)=[frame=box rules=groups]\n\
    \  style(header)=[backgroundColor=#68C9D2];\n  column pageit customer id customer_name\
    \ customer_gender customer_age;\n```"
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 108 The SAS Programmer PROC REPORT Handbook ODS Companion


    ```

    define pageit / noprint;

    break after pageit;

    run;

    ods rtf close;

    ```


    Output 6.12 Paging Variable Ensures a Border at the Bottom of Page 1 in RTF (Partial)


    | Customer ID | Customer Name | Customer Gender | Customer Age |

    |---|---|---|--|

    | 34 | Alvan Goheen | M | 23 |

    | 171 | Robert Bowerman | M | 33 |

    | 52 | Yan Kozlowski | M | 38 |


    The number of rows that contribute to the value of PAGEIT is arbitrary. It is
    based on an estimate of what can fit on a page. You will have to consider your
    needs and settings to determine how many rows might fit on a page. There is no
    existing formula or automatic method to make this determination for you.


    Also note that the border width from the template style is assigned as .75pt.
    Most width assignments between .1pt and 1pt will produce the same width. You cannot
    make the width of the borders any narrower than those shown in the previous example.


    Often a border is required between the end of the table and the footnote. A border
    that is generated by the FRAME attribute or created by border attributes associated
    with a LINE statement is part of the table. This means the border will be placed
    where the table ends. Depending on the amount of data on that, a table might not
    end at the same place on each page. Therefore, a border with a table is not guaranteed
    to be placed at the same location each page.


    When a border must be placed on the same location on every page, it is better
    to associate that border with the footnote instead of the table. This is especially
    true if the border must span the width of the page. Example 6.13 uses BERTODOPCOLOR=
    and BERTODOPWIDTH= within the FOOTNOTE statement to add a border to the bottom
    of each page that spans the width of the page. Output 6.13 shows the RTF results.


    Example 6.13 Place a Border between the Table and the Footnote in the RTF Design


    ```

    ods escapechar"

    footnote ''^=[bordertopcolorwidth=1pt]This is a footnote'';

    ods rtf file=Output6.rtf;

    proc report data=orders(obs=50)

    style(report)=[frame box rules=groups]

    style(header)=[background=#CC9FC9]

    column customer_id customer_name customer_gender customer_age;


    run;\ods rtf close;

    ```'
