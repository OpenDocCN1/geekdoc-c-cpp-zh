    \ out=work.gallery;\nwhere libname='SASHELP' and substr(style,1,6) = 'Styles';\n\
    by style;\nrun;\n\n/* Use path to specify location */\n/* if you are running SAS\
    \ University Edition, then specify\n&let path=/folders/myfolders; */\n/* if you\
