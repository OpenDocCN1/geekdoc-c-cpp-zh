    # 8.3 Borders


    As mentioned in Reporting Techniques, altering borders in the HTML destinations
    is not always easy. They just do not seem to act like they do in other destinations.
    In my experience people need to alter borders in HTML output because generally
    the report is being sent to another destination. However, for some programmers
    it is important to change borders in an HTML file.


    With HTML it is usually easier to change all of the borders—for example, remove
    all of them—or change an individual border. The examples in this section demonstrate
    changing all of the borders at once. If you need to change an individual border,
    start by using the techniques in Chapter 6 of Reporting Techniques.


    As I previously mentioned, it is possible to remove all of the borders from a
    PROC REPORT table in HTML. The most efficient way to do this is to use the BORDERSTYLE
    attribute within PROC TEMPLATE. Example 8.7 demonstrates setting BORDERSTYLE=
    HIDDEN for all of the elements that affect a PROC REPORT table. Output 8.7 contains
    the resulting table.'
