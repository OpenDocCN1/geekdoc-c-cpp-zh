  md: '# About This Book


    # What Does This Book Cover?


    The purpose of this book is to describe how PROC REPORT interacts with the major
    Output Delivery System (ODS) destinations. Each ODS destination behaves differently
    from the others, and programmers need to be aware that they might have to alter
    their PROC REPORT code or create a custom style template based on the final destination
    of their report.


    This book covers how PROC REPORT interacts with the following destinations:


    +   - PDF

    - RTF

    - Tagsets.RTF

    - HTML

    - HTML5

    - ODS destination for Excel

    - Tagsets.ExcelXP

    - ODS destination for PowerPoint


    This book does not discuss how to perform calculations with PROC REPORT or how
    to structure output. These topics were covered in The SAS Programmer''s PROC REPORT
    Handbook: Basic to Advanced Reporting Techniques (referred to as Reporting Techniques
    throughout the book).


    This book does not cover style templates and PROC TEMPLATE in-depth. Those topics
    are briefly described with regard to how they relate to PROC REPORT.


    # Is This Book for You?


    This book is meant for SAS programmers of all skill levels in all industries who
    need to create reports. This book will teach you how PROC REPORT works with ODS
    and the steps that you can take with your code to ensure that you are getting
    the output in the format that you need and with all the styling enhancements that
    you want.


    # What Are the Prerequisites for This Book?


    Basic knowledge of SAS programming is necessary in order to understand the concepts
    and examples in this book. You need a general understanding of the basic concepts
    of sending output to the ODS destinations.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Scope of This Book


    This book is entirely about PROC REPORT and ODS. PROC REPORT is designed specifically
    for generating reports. ODS plays a major role in the final appearance of the
    report. The book attempts to give an overview of ODS and each destination as it
    relates to PROC REPORT. A full description of every destination and every style
    attribute and its uses is beyond the scope of this book.


    Although the TEMPLATE procedure is used in this book, it is not covered in depth.
    The syntax of the TEMPLATE procedure is described only enough to convey the reason
    the procedure is needed for use with PROC REPORT.


    # What Should You Know about Develop the Book''s Content


    The examples in this book were developed using Base SAS 9.4TS1M4. The examples
    that pertain to the ODS destinations for Excel and PowerPoint should be run in
    SAS 9.4TS1M0–9.4TS1M3, with all hot fixes installed. The most recent releases,
    SAS 9.4TS1M4 or SAS 9.4TSIMS5.


    All examples that are not related to the ODS destinations for Excel and PowerPoint
    should work in SAS 9.3 as well. Please note that if the example programs are run
    interactively in SAS 9.3, the NOWOW option should be added to the PROC REPORT
    statement. This book is also compatible with SAS University Edition.


    # Example Code and Data


    Permission to use the Orion Star data, which was used for demonstration purposes
    throughout this book, was granted by Sean O''Brien and Eric Rossland. All the
    examples in this book use one SAS data set ORDERS.


    ORDERS contains purchase order data. The data is set at CUSTOMER_ID, ORDER_ID,
    and PRODUCT_ID level. A customer can have multiple orders and within each order,
    the customer can purchase multiple products. The QUANTITY variable contains the
    quantity ordered of a specific product.


    To use the example programs from the author page, you need the ORDERS data set
    in the WORK location. You also need to submit the createfits.sas program. The
    program creates two formats, called <entry> and type, which are used throughout
    the book. The formats are stored in a catalog in the WORK location, as well.


    You do not have to read this book in its entirety to gain valuable knowledge about
    PROC REPORT and how it interacts with ODS. Chapters 2, 3, and 4 provide the foundation
    for the remaining chapters of the book. You might find it helpful to read these
    chapters first, and then on the chapter about the destination that interests you.


    You can access the example code and data for this book by linking to the author
    page at http://support.sas.com/publishing/authors. Select the name of the author.
    Then, look for the cover thumbnail of this book, and select Example Code and Data
    to display the SAS programs that are included in this book.


    If you are unable to access the code through the website, send email to saspress@sas.com.'
  merge: -1
