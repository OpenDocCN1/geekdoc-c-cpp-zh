    not contain images.


    # 7.5 Background Color in the Headers


    PROC REPORT tables often have text in the rows above the column headers and labels.
    They provide dates, company information, or more informative text. PROC REPORT
    can generate these headers, called spanning headers with the COLUMN statement.


    Often, the cells that contain the spanning headers have a background color. Inline
    formatting commands are used to control the attributes of a spanning header. Microsoft
    Excel does not honor the BACKGROUNDCOLOR= attribute within a spanning header.
    This is true for all the destinations that create output that is viewed in Excel:
    HTML, MOffice2K, Tagsets.ExcelXP, and the ODS destination for Excel.'
