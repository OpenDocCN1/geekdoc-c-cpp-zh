    # 2.1 Introduction


    Every piece of output that SAS generates is controlled by a template. The tables
    generated by the REPORT, MEANS, GLM, and other procedures are controlled by templates.
    The visual aspects of the files generated by the Output Delivery System (ODS)
    are controlled by style templates. The TEMPLATE procedure can be used to modify
    some of the table templates and to modify all of the style templates.


    Style templates are powerful tools for generating attractive output. They help
    make the tables generated by PROC REPORT informative and easy to read. However,
    before learning how style templates affect PROC REPORT, we need to understand
    what is already provided by SAS.


    This chapter discusses the style templates that are shipped by SAS, including
    where they are stored and how to see what each looks like. The chapter also explains
    the syntax of PROC TEMPLATE. The end of the chapter introduces concepts and how
    to find information about specific attributes.


    Please that that this focuses solely on style templates that are generated by
    PROC TEMPLATE. Most of the formatted ODS destinations allow the use of a Cascading
    Style Sheet (CSS) to affect the style of the'
