    \ work.templatat(update);\nproc template;\n  define style noborder;\n    parent=styles.htmlblue;\n\
    \    class data, header, table, dataemphasis, linecontent /\n      borderstyle=hidden;\n\
    end;\nrun;\n```\n\n```\nods html55 path='.' file='Output8-7.html' style=noborder;\n\
    proc report data=orders(obs=20)\n  style(report)=[pretext='this is pretext']\n\
    \  style(column)=[width=1.5in];\n\n  column \"Customer Info\" customer_country\
    \ customer_age_group\n         \"Order Info\" order_type quantity;\n  define customer_country\
    \ / group format=$scnt;\n  define customer_age_group / group;\n  define order_type\
    \ / group format=typef;\n\n  compute before customer_country;\n    line 'a line\
    \ statement for ' customer_country $scnt;\n  end;\n  compute after;\n    line\
    \ 'this is a line statement';\n  end;\n```\n\n```\nbreak after customer_country\
    \ / summarize;\n  rbreak after / summarize;\nrun;\n```\n\n# Example 8.7 All Table\
    \ Borders Removed\n\n| Customer Country | Customer Age Group | Order Type | Quantity\
    \ Ordered |\n|---|---|---|---||\n| Australia | 31-45 years | Internet Sale | 1\
