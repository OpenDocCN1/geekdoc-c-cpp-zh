  md: '# 156 The SAS Programmer PROC Report Handbook: ODS Companion


    In this section, the examples use the MSOffice2K destination but not the MSOffice2K_X
    destination. However, these examples apply to both destinations. Recall that the
    MSOffice2K_X target must be downloaded. It is not shipped with SAS.


    # 7.4.1 Default Style


    The default style template for the MSOffice2K and MSOffice2K_X destinations is
    Styles.Default. The output looks the same as the output that is created by Tagsets.ExcelXP,
    shown in Output 7.22. Like Tagsets.ExcelXP, the default style is adequate for
    some purposes. However, a different style template is specified for many reports.
    The MSOffice2K_X allows a different style template for each sheet. The individual
    files must be created with the desired style. Then, when the files are combined
    to generate one workbook with multiple sheets, each sheet will have its own style.


    The default style when using the HTML destination is Styles.HTMLBlue.


    # 7.4.2 Hidden Rows


    The HTML, MSOffice2K, and MSOffice2K_X destinations do not have the ability to
    hide rows within a PROC REPORT table.


    # 7.4.3 Border Manipulation


    Controlling borders is extremely challenging in the MSOffice2K and HTML destinations.
    It might not be possible to get the desired borders for these destinations with
    either template changes or style overrides.


    MSOffice2K adds borders when the FRAME= RULES= BORDERCOLOR= or BORDERWIDTH= is
    used in the STYLE(REPORT) option in the PROC REPORT statement. It ignores all
    values of FRAME= and RULES, and simply inserts borders.


    The HTML destination is unlikely to add any borders regardless of the attributes
    that are specified in the STYLE(REPORT) option in the PROC REPORT statement.


    Border attributes in the STYLE= option in a COMPUTE statement are ignored in both
    destinations. Border attributes specified in a CALL DEFINE statement are also
    ignored in both destinations.


    If borders are extremely important to the report, consider using one of the other
    destinations mentioned in this chapter.


    # 7.4.4 Customized Text for Summary Row


    As discussed in Section 7.2.6, the strategy for adding custom text for numeric
    variables depends on the destination to generate the output. For the HTML-based
    destinations that generate output for Excel (HTML, MSOffice2K, and MSOffice2K
    X), the PRETEXT= attribute is used to add text to the summary rows for numeric
    variables. The method that a character variable is not required.


    Example 7.28 generates output for the MSOffice2K destination. The PRETEXT= attribute
    is used to add text to the summary row. The results are shown in Output 7.28.'
  merge: -1
  pgno: 171
