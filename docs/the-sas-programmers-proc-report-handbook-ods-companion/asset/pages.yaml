  md: "# Example 7.20.2 Sheet 2 of 7 Generated by the PAGE Option in the DEFINE Statement\n\
    \n| A | B | C |\n|---|---|---|\n| 1 | Customer Country | Customer Group Name |\
    \ Customer Age |\n| 2 | Canada | Internet/Catalog Customers | 31-45 years |\n\
    | 3 | | Orion Gold members | 15-30 years |\n| 4 | | | 31-45 years |\n| 5 | | |\
    \ 46-60 years |\n| 6 | | Orion Club members | 15-30 years |\n| 7 | | | 31-45 years\
    \ |\n| 8 | | | 46-60 years |\n| 9 | | | 61-75 years |\n\nExample 7.20, a BREAK\
    \ statement with the PAGE option is a quick way to generate multiple worksheets\
    \ without changing destination suboptions. However, the sheet names in Output\
    \ 7.20.1 and 7.20.2 are not very helpful. They are numbered, but it is not easy\
    \ to determine what information is stored in each sheet. A BY statement also produces\
    \ multiple tables. Therefore each BY value will generate its own worksheet. Using\
    \ a BY variable is the best technique for controlling the sheet names for one\
    \ PROC step that generates multiple spreadsheets.\n\nExample 7.21 sorts the data\
    \ BY CUSTOM_COUNTRY, and then uses the BY statement within PROC REPORT. The SHEET_NAME\
    \ suboption is used within the OPTIONS option in the ODS EXCEL statement. The\
    \ SHEET_NAME suboption accepts the value of #BYVARN, #BYVALn, or #BYLINE. Each\
    \ sheet name contains the value of country in Output 7.21.\n\n# Example 7.21 Use\
    \ a BY Statement to Control the Sheet Names\n\n```\nproc sort data=orders out=orders2;\n\
    \  by customer_country; ①\n\noptions noline; ②\nods excel file=\"Output7-21.xlsx\"\
    \n  options(sheet_name='#byvalall');  ③\nproc report data=orders2;\n  style(header)=[backgroundcolor=#E7ACC66\
    \ color=black];\n  by customer_country; ④\n  format customer_country $cntry.;\
    \ ⑤\n  column customer_country customer_group customer_age_group quantity total_retail_price;\n\
    \  define customer country / group;\n  define customer_group / group;\n  define\
    \ customer_age_group / group;\nrun;\nods excel close;\n```"
