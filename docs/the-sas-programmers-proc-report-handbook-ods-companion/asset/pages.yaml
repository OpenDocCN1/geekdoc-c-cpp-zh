    Note that the headers in the ODS HTML output (Output 3.1.3) are in bold even though
    they are in medium weight for all other destinations. In ODS HTML output, the
    headers are given the ''th'' tag. The ''th'' tag is controlled by the browser,
    which always specifies bold headers. The only way to prevent this behavior is
    to explicitly set the font weight for the header.'
