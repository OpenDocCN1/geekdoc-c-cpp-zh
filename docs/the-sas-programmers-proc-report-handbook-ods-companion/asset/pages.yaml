- img_proc: true
  md: '# Generate reports with style!


    The SAS® Programmer''s PROC REPORT Handbook: ODS Companion explains how to use
    style elements within a style template to customize reports generated by PROC
    REPORT, leading to more appealing and effective business reports.


    Many programmers are faced with generating reports that are easy to read and compelling
    for a wide variety of audiences, which is where the ODS destinations and style
    changes come into play. This book teaches you how to use style elements in PROC
    REPORT, a versatile reporting procedure, to customize your output. Mastering style
    elements allows you to change visual aspects of reports, such as borders, column
    widths, fonts, backgrounds, and more. This companion to The SAS® Programmer''s
    PROC REPORT Handbook: Basic to Advanced Reporting Techniques explores how the
    style elements within a style template affect the output generated by PROC REPORT.
    It provides examples of altering the style elements and the effect on the main
    ODS destinations, also discussing common pitfalls that programmers can avoid while
    working with tables, Microsoft Excel, Microsoft Power Point, and PDF output.


    > JANE ESLINGER is a Senior Technical Support Analyst at SAS world headquarters
    in Cary, North Carolina. Jane is a SAS Certified Advanced Programmer for SAS⁹
    and a SAS Certified Advanced Visual Business Analyst. She frequently presents
    PROC REPORT and ODS topics at conferences and SAS users groups. She is the author
    of numerous papers and The SAS® Programmer''s PROC REPORT Handbook: Basic to Advanced
    Reporting Techniques.


    In her day-to-day work, Jane enjoys supporting SAS customers using ODS and Base
    SAS procedures, with an emphasis on PROC REPORT. Prior to joining SAS, Jane served
    as a statistician and statistical programmer in the social science and clinical
    research fields. She has a B.S. in Statistics from North Carolina State University.


    ![](img/63c9b1dfb2b2b113230735bf3dbdfedd_239_0.png)


