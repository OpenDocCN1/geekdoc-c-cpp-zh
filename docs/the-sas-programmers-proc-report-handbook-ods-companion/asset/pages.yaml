  md: '# 2.6 STYLE versus Class Statements


    Depending on who wrote the code and when it was written, PROC_TEMPLATE step will
    have a STYLE statement, a CLASS statement, or both. The CLASS statement implies
    inheritance from the style element that is specified. For example, the following
    statement changes the color attribute for the Header element and inherits all
    other attributes associated with the Header element.


    ```

    class header / color=blue;

    ```


    The STYLE statement requires the element that should be inherited from should
    be explicitly specified with the FROM clause. For example, in the following statement,
    the FROM clause specifies that the Header element is being inherited from its
    parent element.


    ```

    style header from header / color=blue;

    ```


    The self_special keyword can also be specified in the FROM clause. The keyword
    is especially helpful when more than one element is listed in the STYLE statement.


    ```

    style header from _self_ / color=blue;

    ```


    The omission of the FROM clause will not result in an error or a warning. The
    ODS destination will still create the output. However, it may not appear as expected.
    Without the FROM clause, the style element is redefined, meaning it overwrites
    the style attributes that might have existed in that style element. This could
    result in the loss of any attribute that was not set within the custom style.


    The preceding CLASS and STYLE statements have the exact same effect. There is
    no advantage of one over the other besides fewer keystrokes. Kevin Smith, author
    of PROC TEMPLATE Made Easy: A Guide for SAS Users, recommends as a rule, use of
    the CLASS statement.


    Old style templates might still contain the REPLACE statement. Beginning with
    SAS 9.2, the REPLACE statement is no longer supported. Remove any REPLACE statements
    and instead use the STYLE statement or the CLASS statement to create and modify
    style elements.


    # 2.7 Inheritance


    Inheritance is a very important topic for style templates. Most style templates
    inherit from a parent style. Parent attributes can be thought of as the starting
    point. The parent style has assigned elements and attributes. The template that
    builds from it either changes one or more elements and adds new elements and attributes.


    The most used parent style is Styles.Default. The PROC TEMPLATE code creates Styles.Default
    is quite long. The template contains most of the style elements needed by ODS.
    Not all of the elements attributes, but the element is usable by the destination.
    Sometimes, depending on the destination, Styles.Default is used if the style specified
    in the ODS statement cannot be found.


    Not all styletemplates with SAS have a parent template. For example, Styles.PowerPoint
    does not have a parent. That destination has specific requirements. Therefore,
    inheriting from a style for a different purpose would cause unwanted effects in
    the presentation.


    Custom style templates do not require a parent. Any style definition that does
    not have a parent automatically inherits from its style definition Base.Template.Style
    This behind-the-scenes contains all the'
