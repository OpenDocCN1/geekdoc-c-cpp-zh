    # 7.4.6 Style Attributes for Images


    These three destinations have much of the capability of Tagsets.ExcelXP and the
    OS destination for Excel. In earlier versions of SAS, the primary advantage of
    the HTML and MOffice2K destinations was that they allowed graphics. Graphics support
