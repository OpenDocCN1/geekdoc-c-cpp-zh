    SPANROWS has additional functionality in the PDF destination. When in effect,
    it allows GROUP and ORDER variables to repeat at the top of a page if the value
    breaks across pages. The PDF destination will try to keep all the grouped rows
    together, and will start the grouping on the next page instead of breaking in
    the middle of the rows. Therefore, depending on the margins, the data, and other
    factors, a group might split across pages in one report but not in another report.
    PDF is more likely to keep the grouping together and to prevent it from splitting
    across pages than the other destinations.'
