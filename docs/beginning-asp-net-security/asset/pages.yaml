    # Protecting Against ViewState Once Attacks


    ViewState validation ensures that no one can tamper with the contents, while optional
    ViewState ensures that no one can view the data. However, one vulnerability remains
    - replay attack. A replay attack occurs when an attacker takes a ViewState from
    a previous request and sends it at a later point, or under the context of the
    attacker.


    Often, viewState replay attack can be used in the flavor of Cross Site Request
    Forgery (CSRF) called a one-click attack, where a form is submitted via JavaScript
    to a vulnerable page. To do this, the attacker needs a valid ViewState that can
    be acquired by simply browsing to a page. Unfortunately, ViewState does not stop,
    the attack will work forever.


    In light of this attack, ASP.NET provides the ViewStateUserKey as a way to lock
    ViewState to a specific user or session. If this property is set, ASP.NET uses
    this value as part of the key checking and validation. This value is set to the
    username of a currently authenticated user, or if this is not available, the session
    identifier for the current session. This effectively locks the ViewState so that
    it cannot be in another session or by user. Using the session identifier also
    adds an expiration time to the ViewState when the session expires. You should
    be aware of this if your forms take a long time to complete. If the session expires
    as a user is submitting the form an exception will occur, because the ViewState
    will no longer be valid.


    Because theViewStateUserKey must be set before the ViewState is created (or loaded)
    and parsed, it must be set early in the page lifecycle, within the Init event.
    Generally, you will want to apply a ViewStateUserKey across every single page.
    There are several possible approaches, responding to the PreRequestHandlerExecute
    event global.asax, or by using a custom base class for all of your pages. The
    author''s permission is to respond to the event in global.asax, as shown in 5-2.'
