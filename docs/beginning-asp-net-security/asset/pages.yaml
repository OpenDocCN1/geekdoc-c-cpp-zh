  md: "Some enterprising developers have explored alternative ways to provide validation\
    \ both with the model (XVal, available from http://xval.codplex.com), and with\
    \ the action (Validator Toolkit for ASP.NET MVC, hosted at http://mvcvaluidatortoolkit.codplex.com/).\
    \ Both of these are free and Open Source, and provide extra, valuable tools for\
    \ validation.\n\n# AUTHENTICATION AND AUTHORIZATION WITH ASP.NET MVC\n\nASP.NET\
    \ MVC uses the same underpinnings as Web Forms for authentication, and supports\
    \ both Windows authentication and Forms authentication. In fact, the default MVC\
    \ site templates come with login, logout, and registration pages configured for\
    \ Forms authentication. (If you want more, you can look at the MVC Membership\
    \ Starter kit at http://mvcmembership.codplex.com/) However, implementing authorization\
    \ takes a little work.\n\n> NOTE Authentication and authorization for Web Forms\
    \ applications are covered in Chapter 7. If you haven't already read that chapter,\
    \ you should do so now, as this section assumes some familiarity with how ASP.NET\
    \ authenticates.\n\n# Authorizing Actions and Controllers\n\nWith Web Forms, authorization\
    \ was a simple matter of defining the authorization rules in the applications\
    \ web.config file as:\n\n```\n<location path=\"admin\">\n  <system.web>\n    <authorization>\n\
    \      <allow roles=\"Administrators\" />\n      <deny users=\"*\" />\n    </authorization>\n\
    \  </system.web>\n</location>\n```\n\nThis is for a file-based application, but\
    \ ASP.NET is not file-based — URLs do not map to a file, but to a route, and routes\
    \ map to a Controller. If you are careful, you can still use the old-fashioned\
    \ file-based authorization approach, but this is fraught with danger. Multiple\
    \ routes can access the same action and Controller, if you lock down a directory/file\
    \ combination, another route mapped to the action and Controller is accessed via\
    \ a different URL, and thus, will not be protected. Obviously, you must do authorization\
    \ differently. This is achieved by the [Authorize] attribute.\n\nThe Authorize\
    \ attribute is applied to Controllers or actions within them. For example, an\
    \ entire Controller were limited to only authenticated users, then you could apply\
    \ the attribute to the Controller, as shown here:\n\n```\n[Authorize]\nPublic\
    \ class MembersOnlyController : Controller\n```"
  merge: -1
  pgno: 394
- img_proc: true
  md: "If you want one or more actions in a Controller protected (for example, only\
    \ allowing authenticated users to create a thread on your bulletin board), you\
    \ can apply the attribute to the individual action methods, as shown here:\n\n\
    ```\nPublic class BoardController : Controller\n{\n    ActionResult Index()\n\
    \    {\n        ...\n    }\n    [Authorize]\n    ActionResult Create()\n    {\n\
    \        ...\n    }\n}\n```\n\nLike web.config authorization, you can also authorize\
    \ by roles and/or usernames, specifying multiple usernames or roles as, a comma-separated\
    \ list. You can also combine both role and username authorization, as shown here:\n\
    \n```\n[Authorize(Roles=\"Administrators\")\nActionResult Moderate()\n{\n}\n}\n\
    ```\n\n```\n[Authorize(Roles=\"olivers, steveharman\")\nActionResult Nuke()\n\
    {\nn}\n```\n\n# Protecting Public Controller Methods\n\nOccasionally, your Controller\
    \ may have publicly accessible methods. But, by default, the ActionResult (which\
    \ calls the method that was specified in your routing configuration) in this situation,\
    \ you can opt out methods on your Controller by using the [NonAction] attribute,\
    \ as shown here:\n\n```\n[NonAction]\npublic KeySet GetEncryptionKeys()\n```\n\
    \nRemember, all methods in your Controller are Web accessible. Either keep your\
    \ methods private, or, if necessity makes them public, decorate them with [NonAction].\n\
    \n# Discovering the Current User\n\nAs with Web Forms, the current user is accessed\
    \ through the User property of the request context. You can access this in your\
    \ Views and Controllers via the User property. For example, a View could show\
    \ or hide information based on a user's authentication status like:"
  merge: -1
