    expand the "Security" settings. The authentication options you would like to use.


    In Windows 2008, authentication is part of the role configuration. Using the Server
    Manager, add the "Web Server (IIS)" role. This will allow you to choose the various
    authentication methods. If you already installed IIS, you can expand the roles
    tree. Select "Web Server (IIS)" and then use "Add Role Services" to add the various
