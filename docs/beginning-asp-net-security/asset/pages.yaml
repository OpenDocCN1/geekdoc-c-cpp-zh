    # TRY OUT Creating a Claims-Aware Web Site


    In this exercise, you will create a Web site that contains a SAML token, and partner
    it with an installation of StartSTS. You will see StartSTS configured, and running
    with at least one username and password in its member database.


    +   1. Start Visual Studio and select File ⭞ Website. Select Claims-aware ASP.NET
    WebSite from the list of templates. This will create a new Web site containing
    two pages, default.aspx and login.aspx.

    2. Look closely at the result. At first glance, nothing looks out of place until
    you examine the web.config file. You will see a reference to Microsoft IdentityModel.
    This is the WIF. If you scroll down and look at the httpModules section of web.config,
    you will see a new entry, ClaimsPrincipalHttpClient. This module is responsible
    for taking the identity of the current request and turning it into an IClaimsPrincipal.
    If you are using Application Projects rather than Web sites you can simply copy
    these web.config entries into aeb.config for a Web Application Project to enable
    WIF.

    If you using Windows Authentication, WIF will transform that identity into WindowsClaimsPrincipal.
    If you use Forms Authentication, a ClaimsPrincipal class would be created. This
    transformation takes the properties of the original identity and transforms them
    into claims. A Windows identity would gain claims such as the Account Identifier,
    while a forms identity would gain claims such as the authentication.

    This common IClaimsPrincipal works with the old style IsRole(security) model,
    but provides the benefits of claims-based security. The major benefit of claims-based
    approach is that your application is no longer locked to a specific authentication
    method, be it Windows Authentication, forms authentication, or anything else.
    The ClaimsPrincipalModule understands whatever the token comes from outside your
    company, or from a non-Windows system, and change it into a standard class that
    you can use. You are ready to move from the backwards-compatible role security
    that IClaimsPrincipal, then roles will be replaced with the more granular authorization
    artifact claim.

    David Chappell has produced a white paper calledDigital Identity for .NET applications:
    A Technology Overview, which delves into the approaches, advantages, and challenges
    a claims-based identity system. You can download the white paper from http://msdn.microsoft.com/en-gb/library/bb88216.aspx.

