  md: "# Accessing Existing Files Safely\n\n```\nusing System;\nusing System.IO;\n\
    \npublic partial class getfile\n{\n    protected void Page_Load(object sender,\
    \ EventArgs args)\n    {\n        Response.Clear();\n        string filename =\
    \ Request.QueryString[\"filename\"];\n        FileInfo file = new FileInfo(Path.Combine(\n\
