    see that it is well-formed, creating a schema for it, and then validating against
    it:


    +   1. Create a web page or site. Replace default.aspx with the following:


    ```

    <@ Page Language="C*" ValidateRequest="false" %>

    <%@ Import Namespace="System.Xml" %>

    <!DOCTYPE html>

    <!-- "//W3C//DTD HTML 1.0 Transitional//EN">

    ```'
