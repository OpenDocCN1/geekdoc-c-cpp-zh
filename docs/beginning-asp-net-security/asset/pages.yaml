  md: '# A CHECKLIST FOR ENCRYPTION


    The following is a checklist of items to follow when choosing an encryption mechanism
    for your application:


    +   Choose an appropriate method for your situation— If your application must
    encrypt and decrypt the same data, choose a symmetric algorithm. If your application
    talks to an external system, choose an asymmetric algorithm.


    +   Use the appropriate integrity checks for your data— Encryption is not enough
    when to detect changes in data. Even unencrypted data may need a mechanism for
    detecting changes. Use hashing, MACs or certificate signing to give you the capability
    to check when data has changed.


    +   Choose your algorithm carefully— Some algorithms are now considered broken
    or easy to break. Use the recommended algorithms for your situation — SHA256 or
    SHA512 for hashing, and AES for symmetric encryption.


    +   Protect your keys— If your keys are compromised, so is your data. Store your
    key separately from your encrypted data, and tightly control access to them. Ensure
    that you have a secure, separate backup of your keys and certificates.


    +   Plan ahead for algorithm changes— As time passes, algorithms are proven unsafe.
    Plan ahead, and consider how you could change your algorithm, and how you could
    support older data.'
