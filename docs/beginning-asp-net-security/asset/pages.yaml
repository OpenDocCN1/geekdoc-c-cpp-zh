  md: "# .NET 4 Changes for Trust and ASP.\n\nVersion 4 of the .NET framework has\
    \ some major changes to the security model. As it stands, CAS is large and unwieldy\
    \ to configure, and can lead to confusing and unreliable behavior. With Version\
    \ 4, applications run with Full Trust as the default, and the hosting environment\
    \ uses the simple sandbox API to control permissions. For developers who wish\
    \ to host in a sandbox, this is a simpler.\n\n> NOTE This section is based on\
    \ Beta 1 version of the .NET 4 Framework. As any discussion based on beta software,\
    \ the information in this section is subject to change before release. The changes\
    \ in .NET 4 are large, and this section only covers those of immediate use to\
    \ ASP.NET developers. Shawn Farkas is probably the best recognized CAS expert\
    \ within Microsoft, and his blog http://blogs.msdn.com/shawnfa/ contains more\
    \ details on the upcoming changes, as well as a lot of useful discussion around\
    \ CAS internals.\n\nThe major change for ASP.NET developers is the capability\
    \ to avoid using the GAC to host Trusted assemblies. Like Silverlight, partially\
    \ trusted code in .NET 4 is securitytransparent. Unlike Silverlight, you can also\
    \ write Safe Critical code, which acts as a gatekeeper to actions that may have\
    \ security consequences as writing a file. Code that does very unsafe actions\
    \ (as calling the Windows API) will be Critical, and can only be called via Safe\
    \ Critical code. Listing 13.4 shows a typical Safe Critical block.\n\n# LISTING\
    \ 13: A safe critical code block in .Net 4.0\n\n```\n[assembly: AllowPartiallyTrustedCallers]\n\
    namespace MyApplication.WebAccess\n{\n    public class WebAccess\n    {\n    \
    \    [SecuritySafeCritical]\n        public string GetWebPage(string url)\n  \
    \      {\n            // Validate the requested url,\n            ...\n      \
    \      // If passed, continue\n\nWebPermission webPermission = new WebPermission(NetworkAccess.Connect,\
    \ url);\n            try\n            {\n                webPermission.Assert()\n\
    \                // Now retrieve the web page.\n            }\n    }\n}\n```\n\
    \ncontinues"
  merge: -1
  pgno: 331
- img_proc: true
  md: "# 328 | CHAPTER 13 UNDERSTANDING CODE ACCESS SECURITY\n\nLISTING 13-4 (continued)\n\
    \n```\ncatch (SecurityException)\n{\n  ...\n}\n}\n```\n\nThis may not look much\
    \ different, but within this Safe Critical code block is where you can provide\
    \ validation, security checks, and canonicalization of output. The other change\
    \ from the 1.0-3.5 model is that Safe Critical is an opt-process, which means\
    \ that any code not marked as Safe Critical in a trusted assembly will not be\
    \ allowed to perform functions.\n\nASP.NET gains the capability to select these\
    \ assemblies in Full Trust without the need to place them in the GAC. The web.config\
    \ has a new element, fullTrustAssemblies, which contains a list of assemblies,\
    \ their versions, and the public key from their strong name key pair. Following\
    \ is an example of that element:\n\n```\nfullTrustAssemblies\n<assemblyName=\"\
    MyTrustedLibrary\"\n  version=\"1.0.0\"\n  publicKey=\"0012...bbdb\" />\n</fullTrustAssemblies>\n\
    ```\n\nOf course, like any other configuration section in ASP.NET, an administrator\
    \ may not allow you to nominate your own assemblies as trusted. If you require\
    \ more flexibility in deciding trust levels for assemblies, you can write your\
    \ HostSecurityPolicyResolver, and decide trust levels based on the evidence provided\
    \ by each assembly.\n\n# A CHECKLIST FOR CODE NOT UNDER FULL TRUST\n\nThe following\
    \ is a checklist of items to consider when writing code that may not run under\
    \ Full Trust:\n\n+   Always code that requires CAS permissions with a demand.—\
    \ You should specify minimum permissions for your code, or gracefully, or disable\
    \ functionality if the demand fails.\n\n+   Place code that requires Full Trust\
    \ in a separate assembly stored in the GAC—GAC assemblies will always run as Full\
    \ Trust.\n\n+   Remember to allow partially trusted callers.— The .NET framework\
    \ will stop code hosted in partial trust environments from calling GAC assemblies,\
    \ unless you opt-in and mark your assembly with the AllowPartiallyTrustedCallers\
    \ attribute.\n\n+   Remember to use Demand/Assert in APTC assemblies.—This will\
    \ check the calling assemblies are allowed to perform the function. If you want\
    \ to override this, then remember that anyone can call a GAC assembly, unless\
    \ you add a StrongNameIdentityPermission."
  merge: -1
