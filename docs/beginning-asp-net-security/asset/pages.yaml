  md: '# CHAPTER 4 USING QUERY STRINGS, FORM FIELDS, EVENTS, AND BROWSER INFORMATION


    The base class for ASP.NET pages, Page, contains a property, Request of typeHttpRequest.
    When your Page class is created by ASP.NET, you have access to the Request property.
    It is initialized and contains the various inputs as part of the request, as well
    as other information provided by the ASP.NET run-time (as the identity of the
    user, whether the page has been requested over SSL, and so on). The Page class
    also contains a Response property that allows you to manipulate the response when
    your page has finished processing.


    # QUERY STRINGS


    Query string is a part of a URL that contains data to be passed to a Web application
    as part of a request. A question mark separates the query string from the address
    part of a URL (as defined in RFC1738 and RFC3986). A typical URL containing a
    query string would be as follows:


    ```

    http://site.example/path/page.aspx?querystring

    ```


    Generally, query strings are used to pass parameters to a page consisting of name=value
    pairs, with name separated from the value by an equals sign (=), and the pair
    separated from other pairs by an ampersand (&), as shown here:


    ```

    name1=value&name2=value&name3=value

    ```


    The name equals value plus plus is a convention set out in the HTML specification.
    It is by no means. The obvious problem with using a query string to pass data
    is that query strings are visible in the Web browser address. Tampering with the
    query string is a simple matter of typing.


    In 2007, the government of the United Kingdom (UK) introduced a new application
    system called the Medical Training Application Service (MTAS) for doctors who
    were requesting placements. A junior doctor using the system discovered that changing
    a query string parameter, he could view messages to other doctors offering jobs.
    The site and information exposed for eight hours. It was further discovered that,
    by manipulating the query string, personal information such as phone numbers,
    criminal convictions and even sexual orientation of applicants were available.
    The formal name for this type of vulnerability Insecure Direct Object Reference
    .


    The MTAS took a message identifier as one of the parameters. This message identifier
    was a direct object reference to an internal data record and, consisted of four
    digits assigned in consecutive order (for example, 0001, 0002, 0003). An attacker
    (or a normal user, in the case of MTAS) could tamper with the message identifier
    to access other messages. Usually, the reference to a unique reference within
    a database (or any exposed data construct) could be vulnerable to this type of
    attack.


    Another common error is specify filenames with query strings (or, indeed, any
    parameter). If an attacker passes c:\windows\system32\config\sam and your code
    does not check whether filenames are contained within their scope, the possibility
    exists that your application may serve up the Windows password database, the Security
    Accounts Manager (SAM) file, or a relative path such as ..\..\windows\system32\config\sam
    is provided, which breaks out of your


    ![](img/c28a05c0528daad8a392659cd26abcda_74_0.png)'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'application directory by using .. to navigate to the parent directory of the
    current directory. (This is known as a Path Traversal Attack.)


    > NOTEmittedly, this is a worst-case scenario. Most Web applications run in a
    security context that restricts them to a particular area on the Web server. For
    more information, see Chapter 9 and Chapter 14.


    The best protection against this attack is to avoid exposing direct references
    to objects such as files and database records in a query string or other parameter.
    Instead, use another key, index, map, or indirect method that is easy to validate.
    If a direct object reference must be used, then you must ensure that the user
    is authorized before using it.


    For example, consider a system that contains orders, and users have the capability
    to view their order status. Order numbers must be sequential, and the temptation
    is to have a URL such as the following:


    ```

    http://mysystem/viewOrder.aspx?orderID=10001

    ```


    Rather than using a direct object reference, you can mitigate against an insecure
    direct reference vulnerability by adding a new reference to the objects in the
    order class or order table — in a manner that is not incremental or easy to guess.
    Typically, a Globally Unique Identifier (GUID) is used. Your URL would look like
    the following:


    ```

    http://mysystem/viewOrder.aspx?

    orderID=E109F32-A533-42c7-A5FF-45F034C909E

    ```


    In addition, you must implement an access control (if appropriate) because GUIDs
    are only guaranteed to be unique, not difficult to guess, and, if used in a query
    string, could be discovered by an attacker looking through the browser history
    or log logs. In the orders scenario, you would typically not allow anonymous access
    to the page, and you would check that the user who is attempting to view the order
    is, in fact, the person who placed it, or a user within your company who is authorized
    to do so (such as an account manager or an employee responsible for fulfilling
    the order).


    In ASP.NET, query strings are typically used with the HyperLink control, or as
    part of the crosspage postback mechanism provided by the PostBackURL property
    on controls that can trigger postbacks.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# FORM FIELDS


    Hidden form fields are another method of embedding input in a page. A hidden form
    field is a type of form input that is not displayed to the user — example `<input
    type="hidden" name="example" value="hidden" />`. A user (or an attacker) can only
    see these fields by viewing the source of an HTML page.


    Because the field is hidden from view it is tempting to assume that the values
    set in these fields do not change. But this would be a mistake.


    Shopping cart software has typical culprit trusting in the immutability of hidden
    form fields. In 2000, the Common Weakness Enumeration site (http://www.mitre.org/)
    listed fie shopping cart allowed price modifications where the price for individual
    items was exposed in a hidden form field. In that year, the Lyric List Manager
    allowed subscribers to obtain administrator access to the Web control panel by
    modifying the value of the `list_admin hidden form field.


    The mitigation for this vulnerability (known as External Control of Assumed Input
    Web Parameter in the Common Weakness Enumeration Database, a dictionary of common
    software flaws available at http://www.mitre.org/) is simple — never assume hidden
    form field values, or, indeed, any client-side parameter will change. Furthermore,
    never store data that you don''t want the user to know (like system passwords
    or cryptographic keys) inside a hidden form field.


    In ASP.NET, you can pass data between postbacks in a special hidden field called
    `ViewState`. This does not free you to put secrets into `ViewState` because, by
    default, `ViewState` is not encrypted. It is, however, protected against tampering
    by default. `ViewState` is covered in detail in Chapter 5.


    > WARNING The `Request` class allows you to access input by its name — for example
    `Request["example"]`. This method of accessing your input should be avoided at
    all costs because the `Request` indexer first checks the query string, then form
    variables, then cookies, and finally server variables to supply the named input.
    If there are duplicate input names in any of these locations, the first matching
    input will be returned, with no indication of where it came from and no indication
    if there are more matches. It is safest to be specific when looking for input,
    and to use the `Request.Query`, `Request.Form`, `Request.Cookies` and `Request.ServerVariables`
    collections.'
  merge: -1
