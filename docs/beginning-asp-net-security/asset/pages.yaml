  md: "```\ndefaultProvider = \"MyCustomRoleProvider\"\ndomain = \"*\"\n<providers>\n\
    \  <add name=\"MyCustomRoleProvider\"\n    connectionString=\"MyConnectionString\"\
    \n    applicationName=\"/\"\n    type=\"System.Web.SqlRoleProvider,System.Web,\n\
    Version=2.0.0.0,Culture=neutral,\nPublicKeyToken=b03f5f7f11d50a3a3a\" />\n</providers>\n\
    </roleManager>\n<system.web>\n```\n\n# ### TABLE 75: The <roleManager> Element\
    \ Attributes\n\n| ATTRIBUTE | DESCRIPTION |\n| --- | --- |\n| enabled | Iftrue,\
    \ the role manager is enabled. |\n| cookieName | This is the name of the cookie\
    \ used by the role manager. By default, this is .ASPXROLE. This can be used to\
    \ separate multiple applications within the Web site, like the path setting. |\n\
    | createPersistentCookie | Specifies if the role manager cookie should be persistent.\
    \ This is not advisable for security reasons. |\n| cacheRolesInCookie | Defines\
    \ the roles for a user can be cached in the role manager cookie. ASP.NET does\
    \ not have to retrieve roles with every request. However, it is more insecure.\
    \ If the cookie protected against changes, then attackers could edit their cookie\
    \ to put themselves into a role. If the cookie is not encrypted, attackers could\
    \ view the roles they are in. |\n| path | Specifies the path for the role manager\
    \ cookie. The default value is /, and it is unlikely you will want to change this.\
    \ If you have multiple Web applications running on a single site (for example\
    \ http://example.com/app1/ and http://example.com/app2/) and you want to have\
    \ a user login separately for each application, then you can set the path to match\
    \ the directory containing your application. |\n| cookieTimeout | Specifies the\
    \ amount of time (in minutes) a role manager cookie lasts for. The default value\
    \ is 30 minutes. |\n| domain | Specifies the domain name for the role manager\
    \ cookie. |\n| cookieSlidingExpiration | If settrue, the role manager cookie expiry\
    \ will be reset with every request. |\n| requireSSL | Specifies if the role manager\
    \ cookie can only be transmitted over SSL connections |"
