    In addition to HTML tags, some HTML attributes can be used in an XSS attack. For
    example, if you decide to use img tags, the src attribute can be used to inject
    code — for example, `<img src=javascript:window.alert(''Hello XSS\''); />`.


    The obvious approach to fixing this problem would be to search for javascript
    within your input and remove it. Using your list of unsafe strings frees to produce
    a blacklist of disallowed values, as the XSS Cheat Web site previously mentioned
    shows, this is not sufficient. The following examples would bypass a simple check
    for the javascript keyword:


    ```

    <img src=java00;script:window.alert(''Hello XSS\''); />

    <img src=java&script:window.alert(''Hello XSS\''); />

    ```


    These work by encoding a return character within the JavaScript command, which
    many browsers will strip out and parse. HTML tags also contain events as OnClick
    or MouseOver that can also be used to contain and run scripts.


    > Never rely on sanitizing input by blacklisting or filtering undesired values.
    This can be easily bypassed. Instead, use a whitelist approach, allowing known,
    safe values.


    The version 3.1 of the AntiXSS library comes with two methods, GetSafeHtml and
    GetSafeHtml, which sanitize HTML by stripping out HTML elements or attributes
    that are not contained in its internal whitelist. If you are using a rich text
    editor, it may also offer some form of sanitation for any content entered into.
    If you use the AntiXSS library, or any third-party controls, it is important that
    you monitor these utilities for security updates by subscribing to any mailing
    lists or RSS feeds about them, and apply security patches as soon as you can,
    after testing that the versions do not break your Web application.


    # Protecting Cookies


    In 2002, with the release of Service Pack 1 for Internet Explorer 6, Microsoft
    introduced the concept of HTTPOnly cookies because most XSS attacks target session
    cookies. This optional flag is set when a cookie is created, and limits the use
    of cookies to server-side scripts. Obviously, by removing the capacity to read
    (and writing, on the browser) the cookie in client-side JavaScript, the cookie
    cannot be stolen by an XSS attack. If an attempt to read the cookie is made, an
    empty string or null is returned. If a browser does not support the HTTPOnly flag,
    it is ignored, and the cookie (in that browser) is accessible to client-side scripts.
    Currently, HTTPOnly cookies can be read from an XMLHttpRequest, which is used
    for Ajax scripts in most browsers — only Firefox 3.0.0 and later supports'
