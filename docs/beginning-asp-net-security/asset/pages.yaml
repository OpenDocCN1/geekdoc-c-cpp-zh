  md: "# RoleBased Authorization\n\nAs you may realize, configuring access by listing\
    \ every single user your Web site may have is not a scalable solution, nor is\
    \ it best practice. Instead, you should use role-based authentication. Roles are\
    \ containers for any number of users. For example, a forum application may have\
    \ a role of Moderators who are allowed to hide or close threads. You can use roles\
    \ to allow or deny access to a directory of resources using the roles attribute,\
    \ and you can programmatically check role membership during the execution of your\
    \ code.\n\n# Configuring Roles with Forms-Based Authentication\n\nTo enable roles\
    \ for authentication, you simply set the enabled attribute for the roleManager\
    \ element in web.config to be True, as shown in Listing 712. It is disabled by\
    \ default to avoid breaking changes for users migrating from ASP.NET 1.0.\n\n\
    +   LISTING-712: Enabling roles for forms authentication\n\n```\n<xml version=\"\
    1.0\"?>\n<configuration>\n  <system.web>\n    <roleManager enabled=\"True\" />\n\
    \    <authentication mode=\"Forms\" />\n    <authorization>\n      <deny users=\"\
    /\" />\n    </authorization>\n  </system.web>\n</configuration>\n```\n\nThe roleManager\
    \ provider acts lot like the membership provider — you can let ASP.NET create\
    \ the database for you, using the aspnet_regsq utility to configure an existing\
    \ database. If you are using an existing database, you must add a providers element\
    \ to the roleManager section in your web.config file to use your connection string,\
    \ and then define your new provider name, as shown in Listing 7-13. The roleManager>\
    \ element also allows configuration of various settings, as shown in Table 7-5.\n\
    \n+   LISTING-7-13: Configuring the role manager for a custom connection string\n\
    \n```\n<system.web>\n  <roleManager\n    enabled = \"true\"\n    createPersistentCookie\
    \ = \"false\"\n    cacheRolesInCookie = \"false\"\n    cookieName = \"ASPXROLES\"\
    \n    cookieTimeout = \"30\"\n    cookiePath = \"/\"\n    cookieRequireSSL = \"\
    false\"\n    cookieSlidingExpiration = \"true\"\n    cookieProtection = \"All\"\
    >\n```"
  merge: -1
