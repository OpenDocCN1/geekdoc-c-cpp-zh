- img_proc: true
  md: "```\nPerformanceCounter badGuysFoundPerSecond =\nnew PerformanceCounter(\"\
    SecuringASPNet\",\n\"BadGuysFoundPerSecound\",\n\"My Instance Name\",\nfalse);\n\
    ```\n\nLike, performance counters can be used for positive purposes such as the\
    \ number of new users registered on your Web site. Changing the value of a performance\
    \ counter requires that your Web application runs in Full Trust. (Chapter 13 discusses\
    \ trust levels, and the various ways you can place elements in Full Trust while\
    \ leaving the majority of your application in a lower trust level).\n\n# UsingWMI\
    \ Events\n\nThe Windows Management Interface (WMI) is another standard feature\
    \ of Windows. It is the Microsoft implementation of Web-Based Enterprise Management\
    \ (WBEM), a standard used to watch and control devices and software on a network.\
    \ Because it is standards-based, monitoring of WMI information is not just limited\
    \ to Microsoft software (as is the case with Hewlett Packard, Tivoli from IBM,\
    \ and you can use with other management tools such as OpenView or Open Pegasus)\n\
    \nWMI works on a provider/consumer model. Aprosider describes itself using Managed\
    \ Object Format (MOF) and its availability in the WMI repository (the Common Information\
    \ Model, or CIM, database) via the CIM Object Management (CIMOM). Consumers can\
    \ query the WMI repository registered by providers to contact the providers and\
    \ retrieve the information requested.\n\nTo create a WMI event, you add a reference\
    \ to the System.Management assembly to your project, then create a class for the\
    \ event, and inherit from BaseEvent in the System.Management.Instrumentation class.\
    \ You provide information by adding fields to your class, as shown in Listing\
    \ 5-5.\n\n# LISTING 5: A Sample WMI Event Class\n\n```\nusing System.Management.Instrumentation;\n\
    \nnamespace WMIEvents\n{\n    public class BadGuyDetectedEvent : BaseEvent\n \
    \   {\n        public bool HasMoustache;\n\n        public BadGuyDetectedEvent(bool\
    \ hasMoustache)\n        {\n            this.HasMoustache = hasMoustache;\n  \
    \      }\n    }\n}\n```"
  merge: -1
  pgno: 114
- img_proc: true
  md: "To fire the event, create an instance of your event and call the Fire method\
    \ provided the base class, as shown here:\n\n```\nBadGuyDetectedEvent badGuyDetectedEvent\
    \ = new BadGuyDetectedEvent(true);\n\nBadGuyDetectedEvent.Fire();\n```\n\nAs mentioned,\
    \ a WMI event must be registered in the CIM database. Like performance counters,\
    \ the .NET framework provides a special installer class, DefaultManagementProjectInstaller,\
    \ to help you register your events. This installer class extracts your assembly,\
    \ the MOF file for your custom events, and registers the class with WMI. In addition\
    \ to adding the installer class to your assembly, you must specify the WMI namespace.\
    \ The namespace is specified using an assembly attribute, as shown here:\n\n```\n\
    [assembly: Instrumented(\"root/SecureDevelopment*\")]\n```\n\nThe installer is\
    \ created by adding an empty installer class, as shown in Listing 5-6.\n\n# LISTING\
    \ 5-6: A Sample WMI Installer Class\n\n```\nusing System.ComponentModel;\nusing\
    \ System.Management.Instrumentation;\n\nnamespace WMIEvents\n{\n    [RunInstaller(true)]\n\
    \    public class ProviderInstaller: DefaultManagementProjectInstaller\n    {\n\
    \    }\n}\n```\n\nYou should include all your WMI classes in a separate assembly.\
    \ With an installer class in the assembly, you can use InstallUtil or a custom\
    \ MSI to set up your events.\n\n# Another Alternative: Logging Frameworks\n\n\
    The event log, performance counters, and WMI are not for everyone because of the\
    \ administrative requirements needed to configure log events to a database. There\
    \ are few libraries for doing this, including the built-in ASP.NET Health Monitoring\
    \ Framework, Microsoft's Enterprise Logging Application Block, and log4net (a\
    \ port of a popular log4j framework). Generally, logging frameworks offer a selection\
    \ of targets for their output (the Windows Event Log, files, emails, and databases),\
    \ as well as the capability to develop new targets, should arise. A third party\
    \ framework may provide the flexibility you need to log in a restricted environment.\n\
    \nThe following examples utilize one of the most commonly used frameworks, log4net.\
    \ You can download log4net is from http://logging.apache.org/log4net/."
  merge: -1
  pgno: 115
- img_proc: true
  md: "To use log4net, download and unzip the installation package. Add reference\
    \ to the log4net assembly to your project by right-clicking on your project in\
    \ Solution Explorer, choosing Add Reference, and then browsing to bin/net/2.0/\
    \ subdirectory of the unzipped package.\nThe next step is to create a configuration\
    \ file for log4net, which defines what will be logged and how it will be logged.\
    \ For this example, for the sake of simplicity, we will configure log4net to use\
    \ a file. In a real-scenario, the log file will be stored outside of your Web\
    \ application directory, and access to it will be strictly controlled. Alternatively,\
    \ another logging destination (such as a SQL Server database) will be used, again\
    \ with strict controls on which user can view the log.\nAdd a new file to your\
    \ solution log4net.config and enter the contents of Listing 5-7.\n\n# Listing\
    \ 5. A Sample log4net.config File\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    \ ?>\n<root>\n  <level value=\"DEBUG\" />\n  <appender-ref ref=\"FileAppender\"\
    \ />\n</root>\n<appender name=\"FileAppender\" type=\"log4net.Appender.FileAppender\"\
    >\n  <file value=\"log4net.log\" />\n  <appendToFile value=\"true\" />\n  <layout\
    \ type=\"log4net.Layout.PatternLayout\">\n    <conversionPattern value=\"%date\
    \ [%thread] %-5level logger - %message [%exception]%newline\" />\n  </layout>\n\
    </appender>\n```\n\nThis configuration will log everything sent through log4net\
    \ to a file named log4net.log. You should note that a file with an extension of\
    \ .log will not be served by browsers by IIS.\nYou now need to add code to initialize\
    \ log4net when your application starts. Add a new Global Application class to\
    \ your project and add the following method to it:\n\n```\nprotected void ConfigureLogging(\n\
    {\n  string logFile = HttpContext.Current.Request.PhysicalApplicationPath +\n\
    \    \"\\log4net.config\";\n  if (System.IO.File.Exists(logFile))\n{\n    log4net.Config.ConfigureAndWatch(\n\
    \      new System.IO.FileInfo(logFile));\n  }\n}\n```\n\nNext, you must add a\
    \ class to this method in the Application_Start method in the Global Application\
    \ class."
  merge: -1
  pgno: 116
- img_proc: true
  md: "# 110 | CHAPTER 5 CONTROLLING INFORMATION\n\n```\nprotected void Application_Start(object\
    \ sender, EventArgs e)\n{\n    // Code that runs when the web application starts.\n\
    \    this.ConfigureLogging();\n}\n```\n\nlog4net will be used in your pages and\
    \ classes. So let's write a demonstration page that shows how to use log4net's\
    \ logging. Open the default.aspx file in your project, and replace the contents\
    \ with the following:\n\n```\n@@ Page Language=\"C#\" AutoEventWireup=\"true\"\
    \ %>\n@@ Import Namespace=\"log4net\" %>\n<script runat=\"server\">\n    protected\
    \ static readonly log log = LogManager.GetLogger(System.Reflection.MethodBase.GetCurrentMethod().DeclaringType());\n\
    \n    protected void OnClick(object sender, EventArgs e)\n    {\n        if (!string.IsNullOrEmpty(log.Text))\n\
    \        {\n            log.Debug(log.Text);\n        }\n    }\n</script>\n<!DOCTYPE\
    \ html PUBLIC \"-//W3C//DTD HTML 1.0 Transitional//EN\"\nn\"http://www.w3.org/TR/xhtml/DTD/xhtml-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head runat=\"server\">\n<title>Simple\
    \ Logging</title>\n</head>\n<body>\n    <form id=\"logTest\" runat=\"server\"\
    >\n<div>\n    Log Entry: <asp:TextBox Id=\"logTest\" Text=\"\" runat=\"server\"\
    \ />\n    <asp:Button Id=\"submit\" Text=\"Submit\" runat=\"server\" OnOnClick=\"\
    submit_OnClick\" />\n</div>\n</form>\n</body>\n</html>\n```\n\nThis page gets\
    \ an instance of the logger configured during application start by calling Get()\
    \ and passing in the name of the class creating this. The name is automatically\
    \ discovered by reflection:\n\n```\nprotected static readonly log log =\nLogManager.GetLogger(System.Reflection.MethodBase.GetCurrentMethod().DeclaringType());\n\
    ```"
