    When the response has been received, you will be in the form of a .cer file. Save
    this file to the Web server, and then use the IIS Administration Manager. Select
    the Certificates option for the server, and choose the Complete Certificate Request
    menu. You will be prompted for the path to the .cer file and a friendly name (which
    is a local name you can use to identify the certificate). I usually use the name
    of the site and the year in which the certificate was created. When the certificate
    is imported, it will be available for use.


    Each time you should back up the certificate, in case you need to rebuild your
    operating system, or to move it to a new machine. To back up certificates, follow
    these steps:


    +   1. Select the Server Services in the IIS Manager.

    2. Select the certificate you wish to back up.

    3. Choose Export from the Actions menu.

    4. Enter a filename (which will have a .pfx extension) and a password (which is
    necessary for the exported file will contain both the private and public key for
    the certificate).


    Once you have backed up the certificate, store it in a safe place where you can
    recover it, should the Web server crash need rebuilding.'
