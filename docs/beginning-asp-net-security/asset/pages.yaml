  md: '# 13


    # Understanding Code

    Access Security


    .NET framework has two major security mechanisms: role-based security and code
    access security (CAS). Both of these features are threaded throughout the .NET
    framework. CAS ensures that code does not perform actions or access resources
    it should not be able to, and provides an extra layer of safety runs on top of
    the operating system security functions. The environment in which your application
    runs can be configured to only allow a subset of the full .NET framework functionality.
    It is important that you know how to properly request permissions at run-time,
    rather than assuming your application has access to everything a can do.


    In this chapter you will learn about the following


    +   - What CAS is

    - How to ask for permissions in your code

    - How CAS and the ASP.NET trust levels fitgether

    - How the Global Assembly Cache (GAC) affects trust


    > NOTE This chapter covers the basics of CAS. This is a wide-ranging system that
    touches on TestCase, plug-in architecture, isolation of third-party components,
    and other things that you may end up requiring as your applications become more
    advanced. If you want to know more, MSDN has an entire section on CAS at http://msdn.microsoft.com/en-us/library/930b76w0.aspx.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# UNDERSTANDING CODE ACCESS SECURITY


    Traditionally, software runs using the operating system-level identity, and permissions
    of the user who executes the program. But, in today''s world of mobile code, where
    software can come from the Internet or other networks, this approach requires
    enhancement. Java and ActiveX both provide a sandbox (that is, an isolated environment
    in which programs run) that acts as a security boundary between running code and
    the sensitive resources on the computer.


    The .NET Framework uses Code Access Security (CAS) to provide an optional sandbox
    for managed code. CAS is used to limit access to resources that have protected
    resources and operations, regardless of the user of the running program.


    For example with a non-CAS program as Notepad, an Administrator could write a
    file to C:\Windows because his or her account has permission to do so, and no
    restrictions are placed on the Notepad program. A CAS-enabled text editor, could
    have restrictions set upon it—for example, it may not be allowed to write to C:\Windows.
    Even though the Administrator has the capability to write files to C:\Windows,
    it would fail when it attempts to save a file to location.


    Normally, when you run a .NET application on your desktop, it runs in Full Trust.
    (Full Trust is a term used in .NET security that all CAS checks will pass—that
    is, it has all permissions.) The default configuration for IIS also hosts .NET
    applications in Full Trust, as does Visual Studio''s built-in web server. This
    can change in a shared hosting environment, or any locked-down configuration.
    You have three options for dealing with this type of situation:


    +   - You can specify a minimum set of permissions without your code will not
    run.


    +   - You can design your application so that code requiring more privileges (for
    example, data access) will be placed in its well-tested assembly. This isolated
    assembly as be granted the elevated permissions, reducing the exposure of the
    application as a whole.


    +   - You can fail gracefully, and disable certain application functions if you
    do not have the necessary permissions.(For example, you might disable file uploading
    if you do not have the permission to write to the local file system).


    CAS identifies code on its origin, publisher, string name, or other types of evidence.
    Based on the identity of the code, CAS assigns permissions by consulting the .NET
    security policies. In ASP.NET, CAS can be leveraged by assigning trust levels.
    Trust levels are used to restrict the functionality availability to a Web site.
    Code running in Web site A may require more permissions than code running in site
    B on the same machine. If you are writing code that runs on a Web server you do
    not control, then you cannot assume that you can wander around freely. You will
    know how to evaluate what you can do, and fail gracefully, or disable functionality.


    It''s important to note that CAS runs alongside the operating system security,
    as shown in Figure 13-1.


    ![](img/c28a05c0528daad8a392659cd26abcda_320_0.png)


    FIGURE 13-1: How CAS and OS security mesh'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'At this point, the operating system checks to see if the user running the program
    has the appropriate Windows permissions to write the file in the specified directory.
    If the user does not have permission then Windows will deny access, and the .NET
    run-time will throw an unauthorized access exception. If the user has permission
    from Windows to write the file then the file will be written.


    Table 13-1 provides a breakdown of the CAS permission classes in the .NET framework.


    # Table 13-1: The .NET Framework Code Access Permission Classes


