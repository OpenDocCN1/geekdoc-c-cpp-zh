  md: '# CHAPTER 4 USING QUERY STRINGS, FORM FIELDS, EVENTS, AND BROWSER INFORMATION


    A common mistake made when dealing with browser information is to trust it implicitly.
    Like everything from the client, browser information can be faked or removed.
    For example, the Referer header (the spelling mistake of “Referrer” is now enshrined
    in the HTTP standards) commonly stripped by some browser software. This is supposed
    to contain the URL of the page that referred the request, either via a link or
    a form submission. For example, if http://www.wrox.com/example.html contained
    a link to http://www.example.com/ then, when the link is clicked, the browser
    populates the Referer header with http://www.wrox.com/example.html.


    However, as you discovered in Chapter 2, you can make requests with any value
    you want. A common spam tactic is to send requests to blogs, which blindly display
    referer information for their pages. These requests contain a Referer header that
    points to the Web site you are promoting. The blogging software will then believe
    the information and display it.


    Matt''s Mail Script is a Perl email script developed by Matt Wright and used on
    many Common Gateway Interface (CGI) driven sites. Initially, when the Internet
    was generally free of mischief, the script would then take its input from form
    fields. As you have discovered, this is not wise any more. Spammers realized that
    Matt''s script worked (the source is freely available). The spammers wrote software
    that looked the script, and then created requests that sent out spam emails through
    it. When this started, one of the lines of defense was checking the Referer header,
    on the assumption that a real Web request would contain a Referer Header. This
    worked for a while, until spammers changed their spam software to fake the Referer
    to the Web site hosting the script, which then passed the checks, at which point
    the spam flowed through the script again.


    ASP.NET also defends against a header-splitting attack. This attack happens when
    an attacker includes extra carriage return or line feed characters in a request,
    which can cause an application to return two responses, the second under the control
    of the attacker. This protection is enabled by default, but can be disabled by
    setting the enableHeaderChecking attribute on the httpRuntime application''s web.config
    file. This setting is there for the rare occasions when your application may need
    to use header continuation and performs its own checks – a very unlikely scenario.
    So leave header checking turned on!


    > NOTES You can read more about the details of this attack in Amit Klein''s whitepaper
    “Divide and Conquer: HTTP Response Splitting, Web Cache Poisoning Attacks, and
    Related Topics,” available from http://www.packetstormsecurity.org/papers/general/whitepaper_httpresponse.pdf.


    This should demonstrate to you that every input should be validated.'
  merge: -1
