  md: '# # 7 Adding Usernames and Passwords


    Authenticating and authorizing users is an important part of most Web sites. In
    traditional desktop applications, if needed, authentication and authorization
    tend to utilize the current user''s Windows credentials. When writing Web applications,
    you had to roll your own username and password system, and provide a login form,
    or use HTTP authentication, which, in turn, used Windows authentication to authenticate
    users. You would implement authorization mechanisms throughout your code to protect
    your resources.


    ASP.NET introduced a framework for these common functions to provide you with
    a framework for authentication and authorization. The authentication providers
    allow you to store usernames and passwords in a database or via web.config file,
    or let IIS take care of it, using the Windows username and password facilities.
    The authorization side allows you to control access to pages, classes, and even
    methods based upon a user''s identity. ASP.NET also provides server-side controls
    for forms-authentication, a login form, a registration form to create new users,
    reset passwords, and many of the other common functions a Web site.


    In this chapter, you will learn about the following:


    +   - Discovering the current user

    - Authentication with the forms membership provider

    - Authentication with the Windows membership provider

    - How to limit access to parts of your Web site to particular types of user

    - Using code to limit access to resources on your pages


    Before you begin, you must first understand the difference and the connection
    between authentication and authorization.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# CHAPTER 7 ADDING USNAMES AND PASSWORDS


    > > NOTE Badly written authentication processes fall under the OWASP vulnerability,
    "Broken Authentication and Session Management."


    Writing an authentication system is difficult to do correctly. ASP.NET provides
    a proven solution for authentication — protecting passwords correctly, allowing
    you to configure password strength, managing how the system knows who a user is
    in a secure manner, and all the other things you might forget if you wrote an
    authentication system for the first time.


    The ASP.NET authorization functions allow you to avoid the "Failure to Restrict
    URL access" by setting authorization rules and, and if you add appropriate checks
    into pages use database records, files or other resources, you can protect yourself
    against "Insecure Direct Object Reference" vulnerabilities.


    # AUTHENTICATION AND AUTHORIZATION


    Authentication the process determines the identity of a user. Once a user has
    authenticated, a system can decide if the user is authorized to continue. Without
    knowing who a user is, authorization cannot take place.


    For example, when you start your computer and log in to Windows, you use your
    username and password. When your identity has been determined, Windows will then
    check to see if the identity can access the computer (by checking to see if the
    identity is in the Users group). If the identity is authorized, login continues.
    If not, the login process will show an error dialog, stop, and return to the initial
    login session. Furthermore, throughout your session, other authorization checks
    will take place. For example, if you are not an Administrator, you cannot install
    software or manage the users on your computer.


    # DISCOVERING YOUR OWN IDENTITY


    Every request to ASP.NET has an identity associated with it, even if authentication
    does not take place. This identity can be accessed via the Page.User property.
    Listing 7-1 explores this property


    +   LISTING-7: Exploring the user property


    ```

    <@ PageLanguage="C#"

    <!DOCTYPE html>

    PUBLIC "-//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/dtd/xhtml1-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <title>Discovering Identity</title>

    </head>

    ```'
