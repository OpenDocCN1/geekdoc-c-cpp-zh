  md: "# Using the Windows Identity Foundation to Accept SAML and Information Cards\n\
    \nin the same way you would check roles that came from Forms or Windows authentication,\
    \ either programmatically or using principal demands.\n\nThe claim used to populate\
    \ the name of the user is configured when you create the SamlSecurityTokenRequirement\
    \ object, as shown in Listing 15-2.\n\n+   LISTING 15-2: Configuring the claims\
    \ in the creation of the user principal\n\n```\nSamlSecurityTokenRequirement samReqs\
    \ =\nnew SamlSecurityTokenRequirement(\n{\n  NameClaimType = IdentityConstants.ClaimTypes.PPID\n\
    \  RoleClaimType = \"http://schemas.wrox.com/aspnet/2009/05/roles/*\n```\n\n#\
    \ Working with a Identity\n\nSystem.IdentityModel.ClaimTypes contains properties\
    \ that return the standard claim types defined in the Information Card specifications.\
    \ The Information Card foundation has these and other standardized claims listed\
    \ on their catalog, found at http://informationcard.net/resources/claim-catalog.\
    \ If you want to retrieve a specific claim from an ClaimsPrincipal, you can extract\
    \ the value of a particular claim using Linq, as shown in Listing 15-3.\n\n+ \
    \  LISTING 15-3: Extracting a specific claim from an IClaimsPrincipal\n\n```\n\
    IClaimsIdentity cid = (IClaimsIdentity)principal.Identity;\nClaim firstName =\
    \ (from claim in cid.Claims\n  where claim.ClaimType ==\n  System.IdentityModel.ClaimTypes.GivenName\n\
    \  select claim).FirstOrDefault();\n```\n\nOnce you have the claim, you can process\
    \ them however you want. Normally, if you have an existing authentication system,\
    \ you would use a unique claim from the token, such as a PPID from an Information\
    \ Card or email address in combination with the issuer.\n\nYou may ask why a claim\
    \ is not enough. It is perfectly possible to secure a token that issues issued\
    \ cards and a PPID that one already have. However, each SAML token is signed,\
    \ and you can use this signing key to identify where the token has come from.\
    \ This token issuer and is set by the IssuerNameRegistry class. The SimpleIssuerNameRegistry\
    \ used in the Information Card also contains the name from the SAML certificate\
    \ that it uses for managed cards, or the generated RSA key to use self-issued\
    \ cards. By combining the unique claim and the issuer, you will have a unique\
    \ combination of identity and issuer you can use to validate a user.\n\nIf you\
    \ are accepting SAML from a federated identity provider or Information Cards from\
    \ a STS, and roles are enabled in your application, WIF will provide the principal\
    \ roles from any claims that are of the role type http://schemas.microsoft.com/ws/2008/06/identity/claims/role."
