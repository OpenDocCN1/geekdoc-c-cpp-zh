  md: '# 4 Using Query Strings, Form Fields, Events, and Browser Information


    Input arrives into your Web application from various sources. Chapter 3 discussed
    how you should treat input, how input should be considered untrustworthy by default,
    how you can validate it, and how you can output it safely. This chapter introduces
    some of ways input can arrive, the vulnerabilities each of these vectors are susceptible
    to, and how you can mitigate against them.


    In this chapter, you will learn about the following:


    +   - How to pass input via query strings

    - How to use form fields

    - How forms can be hijacked

    - How the ASP.NET event model works

    - How to avoid common mistakes with browser information


    # USING THE RIGHT INPUT TYPE


    HTTP allows input into your application in the following four ways:


    +   - The query string

    - Form fields

    - HTTP headers

    - Cookies'
  merge: -1
