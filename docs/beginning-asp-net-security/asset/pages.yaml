  md: '# Controlling Information


    Once your application has accepted data from the user (even if it is a request
    to display

    page), your application must generate output. You have already seen how to validate

    input, and how to sanitize it for output. However, there are unexpected ways that
    sensitive

    information about your application can be leaked.


    In this chapter, you will learn about the following:


    +   - How information can be leaked with ViewState

    - How to secure and encrypt with ViewState

    - Strategies and approaches for error logging

    - Other ways information can become exposed


    # CONTROLLING VIEWSTATE


    One of the features of ASP.NET Web forms is the event model, which turns actions

    (such as clicking a button, or changing the selected item in a list) into server-side
    events, an

    approach that matches Windows Forms programming. To support this model, Microsoft

    introduced ViewState, a mechanism whereby pages maintain their state over multiple
    client

    requests and responses. When a property is set on a control, the control can save
    the property

    value into its control''s state. Each control''s state is added into the ViewState
    for a page,

    which is sent by the server and returned by the client form field such as the

    following:


    ```

    <input type="hidden" name="VIEWSTATE" id="__VIEWSTATE"

    value="/EPDWUKMTcmMzQ5dnCyMGQYAUeX19Db25cm9scIj1ccVXQQb3N0Qg9Mja04tleV9f

    FFgL20bDAWJeHaW5BQgGfJIUhhbvrclCIRfZG0bIkQ29tbWudfJf2gGl1VnQODG9uBS9jGww

    ```'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# CHAPTER 5 CONTROLLING INFORMATION


    *


    ViewState has advantages and disadvantages. When added to a page, ViewState grows
    and can callid to a page size, affecting the speed at which a page is loaded and
    rendered by a client. However, without it, would not support event-driven programming
    model, and controls when a page is reloaded. ViewState is a property bag. You
    can utilize it to store values you passed along with every request by accessing
    the ViewState property in the Page class, as shown in the following example


    ```

    ViewState["Example"] = "wxyz";

    ```


    Looking at this example example, you might think that the data is encrypted because
    you cannot decode it. Instead, it does not appear to contain any names or values.
    But it is obviously not clear text. Instead, in the previous example, the ViewState
    value is Base64-encoded. Base64 encoding takes binary data and translates it into
    a text-based representation in base 64 — 64 characters was the maximum subset
    that most character sets shared and that were printable. This combination leaves
    a Base64 encoding data stream unlikely to be modified altered in transit through
    legacy systems such as each.


    You can perceive it as translating from one representation to another, or like
    taking a word in English and translating it into French. If someone who does not
    know French sees it translated (or encoded) text, he or she may assume that it
    is meaningless, or gibberish. However, someone who knows both English and French
    will be able to translate and decode the French version into English.


    Encryption works differently. It takes values and locks them using a key that
    only key holders can open. While it may be possible for observers to know what
    type of lock is used, they cannot view the encrypted data without having the key
    in their possession.


    BecauseViewState is only encoded by default, it can be decoded by any application
    that understands how to decode Base64 data. Fritz Onion (one of the founders of
    Pluralsight, an organization delivering technical content and training, and a
    frequent contributor to ASP.NET conferences and MSDN magazine) has written such
    a utility, called ViewState Decoder (Figure 5-1). It is available from http://www.pluralsight.com/community/media/p/5168.aspx.'
  merge: -1
  pgno: 95
