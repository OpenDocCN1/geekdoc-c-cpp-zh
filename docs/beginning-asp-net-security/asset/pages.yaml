  md: '# Adding Security to an Internet Service | 265


    ![](img/c28a05c0528daad8a392659cd26abcda_269_0.png)


    **FIGURE 11-8:** The Microsoft Security Configuration Editor


    Following the three steps to secure a WCF service that were mentioned previously,
    you must select a security mode, then the credential type, and finally configure
    your service to use the new service. Typically, authentication to Internet services
    is either anonymous or via a username and password. Anonymous authentication does
    not mean that you are unprotected — it simply means a credential not be required.
    However, Transport security will protect the message against eavesdropping and
    sign it against changes.


