- img_proc: true
  md: "> NOTE The formal name for this type of attack is a \"Path Traversal Attack.\"\
    \ Path traversal attacks can use relative paths and the \"double-dot\" sequence,\
    \ or less frequently, direct path access, such as sending C:\\windows\\win.ini\
    \ as a parameter to a page.\n\nYou may look at this URI and consider that simply\
    \ filtering and rejecting a filename with \\ would be enough. The following URI\
    \ would also work:\n\n```\nhttp://localhost:32715/Accessing%20Files/getfile.aspx?filename=../../../../windows/win.ini\n\
    ```\n\n# TRY IT OUT Stopping Path Traversal\n\nFollow this method for stopping\
    \ path traversals.\n\n+   1. In the code below, getfile.aspx.cs, change the code\
    \ to the following:\n\n```\nusing System;\nusing System.IO;\n\npublic partial\
    \ class getfile : System.Web.UI.Page\n{\n    protected void Page_Load(object sender,\
    \ EventArgs e)\n    {\n        Response.Clear();\n        string filename = Request.QueryString(\"\
    *filename\");\n        FileInfo file = new FileInfo(Server.MapPath(filename));\n\
    \        Response.AddHeader(\"Content-Length\", file.Length.ToString());\n   \
    \     Response.WriteFile(file.FullName);\n        Response.End();\n    }\n}\n\
    ```\n\nNow, the URIs that you attempt to navigate out of your application directory.\
    \ You will see that an HttpException is thrown with a message \"cannot use a leading\
    \ .. to exit above the top directory.\" Now you have some protection against path\
    \ traversals.\n\nServer.MapPath will not return any path outside of the root of\
    \ your Web application. However, if files are stored in subdirectories, it is\
    \ still possible for the server to moving outside of directory (but still within\
    \ the Web root) should allow an attacker .. / ../ as part of the filename.\n\n\
    To stop all attacks, you must extract the filename from the input. The .NET framework\
    \ provides a class, Path, for mapping files. The Path class has a method that\
    \ will return just the filename, GetFileName. Even by limiting files to their\
    \ filename, the previous code would have another problem — it would serve web.config\
    \ if asked. So you must limit files to a particular directory."
