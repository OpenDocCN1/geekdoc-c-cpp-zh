    The HTML source contains a few points of interest. When this page was created
    to write this chapter, it was called PostbackDemo.aspx. The reaction parameter
    for the HTML form points back to the page itself. You will also see that the page
    has four hidden fields that are not present in the ASP.NET server: __EVENTTARGET,
    __ARGUMENT, __EVENTVALIDATION, and __VIEWSTATE. Some JavaScript has also been
    inserted that includes a __doPostBack() function. Finally, the link back is rendered
    as an element with a client-side event that calls the inserted __doPostBack()
    function, passing the name of the button.


    When you examine the __doPostBack() function, you will see that two of the hidden
    fields, __EVENTTARGET and __ARGUMENT, before calling the JavaScript submit method
    on the form, which causes the browser to submit the form, including the hidden
    fields.


    It is the combination of posting a page back to (PostBack) that allows ASP.NET
    to implement its event model. The life cycle of a PostBack is as follows


    +   1. Your page loads for the first time (usually via a GET request). ASP.NET
    creates the controls within it. The Page events are fired, and the HTML for the
    page is rendered and returned to the client. At this point, the Page object (and
    all that it contains) is released, and eventually, the memory used for it is freed
    by the .NET garbage collector runs.


    +   2. In the client browser, the user will perform an action that creates aPostBack,
    such as clicking a link, a button, or changing the selection on a list box. These
    actions are wired with client-side JavaScript events, which culminate in a call
    to __doPostBack(). The page and form data is submitted to the server.'
