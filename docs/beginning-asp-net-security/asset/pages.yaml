  md: '# Writing Bad Code: Demonstrating SQL Injection


    This initial attempt at a login page is vulnerable to SQL injection. If you examine
    the code, you can see that it builds a SQL query by inserting the text from the
    username field and the password field. Using the example login, the SQL command
    will be the following:


    ```

    select * from logins where username = ''example'' and password = ''wrox''

    ```


    This is perfectly valid SQL. But what happens when you try a username of O''Leary?
    You get an exception thrown, because of the apostrophe in the username, which
    unbalances the query. Using this fact, an attacker can submit crafted values to
    modify the meaning of the query. If you enter '' or 1--the username and anything
    in the password field, the SQL command becomes the following:


    ```

    select * from logins where username = '''' or 1=1 and password = ''anything''

    ```


    --The sequence in SQL marks the beginning of a comment. Anything following it
    is ignored. This means the SQL query executed as follows:


    ```

    select * from logins where username = '''' or 1=1

    ```


    The inclusion of the 1=1 clause changes the query further. This expression always
    evaluates to true, so a record will always be returned. Because the code in the
    login page checks for a non-null record set, the login can be bypassed without
    a password of the SQL injection vulnerability.


    This vulnerability opens up other possibilities for an attacker. A blank username
    may not be the best approach somewhere in the application the username may be
    checked to ensure that it is not a null or empty value. Attackers could try a
    username by entering example'' this makes the query as follows:


    ```

    select * from logins where username = ''example--'' and password = ''''

    ```


    This query in turn reduces to the following:


    ```

    select * from logins where username = ''example''

    ```


    If you try this, you will see that the login application will now respond as if
    a valid login has occurred. The SQL injection has removed the password altogether.


    If you havent followed the approaches discussed in Chapter 5 by enabling custom
    error pages, a wider problem exists, one that can allow an attacker to discover
    the layout of your database tables and then run commands against them.


    Before attempting to insert or delete data from your database tables, an attacker
    must know the table and column names, information not normally exposed to the
    outside world. So, instead of attempting to bypass the login page, the attacker
    attempts to cause an error, using the '' 1-- as his or her username. This turns
    your query into the following:


    ```

    select * from logins where username = '''' having 1=1

    ```'
