  md: '# Authorization in ASP.NET 31


    ![](img/c28a05c0528daad8a392659cd26abcda_187_0.png)


    FIGURE 10: Adding a new IIS authorization rule in the IIS Management tool


    To use the ASP.NET configuration tool, highlight your project, and start it via
    Project -> ASP.NET configuration. Select the Security link in the browser.


    The IIS Management tool creates rules for IIS Authorization. Run with every request,
    even if the resource is not mapped to managed code (for example, .aspx or .svc
    code). This means that IIS authorization rules can protect static results, such
    as .JPG, .PNG, PDF, and so on.


    IIS authorization rules are also evaluated differently. Table 7-6 shows the differences
    between the two types.


    TABLE 76: Differences Between ASP.NET URL and URL Authorizations in IIS7


    | DIFFERENCE | ASP.NET URL AUTHORIZATION | IIS7 URL AUTHORIZATION |

    |--- |--- |--- |

    | Rule Evaluation Order | Lowest level up | Evaluates from parent down |

    | | Evaluated in order of appearance | Deny rules evaluated first, then in order
    of appearance |

    | UI | No IIS7 Management UI | Managed by the Authorization Rules UI |

    | Configuration Section | system.web/authorization | system.webServer/security/authorization
    |

    | Content | Applies only to resources mapped to a managed handler | Applies to
    all resources |'
