  md: '# TYPICAL UNTRUSTED INPUT SOURCES


    The following is a list of common untrusted input sources. It is by no means exhaustive
    — input varies with each application. You must decide on the trustworthiness of
    your inputs.


    +   - Fields (from Web controls or directly from the request object)

    - Query string variables

    - Databases

    - External Web services

    - Cookies

    - HTTP headers

    - Session variables

    - ViewState


    # A CHECKLIST FOR HANDLING INPUT


    The following is a checklist you should follow when deciding how to deal with
    user input and how to output it to a Web page:


    +   - Review all inputs to a system and decide if they are trustworthy— Remember
    that all inputs should be considered untrusted by default. If input must be trusted
    and comes from outside your application, it must be validated and sanitized. A
    good practice is to perform validation for all inputs, trusted or not.

    - Review code that generates output— Remember that XSS attacks are dependent on
    untrusted input as output. Examine your code. Look for Response.Write, &= and
    setting Text of Web Controls as well as other properties on ASP.NET controls.

    - Examine output functions and determine if they use untrusted input parameters—
    Once all output parameters have been discovered, examine the values they are using
    to generate output. If they are using untrusted input, then it will require encoding.
    Typical input types that generate output include database queries, the reading
    of files from the file system, and calls to Web services.

    - Determine what encoding the output expects— Different output types require different
    encoding methods. For example, HTML requires HTML encoding, URLs require encoding,
    and so on.

    - Encode output— When assigning output, use the encoding you have determined to
    make the output safe.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '+   Ensure cookies are marked as HttpOnly. — As part of your layered defense,
    ensure that any cookies that you do not need to access on the Web client are marked
    with the HttpOnly attribute.


    +   Do not disable request validation on a wide basis. — Request validation should
    be disabled on a per-page basis. This ensures that any page where you forget that
    input is accepted until you add encoding to the page output and turn request validation
    off.


    +   Use Microsoft AntiXSS library and SRE. — The Microsoft AntiXSS library provides
    more robust and flexible encoding methods than the standard .NET framework. In
    addition, the SRE automatically encode output for controls it knows about. However,
    this is not an excuse to avoid explicitly encoding output yourself.'
