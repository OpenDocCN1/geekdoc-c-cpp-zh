  md: "# USING MESSAGE INSPECTORS\n\nWCF provides another type of inspector, the message\
    \ inspector. A message inspector can be used as a filter that intercepts and inspects\
    \ messages as they arrive into your service, but before they reach your service\
    \ implementation. They can be used for various purposes, for example, security\
    \ functions such limiting message acceptance based on IP address.\n\nTo define\
    \ a message inspector suitable for use on a WCF service, you simply implement\
    \ IDpatchMessageInspector, which is contained in the System.ServiceModel.Dispatcher\
    \ namespace. A base message inspector is showing in Listing 11-10.\n\n# LISTING\
    \ 11-0: A base message inspector\n\n```\nusing System.ServiceModel;\nusing System.ServiceModel.Channels;\n\
    using System.ServiceModel.Dispatcher;\n\npublic class IpatchInspector : IDpatchMessageInspector\n\
    {\n    public object AfterReceiveRequest(\n        ref Message request,\n    \
    \    IClientChannel channel,\n        InstanceContext context)\n    {\n      \
    \  throw new NotImplementedException();\n    }\n\n    public void BeforeSendReply(\n\
    \        ref Message reply,\n        object correlationState)\n    {\n       \
    \ throw new NotImplementedException();\n    }\n}\n```\n\nYou can see that implementing\
    \ IDpatchMessageInspector requires you to write two methods, AfterReceiveRequest\
    \ and BeforeSendReply. You will note that both methods a message parameter by\
    \ reference. This allows you to replace the message during processing with a changed\
    \ version of the original message, or a completely new message, should you want\
    \ to do so. By setting the message to null in the AfterReceiveRequest, your service\
    \ implementation will never be called. You can also send an object between the\
    \ two methods by returning it from AfterReceiveRequest, which becomes the correlationState\
    \ parameter in BeforeSendReply.\n\nYou can put this all together and write a simple\
    \ message filter that checks that in service has been accessed via localhost,\
    \ as the shown in Listing 11-11."
  merge: -1
  pgno: 287
- img_proc: true
  md: "# LISTING 11: A simple message inspector to limit connections to localhost\n\
    \n```\nusing System.Net;\nusing System.ServiceModel;\nusing System.ServiceModel.Channels;\n\
    using System.ServiceModel.Dispatcher;\n\npublic class IPAddressInspector : IDispatchMessageInspector\n\
    {\n    private static readonly object AccessDenied = new object();\n\n    public\
    \ object AfterReceiveRequest(\n        ref Message request,\n        IChannel\
    \ channel,\n        InstanceContext instanceContext)\n    {\n        RemoteEndpointMessageProperty\
    \ remoteEndpoint =\n            request.Properties[RemoteEndpointMessageProperty.Name]\n\
    \            as RemoteEndpointMessageProperty;\n        IPAddress ipAddress =\n\
    \            IPAddress.Parse(remoteEndpoint.Address);\n\n        if (!IPAddress.IsLoopback(ipAddress))\n\
    \        {\n            request = null;\n            return AccessDenied;\n  \
    \      }\n        return null;\n    }\n\n    public void BeforeSendReply(\n  \
    \      ref Message reply,\n        object correlationState)\n    {\n        if\
    \ (correlationState == AccessDenied)\n        {\n            HttpResponseMessageProperty\
    \ accessDenied =\n                new HttpResponseMessageProperty();\n       \
    \     accessDenied.StatusCode = (HttpStatusCode)401;\n            accessDenied.StatusDescription\
    \ = \"Access Denied\";\n            reply.Properties[\"httpresponse\"] = accessDenied;\n\
    \        }\n    }\n}\n```\n\nAs before, with parameter inspectors, you must write\
    \ a custom attribute to apply it to your service implementation. However, this\
