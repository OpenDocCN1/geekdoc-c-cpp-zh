    wsHttp\" hostComparisonMode=\"Exact\">\n    <security mode=\"TransportWithMessageCredential\"\
    >\n      <transport clientCredentialType=\"None\" />\n      <message clientCredentialType=\"\
    Username\"/>\n    </security>\n  </binding>\n</wsHttpBinding>\n<bindings>\n```\n\
    \nThis updates the server configuration. If you run the test client and attempt\
    \ to connect, an exception of type FaultException will be thrown, which tells\
