  md: '# 1

    Why Web Security Matters


    Imagine working for the company providing Microsoft UK''s events registration
    system. It''s the beginning of summer in June 2007, and the news is filled with
    floods in the north of England where people have had to evacuate their homes while
    the rest of the country swelters in the well-above-average heat and sunshine.
    You fire up your Web browser to check how your site is doing, only to discover
    the page shown in Figure I-1. You''ve been hacked!


    ![](img/c28a05c0528daad8a392659cd26abcda_11_0.png)


    FIGURE 11: The defaced Microsoft UK Events Page, June 2006 (retrieved from www.zone-h.org)'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# CHAPTER 1 WHY WEB SECURITY MATTERS


    > DISCLAIMER: DO IT TO YOURSELF, BUT NOT TO OTHERS

    This book sets out to teach you about common Web vulnerabilities. It does so by
    illustrating the problem and showing how bad code can be used to attack an unprotected
    Web site. I believe this is the best way to illustrate the problem and drive the
    fact that Web security is something every Web developer should keep in mind as
    he she develops a new site. It may be tempting to try out of the techniques shown
    on a friend''s Web site, or even a Web site that you visit on a regular basis.
    I have a single word of advice about this — dort!

    Hacking is illegal in the majority of countries, regardless of the intent behind
    it, and using any of the exploits described in this book may land you in serious
    trouble. The author nor Wrox condone or defend anyone who attacks systems they
    do not own, or have not been asked to attack by the owner.


    # ANATOMY OF AN ATTACK


    Figure 1-2 shows a typical layout of the hardware involved in a Web site: the
    client (or attacker), a firewall, the Web server, and perhaps a SQL server file
    server to store uploaded documents. In the early days of Web security, most hacks
    made use of vulnerabilities in the Web server software, the operating system hosting
    it, or the ancillary services running on it (such as FTP or email).


    ![](img/c28a05c0528daad8a392659cd26abcda_12_0.png)


    FIGURE 12: A typical network for a Web site


    Often, an exploit in the operating system or Web server would allow access to
    the underlying file system, or allow an attacker to run code on the hosting machine.
    During the late 1990s, Microsoft''s reputation for security was poor because exploits
    come out against Windows and IIS on a regular'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Anatomy of an Attack | 3


    basis. Administrators would find themselves installing a patch against one problem,
    only to find another unpatched problem was now being exploited. The poor reputation
    for security undoubtedly resulted in lost sales, but it also resulted in a push
    to Microsoft to develop more secure systems by changing the company''s development
    process.


    When the main focus of an attack was the operating system or Web server software,
    hackers would begin by running fingerprinting tools like NMap scanning the target
    system to discover the exact version of the operating system and server software
    in use. The hacker could then use this to determine potential avenues of attack
    through known exploits for that operating system. As the operating system security
    improved, it became more difficult to exploit. The security of the hosting environment
    also improved because firewalls became more commonplace, and protected the systems
    by closing off services that did not need to be exposed to the outside world (such
    as databases or file servers). The attackers had to find a new weak point to attack
    — the only thing available to them were the Web applications themselves, which
    are generally easier to exploit the systems they run on.


    Hypertext Transfer Protocol (HTTP) is the protocol used to send and receive information
    to Web sites. It is text-based and incredibly simple. So you don''t need tools
    to send requests and receive responses. This is different from when exploits were
    used against the operating system. Attackers exploiting the operating system would
    have to craft custom tools to send the right commands (a stream of non-textual
    information) to the targeted machine.


    HTTP is also stateless, which means that every request contains all the information
    necessary to receive a response. So an attacker does not have to craft a series
    of requests and responses. A single request can be enough to compromise a Web
    application. For some exploits against an operating system, an attacker needs
    a complicated sequence of requests and responses to worm his way into the system.


    An attacker will begin by discovering the platform the application is running.
    This is normally easy to detect the format of the application URLs, and the fact
    that Web servers advertise their software name and version when you connect to
    them. The platform may vary certain aspects. For example, if the hosting platform
    is Windows, the database used by an application hosted on is SQL Server. From
    there, attackers will look at the pages available to them and the parameters set
    with each page, in the URL or HTML forms. The hacker will start to change the
    values to what he wants, and to see if an error can be triggered or a common exploit.


    For example, a numeric parameter, as the ID parameter in http://wrox.com/bookdetails?id=12345
    can be changed to letters if it causes an error. If an error is displayed, the
    error information may give away information about the underlying application.
    A field can be filled with special characters, potentially including HTML. If
    this data enters redirected without properly encoded, then the system may be vulnerable
    to Cross Site Scripting (XSS), which attackers can use to deface the site, or
    redirect browsers to a site of their own.


    The Microsoft defacement shown in Figure 1-1 was made not by an operating system
    vulnerability, but by a badly coded application implemented database access in
    an insecure manner. This allowed arbitrary SQL commands to be run from the Web
    page, and changes to be made to the contents of the database from which the page
    was generated.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'The classic example of SQL injection is to use it to bypass a login screen,
    so''s look at a typical username and password system. The user details are stored
    in a database called Users, with a column for the username and a column for the
    password. The login screen (a typical example of which is shown in Figure-1) asks
    for a username and password. When the login button is clicked, the developer''s
    code runs a SQL query looking for a row that matches the specified username and
    password. If a row is returned, the submitted login details are allowed to access
    the system. If no data is returned from the query, the login fails, and the user
    is informed and allowed to try again.


    ![](img/c28a05c0528daad8a392659cd26abcda_14_0.png)


    FIGURE 13: a login screen for a Web site


    Behind the scenes in the login page, the developer builds up the query using the
    following SQL string:


    ```

    private const string LoginSql = "select * from users where username=''{0}'' and
    password=''{1}'';

    ```


    The developer uses string.format to insert the contents of the username and password
    into the query before sending it onto the database, so a query would look like
    this:


    ```

    select * from users where username=''harry'' and password=''wrox''

    ```


    The hacker knows developers do this, and the hacker knows the standard way to
    bypass this dynamic entry: by entering the user field and a "magic" value of OR
    1=1 in the username field. What happens to the query now? It becomes the following:


    ```

    select * from users where username=''hack'' OR 1=1-- and password=''wrox''

    ```


    If your SQL skills are a little rusty, the -- characters denote a comment in SQL.
    (and anything following them) will be ignored, the SQL query is really the following:


    ```

    select * from users where username=''hack'' OR 1=1;

    ```


    The OR condition on the SQL query will always return true, and so this query would,
    in fact, return all rows from the database. The developer simply checks that data
    has been returned believe this to be a valid login, and will allow the attacker
    to continue.


    In the Microsoft events exploit shown in Figure 1-1, the attacker changed the
    v2=1 parameter in the address to become v2=''1''. This caused a syntax error in
    the query, which caused'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Risks and Rewards | 5


    an error to occur. The error message was displayed to the attacker using the default
    developer error page you probably have seen when developing your own Web sites.
    The error page displayed the full query that caused the problem, which contained
    table and column names.


    Now, the attacker could write a statement to change database records. Because
    the database records were used to generate the page (a typical feature of content
    management systems), the attacker could change how a page looked. In fact, the
    attacker added content to events page with <link href="http://h.laspost.com/remoter/css.css
    type=css rel=stylesheet"> was a prepared Cascading Style Sheet (CSS) that displayed
    the images and text described, thus spoiling someone''s sunny day.


    Was the developer behind this system a bad developer? Not keeping up with the
    threat landscape for Web applications can be difficult. If you have no awareness
    of the threats, how can you defend your application against them? This is the
    purpose of this book — to raise your awareness of the threats against Web applications,
    and to help you understand the solutions to protect yourself and your customers.


    # RISKS AND REWARDS


    The media portrays hackers as individuals or groups for money or at the beck and
    call of an enemy government. While this may be true for some, it isn''t the whole
    story.


    In the 1940s, a set of practical hackers at the Massachusetts Institute of Technology
    (MIT) used the word "hack" to describe their hijinks, in recent years, having
    placed balloons on the football field that inflated during a game against Yale,
    or decorating the Great Dome to like R2-D2 two days before The Phantom Menace
    was due for its cinematic release. The R2-D2 hack, implemented with fabric panels
    and a tent attached carefully to the dome, also included instructions on how to
    dismantle the structure without causing any damage. The instructions were addressed
    to "Imperial Drones" and signed "Rebel Scum.". (You can see a collection of hacks
    from 1989 to the present day http://hacks.mit.edu/


    The first electronic hackers were the phakers in the 1950s who used dials to hijack
    AT&T phone systems to make free long-distance calls. The majority of the computer
    hackers you saw today are those that cause damage. However, this may be because
    they are the most noteworthy ones. As indicated in Table 1-1, the Web Hacking
    Incidents Database Report for 2008 produced by Breach Security Inc. (available
    from http://www.breach.com/confirmation/2008MID.html) shows that the most frequent
    goal of attacks was defacement. The Microsoft hack depicted in Figure 1-1 showed
    a simple message from the attacker who probably did it just to gain kudos from
    his peers.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# CHAPTER 1 WHY WEB SECURITY MATTERS


    # TABLE 11: Goals for Hacks in 2008


    | ATTACK GOAL | PERCENTAGE OF ATTACKS |

    | Defacement | 24 |

    | Stealing Sensitive Information | 19 |

    | Planting Malware | 16 |

    | Monetary Loss | 13 |

    | Downtime | 8 |

    | Phishing | 5 |

    | Deceit | 2 |

    | Worm | 1 |

    | Link Spam | 1 |

    | Information Warfare | 1 |


    Source: The Web Hacking Incidents Database Annual Report 2008, Breach Security
    Inc. (http://www.breach.com/resources/whitepapers/downloads/WP_WebHackingIncidents_2008.pdf)


    The risks for a hacker are low. It''s easy to hide behind proxies on the Internet
    that disguise the source of the attack. Stolen credit cards are spawned on underground
    Web sites, enabling hackers to register accounts on Web hosts to capture information.
    Defacement of Web sites can be more subtle than a simple "I did this" message.
    The attacks can instead attempt to drop malware that infect a user''s machine.
    This malware can capture information for banking sites, look for credit card information,
    or add the machine to a botnet. (A botnet is a collection of infected machines
    the botnet controller can instruct to do things, such as spam or flood a Web site
    with requests.)


    The rewards from these attacks are easily simple. Information such as credit card
    data, bank logs, or the control of an infected machine are all attackers can sell.
    Distributed Denial-of-service (DDoS) attacks, which are made easy by bots, can
    be used to blackmail companies who pay for their sites to remain available. In
    2008, DDoS attacks were commonly reported by gambling Web sites, especially during
    popular events that represented a large amount of gambling revenue.


    Regardless of how many people hack, the attacks are a concern for you and your
    applications. Consider how your customers would react to even a simple defacement,
    let alone a hack that compromises their information. Customers expect a service
    that they are using, or an application they buy, to be secure. A security incident
    (or multiple security incidents) damages the reputation of the software manufacturers,
    and impacts the sales of the product.


    # BUILDING SECURITY FROM THE GROUND UP


    When you gather the requirements for your system, you normally consider functionality,
    performance, the user experience, maintainability, and other attributes. But what
    about security?'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Building Security from the Ground Up | 7


    Security should be built into your system from the start, and should be a part
    of your system''s specification and functional requirements. This may be a struggle
    — customers or project managers may assume that security is inherent in a system.
    They may balk at having it written down and taken into account during development
    — after all, the more that is written down, the more software may cost and the
    longer it may take.


    However, the assumption that security does not need to be specified is a huge
    risk. When security is not explicitly part of the software requirements, it may
    never get considered. Microsoft itself has made great advances in years of developing
    secure code by changing its approach and embracing the Security Development Lifecycle
    (SDL), which highlighted the need to integrate security into the software development
    lifecycle. The SDL consists of several steps:


    +   1. Gather security requirements.

    2. Secure the design.

    3. Incorporate threat modeling.

    4. Perform code reviews.

    5. Perform penetration tests.

    6. Secure the deployment of the application.

    7. Integrate feedback into the next iteration of the development cycle.


    Security is secured with every step in the development process, including the
    requirements gathering — after all, it is cheaper to fix potential problems during
    design and when it is a breach has taken place. One of the most difficult aspects
    of building secure software is analyzing the threats against your application,
    and which areas of your system represent the highest risks. The practice of threat
    modeling helps uncover how an application can be attacked, and how it should be
    secured against those attacks.


    The SDL allows developers to identify threats and develop countermeasures early
    in the development lifecycle, creating the countermeasures as an application feature.
    Some developers list potential attacks as application defects right from the start,
    formally logged in any bug-tracking system, and finally signed off when mitigation
    is complete. That way, the threats are never forgotten and will also be visible
    until countermeasures are developed.


    Microsoft Press has published three books that can help you understand the process
    Microsoft uses:


    +   * Writing Secure Code, Second Edition by Michael Howard and DavidLeBlanc (Redmond,
    WA: Microsoft Press, 2002)

    * The Security Development Lifecycle Michael Howard and Steve Lipner (Redmond,
    WA: Microsoft Press, 2006)

    * Threat Modeling by Frank Swiderski and Nino Snyder (Redmond, WA: Microsoft Press,
    2004)


    These books contain a wealth of information about secure development techniques,
    and are useful companions to this and other software security books.'
  merge: -1
