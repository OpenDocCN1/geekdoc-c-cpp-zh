  md: "Using the Web site you created for Listing 7-1, enable forms authentication\
    \ by modifying your web.config as shown in Listing 72.\n\n# LISTING 72: Modifying\
    \ web.config to enable forms authentication\n\n```\n<system.web>\n  <authentication\
    \ mode=\"Forms\">\n    <forms loginUrl=\"login.aspx\">\n      <credentials passwordFormat=\"\
    clear\">\n        <user name=\"peter\" password=\"curd\"/>\n        <user name=\"\
    alex\" password=\"mackey\"/>\n      </credentials>\n    </forms>\n  </authentication>\n\
    \n<authorization>\n  <deny users=\"*\"/>\n</authorization>\n</system.web>\n```\n\
    \nThe modifications shown turn on forms authentication, specify the login page\
    \ URL and some users, and then tell ASP.NET to deny access to any user who is\
    \ not authenticated (authorization is covered in more detail later in this chapter).\n\
    \nTable 7-2 describes all the possible attributes for the <forms> element.\n\n\
    # Table 7-2: The <forms> Element Attributes\n\n| ATTRIBUTE | DESCRIPTION |\n|\
    \ --- | --- |\n| name | This is the name of the cookie used to store the authentication\
    \ token. By default, this is .ASPXAUTH. |\n| loginUrl | Specifies the URL to which\
    \ the application will redirect if a user is not authenticated and tries to access\
    \ a protected resource. The default value is Login.aspx. |\n| protection | This\
    \ controls the amount of protection applied to the authentication cookie. The\
    \ four settings are: |\n| | All ASP.NET uses both validation and encryption to\
    \ protect the cookie. This is the default setting. |\n| | None —Applies no protection\
    \ to the cookie (which is obviously not advisable and should be avoided). |"
