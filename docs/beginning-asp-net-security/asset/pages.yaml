  md: "To add the schema pointer, you must first add a reference to the XML Schema\
    \ namespace.\nThis extends the XML file to support schemas. Once you add the schema,\
    \ you will see that the invalid element is highlighted. If you try to change the\
    \ XML elements to vary from the schema, or add new invalid elements, you will\
    \ see that Visual Studio highlights errors, as in Figure 10-1.\n\n![](img/c28a05c0528daad8a392659cd26abcda_236_0.png)\n\
    \n# 8. Now load the XML document through a suitably configured XML reader. Change\
