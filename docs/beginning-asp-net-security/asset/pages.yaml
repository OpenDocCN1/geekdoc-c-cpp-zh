  md: '# Using the Configuration Tools to Manage Roles


    The easiest way to create roles during development is the ASP.NET configuration
    tool, available from Project. ASP.NET Configuration (Figure 7-7). This will open
    the administration site in your Web browser. Click on the Security Tab and choose
    “Create or Manage Roles.” Once you have added roles to your application, you can
    add users, or when adding new users with the configuration tool, you can choose
    the roles they belong to.


    ![](img/c28a05c0528daad8a392659cd26abcda_182_0.png)


    FIGURE 7-7: Managing roles with the ASP.NET Configuration tool


    As with users, the IIS Manager tool allows you to create and manage roles. In
    the IIS Manager, select your Web site and double-click the “.NET Roles” icon to
    create a similar screen to Figure 7-8 where you can add and delete roles. You
    can view the users in a role by clicking “Manage” link beside an existing role,
    where you can double-click the user to adjust the user’s role membership. If you
    want to add a user to a role, open the “.NET Users” screen, double-click your
    user, and select the roles you want them to have.'
