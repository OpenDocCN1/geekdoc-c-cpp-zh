  md: "# 158 | CHAPTER 7 ADDING USNAMES AND PASSWORDS\n\nThe login functionality is\
    \ provided by two methods:\n\n+   - Authenticate, which authenticates the user\
    \ against the user store.\n- RedirectFromLoginPage, redirects the user back to\
    \ the page originally requested. This method takes two parameters: the name of\
    \ the user, and a Boolean value indicating if a persistent authentication cookie\
    \ should be used.\n\nWhen you first attempted to load the protected page, you\
    \ may have noticed the URL, which will be something like this:\n\n```\nhttp://localhost:49231/login.aspx?ReturnUrl=%2fDefault.aspx\n\
    ```\n\nYou can see that ASP.NET redirects users to the login page, the page they\
    \ are trying to access is specified in the query string. This is used to redirect\
    \ users back to their original resource once a login has been successful.\n\n\
    Of course, using web.config as a store for your usernames and passwords is not\
    \ scalable, which is why ASP.NET provides a framework for writing membership stores\
    \ — the MembershipProvider. Out of the box ASP.NET designed the membership system\
    \ by using a provider model, other database suppliers (such as MySQL, Oracle,\
    \ and VistaDB) also have providers made for their databases. But using the Membership\
    \ store will be exactly the same.\n\n# Using SQL as a Membership Store\n\nThe\
    \ first question you may be asking is how to create a database suitable for storing\
    \ authentication details. By default, ASP.NET is configured to use a SQL Express\
    \ database placed in your App_Data directory. The first time you use one of the\
    \ built-in ASP.NET regsq.exe utility found in the framework will create the database\
    \ for you. Alternatively, you can use the utility itself (for example, C:\\Windows\\\
    Microsoft.NET\\v2.0.50727). This will ask you to connect to an existing server,\
    \ and then create the membership tables, views, and stored procedures for you.\n\
    \nLet's start off by altering the custom login page and using the built-in ASP.NET\
    \ login control. Remember, this will create a suitable database for you. Listing\
    \ 7-4 illustrates a simple use of the login control.\n\nLISTING-7- Using the ASP.NET\
    \ login control\n\n```\n<@ Page Language=\"C#\" %>\n<!DOCTYPE html>\nn//W3C//DTD\
    \ HTML 1.0 Transitional//EN//\nPUBLIC \"http://www.w3.org/TR/html1/xhtml-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <head runat=\"server\"\
    >\n  <title>Login</title>\n  </head>\n```\n\n![](img/c28a05c0528daad8a392659cd26abcda_164_0.png)"
  merge: -1
  pgno: 164
- img_proc: true
  md: "```\n<body>\n<form id=\"form1\" runat=\"server\">\n<div>\n  <asp:Login ID=\"\
    Login1\" runat=\"server\">\n  </asp:Login>\n</div>\n</form>\n<body>\n</html>\n\
    ```\n\nNow try to browse your protected default.aspx and attempt to log in with\
    \ any details you like. There will be a pause, and then your login will be rejected.\n\
    \n> NOTE You may see a timeout error as ASP.NET attempts to start up SQL Express,\
    \ create and configure the database. If this happens, simply press F5. By then\
    \ SQL Express will have started and the database creation will happen.\n\nIf you\
    \ look in your App_Data directory, you will see that a new database has been created,\
    \ aspnetdb.mdf. This database is added to your project by default, right-click\
    \ on the App_Data folder and choose \"Add Item\" to place it in your project.\n\
    \nIf you have an existing SQL database that you have prepared using the aspnet_regsq\
    \ utility, you must tell ASP.NET that you want to use this database. You will\
    \ need to add a connection string for your database, and then change the provider\
    \ configuration to use it. 7-5 show a typical web.config configured in this way.\n\
    \n# LISTING 7: Configuring ASP.NET to use an existing, prepared membership database\n\
    \n```\n<?xml version=\"1.0\"?>\n\n<configuration>\n\n<connectionStrings>\n\n \
    \ <add name=\"MyDB\" connectionString=\"server=(local);database=mydb;integrated\
    \ security=true\" />\n</connectionStrings>\n\n\n<system.web>\n\n\n```\n\ncontinues"
