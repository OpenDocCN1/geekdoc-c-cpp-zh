  md: '# Configuring a Site to Use HTTPS


    To configure a site using HTTPS, you edit the bindings. Start the IIS Administration
    Manager and highlight the site for which you wish to configure SSL. Select Bindings
    from the Actions menu. If the site has never been configured for SSL, click Add,
    which will bring up the Add Site Binding dialog shown in Figure 14-5.


    ![](img/c28a05c0528daad8a392659cd26abcda_358_0.png)


    FIGURE 14-5: Adding a site binding


    In the binding dialog, change the type to “https” from the drop-down list. When
    you click OK, the certificate will be activated on your site, and you can browse
    to it using the HTTPS protocol. If you must change a certificate (for example,
    renewing one that has expired), then you can edit the bindings and select the
    new certificate.


    One final thing is to ensure that the SSL2 algorithm is disabled because it is
    insecure. IIS allows you to choose the algorithms used for SSL using the HKey_Local_Machine\System\CurrentControlSet\SecurityProvider\ANNEL\Protocols
    registry key. Windows 2008 disables SSL 2.0 by default, which you can check by
    looking for an SSL 2.0 client subnet that contains a DisabledByDefault entry with
    a DWORD value of 0 . You can also check if SSL 2.0 is disabled by using the Advanced
    settings in Internet Explorer, and only enabling SSL 2.0 in the Security settings
    for the browser. You should try to load your Web site over SSL.


    # Setting up a Test Certification Authority


    Certificates are expensive, but during development and testing, you will often
    want to mirror your production environment as much as possible, including certificates.
    It is often recommended to use the self-signing certificate capability of IIS,
    or the makecert utility that comes with the Windows SDK. These have their disadvantages.


    A self-signed certificate has no root CA, while a makecert-generated certificates
    can generate its own root CA. However, in this case, the certificates do not have
    a Certificate Revocation List (CRL), a facility that CAs provide lists certificates
    that may have been compromised or destroyed. WCF looks for a trusted CA and a
    CRL when it checks certificates, unless you configure it not to — which is risky,
    you must always remember to check the back in production.


    A better option is to use the CA that comes with Windows Server and create your
    own test CA, complete with a CRL. In order for CRL checking to, the CRL must always
    be available. You may wish to set up the CA on a machine or virtual machine that
    is connected to your network development.


    To set up a CA in Windows 2008, you must add the Active Directory Certificate
    Services role — which does not actually require Active Directory at, but rather
    simply has extras if you are in an AD environment. Follow these steps:'
  merge: -1
  pgno: 358
- img_proc: true
  md: '+   1. Add the role through Server Manager, noting that, once the server is
    installed, you cannot change the server name or its domain membership.


    +   2. Add the Certification Authority Web Enrollment role service. This will
    allow you to request and receive certificates via a certificate CA site.


    +   3. Click Next, and select the Standalone CA.


    +   4. Click Next, and choose the Root CA option.


    +   5. Click Next, and create a new key.


    +   6. Click Next, and choose the default cryptographic options. Choose a suitable
    common name such as "Wrox Test Certification Authority."


    +   7. Click Next to be to the validity period section. Here, I generally choose
    a larger number than the default so that my certificates do not expire during
    demos or development.


    +   8. Click Next, and leave the logging options as default.


    +   9. Click Next again and choose Install.


    After a while, your new CA will be activated. The CA Web site will be installed
    under the Default Web site on the machine.


    Now you can use this new CA to generate an HTTP certificate for your own Web site.
    Follow these steps:


    +   1. Start IIS Manager and generate a certificate request, using the FQDN of
    the machine. (You can discover this using the ipconfig command, and examining
    the network name and default suffix of the network connection.)


    +   2. Start Internet Explorer and load the `certserv` directory on the CA machine
    (for example, `http://certserv.wrox.com/certserv`).


    +   3. Select the "Request a Certificate" link.


    +   4. Select the "advanced certificate request..."


    +   5. Choose the second object, "Submit a certificate request..." and then paste
    the contents of the text file into the Base-64-encoded certificate request box.


    +   6. Click Submit.


    You will be told that your certificate request has been received. However, you
    must wait for the certificate to be issued, so let''s follow these steps:


    +   1. Start the Certification Authority utility in Administrative tools, and
    click on the Pending Request folder.


    +   2. Right-click the request and choose All Tasks Issue from the context menu.


    +   3. Return to the Web browser and go to the Home for Certificate Services.


    You can now choose the View Status of a Pending Certificate Request, receive your
    certificate, and install it in IIS. (Ensure that you choose the Web site certificate
    and not the CA certificate when'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'you edit the bindings in IIS. You can test the setup by browsing to the certificate
    server site using HTTPS.


    Now, you must get the new root certificate from your CA and import it onto all
    of your development machines so that you will not get the error messages illustrated
    in Figure 14-3. Follow these steps:


    +   1. Browse to the cert directory on your new CA Web site and choose the "Download
