- img_proc: true
  md: "with an ID property, an Author property, a Title property, and a Content property.\
    \ The Edit view would contain input fields for the title and content, but would\
    \ not allow the author to be changed. The Controller action may look something\
    \ like the following, retrieving the post, applying the changes, saving the changes,\
    \ and then returning to a screen that will display the updated board post:\n\n\
    ```\n[AcceptVerbs(HttpVerbs.Post)]\npublic ActionResult Edit(int id, FormCollection\
    \ collection)\n{\n    BoardPost boardPost = this.boardPostRepository.Get(id);\n\
    \    UpdateModel(boardPost);\n    this.boardPostRepository.Save();\n    return\
    \ RedirectToAction(\"Details\", new { id = boardPost.Id });\n}\n```\n\nUpdateModel\
    \ is a method provided by the Base Controller class that uses a model binder to\
    \ apply changes from the FormCollection to the instance of the specified model.\
    \ The default model binder takes the name of the form field, and looks for a property\
    \ with the same name in the model class. If a match is found, it sets the property\
    \ to the value of the form field.\n\nThis is incredibly convenient, but also dangerous.\
    \ Using a tool like `TamperData` (`https://addons.mozilla.org/en-US/firefox/addon/966`)\
    \ for Firefox, an attacker can change a request before it is sent to your application,\
    \ as shown in Figure 16-1.\n\n![](img/c28a05c0528daad8a392659cd26abcda_390_0.png)\n\
    \n**Figure 16-1:** The TamperData Firefox plug-in intercepting a request"
  merge: -1
  pgno: 390
- img_proc: true
  md: 'If the form submission contains Title and Content, the binding will update
    these properties automatically. If the request is changed before it is sent, and
    an Author field value added to it the default data, the binder will also set the
    Author property on the model, despite not being on the original form (because
    the model binder has no way of knowing what fields were on the edit form).


    There are a few approaches to fixing this. The most obvious is to avoid binding,
    and retrieve the form data from the FormCollection parameter in your Action. But
    this is laborious and error-prone. Another approach is to accept parameters in
    your Action method, rather than a FormCollection, as shown here:


    ```

    [AcceptVerbs(HttpVerbs.Post)]

    public ActionResult Edit(int id, string Title, string Content)

    ```


    Yet another approach would be to create a specific View Model for the edit view,
    rather than relying on the core model exposed by your repository. The View model
    would only contain properties for the data edit, and any extra, tampered fields
    would be ignored.


    Binding can be locked down in a per-use basis by providing the binder with a specific
    list of properties it can update. This is done by passing an array of strings
    containing the allowed properties, like:


    ```

    UpdateModel(boardPost, new[] { "Title", "Content" });

    ```


    If you are passing an object to your Action method, rather than using a FormsCollection,
    the [Bind] attribute enables the include functionality, as shown here:


    ```

    [AcceptVerbs(HttpVerbs.Post)]

    public ActionResult Edit([Bind(Include = "Title, Content")]) BoardPost post

    ```


    Finally, you can set binding rules on a type itself (or programmatically in global.asax—enabling
    to restrict binding on classes that you do not have). For example is an:


    ```

    [Bind(Include = "Title, Content")

    public partial class BoardPost {

    }

    ```


    In keeping with secure development best practices, the examples provided here
    work on a whitelist approach, choosing properties that are specifically allowed
    for binding, rather than excluding properties (which is also supported). Whitelisting
    ensures any new properties added to your model are protected by default, and you
    must specifically enable them.


    # Providing Validation for Error Messages from Your Model


    While not strictly a security problem, feedback is given to users to ensure that
    the data processed by your system is valid. If your model provides validation,
    then the MVC framework will provide basic error-highlighting information for you.
    Figure 16-2 shows the results of setting a rating on a post to 11 when model limits
    it to values between 0 and 10—the field causing a problem is highlighted and an
    asterisk is next to it.'
