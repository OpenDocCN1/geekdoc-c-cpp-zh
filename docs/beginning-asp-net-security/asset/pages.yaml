  md: '# More Security for SQL Server


    This connection string does not contain usernames or passwords, unlike ones that
    you may be using. Instead, it specifies trusted connections . A trusted connection
    uses the Windows authentication to connect, alleviating the need to specify a
    username and password (although you should still encrypt your connection strings
    using the techniques shown in Chapter 5).


    Using trusted connections works well when the database you are connecting to is
    on the same machine, assuming the user you are running has access to the database.
    However, if the database is on another machine, it may not work because, by default,
    ASP.NET runs without the context of a local account, Network Service (as discussed
    in Chapter 2). This is generally why, in hosted environments, you will be forced
    to use a connection string that specifies a username and password. Hosting companies
    do not use Active Directory, so an account that exists on the Web server does
    not exist on the SQL server.


    If you are not using SQL Express, but instead have a full version of SQL Server
    on your machine, you must add for the user account under which your Web site runs.
    To grant permissions to an account, you can either use SQL Management Studio,
    or use the SQL CREATE login.


    To use SQL Management Studio to grant permissions, start the program, connect
    to your database server, and expand the Security folder. If you expand the Login
    folder, you can see the current list of users. To add a new user, right-click
    the Login folder and choose the “New Login . . . menu item. The dialog shown in
    Figure 8-3.


    ![](img/c28a05c0528daad8a392659cd26abcda_201_0.png)


    Figure 8-3: Adding a new user in SQL Server Management Studio'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'Grant access to SQL Server for a Windows account, ensure that the Windows authentication
    radio button is selected. Then click the Search button and enter the account name
    in the select box, or click the Advanced button and then Find all the available
    users and groups. Click OK and you will be returned to the “Login — New” screen.
    Select the default database to which you want the account to have access and click
    OK. This user account will now have access to the database as a “public” SQL server.
    This means that the new account can now access SQL items (such as stored procedures,
    tables, or views) which the public role has granted access. You may have guessed
    that if you saw Windows groups listed in the search results box, you can add groups
    to SQL. When you add a Windows group to SQL, all members of that group will be
    granted access.


    If you want your ASP.NET applications to be able to connect using Trusted Connections,
    you must grant access to the account they run. By default, this is Network Service,
    but you can change this by changing the Application Pool settings. Chapter 14
    provides more information on how to configure application pools.


    If you have full control of the hosting environment and want to set your SQL server
    from your Web server, you have two methods to avoid using usernames and passwords.


    +   - Place both machines in an Active Directory (AD), you can specify that IIS
    runs under a specific account on the AD, and grant appropriate permissions within
    SQL to that account.

    - Duplicate accounts in a workgroup—If you are not in an AD, you can use trusted
    connections with the same account name and password. On both machines, create
    a Windows login account (Obviously, you should use a strong password.) Then configure
    your ASP.NET process to run under that local user account on the IIS server, and
    grant permissions to the mirrored local user on the SQL server. Trusted connections
    will now help using the mirrored accounts.


    # SQL Permissions


    SQL provides a granular permission mechanism for databases and tables, much like
    Windows does for files and objects. To perform any action on a database, the connecting
    account must have permission to do so. Table 8-1 shows the main table-based permissions
    in SQL.


    TABLE 8-1: SQL Server Permissions


    | PERMISSION | DESCRIPTION |

    |---|---|

    | SELECT | Allows the user to read data from a table or a view. This permission
    can be applied to individual columns within a table or view. |

    | INSERT | Allows the user to insert data into a table or view. |

    | DELETE | Allows the user to delete data from a table or view. |

    | UPDATE | Allows the user to update data in a table or view. Like SELECT, it
    can also be applied to individual columns. |

    | EXECUTE | Grants permission for a user to execute a stored procedure. |'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'SQL also has the concept of roles. By default, new user accounts belong to
    the Public role for databases to which they have access. Each role has inherent
    permissions associated with it — for example, the DBA role can perform any action
    on a database.


    # Adding a User to a Database


    Just because a login exists, doesn''t give it access to a database. You must first
    grant an account access to the database. You can do this with the following SQL
    command:


    ```

    CREATE USER Ole FOR Login Ole;

    ```


    This command creates a user within the database it is run in — in this example,
    creating a user for the login account Ole. But this account cannot do anything
    without further work.


    # Managing SQL Permissions


    To manage SQL permissions, you can either use the SQL Server Management Studio
    or the GRANT, DENY, and REVOKE statements. Knowing and using the SQL statements
    is useful because you can include them in your stored procedure scripts, which
    should have source control.


    The following example grants the SELECT permission on the Example table or to
    view the guest user on your laptop, called Puck. The full name of the Windows
    guest account on that machine is a combination of the machine name and the windows
    name, separated by a \ (as inPUCK\Guest).


    ```

    GRANT SELECT ON Example TO PUCKGuest

    ```


    To deny the permission, you would use the following:


    ```

    DENY SELECT ON Example To Ole

    ```


    And, to revoke a previously granted permission, you would use the following:


    ```

    REVOKE SELECT ON Example To Ole

    ```


    However, if you are isolating your access to tables via stored procedures as previously
    suggested, you would not want to grant any table permissions at all. Instead,
    you would want to grant EXECUTE permissions to a stored procedure, as shown in
    the following example:


    ```

    GRANT EXECUTE ON GetLogins To Ole

    ```


    # Groups and Roles


    ```

    CREATE ROLE auditors AUTHORIZATION db_owner;

    ```'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# 198 CHAPTER 8 SECURELY ACCESSING DATABASES


    Roles must be owned by either a specific user or another role. In the previous
    example, a role called auditors is created, which is owned by the db_owner role,
    a built-in SQL role to which the database owner belongs. You can then add users
    to a role using the following command:


    ```

    EXEC sp_addrolemember ''auditors'', ''PhilHa''

    ```


    This would add the account PhilHa to the auditors group. You can then grant (deny)
    rights to the group rather than individual users, as shown here:


    ```

    GRANT EXECUTE ON ReadAuditLogin TO auditors

    ```


    # Least Privilege Accounts


    It''s all tempting to give your Web application full control over the database.
    But, as you can see from the SQL injection attack demonstration, you should give
    your Web application the least amount of privileges and permissions it needs to
    function.


    For example, if you are writing a reporting application, it''s unlikely your application
    will need to write data. So do not give it the ability to do so you may have tables
    containing audit information inserted by stored procedures. It''s unlikely your
    main application would need to either read or write to those tables, although
    an administration application may need to read the audit logs. The more privileges
    you grant to an application, the more there is for a successful attack to affect
    the database.


    If all data access is through stored procedures or permissions, you can use the
    REVOKE permission against the underlying tables, effectively revoking all rights
    for the Public role so that only database administrators can access the tables
    directly.


    # Using Views


    Under some circumstances, you may need to access the underlying schema for data.
    For example, some Object Relationship Mapping tools (ORMs) do not work well with
    stored procedures, and some ad-hoc reporting queries require direct access to
    the schema (that is, the structure of the tables themselves). A view can be used
    to enhance security in these circumstances. A view is, in essence, a virtual table.
    It does not physically exist, but it is the result of a query performed against
    tables.


    Because a view is query-based, it can be used to restrict access to the base tables.
    The types of views can show the following:


    +   - A subset of the rows of a base table

    - A subset of the columns of a base table

    - A subset of both rows and columns of a base table

    - A subset of another view, or a combination of views and tables

    - Data calculated from a base table (such as a statistical summary)


    The permissions on views are entirely separate from the permissions on an underlying
    table. If, for example, the Public role were denied all access to the employee
    table, you could create a view that'
  merge: -1
  pgno: 204
- img_proc: true
  md: "retrieves data from that table, grant access to the Public role, and accounts\
    \ within that role could see the contents of the view.\n\nFor example, the following\
    \ SQL command creates an employee table:\n\n```\nCREATE TABLE employee(\n  EmployeeId\
    \ INT NOT NULL PRIMARY KEY,\n  Surname VARCHAR(30) NOT NULL,\n  FirstName VARCHAR(30)\
    \ NOT NULL,\n  Salary MONEY NOT NULL\n)\n```\n\nAs you can imagine, salary is\
    \ sensitive data, you would not want to allow anyone who has not been authorized\
    \ to view this data. If you cannot use stored procedures, you can use views to\
    \ limit access. First, grant permissions to those who are allowed access (the\
    \ Accounting role, for example, for ad-hoc reporting) using the following command:\n\
    \n```\nGRANT SELECT ON employee TO Accounting\n```\n\nThen you remove permissions\
    \ from everyone else, as shown here:\n\n```\nDENY SELECT ON employee TO Public\n\
    ```\n\nHowever, there may be circumstances when other roles require access to\
    \ part of the employee table. For example, the TechnicalSupport role may need\
    \ to perform reporting. You can create a view to support this and grant access\
    \ to the view:\n\n```\nCREATE VIEW employeeList\nAS\nSELECT firstname, surname\n\
    FROM employee\nGO\n```\n\n```\nGRANT SELECT ON employeeList TO TechnicalSupport\n\
    GO\n```\n\nNow any account in the TechnicalSupport role can use the view to support\
    \ their reporting. For OR scenarios, ORMs will manage the capability to update\
    \ tables. Views can support UPDATE and DELETE operations, with the following restrictions:\n\
    \n+   - A view cannot modify more than one table. If a view is based on more than\
    \ one table, DELETE operations will fail. If you execute an INSERT or UPDATE statement\
    \ over the view, all columns referenced within the statement must belong to the\
    \ same table.\n\n+   - A view containing DISTINCT clause, a GROUP BY clause, or\
    \ any type of calculated columns, cannot be updated.\n\nAs you can see, for situations\
    \ that would normally require table access, views can present a more secure alternative."
  merge: -1
