    is a must read, and Vittorio blog at http://blogs.msdn/vbertocci contains lots
    of code samples, Web casts, and other technical resources.


    Before you download WIF from the MSDN site at http://msdn.microsoft.com/security/a570351.aspx.
    The WIF download comes as a separate SDK download that adds templates to Visual
