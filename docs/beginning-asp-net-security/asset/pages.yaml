- img_proc: true
  md: "# CHAPTER 16 SECURE DEVELOPMENT WITH THE ASP.NET MVC FRAMEWORK\n\n![](img/c28a05c0528daad8a392659cd26abcda_392_0.png)\n\
    \n**FIGURE 16-2** The default MVC presentation of errors when model binding\n\n\
    If you want your model to provide more informative messages in much the same way\
    \ validation controls in Web Forms, then you can use the IDataErrorInfo interface\
    \ to provide it. This interface is part of the .NET framework itself, living in\
    \ System.Component model. It exposes the\n\n+   * Error The Error property gets\
    \ a size error message indicating what is wrong with the object.\n* Item The Item\
    \ property takes a parameter and returns an error message indicating what is wrong\
    \ with that property.\n\nWith the Set accessors of your model, you can build a\
    \ dictionary of errors, indexed by their property name and log validation problems\
    \ as they happen. Listing 16-1 provides an example.\n\n# **LISTING 16:** Implementing\
    \ IDataErrorInfo\n\n```\npublic class BoardPost : IDataErrorInfo\n{\n    ...\n\
    \    Dictionary<string, string> errorInformation = new Dictionary<string, string>();\n\
    \    public int Rating\n    {\n        get\n        {\n            return this.rating;\n\
    \        }\n        set\n        {\n            if (value < 0 || value > 10)\n\
    \            {\n                errorInformation.Add(\"Rating\",\n           \
    \     \"Ratings must be between 0 and 10\");\n```"
