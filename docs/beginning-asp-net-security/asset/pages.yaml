    # ASP.NET Validation Controls


    ASP.NET provides six validation controls:


    +   - RequiredValidator

    - RangeValidator

    - RegularExpressionValidator

    - CompareValidator

    - CustomValidator


    Each control has some additional properties


    +   - ControlToValidate — The name of the control validation rule applies to.

    - EnableClientScript — When set false, no client-side validation will occur, and
    checks will only happen once the page is submitted to the server.'
