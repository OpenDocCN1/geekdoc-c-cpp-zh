  md: 'The IP address at the top of the results belongs to Yahoo; the other IP address
    was my own. If you wanted to see which browser identifier was sent by a particular
    IP address, you would use the following query:


    ```

    LogParser "SELECT DISTINCT c-ip, cs(User-Agent) from ex081213.log\nWHERE c-ip=''69.147.90.42*''
    -rtp:1

    ```


    This query returned the following results, which indicate that it was simply a
    Yahoo robot for blogs, probably following links to tests I made and deleted.


    ```

    c-ip                          cs(User-Agent)

    69.147.90.42  Yahoo!MyBlogLog+API+Client+(curl)+5.2.5

    ```


    Statistics:


    Elements processed: 919

    Elements output: 1

    Execution time: 0.01 seconds


    Another piece of data is the status codes returned to the browser. Status codes
    can indicate error conditions or brute force attempts. Status code 401 indicates
    an unauthorized request; status code 500 indicates a server-side error in your
    application. To use the status codes, use the following:


    ```

    logparser "SELECT cs-uri-stem, sc-status, Count(*)\nAS Total FROM ex*.log\nWHERE
    (TO_LOWER(cs-uri-stem) LIKE ''%.asp%'' OR\nTO_LOWER(cs-uri-stem) LIKE ''%.svc'')
    AND\nsc-status >400 GROUP BY cs-uri-stem, sc-status\nORDER BY cs-uri-stem, sc-status*"
    -rtp:1

    ```


    Finally, a potential indicator of problems is a higher-than-average number of
    bytes to a page, or by reading the amount of bytes sent from a page, you could
    use the following:


    ```

    logparser "SELECT cs-uri-stem, Count(*) AS Hits, AVG(cs-bytes) AS Avg,\nMAX(cs-bytes)
    AS Max, MIN(cs-bytes) AS Min, Sum(cs-bytes) AS Total FROM ex*.log WHERE TO_LOWER(cs-uri-stem)
    LIKE ''%.asp%'' OR\nTO_LOWER(cs-uri-stem) LIKE ''%.svc''\nGROUP BY cs-uri-stem
    ORDER BY cs-uri-stem*" -rtp:1

    ```


    To query the amount of bytes by a page, you could use the following:


    ```

    logparser "SELECT cs-uri-stem, Count(*) AS Hits, AVG(cs-bytes) AS Avg,\nMAX(cs-bytes)
    AS Max, MIN(cs-bytes) AS Min, Sum(cs-bytes) AS Total FROM ex*.log WHERE TO_LOWER(cs-uri-stem)
    LIKE ''%.asp%'' OR\nTO_LOWER(cs-uri-stem) LIKE ''%.svc''\nGROUP BY cs-uri-stem
    ORDER BY cs-uri-stem*" -rtp:1

    ```'
