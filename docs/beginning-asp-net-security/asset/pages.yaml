  md: '# A CHECKLIST FOR QUERY STRINGS, FORMS, EVENTS, AND BROWSER INFORMATION


    The following is a checklist you should follow when deciding how to deal with
    query strings, forms, events, and browser information:


    +   - Never change state via GET request.—The HTTP specifications state that GET
    requests must not change state.

    - Do not use direct, sequential object references—Always use indirect object references
    (such as a GUID) to refer to resources on a Web server. Direct object references
    can be changed easily to allow attackers to access objects they should not be
    able to see. Check that the current user is authorized to see the object requested.

    - Do not use hidden fields to hold sensitive information, unless they are properly
    protected.—Remember that form fields (and query strings) can be manipulated by
    attackers.

    - Add a CSRF token to your forms—This will allow you to check that the request
    came from your own Web site.

    - Check the Request type when checking if a request is a postback—This will protect
    you from ASP.NET considering query string-driven requests as potential postbacks.

    - Do not disable event validation, but do not rely on it—Registering for event
    validation is optional for controls. Always check conditions within postback events.

    - Do not rely request headers.—Combine the steps outlined in this chapter with
    the validation checklist provided in Chapter 3.'
