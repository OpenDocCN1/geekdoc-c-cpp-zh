  md: "# Impersonation with Windows Authentication\n\nUsing Windows authentication\
    \ offers the advantage of impersonation. By default, IIS is configured to run\
    \ your applications as a build in the Windows account, Network Service. This account\
    \ is limited in the access it has to resources on the server, and cannot access\
    \ resources on other computers at all.\nYou can change the account by configuring\
    \ the application pool, but what if you want to run under the identity of an authenticated\
    \ user (for example, to authenticate as a user against a SQL server or a network\
    \ resource)? Listing 7-9 shows how you can discover the three types of identity\
    \ you can have.\n\n+   LISTING-9: Discovering the underlying IIS Windows account\n\
    \n```\n<!DOCTYPE html\nPUBLIC \"-W3C//DTD HTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/html1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head runat=\"server\">\n<title></title>\n\
    </head>\n<body>\n<form id=\"form1\" runat=\"server\">\n<p>Run this sample under\
    \ IIS</</p>\n<p>Page Identity <%= User.Identity.Name %></p>\n<p>Windows Identity\n\
    \n<%= Windows.Identity.GetCurrent().Name %></p>\n<p>Thread Identity <%= Thread.CurrentPrincipal.Identity.Name\
    \ %></p>\n</form>\n</body>\n</html>\n```\n\nIf you run this code using the Visual\
    \ Studio server, you will see your own login details for every identity (assuming\
    \ you have Windows authentication enabled in the web.config file). But if you\
    \ place it on an IIS server, configured for anonymous access, you will see a different\
    \ behavior—the page and thread identity are blank, and the Windows identity is\
    \ NT AUTHORITY\\NETWORK SERVICE.\n\nIf you configure your IIS application to use\
    \ integrated authentication and reload the page, you will see that the Page and\
    \ Thread identities are now the account you authenticated with, but the Windows\
    \ identity remains as the Network Service Account. This is the account used to\
    \ authenticate against other network resources—so why hasn't it changed?\n\nFor\
    \ security reasons NTLM credentials cannot hop between services, or if you try\
    \ to, for example, login to a SQL server using Trusted Connections you will find\
    \ that the account user will be the application pool identity. So what can you\
    \ do? If you want to pass the user's identity to another system then you must\
    \ wrap the call in the following code\n\n```\nusing (((HttpContext.Current.User.Identity).Impersonate())\n\
    {\n    // Perform database or network access here\n}\n```\n\n![](img/c28a05c0528daad8a392659cd26abcda_177_0.png)"
  merge: -1
  pgno: 177
- img_proc: true
  md: "# AUTHORIZATION IN ASP.NET\n\nNow that you have authenticated users, you can\
    \ continue to the next step: authorizing access to resources. In List 7-2 earlier\
    \ in this chapter, you already made use of the authorization element in the `web.config`\
    \ file:\n\n```\n<authorization>\n<deny users=\"*\"/>\n</authorization>\n```\n\n\
    It is this element that controls access to resources — but how do you use it?\
    \ Create a new Web application and replace the `web.config` file with List 7-10.\n\
    \n# LISTING 7-10: Denying access to all users with web.config\n\n```\n<xml version=\"\
    1.0\"?>\n<configuration>\n  <system.web>\n    <authentication mode=\"Windows\"\
    \ />\n    <authorization>\n      <deny users=\"*\"/>\n    </authorization>\n \
    \ </system.web>\n</configuration>\n```\n\nIn this example, the `web.config` file\
    \ has configured authentication to use Windows-based authentication, and it also\
    \ has an authorization configuration. The `<authorization>` element is used to\
    \ define what users can access resources in the current directory or any of its\
    \ subsidiaries. The `<deny>` element in the example specifies that all users,\
    \ regardless of their authentication state, are denied access. If you try to browse\
    \ to a page in your new Web site, you will receive an \"Access denied\" error.\n\
    \nIn most instances, you will want to allow some users access to your resources.\
    \ To do this, use the `<allow>` element. Let's start off by allowing a single\
    \ user.\n\nList 7-11 shows how to use the `<allow>` element to grant access to\
    \ the barryd user in the WBOX domain. If you replace the username with your own\
    \ username, you will see that you can now browse to pages on your Web site. However,\
    \ allowing users by name is not the most scalable access method — which is where\
    \ the concept of roles comes in. First, however, you should examine the `<allow>`\
    \ and `<deny>` settings.\n\n```\n<xml version=\"1.0\"?>\n<configuration>\n  <system.web>\n\
