- img_proc: true
  md: '+   - Do not roll your yours unless you have to—There are some cases where
    you may wish to develop your own authentication and authorization functions, but
    doing so is fraught with potential mistakes. If you have an existing user database,
    then consider implementing the membership and roles providers models. This will
    enable you to use the standard methods to control access.

    - Encourage your users to logout—Persistent authentication can lead to CSRF attacks.
    For high-value systems, encourage users to log out by providing a visible and
    consistent logout button and do not provide “Remember Me” functionality.

    - Always start with a deny access role—Being specific in who you allow to access
    resources is safer than specifying who does not have access.

    - Be aware of the differences between ASP.NET and IIS authorization rules—IIS
    authorization rules run against every resource. ASP.NET authorization rules will
    only protect resources mapped to a managed code handler.

    - If you use programmatic authorization checks to hide or display controls, ensure
    that authorization checks run during execution of the underlying code.—If you
    show or hide user elements as buttons based on roles or usernames, check again
    in any method bound to those buttons such as OnClick() event.

    - If resources belong to a user check the current user before serving them.—If
    a resource such as a message is for a particular user then check the current user
    has access to that resource.'
