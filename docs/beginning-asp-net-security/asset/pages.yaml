    | cs (User-Agent) | User Agent | Helps to identify browsers or scripts. |

    | cs (Cookie) | Cookie | Helps to uniquely identify users. Be aware if you are
    using ASP NET sessions, forms, or using cookies for your own purposes, the logging
    of cookies may contain sensitive information that could identify a user. If this
    is the case, then you should carefully consider not logging cookies. Recording
    such data, even if log files are in a protected location, is a risk you will want
    to avoid. |

    | cs (Referer) | Referer | Helps identify the source of an attack if it came from
    a Web page. Google hacking is an example of this. Certain Google searches will
    return potentially vulnerable pages or scripts.'
