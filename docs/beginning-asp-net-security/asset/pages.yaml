    with Listing 7.1, you will see something similar to Figure 7-1.


    ![](img/c28a05c0528daad8a392659cd26abcda_159_0.png)


    **FIGURE 7-1:** Typical results of running the User Property Code


    You can see from Figure 7.1, or the results of running Listing 7.1, that you are
    an authenticated user. Your username will be your computer name, followed by a
    \ and then your Windows login name. So were you authenticated in this way? The
    reason why it did this lies in the web.config file, which contains authentication
    mode="Windows"/> . This tells ASP.NET to let Windows provide authentication, depending
    on your browser settings and the URL the application is running on, will automatically
    negotiate with the browser and log in silently. The Windows login method uses
    an authentication protocol called NT LAN Manager, or NTLM, which you can see in
    the authentication type in the sample application.'
