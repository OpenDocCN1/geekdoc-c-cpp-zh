    \ store you can also load\n// public key certificates from files, as demonstrated\n\
    // below.\nX509Certificate2 serverPublicKeyCertificate = \nLoadCertificateFromFile(\"\
    myserver.cer\");\n```\n\n![](img/c28a05c0528daad8a392659cd26abcda_150_0.png)\n\
    \ncontinues"
