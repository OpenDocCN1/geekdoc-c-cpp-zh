  md: "# CREATING AND CONSUMING WCF SERVICES\n\nTo illustrate the use of WCF security\
    \ in this chapter, you will write a simple WCF service and the code to consume\
    \ it. Visual Studio 2008 comes with specific project types for a WCF service that\
    \ you can use to get started, and provides you with a test service, but this service\
    \ is not hosted within a Web site. Instead, here you create a new Web site and\
    \ add WCF service to it. You will then write a client application to connect to\
    \ this WCF service. The example is also found in your book's Web site at www.wrox.com.\n\
    \nTo start, create a new ASP.NET Web application project add a reference to System.ServiceModel.\
    \ Rightclick on the project and select \"Add New Item\" from the context menu.\
    \ From the Add New Item box choose WCF service and name the new EchoService. This\
    \ will create three files in your project: IEchoService.cs, EchoService.svc, and\
    \ EchoService.svc.cs. Edit IEchoService.cs and replace the contents of the file\
    \ with the code shown in Listing 11-1.\n\n+   LISTING 11: A sample WCF data contract\
    \ — IEchoService\n\n```\nusing System;\n\nnamespace WCFSecurity\n{\n    [ServiceContract]\n\
    \    public interface IEchoService\n    {\n        [OperationContract]\n     \
    \   string Echo(string message);\n    }\n}\n```\n\nNow, replace the default code\
    \ in EchoService.cs with code shown in Listing 11-2.\n\n+   LISTING 12: Implementing\
    \ the Echo Service — EchoService\n\n```\nusing System;\n\nnamespace WCFSecurity\n\
    {\n    public class EchoService : IEchoService\n    {\n        public string Echo(string\
    \ message)\n        {\n            return (\"You sent * \" + message);\n     \
    \   }\n    }\n}\n```\n\nRight-click on the EchoService.svc file in Solution Explorer\
    \ and choose \"Set as Start Page.\" Press F5 (or choose Debugging ▷ Start Debugging\
    \ from the menu) and you will see the information page for your service, as shown\
    \ in Figure 11-1."
