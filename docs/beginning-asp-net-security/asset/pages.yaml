    \        Response.End();\n    }\n}\n```\n\n5. Run this new page. Choose a file\
    \ name from the drop-down list and click the Get File button. You should see your\
    \ file served by the browser.\n\nAfter performing the previous \"Try It Out\"\
    \ exercise, you may spot a potential problem — the filename is passed via the\
    \ query string.\n\n> NOTE The example code has introduced another example of the\
    \ Insecure Direct Object Reference vulnerability. If you haven't read Chapter\
    \ 4, you may now wish to do so. That chapter discusses this vulnerability and\
    \ its mitigations in greater detail.\n\nBecause the sample code allows the user\
    \ to specify the filename, it can be easily hijacked to serve other files by changing\
    \ the filename in the URI for getfile.aspx from a valid filename to web.config.\
    \ For example, say that your address bar shows the following:\n\n```\nhttp://localhost:32715/Accessing%20Files/getfile.aspx?filename=example1.txt\n\
    ```\n\nThen let's say you change the URI to the following:\n\n```\nhttp://localhost:32715/Accessing%20files/getfile.aspx?filename=web.config\n\
    ```\n\nAs you can see, the serving code bypassed the built-in ASP.NET protection\
    \ that stops configuration files from being sent to the browser, and served up\
    \ web.config as if it were another file. However, if this weren't enough, you\
    \ could go further. For example, depending on where you have created the application,\
    \ the application may access files in your Windows directory:\n\n```\nhttp://localhost:32715/Accessing%20Files/getfile.aspx?filename=..\\\
    ..\\..\\..\\..\\..\\..\\windows\\win.ini\n```"
