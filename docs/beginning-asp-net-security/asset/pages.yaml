    # SECURITY AND PRIVACY WITH WCF


    Adding security to a WCF service is a three-step process:


    +   1. Select a security mode on the service side.

    2. Select the desired credential type on the service side.

    3. Set the client credential values on the client side.


    WCF offers two security modes:


    +   * Transport security

    * Message security


    # Transport Security


    Transport security provides point-to-point security between the client and the
    server. With transport security, the communication layer is responsible for protecting
    the messages. For example, Secure Sockets Layer (SSL) over HTTPS is a transport
    security mechanism. SSL encrypts and signs the messages it sends through it, as
    shown in Figure 11-4.


    ![](img/c28a05c0528daad8a392659cd26abcda_263_0.png)


    FIGURE 11-4: Transport security in WCF'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'Transport security is suitable for the following two scenarios:


    +   - When there are no intermediate systems between the client and the server.


    +   - When both the client and the server are hosted on the same intranet.


    Transport security has the following advantages:


    +   - Neither system has to understand any of the WSsecurity standards used for
    message security, simplifying the requirements made of a development framework.


    +   - Specialized hardware (such as SSL accelerators) may be used to further increase
    the performance and scalability of the solution.


    However, transport security also has the following disadvantages:


    +   - It supports a limited set of credentials.


    +   - It is dependent on the underlying transport, and some transports do not
    support security.


    +   - It precludes the use of routing or multiple hops, such as systems that expose
    a message router that accepts a message and forwards it to another internal system.


    # Message Security


    Message security is the converse of transport security. Instead of relying on
    the underlying transport, each message is signed and/or encrypted before it reaches
    the transport layer using the WS-Security specification. Message security also
    allows for a wider range of credentials, as long as both the client and the server
    agree on the type. Figure 11-5 illustrates message security.


    ![](img/c28a05c0528daad8a392659cd26abcda_264_0.png)


    FIGURE 11-5: Message security in WCF'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'Message security is suitable for use in the following scenarios:


    +   - When intermediate systems may route messages to other systems.


    +   - When custom authentication mechanisms may be used.


    Message security has the following advantages:


    +   - It is transport-independent.


    +   - Only parts of a message may be signed or encrypted as appropriate, thus
    improving performance.


    +   - It provides end-to-end security, allowing routing.


    However, message security has the following disadvantages:


    +   - The client and server must understand the WS-Security standard. Some programming
    frameworks may not support WS-Security.


    +   - The encryption of individual messages may decrease performance.


    # Mixed Mode


    In addition to transport and message security, .NET also supports a mixed mode,
    or a combination of the two approaches. In mixed mode, the integrity and encryption
    are provided by the transport layer, and authentication is taken care of at the
    message layer.


    # Selecting the Security Mode


    To select a security mode, follow these general steps:


    +   1. Select the appropriate binding for your application requirements. By default,
    nearly all of the WCF bindings have security enabled. The only exception to this
    is the BasicHttpBinding. Table 11-1 lists the common Web service bindings and
    the security options they offer.


    +   2. Select one of the security modes for your service binding. The binding
    you select may limit the security mode you can select. For example, WSDualHttpBinding
    does not allow transport mode security.


    +   3. If you choose transport security, then configure the host Web server with
    an SSL certificate.'
