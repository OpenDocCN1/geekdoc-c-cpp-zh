- img_proc: true
  md: "# TABLE 14-2: Default .NET Trust Levels\n\n| TRUST LEVEL | RESTRICTIONS |\n\
    | --- | --- |\n| Full | None. |\n| High | Cannot call unmanaged code. |\n| Medium\
    \ | Some restrictions placed on reflection: In addition to High restrictions:\
    \ Cannot create Web requests. Can only write files to the application directory\
    \ and below. Has some restrictions on the environment variables accessibility.\
    \ |\n| Low | In addition to Medium restrictions: Cannot make any out-of-process\
    \ calls (for example, to a database, to the network, or to send emails). |\n|\
    \ Minimal | Denied pretty everything. |\n\nYou should configure an application\
    \ or Web site to run with the minimum of privileges it needs by selecting the\
    \ appropriate trust level. For example, it's unlikely that the majority of Web\
    \ applications need to call unmanaged code, and so the trust level could be reduced\
    \ from Full (the default) to High. To set an application's trust level, navigate\
    \ to the site or application in IIS Manager, and double-click .NET Trust Levels\
    \ in the Features View. Select a trust level from the Trust Level drop-down list.\n\
    \nChanging the trust level will add an element to the `system.web` section of\
    \ an application web config file. For example, the following snippet sets an application's\
    \ trust level to High:\n\n```\n<system.web>\n  <trust level=\"High\" />\n</system.web>\n\
    ```\n\nMicrosoft recommends that the majority of applications run under Medium\
    \ trust.\n\n# Locking Trust Levels\n\nIf you want to stop applications from changing\
    \ their trust levels, you can select and lock a trust level by editing the .NET\
    \ framework\\web.config file, which is contained in the C:\\Windows\\Microsoft.NET\
    \ Framework\\<version> directory. The definitions for Trust Levels are contained\
    \ in the system.web <securityPolicy> section.\n\nIf you open the file, you will\
    \ see this section is wrapped by a <location> element. If you change the allowOverride\
    \ parameter on the <location> element to false, the trust level specified in the\
    \ <trust> element of the security policy will apply to all applications hosted\
    \ by IIS. Any attempt to"
  merge: -1
  pgno: 342
- img_proc: true
  md: "change the trust via web.config will cause an exception to be thrown, and the\
    \ application will not start.\n\nThe following code illustrates a configuration\
    \ where all applications will run in Medium trust:\n\n```\n<location allowOverride=\"\
    false\">\n  <system.web>\n    <securityPolicy>\n      <trustLevel name=\"Full\"\
    \ policyFile=\"internal\"/>\n      <trustLevel name=\"High\" policyFile=\"web_hightrust.config\"\
    />\n      <trustLevel name=\"Medium\" policyFile=\"web_mediumtrust.config\"/>\n\
    \      <trustLevel name=\"Low\" policyFile=\"web_lowtrust.config\"/>\n      <trustLevel\
    \ name=\"Minimal\" policyFile=\"web_minitrust.config\"/>\n    </securityPolicy>\n\
    \    <trustLevel name=\"Medium\" originUrl=\"\"/>\n  </system.web>\n</location>\n\
    ```\n\n# Creating Custom Trust Levels\n\nYou may discover that the recommended\
    \ Medium trust level is too restrictive for some applications (generally those\
    \ that making outgoing Web Calls to Services or remote content providers), High\
    \ trust may grant too many permissions. In this scenario, you can create a custom\
    \ trust level. For example, you may have a level based on Medium trust, but allow\
    \ all outgoing network connections.\n\nThe following instructions illustrate how\
    \ to use the Medium trust configuration as a base, and add permission to make\
    \ outgoing network connections:\n\n+   1. Open the c:\\Microsoft\\.NET\\(version)\
    \ \\CONFID.\n\n+   2. Copy the Medium trust configuration, web_mediumtrust.config,\
    \ to a new file in the same directory (for example, web_mediumplus.config), and\
    \ open it in a text editor.\n\n+   3. Find the WebPermission section in the configuration\
    \ file, which should look like the following:\n\n```\n<IPermission class=\"WebPermission\"\
    \ version=\"1\">\n  <ConnectAccess>\n    <URI uri=\"$originHost\"/>\n  </ConnectAccess>\n\
    </IPermission>\n```\n\n+   4. This change by removing theConnectAccess element\
    \ and adding anUnrestricted attribute with a value of true, like so:\n\n```\n\
    <IPermission class=\"WebPermission\" version=\"1\">\n  Unrestricted=\"true\"\n\
    </IPermission>\n```\n\n+   5. You can also remove (by commenting out) the PrintingPermission\
    \ if your application does not talk to printers, and the EnvironmentPermission\
    \ if your application does not need access to environment variables."
