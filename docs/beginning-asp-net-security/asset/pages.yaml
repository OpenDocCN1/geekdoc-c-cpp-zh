- img_proc: true
  md: "![](img/c28a05c0528daad8a392659cd26abcda_295_0.png)\n\nFIGURE 122: The traditional\
    \ HTTP communication model versus the AJAX communication model\n\n# # The XMLHttpRequest\
    \ Object\n\nXMLHttpRequest (XHR) was initially implemented by Microsoft as an\
    \ ActiveX control to provide functionality needed for Outlook Web 2000. It became\
    \ part of the browser in IE 5.0, and was natively implemented in Mozilla 1.0,\
    \ and then spread to other browsers. World Web Consortium (W3C) published a Working\
    \ Draft to standardize the XMLHttpRequest API to provide a common set of interoperable\
    \ features that work in every browser.\n\nThe XHR object exposes an interface\
    \ to the browser's network stack, creating requests and parses the response through\
    \ the Web browser. For example, the code in Listing 12-1 would send the specified\
    \ message to the `log.ajax` page on a server as an HTTP POST request.\n\n+   LISTING\
    \ 12: Using the XHR to send a request to a logging service\n\n```\nfunction log(message)\
    \ {\n  var xhr = new XMLHttpRequest();\n  xhr.open(\"POST\", \"log.ajax\");\n\
    \  xhr.setRequestHeader(\"Content-Type\", \"text/plain;charset=UTF-8\");\n  xhr.send(message);\n\
    }\n```"
  merge: -1
