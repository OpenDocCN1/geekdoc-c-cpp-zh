  md: 'Cross Site Scripting(XSS) —This attack uses flaws in an application to inject
    JavaScript that can be used to redirect users, change the content of a page or
    steal a user''s session. The attack and mitigation techniques are covered in Chapter
    3.


    Injection flaws—Injection flaws are exploited by malformed input data, causing
    the application to change queries or run commands against a back-end system such
    as SQL. This is covered in Chapter 8 and Chapter 10.


    Malicious file execution—This exploit involves the execution of files that are
    not part of your application, via a reference to an external object, or, if your
    application allows, files to uploaded from remote sources. ASP.NET does not allow
    the inclusion of executable code if you allow users to upload content, you may
    still be at risk. Securing uploads is covered in Chapter 9.


    Insecure direct reference—If a developer exposes a reference to an internal object
    (such as a database''s primary key, or a identifier that can be easily manipulated)
    and does not implement an access control, then an attacker can access other similar
    objects by guessing references. Techniques for handling this problem are discussed
    in Chapter 4. Authentication and authorization are covered in Chapter 7.


    Cross Request Forgery(CSRF) —A CSRF attack forces a logged-on victim''s browser
    to submit requests to a vulnerable application, which are executed as if the application
    itself caused the request. This exploit and mitigations against it are covered
    in Chapter 4.


    Information leakage and improper error handling—An attacker can use errors to
    discover information about your application. Error handling is discussed in Chapter
    5, and configuration of files is covered in Chapter 6.


    Broken authentication and session management—A poorly authenticated system is
    as useful as a chocolate teapot—providing a false sense of security because credentials
    may not be encrypted or sessions may be hijacked. Writing a secure authentication
    protocol is a difficult task, and often will be better served by using implementations
    native to your development platform. Chapter 7 introduces ASP.NET''s member providers,
    and discusses native authentication. Chapter 11 introduces authentication for
    Web services.


    Insecure cryptographic storage—Until you understand the various cryptographic
    building blocks and their uses, you may use cryptography incorrectly. Incorrect
    cryptography is insecure. Chapter 6 deals with encryption of data and detecting
    changes to data.


    Insecure communications—Applications often do not encrypt traffic between the
    application and the end user, or to back-end endpoints. Encryption of Web traffic
    is covered in Chapter 14, and encryption of Web services is missing in Chapter
    11.


    Failure to restrict URL access—Authentication without authorization is a key piece
    of the security puzzle. Applications can authenticate users, but fail to restrict
    access to sensitive areas. Authorization with ASP.NET is discussed in Chapter
    7. Chapter 11 covers authorization with Web services, and Chapter 16 covers authorization
    with the ASP.NET model-view-controller (MVC) paradigm.'
  merge: -1
