  md: '# Managing Role Members Programmatically


    Of course, a role is useless without any members. To add a single user to a role,
    you use AddUserToRole(). To add a user to multiple roles, you use AddUserToRoles()
    .


    ```

    Roles.AddUserToRole(string username, string rolename)

    Roles.AddUserToRoles(string username, string[] roleNames)

    ```


    To add multiple users to a role, you use AddUsersToRole(). To add to multiple
    roles, you use Roles.AddUsersToRoles() .


    ```

    Roles.AddUsersToRole(string[] usernames, string rolename)

    Roles.AddUsersToRoles(string[] usernames, string[] roleNames)

    ```


    You can get the users of a particular role by using the GetUsersInRole() method,
    which returns an array of strings containing the role members'' names.


    ```

    Roles.GetUsersInRole(string rolename)

    ```


    Alternatively, if you want to get the roles for a particular user, you use GetRolesForUser(),
    which returns an array of strings containing the role names user belongs to.


    ```

    Roles.GetRolesForUser(string username)

    ```


    Finally, should you wish to delete a single user from a role, you use RemoveUserFromRole(),
    or to remove a user from multiple roles, you use RemoveUserFromRoles() .


    ```

    Roles.RemoveUserFromRole(string username, string rolename)

    Roles.RemoveUserFromRoles(string username, string[] roleNames)

    ```


    To remove users from a role, you use RemoveUsersToRole(). To remove users from
    multiple roles, you use Roles.RemoveUsersToRoles() .


    ```

    Roles.RemoveUsersToRole(string[] usernames, string rolename)

    Roles.RemoveUsersToRoles(string[] usernames, string[] roleNames)

    ```


    # Roles with Windows Authentication


    As with authentication, roles with Windows authentication, do not take ASP.NET
    configuration. You simply enable the role manager in your web.config file. When
    Windows authentication is used, roles directly map to the user''s group membership.
    For example, if a user account is in the WROX Active Directory and is a member
    of the Editors group, ASP.NET will treat this as being part of the WROX\Editors
    role.


    Because group membership is provided by the Windows management functionality,
    you cannot add or remove roles, or add or remove members from roles unless you
    implement your own Role Manager provider.'
  merge: -1
