  md: '# 2


    # # How the Web Works


    Over the years, the Web has grown from its origin as simple textual HTML with
    links to include images, sounds, JavaScript, Java Applets, style sheets, Shockwave,
    Flash, Silverlight, and all sorts of other types of content and browser capabilities.
    However, underneath all, the method for requesting and receiving resources has
    remained the same: Hypertext Transfer Protocol (HTTP).


    When Microsoft released ASP.NET, it enabled the quick production of Web applications
    by abstracting and hiding from developers the basic nature and limitations of
    both HTML and HTTP. While this abstraction offers productivity bonuses, the architecture
    of the Web and of ASP.NET is essential in understanding how your Web application
    can be attacked, and how you can defend it.


    This chapter introduces you to HTTP and the ASP.NET abstractions by examining
    the following:


    +   - How HTTP works

    - How HTTP form submissions

    - How ASP.NET implements postbacks

    - How the ASP.NET processing pipeline works

    - How you can use HTTP Modules


    # ## EXAMININGHTTP


    HTTP is a request/response standard protocol between a client and a server. The
    *client* is typically a Web browser, a spidering robot (such as search engines
    use to crawl the Web), or other piece of software. The *server* is a program that
    understands HTTP, listens for requests from a client (also known as a *User Agent*),
    and responds appropriately.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# CHAPTER 2 HOW THE WEB WORKS


    An HTTP client initiates a connection to the server via a communications mechanism
    known as Transmission Control Protocol (TCP) and connects to the Web server. Each
    computer on the internet has an Internet Protocol (IP address), similar in principle
    to a telephone number. However, an IP address is not enough to make a connection.
    Multiple services may be running on the destination computer — a server, an FTP
    server, and so on. Each service on a computer listens on a port. If you think
    of an IP address as a telephone number, then the port is analogous to an extension
    that supports direct dialing. If you want to call a service directly, you use
    the IP address and the port number to connect.


    The common services have wellknown ports; the standard HTTP port is 80. The Web
    server listens on this port. Once a HTTP client connection is established, the
    server listens for a request from the client. The server receives the request,
    processes the request and responds with a status line (for example HTTP/1.1 200
    OK). The server transmits the rest of response message, which may contain HTML,
    an image, audio, an error message, or any other information it wishes to send.


    HTTP was developed by the World Wide Web Consortium (W3C) and the Internet Engineering
    Task Force (IETF). Unlike HTML, the standard has not changed much since its initial
    draft. The original definition (version 0.9) was created in 1991. This was followed
    in 1996 with HTTP version 1.0, which evolved into HTTP 1.1 in 1999. HTTP 1.1 is
    the most commonly used version today.


    The specification for HTTP 1.1 is documented in RFC 2616. An RFC (Request for
    Comment ) is the standard mechanism used to document standards and propose new
    standards for communications on the Internet. New RFCs are created as drafts and
    circulated for comments, and some drafts may never become a standard, or become
    part of common use before they are finalized. You can find RFCs at the IETF home
    page at http://www.ietf.org/


    # Requesting a Resource


    An HTTP request is a simple text message that consists of the following:


    +   - The request line (exampleGET /default.htm HTTP/1.1, which requests /default.htm
    from the root of the Web site)

    - Optional header information (such as the type of client software being used)

    - A blank line

    - An optional message body


    Each line ends with a carriage-return character, followed by a line-feed character.
    Listing 2-1 shows an example of an HTTP request sent to Google for its home page
    from Internet Explorer 7. In the example, each line has been numbered to aid in
    the explanation that follows. These numbers are not present in an actual request.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# LISTING 2: A Sample HTTP Request to google.com


    ```

    1 GET /HTTP/1.1

    2 Accept: image/gif, image/x-xmap, image/jpeg, image/jpeg,

    application/x-ms-application, application/vnd.ms-xpsdocument,

    application/x-xml, application/x-ms-xbap, \=

    application/x-shockwave-flash, application/x-silverlight, \=

    application/vnd.ms-excel, application/vnd.ms-powerpoint, \=

    application/msword. /** */

    3 Accept-Language: en-GB

    4 UA-CPU: x86

    5 Accept-Encoding: zip, deflate

    6 User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0;

    SLCC1; NET CLR 2.0.50727; Media Center PC 5.0; InfoPath2;

    NET CLR 3.5.21022; OfficeConnector.1.1; MS-RTC LM 8;

    NET CLR 3.5.30729; NET CLR 3.0.30618

    7 Host: www.google.com

    8 Connection: Keep-Alive

    ```


    You can see that line 1 contains the GET command, which indicates to the Web server
    that the client wishes information to be sent to it. The GET request contains
    two parameters: the address of the resource requested (in this case, /) and the
    version of the HTTP protocol the client can understand (in this case, HTTP/1.1).


    Lines 2 through 6 contain optional information added by the client software (in
    this case, Internet Explorer 7). None of this information is necessarily needed
    by the Web server, but is used to inform the server about what the client is capable
    of. Following is a breakdown, line by line:


    +   - Line 2, the Accept header, is used to indicate to a server which file formats
    the client is capable of understanding.


    +   - Line 3, the Accept-Language header, informs the server of the clients preferred
    language format.


    +   - Line 4, the Accept-CPU header, tells the server the CPU family the client
    software is running on.


    +   - Line 5, the Accept-Encoding header, tells the server that, in addition to
    accepting textual responses, the client can also accept responses that have been
    compressed in the gzip or deflate formats.


    +   - Line 6, the User-Agent header indicates the client software in use.


    Line 7, the Host header is a mandatory header that the client is using HTTP version
    1.1, which specifies the host that the client is requesting the resource from.
    This header enables Multiple sites on different domain names to share an IP address.


    Line 8, the Connection header, indicates that the connection to the Web server
    should be kept open after the response is sent, is faster than dropping and re-creating
    a connection with every request and response.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Finally, line 9 is a blank line, simply a carry return character followed by
    a line feed character, which indicates the end of the request headers and, in
    this case, the request itself. Requests may send a message body after this line,
    such as a POST request that contains information submitted by a form. You will
    see these types of requests later in this chapter.


    # Responding to a Request


    Once the request has been sent, the server processes it and sends back a response
    message. Like the request, the HTTP response is a text protocol consisting of
    the following:


    +   * The response status line

    * General headers

    * Optional headers

    * Entity headers

    * A blank line

    * The resource requested


    Listing 2-2 shows the response from Google to the previous request. Again, each
    line has been numbered to aid in explanation, but these numbers do not exist in
    the actual response.


    LISTING 2-2A Sample HTTP Response from google.com

    |1 HTTP/1.1 200 OK|

    |2 Cache-Control: private; max-age=0|

    |3 Date: Sat, 20 Sep 2008 08:57:53 GMT|

    |4 Expires: -1|

    |5 Content-Type: text/html; charset=UTF-8|

    |6 Set-Cookie: FREED=ID=ee84e7666c733a8;TM=221901073;LM=221901073;S=lbHgogMRraMgw;Mon,
    20-Sep-2010 08:57:53 GMT;domain=.google.co.uk|

    |7 Server: gws|

    |8 Content-Length: 7044|

    |9|

    |10 <html><head>...</head></html>


    Line 1 is the status line, and consists of the protocol the server is using (in
    this case, HTTP version 1.1), just like the request. This is followed by the numeric
    status and its textual representation (in this case, 200 OK, indicating that the
    response has been successful). If, for example, the requested resource could not
    be found, the response would have a 404 Not Found.

    The first digit of the status code indicates the class of the response, as shown
    here:


    +   * 1xx indicates an informational status, and that the process continues.

    * 2xx indicates that the response was successfully received, understood, and accepted.

    * 3xx indicates that a redirection is necessary, and the client software must
    take further action to retrieve the requested resource.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '+   4xx indicates that there is a client-side error. These can include bad
    request syntax, a request for a resource that does not exist, or a request for
    a resource that requires authentication, but authentication details were not sent.


    +   5xx indicates that an error occurred on the server.


    The full list of status codes can be found in Section 6.1.1 of the HTTP standard.


    Line 2 and 3 contain general response headers.


    +   Line 2, Cache-Control header, informs the browser how it should cache the
    response. The private value indicates that it is for a single user, and should
    not be cached by any proxies that sit between the user and Google. The max-age
    parameter indicates that the client software should not cache the response.


    +   Line 3 shows the date and time the response was generated.


    Lines 4 to 8 contain a mixture of entity and optional headers. Optional headers
    describe the resource being served. Headers containing optional information about
    the server. Following is a breakdown of these lines:


    +   Line 4 Expires entity header, which indicates that the response is already
    stale, and should not be cached by the client.


    +   Line 5, the Content-Type entity header, indicates the media or MIME type of
    the resource being served (in this case, HTML encoded in the UTF-8 character set).


    +   Line 6 Set-Cookie, is an optional header indicating to the client software
    it should create a cookie with values and expiration dates in the header value.


    +   Line 7 Server, is an optional header indicating the type of server used on
    the originating server (in this case, gws to represent Google''s specialized Web
    server software).


    +   Line 8, Content-Length header, is an entity header that indicates the size
    of the entity body, which follows the header fields.


    Line 9 is a blank line that indicates the end of header fields, and line 10 is
    the body of the request (in this case, the resource requested, Google''s home
    page).


    # Sniffig HTTP Requests and Responses


    When debugging Web, or trying to understand the underlying mechanisms an an application
    uses, this section introduces you to one such debugging tool, Fiddler, and how
    you can use it to craft HTTP requests. A lot of tools with legitimate uses, such
    as Fiddler can be used by an attacker to send requests to a Web site in an attempt
    to compromise it.


    Fiddler''s developer, Eric Lawrence, describes Fiddler as a “Web debugging proxy
    which logs all HTTP(S) traffic between your computer and the Internet”. Normally,
    a proxy server sits inside a corporation or Internet service provider acting as
    an intermediary between client machines and the wider Internet. All requests from
    a client machine configured to use a proxy server to go to the proxy'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# CHAPTER 2 HOW THE WEB WORKS


    server, which, in turn, contacts the server hosting the requested resource. Proxy
    servers can be used to cache responses, serving them to multiple clients who request
    the same resource, reducing the amount of Internet bandwidth used. Proxy servers
    can also provide basic security functions, hiding the client machine from the
    Internet, and keeping details of the requested host.


    When activated, Fiddler configures the browsers to route all requests through
    itself, and logs the request. It then forwards the request onward, accepts the
    response, logs the response, and finally, returns the response to the browser.
    The Fiddler user interface allows you to examine the logged requests and responses,
    as well as to create requests manually (or from a logged request). It allows you
    to send requests to a server and view the response for your customized request.


    To use Fiddler, first download and install it at http://www.fiddler2.com. Installing
    Fiddler will create settings within your start menu, a menu item in Internet Explorer
    (IE), and (if you have installed) an extension within Firefox. When using Fiddler,
    it is a good idea to close other applications that may use HTTP (such as RSS readers
    or instant messaging programs), because their requests and responses will also
    be logged by Fiddler. This makes it more difficult to track the requests and responses
    you specifically want to watch.


    Start Fiddler by clicking on its icon in the Windows start menu. Fiddler''s user
    interface consists of a menu bar, and two windows within the body of the application,
    as shown in Figure 2-1. The left-hand window contains the log of each request
    made through Fiddler. The right-hand window contains a detailed view of the request
    and the response, as well as the tool to create requests manually and other debugging
    features (such as a timeline and a tool to replay previous requests to new requests).


    ![](img/c28a05c0528daad8a392659cd26abcda_29_0.png)


    Figure 21: The Fiddler user interface'
  merge: -1
