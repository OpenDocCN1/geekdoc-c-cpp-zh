    clear text value from its hash.


    # Salting Passwords


    However, storing passwords as hashes is not that simple. Because a hashing algorithm
    is deterministic (that is, producing the same results for identical), it is possible
    to produce pre-calculated lists of common hashes (for example, to produce a database
    of hashes for every word in a dictionary). The initial time to produce these lists
    is significant. However, once produced, lookup is simple.


    Raw hashes are also vulnerable to rainbow tables, a method of balancing the need
    for pre-computation of hashes and the obviously large storage necessary to keep
    an entire dictionary of hashes. A rainbow table contains values that are used
    to "zoom in" to the clear text value through multiple iterations through the rainbow
    table, rather than a simple lookup that a pre-computed hash dictionary offers.


    These approaches make attacks against hashes. Even without these, using a hash
    that means two or more users with the same password would have the same password
    hash, representing an information.


    The standard approach to avoiding these weaknesses is known as salting. Salting
    involves the addition of entropy to the password by storing the combined hash
    of a salt (a random value) and the password. The salt does not need to be kept,
    and so it can be stored with the password. The combination of a salt plus a password
    means that a dictionary of hash lookups would have to be produced for every possible
    salt value, which would take both significant amount of time and space. The length
    and complexity of the salt affects the time taken for a Rainbow attack – the longer
    and more complex the salt, the greater the time needed for a successful attack.
    For each value you hash, you should use a new salt value. Using a new salt means
    that a new dictionary would have to be produced for every single password stored
    in your.


