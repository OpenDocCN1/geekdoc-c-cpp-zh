- img_proc: true
  md: "```\n<xml version=\"1.0\" encoding=\"utf-8\"?>\n<Accounts>\n  <Account ID=\"\
    1\">\n    <FirstName>Phil</FirstName>\n    <LastName>Pursglove</LastName>\n  \
    \  <Username>ppursglo</Username>\n    <Password>seccret</Password>\n  </Account>\n\
    \  <Account ID=\"2\">\n    <FirstName>Richard</FirstName>\n    <LastName>Hopton</LastName>\n\
    \    <Username>rhonton</Username>\n    <Password>pass</Password>\n  </Account>\n\
    </Accounts>\n```\n\nThe following XPath expression would check a login for the\
    \ user 'ppursglo', returning the username if the user specified username and password\
    \ match:\n\n```\nstring(//Username/text()='ppursglo' and\nPassword/text()='secret')/Username/text())\n\
    ```\n\nOften, these queries will be built via code, using concatenation or string.\
    \ Format like this:\n\n```\nXPathNavigator navigator = \nxmlDocument.CreateNavigator();\n\
    XPathExpression expression = navigator.Compile(\n\"string(//[Username/text()='\"\
    \ + username + \" and ' + \\ \n\"Password/text()='\" + password + \"\\']/Username/text())\"\
    );\nstring count = Convert.ToString(navigator.Evaluate(expression));\n```\n\n\
    If you have already read Chapter 8, this might look familiar. By appending a '1'='1'\
    \ to the username and password, an attacker can change the expression to return\
    \ the first username from the XML data. XPath does not have the equivalent of\
    \ a comment operator, the mechanism for injection is slightly different. This\
    \ query will return a value, because or operators will always cause a value to\
    \ be returned.\n\n> This vulnerability is known as XQuery Injection, another member\
    \ of the injection family of vulnerabilities that attackers can use to \"inject\"\
    \ clauses into your queries.\n\nBecause administrative users are usually configured\
    \ before normal users, it's likely that an authentication system attacked using\
    \ the string above would validate the attacker as an administrative account. Like\
    \ SQL injection, error from a stack trace can start to give out information about\
    \ the XML document containing the data. For example, if an attacker\n\n![](img/c28a05c0528daad8a392659cd26abcda_240_0.png)"
