  md: "# CHAPTER 5 CONTROLLING INFORMATION\n\nHowever, using ASP.NET values after\
    \ it is created, it cannot be changed. It does this by hashing the ViewState values,\
    \ and creating a unique value from the contents of the ViewState. This hash is\
    \ then encrypted with a key that is stored on the server, and then the encrypted\
    \ hash is placed into the View.(Hashing and encryption are explained in more detail\
    \ in Chapter 6.) During postback, ASP.NET validates the ViewState by decrypting\
    \ the embedded hash and recomputes the hash value based on the ViewState contents.\
    \ If the hashes do not match, the ViewState must have been tampered with, and\
    \ a ViewControllerException thrown. Although an attacker could send a fake ViewState\
    \ with his or her own hash value, the attacker cannot know the encryption key\
    \ used. And, so, ASP.NET attempts to decrypt the attacker's ViewState, it will\
    \ fail and throw an exception.\n\nThis validation mechanism can cause two common\
    \ problems. The first problem arises when you must host your application on multiple\
    \ machines. The encryption key (or machine key) used to encrypt the validation\
    \ hash is randomly generated on machine. If a request containing ViewState is\
    \ sent by machine A to the browser, but then the decryption is performed by machine\
    \ B will fail because machine A and machine B have different machine keys. If\
    \ you use a client browser, the machine key is regenerated; which means that if\
    \ a page is sent to a client browser, the validation starts before submission\
    \ and the back ViewState will fail.\n\nIt is possible to disable ViewState validation\
    \ by setting the EnableViewViewStateMac attribute to false on a page or for the\
    \ entire application, which in the ViewState.Instead is obviously a bad idea,\
    \ because it allows attackers to tamper with data. You should ensure that each\
    \ machine has an identical machine key. The machine key is configured via the\
    \ machineKey element in your web.config file. By default, it is stored in the\
    \ global web.config file stored in the .NET framework installation directory and\
    \ contains the following settings:\n\n```\nmachineKey\nvalidationKey=\"AutoGenerate,\
    \ IsolateApps\"\nderyptionKey=\"AutoGenerate, IsolateApps\"\nvalidation=\"SHA1\"\
    \nderyption=\"AUTO\" / >\n```\n\nTo set the keys manually, you must create new\
