    ```\nSystem.IO.FileInfo fileInfo = new System.IO.FileInfo(fullPath);\n```\n\n\
    ```\nuploadDetails.Text = +\n\"File Name \" + filename + \"<br />\" +\n\"Length\
    \ \" + fileInfo.Length + \"<br />\" + fileInfo.Length +\n\"Content type \" + fileUpload.PostedFile.ContentType;\n\
    ```\n\nFor added safety, you should ignore any filename sent with the upload request.\
    \ In fact, you should create a random filename and save the original filename\
    \ to a database, mapping the random filename to the original filename. You can\
    \ then use the original filename as part of a ContentDisposition header when you\
    \ serve the file back to users.\n\nA problem remains — the content type. This\
    \ is a difficult to overcome because you must validate the contents of the file\
    \ itself. For example, let's say the GIF format has a header with the following\
    \ hexadecimal values: 47 49 46 38 39 61. In ASCII, this becomesGIF89a. Each file\
    \ format is different in its distinguishing characteristics, you will have to\
    \ write custom code to discover the MIME type of an uploaded file. If you send\
    \ the wrong MIME type of a file back to a browser, then the application will load\
    \ and crash.\n\nOne thing to note is that the file being uploaded is stored in\
    \ memory, which can cause your application to slow down (or even fail) if not\
    \ memory is available to process the inbound request. You can control the maximum\
    \ allowed file size by changing the actual request size permitted for your application.\
    \ Setting a size restriction will prevent your application from malicious users\
    \ attempting to tie up the available memory and processes by uploading large files\
    \ — an easy Denial of Service (DOS) attack to perform. To change the maximum request\
    \ size, use the httpRuntime element in web.config, as shown here:\n\n```\n<?xml\
    \ version=\"1.0\"?>\n<configuration>\n  <system.web>\n    <httpRuntime\n     \
    \ executionTimeout=\"90\"\n      maxRequestLength=\"4096\"\n    />\n  </system.web>\n\
