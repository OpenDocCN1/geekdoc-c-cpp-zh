  md: "The sample web.config in Listing 7-7 removes the need for a secret question\
    \ and answer, loosens the password requirements. These settings will be used by\
    \ the Visual Studio administration tool and by the CreateUserWizard control. Should\
    \ you not changing the settings will not change any existing users. If you increase\
    \ the minimum password complexity, any user already in the system will still be\
    \ allowed to use his or her password.\n\n# LISTING-7: Configuring ASP.NET to use\
    \ an existing, prepared membership database\n\n```\n```configuration\n<system.web>\n\
    \  <membership>\n    <providers>\n      <clear/>\n      <add name=\"AsNetSqlMembershipProvider\"\
    \ connectionString=\"LocalSqlServer\" enablePasswordRetrieval=\"false\" enablePasswordReset=\"\
    true\" requiresQuestionAnswer=\"false\" applicationName=\"/\" requireUniqueEmail=\"\
    true\" passwordFormat=\"Hashed\" maxInvalidPasswordAttempts=\"3\" minRequiredPasswordLength=\"\
    5\" minRequiredNonalphanumericCharacters=\"0\" type=\"System.Web.SqlMembershipProvider,\
    \ System.Web.Version=2.0.0.0, Culture=neutral, PublicKeyKey=b03f5f7f71ld5d0a3a\"\
    \ />\n    </providers>\n  </membership>\n</system.web>\n</configuration>\n```\n\
    ```\n\n# Creating Users Programmatically\n\nYou are not limited to using the server\
    \ controls for creating users. ASP.NET provides you with the Membership API to\
    \ perform this task. The API includes the CreateUser method, with four possible\
    \ signatures:\n\n```\nMembership.CreateUser(username, password)\nMembership.CreateUser(username,\
    \ password, email)\nMembership.CreateUser(username, password, email, passwordQuestion,\
    \ passwordAnswer, isApproved, status)\nMembership.CreateUser(username, password,\
    \ email, passwordQuestion, passwordAnswer, isApproved, providerUserKey, status)\n\
    ```"
  merge: -1
  pgno: 172
- img_proc: true
  md: "Because the Membership class is static, you don't need to create an instance;\
    \ you just use it directly. If you use one of the signatures that has a status\
    \ parameter, this is a ByRef parameter and returns one of the System.Web.Security.MembershipCreateStatus\
    \ values, indicating the result of the method call.\n\n# Supporting Password Changes\
    \ and Resets\n\nASP.NET provides two controls for common actions: the PasswordRecovery\
    \ control and the ChangePassword control.\n\nThePasswordRecovery control provides\
    \ the functionality to retrieve or reset a user's password based on him or her\
    \ username. The new or recovered password is sent to the user via email. Like\
    \ the CreateUserWizard control, the PasswordRecovery control honors the provider\
    \ configuration settings, and you can send the email by setting the MailDefinition\
    \ property. The control automatically replaces <%Username%> and <%Password%> with\
    \ appropriate values before sending the email.\n\nIf your passwordFormat is configured\
    \ to Hashed (see Table 7-3), only password resets are supported. If your format\
    \ is Encrypted or Clear, then password recovery is supported. Obviously, Encrypted\
    \ is the most secure option if you wish to support password recovery — encryption\
    \ encryption uses the machine key in the web.config file as its key. If you don't\
    \ set it manually a machine key will be automatically generated when your application\
    \ starts. The machine key is also used to protect ViewState. Listing 5-1 in Chapter\
    \ 5 shows how to generate a new machine key and use it. If you are running your\
    \ application on multiple Web servers, the machine key on each Web server must\
    \ match.\n\nTheChangePassword control, not surprisingly, allows an authenticated\
    \ user to change his or her password, confirming an existing password. If a user\
    \ uses this control but is not authenticated, the user will be authenticated first,\
    \ and then his or her password will be changed. Like the PasswordRecovery control,\
    \ it honors the membership configuration, and can send a confirmation email to\
    \ the user's email address.\n\n# Windows Authentication\n\nIn contrast to forms\
    \ authentication, Windows authentication does not make ASP.NET configuration and\
    \ requires no user controls. This is because the usernames and passwords are managed\
    \ by Windows, and authentication is handled by IIS and the browser. Windows authentication\
    \ has the advantage that, if an application is deployed into an intranet environment\
    \ and IIS is correctly configured, any user logged into the domain will not need\
    \ to authenticate manually. You use this type of automatic login at the beginning\
    \ of this chapter.\n\nWindows authentication is configured by setting the authentication\
    \ attribute to \"Windows\" :\n\n```\n<system.web>\n  ...\\n  <authentication mode=\"\
    Windows\" />\n</system.web>\n```\n\nThe Visual Studio web server takes care of\
    \ everything for you. But once you move your site to IIS, you must configure IIS\
    \ itself to perform authentication."
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Configuring IIS for Windows Authentication


    To configure IIS to perform authentication, start the IIS Manager application
    and expand the Sites tree. Click on the Web site you wish to edit and select the
    Authentication icon to see the dialog shown in Figure 7-5.


    ![](img/c28a05c0528daad8a392659cd26abcda_174_0.png)


    Figure 7-5: Configuring IIS Authentication


    As you can see from Table 74, IIS supports a number of types of authentication
    methods, but it is the user that sees the difference, not your code.


    # TABLE 74: Common IIS Authentication Types


    | AUTHENTICATION TYPE | DESCRIPTION |

    |---|--|

    | Anonymous | Allows any user to access any public content. This is enabled by
    default. |

    | Basic Authentication | Requires a valid username and password before access
    is granted using HTTP authentication, part of the HTTP specification. The prompt
    appears as a dialog in the browser. This should only be used over a secure connection
    as usernames and passwords are sent as unencrypted plain text. |

    | Digest Authentication | Uses a Windows domain controller to authenticate users.
    This is stronger than basic authentication. |

    | Windows Authentication | This provides automatic logins within an intranet environment.
    |'
  merge: -1
