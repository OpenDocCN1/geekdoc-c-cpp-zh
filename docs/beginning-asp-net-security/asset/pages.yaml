  md: '# CHAPTER 6 KEEPING SECRETS SECURE — HASHING AND ENCRYPTION


    For Vista and Windows 2008, you can use the Certificate Management snap-in. Simply
    right-click on the certificate, choose "All tasks," and select "Manage Private
    Key," which will present you with the familiar access control list (ACL) dialog
    shown in Figure 6-5


    Certificates used for SSL do not need to have permissions widened. The Windows
    Service that provides the SSL facility runs at a higher privilege than the ASP.NET
    application pool, which has access to the private key by default.


    # Creating Test Certificates with MAKECERT


    The Visual Studio SDK comes with a utility, MAKECERT, that enables you to create
    certificates for use development and testing. If you''re using the Visual Studio
    Express, you must download the SDK from http://www.microsoft.com/downloads/details.aspx?FamilyID530402263-93c4-479a-867-c0d4c51645fb.


    The first thing you do is to create a root authority. A root authority is the
    master certificate from which all other certificates will be issued. Open an elevated
    Visual Studio Tools command prompt (right-click the item in your Start Menu, and
    choose "Run as Administrator). Change directory to your My Documents directory
    and execute the following:


    ```

    makecert -pe -n "CN=Development Root Authority" -ss my

    -sr LocalMachine -a sha -sky signature

    -r "Development Root Authority.cer"

    ```


    This command creates the root certificate and exports the public part of the certificate
    to the development root authority.cer file. You then use the Certificate Manager
    snap-in to import this certificate into the My Trusted Root Certification Authority
    folder to do this, allow your certificates to be trusted.


    Now you must create a certificate suitable for use on a server. To do this, use
    the following, replacing myserver with your computer''s name:


    ```

    makecert -pe -n "CN=myserver" -ss my -sr LocalMachine

    -a shal -sky exchange -eku 1.3.6.1.5.5.7.3

    -in "Development Root Authority" -is MY -ir LocalMachine

    -sp "Microsoft RSA Shannon Cryptographic Provider"

    -sy myserver .cer

    ```


    You needn''t worry about what the parameters mean. They are documented on MSDN
    if you''re interested. Now you have a certificate in your local machine store
    with a subject name of CN=myserver and a file, myserver.cer, containing the public
    certificate you can use to encrypt data for this server. On systems where you
    want to encrypt data, you can import this certificate into the Other People certificate.


    ![](img/c28a05c0528daad8a392659cd26abcda_149_0.png)


    FIGURE 6-5 Setting permissions on a certificate''s private key in Vista'
