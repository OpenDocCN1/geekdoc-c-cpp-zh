- img_proc: true
  md: "Configuration options for request filtering are made in the &system.WebServer>/<Security>/&requestFiltering;\
    \ section of the configuration files.\n\n# Filtering DoubleEncoded Requests\n\n\
    An attacker can bypass filters on a URL by doubling encoding characters. For example,\
    \ an ampersand (& in a request may normally be escaped to %26, where the percent\
    \ sign indicates the following digits ASCII value. An attacker could disguise\
    \ this by encoding the percent digits to %25, making the disguised ampersand%2526.\
    \ If request filtering is configured to reject a double-encoded request, it will\
    \ attempt to normalize the request twice, rejecting it if the result of the second\
    \ normalization differs from the result of the first normalization.\n\nTo check\
    \ for double-encoded requests, use the allowDoubleEscaping attribute on the requestFiltering\
    \ element, as shown here:\n\n```\nsystem.webServer\n<security>\n  <requestFiltering\
    \ allowDoubleEscaping=\"false\" />\n</security>\nsystem.webServer\n```\n\n# Filtering\
    \ Requests with NonASCII Characters\n\nIf your application does not use non-ASCII\
    \ characters in its requests (that is, with a \"high bit\" set), you can safely\
    \ reject them, lowering the attack surface on your application. This option is\
    \ configured using the allowHighBitCharacters attribute, as shown here:\n\n```\n\
    system.webServer\n<security>\n  <requestFiltering allowHighBitCharacters=\"false\"\
    \ />\n</security>\nsystem.webServer\n```\n\n# Filtering Requests Based on File\
    \ Extension\n\nFile-extension filtering can work in either a whitelist or a blacklist\
    \ configuration by using the fileExtensions element of requestFiltering. When\
    \ configured for a whitelist, only requests that match the configured file extensions\
    \ will be allowed. When configured for a blacklist, requests to make the configured\
    \ file extensions will be rejected.\n\nBy default, request filtering will stop\
    \ requests for particular files such as .config, .asax, .cs and .vb files. But\
    \ if you cannot use a whitelist to limit requests then you should extend the blacklist\
    \ filter to stop requests for .bak files as well. The following example uses extension\
    \ filtering to stop .bak requests:\n\n```\nsystem.webServer\n<security>\n  <requestFiltering>\n\
    \    <fileExtensions allowUnlisted=\"true\" />\n```"
  merge: -1
  pgno: 345
- img_proc: true
  md: '# 342 | CHAPTER 14 SECURING INTERNET INFORMATION SERVER (IIS)


    ```

    <add fileExtension="bak" allowed="false"/>

    <fileExtensions>

    </requestFiltering>

    </security>

    <system.webServer>

    ```


    # Filtering Requests Based on Request Size


    Often, third-party components for which you do not know the source may exhibit
    vulnerabilities based buffer overflows or other adverse reactions to large requests.
    You can configure request to filter requests based on request size, the size of
    the URL requested, or the size of the query string in the URL using the RequestLimits
    element and maxAllowedContentLength, maxUrl, and maxQueryString attributes in
    this element.


    The content length is expressed in bytes; the URL and query string sizes are measured
    in characters, as shown here:


    ```

    system.webServer>

    <requestFiltering>

    <requestLimits>

    maxAllowedContentLength="3000000000"

    maxUrl="260"

    maxQueryString="25"

    </requestLimits>

    </requestFiltering>

    </security>

    </system.webServer>

    ```


    # Filtering Requests Based on HTTP verbs


    In Chapter 2, you were introduced to the GET and verbs. The HTTP specification
    provides for other verbs and protocols on top of HTTP, and developers may use
    their own verbs. If you are certain that your application does not need any additional
    verbs, then you can reduce the attack surface by limiting the verbs allowed to
    reach your application by using the verbs element. Like filtering by file extension,
    this can work on a whitelist or blacklist basis.


    The following snippet shows how to limit the verbs that reach your application
    to GET and POST :


    ```

    system.webServer>

    <security>

    <requestFiltering>

    <verbs allowUnlisted="false">

    <add verb="GET" allowed="true" />

    <add verb="POST" allowed="true" />

    </verbs>

    </requestFiltering>

    </security>

    </system.webServer>

    ```'
  merge: -1
  pgno: 346
- img_proc: true
  md: "# Filtering Requests Based on URL Sequences\n\nOften, third-party components\
    \ may exhibit problems based on URL sequences, such as directory transversal attacks\
    \ that put ... / into a URL to attempt to break out of the application's directory.\
    \ Request filtering can be configured by using the denyUrlSequences section to\
    \ stop requests based on a sequence within the URL.\n\nFor example, the following\
    \ configuration will reject any request containing a . . sequence:\n\n```\nsystem.webServer\n\
    <security>\n  <requestFiltering>\n    <denyUrlSequences>\n      <add sequence=\"\
    ..*\"/>\n    </denyUrlSequences>\n  </requestFiltering>\n</security>\nsystem.webServer>\n\
    ```\n\n# Filtering Requests Based on Request Segments\n\nSegment filtering allows\
    \ you to reject requests that try to access a particular area of your application.\
    \ By default, IIS uses segment filtering to reject all requests that attempt to\
    \ access the bin,App_code,App_GlobalResources,App_LocalResources,App_WebReferences,App_Data,andApp_Browsers\
    \ directories. This is more flexible than URL sequences if you have areas that\
    \ share partial names such as \"bin\" and \"binaries.\" Using URL filtering, you\
    \ would have to filter on \"bin,\" which would also block requests to \"binaries.\"\
    \n\nThe following snippet will block access to the \"bin\" segment, but allow\
    \ access to the \"binaries\" segment:\n\n```\nsystem.webServer\n<security>\n \
    \ <requestFiltering>\n    <hiddenSegments>\n      <add segment=\"bin\"/>\n   \
    \ </hiddenSegments>\n  </requestFiltering>\n</security>\nsystem.webServer>\n```\n\
    \n# Filtering Requests Based on a Request Header\n\nFinally, requests can be rejected\
    \ on the length of a request header. With request sizes and URL sequences, this\
    \ can be useful in stopping attacks against third-party vulnerable components\
    \ where updates are not available. You can filter by header size by adding the\
    \ header to"
  merge: -1
  pgno: 347
- img_proc: true
  md: "the headerLimits section, specifying the header name and the maximum size in\
    \ characters, as shown here:\n\n```\nsystem.webServer>\n<security>\n  <requestFiltering>\n\
    \    <requestLimits>\n      <headerLimits>\n        <add header=\"Example\" sizeLimit=\"\
    2\" />\n      </headerLimits>\n    </requestFiltering>\n</security>\n</system.webServer>\n\
    ```\n\n# Status Codes Returned to Denied Requests\n\nEach request filtering rule\
    \ returns a 404 status code, with a specific sub-code, allowing you to monitoring\
    \ the log performance using IIS log monitoring tools. Table 14.3 lists the status\
    \ codes returned by each role.\n\nTABLE 14-3: Status Codes Returned by Request\
    \ Filtering\n\n| ERROR | STATUS CODE |\n|---|---|n| URL Sequence Denied | 404.5\
    \ |\n| Verb Denied | 404.6 |\n| File Extension Denied | 404.7 |\n| Denied by hidden\
    \ segment | 404.8 |\n| Denied because request header is too big | 404.10 |\n|\
    \ Denied because URL was double-escaped | 404.11 |\n| Denied because of high bit\
    \ characters | 404.12 |\n| Denied because content length too large | 404.13 |\n\
    | Denied because URL too long | 404.14 |\n| Denied because query string too long\
    \ | 404.15 |\n\n# USING LOG PARSER TO MINE IIS FILES\n\nIIS log files are a useful\
    \ source of information about activity against a Web application, and can be used\
    \ proactively (for example, to monitor the log files for suspicious activity)\
    \ and reactively (for example, to try to figure out what went wrong if your application\
    \ has been hacked). But processing the log files manually is a painful task."
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Using Log Parser to Mine IIS Log Files


    Commercial products exist to mine the data contained with IIS logs. However, Microsoft
    provides a free tool for mining logs, Log Parser, which is available from http://www.iis.net/downloads/default.aspx?tab=34&g=6&i=1287.
    It not only analyzes IIS logs, but also the file system, Windows Event log, the
    Registry, and Active Directory. (However, this section will only cover using Log
    Parser to mine IIS logs and other sources to allow you to decode and extract information
    from log sources, and uses SQL-like syntax to allow for forensic analysis of activity
    on your Web site.


    Before using Log Parser, you should ensure that logging is enabled on your Web
    site. When configuring a Web site for the first time, you should always enable
    logging, preferably storing the log files on a separate drive from both your operating
    system and Web site. If the log files fill the drive, your Web server will stay
    up, and any traversal exploits that your Web site may not expose the log files
    themselves.


    To enable and configure logging, start IIS Manager and highlight the site for
    which you wish to configure logging. Click the Logging icon. You can change the
    directory used to store the logs by entering a path in the Directory field, and
    you can customize the information you logged by clicking the Select Fields.


    Generally, you will want to select every option to log. Table 14-4 shows a description
    of each option, and what it would offer during log analysis.


    Table 14-4: Available IIS7 Logging Options

    | NAME | DESCRIPTION | PURPOSE |

    | --- | --- | --- |

    | date | Date | Correlates events. |

    | time | Time | Correlates events and identifies rapid requests (such as those
    issued by automated scanning scripts). |

    | c-ip | Client IP Address | Identifies the user or proxy. |

    | cs-username | User Name | Identifies compromised Windows user accounts if they
    are in your use for application. |

    | s-sitename | Service Name | Verifies a Web site application if the log files
    are moved to another machine. |

    | s-computename | Server Name | Verifies a server if the log files are moved to
    another machine. |

    | s-ip | Server IP Address | Verifies a server if the log files are moved to another
    machine. |

    | s-port | Server Port | Helps to verify the port number of the request, which
    is useful if multiple applications are running on various ports. |


    continues'
  merge: -1
  pgno: 349
