- img_proc: true
  md: "# Error Handling and Logging\n\nMessages are sent to the logger when the Log\
    \ button on the test page is clicked by calling the log.Debug() method with the\
    \ message to be logged. Logging methods also have overload that takes an exception\
    \ as well as a message.\n\nlog4net supports five levels of messages: Debug, Info,\
    \ Warn, Error, and Fatal. To log an Info level, you would call the log.Info()\
    \ method. To log a Warn message, you would call log.Warn() method, and so on.\n\
    \nTheThreshold value in the configuration file is used to control which message\
    \ types are actually emitted to the log destinations:\n\n+   - A threshold level\
    \ of All or Debug would record every message type.\n- A threshold level of Info\
    \ would log messages of an Info, Warn, Error, and Fatal.\n- A threshold level\
    \ of Warn would only log Warn, Error, and Fatal messages.\n\nBy using a suitable\
    \ threshold level, you can fine-tune the log output without having to remove any\
    \ logging commands from your code.\n\nThe configuration file also allows for multiple\
    \ logging types and destinations. For example, a configuration file like that\
    \ in Listing 5-8 would log debug messages and above to a log file, and would email\
    \ fatal messages.\n\n# LISTING: A Simple Multiple Logging App Configuration for\
    \ log4net\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\" ?>\n<log4net>\n<root>\n\
    \  <level value=\"DEBUG\">\n    <appender-ref ref=\"FileAppender\"/>\n    <appender-ref\
    \ ref=\"SmtpAppender\" />\n</root>\n<appender name=\"FileAppender\" type=\"log4net.Appender.FileAppender\"\
    >\n  <file value=\"log4net.log\" />\n  <appendToFile value=\"true\" />\n  <layout\
    \ type=\"log4net.Layout.PatternLayout\">\n    <pattern date=\"%date [%thread]\
    \ %-5level % %message [%exception]%newline\" />\n  </layout>\n</appender>\n<appender\
    \ name=\"SmtpAppender\" type=\"log4net.Appender.SmtpAppender\">\n  <to value=\"\
    barry@example.com\" />\n  <from value=\"errorlog@example.com\" />\n  <subject\
    \ value=\"logging@domain.com\" />\n  <bufferSize value=\"512\" />\n  <lossy value=\"\
    true\" />\n  <evaluator type=\"log4net.Core.LevelEvaluator\">\n    <threshold\
    \ value=\"Fatal\"/>\n  </evaluator>\n</appender>\n</4net>\n```\n\ncontinues"
  merge: -1
  pgno: 118
- img_proc: true
  md: "# LISTING 5-8 (continued)\n\n```\n<layout type=\"log4net.Layout.PatternLayout>\n\
    \  <conversion value=\n\"%date [thread] %-level logger - %message [%exception]%newline\"\
    \ />\n</layout>\n</appender>\n<log4net>\n```\n\nThis section barely scratches\
    \ the surface of how to use log4net. Possible logging destinations include databases,\
    \ the event log, the ASP.NET tracing facility, files that rotate every day, and\
    \ more. The log4net Web site has more details and samples of use.\n\n> NOTE Adding\
    \ logging and monitoring your application is known as instrumentation. The approach\
    \ you take will depend on the environment your application will run. For example,\
    \ if you cannot monitor the event log or performance counters because your application\
    \ is running in a shared hosting environment then will not use those methods.\n\
    \n# LIMITING SEARCH ENGINES\n\nSearch engines are one of the powerhouses of the\
    \ Internet. Programs known as robots crawl through Web sites and add content to\
    \ their index, enabling users to search for information. However, indexers add\
    \ everything they can find, which presents a risk to a Web application. As shown\
    \ in Figure 5-6, the Google hacking database (at http://johnny.hackstuff.com/ghdb.php\
    \ ) contains Google searches that reveal sensitive information.\n\n![](img/c28a05c0528daad8a392659cd26abcda_119_0.png)"
  merge: -1
  pgno: 119
- img_proc: true
  md: "Well-behaved robots can be controlled by using a robots.txt fle, or by adding\
    \ a ROBOTS metetag to your pages. Both of these approaches are de facto standards,\
    \ and depend on support in the crawling software. Robots can ignore these control\
    \ methods — malware searching for email addresses or security vulnerabilities\
    \ almost certainly will.\n\n# Controlling Robots with a Metatag\n\nIn individual\
    \ pages, you can add the ROBOTS metetag to tell robots not to index a page, and/or\
    \ not to follow any links within a page. To do this, add the following to your\
    \ HTML code:\n\n```\n<html>\n<head>\n  <title>...</title>\n  <meta name=\"ROBOTS\"\
    \ncontent=\"NOINDEX, NOFOLLOW\" />\n</head>\n  ..\n</html>\n```\n\nThe value for\
    \ the metag must be ROBOTS. The content value must be a combination of INDEX,\
    \ NOINDEX, FOLLOW, or NOFOLLOW. Obviously, only combinations make sense. If no\
    \ tag is specified, the default value will be \"INDEX, FOLLOW\".\n\n# Controlling\
    \ Robots with robots.txt\n\nAdding a meta to every page on your Web site takes\
    \ some effort, and is prone to mistakes. Another way of controlling robots is\
    \ with a text file, robots.txt (the filename should be all lowercase). This file\
    \ should be placed in the root directory of your Web site. This file follows a\
    \ simple format, as shown in Listing 5.\n\n+   LISTING 5: A Sample robots.txt\
    \ File\n\n```\n# This is a comment in a robots.txt file\n\nUser-Agent: r2d2\n\
    Disallow:\n\nUser-Agent: c3po\nDisallow: /trashCompactor\n\nUser-Agent: *\nDisallow:\
    \ /deathStarPlans\nDisallow: /logs\n```\n\nIn the code shown in Listing 5, any\
    \ robot that identifies itself as \"r2d2\" has nothing disallowed. A robot that\
    \ identifies itself as \"c3po\" will not crawl the /trashCompactor directory.\
    \ Any other robots will exclude the /deathStarPlans directory and the /logs directory.\
    \ Each disallowed line should only contain a single path, and wildcard characters\
    \ are not supported in paths."
  merge: -1
  pgno: 120
- img_proc: true
  md: 'To stop all well-behaved robots from crawling your site, your robots.txt file
    should contain the

    code shown in Listing 5-10.


    # LISTING 5-9: A Sample robots.txt File that Stops All Crawling


    ```

    User-agent:*

    disallow: /

    ```


    Unfortunately, a robots.txt file can only contain disallowed areas. Attackers
    often check this file

    for directories where robots should not go, and attempt to load those directories
    to see what

    happens. One thing to note is that the robots.txt file should be in a Unix format
    — this

    means only LineFeed characters marks the end of a file, not the Carriage Return
    and Line Feed

    combination that Windows uses. You can use Visual Studio to save a file in the
    correct format by

    selecting File | Advanced Save and choosing the Endings drop-down menu.


    > WARNING IF you are implementing your own search service by indexing

    software (such as Microsoft Index Server or Lucene), it is important that you

    work on a whitelisting approach, choosing directories that should specifically
    be

    indexed, rather than excluding directories.


    # PERILS OF MICROSOFT INDEX SERVER


    Quite a few years ago, the author was asked to quickly create a search system
    on

    a simple Web site using Microsoft Index Server. Index Server was created to index

    the entire site, and everything was publicly available. Unfortunately, a member
    of

    t sales staff had access to the Web, and a few months later, created his own

    directory and started uploading files to exchange with others (including a document

    listing prices and profits). Index Server did as it was configured. It indexed

    this new directory and started serving the files as search results for phrases
    such as

    "Price.\ Always be specific on directories and files that are included.


    # PROTECTING PASSWORDS IN CONFIG FILES


    Often, you will have multiple configuration files for your application — for example,
    one for

    development, one for staging, and one for live. You may out new configuration
    files to your

    Web site, backing up your existing configuration file. ASP.NET will refuse to
    serve files

    inconfig. One common mistake is to rename your existing file to web.config.backup
    or web

    .config.bak —files that ASP.NET will never serve. A lot of security software will
    work

    for these common filenames and retrieve them.


    Your configuration files may include sensitive information (such as database passwords

    in connection strings, mail server usernames, and so on). ASP.NET provides

    functionality to encrypt sections of a configuration file and automatically decrypt
    them.'
  merge: -1
  pgno: 121
- img_proc: true
  md: "# Protecting Passwords in Config Files\n\nAt its simplest, you can encrypt\
    \ a section in the web.config file by opening a command line prompt, changing\
    \ to the directory holding the web.config file you wish to encrypt parts of, and\
    \ by, using the aspnet_regiis, specify the section you encrypted.\n\n```\naspnet_regiis\
    \ -pef SecretSection\n```\n\nThe aspnet_regiis utility is found in the .NET framework\
    \ installation folder, %windows\\Microsoft\\.NET\\Framework\\v2.0.50727.\nThe\
    \ drawback to this approach is that, if the web.config file is moved to another\
    \ server, decryption will fail. If you have multiple servers in a Web farm, the\
    \ container must be run on every server. For this scenario, you use a Riv, Shamir,\
    \ Adelman (RSA) key container that can be exported from one machine and imported\
    \ onto another. In an elevated command prompt (right-click on the command prompt\
    \ icon and choose \"Run as administrator\") the following steps will create an\
    \ RSA key container and then export it:\n\n+   1. Create a new key container for\
    \ exporting:\naspnet_regiis -pc MyConfigurationKey -size 2048 -exp\n\n+   2. Export\
    \ the key to an XML file:\naspnet_regiis -px MyConfigurationKey c:\\myconfigurationkey.xml\n\
    \n+   3. Import the key on your server:\naspnet_regiis -pi MyConfigurationKey\
    \ myconfigurationkey.xml\n\n+   4. Set permissions on the key for the account\
    \ under which your application runs:\naspnet_regiis -pa MyConfigurationKey \"\
    machineName\\Account\"\n\nOnce you move to a key container, you must add a section\
    \ to your configuration file to tell ASP.NET that you want to use your new key\
    \ container. The following snippet from a web.config file replaces the default\
    \ configuration provider with one that uses your custom configuration key:\n\n\
    ```\n<configuration>\n<configProtectedData>\n  <providers>\n    <remove name=\"\
    RsaProtectedConfigurationProvider\"/>\n    <add name=\"RsaProtectedConfigurationProvider\"\
    \n      type=\"System.Configuration.RsaProtectedConfigurationProvider,\nSystem.Configuration.Version=2.0.0.0,Culture=neutral,\n\
    PublicKeyToken=b03f5f7f11d50a3a\"\n      keyContainerName=\"MyConfiguration\"\n\
    \      cspName=\"\"\n      useRSA=\"false\"\n      useMachineContainer=\"true\"\
    \ />\n  </providers>\n</configProtectedData>\n</configuration>\n```"
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 116 | CHAPTER 5 CONTROLLING INFORMATION


    You can then encrypt sections by using your new provider, as shown here:


    ```

    aspnet_regiis -peSectionName -prov RsaProtectedConfigurationProvider

    ```


    Should you ever want to encrypt a configuration section, you can use the -pd switch,
    and if you want to delete a key container, you can use the -pz switch.


    It is worth noting that, while you can encrypt nearly every configuration section,
    you cannot encrypt any section that is read before code is run. The following
    sections cannot be encrypted:


    +   * processModel>

    * runtime>

    * mscorlib>

    * startup>

    * system.runtime.remoting>

    * protectedData>

    * satelliteassemblies>

    * cryptographySettings>

    * cryptoNameMapping>

    * cryptoClasses>


    # A CHECKLIST FOR QUERY STRINGS, FORMS, EVENTS, AND BROWSER INFORMATION


    The following is a checklist you should follow when configuring your application
    to control information leaks:


    +   * Prevent reply attacks—If you use ViewState, implement aViewStateUserStateKey
    to prevent reply attacks.

    * Protect sensitive information—Never put sensitive information in ViewState.

    * EncryptViewState—If you must use ViewState for sensitive information, encrypt
    ViewState.

    * Avoid error pages—Do not use the default error pages.

    * User error handlers—Catch all errors in page level or application level error
    handlers, and use Server.Transfer to switch to an error page.

    * Use instrumentation—Log errors using a suitable instrumentation type.

    * Do not usebak extensions—Never rename .config files with a .bak extension.

    * Be aware of sensitive configuration information—Encrypt sensitive parts of a
    configuration file.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# 6

    Keeping Secrets Secret-

    Hashing and Encryption


    Most Web applications will store data that may be considered sensitive — credit
    card

    information, Social Security Numbers, and, of course, passwords. In Chapter 5,
    you saw how

    y can encrypt View and portions of your configuration files to prevent information

    leakage, how do you encrypt other data you wish to protect?


    In this chapter, you will learn about the following


    +   - The four basic areas of cryptography: hashing, generating random numbers,

