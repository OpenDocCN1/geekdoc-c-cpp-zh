  md: "The ampersand (@) character defines a parameter. The parameter names in the\
    \ preceding query @username and @password.\n\nOnce you have a parameterized query,\
    \ you must set the values of the parameters. This is done after you have constructed\
    \ a SqlCommand command from the SQL query string, as shown here:\n\n```\nSqlCommand\
    \ command = new SqlCommand(sqlCommand, connection);\n\nSqlParameter usernameParameter\
    \ =\n    new SqlParameter(\"@username\", SqlDbType.NVarChar, 25)\n    Value =\
    \ this.Text;\ncommand.Parameters.Add(usernameParameter);\n```\n\nThis snippet\
    \ creates a SqlParameter instance with a username matching the first parameter\
    \ in the query, @username. The type of the parameter is set to NVarChar and its\
    \ maximum length to 25. The value of the parameter is set from the Text property\
    \ of the Username input box. The parameter is added to the Parameters collection\
    \ on the SqlCommand instance. This is all that needs to be done. ADO.NET takes\
    \ care of securing the parameter values automatically.\n\nHowever, there is a\
    \ drawback to using any kind of direct queries, including parameterized queries.\
    \ The underlying schema for the database is still exposed, and the Web application\
    \ has the capability to read the tables. This can be a security problem. Generally,\
    \ you will want to introduce some sort of access control to your database and\
    \ prevent administrative users from manipulating raw data, just in case you have\
    \ vulnerabilities elsewhere. While you can set permissions you cannot select on\
    \ columns. If a user has the capability to query a table using SQL, then the user\
    \ can see all the data within it. To control the columns seen, and what you can\
    \ update, you must turn to stored procedures.\n\nA stored procedure is a SQL routine\
    \ created and run on the database server, but deliberately exposing connections.\
    \ A stored procedure can simply be a wrapper around Create, Retrieve, Update,\
    \ and Delete (CRUD) operations, or it can contain logic of its own, including\
    \ auditing data access, performing calculations on the data before it is retrieved,\
    \ or implementing other forms of business logic.\n\n# TRY IT OUT Using Stored\
    \ Procedures\n\nBefore you call a stored procedure, you must create it. While\
    \ SQL2005 and later provides the capability to write stored procedures in C#,\
    \ this should be considered a last resort—written when you must do something on\
    \ the SQL server that the SQL language does not allow, or not easily implement.\
    \ The SQL language is optimized for data manipulation; C# generally isn't.\n\n\
    +   1. Open the Server Explorer window and connect to the database to choose Create\
    \ New Stored Procedure. Right-click Stored Procedures. A new window will appear,\
    \ similar to the one shown in Figure 8-2."
