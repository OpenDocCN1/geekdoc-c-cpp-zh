  md: "# Removing Global Features for an Individual Site\n\nWhen an IIS option is\
    \ installed, it is registered in the IIS global configuration file, `%windir%system32\\\
    inetrv\\config\\applicationHost.config`, located in the globalModules section,\
    \ which contains all native modules. If you open this file in a text editor, you\
    \ will see the names and locations of all the modules.\n\nModules are globally\
    \ enabled or disabled in the modules section of the same file. Modules written\
    \ in managed code do not need to be registered in the globalModules section, but\
    \ only appear in the modules section of applicationHost.config file.\n\nTo remove\
    \ a module at an application level, you can use the <system.WebServer>/</modules>\
    \ section of your application web.config file. For example, the following snippet\
    \ will remove the Windows Authentication module from your application:\n\n```\n\
    <system.WebServer>\n<modules>\n  <remove name=\"WindowsAuthentication\" />\n</modules>\n\
    </system.WebServer>\n```\n\nA server administrator can remove a capability to\
    \ add or remove modules at an application level by adding the lockItem attribute\
    \ to an individual module, or to the entire modules section in applicationHost.config\
    \ file. Modules that make are locked by default, but depending on the module,\
    \ may still be enabled or disabled, rather than removed.\n\n# Creating and Configuring\
    \ Application Pools\n\nWith the introduction of IIS6 the concept of application\
    \ pools, which are holding pens for applications. Each application pool offers\
    \ an isolated area in which or more applications may run under a particular identity.\
    \ An application pool that crashes, its hosting application pool, will not affect\
    \ any applications running in other application pools.\n\nAn application pool\
    \ can be configured to run under a particular Windows user account, limiting or\
    \ widening the files, directories, and other resources it can access. Generally,\
    \ when hosting multiple sites on a single server, each Web site should be configured\
    \ to run in its own application pool, under its own identity. That is, if an application\
    \ needs access to its own directories or other areas of a machine, this is safely\
    \ granted using the Windows Access Control functionality without compromising\
    \ the safety of other applications. This is because one identity will not be able\
    \ to access resources owned by another identity.\n\nCreating a new application\
    \ pool is a simple process using IIS Manager. You can just right-click on the\
    \ Application Pools in the tree view and select New Application Pool from the\
    \ context menu that appears. Figure 14-2 shows the dialog controlling the creation\
    \ of a new application pool.\n\nYou must enter a name for the new application\
    \ pool, select the .NET framework version as appropriate, and choose a Managed\
    \ Pipeline\n\n![](img/c28a05c0528daad8a392659cd26abcda_339_0.png)\n\nFIGURE 14-2:\
    \ Creating a new application pool"
  merge: -1
  pgno: 339
- img_proc: true
  md: 'mode. The “Integrated” pipeline shown in Figure 14-2 integrates the IIS and
    ASP.NET request pipelines, which allows you to write HTTP modules (such as the
    one demonstrated in Chapter 4) that will affect all requests. The “Isolated” pipeline
    separates the IIS pipeline and the ASP.NET pipeline, and is generally used for
    backward compatibility with other applications.


    ASP.NET 1.1 applications will always run in an isolated application pool. Once
    an application pool has been created, you can continue to configure its options,
    including its identity and the criteria under which an application pool will recycle
    — a process by which the application pool downs, freeing all its resources, and
    returns.


    To place an application in an application pool, click the Web site in the tree
    view listing and click Basic Settings in the Actions pane. Click Select in the
    Edit dialog to produce a list of application pools into which you can place the
    Web site or application.


    In previous versions of IIS, all worker processes ran as LocalSystem. From a security
    standpoint, this was a bad idea LocalSystem has access to nearly every resource
    on the host computer. With application pools, processes run, by default, under
    the NetworkService account. This account has a limited number of privileges:


    +   * Adjust the memory quota for a process

    * Log on as a service

    * Allow logon locally

    * Access the computer from the network

    * Replace process tokens

    * Impersonate a client after authentication

    * Generate security audits


    To configure the application pool runs, you must first create the Windows user
    account and add it to the IIS_IUSRS group (or the IIS_WPG group for IIS6/Windows
    2003). This group adds the necessary permissions for a Windows account to be used
    as an application pool identity.


    Next, in IIS Manager, right-click the application pool you wish to reconfigure
    in the application pool list, and then choose Advanced Settings from the context
    menu. Under the Process Model settings, you can choose the Windows identity that
    the pool will run under. If your application is running in a domain environment,
    you can configure the application pool to run as a domain user and thus grant
    any permissions to applications running within to access resources that the configured
    user can access. If your server is running in a group environment it must access
    resources on another computer (such as in a network share), you can create identical
    usernames and passwords on both computers, and configure the application pool
    to run under this mirrored user account. You then grant access to the network
    shares or other resources to the mirrored account on the remote machine.


    With IIS7, application pools will be isolated from each other by default, even
    if they share the same pool identity. Under IIS7, each Web application is an application
    pool configuration file'
  merge: -1
