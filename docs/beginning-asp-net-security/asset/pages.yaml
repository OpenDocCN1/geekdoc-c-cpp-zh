  md: '# TABLE 11-1: Common WCF Bindings and the Security Modes They Support


    | BINDING | NONE | TRANSPORT | MESSAGE | MIXED MODE |

    | --- | --- | --- | --- | --- |

    | BasicHttpBinding | X | X | X | X |

    | WSHttpBinding | | X | X | X |

    | WSDualHttpBinding | X | | X | |

    | WSFederationHttpBinding | X | | X | X |

    | BasicHttpContextBinding | X | | X | X |

    | WSHttpContextBinding | | X | X | X |


    # Choosing the Client Credentials


    Once you choose the type of security mode you will use and the binding you will
    use, you can select the credentials you will accept for your Web service. The
    credentials available for use depend on the security mode you choose.


    # TABLE 11-2: Transport Client Credential Types


    | CREDENTIALS | DESCRIPTION |

    | --- | --- |

    | None | Configures the service not to need any credentials. Clients will be anonymous.
    |

    | Basic | Configures the service for Basic HTTP authentication (see RFC2617).
    |

    | Digest | Configures the service for Digest HTTP authentication (see RFC2617).
    |

    | Ntim | Specifies NT LAN Manager authentication. This uses the Windows username
    and password to authenticate in situations where Kerberos is not available (for
    example, client/server communication outside of a domain). |

    | Windows | Specifies Windows authentication, preferring Kerberos. |

    | Certificate | Performs client authentication using an X509 certificate.'
