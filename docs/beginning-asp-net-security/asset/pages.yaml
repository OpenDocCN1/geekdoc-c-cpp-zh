- img_proc: true
  md: 'dynamically generated when the pool is started. It is stored, by default, in
    the c:\netpub\temp\appPools. Each Web application has an additional Security Identifier
    (SID) generated for it, which is injected into the w3wp.exe process that hosts
    the pool. The application pool configuration file is then locked via the NTFS
    Access Control List (ACL) to allow any SID access to it, isolating each pool configuration
    from other pools.


    Using this SID, it is possible to lock the directories hosting a Web application
    without having to create specific users. To secure directories based on the application
    pool identity, you must follow these steps:


    +   1. Configure each Web site or Web application you want to run in its own application
    pool.


    +   2. Configure anonymous authentication to use the application pool identity
    (rather than the IISR account). Click the Authentication for the Web site, and
    then right-click Edit from the context menu and select Application Pool Identity
    in the credentials dialog that appears.


    +   3. Remove the NTFS permissions for the IIUSRS group and IUSR account for the
    application folders and files.


    +   4. Grant read permissions (and any other appropriate permissions) to the application
    folders and files to the IIS APPPOOL ApplicationName replacing ApplicationPoolName
    with the name of your application pool.


    Application pools can be configured to recycle on a regularly timed basis, after
    a particular number of requests, or based on the amount of memory an application
    pool consumes. This can be useful for memory leaks in applications for which you
    do not have the source code.


    To configure the recycling options, begin by right-clicking the application pool
    and choosing the Recycling from the context menu. It is difficult to estimate
    which values you should set because they will vary from application to application.
    You can use Process Explorer from Sysinternals to monitor your Web application
    over a period of time to get a feel for how much memory it will under normal conditions.
    You can download Process Explorer at http://technet.microsoft.com/en-us/sysinternals.


    As application pool restarts an application, all internal session states and caching
    will be cleared.


    # Configuring Trust Levels in IIS


    As read in Chapter 13, all .NET applications are subject to Code Access Security
    (CAS) permissions. A trust level is a set of defined CAS permissions that the
    hosting environment for an grants to any applications that run in it.


    The .NET Framework has five default trust levels, as shown in Table 14-2.'
  merge: -1
