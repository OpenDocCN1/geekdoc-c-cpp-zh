  md: 'The maxRequestLength property allows you to adjust the maximum size of requests
    accepted. In kilobytes. For example, changing the maxRequestLength to 10240 will
    increase the maximum request size to 10MB. Remember that the request is not just
    made up of the file, but also includes headers and other fields. When changing
    the maxRequestLength property, you should also change the executionTimeout to
    a suitable value. The executionTimeout property sets the time limit (in seconds)
    ASP.NET will wait for a request before terminating the request. As you increase
    the maximum request size, you must increase the execution timeout appropriately.


    > **WARNING** Increasing the maxRequestLength and executionTimeout properties
    may expose your application to a DOS attack. Experiment with your server configuration
    to discover the maximum values your hardware will support. It is always advisable
    to keep both these properties at the lowest value that works for your application.


    # A CHECKLIST FOR SECURELY ACCESSING FILES


    The following is a checklist of items to follow when writing data access code.


    +   - Truncate user file names and extract the file name from any potential path.—
    Use the Path.GetFileName() to safely remove all directory information.

    - Serve content from a directory outside of your Web application— If you must
    serve content from within your application path, then use Server.Map() to resolve
    directories. Server.Map() will stop any directory resolution from escaping out
    of the root of your application.

    - Use Access Security to ensure your application has the ability to access the
    file system.— Remember that .NET applications have their own permissions in addition
    to the underlying file system permissions.

    - Create your own filenames.— Use Path.GetRandomFileName() to generate filenames
    and directory names when you create files. This will avoid the overwriting of
    existing files, or traps with requested names and directory transversal attacks.

    - Limit the maximum request size and execution timeout for your application to
    prevent DOS attacks.— Never trust any input from file uploads. Generate your own
    filenames and use indirect object references to retrieve these files.'
