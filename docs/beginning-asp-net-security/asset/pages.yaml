  md: "# Authorization in ASP.NET 77\n\n![](img/c28a05c0528daad8a392659cd26abcda_183_0.png)\n\
    \nFIGURE 7-8: Managing roles with IIS Manager\n\n# # Managing Roles Programmatically\n\
    \nOf course, on a live system, Visual Studio's ASP.NET configuration tool is not\
    \ available, and manually managing roles with the IIS administration tool is not\
    \ a scalable solution. There are no user controls for role management, and you\
