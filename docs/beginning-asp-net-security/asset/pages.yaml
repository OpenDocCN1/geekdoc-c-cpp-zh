  md: "# Checking That Your Application Can Access Files\n\nWhen you access a file\
    \ in Windows, the file system checks if your user account has permissions to use\
    \ the file. .NET programs have another layer of security that checks if the application\
    \ itself is authorized to use the file. This extra security layer is called access\
    \ Security (CAS), which is covered in greater detail in Chapter 13. Without delving\
    \ into it, you can use the following steps to check application is authorized\
    \ to open files.\n\nThe process of checking your application authorization involves\
    \ constructing aFilePermission for the file application wishes to access, and\
