    # LOGGING AND AUDITING IN WCF


    WCF provides well detailed logging and auditing functionality that allows a service
    to log security events such as failed logins or unauthorized access. The audit
    logs can help you detect an attack (if you monitor your server''s event log),
    or help debug security-related problems. Logging can also allow you to log malformed
    requests, or to trace incoming messages, to help you analyze any problems.'
