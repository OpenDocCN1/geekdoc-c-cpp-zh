  md: '# 40 | CHAPTER 3 SAFELY ACCEPTING USER INPUT


    A common concept in deciding whether input is safe a trust boundary, which can
    be thought of as a border or line drawn in your application. On one side of the
    border, data is untrusted; on the other side of the border, data can be assumed
    to be trusted. It is the job of validation and sanitation logic to allow data
    to safely move from the untrusted side of the border to the trusted side. Figure
    3-1 shows a small system and its trust boundaries.


    ![](img/c28a05c0528daad8a392659cd26abcda_48_0.png)


    FIGURE 3-1: Trust boundaries and validation locations


    Howard and LeBlanc indicate, the basic rule of thumb is to trust everything. As
    you discovered in Chapter 2, it is easy to craft an HTML request demonstrating
    that any request application receives may not come from a user or a Web browser
    at all. Replies from an external Web Service or data loaded from an external data
    source should not be untrusted.


    With other input sources, their position inside or outside the trust boundary
    is a judgment call. For example, web.config is generally within the trust boundary.
    However, if the capability to upload files to the Web server is available to external
    sources, even accidentally, a risk exists that the web.config or other files may
    be changed without your knowledge. Even if you can trust an input source, can
    you be completely sure that data entered into your system is valid? Malformed
    or'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'corrupted data can occur by accident or coding error, rather than by a malicious
    action. You must always consider how any data affects your system, and act accordingly.
    The most secure approach is to validate every input into your application.


    # DEALING WITH INPUT SAFELY


    The need for input validation is obvious. Malformed data may cause programming
    logic errors, or may expose your Web Application to attack. Furthermore, it is
    not just your application that is at risk. Data that may be valid within your
    Web site may, in turn, affect other systems that you pass it on to. Chapter 4
    discusses Cross Site Request Forgery attack and Chapter 8 discusses a SQL injection
    attack, both of which are examples of this. Without security considerations, validating
    input will greatly decrease the risk of crashes within your application. In addition,
    validating input as it arrives is always cheaper than cleaning up a database or
    other data store invalid data discovered down the line.


    # Echoing User Input


    Cross Scripting (XSS) allows an attacker to alter a Web page on a vulnerable Web
    site because of the way a Web site displays user-supplied data. While this may
    not sound problematic, it can be put to numerous illegitimate uses, including
    the following:


    +   Theft of accounts or services—When a Web site uses session state, the session
    identifier is typically stored as a cookie on your browser. JavaScript allows
    the capability to direct the cookies contents to attacker and manipulate cookies
    owned by the attacker, can re-create the cookies in his or her own browser, and
    will appear to the Web server to be the original user. Depending on the site attack,
    this could lead to identity theft, access to confidential information, access
    to paid-content, or a denial of service (DoS) attack against the user details
    have been stolen.


    +   User redirection—Once an attacker discovers an XSS vulnerability, he or she
    can use JavaScript injection to redirect the browser entry. This can lead to spyware
    installation, phishing, or general mischief.


    +   User tracking—Because JavaScript can manipulate the contents of a page, attackers
    could insert an image into a vulnerable page hosted by a server administrator.
    This image could be used to track users across multiple vulnerable Web sites.
    Furthermore, attackers could use JavaScript to replace all the links on the page
    to go through their tracking scripts in order to gather more statistics.


    +   Misinformation—An attacker could use JavaScript to rewrite the contents of
    your Web page. If the attacked site was a financial Web site, and the page was
    altered to change the share price of a particular stock, there is no way for a
    user to tell that the price displayed is not the correct price because the URL
    of the browser remains the same.


    +   Installation/exploitation of browser add-ins—An attacker could insert an <object>
    tag into a page that contains an ActiveX control, Flash, Java, or any other add-in
    controlled in this manner, and exploit a vulnerability in the add-in to steal
    or expose a user’s information.'
  merge: -1
