  md: '# Adding Authentication inASP.NET


    If you are working with Windows, you can access specific Windows account properties
    in your code by using the WindowsIdentity object from the System.Security.Principal
    namespace. 7-8 shows you the common properties of the WindowsIdentity class.


    # LISTING-7: Viewing the properties of the WindowsIdentity


    ```

    <@ Page Language="C#" %>

    @@ Import Namespace="System.Security.Principal" %>

    <!DOCTYPE html>

    PUBLIC "-//W3C//DTD HTML 1.0 Transitional//EN"

    //"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head id="Head" runat="server">

    <title></title>

    </head>

    <body>

    <form id="form" runat="server">

    <h1>Hello</h1>

    <p>User Name = User.Identity.Name %</p>

    <p>IsAuthenticated = User.Identity.IsAuthenticated %</p>

    <p>Authentication Type = User.Identity.AuthenticationType %</p>

    <p>Windows Authentication Type = WindowsIdentity.GetCurrent().AuthenticationType
    %</p>

    <p>Name = WindowsIdentity.GetCurrent().Name %</p>

    <p>IsAuthenticated = WindowsIdentity.GetCurrent().IsAuthenticated %</p>

    <p>Is Anonymous = WindowsIdentity.GetCurrent().IsAnonymous %</p>

    <p>Guest = WindowsIdentity.GetCurrent().IsGuest %</p>

    <p>IsSystem = WindowsIdentity.GetCurrent().IsSystem %</p>

    <p>Impersonation Level = WindowsIdentity.GetCurrent().ImpersonationLevel.ToString()
    %</p>

    <p>Group membership=</p>

    <% foreach (var group in WindowsIdentity.GetCurrent().Groups) %>

    {

    Response.Write(group.Value + "<br>");

    } %></p>

    </form>

    </body>

    ```


    If you run this code, you will see something like Figure 7-6. You will notice
    that the groups are not Windows group names, but instead strings. These strings
    are Security Identifiers (SIDs). Checking group membership is covered in the later
    section of this chapter, "Authorization in ASP.NET."'
