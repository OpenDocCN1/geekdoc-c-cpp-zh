- img_proc: true
  md: '# CHAPTER 8 SECURELY ACCESSING DATABASES


    If you try this attack using the vulnerability in the code, you will see a very
    detailed error page that displays the underlying problem — Column ''logins.username''
    is invalid in the select list because it is not contained in either an aggregate
    function or the GROUP BY clause. As you can see, the error message displays a
    table name and a column in that table. By refining the query again and again,
    adding each discovered column to a GROUP BY clause, an attacker could retrieve
    all of column names for the table. Once an attacker has the column structures,
    he or she can start to discover the type of data in the columns. For example,
    the attacker could enter the following in the username field:


    ```

    union select sum(username) from logins--

    ```


    This attack causes an error to be displayed that Operand data type varchar is
    invalid for sum operator. From this error, the attacker can deduce the username
    field is a varchar. Once an attacker has the column names and types, he or she
    can try to insert data into the underlying table. For example, the attacker could
    enter the following into the username field to create a new record in the logins
    table:


    ```

    insert into logins values(''yourUsername'', ''yourPassword'')--

    ```


    This is a simple example of how SQL injection can be used attack a database. The
    semicolon in the SQL statement acts as a command separator, much like a colon
    used in BASIC. Anything after the semicolon is treated as a new command. Now the
    query executes two commands:


    ```

    select * from logins where username = '''';

    insert into logins values(''yourUsername'', ''yourPassword'')

    ```


    There are several additional attack vectors. By entering the following in the
    username field:


    ```

    union select @version,''--

    ```


    You can see that the exact version of SQL Server is now displayed on the screen,
    with details about the operating system. As a final trick, entering the following
    in the username field:


    ```

    union select (select * from logins xml), -- from logins

    ```


    At first, this doesn''t appear to do anything. But if you view the source of the
    HTML page, you will discover that the entire contents of the logins table have
    been embedded as XML. This would illustrate to the importance of not avoiding
    SQL injection, with hashing passwords, as discussed in Chapter 6.


    If you want further details and walkthroughs of advanced SQL injection attacks,
    Chris Anley of NGSoftware has a highly recommended whitepaper available from http://ngsssoftware.com/papers/advanced_sql_injection.pdf.


    # FIXING THE VULNERABILITY


    The vulnerability arises because the SQL query is dynamically constructed via
    string concatenation. Way to fix it is to avoid string concatenation entirely
    and parameterize the query, or use stored procedures.'
