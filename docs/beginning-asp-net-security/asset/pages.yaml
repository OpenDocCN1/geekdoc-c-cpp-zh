    # The Security Runtime Engine


    The Anti-XSS library includes the Security Run-time Engine (SRE), and HTTP Module,
    which protects your ASP.NET application using the Anti-XSS library to automatically
    and proactively encode data. By analyzing your Web application and inspecting
    each ASP.NET Web control, or controls derived from them. The module can be configured
