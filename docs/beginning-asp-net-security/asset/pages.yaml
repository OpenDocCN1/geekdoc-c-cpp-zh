  md: '# REQUEST FORGERY AND HOW TO AVOID IT


    In 2008, Princeton University researchers William Zeller and Edward W. Felten
    discovered vulnerabilities in four major Web sites — including one against INGDirect,
    which allowed them to access a victim''s bank account and transfer money from
    one account to another. The attack was made possible by forging a user who was
    already logged into INGDirect to perform the money transfer, a vulnerability known
    as Cross Site Request Forgery (CSRF). The transfer process is driven by multiple
    HTML forms submissions, the researchers authored by writing an HTML page that
    contained a copy of the forms, and then submitted them without user intervention
    via JavaScript. We read their findings and the methods and forms they used in
    the paper published at http://cip.princeton.edu/csrf/.


    In order to understand how the attack works, you must understand how Web sites
    authenticate requests. When a user logs into the Web site, the Web site will generally
    create a cookie on the user''s machine. From that moment forward, until the cookie
    expires or is deleted when the browser is closed, that browser is authenticated
    and authorized by the Web site. If an authenticated Web site is to send a request
    to the vulnerable Web site, the site has no way of knowing that it is under attack.
    Since the Web site already trusts the request and processes it as if the user
    had made it (because of the authentication cookie), the Web site uses HTTP Authentication
    (where the user is prompted for their username and password by a dialog box in
    the browser, rather than an HTML page), then it is the browser that has the user
    authenticated to the Web site and will send the username and password with each
    request.


    Consider a simple Web site that allows users to send message and delete messages.
    The Web site has been badly written and the message processes using query parameters.
    For example, http://www.example.com/sendMessage.aspx?boss=boss@example.com&subject=I
    resign message=Take+this job and ... would send an email to boss@example.com explaining
    the user has registered. An attacker has do to exploit this is to showget the
    user''s browser to send a request for sendMessage.aspx, and doing so is simple.
    All the attacker creates a page including the following code:


    ```

    <img src="http://www.example.com/\nsendMessage.aspx?boss=boss@example.com&subject=I+resign&message=\nTake+this+job+and..."

    ```


    If an unfortunate user loads the example.com and the browser will look at the
    src parameter and load it. The example.com Web application will receive the incoming
    request and the authentication cookie it placed when the user was logged in, recognize
    the user, and run the code contained in sendMessage.aspx. The attacker''s site
    has forged a request, sourced from the attacking site, but destined for the vulnerable
    Web site, thus crossing sites. Figure 4-1 shows how this type of CSRF works.'
