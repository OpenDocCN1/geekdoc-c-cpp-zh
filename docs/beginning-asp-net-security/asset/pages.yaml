  md: '# CHAPTER 5 CONTROLLING INFORMATION


    ```

    EventLog.WriteEntry("MyWebApplication",

    "Something bad happened",

    EventLogEntryType.Error,

    101);

    ```


    If you run this code as is, you will get an exception. Event sources must be created
    before they can be used. The capability to create an event source is limited to
    administrative users, and, for Vista and Windows 2008, an application that is
    User Account Control (UAC) elevated. The following code creates an event source
    in the Windows Application Event Log:


    ```

    EventLog.CreateEventSource("MyWebApplication", "Application");

    ```


    > NOTE Generally, event sources are created during an installation, creating an
    event source requires administrative access. However, because ASP.NET applications
    generally not have installers, you may want to create a command-line application
    to create your event sources. You will need the capability to log in to the server
    desktop and run the command line application as an administrator. Once the application
    source is created, the least-privilege your application runs can write to the
    event log.


    If you have multiple event sources (for example, an event source for every assembly
    or logical layer), you can create a custom event log to contain your events by
    specifying the name when you create a custom source, as shown here:


    ```

    EventLog.CreateEventSource("FrontEnd", "WroxApp");

    EventLog.CreateEventSource("BackEnd", "WroxApp");

    ```


    This code will create a custom event log "WroxApp" which contains two sources:
    "FrontEnd" and "BackEnd". The code for logging to your custom event log varies
    slightly. You must first retrieve an instance of the custom event log and log
    source, as shown here:


    ```

    EventLog customLog =

    new EventLog("WroxApp", ".", "FrontEnd");

    customLog.WriteEntry("Something bad happened",

    EventLogEntryType.Error,

    101);

    ```


    This code writes an to the "WroxApp" event log from the "FrontEnd" event source.


    # Using Email to Log Events


    A common approach to logging is to send non-urgent alerts and logs to a monitored
    account. If you choose this approach, you should remember that emails may be delayed,
    and delivery is not guaranteed at all. An inbox overwhelmed with events may cause
    frustration and cause the recipient to ignore messages as they arrive. The .NET
    framework contains two namespaces for email: System.Web.Mail andSystem.Net.Mail.'
