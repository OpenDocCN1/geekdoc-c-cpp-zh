  md: '# SUITABLE SCENARIOS FOR ASYMMETRIC ENCRYPTION


    One of the mainstream uses for asymmetric encryption was Pretty Good Privacy (PGP)
    created by Philip Zimmermann in 1991. The use of an asymmetric algorithm that
    others could publish their public key, typically on a Web page or a key server.
    Other PGP users could freely retrieve the key and encrypt against it, knowing
    that only the owner of the private key could decrypt the data.


    Consider an e-commerce system where payments are handled by a separate payment
    system and protected on an internal network, and not exposed to the Internet.
    The order system must pass the payment information securely before forgetting
    it. Using the same key on both systems presents a risk — if the order system is
    compromised, all payment information is also compromised.


    Instead, the system could use asymmetric encryption. When creating a payment message,
    the order system would encrypt using the payment system''s public key, and then
    place the request. Only the payment system can decrypt these messages with its
    private key. If the order system is compromised, the payment system messages are
    still safe.


    One thing to note that asymmetric encryption is computationally heavier than symmetric
    encryption by a significant amount. This has important considerations for its
    use, and has given rise to a hybrid approach where an asymmetric encryption key
    is created and securely sent between systems using an asymmetric encryption algorithm.
    This key is then used to encrypt transactions using symmetric encryption, which
    is much faster than asymmetric encryption.


    This approach is used behind the scenes of SSL/TLS, the protocol behind secure
    HTTP. The .NET asymmetric encryption implementation, the RSAServiceProvider class,
    is limited in the amount of data it can encrypt. If you reach these limits (which
    are dependent on the size of the key), you should switch to this hybrid approach
    using asymmetric encryption to exchange a symmetric key, which is then used to
    encrypt your data. As a rough guide, a 1,024-bit RSA key can encrypt 245 bytes.


    Unlike symmetric encryption (which uses random data as its keys), the RSA algorithm
    uses large prime numbers as the starting point for its keys. Two large prime numbers,
    P and Q, are pushed through a set of mathematical formula to produce six additional
    parameters, which, along with the original prime numbers, provide the private
    key. Two of the derived parameters, the modulus and exponent, are also the public
    key.


    # Using Asymmetric Encryption without Certificates


    When you create an RSAServiceProvider, the .NET framework generates a new key-pair
    for use, and calculates the necessary parameters for asymmetric encryption. Remember
    that, to encrypt data, you need the public key parameters, and to decrypt data,
    you need the private key parameters. The parameters can be exported from an RSAObject
    as either XML or an instance of the RSAParameters structure. The following code
    creates a new instance of the RSA class and extracts the public key as XML;'
