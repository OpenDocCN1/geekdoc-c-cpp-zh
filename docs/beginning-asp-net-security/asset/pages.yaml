  md: '# 12


    # Securing Rich InternetnApplications


    The introduction of Rich Internet Application (RIA) technologies like Ajax (Asynchronous
    JavaScript and XML) and Silverlight has brought more responsive and richer user
    interfaces to Web sites. Previously, responding to a user action on a Web site
    would require a post request to the server, and there is no need for the construction
    of an entire page for the response.


    With Ajax, a Web page can make a request for just the information it wants, without
    the need for a full form submission or changing the entire page. With Silverlight,
    requests are sent from the Silverlight component (via the browser''s networking
    function to the server), and responses are processed by the Silverlight application.
    Server processing is minimized because less data is sent, and there is no need
    to construct a new page every.


    As with all new technologies, writing an RIA comes at a price— opens new possibilities
    for attacks and vulnerabilities.


    In this chapter, you will learn about the following:


    +   - How Ajax works


    +   - How Silverlight interacts with the Web and the client computer


    +   - How to use Silverlight cryptography functions


    +   - How to use ASP.NET authentication and authorization with Ajax and Silverlight


    +   - Using Ajax and Silverlight can increase your attack surface


    +   - Using thirdparty data can expose your application to risk


    The Ajax discussion in this chapter concentrates on the ASP.NET Ajax libraries
    and architecture. For the most part, the vulnerabilities are nothing new. Ajax
    is vulnerable to Cross Site Scripting (XSS), Cross Site Request Forgery (CSRF),
    and information leakage,'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'topics already discussed in earlier chapters. For further reading on Ajax frameworks
    and more details on client vulnerabilities, the best reference is Ajax Security
    by Billy Hoffman and Bryan Sullivan (Boston: Pearson Education, 2008).


    The Silverlight discussion in this chapter concentrates on the security aspects
    of Silverlight and its run-time. It does not teach you how to write a Silverlight
    application. Wrox produces Professional Silverlight 2 for ASP.NET Developers by
    Jonathan Swift, Salvador Alvarez Patel, Chris Barker, and Dan Wahlin (Indianapolis:
    Wiley, 2009) and the Silverlight 3 Programmer''s Reference by J. Ambrose Title,
    Jason Beres, Grant Hinton, Devin Rader, and Joe Coney (Indianapolis: Wiley, 2009),
    which are both excellent resources for learning about writing Silverlight applications.


    # ARCHITECTURE


    Silverlight and Ajax enable you to move some of your application logic into the
    client side. One of the most common architectural mistakes is to treat code as
    trusted simply because you have written it, and because it is part of your page.
    As you''ve already discussed in Chapters 3 and 4, you cannot trust any input from
    your server, and you cannot guarantee that any client-side code will run. You
    should consider Ajax or Silverlight code that is exposed (or embedded into) a
    Web page in the same way you consider a normal page — as a presentation view with
    optional logic that may or may not run.


    For example, with a typical non-Ajax ASP NET page, you have client-side JavaScript
    validation. You should never rely on it being executed, because an attacker may
    disable JavaScript. Any RIA follows this pattern — the attacker has control over
    the client-side code and can specify what will or won''t run.


    ![](img/c28a05c0528daad8a392659cd26abcda_294_0.png)


    Figure 12-1 shows the trust boundaries of an RIA.


    FIGURE 12-1: Trust boundaries in a RIA.


    # SECURITY IN AJAX APPLICATIONS


    Ajax adds a communications layer to the classic Web application model. As you
    have learned, it is the browser that traditionally communicates with the Web server
    via URL links (GET) and form submissions (POST). Ajax changes this model. When
    a request is made via Ajax, the browser asynchronously sends a request to the
    server via JavaScript, and then immediately returns control to the browser. When
    the response is returned, Ajax handles the page handles and acts accordingly.
    But how does this work?


    As you see in Figure 12-2, an Ajax-powered page is initially loaded in the traditional
    way, but all subsequent requests go through an Ajax engine or library. The Ajax
    library is responsible for making requests, receiving the response, and then adjusting
    the page markup to reflect the information sent. At the heart of the Ajax engine
    is the XMLHttpRequest object.'
