  md: '# Secure Development with the ASP.NET MVC Framework


    In late 2007, Microsoft introduced a preview of the ASP.NET Model-View-Controller
    (MVC) Framework, which represented a different approach to developing Web applications
    with ASP .NET. The v1.0 release came in 2009. The MVC framework departs from the
    event-driven model inherent to Web Forms, and exposes more of "rawness" behind
    HTTP and Web development. As stated in Professional ASP.NET MVC 1.0 by Rob Conery,
    Scott Hanselman, Phil Haack, and Scott Guthrie (Indianapolis: Wrox, 2009), in
    doing so, the MVC framework follows these three guiding tenets:


    +   - Be more extensible, maintainable, and testable

    - Be testable

    - Get out of the use''s way when necessary


    By following these tenets, nothing is hidden or abstracted from the developer.
    There is no ViewState, no Web controls, and no drag-and-dropers. MVC allows the
    developer to concentrate on development, and not how Web Forms implement things
    in the pipeline or in the controls.


    The purpose of this chapter does not enter into a discussion about which approach
    is best, but rather highlights areas where ASP.NET MVC developer should pay particular
    attention to security issues. Not of all of these are new to ASP.NET MVC. Some
    will have already discovered in earlier chapters. The approaches or solutions
    to the vulnerabilities and issues are answered in terms and code specific to the
    MVC framework.


    In this chapter, you will build upon your understanding from previous chapters,
    and will learn the following:


    +   - How to encode output safely using the MVC Helper Functions

    - How to protect an MVC application against Cross-Site Request Forgery (CSRF)'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# 386 | CHAPTER 16 SECURE DEVELOPMENT WITH THE ASP.NET MVC FRAMEWORK


    +   * How to safely accept user input use it to update your model

    * How to secure your binding to your model and provide more detailed validation
    errors

    * How to use authentication and authorization with the MVC actions and routes


    > > Note this chapter assumes that you have already experimented with the ASP
    .NET MVC framework.


    # MVC INPUT AND OUTPUT


    In this section, you will learn how to protect yourself against Cross Site Scripting
    (XSS), as well as against Site Request Forgery (CSRF). You will also learn about
    secure model binding, as well as how to provide validation for, and error messages
    from your model.


    # Protecting Yourself Against XSS


    As With Forms, all MVC pages that reflect user input are potentially vulnerable
    to XSS. Unlike Web Forms, where server controls automatically encode their properties
    before output, the ASP.NET MVC View engine gives you more freedom, which in turn,
    demands greater responsibility from you. To aid you in your development, you can
    use the Html.Encode and HtmlAttributeEncode methods, which are wrapper functions
    around the core ASP.NET HttpUtility.HtmlEncode and HtmlAttributeEncode.


    To use these functions, simply call them from your View and have your data you
    encoded, as shown here:


    ```

    = Html.Encode(ViewData["UserInput"]) %>

    <p class="<%= HtmlAttributeEncode(ViewData["CssClass"]) %>">Example</p>

    ```


    If the ViewData contains user input contained of a value like <script>window.alert("Hello
    XSS");</script>, the following HTML will be produced:


    ```

    p &lt;script&gt;window.alert(&quot;Hello XSS&quot;);&lt;/script&gt;</p>

    <p class="&lt;script-window.alert(&quot;Hello XSS&quot;);&lt;/script&gt;"></p>

    ```


    As you can see, the input is made safe, and does not execute.

    URL encoding is provided by the Url.Encode method, which wraps HttpUtility.UrlEncode
    .

    Remember that, even if you generate a link with the Url.Action method (which has
    parameters passed in the URL) and from user input, you should encode the attribute
    as you add it

    to the route values, or Url-encode the generated URL. One example of this is:


    ```

    <a href="<%= Url.Action("index","viewProfile",new{name=Url.Encode(ViewData["Name"])})
    %>">

    ViewProfile</a>

    <a href="<%= Url.Action("index","viewProfile",new{name=Url.Encode(ViewData["Name"])})
    %>">

    ViewProfile)</a>

    ```


    * Note'
