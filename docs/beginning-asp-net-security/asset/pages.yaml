    # UNDERSTANDING HTML FORMS


    You have examined a basic HTTP request and the response from a server to it. The
    request you sent was a GET request, everything about the request is sent in the
    URL. When you type a URL into your browser, or when you use particular types of
    HTML form, you are using a GET request. If you submit a form that issues a GET
    request, you will see the form parameters as part of the address for the example
    (http://example.org/example.aspx?param1example&param2example).


    The other type of HTTP request by browsers is a POST request. (Although there
    are other types of requests such as HEAD, PUT, TRACE, which are used by programs
    other than a browser.) In a POST request, form parameters are sent in the body
    of the request, not within the URL. The request type used in form submission is
    controlled by the method attribute on the form tag, as shown here:


    ```

    form action="http://example.org/example.aspx" method="get">

    form action="http://example.org/example.aspx" method="post">

    ```


    If you want to examine the difference between the request types, you could submit
