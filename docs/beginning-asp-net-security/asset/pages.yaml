  md: "# Asking and Checking for CAS Permissions\n\nIf you want to have more control\
    \ over permissions (for example, to disable optional functionality when your hosting\
    \ environment does not grant the necessary permissions), you can use two ways\
    \ to express your CAS requirements:\n\n+   - Imperative demands, which use the\
    \ standard methods implemented by each permission class\n- Declarative demands,\
    \ which use the associated attribute\n\n# Imperative Demands\n\nImperative demands\
    \ are written in .NET code. First, you instantiate the appropriate permission\
    \ class, providing any parameters necessary to specify the operation you wish\
    \ to perform. You can use the Demand method on the class. If the run-time environment\
    \ in which your application is hosted does not allow the permissions you are requesting,\
    \ a SecurityException will be thrown. Listing 13-1 shows an example.\n\n> LISTING\
    \ 13: Requesting a security permission imperatively\n\n```\n// Create an instance\
    \ of the permission class\n// and set the properties to express the\n// desired\
    \ operation.\n\nFileIOPermission fileIOPermission = new\nFileIOPermission(FileIOPermissionAccess.Write,\n\
    @C:\\example.wrox*);\n\ntry {\n    // Request the permission to write to c:\\\
    example.wrox\n    fileIOPermission.Demand();\n    // Now perform the operation\n\
    ...\n} catch (SecurityException ex) {\n    // Environment has not granted permission\n\
    \    // Fail gracefully\n}\n```\n\nListing 13 illustrates how you would request\
    \ permission to write to a file called example.wrox in the root directory of the\
    \ C:\\ drive. The demand for permission will only succeed if your code (and any\
    \ code that has called it) has permissions to do so. Because the permission demand\
    \ is in code, you can react accordingly. You can save to a secondary location,\
    \ or disable all save functionality within your application."
  merge: -1
  pgno: 324
- img_proc: true
  md: "# Declarative Demands\n\nDeclarative demands are expressed using attributes\
    \ that become part of the metadata for your assembly during compilation. For a\
    \ CAS permission object, the equivalent attribute exists, which is then applied\
    \ to a model or class. Listing 13-2 shows an example.\n\nLISTING 12: Requesting\
    \ a security permission declaratively\n\n```\n// Create an instance of the permission\
    \ class\n// and set the properties to express the\n// desired operation.\n[FileIOPermission(SecurityAction.Demand,\n\
    \tWrite = \"C:\\example.wrox\")\nvoid SaveFile\n{\n    // Save the file\n}\n```\n\
    \nBecause declarative permissions are compiled into your assembly metadata, the\
    \ permissions cannot be changed at run-time, providing less flexibility than imperative\
    \ demands. However, as metadata, it can be extracted by the run-time and other\
    \ tools to review the permissions your assembly requires. System administrators\
    \ can use a tool such as PermCalc (included with the Windows SDK) to gauge the\
    \ permissions your application may need, and configure their environments accordingly.\n\
    \n# Testing Your Application Under a New Trust Level\n\nNow that you're familiar\
    \ with how trust works, how you can demand permissions, and how you can react\
    \ to a lack of them, you might want to test your application under them. The simplest\
    \ way to do this is to set the trust level you wish to test in the system.web\
    \ section of your application's web.config file, as shown here:\n\n```\nsystem.web>\n\
    ...\n<trust level=\"Medium\"/>\n<system.web>\n```\n\n> NOTE When running under\
    \ IIS, an administrator can configure ASP.NET to not allow you to set your own\
    \ trust level. Chapter 14 details how to configure custom trust levels and how\
    \ to lock them."
