  md: 'SetFocusOnError—When true, this will place the cursor inside the first field
    that fails validation.


    Display—This controls how the error message is shown. The Display property can
    have one of the following three values:


    +   - None—The validation message is never displayed.


    +   - Static—Space for the validation message is always reserved in the page layout.


    +   - Dynamic—Space for the validation message is only reserved if the validation
    fails.


    ValidationGroup—A validation group allows you to place controls on a page into
    logical groups, each with separate buttons for form submission. When a button
    with a ValidationGroup is clicked, any validation controls with a matching ValidationGroup
    property will be fired.


    # Using RequiredFieldValidator


    TheRequiredValidator checks if the value of a control is different from its initial
    value. At its simplest, it validates a box, the control ensures the box is not
    empty, as shown here:


    Name:<asp:TextBox runat="server" ID="name" />asp:TextBox>


    The control may also be used to list boxes or drop-down menus. In this case, set
    the InitialValue property on the validation control, as shown here:


    All validators will run only when the control they are validating is not empty
    (although the CustomValidator may be configured to run on empty controls if necessary).
    If a field is mandatory, you must use a RequiredFieldValidator.


    # Using RangeValidator


    TheRangeValidator checks if the value of a control falls within a desired range
