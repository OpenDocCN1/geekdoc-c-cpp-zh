  md: '# Dealing with Input Safely


    > **WARNING** It is important that you remember this is not just a vulnerability
    with input forms. Any input that you output to a Web page can create an XSS vulnerability.
    JavaScript can be sent via query strings, and even HTTP headers.


    # How It Works


    XSS is so pervasive as the majority of Web sites use dynamic content. *Dynamic
    content* is a general term, but it essentially covers anything that allows interactivity
    or programmatic output of Web pages. Dynamic sites of any variety that process
    user input may be vulnerable. The previous examples are only a small selection
    of what XSS can achieve.


    Relying on ASP.NET''s request validation is not sufficient, because there are
    numerous legitimate cases where request validation must be disabled. Microsoft
    recommends that ASP.NET''s request validation be treated as "an extra precautionary
    measure in addition to your own input." Microsoft also says,"Do not rely on ASP.NET
    request validation." Like any software, the .NET framework can contain bugs. Security
    Bulletin MS07-040 delivers a fix for an encoding track that bypassed the request
    validation methods. The details can be found on the Common Vulnerabilities and
    Exposures site, http://www.cve.mitre.org/ under CVE-2007-0042.


    The examples demonstrated in the previous"Try Out" section are simple examples
    of reflected cross site scripting, and seem limited to you because they will only
    affect a user who submits an XSS string, or is tricked into entering one. XSS
    becomes more damaging when an XSS string is stored and saved up to all users.
    For example, if a vulnerable blog comment form saves an XSS string into its database,
    then anyone loading the comments will be attacked.


    # Mitigating Against XSS


    The mitigation technique for XSS is as follows: the developer, must examine and
    constrain all input (be it from a user, an XML file, or other source) and encode
    it for output. With request validation, it is your responsibility to encode output
    before writing it to a page.


    Encoding consists of taking an input string, encoding each character in the string,
    and converting the characters from one format to another. For example, taking
    the string `<hello>` and encoding it in a format suitable for HTML output (HTML
    encoding) would consist of replacing the `&lt;` and `&gt;` resulting in a safe
    output of `&lt;hello&gt;`.


    However, it may not be that simple, because HTML allows you to provide character
    codes for every character. For example, `%3C` is the HTML character code for `<`.
    This can be further encoded to `%253C`, where `%25` is an encoding %. Encoding
    can be nested to avoid substitution, and if the encoded string is delivered as
    a query string parameter, the .NET framework will decode it completely to deliver
    a string that may be used to trigger an XSS attack.'
