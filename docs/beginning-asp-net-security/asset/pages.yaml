  md: '# ENCRYPTING DATA


    As you have discovered, hashing is a one-way algorithm, while the data may be
    safe from prying eyes, there is no way to recover it. For this, you need a two-way
    process: encryption.


    Encryption always requires a key. A key is a piece of information that is used
    as a parameter in an encryption algorithm. It is the key that determines the output
    of the algorithm — different keys produce different results when used with the
    same unencrypted data. A good key is a truly random piece of data of the correct
    size that is kept secret. If a key is compromised, then your data can also be
    compromised.


    Encryption algorithms come in two flavors: symmetric and asymmetric. The following
    discussions explain the basics of each and in what scenarios you should use them.


    # Understanding Symmetric Encryption


    Symmetric encryption is the faster of the two encryption types. It is called symmetric
    because the same key is used to encrypt and decrypt the data, as shown in Figure
    6-1.


    The .NET framework provides various symmetric algorithms that share a common characteristic
    — they are all block ciphers . A block cipher takes the unencrypted data and splits
    it into fixed-sized blocks that are individually encrypted. When block algorithms
    are used, two blocks that contain the same data would produce the same encrypted
    data, which leaks information to an attacker.


    To bypass this, each block is combined with the previous block''s encryption result.
    This is called cipher block chaining, and is used by default in all the algorithms
    provided by .NET. To start the process, you must provide some data to combine
    with the initial block. This starting point is called an initialization vector
    (IV). Like a key, an initialization block is a random piece of data that you must
    store in order to decrypt the encrypted data. You should never reuse IVs between
    different pieces of data.


    ![](img/c28a05c0528daad8a392659cd26abcda_131_0.png)'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# SUITABLE SCENARIOS FOR SYMMETRIC ENCRYPTION


    Symmetric algorithms are suitable for scenarios where an application needs to
    both encrypt and decrypt the data. An example would be an application that accepts
    sensitive data (such as Social Security Numbers), stores it, and then displays
    or processes it outside of a registration process.


    # Protecting Data with Symmetric Encryption


    Follow these steps to encrypt data symmetrically:


    +   1. Choose an algorithm.

    2. Create or retrieve a key.

    3. Generate the IV.

    4. Convert the clear data to an array of bytes.

    5. Encrypt the clear text byte array.

    6. Store the encrypted data and the IV.

    7. If the key is new, store it.


    Follow these steps to decrypt the data:


    +   1. Choose the same algorithm that was used to encrypt the data.

    2. Retrieve the key that was used.

    3. Retrieve the IV that was used.

    4. Retrieve the encrypted data.

    5. Decrypt the data.

    6. Convert the decrypted data back to its original format.


    Remember that it is important to keep the key secret. Storage of encryption keys
    should be separated from the storage of the encrypted data, and locked down to
    only allow authorized use. An example would be separate databases on a SQL Server
    (so, if your database is compromised, your database may remain safe). Of course,
    because your application can read the key if an attacker compromises your application
    (as opposed to your database), there is still a risk that your keys may become
    compromised.


    The Organization for the Advancement of Structured Information Standards (OASIS)
    has an entire Technical Committee dedicated to Key Management, which produces
    policy documents and guidelines for both symmetric and asymmetric key management.
    You can find the committee works at http://www.oasis-open.org/committees/tc_home.php?wg_abbrev=ekmi
    .'
