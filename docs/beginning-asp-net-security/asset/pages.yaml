  md: "```\n[RunInstaller(true)]\npublic class Counters : PerformanceCounterInstaller\n\
    {\n    public Counters()\n    {\n        this.CategoryName = \"SecuringASPNet\"\
    ;\n        Counters.Add(\n            new CounterData(\"BadGuysFound\",\n    \
    \            \"Total number of bad guys detected\",\n                PerformanceCounterType.NumberOfItems32);\n\
    \        );\n        Counters.Add(\n            new CounterData(\"BadGuysFoundSecond\"\
    ,\n                \"How many bad guys have been detected\",\n               \
    \ PerformanceCounterType.RateOfCountsPerSecond);\n        );\n    }\n}\n```\n\n\
    There is a slight difference in how you use each type of counter. To access a\
    \ counter, you must create a new instance of the PerformanceCounter class, passing\
    \ the name of your category and counter. An absolute counter (such as badGuysFound\
    \ in the following example) can be set to a specific value. Counters that involve\
    \ time (such as badGuysFoundPerSecond in the following example) can only be increased\
    \ or decreased.\n\n```\nPerformanceCounter badGuysFound =\n    new PerformanceCounter(\"\
    SecuringASPNet\",\n    \"BadGuysFound\",\n    false);\n\nPerformanceCounter badGuysFoundPerSecond\
    \ =\n    new PerformanceCounter(\"SecuringASPNet\",\n    \"BadGuysFoundPerSecond\"\
    ,\n    false);\n\nbadGuysFound.Increment();\nbadGuysFoundPerSecond.IncrementBy(1);\n\
    ```\n\nIf you are watching your counters in the Windows Monitor, you may not see\
    \ any changes. If this happens to you, simply restart the Performance Monitors\
    \ and you will see the new value in the monitor graph. Performance Monitor takes\
    \ snapshots every second, and can sometimes get confused if you have created a\
    \ new counter and rapidly increment it to check that it works!\n\nWhen you create\
    \ a counter category, you can specify if a counter category is single or multiple\
    \ instances. For multiple instance categories, when you select a counter to view\
    \ in the Performance Monitor, you can pick an instance of the counter. When using\
    \ counters within your application, you must also specify an instance name, as\
    \ shown in the following example:"
