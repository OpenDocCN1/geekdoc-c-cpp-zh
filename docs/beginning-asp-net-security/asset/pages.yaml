  md: 'From this chapter, you have learned how to validate an XML document, how to
    safely query an XML document, and some of the options available to you to protect
    XML against unauthorized changes or eavesdropping.


    # A CHECKLIST FOR XML


    Following is a checklist of items to follow when using XML in your application:


    +   * XML should be validated *before trusting and using it*— Remember that the
    well-formed status of an XML document is not a guarantee of its validity.

    * *Validate all XML against a strict schema*— Use copies of XML schemas whenever
    possible. If you need to use external schemas, consider caching them with a caching
    resolver.

    * *Choose an appropriate encryption method for your situation*— Generally, if
    your application needs to encrypt and decrypt the same data, choose a symmetric
    algorithm. If your application talks to an external system, choose an asymmetric
    algorithm.

    * *Always use digital signatures if you need to ensure data has not changed*—
    Encryption is not enough when you cannot detect changes in data. Even unencrypted
    data may need a mechanism for detecting changes. Use digital signing to provide
    a security mechanism against unauthorized modification.'
