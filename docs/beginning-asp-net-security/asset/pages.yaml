    # SIGNING MESSAGES WITH WCF


    WCF gives you the capability to sign or parts of a message using a client certificate
    — you have already discovered how to manually sign XML in Chapter 10.


    To sign messages with WCF you need two certificates. First you require a server
    certificate. The client uses the public key from the server certificate to encrypt
    the message or parts of a message and the encrypted data is decrypted using the
    private key. The second certificate needed is the client certificate. This is
    used to sign the data. The client certificate allows the server to discover who
    signed the message, providing non-repudiation. Non-repudiation means that neither
    party can dispute who the message came — signing a message can only be done by
    using the private key contained in the X509 certificate, which is kept secret
    by the sender of the message.'
