  md: '# TABLE 14-1 (continued)


    | ROLE SERVICE | PURPOSE |

    | --- | --- |

    | ASP.NET | Obviously, you will want to install the ASP.NET role service to support
    the running of your applications. |

    | .NET Extensibility | This role supports HTTP modules and the extension of the
    request pipeline. It is required when you install the ASP.NET service role. |

    | ASP | This role supports classic Active Server Pages (ASP) applications. If
    your server will not run ASP applications, do not install this role. It is not
    required to run ASP.NET applications. |

    | CGI | This role supports Common Gateway Interface (CGI) applications. If your
    server will not run CGI applications, do not install this role. It is not required
    to run ASP.NET applications. |

    | ISAPI Extensions | This role is required for ASP.NET applications. |

    | ISAPI Filters | This role is required for ASP.NET applications. |

    | Server Side Includes | Server Side Includes (SSI) is a method of creating dynamic
    HTML files by including one in another. Like CGI and ASP, if your application
    does not use this facility, do not install it. |

    | HTTP Logging | This provides request logging in a standard format used by most
    Web services, as well as in addition to logging that IIS places in the Windows
    event log. The logs include details on every request made to your server, and
    are a great source of potential attacks. HTTP logging should be enabled on any
    server. |

    | Logging Tools | This optional facility installs a scriptable object, log.dll,
    which allows programs to easily parse log files. Some logging analysis software
    require this. Because it is not remotely callable, it is safe to install this
    when you configure HTTP logging. |

    | Request Monitor | The Request Monitor allows a server administrator to examine
    requests, as well as the processes and application pools these requests run in.
    This can be useful in tracking down requests that slow a Web server response.
    You can access the Request Monitor by highlighting the server in the IIS Administration
    tool, and clicking Worker Processes. (Application pools are discussed in more
    detail later in this chapter.) |

    | Tracing | This facility is separate from ASP.NET tracing. It allows rules to
    be configured for requests. The rules can trigger on various conditions, including
    errors and long running requests. Like Request Monitor, this can be useful in
    tracking down requests that cause a Web application to slow, or to track specific
    error conditions that would not normally show in the IIS logs. |'
