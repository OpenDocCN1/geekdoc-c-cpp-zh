  md: '# 156 | CHAPTER 7 ADDING USNAMES AND PASSWORDS


    # TABLE 7-2 (continued)


    | ATTRIBUTE | DESCRIPTION |

    | --- | --- |

    | path | Encryption —ASP.NET encrypts the cookie, but does not validate it. This
    may leave your application open to attack.<br><br>Validation —ASP.NET validates
    the cookie, but does not encrypt it. This may expose information to an attacker.<br><br>Specifies
    the path for the authentication cookies issued by the application. The default
    value is /, and it is unlikely you want to change this if you have a single Web
    application on your site. If you have multiple Web applications running on a single
    site (for example http://example.com/app1/ and http://example.com/app2/) and want
    to have a user log in separately for each application, then you can set the path
    to the directory containing your application. |

    | timeout | Specifies the amount of time (in minutes) an authentication cookie
    lasts for. The default value is 30 minutes. |

    | cookeless | Iftrue,ASP.NET will use the URL to convey authentication information
    in the URL and not in a cookie. |

    | defaultUrl | Specifies the default URL a user will be redirected to if no redirect
    URL is specified. This defaults to default.aspx. |

    | domain | Specifies the domain name for the authentication cookie. |

    | slidingExpiration | If set true, the authentication cookie will be reset with
    every request. |

    | enableCrossAppsRedirect | Specifies if crossapplication redirection of authenticated
    users is allowed. The default is false. |

    | requireSSL | Specifies if the authentication cookie can only be transmitted
    over SSL connections. |


    > NOTE The web.config example in Listing 7.2 shows usernames and passwords stored
    without any encryption or hashing. This obviously is strongly discouraged, but
    is suitable for demonstrating the login process.


    Of course, a login page, users cannot authenticate. ASP.NET provides the FormsAuthentication
    class to enable you to programmatically validate users against your data store.
    Listing 7-3 shows how to do this.'
