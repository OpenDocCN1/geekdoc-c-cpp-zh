  md: "# 3. To limit a single directory, create a new directory in your web application\
    \ called documents and create in another two text files, example1.txt andexample2.txt\
    \ . In the code below file, getfile.aspx.cs, change the code to the following:\n\
    \n```\nusing System;\nusing System.IO;\n\npublic partial class getfile : System.Web.UI.Page\n\
    {\n    protected void Page_Load(object sender, EventArgs e)\n    {\n        Response.Clear();\n\
    \        string filename = Path.GetFileName(Request.QueryString[\"filename\"]);\n\
    \        FileInfo file = new FileInfo(filename);\n        Server.Path.Combine(\"\
    documents\", filename));\n        Response.AddHeader(\"Content-Length\", file.Length.ToString());\n\
    \        Response.Writefile(file.FileName);\n        Response.End();\n    }\n\
    }\n```\n\n# 4. Now, run your project and see if you can access web.config or any\
    \ other file outside of the documents directory.\n\n> WARNING Of course, exposing\
    \ a filename as a query string or form parameter is a direct object reference\
    \ vulnerability (even secured to particular directory) and is at least a form\
    \ of information leakage. It is a best practice to use an indirect object reference,\
    \ such as a GUID, which is resolved in code to an actual filename. If you are\
    \ generating GUIDs in a short amount of time, there is a risk that they may be\
    \ sequential — something you could mitigate by pausing for a small, random period\
    \ of time before each GUID generation.\nUsing an indirect object reference also\
    \ prevents the need to check the validity of the specified filenames, and alleviates\
    \ the risk of serving web.config and other sensitive files. Furthermore, it stops\
    \ you from opening resolved file names, such as CON,NULL,PRN,LPT1 and others,\
    \ because again, the mapping would not exist.\n\nOne thing from the example is\
    \ setting the correct Multipurpose Internet Mail Extensions (MIME) type of the\
    \ download. A browser uses the MIME type of a file to decide how to handle the\
    \ file. A MIME type of image/png would identify the file to a browser as a PNG\
    \ image. MIME types are set as part of the HTTP response headers, and the browser\
    \ uses them to decide what to do with a file. Normally, the MIME types are set\
    \ on the server configuration. But if you are serving files manually, you must\
    \ ensure you set the correct MIME type."
