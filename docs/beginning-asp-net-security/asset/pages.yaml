    # # Making a File Downloadable and Setting Its Name


    You can use the Response headers to set the filename of the file being served
    by the Content-Disposition header like so:


    ```

    Response.AddHeader("Content-Disposition", "filename=%filename");

    ```


    Furthermore, you can useContent-Disposition to cause a download rather than rendering
    in the browser, as shown here:


    ```

    Response.AddHeader("Content-Disposition", "attachment; filename=%filename");

    ```


    # # Adding Further Checks to File Access


    Once you have a secure mechanism to access files, you can expand the mechanism
    with more checks and features. Two of the most common uses are role-based file
    access and anti-leeching checks for images.


    # # Adding Role Checks


    In IIS7, if your application runs in the default integrated pipeline, all file
    access is checked using the web.config authorization rules. In IIS6, or IIS7 class
    mode only, file types are mapped by IIS to the ASP.NET API extension, and access
    checks are performed on the currently logged-in user and the rules in web.config
    (authentication and authorization) are covered in Chapter 7). If you are running
    under IIS6, or IIS7 classic, you are following best practice and storing files
    which wish to serve programmatically outside of your Web root, then you must programmatically
    authorize access.


    The easiest way to support role-based access to files is to have the serving page
    itself role-protected by ASP.NET, and then separate the files into directories
    outside the Web root for role. For example, if you only want to serve these files
    to members, but not to anonymous users, then you could place the serving script
    in a members directory, and limit access to the serving page with the web.config
    file shown in Listing 9-2.'
