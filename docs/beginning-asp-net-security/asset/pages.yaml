  md: '# Avoiding Mistakes With Browser Information


    Event validation was introduced in ASP.NET 2.0 to prevent the falsification of
    events. Event validation is the default behavior for ASP.NET. When validation
    is enabled, controls that render (which excludes controls that are not visible)
    register themselves with event validation. When a postback occurs, ASP.NET looks
    through the registered events to discover if the control that would receive the
    event has been registered.


    Event validation also covers postback data from list controls. For example, if
    you have a drop-down list of status codes (which are only available to administrators),
    and an attacker sends a falsified request containing one of the status codes that
    was not in the list, then an exception will occur.


    Event validation should be part of your defense strategy. However, it should not
    be your sole defense. Because it is up to controls to register for event validation,
    it is possible that a third-party control (or, one of your custom controls) may
    not register for event validation.(A control registers by calling RegisterForEventValidation
    during rendering.) If you have controls or values that change based on any condition
    (for example, a user''s membership), then always perform checks within the event
    handler to validate that the event should have occurred, and the values that are
    set are valid for the conditions you set.


    # AVOIDING MISTAKES WITH BROWSER INFORMATION


    Request headers are the final type of input that is transmitted with every request.
    You can access the request headers via the Headers property on the Request class.
    In a normal (valid) request, these headers are sent by the browser. For example,
    the headers shown in Table 4-1 were sent to a test page by IE7.


    # TABLE 4-1: Example Request Headers


    | HEADER NAME | VALUE |

    | --- | --- |

    | Connection | Keep-Alive |

    | Accept | image/gif, image/x-hitmap, image/jpeg, image/jpeg, application/x-ms-application,
    application/vnd.ms-xpsdocument, application/xml+xml, application/x-ms-xbap, application/x-silverlight,
    application/x-shockwave-flash, /* |

    | Accept-Encoding | gzip, deflate |

    | Accept-Language | en-gb |

    | Host | localhost:49258 |

    | Referer | http://localhost:49258/Request%20Headers/Default.aspx |

    | User-Agent | Mozilla/4.0 (compatible with MSIE 7.0; Windows NT 6.0; SLCC1;.NET
    CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506; .NET CLR 3.0.30618; .NET
    CLR 3.5.21022; .NET CLR 3.5.30729) |

    | UA-CPU | x86 |'
