  md: '# # 10

    Securing XML


    Extensible Markup Language (XML) has emerged as the standard way to transfer data
    and metadata between systems. XML is a rich standard, and its extensibility has
    led to various additions, including schemas and query languages. You may have
    already used it without knowing it. XML underpins Web services, .NET configuration
    files, and even IIS7 configuration. However, as you add XML support to your application,
    you are adding another vector for attack and potential vulnerabilities. Like any
    input, XML should be considered untrusted until you validate and sanitize it.


    In this chapter, you will learn about the following:


    +   - How to accept and validate XML

    - How to query XML safely

    - How to sign XML documents to ensure them against tampering

    - How to encrypt XML to prevent eavesdropping


    > NOTE This chapter will only concentrate on the security aspects of XML. For
    a more detailed exploration of XML and all its associated technologies, Professional
    XML by Bill Evjen, Kent Sharkey, Thiru Thangarathinam, Michael Kay, Alessandro
    Vernet, and Sam Ferguson (Indianapolis: Wrox, 2007) is highly recommended.


    # # VALIDATING XML


    Like any input, XML should be validated before trusting and using it. XML has
    two validation points:


    +   - Is it“well-formed”?

    - Is it“valid”?'
  merge: -1
  pgno: 230
- img_proc: true
  md: "# WelFormed XML\n\nAn XML document is said to be well-formed when it conforms\
    \ to the XML syntax specification, and contains no references to external resources\
    \ unless a document type definition (DTD) is specified.\n\nFollowing is an example:\n\
    \n```\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<Books>\n  <Book>\n    <Title>Example\
    \ Title</Title>\n    <Author>John Smith</Author>\n    <Pages>500</Pages>\n  </Book>\n\
    \  <Book>\n    <Title>Another Title</Title>\n    <Author>John Doe</Author>\n \
    \   <Pages>250</Pages>\n  </Book>\n</Books>\n```\n\nThis XML document is well-formed.\
    \ However, this does not mean that a document is valid. The term \"well-formed\"\
    \ is borrowed from formal mathematical logic. An assertion is well-formed if it\
    \ meets grammatical rules, but does not take into account the truth of assertion.\n\
    \n# Valid XML\n\nAn XML document is considered valid if it is well-formed, meets\
    \ certain extra validity constraints, and matches a grammar describing the document's\
    \ content. The rules for specifying a document's grammar are expressed in a DTD\
    \ or an XML schema. These rules allow the document producer to specify such things\
    \ as, \"A book must have a title.\" This might be like a database administrator\
    \ restrictions on a table, certain fields must be one or not null.\n\nFor example,\
    \ an XML schema for the Books XML code might look like this:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<xs:schema xmlns:xs=\"http://www.w3.org/2001/XMLSchema\"\
    \ \n           targetNamespaceDefault=\"http://wrox.example/example\">\n  <xs:element\
    \ name=\"Books\">\n    <xs:complexType>\n      <xs:sequence>\n        <xs:element\
    \ maxOccurs=\"unbounded\" name=\"Book\">\n          <xs:complexType>\n       \
    \     <xs:sequence>\n              <xs:element name=\"Title\"\n              \
    \  type=\"xs:string\" minOccurs=\"1\" maxOccurs=\"1\" />\n              <xs:element\
    \ name=\"Author\"\n                type=\"xs:string\" />\n```"
  merge: -1
  pgno: 231
- img_proc: true
