  md: '# SQL Express Instances


    When Microsoft designed SQL Express, one of the goals was tighter integration
    with Visual Studio. This was achieved by allowing a SQL database to be treated
    as any other file, and allowing the automatic attachment of these files to SQL
    server. This feature is known as user instances.


    The following connection string shows how user instances can be configured:


    ```

    add name="database"

    connectionString="Server=\SQLExpress;AttachDbFilename=|DataDirectory|database.mdf;\nDatabase=dematabase;

    IntegratedSecurity=True;

    UserInstance=True;

    providerName="System.Data.SqlClient" />

    ```


    While this is不得不 useful during the development process (and you''ve used it in
    all the examples in this chapter), it presents a problem. When a database is loaded
    as a user instance, it is (as you might imagine from the name) loaded for a particular
    user. That user account becomes the database administrator for that instance,
    bypassing any security restrictions on the tables, views, and stored procedures
    on that database. This makes it difficult to test any security measures you have
    put in place.


    If possible, avoid using either the SQL Express Management Studio, or SQL Server
    Development to develop against, as this will enforce security. Microsoft has stated
    that user instances for non-administrators will be dropped from a future version
    of SQL Server — another good reason to relying on it.


    # Drawbacks of the VS Built Web Server


    Another problem is the web server built into Visual Studio 2008 runs under the
    context of the current logged-in user. This user account may have database administration
    rights during development, and, so, like user instances, you bypass all security,
    making it difficult to catch or test security controls. You should be aware of
    this, and plan to test your application hosted within IIS and running under a
    limited user account, configured to the least privileges possible.


    # Dynamic SQL Stored Procedures


    One commonly held false assumption is that stored procedures will entirely protect
    you from SQL injection. In fact, this is not true. Certain stored procedures build
    their SQL dynamically (for example, search procedures). A example stored procedure
    might look like the following example:


    ```

    CREATE PROCEDURE search_orders(@CustID nchar(5) = NULL,

    @ShipTo nvarchar(40) = NULL

    DECLARE @sql nvarchar(4000)

    SELECT @sql = ''SELECT OrderID, OrderDate, CustomerID, ShipTo +

    FROM dbo.Orders WHERE 1 = 1

    IF @CustID IS NOT NULL

    SELECT @sql = @sql + '' AND Customer LIKE '''''''''' + @customerID + ''''''''''''

    ```'
  merge: -1
  pgno: 206
- img_proc: true
  md: '```

    IF @shipTo IS NOT NULL

    SELECT @sql = @sql + '' '' AND ShipTo LIKE '''' + @shipTo + '' ''''

    EXEC(@sql)

    ```


    This procedure will perform a LIKE comparison on the customer parameter, the shipTo
    parameter, or a combination of both. The problem arises at the beginning of this
    chapter, this stored procedure is vulnerable to injection because it dynamically
    builds a query and executes it. If, for example ''; DROP TABLE Orders -- were
    passed into the stored procedure as the shipTo parameter, the resulting SQL executed
    would be as follows:


    ```

    SELECT * FROM dbo.Orders WHERE ID = 1 AND ShipTo LIKE ''''''; DROP TABLE Orders
    --''

    ```


    Depending on the permissions on the orders table, it may be deleted.


    To implement a dynamic stored procedure correctly, the approach is exactly the
    same as using a SQL statement in .NET: A safe version of this stored procedure
    would be the following:


    ```

    CREATE PROCEDURE search_orders @custID nchar(5) = NULL,

    @shipTo varchar(40) = NULL AS

    DECLARE @sql varchar(400)

    SELECT @sql = ''SELECT OrderID, OrderDate, CustomerID FROM '' +

    FROM dbo.Orders WHERE ID = 1 ''''

    IF @custID IS NOT NULL

    SELECT @sql = @sql + '' '' AND CustomerID LIKE @custID ''''

    IF @shipTo IS NOT NULL

    SELECT @sql = @sql + '' '' AND ShipName LIKE @shipTo ''''

    EXEC sp_executesql @sql, N''@custID nchar(5),@shipTo varchar(40)'',

    @custID, @shipTo

    ```


    As you can see, this is again, specifying parameter names and providing those
    parameters as the command.


    # SQL Encryption


    SQL 2005 provides four encryption mechanisms:


    +   - Encrypting by pass phrase

    - Symmetric encryption

    - Asymmetric encryption by key

    - Encryption by certificates


    > NOTE Encryption itself is discussed in detail in Chapter 6. If you haven''t
    read that yet, now is a good time to do so. It will give you the understanding
    you to read about SQL''s encryption capabilities.'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'SQL 2008 adds transparent encryption, which encrypts the entire database, by
    encrypting the database files themselves. Because this discussion serves as a
    very simple introduction to SQL encryption, transparent encryption and certificate
    encryption (which varies according to the version of SQL you are using) cannot
    be easily by papers on SQL security, including SQL cryptography in general, and
    transparent encryption. You can find them published on MSDN at http://msdn.microsoft.com/en-us/library/dd61807(SQL.10).aspx


    # Encrypting by Pass Phrase


    The easiest encryption mechanism is to use by pass phrase. The following SQL code
    snippet encrypts a string using a pass phrase, and then decrypts it:


    ```

    DECLARE @plaintext AS VARCHAR(128)

    DECLARE @passPhrase AS VARCHAR(64)

    DECLARE @encryptedText AS VARBINARY(MAX)

    DECLARE @decryptedText AS VARBINARY(MAX)


    SET @plaintext = ''MySecret''

    SET @passPhrase = ''T0p!Secr3''


    SET @encryptedText = EncryptByPassPhrase(@passPhrase, @plaintext)


    PRINT @encryptedText


    SET @decryptedText = DecryptByPassPhrase(@passPhrase, @encryptedText)


    PRINT CONVERT(VARCHAR(100), @decryptedText)

    ```


    If the wrong password is specified, the decryption function will return null .


    # SQL Symmetric Encryption


    Now let''s look at symmetric encryption. You will remember from Chapter 6 that
    this uses the same key for encryption and decryption. To use symmetric encryption,
    you must first create the key you wish to use. The simplest type of encryption
    is protected by a password, and is created as follows:


    ```

    CREATE SYMMETRIC KEY MySymmetricKey

    WITH ALGORITHM = AES_128

    ENCRYPTION BY PASSWORD = ''N''AsSuperStrongPassword''

    ```


    This creates a key namedSymmetricKey in the master database, using the AES algorithm
    with a key length of 128. SQL Server supports 2DES, 3DES, AES, RC2 and the deprecated
    RC4. You can check which keys exist by running the following command:


    ```

    SELECT * FROM sys.symmetric_keys

    ```


    Once you have a key, you must open it before use, using the password you specified
    when you created it. Then you can encrypt and decrypt as shown in the following
    example:'
  merge: -1
  pgno: 208
- img_proc: true
  md: "```\nDECLARE @plaintext VARCHAR(100)\nDECLARE @encryptedText BINARY(MAX)\n\
    DECLARE @decryptedText BINARY(MAX)\n```\n\n```\nSET @encryptedText = \nEncryptByKey(GUID('MySymmetricKey'),\
    \ @plaintext);\nPRINT @encryptedText\n```\n\n```\nSET @decryptedText = DecryptByKey(@encryptedText);\n\
    ```\n\n```\nCLOSE SYMMETRIC KEY MySymmetricKey;\n```\n\nYou can delete a symmetric\
    \ key by using the drop command, as shown here:\n\n```\nDROP SYMMETRIC KEY MySymmetricKey\n\
    ```\n\nOf course, once you delete a key, you will no longer be able to decrypt\
    \ any information that had been encrypted with it. You can control access to the\
    \ key by granting permission to it. The following example grant read access to\
    \ the key to the user ScottGal in the current database:\n\n```\nGRANT VIEW DEFINITION\
    \ ON\nSYMMETRIC KEY::MySymmetricKey To ScottGal\n```\n\nThe symmetric encryption\
    \ functions can also take an authenticator. Authenticators stop the inference\
    \ of data from encrypted fields, and lock an encrypted field to the authenticator.\
    \ For example, consider the table of outgoing payments shown in Table 8-2.\n\n\
    # TABLE 8-2: Outgoing Payments\n\n| PAYMENT | COMPANY | VALUE |\n|---|---|-|\n\
    | 1 | ComputerSupplier | Bd7E17^ghds00 |\n| 2 | Sandwiches Inc. | C977^E99&01D\
    \ |\n| 3 | Paper Is Us | A76Ashdka&&% |\n\nIt's likely that the value of payments\
    \ to the ComputerSupplier is higher than that of Sandwiches Inc. If any attacker\
    \ had control over Sandwiches Inc., he or she could increase the payment sent\
    \ to that company by taking the value for ComputerSupplier and using it to update\
    \ the value of the payment sent to Sandwiches Inc."
  merge: -1
  pgno: 209
- img_proc: true
  md: "By specifying an authenticator when encrypting, the encrypted value will be\
    \ unique for that authenticator. In Table 8-2, the payment ID is a suitable authenticator\
    \ value. If the wrong authenticator value is supplied during decryption, the decryption\
    \ will fail. So, if an attacker were to take the value of payment ID 1 and put\
    \ it for the value of payment ID 2 , the decryption process would not work.\n\n\
    To use an authenticator, add it as the final parameter to EncryptByKey andDecryptByKey,\
    \ like so:\n\n```\nSET @encryptedText =\n    EncryptByKey(Key_GUID('MySymmetricKey'),@plainText,\
    \ @authenticator);\n\nSET @decryptedText = DecryptByKey(@encryptedText, @authenticator);\n\
    ```\n\n# SQL Asymmetric Encryption\n\nTo create an asymmetric key, the process\
    \ is much like that for symmetric keys:\n\nLike .NET, only one asymmetric algorithm\
    \ is available, RSA. You can specify the key length by using RSA_512,RSA_1024\
    \ or RSA_2048 when creating the key. You probably won't be surprised to learn\
    \ that what keys exist by running the following command:\n\n```\nSELECT * FROM\
    \ sys.asymmetric_keys\n```\n\nEncrypting with an asymmetric key does not need\
    \ anything special because, of course, public keys are generally public. Decrypting\
    \ with an asymmetric key needs the key password.\n\n```\nDECLARE @plainText VARCHAR(100)\n\
    DECLARE @encryptedText BINARY(MAX)\nDECLARE @decryptedText BINARY(MAX)\n\nSET\
    \ @plainText = 'Hello RSA'\n\nSET @encryptedText =\n    EncryptByAsymmetricKey(AsymKey_ID('MyAsymmetricKey'),@plainText);\n\
    PRINT @encryptedText\n\nSET @decryptedText = DecryptByAsymmetricKey(AsymKey_ID('MyAsymmetricKey'),\n\
    \    @encryptedText, N'AnotherStrongPassword');\n\nPRINT CONVERT(VARCHAR(100),@decryptedText)\n\
    ```\n\nLike before, you can delete an asymmetric key using the drop command, as\
    \ shown here:\n\n```\nDROP ASYMMETRIC KEY MyAsymmetricKey\n```"
  merge: -1
  pgno: 210
- img_proc: true
  md: 'You can control access to the public key by granting permission to it. The
    following example grants read access to the public key to the user ScottGal in
    the current database. Access to the private key is still controlled by the use
    of the key password.


    ```

    GRANT VIEW DEFINITION ON

    ASYMMETRIC KEY::MyAsymmetricKey To ScottGal

    ```


    # Calculating Hashes and HMACs in SQL


    Of course, detecting changes to data encryption is not enough. You must produce
    a MAC. SQL provides the HashBytes function that will provide a SHA, SHA1, MD2,
    MD4, or MD5 hash of data. Used in combination with the encryption key, this can
    produce an HMAC value, allowing you to check the integrity of the encrypted data.
    Raul Garcia has a good example of this on his blog at http://blogs.msdn.com/raulga/archive/2006/03/11/549754.aspx.


    # A CHECKLIST FOR SECURELY ACCESSING DATABASES


    The following is a checklist of items to follow when writing data-access code:


    +   - Never dynamically build SQL queries—Dynamic queries are a vector for SQL
    injection.

    - Always use SQL parameters—SQL parameters will automatically escape dangerous
    characters and help you void SQL injection.

    - Control access to your data—If you can, use stored procedures and SQL permissions
    to limit access to the underlying database. If you cannot use stored procedures,
    use updatable views to limit access to the underlying database. Stored procedures
    are not a panacea because they can, in turn, contain dynamic SQL themselves.'
  merge: -1
