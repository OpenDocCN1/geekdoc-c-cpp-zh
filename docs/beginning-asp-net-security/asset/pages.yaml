  md: "# Adding Security to an Internet Service | 269\n\nBut where are these usernames\
    \ checked against? By default, the credentials are checked against the local Windows\
    \ username and password store. So you must set appropriate value in the test program\
    \ — for example, your own username and password. Run your updated test client\
    \ and see that the service performs as expected.\n\n> > WARNING, you should never\
    \ hard-code a username and password or any other credential into your programs.\
    \ This is done here for illustrative purposes only.\n\nNow you have a Web service\
    \ that accepts a username and password. But how do you discover which user has\
    \ authenticated? Like ASP.NET, WCF checks the identity of the current user as\
    \ part of a context object, specifically ServiceSecurityContext.Current.PrimaryIdentity\
    \ . The PrimaryIdentity has a type of IIdentity. Each different authentication\
    \ type will have its own concrete class, but the IIdentity interface that it must\
    \ have a Name property.\n\nOpen the EchoService.svc.cs file and change its to\
    \ reflect the current identity to the client program, as shown in Listing 11-6.\n\
    \n+   LISTING 16: Accessing the name of the current user in a WCF service\n\n\
    ```\nusing System;\nusing System.ServiceModel;\n\nnamespace WCFSecurity\n{\n \
    \   public class EchoService : IEchoService\n    {\n        public string Echo(string\
    \ message)\n        {\n            return (\"You sent \" + message + +\n     \
    \           \" as \" + +\n                ServiceSecurityContext.Current.PrimaryIdentity.Name);\n\
    \        }\n    }\n}\n```\n\nWhen you run the test client, you will see the username\
    \ that the client authenticated with. Because the default behavior is it goes,\
    \ using the Windows user store, is not necessarily suitable for Internet sites.\
    \ For ASP.NET applications, user management is normally provided by the Membership\
