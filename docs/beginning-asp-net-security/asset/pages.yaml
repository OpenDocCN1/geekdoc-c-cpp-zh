  md: 'allows static content, error messages, directory browsing, and adds the logging
    tool, leaving you with a Web server unable to run ASP.NET applications. Checking
    the ASP.NET functionality will add the dependencies it needs. As a rule of thumb,
    you should only install the features that you need, avoiding any potential vulnerability
    in components you are not using.


    Unlike previous versions of IIS (where configuration information was hidden in
    a database called metastasis), IIS stores its configuration in .config files,
    making it easy to copy configurations from one machine to another. A change made
    to an individual site in the IIS Manager will insert or change the required lines
    in an application''s .web.config file. This means you can trail and test various
    configurations on your development machine, and then simply copy the configuration
    file to a live server (unless an administrator has locked particular settings)
    your configuration will become active.


    # IIS Role Services


    Table 14-1 lists the myriad options that IIS supports and their purposes. Remember
    that IIS Role Services support all Web sites on a server. If one Web site on a
    server needs directory browsing but others not, then installing directory browsing
    will make it available to every Web site, not just the one that requires it. However,
    some services can be configured on an individual-site basis in the system.WebServer
    config file.


    TABLE 14-1: IIS Role Services


    | ROLE SERVICE | PURPOSE |

    |---|---|

    | Static Content | Static Content supports the serving of static files (such as
    HTML, image, and text files). As such, it''s very rare that you will need this.
    |

    | Default Document | This allows you to configure a default document to be served
    users not specify a filename in the requested URL. Again, it''s very likely you
    will need this unless, for example, your Web server simply hosts Web services
    for which every client knows the direct URL. |

    | Directory Browsing | Directory browsing produces an automatically generated
    list of files and directories when the user does not specify a file in the URL
    and default documents are disabled or not configured. This is not needed, and
    so can be deselected during installation, or uninstalled afterward. |

    | HTTP Errors | This facility allows you to customize the error messages returned
    by IIS to a client browser. This is overridden by the ASP.NET custom errors for
    any file that passes through the ASP.NET engine (or all files integrated in pipeline
    mode). |

    | HTTP Redirection | This allows requests to be redirected to another URL, and
    is useful for supporting migration from older applications. |'
