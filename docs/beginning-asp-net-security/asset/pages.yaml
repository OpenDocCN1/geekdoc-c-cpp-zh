  md: 'As you can see, the validator interface defines two properties (ErrorMessage
    and IsValid) and a single method (Validate). When a validation control is placed
    on a page, it adds itself to the Validators'' collection. The Page class provides
    a Validate method that iterates through the Validators, calling each registered
    control. The Validate method performs whatever validation logic has been written,
    and then sets the IsValid and ErrorMessage properties appropriately. Each standard
    validation control also has a ControlToValidate property that attaches validation
    to the input you wish to validate.


    Controls that trigger a postback have a CausesValidation property. When set to
    true, a postback will cause the page''s Validate method to be called before any
    of the control''s event handlers run. Other controls (such as Button) have a default
    CausesValidation value of false; others (generally those that do not automatically
    trigger a postback) do not.


    Page processing does not stop when validation fails. Instead


    In addition to the ErrorMessage property (which can be shown in the ValidationSummary
    control), the standard ASP.NET validation controls also provide a Text property.
    This property can be used to provide a visual indicator beside a form that has
    failed validation, as shown in Figure 3-6.


    ![](img/c28a05c0528daad8a392659cd26abcda_64_0.png)


