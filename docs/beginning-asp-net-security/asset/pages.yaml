  md: "# Accessing the Web and Web Services with Silverlight\n\nSilverlight has three\
    \ ways of accessing Webhosted resources:\n\n+   - Via System.Net.WebClient class,\
    \ which allows you to retrieve resources\n- Via System.Net.WebRequest class, which\
    \ allows you to post values to Web pages\n- Via Web services\n\nHowever, before\
    \ you use any external resource, you must be aware of the security restrictions\
    \ Silverlight applies to any code that utilizes HTTP. If you've attempted use\
    \ Ajax to access resources across domains, you will realize there is no direct\
    \ way to do so — you are limited by the Same-Origin Policy explained earlier in\
    \ this chapter. Silverlight is not restricted, and borrows an approach from Flash.\n\
    \nIf Silverlight attempts to access a resource outside of its hosting, it will\
    \ first check for clientaccesspolicy.xml in the root of the destination Web server.\
    \ If this is not found, Silverlight will also check for crossdomain.xml a file\
    \ format originally used by Flash. These files enable a Web site to allow access\
    \ to its resources from applications outside of it.\n\nFor example, the clientaccesspolicy.xml\
    \ file in Listing 12-8 allow you to access any Web service or your resource from\
    \ any Silverlight application.\n\n# LIST 12: A clientaccesspolicy.xml file allowing\
    \ access from anywhere\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\" ?>\n<access-policy>\n\
    \ <cross-domain-access>\n  <policy>\n   <allow-from>\n    <domain url=\"*\" />\n\
    \   </allow-from>\n   <grant-to>\n    <resource path=\"/\" include-subpaths=\"\
    true\" />\n   </grant-to>\n  </policy>\n </cross-domain-access>\n</access-policy>\n\
    ```\n\nThe clientaccesspolicy.xml file in Listing 12-9 allow access to the /servicesdirectory\
    \ on your Web server from example.com.\n\n# LIST 12: A clientaccesspolicy.xml\
    \ file allowing limited access\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\"\
    \ ?>\n<access-policy>\n <cross-domain-access>\n  <policy>\n   <allow-from>\n \
    \   <domain url=\"http://www.example.com\" />\n   </allow-from>\n```"
