    # Using Certificates for Asymmetric Encryption


    Now you have the capability to perform asymmetric encryption for small amounts
    of data. But what you have learned so far no unencrypted key — you cannot tell
    from whom the encrypted data has. This is where certificates, coupled with digital
    signatures, come into play.


    A digital certificate is a container for asymmetric keys. These features include
    expiry dates for the certificate and the keys, information about the holder of
    the keys (as a name or company details), and the location of a revocation list
    (a service available online that can be checked to see if a certificate is valid
    and has not been compromised).

    You will have already used certificates in Web browsing, the X509 certificate
    used for SSL transactions (shown in Figure 6-3).


    ![](img/c28a05c0528daad8a392659cd26abcda_143_0.png)


    FIGURE 6-3: The properties of an X509 certificate shown through Internet Explorer


    # Getting a Certificate


    There are three ways you can get a certificate:


    +   * Buy a certificate — This is generally the route you take if people outside
    your company will need to interact with your service. Companies such as Verigen,
    Thawte, Comodo, and others will use certificates to customers passing identity
    checks. These companies are, by default, trusted by all major browsers and operating
    systems, and client software will not need special steps to validate your certificate.
    The instructions for each company vary, but all will require a Certificate Signing
    Request (CSR) generated from the machine on which you wish to install the certificate.
    Chapter 14 details how to create a certificate for an SSL certificate for your
    Web site.


    +   * Use yourinternal certificate authority — Your company may provide an internal
    certificate authority (CA) from which you can request certificates. All systems
    using certificates issued by a CA must be configured to trust it, so the CAs you
    can use certificates from this. This is done by trusting the root certificate
    of a CA, which is used to sign all certificates issued by the CA. Windows 2003
    and Windows 2008 contain “Certificate Services” that provide CA functionality.
    Chapter 14 discusses how to install and use the'
