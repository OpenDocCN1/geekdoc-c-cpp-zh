    >\n    private const string CleanUpTask = \"appCleanFiles\";\n    private static\
    \ CacheItemRemovedCallback OnCacheRemove = null;\n\n    void Application_Start(object\
    \ sender, EventArgs e)\n{\n        // code that runs on application startup\n\
