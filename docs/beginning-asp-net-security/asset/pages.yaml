  md: '# MOVING FORWARD


    Your Web application is a target for mischief makers and malicious hackers. By
    its very nature, it is exposed to the world at large. Without knowing about potential
    attacks, it is difficult to protect yourself against them. This book will arm
    you with knowledge to secure your application — but this is just the beginning.
    New attacks arise, new techniques are discovered — it’s up to you to continue
    reading blogs by security experts, attend user groups, delve into security forums,
    browse the OWASP Web Site, and use any other useful resources you can find to
    keep on top of security and guard yourself, your application, and your customers.


    # CHECKLISTS


    At the end of most chapters in this book, you will find helpful checklists that
    spotlight important points made throughout the chapter.


    Chapter 2 takes a look at how the Web works, examining the protocol used when
    requesting and receiving Web pages, how forms submissions work, and how ASP.NET
    uses these fundamentals to provide its framework for Web development. After the
    underinnings of the Web are explored, future chapters will examine how Web applications
    can be exploited, and what you can do to prevent your application from being hacked.'
