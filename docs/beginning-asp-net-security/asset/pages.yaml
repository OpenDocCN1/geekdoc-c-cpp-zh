  md: 'Table 11-3 shows message client credential types.


    | CREDENTIALS | DESCRIPTION |

    |--- | --- |

    | None | Configures the service to not need any credentials. Clients will be anonymous.
    |

    | Windows | Configures message exchange to use a Windows security context. |

    | User name | Requires a username and password that is validated using Windows
    authentication, the ASP.NET membership database, or a custom solution. Because
    WCF cannot perform any cryptographic functions (such as signing), username credentials
    are only allowed when using a secure transport such as HTTPS. |

    | Certificate | Performs client authentication using an X509 certificate. |

    | Issued Token | Requires a security token issued by a secure token service. For
    more details, see Chapter 15 for a discussion of the Windows Identity Framework
    and Windows Cardspace, which support secure token services. |


    # ADDING SECURITY TO AN INTERNET SERVICE


    Before you add security to the demonstration service, you will need to host the
    application under IIS rather than Visual Studio''s test service (which does not
    support SSL). If you are running underneath Vista with UAC enabled, then Visual
    Studio must run as an administrator to use IIS. So you will need to close Visual
    Studio, right-click on its icon, and choose “Run as administrator.”


    In the Solution Explorer, right-click the Web project WCFSecurity and choose Properties.
    Select the Web tab. Select the option to Use IIS Web Server and yours will be
    hosted under IIS. Click Open a browser and load http://localhost/WCFSecurity/EchoService.svc
    to see this.


    Now you must generate a certificate for IIS. Start the IIS Manager and click your
    machine name in the Connections list. In the Features View, you will see a Server
    Certificates icon in the IIS area. Double-click it and you will see a list of
    available service certificates. In the action list on the right-hand side of the
