    # ERROR HANDLING AND LOGGING


    Error messages are probably one of the most places to find information when attacking
    a Web application. Sending unexpected data to an application can cause internal
    errors which gives clues about how an application works, and provides information
    about further routes of attack — leading to the discovery of vulnerabilities.
    In .NET errors are represented as exceptions. When an exception occurs, ASP.NET
    can expose the internal workings of your application through an error page, the
    one shown in Figure 5-2.


    ![](img/c28a05c0528daad8a392659cd26abcda_102_0.png)


    FIGURE 5-2: The ASP.NET application error page'
