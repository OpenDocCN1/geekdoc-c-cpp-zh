  md: "# CHAPTER 3 SAFELY ACCEPTING USER INPUT\n\nIf you want to check that the input\
    \ entered matches a particular data type, then you set the Operator property to\
    \ DataTypeCheck, and the type property on the control to Currency,Date, Double,Integer,\
    \ or String. Here is following an example:\n\n```\nsp:TextBox runat=\"server\"\
    \ ID=\"anInteger\" /\nsp:CompareValidator runat=\"server\" ID=\"IntegerValidator\"\
    \nControlToValidate=\"anInteger\"\nOperator=\"DataTypeCheck\"\nType=\"Integer\"\
    \nErrorMessage=\"You must enter an integer\"\nText=\"***\"/\n```\n\n# Using the\
    \ CustomValidator\n\nTheCustomValidator allows you to create your own customized\
    \ validators that implement your business logic. To add server-side validation,\
    \ implement a handler for the ServerValidate event. If you want to add client-side\
    \ validation via JavaScript, you can specify a function name in the ClientValidationFunction\
    \ property. You can specify if the validator triggers even if the bound control's\
    \ value is empty by setting the ValidateEmptyText to true. However, if you want\
    \ to match the behavior of the standard controls, then use a RequiredFieldValidator\
    \ instead.\n\nThe serverside event handler enters in the ServerValidateEventArgs\
    \ parameter. This parameter has a Value property, which contains the value from\
    \ the control that triggered the validation. It also contains an IsValid property\
    \ which you can set to true or false, depending on the results of your validation.\
    \ It is best practice to set IsValid to false at the start of your code, and only\
    \ set it to true after successful validation. This ensures that if something goes\
    \ wrong in your logic, the safer (marking a field as invalid) happens.\n\nFor\
    \ example, the following code would define a field and its custom validator:\n\
    \n```\nsp:TextBox runat=\"server\" ID=\"quantity\" /\nsp:CustomValidator runat=\"\
    server\" ID=\"validateQuantity\"\nValidateEmptyText=\"false\"\nControlToValidate=\"\
    quantity\"\nOnServerValidate=\"OnValidateQuantity\"\nErrorMessage=\"Quantities\
    \ must be divisible by 10\"\nText=\"***\"/\n```\n\nThe serverside code for the\
    \ custom control would look like the following:\n\n```\nprotected void ValidateQuantity(object\
    \ source,\n  ServerValidateEventArgs args)\n{\n  args.IsValid = false;\n\n  int\
    \ value;\n  if (int.TryParse(args.Value, out value))\n  {\n    if (value % 10\
    \ == 0)\n    {\n      args.IsValid = true;\n    }\n  }\n}\n```"
