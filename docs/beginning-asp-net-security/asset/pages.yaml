    \ web.config file.\n\nWriting an HTTP Handler is a relatively rare occurrence,\
    \ limited to situations when you want to create a custom file extension like .RSS.\
    \ HTTP Handlers can selectively respond to requests based on the request verb\
    \ — GET, POST, and any of the other verbs supports.\n\nTo register an HTTP Module,\
    \ simply add an element in the httpHandlers section of the web.config file, as\
    \ shown here:\n\n```\nhttpHandlers>\n<add verb=\"supported http verbs\" path=\"\
    path\"\n     type=\"namespace.classname, assemblyname\" />\n</httpHandlers>\n\
    ```\n\nThe other component of the ASP.NET pipeline is the HTTP Module.\n\n# Writing\
    \ HTTP Modules\n\nEvery ASP.NET request passes through every registered HTTP Module.\
    \ Modules can be used to provide verification and validation functionality. Chapter\
    \ 4 contains a detailed walk-through to create an HTTP Module that prevents attacks\
    \ as Cross Site Request Forgery (CSRF). HTTP Modules are very simple to write."
