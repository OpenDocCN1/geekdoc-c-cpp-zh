  md: '# A CHECKLIST FOR SECURE DEVELOPMENT WITH THE ASP.NET MVC FRAMEWORK


    Following is a checklist of items to consider when developing an application with
    ASP.NET MVC:


    +   Always encode your output when adding it to your View—Encoding your output
    will protect you against XSS attacks.


    +   Protect #POST actions with an anti-forgery token.—An anti-forgery token will
    protect you from CSRF, but remember that it is a two-step process: add the form
    to the token and apply the [ValidateAntiForgeryToken] attribute to your action.


    +   Secure your model-binding—Whitelist the properties binding to avoid malicious
    updates by the inclusion of extra input fields.


    +   Perform authorization on actions in your Controller, not based upon URLs—Authorization
    rules based on URLs may not work because you can create multiple routes to a Controller.


    +   Helpers to provide common exception handling and custom authorization logic.—
    Placing common code like this in a filter allows it to be reused across multiple
    Controllers and actions.'
