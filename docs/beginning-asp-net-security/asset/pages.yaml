    # Examining <allow> and <deny>


    The <allow> and <deny> attributes allow you to control how you can access your
    resources. Each element supports the following attributes:


    +   - users -Enables you to specify a list of users by their domain or name.

    - roles -Enables you to specify groups of users that allowed or denied access.

    - verbs -Enables you to allow or limit access based on the HTTP verb of the request.


    When using any of these attributes, you can use the asterisk (*) as a wildcard.
    For example, the following configuration line will allow access to any user in
    *roles*:


    ```

    allow roles="*"

    ```


    You can also use the question mark (?) with the <users> attribute to specify unauthenticated
    users. For example, the following line will deny access to any unauthenticated
    user:


    ```

    deny users="?"

    ```


    When adding users, roles, or verbs, you can specify multiple values in two ways.
    You can specify these in separate elements, as shown here:


    ```

    allow users="thesket"

    allow users="plip"

    ```


    Or, you can provide them as a comma-separated value, as shown here:


    ```

    allow users="thesket, plip"

    ```


    The global.webconfig file has a rule that allows access to all resources. When
    locking resources, you should override this deny rule by using a <deny> setting
    - either all users <deny users="*"/> or all unauthenticated users <deny users="?"/>
    and then add users, groups, or verbs. This is an example of whitelisting values,
    rather than working from a blacklist.


    The verbs configuration is used for read-only resources, such as a directory containing
    static HTML, images, or other resources that do not contain HTML forms. By blocking
    all verbs and allowing the GET verb, you are protecting your application against
    undiscovered bugs that might occur if one of those resources causes unintended
    consequences (if, for example, an attacker used start with the block rule all
    to the target for a form submission). If you do not be possible to guard your
    rules by web tampering, a technique detailed by Arshan Dabshiri in his whitepaper
    "Bypassing Web Authentication and Authorization with HTTP Verb Tampering," which
    you can find at http://www.aspectsecurity.com/documents/Bypassing_VAAC_with_HTTP_Verb_Tampering.pdf.'
  merge: -1
