  md: '# Using Log Parser to Mine IIS Log Files | 37


    Before running any data mining on your log files, you should make a copy of them
    and run the

    mining operations on the copy. You should need evidence in the case of a hacked
    web site, log

    files can only be used if they are authentic and untouched. Copying the files
    also presents another

    advantage. You can reduce the amount of data to look through by only copying files
    applicable to

    time period when you think an attack has happened.


    After a potential attack, the first query you will want to run is the number of
    hits to resources

    hosted on your web site. A high number of requests against a single resource may
    show a resource\under attack. The following command uses Log Parser to parse and
    display any URI entry

    as* shows pages, and .ashx handles or Windows Communications

    Foundation (WCF) services (ending in .svc)


    ```

    LogParser SELECT TOP 10 cs-uri-stem as url,

    COUNT(cs-uri-stem) as hits

    FROM.* WHERE (cs-status=400 OR cs-status =500) AND

    (TO_LOWERCASE(cs-uri-stem) LIKE ''%.as*''

    OR TO_LOWERCASE(cs-uri-stem)

    LIKE ''*.svc'') GROUP BY url ORDER BY hits DESC

    ```


    When run against logs some of Graffiti that I host on a server for testing purposes,

    this query returns dataset something like the following. You will notice nothing
    out of the ordinary

    or a blog server, the comments pages, the home page, and individual entries, which
    are the most

    commonly loaded pages.


    | url | hits |

    | /CommentView.aspx | 5885 |

    | /Default.aspx | 3051 |

    | /default.aspx | 870 |

    | /FormatPage.aspx | 803 |

    | /Trackback.aspx | 711 |

    | /2006/09/03/TestPostUsingWindowsLiveWriterBeta.aspx | 602 |

    | /Login.aspx | 535 |

    | /Archives.aspx | 448 |

    | /feed/default.aspx | 405 |


    ```

    Statistics:

    -------

    Elements processed: 62143

    Elements output: 10

    Execution time: 1.98 seconds

    ```


    Let us examine the query more closely to show how Log Parser works. Table 14-5
    shows a

    breakdown of the parts of the SQL query used.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# TABLE 14-5: Breakdown of the Log Parser Query


    | QUERY PART | PURPOSE |

    | --- | --- |

    | SELECT TOP 10 cs-uri-stem AS url, COUNT(cs-uri-stem) AS hits | Selects the cs-uri-stem
    column, renames it to url, and also selects the number of hits it received by
    totaling the number of appearances it has in the log files processed. It names
    the column hits. The TOP 10 restriction instructs Log Parser to only return the
    top ten results |

    | FROM ex*.log | Selects the data source to be used — in this case, any file beginning
    with ex and having an extension of .log. |

    | WHERE (sc-status<400) OR (sc-status>=500) | Limits the records processed to
    exclude any that requested a status code between 400 and 500. The HTTP specification
    states indicate a clear error, such as requesting a resource that does not exist.
    |

    | AND (LOWERCASE(cs-uri-stem) LIKE ''%.as%'' OR LOWERCASE(cs-uri-stem) LIKE ''%.svc'')
    | Limits the records processed to URLs that end in .as% (where * is a wildcard)
    or .svc, thus limiting the query to the default ASP.NET page extensions |

    | GROUP BY url ORDER BY DESC | Groups the results by URL, and then sorts the results
    in descending order of hits, putting the most popular request at the top of the
    results |


    You can break down usage into hits per day as shown in the following:


    ```

    LogParser "SELECT TO_STRING(TO_TIMESTAMP(date, time),

    ''yyyy-mm-dd'') AS day,

    cs-uri-stem AS url, Count(*) AS hits FROM ex*.log WHERE

    (sc-status<400 OR sc-status>=500) AND

    (LOWERCASE(cs-uri-stem) LIKE ''%.as%''

    OR LOWERCASE(cs-uri-stem) LIKE ''%.svc'') GROUP BY url,

    ORDER BY day DESC" -rtp:1

    ```


    A higher number of hits on a resource may indicate a potential attack, which bears
    further investigation.

    Another indicator is the number of errors within an hour. A higher-than-normal
    number of errors may indicate that an attacker is running automated scanning software
    against your application. The following query returns any hour where there were
    more than 50 errors from the application under examination. You will obviously
    need to tweak the error rate to match your own site.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# Using Log Parser to Mine IIS Log Files | 39


    ```

    LogParser *SELECT date, QUANTIZE(time, 3600) AS hour, sc-status

    Count(*)

    AS Errors FROM ex*.log WHERE sc-status =400

    GROUP BY date, hour, sc-status

    HAVING Errors>50 ORDER BY Errors DESC -rtp:-1

    ```


    When the query was executed using sample test logs, they returned the following
    results, which may indicate something was being run on the server on December
    13, 2008, between 16:00 and 17:00:


    date               hour             sc-status Errors

    ------------------------------------

    2005-08-09 04:00:00 404       57

    2008-12-20 17:00:00 404       54

    2005-08-09 03:00:00 404       68

    2009-05-21 08:00:00 404       52

    2005-08-10 05:00:00 404       51

    2008-12-13 18:00:00 404       128


    Statistics:


    Elements processed: 62143

    Elements output: 6

    Execution time: 1.82 seconds


    Errors with a status code of 404 are not a problem. But a high number of 404 errors
    in combination with a 200 (success) status code from the same IP address may indicate
    an attack that worked. The following query extracts the log file for the December
    13, 2008, and extracts the IP address which both caused a 404 error, and also
    successfully loaded a page:


    ```

    LogParser *SELECT c-ip, cs-uri-stem, Count(*)

    as HITS FROM ex*.log WHERE

    TO_LOWERCASE(cs-uri-stem) NOT LIKE ''%.css'' AND

    TO_LOWERCASE(cs-uri-stem) NOT LIKE ''%.jpg'' AND

    TO_LOWERCASE(cs-uri-stem) NOT LIKE ''%.png'' AND

    TO_LOWERCASE(cs-uri-stem) NOT LIKE ''%.gif'' AND

    c-ip IN (SELECT c-ip FROM ex0081213.log WHERE sc-status=404) AND

    sc-status=200 GROUP BY c-ip, cs-uri-stem ORDER BY hits DESC -rtp:-1

    ```


