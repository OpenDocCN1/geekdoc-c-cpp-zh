  md: '# # Sharing Secrets with Asymmetric Encryption


    You may have noticed a drawback with symmetric encryption — if two parties are
    involved, both need to share the encryption key. This presents risks where one
    party may not securely store the key. Additionally, it isn''t possible to say
    which party encrypted the data. In addition, exchanging the keys in a secure manner
    is a problematic exercise. Asymmetric encryption was developed to eliminate the
    need to share keys by using two—one for encryption (known as the public key) and
    one for decryption (known as the private key). As its name indicates, the public
    key does not have to be a secret, and can be given to anyone who wants to encrypt
    against it. Data encrypted against the public key can only be decrypted using
    the private key (which, like a symmetric key, is highly secret), as shown in Figure
    6-2.


    ![](img/c28a05c0528daad8a392659cd26abcda_140_0.png)


    Asymmetric algorithms are often used with digital signatures, a technology that
    allows the recipient of encrypted data to validate that the data came from, and
    it was not tampered with. asymmetric encryption is used to provide non-repudiation.
    An important concept in digital security, non-repudiation is the property that
    a particular transaction was performed by a person or entity in a way that cannot
    be denied. To achieve non-repudiation, digital signatures require proof of the
    integrity of the message through secure hashing and of the origin of the message,
    provided by the sender''s public key and knowledge of the private key.


    Digital signatures can be created with digital certificates. You may have already
    seen digital certificates when you install software on your computer. The Windows
    operating system may tell you the publisher of the software package. This information
    comes from a digital signature embedded in the installer, and is created from
    a digital certificate issued to the publisher. When the installer is created,
    the publishing process embeds the public key from the digital certificate, with
    some of the certificate properties (such as the name of the company or person
    the certificate was issued to). A checksum is also embedded so that the package
    can be validated to ensure that it has not been tampered with after it was signed.


    FIGURE 6-2: Key use in symmetric encryption'
