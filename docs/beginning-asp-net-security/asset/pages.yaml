    thread, or within a garbage collector. Microsoft recommends that an HttpModule
    be used to catch these types of errors. You can find an example at http://support.microsoft.com/?id=91816.


    # Logging Errors and Monitoring Your Application


    Now that you know how to catch errors, you must implement the other half of an
    error-handling strategy: logging. Logging is not just a security strategy — it
    will enable you to discover potential problems in your application occurring.
    Logging should also be used positively, to log events like successful authentication,
    access to protected resources and so on. Logging will provide easy auditing of
    your. There are several ways to log errors, with the right one depending on your
    environment. For example, if you run a large data center and monitor your applications
    via Microsoft Operations Manager, you would log errors via Windows Management
    Instrumentation (WMI). For a single server, you may have software that monitors
    the Windows Event Log. If you are in a hosted environment, your options may be
    limited to logging to a database or sending an email to an account monitor.


    Whatever option you choose, it must be monitored, and the messages sent to it
    must clearly indicate the problem. An email message sent to a monitored email
    account may point to a locked administrator-only URL that displays a captured
    stack dump and other information you could use to replicate the error.


    > WARNING It is very important that under no circumstances should you log sensitive
    information such as a user''s password or credit card verification (CCV) code.
    Always assume that the log itself may be compromised.


    # Using the Windows Event Log


    The Windows Event Log is probably the most common logging framework available
    to a Windows application, and the .NET framework provides specific classes for
    manipulating the Windows Event Log within the EventLog namespace. To write to
    the Windows Event Log, you use EventLog.WriteEntry. An entry requires an event
    source (usually the name of your application or layer), the event message, an
    application-specific number for the entry, and an event type (for example, warning,
    error, or critical). The following code will write an error event to the Windows
    Event Log:'
