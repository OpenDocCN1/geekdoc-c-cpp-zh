  md: "# CHAPTER 5 CONTROLLING INFORMATION\n\nThis page is full of useful information\
    \ for developers and, unfortunately, for attackers. You can see the exception,\
    \ the source that caused the error, a stack trace of your application, the version\
    \ of ASP.NET on the Web server, and the location of the files on the disk drive\
    \ hosting the Web application. Luckily, ASP.NET, by default, serves only this\
    \ error to requests originating from local connections. Remote users will see\
    \ an error page like the one shown in Figure 5-3.\n\n![](img/c28a05c0528daad8a392659cd26abcda_103_0.png)\n\
    \nFIGURE 5-3: The default remote ASP.NET application error page\n\nThe default\
    \ error page indicates to an attacker that an exception occurred (by telling the\
    \ attacker that there was an Application Error) and also indicates that the application\
    \ is an ASP.NET application. You should avoid using the default error pages because\
    \ of this.\n\nError pages are controlled by the customErrors configuration element\
    \ in web.config:\n\n```\n<system.web>\n  <customErrors mode=\"On\"\n      defaultRedirect=\"\
    ~/error.aspx\">\n  </customErrors>\n</system.web>\n```\n\nIn the previous configuration\
