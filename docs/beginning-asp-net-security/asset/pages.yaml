    <xs:element name="Pages"

    type="xs:unsignedShort" minOccurs="1" maxOccurs="1" />

    <xs:sequence>

    </xs:sequence>

    <xs:complexType>

    <xs:sequence>

    </xs:complexType>

    </xs:element>

    </xs:schema>

    ```


    This example schema specifies that a book must have a title and a number of pages.
    There are no restrictions on the number of authors or the number of books in a
    book collection. Without such a rule, you would have to manually write code to
    validate the XML, according to the rules you require. Using XML schemas provides
    a more flexible approach. The schemas can be shared with external customers who
    can also use them to check that the documents they are sending are valid (although,
    of course, you should never rely on that, and always validate any XML input yourself).


    # XML Parsers


    In addition to the syntax for XML, the World Wide Web Consortium (W3C) describes
    some of the behavior of XML parsers. There are two types of parsers:


    +   - Validation—This type of parser only ensures that an XML document is well-formed.

    - Validation—This parser uses a description or schema to ensure that a well-formed
    XML document matches the rules specified.


    Any XML parser that encounters malformed XML will report this error to the application.
    The .NET framework provides parsers via the XmlElement and XmlDocument classes.
    The .NET framework will check if an XML document is well-formed when you load
    it into the XmlDocument class. If the XML fails a well-formed check, an exception
    will be thrown.


    Following is an example:


    ```

    XmlDocument xmlDocument = new XmlDocument();

    Document.Load("books");

    ```


    This snippet will throw an XmlException with a message of "Unexpected end of file
    has occurred. The following elements are not closed: books. Line 1, position 8."


    # TRY OUT Validating XML


