  md: '# #8


    # # Securely Accessing Databases


    At some point, it is likely your Web application will need to use a database.
    And, as soon as you introduce a database, you introduce a new set of potential
    vulnerabilities.


    In this chapter you will learn about the following:


    +   - How simple data queries can expose your data

    - How to query databases

    - How to secure your SQL Server databases


    > The vulnerability described in this chapter is known as SQL injection. It is
    part of a family of injection vulnerabilities that attacks can use to “inject”
    extra syntax into external commands.


    It is an extremely common problem on the Web. In June 2008, tens of thousands
    of sites were compromised by SQL injection, including those of the security vendor
    Computer Associates. The attack injected caused the applications to append JavaScript
    to every page. This JavaScript used a two-year old Windows vulnerability to infect
    visitors to the site with malware. You can read further details at http://www.computerworld.com.au/article/202731/mass_hack_infects_thousands_sites.
    The attack did not use a vulnerability in ASP.NET or SQL Server, but rather in
    the application running on each Web.


    Because this book is firmly focused on ASP.NET and the Microsoft technology stack,
    the SQL injection attacks are demonstrated on Microsoft SQL Server. However, nearly
    all database servers are vulnerable to injection attacks. The mitigations in this
    chapter are equally applicable to Oracle, PostgreSQL, and to a lesser extent,
    MySQL. The more fully featured a database server is, the more harm can be done
    with a SQL injection attack.'
  merge: -1
