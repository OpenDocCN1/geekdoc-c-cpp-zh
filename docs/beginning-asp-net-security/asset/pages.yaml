- img_proc: true
  md: 'It is worth noting, in addition to manual encoding, the methods contained in
    HtmlHelpers to produce input fields will encode HTML and attributes for you. Of
    course, you can use the AntXSS project at http://antixss.codplex.com, although
    the Security Run time Engine will not work. Your Views and Controllers are still
    protected by ASP.NET request validation. So, by default, your requesting & dangerous
    combinations will cause an exception to be thrown. With Web Forms, you should
    never disable this on an application, but instead to choose the restrictions on
    a page-by-page basis once you are sure that you have encoded every possible output.


    # Protecting an MVC Application Against CSRF


    Because the ASP.NET MVC has ViewState and the page lifecycle behind, ViewState
    user keys nor the AntiCSR approach will working in your application against CSRF.
    The MVC framework provides an HTML helper to generate a token. You can generate
    a token in your form by the following:


    ```

    <form action="/product/update" method="post">

    <Html.AntiforgeryToken()/>

    </form>

    ```


    Html.AntiforgeryToken outputs an encrypted value in a hidden input field, such
    as the one shown (which has been shortened for readability) and drops a matching
    HTTP-only session cookie:


    ```

    <input name="__RequestVerificationToken" type="hidden" value="j..." />

    ```


    Of course, token without validation is pretty useless. The validation functionality
    is provided by an ActionFilter, which you must specifically apply to the methods
    in your controller, as we show:


    ```

    [ValidateAntiforgeryToken]

    public ActionResult Update(...)

    ```


    Because forgery tokens are only applicable POST requests, the rule of thumb discussed
    in Chapter 4 (that GET requests should never change state) still apply.


    TheAntiforgeryToken methods also allow an optional salt value This value should
    be an application-wide, enabling you to limit the anti-forgery token to just your
    application — which provides isolation for applications running on the same host.


    Underneath, the token is turned into a string value using the state serialization
    functions from the ASP.NET page body, so encryption is controlled in the same
    way as ViewState encryption (via the machine key). If you are hosting the application
    servers over multiple load-balanced environment, then your machine key must match.
    (See Chapter 5 for instructions on how to generate and set a machine key).


    # Securing Model Binding


    ASP.NET MVC provides scaffolding for common actions (such as displaying model
    details, editing an item, and adding a new one), with binding functionality to
    provide an easy way to easily to model items. Consider a bulletin board system
    where a post is represented as a BoardPost class,'
