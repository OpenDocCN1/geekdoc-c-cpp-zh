- img_proc: true
  md: "To send a request for a resource, you would send a GET request, as shown in\
    \ Listing 12-2. GET and POST requests were covered in more detail in Chapter 2.\n\
    \n# LISTING 12: Sending a GET request with an XHR object\n\n```\nvar xhr = new\
    \ XMLHttpRequest();\nxr.open(\"GET\",\"test.txt\",true);\nxhr.onreadystatechange=function()\
    \ {\n  if (xhr.readyState==4) {\n    alert(xhr.responseText);\n  }\n}\nxr.send(null);\n\
    ```\n\nAt this point, you might be concerned—if the XHR can make requests just\
    \ like a Web browser, how is to stop a malicious script (perhaps injected via\
    \ XSS) from sending information to, or receiving information from, an attacker's\
    \ site?\n\n# The Ajax Same Origin Policy\n\nThe Origin Policy is a security concept\
    \ applied to a number of client-side technologies, including the XMLHttpRequest\
    \ object. In short, the policy allows an XHR instance created via a page loaded\
    \ from a site to only access resources on the same site.\n\nFor example, if JavaScript\
    \ were included in http://www.wrox.com/example.html, it would be able to use the\
    \ XHR to access resources from www.wrox.com, but not send requests or receive\
    \ information from microsoft.com. The origin of a page is calculated from the\
    \ domain name, the application protocol, and (for most browsers) the port on which\
    \ the application is hosted. If (and only if) all the factors are identical the\
    \ origin is considered the same. Table 12-1 lists the outcome of origin checks\
    \ for a page hosted at http://www.wrox.com/example.html.\n\n# TABLE 12-4: Origin\
    \ Comparisons for a Page Hosted at http://www.wrox.com/example.html\n\n| COMPARED\
    \ URL | SAME ORIGIN | REASONING |\n|---|---|--|\n| http://www.wrox.com/s/example.html\
    \ | Yes | Identical protocol, host, and port number. |\n| http://www.wrox.com/s2/test.html\
    \ | Yes | Identical protocol, host, and port number. |\n| https://www.wrox.com:81/example.html\
    \ | No | The protocol is different. |\n| http://www.wrox.com/example.html | No\
    \ | The port number is different. |\n| http://www.wrox2.com/s/example.html | No\
    \ | The host is different. |\n| http://www.wrox.com/s/example.html | No | The\
    \ host is different. |"
