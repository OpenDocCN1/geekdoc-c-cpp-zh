    generally be encrypted against an X509 certificate, so only the relying party
    can decrypt the token. But if you are just setting up a site, it''s unlikely you
    have a suitable certificate. Leave the No Encryption selected and click Next.


    +   7. You will be presented with a list of claims that the STS can deliver. This
    screen is informational, so click Next to be presented with the final summary,
    and then click Finish.


    +   8. Now run your application. This time, you will not see the login screen
    delivered by the application. Instead, your browser will be redirected to the
    login screen for StarterSTS. If you log in using StarterSTS account, you will
    see that StarterSTS has performed the authentication and sent the identity information
    to your claims-aware Web site, which has been parsed and turned into a claims
    identity, any roles defined within StarterSTS that the user is a member of.


    The claims identity can be treated as you would of identity, or a Windows identity.
    You can use the normal ASP.NET authorization configurations detailed in Chapter
    7 to grant (or limit) access to your application based on the username or roles
    sent by StarterSTS. You now have a federated identity solution!


    # Accepting Information Cards


    Windows has another method of transporting federated identity that does not use
    browser redirection or federated partnerships — Windows CardSpace. CardSpace is
    an identity selector, a piece of software that sits between the user and the relying
    party, allowing the user to select identity or he she wants to, and requesting
    and forwarding the identity information to relying party.'
