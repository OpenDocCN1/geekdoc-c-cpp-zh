  md: "# 394 | CHAPTER 16 SECURE DEVELOPMENT WITH THE ASP.NET MVC FRAMEWORK\n\n```\n\
    % if User.Identity.IsAuthenticated %>\n<p><%= User.Identity.Name %></p>\n<% end\
    \ %>\n```\n\nA model could restrict a user's identity in its actions, as shown\
    \ here:\n\n```\npublic ActionResult Edit(int id)\n{\n    BoardPost post = boardRepository.GetPost(id);\n\
    \    if (BoardPost.Owner != User.Identity.Name)\n    {\n        return View(\"\
    BadOwner\");\n    }\n\n    Return View(post);\n}\n```\n\nBe aware that embedding\
    \ calls to the User instance and indeed, anything that relies on the current HttpContext,\
    \ makes testing your controller more difficult. Instead, you can use an ActionFilter\
    \ to access the context, and add the username as a parameter to your action, which\
    \ will reduce the need to mock an HttpContext (a challenge in the best of times).\
    \ Listing 16-2 shows the code for such a filter, and an example of its use:\n\n\
    +   LISTING 16: Parameterizing user information with an ActionFilter\n\n```\n\
    [Authorize]\n[UserName]\npublic ActionResult Edit(string userName, int id)\n{\n\
    public class UserNameFilter : ActionFilterAttribute\n{\n    const string parameterName\
    \ = \"userName\";\n    public override void OnActionExecuting(ActionExecutingContext\
    \ filterContext)\n    {\n        if (filterContext.Action.Parameters.ContainsKey(parameterName))\n\
    \            if (filterContext.HttpContext.User.Identity.IsAuthenticated)\n  \
    \              filterContext.Action.Parameters[parameterName] =\n            \
    \        filterContext.HttpContext.User.Identity.Name;\n    }\n}\n```\n\n# Customizing\
    \ Authorization with an Authorization Filter\n\nWhen a user performs an action\
    \ you may wish to perform extra authorization checks, such as limiting edits to\
    \ a particular IP address. These sorts of checks cannot be expressed using the\
    \ Authorize attribute, and its tempting to embed the logic in your action methods.\
    \ However, authorization is what is called a cross-cutting concern. The code to\
    \ authorize can be applied in"
  merge: -1
  pgno: 396
- img_proc: true
  md: "many places, and really does not belong in the action methods themselves. ASP.NET\
    \ filters provide you with the capability to implement cross-cutting concerns.\n\
    \nASP.NET MVC provides three filters as standard:\n\n+   - Authorize —As you have\
    \ seen, this limits access to a Controller or a Controller action.\n- HandleErrorAllows\
    \ you to implement code that runs when an exception is thrown from an action.\n\
    - OutputCache —This is used to provide output caching in more detail.\n\nWriting\
    \ authorization filters is not a task to be undertaken lightly. If you examine\
    \ the ASP.NET MVC source code, and look at the AuthorizeAttribute class, you will\
    \ see how difficult it is to make an authorization filter work properly with output\
    \ caching. The lack of a base for an authorization filter was a design decision\
    \ made by the MVC development team to underscore this fact.\n\nHowever, there\
    \ may be times when you want to implement your own authorization filter. The following\
    \ code is a simple example of an authorization filter, which stops an action if\
    \ the day of the week is Sunday:\n\n```\n[AttributeUsage(AttributeTargets.Class\
    \ | AttributeTargets.Method, Inherited=true, AllowMultiple=false)]\npublic class\
    \ NoSundayAccess : FilterAttribute, IAuthorizationFilter\n{\n    public void OnAuthorization(AuthorizationContext\
    \ filterContext)\n    {\n        if (DateTime.Now.DayOfWeek == DayOfWeek.Sunday)\n\
    \        {\n            filterContext.Result = new ContentResult {\n         \
    \       Content = \"It's Sunday, get some rest\";\n            };\n        }\n\
    \    }\n    public void OnResult(AuthorizationContext filterContext)\n```\n\n\
    Setting the AuthorizationContext stops the execution of any remaining action filters,\
    \ and execution jumps to ExecuteResult on the result you set within the filter.\
    \ If you apply the [NoSundayAccess] attribute to an action and attempt to access\
    \ it, you will see that, if it's Sunday, a message appears telling you to get\
    \ some rest.\n\n# ERROR HANDLING WITH ASP.NET MVC\n\nIn an ideal world, your exception\
    \ will never occur. But for safety's sake, an exception will occur when you don't\
    \ catch, and the usual ASP.NET error process begins. Obviously, you will need\
    \ to log errors when they reveal attempts. There are two ways to do this: the\
    \ OnException method in Controller, and implementing an exception filter.\n\n\
    Controller.OnError is called when any unhandled exception is thrown from an action.\
    \ To use it, simply override the method in your controller like so:"
  merge: -1
  pgno: 397
- img_proc: true
  md: "```\nprotected override void OnException(OperationContext filterContext)\n\
    {\n    // Log the error somehow then continue\n    // Mark the error as handled\
    \ and switch execution to the error view\n    filterContext.ExceptionHandled =\
    \ true;\n    this.View(\"Error\").ExecuteResult(\n        filterContext.Controller.HttpContext);\n\
    }\n```\n\nIf you forget to mark the exception as handled, your users will see\
    \ the normal ASP.NET error page.\n\nOne drawback of usingController.OnError is\
    \ that the code to handle the exception (via logging or any other method) will\
    \ be into your Controller. But handling exceptions is another example of orthogonal\
    \ concern that will be common to all Controllers.\n\nAs before, with authorization,\
    \ ASP.NET MVC provides you with a filter, IExceptionFilter, to handle errors.\
    \ A HandleError attribute is also provided, which allows you to nominate a view\
    \ to display a particular error occur. For example, the following code will load\
    \ the CustomError view when the productid is empty:\n\n```\n[HandleError(ExceptionType=typeof(ArgumentException),\
    \ View=\"ArgumentError\")\npublic ActionResult ProductListing(string id)\n{\n\
    \    if (String.IsNullOrEmpty(id))\n        throw new ArgumentNullException(\"\
    id\");\n    return View();\n}\n```\n\nIf a null or empty string is passed to this\
    \ action method, an ArgumentNullException is thrown. Because ArgumentNullException\
    \ derives from ArgumentException, it will be handled by the exception filter.\n\
    \nIt is possible to have multiple HandleError attributes on an action method,\
    \ which allows for finer granularity in your error handling. When you add multiple\
    \ exception filters, you should specify the order in which they are evaluated,\
    \ the most specific types first. For example, consider the following snippet:\n\
    \n```\n[HandleError(Order=1, ExceptionType=typeof(ArgumentException), View=\"\
    MissingArgumentError\")\n[HandleError(Order=2, ExceptionType=typeof(ArgumentException),\
    \ View=\"ArgumentError\")\npublic ActionResult ProductListing(string id)\n{\n\
    \    if (String.IsNullOrEmpty(id))\n        throw new ArgumentNullException(\"\
    id\");\n    return View();\n}\n```"
  merge: -1
  pgno: 398
- img_proc: true
  md: 'Here, the first filter is more specific than the second, catching the ArgumentNullException
    and displaying the MissingArgumentueError view. Let''s say you switched the order
    around like so:


    ```

    [HandleError(Order=1

    ```


    Here, the error resulting from a null id parameter would be caught by the first
    filter because ArgumentNullException derives from ArgumentException.


    When a HandleError filter handles an exception, it creates an instance of the
    HandleErrorInfo class, and sets the Model property on the view to rendered. You
    can use this to access information about the error, the name of the action that
    threw the exception, the name of the controller within which the action is contained,
    and the exception itself: The following snippet shows a view that accesses these
    properties:


    # CustomView.cshtml


    ```

    <p>

    Controller: <%= ((HandleErrorInfo)View.Model).ControllerName %>

    </p>

    ```


    ```

    <p>

    Action: <%= ((HandleErrorInfo)View.Model).ActionName %>

    </p>

    ```


    ```

    <p>

    Message: <%= ((HandleErrorInfo)View.Model).Exception.Message %>

    </p>

    ```


    ```

    <p>

    Stack Trace: <%= ((HandleErrorInfo)View.Model).Exception.StackTrace %>

    </p>

    ```


    Because you have the complete exception and information about where the error
    originated, you can add logging code to your error pages in order to help you
    track down problems, and watch for potential attacks.'
