    # Removing ViewState from the Client Page\n\nAnother mechanism to protect ViewState\
    \ is to remove it altogether from the client page. ASP.NET 2.0 introduced the\
    \ PageStatePersister to accomplish this. By default, pages use HiddenFieldPageStatePersister,\
    \ which stores ViewState in a hidden field in the HTML page. However, ASP.NET\
    \ also uses SessionPageStatePersister, which places ViewState within session state.\
    \ To switch to the persistence mechanism that a page uses, you override the PageStatePersister\
    \ property on the page, as shown here:\n\n```\nprotected override PageStatePersister\
    \ PageState {\n  get\n  {\n    return new SessionPageStatePersister(this);\n \
    \ }\n}\n```\n\nIf you add this property declaration to your HTML page produces,\
    \ you may wonder why the ViewState hidden field still appears. If you use the\
    \ ViewDecoder utility, you will see that the ViewState in your page no longer\
    \ holds keys and values, but rather a reference to the SessionPageStatePersister\
    \ to retrieve the values from its memory.\n\nYou can configure SessionPageStatePersister\
    \ on a per-page basis, or within a common base class for all pages. By default,\
    \ SessionPageStatePersister keeps saved ViewStates for a session. If the maximum\
    \ number is reached, the oldest ViewState is discarded. This limits the maximum\
    \ number of windows that users can open in your application. You can increase\
    \ the number of ViewStates saved within the sessionState configuration element.\
    \ However, this obviously will affect the available memory on your Web server.\n\
