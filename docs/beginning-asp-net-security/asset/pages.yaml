  md: "# Using the Windows DPAPI\n\nIf all that seems like too much hard work, you\
    \ can let Windows take care of key management for you. The Windows Data Protection\
    \ API DPAPI is a core system service provided by Windows that is managed by the\
    \ most secure process in the operating system: the Local Security Authority (LSA).\
    \ DPAPI is accessed using the ProtectedData class in the System.Security.Cryptography\
    \ namespace provides key management and symmetric encryption. To encrypt data,\
    \ you call the Protect method, and to decrypt, you call the Unprotect method.\
    \ Each of these methods takes a byte array of data to be worked on, an optional\
    \ byte array of Entropy that acts as an additional key (and so, if used, must\
    \ be cryptographically random and stored for decryption), and a scope. Like certificate\
    \ services, DPAPI has the concept of machine and user stores - the scope parameter\
    \ defines from which a key should be retrieved. The optional Entropy parameter\
    \ is used to further partition data within the store, allowing programs that share\
    \ the same DPAPI key to isolate their data from each other\n\nFor IIS6, you should\
    \ use the LocalMachine scope. IIS allows the use of the CurrentUser scope if you\
    \ configure an application pool to load the user profile. This is more secure\
    \ because you can specify different application pools and for servers running\
    \ multiple Web sites, isolating the encryption and decryption keys between pools.\n\
    \nThe following snippet shows functions to encrypt and decrypt using DPAPI:\n\n\
    ```\n// This is an example of entropy. In a real application\n// it should be\
    \ a cryptographically secure array of random data.\nprivate byte[] entropy = (1,\
    \ 3, 5, 7, 9, 11, 15, 17, 19);\n\nstatic byte[] EncryptUsingDPAPI(byte[] clearText)\n\
    {\n    return ProtectedData.Protect(\n    clearText,\n    entropy,\n    DataProtectionScope.LocalMachine);\n\
    }\n\nstatic byte[] DecryptUsingDPAPI(byte[] encryptedText)\n{\n    return ProtectedData.Unprotect(\n\
    \    encryptedText,\n    entropy,\n    DataProtectionScope.LocalMachine);\n}\n\
    ```\n\nAs you can see, you do not need to specify keys or algorithms. DPAPI takes\
    \ care of that for you.\n\n> WARNING Be sure to back up your operating system\
    \ and the DPAPI key store on a regular basis so that you can recover in the event\
    \ of a hardware failure or other occurrence that necessitates a reinstall of the\
    \ operating system."
  merge: -1
