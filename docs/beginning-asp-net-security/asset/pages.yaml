  md: 'If you already have existing users who may wish to attach a third-party identifier
    such as an OpenID to their accounts, then you must do a little extra work by creating
    a database table in your membership database. The ASP.NET profile system is not
    suitable because you cannot easily search through profile fields for members looking
    for a value such as their OpenID.


    How do you think this is dependent on the exact configuration of your membership
    database. For example, the default ASP.NET membership provider uses a GUID to
    identify a user. You could create a table containing the membership ID of a user
    and the third-party identifier, with appropriate stored procedures to attach,
    remove, and look up it. During login, if a user authenticates with a third-party
    system, you can then retrieve the membership ID for that identifier, and use RedirectFromLoginPage
    to create the correct forms authentication token.


    If you encounter problems with Live ID, the processing code does log error messages
    to the Debug Window. You can either step into the processing code to try to debug
    your problems, or view these messages using DebugView from the SysInternals site
    on Microsoft.com, http://technetmicrosoft.com/en-us/sysinternals/.


    # SUMMARY


    Third-party authentication systems are currently useful as a secondary login method;
    it''s a brave or specialized Web site which will rely on them alone. They are,
    however, becoming more common, with OpenID used for blog comments and authentication
    for sites like Stack Overflow. Claims-based authentication via Information Cards
    and WS-Federation are starting to spread into corporate environments and is Microsoft''s
    identity strategy for the cloud.


    Any application which uses them will also need testing in a staging environment
    where your application is running on an Internet-facing server with many third
    parties as you can muster — if you''re using OpenID check with multiple OpenID
    providers, if you are using Geneva test with all your federation parties. Also
    consider that your production environment (perhaps your staging server) will require
    an SSL certificate to reassure your users or to comply with the requirements of
    a third party you wish to use.'
