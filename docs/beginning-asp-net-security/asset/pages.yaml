  md: 'The obvious mitigation to a URL-based attack like this would be to switch to
    HTML forms. Using forms would be obeying the HTML specification — a URL-driven
    (GET) request should not change state. RFC2616 (the HTTP 1.1 specification) stands
    in sections 9.1.2 the GET and HEAD HTTP methods should not have the significance
    of taking an action other than retrieval. Each GET request should be idempotent
    — that is, every request should return the same result.


    You may be aware, that during an HTTP request, a header called REFERER may contain
    the URL of the previous page in the browser history. This header can be used to
    check if a form was submitted from a page on the same Web site, except that some
    browsers and Internet privacy software strip this header. So what can you do to
    ward off CSRF attacks?


    # MitigatingAgainstCSR


    For a CSRF attack to work, the following conditions must be met


    +   - The attacker must have knowledge of sites on which the victim is currently
    authenticated. These sites may be Internet sites or intranet applications.

    - The target site must use ambient authority, where the browser sends authentication
    credentials with each request.

    - The target site must not have secondary authentication for actions, such as
    a requirement to re-enter a password.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'The common mitigation technique against CSRF for ASP.NET sites is use ViewState
    in combination with a ViewStateKey. (See Chapter 5 for more details.) However,
    this presents some disadvantages:


    +   - ViewState must be enabled, which may not always be the case in optimized
    Web sites.


    +   - You must have a way of uniquely identifying users, either by their login
    identity or by-like session identifier.


    +   - The ViewStateKey must be manually set within your code, something that is
    easy to forget.


    If the ViewStateKey does not meet your needs, another method of mitigation is
    to add a token to each form, which is verified when the form is submitted. You
    generate a token for every session, store it in state or in a cookie of the server
    machine, insert the token (or a value generated from it) into each form, and check
    it with every form submission. However, you can automate the process by implementing
    an HTTP Module.


    An HTTP Module (as you may remember from Chapter 2) is an object that sits in
    the ASP.NET pipeline, and can call into the processing of a request or the return
    of a response. To add CSRF protection to every form submission, you should implement
    the following actions:


    +   1. If a request is from a new user (no cookie is sent), generate a unique
    token for that.


    +   2. If the request is a GET request, store the token in a session cookie on
    the user''s browser. (A session cookie is one that is deleted when the user closes
    the browser.)


    +   3. If the request is a POST (or PostBack) and the token is not present, reject
    the request as a potential CSRF attack.


    +   4. If the request is a POST (or PostBack), read the token from the user''s
    browser and compare it to the token embedded in the ASP.NET Web form. If the tokens
    do not match, or the token is missing, reject the request as a potential CSRF
    attack.


    +   5. If the tokens match, allow the response to continue.


    +   6. When the request is completed, before the response is set, examine the
    response to look for an ASP.NET Web form. If one is present, automatically add
    the token (or a value generated from it) into the form as a hidden field.


    You should note that only form submissions are protected. Any pages driven by
    query strings (GET requests) are not protected, as you should obeying the HTML
    specification.


    # TRY OUT Writing an HTTP Module to Protect Against CSRF Attacks


    In this example, you will write an HTTP Module that will perform the various actions
    necessary to protect against a CSRF attack. In doing so, you will not only protect
    your Web application, but will learn how to hook into various stages of the ASP.NET
    pipeline and perform actions automatically without having to add code into your
    pages'' classes.'
  merge: -1
  pgno: 80
