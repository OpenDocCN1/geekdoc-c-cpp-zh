  md: "The ReadXml function uses the handlers you registered earlier in the page lifecycle\
    \ to parse the token. The AuthenticateSecurityToken will validate the token (using\
    \ the IssuerNameRegistry you registered) and convert it into a class that implements\
    \ IClaimsPrincipal, which in turn, implements IPrincipal — the standard way that\
    \ .NET framework treats identity.\n\nIf you don't have an existing authentication\
    \ scheme and wish to use tokens that WIF can understand, you can use the WIF SDK\
    \ to validate the claims and use it as a session authentication mechanism. By\
    \ adding two functions, you can enable this, as shown in Listing 15-1.\n\n# Listing\
    \ 15: Helper functions for WIF session authentication\n\n```\nstatic TimeSpan\
    \ GetSessionLifetime() {\n    TimeSpan lifetime = SessionTokenHandler.DefaultTokenLifetime;\n\
    \    if (FederatedAuthentication.ServiceConfiguration.SecurityHandlers == null)\
    \ {\n        SessionSecurityTokenHandler sth = FederatedAuthentication.ServiceConfiguration.SecurityHandlers[typeof(SessionSecurityToken)]\
    \ as SessionSecurityTokenHandler;\n        if (sth == null) {\n            lifetime\
    \ = ssth.TokenLifetime;\n        }\n    }\n    return lifetime;\n}\n\nstatic void\
    \ CreateLoginSession(IClaimsPrincipal principal, SecurityToken token) {\n    WSFederationAuthenticationModule\
    \ activeModule = new WFederationAuthenticationModule();\n    activeModule.SetPrincipalAndWriteSessionToken(new\
    \ SessionSecurityToken(principal, GetSessionLifetime(), token, true));\n}\n```\n\
    \nGetSessionLifetime gets the default session lifetime, or the lifetime configured\
    \ in your Web site's configuration file. CreateLoginSession sets the identity\
    \ principal for the current user, and writes a session token into a protected\
    \ cookie that is sent to the browser. From that point on, the User property in\
    \ your page will be populated with an identity from the original SAML token sent\
    \ when the user authenticated. The identity can also be used for role-based operations"
