  md: "# Examining the ASP.Net Pipeline\n\nNow that you understand how ASP.NET creates\
    \ a page, only one piece of the jigsaw remains. How does ASP.NET know what a request\
    \ is, and what code to use to serve it? ASP.NET works on a pipeline model. A request\
    \ goes through the ASP.NET pipeline using HTTP Modules, which can examine the\
    \ request and act upon it, rewrite the URL, or even exceptions, stop any further\
    \ progression and return an error to the user. If the request makes it through\
    \ the pipeline's HTTP Modules, it is passed to an HTTP Handler, which processes\
    \ the request and creates the response. The handler is based on the file extension\
    \ of the request. When a handler is installed, it is configured as an endpoint\
    \ for one or more file extensions.\n\nIIS 6 and IIS 7 have different pipelines.\
    \ The handler ASP.NET routes requests to based on the file extension contained\
    \ in the web. aspx files are passed to the System.Web.Ui.PageHandler.svc files\
    \ are routed to System.ServiceModel.Activation.Handler, and so on. IIS 6 and IIS\
    \ 7 have different pipelines. IIS 6 only routes requests as Cross Test module,\
    \ where all requests are mapped to the ASP.NET ISAPI handler, while IIS 7 introduced\
    \ an integrated pipeline where all requests pass through the ASP.NET pipeline\
    \ and can be examined by HTTP Modules.\n\nHandlers and modules are registered\
    \ in the web.config file for a machine or Web site. If you examine the C:\\Windows\\\
    .NET\\Framework\\v2.0.50727 directory, you can see the default handlers and modules\
    \ in the httpHandlers and httpModules sections. If not, then you can add it to\
    \ the .NET framework web.config file. If you want to register a new handler on\
