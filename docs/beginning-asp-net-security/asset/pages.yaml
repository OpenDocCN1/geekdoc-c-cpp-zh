  md: "allowing you to present a custom error page to your users. Often, you want\
    \ to present different error\npages, depending on the errors shown. For example,\
    \ the following configuration would redirect\nPage Not Found errors to NotFound.aspx:\n\
    \n```\n<system.web>\n<customErrors mode=\"On\">\n    defaultRedirect=\"~/error.aspx\"\
    >\n    <error statusCode=\"404\"\n      redirect=\"~/notfound.aspx\" />\n  </customErrors>\n\
    </system.web>\n```\n\nThis is a simple approach to message errors, but it has\
    \ the following two downsides:\n\n+   - The Client browser is forwarded to the\
    \ error page via a 302 Object Moved HTTP response code. This is easily detected\
    \ by scanning tools that will often flag this as a potential error condition.\n\
    - The conditions that lead to the error cannot be easily accessed, so you have\
    \ no record of what caused the application error, which leaves errors undiscovered.\n\
    \nOften, developers need to debug errors on a live Web server by turning on error\
    \ messages\n that they can view them from their remote workstations. However,\
    \ there is no way to limit the\nfull error page to particular machines, and switching\
    \ on the full error page means anyone who\ncauses an error to occur will see a\
    \ page like that shown in Figure 5-2.\n\n> NOTE OWASP refers to the vulnerabilities\
    \ such as these as improper error\nhanding, which is a type of information leakage.\n\
    \n# Improving Your Error Handling\n\nASP.NET provides error events you can respond\
    \ to at both a page level (Page_Error) and\napplication level (Application_Error).\
    \ By intercepting errors via the error events, you can discover\ninformation about\
    \ the error itself by accessing Server.GetLastError (which returns the last\n\
