- img_proc: true
  md: '# 236 | CHAPTER 10 SECURING XML


    entered an apostrophe as the username, and your Web site was configured to show
    full error information, the screen shown in Figure 10-2 would appear.


    ![](img/c28a05c0528daad8a392659cd26abcda_241_0.png)


    FIGURE 10-2: An error screen after entering an apostrophe as a user name


    With such information, a username of `'' or string-length(/UserName[position()=1])=4]/child:node[position()=1]=4
    or` would change the query to ask the application if the length of the first username
    was 4. If the answer were true, the application would react if a proper login
    had taken place.


    This sort of attack can be easily automated until the username and length of all
    fields is discovered. "Blind XPath Injection", a paper by Amit Klein (available
    from http://www.modsecurity.org/archive/blind-xpath-injection.pdf) details how
    an attacker can build up details of a search and gradually extract the full XML
    from a document.


    # Avoiding XPath Injection


    Just like SQL injection, XPath injection can be avoided by compiling a parameterized
    XPath expression and passing user input as a parameter value. This has the added
    bonus of enabling you to reuse a precompiled XPath expression, saving CPU cycles.'
  merge: -1
  pgno: 241
- img_proc: true
  md: "# Securing XML Documents\n\nThe .NET framework provides support for parameterized\
    \ expressions via the XsltContext class. This class acts as a wrapper around the\
    \ XSLT processor used by XPath, and programmatically allows you to replace parameter\
    \ markers with their values as the expression is parsed. This approach, while\
    \ possible, is a lot of hard work and is poorly documented. Daniel Cazzolino (an\
    \ XML MVP) has released mvp.xml, an Open Source library from http://mvpxml.codeplex.com/\
    \ that makes parameterized queries easier to utilize.\n\nFor example, using the\
    \ previous username and password, you can change it to become parameterized like:\n\
    \n```\nstring xPath = \"//Account[Username/text()=$username] + \n and * \n[Password/text()=$password]\"\
    ;\n\n// This could be performed in a constructor to avoid\n// the CPU hit needed\
    \ each time an expression is compiled.\nXPathNavigator navigator = xmlDocument.CreateNavigator();\n\
    XPathExpression expression = DynamicContext.Compile(xPath);\n```\n\n```\nDynamicContext\
    \ ctx = new DynamicContext();\nctx.AddVariable(\"username\", username);\nctx.AddVariable(\"\
    password\", password);\nexpression.SetContext(ctx);\n```\n\n```\nstring account\
    \ = \nConvert.ToString(navigator.Evaluate(expression));\n```\n\nYou can see that,\
    \ by not compiling the expression through the XPathNavigator class, it is instead\
    \ compiled through the DynamicContext class, found in the Mvp.Xml.Common namespace.\
    \ The XPath expression contains parameters, indicated by a sign. $username is\
    \ a parameter named username. When you use the expression, you create a new instance\
    \ of DynamicContext, add the parameters to it, and finally, execute the navigation\
    \ methods you want to use on the XPathNavigator.\n\n> WARNING Remember that you\
    \ should treat XML as untrusted input at all times. If you are using data extracted\
    \ from it on your Web page, then you should encode it correctly (as detailed in\
    \ Chapter 3) to avoid Cross Site Scripting (XSS) attacks.\n\n# SECURING XML DOCUMENTS\n\
    \nXML has its own standard for encryption and signing. The encryption standard\
    \ (MLEnc) specifies how a document should be encrypted, and how the encryption\
    \ keys are exchanged. It is published at http://www.w3.org/TR/xmlenc-core/. The\
    \ standard for signing XML (XMLDSig) can be found at http://www.w3.org/TR/xmldig-core/."
  merge: -1
  pgno: 242
- img_proc: true
  md: "You may recall from Chapter 6 that encryption allows you to hide the contents\
    \ of a document (or elements within a document) so that only a receiver with suitable\
    \ keys can decrypt it. XML can be signed with X509 certificates or an asymmetric\
    \ key, and can be encrypted with X509 certificates, a shared key, or an asymmetric\
    \ key. However, encryption does not prove an XML document has not changed, nor\
    \ who encrypted it – the addition of a digital signature provides this. If you\
    \ haven't already read Chapter 6 and are unsure about cryptography, you should\
    \ read it before continuing with this section.\n\nThe same guidelines that apply\
    \ to cryptographic systems in general apply to XML encryption, including the selection\
    \ of key lengths, algorithms, and the situations suitable to them. These rules\
    \ are covered in Chapter 6. (If you have not read that chapter yet, now would\
    \ be a good time to do so.)\n\n# Encrypting XML Documents\n\nWhen XML is encrypted,\
    \ the entire document may be encrypted, or encryption may only be applied to particular\
    \ elements. In addition to the encrypted XML, an XMLEnc document will also contain\
    \ information on the encryption algorithm used when the document was encrypted,\
    \ as well as references to the encryption keys used.\n\nThe classes for XML cryptographic\
    \ functions are found in the System.Security.Cryptography namespace, which is\
    \ part of the System.Security assembly.\n\n# Using a Symmetric Encryption Key\
    \ with XML\n\nWhen you use a symmetric algorithm (such as AES) you must use the\
    \ same key to encrypt and decrypt the data, and both parties must agree on the\
    \ key and the algorithm. Generally, this is suitable when a single application\
    \ must encrypt and decrypt data.\n\nListing 10: Encrypting XML using a symmetric\
    \ key takes a document, to encrypt, and a populated instance of a symmetric algorithm.\n\
    \n> LISTING 10: Encrypting XML using a symmetric key\n\n```\npublic static void\
    \ Encrypt(XmlDocument document,\n    string elementNameToEncrypt,\n    SymmetricAlgorithm\
    \ algorithm)\n{\n    // Check the arguments.\n    if (document == null)\n    \
    \    throw new ArgumentNullException(\"document\");\n    if (elementNameToEncrypt\
    \ == null)\n        throw new ArgumentNullException(\"elementNameToEncrypt\");\n\
    \    if (algorithm == null)\n        throw new ArgumentNullException(\"key\");\n\
    \n    // Extract the element to encrypt.\n    XmlElement elementToEncrypt =\n\
    \        document.GetElementsByTagName(elementNameToEncrypt)[0]\n        as XmlElement;\n\
    ```"
  merge: -1
  pgno: 243
- img_proc: true
  md: "```\nif (elementToEncrypt == null)\n    throw new XmlException(\n        \"\
    The specified element was not found\");\n\n// Encrypt the xml element\nEncryptedXml\
    \ xXml = new EncryptedXml();\nbyte[] encryptedElement =\n    xXml.EncryptData(elementToEncrypt,\n\
    \        algorithm, false);\n\n// Now build a representation of the encrypted\
    \ data.\nEncryptedData encryptedData =\n    new EncryptedData(\n    {\n      \
    \  Type = EncryptedXml.XmlEncElementName\n    });\nn// Work out the algorithm\
    \ used so we can embed it\n// into the document.\nstring encryptionMethod = null;\n\
    if (algorithm is TripleDES)\n    encryptionMethod = EncryptedXml.XmlEncTripleDESUrl;\n\
    else if (algorithm is DES)\n    encryptionMethod = EncryptedXml.XmlEncDESUrl;\n\
    if (algorithm is Rijndael)\n{\n    switch (algorithm.KeySize)\n    {\n       \
    \ case 128:\n            encryptionMethod = EncryptedXml.XmlEncAES128Url;\n  \
    \          break;\n        case 192:\n            encryptionMethod = EncryptedXml.XmlEncAES192Url;\n\
    \            break;\n        case 256:\n            encryptionMethod = EncryptedXml.XmlEncAES256Url;\n\
    \            break;\n    }\n}\nelelse{\n    // Throw an exception if the transform\n\
    \    // is not in the previous categories\n    throw new CryptographicException(\n\
    \        \"Specified algorithm is not supported\");\n}\n\nncryptedData.EncryptionMethod\
    \ =\n    new EncryptionMethod(encryptionMethod);\n\n// Add the encrypted element\
    \ data to the\n// EncryptedData object.\nencryptedData.CipherData.CipherValue\
    \ = encryptedElement;\n```"
