  md: 'Once a service is marked to use ASP.NET compatibility, it can make use of the
    authentication provided by ASP.NET''s membership provider and the authorization
    provided by the roles provider. The current user identity and roles will flow
    through your Ajax or Silverlight Web services. This allows you to authorize the
    Web service calls using PrincipalPermission demands (covered in Chapter 11), or
    by accessing the HttpContext.User.Identity object within your service methods.


    # A CHECKLIST FOR SECURING AJAX AND SILVERLIGHT


    The following is a checklist of items to consider when wiring Ajax or Silverlight
    services:


    +   - Both Ajax and Silverlight are constrained by crossdomain policies — Ajax
    can only communicate with services and resources on the same domain. Silverlight
    can access external resources if the external Web site allows it.


    +   - The UpdatePanel could be considered more secure than ScriptManager — UpdatePanel
    hides implementation, reduces the attack surface, and is easier to implement than
    ScriptManager services, however, ScriptManager services are more scalable.


    +   - You can opt to the ASP.NET security model. — This enables you to use the
    authentication token created by the ASP.NET login process to authenticate and
    authorize access to your Web services.


    +   - The Silverlight security model has restrictions — The Silverlight security
    model restricts the classes you can inherit from, as well as the methods you can
    implement or override.


    +   - Silverlight Isolated storage is discoverable by users — Do not use isolated
    storage to save sensitive information.


    +   - All Silverlight cryptography functions need initial values — You cannot
    store keys, hashes, or initialization vectors (IVs) securely on the local machine.
    Use a Web service in conjunction with the ASP.NET membership functions to store
    cryptographic keys on your server.'
  merge: -1
