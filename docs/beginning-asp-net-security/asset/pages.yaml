  md: "# TRY OUT Writing an HTTP Module\n\nIn this exercise, you will write a simple\
    \ HTTP Module that adds a timestamp to the top of every request made to an ASP.NET\
    \ Web page.\n\nAn HTTP Module is a class that implements IHttpModule. This interface\
    \ has two methods: public void Init(HttpContext context) and public void Dispose().\n\
    \n+   1. In Visual Studio, create a new Web Application Project by choosing New\
    \ -> Project, and choosing ASP.NET Web Application in the New Project dialog.\
    \ Name the project SimpleHttpModule.\n\n+   2. Right-click the project in Solution\
    \ Explorer and select Add -> Class. Name your class TimestampModule.cs. Replace\
    \ the default class with the following skeleton implementation:\n\n```\nusing\
    \ System;\nusing System.Web;\n\nnamespace SimpleTimestampModule\n{\n    public\
    \ class TimestampModule : IHttpModule\n    {\n        public void Dispose()\n\
    \        {\n        }\n\n        public void Init(HttpContext application)\n \
    \       {\n        }\n    }\n}\n```\n\n+   3. Within the Init method, you can\
    \ examine the Request via the context parameter, including adding events to be\
    \ fired when a request begins and a request ends. So let's add an event to the\
    \ module to be fired when a request adds a timestamp to the output. Add the following\
    \ methods to the class:\n\n```\nvoid OnEndRequest(object sender, EventArgs args)\n\
    {\n    HttpContext.Current.Response.Write(\n        \"<p> Served at \" + DateTime.Now\
    \ + \"</p>\");\n}\n```\n\n+   4. Finally, you must write out the events within\
    \ the Init method of the module, so add the following lines to the Init method:\n\
    \n```\npublic void Init(HttpContext application)\n{\n    context.OnEndRequest\
    \ += OnEndRequest;\n}\n```"
