  md: '# 324 CHAPTER 13 UNDERSTANDING CODE ACCESS SECURITY


    # Using the Global Assembly Cache to Run Code Under Full Trust


    Every machine with the .NET framework installed on it has a Global Assembly Cache
    (GAC), a machine-wide store of assemblies designated to be shared between multiple
    applications, such as the .NET framework assemblies. An assembly loaded from the
    GAC runs under Full Trust, even if the assembly is not hosted in a Full Trust
    environment.


    What does this mean for you? A problem with Medium Trust is a lot of Web applications
    these days want to talk to other Web applications on other Web sites, but Medium
    Trust restricts this. You can extract your security-sensitive code to a separate,
    well-tested assembly, and install it into the GAC, where it runs under Full Trust
    and, thus, be allowed to make connections. Separation of code is much simpler
    when logically distinct functionality such as data-access code is isolated in
    a separate assembly.


    To put an assembly into the GAC, you must first give it a strong name. Strong
    naming involves signing the assembly with a cryptographic key. The cryptographic
    signature, combined with the assembly version, prevents components from clashing
    if they have the same name, and allows consuming applications to ensure they are
    using the correct assembly.


    To strong-name an assembly, you must first generate a strong key. From the Start
    menu, open the Visual Studio command prompt from the Visual Studio Tools and enter
    the following command:


    ```

    sn -k ":[DirectoryToKeyFile]\[AssemblyNameName].snk"

    ```


    Once you have generated your key file, you must associate it with an assembly.
    In Visual Studio''s Solution Explorer, right-click on the project to strong-name
    and choose Properties. Select the Signing tab and check "Sign the Assembly" checkbox.
    Browse and select your key file. Your key file will be added to your assembly.
    From now on, your assembly will be strong-named.


    You can test this by compiling and then using the following command:


    ```

    sn -v "assemblyName.dll"

    ```


    If all is well, you will see a message saying your assembly is valid. Once you
    have a strongly named assembly, you can place it into the GAC in one of the three
    ways:


    +   Use installer software such as InstallShield, Wix, or Advanced Installer to
    install a package for that application installs the assembly into the GAC.


    +   Use Explorer by navigating to:\Windows\Assembly and dragging and dropping
    your strongly named assembly to the GAC.


    +   Use the gacutil.exe utility to install your assembly with the command gacutil
    -I C:\[Path]\[AssemblyNameName].dll


    > WARNING The gacutil.exe utility is only available with Visual Studio and the
    .NET Framework SDK. It is not available to end users, and must be run from an
    elevated command prompt.'
