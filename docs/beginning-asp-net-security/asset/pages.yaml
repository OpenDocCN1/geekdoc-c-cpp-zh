  md: '3. ASP.NET creates a new Page object and re-creates the controls, using the
    __VIEWSTATE field to set the objects back to the state they were when the page
    was last sent to the client, and runs the page initialization event.


    4. If the __EVENTTARGET and __EVENTARGUMENT fields are set, ASP.NET uses the __EVENTVALIDATION
    field to check if the event is valid. (For example, if a hacker fooled an event
    from a hidden or disabled control, an exception would occur.) ASP.NET then uses
    the __EVENTTARGET and __EVENTARGUMENT fields to decide which server-side event
    to fire, and raises it. Within the event code on the server, the page is modified
    in some way (such as calculating a new price, or retrieving information from a
    database).


    5. Finally, the modified page is rendered to HTML and sent to the client. The
    Page object (and its members) is released from memory. After PostBack, the process
    starts again at Step 2.


    If you are interested in the __EVENTVALIDATION and __VIEWSTATE fields, they are
    covered in Chapters 4 and 5. During the life, many events are fired to construct
    the page, recreate the contents from ViewState, and eventually render the page.
    If you want to see the main events in a page life cycle, you can turn tracing
    on a page by setting Trace="true" to the page declaration, as shown here:


    +   * Page Language="C#" Trace="true" %


    When you turn tracing, debugging information is added to every page. Figure 2-8
    shows sample event information from a trace. You can see the postback handlers
    after a page has loaded. Never leave Trace on a production Web site, because it
    might give away information to an attacker.


    ![](img/c28a05c0528daad8a392659cd26abcda_42_0.png)


    FIGURE 28: Event trace data'
