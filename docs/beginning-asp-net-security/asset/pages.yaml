  md: "Finally, you need another certificate for the client software that will be\
    \ used to sign the encrypted data so that the server knows the origin of the message\
    \ and that the message has not been changed or corrupted since it was. This needs\
    \ one final foray to makecert, this time replacing myname with your name, and\
    \ replacing any spaces with underscores (for example \"Barry-Dorrans\" will become\
    \ Barry__Dorrans)\n\n```\nmakecert -pe n \"CN=typename\" -ss my -er LocalMachine\
    \ -\n-a shail sky exchange -eku 1.2.3.6.1.5.7.3.1\n-in \"Development Root Authority\"\
    \ -is MY -er LocalMachine\n-sp \"Microsoft RSA Schannel Cryptographic Provider\"\
    \ -\n-sy 12 \"myname.cer\"\n```\n\nNow you have two certificates — one you can\
    \ use to encrypt and decrypt, and the other for signing and validating the message\
    \ authenticity.\n\nYou may be confused as to why you are using two certificates,\
    \ one to encrypt and one to sign. Remember that with certificates and asymmetric\
    \ algorithms, you must keep the private key secret. When you are encrypting data\
    \ for a server, which only needs the server's public key. However, when you sign\
    \ the message, you are using your own certificate, the client certificate, and\
    \ that requires the private key. By signing with a specific certificate held only\
    \ by you, the server can be sure of the signature origin, because only you hold\
    \ that certificate. If you used the same key to encrypt and sign, this proof does\
    \ not occur.\n\n# Putting it All Together\n\nListing 6-2 shows a piece of sample\
    \ code that wraps a piece of clear text into a CMS envelope, signs it using a\
    \ local certificate with a subject name of Barry_Dorrans, and then encrypts it\
    \ against a public key certificate loaded from a file, myserver.cer. The data\
    \ is then decrypted, the CMS envelope is recreated, and the signatures are checked.\
    \ A list of the certificate subject names is created, and finally, the clear text\
    \ is returned for further processing.\n\n# LISTING 6: Signing, Encrypting, Unencrypting,\
    \ and Verifying Signatures\n\n```\n// Create an UTF8 encoding class to parse strings\n\
    // from and to byte arrays\nUTF8Encoding encoding = new UTF8Encoding();\n\n//\
    \ Setup the sample text to encrypt and\n// convert it to a byte array.\nstring\
