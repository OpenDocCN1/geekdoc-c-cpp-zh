- img_proc: true
  md: "# LISTING 10-1 (continued)\n\n```\n// Replace the original element with the\
    \ encrypted data\n// and algorithm information\nEncryptedXml.ReplaceElement(\n\
    elementToEncrypt, encryptedData, false);\n)\n```\n\nThe code searches the XML\
    \ document for the specified element, extracting it into an XmlElement object.\
    \ This is then encrypted by the EncryptedData method of the EncryptedXml class.\
    \ In this part, you now have the encrypted data, but this must be correctly formatted\
    \ before it can be used.\n\nThe EncryptedData class is used to encapsulate everything\
    \ needed to create a correctly formatted encrypted element, and an instance of\
    \ this is created. The EncryptionMethod property is set to indicate the algorithm\
    \ used, and the encrypted data is added to the CipherValue property of the CipherData\
    \ class. Finally, the ReplaceElement method of the EncryptedXml class is used\
    \ to replace the clear text in the original document with the correctly formatted\
    \ encrypted element.\n\nNow, let you say the sample document in Listing 10-2.\n\
    \n# LISTING 10-2: A sample document for encryption\n\n```\n<xml version=\"1.0\"\
    \ encoding=\"utf-8\" ?>\n<envelope>\n<to>barryd@idunno.org</to>\n<from>yourbank@bank.com</from>\n\
    <message>You have just paid.</message>\n</envelope>\n```\n\nYou could could then\
    \ encrypt the message element using the following snippet:\n\n```\nXmlDocument\
    \ document = new XmlDocument\n{\n  PreserveWhitespace = true\n};\n// Load the\
    \ document and then continue.\nRijndelaManaged algorithm = new RijndelaManaged();\n\
    Encrypt(document, \"message\", algorithm);\n```\n\nYou may remember from Chapter\
    \ 6 that creating a new instance of a symmetric algorithm class will create encryption\
    \ keys automatically, this example does not set any keys. In production, you would\
    \ load the keys from a secure store, or save the encryption keys securely after\
    \ you have used them. The encrypted XML would look like this (the CipherValue\
    \ element has been truncated for example of publishing):\n\n```\n<xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<envelope>\n<to>barryd@idunno.org</to>\n<from>yourbank@bank.com</from>\n\
    ```"
  merge: -1
  pgno: 245
- img_proc: true
  md: "# Securing XML Documents\n\n```\n<EncryptedData\nType=\"http://www.w3.org/2001/04/xmlenc#Element\"\
    \nxmlns=\"http://www.w3.org/2001/04/xmlenc#\">\n<EncryptionMethod\nAlgorithm=\"\
    http://www.w3.org/2001/04/xmlenc#aes256-cbc\" />\n<CipherData>\n  <CipherValue>p1D/....FIT2Q==</CipherValue>\n\
    </CipherData>\n</EncryptedData>\n</envelope>\n```\n\nYou can see that the message\
    \ element has been replaced with an EncryptedData element that contains the CipherData\
    \ element, as well as information on the method used (the EncryptionMethod element).\
    \ If the receiving party shares the key and IV, this is enough information to\
    \ decrypt the message.\n\nTo decrypt the data, you would use a method like the\
    \ one shown in Listing 10-3. Remember that with symmetric algorithms, you use\
    \ the same key and IV to decrypt encrypted data.\n\n# LISTING 10: Decrypting XML\
    \ using a symmetric key\n\n```\npublic static void Decrypt(XmlDocument xmlDocument,\
    \ SymmetricAlgorithm algorithm)\n{\n  // Check the arguments.\n  if (xmlDocument\
    \ == null)\n    throw new ArgumentNullException(\"xmlDocument\");\n  if (algorithm\
    \ == null)\n    throw new ArgumentNullException(\"key\");\n\n  // Find the EncryptedData\
    \ element in the XmlDocument.\n  XmlElement encryptedElement =\n    xmlDocument.GetElementsByTagName(\"\
    EncryptedData\")[0] as XmlElement;\n\n  // If the EncryptedData element was not\
    \ found,\n  if (encryptedElement == null)\n    throw new XmlException(\"No encrypted\
    \ element was found.\");\n\n  // Create an EncryptedData object and populate it.\n\
    \  EncryptedData encryptedData = new EncryptedData();\n  encryptedData.LoadXml(encryptedElement);\n\
    \n  // Create a new EncryptedXml object.\n  EncryptedXml encryptedXml = new EncryptedXml();\n\
    \n  // Decrypt the element using the symmetric algorithm.\n  byte[] rgbOutput\
    \ =\n    encryptedXml.DecryptData(encryptedData, algorithm);\n```\n\ncontinues"
