  md: "# # Making Static Files Secure\n\nAnother problem exists with the sample as\
    \ it stands — the files are stored underneath the Web root and can be directly\
    \ accessed by their filename (for example, through http://localhost/documents/example1.txt).\n\
    \nFor added security, if you have full control of the Web server hosting, you\
    \ can place files you serve via code in a directory outside of the Web root, as\
    \ shown in Figure 9-2. This means that you are not relying on the special configuration\
    \ of App_Data, which could be removed accidentally by an administrator editing\
    \ the global web.config file.\n\nBy moving files out of the Web root, you can\
    \ no longer use Server.MapPath. You must specify the full path to your files when\
    \ you create the filename. The code you just written would be the following:\n\
    \n```\nusing System;\nusing System.IO;\n```\n\n```\npublic partial class getfile\
    \ : System.Web.UI.Page\n{\n    protected void Page_Load(object sender, EventArgs\
    \ e)\n    {\n        Response.Clear();\n        string filename = Path.GetFileName(Request.QueryString[\"\
    filename\"]);\n        FileInfo file = new FileInfo(\n        Server.MapPath(Path.Combine(\"\
    c:\\inetetpub\\documents\\\", filename)));\n        Response.AddHeader(\"Content-Length\"\
    , file.Length.ToString());\n        Response.WriteFile(file.FileName);\n     \
    \   Response.End();\n    }\n}\n```\n\nFor added security, in case all your measures\
    \ to prevent traversal fault (or a new vulnerability is discovered in IIS or ASP.NET),\
    \ you should host your Web applications on your operating system, and preferably\
    \ on a drive separate dedicated to your application.\n\nIf you move your files\
    \ outside of your Web root or onto another drive, you must ensure that the process\
    \ under which ASP.NET runs has access to them. Remember that the account your\
    \ application runs under is defined by the application pool (or by impersonation\
    \ settings). To check\n\n![](img/c28a05c0528daad8a392659cd26abcda_218_0.png)\n\
    \nFigure 9-2: A suitable directory structure for serving files via script"
  merge: -1
