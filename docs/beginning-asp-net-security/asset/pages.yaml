  md: "# THROWING ERRORS IN WCF\n\n```\n[IPAddressInspectorBehavior]\npublic class\
    \ EchoService : IEchoService\n{\n    public string Echo(string message)\n    {\n\
    \        ...\n    }\n}\n```\n\nYou may have noticed that the ParameterValidator\
    \ throws a FaultException. Throwing a .NET exception from a WCF service does not\
    \ produce anything useful for the client. If, for example, you validation to the\
    \ Echo service to check if the string was not empty and threw an ArgumentNullException,\
    \ the client program would receive a FaultException with the following message:\n\
    \nThe server was unable to process the request due to an internal error. For more\
    \ information about the error, either turn on IncludeExceptionDetailFaults (either\
    \ from ServiceBehaviorAttribute or from the <serviceDebug> configuration behavior)\
    \ from the server to send the exception information back to the client, or turn\
    \ on tracing per the Microsoft .NET Framework 3.0 SDK documentation and inspect\
    \ the trace logs.\n\nUtilizing service logs may not be an option for client software,\
    \ so you may be tempted to do it: the IncludeExceptionDetailFaults via the web.config\
    \ file. This is a bad idea; it is highly unlikely that you want a client application\
    \ to see raw exception information of information leakage. Even if you decide\
    \ this is acceptable, it means the client software will have switch statements\
    \ based on the text of your exception. This is difficult to maintain and will\
    \ break when you change your exception messages. Instead, you should use custom\
    \ faults.\n\nA custom SOAP fault is just a data contract that may not contain\
    \ parameters. Listing 11-13 shows an example.\n\n# LISTING 113: A sample data\
    \ contract for a SOAP fault\n\n```\nusing System.Runtime.Serialization;\n\nnamespace\
    \ WCFSecurity\n{\n    [DataContract]\n    public class BadEchoParameter\n    {\n\
    \        [DataMember]\n        public string Name;\n    }\n}\n```"
  merge: -1
  pgno: 290
- img_proc: true
  md: "Once you create your data contract for the fault, you decorate your service\
    \ contract with\nFaultContract attributes:\n\n```\nusing System.ServiceModel;\n\
    \nnamespace WFSecurity {\n    [ServiceContract]\n    public interface IEchoService\
    \ {\n        [OperationContract]\n        [FaultContract(typeof(BadEchoParameter))]\n\
    \        string Echo(string message);\n    }\n}\n```\n\nFinally, in your code,\
    \ you must throw your defined fault:\n\n```\nif (String.IsNullOrEmpty(message))\n\
    {\n    BadEchoParameter fault = new BadEchoParameter();\n    fault.Name = \"message\"\
    ;\n    throw new FaultException<BadEchoParameter>(fault);\n}\n```\n\nOn the client,\
    \ you can have \"proper\" exception handling based on your fault contract:\n\n\
    ```\ntry {\n    string result = client.Echo(string.Empty);\n} catch (FaultException<BadEchoParameter>\
    \ e) {\n    // Act appropriately.\n}\n```\n\nAs well as producing more maintainable\
    \ code on the client side, you have also removed the risk\nof information leakage\
    \ via the the default exceptions.\n\n# A CHECKLIST FOR SECURING WCF\n\nFollowing\
    \ is a checklist of items to follow when securing a WCF service.\n\n+   * Never\
    \ expose services over protocols you are not using—Once you have migrated your\
    \ service to a secure protocol, remove the insecure protocols so that they can\
    \ no longer be used.\n\n+   * Choose an appropriate binding for interoperability\
    \ and security.—Not all clients understand the WS* protocols. However, you can\
    \ apply security to the BasicHttpProtocol if interoperability is a concern. The\
    \ WS* protocols offer more flexibility."
  merge: -1
  pgno: 291
- img_proc: true
  md: '+   Choose a suitable authentication mechanism for your protocol—The credential
    type used will depend on your setup. Intranets, for example, may use Windows authentication
    to automatically authenticate to a service, but this is not suitable for Internet-facing
    services, which should use a username and password.


    +   Apply authorization to your service contract using principalPermission.


    +   Utilize message inspectors if needed—Message inspectors allow you to examine
    a message before it reaches your service implementation, allowing for custom rules
    and filtering on any message property.


    +   Throw custom SOAP faults from your service, not .NET exceptions—Never set
    Include ExceptionDetailsInFaults to true.'
