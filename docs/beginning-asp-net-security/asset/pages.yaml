- img_proc: true
  md: 'As you can see, the IIS logs can provide valuable information for both monitoring
    your application’s health, and warning you of potential attacks, should you run
    scripts daily and compare the results. These can also help you drill into where
    an attack came from, and some of what happened, should one ever occur.


    # # USING CERTIFICATES


    When you browse to a Web site, or your Web-based email provider, hopefully you
    have noticed the lock icon in your browser that indicates a secure, encrypted
    Web site. Transport Layer Security (TLS) and its predecessor, Secure Sockets Layer
    (SSL), are the protocols that provide security for Internet communications. To
    enable SSL on your Web site it is necessary to create an X509 certificate, which
    contains a public and private key, and attach it to the Web site, which enables
    HTTPS. This certificate exposes your public key to connecting clients, which is
    then used in the bootstrap of the secure conversation that HTTPS delivers.


    Certificates are provided by a Certification Authority (CA), which is an entity
    that issues the certificates and is trusted by other users. Windows has a default
    of trusted CAs that can issue certificates that will work with Internet Explorer.
    Firefox has its own list of CAs (although most are common to some applications).


    Certificates issued by a non-trusted CA (or generated by a computer for itself—self-signed
    certificates) will cause warning screens to appear in the users browser, as shown
    in Figure 14-3. These alert the user to fact that the certificate is untrusted,
    and for confirmation to continue.


    ![](img/c28a05c0528daad8a392659cd26abcda_355_0.png)


    FIGURE 14-3: The IE8 warning screen for an untrusted HTTPS certificate'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'Obviously, this warning screen is off-putting to the average user, and so,
    when putting a Web site onto the Internet, you should purchase a certificate from
    one of the trusted CAs, such as Thawte, Verisign, Comodo, GoDaddy, and others.
    When purchasing a certificate from a trusted CA, checks will be made to ensure
    you know the domain you are purchasing it for, and if you are purchasing on behalf
    of a company, various details about your company will also be checked.


    # # Requesting an SSL Certificate


    Requesting a certificate is a two-stage process. You start by creating the request
    on your IIS server, and send it to the CA. (In shared hosting scenarios, your
    Web hosting provider will generate the request for you and send it to you.) Once
    the necessary checks are complete, the CA returns a response to you, which you
    enter into IIS to complete the request. The certificate is then available for
    use.


    Each HTTPS site requires its own dedicated IP address. It cannot share an IP address
    with other Web sites. The sharing facility is provided by the host server by the
    browser when making a request. But, during an HTTPS request, the header is encrypted
    (with everything else) and cannot be decrypted in order to route to a site.


    To generate a certificate request, from the IIS Administration Manager, click
    on the machine you wish to generate it from in the Connections window. Then click
    the SSL certificates icon in the Features window. In the action on the right-hand
    side of the screen, you will see a Generate Certificate Request option. Click
    it and the Request Certificate window will open, as shown in Figure 14-4.


    The "Common" name is the fully qualified domain name (FQDN) of your Web site (that
    is, the DNS entry that you use to connect to your). Different FQDNs require different
    SSL certificates. For example, using a certificate for *wrox.com* on *books.wrox.com*
    would cause an error to appear in the browser. Note that all FQDNs appear in lowercase.


    ![](img/c28a05c0528daad8a392659cd26abcda_356_0.png)


    > Once a certificate is generated, none of the details will be changeable, so
    ensure that you get it right. Otherwise, you will end up having to purchase another
    certificate, which can be an expensive mistake!


    Once you have filled out the certificate details and clicked Next, you have the
    chance to request different key sizes. Generally, you do not want to change any
    settings on this screen, so click Next'
  merge: -1
