  md: "# Code Defensively\n\nWhen developing, you should consider defensive programming,\
    \ input validation, checking for out-of-range errors, and so on. This attitude\
    \ should even extend to things such as the humble if statement. Consider the code\
    \ snippets in Listing 1-1 and 1-2.\n\nLISTING 11: A Sample if Statement\n\n```\n\
    if (model.ValidationStatus == ValidationStatus.Invalid)\n    return false;\nelse\n\
    \    return true;\n```\n\nLISTING 12: Another Sample if Statement\n\n```\nif (model.ValidationStatus\
    \ == ValidationStatus.Valid)\n    return true;\nelse\n    return false;\n```\n\
    \nWhich of these statements is more secure? Are they the? What happens if ValidationStatus\
    \ has three states: Valid, Invalid, and Unknown? If ValidationStatus was Unknown\
    \ in Listing 1-1, then true would be returned. This would mean that the code will\
    \ start to treat the object as valid. Listing 1-2, however, specifically checks\
    \ for Valid, and defaults to a negative outcome, which is a more secure value.\n\
    \n# THE OWASP TOP TEN\n\nThe Open Web Application Project (OWASP), based on the\
    \ Web at http://www.owasp.org/, is a global free community that focuses on improving\
    \ the state of Web application security. All the OWASP materials are available\
    \ under an Open Source license, and their meetings (with more than 130 local chapters)\
    \ are free to attend.\n\nOne prominent OWASP project is the Top Ten Project (http://www.owasp.org/index.php/Category:OWASP_Top_Project),\
    \ a document compiling the most critical Web application security flaws. The Top\
    \ Ten Project has been used by the U.S. Defense Information Systems Agency as\
    \ part of their certification process, and adopted by the Payment Card Industry\
    \ standard, a set of regulations for any merchant accepting credit card information.\n\
    \nFollowing is the 2007 list (the most current as of this writing), and the chapters\
    \ in the book that address each of the issues."
  merge: -1
