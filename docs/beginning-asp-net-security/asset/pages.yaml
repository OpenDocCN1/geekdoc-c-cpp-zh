  md: '# Controlling ViewState


    ![](img/c28a05c0528daad8a392659cd26abcda_96_0.png)


    **FIGURE 5-1:** ViewState Decoder


    As you can see from Figure 5-1, ViewState Decoder makes it simple to take a ViewState
    field from a Web page and determine the values that are stored inside. If you
    are using ViewState to store sensitive information in your application, an attacker
    could use that tool to find sensitive data inside.


    > **NOTE** The Open Web Security Application Project (OWASP) refers to the vulnerabilities
    in this chapter as information leakage. Leakages can unintentionally expose information
    that an attacker can use to learn about the internals of an application.


    # Validating ViewState


    If you know ViewState is encoded, you may assume that you can create a completely
    fake ViewState value and submit it to an ASP.NET page. This would enable you to
    add, change, or delete values stored within the page. This kind of modification
    could potentially allow an attacker to take over the behavior of controls in the
    server-side code.'
