  md: '# A CHECKLIST FOR SECURING INTERNET INFORMATION SERVER (IIS)


    This chapter has covered the basics of securing IIS, giving you the basic knowledge
    that you, as a developer, should know.


    The following is a checklist you should follow when securing IIS:


    +   Configure application pool identities isolate multiple Web sites on the same
    machine. Setting a specific application pool identity (if the identity has the
    appropriate permissions) allows you to access networked resources.


    +   Configure appropriate trust levels for ASP.NET applications — Limiting what
    your application can do is best practice, because your applications will run under
    the least privilege possible. If the standard trust levels do not meet your needs,
    then customize and create your own.


    +   Configure logging in IIS —Log files can provide a valuable source of information
    when trying to track down potential attacks, or to evaluate successful ones.


    +   Filter requests with IIS—Using IIS''s request filtering will stop potentially
    dangerous requests from reaching your application, and provides another layer
    of defense.


    +   Use the Windows Certificate Authority to generate test certificates for HTTPS
    sites and Web services —Using a test CA provides support for certificate validation
    and revocation, allowing you to develop your code without lowering the security
    level on certificate-handling code. This, in turn, removes the risk of insecure
    test code making it into a production environment.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# 15


    # Third-Party Authentication


    As you browse the Web and register on various sites, it becomes problematic to
    remember the username and password for each new site you visit. You have several
    choices:


    +   - Use the same username and password everywhere (meaning if one Web site gets
    hacked, or your trust in the company keeping your information secret is misplaced,
    then your login information for other sites is now at risk)

    - Use individual usernames and passwords and rely on the browser to remember them
    for you (as well as remember to back up your authentication list)

    - Install a password manager where passwords are created and stored on your computer
    and are automatically or manually put into the browser, or

    - Use a browser plugin to generate strong passwords and store them in a third-party
    service (hoping that the service continues)


    In this chapter, you will learn the following:


    +   - The history of third-party authentication

    - How to integrate Security Assertion Markup Language (SAML)/Information Cards
    into your Web site

    - How to integrate OpenID into your Web site

    - How to integrate Windows Live ID into your Web site


    (SAML)/Information Cards, OpenID, and Live ID are all ways of delivering a third-party
    authentication token to your Web site.


    # A BRIEF HISTORY OF FEDERATED IDENTITY


    Federated identity is a generic term describing the scenario where a user''s identity
    can be used across multiple systems, within a single organization, or on systems
    external to the organization providing the identity. The term describes the technology
    and standards that'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'The end goal is to enable users of one domain (be it a company, OpenAI provider,
    a Live ID user, or any other identity provider) to seamlessly and securely access
    systems or data belonging to another domain, without each system having to maintain
    its own redundant user administration functions.


    Imagine that Wrox wants to give Amazon access to a database containing information
    about new books. While it''s certainly possible for an administrator at Wrox to
    create an authentication system and add user details for Amazon accounts, this
    would rapidly become unwieldy. In addition, Amazon would have to inform Wrox of
    new accounts, and to disable old accounts as staff members take new jobs with
    other companies. A better approach would be to let Amazon provide the authentication
    against their internal systems (such as Active Directory), and forward details
    of the users (such as their names, their job titles, and so on), and for Wrox
    to use this information to authorize and grant or deny access parts of the Wrox
    system appropriately.


    By doing this, Wrox''s application would be known as a relying party (RP). The
    RP requests the user''s identity, and the user is directed to log into an identity
    provider (IP), which, in the example, is a system within Amazon. This may be via
    the browser, a special client that runs on the user''s computer (sometimes called
    an identity selector), or provided automatically for them by some internal corporate
    system. The identity provider authenticates the user and packages information
    about the user''s identity, which is then sent to the RP, either from the IP or
    via the user, which processes it and allows access if appropriate. Figure 15-1
    shows this process.


    ![](img/c28a05c0528daad8a392659cd26abcda_363_0.png)


    FIGURE 15-1: The typical flow for accessing information through your federated
    identity'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# A Brief History of Federated Identity


    The first major Web-based federation identity solution was Microsoft’s Passport
    service, which was designed as a "single sign-on" server for e-commerce sites.
    Microsoft Passport had various problems, including privacy and security concerns,
    as well as a lack of adoption from both customers and from other companies.


    In response to Passport, the Liberty Alliance created by Sun, Oracle, and other
    Microsoft rivals as an alternative identity system. While their implementation
    was never widely adopted, they did release specifications for federated identity
    to the Organization for the Advancement of Structured Information Standards (OASIS),
    the XML-based industry standard for exchanging the base for the Security Assertion
    Markup Language (SAML), for exchanging authentication and authorization data between
    systems.


    SAML is a standard generally used between corporate entities. When a user from
    corporation A wants to access a resource from corporation B, the corporation A
    browsers to the resource URL. The user is then presented with a login form, which
    will direct the login request back to the internal IP. The IP validates the authentication
    information and constructs a SAML token containing assertions about the user’s
    identity. This token is cryptographically signed by the IP and, sometimes encrypted
    for the receiving party. The token is sent back to the resource provider (typically
    via an HTML form submission), which checks to ensure that the signature is one
    that it recognizes. The resource provider performs authentication based on the
    identity within the SAML token. SAML is not limited to the Web, for it can be
    used to flow identity between internal systems, but this chapter will focus on
    its use in Web applications.


    Passport eventually re-branded Live ID, with Microsoft dropping its goal of generalizing
    e-commerce functions (such as purchasing) and now acting as a simple authentication
    system that can be used by other Web sites.


    An alternative to Live ID is OpenID, a decentralized standard allowing users to
    use a single digital identity to any supporting Web site. Unlike Passport and
    Live ID (where Microsoft can issue identities), anyone can become an OpenID provider,
    and the protocols do not rely on any central authority. OpenID was developed in
    2005 by Brad Fitzpatrick, creator of Livejournal. It is a lightweight identity
    system making use of the existing Internet protocols and specifications such as
    URIs, HTTP, and SSL. Of all the identity solutions, OpenID is currently the most
    supported, in terms of authentication by Web sites, as well as the places from
    which you can acquire an identity.


    One of the detractors of Microsoft Passport was Kim Cameron. Cameron had published
    the "Seven Laws of Identity" (http://www.identity.com/tp/35) which represented
    his vision for a successful Internet identity solution. With Cameron as their
    Identity Architect, Microsoft implemented his of identity metasystem with Information
    Cards and Windows CardSpace.


    Information Cards are based on existing open standards (WS-Trust, WS-Security,
    and SAML), with an Information Card representing a digital identity in a piece
    of software called an identity selector, which runs on a user’s computer. When
    an RP requests an identity, the selector presents any Information Cards that can
    meet the RP’s criteria. The user selects the card, and the selector then contacts
    the IP who has issued the card to retrieve the requested identity. Because the
    identity runs on the user’s computer, it presents the user with a consistent interface
    that reduces the risk of phishing, which OpenID and Live ID are vulnerable to.'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'The identity token currently used in Information Cards is the SAML standard,
    as any SAML-accepting Web site can contain Information Cards with a minimal amount
    of work. However, the Information Card is token-agnostic. There is work going
    on to create an OpenID Information Card standard, where the response from a compatible
    identity provider can contain an OpenID response instead of a SAML response.


    WindowsSpace is the Windows client for Information Cards, providing the Identity
    Selector piece of the information card process. Microsoft is currently developing
    a new version of Active Directory Federation Services (ADFS) that will provide
    an identity provider for SAML, and an Information Card that uses Active Directory
    as its identity store and the Windows Identity Foundation (WIF) to allow developers
    to write their own information providers. These providers would accept both SAML
    and Information Cards on their Web sites and in their services.


    No matter which you choose to integrate, the important thing is that a third party
    is authenticating on your behalf. The authentication will flow to your Web site
    in the form of a token (via URLs, SAML, an HTTP POST, or other method). Once you
    receive the token, you parse and decide if the authenticated user is authorized
    to access your resources.


    Generally, tokens contain claims about a user''s identity. For example, a LiveID
    token may contain a claim detailing the unique reference Live ID to a user, an
    Information Card may contain a claim about a user''s date of birth, or an OpenID
    token may contain a claim about a user''s email address. It is up to you, the
    developer, to decide how much you can trust these claims. This decision is usually
    based on where the claims are coming from.


    When a user registers for OpenID, the provider may ask the user for confirm his
    or her email address. However, when the email address is delivered to your Web
    site, you have no way of knowing if that email is still active and belongs to
    the user. Similarly, Information Card system may issue claims about a user''s
    date of birth or address, unless you know how these have been verified by the
    identity provider, you cannot assign a level of trust to these claims, and should
    treat them like any untrusted provider.


    # USING THE WINDOWS IDENTITY FOUNDATION TO ACCEPT SAMLAND INFORMATION CARDS


    The Windows Identity Foundation (WIF) provides a framework for building claims-based
    applications and service. With WIF you can enable federation for ASP.NET applications
    and provide claims-based authorization for both ASP.NET and WCF. In addition,
    WIF provides you with the building blocks to build a security token service to
    issue claims-based identities either via SAML tokens or an identity selector as
    information cards. When accepting identities WIF supports two types of federated
    identities:


    +   - Passive SAML—This is where you are redirected to your identity provider,
    which issues an identity and then redirects the browser back to the Web site asking
    for identity.

    - Information Cards—This is where the accepting Web site (the relying party) triggers
    the Information Card client, which talks to your identity provider and returns
    a SAML token to the requesting Web site.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Using the Windows Identity Foundation to Accept SAML and Information Cards
    | 36


    In this section, you will learn how to create a claimaware site for SAML authentication,
    and how to add Information Card support to an existing Web site.


    Originally, with .NET 3.0, Information Card support was minimal. To add it to
    your site, you will use sample code that were rather fragile and made as issues.
    Microsoft changed this in Geneva 2008 with the beta release of the "Geneva" platform.
    It is composed of three parts:


    +   - Windows Identity Foundation (WIF)—is a library that helps .NET Web sites
    consume the tokens issued by a Security Token Service (STS), and also helps developers
    write custom security token services.


    +   - Active Directory Services—the server is a ready-made STS that uses Active
    Directory to authenticate users, and to issue claims over their identities.


    +   - Windows CardSpace—this is an identity selector, or the user interface that
    runs on Windows. It allows the user to select an Information Card to use, and
    retrieves a token from the STS before delivering it to the requesting Web site.


    If you want to learn more about Windows CardSpace: Understanding CardSpace: An
    Introduction to the Concepts and Challenges of Digital Identities by Vittorio
