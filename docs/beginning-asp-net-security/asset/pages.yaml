  md: "# TRY OUT Using Roles to Authorize Service Operations\n\nIn order to configure\
    \ WCF to use roles, you must configure the service. To use Windows groups, you\
    \ must obviously be authenticating as a Windows user (for example, in the intranet\
    \ configuration shown earlier, or via a username and password configuration that\
    \ uses the Windows store).\n\n+   With the sample you have previously developed\
    \ (which uses Windows authentication), edit the service behavior in the web.config\
    \ to add a new serviceAuthorizationElement as follows:\n\n```\n<serviceBehaviors>\n\
    \  <behavior name=\"WCFSecurity.EchoServiceBehavior\">\n    <serviceMetadata GetIsEnabled=\"\
    false\" httpsGetIsEnabled=\"true\" />\n    <service debug ExceptionDetailInFault=\"\
    false\" />\n    <serviceAuthorization principalPermissionMode=\"UseWindowsGroups\"\
    \ />\n  </behavior>\n</serviceBehaviors>\n```\n\n+   Now you must specify the\
    \ roles that are allowed to call the Echo operation. This is done by adding a\
    \ PrincipalPermission to the implementation class. Open EchoService.svc and change\
    \ it to add the permission attribute like so:\n\n```\nusing System;\nusing System.ServiceModel;\n\
    using System.Security.Permissions;\nusing System.Security.Principal\n\nnamespace\
    \ WCFSecurity\n{\n    public class EchoService : IEchoService\n    {\n       \
    \ [PrincipalPermission(SecurityAction.Demand, Role=\"Administrators\")\n     \
    \   public string Echo (string message)\n        {\n            return (\"You\
    \ sent \" + message + \" as \" + ServiceContext.Current.PrimaryIdentity.Name\"\
    );\n        }\n    }\n}\n```\n\n+   PrincipalPermission is added to each method\
    \ you use to authorize using the PrincipalPermissionAttribute:\n\n```\nPrincipalPermission(SecurityAction.Demand,\n\
    Role=\"Administrators *\")\n```\n\n+   You can go further and limit it not by\
    \ role, but by username:\n\n```\nPrincipalPermission(SecurityAction.Demand,\n\
    Name=\"WROX\\exampleUser\")\n```\n\n+   You can combine both types of permissions\
    \ and apply multiple permissions to a single method. This sample allows the Echo\
    \ operation to run any user who is part of the Administrators group."
