  md: "To provide more granularity WCF message level protection can be configured\
    \ at the interface level\nor data contract level by setting the ProtectionLevel\
    \ to the appropriate parts.\n\nIn the original example at the start of this chapter,\
    \ you defined the service contract as follows:\n\n```\n[ServiceContract]\npublic\
    \ interface IEchoService\n{\n    [OperationContract]\n    string Echo(string message);\n\
    }\n```\n\nTo sign all messages for a service, you add the ProtectionLevel setting\
    \ to the service contract like\nso (the default setting is EncryptAndSign).\n\n\
    ```\n[ServiceContract(ProtectionLevel = ProtectionLevel.Sign)]\npublic interface\
    \ IEchoService\n{\n    [OperationContract]\n    string Echo(string message);\n\
    }\n```\n\nIf you wanted to sign all the parts of a message, you apply the ProtectionLevel\
    \ property to the\nOperationContract attribute, as shown here:\n\n```\n[ServiceContract(ProtectionLevel\
    \ = ProtectionLevel.Sign)]\npublic interface IEchoService\n{\n    [OperationContract(ProtectionLevel\
    \ = ProtectionLevel.Sign)]\n    string Echo(string message);\n}\n```\n\nIf you\
    \ are using message contracts, you can be more granular, signing or encrypting,\n\
    various parts of the message contract, as shown here:\n\n```\n[MessageContract(ProtectionLevel\
    \ = ProtectionLevel.EncryptAndSign)]\npublic class Order\n{\n    [MessageHeader(ProtectionLevel\
    \ = ProtectionLevel.Sign)]\n    public string From;\n\n    [MessageBodyMember(ProtectionLevel\
    \ = ProtectionLevel.EncryptAndSign)]\n    public string PaymentDetails;\n}\n```\n\
    \nOnce you have contracts suitably decorated with ProtectionLevel attributes,\
    \ you must select\nt correct binding, message-level transport with client certificate\
    \ authentication. You can do thisby the WCF Service Configuration Editor, or by\
    \ manually setting the clientCredentialType\nthe binding portion of the configuration\
    \ file. You must also select a certificate the server to use,\nindependent of\
    \ the HTTPS configuration which IIS uses.\n\nThe certificate's private key must\
    \ be available to the account under which the service will run.\nYou can do this\
    \ by starting MMC, adding the certificate snap-in for the Local Computer."
