- img_proc: true
  md: 'Isolated storage is a great way to store user-specific information such as
    a local action history, or as a cache to store data before it is submitted to
    a Web service. However, isolated storage is not suitable for saving information
    that should be secured (such as passwords) because isolated storage is not encrypted
    or otherwise protected unless you encrypt the files yourself.


    Isolated storage is unique for every combination of users and applications. Each
    user on a computer will have a separate area of isolated storage, and every application
    that user runs will have individual storage areas. It''s important to note that
    isolated storage is not affected by the browser. Users using Internet Explorer
    and Firefox running with the same application in all will have the same isolated
    storage location in both browsers.


    Isolated storage size limits are shared between applications served from the same
    site. The initial storage limit is 1MB per site, but more can be requested from
    users — although they are free to refuse the request, delete any currently stored
    information, or disable isolated storage altogether.


    Table 12-4: How Silverlight Application and Site Identities are Derived


    | APPLICATION URL | APPLICATION IDENTITY | SITE IDENTITY |

    | --- | --- | --- |

    | http://www.d.e/app.app | HTTP://WWW.D.E/ APP.XAP | HTTP://WWW.D.E |

    | http://www.D.E/app.app | HTTP://WWW.D.E/ APP.XAP | HTTP://WWW.D.E |

    | http://www.d.e/app.param51 | HTTP://WWW.D.E/ APP.XAP | HTTP://WWW.D.E |

    | http://www.d.e:80/app.app | HTTP://WWW.D.E/ APP.XAP | HTTP://WWW.D.E |

    | http://www.d.e:8080/app.app | HTTP://WWW.D.E:8080/ APP.XAP | HTTP://WWW.D.E:8080
    |

    | http://d.e/app.app | HTTP:///D.E/ APP.XAP | HTTP:///D.E |

    | https://d.e/app.app | HTTPS:///D.E/APP.XAP | HTTPS:///D.E |

    | http://www.d.e/app1.app | HTTP://WWW.D.E/APP1.XAP | HTTP:///D.E |


    For example, an application served from http://www.d.e/app.app andhttp://www.d.e/app.app
    shares the same application identity and site identity, and thus the same isolated
    storage area. An application served from http://www.d.e/app.app andhttps://www.d.e/app.app
    has different schemes (httphttps) and thus has different application identities
    and site identities. So the application will receive a different isolated storage
    area. An application served from http://www.d.e/app.andhttp://www.d.e/app1.app
    has identical site identities, but different application identities — meaning
    that they have different isolated storage areas, but because the site identity
    is shared, the disk space limitation (which is applied on a site basis) is between
    both applications.


    Figure 12-6 shows how isolated storage is shared between sites and applications.'
