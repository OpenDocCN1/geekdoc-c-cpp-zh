- img_proc: true
  md: '# Understanding Code Security | 325


    Once your assembly is in the GAC, you can add a reference to it in your main application
    by right-clicking on your application project and choosing Add Reference. Click
    the Browse tab, browse to the directory containing your strongly named assembly,
    and select it. Once the assembly reference is added, select it from the References
    folder and ensure that the Copy Local setting is False . This will ensure that
    the version is loaded until your application is placed into a Non-Full Trust environment.


    This will work well until your application allows calls from partially trusted
    assemblies or assemblies, because they may contain security-sensitive operations.
    Opt-in to letting partially trusted callers use your GAC assembly, you must mark
    it with the AllowPartiallyTrustedCallers attribute, as shown in Listing 13-3


    # LISTING 13: Add AllowPartiallyTrustedCallers to setting an assembly


    ```

    using System.Reflection;

    using System.Runtime.CompilerServices;

    using System.Runtime.InteropServices;

    using System.Security;


    // Normal assembly attributes

    [assembly:Title("StrongNamedAssembly")]

    [assembly:Guid("4e2c6c5f-a2b2-44ff-b86c-52e9df2c1add6")]

    [assembly:Version("1.0.0.0")

    [assembly:FileVersion("1.0.0.0")

    [assembly:AllowPartiallyTrustedCallers]

    ```


    > WARNING You should only do this once you are sure your assembly will not expose
    any security flaws. The AllowPartiallyTrustedCallers attribute is an assembly-wide
    attribute, and is enabled by editing the assemblyinfo.cs file in your project.


    When writing an assembly that will allow partially trusted callers, you should
    follow the Demand / Assert when performing sensitive operations. A Demand for
    a security permission walks the entire stack examining each calling function for
    the specified permission. If the Demand succeeds then you can Assert the permission
    and perform the desired action. Here is an example:


    ```

    FilePermission FilePermission = =

    new FilePermission(FilePermissionAccess.Write, Directory);

    ```


    ```

    try

    {

    // Check the complete call stack.

    FilePermission.Demand();


    //If the demand succeeded, assert permission and

    //perform the operation.

    FilePermission.Assert();

    ```'
