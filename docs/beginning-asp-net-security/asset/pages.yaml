  md: '# CHAPTER 3 SAFELY ACCEPTING USER INPUT


    Denial of service (DoS) attacks—Attackers could insert an image tag on a major
    Web site that loads the largest image on the site they wish to hit with a DoS.
    With a large enough audience on the vulnerable site loading the image on the DoS
    site, it may provide enough bandwidth to knock that site off the Internet. Furthermore,
    because the image is loaded by innocent parties, it becomes difficult to discover
    where the problem lies.


    The important thing to realize is XSS attacks run under the context of the exploited
    site. If, for example, www.example.com was open to XSS, an attacker can change
    or insert text into a page. If the attacker inserted JavaScript code, they look
    like a legitimate part of the page and there would be no easy way for a user to
    tell an attack script from any legitimate scripts.


    > NOTE XSS is a common problem, and even Google and Microsoft are immune to this
    type of attack. In April 2008, a Google spreadsheets XSS vulnerability was discovered
    by Bill Rios that allowed an attacker to steal all of user''s cookies. (For more
    information, see http://xs-sniper.com/blog/2008/04/14-google-xss/) In 2006, a
    16-year-old Dutch student, Adrian Gras, exposed a flaw in Hotmail that allowed
    the theft of session cookies, and would allow attackers to hijack an account by
    re-creation of the stolen cookies. (For more information, see http://www.acunetix.com/news/hotmail.htm)


