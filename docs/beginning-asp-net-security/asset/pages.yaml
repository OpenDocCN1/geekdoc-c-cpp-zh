  md: '> WARNING It is important to note that the vulnerabilities that affect typical
    Web applications also affect Ajax applications. You should still HTML-encode all
    user-modifiable data displayed in the response of an Ajax application to protect
    against XSS.


    # SECURITY IN SILVERLIGHT APPLICATIONS


    Launched in 2007, Microsoft Silverlight is a framework for providing rich applications
    in the browser (although with Silverlight 3, its reach will expand to the desktop
    as well). Silverlight interfaces are designed with Extensible Application Markup
    Language (XAML). Underneath is a cut-down version of the Common Language Run-time
    (CLR), the CoreCLR, which provides a subset of the .NET framework.


    # Understanding the CoreCLR Security Model


    The security model for the CoreCLR is simpler than that of the .NET CLR, as shown
    in Figure 12-4. It is simpler, and places code into the following three categories:


    +   * Transparent code—This is safe code. It cannot access information on the
    host computer, it cannot access sensitive resources, and it cannot escalate its
    privileges. You could write in a Silverlight application that is transparent.

    * Critical code—This is code which can make operating system calls, access system
    resources, and perform unsafe operations. Critical code can only be part of the
    underlying Silverlight platform—it cannot be called directly by Silverlight.

    * Safe code—This acts as the gatekeeper between transparent and critical code.
    Safe critical code sanitizes inputs to critical code, taking parameters into the
    expected, standard format. It also sanitizes output (for example, by removing
    information leaks). Safe code is the protection layer in the CoreCLR.


    | User Code Transparent |

    | Wants to write a file |


    The canonization of input ensures the safety of the CoreCLR by removing potentially
    dangerous inputs. For example, if a request is written to the file at ..\boot.dat
    is made, the safe critical code sitting between your code and the wrapper will
    strip the directory information from the filename, and simply pass boot.dat to
    the file-writing function.


    | System.IOStorage Safe critical Validates then calls api |


    The Safe critical layer also protects the CoreCLR from information leaks. For
    example, if a function calls "Permission Denied" if one user was logged, and "Does
    not exist" in another security context, an attacker could use this information
    to discover that an assert does, in fact. The safe critical layer would only return
    "Does not exist" to transparent code.


    | WINAPI—CreateFile Critical code Create file, no validation |


    FIGURE 12-4: How to call a file write follows the CoreCLR security model'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'The CoreCLR security model also affects inheritance — it would not be safe
    to allow code in the transparent layer to inherit from a class that has been marked
    as critical. Tables 12.2 and 12.3 show the inheritance restrictions placed on
    classes and virtual methods or interfaces.


    # TABLE 12-2: Class Inheritance Restrictions in the CoreCLR Security Model


    | BASE TYPE | ALLOWED DERIVED TYPE | Safe Critical | Critical |

    | --- | --- | --- | --- |

    | Transparent | Transparent | Safe Critical | Critical |

    | Safe Critical | | Safe Critical | Critical |

    | Critical | | | Critical |


    # TABLE 12-3: Method Override Restrictions in the CoreCLR Security Model


    | BASE METHOD (VIRTUAL OR INTERFACE) | ALLOWED OVERRIDE METHOD | Safe Critical
    |

    | --- | --- | --- |

    | Transparent | Transparent | Safe Critical |

    | Safe Critical | Transparent | Safe Critical |

    | Critical | | Critical |


    In summary, any application you will write will be security-transparent. It cannot
    contain code that is verified for security, nor can it call native code directory.
    Your application can access public methods exposed by platform assemblies that
    are either transparent or safe critical. Types in your application can only derive
    from other types defined in the application, or from unsealed, public-transparent
    types and interfaces defined by the Silverlight platform. Finally, your application
    can contain types that override virtual methods and/or implement methods that
    are defined in the application itself, or are defined by the platform and are
    marked Transparent or Critical.


    # Using the HTML Bridge


    Silverlight provides you with the HTML Bridge, comprised of types and methods
    that enable you to do the following:


    +   - Access the HTML document and call JavaScript events from your Silverlight
    application

    - Mark managed types and individual methods and properties, and expose them to
    JavaScript in the hosting page

    - Mark managed types as event handlers, allowing JavaScript to call them

    - Pass managed types to JavaScript, and return managed types from JavaScript'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Security in Silverlight Applications | 303


    As you can imagine, using the HTML Bridge increases your application''s attack
    surface. However, the HTML Bridge is an opt-in mechanism. You must specify choose
    the internals of your application you wish to share, and you can wrap validation
    around any exposed functionality.


    # Controlling Access to theHTML DOM


    By default, Silverlight can access the HTML Document Object Model (DOM), manipulating
    objects and calling JavaScript functions. For example, the snippet will change
    the contents of the slTime element.


    ```

    var pageElement = HtmlPage.Document.GetElementById("slTime\npageElement.SetProperty("InnerText",

    HttpUtility.HtmlToString(DateTime.Now.ToString()));

    ```


    You can also see that Silverlight provides a small set of encodings for HTML and
    URLs to order XML. Obviously, using element IDs means that your Silverlight code
    is tightly bound to the document layout. To provide greater flexibility, you can
    also call JavaScript functions. You can disable HTML access for the Silverlight
    application by setting the HtmlAccess parameter on the Silverlight ASP.NET control,
    as shown in Listing 12-3, or by setting the enablehtmlaccess parameter on the
    object tag if you are not using the control, as shown in Listing 12-4.


    > LISTING 12: Disabling HTML access using the Silverlight ASP.NET control


    ```

    div style="height:400">

    <asp:Silverlight ID="Xaml1"

    runat="server"

    Sources="/ClientBin/SilverlightAccessToHTMLDOM.xaml"

    MinimumVersion="2.0.31005.0"

    Width="100"

    HtmlAccess="Disabled"/>

    </div>

    ```


    > LISTING 12: Disabling HTML access using the Silverlight object tag


    ```

    object data="application/x-silverlight-2"

    type="application/x-silverlight-2"

    width="300"

    <param name="source" value="/ClientBin/SilverlightAccessToHTMLDOM.xaml" />

    <param name="onerror" value="SilverlightError" />

    <param name="background" value="white" />

    <param name="runtimeVersion" value="2.0.31005.0" />

    <param name="autoUpgrade" value="true" />

    <param name="enablehtmlaccess" value="false" />

    <a href="http://go.microsoft.com/fmlink?LinkId=124807"

    style="text-decoration:none;"

    <img src="http://go.microsoft.com/fmlink?LinkId=108181"

    alt="Get Microsoft Silverlight"

    style="border-style:none" />

    </a>

    </object>

    ```


    *'
