    web_lowtrust.config\"/>\n      <trustLevel name=\"Minimal\" policyFile=\"web_minimaltrust.config\"\
    />\n      <trustLevel name=\"MediumPlus\" policyFile=\"web_mediumplus.config\"\
    />\n    </securityPolicy>\n    <trust level=\"MediumPlus\" originUrl=\"*\" />\n\
    \  </system.web>\n</location>\n```\n\nAll applications by IIS will now run under\
    \ your new MediumPlus trust level.\n\n# FILTERING REQUESTS\n\nThe IIS7 Request\
    \ Filter begins as URLScan for IIS4, an extension that examined requests for potentially\
    \ harmful exploits (such as double-escaped URLs) and stopped them from reaching\
    \ any applications running on the server. In IIS7, these features were rolled\
    \ into the Request Filtering service.\n\nRequest filtering can be configured globally\
    \ using applicationHost.config and for each application in the web.config. If\
    \ you prefer a GUI to configure request filtering, the IIS7 Admin Pack (downloadable\
    \ from http://www.iis.net/extensions/AdministrationPack) provides one. You should\
    \ be aware that request filtering constrains input, and can stop your Web site\
    \ from working if you misconfigure the filters. Requests can be filtered and rejected\
    \ based on a number of:\n\n+   - DoubleEncoded requests\n- Requests with nonASCII\
    \ characters\n- A filter based on a request file extension\n- A filter based on\
    \ request sizes\n- A filter based on HTTP verbs\n- A filter based on URL sequences\n\
    - A filter based on request segments\n- A filter based on request headers"
