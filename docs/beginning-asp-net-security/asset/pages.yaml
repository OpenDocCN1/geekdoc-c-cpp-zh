    +   2. Choose All Tasks Import from the context menu.


    +   3. Click Next to move on from the wizard introductory screen, and then browse
    to the certificate you downloaded from your test CA.


    +   4. Click Next and then ensure that the "Place all certificates in the following
    store" option is selected, and the Trusted Root Certification Authorities store
    is selected.


    +   5. Click Next again, and finally, click Finish.


    If expand the Trusted Root Certification Authorities, you will see, in the certificates
    folder, your root CA certificate, named with the common name you entered during
    setup. The other entries in this folder will include the default CAs that Windows
    understands and, perhaps, some other keys generated by software that uses self-signed
    keys.


    Once you have the root CA certificate installed, you can browse to the HTTPS Web
    site on your CA without any errors, and request and receive SSL certificates from
    that CA for use in development.'
