  md: 'If you are using multiple partners (some of which are not using Geneva server),
    or delivering types using the Microsoft claim name, they can map their claim to
    roles, or indeed transform any claims by using a ClaimsAuthenticationMapper.


    This may quite seem overly complicated for just accepting an identity from a UI-driven
    selector. (And if you want a simple-ASP.NET server control, Dominic Baiker has
    written one, and made it available at http://infocordslector.codplex.com/) But
    this barely scratches the surface of Microsoft''s roadmap for claims-based identity.


    Remember, Microsoft''s solution consists of three parts: WIF (which you have just
    used to accept SAML and Information Cards), Windows Cardless (the identity selector
    to select information cards and communicate with an Identity Provider), and the
    ADFS (an identity provider that uses Active Directory to authenticate users and
    will deliver claims from various claim stores such as AD, SQL Server, and others).
    If ADFS does not meet your needs, then you can use the WIF to write your own secure
    selector.


    Using Microsoft''s various options, you can issue your own identities and accept
    those from trusted parties, or from any compatible identity provider with ease.
    Furthermore Geneva leverages the WS-Federation standard, a WIF solution is interoperable
    with other federated identity providers. So, for an example, a company that uses
    Active Directory as before can use Geneva to provide identity information to a
    company using IBM Tivoli Federated Identity Manager. Furthermore, by using claims-based
    authentication and authorization, you can also use the access control services
    Azure provides to authenticate with your corporate Directory or other identity
    provider, and future proof your application, should you wish to move to Microsoft''s
    cloud offering. A step-by-step guide to WIF and Azure is available at http://code.msdn.microsoft/com/wifazpassive.


    # # USING OPENID WITH YOUR WEB SITE


    OpenID is the most used third-party authentication on the Internet today, in both
    terms of providers and Web sites that can accept. Major providers include AOL,
    Google, Microsoft, Veris, and Yahoo!, not to mention the myriad of smaller providers
    who sprung up before the standard was adopted by the players. OpenID takes the
