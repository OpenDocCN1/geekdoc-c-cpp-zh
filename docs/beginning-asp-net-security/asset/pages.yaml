    .\\w+([-+..]\\w*)**$\nif (!Regex.IsMatch(\n    email.Text, emailRegex,\n    RegexOptions.CultureInvariant))\n\
    \    return false;\n\nreturn true;\n```\n\nThe validation code shows the correct\
    \ approach, checking for whitelisted values through the Length property on fields\
    \ and regular expressions. (Regular expressions are a formal language for identifying\
    \ strings of text, parsing, and matching them.) The validation procedure checks\
    \ every field, and rejects data that does not match the requirements.\n\nIn real\
    \ world, things become more complicated. According to the Guinness World Records,\
    \ the longest name on a birth certificate is Rhoandiatethysiahenveken Koanyasuisilliams,\
    \ which carries the arbitrary upper limit of 50 characters. The regular expression\
    \ for naming also excludes characters such as an apostrophe ('), so anyone with\
    \ a surname of O'Dell, for example, would not be accepted. The regular expression\
    \ simply checks the format of the email, looking for text up of characters or\
    \ numbers, or @ sign and then more text to the right of the @ sign, a period,\
    \ and then a minimum of three more characters. This excludes many email addresses\
    \ and, of course, there is no way to tell if an email address is valid without\
    \ sending a message to it and requiring a response.\n\nFurthermore, the validation\
    \ function does not indicate where it failed or if it was more than a single failure.\
    \ This makes it difficult for the user to figure out why input was rejected. Finally,\
    \ the code runs on the server, so a user must submit the form before being told\
    \ that the validation failed.\n\nAdding validation functions to form like this\
    \ is a laborious process, and one that is prone to error. ASP.NET includes common\
    \ validation controls that allow you to minimize the coding you must perform,\
    \ and if the validation controls provided as standard are not suitable, you can\
    \ write your own.\n\n# Validation Controls\n\nAll ASP.NET validation controls\
    \ are normal ASP.NET controls that also implement the IValidator interface, as\
    \ shown here:\n\n```\npublic interface IValidator\n(\n    void Validate();\n \
