    # Using ASP.NET Trust Levels


    ASP.NET has five trust levels, which are preset permissions sets that grant the
    capability to perform certain tasks. Each trust level (apart from Full Trust)
    can be customized, or new trust levels can be created.


    Table 13-2 shows the manifest restrictions provided by each trust level. If you
    want to see the exact limitations, you can open the web*.trust.config file for
    each level from C:\Windows\Microsoft\.NET\Framework\v2.0.50727\CONFIG.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# TABLE 13-2: Default Restrictions for ASP.NET Trust Levels


    | TRUST LEVEL | RESTRICTIONS |

    | --- | --- |

    | Full | None |

    | High | Cannot call unmanaged code, Some restrictions on reflection |

    | Medium | (In addition to High restrictions), Cannot create Web requests, Can
    only write files to the application directory and below, Some restrictions on
    the environment variables accessible |

    | Low | (In addition to Medium restrictions), Cannot make any out-of-process calls
    (for example, to a database, to the network, or to send emails) |

    | Minimal | Denied almost everything |


    Ideally, your code would be able to cope with differences in trust levels without
    crashing. But how do you accomplish this?


    # Demanding Minimum CAS Permissions


    If your application will not function without a particular permission set, you
    can embed this minimum requirement as part of your assembly.


    When you create a new application or assembly, an AssemblyInfo.cs file is created
    in the properties directory of your project. You can add your minimum requirements
    into this by adding the CAS permissions necessary for your application to run.
    For example adding the following indicates that your application must be granted
    the FileIOPermission:


    ```

    [assembly: FileIOPermission(SecurityAction.RequestMinimum, Unrestricted=true)]

    ```


    If your application is hosted in an ASP.NET trust level that does not grant this
    permission, it will fail to load, and you will see an exception detailing that
    the hosting environment “Failed to grant minimum permission requests."'
