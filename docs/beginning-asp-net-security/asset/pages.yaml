    # Using the RegularExpressionValidator


    The RegularExpressionValidator validates the value of a control with a regular
    expression set in the ValidationExpression property. In design mode, Visual Studio
    provides a list of common regular expressions, including email address, Web address,
    and postal codes for selected countries. You should remember that a regular expression
    is simply a pattern match. So, for example, if you are accepting a ZIP code, you
    should perform further checks on its validity, as shown here:


    ```

    asp:TextBox runat="server" ID="zipcode" />

    as:RegularExpressionValidator runat="server" ID="zipcode"

    ControlToValidate="zipcode"

    ValidationExpression="\d{5}(-\d{4})"

    ErrorMessage="Please enter a valid zipcode"

    Text="***" />

    ```


    # Using the Comparator


    The Comparator compares the value of a control against a static value, the value
    of another control, or against a data type. In the data type check, the control
    compares types Equal, GreaterThan, GreaterThanEqual, LessThan, LessThanEqual,
    and NotEqual.


    This example compares the contents of a textbox against a value of Yes:


    ```

    asp:TextBox runat="server" ID="confirm" />

    as:ComparatorValidator runat="server" ID="confirmValidator"

    ControlToValidate="confirm"

    ValueCompare="yes"

    Type="String"

    Operator="Equal"

    ErrorMessage="Enter yes to continue"

    Text="***" />

    ```


    If you want to compare the value of two controls (for example, a password change
    dialog), use the ControlToCompare and the operator to Equal, as shown here:


    ```

    asp:TextBox runat="server" ID="password" TextMode="Password" />

    as:TextBox runat="server" ID="passwordconfirmation" TextMode="Password" />

    as:ComparatorValidator runat="server" ID="passwordValidator"

    ControlToValidate="password"

    ControlToCompare="passwordconfirmation"

    Operator="Equal"

    ErrorMessage="Passwords do not match"

    Text="***" />

    ```'
