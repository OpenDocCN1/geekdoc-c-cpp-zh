  md: 'To validate, you must first create an instance of the XmlReaderSettings class
    and set the validation type, flags, and a callback method. After that, you must
    load your XML schema into an XmlSchema object and attach it to the settings instance.
    Once you have both the settings configured, you can use them with an XmlReader
    to populate your XmlDocument.


    Every time an error is encountered in the document, the callback function will
    be called. In this example, this simply sets a flag to say the document was invalid.
    In a real-life scenario, you would want to read each error from the ValidationEventArgs
    and log the errors, or display error messages to the user.


    # 9. Run your new page and see if your XML validates against the schema you created.
    Invalidate your XML and see what happens.


    There are other ways of validating with schemas and DTDs. These are documented
    in the Microsoft KB articles 307379 (C#) and 315533 (VB).


    A strictly defined schema is a powerful tool in validating any XML input or ensuring
    that you output valid XML. Without a schema, your parsing functionality might
    crash, or data may slip through. Schemas can include information on the type of
    element, maximum and minimum occurrences, lengths of elements or attributes, the
    order of data, and enumeration values.


    The previous sample used local schemas to validate. However, when you write XML
    against third-party schemas, these schemas may be hosted on external URIs.


    The XmlSettings class exposes a property, XmlResolver. By default, this is configured
    to use a default resolver with no user credentials. If your application is hosted
    behind a proxy that requires authentication, you must create an XmlResolver instance
    and set the Credentials property properly. However, the use of external schemas
    introduces a dependency on their availability, and your server''s availability
    to retrieve them. Also, retrieved XML schema definitions (XSDs) are not cached.


    You may want to consider retrieving schemas and adding them to your solution,
    or implementing a custom XmlResolver that caches schemas. MSDN has an example
    of a custom, caching resolver available at http://msdn.microsoft.com/en-us/library/bb669135.aspx.


    You should also consider exposing your schemas to anyone using your data formats.
    This will enable them to validate before sending your information, and, HOPEFULLY,
    reduce the number of errors you encounter. If you publish your schema on an HTTPS
    URI, then the connecting clients will have to check the identity of the server
    hosting the schema. Of course, you should still not rely on a third-party XML
    document conforming to your schema, and perform your own validation.'
  merge: -1
  pgno: 238
- img_proc: true
  md: "# 234 | CHAPTER 10 | SECURING XML\n\n![](img/c28a05c0528daad8a392659cd26abcda_239_0.png)\n\
    \n> > **NOTE** One other thing to consider when validating is XML normalization.\n\
    Normalization controls how a parser handles things like whitespace, character\
    \ cases, and default attribute values. This is potentially dangerous, because\
    \ character-encoded values (those specified by the Unicode values, as &amp;) will\
    \ slip through validation, and may cause problems when you manipulate the data.\n\
    The `XmlReaderSettings` class contains the `CheckCharacters` property that configures\
    \ the reader to check for potentially invalid characters. The default value is\
    \ `true`. Other properties that may affect validation include `IgnoreComments`,\
    \ `IgnoreProcessingInstructions`, and `IgnoreWhitespace`.\n\n# # QUERYING XML\n\
    \nOf course, XML like any data format, is of limited unless you process it. While\
    \ simple processing like sending a document is trivial, XML has its own query\
    \ language, XPath. XPath allows a developer to select elements in a document or\
    \ filter data. One major use of XPath is with XML Transformations (XSLTs), where\
    \ you can style parts of the presentation of an XML document by selecting the\
    \ data of (nodes, in XPath phrase) and apply a transformation or style to them.\n\
    \nUsing the `books.xml` document presented in this chapter, you can select all\
    \ available `bookTitles` by executing a XPath expression:\n\n```\nXmlList bookTitles\n\
    xmlDocument.SelectNodes(\"/Books/Book/Title\");\nforeach (XmlNode bookTitle in\
    \ bookTitles)\n{\n    // Do something with the node.\n}\n```\n\nYou can perform\
    \ other queries using XPath expressions. For example `/Books/Book[1]` would select\
    \ the first `Book` node in the document and `/Books/Book[last()]` would select\
    \ the last `Book` node in the document.\n\nFurthermore, unlike SQL, you can query\
    \ for specific values. The following code snippet would select all books with\
    \ more than 400 pages:\n\n```\nXmlList bookTitles\nxmlDocument.SelectNodes(\"\
    /Books/Book[Pages>400]\");\nforeach (XmlNode bookTitle in bookTitles)\n{\n   \
    \ // Do something with the node.\n}\n```\n\nIt is this type of query that is open\
    \ to abuse. Like SQL queries, XPath expressions can be vulnerable to injection\
    \ attacks. Consider the following XML document:"
  merge: -1
