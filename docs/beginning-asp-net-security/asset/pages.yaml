  md: "# LISTING 127 (continued)\n\n```\nExternalCallersFromCrossDomain=\"ScriptableOnly\"\
    \n  <Deployment.Parts>\n  </Deployment.Parts>\n</Deployment>\n```\n\nIn summary,\
    \ the HTML Bridge offers bidirectional communication between the hosting and your\
    \ Silverlight application. The hosting page can control access to itself using\
    \ the EnableHtmlAccess property on the Silverlight object. The application can\
    \ control access to its internals via the ScriptableType and ScriptableMethod\
    \ attributes and the HtmlPage.Register* methods, and additionally can expose its\
    \ internals to cross-domain access using the ExternalCallersFromCrossDomain property\
    \ in the manifest.\n\nFigure 12-5 shows an example of controlling interactions\
    \ between scripts and Silverlight.\n\n![](img/c28a05c0528daad8a392659cd26abcda_310_0.png)\n\
    \nFIGURE 12-5: Controlling interactions between scripts and Silverlight\n\n# Accessing\
    \ the Local System\n\nSilverlight code is not allowed to read from, or write to,\
    \ the file system, except under strict controls. If this were possible, it would\
    \ break the sandbox Silverlight application may need to store more data locally,\
    \ and this is possible using isolated storage.\n\nIsolated storage, a feature\
    \ introduced in the .NET framework, provides access to a small area of storage.\
    \ Isolated storage limits the amount of space available to your application and\
    \ stores under a user's profile directory. You should view isolated storage as\
    \ the Silverlight equivalent of persistent browser cookies — you can store limited\
    \ information in it, but you don't know where on a hard drive they will reside."
