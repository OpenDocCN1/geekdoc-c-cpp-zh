  md: "# EXAMINING HOW ASP.NET WORKS\n\nWhen Microsoft introduced ASP.NET, among the\
    \ main advantages were the event model and built-in state management that allowed\
    \ Windows developers to apply the same skills to Internet applications that they\
    \ had learned on desktop applications. However, you can see from examining the\
    \ requests and responses sent during an HTTP transaction, there is nothing in\
    \ the HTTP protocol itself that provides this sort of functionality. ASP.NET had\
    \ to build it using the existing HTTP standard.\n\nThe ASP.NET event model allows\
    \ developers to control a control in the ASP.NET page, and then we write an event\
    \ handler for the control (for example, a button that will offer a Click event).\
    \ Unlike Windows or JavaScript applications (where the event is raised and handled\
    \ by the client), ASP.NET events are raised by the client, but handled by code\
    \ on the ASP.NET server. When an event is raised by the client, the event must\
    \ be captured and sent to the server, which then examines it to determine what\
    \ occurred and what control caused it, before calling the appropriate method within\
    \ your code.\n\nWhen you write code to handle ASP.NET events, you don't need to\
    \ be aware of how the underlying mechanism works. However, as you see, the information\
    \ sent with a request cannot be trusted, so it is worth how ASP.NET turns a click\
    \ into a server-side event.\n\n# Understanding How ASP.NET Events Work\n\nSo does\
    \ ASP.NET turn a click on an HTML button into a Click() event on the server? To\
    \ find out, you must examine an ASP.NET page with a suitable control.\n\nListing\
    \ 2-4 shows a simple Web page with Label controls tell you the type of the request\
    \ (GET or POST ), true or false indication if the page is a PostBack (postbacks\
    \ will be executed in just a moment), and maybe if a link appears on the page\
    \ is clicked. The page also shows the form parameters that were sent, if any.\n\
    \n+   LISTING 2-4. An ASP.NET Page with an Event Bound to a Button\n\n```\n<@Page\
    \ Language=\"UTF-8\">\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Transitional//EN\"\
    \n\"http://www.w3.org/TR/html4/DTD/html4-transitional.dtd>\n<script run-runat=\"\
    server\">\n    protected void Page_Load(object sender, EventArgs e)\n    {\n \
    \       Request.Text = Request.HttpMethod;\n        cameFromPostBack.Text = Page.PostBack.ToString();\n\
    \    }\n\n    protected void button_Clicked(object sender, EventArgs e)\n    {\n\
    \        message.Text = \"You clicked the button\";\n    }\n</script>\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\">\n<head>\n    <title>Postback Demo</title>\n</head>\n\
    ```"
