    in IIS Manager, and choosing “Self-signed certificate” from the menu on the right-hand
    side of the management application.


    Like a symmetric key, a certificate that contains both the public and private
    should be kept protected. Windows has a mechanism for this: The Certificate Store.
    The Certificate Store presents a standard interface to all, regardless of where
    a certificate is stored (such as on a hard disk, on a smart card or in special
    storage).


    Within the store there are two types: the machine store and the user store. The
    machine store keeps certificates that are potentially available to the machine
    as a whole (and users on machine, if they have permissions to the certificate).
    Certificates used by ASP.NET will generally be in the machine store. The user
    store contains certificates that are for a specific user. To manage the Certificate
    Store use certmgr.exe Microsoft Management Console (MMC) snap-in, as shown in
