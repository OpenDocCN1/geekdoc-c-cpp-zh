- img_proc: true
  md: 'Over the years, coding best practices and approaches have become formalized,
    tested and shared. Security principles are no different. The following section
    lists some general security principles you should follow during your application
    development.


    # Defense in Depth


    Never rely on a single point of defense. Your application is often the last layer
    between an attacker and back-end systems such as a database or a file server,
    which, in turn, may be connected to a corporate network. If your application is
    hacked, these systems may be exposed to the attacker. By using several layers
    of defensive techniques in your application such as input validation, secure SQL
    construction, and proper authentication and authorization, your application will
    be more resilient against attack.


    # Never Trust Input


    As you discovered in the example earlier in this chapter, a simple change to an
    input into the application may result in a security breach. Input is everything
    that comes into your application during run-time — user data, the click of a button,
    data loaded from a database or remote system, XML files, anything you know about
    your application is compiled. Every single piece of input should be validated
    and proved correct before you process it. If invalid input is sent to your application,
    then your application must cope with it, and not crash or otherwise act out.


    # Fail Gracefully


    Error handling is often the last developers add to their applications. Your customers
    want to see things working, not failings. As error handling is usually tested,
    and it can be difficult to test some error conditions through manual testing.
    The error messages raised during the Microsoft hack shown earlier in this chapter
    gave enough information to the attackers that they were able to inject arbitrary
    SQL commands. A combination of developer discipline, testing with unexpected,
    random, or invalid data, in combination with careful design, will ensure that
    all areas of your code (including error conditions) are securely constructed.


    # Watch for Attacks


    Even if you handle errors gracefully, you may not be logging what you caused.
    Without a logging strategy, you will miss potential attacks against your application,
    a valuable source of information that you can use to strengthen the next version.
    Error logging and a regular auditing of the error logs is vital in knowing what
    is happening to your Web site.


    # Use Least Privilege


    When I speak at user groups and conferences, I often ask how many people use an
    administrator account for development purposes. The majority of hands in the audience
    go up. It is often tempting to solve file access problems or database connection
    errors by running as a system account or a database administrator account. However,
    when an attacker takes over an application, the attacker runs as the user application
    under.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Your applications should run under the lowest privilege level possible. Your
    applications will rarely need access to C:\Windows or the capability to create
    and drop tables in a database. Even when you are developing with the built-in
    Web server provided with Visual Studio, it will run under your user account, with
    all the privileges you have, disguising any problems your application may have
    running in a locked-down environment. This should be developed for, and testing
    against, a least-privilege account.


    On rare occasions, a part of your application may need more access. This part
    can be extracted and run with elevated permissions under a different user context
    with a clearly defined (carefully tested) interface between the normal application
    and its privileged subsection.


    # Firewalls and Cryptography Are Not a Panacea


    There are two Web security fallacies I hear on a regular basis:


    +   - We have a firewall so we’re protected.


    +   - "Its encrypted, so it’s secure.


    Neither of these statements is itself true. Firewalls protect infrastructure,
    hiding services from the outside world and reducing the exposed surface area of
    your network. But in order for your application to be of any use, it must be exposed
    to its users, with the firewall configured to allow access. An application firewall
    is a relatively new addition to the market that monitors communication into your
    application for suspected attacks. Attacks are often customized to your application,
    and that is not something an application firewall can easily recognize.


    Cryptography, on the other hand, can be an effective security mechanism, but alone
    does not provide security. The security of the encryption keys, the algorithm
    used, the strength of passwords, and other factors impact the effectiveness of
    the cryptographic system. If one of these factors is weak, then your encryption
    can be easily cracked.


    # Security Should Be Your Default State


    The SQL Slammer taught Microsoft an invaluable lesson — don’t turn on unneeded
    functionality by default. The Slammer worm attacked the SQL browser, which isn’t
    used on most machines, but was enabled by default. You will now find that SQL
    2005 and SQL 2008, as well as Windows 2003 and beyond, Microsoft does not enable
    most services unless the administrator selects and configures them.


    Some common come use default passwords that a careless administrator or a non-technical
    end user will never change. As passwords become widely known, attackers will test
    Web sites using these to see if they can authenticate with them — and often they
    can. If your application contains authentication functionality, choose security
    settings. Randomly generate temporary passwords, rather than setting a default
    one. If your application contains optional functionality, do not install or expose
    it unless requested or required, reducing the attack surface exposed to a hacker.'
  merge: -1
