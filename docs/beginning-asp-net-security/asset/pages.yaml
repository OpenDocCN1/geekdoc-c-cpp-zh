  md: "WCF allows you to write your own username and password validation routines\
    \ in the System.IdentityModel assembly, which contains two classes that can be\
    \ used for custom validation: UserNamePasswordValidator (for user names and passwords)\
    \ and X509CertificateValidator (to allow for custom checking of client certificates).\n\
    \n# TRY IT OUT Writing a Custom Name Validation Class\n\nThis exercise shows you\
    \ how to write a custom name validation class.\n\n+   1. Firstly, add a reference\
    \ to the System.IdentityModel assembly in your service project and create a new\
    \ class called CustomValidator in the project.\n\n+   2. Create the custom validator\
    \ class as follows:\n\n```\nusing System;\nusing System.IdentityModel.Selectors;\n\
    using System.IdentityModel.Tokens;\n\nnamespace WCFSecurity\n{\n    public class\
    \ CustomValidator : UserNamePasswordValidator\n{\n        public override void\
    \ Validate(string userName, string password)\n        {\n            if (null\
