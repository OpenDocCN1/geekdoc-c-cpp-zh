  md: '# 182 | CHAPTER 7 ADDING USERN AND PASSWORDS


    Both these tools act upon the web.config file and place the rules they generate
    into an <authorization> section. You can examine these rules by opening your web.config
    file.


    Of course, you may find it easier to create rules by hand, rather than with a
    tool. You''ve already seen how to protect folders. To recap, the following configuration
    will stop all users from accessing any resources in the current directory or any
    of its subdirectories:


    ```

    <authorization>

    <deny users="*/>

    </authorization>

    ```


    The following authorization rule will reject any unauthenticated users accessing
    resources in the current directory and any subdirectories:


    ```

    <authorization>

    <deny users="*"/>

    </authorization>

    ```


    You can also specify specific users access, as shown in the next rule set, which
    will only allow access to the barry and plip users for access. For example, the
    following rule set will allow access to anyone


    ```

    <authorization>

    <allow users="barry, plip"/>

    <deny users="*"/>

    </authorization>

    ```


    As discussed earlier, using individual usernames is not a scalable solution. Instead,
    you can use roles as a basis for access. To allow access to anyone in the Finance
    role:


    ```

    <authorization>

    <allow roles="Finance"/>

    <deny users="*"/>

    </authorization>

    ```


    Finally, you can combine roles and users. The following rule set allows access
    to anyone in the Finance and Administrators role, as well as the named users barry
    andplip:


    ```

    <authorization>

    <allow roles="Finance, Administrators"/>

    <allow users="barry, plip"/>

    <deny users="*"/>

    </authorization>

    ```


    If you want to apply more granularity and control access to a single resource,
    you use the <location> element. This element sits outside the <system.web> settings,
    and initiates a new system.Web configuration document for that specific location.'
  merge: -1
  pgno: 188
- img_proc: true
  md: "For example, the following rule set has no authentication at all for a directory,\
    \ but turns on Windows authentication for the admin.aspx page in that directory,\
    \ and limits access to members of the Administrators group:\n\n```\n<configuration>\n\
    \  <system.web>\n    <authentication mode=\"None\" />\n  </system.web>\n\n  <location\
    \ path=\"admin.aspx\">\n    <system.web>\n      <authentication mode=\"Windows\"\
    \ />\n      <authorization>\n        <allow roles=\"Administrators\" />\n    \
    \    <deny users=\"*\" />\n      </authorization>\n    </system.web>\n  </location>\n\
    </configuration>\n```\n\nIf you want to change rules in subdirectories, simply\
    \ create another web.config fle in the subdirectory with appropriate rules. For\
    \ ASP.NET authorization, these rules will be evaluated before any rules in parent\
    \ directories. For IIS authentication, the parent rules will be evaluated\n\n\
    > NOTE One thing to think is access rules checking will not apply to forms authentication\
    \ login page (by default, login.aspx). After all, stopping users from accessing\
    \ that would be rather unhelpful!\n\n# Checking Users and Roles Programmatically\n\
    \nAt some point, you may wish to vary your page output based on a user's identity\
    \ or role membership You have already discovered how to do this — you can access\
    \ a user's authenticated identity using User.Identity() and a users role membership\
    \ via User.IsInRole().\n\nA common scenario for programmatic checking is to show\
    \ or hide controls based on a user’s identity — for example, adding a “Delete”\
    \ option to a form if you are an administrator. As part of a “defense in depth”\
    \ strategy, it is important that you check your rules during code execution, and\
    \ not just when creating the UI. For example, if you had an ASP.NET button for\
    \ a delete function and showed it based on a user's role during Page_Load(), you\
    \ should also check that the user belongs to the role in the method that handles\
    \ the OnClick() event.\n\n# Securing Object References\n\nChecking a user’s identity\
    \ name is essential to avoiding the Insecure Direct Object Reference vulnerability.\
    \ Chapter 4 introduced you to how query strings can be edited to manipulate object\
    \ references, and how you can use a GUID or indirect object reference to avoid\
    \ enabling"
  merge: -1
