- img_proc: true
  md: "Visual Studio provides a simple way to add performance counter categories in\
    \ a development environment. First, open the Visual Studio Server Explorer. Expand\
    \ the machine on which you want to create the counters, and right click on the\
    \ Performance Counters tree, and click Create New Category. You will be prompted\
    \ for the category name, a description, and at least one counter to add to the\
    \ new category. Like Windows events, only an administrator can create performance\
    \ counters and categories. Under Vista and Windows 2008, the program creating\
    \ the counters must be elevated.. You can also create the categories and counters\
    \ programmatically, as shown in the following example:\n\n```\nstring CounterCategory\
    \ = \"SecuringASNet\";\n\nif (!PerformanceCounterCategory.Exists(counterCategory))\
    \ {\n    PerformanceCounterCategory.Create(counterCategory,\n    \"My category\
    \ description/Helper\",\n    PerformanceCounterCategoryType.SingleInstance,\n\
    \    \"CounterName\",\n    \"Counter Description/Helper\"\n}\n```\n\nOne drawback\
    \ of performance counters is that it is not possible to programmatically add a\
    \ performance counter to an existing category (although Visual Studio allows you\
    \ to add a performance counter to a custom category by deleting and re-creating\
    \ it, its counters, and your new count). To create multiple counters, when creating\
    \ the category, you must create a CounterDataCollection. Using this collection\
    \ also allows you to specify the type of each counter, something the simple creation\
    \ method earlier does not.\n\n```\nstring counterCategory = \"SecuringASNet\"\
    ;\n\nif (!PerformanceCounterCategory.Exists(counterCategory)) {\n    CounterDataCollection\
    \ counterCreationDataCollection = \n    new CounterCreationDataCollection();\n\
    \n    counterCreationDataCollection.Add(\n        new CounterCreationData(\"BadGuysFound\"\
    ,\n        \"Total number of bad guys detected\",\n        PerformanceCounterType.NumberOfItems32\n\
    \    );\n\n    counterCreationDataCollection.Add(\n        new CounterCreationData(\"\
    BadGuysFoundSecond\",\n        \"How many bad guys have been detected\",\n   \
    \     PerformanceCounterType.RateOfCountsPerSecond32\n    );\n\n    PerformanceCounterCategory.Create(counterCategory,\n\
    \    \"My category description/Helper\",\n    PerformanceCounterCategoryType.SingleInstance,\n\
    \    counterCreationDataCollection);\n}\n```"
