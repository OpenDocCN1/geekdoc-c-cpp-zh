- img_proc: true
  md: '# 1.7 Keywords to Avoid


    Rules:


    +   a. The auto keyword shall not be used.

    b. The register keyword shall not be used.

    c. The goto keyword shall not be used.

    d. The continue keyword shall not be used.

    e. The break keyword shall not be used outside of a switch statement.


    Reasoning: The auto keyword is an unnecessary historical feature of the language.
    Some other features of the C language serve a purpose, but create more headaches
    than value. For example, the register keyword presumes the programmer is smarter
    than the compiler. Keywords goto, continue, and break often lead to spaghetti
    code.


    Exceptions: None.


    Enforcement: The presence of these keywords in new or modified source code shall
    be detected and reported via an automated tool at each build.'
  merge: -1
