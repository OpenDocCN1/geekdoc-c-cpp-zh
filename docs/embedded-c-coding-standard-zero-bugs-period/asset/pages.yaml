  md: Of course, a coding standard cannot by itself eliminate all of the bugs from
    a complex embedded system. This coding standard is one part of the Zero Bugs...
    Period™ firmware design methodology. Zero Bugs... Period emphasizes the critical
    role of developer training, software and system architecture, lightweight effective
    process, and the culture of a team or organization in keeping bugs out.
  merge: -1
