  md: '# 8 Expressions and Statements


    # 8.1 Variable Declarations


    Rules:


    +   a. The comma ('','') operator shall not be used within variable declarations.


    Example:


    ```

    char * x, y; // Is y supposed to be a pointer?

    ```


    Reasoning: The cost of placing each declaration on a line of its own is low. By
    contrast, the risk that either the compiler or a maintainer will misunderstand
    your intentions is high.


    Exceptions: None.


    Enforcement: These rules shall be enforced during code reviews.'
