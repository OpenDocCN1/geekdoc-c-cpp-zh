  md: '# Embedded C Coding Standard


    **Reasoning:** There are a large number of risks of errors stemming from incorrect
    use of floating point arithmetic; these are outside the scope of this document.¹13
    By default, C promotes all floating-point constants to double precision, which
    may be inefficient or unsupported on the target platform. However, many microcontrollers
    do not have any hardware support for floating point math. The compiler may not
    warn of these incompatibilities, instead performing the requested numerical operations
