  md: '# Embedded C Coding Standard


    operators (-> and , respectively) shall always be without surrounding spaces.


    +   The left and right brackets of the array subscript operator ([ and ]) shall
    always be without surrounding spaces.


    +   Expressions within parentheses shall always have no spaces adjacent to the
    left and right parenthesis characters.


    +   The left and right parentheses of the function call operator shall always
