  md: '# 5.2 Fixed-Width Integers


    Rules:


    +   Whenever the width, in bits or bytes, of an integer value matters in the program,
    one of the fixed width data types shall be used in place of char, short, int,
    long, or long long. The signed and unsigned fixed width integer types shall be
    as shown in the table below.¹12


    | Integer Width | Signed Type | Unsigned Type |

    | --- | --- | --- |

    | 8 bits | int8_t | uint8_t |

    | 16 bits | int16_t | uint16_t |

    | 32 bits | int32_t | uint32_t |

    | 64 bits | int64_t | uint64_t |


    +   The keywords short and long shall not be used.


    +   Use of the keyword char shall be restricted to the declaration of and operations
    concerning strings.


    > ¹²If program execution speed is also a consideration, note that the [C99] standard
    defines a set of “fastest” fixed-width types. For example, uint_fast8_t is the
    fastest integer type that can hold at 8 bits of unsigned data.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'Reasoning: The [C90] standard allows implementation-defined widths for char,
    short, int, long, and long long types, which leads to portability problems. The
    [C99] standard did not resolve this, but introduced the uniform type names, which
    are defined in the C99 header file <stdint.h>.


    Exceptions: In the absence of a C99-compliant compiler, it is acceptable to define
    the set of fixed width types in the table above as typedefs based on char, short,
    int, long, and long long. If this is done, use compile-time checks (such as static
    assertions) to have the compiler flag incorrect type definitions. It is acceptable
    to use the native types when C Standard Library functions are used—just be careful.


    Enforcement: At every build an automated tool shall scan for and flag the use
    of the keywords short and long, which are not to be used. Compliance with the
    other rules shall be checked during code reviews.'
