  md: '# 3.2 Alignment


    Rules:


    +   a. The names of variables within a series of declarations shall have their
    first characters aligned.


    +   b. The names of struct and union members shall have their first characters
    aligned.


    +   c. The assignment operators within a block of adjacent assignment statements
    shall be aligned.


    +   d. The # in a preprocessor directive shall always be located in column 1,
    except when indenting within a #if or #ifdef sequence.


    Reasoning: Visual alignment emphasizes similarity. A series of consecutive lines
    containing variable declarations is easily spotted and understood as a block.
    Blank lines and unrelated alignments should be used to visually distinguish unrelated
    blocks of code appearing nearby.


    Exceptions: None.


    Enforcement: These rules shall be enforced during code reviews.'
