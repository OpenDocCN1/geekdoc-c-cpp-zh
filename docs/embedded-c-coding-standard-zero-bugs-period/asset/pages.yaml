  md: "# Embedded C Coding Standard\n\nExample:\n\n```\nif (NULL == p_object)\n{\n\
    \    result = ERR_NULL_PTR;\n}\nelse if (p_object = malloc(sizeof(object_t)))\
    \ // No!\n{\n    ...\n}\nelse{\n    // Normal processing steps,\n    // which\
    \ require many lines of code.\n    ...\n}\n```\n\nReasoning: Long clauses can\
    \ distract the human eye from the decision-path logic. By putting the shorter\
    \ clause earlier, the decision path becomes easier to follow. (And easier to follow\
    \ is always good for reducing bugs.) Deeply nested if blocks are a sure sign of\
    \ a complex and fragile state machine implementation; there is always a safer\
    \ and more readable way to do the same thing.\n\nExceptions: For efficiency purposes,\
    \ it may be desirable to reorder the sequence of if-else clauses to ensure the\
    \ most frequent or most critical case is always found the fastest. Of course,\
    \ if-else statements are typically not as efficient as tables of function pointers\
    \ in terms of worst-case analysis."
