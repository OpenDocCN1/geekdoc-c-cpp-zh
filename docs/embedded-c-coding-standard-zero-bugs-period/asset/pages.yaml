    # ## 7.1 Naming Conventions


    Rules:


    +   - No variable shall have a name that is a keyword of C, C++, or any other
    well-known extension of the C programming language, including specifically K&R
    and C99. Restricted names include interrupt, inline, restrict, class, true, false,
    public, private, friend, and protected.

    - No variable shall have a name that overlaps with a variable name from the C
    standard library (e.g., errno).

    - No variable shall have a name that begins with an underscore.

    - No variable name shall be longer than 31 characters.

    - No variable name shall be shorter than 3 characters, including loop counters.22

    - No variable name shall contain any uppercase letters.


    > 22 This is because you can’t do a meaningful global search for “i”.'
