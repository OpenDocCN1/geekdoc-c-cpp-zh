  md: '# Embedded C Coding Standard


    +   - The number and severity of bugs introduced by the original programmer can
    be reduced through disciplined conformance with with certain coding practices,
    such as the placement of constants on the left side of equivalence (==) test.


    +   - The number and severity of bugs introduced by maintenance programmers can
    also be influenced by the original programmer. For example, appropriate use of
    portable fixed-width integer types (e.g., int32_t) ensures that no future port
    of the code will encounter an unexpected overflow.


    +   - The number and severity of bugs introduced by maintenance programmers can
    also be reduced through the disciplined use of consistent commenting and stylistic
    practices, so that everyone in an organization can more easily understand the
    meaning and proper use of variables, functions, and modules.'
