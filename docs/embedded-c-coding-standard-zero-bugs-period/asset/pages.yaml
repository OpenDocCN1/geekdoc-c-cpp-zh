  md: '# 8.2 If-Else Statements


    Rules:


    +   a. The shortest (measured in lines of code) of the if and else if clauses
    should be placed first.²⁶


    +   b. Nested if-else statements shall not be deeper than two levels. Use function
    calls or switch statements to reduce complexity and aid understanding.


    +   c. Assignments shall not be made within an if else if expression.


    +   d. Any if statement with an else if clause shall end with an else clause.²⁷


    ![](img/438827201b612eb034012d328f242030_85_0.png)


    > ²⁶ Thanks to [Holub] for putting this “formatting for readability” idea into
    words.


    > ²⁷ This is the equivalent of requiring a default case in every switch, as we
    do below.'
  merge: -1
