  - '[PAGE 55]


    # 4.3 Source Files


    Rules:


    +   a. Each source file shall include only the behaviors appropriate to control
    one “entity”. Examples of entities include encapsulated data types, active objects,
    peripheral drivers (e.g., for a UART), and communication protocols or layers (e.g.,
    ARP).


    +   b. Each source file shall be comprised of some or all the following sections,
    in the order listed: comment block; data type, constant, and macro definitions;
    static data declarations; private function prototypes; public function bodies;
    then private function bodies.


    +   c. Each source file shall always #include the header of the same name (e.g.,
    file adc.c should #include “adc.h”), to allow the compiler to confirm that each
    public function and its prototype match.


    +   d. Absolute paths shall not be used in include file names.


    +   e. Each source file shall be free of unused include files.


    +   f. No source file shall #include another source file.


    ![](img/438827201b612eb034012d328f242030_55_0.png)'
