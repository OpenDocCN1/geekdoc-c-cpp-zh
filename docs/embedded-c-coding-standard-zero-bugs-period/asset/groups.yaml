- md: "\n- 6. MISRA’s Guidelines for the Use of the C Language² are more restrictive\
    \ than this coding standard—but worthy of study. Deviation from any MISRA-C required\
    \ or advisory rule should be carefully considered. The authors of the MISRA-C\
    \ guidelines are knowledgeable of the risks of the use of C in safety-critical\
    \ systems. Our few known differences of opinion with [MISRA04] are identified\
    \ in the footnotes to this standard. Followers of Netrino’s coding standard may\
    \ wish to adopt the other rules of MISRA-C in addition to the rules found here.\n\
    \n- 7. To be effective, coding standards must be enforceable. Wherever two or\
    \ more competing rules would be similarly able to prevent bugs but only one of\
    \ those rules can be enforced automatically, the more enforceable rule is recommended.\n\
    \nIn the absence of a needed rule or a conflict between rules, the spirit of the\
    \ above principles should be applied to guide the decision.\n\n> ²[MISRA98] and\
    \ [MISRA04]\n\n# Embedded C Coding Standard\n\n# Enforcement Guidelines\n\nConformance\
    \ with this coding standard is mandatory.\nNon-conforming code shall be made to\
    \ meet these minimum standards. Non-conforming code shall be detected and removed\
    \ via automated scans, formal code inspections, or informal discovery. All code\
    \ that is submitted for a release of the software shall conform to these standards,\
    \ unless a deviation has been permitted.\n\n# Deviation Procedure\n\nAt the project\
    \ level, it is acceptable for another coding standard (such as the coding standard\
    \ of a client or partner) to be adopted instead of this one. In that case, all\
    \ members of the project team should follow the selected coding standard.\n\n\
    At the module level, it is only acceptable to deviate from this coding standard\
    \ with the approval of the project manager. The reason for the deviation and the\
    \ approver’s name shall be stated as close as possible to the scope of the deviation.\
    \ For example, a single deviation in a function should be documented in a block\
    \ comment within or above that function, whichever is most helpful to the next\
    \ reader.\n\n# Acknowledgements\n\nThough my name is the only one on the front\
    \ of this book, the development of Netrino’s Embedded C Coding Standard was a\
    \ collaborative effort, involving many at Netrino plus other members of the embedded\
    \ software community. I am specifically grateful to Nigel Jones, Jack Ganssle,\
    \ Jean Labrosse, and Miro Samek for publishing earlier firmware coding standards;\
    \ to Netrino’s Joe Perret and Salomon Singer for getting this project underway\
    \ in a big way; to Andrew Girson for the numerous discussions leading to Zero\
    \ Bugs.., to Elizabeth Gallaresi for handling various details; and to all of the\
    \ many technical reviewers who provided important feedback, including Mike Ficco,\
    \ JR Simma, Dan Smith, Michael Wilk, and several of the other folks already identified.\n\
    \n# Copyright Notice\n\nThis document and the information it contains is Copyright\
    \ © 2009 Netrino, LLC (www.netrino.com). It is allowable for individuals, companies,\
    \ and institutions to adopt all or some of the coding rules herein; indeed we\
    \ hope many will. This may be done simply by identifying the Netrino Embedded\
    \ C Coding Standard, and retaining this paragraph in its entirety. All other rights\
    \ are reserved by Netrino, LLC.\n\n# 1 General Rules\n\n## 1.1 Which C?\n\nRules:\n\
    \n- a. All programs shall be written to comply with the latest ISO Standard for\
    \ the C Programming Language, which is currently [C99].³\n- b. Whenever a C++\
    \ compiler is used, appropriate compiler options shall be set to restrict the\
    \ language to the latest standard C subset supported by the compiler.\n- c. The\
    \ use of proprietary compiler language keyword extensions, #pragmas, and inline\
    \ assembly shall be kept to the minimum necessary to get the job done and be localized\
    \ to a small number of device modules that interface directly to hardware.⁴\n\n\
    > ³ This deviates from [MISRA04] Rule 1.1. Compilers compatible with [C99] offer\
    \ many valuable improvements, including support for the fixed-width integer types,\
    \ C++ style comments, the ability to declare automatic variables where needed,\
    \ and inline functions. In the absence of a [C99]-compliant compiler, a [C90]-compliant\
    \ compiler shall be used.\n⁴ This appears to deviate from [MISRA04] Rule 1.1,\
    \ but is consistent with Rules 2.1 and 3.4, as well as MISRA-foreseen deviations\
    \ from Rule 1.1.\n\n# Embedded C Coding Standard\n\n**Reasoning:** Even “standard”\
    \ C varies by compiler, but we need as common of a platform as we can find to\
    \ make possible the rules and enforcement mechanisms that follow. C++ is a different\
    \ language and the use of C++ and C should not be mixed in the same design; C++\
    \ programmers should consult Netrino’s Embedded C++ Coding Standard, which differs\
    \ substantially from this document.\n\n**Exceptions:** These rules may be ignored\
    \ in the case that the compiler supports only an older version of the C standard.\n\
    \n**Enforcement:** These rules shall be enforced during code reviews.\n\n## 1.2\
    \ Line Widths\n\nRules:\n\n- a. The length of all lines in a program shall be\
    \ limited to a maximum of 80 characters.\n\n**Reasoning:** Code reviews and other\
    \ examinations are from time-to-time conducted on printed pages, which must be\
    \ free of distracting line wraps as well as missing (i.e., past the right margin)\
    \ characters. Line width rules also ease on-screen side-by-side code differencing.\n\
    \n**Exceptions:** None.\n\n**Enforcement:** Violations of this rule shall be detected\
    \ by an automated scan during each build.\n\n## 1.3 Braces\n\nRules:\n\n- a. Braces\
    \ shall always surround the blocks of code (a.k.a., compound statements), following\
    \ if, else, switch, while, do, and for statements; single statements following\
    \ these keywords shall also be surrounded by braces.\n- b. Each left brace (‘’)\
    \ shall appear by itself on the line below the start of the block it opens. The\
    \ corresponding right brace (‘’) shall appear by itself the appropriate number\
    \ of lines later in the file.\n\n**Reasoning:** There is considerable risk associated\
    \ with the presence of empty statements and single statements that are not surrounded\
    \ by braces. Code constructs like this are often associated with bugs when nearby\
    \ code is changed or commented out. This risk is entirely eliminated by the consistent\
    \ use of braces.\n\n**Exceptions:** None.\n\n**Enforcement:** The appearance of\
    \ a left brace after each if, else, switch, while, do, and for shall be enforced\
    \ by an automated tool at build time. The same or another tool shall be used to\
    \ enforce that all left braces are paired with right braces at the same level\
    \ of indentation.\n\n## 1.4 Parentheses\n\nRules:\n\n- a. Do not rely on C’s operator\
    \ precedence rules, as they may not be obvious to those who maintain the code.\
    \ To aid clarity, use parentheses (andor break long statements into multiple lines\
    \ of code) to ensure proper execution order within a sequence of operations.\n\
    - b. Unless it is a single identifier or constant, each operand of the logical\
    \ && and || operators shall be surrounded by parentheses.\n\nExample:\n\n```\n\
    if ((a < b) && (b < c))\n{\n    result = (3 * a) + b;\n}\nreturn result;\n```\n\
    \n**Exceptions:** None.\n\n**Enforcement:** These rules shall be enforced during\
    \ code reviews.\n\n## 1.5 Common Abbreviations\n\nRules:\n\n- a. Abbreviations\
    \ and acronyms should generally be avoided unless their meanings are widely and\
    \ consistently understood in the engineering community. The table below contains\
    \ a list of commonly used abbreviations and their meanings.\n- b. A table of additional\
    \ project-specific abbreviations and acronyms shall be maintained in a version-controlled\
    \ document.\n\nExamples: See Appendix C.\n\n**Exceptions:** Project-specific abbreviations\
    \ that do not conflict with the common abbreviations in this standard may be added\
    \ in the manner described above.\n\n**Enforcement:** Consistent use of these abbreviations\
    \ shall be enforced during code reviews.\n"
  mdcn: "\n\n- 6. MISRA《C 语言使用指南²》比本编码标准更严格——但具有研究价值。对任何 MISRA-C 强制或建议性规则的偏离都应审慎考虑。MISRA-C\
    \ 指南的作者对在安全关键系统中使用 C 语言的风险非常清楚。我们与 [MISRA04] 之间少数已的分歧已在本标准的脚注中列出。Netrino 编码标准的遵循者可能希望在采用此处找到的规则外，额外采用\
    \ MISRA-C 的其他规则。\n\n- 7. 为了确保有效，编码标准必须具有可执行性。每当两个或多个竞争性规则都能同样有效地防止错误，但只有其中一条规则可以自动执行时，建议采用更具执行性的规则。\n\
    \n在缺少所需规则或规则之间冲突的情况下，应应用上述原则的精神来指导决策。\n\n> ²[MISRA98] 和 [MISRA04]\n\n# 嵌入式 C 编码标准\n\
    \n# 执行指南\n\n遵守本编码标准是强制性的。\n不符合标准的代码应修改为符合这些最低标准。应通过自动化扫描、正式代码审查或非正式发现来检测并移除不符合的代码。所有提交发布的软件代码都应符合这些标准，除非已获得偏离许可。\n\
    \n# 偏离程序\n\n在项目层面，允许采用另一种编码标准（例如客户或合作伙伴的编码标准）。在这种情况下，项目团队的所有成员都应遵循所选的编码标准。\n\n\
    在模块层面，只有在项目经理批准的情况下才允许偏离本编码标准。偏离原因和批准人姓名应尽可能靠近偏离发生的范围进行说明。例如，函数中的单个偏离应记录在该函数内部或上方的块注释中，以对后续读者最有帮助为准。\n\
    \n# 致谢\n\n尽管书封面上只有我一个人的名字，但 Netrino 嵌入式 C 编码标准的开发是一项协作工作，涉及了 Netrino 的许多人员以及嵌入式软件社区的其他成员。我特别感谢\
    \ Nigel Jones、Jack Ganssle、Jean Labrosse 和 Miro Samek 出版早期的固件编码标准；感谢 Netrino 的\
    \ Joe Perret 和 Salomon Singer 大力推动了该项目；感谢 Andrew Girson 为实现“零缺陷”目标做出的无数讨论；感谢 Elizabeth\
    \ Gallaresi 处理各种细节；并感谢所有提供重要反馈的众多技术评审员，包括 Mike Ficco、JR Simma、Dan Smith、Michael\
    \ Wilk 以及已列出的其他人员。\n\n# 版权声明\n\n本文档及其包含的信息版权所有 © 2009 Netrino, LLC (www.netrino.com)。个人、公司和机构允许采用本文中的全部或部分编码规则；事实上，我们希望许多人能这样做。只需注明为\
    \ Netrino 嵌入式 C 编码标准并完整保留此段即可。所有其他权利由 Netrino, LLC 保留。\n\n# 1 通用规则\n\n## 1.1 使用哪种\
    \ C？\n\n规则：\n\n- a. 所有程序应按照最新的 C 语言 ISO 标准编写 [C99]。³\n- b. 每当使用 C++ 编译器时，应设置相应的编译器选项，将语言限制为编译器支持的最新标准\
    \ C 子集。\n- c. 专有编译器语言关键字扩展、#pragmas 和内联汇编的使用应保持在完成任务所需的最低限，并限制在直接与硬件接口的少数设备模块中⁴\n\
    \n> ³ 这偏离了 [MISRA04] 规则 1.1。兼容 [C99] 的编译器提供了许多极具价值的改进，包括支持固定宽度整数类型、C++ 风格注释、在需要时声明自动变量的能力以及内联函数。在没有符合\
    \ [C99] 的编译器的情况下，应使用符合 [C90] 的编译器。\n⁴ 这似乎偏离了 [MISRA04] 规则 1.1，但与规则 2.1 和 3.4 以及\
    \ MISRA 预见的对规则 1.1 的偏离保持一致。\n\n# 嵌入式 C 编码标准\n\n**推论：** 即使是“标准”C 也会随编译器而异，但我们需要尽可能通用的平台来实现后续的规则和执行机制。C++\
    \ 是一种不同的语言，不应在同一设计中混合使用 C++ 和 C；C++ 程序员应该查阅 Netrino 的嵌入式 C++ 编码标准，该标准与本文档有实质区别。\n\
    \n**异常：** 无。\n\n**执行：** 违反此规则的行为应在每次构建时通过自动化扫描检测。\n\n## 1.2 行宽\n\n规则：\n\n- a.\
    \ 程序中所有行的长度应限制为最大 80 个字符。\n\n**推论：** 代码审查和其他检查有时会在打印的页面上进行，这些页面必须没有分散注意的自动换行，也不有缺失（即超出右边距）的字符。行宽规则还便于屏幕上的侧并对比代码差异。\n\
    \n**异常：** 无。\n\n**执行：** 违反此规则的行为应在每次构建期间通过自动化扫描检测到。\n\n## 1.3 大括号\n\n规则：\n\n-\
    \ a. 在 if、else、switch、while、do 和 for 语句之后，大括号应始终围绕代码块（即复合语句）；紧随这些关键字的单语句也应用大括号括围。\n\
    - b. 每个左大括号（{）应位于其开启的代码块开始下方的单独行。对应的右大括号（}）应在文件适当的行数后单独出现。\n\n**推论：** 空语句和未用大括号括围的单语句存在巨大的风险。当附近的代码被更改或注释掉时，此类代码结构往往会引发错误。通过一致地使用大括号可以完全消除这种风险。\n\
    \n**异常：** 无。\n\n**执行：** 构建时应通过自动化工具强制要求每个 if、else、switch、while、do 和 for 之后出现左大括号。应使用相同或另一个工具强制所有左大括号与相同缩进级别的右大括号配对。\n\
    \n## 1.4 括号\n\n规则：\n\n- a. 不要依赖 C 的运算符优先级规则，因为这些规则对于维护代码的人来说可能并不直观。为了提高清晰度，请使用括号（并将长语句拆分为多行代码）以确保操作序列中正确的执行顺序。\n\
    - b. 除非是单个标识符或常量，逻辑 && 和 || 运算符的每个操作数都应用括号括。\n\n示例：\n\n```\nif ((a < b) && (b\
    \ < c))\n{\n    result = (3 * a) + b;\n}\nreturn result;\n```\n\n**异常：** 无。\n\n\
    **执行：** 这些规则应在代码审查期间执行。\n\n## 1.5 常用缩写\n\n规则：\n\n- a. 除非其含义在工程社区中被广泛且一致地理解，否则应避免使用缩写和术语。下表列出了常用缩写及其含义。\n\
    - b. 应在版本控制文档中维护一个额外的项目特定缩写和术语表。\n\n示例：参见附录 C。\n\n**异常：** 与本标准中的常用缩写不冲突的项目特定缩写可以按上述方式添加。\n\
    \n**执行：** 在代码审查期间应强制执行这些缩写的一致使用。\n\n"
