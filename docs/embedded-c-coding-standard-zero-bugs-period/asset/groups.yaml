    # Michael Bart


    Michael Bart is an internationally recognized expert on the design of embedded
    computer systems. In that role, he has provided expert testimony in federal and
    civil court, appeared on PBS American Business Review, and quoted in various newspapers.


    He is also the author of two books and more than forty articles on related objects
    and is the creator of Netrino''s Zero Bugs...Period design methodology. For years
    and a half Netrino served as editor-in-chief of Embedded Systems Programming.


    In addition, Michael has been a member of the advisory board of the Embedded Systems
    Group, where he continues to work millions of products. Michael holds B.S. and
    M.S. degrees and has lectured the department of Electrical and Computer Engineering
    at the University of Maryland, from which he earned an MBA.


