    # Embedded C Coding Standard


    The primary reason for adopting this coding standard is to reduce the number of
    bugs present in embedded software (a.k.a., firmware) and in code later added or
    modified by maintainers. Of course, a coding standard cannot by itself eliminate
    all of the bugs from a complex embedded system. This coding standard is rather
    a part of Netrino''s Zero Bugs...Period™ design methodology.


    The Zero Bugs...Period (ZBP) methodology is a lightweight system of best practices
    to keep bugs out of embedded software. ZBP solves the recurring problems of missed
    schedules and buggy firmware. Adherence reduces bugs and keeps their schedules
    back on track by applying ZBP''s overlapping layers of development, architecture
    and culture improvements. ZBP emphasizes the importance of software and system
    architecture as well as programmer skills and training key elements of process,
    such as design reviews, code reviews, and control.


    Other reasons for adopting this standard include increasing the readability and
    portability of software, so that firmware may be maintained and reused at lower
    cost. A coding standard benefits a team of developers and larger organization
    by reducing the time required to understand or review work of peers.


