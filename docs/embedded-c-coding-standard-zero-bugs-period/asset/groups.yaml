- md: "\n## 6.4 Tasks\n\nRules:\n\n- a. All functions that represent tasks (a.k.a.,\
    \ threads) shall be given names ending with \"_task\" (or \"_thread\").\n\nExample:\n\
    \n```c\nvoid\nalarm_task (void * p_data)\n{\n    alarm_t alarm = ALARM_NONE;\n\
    \    int err = OS_NO_ERR;\n\n    for (;;)\n{\n        alarm = OsmboxPend(alarm_mbox,\
    \ &err);\n        // Process alarm here.\n    }\n}\n```\n\nEach task in a real-time\
    \ operating system (RTOS) is like a mini-main(), typically running forever in\
    \ an infinite loop. It is valuable to easily identify these important functions\
    \ during code reviews and debugging sessions.\n\nExceptions: Alternatively, \"\
    _thread\" may be used.\n\n**Enforcement:** This naming convention shall be enforced\
    \ during the detailed design phase and in code reviews.\n\n## 6.5 Interrupt Service\
    \ Routines\n\nRules:\n\n- a. Interrupt service routines (ISRs) are not ordinary\
    \ functions. The compiler must be informed that the function is an ISR by way\
    \ of a #pragma or compiler-specific keyword, such as “__interrupt”.\n\n- b. All\
    \ functions that implement ISRs shall be given names ending with “_isr”.\n\n-\
    \ c. To ensure ISRs are not inadvertently called from other parts of the software\
    \ (they may corrupt the CPU and call stack if this happens), each ISR function\
    \ shall lack a prototype, be declared static, and be located at the end of the\
    \ associated driver module.²⁰\n\n- d. A stub or default ISR shall be installed\
    \ in the vector table at the location of all unexpected or unhandled interrupt\
    \ sources. Each such stub will attempt to disable future interrupts of the same\
    \ type, say at the interrupt controller, and assert().²¹\n\n![](img/438827201b612eb034012d328f242030_77_0.png)\n\
    \n²⁰ Be warned that a smart static analysis tool, such as lint, will likely complain\
    \ about this unreachability.\n\n²¹ Although this doesn’t prevent any bugs, it\
    \ sure does help bugs in the hardware and makes the system more robust.\n\nEmbedded\
    \ C Coding Standard\n\n**Reasoning:** An ISR is an extension of the hardware.\
    \ By definition, it and the straight-line code are asynchronous to each other.\
    \ If they share global data, that data must be protected with interrupt disables\
    \ in the straight-line code. The ISR must not get hung up inside the operating\
    \ system or waiting for a variable or register to change value.\n\n**Exceptions:**\
    \ None.\n\n**Enforcement:** These rules shall be enforced during code reviews.\n\
    \n## 7 Variables\n\n### 7.1 Naming Conventions\n\nRules:\n\n- No variable shall\
    \ have a name that is a keyword of C, C++, or any other well-known extension of\
    \ the C programming language, including specifically K&R and C99. Restricted names\
    \ include interrupt, inline, restrict, class, true, false, public, private, friend,\
    \ and protected.\n- No variable shall have a name that overlaps with a variable\
    \ name from the C standard library (e.g., errno).\n- No variable shall have a\
    \ name that begins with an underscore.\n- No variable name shall be longer than\
    \ 31 characters.\n- No variable name shall be shorter than 3 characters, including\
    \ loop counters.22\n- No variable name shall contain any uppercase letters.\n\n\
    > 22 This is because you can’t do a meaningful global search for “i”.\n\n- g.\
    \ No variable name shall contain any numeric value that is called out elsewhere,\
    \ such as the number of elements in an array or the number of bits in the underlying\
    \ type.\n- h. Underscores shall be used to separate words in variable names.\n\
    - i. Each variable’s name shall be descriptive of its purpose.\n- j. The names\
    \ of all global variables shall begin with the letter ‘g’. For example, g_zero_offset.\n\
    - k. The names of all pointer variables shall begin with the letter ‘p’. For example,\
    \ *p_led_reg.\n- l. The names of all pointer-to-pointer variables shall begin\
    \ with the letter pp. For example, gpp_vector_table.\n- m. The names of all integer\
    \ variables containing “effectively Boolean” information (i.e., 0 vs. non-zero)\
    \ shall begin with the letter ‘b’ and be phrased as the question they answer.²³\
    \ For example, b_done_yet or gb_is_buffer_full.\n\n> ³It is unsafe, in C, to define\
    \ constants such as TRUE and FALSE where TRUE is equal to 1. However, it is safe\
    \ to compare “effectively Boolean” integer values against 0. For example, the\
    \ test “if (!gb_buffer_is_full)” is safe and consistent with Rule 13.2.\n\n**Reasoning:**\
    \ The base rules are adopted to maximize code portability across compilers. Many\
    \ C compilers recognize differences only in the first 31 characters in a variable’s\
    \ name and reserve names beginning with an underscore internal names. The other\
    \ rules are meant to highlight risks and ensure consistent proper use of variables.\n\
    \n**Exceptions:** None.\n\n**Enforcement:** These variable-naming rules shall\
    \ be enforced during code reviews.\n\n(advisory) of [MISRA04]. Note also that\
    \ [C99] adds <stdbool.h>, which defines a *bool* type and constants *true* and\
    \ *false*.\n\nEmbedded C Coding Standard\n\n### 7.2 Initialization\n\nRules:\n\
    \n- a. All variables shall be initialized before use.\n- b. It is preferable to\
    \ create variables as you need them, rather than at the top of the function.24\n\
    \n![](img/438827201b612eb034012d328f242030_82_0.png)\n\nExample:\n\n```c\nfor\
    \ (int loop = 0; loop < MAX_LOOPS; loop++)\n{\n  ...\n}\n```\n\n**Reasoning:**\
    \ Many programmers assume the runtime will watch out for them. By placing variables\
    \ closer to their use aids readability.25.\n\n**Exceptions:** None.\n\n> 24 One\
    \ study of back-and-forth eye movements ([Uwano]) demonstrated 25 the importance\
    \ of placing variables closer to their use.\n\nEnforcement: An automated tool\
    \ shall scan all of the source code prior to initialization. Lint is an example\
    \ of a tool that can do this.\n\n## 8 Expressions and Statements\n\n### 8.1 Variable\
    \ Declarations\n\nRules:\n\n- a. The comma (',') operator shall not be used within\
    \ variable declarations.\n\nExample:\n\n```c\nchar * x, y; // Is y supposed to\
    \ be a pointer?\n```\n\n**Reasoning:** The cost of placing each declaration on\
    \ its own is low. By contrast, the risk that either the compiler or a maintainer\
    \ will misunderstand your intentions is high.\n\n**Exceptions:** None.\n\n###\
    \ 8.2 If-Else Statements\n\nRules:\n\n- a. The shortest (measured in lines of\
    \ code) of the if and else clauses should be placed first.²⁶\n- b. Nested if-else\
    \ statements shall not be deeper than two levels. Use function calls or switch\
    \ statements to reduce complexity.\n- c. Assignments shall not be made within\
    \ an else expression.\n- d. Any if statement with an else if clause shall end\
    \ with an else clause.⁷\n\n![](img/438827201b612eb034012d328f242030_85_0.png)\n\
    \n> ²⁶ Thanks to [Holub] for putting this “formatting for readability” idea into\
    \ words.\n\n> ²⁷ This is the equivalent of requiring a default case in every switch,\
    \ as we do below.\n\nExample:\n\n```c\nif (NULL == p_object)\n{\n    result =\
    \ ERR_NULL_PTR;\n}\nelse if (p_object = malloc(sizeof(object_t))) // No!\n{\n\
    \    ...\n}\nelse{\n    // Normal processing steps,\n    // which require many\
    \ lines of code.\n    ...\n}\n```\n\n**Reasoning:** Long clauses can distract\
    \ the human eye from the decision-path logic. By putting the shorter clause earlier,\
    \ the decision path becomes easier to follow. (And easier to follow is always\
    \ good for reducing bugs.)\n\n"
