    Of course, a coding standard cannot by itself eliminate all of the bugs from a
    complex embedded system. This coding standard is one part of the Zero Bugs...
    Period™ firmware design methodology. Zero Bugs... Period emphasizes the critical
    role of developer training, software and system architecture, lightweight effective
    process, and the culture of a team or organization in keeping bugs out.


    # Embedded C Coding Standard


    Other important reasons for adopting this coding standard include increasing the
    readability and portability of software, so that firmware may be maintained and
    reused at lower cost. A coding standard benefits a team of developers and larger
    organization by reducing the time required by individuals to understand or review
    the work of peers.


    # Guiding Principles


    This coding standard was developed in accordance with the following guiding principles,
    which served to focus the authors’ attention and eliminate conflict over items
    that are sometimes viewed by programmers as personal stylistic preferences:


    - 1. Individual programmers do not own the software they write. All software development
    is work for hire for an employer or a client and, thus, the end product should
    be constructed in a workmanlike manner.


    - 2. It is cheaper and easier to prevent a bug from creeping into code than it
    is to find and kill it after it has entered. A key strategy in this fight is to
    write code in which the compiler, linker, or a static analysis tool can detect
    bugs automatically—i.e., before the code is allowed to execute.


    www.netrino.com


    - 3. For better or worse (well, mostly worse), the ISO “standard” C programming
    language allows for a significant amount of variability in the decisions made
    by compiler implementers. These many-called “implementation-defined,” “unspecified,”
    and “undefined” behaviors, along with “locale-specific options”, mean that programs
    compiled from identical C source code may behave very differently at run-time.
    Such gray areas in the language standard greatly reduce the portability of C programs
    that are not carefully crafted.


    - 4. This coding standard prioritizes code reliability and portability above execution
    efficiency or programmer convenience.


    - 5. There are many sources of bugs in software programs. The original programmer
    creates some bugs. Other bugs result from misunderstandings by those who later
    maintain, extend, port, and/or reuse the code.


    ¹C90] and [C99]


    # Embedded C Coding Standard


    - The number and severity of bugs introduced by the original programmer can be
    reduced through disciplined conformance with certain coding practices, such as
    the placement of constants on the left side of equivalence (==) test.


    - The number and severity of bugs introduced by maintenance programmers can also
    be influenced by the original programmer. For example, appropriate use of portable
    fixed-width integer types (e.g., int32_t) ensures that no future port of the code
    will encounter an unexpected overflow.


    - The number and severity of bugs introduced by maintenance programmers can also
    be reduced through the disciplined use of consistent commenting and stylistic
    practices, so that everyone in an organization can more easily understand the
    meaning and proper use of variables, functions, and modules.

    '
