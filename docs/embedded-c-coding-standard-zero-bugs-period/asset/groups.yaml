  - '[PAGE 25]


    # 1.7 Keywords to Avoid


    Rules:


    +   a. The auto keyword shall not be used.

    b. The register keyword shall not be used.

    c. The goto keyword shall not be used.

    d. The continue keyword shall not be used.

    e. The break keyword shall not be used outside of a switch statement.


    Reasoning: The auto keyword is an unnecessary historical feature of the language.
    Some other features of the C language serve a purpose, but create more headaches
    than value. For example, the register keyword presumes the programmer is smarter
    than the compiler. Keywords goto, continue, and break often lead to spaghetti
    code.


    Exceptions: None.


    Enforcement: The presence of these keywords in new or modified source code shall
    be detected and reported via an automated tool at each build.'
  - '[PAGE 26]


    <!-- no content -->'
  - '[PAGE 27]


    # 1.8 Keywords to Frequent


    Rules:


    +   a. The static keyword shall be used to declare all functions and variables
    that do not need to be visible outside of the module in which they are declared.


    +   b. The const keyword shall be used whenever appropriate. Examples include:

    ni. To declare variables that should not be changed after initialization,

    ii. To define call-by-reference function parameters that should not be modified
    (e.g., char const * param),

    iii. To define fields in structs and unions that should not be modified (e.g.,
    in a struct overlay for memory-mapped I/O peripheral registers), and

    iv. As a strongly typed alternative to #define for numerical constants.


    +   c. The volatile keyword shall be used whenever appropriate. Examples include:

    i. To declare a global variable accessible (by current use or scope) by any interrupt
    service routine,'
  - '[PAGE 28]


    # Embedded C Coding Standard


    +   ii. To declare a global variable accessible (by current use or scope) by two
    or more tasks,


    +   iii. To declare a pointer to a memory-mapped I/O peripheral register set (e.g.,
    timer_t volatile const p_timer), and


    +   iv. To declare a delay loop counter.


    Reasoning: C’s static keyword has several meanings. At the module-level, global
    variables and functions declared static are protected from external use. Heavy-handed
    use of static in this way decreases coupling between modules. The const and volatile
    keywords are even more important. The upside of using const as much as possible
    is compiler-enforced protection from unintended writes to data that should be
    read-only. Proper use of volatile eliminates a whole class of difficult-to-detect
    bugs by preventing compiler optimizations that would eliminate requested reads
    or writes to variables or registers⁵


    Exceptions: None.


    > ⁵ Anecdotal evidence suggests that programmers unfamiliar with the volatile
    keyword think their compiler’s optimization feature is more broken than helpful
    and disable optimization. We believe that the vast majority of embedded systems
    contain bugs waiting to happen due to missing volatile keywords. Such bugs typically
    manifest themselves as “glitches” or only after changes are made to a “proven”
    code base.


    28'
  - '[PAGE 29]


    **Enforcement**: Appropriate use of these important keywords shall be enforced
    during code reviews.'
  - '[PAGE 30]


    # Embedded C Coding Standard


    # 2 Comments


    # 2.1 Acceptable Formats


    Rules:


    +   a. Single-line comments in the C++ style (i.e., preceded by //) are a useful
    and acceptable alternative to traditional C style comments (i.e., /* ... */).^6


    +   b. Comments shall never be nested.


    +   c. Comments shall never be used to disable a block of code, even temporarily.


    +   i. To temporarily disable a block of code, use the preprocessor''s conditional
    compilation feature (e.g., #if 0 ... #endif). No block of temporarily disabled
    code shall remain in the source code of a release candidate.


    ![](img/438827201b612eb034012d328f242030_30_0.png)


    ![](img/438827201b612eb034012d328f242030_30_1.png)


    > ^6 This is a deviation from [MISRA04] Rule 2.2, which we feel will not affect
    the number or severity of firmware bugs. The C++ "single-line" style makes comments
    easier to align and maintain. In addition this deviation is consistent with our
    choice of the [C99] language, which officially added single-line comments to the
    C language.'
  - '[PAGE 31]


    ii. Any line or block of code that exists specifically to increase the level of
    debugging output information shall be surrounded by #ifdef NDEBUG ... #endif.
    In this way, useful debug code may be maintained in production code, as the ability
    to gather additional information is often desirable after development is done.


    # Reasoning: Nested comments and commented-out code both run the risk of allowing
    unexpected snippets of code to be compiled into the final executable. This can
    happen, for example, in the case of sequences such as /* code-out /* comment */
    / code-in */.*


    # Exceptions: None.


    # Enforcement: The use of only acceptable comment formats can only be partially
    enforced by the compiler or static analysis. The avoidance of commented-out code,
    for example, must be enforced during code reviews.


    > 7 Our choice of negative-logic NDEBUG is deliberate, as that constant is associated
    with disabling the assert() macro. In both cases, the programmer acts to disable
    the verbose code. It’s also good to have just one of these #defines to keep track
    of.'
  - '[PAGE 32]


    # Embedded C Coding Standard


    # 2.2 Location and Content


    Rules:


    +   a. All comments shall be written in clear and complete sentences, with proper
    spelling and grammar and appropriate punctuation.


    +   b. The most useful comments generally precede a block of code that performs
    one step of a larger algorithm.⁸ A blank line shall follow each such code block.
    The comments in front of the block should be at the same indentation level.


    +   c. Avoid explaining the obvious. Assume the reader knows the C programming
    language. For example, end-of-line comments should only be used in exceptional
    circumstances, where the meaning of one line of code may be unclear from the variable
    and function names and operations alone but where a short comment makes it clear.
    Avoid writing unhelpful and redundant comments such as “shift left 2 bits”.


    > ⁸ It is a good practice to write the comment blocks first, as you should not
    begin the coding until you can explain the logic, algorithm, or sequence of steps
    in words.'
  - '[PAGE 33]


    +   d. The number and length of individual comment blocks shall be proportional
    to the complexity of the code they describe.


    +   e. Whenever an algorithm or technical detail has come from a published source,
    the comment shall include a sufficient reference to the original source (via book
    title, website URL, or other details) to allow a reader of the code to find the
    cited reference material.


    +   f. Whenever a flow-chart or other diagram is needed to sufficiently document
    the code, the drawing shall be maintained with the source code under version control
    and the comments should reference the diagram by file name or title.


    +   g. All assumptions shall be spelled out in comments.9


    +   h. Each module and function shall be commented in a manner suitable for automatic
    documentation generation via Doxygen (www.doxygen.org).


    > 9 Of course, a set of design-by-contract tests or assertions is even better
    than comments.'
  - '[PAGE 34]


    # Embedded C Coding Standard


    +   i. Use the following capitalized comment markers to highlight important issues:


    +   ii. "WARNING: alerts a maintainer there is risk in changing this code. For
    example, that a delay loop counter''s terminal value was determined empirically
    and may need to change when the code is ported or the optimization level tweaked.


    +   iii. "NOTE: provides descriptive comments about the "why" of a chunk of code—as
    distinguished from the "how" usually placed in comments. For example, a chunk
    of driver code deviates from the datasheet because there was an errata in the
    chip. Or that an assumption is being made by the original programmer.


    +   iv. "TODO: indicates an area of the code is still under construction and explains
    what remains to be done. When appropriate, an all-caps programmer name or set
    of initials may be included before the word TODO (e.g., "MJB TODO:").


