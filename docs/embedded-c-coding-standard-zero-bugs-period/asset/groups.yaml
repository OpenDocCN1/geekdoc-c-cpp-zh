    # 8.6 Equivalence Tests


    Rules:


    +   a. When evaluating the equality or inequality of a variable with a constant
    value, always place the constant value on the left side of the comparison operator,
    as shown in the if-else example above.


    Reasoning: It is always desirable to detect possible typos and as many other bugs
    as possible at compile-time; runtime discovery may be dangerous to the user of
    the product and require significant effort to localize. By following this rule,
    the compiler can detect erroneous attempts to assign (i.e., = instead of ==) a
    new value to a constant.


    Exceptions: None.


    Enforcement: A static analysis tool shall be configured to raise an error or warning
    about all assignment statements where comparisons are ordinarily expected.


