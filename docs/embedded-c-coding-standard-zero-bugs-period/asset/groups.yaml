  - '[PAGE 13]


    # 1 General Rules


    # 1.1 Which C?


    Rules:


    +   a. All programs shall be written to comply with the latest ISO Standard for
    the C Programming Language, which is currently [C99].³

    b. Whenever a C++ compiler is used, appropriate compiler options shall be set
    to restrict the language to the latest standard C subset supported by the compiler.

    c. The use of proprietary compiler language keyword extensions, #pragmas, and
    inline assembly shall be kept to the minimum necessary to get the job done and
    be localized to a small number of device modules that interface directly to hardware.⁴


    > ³ This deviates from [MISRA04] Rule 1.1. Compilers compatible with [C99] offer
    many valuable improvements, including support for the fixed-width integer types,
    C++ style comments, the ability to declare automatic variables where needed, and
    inline functions. In the absence of a [C99]-compliant compiler, a [C90]-compliant
    compiler shall be used.

    ⁴ This appears to deviate from [MISRA04] Rule 1.1, but is consistent with Rules
    2.1 and 3.4, as well as MISRA-foreseen deviations from Rule 1.1.'
  - '[PAGE 14]


    # Embedded C Coding Standard


    **Reasoning:** Even “standard” C varies by compiler, but we need as common of
    a platform as we can find to make possible the rules and enforcement mechanisms
    that follow. C++ is a different language and the use of C++ and C should not be
    mixed in the same design; C++ programmers should consult Netrino’s Embedded C++
    Coding Standard, which differs substantially from this document.


    **Exceptions:** These rules may be ignored in the case that the compiler supports
    only an older version of the C standard.


    **Enforcement:** These rules shall be enforced during code reviews.'
  - '[PAGE 15]


    # 1.2 Line Widths


    Rules:


    +   a. The length of all lines in a program shall be limited to a maximum of 80
    characters.


    **Reasoning:** Code reviews and other examinations are from time-to-time conducted
    on printed pages, which must be free of distracting line wraps as well as missing
    (i.e., past the right margin) characters. Line width rules also ease on-screen
    side-by-side code differencing.


    **Exceptions:** None.


    **Enforcement:** Violations of this rule shall be detected by an automated scan
    during each build.'
  - '[PAGE 16]


    <!-- no content -->'
  - '[PAGE 17]


    # 1.3 Braces


    Rules:


    +   a. Braces shall always surround the blocks of code (a.k.a., compound statements),
    following if, else, switch, while, do, and for statements; single statements and
    empty statements following these keywords shall also always be surrounded by braces.


    +   b. Each left brace (‘’) shall appear by itself on the line below the start
    of the block it opens. The corresponding right brace (‘’) shall appear by itself
    in the same position the appropriate number of lines later in the file.


    **Reasoning:** There is considerable risk associated with the presence of empty
    statements and single statements that are not surrounded by braces. Code constructs
    like this are often associated with bugs when nearby code is changed or commented
    out. This risk is entirely eliminated by the consistent use of braces. The placement
    of the left brace on the following line allows for easy visual checking for the
    corresponding right brace.


    **Exceptions:** None.'
  - '[PAGE 18]


    Embedded C Coding Standard


    **Enforcement:** The appearance of a left brace after each if, else, switch, while,
    do, and for shall be enforced by an automated tool at build time. The same or
    another tool shall be used to enforce that all left braces are paired with right
    braces at the same level of indentation.'
  - "[PAGE 19]\n\n# 1.4 Parentheses\n\nRules:\n\n+   a. Do not rely on C’s operator\
    \ precedence rules, as they may not be obvious to those who maintain the code.\
    \ To aid clarity, use parentheses (and /or break long statements into multiple\
    \ lines of code) to ensure proper execution order within a sequence of operations.\n\
    \n+   b. Unless it is a single identifier or constant, each operand of the logical\
    \ && and || operators shall be surrounded by parentheses.\n\nExample:\n\n```\n\
    if ((a < b) && (b < c))\n{\n    result = (3 * a) + b;\n}\nreturn result;\n```\n\
    \nExceptions: None.\n\nEnforcement: These rules shall be enforced during code\
    \ reviews."
