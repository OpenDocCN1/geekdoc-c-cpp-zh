- md: "\n# 1.6 Casts\n\nRules:\n\n+   a. Each cast shall feature an associated comment\
    \ describing how the code ensures proper behavior across the range of possible\
    \ values on the right side.\n\nExample:\n\n```\nint\nabs (int arg)\n{\n    return\
    \ ((arg < 0) ? -arg : arg);\n}\n```\n\n```\nunsigned int y;\ny = adc_read();\n\
    z = abs((int) y); // A risky cast.\n```\n\nReasoning: Casting is dangerous. In\
    \ the example above, unsigned y can take a larger range of positive values than\
    \ a signed integer. In that case, the absolute value will be incorrect as well.\
    \ The above cast was likely used to quiet an important warning about possible\
    \ loss of precision.\n\nExceptions: None.\n\nEnforcement: These rules shall be\
    \ enforced during code reviews.\n\n# 1.7 Keywords to Avoid\n\nRules:\n\n+   a.\
    \ The auto keyword shall not be used.\n+   b. The register keyword shall not be\
    \ used.\n+   c. The goto keyword shall not be used.\n+   d. The continue keyword\
    \ shall not be used.\n+   e. The break keyword shall not be used outside of a\
    \ switch statement.\n\nReasoning: The auto keyword is an unnecessary historical\
    \ feature of the language. Some other features of the C language serve a purpose,\
    \ but create more headaches than value. For example, the register keyword presumes\
    \ the programmer is smarter than the compiler. Keywords goto, continue, and break\
    \ often lead to spaghetti code.\n\nExceptions: None.\n\nEnforcement: The presence\
    \ of these keywords in new or modified source code shall be detected and reported\
    \ via an automated tool at each build.\n\n# 1.8 Keywords to Frequent\n\nRules:\n\
    \n+   a. The static keyword shall be used to declare all functions and variables\
    \ that do not need to be visible outside of the module in which they are declared.\n\
    \n+   b. The const keyword shall be used whenever appropriate. Examples include:\n\
    \    i. To declare variables that should not be changed after initialization,\n\
    \    ii. To define call-by-reference function parameters that should not be modified\
    \ (e.g., char const * param),\n    iii. To define fields in structs and unions\
    \ that should not be modified (e.g., in a struct overlay for memory-mapped I/O\
    \ peripheral registers), and\n    iv. As a strongly typed alternative to #define\
    \ for numerical constants.\n\n+   c. The volatile keyword shall be used whenever\
    \ appropriate. Examples include:\n    i. To declare a global variable accessible\
    \ (by current use or scope) by any interrupt service routine,\n+    ii. To declare\
    \ a global variable accessible (by current use or scope) by two or more tasks,\n\
    +    iii. To declare a pointer to a memory-mapped I/O peripheral register set\
    \ (e.g., timer_t volatile const p_timer), and\n+    iv. To declare a delay loop\
    \ counter.\n\nReasoning: C’s static keyword has several meanings. At the module-level,\
    \ global variables and functions declared static are protected from external use.\
    \ Heavy-handed use of static in this way decreases coupling between modules. The\
    \ const and volatile keywords are even more important. The upside of using const\
    \ as much as possible is compiler-enforced protection from unintended writes to\
    \ data that should be read-only. Proper use of volatile eliminates a whole class\
    \ of difficult-to-detect bugs by preventing compiler optimizations that would\
    \ eliminate requested reads or writes to variables or registers⁵\n\nExceptions:\
    \ None.\n\n> ⁵ Anecdotal evidence suggests that programmers unfamiliar with the\
    \ volatile keyword think their compiler’s optimization feature is more broken\
    \ than helpful and disable optimization. We believe that the vast majority of\
    \ embedded systems contain bugs waiting to happen due to missing volatile keywords.\
    \ Such bugs typically manifest themselves as “glitches” or only after changes\
    \ are made to a “proven” code base.\n\n**Enforcement**: Appropriate use of these\
    \ important keywords shall be enforced during code reviews.\n\n# 2 Comments\n\n\
    # 2.1 Acceptable Formats\n\nRules:\n\n+   a. Single-line comments in the C++ style\
    \ (i.e., preceded by //) are a useful and acceptable alternative to traditional\
    \ C style comments (i.e., /* ... */).^⁶\n+   b. Comments shall never be nested.\n\
    +   c. Comments shall never be used to disable a block of code, even temporarily.\n\
    +    i. To temporarily disable a block of code, use the preprocessor's conditional\
    \ compilation feature (e.g., #if 0 ... #endif). No block of temporarily disabled\
    \ code shall remain in the source code of a release candidate.\n\n![](img/438827201b612eb034012d328f242030_30_0.png)\n\
    ![](img/438827201b612eb034012d328f242030_30_1.png)\n\n> ^⁶ This is a deviation\
    \ from [MISRA04] Rule 2.2, which we feel will not affect the number or severity\
    \ of firmware bugs. The C++ \"single-line\" style makes comments easier to align\
    \ and maintain. In addition this deviation is consistent with our choice of the\
    \ [C99] language, which officially added single-line comments to the C language.\n\
    \n    ii. Any line or block of code that exists specifically to increase the level\
    \ of debugging output information shall be surrounded by #if 0 ... #endif.\n\n\
    Reasoning: Nested comments and commented-out code both run the risk of allowing\
    \ unexpected code to be compiled into the executable.\n\nExceptions: None.\n\n\
    Enforcement: The use of comment formats can only be partially enforced by static\
    \ analysis.\n\n> ⁷ Our choice of #ifdef is deliberate, as associated with the\
    \ macro.\n\n# 2.2 Location and Content\n\nRules:\n\n+   a. All comments shall\
    \ be written in clear and complete sentences, with proper spelling and grammar.\n\
    +   b. The most useful comments generally precede a block of code. A blank line\
    \ shall follow each such block.\n+   c. Avoid explaining the obvious. Assume the\
    \ reader knows the programming language.\n+   d. The number and length of individual\
    \ comment blocks shall be proportional to the complexity of the code they describe.\n\
    +   e. Whenever an algorithm or technical detail has come from a published source,\
    \ the comment shall include a sufficient reference to the original source (via\
    \ book title, website URL, or other details) to allow a reader of the code to\
    \ find the cited material.\n+   f. Whenever a flow-chart or other diagram is needed\
    \ to sufficiently document the code, the drawing shall be maintained with the\
    \ source code under version control and the comments should reference the diagram\
    \ by file name or title.\n+   g. All assumptions shall be spelled out in comments.\n\
    +   h. Each module and function shall be commented in a manner suitable for automatic\
    \ documentation generation via Doxygen.\n\n> ⁸ It is a good practice to write\
    \ the comment blocks first, as you should not begin the coding until you can explain\
    \ the logic, algorithm, or sequence of steps in words.\n\n> ⁹ Of course, a set\
    \ of design-by-contract tests or assertions is even better than comments.\n\n\
    \    i. Use the following capitalized comment markers to highlight important issues:\n\
    \    ii. \"WARNING: alerts a maintainer there is risk in changing this code. For\
    \ example, that a delay loop counter's terminal value was determined empirically\
    \ and may need to change when the code is ported or the optimization level tweaked.\n\
    \    iii. \"NOTE: provides descriptive comments about the \"why\" of a chunk of\
    \ code—as distinguished from the \"how\" usually placed in comments. For example,\
    \ a chunk of driver code deviates from the datasheet because there was an errata\
    \ in the chip. Or that an assumption is being made by the original programmer.\n\
    \    iv. \"TODO: indicates an area of the code is still under construction and\
    \ explains what remains to be done. When appropriate, an all-caps programmer name\
    \ or set of initials may be included before the word TODO (e.g., \"MJB TODO:\"\
    ).\n\n![](img/438827201b612eb034012d328f242030_34_0.png)\n"
  mdcn: "\n\n# 1.6 强制转换 (Casts)\n\n规则：\n\n+   a. 每个强制转换都应带有相关的注释，描述代码如何确保在右侧所有可能的值的范围内维持正确的行为。\n\
    \n示例：\n\n```\nint\nabs (int arg)\n{\n    return ((arg < 0) ? -arg : arg);\n}\n\
    ```\n\n```\nunsigned int y;\ny = adc_read();\nz = abs((int) y); // 一个风险的转换。\n\
    ```\n\n原理：强制转换是危险的。在上面的示例中，无符号的 y 可以取比符号整数更大的正值范围。在这种情况下，绝对值也将是不正确的。上面的强制转换可能是为了消除关于可能丢失精度的重要警告。\n\
    \n异常：无。\n\n强制执行：这些规则应在代码审查期间执行。\n\n# 1.7 应避免的关键字\n\n规则：\n\n+   a. 不应使用 `auto`\
    \ 关键字。\n+   b. 不应使用 `register` 关键字。\n+   c. 不应使用 `goto` 关键字。\n+   d. 不应使用 `continue`\
    \ 关键字。\n+   e. 不要在 `switch` 语句之外使用 `break` 关键字。\n\n原理：`auto` 关键字是该语言一个不必要的历史特性。C语言的其他某些功能虽然用途，但带来的麻烦大于其价值。例如，`register`\
    \ 关键字假设程序员比编译器聪明。`goto`、`continue` 和 `break` 关键字往往会导致意大利面代码（spaghetti code）。\n\
    \n异常：无。\n\n强制执行：在新或修改的源代码中存在的这些关键字应在每次构建时通过自动化工具检测并报告。\n\n# 1.8 应频繁使用的关键字\n\n\
    规则：\n\n+   a. 应使用 `static` 关键字来声明所有不需要在声明定义的模块外部可见的函数和变量。\n\n+   b. 应在适当的情况下使用\
    \ `const` 关键字。示例包括：\n    i. 定义初始化后不应更改的变量，\n    ii. 定义不应被修改的引用传递函数参数（例如 `char\
    \ const * param`），\n    iii. 定义结构体和联合体中不应被修改的字段（例如在内存映射 I/O 外设寄存器的结构体覆盖中），以及\n\
    \    iv. 作为数值常量的 `#define` 的强类型替代方案。\n\n+   c. 应在适当的情况下使用 `volatile` 关键字。示例包括：\n\
    \    i. 声明被任何中断服务程序（通过当前使用或范围）访问的全局变量，\n    ii. 声明被两个或多个任务（通过当前使用或范围）访问的全局变量，\n\
    \    iii. 声明指向内存映射 I/O 外设寄存器集的指针（例如 `timer_t volatile const p_timer`），以及\n   \
    \ iv. 声明延迟循环计数器。\n\n原理：C语言的 `static` 关键字有多种含义。在模块级，声明为 `static` 的全局变量和函数受不受外部使用的保护。像这样过度使用\
    \ `static` 减少了模块之间的耦合。`const` 和 `volatile` 关键字更为重要。尽可能使用 `const` 的优点是可以通过编译器强制保护，防止对应该是只读的数据进行意外写入。恰当使用\
    \ `volatile` 可以防止编译器消除对变量或寄存器的请求读或写优化，从而消除一整类难以检测的错误⁵。\n\n异常：无。\n\n> ⁵ 轶证表明，不熟悉\
    \ `volatile` 关键字的程序员认为其编译器的优化功能比帮助更有坏处，并禁用了优化。我们相信绝大多数嵌入式系统由于缺少 `volatile` 关键字而存在着随时可能发生的错误。此类错误通常表现为“故障”，或仅在对“经过验证”的代码库进行更改后出现。\n\
    \n**强制执行**：应在代码审查期间强制恰当使用这些重要关键字。\n\n# 2 注释\n\n# 2.1 可接受的格式\n\n规则：\n\n+   a. C++\
    \ 风格的单行注释（即以 `//` 开头）是传统 C 风格注释（即 `/* ... */`）有效且可接受的替代方案⁶\n+   b. 注释绝不能嵌套。\n\
    +   c. 注释绝不能用于禁用一段代码，即使是暂时的。\n    i. 要临时禁用一段代码，请使用预处理器的条件编译功能（例如 `#if 0 ... #endif`）。发布候选源代码中不应保留任何临时禁用的代码块。\n\
    \n![](img/438827201b612eb034012d328f242030_30_0.png)\n![](img/438827201b612eb034012d328f242030_30_1.png)\n\
    \n> ^⁶ 这是对 [MISRA04] 规则 2.2 的偏离，我们认为这不会影响固件错误的数量或严重程度。C++ 的“单行”风格使得注释更容易对齐和维护。此外，这种偏离与我们对\
    \ [C99] 语言的选择一致，该语言正式为 C 语言添加了单行注释。\n\n    ii. 任何专门为了增加调试输出信息水平而存在的行或代码块都应被 `#if\
    \ 0 ... #endif` 围起来。\n\n> ⁷ 我们选择 `#ifdef` 是故意的，因为它与宏相关。\n\n# 2.2 位置与内容\n\n规则：\n\
    \n+   a. 所有注释应用清晰完整的句子编写，并有正确的拼写和语法。\n+   b. 最有注释通常位于代码块之前。每个此类块后应留一个空行。\n+  \
    \ c. 避免解释显而易见的事。假设读者了解编程语言。\n+   d. 单个注释块的数量和长度应与其描述的代码的复杂度成正比。\n+   e. 每当算法或技术细节来自出版源时，注释应包含对原始来源足够的引用（通过书名、网站\
    \ URL 或细节），以便代码读者找到引用的材料。\n+   f. 每当需要流程图或其他图来充分记录代码时，图表应与源代码一起进行版本控制，注释应通过文件名或标题引用该图。\n\
    +   g. 所有假设都应在注释中列出。\n+   h. 每个模块和函数都应以适用于 Doxygen 自动生成文档的方式注释。\n\n> ⁸ 先编写注释块是一个良好的习惯，因为在用文字解释逻辑、算法或步骤之前，你不应该开始编码。\n\
    \n> ⁹ 当然，一组设计契约测试或断言（assertions）比注释更好。\n\n    i. 使用以下大写的注释标记来突出重要问题：\n    ii.\
    \ `\"WARNING：`：警告维护者更改此代码存在风险。例如，延迟循环计数器的终点值是通过实验确定的，在代码迁移或调整优化级别时可能需要更改。\n  \
    \  iii. `\"NOTE：`：提供关于代码块“为什么”的描述性注释——与通常放在注释中的“如何做”区分来。例如，一段驱动程序代码偏离数据手册是因为芯片存在错误（errata）。或者原始程序员做了某个假设。\n\
    \    iv. `\"TODO：`：表示代码某个区域仍在构建中，并解释了剩余需要完成的工作。在适当的情况下，可以在 TODO 之前包含全大写的程序员姓名或缩写（例如\
    \ `“MJB TODO:”`）。\n\n![](img/438827201b612eb034012d328f242030_34_0.png)\n\n"
