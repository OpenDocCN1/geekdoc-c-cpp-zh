    Embedded C Coding Standard


    **Reasoning:** Switch statements are powerful, but prone to errors such as missed
    break statements and unhandled cases. By aligning the *case* and *break* keywords
    it is possible to spot missing *breaks*.


    **Exceptions:** None.


    **Enforcement:** These rules can be enforced by an automated scan of all new or
    modified code during each build. Alternatively, they shall be enforced in code
    reviews.'
  - '[PAGE 91]


    # 8.4 Loops


    Rules:


    +   a. Magic numbers shall not be used as the initial value or in the endpoint
    test of a while or for loop.28


    +   b. Except for a single loop counter initialization in the first clause of
    a for statement, assignments shall not be made in any loop’s controlling expression.


    +   c. Infinite loops shall be implemented via the controlling expression “for
    (;;)\”.29


    +   d. Each loop with an empty body shall feature a set of braces enclosing a
    comment to explain why nothing needs to be done until the loop terminates.


    Example:


    ```

    // Don’t use a magic number ...

    for (int row = 0; row < 100; row++)

    ```


    > 28 Note that sizeof() is a theoretically handy way to dimension an array but
    that this method does not work when you pass a pointer instead of the array itself.
    Thus the most portable method is a constant shared between the array declaration
    and the loop.


    > 29 We can make no compelling technical argument against while (1), but note
    that Kernighan & Ritchie have long recommended for (;;) and so many C programmers
    have become accustomed to structuring their infinite loops this way. In such a
    case, consistency is all that really matters.'
  - "[PAGE 92]\n\n# Embedded C Coding Standard\n\n```\n{\n    // ... when you mean\
    \ a constant.\n    for (int col = 0; col < MAX_COL; col++) {\n        ...\n  \
    \  }\n}\n```\n\n**Reasoning:** It is always important to synchronize the number\
    \ of loop iterations to the size of the underlying data structure. Doing this\
    \ through a single constant prevents a whole class of bugs that can result when\
    \ changes in one part of the code, such as the dimension of an array, as as a\
    \ loop iterator that operates on the array. The use of named constants also makes\
    \ the code easier to read and maintain.\n\n**Exceptions:** It is acceptable to\
    \ start or end a loop with an integer value of 0 (considered less magical by most),\
    \ such as when iterating from or toward the base of an array.\n\n**Enforcement:**\
    \ These rules shall be enforced during code reviews."
