    # 嵌入式 C 编码标准


    采用此编码标准的主要原因是减少嵌入式软件（又称固件）以及维护人员后期添加或修改的代码中存在的 Bug 数量。当然，编码标准本身无法消除复杂嵌入式系统中的所有
    Bug。该编码标准与其说是 Netrino **Zero Bugs...Period™** 设计方法论的一部分。


    **Zero Bugs...Period (ZBP)** 方法论是一套轻量级的最佳实践系统，旨在防止 Bug 侵嵌入式软件。ZBP 解决了进度延误和固件漏洞等反复出现的问题。通过应用
    ZBP 重叠的开发、架构和文化改进层，遵循该标准可以减少 Bug 并确保进度回归正轨。ZBP 强调了软件和系统架构的重要性，以及程序员技能和流程中的关键要素，如设计评审、代码评审和控制。


    采用该标准的其他原因还包括提高软件的可读性和可移植性，以便以更低的成本对固件进行维护和复。编码标准通过减少理解或评审同行工作所需的时间，使开发团队和更大型组织受益。


