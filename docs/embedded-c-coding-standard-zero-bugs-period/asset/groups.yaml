    # 4.2 Header Files


    Rules:


    +   a. There shall always be precisely one header file for each source file and
    they shall always have the same root name.


    +   b. Each header file shall contain a preprocessor guard against multiple inclusion,
    as shown in the example below.


    +   c. The header file shall identify only the procedures, constants, and data
    types (via prototypes or macros, #define and struct/union/enum typedefs) about
    which it is strictly necessary for other modules to know about.


    +   i. It is recommended that no variable be defined (via extern) in a header
    file.


    +   ii. No storage for any variable shall be declared in a header file.


    +   d. No header file shall contain a #include statement.


    Example:


    ```

    #ifndef ADC_H

    #define ADC_H

    ...

    #endif /* _ADC_H */

    ```'
