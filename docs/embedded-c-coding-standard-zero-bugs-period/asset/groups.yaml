    +   7. To be effective, coding standards must be enforceable. Wherever two or
    more competing rules would be similarly able to prevent bugs but only one of those
    rules can be enforced automatically, the more enforceable rule is recommended.


    In the absence of a needed rule or a conflict between rules, the spirit of the
    above principles should be applied to guide the decision.


    > ²[MISRA98] and [MISRA04]'
  - '[PAGE 10]


    # Embedded C Coding Standard


    # Enforcement Guidelines


    Conformance with this coding standard is mandatory.

    Non-conforming code shall be made to meet these minimum standards. Non-conforming
    code shall be detected and removed via automated scans, formal code inspections,
    or informal discovery. All code that is submitted for a release of the software
    shall conform to these standards, unless a deviation has been permitted.


    # Deviation Procedure


    At the project level, it is acceptable for another coding standard (such as the
    coding standard of a client or partner) to be adopted instead of this one. In
    that case, all members of the project team should follow the selected coding standard.


    At the module level, it is only acceptable to deviate from this coding standard
    with the approval of the project manager. The reason for the deviation and the
    approver’s name shall be stated as close as possible to the scope of the deviation.
    For example, a single deviation in a function should be documented in a block
    comment within or above that function, whichever is most helpful to the next reader.'
