  - '[PAGE 67]


    # 5.5 Structures and Unions


    Rules:


    +   - Appropriate care shall be taken to prevent the compiler from inserting padding
    bytes within struct or union types used to communicate to or from a peripheral
    or over a bus or network to another processor.


    +   - Appropriate care shall be taken to prevent the compiler from altering the
    intended order of the bits within bit-fields.¹14


    Reasoning: There is a tremendous amount of implementation-defined behavior in
    the area of structures and unions. Bit-fields, in particular, suffer from severe
    portability problems, including the lack of a standard bit ordering and no official
    support for the fixed-width integer types they so often call out to be used.


    Exceptions: None.


    Enforcement: These rules shall be enforced during code reviews.


    > ¹⁴ Options include static assertions or other compile-time checks as well as
    the use of preprocessor directives to select one of two competing struct definitions.'
  - '[PAGE 68]


    Embedded C Coding Standard


    # 6 Procedures


    # 6.1 Naming Conventions


    Rules:


    +   a. No procedure shall have a name that is a keyword of the C, C++, or any
    other well-known extension of the C programming language, including specifically
    K&R C and C99. Restricted names include interrupt, inline, class, true, false,
    public, private, friend, protected, and many others.


    +   b. No procedure shall have a name that overlaps a function in the C standard
    library. Examples of such names includes strlen, atoi, and memset.


    +   c. No procedure shall have a name that begins with an underscore.


    +   d. No procedure name shall be longer than 31 characters.\15


    +   e. No function name shall contain any uppercase letters.


    +   f. No macro name shall contain any lowercase letters.


    > 15 Rule 11 (required) of [MISRA98].'
  - "[PAGE 69]\n\n+   g. Underscores shall be used to separate words in procedure\
    \ names.\n\n+   h. Each procedure’s name shall be descriptive of its purpose.\
    \ Note that procedures encapsulate “actions” of a program and thus benefit from\
    \ the use of verbs in their names (e.g., adc_read()); this “noun-verb” word ordering\
    \ is recommended.\n   Alternatively, procedures may be named according to the\
    \ question they answer (e.g., led_is_on()).\n\n+   i. The names of all public\
    \ functions shall be prefixed with their module name and an underscore (e.g.,\
    \ force_read()).\n\n**Reasoning:** Good function names make reviewing and maintaining\
    \ code easier (thus cheaper). The data (variables) in programs are nouns. Functions\
    \ manipulate data and are thus verbs. The use of module prefixes is in keeping\
    \ with the important goal of encapsulation and helps avoid procedure name overlaps.\n\
    \n**Exceptions:** None.\n\n**Enforcement:** Compliance with these naming rules\
    \ shall be established in the detailed design phase and be enforced during code\
    \ reviews."
