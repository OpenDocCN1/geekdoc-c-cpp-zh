    do below.'
  - "[PAGE 86]\n\n# Embedded C Coding Standard\n\nExample:\n\n```\nif (NULL == p_object)\n\
    {\n    result = ERR_NULL_PTR;\n}\nelse if (p_object = malloc(sizeof(object_t)))\
    \ // No!\n{\n    ...\n}\nelse{\n    // Normal processing steps,\n    // which\
    \ require many lines of code.\n    ...\n}\n```\n\nReasoning: Long clauses can\
    \ distract the human eye from the decision-path logic. By putting the shorter\
    \ clause earlier, the decision path becomes easier to follow. (And easier to follow\
    \ is always good for reducing bugs.) Deeply nested if blocks are a sure sign of\
    \ a complex and fragile state machine implementation; there is always a safer\
    \ and more readable way to do the same thing.\n\nExceptions: For efficiency purposes,\
    \ it may be desirable to reorder the sequence of if-else clauses to ensure the\
    \ most frequent or most critical case is always found the fastest. Of course,\
    \ if-else statements are typically not as efficient as tables of function pointers\
    \ in terms of worst-case analysis."
- md: "\n**Enforcement**: These rules shall be enforced during code reviews, when\
    \ reviewers feel it may aid readability.\n\n# 8.3 Switch Statements\n\nRules:\n\
    \n- a. The break for each case shall be indented to align with the associated\
    \ case, rather than with the contents of the case code block.\n- b. All switch\
    \ statements shall contain a default block.\n\nExample:\n\n```c\nswitch (err)\n\
    {\n    case ERR_A:\n        ...\n    break;\n\n    case ERR_B:\n        ...\n\
    \    break;\n\n    default:\n        ...\n    break;\n}\n```\n\nEmbedded C Coding\
    \ Standard\n\n**Reasoning:** Switch statements are powerful, but prone to errors\
    \ such as missed break statements and unhandled cases. By aligning the *case*\
    \ and *break* keywords it is possible to spot missing *breaks*.\n\n**Exceptions:**\
    \ None.\n\n**Enforcement:** These rules can be enforced by an automated scan of\
    \ all new or modified code during each build. Alternatively, they shall be enforced\
    \ in code reviews.\n\n# 8.4 Loops\n\nRules:\n\n- a. Magic numbers shall not be\
    \ used as the initial value or in the endpoint test of a while or for loop.28\n\
    - b. Except for a single loop counter initialization in the first clause of a\
    \ for statement, assignments shall not be made in any loop’s controlling expression.\n\
    - c. Infinite loops shall be implemented via the controlling expression “for (;;)”.29\n\
    - d. Each loop with an empty body shall feature a set of braces enclosing a comment\
    \ to explain why nothing needs to be done until the loop terminates.\n\nExample:\n\
    \n```c\n// Don’t use a magic number ...\nfor (int row = 0; row < 100; row++)\n\
    ```\n\n> 28 Note that sizeof() is a theoretically handy way to dimension an array\
    \ but that this method does not work when you pass a pointer instead of the array\
    \ itself. Thus the most portable method is a constant shared between the array\
    \ declaration and the loop.\n\n> 29 We can make no compelling technical argument\
    \ against while (1), but note that Kernighan & Ritchie have long recommended for\
    \ (;;) and so many C programmers have become accustomed to structuring their infinite\
    \ loops this way. In such a case, consistency is all that really matters.\n\n\
    # Embedded C Coding Standard\n\n```c\n{\n    // ... when you mean a constant.\n\
    \    for (int col = 0; col < MAX_COL; col++) {\n        ...\n    }\n}\n```\n\n\
    **Reasoning:** It is always important to synchronize the number of loop iterations\
    \ to the size of the underlying data structure. Doing this through a single constant\
    \ prevents a whole class of bugs that can result when changes in one part of the\
    \ code, such as the dimension of an array, as a loop iterator that operates on\
    \ the array. The use of named constants also makes the code easier to read and\
    \ maintain.\n\n**Exceptions:** It is acceptable to start or end a loop with an\
    \ integer value of 0 (considered less magical by most), such as when iterating\
    \ from or toward the base of an array.\n\n**Enforcement:** These rules shall be\
    \ enforced during code reviews.\n\n# 8.5 Unconditional Jumps\n\nRules:\n\n- a.\
    \ As stated earlier, the keywords goto, continue, and break shall not be used\
    \ to create unconditional jumps.\n\nReasoning: Algorithms that utilize unconditional\
    \ jumps to move the instruction pointer can be rewritten in a manner that is more\
