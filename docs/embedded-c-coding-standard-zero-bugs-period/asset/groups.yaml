    \ rules shall be enforced by an automated scan of all modified or new modules\
    \ for inappropriate use of these tokens.\n\n# 8.6 Equivalence Tests\n\nRules:\n\
    \n- a. When evaluating the equality or inequality of a variable with a constant\
