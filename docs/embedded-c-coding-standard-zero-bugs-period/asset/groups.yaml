    != shall always be preceded and followed by one space.


    +   c. Each of the binary operators +, -, *, %, <, <=, >=, ==, !=, <<, >>, &&,
    || shall always be preceded and followed by one space.


    +   d. Each of the unary operators +, -, ++, !, and ~ shall always be written
    without a space on the operand side and with one space on the other side.


    +   e. The pointer operators * & shall be written with white space on each side
    within declarations but otherwise without a space on the operand.


    +   f. The ? and : characters that comprise the ternary operator each always be
    preceded and followed by one space.


    +   g. The structure pointer and structure member'
  - '[PAGE 38]


    # Embedded C Coding Standard


    operators (-> and , respectively) shall always be without surrounding spaces.


    +   The left and right brackets of the array subscript operator ([ and ]) shall
    always be without surrounding spaces.


    +   Expressions within parentheses shall always have no spaces adjacent to the
    left and right parenthesis characters.


    +   The left and right parentheses of the function call operator shall always
    be without surrounding spaces, except that the function declaration shall feature
    one space between the function name and the left parenthesis to allow that one
    particular mention of the function name to be easily located.


    +   Each comma separating function parameters shall always be followed by one
    space.


    +   Each semicolon separating the elements of a statement shall always be followed
    by one space.


    +   Each semicolon shall follow the statement it terminates without a preceding
    space.


    **Reasoning:** The placement of white space is as important as the placement of
    the text of a program. Good use of white space reduces eystrain and increases
    the ability of the author and reviewers of the code to spot potential bugs.'
