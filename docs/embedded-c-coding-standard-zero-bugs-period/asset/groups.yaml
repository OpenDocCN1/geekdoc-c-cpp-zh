  - '[PAGE 77]


    # 6.5 Interrupt Service Routines


    Rules:


    +   a. Interrupt service routines (ISRs) are not ordinary functions. The compiler
    must be informed that the function is an ISR by way of a #pragma or compiler-specific
    keyword, such as “__interrupt”.


    +   b. All functions that implement ISRs shall be given names ending with “_isr”.


    +   c. To ensure ISRs are not inadvertently called from other parts of the software
    (they may corrupt the CPU and call stack if this happens), each ISR function shall
    lack a prototype, be declared static, and be located at the end of the associated
    driver module.²⁰


    +   d. A stub or default ISR shall be installed in the vector table at the location
    of all unexpected or unhandled interrupt sources. Each such stub will attempt
    to disable future interrupts of the same type, say at the interrupt controller,
    and assert().²¹


    ![](img/438827201b612eb034012d328f242030_77_0.png)


    ²⁰ Be forearmed that a smart static analys tool, such as lint, will likely complain
    about this unreachability.


    ²¹ Although this doesn’t prevent any bugs, it sure does help bugs in the hardware
    and makes the system more robust.'
  - '[PAGE 78]


    Embedded C Coding Standard


    **Reasoning:** An ISR is an extension of the hardware. By definition, it and the
    straight-line code are asynchronous to each other. If they share global data,
    that data must be protected with interrupt disables in the straight-line code.
    The ISR must not get hung up inside the operating system or waiting for a variable
    or register to change value.


    **Exceptions:** None.


    **Enforcement:** These rules shall be enforced during code reviews.


