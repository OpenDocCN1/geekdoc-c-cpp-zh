    \n示例：\n\n```c\nvoid\nalarm_task (void * p_data)\n{\n    alarm_t alarm = ALARM_NONE;\n\
    \    int err = OS_NO_ERR;\n\n    for (;;)\n{\n        alarm = OsmboxPend(alarm_mbox,\
    \ &err);\n        // Process alarm here.\n    }\n}\n```\n\n实时操作系统 (RTOS) 中的每个任务都像一个微型\
    \ `main()`，通常在无限循环中永久运行。在代码审查和调试期间，能够易地识别这些重要函数是有价值的。\n\n例外： 也可以使用 `_thread`。\n\
    \n**强制执行：** 这一命名规范应在详细设计阶段和代码审查中执行。\n\n## 6.5 中断服务程序\n\n规则：\n\n- a. 中断服务程序 (ISR)\
    \ 不是普通函数。必须通过 #pragma 或编译器特定的关键字（如“__interrupt”）告知编译器该函数是一个 ISR。\n\n- b. 所有实现\
    \ ISR 的函数应赋予以 `_isr` 结尾的名字。\n\n- c. 为了确保 ISR 不会在无意中从软件的其他部分调用（如果发生，可能会损坏 CPU 和调用栈），每个\
    \ ISR 函数不应具有原型，应声明为 `static`，并位于相关驱动模块的末尾。²⁰\n\n- d. 在向量表中所有意外或未处理的中断源位置应安装一个存根（stub）或默认\
    \ ISR。每个此类存根将尝试禁用未来的相同类型中断（例如在中断控制器处），并调用 `assert()`。²¹\n\n![](img/438827201b612eb034012d328f242030_77_0.png)\n\
    \n²⁰ 注意，智能静态分析工具（如 lint）可能会对这种不可达性报错。\n\n²¹ 虽然这不能防止任何 bug，但它确实有助于发现硬件 bug 并使系统更健壮。\n\
    \n**理由：** ISR 是硬件的扩展。根据定义，它与顺序执行代码是相互异步的。如果它们共享全局数据，则必须在顺序执行代码中通过禁用中断来保护该数据。ISR\
    \ 不得在操作系统内部阻塞或等待变量或寄存器的值改变。\n\n**例外：** 无。\n\n**强制执行：** 这些规则应在代码审查期间执行。\n\n## 7\
    \ 变量\n\n### 7.1 命名规范\n\n规则：\n\n- 变量名不能是 C、C++ 或任何其他已知 C 编程语言扩展的关键字，特别是 K&R 和 C99。限制名称包括\
    \ `interrupt`、`inline`、`restrict`、`class`、`true`、`false`、`public`、`private`、`friend`\
    \ 和 `protected`。\n- 变量名不能与 C 标准库中的变量名重叠（例如 `errno`）。\n- 变量名不能以下划线开头。\n- 变量名长度不能超过31个字符。\n\
    - 变量名不能少于3个字符，包括循环计数器。22\n- 变量名不能包含任何大写字母。\n\n> 22 这是因为你无法对“i”进行有意义的全局搜索。\n\n\
    - g. 变量名不应包含在其他地方被指出的数值，例如数组的元素数量或底层类型的位数。\n- h. 应使用下划线分隔变量名中的单词。\n- i. 每个变量的名字应描述其用途。\n\
    - j. 所有全局变量的名字应以字母 ‘g’ 开头。例如，`g_zero_offset`。\n- k. 所有指针变量的名字应以字母 ‘p’ 开头。例如，`*p_led_reg`。\n\
    - l. 所有二级指针变量的名字应以字母 `pp` 开头。例如，`gpp_vector_table`。\n- m. 所有包含“有效布尔值”信息（即 0 与非零）的整数变量的名字应以字母\
    \ ‘b’ 开头，并以它们回答的问题的形式表述。²³ 例如，`b_done_yet` 或 `gb_is_buffer_full`。\n\n> ³ 在 C 中，定义如\
    \ `TRUE` 等常量（其中 `TRUE` 等于 1）是不安全的。然而，将“有效布尔值”整数值与 0 进行比较是安全的。例如，测试“if (!gb_buffer_is_full)”是安全的且符合规则\
    \ 13.2。\n\n**理由：** 采用这些基本规则是为了最大化跨编译器的代码移植性。许多 C 编译器只识别变量名前31个字符的区别，并保留了以下划线开头的名称作为内部名称。其他规则旨在强调风险并确保变量的正确使用。\n\
    \n**例外：** 无。\n\n**强制执行：** 这些变量命名规则应在代码审查期间执行。\n\n（建议性）参考 [MISRA04]。另注意 [C99] 添加了\
    \ `<stdbool.h>`，它定义了 *bool* 类型以及常量 *true* 和 *false*。\n\n嵌入式 C 编码标准\n\n### 7.2\
    \ 初始化\n\n规则：\n\n- a. 所有变量在使用之前均应初始化。\n- b. 最好在需要时创建变量，而不是在函数顶部创建。24\n\n![](img/438827201b612eb034012d328f242030_82_0.png)\n\
    \n示例：\n\n```c\nfor (int loop = 0; loop < MAX_LOOPS; loop++)\n{\n  ...\n}\n```\n\
    \n**理由：** 许多程序员假设运行时会处理它们。将变量放置在其使用的地方有助于可读性。25。\n\n**例外：** 无。\n\n> 25 一项研究 ([Uwano])\
    \ 证明了将变量放置在其使用的地方的重要性。\n\n强制执行：自动化工具应在初始化之前扫描所有源代码。Lint 是可以实现此点的工具示例。\n\n## 8\
    \ 表达式与语句\n\n### 8.1 变量声明\n\n规则：\n\n- a. 变量声明内部不应使用逗号（','）运算符。\n\n示例：\n\n```c\n\
    char * x, y; // y 应该是指针吗？\n```\n\n**理由：** 每个声明单独占据一行成本较低。相比之下，编译器或维护者误解你的意图的风险很高。\n\
    \n**例外：** 无。\n\n### 8.2 if-else 语句\n\n规则：\n\n- a. if 和 else 子句最短（按代码行数计算）的应放在前面。²⁶\n\
    - b. 嵌套的 if-else 语句深度应超过两层。使用函数调用或 switch 语句来降低复杂度。\n- c. 不应进行赋值。\n- d. 任何带有 else\
    \ if 子句的 if 语句应以 else 子句结尾。⁷\n\n![](img/438827201b612eb034012d328f242030_85_0.png)\n\
    \n> ²⁶ 感谢 [Holub] 将这种“为了可读性进行格式化”的想法转化为文字。\n\n> ²⁷ 这等于在每个 switch 中都要求一个 default\
    \ 情况，如下所示。\n\n示例：\n\n```c\nif (NULL == p_object)\n{\n    result = ERR_NULL_PTR;\n\
    }\nelse if (p_object = malloc(sizeof(object_t))) // 不！\n{\n    ...\n}\nelse{\n\
    \    // 正常处理步骤，\n    // 这需要很多行代码。\n    ...\n}\n```\n\n**理由：** 长的子句会分散人类眼睛对决策路径逻辑的注意力。通过将较短的子句放在前面，决策路径变得更容易遵循。（而且更容易遵循总是有助于减少\
    \ bug。）\n\n"
