    Reasoning: The language standard gives all variables and functions global scope
    by default. The downside of this is unnecessary (and dangerous) coupling between
    modules. To reduce inter-module coupling, keep as many procedures, constants,
    data types, and variables as possible hidden within a module’s source file.


    Exceptions: It is acceptable to deviate from the common root name rule for the
    core application module (e.g., “foomain.c” contains main(), its header file may
    be “foo.h”). Under certain circumstances it may be necessary to share a global
    variable across modules. Whenever this is done, such a variable shall be named
    with the module’s prefix, declared volatile, and always protected from race conditions
    at each location of access.


    Enforcement: These header file rules shall be enforced during code reviews.'
