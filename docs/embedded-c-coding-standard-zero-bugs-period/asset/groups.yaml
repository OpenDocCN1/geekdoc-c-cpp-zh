    # Embedded C Coding Standard


    **Reasoning**: There are a lot of risks associated with the use of preprocessor
    #defines, and many of them relate to the creation of parameterized macros. The
    extensive use of parentheses (as shown in the example) is important, but does
    not eliminate the unintended double increment possibility of a call such as MAX(i++,
    j++). Other risks of macro misuse include comparison of signed and unsigned data
    or any test of floating-point data. Making matters worse, macros are invisible
    at run-time and thus impossible to step into the debugger.¹19


    **Exceptions**: In the case of necessary (and tested, and documented) efficiency,
    a local exception can be approved. That’s when the other rules kick in.


    **Enforcement**: The avoidance of and safe use of macros shall be enforced during
    code reviews.


    ¹⁹ Of course, *inline* functions are also invisible at debug time.


