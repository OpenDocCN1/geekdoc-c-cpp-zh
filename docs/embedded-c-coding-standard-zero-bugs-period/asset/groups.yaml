    \ subsequent lines in the most readable manner possible.\n\nExample:\n\n```\n\
    sys_error_handler(int err)\n{\n    switch (err)\n    {\n        case ERR_THE_FIRST:\n\
    \            ...\n        break;\n        default:\n            ...\n        break;\n\
    \    }\n}\n```"
  - "[PAGE 45]\n\n```\n// Purposefully misaligned indentation; see why?\nif ((first_very_long_comparison_here\n\
    \    && second_very_long_comparison_here\n    || third_very_long_comparison_here)\n\
    {\n    ...\n}\n```\n\n**Reasoning:** Fewer indentation spaces increase the risk\
    \ of visual confusion while more spaces increases the likelihood of line wraps.\n\
    \n**Exceptions:** The indentation in legacy code modules that are indented differently\
    \ shall not be changed unless it is anticipated that a significant amount of the\
    \ code will be modified. In that case, the indentation across the entire module\
    \ shall be changed in a distinct version control step. This is because a side\
    \ effect of changing indentation is the loss of difference tracking capability\
    \ in the version control system. It is thus valuable to separate the code changes\
    \ from the indent changes.\n\n**Enforcement:** An automated tool shall be provided\
    \ to programmers to convert indentations of other sizes automatically. This tool\
    \ shall modify all new or changed code prior to each build."
