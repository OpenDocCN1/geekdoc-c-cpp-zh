  - '[PAGE 73]


    # 6.3 Function-Like Macros


    Rules:


    +   a. Parameterized macros shall not be used if an inline function can be written
    to accomplish the same task.¹1⁷


    +   b. If parameterized macros are used for some reason, these rules apply:


    i. Surround the entire macro body with parentheses.

    nii. Surround each use of a parameter with parentheses.

    iii. Use each argument no more than once, to avoid unintended side effects.


    Example:


    ```

    // Don’t do this ...

    #define MAX(A, B) ((A) > (B) ? (A) : (B))

    ```


    ```

    // ... if you can do this instead.¹⁸

    inline int max(int a, int b)

    ```


    > ¹⁷ [C99] formally added the C++ keyword inline to C.

    ¹⁸ Note that individual functions will be needed to support each base type for
    comparison.'
