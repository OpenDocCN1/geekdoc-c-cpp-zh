  - '[PAGE 71]


    # 6.2 Functions


    Rules:


    +   a. All reasonable effort shall be taken to keep the length of each function
    limited to one printed page, except when or about 50-100 lines.

    b. Whenever possible, all functions shall be made to start at the top of a printed
    page, except several small functions can fit onto a single page.

    c. All functions shall have one exit point and it shall be at the bottom of the
    function. That is, the keyword return shall appear a maximum of once.^{16}

    d. A prototype shall be defined for each public function in the module header
    file.

    e. All private functions shall be defined static.

    f. Each parameter shall be explicitly declared and meaningfully named.


    ![](img/438827201b612eb034012d328f242030_71_0.png)


    ![](img/438827201b612eb034012d328f242030_71_1.png)


    > ^{16} In fact, [IEC61508] requires it.'
