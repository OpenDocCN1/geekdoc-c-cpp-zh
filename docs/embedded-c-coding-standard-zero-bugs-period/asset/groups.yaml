  - '[PAGE 43]


    # 3.3 Blank Lines


    Rules:


    +   a. No line of code shall contain more than one statement.


    +   b. There shall be a blank line before and after each natural block of code.
    Examples of natural blocks of code are loops, *if-else* and *switch* statements,
    and consecutive declarations.


    +   c. Each source file shall have a blank line at the end.¹10


    **Reasoning:** Appropriate placement of white space provides visual separation
    and makes code easier to read and understand, just as the white spaces between
    paragraphs of this coding standard aid readability.


    **Exceptions:** None


    **Enforcement:** These rules shall be enforced during code reviews.


    ¹⁰ This is for portability, as some compilers require the blank line.'
