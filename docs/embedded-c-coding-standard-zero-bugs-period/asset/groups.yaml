  - '[PAGE 49]


    # 3.6 Linefeeds


    Rules:


    +   a. Whenever possible, all source code lines shall end only with the single
    character LF (0x0A).


    Reasoning: The multi-character sequence CR-LF (0x0D 0x0A) is more likely to cause
    problems in a multi-platform environment than the single character LF. One such
    problem is associated with multi-line preprocessor macros on Unix platforms.


    Exceptions: None.


    Enforcement: Whenever possible, programmer’s editors shall be configured to use
    LF. In addition, an automated tool shall scan all new or modified source code
    files during each build, replacing each CR-LF sequence with LF.'
- md: "\nEmbedded C Coding Standard\n\n## 4 Modules\n\n### 4.1 Naming Conventions\n\
    \nRules:\n\n- a. All module names shall consist entirely of lowercase letters,\
    \ numbers, and underscores. No spaces shall appear within the file name.\n- b.\
    \ All module names shall be unique in their first eight characters, with .h and\
    \ .c used for the suffix for header and source files respectively.\n- c. No module\
    \ name shall share the name of a standard library header file. For example, modules\
    \ shall not be named \"stdio\" or \"math\".\n- d. Any module containing a main()\
    \ function shall have the word \"main\" in its filename.\n\n**Reasoning:** Multi-platform\
    \ work environments (e.g., Linux and Windows) are the norm rather than the exception.\
    \ To support the widest range, file names should meet the constraints of the least\
    \ capable platforms. Additionally, mixed case names are error prone due to the\
    \ possibility of similarly-named but differently-capitalized files becoming confused.\
    \ The inclusion of “main” in a file name is an aid to the maintainer that has\
    \ proven useful.¹¹\n\n**Exceptions:** None.\n\n**Enforcement:** An automated tool\
    \ shall confirm that all file names used in each build are consistent with these\
    \ rules.\n\n> ¹¹ We have encountered the case of a company with one project having\
    \ over 200 files containing a function called main().\n\nEmbedded C Coding Standard\n\
    \n### 4.2 Header Files\n\nRules:\n\n- a. There shall always be precisely one header\
    \ file for each source file and they shall always have the same root name.\n-\
    \ b. Each header file shall contain a preprocessor guard against multiple inclusion,\
    \ as shown in the example below.\n- c. The header file shall identify only the\
    \ procedures, constants, and data types (via prototypes or macros, #define and\
    \ struct/union/enum typedefs) about which it is strictly necessary for other modules\
    \ to know about.\n    - i. It is recommended that no variable be defined (via\
    \ extern) in a header file.\n    - ii. No storage for any variable shall be declared\
    \ in a header file.\n- d. No header file shall contain a #include statement.\n\
    \nExample:\n\n```\n#ifndef ADC_H\n#define ADC_H\n...\n#endif /* _ADC_H */\n```\n\
    \nReasoning: The language standard gives all variables and functions global scope\
    \ by default. The downside of this is unnecessary (and dangerous) coupling between\
    \ modules. To reduce inter-module coupling, keep as many procedures, constants,\
    \ data types, and variables as possible hidden within a module’s source file.\n\
    \nExceptions: It is acceptable to deviate from the common root name rule for the\
    \ core application module (e.g., “foomain.c” contains main(), its header file\
    \ may be “foo.h”). Under certain circumstances it may be necessary to share a\
    \ global variable across modules. Whenever this is done, such a variable shall\
    \ be named with the module’s prefix, declared volatile, and always protected from\
    \ race conditions at each location of access.\n\nEnforcement: These header file\
    \ rules shall be enforced during code reviews.\n\n### 4.3 Source Files\n\nRules:\n\
    \n- a. Each source file shall include only the behaviors appropriate to control\
    \ one “entity”. Examples of entities include encapsulated data types, active objects,\
    \ peripheral drivers (e.g., for a UART), and communication protocols or layers\
    \ (e.g., ARP).\n- b. Each source file shall be comprised of some or all the following\
    \ sections, in the order listed: comment block; data type, constant, and macro\
    \ definitions; static data declarations; private function prototypes; public function\
    \ bodies; then private function bodies.\n- c. Each source file shall always #include\
    \ the header of the same name (e.g., file adc.c should #include “adc.h”), to allow\
    \ the compiler to confirm that each public function and its prototype match.\n\
    - d. Absolute paths shall not be used in include file names.\n- e. Each source\
    \ file shall be free of unused include files.\n- f. No source file shall #include\
    \ another source file.\n\n![](img/438827201b612eb034012d328f242030_55_0.png)\n\
    \nReasoning: The purpose and internal layout of a source file module should be\
    \ clear to all who maintain it. For example, the public functions are generally\
    \ of most interest and thus appear ahead of the private functions they call. Of\
    \ critical importance is that every function declaration be matched by the compiler\
    \ against its prototype.\n\n**Exceptions**: None.\n\n**Enforcement**: Prior to\
    \ each build, an automated tool shall scan source files to ensure they #include\
    \ their own header file but not unused header files. Lint is an example of a tool\
    \ that can be configured to perform the second check automatically.\n\n### 4.4\
    \ File Templates\n\nRules:\n\n- a. A set of templates for header files and source\
    \ files shall be maintained at the project level. See Appendix A and Appendix\
    \ B for suggested templates.\n\nReasoning: Starting each new file from a template\
    \ ensures consistency in file header comment blocks and ensures inclusion of appropriate\
    \ copyright notices.\n\n**Exceptions:** None.\n\nEnforcement: The consistency\
    \ of comment block formats shall be enforced during code reviews.\n\n## 5 Data\
    \ Types\n\n### 5.1 Naming Conventions\n\nRules:\n\n- a. The names of all new data\
    \ types, including structures, unions, and enumerations, shall consist only of\
    \ lowercase characters and internal underscores and end with `_t`.\n- b. All new\
    \ structures, unions, and enumerations shall be named via a typedef.\n\nExample:\n\
    \n```\ntypedef struct\n{\n    uint16_t count;\n    uint16_t max_count;\n    uint16_t\
    \ _unused;\n    uint16_t control;\n}\n} timer_t;\n```\n\n**Reasoning:** Type names\
    \ and variable names are often appropriately similar. For example, a set of timer\
    \ control registers in a peripheral calls out to be named ‘timer’. To distinguish\
    \ the structure definition that defines the register layout, it is valuable to\
    \ create a new type with a distinct name, such as ‘timer_t’. If necessary this\
    \ same type could then be used to create a shadow copy of the timer registers,\
    \ say called ‘timer_shadow’.\n\n**Exceptions:** It is not necessary to use typedef\
    \ with anonymous structures and unions.\n\n**Enforcement:** An automated tool\
    \ shall scan new or modified source code prior to each build to ensure that the\
    \ keywords `struct`, `union`, and `enum` are used only within `typedef` statements\
    \ or in anonymous declarations.\n\n### 5.2 Fixed-Width Integers\n\nRules:\n\n\
    - a. Whenever the width, in bits or bytes, of an integer value matters in the\
    \ program, one of the fixed width types shall be used in place of char, short,\
    \ int, long, and long long. The signed and unsigned fixed width types shall be\
    \ as shown in the table below.¹²\n- b. The keywords short and long shall not be\
    \ used.\n- c. Use of the keyword char shall be restricted to the declaration of\
    \ and operations concerning strings.\n\n| Integer Width | Signed Type | Unsigned\
    \ Type |\n| --- | --- | --- |\n| 8 bits | int8_t | uint8_t |\n| 16 bits | int16_t\
    \ | uint16_t |\n| 32 bits | int32_t | uint32_t |\n| 64 bits | int64_t | uint64_t\
    \ |\n\n> ¹²If program execution speed is also a consideration, note that the [C99]\
    \ standard defines a set of “fastest” fixed-width types. For example, uint_fast8_t\
    \ is the fastest integer type that can hold 8 bits of unsigned data.\n\nReasoning:\
    \ The [C90] standard allows implementation-defined widths for char, short, int,\
    \ long, and long long types, which leads to portability problems. The [C99] standard\
    \ did not resolve this, but introduced the uniform type names, which are defined\
    \ in the C99 header file <stdint.h>.\n\nExceptions: In the absence of a C99-compliant\
    \ compiler, it is acceptable to define the set of fixed width types in the table\
    \ above as typedefs based on char, short, int, long, and long long. If this is\
    \ done, use compile-time checks (such as static assertions) to have the compiler\
    \ flag incorrect type definitions. It is acceptable to use the native types when\
    \ C Standard Library functions are used—just be careful.\n\nEnforcement: At every\
    \ build an automated tool shall scan for and flag the use of the keywords short\
    \ and long, which are not to be used. Compliance with the other rules shall be\
    \ checked during code reviews.\n"
  mdcn: "\n\n嵌入式 C 规范\n\n## 4 模块\n\n### 4.1 命名规范\n\n规则：\n\n- a. 所有模块名称应完全由小写字母、数字和下划线组成。文件名中不允许出现空格。\n\
    - b. 所有模块名称的前八个字符必须唯一，.h 和 .c 分别用作头文件和源文件的后缀。\n- c. 任何模块名称都不应与标准库头文件重名。例如，模块不应为\
    \ \"stdio\" 或 \"math\"。\n- d. 任何包含 main() 函数的模块其文件名中应包含 \"main\" 单词。\n\n**理由：**\
    \ 多平台工作环境（例如 Linux 和 Windows）是常态而非例外。为了支持最广泛的范围，文件名应满足能力最弱平台的限制。此外，由于可能出现名称相似但大小写不同的文件导致混淆，混合大小写的名称容易出错。在文件名中包含“main”对维护者非常有帮助，且已被证明是很有用的.¹¹¹\n\
    \n**异常：** 无。\n\n**强制措施：** 应由自动化工具确认在每次构建中使用的所有文件名都与这些规则一致。\n\n> ¹¹ 我们遇到过某公司的一个项目拥有超过\
    \ 200 个包含名为 main() 函数的文件。\n\n嵌入式 C 规范\n\n### 4.2 头文件\n\n规则：\n\n- a. 每个源文件必须有且仅有一个头文件，并且它们具有相同的根名称。\n\
    - b. 每个头文件应包含一个防止重复包含的预处理器保护，如下例所示。\n- c. 头文件应仅标识其他模块严格需要知道的程序、常量和数据类型（通过原型或宏、#define\
    \ 以及 struct/union/enum typedef 定义）。\n    - i. 建议不要在头文件中定义（通过 extern）变量。\n    -\
    \ ii. 不应在头文件中为任何变量声明存储（存储空间）。\n- d. 任何头文件都不应包含 #include 语句。\n\n示例：\n\n```\n#ifndef\
    \ ADC_H\n#define ADC_H\n...\n#endif /* _ADC_H */\n```\n\n理由：语言标准默认赋予所有变量和函数全局作用域。这种做法的缺点是模块之间存在不必要的（且是危险的）耦合。为了减少模块间的耦合，应尽可能将程序、常量、数据类型和变量隐藏在模块的源文件中。\n\
    \n异常：对于核心应用模块，偏离通用根名称规则是可以接受的（例如，“foomain.c”包含 main()，其头文件可以是“foo.h”）。在某些情况下，可能需要跨模块共享全局变量。每当这样做时，该变量应以模块前缀命名，声明为\
    \ volatile，并在每个访问处始终保护免受竞态条件的影响。\n\n强制措施：** 这些头文件规则应在代码审查期间执行。\n\n### 4.3 源文件\n\
    \n规则：\n\n- a. 每个源文件应仅包含控制一个“实体”的相关行为。实体的示例包括封装的数据类型、活动对象、外设驱动程序（例如用于 UART）以及通信协议或层（例如\
    \ ARP）。\n- b. 每个源文件应按列出的顺序包含部分或全部以下部分：注释块；数据类型、常量和宏的定义；静态数据声明；私有函数原型；公共函数定义体；然后是私有函数定义体。\n\
    - c. 每个源文件应始终 #include 同名的头文件（例如，文件 adc.c 应 #include “adc.h”），以便编译器确认每个公共函数及其原型相匹配。\n\
    - d. 包含文件名中不应使用绝对路径。\n- e. 每个源文件应不包含未使用的包含文件。\n- f. 任何源文件都不应 #include 另一个源文件。\n\
    \n![](img/438827201b612eb034012d328f242030_55_0.png)\n\n理由：源文件模块的目的和内部布局对所有维护者应该是清晰的。例如，公共函数通常是最感兴趣的，因此出现在其调用的私有函数之前。至关重要的一点是每个函数声明都要由编译器与其原型进行匹配。\n\
    \n**异常**：无。\n\n**强制措施**：在每次构建之前，自动化工具应扫描源文件，以确保它们 #include 自己的头文件，但不包含未使用的头文件。Lint\
    \ 是可以配置为自动执行第二次检查的工具示例。\n\n### 4.4 文件模板\n\n规则：\n\n- a. 应在项目级维护一套头文件和源文件的模板。建议的模板请参见附录\
    \ A 和附录 B。\n\n理由：从模板开始每个新文件可以确保文件头注释块的一致性，并确保包含适当的版权声明。\n\n**异常：**无。\n\n强制措施：注释块格式的一致性应在代码审查期间执行。\n\
    \n## 5 数据类型\n\n### 5.1 命名规范\n\n规则：\n\n- a. 所有新数据类型（包括结构体、联合和枚举）的名称应仅由小写字母和内部下划线组成，并以\
    \ `_t` 结尾。\n- b. 所有新的结构体、联合和枚举应通过 typedef 命名。\n\n示例：\n\n```\ntypedef struct\n\
    {\n    uint16_t count;\n    uint16_t max_count;\n    uint16_t _unused;\n    uint16_t\
    \ control;\n}\n} timer_t;\n```\n\n**理由：** 类型名和变量名通常相似。例如，外设中的一组定时器控制寄存器可以命名为“timer”。为了区分定义寄存器布局的结构体定义，创建一个具有不同名称的新类型（如“timer_t”）非常有价值。如果需要，可以使用该相同类型创建定时器寄存器的影子拷贝，例如称为“timer_shadow”。\n\
    \n**异常：** 对于匿名结构体和联合，没有必要使用 typedef。\n\n**强制措施：** 在每次构建之前，自动化工具应扫描新的或修改的代码，以确保\
    \ `struct`、`union` 和 `enum` 关键字仅在 `typedef` 语句或匿名声明中使用。\n\n### 5.2 固定宽度整数\n\n\
    规则：\n\n- a. 每当整数值的宽度（位或字节）在程序中很重要时，应使用固定宽度类型之一代替 char, short, int, long 和 long\
    \ long。有符号和无符号固定宽度类型如下表所示.¹²\n- b. 不应使用关键字 short 和 long。\n- c. 关键字 char 的使用应限制在字符串的声明和操作上。\n\
    \n| 整数宽度 | 有符号类型 | 无符号类型 |\n| --- | --- | --- |\n| 8 位 | int8_t | uint8_t |\n\
    | 16 位 | int16_t | uint16_t |\n| 32 位 | int32_t | uint32_t |\n| 64 位 | int64_t\
    \ | uint64_t |\n\n> ¹²如果程序执行速度也是考虑因素，请注意 [C99] 标准定义了一组“最快”固定宽度类型。例如，uint_fast8_t\
    \ 是存储 8 位无符号数据的快速整数类型。\n\n理由：[C90] 标准允许 char, short, int, long 和 long long 类型的宽度取决于实现，这导致了可移植性问题。[C99]\
    \ 标准没有解决这个问题，但引入了统一的类型名称，这些名称定义在 C99 头文件 <stdint.h> 中。\n\n异常：在没有符合 C99 的编译器的情况下，允许基于\
    \ char, short, int, long 和 long long 通过 typedef 定义上表中的固定宽度类型集。如果这样做了，请使用编译时检查（如静态断言）让编译器标记错误的类型定义。在使用\
    \ C 标准库函数时，使用原生类型是可以接受的——只需留心。\n\n强制措施：每次构建时，自动化工具应扫描并标记 short 和 long 关键字的使用，这些是不允许使用的。其他规则的合规性应在代码审查期间检查。\n\
    \n"
