  - '[PAGE 61]


    # 5.2 Fixed-Width Integers


    Rules:


    +   Whenever the width, in bits or bytes, of an integer value matters in the program,
    one of the fixed width data types shall be used in place of char, short, int,
    long, or long long. The signed and unsigned fixed width integer types shall be
    as shown in the table below.¹12


    | Integer Width | Signed Type | Unsigned Type |

    | --- | --- | --- |

    | 8 bits | int8_t | uint8_t |

    | 16 bits | int16_t | uint16_t |

    | 32 bits | int32_t | uint32_t |

    | 64 bits | int64_t | uint64_t |


    +   The keywords short and long shall not be used.


    +   Use of the keyword char shall be restricted to the declaration of and operations
    concerning strings.


    > ¹²If program execution speed is also a consideration, note that the [C99] standard
    defines a set of “fastest” fixed-width types. For example, uint_fast8_t is the
    fastest integer type that can hold at 8 bits of unsigned data.'
  - '[PAGE 62]


    Reasoning: The [C90] standard allows implementation-defined widths for char, short,
    int, long, and long long types, which leads to portability problems. The [C99]
    standard did not resolve this, but introduced the uniform type names, which are
    defined in the C99 header file <stdint.h>.


    Exceptions: In the absence of a C99-compliant compiler, it is acceptable to define
    the set of fixed width types in the table above as typedefs based on char, short,
    int, long, and long long. If this is done, use compile-time checks (such as static
    assertions) to have the compiler flag incorrect type definitions. It is acceptable
    to use the native types when C Standard Library functions are used—just be careful.


    Enforcement: At every build an automated tool shall scan for and flag the use
    of the keywords short and long, which are not to be used. Compliance with the
    other rules shall be checked during code reviews.'
- md: "\n## 5.3 Signed Integers\n\nRules:\n\n- Bit-fields shall not be defined within\
    \ signed integer types.\n- None of the bit-wise operators (i.e., &, |, ^, <<,\
    \ and >>)) shall be used to manipulate signed integer data.\n- Signed integers\
    \ shall not be combined with unsigned integers in comparisons or expressions.\
    \ Support of this, decimal constants meant to be unsigned should be declared with\
    \ a ‘u’ at the end.\n\nExample:\n\n```c\nuint8_t a = 6u;\nint8_t b = -9;\nif (a\
    \ + b < 4)\n{\n    // This correct path should be executed\n    // if -9 + 6 were\
    \ -3 < 4, as anticipated.\n}\nelse\n{\n    // This incorrect path is actually\
    \ executed\n    // as -9 + 6 becomes (0xFF - 9) + 6 = 252.\n}\n```\n\n**Reasoning**:\
    \ Several details of the manipulation of binary data within signed integer containers\
    \ are implementation-defined behaviors of the C standard. Additionally, the results\
    \ of mixing signed and unsigned data can lead to data-dependent bugs.\n\n**Exceptions**:\
    \ None.\n\n**Enforcement**: Static analysis tools can be used to detect violations\
    \ of these rules.\n\n## 5.4 Floating Point\n\nRules:\n\n- a. Avoid the use of\
    \ floating point constants and variables whenever possible. Fixed-point math may\
    \ be an alternative.\n- b. When floating point calculations are necessary:\n \
    \ i. Use the [C99] type names float32_t, float64_t, and float128_t.\n  ii. Append\
    \ an 'f' to all single-precision constants (e.g., pi = 3.1415927f).\n  iii. Ensure\
    \ that the compiler supports double-precision, if your math depends on it.\n \
    \ iv. Never test for equality or inequality of floating point values.\n\nExample:\n\
    \n```c\n// Ensure the compiler supports double-precision.\n#include <limits.h>\n\
    #if (DBL_DIG < 10)\n  #error \"Double precision is not available!\"\n#endif\n\
    ```\n\n![](img/438827201b612eb034012d328f242030_65_0.png)\n\n# Embedded C Coding\
    \ Standard\n\n**Reasoning:** There are a large number of risks of errors stemming\
    \ from incorrect use of floating point arithmetic; these are outside the scope\
    \ of this document.¹¹³ By default, C promotes all floating-point constants to\
    \ double precision, which may be inefficient or unsupported on the target platform.\
    \ However, many microcontrollers do not have any hardware support for floating\
    \ point math. The compiler may not warn of these incompatibilities, instead performing\
    \ the requested numerical operations by linking in a large (typically a few kilobytes\
    \ of code) and slow (numerous instruction cycles per operation) floating-point\
    \ emulation library.\n\n**Exceptions:** None.\n\n**Enforcement:** These rules\
    \ shall be enforced during code reviews.\n\n¹³ [Seacord] has a nice explanation\
    \ of these issues and some suggested guidelines in Chapter 6.\n\n66\n\n## 5.5\
    \ Structures and Unions\n\nRules:\n\n- Appropriate care shall be taken to prevent\
    \ the compiler from inserting padding bytes within struct or union types used\
    \ to communicate to or from a peripheral or over a bus or network to another processor.\n\
    - Appropriate care shall be taken to prevent the compiler from altering the intended\
    \ order of the bits within bit-fields.¹¹⁴\n\n**Reasoning**: There is a tremendous\
    \ amount of implementation-defined behavior in the area of structures and unions.\
    \ Bit-fields, in particular, suffer from severe portability problems, including\
    \ the lack of a standard bit ordering and no official support for the fixed-width\
    \ integer types they so often call out to be used.\n\n**Exceptions**: None.\n\n\
    **Enforcement**: These rules shall be enforced during code reviews.\n\n> ¹⁴ Options\
    \ include static assertions or other compile-time checks as well as the use of\
    \ preprocessor directives to select one of two competing struct definitions.\n\
    \nEmbedded C Coding Standard\n\n## 6 Procedures\n\n## 6.1 Naming Conventions\n\
    \nRules:\n\n- a. No procedure shall have a name that is a keyword of the C, C++,\
    \ or any other well-known extension of the C programming language, including specifically\
    \ K&R C and C99. Restricted names include interrupt, inline, class, true, false,\
    \ public, private, friend, protected, and many others.\n- b. No procedure shall\
    \ have a name that overlaps a function in the C standard library. Examples of\
    \ such names includes strlen, atoi, and memset.\n- c. No procedure shall have\
    \ a name that begins with an underscore.\n- d. No procedure name shall be longer\
    \ than 31 characters.¹¹⁵\n- e. No function name shall contain any uppercase letters.\n\
    - f. No macro name shall contain any lowercase letters.\n\n> 15 Rule 11 (required)\
    \ of [MISRA98].\n\n- g. Underscores shall be used to separate words in procedure\
    \ names.\n- h. Each procedure’s name shall be descriptive of its purpose. Note\
    \ that procedures encapsulate “actions” of a program and thus benefit from the\
    \ use of verbs in their names (e.g., adc_read()); this “noun-verb” word ordering\
    \ is recommended.\n  Alternatively, procedures may be named according to the question\
    \ they answer (e.g., led_is_on()).\n- i. The names of all public functions shall\
    \ be prefixed with...\n\n**Reasoning**: Good names make reviewing easier. The\
    \ use of prefixes is important.\n\n**Exceptions**: None.\n\n**Enforcement**: Compliance\
    \ with these rules shall be established during code reviews.\n\n## 6.2 Functions\n\
    \nRules:\n\n- a. Reasonable effort shall be taken to keep the length of each function\
    \ to about 50-100 lines.\n- b. Whenever possible, all functions shall have one\
    \ exit point.\n- c. Multiple exit points are allowed shall appear a maximum of\
    \ once.¹⁶\n- d. A prototype shall be defined for each function.\n- e. All private\
    \ functions shall be static.\n- f. Each parameter shall be meaningfully named.\n\
    \nExample:\n\n```c\nint state_change (int event)\n{\n    int result = ERROR;\n\
    \n    if (EVENT_A == event)\n    {\n        result = STATE_A;\n        // Don't\
    \ return here.\n    }\n    else\n    {\n        result = STATE_B;\n    }\n\n \
    \   return (result);\n}\n```\n\n## 6.3 Function-Like Macros\n\nRules:\n\n- a.\
    \ Parameterized macros shall not be used if an inline function can be written\
    \ to accomplish the same task.¹⁷\n- b. If parameterized macros are used for some\
    \ reason, these rules apply:\n  i. Surround the entire macro body with parentheses.\n\
    \  ii. Surround each use of a parameter with parentheses.\n  iii. Use each argument\
    \ no more than once, to avoid unintended side effects.\n\nExample:\n\n```c\n//\
    \ Don’t do this ...\n#define MAX(A, B) ((A) > (B) ? (A) : (B))\n```\n\n```c\n\
    // ... if you can do this.¹⁸\ninline int max(int a, int b)\n```\n\n> ¹⁷ [C99]\
    \ formally added the C++ keyword inline to C.\n¹⁸ Note that individual functions\
    \ will be needed to support each base type for comparison.\n"
  mdcn: "\n\n## 5.3 有符号整数\n\n规则：\n\n- 不应在有符号整数类型中定义位域（Bit-fields）。\n- 不应使用任何位运算符（即\
    \ &, |, ^, `<<` 和 `>>`）来操作有符号整数数据。\n- 在比较或表达式中，不应将有符号整数与无符号整数混合。为了这一点，意用于无符号的十进制常量应在末尾加上\
    \ ‘u’。\n\n示例：\n\n```c\nuint8_t a = 6u;\nint8_t b = -9;\nif (a + b < 4)\n{\n  \
    \  // 这条正确的路径应该被执行\n    // 如果 -9 + 6 的结果是 -3 < 4，如预期那样。\n}\nelse\n{\n    // 这条错误的路径实际上被执行\n\
    \    // 因为 -9 + 6 变成了 (0xFF - 9) + 6 = 252。\n}\n```\n\n**原因**：在有符号整数容器内操作二进制数据的多个细节属于\
    \ C 标准中的“实现定义行为”（implementation-defined behaviors）。此外，混合有符号和无符号数据的结果可能导致与数据相关的错误。\n\
    \n**异常**：无。\n\n**强制**：可以使用静态分析工具来检测对这些规则的违反。\n\n## 5.4 浮点数\n\n规则：\n\n- a. 尽可能避免使用浮点数常量和变量。定点运算可能是另一种替代方案。\n\
    - b. 当需要进行浮点计算时：\n  i. 使用 [C99] 类型名 `float32_t`、`float64_t` 和 `float128_t`。\n\
    \  ii. 在所有单精度常量后加上 'f'（例如 `pi = 3.1415927f`）。\n  iii. 如果你的数学计算依赖于双精度，请确保编译器支持它。\n\
    \  iv. 永远不要测试浮点值的相等或不相等性。\n\n示例：\n\n```c\n// 确保编译器支持双精度。\n#include <limits.h>\n\
    #if (DBL_DIG < 10)\n  #error \"Double precision is not available!\"\n#endif\n\
    ```\n\n![](img/438827201b612eb034012d328f242030_65_0.png)\n\n# 嵌入式 C 编码规范\n\n\
    **原因**：错误地使用浮点运算会产生大量的错误风险；这些风险超出了本文的范围¹¹³ 默认情况下，C 将所有浮点数常量提升为双精度，这在目标平台上可能效率低下或不受支持。然而，许多微控制器对浮点运算没有任何硬件支持。编译器可能不会警告这些不兼容性，而是通过链接一个大型（通常为几\
    \ KB 代码）且缓慢（每次操作需要许多指令周期）的浮点仿真库来执行请求的数值操作。\n\n**异常**：无。\n\n**强制**：这些规则应在代码审查期间执行。\n\
    \n¹³ [Seacord] 在第 6 章对这些问题进行了很好的解释并提供了一些建议指南。\n\n66\n\n## 5.5 结构体与联合体\n\n规则：\n\
    \n- 应采取适当措施，防止编译器在用于与外设通信或通过总线或网络与另一个处理器通信的结构体（struct）或联合体（union）类型中插入填充字节（padding\
    \ bytes）。\n- 应采取适当措施，防止编译器更改位域（bit-fields）内预期的位顺序¹¹⁴\n\n**原因**：在结构体和联合体领域存在大量的实现定义行为。特别是位域，面临着严重的的可移植性问题，包括缺乏标准的位排序，并且对它们经常调用的固定宽度整数类型没有官方支持。\n\
    \n**异常**：无。\n\n**强制**：这些规则应在代码审查期间执行。\n\n> ¹⁴ 包括静态断言（static assertions）或其他编译时检查，以及使用预处理器指令从两个竞争的结构体定义中选择其一。\n\
    \n嵌入式 C 编码规范\n\n## 6 程序\n\n## 6.1 命名规范\n\n规则：\n\n- a. 程序的名称不应该是 C、C++ 或任何其他已知\
    \ C 编程语言扩展的关键字，特别是 K&R C 和 C99。受限名称包括 `interrupt`、`inline`、`class`、`true`、`false`、`public`、`private`、`friend`、`protected`\
    \ 等。\n- b. 程序的名称不应与 C 标准库中的函数重叠。此类名称的示例包括 `strlen`、`atoi` 和 `memset`。\n- c. 程序的名称不能以下划线开头。\n\
    - d. 程序名称长度不应超过 31 个字符¹¹⁵\n- e. 函数名称不应包含任何大写字母。\n- f. 宏名称不应包含任何小写字母。\n\n> 15 [MISRA98]\
    \ 的规则 11（强制性）。\n\n- g. 使用下划线分隔程序名称中的单词。\n- h. 每个程序的名称应描述其用途。注意，程序封装了程序的“动作”，因此在名称中使用动词会大有益处（例如\
    \ `adc_read()`）；建议使用这种“名词-动词”的词序。\n  或者，程序也可以根据它们回答的问题来命名（例如 `led_is_on()`）。\n\
    - i. 所有公共函数的名称应以... 为前。\n\n**原因**：良好的命名让审查变得更容易。使用前缀是非常重要的。\n\n**异常**：无。\n\n**强制**：对这些规则的遵守情况应在代码审查期间确定。\n\
    \n## 6.2 函数\n\n规则：\n\n- a. 应努力将每个函数的长度保持在 50-100 行左右。\n- b. 只要可能，所有函数应只有一个出口点。\n\
    - c. 允许有多个出口点，但最多出现一次¹⁶\n- d. 每个函数都应定义一个原型（prototype）。\n- e. 所有私有函数都应该是静态的（`static`）。\n\
    - f. 每个参数都应有意义地命名。\n\n示例：\n\n```c\nint state_change (int event)\n{\n    int result\
    \ = ERROR;\n\n    if (EVENT_A == event)\n    {\n        result = STATE_A;\n  \
    \      // 不要在此处返回。\n    }\n    else\n    {\n        result = STATE_B;\n    }\n\
    \n    return (result);\n}\n```\n\n## 6.3 函数宏\n\n规则：\n\n- a. 如果可以使用内联函数（inline\
    \ function）完成相同任务，则不应使用参数化宏¹⁷\n- b. 如果出于某些原因使用了参数化宏，则适用以下规则：\n  i. 用括号包裹整个宏体。\n\
    \  ii. 用括号包裹每个参数的使用。\n  iii. 每个参数的使用不要超过一次，以避免意外的副作用。\n\n示例：\n\n```c\n// 不要这样做\
    \ ...\n#define MAX(A, B) ((A) > (B) ? (A) : (B))\n```\n\n```c\n// ... 如果你可以这样做的话¹⁸\n\
    inline int max(int a, int b)\n```\n\n> ¹⁷ [C99] 正式将 C++ 的 `inline` 关键字引入 C语言。\n\
    ¹⁸ 注意，对于每个基础类型都需要单独函数来进行比较。\n\n"
