- md: "\n# Example:\n\n```\n// Step 1: Batten down the hatches.\nfor (int hatch =\
    \ 0; hatch < NUM_HATCHES; hatch++)\n{\n    if (hatch_is_open(hatches[hatch]))\n\
    \    {\n        hatch_close(hatches[hatch]);\n    }\n}\n```\n\n```\n// Step 2:\
    \ Raise the mizzenmast.\n// TODO: Define mizzenmast driver API.\n```\n\n**Reasoning:**\
    \ Following these rules results in good comments. And good comments result in\
    \ good code. Unfortunately, it is easy for source code and documentation to drift\
    \ over time. The best way to prevent this is to keep the documentation as close\
    \ to the code as possible. Doxygen is a useful tool to regenerate documentation\
    \ describing the modules, functions, and parameters of a project as code is changed.\n\
    \n**Exceptions:** Individual projects may standardize the use of Doxygen features\
    \ of beyond those in the template files.\n\nEmbedded C Coding Standard\n\n**Enforcement:**\
    \ The quality of comments shall be evaluated during code reviews. Code reviewers\
    \ should be on the lookout both that the comments accurately describe the code\
    \ and that they are clear, concise, and valuable. Rebuilds of Doxygen-generated\
    \ documentation files, for example in HTML or PDF, shall be automated and made\
    \ part of the software build process.\n\n# 3 White Space\n\n## 3.1 Spaces\n\n\
    Rules:\n\n- a. Each of the keywords if, else, while, for, switch, and return shall\
    \ always be followed by one space.\n- b. Each of the assignment operators =, +=,\
    \ -=, *=, /=, %= &=, |, ^, ~, and != shall always be preceded and followed by\
    \ one space.\n- c. Each of the binary operators +, -, *, %, <, <=, >=, ==, !=,\
    \ <<, >>, &&, || shall always be preceded and followed by one space.\n- d. Each\
    \ of the unary operators +, -, ++, !, and ~ shall always be written without a\
    \ space on the operand side and with one space on the other side.\n- e. The pointer\
    \ operators * & shall be written with white space on each side within declarations\
    \ but otherwise without a space on the operand.\n- f. The ? and : characters that\
    \ comprise the ternary operator each always be preceded and followed by one space.\n\
    - g. The structure pointer and structure member operators (-> and , respectively)\
    \ shall always be without surrounding spaces.\n- The left and right brackets of\
    \ the array subscript operator ([ and ]) shall always be without surrounding spaces.\n\
    - Expressions within parentheses shall always have no spaces adjacent to the left\
    \ and right parenthesis characters.\n- The left and right parentheses of the function\
    \ call operator shall always be without surrounding spaces, except that the function\
    \ declaration shall feature one space between the function name and the left parenthesis\
    \ to allow that one particular mention of the function name to be easily located.\n\
    - Each comma separating function parameters shall always be followed by one space.\n\
    - Each semicolon separating the elements of a statement shall always be followed\
    \ by one space.\n- Each semicolon shall follow the statement it terminates without\
    \ a preceding space.\n\n**Reasoning:** The placement of white space is as important\
    \ as the placement of the text of a program. Good use of white space reduces eye\
    \ strain and increases the ability of the author and reviewers of the code to\
    \ spot potential bugs.\n\nExceptions: None.\n\n**Enforcement:** These rules shall\
    \ be enforced by an automated tool such as a code beautifier.\n\n# 3.2 Alignment\n\
    \nRules:\n\n- a. The names of variables within a series of declarations shall\
    \ have their first characters aligned.\n- b. The names of struct and union members\
    \ shall have their first characters aligned.\n- c. The assignment operators within\
    \ a block of adjacent assignment statements shall be aligned.\n- d. The # in a\
    \ preprocessor directive shall always be located in column 1, except when indenting\
    \ within a #if or #ifdef sequence.\n\n**Reasoning:** Visual alignment emphasizes\
    \ similarity. A series of consecutive lines containing variable declarations is\
    \ easily spotted and understood as a block. Blank lines and unrelated alignments\
    \ should be used to visually distinguish unrelated blocks of code appearing nearby.\n\
    \nExceptions: None.\n\n**Enforcement:** These rules shall be enforced during code\
    \ reviews.\n\n# 3.3 Blank Lines\n\nRules:\n\n- a. No line of code shall contain\
    \ more than one statement.\n- b. There shall be a blank line before and after\
    \ each natural block of code. Examples of natural blocks of code are loops, *if-else*\
    \ and *switch* statements, and consecutive declarations.\n- c. Each source file\
    \ shall have a blank line at the end.¹¹⁰\n\n**Reasoning:** Appropriate placement\
    \ of white space provides visual separation and makes code easier to read and\
    \ understand, just as the white spaces between paragraphs of this coding standard\
    \ aid readability.\n\n**Exceptions:** None\n\n**Enforcement:** These rules shall\
    \ be enforced during code reviews.\n\n¹¹⁰ This is for portability, as some compilers\
    \ require the blank line.\n\n# 3.4 Indentation\n\nRules:\n\n- a. Each indentation\
    \ level within a module should consist of 4 spaces.\n- b. Within a switch statement,\
    \ each case statement should be indented; the contents of the case block should\
    \ be indented once more.\n- c. Whenever a line of code is too long to fit within\
    \ the maximum line width, indent the second and any subsequent lines in the most\
    \ readable manner possible.\n\nExample:\n\n```\nsys_error_handler(int err)\n{\n\
    \    switch (err)\n    {\n        case ERR_FIRST:\n            ...\n         \
    \   break;\n        default:\n            ...\n            break;\n    }\n}\n\
    ```\n\n```\n// Purposefully misaligned indentation; see why?\nif ((first_long_comparison_here\n\
    \    && second_long_comparison_here\n    || third_long_comparison_here)\n{\n \
    \   ...\n}\n```\n\n**Reasoning:** Fewer indentation spaces increase the risk of\
    \ visual confusion while more spaces increase the likelihood of line wraps.\n\n\
    **Exceptions:** The indentation in legacy code modules that are indented differently\
    \ shall not be changed unless it is anticipated that a significant amount of the\
    \ code will be modified. In that case, the indentation across the module shall\
    \ be changed in a distinct version control step. This is because a side effect\
    \ of changing indentation is the loss of difference tracking capability in the\
    \ version control system. It is thus valuable to separate the code changes from\
    \ the indent changes.\n\n**Enforcement:** An automated tool shall be provided\
    \ to programmers to convert indentations automatically. This tool shall modify\
    \ all new or changed code prior to each build.\n\n# 3.5 Tabs\n\nRules:\n\n- a.\
    \ The tab character shall never appear within any module.\n\n**Reasoning:** The\
    \ width of the tab character varies by editor and programmer preference, making\
    \ consistent visual layout a continual source of headaches during reviews and\
    \ maintenance.\n\n**Exceptions:** Existing tabs in legacy code modules shall not\
    \ be eliminated unless it is anticipated that a significant amount of the code\
    \ will be modified. In that case, the tabs shall be eliminated from the entire\
    \ module in a distinct version control step. This is because a side effect of\
    \ eliminating tabs is the loss of difference tracking capability in the version\
    \ control system. It is thus valuable to separate the code changes from the white\
    \ space changes.\n\n**Enforcement:** The absence of the tab character in new or\
    \ modified code shall be confirmed via an automated scan at each build.\n\n# 3.6\
    \ Linefeeds\n\nRules:\n\n- a. Whenever possible, all source code lines shall end\
    \ only with the single character LF (0x0A).\n\n**Reasoning:** The multi-character\
    \ sequence CR-LF (0x0D 0x0A) is more likely to cause problems in a multi-platform\
    \ environment than the single character LF. One such problem is associated with\
    \ multi-line preprocessor macros on Unix platforms.\n\n**Exceptions:** None.\n\
    \n**Enforcement:** Whenever possible, programmer’s editors shall be configured\
    \ to use LF. In addition, an automated tool shall scan all new or modified source\
    \ code files during each build, replacing each CR-LF sequence with LF.\n"
  mdcn: "\n\n# 示例：\n\n```\n// Step 1: Batten down the hatches.\nfor (int hatch = 0;\
    \ hatch < NUM_HATCHES; hatch++)\n{\n    if (hatch_is_open(hatches[hatch]))\n \
    \   {\n        hatch_close(hatches[hatch]);\n    }\n}\n```\n\n```\n// Step 2:\
    \ Raise the mizzenmast.\n// TODO: Define mizzenmast driver API.\n```\n\n**原因：**\
    \ 遵循这些规则可以产生良好的注释。良好的注释会产生良好的代码。遗憾的是，源代码和文档很容易随着时间的推移产生偏差。防止这种现象最好的方法是让文档与代码尽可能接近。Doxygen\
    \ 是一个非常有用的工具，可以在代码更改时重新生成描述项目模块、函数和参数的文档。\n\n**异常：** 单项目可能会对超出模板文件的 Doxygen 特性使用进行标准化处理。\n\
    \n嵌入式 C 编码规范\n\n**执行：** 在代码审查期间应对注释的质量进行评估。代码审查人员应关注注释是否准确描述了代码，并确保它们清晰、简洁且有价值。例如，应当自动重新生成\
    \ Doxygen 生成的文档文件（如 HTML 或 PDF），并作为软件构建过程的一部分。\n\n# 3 空格\n\n## 3.1 空格\n\n规则：\n\
    \n- a. 每个关键字 if, else, while, for, switch 和 return 后面都应始终紧跟一个空格。\n- b. 每个赋值运算符\
    \ =, +=, -=, *=, /=, %= &=, |, ^, ~, 和 != 前后都应始终紧跟一个空格。\n- c. 每个二元运算符 +, -, *,\
    \ %, <, <=, >=, ==, !=, <<, >>, &&, || 前后都应始终紧跟一个空格。\n- d. 每个一元运算符 +, -, ++, !,\
    \ 和 ~ 在编写时，操作数一侧应始终不留空格，而另一侧应留一个空格。\n- e. 指针运算符 * & 在声明中两侧均应留空格，但在其他情况下操作数周围不应有空格。\n\
    - f. 组成三元运算符的 ? 和 : 字符前后都应始终紧跟一个空格。\n- g. 结构体指针和结构体成员运算符（分别为 -> 和 ,）周围不应始终有空格。\n\
    - 数组下标运算符的左右括号 ([ 和 ]) 周围不应始终有空格。\n- 括号内的表达式与左、右括号字符之间应始终不留空格。\n- 函数调用运算符的左右括号周围不应始终有空格，但函数声明的函数名和左括号之间应留有一个空格，以便于快速定位该函数名的特定引用。\n\
    - 每个分隔函数参数的逗号后面都应始终紧跟一个空格。\n- 每个分隔语句元素的分号后面都应始终紧跟一个空格。\n- 每个分号应紧跟在它终止的语句之后，且前面不应有空格。\n\
    \n**原因：** 空格的放置与程序文本的放置同样重要。良好使用空格可以减少视觉疲劳，并提高代码作者和审查人员发现潜在 bug 的能力。\n\n**异常：**\
    \ 无。\n\n**执行：** 这些规则应通过自动化工具（如代码格式化工具）执行。\n\n# 3.2 对齐\n\n规则：\n\n- a. 一系列声明中的变量名其首字符应对齐。\n\
    - b. 结构体和联合体成员名的首字符应对齐。\n- c. 相邻赋值语句块中的赋值运算符应当对齐。\n- d. 预处理指令中的 # 始终应位于第 1 列，除非在\
    \ #if 或 #ifdef 序列中进行缩进。\n\n**原因：** 视觉对齐强调了相似性。包含变量声明的一系列连续行很容易被识别并理解为一个块。应使用空行和不相关的对齐来在视觉上区分相邻的不相关的代码块。\n\
    \n**异常：** 无。\n\n**执行：** 这些规则应在代码审查期间执行。\n\n# 3.3 空行\n\n规则：\n\n- a. 每行代码不应包含超过一个语句。\n\
    - b. 在每个自然代码块的前后都应有一个空行。自然代码块的示例包括循环、*if-else* 和 *switch* 语句以及连续的声明。\n- c. 每个源文件末尾应有一个空行¹¹⁰。\n\
    \n**原因：** 恰当放置空格可以提供视觉隔离，并使代码更易阅读和理解，就像本编码规范中段落之间的空格有助于可读性一样。\n\n**异常：** 无。\n\n\
    **执行：** 这些规则应在代码审查期间执行。\n\n¹¹⁰ 这是为了可移植性，因为某些编译器要求空行。\n\n# 3.4 缩进\n\n规则：\n\n- a.\
    \ 模块内的每个缩进级别应由 4 个空格组成。\n- b. 在 switch 语句中，每个 case 语句应当缩进；case 块的内容再缩进一次。\n- c.\
    \ 当一行代码过长无法放入最大行宽时，以最可读的方式对第二行及任何后续行缩进。\n\n示例：\n\n```\nsys_error_handler(int err)\n\
    {\n    switch (err)\n    {\n        case ERR_FIRST:\n            ...\n       \
    \     break;\n        default:\n            ...\n            break;\n    }\n}\n\
    ```\n\n```\n// 故意未对齐的缩进；知道为什么吗？\nif ((first_long_comparison_here\n    && second_long_comparison_here\n\
    \    || third_long_comparison_here)\n{\n    ...\n}\n```\n\n**原因：** 少的缩进空格会增加视觉混乱风险，而更多的空格会增加换行的概率。\n\
    \n**异常：** 对于缩进方式不同的旧代码模块，除非预计将修改大量代码，否则不更改其缩进。在这种情况下，应在独立的版本控制步骤中更改整个模块的缩进。这是因为更改缩进的副作用是丢失差异跟踪。因此，应将代码更改与缩进的更改分开。\n\
    \n**执行：** 应为程序员提供自动化工具来自动转换缩进。该工具应在每次构建之前修改新或更改的代码。\n\n# 3.5 制表符\n\n规则：\n\n- a.\
    \ 任何模块内禁出现制表符。\n\n**原因：** 制表符的宽度随编辑器和程序员的偏好而异，使得在审查和维护期间一致的视觉布局是一个不断的难题。\n\n**异常：**\
    \ 旧代码模块中的现有制表符除非预计修改大量代码，否则不消除。在这种情况下，应在独立的版本控制步骤中消除整个模块的制表符。这是因为消除制表符的副作用是丢失差异跟踪。因此，应将代码更改与空格更改分开。\n\
    \n**执行：** 每次构建时应通过自动扫描确认新或修改代码中不存在制表符。\n\n# 3.6 换行符\n\n规则：\n\n- a. 在可能的情况下，所有源代码行应仅以单个字符\
    \ LF (0x0A) 结束。\n\n**原因：** 在多平台环境中，多字符序列 CR-LF (0x0D 0x0A) 比单个字符 LF 更引起问题。此类问题与\
    \ Unix 平台上的多行预处理器宏有关。\n\n**异常：** 无。\n\n**执行：** 在可能的情况下，程序员的编辑器应配置为使用 LF。此外，自动化工具应在每次构建扫描所有新或修改的源文件，将每个\
    \ CR-LF 序列替换为 LF。\n\n"
