  md: '# Chapter 11: Cookies, Ajax, and Security 333


    Figure 11-4

    With this plug-in you can extract data from an RSS feed into a code tag.


    ![](img/95e4c43b430487125c342550cc090977_350_0.png)


    # About the Plug-in


    This plug-in fetches data from a website in the background. It returns the following
    arguments:


    +   * id An object or object ID—this cannot be an array

    * callback The function to pass the returned data to once it has been retrieved

    * url The URL with which to communicate

    * args Any arguments to pass to the URL


    # Variables, Arrays, and Functions


    | | |

    |---|---|

    | content | Local variable containing the content type used for URL-encoded forms
    |

    | ajax | Local variable assigned an Ajax object |

    | CreateAjaxObject() | Plug-in to return a new Ajax object |

    | open() | Method of ajax for opening a request |

    | setRequestHeader() | Method of ajax for setting various headers |

    | send() | Method of ajax for sending a request |

    | Math.random() | Function to return a random number |


    # How It Works


    This plug-in starts as AjaxRequest(). It starts by setting the content type of
    the data in the request to a URL-encoded format. It returns the Ajax object with
    a call to CreateAjaxObject(), and if the result is not true, returns the value
    false as it cannot proceed without


    ```

    var content = ''application/x-www-form-encoded''

    var ajax = new CreateAjaxObject(id, callback)

    if (ajax) return false

    ```'
