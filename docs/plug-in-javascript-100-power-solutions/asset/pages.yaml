- pgno: 348
  md: '# Chapter 11: Cookies, Ajax, and Security 331


    # Variables, Arrays, and Functions


    | nocache | Local variable assigned a random string to prevent caching |

    | ajax | Local variable assigned an Ajax object |

    | CreateAjaxObject() | Plug-in to return a new Ajax object |

    | open() | Method of ajax for opening a request |

    | send() | Method of ajax for sending a request |

    | Math.random() | Function to return a random number |


    # How It Works


    This plug-in uses the GET method to communicate with a server, which passes data
    in the tail of the URL called a query string. However, browser caching will interfere
    with repeated requests of this, serving only the cached data from previous requests.
    Therefore, the variable nocache is created and assigned a random string to ensure
    that no two GET will be the same


    ```

    var nocache = ''nocache'' + Math.random() * 1000000

    ```


    Next, the variable ajax is assigned the new Ajax object returned by calling CreateAjaxObject(),
    and if the result is not true (meaning the cache was unsuccessful) a value of
    false is returned:


    ```

    var ajax = new CreateAjaxObject(id)

    if (!ajax)) return false

    ```


    If execution reaches this point, the string ''GET'' for the type of request was
    successfully created, so the open method of ajax is called, passing the string
    ''GET'' for the type of request. This is followed by a string comprising the URL
    to be called that was passed in url, the arguments supplied in args, the nocache
    string is created, and the value true to tell the browser to make an asynchronous
    call (a value of false would tell it to make a synchronous call):


    ```

    ajax.open(''GET'', url + ''?'' + args + nocache, true)

    ```


    Finally, the call is made and the value returned true to indicate success:


    ```

    ajax.send(null)

    return true

    ```


    # How To Use It


    To use this plug-in, decide what data you wish to load and from where, then call
    the plug-in, passing a function to call back when the data has been retrieved
    and any arguments that require passing.


    The following example is somewhat interesting in how it gets the problem of being
    unable to access websites other than the one the Ajax web page came from by calling
    a PHP script on the server, which then fetches the requested data without a hitch:


    ```

    <div id=''ajax''></div>

    <script>

    window.onload = function

    ```'
