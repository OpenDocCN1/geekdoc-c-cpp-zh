  md: '# Plug-In JavaScript: 100 Power Solutions


    There are a number of plug-ins that didn''t fit clearly within any of the previous
    chapters, so I''ve included them here. They offer features such as keeping your
    copyright current each year; a less intrusive, in-browser alert window that doesn''t
    prevent you from accessing the rest of the current document; a function to provide
    tooltips for any object; the facility to add cursor trails to the mouse pointer;
    and a way to make a web page touch enabled for use with tablet computers and other
    touch devices.


    # RollingCopyright()


    This simple plug-in is worth using on any pages where a copyright notice is included,
    because no matter how many years you updated the page, it will always show the
    current year, as shown by the screen grab in Figure 13-1.


    # About the Plug-In


    This plug-in takes a start year when the copyright began and returns a copyright
    string with the current year. It requires the following argument:


    +   * The start year as a four-digit number


    # Variables, Arrays, and Functions


    | date | Local date object |

    | --- | --- |

    | Date() | Function to return a new date object |

    | getFullYear() | Function to return a four digit year |


    # How It Works


    This plug-in creates a new date object and assigns it the current year as a four-digit
    number, like:


    ```

    var date = new Date();

    date = date.getFullYear();

    ```


    ![](img/95e4c43b430487125c342550cc090977_377_0.png)'
