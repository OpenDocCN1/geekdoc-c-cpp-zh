  md: '# Plug-In JavaScript: 100 Power Solutions


    # When an Array Is Passed


    The o() function comprises three parts. The first tests the argument id to see
    if it is an array, which it does by using the instanceof operator, like this:


    ```

    if (id instanceof Array) ...

    ```


    If it is an array more than one object has been passed to the function, the array
    tmp is declared as a local array (that can only be accessed by this instance of
    function) using the var keyword, like this:


    ```

    var tmp = []

    ```


    Then a for(j) loop iterates through the array, using the integer variable j as
    an index pointer to each individual element.


    # Making Recursive Calls


    Interestingly, the O() function is called again within each iteration, but with
    just the single element located at the current array indexed to j. This is known
    as a recursive function call, meaning that the function calls itself. It is a
    very neat way to reuse code to get a job done once you have broken it down into
    a more manageable chunk. The loop code looks like this:


    ```

    for (var j = 0; j < id.length; ++j)

    tmp.push(O(id[j]), property, value)

    ```


    To explain how it works in this instance, one element has been extracted from
    an array and then that element is passed back to the function, which will then
    process that element and return a value back to itself. So, for example, if an
    array of items is passed to O(1), it will be iterated through each, each time
    one element from the array in turn to the function''s receiving end, until all
    elements have been processed.


    Looked from the receiving end, it sees that it has received a single (and not
    an array), control flow drops to the remaining code, where that item is processed
    and whatever value or object is calculated. Upon return the result of the function
    call (back to the function) is placed in the next location in the tmp array using
    the JavaScript push() and is promptly forgotten (about since it has been dealt
    with), and the next element of the array is processed.


    Once all elements are done, the value of j equals the number of items in the array,
    as indicated by id.length, the array tmp is returned to the calling code.


    You will notice that the variables property and value are not treated as arrays,
    because they aren''t. If the variable property has a value it will be the name
    of an object''s property, and value will contain the value to assign to that property.
    These arguments are optional but can be used to give the same value to the same
    properties of all objects in an array. Because the function itself calls recursively,
    it also has to pass property and value (whether or not they have values) along
    with the object to be processed, otherwise if they have values they will be lost.'
