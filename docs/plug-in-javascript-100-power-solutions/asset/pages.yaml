  md: "# Variables, Arrays, and Functions\n\n| j | Local variable for indexing id\
    \ if id is an array |\n| Deflated | Property of id that is true if id is deflated\
    \ |\n| Deflate () | Plug-in to deflate an object to O by O |\n| Reflate () | Plug-in\
    \ to deflate an object to its original dimensions |\n\n# How It Works\n\nThis-plugin\
    \ uses the standard recursive techniques of the others to determine whether id\
    \ is an array and if it is, to pass each element of the array recursively back\
    \ to the same function to be dealt with individually, as follows:\n\n```\nif (id\
    \ instanceof Array)\n{\n  for (var j = 0; j < id.length; ++)\n    DeflateToggle(id[j],\
    \ w, h, msecs, interruptible, CB)\n  return\n```\n\nAfter there are two cases,\
    \ the first of which tests the Deflate property of id. If it is true, the object\
    \ has (or is in the process of being) deflated, so the Reflate () plug-in is called.\
    \ Otherwise, the object is inflated (or in the process of being reinfl), so the\
    \ Deflate () plug-in is called, like this:\n\n```\nO(id).Deflated) Reflate(id,\
    \ w, h, msecs, interruptible, CB)\nDeflate(id, w, h, msecs, interruptible, CB)\n\
    ```\n\n# How To Use It\n\nYou can use this plug-in to replace having to call both\
    \ of the Deflate () and Reflate () plug-ins and save to tracking their deflated/inflated\
    \ states. The following code is similar to the previous example in the Reflate\
    \ () section, except that it is shorter because it uses DeflateToggle() inside\
    \ of both the Deflate () and Reflate () plug-ins:\n\n```\n<span id='d'>Mouseover\
    \ Mc/</span>\n<img id='p1' src='photo1.jpg' />\n<img id='p2' src='photo2.jpg'\
    \ />\n<img id='p3' src='photo3.jpg' />\n```\n\n```\n<script>\nwindow.onload =\
    \ function() \n{\n  Locate('p1', ABS, 0, 30)\n  Locate('p2', ABS, 160, 30)\n \
    \ Locate('p3', ABS, 320, 30)\n  Deflate('p2', 1, 0, 1\n```\n\n```\nO('d').onmouseover\
    \ = toggle\nO('d').onmouseout = toggle\n```"
