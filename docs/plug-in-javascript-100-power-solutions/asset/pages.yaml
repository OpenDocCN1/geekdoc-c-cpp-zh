    \ applicable seamlessly ignores more advanced JavaScript techniques as created\
    \ programming (however they may seem more powerful) so that you can understand\
    \ every single plug-in.\n\n# About the Plug-in\n\nThis plug-in creates an Ajax\
    \ object ready for making background calls to the web server. It requires the\
    \ following arguments:\n\n+   * id An object or id—this may not be an array\n\
    * callback The function to pass the returned data to once it has been retrieved\n\
    \n# Variables, Arrays, and Functions\n\n| | Local Ajax object |\n| readyState\
    \ | Property of ajax containing its state |\n| status | Property of ajax containing\
    \ its status |\n| responseText | Property of ajax containing the text returned\
    \ by the Ajax call |\n| XMLHttpRequest | Function used by non-Microsoft browsers\
    \ to create an Ajax object |\n| ActiveXObject() | Function used by Microsoft browsers\
    \ to create an Ajax object |\n\nHow It Works\nSince the Ajax object has to be\
    \ created in different ways for different browsers, the plug-in uses pairs of\
    \ try() ... catch() statements to create each method in turn until one works or\
    \ all have been tried and false is returned, like this:\n\n```\ntry {\n  var ajax\
    \ = new XMLHttpRequest()\n}\ncatch(el) {\n  try\n```"
