  md: '# 340 Plug-In JavaScript: 100 Power Solutions


    Form validation is something you do on your web server to ensure that you receive
    the data that is required and remove any attempts at hacking or compromising your
    server or the data on it. However, it is very helpful to your users if you also
    provide validation directly in the browser.


    For example, it can be particularly helpful to provide extra assistance when a
    user is filling in a form to save from having to be represented to them if it
    fails validation at the server. It also cuts down on your bandwidth usage and
    keeps the optimum number of concurrent users on the server.


    This chapter includes plug-ins to provide extra hints for blank forms that must
    be filled out, to provide the ability to resize text areas if a user types more
    than the expected amount of text, to check e-mail addresses and passwords are
    valid, to clean input strings, and to check credit card number validates.


    # 90 FieldPrompt()


    When a form hasn''t been entered, there''s a large blank area of white space that
    isn''t being used. With this plug-in you can display a prompt in the field that
    disappears as the user starts typing into it. Figure 12-1 shows two empty fields
    containing prompts that were created using this plug-in, in a similar way to the
    new HTML5 placeholder feature.


    # About the Plug-In


    This plug-in takes a form input object, and if it is blank, displays a prompt
    of your choosing. It requires the following:


    +   - id An object or object ID—cannot be an array

    - prompt The prompt string to display

    - inputcolor The color to use for displaying user input

    - promptcolor The color in which to display the font

    - promptstyle The font to use for the prompt, such as ''italic''


    Figure 12-1 This plug-in provides additional information to your users.


    ![](img/95e4c43b430487125c342550cc090977_357_0.png)'
