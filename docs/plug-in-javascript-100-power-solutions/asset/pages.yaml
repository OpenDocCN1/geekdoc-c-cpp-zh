  md: '# 70 Plug-In JavaScript: 100 Power Solutions


    # About the Plug-in


    This plug-in requires a decimal number to be passed to it, and then it returns
    that number in the form of a hexadecimal string. It requires this argument:


    +   - n A decimal number to be converted into hexadecimal


    # Variables, Arrays, and Functions


    | toString() | JavaScript function for converting a number to a string |


    # How It Works


    This plug-in uses two code segments combined into a single statement. The first
    segment looks like this:


    ```

    n < 16 ? ''0'' : ''''

    ```


    This is known as a ternary expression, in which n < 16 is an initial test. The
    ? symbol indicates that if the result of the test is true then the value following
    the ? should be returned. Otherwise the value following the : should be returned.
    In this example, that means that values of n that are less than 16 result in the
    string ''0'' being returned, while values of n that are 16 and above result in
    '''' being returned.


    The reason for this is that this plug-in will mostly be used by code that wants
    to create color triples for setting a color. These triplets are made up of three
    groups of two hexadecimal characters, like FF0008, 112233, CCCCCC, and so on.


    Each of these stands for hexadecimal FF (256 decimal) shades of the colors green
    and blue. For example, FF0088 means the intensity values for the given color should
    be FF, 00 and 88, in hexadecimal. Therefore, going back to the code segment, if
    n is less than 16 it becomes a single digit in hexadecimal (a number between 0
    and F), and in such cases a 0 is added to the number up to the two digits.


    Having padded the number with a 0 (if necessary), the number n is then passed
    to the JavaScript toString() function with an argument of 16, like this code segment:


    ```

    n.toString(16)

    ```


    This tells it to convert the number to base 16, which is hexadecimal. The results
    of the two segments are concatenated and returned. When you put both pieces of
    code together they like this:


    ```

    return (n < 16 ? ''0'' : '''') + n.toString(16)

    ```


    # How To Use It


    To convert a decimal number to hexadecimal, pass it to the DecHex() plug-in, like
    this:


    ```

    alert(''The decimal number 173 in hexadecimal is '' + DecHex(173))

    ```'
