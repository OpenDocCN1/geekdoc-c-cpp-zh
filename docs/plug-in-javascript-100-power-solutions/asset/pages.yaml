  md: "# Chapter 1: Making the Best Use of These Plug-ins\n\ncredited in the source\
    \ code. Please include a note to say that I have your permission to post your\
    \ code online and in future editions of this book or, sadly, I will not be able\
    \ to use it.\n\n# Waiting Until the Web Page Has Loaded\n\nQuite often, and particularly\
    \ on longer pages, you will not want your JavaScript run until all elements in\
    \ a page have loaded. One reason is that the graphics you'll be using might not\
    \ be ready, or the contents of objects such as divs and spans may not be available\
    \ for manipulation.\n\nAlso, some browsers will return incorrect values when a\
    \ page hasn't loaded. For example, if you request the width of the browser too\
    \ early you may get a value that doesn't include the vertical scroll bar, and\
    \ if you try to place anything in part of the screen (thinking that it is available\
    \ to you) it will be hidden by a scroll bar.\n\nSome browsers don't even return\
    \ a semi-useful value. For instance, when asked for the location of an object\
    \ prior to page loading, Internet Explorer will always return the coordinates\
    \ 0,0.\n\nTherefore, you will usually need to place all your JavaScript within\
    \ the body of the following function:\n\n```\n<script>\nwindow.onload = function()\
    \ {\n  // Your code and all its functions goes here...\\n}\n</script>\n```\n\n\
    This makes so that your code will not get executed until the very last item has\
    \ loaded into the page and has fully rendered. If you get into the habit of enclosing\
    \ all your code within this function, you'll ensure that all objects you access\
    \ are available and avoid error messages initially unsightly web pages.\n\nBy\
    \ the way, although you could move the call to Initialize() rather than in the\
    \ <head> of a page, I don't recommend it. Initialize() doesn't rely on any elements\
    \ of the web page since it interacts only with the browser to create global variables\
    \ and attach functions to keyboard and mouse events, so you don't need to move\
    \ it. Also, placing the call to Initialize() right after the command that loads\
    \ the plug-ins is sensible, you can't have one without the other.\n\n> **Tip**\
