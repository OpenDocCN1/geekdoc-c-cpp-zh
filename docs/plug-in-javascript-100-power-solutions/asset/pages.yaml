  md: '# 66 Plug-In JavaScript: 100 Solutions


    Figure 3-15

    This plug-in makes it easy to insert values into strings.


    ![](img/95e4c43b430487125c342550cc090977_85_0.png)


    # Variables, Arrays, and Functions


    | tmp | Local variable containing the string to process |

    | arguments | Array of arguments passed to the plug-in |

    | replace() | JavaScript function to replace substrings in a string |

    | regExp() | JavaScript function to create a regular expression |


    # How It Works


    This plug-in uses the handy fact that JavaScript passes an array to every function
    that is called. This array is called arguments, and each element of it is one
    of the values that has been passed to the function.


    Therefore, the first element is extracted and placed in tmp, a local variable.
    This is the string in to make the variable substitutions, like this:


    ```

    var tmp = arguments[0]

    ```


    Then a for() loop is used to iterate through each remaining element. If there
    is a substring with the value ''#1'' within the string tmp, the first is inserted
    in its place. The same happens for ''#2'', ''#3'', and any number of similar substrings,
    each being replaced by the next line of the values passed to the plug-in, like
    this:


    ```

    tmp = tmp.replace(new RegExp(''#'' + j, ''g''), arguments[j])

    ```


    To allow one value to be inserted in many places in a string, a global replace
    is enabled by using the RegExp() object to create a new regular expression with
    the value ''g'' supplied to indicate a global search and/or.


    Finally, the modified tmp string is returned.


    # How To Use It


    To insert values into a string using InsVars(), you call it in the following manner:


    ```

    string = InsVars("The product of #1 and #2 is #3", 6, 7, 6 * 7)

    ```'
