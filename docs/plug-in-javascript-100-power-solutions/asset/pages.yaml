- pgno: 202
  md: '# Repeat()


    As well chaining plug-ins together, you can make one or more plug-ins repeat a
    specified number of times using the Repeat () plug-in. In a medium such as it''s
    not possible to capture the motion in these examples, so Figure 7-2 shows the
    ball (slightly grayed out) as it was captured on different repetitions of an animation
    created using this plug-in.


    # About the Plug-in


    This plug-in allows you to repeat a chain of actions as many times as you like.
    It requires the following arguments:


    +   * number The number of times the chain should be repeated

    * calls An array of strings containing a sequence of plug-ins to call


    # Variables, Arrays, and Functions


    | j | Local variable used for counting the repeats |

    | temp | Local copy of the calls array |

    | concat() | Function to merge two or more arrays |

    | Chain() | Plug-in used to chain a group of plug-ins together |


    # How It Works


    This plug-in takes the calls array and duplicates it enough times so that there
    are number copies of the calls, like this:


    ```

    var temp = calls

    for (var j = 1 ; j < number ; ++j)

    calls = calls.concat(temp)

    Chain(calls)

    ```


    ![](img/95e4c43b430487125c342550cc090977_202_0.png)'
  merge: -1
  img_proc: true
- pgno: 203
  md: "First, the array temp is assigned a copy of calls, then the concat() function\
    \ merges the contents of temp with calls, until there are number copies altogether.\
    \ Finally, the Chain() plug-in is called to start the first call running.\n\n\
    # How To Use It\n\nUsing this plug-in is the same as calling Chain() except that\
    \ you also pass an additional parameter to specify the number of times the chain\
    \ should repeat.\nThe following example slightly modifies the one in the Chain()\
    \ and NextInChain() plug-ins section to make the bounce around the browser 10\
    \ times:\n\n```\n<img id='ball' src='ball.png' />\n\n<script>\nwindow.onload =\
    \ function() {\n  Position('ball', ABS)\n  width = GetWindowWidth()\n  height\
    \ = GetWindowHeight()\n  r = width - 100\n  b = height - 100\n  x = width / 20\n\
    \  y = height / 50\n\n  ch1 = InVars('Slide('ball', #1, #2, #3, #4, 500, 0)*',\
    \ 0, y, x, 0)\n  ch2 = InVars('Slide('ball', #1, #2, #3, #4, 500, 0)*', x, 0,\
    \ r, y)\n  ch3 = InVars('Slide('ball', #1, #2, #3, #4, 500, 0)*', r, y, x, b)\n\
    \  ch4 = InVars('Slide('ball', #1, #2, #3, #4, 500, 0)*', x, b, 0, y)\n\n  Repeat(10,\
    \ Array(ch1, ch2, ch3, ch4))\n}\n</script>\n```\n\n# The Plug-in\n\n```\nfunction\
    \ Repeat(number, calls) {\n  var temp = calls\n\n  for (var j = 1; j < number\
    \ ; ++j)\n    calls = calls.concat(temp)\n\n  Chain(calls)\n}\n```\n\n# While()\n\
    \nSometimes you might find it convenient for a chain of plug-ins to keep repeating\
    \ while a certain condition is true; for example, if no key has been pressed or\
    \ the mouse hasn't been clicked. With this plug-in you can supply a test condition\
    \ along with a chain, and as long as the condition returns true, the chain will\
    \ keep repeating."
