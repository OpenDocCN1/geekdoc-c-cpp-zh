- pgno: 249
  md: '# ContextMenu()


    With this plug-in, you can replace the standard mouse right-click menu with your
    own. Much more than a way to block casual users from viewing the source of a page,
    the ContextMenu plug-in lets you create entire entities of HTML and pop them up
    at the cursor position when the user clicks the right mouse button. In Figure
    8-7, a simple menu for a hardware store has been popped up with a right-click.


    # About the Plug-In


    This plug-in requires an object that, when right-clicked, should pop up a menu,
    which you also pass to it. It takes the following arguments:


    +   - Id An object to which the right-click should be attached—generally, you
    will attach to the document object, but you can be more specific and attach different
    context menus to different objects (arrays of objects are not supported)

    - contents An object containing the menu to be displayed

    - type The type of effect for popping the menu up and, out, of ''fade'', ''inflate'',
    ''zoom'', or ''instant''

    - w If applicable and this argument is true or 1, the object''s width will be
    modified during the transition

    - h If applicable and this argument is true or 1, the object''s height will be
    modified during the transition

    - msecs The number of milliseconds the pop-up transition should take


    **Figure 8-7**

    Now you can create your right-click menus.


    ![](img/95e4c43b430487125c342550cc090977_249_0.png)'
