    ```

    <script>

    window.onload = function() {

    ids = Array([''m1'', ''m2'', ''m3''])

    Hide(ids)

    Resize(ids, 150, 100)

    Position(ids, FIX)

    S(ids, ''backgroundColor'', ''red'')

    S(ids, ''color'', ''cyan'')

    Show(ids)

