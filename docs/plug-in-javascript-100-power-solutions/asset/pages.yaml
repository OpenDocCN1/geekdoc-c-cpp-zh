  md: "# 326 Plug-In JavaScript: 100 Power Solutions\n\n# The Plug-in\n\n```\nfunction\
    \ ProcessCookie(action, name, value, seconds, path,\ndomain, secure)\n{\n  if\
    \ (action == 'save') {\n    var date = new Date();\n    date.setTime(date.getTime()\
    \ + seconds * 1000);\n    var expires = seconds ? '; expires=' + date.toUTCString()\
    \ : '';\n    path = path ? '; path=' + path : '';\n    domain = domain ? '; domain='\
    \ + domain : '';\n    secure = secure ? '; secure=' + secure : '';\n    document.cookie\
    \ = name + '=' + escape(value) + expires + path;\n  } else if (action == 'read')\
    \ {\n    if (!document.cookie.length) return false;\n    else {\n      var start\
    \ = document.cookie.indexOf(name + '=');\n      if (start == -1)n      {\n   \
    \     start += name.length + 1;\n        var end = document.cookie.indexOf(';',\
    \ start);\n        end = (end == -1) ? document.cookie.length : end;\n       \
    \ return unescape(document.cookie.substring(start, end));\n      }\n    }\n  }\
    \ else if (action == 'erase')\n    ProcessCookie('save', '', -60)\n}\n```\n\n\
    # 85 CreateAjaxObject()\n\nAjax is the power behind the vastly improved user interaction\
    \ of Web 2.0. It stands for Asynchronous JavaScript and XML, which is really a\
    \ contrived acronym for a background call to a web server. Using this plug-in,\
    \ you can easily create a new Ajax object that can be used to send and request\
    \ information to and from a web server in the background, without the user being\
    \ aware of it.\n\nUnlike the past, when a POST or GET stopped action in the browser\
    \ until it completed, with Ajax the browser handles the request without disrupting\
    \ the web application.\n\nFigure 11-2 shows a simple HTML file that has been fetched\
    \ from the web server and inserted into a div, using this plug-in in connection\
    \ with the next one, GetAjaxRequest().\n\n![](img/95e4c43b430487125c342550cc090977_343_0.png)"
