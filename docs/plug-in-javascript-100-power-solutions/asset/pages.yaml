  md: "# 244 Plug-In JavaScript: 100 Solutions\n\nThe width and height have a pixel\
    \ added to resolve issues in some browsers there might other be an anomaly at\
    \ the edge boundary, which could cause the rollover to cycle rapidly.\n\nThe final\
    \ three lines of the main setup hide ro2 so that only ro1 is visible, then both\
    \ ro1 and ro2 are relative to their enclosing object at an offset of 0,0, so that\
    \ they are on top of each other. Finally, an omnibus event attaches the DoRoll()\
    \ function to the mouseover event of ro1, as follows:\n\n```\nHide(ro2)\nLocate(a,\
    \ REL, 0, 0)\nro1.mouseover = DoRoll\n```\n\nDoRoll() Subfunction\nThis function\
    \ swaps the two objects' visibility properties so that ro2 becomes visible and\
    \ ro1 becomes hidden. It sets up a repeating interrupt to call the RollCheck()\
    \ sub-function EVERY MILLISECONDS, like this:\n\n```\nHideToggle(a)\nvar id =\
    \ setInterval(RollCheck, INTERVAL)\n```\n\nThe local variable id is the value\
    \ returned by setInterval(), which will be used by clearInterval() to cancel the\
    \ repeating interrupts.\n\nRollCheck() Sub-function\nThis function checks whether\
    \ the mouse has moved out of the space occupied by the objects. If it has, it\
    \ swaps the two objects back that ro1 is visible and ro2 is again hidden. Then\
    \ it cancels the interrupts with a clear clearInterval(), like this:\n\n```\n\
    if (MOUSE_X < x || MOUSE_X > x + w ||\n    MOUSE_Y < y || MOUSE_Y > y + h)\n{\n\
    \  HideToggle(a)\n  clearInterval(id)\n}\n```\n\nWhy Not Use mouseout instead\
    \ of RollCheck()?\nI would like to use mouseout instead of RollCheck(), it's not\
    \ possible to do so on an object that contains many items passing the mouse cursor\
    \ between these items will trigger an unwanted mouseout event. Therefore the simplest,\
    \ and also a 100 percent reliable solution, is to check whether the mouse has\
    \ moved out of the area and then call the code that you would otherwise have attached\
    \ to an mouse event.\n\nHow To Use It\nTo use this plug-in, you need to prepare\
    \ two objects that have the same width and height. You can then pass them as arguments.\
    \ Or, if you prefer, you can create several sets of matching pairs as rollovers\
    \ and pass two arrays to the plug-in. This repeats calls to the plug-in if you\
    \ have many sets to create."
