  md: '# Chapter 6: Movement and Animation 133


    The preceding process is then repeated to discover the distance between the new
    start location of frx,fry and the final location of tox,toy and this distance
    is placed in the variable len2, like this:


    ```

    var len2 = Distance - frx, toy - fry

    ```


    It is now possible to adjust the length of msecs (the length of time of the animation
    should take in milliseconds) by multiplying it by the result of dividing len2
    by len1, like this:


    ```

    msecs *= len2 / len1

    ```


    For example, if the original length is 240 pixels and the new length is 200 pixels,
    then the preceding statement is equivalent of


    ```

    msecs *= 200 / 240

    ```


    or:


    ```

    msecs *= 0.833

    ```


    Therefore, the length of time the animation should take will become 833 milliseconds.
    This formula works when interrupting the calling discovers that the actual location
    of the object is further away from the start position it has specified. If that
    is the case, msecs will end up multiplied by a value larger than 1, which will
    extend the time that she wanted.


    # Determining the Movement Distance for Each Step


    Next, the plug-in computes the distance between the start and end positions (whether
    as requested by the calling code, or modified due to interrupting a previous slide)
    and divides the horizontal and vertical differences into the number of steps required
    to make the animation for the number of milliseconds specified in msecs (which
    again could be the original value, or a new value computed from interrupting a
    previous slide). The following code calculates these steps:


    ```

    var stepx = (tox - frx) / (msecs / INTERVAL)

    var stepy = (toy - fry) / (msecs / INTERVAL)

    ```


    To explain how these lines of code work, I have determined that the value in INTERVAL
    (which is 30 by default) is the optimal time in milliseconds between animation
    frames. Therefore, the following calculation calculates the number of steps required
    to make an animation msecs milliseconds (if each step happens every INTERVAL milliseconds):


    ```

    (msecs / INTERVAL)

    ```


    Always ensure you pass the msecs argument a value greater than zero because this
    plug-in (and all of the animation and transition plug-ins) does not check for
    having a value of zero, which will cause errors and halt the animation.'
