- pgno: 172
  md: "# How to Use It\n\nTo use this plug-in, you need to ensure that the second\
    \ object has already been deflated. Ideally, you will have also released each\
    \ object from its position in the HTML by giving it a position style of 'absolute'\
    \ or 'relative'. You will probably also have overlaid the objects on each other.\n\
    \nThe following example does all of this and a span that you can pass your mouse\
    \ over to initiate the swaps:\n\n```\n<span id='d'>Mouse Me</</span>\n\n<img id='p1'\
    \ src='photo1.jpg' />\n<img id='p2' src='photo2.jpg' />\n\n<script>\nwindow.onload\
    \ = function() {\n  Locate(Array(['p1', 'p2']), 0, 30)\n  Deflate('p2', 1, 1,\
    \ 0)\n}\n\nO('d').onmouseover = swap1\nO('d').onmouseout = swap2\n\nfunction swap1()\
    \ {\n  DeflateBetween('p1', 'p2', 1, 1, 1000, 1)\n}\n\nfunction swap2() {\n  DeflateBetween('p2',\
    \ 'p1', 1, 1, 1000, 1)\n}\n</script>\n```\n\nThe HTML section creates a span with\
    \ the text \"Mouse Me\" and also displays two images. All three are given a position\
    \ style setting of 'absolute' and located at 0 pixels, and 30 down using calls\
    \ to the Locate() plug-in. In the <script> section, both of the images are deflated\
    \ the second image using the Deflate() plug-in, over the shortest time possible\
    \ (1 millisecond), which is virtually instantaneous.\n\nFinally, the mouseover\
    \ and mouseout events of the div are attached, in order, to the swap1() and swap2()\
    \ functions, which call the DeflateBetween() plug-in to either swap from image\
    \ 1 to image 2, or from image 2 to image 1.\n\nThe transitions are given 1000\
    \ milliseconds (or 1 second) to complete. Because the interruptible parameter\
    \ is set to 1, you can pass your mouse in and out of the Mouse text to instantly\
    \ change between displaying one or the other.\n\nYou may want to try changing\
    \ the w and h arguments to see the various different you can achieve."
