  md: '# Chapter 1: Making the Best Use of These Plug-ins


    # Including All the Plug-ins


    The easiest (and recommended) way for to use these plug-ins is to load them all
    into a web page as a complete set, which you can do with the following command,
    assuming you saved the file PJ.js into the current folder:


    ```

    <script type="text/javascript" src="PJ.js"></script>

    ```


    In fact, by all modern browsers assume that script will be JavaScript, so you
    can use the following short form, which omits the type= parameter:


    ```

    <script src="PJ.js"></script>

    ```


    Or, if you have PJ.js located elsewhere, such as in the root folder, you change
    the command to include the path, like this:


    ```

    <script src="PJ.js"></script>

    ```


    Alternatively, if you use a specific folder for your JavaScript files, such as
    scripts, you use this command:


    ```

    <script src="scripts/PJ.js"></script>

    ```


    And the compressed version of the file, PJsmall.js, can be included instead, like
    this:


    ```

    <script src="scripts/PJsmall.js"></script>

    ```


    Immediately the line that includes the plug-ins, you need to add a second line
    as follows, which will initialize the plug-ins, ready for:


    ```

    <script>Initialize()</script>

    ```


    The benefits of using is that you only need to add a couple of lines to your web
    pages to have access to all the plug-ins, and there is only one change when you
    want to modify any plug-ins. Also, at around 60KB for the raw JavaScript file,
    it doesn''t take very long to load or consume bandwidth.


    What''s more, already mentioned, you can choose to use the compressed version
    of the file, called PJsmall.js, which is half the size and can be found in the
    zip file along PJ.js. The only difference between the two files is that the larger
    one has all the functions shown in plain text which are easy to see and edit you,
    the small is tightly compress and not easy to understand if you view it. Regardless
    of this difference, both work identically to each other.


    # Including Single Plug-ins


    All of the plug-ins included in this book are fully integrated with each other,
    and as you progress through the book you will see how plug-ins rely more and more
    on earlier, until you reach the point where plug-ins that would normally require
    dozens of lines of code only take a handful of lines because they can draw on
    the wealth of features provided by other plug-ins.'
