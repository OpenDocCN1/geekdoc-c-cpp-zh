    \ that place the ball exactly in the center of the browser (bearing in its width\
    \ and height of 100 pixels).\n\nNext, Slide() plug-ins are assembled into strings\
    \ using the InsVars() plug-in. Then calls the ball from the center left of the\
    \ browser to the top middle, then to the center right, then to the bottom middle,\
    \ and finally back to the center left of the browser.\n\nThese calls are then\
    \ placed in an array and passed to the Chain() plug-in to get the ball rolling\
    \ (so) to speak.\n\n> NOTE Because of the way chaining has been implemented with\
    \ a single global array, you can have only one chain of plug-ins running at a\
    \ time. You can carefully create a chain that interleaves two or more sets of\
    \ plug-ins so that number of different animations appear to be running concurrently.\
    \ However, you will need to use trial and error to get the best results with this\
    \ technique.\n\n# Using the Callback() Function Directly\n\nThe Callback() function\
    \ achieves its execution by adding the name of a function to call back after the\
    \ current one has finished execution. You can also do this, as the plug-in you\
    \ calls supports chaining, as detailed in Table 7-2.\n\nFor example, if you would\
    \ like to use the Hide() plug-in called immediately after Deflate(), you can use\
    \ code such as:\n\n```\nDeflate(myobject, 1, 1, 500, 0, 'Hide(myobject)')\n```"
