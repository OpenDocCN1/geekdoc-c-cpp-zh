    # ### The Plug-in

    This plug-in checks whether an e-mail address is correctly structured and in a
    valid format. It requires the following argument:


    +   * email A string containing the e-mail address to validate


    # ### Variables, Arrays, and Functions


    | | |

    |---|---|

    | at | Local variable containing the position of the @ sign in email |

    | left | Local variable containing the part of email before the @ |

    | right | Local variable containing the part of email after the @ |

    | llen | Local variable containing the length of left |

    | rlen | Local variable containing the length of right |

    | test() | Function to test for a match in a string |

    | indexOf() | Function to locate the first occurrence of one string in another
    |


    # ### How It Works

    This function tests various aspects of a supplied string to check whether it conforms
    to the correct standards for an e-mail address. It starts off seeing if there
    is an @ symbol in the string, using a call to indexOf():


    ```

    var at = email.indexOf(\@'');

    ```


    Then, if there is no @ or the argument characters that are not word characters
    A-Z, a-z, or 0-9), hyphens, periods or the @, underscore, or plus symbols, the
    plug-in returns false, as it has already determined that the e-mail address is
    invalid, as follows:


    ```

    if (at == -1 || /[^A-Za-z0-9\.\@_]+\/.test(email)) return false

    ```


    The variables left and right are assigned the string on each side of the symbol,
    and the variables llen and rlen are then set to the length of each, like this:


    ```

    var left = email.substr(0, at)

    var right = email.substr(at + 1)

    var llen = left.length

    var rlen = right.length

    ```'
