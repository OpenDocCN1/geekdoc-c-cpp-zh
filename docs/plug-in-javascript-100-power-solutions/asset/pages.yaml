  md: '# Chapter 13: Solutions to Common Problems


    # TouchEnable()


    Interest in touch devices really picked up momentum with Apple''s release of the
    iPad in the spring of 2010, I couldn''t resist adding a bonus 101st plug-in to
    this collection. Here''s the final plug-in, which allows you to touch-enable a
    web page. Example 13-8 shows a copy of the web page for Plug-in PHP, a companion
    to this one, in which a small frame has been attached to the top of the browser
    window with links to touch-enabling on and off.


    # About the Plug-in


    This plug-in changes the mouse click so that a click and drag operation becomes
    a scroll up, down, left and right simply by touching the screen and moving your
    finger (or a stylus), also, in the same manner as you would using an iPhone, iPad,
    Android phone, or other touch device. It requires the following argument:


    +   * If or true, touch enabling is turned on; otherwise, it is turned off


    ![](img/95e4c43b430487125c342550cc090977_396_0.png)


    Plug-in was originally developed in 1994 by Razmus Ralf to replace a set of PHP
    scripts he had been using to maintain his website. In the early days Early ensured
    that Plug-in should be flexible and expandable, with numerous rewrites of the
    language parser, which has remained a key ethos of this project to date, with
    numerous extension libraries available through the PEAR (PHP Extension and Application
    Repository) add-on. By simply having access to these tools you may need to quickly
    prototype a project to a tight deadline, which provides this very specific functionality.
    That''s where this book comes into its own because it provides 100 ready-to-go-plugins
    you can simply drop into your programs and use, normally with a simple, call:


    Figure 13-8 With this plug-in you can touch-enable your web pages.'
