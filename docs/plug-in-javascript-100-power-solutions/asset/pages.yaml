- pgno: 244
  md: "# Chapter 8: Menus and Navigation 227\n\n| onmouseover | Event of each heading\
    \ |\n|---|-|\n| onmouseout | Event of each heading |\n| slice() | Function to\
    \ return a subsection of an array |\n| PopUp() | Plug-in to pop up an object |\n\
    | PopDown() | Function to pop down an object |\n| PopToggle() | Function to toggle\
    \ the popped state of an object |\n| DoFoldingMenu() | Subfunction to perform\
    \ the transition |\n\n# # How It Works\n\nThe first thing this plug-in does pop\
    \ down all the objects in the contents array except for the first one\n\n```\n\
    PopDown(contents.slice(1), type, w, h, 1, 0)\nO(contents[]).PO_IsUp = true\n```\n\
    \nslice() is used with a value of 1 to PopDown() all elements from the second\
    \ element onward (because the first element of an array is 0). The msec argument\
    \ to PopDown() is so that the transition is set to take only 1 millisecond and\
    \ is, therefore, virtually instantaneous.\n\nNext, the contents and arrays are\
    \ iterated through a for () loop, using j as an index, like these:\n\n```\nfor\
    \ (var j = 0; j < contents.length; ++j)\n{\n  O(headings[j]).FO_C = contents[j]\n\
    \  S(headings[j]).cursor = 'pointer'\n\n  if (action == 'hover') O(contents[j]).onmouseover\
    \ = DoFoldingMenu\n  else O(contents[j]).onclick = DoFoldingMenu\n}\n```\n\nEach\
    \ heading has its FO_C property assigned the object in the associated contents\
    \ array. Each heading will pop up and down the contents associated with it. When\
    \ each heading its cursor property set to 'pointer', the mouse pointer will change\
    \ when it passes over the heading.\nAfter that action argument is tested. If it\
    \ is 'hover', the DoFoldingMenu() subfunction is attached to the current heading's\
    \ on event so that it will be called by passing the mouse over it.\nOtherwise,\
    \ the subfunction is attached to the current heading's onclick event so that it\
    \ will only be called when the heading is clicked.\n\n# # The DoFoldingMenu Subfunction\n\
    \nOnce all the various properties and events are set up for the plug-in, the DoFoldingMenu()\
    \ subfunction will be called whenever a change to the menus is required."
