    \ This has the effect of leaving the first item visible:\n\n```\nO(id).BB_Ready\
    \ = true\nFadeOut(objects.slice(1), 1, 0)\n```\n\nAfter that, a for() loop iterates\
    \ through all the first item in objects, subtracting the height of each previous\
    \ object from the local variable h. Each object is then released from its position\
