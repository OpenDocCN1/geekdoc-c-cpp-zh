- pgno: 165
  md: '# Plug-In JavaScript: 100 Power Solutions


    About the Plug-In

    This plug-in takes an object (or an array of objects) and reinflates it to its
    original dimensions after it has been deflated using the Deflate() plug-in. You
    can call this plug-in only on objects that have been previously inflated, otherwise
    the call will be ignored. It takes the following arguments:


    +   - id An object, object ID, or an array of objects and/or object IDs

    - w If true or 1, the object''s width will expand to its original value

    - h If true or 1, the object''s height will expand to its original value

    - msecs The number of milliseconds the animation should take

    - interruptible If true (or 1), this plug-in can be interrupted by a new call
    on the same object; otherwise, if false (or 0), the call is uninterruptible


    # Variables, Arrays, and Functions


    | j | Local variable containing index id if it is an array |

    | stepw | Local variable containing the amount of horizontal change per frame
    |

    | steph | Local variable containing the amount of vertical change per frame |

    | width | Local variable containing the width to which id should be changed at
    each step |

    | height | Local variable containing the height to which id should be changed
    at each step |

    | DF_Flag | Property of id that is true if a Deflate() call is in progress |

    | DF_Int | Property of id containing true if the deflation is interruptible |

    | DF_ID | Property of id that clears an interrupt with clearInterval() |

    | DF_OldW | Property of id containing the unshrunk width of id |

    | DF_OldH | Property of id containing the unshrunk height of id |

    | DF_Count | Property of id that counts the number of frames in the animation
    |

    | Deflated | Property of set to true if it has been deflated—used by the DeflateToggle()
    plug-in |

    | INTERVAL | Global variable with the value 30 |

    | setInterval() | Function to set repeating interrupts |

    | clearInterval() | Function to stop repeating interrupts |

    | DoRelate() | Subfunction to perform the animation |

    | Resize() | Plug-in to resize an object |'
