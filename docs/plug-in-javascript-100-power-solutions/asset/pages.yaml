  md: "# Plug-In JavaScript: 100 Power Solutions\n\n```\nurl = 'http://pluginjavascript.com/plug-ins/ajaxget.php'\n\
    args = 'http://wikipedia.org/''\nGetAjaxRequest('a', todiv, args)\n\nfunction\
    \ todiv() {\n  Html('a', this)\n}\n</script>\n```\n\nThe `ajaxget.php` program\
    \ is a very simple, one-liner that looks like this:\n\n```\n`<?php if (isset($_GET['url']))\
    \ echo file_get_contents($_GET['url']); ?>\n```\n\nIf your server supports PHP\
    \ (and most do), you can use the same script on to check whether the server has\
    \ a server query string looking like `url=http://example.com?args=vals`. (In the\
    \ case of the preceding example, the `args=vals` section is specified in the page\
    \ that assigns the string `url=http://wikipedia.org/` to the args variable).\n\
    \nThe `ajaxget.php` script then uses the `file_get_contents()` PHP function to\
    \ fetch the requested data (in this case the Wikipedia page), which is then returned\
    \ using the PHP echo command, which puts the data it fetched.\n\nThe `todiv()`\
    \ callback function, which was passed to `GetAjaxRequest()`, is then called back\
    \ and returns the retrieved data, which then inserts into the `innerHTML` property\
    \ of the div.\n\nAs with the previous Ajax example, the restrictions put by browsers\
    \ prevent the example and PHP files from residing on the same server, so here's\
    \ a link you can try out here:\n\n```\nhttp://www.pluginjavascript.com/plug-ins/example86.htm\n\
    ```\n\n# The Plug-in\n\n```\nfunction GetAjaxRequest(id, type, args) {\n  var\
    \ nocache = Math.random() * 1000000\n  var ajax = new CreateAjaxObject(id, type)\n\
    \  if (!ajax) return false\n\n  ajax.open('GET', url + '?' + args + nocache, true)\n\
    \  ajax.send(null)\n}\n```\n\n# PostAjaxRequest()\n\nThis plug-in is very similar\
    \ to GetAjaxRequest() except that it uses a POST request to interact with the\
    \ web. In Figure 11-4, the weather at the airport in Anchorage, Alaska, has been\
