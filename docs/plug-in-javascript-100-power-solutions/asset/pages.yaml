    var w = W(rol) + 1\nvar h = H(rol) + 1\nvar x = X(rol)\nvar y = Y(rol)\n```\n\n\
    8-10\nWhen the mouse\npasses over, the\nsecond object is\ndisplayed.\n\n![](img/95e4c43b430487125c342550cc090977_260_1.png)"
