    # About the Plug-in


    This plug-in swaps two objects by defating one and inflating the other at the
    same time. It requires these arguments:


    +   - id1 An object, an object ID, or an array of objects and/or object IDs

    - id2 An object, an object ID, or an array of objects and/or object IDs

    - w If true or 1, the object''s width will deflate or reflate

    - h If true or 1, the object''s height will deflate or reflate

    - msecs The number of milliseconds the animation should take

    - interruptible If true (or 1), this plug-in can be interrupted by a new call
    on the same object; if false (or 0), the call is uninterruptible


    # Variables, Arrays, and Functions


    | Deflate () | Plug-in to deflate an object to zero width and height |

    | Reflate () | Plug-in to reinfl an object to its previous dimensions |


    # How It Works


    This plug-in simply makes one call to Deflate() for the first object and another
    to Reflate() for the second.'
