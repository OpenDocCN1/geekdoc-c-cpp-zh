  md: "# 328 Plug-In JavaScript: 100 Solutions\n\n```\n{\n  ajax = new ActiveX(\"\
    Msxml2.XMLHTTP\")\n  catch(e2) {\n    try {\n      ajax = new ActiveX(\"Microsoft.XMLHttpRequest\"\
    )\n    } catch(e3) {\n      ajax = false\n    }\n  }\n}\n```\n\nThe first try()\
    \ works with any browser but Internet Explorer version 6 or lower, the second\
    \ is for Internet Explorer 6, and the third is for Internet Explorer 5. Therefore,\
    \ the tests are made roughly in order of popular browser usage.\n\nAssuming one\
    \ of the try() functions succeeds, ajax is a new Ajax object; otherwise, it contains\
    \ the value. If it isn't an object, the plug-in will return false; otherwise the\
    \ code attaches an inline, anonymous function to the onreadystatechange event\
    \ of ajax, as follows:\n\n```\nif (ajax) ajax.onreadystatechange = {\n  if (this.readyState\
    \ == 4 &&\n      this.status == 200 &&\n      this.responseText != null)\n   \
    \ callback.call(this.responseText)\n}\n```\n\nThis subfunction called every time\
    \ the readyState property of ajax changes and checks whether it has a value of\
    \ 4, the status property has a value of 200, and the responseText property is\
    \ not null. If all these are satisfied, it means an Ajax request was successful,\
    \ so the function in the callback argument is called, passing the data returned\
    \ in this.responseText.\n\nThe actual call is not made by this plug-in. It merely\
    \ catches the event to populate it with the value that is returned by an Ajax.\
    \ The Ajax call itself is made in the next two plug-ins, GetAjaxRequest() and\
    \ PostAjaxRequest().\n\n# How To Use It\n\nGenerally, you will not use this function\
    \ unless you call GetAjaxRequest() or PostAjaxRequest() to handle your Ajax calls,\
    \ because they will call it for you; in the following code, which loads some data\
    \ into a div:\n\n```\n<div id='a'></div>\n\n<script>\nwindow.onload = function()\n\
    ```"
