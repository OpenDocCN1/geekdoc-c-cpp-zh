- pgno: 166
  md: "# Chapter 6: Movement and Animation 149\n\n# How It Works\n\nThis plugin works\
    \ in a very similar way to the Deflate() plug-in with two main differences. First,\
    \ if the Deflated property of id is not true, the plug-in returns because the\
    \ object cannot be reinstated. Here is the piece of code that does that:\n\n```\n\
    if (O(id).Deflated) return\n```\n\nSecond, instead of DF_Count counting down from\
    \ the maximum step count to zero, it counts upward from 0 and is initialized to\
    \ a value in this plug-in (as opposed to the value it is assigned with msecs /\
    \ INTERVAL in the Deflate() plug-in). The DoRelate() function uses the following\
    \ statement to increment the Count property each frame of the animation (decrementing,\
    \ as in the Deflate() function):\n\n```\nif (O(id).DF_Count >= msecs / INTERVAL\n\
    ```\n\nThe Deflated property of id indicates whether an object is deflated or\
    \ inflated is set to false by this plug-in (rather than true, with Deflate()),\
    \ and the rest of the code is virtually meaningless, so please read the details\
    \ on Deflate() for further details.\n\n# How To Use It\n\nYou should call this\
    \ plug-in on an object after the object has been defeated using the Deflate()\
    \ plug-in. If you try to use it on an object that hasn't been deflated, the plug-in\
    \ will simply return.\n\nThe following example is expanded from the one in the\
    \ Deflate() plug-section. It has a div inserted before the images that you can\
    \ pass the mouse over to either deflate or inflate the images:\n\n```\n<span id='d'>Mouse\
    \ Me</</span>\n\n<img id='p1' src='photo1.jpg' />\n<img id='p2' src='photo2.jpg'\
    \ />\n<img id='p3' src='photo3.jpg' />\n\n<script>\nwindow.onload = function()\
    \ {\n  Locate('p1', ABS, 0, 30)\n  Locate('p2', ABS, 160, 30)\n  Locate('p3',\
    \ ABS, 320, 30)\n\nO('d').onmouseover = down\nO('d').onmouseout = up\n\nfunction\
    \ down() {\n  Deflate('p1', 1, 0, 2000, 1)\n  Deflate('p2', 1, 1, 2000, 1)\n \
    \ Deflate('p3', 0, 1, 2000, 1)\n}\n```"
  merge: -1
  img_proc: true
- pgno: 167
  md: "# Plug-In JavaScript: 100 Power Solutions\n\n```\nfunction up()\n{\n  Reflate('p1',\
    \ 1, 2000, 1)\n  Reflate('p2', 1, 2000, 1)\n  Reflate('p3', 0, 2000, 1)\n}\n</script>\n\
    ```\n\nThis example replaces the direct calls to the Deflate() plug-in with a\
    \ pair of new functions, down() and up(). These are attached to the onmouseover\
    \ and mousmouseout events of the span displaying the text \"Mouseover Me\", so\
    \ that when you move the mouse over the text objects deflate, and when you move\
    \ out, they inflate.\n\nThe calls to the two plug have their final parameter set\
    \ to I. This is the interruptible argument, and therefore, interrupting of the\
    \ plug-ins has been enabled. This means that the example is very responsive and\
    \ the animations occur immediately upon moving the mouse in or out of the span,\
    \ taking into account the current amount of deflation or reflation to smoothly\
    \ inverse the previous animation.\n\n# The Plug-in\n\n```\nfunction Reflate(id,\
    \ w, h, msecs, interruptible, CB)\n{\n  if (id.instanceof Array)\n  {\n    for\
    \ (var j = 0; j < id.length; ++j)\n      Reflate(id[j], w, h, msecs, interruptible,\
    \ CB)\n  }\n  return\n}\n\nif (!O(id).Deflated) return\nelse if (O(id).DF_Flag)\n\
    {\n  if (!O(id).DF_Int) return\n  else clearInterval(O(id).DF_ID)\n}\nelse O(id).DF_Count\
    \ = 0\n\nvar stepw = O(id).DF_OLDW / (msecs / INTERVAL)\nvar step = O(id).DF_OLDH\
    \ / (msecs / INTERVAL)\n\nO(id).DF_Flag = true\nO(id).Deflated = false\nO(id).DF_Int\
    \ = interruptible\nO(id).DF_ID = setInterval(DoRelate, INTERVAL)\n\nfunction DoRelate(id)\n\
    {\n  if (w) ResizeWidth(id, stepw * O(id).DF_Count)\n  if (h) ResizeHeight(id,\
    \ step * O(id).DF_Count)\n}\n\nif (O(id).DF_Count++ >= msecs / INTERVAL)\n```"
  merge: -1
  img_proc: true
