  md: '# 98 Plug-In JavaScript: 100 Solutions


    Any of the most impressive effects you''ll see on websites are also the simplest.
    For example, a smooth fade from one image to another is often far more beautiful
    than other wipe or dissolve transformations. Likewise, instantly revealing or
    hiding an object, when done well, is clean and on the eye.

    This chapter focuses on these types of effects, ranging from setting the visibility
    (or invisibility) of an object to fading in and out, fading between objects, and
    so on. The plug-ins in this chapter also provide the basic functionality required
    by many later plug-ins—particularly the menu and navigation plug-ins in Chapter
    8.


    # 31 Invisible()

    To ease this chapter, we will begin with a few short and sweet plug-ins that every
    JavaScript programmer needs in their toolkit. The first one is Invisible(), which
    makes an object disappear from a web page while the space it occupies remains,
    as opposed to hiding an object, which collapses and causes elements around it
    to assume its space (Plug-in 40, Hide() for effect).

    Figure 5-1 shows a span with the text "Now you see me...” followed by some plain
    text not in a div that reads "and soon you won''t.\ Alert has been raised to show
    these elements before the call to Invisible() is made. Figure 5-2 shows what happens
    after clicking the alert: the shaded text in the span is invisible, but the other
    text snippet remains in place, demonstrating that the span is still there, not
    visible.


    # About the Plug-In


    This plug-in makes an object invisible while retaining the object''s position
    and dimensions. It requires the following argument:


    +   - id An object, object ID, or an array of objects and/or object IDs


    # Variables, Arrays, and Functions


    | visibility | The style.visibility property of the object(s) |

    | HID | Global variable with the value ''hidden'' |


    ![](img/95e4c43b430487125c342550cc090977_115_0.png)


    FIGURE 5-1 The shaded area is a span to disappear when the alert is clicked.'
