    # 50 ZoomDown()


    This plug-in zooms an object down over time from its current size to zero dimensions.
    It does this in such a way that the object can be zoomed back again with the following
    plug-in, ZoomRestores(). Figure 6-8 shows four icons that had their mouseover
    events attached to this plug-in and are in varying states of zooming after the
    mouse swept across them.


    # About the Plug-in


    This plug-in takes an object and zooms it down until it has zero dimensions. It
    requires the following arguments:


    +   * id An object, an object ID, or an array of objects and/or object IDs

    * w If true or 1, the object''s width will be zoomed down

    * h If true or 1, the object''s height will be zoomed down

    * msecs The number of milliseconds the animation should take

    * pad If 0, the object will be moved during resizing so as to remain centered.
    If greater than 0, the object will be padded with CSS padding to retain its original
    dimensions as it zooms down. If -1, no padding will be applied and the object
    will not be moved during resizing.

    * interrupt If true (or 1), this plug-in can be interrupted by a new call on the
    same object; otherwise, if false (or 0), the call is uninterruptible


    ![](img/95e4c43b430487125c342550cc090977_184_0.png)


    FIGURE 6-8 These icons are in varying states of zooming down.'
