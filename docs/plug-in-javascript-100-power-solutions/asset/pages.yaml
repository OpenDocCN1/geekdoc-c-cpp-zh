    # ## Variables, Arrays, and Functions


    | db | Local variable used as shorthand for document.body |

    | iid | Local variable containing the result of calling setInterval() to be used
    later when calling clearInterval() |

    | flag | Local variable set to true when touch enabling is on |

    | oldmouse & oldmousey | Temporary copies of MOUSE and MOUSE_Y to save the mouse
    position when StartTE() is called |

    | tempmouse & tempmousey | Temporary copies of MOUSE_X and MOUSE_Y used in DoTE()
    to see if the mouse has moved |

    | MOUSE_X & MOUSE_Y | Global variables containing the location of the mouse |

    | MOUSE_IN | Global variable set to true if the mouse is within the bounds of
    the browser, otherwise false |

    | onmousedown & onmouseup | Events of the document body that trigger when the
    mouse is clicked and released |

    | StartTE() | Subfunction to begin enabling |

    | DoTE() | Sub-function to scroll the document as required |

    | StopTE() | Subfunction to turn off touch enabling |

    | PreventAction() | Plug-in to prevent the default action of an event |

    | setInterval() | Function to stop repeated interrupts to another function |

    | clearInterval() | Function to stop repeated interrupts |

    | scrollBy() | Function to scroll the document by a specified amount |


    # ## How It Works


    This plug-in starts by making a copy of document.body in the local variable db,
    thus creating a shorthand reference to shorten the code:


    ```

    var db = document.body

    ```


    The argument is when tested, and if it is 1 or true, touch enabling is turned
    on, the variables iid and flag are initialized, PreventAction() is called to disable
    the default actions for drag and select operations on the document body, and the
    onmousedown and onmouseup events of the document body are attached to the StartTE()
    and StopTE() subfunctions, as follows:


    ```

    var iid = null

    var flag = false

    PreventAction(db, ''both'', true)

    db.onmousedown = StartTE

    db.onmouseup = StopTE

    ```


    If state is 0 or false, then touch enabling is be turned off, so PreventAction()
    is called to restore the default actions for drag and select operations on the
    document body, onmousedown and onmouseup event hooks are removed, and the plug-in
    returns:'
