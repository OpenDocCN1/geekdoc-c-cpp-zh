    \ REL attribute).\n\nEach object's x coordinate is set to 0 to line up the left-hand\
    \ side of the first, and its y coordinate is set to h, which is a negative number\
    \ containing the sum of all the heights of the objects above the current one,\
    \ moving the object by the browser and placing it directly on top of the first:\n\
    \n```\nfor (j = 1; j < len; ++++) {\n  h = H(objects[j-1])\n  Locate(objects[j],\
    \ REL, h)\n}\n```\n\nNext, if the argument was 'stop', the BB_stop property of\
    \ id is set to true, indicating that the billiard transitions stop; otherwise,\
    \ it is assigned the value false:\n\n```\nO(id).BB_Stop = (wait == 'stop') ? true\
    \ : false\n```\n\nAfter that, as long as BB_Stop is not true and long as the billiard\
    \ is not running (the BB_Flag property of id will be true it is), an interrupt\
