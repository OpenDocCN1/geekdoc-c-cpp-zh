  md: '# Chapter 10: Audio and Visual Effects 301


    # About the Plug-In


    This plug-in takes a containing object such as a div or span an array of objects
    held within it, which it rotates like an automated billboard. It requires the
    following arguments:


    +   - id An object or object ID—this cannot be an array

    - objects An array of objects or object IDs

    - random If true, the objects will be displayed in random order

    - msecs The time in milliseconds that each fade between objects should stay

    - wait The time in milliseconds to wait before fading to the next object


    # Variables, Arrays, and Functions


    | | Local variable used as an index to iterate through the objects array |

    | len | Local variable containing the number of items in the objects array |

    | index | Local variable used to reference each object to be displayed |

    | h | Local variable containing the cumulative height of each object for locating
    them in their required locations |

    | rand | Local variable containing a random number between 0 and 1 |

    | BB_Ready | Property of id that is true if the objects have already been positioned
    in their places |

    | BB_Stop | Property of id that is true if the billboard rotation is disabled
    |

    | REL | Global variable with the value ''relative'' |

    | FadeOut() | Plug-in to fade out object |

    | FadeIn() | Plug-in to fade in object |

    | Locate() | Plug-in to apply a style position and location to an object |

    | H() | Plug-in to return an object''s height |

    | DoBillboard() | Subfunction to rotate the contents of the billboard |

    | setTimeout() | Function to set up an interrupt to a function |

    | clearTimeout() | Function to stop any timeout that has been set |

    | slice() | Function to return a portion of an array |

    | Math.floor() | Function to turn a floating point number into a rounded down
    integer |

    | Math.random() | Function to return a random number |


    # How It Works


    This plug-in begins by setting the local variable len to the number of items in
    the objects array:


    ```

    var len = objects.length

    ```'
