- pgno: 18
  md: '# Introduction


    JavaScript is the free language built into all modern browsers including Internet
    Explorer, Firefox, Safari, Opera, and Chrome. It is the power behind dynamic HTML
    and the Ajax environment used for Web 2.0 websites as Facebook, Flickr, Gmail,
    and many others. Plug-in JavaScript is aimed squarely at people who learned basic
    HTML (and perhaps a little CSS (and JavaScript) and are interested in doing more.
    For example, you may wish to create more dynamic menu systems, provide mouse hover
    effects, or support Ajax functionality. In this book you will be shown how to
    do all these things and much more using simple JavaScript, and it is never assumed
    that you know anything about a solution. Instead, you are taken through each step
    by step with the explanations included, so there is no need to look up anything
    elsewhere; every solution is complete and applicable immediately.


    Where possible, the book purposefully ignores advanced JavaScript techniques such
    as object programming (even though they may sometimes be more powerful) to make
    it easy for you to understand all the plug-ins. Not using these advanced techniques
    does mean the plug-ins are any less useful; rather, they may simply take a few
    extra lines of code to achieve the same result, which will generally run as fast
    as most complete code.


    The book can be dipped into required because each chapter is contained—when you
    have a particular problem to solve, you can refer to the relevant chapter and
    it will be all that you need.


    # About JavaScript


    The JavaScript programming language is already over 15 years old and is more popular
    than ever. Written by Brendan Eich at Netscape and previously known as Mocha and
    LiveScript, JavaScript was first incorporated into the Netscape Navigator browser
    in 1995, the same time that Netscape added support for Sun''s Java technology.


    JavaScript is a quite different language from Java, as part of a marketing deal
    between Netscape and Sun Microsystems, it given its name to benefit from the general
    buzz surrounding the Java language. To justify this naming, all Java keywords
    are reserved in JavaScript, its standard library follows Java''s naming conventions,
    and its Math and Date objects are based on Java 1 classes. the trademark "JavaScript"
    now belongs to Oracle Corporation—but the similarities end there.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Plug-in JavaScript: 100 Solutions


    Microsoft''s version, called JScript, was released year later as a component of
    Internet Explorer 3, as you might expect, it differed in several important respects,
    making it less 100 percent compatible with JavaScript. Unfortunately, remains
    true to this day, as you will see some of these plug-ins that work differently
    depending on which browser they find themselves running in.


    Unlike languages used for creating websites, such as Perl, PHP, and Ruby, JavaScript
    runs within the web browser, not on a server. This makes it the perfect tool for
    creating dynamic web pages which it can modify HTML elements in real time. It
    is also the technology behind Web 2.0 Ajax functionality, in which data is transferred
    between a web server and web browser scenes without the user being aware of it.


    As you will learn in Chapter 2, JavaScript''s great power lies in its ability
    to access the HTML Document Object Model (DOM), in which every element a web page
    can be individually addressed (either reading or modifying its value), and elements
    can also be created and deleted on the fly, as layered over each other and moved.
    You can go so far as treat a web browser as a blank canvas and build applications
    and games from scratch using JavaScript and the DOM (although doing so takes some
    quite advanced programming skills).


    Because Oracle the trademark to its name, JavaScript has officially been known
    as ECMAScript since the language was submitted to ECMA, the European Computer
    Manufacturers Association (a nonprofit standards organization).


    # JavaScript Frameworks


    With recent steps towards standardization, different browser developers implement
    JavaScript in slightly different ways, giving rise to the plethora of JavaScript
    frameworks now available such as jQuery, Yii, Moo, and so on. These technologies
    handle all the inconsistencies for you, providing a set of functions you can call
    without worrying about browser differences.


    The plug-ins in this book provide much of the functionality of these frameworks
    without actually this framework. Procedural programming techniques make it easy
    to use and understand their workings. And although, plug-ins are also interconnected
    and draw on each other''s features, it''s possible to just use a plug-in and its
    dependencies to a web page. On the other hand, with the major frameworks it''s
    quite difficult to extract the functions you need.


    Although at around 25Kb for the compressed file containing all the plug-ins, the
    tiny amount of bandwidth used means you probably never want or need to extract
    just a few functions: you can simply drop the link to any web page to access all
    the plug-ins.


    # What This Book Provides


    This book provides 100 ready-to-go plug-ins you can draw on, usually with a single,
    simple call. Of course, because all projects are different, I provide only the
    bones needed and layout styling to the absolute minimum. This leaves you to insert
    the functions into your programs and tailor them to your exact requirements.


    The types of plug-ins supplied offer quick and simple solutions to a very wide
    range of problems, allowing you to avoid having to reinvent the wheel each time
    you need a new'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Introduction XXVII


    feature—because the chances are that the module you need (or one very similar)
    can be found in this book as a plug-in. If it isn''t, because each and every one
    is broken down into component parts and explained in detail, you can cherry-pick
    code segments from different plug-ins to build yours.


    # About the Plug-ins


    All this book''s plug-ins are ready to run and can be typed in (if you don''t
    have Internet access) or downloaded from pluginjavascript.com, where they are
    stored as a complete collection in a single file.


    When you visit the website, you can navigate through the plug-ins by chapter and
    view the JavaScript code highlighted in color for clarity. From there, you can
    copy, paste, or download the plug-ins directly to your computer.


    # What Is And Not Included


    Although the first aim of this book is to provide newcomers to JavaScript with
    a comprehensive range of functions and routines to draw on, it has a secondary
    goal, which is to help you move up to the next level and build your own programming
    toolkit. Therefore, all the plug-ins are thoroughly documented and explained in
    detail, and advice is given on ways to improve and extend them, as well as how
    to adapt them to your requirements.


    While this book isn''t a programming manual or a teaching guide, I hope that by
    reading through the explanations, rather than just including the plug-ins in your
    projects, you''ll pick up a number of tips and tricks that many programmers take
    years to discover, and by osmosis you will learn more about the JavaScript programming
    language.


    # Plug-in License


    You are free to use any of the plug-ins in your projects, and you may modify them
    as necessary without attributing this book—although if you give credit, it will
    always be appreciated.


    However, you may not sell, give away, or otherwise distribute the plug-ins in
    any manner, whether printed or in electronic format, without the written permission
    of the publisher.


    # Companion Website


    A companion website (pluginjavascript.com) accompanies this book, where all 100
    plug-ins are available to download, with example code for you to experiment with.


    The best is to use code in conjunction with this book. As you read a chapter,
    call it up on the website, and you can view each plug-in onscreen with color-highlighted
    syntax. This makes it very easy to see the structure of each program.


    Then, when you wish, you can click a link to copy and paste code right into your
    own programs. Or, if you prefer, you can download all the plug-ins to your computer
    and from there them to your own website.'
  merge: -1
  img_proc: true
