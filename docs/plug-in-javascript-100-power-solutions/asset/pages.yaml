  md: '# 356 Plug-In JavaScript: 100 Solutions


    # How To Use It


    To use this plug-in, pass it card number, expiry date, and month and it will return
    true or false. Of course, this algorithm tests only whether the card meets certain
    requirements and not whether the user has entered a genuine card or whether the
    card has been revoked or over the user''s credit limit, and so on. The purpose
    of the plug-in is mainly in catching errors and preventing random data to see
    what happens.

    This example shows how you might use the plug-in:


    ```

    <h3>Your credit card details:</h3>

    <font face=''Courier New'' type=''text'' name=''size'' size=''24'' /><br />

    Card Number: input id=''ccnum'' type=''n'' />

    Expires: Month input id=''cmon'' type=''text'' name=''m'' size=''24'' />

    Year input id=''ccyear'' type=''text'' name=''y'' size=''4'' /><br />

    <button id=''button''>Submit Card</button>

    ```


    ```

    <script>

    window.onload = function () {

    O(''button'').onclick = function () {

    if (ValidateCreditCard(O(''ccnum'').value,

    O(''cmon'').value,O(''ccyear'').value))

    alert(''That card validated successfully'')

    else alert(''That card did not validate'')

    }

    }

    }

    </script>

    ```


    When incorporating the plug-in with your code you will probably want to replace
    the onclick event attached in the example with a function attached to the onsubmit
    event of your form. Also, make sure that when you do this your function returns
    true if the card verifies to allow the form submission to complete, and false
    (along with probably displaying an error message) if the card doesn''t validate,
    to stop the form submission going.


    > Note Only up to 2050 are currently supported in order to base card dates around
    the years 1950 to 2050. If you are reading a well thumbed copy of this book and
    it''s coming up to mid century, and JavaScript is still being used, you may wish
    to increase the value 50 in the 4th last line to a higher few years ahead of the
    current year.


    # The Plug-in


    ```

    function ValidateCreditCard(number, month, year)

    {

    number += ''''

    month += ''''

    year += ''''

    number = CleanupString(number, true, false, true, true)

    month = CleanupString(month, true, false, true, true)

    ```'
