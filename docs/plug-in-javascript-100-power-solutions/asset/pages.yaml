    ```\n\n```\n<script>\nwindow.onload = function () {\n  ColorFade('t', '#ffff',\
    \ '#0000ff', 'text', 2000, 0)\n  ColorFade('t', '#ff0000', '#ffff', 'back', 2000,\
    \ 0)\n}\nO('m').mouseover = function () { fade('#000000', '#0088ff') };\n('m').mouseout\
    \ = function () { fade('#0088ff', '#000000') };\n\nColorFade('m', a, b, 'text',\
    \ 200, 1)\n}\n</script>\n```\n\nThe section creates two spans with the IDs 't'\
    \ and 'm'. In the <script> section, the first two commands set both the background\
