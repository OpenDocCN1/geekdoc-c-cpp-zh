  md: '# 24 Plug-In JavaScript: 100 Solutions


    In my previous book, Plug-in PHP (McGraw-Hill/Professional, 2010) I was able to
    draw upon the wealth of ready-made functions supplied with the language. However,
    this hasn''t turned out to be the case with JavaScript, so this chapter concentrates
    on providing a selection of basic functions needed in order to develop JavaScript
    programs as efficiently as possible.

    This chapter contains more plug-ins than any other chapter (18 in all), as well
    as a collection of handy global variables that will make your life simpler, and
    will make the remaining plug-ins easier to understand and master.

    Since these core plug-ins and global variables are used throughout the book I
    recommend you take the time to digest the contents of this chapter as fully as
    possible before starting to use the remaining functions. I apologize for the amount
    of documentation on these first few plug-ins, but they are important ones, and
    it''s essential that you are fully familiar with their use.


    # O()


    The O() function is the most functional of the plug-ins provided in this book
    and is used by almost all the others. In its simplest form it replaces the long-winded
    JavaScript function getElementById which takes the string argument to it and returns
    the HTML DOM (Document Object Model) object that has been assigned that ID. The
    letter O short for the word Object since the main purpose of this function is
    to retrieve an object or modify its properties.


    # About the Plug-in


    This plug-in takes one required and two optional arguments follows:


    +   - id This can be a string containing the ID of an object, an object, or even
    an array containing several objects and/or IDs. If none of the optional arguments
    are also provided the function returns the object or objects represented by id.
    If there are optional arguments then the purpose of the function changes to assign
    the value in value to the property in property of the object (or objects) in id.

    - property This optional string argument can contain the name of a property belonging
    to the object (or objects) in id that requires modifying

    - value If this optional argument is set it represents the value to be assigned
    to the property in property of the object (or objects) in id. Both the property
    and value arguments must have values, otherwise O() will simply return the object
    (or objects) in id.


    # Variables, Arrays, and Functions


    | | |

    |---|---|

    | tmp [] | Array holding the result of processing the id array |

    | j | Integer loop variable for indexing into id |

    | UNDEF | Global string variable with the value ''undefined'' |

    | InsVars () | Plug-in to insert values into a string |'
