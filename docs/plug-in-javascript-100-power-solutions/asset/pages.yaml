  md: '# Chapter 5: Visibility 107


    # Variables, Arrays, and Functions


    | | |

    |---|---|

    | j | Local variable for indexing id if it is an array |

    | stepval | Local variable used in the calculation of the amount of opacity to
    change in each frame of animation |

    | INTERVAL | Global variable with a default value of 30—the number of milliseconds
    between each call to the interrupt |

    | FA_Flag | Property of id that is set to true if a fade is in progress, otherwise
    it is false |

    | FA_Start | Property of id assigned the value of start |

    | FA_End | Property of id assigned the value of end |

    | FA_Level | Property of id containing the opacity level |

    | FA_Step | Property of id containing the amount by which to change the opacity
    in each step |

    | FA_Int | Property of id containing the value passed in the interrupt argument
    |

    | Fadeout | Property of id used by FadeToggle() plugin-in: true if it has faded
    out, or false if it has faded in |

    | FA_IID | Property of the value returned by setInterval()—the value is used by
    clearInterval() to turn off the DoFade() attached to id |

    | DoFade() | Plugin-function called every INTERVAL until the fade is completed
    or interrupted—this function updates the opacity of id each time it is called
    |

    | Opacity() | Plugin to change the opacity of an object or array of objects |

    | Math.abs() | Function to return an absolute positive value from a number that
    may be positive or negative |

    | Math.max() | Function to return the largest of two values |

    | Math.min() | Function to return the smallest of two values |

    | setInterval() | Function to start periodic interrupt calls to another function
    |

    | clearInterval() | Function to stop the interrupts started by SetInterval() |


    # How It Works


    This is the first of the really useful plug-ins. At most 50 lines of code it isn''t
    short, but don''t put off by it; the coding is straightforward, and you''ve seen
    many of its parts before. If you can work through this plug-in, you''ll be able
    to follow them all.


    This function works using interrupts to call a function at regular intervals to
    change the opacity of an object by a small amount each time (which is how all
    the transition and animation plug-ins in this book work). To do this, the plug-in
    comes in two parts. The first part prepares all the variables and initiates the
    interrupts, and the second part receives the interrupt calls and performs the
    incremental opacity changes.'
