    # About the Plug-in


    This plug-in takes a string and can perform one or more of several actions on
    it. It requires the following arguments:


    +   * **string** The string to clean up

    * **allspaces** If true or 1, all spaces in string are removed

    * **aldigits** If true or 1, all digits in string are removed

    * **alltext** If true or 1, all text in string is removed

    * **allpunct** If true or 1, all punctuation in string is removed

    * **utopol** If true or 1, all uppercase characters in string are converted to
    lowercase

    * **lowcoup** If true or 1, all lowercase characters in string are converted to
    uppercase

    * **spacetosingle** If true or 1, groups of multiple spaces in string are reduced
    to a single space


    # Variables, Arrays, Functions


    | replace() | Function to replace one value with another in a string |


    # How It Works


    This plug-in goes through each of the arguments it is supplied in turn. If the
    argument value true or 1, the matching replace() function is performed on the
    string. For example, the following statement removes all spaces from string when
    the allspaces argument is 1 or true:


    ```

    if (allspaces) string = string.replace(/\s+/g, '''')

    ```


    All the remaining statements are very simple, differing only by the regular expressions
    used for testing.


