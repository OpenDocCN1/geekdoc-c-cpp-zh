- pgno: 60
  md: '# Chapter 3: The Core plug-ins 41


    # Variables, Arrays, and Functions


    | e | The event passed to the function by browsers other than Internet Explorer.
    e.pageX and e.pageY contain the X and Y locations of the mouse pointer. |

    | window.event | Internet Explorer uses the window.event property instead of an
    event passed as an argument. The clientX and clientY subproperties contain the
    X and Y locations of the mouse pointer. |

    | document.documentElement | If the browser is Internet Explorer then the scrollLeft
    and scrollTop properties of this property are accessed to determine the amount
    of horizontal and vertical scroll. |

    | window | On browsers other than Internet Explorer the pageOffset and pageOffsetY
    properties of window are accessed to determine the amount of horizontal and vertical
    scroll. |

    | MOUSE_X | Global integer containing the current horizontal coordinate of the
    mouse pointer |

    | MOUSE_Y | Global integer containing the vertical coordinate of the mouse pointer
    |

    | SCROLL_X | Global integer containing the amount the browser has been scrolled
    vertically, in pixels. |

    | SCROLL_Y | Global integer containing the amount the browser has been scrolled
    vertically, in pixels. |


    # How It Works


    This function detects the onousemove event and accesses either the e value passed
    to it in browsers other than Internet Explorer, or in Internet Explorer, it accesses
    the global window.event property. Using these values sets the values of the global
    variables MOUSE_X, MOUSE_Y and Y to the X and Y coordinates of the mouse pointer.

    The scrollLeft and scrollTop properties of document.documentElement are also accessed
    in Internet Explorer to determine the amount of horizontal and vertical scroll.
    These values are placed in the global variables SCROLL_X and SCROLL_Y. They are
    given their values based on the pageOffset and pageOffsetY properties of window.

    The value true is then returned to the event to be acted on by the browser.


    # How To Use It


    You will not access this function directly. Instead, calling the Initialize()
    plug-in as recommended, the values needed to determine the X and Y locations of
    the mouse pointer and any horizontal or vertical scrolling values are placed in
    the global variables MOUSE_X, MOUSE_Y, SCROLL_X, and SCROLL_Y and are kept updated.

    To illustrate how you can use these, the following code will display these values
    in real time:


    ```

    <div id=''output''></div><p>

    PaddingPaddingPaddingPaddingPaddingPaddingPaddingPaddingPadding

    ```'
