    \ variables:\n\n```\nif (MOUSE_X < x || MOUSE_X > (x + W(contents)) ||\n    MOUSE_Y\
    \ < y || MOUSE_Y > (y + H(contents))) {\n```\n\nIf the mouse pointer is not within\
    \ the bounds of contents, the object is popped down and the repeating interrupts\
    \ are stopped with a clearInterval(), passing the value in the property Context_ID\
    \ that was saved when setInterval was called. Also, the property PO_IsUp is set\
    \ to false because contents have now been popped down:\n\n```\nPopDown(contents,\
    \ type, w, h, msecs, 1)\nclearInterval(O(id).Context_ID)\nO(contents).PO_IsUp\
    \ = false\n```\n\nIf the mouse is within the bounds of contents, the function\
