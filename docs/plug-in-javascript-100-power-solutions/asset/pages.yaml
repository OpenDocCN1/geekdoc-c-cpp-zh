  md: "# Chapter 5: Visibility 119\n\nMake sure to look at the first call in the <script>\
    \ section. Notice how it sets a transition time of just 1 millisecond for the\
    \ fade. This is the recommended way to set up toggleable elements to start up\
    \ in their inverse state because it causes the transition to occur, but only a\
    \ single frame of animation.\n\nThis technique is useful if you want the house\
    \ to start faded out: the call to FadeToggle() executes the first fade out as\
    \ quickly as possible—faster than the eye can see. When you run the example, you\
    \ would hardly notice the image until you pass the mouse over the text.\n\nWith\
    \ the image faded out, remaining the two lines of code to attach the mouse events.\
    \ The house will smoothly fade in and as you pass your mouse over the text because\
    \ the interruptible argument is set to 1 and allows smooth interrupts to the transitions.\n\
    \n# The Plug-in\n\n```\nfunction FadeToggle(id, msecs, interruptible, CB)\n  if\
    \ (id instanceof Array)\n  {\n    for (var j = 0; j < id.length; ++j)\n      FadeToggle(id[j],\
    \ msecs, interruptible, CB)\n    return\n  }\n```\n\n```\nif (id.Fadeout) FadeIn(id,\
    \ msecs, interruptible, CB)\nelse\n  FadeOut(id, msecs, interruptible, CB)\n```\n\
    \n# 39 FadeBetween()\n\nThis plug-in fades smoothly between two images in a similar\
