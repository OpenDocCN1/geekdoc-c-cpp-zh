  md: '# 224 Plug-In JavaScript: 100 Solutions


    Next, the PO_IsUp property is tested to see whether it has a value. If its type
    is UNDEF (or ''undefined'') then it doesn''t, and the object has to be popped
    down (since it hasn''t been popped down yet), PO_IsUp is set to true, like this:


    ```

    if (typeof O(id).PO_IsUp == UNDEF)

    O(id).PO_IsUp = true

    ```


    Then a check is made on PO_IsUp that it must have a value of true or false. If
    it is true, the PopDown() plug-in is called; otherwise, the object is already
    popped down so the Popup() plug-in is called, as follows:


    ```

    if (O(id).PO_IsUp) PopDown(id, type, w, h, msecs, interruptible)

    else Popup(id, type, w, h, msecs, interruptible)

    ```


    # How To Use It


    To use this plug-in, pass an object and the type of pop-up and down to effect
    use, out of ''fade'', ''inflate'', ''zoom'', or ''instant''. Then decide the width,
    height, or dimensions resizable (if applicable), how the transition should take,
    and whether it can be interrupted, like


    ```

    PopToggle(''object'', ''inflate'', 0, 1, 500, 0)

    ```


    Here''s an example that rewrites the code used in the previous pop-example to
    significantly shorten it:


    ```

    <center>

    <span id=''11''>Image 1</span>

    <span id=''12''>Image 2</span>

    <span id=''13''>Image 3</span>

    <span id=''14''>Image 4</span>

    </center>

    ```


