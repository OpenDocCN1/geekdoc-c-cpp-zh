    I usually use single quotes for strings, however unless a string includes a single
    quotes in which case I use double quotation marks to enclose the string.


    # Additional Arguments


    As well as accepting strings and objects, the O() plug-in allows you to pass an
    optional pair of arguments that are then used to modify object properties. For,
    the previous examples can be rewritten like this:


    ```

    O(''outerdiv'', ''innerHTML'', ''<h1>Heading</h1>'')

    O(myvariable, ''innerHTML'', ''<h2>Subheading</h2>'')

    ```


    Both of the preceding are acceptable alternative syntax for assigning a value
    to an object''s property.


    # Passing Arrays


    You may be wondering about the point of this alternative syntax. Well, it comes
    into its own when you want to access many different objects at once. This is something
    that you cannot do with standard JavaScript, but you can achieve it with the O()
    plug-in, which allows you to pass an array of objects, object ID names, or a combination
    of both.


    For example, let''s say you want to clear the HTML contents of three objects that
    have the names ''Fred'', ''Mary'', and ''Bill''. Regular JavaScript would require
    three separate commas, but you can easily achieve the same result with the following
    code:


    ```

    ids = Array(''Fred'', ''Mary'', ''Bill'')

    O(ids, ''innerHTML'', '''')

    ```


    You can mix objects and object ID names within an array, as follows:


    ```

    ids = Array(''Fred'', ''Mary'', ''Bill'', myobject)

    ```


    Or, you can combine everything into one line of code in the following way, which
    will clear out the innerHTML contents of all the objects:


    ```

    O(Array(''Fred'', ''Mary'', ''Bill'', myobject), ''innerHTML'', '''')

    ```'
