  md: '# 212 Plug-In JavaScript: 100 Solutions


    As websites try to offer a better look and feel than their competitors, new ways
    of navigating through large numbers of pages are being devised all the time. Menus
    and navigation are probably the areas that make the most use of JavaScript for
    this purpose.


    In the early days of JavaScript, the interaction was mainly limited to instant
    changes of location and color as the mouse passed over a menu, but nowadays savvy
    web users expect more fluid and appealing designs with fades, transitions, and
    more.


    The plug-ins in this chapter give you a variety of solutions that you can use
    as-is, or you can build them into even more sophisticated systems. They range
    from sliding menus to pop-up and down menus, folding and context menus, and even
    a dock bar to the one used in Mac OS X.


    # 60 HoverSliderMenu()


    This plug-in expands on the final one in Chapter 7, HoverSlider(), to build a
    complete menu system, rather than just a single mobile. With it you can select
    a group of objects that will be attached to one of the edges of the browser and
    will slide into view when the mouse passes over the part showing. In Figure 8-1,
    two almost identical sets of objects containing links have been attached to the
    top and bottom of the browser.


    # About the Plug-in


    This plug-in takes an array of objects and lines them all along one of the browser
    edges where they become a collection of slide menus. The following arguments are
    required:


    +   - ids Array of objects and/or object IDs

    - where The edge should be attached to, either ‘top’, ‘left’, ‘right’, or ‘bottom’

    - offset How far along to locate the objects—if offset begins with a % symbol,
    the position will be that percent from the start, otherwise it will be offset
    pixels from the start

    - showing The number of pixels to leave of each object the mouse will pass over
    to cause the menu to slide


    ![](img/95e4c43b430487125c342550cc090977_229_0.png)'
