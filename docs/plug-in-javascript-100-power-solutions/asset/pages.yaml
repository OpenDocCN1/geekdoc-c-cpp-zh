    \  Fade(id[j], start, end, msecs, interruptible, CB)\n  return\n}\n```\n\nAfter\
    \ that, the local variable stepval is created, like:\n\n```\nvar stepval = Math.abs(start\
    \ - end) / (msecs / INTERVAL)\n```\n\nIts value is calculated by finding the difference\
    \ between the start and end opacity values; that is, it subtracts one from the\
    \ other and then passes the result through the Math.abs() function. which gives\
    \ a positive integer representing the difference, like this:\n\n```\nMath.abs(start\
    \ - end)\n```\n\nThe length of time that the fade should take, which has been\
    \ passed as a value in milliseconds in the variable msecs, is divided by INTERVAL,\
    \ which is the number of milliseconds between each frame of the transition (3\
    \ by default). The code for that is simple division:\n\n```\nmsecs / INTERVAL\n\
    ```\n\nThe first value (the start and end difference) is then divided by the second\
    \ (the timing) and then assigned to the variable stepval.\n\n# A Specific Case\n\
    \nLet's see what value calculation comes out by assuming that start has a value\
    \ of 0, end has a value of 100, and msecs has a value of 1000. This gives us the\
    \ formula:\n\n```\nMath.abs(0 - 100) / (1000 / 30)\n```\n\nThe calculation comes\
    \ to 100 / (1000 / 30), and the answer is the value 3 . In terms of this code,\
    \ this means that, if the following three things are true:\n\n+   1. The interrupt\
    \ is going to take place every 30 milliseconds,\n2. You want the animation to\
    \ make 1000 milliseconds,\n3. There are 100 levels of opacity.\n\nThe distance\
    \ between each level of opacity should be 3. In other words, to smoothly fade\
    \ from a value of 0 to 100 over the course of 1 second, there will be 33.33 steps,\
    \ separated by 3 levels of opacity."
  merge: -1
  img_proc: true
- pgno: 126
  md: "# Chapter 5: Visibility 109\n\n# A Standard Formula\n\nThe preceding formula\
    \ is how almost all the animations and transitions in this book work. They take\
    \ the value in milliseconds that you supply for their duration, then they divide\
    \ that by the interval (usually 30 milliseconds), and finally they find the distance\
    \ between the start and end points of the animation by the timing value, to find\
    \ out the amount animation needs to move on each step, as shown in the following\
    \ statement:\n\n```\nvar stepval = Math.abs(start - end) / (msecs / INTERVAL)\n\
    ```\n\n# If a Fade Is Already in Progress\n\nThis plug-in is designed so that\
    \ you can force it to proceed until it has finished, or allow it to be interrupted\
    \ (but only by Fade() call on the same object). This is so that you can offermouseover\
    \ and mouseout routines that will interrupt if you move your mouse before the\
    \ transition completes. That way, a partially faded object can be faded back to\
    \ start point again if you take the mouse away.\n\nAlternatively, you may need\
    \ to display an uninterrupted animation on the screen and maybe even one fade.\
    \ You have the option to choose either by setting the interruptible argument to\
    \ true if a fade can be interrupted, or if it cannot. You can also use 1 and 0\
    \ for these values if you prefer.\n\nThe next section of code checks whether a\
    \ fade is already in progress by looking at the FA_Flag property of id. This is\
    \ a new property given to id, which has the value true only when fade is in progress.\n\
    \n> Note Assigning new properties to objects is a technique used throughout this\
    \ book. It's a convenient way of using some object-oriented aspects of JavaScript.\n\
    \nThe next section of code checks whether a fade is already in progress. If it\
    \ is, the code checks whether the FA_Int property of id is set (to see whether\
    \ an interrupt is allowed). If it isn't, the function immediately exits as it\
    \ cannot interrupted. Otherwise, the clearInterval() function is called to end\
    \ the repeating transitions, and the object's new FA_Start property is set to\
    \ the current value in FA_Fade.\n\nThis primes the new fade to start where the\
    \ previous one (which was just cancelled) left off, which means that the new fade\
    \ will ignore the start value that was passed. This override ensures a very smooth\
    \ and natural flow between the two transitions. The following code performs this:\n\
    \n```\nif (O(id).FA_Flag)\n{\n  if (O(id).FA_Int) return\n\n  clearInterval(O(id).FA_IID)\n\
    \  O(id).FA_Start = O(id).FA_Level\n}\n```\n\n# If a Fade Is Not in Progress\n\
    \nIf a fade isn't already in progress, the new id property FA_Start is assigned\
    \ the value in start so that the remaining code can use this to know where the\
    \ fade started from."
  merge: -1
  img_proc: true
- pgno: 127
  md: "# Plug-In JavaScript: 100 Power Solutions\n\nThe id FA_Level is also set to\
    \ start because that is the property that will be manipulated to track the opacity\
    \ level on each interrupt. These statements are placed within an else segment,\
    \ like this:\n\n```\nelse\n{\n  O(id).FA_Start = start\n  O(id).FA_Level = start\n\
    }\n```\n\n# The Remaining Assignments\nIn the final lines of the setup portion\
    \ of this plug-in, a few other properties of id have to be assigned, as follows:\n\
    \n```\nO(id).FA_Flag = true\nO(id).FA_End = end\nO(id).FA_Int = interruptible\n\
    ```\n\nThe first line sets the object's FA_Flag to true, and this is used in other\
    \ parts of the code to decide whether or the plug-in can be entered (reentered).\
    \ The second line makes a copy of the end value in the new property FA_End, and\
    \ the last assigns the value in interruptible to the property FA_Int.\n\nNext,\
    \ the amount by which change the opacity has to stored in FA_Step. This is either\
    \ step if the opacity is to increase, or -step if it will be decreasing, as determined\
    \ by this line:\n\n```\nO(id).FA_Step = end > O(id).FA_Start ? stepval : -stepval\n\
    ```\n\n# O(id).Fadeout = end < O(id).FA_Start ? true : false\n\n# Initiating the\
    \ Interrupts\nThe last line of the setup section of the plug-in sets up the interrupts\
    \ in the following way:\n\n```\nO(id).FA_IID = setInterval(DoFade, INTERVAL)\n\
    ```\n\nThis starts off a repeating interrupt that will call the DoFade() function\
    \ every INTERVAL milliseconds. The value returned by calling setInterval() is\
    \ saved in the new property FA_IID, as is needed later when time comes to cancel\
    \ the interrupts."
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Chapter 5: Visibility


    # TheDoFade() Subfunction


    This function is a subfunction of Fade () and is known as a private method or
    private function. Such functions share all the local variables of the parent function,
    so there''s no need to pass them as arguments, and they can only be used by the
    parent function, they don''t clutter the namespace.


    This makes it ideal to use as interrupt or driven functions, which is exactly
    what I have done in this plug-in. Every INTERVAL milliseconds (30 by default),
    DoFade() is called by JavaScript. It has one main job, which is to change the
    opacity of id by just a little. The following line is the one that changes the
    value for this:


    ```

    O(id).FA_Level += O(id).FA_Step

    ```


    This simply adds the value of the FA_Step property of id to its FA_Level property.
    If FA_Step is positive, the value is therefore added, but if it is negative it
    is subtracted (for example 100 - 3 is 97, because the first + ignored)


    # The Final Opacity Has Been Reached


    Having derived this new value, it''s time to check whether it is the final value
    wanted, and so the animation completes. The code to do is slightly verbose:


    ```

    O(id).FA_Level >= Math.max(O(id).FA_Start, O(id).FA_End) ||

    O(id).FA_Level <= Math.min(O(id).FA_Start, O(id).FA_End)

    ```


    Essentially, it checks whether the current opacity (in FA_Level) has reached the
    final value (in FA_End). If it is as or greater (or less than, in the case of
    decreasing) the final value, then the following code segment is executed:


    ```

    O(id).FA_Level = O(id).FA_End

    O(id).FA_Flag = false

    clearInterval(O(id).FAID)

    ```


    In this section, the FA_Level is set to the exact value in FA_End. This must be
    done because FA_Level will often have a fractional value, and one final frame
    of animation is always required to ensure the correct opacity level is reached.


    After this FA Flag property of id is set to false to indicate that the fade has
    finished. This is immediately followed by a call to clearInterval() with the value
    that was saved in the FA_ID property. This prevents any further interrupts.


    # The CB Argument


    The final statement in this if () section is as follows:


    ```

    if (typeof CB != UNDEF) eval (CB)

    ```


    It catches the argument passed in CB (if any) and uses the eval () function to
    evaluate it. This type of procedure is called a callback and is used by the chaining
    plug-ins. In a nutshell, now that this plug-in has completed running, this allows
    any plug-ins to chain to begin their execution. However, this happens only if
    the argument CB has a value.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Plug-In JavaScript: 100 Power Solutions


    This argument is generally passed when you wish to have a second function run
    when the plug-in has finished executing; you simply pass the function to call
    in a string as the final parameter to plug-ins that support callbacks natively.


    > Chapter 7 covers callbacks and chaining in much more detail, but I have placed
    this brief description here due to being the first plug-in that supports callbacks.


    # Changing the Opacity


    The last thing this subsection does is call the Opacity() plug-in to set the current
    opacity with this line of code:


    ```

    Opacity(id, O(id).FA_Level)

    ```


    If clearInterval() has been called, then that''s the end of it; otherwise, INTERVAL
    milliseconds later DoFade() will get called again, and a slightly different value
    for FA_Level will be computed and passed to the Opacity() plug-in, until the transition
    has finished.


    > We spent a lot going over this particular plug-in because of the other animation
    and transition plug-ins work in a similar fashion. Once you understand this one,
    you will easily see how the others work.


    # How To Use It


    To make an object fade, you would use a command as this:


    ```

    Fade(''object'', 100, 0, 1000, 0)

    ```


    This will fade the object starting out with full opacity down to totally transparent,
    over the course of one second. The final argument of 0 prevents the fade from
    interrupted.


    You can also embed calls to the plug-in within HTML, like this:


    ```

    <a href="http://abc.com" onmouseover="Fade(''object'', 75, 100, 500, 1)" onmouseout="Fade(''object'',
    100, 75, 500, 1)">Link</a>

    ```


    If the link was previously given an opacity of 75, each time the mouse passes
    over the link will gradually increase opacity over half second, darkening it.
    When the mouse leaves it will fade back to a 75% opacity level.


    Here''s an example code you can try for yourself (or download from the companion
    to have the images):


    ```

    <center><br />

    <img id=''id1'' src=''i1.gif'' />

    <img id=''id2'' src=''i2.gif'' />

    ```


    ```

    <script>

    window.onload = function()

    ```'
