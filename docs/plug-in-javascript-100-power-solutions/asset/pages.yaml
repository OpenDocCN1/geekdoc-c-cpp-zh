  md: "# Chapter 4: Location and Dimensions 91\n\n# Variables, Arrays, and Functions\n\
    \n| J | |\n| --- | --- |\n| left | Local integer variable for indexing id if it\
    \ is an array |\n| | The style.left property of object |\n| SCROLL_X | Global\
    \ variable containing the number of pixels by which the browser is scrolled horizontally\
    \ |\n| GetWindowWidth() | The available width of the browser window, taking into\
    \ account any scroll bars |\n| W() | Plug-in to fetch an object's width |\n| Px()\
    \ | Plug-in to add the suffix 'px' |\n\n# How It Works\n\nThis plug-in allows\
    \ arrays of objects and/or object IDs, as well as single objects or object IDs.\
    \ It does this by using the instanceof operator to tell whether id is an array,\
    \ and if it is, it iterates the array using the local variable as an index, recursively\
    \ calling itself with the single element values. Upon completion, the if() section\
    \ of code returns.\n\nIn the second part of the plug-in, the Px() sets the object's\
    \ style.left property to the correct value (using a 'px' suffix) to center the\
    \ object horizontally. The correct value is determined by looking up the width\
    \ of the window (17 if there's a scroll bar), minus the width of id. If the window\
    \ is 600 pixels and the width is 100 (and there is no scroll bar), the value is\
    \ determined by subtracting 100 from 600, which equals 500; then the value is\
    \ divided by 2 to get a final result of 250. Therefore, an offset of 250 pixels\
    \ from the left will exactly center an object of 100 pixels in a 600-pixel wider\
    \ browser. If there is a scroll bar, the values become 583 - 100 / 2, which equals\
    \ 241.5. The Math.round() call deals with a fractional result, in which this is\
    \ rounded up to 342.\n\nIf the browser has no scroll, this is all the calculation\
    \ that needed. However, because the horizontal offset is from the left edge of\
    \ the document (not the window), if there has been a horizontal scroll the object\
    \ will be displayed left of center by the amount of the scrolling. Therefore,\
    \ the global variable SCROLL_X is added to the calculated value in order to place\
    \ the object exactly between the left and right hands of the window.\n\n# How\
    \ To Use It\n\nTo center an object, as long as it is capable of moving, just call\
    \ CenterX() in the following manner, which creates a simple div and centers it:\n\
    \n```\n<div id='test'>&nbsp;Test div</div>\n```\n\n```\n<script>\nwindow.onload\
    \ = function() {\n  Locate('test', ABS, 20, 20);\n  Resize('test', 100, 100);\n\
