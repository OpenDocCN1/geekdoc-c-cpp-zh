- pgno: 160
  md: "# Chapter 6: Movement and Animation 143\n\n| INTERVAL | Global variable with\
    \ the value 30 |\n|---|-|\n| HID | Global variable with the value 'hidden' |\n\
    | setInterval() | Function to set up repeating interrupts |\n| clearInterval()\
    \ | Function to stop repeating interrupts |\n| DoDeflate() | Subfunction to perform\
    \ the animation |\n| W() | Plug-in to fetch an object's width |\n| H() | Plug-in\
    \ to fetch an object's height |\n| Resize() | Plug-in to resize an object |\n\n\
    # How It Works\n\nThis plug-in has a few different parts. The first part tests\
    \ whether id is an array; if it is, calls itself recursively with each element\
    \ of id using the following code:\n\n```\nif (id instanceof Array)\n  for (var\
    \ j = 0; j < id.length; ++j)\n    Deflate(id[j], w, h, msecs, interruptible, CB)\n\
    \  return\n```\n\nThis allows many objects to be deflated at once, as long as\
    \ they are passed to Deflate() in an array.\n\nNext, the code has to take into\
    \ account the fact that when only one dimension of an image is changed, most browsers\
    \ will automatically modify the other one to keep the image at the same ratio.\
    \ However, in this case feature is not wanted, so if either the horizontal or\
    \ vertical width is not be changed (as decided by the values in the w and h arguments)\
    \ that dimension is given a fixed value representing its current length to replace\
    \ its default value of 'auto'. This allows one dimension to be altered and the\
    \ other will not change:\n\n```\nif (!w) ResizeWidth(id, W(id))\nif (!h) ResizeHeight(id,\
    \ H(id))\n```\n\nNext, if a deflation is in progress on id (as determined by its\
    \ DF_Flag having a value of true or 1), its DF_Int property is checked. This contains\
    \ true or 1 if the animation may be interrupted; if it is not true or 1, the function\
    \ returns. Otherwise, if any deflate interval is currently running, it is stopped\
    \ with a call to clearInterval(). The code for these two actions is as follows:\n\
    \n```\nif (O(id).DF_Flag)\n  if (!O(id).DF_Int) return\n  else clearInterval(O(id).DF_IID)\n\
    ```"
