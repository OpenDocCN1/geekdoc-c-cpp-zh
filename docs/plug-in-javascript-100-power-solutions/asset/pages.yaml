  md: '# 50 Plug-In JavaScript: 100 Solutions


    FIGURE 3-8

    The image and the second sentence cannot be dragged or selected.


    ![](img/95e4c43b430487125c342550cc090977_69_0.png)


    section of text that is being selected, while the second sentence is not selectable.
    The GIF image is also undraggable.


    # About the Plug-in


    This plug-in takes three arguments, and depending on their values, it prevents
    events to occur. The arguments are as follows:


    +   * id The of an object, such as a div or span of HTML, or any other object

    * type This argument can have one of three string values: ''drag'', ''select'',
    or ''both''. If the value is ''drag'', then the object referred to by id will
    either be prevented from being dragged or allowed to be dragged, depending on
    the value of onoff. If it is ''select'', then the selection of text will be prevented
    or allowed, depending on the value of onoff. If it is ''both'', then these events
    will be prevented or allowed.

    * onoff This argument should be true or false; alternatively, the values 1 or
    0 are acceptable. The values true or 1 mean the event (events) in the variable
    type are prevented. If onoff is false or 0 then the event (events) are allowed.


    # Variables, Arrays, and Functions


    | | |

    |---|---|

    | ondragstart | Event of the object passed in id |

    | onselectstart | Event of the object passed in id |

    | onmousedown | Event of the object passed in id |

    | MozUserSelect | Property of the object passed in id (only used by Mozilla-based
    browsers such as Firefox) |


    # How It Works


    The plug-in is divided into two main sections. In the first, the drag event of
    the object referenced by id is managed, while the second half is for handling
    the id select event. Each of these halves is again split into two parts. In the
    first half of each, the events are prevented, while the second half is for re-enabling
    an event after it has been disabled.'
  merge: -1
  img_proc: true
- pgno: 70
  md: "# Chapter 3: The Core Plug-ins 51\n\nTo provide these features, by the browser\
    \ supports it, either the ondrag or onselect event of the object in id (or events\
    \ if the value is 'both') is assigned an inline, anonymous function that returns\
    \ the value false, which has the effect of cancelling any further action.\n\n\
    If the event is not recognized, the mousedown event for the object in id is caught\
    \ and return false. This is not a great solution because it prevents other mousedown\
    \ events from being attached, but it does have the effect of preventing the event\
    \ from occurring.\n\nIn case of Mozilla-based browsers as Firefox, the special\
    \ property MozUserSelect is to set either 'none' to prevent text from being selected,\
    \ or 'text' to re-enable it. It is necessary because these browsers will not use\
    \ the onselectstart event, and using this property is less intrusive than capturing\
    \ the mousedown event.\n\n# How To Use It\n\nTo prevent copying and pasting the\
    \ contents of a div, for example, you can attach this function to its onselectstart\
    \ event, like this:\n\n```\nPreventAction('mydiv', 'select', true)\n```\n\nIf\
    \ a user tries to select any text, this plug-in stops the event before it can\
    \ get going. This is not merely an easy way to prevent copying text from your\
    \ web pages, but it also prevents text from being inadvertently highlighted when\
    \ you are using the mouse to drag items about.\n\nYou can also use it to prevent\
    \ any element from being dragged in the browser or dragged and dropped elsewhere,\
    \ like this:\n\n```\nPreventAction('mygif', 'drag', true)\n```\n\nHere's some\
    \ code that illustrates both of these:\n\n```\n<img id='gif' src='il.gif' />\n\
    The image cannot be dragged.\n<span id='text'>And this text is unselectable</span>\n\
    ```\n\n```\n<script>\nwindow.onload = function() {\n  PreventAction('gif', 'drag',\
    \ true);\n  PreventAction('text', 'select', true);\n}\n</script>\n```\n\nIn the\
    \ HTML section of the example, a GIF with the name il.gif is displayed and the\
    \ ID of 'gif'. It is followed by some regular text and the ID of 'text'.\n\nBelow\
    \ that, in the <script> section, the GIF image has its drag property disabled,\
    \ and the span text is unselectable. If you try either of these actions they will\
    \ fail. However, Internet Explorer will allow you to continue the selection within\
    \ the span if you commence a selection from outside the span. You can work around\
    \ this bug by setting the document as unselectable, like this:\n\n```\nPreventAction(document.body,\
    \ 'select', true)\n```"
  merge: -1
  img_proc: true
