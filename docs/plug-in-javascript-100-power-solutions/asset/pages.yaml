    ```


    However, you will normally wish to use this and the other plug-ins only once a
    page has fully loaded and all its elements locations and dimensions are known
    and can be manipulated. Therefore, the command (and the rest of your code) is
    best placed within a window.onload anonymous function, like:


    ```

