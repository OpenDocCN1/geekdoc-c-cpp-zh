- pgno: 162
  md: "# Chapter 6: Movement and Animation 145\n\n### TheDoDeflate() Subfunction\n\
    Once initialized by the main part of the plug-in, the DoDeflate() subsection is\
    \ called\nevery INTERVAL milliseconds, and each time it shrinks the object a little\
    \ more, like this:\n\n```\nif (w) ResizeWidth(id, stepw * O(id).DF_Count)\nif\
    \ (h) ResizeHeight(id, steph * O(id).DF_Count\n```\n\nThese two lines calculate\
    \ the new width and/ height of id and whether either resize or\nboth.\nNext, a\
    \ check is made to see if this was the final resize and whether the animation\
    \ can\nstop. This is done by checking the value of DF_Count, which is decremented\
    \ after each\nframe of animation.\n\nWhen the Animation Is Finished\nIf the DF_Count\
    \ property is less than 1, the animation has completed and the DF_Flag\nproperty\
    \ of id is set to false to indicate that there is no deolate operation running\n\
    id.\nFinally, width and/ height of the dimension(s) being resized set to zero\
    \ to complete\nthe transition.\nIn the final lines of the plug-in, the clearInterval()\
    \ function is called to prevent\nany further interrupts. This callback function\
    \ contained in CB is evaluated with the eval()\nfunction, but only if the argument\
    \ CB (explained in Chapter 7) has a value. The code for\nthese actions is:\n\n\
    ```\nif (O(id).DF_Count-- < 1)\n{\n  O(id).DF_Flag = false\n  if (w) ResizeWidth(id,\
    \ 0)\n  if (h) ResizeHeight(id, 0)\n  clearInterval(O(id).DF_ID)\n  if (typeof\
    \ CB != UNDEF) eval(CB)\n}\n```\n\n> The double-hyphen--) operator following DF_Count\
    \ is a handy way of telling JavaScript\ndecrement the variable, but only after\
    \ its current value has been used in the if () statement,\nsaving an extra line\
    \ of code.\n\nHow To Use It\nUsing deflate() is a great way to make an object\
    \ disappear smoothly and is much more\nthan just fading it out or hiding it. Here's\
    \ some code illustrating the three\ntypes of effects supported by this plug-in:\n\
    \n```\n<span id='d'>MouseMe</span>\n\n<img id='p1' src='photo1.jpg' />\n<img id='p2'\
    \ src='photo2.jpg' />\n<img id='p3' src='photo3.jpg' />\n```"
