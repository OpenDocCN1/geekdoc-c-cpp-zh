- pgno: 399
  md: '# 382 Plug-In JavaScript: 100 Power Solutions


    This causes oldmousex and oldmousey to retain the location of the mouse at the
    point when the mouse button was clicked, and this location is compared to the
    current mouse location to determine the amount by which the document body should
    be scrolled.


    However, the variables tempousex and tempousey are used only to see whether the
    mouse has moved since the last interrupt to the DOTE() sub-function and to decide
    whether a scroll is required. The scrolling is relative to the values stored in
    oldmousex and oldmousey, not those in tempousex and tempousey.


    # The StopTE() Subfunction

    This function simply sets the flag variable to false to indicate that a scroll
    is not currently in operation and clears the repeating intervals. The document
    will not scroll until the mouse button is held down once—the same action as a
    touch screen.


    # How To Use It


    To use this plug-in, call it up with a value of 1 or true, like this:


    TouchEnable(1)


    To turn it off, call it with a value of 0 or false, like this:


    TouchEnable(0)


    The following example shows how you can enable and turn off controls for this
    feature in a web page, in a similar way to the one shown in Figure 13-8:


    ```

    <div id=''enabled''><font size=''1'' face=''Verdana''>

    This webpage has been <TouchEnable(1)>;&nbsp;

    <a href="javascript:TouchEnable(1)"

    target&#38;

    title="ontouchscreen control">Activate/</a>&#38;

    <a href="javascript:TouchEnable(0)"

    title="Turn off touchscreen control">Deactivate/</a>&#38;

    <a href="javascript:FadeOut(''enabled'', 1, 1000)"

    title="Remove this panel">\x201d;Remove this panel/</a></font>

    <br /><font size=''1'' face=''Verdana''>

    ```


    When activated you can touch anything to scroll this page using a touchscreen/</div>


    ```

    <script>

    Locate(''enabled'', ''fixed'', 0, -100)

    S(''enabled'').backgroundColor = ''#eeeeaa''

    S(''enabled'').padding = ''2px 5px 2px 5px''

    S(''enabled'').border = ''dotted black 1px''

    Opacity(''enabled'', 0)

    GoToEdge(''enabled'', ''top'', 50)

    FadeIn(''enabled'', 1000)

    </script>

    ```


    Just add this code to any existing web page that is long enough to require scrolling.'
