  md: "# Plug-In JavaScript: 100 Solutions\n\n# How It Works\n\nThis is a simple function\
    \ that runs on the fact that all arguments sent to a function can be accessed\
    \ via the arguments array. What it does is piece all the arguments it sent back\
    \ to reconstruct an e-mail address using a for() loop, like this:\n\n```\nvar\
    \ a = '';\nfor (var j=0; j < arguments.length; ++j)\n  a += arguments[j]\n```\n\
    \nThe variable is then used to create a hyperlink to the e-mail address, with\
    \ the code itself using segmented strings to further obfuscate matters. The result\
    \ is then returned, like this:\n\n```\nreturn \"<a href \" + \"ef\" + \"=mai\"\
