  md: '# GetLastKey()


    This-plugin returns the value of whatever the last keypress was and resets the
    stored value to the empty string to indicate that the key value has been retrieved.
    Figure 3-7 shows how a simple input function created using this-plugin.


    # About the Plug-in


    This-plugin doesn''t take any arguments and returns the value of the most recently
    pressed key (if any).


    # Variables, Arrays, and Functions


    | k | Local string variable that holds the value of KEY_PRESS before resetting
    and it k |


    # How It Works


    This-plugin assigns the value in KEY_PRESS, the global variable that contains
    the last key pressed, to the local variable k. Then it resets KEY_PRESS to the
    empty string to show that the value has been read. Finally, the contents of k
    is returned. If there was no keypress, the empty string is returned.


    # How To Use It


    To use this-plugin, call with no arguments and will return either a letter, number,
    punctuation symbol, or a special key. If the key was none of these, its code is
    returned.


    You can use this to create a simple input function, like this:


    What is your name? <b><span id=''name''></span>/</b></b>


    > Figure 3-7

    This-plugin can build an input function.


    ![](img/95e4c43b430487125c342550cc090977_67_0.png)'
