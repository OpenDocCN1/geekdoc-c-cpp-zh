- pgno: 197
  md: "# 180 Plug-In JavaScript: 100 Solutions\n\nfirst one out when using the JavaScript\
    \ push() and pop() functions, they would all come out in the reverse order if\
    \ the elements were pushed onto the array they were encountered. Therefore, the\
    \ calls array is traversed from end to start, pushing each element into CHAIN_CALLS,\
    \ like this:\n\n```\nfunction Chain(calls) {\n  for (var j = calls.length; j >=\
    \ 0; --j)\n    if (calls[j])\n      CHAIN_CALLS.push(calls[j]);\n\n  NextChain()\n\
    }\n```\n\nThe first line is the one that iterates backward through the calls array.\
    \ The second checks that there is something stored in that element, and if there\
    \ is, the third pushes it onto the CHAIN_CALLS global array.\nFinally, the NextChain()\
    \ plug-(discussed next) is called to start executing the chain.\n\n> Note The\
    \ push() and pop() JavaScript functions create what is known as a LIFO stack,\
    \ which stands for Last In First Out. With such a system the most recently pushed\
    \ element is popped off and the first element pushed onto the stack is the last\
    \ one popped off. But in the case of the Chain() plug-in FIFO (First In Out) stack\
    \ is required, which is achieved by pushing the contents of the calls array onto\
    \ the stack in reverse order, so that the sequence in the stack is executed is\
    \ the same as in the array originally passed to the Chain() plug-in.\n\nNextChain()\
    \ Plug-in\nNextChain() plug-in simply examines the global CHAIN_CALLS array, and\
    \ if it has any chained calls left to run, pops the next one off and passes it\
    \ to the Callback() plug-in to execute it, like this:\n\n```\nif (CHAIN_CALLS.length)\n\
    \  Callback(CHAIN_CALLS.pop())\n```\n\nCallback() Plug-in\nThis plug-in allows\
    \ you to attach a plug-in to be called after the current one finishes execution,\
    \ like this:\n\n```\nvar insert = expr.lastIndexOf('\\'')\nvar left = expr.substr(0,\
    \ insert)\nvar right = expr.substr(insert)\nvar middle = \\'NextChain()'\n```\n\
    \n```\nif (expr.substr(insert, 1, 1) != '\\'')\n  middle = \\', ' ' + middle\n\
    ```\n\n```\neval(left + middle + right)\n```"
