  md: "# Chapter 12: Forms and Validation 345\n\n# How It Works\n\nThis plug-in starts\
    \ by calling itself recursively if id is an array, passing each element to be\
    \ processed individually, like this:\n\n```\nif (id instanceof Array)\n{\n   \
    \ for (var j = 0 ; j < id.length ; ++j)\n    ResizeTextarea(id[j], min, max)\n\
    \    return\n}\n```\n\nNext, if min or max have not been passed values, they are\
    \ assigned defaults of 0 and 100 lines, respectively:\n\nFinally, in the setup\
    \ section, the onmouseup and onerror events of id are assigned to the DoResizearea\
    \ () function:\n\n```\nO(id).onmouseup = DoResizearea\nO(id).onkeyup = DoResizearea\n\
    ```\n\n# TheDoResizearea() Function Subsection\n\nThis function contains just\
    \ two while() loops. The first continuously increases the number of rows that\
    \ id until either the text in the textarea is fully visible, or the maximum number\
    \ of rows in the argument max is reached:\n\n```\nwhile (O(id).scrollHeight >\
    \ O(id).clientHeight && O(id).rows < max\n++O(id).rows\n```\n\nThe second while()\
    \ loop performs the inverse, reducing the height of the textarea so that it is\
    \ only as large as the text contains or until it reaches the minimum height specified\
    \ in the argument min:\n\n```\nwhile (O(id).scrollHeight < O(id).clientHeight\
    \ && O(id).rows > min\n--O(id).rows\n```\n\n> Note While expanding and reducing\
    \ the textarea seems to work fine on most browsers, once the clientHeight property\
    \ in Firefox has been increased it does not seem to reduce it back down again\
    \ if text is deleted, so the textarea will shrink. If you can think of a way to\
