  md: "# 144 Plug-In JavaScript: 100 Power Solutions\n\nOtherwise, if this is the\
    \ first time the id object has been used by the Deflate() plug-in, there are some\
    \ properties that need assigning, as follows:\n\n```\nelse\n{\n  if (w) O(id).DF_OldW\
    \ = W(id)\n  if (h) O(id).DF_OldH = H(id)\n  O(id).DF_Count = msecs / INTERVAL\n\
    }\n```\n\nIn this section, the property DF_OldW and DF_OldH are assigned the current\
    \ width and height of the object so that they can be later—but only dimensions\
    \ that are be resized without this value saved.\n\nAlso, the DF_Count property\
    \ is assigned the msecs / INTERVAL, which is the number of steps in the animation.\
    \ This variable will count one step at a time (in the Deflate() function) and\
    \ each step its value will be multiplied by the values in stepw and/or step to\
    \ calculate the correct width/and height of id for each step of the animation.\n\
    \nNext, some properties have been assigned a certain value (whether or not this\
    \ is the first time id has used with this plug-in) by the following statements:\n\
    \n```\nvar stepw = O(id).DF_OldW = (msecs / INTERVAL)\nvar steph = O(id).DF_OldH\
    \ = (msecs / INTERVAL)\n```\n\n```\nS(id).overflow = true\nO(id).Deflated = true\n\
    O(id).DF_Flag = true\nO(id).DF_Int = interruptible\nO(id).DF_IID = setInterval(DoDeflate,\
    \ INTERVAL)\n```\n\nFirst, the horizontal and vertical distances for each step\
    \ of the animation are assigned to stepw and steph. This determines the amount\
    \ of horizontal and vertical shrinkage in each step to ensure the animation allows\
    \ msecs milliseconds.\n\nThe next statement ensures that the contents of the id\
    \ overflow property will not overflow the boundaries during resizing by setting\
    \ the style.overflow property to HID (which stands 'hidden'). This is not an issue\
    \ when resizing, but it is certain when the object is a div or contains multiple\
    \ items such as images and text.\n\nThe Deflated property is then set to indicate\
    \ the object's current deflated/inflated state to this and other plug-ins, such\
    \ as DeflateToggle(). The DF_Flag is also set to tell this and all other plug-ins\
    \ that a Deflate() is now in progress on id.\n\nNext, DF_Int gets the value in\
    \ interruptible so that if the plug-in is called again while the animation is\
    \ still running, this value can be set the plug, and if true or 1, the plug-in\
    \ will not be interrupted.\n\nThe final statement in this part of the code uses\
    \ setInterval to set up an interrupt call to doDeflate() every INTERVAL milliseconds.\
    \ The result of making this call is a value that can later be passed to clearInterval()\
    \ to clear the interrupts. It is saved in the DF_IID property of id."
