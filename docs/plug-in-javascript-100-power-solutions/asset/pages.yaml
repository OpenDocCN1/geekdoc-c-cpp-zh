  md: "# Plug-In JavaScript: 100 Power Solutions\n\n# About the Plug-in\n\nThis plug-in\
    \ fades an object in out, depending on its previous state. It requires the following\
    \ arguments:\n\n+   - id An object, an object ID, or an array of objects and/or\
    \ object IDs\n- msecs The number of milliseconds the transition should take\n\
    - interruptible If set, the fade can be interrupted; otherwise, it cannot\n\n\
    # Variables, Arrays, and Functions\n\n| | Local variable that iterates through\
    \ the elements in id if it is an array |\n|---|---|\n| Fadeout | New property\
    \ given to id and set to true if it has been faded out |\n| FadeIn() | Plug-in\
    \ to fade an object in |\n| FadeOut() | Plug-in to fade an object out |\n\n# How\
    \ It Works\n\nThis plug-in has to use its own code to iterate through id if it\
    \ is an array because of the need to individually check the Fadeout property for\
    \ each object. It uses the standard form of many prior plug-ins to call the same\
    \ function with single array elements.\n\nThe second half of the plug-in is where\
    \ the Fadeout property is checked. If it is set to true, that value will have\
    \ been assigned from within the Fade() plug-in, discussed earlier in this chapter.\
    \ When set to, it means the object has been faded out. The Fadeout property doesn't\
    \ exist or is set to false, then the object has not been faded out.\nTherefore,\
    \ based on the value of Fadeout, a decision is made by the FadeToggle() plug-in\
    \ to call either the FadeIn() plug-in to fade the object or the FadeOut() plug-in\
    \ to be attached.\n\n# How To Use It\n\nYou can attach this plug-in to an event\
    \ using HTML, or you can call it from a sample of JavaScript code. In the following\
    \ example, the same call to FadeToggle() is attached to both the mouseover and\
    \ mouseout events of the span:\n\n```\n<center><br />\n<img id='il1' src='id3.gif\
    \ /><br />\n<span id='spl'>Mouseover</span>\n\n<script>\nwindow.onload = function\
    \ () {\n  FadeToggle('il1', 1, 1);\n  O('spl').mouseover = function() { FadeToggle('il1',\
    \ 500, 1) }\n  O('spl').mouseout = function() { FadeToggle('il1', 500, 1) }\n\
    }\n</script>\n```"
