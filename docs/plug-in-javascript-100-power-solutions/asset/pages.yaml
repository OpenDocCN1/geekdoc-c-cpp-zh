  md: "# Plug-In JavaScript: 100 Power Solutions\n\n# The Plug-In\n\n```\nfunction\
    \ DeflateBetween(id1, id2, w, h, msecs, interruptible, CB) {\n  Deflate(id1, w,\
    \ h, msecs, interruptible, CB)\n  Relate(id2, w, h, msecs, interruptible, CB)\n\
    }\n```\n\n# Zoom()\n\nThis plug-in is similar in some ways to the Deflate() and\
    \ Relate() plug-ins but can do much more, including zooming in and out the center\
    \ of an object as the focus, padding margins during zooms to retain the same width\
    \ and height (ensuring other objects don't get disturbed by the resizing), and\
    \ specifying end widths and heights.\n\nIn Figure 6-7, four icons are displayed,\
    \ each of which is attached by its mouse events and when the Zoom() plug-in so\
    \ when the mouse passes over them they enlarge, and when it moves away they shrink\
    \ back down. In the figure the second icon is currently zoomed up.\n\n# About\
    \ the Plug-in\n\nThis plug-in will zoom an object over a period of time between\
    \ supplied sets of width and height. It can also pad the object to retain its\
    \ overall dimensions and supports three styles of zoom. It requires the following\
    \ arguments:\n\n+   * id An object, object ID, or an array of objects and/or object\
    \ IDs\n* w If true or 1, the object's width will be zoomed\n* h If true or 1,\
    \ the object's height will be zoomed\n* fromw The width from which the object\
    \ should be zoomed\n* fromh The height from which the object should be zoomed\n\
    * tow The width to which the object should be zoomed\n\n![](img/95e4c43b430487125c342550cc090977_173_0.png)\n\
    \nFIGURE 6-7 Zooming icons when mouse passes over them"
