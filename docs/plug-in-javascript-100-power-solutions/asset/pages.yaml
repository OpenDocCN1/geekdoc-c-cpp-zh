  md: "# Chapter 10: Audio and Visual Effects 303\n\n# The DoBillboard() Subfunction\n\
    \nThis function starts by setting the BB_Flag property of id to true to indicate\
    \ that the billboard is running:\n\n```\nO(id).BB_Flag = true\n```\n\nIt checks\
    \ the BB_Stop property of id to see whether it can continue or stop:\n\n```\n\
    O(O(id)).BB_Stop\n{\n  O(id).BB_Flag = false\n  clearTimeout(O(id).BB_IID)\n \
    \ return\n}\n```\n\nIf_Stop is true, then a request has been made to stop the\
    \ transition, so the function will reset BB_Flag to false, any time that is due,\
    \ and return. No interrupts will occur on it, unless the plug-in is called again—at\
    \ which time the transitions pick up from where they left off. This allows you\
    \ to, for example, pass the transitions pick if the mouse passes over an object\
    \ and resume them when it leaves.\n\nOtherwise, the function continues running\
    \ and the next thing is the currently displayed object faded out:\n\n```\nelse\
    \ FadeOut(objects(O(id)).BB_Index, msecs, 0)\n```\n\nThen, if the argument is\
    \ true (or 1), the object to display should be selected at random, which is done\
    \ by this code:\n\n```\nvar rand = O(id).BB_Index\nwhile (rand == O(id).BB_Index)\n\
    \  rand = Math.floor(Math.random() * len)\nO(id).BB_Index = rand\n```\n\nHere\
    \ is assigned the value of the O(id).BB_Index property, which points to the currently\
    \ displayed object. Then a() statement selects random numbers, placing them in\
    \ the variable rand, until it is not the same as O(id).BB_Index. This ensures\
    \ that the next object displayed in the billboard is the same as the current.\n\
    \nOnce a value is found, it is placed in O(id).BB_Index. Otherwise, if the objects\
    \ are displayed in order and O(id).BB_Index is incremented. If it becomes greater\
    \ than the number of objects in the array, it is reset to 0 (using the % operator):\n\
    \n```\nelse O(id).BB_Index = ++O(id).BB_Index % len\n```\n\nAt this point, O(id).BB_Index\
    \ represents the next object to be displayed, so a call is made to the FadeIn()\
    \ plug-in to fade it in:\n\n```\nFadeIn(objects[O(id).BB_Index], msecs, 0)\n```"
