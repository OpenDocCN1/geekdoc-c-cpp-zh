    \ from it:\n\nCredit Card Number:\n\n```\n<input id='ccnum' type='text' name='ccnum'\
    \ size='24' />\n<button id='button'>Submit</button>\n```\n\n```\n<script>\nwindow.onload\
    \ = function() {\n  O('button').onclick = function() {\n    O('ccnum').value =\
    \ \n    CleanupString(O('ccnum').value , 1, 0, 1, 1, 0, 0)\n  }\n}\n</script>\n\
    ```\n\nTo use in a web form, you could change the onclick event used in this example\
    \ to the onSubmit event of your form. If you do, make sure that the plug-in has\
    \ finished execution, the function you point the to returns true, because any\
    \ other value will likely cancel the form submission, and a return value of false\
    \ certainly will cancel it.\n\n# The Plug-in\n\n```\nfunction CleanupString(string,\
    \ allspaces, aldigits, alltext, allpunct, uptowlow, lowcount, spacestingles) {\n\
    \  if (allspaces)    string = string.replace(/\\s]/g, '')\n  if (aldigits)   \
    \  string = string.replace(/[\\d]/g, '')\n  if (alltext)      string = string.replace(/[a-zA-Z]/g,\
    \ '')\n  if (allpunct)     string = string.replace(/\\^\\a-zA-Z0-9]/g, '')\n \
    \ if (uptowlow)     string = string.toLowerCase()\n  if (lowcount)     string\
    \ = string.toUpperCase()\n  if (spacestingles) string = string.replace(/\\s]/g,\
    \ '')\n  return string\n}\n```\n\n# ValidateCreditCard()\n\nWith this plug-in,\
    \ you can check that a credit card number you are given by a user is at least\
    \ of the correct format and has the right checksum before submitting it to a card\
    \ processing company. Figure 12-8 shows a set made up credit card details that\
    \ did not pass the validation.\n\n![](img/95e4c43b430487125c342550cc090977_370_0.png)"
