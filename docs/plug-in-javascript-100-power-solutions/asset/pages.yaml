  md: '# Chapter 3: The Core Plug-ins 53


    FIGURE 3-9

    These plug-ins make it easy to work in values of pixels.


    ![](img/95e4c43b430487125c342550cc090977_72_0.png)


    # About the Plug-ins


    These plug-ins require an object''s property to be passed to them. If NoPx() is
    passed a value, the value returned will be that of the value any ‘px’ suffix.
    If Fx() is called, then the value returned is that of the value passed to the
    plug-in, combined with the suffix ‘px’. No case is property actually changed by
    these plug-ins, as values are derived from the properties and it is up to you
    to use them as required. The plug-ins require the following argument:


    +   - value The property to be modified


    # Variables, Arrays, and Functions


    ```

    replace()  JavaScript function for replacing a subsection of a string

    ```


    # How They Work


    NoPx() uses the JavaScript() function to replace any occurrences of ‘px’ in the
    string it is passed, and then returns the result, multiplying by 1 to ensure it
    is turning a string into a number.

    Fx() function adds the suffix ‘px’ to any value it is passed and then returns
    the result.


    # How To Use Them


    NoPx() is very simple in that all it does is replace the ‘px’ (if found) with
    the empty string in any string it is. Thus it can strip the trailing ‘px’ suffix
    that many object properties have. For example, the style.marginLeft property is
    just one of many that ends in ‘px’, so the following will call it out:


    ```

    value = NoPx(S(id).marginLeft)

    ```


    In this example the object referred to by id is passed to the S() function, which
    returns the style subjet. The marginLeft property is then passed to and the resulting
    string value, which might look like ‘10px’, for example, is then passed to the
    NoPx() function. In this case, it would return the number 10, which is then assigned
    to the variable value.'
  merge: -1
  img_proc: true
- pgno: 73
  md: "# 54 Plug-In JavaScript: 100 Power Solutions\n\nThe Px() performs the inverse,\
    \ adding the 'px' suffix to a value. This is useful when you need to assign 'px'\
    \ to an object's property that needs to know you are working in pixels. For example,\
    \ the style.width property can be used to set the width of an object, but it needs\
    \ to have 'px' added to it. To save you having to do this you can make the following\
    \ call instead:\n\n```\nS(id).left = Px(135)\n```\n\nThis command uses the S()\
    \ function to set the width of the object referred to by id to 135 pixels, since\
    \ Pix evaluates to '135px'. Here's an example of how you might use these plug-ins:\n\
    \n```\n<div id='square'>I'm a square</div>\n\n<script>\nwindow.onload = function()\
    \ {\n  S('square').width = Px(100)\n  S('square').height = Px(100)\n  S('square').backgroundColor\
    \ = 'yellow'\n}\n\nalert('This pair of similar functions returned the value of\
    \ 'square': ' + S('square').width + 'px' using NoPx() this becomes ' ' + NoPx(S('square').width));\n\
    </script>\n```\n\nThe HTML section contains a single div element with some text.\
    \ The div is resized to 100 pixels by 100, using the Px() function to create the\
    \ values. The background is also set to yellow so you can see the square.\n\n\
    After this is a call to the JavaScript alert() function in which the value of\
    \ the object's width style property is displayed ('100px'), and that value is\
    \ passed through the NoPx() and redisplayed. This time it's the number 100.\n\n\
    # The Plug-ins\n\n```\nfunction NoPx(value) {\n  return value.replace(/px/, '')\
    \ * 1\n}\n\nfunction Px(value) {\n  return value + 'px'\n}\n```\n\n# 10 X() and\
    \ Y()\n\nThis pair of similar functions returns an object's exact horizontal or\
    \ vertical offset from the left or top of the browser. The plug-ins are so short\
    \ because they are used frequently and it saves on typing; it also makes your\
