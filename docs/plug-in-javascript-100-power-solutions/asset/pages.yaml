    # How It Works


    This program is in three parts. The first is executed when the action argument
    contains the value ''save''. It creates a new date object and sets it to the current
    time and date, like this:


    ```

    var date = new Date();ndate.setTime(date.getTime() + seconds * 1000)

    ```


    # Saving a Cookie


    The expires is given the correct value to make the cookie expire in seconds, the
    path is assigned the path on the server to make the cookie apply, the domain and
    secure arguments are added (if they have values), and the cookie is set by assigning
    these values to document.cookie, as follows:


    # Reading a Cookie


    In the next section, a cookie is read back from the computer, starting by checking
    whether or not are any existing cookies on the computer; if there are not, the
    value false is returned:


    ```

    if (!document.cookie.length) return false

    ```'
