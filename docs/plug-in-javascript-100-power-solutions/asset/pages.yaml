    # 19 ResizeWidth()


    When creating dynamic web pages you will often need to change the dimensions of
    objects. You might do this to emphasize a section by enlarging it, you may allow
    the contents of a page to be rearranged by the user, or you might wish to open
    up elements as forms or light boxes, and so forth.


    With this plug-in, you can resize the width of any object that has a width property,
    as the example div shown in Figure 4-1, which has its width resized to 300 pixels.


    # About the Plug-in


    This plug-in changes the width of an object. It requires the following arguments:


    +   * id The ID of an object or the object itself. You can also pass an array
    of objects and/or object IDs.

    * width The new width for the object. If id is an array, all the objects referred
    to are set to this width.


    # Variables, Arrays, and Functions


    | j | Local integer loop |

    | overflow | The object''s style.overflow property |

    | width | The object''s style.width property |

    | HID | Global string variable with the value ''hidden'' |

    | Px() | Plug-in to add the suffix ''px'' |


    This plug-in also offers the multifunction of the o() and s() plug-ins, in which
    you can pass either the ID of an object or the object itself, and you even pass
