  md: '# 194 Plug-In JavaScript - 100 Power Solutions


    **FIGURE 7-5**

    A chain waits for a keypress


    ![](img/95e4c43b430487125c342550cc090977_211_0.png)


    # Variables, Arrays, and Functions


    | KEY_PRESS | Global variable containing the value of the last key pressed |

    | INTERVAL | Global variable containing the value 30 |

    | GetLastKey() | Plug-in to return the value of the last key pressed |

    | NextInChain() | Plug-in to run the next command in a chain |

    | DoWaitKey() | Subfunction to wait for a keypress before allowing a chain to
    continue execution |

    | SetTimeout() | Function to create a single call to another function at a future
    time |


    **How It Works**

    This-- calls the GetLastKey() function, which removes any key that has been pressed
    and leaves the global variable KEY_PRESS containing the empty string. Next, the
    setTimeout() function is called to create an interrupt call to the DoWaitKey()
    function in INTERVAL milliseconds. Here is the code for these two statements:


    ```

    GetLastKey()

    setTimeout(DoWaitKey, INTERVAL)

    ```


    When the DoWaitKey() function is called, it checks the value of KEY_PRESS and,
    if it is no longer the empty string, the NextInChain() plug-in is allowed to allow
    the command in a chain to run (if there is one).

    Otherwise, if no key has been pressed, another call to setTimeout() is made, to
    see if a key has been pressed, DoWaitKey() after INTERVAL milliseconds using this
    code:


    ```

    if (KEY_PRESS != '''')

    NextInChain()

    else setTimeout(DoWaitKey, INTERVAL)

    ```


    Therefore, if there is a key, after calling NextInChain() the function returns
    and will not be called unless a new call is made to WaitKey(), otherwise DoWaitKey()
    will be repeatedly called every INTERVAL milliseconds until a key is pressed.'
