    # How It Works


    This plug-in releases the contents object from its position in the HTML document
    by using the Locate() plugin to give it a style position of ABS (a global variable
    with the value ''absolute''). Next, it moves off screen to a location thousands
    of pixels away, removing it from the browser as quickly as possible so not to
    appear within your page.

    Next, contents are popped down, to be popped up when required, and the oncontext
    event of id is attached to the ContextUp() function, which will pop up contents
    when id is right-clicked.


    ```

    Locate(contents, ABS, -10000, -10000)

    PopDown(contents, type, 1, 1, 1, 0)

    O(id).oncontextmenu = ContextUp

    ```'
