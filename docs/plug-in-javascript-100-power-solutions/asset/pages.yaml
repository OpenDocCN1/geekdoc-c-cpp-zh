  md: "# Chapter 6: Movement and Animation 159\n\nAfter this, copies of the object's\
    \ current x and y coordinates need saving (if they haven'tnready been saved),\
    \ like this:\n\n```\nif (typeof O(id).ZO_X == UNDEFINED) {\n  O(id).ZO_X = X(id)\n\
    \  O(id).ZO_Y = Y(id)\n}\n```\n\nThe typeof operator checks whether the property\
    \ ZO_X is already defined; if it isn't, it assigns values to it the property ZO_Y,\
    \ taken from the plug-ins X() and Y().\n\n# If a Zoom Is Not Currently in Progress\n\
    \nNext, the plug-in checks whether a zoom is currently in progress id by looking\
    \ at itsnZO_Flag property. If a zoom is not in progress, three variables require\
    \ initializing prior\nstarting the zoom, as follows:\n\n```\nif (!O(id).ZO_Flag)\
    \ {\n  O(id).ZO_W = Math.max(fromw, tow)\n  O(id).ZO_H = Math.max(from, toh)\n\
    \  O(id).ZO_Count = 0\n}\n```\n\nThe first two statements assign whichever value\
    \ is larger than the start and destinationnwidths and heights to the ZO_W and\
    \ ZO_H properties of id.\nfromw, tow, and toh this sets default value for the\
    \ width and height of a zoom should only one of the dimensions\nbe to change (the\
    \ nonchanging dimension will retain this value). The ZO_Count\nproperty is also\
    \ initialized to zero\n\n# If a Zoom Is In Progress\n\nIf a zoom is in, the ZO_Int\
    \ property is inspected. If it is not, the plug-in may\nbe interrupted, it returns.\
    \ The repeating intervals are stopped by calling the\nclearInterval() function.\
    \ also the only useful action an interrupt can do to\nzoom in progress is to reverse\
    \ the direction of zooming, the ZO_Count property of is set\nto inverse. Here\
    \ is the section of code that does this:\n\n```\nelse {\n  if (O(id).ZO_Int) return\n\
    \  else clearInterval(O(id).ZO_IID)\n\nO(id).ZO_Count = (msecs / INTERVAL) - O(id).ZO_Count\n\
    }\n```\n\nIf the zoom can't interrupted then the msecs / INTERVAL being the number\
    \ of\nsteps required to make the zoom last for msecs milliseconds. Therefore,\
    \ if the ZO_Count\nproperty has a value of 10 out of 34 (for example), then for\
    \ the zoom to reverse there will be\nonly 10 steps remaining to return to the\
