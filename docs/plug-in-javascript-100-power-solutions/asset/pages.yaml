  md: "# Chapter 11: Cookies, Ajax, Security 335\n\nit has retrieved poses a problem,\
    \ in that it contains several XML tags that won't up under HTML.\nTo correct this,\
    \ the callback function todiv() has been modified to exchange all occurrences\
    \ of the < & > symbols with their HTML entities &lt; and &gt; and all linefeed\
    \ characters are changed to &lt;br /&gt; tags.\nFor reasons previously, the PHP\
    \ example should be in the same folder of the same server, where there's a URL\
    \ you can use to test the example:\n\n```\nhttp://www.pluginjavascript.com/plug-ins/example8.htm\n\
    ```\n\nNote With XML, you would probably want to parse the tree to extract just\
    \ the elements you want, but if you are fetching only text or HTML, you have all\
    \ the tools you need to easily make all types of Ajax calls and act appropriately\
    \ on the data return.\n\n# The Plug-in\n\n```\nfunction PostAjaxRequest(id, callback,\
    \ url, args)\n{\n    var contentType = 'application/x-www-form-urlencoded'\n \
    \   var ajax = new XMLHttpRequest(id, callback)\n    if (!ajax) return false\n\
    \n    ajax.open('POST', url, true)\n    ajax.setRequestHeader('Content-type',\
    \ contentType)\n    ajax.setRequestHeader('Content-length', args.length)\n   \
    \ ajax.setRequestHeader('Connection', 'close')\n    ajax.send(args)\n    return\
    \ true\n}\n```\n\n# 88 FrameBust()\n\nThis is a simple but useful plug-in that\
    \ checks whether it is running inside a frame and, if it is, out of it, placing\
    \ the current page in its own parent page. This can be useful when you find that\
    \ other sites link to your pages, but bury them inside frames that they do not\
    \ display at their best. Figure 11-5 shows one page embedded within another and\
    \ displaying an optional confirm dialog, offering to bust out of the frame.\n\n\
    # About the Plug-in\n\nThis plug-in can close any embedding frame, making a web\
    \ page the parent web page for the current tab or window. It supports the following\
    \ optional argument:\n\n+   * message If this has a value, it will be displayed\
    \ in a confirm dialog window offering the user the option to click OK to close\
    \ the surrounding frame. If it doesn't have a value, the plug-in will automatically\
