  md: '# 206 Plug-In JavaScript: 100 Power Solutions


    Finally, the object is moved to the new location in ox and oy, and the HS_X and
    HS_Y properties are assigned these values, as follows:


    ```

    GoTo(id, ox, oy)

    O(id).HS_X = ox

    O(id).HS_Y = oy

    ```


    # Subfunction

    The job of this function is to slide the object away again when the mouse passes
    out of it. The first thing it does is cancel any previously running regular interrupts
    (for instance, if the object was in the process of sliding in) with a call clearInterval().
    Then it sets up a new interrupt to the DoSlideOut() sub-function, like this:


    ```

    if (id).HS_HID clearInterval(O(id).HS_HID)

    O(id).HS_HID = setInterval(DoSlideOut, INTERVAL)

    ```


    As with the similar DoSlideIn(), copies of the properties used are first placed
    into shorter variable names, like this:


    ```

    var ox = O(id).HS_X

    var oy = O(id).HS_Y

    ```


    Then, if the movement hasn''t completed, the values of ox and oy are modified
    as depending upon which edge is being used; otherwise the repeating interrupt
    is cancelled, as follows:


    ```

    if (where == TP && oy > y) oy = Math.Max(y, oy - s)

    elelse if (where == LT && oy < y) oy = Math.min(y, oy + s)

    else if (where == LT && ox > x) ox = Math.Max(x, ox - s)

    else if (where == RT && ox < x) ox = Math.Max(x, ox + s)

    clearInterval(O(id).HS_HID)

    ```


    Finally, the object is moved to the new location in ox and oy, and the HS_X and
    HS_Y properties are assigned these values, as follows:


    ```

    GoTo(id, ox, oy)

    O(id).HS_X = ox

    O(id).HS_Y = oy

    ```


    > Note HoverSlide() is one of the more complicated plug-ins, but it does create
    great effects, so it is worth reading the preceding explanation a few times if
    any parts are not clear first.


    How Use It

    To use the HoverSlide() plug-in, you pass an object and tell it where the object
    should be placed (out of the ''top'', ''bottom'', ''left'', or ''right'' edges),
    wherever on the edge to place it, how of the object to allow showing, and the
    speed of the sliding animation in milliseconds, as in these examples:


    ```

    HoverSlide(''myobject'', ''top'', ''$50'', 60, 1000)

    HoverSlide(''myobject2'', ''right'', 15, 20, 1000)

    ```'
