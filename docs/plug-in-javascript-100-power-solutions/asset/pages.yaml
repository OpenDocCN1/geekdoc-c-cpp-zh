- pgno: 55
  md: '# Variables, Arrays, and Functions


    | Variable/Constant | Description |

    | :--- | :--- |

    | MOUSE_DOWN | Global integer set to true if a mouse button is currently held
    down, otherwise false |

    | MOUSE_IN | Global integer set to true if the mouse pointer is currently within
    the browser window, otherwise false |

    | MOUSE_X | Global integer containing the current horizontal coordinate of the
    mouse pointer |

    | MOUSE_Y | Global integer containing the current vertical coordinate of the mouse
    pointer |

    | SCROLL_X | Global integer containing the amount the browser has scrolled vertically,
    in pixels |

    | SCROLL_Y | Global integer containing the amount the browser has scrolled horizontally,
    in pixels |

    | KEY_PRESS | Global integer containing the value of the last key pressed |

    | ZINDEX | Global integer containing the maximum z-index of any object accessed
    via the plug-ins |

    | CHAIN_CALLS | Global array containing plug-ins that have been chained and which
    are yet to be executed |

    | INTERVAL | Global integer containing the time in milliseconds between calls
    to a repeated event |

    | UNDEF | Global string containing the value ''undefined'' |

    | HID | Global string containing the value ''hidden'' |

    | VIS | Global string containing the value ''visible'' |

    | ABS | Global string containing the value ''absolute'' |

    | FIX | Global string containing the value ''fixed'' |

    | REL | Global string containing the value ''relative'' |

    | TP | Global string containing the value ''top'' |

    | BM | Global string containing the value ''bottom'' |

    | LT | Global string containing the value ''left'' |

    | RT | Global string containing the value ''right'' |

    | BROWSER | Global string containing the name of the current browser |

    | NavCheck | Subfunction to check for the existence of a string in the browser
    User string |


    # How It Works


    Let''s look first at each of this plug-in''s global variable definitions:


    +   * MOUSE_DOWN This variable is updated by the two inline, anonymous functions
    (later in the plug-in) that are attached to the document.`onmouseup` and `document.`onmousedown`
    events. With it you can quickly make a check to see'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Chapter 3: The Core plug-ins 37


    whether or not a mouse is being pressed anywhere in the browser window by simply
    looking at this variable, which has a value of true if down; otherwise it is set
    to false.


    +   - MOUSE_IN In a similar fashion, the document.onmouseout and document .onmouseover
    events are captured, and this global variable is set to true when the mouse pointer
    is within the bounds of the browser window; otherwise it is set to false.


    +   - MOUSE_X and MOUSE_Y This pair of global variables is constantly updated
    by the CaptureMouse() plug-in (the plugin following this one), which is attached
    to the document.onmousemove event. Therefore, you can reference these variables
    at any time to determine the position of the mouse pointer.


    +   - SCROLL_X and SCROLL_Y These variables are also kept updated by the CaptureMouse()
    plug-in. They are continuously updated with values representing the amount by
    which the mouse has scrolled in both vertical and horizontal directions.


    +   - KEY_PRESS This variable is updated by the Keyboard() plug-in, which captures
    the document.onkeydown and document.onkeypress events and sets the variable on
    the key that was pressed.


    +   - ZINDEX This global variable starts with a default value of 1,000. It is
    used to determine the zindex property of objects used. This is the depth at which
    it will be displayed on the screen, with lower or negative numbers being higher
    and positive numbers. For example, the ContextMenu() plug-in in Chapter 8, which
    opens a drop-down element when you right-click, uses this value to ensure that
    the element appears in front of all other windows. The Browser() plug-in (also
    in Chapter 8), which creates in-browser, movable pop-up windows, sets windows
    that are linked to ZINDEX + 1, to ensure they come to the front.


    +   - CHAIN_CALLS Some of the plug-ins have the ability to be chained together
    so that they run consecutively, one starting after the previous has finished.
    Normally, JavaScript does not allow such behavior, and if you call a function
    that, for example, sets up an interval to perform an animation, that function
    will return immediately to the calling code without waiting for the sequence of
    interrupts to complete. This is exactly normal behavior, as it allows other things
    to happen at the same time. But some of these plug-ins work better when they are
    chained, which is achieved by placing a sequence of functions in the CHAIN_CALLS
    array so that each function completes, the next in the chain can be called. The
    only reasons you might want to access this array is to determine (and how many)
    functions are queued up, or possibly to empty the interval to cancel all queued
    functions.


    +   - INTERVAL After many hours of experimentation on all the major browsers across
    a range of computers and operating systems, I have derived a value of 30 milliseconds
    being the optimal time to allow between interrupt calls, because some shorter
    functions complete in under 10 milliseconds, while others may take 20 or more,
    but none should take longer than 30 milliseconds. Therefore, I have'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'set the global variable INTERVAL to 30. This fixed value is required for timing
    purposes, so that all the interrupt functions in this book can ensure that they
    take exactly the number of milliseconds passed to them. If JavaScript speed creep
    over the next few years, as they inevitably do, this allows you to optimize these
    plug-ins and drop the value of this to 25, 15, or even fewer milliseconds, as
    computers get faster and JavaScript interpreters improve. This will not speed
    up the plug-ins, but it will allow animations to have extra steps between the
    first and last frame, making the transitions smoother.


    # Global String Variables


    After these first ten global variables, a further ten string variables are defined.
    These are UND, HID, VIS, ABS, FIX, REL, STA, INH, TP, BM, LT and RT, and in order
    they for the strings ''undefined'', ''hidden'', ''visible'', ''absolute'', ''fixed'',
    ''relative'', ''static'', ''top'', ''bottom'', ''left'' and ''right''.


    They are not essential, but I created these variables because the strings to which
    they are referred frequently by the plug-ins, and this helps to keep the code
    more compact. It also serves to make the listings in this book narrower, so that
    lines that might have wrapped around now on a single line. Additionally, they
    help to make the code more readable, as long you refer back to this section if
    you forget the values of any of them.


    # Determining the Current Browser


    Because JavaScript varies in its implementation between different developers,
    you sometimes need to know which browser you are dealing with. So, in conjunction
    with the subfunction NavCheck(), the next ten lines of code will set the global
    BROWSER to one of the following strings, depending on the browser used: ''IE'',
    ''Opera'', ''Chrome'', ''iPod'', ''iPhone'', ''iPad'', ''Safari'', ''Firefox'',
    and ''UNKNOWN''. You can then refer to this variable in some way that the plug-ins
    do in order to offer different browsers. When ''Firefox'' is returned it means
    a browser running on the Gecko rendering engine is in use, which includes other
    browsers than Firefox.


    # Attaching Functions to Events


    Much of the functionality of these plug-ins rests on the capturing of built-in
    browser events, as is done by the remaining seven lines of code. The first three
    CaptureMouse() function to the document.onmousevent, and the CaptureKeyboard()
    function to the document.onkeydown and document.onkeypress events. These plug-ins
    are documented in their own sections, but it suffices to say that they are called
    each time of these events occurs and they keep the global variable KEY_PRESS updated.


    The final four lines attach functions that are so small that I have created them
    as anonymous, inline functions. All they do is capture the document.onmouseover,
    document.onmouseover, document.onmouseup and document.onmousedown events, keeping
    the global variables MOUSE_IN and MOUSE_DOWN updated.'
