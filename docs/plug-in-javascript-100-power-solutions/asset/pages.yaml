  md: '# Plug-In JavaScript: 100 Power Solutions


    Figure 11-5

    With this plug-in

    can bust your

    web pages out of

    embedding frames.


    ![](img/95e4c43b430487125c342550cc090977_353_0.png)


    # Variables, Arrays, and Functions


    | top | Object representing the outermost of any frame set |

    | self | Object representing the current document |

    | top.location | Property of top containing URL of its document |

    | self.location.href | Property of self.location containing its URL |

    | confirm() | Function to offer a yes/no confirm dialog |


    # How It Works


    This plug-in makes the current document the top one by setting its URL to the
    top object''s, or it displays a message (if the message has a value) that offers
    the user the choice of breaking out of frames or leaving them as they are.


    # How To Use It


    To use this plug-in, either without an argument if you never want your pages to
    be embedded in frames, or a message for a confirm dialog, which the response to
    is click OK to bust out of frames or Cancel to keep the pages as they are. Here
    is an example of passing a message:


    ```

    <script>

    FrameBust("This page has been loaded up within a surrounding frame.\\n"

    "Please click [OK] if you would like to close the surrounding frame.")

    </script>

    ```


    You can use \n or other escaped characters in the message to control how the it
    displays. If you don''t wish to provide a message and all pages to bust out of
    frames, just the message string out of the call to FrameBust ().'
