  md: "# 136 Plug-In JavaScript: 100 Solutions\n\nLet's look at another example that\
    \ responds to mouse events and allows interruption adding a couple of commands\
    \ to the <script> section of the previous example:\n\n```\nO('globe').onmouseover\
    \ = function() {\n  Slide(this, 450, 0, 450, 50, 500, 1) }\nO('globe').onmouseout\
    \ = function() {\n  Slide(this, 450, 0, 450, 0, 500, 1) }\n```\n\nNow when you\
    \ pass the mouse over the slide it will move from the position 450.0 to 450.0.\
    \ When you move the mouse away, it will slide back to 450.0. As you'll see, it\
    \ doesn't matter where you interrupt the slide, it always maintains the correct\
    \ speed. Notice that the keyword tells Slide() object to slide.\n\nHowever, if\
    \ you interrupt one slide with another that has a different distance to go or\
    \ a different length of time specified, the interrupting and interrupted speeds\
    \ will not match. I recommend you to generally dissu interrupting a slide with\
    \ a dissimilar one. as with the first Slide() call in the example, where you cannot\
    \ interrupt.\n\n# The Plug-in\n\n```\nSlide(id, frx, fry, tox, toy, msecs, interruptible,\
    \ CB) {\n  if (O(id).SL_Flag) {\n    if (O(id).SL_Int) return\n    else clearInterval(O(id).SL_IID)\n\
    \n    var len1 = Distance(tox - frx, toy - fry)\n    frx = X(id)\n    fry = Y(id)\n\
    \    var len2 = Distance(tox - frx, toy - fry)\n    msecs *= len2 / len1\n  }\n\
    \n  var stepx = (tox - frx) / (msecs / INTERVAL_)\n  var stepy = (toy - fry) /\
    \ (msecs / INTERVAL_)\n\n  var count = 0\n  O(id).SL_Int = interruptible\n  O(id).SL_Flag\
    \ = true\n  O(id).SL_IID = setInterval(DoSlide, INTERVAL_)\n\n  function Distance(x,\
    \ y) {\n    x = Math.max(1, x)\n    y = Math.max(1, y)\n    return Math.round(Math.abs(x\
    \ * x) + Math.abs(y * y))\n  }\n\n  function DoSlide() {\n    GoTo(id, frx + stepx\
    \ * count, fry + stepy * count)\n    if (count++ >= (msecs / INTERVAL_))\n\n```"
