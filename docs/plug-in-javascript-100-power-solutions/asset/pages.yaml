    In most programs, moving the cursor to different parts of a program usually allows
    you to highlight sections of the code. For example, placing the cursor next to
    any bracket in Notepad++ automatically highlights the matching.


    # Managing Ajax


    Ajax stands for Asynchronous JavaScript and XML, but the name is really a misnomer
    because Ajax is far more than an XML handling technology. It is, in fact, at the
    heart of all the modern Web 2.0 websites that exchange information between the
    web browser and server in the background, without the user being aware.


    To do this, a server side language is required, and the most popular one is the
    PHP scripting language. So, although this isn''t about Ajax and PHP, inevitably
    some of the php-ins use of these technologies and if you wish to them on your
    development computer, you''ll need to install a server and PHP processor. You
    don''t have to do this if you don''t intend to use any of the Ajax plug-ins, which
    are clearly marked as such, but if you do, don''t worry: it is quite simple.


    It is simple because the developers of PHP have released an all-in-one application
    called Zend Community Edition (CE) that includes all of PHP an Apache web server
    and a MySQL database. You can download Zend from the following URL:


    ```

    http://zend.com/products/server-ce

    ```


    Versions are available for three main operating systems (Windows, Mac OS X, and
    Linux), and the installation process is reasonably straightforward, although you''ll
    need to carefully read the prompts and make indent responses. Figure 1-2 shows
    how you can control Zend Server CE directly from within your web browser.


    > Tip If you are interested in PHP programming, my book Plug-in PHP (McGraw-Hill/Professional,
