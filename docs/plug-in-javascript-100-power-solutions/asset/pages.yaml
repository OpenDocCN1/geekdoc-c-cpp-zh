    # The DoPulsate() Sub-function


    This function is where the pulsating is to occur and it is in two parts: one for
    fading out and the other for fading in. The first part checks the faded variable,
    and if it is true, the object is faded. Next it checks the FA_Level property of
    id and, if it is the same as the value in op1, id is its default opacity and is
    ready to be faded out. Here is the line of code that performs these tests:


    Inside the if(), a statement is check to see whether the finish variable has been
    set to true. If it has, rather fade the object out, it''s necessary to stop the
    repeating interrupts, like this:


    ```

    if (finish) clearInterval(id)

    ```


    When the function returns, it will not be called again unless a new set of interrupts
    is triggered by another mouseover event. However, if finish is not true, then
    it''s business as the function, which instigates a fade by calling the Fade()
    plug-in with a final opacity value of op2. The faded variable is set to true to
    indicate that the object is faded or is in the process of doing so, like this:


    ```

    Fade(id, op1, msecs / 2, 0)

    faded = true

    ```


    The transition duration of msecs / 2 is used because there are two transitions
    in each full cycle, so each transition must take half the value in msecs to complete.
    In the second part of this function, if the variable faded is true, the FA_Flag
    property of id is tested. This property is set to true by the Fade() plug-in when
    a fade transition is in progress and to false once a transition has completed.
    If FA_Flag is true, the function will return a fade is in, and it must not be
    interrupted:


    ```

    else if (!O(id).FA_Flag)

    ```


    Otherwise, the code within the if() statement will be executed, as follows:


    ```

    Fade(id, op2, msecs / 2, 0)

    faded = false

    ```


    Here call to Fade() is made with a final opacity value of op1 to fade the object
    back to its default opacity level, and the variable is set to false to indicate
    that the object is faded or is in the process of doing so.


    # How To Use It


    The plug-in is written so that it will always fade back to the default opacity
    for an object when the mouse is moved away. To use it, attach it to any objects
    that you would like to pulsate when the mouse passes over them. These can be images,
    divs, spans, or anything that has opacity property that can be changed.'
