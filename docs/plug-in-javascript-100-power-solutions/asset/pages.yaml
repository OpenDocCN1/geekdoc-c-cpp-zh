  md: '# Chapter 8: Menus and Navigation 249


    However, when I set up an Internet radio station in the 1990s, I used pop-ups
    to good effect by implementing them as an audio player console so that people
    could listen to the radio while they continued to surf in the main browser window.
    Perhaps due to the novelty, of the website''s visitors kept these pop-ups open
    for long periods as they listened to ours.


    Even though they have a bad name nowadays, pop-ups do plenty of sensible uses,
    such as providing alerts and instant messages, for example. This-plugin provides
    a versatile in-browser pop-up that''s more user friendly opening a new browser
    window pop-up which will generally get blocked anyway. It also gives the user
    full control, as it can be moved around the browser and is easily dismissible.


    With this-plugin, you can ask for their login details, display private messages
    from another user in a forum, provide a selection of options, and so on. Or, as
    in Figure 8-12, you can pop up a window to provide further details when a user
    clicks a link. The great thing about it is the user has full control. You can
    keep the window raised and moved to reveal any content it was covering, or you
    can simply close it.


    # About the Plug-in


    This-plugin creates an in-browser pop-up window that can be moved by the user
    and also popped back again. It requires the following:


    +   * id An object or object ID identifying the main container—this may not be
    an array

    * headerid An object or object ID identifying the draggable header

    * closeid An object or object ID identifying the close button

    * **x&&y** The top left coordinates of the pop-up


    ![](img/95e4c43b430487125c342550cc090977_266_0.png)'
