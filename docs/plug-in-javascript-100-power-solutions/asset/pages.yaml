  md: "# Chapter 8: Menus and Navigation\n\nFIGURE 8-4\nWith PopToggle() you can substantially\
    \ optimize your code.\n\n![](img/95e4c43b430487125c342550cc090977_240_0.png)\n\
    \n# About the Plug-in\n\nThis plug-in takes an action and toggles its state between\
    \ popped up and down using a variety of styles. It requires the following arguments:\n\
    \n+   - An object or object ID or an array of objects and/or object IDs\n- The\
    \ type of pop-up or pop-down, of 'fade', 'inflate', 'zoom', or 'instant'\n- If\
    \ true or 1, the width of the object (where applicable) will be modified\n- If\
    \ true or 1, the height of the object (where applicable) will be modified\n- The\
    \ number of milliseconds the transition should take, except for the type 'instant',\
    \ which uses no msecs\n- If true or 1, the plug-in can be interrupted with another\
    \ call on the same object\n\n# Variables, Arrays, and Functions\n\n| j | Local\
    \ variable for iterating through id if it is an array |\n| PO_IsUp | Property\
    \ of id that is false if it is popped down, otherwise it is popped up |\n| PopDown()\
    \ | Plug-in to pop down an object |\n| Popup() | Plug-in to pop up an object |\n\
    \n# How It Works\n\nThis plug-in starts with the code used by many plug-ins to\
    \ iterate through id if it is an array and recursively pass each element back\
    \ to itself to be processed individually, like this:\n\n```\nif (id instanceof\
    \ Array) {\n  for (var j = 0; j < id.length; ++j)\n    PopToggle(id[j], type,\
    \ w, h, msecs, interruptible)\n  return\n}\n```"
