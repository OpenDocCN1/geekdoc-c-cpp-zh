  md: '# Chapter 1: Making the Best Use of These plugins 3


    What it comes down to is, if you will be developing on a non-Windows computer
    I recommend you have access to a Windows PC or have Windows installed as a dual
    boot (or a virtual machine) alongside your main operating system so that you can
    fully test your programs before publishing them to the web at.


    # Choosing a Program Editor


    Long gone are the days of relying on a simple Notepad program for coding. Software
    for writing program code has progressed in leaps and bounds in recent years, with
    text editors being replaced by powerful program editors that highlight your syntax
    using different colors and can quickly locate things for you like (matching) brackets
    and braces and so on.

    Table 1-2 lists number of free program editors that will do a great job of helping
    you write JavaScript code quickly and efficiently.

    Which one you choose is largely down to personal preference—in my case I settled
    on Notepad++ (see Figure 1-1).


