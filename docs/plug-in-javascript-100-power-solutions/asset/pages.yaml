    \ and Functions\n\n| setTimeout() | Function to create a single interrupt |\n\
    | NextChain() | Plug-in to run the next command in a chain (if there is one) |\n\
    \n# How It Works\n\nThis plug-in is quite straightforward. It simply makes a call\
