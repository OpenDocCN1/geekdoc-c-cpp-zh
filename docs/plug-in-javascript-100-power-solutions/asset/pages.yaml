  md: "# Chapter 8: Menus and Navigation\n\n```\nfunction fade() { PopToggle('a1',\
    \ 'fade', 1, 1, 500, 1) }\nfunction inflate() { PopToggle('a2', 'inflate', 1,\
    \ 0, 500, 1) }\nfunction zoom() { PopToggle('a3', 'zoom', 1, 1, 500, 1) }\nfunction\
    \ instant() { PopToggle('a4', 'instant', 1, 1, 500, 1) }\n</script>\n```\n\nThe\
    \ HTML section is unchanged, but the <script> uses a technique I haven't shown\
    \ you yet, which is to assign both the mouseover and mouseout events to the same\
    \ function, using a single statement, like this:\n\n```\nO('l1').mouseover = O('l1').mouseout\
    \ = fade\n```\n\nThis works because events are readable as well as writable, the\
    \ mouseover event is first assigned to the fade() function, and the mouseout event\
    \ is assigned to the value in the mouseout event.\nThis means only four statements\
    \ are used in place like this, because PopToggle() can replace both the PopDown()\
    \ and PopUp() plug-ins, of only four functions are required to manage eight actions.\n\
    In fact, the functions can be attached to the events using inline, anonymous functions,\
    \ and the line lengths would become quite long and less easy to edit.\n\n# The\
    \ Plug-in\n\n```\nfunction PopToggle(id, type, w, h, msecs, interruptible)\n{\n\
    \  if (instanceof Array)\n    for (var j = 0; j < id.length; ++j)\n      PopToggle(id[j],\
    \ type, w, h, msecs, interruptible)\n  return\n\n  if (typeof id.PO_IsUp == UNDEF)\n\
    \    id.PO_IsUp = true\n\n  if (O.PO_IsUp) PopDown(id, type, w, h, msecs, interruptible)\n\
    \  else PopUp(id, type, w, h, msecs, interruptible)\n}\n```\n\n# FoldingMenu()\n\
    \nUsing the pop-up and down features of the plugging-ins, it's possible to create\
    \ professional looking folding menus, which is what this plug-in offers. With\
    \ it, you can create a wide variety of folding menus with different transition\
    \ styles. For example, Figure 8-5 shows a folding menu with four headings, each\
    \ with different sets of contents.\n\n![](img/95e4c43b430487125c342550cc090977_242_0.png)"
