    <img id=''a1'' src=''avatar1.jpg'' align=''left'' />

    <img id=''a2'' src=''avatar2.jpg'' align=''left'' />

    <img id=''a3'' src=''avatar3.jpg'' align=''left'' />

    <img id=''a4'' src=''avatar4.jpg'' align=''left'' /> </div></center>

    ```


    ```

    <script>

    window.onload = function() {


    Position(''d'', ABS);

    Center(''d'');


    O(''11'').onmouseover = O(''11'').onmouseout = fade

    O(''12'').onmouseover = O(''12'').onmouseout = inflate

    O(''13'').onmouseover = O(''13'').onmouseout = zoom

    O(''14'').onmouseover = O(''14'').onmouseout = instant

