    This example creates three divs and places links in them using <u><a href...>
    tags in the real world you might use. Each object has a unique ID. Also the &amp;
    HTML entity creates pairs of pointing brackets.

    Then, in the <em><section> section, the Ida is populated with the object names
    and the Hide() function makes them invisible so they will display nearly when
    the menus have been created—and you shouldn''t see them jump around. It also helps
    to hide any content that might make some value for a potential horizontal scroll
    bar, ensuring that everything centers correctly.


    After resizing the objects, setting style positions, and assigning their colors,
    it''s safe to show the objects again with Show(). In fact, you must do so in order
    for the plug-in to be able to look up their dimensions. Finally, the HoverSlideMenu()
    plug-in is called and the menus are displayed.'
