- pgno: 298
  md: '# Chapter 9: Text Effects


    The variables tox toy save the current location of the object as a record of where
    to fly into it. The start location for the animation is then placed in fromx and
    from, the step value for each dimension of frame is stored in xstep and ystep,
    and the counter is initialized.


    Finally, in the setup section, the id is released from the HTML and given a style
    position property of ''absolute'', using the global variable ABS. This allows
    it to be moved anywhere within the document. Next, the setInterval() function
    is called to start repeating interrupts by the DoFlyIn() subfunction every INTERVAL
    milliseconds. The result of calling the function is saved in iid to be used later
    when clearInterval() is called:


    ```

    Position(id, ABS)

    var iid = setInterval(DoFlyIn, INTERVAL)

    ```


    # The DoFlyIn() Function


    This function uses the GoTo() plug-in to move to each location in the animation,
    like this:


    ```

    GoTo(id, fromx * xstep * count, fromy - ystep * count)

    ```


    An if statement checks whether it has a value greater than or equal to msecs /
    INTERVAL. If it does, the fly-in has completed and the following code is executed,
    but whether it does or doesn''t equal that value, count is incremented after the
    test is, like this:


    ```

    if (count++ >= msecs / INTERVAL)

    {}

    ```


    If the fly-in has finished, the FI_Flag property of id is set to false to indicate
    this, GoTo() is placed at exactly the correct location (because xstep and ystep
    will use be floating points and the final values calculated using them could be
    off by a pixel or two). The repeating interrupts are stopped with a call to clearInterval(),
    like this:


    ```

    O(id).FI_Flag = false

    GoTo(id, tox, toy)

    clearInterval(iid)

    ```


    The function then returns, if the fly-in hasn''t yet finished, it will be called
    again in INTERVAL milliseconds, and so on until the animation is completed.


    # How To Use It


    To use this plug-in, pass an object and specify where you want the object to fly
    in from by providing relative horizontal and vertical coordinates in the next
    two arguments. You also have to tell the plug-in how long the animation should
    take in milliseconds.'
