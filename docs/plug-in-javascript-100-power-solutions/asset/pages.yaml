  md: '# 14 Plug-In JavaScript: 100 Solutions


    The great thing about JavaScript is it could have been designed purely as a alone
    scripting language and it would still have been very useful. But the developers
    did something that would form the future of the Web, which to link it to the HTML
    Document Object Model (DOM), a way of defining an HTML document in a structured
    way that can be accessed by languages such as JavaScript and Microsoft''s VScript
    (which it does not cover the layer in this).


    When you see something dynamic happening on a web page like, graphic image zooming
    out when you pass the mouse over it, or menus altering according to your selections,
    this is usually accomplished using JavaScript, which offers much scope that is
    limited to what Flash or Java apps—which they are enabled in.


    And speaking of Java, you may be forgiven for thinking that JavaScript is connected
    to the Java programming language, in fact, it has little to do with it; JavaScript
    was given the name as a market ploy to play in on the popularity of the Java language.
    Because some people refer to JavaScript as ECMAScript, but since that doesn''t
    roll off the tongue, it will take over the language''s most popular name.


    Anyway, once you have the DOM and a chance to change it, you can do almost anything
    with a web page, such as easily add new paragraphs; change focus and select text;
    replace images; play sound effects; music, and videos; and more.


    When you add Cascading Style Sheets (CSS) to the mixture you can apply changes
    to a page, completely changing the way it looks, without altering the HTML. Actually,
    CSS has something with JavaScript in site settings you can apply dynamic effects
    to change their color and other properties when the mouse passes over them (as
    you''ll implement in some of the plug-ins).


    Therefore the plug-ins we use both CSS and JavaScript to achieve the required
    functionality in the simplest and easiest way possible. But in order to understand
    what is going on in many of the plug-ins, it''s important that you first have
    a grounding in the DOM and CSS.


    > Tip You may be experienced with programming in JavaScript using CSS and the
    DOM. If so, you may wish to skip through this chapter for a quick refresher on
    the subject. But if you are relatively new to JavaScript I recommend you你去 yourself
    with the contents of this chapter, because the plug-ins here are built on the
    principles discussed.


    # The Document Object Model (DOM)


    The Document Object Model (DOM) separates the different parts of an HTML document
    into a hierarchy of discrete objects, each having its own properties and methods.
    Methods are functions that can do something with an object, while properties are
    attributes of an object such as the value it holds in the case of a text object,
    or width and height in case of an image, and so on.


    The outermost object is the window object, which is the current window, tab, or
    popped up. Underneath is the document object, of which can be more than one (such
    as several documents loaded into different frames within a page). Inside a document
    there are other objects such as the head and body of a page.'
  merge: -1
  img_proc: true
