    ```\n\n# How To Use It\n\nTo use this plug-in, pass the string year for the copyright\
    \ and then assign the string returns to an element in your document, as in the\
    \ following example:\n\n```\n<span id='copy'></span>\n```\n\n```\n<script>\nwindow.onload\
    \ = function() {\n  Htmll('copy', InsVars(\"This website is #1 MyWebProperties\
    \ Inc\")\n  RollingCopyright(2005));\n}\n</script>\n```\n\nThe HTML section creates\
    \ a <script> section that will be used to display the copyright message, and then\
    \ the <script> section uses the InsVars() plug-in to insert the result of calling\
    \ RollingCopyright() into a sentence, which is then assigned to the innerHTML\
    \ property of the span.\n\n# The Plug-in\n\n```\nfunction RollingCopyright(start)\
    \ {\n  var date = new Date();\n  date = date.getFullYear();\n  return '&copy;\
    \ ' + start + \"-\" + date\n}\n```\n\n# Alert()\n\nThe built-in JavaScript alert()\
    \ function is great for help with debugging or alerting users about something\
    \ important. However, the function is a modal dialog, which means it takes over\
    \ the browser, preventing access to anything within it other than the alert window.\
    \ What's worse, if a web page calls alert() in a loop it will effectively lock\
    \ you out of the browser, preventing you from closing it.\n\nThis plug-in provides\
    \ a handy replacement for the function that is much more user friendly in that\
    \ it is not modal, and all other parts of the browser remain accessible while\
    \ it"
