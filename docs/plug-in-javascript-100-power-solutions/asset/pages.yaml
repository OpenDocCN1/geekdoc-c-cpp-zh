  md: "# 184 Plug-In JavaScript: 100 Power Solutions\n\nThis calls up the Deflate()\
    \ plug-in, passing it myobject, with the required parameters to deflate it over\
    \ 500 milliseconds and without the possibility of the plug-in being interrupted.\
    \ However, there is a final argument, which is a call to Hide(), placed within\
    \ a string so that the string, not the result of executing the function, is passed.\n\
    \nYou will need to tweak the syntax slightly if you are passing object IDs rather\
    \ than objects within a callback, like:\n\n```\nDeflate('myobject', 1, 1, 500,\
    \ 0, \"Hide('myobject')\")\n```\n\nThis way, the double quotes are stripped off\
    \ by the eval() function that will eventually execute this callback string, the\
    \ string quotes will indicate that myobject is a string that is an object ID,\
    \ and not the name of an object.\n\nThis procedure is a quick and easy to create\
    \ a two-part chain without having to assemble a chain. Remember, however, that\
    \ it works only on plug-ins that can be inserted into a chain.\n\n# The Plug-ins\n\
    \n```\nfunction Chain(calls) {\n  for (var j = calls.length; j >= 0; --j)\n  \
    \  if (calls[j])\n      CHAIN_CALLS.push(calls[j])\n}\n```\n\n```\nfunction NextInChain()\
    \ {\n}\n```\n\n```\nif (CHAIN_CALLS.length)\n  CallBack(CHAIN_CALLS.pop())\n```\n\
    \n```\nfunction Callback(expr) {\n  var insert = expr.lastIndexOf(')')\n  var\
    \ left = expr.substr(0, insert)\n  var right = expr.substr(insert)\n  var middle\
    \ = \"NextInChain()\"\n}\n```\n\n```\nif (expr.substr(insert - 1, 1) != ' \\')\n\
    \  middle = ' ' + middle\neval(left + middle + right)\n```\n\n```\nfunction ChainThis(expr)\
    \ {\n  eval(expr)\n  NextInChain()\n}\n```"
