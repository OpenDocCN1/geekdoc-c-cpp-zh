- pgno: 27
  md: '# Chapter 1: Making the Best Use of These plug-ins


    main browsers. I know, it''s a pain, but it has to be done. Luckily, there''s
    a trick to make this easier than it might otherwise be.


    # Emulating Internet Explorers 6 and 7


    To developers who have designed websites to work specifically with older versions,
    the developers of Internet Explorer created a meta tab that you can add to the
    head of a web page IE think is an earlier version of itself. Here are the two
    main meta tags you will use:


    ```

    <meta http-equiv="UA-Compatible" content="IE7" />

    <meta http-equiv="UA-Compatible" content="IE5" />

    ```


    This is an example of how to incorporate the IE tag:


    ```

    <html>

    <head>

    <meta http-equiv="UA-Compatible" content="IE7" />

    <title>My Website</title>

    </head>

    <body>

    Website Contents

    </body>

    </html>

    ```


    There no IE=6 (presumably the rendering engines of IE5 and IE6 are so similar),
    using the IE=5 option makes Internet Explorer enter what is known as "”cquirks"
    mode, in which it behaves like both IE5 and IE6.


    Incidentally, if you force Internet Explorer into full standards (to be as compatible
    with other browsers) you can use the option IE=8. Without the meta tag, Internet
    Explorer will use its proprietary and optimal settings, known as "“edge mode",
    which you can also select with the option IE=edge. Of course, once you have finished
    testing, you should remove or comment out these meta tags unless you wish to use
    one for a particular reason.


    In addition to the meta tags, always ensure that you have a suitable HTML doctype
    declaration at the start of each document. The most commonly found doctype is
    the following, which has been fully tested and works with all of this book''s
    plug-ins.


    ```

    <!DOCTYPE HTML PUBLIC "//W3CDTD HTML 4.0 Transitional//EN"

    http://www.w3.org/TR/html4/loose.dtd">

    ```


    > Caution If you use a different doctype from the one listed, you may find you
    to slightly modify them. I often use both the preceding "loose" doctype and the
    IE meta tag to get the most compatible results with other browsers. Remember,
    if IE behaves strangely when all other browsers appear to work well with your
    code, the solution could be to change the doctype or IE5/IE meta tags. If you
    are interested in the subject of browser compatibility and its various nuances,
    I recommend visiting website at quirksmode.org.'
