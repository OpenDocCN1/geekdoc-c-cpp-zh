  md: "# Plug-In JavaScript: 100 Solutions\n\n# Variables, Arrays, and Functions\n\
    \n| e | The event passed to the function by browsers other than Internet Explorer.\
    \ Either e.charCode or e.keyCode contains the value of the key pressed. |\n| window.event\
    \ | Internet Explorer uses the window.event property instead of an event passed\
    \ as an argument. The keyCode contains the value of the key pressed. |\n| BROWSER\
    \ | Global variable used to determine the browser. |\n| KEY_PRESS | Global variable\
    \ to be assigned the value of the keypress. |\n| fromCharCode() | JavaScript function\
    \ to convert Unicode to characters. |\n| FromKeyCode() | Plugin to return the\
    \ value of a keypress or if it is one of many special characters such as 'Esc',\
    \ 'Home', and so on.\n\n# How It Works\n\nThis function works differently on whether\
    \ you are using Internet Explorer or not. If you are, it looks up the key in window.event.keyCode\
    \ and passes it through the FromCharCode(), which will assign a sign if the key\
    \ was a special key such as 'Up', 'Backspace', and so on. Then, if the value is\
    \ a simple number (that is, it hasn't been substituted for a special key), the\
    \ JavaScript fromCharCode() function converts it from its Unicode to an actual\
    \ value, so if, for example, the key is pressed, then the value 'e' is returned.\n\
    \nOn Non-Internet browsers, both e.charCode and e.keyCode are checked for a value\
    \ because the events document.onkeydown and document.onkeypress are captured by\
    \ this function. One function captures regular keys, while the other handles the\
    \ special keys already referred to, combining both into the same function makes\
    \ sense. So, if e.charCode has a value, it is passed through the JavaScript fromCharCode()\
    \ function to convert it to its Unicode. Or, if a special key was pressed, so\
    \ value is passed through the FromKeyCode() plug-in to look up the key name.\n\
    \nIn either case, the result is that KEY_PRESS will contain a letter, punctuation,\
    \ symbol, the name of a special key, or simply a number if it is one of the others.\
    \ There is no keyboard buffering to, for example, create strings of input, as\
    \ only the last key pressed is saved. However, it is quite possible to create\
    \ an input function using this if you need one.\n\nFinally, a value of true is\
    \ returned to allow further processing of the function by the browser.\n\n# How\
    \ To Use It\n\nUsing this plug is as simple as referencing the global variable,\
    \ KEY_PRESS, that it maintains. The following is a simple example that continuously\
    \ updates the contents of a div with the value of the key pressed:\n\n```\n<div\
    \ id='output'></div>\n\n<script>\nwindow.onload = function() {\n  setInterval(simpleInterrupt,\
    \ INTERVAL)\n```"
