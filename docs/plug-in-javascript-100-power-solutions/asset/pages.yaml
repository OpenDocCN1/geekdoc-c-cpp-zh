- pgno: 251
  md: "# 234 Plug-In JavaScript: 100 Power Solutions\n\nThe ContextUp() Subfunction\n\
    The purpose of this subsection is to react to a right-click event on id. The first\
    \ thing it does, though, is check whether it can go ahead by examining the state\
    \ of flags created by the Popup(), PopDown(), Fade(), Deflate(), and Relate()\
    \ plug-ins, like this:\n\n```\nif (O(contents).PO_Is ||\n    O(contents).FA_Flag\
    \ ||\n    O(contents).DF_Flag) return false\n```\n\nIf any of these flags are\
    \ true, then contents are popped up, or one of the transition types is already\
    \ active in contents, so the plug-in returns.\nIf the plug-in proceed, it sets\
    \ the local x and y to the current coordinates of the mouse cursor and moves the\
    \ popped down contents to that location with a call to Goto(). It calls Popup()\
    \ to pop it up, like this:\n\n```\nvar x = MOUSE_X\nvar y = MOUSE_Y\nGoto(contents,\
    \ x, y)\nPopup(contents, type, w, h, msecs, 1)\n```\n\nNext, it's necessary to\
    \ ensure that any objects that have been created or had their zIndex changed since\
    \ the contents div will not appear in front of it, so the object's zIndex property\
    \ is set to the value in ZINDEX plus one. ZINDEX is the global variable that tracks\
    \ the highest zIndex used by an object, adding 1 to this value ensures that contents\
    \ will appear on top of every other object in the browser. Here's the statement\
    \ that does:\n\n```\nS(contents) = ZINDEX + 1\n```\n\nThe plug-in needs a way\
    \ to determine whether the mouse has moved out of the area occupied by contents,\
    \ and therefore it needs to be popped down. You might think that attaching to\
    \ the mousemove event of contents would do the trick, but sadly, it won't do so\
    \ reliably and in all. The reason for this is if you include a form input or other\
    \ elements within contents, when the mouse passes over the browser it thinks it\
    \ has passed out of the contents object and prematurely trigger the mousemove\
    \ event.\nTherefore, it is necessary to track the position of the mouse and pop\
    \ the object down if it moves out of the object's bounds. To do this, a repeating\
    \ interrupt is created to call up the subsection ContextDown() every INTERVAL\
    \ milliseconds to see whether the mouse is still inside the object:\n\n```\nO(id).zIndex\
    \ = setInterval(ContextDown, INTERVAL)\n```\n\nFinally, the return statement returns\
    \ a value of false to tell the browser pulling up the standard right-click menu:\n\
    \n```\nreturn false\n```"
  merge: -1
