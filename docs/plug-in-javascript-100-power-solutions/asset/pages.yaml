    # How It Works


    This plug-in does a lot more than provide a shortened name for an existing function,
    because you can pass it the string ID of an object, or the object itself. For
    example, consider the following HTML div:


    ```

    <div id=''outerdiv''> ... </div>

    ```


    Using the O() plug-in you can access the div object directly with the following
    command:


    ```

    mydiv = O(''outerdiv'')

    ```


    This command is equivalent to the following, which sets the variable mydiv to
    represent the div object that has the ID of ''outerdiv'':


    ```

    mydiv = document.getElementById(''outerdiv'')

    ```


    This means you can, for example, use the value returned by this plug-in to change
    the HTML contents of the div (the text between its opening and closing tags) as
    follows, modifying its innerHTML property.


    ```

    mydiv.innerHTML = "<h1>A Heading</h1>"

    ```


    Or, you can assign the object to a variable and access the object directly by
    the O() plug-in, like this:


    ```

    O(''outerdiv'').innerHTML = ''<h1>A Heading</h1>''

    ```


    # Passing Either Strings or Objects


    The O() function is also versatile in that times you may have a variable containing
    a string name, like this:


    ```

    variable = ''outerdiv''

    ```


    On the other hand, it can represent the actual object itself, like this:


    ```

    variable = O(''outerdiv'')

    ```


    The former contains simply the string of characters comprising ''outerdiv'', while
    the latter is an object. Because the job of O() is to return the object referred
    to by the string'
