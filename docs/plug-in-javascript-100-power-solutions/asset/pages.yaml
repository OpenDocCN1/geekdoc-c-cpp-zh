    # How To Use It


    There are many ways you can use this plug-in. All need a single line of code to
    smoothly swap two objects, like the object1 and object2 by sliding them past each
    other over the course of 1000 milliseconds (1 second):


    ```

    SlideBetween(object1, object2, 1000, 0)

    ```


    The final argument of 0 specifies that the animation will not be interrupted and
    must proceed until it completes

    Here''s an example of how you could use this plug-in to create a simple but effective
    way to display photos:


