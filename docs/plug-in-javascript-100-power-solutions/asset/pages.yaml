  md: "# Chapter 6: Movement and Animation\n\n```\nfunction toggle() {\n  DeflateToggle('p1',\
    \ 1, 2000, 1)\n  DeflateToggle('p2', 1, 0, 2000, 1)\n  DeflateToggle('p3', 0,\
    \ 1, 2000, 1)\n}\n>\n```\n\nFor variety, a call to Deflate() just after those\
    \ to Locate() plug-in so that the second picture will start off deflated. Notice\
    \ that I passed a value of 1 millisecond for the call (the fastest allowed) so\
    \ that, for all intents and purposes, it is instant.\n\nTry moving your mouse\
    \ in and out of the Mouse Me and watch how the pictures toggle their deflated/inflated\
    \ states so do, smoothly changing between each animation type as soon as you move\
    \ the cursor in.\n\nTo become fully acquainted with what this plug-in can do for\
    \ you, you might want to change the animation length from 2000 milliseconds to\
    \ other values, change the interruptible argument to 0, change the animation types\
    \ by varying the w and h parameters, or use different images in locations.\n\n\
    > Remember that the second and third arguments (w and h), which specify the width\
    \ and/ height is to be the same for all defl, inflates, and toggles on an object\
    \ to correctly deflate and inflate. For example, if you deflate the width of an\
    \ object and then try to inflate just its height then nothing will happen since\
    \ the height has not been deflated. In this case only the object's width can be\
    \ inflated.\n\n# The Plug-in\n\n```\nfunction DeflateToggle(id, w, msecs, interruptible,\
    \ CB) {\n  if (id instanceof Array) {\n    for (var j = 0; j < id.length; ++j)\n\
    \    DeflateToggle(id[j], w, msecs, interruptible, CB)\n  }\n  return\n}\nif (id).Deflated)\
    \ Reflate(id, w, msecs, interruptible, CB)\nelelse\\  Deflate(id, w, msecs, interruptible,\
    \ CB)\n```\n\n# DeflateBetween()\n\nThis plug-in provides similar functionality\
    \ to the FadeBetween() plug-in, except that it resizes a pair of objects in a\
    \ choice of three different (height, width or width height), rather than simply\
    \ fading from one to the other. This plug-in is good for creating professional\
