- pgno: 372
  md: "# Chapter 12: Forms and Validation 355\n\nNext, each argument is processed\
    \ through the CleanupString() plug-in to ensure that they are in the formats required:\n\
    \n```\nnumber = CleanupString(number, true, false, true, true)\nmonth = CleanupString(month,\
    \ true, false, true, true)\nyear = CleanupString(year, true, false, true, true)\n\
    ```\n\nAfter this, the variable left is assigned the first 4 digits of number,\
    \ cclen is set to the card number's length, and checksum is initialized to 0:\n\
    \n```\nvar left = number.substr(0, 4)\nvar cclen = number.length\nvar checksum\
    \ = 0\n```\n\nNext, several if() else statements check that left contains a valid\
    \ sequence that matches a known brand of credit card, and if it does, the card\
    \ number length in cclen is correct for the card type. If left doesn't match a\
    \ known card, or it matches one but cclen is the wrong length, the plug-in returns\
    \ false to indicate that the card didn't verify.\n\nIf these tests are passed,\
    \ the card's checksum is calculated using an algorithm invented by IBM scientist\
    \ Peter Luh (for further details see en.wikipedia.org/wiki/Luhn_),\n\n```\nfor\
    \ (var j = 1 - (cclen % 2); j < cclen; j += 2)\n  if (j < cclen) checksum += number[j]\
    \ * 1\n\nfor (j = cclen % 2; j < cclen; j += 2)\n{\n  d = number[j] * 2\n  checksum\
    \ += d < 10 ? d : 9 - 9\n}\n```\n\n```\nif (checksum % 10 != 0) return false\n\
    ```\n\nFinally, the result is looked up and compared to the values supplied to\
    \ the plug-in, so even if this has validated the date, the plug-in will return\
    \ false if the card has expired:\n\n```\nvar date = new Date()\ndate.setTime(date.getTime())\n\
    if (year.length == 4) year = year.substr(2, 2)\n```\n\n```\nif (year > 50) return\
    \ false\nelse if (year < (date.getFullYear() - 2000)) return false\nelse if ((date.getMonth()\
    \ + 1) > month) return false\nelse return true\n```"
