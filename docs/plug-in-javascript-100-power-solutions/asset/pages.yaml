- pgno: 38
  md: '# Plug-In JavaScript: 100 Power Solutions


    The main way you add styling to a web page is similar to including JavaScript;
    you insert the required statements in the head of a web page between the <head>
    and </head> tags. To change the style of the <h1> tag you might use use of the
    following code:


    ```

    <style>

    h1 { color:red; font-size:3em; font-family:Arial }

    </style>

    ```


    Within an HTML page this might look like the following (see Figure 2-3):


    ```

    <html

    <head>

    <style>

    h1 { color:red; font-size:3em; font-family:Arial }

    </style>

    </head>

    <title>Hello World</title>

    <body>

    <h1>Hello there</h1>

    </body>

    </html>

    ```


    Or you can use one of the preferred methods of including a style sheet, which
    is particularly useful when you want to style a whole site, rather than a single
    page.

    The first way you can do this by using the CSS @import directive, in place of
    a sequence of style statements, like this:


    ```

    <style>

    @import url("/css/styles.css");

    </style>

    ```


    This statement tells the browser to fetch a style sheet with the name styles.css
    from the /css folder. The @import command is quite flexible that you can create
    style sheets that pull in other style sheets, and so on. Just make sure there
    are no <style> or </style> tags in any of your external style sheets or they will
    not work.


    ![](img/95e4c43b430487125c342550cc090977_38_0.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Chapter 2: JavaScript, CSS, and the DOM 19


    You can also include a style sheet using the HTML <link> tag, as follows:


    ```

    <link rel="stylesheet" type="text/css" href="css/styles.css" />

    ```


    This has the same exact effect as the @import directive, except that the <link>
    tag is not a valid style directive, and it cannot be used from within one style
    to pull in another—and, therefore, should not be placed within a <style>...<style>
    tags. Just as you can multiple @import directives within your CSS to include external
    style sheets, you can also use many <link> statements as you like in your HTML.


    There''s also nothing you from using external style sheets and overriding certain
    styles for the current page by inserting style sheets, either with <style>...</style>
    tags or directives within HTML, this (which results in italic blue text within
    the tags):


    ```

    <div style="font-style:italic; color:blue;">Hello</div>

    ```


    A better solution is to change the HTML by assigning a class value, as follows:


    ```

    <div class="blue">Hello</div>

    ```


    Then you can use the following style setting, either in the div, or in the page
    header or within an external style sheet referring to the class:


    ```

    .blue { font-style:italic; color:blue; }

    ```


    If course, you use another style inside the div, then any attributes that are
    the same will override those of the div styling. In the case of the <h1> tag that
    was started earlier, the font color of red that was assigned to <h1> will override
    the class setting of blue, but the .blue attribute of italic text will remain
    unaltered—resulting in the same Arial font "Hello" as Figure 2-3, except that
    it will be changed to italic.


    Properly explaining CSS would easily fill a large book, so these are the bare
    basics you need to know in order to understand what is going on in the plug-ins.
    If you are interested in learning more about the subjects of XHTML and CSS in
    depth, I recommend the book HTML & XHTML: The Complete Reference, by Thomas A.
    Powell (McGraw-Hill/Professional, 2003).


    # Accessing Styles in JavaScript


    Using JavaScript you can also change on the fly many of the styles you can define
    using CSS. This is possible because the CSS attributes are DOM object properties.
    For example, here''s how you use CSS to set an attribute for a particular ID:


    ```

    #under { text-decoration:underline; }

    ```


    Any text within the element that has an ID of under will now be underlined. This
    element can be accessed from JavaScript, so let''s change it to another decoration
    type with JavaScript statement:


    ```

    document.getElementById(''under'').style.decoration = ''line-through''

    ```'
