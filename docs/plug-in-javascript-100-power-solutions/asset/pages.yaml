    cursor |

    | MOUSE_DOWN | Global set to true when the mouse button is down |

    | MOUSE_IN | Global set to true when the mouse cursor is within the bounds of
    the browser |

    | SCROLL_X, SCROLL_Y | Global variables containing the number of pixels the document
    has been scrolled in the horizontal and vertical directions |

