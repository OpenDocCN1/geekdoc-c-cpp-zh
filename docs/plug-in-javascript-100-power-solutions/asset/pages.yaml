    \ Now you will need to call the plug-in, like this:\n\n```\nHoverSlideMenu(ids,\
    \ 'top', '%50', 20, 10, 200)\n```\n\nIn this example, the objects in the array\
    \ ids are passed to the plug-in, telling it to place the menus at the browser\
    \ top, 50 percent along the edge (therefore in the middle), with 20 pixels"
