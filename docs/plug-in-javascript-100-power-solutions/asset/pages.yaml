  md: '# 354 Plug-In JavaScript: 100 Power Solutions


    FIGURE 12-8

    Plug-In JavaScript: Example 95 - Windows Internet Explorer

    Checking whether credit card details match basic requirements


    ![](img/95e4c43b430487125c342550cc090977_371_0.png)


    About the Plug-in

    This plug in takes details about a credit card and returns true or false depending
    whether the card passes checksum and date verification. It requires the following
    arguments:


    +   - number A credit card number

    - month The card''s expiry month

    - year The card''s expiry year


    # Variables, Arrays, and Functions


    | left | Local variable containing the first 4 digits of number |

    | cclen | Local variable containing the number of digits in number |

    | chk | Local variable containing the card''s checksum |

    | date | Local date object |

    | substr() | Function to return a portion of a string |

    | getTime() | Function to get the current time and date |

    | getFullYear() | Function to get the year as a 4-digit number |

    | getMonth() | Function to get the month |


    How It Works

    This function ensures that all three parameters passed to it are strings by adding
    the empty string to them, like this:


    ```

    number += ''''

    month += ''''

    year += ''''

    ```'
