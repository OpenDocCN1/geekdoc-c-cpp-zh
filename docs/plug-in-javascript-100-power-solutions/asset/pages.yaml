- pgno: 155
  md: "# Plug-In JavaScript: 100 Solutions\n\n# ## Variables, Arrays, and Functions\n\
    \n| | |\n|---||\n| SL_Flag | Property of both id1 and id2—true if a slide is in\
    \ progress |\n| SL_Int | Property of both id1 and id2—true if a slide SB can be\
    \ interrupted |\n| t1 | Local temporary variable to store a copy of id1's SB_X\
    \ property |\n| t2 | Local temporary variable to store a copy of id1's SB_Y property\
    \ |\n| x1 | Local temporary variable to store a copy of id1's SB_X property |\n\
    | y1 | Local temporary variable to store a copy of id1's SB_Y property |\n| x2\
    \ | Local temporary variable to store a copy of id2's SB_X property |\n| y2 |\
    \ Local temporary variable to store a copy of id2's SB_Y property |\n| SB_X |\
    \ Property of both id1 and id2 containing their horizontal locations |\n| SB_Y\
    \ | Property of both id1 and id2 containing their vertical locations |\n\n# ##\
    \ How It Works\n\nThis plug-in first checks whether the objects passed to it is\
    \ currently being used in a slide animation by testing their SL_Flag properties.\
    \ If so, both objects have their SL_Int properties. If neither has a value of\
    \ true or 1, the slide may not be interrupted and the function returns. The code\
    \ to do this is as follows:\n\n```\nif (O(id1).SL_Flag || O(id2).SL_Flag)\n  if\
    \ (!O(id1).SL_Int || !O(id2).SL_Int)\n    return\n```\n\nIf the function is interruptible,\
    \ the locations of each object require swapping so that they can return to their\
    \ start locations. This behavior has been chosen because the details passed to\
    \ the plug-in are the object IDs. Therefore, if an interrupting call to SlideBetween()\
    \ is requested on an object, the only action it can take is to reverse the current\
    \ slide.\n\nTo do this, the temporary variables t1 and t2 are the current horizontal\
    \ and vertical locations of object. id1 is given the position of id2. Finally,\
    \ id2 is given the position stored in t1, using the following assignments:\n\n\
    ```\nvar t1 = O(id1).SB_X\nvar t2 = O(id1).SB_Y\nO(id1).SB_X = O(id2).SB_X\nO(id1).SB_Y\
    \ = O(id2).SB_Y\nO(id2).SB_X = t1\nO(id2).SB_Y = t2\n```\n\nIf a slide is not\
    \ currently in progress, copies are made of the current horizontal and vertical\
    \ locations of each object. These are created as new properties of object (rather\
    \ than local variables) so that interrupting calls (if allowed) have access to\
    \ them, as follows:\n\n```\nelse\n  O(id1).SB_X = X(id1)\n  O(id1).SB_Y = Y(id1)\n\
    ```"
