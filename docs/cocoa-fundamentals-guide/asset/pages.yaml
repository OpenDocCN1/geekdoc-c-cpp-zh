  md: '# Cocoa Design Patterns


    Many of the architectures and mechanisms of the Cocoa environment make effective
    use of design patterns: abstract designs that solve recurring problems in a particular
    context. This chapter describes the major implementations of design patterns in
    Cocoa, focusing on particular Model-View-Controller and object modeling. This
    chapter''s main purpose is to give you a greater awareness of design patterns
    in Cocoa and encourage you to take advantage of these patterns in your software
    projects.


    # What Is a Design Pattern?


    A design pattern is a template for a design that solves a general, recurring problem
    in a particular context. It is a tool of abstraction that is useful in fields
    like architecture and engineering as well as software development. The following
    sections summarize design patterns, explains why they''re important for object-oriented
    design, and looks at a sample design pattern.


    # A Solution to a Problem in a Context


    As a developer, you might already be familiar with the notion of design patterns
    in object-oriented programming. They were first authoritatively described and
    catalog in Design Patterns: Elements of Reusable Object-Oriented Software, by
    Erich Gamma, Richard Helm, Ralph Johnson, and John Vlissides (commonly referred
    to as the “Gang of Four”). That book, originally published in 1994, was soon followed
    by other books and articles that further explored and elaborated design patterns
    in object-oriented systems.


    The succinct definition of a design pattern is "a solution to a problem in context."
    Let''s parse this by working backward through the phrase. The context is a recurring
    situation in which the patterns apply. The problem is what you are trying to achieve
    in this context as well as any constraints that come with the context. The solution
    is what you''re after: a general design for the context that achieves the goal
    and resolves the constraints.


    A design pattern abstracts the key aspects of the structure of a concrete design
    that has to be effective over time. The design pattern has a name and identifies
    the classes and objects that participate in the pattern with their responsibilities
    and collaborations. A design pattern is a kind of template or guide for a particular
    design; in a sense, a concrete design is an "instance" of a pattern. There is
    some flexibility in how you can apply them, and things such as programming language
    and existing architectures can determine how the pattern is applied.


    Several themes or principles of design influence design patterns. These design
    principles are rules of thumb for constructing object-oriented systems, such as
    "encapsulate the aspects of system that vary" and "program to an interface, not
    an implementation.\ These express important insights. For example, if you isolate
    the parts of a system that vary, and encapsulate them, they can vary independently
    of other parts of the system, especially if you define interfaces for them that
    are not tied to implementation specifications. You'
