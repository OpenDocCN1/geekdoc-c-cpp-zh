    # MVC-View-Controller as a Compound Design Pattern


    Model-View-Controller is a design pattern that consists of several basic design
    patterns. These basic patterns work to define the functional separation and paths
    of communication that are characteristic of an MVC application. However, the traditional
    notion of MVC assigns a set of basic patterns different from those Cocoa assigns.
    The difference primarily lies in the roles given to the controller and views of
    an application.


    In the original (Smalltalk) conception, MVC is composed of Composite, Strategy,
    and Observer patterns.


    +   - Composite—The views in an application are actually a composite of nested
    views that work together in a coordinated fashion (that is, the view hierarchy).
    These display components range from a window to controls, such as a table, to
    individual views, as buttons. User input and display can take place at any level
    of the composite structure.


    +   - Strategy—A controller implements the strategy for one or more views. The
    view object confines itself to maintaining its visual aspects, and it delegates
    to the controller all decisions about the application-specific meaning of the
    interface behavior.


    +   - Observer—A model object keeps interested objects in an application—usually
    views—advised of changes in its state.


    The traditional way Composite, Strategy, and Observer patterns work together is
    by Figure 4-6: The user manipulates a view at some level of the composite structure
    and, as a result, an event is generated. A controller object receives the event
    and interprets it in an application-specific way—that is, it applies a strategy.
    This strategy can be be to request (via message) a model object to change its
    state or to request a view


