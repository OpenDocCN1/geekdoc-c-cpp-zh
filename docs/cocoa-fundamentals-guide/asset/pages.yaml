    # **Key Paths**


    **A key path** is a string of dot-segmented keys that specify a sequence of object
    properties to traverse. The property of the first key is determined by, and each
    subsequent key is evaluated relative to, the previous property. Key paths allow
    you to specify the properties of related objects in a way that is independent
    of the model implementation. Using key paths you can specify the path through
    an object graph, of whatever depth, to a specific attribute of a related object.


    The key-value coding mechanism implements the lookup of a value given a key path
    similar to key-value pairs. For example, in the employee-management application
    you might access the name of a Department via an Employee object using the `department.name`
    key path where `department` is a relationship of Employee and `name` is an attribute
    of Department. Key paths are useful if you want to display an attribute of a destination
    entity. For example, the table view in Figure 4-14 is configured to display the
    name of the employee''s department object, not the department object itself. Using
    Cocoa bindings, the value of the Department column is bound to `department.name`
    of the Employee objects in the displayed array.'
