    The implementation of bindings rests on the enabling mechanisms of key-value coding,
    key-value observing, and key-value binding. "Key-Value Mechanisms" (page 128)
    for overviews of these mechanisms and their associated informal protocols. The
    discussion of the Observer pattern in "Observer" (page 153) also describes key-value
    observing.


    You can establish a binding between any two objects. The only requirement is that
    the objects comply with the conventions of key-value coding and key-value observing.
    However, you generally want to establish the binding through a mediating controller
    because such controller objects offer-related services such as selection management,
    placeholder values, and the ability to commit or discard pending changes. Mediating
    controllers are instances of NSController subclasses; they are available in the
    Objects & Controllers section of the Interface Builder (see "How You Establish
    Bindings" (page 188)). You can also create custom mediating-classes to acquire
    more specified behavior.


    > Further Reading: To learn more about the design patterns summarized above (including
    a discussion of mediating controllers and NSController objects), see "The Model-View-Controller
    Design Pattern" (page 160), "Object Modeling" (page 167), and "Mediator" (page
    148).


    # How You Establish Bindings


    If the custom classes of your application are model classes, the only requirement
    for establishing bindings is that those classes be compliant with key-value coding
    conventions for any properties you want to bind. If you are using a custom view
    or custom controller, you should also ensure that it is compliant with key-value
    observing. See "Key-Value Mechanisms" (page 128) for a summary of the requirements
    for compliance with both key-value coding and key-value observing.


