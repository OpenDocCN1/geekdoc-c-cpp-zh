  md: '# CHAPTER 5


    Communicating with Objects


    Figure 5-7 A notification queue and notification center


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_194_0.png)


    # Coalescing Notifications


    The NotificationQueue class introduces two important features to the Foundation
    framework''s notification mechanism: the coalescing of notifications and asynchronous
    posting. Coalescing is a process that removes notifications in the queue that
    are similar to the notification just queued. If the new item is similar to a notification
    already queued, the new one isn''t queued and all notifications (except the first
    in the queue) are removed. However, you should not depend on this particular coalescing
    behavior.


    You indicate the criteria for similarity in notifications by specifying one or
    more of the following constants in the third parameter of the enqueueNotification:postingStyle:coalesceMask:forModes:
    method.


    ```

    NSNotificationNoCoalescing

    NSNotificationCoalescingName

    NSNotificationCoalescingOnSender

    ```


    You can perform a bitwise-OR operation with the NSNotificationCoalescingOnName
    and NSNotificationCoalescingOnSender to specify coalescing using both the notification
    name and notification object. In this case, all notifications having the same
    name and sender as the one enqueued are coalesced.


    # Asynchronously Posting Notifications


    With the NotificationCenter method postNotification:and its variants, you can
    post a notification immediately to a notification center. However, the invocation
    of the method is synchronous: Before the posting object can return its thread
    of execution, it must wait until the notification center dispatches the notification
    to all observers and returns. With the NotificationQueue methods enqueueNotification:postingStyle:
    and enqueueNotification:postingStyle:coalesceMask:forModes:, however, you can
    post a notification asynchronously by putting it in a queue. These methods immediately
    return to the invoking object after putting the notification in the queue.


