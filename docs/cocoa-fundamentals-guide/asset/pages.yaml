    # Interface Builder


    The second major development application for Cocoa is Interface Builder. As its
    name suggests, Interface Builder is a graphical tool for creating user interfaces.
    Interface Builder has been around almost since the inception of Cocoa as NEXTSTEP.
    Surprisingly, its integration with Cocoa is airtight.


    Interface Builder is centered around four design elements:


    +   **Nib files.** A nib file is a file wrapper (an opaque directory) that contains
    the objects in an archived format. Essentially, it is an object graph that contains
    information about each object, including its size and location, about the connections
    between objects, and about references for custom classes. When you create and
    save a user interface in Interface Builder, all information necessary to re-create
    the interface is stored in the nib file.


    Nib files offer a way to localize user interfaces. Interface Builder stores a
    nib file in a localized directory inside a Cocoa project; when that project is
    built, the nib file is copied to a localized directory in the created bundle.


    Interface Builder presents the contents of a nib file in a document window (also
    called a *nib file document*). The document window gives you access to the important
    objects in a nib file, especially top-level objects such as windows, menus, and
    controller objects that have no parent in their object graph (Controller objects
    mediate between user-interface objects and the model objects that represent application
    data); they provide overall management for an application.)


