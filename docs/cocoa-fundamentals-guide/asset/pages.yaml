    # Chain of Responsibility


    The Chain of Responsibility design pattern decouples the sender of a request from
    its receiver by giving more than one object to handle the request. The pattern
    chains the receiving objects together and passes the request along the chain until
    an object handles it. Each object in the chain either handles the request or passes
    it to the next object in the chain.


    # Responder Chain


    The application frameworks use an architecture known as the responder chain. This
    chain consists of a series of responder objects (that, inheriting from `Responder`
    or, in UIKit, `Responder`) along which an event (for example, a mouse click) or
    action message is passed and (usually) eventually handled. If a responder object
    doesn''t handle a message, it passes the message to the next responder in the
    chain. The order of responder objects in the chain is generally determined by
    the view hierarchy, with the progression from lower-level to higher-level responders
    in the hierarchy, culminating in the view object that manages the view hierarchy,
    the delegate of the view, or the global application object. The paths of event
    and action messages up the responder chain differ. An application can have many
    responder chains as it has windows (or local hierarchies of views); but only one
    responder chain can be active—the one with the currently active window.


    The AppKit framework implements a similar chain for handling error.


    > **IOS Note:** UIKit implements the responder chain differently than AppKit.
    If a view is managed by a `UIViewController` object, the view becomes the next
    responder in the chain (and from there an event or action message passes to the
    view''s superview). In addition, UIKit does not support a document architecture
    per; therefore there are no document objects or window-controllers in the responder
