    # Multithreaded Cocoa Programs


    It has long been a standard programming technique to optimize program performance
    through multithreading. By having data processing and I/O operations run on their
    own secondary threads and dedicating the main thread to user-interface management,
    you can enhance the responsiveness of your applications. In recent years, multithreading
    has assumed even greater importance with the emergence of multicore processors
    and symmetric multiprocessing (SMP). Concurrent processing on such systems synchronizing
    the execution of only one thread on the same processor but multiple threads on
    multiple processors.


    But making your program multithreaded is not without risk or costs. Although threads
    share the virtual address space of process, they add to the memory footprint;
    each thread requires an additional data structure, associated attributes and its
    own stack. Multithreading also requires greater complexity of program design to
    synchronize access to shared memory among multiple threads. Such designs make
    a program harder to maintain and debug. Moreover, multithreading designs that
    use locks can actually degrade performance (relative to a single-threaded program)
    for shared resources. Designing a program for multithreading often involves tradeoffs
    between performance and protection which require careful consideration of your
    data structures and the intended usage pattern for extra threads. Indeed, in some
    situations the best approach is to avoid multithreading altogether and keep all
    program execution on the main thread.


    > **Further Reading:** To get a solid understanding of issues and guidelines related
    to multithreading, read Multithreading Programming Guide.


    # Multithreading and Multiprocessing Resources


    Cocoa provides several classes that are useful for multithreading programs.


    # Threads and Run Loops


    In Cocoa threads are represented by objects of the `Thread` class. The implementation
    of the class is based on POSIX threads. `Thread` does not provide any options
    for thread management as POSIX threads, it is sufficient for most multithreading
    needs.


    Run loops are a key component of the architecture for the distribution of events.
    Run loops have input sources (typically ports or sockets) and timers; they also
    have modes for specifying which input sources the run loop listens to. Objects
    of the `NSRunLoop` class represent run loops in Cocoa. Each thread has its own
    run loop, and the run loop of the main thread is set up and runs automatically
    when a process begins execution. Secondary threads, however, must run their own
    run loops.


    # Operations and Operation Queues


    With the `NSOperation` and `NSOperationQueue` classes, you can manage the execution
    of one or more encapsulated tasks that may be concurrent or nonconcurrent. (Note
    that the word task here does not necessarily imply an `NST` object; a task, or
    operation, typically runs on a secondary thread'
