    # Observer


    The Observer design pattern defines a one-to-many dependency between objects so
    that when one object

    changes state, all its dependents are notified and updated automatically. The
    Observer pattern is essentially

    publish-and-subscribe model where the subject and its observers are loosely coupled.
    Communication

    can take place between the observer and observed objects without needing to know
    much about

    the other.


    # Notifications


    The notification mechanism of Cocoa implements one-to-many broadcast of messages
    by the Observer

    pattern. Objects in a program add themselves or other objects to a list of one
    or more notifications,

    each of which is identified by a global string (the notification name). The object
    that wants to notify

    other object—creates a notification and posts it to a notification center. The

    notification center determines the observers of a particular and sends the notification
    to them

    ia a message. The methods invoked by the notification center must conform to a
    single-parameter

    signature. The pattern of the method is the notification object, which contains
    the notification name, the

    observed object, and a dictionary containing any supplemental information.


    Posting a notification is a synchronous process. The posting object doesn''t regain
    control until the

    notification center has broadcast to all observers. For any asynchronous behavior,
    you can put

    t notification in a notification queue; control returns immediately to the posting
    object and the notification

    center broadcasts when it reaches the top of the queue.


    Regular notifications—that is, broadcast by the notification center—are intraprocess.
    If you want

    broadcast to across processes, use the distributed notification center and its
    related

    API.


    # Uses and Limitations


    You can use notifications for a variety of reasons. For example, you could broadcast
    a notification to change

    user-interface elements display information based on a center event else in the
    program. Or you

    could use notifications as a way to ensure that objects in a document save their
    state before the document

    window is closed. The general purpose of notifications is to inform other objects
    of program events so they

    respond appropriately.


    But receiving notifications react react after the event has occurred. This is
    a significant difference

    from delegation. delegation is given a chance to reject or modify the operation
    proposed by the delegating

    object. Observing objects, on the other hand, cannot directly affect an impending
    operation.


    The notification classes are NSNotification (for notification objects), NSNotificationCenter
    (to post

    notifications and add observers), NSNotificationQueue (to enqueue notifications),
    and

    NSistributedNotificationCenter. Many Cocoa frameworks publish and post notifications
    by the delegating

    yany object can observe.'
