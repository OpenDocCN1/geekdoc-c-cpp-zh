    # Figure 2-9 Interactions of secondary and designated initializers


    # Class A


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_83_0.png)


    The designated initializer for each class is the initializer with the most coverage;
    it is the method that initializes the attribute added by the subclass. The designated
    initializer is also the `init...` method that invokes the designated initializer
    of the superclass in a message to `super`. In this example, the designated initializer
    of class C, `initWithTitle:`, invokes the designated initializer of its superclass,
    `initWithTitle::`, which invokes the `init` method of class A. When creating a
    subclass, it''s always important to know the designated initializer.


    Although designated initializers are thus connected up the inheritance chain through
    messages to `super`, secondary initializers are connected to their class''s designated
    initializer through messages to `self`. Secondary initializers (as in this) are
    frequently overridden versions of inherited initializers. Class C overrides `initWithTitle:`
    to invoke its designated initializer, passing a default date. This designated
    initializer, in turn, invokes the designated initializer of class B, which is
    the overridden method, in if you sent an `initWithTitle:` message to objects of
    class B and C. On the other hand, if class C did not override `initWithTitle:`
    and you send the message to an instance of class C, the class B implementation
    would be invoked. Consequently, the instance would be completely initialized (since
    it would lack a date). When creating a subclass, it''s important to make sure
    all inherited initializers are adequately covered.


    Sometimes the designated initializer of a superclass may be sufficient for the
    subclass, and there is no need for the subclass to implement its own designated
    initializer. Other times, a class''s designated initializer may be an overridden
    version of its superclass''s designated initializer. This is frequently the case
    when the subclass needs to supplement the work performed by the superclass''s
    designated initializer, even though the subclass does not add any instance variables
    of its own (or the instance variables it doesn''t require explicit initialization).


