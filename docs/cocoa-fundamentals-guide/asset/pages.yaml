    # Adding Behavior to a Cocoa Program


    Typically, one of the core objects has the responsibility for overseeing the program
    or controlling its input. When the code structure is ready, main sets this overseer
    to work. If the program is a command-line tool or a background server, what this
    entails might be as simple as command-line parameters or opening a remote connection.
    For the most common type of Cocoa program, what happens is a bit more involved.


    For an application, the core group of objects that must include such objects that
    draw the user interface, or at least part of it (such as an application''s menu),
    must appear on the screen when the user launches the application. If the visual
    user interface is on screen, the application is driven by external events, the
    most important of which are initiated by users: clicking a button, choosing a
    menu item, drawing an icon, typing something in a field, and so on. Each such
    event action—reported to the application with a good deal of information about
    the circumstances of the action—for example, which key was pressed, whether the
    mouse button was pressed or released, where the cursor was located, and window
    was accessed.


    An application gets an event, it looks at it, and responds to it—often by drawing
    a part of the user interface—then waits for the next event. It keeps events, one
    after another, as long as the user or some source (such as a timer) launches them.
    From the time it is launched until the time it terminates, almost everything the
    application is driven by user actions in the form of events.


    The mechanism for getting and responding to events is the main loop (called main
    because an application can set up subordinate loops for brief periods). An event
    loop is essentially a run loop with one or more input sources attached to it.
    The object in the core group is responsible for running the main loop—getting
    an event, dispatching the event to the object or objects that can handle it, and
    then getting the next. In a Cocoa application, this coordinating object is the
    global application object. In Mac OS X, this is an instance of NSApplication,
    and in iOS, it is an instance of UIApplication.


    Figure 3-1 The main event loop for Cocoa applications in Mac OS X


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_107_0.png)


    The main function in almost all Cocoa applications is extremely simple. In Mac
    OS X, it consists of only one call (see List 3-1). The NSApplicationMain function
    creates the application object, sets up an autorelease pool, loads the initial
    user interface from the main file, and runs the application, requesting it to
    begin handling events received on the main loop.


    +   Listing 3-1 The main function for a Cocoa application in Mac OS X


