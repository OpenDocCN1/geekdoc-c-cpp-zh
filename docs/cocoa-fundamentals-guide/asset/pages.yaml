  md: '# Bindings (Mac OS X)


    Bindings are a Cocoa technology that you can use to synchronize the display and
    storage of data in a Cocoa application created for Mac OS X. The technology is
    an adaptation of both the Model-View-Controller and object modeling design patterns.
    ("The Model-View-Controller Design Pattern")(page 160) introduced bindings in
    his discussion of controller objects.) It allows you to establish a mediated connection—a
    binding—between the attribute of a view that displays a value and a model-property
    that stores values; when a change occurs in one side of the connection, it is
    automatically reflected in the other. The controller object mediates the connection
    provides additional support, including selection management, placeholder values,
    and sortable tables.


    # How Bindings Work


    Bindings arise from the conceptual space defined by the Model-View-Controller
    (MVC) and object modeling design patterns. An MVC application assigns objects
    general roles and maintains separation between objects based on these rules. You
    can view objects, model objects, or controllers whose roles can be briefly stated
    as:


    +   - View objects display the data of the application.

    - Model objects encapsulate and operate on application data. They are typically
    the persistent objects that your users create and save while an application is
    running.

    - Controller objects manage the exchange of data between view and model objects
    and also perform command-and-control services for the application.


    All objects, but most importantly model objects, have defining components or characteristics
    called properties. Properties can be of two sorts: attributes—values as strings,
    scalars, and data structures—and relationships to other objects. Relationships
    can be of two sorts: one-to-one and one-to-many. They can also be bidirectional
    and reflexive. The objects of an application have various relationships with each
    other, and this web of objects is called an object graph. A graph has an identifying
    name called a key. Using such keys—period sequences of keys—one can traverse the
    relationships in an graph to access the attributes of related objects.


    The binding technology uses of an object graph to establish bindings among the
    view, model, and controller objects of an application. With bindings you can extend
    the web of relationships between the object graph of model objects of an application.
    You can establish a binding between an attribute of a view and a property of a
    model (typically by mediating a proxy of a controller object). Any change in the
    attributed value is automatically propagated through the binding to the property
    where the value is stored. And any internal change in the value of the property
    is communicated back to the view for display.


    For example, Figure 5-4 shows a simplified set of bindings between the displayed
    values of a slider and a text field (attributes of those objects) and the number
    attribute of a model object (MyObject) the content property of a controller object.
    With these bindings, established, if a user moves the slider, the change in value
    is applied to the number and communicated back to the text field for display.'
  merge: -1
