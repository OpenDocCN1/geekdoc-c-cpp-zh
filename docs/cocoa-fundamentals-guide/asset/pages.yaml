  md: '# CHAPTER 4

    Cocoa Design Patterns


    # Overridden Framework Methods


    The Template Method pattern is a functional design of Cocoa, and indeed of object-oriented
    frameworks in general. The pattern in Cocoa lets custom components of a program
    hook themselves into an algorithm, but the framework components determine when
    and how they are needed. The programmatic interfaces of Cocoa often include methods
    that are to be overridden by subclasses. At runtime, the framework invokes these
    overloads at certain points in the task it is carrying out. The generic methods
    provide a structure for custom class to contribute program-specific behavior and
    data to the task being executed and coordinated by framework classes.


    # Uses and Limitations


    To make use of the Cocoa adaptation of the Template pattern, you must create a
    subclass and override those methods that the framework inserts application-specific
    code into the algorithm it is executing. If you are writing your own framework,
    you should probably include the pattern in your design.


    > Note: "Adding Behavior to a Cocoa Program" (page 107) discusses the Cocoa adaptation
    of the Template Method pattern, especially in "Inheriting from a Cocoa Class"
    (page 112).


    # The Document Architecture in Mac OS X


    The document architecture defined by the AppKit is a particular—and important—instance
    of the general design of overridden framework methods as an adaptation of the
    Template Method. Cocoa applications that create and manage multiple documents,
    each in its window, are always based on the document architecture. In this architecture
    are cooperating objects of three framework classes: NSDocument, NSWindowController,
    and NSDocumentController. NSDocument objects manage the model objects that represent
    the data of a document; upon user requests, they request that data load and reload
    the data, recreating the model objects with it. NSWindowController objects manage
    the user interface of particular documents. The NSDocumentController object of
    a document-based application tracks and manages all open documents and oversees
    the activities of the application. At runtime, each of these objects receives
    messages from AppKit requesting it to perform specific operations. The application
    developer must override many of the methods invoked by these messages to add application-specific
    behavior.


    The design of the document architecture of Cocoa is also heavily influenced by
    the Model-View-Controller pattern.


    # Uses and Limitations


    You can create a project for a document-based Cocoa Application by choosing the
    Cocoa Document-based Application template from the New Project dialog in Xcode.
    Then you must implement a custom subclass of NSDocument and may choose to implement
    custom subclasses of NSWindowController and NSDocumentController. The AppKit framework
    provides much of the document-management logic of the application for you.


    How Cocoa Adapts Design Patterns

