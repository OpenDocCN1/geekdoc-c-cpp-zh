  md: "# Issues with Initializers\n\nAlthough `init...` are required by their method\
    \ signature to return an object, that object is not necessarily the one that was\
    \ most recently allocated—the receiver of the `init...` message. In other words,\
    \ the object you get back from an initializer might not be the one you were initializing.\n\
    \nTwo conditions prompt the return of something other than the unallocated object.\
    \ The first involves two related situations: when there must be a singleton instance\
    \ or when defining the attribute of an object might be unique. Cocoa classes—`Workspace`,\
    \ for instance—allow only one instance in a program; if in such a case must exist\
    \ (in an initializer or, more likely, in a class method) that only one instance\
    \ is created, returning this instance if there is any further request for a new\
    \ one.(see \"Creating a Singleton Instance\" (page 104) for implementing a singleton.)\n\
    \nA similarity arises when an object is required to have an attribute that makes\
    \ it unique. Recall the hypothetical `Account` class mentioned earlier. An account\
    \ of any sort must have a unique identifier. For this class—say, `initWithAccount:`—is\
    \ passed an identifier that has already been associated with an object, it must\
    \ do two:\n\n+   - Release the allocated object (in memory-managed code)\n- Return\
    \ the Account object previously initialized with this unique identifier\n\nBy\
    \ doing this, the initializer ensures the uniqueness of the identifier while providing\
    \ what was asked for: an `Account` instance with the requested identifier.\n\n\
    Sometimes an `init...` method cannot perform the requested initialization. For\
    \ example, an `initFromFile:` the path to which is passed as a parameter. If no\
    \ file exists at that path, the object cannot be initialized. A similar problem\
    \ happens if an `initWithArray:` is passed an `NSDictionary` object instead of\
    \ an `NSArray` object. When an `init...` method cannot initialize an object, it\
    \ should:\n\n+   - Release the newly allocated object (in memory-managed code)\n\
    - Return nil\n\nReturning `nil` from an initializer indicates the requested object\
    \ cannot be created. When you create an object, you should generally check whether\
    \ the returned value is `nil` before proceeding:\n\n```\nid anObject = [[My alloc]\
    \ init];\nif (anObject) {\n    [anObject doSomething];\n    // more messages...\n\
    } else {\n    // handle error\n}\n```\n\nBecause an `init...` method might return\
    \ `nil` or an object other than the one explicitly allocated, it is dangerous\
    \ to use the instance returned by `alloc` or `allocWithZone:` instead of the one\
    \ returned by the initializer. Consider the following code:\n\n```\nid myObject\
    \ = [[Class alloc];\n[myObject init];\n[myObject doSomething];\n```"
