    # The iOS Simulator Application


    For iOS projects, you can select Simulator as the platform SDK for the project.
    When you build and run, Xcode runs Simulator, which presents your application
    as it would appear on the device (iPhone or iPad) and allows you to manipulate
    parts of the user interface. You can use Simulator to help debug the application
    prior to loading onto the device.


    You should always perform the final phase of debugging the device. Simulator does
    not perfectly simulate the device; for example you use the mouse pointer instead
    of finger touches, and manipulations of the interface requiring multiple fingers
    are not possible. In addition, Simulator does not use versions of the OpenGL framework
    that are specific to iOS, and it uses the Mac OS X versions of the Framework,
    Core Foundation, and CFNetwork frameworks, as well as the Mac OS X version of
    LibSimulator.


    More importantly, you should not assume that the performance of your application
    on Simulator is the same as it would be. Simulator is essentially running your
    iOS application as a “guest” Mac OS X application. As such, it has a 4 GB memory
    partition and swap space available to as it runs on a processor that is more powerful
    than the one you device.'
