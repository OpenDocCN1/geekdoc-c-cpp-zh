    \ and its outlets are reestablished every time the object is unarchived from its\
    \ nib file. The containing object holds an outlet as an instance variable with\
    \ the type qualifier of IBOutlet. For example:\n\n```\n@interface ViewController\
    \ : NSObject\n  IBOutlet NSArray *keywords;\n\n\n```"
