  md: '# CHAPTER 4

    Cocoa Design Patterns


    Figure 4-3 Framework object sending a message to the delegate


    | Framework object | |

    | Task | Delegate |

    | :--- | :--- |

    | Step 1 | |

    | Step 2 | object:willDoStep3: |

    | Step 3 | |

    | Step 4 | |

    | Step 5 | |


    Delegation, in the simple sense of one delegating a task to another object, is
    a common technique in object-oriented programming. However, Cocoa implements delegation
    in a unique way. A host class uses a formal or an informal protocol to define
    what the delegate may choose to implement. All the methods in the informal protocol
    are optional, and the formal protocol may declare options, allowing the delegate
    to implement only some of the methods in the protocol. Before it attempts to send
    a message to its delegate, the host determines whether it implements the method
    (via a respondsToSelector message) to avoid runtime exceptions. For more formal
    and informal protocols, see "Protocols" (page 140).


    Some classes in the Cocoa frameworks also send messages to their data sources.
    A data source is identical in all respects to a delegate, yet the intent is to
    provide the host object with data to populate a browser, a table view, or similar
    user-interface. A data source, unlike a delegate, may also be required to implement
    some methods of the protocol.


    Delegation is not a strict implementation of the Decorator pattern. The (delegating)
    object does not wrap an instance of the class it wants to extend; instead, it
    may be a delegate around, in that the delegate is specializing the behavior of
    the delegating framework class. There is no sharing of interface either, other
    than the methods declared by the framework class.


    Delegation in Cocoa is also part of the Template Method pattern ("Template Method"
    (page 158).


    # Uses and Limitations


    Delegation is a common design in the Cocoa frameworks. Many classes in the AppKit
    and UIKit frameworks send messages to delegates, including NSObject, UIApplication,
    UITableView, and several subclasses of NS. Some classes in the Foundation framework,
    such as NSParser and NSStream, also maintain delegates. You should always use
    a class''s delegate mechanism instead of subclassing the class, unless the delegate
    does not allow you to accomplish your goal.


    Although you can dynamically delegate, the only object can be informed of a particular
    event at the same time, you cannot use multiple objects. However, you can use
    the notification mechanism for this purpose. A delegate automatically receives
    notifications from its delegating framework object as long as the delegate implements
    one or more of the notification methods declared by the framework class. See the
    discussion of notifications in the Observer pattern ("Observer" (page 153).


    Delegating objects in AppKit do not retain their delegates or data sources. See
    "Ownership of Delegates, Observers, and Targets" (page 196) for further information.'
  merge: -1
