    for more information on the Cocoa internationalization facilities.


    The NSIServer and NSInputManager classes, along with the NSText protocol, give
    your application access to the text management system. This system interprets
    keystrokes generated by various international keyboards and delivers the appropriate
    text characters or Control-key events to view objects. (Typically the text classes
    deal with these and you won''t have to.)


    # Operating-System Services


    The AppKit provides operating-system service for your application classes that
    implement the following features:


    +   - **Sharing data with other applications.** The NSPasteboard class defines
    the pasteboard, a repository for data that''s copied from your application, making
    this data available to any application that cares to use it. NSPasteboard implements
    the free cut/copy-paste operation.

    - **Dragging.** With very little programming on your part, custom views can be
    dragged and dropped anywhere. Objects become part of this dragging mechanism by
    conforming to NSDragging... protocols; draggable objects conform to the NSDraggingSource
    protocol, and destination objects (receivers of a drop) conform to the NSDraggingDestination
    protocol. The AppKit holds all the details of tracking the cursor and displaying
    the dragged image.

    - **Spell Checking.** The SpellServer defines a spell-checking service and provides
    it as a service to other applications. To connect your application to a spell-checking
    service, you use the NSSpellChecker class. The NSIgnoreMiselledWords and NSChangeSpelling
    protocols support the spell-checking mechanism.


