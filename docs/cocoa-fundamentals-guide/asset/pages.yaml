- pgno: 97
  md: 'In summary, if you need to manage your object’s storage, create a true subclass.
    Otherwise, create a composite object, one that embeds a standard Foundation framework
    object in an object of your own design. The following sections give more detail
    on these two approaches.


    # A True Subclass


    A new class that you create within a class cluster must:


    +   - Be a subclass of the cluster’s abstract superclass

    - Declare its own storage

    - Override all initializer methods of the superclass

    - Override the superclass’s primitive methods (described below)


    Because the cluster’s abstract superclass is the only publicly visible node in
    the cluster’s hierarchy, the first point is obvious. This implies that the new
    subclass will inherit the cluster’s interface but no instance variables, because
    the abstract superclass declares none. Thus the second point: The subclass must
    declare any instance variables it needs. Finally, the subclass must override any
    method it inherits that directly accesses an object’s instance variables. Such
    methods are called *primitive methods*.


    A class’s primitive methods form the basis for its interface. For example, take
    the `NSArray` class, which declares the interface to objects that manage arrays
    of objects. In concept, an array stores a number of data items, each of which
    is accessible by index. `NSArray` expresses this abstract notion through its two
    primitive methods, `count` and `objectAtIndex:`. With these methods as a base,
    other methods—*derived methods*—can be implemented; Table 2-4 gives two examples
    of derived methods.


    Table 2-4 Derived methods and their possible implementations


    | Derived Method | Possible Implementation |

    |---|---|

    | `lastObject` | Find the last object by sending the array object this message:
    `[self objectAtIndex: ([self count] -1)].` |

    | `containsObject:` | Find an object by repeatedly sending the array object an
    `objectAtIndex:` message, each time incrementing the index until all objects in
    the array have been tested. |


    The division of an interface between primitive and derived methods makes creating
    subclasses easier. Your subclass must override inherited primitives, but having
    done so can be sure that all derived methods that it inherits will operate properly.


    The primitive-derived distinction applies to the interface of a fully initialized
    object. The question of how `init...` methods should be handled in a subclass
    also needs to be addressed.


    In general, a cluster’s abstract superclass declares a number of `init...` and
    `+ className` methods. As described in “Creating Instances” (page 96), the abstract
    class decides which concrete subclass to instantiate based your choice of `init...`
