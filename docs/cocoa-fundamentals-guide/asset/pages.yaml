    # Multithreading Guidelines for Cocoa Programs


    Whether your program uses the Cocoa frameworks or something else, there are some
    common observations that can be made about the appropriateness and wisdom of having
    multiple threads in your program. You might start by asking yourself the following
    questions; if you answer "yes" to any of them, you should consider multithreading:


    +   - Is there a CPU- or I/O-intensive task that could block your application''s
    user interface?

    The main thread manages an application''s user interface—the part of the Model-View-Controller
    pattern. Then the application can perform work that involves the data model on
    one or more secondary threads. In a Cocoa application, controller objects are
    directly involved in the management of the user interface, you would run them
    on the main thread.

    - Does your program have multiple sources of input or multiple outputs, and is
    it feasible to handle them simultaneously?

    - Do you want to spread the work your program performs across multiple cores?


    Let''s say these situations apply to your application. As noted earlier, multithreading
    can involve costs and risks as well as benefits, so it''s worthwhile to consider
    alternatives to multithreading. For example, you might try asynchronous processing.

    Just as there are situations that are appropriate for multithreading, there are
    situations where it''s not:


    +   - The work requires little processing time.

    - The work requires steps that must be performed serially.

    - Underlying subsystems are not thread safe.


    The last item brings up the important issue of thread safety. There are some guidelines
    you should observe to ensure—as much as possible—that your multithreaded code
    is thread safe. Some of these guidelines are general and others specific to Cocoa
    programs. The general guidelines are as follows:


    +   - Avoid sharing data structures across threads if possible.

    Instead you can give each thread its own copy of it (or other data) and then synchronize
    changes using a transaction-based model. Ideally you want to minimize resource
    contention as much as possible.

    - Lock data at the right level.

    - Catch local exceptions in your thread.


