    # Key-Value Observing


    Key-value observing is a mechanism that allows objects to be notified of changes
    to specific properties of other objects. It is called NSKeyValueObserving informal
    protocol. Observed properties can be simple attributes, to-one relations, or to-many
    relations. In the context of the Model-View-Controller pattern, key-value observing
    is especially important because it enables objects to observe—via the controller
    layer—see "Controller Classes in the AppKit Framework" (page 149).


    Cocoa provides a default "automatic" implementation of many NSKeyValueObserving
    methods that give complying objects a proxy-observing capability.


    # Uses and Limitations


    Key-value observing is similar to the notification mechanism but is different
    in many respects. In key-value observing there is no central object that provides
    change notification for all observers. Instead, notifications of changes are directly
    transmitted to observed objects. Key-value observing is also directly tied to
    the values of specific object properties. The notification mechanism, on the other
    hand, is more broadly concerned with program events.


    Objects that participate in key-value observing (KVO) must be KVO-compliant—that
    is, comply with certain requirements. Automatic observing requires compliance
    with the requirements of key-value coding (KVC-compliance) and using the KVC-compliance
    methods (that is, accessor methods). Key-value coding is a related mechanism (based
    on a related informal protocol) for automatically getting and setting the values
    of a related property.


    You can refine KVO objects by disabling automatic observer notifications and implementing
    manual notifications using the methods of the NSKeyValueObserving protocol and
    associated categories.


    > Further Reading: Key-Value Observing Programming Guide to learn more about the
    mechanism and underlying protocol. Also see the related documents Key-Value Coding
    Programming Guide and Cocoa Bindings Programming Topics.


    # Proxy


    The proxy design pattern provides a surrogate, or placeholder, for another object
    in order to control access to that object. You use this pattern to create a representative,
    or proxy, object that controls access to another object, which may be remote,
    expensive, or in need of securing. This pattern is structurally similar to the
    Decorator pattern but it serves a different purpose; Decorator adds behavior to
    an object whereas Proxy controls access to an object.'
