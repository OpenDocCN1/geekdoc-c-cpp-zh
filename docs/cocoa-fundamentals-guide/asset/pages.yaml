    # Error Handling


    It is axiomatic for any programming discipline that the programmer properly handle
    errors. However, what is proper often varies by programming language, application
    environment, and other factors. Cocoa has its own set of conventions and prescriptions
    for handling errors in subclass code.


    +   - If the error encountered in a method implementation is a system-level or
    Objective-C runtime error, create and raise an exception, if necessary, and handle
    it, if possible.


    In Cocoa, exceptions are typically reserved for programming or unexpected runtime
    errors such as out-of-bounds collection access, attempts to mutate objects, sending
    invalid message, and losing the connection to the window server. You usually take
    care of these errors when an application is being created rather than runtime.
    Cocoa defines predefined sets of errors that you can catch with an error handler.
    For information on predefined codes and the procedure and API for raising exceptions,
    Exception Programming Topics.


    +   - For other sorts of errors, including expected runtime errors, return nil,
    NO, NULL, or some type-safe object from zero to the caller. Examples include a
    failure to initialize an object, the inability to establish a network connection,
    or a failure to locate an object in a collection. Use an NSError object if you
    feel necessary to return supplemental information about the error to the sender.


    An NSError object encapsulates information about an error, including an error
    code (which can be specific to Mac, POSIX, or OS domains) and a dictionary of
    program-specific information. The negative value that is returned (nil, NO, and
    so) should be the principal indicator of error; if you communicate more specific
    error information, return an NSError object directly in parameter of the method.


    +   - If the error requires a decision or action from the user, use an UIAlert
    class (and related facilities) for displaying an alert dialog and handling the
    user''s response. For iOS, you use the facilities of the UIAlertSheet or UIView
    classes. See Dialogs and Special Panels for information.


    For further information about NSError objects, handling errors, and displaying
    error alerts, see Error Handling Programming Guide.


