    > Further Reading: Read Cocoa Bindings Programming Topics to learn more about
    the technology and how to use Interface Builder to establish bindings. Also see
    Key-Value Coding Programming Guide and Key-Value Observing Programming Guide for
    complete descriptions of these mechanisms.


    # Notifications


    The standard way to pass information between objects is message passing—in which
    one object invokes the method of another object. However, message passing requires
    that the object sending the message knows who the receiver is and what it to.
    This requirement is true of delegation mechanisms as well as other types of messages.
    At times, this tight coupling of two objects is undesirable—most notably because
    it would join together what two independent subsystems and it is impractical because
    it would hard-coded connections between many disparate objects in an application.


    For cases where standard message passing isn''t enough, Cocoa offers the notification
    mechanism, a modern model of notification. By using the notification mechanism,
    one object can keep other objects informed of what it is doing. In this sense,
    it is similar to delegation, but the differences are important. The key distinction
    between delegation and notification is that the former is a one-to-one communication
    path (between the delegating object and its delegate). But notification is a potentially
    one-to-many form of communication—it is a broadcast. An object can have only one
    delegate, but it can have many observers, as the recipients of notification are
    known. And the object doesn''t have to know what those observers are. Any object
    can observe an event indirectly via notification and adjust its behavior accordingly.
    Notification is a powerful mechanism for attaining coordination and cohesion in
    a program.


    How the notification mechanism works is conceptually straightforward. A process
    has an object called a notification center, which acts as a clearing house and
    broadcast center for notifications. Objects that need to know about an event elsewhere
    in the application register with the notification center to let know they want
    to be notified when that event happens. An example of this is a controller object
    that needs to know when a pop-up menu choice is made so it can reflect this change
    in the user interface. When the event happen, the object that is handling the
    event posts a notification to the notification center, which then dispatches the
    notification to all of its observers. Figure 5-6 depicts this mechanism.'
