- pgno: 10
  md: '# INTRODUCTION


    # Introduction


    To a developer new to it, Cocoa might seem like a vast, uncharted new world of
    technology. The features, tools, concepts, designs, terminology, programming interfaces,
    and even programming language of this development environment may all be unfamiliar.
    Cocoa Fundamentals Guide eases the initial steps to Cocoa proficiency. It provides
    an orientation to the technological landscape that is Cocoa. It introduces its
    features, basic concepts, terminology, architectures, and underlying design patterns.


    You can build Cocoa for two platforms: the Mac OS operating system and iOS, the
    operating system for Multi-Touch devices such as iPhone, iPad, and iPod. Cocoa
    Fundamentals Guide presents Cocoa-related information for both platforms, integrating
    the information as much as possible and pointing out differences when necessary.
    The intent is that, as you become familiar with Cocoa for one platform, it will
    become easier to transfer knowledge to software development for the other platform.


    Cocoa Fundamentals Guide is structured to lead gradually to a general understanding
    of what Cocoa is all about. It starts with the most basic information—what Cocoa
    is in terms of its components and capabilities—and ends with an explanation of
    its architectures. Each chapter builds on what was explained in previous chapters.
    Each section gives the important details about a subject, yet describes it at
    a high level. A section frequently refers you to another document that offers
    a more comprehensive description.


    In the set of Cocoa developer documentation, Cocoa Fundamentals Guide is the conceptual
    entry-point document. it is prerequisite for other essential Cocoa guides, such
    as Cocoa Drawing Guide, View Programming Guide, and iOS Application Programming
    Guide. Cocoa Fundamentals Guide assumes little in terms of prerequisite knowledge,
    but readers should be proficient C programmers and familiar with the capabilities
    and technologies of the platform they will be developing for. For Mac OS X, you
    can acquire this familiarity by reading Mac OS Technology Overview; for iOS, read
    iOS Technology Overview.


    # Organization of This Document


    Cocoa Fundamentals Guide has the following chapters:


    +   - "What Is Cocoa?" (page 13) introduces Cocoa from a functional and broadly
    architectural perspective, describing its features, frameworks, and development
    environment.

    - "Cocoa Objects" (page 55) explains the advantages and basic use of Objective-C,
    the common behavior, interface, and life cycle of all Cocoa objects.

    - "Adding Behavior to a Cocoa Program" (page 107) describes what it’s like to
    write a program using a Cocoa framework and how to create a subclass.\n- "Cocoa
    Design Patterns" (page 137) describes the Cocoa adaptations of design patterns,
    especially Model-View-Controller and object modeling.

    - "Communicating with Objects" (page 175) discusses the programming interfaces
    and mechanisms for communication between Cocoa objects, including delegation,
    notification, and bindings.


    Organization of This Document

    2010-12-13 | © 2010 Apple Inc. All Rights Reserved.


