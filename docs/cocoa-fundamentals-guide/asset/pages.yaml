    # The Form of Delegation Messages


    Delegation methods have a conventional form. They begin with the name of the AppKit
    or UIKit object delegating—application, window, control, and so on; this name
    is in lower-case and without “NS” or “UI” prefix. Usually (but not) this object
    is followed by an auxiliary verb indicating the temporal status of the reported
    event. This verb, in other words, indicates whether the event is about to occur
    (“Should” or “Will”) or it has just occurred (“Did” or “Has”). This temporal distinction
    helps to categorize messages that expect a return value and that don''t. Listing
    5-1 includes a few AppKit delegation methods that expect a return value.


    # Listing 5-1 Sample delegation methods return values


    ```

    (BOOL)application:(NSApplication *)sender

    openFile:(NSString *)filename; // NSApplication

    (BOOL)application:(UIApplication *)application

    handleOpenDocument:(id)sender; // UIApplicationDelegate

    (void)tableView:(UITableView *)tableViewRowRowSet

    willSelectRows:(IndexSet *)selection; // UITableView

    (NSRect)windowWillUseStandardFrame:(NSWindow *)window

    defaultFrame:(NSRect *)newFrame; // NSWindow

    ```


    The delegate that implements these methods can block the impending event (by returning
    NO in the first two methods) or return a suggested value (the index set and the
    frame rectangle in the last two methods). It can even defer an impending event,
    for example, the delegate implementing the applicationShouldTerminate:method can
    delay application termination by returning NSStateTerminateLater.


