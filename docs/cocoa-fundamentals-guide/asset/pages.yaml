    You may declare some properties with @property but still need to implement your
    owner methods for them. The reason for doing this is wanting the method to do
    something more than simply get or set the value of the property. For example,
    the attribute—a large image file—has to be loaded from the file, and for performance
    reasons you want your getter to load it lazily (the first time it is requested).
    If you need to implement an accessor method for such a reason, see “Implementing
    Accessor Methods” (page 125) for details. You can tell the compiler not to synthesize
    accessor methods by either designating property without specifying a @dynamic
    directive in the class @implementation block or by not specifying a @synthesize
    directive for the @dynamic property as the default; the compiler refrains from
    synthesizing an accessor method if such a method already exists in the implementation
    and there is no @synthesize directive for it.


    If garbage collection is disabled for your program, you need to qualify your property
    declarations as import. By default (the assign attribute), a synthesized setter
    method performs simple assignment, which is appropriate for garbage-collected
    code. In memory managed code, you must retain or copy the assigned object in your
    setter method; tell the compiler when you qualify a property with a retain or
    copy attribute. Note that you should always specify the copy attribute for an
    object property whose class conforms to the NSCopy protocol, even if garbage collection
    is enabled.


    The following examples illustrate a variety of behaviors you can achieve with
    property declarations (with different sets of attributes) using the @interface
    block and @synthesize and @dynamic in the @implementation block. The following
    code instructs the compiler to synthesize accessor methods for the declared name
    and accountID properties; because the accountID property is read-only, the compiler
    only synthesizes a getter method. In this case, garbage collection is assumed
    to be enabled.


    ```

    @interface MyClass : NSObject

    NSString *name;

    NSNumber *accountID;


    @property (copy) NSString *name;

    @property (readonly) NSNumber *accountID;

    //

    @end

    @implementation MyClass

    @synthesize name, accountID;

    //

    @end

    ```


    > Note: As shown in this and subsequent code examples, a property in a 32-bit
    process must be backed by an instance variable. In a program with a 64-bit address
    space, properties do not have to be backed by instance variables.


    The following code illustrates another aspect of declared properties. The assumption
    is that garbage collection is not enabled, the declaration for the currentHost
    property has a retain attribute, which instructs the compiler to retain the new
    value in its synthesized getter method. In addition, for the hidden property includes
    a qualifying attribute that instructs the compiler to synthesize a getter method
    named IsHidden; (Because of the value property is a non-object value, simple assignment
    is sufficient in the setter method.)


    ```

    @interface MyClass : NSObject {

    NSHost *currentHost;

    Boolean hidden;

    }

    n@property (retain, nonatomic) NSHost *currentHost;

    ```


