    | Carbon Core | Launch Services | Foundation |

    | Darwin | | |


    Core frameworks


    For example, the system component that is largely responsible for rendering the
    Aqua user interface, Quartz (implemented in the Core Graphics framework), is part
    of the Application Services layer. And at the base of the architectural stack
    is Darwin; everything Mac OS, including Cocoa, ultimately depends on Darwin to
    function.


    In Mac OS X, Cocoa has two core Objective-C frameworks that are essential to application
    development for Mac OS X:


    +   * AppKit, one of the application frameworks, provides the object application
    displays in its user interface and defines the structure for application behavior,
    event handling and drawing. For a description of AppKit, [AppKit (Mac OS X)](page
    38).

    * Foundation, in the Core Services layer, defines the basic behavior of objects,
    establishes mechanisms for their management, and provides objects for primitive
    data types, collections, and operating-system services. Foundation is essentially
    an object-oriented version of the Core framework; see [Foundation](page 30) for
    a discussion of the Foundation framework.


    Cocoa has close, depending on Foundation, which functionally is in the Core Services
    layer. If you look closer, at individual, or groups, of classes and at particular
    frameworks, you begin to see where Cocoa has specific dependencies on other parts
    of Mac OS X or where it exposes underlying threading through its interfaces. Many
    underlying frameworks on which Cocoa depends or which it exposes through its classes
    and methods are Core Foundation, Carbon Core, Core Graphics (Quartz), and Launch
    Services:


    +   * Carbon Core. AppKit and Foundation tap into the Core framework for some
    of the system services it provides. For example, Carbon Core has the File Manager,
    which Cocoa uses for conversions between various file-system representations.


    The Cocoa Environment

