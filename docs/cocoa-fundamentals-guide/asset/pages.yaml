- pgno: 12
  md: '# # What Is Cocoa?


    Cocoa is an application environment for the Mac OS operating system and iOS, the
    operating system used on Multi-Touch devices such as iPhone, iPad, and iPod touch.
    It consists of a suite of object-oriented software libraries, a runtime system,
    and an integrated development environment.


    This chapter expands on this definition, describing the purpose, capabilities,
    and components of Cocoa on both platforms. Reading this functional description
    of Cocoa is an essential first step for a developer trying to understand Cocoa.


    # ## The Cocoa Environment


    Cocoa is a set of object-oriented frameworks that provide a runtime environment
    for applications running in Mac OS X and iOS. Cocoa is the preeminent application
    environment for Mac OS X and the only application environment for iOS. (Carbon
    is an alternative environment in Mac OS X, but it is a compatibility framework
    with procedural interfaces intended to support existing Mac OS X code bases.)
    Most of the applications you see in Mac OS X and iOS, including Mail and Safari,
    are Cocoa applications. An integrated development environment Xcode supports development
    for both platforms. The combination of this development environment and Cocoa
    makes it easy to create a well-factored, full-featured application.


    # ## Introducing Cocoa


    With all application environments, Cocoa presents two faces; it has a runtime
    aspect and a development aspect. In its runtime aspect, Cocoa applications present
    the user interface and are tightly integrated with the other components of the
    operating system; in Mac OS X, these include the Finder, the Dock, and other applications
    from all environments.


    But it is the development aspect that is the more interesting one to programmers.
    Cocoa is an integrated suite of object-oriented components—classes—that enable
    you to create robust, full-featured building blocks; you can use them as-is or
    extend them for your specific requirements. Cocoa classes exist for just about
    every conceivable necessity, from user-interface objects to data formatting. Where
    a development hasn''t been anticipated, you can easily create a subclass of an
    class that needs that.


    Cocoa has one of the most distinguished pedigrees of any object-oriented development
    environment. Its introduction as NeSTEP in 1989 to the present day, has been continually
    refined and tested (see "A Bit of History") its elegant and powerful design is
    ideally suited for the rapid development of software of all kinds, not only applications
    but command-line tools, plug-ins, and various types of bundles. Cocoa gives your
    application its behavior and appearance "free," freeing up more of your time to
    work on those features that are distinctive. (For details on what Cocoa offers,
    see "Features of a Cocoa Application" (page 18)).


    The Cocoa Environment

    2010-12-13 | 2010 Apple Inc. All Rights Reserved.'
