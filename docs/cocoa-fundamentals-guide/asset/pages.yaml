    # Relationships


    Not all properties of a model are attributes—some properties are relationships
    to other objects. Your application is typically modeled by multiple classes. At
    runtime, your object model is a collection of related objects that make up an
    object graph. These are typically the persistent objects that your users create
    and save to data container or file before terminating the application (as a document-based
    application). The relationships between these model objects can be traversed at
    runtime to access the properties of the related objects.


    For example, in the employee management application, there are relationships between
    an employee and the department where the works, and between an employee and the
    employee''s manager. Because a manager is also an employee, the employee—manager
    relationship is an example of a reflexive relationship—a relationship from one
    entity to itself.


    Relationships are inherently bidirectional, conceptually at least there are relationships
    between departments and the employees that work in them, and an employee and their
    department. Figure 4-11 (page 170) illustrates the relationships between a Department
    and an Employee entity, and the reflexive relationship. In this example, the Department
    entity''s "employees" relationship is the inverse of the Employee entity''s "department"
    relationship. It is possible, for relationships to be navigable in only one direction—for
    to be no inverse relationship. If, for example, you are never interested in finding
    out from a department what employees are associated with it, you do not have to
    model that relationship. (Note that although this is true in the general case,
    Core Data may impose additional constraints over general Cocoa object modeling—not
    modeling the inverse should be considered an extended pricey.)


