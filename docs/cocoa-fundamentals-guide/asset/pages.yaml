    # Cocoa Objects


    **Table 2-1** Attributes for declared properties


    | Attribute | Effect |

    |---|---|

    | getter=setName | Specifies the names of getter and setter accessor methods (see
    "Storing and Accessing Properties" (page 123)). You specify these when you are
    implementing your own accessor methods and want to control their names. |

    | readonly | Indicates that the property can only be read, not written to. The
    compiler does not synthesize a setter accessor or allow unsynthesized one to be
    called. |

    | readwrite | Indicates that the property can be read and written to. This is
    the default if `readonly` is not specified. |

    | assign | Specifies that simple assignment should be used in the implementation
    of the setter; this is the default. If properties are declared in a non-garbage-collected
    program, you must specify `retain` or `copy` for properties that are objects.
    |

    | retain | Specifies that `retain` should be sent to the property (which must
    be an object type) upon assignment. Note that `retain` is not in a garbage-collected
    environment. |

    | copy | Specifies that `copy` should be sent to the property (which must be an
    object type) upon assignment. The setter''s class must implement the `NSCopying`
    protocol.

    | nonatomic | Specifies that accessor methods are synthesized as nonatomic. By
    default, all synthesized accessors are atomic. A getter is guaranteed to return
    a valid value, even when threads are executing simultaneously. For a discussion
    of atomic versus nonatomic properties, especially with regard to performance,
    see "Declared Properties" in *The Objective-C Programming Language*. |


    If you specify anything to `@synthesize` for the implementation, the compiler
    synthesizes getter and setter methods for the property that use simple assignment
    and have the form `propertyName` for getter and `setPropertyName` for setter.


    In the `@implementation` blocks of a class definition, you can use the `@dynamic`
    and `@synthesize` directives to control whether the compiler synthesizes accessor
    methods for particular properties. Both directives have the same syntax:


    ```

    @dynamic propertyName[, propertyName2...];

    @synthesize propertyName[, propertyName2...]

    ```


    The `@dynamic` directive tells the compiler that you are implementing accessor
    methods for the property, either directly or dynamically (when dynamically loading).
    The `@synthesize` directive, on the other hand, tells the compiler to synthesize
    the getter and setter methods if they do not appear in the `@implementation` block.
    The syntax for `@synthesize` also includes an extension that allows you to use
    different names for the property and its instance-variable storage. Consider,
    for the following statement:


    ```

    @synthesize title, directReports, role = jobDescription;

    ```


    This tells the compiler to synthesize accessor methods for properties `title,directReports`,
    and `role`, and to use the `jobDescription` instance variable to name the `role`
    property.'
