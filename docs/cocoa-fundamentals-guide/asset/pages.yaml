  md: '# How Delegation Works


    The design of the delegation mechanism is simple (Figure 5-1). The delegating
    class has an outlet or property, usually one that is named delegate; if it is
    an outlet, it includes methods for setting and accessing the value of the outlet.
    It also declares, without implementing, one or more methods that constitute a
    formal protocol or an informal protocol. A formal protocol uses optional methods—a
    feature of Objective-C 2.0—is the preferred approach, but both kinds of protocols
    are used by the Cocoa frameworks for delegation.


    In the informal protocol approach, the delegating class declares methods on a
    category of NSObject, and the delegate implements only those methods in which
    it has an interest in coordinating with the delegating object or affecting that
    object''s default behavior. If the delegating class declares a formal protocol,
    the delegate may choose to implement those methods marked optional, but it must
    implement the required ones.


    Delegation follows a common design, illustrated by Figure 5-1.


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_176_0.png)


    The methods of the protocol match significant events handled or anticipated by
    the delegating object. This object wants either to communicate these events to
    the delegate or, for pending events, to request input or approval from the delegate.
    For example, when a user clicks the close button of a window in Mac OS X, the
    window sends the windowShouldClose message to its delegate; this gives the delegate
    the opportunity to veto or defer the closing of the window if, for example, the
    window has associated data that must be saved (see Figure 5-2).'
