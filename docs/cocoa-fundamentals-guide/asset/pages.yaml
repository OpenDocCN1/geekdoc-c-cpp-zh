  md: '# Adding Behavior to a Cocoa Program


    When you develop a Cocoa program in Objective-C, you won''t be on one design you
    want. You''ll be drawing the work done by Apple and others, on the classes they''ve
    developed and packaged in Objective-C frameworks. These frameworks give you a
    set of interdependent classes that work together to structure a part—often a substantial
    part—of your program.


    This chapter describes what it''s like to write an Objective-C program using a
    Cocoa framework. It also gives you the basic information you need to know to make
    a subclass of a framework class.


    # Starting Up


    Using a framework of Objective-C classes and their methods differs from using
    a library of C functions. With a library of C functions, you can pretty pick which
    functions to use and when to use them, depending on the program you''re trying
    to write. On the other hand, it imposes a design on your program, or at least
    a certain problem space you are trying to address. With a procedural program,
    you call library functions as necessary to get the work of the program done. Using
    an object-oriented framework is similar in that you must invoke methods of the
    framework to do the work of the program. However, you''ll also need to customize
    the framework and adapt it to your needs by implementing methods that the framework
    will call. These methods are hooks that introduce your code into the structure
    imposed by the framework, augmenting it with the behavior that characterizes your
    program. In a sense, the usual roles of program and library are reversed. Instead
    of Incorporating library code into your program, you incorporate your code into
    the framework.


    You can gain some insight into the relationship between custom code and framework
    by considering what takes place when a Cocoa program begins.


    # What Happens in the main Function


    Objective-C programs begin executing where Cocoa programs do, in the main function.
    In a complex Objective-C program, the job of main is fairly simple. It consists
    of two steps:


    +   - Set up a core group of objects.

    - Turn program control over those objects.


    Objects in the core group create other objects as the program runs, and those
    objects might create other objects. From time to time, the program might also
    load classes, archive instances, connect to remote methods, and find other resources
    as they need. However, all that''s required at the outset is enough structure—enough
    of the object network—to handle the program''s initial tasks. The main function
    puts this initial structure in place and gets it ready for the task ahead.'
