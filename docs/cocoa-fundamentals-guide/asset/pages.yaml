    # Resource Management and Other Efficiencies


    There are all sorts of things you can do to enhance the performance of your objects
    and, of course, the application incorporates and manages these objects. These
    procedures and disciplines range from multithreading to drawing optimizations
    and techniques for reducing your code footprint. You can learn about these things
    by reading Cocoa Performance Guidelines and other performance documents.


    Yet you can, before adopting a more advanced performance technique, improve the
    performance of your objects significantly by following three simple, common-sense
    guidelines:


    +   Don''t load a resource or allocate memory until you need it.


    If you load a resource of the program, as a nil file or an image, and don''t use
    it until much later, or don''t use it at all, that is a inefficiency. Your program''s
    memory footprint is bloated for no reason. You should load or allocate memory
    only when there is an immediate need.


    For example, if your application''s preferences are in a separate nil file, don''t
    load that file until the user chooses Preferences from the allocation menu. The
    same caution goes for allocating memory for some task; hold off on allocation
    until the need for memory appears. This technique of lazy-loading or lazy-allocation
