  md: '# Figure 4-11 Relationships in the employee management application


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_169_0.png)


    # Relationship Cardinality and Ownership


    Every relationship has a cardinality; the cardinality tells you how many destination
    objects can (potentially) resolve the relationship. If the destination object
    is a single object, then the relationship is called a to-one relationship. If
    there may be more than one object in the destination, then the relationship is
    called a to-many relationship.


    Relationships can be mandatory or optional. A mandatory relationship is one where
    the destination is required—for example, every employee must be associated with
    a department. An optional relationship is, as the name suggests, optional—for
    example, not every employee has direct reports. So the directReports relationship
    depicted in Figure 4-12 is optional.


    It is also possible to specify a range for the cardinality. An optional to-one
    relationship has a range 0-1. An employee may have any number of direct reports,
    or a range that specifies a minimum and a maximum, for example, 0-15, which also
    illustrates an optional to-many relationship.


    Figure 4-12 illustrates the cardinalities in the employee management application.
    The relationship between an Employee object and a Department object is a mandatory
    to-one relationship—an employee must belong to one, and only one, department.
    The relationship between a Department and its Employee objects is an optional
    to-many relationship (represented by a "*"). The relationship between an employee
    and a manager is an optional to-one relationship (denoted by the range 0-1)—top-ranking
    employees do not have managers.


    # Figure 4-12 Relationship cardinality


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_169_1.png)


    Note also that destination objects of relationships are sometimes owned and sometimes
    shared.


    # Accessing Properties


    In order for models, views, and controllers to be independent of each other, you
    need to be able to access properties in a way that is independent of a model''s
    implementation. This is accomplished by using key-value pairs.'
