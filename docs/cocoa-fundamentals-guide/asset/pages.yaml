    What Is Cocoa?


    # # The Development Environment


    You develop Cocoa software properly by using the developer applications, Xcode
    and Interface Builder. It is possible to develop Cocoa applications without using
    these applications at all. For example, you could write code using a text editor
    such as Emacs, build the application from the command line using makefiles, and
    debug the application from the command line using the `gdb`. But would you want
    to give yourself some grief?


    **Note:** "Xcode" is sometimes used to refer to the complete suite of development
    tools and frameworks, and other times specifically to the application that allows
    you to manage projects, edit source code, and build executable code.


    The origins of Xcode and Interface Builder coincide with the origins of Cocoa
    itself, and consequently there is a high degree of compatibility between tools
    and frameworks. Together, Xcode and Interface Builder make it extraordinarily
    easy to design, manage, and debug Cocoa projects.


    When you install the development tools and documentation, you may select the installation
    location. Traditionally that location has `/Developer`, but it can be anywhere
    in the file system you wish. To designate this installation location, the documentation
    uses `<Xcode>`. Thus, the development applications are installed in `<Xcode>/Applications`.


    # # Platform SDKs


    Beginning with Xcode 3.1 and the introduction of the iOS, when you create a software
    project you must choose a platform SDK. The SDK enables you to build an executable
    that is targeted for a particular release of Mac OS or iOS.


    The platform SDK contains everything that is required for developing software
    for a given platform and operating-system release. A Mac OS SDK consists of frameworks,
    libraries, headers files, and tools. The SDK for iOS has the same components,
    but includes a plugin-specific compiler and other tools. There is also a separate
    SDK for iOS Simulator ("The iOS Simulator Application" (page 26)). All SDKs include
    building settings and project templates appropriate to their platform.


    > **Further reading:** For more on platform SDKs, see SDK `Compatibility Guide`.


    # # Overview of Development Workflows


    Application development differs for Mac OS X and iOS, not only in the tools used
    but in the development workflow.


    In Mac OS X, the typical development workflow is the following:


    +   1. In Xcode, create a project using a template from the Mac OS X SDK.

    2. Write code and, using Interface Builder, construct your application’s user
    interface.

    3. Define the targets and executable environment for your project.'
