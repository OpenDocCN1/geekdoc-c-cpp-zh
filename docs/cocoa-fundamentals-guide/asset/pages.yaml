    # Object Infrastructure


    If a subclass is well-designed, instances of that class will behave in ways expected
    of Cocoa objects. Code using the object can compare to other instances of the
    class, discover its contents (for example, in a debugger), and perform basic operations
    with the object.


    Custom subclasses should implement, if not all, of the following root-class and
    binding protocol methods:


    +   - **isEqualTo:** and **hash:**—Implement these NSObject methods to bring some
    object-specific logic to their comparison. For example, if you have instances
    of your class by a serial number, what is the basis for equality. For further
    information, see [Inspection](page 87).

    - **description**—Implement this NSObject method to return a string that concisely
    describes the properties or contents of the object. The information is returned
    by the print object in the debugger and used by the %@ specifier for objects in
    strings. For example, if you have a hypothetical Employee class with attributes
    for name, date, department, and position ID. The description method for this class
    should look like this:


    +   - **copyWithZone:**—if you expose clients of your subclass to copy instances
    of it, you should implement this method of the NSCopying protocol. Value objects,
    including model objects, are typical candidates for copying; as UIView and NSColor
    are not. If instances of your class are mutable, you should conform to the NSMutableCopying
    protocol.


