  md: '# CHAPTER 4


    # Cocoa Design Patterns


    # Uses and Limitations


    Because NSImage supports several different representations of what an image is,
    some requested attributes might not apply. For example, asking an image for the
    color of a pixel does not work if the underlying image representation is vector-based
    and device-independent.


    > Note: See Cocoa Drawing Guide for a discussion of NSImage and image representations.


    # Iterator


    The Iterator design pattern provides a way to access the elements of an aggregate
    object (that is, a collection) sequentially without exposing its underlying representation.
    The Iterator pattern transfers the responsibility for accessing and traversing
    the elements of a collection from the collection itself to an iterator object.
    The Iterator defines an interface for accessing collection elements and keeps
    track of the current element. Different iterators can carry different traversal
    policies.


    # Enumerators


    The NSEnumerator class in the Foundation framework implements the Iterator pattern.
    The private, subclass of the abstract NSEnumerator returns enumerator objects
    that sequentially traverse various types—arrays, sets, dictionaries (values and
    keys)—returning objects in the collection clients.


    NSDirectoryEnumerator is a distantly related class. This class recursively enumerate
    the contents of the file system.


    # Uses and Limitations


    The collection classes use NSArray, NSSet, and NSDictionary include methods that
    return an enumerator appropriate to the type of collection. All workers work in
    the same manner. You send next message to the enumerator object in a loop that
    exits when nil is returned instead of the next object in the collection.


    You can use fast enumeration to access the elements of a collection; this language
    is described in [Fast Enumeration](page 63).


    # Mediator


    The Mediator pattern defines an object that encapsulates a set of objects interact.
    Mediator promotes loose coupling by keeping objects from referring to each other
    explicitly, and it lets you vary their interaction independently. These objects
    can thus remain reusable.


    A "mediator object" in this pattern centralizes complex communication and control
    logic between objects in a system. These objects tell the mediator object when
    their state change and, in turn, respond to requests from the mediator.'
