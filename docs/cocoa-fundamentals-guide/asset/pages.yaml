    # What Is Cocoa?


    > Note: In Mac OS X version 10.5 the Cocoa frameworks were ported to support 64-bit
    addressing. iOS also supports 64-bit addressing. As part of this effort, various
    general changes have been made to the Cocoa API, most significantly the introduction
    of the NSInteger and NSUInt types (replacing int and unsigned where appropriate)
    and the CGFloat type (replacing most instances of float). Most applications have
    no immediate need to make the transition to 64-bit, but for those that, porto
    tools and guidelines are available. 64-Bit Transition Guide for Cocoa covers these
    matters in detail.


    The Cocoa frameworks handle many low-level tasks for you. For example, classes
    that store and manipulate integer and floating-point values automatically handle
    the endianness of these values for you.


    The following sections survey the features and classes of the three core Cocoa
    frameworks and describe some of the secondary frameworks. Because each of these
    core frameworks has dozens of classes, the descriptions of the core frameworks
    categorize classes by their function. Although these categorizations have a strong
    logic basis, one can plausibly group classes in other ways.


    # Foundation


    The Foundation framework defines a base layer of classes that can be used for
    any type of Cocoa program. The criterion selecting classes in Foundation from
    those in the AppKit is the user interface. If an object doesn''t either appear
    in a user interface or isn''t exclusively used to support a user interface, its
    class belongs in Foundation. You can create Cocoa programs that use Foundation
    and no other framework; examples of these are command-line tools and Internet
    services.


    The Foundation framework was designed with certain goals in mind:


    +   - Define basic behavior and introduce consistent conventions for such things
    as memory management, object mutability, and notifications.


    +   - Support internationalization and localization with (among other things)
    bundle technology and Unicode strings.


    +   - Support object persistence.


    +   - Provide some measure of operating-system independence to support portability.


    +   - Provide object wrappers or equivalents for programmatic primitives, such
    as numeric values, strings, and collections. It also provides classes for accessing
    underlying system services and entities, such as ports, threads, and file systems.


    Cocoa applications, by definition link either against the AppKit framework or
    UIKit framework, invariably must link against the Foundation framework as share
    the root class, NSObject, and many if most of the AppKit and UIKit methods and
    functions have Foundation objects as parameters or return values. Some Foundation
    classes may seem designed for applications—NSManager and NSUserDefaults, to name
    two—but they are included in Foundation because they can be used for them that
    do not need a user interface.


