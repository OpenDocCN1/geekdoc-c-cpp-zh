- pgno: 185
  md: '# CHAPTER 5


    Communicating with Objects


    The NSResponder class also defines many default action messages (also known as
    standard commands) for common operations on text. This allows the Cocoa text system
    to send these action messages up the screen to an application''s responder chain—a
    hierarchical sequence of event-handling objects—where it can be handled by the
    first NSView, NSWindow, or NSApplication object that implements the corresponding
    method.


    # Target-Action in UIKit


    The UIKit framework also declares and implements a suite of control classes: the
    control classes in this framework inherit from UI class, which defines many of
    the target-action mechanism for iOS. However there are some fundamental differences
    in how the AppKit and UIKit frameworks implement-action. One of these differences
    is that UIKit does not have any true controls. Controls in UIKit do not rely upon
    their users for target and action.


    A larger difference in how the two frameworks implement target-action is in the
    nature of the event model. In the AppKit framework, the user typically uses a
    mouse and keyboard to register for events handling by the system. Events—such
    as clicking on a button—are discrete and connected. Consequently, a control object
    in AppKit recognizes a single physical event as the trigger for the action it
    sends to its target (In the case of buttons, this is a mouse-up event). In iOS,
    the user''s fingers organize events instead of mouse clicks, drags or keystrokes.
    There can be more than one finger touching an object on the screen, and these
    can be going in different directions.


    To account for multitouch event model, UIKit declares a set of control-constants
    inControlEvents.h which specify various gestures that users can make such as lifting
    a finger from a control, dragging into a control, and touching down within a text
    field. You can configure a control so that it responds to one or more of these
    touch events by sending an action to a target. Many of the control classes in
    UIKit are implemented to generate certain control events; for example, instances
    of the UISlider generate aControlEvents control event, which you can use to send
    an action to a target.


    You set up a control so that it sends an action to a target by associating both
    target and one or more controls. To do this, use addTarget:forControlEvents: to
    the control for each action-pair you want to send. When the user touches the control
    in a designated fashion, the control forwards the action message to the global
    UIApplication object in sendAction:from: the UIApplication object is the centralized
    dispatch point for action messages. If the control specifies a nil for an action
    message the application queries objects in the responder chain until it finds
    one that is willing to handle the action message—that is, implementing one method
    corresponding to the action selector:


    ```

    (void)action

    (void)action:(id)sender

    (void)action:(id)sender:(:(*)event

    ```


    To learn more about the target-action mechanism in UIKit, read UIControl Reference.


    186


    The Target-Action Mechanism

