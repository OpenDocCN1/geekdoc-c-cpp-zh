    # View Controllers in UIKit


    Applications running in iOS frequently use a modal and navigation user-interface
    design for presenting screen-size chunks of the application''s data model. An
    application may have a navigation bar and toolbar, and between these objects is
    the current view of application data. Users can tap buttons on the toolbar to
    select a (data) objects; at each level the current view presents more detail.
    At the end of this hierarchy is often it that the user can inspect or edit. In
    application, of course, is free to use a navigation bar or just a toolbar.


    View controllers—that inherit from ViewController—are central to this design.
    ViewController is an abstract class that you can subclass to manage a particular
    view. The UIKit framework also provides ViewController subclasses for managing
    navigation bar and toolbar objects: UINavigationController and UITabBarController.
    As depicted in Figure 4-4, a tab-bar controller can manage a number of navigation
    controllers, which in turn can manage one or more view controllers, each with
    its associated view object. In addition to managing views (including overlay views),
    a view controller specifies the buttons and titles that are displayed in the navigation
    bar.


    To learn more about view controllers, see ViewController Programming Guide for
    iOS.'
