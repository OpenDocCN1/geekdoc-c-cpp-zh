    # Shark


    Shark is a performance-analysis application that creates a time-based profile
    of your program''s execution, over a given period it traces function calls and
    graphs memory allocations. You can use Shark to trace information for a single
    program or for the entire system, in Mac OS includes kernel components such as
    drivers and kernel extensions. Shark also monitors file-system calls, traces system
    calls and gathers information about cache misses, page faults, and other system
    metrics. Shark supports the analysis of your code, supports the analysis of code
    written in C, Objective-C, C++, and other languages.


    # Other Performance Applications (Mac OS X)


    Many applications are used in measuring and analyzing aspects of a Mac OS program''s
    performance. Many applications are located in `<Xcode>/Applications/Performance
    Tools.`


    +   * **BigTop** performance trends over time, providing a real-time display of
    memory usage, faults, CPU usage, and other data.


    +   * **Spin Control** automatically samples unresponsive applications. You leave
    Spin Control running in the background while you launch and test applications.
    If applications become unresponsive to the point where the spinning cursor appears,
    Spin Control automatically samples your application to gather information about
    what your application was doing during time.


    +   * **MallocDebug** shows all allocated blocks of memory in your program, organized
    by the call stack at the time of allocation. At a glance you can see how much
    memory your application consumes, where that memory was allocated from, and which
    functions allocated large of memory. MallocDebug can also find allocated memory
    that is not referenced elsewhere in the program, helping you find leaks and track
    down exactly where memory was allocated.


    +   * **QuartzDebug** is a tool to help you debug how your application displays
    itself. It is es useful for applications that do significant amounts of drawing
