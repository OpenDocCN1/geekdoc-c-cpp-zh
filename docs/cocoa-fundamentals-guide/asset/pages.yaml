  md: '# CHAPTER 4

    Cocoa Design Patterns


    +   - Although you can use an instance of subclass NSObject as a mediating controller,
    there''s no reason to go through all the work required to use it. Use instead
    one of the ready-made NSController objects designed for the Cocoa technology;
    that is, an instance of NSObjectController, NSArrayController, UserDefaultsController,
    or NSTreeController—or a custom subclass of one of these NSController subclasses.


    However, if the application is very simple and you feel more comfortable the glue
    code you need to implement behavior using outlets and target-action, feel free
    to use an instance of a custom NSObject subclass as a mediating controller. In
    a custom NSObject subclass, you can also implement a mediator in the NSController
    sense, using key-coding, key-value observing, and the editor controls.


    +   - Although you choose MVC roles in an object, the best strategy is to keep
    separation between roles. This separation enhances the usability of objects and
    the extensibility of the program they''re used in. If you are going more MVC roles
    in a class, pick a predominant role for that class and then (for maintenance purposes)
    use the same application file to extend the class to play other roles.


    +   - Goal of a well-designed MVC application should be to use as many objects
    as possible that are (theoretically, at least) reusable. In particular, view objects
    and model objects should be highly reusable. (The ready-made mediating controller
    objects, of course, are reusable.) Application-behavior is frequently contended
    as much as possible in controller objects.


    Although it is possible to have views directly observe models to detect changes
    in state, it is best not to do so. A view object should always go through a mediating
    controller to learn about changes in a model object. The reason is twofold:


    +   - If you use the bindings mechanism to have view objects observe the properties
    of model objects, bypass all the advantages NSController and its subclasses give
    your application: selection and placeholder management as well as the ability
    to commit and discard changes.


    +   - If you don''t use the bindings mechanism, you have to subclass an existing
    view class to add the ability to observe change notifications by a model object.


    Strive to limit code dependency in the classes of your application. The greater
    the dependency a class has on another class, the less reusable it is. Specific
    recommendations vary by the MVC roles of the classes involved:


    +   - A view class should not depend on a model class (although this may be unavoidable
    with some custom views).


    +   - A view class should not have to depend on a mediating controller class.


    +   - A model class shouldn''t depend on anything other than model class.


    +   - A mediating controller class shouldn''t depend on a model class (although,
    like views, this may be necessary if it''s a custom controller class).


    +   - A coordinating controller class shouldn''t depend on view classes or on
    coordinating controller classes.


    +   - A coordinating controller class should depend on classes of all MVC role
    type.


