    \ {\n    RCReceptionist *receptionist = [RCReceptionist new];\n    receptionist->task\
    \ = [task copy];\n    receptionist->observedKeyPath = [path copy];\n    receptionist->observedObject\
    \ = [obj retain];\n    receptionist->queue = [queue retain];\n    [obj addObserver:receptionist\
    \ forKeyPath:path options:NSKeyValueObservingOptionNew | NSKeyValueObservingOptionOld\
    \ context:0];\n    return [receptionist autorelease];\n}\n```\n\nNote that the\
    \ code copies the block object instead of retaining it. Because the block was\
    \ probably created on the stack, it must be copied to the heap so it exists in\
