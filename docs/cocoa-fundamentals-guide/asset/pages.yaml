  md: '# Cocoa Classes in the AppKit Framework


    The Model-View-Controller design pattern assigns roles to objects in an object-oriented
    system such as an application. They can be model objects, which contain the data
    of the application and manipulate data; they can be view objects, which present
    the data and respond to user actions; or they can be controllers objects, which
    mediate between the model and view objects. Controllers fit the Mediator pattern.


    In Cocoa, controllers can be of two general types: mediating controllers or coordinating
    controllers. Mediating controllers manage the flow of data between view objects
    and model objects in an application. Coordinating controllers implement the centralized
    communication and control logic for an application, acting as delegates for framework
    objects and as action messages. They are typically NSController objects or instances
    of NSObject subclasses. They are highly specialized for a particular program,
    coordinating controllers not to be reusable.


    The abstract NSController and its concrete subclasses in the AppKit framework
    are part of the Cocoa technology of bindings, which automatically synchronizes
    data contained in model objects and displayed and edited in views. For example,
    if a user edits a string in a text field, the technology changes—through a mediating
    controller—to the appropriate property of the bound model object. All programmers
    need to design their model and, using Interface Builder, establish bindings between
    the view, controller, and model objects of a program.


    Instances of particular controller classes are available from the Interface Builder
    library and are highly reusable. They provide services such as the management
    of selections and placeholder values. These objects perform the following functions:


    +   * NSController manages a single model object.

    * NSArrayController manages an array of model objects and maintains a selection;
    it also allows you to add objects to remove objects from the array.

    * NSTController enables you to add, remove, and manage model objects in a hierarchical
    structure.

    * NSUserDefaultsController provides a convenient interface to the preferences
    (defaults) system.


    # Uses and Limitations


    Generally you use NSController objects as mediating controllers because these
    objects are designed to communicate data between the view objects and model objects
    of an application. To use a mediating controller, you typically drag the object
    from the Interface Builder library, select the model-property keys, and establish
    the bindings between view and model objects using the Bindings pane of the Interface
    Builder window. You can also subclass NSController or one of its subclasses to
    get more specialized behavior.


    You can potentially make bindings between almost any pair of objects as long as
    those objects comply with the NSKeyValue and NSValueObserving informal protocols.
    But to get all the benefits the NSController and its subclasses give you, it is
    to make better bindings through mediating controllers.


    Coordinating controllers central communication and control logic in an application
    by:


    +   * Maintaining outlets to model and view objects (outlets are instance variables
    that hold connections or references to other objects)'
