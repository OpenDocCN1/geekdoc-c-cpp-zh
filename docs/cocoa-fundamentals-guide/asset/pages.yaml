  md: '# CHAPTER 1


    What Is Cocoa?


    Objects of the major collection classes have common behavioral characteristics
    and requirements. The items they contain must be objects, but the objects can
    be of any type. Collection objects, as with value objects, are essential components
    of property lists and, like all objects, can be achieved and distributed. Moreover,
    collection objects automatically retain—that is, keep a strong reference to—any
    object that if you remove from a mutable collection, it is released, which results
    in the object being freed if no other object claims it.


    > Note: "Retain," "release," and related terms refer to memory-management of objects
    in Cocoa. To learn about this topic, see "Object Retention and Disposal" (page
    70).


    The collection classes provide methods to access specific objects. In addition,
    there are special enumerator objects (NSEnumerator) and language-level support
    to iterate through collections and access each element in sequence.


    The major collection classes are differentiated by the ordering they use:


    +   * Arrays (NSArray) are ordered collections that use zero-indexing for accessing
    the elements of the collection.


    +   * Dictionaries (NSDictionary) are collections managing keys and values; the
    key is an object that identifies the value, which is also an object. Because of
    this key-value scheme, the elements in a dictionary are unordered. Within a dictionary,
    the keys must be unique. Although they are typically strings, any key can be any
    type of object.


    +   * Sets (NSSet) are similar to arrays, but they provide unordered storage of
    their elements instead of ordered storage. In other words, the order of elements
    in a set is not important. In an NSSet object must be distinct from each other;
    however, an instance of NSCountedSetClass (a subclass of NSMutableSet) may include
    the same object more than once.


    In Mac OS, the Foundation framework includes several additional classes. NSMapTable
    is a mutable dictionary-like class; however, NSDictionary can hold pointers as
    well as objects and maintains weak references to its contents and NULL values
    can maintain either strong or weak references. NSPPointerArray is an array that
    can hold pointers to them. NSHashTable is modeled after NSSet but it can store
    pointers to functions and provides different options, in particular to support
    weak relationships in a garbage-collected environment.


    For more classes and objects, see Collections Programming Topics.


    # Other Categories of Foundation Classes


    The remaining classes of the Foundation framework fall into various categories,
    as indicated by the diagram in Figure 1-7 (page 32). The major categories of classes,
    shown in Figure 1-7, are described here:


    +   * Operating-system bytes. Many Foundation classes facilitate access to various
    lower-level services of the operating system and, at the same time, insulate you
    from operating system idiosyncrasies. For example, NSProcessInfo lets you query
    the environment in which an application runs and NSHost yields the names and addresses
    of host systems on a network. You can use NSTimer object to send a message to
    another object at specific intervals, and NSRunLoop lets you manage the input
    sources of an application or other type of program. NSUserDefaults provides a
    programmatic interface to a system database of global (per-host) and per-user
    default values (preferences).'
