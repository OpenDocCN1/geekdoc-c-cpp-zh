    # Cocoa Objects


    Finally, the Objective-C features supports a simplified syntax for accessing (getting
    and setting) properties through the use of dot notation and simple assignment.
    The following examples show how easy it is to get the values of properties and
    set them using this syntax:


    ```

    NSString *title = employee.title; // assigns employee title to local variable

    employee.ID = "A542309"; // assigns literal string to employee ID

    // get last name of this employee''s manager

    NSString *name = employee.manager.lastName;

    ```


    Note that dotation syntax works only for attributes and simple one-to-one relationships,
    not for to-many relationships.


    **Further Reading:** To learn about declared properties, read "Declared Properties"
    in The Objective-C Programming Language.


    # Fast Enumeration


    Fast enumeration is a language feature introduced in Objective-C 2.0 that gives
    you a concise syntax for efficient enumeration of collections. It is much faster
    than the traditional use of NSEnumerator to iterate through arrays, sets, and
    dictionaries. Moreover, it ensures safe enumeration by a mutation guard to prevent
    modification of collection during enumeration. (An exception is thrown if a mutation
    is attempted).


    The syntax for enumeration is similar to that used in scripting languages such
    as Perl and Ruby; here are two versions:


    ```

    for (type newVariable in expression ) { statements }

    ```


    and


    ```

    for (type existingVariable in expression ) { statements }

    ```


    expression must evaluate an object whose class conforms to the NSFastEnumeration
    protocol. The fast-enumeration is shared between the Objective-C runtime and the
    Foundation framework. Foundation declares the NSFastEnumeration protocol, and
    the Foundation classes—NSArray, NSDictionary, and NSSet—and the NSEnumerator class
    adopt the protocol. Other classes that hold other objects, including custom classes,
    may adopt NSFastEnumeration to take advantage of this feature.


    The following snippet illustrates how you might use fast enumeration with NSArray
    and NSSet objects:


    ```

    NSArray *array = [NSArray arrayWithObjects:

    "One", "Two", "Three", "Four", nil];


    for (NSString *element in array) {

    NSLog("element: %@", element);

    }


    NSSet *set = [NSSet setWithObjects:

    "Alpha", "Beta", "Gamma", "Delta", nil];

    ```


