    # Object Mutability


    Cocoa objects are either mutable or immutable. You cannot change the encapsulated
    values of immutable objects; once an object is created, the value represents the
    same throughout the object''s life. You can change the encapsulated value of a
    mutable object at any time. The following sections explain the reasons for having
    mutable and immutable variants of an object type, describe the characteristics
    and side-effects of object mutability, and recommend how best to handle objects
    when their mutability is an issue.


    # Why Mutable and Immutable Object Variants?


    Objects by default are mutable. Most objects allow you to change their encapsulated
    data through setter accessor methods. For example, you can change the size, positioning,
    buffering behavior, and other characteristics of NSWindow object. A well-designed
    model—say, an object representing a customer record—requires setter methods to
    change its instance data.


    The Foundation framework adds some nuance to this by introducing classes that
    have mutable and immutable variants. The mutable subclasses are typically subclasses
    of their immutable superclass and have "Mutable" embedded in the class name. These
    classes include the following:


    +   NSMutableArray

    NSMutableDictionary

    NSMutableSet

    NSMutableIndexSet

    NSMutableCharacterSet

    NSMutableData

    NSMutableString

    NSMutableAttributedString

    NSMutableURL


    All these classes have atypical names, they are closer to the mutable norm than
    their immutable counterparts. Why this complexity? What purpose does having an
    immutable variant of a mutable object serve?'
