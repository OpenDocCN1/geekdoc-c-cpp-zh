    # What Is Cocoa?


    The Foundation framework for iOS has a subset of the classes for Mac OS X. The
    following categories of classes are present only in the Mac OS X version of Foundation:


    +   * Spotlight queries. NSMetadataItem, NSMetadataQuery and related query classes
    encapsulate file-system metadata and make it possible to query that metadata.


    +   * Scripting. The classes in this category help to make your program responsive
    to AppleScript scripts and Apple event commands.


    +   * Distributed objects. You use the distributed object classes for communication
    processes between the same computer or on different computers on a network. Two
    of these classes, NSDistantObject and NSProtocolChecker, have a root class (NSProxy)
    different from the root class of the rest of Cocoa.


    # AppKit (Mac OS X)


    AppKit is a framework containing all the objects you need to implement your graphical,
    event-driven interface in Mac OS X; windows, buttons, menus, scrollers, text fields—AppKit
    handles all the details for you as it efficiently draws on the screen, communicates
    with hardware devices and buffers, clears areas of drawing and clips views. The
    number of classes in AppKit may seem daunting at first. However, most AppKit classes
    are support classes that you use indirectly. They allow you the choice at which
    you use AppKit:


    +   * Use Interface Builder to create connections from user-interface objects
    to your application''s controller objects, which manage the user interface and
    coordinate the flow of data between the user interface and internal data structures.
    For this, you might use off-the-shelf controller objects (for Cocoa bindings)
    or you may need to implement one or more custom controller classes—particularly
    the action and delegate methods of those classes. You might need to implement
    a method that is invoked when the user chooses a menu item (unless it has a default
    implementation that is acceptable).


    +   * Control the user interface programmatically, which requires more familiarity
    with AppKit classes and protocols. For example, allowing the user to drag an icon
    from one window to another requires some programming and familiarity with the
    NSDragger... protocols.


    +   * Implement your own objects by subclassing NSObject or other classes. When
    subclassing,, you write your drawing methods using graphics functions. Subclassing
    requires a deeper understanding of how AppKit works.


    # Overview of the AppKit Framework


    The AppKit framework consists of more than 125 classes and protocols. All classes
    ultimately inherit from the Foundation framework''s NSObject class. The diagrams
    in Figure 1-8 show the inheritance relationships of the AppKit classes.'
