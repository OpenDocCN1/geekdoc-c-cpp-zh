  md: "# The dealloc and finalize Methods\n\nIn Cocoa classes that use garbage collection,\
    \ the `finalize` method is where the class disposes of any remaining resources\
    \ and attachments of its instances before those instances are freed. In Cocoa\
    \ classes that use traditional memory management, the comparable method for resource\
    \ cleanup is the `dealloc` method. Although similar in purpose, there are significant\
    \ differences in how these methods should be implemented.\n\nIn many respects,\
    \ the `dealloc` method is the counterpart to a class’s `init...` method, especially\
    \ its designated initializer. Instead of being invoked just after the allocation\
    \ of an object, `dealloc` is invoked just prior to the object’s destruction. Instead\
    \ of ensuring that the instance variables of an object are properly initialized,\
    \ the `dealloc` method makes sure that object instance variables are released\
    \ and that any dynamically allocated memory has been freed.\n\nThe final point\
    \ of parallelism has to do with the invocation of the superclass implementation\
    \ of the same method. In an initializer, you invoke the superclass’s designated\
    \ initializer as the first step. In `dealloc`, you invoke the superclass’s implementation\
    \ of `dealloc` as the last step. The reason for this order of invocation is mirror-opposite\
    \ to that for initializers; subclasses should release or free the instance variables\
    \ they own first before the instance variables of ancestor classes are released\
    \ or freed.\n\nListing 2-5 shows how you might implement this method.\n\n# Listing\
    \ 2-5      A typical dealloc method\n\n```\n- (void)dealloc {\n    [accountDictionary\
    \ release];\n    free(mallocdChunk);\n    [super dealloc];\n}\n```\n\nNote that\
    \ this example does not verify that `accountDictionary` (an instance variable)\
    \ is something other than `nil` before releasing it. That is because Objective-C\
    \ lets you safely send a message to `nil`.\n\nSimilar to the `dealloc` method,\
    \ the `finalize` method is the place to close resources used by an object in a\
    \ garbage-collected environment prior to that object being freed and its memory\
    \ reclaimed. As in `dealloc`, the final line of a `finalize` implementation should\
    \ invoke the superclass implementation of the method. However, unlike `dealloc`,\
    \ a `finalize` implementation does not have to release instance variables because\
    \ the garbage collector destroys these objects at the proper time.\n\nBut there\
    \ is a more significant difference between the `dealloc` and `finalize` methods.\
    \ Whereas implementing a `dealloc` method is usually required, you should not\
    \ implement a `finalize` method if possible. And, if you must implement `finalize`,\
    \ you should reference as few other objects as possible. The primary reason for\
    \ this admonition is that the order in which garbage-collected objects are sent\
    \ `finalize` messages is indeterminate, even if there are references between them.\
    \ Thus the consequences are indeterminate, and potentially negative, if messages\
    \ pass between objects being finalized. Your code cannot depend on the side effects\
    \ arising from the order of deallocation, as it can in `dealloc`. Generally, you\
    \ should try to design your code so that such actions as freeing memory allocated\
    \ with `malloc`, closing file descriptors, and unregistering observers happen\
    \ before `finalize` is invoked."
