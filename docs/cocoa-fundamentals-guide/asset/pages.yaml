- pgno: 71
  md: '# CHAPTER 2


    Cocoa Objects


    Figure 2-3 Reachable and unreachable objects


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_71_0.png)


    Another thing the diagram illustrates is that objects may have strong references
    to other objects, but if there is no chain of strong references that leads back
    to a root object, the object is considered unreachable and is disposed of at the
    end of a collection cycle. These references can be circular, but in garbage collection
    the circular references do not cause memory leaks, as they retain cycles in memory-managed
    code. All of these objects are disposed of when they are no longer reachable.


    The Objective-C garbage collector is request-driven, not demand-driven. It initiates
    collection cycles only upon request; Cocoa makes requests at intervals optimized
    for performance or when a certain memory threshold has been exceeded. You can
    also request collections using methods of the NSGarbageCollector class. The garbage
    collector is also generational. It makes not only exhaustive, or full, collections
    of objects periodically, but incremental collections based on the "generation"
    of objects. An object''s generation is determined by when it was allocated. Incremental
    collections are faster and more frequent than full collections, affect the more
    recently allocated objects (Most objects are assumed to be "die young"). If an
    object survives the first collection, it is likely to be intended to have a longer
    life.


    The garbage collector runs on one thread of a Cocoa program. In a collection cycle
    it will stop threads to determine which objects in those threads are unreachable.
    It never stops threads at once, and it stops each thread for a short time as much
    as possible. The collector is also conservative in it never compacts auto-zone
    memory by relocating blocks of memory or updating pointers; once allocated, an
    object always stays in its original memory location.


