    # The Model-View-Controller Design Pattern


    The Model-View-Controller design pattern (MVC) is quite old. Variations of it
    have been around at least since the early days of Smalltalk. It is a high-level
    pattern in that it concerns itself with the global architecture of an application
    and classifies objects according to the general roles they play in an application.
    It is also a compound pattern in that it comprises several, more elemental patterns.


    Object-oriented programs benefit in several ways by adapting the MVC design pattern
    for their designs. Many objects in these programs tend to be more reusable and
    their interfaces tend to be better defined. The programs overall are more adaptable
    to changing requirements—in other words, they are more easily extensible than
    programs that are not based on MVC. Moreover, many technologies and architectures
    in Cocoa—such as bindings, the document architecture, and scriptability—are based
    on MVC and require that your custom objects play one of the roles defined by MVC.


    # Roles and Relationships of MVC Objects


    The MVC design pattern considers there to be three types of objects: model objects,
    view objects, and controller objects. The MVC pattern defines the roles that these
    types of objects play in the application and their lines of communication. When
    designing an application, a major step is choosing—or creating custom classes
    for—objects that fall into one of these three groups. Each of the three types
    of objects is separated from the others by abstract boundaries and communicates
    with objects of the other types across those boundaries.


    # Model Objects Encapsulate Data and Basic Behaviors


    Model objects represent special knowledge and expertise. They hold an application’s
    data and define the logic that manipulates that data. A well-designed MVC application
    has all its important data encapsulated in model objects. Any data that is part
    of the persistent state of the application (whether that persistent state is stored
    in files or databases) should reside in the model objects once the data is loaded
    into the application. Because they represent knowledge and expertise related to
    a specific problem domain, they tend to be reusable.


    Ideally, a model object has no explicit connection to the user interface used
    to present and edit it. For example, if you have a model object that represents
    a person (say you are writing an address book), you might want to store a birthdate.
    That’s a good thing to store in your Person model object. However, storing a date
    format string or other information on how that date is to be presented is probably
    better off somewhere else.


    In practice, this separation is not always the best thing, and there is some room
    for flexibility here, but in general a model object should not be concerned with
    interface and presentation issues. One example where a bit of an exception is
    reasonable is a drawing application that has model objects that represent the
    graphics displayed. It makes sense for the graphic objects to know how to draw
    themselves because the main reason for their existence is to define a visual thing.
    But even in this case, the graphic objects should not rely on living in a particular
    view or any view at all, and they should not be in charge of knowing when to draw
    themselves. They should be asked to draw themselves by the view object that wants
    to present them.'
