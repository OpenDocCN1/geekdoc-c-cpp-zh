    # Application Coordination


    Each running in iOS is managed by a singleton application object, and this object
    has a job that is almost identical to that for the global UIApplication object.
    A UIApplication object controls the event loop, keeps track of the application''s
    windows and views, and dispatches incoming events to the appropriate responder
    objects.


    The UIApplication also receives notification of system-level and application-level
    events. Many of it passes to its delegate, allowing it to inject application-specific
    behavior when the application launches and terminates, to respond to low-memory
    warnings and changes in time, and to handle others tasks.


    # Differences in Event and Drawing Models


    In Mac OS X, the mouse and keyboard generate most user events. AppKit uses NSEvent
    objects to encapsulate these events. In iOS, the user''s finger movements on the
    screen are what generates events. UIKit also has a class, UIEvent, to represent
    these events. Finger touches or more touches could form a discrete event—a gesture,
    for example. A UIEvent object contains one or more objects representing touches
    (UITouch). The model for distributing and dispatching events to objects that can
    handle them on the platform is almost identical. However, to handle an event,
    an object must take into consideration the sequence of touches specified by that.


    UIKit has gesture recognizers, which automate the detection of touches. A gesture
    recognizer recognizes a series of touches,, when it recognizes its gesture, sends
    an action message to a target. UIKit provides ready-made gesture recognizers for
    gestures such as swipe, rotate, and pan. You can also create custom gesture recognizers
    that detect application-specific gestures.'
