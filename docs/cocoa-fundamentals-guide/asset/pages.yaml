    \ view to respond to clicks, or it manages a collection of objects, or it coordinates\
    \ the major events of the application—it is designed to do one or more. But for\
    \ its contributions to be realized in the program, it must be able to communicate\
    \ with other objects. It must be able to send messages to other objects or receive\
    \ messages from other objects.\n\nBefore your object can send a message to another,\
