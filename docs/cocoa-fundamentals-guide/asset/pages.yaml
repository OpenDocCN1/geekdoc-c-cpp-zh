    # Class Clusters


    Class clusters are a design pattern that the Foundation framework makes extensive
    use of. Class clusters a group of private concrete subclasses under a public abstract
    superclass. The grouping of classes in this way simplifies the publicly visible
    architecture of an object-oriented framework without reducing its functional richness.
    Class clusters are based on the Abstract Factory design pattern discussed in “Cocoa
    Design Patterns” (page 137).


    # Without Class Clusters: Simple Concept but Complex Interface


    To illustrate the class architecture and its benefits, consider the problem of
    constructing a class hierarchy that defines objects to store numbers of different
    types (char, int, float, double). Because numbers of different types have many
    features (they can be converted from one type to another and can be represented
    as strings, for example), they could be represented by a single class. However,
    their storage requirements differ, so it is inefficient to represent them all
    by the same class. Taking this into consideration, one could design the class
    architecture depicted in Figure 2-10 to solve the problem.


    Figure 2-10 A simple hierarchy for number classes


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_94_0.png)


    Number is the abstract superclass that declares in its methods the operations
    common to its subclasses. However, it doesn''t declare an instance variable to
    store a number. The subclasses declare such instance variables and share in the
    programmatic interface declared by Number.


    So, this design is relatively simple. However, if the commonly used modifications
    of these basic C types are taken into account, the class hierarchy diagram looks
    more like Figure 2-11.


    Figure 2-11 A more complete number class hierarchy


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_94_1.png)


    The simple concept—creating a class to hold number values—can easily burgeon to
    over a dozen classes. The class cluster architecture presents a design that reflects
    the simplicity of the concept.


    Class Clusters 95

    2010-12-13 | 2010 Apple Inc. All Rights Reserved.'
