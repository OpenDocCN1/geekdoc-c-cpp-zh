    classes (such as NSFileManager in AppKit and UIView in UIKit) are not intended
    to be subclassed. If you do attempt such a subclass, you should proceed with caution.
    The implementations of certain framework classes are complex and tightly integrated
    into implementations of other classes and different parts of the operating system.
    It is difficult to duplicate correctly what a framework method does or anticipate
    effects the method might have. Changes that you make in some implementations could
    have far-reaching, unforeseen, unpleasant consequences.


    In some cases, you can get around these by using object composition, a general
    technique of assembling objects in a "host" object, which manages them to complex
    and highly customized behavior. Instead of inheriting directly from a complex
