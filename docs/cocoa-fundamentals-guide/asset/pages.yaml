  md: '# CHAPTER 2


    # Cocoa Objects


    Instead of retaining an object, you can copy it by sending a copy or copyWithZone:
    message. (Many, if not most, subclasses encapsulating some kind of data adopt
    or conform to this protocol.) Copying an object not only duplicates it almost
    resets its retain count to one (see Figure 2-6). The copy can be shallow or deep,
    depending on the nature of the object and its intended use. A deep copy duplicates
    the objects held as instance variables of the copied object, whereas a shallow
    copy duplicates only the references to those instance variables.


    In terms of usage, what differentiates copy from retain is the former claim the
    object for the sole use of its new owner; the new owner can mutate the copied
    object without regard to its origin. Generally you can copy an object instead
    of retaining when it is a valid object—that is, an object encapsulating primitive
    value. This is especially true when object is mutable, such as an instance NSString.
    For immutable objects, copy and retain can be equivalent and implemented similarly.


    Figure 2-6 Copying a received object


    | Retain count |

    | Creator | Client |

    | id anObj = [[MyClass alloc] 1 init]; | (void)doSomethingWith:(id)anObj { anivar
    = [anObj copy]; 1 // ... } |

    | [client doSomethingWith:anObj]; | message |

    | [anObj release]:0 | (void)setimeLater { if (anivar) [anivar release]:0 } |

    |


    You might have noticed a potential problem with this scheme for managing the object
    life cycle. An object that creates an object and passes it to another object cannot
    always know when it will release the object safely. There could be multiple references
    to the object on the stack, by some objects unknown to the creating object. If
    the creating object releases the created object and some other object sends a
    message to that-destroyed object, the program could crash. To get around this,
    Cocoa introduces a mechanism for deferred deallocation called autorelease.


    Autoreleasing uses autorelease pools (defined by the AutleasePool class). An autorelease
    pool is a collection of objects within an explicit scope that are marked for release.
    Autorelease pools can be nested. When you send an autorelease message, a reference
    to that object is put into the immediate autorelease pool. It is still a valid
    object, so objects within the scope defined by the autorelease pool can send messages
    to it. When program execution reaches the end of the scope, the pool is released
    and, as a consequence, all objects in the pool are released as well (see Figure
    2-7). If you are developing an application you may not need to set up an autorelease
    pool; the AppKit framework automatically sets up an autorelease pool scoped to
    the application''s event cycle.


