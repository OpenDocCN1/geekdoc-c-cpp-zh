- pgno: 70
  md: 'Memory Management. In memory-managed code, each call makes a claim of ownership
    on an object—object allocation and initialization, object copying, and retain—must
    be balanced with a call that removes claim—release and autorelease. When the object''s
    retain count (reflecting the number of claims on it) reaches zero, the object
    is deallocated and the memory occupied by the object is freed.


    In addition to being easier to implement, garbage-collected code has several advantages
    over memory-managed code. Garbage collection provides a simple, consistent model
    for all participating programs while avoiding problems such as retain cycles.
    It simplifies the implementation of accessor methods and makes it easier to ensure
    exception safety.


    > **Important:** Although memory-managed methods are no-ops in a garbage-collected
    application, there are still intractable differences between certain programming
    paradigms and patterns used in the two models. Therefore it is not recommended
    that you migrate a memory-managed application to a source base that tries to support
    both memory management and garbage collection. Instead, create a new full-version
    release that supports garbage collection.


    The following sections explore how garbage collection and memory management work
    by following the lifecycle of objects from their creation to their destruction.


    > **Further Reading:** To learn all about the garbage collection feature of Objective-C,
    read Garbage Collection Programming Guide. Memory management is discussed in detail
    in Memory Management Programming Guide.


    # How the Garbage Collector Works


    The work of garbage collection is done by an entity known as the garbage collector.
    To the garbage collector, objects in a program are either reachable or not reachable.
    Periodically the collector scans through the objects and those that are reachable.
    Those objects that aren''t reachable—the garbage objects—are finalized (that is,
    their finalize method is invoked). Subsequently, the memory they had is freed.


    The critical notion behind the architecture of the Objective-C garbage collector
    is the set of factors that constitute a reachable object. These factors start
    with an initial root set of global variables (including NSApp), stack variables,
    and external references (that is, outputs). The outputs of the initial root set
    are never treated as garbage and persist throughout the lifetime of the program.
    The collector adds to this initial set all objects directly reachable through
    strong references as well as all possible references in the stack calls of every
    thread. The garbage collector recursively follows strong references from one object
    to other objects, and from those objects to other objects, until all reachable
    objects have been counted (All references from one object to another are considered
    strong references by default; weak references must be explicitly marked as such).
    In other words, a nonzero point exists at the end of a cycle if the collector
    can reach it via root references.


    Figure-3 illustrates the general path the collector follows when it looks for
    reachable objects. But it also shows some important aspects of the garbage collector.
    The collector scans only a portion of a Cocoa''s virtual memory for reachable
    objects. Scanned memory includes the stacks of threads, global variables, and
    the auto zone, and an area of memory where all garbage-collected blocks of memory
    are disposed. The collector does not scan the malloc zone, which is the zone from
    which blocks of memory are allocated via the `malloc` function.'
