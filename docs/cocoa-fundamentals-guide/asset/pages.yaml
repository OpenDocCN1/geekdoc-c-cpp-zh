    > **Note:** The notification center delivers a notification to its observers synchronously.
    The posting object does not get control back until all notifications are sent.
    To post notifications asynchronously, you must use a notification queue (see "Notification
    Queues" (page 194). A notification queue posts notifications to the notification
    center after it delays specified notifications and coalesces notifications that
    are similar to specified criteria.


    **Figure 5-6** Posting and broadcasting a notification


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_190_0.png)


    Any object can post a notification and any object can register itself with the
    notification center as an observer of a notification. The object posting the notification,
    the object that the posting object includes in the notification, and the observer
    of the notification may be different objects or the same object.(Having the posting
    and observing object the same does have its uses, such as in idle-processing.)
    Objects that post notifications need not know anything about the observers. On
    the other hand, observers need to at least the notification name and the keys
    to any dictionary encapsulated by the notification object. ("The Notification
    Object") (page 193) describes what a notification object consists of.


    **Further Reading:** For a thorough discussion of the notification mechanism,
    see Notification Programming Topics.


    # When and How to Use Notifications


    As with delegation, the notification mechanism is a great tool for enabling communication
    between objects in an application. Notifications allow objects within an application
    to learn about changes that occur elsewhere in that application. Generally, an
    object registers to be an observer of a notification because it wants to make
    adjustments when a certain event occurs or is about to occur. For example, if
    a custom window wants to change its appearance when its window is resized, it
    can observe the NSWindowDidResizeNotification posted by that window object. Notifications
    also permit information to be passed between objects because a notification can
    include a dictionary of data related to the event.'
