  md: '# CHAPTER 2


    Cocoa Objects


    > Note: Other Cocoa classes can (and add) methods to NSObject through categories.
    These categories often informal protocols in delegation; they permit the delegate
    to choose which methods of the category to implement. However, these categories
    on NSObject are not considered part of the fundamental object interface.


    # Overview of Root-Class Methods


    The NSObject root class, along with the adopted NSObject protocol and other root
    protocols, specify the following interface and behavioral characteristics for
    all nonproxy Cocoa objects:


    +   **Allocation, initialization, and duplication.** Some methods of NSObject
    (including some from adopted protocols) deal with the creation, initialization,
    and duplication of objects:

    - The `alloc` and `allocWithZone:` methods allocate memory for an object from
    a memory zone and set the object to point to its runtime class definition.

    - The `init` method is for object initialization, the procedure that sets the
    variables of an object to a known initial state. The class methods `initialize`
    and `load` give classes a chance to initialize them.

    - The `new` method is a convenience method that combines allocation and initialization.

    - The `copy` and `copyWithZone:` methods make copies of any object that is a member
    of a class implementing these methods (using the NSCopying protocol); the `mutableCopy`
    and `mutableCopyZone:` (defined in the NSMutableCopying protocol) are implemented
    by classes that want to make mutable copies of their objects.


    See "Object Creation" (page 77) for more information.


    +   **Object retention and disposal.** The methods are particularly important
    to an object-oriented program that uses the traditional, explicit, form of memory
    management:

    - The `retain` method increments an object''s retain count.

    - The `release` method decrements an object''s retain count.

    - The `autorelease` method also decrements an object''s retain count, but in a
    deferred fashion.

    - The `retainCount` method returns an object''s current retain count.

    - The `dealloc` method is implemented by a class to release its objects'' instance
    variables and dynamically allocated memory.


    See "How Memory Management" (page 73) for more information about explicit memory
    management.


    +   **Introspection and comparison.** Many methods enable you to make runtime
    queries about an object. These introspection methods help to discover an object''s
    position in the class hierarchy, determine whether it conforms to a certain protocol,
    and test whether it is class of these methods.'
