  md: "# CHAPTER 2\n\nCocoa Objects\n\n> Further Reading: For a more detailed discussion\
    \ of issues relating to the allocation and initialization of Cocoa objects, see\
    \ \"The Runtime System\" in The Objective-C Programming Language.\n\n# Introspection\n\
    \n# Evaluating Inheritance Relationships\n\nOnce you know the class an object\
    \ belongs to, you probably know a bit about the object. You know its capabilities,\
    \ and what kinds of messages it can respond to. Even after introspection you are\
    \ unfamiliar with the class to which an object belongs, you now know enough to\
    \ send it messages.\n\nThe NSObject declares methods for determining an object's\
    \ position in the class hierarchy. These methods operate at different granularities.\
    \ The class and superclass instance methods, for example, return the Class objects\
    \ representing the class and superclass, respectively, of the receiver. These\
    \ methods require you to compare one Class object with another. Listing 2-7 gives\
    \ a simple (one might say trivial) example of their use.\n\n+   Listing 2-7 Using\
    \ the class and superclass methods\n\n```\nwhile (id anObject = [objectEnumerator\
    \ nextObject]) {\n  if ([self class] == [anObject superclass]) {\n    // do something\
    \ appropriate...\n  }\n}\n```\n\n> Note: Sometimes you use the class or superclass\
    \ methods to obtain an appropriate receiver for a class message.\n\nMore commonly,\
