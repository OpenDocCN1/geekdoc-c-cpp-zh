- pgno: 72
  md: '# How Memory Management Works


    In memory-managed Objective-C code, a Cocoa object exists over a life span which,
    potentially, has least distinct stages. It is created, initialized, and used (that
    is, objects send messages to it). It is possibly retained, copied or archived,
    and eventually it is released and destroyed. The following discussion charts the
    life of a typical object without needing any detail—yet.


    Let''s begin at the end, when objects are disposed of by garbage collection is
    turned off. In this context Cocoa and Objective-C opt for a voluntary, policy-driven
    procedure for keeping objects around and disposing of them when they''re no longer
    needed.


    This procedure policy rest on the notion of reference counting. Each Cocoa object
    carries with it an indicating number of other objects (or procedural code size)
    that are interested in its persistence. This is referred to as the object''s retain
    count (`retain` is used to avoid overloading the term “reference”). When you create
    an object, by using a class method or by using the alloc or alloc methods, Cocoa
    does a couple of important things:


    +   - It sets the object''s pointer—the NSObject class''s public instance variable—to
    point to the object''s class, integrating the object into the runtime''s view
    of the class hierarchy. (See “Object Creation” (page 77) for further information.)

    - It sets the object''s retain count—a kind of instance variable managed by the
    runtime—to one. (The assumption is that an object is created in its persistence.)


    After allocation, you generally initialize an object by setting its instance variables
    to reasonable initial values (NSNumber declares the init method as the prototype
    for this purpose). The object is now ready to be used; you send messages to it,
    pass it to other objects, and so on.


    > Note: Because an initializer can return an object other than the one explicitly
    allocated, the convention is to nest the alloc message in the init message (or
    initializer)—for example:

    `id anObj = [[MyApp alloc] init];`


    When you release an object—that is, a release message to it—decrements its retain
    count. If the retain count falls from one to zero, the object is deallocated.
    Deallocation takes in two steps: first, the object''s dealloc method is invoked
    to release instance variables and free dynamically allocated memory. The operating
    system destroys the object itself and reclaims the memory object once occupied.


    > Important: You should never directly invoke an dealloc method.


    What if you don''t want an object to go away any too soon? After receiving an
    object from somewhere you send it a retain message, the object''s retain count
    is incremented to two. Now two release messages are required before deallocation
    occurs. Figure 2-4 depicts this rather simplistic scenario.'
