    \ is a block object of the following declared type:\n\n```\ntypedef void (^RCTaskBlock)(NSString\
    \ *keyPath, id object, NSDictionary *change);\n```\n\nThese parameters are similar\
    \ to those of the observeValueForKeyPath:ofObject:change:context: method. Next,\
    \ the parameter class declares a single class factory method in which an RCTaskBlock\
    \ object is a parameter:\n\n```\n+ (id)receptionistForKeyPath:(NSString *)path\n\
    \    object:(id)obj\n    queue:(NSOperationQueue *)queue\n    task:(RCTaskBlock)task;\n\
    ```\n\nIt implements this method to assign the passed-in value to instance variables\
    \ of the created receptionist object and to add that object as an observer of\
