- pgno: 193
  md: '# CHAPTER 5


    Communicating with Objects


    A notification center delivers notifications to observers synchronously. In other
    words, the poster of the notification doesn''t regain control until all observers
    have received and processed the notification. To send notifications asynchronously,
    use a notification queue, which is described in "Notification Queues" (page 194).


    In a multithreaded application, notifications are always delivered in the thread
    in which the notification was posted, which may not be the same thread as an observer
    registered.


    # NSDistributedNotificationCenter


    Each task has a default notification center that you access with the `NSDistributedNotificationCenter`
    class method. This default notification center handles notifications that can
    be sent between tasks on a single computer. For communication between tasks on
    different computers, use distributed objects (*Distributed Objects Programming
    Topics*).


    Posting a distributed notification is an expensive operation. The notification
    gets to a systemwide server that then distributes it to all tasks that have registered
    for distribution. The latency between posting and the observer''s arrival in task
    is unbounded. In fact, if many notifications are posted and the server''s queue
    fills, notifications might be dropped.


    Distributed notifications are delivered via a task''s run loop. A task must be
    running a run loop in common modes, such as `DefaultRunLoopMode`, to receive a
    notification. If the receiving task is multithreaded, do depends on the notification
    arriving on the main thread. The notification is usually delivered to the main
    thread''s run loop, but other threads could also receive the notification.


    Whereas a regular notification center allows any object to be the notification
    object (that is, the object encapsulated by the notification), a distributed notification
    center is restricted to having an `NSString` object as its notification object.
    Because the posting object and the observer may be in different tasks, notifications
    cannot contain pointers to arbitrary objects. Therefore a distributed notification
    center requires a string to use as the notification object. Notification matching
    is based on this string, rather than based on an object pointer.


    # Notification Queues


    NSNotificationQueue (or simply, notification queues) act as buffers for notification
    centers (instances of `NSNotificationCenter`). A notification queue maintains
    notifications (instances of `NSNotification`) generally in a First In First Out
    (FIFO) order. When a notification rises to the front of the queue, the queue dispatches
    the notification to all objects registered as observers.


    Every thread has a default notification queue, which is associated with the default
    notification center for the task. Figure 5-7 illustrates this association. You
    can create your own notification queues and have multiple queues per center and
    thread.'
