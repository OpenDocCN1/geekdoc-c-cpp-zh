    # Singleton


    The Singleton design pattern ensures a class has only one instance, and provides
    a global point of access to it. The class tracks its own instance and ensures
    that no other instance can be created. Singleton classes are appropriate for situations
    where it makes sense for a single object to provide access to a global resource.


    # Framework Classes


    Several framework classes are singletons. They include NSFileManager, NSWorkspace,
    NSArray, and in UIKit, UIApplication. A process is limited to one instance of
    these classes. When a client asks for an instance, it creates a shared instance,
    which is lazily created upon the first request.


    # Uses and Limitations


    Using the shared instance returned by a singleton class is no different from using
    an instance of a nonsingleton class, except that you are prevented from copying,
    retaining, or releasing it (the related methods are reimplemented as null). You
    can create your own classes if the situation warrants it.


    > Further Reading: "Cocoa Objects" (page 55) explains how to create a singleton
    class.


    # Template Method


    The Template Method design pattern defines the skeleton of an algorithm in an
    operation, deferring steps to subclasses. The Template Method pattern lets subclasses
    redefine certain steps of an algorithm without changing the algorithm’s structure.'
