  md: '# CHAPTER 1


    # What Is Cocoa?


    Figure 1-1 Cocoa in the architecture of Mac OS X


    | User Experience | |

    |---|---|---|

    | Aqua | Dashboard | Accessibility |

    | Application Frameworks | | |

    | Carbon | Java | AppKit |

    | Graphics and Media (Application Services) | | |

