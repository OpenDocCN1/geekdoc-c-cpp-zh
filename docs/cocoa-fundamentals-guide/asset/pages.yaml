    Adding Behavior to a Cocoa Program


    within the same process.) NSOperation object represents a discrete task that can
    be executed only once. Generally, you use NSOperationQueue objects to schedule
    operations in a sequence by priority and interdependence dependency. An operation
    object that has dependencies does not execute until all of its dependent operations
    finish executing. An operation operates in a queue until it is explicitly removed
    or it finishes.


    > Note: The NSOperation and NSOperationQueue classes were introduced in Mac OS
    v10.5 and in the initial version of the iOS SDK. They are not available in earlier
    versions of Mac OS X.


    # Locks and Conditions


    Locks act as resource sentels for contending threads; they prevent threads from
    simultaneously accessing a shared resource. Several classes in Cocoa provide lock
    objects of different types.


    Table 3-1 Lock classes


    | Classes | Description |

    | --- | --- |

    | NSLock | Implements a mutex—a lock that enforces mutually exclusive access to
    a shared resource. Only one thread can acquire the lock and use the resource,
    blocking other threads until it releases the lock. |

    | NSRursiveLock | Implements a recursive lock—a mutex lock that can be acquired
    multiple times by the thread that currently owns it. The lock remains in place
    until each recursive acquisition of the lock has been balanced with a call that
    releases the lock. |

    | NSCondition | Both of these classes implement condition locks. This type of
    lock combines a semaphore with a mutex to implement locking behavior that is effective
    based on a program-defined condition. A thread blocks and waits for another thread
    to signal the condition, at which point it (or another waiting thread) is unblocked
    and continues execution. You can signal multiple threads simultaneously, causing
    them to unblock and continue execution. |


    NSConditionLock and NSCondition are similar in purpose and implementation; both
    are object-oriented implementations of pthread condition locks. The implementation
    of NSConditionLock is more thorough but less flexible (which other offers such
    as timeouts); it implements both the semaphore and the mutex locking for you.
    The implementation of NSCondition, on the other hand, wraps the pthread variables
    and mutex locks and requires you to do your own locking, signaling, and predicate
    state management. However, it is more flexible. This approach closely follows
    the implementation pattern for pthread conditions.


    # Interthread Communication


    When your program has multiple threads, those threads often need a way to communicate
    with each other. The condition-lock classes use pthread-based condition signaling
    (semaphores) as a way to communicate between threads. But Cocoa offers other resources
    for interthread communication.


