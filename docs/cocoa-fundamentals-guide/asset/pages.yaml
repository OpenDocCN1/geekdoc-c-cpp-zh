    as an observer of a property and then convert a KVO notification into an update
    task. Thus it must know what object it''s observing, the property of the object
    that it''s observing, what update task to execute, and what queue to execute it
    on. Listing 4-1 shows the initial declaration of the `RCReceptionist` class and
