    # Inheriting from a Cocoa Class


    A framework such as AppKit or UIKit defines a program model, because it is generic,
    many different types of applications can scale. Because the model is generic,
    it is not surprising that some framework classes are abstract or intentionally
    incomplete. A class often does much but leaves significant portions of the work
    unfinished or in a safe "default" fashion.


    An application often needs to create a subclass that fills these gaps in its super,
    supplying the pieces the framework class missing. A subclass is the primary way
    to add application-specific behavior to a framework. It inherits the ability to
    work with other objects from the framework. For example, if you create a subclass
    of NSObject (AppKit), instances of this class will appear to appear in an NSString
    object, just as NSButton, UITextField, and other framework-defined class objects
