    # What Is Cocoa?


    Core Data application—that is, the ultimate form in which object data is archived—can
    range from XML files to SQL databases. Core Data is ideally suited for applications
    that act as front ends for relational databases, but any Cocoa application can
    take advantage of its capabilities.


    The central concept of Core Data is the managed object. A managed object is simply
    a model object that is managed by Core Data, but it must be an instance of the
    NSManagedObject class or a subclass of that. You describe the managed objects
    of your Core Data application using a schema called a managed model. The model
    contains descriptions of an application''s managed objects (also referred to as
    entities). Each description specifies the attributes of an entity, its relationships
    with other entities, and metadata such as the names of the entity and the representing
    class.


    In a running Core Data application, an object known as a managed object context
    is responsible for a graph of managed objects. All managed objects in the graph
    must be registered with a managed object context. The context allows an application
    to add objects to the graph and remove them from it. It also tracks changes made
    to managed objects, the managed object context ensures that objects are in a valid
    state. When a Core Data application wants to retrieve data from its external data
    store it sends a fetch request—an object that specifies a set of criteria—to a
    managed object context. The managed object context returns the objects from the
    store that match the request after registering them


    A managed object context also functions as a gateway to an underlying collection
    of Core Data objects called the persistence store. The persistence stack mediates
    between the objects in your application and external data stores. Persistent stores
    are at the bottom of the stack. They map data in an external store—for example,
    an XML file—and corresponding objects in a managed object context. They don''t
    directly interact with managed object contexts, however. Above a persistence store
    in the stack is a persistent store coordinator, which presents a facade to one
    or more managed object contexts so that multiple persistence stores below it appear
    as a single aggregate store. Figure 1-10 shows the relationships between objects
    in the Core Data architecture.'
