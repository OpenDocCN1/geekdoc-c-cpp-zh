  md: '# CHAPTER 5

    Communicating with Objects


    When users choose an item from a menu, an action is sent to a target. Yet menus
    (NSMenu objects) and their items (NSMenuItem objects) are completely separate,
    in an architectural sense, from controls and cells. NSMenuItem implements the
    target-action mechanism for its own instances; an NS object has both target and
    action instance variables (and related accessor methods) and sends the action
    message to the target when a user chooses it.


    > Note: See Control and Cell Programming for Cocoa and Application Menu and Pop-up
    List Listing

    Topics for more information about the control-cell architecture.


    # Setting the Target and Action


    You can set the targets and actions of cells and controls programmatically or
    by using Interface Builder. For most developers and situations, Interface Builder
    is the preferred approach. When you use it to set controls and targets, Interface
    Builder provides visual confirmation, allows you to link the connections, and
    archives the connections to a nib file: procedure:


    +   1. Declare an action method in the header file of your custom class that has
    the IBAction qualifier.

    2. In Interface Builder, connect the control sending the message to the action
    of the target.


    If the action is handled by a subclass of your custom class or by an off-the-shelf
    AppKit or UIKit class, you can make the connection without declaring any action
    method. Of, if you declare an action method yourself, you must be sure to implement
    it.


    To set the action and target programmatically, use the following methods to send
    messages to a control or object:


    ```

    (void)setTarget:(id)anObject:

    (void)setAction:(SEL)aSelector:

    ```


    The following example shows how you might use these methods:


    ```

    [Cell setTarget:myController];

    [control action:@selector(deleteRecord)];

    [NSMenuItem action:@selector(showGuides:)]

    ```


    Programmatically setting the target and action has its advantages and in certain
    situations it is the only possible approach. For example, you might want the target
    or action to vary according to some runtime condition, such as whether a network
    connection exists or an inspector window has been loaded. Another example is when
    you are dynamically populating the lists of a pop-up menu, and you want each pop-up
    item to have its own action.


    # Actions Defined by AppKit


    The AppKit framework not only includes many NSAction-based controls for sending
    action messages, it defines action methods in many of its classes. Some of these
    actions are connected to default targets when you create a Cocoa application project.
    For example, the Quit command in the application menu is connected to the terminate
    method in the global object (NSApp).


    The Target-Action Mechanism

