  md: '# CHAPTER 4

    Cocoa Design Patterns


    When using the Core Data framework, you need a way to describe your model objects
    that does not depend on views and controllers. In a reusable design, views and
    controllers need a way to access model properties without introducing dependencies
    between them. The Core Data framework solves this problem by borrowing concepts
    and terms from database technology—specifically, the entity-relationship model.


    Entity-relationship modeling is a way of representing objects used to describe
    a source''s data in ways that allow those data structures to be mapped to objects
    in an object-oriented system. Note that entity-relationship modeling is not unique
    to Cocoa; a popular discipline with a set of rules and terms that are documented
    in database literature, is a representation that facilitates storage and retrieval
    of objects in a data source. A data source can be a database, a web service, or
    any other store. It is not dependent on any type of data source it can also be
    used to represent any kind of object and its relationship to other objects.


    In the entity-relationship model, the objects that hold data are entities, the
    components of an entity called attributes, and the relationships to other data-objects
    are called relationships. Together, attributes and relationships are known as
    properties. With these three simple components (entities, attributes, and relationships),
    you can model systems of complexity.


    Cocoa used a modified version of the traditional rules of entity-relationship
    modeling referred to in this document as object modeling. Object modeling is particularly
    useful in representing model objects in the Model-View-Controller (MVC) design
    pattern. This is not surprising even in a simple Cocoa application—that is, they
    are stored in a data container such as file.


    # Entities


    Entities are model objects. In the MVC design pattern, model objects are the objects
    in your application that encapsulate data and provide methods that operate on
    that. They are usually persistent but more importantly, model objects are not
    dependent on how the data is displayed to the user.


    For example, a structured collection of model objects (an object model) can be
    used to represent a company''s customer base, a library of books, or a network
    of computers. A library book has attributes—such as the book title, ISBN number,
    and count date—and relationships to other objects—such as the author and library
    member. In theory, if the parts of a system are identified, the system can be
    expressed as an object model.


    Figure 4-9 shows an example model used in an employee management application.
    In this model, Department models a department and Employee models an employee.


    Figure 4-9 Employee management application object diagram


    | Department | Employee |

    | --- | --- |

    | name | firstName |

    | budget | lastName |

    | salary |


    # Attributes


    Attributes represent structures that contain data. An attribute of an object may
    be a simple value, such as a scalar (for example, an integer, float, or double
    value), but can also be a C structure (for example an array of char values or
    an NSPoint structure) or an instance of a primitive class (such as, NSNumber,
    NSData,


