    The Cocoa version of MVC as a compound pattern has some similarities to the traditional
    version, and in fact it is quite to construct a working application based on the
    diagram in Figure 4-6. Using the bindings technology, you can easily create a
    Cocoa MVC application where views directly observe model objects to receive notifications
    of state changes. However, there is a theoretical problem with this design. View
    objects and model objects should be the most reusable objects in an application.
    View objects represent the "look and feel" of an operation and supports consistency
    in appearance and behavior is essential, and that requires highly reusable objects.
    Model objects by definition encapsulate the data associated with a problem domain
    and perform operations on that data. Design-wise, it''s best to keep model and
    view objects separate from each other, because that enhances their reusability.


    In Cocoa applications, notifications of state changes in model objects are communicated
    to view objects through controller objects. Figure 4-7 shows this different configuration,
    which appears much cleaner despite the involvement of two more design patterns.


