  md: '# What Is Cocoa?


    to them, and perform other tasks that can be done with objects. The elements of
    collection objects such as arrays and dictionaries must be objects. And many if
    not most methods of the Cocoa frameworks that take and return values such as strings,
    numbers, and dates require that these values be encapsulated in objects. (With
    string values, in particular, you should always use `NSString` objects and not
    C-strings.)


    Some classes for value objects have mutable and immutable variants—for example,
    there are the `NSMutableData` and `NSData` classes. The values encapsulated by
    immutable objects cannot be modified after they are created, whereas the values
    encapsulated by mutable objects can be modified. (“Object Mutability” (page 90)
    discusses mutable and immutable objects in detail.)


    The following are descriptions of what the more important value objects do:


    +   - Instances of the `NSValue` class encapsulate a single ANSI C or Objective-C
    data item—for example, scalar types such as floating-point values as well as pointers
    and structures

    - The `NSNumber` class (a subclass of `NSValue`) instantiates objects that contain
    numeric values such as integers, floats, and doubles.

    - Instances of the `NSData` class provides object-oriented storage for streams
    of bytes (for example, image data). The class has methods for writing data objects
    to the file system and reading them back.

    - The `NSDate` class, along with the supporting `NSTimeZone`, `NSCalendar`, `NSDateComponents`,
    and `NSLocale` classes, provide objects that represent times, dates, calendar,
    and locales. They offer methods for calculating date and time differences, for
    displaying dates and times in many formats, and for adjusting times and dates
    based on location in the world.

    - Objects of the `NSString` class (commonly referred to as *strings*) are a type
    of value object that provides object-oriented storage for a sequence of Unicode
    characters. Methods of `NSString` can convert between representations of character
    strings, such as between UTF-8 and a null-terminated array of bytes in a particular
    encoding. `NSString` also offers methods for searching, combining, and comparing
    strings and for manipulating file-system paths. Similar to `NSData`, `NSString`
    includes methods for writing strings to the file system and reading them back.


    The `NSString` class also has a few associated classes. You can use an instance
    of the `NSScanner` utility class to parse numbers and words from an `NSString`
    object. `NSCharacterSet` represents a set of characters that are used by various
    `NSString` and `NSScanner` methods. Attributed strings, which are instances of
    the `NSAttributedString` class, manage ranges of characters that have attributes
    such as font and kerning associated with them.


    Formatter objects—that is, objects derived from `NSFormatter` and its descendent
    classes—are not themselves value objects, but they perform an important function
    related to value objects. They convert value objects such as `NSDate` and `NSNumber`
    instances to and from specific string representations, which are typically presented
    in the user interface.


    # Collections


    Collections are objects that store other objects in a particular ordering scheme
    for later retrieval. Foundation defines three major collection classes that are
    common to both iOS and Mac OS X: `NSArray`, `NSDictionary`, and `NSSet`. As with
    many of the value classes, these collection classes have immutable and mutable
    variants. For example, once you create an `NSArray` object that holds a certain
    number of elements, you cannot add new elements or remove existing ones; for that
    purpose you need the `NSMutableArray` class. (To learn about mutable and immutable
    objects, see “Object Mutability” (page 90).)'
