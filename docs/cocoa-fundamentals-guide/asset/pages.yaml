    # ## Value Objects


    Value objects encapsulate values of primitive types, including strings, numbers
    (integers and floating-point values), dates, and even structures. They mediate
    access to these values and manipulate them in suitable ways. When you compare
    value objects of the same class, it is their encapsulated values that are compared,
    not their pointer values. Value objects are the attributes of other objects, including
    custom objects.


    Of course, you may choose to use scalars and other primitives directly in your
    program—after all, Objective-C—and in many cases using scalars is a reasonable
    thing to do. But in other situations, wrapping these values in objects is either
    advantageous or required. For example, because value objects are objects, you,
    at runtime, can detect their class, determine the messages that be sent'
