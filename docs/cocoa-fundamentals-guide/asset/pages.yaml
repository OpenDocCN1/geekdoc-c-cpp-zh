  md: '# CHAPTER 4

    Cocoa Design Patterns


    # View Hierarchy


    The views (NSView or UIView objects) in a window are internally structured into
    a view hierarchy. At the root of the hierarchy is a window (NSWindow or UIWindow
    object) and its content view, transparent view that fills the window''s content
    rectangle. Views that are added to the content view become subviews of it, and
    they become subviews of any views added to them. Except for the content view,
    a view has one (and only one) supervisor and zero or number of subviews. You perceive
    this as containment: a superview contains its subviews. Figure 4-2 shows the visual
    and structural aspects of the view hierarchy.


    **Figure 4-2** The view hierarchy, visual and structural


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_143_0.png)


    The view hierarchy is a structural architecture that plays a part in both drawing
    and event handling. A view has two bounding rectangles, its frame and its bounds,
    that affect how graphics operations with the view take place. The frame is the
    exterior boundary; it locates the view in its supervisor''s coordinate system,
    defines its size, and clips to the view''s edges. The bounds, the interior bounding
    rectangle, defines the internal coordinate system of the surface where the view
    draws itself.


    When a window is asked by the system to prepare itself for display, views are
    asked to render themselves before their subviews. When you send some messages
    to a view—for example, a message that requests a view to redraw itself—the message
    is propagated to supervisors. You can then treat a branch of the view hierarchy
    as a unified view.


    The view hierarchy is also used by the responder chain for handling events and
    action messages. See the summary of the responder chain in "Chain of Responsibility"
    (page 141).'
