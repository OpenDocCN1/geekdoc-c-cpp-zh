    # The Receptionist Design Pattern in Practice


    A KVO notification invokes the `observeValueForKeyPath:ofObject:change:context:`
    method implemented by an observer. If the property occurs on a secondary thread,
    the `observeValueForKeyPath:ofObject:change:context:` executes on that same thread.
    There the central object in this pattern, the receptionist acts as a thread intermediary.
    As Figure 4-5 illustrates, a receptionist is assigned as an observer of a model
    object''s property. The receptionist implements `observeValueForKeyPath:ofObject:change:context:`
    to redirect the notification received on a secondary thread to another execution
    queue—in this case. When the property changes, the receptionist receives a KVO
    notification. The receptionist immediately adds a block operation to the main
    operation queue; the block contains code—specified by the client—that updates
    the user interface appropriately.


