    # Cocoa Design Patterns


    Class clusters in Cocoa can generate only objects whose storage of data can vary
    depending on circumstances. The Foundation framework has class clusters for NSString,
    NSData, NSDictionary, NSSet, and NSArray objects. The public superclasses include
    these immutable classes as well as the complementary classes NSMutableString,
    NSMutableData, NSMutableDictionary, NSMutableSet, and NSMutableArray.


    # Uses and Limitations


    You use one of the public classes of a class cluster when you want to create immutable
    or mutable objects of the type represented by the cluster. With class clusters
    there is a trade-off between simplicity and extensibility. A class cluster simplifies
    the interface to a class and makes it easier to learn and use the class. However,
    it is generally more difficult to create custom subclasses of the abstractsuperclass
    of a class cluster.


    > Further Reading: "Class Clusters" (page 95) provides more information about
    class clusters in Cocoa.


    # Adapter


    The Adapter design pattern converts the interface of a class into another interface
    that clients expect. Adapter classes work together that otherwise could not because
    of incompatible interfaces. It decouples the client from the class of the targeted
    object.


    # Protocols


    A protocol is a language-level (Objective-C) feature that makes it possible to
    define interfaces that are instances of the Adapter pattern. A protocol is essentially
    a series of method declarations unassociated with a class. (In Java, interface
    is synonymous with protocol) If you want a client to communicate with another
    object, the object''s incompatible interfaces make it difficult, you can define
    a protocol. The class of the object then formally adopts the protocol and "conforms"
    to it by implementing one or more of the methods of the protocol. The protocol
    may require the conforming class to implement some of its methods and may leave
    the implementation of others optional. The client can then send messages to the
    object through the protocol interface.


    Protocols make a set of method declarations of the class hierarchy. They make
    it possible to group objects on the basis of conformance to a protocol as well
    as inheritance. The NSObject method conformsToProtocol permits you to verify an
    object''s protocol.


    Cocoa has informal protocols as formal protocols. An informal protocol is a category
    (see "Categories") class, making any object a potential implementation of any
    method it can (page 147). The methods in an informal protocol can be selectively
    implemented. Informal protocols are part of the implementation of the delegation
    mechanism in Mac OS (see "Delegation" (page 145)).


    Note that the design of protocols does not perfectly match the description of
    the Adapter pattern. But it achieves the goal of the pattern: allowing classes
    with otherwise incompatible interfaces to work together.


    # Uses and Limitations


    You use a protocol to declare an interface that is hierarchically unrelated classes
    are expected to conform to if they want. You can also use protocols to declare
    an interface of an object while concealing its class. The Cocoa frameworks include
    many formal protocols that enable subclasses'
