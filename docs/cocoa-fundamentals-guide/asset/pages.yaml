  md: "# Method Implementation and Protocol Conformance\n\nTwo of the more powerful\
    \ introspection methods of NSObject are respondsToSelector: and conformsToProtocol:.\
    \ These methods tell you, respectively, whether an object implements a certain\
    \ method and whether an object conforms to a specified formal protocol (that is,\
    \ adopts the protocol, if necessary, and implements all the methods of the protocol).\n\
    \nYou use these methods in a similar situation in your code. They enable you to\
    \ discover whether some potentially anonymous object can respond appropriately\
    \ to a particular message or set of messages before you send it any of those messages.\
    \ By making this check before sending a message, you can avoid the risk of runtime\
    \ exceptions resulting from unrecognized selectors. The AppKit framework implements\
    \ informal protocols—the basis of delegation—by checking whether delegates implement\
    \ a delegation method (using respondsToSelector:) prior to invoking that method.\n\
    \nListing 2-9 illustrates how you might use the respondsToSelector: method in\
    \ your code.\n\n# Listing 2-9 Using respondsToSelector:\n\n```\n- (void)doCommandBySelector:(SEL)aSelector\
    \ {\n    if ([self respondsToSelector:aSelector]) {\n        [self performSelector:aSelector\
    \ withObject:nil];\n    } else {\n        [_client doCommandBySelector:aSelector];\n\
    \    }\n}\n```\n\nListing 2-10 illustrates how you might use the conformsToProtocol:\
    \ method in your code.\n\n# Listing 2-10 Using conformsToProtocol:\n\n```\n//\
    \ ...\nif (![((id)testObject) conformsToProtocol:@protocol(NSMenuItem)]) {\n \
    \   NSLog(@\"Custom MenuItem, '%@', not loaded; it must conform to the 'NSMenuItem'\
    \ protocol.\\n\", [testObject class]);\n    [testObject release];\n    testObject\
    \ = nil;\n}\n```\n\n# Listing 2-8 Using isKindOfClass:\n\n```\nif ([item isKindOfClass:[NSData\
    \ class]]) {\n    const unsigned char *bytes = [item bytes];\n    unsigned int\
    \ length = [item length];\n    // ...\n}\n```\n\nBy learning that the object item\
    \ inherits from the NSData class, this code knows it can send it the NSData bytes\
    \ and length messages. The difference between isKindOfClass: and isMemberOfClass:\
    \ becomes apparent if you assume that item is an instance of NSMutabl eData. If\
    \ you use isMemberOfClass: instead of isKindOfClass:, the code in the conditionalized\
    \ block is never executed because item is not an instance of NSData but rather\
    \ of NSMutabl eData, a subclass of NSData."
