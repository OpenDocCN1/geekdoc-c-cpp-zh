  md: '# Memento


    Figure 4-4 View controllers in UIKit


    ![](img/0c5ea7638a6e08e6bdc6bc222975f6ee_150_0.png)


    The Memento pattern captures and externalizes an object''s internal state—without
    violating encapsulation—so that the object can be restored to this state later.
    The Memento pattern keeps the important state of a key object external from that
    to maintain cohesion.


    # Archiving


    Archiving converts the objects in a program, along with objects'' properties (attributes
    and relationships) into an archive that can be stored in the file system or transmitted
    between processes or across a network. The archive captures the object graph of
    program as an architecture-independent stream of bytes that preserves the identity
    of the object and the relationships among them. Because an object''s type is stored
    along with its data, an object decoded from a stream of bytes is normally instantiated
    using the same class of the object that was originally encoded.


    # Uses and Limitations


    Generally, you want to archive those objects in your program when state you want
    to preserve. Model objects always fall into this category. You write an object
    to archive by encoding it, and you read object from archive by decoding it. Encoding
    and decoding are operations that you perform using an NSCoder, preferably using
    the keyed archiving technique (requiring you to invoke methods of the NSKeyedArchiver
    and NSKeyedUnarchiver classes). The object being encoded and decoded must conform
    to the NSCoding protocol; the methods of this protocol are invoked during archiving.'
  merge: -1
  img_proc: true
