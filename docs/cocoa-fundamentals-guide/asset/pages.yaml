    # The Cocoa Frameworks


    What makes a Cocoa program? It''s not really the language, because you can use
    a variety of languages in Cocoa development. It''s not the development tools,
    because you could create a Cocoa application from the command line (although that
    would be a complex, time-consuming task). No, what all Cocoa frameworks have in—what
    makes them distinct—is they are composed of objects that inherit largely from
    the root class, and that are ultimately based on the Objective-C runtime. This
    statement is also true of all Cocoa frameworks.


    > **Note:** The statement about the root class needs to be first. The Foundation
    framework supplies another root, `NSProxy`; however, `NSProxy` is rarely used
    in Cocoa programming. Second, you could create your own root class, but that would
    be a lot of work (entailing the writing of code that interacts with the Objective-C
    runtime) and probably not worth your time.


    On any system there are many Cocoa frameworks, and Apple and third-party vendors
    are releasing more frameworks all the time. Despite this abundance of Cocoa frameworks,
    two of them stand out on each platform as core frameworks:


    +   - In OS X: Foundation and AppKit

    - In iOS: Foundation and UIKit


    The Foundation, AppKit, and UIKit frameworks are essential to Cocoa application
    development for Mac OS X unless you link against them. If you link against (and
    use the classes of) the AppKit, you cannot develop a Cocoa application for iOS
    unless you link against (and use the classes of) UIKit. Moreover, you cannot develop
    Cocoa software of any kind unless you link against (and use the classes of the
    Foundation framework. (Linking against the right frameworks in Mac OS X happens
    automatically when you link against the Cocoa umbrella framework.) Classes, functions,
    data types, and constants in Foundation and the AppKit have a prefix of "NS";
    classes, functions, data types, and constants in UIKit have a prefix of "UI".'
