    ```


    When the tag IBOutlet precedes the declarations of instance variables, it identifies
    an outlet (presumably) a connection anchored in a fib. The tag also enables Interface
    Builder and Xcode to synchronize their activities. When outlets are unarchived
    from an Interface Builder nib, the connections are automatically reestablished.
    ([Communicating with Objects](page 175)) discusses outlets in more detail.


    Instance variables can hold more than an object''s attribute, values of the client.
    Instance variables can hold private data that is used as the basis for task performed
    by the object; a backing store or a cache examples. (If data is not private, but
    is to be shared among instances of a class, use global variables instead of instance
    variables.)


    When you add instance variables to a subclass, follow these guidelines:


    +   - Add only instance variables that are absolutely necessary. The more instance
    variables you add, the more the instance size grows. And the more instances of
    your class that are created, the more of concern this becomes. If it is possible,
    capture a critical value from existing instance variables rather than add another
    instance variable to hold that value.

    - Again, for economy represent the instance data of the class efficiently. For
    example, if you want to specify a number of flags as instance variables, use a
    bit field instead of series of Booleans. Be aware, that there are archiving compilations
    with bit fields). If you might use an NSDictionary object to consolidate a number
    of related attributes as key-value pairs; if you do this, make sure that the keys
    are adequately documented.

    - Give the proper scope to your instance variables. Never scope a variable as
    @public as this violates the principle of encapsulation. Use @protected for instance
    variables if you know which are the likely subclasses of your class (such as the
    classes of your application) and you require efficient access of data. Otherwise,@private
    is a reasonable choice for high degree of implementation hiding. This implementation
    hiding is especially important for classes used by a framework and by applications;
    it permits the modification of the class implementation without needing to reclaim
    all clients.

    - Make sure there are declared property accessor methods for instance variables
    that are essential attributes or relationships of your class. Accessor methods
    and declared properties encapsulation by enabling the values of instance variables
    to be set and retrieved. ([Storing and Accessing Properties](page 123)) for more
    information on this subject.

    - If you indent your subclass to be public—that is, you anticipate that other
    subclass it—pad the end of the instance variable list with a reserved field, typically
    used as id. This reserved field helps to ensure binary compatibility, at any time
    in the future, you need to add another instance variable to the class. See ([When
    the Class Is Public (Mac OS X)](page 132)) for more information on preparing public
    classes.


