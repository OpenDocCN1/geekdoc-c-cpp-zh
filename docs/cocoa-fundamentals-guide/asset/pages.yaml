    goes in hand with a view hierarchy, which you get when you make a viewSubview
    of a window''s content view. If you have a custom added to a view hierarchy, it
    becomes part of the responder chain. If the appropriate NSRResponder or UIResponder
    methods, you can receive and handle event messages. A custom object that is a
    delegate of a view object or the global object (NSApp in AppKit) can also receive
    and handle those messages.


    You can also programmatically inject custom responders into the responder chain
    and you can programmatically manage the order of responders.


    > Further Reading: The AppKit responder chains for handling events and action
    messages for handling errors are described in Cocoa Event Handling Guide and Error
    Handling Programming Guide. The UIKit responder chain is described in Event Handling
    Guide for iOS. The view hierarchy is a related design pattern that is summarized
    in Composite (page 143).


    # Command


    The Command design pattern encapsulates a request as an object, letting you parameter
    clients with different requests, query or log requests, and support undo operations.
    The request object binds together one or more actions on a specific receiver.
    The Command pattern separates an object making a request from the object that
    receive and execute that request.


    # Invocation Objects


    An instance of the NSInvocation class encapsulates an Objective-C message. An
    invocation object contains a target object, selector, and method parameters. You
    can dynamically change the target of the message dispatched by the invocation
    as well as its parameters; once the invocation is executed, you can also return
    the value from the object. With a single invocation object, you can repeatedly
    invoke a message with multiple variations in target and parameters.


    The creation of an NSInvocation requires an NSMethodSignature object, which is
    an object that encapsulates information related to the parameters and return value
    of a method. NSMethodSignature object, in turn, is created from a method selector.
    The implementation of NSInvocation also uses functions of the Objective-C runtime.


    # Uses and Limitations


    NSInvocation objects are part of the programmatic interfaces of distributed objects,
    under management, message forwarding, and timers. You can use invocation objects
    in similar contexts where you need to decouple an object sending a message from
    the object that receives the message.


    The distributed objects technology is for interprocess communication. See "Proxy"
    (page 154) for more on distributed objects.'
