  md: '# Cocoa Design Patterns


    # Keys


    You specify properties of a model using a simple key, often a string. The corresponding
    view or controller uses the key to look up the corresponding attribute value.
    This design enforces the notion that the attribute itself doesn''t necessarily
    contain the data—the value can be indirectly obtained or derived.


    Key-value coding is used to perform this lookup; it is a mechanism for accessing
    an object''s properties indirectly in, in certain contexts, automatically. Key-value
    coding works by using the name of the object''s properties—typically its instance
    variables or accessor methods—as keys to access the values of those properties.


    For example, you might obtain the name of a Department object using a key. If
    the Department object either has an instance variable or a method called name
    then a value for the key can be returned (if it either, an error is returned).
    Similarly, you might obtain Employee attributes using the firstName, lastName,
    and salary keys.


    # Values


    All values for a particular attribute of a given entity are of the same data type.
    The type of an attribute is specified in the declaration of its corresponding
    instance variable or in the return of its accessor method. For example, the type
    of the Department object name may be an NSString object in Objective-C.


    Note that key-value coding returns only object values. If the return type or the
    data type for the specific accessor method or instance variable used to supply
    the value for a specified key is not an object, then an NSNumber or NSValue object
    is created for that value and returned in its place. If the name attribute of
    Department is of NSString, then using key-value coding, the value returned for
    the name key of Department object is an NSString object. If the budget attribute
    of Department is of float, then using key-value coding, the value returned for
    the budget key of a Department object is NSNumber object.


    Similarly, when you use key-value coding, if the data type required by the appropriate
    accessor instance variable for the specified key is not an object, then the value
    is extracted from the passed object using the appropriate typeValue method.


    The value of a to-one-relationship is simply the destination of relationship.
    For example, the value of the department property of an Employee object is a Department
    object. The value of a to-many relationship is the collection object. The collection
    can be a set or an array. If you use Core Data it is a set; otherwise, it is typically
    an array) that contains the destinations of that relationship. For example, the
    value of the employees property of an Department object is a collection containing
    Employee objects. Figure 4-13 shows an example object graph for the employee management
    application.'
