    # A Bit of History


    Many years ago Cocoa was known as NeSTEP: NeXT Computer developed and released
    version 1.0 of NeSTEP in September of 1989, and versions 2.0 and 3.0 followed
    not far behind (in 1990 and 1992, respectively). In this early phase, NeSTEP was
    more than an application environment; the term referred to the entire operating
    system, the windowing and imaging system (which was based on Display PostScript),
    the Mach kernel, device drivers, and so on.


    Back then, there was no Foundation framework. Indeed, there were no standard libraries
    (dynamically shared) were known as kits, the most prominent of them being Application
    Kit. Much of the role that Foundation now occupies was taken by an assortment
    of functions, structures, constants, and other types. Application Kit itself had
    a much smaller set of classes than it does today. Figure 1-11 shows a class hierarchy
    here of NeSTEP 0.9 (1988).'
