  md: '# Entry and Exit Points


    The Cocoa framework sends messages to an object at various points in the object''s
    life. Almost all objects (including classes, which are really objects themselves)
    receive messages at the beginning of their runtime life and just before their
    destruction. The methods invoked by these messages (if implemented) are hooks
    that allow the object to perform tasks relevant to the moment. These methods are
    (in the order of):


    +   1. `initialize`-This method enables a class to initialize itself before it
    or its instances any other messages. Superclasses receive this message before
    subclasses. Classes that use the old `initialize` mechanism implement `initialize`
    to set their class version. Other possible uses are registering a class for service
    and initializing some global state that is used by all instances. However, it''s
    better to do these kinds of tasks lazily (that is, the first time they''re needed)
    in an instance method rather than `initialize`.


    +   2. `init` (or other initializer)-You must implement `init` or some other initializer
    to initialize the state of the instance unless work done by the superclass''s
    designated initializer is sufficient for your class. See "Object Creation" (page
    77) for information on initializers, including designated initializers.


    +   3. `initWithCoder`-If you expect objects of your class to be archived—for
    examples, your class—should adopt `NSCoding` protocol and implement its two methods,
    `initWithCoder` and `encodeCoder`. In these methods you must decode and encode,
    the instance variables of the object in a format suitable for archive. You can
    use the decode and encoding methods of `NSCoding` for this purpose or the key-value
    archiving facilities of `NSKeyedArchiver` and `NSKeyedUnarchiver`. When the object
    is unarchived without being explicitly, the initializer is invoked. After decoding
    the instance-values, you assign them to your attributes, retaining or copying
    them if necessary. For more on this, see *Archives and Serializations Programming*.


    +   4. `awakeFromNib`-When an application loads a file, an `awakeFromNib` message
    is sent to each object loaded from the archive, but only if it can respond to
    the message, and only after all the objects in the archive have been loaded. When
    an object receives an `awakeFromNib` message, it is guaranteed to have all its
    outlet instance variables set. The object that owns the file (File''s Owner) implements
    this to perform programmatic initializations that require outlet and target-connections
    to be set.


    +   5. `encodeWith`-Implement this if your class should be archived. This method
    is invoked just before the destruction of the object. The design of `initCoder`
    however:


    +   6. `dealloc` or `finalize`-In memory-managed programs, the `dealloc` method
