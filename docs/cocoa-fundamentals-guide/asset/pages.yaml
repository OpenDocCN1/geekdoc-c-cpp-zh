    from the root class NSObject; although without inheritance, the class manages,
    extends the instance itself. To clients it could appear to be a subclass of the
    complex subclass, although it probably won''t share the interface of the subclass.
    The framework class NSAttributedString gives an example of object composition.
    NSAttributedString holds an NSString as an instance variable, is a class with
