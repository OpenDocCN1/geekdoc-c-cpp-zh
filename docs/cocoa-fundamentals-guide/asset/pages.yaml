    # The Dynamism of Objective-C


    Objective-C is a very dynamic language. Its dynamism frees a program from compile-time
    and link-time constraints and shifts much of the responsibility for symbol resolution
    to runtime, when the user is in control. Objective-C is more dynamic than any
    other programming languages because its dynamism springs from three:


    +   - Dynamic typing—determining the class of an object at runtime


    +   - Dynamic binding—determining the method to invoke at runtime


    +   - Dynamic loading—adding new modules to a program at runtime


    For dynamic typing, Objective-C introduces the `id` data type, which can represent
    any Cocoa object. A typical use of this generic object type is shown in this part
    of the code example from [Listing 2-2](page 55):


    ```

    id word;

    while (word = nextObject()) // do something with ''word'' variable....

    ```


    The `id` data type makes it possible to substitute any type of object at runtime.
    You can let runtime factors dictate what kind of object is be used in your code.
    Dynamic typing permits associations between objects to be determined at runtime
    rather than forcing them to be encoded in a static. Static type checking at compile
    time may ensure stricter data integrity, but in exchange for stricter integrity,
    dynamic typing gives your program much greater flexibility. By object introspection
    (for example, a dynamically typed, anonymous object what class it is) you can
    verify the type of an object at runtime and validate its suitability... check
    the types of objects you need to).'
