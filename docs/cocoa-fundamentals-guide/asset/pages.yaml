    # Cocoa Objects


    The runtime''s message-dispatch machinery enables dynamic binding. When you send
    a message to a dynamically typed object, the runtime uses the receiver''s pointer
    to locate the object''s class, and from there the implementation to invoke. The
    method is dynamically bound to the message. You don''t have to do anything special
    in your Objective-C code to reap the benefits of dynamic binding. It happens routinely
    and transparently every time you send a message, to a dynamically typed object.


    Dynamic loading, the final type of dynamism, is a feature of Cocoa that depends
    on Objective-C for runtime. With dynamic support, a Cocoa program can load executable
    code and resources as they''re needed instead of having to load all program components
    at launch time. The executable code (which is linked to) often contains new classes
    that become integrated into the runtime image of the program. Both code and resources
    (including nib files) are packaged in bundles and are explicitly loaded with methods
    defined in NSBundle class.


    This "lazy-loading" of program code and resources improves performance by placing
    lower memory demands on the system. Even more importantly, loading makes applications
    extensible. You can devise a plug-in architecture for your application that you
    and other developers to customize with additional modules that the application
    can dynamically load months or years after the application is released. If the
    design is right, the classes in modules will not clash with the classes already
    in place because each encapsulates its implementation and has its own name.


    # Extensions to the Objective-C Language


    Objective-C features four types of extensions that are powerful tools in software
    development: categories, protocols, declared properties, and fact enumeration.
    Some extensions introduce different techniques for declaring methods and associating
    them with a class. Others offer convenient ways to declare and access object properties,
    quickly over collections, handle exceptions, and perform other tasks.


    # Categories


    Categories give you a way to add methods to a class without having to make a subclass.
    The methods in the category become part of the class type (within the scope of
    your program) and are inherited by all the class subclasses. There is no difference
    between the original methods and the added methods. You can send a message to
    any instance of the class (or its) to invoke a method defined in the category.


    Categories are more than a convenient way to add behavior to a class. You can
    also use categories to compartmentalize methods, grouping related methods in different
    categories. Categories can be particularly helpful for organizing large classes;
    you can put different categories in different source files, for instance, several
    developers working on the class.


    You declare and implement a category just as you do a subclass. Syntactically,
    the only difference is the name of the category, which follows the @interface
    or @implementation directive and is in parentheses. For example, say you want
    to add a method to the NSArray class that prints the description of a collection
    in a more structured way. In the header file for the category, you would write:


