  md: "> **Further Reading:** To learn about approaches to implementing the `finalize`\
    \ method, read “Implementing a finalize Method” in *Garbage Collection Programming\
    \ Guide.*\n\n# Class Factory Methods\n\nClass factory methods are implemented\
    \ by a class as a convenience for clients. They combine allocation and initialization\
    \ in one step and return the created object. However, the client receiving this\
    \ object does not own the object and thus (per the object-ownership policy) is\
    \ not responsible for releasing it. These methods are of the form + (`type`)`className`...\
    \ (where `className` excludes any prefix).\n\nCocoa provides plenty of examples,\
    \ especially among the “value” classes. `NSDate` includes the following class\
    \ factory methods:\n\n```\n+ (id)dateWithTimeIntervalSinceNow:(NSTimeInterval)secs;\n\
    + (id)dateWithTimeIntervalSinceReferenceDate:(NSTimeInterval)secs;\n+ (id)dateWithTimeIntervalSince1970:(NSTimeInterval)secs;\n\
    ```\n\nAnd `NSData` offers the following factory methods:\n\n```\n+ (id)dataWithBytes:(const\
    \ void *)bytes length:(unsigned)length;\n+ (id)dataWithBytesNoCopy:(void *)bytes\
    \ length:(unsigned)length;\n+ (id)dataWithBytesNoCopy:(void *)bytes length:(unsigned)length\
    \ freeWhenDone:(BOOL)b;\n+ (id)dataWithContentsOfFile:(NSString *)path;\n+ (id)dataWithContentsOfURL:(NSURL\
    \ *)url;\n+ (id)dataWithContentsOfMappedFile:(NSString *)path;\n```\n\nFactory\
    \ methods can be more than a simple convenience. They can not only combine allocation\
    \ and initialization, but the allocation can inform the initialization. As an\
    \ example, let’s say you must initialize a collection object from a property-list\
    \ file that encodes any number of elements for the collection (`NSString` objects,\
    \ `NSData` objects, `NSNumber` objects, and so on). Before the factory method\
    \ can know how much memory to allocate for the collection, it must read the file\
    \ and parse the property list to determine how many elements there are and what\
    \ object type these elements are.\n\nAnother purpose for a class factory method\
    \ is to ensure that a certain class (`NSWorkspace`, for example) vends a singleton\
    \ instance. Although an `init...` method could verify that only one instance exists\
    \ at any one time in a program, it would require the prior allocation of a “raw”\
    \ instance and then, in memory-managed code, would have to release that instance.\
    \ A factory method, on the other hand, gives you a way to avoid blindly allocating\
    \ memory for an object that you might not use (see Listing 2-6).\n\n# Listing\
    \ 2-6    A factory method for a singleton instance\n\n```\nstatic AccountManager\
    \ *DefaultManager = nil;\n\n+ (AccountManager *)defaultManager {\n    if (!DefaultManager)\
    \ DefaultManager = [[self allocWithZone:NULL] init];\n    return DefaultManager;\n\
    }\n```"
