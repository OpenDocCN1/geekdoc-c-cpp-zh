  md: '# Communicating with Objects


    > Note: In memory management, a nonretained reference is known as a *weak reference*,
    which is something different from a weak reference in a garbage-collected environment.
    In the latter, all references to objects are considered strong by default and
    thus visible to the garbage collector; weak references, which must be marked with
    the `__weak` type modifier, are not visible. In garbage collection, retain cycles
    are not a problem.


    The object-ownership policy in memory management recommends that owned objects
    should be retained and archived unconditionally, and referenced (but not owned)
    objects should be retained and archived conditionally. The practical intent of
    this ownership policy is to avoid circular references, a situation where two objects
    retain each other (This is often called a *retain cycle*.) Retaining an object
    creates two objects retain each other, neither object ever gets deallocated until
    all of its strong references are released. If the connection between them cannot
    be broken.


    You must ensure that an object acting as a delegate retains a valid reference
    or your application can crash. When that object is deallocated, you need to remove
    the delegate link by sending a `setDelegate:` message with a `nil` parameter to
    the other object. You normally send these messages from the object''s `dealloc`
    method.


    If you create a subclass from a Cocoa framework class with a delegate, data source,
    observer, or target, you should never explicitly retain the object in your subclass.
    You should create a nonretained reference to it and archive conditionally.


    > **Further Reading:** For on the ownership policy, weak references, and circular
    references in memory management, see “Object Ownership and Disposal” in *Memory
    Management Programming Guide*. For a summary of strong references and weak references
    in garbage collection, see “Garbage Collection for Cocoa Essentials” in *Garbage
    Collection Programming Guide* (available only in the Mac OS X Developer Library).'
