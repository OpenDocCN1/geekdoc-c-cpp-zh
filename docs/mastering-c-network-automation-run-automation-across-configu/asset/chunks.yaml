    # Project Overview


    - Setting up `GNS3`, `Eclipse IDE`, `cpp-netlib`, `Boost`, `OpenSSL`, and `zlib`
    libraries

    - Configure the ports, hosts, and servers using C++ scripting

    - Writing, testing, and validating network automation scripts in both, test and
    production environment

    - Building docker images, running containers, and managing container deployments

    - Using `Ansible` for server provisioning, automated system identification and
    managing auto-updates

    - Automating container scheduling, service discovery, and load balancing

    - Setting up `Kubernetes` cluster, `Nginx` ingress, implementing service mesh,
    and automating firewall configuration

    - Working with `AWS`, `Azure` and `Google Cloud` Networking Services for Cloud
    Automation

