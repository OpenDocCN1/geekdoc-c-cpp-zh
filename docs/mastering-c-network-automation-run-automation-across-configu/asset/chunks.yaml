    --with-openssl=<OPENSSL_DIR> --with-zlib=<ZLIB_DIR>makesudo make installReplace
    the <BOOST_LIB_DIR>, <BOOST_INCLUDE_DIR>, <OPENSSL_DIR>, and <ZLIB_DIR> with the
