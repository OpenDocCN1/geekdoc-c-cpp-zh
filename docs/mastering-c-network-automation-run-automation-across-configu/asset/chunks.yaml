  trans: '


    1. 登录 AWS 管理控制台并导航到 VPC 控制板。

    2. 点击“Create VPC”（创建 VPC）按钮。

    3. 在“Create VPC”（创建 VPC）对话框中，输入 VPC 名称、CIDR 块以及任何其他额外信息。

    4. 点击“Create”（创建）按钮创建 VPC。

    5. VPC 创建完成后，导航到“Subnets”（子网）部分并点击“Create Subnet”（创建子网）按钮。

    6. 在“Create Subnet”（创建子网）对话框中，输入子网名称、VPC ID、可用区和 CIDR 块。

    7. 点击“Create”（创建）按钮创建子网。

    8. 重复步骤 5-7，根据需要创建额外的子网。

    9. 导航到“Internet Gateways”（互联网网关）部分并点击“Create Internet Gateway”（创建互联网网关）按钮。

    10. 为互联网网关输入名称并点击“Create”（创建）按钮创建网关。

    11. 网关创建完成后，点击“Attach to VPC”（绑定到 VPC）按钮并选择您想要绑定网关的 VPC。

    12. 导航到“Route Tables”（路由表）部分并点击“Create Route Table”（创建路由表）按钮。

    13. 为路由表输入名称并选择您想要关联该路由表的 VPC。

    14. 路由表创建完成后，点击“Routes”（路由）标签页，然后点击“Edit”（编辑）按钮。

    15. 输入目标 CIDR 块，并选择您在步骤 9 中创建的互联网网关。

    16. 点击“Save”（保存）按钮保存该路由。

    17. 导航到“Network ACLs”（网络访问控制列表）部分并点击“Create Network ACL”（创建网络 ACL）按钮。

    18. 为网络 ACL 输入名称并选择您想要关联该网络 ACL 的 VPC。

    19. 网络 ACL 创建完成后，点击“Inbound Rules”（入站规则）或“Outbound Rules”（出站规则）标签页来配置网络 ACL 规则。

    20. 重复步骤 17-19，根据需要创建额外的网络 ACL。


    '
- fmt: "\nYou have now successfully created an Amazon VPC using the AWS Management\
    \ Console.\n\n# Sample Program to create VPC\nLet's say we want to create a VPC\
    \ in the US East (Ohio) region with a CIDR block of `10.0.0.0/16`, and we want\
    \ to create two subnets within this VPC - one in `us-east-2a` with a CIDR block\
    \ of `10.0.1.0/24` and another in `us-east-2b` with a CIDR block of `10.0.2.0/24`.\n\
    \nFollowing are the steps to create this VPC and subnets using the AWS CLI:\n\n\
    Open the command prompt and ensure that the AWS CLI is installed and configured.\
    \ To create the VPC, use the following command:\n```bash\naws ec2 create-vpc --cidr-block\
    \ 10.0.0.0/16 --region us-east-2\n```\nThis will create a VPC with the specified\
    \ CIDR block in the specified region.\n\nNext, we need to retrieve the ID of the\
    \ VPC that was just created. We can use the following command to do this:\n```bash\n\
    aws ec2 describe-vpcs --filters Name=cidr,Values=10.0.0.0/16 --region us-east-2\
    \ --query 'VPCs[0].VPCId'\n```\nThis command will return the ID of the VPC that\
    \ was just created.\n\nNow we can create the two subnets within the VPC. To create\
    \ the subnet in `us-east-2a`, use the following command:\n```bash\naws ec2 create-subnet\
    \ --vpc-id <vpc-id> --cidr-block 10.0.1.0/24 --availability-zone us-east-2a --region\
    \ us-east-2\n```\nReplace `<vpc-id>` with the ID of the VPC that was created in\
    \ step 3.\n\nSimilarly, to create the subnet in `us-east-2b`, use the following\
    \ command:\n```bash\naws ec2 create-subnet --vpc-id <vpc-id> --cidr-block 10.0.2.0/24\
    \ --availability-zone us-east-2b --region us-east-2\n```\nAgain, replace `<vpc-id>`\
    \ with the ID of the VPC that was created in step 3.\n\nWe have now created a\
    \ VPC with two subnets in the specified region. We can now use this VPC to launch\
    \ EC2 instances, create load balancers, and perform other tasks within this isolated\
    \ network.\n\n# Using IPv6 in VPC\nTo use IPv6 in an Amazon VPC, you need to enable\
    \ IPv6 support for the VPC and then configure the necessary settings for the subnets\
    \ and network interfaces.\n\nFollowing are the steps to enable IPv6 for an Amazon\
    \ VPC:\n\n### Open Amazon VPC Console\nGo to the Amazon VPC console at `https://console.aws.amazon.com/vpc/`\
    \ and sign in with your AWS account.\n\n### Enable IPv6 for VPC\nSelect the VPC\
    \ for which you want to enable IPv6 and choose \"Actions\" > \"Edit CIDRs\". In\
    \ the \"IPv6 CIDRs\" section, enter the IPv6 block that you want to assign to\
    \ the VPC. You can use a publicly routable IPv6 block or a private IPv6 block.\
    \ Click \"Save\".\n\n### Configure Subnets\nAfter enabling IPv6 for the VPC, you\
    \ need to configure the subnets to use IPv6. Select a subnet and choose \"Actions\"\
    \ > \"Edit IPv6 CIDRs\". Enter the IPv6 block that you want to assign to the subnet.\
    \ You can assign a separate IPv6 block to each subnet or use the same IPv6 block\
    \ for all the subnets in the VPC. Click \"Save\".\n\n### Configure Network Interfaces\n\
    After configuring the subnets, you need to configure the network interfaces to\
    \ use IPv6. Select a network interface and choose \"Actions\" > \"Attach/Replace\
    \ Network Interface\". In the \"Advanced Details\" section, select the \"IPv6\
    \ addresses\" tab and enter the IPv6 addresses that you want to assign to the\
    \ network interface. You can assign one or more IPv6 addresses to a network interface.\n\
    \n### Verify IPv6 Connectivity\nAfter configuring the VPC, subnets, and network\
    \ interfaces to use IPv6, you can verify the connectivity by launching an EC2\
    \ instance in the VPC and checking the IPv6 addresses assigned to it. You can\
    \ also use tools such as `ping6` and `traceroute6` to test the IPv6 connectivity.\n\
    \nIn summary, to use IPv6 in an Amazon VPC, you need to enable IPv6 support for\
    \ the VPC, configure the subnets to use IPv6, and configure the network interfaces\
    \ to use IPv6. Once the configuration is complete, you can verify the IPv6 connectivity\
    \ by launching an EC2 instance and testing the connectivity.\n\n# AWS Network\
    \ Interfaces (ENI, ENA, EFA)\nAmazon Web Services (AWS) provides different types\
    \ of network interfaces for different use cases. These interfaces are:\n\n###\
    \ Elastic Network Interface (ENI)\nENI is a virtual network interface that you\
    \ can attach to an instance in a VPC. It allows you to attach additional network\
    \ interfaces to an instance, and you can also detach them and move them to other\
    \ instances within the same VPC. You can use ENI to create redundancy, increase\
    \ network throughput, and apply security policies to network traffic.\n\n### Elastic\
    \ Network Adapter (ENA)\nENA is a network interface that provides high throughput\
    \ and low-latency networking. It is optimized for HPC and machine learning workloads\
    \ that require high bandwidth and low latency.\n\n### Elastic Fabric Adapter (EFA)\n\
    EFA is a network interface that provides low-latency and high-bandwidth communication\
    \ between instances in a cluster. It is designed for HPC workloads that require\
    \ low-latency communication between instances.\n\nENI, ENA, and EFA differ in\
    \ their use cases, performance characteristics, and features. ENI is a general-purpose\
    \ network interface that provides basic networking capabilities. ENA provides\
    \ high throughput and low latency networking, while EFA provides low-latency communication\
    \ for HPC workloads.\n\nENI supports IPv4 and IPv6 addressing, while ENA and EFA\
    \ support only IPv4 addressing. However, ENA and EFA can be used with IPv6-enabled\
    \ VPC using IPv4-in-IPv6 tunneling. To use ENI, ENA, or EFA, you need to create\
    \ a subnet in VPC and launch an instance in that subnet. You can then attach the\
    \ network interface to the instance and configure the network settings accordingly.\n\
    \n# Configure ENI for VPC\nTo configure an Elastic Network Interface (ENI) for\
    \ VPC in Amazon Web Services (AWS), follow the steps:\n\n1. **Navigate to Amazon\
    \ VPC Console**: Open the AWS Management Console and select the VPC service.\n\
    2. **Create a Subnet**: Navigate to the \"Subnets\" section of the console, click\
    \ \"Create subnet,\" and follow the prompts to create a new subnet.\n3. **Create\
    \ a Security Group**: Navigate to the \"Security Groups\" section of the console,\
    \ click \"Create security group,\" and follow the prompts to create a new security\
    \ group.\n4. **Create ENI**: Navigate to the \"Network Interfaces\" section of\
    \ the console, click \"Create network interface,\" and follow the prompts to create\
    \ a new ENI.\n5. **Attach ENI to Instance**: Select the newly created ENI from\
    \ the list in the \"Network Interfaces\" section, click \"Actions,\" and then\
    \ \"Attach.\" Select the instance to which you want to attach the ENI and click\
    \ \"Attach.\"\n6. **Configure ENI**: After attaching the ENI to the instance,\
    \ you can configure the IP address and other settings following the instructions\
    \ in the Amazon EC2 documentation.\n\n# Configure ENA for VPC\nElastic Network\
    \ Adapter (ENA) is a network interface that provides enhanced networking on Amazon\
    \ EC2 instances. ENA is designed to deliver higher performance for larger workloads\
    \ such as High Performance Computing (HPC), machine learning, and data analytics.\
    \ By default, ENA is enabled on supported EC2 instances. To configure ENA for\
    \ a VPC, you need to follow the steps:\n\n1. **Choose an Amazon EC2 instance that\
    \ supports ENA**: You can check the instance type compatibility for ENA on the\
    \ AWS documentation.\n2. **Launch the Amazon EC2 instance with the appropriate\
    \ Amazon Machine Image (AMI)** that has the ENA driver installed. Amazon Linux\
    \ 2, Ubuntu 14.04, 16.04, 18.04, and 20.04, and Windows Server 2016 and 2019 AMIs\
    \ are preconfigured with the ENA driver.\n3. **Verify that the ENA driver is installed\
    \ on the instance**: To do this, run the following command:\n```bash\nmodinfo\
    \ ena\n```\nThis command will display information about the installed ENA driver.\n\
    4. **Attach an Elastic Network Interface (ENI) to the instance**, if required.\n\
    5. **Configure the ENA interface on the instance** by modifying the configuration\
    \ file. The configuration file location may vary depending on the operating system.\
    \ For example, for Amazon Linux 2, the configuration file is located at `/etc/sysconfig/network-scripts/ifcfg-eth0`.\
    \ Modify the configuration file to include the following lines:\n```\nDEVICE=eth0\n\
    BOOTPROTO=dhcp\nONBOOT=yes\n```\n6. **Restart the network service on the instance**\
    \ to apply the changes:\n```bash\nsudo systemctl restart network.service\n```\n\
    After following these steps, ENA will be enabled on the Amazon EC2 instance and\
    \ you will be able to take advantage of its improved networking performance.\n\
    \n# Configure EFA For VPC\nEFA (Elastic Fabric Adapter) is a network interface\
    \ designed for HPC (High-Performance Computing) workloads, which require high\
    \ bandwidth, low latency, and low CPU utilization. EFA provides a low-latency,\
    \ high-bandwidth interconnect between EC2 instances in a VPC. To configure EFA\
    \ for a VPC, follow these steps:\n\n1. **Verify that your EC2 instances support\
    \ EFA**: EFA requires instance types that support the Elastic Network Adapter\
    \ (ENA), and that run Amazon Linux 2, CentOS 7.6 or later, or Ubuntu 18.04 or\
    \ later. You can check if your instance supports EFA using the AWS CLI command:\n\
    ```bash\naws ec2 describe-instances --instance-ids <instance_id> --query \"Reservations[*].Instances[*].[EnaSupport,InstanceType]\"\
    \n```\n2. **Install the EFA driver on the instances**: The EFA driver is required\
    \ for instances to use EFA. You can install the driver using the following commands:\n\
    ```bash\nsudo amazon-linux-extras enable aws-nitro-enclaves-preview\nsudo yum\
    \ update -y\nsudo yum install -y efa-dkms\n```\n3. **Enable the EFA interface\
    \ on the instances**: The EFA interface is created when the driver is installed,\
    \ but it must be enabled to be used. You can enable the interface using the following\
    \ command:\n```bash\nsudo modprobe efa\n```\n4. **Configure the security group\
    \ rules for the instances**: EFA uses the TCP protocol on port 4800, so you must\
    \ allow traffic on this port in the security group associated with the instances.\n\
    5. **Create a placement group for the instances**: EFA provides the best performance\
    \ when instances are located in the same placement group. You can create a placement\
    \ group using the following command:\n```bash\naws ec2 create-placement-group\
    \ --group-name <group_name> --strategy cluster\n```\n6. **Launch instances with\
    \ the EFA interface**: You can launch instances with the EFA interface using the\
    \ AWS Management Console, the AWS CLI, or an API call. When launching instances,\
    \ select the placement group you created in step 5 and enable the EFA interface.\n\
    \nOnce you have configured EFA for your VPC, you can use it to improve the performance\
    \ of your HPC workloads.\n\n# Connect AWS Services with Private Addresses\n##\
    \ Procedure Overview\nFollowing is a sample demonstration of how to connect to\
    \ AWS public services with private addresses:\n1. Create an Amazon VPC with public\
    \ and private subnets.\n2. Launch EC2 instances in the private subnet.\n3. Launch\
    \ an EC2 instance in the public subnet and install a proxy server like `Squid`\
    \ or `HAProxy`.\n4. Configure the proxy server to forward traffic to the private\
    \ subnet.\n5. In the private subnet, configure the security group to allow incoming\
    \ traffic from the proxy server.\n6. Launch another EC2 instance in the public\
    \ subnet and try to connect to the private subnet using its IP address.\n7. Configure\
    \ the instance to use the proxy server as its gateway.\n8. Test the connectivity\
    \ to the private subnet.\n\n## Using Squid Proxy\nFollowing is an example of Squid\
    \ proxy server configuration (`/etc/squid/squid.conf`) that you can use:\n```\n\
    # Port number to listen on\nport 3128\n# Define the ACL for the private subnet\n\
    acl private_subnet src 10.0.0.0/24\n# Allow traffic from the private subnet\n\
    http_access allow private_subnet\n# Disable caching\ncache deny all\n```\nIn the\
    \ above program, the private subnet range is `10.0.0.0/24`. You can change this\
    \ to match your own VPC subnet range. Once the proxy server is configured, launch\
    \ an EC2 instance in the public subnet and try to connect to the private subnet.\
    \ Make sure that the security group for the subnet instance allows incoming traffic\
    \ from the proxy server on port `3128`.\n\nTo configure the EC2 instance in the\
    \ public subnet to use the proxy server as its gateway, you can set the `HTTP_PROXY`\
    \ environment variable to the proxy server's IP address and port:\n```bash\nexport\
    \ HTTP_PROXY=http://<proxy_server_ip>:3128\n```\nAfter setting the `HTTP_PROXY`\
    \ environment variable, you can test the connectivity to the private subnet:\n\
    ```bash\nping <private_subnet_instance_ip>\n```\nThis should show a successful\
    \ connection to the private subnet.\n\nIn summary, connecting to AWS public services\
    \ with private addresses involves setting up a proxy server in the public subnet\
    \ to forward traffic to the private subnet, configuring the security group for\
    \ the subnet instance to allow incoming traffic from the proxy server, and configuring\
    \ the EC2 instance in the public subnet to use the proxy server as its gateway.\n\
    \n# Amazon Elastic Load Balancing\nElastic Load Balancing (ELB) is a service that\
    \ automatically distributes incoming traffic across multiple targets, such as\
    \ EC2 instances, containers, and IP addresses, in one or more Availability Zones.\
    \ ELB provides load balancing and SSL termination, which can improve the availability\
    \ and scalability of your applications.\n\n### Types of AWS ELB\nThere are three\
    \ types of Elastic Balancing offered by AWS:\n- **Application Load Balancer (ALB)**:\
    \ used for HTTP and HTTPS traffic, and provides advanced routing capabilities\
    \ at the application layer.\n- **Network Load Balancer (NLB)**: used for TCP,\
    \ UDP, and TLS traffic and provides ultra-low latency performance and static IP\
    \ addresses for your applications.\n- **Classic Load Balancer (CLB)**: used for\
    \ HTTP, HTTPS, TCP traffic and provides basic load balancing across multiple EC2\
    \ instances.\n\n### Putting AWS ELB into Use\nTo use Elastic Load Balancing, you\
    \ can follow these steps:\n1. **Create a load balancer**: You can use the AWS\
    \ Management Console, AWS CLI or SDKs to create a load balancer. You will need\
    \ to specify the type of load balancer you want to create, its listeners, and\
    \ the backend targets to route traffic to.\n2. **Configure your backend targets**:\
    \ You can add backend targets, such as EC2 instances or IP addresses, to your\
    \ load balancer. These targets will receive traffic from the load balancer, and\
    \ you can configure their health checks to ensure they are available.\n3. **Configure\
    \ listeners**: You can configure listeners on the load balancer to receive traffic\
    \ from clients. Listeners specify a protocol, a port, and a set of rules for how\
    \ to route traffic. Optionally, you can add SSL/TLS certificates to your listeners\
    \ to secure your application traffic.\n4. **Update your DNS records**: After you\
    \ have created your load balancer, you will need to update your DNS records to\
    \ point to the load balancer’s DNS name.\n\n## Creating Application Load Balancer\
    \ using CLI\n1. **Create a VPC and subnets**:\n```bash\naws ec2 create-vpc --cidr-block\
    \ 10.0.0.0/16\naws ec2 create-subnet --vpc-id <vpc-id> --cidr-block 10.0.1.0/24\
    \ --availability-zone us-west-2a\naws ec2 create-subnet --vpc-id <vpc-id> --cidr-block\
    \ 10.0.2.0/24 --availability-zone us-west-2b\n```\n2. **Create a target group**:\n\
    ```bash\naws elbv2 create-target-group --name my-target-group --protocol HTTP\
    \ --port 80 --vpc-id <vpc-id>\n```\n3. **Create a security group**:\n```bash\n\
    aws ec2 create-security-group --group-name my-security-group --description \"\
    My security group\" --vpc-id <vpc-id>\n```\n4. **Create a listener**:\n```bash\n\
    aws elbv2 create-listener --load-balancer-arn <load-balancer-arn> --protocol HTTP\
    \ --port 80 --default-actions Type=forward,TargetGroupArn=<target-group-arn>\n\
    ```\n5. **Register targets with the target group**:\n```bash\naws elbv2 register-targets\
    \ --target-group-arn <target-group-arn> --targets Id=<instance-id-1>,Port=80 Id=<instance-id-2>,Port=80\n\
    ```\n6. **Create a load balancer**:\n```bash\naws elbv2 create-load-balancer --name\
    \ my-load-balancer --subnets <subnet-id-1> <subnet-id-2> --security-groups <security-group-id>\
    \ --type application\n```\n\n### Associate the target group with the load balancer\
    \ then.\nAfter creating an Elastic Load Balancer (ELB) in AWS, there are several\
    \ steps to follow:\n1. **Configure listener**: Set up a listener for your load\
    \ balancer to specify which protocols and ports the load balancer should listen\
    \ on.\n2. **Register targets**: Add EC2 instances or IP addresses to the target\
    \ group that is associated with the listener.\n3. **Configure health checks**:\
    \ Set up health checks to monitor the health of the registered targets. The ELB\
    \ periodically checks the health of each target and directs traffic only to healthy\
    \ targets.\n4. **Add a domain name**: If you want to associate a domain name with\
    \ your load balancer, you can create a Route 53 record that maps your domain name\
    \ to the DNS name of the load balancer.\n5. **Configure security groups**: Configure\
    \ the security groups associated with your load balancer to control inbound and\
    \ outbound traffic.\n6. **Test your load balancer**: After setting up the load\
    \ balancer, test it to make sure it's directing traffic to the registered targets.\n\
    \n# Chapter 10: Administering Google Cloud Networking\n## Exploring GCP Networking\
    \ Services\nGoogle Cloud Platform (GCP) offers a wide range of networking services\
    \ that enable users to create, manage, and optimize their network infrastructure.\
    \ Following are some of the key networking services in:\n\n- **Virtual Private\
    \ Cloud (VPC)**: Google Cloud's VPC allows users to create a private virtual network\
    \ within Google's infrastructure. It provides granular control over network configuration.\n\
    - **Cloud Load Balancing**: This is a fully-managed service that distributes incoming\
    \ traffic across multiple backend instances or services.\n- **Cloud VPN**: This\
    \ service provides secure, encrypted connections between on-premises networks\
    \ and Google Cloud VPC.\n- **Cloud Interconnect**: This service provides dedicated\
    \ connectivity between on-premises networks and Google Cloud VPC.\n- **Network\
    \ Security**: Google Cloud provides various tools for network security, including\
    \ Cloud Armor for web application security, VPC Service Controls for data protection,\
    \ and Cloud IDS for intrusion detection.\n- **Network Monitoring**: Google Cloud's\
    \ Network Monitoring service provides visibility into network performance and\
    \ health.\n- **Network Services**: Google Cloud provides various network services\
    \ including DNS, CDN, and NAT.\n- **Network Connectivity**: Google Cloud provides\
    \ various connectivity options for its services including Direct Peering, Interconnect,\
    \ and Cloud CDN.\n\n## Setting Up VPC in Google Cloud\nTo set up a Virtual Private\
    \ Cloud (VPC) in Google Cloud, you can follow these steps:\n1. Open the Google\
    \ Cloud Console and select your project.\n2. From the Navigation menu, go to the\
    \ VPC Network section and select \"VPC Networks\".\n3. Click \"Create VPC Network\"\
    .\n4. In the \"Create VPC Network\" dialog box, enter a name for the VPC network,\
    \ select the desired region and subnets, and specify the IP range for the VPC\
    \ network.\n5. Under the \"Firewall\" section, choose to allow or deny incoming\
    \ traffic based on the source and destination IP addresses, ports, and protocols.\n\
    6. Click \"Create\" to create the VPC network.\n\nOnce you have created your VPC\
    \ network, you can start creating resources in the network, such as virtual machines\
    \ (VMs), load balancers, and cloud storage buckets.\n\n### Create Virtual Machine\
    \ in VPC\nTo create a VM in your VPC network, you can follow these steps:\n1.\
    \ From the Navigation menu, go to the Compute Engine section and select \"VM instances\"\
    .\n2. Click \"Create Instance\".\n3. In the \"Create Instance\" dialog box, select\
    \ your desired machine type, boot disk image, and zone.\n4. Under the \"Networking\"\
    \ section, select your VPC network and subnetwork.\n5. Under the \"Firewall\"\
    \ section, configure the firewall rules for your VM.\n6. Click \"Create\" to create\
    \ the VM.\n\n### Create Load Balancer\nTo create a load balancer in your VPC network,\
    \ you can follow these steps:\n1. From the Navigation menu, go to the Network\
    \ Services section and select \"Load balancing\".\n2. Click \"Create Load Balancer\"\
    .\n3. In the \"Create Load Balancer\" dialog box, select your desired load balancer\
    \ type (HTTP/S, TCP/SSL, or UDP), and configure the backend service and health\
    \ check settings.\n4. Under the \"Backend Configuration\" section, select the\
    \ VMs that you want to add to the load balancer.\n5. Under the \"Frontend Configuration\"\
    \ section, specify the IP address and port for the load balancer.\n6. Click \"\
    Create\" to create the load balancer.\n\n### Create Cloud Storage Bucket\nTo create\
    \ a cloud storage bucket in your VPC network, you can follow these steps:\n1.\
    \ From the Navigation menu, go to the Storage section and select \"Storage\".\n\
    2. Click \"Create Bucket\".\n3. In the \"Create a Bucket\" dialog box, enter a\
    \ name for the bucket, select your desired storage class and location, and configure\
    \ the bucket's access control settings.\n4. Click \"Create\" to create the bucket.\n\
    \n### Setting Up VPC Monitoring\nTo set up monitoring for your VPC network, you\
    \ can follow these steps:\n1. From the Navigation menu, go to the Monitoring section\
    \ and select \"Monitoring\".\n2. Click \"Create Dashboard\" to create a new dashboard\
    \ for your VPC network.\n3. In the dashboard, add charts and metrics to monitor\
    \ the performance and health of your VPC network resources.\n4. Set up alerts\
    \ to notify you when certain metrics exceed or fall below a specified threshold.\n\
    5. Use logs and trace data to diagnose issues in your VPC network.\n\n## Create\
    \ Subnets\nIn Google Cloud, you can create subnets in two modes: automate and\
    \ custom. The automate mode automatically assigns IP addresses to VM instances,\
    \ while the custom mode allows you to manually configure the IP addresses.\n\n\
    ### Subnets in Automate Mode\nTo create subnets in automate mode, follow these\
    \ steps:\n1. Go to the VPC network section of the Google Cloud Console.\n2. Click\
    \ on the VPC network where you want to create the subnet.\n3. Click on the \"\
    Create subnet\" button.\n4. In the \"Subnet creation mode\" section, select \"\
    Automatically allocate IP ranges\".\n5. Enter a name for the subnet.\n6. Select\
    \ the region where you want the subnet to be located.\n7. Enter the IP address\
    \ range for the subnet in CIDR notation.\n8. Select the \"Private access\" checkbox\
    \ if you want to enable private access to Google APIs and services.\n9. Click\
    \ the \"Create\" button to create the subnet.\n\n### Subnets in Custom Mode\n\
    To create subnets in custom mode, follow these steps:\n1. Go to the VPC network\
    \ section of the Google Cloud Console.\n2. Click on the VPC network where you\
    \ want to create the subnet.\n3. Click on the \"Create subnet\" button.\n4. In\
    \ the \"Subnet creation mode\" section, select \"Custom mode\".\n5. Enter a name\
    \ for the subnet.\n6. Select the region where you want the subnet to be located.\n\
    7. Enter the IP address range for the subnet in CIDR notation.\n8. Click on the\
    \ \"Add subnet\" button to add additional subnets.\n9. Repeat steps 5-8 to add\
    \ additional subnets if necessary.\n10. Click the \"Create\" button to create\
    \ the subnets.\n\nAfter creating the subnets, you can configure routes to direct\
    \ traffic between them and configure firewall rules to control access to the resources.\n\
    \n## VPC Peering\nIn Google Cloud, VPC Peering is a feature that allows two Virtual\
    \ Private Cloud (VPC) networks to be connected to each other without the need\
    \ for external internet. This is useful in scenarios where you need to share resources\
    \ between different projects, regions or organizations.\n\n### Set Up Connectivity\
    \ between Two VPC\nFollowing is a sample demonstration to set up connectivity\
    \ between two VPCs in Google Cloud:\n1. First, create two VPC networks in separate\
    \ projects (for demonstration purposes, we'll refer to them as \"Project A\" and\
    \ \"Project B\").\n2. In Project A, create a subnet with IP range `10.1.0.0/16`.\
    \ In Project B, create a subnet with IP range `10.2.0.0/16`.\n3. In Project A,\
    \ go to VPC Network Peering, and click \"Create connection\".\n4. Fill out the\
    \ \"Create peering connection\" form:\n   - Under \"Name\", give a name to the\
    \ connection (e.g., \"Project A to B Peering\").\n   - Under \"Network\", select\
    \ the VPC network in Project A that you want to connect.\n   - Under \"Peer network\"\
    , select \"Create new peer\" and enter the following information:\n     - Name:\
    \ Enter a name for the peer network (e.g., \"Project B Network\").\n     - Remote\
    \ VPC network: Enter the name or URL of the VPC network in Project B.\n     -\
    \ IP range: Enter the IP range of the subnet in Project B (i.e., `10.2.0.0/16`).\n\
    5. Click \"Create\".\n6. In Project B, you'll receive a request to accept the\
    \ VPC network peering connection. Go to VPC Network Peering, and you should see\
    \ the request. Click \"Accept\".\n7. Once the connection is established, you can\
    \ configure routes to enable traffic between the two VPC networks. In Project\
    \ A, go to \"Routes\" and create a new route with the following information:\n\
    \   - Name: Enter a name for the route (e.g., \"Project B Route\").\n   - Destination\
    \ IP range: Enter the IP range of the subnet in Project B (i.e., `10.2.0.0/16`).\n\
    \   - Next hop: Select \"Peering\" and choose the name of the peering connection\
    \ you created earlier.\n8. In Project B, do the same thing, but with the IP range\
    \ of the subnet in Project A (i.e., `10.1.0.0/16`) and the appropriate peering\
    \ connection.\n\nOnce the routes are configured, instances in the two VPC networks\
    \ should be able to communicate with each other.\n\n## Add Firewall Rules to VPC\n\
