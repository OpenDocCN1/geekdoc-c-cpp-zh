    1. Log in to the AWS Management Console and navigate to the VPC Dashboard.

    2. Click on the "Create VPC" button.

    3. In the "Create VPC" dialog box, enter the VPC name, CIDR block, and any additional
    information.

    4. Click on the "Create" button to create the VPC.

    5. Once the VPC is created, navigate to the "Subnets" section and click on the
    "Create Subnet" button.

    6. In the "Create Subnet" dialog box, enter the subnet name, VPC ID, availability
    zone, and CIDR block.

    7. Click on the "Create" button to create the subnet.

    8. Repeat steps 5-7 to create additional subnets as needed.

    9. Navigate to the "Internet Gateways" section and click on the "Create Internet
    Gateway" button.

    10. Enter a name for the internet gateway and click on the "Create" button to
    create the gateway.

    11. Once the gateway is created, click on the "Attach to VPC" button and select
    the VPC that you want to attach the gateway to.

    12. Navigate to the "Route Tables" section and click on the "Create Route Table"
    button.

    13. Enter a name for the route table and select the VPC that you want to associate
    the route table with.

    14. Once the route table is created, click on the "Routes" tab and then click
    on the "Edit" button.

    15. Enter a destination CIDR block and select the internet gateway that you created
    in step 9.

    16. Click on the "Save" button to save the route.

    17. Navigate to the "Network ACLs" section and click on the "Create Network ACL"
    button.

    18. Enter a name for the network ACL and select the VPC that you want to associate
    the network ACL with.

    19. Once the network ACL is created, click on the "Inbound Rules" or "Outbound
    Rules" tab to configure the network ACL rules.

    20. Repeat steps 17-19 to create additional network ACLs as needed.

