    \ <hiredis/hiredis.h>\n#include <cstdlib>\nint main() {\n  const char *redis_host\
    \ = std::getenv(\"REDIS_HOST\");\n  const char *redis_port = std::getenv(\"REDIS_PORT\"\
    );\n  redisContext *c;\n  redisReply *reply;\n  c = redisConnect(redis_host, std::atoi(redis_port));\n\
    \  if (c == NULL || c->err) {\n    std::cerr << \"Error connecting to Redis: \"\
    \ << c->errstr << std::endl;\n    exit(1);\n  }\n  reply = (redisReply*) redisCommand(c,\
    \ \"KEYS *\");\n  if (reply == NULL || reply->type != REDIS_REPLY_ARRAY) {\n \
