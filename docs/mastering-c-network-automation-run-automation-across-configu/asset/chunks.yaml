    Code to Start and Stop ContainersYou can use the Docker SDK for C++ to write C++
    code that starts and stops containers. Given below is a sample code snippet that
    starts a container using the Docker SDK for C++:#include <iostream>#include <chrono>#include
    <thread>#include <docker.hpp>int main(){   docker::Docker docker;   // Create
    a container configuration   docker::ContainerConfig config;   config.Image = "nginx"; 
     config.Name = "my-nginx-container";   config.PortBindings["80/tcp"].push_back({"0.0.0.0",
    8080});   // Create the container   docker::Container container = docker.createContainer(config); 
     // Start the container   container.start();    // Wait for the container to start
    up    std::cout << "Waiting for container to start up...\n";   std::this_thread::sleep_for(std::chrono::seconds(5)); 
     // Stop the container   container.stop();   return 0;}This code snippet creates
    a Docker container based on the Nginx image, binds port 80 to port 8080 on the
    host, starts the container, waits for it to start up, and then stops the container.Build
    and Run C++ ProjectOnce you have written the C++ code to start and stop containers,
