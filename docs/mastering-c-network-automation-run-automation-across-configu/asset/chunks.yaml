    book is an in-depth guide for network administrators, cloud architects, and container
    and Kubernetes administrators who want to learn how to automate networking tasks
    in C++. From setting up a network automation environment to automating configuration
    management and working with containers and container orchestration tools such
    as Kubernetes, the book covers a wide range of topics.The first section of the
    book covers the fundamentals of automation scripting and testing. Readers will
    learn how to create successful automation scripts and test them to ensure they
    perform properly. The next section describes how to set up a network automation
    environment. This includes configuring network devices, servers, and other components
    required for automation. The readers will learn about the various protocols as
    well as how to use Ansible to automate the configuration management of these devices.
    It covers containerization and container orchestration systems such as Docker
    and Kubernetes. Readers will learn how to use tools such as Docker Compose and
    Kubernetes to automate workload management and deployment.The final section of
    the book focuses on cloud networking. The readers will learn how to handle network
    resources in cloud systems such as AWS, Google Cloud, and Azure. Readers get to
    work with tools and services available for cloud networking automation and how
    to use them in their regular cloud networking operations.In this book you will
