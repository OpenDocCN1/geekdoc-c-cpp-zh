  trans: "\n你现在已使用 AWS 管理控制台成功创建了一个 Amazon VPC。\n\n# 创建 VPC 的示例程序\n假设我们想在美东部（俄亥俄）区域创建一个\
    \ CIDR 块为 `10.0.0.0/16` 的 VPC，并且我们想在这个 VPC 中创建两个子网 - 一个位于 `us-east-2a`，CIDR 块为\
    \ `10.0.1.0/24`；另一个位于 `us-east-2b`，CIDR 块为 `10.0.2.0/24`。\n\n以下是使用 AWS CLI 创建此\
    \ VPC 和子网的步骤：\n\n打开命令提示符并确保已安装并配置了 AWS CLI。要创建 VPC，请使用以下命令：\n```bash\naws ec2\
    \ create-vpc --cidr-block 10.0.0.0/16 --region us-east-2\n```\n将在指定的区域创建一个具有指定\
    \ CIDR 块的 VPC。\n\n接下来，我们需要获取刚刚创建的 VPC ID。我们可以使用以下命令来执行此操作：\n```bash\naws ec2 describe-vpcs\
    \ --filters Name=cidr,Values=10.0.0.0/16 --region us-east-2 --query 'VPCs[0].VPCId'\n\
    ```\n此命令将返回刚刚创建的 VPC 的 ID。\n\n现在我们可以在 VPC 中创建两个子网。要创建 `us-east-2a` 中的子网，请使用以下命令：\n\
    ```bash\naws ec2 create-subnet --vpc-id <vpc-id> --cidr-block 10.0.1.0/24 --availability-zone\
    \ us-east-2a --region us-east-2\n```\n将`<vpc-id>` 替换为第 3 步创建的 VPC ID。\n\n同样，要创建\
    \ `us-east-2b` 中的子网，请使用以下命令：\n```bash\naws ec2 create-subnet --vpc-id <vpc-id>\
    \ --cidr-block 10.0.2.0/24 --availability-zone us-east-2b --region us-east-2\n\
    ```\n再次，将`<vpc-id>` 替换为第 3 步创建的 VPC ID。\n\n我们现在已经在指定区域创建了一个带有两个子网的 VPC。我们现在可以使用此\
    \ VPC 启动 EC2 实例、创建负载均衡器并在该隔离网络中执行其他任务。\n\n# 在 VPC 中使用 IPv6\n要在 Amazon VPC 中使用\
    \ IPv6，您需要为 VPC 启用 IPv6 支持，然后为子网和网络接口配置必要的设置。\n\n以下是为 Amazon VPC 启用 IPv6 的步骤：\n\
    \n### 打开 Amazon VPC 控制台\n访问 `https://console.aws.amazon.com/vpc/` 进入 Amazon VPC\
    \ 控制台并使用您的 AWS 登录。\n\n### 为 VPC 启用 IPv6\n选择您想要启用 IPv6 的 VPC，选择“操作 (Actions)” >\
    \ “编辑 CIDR (Edit CIDRs)”。在“IPv6 CIDRs”部分，输入您想要分配给 VPC 的 IPv6 块。您可以使用公共路由的 IPv6\
    \ 块或私有的 IPv6 块。点击“保存 (Save)”。\n\n### 配置子网\n为 VPC 启用 IPv6 后，您需要配置子网以使用 IPv6。选择一个子网并选择“操作\
    \ (Actions)” > “编辑 IPv6 CIDR (Edit IPv6 CIDRs)”。输入您想要分配给该子网的 IPv6 块。您可以为每个子网分配单独\
    \ IPv6 块，也可以为 VPC 中的所有子网使用相同的 IPv6 块。点击“保存 (Save)”。\n\n### 配置网络接口\n在配置子网后，您需要配置网络接口以使用\
    \ IPv6。选择一个网络接口并选择“操作 (Actions)” > “挂载/替换网络接口 (Attach/Replace Network Interface)”。在“详细信息\
    \ (Advanced Details)”部分，选择“IPv6 地址”选项卡并输入您想要分配给网络接口的 IPv6 地址。您可以为网络接口分配一个或多个 IPv6\
    \ 地址。\n\n### 验证 IPv6 连通性\n在配置 VPC、子网和网络接口使用 IPv6 后，您可以通过在 VPC 中启动 EC2 实例并检查分配给它的\
    \ IPv6 地址来验证连通性。您还可以使用 `ping6` 和 `traceroute6` 等工具测试 IPv6 连通性。\n\n总结之，要在 Amazon\
    \ VPC 中使用 IPv6，您需要为 VPC 启用 IPv6 支持，配置子网使用 IPv6，并配置网络接口使用 IPv6。配置完成后，您可以通过启动 EC2\
    \ 实例并测试连通性来验证 IPv6 连通性。\n\n# AWS 网络接口 (ENI, ENA, EFA)\nAmazon Web Services (AWS)\
    \ 为不同的用例提供了不同类型的网络接口。这些接口包括：\n\n### 弹性网络接口 (ENI)\nENI 是一种可以附加到 VPC 中实例的虚拟网络接口。它允许您向实例附加额外的网络接口，您也可以卸载它们并将它们移动到同一\
    \ VPC 内的其他实例上。您可以使用 ENI 创建冗余、增加网络吞吐量并对网络流量应用安全策略。\n\n### 弹性网络适配器 (ENA)\nENA 是一种提供高吞吐量和低延迟网络的网络接口。它针对需要高带宽低延迟的\
    \ HPC（高性能计算）和机器学习工作负载进行了优化。\n\n### 弹性织物适配器 (EFA)\nEFA 是一种在集群实例之间提供低延迟和高带宽通信的网络接口。它是为需要实例间低延迟通信的\
    \ HPC 工作负载而设计的。\n\nENI、ENA 和 EFA 在用例、性能特性上有所不同。ENI 是通用网络接口，ENA 提供高吞吐量网络，而 EFA\
    \ 为 HPC 工作负载提供低延迟通信。ENI 支持 IPv4 和 IPv6 地址，而 ENA 和 EFA 仅支持 IPv4 地址。然而，ENA 和 EFA\
    \ 可在启用 IPv6 的 VPC 中通过 IPv4 隧道使用。使用 ENI、ENA 或 EFA，需要在 VPC 中创建子网并启动实例，然后进行相应的配置。\n\
    \n# 为 VPC 配置 ENI\n要在 Amazon Web Services (AWS) 为 VPC 配置弹性网络接口 (ENI)，请按照以下步骤操作：\n\
    \n1. **进入 VPC 控制台**：打开 AWS 控制台并选择 VPC。\n2. **创建子网**：导航到“子网 (Subnets)”部分，点击“创建子网”，并按照提示创建子网。\n\
    3. **创建安全组**：导航到“安全组 (Security Groups)”部分，点击“创建安全组”，并按照提示创建安全组。\n4. **创建 ENI**：导航到“网络接口\
    \ (Network Interfaces)”部分，点击“创建网络接口”，并按照提示创建接口。\n5. **将 ENI 附加到实例**：在“网络接口”列表中选择新创建的\
    \ ENI，点击“操作 (Actions)”然后选择“挂载 (Attach)”。选择您想要附加的实例并点击“挂载”。\n6. **配置 ENI**：将 ENI\
    \ 附加到实例后，按照 Amazon EC2 文档配置。\n\n# 为 VPC 配置 ENA\n弹性网络适配器 (ENA) 是一种在 EC2 实例上提供增强网络的网络接口。ENA\
    \ 设计为高性能计算 (HPC)、机器学习和数据分析等负载提供更高性能。默认情况下，支持的 EC2 实例已启用 ENA。为 VPC 配置 ENA，需要遵循以下步骤：\n\
    \n1. **选择支持 ENA 的 Amazon EC2 实例**：您可以根据 AWS 文档检查实例类型兼容性。\n2. **使用安装了 ENA 驱动程序的亚马逊映像\
    \ (AMI) 启动 EC2 实例**：Amazon Linux 2、Ubuntu 14.04/16.04/18.04/20.04 以及 Windows Server\
    \ 2016/2019 已预配置。\n3. **验证实例上已安装 ENA 驱动程序**：运行以下命令：\n```bash\nmodinfo ena\n```\n\
    此命令将显示已安装的 ENA 驱动程序信息。\n4. **如果需要，将弹性网络接口 (ENI) 附加到实例**。\n5. **在实例上配置 ENA 接口**：通过修改配置文件。配置的位置取决于操作系统。例如，对于\
    \ Amazon Linux 2，配置文件位于 `/etc/sysconfig/network-scripts/ifcfg-eth0`。修改文件包含以下行：\n\
    ```\nDEVICE=eth0\nBOOTPROTO=dhcp\nONBOOT=yes\n```\n6. **重启实例上的网络服务**以应用更改：\n```bash\n\
    sudo systemctl restart network.service\n```\n遵循这些步骤后，Amazon EC2 实例将启用 ENA，您可以利用其改进的网络性能。\n\
    \n# 为 VPC 配置 EFA\nEFA（弹性织物适配器）是一种为 HPC（高性能计算）负载设计的网络接口，这些负载需要高带宽、低延迟和低 CPU 利用率。EFA\
    \ 在 VPC 内的 EC2 实例之间提供低延迟、高带宽的互连。为 VPC 配置 EFA，请遵循以下步骤：\n\n1. **验证您的 EC2 实例支持 EFA**：EFA\
    \ 需要支持弹性网络适配器 (ENA) 的实例类型，并且运行 Amazon Linux 2、CentOS 7.6 或更高版本、Ubuntu 18.04 或更高版本。可以使用\
    \ AWS CLI 命令检查实例是否支持 EFA：\n```bash\naws ec2 describe-instances --instance-ids\
    \ <instance_id> --query \"Reservations[*].Instances[*].[EnaSupport,InstanceType]\"\
    \n```\n2. **在实例上安装 EFA 驱动程序**：实例使用 EFA 需要 EFA 驱动程序。可以使用以下命令安装驱动程序：\n```bash\n\
    sudo amazon-linux-extras enable aws-nitro-enclaves-preview\nsudo yum update -y\n\
    sudo yum install -y efa-dkms\n```\n3. **在实例上启用 EFA 接口**：驱动安装时创建 EFA 接口，但必须启用才能使用。可以使用以下命令启用接口：\n\
    ```bash\nsudo modprobe efa\n```\n4. **为实例配置安全组规则**：EFA 使用端口 4800 的 TCP 协议，因此必须在关联实例的安全组中允许此端口的流量。\n\
    5. **为实例创建放置组**：实例位于相同的放置组时，EFA 提供最佳性能。可以使用以下命令创建放置组：\n```bash\naws ec2 create-placement-group\
    \ --group-name <group_name> --strategy cluster\n```\n6. **使用 EFA 接口启动实例**：您可以使用\
    \ AWS 管理控制台、AWS CLI 或 API 调用启动带有 EFA 接口的实例。启动实例时，选择您在第 5 步中创建的放置组并启用 EFA 接口。\n\
    \n一旦为 VPC 配置了 EFA，您可以使用它来提高 HPC 工作负载。\n\n# 使用私有地址连接 AWS 服务\n## 概述\n以下是使用私有地址将本地数据连接到\
    \ Google Cloud 的示例演示：\n1. 首先，您需要在 Google Cloud 中创建一个 VPN 网关。\n2. 创建具有公共和私有子网的\
    \ Amazon VPC。\n3. 在公共子网中启动 EC2 实例并安装代理 Squid 或 HAProxy。\n4. 配置代理服务器转发流量到私有子网。\n\
    5. 在私有子网中配置安全组允许来自代理服务器的流量。\n6. 在公共子网中启动另一个 EC2 实例并使用其 IP 地址连接私有子网。\n7. 配置实例使用代理服务器作为其网关。\n\
    8. 测试私有子网的连通性。\n\n## 使用 Squid\n以下是 Squid 服务器配置 (`/etc/squid.conf`) 的示例：\n```\n\
    # 监听端口\nport 3128\n# 为私有子网定义 ACL\nacl private_subnet src 10.0.0.0/24\n# 允许私有子网\n\
    http_access allow private_subnet\n# 禁用缓存\ncache deny all\n```\n在上述程序中，私有子网范围为\
    \ `10.0.0.0/24`。您可以更改更改自己的子网范围。一旦配置了代理服务器，在公共子网中启动 EC2 实例并尝试连接私有子网。确保实例的安全组允许来自代理服务器端口\
    \ `3128` 的流量。\n\n要配置公共子网中的 EC2 实例使用代理服务器作为网关，可以设置环境变量 `HTTP_PROXY` 为代理服务器的 IP\
    \ 地址和端口：\n```bash\nexport HTTP_PROXY=http://<proxy_server_ip>:3128\n```\n设置 `HTTP_PROXY`\
    \ 环境变量后，可以测试到私有子网的连通性：\n```bash\nping <private_subnet_ip>\n```\n这应显示到私有子网的连接成功。\n\
    \n总结之，使用私有地址连接 AWS 服务涉及在公共子网中设置代理服务器转发流量到私有子网，配置实例的安全组允许来自代理服务器的流量，并配置公共子网中的 EC2\
    \ 实例使用代理服务器作为网关。\n\n# Amazon 负载均衡\n负载均衡 (ELB) 是一种自动将流量分发到多个目标（如 EC2 实例、容器和 IP\
    \ 地址）的服务。ELB 提供负载均衡和 SSL ，可以提高应用程序的可用性和扩展性。\n\n### AWS ELB 的类型\nAWS 提供了三种负载均衡：\n\
    - **应用负载均衡器 (ALB)**：用于 HTTP 和 HTTPS 流量，提供应用层的高级路由功能。\n- **网络负载均衡器 (NLB)**：用于 TCP、UDP\
    \ 和 TLS 流量，为应用程序提供极低延迟和静态 IP 地址。\n- **经典负载均衡器 (CLB)**：用于 HTTP、HTTPS、TCP 流量，提供跨多个\
    \ EC2 实例的基础负载均衡。\n\n### 使用 AWS ELB\n要使用负载均衡，可以遵循以下步骤：\n1. **创建负载均衡器**：可以使用 AWS\
    \ 管理控制台、AWS CLI 或 SDK 创建负载均衡器。您需要指定要创建的负载均衡器类型、其监听器以及路由流量的后端目标。\n2. **配置后端目标**：向负载均衡器添加后端目标（如\
    \ EC2 实例或 IP 地址）。这些目标将接收负载均衡器的流量，您可以配置它们的健康检查以确保其可用。\n3. **配置监听器**：您可以在负载均衡器上配置监听器以接收来自客户端的流量。监听器指定协议、端口以及路由流量的规则。可选，可以添加\
    \ SSL/TLS 证书以保护应用程序流量。\n4. **更新 DNS 记录**：创建负载均衡器后，您需要更新 DNS 记录指向负载均衡器的 DNS 名称。\n\
    \n## 使用 CLI 创建应用负载均衡器\n1. **创建 VPC 和子网**：\n```bash\naws ec2 create-vpc --cidr-block\
    \ 10.0.0.0/16\naws ec2 create-subnet --vpc-id <vpc-id> --cidr-block 10.0.1.0/24\
    \ --availability-zone us-west-2a\naws ec2 create-subnet --vpc-id <vpc-id> --cidr-block\
    \ 10.0.2.0/24 --availability-zone us-west-2b\n```\n2. **创建目标组**：\n```bash\naws\
    \ elbv2 create-target-group --name my-target-group --protocol HTTP --port 80 --vpc-id\
    \ <vpc-id>\n```\n3. **创建安全组**：\n```bash\naws ec2 create-security-group --group-name\
    \ my-security-group --description \"My security group\" --vpc-id <vpc-id>\n```\n\
    4. **创建监听器**：\n```bash\naws elbv2 create-listener --load-balancer-arn <load-balancer-arn>\
    \ --protocol HTTP --port 80 --default-actions Type=forward,TargetGroupArn=<target-group-arn>\n\
    ```\n5. **向目标组注册目标**：\n```bash\naws elbv2 register-targets --target-group-arn\
    \ <target-group-arn> --targets Id=<instance-id>,Port=80\n```\n6. **创建负载均衡器**：\n\
    ```bash\naws elbv2 create-load-balancer --name my-load-balancer --subnets <subnet-id-1>,<subnet-id-2>\
    \ --security-groups <security-group-id>\n```\n\n### 将目标组关联到负载均衡器\n在创建负载均衡器 (ELB)\
    \ 后，您需要遵循以下步骤：\n1. **配置监听器**：为负载均衡器设置监听器，指定其应该监听的协议和端口。\n2. **注册目标**：向负载均衡器添加\
    \ EC2 实例或 IP 地址。这些目标将接收负载均衡器的流量。\n3. **配置健康检查**：设置健康检查以确保每个目标都可用。负载均衡器会定期检查每个目标的状态并将流量仅导向健康目标。\n\
    4. **添加域名**：如果您想将域名与负载均衡器关联，可以创建 Route53 记录将域名映射到负载均衡器。\n5. **配置安全组**：配置负载均衡器关联的安全组以控制入站流量。\n\
    6. **测试您的负载均衡器**：设置负载均衡器后，可以测试其连通性。\n\n# 第 10 章：管理 Google Cloud 网络\n## 探索 GCP\
    \ 网络服务\nGoogle Cloud Platform (GCP) 提供了广泛的网络服务，允许用户创建、管理和优化其网络基础设施。以下是其中的关键网络服务：\n\
    \n- **虚拟私有云 (VPC)**：Google Cloud 的 VPC 允许用户在其基础设施中创建私有网络。它提供了细粒控制。\n- **云负载均衡\
    \ (Cloud Load Balancing)**：这是一种全托管的服务，将流量分发到多个后端实例或服务。\n- **云 VPN**：该服务在本地网络与\
    \ Google Cloud 之间提供安全的加密连接。\n- **云互连 (Cloud Interconnect)**：该服务在本地网络与 Google Cloud\
    \ 之间提供专用连接。\n- **网络安全 (Network Security)**：Google Cloud 提供了多种网络安全工具，包括用于应用安全的\
    \ Cloud Armor、用于数据保护 VPC Service Controls 以及用于入侵检测 Cloud IDS。\n- **网络监控 (Network\
    \ Monitoring)**：Google Cloud 的监控服务提供了网络性能和健康的可见性。\n- **网络服务 (Network Services)**：Google\
    \ Cloud 提供了 DNS、CDN 和 NAT 等多种网络服务。\n- **网络连接 (Network Connectivity)**：Google Cloud\
    \ 提供了多种连接选项，包括直接对等 (Direct Peering)、互连和 Cloud CDN。\n\n## 在 Google Cloud 中设置 VPC\n\
    要在 Google Cloud 设置虚拟私有云 (VPC)，可以遵循以下步骤：\n1. 打开 Google Cloud 控制台并选择您的项目。\n2. 从导航菜单中进入\
    \ VPC 网络部分并选择“VPC 网络”。\n3. 点击“创建 VPC 网络”。\n4. 在“创建 VPC 网络”对话框中，为 VPC 网络输入名称，选择所需的区域和子网，并指定\
    \ VPC 网络的 IP 范围。\n5. 在“防火墙”部分，根据源和目的 IP 地址、端口和协议允许或拒绝入站流量。\n6. 点击“创建”创建 VPC 网络。\n\
    \n一旦创建了 VPC 网络，可以在网络中创建资源，例如虚拟机 (VM)、负载均衡器和云存储桶。\n\n### 在 VPC 中创建虚拟机\n要在您的 VPC\
    \ 网络中创建虚拟机，可以遵循以下步骤：\n1. 从导航菜单进入 Compute Engine 部分并选择“虚拟机实例 (VM instances)”。\n\
    2. 点击“创建实例”。\n3. 在“创建实例”对话框中，选择所需的机器类型、启动磁盘映像和区域。\n4. 在“网络”部分，选择您的 VPC 网络和子网。\n\
    5. 在“防火墙”部分，为虚拟机配置防火墙规则。\n6. 点击“创建”创建虚拟机。\n\n### 在 VPC 中创建负载均衡器\n要在您的 VPC 网络中创建负载均衡器，可以遵循以下步骤：\n\
    1. 从导航菜单进入网络服务部分并选择“负载均衡 (Load balancing)”。\n2. 点击“创建负载均衡器”。\n3. 在“创建负载均衡器”对话框中，选择所需的负载均衡器类型（HTTP/S、TCP/SSL\
    \ 或 UDP），并配置后端服务和健康检查设置。\n4. 在“后端配置”部分，选择想要添加到负载均衡器的虚拟机。\n5. 在“前端配置”部分，指定负载均衡器的\
    \ IP 地址和端口。\n6. 点击“创建”创建负载均衡器。\n\n### 在 VPC 中创建云存储桶\n要在您的 VPC 网络中创建云存储桶，可以遵循以下步骤：\n\
    1. 从导航菜单进入存储部分并选择“存储 (Storage)”。\n2. 点击“创建存储桶”。\n3. 在“创建存储桶”对话框中，为存储桶输入名称，选择所需的存储类别和位置，并配置存储桶的访问控制设置。\n\
    4. 点击“创建”创建存储桶。\n\n### 设置 VPC 监控\n要为 VPC 网络设置监控，可以遵循以下步骤：\n1. 从导航菜单进入监控部分并选择“监控\
    \ (Monitoring)”。\n2. 点击“创建仪表板”为您的 VPC 网络创建一个新的仪表板。\n3. 在仪表板中，添加图表和指标以监控 VPC 网络资源的性能和健康状况。\n\
    4. 设置告警，当某些指标超过或低于指定阈值时通知您。\n5. 使用日志和跟踪数据诊断 VPC 网络问题。\n\n## 创建子网\n在 Google Cloud\
    \ 中，您可以以两种模式创建子网：自动 (automate) 和自定义 (custom)。自动模式为虚拟机实例自动分配 IP 地址，而自定义模式允许您手动配置\
    \ IP 地址。\n\n### 自动模式下的子网\n要在自动模式下为 VPC 创建子网，请遵循以下步骤：\n1. 进入 Google Cloud 控制台的\
    \ VPC 网络部分。\n2. 点击“创建子网”按钮。\n3. 在“子网创建模式”部分，选择“自动分配 IP 范围”。\n4. 输入子网名称。\n5. 选择子网所在的区域。\n\
    6. 以 CIDR 格式输入子网的 IP 地址范围。\n7. 点击“创建”。\n\n### 自定义模式下的子网\n要在自定义模式下为 VPC 创建子网，请遵循以下步骤：\n\
    1. 进入 Google Cloud 控制台的 VPC 网络部分。\n2. 点击“创建子网”按钮。\n3. 在“子网创建模式”部分，选择“自定义”。\n4.\
    \ 输入子网名称。\n5. 选择子网所在的区域。\n6. 以 CIDR 格式输入子网的 IP 地址范围。\n7. 点击“创建”。\n\n## VPC 对等\n\
    在 Google Cloud 中，VPC 对等是一项允许两个私有云 (VPC) 网络相互连接的功能，而无需互联网。这对于需要在不同项目、区域或组织之间共享资源的场景非常有用。\n\
    \n### 设置两个 VPC 之间的连接\n以下是在 Google Cloud 中设置两个 VPC 连接的示例演示：\n1. 首先，在单独的项目中创建两个\
    \ VPC（为了演示目的，我们将它们称为“项目 A”和“项目 B”）。\n2. 在项目 A 中创建一个 IP 范围为 `10.1.0.0/16` 的子网。在项目\
    \ B 中创建一个 IP 范围为 `10.2.0.0/16` 的子网。\n3. 在项目 A 中进入 VPC 网络对等 (VPC Network Peering)，点击“创建连接”。\n\
    4. 在“创建对等连接”表单中：\n   - 名称：为连接命名（例如“项目 A 到 B 的对等”）。\n   - 网络：选择您想要连接的 VPC 网络。\n\
    \   - 对等网络：选择“创建新对等”并输入以下信息：\n     - 名称：为对等网络命名（例如“项目 B 网络”）。\n     - 远程 VPC 网络：输入项目\
    \ B VPC 的名称或 URL。\n     - IP 范围：输入项目 B 中子网的 IP 范围（例如 `10.2.0.0/16`）。\n5. 点击“创建”。\n\
    6. 在项目 B 中，您将收到接受 VPC 网络对等连接的请求。进入 VPC 网络对等并看到请求。点击“接受”。\n7. 一旦连接建立，您可以配置路由以启用两个\
    \ VPC 之间的流量。在项目 A 中，进入“路由”并创建一个具有以下信息的路由：\n   - 名称：为路由命名（例如“项目 B 路由”）。\n   - 目标\
    \ IP 范围：输入项目 B 子网的 IP 范围（例如 `10.2.0.0/16`）。\n   - 下跳：选择“对等”并选择您之前创建的对等连接名称。\n\
    8. 在项目 B 中执行相同操作，但使用项目 A 子网的 IP 范围（例如 `10.1.0.0/16`）和相应的对等连接。\n\n一旦配置路由，两个 VPC\
    \ 网络中的实例应该能够相互通信。\n\n## 为 VPC 添加防火墙规则\n要在 Google Cloud 中为 VPC 添加防火墙规则，请遵循以下步骤操作：\n\
    1. 打开 Google Cloud 控制台并选择您的项目。\n2. 点击左上角的汉堡菜单，导航到“网络 (Networking) > VPC 网络 (VPC\
    \ Network) > 防火墙规则 (Firewall rules)”。\n3. 点击“创建防火墙规则 (Create Firewall Rule)”按钮创建一个新的防火墙规则。\n\
    4. 在“创建防火墙规则”页面，为防火墙规则命名。\n5. 在“目标 (Targets)”部分，选择您想要应用防火墙规则的网络。\n6. 在“源筛选 (Source\
    \ filter)”部分，选择您想要应用防火墙规则的源。\n7. 在“协议和端口 (Protocols and ports)”部分，指定防火墙规则应允许或阻止的协议和端口。\n\
    8. 可选，您可以为匹配防火墙规则的流量指定要执行的操作。\n9. 点击“创建”创建规则。\n\n请注意，为 VPC 添加防火墙规则不会自动应用到任何现有的虚拟机；您需要单独为虚拟机指定规则。\n\
    \n## 使用 Google Cloud 连接本地数据\n## 流程概述\n以下是如何使用 `VPN` 将本地数据连接到 Google Cloud 的示例演示：\n\
    1. 首先，您需要在 Google Cloud 中创建一个 VPN 网关。\n2. 进入 Google Cloud 的 VPC 网络 页面并点击“VPN”。\n\
    3. 点击“创建连接 (Create Connection)”并按照步骤创建 VPN 网关。\n4. 一旦创建了 VPN 网关，您需要配置一个隧道来连接本地数据中心。\n\
    5. 进入 Google Cloud 的 VPC 网络 页面并点击“VPN”。\n6. 点击“创建隧道 (Create Tunnel)”并按照步骤配置隧道。\n\
    7. 您需要提供本地 VPN 网关的 IP 地址、共享密钥和路由选项。\n8. 在配置了隧道后，使用相同的设置配置本地 VPN 网关。\n9. 一旦配置了本地\
    \ VPN 网关，就可以在本地数据中心和 Google Cloud 之间建立 VPN 连接。\n10. 您可以通过检查控制台中的隧道状态来验证 VPN 是否正常工作。\n\
    11. 最后，您可以通过隧道在 Google Cloud 中配置访问本地数据。\n\n## 创建云 VPN 网关\n以下是创建云 VPN 网关的代码片段：\n\
    ```python\nimport google.cloud/compute/v1/compute_client.h\nimport google.cloud/compute/v1/gateways.pb\n\
    import google.cloud/status_or.h\n\nnamespace gce = google::cloud::compute::v1\n\
    google::cloud::StatusOr<gce.VpnGateway> CreateVpnGateway(\n    client: gce.ComputeClient,\
    \ \n    project_id: str, \n    region: str, \n    name: str, \n    network_uri:\
    \ str\n):\n    request = gce.InsertVpnGatewayRequest()\n    request.set_parent(\"\
    projects/\" + project_id + \"/regions/\" + region)\n    request.set_vpn_gateway(gce.VpnGateway())\n\
    \    request.vpn_gateway.set_name(name)\n    request.vpn_gateway.set_network(network_uri)\n\
    \    return client.insert_vpn_gateway(request)\n\n## 创建云 VPN 隧道\n以下是创建 VPN 隧道的代码片段：\n\
    ```python\ngoogle::cloud::StatusOr<gce.VpnTunnel> CreateVpnTunnel(\n    client:\
    \ gce.ComputeClient, \n    project_id: str, \n    region: str, \n    name: str,\
    \ \n    peer_gateway_ip: str, \n    shared_secret: str, \n    vpn_gateway_uri:\
    \ str, \n    peer_gateway_interface: str, \n    peer_gateway_route: str\n):\n\
    \    request = gce.InsertVpnTunnelRequest()\n    request.set_parent(\"projects/\"\
    \ + project_id + \"/regions/\" + region)\n    request.set_vpn_tunnel(gce.VpnTunnel())\n\
    \    request.vpn_tunnel.set_name(name)\n    request.vpn_tunnel.set_peer_gateway_ip(peer_gateway_ip)\n\
    \    request.vpn_tunnel.set_shared_secret(shared_secret)\n    request.vpn_tunnel.set_vpn_gateway(vpn_gateway_uri)\n\
    \    request.vpn_tunnel.set_peer_gateway_interface(peer_gateway_interface)\n \
    \   request.vpn_tunnel.set_peer_gateway_route(peer_gateway_route)\n    return\
    \ client.insert_vpn_tunnel(request)\n```\n\n## 执行可观测性\n为了在 Google Cloud 中分析日志并实现可观测性，可以使用\
    \ Google Cloud 的日志和监控服务即 Stackdriver。\n\n### 设置 Stackdriver\n以下是设置 Stackdriver\
    \ 并开始分析日志的步骤：\n1. 首先，导航到 Google Cloud 控制台并选择您的项目。\n2. 然后，点击左上角的“导航菜单”按钮，并在“工具”部分下选择“日志\
    \ (Logging)”。\n3. 一旦进入日志部分，您可以查看来自 Compute Engine、Kubernetes Engine 和 App Engine\
    \ 等服务的日志。\n4. 为了获得更深入的洞察和分析，可以创建基于日志的指标。这些指标可以触发告警或生成图表和仪表板。\n5. 要创建基于日志的指标，点击“创建指标”按钮，为指标提供名称和描述并定义过滤器表达式。\n\
    6. 一旦创建了指标，可以在“指标资源器 (Metrics Explorer)”选项卡下查看它。\n7. 您还可以通过进入 Stackdriver 控制中的“告警\
    \ (Alerting)”部分根据这些指标设置告警。\n8. 要创建告警，点击“创建策略”按钮，为告警策略命名并描述，选择触发告警的条件（基于指标、日志或可用性检查），并配置通知设置。\n\
    9. 您还可以在 Stackdriver 控制台中设置仪表板来监控您的服务和基础设施。仪表板可以包含各种数据类型的小部件，如图表、图形和日志。\n10. 要创建仪表板，点击“仪表板”选项卡，然后点击“创建仪表板”。为仪表板命名并描述，并通过选择适当的指标、日志或其他数据源为其添加小部件。\n\
    11. 一旦创建了仪表板，您可以通过提供链接与其他团队成员或利益相关者共享。\n12. 通过遵循这些步骤，您可以在 Google Cloud 中设置 Stackdriver\
    \ 用于日志记录和监控。\n\n## 云负载均衡器\n负载均衡器是现代计算环境的重要组件。它们帮助将流量均匀地分发到多个服务器，提高可用性和响应速度。Google\
    \ Cloud Platform (GCP) 提供了多种负载均衡器选项，将流量分发到应用程序。\n\n### 设置负载均衡器\n要在 GCP 中设置负载均衡器，请遵循以下步骤：\n\
    1. **选择负载均衡器类型**：GCP 提供了四种负载均衡器——HTTP(S) 负载均衡器、TCP/SSL 负载均衡器、内部负载均衡和网络负载均衡器。选择最适合您的用例的一种。\n\
    2. **配置负载均衡器**：一旦选择了负载均衡器类型，您需要配置它。这包括设置后端实例、健康检查以及负载策略。\n3. **添加 SSL 证书（如果需要）**：指定证书名称和私钥。\n\
    4. **查看配置**：一旦负载均衡器创建，可以通过发送流量到其 IP 地址或主机进行测试。\n\n## 创建 HTTP 负载均衡器的示例程序\n以下是使用\
    \ GCP 控制台创建 HTTP 负载均衡器的示例：\n1. 打开 GCP 控制台并选择要创建负载均衡器的项目。\n2. 导航到“负载均衡”部分并点击“创建负载均衡器”。\n\
    3. 选择 HTTP 负载均衡器并点击“开始”。\n4. 选择后端实例（VM）或服务。\n5. **配置前端**：指定协议、端口和 IP 地址。\n6. **配置后端**：选择后端实例。\n\
    7. **配置路由规则**：定义基于路径或主机的规则。\n\n## 监控并管理负载均衡器\n一旦负载均衡器运行，为了监控其性能并有效管理它，GCP 提供了多种工具来监控负载均衡器，包括\
    \ Stackdriver 日志和监控。\n\n。\n要均衡负载均衡器，可以使用 GCP 控制台、SDK 或 REST API。您可以更新负载均衡器的配置，缩缩后端实例，或者在不再需要均衡器时删除删除均衡器。（，文本文本：“：“更新负载均衡均衡配置，缩缩后端实例，或者在不再需要均衡器时删除均衡器。”）\n\
    \n## 总结\n在本章中，我们学习了 Google Cloud 的各个方面，包括设置 VPC、在自动和自定义模式下创建子网、VPC 对等、添加防火墙规则、连接本地数据到\
    \ Google Cloud 以及分析日志。我们还讨论了 Google Cloud 中的负载均衡器及其类型，以及如何使用控制台设置它们。\n\n# 第 11\
    \ 章：管理 Azure 网络\n## 探索 Azure 网络\nAzure 为其用户提供了广泛的网络服务。以下是 Azure 提供的关键网络服务：\n\n\
    - **虚拟网络 (VNet)**：Azure 虚拟网络 (VNet) 是 Azure 云服务的逻辑隔离，在云中提供一个安全的网络环境。通过 VNet，用户可以使用私有\
    \ IP 地址连接到虚拟机、负载均衡器和其他 Azure 服务。用户还可以在 VNet 内创建子网并应用网络安全控制（网络安全组 NSG）。\n- **VPN\
    \ 网关**：Azure VPN 网关在本地网络与 Azure VNet 之间提供安全的连接。用户可以使用站点对站点或点对站点 VPN 连接连接到 Azure。站点对站点\
    \ VPN 连接允许用户将本地网络连接到 Azure VNet，而点对站点 VPN 连接允许用户将单个设备连接到 Azure。\n- **ExpressRoute**：ExpressRoute\
    \ 在本地基础设施和 Azure 之间提供私有的、专用连接。该连接通过互联网提供商 (ISP) 提供，并且比公共互联网上的 VPN 连接更可靠、可预测且速度更快。ExpressRoute\
    \ 还通过跳过互联网提供更安全的连接。\n- **负载均衡器**：Azure 负载均衡器为虚拟机和应用程序提供高可用性和扩展性。它将流量分发到多个虚拟机，并可用于内部和外部负载均衡。\n\
    - **应用程序网关 (Application Gateway)**：Azure 网关是一种 Web 流量负载均衡器，为应用程序提供高级路由和 SSL 终止功能。它还可以提供额外的安全功能，如\
    \ Web 应用防火墙 (WAF)。\n- **Azure Firewall**：Azure Firewall 是一种托管的云端网络安全服务，为 VNet\
    \ 提供防火墙功能。它是一个全状态的防火墙，可以集中管理并提供高可用性和扩展性。\n- **网络安全组 (NSG)**：Azure NSG 是一种云端防火墙，允许用户过滤进出\
    \ Azure 资源的网络流量。NSG 可以应用于子网或单个虚拟机，并根据 IP 地址、端口和协议过滤流量。\n- **Azure Bastion**：Azure\
    \ Bastion 使用基于浏览器的界面为 Azure 虚拟机提供安全无缝的 RDP/SSH 连接。它消除了通过公共 IP 地址或 VPN 连接访问虚拟机的需求。\n\
    - **Azure DNS**：Azure DNS 是一种全托管 DNS 服务，为名称解析提供高可用性和扩展性。用户可以创建和管理 DNS 区域并将 Azure\
    \ DNS 与其本地基础设施集成。\n- **Traffic Manager**：Traffic Manager 是一种基于 DNS 的负载均衡器，可将接入流量分发到多个端点（包括\
    \ Azure 虚拟机、云服务）。它提供了故障转移能力并可优化全球性能。\n\n总体而言，Azure 提供了一系列网络服务，允许用户在云中构建安全、可扩展和高可用的架构。这些服务包括\
    \ VNet、VPN 网关、ExpressRoute、负载均衡器、应用程序网关、Azure Firewall、NSGs、Azure Bastion、Azure\
    \ DNS 和 Traffic Manager。\n\n## Azure Bastion 的流行\nAzure Bastion 是一个全托管的平台即服务 (PaaS)\
    \ 解决方案，由微软提供。它允许通过基于浏览器的界面提供安全且无缝的远程桌面 (RDP) 和安全外壳 (SSH) 连接到虚拟机。Azure Bastion\
    \ 允许无需将虚拟机直接暴露到互联网即可安全地访问虚拟机，这对于需要在任何地方管理应用程序或配置基础设施的场景非常有用。\n\n## 设置远程桌面协议\n\
    要在 Azure 中设置远程桌面协议，请遵循以下步骤：\n1. **使用 Azure CLI 创建子网**：首先，我们需要创建一个虚拟网络和子网：\n```bash\n\
    az network vnet create --resource-group MyResourceGroup --name VNet --address-prefixes\
    \ 10.0.0.0/16 --subnet-name Subnet --subnet-prefix 10.0.0.0/24\n```\n2. **创建公共\
    \ IP**：接下来我们需要创建一个 Bastion 资源使用的公共 IP 地址：\n```bash\naz network public-ip create\
    \ --resource-group MyResourceGroup --name MyPublicIp --sku Standard --allocation-method\
    \ Static\n```\n3. **创建 Bastion**：现在我们可以创建 Bastion 资源：\n```bash\naz network bastion\
    \ create --resource-group MyResourceGroup --name Bastion --vnet-name VNet --location\
    \ eastus --public-ip-address MyPublicIp\n```\n这将在 eastus 区域创建一个名为 Bastion 的新 Bastion\
    \ 资源，使用 VNet 和 MyPublicIp 地址。\n4. **使用 Azure CLI 连接到虚拟机**：一旦创建了 Bastion，我们就可以使用它安全地连接到同一\
    \ VNet 中的虚拟机：\n```bash\naz vm access --resource-group MyResourceGroup --name VM\
    \ --port 3389 --protocol tcp --from-bastion\n```\n此命令将允许从 Bastion 资源到虚拟机的 RDP\
    \ (TCP 端口 3389) 连接。\n5. **使用 Azure 门户连接**：以下是使用 Azure 门户的示例：\n   - 导航到 Azure 门户中的\
    \ Bastion 资源并点击“连接”。\n   - 从列表中选择虚拟机 (`VM`)。\n   - 输入您的用户名和密码。\n   - 点击“连接”。\n\
    这将通过 Bastion 资源启动到虚拟机的 RDP 会话。\n\n## 设置 VPN 网关\n要在 Azure 中设置 VPN 网关，请遵循以下步骤：\n\
    1. **使用 Azure CLI 创建子网**：首先，我们需要创建一个虚拟网络和子网：\n```bash\n```\n```\n(注：此处原文代码块重复或不完整，按要求保留翻译结构)\n\
