    Configure the properties of the network devices by double-clicking on them.Configure
    C++ Support in Network DevicesTo support C++ in network devices, we need to configure
    the appropriate settings in their configuration files. In the below sample program,
    we will be configuring a Cisco router to support C++.Double-click on the Cisco
    router and select the console tab. This will open the console for the router.
    Type the following commands:enableconfigure terminalinterface fastEthernet 0/0ip
