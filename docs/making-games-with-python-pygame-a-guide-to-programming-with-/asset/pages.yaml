  md: '# Flippy, an “Othello” Clone


    ![](img/9b1932f39c4ca4cfcc81c02125104271_307_0.png)


    Othello, also known by the generic name Reversi, has an 8 x 8 board with tiles
    that are black on one side and white the other. The starting board looks like
    Figure 10-1. Each player takes turn placing a new tile of their color. Any of
    the opponent''s tiles that are between the new tile and the other tiles of color
    is flipped. The goal of the game is to have as many of the tiles with your color
    as possible. For example, Figure 10-2 is what it looks like if the white player
    places a new tile on space 5, 6.


