- pgno: 19
  md: '2 http://inventwithpython.com/pygame


    download page, then look for the file “Python 3.2 Windows Installer (Windows binary
    -- does not source)” and click on its link to download Python for Windows.


    Double-click on the python-3.2.msi file that you just downloaded to start the
    Python installer. (If it doesn''t start, try right-clicking the file and choosing
    Install.) Once the installer starts up, keep clicking the Next and accept the
    choices in the installer as you go (no need to make any changes). When the installer
    is finished, Finish.


    # Mac OS X Instructions


    Mac OS X 10.5 comes with Python 2.5.1 pre-installed by Apple. Pygame only supports
    Python 2 and not Python 3. However, the programs in this book work with both Python
    2 and 3.


    The Python website also has some additional information about using Python on
    a Mac at http://docs.python.org/dev/using/mac.html.


    # Ubuntu and Linux Instructions


    Pygame for Linux also supports Python 2, not Python 3. If your operating system
    is Ubuntu, you can install Python by opening a terminal window (from the desktop
    click on Applications > Accessories > Terminal) and entering “sudo apt-get install
    python2.7?” then pressing Enter. You will need to enter the root password to install
    Python, so ask the person who owns the computer to type this password if you do
    not know.


