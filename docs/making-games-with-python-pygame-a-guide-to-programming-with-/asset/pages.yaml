    t program would have worked the exact same way. Why bother writing it?


    Normally when a function reaches the end and returns the None value implicitly
    (that is, there is

    no return statement saying that it is returning None) the code that it calls doesn''t
    care

    about the value. All function calls return a value (so that they can evaluate

    something and be part of expressions), but our code doesn''t use the return value.


    For example, think about the print() function. Technically, this function always
    returns the None

    value, but we care about it:


    ```

