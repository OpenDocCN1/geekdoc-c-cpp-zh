  md: '# CHAPTER 8 – SQUIRREL EAT SQUIRREL


    ![](img/9b1932f39c4ca4cfcc81c02125104271_217_0.png)


    # How to Play Squirrel Eat Squirrel


    Squirrel Eat Squirrel is loosely based on the game “Katamari Damacy”. The player
    controls a small squirrel that must hop around the screen eating smaller squirrels
    and avoiding larger squirrels. Each time the player’s squirrel eats a squirrel
    that is smaller than it, it grows larger. If the player’s squirrel gets hit by
    a larger squirrel than it, it loses a life. The player wins when the squirrel
    becomes a monstrous large squirrel called the Omega Squirrel. The player loses
    if their squirrel gets hit three times.


    I''m not really sure where I got the idea for a video game where squirrels eat
    each other. I''m a little strange something.


    # The Design of Squirrel Eat Squirrel


    There are three types of data structures in this game, which are represented as
    dictionary values. The types are player squirrels, enemy squirrels, and grass
    objects. There is only one player squirrel object at a time in the game.


    Technically, “object” means something specific in Object-Oriented Programming.
    Python does OOP features, but they aren’t covered in this book. Technically the
    Pygame objects such as “Rect object” or “Surface object” are objects. I''m going
    to use the term “object” in this book to refer to “things that exist in the game
    world”. But really, the player squirrel, enemy squirrels, and grass “objects”
    are just dictionary values.


