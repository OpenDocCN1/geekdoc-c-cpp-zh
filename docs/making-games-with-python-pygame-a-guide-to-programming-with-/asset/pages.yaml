- pgno: 203
  md: 'To calculate the level, we use the int() function to round down the score divided
    by 10. So if the score any number between 0 and 9, the int() will call it down
    to 0. The + 1 part of the code is there because we want the first level to be
    level 1, not level 0. When the score reaches 10, then int(10 / 10) will evaluate
    to 1, and the + 1 will make the level 2. Here is a graph showing the values of
    level for the scores 1 to 34:


    ![](img/9b1932f39c4ca4cfcc81c02125104271_203_0.png)


    To calculate the falling frequency, we start with a base time of 0.27 (meaning
    that the piece will naturally fall once every 0.27 seconds). Then we multiply
    the level by 0.02, and subtract from the 0.27 base time. On level 1, we subtract
    0.02 * 1 (that is, 0.02) from 0.27 to get 0.25. On level 2, we subtract 0.02 *
    2 (that is, 0.04) to get 0.23. You can think of the level * 0.02 part of the equation
    as “for every level, the piece will fall 0.02 seconds faster than the previous
    level."


    We can also make a graph showing how fast the pieces will fall at each level of
    the game:'
