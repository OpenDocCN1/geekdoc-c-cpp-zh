- pgno: 234
  md: '# Chapter 8 - Squirrel Eat Squirrel 217


    ![](img/9b1932f39c4ca4cfcc81c02125104271_234_0.png)


    The area that the camera can see (called the camera view) has it''s center (that
    is, its origin) at the game world coordinates (-486, -330). Since what the camera
    sees is displayed on the player’s screen, the “camera” coordinates are the same
    as the “pixel” coordinates. To find out the pixel coordinates of the squirrels
    (that is, where they appear), take the game coordinates of the squirrel and subtract
    the game coordinates of the camera’s origin.


    So the squirrel on the left has game coordinates of (-384, -84) but appears at
    (102, 246) on the screen in pixel coordinates. (For the X coordinate, -384 - -486
    = 102 and for the Y coordinate, -84 - -330 = 246.)


    When we do the same calculation to find the pixel coordinates of the other two
    squirrels, we find that they exist outside of the range of the screen. This is
    why they don’t appear in the camera’s view.


    # The “Active Area”


    The “active area” is just a name I came up with to describe the area of the game
    world that the camera views plus an area around the size of the camera area:


    ![](img/9b1932f39c4ca4cfcc81c02125104271_234_1.png)'
