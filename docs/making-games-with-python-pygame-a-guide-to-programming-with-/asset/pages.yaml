  md: '# Glossary 343


    with the Pygame drawing or blitting functions will appear on the screen when

    pygame.display.update() is called.


    Drawing Primitives - The name for the basic shape-drawing functions in Pygame.
    Drawing

    primitives include rectangles, lines, and ellipses. Drawing primitives do not
    include images

    the ones in .png or .jpg files.


    Event Handling - The code that performs actions in response to Event objects that
    have been

    generated by the user, such as key presses or mouse clicks.


    Event Handling Loop - The event code is usually inside a loop to handle each of
    the

    events that have been generated since the last time the event handling loop was
    executed.


    Event Queue - When events as mouse clicks or key presses happen, Pygame stores
    them in

    an internal queue data structure. Events can be removed and retrieved from the
    event queue by

    calling pygame.event.get ().


    FPS - See, Frames Per Second


    Frame - A single image that is displayed on the screen as part of an animation.
    Animated

    graphics will be composed of many frames, each shown for a split second.


    Frame Rate - See, Refresh Rate


    Frames Per Second - The measure of how many frames of an animation are displayed
    per

    second. It is common for games to run at 30 frames per second or more.


    Game Loop - The game loop contains code that performs event handling, updates
    the game

    world''s state, and draws the game world''s state to the screen. This is done
    many times a second.


    Game State - The entire collection of values that make up the game. This can include

    information about the player''s character, which pieces are on a board, or the
    score and level

    number.


    Graphical User Interface - A program that displays graphics to the user for output
    and can

    accept keyboard presses and mouse clicks for input.


    GUI - See, Graphical User Interface


    Immutable - Not changeable or modifiable. In Python, list values are mutable and
    tuple values

    are immutable.


    Interactive Shell - A program (part of IDLE) that executes Python instructions
    one at a time. The

    interactive shell is a good way to experiment with what a line of code does.'
