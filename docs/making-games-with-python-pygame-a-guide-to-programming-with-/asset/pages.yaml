  md: '# Chapter 10 – Four Extra Games 305


    # Ink Spill, a “Flood It” Clone


    ![](img/9b1932f39c4ca4cfcc81c02125104271_322_0.png)


    The “Flood It” begins with a board filled with colored tiles. On each turn the
    player chooses a new color to paint the left tile and any tiles adjacent to that
    color. The game makes use of the flood fill algorithm (described in the Star Pusher
    chapter). The goal of the game is to turn the entire board into a single color
    before running out of turns.


    This game also has a Settings screen where the player can change the size of the
    board and the difficulty of the game. If the player gets boards of the colors,
    there are a few other color schemes they can switch to as well.


    # Source Code for Ink Spill


    This source code can be downloaded from http://invpy.com/inkspill.py.


    The image files that Flappy Lucy can be downloaded from http://invpy.com/inkspillimages.zip.


