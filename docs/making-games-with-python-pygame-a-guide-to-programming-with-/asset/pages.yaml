- pgno: 344
  md: '# Gemgem, a “Bejeweled” Clone


    ![](img/9b1932f39c4ca4cfcc81c02125104271_344_0.png)


    “Bejeweled” is a game where gems fall up to a board. The player can swap any two
    adjacent gems to match three gems in a row (vertically or horizontally, but not
    diagonally). The matched gems then disappear, making way for new gems from the
    top. Matching more than three gems, causing a chain reaction of gem matches will
    result in more points. The player’s score slowly drops over time, so the player
    must constantly be making matches. The game ends when no possible match can be
    on the board.


    # Source Code for Gemgem


    This source code can be downloaded from http://invpy.com/gemgem.py.


    The image files from Flippy can be downloaded from http://invpy.com/gemgemimages.zip.


    ```

    1. # Gemgem (a Bejeweled clone)

    2. # By Al Schweigart@inventwithpython.com

    3. # http://inventwithpython.com/pygame

    4. # Released under a “Simplified BSD” license

    5. ""

    6. This program has "gem data structures", which are basically dictionaries

    7. with the following keys:

    8. - ''x'' and ''y'' - The Location of the gem on the board. 0,0 is the top left.

    9. There is also a ROWEBOARD that ''y'' can be set to,

    10. to indicate that it is above the board.

    11. - ''direction'' - one of the four constant variables UP, DOWN, LEFT, RIGHT.

    12. This is the direction the gem is moving.

    13. - ''imageNum'' - The integer index in GEMIMAGES to denote which image

    14. """ - this gem uses.

    ```'
