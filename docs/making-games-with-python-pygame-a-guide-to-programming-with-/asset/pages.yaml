    # Frames Per Second and pygame.time.Clock Objects


    The frame rate or refresh rate is the number of pictures that the program draws
    per second, and is measured in FPS or frames per second. (On computer, the common
    name for FPS is hertz. Many monitors have a frame rate of 66 hertz, 60 frames
    per second.) A low frame rate in video games can make the game look choppy or
    jumpy. If the program has too much code to draw the screen frequently enough,
    then the FPS goes down. But the games in this book are simple enough that this
    won''t be issue on old computers.


    A pygame.time.Clock object can help us sure our programs run at a certain maximum
    FPS. This Clock object will ensure that our game programs don''t run too fast
    by putting in small pauses on each iteration of the game loop. If we don''t have
    these pauses, our game would run as fast as the computer could run it. This is
    often too fast for the player, and as computers get faster they would run the
    game faster. A call to the tick() method of a Clock object in the game loop can
    make the game run at the same speed no matter how fast of a computer it runs.
    The Clock object is created on line 7 of the catanimation.py


    47. fpsClock = pygame.time.Clock()


    The Clock object''s tick() method should be called at the very end of the game
    loop, after the call to pygame.display.update(). The length of the pause is calculated
    on how long it has been since the previous call to tick(), which would have taken
    place at the end of the previous iteration of the game loop. The first tick()
    method is called, it doesn''t pause at all. In the animation program, it is run
    on line 45 as the last instruction in the game loop.


    All need to know that you should call the tick() method once per iteration through
    the game loop at the end of the loop. Usually this is right after the call to
    pygame.display.update().


    47. fpsClock.tick(FPS)


    Try modifying the FPS constant to run the same program at different frame rates.
    Setting it to a lower value would make the program slower. Setting it to a higher
    value would make the program run faster.'
