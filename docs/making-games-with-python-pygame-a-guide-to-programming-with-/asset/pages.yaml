    # Epoch Time


    Also in order to "time out", the current time returned by time.time() minus four
    seconds (because it is 4 stored in TIMEOUT) must be greater than the last time
    clicked a button (stored in lastClickTime). The reason why time.time() - TIMEOUT
    > lastClick works is to how epoch time works. Epoch time (also called Unix epoch
    time) is the number of seconds it has been since January 1st, 1970. This date
    is the Unix epoch.


    For example, when I run time.time() from the interactive shell (don''t forget
    to import the time module); it looks like this:


    ```

    >>> import time

    >>> time.time()

    132046242.118

    ```


    What this number means is the moment the time.time.time() function was called
    a little over 1,320,462,242 seconds since midnight of January 1st, 1970. (This
    translates to November 4th, 2011 at 7:30:42pm). You can learn how to convert from
    Unix epoch time to regular English time at http://invpy.com/epochtime


    If I call time.time() from the interactive shell a few seconds later, it might
    look like this:


    ```

    >>> time.time()

    1320460261.315

    ```


    1320460261.315 seconds after midnight of the Unix epoch is November 4th, 2011
    at 7:31:01pm.

    Actually, it''s 7:31 and 0.315 seconds if you want to be precise).


    Dealing with time would be difficult if we had to deal with strings. It''s hard
    to tell that 9 seconds have passed if we only had the string values ''7:30:42
    PM'' and ''7:31:01 PM'' to compare. But with epoch time, it''s just a matter of
    subtracting the integers 1320460261.315 - 1320460242.118, which evaluates to 19.197000267028881.
    This value is the number'
