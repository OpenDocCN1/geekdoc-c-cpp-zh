  md: '# CHAPTER 7 - TETROMINO


    ![](img/9b1932f39c4ca4cfcc81c02125104271_170_0.png)


    # How to Play Tetromino


    Tetromino is a Tetris clone. Differently shaped blocks (each made up of four boxes)
    fall from the top of the screen, and the player must guide them down to form complete
    rows that have no gaps in them. When a complete row is formed, the row disappears
    and each row above it moves down one row. The player tries to keep forming complete
    lines until the screen fills up and a new falling block cannot fit on the screen.


    # Some Tetromino Nomenclature


    In this chapter, I have come up with a set of terms for the different things in
    the game program.


    +   - **Board** – The board is made up of 10 x 20 spaces that the blocks fall
    and stack up.

    - **Box** – A box is a single filled-in square space on the board.

    - **Piece** – The things that fall from the top of the board that the player can
    rotate and position. Each piece has a shape and is made up of 4 boxes.

    - **Shape** – The shapes are the different types of pieces in the game. The names
    of shapes are T, S, Z, J, L, I, and O.


    ![](img/9b1932f39c4ca4cfcc81c02125104271_170_1.png)'
  merge: -1
  img_proc: true
- pgno: 171
  md: '154 http://inventwithpython.com/pygame


    +   - Template – A list of shape data structures that represents all the possible
    rotations of a shape. These are stored in variables with names like S_SHAPE_TEMPLATE
    or J_SHAPE_TEMPLATE.


    +   - Landed – When a piece has reached the bottom of the board or is touching
    a piece on the board, say that the piece has landed. At that point, the next piece
    should start falling.


    # Source Code to Tetromino


    This source code can be downloaded from http://invpy.com/tetromino.py. If you
