    So if the falling frequency is negative, then the condition on line 277 will always
    be True and the piece will fall on every iteration of the game loop. From level
    14 and beyond, the piece cannot fall any faster.


    If the FPS is set at 25, this means that at reaching level 14, the falling piece
    will fall 25 spaces a second. Considering that the board is only 20 spaces tall,
    that means the player will have less than a second to set each piece!


    If you want the pieces to start (if you can see what I mean) falling faster at
