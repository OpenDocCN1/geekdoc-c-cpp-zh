    \ on two boxes to see what icon is behind them. If the icons match, then those\
    \ boxes remain uncovered. The player wins when all the boxes on the board are\
    \ uncovered. To give the player a hint, the boxes are quickly uncovered at the\
    \ beginning of the game.\n\n# Nested for Loops\n\nOne concept that you will see\
    \ in Memory Puzzle (most of the games in this book) is the use of a for loop inside\
    \ another for loop. These are called nested loops. Nested for loops are handy\
    \ for going through every possible combination of two lists. Type the following\
    \ into the interactive shell:\n\n```\n>>> for x in [0, 1, 2, 3, 4]:\n    for y\
    \ in ['a', 'b', 'c']:\n        print(x, y)\n...\n0 a\n0 b\n0 c\n1 a\n1 b\n1 c\n\
