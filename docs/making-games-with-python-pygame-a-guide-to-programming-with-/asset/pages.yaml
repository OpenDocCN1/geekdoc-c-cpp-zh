  md: '# Drawing Images with pygame.


    The drawing functions are fine if you want to draw simple shapes on the screen,
    but many games have images (also called sprites). Pygame is able to load images
    onto Surface objects from PNG, JPG, GIF, and BMP image files. The differences
    between these image formats are described at http://inventwithpython.com/formats.


    The image of the cat was stored in a name file cat.png. To load this file''s image,
    the string ''cat.png'' is passed to the pygame.image.load() function. The pygame.image.load()
    function call return a Surface object that has the image drawn on it. This Surface
    object will be a separate Surface object from the display surface, so we must
    blit (it, copy) copy its Surface''s object to the display surface. Blitting drawing
    the contents of one Surface onto another. It is done with the blit() Surface object
    method.


    If you get an error message "pygame.error: Couldn''t open cat.png" when calling
    pygame.image.load(), make sure the cat.png file is in the same folder as the catanimation.py
    file before you run the program.


    | 39. | DISPLAYSUR.blit(catImg, caty) |


    Line 39 of the animation uses the blit() method to copy catImg onto DISPLAYSUR.
    There are two parameters for blit(). The first is the source Surface object, which
    is will be copied onto the DISPLAYSUR Surface object. The second parameter is
    a two-integer tuple for the X and Y values of the topleft corner where the image
    should be blitted.


    If cat and caty were set to 100 and 200 and the width of catImg was 125 and the
    height was 79, blit() would copy this image onto DISPLAYSUR so that the top left
