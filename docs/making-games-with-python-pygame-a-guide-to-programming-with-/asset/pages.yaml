- pgno: 334
  md: '# Four-In-A-Row, a “Connect Four” Clone


    ![](img/9b1932f39c4ca4cfcc81c02125104271_334_0.png)


    “Connect Four” has a 7 x 6 board where the players take dropping tokens from the
    top of the board. The tokens will fall from the top of each column and come to
    rest on the bottom of the board or on top of the topmost token in column. A player
    wins when four of their tokens line in a row either horizontally, vertically,
    or diagonally.


    The AI for this game is pretty good. It simulates every possible move it can make,
    then simulates every possible move the human player can make in *response to*
    that, and then simulates every possible move the player could make in *response
    to each of those moves!* After that to that, and seven moves in response to that,
    on each turn the computer is considering 7 x 7 7 x 7 = 2401 possible moves. You
    can make the computer consider the game even further by setting the *DIFFICULTY*
    constant to a higher number, but when I set to a value larger than 2, the computer
    takes a long time to calculate its.


    You can also make the computer easier by setting *DIFFICULTY* to 1. Then the computer
    only considers each of its moves and the player''s possible responses to those.
    If you set the *DIFFICULTY* to 0, then the computer loses all intelligence and
    simply makes random moves.


    # Source Code for Four-In-A-Row


    This source code can be downloaded from http://invpy.com/fourinarow.py.'
