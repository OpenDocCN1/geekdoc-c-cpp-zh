  md: '# Chapter 9 – Start Pusher 281


    When you run this, the function gets defined when the def statement on line A
    executes. The next line of code that is executed is line K, which calls passFortyTwoYouCallThisFunction()
    and passes (gasp!) 41. As a result, the function calls itself on line F and passes
    42. We call this the recursive call.


    This is what our program outputs:


    ```

    Start of function.

    You did not pass 42 when you called this function.

    Fine. I will do it myself.

    Start of function.

    Thank you for passing 42 when you called this function.

    End of function.

    End of function.

    ```


    Notice the "Start of function." and "End of function." text appears twice. Let’s
    figure out what exactly happens and what order it happens in.


    On line K, the function is called and 41 is passed for the param parameter. Line
    B prints out "Start of function.". The condition on line C will be True (since
    41 != 42) so Line C and D will print their messages. Line F will make a call,
    recursively, to the function and passes 42 for the parameter. So execution starts
    on line B again and prints out "Start of function.". Line C’s condition this is
    False, so it skips to line G and finds that to be True. This causes line H to
    be called and displays "Thank you..." on the screen. The last line of the function,
    line I, will execute to print out "End of function." and the function returns
    to the line it called.


    But remember, the line of code that called was line F. And in this original code,
    param was set to 41. The code goes down to line G and checks the condition, which
    is False (since 41 == 42 is False) so it skips the print() call on line H. Instead,
    it runs the print() call on line I which makes "End of function." for a second.


    Since it has reached the end of the function, it returns to the line of code that
    called that function, which was line K. There are no more lines of code after
    line K, so the program terminates.


    Note that local variables are not just to the function, but to a specific call
    of the function.


