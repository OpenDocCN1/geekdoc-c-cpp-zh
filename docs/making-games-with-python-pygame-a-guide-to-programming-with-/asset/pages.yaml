    Pygame has its own data structure that creates and appends Event objects as they
    are made. This data is the `event queue`. When `pygame.event.get()` function is
    called with no parameters, the entire list is returned. However, you can pass
    a constant like QUIT to `pygame.event.get()` so that it will return the QUIT events
    (if any) that are in the internal event queue. The rest of the events will stay
    in the queue for the next time `pygame.event.get()` is called.


    You should note that Pygame''s event queue only stores up to 127 Event objects.
    If your program does not call `pygame.event.get()` frequently enough and the queue
    fills up, then any new events that won''t be added to the event queue.


    Line 123 puts a list of QUIT events from Pygame''s event queue and returns them.
    If there are any QUIT events in the event queue, the program terminates.


    Line 125 puts all the KEYUP events from the event queue and checks if any of them
    are for the Esc key. If one of the events is, then the program terminates. However,
    there could be KEYUP events for the next frame''s KEYUP events for keys other
    than the Esc key. In this case, we need to put the KEYUP event back into Pygame''s
    event queue. We can do this with the `pygame.event.post()` function, which adds
