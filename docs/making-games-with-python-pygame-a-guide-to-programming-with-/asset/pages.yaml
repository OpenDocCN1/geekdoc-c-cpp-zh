    # Anti-Aliasing


    Anti-aliasing is a graphics technique for making text and shapes look blocky by
    adding a little bit of blur to its edges. It takes a little more computation time
    to draw with anti-aliasing, so although the graphics may look better, your program
    may run slower (but only just a little).


    If you zoom in on an aliased line and an anti-aliased line, they look like this:


    ![](img/9b1932f39c4ca4cfcc81c02125104271_47_0.png)


    Aliased (Blocky)

    Anti-Aliased (Smooth)


    To make Pygame’s text use anti-aliasing, just True for the second parameter of
    the render() method. The pygame.draw.aline() and pygame.draw.aalines() functions
    have the same parameters as pygame.draw.line() and


