- pgno: 239
  md: "```\nFile \"stdin\", line 2, in <module>\nIndexError: list index out of range\n\
    ```\n\nWe see why this error happens, let's walk through the code. The animals\
    \ list would be set to ['cat', 'mouse', 'dog', 'horse'] and len(animals) would\
    \ return 4. This means that the call to range(4) would cause the for loop to iterate\
    \ with 0, 1, 2, and 3.\n\nWhen the for loop iterates with i set to 2, the if statement\
    \ condition would be True and the del statement deletes animals[2]. This means\
    \ afterwards the animals list will be ['cat', 'mouse', 'horse']. The indexes of\
    \ all the items are all shifted down by the 'dog' value was removed.\n\nBut on\
    \ the next iteration the for loop, i is set to 3. Animals[3] is out of bounds\
    \ because the valid indexes of the list is no longer 0 to 3 but 0 to 2. The original\
    \ call to range() was for a list with 4 items in it. The list changed, but the\
    \ for loop is set up for the original length.\n\nHowever, if we iterate from the\
    \ list of index to 0, we don't run into this problem. The following program deletes\
    \ the 'dog' string from the animals without causing an\nIndexError\n\n```\nanimals\
    \ = ['cat', 'mouse', 'dog', 'horse']\n i in range(len(animals) - 1, -1, -1):\n\
    \    if animals[i] == 'dog':\n        del animals[i]\n```\n\nThe reason this doesn't\
    \ cause an error is because the for loop iterates over 3, 2, 1, and 0. On the\
    \ first iteration, the code checks if animals[3] is equal to 'dog'. It't (animals[3]\
    \ is 'horse') so the code moves on to the next iteration. Then animals[2] is checked\
    \ if it equals 'dog'. It does, animals[2] is deleted.\n\nAfter animals[2] is deleted,\
    \ the animals list is set to ['cat', 'mouse', 'horse']. On the next iteration,\
    \ i is set to 1. There is a value at animals[1] (the 'mouse' value), so no error\
    \ is caused. It doesn't matter that all the items in the list after 'dog' have\
    \ shifted down by one, because we started at the end of the list and are going\
    \ towards the front, all of those items have already been checked.\n\nSimilarly,\
    \ we can delete grass and squirrel objects from the grassObjs and squirrelObjs\
    \ lists without error because the for loop iterates on lines 155 and 159 iterate\
    \ in reverse order.\n\nEmail questions to the author: al@inventwithpython.com"
