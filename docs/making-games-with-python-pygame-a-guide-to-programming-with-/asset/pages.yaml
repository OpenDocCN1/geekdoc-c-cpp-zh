    Tuples and lists are the same in every way except: tuples use parentheses instead
    of square brackets, and the items in tuples cannot be modified (but the items
    in lists can be modified). We call lists mutable (meaning they can be changed)
    and tuples immutable (meaning they cannot be changed).


