    ''pie''). This value is also stored in the constant variable pi in the math module
    (which is why line 333 uses the variable, math.pi), which is technically the float
    value 3.141592653589793. Since we want a wavy-looking bounce for our squirrel,
    we''ll only pay attention to the return values of math.sin() for the arguments
