    # The Flood Fill Algorithm


    The flood fill is used in Pusher to create all of the floor tiles inside the walls
    of the level to use the "inside floor" tile instead of the "outside floor" tile
    (which all the tiles on the map are by default). The original floodFill() call
    is on line 295. It will convert tiles represented by the '' '' string (which represents
    an outdoor floor) to a ''o'' string (which represents an indoor floor).


    ```

    513. def floodFill(mapObj, x, y, oldCharacter, newCharacter):

    514.     """Changes any values matching oldCharacter on the map object

    515.     newCharacter at the (x, y) position, and does the same for the

    516.     positions to the left, right, down, and up of (x, y), recursively."""

    517.     # In this, the flood fill algorithm creates the inside/outside

    518.     # floor distinction.

    519.     # For more info on the Flood Fill algorithm, see:

    520.     # http://en.wikipedia.org/wiki/Flood_fill

    521.     if mapObj[x][y] == oldCharacter:

    522.         mapObj[x][y] = newCharacter

    ```


    Line 522 and 523 converts the XY coordinate to floodFill() to the newCharacter
    string if it was the same as the oldCharacter string.


    ```

    525. if x < len(mapObj) and mapObj[x+1][y] == oldCharacter:

    526.     floodFill(mapObj, x+1, y, oldCharacter, newCharacter) # call right

    527. if x > 0 and mapObj[x-1][y] == oldCharacter:

    528.     floodFill(mapObj, x-1, y, oldCharacter, newCharacter) # call left

    529. if y < len(mapObj[x]) and mapObj[x][y+1] == oldCharacter:

    530.     floodFill(mapObj, x, y+1, oldCharacter, newCharacter) # call down

    531. if y > 0 and mapObj[x][y-1] == oldCharacter:

    532.     floodFill(mapObj, x, y-1, oldCharacter, newCharacter) # call up

    ```


    These if statements check if the tile to the right, left, down, and up of the
    XY coordinate are the same as oldCharacter, and if, recursive call is made to
    floodFill() with those coordinates.


