- pgno: 362
  md: 'RGB Values - An RGB value is an exact value of a particular color. RGB stands
    for red, green blue. In Pygame, an RGB value is a tuple of three integers (all
    between 0 and 255) which represent the amount of red, green, and blue are in the
    color.


    Shell - See, Interactive Shell.


    Sine - A mathematical function that produces a wavy line when drawn on a graph.
    Python has a sine function in the math module: `math.sin()`.


    Sprites - A name given for a picture of something. Games commonly have a sprite
    for each kind it of object in the game.


    Stack Overflow - An error caused when a recursive function does not have a base
    case.


    Syntactic Sugar - A bit of code that is written to make the program more readable,
    even though it isn''t necessary for the program to work.


    Tileites - Tiles are a kind of sprite designed to be drawn on a 2D grid. They
    are usually images of the background, such as floors or walls.


    Title Bar - The bar along the top of programs that usually contain the program''s
    caption and close button. The style of the title bar varies between operating
    systems.


    X-axis - The horizontal arrangement of numbers used in cartesian coordinate systems.
    The X coordinates get smaller going to the left and larger going to the right.


    Y-axis - The vertical arrangement of numbers used in cartesian coordinate systems.
    The Y coordinates get smaller going up and larger going down. (This is the opposite
    of how the Y-axis works in mathematics.)'
