  md: 'Interpreter - The software that executes instructions in the Python programming
    language. On Windows, this is python.exe. When someone says, "Python runs this
    program", they mean "The interpreter software runs this program."


    Magic Numbers - Integers or floating-point values used in a program without explanation.
    Magic numbers should be replaced by constant variables with descriptive names
    to increase readability.


    Main Loop - See, Game Loop


    Member Variable - See, Attributes.


    Modulus Operator - In Python, the modulus operator is the % sign. It performs
    "remainder" arithmetic. For example, 22 / 7 is "3 remainder 1", then 22 % 7 is
    1.


    Multidimensional - Having than one dimension. In Python, this usually refers to
    a list contains another list, or a dictionary contains a tuple (which in turn
    could contain other lists, tuples, or dictionaries).


    Mutable - Changeable or modifiable. In Python, list values are mutable and tuple
    values are immutable.

    The number of diameter lengths is the same number no matter what size of the circle
    is. This value is available in the module math.pi, which is the float 3.141592653589793,


    Pixels - Stands for "picture element.". A pixel is a single square of color on
    the computer screen. The screen is made up of hundreds or thousands of pixels
    which can be set to different colors to form an image.


    Points - A point in Python is usually represented as a tuple of two integers (or
    float values) to represent the X and Y coordinates of a position on a 2D surface.


    Properties - See, Attributes.


    Real-time - A program that runs continuously and does not wait for the player
    to do something is said to run in real-time.


    Recursive Call - The function call in a recursive function that calls same function.


    Recursive Function - A function that calls itself.


    Refresh Rate - The frequency that the computer screen updates its image. A high
    or fast refresh rate will make animations appear smoothly, while a low or slow
    refresh rate will make animation choppy. Refresh rate is measured in FPS or hertz
    (which mean the same thing).


    Email questions to the author: al@inventwithpython.com'
