  md: '# CHAPTER 1 – INSTALLING PYTHON AND PYGAME


    # What You Should Know Before You Begin


    It might help if you know a bit about Python programming (or how to program in
    another language besides Python) before you read through this book; however even
    if you haven''t you can still read this book away. Programming isn''t nearly as
    hard as people think it is. If you run into some trouble, you can read the free
    “Your Own Computer Games with Python” online at http://inventwithpython.com or
    look up a topic that you find confusing in the Invent with Pygame wiki at http://inventwithpython.com/wiki.


    You don''t need to know how to use the Pygame library before reading this book.
    The next chapter is a beginner tutorial on all of Pygame''s major features and
    functions.


    In case you haven''t read the first book and already installed Python and Pygame
    on your computer, the installation instructions are in this chapter. If you already
    have installed both of these you can skip this chapter.


    # Downloading and Installing Python


    Before we begin programming you''ll need to install software called the Python
    interpreter on your computer. (You may need to ask an adult for help here.) The
    interpreter is a program that understands the instructions that you''ll write
    (or rather, type out) in the Python language. Without your interpreter, your computer
    won''t be able to run your Python programs. We will just refer to “the Python
    interpreter” as “Python” from now on.


    The interpreter software can be downloaded from the official website of the Python
    programming language, http://www.python.org. You might want the help of someone
    else to download and install the Python software. The installation is a little
    different depending on if your computer''s operating system is Windows, Mac OS
    X, or a Linux OS such as Ubuntu. You can also find videos online of installing
    the Python software on your computers at http://invpy.com/installing.


    # Windows Instructions


    When you get to http://python.org, you should see a list of links on the left
    (such as “About”, “News”, “Documentation”, “Download”, and so on). Click on the
    Download link to go to the'
