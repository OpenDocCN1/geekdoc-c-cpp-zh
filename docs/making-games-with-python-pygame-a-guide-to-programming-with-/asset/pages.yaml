    To move, we add a new body segment to the beginning of the wormCoords list. Because
    the body segment is being added to the beginning of the list, it will become the
    new head. The coordinates of the new head will be right next to the head''s coordinates.
    Whether it is added or subtracted from the X or Y coordinate determines the direction
    the worm was going.


    This new head is added to wormCoords with the insert() list method on line 100.


    # The insert () List Method


    Unlike the append() list method that can only add items to the end of a list,
    the insert() list method can add items anywhere inside the list. The first parameter
    for insert() is the index where it should go (all the items at this index and
    after them their indexes increase by one). If the first parameter is larger than
    the length of the list, the item is simply added to the end of the list (just
    like what append() does). The second parameter for insert() is the value to be
    added. Type the following into the interactive shell to see insert() works:


    ```

    >>> spam = [''cat'', ''dog'', ''bat'']

    >>> spam.insert(0, ''frog'')

    >>> spam

    [''frog'', ''cat'', ''dog'', ''bat'']

    >>> spam.insert(10, 42)

    >>> spam

    [''frog'', ''cat'', ''dog'', ''bat'', 42]

    >>> spam.insert(2, ''horse'')

    >>> spam

    [''frog'', ''cat'', ''horse'', ''dog'', ''bat'', 42]

    ```


