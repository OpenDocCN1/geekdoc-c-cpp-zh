  md: '# CHAPTER 2 – PYGAME BASICS


    Just like Python comes with several modules like `random`, `math`, or `time` that
    provide additional functions for your programs, the Pygame framework includes
    several modules for drawing graphics, playing sounds, handling mouse input, and
    other things.


    This chapter will cover the basic modules and functions that Pygame provides and
    assumes you already know Python programming. If you have trouble with some of
    the programming concepts, you can read through the "Invent Your Own Computer Games
    with Python" book online at http://invpy.com/book. This book is aimed at beginners
    to programming.


    The "Invent with Python" book also has a few chapters covering Pygame. You can
    read them online at http://invpy.com/chap17.


    Once you learn more about Pygame, you can view the other modules that Pygame provides
    from the online documentation at http://pygame.org/docs.


    # GUI vs. CLI


    The programs that you can write with Python''s built-in functions only deal with
    text through the `print()` and `input()` functions. Your program can display text
    on the screen and let the user type in text from the keyboard. This type of program
    has a **command line interface**, or CLI (which is pronounced like the first part
    of "climb" and rhymes with "sky"). These programs are limited because they can''t
    display graphics, have colors, or use the mouse. CLI programs only get input from
    the keyboard and even then user must press Enter before the program can respond
    to the input. This means **real-time** (that is, continuing to run without waiting
    for the user) action games are impossible to make.


    Pygame provides functions for creating programs with a **graphical user interface**,
    or GUI (pronounced, "goey"). Instead of a text-based CLI, programs with a graphics-based
    GUI can show a window with images and colors.


    # Source Code for Hello World with Pygame


    Our first program with Pygame is a small program that makes a window that says
    "Hello World!" appear on the screen. Open a new file editor by clicking IDLE''s
