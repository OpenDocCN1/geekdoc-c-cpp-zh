    # ## Data Structures in Star Pusher


    Star Pusher has a specific format for the levels, maps, and game data structures.


    # ## The “Game State” Data Structure


    The game object will be a dictionary with three keys: ''player'', ''stepCounter'',
    and ''stars''.


    +   - The value at the ''player'' key will be a tuple of two integers for the
    current XY position of the player.

    - The value at the ''stepCounter'' key will be an integer that tracks how many
    moves the player has made in this level (so the player can try to solve the puzzle
    in the future with fewer steps).

    - The value at the ''stars'' key will be a list of two-tuples of XY values for
    each of the stars on the current level.


    # ## The “Map” Data Structure


    The map data structure is simply a 2D list of lists where the two indexed represent
    the X and Y coordinates of the map. The value at each index in lists is a single-character
    string that represents the title that is on map at each space:


    +   - ''# '' – A wooden wall.

    - ''X'' – A corner wall.

    - ''@'' – The starting space for the player on this level.

    - ''.'' – A goal space.

    - ''$'' – A space where a star is at the start of the level.'
