  md: '|105.| result = runLevel(levels, currentLevelIndex)|


    The runLevel() function handles all the action for the game. It is a list of level
    objects, and the integer index of level in that list to be played. When the player
    has finished playing the level, runLevel() will return one of the following strings:
    ''solved'' (because the player has finished putting all stars on the goals), ''next''
    (because the player wants to skip to the next level), ''back'' (because the player
    wants to go back to the previous level), and ''reset'' (because the player wants
    to start playing the current level again, maybe because they pushed a star into
    a corner).


    |107.| if result in (''solved'', ''next''):|

    108.| # Go to the next level.

    109.| currentLevelIndex += 1|

    110.| if currentLevelIndex >= len(levels):|

    111.| # If there are no more levels, go back to the first one.

    112.| currentLevelIndex = 0|

    113.| elif result == ''back'':|

    114.| # Go to the previous level.

    115.| currentLevelIndex -= 1|

    116.| if currentLevelIndex < 0:|

    117.| # If there are no previous levels, go to the last one.

    118.| currentLevelIndex = len(levels)-1|


    runLevel() has returned the strings ''solved'' or ''next'', then we need to increment
    levelNum by 1. If this increments levelNum beyond the number of levels there are,
    then levelNum is set back at 0.


    The opposite is done if ''back'' is returned, levelNum is decremented by 1. If
    this makes it below 0, then it is set to the last level (which is len(levels)-1).


    |119.| elif result == ''reset'':|

    120.| pass # Do nothing. Loop re-calls runLevel() to reset the level|


    If the value returned ''reset'', then the code does nothing. The pass statement
    does nothing (like a comment), but it is needed because the Python interpreter
    expects an indented line of code after an elif statement.


    We could remove lines 119 and 120 from the source code entirely, but the program
    will still work the same. The reason we include here is for program readability,
    and if we make changes to the code later, we won''t forget that runLevel() can
    also return the string ''reset''.


