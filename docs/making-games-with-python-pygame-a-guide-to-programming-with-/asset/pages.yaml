- pgno: 4
  md: '# WHO IS THIS BOOK FOR?


    When you get down to it, programming video games is just about lighting up pixels
    to make pretty pictures appear on the screen in response to keyboard and mouse
    input.


    And there are very few things that are as fun.


    This book will teach you how to make graphical computer games in the Python programming
    language using the Pygame library. This book assumes you know a little about Python
    or programming in general. If you don''t know how to program, you can learn by
    downloading the free book "Your Own Computer Games with Python" from http://inventwithpython.com.
    Or you can jump into this book and mostly pick it up along the way.


    This book is for the intermediate programmer who has learned what variables and
    loops are, but now wants to know, "What do actual games look like?” There was
    a long gap after I learned programming but didn''t really know how to use that
    skill to make something cool. It''s my hope that the games in this book will give
    you enough ideas about how programs work to provide a foundation to implement
    your own games.


    The full text of this book is available in HTML or PDF format at http://inventwithpython.com/pygame.


    > -Al Sweigart


    ![](img/9b1932f39c4ca4cfcc81c02125104271_4_0.png)'
