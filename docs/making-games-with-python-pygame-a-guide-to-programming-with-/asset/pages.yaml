  md: '+   * ''+'' – A space with a goal and the starting player''s space.


    +   * ''*'' – A space with a goal and a star at the start of the level.


    +   * '' '' – A grassy outdoor space.


    +   * ''o'' – Inside floor space (This is a lowercase letter O, not a zero).


    +   * ''1'' – A rock on grass.


    +   * ''2'' – A short tree on grass.


    +   * ''3'' – A tall tree on grass.


    +   * ''4'' – An ugly tree on grass.


    # # The “Levels” Data Structure


    The level object contains a game state object (which will be the state used when
    the level first starts), a map object, and a few other values. The level object
    itself is a dictionary with the following keys:


    +   * The value of the key `width` is an integer of how many tiles the entire
    map is.


    +   * The value of the key `height` is an integer of how many tiles the entire
    map is.


    +   * The value of the key `mapobj` is the map object for this level.


    +   * The value of the key `goals` is a list of two-integer tuples with the XY
    coordinates of each space on the map.


    +   * The value of the key `startState` is a game state object used to show the
    starting position of the stars and player at the start of the level.


    # # Writing Text Files


    Python has functions for reading files off the player’s hard drive. This will
    be useful for having a separate key for all of the data for each level. This is
    also a good idea to get new levels, the player doesn’t have to change the source
    code of the game but instead can download new level files.


    # # Text Files and Binary Files


    Text files contain simple text data. Text files are created in Windows by the
    Notepad application, Edit on Ubuntu, and TextEdit on OS X. There are many other
    programs called text editors that can create and modify text files. IDLE’s own
    file editor is a text editor.


    The difference between text editors and word processors (like Microsoft Word,
    or OpenOffice Writer, is that text editors have text only. You can’t set the font,
    size, or color of the text. IDLE automatically sets the color of the text based
    on what kind of Python code it is, but you can’t change this yourself, so it is
    still a text editor.) The difference between text and binary files is not important
    for this game program, but you can read about it at'
