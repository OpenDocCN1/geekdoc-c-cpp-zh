    Rect returned by line 199''s `pygame.Rect()` call isn''t the same as the one that
    was passed to the `pygame.draw.rect()` call on line 202.


    Little things like this make it harder to understand how exactly your program
    works. It won''t just be other programmers looking at your code who will be confused.
    When you look at your own code a couple of weeks after writing it, you may have
    a hard time remembering exactly how it works. Code readability is much more important
    than saving a few bytes here and there.


