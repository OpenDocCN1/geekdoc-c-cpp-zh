  md: '# GLOSSARY


    **Alpha Value** - The amount of transparency for a color. In Pygame, alpha values
    range from 0 (completely transparent) to 255 (completely opaque).


    **Anti-Aliasing** - A technique for making shapes smoother and less blocky by
    adding fuzzy colors to its edges. Anti-aliased drawings look smooth. Aliased drawings
    look blocky.


    **Attributes** - A variable that is part of an object. For example, Rect objects
    have members such as top and left which hold integer values for the Rect object.


    **Backwards Compatibility** - Writing code that is compatible with older versions
    of software. Python 3 has many backwards-incompatible features with Python 2,
    but it is possible to write Python 3 programs that are backwards-compatible with
    Python 2.


    **Base Case** - In recursion, the base case is the condition that stops further
    recursive function calls. A base case is necessary to prevent stack overflow.


    **Blitting** - A word that means copying the image on one Surface to another.
    Programming in general, it means to copy one image to another.


    **Bounding Rectangle** - The smallest rectangle that can be drawn around another
    shape.


    **Camera** - A view of a particular part of the game world. Cameras are used when
    the game world is too large to fit on the player''s screen.


    **Caption** - In programming, the caption is the text on the title bar of the
    window. In Pygame, the caption can be set with `pygame.display.set_caption()`
    function.


    **CLI** - See, Command Line Interface


    **Command Line Interface** - A program that the user can use by seeing text on
    the screen and typing text through the keyboard. Old computers used to be able
    to run CLI programs, but new computers use Graphical User Interfaces.


    **Constructor Function** - The function that creates a new object. In Python,
    these functions have the same name as the kind of objects they produce. For example,
    `pygame.Rect()` creates Rect objects.


    **Display Surface** - The Surface returned by the call to `pygame.display.set_mode()`.
    This Surface object is special because anything drawn on it'
