    White''s second move at 3, 6 will flip two of black''s tiles.


    The board after white''s second move.


    As you can see, each player can quickly grab a majority of the tiles on the board
    in one or two moves. Players must always make a move that captures at least one
    tile. The game ends when either player cannot make a move, or the board is completely
    full. The player with the most tiles of their color wins.


    You can learn more about Reversi from Wikipedia: http://en.wikipedia.org/wiki/Reversi


    A text version of this uses print() and input() instead of Pygame is featured
    in Chapter 15 of "Invent Your Own Computer Games with Python". You can read that
    chapter how the computer AI''s algorithm was put together. http://inventwithpython.com/chapter15.html


    The computer AI for this game is pretty good, because it is easier for a computer
    to simulate every possible move and take the one that flips over the tiles. It
    usually beats me whenever I play it.


