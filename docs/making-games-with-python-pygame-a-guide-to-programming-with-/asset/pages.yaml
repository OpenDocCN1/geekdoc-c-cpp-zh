    for programs that need to do a load of calculations, whether they are scientific
    weather simulators or games with a large amount of detailed 3D graphics to draw.
    It''s also good to use the least amount of memory possible. The more variables
    and the larger lists you use, the more memory it takes up. (You can find how to
    measure your program''s memory usage and execution time at http://invpy.com/profiling.)


