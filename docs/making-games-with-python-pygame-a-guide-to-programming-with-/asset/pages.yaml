  md: '# Chapter 2 – Pygame Basics 11


    taking damage (which lowers their health value), or an enemy moves somewhere,
    or something happens in the game world we say that the game state has changed.


    If you''ve ever played a game that let you saved, the "save state" is the game
    state at the point you''ve saved it. In most games, pausing the game will prevent
    the game state from changing.


    Since the game state is usually updated in response to events (such as mouse clicks
    or keyboard presses) or the passage of time, the game loop is constantly checking
    and re-checking many times a second for any new events that have happened. Inside
    the main loop is code that looks at which events have been created (with Pygame,
    this is done by calling `pygame.event.get()` function). The main loop also has
    code that updates the game state based on which events have been created. This
    is usually called event handling.


    ![](img/9b1932f39c4ca4cfcc81c02125104271_28_0.png)


    # pygame.event.Event Objects


    Any time the user does one of several actions (they are listed later in this chapter)
    such as pressing a key or moving the mouse on the program''s window, a `pygame.event.Event`
    object is created by the Pygame library to record this "event". (This is a type
    of called Event that exists in the event module, which itself is in the `pygame`
    module.) We can find out which events have happened by calling `pygame.event.get()`
    function, which returns a list of `pygame.event.Event` objects (which we will
    just call Event for short).


    The list of Event objects will be for each event that has happened since the last
    time the `pygame.event.get()` function was called. (Or, if `pygame.event.get()`
    has never been called, the events that have happened since the start of the program.)'
