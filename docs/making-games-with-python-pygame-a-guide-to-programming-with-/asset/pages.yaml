    Remember that line 21 set the BOUNCE constant to 6. This means that our code will
    only increment playerObj[''bounce''] from 0 to 6 and we want to split the range
    of floating-point values from 0 to 3.14 into 6 parts, which we can do with simple
    division: 3.14 / 6 = 0.5235. Each of the 6 parts of 3.14 length on the graph for
    the "sine wave" = 0.5235.


    You can see that when playerObj[''bounce''] is at 3 (halfway between 0 and 6),
    the value passed to the math.sin() / 6 is math.pi / 3, which is 1.5707 (halfway
    between 0 and 3.1415). Then math.sin(1.5707) will return 1.0, which is the highest
    part of the sine wave (and the highest part of the sine wave has half way through
    the wave).'
