    by 1. The isValidPosition() function has optional parameters called adjX and adjY.
    Normally the isValidPosition() function checks the position of the data provided
    by the piece object that is passed for the parameter. However, sometimes we don''t
    want to check where the piece is currently located, but a few spaces away from
    that.


    If we pass -1 for adjX (a short name for "adjustedX\ then it doesn''t check the
    validity of the position in the piece''s data structure, but rather the position
    of the piece would be if it was one space to the left. Passing 1 for adjX would
    check one space to the right. There is also an adjY optional parameter. Passing
    -1 for adjY checks one space above where the piece is currently positioned, and
    a value like 3 for adjY checks three spaces down from where the piece is.


