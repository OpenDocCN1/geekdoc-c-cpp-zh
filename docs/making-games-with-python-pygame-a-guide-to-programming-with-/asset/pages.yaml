    # Writing to Files


    To create a file, the open() function takes two arguments: a string for the name
    of the file, and the string ''w'' to tell the open() function you want to open
    the file in "write" mode. the open() function returns a file object


    ```

    >>> textFile = open(''hello.txt'', ''w'')

    >>>

    ```


    If you run this code from the interactive shell, the hello.txt file that this
    creates will be created in the same folder that the python.exe program is (on
    Windows, this will probably be C:\Python32). If the open() function is called
    from a .py program, the file is in the same folder that .py file is.


    The "write" mode tells open() to create the file if it does not exist. If it does
    exist, open() will delete that file and create a new, blank file. This is just
    like how assignment statement can create a new variable, or overwrite the current
    value in an already existing variable. This can be somewhat dangerous. If you
    accidentally send a filename of an important file to the open() function with
    ''w'' as the second parameter, it will be deleted. This could result in having
    to reinstall the operating system on your computer or the launching of nuclear
    missiles.


    The file object has a method write() which can be used to write text to the file.
    Just pass it string like you would pass a string to the print() function. The
    difference is that write() does not automatically add a newline character ''\n''
    to the end of the string. If you want to add a newline, you will have to include
    it in the string:


    ```

    >>> textFile = open(''hello.txt'', ''w'')

    >>> textFile.write(''This will be the content of the file.\nHello world!\n'')

    >>>

    ```


    To tell Python that you are writing content to this file, you should call close()
    method of the file object. (Although Python will automatically close any opened
    file objects when the program ends.)


    ```

    >>> textFile.close()

    ```'
