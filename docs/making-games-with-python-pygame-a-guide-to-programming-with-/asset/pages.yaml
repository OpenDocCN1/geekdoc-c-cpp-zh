  md: '# CHAPTER 9 – STAR PUSHER


    ![](img/9b1932f39c4ca4cfcc81c02125104271_259_0.png)


    # How to Play Star Pusher


    Star Pusher is a Sokoban or "Box Pusher" clone. The player is in a room with several
    stars. There are star marks on the grounds of the tiles in the room. The player
    must figure out how to push the stars on the top of the tiles with star marks.
    The player cannot push a star if there is a wall or star mark behind it. The player
    cannot pull stars, so if a star gets pushed into a corner, the player will have
    to restart the level. When all of the stars have been pushed onto star-marked
    floor tiles, the level is complete and the next level starts.


    Each level is made up of a 2D grid of tile images. **Tile sprites** are images
    of the same size that can be placed next to each other to form more complex levels.
    With a few floor and wall tiles, we can create levels of interesting shapes and
    sizes.


    The level files are not included in the source code. Instead, you can create the
    level files yourself or download them. http://invpy.com/starPusherLevels.txt.
    When you run the Star Pusher program, make sure that the level file is in the
    same folder as the starpusher.py. Otherwise you will get this error message: `AssertionError:
    Cannot find the level file: starPusherLevels.txt`


    The level designs were originally made David W. Winkler. You can download more
    puzzles at http://users.bentora.com/~squasquatch/sokoban/.


