    # Drawing the Game State to the Screen


    | 120. | # Redraw the screen and wait a clock tick. |

    | 121. | pygame.display.update() |

    | 122. | FPSCLOCK.tick(FPS) |


    At this point, the game state has been updated depending on the player’s input,
    and the latest game state has been very end of the game loop, so we call pygame.display.update()
    to draw the DISPLAYSURFACE Surface object to the computer screen.


    Line 9 sets the FPS to the integer value 30, meaning we want the game to run (at
    most) 30 frames per second. If we want the program to run slower, we can decrease
    this number. It can even be set to a float value 0.5, which will run the program
    at a half frame per second, that is, one frame per two seconds.


    In order to run at 30 frames per second, each frame must be drawn in 1/30th of
    a second. This means that pygame.display.update() and all the code in the game
    loop must execute in under 33.3 milliseconds. Any modern computer can do this
    easily with plenty of time left over. To prevent the program from running too
    fast, we call the tick() method of the pygame.Clock object in FPSCLOCK to have
    it pause the program for the rest of the 33.3 milliseconds.


    Since this is at the very end of the game loop, it ensures that each iteration
    of the game loop takes (at least) 33.3 milliseconds. If for reason the pygame.display.update()
    call and the code in the game loop takes longer than 33.3 milliseconds, then the
    tick() method will not wait at all and immediately return.'
