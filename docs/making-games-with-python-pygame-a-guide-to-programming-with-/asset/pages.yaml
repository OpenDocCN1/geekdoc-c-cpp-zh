  md: '50 http://inventwithpython.com/pygame


    variables. Inside the main() function, those names are not for local variables
    that might just happen to have the same name as global variables. They are the
    global variables. Any values assigned to them the main() function will persist
    outside the main() function. We are marking the FPSCLOCK and DISPLAYSURF as global
    because they are used in several other functions in the program. (More info is
    at http://pygame.org/scope.)


    There are four simple rules to determine if a variable is local or global:


    +   1. If there is a global statement for a variable at the beginning of the function,
    then that is global.

    2. If the name of a variable in a function has the same name as a global variable
    and the function never assigns a value, then that variable is the global variable.

    3. If the name of a variable in a function has the same name as a global variable
    and the function assigns a value, then that is a local variable.

    4. If there isn''t a global variable with the same name as the variable in the
    function, then that is obviously a local variable.


    You generally avoid using global variables inside functions. A function is supposed
    to be like a mini-program inside your program with inputs (the parameters) and
    an output (the return value). But a function that reads and writes to global variables
    has additional inputs and output. Since the global variable could have been modified
    in many places before the function was called, it can be tricky to track down
    a bug involving a bad value set in the global variable.


    Having a function as a separate mini-program that doesn''t use global variables
    makes it easier to find bugs in your code, the parameters of the function are
    clearly known. It also makes changing the code in a function easier, if the new
    function works with the same parameters and gives the same return value, it will
    automatically work with the rest of the program just like the old function.


    Basically, using global variables might make it easier to write your program but
    they generally make it harder to debug.


    In games this book, global variables are mostly used for variables that would
    be global constants that never change, but need the pygame.init() function called
    first. Since this happens in the main() function, they are set in the main() function
    and must be global for other functions to use. But the global variables are used
    as constants and don''t change, they are less likely to cause confusing bugs.


    If you don''t understand this, don''t worry. Write your code so that you pass
