    # How to Play Wormy


    Wormy is a Nibbles clone. The player starts controlling a short worm that is constantly
    moving around the screen. The player cannot stop or slow down the worm, but they
    can control direction it turns. A red apple appears randomly on the screen, and
    the player must move the worm so that it eats the apple. Each time the worm eats
    an apple, the worm grows longer by one segment and a new apple appears randomly
    on the screen. The game is over if the worm crashes into itself or the edges of
    the screen.


