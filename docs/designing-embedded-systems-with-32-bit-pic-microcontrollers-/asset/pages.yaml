  md: "# 30 Chapter 1\n\ntechnical calculations. The most commonly used floating point\
    \ standard is the IEEE standard. According to this standard, floating point numbers\
    \ are represented with 32 bit (single precision) or 64 bit (double precision).\n\
    \nIn this section, we shall be looking at the format of 32-bit floating point\
    \ numbers only and how mathematical operations can be performed with such numbers.\n\
    \nAccording to the IEEE standard, 32-bit floating point numbers are represented\
    \ as follows:\n\n```\n31 30             23 22                0\nX XXXXXXX XXXXXXXXXXXXXXXXXXXX\n\
    \      ↑                 ↑\nsign exponent         mantissa\n```\n\nThe most significant\
    \ bit indicates sign of the number where 0 indicates positive, and 1 indicates\
    \ that the number is negative.\n\nThe 8-bit exponent shows the power of the number.\
    \ To make the calculations easy, the sign of the exponent is not shown, but instead\
    \ 128 numbering system is used. Thus, to find the real exponent, we have to subtract\
    \ 127 from the given exponent. For example, if the mantissa is “10000000”, the\
    \ real value of the mantissa is $128-127 = 1$.\n\nThe mantissa is 23-bits and\
    \ represents the increasing negative powers of 2. For example, if we assume that\
    \ the mantissa is: “11100000000000000000000”, the value of this mantissa is calculated\
    \ as: $2^{-1} + 2^{-2} + 2^{-3} = 7/8$.\n\nThe decimal equivalent of a floating\
    \ point number can be calculated using the formula:\n\n> Number = (-1)^s \\cdot\
    \ 2^{e-127} \\cdot f\n\nwhere,\n\ns = 0 for positive numbers, 1 for negative numbers\n\
    e = exponent (between 0 and 255)\nf = mantissa.\n\nAs shown in the above formula,\
    \ there is a hidden “1” in-front of the mantissa, i.e. mantissa is shown as “1·f”.\n\
    \nThe largest and the smallest numbers in 32-bit floating point format are as\
    \ follows:\n\n# 1.22.1 The Largest Number\n\n```\n0 11111110 11111111111111111111111\n\
    ```\n\nThis number is $(2-2^{-23})2^{127}$ or $3.403 \times 10^{38}$. The numbers\
    \ keep their precision to six digits after the decimal point."
