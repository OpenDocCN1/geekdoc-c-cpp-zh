    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_278_1.png)


    Figure 7.2

    LED dice.


    As shown in Figure 7.2, the LEDs are organized such that when they turn ON, they
    indicate the numbers as in a real dice. Operation of the project is as follows:
    normally, the LEDs are all OFF to indicate that the system is ready to generate
    a new number. Pressing the switch generates a random dice number between 1 and
    6 and displays on the LEDs for 3 s. After 3 s, the LEDs turn off again.


    An LED can be connected to a microcontroller output port in two different modes:

    current-sinking mode and current-sourcing mode.


    # 7.1.2 Current-Sinking


    As shown in Figure 7.3, in current-sinking mode, the anode leg of the LED is connected
    to the Vdd supply, and the cathode leg is connected to the microcontroller output
    port through a current-limiting resistor.


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_278_2.png)


    Figure 7.3

    LED connected in current-sinking mode.'
