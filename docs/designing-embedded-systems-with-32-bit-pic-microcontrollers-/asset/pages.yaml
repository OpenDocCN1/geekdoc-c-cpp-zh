    # The MCU Card


    The LV-32MX V6 board provides a DIMM-168P connector to place an MCU card into.
    There are several MCU cards available but the board is distributed with an MCU
    card with a PIC32MX460F512L 100-pin TQFP package installed on it. In addition
    to the microcontroller chip, the MCU cards contain a crystal oscillator and 102
    soldering pads connected to the microcontroller pins. Figure 5.64 shows the board
    with an MCU card installed.


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_248_1.png)


