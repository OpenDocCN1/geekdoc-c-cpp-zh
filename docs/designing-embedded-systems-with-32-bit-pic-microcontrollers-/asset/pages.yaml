  md: '# Simple PIC32 Microcontroller Projects


    In this chapter, we shall be looking at the design of simple PIC32 32-bit microcontroller-based
    projects, with the idea of becoming familiar with basic interfacing techniques
    and how to use the various microcontroller peripheral registers. We will look
    at the design of projects using light-emitting diodes (LEDs), push-button switches,
    keyboards, LED arrays, devices and so on, and we will develop programs in C language
    using microK Pro for PIC32 compiler. Most of the hardware for the projects is
    designed around the popular LV-32MX V6 development board (with an on-board PIC32MX460F512L
    32-bit microcontroller). A breadboard is used where necessary to include any additional
    components required for the projects. It is recommended that we start with simple
    projects and proceed to more complex ones. The given order. The following are
    provided for each project:


    +   * Description of the project

    * Block diagram of the project

    * Circuit diagram of the project

    * Description of the hardware

    * Algorithm description (in program description language PDL)

    * Program listing

    * Photos of the project (where applicable)

    * Suggestions for further development.


    In this book, we will be using the PDL for all projects.


    # 7.1 Project 7.1—LED DICE


    # 7.1.1 Project Description


    This is a simple dice project based on LEDs, a push-button switch, and a PIC32MX460F512L
    microcontroller operating with 8 MHz crystal. Notice that in all of the projects
    in this book although the crystal frequency is 8 MHz, the microcontroller is operated
    at a clock rate of 80 MHz b configuring the built-in clock phase locked loop (PLL)
    module and the clock circuitry. This is done by clicking Project → Edit Project
    in the drop-down menu of the integrated development environment (IDE) and selecting
    (the following are the default settings):


    ```

    PLL input divider: 2

    PLL multiplier: 20

    System PLL output clock divider: PLL divide by 1

    Oscillator selection bits: Primary Osc w/PLL

    Primary oscillator configuration: XT osc mode

    ```


    The block diagram of the project is shown in Figure 7.1.'
