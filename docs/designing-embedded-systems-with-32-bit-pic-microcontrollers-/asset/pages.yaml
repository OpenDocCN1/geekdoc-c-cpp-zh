    HD44780 controller is commonly used in LCD-based microcontroller applications.
    A brief description of this controller and information on some commercially available
    LCD modules is given below.


    # 4.2.1 HD44780 LCD Controller


    HD44780 is one of the most popular LCD controllers used in many LCD modules in
    industrial and commercial applications, and also by hobbyists. The module is monochrome
    and comes in different shapes and sizes. Modules with character lengths of 8,
    16, 20, 24, 32, and 40 characters can be selected. Depending on the model chosen,
    the display provides a 14-pin or a 16-pin connector to interface to the external
    world. Table 4.2 shows the pin configuration and pin of a typical 14-pin LCD.


    VSS is 0 V supply or should be connected to the positive supply. Although the
    manufacturers specify a 5 V DC supply, the modules will usually work with low
    as 3 V or as high as 6 V.


    Pin 3 is named as VEE and this is the control pin. This pin is used to adjust
    the contrast of the display and it should be connected to a DC supply. A potentiometer
    is usually connected to the power supply with its wiper arm connected to this
    pin and the other leg of the potentiometer connected to the ground. This way the
    voltage at the VEE pin and hence the contrast of the display can be adjusted as
    desired.


    Pin 4 is the Register Select (RS) and when this pin is LOW, data transferred to
    the LCD are treated as commands. When RS is HIGH, character data can be transferred
    to from the module.


    # Table 4.2: Pin Configuration of the HD44780 LCD Module


    | Pin No. | | Function |

    |---|---||

    | 1 | VSS | Ground |

    | 2 | VDD | positive supply |

    | 3 | VEE | Contrast |

    | 4 | RS | Register select |

    | 5 | R/W | Read/write |

    | 6 | EN | Enable |

    | 7 | D0 | Data bit 0 |

    | 8 | D1 | Data bit 1 |

    | 9 | D2 | Data bit 2 |

    | 10 | D3 | Data bit 3 |

    | 11 | D4 | Data bit 4 |

    | 12 | D5 | Data bit 5 |

    | 13 | D6 | Data bit 6 |

    | 14 | D7 | Data bit 7 |'
