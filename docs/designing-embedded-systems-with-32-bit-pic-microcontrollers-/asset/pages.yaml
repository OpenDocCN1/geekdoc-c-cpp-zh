  md: '# 422 Chapter 8


    Before going into details of the design, it is worthwhile to look at the theory
    of FIR digital filters briefly.


    # 8.8.2 FIR Filters


    There are two types of digital filters used in digital signal processing (DSP)
    applications: FIR and infinite impulse response (IIR). FIR filters have no feedback
    in their structures and thus they are always stable and are used much more than
    IIRs. Each type of filter has its advantages and disadvantages.


    Compared to IIR filters, FIR filters offer the following advantages:


    +   * FIR filters can be designed to be linear phase and thus they do not distort
    the phase of the input signal.

    * FIR filters are very simple to implement.

    * FIR filters are inherently stable.

    * FIR filters are suited to multir applications.

    * FIR filters can be implemented using fractional arithmetic where the filter
    coefficients have magnitudes <1.0.


    Compared to IIR filters, FIR filters offer the following disadvantages:


    +   * FIR filters require more memory.

    * FIR filters require more mathematical operations to achieve a given filter response.

    * Certain filter responses cannot be implemented with FIR filters.


    In an FIR filter, the output depends only on the inputs (and not the previous
    outputs). The output of such a filter is a weighted sum of the current and a finite
    number of previous values of the input. The output of an FIR filter at time is
    given in terms of its inputs by the following equation:


    ```

    y[n] = h_0x[n] + h_1x[n-1] + h_2x[n-2] + \dots + h_Nx[n-N]

    ```


    ```

    y[n] = \sum_{i=0}^{N} h_ix[n-i]

    ```


    where


    +   * x[n] is the input signal;

    * y[n] is the output signal;

    * h_i is the filter coefficient that makes up the impulse response;

    * N is the filter order.'
