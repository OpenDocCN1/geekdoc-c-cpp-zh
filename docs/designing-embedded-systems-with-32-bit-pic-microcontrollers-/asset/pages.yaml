    # 7.12 Project 7.12—Generating Sine Wave Using D/A Converter


    # 7.12.1 Project Description


    In this project, we will see how to generate a low-frequency sine wave using the
    built-in trigonometric sin, and send the output to a D/A converter. The generated
    wave has amplitude of 1 V, frequency of 100 Hz, and offset of 1.2 V.


    Figure 7.58 shows the block diagram of the project.


    # 7.12.2 Project Hardware


    The circuit diagram of the project is shown in Figure 7.59. The project is based
    on the MCP4921 D/A converter. It is a 12-bit converter with a typical conversion
    time of 4.5 μs. The chip is controlled from the SPI bus of the microcontroller.
    PIC32MX460F512L microcontroller has two built-in SPI controllers. In project SPI2
    is used, which consists of I/O pins RG6 (Clock), RG8 (data out), and RG7 (Data
    in). Pin RG7 is not used in this project as there is no input from the D/A converter.


    As shown in Figure 7.59, RG6 and RG8 of the microcontroller are connected to pins
    SCK and SDI1 of the D/A converter, respectively. The CS input of the D/A converter
    is'
