  md: '# 314 Chapter 7


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_314_0.png)


    We are now ready to design our project. In this project, we will first write a
    program and show the effects of switch bouncing. A simple binary counter will
    be designed with a push-button switch and an LCD connected to the microcontroller.
    Every time the switch is pressed we expect the counter to count up by 1. We will
    see that because of switch bouncing effects the counting is not regular and more
    than one count may be produced when the button is pressed. We will then introduce
    switch debouncing into our program and see how the switch bouncing can be eliminated
    in software.


    The block diagram of the project is shown in Figure 7.37.


    # 7.7.2 Project Hardware


    The circuit diagram of the project is shown in Figure 7.38. A $2 \times 16$ LCD
    is connected to PORT B as in Project 7.2, and a push-button switch is connected
    to bit 1 of PORT C (RC1). The microcontroller is powered from a 3.3 V supply,
    and an 8 MHz crystal is used to provide the clock pulses. A voltage translator
    chip (74VCC3245) is used as in Project 7.2 to interface the LCD to the microcontroller.


    In this project, the LV-32MX V6 development board is used. The following jumpers
    should be configured on the board to enable the on-board LCD, and also to configure
    pin PRD0 so that changes from logic 1 to logic 0 can be detected on this port:


    +   - DIP switch SW20 positions 1–6, set to ON

    - Jumper J15, set to Ground

    - DIP switch SW5 position 1, set to ON

    - Jumper J5, set to Pull-Up'
