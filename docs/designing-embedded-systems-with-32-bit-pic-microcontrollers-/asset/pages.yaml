  md: '# Advanced PIC32 Projects 405


    Three pins are used for the power supply, leaving four pins for the SPI mode of
    operation:


    +   * Chip select (pin 1)

    * Data out (pin 7)

    * Data in (pin 2)

    * CLK (pin 5).


    At power-up, the SD card defaults is asserted to the SD bus protocol. The card
    is switched to the SPI mode if the CS signal is asserted during the reception
    of the reset command. When the card is in SPI mode, it only responds to SPI commands.
    The host may reset a card by switching the power supply off and on.


    microKC PRO for PIC32 compiler provides a library of commands for initializing,
    reading, and writing to SD cards. In general, it is not necessary to know the
    internal structure of an SD card before it is used since the available library
    functions can easily be used. It is however important to have some knowledge about
    the internal structure of an SD card so that it can be used efficiently. In this
    section, we shall be looking briefly at the internal architecture and the operation
    of SD cards.


    An SD card has a set of registers that provide information about the status of
    the card. When the card is operated in SPI mode, these registers are as follows:


    +   * Card Identification Register (CID)

    * Card-Specific Data Register (CSD)

    * SD Configuration Register (SCR)

    * Operation Control Register (OCR).


    The CID register consists of 16 bytes and it contains the manufacturer ID, product
    name, product revision, serial number, manufacturer date code, and a checksum
    byte.


    CSD register consists of 16 bytes and it contains card-specific data such as the
    card transfer rate, read/write block lengths, read/write currents, erase sector
    size, file format, protection flags, checksums, and so on.


    SCR register is 8 bytes long and it contains information about the SD card''s
    special features capabilities as the security support, data buses supported, and
    so on.


    OCR register is only 4 bytes long and it stores the VDD voltage profile of the
    card. The OCR shows the voltage range, in which the card data can be accessed.


    All SD card SPI commands are 6 bytes long with the most significant bit (MSB)
    transmitted first. The first byte is known as the command byte, and the remaining
    5 bytes are command arguments. Bit 6 of the command byte is set to “1” and the
    MSB is'
