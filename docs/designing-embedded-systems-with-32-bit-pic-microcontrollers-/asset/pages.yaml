    # SPIx_Init_Advanced and MMC_FAT_Init


    The SPI library must be initialized before the MMC FAT library is initialized.
    The following parameters should be set during the initialization of the SPI library:


    +   * SPI Master

    * Eight-bit mode

    * Secondary prescaler 1

    * Primary prescaler 64

    * Slave Select desired

    * Data sampled in the middle of the data output time

    * Clock idle high

    * Serial output data changes from transition from active clock state to idle clock
    state.


    The MMC module connections (CS pin) should be defined before initializing the
    library. An example is shown below which assigns microcontroller pin RF0 to CS
    pin of the card:


    ```

    // MMC module connections

    sbit Mmc_Chip_Select at LATFO_bit;

    sbit Mmc_Chip_Select_Direction at TRISF0_bit;

    // Mmc module connections

    ```


    The following example shows how the SPI library is initialized:


    ```

    SPI1_Init_Advanced_SPI_MASTER, _SPI_8_BIT, 64, _SPI_SS_DISABLE,

    _SPI_DATA_SAMPLE_MIDDLE, _SPI_CLK_IDLE_HIGH,

    _SPI_ACTIVE_2_IDLE);

    ```


    The MMC FAT library should be initialized as shown below:


    ```

    Mmc_Fat_init;

    ```


    The function returns the following:


    ```

    0: initialization successful

    1: FATI6 boot sector not found on the card

    255: The card has not been detected

    ```'
