  md: '# Simple PIC32 Microcontroller Projects 279


    The voltage drop across an LED is around 2 V. The brightness of the LED depends
    on the current through the LED and this current can vary between 8 and 16 mA,
    with a typical value of 10 mA.


    The LED is turned ON when the output of the microcontroller is at logic 0, so
    that the current flows through the LED. We can calculate the value of the required
    resistor as:


    ```

    $R = \frac{Vdd} - V_{LED}}{I_{LED}}$

    ```


    where,


    +   $Vdd$ is the supply voltage (3.3 V);

    $V_{LED}$ is the voltage drop across the LED (2 V);

    $I_{LED}$ is the current through the LED (10 mA).


    substituting the values into the equation, we get $R = \frac{3.3-2}{10} = 130
    \Omega$. The nearest physical resistor is $120 \Omega$.


    # 7.1.3 Current-Sourcing


    As shown in Figure 7.4, in current-sourcing mode, the anode leg of the LED is
    connected to the microcontroller output port and the cathode leg is connected
    to the ground through a current-limiting resistor.


    In this mode, the LED is turned ON when the microcontroller output port is at
    logic 1, i.e. $Vdd$. In practice, the output voltage is about 3.3 V and the value
    of the resistor can be determined as follows:


    ```

    $R = \frac{Vdd} - V_{LED}}{I_{LED}}$

    ```


    Which gives the same resistor value of $120 \Omega$.


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_279_0.png)'
