    # 5.3.2 Creating and Compiling a New File


    microC Pro for PIC32 files are organized in projects and all related files of
    a project are stored in the same folder. By default a project file has the extension
    ".mcp32". A project file contains the project name, target microcontroller device,
    device configuration flags, clock, and list of source files with their paths.
    C source files have the extension ".c".


    The example below illustrates step by step how a program source file can be created
    and compiled successfully.'
