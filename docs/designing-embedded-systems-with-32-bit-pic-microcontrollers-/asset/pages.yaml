    # 3.1.9 Constants


    Constants are variables that have fixed values, and whose values cannot be changed
    in a program. Normally, variables are stored in the RAM memory of the microcontroller.
    Constants are stored in the flash program memory of the microcontroller. Variables
    with fixed values should be declared as constants to save the limited and valuable
    RAM space. A constant is declared by preceding its name with the keyword **const**
    or **const code**. microC Pro for PIC32 language supports:


