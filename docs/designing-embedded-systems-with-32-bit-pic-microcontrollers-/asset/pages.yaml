  md: "# 6.3 Representing Loops in Flowcharts\n\nMost programs include some form of\
    \ iteration or looping. One of the easiest ways to create a loop in a C program\
    \ is by using the *for* statement. This section shows how a *for* loop can be\
    \ represented in a flowchart. As shown below, there are several methods of representing\
    \ a *for* loop in a flowchart.\n\nSuppose that we have a *for* loop as below and\
