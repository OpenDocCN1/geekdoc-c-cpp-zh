    # 1.8 Converting Decimal Numbers into Binary


    To convert a decimal number into binary, divide the number repeatedly by two and
    take the remainders. The first remainder is the least significant digit (LSD),
    and the last remainder is the most significant digit (MSD).


    # Example 1.3


    Convert decimal number $28_{10}$ into binary.


    Solution 1.3


    Divide the number by two repeatedly and take the remainders:


    ```

    28/2 → 14 Remainder 0 (LSD)

    14/2 → 7 Remainder 0

    7/2 → 3 Remainder 1

    3/2 → 1 Remainder 1

    1/2 → 0 Remainder 1 (MSD)

    ```


    The required binary number is 11100₂.'
