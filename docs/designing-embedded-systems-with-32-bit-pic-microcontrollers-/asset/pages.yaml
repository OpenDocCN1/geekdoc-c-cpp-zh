    # 7.13 Project 7.13—Communicating with a PC Using the RS232 PORT


    # 7.13.1 Project Description


    In this project we will see how we can communicate with a PC over the serial link.
    Initially, a small program is given to receive a lower case character, convert
    it to upper case and then send it and display on the PC screen.


    The main project is about designing a calculator with a menu. Initially a menu
    will be displayed on the PC screen and the user will be requested to select an
    arithmetic operation and enter two numbers. The program will carry out the required
    operation and display the result on the PC screen.


    There are two ways of communicating with a PC: either using an RS232 interface
    or using a USB-RS232-type interface. Early versions of the LV-32MX V6 board are
    equipped with 2 × RS232 ports, while the later versions are equipped with 2 ×
    USB-RS232 ports. This project will explain the use of RS232-type interface with
    a nine-way D-type connector.


