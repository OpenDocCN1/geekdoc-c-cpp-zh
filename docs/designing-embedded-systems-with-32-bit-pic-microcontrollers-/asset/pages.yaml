    # 1.1 Introduction


    The term microcomputer is used to describe a system that includes a minimum of
    a microprocessor, program memory, data memory, and input–output (I/O). Some microcomputer
    systems include additional components such as timers, counters, analog-digital
    (A/D) converters, and so on. Thus, a microcomputer system can be anything from'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# Microcomputer Systems 3


    a large computer having hard disks, floppy disks, and printers to a single-chip
    embedded controller.


    In this book, we are going to consider only the type of microcontrollers that
    consist of a single silicon chip. Such microcomputer systems are also called microcontrollers
    and they are used in many household goods such as microwave ovens, TV remote control
    units (CUs), cookers, hi-fi equipment, compact disc players, personal computers,
    fridges, and so on. There is a large number of microcontrollers available in the
    market. In this book, we will be looking at the programming and system design
    using the 32-bit programmable interface controller (PIC) series of microcontrollers
    manufactured by Microchip Technology Inc.


    # 1.2 Microcontroller Systems


    A microcomputer is a single-chip computer. Micro suggests that the device is small,
    and controller suggests that the device can be used in control applications. Another
    term used for microcontrollers is embedded controller since most of the microcontrollers
    are built into (or embedded in) the devices they control.


    A microprocessor differs from a microcontroller in many ways. The main difference
    is that a microprocessor requires several other components for its operation,
    such as program memory and data memory, I/O devices, and external clock circuit.
    A microcontroller on the other hand has all the support chips incorporated inside
    the same chip. All microcontrollers operate on a set of instructions (or the user
    program) stored in their memory. A microcontroller fetches the instructions from
    its program memory by one, decodes these instructions, and then carries out the
    required operations.


    Microcontrollers have traditionally been programmed using the assembly language
    of the target device. Although the assembly language is fast, it has several disadvantages.
    An assembly program consists of mnemonics and it is difficult to learn and maintain
    a program written using assembly language. Also, microcontrollers manufactured
    by different firms have different assembly languages and the user is required
    to learn a new language every time a new microcontroller is to be used. Microcontrollers
    can also be programmed using a high-level language, such as BASIC, PASCAL, and
    C. High-level languages have the advantage that it is much easier to learn a high-level
    language than an assembler. Also, very large and complex programs can be easily
    developed using a high-level language. In this book, we shall be learning the
    programming of 32-bit PIC microcontrollers using the microC PIC for C language,
    developed by MikroElectronika.


    In general, a single chip is all that is required to have a running microcontroller
    system. In practical applications, additional components may be required to allow
    a microcomputer to interface to its environment. With the advent of the PIC family
    of microcontrollers, the development time of an electronic project has reduced
    to several hours.'
  merge: -1
  pgno: 7
