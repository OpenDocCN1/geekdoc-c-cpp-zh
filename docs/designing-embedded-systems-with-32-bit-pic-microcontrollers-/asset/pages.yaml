    # Example 5.1


    It is required to write a C program to calculate the sum of integer numbers from
    1 to 10 and then send the result to PORT B of a PIC32MX360F512L 32-bit microcontroller.
    Assume that eight LEDs are connected to PORT C of the microcontroller via current-limiting
    resistors. Draw the circuit diagram and show the steps involved in creating and
    compiling the program.


    # Solution 5.1


    Figure 5.37 shows the circuit diagram of the project. The LEDs are connected to
    PORT B of the microcontroller using 390 current-limiting resistors. The microcontroller
    is operated from an 8 MHz crystal.


    The program is created and compiled as follows:


    +   - Step 1

    - Double-click the microCK Pro for PIC32 to start the IDE.

    - Step 2


    Create a new project called EXAMPLE. Click Project → New Project. You should see
    the new project creation wizard as in Figure 5.3.


