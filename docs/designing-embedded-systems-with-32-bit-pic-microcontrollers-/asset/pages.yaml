  md: '# 4.1 ADC Library


    The ADC module library offers a number of functions that enable the programmer
    to use the ADC module easily. Four functions are provided in this library:


    +   - ADCx_Init

    - ADCx_Init_Advanced

    - ADCx_Get_Sample

    - ADCx_Read


    "x" refers to the number of the ADC module used in microcontrollers with multiple
    ADC units.


    The ADCx_Init function is used to configure an ADC module to work with default
    settings. By default, this function is called the ADC module, it is set to work
    as follows:


    +   - Single-channel conversion

    - Ten-bit resolution

    - Unsigned integer format

    - Power supply as the positive reference, and ground as the negative reference

    - 32*Tcy conversion clock


    The function requires no parameters and to initialize ADC module 1 is as follows:


    ```

    ADC1_Init();

    ```


    The ADCx_Init_Advanced function is used to configure an ADC to work with user
    defined settings. This function is called with one parameter, the reference voltage,
    which can take two possible values:


    +   - _ADC_INTERNAL_REF (internal voltage reference)

    - _ADC_EXTERNAL_REF (external voltage reference)


    In the following example, ADC module 1 is configured to operate with external
    reference voltage:


    ```

    ADC1_Init_Advanced(_ADC_EXTERNAL_REF);

    ```


    The ADCx_Get_Sample function reads data from the specified channel. The 10-bit
    unsigned value is returned by the function. The ADC module must be initialized
    before this function. In addition, the appropriate TRIS port must be configured
    as input. In the following example, data are read from channel 5 of ADC module
    1 and the converted data are stored in variable Temp:


    ```

    unsigned Temp;

    ................

    ADC1_Init();

    Temp = ADC1_Get_Sample(5);

    ```'
