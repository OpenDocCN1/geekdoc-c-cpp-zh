    # Step 3


    Now select the variables we want to see during the simulation. Assuming that we
    view the values of variables Sum, i, and PORT B:


    +   * Click on Select from variable list and find and click on variable name Sum

    * Click Add to this variable to the Watch list

    * Repeat these steps for variable i and PORT B


    The debugger window would now look like Figure 5.52.


    # Step 4


    We can now single step the program and see the variables changing.

    Press the F8 key on your keyboard. You should see a blue line to move down. This
    shows the line where the program is currently executing. Keep pressing F8 until
    you are inside the loop and will that variables Sum and i have become 1, as shown
    in Figure 5.53.

    Recently changed items are shown in red color. Double-clicking item in the watch
    window opens the Edit window, where you can change the value of a variable or
    a register, or display the value in other bases such as decimal, hexadecimal,
    binary, or as floating point character.


    # Step 5


    Keep pressing F8 until the program comes out of the loop and execute the line
    that carries data to PORT B. At this point, as shown in Figure 5.54, i = 11 and
    Sum = 55.


    # Step 6


    Press F8 again to save the value of variable Sum to PORT B. As shown in Figure
    5.55, PORT B will have the decimal value 55, which is the sum of numbers from
    1 to 10.

    This is the end of the simulation. Select from drop-down menu, Run → Stop Debugger.

    In the above simulation example, we single-stepped through the program until we
    reach the end and then we could see the final value of PORT B. The next example
    shows how to set breakpoints in the program and execute up to a breakpoint.'
