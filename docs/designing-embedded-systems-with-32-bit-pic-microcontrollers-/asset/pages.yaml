  md: '# Chapter 3


    | Operator | Operation |

    | --- | --- |

    | & | Bitwise AND |

    | | | Bitwise OR |

    | ~ | Bitwise exclusive-OR Bitwise complement Shift left Shift right |


    Bitwise AND returns 1 if the corresponding two bits of the variables are 1, otherwise
    it returns 0. An example is given where the first variable is 0xFE and the second
    variable is 0x4F. The result of the bitwise AND operation is 0x4E:


    ```

    0xFE: 1111 1110

    0x4F: 0100 1111

    ============

    0100 1110 = 0x4E

    ```


    Bitwise OR returns 0 if the corresponding two bits of the variables are 0, otherwise
    it returns 1. An example is given where the first variable is 0x1F and the second
    variable is 0x02. The result of the bitwise OR operation is 0x1F:


    ```

    0x1F: 0001 1111

    0x02: 0000 0010

    ------------

    0001 1111 = 0x1F

    ```


    Bitwise exclusive-OR returns 0 if the corresponding two bits of the variables
    are the same, otherwise it returns 1. An example is given below where the first
    variable is 0x7F and the second variable is 0x1E. The result of the Exclusive-OR
    operation is 0x61:


    ```

    0x7F: 0111 1111

    0x1E: 0001 1110

    ------------

    0110 0001 = 0x61

    ```


    The complement operator requires only one operand and it complements all bits
    of its operand. An example is given below where variable 0x2E is complemented
    to give 0xD1:


    ```

    0x2E: 0010 1110

    1101 0001 = 0xD1

    ```


    The left-shift operator requires two operands: the variable to be shifted, and
    the count specifying the number of times the variable to be shifted. When a variable
    is shifted left, 0 is filled in the least significant bit position. Shifting a
    variable by one digit is same as multiplying the variable by two. An example is
    given below where the variable 0x1E is shifted left by two digits to give the
    number 0x78:


    ```

    0x1E: 0001 1110    // shift left by one digit

    0011 1100         // shift left by two digits

    0111 1000 = 0x78

    ```'
