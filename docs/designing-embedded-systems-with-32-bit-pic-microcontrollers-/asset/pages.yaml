    # 3.1.16 Pointers


    Pointers in C language are very important concepts and they are used almost in
    all large and complex programs. Most students have difficulty in understanding
    the concept of pointers. In this section, we will be looking at the basic principles
    of pointers and how they can be used in C programs.


    A pointer in C language is a variable that holds the memory address of another
    variable. Another simple definition of a pointer is the following: a pointer points
    to the memory address of a variable. Thus, by knowing where a variable is actually
    located in memory, we can carry out various types of operations on this variable.


    Pointers in C language are declared the same as other variables, but the character
    "*" is inserted before the name of the variable. In general, pointers can be declared
    to hold the addresses of all types of variables, such as character, integer, long,
    floating point, and even they can hold the addresses of functions.


    The following example shows how a pointer named Pnt can be declared:


    ```

    char *Pnt;

    ```


    When a pointer is declared, it is not defined and in general we can say that it
    does not point to any variable. We can assign the address of a variable to a pointer
    using the "&" character. In the following example, example pointer Pnt holds the
    address of (or points to the address of) variable variable Temp:


    ```

    Pnt = &Temp; // Pnt holds the address of Temp

    ```


    Assuming variable Temp is at memory location 1000, pointer Pnt contains the number
    1000, which is the address where the variable Temp is located. We can now assign
    value to our variable Temp using its pointer (see Figure 3.3):


    ```

    *Pnt = 25; // Assign 25 to variable Temp

    ```'
