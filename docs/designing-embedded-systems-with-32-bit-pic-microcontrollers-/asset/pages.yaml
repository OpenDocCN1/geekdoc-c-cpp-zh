    # TFT_Set_Brush


    This function is used to set color and the gradient which will be used to fill
    in circles or rectangles. The parameters are as follows:


    +   - Brush fill mode (0 = disable and 1 = enable)

    - Brush fill color (any of the colors specified in TFT_Set_Font)

    - Gradient (0 = disable, 1 = enable)

    - Gradient orientation (LEFT_TO_RIGHT or TOP_TO_BOTTOM)

    - Starting gradient color (any of the colors specified in TFT_Set_Font)

    - Ending gradient color (any of the colors specified in TFT_Set_Font).


    In the following example, the gradient is enabled from black to white color, left–right
    orientation:


    ```

    TFT_Set_Brush(0, 0, 1, LEFT_TO_RIGHT, CL_BLACK, CL_WHITE);

    ```


