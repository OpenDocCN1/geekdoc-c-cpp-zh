    # Performance and Power Consumption Considerations


    In microcontroller-based applications, the power consumption and performance are
    in direct conflict with each other. To lower the power consumption in an application,
    we also have to lower the performance, i.e. the clock rate. Conversely, an increase
    in the performance increases the power consumption. Thus, the higher the clock
    speed, the higher is the consumption of the device. The designers of the PIC32
    microcontroller have spent considerable amount of time to provide a wide range
    of clock selection mechanisms, so that the user can choose the best clock rate
    for the required power consumption.


    For example, if an application can run at 8 MHz to do a job, there is no point
    in running the application at 80 MHz. In some applications, the device may be
    in standby mode and may be waiting some user action (e.g. pressing a button).
    In such applications, a low clock rate can be selected while the device is in
    standby mode, and then full high-speed clock rate can be selected when the device
    wakes up to the actual application.


    # The Flash Wait States


    The number of wait states is normal by default to the highest value as this provides
    the safest operation. The SFR register CHECON, bits PFMWS, controls the number
    of wait states and we can reduce its value for higher performance. It is important
    that setting wrong number of wait states could cause errors while accessing the
    flash memory. This register can take values between 0 and 7. For optimum performance,
    the wait states would be programmed to the minimum possible value. The following
    example shows how the maximum number of wait states be set to 4:


    ```

    CHECONbits.PFMWS = 4;

    ```


    By default, the mikroK Pro for PIC32 compiler configures the following:


    +   - Cache is enabled.

    - Prefetch is enabled (for executable code and constants).

    - Flash Wait states is set for specified oscillator frequency.

    - Executable code is allocated in Kseg0.

    - Data is allocated in Kseg1.'
