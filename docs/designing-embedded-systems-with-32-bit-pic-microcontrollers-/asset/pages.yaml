    (1999). A delay of 100 ms is used between each output.


    # 8.4 Project 8.4—Using a Thin Film Transistor Display


    # 8.4.1 Project Description


    This project shows how to use a thin film transistor (TFT) display in 32-bit microcontroller
    applications. In this project, various shapes, characters, and text are displayed
    on the TFT.


    The display used in this project is the MI0283QT, which is 320 × 240 pixel color
    TFT display with touch-panel controller (the touch-panel is not used in this project).
    The display is controlled by the HX834DT controller. The LV-32MX V6 development
    board includes this display on-board, and readers who are bold will find it very
    easy to complete the project.


    Figure 8.18 shows the TFT display X and Y coordinates. The origin (0,0) is the
    top-left hand of the display. X coordinate runs from left to right from 0 to 239,
    and the Y coordinate runs from top to bottom from 0 to 319.


    The display is controlled using the TFT library of the microC PRO for PIC32 language.
    This is a large library which contains functions to write characters and any required
    coordinate of the display, to draw shapes as circles and rectangles with required
    sizes, to display bitmap images and so. Some of the important TFT functions will
    be described in this project. Interested readers can get further information from
    either the microC PRO IDE. The program given in this chapter is large and requires
    the full version of the compiler.


