  md: '# Chapter 1


    low-speed microcontroller-based applications. Microcontrollers of 16 and 32 bits
    are much more powerful, usually more expensive and their use may not be justified
    in many small- to medium-size general-purpose applications.


    The simplest microcontroller architecture consists of a microprocessor, memory,
    and I/O. The microprocessor consists of a central processing unit (CPU) and the
    CU. The CPU is the brain of the microcontroller and this is where all the arithmetic
    and logic operations are performed. The CU controls the internal operations of
    the microprocessor and sends out control signals to other parts of the microcontroller
    to carry out the instructions.


    Memory is an important part of a microcontroller system. Depending on the type
    used, we can classify memories into two groups: program memory and data memory.
    Program memory stores the programs written by the programmer and this memory is
    usually nonvolatile, i.e. data are not lost after the removal of power. Data memory
    is where the data used in a program are stored and this memory is usually volatile,
    i.e. data are lost after the removal of power.


    There are basically six types of memories, summarized as follows:


    # 1.2.1 Random Access Memory


    Random access memory (RAM) is a general-purpose memory which usually stores the
    user data in a presence. RAM memory is volatile in the sense that it cannot retain
    data in the absence of power, i.e. data are lost after the removal of power. Most
    microcontrollers have some amount of internal RAM. Several is a common amount,
    although some microcontrollers have much more, and some less. For example, the
    PIC32MX460F512L 32-bit microcontroller has 512 KB of RAM. In general, it is possible
    to extend the memory by adding external memory chips.


    # 1.2.2 Read Only Memory


    Read only memory (ROM) usually holds program or fixed data. ROM is nonvolatile.
    If power is removed from ROM and then reapplied, the original data will still
    be there. ROM memories are programmed at factory during the manufacturing process
    and their contents cannot be changed by the user. ROM memories are only useful
    if we have developed a program and wish to order several thousand copies of it,
    or if we wish to store some configuration data.


    # 1.2.3 Programmable Read Only Memory


    Programmable read only memory (PROM) is a type of ROM that can be programmed in
    the field, often by the end user, using a device called a PROM programmer. Once
    a PROM has been'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Microcomputer Systems 7


    programmed, its contents cannot be changed. PROMs are usually used in low-production
    applications where only several such memories are required.


    # 1.2.4 Erasable Programmable Read Only Memory


    Erasable programmable read only memory (EPROM) is similar to ROM, but the EPROM
    can be programmed using a suitable programming device. EPROM memories have a small,
    clear glass window on top of the chip where the data can be erased under ultraviolet
    light. Once the memory is programmed, the window can be covered with dark tape
    to prevent accidental erasure of the data. An EPROM memory must be erased before
    it can be reprogrammed. Many development versions of microcontrollers are manufactured
    with EPROM memories where the user program can be stored. These memories are erased
    and reprogrammed until the user is satisfied with the program. Some versions of
    EPROMs, known as one-time programmable (OTP), can be programmed using a suitable
    programmer device but these memories cannot be erased. OTP memories cost much
    less than the EPROMs. OTP is useful after a project has been developed completely
    and it is required to make many copies of the program memory.


    # 1.2.5 Electrically Erasable Programmable Read Only Memory


    Electrically erasable programmable read only memory (EEPROM) is a nonvolatile
    memory. These memories can be erased and also reprogrammed using suitable programming
    devices. EEPROMs are used to save configuration information, maximum and minimum
    values, identification data, etc.


    # 1.2.6 Flash EEPROM


    This is another version of EEPROM-type memory. This memory has become popular
    in microcontroller applications and is generally used to store the user program.
    Flash EEPROM is nonvolatile and is usually very fast. The data can be erased and
    then reprogrammed using a suitable programming device. These memories can also
    be programmed without removing them from their circuits. Some microcontrollers
    have only 1 K flash EEPROM while others have 32 K or more.


    # 1.3 Microcontroller Features


    Microcontrollers from different manufacturers have different architectures and
    capabilities. Some may suit a particular application while others may be totally
    unsuitable for the same application. The hardware features of microcontrollers,
    in general, are described in this section.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 8 Chapter 1


    # 1.3.1 Supply Voltage


    Most microcontrollers operate with the standard logic voltage of +5 V. Some microcontrollers
    can operate at as low as +2.7 V and will tolerate +6 V without any problems. You
    should check the manufacturers'' data sheets about the allowed limits of the power
    supply voltage. For example, PIC32MX460F512L 32-bit microcontrollers can operate
    with a power supply of +2.3 to +3.6 V.


    A voltage regulator is usually used to obtain the required power supply voltage
    when the device is to be operated from a mains adaptor or batteries. For example,
    a 5 V regulator may be required if the microcontroller and peripheral devices
    operate from a +5 or +3.3 V supply and a 9 V battery is to be used as the power
    supply.


    # 1.3.2 The Clock


    All microcontrollers require a clock (or an oscillator) to operate. The clock
    is usually provided by connecting external timing devices to the microcontroller.
    Most microcontrollers will generate clock signals when a crystal and two small
    capacitors are connected. Some will operate with resonators or external resistor–capacitor
    pair. Some microcontrollers have built-in timing circuits and they do not time
    sensitive, you should use an external or internal (if available) resistor–capacitor
    timing components for simplicity and low cost.


    An instruction is executed by fetching it from the memory and then decoding it.
    This usually takes several clock cycles and is known as the instruction cycle.
    PIC32 series of microcontrollers can operate with clock frequencies up to 80 MHz.


    # 1.3.3 Timers


    Timers are important parts of any microcontroller. A timer is basically a counter
    which is driven either from an external clock pulse or the internal oscillator
    of the microcontroller. A PIC32 microcontroller can have 16- or 32-bit timers
    (two 16-bit timers are combined to create a 32-bit timer). Data can be loaded
    into a timer under program control and the timer can be stopped or started by
    program control. Most timers can be configured to generate an interrupt when they
    reach a count (usually when overflow). The interrupt can be used by the user program
    to carry out accurate timing-related operations inside the microcontroller.


    Some microcontrollers offer capture and compare facilities where a timer value
    can be read when an external event occurs, or the timer value can be compared
    to a preset value and an interrupt can be generated when this value is reached.
    PIC32 microcontrollers can have up to five capture inputs.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# 1.3.4 Watchdog


    Most microcontrollers have at least one watchdog facility. The watchdog is basically
    a timer which is refreshed by the user program and a reset occurs if the program
    fails to refresh the watchdog. The watchdog timer is used to detect a system problem,
    such as the program being in an endless loop. A watchdog is a safety feature that
    prevents runaway software and stops the microcontroller from executing meaningless
    and unwanted code. Watchdog facilities are commonly used in real-time systems
    for safety, where it may be required to regularly check the successful termination
    of one or more activities.


    # 1.3.5 Reset Input


    A reset input is used to reset a microcontroller externally. Resetting puts the
    microcontroller into a known state such that the program execution starts from
    a known address. An external reset action is usually achieved by connecting a
    push-button switch to the reset input such that the microcontroller can be reset
    when the switch is pressed.


    # 1.3.6 Interrupts


    Interrupts are very important concepts in microcontrollers. An interrupt causes
    the microcontroller to respond to external and internal (e.g. a timer) events
    very quickly. When an interrupt occurs, the microcontroller leaves its normal
    flow of program execution and jumps to a special part of the program, known as
    the interrupt service routine (ISR). The program code inside the ISR is executed
    and upon return from the ISR, the program resumes its normal flow of execution.


    The ISR starts from a fixed address of the program memory. This address is also
    known as the interrupt vector address. Some microcontrollers with multi-interrupt
    features have just one interrupt vector address, while others have unique interrupt
    vector addresses, for each interrupt source. Interrupts can be nested such that
    a new interrupt can suspend the execution of another interrupt. Another important
    feature of a microcontroller with multi-interrupt capability is that different
    interrupt sources can be given different levels of priority.


    # 1.3.7 Brown-out Detector


    Brown-out detectors are also common in many microcontrollers and they reset a
    microcontroller if the supply voltage falls below a nominal value. Brown-out detectors
    are safety features and can be employed to prevent unpredictable operation at
    low voltages, especially to protect the contents of EEPROM-type memories.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# 10 Chapter 1


    # 1.3.8 A/D Converter


    A/D converter is used to convert an analog signal such as voltage to a digital
    form, so that it can be read and processed by a microcontroller. Some microcontrollers
    have built-in A/D converters. It is also possible to connect an external A/D converter
    to any type of microcontroller. PIC32 microcontroller A/D converters are usually
    10-bits, having 1024 quantization levels. Most PIC microcontrollers with A/D converters
    have multiplexed A/D converters where more than one analog-input channel is provided.
    For example, PIC32MX460F512L microcontroller has 16 channels of A/D converters,
    each 10 bits wide.


    The A/D conversion process must be started by the user program and it may take
    several tens of microseconds for a conversion to complete. A/D converters generally
    generate interrupts when a conversion is complete, so that the user program can
    read the data quickly and efficiently.


    A/D converters are very useful in controlling and monitoring applications since
    most sensors (e.g. temperature sensor, pressure sensor, force sensor, etc.) produce
    analog-output voltages.


    # 1.3.9 Serial I/O


    Serial communication (also called RS232 communication) enables a microcontroller
    to be connected to another microcontroller or to a PC using a serial cable. Some
    microcontrollers have built-in hardware universal asynchronous receiver transmitter
    (UART) to implement a serial communication interface. The baud rate (bits per
    second) and the data format usually be selected by the user program. If any serial
    I/O hardware is not provided, it is easy to develop software to implement serial
    data communication using any I/O pin of a microcontroller. PIC32MX460F512L microcontroller
    provides two UART modules, each with RS232, RS485, LIN, or Irda compatible interfaces.


    In addition, two serial peripheral interface and two Integrated Connect hardware
    interfaces are available on the PIC32MX460F512L microcontroller. As we shall see
    in later chapters, microC Pro for PIC32 language provides special instructions
    for reading and writing to other compatible devices.


    # 1.3.10 EEPROM Data Memory


    EEPROM-type memory is very common in many microcontrollers. The advantage of an
    EEPROM memory is that the programmer can store nonvolatile data in such memory,
    and can also change these data whenever required. For example, in a temperature
    monitoring application, the maximum and the minimum temperature readings are stored
    in an EEPROM application. Then, if the power supply is removed for whatever reason,
    the values of the latest readings will still be available in the EEPROM memory.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'MicrokC Pro for PIC32 language provides special instructions for reading and
    writing to the EEPROM memory of a PIC32 microcontroller.


    # 1.3.11 LCD Drivers


    LCD drivers enable a microcontroller to be connected to an external LCD display
    directly. These drivers are not common since most of the functions provided by
    them can easily be implemented in software.


    # 1.3.12 Analog Comparator


    Analog comparators are used where it is required to compare two analog voltages.
    These modules are not available in low-end PIC microcontrollers. PIC32MX460F512L
    microcontrollers have two built-in analog comparators.


    # 1.3.13 Real-Time Clock


    Real-time clocks enables a microcontroller to have absolute date and time information
    continuously. Built-in real-time clocks are not common in most microcontrollers
    since they can easily be implemented by either using an external dedicated real-time
    clock chip or by writing a program. For example, PIC32MX460F512L microcontroller
    has built-in real-time clock and calendar module.


    # 1.3.14 Sleep Mode


    Some microcontrollers offer built-in sleep modes where executing this instruction
    puts the microcontroller into a mode where the internal oscillator is stopped
    and the power consumption is reduced to an extremely low level. The main reason
    of using the sleep mode is to conserve the battery power when the microcontroller
    is not doing anything useful. The microcontroller usually wakes up from the sleep
    mode by external reset or by a watchdog time-out.


    # 1.3.15 Power-on Reset


    Some microcontrollers have built-in power-on reset circuits which keep the microcontroller
    in reset state until the internal circuitry has been initialized. This feature
    is very useful as it starts the microcontroller from a known state on power-up.
    An external reset can also be provided where the microcontroller can be reset
    when an external button is pressed.


    # 1.3.16 Low-Power Operation


