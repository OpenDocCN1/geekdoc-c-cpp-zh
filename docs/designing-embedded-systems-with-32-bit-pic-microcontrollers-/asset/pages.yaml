    A description of the important library functions is described in this section.


    # 4.7.1 Button Library


    There is only function in this library called Button. This function eliminates
    the influence of contact flickering (debouncing) when a button is pressed. The
    port pin where the button is connected to is tested after the function call and
    then again the debouncing period has expired. If the pin was in the active state
    in both cases, the function returns 255 (i.e. true).


    The button requires four arguments:


    ```

    Port name where the button is connected to

    Pin number of the port where the button is connected to

    Debouncing period in milliseconds

    Active state (0 or 1)

    ```


    In the following example, it is assumed that a button is connected to port pin
    0 of PORT D. The debouncing period is set to 2 ms, and the active state is assumed
    to be logic 1:


    ```

    Button(&PORTD, 0, 2, 1);

    ```


    # Example 4.8


    A button is connected to port pin RD0 (PORT D, bit 0) of a microcontroller. In
    addition, an LED is connected to port pin RB7 (PORT B, bit 7). Write a program
    which will toggle the LED when the button is pressed and released. Assume a 2
    ms debouncing period. Figure 4.14 shows the circuit diagram for this example.


    # Solution 4.8


    The required program listing is shown in Figure 4.15 (BUTTON.C). Port pin RD0
    is normally logic 0 and goes to logic 1 when the button is pressed. The program
    detects when the button is pressed and also when the button is released. The LED
    is toggled as soon as the button is released.


