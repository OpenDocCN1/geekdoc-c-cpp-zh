  md: '# 2.1.4 The Input/Output Ports


    The general-purpose I/O ports are very important in many applications as they
    allow the microcontroller to monitor and control devices attached to it. Although
    the I/O ports of the PIC32 microcontrollers have some similarities with the 8-
    and 16-bit devices, PIC32 microcontrollers offer greater functionality and new
    features.


    Some of the key features of PIC32 I/O ports are the following:


    +   - Open-drain capability of each pin

    - Pull-up resistors at each input pin

    - Fast I/O bit manipulation

    - Operation during CPU SLEEP and IDLE modes

    - Input monitoring and interrupt generation on mismatch controls


    Figure 2.11 shows the basic block diagram of an I/O port.


    An I/O port is controlled with the following SFR registers:


    +   - TRISX: Data direction control register for port x

    - PORTX: Port register for port x

    - LATX: Latch register for port x

    - ODCX: Open-drain control register for port x

    - CNCOX: Interrupt-on-change control register.


    # TRISx


    There is a TRISx register for every port x. A TRISx bit set to 1 configures the
    corresponding port pin ''x'' as an input. Similarly, a TRISx bit cleared to 0
    configures the corresponding port pin ''x'' as an output. In the example shown
    in Figure 2.12, odd bits (1, 3, 5, 7, 9, 11, 13, and 15) of PORT B are configured
    as inputs, and the remaining pins as outputs.


    # PORTx


    PORTX is the actual port register. A write to PORTX sends data to the latch register
    LATx and this data appear at the output of the port. A read from a PORTX register
    reads the actual data at the output pin of the port (the state of the output pin
    may be affected by a device connected to the pin).


    # LATx


    LAT are the port latch registers. A write to a latch register is the same as sending
    data to the port register PORTx. A read from the latch register, however, reads
