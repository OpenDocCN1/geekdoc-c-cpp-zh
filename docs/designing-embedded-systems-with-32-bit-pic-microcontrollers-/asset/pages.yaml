    # 6.1.3 IF–THEN–ELSE–ENDIF


    IF, THEN, ELSE should be used to conditionally change the flow of control in a
    program. Every IF line should be terminated with a THEN statement, and every IF
    block should be terminated with an ENDIF statement. Use of the ELSE statement
    is optional and depends on the application. Figure 6.3 shows an example of using
    IF–THEN–ENDIF, while Figure 6.4 shows the use of IF–THEN–ELSE–ENDIF statements
    in a program and their equivalent flowcharts. Again, the simplicity of using PDL
    is apparent from this example.


