    # 4.7.3 Time Library


    The time library contains function for time calculations in the UNIX format, which
    counts the number of seconds since the "epoch". These functions are useful for
    programs that wish to use time intervals. An "epoch" is defined as the beginning
    of January 1, 1970 GMT. Time library makes use of a structure defined in file
    "Time.h" which should be included at the beginning of a program.


    The time library provides the following functions:


    +   - Time_dateToEpoch

    - Time_epochToDate

    - Time_dateDiff.


    Function Time_dateToEpoch returns the number of seconds since January 1, 1970
    (UNIX epoch time) midnight. The function requires the structure to be declared
    in its argument. In the following example, the epoch time is returned in long
    variable called Ts:


    ```

    #include "Time.h"

    TimeStruct Tm;

    ```'
