  md: '# 66 Chapter 2


    Where T is the clock period and PR1 is the value loaded into register PR1. Rearranging
    the above equation, we can find the value to be loaded into PR1 as:


    PRI = Delay/(T × Prescaler)


    An example is given here to illustrate the process. Assuming the clock frequency
    is 20 MHz, and it is required to generate a timer interrupt every 256 ms. Assuming
    a prescaler value of 256, the value to be loaded into PR1 is as follows:


    T = 1/20 MHz = 0.05 × 10⁻³ ms


    PR1 = 256 ms/(0.05 × 10⁻³ × 256) = 20,000


    Thus, the required settings are as follows:


    +   - TMR1 = 0

    - Prescaler = 256

    - PR1 = 20,000 (0x4E20)


