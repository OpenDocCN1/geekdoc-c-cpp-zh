- img_proc: true
  md: '# 404 Chapter 8


    Data transmission normally occurs in and out of the master and slave devices as
    the clock pulses are applied by the master. To begin a communication, the master
    first pulls the slave select line low for the desired slave. Then the master issues
    clocks, and during each SPI clock cycle, a full duplex transmission occurs. When
    there are no more data to be transmitted, the master stops toggling its clock
    output.


    SPI bus is currently used by microcontroller interface circuits to talk to a variety
    of devices as follows:


    +   * Memory devices (SD cards)

    * Sensors

    * Real-time clocks

    * Communications devices

    * Displays.


    The advantages of the SPI bus are as follows:


    +   * Simple communication protocol

    * Full duplex communication

    * Very simple hardware interface.


    In addition, the disadvantages of the SPI bus are as follows:


    +   * Requires four pins

    * No hardware flow control

    * No slave acknowledgment.


    It is important to realize that there are no SPI standards governed by any international
    committee. As a result of this, there are several versions of the SPI bus implementation.
    In some applications, the MOSI and MISO lines are combined into a single data
    line, reducing the line requirements into three. Some implementations have two
    clocks, one to capture (or display) data, and another to clock it into the device.
    Also, in some implementations, the CS line may be active higher than active low.


    # 8.6.2 Operation of the SD Card in SPI Mode


    When the SD card is operated in SPI mode only seven pins are used:


    +   * Two power supply ground (pins 3 and 6)

    * Power supply (pin 4)

    * Chip select (pin 1)

    * Data out (pin 7)

    * Data in (pin 2)

    * CLK (pin 5).'
