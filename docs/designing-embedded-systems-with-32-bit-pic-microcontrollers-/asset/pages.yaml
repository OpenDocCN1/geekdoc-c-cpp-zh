  md: "# 436 Chapter 8\n\npointer moves up as new samples are received. At the same\
    \ time, the array pointer moves down to carry out the multiplication with the\
    \ filter coefficients.\n\nThe required operations inside the ISR are described\
    \ by the following PDL. Notice here that bracket means the contents of the array\
    \ pointed to by the corresponding pointer. The input pointer (i\\_pointer) and\
    \ the x-array pointer (x\\_pointer) are initialized outside the ISR:\n\n```\n\
    y = 0\nInput to x[i\\_pointer]\nDO for all taps\n  y = y + h[i] * (x\\_pointer)\n\
    \  Increment x\\_pointer and wrap around if > N\nENDDO\nOutput to D/A converter\n\
    Decrement i\\_pointer and wrap around if < 0\nClear Timer 1 interrupt flag\n```\n\
    \n# 8.8.7 Program Listing\n\nThe program listing is shown in Figure 8.57. Most\
