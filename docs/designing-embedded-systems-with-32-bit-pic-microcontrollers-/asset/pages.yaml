  md: '# 280 Chapter 7


    # ## 7.1.4 Project Hardware


    The circuit diagram of the project is shown in Figure 7.5. Seven LEDs representing
    the faces of a dice are connected to PORT B of a PIC32MX460F512L microcontroller
    in current-sourcing using 120 Ω current-limiting resistors. A push-button switch
    is connected to bit 1 of PORT C (RC1) with a pull-up resistor. The microcontroller
    is operated from 8 MHz crystal connected between its crystal oscillator pins.
    The microcontroller is powered from a +3.3 V power supply.


    In this project the LV-32MX V6 development board is used. The following jumpers
    should be configured on the board to enable PORT B LEDs, and also to configure
    the push-button switch RC1 so that its output goes from logic 1 to 0 when the
    switch is pressed:


    +   - DIP switch SW12 position PORTB, set to ON

    - Jumper J15, set to Ground

    - DIP switch SW5 position 1, set to ON

    - Jumper J5, set to Pull-Up


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_280_0.png)


    > Figure 7.5

    Circuit diagram of the project.'
