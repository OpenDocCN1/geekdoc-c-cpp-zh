    \ from numeric format into string using built-in function ByteToStr and sends\
    \ it to the LCD. Then the percentage character “%” is displayed just next to the\
    \ number. The LCD has 16 columns. Zero percent corresponds to no and display 100%\
    \ corresponds to filling all 16 columns. Therefore, given a percentage n%, we\
    \ can calculate how many columns to fill from the following equation:\n\n```\n\
    LCD columns to fill = n * 16/100\n```\n\nIn this project only integer arithmetic\
    \ is considered for simplicity. Thus, for example, 50% corresponds to 50 * 16/100\
