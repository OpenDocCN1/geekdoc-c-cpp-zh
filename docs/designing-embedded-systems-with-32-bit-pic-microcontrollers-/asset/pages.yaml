  md: '# PIC32 Microcontroller Development Tools 195


    Developing software and hardware for microcontroller-based systems involves the
    use of editors, assemblers, compilers, debuggers, simulators, and device programmers.
    A typical development cycle starts with writing the application program using
    a text editor. The program is then translated into the executable code by using
    an assembler or a compiler. If the program consists of several modules, are combined
    together into a single application program using a linker. At this stage, any
    syntax errors are detected by the assembler or the compiler and have to be corrected
    before an executable code can be generated. In the next stage of the development
    cycle, a simulator can be used to test the correctness of an algorithm or a program
    with limited or no input-outputs. Most of the errors can be removed during the
    simulation. When the programmer is happy and the program seems to be working,
    the next stage of the development cycle is to load the executable code to the
    target microcontroller chip using a device programmer and then test the overall
    system logic. During this cycle, software and hardware tools as in-circuit debuggers
    or in-circuit emulators can be used to analyze the operation of the program, and
    to display the variables and registers in real time by setting breakpoints in
    the program.


    Development tools for microcontrollers can be classified into two categories:
    software and hardware. There are many such tools and the discussion of all these
    tools is beyond the scope of this book. In this chapter, only the commonly used
    tools are reviewed briefly.


    # 5.1 Software Development Tools


    Software development tools are basically computer programs and they usually run
    on personal computers, helping the programmer (or system developer) to create
    and/or modify, or test applications programs. Some of the commonly used software
    development tools are as follows:


    +   * Text editors

    * Assemblers/compilers

    * Simulators.


    # 5.1.1 Text Editors


    A text editor is a program that allows us to create or edit programs and text
    files. Windows operating system is distributed with a text editor called Notepad.
    Using the Notepad, we can create a new program file, modify an existing file,
    or display or print the contents of a file. It is important to realize that programs
    used for word processing, such as the Word, cannot be used as a text editor. This
    is because word processing programs are not true text editors as they embed formatting
    characters such as bold, italic, underline, and so on inside the text.'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'Most assemblers and compilers have built-in text editors. Using these editors,
    we can create our program and then assemble or compile it without having to exit
    from the editor environment. These editors also provide additional features, such
    as automatic keyword highlighting, syntax checking, parenthesis matching, comment
    line identification, and so on. Different parts of a program can be shown in different
    colors to make the program more readable. For example, comments can be shown in
    one color, keywords in another color, conditional statements in a different color,
    and so on. These features can speed up the program development process since most
    syntax errors can be eliminated during the programming stage.


    # 5.1.2 Assemblers and Compilers


    Assemblers generate executable code from assembly language programs. The generated
    code is usually loaded into the flash program memory of the target microcontroller.


    Similarly, compilers generate executable code from high-level language programs.
    Some of the commonly used compilers for the PIC32 microcontrollers are BASIC,
    C, and PASCAL.


    Assembly language is used in applications where the processing speed is very critical
    and the microcontroller is required to respond to external and internal events
    in the shortest possible time. The main disadvantage of assembly language is that
    it is difficult to develop complex programs using this language. Also, assembly
    language cannot be maintained easily. High-level languages on the other hand are
    easier to learn and complex programs can be developed and tested in a much shorter
    time. The maintenance of high-level programs is also much easier than the maintenance
    of assembly language programs.


    In this book only programming the C language will be described. There are a few
    versions of C language compilers available for developing PIC32 microcontroller-based
    programs (Most microcontroller compilers are for 8-, 16-, and 24-bit processors.).
    Some of the popular ones are:


    +   - Hi-Tech PIC32 C compiler (http://htsoff.com)

    - MPLAB C32 Compiler (http://www.microchip.com)

    - microC Pro for PIC32 C compiler (http://www.mikroe.com).


    Although most C compilers are essentially the same, each one has its own additions
    or modifications to the standard language. The C compiler used in this book is
    the microC for PIC32, developed by mikroElektronika.


    # 5.1.3 Simulators


    A simulator is a computer program that runs on a PC without any microcontroller
    hardware and it simulates the behavior of the target microcontroller by interpreting'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# PIC32 Microcontroller Development Tools 197


    user program instructions using the target microcontroller instruction set. Simulations
    display the contents of registers, memory, the status of input–output ports of
    the target microcontroller as the user program is interpreted. The user can set
    breakpoints at desired locations and examine the contents of various registers
    at the breakpoint. In addition, the user program can be executed in a single-step
    mode and the registers can be examined as the program executes a single instruction
    each time a key is pressed. One problem associated with standard simulators is
    that they are only software tools and any hardware interface is not simulated.


    Most microcontroller language development tools also incorporate some form of
    simulators.


    # 5.1.4 High-Level Language Simulators


    These are also known as source-level debuggers, and like simulators, they are
    programs which run on a PC. A source-level debugger allows us to find the errors
    in our high-level programs. We can set breakpoints in high-level statements, execute
    the program up to the breakpoint and then display the values of program variables,
    the contents of registers, and memory locations at the breakpoint. For example,
    we can stop a program execution and examine (or modify) the contents of an array.


    A source-level debugger can invoke hardware-based debugging activity using a hardware
    debugger device. For example, the user program on the target microcontroller can
    be stopped and the values of various variables and registers can be examined.


    Some of the high-level compilers also include built-in source-level debuggers.
    The following are some of the popular C compilers which also include source-level
    debuggers:


    +   - MPLAB C32 C compiler

    - Hi-Tech PIC32 C Compiler

    - MikroC Pro for PIC32 C compiler


    # 5.1.5 Simulators with Hardware Simulation


    Some simulators (e.g. Lab Electronics VSM, http://www.labcenter.com) incorporate
    hardware simulation options where various software-simulated hardware devices
    can be connected to microcontroller I/O pins. For example, an electromagnetic
    motor software module can be connected to an I/O port and its operation can be
    simulated in software. Although the hardware simulation does not simulate the
    actual device exactly, it is very useful during early project development cycle.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# 198 Chapter 5


    # 5.1.6 Integrated Development Environments


    Integrated Development Environments (IDEs) are powerful PC-based programs which
    include everything to edit, assemble, compile, simulate, source-level debug, and
    download the generated executable code to the physical microcontroller chip (using
    a programmer device). These programs are in the form of graphical user interface
    where the user can select various options from the programmer without having exit
    the program. IDEs can be extremely useful during the development phases of microcontroller-based
    systems. Most PIC32 high-level language compilers are in the form of an IDE, enabling
    the programmer to do most tasks within a single software development tool.


    # 5.2 Hardware Development Tools


    There are numerous hardware development tools available for the PIC32 microcontrollers.
    Some of these products are manufactured by Microchip Inc., and some others by
    third-party companies. The popular hardware development tools are the following:


    +   * Development boards

    * Device programmers

    * In-circuit debuggers

    * In-circuit emulators

    * Breadboards.


    # 5.2.1 Development Boards


    The development boards are invaluable microcontroller development tools. Simple
    development boards contain just a microcontroller and the necessary clock circuitry.
    Some sophisticated development boards contain LEDs, LCD, push-buttons, serial
    ports, USB port, power supply circuit, device programming hardware, etc.


    In this section, we shall be looking at the specifications of some of the commercially
    available PIC32 microcontroller development boards.


    PIC32 Starter Kit


    This board (Figure 5.1) is manufactured by Microchip Inc. and can be used in PIC32
    microcontroller-based project development. The kit includes everything to write,
    compile, program, debug, and execute a program.


    The kit contains the PIC32 Starter Kit board, and a USB Mini-B cable.'
  merge: -1
