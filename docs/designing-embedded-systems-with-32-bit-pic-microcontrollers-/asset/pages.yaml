  md: '# mikroC Pro for PIC32 Built-in Library Functions 169


    The Soft_UART_Init function is used to specify the serial communications parameters
    and the pin to be used to send and receive data. The parameters are specified
    in the following order:


    +   - port, rx pin, tx pin, baud rate, mode


    port is the port used as the UART (e.g. PORTB), rx is the receive pin number,
    tx is the transmit pin, and baud rate is the chosen baud rate where the maximum
    value depends on the clock rate of the microcontroller. Mode specifies whether
    or not the data should be inverted at the output of the port. A zero indicates
    that the data should not be inverted, and a one indicates that the data should
    be inverted at the output of the port. When RS232 voltage level converter chip
    is used (e.g. MAX232), the mode must be set to 0.


    Soft_UART_Init must be the function to be called before software-based communication
    to be established. The function returns a byte with the following values:


    +   0: successful initialization

    1: error (requested baud rate is too high)

    2: error (requested baud rate is too low)


    An example is given below which configures the UART to use PORTB as the serial
    port with the RX pin, and RB1 as the TX pin. The baud rate is set to 9600 with
    the mode noninverted:


    ```

    error = Soft_UART_Init(PORTB, 0, 1, 9600, 0);

    ```


    The Soft_UART_Read function is used to receive a byte from the specified serial
    port pin. Soft UART must be initialized before this function can be used. The
    function returns an error condition and the data read from the serial port. The
    function is blocking, it waits for a start bit to be available. The function can
    be terminated by using the Soft_UART_Break function. The returned error byte can
    have the following values:


    +   0: no error

    1: stop bit error

    255: function aborted (by Soft_UART_Break)


    An example is given below which reads a byte from the serial port configured by
    calling the function Soft_UART_Init. The code waits until data are received from
    the serial port and the received byte is stored in Temp:


    ```

    Temp = Soft_UART_Read(&Rx_Error);

    while (Rx_Error);

    ```


    The Soft_UART_Write function transmits a byte to the configured serial port pin.
    Soft UART must be initialized before this function can be used. The data must
    be sent as a parameter in the call to the function.


    An example is given below which sends character “A” to the serial port pin:


    ```

    char MyData = ''A'';

    Soft_UART_Write(MyData);

    ```'
