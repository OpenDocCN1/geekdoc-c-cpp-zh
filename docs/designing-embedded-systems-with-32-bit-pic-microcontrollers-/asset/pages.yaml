  md: '# Advanced PIC32 Projects 407


    Data can be written to or read from any sector of the card using raw access methods.
    In general, SD card data is structured as a file system and two DOS formatted
    partitions are placed on the card: User Area, and Security Protected Area. The
    size of each area depends upon the overall capacity of the card used.


    A card can be inserted and removed from the bus without any damage. This is because
    all data transfers are protected by CRC codes and any bit changes as a result
    of inserting or removing a card can easily be detected. SD cards operate with
    a typical supply voltage of 2.7 V. The maximum allowed power supply voltage is
    3.6 V. If the card is to be operated from a standard 5.0 V supply, a voltage regulator
    should be used to drop the voltage to 2.7 V.


    Using an SD card requires the card to be inserted into a special card holder with
    external contacts (Figure 8.31). Connections can then be made easily to the required
    card pins.


