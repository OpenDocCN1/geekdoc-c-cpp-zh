  md: '# Simple PIC32 Microcontroller Projects 323


    The remaining code in the main program configures Timer 1 to generate interrupts
    at every 100 ms.


    As discussed in Chapter 2, the value to be loaded into the period register PR1
    is calculated from the following equation:


    ```

    PRI = Required Timer delay/(Clock period × Prescaler value)

    ```


    In all the projects in this book, the actual crystal frequency is 8 MHz, but the
    microcontroller operates at 80 MHz by using the PLL logic. In which the prescaler
    is chosen as 256.


    At 80 MHz, the period is given by, T = 0.0125 × 10⁻⁶ s, or T = 0.0125 × 10⁻³ ms


    Thus, PR1 = 100 ms / (0.0125 × 10⁻³ × 25) = 31250.


    The following bits need to be configured for the microcontroller to generate Timer
    1 interrupts at every 100 ms:

    TICONbits.ON = 0; // Disable Timer 1

    TMR1 = 0; // Clear Timer 1 register

    TICONbits.TCKPS = 3; // Select prescaler = 256

    TICONbits.TCS = 0; // Select internal clock

    PR1 = 31250; // Load period register

    IFS0bits.T1IF = 0; // Clear Timer 1 interrupt flag

    IPC0bits.TIP = 1; // Set priority level to 1

    IE0bits.TIE = 1; // Enable Timer 1

    TICONbits.ON = 1; // Enable Timer 1

    EnableInterrupts(); // Enable interrupts


    The main program waits in a for loop. When a Timer 1 interrupt is detected, the
    program jumps to the interrupt service routine, named a COUNTER.


    The interrupt service routine has been created using the Interrupt Assistant of
    the microC Pro for PIC32 compiler IDE, as described in Chapter 2. Here the routine
    is given the name COUNTER, Timer_1 has selected as the interrupt source, priority
    level set to 1, and context switching has been set to software. The interrupt
    service routine code is as follows. Here, Count is incremented by 1, then converted
    into a character array Txt and is displayed in row 1 of the LCD. Notice that the
    Timer 1 interrupt flag T1IF must be cleared so that interrupts can be accepted
    from Timer 1:


    ```

    void COUNTER() ivT_TIMER_1 1ics ICS_SOFT

    {

    Count++; // Increment Count

    ByteToStr(Count, Txt); // Convert Count to string

    Lcd_Out(1, 1, Txt); // Display Count

    IFS0bits.T1IF = 0; // Clear Timer 1 interrupt flag

    ```'
