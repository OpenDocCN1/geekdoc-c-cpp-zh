    # 7.9 Project 7.9—Temperature Measurement and Display on LCD


    # 7.9.1 Project Description


    This project shows how the A/D converter of the PIC32MX460F512L microcontroller
    can be used to measure the analog temperature and display it on the LCD. The temperature
    is read every second then displayed in floating point format on the LCD as:


    ```

    T = nn_nn

    ```


    The block diagram of the project is same as in Figure 7.44. In this project, an
    LM35DZ-type temperature sensor is used with analog output. LM35DZ can measure
    temperature in the range of 2~100 °C. The output voltage is proportional to the
    measured voltage and is expressed as follows:


    ```

    Vo = 10 mV/°C

    ```


    Thus, for example, at 10 °C, the output voltage is 100 mV, and at 25 °C, the output
    voltage is 250 mV and so on.


    # 7.9.2 Project Hardware


    The circuit diagram of the project is shown in Figure 7.45. The output of the
    LM35DZ temperature sensor chip is connected to analog input AN0 (or RB0) of the
    PIC32MX460F512L microcontroller. The microcontroller is powered from a 3.3 V supply,
    and an external 8 MHz crystal is used to provide the clock pulses. With internal
    PLL circuitry, the actual microcontroller clock rate is 80 MHz. An LCD is connected
    to PORT B pins as before.'
