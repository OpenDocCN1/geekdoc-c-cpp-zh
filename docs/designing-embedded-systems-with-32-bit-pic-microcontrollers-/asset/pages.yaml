    # 3.1.10 Escape Sequences


    Escape sequences are commonly used in C languages to represent nonprintable ASCII
    characters. For example, the character combination "\n" represents the new-line
    character. An escape sequence can also be represented by specifying its hexadecimal
    code after a backslash character. For example, the new-line character can also
    be represented as "\x0A" (Table 3.2).


    # 3.1.11 Static Variables


    Static variables are local variables in functions whose values are preserved on
    entry to functions. Normally, local variables declared at the beginning of a function
    are reinitialized every time the function is called. By using the keyword static,
    we make sure the value of the variable is preserved every time the function is
    called, i.e. throughout the lifetime of the program. As shown below, these variables
    are declared using the keyword static:


    ```

    static unsigned char Max;

    ```


