  md: '# PIC32 Microcontroller Development Tools 215


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_216_0.png)


    Figure 5.22

    Internal wiring of the breadboard in Figure 5.21.


    The top and bottom parts of the breadboard are separate with no connection between
    each other. Columns 1–20 are connected to each other on a column basis. Similarly,
    rows G–L in columns 1–20 are connected to each other on a column basis. Integrated
    circuits are placed such that the legs on one side are on the top half of the
    breadboard, and the legs on the other side of the circuit are on the bottom half
    of the breadboard. First two columns on the left of the board are usually reserved
    for the power and earth connections. Connections between the components are usually
    carried out by using stranded (or solid) wires plugged inside the holes to be
    connected.


    Figure 5.23 shows the picture of a breadboard with two integrated circuits and
    a number of resistors and capacitors placed on it.


    The nice thing about the breadboard design is that the circuit can be modified
    very easily and quickly and different ideas can be tested without having to solder
    any components. The components can easily be removed and the breadboard can be
    used for other projects after the circuit has been tested and working satisfactorily.


