  md: '# 290 Chapter 7


    # Modifying the Display Format


    It may be desirable to modify the display format such that the word COUNT and
    the actual event count number are displayed on the same row of the LCD. For example,
    we may want to display the event count as follows:


    ```

    EVENT COUNT

    Count = nnn

    ```


    The modified program (named EVENTS2:C) to implement these changes is shown in
    Figure 7.14. Notice that the word "Count = " is stored in a character called Head.
    The event count is converted into a string and stored in character array Txt.
    The leading spaces in the converted string are removed using library function
    Ltrim. The event count is displayed at the current cursor position using LCD function
    Lcd_Out_Cp.


    Figure 7.15 shows an event count displayed on the LCD with the new format.


    # 7.3 Project 7.3—Creating a Custom LCD Character


    # 7.3.1 Project Description


    In this project we will see how to create a custom character or symbol and display
    it on the LCD. The block diagram of the project is shown in Figure 7.16.


    # 7.3.2 Project Hardware


    The circuit diagram of the project is shown in Figure 7.17. The project is based
    on a PIC32MX460F512L 32-bit microcontroller. A 2 × 16 LCD is connected to PORT
    B as in the previous project. The microcontroller is powered from a 3.3 V supply,
    and an 8 MHz crystal is used to provide the clock pulses. The LCD operates with
    +5 V supply and the microcontroller operates with +3.3 V supply. As a result of
    this microcontroller output pins cannot drive the LCD. A voltage translator chip
    (74VCC3245) is used between the LCD and the microcontroller I/O pins.


    The interface between the microcontroller and the LCD is as in Figure 7.2.


    In this project the LV-32MX V development board is used. The following jumpers
    should be configured on the board to enable the on-board LCD:


    ```

    DIP switch SW20 positions 1–6, set to ON

    ```


    # 7.3.3 Project PDL


    The operation of the project is described in the PDL given in Figure 7.18. At
    the beginning of the program PORT B pins where the LCD is connected to be configured
    as digital. Then the created character is displayed on the LCD.'
