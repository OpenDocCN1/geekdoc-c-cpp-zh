    # 5.3.6 Using a Development Board


    In this section we will see how easy it is to develop 32-bit microcontroller-based
    applications using a development board. This section explains how to use the development
    board LV-32MX V6, described earlier in this chapter. The use of the development
    board will be described with a very simple example. In this example, PORT B LEDs
    will count up in binary with 1 delay after each count.


    However, before using the development board, we need to know in detail how the
    LV-32MX is organized and how to use the various devices and indicators on the
    board.


    LV-32MX V6 Development Board


    Figure 5.60 shows the LV-32MX V6 development board with the functions of various
    devices identified with arrows (further details can be obtained from the LV-32MX
    V6 User Guide). The board can be powered either from an external power supply
    (8–16 V AC/DC) or from the USB port of a computer, using a jumper. In this application,
    the board will be powered from the USB port.


    # Push-Button Switches


    The push-button switches at the bottom-left corner of the board can be used as
    inputs to the microcontroller. Jumper J15 (near the reset button) is used to determine
    the logic state'
  merge: -1
