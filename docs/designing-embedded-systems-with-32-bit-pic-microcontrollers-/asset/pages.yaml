    # 2.1.2 The Microcontroller Clock


    The block diagram of the clock circuit of the PIC32MX microcontroller is shown
    in Figure 2.5.


    There are five clock sources: two of them use internal oscillators, and three
    require external crystals or oscillator circuits. Three clock outputs are available:
    CPU system clock, USB clock, and peripheral clock.


    # Clock Sources


    +   - FRC is an internal oscillator requiring no external components. The clock
    frequency is 8 MHz and is designed for medium-speed low-power operations. The
    clock can be tuned by the TUN bits of register OSCTUN. The clock is accurate to
    ±2% after calibration.

    - LPRC is a low-frequency, low-power internal oscillator with a frequency of 32
    kHz, requiring no external components.

    - POSC is the primary high-speed oscillator, requiring an external crystal up
    to 20 MHz. The crystal is connected directly to the OSCI and OSCO inputs with
    two capacitors.'
