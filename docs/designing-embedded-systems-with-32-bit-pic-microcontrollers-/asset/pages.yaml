    # 8.6.1 The SPI Bus


    SPI (serial peripheral interface) is a synchronous bus standard named by Motorola
    that operates in full duplex mode. Devices on an SPI bus operate in master–slave
    mode, where the master device initiates the data transfer, selects a slave, and
    provides clock to the slaves. The selected slave responds and sends its data to
    the master each clock pulse. The SPI bus can operate with a single master device
    and with one or more slave devices. SPI is a simple interface and is also called
    "four wire" interface.


    The signals in SPI bus are named as follows:


    +   * MOSI—master output, slave input

    * MISO—master input, slave input

    * SCLK—serial clock

    * SS—slave select.


    These signals are also named as follows:


    +   * DO—data out

    * DI—data in

    * CLK—clock

    * CD—chip select.'
