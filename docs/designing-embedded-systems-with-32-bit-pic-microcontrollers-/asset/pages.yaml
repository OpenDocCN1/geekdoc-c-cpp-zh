    # 7.2 Project 7.2—Liquid-Crystal Display Event Counting


    # 7.2.1 Project Description


    This is a simple project that shows external events can be counted and the count
    displayed on a liquid-crystal display (LCD). The block diagram of the project
    is shown in Figure 7.9. In this project, an external event is said to occur when
    bit 1 of PORT C (RC1) goes from logic 1 to logic 0. A 2 × 16 LCD is connected
    to PORT B of the microcontroller. First row, starting from column 5 of the LCD
    displays text “COUNT”, while the actual count is displayed in the second row as,
    for example, count 100 will be displayed as follows:


    COUNT

    100


    # 7.2.2 Project Hardware


    The circuit diagram of the project is shown in Figure 7.10. The project is based
    on a PIC32MX460F512L 32-bit microcontroller. A 2 × 16 LCD is connected to PORT
    B, and external events are applied to 1 of PORT C (RC1). An event is recognized
    by the microcontroller and the event count is incremented and displayed in real-time
    on the LCD. The microcontroller is powered from a 3.3 V supply, and an 8 MHz crystal
    is used to provide the clock pulses. The LCD operates with +5 V supply and the
    microcontroller operates with +3.3 V supply. As a result of, the microcontroller
    output pins cannot drive


