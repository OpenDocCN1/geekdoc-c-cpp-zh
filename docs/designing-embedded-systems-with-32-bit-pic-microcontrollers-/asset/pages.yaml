  md: '# Simple PIC32 Microcontroller Projects 321


    # *************************** TIMER INTERRUPT BASED COUNTER ****


    In this project LCD is connected to PORT B of the microcontroller as follows:


    +   - PORT B LCD

    - RB7 D7

    - RB6 D6

    - RB5 D5

    - RB4 D4

    - RB3 RS


    The main program configures the I/O ports, initializes the LCD, turns OFF the
    cursor, and enables Timer 1 interrupts.


    When a Timer 1 interrupt is detected the program jumps to the Interrupt Routine
    (CALLED COUNT). Here, a counter is incremented and the total count is displayed
    on the LCD. In addition, Timer T1IF flag is cleared so that further interrupts
    can be detected by the microcontroller. In this project, the interrupt priority
    is set to 1.


    The heading "COUNT" is displaying from row 1, column 5 of the LCD. A byte is used
    to store the event count: i.e. it is assured that the event count is no more than
    255.


    In this project, Timer 1 generates an interrupt every 100 us. The prescaler is
    set to 256. The clock rate is 80 MHz (8 MHz crystal is used but frequency multiplied
    by 10 via PLL logic). The value to be loaded into the period PR1 is Required delay
    dfrom:


    ```

    PR1 = Required Timer delay/(Clock period x Prescaler)

    ```


    At 80 MHz, PR1 = 100 ms / (0.0125 x 10⁻�6 x 256) = 31250


    Author: Dogan Ibrahim

    Date: July 2012

    File: TMR1T.c

