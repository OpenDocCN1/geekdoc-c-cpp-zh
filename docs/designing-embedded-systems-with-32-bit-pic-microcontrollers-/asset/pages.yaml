    Figure 8.55

    Third-order FIR filter.


    Figure 8.55 shows a third-order FIR filter where A, B, C and D are the tapping
    points. The operations performed are summarized below:


    Stage 1:


    $D = x[3], C = x[2], B = x[1], A = x[0]

    $y = h_0x[0] + h_1x[1] + h_2x[2] + h_3x[3]$


    where $x[0]$ is where the last input sample is stored.

    After the output, shift the input values so that


    $D = x[2], C = x[1], B = x[0], A = new1$


    where, $new1$ is the new sample stored in tapping point A.

    Stage 2:


    $y = h_0new1 + h_1x[0] + h_2x[1] + h_3x[2]$


    After the output, shift the input values so that


    $D = x[1], C = x[0], B = new1, A = new2$


    where, $new2$ is the new sample stored in tapping point A.

    Stage 3:


    $y = h_0new2 + h_1new1 + h_2x[0] + h_3x[1]$


    After the output, shift the input values so that


    $D = x[0], C = new1, B = new2, A = new3$


    where, $new3$ is the new sample stored in tapping point A.

    Stage 4:


    $y = h_0new3 + h_1new2 + h_2new1 + h_3x[0]$'
