  md: '# 272 Chapter 6


    # 6.4 Summary


    This chapter has described the program development process using the program description
    language (PDL) and flowcharts as tools. The PDL is commonly used as it a simple
    and convenient method of describing the operation of a program. The PDL consists
    of several English-like keywords. Although the flowchart is also a useful tool,
    it can be very tedious in large programs to draw and modify shapes and write text
    inside them.


