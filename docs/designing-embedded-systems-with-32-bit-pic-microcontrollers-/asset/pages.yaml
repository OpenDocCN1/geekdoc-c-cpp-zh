  md: '# Example 1.37


    Show decimal numbers $0.5_{10}$ and $0.75_{10}$ in floating point and then calculate
    the sum of these numbers.


    # Solution 1.37


    As shown in Example 1.36, we can convert the numbers into floating point as follows:


    ```

    $0.5_{10} = 0\ 01110110(1)0000\ 0000\ 0000\ 0000\ 0000$

    ```


    similarly,


    ```

    $0.75_{10} = 0\ 01110110(1)100\ 0000\ 0000\ 0000\ 0000$

    ```


    Since the exponents of both numbers are the same, there is no need to shift the
    smaller number. If we add the mantissa of the numbers we get:


    ```

    $(1)0000\ 0000\ 0000\ 0000\ 0000$

    $(1)1000\ 0000\ 0000\ 0000\ 0000$

    +

    $(10)1000\ 0000\ 0000\ 0000\ 0000$

    ```


    To normalize the number, we can shift it right one digit and increment its exponent.
    The resulting number is as follows:


    ```

    $0\ 01111111(1)010\ 0000\ 0000\ 0000$

    ```


    The above floating point number is equal to decimal number 1.25, which is the
    sum of decimal numbers 0.5 and 0.75.


    To convert point points into decimal and decimal numbers into floating point,
    the freely available program given in the following website can be used: http://babbage.cs.qc.edu/courses/cs341/IEEE-754.html


