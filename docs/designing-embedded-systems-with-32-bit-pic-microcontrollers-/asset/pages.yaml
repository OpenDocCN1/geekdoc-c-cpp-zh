  md: '# 172 Chapter 4


    hardware UART and also the microcontroller can perform other tasks while data
    are received and sent to the UART.


    microK Pro for PIC32 hardware UART library provides the following functions:


    +   - UARTx_Init

    - UARTx_Init_Advanced

    - UARTx_Data_Ready

    - UARTx_Tx_Idle

    - UARTx_Read

    - UARTx_Read_Text

    - UARTx_Write

    - UARTx_Write_Text

    - UART_Set_Active


    where “x” refers to the UART module.


    UARTx_Init function is used to initialize the hardware UART with the specified
    baud rate. The UART is configured with the following default settings:


    +   - Default hardware TX and RX pins

    - Loopback mode disabled

    - Eight-bit data are used

    - Parity bit is not used

    - One stop bit is used

    - An interrupt is generated on reception end and transmission end (if enabled).


    This function should be called before any other UART functions are called. The
    only parameter required by this function is the baud rate. An example call to
    this function is given below which sets the baud rate of UART module 1–9600:


    ```

    UART_Init(9600);

    ```


    The function UARTx_Init_Advanced is used to configure and initialize a UART module.
    The function has the following parameters:


    Baud rate, bus clock frequency (in kHz), speed selection, parity, stop bits


    The speed selection can take one of the following values:


    +   - Low speed: __UART_LOW_SPEED

    - High speed: __UART_HI_SPEED


    The parity parameter is used to select the parity and the data width. Valid values
    are as


    +   - 8-bit data, no parity: __UART_8BIT_NOPARITY

    - 8-bit data, even parity: __UART_8BIT_EVENPARITY

    - 8-bit data, odd parity: __UART_8BIT_ODDPARITY

    - 9-bit data, no parity: __UART_9BIT_NOPARITY'
