    # 2.3 Exercises 90


    PIC32 is a 32-bit family of general-purpose, high-performance microcontrollers
    manufactured by Microchip Technology Inc. Looking at the PIC microcontroller development
    history, based on their performance, we can divide the PIC microcontroller families
    into low-performance, low-to-medium, medium-performance, and high-performance
    devices.


    Low-performance microcontrollers consist of the basic 8-bit PIC10 and PIC16 series
    of devices which have been around for over a decade. These devices are excellent
    general-purpose low-speed microcontrollers which have been used successfully in
    thousands of applications worldwide.


    The PIC18 series of microcontrollers were then introduced by Microchip Technology
    Inc. as low-to-performance devices for use in high-pin count


    The PIC24 series of microcontrollers are based on 16-bit architecture and have
    been introduced as medium-performance devices to be used in applications requiring
    high compatibility with lower performance PIC microcontroller families, and at
    the same time offering higher throughput and complex instruction sets. These microcontrollers
