  md: '# 260 Chapter 6


    The program description language (PDL), sometimes called Program Design Language)
    can be useful to describe the flow of control and data in small- to medium-size
    programs. The main advantage of the PDL description is that it is very easy to
    modify a PDL since it consists of only text. In addition, the code generated from
    a PDL-based program is normally structured and is easy to maintain.


    In this book, we will mainly be using the program description language, but the
    flowcharts will also be given where it is felt to be useful. The following sections
    briefly describe the basic building blocks of the program description language
    and flowcharts. It is left to the readers to decide which methods to use during
    the development of their programs.


    # 6.1 Using the Program Description Language and Flowcharts


    Program Description Language (PDL) is a free-format English-like text which describes
    the flow of control and data in a program. It is important to realize that PDL
    is not a programming language, but it is a collection of some keywords which enable
    a programmer to describe the operation of a program in a sequential and logical
    manner. In this, we will look at the basic PDL statements and their flowchart
    equivalents. The superiority of the PDL over flowcharts will become obvious when
    we have to develop medium- to large-size programs.


    # 6.1.1 BEGIN–END


    Every PDL program should start with a BEGIN and end with an END statement. The
    keywords in a PDL description should be highlighted (e.g. in bold) to make the
    reading easier. The program statements should be indented and described between
    the PDL keywords. An example is shown in Figure 6.1 together with the equivalent
    flow diagram. Notice that the flowchart also uses BEGIN and END keywords.


    # 6.1.2 Sequencing


    For normal sequencing, the program statements should be written in English text
    and describe the operations performed one after the other. An example is shown
    in Figure 6.2 together


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_261_0.png)


    Figure 6.1

    BEGIN–END statement and equivalent flowchart.'
