    # The Watch Clock Window


    The Watch Clock window at the bottom right-hand corner of the debug window measures
    the execution time of a program. The Current Count measures the cycle count and
    time since the last Software action. Delta represents the number of cycles and
    time between the lines where the Software Simulator action has started and stopped.
    Stopwatch is probably the most important window as it measures the number of cycles
    and the time since the simulation has been reset.


    The easiest way to measure the execution time of a program is to insert a breakpoint
    at the end of the program and run the simulator until the breakpoint is hit. For
    the example given in this, the total number of cycles and the execution time were
    135 and 16.88 µs, respectively, as shown in Figure 5.57.


    The following are some other debugger commands:


    # Step Into [F7]


    Executes the current instruction and then halts. If the instruction is a call
    to a routine, the program enters the routine and halts at the first instruction.


    # Step Over [F8]


    Executes the current instruction and then halts. If the instruction is a call
    to a routine, it skips it and halts at the first instruction following the call.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# PIC32 Microcontroller Development Tools 241


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_242_0.png)


    Figure 5.57

    The Watch Clock window.


    # Step Out [CTRL + F8]


    Executes the current instruction and then halts. If the instruction is within
    a routine, executes the instruction and halts at the first instruction following
    the call.


    # Run To Cursor [F4]


    Executes all instructions between the current instruction and the cursor position.


    # Jump To Interrupt [F2]


    Jumps to the interrupt service routine address and executes the procedure located
    at address (a window appears to select the required interrupt source).


    # Toggle Breakpoint


    Toggles the breakpoint where the cursor is placed. To remove a breakpoint, place
    the cursor over the red line and select Run → Toggle Breakpoint from the drop-down
    menu of the IDE (or simply F5). To place a new breakpoint, place the cursor at
    the required place in the program and select Run → Toggle Breakpoint (or press
    F5).


    # 5.3.5 Using the mikroICD In-Circuit Debugger


    microICD is a hardware In-Circuit debugger developed by mikroElektronika. An In-Circuit
    debugger is extremely useful as it enables us to simulate a program on the target
    microcontroller as we have been doing using a software simulator. We can observe
    and'
  merge: -1
