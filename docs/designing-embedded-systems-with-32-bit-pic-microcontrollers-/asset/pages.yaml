  md: '# 300 Chapter 7


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_300_0.png)


    # 7.5.2 Project Hardware


    The circuit diagram of the project is as shown in Figure 7.17.


    # 7.5.3 Project PDL


    The operation of the project is described in the PDL shown in Figure 7.26. The
    program is in an endless for loop where a text displayed on the LCD is shifted
    to left and right continuously with some delay.


    # 7.5.4 Project Program


    The program listing (called SHIFT.C) is shown in Figure 7.27. The program consists
    of the main program and two functions Shift_Right and Shift_Left. The functions
    require two arguments: the number of digits to shift, and the delay between each
    shift operation.


    The main program config PORT B as digital I/O. Then the LCD is initialized and
    cursor is turned OFF. Texts “ABC” and “DEF” are displayed at row 1 and row 2 of
    the display, the main part of the program is executed in an endless for loop.
    function Shift_Right is called to shift the texts right five digits, 1 s with
    each shift. Then, function Shift_Left is called to shift the characters left three
    digits with 2 s delay between each shift. Finally, function Shift_Left is called
    again to shift the texts left two digits with 500 ms between each shift. Built-in
    function Vdelay_Ms is used to create the required delay.'
