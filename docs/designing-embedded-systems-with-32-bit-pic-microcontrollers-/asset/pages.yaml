    # 2.1.1 The Memory


    Figure 2.4 shows the memory structure of the PIC32MX3XX/4XX microcontrollers.

    The memory structure may look complicated initially but the explanation given
    in this section should make it simple and easy to understand.


    As can be seen from the figure, two address spaces are implemented: virtual and
