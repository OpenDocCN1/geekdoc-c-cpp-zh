  md: '# Advanced PIC32 Projects 423


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_422_0.png)


    Figure 8.42\Nth order FIR filter structure.


    In general, an $Nth$ order filter has $(N+1)$ terms on the right-hand side.


    There are different methods to find the filter coefficients. Some of the commonly
    used methods are the following:


    +   * Frequency sampling method

    * Windowed design method

    * Parks–Mcllan method

    * Equiripple method.


    In the windowed design method, the filter is initially designed and then a window
    function is applied (e.g. Hanning window, Hamming window, Rectangular window,
    Kaiser window, and so on) and the filter coefficients are multiplied by the window
    function. This results in the frequency response of the filter being convolved
    with the frequency response of the window function.


    Although the coefficients of an FIR filter can easily be calculated from the required
    impulse response, there are many PC-based software packages that help to design
    FIR filters. Most programs give the filter coefficients as well as they plot the
    frequency response of the filter to be designed. Some commonly used filter design
    programs are MATLAB, SciPy, Scope FIR and so on. In this we will be using the
    Scope FIR filter design program to design our filter and obtain the filter coefficients.


    8.42 shows a typical implementation of an FIR filter of order $N$. Note that the
    top part is an $N$-stage delay line (where $Z^{-1}$ denotes the unit delay operator)
    with $N+1$ taps.


