  md: '# 362 Chapter 8


    # 8.1.2 Method 1 in Detail


    The block diagram of the project is same as given in Figure 7.58.


    Project Hardware (Method 1)


    The circuit diagram of the project is shown in Figure 7.59. The project is based
    on the MCP4921 D/A converter. This is a 12-bit converter with a typical conversion
    time of 4.5 µs. The chip is controlled from the SPI bus of the microcontroller.
    PIC32MX460F512L microcontroller has two built-in SPI controllers. In project,
    SPI2 is used, which consists of input—output pins RG6 (Clock) and RG8 (data).


    Pins RG6 and RG8 of the microcontroller are connected to pins SCK and SDI of the
    D/A converter, respectively. The select chip (CS) input of the D/A converter is
    connected to RF0 of the microcontroller. The D/A converter is operated from a
    +3.3 V supply voltage and the reference input is also connected to the same supply
    voltage. With +3.3 V reference voltage, 1 bit of the converter corresponds to
    3.3 V/4096=0.0008 V or 0.8 mV.


    Project PDL (Method 1)


    Before developing the PDL for this project, it is important to understand how
    the project works.


    The frequency of the sine wave to be generated is 2 kHz. This waveform has a period
    of 500 µs. If we assume that the sine wave will consist of 10 samples, then each
    sample should have output at 500/100= 5 µs. Thus, we will configure Timer 1 to
    generate interrupts at every 5 µs (or 0.05ms), and inside the interrupt service
    routine (ISR), which will output a new sample of the sine wave. The sample values
    will be calculated and loaded into an array entering the real-time ISR, using
    the built-trigonometric sin function of the microC PRO for PIC32 compiler.


    The sin function will have the following format:


    > $$\sin\left(\frac{2\pi \times Count}{T}\right)$


    $T$ is the period of the waveform and is equal to 100 samples. $Count$ is a variable
    that ranges from 0 to 100 and is incremented by one every time a timer interrupt
    occurs. Thus, the sine wave is divided into 100 samples and each sample is output
    at 1 µs. The above formula can be rewritten as follows:


    > $$(0.0628 \times Count)$


    It is required that the amplitude of the waveform be 1 V. With a reference voltage
    of +3.3 V and a 12-bit D/A converter, 1 V is equal to decimal number 1241. Thus,
    we will multiply our sine function with the amplitude at each sample to give the
    following:


    > $$1241 = \sin(0.0628 \times Count)$'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Advanced PIC32 Projects 363


    The D/A converter used in this project is unipolar and cannot output negative
    values. Therefore, an offset is added to the sine wave to shift it, so that it
    is always positive. The offset should be larger than the maximum negative value
    of the sine wave, which is -1241 when above is equal to 1. In this project, we
    are adding 1.2 V offset which corresponds to a decimal value of 1500 at the D/A
    output. Thus, at sample, we will calculate and output the following value to the
    D/A converter:


    ```

    1500 + 1241 * sin(0.0628 × Count)

    ```


    The 100 sine wave samples are calculated using the above formula and then be stored
    in an array that can be used inside the real-time loop.

    D/A converter is 12-bit wide and data are normally sent to the converter with
    the 4-bit high byte first, followed by the 8-bit low byte. Data are sent using
    the built-in SPI function SPI2_Write. The SPI library must be initialized before
    the write function can be used. Also, the D/A converter CS input (RF0) must be
    lowered for it to be enabled and accept data.


    We can now develop the PDL of the project. Figure 8.1 shows the PDL of the project.
    At the beginning, the D/A CS connections to the microcontroller are defined. The
    D/A converter is disabled and the SPI bus is initialized. Calculate_Sine_Samples
    is called to calculate and store the samples in an array. The Timer 1 is configured
    to interrupt at every 5 us. The main program enables interrupts and waits in an
    endless loop for timer interrupts to occur.


    The timer ISR gets the value of the next sine wave sample from the array, multiplies
    by the amplitude, and sends the sample to the D/A converter. If the sample count
    is equal to 100, it is set back to zero. Then, the timer interrupt flag is then
    cleared to zero, so that further interrupts can be accepted from this source.


    # Project Program (Method 1)


    The program is SINE2K.C and the program listing is given in Figure 8.2. At the
    beginning of the program, the CS connections of the D/A converter chip is defined.
    Then the sine wave amplitude is set to 1241, and variable R is defined as 2π/100.
    The CS direction is configured as output, and D/A converter is disabled by setting
    its CS input.


    The D/A converter used in this project is controlled with the SPI bus. Because
    the speed of the SPI bus is limited, the data transfer rate is also limited on
    the bus and we cannot have high data rates. Some D/A converters are connected
    to a microcontroller in parallel format using 8 bits and very high speeds can
    be obtained when using such converters. The default initialization of the SPI
    bus sets the clock rate to System_Clock/64, which is too low to'
