    Before writing a program, it is always helpful to first derive the program’s algorithm.
    Although simple programs can be easily developed by writing the code without any
    prior preparation, the development of complex programs has always become easier
    if the algorithm is first derived. Once the algorithm is ready, writing of the
    actual program code is not a difficult task.


    A program’s algorithm can be described in a variety of graphic- and text-based
    methods, such as flowchart, structure chart, data flow diagram, program description
    language, unified modeling language (UML) activity diagrams, and so on. The problem
    with graphical techniques is that it will be very time consuming to draw shapes
    with text inside them. Also, it is a tedious task to modify an algorithm using
    graphical techniques.


    Flowcharts can be very useful to describe the flow of control and data in small
    programs where there are only a handful of diagrams, usually not extending a page
    or two. Flowcharts are the earliest software tools, introduced in 1920s. There
    are now commercially available flowchart design programs (e.g. SmartDraw, RFlow,
    Edraw, and so on) that help the user to create and manage large and complex flowcharts.
    One of the problems with flowcharts is that the code based on a flowchart tends
    to be rather unstructured with lots of branches all over the place, and it is
    difficult to maintain such code.


    Flowcharts are not used nowadays in the development of large programs. Interested
    readers can find many examples of flowcharts on the Internet.'
