    At the beginning, the D/A chip select connections to the microcontroller are enabled.
    The D/A converter is disabled and the SPI bus library is initialized. The Timer
    1 is configured to interrupt every 100 µs. The main program enables interrupts
    and waits in an endless loop for timer interrupts to occur.


