  md: '# Advanced PIC32 Projects 377


    where, FPB is the peripheral clock frequency, and FPWM is the clock frequency
    of the /PWM signal to be generated.


    The specifications of this project are summarized below:


    +   - Frequency of the PWM signal = 40 MHz (or, period = 0.025 × 10⁻³ s)

    - Peripheral bus clock frequency = 80 MHz (or 0.0125 × 10⁻⁶ s)

    - Timer to be used = Timer 2

    - Timer 2 prescaler = 1

    - Duty cycle = 50%.


    The value to be loaded into register PR2 is calculated as follows:


    ```

    PR2 = \frac{0.025 \times 10^{-3}}{0.0125 \times 10^{-6} \times 1} = 1999

    ```


    The maximum PWM resolution is calculated as follows:


    ```

    Maximum PWM resolution = \frac{Log_{10}(\frac{80 \times 10^6}{40 \times 10^6 \times
    1})}{Log102}} = 11 bits

    ```


    The steps for configuring the PWM module for the above specifications are given
    below

    (notice that since we are using output OC1, the register OCxCON is the register

    OC1CON):


    +   - Calculate the PWM period (0.025 × 10⁻³)

    - Calculate the PWM duty cycle (50%)

    - Use Timer 2 in 16-bit mode

    - Clear register OC1CON, bit 5 (OC32) for 16-bit operation

    - Load PR2 with decimal 1999

    - Load OC1RS low 16-bits with duty cycle (50% duty cycle corresponds to 1999/
    = decimal 1000)

    - No interrupts required

    - Set OCM bits of OC1CON to six to enable PWM mode of operation

    - Select Timer 2 as the timer source

    - Clear TCKPS bits of T2CON to set Timer 2 prescaler to 1

    - Set bit ON of T2CON to enable Timer 2

    - Set bit ON of OC1CON to enable OC1CON.


