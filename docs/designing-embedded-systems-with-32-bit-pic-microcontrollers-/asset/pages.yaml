  md: '# Advanced PIC32 Projects 383


    ****************CHANGING BRIGHTNESS OF AN LED

    ===========


    In this project a Pulse Width Modulated (PWM) waveform is generated from the microcontroller.
    Once configured and running, the PWM module is independent of the CPU and runs
    in the background so that the CPU is free to carry out other tasks.


    In this project the OC1 output (RDO) of the PIC32MX460FS512 microcontroller is
    configured to generate a 40 kHz PWM wave. An LED is connected to pin OC1. The
    duty cycle of the PWM signal is changed continuously so that the brightness of
    the LED changes from OFF to fully ON in about 4 s (the duty cycle is changed from
    0 to 1999 in steps of 50, with 100 ms between each change)


    Author: Dogan Ibrahim

    Date: August 2012

    File: LED_BRIGHTNESS.C

    ****************************************************************/


    ```

    //

    // This function configures the PWM module to generate a 40 kHz PWM signal

    void Configure_PWM_Module(void)

    {

    T2CONbits.T32 = 0;

    // Timer 2 in 16 bit mode

    OC1CONbits.OC32 = 0;

    // 16 bit operation

    PR2 = 1999;

    // Load PR2

    OC1RS = 0;

    // Load duty cycle (0 to start with)

    OC1CONbits.OCM = 6;

    // Enable PWM module

    OC1CONbits.OCTSEL = 0;

    // TIMER 2 is the source

    T2CONbits.TCKP5 = 0;

    // Set Timer 2 prescaler = 1

    T2CONbits.ON = 1;

    // Enable Timer 2

    OC1CONbits.ON = 1;

    // Enable OC1CON

    }

    ```


