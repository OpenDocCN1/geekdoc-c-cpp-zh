  md: "# 446 Appendix\n\n********************************nPIC32 STARTER KIT LED CONTROL\n\
    ***************************\n\nThis is a very simple MPLAB PIC32 program which\
    \ shows how to use the PIC32 Starter Kit and the steps to compile and run a program.\
    \ The LED connected to PORTD pin RD0 is TURNED ON when switch RD6 is pressed,\
    \ otherwise the LED is turned OFF when the button is released.\n\nThe PIC32 Starter\
    \ Kit is operated from 8 MHz crystal. With the PLL, the actual clock frequency\
    \ of the microcontroller is 80 MHz.\n\nAuthor: Dogan Ibrahim\nDate: September,\
    \ 2012\nFile: LED-SWITCH.C\n\n```\n // Adds support for PIC32 Peripheral library\
    \ functions and macros\n// #include <plib.h>\n//\n// Microcontroller clock\n//\
    \ #define SYS_FREQ (80000000)\n//\n// Start of main program\nint main(void)\n\
    {\n// Configure RD0 as output\nPORTSetPinsDigitalOut(IOPORT_D, BIT_0);\n//\n//\
    \ Turn OFF the LED to start\nPORTClearBits(IOPORT_D, BIT_0);\n//\n// Configure\
    \ RD6 as input\nPORTSetPinsDigitalIn(IOPORT_D, BIT_6);\nfor(;;;)\n{\nif(PORTDbitsbits.RD6\
    \ == 0) // If switch is pressed\nPORTSetBits(IOPORT_D, BIT_0); // Turn ON LED\n\
    else\nPORTClearBits(IOPORT_D, BIT_0); // Turn OFF LED\n}\n```\n\n# Figure A.3\n\
    Program listing."
