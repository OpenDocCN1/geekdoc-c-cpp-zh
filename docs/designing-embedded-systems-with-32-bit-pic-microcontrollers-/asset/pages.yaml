  md: "# C Programming for 32-Bit PIC Microcontrollers 95\n\noptional. Two types of\
    \ comments can be used in microC Pro for PIC32 programs: long comments and short\
    \ comments.\n\nLong comments start with characters \"/*\" and end with characters\
    \ \"*/\". These comments are usually used at the beginning of a program to describe\
    \ what the program does, the type of processor used, brief description of the\
    \ algorithm, and the interface to any external hardware used. In addition, the\
    \ name of the author, the date on which the program was written, and the program\
    \ filename are usually given in comment lines to help make any future development\
    \ of the program easier. as shown in Figure 3.1, long comment lines can extend\
    \ over many lines.\n\nShort comments start with characters \"//\" and are usually\
    \ used at the end of statements to describe the operation performed by the statements.\
    \ These comments can be inserted at any other places of programs as well, for\
    \ example:\n\n```\n//\n// Increment the counter\nCnt = Cnt + 1;\n```\n\nShort\
    \ comments can only occupy one line and there is no need to terminate them.\n\n\
    # 3.1.2 White Spaces\n\nWhite spaces in programs are blanks, spaces, tabs, and\
    \ new-line characters. All white spaces are ignored by the C compiler. Thus, the\
    \ following statements are all identical:\n\n```\nchar i,j;\nor\nchar i  j;\n\
    or\nchar i,\nj;\nor\nchar i,j\n  ;\n```\n\n# 3.1.3 Terminating Program Statements\n\
    \nIn C programs, all statements must be terminated with the semicolon \";\", otherwise\
    \ a compilation error occurs:\n\n```\nchar i,j,k      // error\nchar i,j,k;  \
    \  // correct\nj = i + 2       // error\nj = i + 2;      // correct\n```"
