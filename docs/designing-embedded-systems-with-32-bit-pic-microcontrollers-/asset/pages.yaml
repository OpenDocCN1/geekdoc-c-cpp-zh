    # Example 3.13


    Write a program to declare a string with the text “Learning to program in C” in
    the main program. Then, call a function to calculate the number of times character
    a is used in the string and return this number to the main program.


    # Solution 3.13


    The required program listing is given in Figure 3.13. The text is stored in a
    string called Txt. This string and the character to be matched are passed to a
    function called COUNT. Pointer operations are used inside the function to find
    out how many times the required character is used in the string. This count is
    returned to the main program and stored in variable Sum. Notice that in the main
    program, the string is declared using a character array where the size of the
    array is automatically initialized by the compiler:


    ```

    unsigned char Txt[] = "Learning to program in C";

    ```


    we could also have declared the same string using a pointer as:


    ```

    unsigned char *Txt = "Learning to program in C";

    ```


    # 3.2.3 Passing Variables by Reference to Functions


    In C language when we call a function, the variables in function parameters are
    passed by value by default. This means that only the value of the variables are
    passed to the function and these values cannot be modified inside the function.
    There are applications however we want to modify the values of the variables passed
    as parameters. In such applications, we have to pass the parameters by reference.
    Passing a parameter by reference requires the address of the parameter to be passed
    to the function so that the value of the parameter can be modified inside the
    function. It is important to realize that such modifications are permanent and
    affect the actual variable in the main program that is used while calling the
    function. In order to pass parameters by reference we have to use pointers. An
    example is given below to illustrate the concept of how a parameter can be passed
    to a function by reference.


    # Example 3.13


    Write a function to receive an integer number and increment its value by one.
    We use this function in a program and pass the value to be incremented by function
    reference.


    # Solution 3.13


    The required function listing is given in Figure 3.14. In the main program, variable
    Total is initialized to 10. Function INCR is then called and the address of Total
    is passed to the function. The function increments Total by one. Notice that the
    function type is declared as void since it does not return any value to the calling
    program.'
