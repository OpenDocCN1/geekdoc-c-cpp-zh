  md: '# 242 Chapter 5


    modify registers and memory data, and also insert breakpoints on the actual target
    microcontroller.


    microICD is available nearby on all microcontroller development boards of mikroElektronika.
    In addition, a device called microProg is available from the same company that
    can be used to program and In-Circuit debug all types of PIC microcontrollers
    in hardware, microProg is normally used with the hardware where there is no microICD,
    for example, the hardware that we put together.


    In this section, we shall be looking at the operation of the microProg In-Circuit
    programmer when used for the PIC32 microcontrollers. The device actually can be
    used to program and debug PIC16, PIC18, PIC24, dPIC, and PIC32 microcontroller
    chips.


    microProg is connected to a PC via its USB port (Figure 5.20). The other end of
    the device is a 10-way IDC connector that is connected to the target microcontroller.
    The microProg is connected to the development circuit using the following pins
    of the microcontroller.


    +   * MCLR

    * RB6

    * RB7

    * +5 V

    * GND.


    The connection between the microProg and the microcontroller pins are as follows:


    | microProg | Microcontroller |

    |---|---|

    | MCU-VCC | VCC |

    | MCU-PGC | RB6 |

    | MCU-PGD | RB7 |

    | MCU-MCLR | MCLR |

    | MCU-GND | GND |


