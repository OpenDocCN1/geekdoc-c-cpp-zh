  md: '# 406 Chapter 8


    always “0”. With the remaining 6 bits, we have 64 possible commands, named CMD0—CMD63.


    In response to a command, the card sends a status byte known as R1. The MSB of
    this byte is always “0” and the other bits indicate the following error conditions:


    +   - Card in idle state

    - Erase reset

    - Illegal command

    - Communication cyclic redundancy check (CRC) error

    - Erase sequence error

    - Address error

    - Parameter error.


    # Writing Data


    SD card in SPI mode supports block read and multiple block read operations. A
    host should set the block length, and after a valid read command, the card responds
    with a response token, followed by a data block, and a CRC check. The block length
    can be between 1 and 512 bytes. The starting address can be any valid address
    range of the card.


    In multiple read operations, the card sends data blocks with each block having
    its own CRC check attached to the end of the block.


    # Writing Data


    SD card in SPI mode supports single or multiple block write operations. After
    receiving a valid write command from the host, the card will respond with a response
    token, and will wait to receive a data block. A 1-byte “start block” token is
    added to the beginning of every data block. After receiving the data block, the
    card responds with a “data response” token and the card will be programmed as
    long as the block has been received with no errors.


    In multiple write operations, the host sends the data blocks one after the other,
    each preceded with a “start block” token. The card sends a response byte after
    receiving each data block.


    # 8.6.3 Card Size Parameters


    In addition to the normal storage area on the card, there is also a protected
    area that relates to the secured copyright management. This area can be used by
    applications to save security-related data and can be accessed by the host using
    secured read/write commands. The card write protection mechanism does not affect
    this area.'
