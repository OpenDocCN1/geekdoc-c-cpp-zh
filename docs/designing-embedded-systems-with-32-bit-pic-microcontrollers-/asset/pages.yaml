    PIC18F series of microcontrollers (e.g. PIC18F4680) provide CAN interface capabilities.


    # 1.3.21 Ethernet Interface


    Some PIC microcontrollers (e.g. PIC18F97J60) provide Ethernet interface capabilities.
    Such microcontrollers can easily be used in network-based applications.


