  md: '# 4 Chapter 1


    Basically, a microcomputer (or microcontroller) executes a user program which
    is loaded in its program memory. Under the control of this program, data are received
    from external devices (inputs), manipulated and then sent to external devices
    (outputs). For example, in a microcontroller-based fluid-level control system,
    the fluid level is read by the microcomputer via a liquid-sensor device and the
    microcontroller attempts to control the fluid level at the required value. If
    the fluid level is low, the microcomputer operates a pump to draw more fluid from
    the reservoir to keep the fluid at the required level. Figure 1.1 shows the block
    diagram of our simple fluid-level control system.


    The system shown in Figure 1.1 is a very simplified fluid-level control system.
    In a more sophisticated system, we may have a keypad to set the required fluid
    level, and a liquid-crystal display (LCD) to display the current level in the
    tank. Figure 1.2 shows the block diagram of this more sophisticated fluid-level
    control system.


    We can make our design even more sophisticated (Figure 1.3) by adding an audible
    alarm to inform us if the fluid level is outside the required value. Also, the
    actual level at any time can be sent to a PC every second for archiving and further
    processing. For example, a graph of the daily fluid-level changes can be plotted
    on the PC. As you can see, because the microcontrollers are programmable, it is
    very easy to make the final system as simple or as complicated as we like.


    A microcontroller is a powerful tool that allows a designer to create sophisticated
    I/O data manipulation under program control. Microcontrollers are classified by
    the number of bits they process. Eight-bit devices are the most popular ones and
    are used in most low-cost


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_8_0.png)


    Figure 1.1

    Microcontroller-based fluid-level control system.'
