  md: '# Chapter 2


    Some examples are given below to show how the timer interrupts and external interrupts
    can be configured. Notice that the statement EnableInterrupts() must be called
    after configuring the interrupts, so that any interrupt can be accepted by the
    microcontroller. The Projects section of this book gives real examples on configuring
    and using both timer and external interrupts.


    # Configuring Timer 1 Interrupts


    Timer 1 counts up until the value in TMR1 matches the one in period register PR1
    and then the interrupt flag T1IF is set automatically. If the Timer 1 interrupt
    flag T1IE is set, then an interrupt will be generated to the processor. In multi-interrupt
    operations, it is recommended to set the priority and subpriority levels of the
    timer interrupt.


    The steps in configuring the Timer 1 interrupts are given below:


    +   - Configure single- or multive interrupt mode (by default, after reset or
    power-up, the single vector mode is selected).

    - Disable Timer 1, ON (bit 15 in T1CON).

    - Clear timer TMR1 to 0.

    - Select timer prescaler (bits 4–5 in T1CON).

    - Select timer clock source (bit 1 in T1CON).

    - Load period register PR1 as required.

    - Clear interrupt flag, T1IF (bit 4 in IFS0).

    - Set Timer 1 priority level, T1IP (bit 2-4 in IPC1).

    - Set Timer 1 subpriority level, T1IS (if required).

    - Enable Timer 1 interrupts, T1IE (bit 4 in IEC0).

    - Enable Timer 1, ON (bit 15 in T1CON).

    - Write the ISR.

    - Call EnableInterrupts().


    # Configuring External Interrupt 0


    The PIC32 microcontroller supports four external interrupts, INT0 through INT3.
    Interrupts can be recognized either the low-to-high or on the high-to-low transition
    of the interrupt pin, selected by INTCON. In addition, INT0IE bit must be cleared
    before an interrupt can be accepted. External interrupt flag INT0IF pin. In multi-interrupt
    operations, it is recommended to set the priority and subpriority levels of the
    interrupt.


    The steps in configuring the external interrupt 0 are given below:


    +   - Configure single- or multivector interrupt mode (bit 12, INTCON). By default,
    after reset or power-up, the single-vector mode is selected.

    - Clear external interrupt 0 flag, INT0IF (bit 3 in IFS0).'
