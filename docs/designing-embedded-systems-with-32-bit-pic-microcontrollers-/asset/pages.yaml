    action. The joystick is normally used in menu-based applications and games applications.

    Microcontroller I/O pins RB0-RB3 sense the direction of the joystick, while RA10
    senses when the joystick is pressed. Figures 5.72 and 5.73 show the joystick and
    the interface circuit, respectively.


