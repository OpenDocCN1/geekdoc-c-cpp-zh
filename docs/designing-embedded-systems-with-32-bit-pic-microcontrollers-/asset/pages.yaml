    In Chapter 7, we have looked at simple PIC32 microcontroller projects. Most of
    these projects were very small, or required no high speed of processing, or did
    not use any complicated peripherals.


    In this chapter, we will be looking at the design of more advanced projects where
    either performance is required, or the project uses a complicated peripheral.
    The design of the projects follows the same steps given in Chapter 7, where each
    project we will have a description, block diagram, circuit diagram, project development
    laboratory (PDL), full-program listing, and description of the operation of the
    program.


    # 8.1 Project 8.1—Generating High-Frequency Sine Waveform


    # 8.11 Project Description


    In Project 7.14, we have seen how to create a sine waveform in real time and send
    it out through the digital to analog (D/A) converter chip. In that project, we
    calculated the sample points using the microK Pro for PIC32 compiler built-in
    **sin** function.


    Because the **sin** function uses floating point, arithmetic takes a lot of processing
    time and the method presented in Project 7.14 may not be suitable to generate
    high-frequency sine waves in real time. In this project, we will generate a sine
    wave at 2 kHz, amplitude 1 V, and offset 1.2 V, using two different methods to
    calculate the samples. It is possible to generate waveforms with very high frequencies
    using either of the two methods:


    Method 1


    This method is based on calculating the sine wave samples using an offline approach.
    The samples will be calculated and loaded into the appropriate array before the
    real-time loop, which is handled by a timer interrupt. The real-time loop, we
    will send the samples to the D/A converter.


    Method 2


    In this method, we will calculate the sine wave samples using a spreadsheet program
    as Excel, and then we will load an array with the calculated values. Inside the
    real-time loop, we will send the samples to the D/A converter as Method 1.'
