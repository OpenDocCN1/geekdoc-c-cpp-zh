  md: '# 96 Chapter 3


    # 3.1.4 Case Sensitivity


    In C programs, all names are sensitive with variables with lowercase names being
    different to those with uppercase names. Thus, the following variables are all
    different and they represent different locations in memory:


    Count count Count count COUNT count


    # 3.1.5 Variable Names


    In C programs, variable names can begin with an underscore character, or with
    an alphabetical character. Thus, valid variable names can start with a–z, A–Z,
    and the "_" character. Digits 0–9 can be used after valid characters. Variable
    names must be unique and can extend up to 31 characters. Examples of valid variable
    names are the following:


    Total Total99 Sum1_Name SumOfNumbers UserName x123


    Examples of invalid variable names are the following:


    9Sum ?Name +Count £P 45Total /Address


    # 3.1.6 Reserved Names


    Some names are reserved for the compiler and themselves names must not be used
    in our programs as variable names. A list of the reserved names is given in Figure
    3.2. For example, the following variable names are not valid:


    for while switch char struct do float main static


    # 3.1.7 Variable Types


    The microPro for PIC32 language supports a large number of variable types. Table
    3.1 gives a list of the supported variable types. Examples are given below to
    show how these variables can be used in programs:


    bit: This is a 1-bit variable which can take values 0 or 1. In the following example,
    variable flag is declared as a bit and is assigned 1:


    ```

    bit flag;

    flag = 1;

    ```


    Note that variables can be assigned values during their declarations. Thus, the
    above statement can be written as follows:


    ```

    bit flag = 1;

    ```'
