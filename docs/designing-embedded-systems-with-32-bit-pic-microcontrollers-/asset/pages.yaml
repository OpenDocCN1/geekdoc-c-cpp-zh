  md: '# 7.10.4 Project Program


    The program is called MELODY.C and the program listing is given in Figure 7.53.
    At the beginning of the program, the frequencies of musical notes in the middle
    octave are defined as follows:


    ```

    #define C 261

    #define D 293

    #define E 329

    #define F 349

    #define G 392

    #define A 440

    #define B 493

    ```


    The musical notes of the popular melody Jingle Bells are as follows:


    EEEEEEEG C D E F F F E E E E D D E G E E E E E E C D E X


    Note the letter ''X'' at the end of the array denotes the end of the array. The
    corresponding duration of each note in the melody is as follows. Note that these
    are the weights of the notes, not the actual duration:


    1 2 1 2 1 1 1 4 1 1 1 1 1 1 1 1 2 1 2 1 2 1 1 4


    The program configures port pin RC2 as output, and initializes the Sound library.
    The remaining part of the code is executed continuously a for loop. Here, the
    musical notes and their corresponding duration are read from the two arrays and
    sent to the piezoस्पी using the built-in Sound Play function. Here, where k is
    incremented at each iteration to point to the next note. The durations are multiplied
    by 200 to convert them to actual durations in milliseconds


    ```

    Sound_Play(Notes[k], Tim[k]*200); // Play a note

    ```


    While playing musical notes, it is necessary to insert internote delays that the
    notes are not mixed up. In this project 50 ms internote delay is used. After the
    end of the melody, there is 5 s of silence and the for loop is repeated.


    # 7.11 Project 7.11—Playing a Melody Using Push-Button Switches


    # 7.11.1 Project Description


    In the previous project we have seen how to use the microPRO for PIC32 Sound library
    to generate musical tones, and how a simple melody can be created. In this project
    we will use push-button switches to generate musical notes so that we can play
    melodies. Eight push-button switches connected to PORT B will be programmed to
    generate the musical notes. One octave is used (C4–C5) in this project for simplicity,
    but this can easily extended if needed.'
