    EnableInterrupts: Enables interrupts.


    DisableInterrupts: Disables interrupts.


    # 3.3.4 Start-up Initialization


    Upon reset the MCU jumps to address 0xBFC00000 where the BootStart function is
    located. If the processor jumps to the main program, the following actions take
    place:


    The BootStartUp function configures:


    +   - CP0 coprocessor register

    - SFR registers associated with the interrupt

    - Stack pointer and global pointer.


    The processor is configured by default at


    +   - cache and prefetch are enabled;

    - flash wait states are set;

    - executable code is allocated in the KSEG0;

    - data are allocated in the KSEG1.


    # 3.3.5 Read—Modify—Write Cycles


    There are many applications where we want to read the value of a port pin, modify
    it, and then write it back. This is commonly known as the read–modify–write cycle.
    There are some issues that we should be careful about when performing read–modify–write
    cycles.


    When data are read from a port pin, we read the actual physical state of that
    port pin. Now, the problem arises if the port pin is loaded by the external hardware
    such that the'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# 152 Chapter 3


    state of the port pin may be affected. For example, if the port pin is connected
    to a capacitive load, the state of the port pin may be affected if the capacitor
    is charged or discharged. Thus, what we are reading is not the true state of the
    port pin, but rather the physical state of the port pin.


    The read–modify–write cycle problem can be avoided by using the LATx registers
    when writing to and reading from ports, rather than PORTx registers. Writing to
    a LATx register is equivalent to writing to a PORTx register, but reading from
    a LATx register returns the data in the latch register, regardless of the physical
    state of the port pin. Thus, reading will not be affected by the external hardware
    connected to the port pin. It is recommended to use the LATx port register instead
    of the PORTx register, especially while reading from port pins connected to external
    devices such as LCDs, GLCDs, capacitive and inductive loads.


    # 3.3.6 Interrupts


    Interrupts are an important and complex topic in microcontroller programming.
    The interrupt handling mechanisms of the microC Pro for PIC32 language are described
    in detail in the projects sections of this book.


    # 3.4 Summary


    This chapter presented an introduction to the highly popular microC Pro for PIC32
    language. The basic structure of a C program is given with an explanation of the
    basic elements that make a C program.


    The data types of the microC Pro for PIC32 language have been described with examples.
    Various data structures, such as arrays, structures, and unions, have been described
    with examples.


    Functions are important building blocks of all complex programs. The creation
    and use of functions in programs have been described with many examples.


    Various flow control statements as if, switch, while, do, break, and so on have
    been explained in this chapter with examples on their use in C programs.


    Pointers are important elements of all professional C programs. The basic principles
    of pointers have been described with various examples to show how they can be
    used in programs and functions.


    Finally, the basic features of the microC Pro for PIC32 language, developed specifically
    for the PIC32 microcontroller series, have been explained briefly.'
