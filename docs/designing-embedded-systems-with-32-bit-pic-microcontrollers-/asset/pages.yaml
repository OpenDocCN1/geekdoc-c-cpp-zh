  md: '# 3.3 PIC32 Microcontroller Specific Features


    microC Pro for PIC32 language differs from the ANSI C standard in certain ways.
    The modifications have been implemented to make the language more specific to
    the PIC32 series of microcontrollers. In this section, we shall be looking at
    some of the important features of the microC Pro for PIC32 language which are
    specific to the architecture of the PIC32 microcontrollers.


    microC Pro for PIC32 language includes the following keywords which have specifically
    included to support the PIC32 microcontrollers:


    +   **code**: This memory type is used for allocating constants in program memory.
    An example is given below:

    ```

    const x, y, z;

    ```


    +   **data**: This memory type is used for storing variables in data RAM. An example
    is given below:

    ```

    int x, y, z;

    ```


    +   **rx**: This memory type allows the programmer to access the SFRs. An example
    is given below:

    ```

    char x;

    char Temp at PORTB;

    ```


    +   **at**: This is used as an alias to a variable. An example is given below:

    ```

    char x at PORTA;

    ```


    +   **sbit**: This data type is used to provide access to processors registers
    and SFR. An example is given below:

    ```

    sbit LCD_RS at LATB2_bit;

    ```


    +   **bit**: This data type is used to declare single bit variables. An example
    is given below:

    ```

    bit flag;

    ```


    +   **iv**: Used to inform the compiler that this is an ISR.


    # 3.3.1 SFR Registers


    All PIC32 microcontroller SFR registers are defined as global variables of type
    volatile int. Access to all these registers and their bits are available in our
    programs. Some examples are given below:


    ```

    ```

    PORTB

    PORTB,RBO

    INTCONbits.TPC

    ```

    ```'
  merge: -1
