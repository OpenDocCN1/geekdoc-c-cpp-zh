    # AD1CHS


    This register selects the input channels for multiplexers A and B. Figures 2.37
    and 2.38 show the bit configuration and bit definitions, respectively.


    # AD1PCFG


    This register selects the input ports as analog or digital. Setting a bit to 1
    makes the corresponding ANx port pin a digital port. Similarly, clearing a bit
    to 0 makes the corresponding ANx port pin an analog port. To configure all analog
    ports as analog, the command AD1PCFG = 0xFFFF. Similarly, to configure ports as
    analog, the command AD1PCFG = 0.


    # AD1CSSL


    This register controls the A/D input scanning. Setting a bit of the register to1
    selects the corresponding ANx port pin for input scan. Similarly, clearing the
    register to 0 does not select the corresponding ANx port pin for input scan.


