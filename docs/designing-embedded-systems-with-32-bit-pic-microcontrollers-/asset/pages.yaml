  md: '# 1.3.24 Operating Temperature


    It is important to know the operating temperature range of a microcontroller chip
    before a project is developed. PIC32 microcontrollers can operate in the temperature
    range —40 to +105 °C.


    # 1.3.25 Pulse Width Modulated Outputs


    Most microcontrollers provide pulse width modulated (PWM) outputs for driving
    analog devices such as motors, lamps, and so on. The PWM is usually a separate
    module and runs in hardware, independent of the CPU.


    # 1.3.26 JTAG Interface


    Some high-end microcontrollers (e.g. PIC32MX460F512L) have built-in JTAG interfaces
    for enhanced debugging interface.


    # 1.3.27 Package Size


    It is sometimes important to know the package size of a microcontroller chip before
    a microcontroller is chosen for a particular project. Low-end microcontrollers
    are usually packaged in 18, 28 or 40-pin DIL packages. High-end microcontrollers,
    for example, PIC32MX460F512L is housed in a 100-pin TQFP-type package.


    # 1.3.28 Direct Memory Access


    Some high-end microcontrollers have built-in direct memory access (DMA) channels
    that can be used to transfer large amounts of data between different devices without
    the intervention of the CPU. For example, PIC32MX460F512L microcontroller has
    four DMA channels.


    # 1.4 Microcontroller Architectures


    Usually two types of architectures are used in microcontrollers (Figure 1.4):
    Von Neumann and Harvard architecture. Von Neumann architecture is used by a large
    percentage of microcontrollers and here all memory space is on the same bus and
    instruction and data use the same bus. In the Harvard architecture (used by most
    PIC microcontrollers), code and data are on separate busses and this allows the
    code and data to be fetched simultaneously, resulting in an improved performance.'
