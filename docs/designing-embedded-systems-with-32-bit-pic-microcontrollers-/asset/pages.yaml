    # Arithmetic Operators


    Arithmetic operators are used in mathematical expressions. Table 3.3 gives a list
    of the arithmetic operators. All these operators, except the autoincrement and
    autodement, require at least two operators. Autoincrement and autodement operators
    are unary as they require only one.


    The arithmetic operators “+, *, /” are obvious and require no explanation. Operator
    “%%” gives the remainder after an integer division is performed. Some examples
    are given below:


    ```

    12 % 3    gives 0 (no remainder)

    12 % 5    gives 2 (remainder is 2)

    -10 % 3   gives -1 (remainder is -1)

    ```


    The autoincrement operator is used to increment the value of a variable by one.
    Depending on how this operator is used, the value is incremented before (preincrement)
    or after (postincrement) an assignment. Some examples are given below:


    ```

    i = 5;          // i is equal to 5

