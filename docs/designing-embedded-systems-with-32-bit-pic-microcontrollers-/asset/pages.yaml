  md: '# MPLAB and PIC32 Compiler


    The MPLAB C compiler for PIC32 is an ANSI compliant C compiler developed by Microchip
    Inc. for PIC32 family of microcontrollers. The compiler supports fast floating
    arithmetic operations, and provides libraries for a large number of peripherals,
    including Ethernet, CAN, USB, DSP libraries, and so on.


    This Appendix describes the basic features of the MPLAB C compiler and gives an
    example of using this with the PIC32 Starter Kit, the 32-bit microcontroller development
    board manufactured by Microchip Inc. A free evaluation version of the compiler
    is available from Microchip Inc. and can be downloaded from the Microchip website.
    The evaluation version has no code size limit; all libraries are available and
    functional for 60 days. After 60 days, the compiler is still usable but certain
    optimization levels are disabled. The compiler is fully compatible with the MPLAB
    IDE.


    MPLAB PIC32 compiler is integrated into the MPLAB IDE, and this IDE must be installed
    before the compiler is installed. To install both the MPLAB IDE and the MPLAB
    PIC32 compiler, download the installation packages from the Microchip Inc. website
    and install the products as you would install other packages.


    Although both the MPLAB PIC32 and microK PRO for PIC32 are C languages, there
    are many differences between the two. Interested readers should refer to the MPLAB
    PIC32 Users'' Guide for full details and use of the MPLAB PIC32 compiler. Since
    MPLAB PIC32 is one of the popular and commonly used C languages for the 32-bit
    PIC microcontrollers, this Appendix shows the steps to write and compile a simple
    program using this compiler with the PIC32 Starter Kit development board.


    # PIC32 Starter Kit Development Board


    PIC32 Starter Kit has been developed by Microchip Inc. for experimenting with
    the PIC32 family of microcontrollers. The kit has the following basic features:


    +   - PIC32MX360F512L 32-bit microcontroller

    - Regulated +3.3 V power supply

    - Crystal of 8 MHz for microcontroller clocking

    - On-board debugging'
