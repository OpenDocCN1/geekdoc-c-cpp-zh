  md: '# mikroC Pro for PIC32 Built-in Library Functions 163


    Pin 5 is the Read/Write (R/W) pin. This pin is pulled LOW in order to write commands
    or character data to the LCD module. When this pin is HIGH, character data or
    status information can be read from the module.


    Pin 6 is the Enable (EN) pin which is used to initiate the transfer of commands
    or data between the module and the microcontroller. When writing to the display,
    data are transferred only on the HIGH to LOW transition of this pin. When reading
    from the display, data become available after the LOW to HIGH transition of the
    enable pin and this data remain valid as long as the enable pin is logic HIGH.


    Pins 7–14 are the data bus lines (D0–D7). Data can be transferred between the
    microcontroller and the LCD module using either a single eight-bit byte, or two
    four-bit nibbles. In the latter case, only the upper four data lines (D4–D7) are
    used. The four-bit mode has the advantage of fewer I/O lines are required to communicate
    with the LCD.


    mikroC Pro for PIC32 library provides large number of functions to control text-based
    LCDs with 4-bit and 8-bit data interface, and for graphics LCDs. Four-bit interface-based
    text LCDs are the most commonly used and this section describes the available
    mikroC for PIC32 functions for these LCDs. Further information on other text-
    or graphics-based LCD functions can be obtained from the mikroC manual.


    Following is a list of the LCD functions available for four-bit interface text-based
    LCDs:


    +   - Lcd_Init

    - Lcd_Out

    - Lcd_Out_Cp

    - Lcd_Chr

    - Lcd_Chr_Cp

    - Lcd_Cmd.


    A brief description of these functions is given below.


    The Lcd_init function is called to configure the interface between the microcontroller
    and the LCD. The following global variables must be declared before calling this
    function:


    ```

    LCD_RS: LCD register select pin

    LCD_EN: LCD signal enable pin

    LCD_D4: LCD data pin 4

    LCD_D5: LCD data pin 5

    LCD_D6: LCD data pin 6

    LCD_D7: LCD data pin 7

    LCD_RS_Direction: Direction of the register select pin

    LCD_EN_Direction: Direction of the enable signal pin

    LCD_D4_Direction: Direction of data pin 4

    ```'
