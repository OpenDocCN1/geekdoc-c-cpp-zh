  md: '# PIC32 Microcontroller Series 49


    virtual address spaces with fixed number 0x1FFFFFFF, Details of the physical address
    space are available in the PIC32 Family Reference Manual, or in the individual
    microcontroller data sheets.


    The entire virtual address space is 4 GB and is divided into two primary regions:
    User mode and Kernel mode. The lower 2 GB of address space forms the User mode
    segment (called Useg/Kseg). The upper 2 GB of virtual address space forms the
    Kernel mode segment. The kernel address space has been designed to be used by
    the operating system, while the user address space holds a user program that runs
    under the operating system. This is for safety as a program in the user address
    space cannot access the memory space of the kernel address space. But, programs
    in the kernel can access the user address space (this is what the "K" in name
    K indicates). As most embedded microcontroller applications do not use an operating
    system, we can place all our programs and data in the kernel address space and
    not use the user address space at all. As a result of this, we will have 2 GB
    of address space for our programs and data.


    The kernel address space is divided into four segments of 512 MB each: Kseg 0,
    Kseg 1, Kseg 2, and Kseg 3. The kernel address space contains the following memory
    areas:


    +   * Program memory (flash)

    * Data memory (RAM)

    * Special Function Registers (SFR)

    * Boot memory area.


    The kernel virtual address space contains two identical subsections, both translated
    to the same physical memory addresses. One of these subsections is cacheable,
    while the other is not cacheable. Here, cacheable means that the instructions
    and data stored in the cache can be prefetched and this speeds up the execution
    time considerably in sequential operations by eliminating the need to fetch data
    or instructions from the memory (cache memory is a very fast memory). Kseg 0 corresponds
    to the cacheable kernel address space, while Kseg 1 corresponds to the noncacheable
    kernel address space. Each of Kseg 0 and Kseg 1 contain the program memory (flash),
    data memory (RAM), SFR, and Boot memory area. Notice that a PIC32 microcontroller
    can run a program that is stored in the RAM memory (as opposed to the usual case
    of a program stored in the flash memory).


    The cacheable kernel segment is used during normal program executions where instructions
    and data are fetched with the cache enabled. The noncacheable kernel segment is
    used during the processor initialization routines where we wish to execute the
    instructions'
