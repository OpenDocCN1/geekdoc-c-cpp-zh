    Figure 7.39

    PDL of the project.


    The main part of the program is executed inside a for loop which never terminates.
    Inside this loop the program waits until an event occurs, and then increments
    Count, converts it into a string in array Txt, and displays the value of Count
    on the first row of LCD. The program waits until the button is released. The above
    process is repeated forever.


    You should notice when the button is pressed the counting is not one by one, but
    it jumps because of the switch bouncing.


    # Switch Contact Debouncing Code


    We shall see how we can eliminate the switch contact bouncing in software. mikroC
    PRO for PIC32 language has a “Button” library that contains a function called
    “Button” developed just for eliminating switch contact bouncing problems.


    Function Button has the following arguments:


    Port, Pin, Time, Active_State


    Port and Pin specify which I/O port and which pin will be debouncing. In our project
    here, we will be debouncing PORTC, pin 1.


    Time is the debouncing period in milliseconds, a few milliseconds are usually
    all that is required to eliminate the bouncing effects. In our project we will
    be using 2 ms.


    Active_State specifies if the port is active from zero-to-one or from one-to-zero.
    In our project, the Active_State is from one-to-zero.


    The new program listing (DEBOUNCE.C) is shown in Figure 7.41. If we press the
    button now, we will see that the button is clean and the count goes up by each
    one time the button is pressed.'
