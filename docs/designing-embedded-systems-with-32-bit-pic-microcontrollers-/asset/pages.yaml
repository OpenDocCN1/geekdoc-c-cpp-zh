    # 2.1.9 Interrupts


    Interrupt control is one of the most complex parts of the PIC32 microcontrollers.
    There are 96 interrupt sources with up to 64 interrupt vectors, and a large number
    of interrupt control registers. The full description of the interrupt control
    is beyond the scope of this book, and if interested, reader should consult the
    individual microcontroller data sheets for much more information.


    In this section, we shall be looking at the basic operation of the interrupt module
    and see how an interrupt-based program can be written using the mikroC Pro for
    PIC32 language.


    The basic features of the PIC32 interrupt controller module are as follows:


    +   - Up to 96 interrupt sources

    - Up to 64 interrupt vectors

    - Single and multiple vector modes

    - Seven user selectable priority levels for each interrupt

    - Four user selectable subpriority levels within each priority

    - User configurable interrupt vector table location and spacing.


    The interrupt control module has the following SFR registers:


    +   - INTCON

    - INSTAT

    - IPTMR

    - IFS0, IFS1'
