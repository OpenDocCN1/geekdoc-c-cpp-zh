    referred to the online version of this book.)


    to be applied to a microcontroller input when a push-button switch is pressed.
    A 220 Ω protective resistor is used to limit the maximum current, preventing the
    development system and peripheral modules from being damaged, in case a short
    circuit occurs. This resistor can be shorted by jumper J12 if desired. Figure
    5.61 shows how the push-button switches are configured.


    # LEDs


    The LEDs are placed at the middle part of the board. A common LED voltage varies
    from 1 to 20 mA depending on the type of LED used and the required brightness.
    Resistors of 4.7 K are used on the board to limit the LED currents to 1 mA. There
    are 85 LEDs on the board that visually indicate the state of each microcontroller
    pin. As shown in Figure 5.62, it is necessary to connect ports to LEDs using DIP
    switch SW12.'
