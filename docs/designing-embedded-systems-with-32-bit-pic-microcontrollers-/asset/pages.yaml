    # Top-Right Section


    The top-right section of the IDE consists of the following:


    +   - Routine List

    - Project Manager

    - Project Explorer

    - Library Manager.


    The Routine List displays lists of routines used in the program, and enables filtering
    of routines by name. It is possible to jump to a desired routine by double-clicking
    on it, or by pressing the ENTER button. In addition, routine names can be sorted
    by size or by address. Figure 5.33 shows a snapshot of this window.


    The Project Explorer displays lists of the source files (such as C files and header
    files) used in the program, image files, and output files created by the program
    (such as the HEX file, assembler file, list file, and log file). Figure 5.34 shows
    a typical Project Manager window display.


    The Project Explorer provides a list of useful files and sample programs related
    to the microcontroller type being used for our project. Sometimes it may be hard
    to locate these files, and using the Project Explorer window we can select and
    display various useful project-related files and demonstration programs on various
    topics. Figure 5.35 shows the typical contents of this window.


    The Library Manager enables various library files to be selected for our project.
    When this window lists all available libraries (extension .emcl) which are stored
