    # 1.3.17 Current Sink/Source Capability


    This is important if the microcontroller is to be connected to an external device
    which may draw large current for its operation. PIC32 microcontrollers can source
    and sink 18 mA of current from each output port pin. This current is usually sufficient
    to drive LEDs, small lamps, buzzers, small relays, etc. The current capability
    can be increased by connecting external transistor switching circuits or relays
    to the output port pins.


