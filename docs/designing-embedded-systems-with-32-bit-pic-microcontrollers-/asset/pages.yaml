    ```


    The function Lcd_Chr displays a character at the specified row and column position
    of the cursor. The function should be called with the parameters in the following
    order:


    +   row, column, character


    For example, to display “K” at row 2 and column 4 of the LCD, we should call the
    function as follows:


    ```

    Lcd_Chr(2, 4, ''K'');

    ```'
