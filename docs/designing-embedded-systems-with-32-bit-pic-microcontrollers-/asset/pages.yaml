  md: '# TFT_Write_Char


    This function displays a single character at the specified display coordinates.
    In the following example, character “X” is displayed to coordinate x = 20 and
    y = 50.


    ```

    TFT_Write_Char(''X'', 20, 50);

    ```


    # TFT_Write_Text


    This function displays the specified text at the given display coordinates. In
    the following example, text “TFT DISPLAY” is displayed starting from coordinate
    x = 10 and y = 12.


    ```

    TFT_Write_Text("TFT DISPLAY", 10, 12);

    ```


    # TFT_Fill_Screen


    This function changes the background of the display. Valid colors are as in TFT_Set_Font.
    In the following example, the display background is set to white:


    ```

    TFT_Fill_Screen(CL_WHITE);

    ```


    # TFT_Dot


    This function draws a dot at the specified coordinates. The color of the dot can
    be any of the colors specified in function TFT_Set_Font. In the following example,
    a red dot is placed at coordinate x = 10 and y = 20.


    ```

    TFT_Dot(10, 20, CL_RED);

    ```


    # TFT_Set_Pen


    This function sets the color and thickness of a shape such as a circle and rectangle.
    In the following example, the color is set to red, and the thickness is set to
    5:


    ```

    TFT_Set_Pen(CL_RED, 5);

    ```


    # TFT_Line


    This function draws a straight line from a given coordinate to another coordinate.
    In the example below, a line is drawn from (0, 0) to (10, 10).


    ```

    TFT_Line(0, 0, 10, 10);

    ```


    # TFT_Rectangle


    This function draws a rectangle at the specified coordinates. The parameters are
    the following:


    +   - x_upper_left: x coordinate of the upper left rectangle corner.

    - y_upper_left: y coordinate of the upper left rectangle corner.'
