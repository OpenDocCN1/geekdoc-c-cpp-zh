    \ of the program is executed inside a for loop which never terminates. Inside\
    \ this loop the program waits until an event occurs, and increments Count, converts\
    \ it into a string in array Txt using library function ByteToStr, and then displays\
    \ the value of Count on the second row of the LCD. The program then waits until\
    \ pin RC1 returns to 0, i.e. waits until the event has been removed. The above\
    \ process is repeated forever.\n\nFigure 7.13 shows an event count displayed on\
    \ the LCD.\n\n![](img/22a4174d2f8b22c493098a8f5fc2fbbe_289_0.png)\n\nFigure 7.13\n\
