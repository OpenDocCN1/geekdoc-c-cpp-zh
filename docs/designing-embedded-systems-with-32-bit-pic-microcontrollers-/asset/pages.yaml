    # 4.2 LCD Library


    One thing microcontrollers lack is some kind of video display. A video display
    would make a microcontroller much more user-friendly as it will enable text messages,
    graphics, and numeric values to be more versatile than the seven-segment displays,
    LEDs, or alphanumeric displays. Standard displays require complex interfaces and
    their cost is relatively high. LCDs are alphanumeric (or graphical) displays which
    are frequently used in microcontroller-based applications. These display devices
    in different shapes and sizes. Some LCDs have 40 or more character lengths with
    the capability to display several lines. Other LCD displays can be programmed
    to display graphic images. Some modules offer color displays while others incorporate
    backlighting that they can be viewed in dimly lit conditions.


    There are basically two types of LCDs as the interfacing technique is concerned:
    parallel LCDs and serial LCDs. Parallel LCDs (e.g. Hitachi HD44780) are connected
    to the microcontroller circuitry whose data are transferred to the LCD using one
    line, and four or eight data lines. Serial LCD is connected to a microcontroller
    using one data line and are transferred using the RS232 asynchronous data communications
    protocol. Serial LCDs are generally much easier to use but they are more costly
    than the parallel ones. In this book, only the parallel LCDs are considered as
    they are cheaper and used more commonly in microcontroller-based projects.


    Low-level programming of a parallel LCD is usually a complex task and requires
    a good understanding of the internal operation of the LCD, including an understanding
    of the timing'
