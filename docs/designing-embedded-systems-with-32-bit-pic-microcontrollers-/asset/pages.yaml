  md: '# 340 Chapter 7


    connected to pin RF0 of the microcontroller. The converter is operated from a
    +3.3 V supply voltage and the reference input is also connected to the same supply
    voltage. With +3,3 V reference voltage, one bit of the converter corresponds to
    3.3 V/4096 = 0.0008 V or 0.8 mV. Similarly, +1 V corresponds to decimal value
    4096/3.3 = 1241.


    # 7.12.3 Project PDL


    Before developing the PDL for this project, it is important to understand how
    the project works.


    The frequency of the sine wave is generated 100 Hz. This wave has a period of
    10 ms, or 10,000 µs. If we assume the sine wave consists of 100 samples, then
    each sample should be output at 10,000/100 = 100 µs intervals. Then we will configure
    Timer 1 to generate interrupts at every 100 µ, and inside the interrupt routine
    we will output a new sample of the sine wave. The sample values will be calculated
    using the trigonometric sin function of the mikroC PRO for PIC32 compiler.


    The sin function will have the format:


    > $$\sin(\frac{2\pi \times Count}{T})$$


    $T$, is the period of the waveform and is equal to 100 samples. $Count$ is a variable
    that ranges from 0 to 100 and is incremented by one inside the interrupt routine
    every time a interrupt occurs. Thus, the sine wave is divided into 100 samples
    and each sample is output at 100 µs. The above formula can be rewritten as:


    > $$\sin(0.0628 \times Count)$$$


    It is required that the amplitude of the waveform should be 1 V. With a reference
    voltage of +3.3 V and a 12-bit D/A converter, 1 V is equal to decimal 1241. Thus,
    we will multiply our sine function with the amplitude at each sample to give the
    following:


    > $$1241 * \sin(0.0628 \times Count)$$$


    The D/A converter used in this project is unipolar and cannot output negative
    values. Therefore, an offset should be added to the sine wave to shift it that
    it is always positive. The offset should be larger than the maximum negative value
    of the sine wave, which is −1241 when sine above is equal to 1. In this project
    we are adding 1.2 Offset which corresponds to a decimal value of 1500 at the D/A
    output, at each sample we will calculate and output the following value to the
    D/A converter:


    > $$1500 + 1241 * \sin(0.0628 \times Count)$$$'
