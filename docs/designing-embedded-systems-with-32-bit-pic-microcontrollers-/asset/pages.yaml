    Function Time_dateDiff compares two dates and returns the time difference as signed
    long. The function requires two structures T1 and T2 to be passed as arguments
    during the call. The result is positive if T1 is before T2, null if the dates
    are equal, and negative if T1 is after T2. This following example shows how the
    difference (in seconds) between two date structures T1 and T2 can be calculated
    and stored in a variable diff:


    ```

    #include "Time.h"

    TimeStructure T1, T2;

    long diff;

    diff = Time_dateDiff(&T1, &T2);

    ```


    # 4.7.4 Trigonometry Library


    The functions in the trigonometry library implement the fundamental trigonometry
    functions. These functions are implemented as look-up tables and the results are
    in integer format in order to save memory.


    The functions in this library are the following:


    +   - sinE3

    - cosE3


    Function sinE3 calculates the sine of an angle, multiplied by 1000 and rounded
    to the nearest integer number. The angle must be passed as an argument in degrees.
    The following example shows how the sine of angle 45° can be calculated using
    this function. Since the sine of angle 45° is 0.707, the result returned by the
    function is 707.


    ```

    int result;

    result = sinE3(45); // 707 is returned

    ```


