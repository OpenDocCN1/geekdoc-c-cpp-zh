    # Timer 1


    Timer 1 is 16-bit wide that can be used in various internal and external timing
    and counting applications. This timer can be used in synchronous and asynchronous
    internal and external modes.


    Figure 2.25 shows the block diagram of Timer 1. The source of clock for Timer
    1 can be from the Low Power secondary Oscillator (SOSC), the external input TICK,
    or the peripheral bus clock (PBCLK). A prescaler is provided with division ratios
    of 1, 8, 64, and 256 in order to change the timer frequency. The operation of
    the timer is as follows.


    Timer register PR1 is loaded with a 16-bit number. Register TMR1 counts at every
    clock pulse when PR1 is equal to TMR1, flag T1IF is set. At the same time, register
    TMR1 is reset to zero so that new count starts from zero again. If Timer 1 interrupts
    are enabled, an interrupt will be generated where the program will jump to the
    interrupt service routine (ISR) whenever the timer flag is set.


    TIMER 1 is controlled by three registers: T1CON, PR1, and TMR1. Figures 2.26 and
    2.27 show the bit configuration and bit definitions of register T1CON.


    Assuming TMR1 starts counting from zero, the delay before the count reaches PR1
    is given by the following equation:


    ```

    Delay = T x Prescaler x PR1

    ```'
