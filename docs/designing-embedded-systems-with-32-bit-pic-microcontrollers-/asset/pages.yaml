  md: '# 150 Chapter 3


    # 3.3.2 Linker Directives


    microK for PIC32 linker supports a number of useful directives as explained below.


    # Directive Absolute


    Specifies the starting address of a variable in RAM, or a constant in ROM. Some
    examples are given below:


    ```

    char x absolute 0xA0000000; // occupies a byte in 0xA0000000

    int x absolute 0xA0000000; // occupies 2 bytes starting from 0xA0000000

    ```


    # Directive org


    This directive specifies the starting address of a routine in ROM. Org is appended
    to a function definition. An example is shown below:


    ```

    void Func(void) org 0xBA000000 // Function starts at 0xBA000000

    }

    ```


    # Directive funcorg


    This directive is used to place all routines, constants, etc. above a specified
    ROM address.


    With this directive, we can specify the starting address of a routine in ROM using
    the routine name. An example is given below:


    ```

    #pragma funcorg <function name> <starting address>

    ```


    # 3.3.3 Built-in Utilities


    microK for PIC32 language provides a number of utilities that could be useful
    in programs. Some of the important utilities are summarized in this section. Further
    details can be obtained from the microK Pro for PIC32 User Guide.


    Lo: Returns (or sets) the low byte of a number. For example:


    ```

    If x = 0x12345678 then z = Lo(x) returns 0x78

    ```


    or


    ```

    Lo(x) = 0x11 sets x to x = 0x12345611

    ```


    Hi: Returns (or sets) the high byte of a number. For example:


    ```

    If x = 0x12345678 then z = Hi(x) returns 0x56

    ```


    Higher: Returns (or sets) the higher byte of a number. For example:


    ```

    If x = 0x12345678 then z = Higher(x) returns 0x34

    ```'
