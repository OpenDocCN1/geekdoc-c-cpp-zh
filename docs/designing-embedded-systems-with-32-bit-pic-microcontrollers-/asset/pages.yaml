  md: '# 444 Appendix


    +   * Three user-defined LEDs

    * Three user-defined push-button switches

    * Connector for expansion boards.


    The push-button switches do not have hardware debounce circuitry and are connected
    as follows:


    +   * SW1: Active-low switch connected to RD6

    * SW2: Active-low switch connected to RD7

    * SW3: Active-low switch connected to RD13


    The normal state of the switches are logic 1 (+3.3 V), and when pressed, they
    change to logic 0.


    The LEDs are connected to PORT D pins0 through RD2, where sending a logic 1 to
    an LED turns it ON.


    The development board takes its power from the PC and communicates with the PC
    via a mini cable.


