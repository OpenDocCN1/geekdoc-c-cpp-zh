    # 1.6 Number Systems


    The efficient use of a microprocessor or microcontroller requires a working knowledge
    of binary, decimal, and hexadecimal numbering systems. This section provides a
    background for those who are unfamiliar with these numbering systems and who do
    not know how to convert from one number system to another.


    Number systems are classified by their bases. The numbering system used in everyday
    life is base 10 or decimal number system. The most commonly used system in microprocessor
    and microcontroller applications is base 16, or hexadecimal. In addition, base
    2 (binary), or base 8 (octal) number systems are also used.


    # 1.61 Decimal Number System


