    #  4.3 Software UART Library


    UART is used for RS232-based serial communication between two electronic devices.
    In serial communication, only two cables (plus a ground cable) are required to
    transfer data in either direction. Data are sent in serial format over the cable
    but by bit. Normally the receiving device is in idle mode with its transmit (TX)
    pin at logic 1, also known as MARK. Data transmission starts when this pin goes
    to logic 0, also known as SPACE. The first bit sent is the start bit at logic
    0. Following this, 7 or 8 data bits are followed by an optional parity bit. The
    last bit is stop bit at logic 1. Serial data are usually sent as a 10-bit frame
    consisting of a start bit, eight data bits, and a stop bit, and no parity bits.
    Figure 4.4 shows how character “A” can be sent using serial communication. Character
    bit pattern “01000001”. As shown in the figure, the first bit is sent, this is
    followed by eight data bits “01000001”, and finally the stop bit is sent.


    The baud timing is very important in serial communication and both the transmitting
    (TX) and receiving (RX) devices have the same bit timing. The baud timing is measured
    by the baud rate which specifies the number of bits transmitted or received each
    second. Typical baud rates are 4800, 9600, 19200, 38400 and so on. For example,
    when operating at 9600 baud rate with a frame size of 10 bits, 960 characters
    are transmitted or received each second. The timing between each bit is then about
    104 ms.


    In RS232-based serial communication, the two devices are connected to each other
    (Figure 4.5) using either a 25-connector or a 9-connector. Normally the TX, RX,
    and GND pins are required for communication. The required pins for both types
    of connectors are given in Table 4.4.'
