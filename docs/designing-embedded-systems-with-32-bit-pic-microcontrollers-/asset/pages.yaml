    # 5.2.3 In-Circuit Debuggers


    An in-circuit debugger is a hardware connected between a PC and the target microcontroller
    test system and is used to debug real-time applications faster and easier. With
    in-circuit debugging, a monitor program runs in the PIC microcontroller in the
    test circuit. The programmer can set breakpoints on the PIC, run code, single
    step the program, examine variables and registers on the real device and if change
    their values. An in-circuit debugger uses some memory and I/O pins of the target
    PIC microcontroller during the debugging operations. With some in-circuit debuggers
    only, the assembly language programs can be debugged. Some more powerful debuggers
    enable high-level language programs to be debugged.


    In-circuit debuggers also include programming functions that enable the target
    microcontroller to be programmed. Some of the popular in-circuit debuggers are
    PicKit 3, ICD3 and Real Ice from Microchip (www.microchip.com), and mikroProg
    from mikroElektronika. These devices can be used with all types of PIC microcontrollers.


    # 5.2.4 In-Circuit Emulators


    The in-circuit emulator is one of the oldest and the most powerful method of debugging
    a microcontroller system. In fact it is the only tool that substitutes its internal
    processor for the one in your target system. Like all in-circuit debuggers, the
    emulator''s most fundamental resource is access—the ability to examine and change
    the contents of registers, memory and I/O. However, since the ICE replaces the
    CPU, it generally does not require CPU on the target system to provide this capability.
    This makes the in-circuit emulator by far the best tool for troubleshooting new
    or defective systems. Usually every microcontroller family has its own set of
    in-circuit emulator. For example, an in-circuit emulator for the PIC16 microcontrollers
    cannot be used for the PIC18 microcontrollers. Because of this, in order to lower
    the costs, emulator manufacturers provide a multiboard'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 214 Chapter 5


    solution to in-circuit emulation. Usually, a base board is provided which is common
    to most microcontrollers in the family. For example, the same base board can be
    used by all PIC microcontrollers. Then, probes are available for individual microcontrollers.
    When it is required to emulate a new microcontroller in the same family, it is
    sufficient to purchase the probe board for the required microcontroller.


    # 5.2.5 Breadboard


    When we are building an electronic circuit, we have to connect the components
    as shown in the given circuit diagram. This task can usually be carried out on
    a strip-board or a PCB soldering the components together. The PCB approach is
    used for circuits which have been tested and which function as desired and also
    when the circuit is to be made permanent. It is not economical to make a PCB design
    for one or a few applications.


    During the development stage of an electronic circuit, it may not be known in
    advance whether or the circuit will function correctly when assembled. A solderless
    breadboard is then used to assemble the circuit components together. A typical
    breadboard is shown in Figure 5.21. The board consists of rows and columns of
    holes which are spaced so that integrated circuits and other components can be
    fitted inside them. The holes have spring actions so that the component leads
    can be hold inside the holes. There are various types and sizes of breadboards
    depending on the complexity of the circuit to be built. The boards can be stacked
    to make larger boards for very complex circuits. Figure 5.22 shows the internal
    connection layout of the breadboard given in Figure 5.21.


