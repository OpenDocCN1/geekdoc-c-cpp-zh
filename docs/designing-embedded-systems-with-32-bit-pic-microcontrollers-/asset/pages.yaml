    In this project, the A/D converter is operated from the supply voltage of +3.3
    V. With a 10-bit A/D converter (1024 steps) and +3.3 V reference voltage, it is
    possible to detect a voltage change of 3.2 mV at the A/D converter inputs. Notice
    that the LM35DZ sensor requires a minimum of +4 V to operate.


    A voltage translator chip (74VCC3245) is used in Project 7.2 to interface the
    LCD to the microcontroller.


    In this project, the LV-32MX6 development board is used. The following jumpers
