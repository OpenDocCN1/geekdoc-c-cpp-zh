    The scan mode enables a number of input channels to be scanned and converted into
    digital. This is enabled by setting bit 10 of ADICON2. Each bit in the ADICSSL
    register corresponds to an analog input channel, and if a bit is set to 1 in ADICSSL,
    then the corresponding input channel is in the scan sequence.


    The following steps summarize how to configure the A/D module, assuming no interrupts
    are to be generated (see the individual microcontroller data sheets for more information):


    +   * Configure port pin as by clearing the appropriate bits of AD1PCFG.

    * Select the required input channels using ADICHS,

    * Select the format of the result data using bits 8–10 of ADICON1.

    * Select the sample clock source using bits 5–7 of ADICON1.

    * Select the voltage reference source using bits 13–15 of ADICON2.

    * Select the scan mode (if required), alternating sample modes (if required),
    and autoconvert sample time (if required).

    * Select the result buffer mode using bit 1 of ADICON2.

    * Select the A/D clock source using bit 15 of ADICON3.

    * Select A/D clock prescaler using bits 0–7 of ADICON3.

    * Turn ON the A/D using bit 15 of ADICON1.


    The microK Pro for PIC32 language provides a built-in library for simple one-channel
    A/D conversions, where all the required registers are set automatically.'
