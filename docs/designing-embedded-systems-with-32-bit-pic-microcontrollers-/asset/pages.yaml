    # 8.2 Project 2.2—Generating Pulse-Width Modulation Waveform


    # 8.2.1 Project Description


    Pulse-width modulation (PWM) is a powerful technique for controlling analog circuits
    with a microcontroller''s digital outputs. PWM is used in many applications, ranging
    from communications to power control and conversion. For example, the PWM is commonly
    used to control the speed of electric motors, the brightness of lights, in ultrasonic
    cleaning applications, and many more.


    A PWM is basically a bipolar square wave signal where the duration of the ON time
    can be adjusted (or modulated) as desired. This way the power delivered to the
    load can be controlled from a microcontroller.


    Figure 8.7 shows a typical PWM signal. The ON and OFF times are sometimes referred
    to as MARK (or M) and SPACE (or S) of the signal, respectively. Here, we are interested
    in three parameters: signal amplitude, signal frequency (or period), and the signal
    duty cycle.


    The amplitude is usually fixed by the logic 1 level of the microcontroller output
    which depends on the power supply voltage. In some applications, it may be necessary
    to use external circuitry to increase the amplitude. In this project, we will
    be using the output logic 1 level of the microcontroller which is +3.3 V.


    The frequency depends on the application. In this project, we will generate a
    PWM signal with a frequency of 40 kHz. This is the frequency commonly used in
    most ultrasonic applications, such as distance measurement, ultrasonic cleaning,
    and so on.


    The duty cycle, denoted by D, is the ratio of the ON time to the period of the
    signal, i.e. D=M/T D can range from 0 to 1 and is sometimes expressed as a percentage,
    i.e. from 0% to'
