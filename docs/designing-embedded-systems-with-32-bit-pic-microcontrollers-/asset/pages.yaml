    # 5.2.2 Device Programmers


    After writing and translating the program into executable code, the resulting
    HEX file should be loaded to the target microcontroller program memory. Device
    programmers are used to load the program memory of the actual microcontroller
    chip. The type of device programmer to be used depends on the type of microcontroller
    to be programmed. For example, some device programmers can only program PIC16
    series, some can program both PIC16 and PIC18 series, and some are used to program
    different models of microcontrollers (e.g. Intel 8051 series).


    As we have seen in the previous section, some microcontroller development kits
    include on-board device programmers and there is no need to remove the microcontroller
    chip and insert into the programming device. In this section, some of the popular
    programmers that can be used to program PIC32 series of microcontrollers are described.


    mikroProg


    mikroProg (Figure 5.20) is a small handheld programmer manufactured by mikroElektronika
    and supports all PIC microcontrollers from PIC10, PIC12–PIC16, PIC18, dPIC, PIC24,
    and PIC32.


    mikroProg programmer is supported by all the compilers of the company. The device
    is connected to a PC via a USB cable, and to the target development system. The
    microcontroller in the target system is programmed by first compiling and sending
    the HEX code to the programmer device.'
