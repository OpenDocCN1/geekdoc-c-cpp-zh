    The interface between the LCD and the microcontroller is defined using the sbit
    instructions. The following example shows the interface definitions when the LCD
    is connected to PORT B of the microcontroller (RS and EN pins are connected to
    port RB2 and RB3, respectively; D4–D7 are connected to port RB4–RB7, respectively):


    ```

    sbit LCD_RS at LATB2_bit;

    ssbit LCD_EN at LATB3_bit;

    ssbit LCD_04 at LATB4_bit;

    ssbit LCD_05 at LATB5_bit;

    ssbit LCD_06 at LATB6_bit;

    ssbit LCD_07 at LATB7_bit;

    ```


    ```

    sbit LCD_RS_Direction at TRIS2_bit;

    ssbit LCD_EN_Direction at TRIS3_bit;

    ssbit LCD_04_Direction at TRIS4_bit;

    ssbit LCD_05_Direction at TRIS5_bit;

    ssbit LCD_06_Direction at TRIS6_bit;

    ssbit LCD_07_Direction at TRIS7_bit;

    LCD_Init();

    ```


    Figure 4.2 shows the connection between the LCD and the microcontroller for the
    above example configuration. Notice that the brightness of the LCD is controlled
    by using a 10 K potentiometer connected to pin VEE. The PIC32MX360F512L microcontroller
    is used in this example.


    The function Lcd_Out displays text at the specified row and column of the LCD.
    The function should be called with the parameters in the following order:


    +   row, column, text


    For example, to display “Computer” at row 1 and column 2 of the LCD, we should
    call the function as follows:


    ```

    Lcd_Out(1, 2, "Computer");

    ```


    The Lcd_Out_Cp function displays text at the current cursor position. For example,
    to display text “Computer” at the current cursor position function should be called
    as follows:


    ```

