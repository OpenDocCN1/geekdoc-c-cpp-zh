    # 1.4.1 Reduced Instruction Set Computer and Complex Instruction Computer


    Reduced instruction set computer (RISC) and complex instruction computer (CISC)
    refer to the instruction set of a microcontroller. In an eight-bit RISC microcontroller,
    data are 8 bits wide but the instruction words are more than 8-bits (usually 12,
    14 or 16 bits) and the instructions occupy one word in the program memory. Thus,
    the instructions are fetched and executed in one cycle, resulting in an improved
    performance.


    In a CISC microcontroller, both data and instructions are 8 bits wide. CISC microcontrollers
    usually have over 200 instructions. Data and code are on the same bus and cannot
    be fetched simultaneously.


    # 1.5 8, 16, or 32 Bits?


    People are usually confused for making a decision between 8, 16, or 32 bits of
    microcontrollers. It is important to realize that the number of bits just refers
    to the width of the data handled by the processor. This number actually limits
    the precision of mathematical operations carried out by the CPU (although it is
    possible to emulate higher order mathematics in software or by special hardware).


    In general, 8-bit microcontrollers have been around since the first days of the
    microcontroller development. They are cheap, easy to use (only small package size),
    low speed, and can be used in most general-purpose control and data manipulation
    operations. For example, it is still very efficient to design low- to medium-speed
    control systems (e.g. temperature control, fluid-level control, or robotics applications)
    using 8-bit microcontrollers. In such applications, low cost is more important
    than high speed. Many commercial and industrial applications fall into this category
    and can easily be designed using standard 8-bit microcontrollers.


    Microcontrollers of 16 and 32 bit on the other hand cost more, but they offer
    much higher speeds, and much higher precision in mathematical operations. These
    microcontrollers'
