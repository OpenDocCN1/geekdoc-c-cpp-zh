    # Logical Operators


    The logical operators are used in comparisons, and they return TRUE (or 1) if
    the comparison evaluates to nonzero, or FALSE (or 0) is the comparison evaluates
    to zero. Table 3.6 gives a list of the logical operators.


    Some examples are given below to show how the logical operator can be used:


    ```

    a = 10;

    a > 0 && a < 100    // returns 1

    a > 0 || a < 20      // returns 1

    a == 10 || a > 0     // returns 1

    a > 0 && a > 10      // returns 0

    ```


