    Writing microK Pro for PIC32 ISRs


    The PIC32 microcontroller interrupt controller can be configured to operate in
    one of the two modes:


    +   * Single-Vector mode—all interrupt requests will be serviced at one vector
    address (mode out of reset).

    * MultiVector mode—interrupt requests will be serviced at the calculated vector
    address.


    In single-vector mode, the CPU always services the same address. This means that
    only one ISR can be defined. The single-vector mode is calculated using the Exception
    Base (EBase) address (its default is 0x9FC0100E). The exact formula for single-vector
    mode is as follows (see the PIC32 microcontroller individual data sheets for more
    information):


    ```

    Single Vector Address = EBase + 0x200.

    ```


    In multivector mode, the CPU vectors to the unique address for each vector number.
    Each vector is located at a specific offset, with respect to a base address specified
    by the EBase in the CPU. The individual vector address offset is determined by
    the following equation:


    ```

    EBase + (Vector_Number × Vector_Space) + 0x200.

    ```


    By default, the microK Pro for PIC32 compiler configures interrupts in the multivector
    mode, with the EBase address set to 0x9FC01000 and vector space of 32.


    Configuring the interrupt operating can be selected in the compiler edit window.
    As we see in later chapters, this is selected by clicking Project -> Edit Project
    in the drop-down menu of the compiler IDE. An example is shown in Figure 2.39
    (see middle right-hand side of the window).


    The PIC32 family of devices employs two register sets: a primary register set
    for normal program execution and a shadow register set for highest priority interrupt
    processing.


    +   * Register Set Selection in Single-Vector Mode

    In single-vector mode, you can select which register set will be used. By default,
    the interrupt controller will instruct the CPU to the first register set. This
    can be changed in the code.'
