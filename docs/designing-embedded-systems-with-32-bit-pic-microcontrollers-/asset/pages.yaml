    # 2 × 16 LCD


    A 2 × 16 LCD is available on the board. A transceiver chip (74LVCC3245) is provided
    to provide the interface between the +3.3 V microcontroller side and the +5 V
    LCD side. SW20 pins 1–6 should be ON to connect the LCD to the microcontroller.
    PORT B pins RB2–RB7 are used for the LCD interface. Figure 5.74 and 5.75 show
    the LCD and the LCD interface circuit, respectively.


    # The TFT Display


    The LV-32MX V6 provides a 320 × 240 pixel TFT display for graphical applications.
    In addition, a touch panel is provided to enable the user create interactive applications.
    Further details about the TFT display interface can be obtained from the LV-32MX
    V6 User Guide.


