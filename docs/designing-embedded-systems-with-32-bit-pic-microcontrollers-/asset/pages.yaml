  md: "# Chapter 3\n\nIt means that the function has at least two parameters, but\
    \ it can have more than two. An example is given below to show how variable number\
    \ of arguments can be passed to a function.\n\n# Example 3.14\n\nWrite a program\
    \ to call a function and to calculate the sum of two and three numbers. The function\
    \ should be declared to expect at least one parameter which will be the number\
    \ of parameters to follow.\n\n# Solution 3.14\n\nThe required program listing\
    \ is shown in Figure 3.15. Notice that a header file defines a new data type called\
    \ va_list, which is a character pointer. Macro va_start initializes an object\
    \ of type va_list to the address of the first parameter presented to the function.\
    \ The second parameter of va_start is the number of parameters the function will\
    \ have (this must be known). To extract the parameters, we have to call Macro\
    \ va_arg successively with the character pointer and the type of the parameter\
    \ as the arguments of va_arg. It is important that we know the data types of the\
    \ parameters.\n\nIn the main program, variable Total is an integer and function\
    \ Sum is called twice to calculate the sum of its arguments: in the first case,\
    \ there are two parameters with values 5 and 8; and in the second case, there\
    \ are three parameters with values 3, 6, and 8. Function Sum is declared with\
    \ variable number of parameters where the first (num_of_parameters) is the number\
    \ of parameters the function is expected to have at any time. Macros va_list and\
    \ va_start are defined. The actual parameters are extracted inside a for loop.\
    \ The for loop is executed as many times as there are parameters. At each execution,\
    \ Macro va_arg is called with the expected data type of the parameter to be extracted\
    \ and added to temporary variable tot. After all the parameters are extracted,\
    \ Macro va_end is called to clean up the stack and return from the Macro. The\
    \ function then terminates by returning the sum of parameter values to the calling\
    \ program.\n\n# 3.2.5 Pointers to Functions\n\nmikroC for PIC32 language supports\
    \ pointers to functions. In C language, a function's name is simply same as the\
    \ address of the function. Thus, in the following function,\n\n```\na = Test();\n\
    ```\n\nname Test is same as the address of the function, while the function invocation\
    \ operator ( ) is an identifier that the function at the given address will be\
    \ invoked. Since we know the address of the function, we can assign this address\
