    ```

    BEGIN

    Define LCD interface

    Configure AN0 (RB0) as analog input

    Configure RB2-RB7 as digital

    Initialize LCD

    Set cursor OFF

    Clear LCD

    DO FOREVER

    Read channel 0 (AN0) data

    Convert into °C

    Display the temperature on LCD

    ENDDO

    ```


    Figure 7.46

    PDL of the project.


    The LCD is initialized and cursor is turned OFF. Then an endless loop is formed
    where the temperature is read from AN0, converted into degree Celcius, and displayed
    on the LCD.


    # 7.9.4 Project Program


    The program is called TEMPERATURE.C and the program listing is given in Figure
    7.47. At the beginning of the program, the interface between the LCD and the microcontroller
    is defined as before. Character array Txt, variables ADC_Data, and mValue declared.
    AN0 (RB0) is then configured as an analog channel. The remaining bits of PORT
    B are configured as digital since the LCD is connected to these pins. Setting
    TRISB =1 configures AN0 as an input pin. The LCD is then initialized, cursor turned
    OFF, and the display is cleared. Then the A/D converter is initialized by calling
    to built-in library ADC1_Init.


    The remainder of the code is executed forever in a for loop. Inside the loop,
    the sensor data are read and converted into digital by calling built-in function
    ADC1_Get_Sample(0) where the channel number is specified as an argument. This
    value is then converted into actual physical voltage in milliliters. Since the
    A/D converter is 10-bits wide and the reference voltage is +3.3 V (330 mV), it
    is necessary to multiply the real value by 3300/1023 in order to convert into
    real voltage. The actual temperature is found by dividing the value by 10 (the
    sensor output is 10 mV/C). The result is converted into a string held by array
    Txt and is displayed on the LCD. The above process is repeated after a delay of
    1 s.


    Figure 7.48 shows a typical display of the temperature.


