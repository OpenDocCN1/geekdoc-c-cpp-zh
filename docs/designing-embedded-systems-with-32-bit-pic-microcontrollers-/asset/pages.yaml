  md: '# Chapter 5


    # The Power Supply


    The LV-32MX V6 development board is powered from +5 V supply through the USB programming
    cable, or an external AC/DC power source can be connected to the board through
    its power connector. Jumper J16 is used to select the power supply source (the
    USB source is normally selected during normal project development). The development
    system is turned on/off by the Power Supply switch. The board contains on-board
    voltage regulator to reduce the power supply voltage from +5 to +3.3 V. The 3.3
    V is used for powering the microcontroller and other modules on the board. The
    voltage regulator is capable of supplying up to 800 mA.


    # USB UART Modules


    The board is equipped with two USB UART modules that enable the development system
    to be connected to a PC or some other compatible serial communications port via
    a USB connector. DIP switch SW15 controls the USB UART connections on the board.
    In order to connect UART 1 module and the microcontroller, turn ON 1–4 on SW15.
    For UART 2 connections, turn on switches 5–8 on SW15. UART 1 uses microcontroller
    I/O ports RF2, RF8, RD14 and RD15. Similarly, UART 2 uses microcontroller I/O
    ports RF4, RF5, RF12 and RF13. As shown in Figure 5.65, the USB/RS232 interface
    is established using


    # CAN Communication Module


    The CAN communication module is mainly used in automotive applications. A CAN
    interface with an MCP2551 CAN controller chip is provided on the LV-32MX V6 board
    through a two-way connector (CN16) at the middle left-hand part of the board.
    DIP switch SW16 controls the CAN to microcontroller interface. Switches 1 and
    3 of SW16 to ON position (to use I/O ports RF0 and RF1), and switches 2 and 4
    to ON (to use I/O ports RG0 and RG1). Figures 5.66 and 5.67 show the CAN module
    connector and circuit diagram, respectively.


    # SD Card Connector


    The SD card enables a standard SD card to be used with the development board.
    DIP switch SW13, positions 4–18 should be ON to establish connection between the
    microcontroller and the SD card slot. Figures 5.68 and 5.69 show the SD card connector
    and the interface circuit diagram, respectively.


    # The Temperature Sensor


    The board is equipped with the MCP9700A temperature sensor chip which can measure
    the temperature from –40 to +125 °C with an accuracy of ±2 °C. The MCP9700A'
