  md: '# Table 8.1: Selecting the TFT Display Communications Mode


    | IM3 | IM2 | IM1 | IM0 | Mode | Display Pin Number |

    |---|---|---|---|---||}{

    | 0 | 0 | 1 | 0 | 16-bit interface | DB[17:10], DB[8:1] |

    | 0 | 0 | 1 | 1 | 8-bit interface | DB[17:10] |

    | 0 | 1 | 0 | X | SPI interface | SDI, SDO |

    | 1 | 0 | 1 | 0 | 18-bit interface | DB[17:0] |

    | 1 | 0 | 1 | 1 | 9-bit interface | DB[17:9] |


    The other pins of the TFT display are connected as follows (data pins, RS, RST,
    and CS are configured in software as we will see in the following section):


    | | Ground |

    |---||

    | GND, VSYNC, HSYNC, DOTCLK, ENABLE, DB9, DB0, SDI | +3.3 V |

    | VCC, VCC-IO, VCC-1 | RB15 |

    | RS | |

    | RST | RC1 |

    | CS | RF12 |

    | SDO, FMARK | No connection |


    Notice that in 16-bit interface, PMD0–PMD15 pins of the microcontroller are connected
    to the DB1–DB8 and DB10–DB17 pins of display. Pins DB0 and DB9 of the display
    are not used.


    If you are using the LV-32MX6 development board, the following jumpers should
    be configured:


    +   - DIP switch SW17, all switched set to ON

    - DIP switch SW18, all switches set to ON

    - DIP switch SW19, switches 2–8 set to ON


