    After the output, shift the input values so that


    $D = new1, C = new2, B = new3, A = new4$


    where, new4 is the new sample stored in tapping point A.


    Stage 5:


    $y = h_0new4 + h_1new3 + h_2new2 + h_3new1$


    and the process repeats forever.


    The important point to notice here is that the input sample is always multiplied
