  md: '# 344 Chapter 7


    The program configures Timer 1, so that it generates interrupts at every 100 µ.

    With reference to Chapter 2, assuming a prescaler of 256, the value to be loaded
    into period register PR1 is calculated as follows:


    ```

    PRI = Required delay/(clock period × 256)

    ```


    With 80 MHz clock, the clock period is 0.0125 × 10⁻³ ms. Thus,


    ```

    PRI = 0.1 ms/(0.0125 × 10⁻³ × 256) = 31

    ```


    Interrupts are enabled and the program runs until interrupts occurs.


    The Timer 1 interrupt service routine is called TMR. Here, the value of the next
    sample is calculated, multiplied by the amplitude, and then the offset is assessed
    as described in the PDL section above. These operations are done using floating
    point arithmetic where the result is stored in variable Sample. The result is
    then copied integer variable DAC. The D/A chip is enabled, and 4 bits of the result
    DAC is sent to the D/A converter with the following statements:


    ```

    temp = (DAC>>8)&0x0F;      // Store DAC[1..8] to temp[3..0]

    temp |= 0x30;                         // Define D/A setting

    SPI2_Write(temp);                    // Send high byte via SPI

    ```


    Then the lower 8 bits are sent to the D/A converter with the following statements:


    ```

    temp = DAC;                  // Store DAC[7..0] to temp[7..0]

    SPI2_Write(temp);                    // Send low byte via SPI

    ```


