    Serial communication is either implemented in hardware using a specific pin of
    a microcontroller, or the required signals can be generated in software from any
    required pin of a microcontroller. Hardware implementation requires either an
    on-chip UART (or USART) circuit or an external UART chip can be connected to the
    microcontroller. Software-based UART on the other hand is more commonly used and
    it does not require any special circuits. Serial data are generated by delay loops
    in the software-based UART applications. In this section, only the software-based
    UART functions will be described.


    mikroC Pro for PIC32 compiler supports the following software functions. Software
    UART is implemented in software and there is no need to have a UART module. The
    reason for using soft UART is when it is required to have more serial communications
    ports by the target microcontroller. For example, the PIC32MX360F512L provides
    two hardware UARTS. In this case, soft UART functions can be used when we wish
    to have three or more serial ports. mikroC for PIC32 soft UART offers the following
    functions:


    +   - Soft_UART_Init

    - Soft_UART_Read

    - Soft_UART_Write

    - Soft_UART_Break.


    The advantage of using the soft UART functions in serial communication is that
    any microcontroller can be configured as either the transmitter or the receiver
    pin.'
