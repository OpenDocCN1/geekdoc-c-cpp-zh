    # 8.7.2 Project Hardware


    The project is based on the MCP9700A-type low-power linear active analog thermistor
    temperature sensor device. This is small three-pin device which can measure the
    temperature in the range -40 °C to +125 °C with a typical accuracy of ±2 °C. Two
    of the pins are the power supply and the third pin is the analog output voltage.
    This sensor does not require an additional signal-conditioning circuit and can
    be connected directly to one of the A/D converter channels of the microcontroller.
    The operating voltage of the sensor is within the range of +2.3 to +5.5 V.


    The sensor output voltage is given by the following:


    $V_{out} = T_C \times T_A + V_{OC}$


    where,


    +   $V_{out}$ is the output voltage

    $T_C$ is the temperature coefficient of the sensor (typically 10 mV/°C)

    $T_A$ is the ambient temperature (in °C)

    $V_{OC}$ is the sensor output voltage at 0 °C (typically 500 mV).


    Rearranging the above formula we get,


    +   $T_A = (V_{out} - V_{OC}) / T_C$


    or,


    +   $T_A = (V_{out} - 0.5)/0.01$'
