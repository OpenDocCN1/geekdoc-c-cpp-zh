    It is important to realize that an identifier which has been defined cannot be
    defined again before its definition is removed. The preprocessor operator #undef
    is used to remove the definition of an identifier. Thus, we could redefine MAX
    to be 10 as follows:


    ```

    #undef MAX

    #define MAX 10

    ```


    We can also use the preprocessor operator #ifdef to check whether or not an identifier
    has been declared:


    ```

    #ifdef MAX

    #undef MAX

    #define MAX 10

    #endif

    ```


    Notice that the #define preprocessor operator can also be used with parameters,
    as in a Macro expansion with parameters.


    The #define preprocessor operator. These parameters are local to the operator
