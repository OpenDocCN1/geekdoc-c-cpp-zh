    # Solution 1.16


    Calculating the sum of the powers of 8 of the number:


    ```

    $237_8 = 2 \times 8^2 + 3 \times 8^1 + 7 \times 8^0$

    $= 128 + 24 + 7$

    = 159$

    ```


    The required decimal number is $159_{10}$.


