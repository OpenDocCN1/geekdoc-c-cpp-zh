  md: '# Chapter 7


    # Table 7.2: Required Number and PORT B Data


    | Required Number | PORT B Data (Hex) |

    |---|--|

    | 1 | 0x08 |

    | 2 | 0x22 |

    | 3 | 0x2A |

    | 4 | 0x55 |

    | 5 | 0x5D |

    | 6 | 0x77 |


    The relationship between the required number and the data to be sent to PORT B
    to turn on the correct LEDs is given in Table 7.2. For example, to display number
    2, we have to send hexadecimal 0x22 to PORT B. Similarly, to display number 5,
    we have to send hexadecimal 0x5D to PORT B and so on.


    # 7.1.6 Project Program


    The program is called DICE.C and the program listing is given in Figure 7.7. At
    the beginning of the program, **Switch** is defined as bit 1 of PORT C, and **Pressed**
    is defined as 0. The relationship between the dice numbers and the LEDs to be
    turned on are stored in an array DICE, PORT B is configured as digital output
    by clearing TRISC and also by setting AD1PCFG bits. Bit 1 of PORT C is configured
    as digital input by setting TRISC to register 2. All the LEDs are turned OFF to
    start with.


    Variable J is used as the dice number. Variable Pattern is given to the LEDs.
    The program then enters an **for** loop where the value of variable J is incremented
    very fast between 1 and 6. When the push-button switch is pressed (Switch equals
    to Pressed) the LED pattern corresponding to the current value of J is read from
    the array and is sent to the LEDs. The LEDs remain in this state for 3 s (using
    Delay_ms with argument set to 3000 ms) and after this time they all turn OFF to
    indicate that the system is ready to generate a new dice number.


    # 7.1.7 Using a Random Number Generator


    In the project the value of variable J changes very fast between 1 and 6 and when
    the push-button switch is pressed the current value of this variable is taken
    and used as the dice number. Because the values of J are changing very fast we
    can say that the numbers generated are random, i.e. new numbers do not depend
    on the previous numbers.


    In this section we will show how a pseudo random number function can be used to
    generate the dice numbers. The modified program listing is shown in Figure 7.8
    (Program DICAND.C). In this program a function called **Number** generates the
    dice numbers.'
