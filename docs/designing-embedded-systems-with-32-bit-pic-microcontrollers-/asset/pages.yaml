    # Mmc_Fat_Read


    This function reads a byte from the currently assigned file opened for reading.
    Upon function execution, file pointers will be set to the next character in the
    file. Before using this, the file must have been assigned and opened for reading.
    An example is given below which reads a character from a file:


    ```

    Mmc_Fat_Read(&ch);

    ```


    # Mmc_Fat_ReadN


    This function reads the specified number of characters from an opened file and
    stores in an array. An example is given below, which reads 250 characters from
    a file:


    ```

    Mmc_Fat_ReadN(&buffer, 250);

    ```


    The number of bytes is returned by the function.


    # Mmc_Fat_Rewrite


    This function opens the currently assigned file for writing. If the file is not
    empty, its contents will be erased. An example is given below:


    ```

    Mmc_Fat_Rewrite();

    ```


    # Mmc_Fat_Append


    This function opens the currently assigned file for appending data to. Upon execution,
    the file pointer will move to the end of the file. An example is given below:


    ```

    Mmc_Fat_Append();

