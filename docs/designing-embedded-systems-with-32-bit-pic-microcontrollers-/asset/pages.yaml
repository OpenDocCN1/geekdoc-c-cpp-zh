  md: '# 84 Chapter 2


    PIC32 microcontrollers support single and multiple vectored interrupts. In single
    vectored interrupts, all interrupting devices have the same common ISR addresses.
    The source of the interrupt is then determined by examining the interrupt flags
    of each interrupting source. This is actually commonly used method in 8-bit microcontrollers.
    In multiple vectored interrupt operations, each interrupting device has its unique
    ISR address. In fact, PIC32 microcontrollers have 96 interrupt sources and only
    64 vectors. As such, some of the interrupts share the same vector.)


    PIC32 microcontrollers support seven levels of interrupt priority (ipl1–ipl7).
    If more than one interrupt occurs at the same time, the one with higher priority
    is serviced first. While servicing an, if a lower priority interrupt occurs, it
    will be ignored by the processor. In addition to the standard priority levels,
    the PIC32 microcontrollers support four levels of priorities. Thus, should two
    interrupts at the same time, the one with the higherpriority will be serviced
    first. At reset or power-up, all interrupts are disabled and are all set to priority
    level ipl0.


    In addition to general interrupt configuration bits, each interrupt source has
    associated control bits in the SFR registers and these must be configured correct
    for an interrupt to be accepted by the CPU. Some of the important interrupt source
    bits are:


