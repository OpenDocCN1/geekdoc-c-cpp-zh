    # 3.2 Functions


    It is widely accepted that a large program should, wherever possible, expressed
    in terms of a number of smaller, separate functions. Each function should be a
    self-contained section of the code written to perform a specific task. Such an
    approach makes the programming, and more importantly the testing and maintenance
    of the overall program, much easier. For example, during program development,
    each function can be developed and tested independently. When the individual functions
    are tested and working, they can then be included in the overall program. The
    main program can be a few lines long, and consist of function calls to carry out
    the required operations.


    In general, most functions perform some tasks and return data to the calling program.
    Some functions only do not however a requirement that a function must return data.
    Certain tasks and do not return any data. For example, a function to turn on an
    LED is expected to return any data.


    # 3.2.1 mikroC Pro for PIC32 Functions


    In mikroC for PIC32 language, (parameter1, parameter2,...), the format of a function
    is as follows:


    ```

    type name (parameter1, parameter2,...)

    function body

    ```


    At the beginning of a function declaration, we first declare the data type to
    be returned by the function. If the function is not expected to return any data,
    the keyword void should be inserted before the function name. Then, we specify
    the unique name of the function. A function name can be any valid C variable name.
    This is followed by a set of brackets where function parameters are specified,
    by commas. Some functions may not have any parameters and empty brackets should
    be used while declaring such functions. The body of the function contains the
    code to be executed by the function and this code must be enclosed within a pair
    of brackets.


    An example of function declaration with the name INC is shown below. This function
    receives a parameter of type int, multiplies the value of this parameter by 2
    and returns the result to the calling program.


    ```

    int INC(int a)

    {

    return (2 * a);

    }

    ```


    Notice that the keyword return must be used if it is required to return value
    to the calling program. The data type of the returned number must match to the
    data type specified before the function name.'
