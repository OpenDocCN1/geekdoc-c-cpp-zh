    **Figure 8.29**nSPI master–slave connection.


    Figure 8.29 shows the basic connection of a master and a slave device in SPI bus.
    Master sends out data on line MOSI, and receives data on line MISO. The slave
    is selected before data transfer can take place.


    Figure 8.30 shows the case where more than one slave device is connected to the
    SPI bus. Here, each slave is selected individually by the master and although
    all the slaves receive clock pulses, only the selected slave device responds.
    If an SPI device is not selected, its data goes into a high-impedance state, so
    that it does not interfere with the currently selected device on the bus.


    ![](img/22a4174d2f8b22c493098a8f5fc2fbbe_402_1.png)


    **Figure 8.30**nMultiple slave SPI bus.'
