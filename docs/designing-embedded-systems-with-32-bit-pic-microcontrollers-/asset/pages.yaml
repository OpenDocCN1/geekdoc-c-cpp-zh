  md: "# Simple PIC32 Microcontroller Projects 281\n\n```\nBEGIN\nCreate DICE table\n\
    Configure PORT B as outputs\nConfigure RC1 as input\nSet J = 1\nDO FOREVER\nIF\
    \ button pressed THEN\n  Get LED pattern from DICE table\n  Turn ON required LEDs\n\
    \  Wait 3 seconds\n  Set J = 0\n  Turn OFF all LEDs\nENDIF\nIncrement J\nIF J\
    \ = 7 THEN\n  Set J = 1\nENDIF\nENDDO\n```\n\nFigure 7.6\n\nPDL of the project.\n\
    \n# 7.1.5 Project PDL\n\nThe operation of the project is described in the PDL\
    \ given in Figure 7.6. At the beginning of the program PORT B pins are configured\
    \ as outputs, and bit 1 of PORT C (RC1) is configured as input. The program executes\
    \ in a loop continuously and increments a variable between 1 and 6. The state\
    \ of the push-button switch is checked and when the switch is pressed (switch\
    \ output at logic 0), the current number is sent to the LEDs. A simple array is\
    \ used to find the LEDs to be turned ON corresponding to the dice number.\n\n\
    Table 7.1 gives the relationship between a dice number and the corresponding LEDs\
    \ to be turned ON to imitate the faces of a real device. For example, to display\
    \ number 1 (i.e. the middle LED is ON), we have to turn on D4. Similarly, to display\
    \ number 4, we have to turn ON D1, D3, D5, and D7.\n\n# Table 7.1: Dice Number\
    \ and LEDs to be Turned ON\n\n| Required Number | LEDs to be Turned On |\n|---|---|\n\
    | 1 | D4 |\n| 2 | D2, D6 |\n| 3 | D2, D4, D6 |\n| 4 | D1, D3, D5, D7 |\n| 5 |\
    \ D1, D3, D4, D5, D7 |\n| 6 | D1, D2, D3, D5, D7 |"
