    # 8.4.3 Project Hardware


    8.20 shows the circuit diagram of the project. The TFT display is controlled by
    the PMC port pins of the PIC32MX460F512 microcontroller. The controller is controlled
    in 16-bit mode where 16 port pins (PMD0 to DMD15) of the microcontroller are connected
    to the TFT data pins.


    The configuration pins IM0, IM1, IM2 and IM3 of the display control communications
    mode as shown in Table 8.1. In this project, 16-bit communication is used, IM1
    is connected to VCC (+3 V) while the other pins are connected to ground.


    The LED backlight pins LED-A1, LED-A2, LED-A3 and LED-A4 are connected to +5 V.
    LED-K is connected to ground.'
