    # 9.3.2.1 Affine arithmetics: affine forms


    An affine form is characterized by a pair $(c,(b)_m) \in \mathbb{R} \times \mathbb{R}^m$.
    It defines a map $a \in [-1, 1]^m \to \mathbb{R}$ such that


    $a(\epsilon) = c + b^T\epsilon.$


    In the following define by $A = \mathbb{R} \times \mathbb{R}^n$ the set of affine
    forms. The variables $\epsilon_i \in [-1; 1], i \in [1; n]$ are the error terms.


    # 9.3.2.2 Geometric interpretation


    An affine form $(c,(b)_n)$ denotes a subset of $\mathbb{R}$. We introduce a concretization
    function denoting the geometric interpretation of an affine form.


    **Definition 9.6.** Let $\gamma_A: A \to \varphi(\mathbb{R})$ be the concretization
    function of $\mathbf{A}$ defined as:


    ```

    $$\gamma_A: \to \varphi(\mathbb{R}) \left\ \begin{matrix} (c,(b)_n & \mapsto &
    x \in \mathbb{R} \quad \exists \epsilon \in [-1;1]^n, \ x = c + b^T\epsilon \end{matrix}
    \right.\$$

    ```


    When considering an affine form $a \in \mathbf{A}$, one can obtain the set of
    values $\gamma_A \in \varphi(\mathbb{R})$ it represents by considering only the
    absolute values of the coefficients, as illustrated in Fig. 9.3:


    $$\gamma_A(c,(b)_m) = [c - \sum_{i \in[1;m]} |b_i|; c + \sum_{i \in[1;m]} |b_i|].$$


    # 9.3.2.3 Arithmetics


    The set $\mathbf{A}$ is fitted with arithmetic operators: addition, negation,
    multiplication, and scalar multiplication.'
