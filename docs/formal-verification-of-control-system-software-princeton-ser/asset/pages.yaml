    Figure 2.4. Collecting semantics, abstraction, and properties.


    # 2.5.1 Abstracting the fixpoint: fixpoint computation in abstract domains


    # 2.5.1.1 Soundness, incompleteness, and alarms


    Despite its proven existence, this exact set of reachable states is very hard
    to compute in general. The framework of abstract interpretation provides means
    to abstract it, that is, i.e., to compute another value $C#$ of $\wp(\Sigma)$
    bigger than $C$ for the set inclusion, i.e., containing more states. Some of these
    states are spurious, they are not reachable in practice, but will be considered
    as such by the abstraction computed. The validity of a property $P$ is checked
    with respect to $C#$. $P$ is characterized by the set of states satisfying: $P
    = \{s \mid P(s)\}$. In case of success, we have all states in $C#$ satisfy the
    property, and therefore the subset $\mathcal{C}$.


    ```

    $C# \subseteq P$

    \Rightarrow C \subseteq P \quad$ by inclusion $C \subseteq C#$.

    ```


    Figure 2.4 illustrates such inclusions.


    In case of failure, one cannot conclude since an erroneous state $s \in C# \setminus
    P$ could either be in $\mathcal{C}$ or in spurious states introduced by the abstraction.
    We speak of an *alarm*. This characterizes the incompleteness of the approach.


    # 2.5.1.2 Abstract domains


    An abstraction is meant to approximate sets of states $\wp(\Sigma)$ and is defined
    by an abstract domain. An abstract domain represents a set of abstract states
    $D#$, fitted with a complete lattice structure:$(D#, \bot, \sqcup, \Pi, \perp,
    \top)$ where $\bot$ and $\top$ denote infimum and supremum values, respectively.


    > In some cases, such as the one presented in Section 9.3.2, a complete lattice
    structure is not available. Proofs of convergence are then more complex to achieve.'
