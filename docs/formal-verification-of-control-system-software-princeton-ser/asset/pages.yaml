  md: '# Chapter Eight


    # Validation of System-level Properties at Code Level


    ALL PREVIOUS analyses were performed on discrete dynamical systems models. As
    mentioned in Section 4.1, these models can be either provided as early design
    artifacts or extracted for more concrete representation such as models or code.


    However, once the control-level properties have been expressed and analyzed at
    model level, we would like to assert their validity on the code artifact extracted
    from the model.


    Likely, this extraction from models is largely automated thanks to autocoding
    framework generating embedded code from dataflow models such as MATLAB, Esterel
    SCADE, and the academic language LUSTRE [13]. Code generation from dataflow language
    [77] is now effective and widely used in the industry, supported by tools such
    as MATLAB Embedded Code, Esterel KCG, or LUSTRE compilers, e.g., [118].


    We claim that code generation can be adapted to enable the expression of system-level
    properties at code level, and will be later proved with respect to the code semantics.


    The current chapter addresses this issue. We first give an overview of the modeling
    framework, enabling the expression of properties at model and code level. A second
    part explains the generation of such code annotations while a last part focuses
    on their verification.


    # 8.1 AXIOMATIC SEMANTICS OF CONTROL PROPERTIES THROUGH SYNCHRONOUS OBSERVERS
    AND HOARE TRIPLES


    The framework credible autocoding of control software using control semantics
    is summarized in Figure 8.1. The framework provides a conduit that allows the
    domain expert, e.g., the control engineer, to more efficiently produce code with
    automatically verifiable guarantees of safety and high-level functional properties.
    Credible autocoding framework adds, an additional layer for the generation, translation,
    and verification of the control semantics of the system based on the model-based
    development cycle. By control semantics of the system, we mean precisely the closed-loop
    stability and performance properties of the control system and their accompanying
    proofs. In this framework, the control'
