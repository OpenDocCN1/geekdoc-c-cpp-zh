    # 5.3.3.2 Writing $(x, u) \in X^i \cap S_{i,\alpha}$ as semidefinite constraints


    We assume that $(x, u) \in X^i \cap S_{i,\alpha}$ (this index $i$ is unique).
    Invariance means that if we apply the applicable law to $(x, u)$ and suppose that
    the image of $(x, u)$ belongs to some cell $X^j$ (notation $i \to j$), then the
    image of $(x, u)$ belongs to $S_{j,\alpha}$. Note that $(x, u) \in X^i$ and its
    image is supposed to be in $X^j$ then $(x, u) \in X^j$. Let $(i, j) \in \mathcal{T}^2$
    such that $i \to j$, invariance translated in inequalities and implication gives:


    ```

    $$\begin{pmatrix} x \ u \end{pmatrix}^T \in X^i \wedge \begin{pmatrix} x \ u \end{pmatrix}
    \in S_{i,\alpha}$$

    $$\implies \begin{pmatrix} A^{i\T}x + B^i u + b^i \ u \end{pmatrix} \in S_{j,\alpha}.
    \quad (5.25)$

