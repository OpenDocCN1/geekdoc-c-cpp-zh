    # 5.4 K-INDUCTIVE QUADRATIC INVARIANTS


    # 5.4.1 K-induction principle


    The principle behind all computed invariants up to now was the inductiveness of
    computed Lyapunov function $V(x)$ with respect to the system transition function
    $f$.


    However, as mentioned in Sec. 5.1.1, a property could be valid, i.e., an invariant,
    without being directly inductive. In SMT-based model-checking, a trade-off to
    prove the validity of a property for a given transition system $(\Sigma, I \subseteq
    \Sigma, T \in \Sigma^2)$ is to search for a $k$-induction proof [36, 102] instead
    of a 1-induction one.


    In k-induction, the base step addresses the property verification on all traces
    of length up to $k$, rooted in an initial state, while the inductive step intends
    to show that any trace suffix of length $k$ validating the property preserves
    it in the $k+1$-th step.'
