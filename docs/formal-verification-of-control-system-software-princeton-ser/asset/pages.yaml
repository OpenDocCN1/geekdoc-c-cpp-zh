  md: '# Chapter Nine


    # Floating-point Semantics of Analyzed Programs


    WHEN IT comes to implementation in a computer, one is limited by the finite bit-level
    representation of real numbers. A real number is then represented in the computer
    by a representation in a fixed number of bits. There exist mainly two families
    of such representations: fixed-point and floating-point representation. Their
    use depends on the application and industrial context and floating-point arithmetics
    is the main representation used in aerospace applications. This can, however,
    lead to strange non-expected behaviors (see, e.g., [81] for detailed examples).


    Until now computations and formalizations have assumed real computations. In this
    chapter a first part outlines floating-point semantics. A second part revisits
    previous results and adapts them to account for floating-point computations, assuming
    a bound on the rounding error is provided. A last part focuses on the approaches
    to bound these imprecisions, over-approximating the floating-point errors.


    # 9.1 FLOATING-POINT SEMANTICS


    # 9.1.1 IEEE 754 floating-point representation


    The norm IEEE 754 defines the floating-point representation and operations. In
    the following we denote by *float* an IEEE 754 floating-point representation.
    Its implementation can vary very much, for the context of this work, we assume
    that the C level or machine level implementation faithfully respects the norm.
    On a fixed number of bits typically 64 bits one can represent, as IEEE 754 floating-point
    values, a finite (but large) number of real numbers. These values are defined
    as follows:


    $$$f=(-1)^s \cdot man \cdot 2^{exp}$$


    (9.1)


    where $s$ is bit of sign, $sign$ relies on a bit representation over $n$ bits
    of a positive integer, denoting a fractional part, and $exp$, the exponent, depends
    on an unsigned integer representation of $k$ bits. In the following we denote
    by $exp_k$, the $k$ bits describing the exponent and by $man$, the $n$ bits describing
    the significand. We also denote by $[b]_u$ the unsigned integer interpretation
    of a bit $b$.'
