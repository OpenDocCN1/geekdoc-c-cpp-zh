    quad (7.12)$\n\nis shown in Fig. 7.7.\n\nWe introduce the Nyquist stability criterion\
    \ which uses the Nyquist plot to determine the closed-loop stability of the system.\
    \ Let $Z_i$ be the number of OUD zeros of $L(z)+1$ and $P_i$ be the number of\
    \ OUD poles of $L(z)+1$. By Cauchy's principle of argument, the Nyquist plot should\
    \ encircle clockwise the $-1+0j$ point $N_i$ times where\n\n$N_i = Z_i - P_i.\
    \ \\quad (7.13)$\n\nUsing (7.13) and the Nyquist plot in Fig. 7.7, we can conclude\
    \ the stability of the closed-loop system in the following way. First we know\
    \ the loop transfer function $\\frac{L(z)}{1+L(z)}$ in (7.12) is stable, i.e.,\
    \ it has 0 OUD poles, which means $P_i=0$. Since the Nyquist plot in Fig. 7.7\
    \ does not encircle $-1+0j$, i.e., the critical point, we can conclude that the\
    \ number of OUD zeros of $L(z)+1$ is also 0. Since OUD zeros of $L(z)+1$ are also\
    \ the OUD poles of the closed-loop transfer function, we can conclude that the\
    \ closed-loop system is also stable.\n\n# 7.2.2 Phase and gain margins\n\nFrom\
    \ the Nyquist stability criterion, one can infer that a possible robustness metric\
    \ would be the size of the gap between the Nyquist plot and the $-1+0j$ point.\
    \ In fact, phase and gain margins are two different approximations of the \"distance\"\
    \ from the Nyquist plot to the critical point.\n\nThe first approximation, phase\
    \ margin, measures how much phase lag the system can tolerate. A phase lag of\
    \ $\\frac{\\pi}{2}$ or $90^\\circ$ corresponds to a delay of a quarter of a period.\
    \ Geometrically speaking, introducing a phase lag of $\\Delta_\\omega$ in the\
    \ feedback loop results in the original Nyquist rotated clockwise by $\\Delta_\\\
    omega$, i.e., $L(z) \to e^{\\Delta_\\omega}L(z)$. The phase margin represents\
    \ the amount of clockwise rotation that can be applied to the Nyquist plot before\
    \ it hits the critical. As shown in Fig. 7.7, the phase margin (PM) is precisely\
    \ the clockwise angle between the point where the unit circle, centered at the\
    \ origin, intersects with the Nyquist plot and $-1+0j$.\n\nThe second approximation,\
