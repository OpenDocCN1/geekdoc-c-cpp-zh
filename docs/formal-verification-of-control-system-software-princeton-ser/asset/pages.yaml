    # 9.2.4 Checking soundness of invariant with floating-point error noise


    In presence of simple linear updates and guards, assuming conditions on the dimension
    of the considered systems, and assuming a specific evaluation order, the error
    on the computation of linear update $\Delta z$ can be bounded. We refer the reader
    to the work of Roux [128, 144] for the characterization of such bounds and the
    formal proof of the results in Coq.


    However, in the presence of a more complex dynamic, static analysis provides more
    flexible means to compute the floating-point error bound. Assuming such analysis
    is available, we propose the following algorithm to perform this invariant soundness
    check.


    # 9.3 BOUND FLOATING-POINT ERRORS: TAYLOR-BASED ABSTRACTIONS AKA ZONOTOP ABSTRACT
    DOMAINS


    Provided bounds on each variable, computing the floating-point error can be performed
    with classical interval-based analysis. Kleene based iterations with interval
    abstract domain provide the appropriate framework to compute such bounds. In our
    setting this is even simpler since we are interested in bounding the floating-point
    error on a single call of our dynamic system transition function, that is, a single
    loop body execution without internal loops.'
