  md: "# TEMPLATE BASED ANALYSES\n\n125\n\n**Theorem 6.14.** Given a (potentially\
    \ infinite) set $\\mathcal{F}$ of min-policies for $F$. If for all $b \\in \\\
    mathbb{R}^n$ there exist a policy $F \\in \\mathcal{F}$ interpolating $F$ at point\
    \ $b$ (i.e., $E(b)=F(b)$ and if each $F \\in \\mathcal{F}$ has a least fixpoint\
    \ $lfpF$, then the least fixpoint of $F$ satisfies\n\n```\n$$lfpF = \\bigwedge_{F\
    \ \\in \\mathcal{F}} lfpF$$\n```\n\nIterations are done with two main objects:\
    \ a min-policy $\\sigma$ and a tuple $\beta$ of values for the system of equations.\
    \ The following policy iteration algorithm starts from some fixpoint $\beta_0$\
    \ of $F$ and aims to produce a better-approximation of a fixpoint of $F$. Policy\
    \ iteration algorithms always proceed by iterating through two phases: first a\
    \ policy $\\sigma_i$ is selected, then it is solved by some $\beta_i$. More precisely\
    \ in our case:\n\n+   - a linear min-policy $\\sigma_{i+1}$ being tangent to $F$\
    \ at point $\beta_i$ (this can be done thanks to a semidefinite programming solver\
    \ and an appropriate relaxation)\n- compute the least fixpoint $\beta_{i+1}$ of\
    \ policy $\\sigma_{i+1}$ thanks to a linear programming solver.\n\nIterations\
    \ can be stopped at any point (for instance, after a fixed number of iterations\
    \ or when progress between $\beta_i$ and $\beta_{i+1}$ is considered small enough),\
    \ leaving an over-approximation $\beta$ of a fixpoint of $F$.\n\n# 6.5.2 Max-policy\
    \ iterations\n\nBehavior as a super widening, max-policy iterations [93] work\
    \ in the opposite direction compared to min-policy iterations. They start from\
    \ the bottom and iterate computations of greatest fixpoints on so-called max-policies\
    \ until a global fixpoint is reached. Unlike the previous approach, the algorithm\
    \ terminates with a theoretically precise fixpoint, but the user has to wait until\
    \ the end since intermediate results are not over-approximations of a fixpoint.\
    \ The policies are dual of min-policies: $F$ is a max-policy for $F$ if every\
    \ $b \\in \\mathbb{R}^n$, $F \\le F(b)$ and there exist some $b_0 \\in \\mathbb{R}^n$\
    \ such that $F(b_0)=F(b)$. In particular, the choice of one in each equation is\
    \ a max-policy.\n\nIterations are done with two main objects: a max-policy $\\\
    sigma$ and a tuple $\beta$ of values for the system of equations. Considering\
    \ computing a fixpoint on a given policy reduces to a mathematical optimization\
    \ problem and a fixpoint of the equation system is also a fixpoint of some policy,\
    \ the following policy iteration algorithm aims at finding such by solving optimization\
    \ problems. To initialize the algorithm, a term $-\\infty$ is added to each equation,\
    \ the initial policy $\\sigma_0$ is then $-\\infty$ for each equation, and the\
    \ initial value $\beta_0$ is the tuple $(-\\infty, \\dots, -\\infty)$. Then policies\
    \ are iterated:\n\n+   - a policy $\\sigma_{i+1}$ improving policy $\\sigma_i$,\
    \ i.e., that reaches (strictly) greater values evaluated at point $\beta_i$; if\
    \ not found, exit;\n- compute the greatest fixpoint $\beta_{i+1}$ of policy $\\\
    sigma_{i+1}$."
