  md: '# 148


    # CHAPTER 8


    ![](img/8a0fdace52018a374ebad28735935393_159_0.png)


    Figure 8.1. Automated credible cododing and verification framework for con-control
    systems.


    engineer can choose either to provide manually the properties and proofs as part
    of the specifications of the controller, or leave it to an automated analyzer
    that generates the proofs of stability and performance from the controller specifications
    as presented in chapter 7.


    The framework is split into two nominally independent self-contained halves, in
    which each corresponds to a side in the classic V-diagram of the software development-cycle.
    The left half of the credible cododing cycle automatically transforms the model
    of control system into a compilable code annotated with a collection of Hoare
    logic statements. Taken as a whole, the collection of logic statements, i.e.,
    the annotations along code, form a claim of proof that the code satisfies certain
    closed-loop stability and performance proofs of the control system.


    The right half of the framework performs an automatic deductive verification of
    the annotated code with respect to the control system properties expressed by
    the annotations. The deductive verification process, while assisted by the proof
    information provided within the generated annotations, is nonetheless independent
    of the credible cododing process.


    # 8.1.1 Languages and tools


    For the framework, the input language could be any graphical dataflow modeling
    language such as Simulink or Scicos [59] that is suited for controller design.
    The input language should have formal and precise semantics so the process for
    the generation of the code and the control semantics can be formally verified.'
