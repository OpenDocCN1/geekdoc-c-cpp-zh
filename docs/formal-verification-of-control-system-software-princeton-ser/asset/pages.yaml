    **Remark 9.18.** Characterizing such subset of $\mathbb{R}^p$ explicitly as a
    set of constraints is not easy. A classical (affine) zonotope is the image of
    a polyhedron (hypercube) by an affine map, hence it is a polyhedron and can be
    represented by a conjunction of affine inequalities. For quadratic vectors a representation
    in terms of conjunction of quadratic or at most polynomial inequalities is not
    proven to exist. This makes the concretization of a quadratic set difficult to
    compute precisely.


    To ease the latter interpretation of computed values, we rely on a naive projection
    to boxes: each quadratic form of the quadratic vector is concretized as an interval
    using $\gamma_Q$.


