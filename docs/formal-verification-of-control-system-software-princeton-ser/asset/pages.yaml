  md: '# 24 CHAPTER 2


    When one considers the underlying update function of the analyzed system—the transition
    relation of a dynamical system, or a function describing how each program point
    value is computed from its predecessors—it can be defined as an endomorphism of
    $\Sigma$. It maps a state to a new state. Let $f:\Sigma\to\Sigma$ be such a function.
    Note that this function does not need to be monotonic in any sense. In order to
    ease the notations, we will indifferently denote by f the isomorphism of $\Sigma$
    or its lift $f^{\uparrow}$ to sets of $\wp(\Sigma)$:


    ```

    $f^{\uparrow}(S)=\{f(s) \| s\in\Sigma$.

    ```


    Using $f$, we can derive the monotonic transfer function $F$ of the collecting
    semantics. A classical definition of $F$ is the endomorphism of $\wp(\Sigma)$
    which accumulates states starting from an initial set $Init\in\wp(\Sigma)$


    ```

    $$\wp(\Sigma) \to \wp(\Sigma)\nS \to Init \cup F(S).\quad (2.16)$

    ```


    When one applies recursively this function to the empty set, the infimum $\perp$
    of the lattice $(\wp(\Sigma),\subseteq,\cup,\cap,\\emptyset,\Sigma)$, we characterize
    the following sequence of sets of states:


    ```

    $S_0=F(\perp)\quad=Init\nS_1=F(Init)\quad=Init\cup F(Init)\nS_2=F(Init\cup F(Init))\quad=Init\cup
    F(Init)\cup F^2(Init)\n...

    ```


    **Theorem 2.5 (Tarski fixpoint theorem).** *Let $D$ be a complete lattice $(D,\subseteq,\cup,\cap,\\top,\\bot)$
    and $f:D\to\D$ be a monotonic function. Then the set of fixed points of $f$ in
    $D$ is also a complete lattice; it admits a least (lfp) and a greatest (gfp) fixpoints.*


    ```

    $lfp=\wp\{X\| F(X)\subseteq X}\ngfp=\cup\{X\| X\subseteq F(X)\}$

    ```


    Since $F$ is a monotonic operator of $(\wp(\Sigma),\subseteq,\cup,\cap,\Sigma)$,
    by Tarski fixpoint-theorem, a least fixpoint exists. It is defined as the smallest
    postfixpoint. A post-fixpoint is an element $X\in\wp(\Sigma)$ such that $F(X)\subseteq\Sigma$.


    Our set of reachable states, the collecting semantics, is *exactly* characterized
    by


    ```

    $$\mathcal{C}=lfp_{\wp(\Sigma)}F=\{F(X)\subseteq X\.\quad (2.17)$

    ```


    Furthermore, the set of fixpoints is fitted with a complete lattice structure:
    it is closed by join and meet; its infimum is the least fixpoint; and its supremum
    the greatest one.'
