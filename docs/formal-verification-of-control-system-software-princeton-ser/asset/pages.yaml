  md: '# FLOATING-POINT IN ANALYZED PROGRAMS


    # 9.1.2 Floating-point errors


    While computing in floats, rounding errors are introduced and accumulated.


    **Definition 9.1.** Let $F \subset \mathbb{R}$ be the set of floating-point values
    and $fl(e) \in F$ represents the floating-point evaluation of expression $e$ with
    any rounding mode and any order of evaluation.$1$


    **Example 9.2.** Depending on the order of evaluation, the value $fl(1+2+3)$ can
    be either $round(1+round(2+3))$ or $round(round(1+2)+3)$ with any valid rounding
    mode (toward $+\infty$ or to nearest for instance), leading to different final
    values.


    # 9.1.2.1 Value error


    Some simple values such as 0.1 are not exactly representable in floats since they
    cannot be expressed with a finite number of bits. Each use of a constant may therefore
    introduce basic errors. The error associated to the constant $c$ is bounded by
    the minimal distance to the nearest floating-point value, and therefore bounded
    by $1/2ulp(x) < 1/2|x|ulp(1)$


    # 9.1.2.2 Numerical operations: addition and multiplication


    Similarly, each numerical operation introduces errors. For example, since the
    addition of two floats may not be exactly representable in floats, the result
    is rounded to a floating-point value, depending on the rounding mode.


    Let $e^*(u,v)$ be such additive error. In case of $u$ and $v$ associated to their
    existing error $e^u$ and $e^v$, the computation of $(u+e^u)+(v+e^v)$ returns $(u+v)+(e^u+e^v+e^*(u,v))$.


    More practically it is possible to provide a bound for such error using eps:


    **Definition 9.3.** Let $eps = ulp(1)$ is the precision of the floating-point
    format $F$. We have for all $x, y \in \mathbb{F}$


    ```

    $$\delta \in \mathbb{R}, |\delta| \leq eps$\n$$fl(x+y) = (1+\delta)(x+y). \quad
    (9.2)$

    ```


    Concerning multiplication, similar errors are introduced. We denote by $e^*(u,v)$
    such multiplicative error. When considering input with existing errors $e^u$ and
    $e^v$, the computation of $(u+e^u)*(v+e^v)$ returns $(u*v)+(e^**v+e^**u+e^*(u,v))$.


    > $^1$Order of evaluation matters since floating-point addition is not associative.'
