  md: "# 4.1.2.2 Affine conditions: strict and weak affine convex constraints\n\n\
    Cells $\\{X^i\\}_{i\\in I}$ are convex polyhedra which can contain both strict\
    \ and weak inequalities.\n\n**Definition 4.4 (Cells as Convex Polyhedra).** Cells\
    \ can be represented by $n_i$ linear constraints, as a $n_i \times (d+m)$ matrix\
    \ $T^i$, and a vector $c^i \\in \\mathbb{R}^{n_i}$. We denote by $E_s^i$ the set\
    \ of indices which represent strict inequalities for the cell $X^i$, denote by\
    \ $T_s^i$ and $c_s^i$ the parts of $T^i$ and $c^i$ corresponding to strict inequalities,\
    \ and by $T_w^i$ and $c_w^i$ the one corresponding to weak inequalities. Finally,\
    \ we have the matrix representation given by Equation (4.3).\n\n```\n$X^i = \\\
    left\\{begin{pmatrix} x \\ u \\end{pmatrix} \\in \\mathbb{R}^{d+m} | \\begin{pmatrix}\
    \ T_s^i \\end{pmatrix} \\begin{pmatrix} x \\ u \\end{pmatrix} \\ll c_s^i, \\begin{pmatrix}\
    \ T_w^i \\end{pmatrix} \\begin{pmatrix} x \\ u \\end{pmatrix} \\le c_w^i \\right\\\
    }. \\quad (4.3)$\n```\n\nWe use the following notations: $y \\le z$ is a partial\
    \ order below as the piecewise lift of the total order over reals to vectors,\
    \ meaning that for all coordinates $l, y_l \\le z_l$. The relation $y \\ll z$\
    \ is the strict version, meaning that for all coordinates $l, y_l < z_l$.\n\n\
    # 4.1.2.3 Homogenization: encoding affine system as a linear one\n\nIn order to\
    \ simplify the following analyses, it is easier to consider a linear system rather\
    \ than an affine one. Therefore, we define a homogeneous flavor of the system\
    \ dynamics: instead of considering a system state in $\\mathbb{R}^d$ with inputs\
    \ in $\\mathbb{R}^m$, we manipulate system states in $\\mathbb{R}^{1+d+m}$. We\
    \ will need homogeneous versions of update functions and thus introduce the $(1+d+m)\
    \ \\times (1+d+m)$ matrices $F^i$ defined as:\n\n```\n$F^i = \\begin{pmatrix}\
    \ 1 & O_{1\\times d} & O_{1\\times m} \\ b^i & A^i & B^i \\ 0 & O_{m\\times d}\
    \ & Id_{m\\times m} \\end{pmatrix} \\quad (4.4)$\n```\n\nLet $p = card(I)$, the\
    \ global system can be defined as:"
