  md: '# 9.3.1 Interval-based analysis


    Classical interval-based abstract domains can be easily adapted to soundly over-approximate
    floating-point computation by rounding appropriately each operation:


    Injection of constant is expressed with the ulp(1) constant:


    ```

    $\alpha_M(r) = [fl(r) - |r| * ulp(1), fl(r) + |r| * ulp(1)]$

    ```


    Note that it is difficult to detect whether a provided value is exactly representable
    within a given floating-point representation. The proposed encoding may introduce
    spurious noise with the $|r|*ulp(1)$ terms. For example, the exact integer 1 will
    be encoded by $[r - ulp(1), r + ulp(1)]$. A more precise alternative could evaluate
    the obtained float and the other float with a much larger floating-point representation
    such as an MPFR float over 1000 bits. In case of similar value, the number is
    likely (but not proven) to be representable as a float.


    Each numerical operation can be adapted to deal with floating-point-rounding,
    rounding the operator to $-\infty$ for the lower bound and to $+\infty$ for the
    upper bound. We define by $\uparrow(x)$ the rounding of the real value $x$ towards
    $\in \{0, +\infty, -\infty\}$, denoting the rounding towards zero, $+\infty$,
    $-\infty$, and to the nearest value.


    Let us consider a binary operator $\diamond$ and the resulting $[r_1, r_2] = [x_1,
    y_1, y_2]$ computed with real semantics. A sound floating-point interval would
    then be $[\downarrow(r_1), \uparrow(r_2)]$.


    The rounding error in C can be easily changed but would not be efficient if it
    has to be changed for each operation. One usually chooses the rounding to $+\infty$
    and relies on a notation to manipulate lower bounds.


    For example, for addition we obtain


    ```

    $[x_1, x_2] + [y_1, y_2] = [\downarrow(x_1 - y_1), \uparrow(x_2 + y_2)].$ (9.5)

    ```


    Remember that unary negation only changes the sign but does not introduce induction.
    In the following we will rely both on $\uparrow(x)$ and $\uparrow_{-\infty}(x)$
    in the notations, but recall that $\uparrow_{-\infty}(x)$ is implemented as $-\uparrow_{\infty}(-x)$.


    While the previous method construct a sound approximation of floating-point computation,
    it does not enable the identification of the floating-point error. An alternative
    abstraction would rely rounding to the nearest, and represent a set of floating-point
    values by a pair of intervals $[f_1, f_2] + [e_1, e_2]$ where the first interval
    $[f_1, f_2]$ denotes the incorrect bounds obtained when manipulating floats as
    reals, and the second interval $[e_1, e_2]$ is used to carry on errors. In the
    following we denote such an element by the 4-tuple $(f_1, f_2, e_1, e_2)$. This
    new abstract domain is defined over the Cartesian product of two lattices


    **'
