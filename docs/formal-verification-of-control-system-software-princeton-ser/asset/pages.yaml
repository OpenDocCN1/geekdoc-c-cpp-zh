    Since $\lambda$ is positive, any $x$ satisfying the constraint $ax\leq b$ renders
    the term $\lambda(ax-b)$ negative. Trying to maximize the goal over $\lambda$,
    the optimum is obtained when $\lambda=0$. Fixing $x$, any $\lambda''>>\lambda$
    will generate a solution $(c,x) + \lambda''(ax-b) < (c,x) + \lambda(ax-b)$. However,
    any $x$ outside of the constraint will generate a positive term $\lambda(ax-b)$
    that will be made arbitrarily large when trying to maximize it over $\lambda\geq
    0$.


    Example 4.11. Figure 4.1 presents a simple Lagrangian relaxation in the linear
    case. The objective function is $-x$ when $y\leq 1-x$. The optimal solution is
    $(x,y)=(1,0)$. When maximizing over $\lambda$ in term $\lambda(y+x-1)$, one obtains
    0 when satisfying the constraint, and $+\infty$ otherwise.


    Similarly, a maximization problem can be reformulated as an inf sup using Lagrangian
    relaxation to integrate a constraint in the objective.'
