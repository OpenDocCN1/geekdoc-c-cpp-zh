    $$-F^{i\T} \begin{pmatrix} &q^{i\T} \ q^i & P^i \end{pmatrix} F^i + \begin{pmatrix}
    0 & q^{i\T} \ q^i & p^i \end{pmatrix} - E^{ij\T}U^{ij}E^{ij} \succeq 0. \quad
