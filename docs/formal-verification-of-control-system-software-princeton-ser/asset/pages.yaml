    (SOS) polynomial instead of a positive scalar. Let $\lambda \in \Sigma[x]$, then:


    ```

    $sup_{q(x)\leq 0, x\in \mathbb{R}^d} p(x) \leq sup_{x\in \mathbb{R}^d} p(x)-\lambda(x)\cdot
