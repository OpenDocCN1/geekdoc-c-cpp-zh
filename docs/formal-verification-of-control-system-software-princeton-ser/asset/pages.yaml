- pgno: 202
  md: '# Chapter Ten


    # Convex Optimization and Numerical Issues


    IN THIS CHAPTER we aim at providing the intuition behind convex optimization algorithms
    and address their effective use with floating-point implementation. The first
    section presents briefly the algorithms, assuming a real semantics, while Section
    10.2 presents our approaches to obtain sound results.


    # 10.1 CONVEX OPTIMIZATION ALGORITHMS


    As outlined in Section 4.2.1 convex conic programming is supported by different
    methods depending on the cone considered.

    The most known approach for linear constraints is supported by the simplex method
    by Dantzig. While having an exponential-time complexity with respect to the number
    of constraints, the simplex method performs well in general. Intuitively, starting
    from a vertex of the convex polytope, it follows the hyperplane minimizing the
    cost of the objective function to reach the best neighbor vertex. It can be seen
    as a discrete and combinatorial method: it enumerates faces of the polytope but
    each step could be solved exactly, for example, with rational arithmetics; and
    each intermediate step characterizes exactly a vertex of the polytope. The theoretically
    optimal solution is always on a vertex. Either the optimal solution is a unique
    vertex, or it corresponds to a constraint defining the feasible region. In that
    latter case, the optimal solution is defined as an infinite set of points of the
    hyperplan.

    If the simplex method behaves properly, one of the advantages of its use is the
    obtention of a feasible optimal solution.


    On the negative aspects, its complexity could diverge in some ill-shaped cases
    and it is not extensible to the larger set of linear problems over convex cones.

    Another method is the set of interior point methods, initially proposed by Karmarkar
    [12] and made popular by Nesterov and Nemirovski [14, 15, 24]. They can be characterized
    as path-following methods in which a sequence of local linear problems are solved,
    typically by Newton''s method.'
