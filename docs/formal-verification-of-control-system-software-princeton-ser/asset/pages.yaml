- pgno: 135
  md: '# RELATED WORKS


    # 6.5 Min-poly iterations


    As presented in the Formal Methods introduction in chapter 2, the classical framework
    for abstract interpretation is a fixpoint over-approximation through a Kleene
    fixpoint computation using widening to ensure convergence. Another mechanism,
    narrowing, enables us to recover precision after a postfixpoint has obtained through
    widening.


    In static analysis, the most recent approach of policy¹ iterations [52, 68, 69]
    attempts to solve exactly the fixpoint equation for a given abstract domain when
    specific conditions are satisfied using appropriate mathematical solvers. While
    this chapter addressed a larger set of programs-piecewise polynomial systems using
    SOS optimization, related (and previous) works were considering simpler classes
    of programs and of convex optimizations. For example, when both the abstract domain
    and the fixpoint equation use linear equations, then linear programming could
    be used to compute the exact solution without the need of widening and narrowing
    [68, 69]. Similarly, when the function and the abstract domain are most quadratic,
    semidefinite programming (SDP) was used [91, 93, 110]. In all cases, these analyses
    are performed on template-based abstracts, representing the abstract elements
    as sublevel sets; optimization techniques are used to build these templates.


    Regarding poly iterations’ related works, two different “schools” exist in the
    static analysis community. The “French school” [52, 68, 91, 110] offers to interpret
    min-polices, starting from an over-approximation of a fixpoint and decreasing
    the bounds until the first is reached. The “German school” [69, 70, 110], in contrast,
    operates on max-policies, starting from the bottom and increasing the bounds until
    a fixpoint is reached. While the first can be interrupted at any point leaving
    a over-approximation, the second approach requires waiting until the fixpoint
    is reached to provide its result. Note that a valid postfixpoint is required in
    the first case.


    To some extent, min-poly iterations [91] can be seen as a very efficient narrow-ing,
    since they perform descending iterations towards some fixpoint, working in a similar
    way to the Newton-Raphson method. Iterations are not guaranteed to reach a fixpoint
    but can be stopped at any time leaving an over-approximation thereof. Moreover,
    convergence is usually fast.


    Writing a system of equations $b=F(b)$ with $b=(b_i)_{i\in[1,n]}$ and $F:\mathbb{R}\to\mathbb{R}$
    ($n$ being the number of templates), a min-policy is defined as follows: $E$ is
    a min-policy for $F$ if for every $b\in\mathbb{R}$, $F(b)\le F(b)$ and there exist
    some $b_0\in\mathbb{R}$ such that $F(b_0)=F(b_0)$.


    The following theorem can then be used to compute the least fixpoint of $F$.


    > ¹The word strategy is also used in the literature for policy, with equivalent
    meaning.'
