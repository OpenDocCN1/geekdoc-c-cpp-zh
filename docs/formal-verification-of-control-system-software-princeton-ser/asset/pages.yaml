    # 2.2.1.2 SMT-based model-checking: propositional encoding and satisfiability


    SMT-based model-checking will perform similarly on this specific example. The
    idea is to map all constructs as predicates. One can, for example, rename variables
    to avoid multiple assignments to the same variable. This amounts to embedding
    the imperative program as functional dependencies between input and output. Let
    $[normif]fMC(x,y,r)$ be such function.


    The proof objectives become:


    ```

    $$(x=0 \wedge y=0) \wedge [normif]fMC(x,y,r) \wedge (r=0) \quad (2.4)\n[normif]fMC(x,y,r)
    \wedge (r \geq 0). \quad (2.5)$

    ```


    The difference with deductive method is not really sensible on this oversimplification
    The main one is that no order is specified on the model-checking approach, while
    weakest precondition rules do transform the predicate statement after statement.
    One can also notice that the exception of the functional representation of $[normif]fMC(x,y,r)$
    is identical in both properties (2.4) and (2.5). In deductive method, the form
    of the predicate representation of the code widely depends on the property analyzed.


    In both cases, the final validity of the propositional encoding of the property
    is delegated to external solvers such as SMT solvers.


    # 2.2.1.3 Abstract interpretation (of collecting semantics): over-approximating
    reachable states


    Abstract interpretation relies on a different algorithm. We will develop it in
    its general setting in the next section. In contrast to previous methods which
    are able to represent complex properties through logical predicates but rely on
    external solvers to determine the satisfiability of these formulas, abstract interpretation
    intends to restrict a prior form of the properties manipulated, using constructive
    means to analyze them.


    These constrained properties are called abstract domains, and since we are focused
    on the abstraction of the collecting semantics, they represent set of states.
    One can see an abstract domain $D$ as a subset of set of states: $D \subseteq
    \wp(\Sigma)$.'
