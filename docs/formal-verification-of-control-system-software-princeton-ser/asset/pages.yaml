    Figure 3.1. Current development process.


    # LINEARIZATION-TRANSFER FUNCTIONS


    Controlling nonlinear dynamics is still an active area of research. In practice,
    in the conservative aerospace industry, most basic controllers are still defined
    with old-school linear methods. For these methods the dynamics has to be linear.
    Since linearized systems are not fully representative far away from the linearization
    point, multiple of such points are defined, leading to multiple linearized versions
    of the dynamics. This can be done using Taylor expansion, for example. The general
    ODE can then be expressed, locally, as a linear differential equation (LDE) expressed
    over single input and output signals. The dynamics described by this LDE can be
    interpreted as a function mapping this input signal $x(t)$ to the output $y(t)$.
    In this continuous setting, one defines this function as the linear mapping relating
    the Laplace transforms of $x(t)$ and $y(t)$. The transfer function is expressed
    to map those two Laplace transforms.


    Control design then provides tools to build a feedback controller: another transfer
    function which, associated to the initial transfer function, provides the expected
    behavior. Various techniques exist to synthesize such a controller: proportional,
    lead-lag, proportional-integral-derivative (PID), etc.


    # ANALYSIS


    The produced controller can be evaluated with respect to control-level properties.
    A controller drives the plant in the desired state by minimizing the error between
    the controller command and the current plant state. This feedback'
