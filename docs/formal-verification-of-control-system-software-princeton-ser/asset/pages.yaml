    # 2.3 DEDUCTIVE METHODS


    Weakest precondition methods are typically designed for imperative languages.
    A realistic application will reason on the program as outlined in Section 2.2.1.1
    but should also address the following items:


    # 2.3.1 Loops and recursion in programs


    While predicate transformation may seem natural in the previous example, it is
    less obvious in presence of loops in the control flow graph. A sufficient rule
    to validate annotations, as defined by Floyd or Hoare, could be:


    ```

    $\\vdash\{A\wedge b\}c\{A\}\n\vdash\{A\}$ while $b$ do $c\{A\wedge \neg b\}$.$

    ```


    But it is not compatible with the automatic transformation of predicates as performed
    in weakest precondition computation. Another way to address the issue is to unroll
    the loop:


    ```

    while $b$ do $c \equiv b$ if $c$; while $b$ do $c$ else skip.

    ```


    Then


    ```

    $wp(while $b$ do $c, B)\n$\triangleq $wp(if $b$ do $c$; while $b$ do $c$ else
    skip, $B)\n$\triangleq $b \implies wp(c, wp(while $b$ do $c, B)) \wedge \neg b
    \implies B$.$

    ```


    Let us denote by $W = wp(while $b$ do $c, B)$. We can use the loop unfolding to
    characterize recursively $W$:'
