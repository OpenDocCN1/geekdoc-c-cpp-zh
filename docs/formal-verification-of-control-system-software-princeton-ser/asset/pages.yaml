    # 5.7 RELATED WORKS


    Automated nonlinear analyses are not very common in formal verification. A line
    of works [44, 50] rely on iterative computations using Gröbner bases to synthesize
    polynomial equality invariants. Similar to Karr’s domain representing affine relationships
    among variables [7], these domains extract polynomial relationships between variables.
    More recent work [131] relies on a kind of weakest precondition computation to
    synthesize these polynomial equalities. All these works cannot, in the current
    state, export semialgebraic sets not capture the stability of a linear controller.


    Regarding quadratic invariants, i.e., ellipsoids, they are not fitted with a lattice
    structure since there is no unique smallest ellipsoids containing a set of ellipsoids.
    Unrolling techniques such as [47, 56, 73, 130] enable the precise analysis of
    linear systems by solving mathematically these dynamical systems. While more precise
    than the approach we proposed, these techniques can hardly'
