- pgno: 58
  md: "# DEFINITIONS—BACKGROUND\n\n# 4.1.2 Switched linear systems: constrained piecewise\
    \ affine discrete-time systems\n\nMost systems are not purely linear. The programs\
    \ or systems we consider are composed of a single loop with possibly a complicated\
    \ switch-case type loop body. Our switch-case loop body is supposed to be written\
    \ as a nested sequence of it statements, or as a switch:\n\n```\nx = i;\nwhile\
    \ true {\n  in = read();\n  c1 -> x = f1(x, in);\n  c2 -> x = f2(x, in);\n  c3\
    \ -> x = f3(x, in);\n  x -> x = f4(x, in);\n}\n```\n\nMoreover, we suppose that\
    \ the analyzed programs are written in affine arithmetic, both the switch conditions\
    \ $c_i$ and the associated update functions $f_i$. Consequently, the programs\
    \ analyzed here can be interpreted as constrained affine discrete-time systems.\n\
    \n# 4.1.2.1 Polyhedral partitioning of $\\Sigma$\n\nThe term piecewise affine\
    \ means that there exists a polyhedral partition $\\{X^i, i \\in \\mathbb{I}\\\
    }$ of the state-input space $\\Sigma \\subseteq \\mathbb{R}^{d+m}$ such that for\
    \ all $i \\in \\mathbb{I}$, the dynamic of the system is affine and represented\
    \ by the following relation for all $k \\in \\mathbb{N}$:\n\n$$(x_k, u_k) \\in\
    \ X^i, x_{k+1} = A^i x_k + B^i u_k + b^i, k \\in \\mathbb{N}$$\n\nwhere $A^i \\\
    in \\mathbb{R}^{d \times d}, B^i \\in \\mathbb{R}^{d \times m}$ and $b^i \\in\
    \ \\mathbb{R}^d$. As in the linear case, the variable $x \\in \\mathbb{R}^d$ refers\
    \ to the state variable and $u \\in \\mathbb{R}^m$ refers to some input variable.\n\
    \nWe define a partition of the state-input space as a family of nonempty sets\
    \ $X^i$ such that:\n\n$$U^i = \\Sigma, i, j \\in \\mathbb{I}, i \\neq j, X^i \\\
    cap X^j = \\emptyset$.$$\n\nIn the current setting, since $X^i$ are convex polyhedra,\
    \ we characterize polyhedral partitions of the state-input space. From now on,\
    \ we call $X^i$ cells."
  merge: -1
