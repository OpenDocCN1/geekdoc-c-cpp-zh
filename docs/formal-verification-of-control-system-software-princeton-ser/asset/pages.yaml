  md: '# 2.5.2 Effective computation: Kleene iterations widening


    When the abstract domain is fitted with a complete lattice structure,3 this fixpoint
    can be accurately computed by Kleene iterations:


    ```

    $$\mathcal{C} = \lim_{n\to\infty} F^n(\perp). \quad \(2.26)$

    ```


    In case of infinite ascending chains of iterations, one relies on so-called widening
    operator to ensure convergence in a finite number of iterations. This operator
    acts as a rough join operator but has better convergence properties. This is however
    pessimistic since it introduces numerous spurious states in the abstract representation.


    **Remark 2.6 (Relative performance).** In general, SMT-based methods such as MC
    and DM perform well on disjunctive or integer-based properties. SMT solvers are
    based on a SAT core and a set of solvers for axiomatized theories. These solvers
    perform generally well on linear systems and linear properties but have issues
    with polynomial systems.


    AI typically performs better on the synthesis of numerical invariants disjunctions
    are propagated within the abstract representation, using the abstract disjunction
    $\sqcup$. Abstractions exist that postpone the interpretation of these disjunctions
    as partitioned analyses [55, 79], disjunctive completion of domains [9, 19], or
    delayed join [49] to regain precision but cost too much to be used in a systematic
    manner.


    To summarize, for the most common setting, the effective use of abstract interpretation
    is the following:


    +   1. Express (collecting) semantics as a fixpoint of a monotonic function $F$
    over a lattice of properties. In our case, properties are sets of states.

    2. Exhibit an abstract domain for set of sets, defining abstract and concretization
    functions, lattice operations as join, and a sound abstract counterpart $F^*$
    of $F$.

    3. Abstract initial states and compute with Kleene iterations the least fixpoint
    in the abstract.

    4. In case of convergence issue, rely on widening to converge to a bigger fixpoint
    in the abstract.

    5. The concretization of this abstract fixpoint is a sound over-approximation
    of the concrete one.


    In practice over-approximation is caused:


    > 3In theory, it is only required to admit upper bound for ascending chains. $F^*$
    should join complete on these chains, i.e., upper continuous: for all chain $w_0,
    w_1, \dots, F^*(\sqcup_i w_i) = \sqcup_i F^*(w_i)$.'
