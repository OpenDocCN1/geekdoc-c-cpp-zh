    \ to use the strategy AffineEllipsoid to prove the correctness of the local contract\
    \ considered.\n\n# 8.1.3.3 Closed-loop semantics: expressing plant dynamics in\
    \ code\n\nIn order to express properties pertaining to the closed-loop behavior\
