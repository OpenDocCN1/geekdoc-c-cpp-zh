  md: '# Chapter Seven


    # System-level Properties as Numerical Invariants


    ALL NUMERICAL TOOLS presented in previous chapters were focused on the precise
    over-approximation of reachable states. In terms of properties addressed, we could
    argue about simple properties: e.g., the state space is bounded, the reachable
    states avoid a bad region, etc.


    However, we believe that it is important to be able to express higher level properties
    than just bounding reachable states.


    The idea that drive our invariants and template synthesis was this notion of Lyapunov
    functions and of Lyapunov stability. Assuming a control level property, it would
    be extremely interesting to be able to express this property over the code or
    model artifact.


    A main limitation for the study of these control properties is the need for the
    plant description, which is generally not available when considering code artifact.
    In the following we assume the plant semantics is provided in a discrete fashion
    and therefore amenable to code level description as presented in chapter 3.


    We summarize an attempt to express classical notions of control theory such as
    stability or robustness using the previously presented invariant-based tools.


    # NOTATIONS


    Let us first recall the notations of chapter 3, we focus on linear systems, i.e.,
    a linear plant with a linear controller feedback. Both the controller and the
    plant dynamics are expressed as discrete linear systems. Let ($A^c, B^c, C^c,
    D^c$) and ($A^p, B^p, C^p$) the matrices defining the controller and plant dynamics,
    respectively; $e$ denotes the input of the controller, often referred to as the
    error, $i$ the distance to the reference in; $u$ denotes both the output of the
    controller and the input of the plant, as the effect of actuator commands; $y$
    denotes the measure of the plant state, i.e., the feedback, e.g., as obtained
    by sensors:


    ```

    $$\begin{cases} x_{k+1}^c &= A^c x_k^c + B^c e_k \ u_k &= C^c x_k^c + D^c e_k
    \ x_{k+1}^p &= A^p x_k^p + B^p u_k \ y_k &= C^p x_k^p \end{cases} \quad (7.1)$

    ```'
