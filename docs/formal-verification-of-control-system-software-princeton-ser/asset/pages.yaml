    As an unsigned integer, $[exp_b]^{ui}$ ranges in $[0;2^k-1]$. Its bounds 0 and
    $2^k-1$ denote special values: 0 is used to manipulate floats near zero, we speak
    about denormalized numbers, while $2^k-1$ is used for infinities and not-number
    (NaN) values. For all other values of $exp$, the exponent is defined as $[exp_b]^{ui}-2^{k-1}+1$;
    we speak about normalized numbers.


    Let us focus on these normalized numbers. In this case, the exponent lives within
    $[-2^{k-1}, 2^{k-1}-1]$. In IEEE 754 normalized numbers are implicitly prefixed
    with a leading bit. These $n+1$ bits characterize the word $[man_b]^{ui} \in [2^n,
    2^{n+1}-1]$. Since the value is interpreted as a significand with a single leading
    bit (at the left of the number), it characterizes the $[2^n, 2^{n+1}-1]$ as-a.


    Then, any normalized number can be written as


    > $(-1)*[man_b]^{ui}2^{[exp_b]^{ui}-2^{k-1}-n-1$


    The biggest representable value is $(2^{n+1}-1)*2^{2^{(k-1)}-2^{k-1}-1}=(1-2^{-n})*2^{2}$.
    For 32 bits simple precision float, $k=8$ and $n=24$, this gives the maximum value
