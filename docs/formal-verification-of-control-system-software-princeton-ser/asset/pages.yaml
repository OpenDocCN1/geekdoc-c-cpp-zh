    # 5.4.3.1 Characterizing the graph of possible switches-enumerating the paths


    As a first step, we compute the set of possible paths of given length up to k.
    First, a graph $G=(I, Init, Switches)$ denoting possible switches between cells
    $i\in\mathcal{I}$ is computed using the approach presented in Sec. 5.3.2.2.


    $Init={i\in\mathcal{I}\cap X^0\neq\emptyset\}$ denotes the subset of cells $i\in\mathcal{I}$
    that verify the initial conditions. This characterizes a set of polyhedral constraints
    for which vacuity is computed using the method presented in Sec. 5.3.2.1.


    We enumerate the possible paths in the graph using classical graph algorithms.
    Let $Paths^k$ be such a set of paths of length up to k.


    Example 5.14. The Figure 5.10 presents the possible transitions as over-approximated
    by the method presented in Sec. 5.3.2.2. Depending on the target length the following
    paths are generated:


    length

    1 1,2,3,4

    2 11, 12, 13, 14, 22, 24, 31, 33, 34, 41, 42, 43, 44

    3 111, 112, 113, 114, 122, 124, 131, 133, 134, 141, 142, 143, 144, 222,

    224, 241, 242, 243, 244, 311, 312, 313, 314, 331, 333, 334, 341, 342,

    343, 344, 411, 412, 413, 422, 424, 431, 433, 434, 441, 442, 443, 444

    4 ...


    # 5.4.3.2 Integrating initial conditions


    The initial condition only applies for the quadratic sublevel associated with
    initial cells. Let $Init$ be the set of cells admitting initial elements, as defined
    in the graph construction.


    By construction of the set of paths $Paths^k$, it contains the single letter words
    denoting initial cells $\{i\in\Init\}\subseteq Paths^k$. The set of initial constraints
    only applies for the one word satisfying the initial condition:


    ```

    $(x, u) \in X^0 \cap X^i \implies (x, u)P^i(x, u)^top+2(x, u)q^i \le \alpha$.

    ```


    We can rely on the stronger encoding as a semidefinite constraint, using the quadratization
    of the condition $X^0 \cap X^i$ as the matrix $E^i$,


    ```

    $-\left(\frac{\alpha}{q^i} \frac{q^i}{p^i}\right)-E^{0\top}Z^iE^iE^{0} \ge 0$.

    ```


    Note that, independently of the value of $k$, a system with $n$ cells is parametrized
    by at most $Z^i$ variables.'
