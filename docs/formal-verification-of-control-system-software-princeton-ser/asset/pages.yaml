  md: '# 5.1.4 Synthesis of templates using convex optimization


    In the early definition of Lyapunov functions, with quadratic properties and linear-ear
    systems, the conditions defining the Lyapunov function P were characterized as
    a Linear Matrix Inequality (LMI):


    > $$\begin{aligned} &P \succeq 0 \ A^T P A - P \preceq 0. \end{aligned}$ (5.8)$


    With the development of interior point algorithms [24] and convex optimization
    [46], the numerical resolution of these optimization problems becomes feasible
    in reasonable time.


    The approach is to guide the search for inductive invariants as Lyapunov-like
    constraints expressed as convex optimization problems. As a norm of the state,
    it can be used as a template abstraction and denote a relevant abstraction of
    reachable states. Once a Lyapunov function is synthesized, on the encoding of
    the constraints, the results of the optimization step could either be a bound
    template, e.g., $t(x) \leq 1$, or just a relevant unbounded template $t$.


    In that second case, the template $t$ has to be bounded by other means; for example,
    using classical Kleene iterations, or even using randomly large values. Thanks
    to the inductiveness property of the template with respect to the system semantics,
    any bound $\lambda$ such that


    > $t(f(x)) \leq \lambda$


    characterizes a sound fixpoint: $\{x|t(x) \leq \lambda\}$.


    # 5.2 QUADRATIC INVARIANTS


    # 5.2.1 Linear systems


    As mentioned above, in the simplest case of a linear system the conditions over
    a quadratic Lyapunov function P are given by the LMI of Equation (5.5).


    > $$\begin{aligned} &P \in R^{n \times n}, \text{ s.t.} \ &P \succeq 0 \ A^T P
    A - P \preceq 0. \end{aligned}$ (5.9)$


    One can directly solve this LMI and obtain a valid quadratic template, relevant
    for the considered system. However, while inductive over system semantics, a sublevel
    set property characterized by such Lyapunov function P may not be the most precise:


    > $$\mathcal{C} \subseteq \{x \in R^d \mid x^T P x \leq \lambda\}$'
