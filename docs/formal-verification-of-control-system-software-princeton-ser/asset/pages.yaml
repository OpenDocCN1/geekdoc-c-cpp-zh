  md: '# INVARIANTS AS SEMIALGEBRAIC SETS


    +   - Decreasing along trajectories


    ```

    $V x \in \mathbb{R}^d, V \circ f(x) - V(x) \le 0. \quad (5.7)$

    ```


    Depending on the strictness of the $\le$ operator, the Lyapunov function guarantees
    asymptotic stability and exponential convergence, or just boundedness of states.


    It is shown, for example in [80], that exhibiting such a function proves the Lyapunov
    stability of the system, meaning that its state variables will remain bounded
    through time. Equation (5.7) expresses that the function $k \mapsto V(x_k)$ decreases,
    which, combined with (5.6), shows that the state variables remain in the bounded
    sublevel set $\{x \in \mathbb{R}^d | V(x) \le V(x_0)\}$ at all instances $k \in
    N$.


    # 5.1.3 Lyapunov functions as problem specific abstractions: semialgebraic template
    abstractions


    We saw that Lyapunov functions characterize inductive sublevel sets for the considered
    discrete dynamical system semantics. Therefore, instead of approximating reachable
    states in the abstract interpretation framework using predefined numerical abstractions,
    such as intervals, octagons, or convex polyhedra, we rather prefer to rely on
    the Lyapunov function as the main mean of abstraction. This is a template abstraction
    [90, 99].


    A template is a real-valued function $t : \Sigma \to \mathbb{R}$.


    **Example 5.1.** *A template is then a function over those state variables. For
    example, it can characterize the norm 2 of a state:*


    ```

    $t_1(s) = ||s||_2 = \sqrt{(\sum_{v \in v} v^2)}$

    ```


    or just focus on the value of a single variable $x \in V$


    ```

    $t_2(s) = s(x) \quad \quad \quad \quad \text{when } s \text{ is a map or}$$\n$t_2(s)
    = x_i \quad \quad \quad \quad \quad \text{when } s \text{ is a vector.}$

    ```


    For a given template $t$, a sublevel abstraction can be defined by a given levelset
    $\lambda:


    ```

    $\{s | t(s) \le \lambda\}$

    ```


    In the case of multiple templates $t_1, t_2, \dots, t_n$ and associated bounds
    $\lambda_1, \lambda_2, \dots, \lambda_n$, the interpretation of this abstract
    representation is the intersection of sublevel sets. In the case of polynomial
    template functions $t_i$, this is a basic semialgebraic set.


    ```

    $\{s | t_i(s) \le \lambda_i\}$

    ```'
