  md: '# 5.6.1 Primal: maximizing measure support


    The initial expression of the problem relies on the characterization of the indicator
    function $1_{\mathcal{C}}$ of the set $\mathcal{C}$.


    ```

    $1_A(x) := \begin{cases} 1 & \text{if } x \in A, \ 0 & \text{otherwise}. \end{cases}$

    ```


    Let us introduce some definitions.


    **Definition 5.24 (Borel Measures Vector Space).** Given a compact set $A \subset
    \mathbb{R}^n$, let us denote by $\mathcal{M}(A)$ the vector space of finite signed
    Borel measures supported on $A$, namely real-valued functions from the Borel sigma
    algebra $\mathcal{B}(A)$.


    **Definition 5.25 (Measure Support).** The support of a measure $\mu \in \mathcal{M}(A)$
    is defined as the set of all points $x$ such that for each open neighborhood $\mathcal{B}$
    of $x$, one has $\mu(\mathcal{B}) > 0$. Note that this set is closed by construction.


    **Definition 5.26 (Lebesgue Measure on a Subset).** The restriction of the Lebesgue
    measure on a subset $A \subseteq X$ is $\lambda_A(dx):=1_A(dx)$, where $1_A:X\{0,1\}$
    stands for the indicator function on $A$.


    **Definition 5.27 (Moments of Lebesgue Measure).** The moments of the Lebesgue
    measure on $X$ are denoted by


    ```

