  md: '# INVARIANTS AS SEMIALGEBRAIC SETS


    Now, we are interested in the second and third inclusions at Equation (5.53).
    that is, the sublevel property satisfaction. The condition $P \subseteq P_{\kappa,w}
    \subseteq P_{\kappa,\alpha}$ can be formulated as follows:


    ```

    $$\kappa(x) \leq w \leq \alpha, \quad \forall x \in P.\\quad (5.54)$

    ```


    Recall that we have supposed that $P$ is written as $\{x \in \mathbb{R}^d | p(x)
    \leq 0\}$ where $p \in \mathbb{R}[x]$. Finally, we provide sufficient conditions
    to satisfy both (5.52) and (5.54). Consider the following optimization problem:


    ```

    $$\inf_{p \in \mathbb{R}[x], w \in \mathbb{R}} \quad w, \text{ s.t.}\\\

    p(x) \leq 0, \quad \forall x \in X^{Init},\\\n\forall i \in I, p(T^i(x)) \leq
    p(x), \quad \forall x \in X^i,\\\n\kappa(x) \leq w + p(x), \quad \forall x \in
    \mathbb{R}^d.\\quad (5.55)$

    ```


    Remark that $\alpha$ is not present in Problem (5.55). Indeed, since we minimize
    $w$, either there exists a feasible $w$ such that $w \leq \alpha$ and we can exploit
    this solution or such $w$ is not available and we cannot conclude. However, from
    Problem (5.55), we can extract $(p, w)$ and in the case where the optimal bound
    $w$ is greater than $\alpha$, we could use this solution in conjunction with other
    abstractions as presented in the following chapter.


    **Lemma 5.17.** Let $(p, w)$ be any feasible solution of Problem (5.55) with $w
    \leq \alpha$ or $w < \alpha = \infty$. Then, $(p, w)$ satisfies both (5.52) and
    (5.54) with $P :==\{x \in \mathbb{R}^d | p(x) \leq 0\}$. Finally, $P$ and $P_{\kappa,w}$
    satisfy Equation (5.53).


    In practice, we use sum-of-squares programming to solve a relaxed version of Problem
    (5.55).


    # 5.5.3 SOS relaxed semantics


    One way to strengthen the three nonnegativity constraints of Problem (5.55) is
    to take $\lambda^i=1$, for all $i \in I, \nu=w$, then to consider the *hierarchy*
    of SOS programs, parametrized by the integer $m$ representing half of the degree
    of $p$. All positivity constraints are expressed using sum-of-squares polynomials
    of fixed degrees. As for the $k$-induction proof, one can increase the degree
    of such polynomials to consider more general problems. Equation (5.56) details
    the SOS problem submitted to the solver.


    **Proposition 5.18.** For a given $m \in \mathbb{N}$, let $(p_m, w_m)$ be any
    feasible solution of Problem (5.56). Then, $(p_m, w_m)$ is also a feasible solution
    of Problem (5.55). Moreover, if $w_m \leq \alpha$ then both $p_m :==\{x \in \mathbb{R}^d
    | p_m(x) \leq 0\}$ and $P_{\\kappa,w_m}$ satisfy Equation (5.53).'
