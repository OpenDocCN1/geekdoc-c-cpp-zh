    \ relation $T \\subseteq \\Sigma \times \\Sigma$. A safety property $Prop \\subseteq\
    \ \\Sigma$ is said to be $k$-inductive with respect to the transition system iff\n\
    \n+   * for all system traces of length less than $k$, all reachable states verify\
    \ Prop\n$$\nforall k \\in \\mathbb{N}, \\forall x_0, \\dots, x_j \\in \\Sigma,\\\
    nnx_0 \\in I \\wedge \\bigwedge_{i \\in[0,j-1]} (x_i, x_{i+1}) \\in T\\n\\implies\
