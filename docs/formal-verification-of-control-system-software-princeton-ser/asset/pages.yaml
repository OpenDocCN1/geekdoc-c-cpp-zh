- pgno: 142
  md: '# SYSTEM PROPERTIES AS INVARIANTS


    obtained by taking the Fourier or Laplace transform of the impulse response of
    a system. This so-called frequency domain approach is commonly used for linear
    systems, along with graphical tools such as Bode plots or Nyquist diagrams. An
    alternative approach, temporal domain analysis, is performed on the state-space
    representation, and is based on Lyapunov functions. As mentioned in the previous
    parts, Lyapunov functions express a notion of positive energy that decreases along
    the trajectories of the system and captures its asymptotic stability. For linear
    systems, such functions are usually defined using a positive definite matrix $P
    \ge 0$ such that:


    ```

    $A^T P A - P < 0,$$

    ```


    where $A$ is a state matrix of the system.


    # 7.1.1 Lyapunov function computation


    Using the tools proposed in chapter 5 we can compute inductive numerical invariants,
    such as positive definite matrices $P^o$ and $P^c$ denoting Lyapunov functions
    for these open- and closed-loop systems.


    For the open-loop system, the Lyapunov function $P^o$ is used to express a BIBO
    property to bound reachable states $x^o$ assuming a bounded input e:


    ```

    $||e||_{\infty} \le 1 \Rightarrow x^{ct} P^o x^c \le 1.$

    ```


    For the closed-loop system, integrating the feedback of the plant in the controller
    input, a similar property is expressed. For a bounded target reference $in$, the
    closed-loop system will admit only bounded reachable states x:


    ```

    $||in||_{\infty} \le 1 \Rightarrow x^{lt} P^c x \le 1.$

    ```


    These boundedness properties may seem weak to control engineers compared to the
    asymptotic properties expressed by the Lyapunov functions. However, they are of
    extreme importance to guarantee that the implementation will behave, without diverging
    and causing runtime errors, e.g., producing numerical overflows. Once provided
    with a quadratic bound on reachable states using the Lyapunov function characterizing
    the stability of the controller, static analyses of the discrete model and the
    code can rely on policy iterations, chap. 6, to infer bounds on $x^o$ and $x^c$.


    # 7.1.2 Stability of closed-loop system without saturation


    Recall that the closed-loop system example presented in chapter 3 was presented
    in two flavors. The first one considered a simple feedback between the linear
    controller and the linear plant. This global linear system is exactly described
    by Figure. 7.1.'
