    # 4.2 ELEMENTS OF (APPLIED) CONVEX OPTIMIZATION


    This section intends to provide elements to the computer scientist to understand
    principles of convex optimization and the typical approaches to manipulate such
    optimization problems. We refer the interested reader to the excellent book *Convex
    Optimization* by Boyd and Vandenberghe [46] for a more thorough introduction.
    Other valuable references include *Numerical Optimization* by Nocedal and Wright
    [63], and *Elements d''optimisation differentiable* by Gilbert [120].


    In the following we focus on optimization problems of the form


    ```

    $\begin{aligned} \min &&& f_0(x) \ \text{s.t.} &&& f_i(x) \leq b_i \quad i \in
    [1, m]. \end{aligned} (4.8)$

    ```


    Here $x \in \mathbb{R}^n$ is the optimization variable. $f_0 \in \mathbb{R}^n
    \to \mathbb{R}$ denotes the objective function and the functions $f_i \in \mathbb{R}^n
    \to \mathbb{R}$, with associated bound $b_i$, the constraints.


    A solution $x$ of (4.8) is feasible if it satisfies all constraints. It is optimal
    if it is the smallest of all feasible ones.


    An optimization algorithm is a numerical tool that computes or approximates feasible
    optimal solutions.


    # 4.2.1 Convex conic optimization


    In the case where only part of the problem is the objective function, i.e., no
    constraint is provided, then classical methods such as gradient, conjugate gradient,
    or Newton methods will iteratively approximate the solution. These algorithms
    compute a sequence of points of $\mathbb{R}^n$ by updating the previous point
    with a local descent direction $d_k$ obtained by considering the derivative of
    the objective function (aka the gradient).


    $x_{k+1} = x_k + \alpha_k d_k$.


    Here $\alpha_k$ denotes the step size. Both $\alpha_k$ and $d_k$ depend on the
    current point $x_k$ and typically rely on $f_0''(x_k)$ (aka $\nabla f(x_k)$).
    Kantorovich''s theorem characterizes conditions imposed on $f_0$ to guarantee
    the existence of a unique solution for Newton''s method. These constraints amount
    to provide a bound on it the variation of the function, its Lipschitz constant.'
