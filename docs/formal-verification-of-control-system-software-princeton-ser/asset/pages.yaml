    # 7.2.3 Vector margin computation


    Uncertainties in the feedback loop can introduce simultaneous phase lags and increases
    in the feedback gain. In those cases, interpreting the phase and gain margins
    could produce an overly optimistic view of the robustness of the feedback system.
    For example, a small phase lag combined with a small gain change would destabilize
    the system in Fig. 7.7, while a pure increase in gain would never do so and it
    would take a large phase lag to destabilize the system. To get a better indication
    of the robustness of the system, we look at the distance between $-1+0j$ and the
    Nyquist plot induced by the complex modulus, i.e., $\min_{z} |L(z)+1|$. In the
    following, we call this robustness measure the vector margin. By plotting a circle
    of radius equal to the vector margin centered at the $-1+0j$ point, we get the
    effective envelope in Fig. 7.7, which for this example, is far more pessimistic
    than the robustness envelope formed by the classical measures. There are several
    advantages to using the vector margin.


    +   1. It is a more faithful measure of the robustness.

    2. It can be translated into the time-domain and then expressed on the code as
    a quadratic invariant.

    3. It readily extends to MIMO systems [33, 42].


    The vector margin can be computed by finding the inverse of the maximum modulus
    of the sensitivity function $S(z) := \frac{1}{1+L(z)}$ over the Nyquist contour
    $\Gamma$.'
