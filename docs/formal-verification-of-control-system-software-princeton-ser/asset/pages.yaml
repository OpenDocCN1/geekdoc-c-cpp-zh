    CHAPTER 7


    ![](img/8a0fdace52018a374ebad28735935393_151_0.png)


    The standard metric used in the industry to gauge the robustness of linear ISO¹
    controllers consists of phase and gain margins. While these notions are now overseen
    by more modern techniques such as IQC [25] or $\mu$-analysis [11], they are still
    widely used in the industry as measures to be guaranteed for a controlled system.


    However, these margins are never analyzed or computed on the code artifact, taking
    into account the real implementation using floating-point arithmetic.


    We propose to rely on the notion of vector margins to characterize robustness
    and characterize it as a numerical invariant property over system states, and
    therefore amenable to code level analysis.


    Let us first give an informal overview of classical frequency-based robustness
    analysis, using Nyquist plots, then present our use of vector margins to bound
    robustness.


    # 7.2.1 Nyquist plot and stability criterion


    The Nyquist plot is the frequency response (magnitude and phase) of the loop transfer
    function to a sinusoidal input displayed using a polar coordinate system. To construct
    the Nyquist plot, the loop transfer function $L(z)$ is evaluated along the Nyquist
    contour $\Gamma$. The Nyquist contour, shown in Fig. 7.6, encircles the region
    outside of the unit disk (OUD) centered at the origin. An example Nyquist plot
    for the loop transfer function


    > Single Input Single Output."'
