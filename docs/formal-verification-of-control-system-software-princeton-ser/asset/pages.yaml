    But since $f(x_{fp})=x_{fp}$, we have


    $v(f(x_{fp}))-v(x_{fp})=v(x_{fp})-v(x_{fp})=0$


    and this problem admits an empty interior since $v$ should be exactly equal to
    zero at $x_{fp}$. In this case the previous technique over-approximating the floating
    point semantics semantics of $f$ will impose an even more difficult constraint:


    $v(f(x_{fp}))-v(x_{fp})-err_f(x_{fp})$\nv(x_{fp})-v(x_{fp})-err_f(x_{fp})$\n-err_f(x_{fp})=0$


    with $err_f(x_{fp}) > 0$.


    In the linear case, when considering a stable system, there is a singlepoint which
    is often zero. A first solution is to impose the Lyapunov function $v$ to admit
    a zero coefficient for the monomial 1, allowing the error to vanish in zero.


    For the more general setting, a solution is to encode inductivity differently
    as a convex constraint: instead of $v \circ f-v \leq 0$ one can rely on $a \circ
    v-v \leq 0$ with $\alpha > 1$. This would correspond to a relative padding, applying
    a growth factor to the semialgebraic set defined by $v \leq 0$.


    Considering, in addition, the floating-point semantics of the analyzed program,
    our inductiveness constraint in the polynomial case becomes:


    $p \circ \alpha \circ T^i \sigma^i + \sum_{j=1}^{n_i} \mu_j^i r_j^i-err_{poT^i}
    \geq 0$


    where $err_{poT^i}$ is an upper bound on the floating-point errors obtained when
    evaluating $p \circ T^i$.'
