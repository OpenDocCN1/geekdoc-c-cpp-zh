    # 5.3.3 Local invariants with coupling conditions


    As in the linear case, we are relying on SDP solver and LMI encoding; the unknowns
    of the optimization problems have to be at most quadratic.


    The Lyapunov function $V$ is piecewise defined, relying on the partition of cells
    provided by the analyzed affine system. This $V$ is defined as:


    ```

    $V(x,u) = V^\top(x,u), \text{ if } \begin{pmatrix} x \ u \end{pmatrix} \in X^i$\n\n=
    \begin{pmatrix} x \ u \end{pmatrix}^\top P^i \begin{pmatrix} x \ u \end{pmatrix}
    + 2q^{i\top}\begin{pmatrix} x \ u \end{pmatrix}, \text{ if } \begin{pmatrix} x
    \ u \end{pmatrix} \in X^i.$

    ```


    The function $V^i$ is thus a local function only defined on $X^i$.

    A sublevel set $S_\alpha$ of $V$ of level $\alpha \in \mathbb{R}$ is represented
    as:


    ```

    $S_\alpha = \bigcup_{i \in \mathcal{I}} S_{i,\alpha}$

    \n= \bigcup_{i \in \mathcal{I}} \left( \begin{pmatrix} x \ u \end{pmatrix} \in
    X^i | \begin{pmatrix} x \ u \end{pmatrix}^\top P^i \begin{pmatrix} x \ u \end{pmatrix}
    + 2q^{i\top}x \leq \alpha \right)\n\n= \bigcup_{i \in \mathcal{I}} \left( \begin{pmatrix}
    x \ u \end{pmatrix} \in X^i | \begin{pmatrix} x \ u \end{pmatrix}^\top \begin{pmatrix}
    -\alpha & q^{i\top} \end{pmatrix} \begin{pmatrix} q^i \ P^i \end{pmatrix} x \leq
    0 \right)$

    ```


    The set $S_{i,\alpha}$ is thus the local sublevel set of $V^i$ associated to the
    level $\alpha$.

    We are looking at a family of pairs of a matrix and a vector $\{(P^i, q^i)\}_{i
    \in \mathcal{I}}$ and a real $\alpha \in \mathbb{R}$ such that $S_\alpha$ is invariant
    by the piecewise affine system. To obtain invariance, we have to constrain initial
    conditions conditions of the system. Finally, to prove that the reachable set
    is bounded, we have to constrain $S_\alpha$ to be bounded.


    Before deriving the semidefinite constraints, let us first state a useful result
    in Proposition 5.11. This result, which is a special case of the S-Procedure (4.10),
    allows us to encode implications into semidefinite constraints in a safe way.
    The implication must involve quadratic inequalities on both sides.


    **Proposition 5.11.** *Let $A, B, C$ be $d \times d$ matrices. Then, $C+A+B \geq
    0$ implies that the implication $(y^\top Ay \leq 0 \wedge y^\top By \leq 0) \implies
    y^\top Cy \geq 0$ holds.*'
