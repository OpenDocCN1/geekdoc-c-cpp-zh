    # 8.3 DISCHARGING PROOF OBJECTIVES USING PVS


    Once the annotated C code has been generated, it remains to be proven that the
    annotations are correct with respect to the code. This is achieved by checking
    each of the individual Hoare triples results. Figure 8.9 presents an overview
    of the checking process. First, the WP plug-in of Frama-C generates verification
    conditions for each Hoare triple, and the remaining conditions are translated
    into PVS theorems for further processing. It is then necessary to match the types
    and predicates introduced in ACSL to their equivalent representation in PVS. This
    is done through theory interpretation [41] and outlined in subsection 8.3.2. Once
    interpreted, the theorems can be generically proven thanks to custom PVS strategies,
    as described in subsection 8.3.3.'
