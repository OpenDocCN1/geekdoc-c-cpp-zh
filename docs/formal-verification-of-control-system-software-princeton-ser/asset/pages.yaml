  md: "# 198\n\n# CHAPTER 10\n\n![](img/8a0fdace52018a374ebad28735935393_209_0.png)\n\
    \nFigure 10.6. Sound positivity check using SOS.\n\n# 10.2.2 Validate feasibility\
    \ of the solution\n\nDespite the additional padding, it may happen that the computed\
    \ property is not strictly verifying the constraints. It remains to formally check\
    \ that the computed values satisfy the set of positive constraints.\n\nWhen manipulating\
    \ directly LMIs, this can be done by computing the matrix associated with each\
    \ positive constraint, for instance, with exact rational arithmetic, and checking\
    \ that the result is positive definite. This last check can be performed using\
    \ a Cholesky decomposition. For the sake of efficiency, this decomposition can\
    \ itself be performed using floating-point arithmetic by fully bounding the rounding\
    \ errors [64]. The resulting algorithm being nontrivial, it has been proved using\
    \ the proof assistant Coq [144].\n\nWhen manipulating SOS polynomials, additional\
    \ equality constraints relate matrix coefficients to the coefficients of the SOS\
    \ polynomial. It remains to check that the floating-point polynomial solution\
    \ is such that it verifies all positive constraints.\n\nTo show that a polynomial\
    \ constraint $e$ is positive when all its unknown variables have been bounded\
    \ by the optimization solver, we evaluate in rational arithmetics the polynomial\
    \ $p$ associated to the expression $e$. SOS optimization will then exhibit a floating-point\
    \ matrix $Q$ such that $p=x^\top Qx$.\n\nBecause of numerical imprecision, due\
    \ to the method (interior point) and the floating-point rounding errors, we rather\
    \ have $p=x^\top Qx+x^\top Ex=x^\top(Q+E)x$ where $E$ denotes the error produced\
    \ during the SOS programming.\n\nThis error $x^\top E$ can be characterized as\
    \ $p-x^\top Qx$, and we can identify an upper bound $e$ on the error per coefficient:\n\
    \n$\\forall i, j, |E_{i,j}| \\le e$."
