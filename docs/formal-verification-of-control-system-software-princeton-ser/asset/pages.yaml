    The SOS reinforcement of polynomial optimization problems consists of restricting
    polynomial nonnegativity to being an element of $\Sigma[x]$. In the case of polynomial
    maximization problems, the SOS reinforcement boils down to computing an upper
    bound of the real optimal value. For example, $p \in \mathbb{R}[x]$ and consider
    the unconstrained polynomial maximization problem $sup\{p(x) \mid x \in \mathbb{R}^d\}$.
    Applying SOS reinforcement, we obtain:


    ```

    $sup\{p(x) \mid x \in \mathbb{R}^d\}=inf{\eta \| \forall x, \eta-p(x) \geq 0\}\n\leqinf{\eta
