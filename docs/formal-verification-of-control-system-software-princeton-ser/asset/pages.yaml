    # 5.6 IMAGE MEASURE METHOD


    Let us consider another approach inspired by the works by Henrion, Lasserre, Magron,
    and Korda [115, 123, 124, 134, 142], bounding precisely the reachable sets, $\mathcal{C}$
    of a dynamical system. Assuming this set $\mathcal{C}$ lives in a compact set
    $X$, let us denote, in the following, $X^{(\infty)}$ the set of reachable sets
    restricted to X:


    $X^{(\infty)} = \{(x_t)_{t\in N} : x_{t+1}=f(x_t), \forall t\in N, x_0\in X\}$.


    The idea is to express $X^{(\infty)}$ as a minimization optimization problem in
    which we search for an inductive sublevel set, containing the initial set, and
    in which volume, with respect to Lebesgue measure, is minimal. To the compactness
    of $X$, the Lebesgue measure is defined. Furthermore, when choosing an appropriate
    compact set $X_c$, for example, a hypercube or a ball, the volume of the volume
    of $X_c$ is expressible in a linear fashion, over the moments addressed to monomials.


    This method is inspired by a long line of works manipulating polynomial systems
    and compact sets. In [87], the authors addressed the problem of computing over-approximations
    of the volume of a general basic semialgebraic set, described by the intersection
    of a finite number of polynomial sublevel sets, whose coefficients are known in
    advance. Further work focused on over-approximating semialgebraic sets where such
    a description is not explicitly known: in [141], the author derives converging
    (resp. inner) approximations of sets defined with existential (resp. universal)
    quantifiers; in [142], the authors approximate the image set of a compact semialgebraic
    set under a polynomial map $f$. The current study can be an extension of [142],
    when S stands for the set of initial conditions, $f$ represents the dynamics of
    a discrete-time system, and only one iteration is performed from S.


    One can characterize a hierarchy of converging convex approximations derived from
    an infinite-dimensional linear programming (LP) reformulation of the problem.
    Through moment relaxations of this LP, and characterization on the dual problem,
    one can compute tight over-approximations of the reachable set.'
