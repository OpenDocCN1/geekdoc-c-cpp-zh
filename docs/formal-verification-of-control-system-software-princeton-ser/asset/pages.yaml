  md: '# CHAPTER 8


    This is possible since all our closed-loop analysis, stability, and robustness
    through vector margins were based on a discrete (linear) representation of the
    plant semantics. Therefore, the discrete block defining the plant could be used
    to generate ghost C code.


    At the end of the control loop, we use these variables to express the state update
