- pgno: 24
  md: '# FORMAL METHODS


    Note that, in case, the formalization of the specification, that is, the properties
    of interest, as formal artifacts was rather straightforward. It may be more difficult
    when considering natural language description with ambiguous statements. This
    is another added value of formal methods: disambiguation of specification by imposing
    the method of strict formalization.


    Of course, a first classical approach could rely on tests to evaluate the validity
    of these properties. We will see how various formal method techniques reason on
    that program, trying to prove the desired properties:


    +   - DM: use of predicate transformation, either forward or backward reasoning;

    - MC: propositional encoding and SMT-based reasoning;

    - AI: interpretation of each computation in an abstract domain.


    # 2.2.1.1 Deductive methods: predicate transformers


    Deductive methods are the evolution of the ideas proposed by Hoare [4]. Predicate
    transformation allows us to apply the semantics of the considered program on the
    formal representation of the property. These manipulations can be performed either
    in a forward manner, transforming the preconditioning through the code - we speak
    about strongest postcondition* - or, in the opposite direction, propagating back
    the postcondition through the code we speak about weakest precondition. While
    both techniques should be equally sound, most implementations in C code analysis
    [13, 67, 98, 108] rely on the weakest preconditioning algorithm.


    This method computes wp(code, Post), the weakest precondition such that, when
    executing the code, Post is guaranteed. The rules are defined on the structure
    of imperative, per statement kind and applied iteratively. On naive imperative
    languages statements can be either assignments or control structures as sequencing
    of statements, conditionals (if-then-else), or loops.


    The assignment rule amounts to substituting in the postcondition B any occurrence
    of x by its definition e:


    ```

    wp(x:=e) ≜ [e/x]B.

    ```


    2.2.3. Let us illustrate this mechanism on the simplest example. Assume the postcondition
    requires y ≤ 0. The weakest preconditioning of the instruction y = x+1; imposes
    x ≤ -1.


    ```

    // { x+1 <= 0 <= x <= -1 }

    y = x + 1;

