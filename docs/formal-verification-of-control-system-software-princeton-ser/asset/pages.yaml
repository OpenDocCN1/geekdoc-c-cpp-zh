  md: '# PIECEWISE QUADATIC INVARIANTS


    # 5.3 Piecewise affine systems


    # 5.3.1 Piecewise affine systems


    While strong results do exist for pure linear systems, most of them vanish in
    the presence of nonlinearity such as switches between linear dynamics. As we saw
    in the previous section, stable linear systems were guaranteed to admit a quadratic
    Lyapunov function and therefore a quadratic invariant. In a switched linear system,
    this property is undecidable [37, Theorem 2]. The proposed methods are therefore
    meant to be understood as heuristics, trying to synthesize a meaningful invariant
    for such systems.


    As presented in Sec. 4.1.2 describing switched linear systems, these systems are
    composed by a set of linear updates $A_i$ to conditions $c_i$. A common practice
    in control is to look for a common Lyapunov function: a quadratic Lyapunov function
    characterized by a positive definite matrix $P$ such that


    ```

    $A_1^T P A_1 - A_1 \leq 0\nA_2^T P A_2 - A_2 \leq 0\n...\nA_n^T P A_n - A_n \leq
    0$

    ```


    This common Lyapunov function decreases along trajectories regardless of the active
    cell (see Sec. 4.1.2.1). Note that, in this encoding, all information about the
    condition satisfied in each cell is ignored.


    The main difficulty in the switched system is related to the change of dynamics:
    we must decrease whenever a transition from one cell to another is fired. More-over,
    we only require the norm induced by the quadratic Lyapunov function $P$ to be
    local, i.e., positive only where the law is used.


    Therefore, the main goal is to synthesize a Lyapunov function $V(x, u)$ and an
    associated bound $\alpha$ characterizing the reachable states as a sublevel set
