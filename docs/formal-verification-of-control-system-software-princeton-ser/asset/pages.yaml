  md: '# Chapter Three


    # Control Systems


    THE FOCUS of this book is on control systems. We sketch here their typical development
    and refer the reader to classical books such as Åström/Murray book [76] or Levine''s
    control handbook [27] for more details on control system design.


    Historically, control design started in the continuous world: a system that had
    to be controlled, and its dynamics were captured by the equations of physics,
    for example, using ordinary differential equations (ODE). Then, control theory
    provides means to build a controller: another system, used in combination with
    the system to be controlled, is able to move the system to the requested state.


    Figure 3.1 presents a typical process leading to the development of a controller
    in the aerospace domain. We now give an idea of each step.


    # 3.1 CONTROLLERS'' DEVELOPMENT PROCESS


    Let us give a naive yet representative process leading to the definition of a
    control system.


    # SYSTEM DYNAMICS


    At first an identification phase is required to obtain the plant dynamics. This
    identification phase can be complex and relies on various means to describe the
    system dynamics: a finite element structural model relying on a precise modeling
    of the aircraft shape, or a rough point mass system with a given number of degree
    of liberty. For example, for a system like an aircraft able to move in a volume,
    one can characterize roughly its dynamics by 12 equations defining its position
    and velocity in an orthogonal basis as well as its angle and angular velocity
    along the three Euler angles (Yaw, Pitch, Roll).


    Typically, one characterizes the sum of forces applied to the system (gravity,
    thrust, lift, and drag) as we learn in high school. This set of constraints defines
    the differential equations capturing the dynamics of the system.'
