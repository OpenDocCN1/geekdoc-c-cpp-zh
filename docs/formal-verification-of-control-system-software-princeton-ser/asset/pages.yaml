    In static analysis, affine forms lifted to abstract environments, as vectors of
    affine forms, are an interesting alternative to costly relational domains. They
    provide cheap and scalable abstractions: their complexity is linear in the number
    of error terms $\epsilon_i$, while most relational abstract domains have a complexity
    at at least cubic. Since their geometric concretization characterizes a zonotope,
    a symmetric convex polytope, they are commonly known as zonotopic abstract domains.


    However, since zonotopes are not equipped with a lattice structure, their use
    in pure abstract interpretation using a Kleene iteration schema is not common.
    The definition of an abstract domain based on affine forms requires the definition
    of an upper bound and lower bound operators since no least upper and greatest
    lower bound exist in general. Choices vary from the computation of a precise minimal
    upper bound to a coarser upper bound that tries to maintain relationship among
    variables and error terms. For example, the choices of [85] try to compute such
    bounds while preserving the error terms of the operands, as much as possible,
    providing a precise way to approximate a functional. In practice convergence of
