- pgno: 137
  md: 'The last tuple \beta is then a fixpoint of the whole system of equations. The
    max-policy iteration builds an ascending chain of abstract elements similar to
    Kleene iterations elements. However, it is guaranteed to be finite, bounded by
    the number of policies \sigma, while Kleene iterations require the use of widening
    to ensure termination. Since there are exponentially many max-policies in the
    number of templates and since each policy can be an improving only once, we have
    an exponential bound on the number of iterations. But in practice, only a small
    number of policies are usually considered and the number of iterations remains
    reasonable. One approach to selecting a good policy is to rely on SMT solvers
    to find a matching policy [137].


    Last, recent works [146] relied on max-policies based on linear problems and linear
    programming solvers to compute efficiently local invariants on large programs.
    This work is applied in a completely different context than ours: targeting general
    C programs rather than critical controllers, with linear properties rather than
    expressive semialgebraic ones. It shows the applicability of the approach to a
    larger set of programs than numerical controllers.'
