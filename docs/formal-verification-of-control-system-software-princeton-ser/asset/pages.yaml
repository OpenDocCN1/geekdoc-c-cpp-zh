    # 5.1.1 Fixpoint characterization, invariant and inductive invariants


    The motivation is to determine automatically if a given property holds for the
    analyzed program, or to compute precise bounds on reachable states. We are interested
    in numerical properties and more precisely in properties on the values taken by
    the $d$-uplet of the variables of the program.


    According to the abstract interpretation framework outlined in Sec. 2.5, a semantics
    can be characterized by a set of elements; for collecting semantics that is the
    set of reachable states. Hence, in our point of view, as the semantics characterization,
    a property is characterized by some set $P \subseteq \mathbb{R}^d$ of values satisfying
    the property.


    Let us first recall the fixpoint characterization and instantiate it on our discrete
    dynamical system formalization.


    # 5.1.1.1 Collecting semantics as fixpoint characterization


    In Sec. 2.5 we introduced the collecting semantics map in Eq. (2.16) and the fixpoint
    characterization of the collecting semantics in Eq. (2.17).


    ```

    $$\varphi(\Sigma) \to \varphi(\Sigma)$ \nS \to IUf(S) \qquad (5.1)\n\mathcal{C}
    = lfp_f F = min_{X \in \varphi(\Sigma)} \{F(X) \subseteq X\} \qquad (5.2)$

    ```


    where $f$ denotes the transition relation.\nAs a consequence any subset $C$ of
    $\varphi(\Sigma)$ verifying the condition $\{F(X) \subseteq X\}$ is a sound over-approximation
    of $\\mathcal{C}$ since all reachable states verify $C: \mathcal{C} \subseteqsubseteq
    C$.


    # 5.1.1.2 Collecting semantics of discrete dynamical systems


    Let us now consider a program of the forms presented in Sec. 4.1.1, 4.1.2, or
    4.1.3. In the most general case, it is characterized by an initial set $X^{Init}$,
    and by a list of update functions $f_i$ and associated conditions $c_i$. In the
    following we assume that we are given a set representation $X^i$ of each condition
    $c_i$. We recall that $X^i$ are assumed to form a partition of $\Sigma$, i.e.,
    for each element one update function is applicable.


    Let $C$ be the set satisfying the previous equation, over-approximating states
    $\\mathcal{C}$. With $F$ a piecewise discrete dynamical system, we have the following
    constraints on $P$:


    ```

    $F(C) \subseteq \mathcal{C}$ \n= {X^{Init} \cup f(C) \subseteq C\} \qquad (5.3)\n=
    {\mathcal{C} \mid X^i \in \mathcal{I}, f_i(C \cap X^i) \subseteq C\}$

    ```'
