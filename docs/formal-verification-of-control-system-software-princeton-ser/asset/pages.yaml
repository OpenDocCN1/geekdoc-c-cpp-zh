    # 2.2 A FORMAL VERIFICATION METHODS OVERVIEW


    We now illustrate the basic principles behind main verification methods: deductive
    methods (DM), SMT-based model-checking (MC), and abstract interpretation (AI).
    First, we sketch how these techniques work on simple loopless examples. Then,
    we elaborate on some details of their implementation or their use on more realistic
    examples. The exhaustive presentation of these techniques, developed in the last
    thirty to forty years, cannot be done in a few pages. The presentation reflects
    the author''s view and understanding of these approaches.


    First, let us make a disappointing statement:


    Theorem 2.1 (Rice''s theorem). It is undecidable to determine whether the language
