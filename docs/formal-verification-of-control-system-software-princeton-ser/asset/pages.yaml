  md: '# Chapter One


    # Critical Embedded Software

    Control Software Development and V&V


    CYBER-PHYSICAL SYSTEMS (CPS) is a kind of buzzword capturing the set of physical
    devices controlled by an onboard computer, an embedded system. Critical embedded
    systems are a subset of those for which failure is not acceptable. Typically this
    covers transportation systems such as cars, aircraft, railway systems, space systems,
    or even medical devices, all of them either for the expected harmfulness for people,
    or for the huge cost associated with their failure.


    A large part of these systems are controllers. They are built as a large running
    loop which reads sensor values, computes a feedback, and applies it to the controlled
    system through actuators. For most systems, at least in the aerospace industry,
    the time schedule for controllers is so tight that these systems have to be "real
    time". The ways these systems have been designed requires the execution of the
    loop body to be performed within some time to maintain the system in a reasonable
    state. In the civil aircraft industry, the controller itself is rather complex,
    but built as a composition of simpler controllers. Furthermore, the global system
    accounts for potential failures of components: sensors, networks, computers, actuators,
    etc., and adapts to the discrepancies.


    The increase of computer use in these systems has led to huge benefits but also
    an exponential growth in complexity. Computer based systems compared to analog
    circuits enable more efficient behaviors, as well as size and weight reductions.
    For example, aircraft manufacturers are building control laws for their aircraft
    that maintain them at the limit of instability, allowing more efficient behavior;¹
    Rockwell Collins implemented a controller for a fighter aircraft able to recover
    controllability when the aircraft loses, in flight, 60 to 80% of one of its wings;²
    United Technology has been able to replace huge and heavy


    > In an A380, fuel is transferred between tanks to move the center of gravity
    to the aft (backward). This degrades natural stability but reduces the need for
    lift surfaces and improves fuel efficiency by minimizing total weight and drag.
    See the book Airbus A380: Superjumbo of the 21st Century by Noris and Wagner [58].


    > ²Search for Damage Tolerance Flight Test video, e.g., at https://www.youtube.com/watch?v=TPmpq_8SSCI
    *Wind*'
