    A^i x + B^i u, V(x, u) \geq V(x'', u''). \quad (5.18)$


    # 5.3.2 Encode conditions and switches as quadratic constraints


    In Equations (5.17) and (5.18), the inequalities on $V$ are local on cells. In
    cells, the function has to decrease only over feasible transitions from cell $X^i$
    to $X^j$.


    In order to encode the problem as a set of linear matrix inequalities, we need
    to express conditions associated to each cell in suitable form. For SDP, encoding
    constraints requires us to be able to express cell membership or feasible transitions
    as quadratic constraints.'
