    Solving a general case of optimization problems with constraints is still an open
    question. However, a solution to guarantee the existence of such bound is to constrain
    the functions $f_0$, and $f_i, i\in[1, m]$ to be convex. We recall that a function
    $f$ is convex when $\alpha, \beta\geq0, \alpha+\beta=1, f(\alpha x+\beta y)\leq\alpha
    f(x)+\beta f(y)$. In that case any local optimal point is also a global optimal.
    An even stronger condition would be to require it to be linear, i.e., $f(\alpha
    x+\beta y)=\alpha f(x)+\beta f(y)$.


    Convex optimization is then a restriction of general optimization over the following-problem:


    ```

    min \quad f_0(x)\n\s.t. \quad f_i(x)\leq0 \text{ for } i\in[1,m]\n\quad a_ix=b,
    \text{ for } j\in[1,p] (4.9)

    ```


    where $f_0, f_i$ are convex functions. Note that equality constraints have to
    be affine; they correspond to a conjunction of two convex inequalities: $f(x)\leq0\wedge$
    $f(x)\geq0$; the only solution is to require $f$ to be affine or linear.


    A well-known case of convex optimization problem is linear optimization or linear
    programming, in which a linear objective $f_0$ is optimized while satisfying the
    linear constraints $f_i$.


    This notion of convex optimization can be extended to more general convex sets:
    cones. A cone $\mathcal{K}$ is a subset of $\mathbb{R}^n$ closed by positive scaling:
    $\forall x\in\mathcal{K}, \theta\geq0, \theta x\in\mathcal{K}$. A convex cone
    satisfies: $\forall x,y\in\mathcal{K}, \theta_1,\theta_2\geq0, \theta_1x+\theta_2y\in\mathcal{K}$.
    Such convex cone can be fitted with partial order $\preceq$ such that $\forall
    x,y\in\mathcal{K}, (x\preceq y)\equiv(y-x\in\mathcal{K})$. By a extension function
    convex optimization in the cone is $\mathcal{K}$-convex.


    In setting a convex optimization problem is defined as


    ```

    min \quad f_0(x)\n\s.t. \quad f_i(x)\preceq\mathcal{K} \text{ for } i\in[1,m]\n\quad
    Ax=b (4.10)

    ```


    where $f_0\in\mathbb{R}^n\to\mathbb{R}$ is convex, $f_i\in\mathbb{R}^n\to\mathcal{K}$
    are $\mathcal{K}$-convex functions, and $A\in\mathbb{R}^{p\times n}$.


    As a first specialization, we speak about linear problems where $f_0, f_i$ are
    linear. Each function $f$ can then be described as a scalar product $(\cdot,\cdot)$
    real-valued, or as a product by a matrix when $\exists m,\in\mathbb{R}^m$. In
    the following we denote the function $f_0$ by a constant $c$: $f_0(x)=(c,x)$,
    and the functions $f_i$ by the pair $A_i, b_i$ such that $f_i(x)=A_ix-b_i$.


    ```

    min \quad (c,x)\n\s.t. \quad A_ix-b_i\preceq\mathcal{K} \text{ for } i\in[1,m]\n\quad
    Ax=b (4.11)

    ```


    We let now focus on special cases depending on the cone $\mathcal{K}$ considered.'
