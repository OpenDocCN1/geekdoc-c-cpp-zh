    # 7.2.4 Relationship with phase and gain margins


    While vector margins could be computed automatically on the linear system, including
    its implementation, the use of phase and gain margins is often required to interact
    with control engineers. We propose here classical projections of vector margins
    onto a safe approximation of their associated phase and gain margins.


    # 7.2.4.1 Phase margins


    As explained in Sec. 7.2.2, the phase margin denotes the angle between the intersection
    of the Nyquist plot of the transfer function with the unit circle and the point
    $-1+0j$.


    This angle is necessarily larger than the angle between the intersection of the
    computed safe circle of radius $\delta$ with the unit circle and the point $-1+0j$
    (cf. Fig. 7.7, where $\delta=VM$).


    In that case a direct projection of vector margins to phase margins is


    ```

    $$\phi\delta = 2 \arcsin(\delta/2).$$

    ```


    # 7.2.4.2 Gain margins


    Similarly a safe gain margin can be obtained by projecting the vector margin.
    Gain margin denotes the acceptable scale of the Nyquist plot to avoid intersection
    with the point $-1+0j$.


    We can approximate the gain margin associated with the vector margin $\delta$:


    ```

    $$\Theta\delta = \frac{1}{1-\delta}.$$

    ```


    This gain is usually reported in $dB$:


    ```

    $$\Theta\delta = 20 \cdot log10 \left(\frac{1}{1-\delta}\right).$$

    ```


