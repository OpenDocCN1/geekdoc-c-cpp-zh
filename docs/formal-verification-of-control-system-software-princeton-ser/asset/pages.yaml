    We can use the relaxation of Subsection 5.3.2.1 as a representation of cells and
    use matrix variables $W^i$ and $U^{ij}$ to encode their quadratization. We get
    for $(i, j) \in \mathcal{T}^2$ such that $i \to j$:


    ```

    $$\begin{pmatrix} x \ u \end{pmatrix}^T E^{ij\T}U^{ij}E^{ij} \begin{pmatrix} x
    \ u \end{pmatrix} \ge 0$$

    $$\$\wedge \begin{pmatrix} x \ u \end{pmatrix}^T \begin{pmatrix} &-\alpha & q^{i\T}
    \ q^i & P^i \end{pmatrix} \begin{pmatrix} x \ u \end{pmatrix} \le 0 \quad (5.26)$

    ```


    where $E^{ij}$ is the matrix defined in Equation (5.20) and $F^i$ is defined in
    Equation (4.4). Finally we obtain a stronger condition by considering a semidefinite
    constraint as Equation (5.27). Proposition 5.11 proves that if $(P^i, P^j, q^i,
    q^j, U^{ij})$ is a solution of Equation (5.27) then $(P^i, P^j, q^i, q^j, U^{ij})$
    satisfies Equation (5.26). For $(i, j) \in \mathcal{T}^2$ such that $i \to j$:


