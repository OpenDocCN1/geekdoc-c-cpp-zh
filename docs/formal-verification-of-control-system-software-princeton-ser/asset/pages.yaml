    # 5.3.4.1 Integrating initial conditions


    To complete invariance property, invariant set must contain initial conditions.
    Suppose that initial condition is a polyhedron $X^0 = \{(x,u) \in \mathbb{R}^{d+m}
    | T_w^0(x,u) \leq c_w^0, T_u^0(x,u) \leq c_u^0\}$. We must have $X^0 \subseteq
    S_a$. But $X^0$ is contained in the union of $X^i$. Here, $X^0$ is the union over
    $i \in \mathcal{I}$ of the sets $X^0 \cap X^i$. For all $i \in \mathcal{I}$, $X^0
    \cap X^i$ is contained in $S_{i,a}$ and $X^0 \subseteq S_a$. We can use the method
    as before to express that all sets $S_{i,a}$ such that $X^0 \cap X^i \neq \emptyset$
    must contain $X^0 \leq \alpha$. In terms of implications, it can be rewritten
    for all $i \in \mathcal{I}$ such that $X^0 \cap X^i \neq \emptyset$.


    ```

    $$(x,u) \in X^0 \cap X^i = (x,u)P^i(x,u) + 2(x,u)q^i \leq \alpha. \quad (5.28)$

    ```


    Since $X^0 \cap X^i$ is a polyhedra, it admits some quadratic, that is, $X^0 \cap
    X^i = \{(x,u) \in \mathbb{R}^{d+m} | (1,x)E^{0i}T^iE^{0i}(1,x,u)^T \geq 0\}$ where
    $E^{0i} = $ with:


    ```

    $$E^{0i}_w = \begin{pmatrix} C_w^{0i} & -T_w^{0i} \ C_u^{0i} & -T_u^{0i} \end{pmatrix}
    \text{ and } E^{0i}_s = \begin{pmatrix} 1 \times(d+m) \ c_s^0 & -T_s^0 \ c_s^i
    & -T_s^i \end{pmatrix} \end{}$

    ```


    and $Z^i$ is some symmetric matrix whose coefficients are nonnegative.

    For all $i \in \mathcal{I}$ such that $X^0 \cap X^i \neq \emptyset$, we obtain
    a stronger notion by introducing semidefinite constraints:


    ```

    $$- \begin{pmatrix} \-\alpha & q^{Ti} \ q^i & P^i \end{pmatrix} - E^{0i\T} Z^i
    E^{0i} \geq 0. \quad (5.29)$

    ```


    Proposition 5.11 proves that if $(P^i, q^i, Z^i)$ is a solution of Equation (5.29)
    then $(P^i, q^i, Z^i)$ satisfies Equation (5.28).

    Note, since $X^0 \cap X^i$ is a polyhedron then its emptiness can be decided by
    checking the feasibility of the linear problem (5.30) and by using the same argument
    as Proposition 5.9.


    ```

    $$ \begin{cases} (E^{0i})^T p^i q^i = 0 \ \sum_{k} p_k^i = 1 \ p_k^i \geq 0, \forall
    k \in \mathcal{I} \ p_i \geq 0, \forall i \notin \mathcal{I} \end{cases} \quad
    (5.30)$

    ```


    Linear program (5.30) is feasible iff $X^0 \cap X^i = \emptyset$.'
