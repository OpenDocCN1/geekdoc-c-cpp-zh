    $e_k = in_y - y_k$


    One can consider $in$ as the input of the closed-loop system, and $x$ as its output.


    # 7.1 OPEN-LOOP AND CLOSED-LOOP STABILITY


    As mentioned in chapter 3, the notion of stability for a dynamical system captures
    both the boundedness of reachable states and a notion of convergence. A stable
    system guarantees that a small change in the input will not produce a large change
    in the output. Mathematically speaking, the notion of asymptotic stability ensures
    that with a null input, the system converges to zero. This stability can be studied
    in two ways: open-loop stability and closed-loop stability. In the open-loop setting
    the stability of the controller itself is studied while in the closed-loop setting
    the complete system integrating the feedback interconnection of controller and
    plant is addressed.


    While closed-loop stability is the main stability property of interest that is,
    the controlled system will have a stable behavior-ensuring open-loop stability
    avoids the undesirable situation where the feedback interconnection is stable,
    while the controller is intrinsically unstable. In terms of implementation, an
    open-loop stable controller has a reasonable behavior on its own, e.g., assuming
    only bounded input, it will provide a bounded output. This is called the bounded
    input output (BIBO) property.


    Stability properties can be assessed in different ways. A system''s dynamics are
    expressed as transfer functions mapping inputs to outputs. These are'
