    # 2.6 NEED FOR INDUCTIVE INVARIANTS


    Basically all formal methods rely on the expression of the property of interest
    as an invariant over the system semantics. In practice all these techniques benefit
    from additionally provided invariants. We summarize the use of invariant in the
    different techniques.


    # 2.6.1 Loop invariants for deductive methods


    As mentioned in Section 2.3.1 the analysis of loop with deductive methods requires
    invariants to be provided to capture the loop semantics. While simple invariants
    may be easily provided, they may be too weak to capture precisely the loop semantics.
    For example, the loop invariant expressed in Fig. 2.2 is extremely precise: $R,
    X, Q \ge 0, Y > 0, X=R+Q$.


    If one considers Dijkstra''s predicate transformer rule for loops in Eq. (2.6),
    one can see that the remaining property is essentially $I$, the invariant provided.
    Invariants for loops act as the cut-rule in proofs. A sound invariant will generate
    a weaker precondition that guarantees the postcondition, but not the weakest.
    The proof that the provided precondition imply the weaker precondition may be
    unfeasible.


    These loop invariants are either manually provided [147] or computed by other
    means such as abstract interpretation [83].


    # 2.6.2 Inductive invariants to reinforce transition relation in SMT-based model-checking


    Similarly, SMT-based model-checking is essentially based on induction. As mentioned
    in Section 2.4, different approaches are used to address the lack of availability
    of the collecting semantics $[f]_{coll}$. While looking different, $k$-induction,
    or invariant injection all amount to the characterization of invariants of $[f]_{coll}$.'
