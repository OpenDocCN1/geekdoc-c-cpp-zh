- pgno: 16
  md: '# CRITICAL EMBEDDED SOFTWARE


    # CURRENT LIMITS & OBJECTIVES


    The objectives of the presented works are restricted to the definition of formal
    methods-based analyses to support the verification of controller programs.


    More specifically we can identify the following limits in the current state of
    the art:


    Need to compute invariants of dynamical systems New advances in formal methods
    are often not specialized for a particular kind of program. They rarely try to
    handle a large set of programming language constructs and deal with scalability
    issues. In specific cases, such as the application of static analysis to Airbus
    programs [54], dedicated analyses, like the second-order filter abstraction [47],
    have been defined. But the definition of these domains is tailored to the program
    for which they are defined.


    Lack of means to compute nonlinear invariants As we will see in this book, the
    simplest properties of controllers are often based at least quadratic properties.
    Again, because of efficiency and scalability, most analyses are bound to linear
    properties. We claim that more expressive yet more costly analyses are required
    in specific settings such as the analysis of control software. The scalability
    issues have to be addressed by carefully identifying the local part of the program
    on which to apply these most costly analyses.


    Expressivity of static analysis properties Formal methods applied at model or
    code level are hardly used to express or analyze system-level properties. In practice,
    static analysis is mainly bound to numerical invariants whereas deductive methods
    or model-checking can manipulate more expressive first-order logic formulas. However,
    computer scientists are usually not aware of the systemlevel properties satisfied
    or to be satisfied by the control program they are analyzing. An important research
    topic is therefore the use of these formalisms (first-order logic and numerical
    invariants) to express and analyze system-level properties.


    Scope of current analyses In the current state of the practice, concerns are split
    and analyzed locally. For example the control-level properties such as stability
    are usually analyzed by linearizing the plant and the controller description.
    At the code level this can be compared to the analysis of a simplified program
    without it-then-else or nonlinear complexities. Similarly, the complete fault-tolerant
    architecture, which is part of the implemented embedded program, is abstracted
    away when analyzing system-level properties. A last example of such—potentially
    unsound simplifications, is the assumption of a real semantics when performing
    analyses, while the actual implementation will be executed with floating-point
    semantics and the associated errors. The vision supported by the book is that
    more integrated analyses should address the study of the global system.'
