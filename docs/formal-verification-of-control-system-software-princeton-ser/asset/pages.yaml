    CHAPTER 2


    # $W = (b \Rightarrow wp(c, W) \wedge \neg b \Rightarrow B)$.$


    Thanks to Tarski fixpoint theorem, considering the partial order induced by logical
    implication $\Rightarrow$, i.e., $x \sqsubseteq y \Rightarrow x$, and the monotonic
    definition of $W$, this fixpoint exists. This formula is difficult to compute
    and may not be representable with a finite set of atoms. If characterizable it
    captures precisely the loop semantics: the most precise loop invariant, the relationship
    between input and output, preserved by the loop body.


    The solution proposed by Dijkstra [6] is to provide, manually, a weaker loop invariant
    $I$, i.e., that $W \Rightarrow I$. The predicate transformation rule is then defined


    ```

    $wp(while b \ do c, I) \wedge ((I \wedge \neg b) \Rightarrow wp(c, I)) \wedge
    ((I \wedge \neg b) \Rightarrow B)$.

    ```


    As a result, any occurrence of loop in programs requires the definition of a loop
    invariant capturing the loop semantics.


    Similarly, in order to prove termination, one needs to exhibit a loop variant,
    a decreasing sequence in a Noetherian relation, also called a well-founded relation.
    Typical implementations rely on a positive integer-valued function decreasing
    at each loop iteration.


    # 2.3.2 Memory model and low-level representation


    Until now all computations have been performed on a naive imperative language
    with real data types, without complex data structure, memory allocation, or function
    calls.


    Serious tools such as Frama-C handle all those constructs. Memory issues are a
    large part of them. Multiple choices could be made to represent the memory: from
    the simplest to the Hoare model without pointers or aliases, to a bit level representation.
    The more complex the memory, the bigger the generated predicate.


    Dedicated analyses as separation logic [40] can be used to detect aliases or guarantee
    that pointers $x$ and $y$ are separated, easing the later analyses. Tools such
    as the Verified Software Toolchain (VST) [98] rely on such analysis.


    # 2.3.3 Underlying logic and automatic proof


    A last difficulty in realistic implementations is the expressivity and tools associated
    to the underlying logic. In Frama-C, the annotation language ACSL [148] (ANSI
    C Specification Language) is extremely rich and enables the definition of predicates
    or internal data structures in both functional or axiomatic ways. However, for
    the concept concept e.g., a linked list or a treelike structure, or an integer-valued
    function computing the size of a data structure, the generated predicate will
    widely differ and so do the results of the automatic solver to prove the final
    proof objective.'
