    # 4.2.1.3 Sum-of-square polynomials


    Let $\mathbb{R}[x]$ be the set of multivariate polynomials of $\mathbb{R}^n$ and
    $\mathbb{R}[x]_{2m}$ its restriction to polynomials of degree at most $2m$. We
    denote by $\Sigma[x] \subset \mathbb{R}[x]$ the cone of sum-squares (SOS) polynomials,
    that is,


    ```

    $$\Sigma[x] := \left\ \sum q_i^2, q_i \in \mathbb{R}[x] \right\ \quad (4.13)$

    ```


    The existence of an SOS representation for a given polynomial is an approach to
    *Positivstellensatz*, a sufficient condition to prove its global nonnegativity,
    i.e., $\forall p(x) \in \Sigma[x], p(x) \geq 0$. The SOS condition (4.13) is equivalent
    to the existence of a positive semidefinite matrix $Q$ such that


    ```

    $p(x) = Z^{\top}(x)Q(x) \quad (4.14)$

    ```


    where $Z(x)$ is vector of monomials of degree less than or equal to $deg(p)/2$.
    Searching for a positive polynomial of a given degree $d=2m$ amounts to solving
    a semidefinite optimization problem and synthesizing the matrix $Q \geq 0$, satisfying
    Eq. (4.14).


    **Example 4.9.** Consider the bi-variate polynomial $q(x) := 1+x_1^2-2x_1x_2+x_2^2$.
    With $Z(x)=(1,x_1,x_2)$, one looks for a semidefinite positive matrix $Q$ such
    that the polynomial $q(x)=Z(x)^{\top}Q(x)$ holds for all $x \in \mathbb{R}^2$.


    ```

    $Q = \begin{pmatrix} 1 & 0 & 0 \ 0 & 1 & -1 \ 0 & -1 & 1 \end{pmatrix}$

    ```


    satisfies this equality and has three nonnegative eigenvalues, which are 0, 1,
    and 2, respectively associated to the three eigenvectors $e_0=(0,1,1)^{\top},
    e_1=(1,0,0)^{\top}$, and $e_2=(0,-1,1)^{\top}$. Defining the matrices $L:=(e_1
    \ e_2 \ e_0)$ and $D=\begin{pmatrix} 100 & 0 & 0 \ 0 & 20 & 0 \ 0 & 0 & 0 \end{pmatrix}$,
    one obtains the decomposition $Q=LDL^{-1}$ and the equality $q(x)=(LZ)D(L^{-1}Z)=\sigma(x)=1+(x_2-x_1)^2$,
    for all $x \in \mathbb{R}^2$. The polynomial $\sigma$ is called an SOS certificate
    and guarantees that $q$ is nonnegative.


    An SOS optimization problem can be defined as


    ```

    $$\begin{aligned} \min & \langle c, x \rangle \ \text{s.t.} & p_i(x) \in \Sigma[x]
    \text{ for } i \in [1,m] \ & & Ax=b. \end{aligned} \quad (4.15)$

    ```'
