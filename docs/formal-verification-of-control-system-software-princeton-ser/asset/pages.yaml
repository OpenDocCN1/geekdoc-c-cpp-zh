    $C=\{x\in \mathbb{R}^d\mid g_j(x)<#, \forall j=1,\dots,m\}$, where $\#$ is used
    to encode either a strict or a weak $\leq$ inequality.


    # 4.1.3.2 Semialgebraic partitioning of $\Sigma$


    These basic semialgebraic sets of $\Sigma=\mathbb{R}^{d+m}$ act as the cells we
    used in piecewise affine systems. They characterize a partition of the state-input
    space $\Sigma$. Let $I$ be the set of semialgebraic cells $X^i$.


    ```

    $X^i=\{x\in \mathbb{R}^{d+m} \mid \Lambda r_{s_j}^i<0, 1\leq j\leq ns_i, \Lambda
    r_{w_j}^i\leq0, 1\leq j\leq nw_i\} (4.6)$

    ```


    where $ns_i$ and $nw_i$ denote, respectively, the number of strong and weak polynomial
    constraints in the semialgebraic set $X^i$.


    Cells $X^i$ satisfy Eq. (4.2); they form a semialgebraic partition of $\tilde{\Sigma}$.
    As a result, any element of $\Sigma$ belongs to exactly one $X^i$.


    # 4.1.3.3 Polynomial updates


    Assignments associated to each cell $X^i$ with $i\in \mathbb{I}$ are defined by
    polynomial functions $T^i$.


    ```

    $if x_k\in X^i, x_{k+1}=T^i(x_k). (4.7)$

    ```


    For systems without input, we have $T^i$ a d-variate polynomial: $T^i\in \mathbb{R}[x]$;
    in case of systems with input in $\mathbb{R}^m$, $T^i$ is a polynomial function
    $T^i\in \mathbb{R}^{d+m} \to \mathbb{R}^d$, where each coordinate function is
    a polynomial $\mathbb{R}^{d+m} \to \mathbb{R}^d$.


    # 4.1.3.4 Definition of a piecewise polynomial system (PPS)


    We assume that $\mathbb{I}$ is finite and the initial condition $x_0$ belongs
    to some compact basic semialgebraic set $X^{Init}$ satisfying Eq. (4.6). For the
    program, $X^{Init}$ is the set in which variables are supposed to be initialized.


    # Definition 4.7 (Piecewise Polynomial System). A constrained piecewise discrete-time
    dynamical system (PPS) is the quadruple $(X^{Init}, X^{In}, \Sigma, L)$ with:


    +   * $X^{Init}\in\Sigma\subseteq\mathbb{R}^d$ is the compact basic semialgebraic
    set of the possible initial conditions;


    +   * $X^{In}\in\mathbb{R}^m$ is the basic semialgebraic set where the input variable
    lives;


    +   * $\Sigma:=\{X^i, i\in\mathbb{I}\}$ is a partition as defined in Equation
    (4.2);


    +   * $L:=\{T^i, i\in\mathbb{I}\}$ is the family of the polynomials from $\mathbb{R}^{d+m}$
    to $\mathbb{R}^d$, w.r.t. the partition $\Sigma$ satisfying Equation (4.7).'
