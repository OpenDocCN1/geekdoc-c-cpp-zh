    \n# 5.1.2 Lyapunov functions\n\nIn 1890, Alexander Lyapunov published his well-known\
    \ result stating that the differential equation $\\frac{dx}{dt}=Ax(t)$ is stable\
    \ if and only if there exists a positive definite matrix $P$ such that $A^\top\
    \ P+PA \\preceq 0$. Here both $A$ and $P$ are square matrices of $R^{n \\times\
    \ n}$ and $P$ is positive definite $P \\succ 0$, i.e., $x \\in R^n, x^\top Px\
    \ \\geq 0$. Later this was formulated in a discrete-time setting over discrete\
    \ linear systems:\n\n$x_{k+1}=Ax_k$ with $A \\in R^{n \\times n}$\n\nas\n\n$$\\\
    exists P \\in R^{n \\times n}, \\text{s.t.} \\left\\{\\begin{array}{c} \\exists\
    \ P \\succ 0 \\ A^\top PA-P \\preceq 0 \\end{array}\\right\\}$ $(5.5)$\n\nIn both\
    \ cases, $P$ is the measure of energy of the system: the Lyapunov function $x\
    \ \\mapsto x^\top Px$. When *measuring* the energy of the image $Ax$, we obtain\
    \ $(Ax)^\top P(Ax)=x^\top PAx$.\nSince $P$ is positive definite, $x \\in R^n,\
    \ x^\top Px \\geq 0$, and $P$ denotes a norm over states, while to the second\
    \ constraint, sublevel sets are inductive over states: $x \\in R^n, x^\top Px\
    \ \\geq \\epsilon$. The inequality $A^\\top PA-P \\preceq 0$ encodes a kind of\
    \ energy dissipation along along trajectories. When the energy reaches 0, the\
    \ state of the system is near 0. In this original setting, the considered system\
    \ is closed, i.e., it does not admit input. In the case of linear systems with\
    \ bounded inputs, one can rely on the same argument not to motivate asymptotic\
    \ stability but to argue that the system will not diverge and remains within some\
    \ bounds.\n\nSimpler arguments exist for the specific case of linear systems,\
    \ e.g., one can compute the eigenvalue of the matrix and check that the linear\
    \ map $A$ is contracting. However, this notion of Lyapunov function seems much\
    \ more extensible and was widely developed in the control community.\n\nLet consider\
    \ numerical systems with $\\Sigma=R^d$. More formally, a Lyapunov function $V:\
    \ R^d \\to R^+$ for a discrete-time system is a positive real-valued function\
    \ over system states that satisfies:\n\n+   Null at origin, otherwise\n\n$$\\\
    {V(0)=0 \\\\forall x \\in R^d \\setminus\\0\\}, V(x) > 0 \\lim_{\\|x\\\\to\\infty}\
    \ V(x)=\\infty\\}$ $(5.6)$"
