- pgno: 20
  md: '# FORMAL METHODS


    By interpreting a program as a set of states $\Sigma$, an initial set of states
    $Init \subseteq \Sigma$, and a transition relation $[\:\cdot]_{op} \subseteq \Sigma
    \times \Sigma$, we defined a transition system $(\Sigma, Init, [:\cdot]_{op})$.


    In practice, one is not necessarily interested directly in the program semantics
    in a denotational or operational form but rather by the properties of the program
    when executed.


    The most precise definition of a program behavior is to characterize exactly its
    set of traces, its trace semantics:


    ```

    $[f]_{trace} = \left\{ s_0 \to \dots \to s_n \\| i \in [0, n-1], (s_i, s_{i+1})
    \in [f]_{op}, s_0 \in Init \right\}$

    ```


    In the case of nonterminating programs, traces could be infinite. While nonterminating
    programs are usually seen as bad programs in computer science, controllers are
    supposed to be executed without time limit, in a while true loop. We can extend
    the definition of trace semantics for infinite traces:


    ```

    $[f]_{trace} = \left\{ s_0 \to \dots \to s_i \to \dots \| \forall i \ge 0, (s_i,
    s_{i+1}) \in [f]_{op}, s_0 \in Init \right\}$

    ```


    To summarize, trace semantics capture the possibly infinite set of possibly infinite
    traces. If provided with such a set, one can observe any properties related to
    intermediate computed values, occurrence of states within traces, infinite behavior,
    finite behavior such as deadlocks and so on. These properties are usually defined
    as temporal properties.


    Another semantics of interest, with respect to the program semantics, is the collecting
    semantics. This semantics focuses only on reachable states in traces but not on
    their specific sequences.


    One can define it as follows:


    ```

    $[f]_{coll} = s_n \left\{ s_0 \to \dots \to s_n \in [f]_{trace} \text{ i.e. such
    that} \\ s_0, \dots, s_n \in \Sigma \\ \forall i \in [0, n-1], (s_i, s_{i+1})
    \in [f]_{op} \\ s_0 \in Init \right\}$

    ```


    As such, collecting semantics is an abstraction of trace semantics: it characterizes
    a set of reachable states but loses information on their relationship. This semantics
    is, however, extremely useful: it can capture all reachable states and therefore
    guarantee that all states verify a given invariant, or avoid a bad region.


    A last way to express the behavior of a program is the axiomatic semantics. This
    notion was introduced by Hoare in 1969 [4]. In 1967 Floyd [3] proposed to annotate
    a flowchart by its local invariants. The following figure is extracted from that
    paper.'
