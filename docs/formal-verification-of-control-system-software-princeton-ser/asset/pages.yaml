    # 2.5 ABSTRACT INTERPRETATION (OF COLLECTING SEMANTICS)


    The abstract interpretation framework proposed by Cousot and Cousot [8] provides
    a methodology in which analyses of semantics can be easily defined and proved
    correct. An essential step of that methodology is to characterize the semantics
    of interest as a fixpoint of a monotonic operator over a complete lattice. We
    refer the reader to Mine''s PhD manuscript for a very good introduction to the
    theory [49].


    For the moment, let us give the following definition.


    **Definition 2.4 (Abstract Interpretation).** *Abstract Interpretation is a constructive
    and sound theory for the approximation of semantics expressed as fixpoint of monotonic
    operators in a complete lattice.*


    While this formulation may seem unnatural to the newcomer, it is actually a simple
    step when it comes to collecting semantics. Collecting the semantics characterizing
    reachable states of a program or of a dynamical system. We recall that $\Sigma$
    is the set of all states. We are interested in characterizing all reachable states
    $s \in \Sigma$. Reachable states form a set of sets $S \subseteq \Sigma$ and belong
    to its powerset $S \in \rho(\Sigma)$. We would like to compute the most precise
    element of $\rho(\Sigma)$ denoting all reachable states.


    Any powerset is a complete lattice. It is fitted with a partial order, the set
    inclusion $\subseteq$: the set of elements admits a least upper bound, the union
    $\cup$ U, and a greatest lower bound, the set intersection $\cap$. It is fitted
    with a lowest element $\emptyset$ and a greatest one $\Sigma$. Therefore, our
    element of interest denoting all reachable states, let''s call it $\mathfrak{C}$,
    is one specific element of the complete lattice $(\rho(\Sigma), \subseteq, \cup,
    \Sigma)$.


