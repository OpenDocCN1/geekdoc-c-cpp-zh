- pgno: 41
  md: '# 2.6.3 Inductive invariants to strengthen abstract fixpoint computation


    Abstract interpretation aims at computing inductive invariants. The definition
    of abstraction through sound abstract domains enables their composition to improve
    the analysis results. Since the Cartesian product of two complete lattices is
    Galois connections can be similarly composed, one can easily define a sound analysis
    an that relies on multiple abstractions at the same time. Another interesting
    construct is the domain reduction: it enables multiple domains to communicate
    and refine their own (sound) properties. Let us illustrate that on a simple example.


    Example 2.7. Consider a set of integer values Σ=N and the three following abstractions:
    sign, interval, and parity.


    ```

    $\alpha_{sign}(S) = \begin{cases} \text{sign} & \text{when } S=\emptyset \ 0 &
    \text{when } S=\{0\} \ + & \text{when } \forall s \in S, s \ge 0 \ - & \text{when
    } \forall s \in S, s \le 0 \ & \text{otherwise} \end{cases}$$


    $\alpha_{interval}(S)=(\min S, \max S)$$


    $\alpha_{parity}(S) = \begin{cases} \text{parity} & \text{when } S=\emptyset \
    \text{Odd when } \forall s \in S, s \bmod 2=1 \ \text{Even when } \forall s \in
    S, s \bmod 2=0 \ & \text{otherwise} \end{cases}$

    ```


    Abstracting by the set of its elements is always less precise than representing
    more finely the set of values by its lower and upper elements. But those two abstract
    representations are not comparable with the abstraction that determines whether
    all values are even or odd.


    Abstractions could be combined, however. If both intervals and parity are of interest
    to us, one can analyze the semantics of the program with abstractions in the same
    computation and represent more precisely the interval and parity associated to
    the abstract set of values. This could lead to further improvements. For example,
    an interval abstraction may have identified a set [1,1000] of reachable values
    while the parity abstraction guarantees that all values are odd. In that case
    the interval representation can be refined into [1,9999].


    One of the major applications of abstract interpretation is the tool Astrée that
    was designed specifically for the analysis of the Airbus A3XX family control command
    systems. It combines numerous abstract domains with complex reductions [66]. One
    of these is specifically focused on second-order linear filters in order to bound
    their reachable states [47].'
