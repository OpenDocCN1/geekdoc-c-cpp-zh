  md: '# 9.2.3 System-level analyses


    Concerning robustness analysis and vector margins, as presented in Section 7.2,
    what we need is not exactly the inequality (7.16) describing the dissipativity
    condition but rather³


    ```

    $fl(x_{k+1})^T P fl(x_{k+1}) - x_k^T P x_k \leq \gamma^2 ||in_k||_2^2 - ||fl(e_k)||_2^2$

    ```


    Again, bounding by the positive upper bound $\epsilon$ the floating-point error
    occurring when computing the linear update $x_{k+1}$ evaluated through the Lyapunov
    function, one can express the stronger condition:


    ```

    $x_{k+1}^T P x_{k+1} - x_k^T P x_k \leq \gamma^2 ||in_k||_2^2 - ||e_k||_2^2$

    ```


    Instead, of checking (7.17)


    ```

    $\left( A_s^T P A_s - P + C_s^T C_s + \epsilon I \quad A_s^T P B_s + C_s^T D_s
    \ B_s^T D A_s + D_s^T C_s \quad D_s^T D_s + B_s^T P B_s - \gamma^2 I + \epsilon
    I \right) < 0$.

    ```


    This robustness property is still difficult to prove since the inequality (7.16)
    is not absolute but relative to the difference between the norm 2 of the input
    and the error. The inequality should then hold for $in_k$ and $e_k$ as small as
    possible. However, because of finiteness of floating representation and underflow
    mechanism, the error they induce is no longer relative but absolute and we can
    only prove:


    ```

    $fl(x_{k+1})^T P fl(x_{k+1}) - x_k^T P x_k \leq \gamma^2 ||in_k||_2^2 - ||fl(e_k)||_2^2
    + \eta$

    ```


    where $\eta$ is a constant, depending on $x$, or on $n$. Thus, instead of (7.18),
    we get


    ```

    $\sum_{k=0}^T ||e_k||_2^2 \leq \gamma^2 ( \sum_{k=0}^T ||in_k||_2^2 ) + (T+1)\eta$.

    ```


    ³$x_{k+1}$ and $e_k$ both incur floating-point computations in the controller.
    (cf. 7.14) whereas $in_k$ is just a real number.'
