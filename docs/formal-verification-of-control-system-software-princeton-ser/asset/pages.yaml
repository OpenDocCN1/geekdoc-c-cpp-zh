- pgno: 210
  md: 'In order to prove that there exists a positive semidefinite matrix $Q+E \succeq
    0$, we check the stronger condition $Q-nId \succeq 0$ where $n$ is the dimension
    of $Q$. The Figure 10.6 presents the different results: $Q$ is not exactly on
    the constraints but in a neighborhood. In the first case, all the matrices $Q-nId$
    are positive definite, so there exists a witness of positivity for the constraint
    $p$. In the second case, the constraint intersects the cone and $p$ is positive,
    but the imprecise computed $Q$ does not enable us to prove that $Q-nId \succeq
    0$. In the last case, $p$ is not positive, but $Q$ was produced as an SOS witness
    of positivity for $p$. Thanks to the invalidity of the check, we are able to reject
    this value.'
  merge: -1
  img_proc: true
