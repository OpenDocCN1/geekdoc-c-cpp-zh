    # 5.5 POLYNOMIAL INVARIANTS


    # 5.5.1 Fixpoint expression using Lyapunov functions


    We focus here on a more general family of problems: piecewise polynomial systems.
    We also rely on general optimization problems: the cone of positive polynomial
    and its relaxation/reinforcement as the cone of sum-of-squares polynomials (SOS).


    Instead of expressing constraints as linear matrix inequalities (LMI), we can
    express constraints as positive polynomial constraints. These constraints will
    be further reinforced by requiring them to be SOS polynomials.


    Let us consider again Equation (5.3) defining inductiveness of computed property
    with respect to the system semantics.


    ```

    $$X^{Init} \subseteq P,\nforall i \in I, T^i(P \cap X^i) \subseteq P.$\ (5.51)$

    ```


    Encoding property $P$ as the sublevel set of a polynomial $p$, we obtain the following
    problem:


    ```

    $$\begin{cases} p(x) \leq 0, & \forall x \in X^{Init},\forall i \in I, p(T^i(x))
    \leq 0, & \forall x \in P \cap X^i. \end{cases}$ \ (5.52)$

    ```


    # 5.5.2 Property-driven analysis


    As for the linear case, the previous equation only captures the inductiveness
    of the sublevel set induced by the polynomial Lyapunov function synthesized. However,
    no constraint encodes the need to obtain a precise (hence small) invariant. The
    expressivity of sum-of-square optimization enables us to encode a target property
    represented as a sublevel set of a polynomial and require the polynomial function
    to implement this property.


    # 5.5.2.1 Considered properties: sublevel properties $P_{\kappa,\alpha}$


    We restrict our encoding to sublevel properties: those defined as sublevel sets
    of a given polynomial function.'
