    # Invariant Synthesis via Convex Optimization


    Postfixpoint Computation as Semialgebraic Constraints


    # 5.1  INVARIANTS, LYAPUNOV FUNCTIONS, AND CONVEX OPTIMIZATION


    This chapter focuses on the computation of invariant for a discrete dynamical
    system collecting semantics.


    Invariants or collecting semantics properties are properties preserved along all
    executions of a system and verified in all reachable states. A subset of these
    invariants are defined as inductive. Inductive invariants are properties, or relationships
    between variables, that are inductively preserved by one transition of considered
    systems. Intuitively, it is not required to consider a reachable state and all
    (or part of) its past while arguing about the validity of the invariant, but only
    the single state. Applying the induction principle we obtain that any state satisfying
    the property is mapped to a next state preserving that property.


    For example, when one analyzes a geometric progression with a ratio $r$ such that
    $|r| < 1$ then any invariant expressed as an interval can be easily proved: if
    $[a, b]$ contains the initial state and zero, any element of the progression will
    belong to $[a, b]$. Note that, here, we are only focused on the invariant but
    not interested in characterizing the decay or growth rate of the progression.


    Discrete dynamical systems admit an infinite behavior, it is therefore of utmost
    importance to be able to characterize their reachable states, for example, proving
    the boundedness of such a set. In the control community *lingua* a system is said
    to be stable, without any input, it converges to zero. This idea is captured by
    Lyapunov functions.


    The current chapter proposes methods to compute dynamical systems'' invariants
    based on Lyapunov function synthesis using convex optimization. In this section
    we introduce these notions. The following sections develop different encodings
    to compute these invariants for a wide variety of settings and solve different
    kinds of optimization problems.


