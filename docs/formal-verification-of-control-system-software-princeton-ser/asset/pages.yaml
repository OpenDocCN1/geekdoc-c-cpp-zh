    # 7.2 ROBUSTNESS WITH VECTOR MARGIN


    Beyond stability, an important property which needs to be verified is the robustness
    of the controller. The property of robustness is necessary in practice as there
    are many sources of imperfection in the feedback loop. It characterizes "how much"
    the closed-loop system is stable and which kind of perturbations or uncertainty
    can be sustained without losing stability. These imperfections can include errors
    in modeling the plant, uncertainties in the plant that cannot be captured by the
    model, noises in the sensors and actuators, and limitations of the controller
    design, i.e., not accounting for the complete range of behaviors of the system,
    nonlinearities in the actuators, faulty actuators, etc.'
