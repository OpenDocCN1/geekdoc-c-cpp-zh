    ```

    ellipsoid_general: THEOREM

    \forall\ (n:posnat,m:posnat, Q:SquareMat(n),

    M M: Mat(m,n), x:Vector[n], y:Vector[m]):

    in_ellipsoid_Q?(n,Q,x)

    IMPLIES

    AND y = M*x

    in_ellipsoid_Q?(m,M*Q*transpose(M),y)

    ```


    Figure 8.4. Ellipsoid theorem in PVS.


    ```

    ellipsoid_combination: THEOREM

    \forall\ (n:posnat, lambda_1, lambda_2:

    posreal, Q_1: Mat(m,n),

    _2: Mat(m,m), x:Vector[n], y:Vector[m],

    z: Vector[m+n]

    in_ellipsoid_Q?(n,Q_1,x)

    AND in_ellipsoid_Q?(m,Q_2,y)

    AND lambda_1+ lambda_2 <= 1

    AND z = Block2V(V2Block(n,m,n,m))

    IMPLIES

    in_ellipsoid_Q?(n+m,Block2M(M2Block(n,m,n,m))

    )(1/lambda_1*Q_1,

    Zero_mat(m,n),Zero_mat(m,n),

    1/lambda_2*Q_2)),z

    ```


    Figure 8.5. Ellipsoids combination theorem in PVS.


    These theorems are used heavily in Section 8.3 to prove the correctness of a given
    Hoare Triple. While are not particularly novel, their proof in PVS was no trivial
    process and required close to 10000 manual proof steps.


