    where $F#(S) = \alpha(Init) \cup f#(S)$.


    # 2.5.1.4 Fixpoint transfer


    Thanks to the appropriate choice of $\alpha$ and $\gamma$ functions, for example,
    with a Galois connection, and with the additional constraint that the abstraction
    commutes with $F$:


    ```

    $\alpha \circ F = F# \circ \alpha$.

    ```


    We have:


    +   $Init \subseteq \gamma(\alpha(Init))$ (ext. of $\gamma \alpha$)

    $\Rightarrow F(Init) \subseteq F#(\\gamma(\alpha(Init)))$ (mon. $F$)

    $\Rightarrow \alpha \circ F(Init) \subseteq \alpha \circ F#(\alpha(Init))$ (mon.
    $\alpha$)

    $\Rightarrow \alpha \circ F(Init) \subseteq F# \circ \alpha \circ \gamma(\alpha(Init))$
    (using 2.23)

    $\Rightarrow \alpha \circ F(Init) \subseteq F#(\alpha(Init))$ (red. of $\alpha
    \circ \gamma$ and mon. of $F#$ and $\alpha$)

    $\Rightarrow \gamma \circ F(Init) \subseteq \gamma \circ F#(\alpha(Init))$ (mon.
    $\gamma$)

    $\Rightarrow F(Init) \subseteq \gamma(\alpha(Init))$ (ext. of $\gamma \alpha$)


