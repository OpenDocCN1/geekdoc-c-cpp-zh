  md: '# INVARIANTS AS SEMIALGEBRAIC SETS


    ![](img/8a0fdace52018a374ebad28735935393_80_0.png)


    In order to synthesize a more precise invariant, one can further constrain the
    LMI.


    # 5.2.1.1 Minimizing condition number


    Graphically, the condition number of a positive definite matrix expresses a notion
    similar to that addressed by eccentricity for ellipses in dimension 2. It measures
    how "close" to a circle (or its higher dimension equivalent) the result-ellipsoid
    will be. Multiples of the identity matrix, which all represent a circle, have
    a condition number of 1. Thus one idea of constraint we can impose on $P$ is to
    have its condition as close to 1 as possible. A rationale for this is to have
    one of the "flat" ellipsoids, i.e., having a large condition number, can yield
    a very bad bound on one of the variables, as illustrated in Figure 5.1.


    This is done [23] by minimizing a new variable, $r$, in the following matrix inequality


    ```

    $I \leq P \leq rI$

    ```


    Indeed, if a point $x$ is in the ellipsoid of $P$, then $x^T P x \leq 1$ implies
    $x^T I x \leq 1$, i.e., $x$ is in the sphere of radius 1. Thus, the ellipsoid
    $P$ is included in the sphere of radius $r$. Similarly, $P$ contains the sphere
    of radius $r^{-\frac{1}{2}}$. This way, $P$ is sandwiched between these two spheres
    and making their radius as close as possible will make $P$ as "round" as possible,
    as depicted in Figure 5.2.


    This constraint, along with the others (Lyapunov equation, symmetry, and positive
    definiteness of $P$), can be expressed as an LMI, which is solved using the semidefinite
    programming techniques mentioned in Section 4.2.1:2:


    ```

    minimize \quad r\nA^T P A - P < 0\nsubject to \quad I \leq P \leq rI\nP^T P A
    - rP \leq 0.$

    ```


    Example 5.2. With the following matrix $A$ of the running example


    $A := \begin{pmatrix} 0.9379 & -0.0381 & -0.0414 \ -0.0404 & 0.968 & -0.0179 \
    0.0142 & -0.0197 & 0.9823 \end{pmatrix}$'
