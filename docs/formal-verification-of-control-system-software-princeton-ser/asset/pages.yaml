    \ it intersects with the $-1+0j$ point. As shown in Fig. 7.7, the gain margin\
    \ ($GM$) is precisely $2\\log_{10}\\frac{1}{x}$ where $x$ is the magnitude of\
    \ the Nyquist plot at the phase angle of $\\pi$. For good robustness, a typical\
    \ requirement is a phase margin of at least $30^\\circ$ and a gain margin of at\
    \ least 3db.\n\n> Counterclockwise encirclement counts as negative."
