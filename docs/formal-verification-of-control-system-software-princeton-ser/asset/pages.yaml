    power electric systems with their electronic counterpart, with a huge reduction
    in size and weight.^3


    The drawback of this massive introduction of computers to control systems is the
    lack of predictability for both computer and software. While the industry has
    been accustomed to having access to the precise characteristic of its components,
    e.g., a failure rate for a physical device running in some specific conditions,
    these figures are highly compatible for software, because of the intrinsic complexity
    of computer programs.


    Still, all of us are now used to accepting software licenses where the software
    vendor assumes nothing related to the use of the software and its possible impact.
    These kinds of licenses would be unacceptable for any other industry.


    To conclude with this brief motivation, the aerospace industry, and more generally
    critical embedded systems industries, are now facing a huge increase in the software
    size in their systems. This is motivated by system complexity increases because
    of safety or performance objectives, but also by the need to integrate one more
    advanced algorithms to sustain autonomy and energy efficiency.


    Guaranteeing the good behavior of those systems is essential to enable your.


    Until now, classical means to guarantee good behavior were mainly relying on tests.
    In the aerospace industry the development process is strictly constrained by norms
    such as the DO-178C [104] specifying how to design software and perform its verification
    and validation (V&V). V&V activities requires the verification to be specification-driven.
    For each requirement expressed in the design phases, a set of tests has to be
    produced to argue that the requirement is satisfied. However, because of the increase
    in complexity of the current and future systems, these test-based verifications
    are reaching their limit. As a result of V&V for systems has exploded and the
    later a bug is found, the more expensive it is to solve.^4


    Last, these certification documents as DO-178C have been recently updated, accounting
    for the recent applicability of formal methods to argue about the verification
    of a requirement. Despite this possible lack of results in a general setting,
    these techniques, in cases of success, provide an exhaustive result, i.e., they
    guarantee that the property considered is valid for all uses, including systems
    admitting infinite behaviors.


    All the works presented in this book are motivated by this context. We present
    formal methods stating the verification of controller properties at multiple stages
    of their development. The goal is to define new means of verification, specific
    to controller analysis.


