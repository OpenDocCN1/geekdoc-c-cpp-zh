- pgno: 205
  md: '![](img/8a0fdace52018a374ebad28735935393_205_0.png)


    Figure 10.3. Interior point method algorithm in LP.


    Interior point methods compute a sequence of intermediate feasible solutions.
    Each step is performed by computing a linear direction and a step length, such
    that the next value remains in the neighborhood of the central path while improving
    the objective function cost. This sequence stops when a required precision is
    reached. On a typical implementation the stopping criteria is around $10^{-7}$.


    In contrast to the simplex method, we see clearly that this method will never
    compute the exact solution but is able to approximate it as precisely as required.
    On the good sides, interior point methods can be defined for more general settings
    than linear constraints, for example, on the large set of convex sets (quadratic
    programming, second-order conic programming, semidefinite programming, etc.).
    On the complexity side, the method has a polynomial complexity in the number of
    variables. Typical uses in software work on thousands of variables while efficient
    uses can scale to hundreds of thousands of variables when smartly implemented,
    e.g., on FPGA [135].


    # 10.1.2 Primal-dual feasibility


    Recall the definition of duality in optimization (Section 4.2.3). Among the most
    efficient implementations of interior point methods, primal-dual methods rely
    on the notion of duality gap to measure the distance to the optimal solution.'
