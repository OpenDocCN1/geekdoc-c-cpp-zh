- pgno: 160
  md: 'The exact choice for the input language is dependent on the domain expert''s
    preference and does not affect the utility of the framework as it can be adapted
    to other modeling languages such as SCADE. In the rest of the chapter we assume
    a language such as Simulink for describing models.


    Likewise, for the output language, the choice is likely to depend on the preferences
    of the industry and the certification authority. We choose the language C because
    of its industrial popularity and the wide availability of static analyzers tailored
    for C code, including the Frama-C platform [108] from CEA and its weakest precondition
    analyzer: WP.


    The set of annotations in the output code contains both the functional properties
    inserted by the domain expert and the proofs that can be used to automatically
    prove these properties. The analysis of the annotated output could be performed
    using the formal verification tool Frama-C and the theorem prover PVS. In order
    to support the automatic proof-checking of the annotated output, a set of linear
    algebra definitions and theories were integrated into the standard NASA PVS library
    [114].


    In this chapter, the fully automated process from the input model to the verified
    output is showcased for the property of closed-loop stability, the expression
    of other functional properties on the model could also be developed. At this point,
    we restrict the input to only linear controllers with possible saturation in the
    loop. For this presentation, examples are related to the spring-mass damper introduced
    in Section 3.2. However, we have applied the approach to several larger systems,
    which include the Quancer 3-degree-of-freedom helicopter, an industrial F/A-18
    UAV controller system and a FADEC control system for a small jet turbofan engine
    [126]. The state-space size of the FADEC, for example, is 15.


    In the next three sections, we develop our approach on expressing and manipulating
    control-level semantics at the model in Simulink (see Section 8.1.2), at the code
    level in C (see Section 8.1.3), and as PVS predicates for the proper proof (Section
    8.1.4).


    # 8.1.2 Control semantics in Simulink: ellipsoid-based synchronous observers


    When considering synchronous dataflow language a convenient approach to formalize
    their intended semantics is to rely on synchronous observers [22, 117]. These
    observers are defined using the modeling language and are included in the description
    of the system. These are blocks that, depending on internal signals of the system,
    compute a Boolean output. A valid observation while a violation of the encoded
    property will produce a negative one. These blocks characterize a projection,
    an observation, of the behavior of the system and therefore denote an axiomatic
    semantics. Synchronous observers can range from simple observation to complex
    systems in which the block defining the observer is itself defined by numerous
    subsystems including memories.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'These observers can be used for verification and validation. When relying on
    tests, one can evaluate the output of the block, acting as a test oracle for the
    encoded property. When performing properly, the goal is to prove that the output
    of the block is always positive, for all reachable states.


    Concerning system-level properties, as we saw in the previous chapter, both boundedness
    and stability can be expressed with a synchronous observer with inputs $x_i,i=1,\dots,n$,
    and the Boolean-valued function


    ```

    $x \to \sum_{i=1,\dots,n} x_i P_{ij} x_j \le \mu.$

    ```


    This synchronous observer is parametrized by a symmetric matrix $P$ and a multiplier
    $\mu$.


    For expressing the ellipsoid observers on the Simulink block, we constructed a
    custom S block denoted as *Ellipsoid* to represent the ellipsoid observer. Additionally,
    for expressing the operational semantics of the plant, we constructed a custom
    S block denoted as *Plant*. Its semantics is similar to Simulink''s discrete-time
    state-space with two key features. One is that the *Plant* block contains both
    the input and output of the plant. The other is that the output from *Plant* contains
    the internal states of the plant. These variables are used to characterize the
    current state and are inputs to the ellipsoid observer.


    Other properties can also be expressed as non-expansivity from the dissipativity
    framework. The *Non-Expansivity* block, when connected with the appropriate inputs
    and outputs, can be used to express a variety of performance measures such as
    the $H_{\infty}$ characteristic of the system or the closed-loop vector margin
    of the control system. An example of such use is shown in Figure 8.2 where the
    closed-loop margin of a constant gain controller is expressed using a combination
    of the *Plant* block and the *Non-Expansivity* block.


    In this chapter, we focus on the current fully automated treatment of the open-loop
    stability properties, we will not consider the semantics displayed in Figure 8.2
    beyond this description here.


    For the running example, we have a Simulink model connected with two synchronous
    observers. The observers are displayed in the top part of the block for clarity''s
    purpose.


    Recall that we made the following assumption for the quantity $y-d$:


    ```

    $\|y-d\ \le 0.5,$

    ```


    which is expressed in Figure 8.3 by the Ellipsoid *BoundedInput* with the parameters
    $P=0.5$ and multiplier $\mu=0.0009$. The stability proof is expressed in Figure
    8.3 by the Ellipsoid *Stability* with the parameters $P=4.28 \times 10^{-4}$ $\quad
    4.28 \times 10^{-5}$ $\quad 2.4651 \times 10^{-3}$ and $\mu=0.9991$. The observer
    blocks in Figure 8.3 are connected to the model using the *VaMux* block. The role
    of the *VaMux* block is to concatenate a set of scalar inputs into a single vector'
