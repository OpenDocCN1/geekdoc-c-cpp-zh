- pgno: 206
  md: '# CONVEX OPTIMIZATION


    When manipulating matrix variables, the inequality (4.28) can be rephrased on
    the Hilbert space of positive definite matrices:


    ```

    $d^* = \max x (c, X) \leq p^* = \min y (y, b)\ns.t. \quad AX=b\ns.t. \quad -c-A''y=Z
    \quad (10.3)\nX X\geq 0 \quad Z\geq 0$

    ```


    where $d^*$ and $p^*$ denote, respectively, the dual and primal solutions.

    The distance between two feasible points of primal and dual problems is called
    the duality gap:


    $$(c, X) + (y, b).$$


    The barrier function of the method is then characterized using the central path
    expression as the combination of the analytical center of both primal and dual
    problems, and the duality gap as the objective function to minimize.

    However, it may happen that either the primal or the dual problem are ill-defined:
    they can be unfeasible or unbounded, i.e., $d^* = \infty$ or $p^* = -\infty$.
    According to duality theorem, if both primal and dual solutions are finite, then
    both problems are feasible. Otherwise, either the primal solution is unbounded
    and its dual unfeasible, or the dual solution is unbounded and the primal unfeasible.


    # 10.1.3 Issues


    These convex optimization methods have now reached sufficient maturity and are
    now used in a large set of contexts. However, for their specific use in formal
    verification, one needs to cope with the following issues:


    +   1. In contrast to simplex methods, these methods never reach the optimal value.
    However, they admit an exponential convergence and could reach an arbitrary precise
    solution. On the positive side, the computed suboptimal solution, as well as all
    intermediates of Phase II, are feasible solutions of the set of constraints. Therefore,
    when the objective function is not crucial as it is when we synthesize our invariants
    with these techniques these solutions can be used safely.


    +   2. Because of floating-point errors, the actual $\epsilon$-optimal solution
    may be (slightly) an unfeasible solution. This is particularly difficult when
    manipulating equality constraints.


    While neglected, this second issue also has to be addressed in our formal framework.
    This is of great importance since we rely on computed solutions to bound the behavior
    of the analyzed systems. In case of SOS programming, the underlying SDP matrix
    is associated to a set of equality constraints enabling the characterizing of
    the positive polynomial. The reconstruction of such solution with floating-point
    arithmetics also has to be addressed in a formal way.'
  merge: -1
  img_proc: true
