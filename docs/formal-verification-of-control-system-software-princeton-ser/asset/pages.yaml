- pgno: 54
  md: '# Chapter Four


    # Definitions—Background


    THIS PART FOCUSES on the computation of nonlinear numerical invariants for discrete
    controllers. As mentioned in the motivation part, controllers are usually designed
    in a continuous setting and then discretized; in both cases a semantics in the
    real field is assumed. The semantics of interest, in this context, is then a discrete
    dynamical system with a real semantics. Then, those simple controllers are combined
    with simple mechanisms such as switches, interpolation of gains, saturations,
    anti-wwinds, etc. In order to be able to analyze systems as complex as the ones
    embedded in aircraft, we consider semantics including piecewise behaviors.


    Regarding the analysis of those semantics, an initial natural approach is to apply
    abstract interpretation on controller programs. However, a long known result for
    control people can be stated as: “stable linear controllers admit Lyapunov functions."
    Unfortunately, most state-of-the-art abstract abstract states through linear properties.
    Furthermore, the current trend is to compute even weaker abstractions, as octagons
    [62], to control the complexity of the abstractions and obtain nontrivial results
    in reasonable time. When manipulating nonlinear abstractions, the Kleene based
    approach to fixpoint computation does not seem to be very efficient or appropriate:
    nonlinear subspaces are not easily fitted with a lattice structure-in other words
    a least upper bound operator was not as obvious as it is for finite sets of convex
    polyhedra or intervals. Following the path of control scientists the approaches
    supported in this book choose to rely on numerical tools, in this case on convex
    optimization, to solve the so-called Lyapunov equations.


    The current chapter presents the formalisms describing discrete dynamical systems
    and gives an overview on the convex optimization tools and methods used to compute
    the analyses.


    # 4.1 DISCRETE DYNAMICAL SYSTEMS


    A dynamical system is a typical object used in control systems or in signal processing.
    In some cases, it is eventually implemented in a program to perform the desired
    feedback control to a cyber-physical system.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "# Definition 4.1 (State Space). Let $\\Sigma$ be the state space, a set of\
    \ states.\n\nA dynamical system computes an infinite sequence of states $\\Sigma$\
    \ starting from an initial state $i : \\Sigma \rightarrow X^{In} \\subset \\Sigma$.\
    \ The dynamics of the system is defined by a function $f : \\Sigma \rightarrow\
    \ \\Sigma$. In some cases, the dynamics are also perturbed—depending on the point\
    \ of view—by an external signal, $i.e.$, sequences of values. Let us call these\
    \ inputs $u \\in X^{In}$. The system map is then defined as $f : \\Sigma \times\
    \ X^{In} \rightarrow \\Sigma$. Let $\\Sigma$ be the state-space defined by $\\\
    Sigma \times X^{In}$.\n\n# Definition 4.2 (Trajectory). A trajectory of the system\
    \ is defined by an initial state $init \\in X^{In}$ and an infinite sequence of\
    \ inputs $(u_k)_{k \\geq 0} \\in X^{In}$:\n\n```\nx_0 = init\nx_{n+1} = f(x_n,\
    \ u_n);\n```\n\nLanguage-wise, model-based languages such as LUSTRE [18], ANSYS\
    \ SCADE, or MATLAB Simulink provide primitives to build these dynamical systems\
    \ or controllers relying on simpler constructs. In terms of programs, dynamical\
    \ systems can easily be implemented as a *while true loop* initialized by the\
    \ initial state and performing the update $f$. The simplest systems are usually\
    \ directly coded in the target language, e.g., C, while more advanced systems\
    \ are compiled through autoders: LUSTRE compilers, SCADE KCG, or MATLAB Embedded\
    \ Coder (ex-Real Time Workshop RTW).\n\nLet us sketch a typical implementation:\
    \ the variable $u$ is being read from an external source, e.g., as a mutable variable\
    \ or an IO call.\n\nx = i;\nwhile true {\nu = read();\nx = f(x, in);\n}\n\nMost\
    \ systems perform an action at each computation step. In the case of controllers,\
    \ the action typically moves some actuators in order to impact the controlled\
    \ system. This generates an output signal, $y \\in X^{Out}$. This output is computed\
    \ by a function $g : \\Sigma \times X^{In} \rightarrow X^{Out}$.\n\n```\nx = i;\n\
    while true {\nin = read();\nx = f(x, u);\ny = g(x, u);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 56
  md: "# DEFINITIONS—BACKGROUND\n\nA discrete dynamical system is then defined by\
    \ the following sets $\\Sigma, X^{Init}$, $X^{In}, X^{Out}$ and functions $f,\
    \ g$.\n\nIn the following, we specialize this description depending on the considered\
    \ sets and functions: linear systems, piecewise linear systems, and polynomial\
    \ ones.\n\nAgain, these descriptions are provided at the model level or could\
    \ be extracted from the implementation [129]. In order to simplify this extraction\
    \ process, or to understand it more easily, we assume without loss of generality\
    \ that the analyzed programs are written in Static Single Assignment (SSA) form,\
    \ that is, each variable is initialized at most once.\n\nAs a last remark, since\
    \ we are first interested only in the internal state $x$ of the system, the output\
    \ part is often neglected.\n\n# 4.1.1 Linear systems\n\nThe simplest systems are\
    \ composed of a single loop and a linear update. While they could seem overly\
    \ simple to the non-expert, most controllers are linear, from rocket stabilization\
    \ controllers to aircraft controllers or satellite attitude and orbital control\
    \ systems (AOCS).\n\nThe basic controller literature mentions proportional controllers\
    \ (P), proportional derivative (PD), or proportional-integral-derivative (PID)\
    \ ones. In all cases, these are linear controllers. In order to obtain more precision,\
    \ the order of the linear controller, i.e., the size of its state space $\\Sigma$,\
    \ could be extended, considering a more complex system.\n\nA linear controller\
    \ is typically implemented by the following code, for a system with $\\Sigma=R^2$\
    \ and $X^{In}=X^{Out}=R$:\n\n```\nx0 = i0;\nx1 = i1;\nwhile true {\n  read();\n\
    \  nx0 = a00 * x0 + a01 * x1 + b00 * in;\n  nx1 = a10 * x0 + a11 * x1 + b10 *\
    \ in;\n  y = c00 * x0 + c10 * x1 + d00 * in;\n  x0 = nx0;\n  x1 = nx1;\n}\n```\n\
    \nIn all systems, assignments of variables are performed using only parallel assignments.\
    \ At the implementation level, this imposes to keep a copy of the variable values\
    \ before the final updates $x_i=nx_i$."
  merge: -1
  img_proc: true
