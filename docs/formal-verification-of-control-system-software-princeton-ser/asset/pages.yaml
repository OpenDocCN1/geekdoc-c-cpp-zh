    output of the plant.


    # 8.1.4 Control semantics in PVS


    Through a process described in Section 8.3, verifying the correctness of the annotated
    C code is done with the help of the interactive theorem prover PVS. This type
    of prover relies on a human in the loop to provide the basic steps required to
    prove a theorem. In order to reason about control systems, linear algebra theories
    have been developed. General properties of vectors and matrices, as well as theorems
    specific to this endeavor, have been written and proven manually within the PVS
    environment.


    # 8.1.4.1 Basic types and theories


    Introduced in [114] as part of the larger NASA PVS library, the PVS linear algebra
    library allows one to reason about matrix and vector quantities, by defining relevant
    types, operators, and predicates, and proving major properties. To name a few:


    +   * A vector type

    * A matrix type, along with all operations relative to the algebra of matrices

    * Various matrix subtypes such as square, symmetric, and positive definite matrices

    * Block matrices

    * Determinants

    * High-level results such as the link between Schur’s complement and positive
    definiteness


    In [114], a theorem was introduced, named the ellipsoid theorem. In proving a
    stronger version of this theorem, along with a couple other useful results in
    proving loop stability of a controller, have been added to the library. The first
    theorem, presented in Fig. 8.4, expresses in the PVS syntax how a generic ellipsoid
    $G_Q$ is transformed into $G_{QM}$ by the linear mapping $x \mapsto Mx$. A second
    theorem, presented in Fig. 8.5, expresses, given vectors $x$ and $y$ in 2 ellipsoids
    $G_1$, and $G_2$, and multipliers $\lambda_1, \lambda_2 > 0$, such that $\lambda_1
    + \lambda_2 \leq 1$, it can be said


    ```

    $$(x \ y)^T \in G_Q, \text{ where } Q = \begin{pmatrix} \lambda_1 & 0 \ 0 & \lambda_2
    \end{pmatrix}$$

    ```'
