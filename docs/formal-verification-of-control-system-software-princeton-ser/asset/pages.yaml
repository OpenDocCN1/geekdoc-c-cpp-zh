  md: '# Definition 5.15 (Sublevel Property). Given a polynomial function $k \in \mathbb{R}[x]$
    and $\alpha \in \mathbb{R} \cup \{+\infty\}$, we define the sublevel property
    $P_{k,\alpha}$ as follows:


    $P_{k,\alpha} := \{x \in \mathbb{R}^d \mid k(x) < \alpha\}$


    where $\ll$ denotes when $\alpha \in \mathbb{R}$ and denotes $<$ for $+\infty$.
    The expression $k(x) < +\infty$ expresses the boundedness of $k(x)$ without providing
    a specific $\alpha$.


    # Example 5.16 (Sublevel properties). When one wants to bound the reachable values
    of a system, we can try to bound the $\ell_2$-norm of the system: $P_{k,\infty}$
    with $k(x) = \|x\|^2$. The use of $\alpha = \infty$ does not impose any bound
    on $k(x)$.


    Similarly, it is possible to check whether a specific bound is matched by either
    globally using the $\ell_2$-norm or a specific $\alpha$: $P_{k_i,\alpha}$, or
    bounding the reachable values of each variable: $P_{k_i,\alpha_i}$ with $k_i :mapsto
    x_i$; and $\alpha_i \in \mathbb{R}$.


    Avoiding regions. If the bad region can be encoded as a sublevel property $k(x)
    \le 0$ then its negation $-k(x) \le 0$ characterize the avoidance of that bad
    zone. For example, if one wants to prove that the square norm of the program variables
    is always greater than 1, then we can consider the property $P_{k,\alpha}$ with
    $k(x) = 1-\|x\|^2$ and $\alpha = 0$.


    A sublevel property is called sublevel invariant when this property is an inductive
    invariant of the discrete dynamical system collecting semantics $\mathcal{C}$.
    In that case, the sublevel property itself would be an appropriate abstraction
    of the system. However, this is not the case in general. We propose to constrain
    the search for an inductive polynomial invariant guided by this sublevel property.


    # 5.5.2 $P_{k,\alpha}$-driven inductive polynomial invariant


    In this subsection, we explain how we adapt the constraints of Equation (5.52)
    to compute a $d$-variant polynomial $p \in \mathbb{R}[x]$ and a bound $w \in \mathbb{R}$,
    such that the polynomial sublevel sets $P := \{x \in \mathbb{R}^d \mid p(x) \le
    0\}$ and $P_{k,\alpha}$ satisfy:


    > $\mathcal{C} \subseteq P_{k,\w} \subseteq P_{k,\alpha}. \quad (5.53)$


    The (from the first) inclusion forces $P$ to be valid for the reachable values
    sets. The second inclusion includes all elements of $P$ to satisfy the sublevel
    property for a certain bound $w$. The last inclusion requires that the bound $w$
    is smaller than the desired level $\alpha$. When $\alpha = \infty$, any bound
    ensures the sublevel property.


    We derive sufficient conditions on $p$ and $w$ to satisfy Equation (5.53). Thanks
    to Equation (5.52), the first inclusion holds: $\mathcal{C} \subseteq P$.'
