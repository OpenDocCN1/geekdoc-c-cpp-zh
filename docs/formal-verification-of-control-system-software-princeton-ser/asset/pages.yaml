  md: '# 6


    # CHAPTER 1


    The proposal is mainly developed in two complementary directions:


    +   - nonlinear invariant synthesis mainly based on the use of convex optimization
    techniques;


    +   - consideration of system-level properties on discrete representation, at
    code level, with floating-point semantics.


    This book is structured in four parts:


    Part I introduces formal methods and controller design. It is intended to be readable
    both by a control scientist unaware of formal methods, and by a computer scientist
    unaware of controller design. References are provided for more scholastic presentations.


    Part II focuses on invariant synthesis for discrete dynamical systems, assuming
    a real semantics. All techniques are based on the computation of an inductive
    invariant as the resolution of a convex optimization problem.


    Part III revisits basic control-level properties as numerical invariants. These
    properties are typically expressed on the so-called closed-loop representation.
    In these chapters we assume that the system description is provided as a discrete
    dynamical system, without considering its continuous representation with ordinary
    differential equations (ODEs).


    Part IV extends the previous contributions by considering floating-point computations.
    A first part considers that the program analyzed is executed with floating-point
    semantics and searches for an inductive invariant considering the numerical errors
    produced. A second part ensures that the use of convex optimization, a numerical
    technique, does not suffer from similar floating-point errors.'
  merge: -1
