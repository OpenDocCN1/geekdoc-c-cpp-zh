  md: '# Chapter Two


    # Formal Methods

    Different Approaches for Verification


    WHILE TESTING IS A COMMON practice for a lot of engineers as a way to evaluate
    whether the program they developed fulfils its needs, formal methods are less
    known and may require a little introduction to the non-expert. This chapter can
    be easily skipped by the formal verification reader but should be a reasonable
    introduction to the control expert engineer.


    In this chapter we give a brief overview of some of these formal methods and their
    use in the context of critical embedded systems development. We first define the
    semantics of programs: their basic properties and their meaning. Then, we outline
    different formal verifications and explain how they reason on the program artifact.
    A last part addresses the soundness of the analyses with respect to the actual
    semantics.


