  md: '![](img/8a0fdace52018a374ebad28735935393_207_0.png)


    Figure 10.4. Floating-point errors with interior point methods.


    # 10.2 GUARANTEED FEASIBLE SOLUTIONS WITH FLOATS


    As we saw in the preceding figures, the optimal value of a linear objective function
    with respect to a set of convex constraints is always on the frontier of the convex
    set. In SDP optimization this could be mapped to the search of the point $Q$ within
    the ellipsoid characterized by the set of constraints $X \geq 0$, i.e., $\forall
    x \in \mathbb{R}, x^T X x \geq 0$.


    Because of floating-point errors, the computed value could be outside the set
    of constraints, giving an unfeasible, and therefore unsound, solution $Q$.


    # 10.2.1 Computation over a constrained cone


    Since these path-following algorithms never actually reach the optimal value but
    stay within the interior of the set of constraints, the stopping criteria depends
    on the achievement of a given precision, typically a duality gap of $10^{-7}$.
    Without any formal result, remark that for all $|x| < 10^P, |x|^2 < 10^{2P}$,
    when computing with a precision of 16 digits, i.c., $ulp(1)=10^{-16}$, half the
    digits are lost by the quadratic form, leading to an imprecision of $\sqrt{|(10^{16})}
    = 10^{-8}$ for $Q$.


    A heuristic to ensure remaining within the interior of the set of constraints
    is to pad the convex constraint by this precision of $10^{-8}$. Figure 10.5 presents
    such a constrained set of cones. One can ensure that the floating-point value
    still remains within the convex set.


    This padding may fail when the set of constraints admit an empty interior, which
    cannot be padded. This happens typically for our invariant search when the dynamic
    considered admits fixpoints; Let us consider the dynamics $f$ and $x_{fp}$ such
    as fixpoint; our search for an inductive invariant $v$ will lead to a constraint
    of the form:


    ```

    $v f - v \leq 0$.

    ```'
