  md: '# CONTROL SYSTEMS


    # 33


    system, the closed-loop system, is analyzed with respect to stability, robustness,
    and performance. Stability and robustness capture the damping of the system, its
    ability to converge to goal even in the presence of noise in the feedback loop.
    Performance evaluates the speed of convergence and the shape of the feedback response
    (overshoot, number of oscillations, settling time, etc.).


    # DISCRETIZATION


    This controller is meant to be embedded in an onboard computer and to interact
    with the system sensors and actuators. Depending on the speed of each of these
    devices, and the available computing resources, an appropriate rate of discretization
    is chosen. For example, a typical control law for an aircraft runs at 100Hz. But
    a trajectory planning controller may run at a much lower speed.


    # COMPLETE CONTROLLERS


    Once a discrete controller has been obtained for a linearized version of the plant,
    a more global one is obtained by combining local controllers. One of the approaches
    is to synthesize a controller for each linearization point while keeping the same
    controller synthesis method. Since the previous steps characterize single input
    output (SISO) subcontrollers, it is easy to switch the controller depending on
    the input value. When considering an intermediate value between two linearizations,
    one can characterize the linear interpolation of controller gains, the coefficients
    synthesized for each local controller.


    Moreover, additional constructs are introduced to account for divergence of integrators
    in case of a break in the closed-loop system. Saturations or anti-windups act
    as such and enable the output to remain within given bounds.


    # INTEGRATION: SAFETY ARCHITECTURE


    In critical applications the controller will not be directly embedded on the target
    platform but rather used in conjunction with a safety architecture used to obtain
    a fault tolerant system.


    This safety architecture is usually identified before the design of the controller
    itself it identifies early in the process development the potential causes of
    failure and their impact on the various systems. These failures can range from
    faulty parts as sensors generating false data, a transient error such as a single
    event upset (SEU) or multiple bits upset (MBU), or a bug in a software.


    This leads to local impacts at the control level with the fusion of input data
    in redundancy in the sensors: validators, alarm detection, voters, etc. The alarm
    detection mechanisms typically check that the read value lies in an expected range
    and emit different kinds of alarm signals when a value outside the legal scope
    is detected.


    Figure 3.2 presents an example of such architecture with triplicate


    At the system level, more complex safety patterns allow the execution of the controller
    in a distributed fashion, on multiple computers. These different computers'
