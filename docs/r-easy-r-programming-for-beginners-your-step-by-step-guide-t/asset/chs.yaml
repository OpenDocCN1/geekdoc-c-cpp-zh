  \ `R` 的功能。\n4. 你学习了在 `R` 中工作的各种入门方法。我们涵盖了多种主题，如算术基础、如何在 `Vectors`（向量）中组织数据、如何处理逻辑向量、处理文本、`vector`\
  \ 与 `matrix`、`data frames`（数据框）以及 `lists`（列表）的创建。\n5. 你学习了如何在 `R` 中高效编写代码。我们讨论了如何利用\
  \ `functions` 高效自动化你的工作、如何智能地利用 `arguments`、如何控制 `Logical Flow`（逻辑流）、如何循环不同的值，以及如何有效地调试你的\
  \ `Code`。\n6. 你学习了高效处理数据的各种方法。我们讨论了如何将数据导入导出 `R`、如何有效地操作和处理你的数据，以及如何对数据进行汇总。\n7.\
  \ 你学习了如何处理 `Graphics`（图形）。我们还讨论了如何使用基础图形，以及如何使用 `Lattice` 创建分类图形（Facetted Graphics）。\n\
