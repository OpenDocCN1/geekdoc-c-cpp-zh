- "# R：初学者 R 编程指南，R 语言学习步步进指南（R 编程系列）\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\n## 致谢\n\
  \n首先，我要感谢上帝赋予我知识和灵感，让我能够完成这本丰富信息的书籍。我也感谢我的父母、兄弟以及我的伴侣 Silvia 的支持。\n\n\n\n\n\n##\
  \ 引言\n\n你好！感谢你下载本指南！\n\n你已经在学习 R 编程语言的上迈出了关键的一步。在这份一步步的初学者指南中，你将学习如何掌握这种精妙的开源编程语言的基础，包括向量、数据框和列表。\n\
  \n全球拥有超过 200 万用户，R 语言正在迅速成为数据科学和统计领域的顶尖编程语言。R 语言的用户数每年增长 40%，越来越多的机构在他们的日常活动中使用这种语言。\n\
  \n现在，对于某些人来说，R 语言最初可能会非常令人敬畏。其实，这并非本质，并不是因为它比其他语言复杂得多，而是因为 R 编程的语法与其他几种编程语言非常不同。许多专业编程语言编写者发现\
  \ R 很难！根据他们的话，R 实际上非常简单，只是它不传统。而且，在本指南的帮助下，你不仅将获得高效学习 R 语言的所有关键知识，还将准备好进行自己的初步数据分析。\n\
  \n我叫 Felix Alvaro，是一个充满激情且经验丰富的 Web 设计师兼程序员、导师、企业家和作者。我的使命是通过我的书籍分享我的经验和知识，激励并鼓励你实现未来的所有目标。\n\
  \n无论你是否精通任何其他编程语言，无论你是否仅仅是一个初学者，你都选择了学习 R 语言的正确指南。我可以向你保证，这份逐步指南将极地帮助你掌握 R 语言的基础，R\
  \ 是开源、免费、强大且极具扩展性的。\n\n一旦你读完整本书，你将会发现学习 R 是多么简单！在这份指南中，我层层剥开了环绕着 R 编程的所有神秘面，以便大家都能轻松、快速地掌握一切。\n\
  \n所以，废话不再说，让我们开始开始吧！\n\n在第一章中，我们将讨论 R 编程的简要历史、R 编程到底是什么，以及使用 R 语言的好处。\n\n## 第一章：R\
  \ 编程简介\n\n全球拥有超过 200 万用户，R 语言正在迅速成为数据科学和统计领域的顶尖编程语言。自从它在 20 世纪 90 年代作为一种“学术演示语言”诞生以来，R\
  \ 语言已经迅速发展和扩展。R 语言的用户数每年增长 40%，越来越多的机构在他们的日常活动中使用这种语言。\n\n### R 的简史\n\nR 语言是由新西兰奥克兰大学的两个同事在\
  \ 20 世纪 90 年代期间创建并开发的——Ihaka 和 Gentleman。他们都非常熟悉 `S` 语言（S 是一种统计语言），他们决定使用类似的语法，因此为学生创建了免费的\
  \ `R`。\n\n### R 发展的里程碑年份\n\n*   1990 年代：R 被创建并开始开发。\n*   1993 年：`R 编程`首次在 `S-news`\
  \ 邮件列表上公布。从那时起形成了一批活跃的邮件列表。\n*   1995 年：Martin Gentleman 说服整个小组将 R 语言代码变为自由软件。此后，R\
  \ 语言代码根据自由软件基金会的 GNU 通用许可证许可。\n*   1997 年：成立了第一个 `R 开发核心团队`。\n*   2000 年初：`R 语言`的初始版本\
  \ (`v1.0.0`) 发布。\n\n### 什么是 R 编程？\n\n`R` 是一种编程语言，被许多科学家、数据分析师和众多统计学家用于分析数据库并进行统计审查。\n\
  \n`R 语言` 是分析海量数据的工具。如果你的工作涉及海量数据（海量数据库和文件），你可以利用 `R` 获取你的数据并对其进行某些处理。`R` 带有许多可以下载的扩展包，这些包甚至允许你在分析数据时简化或扩展各种命令。\n\
  \n\n\n\n\n`R-Development-Core-Team` 付出了巨大的努力，并在让 R 兼容各种软件和硬件方面投入了大量精力。因此，R 现在已适用于\
  \ Mac、Windows 和 UNIX 系统。\n\n## R 具有扩展性\n\nR 是一门强大的语言，可以执行许多功能，例如图形绘制、统计分析以及海量数据库的操作。然而，R\
  \ 的一个巨大优势是它具有极强的扩展性。各种程序员可以轻松地编写自己的软件，然后将其以插件包（add-on-packages）的形式分发。由于制作此类插件包非常简单，事实上存在成千上万这样的包。在现实中，许多新的统计分析技术通过\
  \ R 包的形式发布出来。\n\n## R 提供了一个活跃的群体\n\nR 的用户群体正在迅速崛起。许多使用 R 的个人会逐渐开始帮助新用户，并在他们的认证领域和工作场所推广\
  \ R 的使用。偶尔，他们倾向于在 R 邮件列表或问答（question & answer）网站（例如 `Stack-Overflow`）上活跃。除了这些邮件列表和问答网站外，他们甚至加入了各种社交网络，例如\
  \ Twitter、Face-book 以及各种省级的 R 用户论坛。\n\n## R 有效地与其他编程语言连接\n\n随着越来越多的人转向使用 R 进行数据分析，他们开始尝试将\
  \ R 与其现有的工作流合并。这导致了一系列用于连接 R 与各种数据库、文件系统以及许多其他应用程序的包。从那时起，几个此类包已与 R 有效链接。例如，`R-package-foreign`\
  \ 是 `Standard-R-distribution` 的组成部分，它允许你解释来自 `Statistical-Packages`（如 SAS、SPSS、STATA\
  \ 等其他）的数据。还有许多插件包用于将 R 连接到各种数据库系统，例如 `RODBC package` 用于利用 `ODBC`（开放数据库连接协议）解释数据，以及\
  \ `ROracle package` 用于解释 `Oracle databases`。\n\n## R 处理的范围不仅限于统计学\n\nR 最初由统计学家创建并开发，目的是为了简化整个统计流程。这种传承仍在延续，它使\
  \ R 变成了一个非常强大的工具，可以执行几乎任何统计计算。自从 R 开始偏离其在统计学中的起源而发展以来，许多通常宁愿自称为软件程序员而非统计学家的人开始参与到\
  \ R 中。因此，R 现在非常适用于广泛的非统计任务，包括图形可视化、数据处理以及各种数据审查。R 被有效地应用于遗传学、金融、自然语言处理、市场研究和生物学等多个领域。\n\
  \n在本章中，我们讨论了 R 语言的简史、究竟什么是 R 编程，以及使用 R 语言的优势。\n\n---\n\n如何安装 R 和 R Studio、开始 R 编程的正确代码编辑器、如何使用你的代码编辑器、初始\
  \ R 会话、如何加载脚本以及导航工作空间的方法。\n\n# 第二章：如何开始？\n\n在本章中，我们将讨论如何安装 R 和 R Studio、开始 R 编程的正确代码编辑器、如何使用你的代码编辑器、初始\
  \ R 会话、如何加载脚本以及导航工作空间的方法。\n\n### 如何安装 R 和 R Studio？\n\n在使用 R 之前，你首先必须安装 R。而且，尽管你可以使用内置的代码编辑器，但你可能还希望安装一个具有高级功能的编辑器。由于\
  \ R Studio 运行在每个平台上并与 R 无缝衔接，我们还将谈论 R Studio 的安装。\n\n### 安装 R\n\n安装 R 并不复杂；但为了对其进行微调以符合你的需求需要一些说明。你可以在\
  \ `CRAN`（全面 R 归档网络）站点找到所有必要的安装文件以及关于安装过程的所有所需细节。选择你优选操作系统（OS）的链接，这将带你进入下载站点获取最新的\
  \ R 分发。要获取所有全面的安装信息，请登录 (`https://cran.r-project.org/doc/manuals/R-admin.html`)。\n\
  \n以下是 Windows 用户的安装步骤：\n\n*   访问 `CRAN`（`CRAN`;`https://cran.r-project.org/`）。\n\
  *   点击 `Download R for Windows` 选项。\n\n![Rinstall.jpg](img/00001.jpeg)\n*   之后点击\
  \ `Base` 选项，获取（下载）最新版本的 R `Installer File`。\n\n![base.jpg](img/00002.jpeg)\n*  \
  \ 然后右键点击 `Installer File` 并选择 `Run-as-Administrator` 选项。\n\n![Run.jpg](img/00003.jpeg)\n\
  *   选择你喜欢的语言，将用于整个安装过程。现在，这一步不会改变 R 语言，所有的帮助文件和消息将继续以英文显示。\n*   仔细遵循所有指令。你甚至可以选择所有默认设置，这些设置是安全可靠的，并一直点击\
  \ `Next` 按钮直到 R 开始安装。\n\nR 适用于 64 位和 32 位 Windows 版本。如果你拥有 64 位 Windows 系统，你可以简单地安装两个版本。`Installer\
  \ File` 也会执行此任务。对于其他版本，如果你需要额外的内存，可能需要 64 位的。\n\n### 对于 Linux & Mac 用户\n\n对于那些拥有\
  \ Linux 和 Mac 的用户，特别建议他们在登录 `CRAN` 站点时仔细阅读说明和信息。R 可以轻松地安装在每个系统中；但根据你的系统版本，你可能需要遵循特定的指令来安装\
  \ R。\n\n### 安装 R Studio\n\nR Studio 版本是一个相当新且良好的 R 编辑器。通常，它被高度推荐因为它非常易用。它拥有良好的支持系统，带有良好的\
  \ `Help-page` 并能够集成 R。\n\n以下是安装 R Studio 的简单步骤：\n\n*   登录 [`www.rstudio.com/products/rstudio2/`](https://www.rstudio.com/products/rstudio2/)。\n\
  *   然后点击 `RStudio Desktop` 按钮。\n\n![Rstudio.jpg](img/00004.jpeg)\n*   根据你的系统版本选择\
  \ `Installer file`。\n*   接下来点击 `Run` 选项。\n\n随后，R Studio 将安装在你的特定系统中。R Studio 默认检测你新安装的\
  \ R 版本，你可以在 R Studio 内部使用 R。此外，你不需要任何额外的配置。\n\n### 开始 R 编程的正确代码编辑器有哪些？\n\n要开始 R\
  \ 编程，你需要一个编辑工具。现在，你使用的任何编辑工具在某种程度上取决于你的操作系统，因为 R 本身没有为任何操作系统提供特定的图形编辑器。主要的 R 安装提供了以下内容：\n\
  \n*   对于 Windows 版本：一个名为 `R Gui` 的编辑器。\n*   对于 Mac OS X 版本：一个名为 `R.app` 的编辑器。\n\
  *   对于 Linux 版本：Linux 版本没有精确的编辑器；但是，你可以使用其他编辑器，如 `Emacs` 或 `Vim`。\n\n\n\n\n\n事实上，各种操作系统（OS）之间的这些差异几乎无关紧要，因为\
  \ R 从根本上是一门编程语言，可以在所有这些不同的操作系统上高效地理解你的代码。\n\n### 其他 R 编辑器选项\n\nR 让你完全自由地选择你自己的代码编辑器和开发设置。你完全没有强制要求使用典型的\
  \ R 编辑器或 `R Studio`。\n\n以下是你可以考虑的几个替代方案：\n\n*   **ESS (Emacs Speaks Statistics)**：Emacs\
  \ 是一个非常优秀的文本和代码编辑器，在全球范围内 Linux 系统中被广泛使用。它甚至适用于 Windows 版本。ESS 拥有全球粉丝群，并因对几乎所有可以执行的操作提供的键盘快捷键而闻盛名。所以，如果你是一个\
  \ Linux 程序员，那么 Emacs 编辑器可能是你的不错选择。请访问 ([`ess.r-project.org/`](http://ess.r-project.org/))\
  \ 获取更多信息。\n*   **Eclipse StatET**：这是另一个高度集成的开发设置，带有一个名为“StatET”的“R 插件”。因此，如果你已经完成了大型任务的软件开发工作，那么\
  \ Eclipse 可能是你的不错选择。你需要在系统中安装 Java。访问 ([`www.walware.de/goto/statet`](http://www.walware.de/goto/statet))。\n\
  *   **Tinn-R**：Tinn-R 专为与 R 协作而开发，目前仅适用于 Windows 版本。Tinn-R 具有某些优秀功能，允许你在任务中设置 R\
  \ 脚本集合。与 Emacs 和 Eclipse 编辑器相比，它的安装和使用非常简单；然而，它确实缺少许多功能。访问 ([`www.sciviews.org/Tinn-R`](http://www.sciviews.org/Tinn-R))。\n\
  \n### 如何使用你的编辑器？\n\nR 是一门编程语言，而不是一个应用程序。这意味着用户完全自由地选择自己的编辑工具来进行 R 编码。现在，我们将讨论 Windows\
  \ 版本的 R 编辑器，即 R 图形用户界面 (`R Gui`)。\n\n#### R Gui\n\n当你下载并安装 R 时，整个过程中你会获得标准的 R Gui（R\
  \ 图用户界面）。R Gui 提供了某些工具来处理你的 R 设置，主要是你的 R 控制台窗口。在这个控制窗口上，你需要输入脚本或指令，并命令 R 执行有帮助的任务。\n\
  \n##### 查看你的 R 控制台\n\n在你的系统中成功安装 R 后，Windows 启动菜单中将创建快捷方式。在 Windows 启动菜单中，搜索 R 文件夹，然后寻找带有版本系列号的\
  \ R 图标。\n\n![RGmenu.jpg](img/00005.jpeg)\n\n当你点击 `RGui` 图标时，你将第一次看到 R 控制台界面，其中包含一些基本细节，如\
  \ R 版本和许可声明。在所有这些基本细节的最底部是“R 提示符”，用 `>` 符号表示。这个 R 提示符符号指向你应该输入命令的地方。你甚至会注意到提示符右侧有一个闪烁的光标。\n\
  \n“Windows” 版本的 R 控制台：\n\n![Wincmdprompt.jpg](img/00006.jpeg)\n\n“Mac” 版本的 R 控制台：\n\
  \n![Maccmdprpmt.jpg](img/00007.jpeg)\n\n从上述两张图中可以看出，Windows 和 Mac 版本的 R 控制台是相同的。\n\
  \n##### 如何关闭 R 控制台？\n\n为了关闭 R 控制台，你需要在 `>` 符号（R 命令提示符符号）之后输入以下内容：\n\n```\nq( )\n\
  ```\n\nR 会询问你是否确定真的要退出。\n\n![close.jpg](img/00008.jpeg)\n\n只需点击“No”选项即可，因为你还没有要保存的内容。你的\
  \ R 会话将关闭。\n\n#### R Studio 编辑器\n\n要在 R Studio 编辑器中工作，首先点击 Windows 启动菜单中的 R Studio\
  \ 图标。\n\n![rstdicon.jpg](img/00009.jpeg)\n\n之后，选择 File>New>R Script。你会看到 4 个工作区域：\n\
  \n![fourareas1.jpg](img/00010.jpeg)\n\n*   **源文件编辑器 (Source Editor)**：Source 是一个文本编辑器，允许你处理“源-脚本-文件”。你可以在这里输入几行代码，将脚本文件保存到硬盘，并执行各种重要任务。源编辑器的功能与你使用过的任何其他文本编辑器类似；但它非常智能。它能够识别并强调你代码中的许多组成，例如为不相关的元素使用不同的颜色。\n\
  *   **控制台 (Console)**：R Studio 中的控制台区域与 RGui 控制台非常相似。这是你输入脚本或指令，并命令 R 执行有帮助的任务的地方。\n\
  *   **工作空间/历史 (Workspace/History)**：在工作空间/历史区域，你可以检查在 R 会话期间创建的变量及其值。在此区域，你还可以查看在\
  \ R 中输入的所有命令历史。\n*   **文件/包/图表/帮助 (Files/packages/plots/help)**：在此区域你可以访问各种工具。\n\
  \    *   文件 (Files)：在这里你可以浏览系统上的所有文件和相关文件夹。\n    *   包 (Packages)：在这里可以看到已安装包列表。包是增强\
  \ R 性能的自主代码集。\n    *   图表 (Plots)：在这里 R 显示你的图表，例如图形。\n    *   帮助 (Help)：在这里你可以访问内置帮助。\n\
  \n#### 向量 (Vectors)\n\n向量是一种基础数据结构，由一组元素组成。例如，一组数字。它是值的单一单元。\n\n#### 函数 (Function)\n\
  \n函数是一段代码，它接收特定的输入，并对这些值执行独特的操作。在创建向量时，你调用 `()` 函数来创建一个向量。括号内的值被称为 `arguments`（参数）。\n\
  \n#### 运算符 (Operators)\n\n现在，运算符是插入两个条目之间的符号，用于执行任何数学计算。`+`、`-`、`*`、`/` 符号被称为运算符。另一个运算符被称为序列，看起来像冒号（:`）。\n\
  \n\n\n\n\n在这里，你可以注意到一个重要的一点是，两个变量的值都没有发生变化。而且，在给它们分配新值之前，它们不会改变。\n\n你甚至可以给变量分配文本值。创建一个变量\
  \ `x`，并将 `Welcome` 文本放在“ ”中来给它赋值：\n\n```r\nx <- “Welcome”\nx\n```\n[1] “Welcome”\n\
  \n你甚至可以利用 `c()` 函数来组合文本。创建一个变量 `n`，并给它赋值 `c()` 的值：\n\n```r\nn <- c(“Welcome”, “Sir!”)\n\
  n\n```\n[1] “Welcome” “Sir!”\n\n你可以利用 `paste()` 函数将多个文本连接在一起。`paste()` 函数会自动在不同的文本之间插入空格：\n\
  \n```r\npaste(“Welcome”, “Sir!”)\n```\n[1] “Welcome Sir!”\n\n这些都是你在 R 中可以进行的一些基础计算。现在，我们将讨论在\
  \ R 中可以执行的其他各种事情。\n\n## 如何运行脚本（source script）？\n\n现在，是时候提升一个了，让 R 连续执行各种命令，而无需等待进一步指令。在\
  \ R 中，`source()` 函数用于运行整个脚本，用户将这整个过程称为“源化脚本（Sourcing-a-Script）”。\n\n为了设置要源化的脚本，你首先需要在编辑器中输入你的整个脚本。在这里，我们使用的是\
  \ R Studio 编辑器。只需在 R Studio 编辑器中输入以下代码：\n\n```r\nb <- “Hey!”\nn <- readline(“What\
  \ is my name?”)\nprint(paste(b, n))\n```\n\n你可以在 R Studio 编辑器中输入多行代码。之后，当一切设置完成后，你可以运行脚本（将命令发送给\
  \ R）。在 R Studio 或 RGui 中，你可以通过以下方法任一完成此任务：\n\n*   从源编辑器将单行代码传输到控制台：只需点击你想运行的单行代码，然后在\
  \ RGui 编辑器中按下 `Ctrl+R` 键。你需要按下 `Ctrl+Enter` 键，或者点击 R Studio 编辑器中的“Run（运行）”按钮。\n\
  *   将一段所需的代码传输到控制台：首先，选择你想要运行的整个代码块，然后在 R Studio 中按下 `Ctrl+Enter` 键，或在 RGui 编辑器中按下\
  \ `Ctrl+R` 键。\n*   源化脚本或将整个脚本传输到控制台：在 R Studio 中，只需点击源编辑器部分，然后按下 `Ctrl + Shift +\
  \ Enter` 键，或点击“Source（源）”按钮。在 RGui 中，只需点击你的脚本窗口，然后选择 `Edit>Run all（运行全部）`。\n\n你现在可以将你的整个脚本传输到你的\
  \ R 控制台。只需点击源编辑器部分的“Source”按钮，或选择 `Edit>Source`。你上面的脚本将开始运行并到达末尾，在那里会要求输入某些值，然后等待你在控制台窗口区域输入你的名字。\n\
  \n![Sourceot.jpg](img/00011.jpeg)\n\n## 导航工作空间的方法\n\n工作空间意味着你在整个会话中构建的所有函数以及变量的集合，以及加载的任何包。你可能经常需要提醒自己保存在工作空间中的所有变量。你可以利用\
  \ `ls()` 函数获取工作空间中所有对象（函数、变量等）的列表。只需在 R 控制台中输入 `ls()` 即可：\n\n```r\nls()\n```\n[1]\
  \ “a” “go” “k” “l” “normal” “m”\n\nR 将通知你所创建的每一个变量的名称。\n\n## 操作工作空间内容的方法\n\n如果你觉得不需要某些工作空间对象，可以轻松删除它们。例如，你不再需要对象\
  \ `m`，并想从工作空间中移除它。现在要删除它，只需利用 `rm()` 函数，然后再次利用 `ls()` 函数交叉检查你的工作空间内容：\n\n```r\n\
  rm(m)\nls()\n```\n[1] “a” “go” “k” “l” “normal”\n\n你可以看到对象 `m` 不再存在。\n\n## 保存工作的方法\n\
  \n有多种方法可以保存你的工作：\n\n*   使用 `save()` 函数保存你的单个变量。\n*   使用 `save.image()` 函数保存整个工作空间。\n\
  *   你可以使用代码编辑器中适当保存菜单命令保存你的 R 脚本文件。\n\n例如，你想保存“normal”变量的值。只需执行以下操作：\n\n*   查找 R\
  \ 将保存你的文件的工作目录。你需要输入以下命令：\n\n```r\ngetwd()\n```\n[1] “c:/users/delfim”\n\n通常，你的用户文件夹是自动保存文件的工作目录。具体的名称以及文件夹的路径实际上取决于你的操作系统（OS）。\n\
  *   在 R 控制台中输入以下命令，可以使用任何名称如 `myname.rda`，然后按下“Enter”键：\n\n```r\nsave(normal, file=\
  \ “myname.rda”)\n```\nR 将你的文件保存在工作目录中。如果过程成功结束，你将不会收到任何确认消息。\n*   并且，为了确保整个过程成功，你可以交叉检查。\n\
  \n***\n\n# 第三章：R 基础\n\n在本章中，我们将关注 R 的语法、如何使用代码以及可读性。\n\n### 表达式\n\n表达式意味着特定的命令。例如，以下整数：\n\
  \n```r\n1+2+3+4+5\n```\n[1] 15\n\n如果存在多个表达式，它们按顺序执行。后续章节将说明某些类型。\n\n### 常量\n\n这些\
  \ R 最简单的类型。常量通常是数字（数值），或字符文本。例如，如果我们必须说明 5 分钟的秒数，我们指定数字：\n\n```r\n300\n```\n[1]\
  \ 300\n\n如果我们需要解释文件名，我们将文件名标记为字符文本。文本值应包含在双引号（ ”）或单引号（‘ ’）中。\n\n```r\n“How are you?”\n\
  ```\n[1] “How are you?”\n\n### 算术表达式\n\n算术表达式是一种复合表达式，用于数值计算。R 提供了某些标准运算符：\n\n*\
  \   `+`（加法符号）\n*   `-`（减法符号）\n*   `*`（乘法符号）\n*   `/`（除法符号）\n*   `^`（幂符号）\n\n括号用于管理计算顺序。R\
  \ 遵循通常的 BODMAS 优先级系统；然而，括号是避免任何错误的方便方法。以下是一个示例：\n\n```r\n(78963-56397)/10\n```\n\
  [1] 2256.6\n\n### 条件表达式\n\n条件表达式意味着一个是或否的回答。条件表达式的结果是一个逻辑值（真或假）。R 提供了某些标准运算符来比较不同的值，以及用于组合这些条件的运算符：\n\
  \n*   `==`（相等符号）\n*   `>=`（大于等于符号）\n*   `<=`（小于等于符号）\n*   `!=`（不等于符号）\n*   `&&`（逻辑与符号）\n\
  *   `||`（逻辑或符号）\n*   `!`（逻辑非符号）\n\n\n\n\n以下是一个示例，该代码查询了第二次人口普查结果是否超过了第一次，且第二次人口普查结果是否大于了\
  \ 10 亿。\n\n```r\n(population2 > population1) && (population2 > 1,000,000,000)\n\
  ```\n[1] `TRUE`\n\n### 函数调用\n\n`R` 表达式中非常有用的一个被称为 `function call`（**函数调用**）。这些调用非常重要，因为它们能够让你利用\
  \ `R` 来执行任何关键任务。函数调用本质上是一个复合命令，存在成百上千种执行不同任务的 `functions`（函数）。我们将在后面的章节中讨论用于处理数据的某些关键函数。\n\
  \n一个函数调用包含函数名，后面跟着参数（在括号内），这些参数为函数执行任务提供了必要的细节。参数之间用逗号分隔。以下是一个示例：\n\n用于合并文本的 `c()`\
  \ 函数：\n\n```r\n> c(“Welcome”, “Sir!”)\n```\n\n当您按下‘ENTER’键时，结果为：\n\n[1] `“Welcome”\
  \ “Sir!”`\n\n### 符号\n\n我们在控制台中输入的所有以字母开头且不是任何特定 `R` 关键字的内容，都会被 `R` 读取为 `symbol`（**符号**）。符号意味着对当前存储在内存（RAM）中的实体的标签。现在，当\
  \ `R` 遇到任何符号时，它会从内存中提取与该标签对应的值。\n\n`R` 默认带有某些预定义值以及某些相关的符号。例如，有一个预定义的符号 `pi`。\n\n\
  ```r\n>pi\n```\n[1] `3.141593`\n\n### 关键字\n\n有某些符号或关键字仅用于表示唯一值，且这些值不能被重新赋值：\n\n\
  *   `NA` 是一个表示**缺失或未识别**值的关键字。\n*   `Inf` 是一个表示**无穷大**的关键字。\n*   `NaN` 是一个表示未定义算术结果的关键字。\n\
  *   `NULL` 是一个表示**空结果**的关键字。某些 `R` 函数可能不会产生任何结果，结果为 `NULL`。\n*   `TRUE` & `FALSE`\
  \ 是表示逻辑值“真”和“假”的关键字。\n\n### 变量命名方法\n\n在编写 `code` 时，由于我们经常为各种符号赋值，我们被迫发明了许多不同的变量名。出于以下原因，选择理性的变量名至关重要：\n\
  \n*   一个好的名字是一种凭证。与 `p` 或 `pob` 等名字相比，如 `“PlaceOfBirth”`（**出生地**）这样的名字可以告诉读者许多关于赋值给该特定变量的数值类型信息。\n\
  *   必须避免使用像 `a`、`aa` 或 `aaa` 这样简短或方便的名称，因为当你在无意中为不同任务复用相似的短名称时，这会产生大量的错误。\n*   你应该使用大写和小写字母的组合。你应该像写一个短句子一样创建名称，并且每个新单词的首字母大写，例如\
  \ `“PlaceOfBirth`。\n\n这些是 `R` 语法的一些基础。现在，我们将讨论函数和参数的有效使用。\n\n### 如何有效使用函数和参数？\n\n\
  #### 函数向量化的方法\n\n该过程涉及创建向量并将其放在函数内部。函数向量化是 `R` 的一个非常有效的特性；然而，许多不习惯使用 `R` 的专业人士在开始时经常会遇到困难，因为他们并不了解这种概念。任何向量化的函数不仅影响单个值，而且同时影响整个向量的值。在\
  \ `R` 中将函数向量化无疑会简化代码。\n\n首先，你需要创建一个向量。你可以利用 `c()` 函数，且值需要用逗号（`,`）分隔。以下是一个示例：\n\n\
  假设 Phillip 正在和朋友一起打篮球，他的哥哥正在记录 Phillip 每场比赛的进篮次数。五场比赛后，Phillip 询问哥哥他到为止投进了多少个篮。现在，他投进的次数可以如下所示放入向量：\n\
  \n```r\n> Phillip <- c(10,5,5,4,8)\n> Phillip\n```\n[1] `10 5 5 4 8`\n\n并且，为了知道\
  \ Phillip 投进的总篮数，你可以使用 `sum()` 函数：\n\n```r\n> sum (Phillip)\n```\n[1] `32`\n\n另一个示例是\
  \ `paste()` 函数。如果你创建一个只包含各种水果名称的向量，`paste()` 可以通过一个命令在所有名称旁边添加文本“fruit”（**水果**）。以下是示例：\n\
  \n```r\n> Fruitnames <- c(“Apple”, “Banana”, “Orange”)\n> addname <- “Fruit”\n>\
  \ paste(Fruitnames, addname)\n```\n[1] `“Apple Fruit” “Banana Fruit” “Orange Fruit”`\n\
  \n`R` 甚至可以逐元素地混合两个长向量。以下是示例：\n\n```r\n> Fighters <- c(“Fedor”, “Jon”)\n> last.names\
  \ <- c(“Emilianenko”, “Jones”)\n> paste(Fighters, last.names)\n```\n[1] `“Fedor\
  \ Emilianenko” “Jon Jones”`\n\n你不需要编写任何复杂的代码。只需要创建向量并将放在函数内部。现在，我们将讨论在函数中放置参数的方法。\n\
  \n#### 在函数中放置参数的方法\n\n提供了提供了函数具体要执行内容的特定细节。你可以在 `R` 中使用两种通用参数类型：\n\n*   具有默认值的参数。\n\
  *   不具有默认值的参数。\n\n如果参数没有默认值，那么该值可能是强制的，也可能是可选的。通常，第一个参数总是必要的。输入并执行以下代码：\n\n```r\n\
  > print( )\n```\n`R` 将提示你该命令需要 `x`：\n\n`(Error in .Internal(print.default(x, quote,\
  \ na.print) : ‘x’ is missing)`\n\n现在，你需要在此处赋值参数：\n\n```r\n> print(x = “What is my\
  \ name?”)\n```\n或者\n\n```r\n> print(“What is my name?”)\n```\n\n这些是在你的函数中放置参数的一些示例。现在，我们将讨论让你的代码清晰易读的方法。\n\
  \n### 如何让你的代码清晰易读？\n\n当你开始使用函数并执行复杂的计算时，你的整个代码可能会变成符号和文本的巨大杂烩。幸运的是，我们在这里为你提供某些技巧，用于清理代码并使其更具可读性。\n\
  \n使用函数和执行困难的计算会导致 `R` 代码变长。现在，`R` 允许你将代码行拆分为多行，就像在任何普通文本编辑器中编写一样。而且，你不需要使用任何特殊字符来实现这一点。只要你提供了某些线索，`R`\
  \ 就会解释代码行尚未结束。以下是实现此目的的方法：\n\n*   使用引号开始字符串：`R` 将认为跟随第一个引号之后的所有输入（包括换行符）都是字符串的元素，直到遇到第二个引号。\n\
  *   用运算符符号结束未完成的命令（如 `+`、`/`、`<-` 等）：`R` 将解释后面还有更多代码，并允许你为巨大复杂的计算构建结构。\n*   为函数打开括号（圆括号）：`R`\
  \ 将认为收到的整个输入为单行，直到遇到第二个匹配的括号。\n\n### 如何通过用户包扩展 R 编程？\n\n`R` 的真正力量源于它允许每个人编写自己的函数，并以结构化的方式将这些函数与其他许多\
  \ R 用户共享。许多程序员已经在 `R` 中编写了合适的函数，而且经常会有新的统计技术发布。许多程序员随后会分享他们的代码，这被称为 R 包（R package）。这些用户包是\
  \ R 代码、数据集、帮助文件等的编译物，可以简单地集成到 `R` 中。\n\n查找 R 包的方法：\n\n\n\n\n\n许多网站（也称为仓库）提供了各种 R\
  \ 包。最著名的网站是 CRAN（全面 R 存档网络），你可以在那里轻松访问多个用户包。访问 ([`cran.r-project.org/doc/manuals/R-admin.html`](https://cran.r-project.org/doc/manuals/R-admin.html))\n\
  \nCRAN 还拥有一系列文件包以及参考手册。CRAN 甚至允许用户验证用户包是否仍然被保留，并获取该包中所做修改的概述。\n\n## 安装 R 包的方法\n\n\
  为了安装 R 包，你需要使用一个名为 `install.packages()` 的函数。例如，如果你想安装‘lubridate’ 包，只需要在 `install.packages()`\
  \ 函数中将包名（这里是‘lubridate’）作为字符串写入即可。\n\n‘lubridate’ 包包含了各种实用的工具，允许用户能够轻松地处理日期和时间。以下是安装用户包的方法：\n\
  \n```r\ninstall.packages(‘lubridate’)\n```\n\n## 加载和卸载用户包的方法\n\n在使用任何用户包之前，你首先需要将其加载到\
  \ R 中，为此你需要利用 `library()` 函数。以下是加载任何用户包的命令：\n\n```r\nlibrary(lubridate)\n```\n\n\
  而且，如果你想卸载任何用户包，你就需要利用 `detach()` 函数。然而，你需要明确指出你想要卸载的是用户包。以下是卸载任何用户包的命令：\n\n```r\n\
  detach(package:lubridate)\n```\n\n这些都是通过用户包扩展 R 编程的一些重要方法。\n\n***\n\n在本章中，我们讨论了\
  \ R 语法的基础知识、如何有效地使用函数和参数、如何让你的代码简洁易读，以及如何通过用户包扩展 R 编程。\n\n在下一章中，我们将讨论开始在 R 中工作的方法。\n\
