    ## 第一章：R 编程简介


    全球拥有超过 200 万用户，R 语言正在迅速成为数据科学和统计领域的顶尖编程语言。自从它在 20 世纪 90 年代作为一种“学术演示语言”诞生以来，R 语言已经迅速发展和扩展。R
    语言的用户数每年增长 40%，越来越多的机构在他们的日常活动中使用这种语言。


    ### R 的简史


    R 语言是由新西兰奥克兰大学的两个同事在 20 世纪 90 年代期间创建并开发的——Ihaka 和 Gentleman。他们都非常熟悉 `S` 语言（S 是一种统计语言），他们决定使用类似的语法，因此为学生创建了免费的
    `R`。


    ### R 发展的里程碑年份


    *   1990 年代：R 被创建并开始开发。

    *   1993 年：`R 编程`首次在 `S-news` 邮件列表上公布。从那时起形成了一批活跃的邮件列表。

    *   1995 年：Martin Gentleman 说服整个小组将 R 语言代码变为自由软件。此后，R 语言代码根据自由软件基金会的 GNU 通用许可证许可。

    *   1997 年：成立了第一个 `R 开发核心团队`。

    *   2000 年初：`R 语言`的初始版本 (`v1.0.0`) 发布。


    ### 什么是 R 编程？


    `R` 是一种编程语言，被许多科学家、数据分析师和众多统计学家用于分析数据库并进行统计审查。


    `R 语言` 是分析海量数据的工具。如果你的工作涉及海量数据（海量数据库和文件），你可以利用 `R` 获取你的数据并对其进行某些处理。`R` 带有许多可以下载的扩展包，这些包甚至允许你在分析数据时简化或扩展各种命令。


