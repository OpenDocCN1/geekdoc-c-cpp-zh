    \n### 其他 R 编辑器选项\n\nR 让你完全自由地选择你自己的代码编辑器和开发设置。你完全没有强制要求使用典型的 R 编辑器或 `R Studio`。\n\
    \n以下是你可以考虑的几个替代方案：\n\n*   **ESS (Emacs Speaks Statistics)**：Emacs 是一个非常优秀的文本和代码编辑器，在全球范围内\
    \ Linux 系统中被广泛使用。它甚至适用于 Windows 版本。ESS 拥有全球粉丝群，并因对几乎所有可以执行的操作提供的键盘快捷键而闻盛名。所以，如果你是一个\
    \ Linux 程序员，那么 Emacs 编辑器可能是你的不错选择。请访问 ([`ess.r-project.org/`](http://ess.r-project.org/))\
    \ 获取更多信息。\n*   **Eclipse StatET**：这是另一个高度集成的开发设置，带有一个名为“StatET”的“R 插件”。因此，如果你已经完成了大型任务的软件开发工作，那么\
    \ Eclipse 可能是你的不错选择。你需要在系统中安装 Java。访问 ([`www.walware.de/goto/statet`](http://www.walware.de/goto/statet))。\n\
    *   **Tinn-R**：Tinn-R 专为与 R 协作而开发，目前仅适用于 Windows 版本。Tinn-R 具有某些优秀功能，允许你在任务中设置\
    \ R 脚本集合。与 Emacs 和 Eclipse 编辑器相比，它的安装和使用非常简单；然而，它确实缺少许多功能。访问 ([`www.sciviews.org/Tinn-R`](http://www.sciviews.org/Tinn-R))。\n\
    \n### 如何使用你的编辑器？\n\nR 是一门编程语言，而不是一个应用程序。这意味着用户完全自由地选择自己的编辑工具来进行 R 编码。现在，我们将讨论\
    \ Windows 版本的 R 编辑器，即 R 图形用户界面 (`R Gui`)。\n\n#### R Gui\n\n当你下载并安装 R 时，整个过程中你会获得标准的\
    \ R Gui（R 图用户界面）。R Gui 提供了某些工具来处理你的 R 设置，主要是你的 R 控制台窗口。在这个控制窗口上，你需要输入脚本或指令，并命令\
    \ R 执行有帮助的任务。\n\n##### 查看你的 R 控制台\n\n在你的系统中成功安装 R 后，Windows 启动菜单中将创建快捷方式。在 Windows\
    \ 启动菜单中，搜索 R 文件夹，然后寻找带有版本系列号的 R 图标。\n\n![RGmenu.jpg](img/00005.jpeg)\n\n当你点击 `RGui`\
    \ 图标时，你将第一次看到 R 控制台界面，其中包含一些基本细节，如 R 版本和许可声明。在所有这些基本细节的最底部是“R 提示符”，用 `>` 符号表示。这个\
    \ R 提示符符号指向你应该输入命令的地方。你甚至会注意到提示符右侧有一个闪烁的光标。\n\n“Windows” 版本的 R 控制台：\n\n![Wincmdprompt.jpg](img/00006.jpeg)\n\
    \n“Mac” 版本的 R 控制台：\n\n![Maccmdprpmt.jpg](img/00007.jpeg)\n\n从上述两张图中可以看出，Windows\
    \ 和 Mac 版本的 R 控制台是相同的。\n\n##### 如何关闭 R 控制台？\n\n为了关闭 R 控制台，你需要在 `>` 符号（R 命令提示符符号）之后输入以下内容：\n\
    \n```\nq( )\n```\n\nR 会询问你是否确定真的要退出。\n\n![close.jpg](img/00008.jpeg)\n\n只需点击“No”选项即可，因为你还没有要保存的内容。你的\
    \ R 会话将关闭。\n\n#### R Studio 编辑器\n\n要在 R Studio 编辑器中工作，首先点击 Windows 启动菜单中的 R Studio\
    \ 图标。\n\n![rstdicon.jpg](img/00009.jpeg)\n\n之后，选择 File>New>R Script。你会看到 4 个工作区域：\n\
    \n![fourareas1.jpg](img/00010.jpeg)\n\n*   **源文件编辑器 (Source Editor)**：Source 是一个文本编辑器，允许你处理“源-脚本-文件”。你可以在这里输入几行代码，将脚本文件保存到硬盘，并执行各种重要任务。源编辑器的功能与你使用过的任何其他文本编辑器类似；但它非常智能。它能够识别并强调你代码中的许多组成，例如为不相关的元素使用不同的颜色。\n\
    *   **控制台 (Console)**：R Studio 中的控制台区域与 RGui 控制台非常相似。这是你输入脚本或指令，并命令 R 执行有帮助的任务的地方。\n\
    *   **工作空间/历史 (Workspace/History)**：在工作空间/历史区域，你可以检查在 R 会话期间创建的变量及其值。在此区域，你还可以查看在\
    \ R 中输入的所有命令历史。\n*   **文件/包/图表/帮助 (Files/packages/plots/help)**：在此区域你可以访问各种工具。\n\
    \    *   文件 (Files)：在这里你可以浏览系统上的所有文件和相关文件夹。\n    *   包 (Packages)：在这里可以看到已安装包列表。包是增强\
    \ R 性能的自主代码集。\n    *   图表 (Plots)：在这里 R 显示你的图表，例如图形。\n    *   帮助 (Help)：在这里你可以访问内置帮助。\n\
    \n#### 向量 (Vectors)\n\n向量是一种基础数据结构，由一组元素组成。例如，一组数字。它是值的单一单元。\n\n#### 函数 (Function)\n\
    \n函数是一段代码，它接收特定的输入，并对这些值执行独特的操作。在创建向量时，你调用 `()` 函数来创建一个向量。括号内的值被称为 `arguments`（参数）。\n\
    \n#### 运算符 (Operators)\n\n现在，运算符是插入两个条目之间的符号，用于执行任何数学计算。`+`、`-`、`*`、`/` 符号被称为运算符。另一个运算符被称为序列，看起来像冒号（:`）。\n\
    \n"
