    *   In every circle through the loop, you added the result of switch( ) function
    in the vector ‘V’.


    The final outcome is a vector ‘V’ which possess the right figures of the Value
    Added Tax, for every customer. These were some of the ways to loop through different
    values. Next, we’ll talk about how to effectively debug your Code.


    How to effectively debug your Code?


    No one can write a perfect code devoid of any errors. Therefore, rather than speculating
    about the mistakes in your code, you first step must be to inquire yourself, where
    have you committed those errors?


    Understanding where the problem lies:


    Here, a bug is just a different word for an error in your code. Hence, debugging
    process doesn’t engage any of the pesticides. It literally means removing every
    form of ‘logical’ or/and ‘semantic’ errors in your program.


    Therefore, prior to removing those bugs, you need to understand the stuff you’re
    searching for. Following are some of the different categories of errors:


    *   ‘Syntax’ errors: In case you’ve written a code which R can’t interpret, then
    you have committed ‘syntax’ errors. The outcome of such errors is always an error
    message, and it frequently happens due to some misspelling, or incomplete bracket.


    *   ‘Semantic’ errors: In case you’ve written a code which doesn’t perform the
    intended task, then you have committed a ‘semantic’ error. Here, although the
    code is proper, however, the results are not what it was meant for, and your code
    is unsuccessful.'
