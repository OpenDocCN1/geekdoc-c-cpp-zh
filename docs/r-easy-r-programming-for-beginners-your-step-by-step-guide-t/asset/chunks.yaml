    ## 第三章：R 基础


    在本章中，我们将关注 R 的语法、如何使用代码以及可读性。


    ### 表达式


    表达式意味着特定的命令。例如，以下整数：


    ```r

    1+2+3+4+5

    ```

    [1] 15


    如果存在多个表达式，它们按顺序执行。后续章节将说明某些类型。


    ### 常量


    这些 R 最简单的类型。常量通常是数字（数值），或字符文本。例如，如果我们必须说明 5 分钟的秒数，我们指定数字：


    ```r

    300

    ```

    [1] 300


    如果我们需要解释文件名，我们将文件名标记为字符文本。文本值应包含在双引号（ ”）或单引号（‘ ’）中。


    ```r

    “How are you?”

    ```

    [1] “How are you?”


    ### 算术表达式


    算术表达式是一种复合表达式，用于数值计算。R 提供了某些标准运算符：


    *   `+`（加法符号）

    *   `-`（减法符号）

    *   `*`（乘法符号）

    *   `/`（除法符号）

    *   `^`（幂符号）


    括号用于管理计算顺序。R 遵循通常的 BODMAS 优先级系统；然而，括号是避免任何错误的方便方法。以下是一个示例：


    ```r

    (78963-56397)/10

    ```

    [1] 2256.6


    ### 条件表达式


    条件表达式意味着一个是或否的回答。条件表达式的结果是一个逻辑值（真或假）。R 提供了某些标准运算符来比较不同的值，以及用于组合这些条件的运算符：


    *   `==`（相等符号）

    *   `>=`（大于等于符号）

    *   `<=`（小于等于符号）

    *   `!=`（不等于符号）

    *   `&&`（逻辑与符号）

    *   `||`（逻辑或符号）

    *   `!`（逻辑非符号）


