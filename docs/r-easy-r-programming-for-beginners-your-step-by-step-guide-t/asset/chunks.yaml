    \ ) function:\n\n> strsplit(sp, “ ”)\n\n[[1]]\n\n[1] “I” “love” “to” “play” “hockey”\n\
    \nThe result shows the string split.\n\nHow to concatenate text?\n\nIn order to\
    \ concatenate text, you need to utilize the paste( ) function:\n\npaste(“I”, “love”,\
    \ “to”, “play”, “hockey”)\n\n[1] “I love to play hockey”\n\nThe paste() automatically\
    \ utilizes any blank space it encounters to combine the vectors.\n\nThese were\
    \ some of the ways to use character vectors for Text data, and manipulate text.\
    \ Now, we’ll discuss the various ways to work with dates and times.\n\nHow to\
    \ work with dates and times?\n\nR comes with a variety of functions which permit\
    \ you to experiment with dates and times. The simplest technique for constructing\
    \ a date is to utilize the as.Date( ) function. For instance, you write the inaugural\
    \ day of the 2016 Rio Olympic Games as:\n\n> og <- as.Date(“2016-08-05”)\n\n>\
    \ og\n\n[1] “2016-08-05”\n\n> str(og)\n\nDate[1:1], format: “2016-08-05”\n\nAnd,\
    \ if you wish to know which weekday this date falls on, you need to utilize weekdays(\
    \ ) function:\n\n> weekdays(og)\n\n[1] “Friday”\n\nYou can even subtract or add\
    \ values from dates to build fresh dates. For instance, to compute the date which\
    \ is 8 days after this, type the following code:\n\n> og + 8\n\n[1] “2016-08-13”\n\
    \nJust like in case of text and/or numbers, you can place many dates inside any\
    \ vector. To build a vector of 6 days beginning on August 5, add 0:5 to the initial\
    \ date.\n\n> og + 0:5\n\n[1] “2016-08-05” “2016-08-06” “2016-08-07” “2016-08-08”\n\
    \n[5] “2016-08-09” “2016-08-10”\n\nBelow is the table of some helpful Functions\
    \ with Dates:\n\n![datefnc.jpg](images/00025.jpeg)\n\nWays to incorporate time\
    \ details to dates:\n\nSometimes, just dates aren’t sufficient. You’re also required\
    \ to designate a precise time. So, to denote time details along with dates, you\
    \ can pick any one of these functions:\n\n*   as.POSIXct() \n\n*   as.POSIXlt()\n\
    \nThe above mentioned date-time functions relatively vary, as these stock-up the\
    \ date related data internally, in addition to the technique by which a user can\
    \ get the date as well as time values.\n\nBelow is table which lists some of the\
    \ formatting codes which are helpful when you try to incorporate time details\
    \ to dates.\n\n![Timeelement.jpg](images/00026.jpeg)\n\nThese were some of the\
    \ ways to work with dates and times. Next, we’ll talk about the various ways to\
    \ combine Vectors into Matrix.\n\nHow to combine Vectors into Matrix?\n\nUntil\
    \ now, we’ve been creating vectors to store data in a 1-D (one-dimensional) arrangement.\
    \ However, besides vectors, R also offers to work with matrices. In reality, R\
    \ actually excels with its matrix computations and operations.\n\nVectors are\
    \ very much associated to a larger group of entities known as ‘arrays’. Arrays\
    \ come with two very significant attributes:  \n\n*   These hold just a particular\
    \ type of value.\n\n*   These possess dimensions.\n\nNow, the number of dimensions\
    \ actually establishes the array type. A vector has just one dimension, a matrix\
    \ has two dimensions, and an array has in excess of two dimensions.\n\nHow to\
    \ create matrix?\n\nYou just need to utilize the matrix() function, to create\
    \ a matrix. However, you need to provide some details to R first such as which\
    \ values you wish to place inside the matrix, and how you wish to place those\
    \ values. The matrix() function comes with certain arguments to manage this:\n\
    \n*   data means a vector of values which you wish to place inside the matrix.\n\
    \n*   ncol accepts a solo number and informs R about the number of columns you\
    \ desire.\n\n*   nrow accepts a solo number and informs R about the number of\
    \ rows you desire.\n\n*   byrow accepts a logical value and informs R in case\
    \ you wish to load the matrix column by column, or row by row.\n\nThe below mentioned\
    \ command displays a matrix with the numbers from 2 to 13 in 3 columns and 4 rows:\n\
    \n> fm <- matrix(2:13, ncol=3)\n\n> fm\n\n      [,1] [,2] [,3]\n\n[1,]   2    \
    \ 6    10\n\n[2,]   3     7    11\n\n[3,]   4     8    12\n\n[4,]   5     9   \
    \ 13\n\nNow, you don’t need to state both the ncol or/and nrow. Even if you state\
    \ just one, R automatically interprets about the other. And, in case you wish\
    \ to load the matrix row wise:\n\n> matrix(2:13, ncol=3, byrow=TRUE)\n\n     \
    \ [,1] [,2] [,3]\n\n[1,]   2     3      4\n\n[2,]   5     6      7\n\n[3,]   8    \
    \ 9    10\n\n[4,]  11   12   13\n\nWays to combine vectors into a matrix:\n\n\
    Let’s again consider the example of the basketball game, where we created two\
    \ vectors consisting of number of baskets made by Phillip and George. Now, in\
    \ case you wish to put the number of baskets made by both of them in a single\
    \ entity, you can utilize matrices. You need to merge both the vectors like 2\
    \ rows of a matrix using the rbind( ) function:\n\n> Phillip.baskets <- c(10,3,3,5,8)\n\
    \n> George.baskets <- c(4,2,1,1,10)\n\n> Total.baskets <- rbind(Phillip.baskets,\
    \ George.baskets)\n\nHere, the entity Total.baskets is a matrix, and the rows\
    \ acquire the vector’s names.\n\n> Total.baskets\n\n [,1] [,2] [,3] [,4] [,5]\n\
    \nPhillip.baskets  10    3    3     5     8\n\nGeorge.baskets  4     2    1    \
    \ 1   10\n\nLikewise, to merge the vectors as columns of a matrix, you need to\
    \ utilize the cbind( ) function:\n\n> cbind(2:4, 5:7, matrix(8:13, ncol=2))\n\n\
          [,1] [,2] [,3] [,4]\n\n[1,]   2   5     8    11\n\n[2,]   3   6     9   \
    \ 12\n\n[3,]   4   7    10   13"
