    Following is an example where the code enquires, whether or not, the 2nd population
    assessment outsize the 1st population, and the 2nd population assessment is greater
    than 1 billion.


    ```r

    (population2 > population1) && (population2 > 1,000,000,000)

    ```

    [1] `TRUE`


    ### Function calls


    One of the most helpful `R` expressions is called `function call`. These are quite
    significant as these will enable you to utilize `R` to carry out any key task.
    A function call is fundamentally a composite command, and there exists hundreds
    and thousands of such `functions` which carry out diverse tasks. We’ll discuss
    certain key functions to manipulate data in later chapters.


    A function call comprises the name of the function followed by arguments(within
    brackets) which provide essential details for the function to carry out the task.
    The arguments are separated by commas. Following is an example:


    `c()` function to combine text:


    ```r

    > c(“Welcome”, “Sir!”)

    ```


    And when you press ‘ENTER’ key the result is:


    [1] `“Welcome” “Sir!”`


    ### Symbols


    Everything we type in console which begins with a letter, and is not any of the
    specific `R` keywords, is read by `R` as a `symbol`. A symbol means a tag for
    an entity which is presently saved in RAM. Now, when `R` comes across any symbol,
    it pulls out from RAM the value corresponding to that tag.


    `R` by default comes with certain pre-defined values along with certain related
    symbols. For instance, there is a pre-defined symbol `pi`.


    ```r

    >pi

    ```

    [1] `3.141593`


    ### Keywords


    There are certain symbols or keywords which are only used to symbolize unique
    values and these can’t be re-assigned:


    *   `NA` is a keyword which symbolizes a lost or unidentified value.

    *   `Inf` is a keyword which symbolizes infinity.

    *   `NaN` is a keyword which symbolizes an arithmetic outcome which is not defined.

    *   `NULL` is a keyword which symbolizes an empty outcome. Certain `R` functions
    might not generate any outcome, and the result is `NULL`.

    *   `TRUE` & `FALSE` are the keywords which symbolizes the logical values “true”
    and “false”.


    ### Ways to name variables


    While writing `code`, as we frequently assign values to various symbols, we are
    compelled to invent a great deal of diverse variable names. It is vital to pick
    rational variable names for the following reasons:


    *   A fine name is a sort of credential. A name such as `“PlaceOfBirth” informs
    a reader lot of things about the kind of value which has been assigned to that
    particular variable, as compared to names such as `p`, or `pob`.

    *   Short or handy names like `a`, or `aa`, or `aaa`, must be avoided as it will
    simply create a lot of errors when you unknowingly reuse the similar short name
    for diverse tasks.

    *   You should make use of a combination of upper and lower case letters. You
    should create the name just like a small sentence, and begin every new word with
    a capital letter such as `“PlaceOfBirth`.


    These were some of the fundamentals of `R` syntax. Now, we’ll discuss the effective
    use of functions and arguments.


    ### How to effectively use function & arguments?


    #### Ways to vectorize the functions


    The process involves creation of vectors, and placing them inside the function.
    Vectorizing the functions are quite an effective trait of `R`; however, various
    professionals who are not that much used to `R`, frequently face difficulties
    in the beginning, as they are not aware of such concept. Any function which is
    vectorized, effects not only a solo value, but also the entire vector values simultaneously.
    Vectorizing the functions in `R` will certainly simplify the code.


    First and foremost, you need to create a vector. You can utilize the `c()` function,
    and the values need to be separated by commas (`,`). Following is an example:


    Just assume that Phillip is playing basketball with his friends, and his brother
    is keeping a tally of the Phillip’s baskets in every game. After five games, Phillip
    asks his brother about how many baskets he had made so far. Now, the number of
    baskets made by him can be put in a vector in the following way:


    ```r

    > Phillip <- c(10,5,5,4,8)

    > Phillip

    ```

    [1] `10 5 5 4 8`


    And, to know the total number of baskets made by Phillip, you can use the `sum()`
    function:


    ```r

    > sum (Phillip)

    ```

    [1] `32`


    Another example is the `paste()` function. In case you create a vector with just
    the names of various fruits, `paste()` can add the text “fruit” next to all of
    them with a single command. Here is the example:


    ```r

    > Fruitnames <- c(“Apple”, “Banana”, “Orange”)

    > addname <- “Fruit”

    > paste(Fruitnames, addname)

    ```

    [1] `“Apple Fruit” “Banana Fruit” “Orange Fruit”`


    `R` can even mix two long vectors element-wise. Following is the example:


    ```r

    > Fighters <- c(“Fedor”, “Jon”)

    > last.names <- c(“Emilianenko”, “Jones”)

    > paste(Fighters, last.names)

    ```

    [1] `“Fedor Emilianenko” “Jon Jones”`


    You just don’t need to write any complex code. You just have to create vectors,
    and place them inside the function. Now, we’ll discuss the ways to place arguments
    in a function.


    #### Ways to place argument within a function


    Arguments provide specific details about precisely what a function is meant to
    execute. You can use 2 general arguments types in R:


    *   Arguments having default values.

    *   Arguments devoid of default values.


    In case an argument is devoid of default value, then the value might be compulsory
    or optional. Usually, the first argument is always necessary. Type and execute
    the following code:


    ```r

    > print( )

    ```

    `R` will inform you that the command requires the `x`:


    `(Error in .Internal(print.default(x, quote, na.print) : ‘x’ is missing)`


    Now, you need to assign an argument in the following:


    ```r

    > print(x = “What is my name?”)

    ```

    Or


    ```r

    > print(“What is my name?”)

    ```


    These were some examples of how to place argument in your function. Now we’ll
    discuss the ways to make your code plain readable.


    ### How to make your code plain & readable?


    When you initiate to use functions and carry out complicated calculations, your
    entire code might become a huge mess of symbols as well as texts. Fortunately,
    we are here to tell you certain tips & tricks, to clean-up your code, and make
    it more readable.


    Using functions and performing difficult calculations could result in longer lines
    of code in `R`. Now, `R` allows you break your line of code into multiple lines,
    just like any normal text editor, in your script. And, you also don’t need to
    utilize any specific character to achieve this. `R` will interpret that the line
    of code isn’t over yet, provided that you offer it certain clue. Following are
    the techniques to do this:


    *   Utilize a quotation-mark to begin a string: `R` would consider the entire
    input which will follow the 1st quotation-mark, even the line-breaks, as an element
    of the string, till it encounters the 2nd quotation-mark.

    *   End the unfinished command with an operator symbol (such as `+`, `/`, `<-`
    etc.): `R` would interpret that some more code is to follow, and will allow you
    to build structure in huge and complex calculations.

    *   Open a bracket (parenthesis) for a function: `R` would interpret the entire
    input it receives as a single line, till it encounters the 2nd matching bracket
    (parenthesis).


    ### How to broaden R Programming with user packages?


    The actual power of `R` is that it allows everybody to write their own functions
    as well as share those functions with other numerous R users in a structured way.
    Several programmers have written suitable functions in `R`, and quite frequently
    a fresh statistical technique gets published every now and then. Many such programmers
    then share their code which is known as R package. These user packages are the
    compilations of R code, data-sets, Help-files etc., and can be simply integrated
    into `R`.


