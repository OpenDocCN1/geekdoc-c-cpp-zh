    在这里，你可以注意到一个重要的一点是，两个变量的值都没有发生变化。而且，在给它们分配新值之前，它们不会改变。


    你甚至可以给变量分配文本值。创建一个变量 `x`，并将 `Welcome` 文本放在“ ”中来给它赋值：


    ```r

    x <- “Welcome”

    x

    ```

    [1] “Welcome”


    你甚至可以利用 `c()` 函数来组合文本。创建一个变量 `n`，并给它赋值 `c()` 的值：


    ```r

    n <- c(“Welcome”, “Sir!”)

    n

    ```

    [1] “Welcome” “Sir!”


    你可以利用 `paste()` 函数将多个文本连接在一起。`paste()` 函数会自动在不同的文本之间插入空格：


    ```r

    paste(“Welcome”, “Sir!”)

    ```

    [1] “Welcome Sir!”


    这些都是你在 R 中可以进行的一些基础计算。现在，我们将讨论在 R 中可以执行的其他各种事情。


    ## 如何运行脚本（source script）？


    现在，是时候提升一个了，让 R 连续执行各种命令，而无需等待进一步指令。在 R 中，`source()` 函数用于运行整个脚本，用户将这整个过程称为“源化脚本（Sourcing-a-Script）”。


    为了设置要源化的脚本，你首先需要在编辑器中输入你的整个脚本。在这里，我们使用的是 R Studio 编辑器。只需在 R Studio 编辑器中输入以下代码：


    ```r

    b <- “Hey!”

    n <- readline(“What is my name?”)

    print(paste(b, n))

    ```


    你可以在 R Studio 编辑器中输入多行代码。之后，当一切设置完成后，你可以运行脚本（将命令发送给 R）。在 R Studio 或 RGui 中，你可以通过以下方法任一完成此任务：


    *   从源编辑器将单行代码传输到控制台：只需点击你想运行的单行代码，然后在 RGui 编辑器中按下 `Ctrl+R` 键。你需要按下 `Ctrl+Enter`
    键，或者点击 R Studio 编辑器中的“Run（运行）”按钮。

    *   将一段所需的代码传输到控制台：首先，选择你想要运行的整个代码块，然后在 R Studio 中按下 `Ctrl+Enter` 键，或在 RGui 编辑器中按下
    `Ctrl+R` 键。

    *   源化脚本或将整个脚本传输到控制台：在 R Studio 中，只需点击源编辑器部分，然后按下 `Ctrl + Shift + Enter` 键，或点击“Source（源）”按钮。在
    RGui 中，只需点击你的脚本窗口，然后选择 `Edit>Run all（运行全部）`。


    你现在可以将你的整个脚本传输到你的 R 控制台。只需点击源编辑器部分的“Source”按钮，或选择 `Edit>Source`。你上面的脚本将开始运行并到达末尾，在那里会要求输入某些值，然后等待你在控制台窗口区域输入你的名字。


    ![Sourceot.jpg](img/00011.jpeg)


    ## 导航工作空间的方法


    工作空间意味着你在整个会话中构建的所有函数以及变量的集合，以及加载的任何包。你可能经常需要提醒自己保存在工作空间中的所有变量。你可以利用 `ls()` 函数获取工作空间中所有对象（函数、变量等）的列表。只需在
    R 控制台中输入 `ls()` 即可：


    ```r

    ls()

    ```

    [1] “a” “go” “k” “l” “normal” “m”


    R 将通知你所创建的每一个变量的名称。


    ## 操作工作空间内容的方法


    如果你觉得不需要某些工作空间对象，可以轻松删除它们。例如，你不再需要对象 `m`，并想从工作空间中移除它。现在要删除它，只需利用 `rm()` 函数，然后再次利用
    `ls()` 函数交叉检查你的工作空间内容：


    ```r

    rm(m)

    ls()

    ```

    [1] “a” “go” “k” “l” “normal”


    你可以看到对象 `m` 不再存在。


    ## 保存工作的方法


    有多种方法可以保存你的工作：


    *   使用 `save()` 函数保存你的单个变量。

    *   使用 `save.image()` 函数保存整个工作空间。

    *   你可以使用代码编辑器中适当保存菜单命令保存你的 R 脚本文件。


    例如，你想保存“normal”变量的值。只需执行以下操作：


    *   查找 R 将保存你的文件的工作目录。你需要输入以下命令：


    ```r

    getwd()

    ```

    [1] “c:/users/delfim”


    通常，你的用户文件夹是自动保存文件的工作目录。具体的名称以及文件夹的路径实际上取决于你的操作系统（OS）。

    *   在 R 控制台中输入以下命令，可以使用任何名称如 `myname.rda`，然后按下“Enter”键：


    ```r

    save(normal, file= “myname.rda”)

    ```

    R 将你的文件保存在工作目录中。如果过程成功结束，你将不会收到任何确认消息。

    *   并且，为了确保整个过程成功，你可以交叉检查。


