    How to summarize your data?


    As R programming was specifically created to carry-out statistical calculations,
    you can implement all the frequent statistical methods with a solo command. Furthermore,
    all such commands are splendidly acknowledged in the ‘R Help-files’. And, in case
    you require further advanced techniques, or to apply progressive research, then
    there might a package available for that, and various such packages are accompanied
    by a guide of examples.


    Beginning with the correct data:


    Prior to making an attempt to explain your data, you need to ensure that your
    data is in the correct format. It means:


    *   Ensuring that your entire data is stored in a data-frame or in a vector (in
    case your data is a solo variable).


    *   Make certain that the entire variables are of the right category.


    *   Verifying that the entire values are processed properly.


    Ways to count unique values:


    Let’s consider the example of the in-built data-set ‘mtcars’. It explains the
    fuel usage and 10 diverse designs of thirty cars from the seventies. It consists
    of eleven variables which are all numeric. In case, you have no knowledge about
    the number of diverse values that a variable possess, you can extract such details
    in 2 easy steps:


    *   Obtain the exclusive variable values by utilizing unique( ) function.


    *   Obtain the length of the resultant vector by utilizing length( ) function.


    However, in case you utilize the sapply( ) function, you’ll be able to perform
    this for the entire data-frame. You implement an unknown function merging both
    the above stated steps on the entire data-frame, just by typing the following:


    > sapply(mtcars, k(y) length(unique(y)))


    cyl mpg hp disp wt drat qsec vs am carb gr


      4   21   19  25    28  22   30  2   2    5     4


    Ways to prepare data:


    In several real-life scenarios, you’re sometimes loaded with plenty of data in
    a huge box file, and unluckily in such a format, which you can’t utilize by any
    means. However, with the help of R, you can swiftly design your data precisely
    the way you desire it to be. Simply choosing the variables you require and converting
    these to the correct format, will be relatively simple.


    Let’s set up the data-frame ‘mtcars’ by utilizing certain easy tricks. Build a
    data-frame ‘r’:


    > r <- mtcars[c(3, 1, 11, 8, 9)]


    > r$gr <- ord(r$gr)


    > r$am <- factor(r$am, labels=c(‘at’, ‘mn’))


    Following is the break-up of the code:


    *   Pick 4 variables from the data-frame ‘mtcars’ and store them in a data-frame
    ‘r’.


    *   Turn the variable ‘gr’ in this data-frame in to an ‘ord’ factor.


    *   Assign the variable ‘am’, the value ‘at’ in case its value is one, and ‘mn’
    in case value is zero.


    *   Convert the new variable ‘am’ into a factor.


    When you run the code, you’ll have the following outcome:


    > str(r)


    ‘data.frame’: 30 obs. of 5 variables:


    $ cyl     : num   5   7  4    7    9 ...


    $ mpg : num 15 18 22 20 18 ...


    $ hp     : num 18 19 20 22 21 ...


    $ gr     : ord.factor w/ 4 levels “4”<”5”<”6”: 3 3 3 2 2 ...


    $ am   : Factor w/ 2 levels “at”, “mn”: 3 3 3 1 1 ...


    These were some of the ways to summarize your data.


    ****


    In this chapter, we discussed the various ways to efficiently manipulate your
    data. We discussed how to get your data in & out of R, how to effectively manipulate
    and process your data, and how to summarize your data.


    .


    In the next chapter, we’ll talk about how to work with Graphics.


    # Chapter Seven: How to work with Graphics?


    In this chapter, we’ll talk about how to work with Graphics. We’ll discuss how
    to use base graphics, and how to create Facetted Graphics using Lattice.


    How to use base graphics?


    R comes with extremely potent graphics potential, which can immensely assist you
    to envision your data. And, it’s all possible due to the base graphics.


    Ways to create diverse forms of Plots:


    In R, to build a plot, you need to utilize the base graphics function known as
    plot( ). Such a potent function has numerous preferences and arguments, to manage
    almost everything.


    To embark with plot, you have to lay down a data to utilize, first-of-all. Here,
    we’ll utilize an in-built data-set called ‘islands’, which consists of the data
    regarding the continents, and certain big islands of our Planet. Note: The in-built
    data-sets in R are recognized in the similar way as functions are recognized.
    To know more about it just type: ?islands.


    The initial step is to build a subset of the 5 biggest islands in the data-set.
    The below mentioned code classifies (sorts) the islands in descending order, and
    after that, utilizes the head( ) function to extract only the initial 5 constituents:


    > big.isl <- head(sort(islands, descending = TRUE), 5)


    You can even generate a plot with helpful titles as well as labels by typing the
    following:


    > plot(big.isl, main= “Continents & Islands”,


    + ylab= “Area Sq. Miles”)


    > text(big.isl, labels=names(big.isl), adj=c(0.5, 1))


    The 1st code line constructs a basic plot utilizing the plot( ) function, and
    inserts the main title as well as the y-axis (label). The 2nd code line inserts
    text labels utilizing the text( ) function. You can see the result in the following
    figure:


    ![cont.jpg](images/00032.jpeg)


    Ways to insert points to the plot:


    Here, we’ll utilize the in-built data-set called ‘faithful’. It’s a data-frame
    containing the information about eruptions. Now, try plot( ) with it:


    > plot(faithful)


    The following figure displays the plot.


    ![erupt.jpg](images/00033.jpeg)'
