  trans: "\n\n如果你想在向量 `y` 中仅保留大于 3 的值，只需输入以下命令：\n\n```\ny <- c(2, 5, 7, 3)\ny[y >\
    \ 3]\n[1] 5 7 \n```\n\n## 合并逻辑语句的方法\n\n假设你想要检查一个值是否处于某个参数范围内，例如，你想知道它是否大于最小值且小于最大值。一个例子是菲利普（Phillip）进球最少或最多的篮球场次。要找到正确的结果，首先尝试记录下菲利普进球最少的场次，以及他进球最多的场次：\n\
    \n首先，构建以下逻辑向量：\n\n```\nleast.baskets <- Phillip.baskets == least(Phillip.baskets)\n\
    most.baskets <- Phillip.baskets == most(Phillip.baskets)\n```\n\n当数值等于最小值时，`least.baskets`\
    \ 会告知你；当数值等于最大值时，`most.baskets` 会告知你。\n\n使用“或”（OR, 运算符 `|`）来合并这两个向量：\n\n```\n\
    least.baskets | most.baskets \n[1] TRUE TRUE TRUE FALSE FALSE\n```\n\n这些是处理逻辑向量的一些方法。接下来，我们将讨论使用字符向量处理文本数据以及操作文本的不同方法。\n\
    \n## 如何使用字符向量处理文本数据并操作文本\n\n字符向量在 R 中表示文本。字符向量本质上是一个包含字符的向量。\n\n### 创建以及分配命名向量的方法\n\
    \n你需要利用赋值运算符（`<-`）来为任何向量分配名称。假设你想为每个月的所有天数构建一个命名向量。你需要先构建一个包含每个月份总天数的数值向量。之后，利用名为\
    \ `month.name` 的内置数据集为月份命名：\n\n```\ndays.month.count <- c(31, 28, 31, 30, 31,\
    \ 30, 31, 31, 30, 31, 30, 31)\ntitle(days.month.count) <- month.name\ndays.month.count\n\
    Jan Feb March April May June July August Sept Oct Nov Dec\n31  28     31     \
    \    30   31   30    31      31     30     31     30   31\n```\n\n你还可以利用上述向量获取包含\
    \ 30 天的月份：\n\n```\ntitle(days.month.count [days.month.count ==30])\n[1] “April”\
    \ “June” “Sept” “Nov”\n```\n\n结果显示了包含 30 天的月份名称。\n\n#### 操作文本的方法\n\n一组合并的字母或或单词被称为“字符串”（string）。如果你想操作文本，必须能够拆分字母或合并它们。\n\
    \n#### 如何分割文本？\n\n构建一个名为 `sp` 的字符向量，并将其赋值为“I love to play hockey”：\n\n```\nsp\
    \ <- “I love to play hockey”\nsp\n[1] “I love to play hockey”\n```\n\n现在，为了在空格处分割上述文本，你需要利用\
    \ `strsplit()` 函数：\n\n```\nstrsplit(sp, “ ”)\n[[1]]\n[1] “I” “love” “to” “play”\
    \ “hockey”\n```\n\n结果显示了分割后的字符串。\n\n#### 如何拼接文本？\n\n为了拼接文本，你需要利用 `paste()` 函数：\n\
    \n```\npaste(“I”, “love”, “to”, “play”, “hockey”)\n[1] “I love to play hockey”\n\
    ```\n\n`paste()` 会自动利用遇到的任何空格来组合向量。\n\n## 如何处理日期和时间？\n\nR 提供了多种函数允许你处理日期和时间。构建日期的简单方法是利用\
    \ `as.Date()` 函数。例如，写入 2016 奥运会的日期：\n\n```\nog <- as.Date(“2016-08-05”)\nog\n\
    [1] “2016-08-05”\nstr(og)\nDate[1:1], “2016-08-05”\n```\n\n如果你想知道该日期是星期几，需要利用\
    \ `weekdays()` 函数：\n\n```\nweekdays(og)\n[1] “Friday”\n```\n\n你甚至可以从日期中减去增加数值。例如，计算\
    \ 8 天后的日期，输入以下代码：\n\n```\nog + 8\n[1] “2016-08-13”\n```\n\n就像文本一样，你可以在向量中放置多个日期。为了构建从\
    \ 5 号开始的 6 天向量，添加 `0:5`：\n\n```\nog + 0:5\n[1] “2016-08-05” “2016-08-06” “2016-08-07”\
    \ “2016-08-08” “2016-08-09” “2016-08-10”\n```\n\n有时，仅有日期是不够的。还需要指定精确的时间。因此，为了配合日期指定时间，你可以选择这些函数之一：\n\
    \n- `as.POSIXct()`\n- `as.POSIXlt()`\n\n上述日期-时间函数会在内部处理日期。\n\n## 将向量组合为矩阵\n\n\
    目前为止，我们一直在创建向量来存储 1-D（一维）排列的数据。然而，除了向量，R 还提供了处理矩阵。实际上，R 擅长计算和操作。向量与更大的组被称为“数组”（arrays）。数组有两个重要的属性：\n\
    \n- 它们具有特定的类型\n- 它们拥有维度\n\n向量只有一个维度，矩阵有两个，而数组更多。\n\n### 如何创建矩阵？\n\n你只需要利用 `matrix()`\
    \ 函数来创建矩阵。然而，你需要首先向 R 提供一些你想放入矩阵的值，以及你想如何放置这些值。`matrix()` 函数带有某些参数：\n\n- `data`:\
    \ 你想放入矩阵的值向量。\n- `ncol`: 接受数字并告知 R 列数。\n- `nrow`: 接受数字并告知 R 行数。\n- `byrow`: 接受逻辑值并告知\
    \ R 你想按列还是按行加载矩阵。\n\n下面的命令显示了一个从 2 到 13 具有 3 列 4 行的矩阵：\n\n```\nfm <- matrix(2:13,\
    \ ncol=3)\nfm\n[,1] [,2] [,3]\n[1,]      2    6   10\n[2,]      3    7   11\n\
    [3,]      4    8   12\n[4,]      5    9   13\n```\n\n现在，你不需要指定 `ncol` 或 `nrow`。如果你只说明一个，R\
    \ 会自动解释另一个。而且，如果你想按行加载矩阵：\n\n```\nmatrix(2:13, ncol=3, byrow=TRUE)\n     [,1]\
    \ [,2] [,3]\n[1,]      2    3    4\n[2,]      5    6    7\n[3,]      8    9  \
    \ 10\n[4,]     11   12   13\n```\n\n### 将向量组合为矩阵的方法\n\n让我们考虑篮球比赛的例子，我们创建了两个包含菲利普和乔（George）进球数的向量。现在，如果你想把他们两人的进球数放在一个实体中，你可以使用矩阵。你需要使用\
    \ `rbind()` 函数将两个向量合并为矩阵的 2 行：\n\n```\nPhillip.baskets <- c(10,3,3,5,8)\nGeorge.baskets\
    \ <- c(4,2,1,1,10)\nTotal_baskets <- rbind(Phillip.baskets, George.baskets)\n\
    ```\n\n在这里，实体 `Total_baskets` 是一个矩阵，行获得了向量的名称：\n\n```\nTotal_baskets\n[,1] [,2]\
    \ [,3] [,4] [,5]\nPhillip.baskets  10    3    3    5    8\nGeorge.baskets  4 \
    \   2    1    1   10\n```\n\n同样，要将向量作为矩阵的列合并，你需要利用 `cbind()` 函数：\n\n```\ncbind(2:4,\
    \ 5:7, matrix(8:13, ncol=2))\n[,1] [,2] [,3] [,4]\n[1,]      2    5    8   11\n\
    [2,]      3    6    9   12\n[3,]      4    7   10   13\n```\n\n"
- fmt: "\nIn the above example you merged 3 different anonymous entities:\n\n* A vector\
    \ with the values 2:4\n* A vector with the values 5:7\n* And, a matrix with 3\
    \ rows and 2 columns, loaded column by column with the values 8 to 13.\n\nNow,\
    \ the above example exhibits various helpful properties of `rbind()` & `cbind()`\
    \ functions:\n\n* These work with both matrices as well as vectors.\n* You can\
    \ provide in excess of 2 arguments to each function.\n* You can merge diverse\
    \ types of entities, provided that the dimensions are appropriate.\n\n## How to\
    \ calculate with matrices?\n\nPossibly the biggest attribute of R is its ability\
    \ to handle complicated matrix calculations in a very simple way. So, when you\
    \ consider calculations on matrices, you can either consider its elements, or\
    \ the entire matrix as a value. In case you wish to add scalar (a solo number)\
    \ to any matrix, you integrate that solo number to each constituent of that matrix.\
    \ You just need to utilize the addition (`+`) operator, to perform this:\n\n```\n\
    > fm + 5\n      [,1]  [,2]  [,3] \n[1,]   7    11    15\n[2,]   8    12    16\n\
    [3,]   9    13    17\n[4,]  10    14    18\n```\n\nLikewise, you can even utilize\
    \ numerous arithmetic operators to carry out any calculation on each of the elements\
    \ of a matrix. Consider one more example:\n\nIn the above mentioned matrix `fm`,\
    \ you wish to add 2 to the 1st row, 3 to the 2nd row, 4 to the 3rd row, and 5\
    \ to the 4th row. This can be done by creating another matrix `fx`, which consists\
    \ of 3 columns and 4 rows, and has 2, 3, 4 and 5 as values in the 1st, 2nd, 3rd\
    \ and 4th rows, in that order:\n\n```\n> fx <- matrix(2:5, nrow=4, ncol=3)\n```\n\
    \nUtilizing the addition (`+`) operator, both the matrices (`fm` & `fx`) can be\
    \ merged:\n\n```\n> fm + fx\n        [,1]  [,2]  [,3] \n[1,]   4     8    12\n\
    [2,]   6    10    14\n[3,]   8    12    16\n[4,]  10    14    18\n```\n\nYou need\
    \ to keep in mind that the dimension of the two matrices should match. Or, R won’t\
    \ perform the operation, and you’ll get the following outcome:\n\n```\n> fm +\
    \ fx[,2:4]\nError in fm + fx[, 2:4] : non-conformable arrays\n```\n\nHowever,\
    \ in case if we add a vector as an alternative to a matrix, you’ll get the following\
    \ outcome:\n\n```\n> fm + 2:4\n        [,1]  [,2]  [,3] \n[1,]   4     8    12\n\
    [2,]   6    10    14\n[3,]   8    12    16\n[4,]  10    14    18\n```\n\nHere,\
    \ R considers the matrix like a vector, and plainly overlooks the dimensions.\n\
    \nThese were some of the ways to calculate with matrices. Now, we’ll talk about\
    \ the various ways to combine different types of value in a Data-Frame, and manipulate\
    \ those values.\n\n## How to combine different types of value in a Data-Frame,\
    \ and manipulate those values?\n\nData-sets are developed from diverse data types.\
    \ For instance, you can include your employee’s names, their incomes, and their\
    \ joining date, all in the similar data-set. However, you just can’t merge all\
    \ such data in a single matrix without changing the data to a character value.\
    \ Therefore, you require a new data-structure to retain all such details in R.\
    \ And, this data-structure is known as a Data-Frame.\n\n### Ways to build a data-frame\
    \ from a matrix\n\nLet’s again consider the basketball game example, where we\
    \ built a matrix `Total.baskets` which contained the number of baskets made by\
    \ Phillip and George:\n\n```\nTotal.baskets\n [,1] [,2] [,3] [,4] [,5]\nPhillip\
    \  10     3     3     5     8\nGeorge  4     2     1     1    10\n```\n\nWe can\
    \ convert this matrix into a data-frame having 2 variables: one variable with\
    \ Phillip’s baskets and another with George’s baskets. Now, to transform `Total.baskets`\
    \ matrix into data-frame, you need to utilize `as.dataframe()` function:\n\n```\n\
    > dt.baskets <- as.dataframe(t(Total.baskets))\n```\n\nHere, we also need to utilize\
    \ `t()` function, to build data frame. The `t()` function flips the matrix, which\
    \ turns rows into columns and vice versa. In case of data-frames, every variable\
    \ means a column; however, in `Total.baskets` matrix, the rows symbolize the number\
    \ baskets for a participant. Hence, to facilitate the preferred outcome, you need\
    \ to flip `Total.baskets` matrix with `t()` function prior to transforming it\
    \ into data-frame using `as.dataframe()`. Following is the result:\n\n```\n> dt.baskets\n\
    \         Phill George\n1st     10      4\n2nd      3      2\n3rd      3     \
    \ 1\n4th      5      1\n5th      8     10\n```\n\nYou can even utilize the `str()`\
    \ function to check the internal composition of the output:\n\n```\n> str(dt.baskets)\n\
    'data.frame': 5 obs. of 2 variables:\n$ Phillip: num 10 3 5 8\n$ George: num 4\
    \ 2 1 10\n```\n\nHence, it is confirmed that it’s a real data-set.\n\n### Other\
    \ way to create a data-frame\n\nThe previous method to create a data-frame from\
    \ a matrix cannot be utilized to create a data-frame from diverse value types.\
    \ You need to utilize `data.frame()` function in order to create a data-frame\
    \ from any other value types. Let’s create a small data-frame containing names,\
    \ incomes, and joining dates of small number of employees. You need to build 3\
    \ separate vectors with the essential details which as follows:\n\n```\n> names\
    \ <- c('Peter Parker', 'Clark Kent', 'Bruce Wayne')\n> income <- c(31000, 19000,\
    \ 25000)\n> dt.join <- as.Date(c('2012-10-5','2009-04-14','2005-06-20'))\n```\n\
    \nHere, you possess 3 diverse vectors:\n* Character vector (employee names)\n\
    * Numeric vector (income)\n* Date vector (date of joining)\n\nNow, you merge all\
    \ 3 vectors into a data-frame. Type the following command:\n\n```\n> dt.emp <-\
    \ data.frame(names, income, dt.join)\n```\n\nThe following is the outcome of this\
    \ code:\n\n```\n> str(dt.emp)\n'data.frame': 3 objects. 3 variables:\n$ names:\
    \ Factor/ 3 levels \"Peter Parker\" \"Clark Kent\" \"Bruce Wayne\"\n$ income:\
    \ num 31000 19000 25000\n$ dt.join: Date, format: \"2012-10-05\" \"2009-04-14\"\
    \ \"2005-06-20\"\n```\n\n## Manipulating Values in a Data Frame\n\nConstructing\
    \ a data-frame is pleasant; however, data-frames are relatively worthless in case\
    \ you’re not able to alter its values, or integrate data to the data-frames. Fortunately,\
    \ data-frames come with certain good features. In case, you wish to manipulate\
    \ the values, nearly all the plays you performed on matrices could be utilized\
    \ on the data-frames too. Additionally, you can even utilize certain techniques\
    \ which are exclusively designed to be carried out for data-frames.\n\n### How\
    \ to extract values from data-frame?\n\nIn several scenarios, you’d be able to\
    \ extract values from any data-frame by assuming that the data-frame is a matrix,\
    \ and by utilizing the methods you performed on matrices. However, quite dissimilar\
    \ to both matrices as well as arrays, data-frames are not all vectors. So always\
    \ bear in mind that, data-frames are lists of vectors, and even though they might\
    \ appear as matrices, they actually are not.\n\n#### Assuming data-frames as a\
    \ matrix\n\nLet’s again consider the basketball game example. We’ll utilize the\
    \ data-frame `dt.baskets` which we built in the “Ways to build a data-frame from\
    \ a matrix” section earlier.\n\n```\n> dt.baskets\n         Phillip George\n1st\
    \     10      4\n2nd      3      2\n3rd      3      1\n4th      5      1\n5th\
    \      8     10\n```\n\nNow, you can extract the count of baskets made by Phillip\
    \ in the 4th game:\n\n```\n> dt.baskets['4th', 'Phillip']\n[1] 5\n```\n\nSimilarly,\
    \ you can extract the entire baskets made by George utilizing the column index:\n\
    \n```\n> dt.baskets[, 2]\n[1] 4 2 1 10\n```\n\nAnd, in case you wish to see the\
    \ results to be like a data-frame, then you need to utilize `drop=FALSE`:\n\n\
    ```\n> str(dt.baskets[, 2, drop=FALSE])\n'data.frame': 5 obs. of 1 variable:\n\
    $ George: num 4 2 1 10\n```\n\nNow, you might have noticed the dollar symbol ($).\
    \ This symbol is merely a precise approach to access various variables. And, to\
    \ access the George variable, you need to utilize the dollar symbol in the following\
    \ way:\n\n```\n> dt.baskets$George\n[1] 4 2 1 10\n```\n\nThe result here displays\
    \ a vector with the entire values within in that variable. These were some of\
    \ the ways to combine different types of value in a Data-Frame, and manipulate\
    \ those values. Now, we’ll discuss how to create a list, and combine different\
    \ objects in it.\n"
