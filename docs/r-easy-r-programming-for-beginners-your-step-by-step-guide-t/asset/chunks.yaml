    ### Arithmetic expressions


    An arithmetic expression is somewhat more of a composite expression, and is used
    for calculating with numeric values. R comes with certain standard operators:


    * `+` (Symbol for addition)

    * `-` (Symbol for subtraction)

    * `*` (Symbol for multiplication)

    * `/` (Symbol for division)

    * `^` (Symbol for exponentiation)


    The brackets (parentheses) are used to manage the order of calculation. R follows
    the usual BODMAS system of primacy regarding all the arithmetic operators; however,
    brackets (parentheses) are a handy means to evade any mistakes. Following is an
    example:


    ```r

    (78963-56397)/10

    ```

    [1] 2256.6


    ### Conditions expressions


    A condition expression means, either a yes or no, as an answer. The outcome of
    a condition expression is a logical value (true or false). R comes with certain
    standard operators to compare different values, along with certain operators to
    combine those conditions:


    * `==` (symbol for equality)

    * `>=` (symbol for greater than or equal to)

    * `<=` (symbol for less than or equal to)

    * `!=` (symbol for inequality)

    * `&&` (symbol for logical and)

    * `||` (symbol for logical or)

    * `!` (Symbol for logical not)

