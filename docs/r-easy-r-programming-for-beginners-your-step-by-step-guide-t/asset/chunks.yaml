  raw: 'The ‘R-Development-Core-Team’ has made a lot of efforts, and put a lot of
    emphasis into making R compatible with diverse forms of software as well as hardware.
    As a result, R is now available for Mac, Windows, and UNIX systems.


    R is extensible:


    R is a powerful language which performs numerous functions, for instance graphics,
    statistical analysis, and manipulation of huge database. However, one huge benefit
    of R is that it’s greatly extensible. Various programmers can effortlessly write
    down their software, and then distribute them as add-on-packages. And due to this
    effortlessness of crafting such add-on-packages, factually thousands of such packages
    exist. In reality, numerous new statistical analysis techniques are made available,
    which are attached with an R package.


    R offers an engaged group:


    The user base of R is rapidly emerging. Numerous individuals who utilize R, in
    due course, initiate to assist new users as well as promote the use of R in their
    certified circles and at their place of work. Occasionally, they also tend to
    get active on the R mailing-lists, or Q&A (question & answer) websites, for instance
    ‘Stack-Overflow’. Other than such mailing lists, and question & answer websites,
    they even join various social networks, for instance, Twitter, Face-book, and
    various provincial R user forums.


    R effectively links with various other programming languages:


    With growing number of individuals moving towards R for their data-analysis, they
    began to make attempts to merge R with their existing workflows. And, this led
    to an entire array of packages for the purpose of connecting R to various databases,
    file-systems, and numerous other applications. Several such packages have been
    effectively linked to R ever since. For instance, the ‘R-package-foreign’ is division
    of the ‘Standard-R-distribution’, and it allows you to interpret data from the
    ‘Statistical-Packages’ such as SAS, SPSS, STATA, and various others. Numerous
    add-on packages are there in order to link R to various database systems, for
    instance the ‘RODBC package’ to interpret data utilizing the ODBC (Open Database
    Connectivity protocol), and the ‘ROracle package’ to interpret ‘Oracle databases’.


    R processes further than Statistics only:


    R was created and developed initially by statisticians in order to simplify the
    entire statistical procedure. And, this legacy is still moving forward, which
    has turned R into a very potent tool to perform practically any statistical calculation.
    Since R began to develop away from its genesis in statistics, numerous individuals
    who usually would like to call themselves as software-programmers instead of statisticians,
    have grown to get engaged with R. And consequently, R has now become highly apt
    for an extensive range of non-statistical assignments, which comprises graphic
    visualization, data processing as well as all sorts of data scrutiny. R is effectively
    being utilized in the various areas of genetics, finance, natural language processing,
    market research and biology, and many more.


    In this chapter, we’ve discussed a brief history of R Programming, what exactly
    R programming is, and what are the benefits of using R language.


    ****


    In the next chapter, we’ll discuss how to install R and R Studio, the right code
    editors to begin coding R Programming, working with your code editors, the initial
    R session, how to source a script, and ways to navigate the workspace.


    # Chapter Two: How to Get Started?


    In this chapter, we’ll discuss how to install R and R Studio, the right code editors
    to begin coding R Programming, working with your code editors, the initial R session,
    how to source a script, and ways to navigate the workspace.


    How to install R and R Studio?


    Prior to using R, you have to install R, to begin with. And, even though you can
    utilize the in-built code editor, you might also wish to install an editor with
    advance functions. As R Studio runs on every platform and is incorporated smoothly
    with R, we’ll also talk about the R Studio installation.


    Installing R:


    It’s not that complicated to install R; however, fine-tuning it to make it compatible
    to your requirements entails a little clarification. You can locate all the essential
    installation files, and all required details about the installation process at
    CRAN (Comprehensive R Archive Network) site. Pick the link for your preferred
    OS (Operating System) that will further advance you to the download site to avail
    the newest R distribution. To get all the comprehensive installation information,
    just log on to ([https://cran.r-project.org/doc/manuals/R-admin.html](https://cran.r-project.org/doc/manuals/R-admin.html)).


    Following are the installation steps for Windows users:


    *   Visit CRAN (CRAN; [https://cran.r-project.org/](https://cran.r-project.org/)).


    *   Click ‘Download R for Windows’ option.


    ![Rinstall.jpg](images/00001.jpeg)


    *   After that click ‘Base’ option, and get (download) the ‘Installer File’ for
    the newest version of R.


    ![base.jpg](images/00002.jpeg)


    *   Then right click on the ‘Installer File’ and choose ‘Run-as-Administrator’
    option.


    ![Run.jpg](images/00003.jpeg)


    *   Pick the language you prefer which would be used all through installation
    process.  Now, this step won’t alter the R language, and the entire Help files
    as well as messages would continue in English.


    *   Carefully follow all the instructions.  You can even opt for all the default
    settings, which are safe and secure, and keep on clicking ‘Next’ button, till
    R begins to install.


    R is available for both 64 bit and 32 bit Windows version. In case you own a 64-bit
    Windows OS, you can simply install both the versions. The ‘Installer File’ will
    also perform this task. And, for any other versions, you can certainly get further
    details at the R Installation site mentioned above. The R version for 32 bit is
    entirely brilliant, and occasionally this version is a little faster as compared
    to the R version for 64 bit system. You might require the 64 bit R version just
    in case you need that extra memory.


    For Linux & Mac Users:


    For those who own Linux and Mac OS, they’re specifically advised to carefully
    read the entire instructions and information, when they log on to the ‘CRAN’ site.
    R can be easily installed and run on every single system; however, on the basis
    of your version of Linux or Mac, you might be required to follow specific instructions
    to efficiently install R. And, if you don’t follow those instructions carefully,
    it might cause harm to your system.


    Installing R Studio:


    R Studio version is a quite new and relatively polished editor for R. Usually,
    it is highly recommended as it is pretty simple to use. It has great support system,
    comes with a decent ‘Help-page’, and integrates R in a realistic manner.


    Following are the simple steps to install R Studio:


    *   Log on to (  [https://www.rstudio.com/products/rstudio2/](https://www.rstudio.com/products/rstudio2/).
    )


    *   Then click the ‘RStudio Desktop’ button.


    ![Rstudio.jpg](images/00004.jpeg)


    *   Pick the ‘Installer file’ in accordance with your system versions.


    *   Next, click the ‘Run’ option.


    Subsequently, R Studio will get installed on your particular system. R Studio
    by default will detect your newly installed R version, and you can utilize R from
    inside R Studio. Plus, you won’t be requiring any additional configuration.


    What are the right code editors to begin coding R Programming?


    To begin coding in R, you’ll require an editing tool. Now, whichever editing tool
    that you utilize will depend on your OS (Operating System) in some measure, as
    R itself doesn’t offer any particular graphical editor for any OS (Operating System).


    The primary R install provides you the following: 


    *   For Windows version: An editor known as ‘R Gui’.


    *   For Mac OS X version: An editor known as ‘R.app’.


    *   For Linux version: There isn’t any precise editor for Linux version; however,
    you can utilize other editors such as ‘Emacs’ or ‘Vim’.'
