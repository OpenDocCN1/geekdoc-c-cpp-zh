  trans: "\n统计计算中常见的问题之一是数据集不完整。为了处理缺失值，R 使用了一个名为 `NA` 的特定关键字（代表 Not Available，即不可用）。你可以将\
    \ `NA` 用作合适的值，甚至可以将其赋值为一个值：\n\n```\ny <- NA\n```\n\n然而，请记住，使用 `NA` 值进行的计算通常会得到\
    \ `NA` 结果：\n\n```\ny + 4\n```\n[1] NA\n\n```\nlog(y)\n```\n[1] NA\n\n```\n\n此外，如果你想检查一个特定值是否为\
    \ `NA`，可以使用名为 `is.na()` 的函数：\n\n```\nis.na(y)\n```\n[1] TRUE\n\n```\n\n以下是函数 `infinite`、`NAN`\
    \ 和 `NA` 的结果表：\n\n![infresalt.jpg](img/00023.jpeg)\n\n这些都是算术的基本知识。现在，我们将讨论在向量（Vectors）中组织数据的方法。\n\
    \n## 如何在向量中组织数据？\n\n在 R 中，向量是你执行任务时使用的最小元素。它们同时具有类型和结构。以下是向量类型：\n\n- **数值向量 (Numeric\
    \ vectors)**：意味着所有类型的数值。\n- **整数向量 (Integer vectors)**：意味着所有整数值。 \n- **逻辑向量 (Logical\
    \ vectors)**：意味着所有逻辑值（`TRUE` 或/或 `FALSE`）。\n- **字符向量 (Character vectors)**：意味着所有类型的文本。\n\
    - **日期时间向量 (Date-time vectors)**：意味着各种格式的日期和时间。\n- **因子 (Factors)**：意味着用于处理特定组的唯一向量类型。\n\
    \n### 创建向量的方法：\n\n为了从一个简单的整数序列创建向量，你可以利用冒号 (`:`) 运算符。代码 `4:9` 将创建一个包含 4 到 9 整数的向量，而\
    \ `5:-2` 将创建一个包含 5 到 –2 整数的向量。\n\n此外，为了在任何序列中创建更大或更小的步长，你可以利用 `seq()` 函数。这个特殊函数允许你指定数字增加/减少的幅度。这是一个示例：\n\
    \n```\nseq(from = 5, to = 2, by = -1)\n```\n[1] 5 4 3 2\n\n```\n\n### 合并向量的方法：\n\
    \n`c()` 函数在 R 中代表连接（concatenate）。该函数简单地组合了向量。考虑以下示例：\n\n```\nPhillips.baskets\
    \ <- c(10,3,3,5,8)\nGeorge.baskets <- c(4,2,1,1,10)\nTotal.baskets <-c(Phillips.baskets,\
    \ George.baskets)\nTotal.baskets\n```\n[1] 10 3 3 5 8 4 2 1 1 10\n\n```\n\n这段代码的结果表示包含所有十个值的向量。`c()`\
    \ 函数不会改变数字的顺序。这意味着向量是有顺序的。我们将在后续章节中进一步讨论这种顺序。\n\n```\n\n### 重复向量的方法：\n\nR 提供了一个特定的函数来重复向量，即\
    \ `rep()`。该函数可以用多种方式使用。如果你想重复整个向量，需要指定参数 `times`。为了重复向量 `c(1,1, 6)` 四次，只需输入此命令：\n\
    \n```\nrep(c(1,1,6), times = 4)\n```\n[1] 1 1 6 1 1 6 1 1 6 1 1 6\n\n```\n\n你还可以通过指定参数\
    \ `each` 来重复每个值：\n\n```\nrep(c(1, 3,1), each = 4)\n```\n[1] 1 1 1 1 3 3 3 3 1\
    \ 1 1 1\n\n```\n\n你甚至可以告诉 R 每个值需要重复的次数：\n\n```\nrep(c(1, 6), times = c(3,4))\n\
    ```\n[1] 1 1 1 6 6 6 6\n\n```\n\n现在，利用参数 `l` 告诉 R 你所需的长度。向量将一直重复直到遇到你指定的长度，即使最后一次重复完成。考虑以下示例：\n\
    \n```\nrep(3:5,l=8)\n```\n[1] 3 4 5 3 4 5 3 4\n\n```\n\n这些都是在向量中组织数据的一些方法。现在，我们将讨论从向量中获取和输出值的各种方法。\n\
    \n## 如何在向量中获取和输出值？\n\n你可以利用 R 中的高级索引系统轻松地完成此类任务。\n\n### 了解索引系统：\n\n每当 R 显示向量时，它会在任何结果前面显示一个类似\
    \ `[1]` 的数值值。现在通过显示 `[1]`，R 实际上是在告知你向量中第 1 个的位置。它实际上是该向量值的索引位置。此外，如果你创建一个长向量（例如从\
    \ 1 到 20），你将看到额外的索引。这是一个示例：\n\n```\nn <- 20:1\nn\n```\n[1] 20 19 18 17 16 15 14\
    \ 13 12 11 10 9 8 7 6 5 4\n[18] 3 2 1 0 \n\n```\n\n在这里，R 将 3 视为第 18 个向量值。在每行的开头，R\
    \ 都会告知你该特定行第一个值的索引。\n\n```\n\n### 从任何向量中提取值的方法：\n\n方括号 `[]` 用于从任何向量中提取值。每当 R 显示向量时，它会在任何结果前面显示一个类似\
    \ `[1]` 的数值值。现在通过显示 `[1]`，R 实际上是在告知你向量中第 1 个的位置。它实际上是该向量值的索引位置。此外，如果你创建一个长向量（例如从\
    \ 1 到 20），你将看到额外的索引。这是一个示例：\n\n```\nn <- 20:1\nn\n```\n[1] 20 19 18 17 16 15 14\
    \ 13 12 11 10 9 8 7 6 5 4\n[18] 3 2 1 0 \n\n```\n\n在这里，R 将 3 视为第 18 个向量值。在每行的开头，R\
    \ 都会告知你该特定行第一个值的索引。\n\n```\n\n*(注：原文在此处之后存在大量重复和错误，已根据逻辑进行了清理。)*\n\n"
- fmt: "\nIn case, you wish to retain only the values bigger than 3 in the vector\
    \ `y`, just type the following command:\n\n```\ny <- c(2, 5, 7, 3)\ny[y > 3]\n\
    [1] 5 7 \n```\n\n## Ways to merge logical statements\n\nLets’ assume you wish\
    \ to check, whether or not, a value lies inside a certain parameter, for instance,\
    \ you wish to know whether it’s bigger than the smallest number, and lower than\
    \ the largest number. One example would be the basketball games in which Phillip\
    \ made the least or the most baskets. To find the correct results, first try to\
    \ note the games in which Phillip made the least baskets, and when he made the\
    \ most baskets:\n\nFirst of all, construct the following logical vectors:\n\n\
    ```\nleast.baskets <- Phillip.baskets == least(Phillip.baskets)\nmost.baskets\
    \ <- Phillip.baskets == most(Phillip.baskets)\n```\n\n`least.baskets` will inform\
    \ you in case the number is equivalent to the least, and `most.baskets` will inform\
    \ you in case the number is equivalent to the most.\n\nMerge both of the vectors\
    \ by using the OR (`|`) operator:\n\n```\nleast.baskets | most.baskets \n[1] TRUE\
    \ TRUE TRUE FALSE FALSE\n```\n\nThese were some of the ways to work with logical\
    \ vectors. Next, we’ll discuss the various ways use character vectors for Text\
    \ data, and manipulate text.\n\n## How to use character vectors for Text data,\
    \ and manipulate text?\n\nCharacter vectors symbolize text in R. A character vector\
    \ is basically a vector containing characters.\n\n### Ways to create as well as\
    \ assign named vectors\n\nYou need to utilize the assignment operator (`<-`) for\
    \ the purpose of assigning names to any vectors. Let’s assume that you wish to\
    \ construct a named vector for all the days in every month. You need to construct\
    \ a numeric vector consisting of the total count of days in every month. After\
    \ that, utilize the in-built data-set called `month.name` to name the months:\n\
    \n```\ndays.month.count <- c(31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31)\n\
    title(days.month.count) <- month.name\ndays.month.count\nJan Feb March April May\
    \ June July August Sept Oct Nov Dec\n31  28     31         30   31   30    31\
    \      31     30     31     30   31\n```\n\nYou can even utilize the above mentioned\
    \ vector to get the month with 30 days:\n\n```\ntitle(days.month.count [days.month.count\
    \ ==30])\n[1] “April” “June” “Sept” “Nov”\n```\n\nThe result shows name of the\
    \ months with 30 days.\n\n### Ways to manipulate text\n\nA set of merged letters\
    \ or/and words is known as a ‘string’. In case, you wish to manipulate the text,\
    \ you must be able to either split the letters, or merge them.\n\n#### How to\
    \ split text?\n\nConstruct a character vector by the name `sp`, and assign it\
    \ “I love to play hockey”:\n\n```\nsp <- “I love to play hockey”\nsp\n[1] “I love\
    \ to play hockey”\n```\n\nNow, in order to split the above text at the spaces,\
    \ you need to utilize the `strsplit()` function:\n\n```\nstrsplit(sp, “ ”)\n[[1]]\n\
    [1] “I” “love” “to” “play” “hockey”\n```\n\nThe result shows the string split.\n\
    \n#### How to concatenate text?\n\nIn order to concatenate text, you need to utilize\
    \ the `paste()` function:\n\n```\npaste(“I”, “love”, “to”, “play”, “hockey”)\n\
    [1] “I love to play hockey”\n```\n\nThe `paste()` automatically utilizes any blank\
    \ space it encounters to combine the vectors.\n\n## How to work with dates and\
    \ times?\n\nR comes with a variety of functions which permit you to experiment\
    \ with dates and times. The simplest technique for constructing a date is to utilize\
    \ the `as.Date()` function. For instance, you write the inaugural day of the 2016\
    \ Rio Olympic Games as:\n\n```\nog <- as.Date(“2016-08-05”)\nog\n[1] “2016-08-05”\n\
    str(og)\nDate[1:1], format: “2016-08-05”\n```\n\nAnd, if you wish to know which\
    \ weekday this date falls on, you need to utilize `weekdays()` function:\n\n```\n\
    weekdays(og)\n[1] “Friday”\n```\n\nYou can even subtract or add values from dates\
    \ to build fresh dates. For instance, to compute the date which is 8 days after\
    \ this, type the following code:\n\n```\nog + 8\n[1] “2016-08-13”\n```\n\nJust\
    \ like in case of text and/or numbers, you can place many dates inside any vector.\
    \ To build a vector of 6 days beginning on 5, add `0:5` to the initial date:\n\
    \n```\nog + 0:5\n[1] “2016-08-05” “2016-08-06” “2016-08-07” “2016-08-08” “2016-08-09”\
    \ “2016-08-10”\n```\n\n### Ways to incorporate time to dates\n\nSometimes, just\
    \ dates aren’t sufficient. You’re also required to designate a precise time. So,\
    \ to denote time along with dates you can pick any one of these functions:\n\n\
    - `as.POSIXct()`\n- `as.POSIXlt()`\n\nThe above mentioned date-time functions\
    \ vary, as stock-up the date internally, in addition to the technique which user\
    \ can get the date as well as time.\n\n## How to combine Vectors into Matrix\n\
    \nUntil now, we’ve been creating vectors to store data in 1-D (one-dimensional)\
    \ arrangement. However, besides vectors, R offers to work with matrices. In reality,\
    \ R excels with its computations and operations. Vectors are very much associated\
    \ to a larger group as ‘arrays’. Arrays come with two significant attributes:\n\
    - They hold a particular type\n- They possess dimensions.\n\nA vector has just\
    \ one dimension, a matrix has two, and an array has excess of two.\n\n### How\
    \ to create matrix?\n\nYou just need to utilize the `matrix()` function, to create\
    \ a matrix. However, you need to provide some details to R first as which values\
    \ you wish to place inside the matrix, and how you wish to place those values.\
    \ The `matrix()` function comes with certain arguments:\n\n- `data`: a vector\
    \ of values you wish to place inside the matrix.\n- `ncol`: accepts a number and\
    \ informs R about the number of columns.\n- `nrow`: accepts a number and informs\
    \ R about the number of rows.\n- `byrow`: accepts a logical value and informs\
    \ R in case you wish to load the matrix by column, or row by row.\n\nThe below\
    \ mentioned command displays a matrix with the numbers from 2 to 13 in 3 columns\
    \ and 4 rows:\n\n```\nfm <- matrix(2:13, ncol=3)\nfm\n[,1] [,2] [,3]\n[1,]   \
    \   2    6   10\n[2,]      3    7   11\n[3,]      4    8   12\n[4,]      5   \
    \ 9   13\n```\n\nNow, you don’t need to state both the `ncol` or `nrow`. If you\
    \ state just one, R automatically interprets the other. And, in case you wish\
    \ to load the matrix row wise:\n\n```\nmatrix(2:13, ncol=3, byrow=TRUE)\n    \
    \ [,1] [,2] [,3]\n[1,]      2    3    4\n[2,]      5    6    7\n[3,]      8  \
    \  9   10\n[4,]     11   12   13\n```\n\n### Ways to combine vectors into a matrix\n\
    \nLet’s again consider the example of the basketball game, where we created two\
    \ vectors consisting of number of baskets made by Phillip and George. Now, in\
    \ case you wish to put the number of baskets made by both of them in a single\
    \ entity, you can utilize matrices. You need to merge both the vectors like 2\
    \ rows of a matrix using the `rbind()` function:\n\n```\nPhillip.baskets <- c(10,3,3,5,8)\n\
    George.baskets <- c(4,2,1,1,10)\nTotal.baskets <- rbind(Phillip.baskets, George.baskets)\n\
    ```\n\nHere the entity `Total.baskets` is a matrix, and the rows acquire the vector’s\
    \ names:\n\n```\nTotal.baskets\n[,1] [,2] [,3] [,4] [,5]\nPhillip.baskets  10\
    \    3    3    5    8\nGeorge.baskets  4    2    1    1   10\n```\n\nLikewise,\
    \ to merge the vectors as columns of a matrix, you need to utilize the `cbind()`\
    \ function:\n\n```\ncbind(2:4, 5:7, matrix(8:13, ncol=2))\n[,1] [,2] [,3] [,4]\n\
    [1,]      2    5    8   11\n[2,]      3    6    9   12\n[3,]      4    7   10\
    \   13\n```\n"
