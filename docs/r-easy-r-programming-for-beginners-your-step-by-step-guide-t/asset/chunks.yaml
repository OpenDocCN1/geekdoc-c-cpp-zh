    \ year=’2015-2016’)\n\nThe following would be the result:\n\n> nl.baskets\n\n\
    $ counts\n\n                 1st 2nd 3rd 4th 5th\n\nPhillip  10    3    3    \
    \ 5     8\n\nGeorge  4     2    1     1   10\n\n$ year\n\n[1] “2015-2016”\n\n\
    Here, the $ symbol signifies the name of the list of elements.\n\nWays to combine\
    \ lists:\n\nTo combine the lists, all you require is a function which we have\
    \ frequently utilized earlier, the c( ) function. This function can merge diverse\
    \ types of entities and, hence, can be utilized to combine lists, and create a\
    \ fresh list.\n\nNow, in case you wish to add the details about the competitors,\
    \ you need to make a list foremost. And, to ensure that you get the similar results,\
    \ you need to reconstruct the original l.baskets:\n\n> l.baskets <- list(Total.baskets,’2015-2016’)\n\
    \n> competitors <- list(rownames(Total.baskets))\n\nAfter that, you need to merge\
    \ the competitors list with the l.baskets list, utilizing the c( ) function:\n\
    \n> c(l.baskets, competitors)\n\n[[1]]\n\n                 1st   2nd  3rd  4th \
    \ 5th\n\nPhillip     10    3    3     5     8\n\nGeorge     4     2    1     1  \
    \ 10\n\n[[2]]\n\n[1]      “2015-2016”\n\n[[3]]\n\n[1]   “Phillip” “George”\n\n\
    The result exhibits a combination of all the different lists. These were some\
    \ of the ways to create a list, and combine different entities in it.\n\n****\n\
    \nIn this chapter, we discussed the various ways to getting started to working\
    \ in R. We covered diverse topics such as fundamentals of arithmetic, how to organize\
    \ data in Vectors, how to work with logical vectors, manipulating text, vector\
    \ & matrix, data frames, and creation of lists.\n\nIn the next chapter, we’ll\
    \ talk about how to effectively Code in R.\n\n# Chapter Five: How to effectively\
    \ Code in R?\n\nIn this chapter, we’ll talk about how to effectively Code in R.\
    \ We’ll discuss how to efficiently automate your work by utilizing functions,\
    \ how to utilize arguments the smart way, how to control the Logical Flow, how\
    \ to loop through different values, and how to effectively debug your Code.\n\n\
    How to efficiently automate your work by utilizing functions?\n\nTo efficiently\
    \ automate you work in R you can utilize its in-built functions. However, R permits\
    \ you to create your own custom functions which are very easy to build. Let’s\
    \ just create a function:\n\nScript creation:\n\nAssume that you wish to display\
    \ fractional digits just like percentages, which are rounded numbers. Just type\
    \ the following command in your console:\n\ny <- c(0.367, 2.7742, 0.93223)\n\n\
    c <- round(y * 100, digits = 1)\n\nz <- paste(c, “%”, sep = “”)\n\nprint(z)\n\n\
    In case you save this script-file as a xyz.R, you just need to call this script-file\
    \ utilizing the source( ) function:\n\n> source(‘xyz.R’)\n\n[1] “36.7%” “277.4%”\
    \ “93.2%”\n\nWays to transform a script:\n\nTo transform the above script into\
    \ a function, you have to perform certain little steps. Consider the script as\
    \ a manufacturing unit which accepts the raw materials and furnishes them. Now,\
    \ to construct your manufacturing unit, just modify your script like this:\n\n\
    m.unit <- function(y) {\n\nc <- round(y * 100, digits = 1)\n\nz <- paste(c, “%”,\
    \ sep = “”)\n\nreturn(z)\n\n}\n\nThe various elements of the function created\
    \ above are as follows:\n\n*   The keyword ‘function’ ought to be followed by\
    \ brackets (parentheses). It informs R about the arrival of a function.\n\n* \
    \  The brackets (parentheses) following the function store a list of arguments.\
    \ Here its y.\n\n*   The symbols { } means the body of your function.\n\n*   The\
    \ return( ) function displays the result. Here, you’re allowed to insert just\
    \ one item within the brackets (parentheses).\n\nAnd, most importantly, you need\
    \ to utilize the assignment (<-) operator to assign the entire function in an\
    \ entity (here its m.unit). Now, the above function owns a pleasant name, and\
    \ is all set to be utilized.\n\nHow to utilize the function?\n\nJust like in the\
    \ script creation stage, you need to save the script first, and then utilize the\
    \ source( ) function to get the output displayed on your console. However, you’ll\
    \ see no results, as R won’t permit you to know that it has actually loaded the\
    \ function. Now, in reality, the function do exist in the workspace, and you can\
    \ verify it by utilizing the ls( ) function:\n\n> ls( )\n\n[1] “m.unit” “c” “z”\
    \ “y”\n\nThese were some of the ways to efficiently automate your work by utilizing\
    \ functions. Next, we’ll talk about the ways to utilize arguments the smart way.\n\
    \nHow to utilize arguments the smart way?\n\nIn the previous example, the m.unit(\
    \ ) function multiplies the stated digits by hundred, which actually works good,\
    \ in case you wish to transform fractional digits into percentages. However, in\
    \ case, the stated digits are just percentages and not fractional digits, then\
    \ you’re required to divide the stated digits by hundred to obtain the accurate\
    \ outcome:\n\n> p <- c(36.7, 277.4, 93.2)\n\n> m(p/100)\n\n[1] “36.7%” “277.4%”\
    \ “93.2%”\n\nNow, you can actually perform the similar step by adding one more\
    \ argument to the function which manages the multiplication feature. Following\
    \ is the way to do it:\n\nHow to add the ‘multiply’ argument?\n\nYou can add additional\
    \ arguments by putting them within the brackets (parentheses) following the keyword\
    \ ‘function’. Each argument should be separated by a comma. So, in order to add\
    \ ‘multiply’ as an argument, which controls the multiplication feature in the\
    \ code, you need to type the following:\n\nm.unit <- function(y, multiply){\n\n\
    c <- round(y * muliply, digits = 1)\n\npaste(c, “%”, sep = “”)\n\n}\n\nHere, you\
    \ can state the ‘multiply’ argument when you call the m.unit( ). And, in case\
    \ you wish to utilize the p vector from the previous section, you need to type\
    \ the following:\n\n> m.unit(p, multiply = 1)\n\n[1] “36.7%” “277.4%” “93.2%”\n\
    \nHow to add any default value?\n\nThe option to add an additional argument provides\
    \ you with further control over that function; however, it props up a new trouble.\
    \ In case, you don’t state the ‘multiply’ argument in the above mentioned m.uint(\
    \ ) function, the following would be the outcome:\n\n> m.unit(new.numbers)"
