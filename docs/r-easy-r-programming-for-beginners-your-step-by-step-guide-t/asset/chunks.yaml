    ### Expressions


    An expression means a specific command. For instance, the following integers:


    ```r

    1+2+3+4+5

    ```

    [1] 15


    In case, there exists numerous expressions, then they are run in a sequence. The
    following sections will illustrate some of types.


    ### Constant values


    These are the plainest type of R. Constant value is usually a number (numeric
    value), or character text. For instance, if we have to state the number of seconds
    in 5 minutes, we denote a number.


    ```r

