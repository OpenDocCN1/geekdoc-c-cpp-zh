    # Chapter Three: The Basics of R Programming


    In this chapter, we will discuss the fundamentals of R Syntax, how to effectively
    use function & arguments, how to make your code plain & readable, and how to broaden
    R programming with user packages.


    The Fundamentals of R Syntax (How to write the right R code?):


    In this section, we’ll focus on certain precise tasks in order to write the right
    R code, and discuss how these are to be done in R.


    Expressions:


    An expression means a specific command to carry out a specific task. For instance,
    the following expression commands R to add the first five integers together:


    > 1+2+3+4+5 


    [1] 15


    The result is 15\.  


    In case, there exists numerous expressions, then they are run in a sequence (in
    the order these emerge) one-at-a-time. The following few sections will illustrate
    some of the fundamental R expressions types.


    Constant values expressions:


    These are the plainest type of R expression. Constant value is usually a number
    (numeric value), or a character text. For instance, if we have to state the number
    of seconds in 5 minutes, we denote a number.


    > 300


    [1] 300


    In case, we have to state the filename which we wish to interpret data from, we
    denote the filename as a character text values. The character text values ought
    to be enclosed by either double quotes (“ ”), or single quotes (‘ ’).


    >“How are you?”


    [1] “How are you?”


    Arithmetic expressions:


    An arithmetic expression is somewhat more of a composite expression, and is used
    for calculating with numeric values. R comes with certain standard arithmetic operators:


    + (Symbol for addition)


    -  (Symbol for subtraction)


    * (Symbol for multiplication)


    / (Symbol for division)


    ^ (Symbol for exponentiation)


    The brackets (parentheses) are used to manage the order of calculation. R follows
    the usual BODMAS system of primacy regarding all the arithmetic operators; however,
    brackets (parentheses) are a handy means to evade any mistakes. Following is an
    example:


    >(78963-56397)/10


    [1] 2256.6


    Conditions expressions:


    A condition expression means, either a yes or no, as an answer. The outcome of
    a condition expression is a logical value (eithertrue or false). R comes with
    certain standard operators to compare different values, along with certain operators
    to combine those conditions:


       ==      (symbol for equality)


    >and>= (symbol for greater than or equal to)


    <and<= (symbol for less than or equal to)


       !=       (symbol for inequality)


    &&        (symbol for logical and)


