  trans: '


    `R-Development-Core-Team` 付出了巨大的努力，并在让 R 兼容各种软件和硬件方面投入了大量精力。因此，R 现在已适用于 Mac、Windows
    和 UNIX 系统。


    ## R 具有扩展性


    R 是一门强大的语言，可以执行许多功能，例如图形绘制、统计分析以及海量数据库的操作。然而，R 的一个巨大优势是它具有极强的扩展性。各种程序员可以轻松地编写自己的软件，然后将其以插件包（add-on-packages）的形式分发。由于制作此类插件包非常简单，事实上存在成千上万这样的包。在现实中，许多新的统计分析技术通过
    R 包的形式发布出来。


    ## R 提供了一个活跃的群体


    R 的用户群体正在迅速崛起。许多使用 R 的个人会逐渐开始帮助新用户，并在他们的认证领域和工作场所推广 R 的使用。偶尔，他们倾向于在 R 邮件列表或问答（question
    & answer）网站（例如 `Stack-Overflow`）上活跃。除了这些邮件列表和问答网站外，他们甚至加入了各种社交网络，例如 Twitter、Face-book
    以及各种省级的 R 用户论坛。


    ## R 有效地与其他编程语言连接


    随着越来越多的人转向使用 R 进行数据分析，他们开始尝试将 R 与其现有的工作流合并。这导致了一系列用于连接 R 与各种数据库、文件系统以及许多其他应用程序的包。从那时起，几个此类包已与
    R 有效链接。例如，`R-package-foreign` 是 `Standard-R-distribution` 的组成部分，它允许你解释来自 `Statistical-Packages`（如
    SAS、SPSS、STATA 等其他）的数据。还有许多插件包用于将 R 连接到各种数据库系统，例如 `RODBC package` 用于利用 `ODBC`（开放数据库连接协议）解释数据，以及
    `ROracle package` 用于解释 `Oracle databases`。


    ## R 处理的范围不仅限于统计学


    R 最初由统计学家创建并开发，目的是为了简化整个统计流程。这种传承仍在延续，它使 R 变成了一个非常强大的工具，可以执行几乎任何统计计算。自从 R 开始偏离其在统计学中的起源而发展以来，许多通常宁愿自称为软件程序员而非统计学家的人开始参与到
    R 中。因此，R 现在非常适用于广泛的非统计任务，包括图形可视化、数据处理以及各种数据审查。R 被有效地应用于遗传学、金融、自然语言处理、市场研究和生物学等多个领域。


    在本章中，我们讨论了 R 语言的简史、究竟什么是 R 编程，以及使用 R 语言的优势。


    ---


    如何安装 R 和 R Studio、开始 R 编程的正确代码编辑器、如何使用你的代码编辑器、初始 R 会话、如何加载脚本以及导航工作空间的方法。


    # 第二章：如何开始？


    在本章中，我们将讨论如何安装 R 和 R Studio、开始 R 编程的正确代码编辑器、如何使用你的代码编辑器、初始 R 会话、如何加载脚本以及导航工作空间的方法。


    ### 如何安装 R 和 R Studio？


    在使用 R 之前，你首先必须安装 R。而且，尽管你可以使用内置的代码编辑器，但你可能还希望安装一个具有高级功能的编辑器。由于 R Studio 运行在每个平台上并与
    R 无缝衔接，我们还将谈论 R Studio 的安装。


    ### 安装 R


    安装 R 并不复杂；但为了对其进行微调以符合你的需求需要一些说明。你可以在 `CRAN`（全面 R 归档网络）站点找到所有必要的安装文件以及关于安装过程的所有所需细节。选择你优选操作系统（OS）的链接，这将带你进入下载站点获取最新的
    R 分发。要获取所有全面的安装信息，请登录 (`https://cran.r-project.org/doc/manuals/R-admin.html`)。


    以下是 Windows 用户的安装步骤：


    *   访问 `CRAN`（`CRAN`;`https://cran.r-project.org/`）。

    *   点击 `Download R for Windows` 选项。


    ![Rinstall.jpg](img/00001.jpeg)

    *   之后点击 `Base` 选项，获取（下载）最新版本的 R `Installer File`。


    ![base.jpg](img/00002.jpeg)

    *   然后右键点击 `Installer File` 并选择 `Run-as-Administrator` 选项。


    ![Run.jpg](img/00003.jpeg)

    *   选择你喜欢的语言，将用于整个安装过程。现在，这一步不会改变 R 语言，所有的帮助文件和消息将继续以英文显示。

    *   仔细遵循所有指令。你甚至可以选择所有默认设置，这些设置是安全可靠的，并一直点击 `Next` 按钮直到 R 开始安装。


    R 适用于 64 位和 32 位 Windows 版本。如果你拥有 64 位 Windows 系统，你可以简单地安装两个版本。`Installer File`
    也会执行此任务。对于其他版本，如果你需要额外的内存，可能需要 64 位的。


    ### 对于 Linux & Mac 用户


    对于那些拥有 Linux 和 Mac 的用户，特别建议他们在登录 `CRAN` 站点时仔细阅读说明和信息。R 可以轻松地安装在每个系统中；但根据你的系统版本，你可能需要遵循特定的指令来安装
    R。


    ### 安装 R Studio


    R Studio 版本是一个相当新且良好的 R 编辑器。通常，它被高度推荐因为它非常易用。它拥有良好的支持系统，带有良好的 `Help-page` 并能够集成
    R。


    以下是安装 R Studio 的简单步骤：


    *   登录 [`www.rstudio.com/products/rstudio2/`](https://www.rstudio.com/products/rstudio2/)。

    *   然后点击 `RStudio Desktop` 按钮。


    ![Rstudio.jpg](img/00004.jpeg)

    *   根据你的系统版本选择 `Installer file`。

    *   接下来点击 `Run` 选项。


    随后，R Studio 将安装在你的特定系统中。R Studio 默认检测你新安装的 R 版本，你可以在 R Studio 内部使用 R。此外，你不需要任何额外的配置。


    ### 开始 R 编程的正确代码编辑器有哪些？


    要开始 R 编程，你需要一个编辑工具。现在，你使用的任何编辑工具在某种程度上取决于你的操作系统，因为 R 本身没有为任何操作系统提供特定的图形编辑器。主要的
    R 安装提供了以下内容：


    *   对于 Windows 版本：一个名为 `R Gui` 的编辑器。

    *   对于 Mac OS X 版本：一个名为 `R.app` 的编辑器。

    *   对于 Linux 版本：Linux 版本没有精确的编辑器；但是，你可以使用其他编辑器，如 `Emacs` 或 `Vim`。


