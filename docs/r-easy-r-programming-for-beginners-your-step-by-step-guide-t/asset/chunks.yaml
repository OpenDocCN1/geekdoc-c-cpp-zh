    # Chapter Six: How to efficiently manipulate your data?


    In this chapter, we’ll talk about the various ways to efficiently manipulate your
    data. We’ll discuss how to get your data in & out of R, how to effectively manipulate
    and process your data, and how to summarize your data.


    How to get your data in & out of R?


    As a user you’ll have numerous alternatives for getting your data into R. As spreadsheets
    are very popular, we’ll start with importing data from spreadsheets. The figure
    below is a little spreadsheet displaying the periodic table of the 1st 10 elements.
    We’ll use this spreadsheet as an example throughout this section.


    ![pdtable.jpg](images/00027.jpeg)


    How to enter data in the R text-editor?


    Even though R is mostly used as a language for programming purpose, it comes with
    a relatively basic data-editor, which lets you to enter your data straight into
    R, utilizing the edit( ) function. Now, to utilize the R text-editor, you’re required
    to start a variable first-of -all. For instance, to construct a data-frame and
    physically enter a bit of the data in the periodic table, just type:


    elm <- data.frame( )


    elm <- edit(elm)


    The code will return an interactive text-editor (the figure below), where you
    can manually type your data.


    ![Rtextedi.jpg](images/00028.jpeg)


    You can scroll up & down, or left & right. However, the text-editor won’t permit
    you to change the names of rows & columns. Now, you can enter a little data, and
    save the work by clicking on the ‘X’ in the right-top corner of the editor. And,
    to see the particulars which you’ve just typed, you can utilize the print( ) function:


    > print(elm)


        var1        var2       var3


    1    1      Hydrogen    H


    2    2        Helium      He


    3    3        Lithium     Li


    How to utilize the ‘Clipboard’ for the copy and paste purpose?


    One more technique to import data into R is to utilize the ‘Clipboard’ for copying
    and pasting the data. You have to utilize the readClipboard( ) function, if you
    wish to import data from ‘Clipboard’. For instance, first select the cells B3:B5
    in the spreadsheet (periodic table), after that press ‘Ctrl+C’ keys to copy the
    selected cells into the ‘Clipboard’, and then type the following code:


    > a <- readClipboard( )


    > a


    [1] “Helium” “Lithium” “Beryllium”


    And, if you wish to import data in the tabular form, you can utilize the read.table()
    function. You can modify the read.table( ) function by altering its arguments.
    The arguments are as follows:


    *   file: It means the filename to be imported. In case the filename is PD, then
    state file= “PD”.


    *   sep: It means the separator which separates the data elements. Regarding the
    ‘MS Excel’ spreadsheet data, the tab (denoted by “\t”) is the separator.


    *   header: It simply denotes, whether or not, the ‘Clipboard’ data has a header
    in the initial row (in other words the names of the column).


    First, select the cells A1:D5 in the spreadsheet (periodic table), after that
    press ‘Ctrl+C’ keys to copy the selected cells. Afterwards, just type the following
    code:


    > rt <- read.table(file = “PD”, sep = “\t”, header=FALSE)


    > rt


    1      Hydrogen     H       1


    2       Helium       He      1


    3       Lithium      Li       1


    4      Beryllium    Be      2


    How to export your data out of R?


    To get your data out of R in order to paste it somewhere else, you need to utilize
    the writeClipboard( ) function, or the write.table( ) function. Now, writeClipboard(
    ) is quite effective, if you want to export vector data. For instance, in order
    to export the titles of the in-built data-set by the name ‘iris’, just type:


    > writeClipboard(titles(iris))


    The code won’t return any result; however, you can definitely paste the vector
    in a spreadsheet. Below is figure of the spreadsheet when you paste the vector
    into Excel-sheet. Note: The in-built data-sets in R are recognized in the similar
    way as functions are recognized. To know more about it just type: ?Iris.


    ![Irisdata.jpg](images/00029.jpeg)


    To export the data in a tabular form, you have to utilize the write.table( ) function.
    Again, this won’t return any result; however, you can definitely paste it into
    any spreadsheet just like in the case of writeClipboard( ) function . These were
    some of the ways to get your data in & out of R. Now, we’ll discuss various ways
    to effectively manipulate and process your data.


    Effective ways to manipulate and process your data:


    Now, the time has come to compose each and every tool which you studied in the
    previous chapters. You possess a full understanding of how to import & export
    data from R, you understand how to utilize lists as well as data-frames, and you
    also can write functions now. All these tools, when merged together, form the
    fundamental arsenal to manipulate and process your data in R.


    Ways to choose the most fitting data-structure:


    The initial choice you need to consider prior to evaluating your data is how to
    symbolize your data in R. In the previous chapters, you learnt that the essential
    data-structures in R are matrices, vectors, data-frames, and lists.


    In case your data is one dimensional only, then you do recognize that vectors
    symbolize such data type fairly well. But, in case your data is multi dimensional,
    then you possess the option of utilizing data-frames, lists, or matrices. Now,
    the real issue is: When to utilize which?


    Matrices as well as multi-dimensional arrays are helpful when your entire data
    are of a solo category, which means either characters or numeric. In case, you’re
    familiar with subjects like statistics or mathematics, then you’re not new to
    matrices.


    However in several realistic circumstances, you’ll have data with various diverse
    categories. You’ll have a combination of character as well as numeric data. Here,
    you have to utilize either data-frames or lists.'
