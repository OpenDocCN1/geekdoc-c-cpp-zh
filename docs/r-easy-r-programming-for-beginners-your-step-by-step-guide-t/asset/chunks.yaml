    # Chapter Four: Getting started to Working in R


    In this chapter, we’ll discuss the various ways to getting started to working
    in R. We’ll cover diverse topics such as fundamentals of arithmetic, how to organize
    data in Vectors, how to work with logical vectors, manipulating text, vector &
    matrix, data frames, and creation of lists.


    Fundamentals of Arithmetic (working with numbers, lost values, & infinity):


    R comes with 4 diverse groups of statistical functions as well as operators:


    *   Essential arithmetic operators: Such operators are being utilized in nearly
    all the programming languages.


    *   Mathematical functions: You can get such advanced functions on any calculator.


    *   Vector operations: These are functions which does calculations on an entire
    vector, such as sum( ). The outcome depends on different values of the vector.


    *   Matrix operations: Such functions are utilized for calculations as well as
    various operations. We’ll talk about matrix operations later in the chapter.


    First, we’ll discuss the arithmetic operators, mathematical functions, and vector
    operations.


    Ways to use the arithmetic operators:


    Below is the table of some of the fundamental arithmetic operators.


    ![arithmetictable.jpg](images/00021.jpeg)


    All the operators in the above mentioned table are vectorized operators. By utilizing
    them, you’ll be able to perform difficult calculations with smaller code. Just
    consider the following example:


    One vector symbolizes the count of baskets made by Phillip during the five basketball
    games, and the other vector symbolizes the count of baskets his buddy George made:


    > Phillip.baskets <- c(10,3,3,5,8)


    > George.baskets <- c(4,2,1,1,10)


    Assume that their parents wish to pay them prize money for their efforts. Phillip
    gets 100 bucks per basket, and George gets 90 bucks per basket. Now, how to calculate
    the total collection?


    The calculation is pretty simple in R. First of all, evaluate the cash each of
    them received per game:


    > Phillip.money <- Phillip.baskets * 100


    > George.money <- George.baskets * 90


    Here, each of the vector value would be multiplied by the amount of cash. And,
    to obtain the total cash both of them received in each game, just type the following
    code:


    > Phillip.money + George.money


    [1] 1360 480 390 590 1700


    You can even perform the calculation in a single line of code:


    > Phillip.baskets * 100 + George.baskets * 90


    [1] 1360 480 390 590 1700


    Ways to use the mathematical functions:


    R comes with an entire collection of functions which you can also find easily
    on any calculator. These are vectorized functions to help you perform complex
    calculations. Below is the table of some of the helpful mathematical functions:


    ![mathfnc.jpg](images/00022.jpeg)


    The potential of R goes way beyond this little table. We’ll discuss certain specific
    calculations.


    Ways to calculate logarithms as well as exponentials:


    Type the following in the console to calculate the log from 1 to 3:


    > log(1:3)


    [1] 0.0000000 0.6931462 1.0976122


    R will compute the natural logarithm in case the base value isn’t stated. To compute
    the logarithm, for example, with base 6, type the following in the console:


    > log(1:3,base=6)


    [1] 0.0000000 0.3868427 0.6131471


    Utilize exp( ) function to perform the inverse of log( ) function. The exp( )
    function elevates y to the power stated in the parenthesis:


    > y <- log(1:3)


    > exp(y)


    Ways to use infinity function:


    Sometimes, you simply don’t possess the real values to compute with. In reality,
    in some data-sets a few values are lost and certain evaluations gets infinity
    as an outcome, or can’t be performed in any way. Fortunately, R is able to deal
    with all such circumstances.


    In R, the following is the result when you attempt to divide any number by 0 (zero):


    > 3/0


    [1] Inf


    Here, R appropriately informs you that the outcome is infinity. Also, negative-infinity
    is displayed as (- Inf).


    > 5 – Inf


    [1] –Inf


    Now, to verify whether or not a number is infinite or finite, you need to utilize
    the functions is.infinite() and is.finite(). The is.finite() function will give
    a result TRUE in case the value is finite, and the is.infinite()  will give a
    result TRUE in case the value is infinite.


