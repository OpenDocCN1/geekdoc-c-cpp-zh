    ## How to source a script?


    Now, it’s time to move a level up, and command R to carry out various commands
    one after another, with no need to wait for further instructions. In R, the `source()`
    function is utilized to run a whole script, and its users call this entire procedure
    as ‘Sourcing-a-Script’.


    In order to set up your script which is to be sourced, you’re required to first
    type your whole script in your editor. Here, we are using the R Studio editor.
    Just type the below mentioned code in the R Studio editor:


    ```r

    b <- “Hey!”

    n <- readline(“What is my name?”)

    print(paste(b, n))

    ```


    You can enter numerous lines of code in your R Studio editor. After that, when
    everything is set-up, you can source the script (send the commands to R). In case
    of R Studio or RGui, you can perform this task by any one of the following methods:


    * Transfer a single line of code from your source editor to your console: Just
    click on the single line of code that you wish to run, and after that press `Ctrl+R`
    keys in RGui editor. You need to press `Ctrl+Enter` keys, or click on the ‘Run’
    button in R Studio editor.

    * Transfer a chunk of desired code to your console: First, select the entire chunk
    of desired code that you wish to run, and after that press `Ctrl+Enter` keys in
    R Studio, or press `Ctrl+R` keys in RGui editor.

    * Source a script, or transfer the whole script to your console: In case of R
    Studio, just click on the source editor section and then press `Ctrl + Shift +
    Enter` keys, or click on the ‘Source’ button. In case of RGui, just click on your
    script window, and then select `Edit>Run all`.


    You can now transfer your whole script to your R console. Just click on the ‘Source’
    button in the source editor section, or select `Edit>Source`. Your above mentioned
    script will begin, and reach the end where it will ask to enter some values, and
    then will wait for you to type your name in your console window section.


    ![Sourceot.jpg](images/00011.jpeg)


    ## Ways to navigate the workspace


    The workspace means the collection of all the functions as well as variables,
    which you have built all through the session, along with any of the packages which
    are loaded. Time and again, you would wish to remind yourself about all the variables
    which you’ve saved in the workspace. You can utilize the `ls()` function to get
    the list of all the objects (functions, variables etc.) in the workspace. Just
    type `ls()` in your R console:


    ```r

    ls()

    ```

    [1] “a” “go” “k” “l” “normal” “m”


    R will notify you all the names of every single variable which you have created.


    ## Ways to manipulate the workspace contents


    In case you feel like you don’t require some of the workspace objects, you can
    easily get rid of them. For instance, you don’t require object `m` anymore, and
    you want to remove it from your workspace. Now to get rid of it, just utilize
    the `rm()` function, and after that again utilize the `ls()` function to crosscheck
    your workspace contents:


    ```r

    rm(m)

    ls()

    ```

    [1] “a” “go” “k” “l” “normal”


    You can see that the object `m` doesn’t exist anymore.


    ## Ways to save your work


    There are various alternatives to save your work:


    * The `save()` function to secure your individual variables.

    * The `save.image()` function to save your whole workspace.

    * You can save your R script file, using the appropriate save menu command in
    your code editor.


    For instance, you wish to save the value of “normal” variable. Just perform the
    following:


    * Search for the working directory where R will save your file. You need to type
    the following command:


    ```r

    getwd()

    ```

    [1] “c:/users/delfim”


    Typically, your user folder is the working directory where your file is saved
    automatically. The precise name as well as the folder’s path actually depends
    on your OS (Operating System).

    * Type the below mentioned command in your R console using any name such as `myname.rda`,
    and after that press ‘Enter’ key:


    ```r

    save(normal, file= “myname.rda”)

    ```

    R will save your file in the working directory. And, in case the process is successfully
    over, then you won’t receive any affirmation message.

    * And, to ensure that the entire process was successfully over, you can crosscheck
    the process.


