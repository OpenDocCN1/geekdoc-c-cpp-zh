  trans: "\n\n# y * multiply 错误：缺少 ‘multiply’ \n\n由于你没有指定 `multiply` 参数，R 无法理解该参数；因此，它会显示错误信息并要求你提供更多细节。现在，这可能非常沮丧，因为这意味着你每次使用该函数时都必须指定\
    \ `multiply=100`。在这里，为 `multiply` 参数指定默认值绝对会对你有所帮助。\n\n你需要通过使用 `=` 符号后默认值来指定任何参数的默认值。只需输入以下命令：\n\
    \n```\nm.unit <- function(y, multiply = 100){\n  c <- round(y * multiply, digits\
    \ = 1)\n  paste(c, “”, sep = “ \")\n}\n```\n\n这些是智能使用参数的一些方法。现在，我们将讨论控制逻辑流（Logical\
    \ Flow）的方法。\n\n## 如何控制逻辑流？\n\n函数仅仅是一系列普通的动作；然而，这些动作也是极其僵化的。而且，你经常希望根据特定的值进行选择并执行操作。\n\
    \n### 利用 ‘if’ 语句\n\n现在，在 R 代码中描述一个选择非常简单：如果某个条件成立，则执行一项特定的任务。许多编程语言允许你通过 `if .\
    \ . . then` 单词精确地执行。在 R 中要简单得多。你只需要去掉 `then` 单词并利用 `if` 语句指定你的选择。\n\n一个 `if` 语句有\
    \ 3 个组成：\n* 关键字 `if`。\n* 括号（圆）内的单个逻辑值。\n* `{ }`（大括号）内的代码段，如果逻辑值为 TRUE 则将执行它。\n\
    \n让我们写一个小函数并将其命名为 `pCal()`，它根据你为客户工作的小时计算向客户收取的费用。只需输入以下：\n\n```\npCal <- function(hrs,\
    \ rh=30){\n  np <- hrs * rh\n  round(np)\n}\n```\n\n以下是代码的描述：\n* 关键字 `function`\
    \ 描述函数。\n* `{ }`（大括号）内的代码是函数的主体。\n* 在括号（圆）内，你需要指定参数 `hrs`（小时）和 `rh`（这里的默认值是每小时\
    \ 30 元）。\n* 你通过乘以 `hrs` 和 `rh` 来计算 `np`（总费用）。\n* 最终结果将是舍入后的数字（总费用）。\n\n现在，假设某些客户为你提供了大量工作，你决定对于工作时间超过\
    \ 110 小时的任务，根据每小时费率提供 10% 的折扣。随后，如果工作小时数超过 110 小时，则你需要通过将总费用乘以 0.9 来计算新价格。以下是代码：\n\
    \n```\npCal <- function(hrs, rh=30){\n  np <- hrs * rh\n  if(hrs > 110) {\n  \
    \  np <- np * 0.9\n  }\n  round(np)\n}\n```\n\n在这里，只有当工作小时数超过 110 小时折扣才可用。以下是不同的输出：\n\
    `pCal(hours = 45)` -> `[1] 1350`\n`pCal(hours = 120)` -> `[1] 3240`\n\n### 利用\
    \ ‘if...else’ 语句\n\n在某些情况下，你可能希望函数在特定条件成立时执行某些任务，而在条件不时不执行其他任务。尽管你可以通过 `if` 语句实现这一点，但确实有更简单的方法通过\
    \ `if...else` 语句来实现。该语句由 `if` 语句类似的组成部分以及一些不同的部分组成：\n* `else` 关键字放在第一个代码段下方。\n\
    * 写在 `{ }`（大括号）之间的第二个代码段只有在第一个部分（`if`）中条件的结果返回 FALSE 的情况下才执行。\n\n让我们考虑一个例子。在某些国家，支付特定服务时需要支付的\
    \ VAT（增值税）总和取决于消费者是公共机构还是私立机构。假设公共机构只需要支付 6% 的 VAT，而私立机构需要支付 12% 的 VAT。现在，你可以为之前的\
    \ `pCal()` 函数添加一个额外的参数 `private`，并输入以下命令来添加准确的 VAT 总额：\n\n```\npCal <- function(hrs,\
    \ rh=30, private=TRUE){\n  np <- hrs * rh\n  if(hrs > 110) np <- np * 0.9\n  if(private)\
    \ {\n    tp <- np * 12\n  } else {\n    tp <- np * 06\n  }\n  round(tp)\n}\n```\n\
    \n现在，如果你工作了 35 小时，公共和私立的结果将会有不同：\n`pCal(35, private=TRUE)` -> `[1] 176`\n`pCal(35,\
    \ private=FALSE)` -> `[1] 113`\n\n## 如何遍历不同的值\n\n### 创建 ‘for loop’ 方法\n\n就像在许多其他语言中一样，`for\
    \ loop` 用于为每个向量值重复某项任务。以下是在 R 中创建 `for loop` 的方法：\n\n```\nfor(x in values){\n\
    \  ... 执行一项任务...\n}\n```\n\n以下是该 `for loop` 的组成部分：\n* `for` 关键字，后面跟着括号（圆）。\n*\
    \ 括号（圆）内的一个变量。在这里，我们使用了 `x`。\n* 变量 `x` 后面跟着 `in` 关键字。\n* 一个包含要遍历的 `values` 的向量。\n\
    * `{ }`（大括号）内的代码段，它对于向量 `values` 中的每个值都是需要执行的。\n\n在代码部分中，你可以使用变量 `x`。每当 R 循环代码时，它会将包含\
    \ `values` 的向量中的下一个值分配给变量 `x`。\n\n### 如何在 ‘for loop’ 中计算值？\n\n让我们再次考虑 `pCal()`\
    \ 函数示例。在上一个例子中，我们计算了如何为公共和私立机构收取不同的 VAT。在这里，我们将告诉您如何利用 `for loop` 立即计算许多客户的费用。只需输入以下代码：\n\
    \n```\npCal <- function(hrs, rh=30, customer){\n  np <- hrs * rh * ifelse(hrs\
    \ > 110, 0.9, 1)\n  V <- numeric(0)\n  for(x in customer){\n    V <- c(V, switch(x,\
    \ private=1.12, public=1.06, 1))\n  }\n  tp <- np * V\n  round(tp)\n}\n```\n\n\
    `pCal()` 函数的开头和结尾没有变化；但在中间，你执行了以下操作：\n* 构建一个值为 0 的数值向量 `V`。\n* 对于 `customer` 向量中的每个值，你应用了\
    \ `switch()` 函数来选择正确的增值税。\n* 在循环的每次中，你将 `switch()` 函数的结果添加到向量 `V` 中。\n\n最终结果是一个向量\
    \ `V`，它拥有每个客户正确的增值税数字。\n\n## 如何有效地调试你的代码？\n\n没有人能写出完全没有错误的代码。因此，与其推测代码中的错误，你的第一步应该是问自己，你在哪里犯了错？\n\
    \n### 理解问题所在之处\n\n在这里，漏洞（bug）只是代码中错误的另一种说法。因此，调试过程并不涉及任何杀虫剂。它字面意思是移除所有的逻辑或语义错误。\n\
    \n因此，在移除这些漏洞之前，你需要理解你正在寻找的内容。以下是不同类型的错误：\n* 语法错误（Syntax errors）：如果你写的代码 R 无法解释，那么你就犯了语法错误。此类错误的结果总是错误信息，它通常是由于拼写错误或括号不完整引起的。\n\
    * 语义错误（Semantic errors）：如果你写的代码没有执行预期的任务，那么你就犯了语义错误。在这里，尽管代码是正确的，但结果并不符合预期，且你的代码是失败的。\n\
    \n"
