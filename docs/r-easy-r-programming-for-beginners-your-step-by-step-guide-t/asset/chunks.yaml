  trans: "\n在上面的示例中，你合并了 3 个不同的匿名实体：\n\n*   一个值为 2:4 的向量\n*   一个值为 5:7 的向量\n*   以及一个\
    \ 3 行 2 列的矩阵，按列加载了 8 到 13 的数值。\n\n现在，上面的示例展示了 `rbind()` 和 `cbind()` 函数的各种有用属性：\n\
    \n*   它们同时适用于矩阵和向量。\n*   你可以为每个函数提供超过 2 个参数。\n*   只要维度恰当，你就可以合并不同类型的实体。\n\n##\
    \ 如何对矩阵进行计算？\n\nR 语言可能最大的特性就是它能够以非常简单的方式处理复杂的矩阵计算。因此，当你考虑对矩阵进行计算时，你既可以考虑它的元素，也可以将整个矩阵视为一个值。如果你想向任何矩阵添加标量（单个数字），你将该孤立的数字整合到该矩阵的每个组成部分中。你只需要利用加法运算符（`+`）执行此操作：\n\
    \n```\n> fm + 5\n      [,1]  [,2]  [,3] \n[1,]   7    11    15\n[2,]   8    12\
    \    16\n[3,]   9    13    17\n[4,]  10    14    18\n```\n\n同样，你甚至可以使用许多算术运算符对矩阵的每个元素执行任何计算。再考虑一个例子：\n\
    \n在上述矩阵 `fm` 中，你希望给第 1 行加 2，第 2 行加 3，第 3 行加 4，第 4 行加 5。这可以通过创建另一个矩阵 `fx` 来，它包含\
    \ 3 列 4 行，并在第 1、2、3、4 行中按顺序具有 2, 3, 4 和 5 作为值：\n\n```\n> fx <- matrix(2:5, nrow=4,\
    \ ncol=3)\n```\n\n利用加法运算符（`+`），可以合并这两个矩阵（`fm` & `fx`）：\n\n```\n> fm + fx\n   \
    \     [,1]  [,2]  [,3] \n[1,]   4     8    12\n[2,]   6    10    14\n[3,]   8\
    \    12    16\n[4,]  10    14    18\n```\n\n你需要记住两个矩阵的维度应该匹配。否则，R 将不会执行该操作，并将得到以下结果：\n\
    \n```\n> fm + fx[,2:4]\nError in fm + fx[, 2:4] : non-conformable arrays\n```\n\
    \n然而，如果我们将向量作为矩阵的替代，将得到以下结果：\n\n```\n> fm + 2:4\n        [,1]  [,2]  [,3] \n[1,]\
    \   4     8    12\n[2,]   6    10    14\n[3,]   8    12    16\n[4,]  10    14\
    \    18\n```\n\n在这里，R 将矩阵视为向量，并直接忽略了维度。\n\n这些是使用矩阵进行计算的一些方法。现在，我们将讨论在数据框（Data-Frame）中组合不同类型值的各种方法，以及操作这些值。\n\
    \n## 如何在数据框中组合不同的值并操作这些值？\n\n数据集是由多种数据类型开发的。例如，你可以在相似的数据集中包含员工的姓名、收入和入职日期。但是，你不能在不将数据更改为字符值的情况下将所有此类数据合并到单个矩阵中。因此，你需要在\
    \ R 中使用一个新的数据结构来保留所有此类细节。这种数据结构被称为数据框（Data-Frame）。\n\n### 从矩阵构建数据框的方法\n\n让我们再次考虑篮球比赛的例子，我们构建了一个名为\
    \ `Total.baskets` 的矩阵，其中包含了 Phillip 和 George 的进球数：\n\n```\nTotal.baskets\n [,1]\
    \ [,2] [,3] [,4] [,5]\nPhillip  10     3     3     5     8\nGeorge  4     2  \
    \   1     1    10\n```\n\n我们可以将此矩阵转换为具有 2 个变量的数据框：一个变量是 Phillip 的进球数，另一个是 George\
    \ 的进球数。现在，要将 `Total.baskets` 矩阵转换为数据框，你需要利用 `as.dataframe()` 函数：\n\n```\n> dt.baskets\
    \ <- as.dataframe(t(Total.baskets))\n```\n\n在这里，我们还需要利用 `t()` 函数来构建数据框。`t()` 函数会翻转矩阵，将行变为列，反之亦然。对于数据框，每个变量意味着一列；但在\
    \ `Total.baskets` 矩阵中，行代表参与者的进球数。因此，为了获得理想的结果，你需要在使用 `as.dataframe()` 将其转换为数据框之前，用\
    \ `t()` 函数翻转 `Total.baskets` 矩阵。以下是结果：\n\n```\n> dt.baskets\n         Phill George\n\
    1st     10      4\n2nd      3      2\n3rd      3      1\n4th      5      1\n5th\
    \      8     10\n```\n\n你甚至可以使用 `str()` 函数来检查输出的内部组成：\n\n```\n> str(dt.baskets)\n\
    'data.frame': 5 obs. of 2 variables:\n$ Phillip: num 10 3 5 8\n$ George: num 4\
    \ 2 1 10\n```\n\n因此，确认这是一个真实数据集。\n\n### 创建数据框的其他方法\n\n之前从矩阵创建数据框的方法无法用于从不同类型的值创建数据框。你需要利用\
    \ `data.frame()` 函数来从任何其他类型的值创建数据框。让我们创建一个包含少数员工姓名、收入和入职日期的小型数据框。你需要构建包含基本细节的\
    \ 3 个独立向量，如下：\n\n```\n> names <- c('Peter Parker', 'Clark Kent', 'Bruce Wayne')\n\
    > income <- c(31000, 19000, 25000)\n> dt.join <- as.Date(c('2012-10-5','2009-04-14','2005-06-20'))\n\
    ```\n\n在这里，你拥有 3 个不同的向量：\n* 字符向量（员工姓名）\n* 数值向量（收入）\n* 日期向量（入职日期）\n\n现在，我们将所有 3\
    \ 个向量合并到一个数据框中。输入以下命令：\n\n```\n> dt.emp <- data.frame(names, income, dt.join)\n\
    ```\n\n以下是该代码的结果：\n\n```\n> str(dt.emp)\n'data.frame': 3 objects. 3 variables:\n\
    $ names: Factor/ 3 levels \"Peter Parker\" \"Clark Kent\" \"Bruce Wayne\"\n$ income:\
    \ num 31000 19000 25000\n$ dt.join: Date, format: \"2012-10-05\" \"2009-04-14\"\
    \ \"2005-06-20\"\n```\n\n## 操作数据框中的值\n\n构建数据框是件愉快的事；但如果你无法更改其值或将数据整合到数据框中，那么数据框就是没有价值的。幸运的是，数据框带有某些很好的功能。如果你想操作值，几乎所有在矩阵上执行的操作都可以应用于数据框。此外，你甚至可以使用某些专为数据框设计的技巧。\n\
    \n### 如何从数据框中提取值？\n\n在许多情况下，你可以通过假设数据框为矩阵并利用你在矩阵上执行的方法来提取值。然而，与矩阵和数组不同，数据框并非都是向量。所以请记住，数据框是列表，尽管它们看起来像矩阵。\n\
    \n#### 假设数据框为矩阵\n\n让我们再次考虑篮球比赛例子。我们将利用之前在“从矩阵构建数据框的方法”章节中构建的数据框 `dt.baskets`：\n\
    \n```\n> dt.baskets\n         Phill George\n1st     10      4\n2nd      3    \
    \  2\n3rd      3      1\n4th      5      1\n5th      8     10\n```\n\n现在，你可以提取\
    \ Phillip 在第 4 场比赛中的进球数：\n\n```\n> dt.baskets['4th', 'Phillip']\n[1] 5\n```\n\n\
    同样，你可以利用列索引提取 George 的所有进球数：\n\n```\n> dt.baskets[, 2]\n[1] 4 2 1 10\n```\n\n\
    并且，如果你希望结果像数据框，那么你需要利用 `drop=FALSE`：\n\n```\n> str(dt.baskets[, 2, drop=FALSE])\n\
    'data.frame': 5 obs. of 1 variable:\n$ George: num 4 2 1 10\n```\n\n现在，你可能注意美元符号\
    \ ($)。这个符号只是访问各种变量的精确方法。访问 George 变量，你需要按照以下方式使用美元符号：\n\n```\n> dt.baskets$George\n\
    [1] 4 2 1 10\n```\n\n这里的结果显示了该变量内所有值的向量。这些都是在数据框中组合不同值并操作这些值的一些方法。现在，我们将讨论如何创建一个列表（list），并在其中组合不同的对象。\n\
    \n"
- fmt: "\n# How to create a List, and combine different objects in it?\n\nData-frames\
    \ are lists of vectors, and even though they might appear as matrices, they actually\
    \ are not. A list is a relatively common and flexible kind of entity in R. These\
    \ can be really useful for the purpose of grouping diverse forms of entities,\
    \ or to perform computations on an entire set of diverse entities.\n\n## How to\
    \ create a list?\n\nTo create a list, you need to utilize the `list() ` function,\
    \ and you can do it in two ways. You can either build an unnamed list or a named\
    \ list. Now, the dissimilarity is minute; in both cases, consider a list like\
    \ a huge box loaded with number of sacks consisting of all types of diverse objects.\
    \ And, instead of numbering all such sacks, if these are being named, then what\
    \ you possess in the end is a named list.\n\n### Ways to create an unnamed list\n\
    \nTo construct an unnamed list is pretty simple as you need to utilize the `list()`\
    \ function, and insert all the entities, you wish in that list, just within the\
    \ `()`. Let’s again consider the basketball game example where we built a matrix\
    \ `Total.baskets` which contained the number of baskets made by Phillip and George:\n\
    \n```\nTotal.baskets\n             1st 2nd 3rd 4th 5th\nPhillip  10     3    \
    \ 3     5     8\nGeorge  4     2     1     1    10\n```\n\nNow, in case you wish\
    \ to merge the above matrix with a character vector representing the year, you\
    \ need to type the following code:\n\n```\n> l.baskets <- list(Total.baskets,\
    \ ‘2015-2016’)\n> l.baskets\n\n[[1]]\n\n 1st 2nd 3rd 4th 5th\nPhillip  10    \
    \ 3     3     5     8\nGeorge  4     2     1     1    10\n\n[[2]]\n[1] “2015-2016”\n\
    ```\n\nHere, the entity `l.baskets` has 2 elements: `Total.baskets` (the matrix)\
    \ and `2015-2016` (the year). The numeric values within the symbol `[[]]` signifies\
    \ the ‘sack number’ of every element.\n\n### Ways to create a named list\n\nTo\
    \ build a named (or labeled) list, you just need to add the names right before\
    \ the values, just within the `() ` symbol of the `list()` function:\n\n```\n\
    > nl.baskets <- list(counts=Total.baskets, year=’2015-2016’)\n> nl.baskets\n\n\
    $ counts\n             1st 2nd 3rd 4th 5th\nPhillip  10     3     3     5    \
    \ 8\nGeorge  4     2     1     1    10\n\n$ year\n[1] “2015-2016”\n```\n\nHere,\
    \ the `$` symbol signifies the name of the list of elements.\n\n### Ways to combine\
    \ lists\n\nTo combine the lists, all you require is a function which we have frequently\
    \ utilized earlier, the `c()` function. This function can merge diverse types\
    \ of entities and, hence, can be utilized to combine lists, and create a fresh\
    \ list.\n\nNow, in case you wish to add the details about the competitors, you\
    \ need to make a list foremost. And, to ensure that you get the similar results,\
    \ you need to reconstruct the original `l.baskets`:\n\n```\n> l.baskets <- list(Total.baskets,’2015-2016’)\n\
    > competitors <- list(rownames(Total.baskets))\n```\n\nAfter that, you need to\
    \ merge the competitors list with the `l.baskets` list, utilizing the `c()` function:\n\
    \n```\n> c(l.baskets, competitors)\n[[1]]\n             1st  2nd  3rd  4th  5th\n\
    Phillip     10     3     3     5     8\nGeorge      4     2     1     1    10\n\
    \n[[2]]\n[1]      “2015-2016”\n\n[[3]]\n[1]  “Phillip” “George”\n```\n\n(Note:\
    \ The provided input text contained significant repetitive and fragmented sentences\
    \ towards the end. I have processed the core technical content logically based\
    \ on the examples provided to ensure document quality.)\n"
