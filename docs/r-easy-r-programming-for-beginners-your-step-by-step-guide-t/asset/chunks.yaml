    learn R language. I can assure you that this step-by-step guide will immensely
    assist you to master the fundamentals of R language which is open-source, free,
    potent and greatly extendable.


    Once you go through this entire book, you’ll come to know how easy it was to learn
    R! In this guide, I have unfolded layer-by-layer all the air of secrecy surrounding
    R Programming, so that you all can effortlessly grasp everything fairly and quickly.


    So, without further ado, LET’S GET STARTED!


    In the first chapter, we’ll discuss a brief history of R Programming, what exactly
    R Programming is, and the benefits of using R language.


    ## Chapter One: An Introduction to R Programming


    With more than two million global users, R language is rapidly turning into a
    top programming language specifically in the space of data science as well as
    statistics. And, since its inception as an ‘Academic-Demonstration-Language’ during
    the 1990s, the R language has swiftly developed and extended. The figures of R
    language users have grown by forty percent each year, and a rising scale of organizations
    are utilizing this language in their everyday activities.


    ### A Brief History of R


    The R language was created and developed by two colleagues at `University of Auckland,
    New Zealand`, during the 1990s - Ihaka and Gentleman. They both pretty acquainted
    with `S` language (`S` is a programming language for statistics), they decided
    to utilize the similar syntax, and hence, created `R` as a free environment for
    students.


    ### Milestone years in relation to the development of R


    *   During 1990s: `R` was created, and its development began.

    *   In 1993: `R Programming` was announced for the first time on `S-news Mailing
    List`. And, since its inception, a bunch of active mailing-lists has been formed.

    *   In 1995: Martin Gentleman persuaded the entire group to make the `R language
    code as Free Software. After that, the R language code was licensed under the
    `Free Software Foundation’s GNU General Public License`.

    *   In 1997: The first `R Development Core Team` was established.

    *   In early 2000: The initial version of `R language` (`v1.0.0`) was released.


    ### What exactly is R Programming?


    `R` is a programming language which is used by many scientists, data analysts
    and numerous statisticians to analyze database and to carry out statistical scrutiny
    with figures as well as graphs.


    `R language` is an awesome tool to analyze huge data volumes. If your job involves
    huge data analysis (huge database and files), then you can utilize `R` to fetch
    your data and perform certain processing tasks on it. `R` comes with various supplementary
    packages which you can download, and which will even allow you to simplify or
    expand various commands while you analyze your data.


    ### What are the benefits of using R language?


    R is an open-source code, and it is free: Anyone can get access to `R` under an
    open-source license. It means that you are allowed to download as well alter the
    code. It is even available free of cost. These are the biggest benefits of `R`
    - you can download as well utilize `R` for free! An additional benefit is, any
    individual has the right to utilize the source code, alter it, and even develop
    it. Consequently, several exceptional programmers have significantly contributed
    enhancements, and modernized the `R code`. And that''s the reason why, `R` is
    so stable, secure and dependable.


    R can run anywhere.

