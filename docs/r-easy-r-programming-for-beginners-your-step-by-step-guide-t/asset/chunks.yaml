    *   Console: The console area in R Studio is quite similar to the RGui console.
    This is where you have to type scripts or instructions, and command R to perform
    helpful tasks.


    *   Workspace/History: In the workspace/history area you can examine the variables
    you formed during your R session, along with their values. In this area, you can
    also view all the commands history, which you typed in R.


    *   Files/packages/plots/help: In this area, you can gain access to various helpful
    tools.


    - Files: Here you can look through all the files and related folders on your system.


    - Packages: Here you can see all the installed-packages lists. A package is autonomous
    code set which enhances the performance of R.


    - Plots: Here R exhibits your plots, such as graphs or charts.


    - Help: Here you can look through the in-built ‘Help-system’ of R.


    Your initial R session:


    Majority of programming books usually begin with an easy program. Typically this
    initial program is to generate a message called ‘Welcome Sir!’ Here is how we
    do it.


    Initiate a new R session and then type the below mentioned command in your R console:


    > print(“Welcome Sir!”)


    Press Enter. R instantly responds with the following:


    [1] “Welcome Sir!”


    Well done! You’ve just finished your initial R script!


    Next, we’ll check how to perform simple calculation successfully. The following
    are just a few simple codes of commands. We’ll discuss all these in details in
    the coming chapters:


    Performing simple calculations:


    Type the below mentioned command in your console to compute the sum of 5 digits:


    > 1+2+3+4+5 


    [1] 15


    The result is 15\.


    Vectors:


    A vector is a basic data-structure form. As per definition, a vector is a single
    unit which consists of a set of things. For instance, a set of digits is a numeric
    vector.


    To create a vector, just type the below mentioned command in your console:


    > c(1,2,3,4,5)


    [1] 1 2 3 4 5


    Here, you’ve not only just created a vector; you also have effectively utilized
    a function in R.


    Function:


    A function is a section of code which intakes certain inputs, and performs something
    unique with those values. While creating a vector above, you command the c( )
    function to create a vector with the initial 5 integers. The values inside the
    brackets are known as ‘arguments’. You can even create a vector by utilizing operators.
    Now, an operator is a sign you insert between two entries to perform any math
    calculation. The signs (+, -, *, /) are called operators. Another useful operator
    is known as sequence, and it appears similar to a colon sign (:).


    Type the below mentioned command in your console:


    > 1:5


    [1] 1 2 3 4 5


    Well! You’ve again created a vector! Type the below mentioned command in your
    console to compute the sum of above vector:


    > sum(1:5)


    [1] 15


    How to store and calculate values?


    The symbol (<-) is the assignment operator here. You need to type less than sign
    (<), and a hyphen symbol (-) after it. Type the below mentioned command in your
    console:


    > a <- 1:5


    > a


    [1] 1 2 3 4 5


    Here, you initially assigned the 1:5 (sequence) to a (variable). After that, you
    typed ‘a’ in the console, and then pressed ‘Enter’ key to get the final result.


    You can even perform calculations on those values. Construct another variable
    b, and assign it some value, for instance 20\. After that, add the values of both
    the variables (a & b):


    > b <- 20


    > a + b


    [1] 21 22 23 24 25


    Now construct a new variable, and name it c. Then assign c the value (a + b):


    > c <- a + b


    > c


    [1] 21 22 23 24 25'
