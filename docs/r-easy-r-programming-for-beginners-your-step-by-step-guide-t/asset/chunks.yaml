    -   构建一个名为“Z3”的新矩阵，包含以下内容：将 `Z2` 的第 1 行作为第 1 列，然后将 `Z1` 的第 1 行作为第 2 列。


    这些是供你练习的一些习题。你可以在网上搜索更多练习题。


    下一节是对本指南中涵盖的主题的快速回顾。


    # 以下是对我们所涵盖内容的快速回顾，以备你对某个特定步骤进行复习：


    1. 你现在已经了解了 `R Programming` 究竟是什么，以及使用 `R` 语言的益处。

    2. 你学习了如何安装 `R` 和 `R Studio`（开始编写 `R Programming` 代码的正确代码编辑器）、如何使用你的代码编辑器、初始 `R`
    会话、如何运行脚本以及导航工作区的方法。

    3. 你学习了 `R` 语法的基础知识、如何有效使用 `function`（函数）和 `arguments`（参数）、如何让代码清晰易读，以及如何通过用户包扩展
    `R` 的功能。

    4. 你学习了在 `R` 中工作的各种入门方法。我们涵盖了多种主题，如算术基础、如何在 `Vectors`（向量）中组织数据、如何处理逻辑向量、处理文本、`vector`
    与 `matrix`、`data frames`（数据框）以及 `lists`（列表）的创建。

    5. 你学习了如何在 `R` 中高效编写代码。我们讨论了如何利用 `functions` 高效自动化你的工作、如何智能地利用 `arguments`、如何控制
    `Logical Flow`（逻辑流）、如何循环不同的值，以及如何有效地调试你的 `Code`。

    6. 你学习了高效处理数据的各种方法。我们讨论了如何将数据导入导出 `R`、如何有效地操作和处理你的数据，以及如何对数据进行汇总。

    7. 你学习了如何处理 `Graphics`（图形）。我们还讨论了如何使用基础图形，以及如何使用 `Lattice` 创建分类图形（Facetted Graphics）。


    # 结语


    `R` 逐渐获得了巨大的认可，因为它完全开源，并且对新发展反应异常敏锐。在如今，在各种技术或其他逻辑领域中，对 `R` 有更好的了解被认为是至关重要的。


    本书真正地触及并解释了与 `R` 基础相关的各种重要主题，我们深信，通过本书的帮助，你可以建立一个极其坚实的基础，从而扩展到 `R` 所提供的许多其他应用中。


    到此，我们的书就结束了！我们诚地相信，这本书将极大地帮助你学习 `R` 语言的基础，并帮助你以巨大的成功（GREAT SUCESS！）实现你未来的所有 `R
    programming` 目标！


    你也可以考虑学习其他编程语言，如果你想学习其他语言，你对 `R Programming` 的知识将带给你巨大的优势。你可以在[这里]找到其他流行的编程书籍](http://www.amazon.com/Felix-Alvaro/e/B015JCBZN4/ref=dp_byline_cont_ebooks_1)。


    最后，如果你有任何问题、反馈或只是想打个招呼，也可以给我发送电子邮件！（我会回复的！）我的邮箱地址是：`(Felix_Alvaro@mail.com)`。


    再次感谢你，愿上帝保佑你！


