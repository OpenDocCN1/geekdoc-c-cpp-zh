    \nCRAN 还拥有一系列文件包以及参考手册。CRAN 甚至允许用户验证用户包是否仍然被保留，并获取该包中所做修改的概述。\n\n## 安装 R 包的方法\n\
    \n为了安装 R 包，你需要使用一个名为 `install.packages()` 的函数。例如，如果你想安装‘lubridate’ 包，只需要在 `install.packages()`\
    \ 函数中将包名（这里是‘lubridate’）作为字符串写入即可。\n\n‘lubridate’ 包包含了各种实用的工具，允许用户能够轻松地处理日期和时间。以下是安装用户包的方法：\n\
    \n```r\ninstall.packages(‘lubridate’)\n```\n\n## 加载和卸载用户包的方法\n\n在使用任何用户包之前，你首先需要将其加载到\
