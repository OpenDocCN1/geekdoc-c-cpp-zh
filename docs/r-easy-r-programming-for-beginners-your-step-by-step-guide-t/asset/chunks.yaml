  trans: "\n\n# 如何创建列表并在其中组合不同的对象？\n\n数据框（Data-frames）是向量的列表，尽管它们看起来像矩阵，但实际上并不是。在\
    \ R 语言中，列表（list）是一种相当常见且灵活的实体类型。它们对于分组不同形式的实体，或者对整组多样化的实体进行计算非常有用。\n\n## 如何创建列表？\n\
    \n要创建一个列表，你需要使用 `list()` 函数，你可以通过两种方式来实现。你可以构建一个无命名列表，也可以构建一个命名列表。现在，这两者的差异微乎其微；在两种情况下，都可以把列表想象成一个装满了许多种不同对象袋子的巨大箱子。与其对所有这些袋子进行编号，不如给它们命名，如果是这样，你最终拥有的的就是一个命名列表。\n\
    \n### 创建无命名列表的方法\n\n构建无命名列表非常简单，你只需要利用 `list()` 函数，并将你希望放入列表中的所有实体插入 `()` 中即可。让我们再次考虑篮球比赛的例子，我们在例子中构建了一个名为\
    \ `Total.baskets` 的矩阵，其中包含了 Phillip 和 George 的进球数：\n\n```\nTotal.baskets\n   \
    \          1st 2nd 3rd 4th 5th\nPhillip  10     3     3     5     8\nGeorge  4\
    \     2     1     1    10\n```\n\n现在，如果你想将上述矩阵与代表年份的字符向量合并，你需要输入以下代码：\n\n```\n\
    > l.baskets <- list(Total.baskets, ‘2015-2016’)\n> l.baskets\n\n[[1]]\n\n 1st\
    \ 2nd 3rd 4th 5th\nPhillip  10     3     3     5     8\nGeorge  4     2     1\
    \     1    10\n\n[[2]]\n[1] “2015-2016”\n```\n\n在这里，实体 `l.baskets` 拥有 2 个元素：`Total.baskets`（矩阵）和\
    \ `2015-2016`（年份）。符号 `[[]]` 内部的数值表示每个元素的“袋子编号”。\n\n### 创建命名列表的方法\n\n要构建一个命名（或标记的）列表，你只需要在\
    \ `list()` 函数的 `()` 符号内、在值之前添加名称即可：\n\n```\n> nl.baskets <- list(counts=Total.baskets,\
    \ year=’2015-2016’)\n> nl.baskets\n\n$ counts\n             1st 2nd 3rd 4th 5th\n\
    Phillip  10     3     3     5     8\nGeorge  4     2     1     1    10\n\n$ year\n\
    [1] “2015-2016”\n```\n\n在这里，`$` 符号表示元素列表的名称。\n\n### 合并列表的方法\n\n要合并列表，你只需要我们之前经常使用的一个函数，`c()`\
    \ 函数。该函数可以合并不同类型的实体，因此可以用于合并列表并创建一个新的列表。\n\n现在，如果你想添加关于竞争者的详情，你首先需要创建一个列表。为了确保获得相似的结果，你需要重建原始的\
    \ `l.baskets`：\n\n```\n> l.baskets <- list(Total.baskets,’2015-2016’)\n> competitors\
    \ <- list(rownames(Total.baskets))\n```\n\n之后，你需要利用 `c()` 函数将 `competitors` 列表与\
    \ `l.baskets` 列表合并：\n\n```\n> c(l.baskets, competitors)\n[[1]]\n             1st\
    \  2nd  3rd  4th  5th\nPhillip     10     3     3     5     8\nGeorge      4 \
    \    2     1     1    10\n\n[[2]]\n[1]      “2015-2016”\n\n[[3]]\n[1]  “Phillip”\
    \ “George”\n```\n\n"
- fmt: "\n# Error in y * multiply: ‘multiply’ is missing\n\nAs you didn’t state the\
    \ `multiply` argument, R couldn’t understand the argument; consequently, it displays\
    \ an error message and asks you for further details. Now, this could be real frustrating\
    \ as this also means that you would need to state `multiply=100` each time you\
    \ utilize the function. Here, stating a default value for the `multiply` argument\
    \ will definitely help you out.\n\nYou need to state the default values (regarding\
    \ any argument) by utilizing the `=` sign, followed by the default value. Just\
    \ type the following command:\n\n```\nm.unit <- function(y, multiply = 100){\n\
    \  c <- round(y * multiply, digits = 1)\n  paste(c, “”, sep = “ \")\n}\n```\n\n\
    These were some of the ways to utilize arguments the smart way. Now, we’ll talk\
    \ about the ways to control the Logical Flow.\n\n## How to control the Logical\
    \ Flow?\n\nA function is merely a plain series of actions; however, these are\
    \ extremely rigid as well. And quite frequently, you wish to have choices and\
    \ conduct action on the basis of a definite value.\n\n### Utilizing the ‘if’ statements\n\
    \nNow, to describe a choice in the R code is very easy: If a certain condition\
    \ holds true, then perform a definite chore. Numerous programming languages allow\
    \ you to perform that precisely with `if . . . then` words. In R it’s way simpler.\
    \ You just need to remove the word `then` and indicate your choice utilizing the\
    \ `if` statement.\n\nAn `if` statement has 3 constituents:\n* Keyword `if`.\n\
    * A solo logical value within the brackets (parentheses).\n* A code segment within\
    \ `{ }` (braces) which will be carried out if the logical value holds TRUE.\n\n\
    Let’s just write a little function and name it `pCal()`, which computes the rate\
    \ that you charge to a client on the basis of the hours you worked for that client.\
    \ Just type the following:\n\n```\npCal <- function(hrs, rh=30){\n  np <- hrs\
    \ * rh\n  round(np)\n}\n```\n\nFollowing is the description of the code:\n* The\
    \ keyword `function` describes the function.\n* The code within the `{ }` (braces)\
    \ is the function’s main body.\n* Within the brackets (parentheses), you need\
    \ to state the arguments `hrs` (hours) and `rh` (here the default value is $30\
    \ per/hour).\n* You compute the `np` (total charges) by multiplying `hrs` & `rh`.\n\
    * The final result will be the rounded number (total charges).\n\nNow, assume\
    \ that there are certain clients who provide you with loads of work, and you make\
    \ a decision to offer them a 10 % discount, on the rates you charge per hour,\
    \ for the jobs with over 110 hours time. Subsequently, in case the number of working\
    \ hours is in excess of 110 hours times, then you’re needed to compute the fresh\
    \ price by multiplying 0.9 with the total charges. Following is the code:\n\n\
    ```\npCal <- function(hrs, rh=30){\n  np <- hrs * rh\n  if(hrs > 110) {\n    np\
    \ <- np * 0.9\n  }\n  round(np)\n}\n```\n\nHere, the discount is only available\
    \ when the number of working hours is in excess of 110 hours time. Following are\
    \ the different output:\n`pCal(hours = 45)` -> `[1] 1350`\n`pCal(hours = 120)`\
    \ -> `[1] 3240`\n\n### Utilizing the ‘if...else’ statements\n\nIn certain scenarios,\
    \ you would want the function to perform certain task if a specific condition\
    \ holds true, and to perform some other task if condition’t hold true. And, although\
    \ you’d able to perform this with `if` statements, there is certainly a simpler\
    \ method to do this by the `if...else` statement. This statement consists of similar\
    \ constituents like the `if` statement, and some ones:\n* The `else` keyword is\
    \ put below 1st code section.\n* The 2nd code section written between `{ }` (braces),\
    \ has to be performed only in case the outcome of the condition in 1st section\
    \ (`if`) returns FALSE.\n\nLet’s consider an example. In certain countries, the\
    \ sum of VAT (value added tax) which is needed to be paid on specific services\
    \ is based on whether the consumer is a public or a private. Just assume that\
    \ public establishments need to shell-out only 6 % VAT, and private establishments\
    \ need to shell-out 12 % VAT. Now, you can include an additional argument `private`\
    \ to the previous `pCal()` function, and type the following command to add accurate\
    \ total of VAT:\n\n```\npCal <- function(hrs, rh=30, private=TRUE){\n  np <- hrs\
    \ * rh\n  if(hrs > 110) np <- np * 0.9\n  if(private) {\n    tp <- np * 12\n \
    \ } else {\n    tp <- np * 06\n  }\n  round(tp)\n}\n```\n\nNow, in case you worked\
    \ for 35 hours, the results would be different for public and private:\n`pCal(35,\
    \ private=TRUE)` -> `[1] 176`\n`pCal(35, private=FALSE)` -> `[1] 113`\n\n## How\
    \ to loop through different values\n\n### Ways to create a ‘for loop’\n\nJust\
    \ like in several other languages, a `for loop` is being utilized to replicate\
    \ a certain task for each vector value. Following is the way a `for loop` is created\
    \ in R:\n\n```\nfor(x in values){\n  ... Perform a task...\n}\n```\n\nFollowing\
    \ are the constituents of this `for loop`:\n* The `for` keyword, which is followed\
    \ by brackets (parentheses).\n* A variable within the brackets (parentheses).\
    \ Here, we’ve used `x`.\n* The variable `x` is followed by the `in` keyword.\n\
    * A vector containing `values` to loop through.\n* A section of code within the\
    \ `{ }` (braces), which is required to be performed for each value in the vector\
    \ `values`.\n\nIn the code section, you can utilize the variable `x`. Every occasion\
    \ when R loops through the code, it allocates the subsequent value in the vector\
    \ containing `values`, to the variable `x`.\n\n### How to compute values in a\
    \ ‘for loop’?\n\nLet’s again consider the example of the `pCal()` function. In\
    \ the previous example, we calculated how to charge different VAT for public and\
    \ private establishments. Here, we’ll tell you how to utilize a `for loop` to\
    \ calculate the charges for many clients, instantly. Just type the following code:\n\
    \n```\npCal <- function(hrs, rh=30, customer){\n  np <- hrs * rh * ifelse(hrs\
    \ > 110, 0.9, 1)\n  V <- numeric(0)\n  for(x in customer){\n    V <- c(V, switch(x,\
    \ private=1.12, public=1.06, 1))\n  }\n  tp <- np * V\n  round(tp)\n}\n```\n\n\
    The initial and the final part of the `pCal()` function doesn’t change; however,\
    \ in the central block, you perform the following:\n* Build `numeric` vector with\
    \ `0` value, and named it as `V`.\n* For each of the value in the vector `customer`,\
    \ you applied `switch()` function to choose the right sum of Value Added Tax to\
    \ be paid.\n* In every circle through the loop, you added the result of `switch()`\
    \ function in the vector `V`.\n\nThe final outcome is a vector `V` which possess\
    \ the right figures of the Value Added Tax, for every customer.\n\n## How to effectively\
    \ debug your Code?\n\nNo one can write a perfect code devoid of any errors. Therefore,\
    \ rather than speculating about the mistakes in your code, your first step must\
    \ be to inquire yourself, where have you committed those errors?\n\n### Understanding\
    \ where the problem lies\n\nHere, a bug is just a different word for an error\
    \ in your code. Hence, debugging process doesn’t engage any of the pesticides.\
    \ It literally means removing every form of `logical` or/and `semantic` errors\
    \ in your program.\n\nTherefore, prior to removing those bugs, you need to understand\
    \ the stuff you’re searching for. Following are some of the different categories\
    \ of errors:\n* `Syntax` errors: In case you’ve written a code which R can’t interpret,\
    \ then you have committed `syntax` errors. The outcome of such errors is always\
    \ an error message, and it frequently happens due to some misspelling, or incomplete\
    \ bracket.\n* `Semantic` errors: In case you’ve written a code which doesn’t perform\
    \ the intended task, then you have committed a `semantic` error. Here, although\
    \ the code is proper, however, the results are not what it was meant for, and\
    \ your code is unsuccessful.\n"
