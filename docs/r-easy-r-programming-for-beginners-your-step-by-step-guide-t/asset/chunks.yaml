    As `faithful` is a data-frame with 2 columns, the code creates a scatter-plot
    with the no. of eruptions (1st column) on the y-axis, and the waiting-time (2nd
    column) on the x-axis.


    ## How to add points to the plot?


    You need to utilize the `points()` function to achieve this. You can check on
    the `faithful` plot that there exist 2 groups. One group has smaller eruptions
    and their waiting-time lasts under 3.5 minutes. Now, construct a subset of `faithful`
    consisting of eruptions lesser than 3.5 minutes:


    ```r

    sh.erupt <- with(faithful, faithful[No. of eruptions < 3.5, ])

    ```


    Then, utilize the `points()` function to insert all such points in green to the
    plot:


    ```r

    plot(faithful)

    points(sh.erupt, col="green", pch=21)

    ```


    Here, the argument `col` is utilized to alter the point’s color, and the argument
    `pch` is utilized to alter the `plotting character`. The following figure displays
    the output:


    ![erupt2.jpg](images/00034.jpeg)


    ### Altering the shape of the points:


    Following are ways to utilize the argument `pch` to alter the shape of the points:


    *   19: For `Solid-Circle`

    *   20: For `Bullet`

    *   21: For `Filled-Circle`

    *   22: For `Filled-Square`

    *   23: For `Filled-Diamond`

    *   24: For `Filled-Triangle` (Pointing upwards)

    *   25: For `Filled-Triangle` (Pointing downwards)


    These were some of the ways to use the base graphics. Next, we’ll talk about how
    to create Facetted Graphics using Lattice.


    ## How to create Facetted Graphics using Lattice?


    Constructing data subsets as well as plotting all the subsets, permits you to
    observe any patterns among the diverse subsets. For instance, a general manager
    might wish to check specific details for various areas in a graphical form, or
    an ecologist might wish to examine diverse species of caterpillars, and evaluate
    it on a plot.


    Now, a solo graphic which presents such type of concurrent observations of diverse
    pieces via the data is known as a faceted graphic. R comes with a unique package
    known as `lattice` which lets you to effortlessly generate such type of graphic.


    ### How to create a lattice plot?


    In order to know more about lattice graphics, we’ll again consider the example
    of the in-built data-set `mtcars`. Note: You can access all the in-built data-sets
    of R just by typing `?` symbol followed by the data-set name, for instance `?mtcars`:


    To get the details of `mtcars`, just type the following:


    ```r

    str(mtcars)

    ```


    `data.frame`: 30 obs. of 11 variables:


    *   `cyl : num 5 5 3 5 7 5 7 5 3 3 ...`

    *   `mpg : num 18 19 21 22 19 20 16.3 21.4 20.8 18.2 ...`

    *   `hp : num 120 100 94 115 150 185 258 78 97 148 ...`

    *   `disp : num 170 140 118 356 260 ...`

    *   `wt : num 2.72 2.58 2.12 3.11 3.64 ...`

    *   `drat : num 2.9 2.9 3.70 3.88 3.75 2.46 3.31 3.49 3.72 3.42 ...`

    *   `vs : num 1 1 0 0 1 0 1 0 0 1 ...`

    *   `qsec : num 14.5 16 19.6 18.4 15 ...`

    *   `gear : num 3 3 3 4 4 4 4 3 3 3 ...`

    *   `am : num 0 0 0 1 1 1 1 0 0 ...`

    *   `carb : num 3 5 2 2 1 2 4 1 1 4 …`


    Let’s assume you wish to know the connection between gear and carburetor. The
    `mtcars` data-set possess two constituents related to this information:


    *   `carb`

    *   `gear`


    We’ll create the scatter-plot of `carb` against `gear` in the following section.


    ### How to load the lattice package?


    You need to inform R that you wish to utilize the `lattice` package, and you perform
    this by utilizing the `library()` function. Bear in mind that you have to carry
    out this at the beginning of every R session, where you wish to utilize lattice:


    ```r

    library("lattice")

    ```


    ### Ways to create a lattice scatter-plot:


    The lattice package comes with various functions to build diverse forms of plot.
    For instance, to generate a scatter-plot, you need to utilize the `xyplot()` function.
    Remember that it’s relatively different from the base graphics. In the base graphics
    case, the `plot()` function generates a range of diverse forms of plot.


    Now, in order to create a lattice scatter-plot,


    *   **Formula**: `carb ~ gear`

    *   **Data**: `data=mtcars`


    ```r

    xyplot(carb ~ gear, data=mtcars)

    ```


    ![erupt2.jpg](images/00034.jpeg)


    These were some of the ways to use the base graphics. Next, we’ll talk about how
    to create Facetted Graphics using Lattice.

