    \ with the values 2:4\n\n*   A vector with the values 5:7\n\n*   And, a matrix\
    \ with 3 rows and 2 columns, loaded column by column with the values 8 to 13.\n\
    \nNow, the above example exhibits various helpful properties of rbind( ) & cbind(\
    \ ) functions:\n\n*   These work with both matrices as well as vectors.\n\n* \
    \  You can provide in excess of 2 arguments to each function.\n\n*   You can merge\
    \ diverse types of entities, provided that the dimensions are appropriate.\n\n\
    How to calculate with matrices?\n\nPossibly the biggest attribute of R is its\
    \ ability to handle complicated matrix calculations in a very simple way. So,\
    \ when you consider calculations on matrices, you can either consider its elements,\
    \ or the entire matrix as a value. In case you wish to add scalar (a solo number)\
    \ to any matrix, you integrate that solo number to each constituent of that matrix.\
    \ You just need to utilize the addition (+) operator, to perform this:\n\n> fm\
    \ + 5\n\n      [,1]  [,2]  [,3] \n\n[1,]   7    11    15\n\n[2,]   8    12   \
    \ 16\n\n[3,]   9    13    17\n\n[4,]  10   14    18\n\nLikewise, you can even\
    \ utilize numerous arithmetic operators to carry out any calculation on each of\
    \ the elements of a matrix. Consider one more example:\n\nIn the above mentioned\
    \ matrix fm, you wish to add 2 to the 1st row, 3 to the 2nd row, 4 to the 3rd\
    \ row, and 5 to the 4th row. This can be done by creating another matrix fx, which\
    \ consists of 3 columns and 4 rows, and has 2, 3, 4 and 5 as values in the 1st,\
    \ 2nd, 3rd and 4th rows, in that order:\n\n> fx <- matrix(2:5, nrow=4, ncol=3)\n\
    \nUtilizing the addition (+) operator, both the matrices (fm & fx) can be merged:\n\
    \n> fm + fx\n\n        [,1]  [,2]  [,3] \n\n[1,]   4     8    12\n\n[2,]   6   \
    \ 10    14\n\n[3,]   8    12    16\n\n[4,]  10   14    18\n\nYou need to keep\
    \ in mind that the dimension of the two matrices should match. Or, R won’t perform\
    \ the operation, and you’ll get the following outcome:\n\n> fm + fx[,2:4]\n\n\
    Error in fm + fx[, 2:4] : non-conformable arrays\n\nHowever, in case if we add\
    \ a vector as an alternative to a matrix, you’ll get the following outcome:\n\n\
    > fm + 2:4\n\n        [,1]  [,2]  [,3] \n\n[1,]   4     8    12\n\n[2,]   6   \
    \ 10    14\n\n[3,]   8    12    16\n\n[4,]  10   14    18\n\nHere, R considers\
    \ the matrix like a vector, and plainly overlooks the dimensions.\n\nThese were\
    \ some of the ways to calculate with matrices. Now, we’ll talk about the various\
    \ ways to combine different types of value in a Data-Frame, and manipulate those\
    \ values.\n\nHow to combine different types of value in a Data-Frame, and manipulate\
    \ those values?\n\nData-sets are developed from diverse data types. For instance,\
    \ you can include your employee’s names, their incomes, and their joining date,\
    \ all in the similar data-set. However, you just can’t merge all such data in\
    \ a single matrix without changing the data to a character value. Therefore, you\
    \ require a new data-structure to retain all such details in R. And, this data-structure\
    \ is known as a Data-Frame.\n\nWays to build a data-frame from a matrix:\n\nLet’s\
    \ again consider the basketball game example, where we built a matrix Total.baskets\
    \ which contained the number of baskets made by Phillip and George:\n\nTotal.baskets\n\
    \n [,1] [,2] [,3] [,4] [,5]\n\nPhillip  10    3    3     5     8\n\nGeorge  4    \
    \ 2    1     1   10\n\nWe can convert this matrix into a data-frame having 2 variables:\
    \ one variable with Phillip’s baskets and another variable with George’s baskets.\
    \ Now, to transform the Total.baskets matrix into a data-frame, you need to utilize\
    \ the as.data.frame( ) function:\n\n> dt.baskets <- as.data.frame(t(Total.baskets))\n\
    \nHere, we also need to utilize the transpose t( ) function, to build a data frame.\
    \ The t() function flips the matrix, which turns rows into columns and vice versa.\
    \ In case of data-frames, every variable means a column; however, in the Total.baskets\
    \ matrix, the rows symbolize the number baskets for a solo participant. Hence,\
    \ to facilitate the preferred outcome, you need to flip the Total.baskets matrix\
    \ with t( ) function prior to transforming it into a data-frame using as.data.frame()\
    \ function. Following is the result:\n\n> dt.baskets\n\n           Phillip George\n\
    \n1st 10        4\n\n2nd 3         2\n\n3rd 3          1\n\n4th 5          1\n\
    \n5th 8         10\n\nYou can even utilize the str() function to check the internal\
    \ composition of the output:\n\n> str(dt.baskets)\n\n‘data.frame’: 5 obs. of 2\
    \ variables:\n\n$ Phillip: num 10 3 3 5 8\n\n$ George: num 4 2 1 1 10\n\nHence,\
    \ it is confirmed that it’s a real data-set.\n\nOther way to create a data-frame:\n\
    \nThe previous method to create a data-frame from a matrix cannot be utilized\
    \ to create a data-frame from diverse value types. You need to utilize the data.frame(\
    \ ) function in order to create a data-frame from any other value types.\n\nLet’s\
    \ create a small data-frame containing names, incomes, and joining dates of small\
    \ number of employees. You need to build 3 separate vectors with the essential\
    \ details which are as follows:\n\n> names <- c(‘Peter Parker’, ’Clark Kent’,\
    \ ‘Bruce Wayne’)\n\n> income <- c(31000, 19000, 25000)\n\n> dt.join <- as.Date(c(‘2012-10-5’,’2009-4-14’,’2005-6-20’))\n\
    \nHere, you possess 3 diverse vectors:\n\n*   Character vector (employee names)\n\
    \n*   Numeric vector (income)\n\n*   Date vector (date of joining)\n\nNow, you\
    \ merge all these 3 vectors into a data-frame. Type the following command:\n\n\
    > dt.emp <- data.frame(names, income, dt.join)\n\nThe following is the outcome\
    \ of this code:\n\n> str(dt.emp)\n\n‘data.frame’: 3 objects.  3 variables:\n\n\
    $ names: Factor w/ 3 levels “Peter Parker” “Clark Kent” “Bruce Wayne”\n\n$ income:\
    \ num 31000, 19000, 25000\n\n$ dt.join: Date, format: “2012-10-5” “2009-4-14”\
    \ “2005-6-20”\n\nManipulating Values in a Data Frame: \n\nConstructing a data-frame\
    \ is pleasant; however, data-frames are relatively worthless in case you’re not\
    \ able to alter its values, or integrate data to the data-frames. Fortunately,\
    \ data-frames come with certain good features. In case, you wish to manipulate\
    \ the values, nearly all the ploys you performed on matrices could be utilized\
    \ on the data-frames too. Additionally, you can even utilize certain techniques\
    \ which are exclusively designed to be carried out for data-frames.\n\nHow to\
    \ extract values from data-frame?\n\nIn several scenarios, you’d be able to extract\
    \ values from any data-frame by assuming that the data-frame is a matrix, and\
    \ by utilizing the methods you performed on matrices. However, quite dissimilar\
    \ to both matrices as well as arrays, data-frames are not at all vectors. So always\
    \ bear in mind that, data-frames are lists of vectors, and even though they might\
    \ appear as matrices, they actually are not.\n\nAssuming data-frames as a matrix:\n\
    \nLet’s again consider the basketball game example. We’ll utilize the data-frame\
    \ dt.baskets which we built in the “Ways to build a data-frame from a matrix”\
    \ section earlier.\n\n> dt.baskets\n\n           Phillip George\n\n1st 10       \
    \ 4\n\n2nd 3         2\n\n3rd 3          1\n\n4th 5          1\n\n5th 8        \
    \ 10\n\nNow, you can extract the count of baskets made by Phillip in the 4th game:\n\
    \n> dt.baskets[‘4th’, ‘Phillip’]\n\n[1] 5\n\nSimilarly, you can extract the entire\
    \ baskets made by George utilizing the column index:\n\n> dt.baskets[, 2]\n\n\
    [1] 4 2 1 1 10\n\nAnd, in case you wish to see the results to be like a data-frame,\
    \ then you need to utilize drop=FALSE:\n\n> str(dt.baskets[, 2, drop=FALSE])\n\
    \n‘data.frame’: 5 obs. of 1 variable:\n\n$ George: num 4 2 1 1 10\n\nNow, you\
    \ might have noticed the dollar symbol ($). This symbol is merely a precise approach\
    \ to access various variables. And, to access the George variable, you need to\
    \ utilize the dollar symbol in the following way:\n\n> dt.baskets$George\n\n[1]\
    \ 4 2 1 1 10\n\nThe result here displays a vector with the entire values within\
    \ in that variable. These were some of the ways to combine different types of\
    \ value in a Data-Frame, and manipulate those values. Now, we’ll discuss how to\
    \ create a list, and combine different objects in it."
