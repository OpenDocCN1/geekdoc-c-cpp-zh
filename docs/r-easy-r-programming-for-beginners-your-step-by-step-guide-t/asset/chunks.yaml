    How to create Facetted Graphics using Lattice?


    Constructing data subsets as well as plotting all the subsets, permits you to
    observe any patterns among the diverse subsets. For instance, a general manager
    might wish to check specific details for various areas in a graphical form, or
    an ecologist might wish to examine diverse species of caterpillars, and evaluate
