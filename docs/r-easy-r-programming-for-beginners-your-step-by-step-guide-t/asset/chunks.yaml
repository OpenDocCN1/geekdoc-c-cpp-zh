  trans: '

    由于 `faithful` 是一个包含 2 列的数据框，该代码创建了一个散点图，其中喷发次数（第 1 列）位于 y 轴，等待时间（第 2 列）位于 x 轴。


    ## 如何在图中添加点？


    你需要利用 `points()` 函数来实现这一目标。你可以通过检查 `faithful` 图发现存在 2 个组。其中一组的喷发次数较少，且等待时间持续不到
    3.5 分钟。现在，构建一个 `faithful` 的子集，包含喷发次数小于 3.5 分钟的数据：


    ```r

    sh.erupt <- with(faithful, faithful[No. of eruptions < 3.5, ])

    ```


    然后，利用 `points()` 函数将所有此类点以绿色插入图中：


    ```r

    plot(faithful)

    points(sh.erupt, col="green", pch=21)

    ```


    在这里，参数 `col` 用于更改点的颜色，参数 `pch` 用于更改 `plotting character`（绘图字符）。下图显示了输出结果：


    ![erupt2.jpg](img/00034.jpeg)


    ### 更改点的形状：


    以下是利用 `pch` 参数更改点形状的几种：


    *   19: 用于 `Solid-Circle`（实心圆）

    *   20: 用于 `Bullet`（圆点）

    *   21: 用于 `Filled-Circle`（填充圆）

    *   22: 用于 `Filled-Square`（填充正方形）

    *   23: 用于 `Filled-Diamond`（填充菱形）

    *   24: 用于 `Filled-Triangle`（向上三角形）

    *   25: 用于 `Filled-Triangle`（向下三角形）


    这些是使用基础图形的一些方法。接下来，我们将讨论如何使用 Lattice 创建分图（Facetted Graphics）。


    ## 如何使用 Lattice 创建分图？


    构建数据子集并绘制所有子集可以让你观察到不同子集之间的任何模式。例如，经理可能希望以图形形式检查各个区域的具体细节，或者生态学家可能希望检查不同的毛虫种类并在图中进行评估。


    现在，这种通过数据展示对不同部分进行并发观测的单一图形被称为分面图（faceted graphic）。R 附带了一个名为 `lattice` 的独特包，它可以让你轻松生成此类图形。


    ### 如何创建 lattice 图形？


    为了进一步了解关于 lattice 图形，我们将再次考虑内置数据集 `mtcars` 示例。注意：你只需通过输入 `?` 符号加上数据集名称即可访问 R 的所有内置数据集，例如
    `?mtcars`：


    要获取 `mtcars` 的详情，只需输入以下：


    ```r

    str(mtcars)

    ```


    `data.frame`: 30 个观测值，11 个变量：


    *   `cyl : num 5 5 3 5 7 5 7 5 3 3 ...`

    *   `mpg : num 18 19 21 22 19 20 16.3 21.4 20.8 18.2 ...`

    *   `hp : num 120 100 94 115 150 185 258 78 97 148 ...`

    *   `disp : num 170 140 118 356 260 ...`

    *   `wt : num 2.72 2.58 2.12 3.11 3.64 ...`

    *   `drat : num 2.9 2.9 3.70 3.88 3.75 2.46 3.31 3.49 3.72 3.42 ...`

    *   `vs : num 1 1 0 0 1 0 1 0 0 1 ...`

    *   `qsec : num 14.5 16 19.6 18.4 15 ...`

    *   `gear : num 3 3 3 4 4 4 4 3 3 3 ...`

    *   `am : num 0 0 0 1 1 1 1 0 0 ...`

    *   `carb : num 3 5 2 2 1 2 4 1 1 4 …`


    假设你想知道 `gear`（档轮数）和 `carb`（化油器数）之间的联系。`mtcars` 数据集包含与此信息相关的两个部分：


    *   `carb`

    *   `gear`


    我们将在下一节中创建 `carb` 对 `gear` 的散点图。


    ### 如何加载 lattice 包？


    你需要告知 R 你想要使用 `lattice` 包，通过使用 `library()` 函数来实现。请记住，你需要在每个使用 lattice 的 R 会话开始时执行此操作：


    ```r

    library("lattice")

    ```


    ### 创建 lattice 散点图的方法：


    lattice 包提供了各种函数来构建不同形式的图表。例如，要生成散点图，你需要利用 `xyplot()` 函数。记住它与基础图形有所不同。在基础图形中，`plot()`
    函数可以生成多种形式的图。


    现在，为了创建一个 lattice 散点图，


    *   **公式**: `carb ~ gear`

    *   **数据**: `data=mtcars`


    ```r

    xyplot(carb ~ gear, data=mtcars)

    ```

