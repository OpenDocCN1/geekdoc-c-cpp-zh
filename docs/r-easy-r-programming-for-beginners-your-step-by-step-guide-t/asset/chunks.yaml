    \ you need to state the argument ‘times’. In order to repeat the vector c(1,1,\
    \ 6) four times, just type this command:\n\n> rep(c(1,1,6), times = 4)\n\n[1]\
    \ 1 1 6 1 1 6 1 1 6 1 1 6\n\nYou can even repeat each of the value by stating\
    \ the argument ‘each’:\n\n> rep(c(1, 3,1), each = 4)\n\n[1] 1 1 1 1 3 3 3 3 1\
    \ 1 1 1\n\nYou can even inform R about the number of times each value needs to\
    \ be repeated:\n\n> rep(c(1, 6), times = c(3,4))\n\n[1] 1 1 1 6 6 6 6\n\nNow,\
    \ utilize the argument ‘l’ to inform R about length you desire. The vector will\
    \ be repeated till it encounters your desired length, even in case the final repetition\
    \ is unfinished. Consider the following example:\n\n> rep(3:5,l=8)\n\n[1] 3 4\
    \ 5 3 4 5 3 4\n\nThese were some of the ways to organize data in a vector. Now,\
    \ we’ll discuss various ways to get values in and out of Vectors.\n\nHow to get\
    \ values in and out of Vectors?\n\nYou can carry out such tasks effortlessly by\
    \ utilizing the advanced indexing system in R.\n\nKnowing the indexing system:\n\
    \nEach time R displays a vector, it exhibits a numeric value like [1] ahead of\
    \ any result. Now by displaying [1], R actually informs you about the location\
    \ of the 1st position in the vector. It’s actually the index position of that\
    \ vector value. And, in case you create a lengthy vector, for instance from 1\
    \ to 20, then you’ll view additional indices. Following is an example:\n\n> n\
    \ <- 20:1\n\n> n\n\n[1] 20 19 18 17 16 15 14 13 12 11 10 9 8 7 6 5 4\n\n[18] 3\
    \ 2 1 0 \n\nHere, R considers 3 as the 18th vector value. At the start of each\
    \ line, R informs you about the index of the 1st value of that particular line.\n\
    \nWays to extract values from any vector:\n\nThe brackets [ ] symbolizes a powerful\
    \ function in R which you can utilize to extract a value from any vector. Consider\
    \ the above mentioned example. You can acquire the 6th value of the n vector by\
    \ typing the following:\n\n> n[6]\n\n[1] 15\n\nThe bracket [ ] function considers\
    \ vectors like arguments. In case, you wish to pick beyond a single digit, then\
    \ you can just mention a vector of indices like an argument within the [ ]:\n\n\
    > n[c(6,9,2)]\n\n[1] 15 12 19\n\nYou can even save the indices, which you desire\
    \ to extract, in a different vector and present that very vector like an argument:\n\
    \n> nd <- c(4,10,2)\n\n> n[nd]\n\n[1] 17 11 19\n\nYou can even utilize indices\
    \ to remove values from any vector. Following is an example where you give a command\
    \ to remove value at the 4th position:\n\n> n[-4]\n\n[1] 20 19 18 16 15 14 13\
    \ 12 11 10 9 8 7 6 5 4 3\n\n[18] 2 1 0\n\nAnd, in case you wish to remove the\
    \ initial 15 numbers, then type the following command:\n\n> n[-(1:15)]\n\n[1]\
    \ 5 4 3 2 1 0\n\nWays to change values in any vector:\n\nLet’ again consider that\
    \ basketball game example where Philip and George made baskets in five basketball\
    \ games.\n\n> Phillip.baskets <- c(10,3,3,5,8)\n\n> George.baskets <- c(4,2,1,1,10)\n\
    \nNow, assume that there was an error while noting down the number of baskets\
    \ made by Phillip. In the 2nd game, Phillip made 6 baskets, not 3\\. This error\
    \ can be easily rectified by utilizing indices:\n\n> Phillip.baskets[2] <- 6\n\
    \n> Phillip.baskets\n\n[1]  10 6 3 5 8\n\nSimilarly, there were two errors while\
    \ noting down the number of baskets made by George. In the 3rd and 4th game, he\
    \ in reality made five baskets. This error can also be easily rectified by utilizing\
    \ indices:\n\n> George.baskets[c(3,4)] <- 5\n\n> George.baskets\n\n[1]  4 2 5\
    \ 5 10\n\nThese were some of the examples to get values in and out of Vectors.\
    \ Now, we’ll discuss the various ways to work with logical Vectors.\n\nHow to\
    \ work with logical Vectors?\n\nWe’ll talk about the values TRUE and FALSE. These\
    \ values are called logical values in R. You can perform countless things with\
    \ logical values, as you can create vectors which consist of merely logical values.\
    \ And, you can utilize such logical vectors like an argument to support the index\
    \ functions, which works as a potent tool.\n\nWays to compare values:\n\nIn order\
    \ to create logical vectors, you ought to understand the various ways to compare\
    \ values, and R comes with a collection of operators which anyone can utilize\
    \ to get the job done. Following is a table of operators:\n\n![logical.jpg](images/00024.jpeg)\n\
    \nLet’s again consider the basketball game example. Now, in order to confirm the\
    \ games in which Phillip made less than 4 baskets, just type the following command:\n\
    \n> Phillip.baskets <- c(10,3,3,5,8)\n\n> Phillip.baskets < 4\n\n[1] FALSE TRUE\
    \ TRUE FALSE FALSE \n\nThe outcome reveals the 2nd and 3rd games. Now, in case\
    \ you’ve created a very lengthy vector, then to keep a count of numbers could\
    \ pose a big problem. To tackle such problem, R comes with the which( ) function.\
    \ So, to the check the games in which Phillip made less than 4 baskets, just type\
    \ the following code:\n\n> which(Phillip.baskets < 4)\n\n[1] 2 3\n\nHere, the\
    \ which( ) function exhibits the indices where the value holds TRUE.\n\nWays to\
    \ use logical vectors like indices:\n\nThe index function works quite efficiently\
    \ with the logical vectors. You can utilize these logical vectors to effectively\
    \ pick certain values from a vector. In case, you opt to utilize a logical vector\
    \ for indexing purpose, R will exhibit a vector with just the values where the\
    \ logical vector holds TRUE.\n\nNow, in case you wish to know how many baskets\
    \ Phillip made more than George, just type the following command:\n\n> Total <-\
    \ Phillip.baskets > George.basket\n\n> Phillip.baskets [Total]\n\n[1]  10 3 3\
    \ 5"
