- md: "\ncontrol flow hard to follow and reasoning about the program difficult.\n\n\
    Functional programming offers an alternative way of dealing with errors that can\
    \ make control flow clearer and the program easier to reason about. Instead of\
    \ throwing exceptions, functions return values that represent either a successful\
    \ computation or an error. The caller can then decide how to handle the error.\n\
    \nLet's implement it:\n\n```csharp\npublic abstract class Try<T>\n{\n    public\
    \ abstract TResult Match<T, TResult>(Func<T, TResult> onSuccess, Func<System.Exception,\
    \ TResult> onException);\n\n    public sealed class Success : Try<T>\n    {\n\
    \        private readonly T _value;\n        public Success(T value) => _value\
    \ = value;\n        public override TResult Match<T, TResult>(Func<T, TResult>\
    \ onSuccess, Func<System.Exception, TResult> onException) => onSuccess(_value);\n\
    \    }\n\n    public sealed class Exception : Try<T>\n    {\n        private readonly\
    \ System.Exception _exception;\n        public Exception(System.Exception exception)\
    \ => _exception = exception;\n        public override TResult Match<T, TResult>(Func<T,\
    \ TResult> onSuccess, Func<System.Exception, TResult> onException) => onException(_exception);\n\
    \    }\n}\n```\n\n```csharp\npublic static Try<T> Of(Func<T> f)\n{\n    try {\n\
    \        return new Success(f());\n    }\n    catch (System.Exception ex) {\n\
    \        return new Exception(ex);\n    }\n}\n```\n\n```csharp\n// Map\npublic\
    \ Try<TResult> Map<TResult>(Func<T, TResult>) => Match(\n    onSuccess: t => Try<TResult>.Of(()\
    \ => f(t)),\n    onException: ex => new Try<TResult>.Exception(ex)\n);\n```\n\n\
    ```csharp\n// Bind\npublic Try<TResult> Bind<TResult>(Func<T, Try<TResult>>) =>\
    \ Match(\n    onSuccess: t => f(t),\n    onException: ex => new Try<TResult>.Exception(ex)\n\
    );\n```\n\n```csharp\npublic T GetOrElse(T defaultValue)\n=> Match(\n  onSuccess:\
    \ t => t,\n  onException: _ => defaultValue\n);\n```\n\nThis Try<T> class represents\
    \ a computation that may fail with an exception. It's an abstract class with two\
    \ derived classes: Success and Exception. The Success class represents a successful\
    \ computation and holds the result of type T, while the Exception class represents\
    \ a failed computation and holds the exception that caused the failure.\n\nThe\
    \ Of method is used to create a Try<T> instance from a potentially exception-throwing\
    \ function. If the function throws an exception, a Try<T>.Exception instance is\
    \ returned; otherwise, a Try<T>.Success instance is returned.\n\nThe Map and Bind\
    \ methods are used to transform and chain Try<T> instances respectively, in a\
    \ way that preserves the exceptional state. If the Try<T> instance represents\
    \ a failed computation, the transformation or chaining operation is skipped and\
    \ the exception is propagated.\n\nThe GetOrElse method is used to retrieve the\
    \ result of the computation if it was successful, or a default value if it failed.\n\
    \n### Examples\n\nSuppose we have a function Divide that can throw a DivideByZeroException:\n\
    \n```csharp\npublic static double Divide(double x, double y)\n{\n  return x /\
    \ y;\n}\n```\n\nWe can encapsulate this function in a Try<T> to handle the potential\
    \ exception:\n\n```csharp\nvar tryResult = Try<double>.Of(() => Divide(10, 0));\n\
    ```\n\nNow, tryResult is a Try that represents the result of the division operation.\
    \ If the operation was successful, tryResult is a Try.Success with the result\
    \ of the division. If the operation threw an exception, tryResult is a Try.Exception\
    \ with the thrown exception.\n\nWe can transform the result using the Map method:\n\
    \n```csharp\nvar tryQuotientPlusOne = tryResult.Map(quotient => quotient + 1);\n\
    ```\n\nIf tryResult is a Try.Success, tryQuotientPlusOne is a Try.Success with\
    \ the result of the division plus one. If tryResult is a Try.Exception, tryQuotientPlusOne\
    \ is the same Try.Exception.\n\nWe can chain computations using the Bind method:\n\
    \n```csharp\nvar tryReciprocal = tryResult.Bind(quotient => Try<double>.Of(()\
    \ => 1 / quotient));\n```\n\nIf tryResult is a Try.Success, tryReciprocal is a\
    \ Try that represents the result of computing the reciprocal of the quotient.\
    \ If tryResult is a Try.Exception, tryReciprocal is the same Try.Exception.\n\n\
    We can handle both success and error cases using the Match method:\n\n```csharp\n\
    string message = tryResult.Match(\nonSuccess: quotient => $\"The result is {quotient}.\"\
    ,\nonException: ex => $\"An error occurred: {ex.Message}\"\n);\n```\n\nHere, message\
    \ is a string that contains either a success message with the quotient, or an\
    \ error message with the exception message.\n\nFinally, we can use the GetOrElse\
    \ method to retrieve the result or a default value:\n\n```csharp\ndouble quotient\
    \ = tryResult.GetOrElse(0);\n```\n\nHere, quotient is the quotient if the operation\
    \ was successful, or 0 if the operation threw an exception.\n\nLet's see how we\
    \ can use Try<T> in a unit test following the AAA (Arrange, Act, Assert) pattern.\
    \ We'll use the Divide function and Try<T> from the previous examples.\n\n[Test]\n\
    \n```csharp\npublic void Divide_ByZero_ReturnTryException()\n{\n    // Arrange\n\
    \    double x = 10, y = 0;\n\n    // Act\n    var result = Try<double>.Of(() =>\
    \ Divide(x, y));\n\n    // Assert\n    Assert.IsInstanceOf<Try<double>.Exception>(result);\n\
    }\n```\n\nIn this test, result is a Try<double>.Exception because the division\
    \ by zero failed. We assert that the result is of the correct type.\n"
