    \ a monad provides a way to combine these nested elevations into a single elevation\
    \ (IEnumerable<T> or Task<T>), making it easier to work with.\n\nTo be a monad,\
    \ a type needs to support two operations:\n\n- Return (also known as pure or unit):\
    \ A function that takes a regular value and elevates it into the monad's context\
    \ (for example, Task.FromResult in C# or Just in Haskell's Maybe monad).\n\n```csharp\n\
    public static Functor<T> Return<T>(T x)\n```\n"
