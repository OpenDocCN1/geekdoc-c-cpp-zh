    # Exceptional<T>


    In functional programming, we strive to represent computations that can fail,
    or throw exceptions, in a way that is composable, and thus, maintainable. To that
    end, we introduce a type Exceptional<T>, which represents a computation that can
    either succeed with a result of type T, or fail with an exception.


    Exceptional<T> is a struct that contains either a value of type T or an Exception.
    This allows us to encapsulate computations that can throw exceptions and handle
    them explicitly. This approach allows us to avoid catching exceptions at a distance,
    leading to code that is easier to reason about.'
