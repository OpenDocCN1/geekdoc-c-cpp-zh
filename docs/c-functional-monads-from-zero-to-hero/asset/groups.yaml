    +   "Haskell Fundamentals" on Pluralsight. An excellent course to learn Haskell
    and get a more concrete understanding of functional programming.


    # Podcasts


    +   "Functional Geekery": A podcast on functional programming, where software
    engineers discuss their journey into functional programming and share their insights.


    +   "LambdaCast": A podcast that aims to bridge the gap between the academic world
    of functional programming and the needs of industrial programmers.'
