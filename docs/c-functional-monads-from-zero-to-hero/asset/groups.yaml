    public static Monad<T> Return<T>(T value)\n```\n\nBind (or SelectMany in C#, FlatMap\
    \ in Scala, and >= in Haskell): This operation, known as binding, takes a container\
    \ of the monadic type and a function that takes the plain type and returns a container\
    \ of the monadic type. It applies the function to the unwrapped value and returns\
    \ a new monadic container. If the function already returns a monadic value, Bind\
    \ ensures that we don't end up with a nested monadic but flattens it to a single-layer\
    \ monadic.\n\n```csharp\npublic static Monad<TResult> SelectMany<TSource, TResult>(\n\
    \    this Monad<TSource> monad,\n    Func<TSource, Monad<TResult>> function)\n\
    ```\n\nThese two operations, when implemented, give a type the monadic structure.\
    \ However, for a type to be a monad, it also needs to adhere to certain laws.\n\
    \n## Monad Laws\n\nMonad laws are axioms that every monad must satisfy. These\
    \ laws ensure that monads behave consistently and predictably. They are not enforced\
