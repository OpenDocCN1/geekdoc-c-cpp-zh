    public struct Exceptional<T>\n{\n    private readonly Exception? _exception;\n\
    \    private readonly T _value;\n\n    public bool IsSuccess { get; }\n    public\
    \ bool IsException => IsSuccess;\n\n    public Exceptional(Exception exception)\n\
    \    {\n        _exception = exception ?? throw new ArgumentNullException(nameof(exception));\n\
    \        _value = default!\n        IsSuccess = false;\n    }\n\n    public Exceptional(T\
    \ value)\n    {\n        _value = value ?? throw new ArgumentNullException(nameof(value));\n\
    \        _exception = null;\n        IsSuccess = true;\n    }\n\n    public static\
    \ implicit operator Exceptional<T>(Exception ex) => new Exceptional<T>(ex);\n\
    \    public static implicit operator Exceptional<T>(T value) => new Exceptional<T>(value);\n\
    ```"
  - "[PAGE 56]\n\n```\npublic Exceptional<TResult> Apply<TResult>(ExceptionalFunc<T,\
    \ TResult>> exceptionalFunc\n{\n    return exceptionalFunc.Success ? Map(exceptionalFunc_value!)\
    \ : new Exceptional<TResult>(exceptionalFunc_exception!);\n}\n\npublic Exceptional<TResult>\
    \ Map<TResult>(Func<T, TResult> map)\n{\n    return IsException ? new Exceptional<TResult>(_exception!)\
    \ : new Exceptional<TResult>(map(_value));\n}\n\npublic Exceptional<TResult> Bind<TResult>(Func<T,\
    \ Exceptional<TResult>> bind)\n{\n    return IsException ? new Exceptional<TResult>(_exception!)\
    \ : bind(_value);\n}\n\npublic TResult Match<TResult>(Func<Exception, TResult>\
    \ Exception, Func<T, TResult> Success)\n=> IsException ? onException(_exception!)\
    \ : onSuccess(_value);\n\n```\n\nHere, the Exceptional<T> struct is designed to\
    \ hold either a value of type T (indicating success) or an Exception (indicating\
    \ an exception was thrown). The boolean property IsSuccess tells us which one\
    \ it is.\n\nTwo implicit conversion operators are provided to easily create instances\
    \ of Exceptional<T> from either an Exception or T.\n\nThe Match method is used\
    \ to extract the value from an Exceptional<T>. It takes two functions as arguments,\
    \ to handle the case where the Exceptional<T> contains a T and another to handle\
    \ the case where it contains an Exception. This forces explicit handling of cases."
- md: "\nWe also have a series of extension methods on Exceptional<T> to allow chaining\
    \ operations in a fluent manner. These include Apply, Map, and Bind functions,\
    \ and their respective overloads.\n\nThe Apply function applies a function that's\
    \ wrapped in an Exceptional<T> to another Exceptional<T>, returning a new Exceptional<T>.\n\
    \nThe Map function applies a function to the value inside the Exceptional<T>,\
    \ if it exists, and wraps the result back into an Exceptional<T>.\n\nThe Bind\
    \ function is similar to Map, but the function given as an argument returns an\
    \ Exceptional<T>, allowing for chaining of operations that return Exceptional<T>.\n\
    \nIn addition, we provide Select and SelectMany methods to support LINQ query\
    \ syntax. This is a powerful feature in C#, allowing Exceptional<T> to integrate\
    \ seamlessly with existing .NET codebases.\n\nNow, let's illustrate the use of\
    \ Exceptional<T> with an example.\n\n## Sample Usage of Exceptional<T>\n\n```\n\
    Exceptional<int> Divide(int x, int y)\n{\n    try\n    {\n        return x / y;\n\
    \    }\n    catch(DivideByZeroException ex)\n    {\n        return ex;\n    }\n\
    }\n```\n\nThis function returns an Exceptional<int> that encapsulates the result\
    \ of the division operation. If the division is successful, it returns the result\
    \ wrapped in an Exceptional<T>. If a DivideByZeroException is thrown, it captures\
    \ the exception and returns it wrapped in an Exceptional<T>.\n\nLet's see how\
    \ we can use this function and handle the result.\n\n```\nvoid DisplayResult(Exceptional<int>\
    \ result)\n{\n  result.Match(\n    Success: value => Console.WriteLine($\"Result:\
    \ {value}\"),\n    Exception: ex => Console.WriteLine($\"An error occurred: {ex.Message}\"\
    )\n  );\n}\n\n// Usage\n\nvar result = Divide(10, 2);\n\nDisplayResult(result);\
    \ // Outputs: \"Result: 5\"\n\nresult = Divide(10, 0);\n\nDisplayResult(result);\
    \ // Outputs: \"An error occurred: Attempted to divide by zero.\"\n```\n\nIn the\
    \ DisplayResult function, we use the Match method to explicitly handle both possible\
    \ outcomes of the Divide function. This makes it clear at the point of use that\
    \ the division operation can fail, and requires that we handle the failure.\n\n\
    Now let's see how we can use the Map and Bind functions.\n\n```c\n// Squares the\
    \ result if the division was successful\nvar squareResult = result.Map(value =>\
    \ value * value);\n```\n\n```c\n// Tries to perform another division operation\
    \ on the result if the first one was successful\nvar chainedResult = result.Bind(value\
    \ => Divide(value, 2));\n```\n\nIn the first example, we use Map to square the\
    \ result of the division operation. The squaring operation is only performed if\
    \ the division was successful. If an exception occurred, Map does nothing and\
    \ the exception is preserved.\n\nIn the second example, we use Bind to perform\
    \ another division operation on the result of the first one. The second division\
    \ is only performed if the first one was successful. If an exception occurred\
    \ in the first division, Bind does nothing and the exception is preserved.\n\n\
    The power of Exceptional<T> becomes evident when we want to chain multiple operations\
    \ that can throw exceptions. By encapsulating exceptions in Exceptional<T>, we\
    \ can easily chain operations and handle exceptions in a clear and concise way.\n\
    \n## Task\n\nAsynchronous programming is a critical aspect of modern application\
    \ development, particularly in I/O-bound operations where responsiveness is key.\
    \ In .NET, the Task<T> type is the primary tool for managing these operations.\
    \ Task<T> is a monadic type, providing powerful methods for chaining and transforming\
    \ asynchronous computations. Let's delve into the monadic operations of Task<T>\
    \ and illustrate their usage with examples.\n\n```csharp\npublic static class\
    \ TaskExtensions\n{\n    // Map\npublic static Task<TResult> Map<TSource, TResult>(\n\
    \    this Task<TSource> task,\n    Func<TSource, TResult> projection)\n{\n   \
    \ return task.ContinueWith(t => projection(t.Result));\n}\n```\n\nThe Map function\
    \ applies a projection to the result of a task. It's useful when you want to transform\
    \ the result of an asynchronous computation. For example, if you have a Task<int>\
    \ representing an asynchronous operation that counts items, you could use Map\
    \ to transform the count into a string.\n\nNext, let's implement Bind:\n\n```csharp\n\
    // Bind\npublic static Task<TResult> Bind<TSource, TResult>(\n    this Task<TSource>\
    \ task,\n    Func<TSource, Task<TResult>> projection)\n{\n    return task.ContinueWith(t\
    \ => projection(t.Result)).Unwrap();\n}\n```\n\nThe Bind function allows us to\
    \ chain asynchronous operations together. It takes a function that returns a task\
    \ and applies it to the result of a previous task. The call to Unwrap is necessary\
    \ because without it, we would end up with Task<Task<TResult>>. Unwrap flattens\
    \ this into Task<TResult>.\n\nThe next function is GetOrElse:\n\n```csharp\n//\
    \ GetOrElse\npublic static Task<T> GetOrElse<T>(\n    this Task<T> task,\n   \
    \ T defaultValue)\n{\n    return task.ContinueWith(t => t.IsFaulted ? defaultValue\
    \ : t.Result);\n}\n```\n\nGetOrElse provides a default value if the task fails.\
    \ It's a way of handling errors that allows the rest of your code to remain oblivious\
    \ to failure. If the task completes successfully, GetOrElse passes through the\
    \ result. If the task faults (throws an exception), GetOrElse returns the default\
    \ value instead.\n\nFinally, we have Recover:\n\n```csharp\n// Recover\npublic\
    \ static Task<T> Recover<T>(\n    this Task<T> task,\n    Func<Exception, T> recoverFunc)\n\
    {\n    return task.ContinueWith(t => t.IsFaulted ? recoverFunc(t.Exception) :\
    \ t.Result);\n}\n```\n\nRecover allows us to handle exceptions and recover from\
    \ them. If a task throws an exception, Recover passes it to the recovery function.\n\
    \nLet's continue by implementing Select, SelectMany, Join, and Where methods:\n\
    \n```csharp\n// Select\npublic static Task<TResult> Select<TSource, TResult>(\n\
    \    this Task<TSource> task,\n    Func<TSource, TResult> selector)\n{\n    return\
    \ task.Map(selector);\n}\n```\n\n```csharp\n// SelectMany\npublic static Task<TResult>\
    \ SelectMany<TSource, TResult>(\n    this Task<TSource> task,\n    Func<TSource,\
    \ Task<TResult>> selector)\n{\n    return task.Bind(selector);\n}\n```\n\n```csharp\n\
    // Where\npublic static Task<TSource> Where<TSource>(\n    this Task<TSource>\
    \ task,\n    Func<TSource, bool> predicate)\n{\n    return task.Map(value =>\n\
    \    {\n        if (predicate(value)) return value;\n        throw new Exception(\"\
    Predicate does not hold\");\n    });\n}\n```\n\nHere's how each of these work:\n\
    \n- Select: This is essentially the same as Map. It's named Select to align with\
    \ LINQ.\n- SelectMany: Similarly, SelectMany is just another name for Bind. Again,\
    \ this is to make it consistent with LINQ.\n- Where: This function allows us to\
    \ filter the result of a task based on a predicate. If the predicate doesn't hold,\
    \ it will throw an exception.\n\n```csharp\n// Join\npublic static Task<TResult>\
    \ Join<TOuter, Tinner, TKey, TResult>(\n    Task<TOuter> outer,\n    Task<Tinner>\
    \ inner,\n    Func<TOuter, TKey, object> outerKey,\n    Func<Tinner, TKey, object>\
    \ innerKey,\n    Func<TOuter, Tinner, TResult> resultSelector)\n{\n    return\
    \ outer.ContinueWith(o =>\n        {\n            return inner.ContinueWith(i\
    \ =>\n            {\n                if (outerKey(o.Result).Equals(innerKey(i.Result)))\n\
    \                {\n                    return resultSelector(o.Result, i.Result);\n\
    \                }\n                throw new Exception(\"Keys do not match\"\
    );\n            }).Result;\n        }).Result;\n}\n```\n\nIn this version of Join,\
    \ both outer and inner tasks must complete and their keys (as provided by outerKey\
    \ and innerKey) must match. If they do, Join will combine the results using resultSelector.\n"
  mdcn: "\n我们还为 `Exceptional<T>` 提供了一系列扩展方法，允许以流式方式链式操作。这些包括 Apply、Map 和 Bind 函数以及各自的重载。\n\
    \n`Apply` 函数将封装在 `Exceptional<T>` 中的函数应用到另一个 `Exceptional<T>`，返回一个新的 `Exceptional<T>`。\n\
    \n`Map` 函数将函数应用到 `Exceptional<T>` 内部的值（如果存在），并将结果重新封装回 `Except<T>`。\n\n`Bind`\
    \ 函数与 `Map` 类似，但作为参数传递的函数返回 `Exceptional<T>`，允许对返回 `Exceptional<T>` 的操作进行链式。\n\
    \n此外，我们提供了 `Select` 和 `SelectMany` 方法来支持 LINQ 查询语法。这是 C# 中的一项强大功能，允许 `Exceptional<T>`\
    \ 与现有的 .NET 代码库无缝集成。\n\n现在，让我们通过一个示例来说明 `Exceptional<T>` 的用法。\n\n## Exceptional<T>\
    \ 的示例用法\n\n```\nExceptional<int> Divide(int x, int y)\n{\n    try\n    {\n   \
    \     return x / y\n    }\n    catch(DivideByZeroException ex)\n    {\n      \
    \  return ex;\n    }\n}\n```\n\n该函数返回一个 `Exceptional<int>`，它封装了除法操作的结果。如果除法成功，它返回封装在\
    \ `Exceptional<T>` 中的结果。如果抛出了 `DivideByZeroException`，它会捕获异常并将其封装在 `Exceptional<T>`\
    \ 中返回。\n\n让我们看看如何使用此函数并处理结果。\n\n```\nvoid DisplayResult(Exceptional<int> result)\n\
    {\n  result.Match(\n    Success: value => Console.WriteLine($\"Result: {value}\"\
    ),\n    Exception: ex => Console.WriteLine($\"An error occurred: {ex.Message}\"\
    )\n  );\n}\n\n// 使用\n\nvar result = Divide(10, 2);\n\nDisplayResult(result); //\
    \ 输出: \"Result: 5\"\n\nresult = Divide(10, 0);\n\nDisplayResult(result); // 输出:\
    \ \"An error occurred: Attempted to divide by zero.\"\n```\n\n在 `DisplayResult`\
    \ 函数中，我们使用 `Match` 方法来显式处理 `Divide` 函数的两种可能结果。这使得在使用点清晰地表明了除法操作可能会失败，并要求我们处理失败的情况。\n\
    \n现在，让我们看看如何使用 `Map` 和 `Bind` 函数。\n\n```csharp\n// 如果除法成功，则对结果进行平方\nvar squareResult\
    \ = result.Map(value => value * value);\n```\n\n```csharp\n// 如果第一个操作成功，则尝试对结果执行另一个除法操作\n\
    var chainedResult = result.Bind(value => Divide(value, 2));\n```\n\n在第一个示例中，我们使用\
    \ `Map` 对除法操作的结果进行平方。只有在除法成功时才会执行平方操作。如果发生异常，`Map` 将什么都不做且异常会被保留。\n\n在第二个示例中，我们使用\
    \ `Bind` 在第一个操作的结果上执行另一个除法操作。只有在第一次操作成功时才会执行第二次除法。如果第一次除法发生异常，`Bind` 将什么都不做且异常会被保留。\n\
    \n当我们想要链接多个可能会抛出异常的操作时，`Exceptional<T>` 的威力就变得尤为显易。通过在 `Exceptional<T>` 中封装异常，我们可以轻松地链式操作并以清晰简洁的方式处理异常。\n\
    \n## 任务\n\n异步编程是现代应用开发的一个关键方面，特别是在响应性是的 I/O 密集操作中。在 .NET 中，`Task<T>` 类型是管理这些操作的主要工具。`Task<T>`\
    \ 是一个单子类型，为链接和转换异步计算提供了强大的方法。让我们深入研究 `Task<T>` 的单子操作，并通过示例说明其用法。\n\n```csharp\n\
    public static class TaskExtensions\n{\n    // Map\npublic static Task<TResult>\
    \ Map<TSource, TResult>(\n    this Task<TSource> task,\n    Func<TSource, TResult>\
    \ projection)\n{\n    return task.ContinueWith(t => projection(t.Result));\n}\n\
    ```\n\n`Map` 函数将投影应用到任务的结果。当你想要转换异步计算的结果时，它非常有用。例如，如果你有一个代表计数项目数的异步操作的 `Task<int>`，你可以使用\
    \ `Map` 将计数转换为字符串。\n\n接下来，让我们实现 `Bind`：\n\n```csharp\n// Bind\npublic static Task<TResult>\
    \ Bind<TSource, TResult>(\n    this Task<TSource> task,\n    Func<TSource, Task<TResult>>\
    \ projection)\n{\n    return task.ContinueWith(t => projection(t.Result)).Unwrap();\n\
    }\n```\n\n`Bind` 函数允许我们将异步操作链在一起。它接受一个返回任务的函数，并将其应用于上一个任务的结果。调用 `Unwrap` 是必要的，因为没有它，我们将得到\
    \ `Task<Task<TResult>>`。`Unwrap` 将其展平为 `Task<TResult>`。\n\n下一个函数是 `GetOrElse`：\n\
    \n```csharp\n// GetOrElse\npublic static Task<T> GetOrElse<T>(\n    this Task<T>\
    \ task,\n    T defaultValue)\n{\n    return task.ContinueWith(t => t.IsFaulted\
    \ ? defaultValue : t.Result);\n}\n```\n\n`GetOrElse` 在任务失败时提供默认值。这是处理错误的方法，允许你的代码的其他部分忽略忽略失败。如果任务成功完成，`GetOrElse`\
    \ 会传递结果。如果任务故障（抛出异常），`GetOrElse` 则返回默认值。\n\n最后，我们有 `Recover`：\n\n```csharp\n//\
    \ Recover\npublic static Task<T> Recover<T>(\n    this Task<T> task,\n    Func<Exception,\
    \ T> recoverFunc)\n{\n    return task.ContinueWith(t => t.IsFaulted ? recoverFunc(t.Exception)\
    \ : t.Result);\n}\n```\n\n`Recover` 允许我们处理并从中恢复异常。如果任务抛出异常，它将其传递给恢复函数。\n\n让我们通过实现\
    \ `Select`、`SelectMany`、`Join` 和 `Where` 方法继续：\n\n```csharp\n// Select\npublic\
    \ static Task<TResult> Select<TSource, TResult>(\n    this Task<TSource> task,\n\
    \    Func<TSource, TResult> selector)\n{\n    return task.Map(selector);\n}\n\
    ```\n\n```csharp\n// SelectMany\npublic static Task<TResult> SelectMany<TSource,\
    \ TResult>(\n    this Task<TSource> task,\n    Func<TSource, Task<TResult>> selector)\n\
    {\n    return task.Bind(selector);\n}\n```\n\n```csharp\n// Where\npublic static\
    \ Task<TSource> Where<TSource>(\n    this Task<TSource> task,\n    Func<TSource,\
    \ bool> predicate)\n{\n    return task.Map(value =>\n    {\n        if (predicate(value))\
    \ return value;\n        throw new Exception(\"Predicate does not hold\");\n \
    \   });\n}\n```\n\n以下是这些方法的原理：\n\n- `Select`：本质与 `Map` 相同。命名为 `Select` 是为了与 LINQ\
    \ 一致。\n- `SelectMany`：同样，`SelectMany` 是 `Bind` 的另一个名称。这也是为了符合 LINQ。\n- `Where`：此函数允许我们根据谓词过滤任务的结果。如果谓词无效，它将抛出异常。\n\
    \n```csharp\n// Join\npublic static Task<TResult> Join<TOuter, Tinner, TKey, TResult>(\n\
    \    Task<TOuter> outer,\n    Task<Tinner> inner,\n    Func<TOuter, TKey, object>\
    \ outerKey,\n    Func<Tinner, TKey, object> innerKey,\n    Func<TOuter, Tinner,\
    \ TResult> resultSelector)\n{\n    return outer.ContinueWith(o =>\n        {\n\
    \            return inner.ContinueWith(i =>\n            {\n                if\
    \ (outerKey(o.Result).Equals(innerKey(i.Result)))\n                {\n       \
    \             return resultSelector(o.Result, i.Result);\n                }\n\
    \                throw new Exception(\"Keys do not match\");\n            }).Result;\n\
    \        }).Result;\n}\n```\n\n在这个版本的 `Join` 中，外部和内部任务都必须完成，并且它们的键（由 `outerKey`\
    \ 和 `innerKey` 提供）必须匹配。如果匹配，`Join` 将使用 `resultSelector` 组合结果。\n"
