    \ the Maybe<int> object. If any step in this chain fails and results in None,\
    \ GetOrElse will return the default value we provided, which is 0.\n\nThese examples\
    \ demonstrate how Map, Bind, and GetOrElse can be used to safely handle operations\
    \ that may or may not produce a value, and how they can be used to chain operations\
    \ in a clean and readable manner.\n\n# Either<L, R>\n\nThe Either monad represents\
    \ a computation that may result in one of two types. We often use it to represent\
