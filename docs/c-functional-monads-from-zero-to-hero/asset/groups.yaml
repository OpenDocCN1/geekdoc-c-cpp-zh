    # 序言


    欢迎阅读《C# 函数式编程：从零到精通 Monads》。本简洁指南旨在快速提升你对使用 C# 和 .NET 8 进行函数式编程中 monads 的理解和应用。


    Monad 的概念源自函数式编程，对于许多开发者来说一直是一个难以掌握的概念。然而，它们是程序员工具箱中强大且表现力的工具。本书旨在揭开 monads 的神秘面，并说明它们在你日常编码任务中的实用性和用处。


    在快速发展的软件开发领域，C# 和 .NET 框架的最新更新带来了范式转变，使得函数式编程比以往任何时候都更加流行。函数式范式允许开发者编写更可预测、可测试且易调试的代码。我们将深入探讨
    C# 和 .NET 8 的特性如何完美适配函数式编程，特别是 monads。


    本书的设计初衷是简洁，旨在作为指南而非详尽的参考书。我们的目标是提供你所需的的核心理解和技能。无论你是寻求加深理解的专业 C# 开发者，还是对 monads
    感奇的计算机科学学生，这本书都有你需要的。


    那么，让我们开启这段在 C# 和 .NET 8 中精通 monads 的精彩旅程。


    编码愉快！


    Carlos Bueno


