    +   Carlos Bueno''s Blog: As the author of "Functional C#: Embracing Functional
    Programming in a C# World",


    +   Carlos Bueno regularly explores functional programming concepts in C#.


    +   "Monads" by Mark Seemann. A multi-part blog series exploring the concept of
    monads in depth. Available at


