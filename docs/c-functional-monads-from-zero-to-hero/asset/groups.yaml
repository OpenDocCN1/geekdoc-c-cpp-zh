- md: "\n# Example 2: Using Bind (or SelectMany in LINQ)\n\n```c\nTask<int> task =\
    \ Task.FromResult(5);\n```\n\n```c\nTask<int> bindTask = task.Bind(x => Task.FromResult(x\
    \ * x));\n```\n\n```c\nConsole.WriteLine(await bindTask); // Output: 25\n```\n\
    \nIn this example, instead of a simple transformation of the result, we use Bind\
    \ to create a new task based on the result of the first task.\n\n# Example 3:\
    \ Using OrElse to Recover\n\n```c\nTask<int> task = Task.FromException<int>(new\
    \ Exception(\"Error!\"));\n```\n\n```c\nTask<int> recoveredTask = task.OrElse(Task.FromResult(0));\n\
    ```\n\n```c\nConsole.WriteLine(await recoveredTask); // Output: 0\n```\n\nIn this\
    \ case, we create a faulted task that immediately throws an exception. Using OrElse,\
    \ we can recover from the error and provide a fallback task that completes with\
    \ the result 0.\n\n# Example 4: Using Where\n\n```c\nTask<int> task = Task.FromResult(5);\n\
    ```\n\n```csharp\nTask<int> filteredTask = task.Where(x => x > 10);\n```\n\n```csharp\n\
    try\n{\n    Console.WriteLine(await filteredTask);\n}\ncatch (Exception e)\n{\n\
    \    Console.WriteLine(e.Message); // Output: Predicate does not hold\n}\n```\n\
    \nHere, we apply a filter to the task result. Since 5 is not greater than 10,\
    \ an exception is thrown when we attempt to await the result of the task.\n\n\
    # Example 5: Using Join\n\n```csharp\nTask<int> outer = Task.FromResult(5);\n\
    Task<int> inner = Task.FromResult(10);\nTask<int> joinedTask = outer.Join(inner,\
    \ o => o, i => i * 0.5, (o, i) => o + i);\ntry\n{\n  Console.WriteLine(await joinedTask);\n\
    } catch (Exception e)\n{\n  Console.WriteLine(e.Message); // Output: Keys do not\
    \ match\n}\n```\n\nIn this example, we attempt to join two tasks based on a key.\
    \ However, the keys don't match, so an exception is thrown.\nIf the keys did match,\
    \ the Join function would combine the results of both tasks using the provided\
    \ result selector function.\n\nBy using these monadic operations, we can build\
    \ complex pipelines of asynchronous operations in a clean and readable way. This\
    \ makes error handling and control flow easier to manage in asynchronous and concurrent\
    \ scenarios.\n\n# Conclusion\n\nThe concepts and code shared in this chapter are\
