    \ defines two operations: Return and Bind (also known as SelectMany in C# or >>=\
    \ in Haskell).\n\n> Return (also known as pure or unit): This operation takes\
    \ a value from a plain type and puts it into a container of the monadic type.\
    \ The name Return can be a bit misleading, especially for those coming from an\
    \ object-oriented background where return is used to denote the output of a function.\
    \ In the context of monads, Return doesn't signify the end of computation, but\
