    \ is much more to explore and understand in functional programming. As you continue\
    \ your journey, always remember the goal is not to write code that is clever or\
    \ tricky, but to write code that is clear, understandable, and maintainable.\n\
    \nIn the end, it's all about improving as a software craftsman and delivering\
    \ quality software. I hope this chapter has given you the tools and understanding\
    \ to do just that with monads in .NET 8 and C#.\n\n# Chapter 7: Practical Examples\
    \ - Real-world Scenarios of Using Your Own Monad Library with .NET 8 and C#\n\n\
    ![](img/c0b8b96a0157eda20d597ec50a87edc6_68_0.png)\n\nIn this chapter, we will\
    \ delve into a real-world example of how the monads we've created in the previous\
    \ chapters (Maybe<T>, Either<L, R>, Validation<T>, Try<T>, Exceptional<T>, Task<T>)\
    \ can be used in a practical .NET application. We'll be creating a simple bank\
    \ loan approval system, which will demonstrate the power of these monads in handling\
    \ complex business logic, error handling, and asynchronous operations. We're going\
    \ to use a minimal API approach.\n\nThe minimal API approach emphasizes the simplicity\
    \ and productivity in developing APIs. It provides a lightweight, low-ceremony\
    \ way to build HTTP APIs with ASP.NET Core, and reduces the amount of boilerplate\
    \ code, making your codebase cleaner and more manageable.\n\n# Scenario\n\nOur\
    \ client, Let's Lend Bank, wants to develop a loan approval system. The system\
    \ will have the following requirements:\n\n- **Validate loan requests:** Each\
    \ loan request must be validated. The request must have a valid customer ID, a\
    \ positive loan amount, and a term between 1 to 30 years.\n\n- **Check customer's\
    \ credit score:** The credit score of the customer must be fetched from an external\
    \ service. If the service fails or returns an error, the loan approval process\
    \ should fail.\n\n- **Check customer's loan history:** The customer's loan history\
    \ must also be fetched from another external service. Again, if the service fails\
    \ or returns an error, the loan approval process should fail.\n\n- **Calculate\
    \ loan approval:** If all the previous steps are successful, the system should\
    \ calculate whether the loan should be approved or not based on the credit score,\
    \ loan history, loan amount, and term. If the loan is approved, the system should\
    \ return the approved loan amount, term, and interest rate. If not, it should\
    \ return a reason for the rejection.\n\nThe system should be implemented as an\
    \ HTTP API using the new .NET 8 minimal API approach.\n\n# Building the Application\n\
    \nLet's start by defining the basic models for our system.\n\n```csharp\npublic\
    \ class LoanRequest\n{\n    public int CustomerId { get; set; }\n    public decimal\
    \ LoanAmount { get; set; }\n    public int LoanTerm { get; set; } // In years\n\
    }\n```\n\n```csharp\npublic class LoanApproval\n{\n    public int CustomerId {\
    \ get; set; }\n    public decimal ApprovedAmount { get; set; }\n    public int\
    \ LoanTerm { get; set; } // In years\n    public decimal InterestRate { get; set;\
    \ } // As a percentage\n    public string ApprovalStatus { get; set; }\n}\n```\n\
    \n```csharp\npublic class CreditScore\n{\n    public int CustomerId { get; set;\
    \ }\n    public int Score { get; set; }\n}\n```\n\n```csharp\npublic class LoanHistory\n\
    {\n    public int CustomerId { get; set; }\n    public int NumberOfDefaults {\
    \ get; set; }\n    public int NumberOfPaidLoans { get; set; }\n}\n```\n\nNow let's\
    \ define the service interfaces that will handle the credit score and loan history.\n\
    \n```csharp\npublic interface ICreditScoresService\n{\n    Task<Either<string,\
    \ CreditScore>> GetCreditScore(int customerId);\n}\n```\n\n```csharp\npublic interface\
    \ ILoanHistoryService\n{\n    Task<Either<string, LoanHistory>> GetLoanHistory(int\
    \ customerId);\n}\n```\n\nICreditScoresService.GetCreditScore and ILoanHistoryService.GetLoanHistory\
    \ return Task<Either<string, T>> which means they perform an asynchronous operation\
    \ that can either result in a string error or a successful value of T.\n\nLet's\
    \ implement these services:\n\n```csharp\npublic class CreditScoreService : ICreditScoresService\n\
    {\n    public async Task<Either<string, CreditScore>> GetCreditScore(int customerId)\n\
    \    {\n        // Simulate an asynchronous operation with a delay\n        await\
    \ Task.Delay(1000);\n\n        // For simplicity, we'll return a random score\
    \ for each customer\n        var rng = new Random();\n        if (rng.Next(0,\
    \ 100) < 80)\n        {\n            return new CreditScore { CustomerId = customerId,\
    \ Score = rng.Next(300, 850) };\n        }\n        else\n        {\n        \
    \    // 20% of the time, simulate a failure\n            return \"Failed to fetch\
    \ credit score\";\n        }\n    }\n}\n```\n\n```csharp\npublic class LoanHistoryService\
    \ : ILoanHistoryService\n{\n    public async Task<Either<string, LoanHistory>>\
    \ GetLoanHistory(int customerId)\n    {\n        // Simulate an asynchronous operation\
    \ with a delay\n        await Task.Delay(1000);\n\n        // For simplicity,\
    \ we'll return a random history for each customer\n        var rng = new Random();\n\
    \        if (rng.Next(0, 100) < 80)\n        {\n            return new LoanHistory{\n\
    \                CustomerId = customerId,\n                NumberOfDefaults =\
    \ rng.Next(0, 5),\n                NumberOfPaidLoans = rng.Next(0, 20)\n     \
    \       };\n        }\n        else\n        {\n            // 20% of the time,\
    \ simulate a failure\n            return \"Failed to fetch loan history\";\n \
    \       }\n    }\n}\n```\n"
  mdcn: "\n\n# 示例 2：使用 Bind (或 LINQ 中的 SelectMany)\n\n```csharp\nTask<int> task =\
    \ Task.FromResult(5);\n```\n\n```csharp\nTask<int> bindTask = task.Bind(x => Task.FromResult(x\
    \ * x));\n```\n\n```csharp\nConsole.WriteLine(await bindTask); // 输出: 25\n```\n\
    \n在这个示例中，我们不是对结果进行简单的转换，而是使用 `Bind` 根据第一个任务的结果创建一个新任务。\n\n# 示例 3：使用 OrElse 进行恢复\n\
    \n```csharp\nTask<int> task = Task.FromException<int>(new Exception(\"Error!\"\
    ));\n```\n\n```csharp\nTask<int> recoveredTask = task.OrElse(Task.FromResult(0));\n\
    ```\n\n```csharp\nConsole.WriteLine(await recoveredTask); // 输出: 0\n```\n\n在这种情况下，我们创建了一个立即抛出异常的故障任务。使用\
    \ `OrElse`，我们可以从错误中恢复并提供一个以结果 0 完成的备用任务。\n\n# 示例 4：使用 Where\n\n```csharp\nTask<int>\
    \ task = Task.FromResult(5);\n```\n\n```csharp\nTask<int> filteredTask = task.Where(x\
    \ => x > 10);\n```\n\n```csharp\ntry\n{\n    Console.WriteLine(await filteredTask);\n\
    }\ncatch (Exception e)\n{\n    Console.WriteLine(e.Message); // 输出: Predicate\
    \ does not hold\n}\n```\n\n在这里，我们对任务结果应用了过滤器。由于 5 并不大于 10，当我们尝试等待任务的结果时，会抛出一个异常。\n\
    \n# 示例 5：使用 Join\n\n```csharp\nTask<int> outer = Task.FromResult(5);\nTask<int>\
    \ inner = Task.FromResult(10);\nTask<int> joinedTask = outer.Join(inner, o =>\
    \ o, i => i * 0.5, (o, i) => o + i);\ntry\n{\n  Console.WriteLine(await joinedTask);\n\
    } catch (Exception e)\n{\n  Console.WriteLine(e.Message); // 输出: Keys do not match\n\
    }\n```\n\n在这个示例中，我们尝试根据键连接两个任务。然而，由于键不匹配，因此抛出了异常。\n如果键匹配，`Join` 函数将使用提供的结果选择器函数合并两个任务的结果。\n\
    \n通过使用这些单子操作（monadic operations），我们可以以简洁且可读的方式构建复杂的异步操作流水线。这使得在异步和并发场景下的错误处理和控制流更容易管理。\n\
    \n# 结论\n\n在本章分享的概念和代码是在 .NET 8 中使用 C# 构建你自己的单数结构的起点。这段单数世界之旅才刚刚开始，我希望它能激发你对函数式编程的奇心和兴趣。\n\
    \n我们深入探讨了理论，然后将其带回 C# 的实践领域，探索了如何利用单数的力量来编写更整洁、更易维护且抗错误的代码。我们探索了几个示例，例如 `Maybe<T>`、`Exceptional<T>`、`Validation<T>`、`Try<T>`、`Either<T>`\
    \ 和 `Task<T>`，每个示例都提供了处理控制流、错误处理和数据转换的不同方法。\n\n记住，函数式编程和单数的使用并不是非黑即白的命题。你可以逐渐将这些概念引入到现有的项目中，并随着时间的推移看到其益处。\n\
    \n本章是一个脚石，在函数式编程中还有许多可以探索和理解的内容。当你继续你的旅程时，始终记住，目标不是编写巧妙或复杂的代码，而是编写清晰、易懂且可维护的代码。\n\
    \n归结底，这一切都关乎作为软件工匠的进步以及交付高质量软件。我希望本章为你提供了在 .NET 8 和 C# 中通过单数做到这些点的工具和理解。\n\n#\
    \ 第 7 章：实例 - .NET 8 和 C# 中自定义单数库的真实场景\n\n![](img/c0b8b96a0157eda20d597ec50a87edc6_68_0.png)\n\
    \n在本章中，我们将深入探讨在之前的章节中创建的单数（`Maybe<T>`、`Either<L, R>`、`Validation<T>`、`Try<T>`、`Exceptional<T>`、`Task<T>`）如何在实际的\
    \ .NET 应用程序中使用的。我们将创建一个简单的银行贷款审批系统，它将展示这些单数在处理复杂业务逻辑、错误处理和异步操作方面的强大之处。我们将使用最小\
    \ API（minimal API）方法。\n\n最小 API 方法强调了开发 API 的简单性和生产力。它提供了一种轻量级、低仪式的方式使用 ASP.NET\
    \ Core 构建 HTTP API，并减少了样板代码，使你的代码库更加整洁易于管理。\n\n# 场景\n\n我们的客户 Let's Lend Bank 希望开发一个贷款审批系统。该系统将具有以下要求：\n\
    \n- **验证贷款请求：** 每个贷款请求都必须经过验证。请求必须具有有效的客户 ID、正的贷款金额以及 1 到 30 年之间的期限。\n\n- **检查客户信用评分：**\
    \ 必须从外部服务获取客户的信用评分。如果服务失败或返回错误，贷款审批过程应该失败。\n\n- **检查客户贷款历史：** 客户的贷款历史也从另一个外部服务获取。同样，如果服务失败或返回错误，贷款审批过程应该失败。\n\
    \n- **计算贷款审批：** 如果所有之前的步骤都成功，则将计算是否批准贷款。\n\n# 构建应用程序\n\n让我们开始定义系统的基础模型。\n\n```csharp\n\
    public class LoanRequest\n{\n    public int CustomerId { get; set; }\n    public\
    \ decimal Amount { get; set; }\n    public int TermYears { get; set; }\n}\n\n\
    public class CreditScore\n{\n    public int CustomerId { get; set; }\n    public\
    \ int Score { get; set; }\n}\n\npublic class LoanHistory\n{\n    public int CustomerId\
    \ { get; set; }\n    public int NumberOfDefaults { get; set; }\n    public int\
    \ NumberOfPaidLoans { get; set; }\n}\n\npublic class LoanApproval\n{\n    public\
    \ bool IsApproved { get; set; }\n    public decimal InterestRate { get; set; }\n\
    \    public string Reason { get; set; }\n}\n```\n\n现在让我们定义处理信用评分和贷款历史的接口。\n\n\
    ```csharp\npublic interface ICreditScoresService\n{\n    Task<Either<string, CreditScore>>\
    \ GetCreditScore(int customerId);\n}\n\npublic interface ILoanHistoryService\n\
    {\n    Task<Either<string, LoanHistory>> GetLoanHistory(int customerId);\n}\n\
    ```\n\n实现这些服务：\n\n```csharp\npublic class CreditScoreService : ICreditScoresService\n\
    {\n    public async Task<Either<string, CreditScore>> GetCreditScore(int customerId)\n\
    \    {\n        // 模拟异步操作的延迟\n        await Task.Delay(1000);\n\n        // 为了简单起见，我们为每个客户返回随机评分\n\
    \        var rng = new Random();\n        if (rng.Next(0, 100) < 80)\n       \
    \ {\n            return new CreditScore { CustomerId = customerId, Score = rng.Next(300,\
    \ 850) };\n        }\n        else\n        {\n            // 20% 的概率模拟失败\n  \
    \          return \"Failed to fetch credit score\";\n        }\n    }\n}\n\npublic\
    \ class LoanHistoryService : ILoanHistoryService\n{\n    public async Task<Either<string,\
    \ LoanHistory>> GetLoanHistory(int customerId)\n    {\n        // 模拟异步操作的延迟\n\
    \        await Task.Delay(1000);\n\n        // 为了简单起见，我们为每个客户返回随机历史记录\n      \
    \  var rng = new Random();\n        if (rng.Next(0, 100) < 80)\n        {\n  \
    \          return new LoanHistory{\n                CustomerId = customerId,\n\
    \                NumberOfDefaults = rng.Next(0, 5),\n                NumberOfPaidLoans\
    \ = rng.Next(0, 20)\n            };\n        }\n        else\n        {\n    \
    \        // 20% 的概率模拟失败\n            return \"Failed to fetch loan history\";\n\
    \        }\n    }\n}\n```\n\n我们将使用 .NET 8 的最小 API 方式来实现。\n\n```csharp\nvar builder\
    \ = WebApplication.CreateBuilder(args);\nbuilder.Services.AddScoped<ICreditScoresService,\
    \ CreditScoreService>();\nbuilder.Services.AddScoped<ILoanHistoryService, LoanHistoryService>();\n\
    var app = builder.Build();\n\napp.MapPost(\"/approve\", async (LoanRequest request,\
    \ ICreditScoresService creditService, ILoanHistoryService historyService) =>\n\
    {\n    // 1. 验证请求\n    if (request.CustomerId <= 0 || request.Amount <= 0 || request.TermYears\
    \ < 1 || request.TermYears > 30)\n    {\n        return Results.BadRequest(\"\
    Invalid loan request\");\n    }\n\n    // 2. 检查信用评分\n    var creditResult = await\
    \ creditService.GetCreditScore(request.CustomerId);\n    if (creditResult.IsLeft)\n\
    \    {\n        return Results.Problem(creditResult.Left);\n    }\n\n    // 3.\
    \ 检查贷款历史\n    var historyResult = await historyService.GetLoanHistory(request.CustomerId);\n\
    \    if (historyResult.IsLeft)\n    {\n        return Results.Problem(historyResult.Left);\n\
    \    }\n\n    // 4. 计算审批结果\n    var score = creditResult.Right;\n    var history\
    \ = historyResult.Right;\n\n    if (score.Score > 600 && history.NumberOfDefaults\
    \ == 0)\n    {\n        return Results.Ok(new LoanApproval {\n            IsApproved\
    \ = true,\n            InterestRate = 0.05m,\n            Reason = \"Approved\
    \ based on credit and history\"\n        });\n    }\n\n    return Results.Ok(new\
    \ LoanApproval {\n        IsApproved = false,\n        InterestRate = 0,\n   \
    \     Reason = \"Not approved due to credit score or history\"\n    });\n});\n\
    \napp.Run();\n```\n\n"
