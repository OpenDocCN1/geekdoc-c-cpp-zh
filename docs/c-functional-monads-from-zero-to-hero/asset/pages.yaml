  md: 'Monads are a foundational concept in functional programming, notably in languages
    such as Haskell, but they''re also found in C#, F#, and others. They''re often
    met with a sense of dread due to their abstract nature, but understanding them
    can significantly enrich your programming toolbox.


    What are Monads?


    Monad are containers that have value(s) and if you apply a function to that value(s)
    you get the same kind of container with the value(s) inside of it transformed.
    A type that possesses a defined Map/Select function qualifies as a functor. The
    Map function can be broadly described as follows:


    ```

    Map: (C<T>, (T -> R)) -> C<R>

    ```


    Map is a function that takes a generic container that wraps inner value of type
    T and a function f that transforms T to R and returns a container C<R> wrapping
    the value after applying f to the container''s inner value.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '![](img/c0b8b96a0157eda20d597ec50a87edc6_20_0.png)


    At their core, monads can be understood as a design pattern that allows the handling
    of additional operations or effects without changing the existing function signatures.
    They encapsulate these side-effects or additional operations in a way that maintains
    functional purity, avoiding the need for altering the function''s behavior or
    its interaction with other parts of the system.


    One popular analogy used to describe monads is the concept of an "elevated world".
    Imagine you have a set of functions that operate on simple types, but now you
    need to handle these types in an "elevated" or "enhanced" context.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'This could be dealing with asynchronous operations (Task<T> in C#), nullable
    types (Maybe<T> ), or lists of values (IEnumerable<T>).


    The idea of elevation gives rise to two fundamental problems:


    +   - How can we apply our regular functions in this elevated world?


    +   - How can we handle situations where we end up with an "elevation of an elevation"
    (like Task<Task<T>>) or IEnumerable<IEnumerable<T>> )


    Monads provide a solution to both of these problems.


    Firstly, monads have a mechanism (usually a method called Bind, SelectMany in
    C#, or >== operator in Haskell) to apply a function to the elevated value, commonly
    known as "binding". This allows us to use our regular functions to interact with
    the elevated values.


    Secondly, monads can handle nested elevations by "flattening" them. In other words,
    if you find yourself with an IEnumerable<IEnumerable<T>> or a Task<Task<T>>, a
    monad provides a way to combine these nested elevations into a single elevation
    (IEnumerable<T> or Task<T>), making it easier to work with.


    To be a monad, a type needs to support two operations:


    +   - Return (also known as pure or unit): A function that takes a regular value
    and elevates it into the monad''s context (for example, Task.FromResult in C#
    or Just in Haskell''s Maybe monad).


    ```

    public static Functor<T> Return<T>(T x)

    ```'
