  md: "We also have a series of extension methods on Exceptional<T> to allow chaining\
    \ operations in a fluent manner. These include Apply, Map, and Bind functions,\
    \ and their respective overloads.\n\nThe Apply function applies a function that's\
    \ wrapped in an Exceptional<T> to another Exceptional<T>, returning a new Exceptional<T>.\n\
    \nThe Map function applies a function to the value inside the Exceptional<T>,\
    \ if it exists, and wraps the result back into an Exceptional<T>.\n\nThe Bind\
    \ function is similar to Map, but the function given as an argument returns an\
    \ Exceptional<T>, allowing for chaining of operations that return Exceptional<T>.\n\
    \nIn addition, we provide Select and SelectMany methods to support LINQ query\
    \ syntax. This is a powerful feature in C#, allowing Exceptional<T> to integrate\
    \ seamlessly with existing .NET codebases.\n\nNow, let's illustrate the use of\
    \ Exceptional<T> with an example.\n\nSample Usage of Exceptional<T>\n\n```\nExceptional<int>\
    \ Divide(int x, int y)\n{\ntry\n{\n    return x / y;\n}\ncatch(DivideByZeroException\
    \ ex)\n{\n    return ex;\n}\n}}\n```"
