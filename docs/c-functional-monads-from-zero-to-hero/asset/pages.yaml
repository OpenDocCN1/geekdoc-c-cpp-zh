  md: "Now, let's look at the implementation of Exceptional<T> :\n\n```\npublic struct\
    \ Exceptional<T>\n{\n    private readonly Exception? _exception;\n    private\
    \ readonly T _value;\n\n    public bool IsSuccess { get; }\n    public bool IsException\
    \ => IsSuccess;\n\n    public Exceptional(Exception exception)\n    {\n      \
    \  _exception = exception ?? throw new ArgumentNullException(nameof(exception));\n\
    \        _value = default!\n        IsSuccess = false;\n    }\n\n    public Exceptional(T\
    \ value)\n    {\n        _value = value ?? throw new ArgumentNullException(nameof(value));\n\
    \        _exception = null;\n        IsSuccess = true;\n    }\n\n    public static\
    \ implicit operator Exceptional<T>(Exception ex) => new Exceptional<T>(ex);\n\
    \    public static implicit operator Exceptional<T>(T value) => new Exceptional<T>(value);\n\
    ```"
