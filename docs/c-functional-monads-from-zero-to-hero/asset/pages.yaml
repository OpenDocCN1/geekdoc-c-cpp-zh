    # Monad Structure and Properties


    When discussing monads, it''s important to understand their structure and the
    properties they must possess to be classified as a monad.


    # Monad Structure


    At a high level, a monad is a type that defines two operations: Return and Bind
    (also known as SelectMany in C# or >>= in Haskell).


    > Return (also known as pure or unit): This operation takes a value from a plain
    type and puts it into a container of the monadic type. The name Return can be
    a bit misleading, especially for those coming from an object-oriented background
    where return is used to denote the output of a function. In the context of'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'monads, Return doesn''t signify the end of computation, but rather, it''s a
    means of lifting a value into the monadic context.


    public static Monad<T> Return<T>(T value)


    Bind (or SelectMany in C#, FlatMap in Scala, and >= in Haskell): This operation,
    known as binding, takes a container of the monadic type and a function that takes
    the plain type and returns a container of the monadic type. It applies the function
    to the unwrapped value and returns a new monadic container. If the function already
    returns a monadic value, Bind ensures that we don''t end up with a nested monadic
    but flattens it to a single-layer monadic.


    public static Monad<TResult> SelectMany<TSource, TResult>(


    this Monad<TSource> monad,


    Func<TSource, Monad<TResult>> function)


    These two operations, when implemented, give a type the monadic structure. However,
    for a type to be a monad, it also needs to adhere to certain laws.


    # Monad Laws


    Monad laws are axioms that every monad must satisfy. These laws ensure that monads
    behave consistently and predictably. They are not enforced by programming languages,
    but it''s crucial to keep them in mind when implementing monads to avoid unexpected
    behavior. There are three main laws:


    +   - Left Identity: If we take a value and put it in a context using Return and
    then feed it to a function using Bind , it''s the same as just taking the value
    and applying the function to it. In other words, if Return is our way of lifting
    a value into the monad context, it shouldn''t have any additional side effects
    that would make it differ from just applying the function directly.


    Return(value).SelectMany(f) == f(value)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '+   - Right Identity: If we have a monadic value and we use Bind to feed it
    to Return, we should end up with the same monadic value. This means that Return
    should not change the context called inside a Bind.


    ```

    monad.SelectMany(Return) == monad

