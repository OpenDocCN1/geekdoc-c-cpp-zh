  md: "```\npublic Exceptional<TResult> Apply<TResult>(ExceptionalFunc<T, TResult>>\
    \ exceptionalFunc\n{\n    return exceptionalFunc.Success ? Map(exceptionalFunc_value!)\
    \ : new Exceptional<TResult>(exceptionalFunc_exception!);\n}\n\npublic Exceptional<TResult>\
    \ Map<TResult>(Func<T, TResult> map)\n{\n    return IsException ? new Exceptional<TResult>(_exception!)\
    \ : new Exceptional<TResult>(map(_value));\n}\n\npublic Exceptional<TResult> Bind<TResult>(Func<T,\
    \ Exceptional<TResult>> bind)\n{\n    return IsException ? new Exceptional<TResult>(_exception!)\
    \ : bind(_value);\n}\n\npublic TResult Match<TResult>(Func<Exception, TResult>\
    \ Exception, Func<T, TResult> Success)\n=> IsException ? onException(_exception!)\
    \ : onSuccess(_value);\n\n```\n\nHere, the Exceptional<T> struct is designed to\
    \ hold either a value of type T (indicating success) or an Exception (indicating\
    \ an exception was thrown). The boolean property IsSuccess tells us which one\
    \ it is.\n\nTwo implicit conversion operators are provided to easily create instances\
    \ of Exceptional<T> from either an Exception or T.\n\nThe Match method is used\
    \ to extract the value from an Exceptional<T>. It takes two functions as arguments,\
    \ to handle the case where the Exceptional<T> contains a T and another to handle\
    \ the case where it contains an Exception. This forces explicit handling of cases."
