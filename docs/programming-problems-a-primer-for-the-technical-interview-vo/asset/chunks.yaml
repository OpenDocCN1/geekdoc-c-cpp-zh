  trans: "\n\n现在为了通过 `A*` 搜索高效地解决问题，我们希望按照节点到迷宫出口的距离来访问每个节点。希望越靠近出口的位置，通往出口的路径越短。\n\
    \n然而，如果我们知道实际距离，就可以通过从出口到起点的遍历来解决问题。相反，我们使用启发式方法：我们希望访问下一个离迷宫出口最近的节点，距离的计算假设始终存在从该节点到出口的直接路径。因此，为了应用\
    \ `A*` 搜索，我们将定义一个函数来计算迷宫中位置与出口之间的最短可能距离。虽然有很多指标可用，我们使用曼哈顿距离作为迷宫距离。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 8.16: 可采的迷宫距离启发式\n\n```cpp\nsize_t distance(const std::pair<size_t,\
    \ size_t> begin, const std::pair<size_t, size_t> end) {\n    return std::abs(begin.first\
    \ - end.first) + std::abs(begin.second - end.second);\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n在解决迷宫时，我们从起点开始，通过迭代构建路径继续执行 `dfs`。然而，我们使用优先队列而不是栈，其中距离启发式给出了节点的优先级。节点按照优先级从低到高的顺序被考虑。当路径到达出口时，通过迷宫的路径被重构，函数终止。如果不存在解决方案，我们返回空路径。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 8.17: 搜索迷宫。\n\n```cpp\nvoid maze(const GameBoard& maze, const Position& start,\
    \ const Position& exit, std::list<Position>* route) {\n  static const std::vector<std::pair<size_t,\
    \ size_t>> offsets = {{-1, 0}, {1, 0}, {0, -1}, {0, 1}};\n  std::map<Position,Position>\
    \ parent;\n  std::priority_queue<std::pair<size_t, Position>, std::vector<std::pair<size_t,\
    \ Position>>, std::greater<std::pair<size_t, Position>>> priority_queue;\n  priority_queue.push({distance(start,\
    \ exit), start});\n  parent[start] = start;\n  while (!priority_queue.empty())\
    \ {\n    auto current = priority_queue.top().second;\n    if (exit == current)\
    \ {\n      do {\n        route->push_front(current);\n        current = parent[current];\n\
    \      } while (current != start);\n      route->push_front(start);\n      return;\n\
    \    }\n    priority_queue.pop();\n    for (auto offset : offsets) {\n      auto\
    \ neighbor = Position(current.first + offset.first, current.second + offset.second);\n\
    \      if (neighbor.first < maze.size() && neighbor.second < maze[neighbor.first].size()\
    \ && parent.end() == parent.find(neighbor)) {\n        parent[neighbor] = current;\n\
    \        priority_queue.push({distance(neighbor, exit), neighbor});\n      }\n\
    \    }\n  }\n}\n```\n\n## 9 选择\n\n选择（Selection）是我们最后研究的类型。在程序设计中，我们将数组的中位数定义为元素\
    \ `x`，使得恰好有 `k-1` 个元素小于等于 `x`，且有 `n-k` 个元素大于等于 `x`。这在算法中很常见，实现起来同样简单。\n\n### 9.1\
    \ 通过排序选择\n\n选择最简单的方法是预对数组进行排序，并返回第 `k` 个位置。使用 `std` sort，该方法的实现非常简单。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 9.1: 通过排序选择\n\n```cpp\nint select(std::vector<int>* array, size_t k)\
    \ {\n  std::sort(array->begin(), array->end());\n  return array->at(k);\n}\n```\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n使用这种方法实现中位数非常简单。记得两个数组都是从\
    \ 0 开始索引，根据根据上面的定义，我们想要中间的元素。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 9.2: 通过排序获取中位数\n\n```cpp\nint median(std::vector<int>* array) {\n  return\
    \ select(array, (array->size() - 1) / 2);\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n这种方法总是返回正确答案，而且在简洁性上很难改进。然而，它需要对数据进行全排序。事实证明这是低效的，因为选择不需要全排序顺序。相反，我们只需要知道数组中是否存在\
    \ `k` 个较小的元素。为了改进运行时间，我们首先查看寻找合适的基准值（pivot）进行分区的问题，而不是预排序。\n\n### 9.2 基准值与分区操作\n\
    \n在二分查找中，我们通过知道索引小于探测值的元素小于探测值，而索引大于探测值的元素大于探测值，从而将搜索空间缩小一半。找到一个良好的基准元素允许在选择中进行类似的搜索空间缩小。\n\
    \n这是通过对接近中数的元素进行枢值来实现的。给定一个值和一个数组，枢值操作会让数组处于一种状态：数组中所有小于基准值的元素都在之前，而数组中所有大于等于基准值的元素都在之后。\n\
    \n在数组上实现分区有许多方法。可以使用列表并将较大的值推入尾部、较小的值推入头部。后续我们将实现一个原地的枢值操作以避免内存分配。\n\n"
- fmt: "\nThe following listing partitions the sub-array defined by the offset and\
    \ length on the value provided. The algorithm used initializes the array with\
    \ the pivot element in the first position. It then enumerates the array from right\
    \ to left. When an entry with value less than the pivot is detected, the tail\
    \ of the array is shifted to the right of the pivot. That smaller value is then\
    \ stored in the empty location created by the shift.\n\nThe return value is an\
    \ index into the array. Every element of the array which is less than or equal\
    \ than the pivot has a lower index than the return value. Every element that is\
    \ greater than the pivot value has an index no less than the return value.\n\n\
    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n### Listing\
    \ 9.3: Partition on an Element\n\n```cpp\nsize_t partition(std::vector<int>* array,\
    \ size_t pos, size_t offset, size_t length) {\n  if (length <= 1) return offset;\n\
    \  int val = (*array)[pos];\n  std::swap((*array)[offset], (*array)[pos]);\n \
    \ auto left = offset;\n  auto right = offset + length - 1;\n  while (left < right)\
    \ {\n    if (val < (*array)[right]) {\n      --right;\n    } else {\n      std::swap((*array)[left],\
    \ (*array)[left+1]);\n      if (right != left + 1) {\n        std::swap((*array)[left],\
    \ (*array)[right]);\n      }\n      ++left;\n    }\n  }\n  return left;\n}\n```\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nThe use\
    \ of the left starting position and the size on which to pivot will be helpful\
    \ in the sequel. We can now implement and analyze selection by choosing an arbitrary\
    \ pivot.\n\n### 9.3 Selection with a pivot\n\nWe begin with a rule to choose a\
    \ pivot. We suppose a rule is declared as below. The parameters define the sub-array\
    \ from which to choose a pivot.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 9.4: Definition of Find Pivot Index\n\n```cpp\nsize_t pivot_index(const\
    \ std::vector<int>& array, size_t offset, size_t size);\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nGiven a rule to choose a pivot, implementing selection can be done recursively.\
    \ A partition operation first provides the sort location of the pivot element.\
    \ If the desired location `k` is lower than the location of the pivot, we exclude\
    \ all elements of the array from the pivot to the end. If the desired location\
    \ is higher than the location of the pivot, we exclude all elements with indices\
    \ smaller than the pivot and update `k`. We finally recursively apply selection\
    \ to the range of the array not exclude.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 9.5: Selection with Pivot\n\n```cpp\nint select(std::vector<int>*\
    \ array, size_t k) {\n  std::function<int(std::vector<int>*, size_t, size_t)>\
    \ selection = [k, &selection](std::vector<int>* array, size_t offset, size_t length)\
    \ {\n    auto index = pivot_index(array, offset, length);\n    size_t pos = partition(array,\
    \ index, offset, length);\n    if (pos == k) {\n      return array->at(k);\n \
    \   }\n    if (pos > k) {\n      return selection(array, offset, pos-offset);\n\
    \    }\n    return selection(array, pos + 1, length - (pos + 1 - offset));\n \
    \ };\n  return selection(array, 0, array->size());\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nThis implementation would have expected linear running time over input provided\
    \ at random. The reason is that we can expect to exclude half the size of the\
    \ list with every pivot. However the run time is not guaranteed because the pivot\
    \ may not provide a strong separation of the search space. In the worst case,\
    \ where the array is sorted this implementation runs in quadratic time. The problem\
    \ is the choice of element on which to pivot.\n\nTo provide a linear running selection\
    \ algorithm, we chose as a pivot the `median of medians`.\n\n### 9.4 Median of\
    \ medians\n\nThe problem at hand is to guarantee that the choice of pivot element\
    \ separates the array into two pieces each with length at least some constant\
    \ fraction of the original array. This could be done if we could always choose\
    \ the median. But that is our goal, so we do not have that tool available. None-the-less,\
    \ it is possible to choose an approximation of the median by reducing this original\
    \ problem to a smaller problem. The following solution is called the `median-of-medians`\
    \ or `median-of-three`.\n\nThe reduction works by first bucketing the array into\
    \ sub-arrays of constant length. From each sub-array we can find a median value,\
    \ which is simple if each bucket of a constant length. A short listing for length\
    \ of three makes this clear.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
