    \ such as a newline. In order to accomplish this, we can seed the queue with a\
    \ level end token such as the `nullptr`. When we encounter this token again we\
    \ know that the current level has been fully enumerated. If the token is then\
    \ enqueued again, it will be placed at the end of the level which was just enqueued.\
    \ With this trick, we can complete the solution using `nullptr` as our level separation\
    \ token.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 4.6: Level Order Traversal with Separation Tokens\n\n```cpp\nvoid level_traversal(node*\
    \ root, std::ostream& out) {\n  static const node* LEVEL_TOKEN = nullptr;\n  std::queue<const\
    \ node*> queue;\n  queue.push(root);\n  queue.push(nullptr);\n  while(!queue.empty())\
    \ {\n    const node* node = queue.front();\n    queue.pop();\n    if (LEVEL_TOKEN\
    \ == node) {\n      if (!queue.empty()) {\n        out << std::endl;\n       \
    \ queue.push(LEVEL_TOKEN);\n      }\n      continue;\n    }\n    if (nullptr !=\
    \ node->left) {\n      queue.push(node->left);\n    }\n    if (nullptr != node->right)\
    \ {\n      queue.push(node->right);\n    }\n    out << node->value;\n  }\n}\n\
    ```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n###\
    \ 4.6 Largest rectangle under a histogram\n\nA histogram is a graphical representation\
    \ of data in which sequential entries along the x-axis are associated with a height\
    \ in the y-axis. These values are plotted as rectangles of equal width with height\
    \ equal to the y-value. In statistics, a histogram gives a graphical representation\
    \ of a probability distribution.\n\nAn advanced interview question is to calculate\
    \ the area of the largest rectangle under the histogram.\n\nSince the histogram\
    \ is composed of rectangles, we see that every maximal rectangle is bounded by\
    \ the height of some entry in the histogram. The width of every maximal rectangle\
    \ under the histogram is the number of other rectangles that are contiguous but\
    \ at least as tall. So we are looking for rectangles bounded by three entries\
    \ in the histogram: an entry that defines the height, the first contiguous entry\
    \ of at least that height, and the last contiguous entry of at least that height.\n\
    \nWe begin by defining a histogram as an ordered array of pairs. Each pair has\
    \ an `x` and `y` coordinate.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 4.7: Data-types for a Histogram\n\n```cpp\nstruct HistogramEntry {\n\
    \  int x;\n  int y;\n};\ntypedef std::vector<HistogramEntry> Histogram;\n```\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nA naive\
    \ solution starts by enumerating all pairs of histogram entries `α` and `β`. It\
    \ calculates the minimum height between `α` and `β` by iteratively checking each\
    \ of those values. The area is then computed and a running max is tracked. However,\
    \ this solution is cubic!\n\nUsing a stack, we can find a solution that solves\
    \ the problem in a single pass. The stack maintains a collection of all ‘open’\
    \ rectangles. The solution takes it in turn to inspect each entry of the histogram\
    \ from left to right. When the height of histogram entries is increasing, an open\
    \ rectangle is added to the stack. It is specified by its `x` and `y` coordinates.\
    \ But the `y` coordinate must be the earliest rectangle preceding the entry that\
    \ is at least as tall. We will see that the `y` coordinate can be determined by\
    \ closing open rectangles before pushing the new entry onto the stack.\n\nWhen\
    \ the height of histogram entry decreases during enumeration, all open entries\
    \ with height larger than the current value must be closed. The area of an open\
    \ entry is its height multiplied by width. The width is simply the current `x`\
    \ location minus the starting location.\n\nAfter the last entry has been visited,\
    \ a final pass must close all open entries.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 4.8: Largest Rectangle Under Histogram\n\n```cpp\nsize_t largest_area(const\
    \ Histogram& histogram) {\n  size_t max_area = 0;\n  int current_pos = 0;\n  std::stack<HistogramEntry>\
    \ open_entries;\n  for (auto& entry : histogram) {\n    // ... implementation\
    \ ...\n  }\n  return max_area;\n}\n```\n"
