    \   auto mid = lower + (upper - lower) / 2;\n        if (key <= *mid) upper =\
    \ mid;\n        else lower = mid + 1;\n    }\n    return lower - array.begin();\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n\
    A similar modification of the update rules can be made to locate the rightmost\
    \ index with the target value.\n\n### 7.3 Search in a rotated array\n\nA more\
    \ complicated question asks the candidate to search for a target value in a sorted\
    \ array that has been rotated. A rotated array is a sorted array of length `n`\
    \ in which every index `i` has been mapped to index `i + j (mod n)` for some integer\
    \ value `j`. Concretely, the array 12345 rotated by 2 is the array 45123.\n\n\
    For simplicity, we assume that there do not exist duplicate values in each given\
