    \    }\n    visit(current);\n    stack.pop();\n  }\n}\n```\n\nThe listing could\
    \ be simplified with recursion. Instead of maintaining the iterators in the stack,\
    \ we could call `dfs` with the current node as the origin. However we provide\
    \ an iterative stack implementation to show the similarity with `bfs`. Notice\
    \ that aside from using a stack instead of queue the code is similar. However,\
    \ surprisingly different behavior results from such a small change from `bfs`.\n\
    \n### 8.3.1 Determine execution order of a task\n\nGiven a graphical representation\
    \ of sub-processes of a large task, where each node in the graph represents a\
