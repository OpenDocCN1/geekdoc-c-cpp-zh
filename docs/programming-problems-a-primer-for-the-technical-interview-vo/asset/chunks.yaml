    对于面试双方来说，这都是一门艺术。这门艺术最好的境界是：在一个小时结束后，双方离开面试时都觉得度过了一个高效的小时。对于面试官来说，它是提出一个具有挑战性但可解决的问题，并与候选人共同寻找解决方案。它是让候选人感到被欢迎、被重视，并对有机会与一群对技术充满激情的人共事感到兴奋。它是在做出录用或不录用的决定时能够从容な。


    但当然，候选人的角色更为复杂。尽管如此，说明必须做的事情也很简单：你必须友好、直率，并掌握你的基础知识。对于面试，你没有太多其他可以做的准备工作。


    本书的主要目的是为技术面试中涉及编程基础知识提供复习。我们通过展示该领域内出现过的面试问题，并以任何技术面试所需的完整程度来回答这些问题来实现这一点。我们力求为每个问题提供多个解决方案，以便读者理解糟糕方案与优秀方案之间的区别。


    ## 1.1 概述


    想要通过面试或解决编程问题并没有什么秘诀。即使你掌握了基础知识，在职业技术生涯中，每个人都会遇到这样一位面试官：他们因不得不面试而感到厌烦，受自卑症困扰，并且下定决心要不录用你。但你可以做很多事情来增加被录用的概率。


    首先，了解你面对的是什么。如果你从未参加过面试，那么关于“技术面试环节”的章节将是你熟悉即将发生情况的地方。


    其次，将面试变成一场对话。轮流发言，提出真实的问题，并始终保持诚实。诚实会让双方的讨论都变得更容易、更愉快。当然，在任何技术面试中，你都被要求对一个编码问题给出解决方案，但那只占大约一半的时间。你可以通过面试官允许对话持续多久来衡量你的成功与否。


    第三，系统地处理技术问题并给出完整的回答。而且，这非常重要，要第一次就做对。


    ## 1.2 流程


    在科技领域，招聘的单元单位是技术面试。通常情况下，技术面试是一个为期 45 分钟到一小时的一对一会议，期间面试官要求候选人解决一个或多个编程问题。


    虽然筛选和介绍可能由人力资源人员处理，但软件工程师总是负责技术面试。这些工程师可能是个人贡献者或经理，但他们始终活跃在领域内并活跃于项目中。面试并不是软件工程的专业领域，因此候选人看到的大多数面试官都是公司内部不同小组或区域的志愿者。例外是招聘经理（如果面试环节中有其的话）。虽然他们都是志愿者，但这些面试官接受过培训，尊重招聘法并避免询问某些公司认为无用或有害的问题。但在这些微小的例外之外，所有人都有权提问他们他们所需的任何技术问题。


    每位面试官都有一套偏好的技术问题。这些问题收集自他们过去的面试、来自当前或过去的项目，亦或者是通过与同事在午餐时的讨论培养出来的最后一部分对流程至关重要。虽然通常有一个中央组织培训面试官，但每家公司都有一种面试文化，问题在开放讨论中被分享和分析。这种文化比任何集中的培训都能更好地控制问题的范围。


    技术面试的重点在于让面试官从候选人身上收集尽可能多的信号，以回答“这个候选人是否符合标准”这个问题。“标准”指的是公司的招聘标准。每家公司都有相似的标准，仅有细微差异。他们根据公司、小组或个人来回答这个问题。对于
    Google 来说，他们寻找的是一个至少与平均水平的 Google 员工一样的人。对于微软，他们寻找的是一个聪明且至少与产品组平均水平相当的人。对于 Facebook
    来说，他们寻找的是一个比面试官更好的人。尽管如此，每位面试官的标准也不同。但底线是，如果面试官想与该候选人共事，候选人就会通过标准。通过标准意味着获得录用决定，否则给出不录用决定。


    技术面试具有递进性。一端是初筛。初筛通过电话、视频聊天进行，极少数情况下面对面。初筛总是一系列简单、直率的问题。编程部分可能包括诸如编写 `atoi`、`binary
    search`（二分查找）或反转链表等问题。初筛的目的是在候选人明显低于标准时，避免浪费员工的时间。面试官在初筛中寻找三点：候选人是否能编写一个简单的程序、候选人是否能有效沟通，以及候选人是否被分配到合适的工作。最后一个问题通常是关于技术与管理、或后端与前端专长的选择。


    初筛之后就是实地面试环节（on-site loop）。面试环节是一系列四或更多技术面试，目标是达成录用共识。该环节在实地进行，可能在公司的主园区，也通过远程面试会议进行。这一整天的考验通常是公司做出录用或不录用决定的最后障碍。


    面试环节的设计目的是通过提出一系列中等难度的问题，来衡量候选人的能力、创造力和文化契合度。正常的问题组合涉及两个编程题、一个设计题和一个算法题。编程题是技术面试的核心，候选人看到的这类问题通常多于少。


    面试环节的执行方式在不同公司之间略有不同。


    在微软，面试官会在他们的办公室之间引导候选人。在转换期间，他们会立即分享初步反馈，以调整当天的重点。例如，如果候选人在算法上表现出出色的精通程度，面试官可能会建议关注设计。如果候选人在设计题上失误，面试官可能会建议进行跟进。


    Google 和新创公司的流程不同。由于这些公司不为员工提供办公室，候选人被分配到一个会议室，面试官一整天都会去找他们。此外，在 Google 和新创公司，除了避免重复问题外，面试官在整个过程中几乎完全没有接触。在
    Google，问题被写在纸上并在面试官之间流传。虽然这可能给候选人一种脱节的感觉，但这样做是为了尝试消除其他面试官决策带来的偏见。


    '
- fmt: "\nAt the end of the technical interview, feedback is collated into a hiring\
    \ packet and a decision is made. At Microsoft, the hiring manager often makes\
    \ the decision the same day and a candidate can expect a phone call with an offer\
    \ within a week. At Google and Facebook, the feedback is made by a local hiring\
    \ committee and forwarded to a final hiring committee. The committee is a sanity\
    \ check on the interviewer’s consensus aimed at maintaining a high hiring bar.\
    \ The cost of this process is that it is many weeks after the loop before a candidate\
    \ gets an offer or no hire decision.\n\nKeep in mind that a single no-hire during\
    \ a loop is usually not enough to stop the process. However, a sequence of no\
    \ hires and very weak hires, or a continued failure to answer basic questions\
    \ definitely is enough. What the hiring manager or hiring committee is looking\
    \ for is confidence from the interviewers in their decisions, a breadth of knowledge\
    \ demonstrated by the candidate, good communication skills, and an answer to the\
    \ question “Does the candidate meet our bar?”\n\n### 1.3 The approach\n\nA good\
    \ interview question has many right answers, but always at least one optimal in\
    \ time or space. Getting to optimal will take mastery of the fundamentals: data\
    \ structure, memory management, iteration style, and search techniques.\n\nIt\
    \ is important that you know how to approach technical questions. Every candidate\
    \ should learn to take his time in order to consider all these angles. Take your\
    \ time. After all if an interviewer asks you to code up lowest common ancestor\
    \ in a binary search tree and you approach it for an unstructured binary tree\
    \ you have made an error that will cost you a hire.\n\nThere is a simple, natural\
    \ approach to problem solving that I see all well prepared candidates take. The\
    \ steps are restating the question, understanding what is required, sketching\
    \ a solution, coding, and testing. Lets go through each of these steps in turn.\n\
    \nFirst restate the problem. You should look for ambiguity, and if found continue\
    \ by either proposing changes or asking for clarification. Ambiguity comes in\
    \ many forms, so be on the lookout for undefined behavior and corner cases.\n\n\
    Second, make sure you understand the corner cases and you have defined away as\
    \ much ambiguity as possible. Do a few test cases with the interviewer. Write\
    \ down the input and expected output, and leave these on the board to refer back\
    \ to later. These cases will be useful during sketching and testing.\n\nThird,\
    \ sketch the program on board. Do not take the whole board, because you will need\
    \ to write the code next. But you want to have something to refer back to while\
    \ you present your solution. Your sketch should be enough to show what you’ll\
    \ need to write for your main processing path and what helper functions you’ll\
    \ need to write. Your sketch should also be complete enough to gauge the asymptotic\
    \ run time of your algorithm.\n\nFourth, write the program correctly. It cannot\
    \ be said enough; you are best off to do it right the first time. Many candidates\
    \ ask if they can skip error checking, boundary conditions, or helper functions\
    \ that they believe are not core to the problem at hand. Do not do this. To see\
    \ why simply compare two candidates, one in which after writing the prototype\
    \ the candidate automatically begins checking for a `nullptr` argument and buffer\
    \ length, and another in which the candidate waves his hand and says that he will\
    \ do normal error and bounds checking later. All else being equal the first candidate\
    \ is the better interview. And that is because he showed he could do it right\
    \ the first time.\n\nFifth and lastly, run your test cases from the second step\
    \ through the code you wrote on the board. This gives you a chance to show the\
    \ interviewer how you test, and also lets you see your own writing with fresh\
    \ eyes. Perhaps you changed a variable name, missed a boundary case, or improperly\
    \ changed a helper function prototype. By stepping through your test cases these\
    \ problems will be avoided. And that is it. Restate the problem, write down some\
    \ test cases, sketch you approach, write the program, and test it. This should\
    \ sound familiar; because its no coincidence that interviewing and every day programming\
    \ have the same workflow.\n\nWorking through programming problems is much more\
    \ enjoyable than talking about strategies on how to approach them, so lets begin.\
    \ First up is a review of the fundamentals of programming.\n\n## Chapter 2: Lists\n\
    \nWe begin our reference section on data-types with the linked-list.\n\nA linked-list\
    \ is a basic data structure often used as the underlying data type of other structures\
    \ such as stacks and queues. Linked-lists benefit from constant time insertion\
    \ and removal, but come at the cost of linear time search. This is because linked-lists\
    \ do not support random access; hence, search and removal require a full scan\
    \ of the linked-list.\n\nCommon programming problems for lists are often exercises\
    \ in identifying boundary cases, clever traversal techniques, and judicious use\
    \ of temporary variables. In this section, we will implement a linked-list and\
    \ its operations, and then solve many of the basic questions about linked-lists.\n\
    \n### 2.1 Definition\n\nA linked-list is a structure composed of list nodes. A\
    \ list node contains some data for the node, as well as a pointer to the next\
    \ node in the list. In the following, we will use the definition below for a node.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 2.1: Linked-List node\n\n```cpp\nstruct node {\n    node* next;\n    int data;\n\
    \    explicit node(int data) : node(nullptr, data) {}\n    node(node* head, int\
    \ data) : next(head), data(data) {}\n};\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nTheir first node, referred to as the head, identifies lists. A list instance\
    \ is simply a pointer to the head. Empty lists are identified as those whose head\
    \ is `nullptr`. As with many data structures in `C/C++`, memory management is\
    \ required for even simple operations. We make the assumption that list operations\
    \ are required to allocate and free memory for the caller.\n\n### 2.2 Operations\n\
    \nThe basic operations of a linked-list are `insert`, `find`, and `remove`. More\
    \ complex operations can be built up from these operations. In the next section\
    \ we implement each of the basic operations.\n\n#### 2.2.1 Insertion\n\nInsertion\
    \ in a linked-list is constant time because the data-type supports only a `push-front`\
    \ operation. That is the current head of the list is replaced with a new node\
    \ with the specified value. There are two special cases for insertion, inserting\
    \ into an empty list and inserting into the head of a list. However, with a complete\
    \ listing of the constructors of the data structure, this complexity is easily\
    \ removed at the cost of requiring the caller to update the head with the result\
    \ of the insertion.\n\n```cpp\nnode* insert(node* head, int data) {\n    return\
    \ new node(head, data);\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 2.2: Insert into a Linked-List\n\nInterviews often ask for insertion\
    \ into a sorted list. A clever question for a candidate to ask is that if the\
    \ data needs to remain sorted if a list was the right choice of container. But\
    \ when answering this question the boundary cases are inserting into the head\
    \ or tail of the list. To insert into a sorted linked-list, we look for the predecessor\
    \ of where the data should be inserted. When found, we construct a new node, and\
    \ splice it into the list by updating the proper `next` member variables.\n\n\
    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing 2.3:\
    \ Insert into a Sorted Linked-List\n"
