    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 5.3: Heap Creation Heapify


       void heapify(std::vector<int>⋆ array) {     for (auto itr = array->begin();          itr != array->end();          ++itr) {       auto index = itr - array->begin();       auto parent = parent_index(index);       while (index != parent              && (⋆array)[parent] < (⋆array)[index]) {         std::swap((⋆array)[parent], (⋆array)[index]);         index = parent;         parent = parent_index(index);       }     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    While a binary heap is not an optimally efficient heap structure, as we see the
    binary heap can be constructed in-place instead of requiring memory allocation
    for the tree. The timesavings realized from not having to allocate ancillary objects
    often overcome the disadvantage of using an implementation not optimized for worst
    case behavior.


    #### 5.2.2 Insertion


    Insertion of a new value into a binary heap begins with adding the value as the
    next available leaf node in the binary tree. Afterward, the parent-child relationships
    are updated to satisfy the heap property as was done in heapify. Insertion requires
    the vector to be dynamically resized, and hence is not an in-place operation.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 5.4: Insert Into a Heap


       void insert(std::vector<int>⋆ heap, int value) {     heap->push_back(value);     auto index = heap->size() - 1;     auto parent= parent_index(index);     while (index != 0            && (⋆heap)[index] > (⋆heap)[parent]) {       std::swap((⋆heap)[index], (⋆heap)[parent]);       index = parent;       parent= parent_index(index);     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    #### 5.2.3 Find maximum element


    In a binary heap, the find_max operation requires only dereferencing the first
    index of the vector. Correctness of this action is guaranteed by the heap property.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 5.5: Find Maximum in a Heap


       int find_max(const std::vector<int>& heap) {     return heap[0];   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    #### 5.2.4 Remove maximum element


    Removal of the maximum heap value must accomplish two objectives aside from replacing
    the value at the initial position. First, it must promote the second minimum value
    to the first position. Doing so causes the tree to pivot, and may have a cascading
    affect on the structure of the heap. Secondly, the tree structure and parent-child
    relationships must be maintained.


    Both requirements are satisfied by the following sequence. First replace the root
    value of the heap with the value of the last leaf node, and then resize the array
    to the smaller size. This maintains the tree structure and removes the maximum
    element from the array. We are required to then fix up the heap property. In this
    operation, the heap property is maintained by iteratively swapping parent-child
    pairs if in violation of the heap property.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 5.6: Remove Maximum from a Heap


       void remove_max(std::vector<int>⋆ heap) {     std::swap(⋆heap->begin(), ⋆(heap->end() - 1));     heap->resize(heap->size() - 1);     size_t index = 0;     while (index < heap->size()) {       auto child = lchild_index(index);       if (child >= heap->size()) {         break;       }       auto right = rchild_index(index);       if (right < heap->size()           && (⋆heap)[right] > (⋆heap)[child]) {         child = right;       }       if ((⋆heap)[index] >= (⋆heap)[child]) {         break;       }       std::swap((⋆heap)[index], (⋆heap)[child]);       index = child;     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    #### 5.2.5 Increase key


    When a key is increased in a max heap, the heap property may no longer hold for
    that node and its parent. Hence, by increasing the value of a key, we may need
    to decrease its index repeatedly until the array again has the heap property.
    This is done by our standard practice of iteratively swapping.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 5.7: Increase a Key In a Heap


       void increase_key(std::vector<int>⋆ heap,                     size_t index) {     (⋆heap)[index]++;     auto parent = parent_index(index);     while (0 != index            && (⋆heap)[index] > (⋆heap)[parent]) {       std::swap((⋆heap)[index], (⋆heap)[parent]);       index = parent_index(index);       parent = parent_index(index);     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This operation generalizes to decrease key and key change in the obvious ways.


    The stl provides a number of algorithms to create and manage a binary heap. make_heap
    provides support for the initialization from a vector. pop_heap implements remove
    maximum and push_heap provides insertion.


    ### 5.3 Enumeration of powers


    Solving programming problems relies as much upon choosing the correct data structure
    as it does the proper algorithm. Consider the problem of enumerating powers of
    an initial set of non-negative numbers. Concretely, given a set of integers the
    question is to list the powers of the integers in increasing order without duplicates.
    For example, given the set of 2*,*3*,*4, the first six powers would be 1 = 2⁰*,*2
    = 2¹*,*3 = 3¹*,*4 = 4¹ = 4*,*8 = 2³*,*9 = 3² .


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 5.8: Enumeration of Powers'
