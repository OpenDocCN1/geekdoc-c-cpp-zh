    because to maintain the order invariant, an insertion requires search to identify
    which node in a tree will become the parent of the inserted node. After a parent
    node is identified by a find operation, only a constant number of operations are
    needed to complete insertion.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.2: Insert into a Binary Search Tree


       node⋆ insert(node⋆ root, int val) {     if (nullptr == root) {       return new node(val);     }     if (val < root->value) {       root->left = insert(root->left, val);     }     else {       root->right = insert(root->right, val);     }     return root;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Also notice the use of recursion during the retrieval phase of insertion. This
    is characteristic of binary search trees in the sense that where-as algorithms
    on linked-lists are usually iterative, operations on trees are often recursive.


    #### 3.2.2 Find


    The utility of a binary search tree is derived from the logarithmic time search
    guarantee of the data structure. This guarantee is only for balanced binary search
    trees. Search is the motivation for use of a binary tree, and as such is the fundamental
    operation on binary search trees.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.3: Find in a Binary Search Tree


       node⋆ find(node⋆ root, int value) {     if (nullptr == root || root->value == value) {       return root;     }     if (value < root->value) {       return find(root->left, value);     }     return find(root->right, value);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Note that the logarithmic time for search is guaranteed because when we branch
    left or right, we are decreasing the search space by a constant fraction. Each
    branch cuts the search space in half. We can only divide the search space by two
    a logarithmic number of times before we are left with a single element.


    #### 3.2.3 Removal


    As with insertion, removal of a value from a binary search tree has logarithmic
    running time. The search is required for more than the care needed to maintain
    the order invariant. Indeed, search is required to find the next value in the
    binary search tree that is compatible with the position of the node being removed.
    When this is found, that value is replaced and the node found is removed.


    In order to carefully write the algorithm for removal in C/C++, we will first
    define the two ancillary functions find_parent and find_ successor. Finding the
    parent of a node is a straightforward operation. It is simply a modified find
    operation in which the parent node is returned, not the child. The solution below
    returns nullptr if the node is the root.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.4: Find Parent in a Binary Search Tree


       node⋆ find_parent(node⋆ root, node⋆ target) {     if (root == target) {       return nullptr;     }     while (root->left != target            && root->right != target) {       if (target->value < root->value) {         root = root->left;       } else {         root = root->right;       }     }     return root;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The find parent operation is used to find the successor of a node in a binary
    search tree. Every node in binary search tree has a data member with a comparison
    operation. Suppose the data in a binary tree is sorted in increasing order. The
    successor of a target node is a node in a binary search binary tree whose data
    would immediately follow the target node’s data in a sorted list of all the data
    members associated with the binary tree. The successor plays a role in removal
    from a binary search tree in that it can replace the target node and maintain
    the order invariant.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.5: Find Successor in a Binary Search Tree


       node⋆ find_successor(node⋆ root, node⋆ target) {     auto successor = target->right;     if (nullptr != successor) {       while (nullptr != successor->left) {         successor = successor->left;       }       return successor;     }     do {       if (nullptr != successor) {         target = successor;       }       successor = find_parent(root, target);     }  while (nullptr != successor               && successor->right == target);     return successor;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Removal from a binary search tree has a number of cases that need to be considered
    to maintain the order invariant. Removing a leaf node is simple, since the node
    has no children it can be deallocated and the parent updated. If a node has a
    single child, then that child can replace the node in the binary search tree and
    the node deallocated. In the final case when a node has two children, we want
    to replace the node with the value of its successor. Doing so would maintain the
    order invariant at the node’s location in a binary search tree. We then need to
    recursively remove the successor from the tree to avoid having a duplicate node.
    All together, this provides the following algorithm.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.6: Remove a Node from a Binary Search Tree


       node⋆ remove(node⋆ root, node⋆ target) {     if (nullptr != target->left         && nullptr != target->right) {       node⋆ next = find_successor(root, target);       int data = next->value;       remove(root, next);       target->value = data;       return root;     }     if (nullptr != target->left         || nullptr != target->right) {       node⋆ temp = target->left ?         target->left : target->right;       target->value = temp->value;       target->left = temp->left;       target->right = temp->right;       delete temp;       return root;     }     if (root == target) {       delete root;       return nullptr;     }     node⋆ parent = find_parent(root, target);     if (parent->left == target) {       parent->left = nullptr;     }     else {       parent->right = nullptr;     }     delete target;     return root;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Note that the stl provides an implementation of a self-balancing binary search
    tree in std::map. When manipulating the internal structure of the binary tree
    is not required for answering a question, it is generally better to use this class.
    Throughout this section will use the tree node defined above, but in the sequel
    we rely on the stl.


    ### 3.3 Tree properties


    Tree algorithms rely on many properties of a tree. For instance a tree’s size,
    depth and whether or not it is balanced. Below we provide algorithms for calculating
    commonly asked properties of a binary tree.


    #### 3.3.1 Size


    The size of a binary tree is it’s number of nodes. Notice that from any node,
    the size of the sub-tree rooted at that node is one more than the sum of the size
    of the sub-trees rooted at it’s children. We can easily calculate the size of
    a binary tree recursively.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.7: Size of a Binary Tree


       size_t size(node⋆ root) {     if (nullptr == root) {       return 0;     }     return 1 + size(root->left) + size(root->right);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    As an exercise, consider how to calculate the size of a binary tree without recursion.
    In this alternative we can count the number of nodes while iterating through the
