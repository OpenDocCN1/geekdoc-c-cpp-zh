  raw: 'A few details of this implementation require further discussion. The function
    above returns either the position of the entry or the point at which the algorithm
    was searching when it determined the key is not present. We will see this definition
    is useful in the sequel.


    The use of pointer arithmetic here works since in C++ vector arrays are contiguous,
    and iterators can be considered as their logical address. The midpoint is the
    average of the first address in the array, *lower*, and the last address in the
    array, *array+len-1* added to the first.


    Secondly, since we know that *key≠* * *mid* we do not need to have *mid* be considered.
    So we can set *lower* and *upper* one passed mid in the appropriate direction.
    Concretely, we can set *upper* to be *mid* - 1, as that is the lowest index that
    we have not evaluated.


    Last, the update rule used to find the midpoint should always be used in programming
    interviews. It is the only means to write the expression to calculate the midpoint
    of a without the danger of an operation overflow. The more common way to write
    that line is *mid* = *lower* + (*upper* + *lower*)*∕*2\. However, it is possible
    for *upper* + *lower* to overflow.


    Binary search provides order log *n* lookup, and is optimal for comparison search.
    However while the screening interview may ask for a quick implementation, its
    specific application to interview problems is sometimes subtle.


    ### 7.2 Find the first occurrence in a sorted array.


    An interview question that can be solved with slight modification to binary search
    is the problem of finding the leftmost occurrence of a target value *n* in a sorted
    array. Modifying both the update rules and the exit criteria of the previous implementation
    of binary search can solve this question.


    While previous implementation of the binary search algorithm provides an incomplete
    answer, it does provide information on the location of the target. We should immediately
    see that once we find any index that matches the target value, we could scan linearly
    until we find the left most element with the target value. While this provides
    a correct solution, the run time of the algorithm is linear.


    Note that when an index with the target value is found, we can update *upper*
    to be that index that we discovered. Doing so would always keep the target solution
    in range of our search. So we change the line *upper* = *mid* - 1 to *upper* =
    *mid*. The update rule for *lower* need not change. However, we see that if the
    lower bound is ever equal to the target after an update it must be pointing to
    the left most entry. Our final solution then is a modified binary search.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.2: Binary Search To Find Leftmost Target


       size_t find(const std::vector<int>& array,               int key) {     auto lower = array.begin();     auto upper = array.end()-1;     while (lower < upper && ⋆lower != key) {       auto mid = lower + (upper - lower) / 2;       if (key <= ⋆mid) upper = mid;       else lower = mid + 1;     }     return lower - array.begin();   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    A similar modification of the update rules can be made to locate the rightmost
    index with the target value.


    ### 7.3 Search in a rotated array


    A more complicated question asks the candidate to search for a target value in
    a sorted array that has been rotated. A rotated array is a sorted array of length
    *n* in which every index *i* has been mapped to index *i* + *j* (mod n) for some
    integer value *j*. Concretely, the array 12345 rotated by 2 is the array 45123.


    For simplicity, we assume that there do not exist duplicate values in each given
    array.


    There are two common solutions to this interview question, one requires a complex
    modification to the update rule. The other requires a two-step search algorithm.


    Let’s again see what modifications to binary search are required. Given the example
    above, we immediate see that the problem with our candidate solution is only the
    update rules. Since we cannot guarantee that array is increasing from *lower*
    to *mid* and from *mid* to *upper*, we are not updating properly. What is needed
    is to consider the location of the pivot. By enumerating cases, we can see that
    the pivot is either in between *lower* and *mid*, *mid* and *upper* or no longer
    being considered in the sub-array that is being searched. Since the array does
    not contain duplicates, we can determine whether or not the pivot is in the range
    *lower* to *mid* by testing if *lower < mid* and if the key is bounded by *lower*
    and *mid*. This leads to our first solution.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.3: Binary Search in Rotated Array


       size_t find(const std::vector<int>& array,               int key) {     auto lower = array.begin();     auto upper = array.end() - 1;     while (lower < upper) {       auto mid = lower + (upper - lower) / 2;       if (key == ⋆mid) {         upper = mid;       } else if (⋆lower <= ⋆mid) {         if (⋆lower <= key && key < ⋆mid) {           upper = mid;         } else {           lower = mid + 1;         }       } else if (⋆mid <= ⋆upper) {         if (⋆mid < key && key <= ⋆upper) {           lower = mid + 1;         } else {           upper = mid;         }       }     }    return lower - array.begin();   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Let’s consider a second solution by addressing the problem of an unknown pivot
    another way. If we knew the location of the pivot *j*, then instead of special
    casing the ranges of *lower* to *mid* and *mid* to *upper*, we can instead modify
    the binary search update rule to use modulo arithmetic. Concretely, if *n* is
    the length of the array, we could set *lower* = *j*, *upper* = *j* + *n* – 1 (mod
    n) = *j* – 1 (mod n), and *mid* = *lower* + (*upper* -*lower*)*∕*2 (mod n). Our
    previous binary search is then correct. This is implemented below.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.4: Binary Search with Pivot Offset


       size_t find(const std::vector<int>& array,               size_t pivot,               int key) {     auto begin = array.begin();     auto length = array.size();     auto lower = array.begin();     auto upper = array.end() - 1;     while (lower < upper) {       auto mid = lower + (upper - lower) / 2;       auto mid_val = begin+(mid-begin+pivot)%length;       if (key <= ⋆mid_val) upper = mid;       else lower = mid + 1;     }    return (lower - begin + pivot) % length;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    How can we find *j*? In linear time we can search for the index of the minimum
    value. However, an optimal method can be built upon binary search using update
    rules similar to the first solution of this problem. That is we update the lower
    and upper bounds of a binary search to insure that the pivot is always between
    them. When this can no longer be satisfied, then the lower bound must be the pivot
    value.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.5: Binary Search for the Pivot in Rotated Array


       size_t find_pivot(const std::vector<int>& array) {     auto lower = array.begin();     auto upper = array.end() - 1;     while (lower < upper) {       auto mid = lower + (upper - lower) / 2;       if (⋆lower <= ⋆mid) {         if (⋆mid < ⋆upper) break;         lower = mid + 1;       } else {         upper = mid;       }     }    return lower - array.begin();   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 7.4 Find a fixed-point


    An interesting mathematical programming problem asks the candidate to find the
    fixed-point in a function.'
