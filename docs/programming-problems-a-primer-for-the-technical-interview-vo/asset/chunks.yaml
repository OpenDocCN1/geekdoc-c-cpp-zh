    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.5: Remove from a Linked-List


       node⋆ remove(node⋆ head, node⋆ target) {     if (head == target) {       head = head->next;       delete target;       return head;     }     auto temp = head;     while (nullptr != temp->next            && target != temp->next) {       temp = temp->next;     }     if (target == temp->next) {       temp->next = temp->next->next;       delete target;     }     return head;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Note that as the target of removal was a parameter, we can assume that it was
    not the nullptr and the list was not empty. For this reason we did not verify
    that the head of the list was not the nullptr. We will follow this pattern in
    the sequel.


    ### 2.3 Circular linked-lists


    A common modification to linked-lists is called a circular linked-list. The structure
    defining a node in a circular linked-list is identical to that of a node in a
    simple linked-list. However, the update and remove rules are modified to maintain
    that the tail of the list points back to the head.


    Insertion into a circular linked-list is similar to that in a standard list except
    the head element must reference itself in a list of length 1\. We also lose the
    idea of simply replacing the head with a newly allocated pointer, since the tail
    refers to the head.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.6: Insert into a Circular Linked-List


       node⋆ circular_insert(node⋆ head, int data) {     auto insertion = new node(data);     if (nullptr == head) {       insertion->next = insertion;       return insertion;     }     if (head == head->next) {       head->next = insertion;       insertion->next = head;       return insertion;     }     std::swap(head->data, insertion->data);     insertion->next = head->next;     head->next = insertion;     return head;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Retrieval in a circular linked-list is almost as simple as that in a simple linked-list.
    Again, the entire list must be enumerated until the value has been found or every
    node has been visited. Unlike in a simple linked-list, termination of the search
    cannot rely on finding a nullptr. Instead we must cache a pointer to the head
    and use it to determine when the list has looped back.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.7: Find in a Circular Linked-List


       node⋆ circular_find(node⋆ head, int value) {     auto current = head;     while(nullptr != current           && current->data != value) {       current = current->next;       if (current == head) {         return nullptr;       }     }     return current;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Removal from a circular linked-list is more complex than removal in a simple linked-list.
    As with insertion, this is because the tail element refers the address of the
    head element. To get around this, we do not remove the desired node, but instead
    shift all the elements of a list around it. This avoids the problems of updating
    the value of the predecessor’s next member variable.


    Removal also requires checking the boundary case where there is but a single element
    in the circular linked-list. Then we must clear the list entirely.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.8: Remove from a Circular Linked-List


       node⋆ circular_remove(node⋆ head, node⋆ target) {     if (head == head->next) {       delete head;       return nullptr;     }     auto next = target->next;     target->data = next->data;     target->next= next->next;     delete next;     return target;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 2.4 Doubly linked-lists


    Doubly linked-lists are lists in which each node has both a pointer to the next
    element in the list as well as the previous element in the list. A simple doubly
    linked-list has a head with nullptr as its previous member, and a tail with nullptr
    as its next member. Doubly linked-lists can also be circular, with single element
    lists having both the head and tail referencing the same node. In the following
    examples we implement circular doubly linked-lists.


    The constructor for a doubly linked-list is only a simple modification of a simple
    linked-list node where a prev member variable is added.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.9: Doubly Linked-List Node


       struct dll_node {     dll_node⋆ prev;     dll_node⋆ next;     int data;     explicit dll_node(int data)       : dll_node(this, this, data) {}     dll_node(dll_node⋆ prev,              dll_node⋆ next,              int data)       : prev(prev), next(next), data(data) {}   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Inserting and removing from a circular doubly linked-list integrates inserting
    into a standard linked-list and the semantics of a circular linked-list. The implementation
    below pushes the list forward and inserts a new head. This is done by first setting
    the next and prev members appropriately, and then correcting the list structure
    before returning.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.10: Insert into a Doubly Linked-List


       dll_node⋆ insert(dll_node⋆ head, int data) {     if (nullptr == head) return new dll_node(data);     auto insertion = new dll_node(head->prev,                                   head,                                   data);     insertion->prev->next = insertion;     insertion->next->prev = insertion;     return insertion;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The find operation for a doubly linked-list is identical to that of the find operation
    for a circular linked-list, aside from the parameter and return type. The previous
    code will operate on doubly linked-lists with only that modification.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


