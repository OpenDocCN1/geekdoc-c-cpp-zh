  trans: "\n算法执行完成后，参数 `distances` 包含一个从节点地址到原点最短距离的映射。\n\n通过跟踪和修改 `bfs` 以在访问节点时提供状态信息是一种强大的技术，它有许多其他用途。\n\
    \n## 8.2.2 源自家谱数据的祖先关系\n\n我最喜欢的面试题是让候选人判断两个人是否存在亲缘关系。在这个问题中，每个人都是一个节点。每个节点最多有两个父母。问题被设定为具有不完整的家谱数据，即每个人的完整祖先可能未知。这导致了生成的图可能是不连通的。\n\
    \n为了解决这个问题，我们首先将该领域表示为有向图。每个人都是一个节点，键是该的标识符。每个节点最多与两个代表父母的节点相邻。边从从节点指向父母。下面的列表根据父级数据创建一个图。图的节点在映射\
    \ `GeneologicalData` 中表示。每个节点的邻居是与该条目关联的值。\n\n列表 8.5：源自家谱数据的祖先关系类型\n```cpp\ntypedef\
    \ unsigned Person;\ntypedef std::vector<Person> Parents;\ntypedef std::map<Person,\
    \ Parents> GenealogicalData;\ntypedef std::set<Person> Ancestry;\n```\n\n上述定义的\
    \ `Ancestry` 类型用于记忆化一个人所有的祖先。要确定个体之间是否有亲缘关系，我们首先使用 `bfs` 计算每个人的完整祖先。由于我们处理的是表示在映射中的图，`bfs`\
    \ 需要被修改以理解这种表示形式。`visit` 函数将父母添加到 `Ancestry` 实例中。在下下面的列表中，我们内联了 `visit` 函数，而不是将其作为函数传递。\n\
    \n列表 8.6：源自数据的祖先关系\n```cpp\nvoid find_ancestry(const GenealogicalData& data, const\
    \ Person& id, Ancestry* ancestry) {\n  std::queue<Person> queue;\n  queue.push(id);\n\
    \  ancestry->insert(id);\n  while (queue.size()) {\n    auto entry = data.find(queue.front());\n\
    \    queue.pop();\n    if (entry == data.end()) continue;\n    for (auto parent\
    \ : entry->second) {\n      if (ancestry->end() == ancestry->find(parent)) {\n\
    \        ancestry->insert(parent);\n        queue.push(parent);\n      }\n   \
    \ }\n  }\n}\n```\n\n如果这些集合的交集非空，那么我们可以确定个体之间存在亲缘关系。将这一切整合起来，该问题的解决方案所示。\n\n列表\
    \ 8.7：判断两个人是否有亲缘关系。\n```cpp\nbool related(const GenealogicalData& data, Person\
    \ id1, Person id2) {\n  Ancestry ancestry1;\n  find_ancestry(data, id1, &ancestry1);\n\
    \  Ancestry ancestry2;\n  find_ancestry(data, id2, &ancestry2);\n  Ancestry intersection;\n\
    \  std::set_intersection(\n    ancestry1.begin(),\n    ancestry1.end(),\n    ancestry2.begin(),\n\
    \    ancestry2.end(),\n    std::inserter(intersection, intersection.begin()));\n\
    \  return !intersection.empty();\n}\n```\n\n上面的列表效率不高，但它确实解决了问题。说到效率，它在处理第二个人之前，需要对一个人的祖先进行完全的\
    \ `bfs` 遍历。由于在完全树中，父母的数量呈指数级增长，祖先集合可能变得极其巨大。有许多方法可以克服这个问题，例如祖先的层级遍历。\n\n## 8.3\
    \ 深度优先搜索\n\n深度优先是一种图算法，其特点是使用栈来维护遍历的边界。我们通常将其缩写为 `dfs`。它与 `bfs` 有许多不同。深度优先试图发现下一个最长路径，而广度优先则遍历一组等距离节点的边界。此外，对于深度优先中访问的每个顶点，栈都维护了从该节点到搜索根的路径。在\
    \ `bfs` 中，当访问下一个节点时，遍历历史顺序就会丢失。\n\n与 `bfs` 一样，`dfs` 的实现需要维护一个已访问顶点列表。隐式地，栈上的节点将访问其子。已访问的节点将不再是栈的元素。栈包含迭代器器对，一个指向节点，另一个指向该节点的邻接列表。迭代器维护了访问邻居的顺序。\n\
    \n列表 8.8：深度优先搜索\n```cpp\nvoid dfs(node* origin, Visitor visit) {\n  std::set<node*>\
    \ queued;\n  std::stack<std::pair<node*, std::vector<node>::iterator>> stack;\n\
    \  stack.push({origin, origin->neighbors.begin()});\n  queued.insert(origin);\n\
    \  while (!stack.empty()) {\n    auto current = stack.top().first;\n    auto&\
    \ neighbor = stack.top().second;\n    if (neighbor != current->neighbors.end())\
    \ {\n      node* next = *neighbor;\n      ++neighbor;\n      if (queued.end()\
    \ == queued.find(next)) {\n        stack.push({next, next->neighbors.begin()});\n\
    \        queued.insert(next);\n      }\n      continue;\n    }\n    visit(current);\n\
    \    stack.pop();\n  }\n}\n```\n\n该列表可以通过递归进行简化。与其在栈中维护迭代器，我们可以使用当前节点作为原点调用 `dfs`。然而，我们提供了一个迭代栈实现，以展示其与\
    \ `bfs` 的相似性。注意，除了使用栈代替队列外，代码是相似的。然而，相对于 `bfs` 的这种微小改变会产生出意之外的不同行为。\n\n### 8.3.1\
    \ 确定任务的执行顺序\n\n给定一个大型任务的子进程图形表示，其中图中的每个节点代表一个子进程。节点的节点取决于其父节点的完成。问题是确定所有进程的执行顺序，使得没有一个进程在其父母完成之前启动。对于这个问题，该有向图是特殊的，因为它没有循环，被称为有向无环图。如果它有循环，则不存在顺序执行顺序。\n\
    \n这个确定顺序执行顺序的问题可以通过 `dfs` 来解决。假设原点是一个没有入边的节点。如果我们从该节点开始 `dfs`，由于没有循环，我们最终将到达一个没有孩子的节点。该节点代表一个取决于栈期间整个内容的进程。我们将将其保存到执行顺序反序列表的末尾。\n\
    \n我们继续这种方式，直到所有节点都被访问并添加到列表中。如果图未被完全遍历但 `dfs` 栈为空，我们选择图中下一个没有入边的节点并进行迭代。\n\n当此过程完成后，列表包含了执行顺序的反序。反转列表后，我们便得到了执行顺序。\n"
- fmt: "\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 8.9: Dependency graph\n\n```cpp\nvoid topological_sort(node* origin, std::list<node*>*\
    \ list) {\n  auto visitor = [list](node* vertex) {\n    list->push_back(vertex);\n\
    \  };\n  dfs(origin, visitor);\n  list->reverse();\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nIt is worth noting that this problem is a specialization of the general problem\
    \ of topologically sorting nodes in a directed graph, and has many other applications\
    \ such as classifying nodes in connected components.\n\n### 8.3.2 Find cycles\
    \ in a graph\n\nSuppose we are given a graph of nodes represented as an adjacency\
    \ list, the question is to determine if there exist any cycles in the graph. Depth\
    \ first search visits nodes by following edges. An edge that is traversed is called\
    \ a tree edge. When `dfs` attempts to visit an element that has already on the\
    \ stack, that edge is called a back edge. Such an edge provides positive identification\
    \ of a cycle, as it loops back to a path already traversed. So the problem of\
    \ determining if a graph contains a cycle is as simple as finding a single back-edge\
    \ in a `dfs`.\n\nFinding a cycle is simplified if the Visitor is provided the\
    \ stack when called. However, this is not necessary. Consider the first node provided\
    \ to the Visitor. If this node has any children, then a cycle exists, else that\
    \ child would have been added to the stack and visited first. Likewise, if any\
    \ node is visited in which some child has not been previously visited then a cycle\
    \ exists. With this intuition, we can quickly develop a solution.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 8.10: Detect Cycles\n\n```cpp\nbool detect_cycle(node* origin) {\n \
    \ bool cycle_detected = false;\n  std::set<node*> visited;\n  auto visitor = [&cycle_detected,\
    \ &visited](node* vertex) {\n    visited.insert(vertex);\n    for (auto neighbor:\
    \ vertex->neighbors) {\n      if (visited.end() == visited.find(neighbor)) {\n\
    \        cycle_detected = true;\n      }\n    }\n  };\n  dfs(origin, visitor);\n\
    \  return cycle_detected;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nWhen a cycle is detected by the presence of a back edge, memoizing the tree\
    \ edges and reconstructing the cycle from the paths from the origin to the first\
    \ node in which a cycle was found could determine the nodes of the cycle.\n\n\
    Reconstructing a cycle is not much more involved. When the first cycle is detected,\
    \ the functional would begin looking for tree edges that connect to either the\
    \ head or tail of a partially constructed cycle. When an edge matches the head,\
    \ it should be pushed to the front. When an edge originates at the tail, it is\
    \ pushed back. When the head and tail equal, a cycle has been found.\n\n### 8.3.3\
    \ Find all the words in a boggle game.\n\nLet’s consider a matrix of characters,\
    \ defined in terms of vectors.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 8.11: Definition of Matrix of char\n\n```cpp\ntypedef std::vector<std::vector<char>>\
    \ GameBoard;\ntypedef std::pair<size_t, size_t> Position;\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
