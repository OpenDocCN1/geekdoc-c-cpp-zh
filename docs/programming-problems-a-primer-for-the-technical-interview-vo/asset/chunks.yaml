    Listing 8.9: Dependency graph


       void topological_sort(node⋆ origin,                         std::list<node⋆>⋆ list) {     auto visitor = [list] (node⋆ vertex) {       list->push_back(vertex);     };     dfs(origin, visitor);     list->reverse();   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    It is worth noting that this problem is a specialization of the general problem
    of topologically sorting nodes in a directed graph, and has many other applications
    such as classifying nodes in connected components.


    #### 8.3.2 Find cycles in a graph


    Suppose we are given a graph of nodes represented as an adjacency list, the question
    is to determine if there exist any cycles in the graph. Depth first search visits
    nodes by following edges. An edge that is traversed is called a tree edge. When
    *dfs* attempts to visit an element that has already on the stack, that edge is
    called a back edge. Such an edge provides positive identification of a cycle,
    as it loops back to a path already traversed. So the problem of determining if
    a graph contains a cycle is as simple as finding a single back-edge in a *dfs*.


    Finding a cycle is simplified if the Visitor is provided the stack when called.
    However, this is not necessary. Consider the first node provided to the Visitor.
    If this node has any children, then a cycle exists, else that child would have
    been added to the stack and visited first. Likewise, if any node is visited in
    which some child has not been previously visited then a cycle exists. With this
    intuition, we can quickly develop a solution.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.10: Detect Cycles


       bool detect_cycle(node⋆ origin) {     bool cycle_detected = false;     std::set<node⋆> visited;     auto visitor = [&cycle_detected, &visited] (         node⋆ vertex) {       visited.insert(vertex);       for (auto neighbor: vertex->neighbors) {         if (visited.end()             == visited.find(neighbor)) {           cycle_detected = true;         }       }     };     dfs(origin, visitor);     return cycle_detected;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    When a cycle is detected by the presence of a back edge, memoizing the tree edges
    and reconstructing the cycle from the paths from the origin to the first node
    in which a cycle was found could determine the nodes of the cycle.


    Reconstructing a cycle is not much more involved. When the first cycle is detected,
    the functional would begin looking for tree edges that connect to either the head
    or tail of a partially constructed cycle. When an edge matches the head, it should
    be pushed to the front. When an edge originates at the tail, it is pushed back.
    When the head and tail equal, a cycle has been found.


    #### 8.3.3 Find all the words in a boggle game.


    Let’s consider a matrix of characters, defined in terms of vectors.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.11: Definition of Matrix of char


       typedef std::vector<std::vector<char>> GameBoard;   typedef std::pair<size_t, size_t> Position;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    We interpret the matrix as an *n*×*n* game board, where each square on the board
    contains a letter. The question is to find all words that are simple paths in
    the graph represented by the matrix. In this graph, elements of the matrix are
    neighbors if they are above, below, left, right or diagonal. The problem is complicated
    by the fact that words can start from any node in the graph and that all paths
    need to be checked.


    To solve this problem, we require a function isword that returns true if a word
    has been found. We output each word found during the traversal that satisfies
    this function.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.12: Definition of isword


       bool isword(const std::string&);


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    With this method available, let’s begin by translating a matrix *M* given as a
    two dimensional array of characters into a directed graph. We begin by modifying
    dfs to the matrix to look for all neighbors. Neighbors are in any adjacent entry.
    Since we want all paths, we do not use the queued variable. But we do not want
    to backtrack on the stack, so we instead of verifying that we have pushed a node
    onto the stack, we only verify that the node is not currently on the stack.


    The following listing enumerates all words that can begin at a node in the graph.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.13: Word Search in a Matrix from a Single Point


       void boggle(       const GameBoard& board,       const Position& pos,       std::set<std::string>⋆ words) {     static const std::vector<size_t> offsets =       {-1, 0, 1};     std::set<std::pair<size_t, size_t>> visited;     std::string word;     std::function<void(Position)> boggle_dfs =       [&] (Position pos) {       for (auto row_offset: offsets) {         for (auto col_offset: offsets) {           Position next_pos =             {pos.first + row_offset,              pos.second + col_offset};           auto element = visited.find(next_pos);           if (next_pos.first < board.size()               && next_pos.second                     < board[next_pos.first].size()               && visited.end() == element) {             visited.insert(next_pos);             word +=               board[next_pos.first][next_pos.second];             if (isword(word)) {               words->insert(word);             }             boggle_dfs(next_pos);             visited.erase(visited.find(next_pos));             word.resize(word.length() - 1);           }         }       }     };     boggle_dfs(pos);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This problem is unlike our previous examples where we traversed from a single
    starting point. To this end we must attempt multiple traversals, one for each
    node in the graph. So using the previous listing, following function provides
    a complete solution to the problem.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.14: Word search in a matrix


       void boggle(       const GameBoard& board,       std::set<std::string>⋆ words) {     for (size_t row = 0;          row < board.size();          ++row) {       for (size_t col = 0;            col < board[row].size();            ++col) {         boggle(board, {row, col}, words);       }     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 8.4 *A*^⋆ Search


    We conclude graphical search with a brief example of *A*^⋆ search. *A*^⋆ search
    is a graphical search which uses a priority queue to order the frontier of exploration.
    The value of a node in the priority queue can be given by a heuristic measurement
    of the distance to a goal. In this way it differs from both *bfs* and *dfs* in
    that the order in which the nodes are to be visited in not fixed by the order
    in which they are discovered.


    Suppose we are given maze represented by a square *n* × *n* matrix defined as
