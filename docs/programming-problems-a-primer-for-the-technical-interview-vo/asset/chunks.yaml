    \ open_entries;\n  for (auto& entry : histogram) {\n    // ... implementation\
    \ ...\n  }\n  return max_area;\n}\n```\n"
- fmt: "\nThroughout this section we will take a closer look at the binary heap.\n\
    \n## 5.2 Operations\n\nIn the following section we implement the basic operations\
    \ for the binary heap: `insert`, `find_max`, `remove_max`, and `increase_key`.\
    \ Each operates on a binary tree node satisfies the heap property. We begin therefore\
    \ with the `heapify` operation which initializes a binary heap from a vector in-place.\n\
    \n### 5.2.1 Initialization\n\nInitialization of a binary heap from a vector involves\
    \ a logical representation of a binary tree and reordering of the elements so\
    \ that they satisfy the heap property. We begin by describing the binary tree\
    \ structure used to represent the heap.\n\nThe binary tree structure comes from\
    \ corresponding the index of entries in the vector to level order position of\
    \ nodes in a complete binary tree. Index `0` of the vector corresponds to the\
    \ root of the binary tree. For a node at position `i` in the vector, the left\
    \ child is at position `2 * i + 1`, and the right child is at `2 * i + 2`. It\
    \ will be useful to have a method that computes these indexes.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.1: Heap Index of Children\n\n```cpp\nsize_t lchild_index(const size_t\
    \ index) {\n  return index * 2 + 1;\n}\nsize_t rchild_index(size_t index) {\n\
    \  return index * 2 + 2;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nNotice with this scheme the next available leaf node is the rightmost element\
    \ passed the end of the heap. The parent of a node at index `i` is located at\
    \ `(i - 1) / 2`. Integer division achieves rounding down.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.2: Heap Index of Parent\n\n```cpp\nsize_t parent_index(const size_t\
    \ index) {\n  return (index != 0) ? (index - 1) / 2 : 0;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nThe `heapify` operation starts with the single element of the vector at index\
    \ `0`. This single element sub-array trivially satisfies the heap property. The\
    \ operation next iteratively adds elements from the vector in such a way that\
    \ the heap property is maintained. Concretely, new elements are first added as\
    \ leaves. Afterward, parent and child pairs are repeatedly swapped if in violation\
    \ of the heap property. When the algorithm terminates, the maximum value of the\
    \ heap is at the first index and the heap property holds.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.3: Heap Creation Heapify\n\n```cpp\nvoid heapify(std::vector<int>*\
    \ array) {\n  for (auto itr = array->begin(); itr != array->end(); ++itr) {\n\
    \    auto index = itr - array->begin();\n    auto parent = parent_index(index);\n\
    \    while (index != parent && (*array)[parent] < (*array)[index]) {\n      std::swap((*array)[parent],\
    \ (*array)[index]);\n      index = parent;\n      parent = parent_index(index);\n\
    \    }\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nWhile a binary heap is not an optimally efficient heap structure, as we see\
    \ the binary heap can be constructed in-place instead of requiring memory allocation\
    \ for the tree. The timesavings realized from not having to allocate ancillary\
    \ objects often overcome the disadvantage of using a implementation optimized\
    \ for worst case.\n\n### 5.2.2 Insertion\n\nInsertion of a new value into a binary\
    \ heap begins with adding the value as the next available leaf node in the binary\
    \ tree. Afterward, the parent-child relationships are updated to satisfy the heap\
    \ property as done in `heapify`. Insertion requires the vector to be dynamically\
    \ resized, and hence not an in-place operation.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.4: Insert a Heap\n\n```cpp\nvoid insert(std::vector<int>* heap, int\
    \ value) {\n  heap->push_back(value);\n  auto index = heap->size() - 1;\n  auto\
    \ parent = parent_index(index);\n  while (index != 0 && (*heap)[index] > (*heap)[parent])\
    \ {\n    std::swap((*heap)[index], (*heap)[parent]);\n    index = parent;\n  \
    \  parent = parent_index(index);\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 5.2.3 Find maximum\n\nIn a binary heap, the `find_max` operation requires\
    \ dereferencing the first index of the vector. Correctness of this action is guaranteed\
    \ by the heap property.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.5: Find Maximum in a Heap\n\n```cpp\nint find_max(const std::vector<int>&\
    \ heap) {\n  return heap[0];\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 5.2.4 Remove maximum element\n\nRemoval of the maximum heap value must accomplish\
    \ two objectives aside replacing the value at the initial position. First, it\
    \ must promote the second minimum value to the first position. Doing so causes\
    \ the tree to pivot, and may have a cascading affect on the structure of the heap.\
    \ Secondly, the tree structure and parent-child relationships must be maintained.\n\
    \nBoth requirements are satisfied by the following sequence. First replace the\
    \ root value of the heap with the value of the last leaf node, and then resize\
    \ the array to the smaller size. This maintains the tree structure and removes\
    \ the maximum element from the array. We are required to then fix up the heap\
    \ property. In this operation, the heap property is maintained by iteratively\
    \ swapping parent-child pairs if in violation of the heap property.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.6: Remove Maximum from a Heap\n\n```cpp\nvoid remove_max(std::vector<int>*\
    \ heap) {\n  std::swap(*heap->begin(), *(heap->end() - 1));\n  heap->resize(heap->size()\
    \ - 1);\n  size_t index = 0;\n  while (index < heap->size()) {\n    auto child\
    \ = lchild_index(index);\n    if (child >= heap->size()) {\n      break;\n   \
    \ }\n    auto right = rchild_index(index);\n    if (right < heap->size() && (*heap)[right]\
    \ > (*heap)[child]) {\n      child = right;\n    }\n    if ((*heap)[index] >=\
    \ (*heap)[child]) {\n      break;\n    }\n    std::swap((*heap)[index], (*heap)[child]);\n\
    \    index = child;\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 5.2.5 Increase key\n\nWhen a key is increased in a max heap, the heap property\
    \ may no longer hold for that node and its parent. Hence, by increasing the value\
    \ of a key, we may need to decrease its index until the array has the heap property.\
    \ This is done by our standard practice of iteratively swapping.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.7: Increase a Key in a Heap\n\n```cpp\nvoid increase_key(std::vector<int>*\
    \ heap, size_t index) {\n  (*heap)[index]++;\n  auto parent = parent_index(index);\n\
    \  while (0 != index && (*heap)[index] > (*heap)[parent]) {\n    std::swap((*heap)[index],\
    \ (*heap)[parent]);\n    index = parent;\n    parent = parent_index(index);\n\
    \  }\n}\n```\n\nThis operation generalizes to decrease key and key change in the\
    \ obvious ways.\n\nThe stl provides a number of algorithms to create and manage\
    \ a binary heap. `make_heap` provides support for the initialization from a vector.\
    \ `pop_heap` implements remove maximum and `push_heap` provides insertion.\n\n\
    ## 5.3 Enumeration of powers\n\nSolving programming problems relies as much upon\
    \ choosing the correct data structure as it does the proper algorithm. Consider\
    \ the problem of enumerating powers of an initial set of non-negative numbers.\
    \ Concretely, given a set of integers the question is to list the powers of the\
    \ integers in increasing order without duplicates. For example, given the set\
    \ of 2, 3, 4, the first six powers would be 1 = 2⁰, 2 = 2¹, 3 = 3¹, 4 = 4¹ = 4,\
    \ 8 = 2³, 9 = 3² .\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.8: Enumeration of Powers\n"
