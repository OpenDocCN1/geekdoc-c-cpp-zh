  raw: 'Now to solve the problem efficiently with *A*^⋆ search, we would like to visit
    each node in order of its distance from the exit of the maze. The hope is that
    positions nearer the exit will have shorter paths to the exit.


    However, if we knew the actual distance we could solve the problem by traversing
    from the exit to the start. Instead we the heuristic that we want to visit the
    next node that is closest to the exit of the maze where distance is measured as
    if there was always a path directly from the node to the exit. So to apply *A*^⋆
    search, we will define a function which calculates the shortest possible distance
    between a position in the maze and the exit. While many metrics are available,
    we use Manhattan distance as our maze distance.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.16: Admissible Maze Distance Heuristic


       size_t distance(       const std::pair<size_t, size_t> begin,       const std::pair<size_t, size_t> end) {     return std::abs(begin.first - end.first) +            std::abs(begin.second - end.second);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    In solving the maze, we being at the start and continue as with dfs by iteratively
    constructing a path. However we use a priority queue instead of stack, where the
    distance heuristic gives the priority of a node. Nodes are considered in lowest
    priority value first. When the path reaches the exit, the path through the maze
    is reconstructed and the function terminates. If no solution exists, we return
    an empty path.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.17: Search through a maze.


       void maze(const GameBoard& maze,             const Position& start,             const Position& exit,             std::list<Position>⋆ route) {     static const std::vector<       std::pair<size_t, size_t>> offsets =         {{-1, 0}, {1, 0}, {0, -1}, {0, 1}};     std::map<Position,Position> parent;     std::priority_queue<       std::pair<size_t, Position>,       std::vector<std::pair<size_t, Position>>,       std::greater<std::pair<size_t, Position>>>         priority_queue;     priority_queue.push({distance(start, exit),                          start});     parent[start] = start;     while (!priority_queue.empty()) {       auto current = priority_queue.top().second;       if (exit == current) {         do {           route->push_front(current);           current = parent[current];         } while (current != start);         route->push_front(start);         return;       }       priority_queue.pop();       for (auto offset : offsets) {         auto neighbor =           Position(current.first + offset.first,                    current.second + offset.second);         if (neighbor.first < maze.size()             && neighbor.second               < maze[neighbor.first].size()             && parent.end()==parent.find(neighbor)             && passable(neighbor)) {           parent[neighbor] = current;           priority_queue.push(             {distance(neighbor, exit), neighbor});         }       }     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Notice that as with the boggle question, we use a static set of offsets to choose
    the next position in the maze. However since diagonal positions are not adjacent
    we have a restricted set of offsets. The parent variable serves two purposes;
    it is used to determine if a position has already been queued and it is used in
    reconstruction of the path. Finally, notice the declaration of priority_queue.
    In stl a priority_queue is a max-heap, so we must pass a comparator in the constructor.
    While this question had a longer solution than most, the basic framework is similar
    to that of *bfs* or *dfs*.


    ## Chapter 9


    Selection


    Selection is the last type of search we investigate.


    In programing, we define the median of an array in terms of the sorted order of
    the array. The median of an array of *n* values is the value of the element at
    index *n∕*2 in sorted order. That is if an array of values is ordered, the median
    is the value of the middle element. Although this definition is not the same as
    the statistical median, it is commonly useful in programming.


    Selection is a generalization of the problem of finding the median. Concretely,
    selection is the problem of finding the *k*^t*h* median of an array *A* of *n*
    elements. That is the element *x* such that there are exactly *k* - 1 elements
    in *A* which are less than or equal to *x*, and *n* - *k* - 1 elements of *A*
    greater than or equal to *x*


    As is often the case with algorithms, it is just as easy to handle the general
    case of selection instead of a specific case of finding the median. In the following
    we will see that doing so does not harm run time efficiency. It is just as efficient
    to find the element in the *k*^(th) position of a sorted array as it is to find
    the median of an array when the values in the array can be unbounded.


    In this section, we will provide a progression of solutions for the problem of
    selection. We begin with selection through sort, which is a simple but inefficient
    solution to the problem. We then look at a randomized selection algorithm, and
    improve it to deterministic bounds. We then conclude with a selection algorithm
    designed to operate over large data sets, a problem commonly asked at Google and
    Microsoft.


    ### 9.1 Selection through sort


    The simplest approach to selection is to pre-sort the array, and return the element
    that results in the *k*^(th) position. Using the stl implementation of sort, the
    method is simple to implement.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.1: Selection by Sorting


       int select(std::vector<int>⋆ array, size_t k) {       sort(array->begin(),            array->begin() + array->size());       return array->at(k);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    An implementation of the median from this method is simple. Recall both that arrays
    are 0 indexed, and from our definition above that we want the rightmost of two
    middle elements.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.2: Median by Sorting


       int median(std::vector<int>⋆ array) {     return select(array, (array->size() - 1) / 2);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This method always returns the correct answer, and it is hard to improve in terms
    of brevity. However it requires a full sort of the data. This turns out to be
    inefficient, as selection doesn’t require the full sort order. Instead we only
    need to know whether or not there are *k* smaller elements in the array. In order
    to improve the run time, we first look at the problem of finding a proper pivot
    for which to partition instead of pre-sorting.


    ### 9.2 The pivot and partition operation


    In binary search, we were able to cut the search space in half by knowing that
    every element with an index lower than the probe’s was smaller than the probe,
    and every element with an index higher than the probe was larger than the probe.
    Finding a good pivot element will allow similar narrowing of the search space
    in selection.


    This is achieved by pivoting an array on an element that is close to the median.
    Given a value and an array, the pivot operation leaves the array in a state where
    every element of the array smaller than the pivot precedes it, and every element
    in the array at least as larger as the pivot succeeds it.


    There are many methods of implementing a partition on an array. One could use
    a list and push back larger values and push front smaller values. In the sequel
    we implement an in place pivot which avoids memory allocation.'
