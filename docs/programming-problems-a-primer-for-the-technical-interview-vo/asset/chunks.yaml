    \n## 8.1 图的定义\n\n在开始之前，我们正式定义什么是图。图是一组具有边关系的顶点集合。如果两个顶点之间共享一条边，则它们是相邻的。相邻的顶点被称为\
    \ `neighbors`（邻居）。在无向图中，边是对称关系。也就是说，如果 `a` 和 `b` 是顶点，且 `(a,b)` 是一条边，那么 `(b,a)`\
    \ 也是一条边。如果边不是对称的，则该图是有向的。也就是说，如果 `(a,b)` 是一条边，`(b,a)` 不一定是边。我们用节点和邻接列表来表示图。图中的每个顶点将表示为一个\
    \ `node`（节点）。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 8.1：图节点\n```cpp\nstruct node {\n  int value;\n  std::vector<node*> neighbors;\n\
    };\n```\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n每个 `node` 都有一个存储为 `int` 类型的 `value`。源于顶的边存储在 `neighbors` 变量中。因此，`neighbors`\
    \ 包含了所有与节点相邻的顶点列表。如果对于图中的任意一对顶点 `a` 和 `z`，存在一个从 `a` 开始以 `z` 结束的顶点列表，其中列表中的每对顶点都是邻居，则该图是\
    \ `connected`（连通的）。这样的一个列表被称为 `path`（路径）。简单路径是不自相交的路径。图中的 `cycle`（环）是一个以相同节点开始并结束的节点列表，其中列表中的每对顶点都是邻居。树是不包含环的连通图。这使得树的遍历不需要担心无限循环。然而，在图遍历中，必须特别小心，以确保我们不会折回并陷入无限循环。\n\
    \n## 8.2 广度优先搜索\n\n通过广度优先搜索（简称 `bfs`），我们研究图搜索。`bfs` 从一个 `origin`（起点）节点开始，并按照距离起点的顺序访问图中所有可达的节点。从起点的边数衡量距离。`bfs`\
    \ 的特点是使用 `queue`（队列）来维护节点的访问顺序。`queue` 包含了搜索的前沿，即所有已知存在但尚未被访问的节点。\n\n如上所述，图节点之间可能存在环。为了避免在遍历图时折回，`bfs`\
    \ 必须跟踪所有访问过的节点，并且不要将节点多次添加到队列中。为了这一点，我们使用 `set`（集合）来跟踪历史。与树遍历一样，`bfs` 通常需要不仅仅是简单的队列中的每个节点。通常\
    \ `bfs` 的实现会接受一个通用的 `visit`（访问）函数，该函数在每次检查节点时被调用。我们使用以下定义一个 `visit` 函数。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 8.2：Visitor 类型\n```cpp\ntypedef std::function<void(node*)> Visitor;\n```\n\
    ![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n使用上述 `node`\
    \ 类，我们可以列出一个带有 `visit` 函数的 `bfs` 实现。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 8.3：广度优先搜索\n```cpp\nvoid bfs(node* origin, Visitor visit) {\n  std::set<node*>\
    \ queued;\n  std::queue<node*> queue;\n  queue.push(origin);\n  while (!queue.empty())\
    \ {\n    node* current = queue.front();\n    queue.pop();\n    visit(current);\n\
    \    for (auto neighbor : current->neighbors) {\n      if (queued.end() == queued.find(neighbor))\
    \ {\n        queued.insert(neighbor);\n        queue.push(neighbor);\n      }\n\
    \    }\n  }\n}\n```\n\n正如我们将看到的，`visit` 函数让 `bfs` 变得强大。\n\n### 8.2.1 计算图中节点之间的距离\n\
    \n由于 `bfs` 按照距离起点的顺序访问每个节点，因此它可以用于求解从 `origin` 到图中其他节点的最小距离问题。在执行时，我们为所有边权重相等的情况实现了\
    \ Dijkstra 算法的一个特例。\n\n该思想是在节点加入队列时更新其已知距离。这样做需要跟踪节点的状态。`get_distance` 函数将未访问节点设置为无穷大。当遇到一个节点时，所有的子节点都被赋予与父节点相同的距离。由于\
