    \ decimal digits. Below we implement radix sort on hexadecimal digit representations\
    \ of integers.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 10.4: Radix Sort\n\n```cpp\nvoid radix_sort(std::vector<int>* array)\
    \ {\n  std::vector<std::vector<int>> buckets(0xf + 1);\n  for (size_t byte = 0;\
    \ byte < sizeof(int); ++byte) {\n    unsigned int offset = byte * 4;\n    unsigned\
    \ int mask = 0xf << offset;\n    for (auto& val : *array) {\n      auto bucket\
    \ = (mask & val) >> offset;\n      buckets[bucket].push_back(val);\n    }\n  \
    \  size_t index = 0;\n    for (auto& bucket : buckets) {\n      for (auto& val\
    \ : bucket) {\n        array->at(index++) = val;\n      }\n      bucket.clear();\n\
    \    }\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nRadix sort is only optimal for fixed length data, such as integers bounded by\
    \ some maximum. In order to bucket the input, radix sort requires external memory\
    \ and is not in-place. Radix sort is a stable sort, as the relative order of values\
    \ is maintained through each iteration of the algorithm.\n\n## 10.5 Merge sort\n\
    \nMerge sort is another divide-and-conquer algorithm for sorting. The idea springs\
    \ from the observation that if one starts with two sorted sub-arrays, it is simple\
    \ to combine them into a single sorted array. This can be done by first comparing\
    \ the smallest elements of each array for the minimum. That element is removed\
    \ from its current array and added to the result, and the process iterates. Since\
    \ the original arrays are sorted, this involves only a linear scan. So all that\
    \ is left is how to divide. But as with quick sort we can always divide input\
    \ into smaller halves until we are left with individual units from which we can\
    \ begin to combine into sorted output.\n\nIn-place merge is a difficult algorithm\
    \ to implement; however, it is provided by stl as the function `inplace_merge`.\
    \ Leveraging this, we have a parsimonious implementation of in-place merge sort\
    \ in C++.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 10.5: Merge Sort\n\n```cpp\nvoid merge_sort(std::vector<int>::iterator\
    \ begin, std::vector<int>::iterator end) {\n  size_t len = end - begin;\n  if\
    \ (1 >= len) return;\n  size_t prefix_len = len / 2;\n  merge_sort(begin, begin\
    \ + prefix_len);\n  merge_sort(begin + prefix_len, end);\n  std::inplace_merge(begin,\
    \ begin + prefix_len, end);\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nAs the merge is in-place, this implementation requires only memory allocation\
    \ on the stack. However the recursive calls may require up to logarithmic extra\
    \ space. Merge sort can be implemented as a stable sort.\n\nWhile worst case behavior\
    \ is asymptotically equivalent to that of quick sort, it has been argued that\
    \ in-place quick sort is faster in practice. There are many possible reasons for\
    \ this, including optimization of the inner loop of quick sort and lower stack\
    \ space requirements. However, merge sort is the obvious choice when sorting large\
    \ data.\n\n## 0.6 Sorting over large data\n\nA favorite interview question at\
    \ Google asks to sort 4GB of data using only 100MB of memory. While the specific\
    \ limits may change, the key insight is to merge sort to accomplish sorting over\
    \ large data. This is an exercise in partitioning and merging. First each contiguous-array\
    \ of the smaller bound of data should be sorted with quick sort. Doing so is fast,\
    \ in place, and requires only a constant amount of memory. Afterward, each of\
    \ these sub-arrays are merged as merge sort. A sample implementation of the merge\
    \ is provided below.\n\n![](tmp_de4baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nListing 10.6: Large Data with Merge Sort\n\n```cpp\nvoid merge_vectors(const\
    \ std::vector<std::vector<int>>& in, std::vector<int>* out) {\n  typedef std::vector<int>\
    \ Array;\n  typedef Array::const_iterator Iterator;\n  typedef std::tuple<Iterator,\
    \ Iterator> Element;\n  std::vector<Element> heap;\n  for (int index = 0; index\
    \ < in.size(); ++index) {\n    if (!in[index].empty()) {\n      Element tuple(in[index].begin(),\
    \ in[index].end());\n      heap.push_back(tuple);\n    }\n  }\n  auto comparator\
    \ = [](const Element& lhs, const Element& rhs) {\n    return std::get<0>(lhs)\
    \ < std::get<0>(rhs);\n  };\n  std::make_heap(heap.begin(), heap.end(), comparator);\n\
    \  while (!heap.empty()) {\n    auto tuple = heap.front();\n    std::pop_heap(heap.begin(),\
    \ heap.end(), comparator);\n    out->push_back(*std::get<0>(tuple));\n    if (std::get<1>(tuple)\
    \ != ++std::get<0>(tuple)) {\n      heap.push_back(tuple);\n      std::push_heap(heap.begin(),\
    \ heap.end(), comparator);\n    }\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n## Afterward\n\nAnd with that, we complete this step in our journey. I hope\
