  trans: "\n\n在技术面试结束后，反馈会被汇总成一份招聘包并做出决定。在微软，招聘经理通常会在当天做出决定，候选人可以预期在周内接到带有录取意向（offer）的电话。在谷歌和脸，反馈由当地招聘委员会做出，并转发到最终招聘委员会。该委员会是对面试官共识的某种“合理性检查”，旨在维持高标准的招聘要求。这一过程的代价是，在面试轮次（loop）结束后几周，候选人才能获得录取或不予录取的决定。\n\
    \n请记住，在一次面试中单次数的“不录取”通常不足以停止流程。然而，一系列的“不录取”和非常弱的“录取”，或者持续无法回答基础问题，显然是足够的。招聘经理或招聘委员会寻找的是面试官对其决定的信心、候选人展示的知识广度、良好的沟通能力，以及对这个问题的回答：“该候选人符合我们的标准吗？”\n\
    \n### 1.3 方法论\n\n一个好的面试题有很多正确答案，但在时间或空间上始终至少有一个最优解。达到最优需要需要对基础知识的掌握：数据结构、内存管理、迭代风格和搜索技术。\n\
    \n了解如何处理技术问题至关重要。每位候选人都应该学会花时间考虑所有这些角度。请从容来。毕竟，如果面试官要求你为二叉搜索树编写最小公共祖先（lowest common\
    \ ancestor），而你却按无结构二叉树的方法来处理，那么你就犯了一个会导致你失去机会的错误。\n\n有一种简单且自然的解决问题方法，我所有准备充分的候选人都会采用。这些步骤是：重述问题、理解需求、草拟方案、编码和测试。让我们逐一通过这些步骤。\n\
    \n首先，重述问题。你应该寻找歧义之处，如果发现，通过提议修改或要求澄清来继续。歧义有多种形式，所以要留留意未定义的行为和边界情况（corner cases）。\n\
    \n其次，确保你理解了边界情况，并尽可能消除了歧义。与面试官一起做几个测试用例。写下输入和预期输出，并将它们留在黑板上以便以后参考。这些用例在草拟和测试期间将非常有用。\n\
    \n第三，在黑板上草画程序。不要占据整个黑板，因为你接下来需要写代码。但在你演示解决方案时，你需要一些可以参考的东西。你的草图应该足够展示你的主处理路径需要写的内容，以及你需要编写哪些辅助函数。你的草图也应该完整，足以评估你算法的渐进复杂度。\n\
    \n第四，正确地编写程序。这一点怎么强调都不为过：最好第一次就做对。许多候选人询问是否可以跳过错误检查、边界条件或他们认为对当前问题不核心的辅助函数。不要这样做。要明白为什么，只需比较两个候选人：一个人在写完原型后会自动开始检查\
    \ `nullptr` 参数和缓冲区长度；而另一个候选人则挥了挥手说他稍后会进行正常的错误和边界检查。在其他条件相同的情况下，第一个候选人是更好的面试者。这是因为他证明了自己可以第一次做对。\n\
    \n第五，也是最后，从第二步的测试用例运行到你在黑板上写的代码。这让你有一个机会向面试官展示你是如何测试的，同时也让你能用新的眼光审视自己的代码。也许你更改了变量名、漏掉了一个边界情况，或者不恰地更改了辅助函数的原型。通过执行测试用例，这些问题将被避免。就是这样。重述问题，写下一些测试用例，草画你的方法，编写程序并进行测试。这听起来很熟悉；因为面试和日常编程具有相同的工作流绝非偶然。\n\
    \n解决编程问题比讨论处理它们的策略要有趣得多，所以让我们开始吧。首先是回顾编程基础。\n\n## 第 2 章：列表 (Lists)\n\n我们数据类型的引用部分从链表开始。\n\
    \n链表是一种基础数据结构，通常用作栈和队列等结构的底层数据类型。链表的优点是具有常数时间的插入和删除，但代价是线性时间的搜索开销。这是因为链表不支持随机访问；因此，搜索和删除需要对链表进行全扫描。\n\
    \n列表的常见编程问题通常是识别边界情况、巧妙的遍历技术以及对临时变量审慎使用的练习。在本节中，我们将实现链表及其操作，然后解决许多关于链表的基础问题。\n\
    \n### 2.1 定义\n\n链表是由列表节点组成的结构。列表节点包含该节点的一些数据，以及一个指向链表中下一个节点的指针。在下文中，我们将使用下面的定义表示节点。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 2.1：链表节点\n\n```cpp\nstruct node {\n    node* next;\n    int data;\n    explicit\
    \ node(int data) : node(nullptr, data) {}\n    node(node* head, int data) : next(head),\
    \ data(data) {}\n};\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n它们的第一个节点被称为头节点（head），用于标识列表。列表实例仅仅是指向头节点的指针。空列表被标识为头节点为 `nullptr`。像 C/C++ 中的许多数据结构一样，即使是简单的操作也需要内存管理。我们假设列表操作由调用者分配和释放内存。\n\
    \n### 2.2 操作\n\n链表的基本操作有 `insert`（插入）、`find`（查找）和 `remove`（删除）。更复杂的操作可以基于这些操作构建。在下一节中，我们将实现每个基本操作。\n\
    \n#### 2.2.1 插入\n\n链表的插入是常数时间的，因为该数据类型仅支持 `push-front`（头部插入）操作。即当前的列表头被一个带有指定值的新节点替换。插入有两个特殊情况：向空列表插入和向头部插入。然而，通过数据结构构造函数的完整列表，这种复杂性很容易消除，代价是需要调用者用插入结果更新头节点。\n\
    \n```cpp\nnode* insert(node* head, int data) {\n    return new node(head, data);\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 2.2：向链表插入\n\n面试经常要求向有序列表插入。候选人提出的巧妙问题是如果数据需要保持排序，列表是否是正确的容器选择。但在回答这个问题时，边界情况是向列表的头部或尾部插入。要在有序链表中插入，我们需要寻找数据应该插入位置的前驱节点。找到后，我们构造新节点，并通过更新相应的\
    \ `next` 成员变量将其拆接到列表中。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 2.3：向有序链表插入\n\n"
- fmt: "\n```cpp\nnode* insert_sorted(node* head, int data) {\n  if (nullptr == head\
    \ || data <= head->data) {\n    return new node(head, data);\n  }\n  auto current\
    \ = head;\n  while (nullptr != current->next && (current->next->data < data))\
    \ {\n    current = current->next;\n  }\n  if (nullptr == current->next) {\n  \
    \  current->next = new node(data);\n  } else {\n    current->next = new node(current->next,\
    \ data);\n  }\n  return head;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n## 2.2.2 Find\n\nBecause random access is not supported, the only traversal\
    \ supported considers each node in turn. Hence search in a linked-list is a linear\
    \ time operation. As such, when retrieving a node of a linked-list by key we must\
    \ scan until a target has been located or every node has been considered. This\
    \ is implemented in the `find` operation.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.4: Find in a Linked-List\n\n```cpp\nnode* find(node* head, int\
    \ value) {\n  while(nullptr != head && head->data != value) {\n    head = head->next;\n\
    \  }\n  return head;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n## 2.2.3 Removal\n\nRemoval of data from a linked-list takes a reference to\
    \ a node as an identifier. The boundary cases are removal of the head or tail,\
    \ and deletion from single item list. Removal of the head requires special care\
    \ because lists are identified by their head. If that is removed, then the pointer\
    \ to the head needs to be returned to the caller. A simpler method is to copy\
    \ data of the successor into the head. However this trick requires special casing\
    \ the single item list. As above, we require the caller to update the head after\
    \ calling `remove`. Removal from the tail requires maintenance of the predecessor.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n### Listing\
    \ 2.5: Remove from a Linked-List\n\n```cpp\nnode* remove(node* head, node* target)\
    \ {\n  if (head == target) {\n    head = head->next;\n    delete target;\n   \
    \ return head;\n  }\n  auto temp = head;\n  while (nullptr != temp->next && target\
    \ != temp->next) {\n    temp = temp->next;\n  }\n  if (target == temp->next) {\n\
    \    temp->next = temp->next->next;\n    delete target;\n  }\n  return head;\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n\
    Note that as the target of removal was a parameter, we can assume it was not the\
    \ `nullptr` and the list was not empty. For this reason we did not verify the\
    \ head of the list was not the `nullptr`. We will follow this pattern in the sequel.\n\
    \n## 2.3 Circular linked-lists\n\nA common modification to linked-lists is called\
    \ a circular linked-list. The structure defining a node in a circular linked-list\
    \ is identical to that of a node in a simple linked-list. However, the update\
    \ and remove rules are modified to maintain that the tail of the list points back\
    \ to the head.\n\nInsertion into a circular linked-list is similar to that in\
    \ a standard list except the head element must reference itself in a list of length\
    \ 1. We also lose the idea of simply replacing the head with a newly allocated\
    \ pointer, since the tail refers to the head.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.6: Insert into a Circular Linked-List\n\n```cpp\nnode* circular_insert(node*\
    \ head, int data) {\n  auto insertion = new node(data);\n  if (nullptr == head)\
    \ {\n    insertion->next = insertion;\n    return insertion;\n  }\n  if (head\
    \ == head->next) {\n    head->next = insertion;\n    insertion->next = head;\n\
    \    return insertion;\n  }\n  std::swap(head->data, insertion->data);\n  insertion->next\
    \ = head->next;\n  head->next = insertion;\n  return head;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nRetrieval in a circular linked-list is almost as simple as that in a simple\
    \ linked-list. Again, the entire list must be enumerated until the value has been\
    \ found or every node has been visited. Unlike in a simple linked-list, termination\
    \ of the search cannot rely on finding a `nullptr`. Instead we must cache a pointer\
    \ to the head and use it to determine when the list has looped back.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.7: Find in a Circular Linked-List\n\n```cpp\nnode* circular_find(node*\
    \ head, int value) {\n  auto current = head;\n  while(nullptr != current && current->data\
    \ != value) {\n    current = current->next;\n    if (current == head) {\n    \
    \  return nullptr;\n    }\n  }\n  return current;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nRemoval from a circular linked-list is more complex than removal in a simple\
    \ linked-list. As with insertion, this is because the tail element refers the\
    \ head element. To get around this, we do not remove the desired node, but instead\
    \ all the elements of a list around it. This avoids the problems of updating the\
    \ predecessor’s `next` member. Removal also requires checking the boundary case\
    \ where there is a single element in the circular linked-list. Then we must clear\
    \ the list entirely.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.8: Remove from a Circular Linked-List\n\n```cpp\nnode* circular_remove(node*\
    \ head, node* target) {\n  if (head == head->next) {\n    delete head;\n    return\
    \ nullptr;\n  }\n  auto next = target->next;\n  target->data = next->data;\n \
    \ target->next = next->next;\n  delete next;\n  return target;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n## 2.4 Doubly linked-lists\n\nDoubly linked-lists are lists in which each node\
    \ has both a pointer to the next element in the list as well as the previous element\
    \ in the list. A simple doubly linked-list has a head with `nullptr` as its previous\
    \ member, and a tail with `nullptr` as its next member. Doubly linked-lists can\
    \ also be circular, with single element lists having both the head and tail referencing\
    \ the same node. In the following examples we implement circular doubly linked-lists.\n\
    \nThe constructor for a doubly linked-list is only a simple modification of a\
    \ simple linked-list node where a `prev` member variable is added.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.9: Doubly Linked-List Node\n\n```cpp\nstruct dll_node {\n  dll_node*\
    \ prev;\n  dll_node* next;\n  int data;\n  explicit dll_node(int data) : dll_node(this,\
    \ this, data) {}\n  dll_node(dll_node* prev, dll_node* next, int data) : prev(prev),\
    \ next(next), data(data) {}\n};\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nInserting and removing from a circular doubly linked-list integrates inserting\
    \ into a standard linked-list and the semantics of a circular linked-list. The\
    \ implementation below pushes the list forward and inserts a new head. This is\
    \ done by first setting the `next` and `prev` members appropriately, and then\
    \ correcting the list structure before returning.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.10: Insert into a Doubly Linked-List\n\n```cpp\ndll_node* insert(dll_node*\
    \ head, int data) {\n  if (nullptr == head) return new dll_node(data);\n  auto\
    \ insertion = new dll_node(head->prev, head, data);\n  insertion->prev->next =\
    \ insertion;\n  insertion->next->prev = insertion;\n  return insertion;\n}\n```\n"
