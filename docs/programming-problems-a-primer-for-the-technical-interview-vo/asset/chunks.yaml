    ## Chapter 8


    Graphical Search


    We have already considered search over a binary search tree, now we consider search
    over general graphs. The most common graphical search algorithms are breadth first
    search and depth first search. In the following sections, we will look at basic
    implementation of each of these search algorithms. Afterward we will solve programming
    problems with these search techniques.


    ### 8.1 Definition of a graph


    Before we begin, we formally define a graph. A graph is a collection of vertices
    with edge relations. Two vertices are adjacent if they share an edge between them.
    Adjacent vertices are called neighbors. In an undirected graph, edges are symmetric
    relations. That is if *a* and *b* are vertices, and (*a,b*) is an edge then (*b,a*)
    is also an edge. A graph is directed if edges are not symmetric. That is if (*a,b*)
    is an edge, (*b,a*) is not necessarily an edge.


    We represent graphs with nodes and adjacency lists. Each vertex in a graph will
    be represented as a node data structure.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.1: Graph node


       struct node {     int value;     std::vector<node⋆> neighbors;   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Each node has a value stored as the int type member variable. The edges originating
    at a node are stored in the vector member variable neighbors. As such, neighbors
    contains the list of all vertices adjacent to the node.


    A graph is *connected* if for any pair of vertices *a* and *z* in the graph, there
    is a list of vertices starting with *a* and ending with *z* in which every adjacent
    pair in the list are neighbors. Such a list is called a *path*. A simple path
    is one that does not intersect itself. A *cycle* in a graph is a list of nodes
    starting and ending with the same node in which every adjacent pair in the list
    are neighbors. Trees are connected graphs that do not contain cycles. This allowed
    tree traversal algorithms to not need to worry about infinite loops. However in
    graph traversals special care must be taken to ensure we do not double back and
    be caught in an infinite loop.


    ### 8.2 Breadth first search


    With breadth first search, abbreviated *bfs*, we study our first graph search
    algorithm. *bfs* starts from an origin node and visits all reachable nodes in
    a graph in order of their distance from the origin. The number of edges from the
    origin measures distance. *bfs* is characterized by the use of a queue to maintain
    the order in which nodes are visiting. The queue contains the known frontier of
    the search, which are all nodes that are known to exist but have not yet been
    visited.


    As mentioned above, graphs can have cycles between the nodes. To avoid doubling
    back while traversing the graph *bfs* must keep track of all visited nodes and
    not add nodes multiple times to the queue. To do this, we use a set to track our
    history.


    As with tree traversal, *bfs* is usually required to do more than simply pop every
    node from the queue. Often *bfs* is implemented to take a general visit function
    that is called each time a node is examined. We use the following definition for
    a visit function.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.2: Visitor Functional


       typedef std::function<void(node⋆)> Visitor;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Using the node class above we can list an implementation of *bfs* with a required
    function parameter called visit.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.3: Breadth First Search


       void bfs(node⋆ origin, Visitor visit) {     std::set<node⋆> queued;     std::queue<node⋆> queue;     queue.push(origin);     while (!queue.empty()) {         node⋆ current = queue.front();         queue.pop();         visit(current);         for (auto neighbor : current->neighbors) {           if (queued.end()               == queued.find(neighbor)) {             queued.insert(current);             queue.push(neighbor);           }         }     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    As we will see, it is the visit function makes bfs powerful.


    #### 8.2.1 Find the distance between nodes in a graph.


    Since *bfs* visits each node in order of its distance from the origin, it can
    be used to solve the problem of finding the minimal distance from an origin to
    all other nodes in a graph. In doing so we implement a special case of Dijkstra’s
    algorithm for the case where all edges are of equal weight.


    The idea is to update the known distance of a node when we first add it to the
    queue. Doing so will require keeping track of the state of node exploration. The
    functional get_distance sets distance of unvisited nodes to infinity. When a node
    is first encountered, all the children are given distance equal to the distance
    of the parent plus one. Since *bfs* visits each node in order of its distance,
    a parent’s distance will always be set before a child is encountered. Translating
    this into code, we have the following listing.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.4: Shortest Path Distances


       void find_distances(       node⋆ origin,       std::map<node⋆, size_t>⋆ distances) {     auto distance = [distances] (node⋆ vertex) {       auto distance_itr = distances->find(vertex);       if (distances->end() == distance_itr) {         return std::numeric_limits<size_t>::max();       }       return distance_itr->second;     };        auto visit = [distances, distance] (         node⋆ vertex) {       if (distances->empty()) (⋆distances)[vertex]=0;       for(node⋆ neighbor: vertex->neighbors) {         auto vertexDistance = distance(vertex);         auto neighborDistance = distance(neighbor);         (⋆distances)[neighbor] =           std::min(neighborDistance,                    1 + vertexDistance);       }     };        bfs(origin, visit);   }


