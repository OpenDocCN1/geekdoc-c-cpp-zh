    you present your solution. Your sketch should be enough to show what you’ll need
    to write for your main processing path and what helper functions you’ll need to
    write. Your sketch should also be complete enough to gauge the asymptotic run
    time of your algorithm.


    Fourth, write the program correctly. It cannot be said enough; you are best off
    to do it right the first time. Many candidates ask if they can skip error checking,
    boundary conditions, or helper functions that they believe are not core to the
    problem at hand. Do not do this. To see why simply compare two candidates, one
    in which after writing the prototype the candidate automatically begins checking
    for a nullptr argument and buffer length, and another in which the candidate waves
    his hand and says that he will do normal error and bounds checking later. All
    else being equal the first candidate is the better interview. And that is because
    he showed he could do it right the first time.


    Fifth and lastly, run your test cases from the second step through the code you
    wrote on the board. This gives you a chance to show the interviewer how you test,
    and also lets you see you own writing with fresh eyes. Perhaps you changed a variable
    name, missed a boundary case, or improperly changed a helper function prototype.
    By stepping through your test cases these problems will be avoided. And that is
    it. Restate the problem, write down some test cases, sketch you approach, write
    the program, and test it. This should sound familiar; because its no coincidence
    that interviewing and every day programming have the same workflow.


    Working through programming problems is much more enjoyable than talking about
    strategies on how to approach them, so lets begin. First up is a review of the
    fundamentals of programming.


    ## Chapter 2


    Lists


    We begin our reference section on data-types with the linked-list.


    A linked-list is a basic data structure often used as the underlying data type
    of other structures such as stacks and queues. Linked-lists benefit from constant
    time insertion and removal, but come at the cost of linear time search. This is
    because linked-lists do not support random access; hence, search and removal require
    a full scan of the linked-list.


    Common programming problems for lists are often exercises in identifying boundary
    cases, clever traversal techniques, and judicious use of temporary variables.
    In this section, we will implement a linked-list and its operations, and then
    solve many of the basic questions about linked-lists.


    ### 2.1 Definition


    A linked-list is a structure composed of list nodes. A list node contains some
    data for the node, as well as a pointer to the next node in the list. In the following,
    we will use the definition below for a node.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.1: Linked-List node


       struct node {     node⋆ next;     int data;     explicit node(int data) : node(nullptr, data) {}     node(node⋆ head, int data)       : next(head), data(data) {}   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Their first node, referred to as the head, identifies lists. A list instance is
    simply a pointer to the head. Empty lists are identified as those whose head is
    nullptr. As with many basic data structures in C/C++, memory management is required
    for even simple operations. We make the assumption that list operations are required
    to allocate and free memory for the caller.


    ### 2.2 Operations


    The basic operations of a linked-list are insert, find, and remove. More complex
    operations can be built up from these operations. In the next section we implement
    each of the basic operations.


    #### 2.2.1 Insertion


    Insertion in a linked-list is constant time because the data-type supports only
    a push-front operation. That is the current head of the list is replaced with
    a new node with the specified value. There are two special cases for insertion,
    inserting into an empty list and inserting into the head of a list. However, with
    a complete listing of the constructors of the data structure, this complexity
    is easily removed at the cost of requiring the caller to update the head with
    the result of the insertion.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.2: Insert into a Linked-List


       node⋆ insert(node⋆ head, int data) {     return new node(head, data);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Interviews often ask for insertion into a sorted list. A clever question for a
    candidate to ask is that if the data needs to remain sorted if a list was the
    right choice of container. But when answering this question the boundary cases
    are inserting into the head or tail of the list. To insert into a sorted linked-list,
    we look for the predecessor of where the data should be inserted. When found,
    we construct a new node, and splice it into the list by updating the proper next
    member variables.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.3: Insert into a Sorted Linked-List'
