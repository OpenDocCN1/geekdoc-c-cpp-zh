    \ the binary search update rule to use modulo arithmetic. Concretely, if `n` is\
    \ the length of the array, we could set `lower = j`, `upper = j + n – 1 (mod n)\
    \ = j – 1 (mod n)`, and `mid = lower + (upper - lower)∕2 (mod n)`. Our binary\
    \ search is then correct. This is implemented below.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
