  raw: 'When an element is inserted into a hash table with separate chaining, it is
    simply pushed onto the list stored at the bucket. This provides constant time
    insertion. It also guarantees that an item can be retrieved once it has been inserted
    as there is no eviction.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.10: Insert with Separate Chaining


       void insert(Hashtable⋆ table, Item⋆ entry) {     auto index = hash_function(entry->key)                  % table->size();     (⋆table)[index].push_back(entry);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Retrieval from separate chaining requires enumerating the lists to complete the
    search for an entry. As above, we must ensure the element’s key matches the parameter.
    That this is requirement is clear, as with separate chaining it is common for
    the table to have multiple entries with the same hash value.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.11: Find with Separate Chaining


       Item⋆ find(Hashtable⋆ table,              const std::string& key) {     int index = hash_function(key) % table->size();     for (auto entry: (⋆table)[index]) {       if (key == entry->key) return entry;     }     return nullptr;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Dynamic resizing with separate chaining takes only a little more effort, as each
    list in each bucket must be enumerated. Aside from this caveat, implementation
    of dynamic resizing is straightforward.


    #### 6.4.2 Open addressing


    Open addressing is a scheme by which collisions are resolved by inserting an element
    at the next available bucket in the hash table given some iteration scheme. Commonly,
    open addressing involves simply iterating through the table. This is called open
    addressing with linear probing. However, open addressing can be implemented by
    other probing schemes such as successively doubling the index value. If no available
    bucket is found, the table is dynamically resized and the insert resumes. Note
    that after resizing, we are guaranteed to find an available bucket. Dynamically
    resizing and a possible linear time enumeration are the cost the hash table pays
    for guaranteeing retrieval.


    We implement a hash table supporting open addressing with linear probing. Insertion
    is only a matter of finding an open bucket.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.12: Insert with Open Addressing


       void insert(Hashtable⋆ table, Item⋆ entry) {     while (true) {       auto index = hash_function(entry->key)                    % table->size();       for (size_t offset = 0;            offset < table->size();            ++offset) {         size_t bucket_index = (index + offset)                               % table->size();         if (nullptr == (⋆table)[bucket_index]) {           (⋆table)[bucket_index] = entry;           return;         }       }       resize(table, table->size() ⋆ 2 + 1);     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    To ensure that a false negative is not returned on lookup, an open addressing
    scheme must iterate through all successive buckets to ensure that an entry is
    not present at successive location. Caution must be exercised to not loop continuously.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.13: Find with Open Addressing


       Item⋆ find(Hashtable⋆ table,              const std::string& key) {     size_t index = hash_function(key)                    % table->size();     for (size_t offset = 0;          offset < table->size();          ++offset) {       auto bucket_index = (index + offset)                           % table->size();       auto& item = (⋆table)[bucket_index];       if (nullptr == item) return nullptr;       if (key == item->key) return item;     }     return nullptr;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    #### 6.4.3 Cuckoo hashing


    Cuckoo hashing is a modern approach to collision resolution that provides expected
    constant time lookup and insertion when the load of the table is low. Instead
    of linear probing, cuckoo hashing uses a combination of two hash functions and
    two tables to find the next available bucket for a value. The hash functions and
    tables are labeled primary and secondary, corresponding to the order they are
    probed.


    To realize expected constant time operations, cuckoo hashing requires a more complex
    definition for the hash table. We use a structure to group the members.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.14: Definition of Hashtable with Cuckoo Hashing


       struct CuckooHashTable {     typedef std::function<       size_t(const std::string&)>         HashFunction;     typedef HashFunction CuckooHashFunctions[2];     typedef Hashtable CuckooHashTables[2];        CuckooHashFunctions hash_functions;     CuckooHashTables hash_tables;        explicit CuckooHashTable(size_t size);     void insert(Item⋆ entry);     void resize(size_t size);     Item⋆ find(const std::string&);   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Insertions begin by checking the first table. If the hash value bucket is occupied,
    its contents are replaced with the new entry and the old entry is promoted to
    the second table. This process repeats until all entries are added or else an
    infinite loop is detected. In the later case, the table is resized and the process
    continues. In the code below, we use table_index to track if we are operating
    on the primary or secondary table. The set is used to detect if a loop is encountered.
    Also we use references to make the code easier to read.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.15: Insert with Cuckoo Hashing


       void CuckooHashTable::insert(Item⋆ entry) {     std::set<size_t> visited[2];     size_t table_index = 0;     size_t index;     do {       auto& table = hash_tables[table_index];       auto hashfn = hash_functions[table_index];       index = hashfn(entry->key) % table.size();       if (nullptr == table[index]) {         table[index] = entry;         return;       }       std::swap(entry, table[index]);       visited[table_index].insert(index);          table_index = 0 == table_index ? 1 : 0;     } while (visited[table_index].end()              == visited[table_index].find(index));     resize(hash_tables[0].size() ⋆ 2 + 1);     insert(entry);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The resize is necessary if an infinite loop is detected. With a poor choice of
    hash function, it is possible for the insert-resize process to also loop. To insure
    against this it is advisable to update the hash function during resize. Other
    than that, the resize member is straightforward.


    Lookup in a hash table with cuckoo hashing must determine if the key is in the
    first or second table. The later check is only needed when the hash table bucket
    in the first table is occupied by an element not equal to the value seen.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.16: Find with Cuckoo Hashing


       Item⋆ CuckooHashTable::find(       const std::string& key) {     for (size_t table_index = 0;          table_index < 2;          ++table_index) {       auto& table = hash_tables[table_index];       auto hashfn = hash_functions[table_index];       auto index = hashfn(key) % table.size();       if (nullptr == table[index]) return nullptr;       if (key == table[index]->key) {         return table[index];       }     }     return nullptr;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This concludes our overview of the fundamentals of hash tables. The stl provides
    a templated implementation of a hash table with the unordered_map container class.
    When appropriate, this class will be used in the sequel.


