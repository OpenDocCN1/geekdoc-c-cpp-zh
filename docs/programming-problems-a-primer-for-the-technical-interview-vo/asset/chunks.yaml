  trans: "\n\n队列是一种抽象数据结构，它保持其数据的先进先出（FIFO）顺序。队列数据结构只有两个基本操作：`enqueue`（入队）和 `dequeue`（出队）。`enqueue`\
    \ 将数据推入队列的末尾，而 `dequeue` 从队列头部移除数据。在高效的实现中，这些操作可以在常数时间内完成。\n\n队列可以通过双向链表轻松实现。`enqueue`\
    \ 将一个项添加到列表的尾部，而 `dequeue` 移除当前的头节点，并将其替换为列表中的下一个节点。\n\n以下是使用 `std::list` 提供的双向链表数据结构的队列示例实现。`enqueue`\
    \ 操作被称为 `push`，而 `dequeue` 操作被称为 `pop`。为了访问队列中的数据，我们提供了一个名为 `front` 的方法，它会暴露队列头部节点的值。\n\
    \n由于其简单性，将队列呈现为一个类比于一组相关方法更为清晰。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 4.1：队列类\n\n```cpp\nclass queue {\n  public:\n    void push(int data) {\n\
    \      list.push_back(data);\n    }\n    int front() {\n      return list.front();\n\
    \    }\n    void pop() {\n      list.pop_front();\n    }\n  private:\n    std::list<int>\
    \ list;\n};\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n注意，stl 提供了名为 `std::queue` 的队列模板实现。\n\n## 4.2 栈\n\n栈是一种抽象数据类型，它提供对底层数据的后进先出（LIFO）访问。与队列相比，它提供了一种反向访问。与队列一样，栈暴露了两个操作。这些是\
    \ `push` 和 `pop`。`push` 将数据存储在栈顶，`pop` 从栈顶移除数据。在高效的实现中，这些操作在常数时间内运行。\n\n栈可以通过简单的单链表轻松实现。列表不需要是循环或双向链的，因为栈只访问头部。`push`\
    \ 操作在头部插入节点，而 `pop` 操作移除头部。\n\n以下是使用 `std::list` 提供的链表数据结构的栈示例实现。为了访问栈中的数据，我们提供了一个名为\
    \ `top` 的方法，它会暴露栈顶节点的值。\n\n由于其简单性，将栈呈现为一个类比于一组相关方法更为清晰。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 4.2：栈类\n\n```cpp\nclass stack {\n  public:\n    void push(int data) {\n \
    \     list.push_front(data);\n    }\n    int top() {\n      return list.front();\n\
    \    }\n    void pop() {\n      list.pop_front();\n    }\n  private:\n    std::list<int>\
    \ list;\n};\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n注意，stl 提供了名为 `std::stack` 的栈模板实现。我们将在随后的内容经常使用它。\n\n## 4.3 使用栈实现队列\n\n一个常见的编程问题是用栈来实现队列。其目标是展示这两种基本数据类型能力的等效性。\n\
    \n解决这个问题的关键在于理解栈和队列在访问方式上是相反的，而且没有机制能仅通过单个栈就实现队列。解决方案是使用两个栈来影响数据的反转。\n\n在下方的解决方案中，我们有两个名为\
    \ `in-stack` 和 `out-stack` 的栈。`in-stack` 允许在常数时间内入队。每个队列 `push` 操作都被翻译为栈的 `push`\
    \ 操作。\n\n为了支持先进先出，当执行 `dequeue` 操作时，我们必须能够到达 `in-stack` 的底部。为了做到，我们只需要将 `in-stack`\
    \ 清空到 `out-stack` 中。注意，最后进入的元素位于 `in-stack` 的顶部，转移后它就位于 `out-stack` 的底部。`out-stack`\
    \ 的顶部是先进入的，因此弹出这个元素就为我们提供了队列。私有方法 `transfer` 整合了两个栈之间数据转移的逻辑。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 4.3：从栈实现队列\n\n```cpp\nclass queue {\n  public:\n    void push(int data) {\n\
    \      instack_.push(data);\n    }\n    int front() const {\n      transfer();\n\
    \      return outstack_.top();\n    }\n    void pop() {\n      transfer();\n \
    \     outstack_.pop();\n    }\n  private:\n    void transfer() const {\n     \
    \ if (outstack_.empty()) {\n        while (!instack_.empty()) {\n          outstack_.push(instack_.top());\n\
    \          instack_.pop();\n        }\n      }\n    }\n    mutable std::stack<int>\
    \ instack_;\n    mutable std::stack<int> outstack_;\n};\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n当 `out-stack` 为空时，在 `dequeue` 操作期间，将 `in-stack` 转移到 `out-stack`。注意最后进入的元素位于\
    \ `in-stack` 的顶部，转移后它就位于 `out-stack` 的底部。`out-stack` 的顶部是先进入的，因此弹出这个元素就为我们提供了队列。\n\
    \n## 4.4 使用队列实现栈\n\n一个常见的问题是使用队列来实现栈。其目标是展示这两种基本数据类型能力的等效性。\n\n解决这个问题的关键是使用两个队列来影响数据的反转。\n\
    \n在下方的解决方案中，我们使用了两个队列。在 `pop` 操作时，如果第一个队列为空，我们需要将另一个队列中的元素全部转移到第一个队列。这种方式，栈的元素是有序。如果第一个队列非空，其元素是反序的。这种逻辑是\
    \ `push` 方法的实现。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n注意，stl 提供了名为 `std::queue` 的队列模板实现。我们将在随后的内容经常使用它。\n\n## 4.5 层序遍历\n\n一个经典的面试题是对二叉树进行层序遍历。即，给定一棵二叉树，按照深度从左到右访问节点。\n\
    \n解决这个问题的关键是使用队列来管理探索的边界。我们用根节点初始化队列。这是第一层。然后逐个访问节点并将其子节点入队。这种方式实现。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n"
