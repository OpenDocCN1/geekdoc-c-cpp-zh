    end token such as the nullptr. When we encounter this token again we know that
    the current level has been fully enumerated. If the token is then enqueued again,
    it will be placed at the end of the level which was just enqueued. With this trick,
    we can complete the solution using nullptr as our level separation token.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 4.6: Level Order Traversal with Separation Tokens


       void level_traversal(node⋆ root,                        std::ostream& out) {     static const node⋆ LEVEL_TOKEN = nullptr;     std::queue<const node⋆> queue;     queue.push(root);     queue.push(nullptr);     while(!queue.empty()) {       const node⋆ node = queue.front();       queue.pop();       if (LEVEL_TOKEN == node) {         if (!queue.empty()) {           out << std::endl;           queue.push(LEVEL_TOKEN);         }         continue;       }       if (nullptr != node->left) {         queue.push(node->left);       }       if (nullptr != node->right) {         queue.push(node->right);       }       out << node->value;     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 4.6 Largest rectangle under a histogram


    A histogram is a graphical representation of data in which sequential entries
    along the x-axis are associated with a height in the y-axis. These values are
    plotted as rectangles of equal width with height equal to the y-value. In statistics,
    a histogram gives a graphical representation of a probability distribution.


    An advanced interview question is to calculate the area of the largest rectangle
    under the histogram.


    Since the histogram is composed of rectangles, we see that every maximal rectangle
    is bounded by the height of some entry in the histogram. The width of every maximal
    rectangle under the histogram is the number of other rectangles that are contiguous
    but at least as tall. So we are looking for rectangles bounded by three entries
    in the histogram: an entry that defines the height, the first contiguous entry
    of at least that height, and the last contiguous entry of at least that height.


    We begin by defining a histogram as an ordered array of pairs. Each pair has an
    *x* and *y* coordinate.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 4.7: Data-types for a Histogram


       struct HistogramEntry {     int x;     int y;   };   typedef std::vector<HistogramEntry> Histogram;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    A naive solution starts by enumerating all pairs of histogram entries *α* and
    *β*. It calculates the minimum height between *α* and *β* by iteratively checking
    each of those values. The area is then computed and a running max is tracked.
    However, this solution is cubic!


    Using a stack, we can find a solution that solves the problem in a single pass.
    The stack maintains a collection of all ‘open’ rectangles. The solution takes
    it in turn to inspect each entry of the histogram from left to right. When the
    height of histogram entries is increasing, an open rectangle is added to the stack.
    It is specified by its *x* and *y* coordinates. But the *y* coordinate must be
    the earliest rectangle preceding the entry that is at least as tall. We will see
    that the *y* coordinate can be determined by closing open rectangles before pushing
    the new entry onto the stack.


    When the height of histogram entry decreases during enumeration, all open entries
    with height larger than the current value must be closed. The area of an open
    entry is its height multiplied by width. The width is simply the current *x* location
    minus the starting location.


    After the last entry has been visited, a final pass must close all open entries.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 4.8: Largest Rectangle Under Histogram


       size_t largest_area(const Histogram& histogram) {     size_t max_area = 0;     int current_pos = 0;     std::stack<HistogramEntry> open_entries;     for (auto& entry : histogram) {       current_pos = entry.x;       int last_closed_pos = entry.x;       while (!open_entries.empty()              && open_entries.top().y >= entry.y) {         HistogramEntry top = open_entries.top();         open_entries.pop();         last_closed_pos = top.x;         size_t area = top.y                       ⋆ ((current_pos - 1)                          - (top.x - 1));         max_area = std::max(max_area, area);       }       open_entries.push({last_closed_pos, entry.y});     }     ++current_pos;     while (!open_entries.empty()) {       HistogramEntry top = open_entries.top();       open_entries.pop();       size_t area = top.y                     ⋆ ((current_pos - 1)                        - (top.x - 1));       max_area = std::max(max_area, area);     }     return max_area;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    In this solution, it is clear that every rectangle is only considered once. This
    means that every entry in the histogram has been pushed once and popped once,
    and so we have achieved a linear time algorithm. This is a dramatic improvement
    over the cubic naive solution.


    ## Chapter 5


    Heaps


    In this chapter we examine the heap data structure. The heap, also known as a
    priority queue, has applications in graph algorithms, caching, and sorting. We
    begin by discussing multiple variations of the heap. We then examine an implementation
    the standard operations of the binary heap. And finally, we look at a number of
    interview problems that can be solved by clever applications of a heap.


    ### 5.1 Definition


    A heap is an abstract data structure similar to a binary search tree. Like a binary
    tree, a heap is a collection of nodes that have a data member value and at most
    two child nodes. The differentiating factor is that nodes in a heap satisfy the
    heap property. The heap property is held when p.value ≥ n.value for each child
    node n of a parent p. A heap that satisfies this property is called a max heap.
    A min heap satisfies the heap property wherein a parent’s data value never exceeds
    any child’s data value. Note that the root of a min heap has the smallest value
    in the data structure, and the root of a max heap has the largest value in the
    data structure.


    The heap operations are insert, find_max, remove_max, and increase_key. The names
    are self-descriptive of the operations. By maintaining the heap property as an
    invariant, the find_max operation runs in constant time.


    Heaps have a number of variants with different worst case running time for other
    operations. The Brodal heap is a complex collection of algorithms that obtains
    optimal worst case run time for heap operations. The Brodal heap has constant
    time implementation insert, find_max, and increase_key. For remove_max the Brodal
    variant obtains optimal bound of a logarithmic running time.


    A second variant is the Fibonacci heap. The Fibonacci heap is so named because
    it creates and maintains a forest of trees where the numbers of children of the
    root nodes are bounded below by Fibonacci constants. The relationship between
    the trees maintains the heap property. The Fibonacci heap achieves only amortized
    asymptotically optimal bounds on running time for the heap operations. This is
    a trade-off between complexity of implementation and efficiency.


    A simpler variant is the binary heap. In the binary heap, there is a single binary
    tree structure. The tree structure is always balanced, and grows by insertion
    in level order. While the binary heap is simple to implement and understand, it
    does not achieve the asymptotic efficiency of the other variants. Namely, while
    find_max takes constant time and remove_max achieves logarithmic time, all other
    operations in a binary heap have at least logarithmic time lower bounds.'
