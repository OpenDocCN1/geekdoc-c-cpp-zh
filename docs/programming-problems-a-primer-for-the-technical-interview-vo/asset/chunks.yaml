  trans: "\n\n具体来说，假设在整数区间 [0, 100] 上定义了一个单调递增积分函数，其取值在 [0, 100] 之间。它由数组 `A` 表示，其中\
    \ `f(x) = A[x]`。由于该函数是有界且递增的，因此必须存在一个值 `y` 使得 `f(y) = y`。这样的 `y` 被称为固定点。\n\n我们可以使用二分查找来寻找固定点，其过程类似于在旋转数组中寻找枢轴的方法。核心思想是始终更新边界，使得固定点位于搜索范围内。为了做到这一点，我们更新使得\
    \ `lower <= A[lower]` 且 `upper >= A[upper]`。以下是该解决方案的实现。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 7.6: 寻找固定点\n\n```cpp\nsize_t fixed_point(const std::vector<int>& array)\
    \ {\n    auto lower = array.begin();\n    auto upper = array.end() - 1;\n    while\
    \ (lower < upper) {\n        auto mid = lower + (upper - lower) / 2;\n       \
    \ if (mid <= (mid - array.begin())) {\n            upper = mid;\n        } else\
    \ {\n            lower = mid + 1;\n        }\n    }\n    return lower - array.begin();\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 7.5 寻找重复值\n\n假设我们被要求在一个整数序列中找到一个出现两次的值。我们可以通过二分查找来解决这个问题。\n\n核心思想是更新边界，使得我们考虑的那部分在假设没有重复值的情况下，其能容纳的整数数量的部分。这种方法有效的原因与上述相似。如果数组中存在重复值，且数组包含了序列中的所有元素，那么数组的长度必须大于其最后一个元素与第一个元素之间的差值。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 7.7: 查找序列中的重复\n\n```cpp\nsize_t find_duplicates(const std::vector<int>& array)\
    \ {\n    auto lower = array.begin();\n    auto upper = array.end() - 1;\n    while\
    \ (lower < upper) {\n        auto mid = lower + (upper - lower) / 2;\n       \
    \ auto mid_val = lower + (upper - lower) / 2;\n        if (mid_val < mid) {\n\
    \            upper = mid;\n        } else {\n            lower = mid + 1;\n  \
    \      }\n    }\n    return lower - array.begin();\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n注意这与寻找函数固定点的相似性。预期的中间值是在没有重复值时会存在的值。通过上方计算该值并与实际中间值进行比较，我们正在转换边界，使得这个问题与固定点问题具有相同的问题。\n\
    \n### 7.6 在杨柯矩阵（Young Tableau）中二分查找\n\n最后，让我们考虑一个在更复杂的实现中使用二分查找技巧的例子。假设给定一个 `n`\
    \ × `m` 的整数矩阵 `M`。整数在列和行中都从小到大排序。也就是说，当 `j <= l` 时，`M[ij] <= M[il]`，且当 `i <= k`\
    \ 时，`M[ij] <= M[kj]`。这样的矩阵被称为杨柯矩阵。问题是找到矩阵中具有指定值的元素坐标。\n\n我们使用的 `matrix` 数据结构和\
    \ `coordinate` 数据类型定义如下。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nListing 7.8: 矩阵的定义\n\n```cpp\ntypedef std::vector<std::vector<int>> matrix;\n\
    typedef std::pair<size_t, size_t> coordinate;\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n我们希望选择合适的边界，使得在比较后搜索空间可以显著缩小。如果我们尝试将矩阵扁平化并搜索，预处理将需要访问 `n²` 个元素。但我们应该通过某种二分查找获得更好的结果。\n\
    \n为了应用二分查找，我们需要找到一个能够减小搜索空间的更新规则。假设我们在矩阵的坐标 `i,j` 处有一个中间点。如果 `M[i.j]` 小于我们的键值，我们可以增加矩阵条目的值。因此，增加行或列都是适当的。如果\
    \ `M[i,j]` 大于我们的键值，我们需要减小行或列。为了避免分支，我们希望选择一个在比较后只有一种更新选择的起始位置。有两个位置提供这种属性：左下角和右上角。我们从矩阵的左下角开始进行对角线搜索。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\nListing\
    \ 7.9: 矩阵的对角线搜索\n\n```cpp\ncoordinate find(const matrix& m, int key) {\n    coordinate\
    \ coord = {m.size() - 1, 0};\n    while (coord.first < m.size() && coord.second\
    \ < m[0].size() && m[coord.first][coord.second] != key) {\n        if (m[coord.first][coord.second]\
    \ > key) {\n            coord.first--;\n        } else {\n            coord.second++;\n\
    \        }\n    }\n    return coord;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n上述算法是线性的。为了这一点，请注意在最坏情况下可能会遍历矩阵对角。但正如所示，二分查找通过减少搜索空间来实现对数级运行。通过某些见解，可以在杨柯矩阵上实现搜索。\n\
    \n再次考虑矩阵的极端值。`M[1,1]` 是矩阵中的最小元素，而 `M[n,m]` 是最大的。泛化，给定一个由元素 `M[p,q]` 和 `M[s,t]`\
    \ 定义的子矩阵（其中 `p <= s` 且 `q <= t`），我们知道 `M[p,q]` 是子矩阵中的最小元素，而 `M[s,t]` 是最大的。\n\n\
    有了这种见解，我们可以编写一种矩阵二分查找，每一步按固定比例缩小搜索空间。这将产生一个最优解。核心思想是从由 `M[p,q]` 为左上、`M[s,t]` 为右下的边界子矩阵开始。我们计算中间行\
    \ `i = (p + s) / 2`，并搜索该行以找到将矩阵分成四个子矩阵的最佳列。实现此点的列 `j` 是行 `i` 中第一个大于或等于键值的元素 `M[i,j]`。现在考虑由行\
    \ `i` 和列 `j` 划分的四个子矩阵。键不可能出现在左上子矩阵中，因为它大于 `M[i-1,j-1]`。此外，键也不可能出现在右下子矩阵中，因为小于\
    \ `M[i,j]`。因此，我们只需要查看剩下的两个子矩阵：右上和左下。我们将搜索范围缩小到了原始定义域的一半。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nListing 7.10: 杨柯矩阵中的二分查找\n\n"
- fmt: "\n```cpp\ncoordinate find(const matrix& m, const int key) {\n  std::function<bool(const\
    \ coordinate& lower, const coordinate& upper, coordinate* out)> recursive_find\
    \ = [&key, &m, &recursive_find] (const coordinate& lower, const coordinate& upper,\
    \ coordinate* out) {\n    if (lower.first > upper.first || lower.second > upper.second\
    \ || m.size() < std::max(lower.first, upper.first) || m[0].size() < std::max(lower.second,\
    \ upper.second)) {\n      return false;\n    }\n    size_t mid_row = lower.first\
    \ + (upper.first - lower.first)/2;\n    const auto& row_offset = m[mid_row].begin();\n\
    \    size_t mid_col = std::lower_bound(row_offset + lower.second, row_offset +\
    \ upper.second, key) - row_offset;\n    if (mid_row < m.size() && mid_col < m[mid_row].size()\
    \ && m[mid_row][mid_col] == key) {\n      *out = {mid_row, mid_col};\n      return\
    \ true;\n    }\n    return recursive_find({mid_row + 1, lower.second}, {upper.first,\
    \ mid_col - 1}, out) || recursive_find({lower.first, mid_col}, {mid_row - 1, upper.second},\
    \ out);\n  };\n  coordinate lower = {0,0};\n  coordinate upper = {m.size(), m[0].size()};\n\
    \  coordinate out = {0,0};\n  recursive_find(lower, upper, &out);\n  return out;\n\
    }\n```\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n\
