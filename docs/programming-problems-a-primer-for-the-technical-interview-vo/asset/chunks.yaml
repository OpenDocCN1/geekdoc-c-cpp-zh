  trans: "\n上述列表比较了两个列表，但很容易扩展到同时比较任意数量的列表。\n\n多个链表上的另一种常见操作是合并（merge），即将两个或多个列表合并为一个列表。由于链表是动态绑定的，合并两个链表可以在不分配新内存的情况下完成。一种朴素的合并方法是通过遍历一个列表并将每个节点插入另一个列表，从而将一个列表追加到另一个列表后面。这种方法所需的写入次数与列表中的元素数量一样。\n\
    \n我们可以做得更好。我们只需要像下面的列表所示，将一个列表追加到另一个列表后面。以这种方式进行追加是单次写入操作，尽管必须读取一个列表到末尾。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 2.20: 合并两个链表\n\n```cpp\nnode* merge(node* h1, node* h2) {\n  if (nullptr\
    \ == h1 || nullptr == h2) {\n    return h1 ? h1 : h2;\n  }\n  auto head = h1;\n\
    \  while (nullptr != h1->next) {\n    h1 = h1->next;\n  }\n  h1->next = h2;\n\
    \  return head;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 2.8 识别\n\n链表问题的最后一组问题涉及列表属性的识别。下面我们考虑两个问题：确定一个列表是否为回文（palindrome），以及确定它是否存在自环（self-loops）。\n\
    \n回文是指正向和反向都相同的序列。判断一个链表是否为回文是结合状态信息和选择的练习。乍一看，可能会困惑如何高效地比较第一个和最后一个节点、第二个和倒数第二个节点等，直到中间点。让我们先考虑双向链表中的这个问题。在这种情况下，我们有正向和反向枚举，可以很容易找到解决方案。我们正向和反向遍历，直到两个迭代器交叉。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 2.21: 识别双向链表为回文\n\n```cpp\nbool is_palindrome(dll_node* head) {\n  if (nullptr\
    \ == head) return true;\n  if (head == head->next) return true;\n  auto tail =\
    \ head->prev;\n  do {\n    if (head->data != tail->data) {\n      return false;\n\
    \    }\n    head = head->next;\n    tail = tail->prev;\n  } while (head != tail\
    \ && head != tail->next);\n  return true;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n回到单链表，我们发现自己没有反向迭代器。但使用额外内存进行单次扫描会让这变得更简单。我们可以将节点放入栈中，然后从后到前检查列表。这允许我们在出栈时进行反向迭代。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 2.22: 识别链表为回文\n\n```cpp\nbool is_palindrome(node* head) {\n  auto temp = head;\n\
    \  std::stack<node*> s;\n  while (nullptr != temp) {\n    s.push(temp);\n    temp\
    \ = temp->next;\n  }\n  while (!s.empty()) {\n    if (head->data != s.top()->data)\
    \ {\n      return false;\n    }\n    s.pop();\n    head = head->next;\n  }\n \
    \ return true;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n关于列表的著名面试题是识别列表中的自环。初步考虑，想法简单来说是收集地址，直到找到两个相同的地址。候选人通常会联想到哈希表。这是因为哈希表具有常数时间访问，且冲突检测是该数据类型的基础问题。如果发现任何冲突，第一个冲突保证是头节点。然而，该问题作为一个决策问题提出的，而我们做的工作太多了。毕竟，这个解决方案需要分配至少与列表节点数量等大的新内存。更好的选择是对我们解决选择问题解决方案的修改。\n\
    \n考虑一下当我们尝试寻找循环链表的中点时会发生什么。领先指针不会终止，而是会追上尾部指针。因此，每当领先和尾部指针重合，我们就知道存在环。但如果领先指针找到了\
    \ `nullptr`，我们就知道没有环。我们可以将这一见解转化为识别自环问题的解决方案。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 2.23: 在链表中查找环\n\n```cpp\nbool detect_loop(node* head) {\n  if (nullptr\
    \ == head) {\n    return false;\n  }\n  auto trailing = head;\n  auto leading\
    \ = head;\n  while(nullptr != leading) {\n    leading = leading->next;\n    if\
    \ (trailing == leading) {\n      return true;\n    }\n    trailing = trailing->next;\n\
    \    if (nullptr != leading) {\n      leading = leading->next;\n    }\n  }\n \
    \ return false;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n考虑这种解决方案的效率。它解决了问题不需要分配额外内存，并且额外节省了无需计算哈希值、解决哈希冲突或动态调整哈希表的开。这种解决方案的优雅性正是它近 30\
    \ 年来一直作为微软面试题的原因。\n\n## 第 3 章：树\n\n我们继续对数据类型的回顾，讨论二叉树。\n\n作为一种数据结构，二叉树克服了链表检索的低效性。然而，对数级的检索时间是以插入和删除时间从常数增加到对数为代价的。二叉树操作的算法编写也比链表的对应算法更复杂。例如，对于链表使用迭代的操作，二叉树上的操作可能依赖递归。在本节中，我们将回顾二叉搜索树的基本操作，并开始解决复杂的面试题。\n\
    \n### 3.1 定义\n\n二叉树由树节点组成。树节点由数据成员变量和其他另外节点的地址组成。这些节点被称为孩子，并区分为 `left` 和 `right`。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 3.1: 二叉树节点\n\n```cpp\nstruct node {\n  int value;\n  node* left = nullptr;\n\
    \  node* right = nullptr;\n  explicit node(int value) : value(value) {};\n};\n\
    ```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n正如链表的情况，二叉树通过指向一个指定节点的指针来引用的。这个节点被称为根（root）。\n\n空树是指根为 `nullptr` 的树。\n\n二叉搜索树是一种维护父节点与子节点之间排序的二叉树。排序不变性是指每当节点有左右孩子时，`node->value\
    \ > left->value` 且 `node->value <= right->value`。当每个节点的左子树和右子树的深度之差不超过 1 时，该二叉搜索树是平衡的。下面讨论的大多数复杂度边界仅适用于平衡的二叉搜索树。\n"
- fmt: "\nInsertion in a binary search tree is a logarithmic time operation. This\
    \ is because to maintain the order invariant, an insertion requires search to\
    \ identify which node in a tree will become the parent of the inserted node. After\
    \ a parent node is identified by a `find` operation, only a constant number of\
    \ operations are needed to complete insertion.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 3.2: Insert into a Binary Search Tree\n\n```cpp\nnode* insert(node*\
    \ root, int val) {\n  if (nullptr == root) {\n    return new node(val);\n  }\n\
    \  if (val < root->value) {\n    root->left = insert(root->left, val);\n  }\n\
    \  else {\n    root->right = insert(root->right, val);\n  }\n  return root;\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n\
    Also notice the use of recursion during the retrieval phase of insertion. This\
    \ is characteristic of binary search trees in the sense that where-as algorithms\
    \ on linked-lists are usually iterative, operations on trees are often recursive.\n\
    \n### 3.2.2 Find\n\nThe utility of a binary search tree is derived from the logarithmic\
    \ time search guarantee of the data structure. This guarantee is only for balanced\
    \ binary search trees. Search is the motivation for use of a binary tree, and\
    \ as such is the fundamental operation on binary search trees.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nListing 3.3: Find in a Binary Search Tree\n\n```cpp\nnode* find(node* root,\
    \ int value) {\n  if (nullptr == root || root->value == value) {\n    return root;\n\
    \  }\n  if (value < root->value) {\n    return find(root->left, value);\n  }\n\
    \  return find(root->right, value);\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nNote that the logarithmic time for search is guaranteed because when we branch\
    \ left or right, we are decreasing the search space by a constant fraction. Each\
    \ branch cuts the search space in half. We can only divide the search space by\
    \ two a logarithmic number of times before we are left with a single element.\n\
    \n### 3.2.3 Removal\n\nAs with insertion, removal of a value from a binary search\
    \ tree has logarithmic running time. The search is required for more than the\
    \ care needed to maintain the order invariant. Indeed, search is required to find\
    \ the next value in the binary search tree that is compatible with the position\
    \ of the node being removed. When this is found, that value is replaced and the\
    \ node found is removed.\n\nIn order to carefully write the algorithm for removal\
    \ in C/C++, we will first define the two ancillary functions `find_parent` and\
    \ `find_successor`. Finding the parent of a node is a straightforward operation.\
    \ It is simply a modified `find` operation in which the parent node is returned,\
    \ not the child. The solution below returns `nullptr` if the node is the root.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\nListing\
    \ 3.4: Find Parent in a Binary Search Tree\n\n```cpp\nnode* find_parent(node*\
    \ root, node* target) {\n  if (root == target) {\n    return nullptr;\n  }\n \
    \ while (root->left != target && root->right != target) {\n    if (target->value\
    \ < root->value) {\n      root = root->left;\n    } else {\n      root = root->right;\n\
    \    }\n  }\n  return root;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
