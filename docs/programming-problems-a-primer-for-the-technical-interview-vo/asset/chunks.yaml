    \ root->value)\n      || (y->value < root->value && x->value >= root->value))\
    \ {\n    return root;\n  }\n  if (x->value < root->value) {\n    return lca(root->left,\
    \ x, y);\n  }\n  return lca(root->right, x, y);\n}\n```\n\n"
