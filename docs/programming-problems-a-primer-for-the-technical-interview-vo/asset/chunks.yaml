    # 编程题集

    ## 技术面试指南

    ### 第一卷：C++11 基础

    ### Bradley Green

    ### 版权所有 2013 Bradley Green

    ### Smashwords 版


    ## 前言


    这本书是我在准备第一次编程面试时，希望自己能拥有的学习指南。


    毕业后，我并没有技术面试的重重考验做好充分准备。那时，IBM、英特尔和微软接连面试了我。微软的面试是最困难的，跨越了 2 天，总共有 14 场面试。我们涵盖了所有内容：makefile
    和构建环境、数字电路、`C/C++` 语言规范以及算法。幸运的是，最后一切进展顺利。我评估了我的录用通知，并搬到了华盛顿州的雷德蒙，开始了我的高科技职业。然而，我仍然希望在参加第一次技术面试之前，就能知道自己面对的是什么。


    在科技行业，没有任何事情能长期保持非常稳定。项目会变动，公司范围的重组会在不经通知的情况下发生。这并不是什么秘密，但在微软，内部转岗需要进行完整的技术面试。偶尔会有例外，例如如果你在某个领域很有名气，或者你被重组到了不同的部门。但在大多数情况下，你必须经历完整的面试，包括向外部提交简历、面试前筛选以及那筋疲力竭的测试日。


    在新千元开启后不久，我开始为第二个职位参加面试。从那时起，我在微软、谷歌、Facebook 以及其他许多高科技公司进行过很多次面试。我很幸运，一直都通过面试，并已经在几家很棒的公司工作过。


    在在此期间，我主持了的一百多场面试，并在面试循环和招聘委员会中讨论过更多面试。几年前，我开始记录笔记，以便在准备面试时使用。这些笔记被整理成了一个庞大的编程题集。某个时候，一位朋友提到把这些内容写下来是值得的，正是由于这个建议才有了这本书。


    这本书旨在作为资深工程师的复习资料和初次面试者的手册；它不是一本教科书，也不是一本科学著作。我考虑过在每章末尾添加题目章节，但我认为，如果没有完整的答案，本文作为指南将失去其重点。在随后的版本中，书中提到的引文将被妥善汇编成参考文献，但目前我请求您的原谅，因为不知道书中使用的许多技术最初是在哪里发现的。最后，尽管我已经尽力保证所展示的代码可以使用
    `gcc4.7` 编译并在基础测试用例上运行，但这本书的第一版中并没有很多参考文献或数学证明。


    ### .1 书的结构


    我希望在这本书中涵盖三个主要领域：数据结构、搜索与排序以及高级算法。书的后半部分分为字符串、数字和序列算法。随着这项工作范围的扩大，很显然，这项工作应该分为两卷。第一卷讨论了涵盖基础数据结构、抽象数据类型、搜索和排序的编程问题。第二卷涵盖了高级编程问题，如空间划分、子串搜索、解析和采样。


    两卷的章节结构是相同的。每一章都是关于特定主题的自包含学习指南。我尝试将其框架化，使得复杂度随着章节的推进而增加。介绍材料对于行业内的任何人来说都应该是简单的复习；中间部分包含有趣的问题和回顾；结尾是一个有趣且复杂的问题。我希望这些问题能让读者在继续讨论答案之前，在思考中获得一些乐趣。


    ### .2 C/C++ 编程


    `C/C++` 长期一直是高级编程的标准。如果你想与我们领域最顶尖的人一起工作，你就应该花时间熟悉这门语言，至少达到阅读理解的水平。明确地说，如果你想在苹果、Facebook、谷歌或微软这样的公司工作，如果你不了解
    `C/C++`，你就是在削弱你自己和你的未来。


    `C/C++` 是面试的通用语言；几乎所有的面试官都认识它，而且几乎所有的候选人都被预期能够读懂它。但除了这些公司的大多数面试官熟悉 `C/C++` 这一事实外，还有许多原因。首先，`C/C++`
    隐藏得很少。虽然这使得编写代码变得更加冗长，但它让每个人都知道你正试图展示什么。而能够清晰地展示你所掌握的知识正是面试的意义。


    这里使用的编码风格松散遵循 Google 发布的风格指南。我发现他们达成一致并推崇的格式倾向于可读性而非简洁性。在列表中，大多数代码在很多方面将是冗长的，除了一些指针算术和参数变量重用之外。


    我尝试保持 `C++` 语言的 C 根，以牺牲类定义、模板和通用解决方案为代价。这样做是为了尽可能清晰地展示算法。模板和容器类的好处并没有被我忘记，我在日常编码中也会它们。但它们为代码列表增加了复杂度，这种复杂度并不与其重量相称。由于由于原因，几乎所有的值数据类型将简单地使用
    `int`。应该明确的是，在几乎它们被使用的任何地方，函数的模板版本或适当的数据结构容器都是可以替换的。


    我不想用 ANSI C 写这本书，所以为了避免由于内存管理产生大量文本，我将自由使用 STL 容器 `queue`、`stack` 和 `vector`。但在第二卷中将有一些指针算术，事实上还有一整节关于位操作（bit
    twiddling）。


    在初稿写作快结束时，我决定引入 `C++11`。修订极大提高了了可读性和简洁性。`auto` 的使用让读者关注变量的使用而非声明。我将类型为 `std::function`
    的元素称为函数式（functionals）。函数式的使得算法保持自包含，而不是分散在许多函数中。我希望这种变化对读者的好处就像对作者的那样大。


    ### .3 致谢


    我要感谢 L.A.G. 的支持和深爱的爱，以及一直在我身边。我还要感谢 T.G.，他总是在那里提供写作的短暂调剂；感谢我的父母 R.G. 和 K.G.，没有他们，我无法走到这里。


    我还要感谢 J. Melvin 的详尽阅读以及他的性建议。维基百科的编辑让研究变得极其高效，对于他们的贡献，我所做的任何事情都不够。最后，我感谢 E.M.H.
    建议了写这本书，并提醒我它早就该完成了了。


    ### .4 最后的结语


    在随后的版本中，我希望让它更像一本正式的科学文本。这需要详尽的参考文献和适当的论证，而不是模糊的提及和事实的断言。为此，我乐意通过 `algorithmist@hotmail.com`
    接收您对书中任何内容的纠正、参考和建议。


