  trans: "\n\n```cpp\ndll_node* find(dll_node* head, int value) {\n  auto current\
    \ = head;\n  while(nullptr != current && current->data != value) {\n    current\
    \ = current->next;\n    if (current == head) {\n      return nullptr;\n    }\n\
    \  }\n  return current;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n从循环双向链表中删除节点比从单链表中删除要简单。这是因为双向链表的每个节点都有一个指向其前一个元素的指针。这使得从双向链表中接接出一个节点变得轻而易举，而在单链表中，我们需要删除下一个节点并交换数据值。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n###\
    \ 列表 2.12: 从双向链表中删除节点\n\n```cpp\ndll_node* remove(dll_node* head, dll_node* node)\
    \ {\n  if (head->next == head) {\n    delete node;\n    return nullptr;\n  }\n\
    \  node->prev->next = node->next;\n  node->next->prev = node->prev;\n  if (head\
    \ == node) {\n    head = node->next;\n  }\n  delete node;\n  return head;\n}\n\
    ```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n注意，STL 在 `std::list` 中提供了循环双向链表的实现。当回答问题时不需要操纵链表的内部结构时，通常使用这个类会更好。在本节中，我们将使用提供的链表节点和\
    \ `dll_node` 定义，但在后续章节中，我们将依赖 STL。\n\n### 2.5 选择\n\n由于链表是无序的且不支持随机访问，寻找链表内有趣位置的值的问题需要巧妙的解决方案。这些被称为选择问题。首先，考虑寻找链表的中间元素。一种直接的方法是统计元素的个数，然后扫描到该索引处的元素。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n###\
    \ 列表 2.13: 通过计数查找链表的中间点\n\n```cpp\nnode* mid_by_counting(node* head) {\n  if (!head)\
    \ {\n    return head;\n  }\n  auto trailing = head;\n  size_t size = 0;\n  while\
    \ (nullptr != head) {\n    ++size;\n    head = head->next;\n  }\n  size_t mid\
    \ = size / 2;\n  while (mid--) {\n    trailing = trailing->next;\n  }\n  return\
    \ trailing;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n该操作显然需要对链表进行一次和半的全扫描。但我们可以做得更好。考虑当我们并排在链表中移动两个索引时会发生什么。具体来说，一个指针一次移动一个节点，另一个指针一次移动两个节点。当第一个索引位于节点\
    \ `x` 时，第二个指针位于位置 `2*x`。所以，当第二个节点到达链表末尾时，第一个指针正好位于中间位置！因此，我们确实可以通过一次扫描完成这一任务。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n###\
    \ 列表 2.14: 查找链表的中间点\n\n```cpp\nnode* mid(node* head) {\n  auto trailing = head;\n\
    \  while (nullptr != head) {\n    head = head->next;\n    if (head) {\n      head\
    \ = head->next;\n      trailing = trailing->next;\n    }\n  }\n  return trailing;\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n这个技巧可以推广到找到链表中任意比例位置的元素。因此，对于任何 `k`，我们都可以找到位置 `length/k` 处的元素。但通常问题是找到倒数固定位置\
    \ `k` 处的元素。我们可以通过修改上面的技巧（并排移动两个指针，但给其中一个领先距离）来找到链表中倒数第 `k` 个的节点。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.15: 查找倒数第 kth 个节点\n\n```cpp\nnode* kth_from_end(node* head, size_t\
    \ k) {\n  auto trailing = head;\n  while (k-- && nullptr != head) {\n    head\
    \ = head->next;\n  }\n  while (nullptr != head && nullptr != head->next) {\n \
    \   head = head->next;\n    trailing = trailing->next;\n  }\n  return trailing;\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 2.6 修改\n\n在选择操作中，缺乏随机访问产生了许多要求修改链表的问题。最基本的是删除所有匹配某个值的节点。`remove` 方法唯一需要的修改是维护当前的扫描位置，以便在删除一个节点后继续迭代。通过维护一个\
    \ `trailing` 指针并移除匹配该值的领先节点可以实现这一点。在这种方法中，必须注意移除所有匹配的节点，否则连续的匹配将无法被正确处理。在实现中，连续的匹配通过下方列表所示内部的\
    \ `while` 循环来处理。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.16: 从链表中删除特定值\n\n```cpp\nnode* remove_values(node* head, int value)\
    \ {\n  while (head && head->data == value) {\n    node* temp = head;\n    head\
    \ = head->next;\n    delete temp;\n  }\n  node* target = head;\n  while (target\
    \ != nullptr && target->next != nullptr) {\n    if (target->next->data == value)\
    \ {\n      node* temp = target->next;\n      target->next = target->next->next;\n\
    \      delete temp;\n    } else {\n      target = target->next;\n    }\n  }\n\
    \  return head;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n反转链表顺序稍微复杂一点的是后继关系的问题。在链表中，可以通过维护当前的扫描位置来完成这一点。在完整遍历后，链表就反转了。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.17: 反转链表\n\n```cpp\nnode* reverse(node* head) {\n  node* prev = nullptr;\n\
    \  while (nullptr != head) {\n    node* temp = head->next;\n    head->next = prev;\n\
    \    prev = head;\n    head = temp;\n  }\n  return prev;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n反转循环双向链表可以使用相同的技术。但是像循环链表通常一样，我们必须跟踪终止条件。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.18: 反转双向链表\n\n```cpp\ndll_node* reverse(dll_node* head) {\n  if (nullptr\
    \ == head) return nullptr;\n  if (head->next == head) return head;\n  dll_node*\
    \ tail = head;\n  do {\n    dll_node* temp = tail->next;\n    tail->next = tail->prev;\n\
    \    tail->prev = temp;\n    tail = temp;\n  } while (tail != head);\n  return\
    \ head->prev;\n}\n```\n\n### 2.7 多个链表\n\n许多问题涉及处理多个链表。\n\n上面我们如何通过并排移动两个指针来找到链表的中间点。使用相同的思想，我们可以通过对每个链表单次遍历来解决比较两个链表的问题。唯一的困难在于没有随机访问。我们使用多个指针，每个链表一个。\n\
    \n我们首先检查两个链表是否为空或不为空。之后，我们轮流比较每个元素。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.19: 比较链表\n\n```cpp\nbool equals(node* x, node* y) {\n  while(x && y)\
    \ {\n    if (x->data != y->data) return false;\n    x = x->next;\n    y = y->next;\n\
    \  }\n  if (nullptr == x && nullptr == y) return true;\n  return false;\n}\n```\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n"
- fmt: "\nThe listing above compares two lists, but can easily be generalized to compare\
    \ an arbitrary number simultaneously.\n\nThe other common operation on multiple\
    \ linked-lists is merging, in which two or more lists becomes one. Since linked-lists\
    \ are dynamically bound, merging two linked-lists can be done without the allocation\
    \ of any new memory. A naive method to merge is to append one list to another\
    \ by iteratively walking one list and inserting each node into the other. This\
    \ method requires as many writes as there are elements in the list.\n\nWe can\
    \ do better. We need only append one list to another, as in the listing below.\
    \ Appending in this manner is a single write operation, although one list must\
    \ be read to the end.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 2.20: Merge Two Linked-Lists\n\n```cpp\nnode* merge(node* h1, node*\
    \ h2) {\n  if (nullptr == h1 || nullptr == h2) {\n    return h1 ? h1 : h2;\n \
    \ }\n  auto head = h1;\n  while (nullptr != h1->next) {\n    h1 = h1->next;\n\
    \  }\n  h1->next = h2;\n  return head;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 2.8 Identification\n\nThe final set of problems for linked-lists involves\
    \ the identification of list properties. Below we consider two problems: determining\
    \ whether or not a list is a palindrome, and determining if it has self-loops.\n\
    \nA palindrome is a sequence that is the same both forward and backward. Deciding\
    \ if a linked-list is a palindrome is an exercise in combining state information\
    \ and selection. At first glance, one can be perplexed how to efficiently compare\
    \ the first and last nodes, the second and second from last nodes, et cetera until\
    \ the mid point. Let’s first consider this question with a doubly linked-list.\
    \ In this case we have forward and backward enumeration, and a solution is easily\
    \ found. We iterate forward and backward until the two iterators cross.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 2.21: Identify a Doubly Linked-List as a Palindrome\n\n```cpp\nbool\
    \ is_palindrome(dll_node* head) {\n  if (nullptr == head) return true;\n  if (head\
    \ == head->next) return true;\n  auto tail = head->prev;\n  do {\n    if (head->data\
    \ != tail->data) {\n      return false;\n    }\n    head = head->next;\n    tail\
    \ = tail->prev;\n  } while (head != tail && head != tail->next);\n  return true;\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n\
    Returning to a simple linked-list, we found ourselves without a reverse iterator.\
    \ But a single scan with extra memory makes this simpler. We can put the nodes\
    \ in a stack, and then inspect the list back to front. This allows us to iterate\
    \ in reverse as we unroll the stack.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 2.22: Identify a Linked-List as a Palindrome\n\n```cpp\nbool is_palindrome(node*\
    \ head) {\n  auto temp = head;\n  std::stack<node*> s;\n  while (nullptr != temp)\
    \ {\n    s.push(temp);\n    temp = temp->next;\n  }\n  while (!s.empty()) {\n\
    \    if (head->data != s.top()->data) {\n      return false;\n    }\n    s.pop();\n\
    \    head = head->next;\n  }\n  return true;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nThe famous interview question regarding lists is the identification of self-loops\
    \ in a list. On first thought, the idea is simply to collect the addresses until\
    \ we find two that are identical. Often a candidate will jump on the hash table.\
    \ The reason is hash tables have constant time access, and collision detection\
    \ is a basic problem in that data type. If any collisions are found, the first\
    \ one is guaranteed to be the head. However, the question was posed as a decision\
    \ problem and we are doing too much work. After all this solution requires the\
    \ allocation of new memory at least large as the number of nodes in the list.\
    \ A better selection is a modification of our solution to the selection problem.\n\
    \nConsider what happens when we try to find the mid point of a circularly linked-list.\
