  raw: 'The following listing partitions the sub-array defined by the offset and length
    on the value provided. The algorithm used initializes the array with the pivot
    element in the first position. It then enumerates the array from right to left.
    When an entry with value less than the pivot is detected, the tail of the array
    is shifted to the right of the pivot. That smaller value is then stored in the
    empty location created by the shift.


    The return value is an index into the array. Every element of the array which
    is less than or equal than the pivot has a lower index than the return value.
    Every element that is greater than the pivot value has an index no less than the
    return value.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.3: Partition on an Element


       size_t partition(std::vector<int>⋆ array,                    size_t pos,                    size_t offset,                    size_t length) {     if (length <= 1) return offset;     int val = (⋆array)[pos];     std::swap((⋆array)[offset], (⋆array)[pos]);     auto left = offset;     auto right = offset + length - 1;     while (left < right) {       if (val < (⋆array)[right]) {         --right;       } else {         std::swap((⋆array)[left], (⋆array)[left+1]);         if (right != left + 1) {           std::swap((⋆array)[left], (⋆array)[right]);         }         ++left;       }     }     return left;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The use of the left starting position and the size on which to pivot will be helpful
    in the sequel. We can now implement and analyze selection by choosing an arbitrary
    pivot.


    ### 9.3 Selection with a pivot


    We begin with a rule to choose a pivot. We suppose a rule is declared as below.
    The parameters define the sub-array from which to choose a pivot.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.4: Definition of Find Pivot Index


       size_t pivot_index(const std::vector<int>& array,                      size_t offset,                      size_t size);


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Given a rule to choose a pivot, implementing selection can be done recursively.
    A partition operation first provides the sort location of the pivot element. If
    the desired location k is lower than the location of the pivot, we exclude all
    elements of the array from the pivot to the end. If the desired location is higher
    than the location of the pivot, we exclude all elements with indices smaller than
    the pivot and update k. We finally recursively apply selection to the range of
    the array not exclude.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.5: Selection with Pivot


       int select(std::vector<int>⋆ array, size_t k) {     std::function<int(std::vector<int>⋆,                       size_t,                       size_t)>     selection = [k, &selection]  (         std::vector<int>⋆ array,         size_t offset,         size_t length) {       auto index = pivot_index(⋆array,offset,length);       size_t pos = partition(array,                              index,                              offset,                              length);       if (pos == k) {         return array->at(k);       }       if (pos > k) {         return selection(array, offset, pos-offset);       }       return selection(array,                        pos+1,                        length - (pos + 1 - offset));     };     return selection(array, 0, array->size());   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This implementation would have expected linear running time over input provided
    uniformly at random. The reason is that we can expect to exclude half the size
    of the list with every pivot. However the run time is not guaranteed because the
    pivot may not provide a strong separation of the search space. In the worst case,
    where the array is sorted this implementation runs in quadratic time. The problem
    is the choice of element on which to pivot.


    To provide a linear running time selection algorithm, we chose as a pivot the
    *median of the medians*.


    ### 9.4 Median of medians


    The problem at hand is to guarantee that the choice of pivot element separates
    the array into two pieces each with length at least some constant fraction of
    the original array. This could be done if we could always choose the median. But
    that is our goal, so we do not have that tool available. None-the-less, it is
    possible to choose an approximation of the median by reducing this original problem
    to a smaller problem. The following solution is called the median-of-medians or
    median-of-three .


    The reduction works by first bucketing the array into sub-arrays of constant length.
    From each sub-array we can find a median value, which is simple if each bucket
    of a constant length. A short listing for length of three makes this clear.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.6: Median of 3


       int median_of_3(const std::vector<int>& array,                   size_t offset,                   size_t length) {     auto begin = array.begin() + offset;     std::vector<int> sub(begin, begin + length);     std::sort(sub.begin(), sub.end());     return sub[(length - 1) / 2];   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Choosing the median value of these medians will give us a value that is guaranteed
    to not be too far from the original actual median of the array. Analysis shows
    that the pivot chosen is approximately the median. Hence the running time of this
    process is linear in the length o the original arrays.


    Implementing this algorithm is an exercise in recursion. We first bucket the array
    into sub-arrays of length 3, calculate the median of these three elements, and
    generate a new array consisting of these medians. Afterward we recursively find
    the median of the new array until it is small enough to decide in constant time.


    Note the implementation operates on values, and then afterward find the index
    of the discovered value. The code can be changed to operate on indices, but doing
    so comes at the loss of some readability.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.7: Median of Medians


       size_t pivot_index(const std::vector<int>& array,                      size_t offset,                      size_t length) {     auto find_index = [&array, offset] (         const int val) {       size_t index = offset;       while (val != array[index]) {         ++index;       }       return index;     };     if (length <= 3) {       return find_index(                median_of_3(array, offset, length));     }     size_t num = length / 3                  + ((length % 3) ? 1 : 0);     std::vector<int> medians(num);     for (size_t step = 0; step < num; ++step) {       const static size_t three = 3;       size_t index = step ⋆ 3;       medians[step] =         median_of_3(array,                     offset + index,                     std::min(three, length - index));     }     return find_index(median(&medians));   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    With this we have an optimally efficient implementation of the selection algorithm.
    Interviews often ask for pieces of the above, and allow the candidate to continue
    through the problem while time permits.


    A common generalization asks for an implementation of selection over a large data
    set. We will use the stl methods for selection and pivoting in solving this problem.
    When an interview asks for selection or pivot without requiring manipulation of
    the implementation details, we use the stl implementations. These are nth_element
    for selection, and partition if the pivot element is known in advance.


