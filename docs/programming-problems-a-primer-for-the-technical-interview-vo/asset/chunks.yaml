    \n排序是编程中的一项基础任务，当被要求对一组整数或字符串排序时，没有人应该感到措手不及。人们应该能够凭记忆生成多种最优排序方法。这意味着不仅要避免平方级排序，还要根据问题在快速排序、合并排序、基数排序和其他算法之间做出选择。\n\
    \n所有最优排序在数据上的最坏情况运行时间均为 `n log n` 级。插入排序通常用于小数据集，但它具有平方级的最坏情况复杂度。除非问题有显式限制使其变得高效，否则应避免使用它。否则，在面试中，你应该提供的唯一排序算法是快速排序。即使是朴素的快速排序实现，你也应该能够解释其期望运行时间为\
    \ `n log n`，但通过巧妙选择 `pivots`（枢轴），可以使其具有确定性的 `n log n`运行时间。\n\n在本章中，我们将实现五排序算法并讨论它们的优点。这些算法是插入排序、堆排序、快速排序和合并排序。\n\
    \n### 10.1 插入排序\n\n插入排序是一种低效的排序，但对于小集合或排序顺序偏差较小的数据集有效。插入排序通过迭代将数组中的每个元素插入到排序子数组的正确位置来工作。标准实现包含一个外层循环和一个内层循环。外层循环从前往访问数组的每个值，留下一个已排序的子数组。内层循环通过从后往前扫描在排序子数组中搜索外层循环值的位置。在搜索过程中，排序子数组的一部分向右移动一位，然后插入该值。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n**列表\
    \ 10.1：插入排序**\n```cpp\nvoid insertion_sort(std::vector<int>* array) {\n  for (int\
    \ i = 1; i < array->size(); ++i) {\n    auto val = (*array)[i];\n    for (int\
    \ j = i - 1; j >= 0 && (*array)[j] > val; --j) {\n      std::swap((*array)[j],\
    \ (*array)[j+1]);\n    }\n  }\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n可见，插入排序是一种原地算法，因为它不需要从堆中分配内存。插入排序也是一种稳定排序，因为该算法维护了元素的相对顺序。最后，由于只需要索引和临时临时值，插入排序需要常数级的额外空间。主要的缺点是插入排序具有平方级的最坏情况行为。我们的下一个算法将克服这一缺点。\n\
    \n### 10.2 堆排序\n\n堆排序使用优先队列来实现排序的最坏情况最优运行时间。堆排序的操作如下：通过调用 `make_heap` 在原地构建一个最大堆。之后，迭代地移除最大值并将其存储在数组末尾部分排序子数组的正确位置上。回想起\
    \ `make_heap` 是一个 `n log n` 级的操作，而 `pop_heap` 是对数组中每个元素调用一次的对数时间操作，我们可以看到堆排序是一种最优排序。\n\
    \n使用 `stl` 中的堆工具，可以提供一个简洁的堆排序实现。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n**列表 10.2：堆排序**\n```cpp\nvoid heap_sort(std::vector<int>* array) {\n  std::make_heap(array->begin(),\
    \ array->end());\n  for (size_t offset = array->size(); offset > 0; --offset)\
    \ {\n    std::pop_heap(array->begin(), array->begin() + offset);\n  }\n}\n```\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n注意，通过在\
    \ `make_heap` 之后调用 `sort_heap`，我们可以得到堆排序的两行解决方案。然而，这模糊了堆排序的操作细节。由于构建堆和移除最大值不需要外部内存，堆排序是一种原地算法。由于堆的创建可能会打乱相对位置，堆排序不是一种稳定排序。最后。\n\
    \n快速排序是一种分分治算法，像选择算法一样，它根据一个合适的枢轴对数据进行分区。通过随机枢轴，快速排序提供了期望运行时间。然而其最坏情况运行时间是平方级的。这通过选择中位数元素得到了克服。为了简洁，我们使用\
    \ `stl` 提供的线性时间 `nth_element`。这样做会导致有效运行时间的增加，但不会影响最坏情况渐界。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n**列表 10.3：快速排序**\n```cpp\nvoid quick_sort(std::vector<int>::iterator begin,\
    \ std::vector<int>::iterator end) {\n  size_t len = end - begin;\n  if (len <\
    \ 2) return;\n  size_t pivot = len / 2;\n  std::nth_element(begin, begin + pivot,\
    \ end);\n  quick_sort(begin, begin + pivot);\n  quick_sort(begin + pivot, end);\n\
    }\n```\n\n正如我们在选择算法的研究所示，寻找中位数元素是一个原地操作。分区和子数组递归也是原地的，因此快速排序是一种原地排序。此外，当 `nth_element`\
    \ 是稳定的时，快速排序也是稳定的。最后，请注意快速排序只需要常数量的额外空间。由于这些原因，快速排序通常是应用程序中最好用的通用排序算法。\n\n###\
    \ 10.4 基数排序\n\n在基数排序中，值首先根据某些数字位的值进行分桶。通过对多于两个集合进行分桶，基数排序是快速排序的推广。对于来自边界集合的输入，基数排序实现了线性时间的最坏情况行为。然而，当输入来自无边界域时，这种运行时间会退化为平方级。\n\
