- fmt: "\nA difficult interview question, and usually a follow-up to a discussion\
    \ of the selection problem, is to find the median on a large amount of data. The\
    \ problem is stated that the memory is too large to fit in to data, and that it\
    \ is desirable to avoid iterating through all the data in sequence.\n\nTo overcome\
    \ the memory limitation problem we break the data up into separate arrays, requiring\
    \ the candidate to operate over many small lists. The problem then reduces to\
    \ finding a candidate median in a sublist and determining that element’s position\
    \ in the over all data. If the median is not an element of one list, search must\
    \ continue on the next array. As we see this question has become both a selection\
    \ problem and a binary search problem.\n\nIn the listings in this section we provide\
    \ a solution for finding the median of an arbitrary number of vectors. We first\
    \ search the first vector, and failing to find the median value the next is searched.\n\
    \nFor clarity we separate out a number of initialization and ancillary functions.\n\
    \nAs with binary search over multiple lists, a set of bounds for search must be\
    \ associated with each list. To accomplish this, we use a tuple that holds a reference\
    \ to a list, an offset associated with that list, and the length of each array\
    \ to search. Together the offset and length determine the lower and upper bounds\
    \ for binary search. These tuples are called `ArrayBounds` and stored in an `ArrayBoundsList`\
    \ defined below.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 9.8: Data-types for Search in Selection on Large Data\n\n```cpp\n\
    typedef std::vector<int> Array;\ntypedef std::vector<Array> Arrays;\ntypedef std::tuple<Array&,\
    \ size_t, size_t> ArrayBounds;\ntypedef std::vector<ArrayBounds> ArrayBoundsList;\n\
    ```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nIn\
    \ our solution, a single instance off an `ArrayBoundsList` will be instantiated.\
    \ It is initialized with the following method.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 9.9: Initialization for Selection on Large Data\n\n```cpp\nvoid\
    \ initialize_data(Arrays* arrays, ArrayBoundsList* data, size_t* total_size) {\n\
    \    for (auto& array: *arrays) {\n        data->push_back(ArrayBounds(array,\
    \ 0, array.size()));\n        *total_size += array.size();\n    };\n}\n```\n\n\
    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nIn our solution\
    \ we must distinguish between the position of an element in an array and its index.\
    \ The reason for this is that if we find that a value is in the first position\
    \ of $n$ lists, it is also in the $n^{th}$ overall position. However the sum of\
    \ the indices is 0. We distinguish between 0 based indexes and 1 based position\
    \ counter by variable name.\n\nWe shall also see that we must pivot over a value\
    \ that may not be in the array. In order to properly update the search bounds,\
    \ we must be able to know whether or not the pivot operation encountered the pivot\
    \ value. Pivot information and an array of pivot information are stored in the\
    \ following data types. In the pair, the first entry is the position of the pivot\
    \ and the second is whether or not the pivot value was encountered in partitioning.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n### Listing\
    \ 9.10: Data-types for Pivoting in Selection on Large Data\n\n```cpp\ntypedef\
    \ std::pair<size_t, bool> PivotInfo;\ntypedef std::vector<PivotInfo> Pivots;\n\
    ```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nWith\
    \ the pre-amble concluded, the following listing is the main loop of a solution\
    \ for the median of large data. It takes each array in turn, and determines if\
    \ the median is a member of that list. Doing a binary search over the bounds of\
    \ each list, and finding the location of that element’s value within lists not\
    \ searched.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n### Listing 9.1: Median of Large Data\n\n```cpp\nint median(Arrays* arrays)\
    \ {\n    ArrayList data;\n    size_t total_size = 0;\n    initialize_data(arrays,\
    \ &data, &total_size);\n    auto median_pos = (total_size - 1) / 2 + 1;\n    size_t\
    \ pos_offset = 0;\n    for (size_t data_index = 0; data_index < data.size(); ++data_index)\
    \ {\n        auto& tuple = data[data_index];\n        auto& array = std::get<0>(tuple);\n\
    \        auto& offset = std::get<1>(tuple);\n        auto& length = std::get<2>(tuple);\n\
    \        auto begin = array.begin() + offset;\n        while (0 != length) {\n\
    \            auto mid_index = offset + length / 2;\n            auto mid = array.begin()\
    \ + mid_index;\n            std::nth_element(begin, mid, begin + length);\n  \
    \          auto value = *mid;\n            auto mid_pos = pos_offset + mid_index\
    \ + 1;\n            Pivots pivots;\n            pivots.push_back({mid_index, true});\n\
    \            partition(data_index, value, &data, &pivots, &mid_pos);\n       \
    \     if (mid_pos == median_pos) return value;\n            update_search_bounds(median_pos,\
    \ mid_pos, data_index, &data, &pivots);\n        }\n        pos_offset += offset;\n\
    \    }\n    auto& tuple = data[data.size() - 1];\n    auto& array = std::get<0>(tuple);\n\
    \    auto& offset = std::get<1>(tuple);\n    return array[offset];\n}\n```\n\n\
    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\nTwo methods\
    \ are used in the solution not yet been introduced: `partition` and `update_search_bounds`.\
    \ The `partition` method pivots all other lists on the value considered for the\
    \ median in the current list. It uses the `stl` method to separate values above\
    \ and below the pivot. It then checks the minimum value of that partition to see\
    \ if pivot is member of the upper partition.\n\n### Listing 9.2: Partition on\
    \ Pivot\n\n```cpp\nvoid partition(const size_t index, const int value, ArrayList*\
    \ data, Pivots* pivots, size_t* next_pos) {\n    for (size_t offset = 1; offset\
    \ + index < data->size(); ++offset) {\n        auto data_index = index + offset;\n\
    \        auto& tuple = data->at(data_index);\n        auto& array = std::get<0>(tuple);\n\
    \        auto begin = array.begin() + std::get<1>(tuple);\n        auto end =\
    \ begin + std::get<2>(tuple);\n        auto pos = std::partition(begin, end, [value](int\
    \ rhs) { return rhs < value; });\n        bool found_value = false;\n        if\
    \ (end != pos) {\n            nth_element(pos, pos, end);\n            if (value\
    \ == *pos) {\n                found_value = true;\n            }\n        }\n\
    \        pivots->push_back({pos - array.begin(), found_value});\n        *next_pos\
    \ += std::get<1>(tuple) + pivots->back().first + (pivots->back().second ? 1 :\
    \ 0);\n    }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n### Listing 9.13: Update Search Bounds After Partition\n"
