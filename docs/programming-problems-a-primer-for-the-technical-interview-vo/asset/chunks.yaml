    \ a graph represented in a map, `bfs` will need to be modified to understand this\
    \ representation. The `visit` function adds parents to an `Ancestry` instance.\
    \ In the listing below, we inline the `visit` function instead of passing it as\
    \ functional.\n\nListing 8.6: Ancestry from Data\n```cpp\nvoid find_ancestry(const\
    \ GenealogicalData& data, const Person& id, Ancestry* ancestry) {\n  std::queue<Person>\
    \ queue;\n  queue.push(id);\n  ancestry->insert(id);\n  while (queue.size()) {\n\
    \    auto entry = data.find(queue.front());\n    queue.pop();\n    if (entry ==\
    \ data.end()) continue;\n    for (auto parent : entry->second) {\n      if (ancestry->end()\
    \ == ancestry->find(parent)) {\n        ancestry->insert(parent);\n        queue.push(parent);\n\
    \      }\n    }\n  }\n}\n```\n\nIf the intersection of these sets is non-empty,\
    \ then we are assured that the individuals are related. Putting this all together,\
    \ the solution to the problem is given below.\n\nListing 8.7: Decide if Two People\
