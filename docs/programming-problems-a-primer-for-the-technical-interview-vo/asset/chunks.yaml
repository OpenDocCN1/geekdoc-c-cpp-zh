    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Removal from a circular doubly linked-list is simpler than that of a simple linked-list.
    This is because each node of doubly linked-list has a pointer to its previous
    element. This makes splicing a node out of a doubly linked-list trivial, where
    in a simple linked-list we needed to remove the next node and swap data values.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.12: Remove from a Doubly Linked-List


       dll_node⋆ remove(dll_node⋆ head, dll_node⋆ node) {     if (head->next == head) {       delete node;       return nullptr;     }     node->prev->next = node->next;     node->next->prev = node->prev;     if (head == node) {       head = node->next;     }     delete node;     return head;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Note that the stl provides an implementation of a circular doubly linked-list
    in std::list. When manipulating the internal structure of the list is not required
    for answering a question, it is generally better to use this class. Throughout
    this section we will use the list node and dll_node definitions provided, but
    in the sequel we rely on the stl.


    ### 2.5 Selection


    Since a linked-list is unordered and does not support random access, the question
    of finding the value at interesting positions within the list requires clever
    solutions. These are called selection problems. To being, consider finding the
    middle element of a linked-list. A straightforward method is to count the number
    of elements and then scan for the element at that index.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.13: Find the Midpoint of a Linked-List By Counting


       node⋆ mid_by_counting(node⋆ head) {     if (!head) {       return head;     }     auto trailing = head;     size_t size = 0;     while (nullptr != head) {       ++size;       head = head->next;     }     size_t mid = size / 2;     while (mid--) {       trailing = trailing->next;     }     return trailing;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This operation obviously requires one and a half full scans of the list. But we
    can do better. Consider what happens when we move two indices through the list
    in tandem. Concretely, we move one index a single node at a time and another two
    nodes at a time. When the first index is at node *x*, the second pointer is at
    position 2*x*. So when the second node reaches the end of the list the first pointer
    is at the midpoint! So indeed, we can do this with a single scan.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.14: Find the Midpoint of Linked-List


       node⋆ mid(node⋆ head) {     auto trailing = head;     while (nullptr != head) {       head = head->next;       if (head) {         head = head->next;         trailing = trailing->next;       }     }     return trailing;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This trick can be generalized to find any element at some fraction of the length
    of the list. So for any *k* we can find the element at position *lenght∕k*. But
    often the question is finding the element at the fixed position *k* from the end.
    We can find the node at position *k* from the end of the list by modifying the
    trick above in that we move two pointers in tandem, but give one a head start.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.15: Find the Node *k*^(th) from the End


       node⋆ kth_from_end(node⋆ head, size_t k) {     auto trailing = head;     while (k-- && nullptr != head) {       head = head->next;     }     while (nullptr != head            && nullptr != head->next) {       head = head->next;       trailing = trailing->next;     }     return trailing;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 2.6 Modifications


    Along with selection, lack of random access gives rise to a number of problems
    that ask for modifications of a list. The most basic is the removal of all nodes
    matching a certain value. The only modification required of the remove method
    is to maintain the current scan position in order to continue iterating after
    a node has been removed. Maintaining a trailing pointer and removing leading nodes
    that match the value can accomplish this. In this approach, care must be taken
    to remove all leading nodes that match, else successive matches will not be handled
    correctly. In the implementation, successive matches are handled by the inner
    while loop in the listing below.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.16: Remove Values from a Linked-List


       node⋆ remove_values(node⋆ head, int value) {     while (nullptr != head && head->data == value) {       auto temp = head;       head = head->next;       delete temp;     }     auto target = head;     while (nullptr != target) {       while (nullptr != target->next              && target->next->data == value) {         node⋆ temp = target->next;         target->next = target->next->next;         delete temp;       }       target = target->next;     }     return head;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Only a bit more complex is the issue of reversing the order of the nodes in a
    linked-list. In a linked-list, this can be done without constructing a new list
    by maintaining the current scan position while simultaneously modifying the node
    previously scanned. As the algorithm iterates over the list, it is reversing the
    successor predecessor relationships. After full iteration, the list is reversed.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.17: Reverse a Linked-List


       node⋆ reverse(node⋆ head) {     node⋆ prev = nullptr;     while (nullptr != head) {       node⋆ temp = head->next;       head->next = prev;       prev = head;       head = temp;     }     return prev;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Reversing a circular doubly linked-list can be done with the same technique. However
    as is usual with circular linked-lists we must keep track of the terminal condition.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.18: Reverse a Doubly Linked-List


       dll_node⋆ reverse(dll_node⋆ head) {     if (nullptr == head) return nullptr;     if (head->next == head->prev) {       return head;     }     auto tail = head;     do {       auto temp = tail->next;       tail->next = tail->prev;       tail->prev = temp;       tail = temp;     } while (tail != head);     return head->prev;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 2.7 Multiple lists


    Many problems requiring working with multiple lists simultaneously.


    Above, we saw how we can find the midpoint of a list by moving two pointers in
    tandem. Using the same idea we can solve the problem of comparing two lists with
    a single pass over each. Comparison is only difficult in that there is no random
    access. We use multiple pointers, one for each list in question.


    We first check that both lists are either empty or not empty. Afterward, we take
    it in turns to compare each element.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.19: Compare Linked-Lists


       bool equals(node⋆ x, node⋆ y) {     while(x && y) {       if (x->data != y->data) return false;       x = x->next;       y = y->next;     }     if (nullptr == x && nullptr == y) return true;     return false;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)'
