    \n### 3.4 重建\n\n关于树的最后这段讨论涉及了如何从遍历中重建二叉树的问题。这个问题在一段时间内是 Google 面试官的青睐。我们从讨论二叉树可用的遍历类型开始。\n\
    \n#### 3.4.1 遍历\n\n正如我们所看到的，二叉树上的许多算法需要枚举节点而不是搜索。访问每个数据成员的节点枚举被称为遍历。我们在上面已经了树的两种迭代遍历：广度优先遍历用于迭代地计算树的大小，深度优先遍历用于迭代地计算树的深度。\n\
    \n二叉树的遍历可以通过递归轻松实现。在任何节点上，递归地访问子节点。是节点访问的顺序区分了三种二叉树遍历。它们是中序遍历、后序遍历和前序遍历。\n\n在本节的代码中，我们将传递函数指针作为参数。该函数被用作回调，在遍历过程的适当时间访问每个节点。访问者函数的原型接收一个节点指针作为参数且没有返回值。\n\
    \n中序遍历保证二叉搜索树的数据成员将按照它们的排序顺序被访问。这是通过首先递归左侧、访问当前节点，然后递归右侧来实现。\n\n![](img/tmp_de48baecdad1ca9b2b27d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 3.17: 中序遍历\n\n```cpp\nvoid inorder(node* root, std::function<void(node*))>\
    \ visit) {\n  if (nullptr == root) return;\n  inorder(root->left, visit);\n  visit(root);\n\
    \  inorder(root->right, visit);\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b27d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n后序遍历在递归访问两个子节点之后才评估当前节点的数据值。\n\n![](img/tmp_de48baecdad1ca9b2b27d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 3.18: 后序遍历\n\n```cpp\nvoid postorder(node* root, std::function<void(node*)>\
    \ visit) {\n  if (nullptr == root) return;\n  postorder(root->left, visit);\n\
    \  postorder(root->right, visit);\n  visit(root);\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b27d05ec274fdb67_eJ4NNc_html_dffa115.gif)\
    \ 前序遍历是后序遍历的相反。前序遍历在递归访问任何子节点之前评估当前节点的数据值。\n\n![](img/tmp_de48baecdad1ca9b2b27d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 3.19: 前序遍历\n\n```cpp\nvoid preorder(node* root, std::function<void(node*)>\
    \ visit) {\n  if (nullptr == root) return;\n  visit(root);\n  preorder(root->left,\
    \ visit);\n  preorder(root->right, visit);\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b27d05ec274fdb67_eJ4NNc_html_dffa115.gif)\
    \ 遍历在将树序列化为值列表时有用，每种遍历对于给定的树都会产生一个确定的列表。然而假设我们有一个包含通用树遍历的列表。即使该列表包含两个值，我们也可以从中序遍历重建多棵树。原因是遍历没有指定哪一个是根。在列表包含\
    \ 3 个或更多值的情况下，前序和后序具有歧义。前序遍历对于第二个元素是否为根的右孩子具有歧义。后序遍历对于倒第二个元素是否为根的右孩子具有歧义。我们得出结论：单一遍历不足重建二叉树。这引导我们进入下一个问题。\n\
    \n#### 3.4.2 从遍历重建树\n\n我们展示了如何在给定两个不同遍历的情况下重建二叉树。解决此问题的关键是从一种遍历中识别根，然后使用另一种将遍历分为左子树和右子树。在下面，我们提供了一种从中序遍历和前序遍历重建树的算法。\n\
    \n在前序遍历中，第一个元素始终是子树的根。歧义在于下一个值是根的左孩子还是右孩子。在中序遍历中，给定遍历中的索引，左侧的所有值都在左子树中，右侧的所有值都在右子树中。在下面的解决方案中，我们首先从前序遍历中提取根。然后在中序遍历中找到该值的索引。如果该值不在中序遍历的开头，则有一个左子树。如果不在结尾，则有一个右子树。在任何情况下，我们从每种遍历中提取对应子树的序列并递归。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec2)\n\n列表 3.20: 二叉树的重建\n\n```cpp\nnode* reconstruct_tree(const\
    \ std::vector<int>& inorder, const std::vector<int>& preorder) {\n  auto root\
    \ = new node(preorder[0]);\n  size_t pos = std::find(inorder.begin(), inorder.end(),\
    \ root->value) - inorder.begin();\n  if (0 != pos) {\n    std::vector<int> left_inorder(inorder.begin(),\
    \ inorder.begin() + pos);\n    std::vector<int> left_preorder(preorder.begin()\
    \ + 1, preorder.begin() + 1 + left_inorder.size());\n    root->left = reconstruct_tree(left_inorder,\
    \ left_preorder);\n  }\n  if (pos != (inorder.size() - 1)) {\n    std::vector<int>\
    \ right_inorder(inorder.begin() + pos + 1, inorder.end());\n    std::vector<int>\
    \ right_preorder(preorder.begin() + 1 + left_inorder.size(), preorder.end());\n\
    \    root->right = reconstruct_tree(right_inorder, right_preorder);\n  }\n  return\
    \ root;\n}\n```\n"
- fmt: "\nA queue is an abstract data structure that preserves first-in first-out\
    \ order of its data. The queue data structure has only two basic operations: `enqueue`\
    \ and `dequeue`. `enqueue` pushes data to the back of the queue, and `dequeue`\
    \ removes data from the front of the queue. In an efficient implementation, these\
    \ operations complete in constant time.\n\nA queue is easily implemented from\
    \ a doubly linked-list. `enqueue` appends an item to the tail of a list, and `dequeue`\
    \ removes the current head node, replacing it with the next node in the list.\n\
    \nThe following is a sample implementation of a queue using the doubly linked-list\
    \ data structure provided by `std::list`. The `enqueue` operation is called `push`,\
    \ and the `dequeue` operations is called `pop`. To access the data in the queue,\
    \ we provide a method called `front` which exposes the value of the node at the\
    \ front of the queue.\n\nDue to its simplicity, it is clearer to present a queue\
    \ as a class than a set of related methods.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 4.1: Queue Class\n\n```cpp\nclass queue {\n  public:\n    void push(int\
    \ data) {\n      list.push_back(data);\n    }\n    int front() {\n      return\
    \ list.front();\n    }\n    void pop() {\n      list.pop_front();\n    }\n  private:\n\
    \    std::list<int> list;\n};\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nNote that the stl provides a template implementation of a queue as `std::queue`.\n\
    \n## 4.2 Stack\n\nA stack is an abstract data type that provides last-in first-out\
    \ access to underlying data. Compared with a queue, it provides a kind of reverse\
    \ access. As with a queue, a stack exposes two operations. These are `push` and\
    \ `pop`. `push` stores data onto the top of a stack, and `pop` removes data from\
    \ the top of the stack. These operations run in constant time in an efficient\
    \ implementation.\n\nA stack is easily implemented from a simple linked-list.\
    \ The list need not be circular or doubly linked as a stack only accesses the\
    \ head. A `push` operation inserts a node at the head, and a `pop` operation removes\
    \ the head.\n\nThe following is a sample implementation of a stack using the linked-list\
    \ data structure provided by `std::list`. To access the data in the stack, we\
    \ provide a method called `top` which exposes the value of the node at the top\
    \ of the stack.\n\nDue to its simplicity, it is clearer to present a stack as\
    \ a class than a set of related methods.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 4.2: Stack Class\n\n```cpp\nclass stack {\n  public:\n    void push(int\
    \ data) {\n      list.push_front(data);\n    }\n    int top() {\n      return\
    \ list.front();\n    }\n    void pop() {\n      list.pop_front();\n    }\n  private:\n\
    \    std::list<int> list;\n};\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nNote that the stl provides a template implementation of a stack as `std::stack`.\
    \ We will use this often in the sequel.\n\n## 4.3 Implement a queue using a stack\n\
    \nA common programming question is to implement a queue using a stack. The goal\
    \ is to show equivalence the power of the two elementary data types.\n\nThe key\
    \ to solving this problem is to understand that stacks and queues are opposite\
    \ in terms of their access, and that there is no mechanism by which a single stack\
    \ alone can implement a queue. The solution is to use two stacks to affect a reverse\
    \ of the data.\n\nIn the solution below we have two stacks called `in-stack` and\
    \ `out-stack`. The `in-stack` allows for enqueue in constant time. Each queue\
    \ `push` operation is translated into a stack `push` operation.\n\nTo support\
    \ first-in first-out, when the `dequeue` operation is taken we must be able to\
    \ reach to the bottom of the `in-stack`. To do this, we need only empty the `in-stack`\
    \ to the `out-stack`. Notice the element last in starts on top of `in-stack`,\
    \ and after the transfer it is on the bottom of `out-stack`. The top of `out-stack`\
    \ was the first in, so popping this element provides us with a queue. The private\
    \ method `transfer` consolidates the logic for the data transfer between the two\
    \ stacks.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 4.3: Implement Queue from a Stack\n\n```cpp\nclass queue {\n  public:\n\
    \    void push(int data) {\n      instack_.push(data);\n    }\n    int front()\
    \ const {\n      transfer();\n      return outstack_.top();\n    }\n    void pop()\
    \ {\n      transfer();\n      outstack_.pop();\n    }\n  private:\n    void transfer()\
    \ const {\n      if (outstack_.empty()) {\n        while (!instack_.empty()) {\n\
    \          outstack_.push(instack_.top());\n          instack_.pop();\n      \
    \  }\n      }\n    }\n    mutable std::stack<int> instack_;\n    mutable std::stack<int>\
    \ outstack_;\n};\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nNotice that the `out-stack` is only updated when it is found to be empty during\
    \ an access or `dequeue` operation. A commonly made error is to make `out-stack`\
