    ## Chapter 10


    Sorting


    Sorting is a fundamental task in programming, and no one should be taken off guard
    when asked to sort a collection of integers or strings. One should be able to
    produce a number of optimal sorts from memory. This means not only avoiding quadratic
    sorts, but also choosing appropriately between quick sort, merge sort, radix sort,
    and others depending on the problem constraints.


    All optimal sorts have worse case run time of order *n*log *n* over unbounded
    data. Insertion sort is often used for small data sets, but it has quadratic worst
    case running time. It should be avoided unless the problem is explicitly constrained
    so that it is efficient. Otherwise in an interview the only quadratic sorting
    algorithm you should every give is quick sort. And even with a naive quick sort
    implementation, you should be able to explain that its basic implementation it
    has order *n*log(*n*) running time in expectation, but can be made to have deterministic
    order *n*log(*n*) running time with a clever choice of pivots.


    In this chapter we will implement five sorting algorithms and discuss their comparative
    merits. These algorithms are insertion sort, heap sort, quick sort, radix sort,
    and merge sort.


    ### 10.1 Insertion sort


    Insertion sort is an inefficient sort that is practical for small data sets or
    data sets with only a small perturbation from sorted order.


    Insertion sort works by iteratively inserting each element of an array into its
    proper position in a sorted sub-array. A standard implementation has an outer
    loop and an inner loop. The outer loop visits each value of an array from front
    to back, leaving behind a sorted sub-array. The inner loop searches for the position
    of the outer loop value in the sorted sub-array by scanning from back to front.
    During this search a portion of the sorted sub-array is shifted right one position,
    and the value is inserted in the vacated position.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 10.1: Insertion Sort


       void insertion_sort(std::vector<int>⋆ array) {     for (int i = 1; i < array->size(); ++i) {       auto val = (⋆array)[i];       for (int j = i -1;            j >= 0 && (⋆array)[j] > val;            --j) {         std::swap((⋆array)[j], (⋆array)[j+1]);       }     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    As can be seen, insertion sort is an in-place algorithm as it does not require
    allocation of memory from the heap. Insertion sort is also a stable sort, as the
    algorithm maintains the relative order of elements. Lastly, as only the indices
    and a temporary value are required insertion sort requires constant extra space.


    The main drawback is that insertion sort has quadratic worst case behavior. Our
    next algorithm overcomes this drawback.


    ### 10.2 Heap sort


    Heap sort uses a priority queue to achieve optimal worst case running time for
    a sort.


    Heap-sort operates as follows. With a call to make_heap, a max heap is built in-place.
    Afterward, max values are iteratively removed and stored in their proper location
    in a partially sorted sub-array at the tail end of the array. Recalling that make_heap
    is an order *n*log *n* operation, and that pop_heap is a logarithmic time operation
    called once for each element in the array we can see that heap-sort is an optimal
    sort.


    Using the heap utilities in stl, a concise implementation of heap sort if available.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 10.2: Heap Sort


       void heap_sort(std::vector<int>⋆ array) {     std::make_heap(array->begin(), array->end());     for (size_t offset = array->size();          offset > 0;          offset--) {       std::pop_heap(array->begin(),                     array->begin() + offset);     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Note that by following make_heap with a call to sort_heap call, we can have a
    two line solution for heap sort. However, doing obscures insight into the operations
    of heap sort from the text.


    Since building the heap and removing the max require no external memory, heap
    sort is an in-place algorithm. Since the heap creation may shuffle the relative
    locations of elements, heap-sort is not a stable sort. And lastly, from our implementation
    of the in-place heapify method we can see that heap sort uses constant space.


    ### 10.3 Quick sort


    Quick sort is a divide and conquer algorithm that, like selection, partitions
    the data on a properly chosen pivot and recursively operates on the sub-arrays
    produced.


    With a random pivot selection, quick sort provides expected optimal run time.
    However the worst case run time is quadratic. This is overcome by choosing a pivot
    element that is near the median of the array. The implementation of median-of-3
    provided in the section on selection would suffice to guarantee optimal worst
    case behavior. For conciseness we use the linear time nth_element method provided
    by stl. Doing so will cause an increase in effective run time, but the worst-case
    asymptotic bound is unaffected.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 10.3: Quick Sort


       void quick_sort(std::vector<int>::iterator begin,                   std::vector<int>::iterator end) {     size_t len = end - begin;     if (len < 2) return;     size_t pivot = len / 2;     std::nth_element(begin,                      begin + pivot,                      end);     quick_sort(begin, begin + pivot);     quick_sort(begin + pivot, end);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    As seen in our study of election, finding the median element is an in-place operation.
    Partitioning and sub-array recursing are also in-place, and hence quick sort is
    an in-place sort. Further, when nth_element is stable so is quick sort. Lastly,
    note that quick sort uses only a constant amount of extra space.


    For these reasons quick sort is often the best generic sorting algorithm to use
    in applications.


    ### 10.4 Radix sort


    In radix sort values are first bucketed by the value of some digit prior to merging.
    By bucketing over more than two sets, radix sort is a generalization of quick
    sort. For input from a bounded set, radix sort achieves linear time worst case
    behavior. However this run time falls back to quadratic when the input is from
    an unbounded domain.'
