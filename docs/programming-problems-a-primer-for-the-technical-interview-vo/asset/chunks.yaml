  trans: "\n\n该实现有几个细节需要进一步讨论。上面的函数返回条目所在的位置，或者算法在确定键不存在时所搜索的点。我们将在后文中看到这个定义是有用的。\n\
    \n在这里使用指针算术之所以有效，是因为在 C++ 中，vector 数组是连续的，且迭代器可以被视为它们的逻辑地址。中点是数组中第一个地址 `lower`\
    \ 和最后一个地址（即第一个地址的基础上加上 `array+len-1`）的平均值。\n\n其次，由于我们知道 `key≠ mid`，我们不需要再考虑 `mid`。因此，我们可以按照相应的方向将\
    \ `lower` 和 `upper` 设置为越过 `mid`。具体来说，我们可以将 `upper` 设置为 `mid - 1`，因为这是我们尚未评估过的最低索引。\n\
    \n最后，用于寻找中点的更新规则应该在编程面试中始终使用。它是计算数组中点表达式且没有操作溢出风险的唯一方法。更常见的写法是 `mid = lower +\
    \ (upper + lower)∕2`。然而，`upper + lower` 可能会溢出。\n\n二分查找提供了对数 `n` 查找速度，对于比较搜索是最优的。然而，虽然筛选面试可能要求快速实现，但它在面试题中的具体应用有时是微妙的。\n\
    \n### 7.2 在排序数组中查找首次出现的位置。\n\n可以通过对二分查找进行微调来解决的面试题是在是在排序数组中找到目标值 `n` 最左侧出现的位置。通过修改之前二分查找实现的更新规则和退出标准，可以解决这个问题。\n\
    \n虽然之前的二分查找算法实现提供了一个不完整的答案，但它确实提供了目标位置的信息。我们应该立即发现，一旦找到任何匹配目标值的索引，我们就可以线性扫描直到找到具有目标值的最左侧元素。虽然这提供了一个正确的解决方案，但算法的运行时间是线性的。\n\
    \n注意，当找到具有目标值的索引时，我们可以将 `upper` 更新为发现的该索引。这样做将始终保持目标解在我们的搜索范围内。因此，我们将 `upper =\
    \ mid - 1` 改为 `upper = mid`。`lower` 的更新规则不需要改变。但是，我们看到，如果更新后下界等于目标值，那么它一定指向最左侧的条目。我们的最终解决方案就是修改后的二分查找。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 7.2: 查找最左目标的二分查找\n\n```cpp\nsize_t find(const std::vector<int>& array, int key)\
    \ {\n    auto lower = array.begin();\n    auto upper = array.end()-1;\n    while\
    \ (lower < upper && *lower != key) {\n        auto mid = lower + (upper - lower)\
    \ / 2;\n        if (key <= *mid) upper = mid;\n        else lower = mid + 1;\n\
    \    }\n    return lower - array.begin();\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n可以对更新规则进行类似的修改，以定位具有目标值的最右侧索引。\n\n### 7.3 在旋转数组中搜索\n\n一个更复杂的问题要求候选人在一个旋转过的排序数组中搜索目标值。旋转数组是一个长度为\
    \ `n` 的排序数组，其中每个索引 `i` 都映射到索引 `i + j (mod n)`，对于某个整数 `j`。具体来说，数组 12345 旋转 2 位后是数组\
    \ 45123。\n\n为了简单起见，我们假设每个给定的数组中不存在重复值。\n\n这个面试题有两种常见的解决方案，其中一个需要对更新规则进行复杂的修改。另一个需要一个两步搜索算法。\n\
    \n让我们再次看看二分查找需要哪些修改。给定上面的示例，我们立即看到我们的候选解决方案的问题仅在于更新规则。由于我们无法保证数组从 `lower` 到 `mid`\
    \ 以及从 `mid` 到 `upper` 是递增的，因此我们没有正确地更新。我们需要考虑枢轴（pivot）的位置。通过枚举情况，我们可以看到枢轴要么在 `lower`\
    \ 和 `mid` 之间、`mid` 和 `upper` 之间，或者不再处于正在搜索的子数组范围内。由于数组不包含重复项，我们可以通过测试 `lower <\
    \ mid` 以及 `key` 是否被限制在 `lower` 和 `mid` 之间来确定枢轴是否在 `lower` 到 `mid` 范围内。这引出了我们的第一个解决方案。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 7.3: 旋转数组中的二分查找\n\n```cpp\nsize_t find(const std::vector<int>& array, int key)\
    \ {\n    auto lower = array.begin();\n    auto upper = array.end() - 1;\n    while\
    \ (lower < upper) {\n        auto mid = lower + (upper - lower) / 2;\n       \
    \ if (key == *mid) {\n            upper = mid;\n        } else if (*lower <= *mid)\
    \ {\n            if (*lower <= key && key < *mid) {\n                upper = mid;\n\
    \            } else {\n                lower = mid + 1;\n            }\n     \
    \   } else if (*mid <= *upper) {\n            if (*mid < key && key <= *upper)\
    \ {\n                lower = mid + 1;\n            } else {\n                upper\
    \ = mid;\n            }\n        }\n    }\n    return lower - array.begin();\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n让我们通过另一种方式处理未知枢轴的问题来考虑第二个解决方案。如果我们知道枢轴的位置 `j`，那么不再特殊处理 `lower` 到 `mid` 以及 `mid`\
    \ 到 `upper` 的范围，而是修改二分查找的更新规则以使用模取运算。具体来说，如果 `n` 是数组的长度，我们可以设置 `lower = j`、`upper\
    \ = j + n – 1 (mod n) = j – 1 (mod n)` 以及 `mid = lower + (upper - lower)∕2 (mod\
    \ n)`。那么我们的二分查找就是正确的。下文实现了实现。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 7.4: 带枢轴的二分查找\n\n```cpp\nsize_t find(const std::vector<int>& array, size_t\
    \ pivot, int key) {\n    auto begin = array.begin();\n    auto length = array.size();\n\
    \    auto lower = array.begin();\n    auto upper = array.end() - 1;\n    while\
    \ (lower < upper) {\n        auto mid = lower + (upper - lower) / 2;\n       \
    \ auto mid_val = begin + (mid - begin + pivot) % length;\n        if (key <= mid_val)\
    \ upper = mid;\n        else lower = mid + 1;\n    }\n    return (lower - begin\
    \ + pivot) % length;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n我们如何找到 `j`？在在性时间内我们可以搜索最小值的索引。然而，一个最优方法可以在二分查找的基础上构建，使用类似于问题第一个解决方案的更新规则。即我们更新二分查找的下界和上界，以确保枢轴始终位于它们之间。当这种情况不再满足时，那么下界必须是枢轴值。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n列表 7.5:\
    \ 旋转数组中枢轴的二分查找\n\n```cpp\nsize_t find_pivot(const std::vector<int>& array) {\n\
    \    auto lower = array.begin();\n    auto upper = array.end() - 1;\n    while\
    \ (lower < upper) {\n        auto mid = lower + (upper - lower) / 2;\n       \
    \ if (*lower <= *mid) {\n            if (*mid < *upper) break;\n            lower\
    \ = mid + 1;\n        } else {\n            upper = mid;\n        }\n    }\n \
    \   return lower - array.begin();\n}\n```\n\n### 7.4 寻找不动点\n\n一个有趣的数学编程题要求候选人在函数中寻找不动点。\n\
    \n"
- fmt: "\nConcretely, suppose that a monotonically increasing integral function is\
    \ defined on the integers [0, 100] taking values in [0, 100]. It is represented\
    \ by an array `A`, where `f(x) = A[x]`. Since the function is bounded and increasing,\
    \ there must be a value `y` such that `f(y) = y`. Such a `y` is called a fixed-point.\n\
    \nWe can find the fixed-point with binary search with a process similar to what\
    \ was used to find the pivot in a rotated array. The idea is to always update\
    \ the bounds so that the fixed-point is in the range being searched. To do this,\
    \ we update so that `lower <= A[lower]` and `upper >= A[upper]`. Below is an implementation\
    \ of this solution.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
