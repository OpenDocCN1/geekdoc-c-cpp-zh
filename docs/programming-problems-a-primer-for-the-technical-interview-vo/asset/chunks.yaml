  raw: 'Concretely, suppose that a monotonically increasing integral function is defined
    on the integers [0*,*100] taking values in [0*,*100]. It is represented by an
    array *A*, where *f*(*x*) = *A*[*x*]. Since the function is bounded and increasing,
    there must be a value *y* such that *f*(*y*) = *y*. Such a *y* is called a fixed-point.


    We can find the fixed-point with binary search with a process similar to what
    was used to find the pivot in a rotated array. The idea is to always update the
    bounds so that the fixed-point is in the range being searched. To do this, we
    update so that *lower* ≤ *A*[*lower*] and *upper* ≥ *A*[*upper*]. Below is an
    implementation of this solution.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.6: Find a Fixed-Point


       size_t fixed_point(const std::vector<int>& array) {     auto lower = array.begin();     auto upper = array.end() - 1;     while (lower < upper) {       auto mid = lower + (upper - lower) / 2;       if (⋆mid <= (mid - array.begin())) {         upper = mid;       } else {         lower = mid + 1;       }     }     return lower - array.begin();   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 7.5 Find duplicate values


    Suppose we are asked to find one value in a sequence of integers that appears
    twice. We can solve this problem with binary search.


    The idea is to update the bounds so that we consider the half that is larger than
    the number of integers it could hold if there were no duplicates. The reason this
    works is similar to above. For if there is a duplicate value in the array, and
    the array has all the elements in the sequence, then the length of the array must
    be larger than the difference of its last and first elements.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.7: Find Duplicates in a Sequence


       size_t find_duplicates(       const std::vector<int>& array) {     auto lower = array.begin();     auto upper = array.end() - 1;     while (lower < upper) {       auto mid = lower + (upper - lower) / 2;       auto mid_val = ⋆lower + (⋆upper - ⋆lower) / 2;       if (mid_val < ⋆mid) {         upper = mid;       } else {         lower = mid + 1;       }     }     return lower - array.begin();   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Note the similarity with finding the fixed-point of a function. The expected middle
    value is what would be present if there were no duplicates. By calculating it
    above and comparing against the actual mid, we are converting the bounds so this
    and the fixed-point problem have the same problem.


    ### 7.6 Binary search in a Young Tableau


    Finally, let’s consider an example that uses the technique of binary search in
    a more complex implementation. Suppose we are given an *n* × *m* matrix *M* of
    integers. The integers are sorted from smallest to largest in columns and in rows.
    That is *M*[ij] ≤ *M*[il] whenever *j* ≤ *l*, and *M*[ij] ≤ *M*[kj] whenever *i*
    ≤ *k*. Such a matrix is called a Young tableau. The question is to find the coordinates
    of an element of the matrix with a specified value.


    The matrix data structure and coordinate data type we use are defined below.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.8: Definition of a Matrix


       typedef std::vector<std::vector<int>> matrix;   typedef std::pair<size_t, size_t> coordinate;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    We want to choose bounds such that after a comparison the search space can be
    significantly reduced. If we try to flatten the matrix and search, preprocessing
    would require visiting all *n*² elements. But we should be able to do better with
    a kind of binary search.


    To apply binary search, we would need to find an update rule that reduces the
    search space significantly. Suppose we have a mid point of the matrix at position
    *i,j*. If *M*[*i.j*] is less than our key value, we could increase the value of
    the matrix entry. So it is appropriate to increment either the row or column.
    If *M*[*i,j*] is greater than our key value we need to decrement either the row
    or column. To avoid branching we want to choose a starting position where we have
    exactly one choice of updates after comparing an entry to the key value. There
    are two natural locations that provide this property: the bottom left corner and
    the top right corner. Below we start in the bottom left corner of the matrix and
    perform a diagonal search upward.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.9: Diagonal search of a matrix


       coordinate find(const matrix& m, const int key) {     coordinate coord = {m.size() - 1, 0};     while (coord.first < m.size()            && coord.second < m[0].size()            && m[coord.first][coord.second] != key) {       if (m[coord.first][coord.second] > key) {         coord.first--;       } else {         coord.second++;       }     }     return coord;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The algorithm above is linear. To see this note that in the worst case it may
    traverse to the opposite corner of the matrix. But as we’ve seen, binary search
    attains logarithmic run time by reducing the search space by a constant amount.
    And with some insight that bound can be achieved for search on the Young tableau.


    Again consider the extreme matrix entries. *M*[1*,*1] is the smallest entry in
    the matrix, and *M*[*n,m*] is the largest. Generalizing, given a sub-matrix defined
    by entries *M*[*p,q*] and *M*[*s,t*], where *p* ≤ *s*, and *q* ≤ *t*, we know
    that *M*[*p,q*] is the smallest entry in the sub-matrix and *M*[*s,t*] is the
    largest.


    With this insight, we can write a matrix binary search that reduces the search
    space by a constant fraction each step. This will produce an optimal solution.
    The idea is to start with a sub-matrix bounded by *M*[*p,q*] on the top left and
    *M*[*s,t*] on the bottom right. We calculate a middle row *i* = (*p* + *s*)*∕*2,
    and search this row to find the column which best separates the matrix into four
    sub-matrices. The column *j* that achieves this is the first entry *M*[*i,j*]
    in row *i* that is greater than or equal to the key value. Now consider the separation
    of the matrix into the four sub matrices bounded by row *i* and column *j*. The
    key cannot appear in the top left sub-matrix because it is larger than *M*[*i*
    - 1*,j* - 1]. Further the key can not appear in the bottom right sub-matrix because
    it is smaller than *M*[*i,j*]. Hence we need only look at the remaining two sub-matrices:
    the upper right and lower left. We have narrowed the search down to half the original
    domain.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.10: Binary search in Young tableau'
