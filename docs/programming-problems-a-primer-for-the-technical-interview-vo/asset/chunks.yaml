    \  }\n  while (nullptr != root && root != x && root != y && (y->value < root->value\
    \ || x->value >= root->value)) {\n    if (y->value < root->value) {\n      root\
    \ = root->left;\n    } else {\n      root = root->right;\n    }\n  }\n  return\
