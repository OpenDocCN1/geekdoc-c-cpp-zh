  raw: 'Consider the problem of finding the most common element in large list with
    many distinct elements.


    To solve this problem, we want to build a histogram of the count of each distinct
    element. To construct this histogram we will require a container to store an entry
    that is a tuple of the element and a counter. The element is the key of this entry,
    and the counter is the entry’s value.


    When elements are first encountered, we add an entry with count 1. Otherwise we
    increment the counter associated with that element. So clearly, for each element
    in the list we need to support both insertion and lookup. In a binary tree, each
    lookup can require order log *n* comparison, and each insert can require order
    log *n* comparisons. An efficient hash table we can reduce each lookup and insertion
    to expected constant time and solve the problem with a linear scan.


    After scanning the input, the hash table has a count of the frequency of each
    element in the list. We can keep track of the current most common element during
    iteration. If the *k* most common elements are desired, we can use a bounded size
    min heap as in the previous section.


    The following listing provides an implementation of finding the most common element
    in a list of strings using a hash table.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.17: Find the Most Common Element


       std::string find_most_common_element(       std::istream& stream,       std::unordered_map<std::string, size_t>⋆         hash_table) {     std::string str;     while (!stream.eof() && stream >> str) {       (⋆hash_table)[str] += 1;     }     std::string max_str;     size_t max_count = 0;     for (auto& entry : ⋆hash_table) {       if (entry.second > max_count) {         max_str = entry.first;         max_count = entry.second;       }     }     return max_str;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 6.6 Implement a most recently used cache


    A cache is a data structure used to reduce retrieval time of data from a remote
    store. A subset of elements is stored locally, and retrieval first looks locally
    before looking remotely. Caches are bounded and store only a subset of the data
    available from the remote store. For this reason they must implement an eviction
    policy. A most recently used cache is one that evicts the least recently used
    element. In this subsection, we solve the problem of implementing a MRU cache.


    The MRU cache must efficiently support both retrieval and priority updating. To
    implement this data type we use a combination of two containers we have already
    visited. We use the unordered_map implementation of a hash table for lookup, and
    a doubly linked-list to maintain priority.


    To facilitate retrieval in the linked-list, the hash table used for retrieval
    stores the address of the nodes of the linked-list. The linked-list stores the
    priority of each entry in the cache by the order of the nodes. The head of the
    linked-list always contains the most recently accessed item, and the tail will
    be the least recently accessed item. In order to maintain correctness, the cache
    must be updated by the calling accessed whenever an element is used.


    The structures used in our cache are present in the definition below.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.18: Most Recently Used Cache


       struct MruCache {     typedef std::string key_type;     typedef int value_type;     typedef std::pair<key_type, value_type> Item;     typedef std::list<const Item⋆> List;     List list;     typedef std::unordered_map<       key_type, List::iterator>         Hashtable;     Hashtable table;     const size_t bound;        MruCache(size_t bound);     void store(const Item⋆ item);     const Item⋆ find(const key_type& key);   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    As defined above, a cache implements two methods, find and store. The find method
    uses the hash table for quick retrieval of items from the cache. When find retrieves
    an item that item is accessed and the priority must be updated. To update the
    priority without allocating new memory, we move the location of item’s node within
    the linked-list to the head. This is done with the splice method.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.19: Retrieval in Most Recently Used Cache


       const MruCache::Item⋆ MruCache::find(       const key_type& key) {     auto iter = table.find(key);     if (table.end() != iter) {       list.splice(list.begin(), list, iter->second);       return ⋆(iter->second);     }     return nullptr;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    When local retrieval fails, a method must call the remote store. The item retrieved
    is then saved to the cache by the store member function. It is within store that
    the eviction policy is implemented. The item stored is prepended to the front
    of the list, and the hash table is updated with the item’s key value. If the cache
    is above capacity after the item is added, the least recently used item is removed.
    This item is found at the tail of the list. When removed from the priority queue,
    the item must also be removed from the hash table.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.20: Access Recording in Most Recently Used Cache


       void MruCache::store(const Item⋆ item) {     list.push_front(item);     table[item->first] = list.begin();     if (list.size() > bound) {       table.erase(list.back()->first);       list.pop_back();     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Let’s consider the running time of this implementation. The operations of the
    find method are a hash table lookup and the splice moving a node to the head of
    the linked-list. These are constant time operations. Further, the operations of
    the store method are insertion into the hash table, insertion into a linked-list,
    and a possible removal from the linked list. These operations also take constant
    time. From this we see we have an efficient implementation of the MRU cache.


    ## Chapter 7


    Binary Search


    Searching and sorting are the fundamental operations of computer programming,
    and in the next few chapters we examine each in some detail. There are three search
    techniques that every programmer should memorize. These are binary search, breadth
    first search, and depth first search. Binary search can be used for search in
    any sorted, random access data structure. Breadth first search and depth first
    search are graph search algorithms useful for finding minimum distance between
    nodes and detecting cycles. Before sorting, we will look at basic implementations
    and programming problems related of each of these search algorithms.


    We begin with binary search.


    ### 7.1 Binary search


    Binary search is fundamental, and it should be known by rote as it is often asked
    as a gating or screening question. It is one of the first algorithms we learn,
    and influences many data structures we use in programming. It is also one for
    the first applications of branch and bound, in that the update rule divides the
    search space in half.


    The following is an implementation of binary search for searching an integer array.
    The result of the search is the location of the element with the specified key.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 7.1: Binary Search


       size_t find(const std::vector<int>& array,               int key) {     auto lower = array.begin();     auto upper = array.end()-1;     while (lower < upper) {       auto mid = lower + (upper - lower) / 2;       if (key == ⋆mid) return mid - array.begin();       if (key < ⋆mid) upper = mid -1;       else lower = mid + 1;     }    return lower - array.begin();   }


