    Tracking and modifying *bfs* to provide state information when visiting a node
    is a powerful technique that has many other uses.


    #### 8.2.2 Ancestry from genealogical data.


    My favorite interview question asks a candidate to determine if two people are
    related. In this question, each person is a node. Every node has at most two parents.
    The question is framed as having incomplete genealogical data, which is the full
    ancestry of each individual may not be known. This gives rise to graphs that may
    not be connected.


    To solve this problem, we first represent the domain as a directed graph. Each
    person is a node, with the key being an identifier for a person. Every node is
    adjacent to at most two other nodes representing the parents. Edges are orientated
    from a child to parent. The following listing creates a graph from the parental
    data. The nodes of the graph are represented in the map specialization GeneologicalData.
    The neighbors of each node are the values associated with the entry in the map.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.5: Types for Ancestry from Genealogical Data


       typedef unsigned Person;   typedef std::vector<Person> Parents;   typedef std::map<Person, Parents> GeneologicalData;   typedef std::set<Person> Ancestry;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The Ancestry type defined above is used to memoize all ancestors of a person.


    To determine whether or not two individuals are related, we first use *bfs* to
    calculate the full ancestry of each individual. Since we are dealing with a graph
    represented in a map, *bfs* will need to be modified to understand this representation.
    The visit function simply adds parents to an Ancestry instance. In the listing
    below, we inline the visit function instead of passing it as a functional.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.6: Ancestry from Genealogical Data


       void find_ancestry(const GeneologicalData& data,                      const Person& id,                      Ancestry⋆ ancestry) {     std::queue<Person> queue;     queue.push(id);     ancestry->insert(id);     while (queue.size()) {       auto entry = data.find(queue.front());       queue.pop();       if (entry == data.end()) continue;       for (auto parent : entry->second) {         if (ancestry->end()               == ancestry->find(parent)) {           ancestry->insert(parent);           queue.push(parent);         }       }     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    If the intersection of these sets is non-empty, then we are assured that the individuals
    are related. Putting this all together, the solution to the problem is given below.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.7: Decide if Two People are Related.


       bool related(const GeneologicalData& data,                Person id1,                Person id2) {     Ancestry ancestry1;     find_ancestry(data, id1, &ancestry1);     Ancestry ancestry2;     find_ancestry(data, id2, &ancestry2);     Ancestry intersection;     std::set_intersection(       ancestry1.begin(),       ancestry1.end(),       ancestry2.begin(),       ancestry2.end(),       std::inserter(intersection,                     intersection.begin()));     return !intersection.empty();   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The listing above is not efficient, but it does solve the problem. Speaking to
    efficiency, it requires a full *bfs* traversal of the ancestry of one individual
    before beginning the second. Since in a full family tree, the number of parents
    grows exponentially the set or ancestors has the possibility of being extremely
    large. There are many ways to overcome this problem, such as a level traversal
    of the ancestry graph.


    ### 8.3 Depth first search


    Depth first search is a graph traversal algorithm characterized by its use of
    a stack to maintain the frontier of traversal. We often abbreviate it as *dfs*.
    There are many important differences with *bfs*. Depth first search attempts to
    discover the next longest path, while breadth first search iterates through a
    frontier of equidistant nodes. Further, for each vertex visited in depth first
    search the stack maintains a path from that node to the root of the search. In
    *bfs*, the order of traversal history is lost when the next node is visited.


    As with *bfs*, an implementation of *dfs* requires maintaining a list of vertices
    that have been visited. There are implicitly two such lists. The nodes on the
    stack will have their children visited. The nodes already visited will never again
    be elements of the stack. The stack contains pairs of iterators, one for a node
    and for that nodes adjacency list. The iterator maintains the order in which neighbors
    are to be visited.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 8.8: Depth First Search


       node⋆ dfs(node⋆ origin, Visitor visit) {     std::set<node⋆> queued;     std::stack<std::pair<       node⋆,       std::vector<node⋆>::iterator>> stack;     stack.push({origin, origin->neighbors.begin()});     queued.insert(origin);     while (!stack.empty()) {       auto current = stack.top().first;       auto& neighbor = stack.top().second;       if (neighbor != current->neighbors.end()) {         node⋆ next = ⋆neighbor;         ++neighbor;         if (queued.end() == queued.find(next)) {           stack.push({next,                       next->neighbors.begin()});           queued.insert(next);         }         continue;       }       visit(current);       stack.pop();     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The listing could be simplified with recursion. Instead of maintaining the iterators
    in the stack, we could call *dfs* with the current node as the origin. However
    we provide an iterative stack implementation to show the similarity with *bfs*.
    Notice that aside from using a stack instead of queue the code is similar. However,
    surprisingly different behavior results from such a small change from *bfs*.


    #### 8.3.1 Determine execution order of a task.


    Given a graphical representation of sub-processes of a large task, where each
    node in the graph represents a sub-process. The children of a node depend on the
    completion of their parent nodes. The problem is to determine an execution order
    for all the processes in which no process is started before its parents have completed.
    For this problem the directed graph is special in that it has no cycles, and is
    called a directed acyclic graph. If it had cycles then no sequential execution
    order would exist.


    This problem of determining sequential execution order can be solved by *dfs*.
    Suppose the origin is a node that has no incoming edges. If we begin *dfs* from
    this node, because there are no cycles we will eventually reach a node that has
    no children. This node represents a process that is dependent upon the entire
    contents of the stack during *dfs*. We save this to the back of a list holding
    the reverse of execution order.


    We continue in this fashion until every node is visited and added to the list.
    If the graph has not been fully traversed but *dfs* has an empty stack, we choose
    the next node from the graph with no incoming edges and iterate.


    When this process completes, the list contains the reverse of the execution order.
    Reversing the list, we then have execution order.


    The following listing implements the determination of execution order of the graph
    starting with origin. In this listing we assume there is exactly one node with
    no incoming edges, and that node is provided as the parameter. With an implementation
    of *dfs* that takes a Visitor parameter, the code is simplified by using a functional.'
