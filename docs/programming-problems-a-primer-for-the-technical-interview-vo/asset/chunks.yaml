    its current array and added to the result, and the process iterates. Since the
    original arrays are sorted, this involves only a linear scan. So all that is left
    is how to divide. But as with quick sort we can always divide input into smaller
    halves until we are left with individual units from which we can begin to combine
    into sorted output.


    In-place merge is a difficult algorithm to implement; however, it is provided
    by stl as the function inplace_merge. Leveraging this, we have a parsimonious
    implementation of in-place merge sort in C++.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 10.5: Merge Sort


       void merge_sort(std::vector<int>::iterator begin,                   std::vector<int>::iterator end) {     size_t len = end - begin;     if (1 >= len) return;     size_t prefix_len = len / 2;     merge_sort(begin, begin + prefix_len);     merge_sort(begin + prefix_len, end);     std::inplace_merge(begin,begin + prefix_len,end);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    As the merge is in-place, this implementation requires only memory allocation
    on the stack. However the recursive calls may require up to logarithmic extra
    space. Merge sort can be implemented as a stable sort.


    While worst case behavior is asymptotically equivalent to that of quick sort,
    it has been argued that in-place quick sort is faster in practice. There are many
    possible reasons for this, including optimization of the inner loop of quick sort
    and lower stack space requirements. However, merge sort is the obvious choice
    when sorting over large data.


    ### 10.6 Sorting over large data


    A favorite interview question at Google asks to sort 4GB of data using only 100MB
    of memory. While the specific numerical limits may change, the key insight is
    to use merge sort to accomplish sorting over large data.


    This is an exercise in partitioning and merging. First each contiguous sub-array
    of the smaller bound of data should be sorted with quick sort. Doing so is fast,
    in place, and requires only a constant amount of extra memory. Afterward, each
    of these sub-arrays are merged as with merge sort. A sample implementation of
    the merge is provided below.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 10.6: Sorting Large Data with Merge Sort


       void merge_vectors(       const std::vector<std::vector<int>>& in,       std::vector<int>⋆ out) {     typedef std::vector<int> Array;     typedef Array::const_iterator Iterator;     typedef std::tuple<Iterator, Iterator> Element;     std::vector<Element> heap;     for (int index = 0; index < in.size(); ++index) {       if (!in[index].empty()) {         Element tuple(in[index].begin(),                       in[index].end());         heap.push_back(tuple);       }     }     auto comparator = [] (const Element& lhs,                           const Element& rhs) {       return ⋆std::get<0>(lhs) < ⋆std::get<0>(rhs);     };     std::make_heap(heap.begin(),                    heap.end(),                    comparator);     while (!heap.empty()) {       auto tuple = heap.front();       std::pop_heap(         heap.begin(),         heap.end(),         comparator);       out->push_back(⋆std::get<0>(tuple));       if (std::get<1>(tuple) != ++std::get<0>(tuple)) {         heap.push_back(tuple);         std::push_heap(           heap.begin(),           heap.end(),           comparator);       }     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ## Afterward


    And with that, we complete this step in our journey. I hope you’ve enjoyed this
    tour through elementary data structures and fundamental algorithms. We’ve covered
    a lot of material and solved some of the most difficult problems encountered in
    technical interviews. I enjoyed the process of writing this book, and sincerely
    hope you enjoyed reading it. If you’re new to computer programming, I hope you
    enjoyed learning the tricks and techniques the selection of problems covered.
    If you’re an experienced developer, I hope this volume reminded you of the joy
    of solving problems that keeps us in engineering. Thanks for coming along with
    me, and I look forward to seeing you again in volume two, *Advanced Algorithms
    in* C++11.'
