  trans: "\n\n一个困难的面试题，通常也是选择问题讨论的后续问题，是在海量数据中寻找中位数。该问题的描述是：内存空间过大，无法容纳所有数据，且希望避免顺序遍历所有数据。\n\
    \n为了克服内存限制问题，我们将数据拆分为单独的数组，要求候选人在许多小列表上进行操作。问题随后简化为：在子列表中找到一个候选中位数，并确定该元素在所有数据中的位置。如果中位数不是某个列表中的元素，则必须在下一个数组上继续搜索。正如我们看到的，这个问题既是一个选择问题，也是一个二分查找问题。\n\
    \n在本节的列表代码，我们提供了一个寻找任意数量向量中位数的解决方案。我们首先搜索第一个向量，如果未能找到中位数值，则搜索下一个。\n\n为了清晰起见，我们分离出若干初始化函数和辅助函数。\n\
    \n与在多个列表上进行二分查找一样，每个列表都必须关联一组搜索边界。为了实现这一点，我们使用一个元组，其中包含列表的引用、与该列表相关的偏移量以及要搜索的数组长度。偏移量和长度共同决定了二分查找的下界和上界。这些元组被称为\
    \ `ArrayBounds`，并存储在下面定义的 `ArrayBoundsList` 中。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 9.8：大数据选择中搜索的数据类型\n\n```cpp\ntypedef std::vector<int> Array;\ntypedef\
    \ std::vector<Array> Arrays;\ntypedef std::tuple<Array&, size_t, size_t> ArrayBounds;\n\
    typedef std::vector<ArrayBounds> ArrayBoundsList;\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n在我们的解决方案中，将实例化一个 `ArrayBoundsList` 。它通过以下方法进行初始化。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 9.9：大数据选择的初始化\n\n```cpp\nvoid initialize_data(Arrays* arrays, ArrayBoundsList*\
    \ data, size_t* total_size) {\n    for (auto& array: *arrays) {\n        data->push_back(ArrayBounds(array,\
    \ 0, array.size()));\n        *total_size += array.size();\n    };\n}\n```\n\n\
    ![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n在我们的解决方案中，我们必须区分元素在数组中的位置和它的索引。之所以这样做是因为，如果我们发现某个值位于\
    \ $n$ 个列表的第一个位置，它它也是整体的第 $n^{th}$ 个位置。然而，索引之和为 0。我们通过变量名来区分基于 0 的索引和基于 1 的位置计数器。\n\
    \n我们还将看到，我们必须对一个可能不在数组中的值进行基准划分（pivot）。为了正确更新搜索边界，我们必须知道基准操作是否遇到了基准值。基准信息以及基准信息数组存储在以下数据类型中。在对中，第一个元素是基准的位置，第二个元素是分区分区过程中是否遇到了基准值。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n###\
    \ 列表 9.10：大数据选择中基准划分的数据类型\n\n```cpp\ntypedef std::pair<size_t, bool> PivotInfo;\n\
    typedef std::vector<PivotInfo> Pivots;\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n序言结束之后，接下来的列表是大数据中位数解决方案的主循环。它依次处理每个数组，并确定中位数是否为该列表的成员。在每个列表的边界上进行二分查找，并找到该元素的值在未搜索列表中的位置。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n###\
    \ 列表 9.1：大数据中位数\n\n```cpp\nint median(Arrays* arrays) {\n    ArrayList data;\n\
    \    size_t total_size = 0;\n    initialize_data(arrays, &data, &total_size);\n\
    \    auto median_pos = (total_size - 1) / 2 + 1;\n    size_t pos_offset = 0;\n\
    \    for (size_t data_index = 0; data_index < data.size(); ++data_index) {\n \
    \       auto& tuple = data[data_index];\n        auto& array = std::get<0>(tuple);\n\
    \        auto& offset = std::get<1>(tuple);\n        auto& length = std::get<2>(tuple);\n\
    \        auto begin = array.begin() + offset;\n        while (0 != length) {\n\
    \            auto mid_index = offset + length / 2;\n            auto mid = array.begin()\
    \ + mid_index;\n            std::nth_element(begin, mid, begin + length);\n  \
    \          auto value = *mid;\n            auto mid_pos = pos_offset + mid_index\
    \ + 1;\n            Pivots pivots;\n            pivots.push_back({mid_index, true});\n\
    \            partition(data_index, value, &data, &pivots, &mid_pos);\n       \
    \     if (mid_pos == median_pos) return value;\n            update_search_bounds(median_pos,\
    \ mid_pos, data_index, &data, &pivots);\n        }\n        pos_offset += offset;\n\
    \    }\n    auto& tuple = data[data.size() - 1];\n    auto& array = std::get<0>(tuple);\n\
    \    auto& offset = std::get<1>(tuple);\n    return array[offset];\n}\n```\n\n\
    ![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n解决方案中使用了两个尚未介绍的方法：`partition`\
    \ 和 `update_search_bounds`。`partition` 方法对当前列表中考虑的中位数值对所有其他列表进行基准划分。它使用 `stl`\
    \ 方法将高于基基准的值隔开。然后它检查该分区的最小值以查看基准是否为分区的成员。\n\n### 列表 9.2：基于基准划分\n\n```cpp\nvoid\
    \ partition(const size_t index, const int value, ArrayList* data, Pivots* pivots,\
    \ size_t* next_pos) {\n    for (size_t offset = 1; offset + index < data->size();\
    \ ++offset) {\n        auto data_index = index + offset;\n        auto& tuple\
    \ = data->at(data_index);\n        auto& array = std::get<0>(tuple);\n       \
    \ auto begin = array.begin() + std::get<1>(tuple);\n        auto end = begin +\
    \ std::get<2>(tuple);\n        auto pos = std::partition(begin, end, value { return\
    \ rhs < value; });\n        bool found_value = false;\n        if (end != pos)\
    \ {\n            nth_element(pos, pos, end);\n            if (value == *pos) {\n\
    \                found_value = true;\n            }\n        }\n        pivots->push_back({pos\
    \ - array.begin(), found_value});\n        *next_pos += std::get<1>(tuple) + pivots->back().first\
    \ + (pivots->back().second ? 1 : 0);\n    }\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n### 列表 9.13：分区后更新搜索边界\n\n"
- fmt: "\n```cpp\nvoid update_search_bounds(const size_t target_pos, const size_t\
    \ current_pos, const size_t data_index, ArrayBoundsList* data, Pivots* pivots)\
    \ {\n  std::function<void(size_t, size_t)> update = nullptr;\n  if (current_pos\
    \ > target_pos) {\n    update = [data, pivots] (size_t index, size_t offset) {\n\
    \      auto& tuple = data->at(index + offset);\n      std::get<2>(tuple) = pivots->at(offset).first\
    \ - std::get<1>(tuple);\n    };\n  } else {\n    update = [data, pivots] (size_t\
    \ index, size_t offset) {\n      auto& tuple = data->at(index + offset);\n   \
    \   std::get<2>(tuple) -= pivots->at(offset).first - std::get<1>(tuple);\n   \
    \   std::get<1>(tuple) = pivots->at(offset).first;\n      if (0 == offset) {\n\
    \        std::get<2>(tuple) -= 1;\n        std::get<1>(tuple) += 1;\n      }\n\
    \    };\n  }\n  for (size_t offset = 0; offset + data_index < data->size(); ++offset)\
    \ {\n    update(data_index, offset);\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nAll together, these methods provide a complete solution. The main idea is combining\
    \ selection and binary search is presented in the main loop. And it is that which\
    \ is often the insight required for solving this problem.\n\n# Chapter 10: Sorting\n\
    \nSorting is a fundamental task in programming, and no one should be taken off\
    \ guard when asked to sort a collection of integers or strings. One should be\
    \ able to produce a number of optimal sorts from memory. This means not only avoiding\
    \ quadratic sorts, but also choosing appropriately between quick sort, merge sort,\
    \ radix sort, and others depending on problem.\n\nAll optimal sorts have worse\
    \ case run time of order `n log n` over data. Insertion sort is often used for\
    \ small data, but it has quadratic worst case. It should be avoided unless the\
    \ problem is explicitly constrained so that it is efficient. Otherwise in an interview\
    \ the only sorting algorithm you should give is quick sort. And even with a naive\
    \ quick sort implementation, you should be able to explain that its order `n log\
    \ n` running time in expectation, but can be made to have deterministic `n log\
    \ n` running time with a clever choice of `pivots`.\n\nIn this chapter we will\
    \ implement five sorting algorithms and discuss their merits. These algorithms\
    \ are insertion sort, heap sort, quick sort, and merge sort.\n\n### 10.1 Insertion\
    \ sort\n\nInsertion sort is an inefficient sort that is practical for small sets\
    \ or data sets with a small perturbation from sorted order. Insertion sort works\
    \ by iteratively inserting each element of an array into its proper position in\
    \ a sorted sub-array. A standard implementation has an outer loop and an inner\
    \ loop. The outer loop visits each value of an array from front to back, leaving\
    \ behind a sorted sub-array. The inner loop searches for the position of the outer\
    \ loop value in the sorted sub-array by scanning from back to front. During this\
    \ search a portion of the sorted sub-array is shifted right one position, and\
    \ the value is inserted.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n**Listing 10.1: Insertion Sort**\n```cpp\nvoid insertion_sort(std::vector<int>*\
    \ array) {\n  for (int i = 1; i < array->size(); ++i) {\n    auto val = (*array)[i];\n\
    \    for (int j = i - 1; j >= 0 && (*array)[j] > val; --j) {\n      std::swap((*array)[j],\
    \ (*array)[j+1]);\n    }\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nAs can be seen, insertion sort is an in-place algorithm as it does not require\
    \ allocation of memory from the heap. Insertion sort is also a stable sort, as\
    \ the algorithm maintains the relative order of elements. Lastly, as only the\
    \ indices and a temporary value are required insertion sort requires constant\
    \ extra space. The main drawback is that insertion sort has quadratic worst case\
    \ behavior. Our next algorithm overcomes this drawback.\n\n### 10.2 Heap sort\n\
    \nHeap sort uses a priority queue to achieve optimal worst case running time for\
    \ a sort. Heap-sort operates as follows. With a call to `make_heap`, a max heap\
    \ is built in-place. Afterward, max values are iteratively removed and stored\
    \ in their proper location in a partially sorted sub-array at the tail end of\
    \ the array. Recalling that `make_heap` is an order `n log n` operation, and that\
    \ `pop_heap` is a logarithmic time operation called once for each element in the\
    \ array we can see that heap-sort is an optimal sort.\n\nUsing the heap utilities\
    \ in `stl`, a concise implementation of heap sort available.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n**Listing 10.2: Heap Sort**\n```cpp\nvoid heap_sort(std::vector<int>* array)\
    \ {\n  std::make_heap(array->begin(), array->end());\n  for (size_t offset = array->size();\
    \ offset > 0; --offset--) {\n    std::pop_heap(array->begin(), array->begin()\
    \ + offset);\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nNote that by following `make_heap` with a call to `sort_heap` call, we can have\
    \ a two line solution for heap sort. However, doing obscures insight into the\
    \ operations of heap sort from the text.\n\nSince building the heap and removing\
    \ the max require no external memory, heap sort is an in-place algorithm. Since\
    \ the heap creation may shuffle the relative locations, heap sort is not a stable\
    \ sort. And lastly, from our implementation we see heap sort uses constant space.\n\
    \n### 10.3 Quick sort\n\nQuick sort is a divide and conquer algorithm that, like\
    \ selection, partitions the data on a properly chosen pivot. With a random pivot,\
    \ quick sort provides expected run time. However the worst case run time is quadratic.\
    \ This is overcome by choosing pivot element near the median. For conciseness\
    \ we use linear time `nth_element` provided by `stl`. Doing so will cause an increase\
    \ in effective run time, but the worst-case asymptotic bound is unaffected.\n\n\
    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n**Listing\
    \ 10.3: Quick Sort**\n```cpp\nvoid quick_sort(std::vector<int>::iterator begin,\
    \ std::vector<int>::iterator end) {\n  size_t len = end - begin;\n  if (len <\
    \ 2) return;\n  size_t pivot = len / 2;\n  std::nth_element(begin, begin + pivot,\
    \ end);\n  quick_sort(begin, begin + pivot);\n  quick_sort(begin + pivot, end);\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n\
    As seen in our study of election, finding the median element is an in-place operation.\
    \ Partitioning and sub-array recursing are also in-place, and hence quick sort\
    \ is an in-place sort. Further, when `nth_element` is stable so is quick sort.\
    \ Lastly, note that quick sort uses only a constant amount of extra space. For\
    \ these reasons quick sort is often the best generic sorting algorithm to use\
    \ in applications.\n\n### 10.4 Radix sort\n\nIn radix sort values are first bucketed\
    \ by the value of some digit prior to merging. By bucketing over more than two\
    \ sets, radix sort is a generalization of quick sort. For input from a bounded\
    \ set, radix sort achieves linear time worst case behavior. However this run time\
    \ falls back to quadratic when the input is from an unbounded domain.\n"
