    \n### 3.4 Reconstruction\n\nThis final discussion of trees deals with the question\
    \ of how to reconstruct a binary tree from a traversal. This question was a favorite\
    \ of interviewers at Google for some time. We begin with a discussion of the types\
    \ of traversals available to a binary tree.\n\n#### 3.4.1 Traversal\n\nAs we have\
    \ seen, many algorithms on binary trees require enumeration of the nodes instead\
    \ of a search. An enumeration of the nodes in which each data member is visited\
    \ is called a traversal. We have seen two iterative traversals of a tree above,\
    \ breadth-first traversal was used to iteratively calculate the size of a tree\
    \ and depth-first traversal was used to iteratively calculate the depth of a tree.\n\
    \nTraversal of a binary tree is easily accomplished by recursion. At any node\
    \ recursively visit the children nodes. It is the order in which nodes are visited\
    \ which differentiates the three binary tree traversals. These are in-order traversal,\
    \ post-order traversal, and pre-order traversal.\n\nIn the code in this section,\
    \ we will pass a function pointer as a parameter. This function is used as a callback\
    \ to visit each node at the appropriate time during traversal. The prototype for\
    \ the visitor function takes a node pointer as a parameter and has no return value.\n\
    \nAn in-order traversal guarantees that the data members of a binary search tree\
    \ will be visited in their sort order. This is accomplished by first recursing\
    \ left, visiting the current node, and then recursing right.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 3.17: In-Order Traversal\n\n```cpp\nvoid inorder(node* root, std::function<void(node*))>\
    \ visit) {\n  if (nullptr == root) return;\n  inorder(root->left, visit);\n  visit(root);\n\
    \  inorder(root->right, visit);\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nA post-order traversal evaluates a current node’s data value only after recursively\
    \ visiting both children.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 3.18: Post-Order Traversal\n\n```cpp\nvoid postorder(node* root, std::function<void(node*)>\
    \ visit) {\n  if (nullptr == root) return;\n  postorder(root->left, visit);\n\
    \  postorder(root->right, visit);\n  visit(root);\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nA pre-order traversal is the opposite of a post-order traversal. A pre-order\
    \ traversal evaluates a current nodes data value prior to recursively visiting\
    \ either.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 3.19: Pre-Order Traversal\n\n```cpp\nvoid preorder(node* root, std::function<void(node*)>\
    \ visit) {\n  if (nullptr == root) return;\n  visit(root);\n  preorder(root->left,\
    \ visit);\n  preorder(root->right, visit);\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nTraversal are useful in serializing a tree to a list of values, and every type\
    \ of traversal produces a deterministic list for a given tree. However suppose\
    \ we have a list containing a traversal of a general tree. Even if that list contains\
    \ two values, we can reconstruct multiple trees from an in-order traversal. The\
    \ reason is that the traversal does not specify which is the root. In the case\
    \ where the list contains 3 or more values, pre-order and post-order have ambiguity.\
    \ Pre-order traversals are ambiguous as to whether or not the second element is\
    \ a right child of the root. Post-order traversals are ambiguous as to whether\
    \ or not the second to last element is a right child of the root. We conclude\
    \ that no single traversal is enough to reconstruct a binary tree. This leads\
    \ us to the next problem.\n\n#### 3.4.2 Reconstructing a tree from a traversal\n\
    \nWe show how to reconstruct a binary tree given any two distinct traversals.\
    \ The key to solving this problem is recognizing the root from one traversal,\
    \ and then dividing the traversals into left and right sub-trees using the other.\
    \ In the following, we provide an algorithm for tree reconstruction from an in-order\
    \ traversal and a pre-order traversal.\n\nIn a pre-order traversal, the first\
    \ element is always the root of the sub-tree. The ambiguity is whether the next\
    \ value is a left or right child of the root. In the in-order traversal, given\
    \ an index in the traversal, all values to the left are in the left sub-tree and\
    \ all values to the right are in the right sub-tree. In the solution below, we\
    \ first extract the root from the pre-order traversal. We then find the index\
    \ of this value in the in-order traversal. If the value does not appear at the\
    \ beginning of the in-order traversal there is a left sub-tree. If it does not\
    \ appear at the end, there is a right sub-tree. In either case we extract from\
    \ each traversal the subsequences corresponding to a sub-tree, and recurse.\n\n\
    ![](tmp_de48baecdad1ca9b2b7d5ec2)\n\nListing 3.20: Reconstruction of a Binary\
    \ Tree\n\n```cpp\nnode* reconstruct_tree(const std::vector<int>& inorder, const\
    \ std::vector<int>& preorder) {\n  auto root = new node(preorder[0]);\n  size_t\
    \ pos = std::find(inorder.begin(), inorder.end(), root->value) - inorder.begin();\n\
    \  if (0 != pos) {\n    std::vector<int> left_inorder(inorder.begin(), inorder.begin()\
    \ + pos);\n    std::vector<int> left_preorder(preorder.begin() + 1, preorder.begin()\
    \ + 1 + left_inorder.size());\n    root->left = reconstruct_tree(left_inorder,\
    \ left_preorder);\n  }\n  if (pos != (inorder.size() - 1)) {\n    std::vector<int>\
    \ right_inorder(inorder.begin() + pos + 1, inorder.end());\n    std::vector<int>\
    \ right_preorder(preorder.begin() + 1 + left_inorder.size(), preorder.end());\n\
    \    root->right = reconstruct_tree(right_inorder, right_preorder);\n  }\n  return\
    \ root;\n}\n```\n*(Note: The provided code in the source text was truncated/malformed;\
