    To overcome the memory limitation problem we break the data up into separate arrays,
    requiring the candidate to operate over many small lists. The problem then reduces
    to finding a candidate median in a sublist and determining that element’s position
    in the over all data. If the median is not an element of one list, search must
    continue on the next array. As we see this question has become both a selection
    problem and a binary search problem.


    In the listings in this section we provide a solution for finding the median of
    an arbitrary number of vectors. We first search the first vector, and failing
    to find the median value the next is searched.


    For clarity we separate out a number of initialization and ancillary functions.


    As with binary search over multiple lists, a set of bounds for search must be
    associated with each list. To accomplish this, we use a tuple that holds a reference
    to a list, an offset associated with that list, and the length of each array to
    search. Together the offset and length determine the lower and upper bounds for
    binary search. These tuples are called ArrayBounds and stored in an ArrayBoundsList
    defined below.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.8: Data-types for Search in Selection on Large Data


       typedef std::vector<int> Array;   typedef std::vector<Array> Arrays;   typedef std::tuple<     Array&, size_t, size_t>       ArrayBounds;   typedef std::vector<ArrayBounds> ArrayBoundsList;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    In our solution, a single instance off an ArrayBoundsList will be instantiated.
    It is initialized with the following method.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.9: Initialization for Selection on Large Data


       void initialize_data(Arrays⋆ arrays,                        ArrayBoundsList⋆ data,                        size_t⋆ total_size) {     for (auto& array: ⋆arrays) {       data->push_back(         ArrayBounds(array, 0, array.size()));       ⋆total_size += array.size();     };   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    In our solution we must distinguish between the position of an element in an array
    and its index. The reason for this is that if we find that a value is in the first
    position of *n* lists, it is also in the *n*^(th) overall position. However the
    sum of the indices is 0\. We distinguish between 0 based indexes and 1 based position
    counter by variable name.


    We shall also see that we must pivot over a value that may not be in the array.
    In order to properly update the search bounds, we must be able to know whether
    or not the pivot operation encountered the pivot value. Pivot information and
    an array of pivot information are stored in the following data types. In the pair,
    the first entry is the position of the pivot and the second is whether or not
    the pivot value was encountered in partitioning.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.10: Data-types for Pivoting in Selection on Large Data


       typedef std::pair<size_t, bool> PivotInfo;   typedef std::vector<PivotInfo> Pivots;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    With the pre-amble concluded, the following listing is the main loop of a solution
    for the median of large data. It takes each array in turn, and determines if the
    median is a member of that list. Doing a binary search over the bounds of each
    list, and finding the location of that element’s value within lists not yet searched
    do this.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.11: Median of Large Data


       int median(Arrays⋆ arrays) {     ArrayBoundsList data;     size_t total_size = 0;     initialize_data(arrays, &data, &total_size);     auto median_pos = (total_size - 1) / 2 + 1;     size_t pos_offset = 0;     for (size_t data_index = 0;          data_index < data.size();          ++data_index) {       auto& tuple = data[data_index];       auto& array = std::get<0>(tuple);       auto& offset = std::get<1>(tuple);       auto& length = std::get<2>(tuple);       auto begin = array.begin() + offset;       while (0 != length) {         auto mid_index = offset + length / 2;         auto mid = array.begin() + mid_index;         std::nth_element(begin,                          mid,                          begin + length);         auto value = ⋆(mid);         auto mid_pos = pos_offset + mid_index + 1;         Pivots pivots;         pivots.push_back({mid_index, true});         partition(data_index,                   value,                   &data,                   &pivots,                   &mid_pos);         if (mid_pos == median_pos) return value;         update_search_bounds(median_pos,                              mid_pos,                              data_index,                              &data,                              &pivots);       }       pos_offset += offset;     }     auto& tuple = data[data.size() - 1];     auto& array = std::get<0>(tuple);     auto& offset = std::get<1>(tuple);     return array[offset];   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Two methods are used in the solution have not yet been introduced: partition and
    update_search_bounds. The partition method pivots all other lists on the value
    being considered for the median in the current list. It uses the stl method to
    first separate values above and below the pivot value. It then checks the minimum
    value of that partition to see if the pivot is a member of the upper partition.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.12: Partition Array on Pivot


       void partition(const size_t index,                  const int value,                  ArrayBoundsList⋆ data,                  Pivots⋆ pivots,                  size_t⋆ next_pos) {     for (size_t offset = 1;          offset + index < data->size();          ++offset) {       auto data_index = index + offset;       auto& tuple = data->at(data_index);       auto& array = std::get<0>(tuple);       auto begin = array.begin()+std::get<1>(tuple);       auto end = begin + std::get<2>(tuple);       auto pos = std::partition(         begin,         end,         [value] (int rhs) { return rhs < value; });       bool found_value = false;       if (end != pos) {         nth_element(pos, pos, end);         if (value == ⋆pos) {           found_value = true;         }       }       pivots->push_back({pos - array.begin(),                          found_value});       ⋆next_pos += std::get<1>(tuple)                    + pivots->back().first                    + (pivots->back().second ? 1 : 0);     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The second method update_search_bounds updates the search bounds for every list.
    The update is based on whether the over-all median is less than or greater than
    the considered value. It is during this update that the binary search is affected
    on the current list.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 9.13: Update Search Bounds After Partition'
