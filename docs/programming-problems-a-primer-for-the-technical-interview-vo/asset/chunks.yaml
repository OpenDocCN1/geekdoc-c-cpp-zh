    \ favorite interview question asks a candidate to determine if two people are\
    \ related. In this question, each person is a node. Every node has at most two\
    \ parents. The question is framed as having incomplete genealogical data, which\
    \ is the full ancestry of each individual may not be known. This gives rise to\
    \ graphs that may not be connected.\n\nTo solve this problem, we first represent\
    \ the domain as a directed graph. Each person is a node, with the key being an\
    \ identifier for a person. Every node is adjacent to at most two nodes representing\
    \ the parents. Edges are orientated from child to parent. The following listing\
    \ creates a graph from parental data. The nodes of the graph are represented in\
    \ the map `GeneologicalData`. The neighbors of each node are the values associated\
    \ with the entry.\n\nListing 8.5: Types for Ancestry from Genealogical Data\n\
    ```cpp\ntypedef unsigned Person;\ntypedef std::vector<Person> Parents;\ntypedef\
    \ std::map<Person, Parents> GenealogicalData;\ntypedef std::set<Person> Ancestry;\n\
    ```\n\nThe `Ancestry` type defined above is used to memoize all ancestors of a\
    \ person. To determine whether or not individuals are related, we first use `bfs`\
