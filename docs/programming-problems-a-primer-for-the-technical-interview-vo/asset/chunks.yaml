    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 2.23: Find Loops in a Linked-List\n\n```cpp\nbool detect_loop(node* head) {\n\
    \  if (nullptr == head) {\n    return false;\n  }\n  auto trailing = head;\n \
