    \  Ancestry ancestry2;\n  find_ancestry(data, id2, &ancestry2);\n  Ancestry intersection;\n\
    \  std::set_intersection(\n    ancestry1.begin(),\n    ancestry1.end(),\n    ancestry2.begin(),\n\
    \    ancestry2.end(),\n    std::inserter(intersection, intersection.begin()));\n\
    \  return !intersection.empty();\n}\n```\n\nThe listing above is not efficient,\
    \ but it does solve the problem. Speaking to efficiency, it requires a full `bfs`\
    \ traversal of the ancestry of one individual before the second. Since in a full\
    \ tree, the number of parents grows exponentially the set of ancestors has the\
    \ possibility of being extremely large. There are many ways to overcome this problem,\
    \ such as level traversal of the ancestry.\n\n## 8.3 Depth first search\n\nDepth\
    \ first search is a graph algorithm characterized by its use of a stack to maintain\
    \ the frontier of traversal. We often abbreviate it as `dfs`. There are many differences\
    \ with `bfs`. Depth first search attempts to discover the next longest path while\
