  trans: "\n在本节中，我们将更深入地研究二叉堆。\n\n## 5.2 操作\n\n在接下来的章节中，我们将实现二叉堆的基本操作：`insert`（插入）、`find_max`（查找最大）、`remove_max`（删除最大）和\
    \ `increase_key`（增大键）。每个操作作用于满足堆属性的二叉树节点。因此，我们从 `heapify` 操作开始，它可以从一个向量原地初始化一个二叉堆。\n\
    \n### 5.2.1 初始化\n\n从向量初始化二叉堆涉及二叉树的逻辑表示以及元素的重新排序，以使其满足堆属性。我们首先描述用于表示堆的二叉树结构。\n\n\
    二叉树结构通过将向量中元素的索引与完全二叉树中节点的层序位置相对应来实现。向量的索引 `0` 对应二叉树的根。对于向量中位置 `i` 处的节点，左孩子位于位置\
    \ `2 * i + 1`，右孩子位于 `2 * i + 2`。拥有一个计算这些索引的方法将非常有用。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 5.1: 堆的子索引\n\n```cpp\nsize_t lchild_index(const size_t index) {\n  return\
    \ index * 2 + 1;\n}\nsize_t rchild_index(size_t index) {\n  return index * 2 +\
    \ 2;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n注意，按照这种方案，下一个可用的叶子节点是越过堆之后的最右侧元素。索引 `i` 处的节点的父节点位于 `(i - 1) / 2`。整数除法会自动取整。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 5.2: 堆的父索引\n\n```cpp\nsize_t parent_index(const size_t index) {\n  return (index\
    \ != 0) ? (index - 1) / 2 : 0;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n`heapify` 操作从向量中索引 `0` 处的单个元素开始。这个单元素子数组显而易见地满足堆属性。操作随后迭代地从向量中添加元素，并保持堆属性。具体而言，新元素首先作为叶子节点添加。之后，如果违反了堆属性，则反复交换父子节点。当算法终止时，堆的最大值位于第一个索引处，且满足堆属性。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 5.3: 堆的创建 Heapify\n\n```cpp\nvoid heapify(std::vector<int>* array) {\n  for\
    \ (auto itr = array->begin(); itr != array->end(); ++itr) {\n    auto index =\
    \ itr - array->begin();\n    auto parent = parent_index(index);\n    while (index\
    \ != parent && (*array)[parent] < (*array)[index]) {\n      std::swap((*array)[parent],\
    \ (*array)[index]);\n      index = parent;\n      parent = parent_index(index);\n\
    \    }\n  }\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n虽然二叉堆不是最优效率的堆结构，但正如我们看到的，二叉堆是可以原地构建的，而不需要为树分配内存。由于不需要分配辅助对象而节省的时间通常会抵消使用针对最坏情况优化的实现所带来的缺点。\n\
    \n### 5.2.2 插入\n\n向二叉堆中插入新值是从将该值作为二叉树中下一个可用的叶子节点开始的。之后，将像 `heapify` 那样更新父子关系以满足堆属性。插入需要动态调整向量的大小，因此不是原地操作。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 5.4: 插入堆\n\n```cpp\nvoid insert(std::vector<int>* heap, int value) {\n  heap->push_back(value);\n\
    \  auto index = heap->size() - 1;\n  auto parent = parent_index(index);\n  while\
    \ (index != 0 && (*heap)[index] > (*heap)[parent]) {\n    std::swap((*heap)[index],\
    \ (*heap)[parent]);\n    index = parent;\n    parent = parent_index(index);\n\
    \  }\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 5.2.3 查找最大值\n\n在二叉堆中，`find_max` 操作是从将值作为二叉树中下一个可用的叶子节点开始的。之后，像 `heapify`\
    \ 那样更新父子关系以满足堆属性。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 5.5: 在堆中查找最大值\n\n```cpp\nint find_max(const std::vector<int>& heap) {\n \
    \ return heap[0];\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n 5.2.4 删除最大值\n\n从二叉堆中删除最大值需要完成两个目标。首先，通过堆的最后一个元素来替换根值。其次，需要调整向量的结构。这些要求通过以下序列来实现：首先，通过交换父子关系来满足堆属性。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n列表 5.6:\
    \ 从堆中删除元素\n\n```cpp\nvoid remove_max(std::vector<int>* heap) {\n  std::swap(*heap->begin(),\
    \ *(heap->end() - 1));\n  heap->resize(heap->size() - 1);\n  size_t index = 0;\n\
    \  while (index < heap->size()) {\n    auto child = lchild_index(index);\n   \
    \ if (child >= heap->size()) {\n      break;\n    }\n    auto right = rchild_index(index);\n\
    \    if (right < heap->size() && (*heap)[right] > (*heap)[child]) {\n      child\
    \ = right;\n    }\n    if ((*heap)[index] >= (*heap)[child]) {\n      break;\n\
    \    }\n    std::swap((*heap)[index], (*heap)[child]);\n    index = child;\n \
    \ }\n}\n```\n\n### 5.2.5 增大键\n\n当最大堆中的键被增大时，堆属性可能不再适用于该节点及其父节点。因此，通过增大键的值，我们可能需要降低其索引直到数组满足堆属性。这是通过我们标准的交换做法完成的。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n列表 5.7:\
    \ 在堆中增大键\n\n```cpp\nvoid increase_key(std::vector<int>* heap, size_t index) {\n\
    \  (*heap)[index]++;\n  auto parent = parent_index(index);\n  while (0 != index\
    \ && (*heap)[index] > (*heap)[parent]) {\n    std::swap((*heap)[index], (*heap)[parent]);\n\
    \    index = parent;\n    parent = parent_index(index);\n  }\n}\n```\n\n这种操作可以自然地推广到减小键和键更改。\n\
    \nSTL 提供了许多创建和管理二叉堆的算法。`make_heap` 提供了从向量初始化的支持。`pop_heap` 实现删除最大值，而 `push_heap`\
    \ 提供了插入。\n\n## 5.3 幂的枚举\n\n解决编程问题依赖于选择正确的数据结构，正如依赖适当算法一样。考虑枚举一组初始非负数字幂的问题。具体而言，给定一组整数，问题是按增加顺序列出这些整数的幂且不重复。例如，给定集合\
    \ {2,3,4}，前六个幂将是 1 = 2⁰, 2 = 2¹, 3 = 3¹, 4 = 4¹ = 4, 8 = 2³, 9 = 3² 。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 5.8: 幂的枚举\n"
- fmt: "\n```cpp\nvoid enumerate_powers(const std::set<unsigned>& set, size_t num_powers,\
    \ std::vector<int>* out) {\n  typedef std::pair<unsigned, unsigned> ValueTerm;\n\
    \  std::vector<ValueTerm> heap;\n  for(auto& value: set) {\n    heap.push_back({1,\
    \ value});\n  }\n  std::make_heap(heap.begin(), heap.end(), std::greater<ValueTerm>());\n\
    \  int value = 0;\n  while (0 != num_powers && 0 != heap.size()) {\n    auto entry\
    \ = heap.front();\n    std::pop_heap(heap.begin(), heap.end(), std::greater<ValueTerm>());\n\
    \    if (value != entry.first) {\n      value = entry.first;\n      out->push_back(value);\n\
    \      --num_powers;\n    }\n    heap.back() = {entry.first * entry.second, entry.second};\n\
    \    std::push_heap(heap.begin(), heap.end(), std::greater<ValueTerm>());\n  }\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n\
    Using a priority queue pairing a term and its lowest unvisited power solved this\
    \ problem. Note that by preserving the heap between calls, the solution can be\
    \ converted to a generator.\n\n### 5.4 Find top k elements\n\nFinally, let’s consider\
    \ the problem of determining the top `k` elements of a stream. Online algorithms\
    \ with stream inputs usually constrain the problem to a single pass, as either\
    \ the data is volatile or is too large to fit into main memory.\n\nLet’s begin\
    \ by reviewing the simple case of finding the maximum element. The maximum element\
    \ of a vector can be found by a linear scan.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.9: Find Max Value in an Array\n\n```cpp\nint max(const std::vector<int>&\
    \ array) {\n  int max_val = array[0];\n  for (auto& element: array) {\n    max_val\
    \ = std::max(element, max_val);\n  }\n  return max_val;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nA little intuition leads us to recall that a single element array is a trivial\
    \ priority queue. The generalization of this process to finding the top `k` elements\
    \ of an `n` element stream is solved in a single pass with a min heap. To operate\
    \ within the constraints of memory, we will bound size of the priority queue.\n\
    \nTo operate on a bounded size heap, we only insert when the value of an item\
    \ is larger than the smallest element in the heap. When it is, we remove the smallest\
    \ element with a `remove_max` operation and then insert the new value.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 5.10: Find Top k Elements of a Stream\n\n```cpp\nvoid find_topk(std::istream&\
    \ in, size_t k, std::vector<int>* heap) {\n  heap->reserve(k);\n  int val;\n \
    \ while (heap->size() < k && in >> val) {\n    heap->push_back(val);\n  }\n  std::make_heap(heap->begin(),\
    \ heap->end(), std::greater<int>());\n  while (!in.eof() && in >> val) {\n   \
    \ if (val > heap->front()) {\n      std::pop_heap(heap->begin(), heap->end(),\
    \ std::greater<int>());\n      heap->back() = val;\n      std::push_heap(heap->begin(),\
    \ heap->end(), std::greater<int>());\n    }\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nThe run time of this algorithm is an efficient `O(log k)`, as each removal of\
    \ the minimum element and insertion may take time logarithmic in the size of the\
    \ heap. This is efficient for the online problem.\n\n## Chapter 6 Hash Tables\n\
    \nHash tables are important data structures whose efficiency and flexibility allow\
    \ them to be used in almost any kind of search problem. A large part of being\
    \ computer programming is being able to evaluate a problem and design the proper\
    \ data structure to address it. As the popularity of higher-level languages grew,\
    \ more and candidates default to the hash table. And because of their flexibility\
    \ hash tables can lead to a correct, but inefficient solution. They can be equally\
    \ effective in finding duplicates in a linked list, to counting the elements in\
    \ a stream, and in fact problem that requires a search of a pre-generated list.\n\
    \nBut hash tables have drawbacks. They cannot be easily enumerated by key or value.\
    \ It takes work to guarantee a proper hash function has been chosen for a specific\
    \ data set, as collisions in the search space can degrade lookup performance tremendously.\
    \ Also there is much memory overhead to using a hash table as a key-value map,\
    \ and dynamic resizing can occur at any insert.\n\nIn this section, we cover the\
    \ material that every candidate should know regarding hash tables. We discuss\
    \ the three important features of hash table implementation; the hash function,\
    \ collision resolution, and dynamic resizing. And finally conclude with a number\
    \ of applications of hash tables that have been asked as interview questions.\n\
    \n### 6.1 The hash function\n\nA hash function maps a large domain to a smaller\
    \ range of values. For instance, a simple hash function can map the set of all\
    \ strings to the integers between 0 and 31. The hash of a data structure is computed\
    \ by calling a hash function on a specified element of the data structure called\
    \ a key. The hash value of a variable is the result of evaluating the hash function\
    \ on that variable’s key.\n\nHash functions require a number of properties to\
    \ guarantee correctness and efficiency of a hash table.\n\nA hash function must\
    \ be deterministic in that every data structure with the same key must have the\
    \ same hash value. Otherwise retrieval from a hash table is impossible.\n\nA hash\
    \ function should guarantee that the domain is nearly uniformly distributed across\
    \ the range. That means probability that two elements, chosen at random, have\
    \ identical hash values is `n⁻¹` when the range is of size `n`. In this way, that\
    \ hash function minimizes the chance of false positives. A collision is when two\
    \ distinct elements have equal hash values.\n\nFinally, a hash function must be\
    \ able to be efficiently computed across the domain. It is common for a hash function\
    \ to take constant time on elements of the domain.\n\nHash functions may have\
    \ other properties, but they find use in only special purposes. For instance,\
    \ a hash function can be tolerant of unimportant features of a key, such as capitalization,\
    \ to provide normalized hashing. A hash function can be continuous, in that small\
    \ changes to a key result in small changes to its hash value. This guarantees\
    \ locality of similar objects within a hash table. Consistent hashing provides\
    \ a balanced load across a set of ranges, and is used in load balancing client\
    \ requests.\n\nLet’s examine the problem of creating a hash function for lower\
    \ case English words. Below is a first attempt. Here we hash any lower case English\
    \ string to the ASCII value of its first character.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nListing 6.1: A Simple Hash Function\n\n```cpp\nsize_t hash(const std::string&\
    \ str) {\n  if (str.empty()) return 0;\n  return str[0] - 'a';\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nThis function is deterministic and extremely efficient, its range is limited\
    \ to only 26 values and many strings will hash to the same value. Further, the\
    \ corpus of English words it is not uniformly distributed across these 26 values.\
    \ An examination of the words in the Gutenberg library shows that 17% of the words\
    \ start with `t`, nearly 12% of words start with the letter `a` but only 0.05%\
    \ of words start with z.\n\nTo overcome these two problems, we add complexity\
    \ to the calculation of the hash value.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nListing 6.2: Another Hash Function\n\n```cpp\nsize_t hash(const std::string&\
    \ str) {\n  size_t hash_value = 0;\n  for (auto c : str) {\n    hash_value +=\
    \ c - 'a';\n  }\n  return hash_value;\n}\n```\n"
  raw: '   void enumerate_powers(       const std::set<unsigned>& set,       size_t num_powers,       std::vector<int>⋆ out) {     typedef std::pair<unsigned, unsigned> ValueTerm;     std::vector<ValueTerm> heap;     for(auto& value: set) {       heap.push_back({1, value});     }     std::make_heap(heap.begin(),                    heap.end(),                    std::greater<ValueTerm>());     int value = 0;     while (0 != num_powers && 0 != heap.size()) {       auto entry = heap.front();       std::pop_heap(heap.begin(),                     heap.end(),                     std::greater<ValueTerm>());       if (value != entry.first) {         value = entry.first;         out->push_back(value);         --num_powers;       }       heap.back() = {entry.first ⋆ entry.second,                      entry.second};       std::push_heap(heap.begin(),                      heap.end(),                      std::greater<ValueTerm>());     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Using a priority queue pairing a term and its lowest unvisited power solved this
    problem. Note that by preserving the heap between calls, the solution can be converted
    to a generator.


    ### 5.4 Find top *k* elements


    Finally, let’s consider the problem of determining the top *k* elements of a stream.
    Online algorithms with stream inputs usually constrain the problem to a single
    pass, as either the data is volatile or is too large to fit into main memory.


    Let’s begin by reviewing the simple case of finding the maximum element. The maximum
    element of a vector can be found by a linear scan.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 5.9: Find Max Value in an Array


       int max(const std::vector<int>& array) {     int max_val = array[0];     for (auto& element: array) {       max_val = std::max(element, max_val);     }     return max_val;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    A little intuition leads us to recall that a single element array is a trivial
    priority queue. The generalization of this process to finding the top *k* elements
    of an *n* element stream is solved in a single pass with a min heap. To operate
    within the constraints of memory, we will bound size of the priority queue.


    To operate on a bounded size heap, we only insert when the value of an item is
    larger than the smallest element in the heap . When it is, we remove the smallest
    element with a remove_max operation and then insert the new value.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 5.10: Find Top *k* Elements of a Stream


       void find_topk(std::istream& in,                  size_t k,                  std::vector<int>⋆ heap) {     heap->reserve(k);     int val;     while (heap->size() < k            && in >> val) {       heap->push_back(val);     }     std::make_heap(heap->begin(),                    heap->end(),                    std::greater<int>());     while (!in.eof() && in >> val) {       if (val > heap->front()) {         std::pop_heap(heap->begin(),                       heap->end(),                       std::greater<int>());         heap->back() = val;         std::push_heap(heap->begin(),                        heap->end(),                        std::greater<int>());       }     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The run time of this algorithm is an efficient *O*(log *k* * *n*), as each removal
    of the minimum element and insertion may take time logarithmic in the size of
    the heap. This is efficient for the online problem.


    ## Chapter 6


    Hash Tables


    Hash tables are important data structures whose efficiency and flexibility allow
    them to be used in almost any kind of search problem.


    A large part of being a computer programming is being able to evaluate a problem
    and design the proper data structure to address it. As the popularity of higher-level
    languages grew, more and more candidates default to the hash table. And because
    of their flexibility hash tables can lead to a correct, but inefficient solution.
    They can be equally effective in finding duplicates in a linked list, to counting
    the elements in a stream, and in fact in problem that requires a search of a pre-generated
    list. But hash tables have drawbacks. They cannot be easily enumerated by key
    or value. It takes work to guarantee a proper hash function has been chosen for
    a specific data set, as collisions in the search space can degrade lookup performance
    tremendously. Also there is much memory overhead to using a hash table as a key-value
    map, and dynamic resizing can occur at any insert.


    In this section, we cover the material that every candidate should know regarding
    hash tables. We discuss the three important features of hash table implementation;
    the hash function, collision resolution, and dynamic resizing. And finally conclude
    with a number of applications of hash tables that have been asked as interview
    questions.


    ### 6.1 The hash function


    A hash function maps a large domain to a smaller range of values. For instance,
    a simple hash function can map the set of all strings to the integers between
    0 and 31\. The hash of a data structure is computed by calling a hash function
    on a specified element of the data structure called a key. The hash value of a
    variable is the result of evaluating the hash function on that variable’s key.


    Hash functions require a number of properties to guarantee correctness and efficiency
    of a hash table.


    A hash function must be deterministic in that every data structure with the same
    key must have the same hash value. Otherwise retrieval from a hash table is impossible.


    A hash function should guarantee that the domain is nearly uniformly distributed
    across the range. That means probability that two elements, chosen at random,
    have identical hash values is *n*^-¹ when the range is of size *n*. In this way,
    that hash function minimizes the chance of false positives. A collision is when
    two distinct elements have equal hash values.


    Finally, a hash function must be able to be efficiently computed across the domain.
    It is common for a hash function to take constant time on elements of the domain.


    Hash functions may have other properties, but they find use in only special purposes.
    For instance a hash function can be tolerant of unimportant features of a key,
    such as capitalization, to provide normalized hashing. A hash function can be
    continuous, in that small changes to a key result in small changes to its hash
    value. This guarantees locality of similar objects within a hash table. Consistent
    hashing provides a balanced load across a set of ranges, and is used in load balancing
    client requests.


    Let’s examine the problem of creating a hash function for lower case English words.
    Below is a first attempt. Here we hash any lower case English string to the ASCII
    value of its first character.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.1: A Simple Hash Function


       size_t hash(const std::string& str) {     if (str.empty()) return 0;     return str[0] - ''a'';   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This function is deterministic and extremely efficient, its range is limited to
    only 26 values and hence many strings will hash to the same value. Further, the
    corpus of English words it is not uniformly distributed across these 26 values.
    An examination of the words in the Gutenberg library shows that 17% of the words
    start with *t*, nearly 12% of words start with the letter *a* but only 0*.*05%
    of words start with z.


    To overcome these two problems, we add complexity to the calculation of the hash
    value.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.2: Another Hash Function


       size_t hash(const std::string& str) {     size_t hash_value = 0;     for (auto c : str) {       hash_value += c - ''a'';     }     return hash_value;   }'
