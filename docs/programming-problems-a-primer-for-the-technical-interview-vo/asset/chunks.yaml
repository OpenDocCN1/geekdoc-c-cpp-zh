    calculating size or paths. Since determining the least common ancestor does not
    require keeping state, we have no need of an ancillary queue or stack.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.16: Lowest Common Ancestor Iterative


       node⋆ lca(node⋆ root, node⋆ x, node⋆ y) {     if (nullptr != x         && nullptr != y         && x->value > y->value) {       std::swap(x, y);     }     while (nullptr != root            && root != x            && root != y            && (y->value < root->value                || x->value >= root->value)) {       if (y->value < root->value) {         root = root->left;       } else {         root = root->right;       }     }     return root;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 3.4 Reconstruction


    This final discussion of trees deals with the question of how to reconstruct a
    binary tree from a traversal. This question was a favorite of interviewers at
    Google for some time. We begin with a discussion of the types of traversals available
    to a binary tree.


    #### 3.4.1 Traversal


    As we have seen, many algorithms on binary trees require enumeration of the nodes
    instead of a search. An enumeration of the nodes in which each data member is
    visited is called a traversal. We have seen two iterative traversals of a tree
    above, breadth-first traversal was used to iteratively calculate the size of a
    tree and depth-first traversal was used to iteratively calculate the depth of
    a tree.


    Traversal of a binary tree is easily accomplished by recursion. At any node recursively
    visit the children nodes. It is the order in which nodes are visited which differentiates
    the three binary tree traversals. These are in-order traversal, post-order traversal,
    and pre-order traversal.


    In the code in this section, we will pass a function pointer as a parameter. This
    function is used as a callback to visit each node at the appropriate time during
    traversal. The prototype for the visitor function takes a node pointer as a parameter
    and has no return value.


    An in-order traversal guarantees that the data members of a binary search tree
    will be visited in their sort order. This is accomplished by first recursing left,
    visiting the current node, and then recursing right.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.17: In-Order Traversal


       void inorder(node⋆ root,                std::function<void(node⋆)> visit) {     if (nullptr == root) return;     inorder(root->left, visit);     visit(root);     inorder(root->right, visit);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    A post-order traversal evaluates a current node’s data value only after recursively
    visiting both children.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.18: Post-Order Traversal


       void postorder(node⋆ root,                  std::function<void(node⋆)> visit) {     if (nullptr == root) return;     postorder(root->left, visit);     postorder(root->right, visit);     visit(root);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    A pre-order traversal is the opposite of a post-order traversal. A pre-order traversal
    evaluates a current nodes data value prior to recursively visiting either children.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.19: Pre-Order Traversal


       void preorder(node⋆ root,                 std::function<void(node⋆)> visit) {     if (nullptr == root) return;     visit(root);     preorder(root->left, visit);     preorder(root->right, visit);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Traversal are useful in serializing a tree to a list of values, and every specific
    type of traversal produces a deterministic list for a given tree. However suppose
    we have a list containing a traversal of a general binary tree. Even if that list
    contains only two values, we can reconstruct multiple trees from an in-order traversal.
    The reason is that the traversal does not specify which element is the root. In
    the case where the list contains 3 or more values, pre-order and post-order have
    ambiguity. Pre-order traversals are ambiguous as to whether or not the second
    element is a right or left child of the root. Post-order traversals are ambiguous
    as to whether or not the second to last element is a right or left child of the
    root. We conclude that a no single traversal is enough to reconstruct a binary
    tree. This leads us to the next problem.


    #### 3.4.2 Reconstructing a tree from a traversal


    We show how to reconstruct a binary tree given any two distinct recursive traversals.
    The key to solving this problem is recognizing the root from one traversal, and
    then dividing the traversals into left and right sub-trees using the other. In
    the following, we provide an algorithm for tree reconstruction from an in-order
    traversal and a pre-order traversal.


    In a pre-order traversal, the first element is always the root of the next sub-tree.
    The ambiguity is whether the next value is a left or right child of the root.
    In the in-order traversal, given an index in the traversal, all values to the
    left are in the left sub-tree and all values to the right are in the right sub-tree.
    In the solution below, we first extract the root from the pre-order traversal.
    We then find the index of this value in the in-order traversal. If the value does
    not appear at the beginning of the in-order traversal there is a left sub-tree.
    If it does not appear at the end, there is a right sub-tree. In either case we
    extract from each traversal the subsequences corresponding to a sub-tree, and
    recurse.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.20: Reconstruction of a Binary Tree


       node⋆ reconstruct_tree(       const std::vector<int>& inorder,       const std::vector<int>& preorder) {     auto root = new node(preorder[0]);     size_t pos = std::find(inorder.begin(),                            inorder.end(),                            root->value)                  - inorder.begin();     if (0 != pos) {       std::vector<int> left_inorder(         inorder.begin(),         inorder.begin() + pos);       std::vector<int> left_preorder(         preorder.begin() + 1,         preorder.begin() + 1 + left_inorder.size());       root->left = reconstruct_tree(left_inorder,                                     left_preorder);     }     if (pos != (inorder.size()-1)) {       std::vector<int> right_inorder(         inorder.begin() + pos + 1,         inorder.end());       std::vector<int> right_preorder(         preorder.begin()           + (preorder.size() - right_inorder.size()),         preorder.end());       root->right = reconstruct_tree(right_inorder,                                      right_preorder);     }     return root;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Similar algorithms can be rewritten for in-order and post-order, as well as pre-order
    and post-order.


    ## Chapter 4


    Queues and Stacks


    The next data structures we visit are queues and stacks.


    Queues and stacks are ubiquitous in both programming and technical interviews.
    Queues are used to maintain priority while processing requests. Stacks are fundamental
    in program evaluation and parsing. Both are used commonly in graphical search
    and enumeration algorithms.


    In this section, we will look at the definitions of queues and stacks. We construct
    implementations of each from elementary data structures. And finally we look at
    some interesting interview problems that can be solved with queues and stacks.


