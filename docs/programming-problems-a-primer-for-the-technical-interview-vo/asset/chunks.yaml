    \n使用一个将项及其最低未访问幂次配对的优先级队列解决了这个问题。请注意，通过在调用之间保留堆结构，该解决方案可以被转换为一个生成器（generator）。\n\
    \n### 5.4 查找前 k 个元素\n\n最后，让我们考虑确定数据流中前 `k` 个元素的问题。具有流式输入的在线算法通常将问题限制在单次遍历中，因为数据要么是瞬万变的，要么太大到无法装入主内存中。\n\
    \n让我们从回顾查找最大元素的简单情况开始。向量中的最大元素可以通过线性扫描找到。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 5.9：在数组中查找最大值\n\n```cpp\nint max(const std::vector<int>& array) {\n  int\
    \ max_val = array[0];\n  for (auto& element: array) {\n    max_val = std::max(element,\
    \ max_val);\n  }\n  return max_val;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n一点直觉让我们回想起，单元素数组是一个平凡的优先级队列。将此过程泛化为寻找 `n` 个元素流的前 `k` 个元素，可以通过最小顶堆在单次遍历中解决。为了在内存限制内操作，我们将限制优先级队列的大小。\n\
    \n为了在有界大小的堆上进行操作，只有当项的值大于堆中的最小元素时，我们才进行插入。如果是如此，我们通过 `remove_max` 操作移除最小元素，然后插入新值。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 5.10：查找流的前 k 个元素\n\n```cpp\nvoid find_topk(std::istream& in, size_t k, std::vector<int>*\
    \ heap) {\n  heap->reserve(k);\n  int val;\n  while (heap->size() < k && in >>\
    \ val) {\n    heap->push_back(val);\n  }\n  std::make_heap(heap->begin(), heap->end(),\
    \ std::greater<int>());\n  while (!in.eof() && in >> val) {\n    if (val > heap->front())\
    \ {\n      std::pop_heap(heap->begin(), heap->end(), std::greater<int>());\n \
    \     heap->back() = val;\n      std::push_heap(heap->begin(), heap->end(), std::greater<int>());\n\
    \    }\n  }\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n该算法的运行时间是高效的 `O(log k)`，因为每次移除最小元素和插入操作所需的时间与堆的大小成对数关系。这对于在线问题是非常高效的。\n\n##\
    \ 第 6 章 哈希表\n\n哈希表是重要的数据结构，其效率和灵活性使其能够用于几乎任何类型的搜索问题。计算机编程很大程度上在于能够评估问题并设计合适的数据结构来解决它。随着高层语言的普及，更多候选人（应聘者）默认选择哈希表。而且由于其灵活性，哈希表可能导致正确但低效的解决方案。在查找链表中的重复项、统计流中的元素，以及实际上在需要对预生成列表进行搜索的问题中，它们的有效性是相同的。\n\
    \n但哈希表也有缺点。它们不能容易地通过键或值进行枚举。要保证为特定数据集选择了适当的哈希函数需要付出努力，因为搜索空间中的冲突会极大地降低查找性能。此外，将哈希表作为键值映射使用会有大量的内存开销，并且在任何插入时都可能发生动态重新调整。\n\
    \n在本节中，我们将介绍每个应聘者都应该知道的关于哈希表的材料。\n\n### 6.1 哈希函数\n\n哈希函数将大域映射到较小的范围。例如，一个简单的哈希函数将所有字符串映射到\
    \ 0 到 31 之间。哈希表的值是通过对变量计算的。\n\n哈希函数需要一些属性来保证正确性和效率。哈希函数在特殊用途中具有其他属性。冲突是当两个不同的元素具有相同的哈希值时。此外，哈希函数可以容忍不重要的特征，例如大小写，以提供归一化哈希。哈希函数可以是连续的，即键的微小变化会导致哈希值的微小变化。这保证了哈希表中的局部性。一致性哈希在一组范围内提供负载均衡。\n\
    \n哈希函数必须是确定的，即相同的数据结构必须具有相同的哈希值。否则，从哈希表中检索数据是不可能的。\n\n哈希函数应该保证在范围内是均匀分布的。这意味着随机选择的元素具有相同哈值的概率是\
    \ `n⁻¹`（当范围大小为 `n` 时）。\n\n让我们检查为小写单词创建哈希函数的问题。以下是第一次尝试。在这里我们将任何小写字符串映射到其第一个字符的\
    \ ASCII 值。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 6.1：简单哈希函数\n\n```cpp\nsize_t hash(const std::string& str) {\n  if (str.empty())\
    \ return 0;\n  return str[0] - 'a';\n}\n```\n\n该函数是确定的且极其高效，它的范围仅限于 26，许多字符串将映射到相同的值。此外，英语词汇库在这些\
    \ 26 个值上的分布并不均匀。对 Gutenberg 库单词的检查显示，17% 的单词以 `t` 开头，接近 12% 的单词以字母 `a` 开头，而只有\
    \ 0.05% 的单词以 z 开。\n\n为了克服这两个问题，我们增加了哈希值计算的复杂性。\n\n```cpp\nsize_t hash(const std::string&\
    \ str) {\n  size_t hash_value = 0;\n  for (auto c : str) {\n    hash_value +=\
    \ c - 'a';\n  }\n  return hash_value;\n}\n```\n\n列表 6.2：另一种哈希函数\n\n在本节中，我们将介绍哈希表的三个重要特性：哈希函数、冲突解决和动态重新调整。最后以哈希表的应用作为结束。\n\
    \n"
- fmt: "\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nWhile\
    \ this function has a larger range, however it is still small and rather sparse.\
    \ Also it no longer guarantees constant time operation. The hash value of an extremely\
    \ long word takes much more time to compute than the hash value of a short word.\
    \ To overcome these drawbacks, let’s consider taking each four character set of\
    \ characters from the word cast them as an integer. This significantly increases\
    \ the range. We can sum these sets to distribute the words over the range. And\
    \ to guarantee constant time operation we bound the number of characters used.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 6.3: Complex Hash Table\n\n```cpp\nsize_t hash(const std::string& str) {\n \
    \ int count = 16;\n  size_t hash_value = 0;\n  const char* cstr = str.c_str();\n\
    \  while (cstr && *cstr && --count) {\n    hash_value += (*cstr++ - 'a') << (count\
    \ % 4);\n  }\n  return hash_value;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nThis is better because it maintains a constant time evaluation and we are increasing\
    \ the range.\n\nIt is common that complexity increases as we aim to smooth the\
    \ distribution or increase the range. With greater complexity comes longer run\
    \ time, and an unfortunate choice of hash functions can decrease the promise of\
    \ constant time lookup.\n\n### 6.2 Definition\n\nA hash table stores elements\
    \ in an array indexed by their hash value. Each entry in the array is called a\
    \ bucket. Each element is associated with a key that is used to uniquely identify\
    \ the bucket that stores the element. The hash function maps the element’s key\
    \ to the bucket in which to store the element. The goal of hash functions is to\
    \ provide constant time retrieval of stored elements while minimizing insertion\
    \ time.\n\nIn the sequel we will use the `Item` structure for elements of the\
    \ hash table. The key is a string member of an `Item`. Of course in practice,\
    \ such a definition would be more complex.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.4: Definition of Item Structure\n\n```cpp\nstruct Item {\n  std::string\
    \ key;\n  int value;\n};\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nWith that defined, a hash table is simply the combination of a hash function\
    \ and a vector to store `Items`.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.5: Definition of Hashtable\n\n```cpp\nsize_t hash_function(const std::string&);\n\
    typedef std::vector<Item*> Hashtable;\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nNotice that the `hash_function` is defined to take a key type instead of an\
    \ `Item`. This is because we want to use the same hash function for both insertion\
    \ and retrieval. Also, we take the liberty of storing pointers instead of values\
    \ in the hash table. While it is true that `Item` is plain old data and simple\
    \ to copy, hash tables often contain complex data structures for which it is better\
    \ to store references instead of copies. We take this approach in this chapter.\n\
    \n### 6.3 Operations\n\nThe two basic operations of a hash table are insertion\
    \ and retrieval. A third operation often required is dynamic resizing. It is used\
    \ to increase the capacity and decrease the load of a table. By growing the table,\
    \ it is the goal that the chance of collisions is reduced.\n\nHash table implementations\
    \ may also provide access to enumerating the elements of a hash table. This can\
    \ be done by allowing enumeration of the buckets or by providing direct access\
    \ to the underlying array. However there is rarely a guarantee that the elements\
    \ are provided in any sorted order.\n\nBelow we provide implementations of `insert`,\
    \ `find`, and `dynamic_resize` for our simple hash table.\n\n#### 6.3.1 Insertion\n\
    \nThe `insert` operation for a hash table requires calculating hash values and\
    \ addressing collisions if they occur. Collision resolution is discussed in another\
    \ section below. This listing provides an incomplete hash table implementation\
    \ that does not guarantee retrieval of stored elements. Instead we evict older\
    \ entries when collision is detected. Such a scheme is useful in cache implementations,\
    \ but not useful using hash tables for histograms. Note that in order to convert\
    \ the hash value to a valid index, we mod out the hash value by the size of the\
    \ vector.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.6: Insert into a Hashtable\n\n```cpp\nvoid insert(Hashtable* table,\
    \ Item* entry) {\n  auto index = hash_function(entry->key) % table->size();\n\
    \  (*table)[index] = entry;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n#### 6.3.2 Retrieval\n\nImplementing the `find` operation in a hash table depends\
    \ on the hash value of a key and the insertion scheme. As multiple keys can hash\
    \ to the same value, it is important that retrieval determine if an entry agrees\
    \ with the key. For that reason there is an equality check by index.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.7: Find in a Hashtable\n\n```cpp\nItem* find(Hashtable* table, const\
    \ std::string& key) {\n  auto index = hash_function(key) % table->size();\n  if\
    \ (nullptr != (*table)[index] && key == (*table)[index]->key) {\n    return (*table)[index];\n\
    \  }\n  return nullptr;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n#### 6.3.3 Dynamic resizing\n\nCommonly, a hash table exposes a third method\
    \ for dynamic resizing. Dynamic resizing refers to increasing the size of the\
    \ underlying vector while maintaining the key to hash value mapping of the table.\
    \ There are two steps. The first is allocation of a new buffer to store the elements.\
    \ And the second is a rehashing of the elements in the original table to the second.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 6.8: Dynamic Resizing of a Hashtable\n\n```cpp\nvoid resize(Hashtable* table,\
    \ size_t size) {\n  Hashtable new_table(size);\n  for (auto entry : *table) {\n\
    \    if (nullptr != entry) {\n      auto index = hash_function(entry->key) % new_table.size();\n\
    \      new_table[index] = entry;\n    }\n  }\n  table->swap(new_table);\n}\n```\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nDuring\
    \ dynamic resizing, a rehash is necessary. Because of this it is sometimes beneficial\
    \ to update the hash function at the same time. Such an update may be as simple\
    \ as changing an offset for the hash value calculation.\n\nWhile this implementation\
    \ provides a possibly lossy implementation of a hash table, any of the collision\
    \ resolution schemes below guarantee retrieval of all elements inserted into the\
    \ hash table.\n\n### 6.4 Collision resolution\n\nCollision resolution refers to\
    \ a scheme for dealing with collisions in hash table insertion. In the simple\
    \ example above, the hash table was not correct in the sense that subsequent inserts\
    \ in the event of a hash collision could evict objects stored in the hash table.\
    \ Below we will discuss and implement three popular and efficient schemes for\
    \ collision resolution.\n\n#### 6.4.1 Separate chaining\n\nSeparate chaining is\
    \ the most commonly taught method of collision resolution. With separate chaining,\
    \ the buckets of the hash table contain linked lists that hold the keys. This\
    \ provides unlimited capacity for the hash table. However, it comes at the cost\
    \ of increased lookup time as the hash table becomes filled to capacity. In the\
    \ worst case, lookup time can become linear.\n\nTo implement separate chaining\
    \ we modify the definition of a hash table so that the underlying vector contains\
    \ lists of Item pointers.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.9: Definition of Hashtable with Separate Chaining\n\n```cpp\ntypedef\
    \ std::vector<std::list<Item*>> Hashtable;\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n"
  raw: '![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    While this function has a larger range, however it is still small and rather sparse.
    Also it no longer guarantees constant time operation. The hash value of an extremely
    long word takes much more time to compute than the hash value of a short word.
    To overcome these drawbacks, let’s consider taking each four character set of
    characters from the word cast them as an integer. This significantly increases
    the range. We can sum these sets to distribute the words over the range. And to
    guarantee constant time operation we bound the number of characters used.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.3: Complex Hash Table


       size_t hash(const std::string& str) {     int count = 16;     size_t hash_value = 0;     const char⋆ cstr = str.c_str();     while (cstr && ⋆cstr && --count) {       hash_value += (⋆cstr++ - ''a'') << (count % 4);     }     return hash_value;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    This is better because it maintains a constant time evaluation and we are increasing
    the range.


    It is common that complexity increases as we aim to smooth the distribution or
    increase the range. With greater complexity comes longer run time, and an unfortunate
    choice of hash functions can decrease the promise of constant time lookup.


    ### 6.2 Definition


    A hash table stores elements in an array indexed by their hash value. Each entry
    in the array is called a bucket. Each element is associated with a key that is
    used to uniquely identify the bucket that stores the element. The hash function
    maps the element’s key to the bucket in which to store the element. The goal of
    hash functions is to provide constant time retrieval of stored elements while
    minimizing insertion time.


    In the sequel we will use the Item structure for elements of the hash table. The
    key is a string member of an Item. Of course in practice, such a definition would
    be more complex.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.4: Definition of Item Structure


       struct Item {     std::string key;     int value;   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    With that defined, a hash table is simply the combination of a hash function and
    a vector to store Items.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.5: Definition of Hashtable


       size_t hash_function(const std::string&);   typedef std::vector<Item⋆> Hashtable;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Notice that the hash function is defined to take a key type instead of an Item.
    This is because we want to use the same hash function for both insertion and retrieval.
    Also, we take the liberty of storing pointers instead of values in the hash table.
    While it is true that Item is plain old data and simple to copy, hash tables often
    contain complex data structures for which it is better to store references instead
    of copies. We take this approach in this chapter.


    ### 6.3 Operations


    The two basic operations of a hash table are insertion and retrieval. A third
    operation often required is dynamic resizing. It is used to increase the capacity
    and decrease the load of a hash table. By growing the table, it is the goal that
    the chance of collisions is reduced.


    Hash table implementations may also provide access to enumerating the elements
    of a hash table. This can be done by allowing enumeration of the buckets or by
    providing direct access to the underlying array. However there is rarely a guarantee
    that the elements are provided in any sorted order.


    Below we provide implementations of insert, find, and dynamic_resize for our simple
    hash table.


    #### 6.3.1 Insertion


    The insert operation for a hash table requires calculating hash values and addressing
    collisions if they occur. Collision resolution is discussed in another section
    below. This listing provides an incomplete hash table implementation that does
    not guarantee retrieval of stored elements. Instead we evict older entries when
    collision is detected. Such a scheme is useful in cache implementations, but not
    as useful for using hash tables for histograms.


    Note that in order to convert the hash value to a valid index, we mod out the
    hash value by the size of the vector.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.6: Insert into a Hashtable


       void insert(Hashtable⋆ table, Item⋆ entry) {     auto index = hash_function(entry->key)                  % table->size();     (⋆table)[index] = entry;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    #### 6.3.2 Retrieval


    Implementing the find operation in a hash table depends on the hash value of a
    key and the insertion scheme. As multiple keys can hash to the same value, it
    is important that retrieval determine if an entry agrees with the key used in
    retrieval. For that reason there is an equality check after retrieval by index.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.7: Find in a Hashtable


       Item⋆ find(Hashtable⋆ table,              const std::string& key) {     auto index = hash_function(key) % table->size();     if (nullptr != (⋆table)[index]         && key == (⋆table)[index]->key) {       return (⋆table)[index];     }     return nullptr;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    #### 6.3.3 Dynamic resizing


    Commonly, a hash table exposes a third method for dynamic resizing. Dynamic resizing
    refers to increasing the size of the underlying vector while maintaining the key
    to hash value mapping of the table. There are two steps. The first is allocation
    of a new buffer to store the elements. And the second is a rehashing of the elements
    in the original table to the second.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.8: Dynamic Resizing of a Hashtable


       void resize(Hashtable⋆ table, size_t size) {     Hashtable new_table(size);     for (auto entry: ⋆table) {       if (nullptr != entry) {         auto index = hash_function(entry->key)                      % new_table.size();         new_table[index] = entry;       }     }     table->swap(new_table);   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    During dynamic resizing, a rehash is necessary. Because of this it is sometimes
    beneficial to update the hash function at the same time. Such an update may be
    as simple as changing an offset for the hash value calculation.


    While this implementation provides a possibly lossy implementation of a hash table,
    any of the collision resolution schemes below guarantee retrieval of all elements
    inserted into the hash table.


    ### 6.4 Collision resolution


    Collision resolution refers to a scheme for dealing with collisions in hash table
    insertion. In the simple example above, the hash table was not correct in the
    sense that subsequent inserts in the event of a hash collision could evict objects
    stored in the hash table. Below we will discuss and implement three popular and
    efficient schemes for collision resolution.


    #### 6.4.1 Separate chaining


    Separate chaining is the most commonly taught method of collision resolution.
    With separate chaining, the buckets of the hash table contain linked lists that
    hold the keys. This provides unlimited capacity for the hash table. However, it
    comes at the cost of increased lookup time as the hash table becomes filled to
    capacity. In the worst case, lookup time can become linear.


    To implement separate chaining we modify the definition of a hash table so that
    the underlying vector contains lists of Item pointers.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 6.9: Definition of Hashtable with Separate Chaining


       typedef std::vector<std::list<Item⋆>> Hashtable;


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)'
