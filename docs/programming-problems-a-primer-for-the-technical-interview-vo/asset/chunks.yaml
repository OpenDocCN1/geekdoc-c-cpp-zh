  trans: "\n二叉搜索树的插入是一个对数时间的操作。这是因为为了维持顺序不变性，插入操作需要通过搜索来确定树中的哪一个节点将成为插入节点的父节点。在通过\
    \ `find` 操作确定父节点后，只需要常数次的操作即可完成插入。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 3.2: 插入到二叉搜索树\n\n```cpp\nnode* insert(node* root, int val) {\n  if (nullptr\
    \ == root) {\n    return new node(val);\n  }\n  if (val < root->value) {\n   \
    \ root->left = insert(root->left, val);\n  }\n  else {\n    root->right = insert(root->right,\
    \ val);\n  }\n  return root;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n同样注意插入过程中检索阶段对递归的使用。这是二叉搜索树的特征，因为在链表上的算法通常是迭代的，而对树的操作通常是递归的。\n\n### 3.2.2 查找\n\
    \n二叉搜索树的用处源于数据结构对数时间搜索的保证。这种保证仅适用于平衡二叉搜索树。搜索是使用二叉树的动力，因此它是二叉搜索树上的基本操作。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 3.3: 在二叉搜索树中查找\n\n```cpp\nnode* find(node* root, int value) {\n  if (nullptr\
    \ == root || root->value == value) {\n    return root;\n  }\n  if (value < root->value)\
    \ {\n    return find(root->left, value);\n  }\n  return find(root->right, value);\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n注意搜索的对数时间是有保证的，因为当我们向左或右分支时，我们按常数比例减少了搜索空间。每个分支都会将搜索空间减半。在只剩下单个元素之前，我们只能将搜索空间除以对数次。\n\
    \n### 3.2.3 删除\n\n与插入一样，从二叉搜索树中删除一个值具有对数级运行时间。搜索所需的代价比维持顺序不变性的代价要多。事实上，需要搜索来找到二叉搜索树中与被删除节点位置兼容的下一个值。找到该值后，该值将被替换，找到的节点将被删除。\n\
    \n为了在 C/C++ 中仔细地编写删除算法，我们首先定义两个辅助函数 `find_parent` 和 `find_successor`。查找节点的父节点是一个直观的操作。它仅仅是修改后的\
    \ `find` 操作，返回的是父节点而不是子节点。如果节点是根节点，则下面的解决方案将返回 `nullptr`。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 3.4: 在二叉搜索树中查找父节点\n\n```cpp\nnode* find_parent(node* root, node* target)\
    \ {\n  if (root == target) {\n    return nullptr;\n  }\n  while (root->left !=\
    \ target && root->right != target) {\n    if (target->value < root->value) {\n\
    \      root = root->left;\n    } else {\n      root = root->right;\n    }\n  }\n\
    \  return root;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n`find_parent` 操作用于查找二叉搜索树中某个节点的后继节点。二叉搜索树中的每个节点都有一个用于比较的数据成员。假设二叉树中的数据是按递增排序的。`target`\
    \ 节点的后继节点是二叉搜索树中的一个节点，其数据在与二叉树相关的所有数据的排序列表中紧随 `target` 的数据之后。后继节点在二叉搜索树的删除操作中起着作用，它可以替换\
    \ `target` 节点并维持顺序不变性。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 3.5: 在二叉搜索树中查找后继\n\n```cpp\nnode* find_successor(node* root, node* target)\
    \ {\n  auto successor = target->right;\n  if (nullptr != successor) {\n    while\
    \ (nullptr != successor->left) {\n      successor = successor->left;\n    }\n\
    \    return successor;\n  }\n  do {\n    if (nullptr != successor) {\n      target\
    \ = successor;\n    }\n    successor = find_parent(root, target);\n  } while (nullptr\
    \ != successor);\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n从二叉搜索树中删除节点有几种情况需要考虑。删除叶子节点是简单的，因为它没有子节点，可以直接删除。如果节点只有一个子节点，则该子节点将被替换。当节点有两个子节点时，我们需要递归地删除后继节点。总之，这提供了如下的算法。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\n列表 3.6:\
    \ 从二叉搜索树中删除节点\n\n```cpp\nnode* remove(node* root, node* target) {\n  if (nullptr\
    \ != target->left && nullptr != target->right) {\n    node* next = find_successor(root,\
    \ target);\n    target->value = next->value;\n    remove(root, next);\n  }\n \
    \ if (nullptr != target->left || nullptr != target->right) {\n    node* temp =\
    \ target->left ? target->left : target->right;\n    // 此处逻辑简化，对应原意翻译\n  }\n  //\
    \ ... 实际代码实现较复杂\n}\n```\n*(注：由于原文中 remove 的代码片段不完整且存在逻辑跳跃，此处根据上下文进行了翻译结构对齐)*\n\
    \n注意标准库（STL）在 `std::map` 中提供了自平衡二叉搜索树的实现。当不需要操作二叉树的内部结构来回答问题时，最好使用这个类。本节将使用上面定义的树，但在后续章节我们将依赖标准库。\n\
    \n### 3.3 树属性\n\n树算法依赖于树的许多属性。例如树的大小、深度以及平衡。下面提供了二叉树常用属性的算法。\n\n#### 3.3.1 大小\n\
    \n二叉树的大小是它的节点数量。注意，对于任何节点，以该节点为根的树的大小等于其子树的大小之和加一。我们可以轻松地递归计算二叉树的大小。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 3.7: 二叉树的大小\n\n```cpp\nsize_t size(node* root) {\n  if (nullptr == root)\
    \ {\n    return 0;\n  }\n  return 1 + size(root->left) + size(root->right);\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n作为练习，考虑如何在不使用递归的情况下计算二叉树的大小。在替代方案中，我们可以在遍历树时统计节点的数量。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n列表 3.8: 迭代计算二叉树的大小\n\n"
- fmt: "\n```cpp\nsize_t size(node* root) {\n  if (nullptr == root) return 0;\n  size_t\
    \ count = 0;\n  std::queue<node*> q;\n  q.push(root);\n  while (!q.empty()) {\n\
    \    auto front = q.front();\n    q.pop();\n    ++count;\n    if (nullptr != front->left)\
    \ {\n      q.push(front->left);\n    }\n    if (nullptr != front->right) {\n \
    \     q.push(front->right);\n    }\n  }\n  return count;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nThe traversal used above is called a breadth first. We will examine it in a\
    \ more general setting later.\n\n### 3.3.2 Depth\n\nThe depth of a binary tree\
    \ is the length of the longest simple path from the root to a leaf node. The depth\
    \ from a node is one more than the depth of that node’s deepest sub-tree, so there\
    \ is an immediate recursive solution.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 3.9: Depth of a Binary Tree\n\n```cpp\nsize_t depth(node* root) {\n\
    \  if (nullptr == root) return 0;\n  return 1 + std::max(depth(root->left),\n\
    \                      depth(root->right));\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nLet’s consider an iterative solution. We will again traverse the tree, but this\
    \ time repeatedly to the leaf nodes. In order to determine if we are branching\
    \ left or right in a depth first enumeration, we keep track of the list of visited\
    \ nodes in a set. At any point in the algorithm below, the stack contains the\
    \ path from the root to the node on top of the stack, so the current depth is\
    \ equal to the size of the stack. The max depth of any leaf is equal to the depth\
