  trans: "\n\n考虑在一个包含许多不同元素的大列表中查找最常见元素的问题。\n\n为了解决这个问题，我们想要构建一个每个不同元素计数的直方图。为了构建这个直方图，我们需要一个容器来存储条目，该条目是一个元素和一个计数器的组合。元素是该条目的键，计数器是条目的值。\n\
    \n当第一次遇到元素时，我们添加一个计数为 1 的条目。否则，我们增加与该元素相关的计数器。因此，对于列表中的每个元素，我们需要同时支持插入和查找。在二叉树中，每次查找可能需要阶对\
    \ *n* 数量的比较，每次插入也需要阶对 *n* 数量的比较。通过使用高效的哈希表，我们可以将每次查找和插入的时间降低到期望常数时间，并通过线性扫描解决该问题。\n\
    \n在扫描输入后，哈希表存储了列表中每个元素的频率。我们可以在迭代过程中跟踪当前最常见的元素。如果需要 `k` 个最常见的元素，我们可以像上一节一样使用固定大小的最小堆。\n\
    \n接下来的列表提供了一个使用哈希表在字符串列表中查找最常见元素的实现。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.17: 查找最常见元素\n\n```cpp\nstd::string find_most_common_element(std::istream&\
    \ stream, std::unordered_map<std::string, size_t>* hash_table) {\n  std::string\
    \ str;\n  while (!stream.eof() && stream >> str) {\n    (hash_table)[str] += 1;\n\
    \  }\n  std::string max_str;\n  size_t max_count = 0;\n  for (auto& entry : hash_table)\
    \ {\n    if (entry.second > max_count) {\n      max_str = entry.first;\n     \
    \ max_count = entry.second;\n    }\n  }\n  return max_str;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 6.6 实现最近最使用缓存（MRU cache）\n\n缓存是一种用于减少从远程存储检索数据的时间的数据结构。元素的子集存储在本地，检索在查看远程存储之前先查看本地。缓存是有界的，仅存储来自远程存储可用数据的子集。由于这个原因，它们必须实现驱逐策略。最近最使用缓存（MRU\
    \ cache）会驱逐最久未使用的元素。在本小节中，我们解决实现 MRU 缓存的问题。\n\nMRU 缓存必须高效地支持检索和优先级更新。为了实现这种数据类型，我们使用了已经访问过的两个容器的组合。我们使用\
    \ `unordered_map` 实现哈希表进行查找，并使用双向链表来维护优先级。\n\n为了方便在链表中进行查找，用于检索的哈希表存储了链表节点的地址。链表通过节点的顺序存储缓存中每个条目的优先级。链表的头部始终包含最近访问的项，尾部将是最久未访问的项。为了保持正确性，每当元素被使用时，都由调用访问者更新缓存。\n\
    \n我们缓存中使用的结构体出现在下面的定义中。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.18: 最近最使用缓存\n\n```cpp\nstruct MruCache {\n  typedef std::string key_type;\n\
    \  typedef int value_type;\n  typedef std::pair<key_type, value_type> Item;\n\
    \  typedef std::list<const Item*> List;\n  List list;\n  typedef std::unordered_map<key_type,\
    \ List::iterator> Hashtable;\n  Hashtable table;\n  const size_t bound;\n  MruCache(size_t\
    \ bound);\n  void store(const Item* item);\n  const Item* find(const key_type&\
    \ key);\n};\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n如上面定义的，缓存实现了两个方法：`find` 和 `store`。用于检索的哈希表存储了链表节点的地址。链表通过节点的顺序存储缓存中每个条目的优先级。链表的头部始终包含最近访问的项，尾部将是最久未访问的项。为了保持正确性，每当元素被使用时，都由调用访问者更新缓存。\n\
    \n为了方便在链表中进行查找，用于检索的哈希表存储了链表节点的地址。为了在不分配内存的情况下更新优先级，我们将项移动到链表的头部。这是通过 `splice`\
    \ 方法实现的。`find` 方法使用哈希表检索项。![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.19: 缓存中的检索\n\n```cpp\nconst MruCache::Item* MruCache::find(const key_type&\
    \ key) {\n  auto iter = table.find(key);\n  if (iter != table.end()) {\n    list.splice(list.begin(),\
    \ list, iter->second);\n    return *iter->second;\n  }\n  return nullptr;\n}\n\
    ```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n当 `find` 失败时，`store` 方法会更新哈希表。`store` 方法将项插入到头部头部。如果超过了容量，则从哈希表中移除尾部。![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.20: 缓存中的访问\n\n```cpp\nvoid MruCache::store(const Item* item) {\n \
    \ list.push_front(item);\n  table[item->first] = list.begin();\n  if (list.size()\
    \ > bound) {\n    table.erase(list.back()->first);\n    list.pop_back();\n  }\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \n让我们考虑此实现的运行时间。`find` 方法的操作是哈希表查找和移动节点到头部的 `splice`。这些都是常数时间操作。此外，`store` 方法的操作是插入哈希表、插入链表以及可能的移除。这些操作也是常数时间。通过此我们得到了高效的缓存实现。\n\
    \n第 7 章：二分搜索\n\n搜索和排序是计算机编程的基础操作，在接下来的几章中我们将对它们进行详细检查。有三种技术是程序员应该记住的：二分搜索、广度优先搜索和深度优先搜索。二分搜索可以用于任何排序的随机访问数据结构。广度优先搜索和深度优先搜索是用于寻找距离和检测的图算法。在排序之前，我们将查看这些搜索算法的基本实现。\n\
    \n我们从二分搜索开始。\n\n### 7.1 二分搜索\n\n二分搜索是基础性的，应该背诵，因为它经常作为面试或筛选问题出现。它是我们学习的算法之一，并影响了我们在编程中使用的许多数据结构。它也是分支界最早的应用之一，因为更新规则将搜索空间减半。\n\
    \n下面是用于搜索整数数组的二分搜索实现。搜索的结果是指定 `key` 的位置。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa15.gif)\n\
    \nListing 7.1: 二分搜索\n\n```cpp\nsize_t find(const std::vector<int>& array, int\
    \ key) {\n  auto lower = array.begin();\n  auto upper = array.end()-1;\n  while\
    \ (lower < upper) {\n    auto mid = lower + (upper - lower) / 2;\n    if (key\
    \ == *mid) return mid - array.begin();\n    if (key < *mid) upper = mid - 1;\n\
    \    else lower = mid + 1;\n  }\n  return lower - array.begin();\n}\n```\n\n"
- fmt: "\nA few details of this implementation require further discussion. The function\
    \ above returns either the position of the entry or the point at which the algorithm\
    \ was searching when it determined the key is not present. We will see this definition\
    \ is useful in the sequel.\n\nThe use of pointer arithmetic here works since in\
    \ C++ vector arrays are contiguous, and iterators can be considered as their logical\
    \ address. The midpoint is the average of the first address in the array, `lower`\
    \ , and the last address in the array, `array+len-1` added to the first.\n\nSecondly,\
    \ since we know that `key≠ mid` we do not need to have `mid` be considered. So\
    \ we can set `lower` and `upper` one passed `mid` in the appropriate direction.\
    \ Concretely, we can set `upper` to be `mid - 1`, as that is the lowest index\
    \ that we have not evaluated.\n\nLast, the update rule used to find the midpoint\
    \ should always be used in programming interviews. It is the only means to write\
    \ the expression to calculate the midpoint of a without the danger of an operation\
    \ overflow. The more common way to write that line is `mid = lower + (upper +\
    \ lower)∕2`. However, it is possible for `upper + lower` to overflow.\n\nBinary\
    \ search provides order log `n` lookup, and is optimal for comparison search.\
    \ However while the screening interview may ask for a quick implementation, its\
    \ specific application to interview problems is sometimes subtle.\n\n### 7.2 Find\
    \ the first occurrence in a sorted array.\n\nAn interview question that can be\
    \ solved with slight modification to binary search is the problem of finding the\
    \ leftmost occurrence of a target value `n` in a sorted array. Modifying both\
    \ the update rules and the exit criteria of the previous implementation of binary\
    \ search can solve this question.\n\nWhile previous implementation of the binary\
    \ search algorithm provides an incomplete answer, it does provide information\
    \ on the location of the target. We should immediately see that once we find any\
    \ index that matches the target value, we could scan linearly until we find the\
    \ left most element with the target value. While this provides a correct solution,\
    \ the run time of the algorithm is linear.\n\nNote that when an index with the\
    \ target value is found, we can update `upper` to be that index that we discovered.\
    \ Doing so would always keep the target solution in range of our search. So we\
    \ change the line `upper = mid - 1` to `upper = mid`. The update rule for `lower`\
    \ need not change. However, we see that if the lower bound is ever equal to the\
    \ target after an update it must be pointing to the left most entry. Our final\
    \ solution then is a modified binary search.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 7.2: Binary Search To Find Leftmost Target\n\n```cpp\nsize_t find(const\
    \ std::vector<int>& array, int key) {\n    auto lower = array.begin();\n    auto\
