    \n## 2.2.2 查找 (Find)\n\n由于不支持随机访问，支持的遍历方式是逐个考虑每个节点。因此，链表中的搜索是一个线性时间操作。如此，当我们通过键检索链表节点时，我们必须扫描直到找到目标或考虑了所有节点。这通过\
    \ `find` 操作实现。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.4：链表中的查找\n\n```cpp\nnode* find(node* head, int value) {\n  while(nullptr\
    \ != head && head->data != value) {\n    head = head->next;\n  }\n  return head;\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n## 2.2.3 移除 (Removal)\n\n从链表中移除数据需要一个节点引用作为标识符。边界情况是移除头部或尾部，以及从单节点列表中删除节点。移除头部需要特殊处理，因为链表是通过其头部来标识的。如果头部被移除，则需要将指向头的指针返回给调用者。一种简单的方法是将后继节点的数据拷贝到头部。然而，这种技巧需要对单节点列表进行特殊处理。如上所述，我们要求调用者在调用\
    \ `remove` 后更新头部。移除尾部则维护前驱节点。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.5：从链表中移除\n\n```cpp\nnode* remove(node* head, node* target) {\n  if\
    \ (head == target) {\n    head = head->next;\n    delete target;\n    return head;\n\
    \  }\n  auto temp = head;\n  while (nullptr != temp->next && target != temp->next)\
    \ {\n    temp = temp->next;\n  }\n  if (target == temp->next) {\n    temp->next\
    \ = temp->next->next;\n    delete target;\n  }\n  return head;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n注意，由于移除目标是一个参数，我们可以假设它不是 `nullptr` 且链表不为空。由于如此，我们没有验证链表头部是否为 `nullptr`。在后续内容中将遵循这一模式。\n\
    \n## 2.3 循环链表 (Circular linked-lists)\n\n链表的一种常见修改称为循环链表。定义循环链表节点的结构与简单链表中的节点结构相同。然而，更新和移除的规则被修改了，以维持链表的尾部指向头部。\n\
    \n向循环链表插入与标准列表的插入相似，仅在长度为 1 的链表中，头部元素必须引用自身。我们也失去了简单用新分配的指针替换头部的想法，因为尾部指向头部。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n###\
    \ 列表 2.6：向循环链表插入\n\n```cpp\nnode* circular_insert(node* head, int data) {\n  auto\
    \ insertion = new node(data);\n  if (nullptr == head) {\n    insertion->next =\
    \ insertion;\n    return insertion;\n  }\n  if (head == head->next) {\n    head->next\
    \ = insertion;\n    insertion->next = head;\n    return insertion;\n  }\n  std::swap(head->data,\
    \ insertion->data);\n  insertion->next = head->next;\n  head->next = insertion;\n\
    \  return head;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n循环链表中的检索几乎与简单链表中的检索一样。同样，必须遍历整个列表直到找到该值或访问了所有节点。与简单链表不同，搜索的终止不能依赖找到 `nullptr`。相反，我们必须缓存一个指向头部的指针来判断是否已环回。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n###\
    \ 列表 2.7：循环链表中的查找\n\n```cpp\nnode* circular_find(node* head, int value) {\n  auto\
    \ current = head;\n  while(nullptr != current && current->data != value) {\n \
    \   current = current->next;\n    if (current == head) {\n      return nullptr;\n\
    \    }\n  }\n  return current;\n}\n```\n\n从循环链表中移除元素比简单链表中的移除更复杂。与插入一样，这是因为尾部元素指向头部。为了解决这一点，我们需要更新前驱节点的\
    \ `next`。移除操作还需要检查是否存在单个元素的特殊情况。然后我们必须清理整个链表。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.8：从循环链表中移除\n\n```cpp\nnode* circular_remove(node* head, node* target)\
    \ {\n  if (head == head->next) {\n    delete head;\n    return nullptr;\n  }\n\
    \  auto next = target->next;\n  target->data = next->data;\n  target->next = next->next;\n\
    \  delete next;\n  return head;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n## 2.4 双向链表 (Doubly linked-lists)\n\n双向链表是指每个节点都有指向列表中下一个元素以及前一个元素的指针的列表。简单双向链表的头部具有\
    \ `nullptr` 作为前驱成员，尾部具有 `nullptr` 作为后续成员。双向链表也可以是循环的，单元素列表的和尾部指向同一个节点。在后续示例中我们实现循环双向链表。\n\
    \n双向链表的构造函数是对简单链表节点的简单修改，增加了一个 `prev` 成员变量。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.9：双向链表节点\n\n```cpp\nstruct dll_node {\n  dll_node* prev;\n  dll_node*\
    \ next;\n  int data;\n  explicit dll_node(int data) : dll_node(this, this, data)\
    \ {}\n  dll_node(dll_node* prev, dll_node* next, int data) : prev(prev), next(next),\
    \ data(data) {}\n};\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n在循环双向链表中插入和移除整合了标准列表的插入以及循环链表的语义。下面的实现将列表向前推并插入一个新头部。这是通过首先正确设置 `next` 和 `prev`\
    \ 成员，然后在返回之前修正链表结构实现的。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 列表 2.10：向双向链表插入\n\n```cpp\ndll_node* insert(dll_node* head, int data) {\n\
    \  if (nullptr == head) return new dll_node(data);\n  auto insertion = new dll_node(head->prev,\
    \ head, data);\n  insertion->prev->next = insertion;\n  insertion->next->prev\
    \ = insertion;\n  return insertion;\n}\n```\n\n"
- fmt: "\n```cpp\ndll_node* find(dll_node* head, int value) {\n  auto current = head;\n\
    \  while(nullptr != current && current->data != value) {\n    current = current->next;\n\
    \    if (current == head) {\n      return nullptr;\n    }\n  }\n  return current;\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n\
    Removal from a circular doubly linked-list is simpler than that of a simple linked-list.\
    \ This is because each node of doubly linked-list has a pointer to its previous\
    \ element. This makes splicing a node out of a doubly linked-list trivial, where\
    \ in a simple linked-list we needed to remove the next node and swap data values.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n### Listing\
    \ 2.12: Remove from a Doubly Linked-List\n\n```cpp\ndll_node* remove(dll_node*\
    \ head, dll_node* node) {\n  if (head->next == head) {\n    delete node;\n   \
    \ return nullptr;\n  }\n  node->prev->next = node->next;\n  node->next->prev =\
    \ node->prev;\n  if (head == node) {\n    head = node->next;\n  }\n  delete node;\n\
    \  return head;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nNote that the stl provides an implementation of a circular doubly linked-list\
    \ in `std::list`. When manipulating the internal structure of the list is not\
    \ required for answering a question, it is generally better to use this class.\
    \ Throughout this section we will use the list node and `dll_node` definitions\
    \ provided, but in the sequel we rely on the stl.\n\n### 2.5 Selection\n\nSince\
    \ a linked-list is unordered and does not support random access, the question\
    \ of finding the value at interesting positions within the list requires clever\
    \ solutions. These are called selection problems. To being, consider finding the\
    \ middle element of a linked-list. A straightforward method is to count the number\
    \ of elements and then scan for the element at that index.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.13: Find the Midpoint of a Linked-List By Counting\n\n```cpp\n\
    node* mid_by_counting(node* head) {\n  if (!head) {\n    return head;\n  }\n \
    \ auto trailing = head;\n  size_t size = 0;\n  while (nullptr != head) {\n   \
    \ ++size;\n    head = head->next;\n  }\n  size_t mid = size / 2;\n  while (mid--)\
    \ {\n    trailing = trailing->next;\n  }\n  return trailing;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nThis operation obviously requires one and a half full scans of the list. But\
    \ we can do better. Consider what happens when we move two indices through the\
    \ list in tandem. Concretely, we move one index a single node at a time and another\
    \ two nodes at a time. When the first index is at node `x`, the second pointer\
    \ is at position `2*x`. So when the second node reaches the end of the list the\
    \ first pointer is at the midpoint! So indeed, we can do this with a single scan.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n### Listing\
    \ 2.14: Find the Midpoint of Linked-List\n\n```cpp\nnode* mid(node* head) {\n\
    \  auto trailing = head;\n  while (nullptr != head) {\n    head = head->next;\n\
    \    if (head) {\n      head = head->next;\n      trailing = trailing->next;\n\
    \    }\n  }\n  return trailing;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nThis trick can be generalized to find any element at some fraction of the list.\
    \ So for any `k` we can find the element at position `length/k`. But often the\
    \ question is finding the element at the fixed position `k` from the end. We can\
    \ find the node at position `k` from the list by modifying the trick above in\
    \ we move two pointers in tandem, but give one head start.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.15: Find the Node kth from the End\n\n```cpp\nnode* kth_from_end(node*\
    \ head, size_t k) {\n  auto trailing = head;\n  while (k-- && nullptr != head)\
    \ {\n    head = head->next;\n  }\n  while (nullptr != head && nullptr != head->next)\
    \ {\n    head = head->next;\n    trailing = trailing->next;\n  }\n  return trailing;\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n\
    ### 2.6 Modifications\n\nWith selection, lack of random access gives rise to a\
    \ number of problems that ask for modifications of a list. The most basic is the\
    \ removal of all nodes matching a value. The only modification required of the\
    \ `remove` method is to maintain the current scan position in order to continue\
    \ iterating after a node has been removed. Maintaining a `trailing` pointer and\
    \ removing leading nodes that match the value can accomplish this. In this approach,\
    \ care must be taken to remove all nodes that match, else successive matches will\
    \ not be handled correctly. In the implementation, successive matches are handled\
    \ by the inner `while` loop in the listing below.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.16: Remove Values from a Linked-List\n\n```cpp\nnode* remove_values(node*\
    \ head, int value) {\n  while (nullptr != head && head->data == value) {\n   \
    \ auto temp = head;\n    head = head->next;\n    delete temp;\n  }\n  auto target\
    \ = head;\n  while (nullptr != target) {\n    while (nullptr != target->next &&\
    \ target->next->data == value) {\n      node* temp = target->next;\n      target->next\
    \ = target->next->next;\n      delete temp;\n    }\n    target = target->next;\n\
    \  }\n  return head;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nOnly a bit more complex is the issue of reversing the order of the nodes in\
    \ a linked-list. In a linked-list, this can be done without constructing a new\
    \ list by maintaining the current scan position while simultaneously the node\
    \ previously scanned. As the algorithm iterates over the list, it is reversing\
    \ the successor predecessor relationships. After full iteration, the list is reversed.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n### Listing\
    \ 2.17: Reverse a Linked-List\n\n```cpp\nnode* reverse(node* head) {\n  node*\
    \ prev = nullptr;\n  while (nullptr != head) {\n    node* temp = head->next;\n\
    \    head->next = prev;\n    prev = head;\n    head = temp;\n  }\n  return prev;\n\
    }\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n\
    Reversing a circular doubly linked-list can be done with the same technique. However\
    \ as is usual with circular linked-lists we must keep track of the terminal condition.\n\
    \n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n### Listing\
    \ 2.18: Reverse a Doubly Linked-List\n\n```cpp\ndll_node* reverse(dll_node* head)\
    \ {\n  if (nullptr == head) return nullptr;\n  if (head->next == head) return\
    \ head;\n  dll_node* tail = head;\n  do {\n    dll_node* temp = tail->next;\n\
    \    tail->next = tail->prev;\n    tail->prev = temp;\n    tail = temp;\n  } while\
    \ (tail != head);\n  return head->prev;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 2.7 Multiple lists\n\nMany problems requiring working with multiple lists.\n\
    \nAbove, we saw how we can find the midpoint of a list by moving two pointers\
    \ in tandem. Using the same idea we can solve the problem of comparing two lists\
    \ with a single pass over each. Comparison is only difficult in that there is\
    \ no random access. We use multiple pointers, one for each list in question.\n\
    \nWe first check that both lists are either empty or not empty. Afterward, we\
    \ take it in turns to compare each element.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### Listing 2.19: Compare Linked-Lists\n\n```cpp\nbool equals(node* x, node*\
    \ y) {\n  while(x && y) {\n    if (x->data != y->data) return false;\n    x =\
    \ x->next;\n    y = y->next;\n  }\n  if (nullptr == x && nullptr == y) return\
    \ true;\n  return false;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n"
