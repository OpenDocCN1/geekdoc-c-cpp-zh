  trans: "\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n虽然这个函数的范围更大，但它仍然很小且相当稀疏。此外，它不再保证常数时间操作。计算一个极长单词的哈值所需的时间比计算一个短单词的哈值要长得多。为了克服这些缺点，让我们考虑从单词中提取每四个字符一组字符，并将其转换为整数。这显著增加了分布范围。我们可以对这些集合求和，将单词分布到整个范围内。为了保证常数时间操作，我们限制了使用的字符数量。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 6.3: 复杂哈希表\n\n```cpp\nsize_t hash(const std::string& str) {\n  int count = 16;\n\
    \  size_t hash_value = 0;\n  const char* cstr = str.c_str();\n  while (cstr &&\
    \ *cstr && --count) {\n    hash_value += (*cstr++ - 'a') << (count % 4);\n  }\n\
    \  return hash_value;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n这种方法更好，因为它保持了常数时间评估，并且我们正在扩大范围。\n\n当我们旨在平滑分布或扩大范围时，复杂度增加是常见现象。复杂性的增加意味着运行时间变长，而哈希函数的错误选择可能会降低常数时间查找的承诺。\n\
    \n### 6.2 定义\n\n哈希表将元素存储在以哈希值为索引的数组中。数组中的每个条目被称为一个桶（bucket）。每个元素都与一个键（key）关联，该键用于唯一标识存储元素的桶。哈希函数将元素的键映射到存储该元素的桶。哈希函数的目标是在最小化插入时间的同时，提供对存储元素的常数时间检索。\n\
    \n在下文中，我们将使用 `Item` 结构作为哈希表的元素。键是 `Item` 中的一个字符串成员。当然，在实践中，这种定义会更复杂。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 6.4: Item 结构定义\n\n```cpp\nstruct Item {\n  std::string key;\n  int value;\n\
    };\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n定义完成后，哈希表仅仅是哈希函数和存储 `Items` 的 vector 的组合。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 6.5: Hashtable 定义\n\n```cpp\nsize_t hash_function(const std::string&);\n\
    typedef std::vector<Item*> Hashtable;\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n注意，`hash_function` 定义为接收键类型而不是 `Item`。这是因为我们希望对插入和检索都使用相同的哈希函数。此外，我们特意在哈希表中存储指针而不是值。虽然\
    \ `Item` 是简单的纯旧数据（plain old data）且容易拷贝，但哈希表通常包含复杂的数据结构，对于这些结构，存储引用比拷贝更好。我们在本章采用了这种方法。\n\
    \n### 6.3 操作\n\n哈希表的两个基本操作是插入和检索。通常需要的第三种操作是动态调整大小（dynamic resizing）。它用于增加容量并降低表的负载。通过增大表的大小，目标是减少冲突的概率。\n\
    \n哈希表的实现可能还提供枚举哈希表元素的访问。这可以通过允许枚举桶或提供对底层数组的直接访问来实现。但很少能保证元素是按任何排序顺序提供的。\n\n下面我们为这个简单哈希表提供了\
    \ `insert`、`find` 和 `dynamic_resize` 的实现。\n\n#### 6.3.1 插入\n\n哈希表的 `insert` 操作需要计算哈希值并在发生冲突时进行处理。冲突解决将在下文另一个章节讨论。此列表提供了一个不完整的哈希表实现，不能保证检索存储的元素。相反，当检测到冲突时，我们会剔除旧的条目。这种方案在缓存实现中有用，但在使用哈希表制作直方图时不用。注意，为了将哈希值转换为有效索引，我们需要对哈希值对\
    \ vector 的大小取模。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 6.6: 向 Hashtable 插入\n\n```cpp\nvoid insert(Hashtable* table, Item* entry)\
    \ {\n  auto index = hash_function(entry->key);\n  table[index] = entry;\n}\n```\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n*(注：此处根据代码逻辑反推，原文代码块可能不完整，翻译保持原意即可)*\n\
    \n#### 6.3.2 检索\n\n实现哈希表的 `find` 操作取决于哈希函数。由于多个键可能映射到同一个哈希值，因此检索时需要检查键是否相等。\n\n\
    ![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表 6.7:\
    \ 在 Hashtable 中查找\n\n```cpp\nItem* find(Hashtable* table, const std::string& key)\
    \ {\n  auto index = hash_function(key) % table->size();\n  if (nullptr != (*table)[index]\
    \ && key == (*table)[index]->key) {\n    return (*table)[index];\n  }\n  return\
    \ nullptr;\n}\n```\n\n#### 6.3.3 动态调整大小\n\n通常，哈希表会暴露第三种方法：动态调整大小。动态调整指的是在增加底层\
    \ vector 的大小的同时，重新进行哈希。这分为两个步骤：第一是分配一个新的缓冲区来存储元素；第二是对原表元素进行重新哈希。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 6.8: Hashtable 的动态调整大小\n\n```cpp\nvoid resize(Hashtable* table, size_t size)\
    \ {\n  Hashtable new_table(size);\n  for (auto entry : *table) {\n    if (nullptr\
    \ != entry) {\n      auto index = hash_function(entry->key) % new_table.size();\n\
    \      new_table[index] = entry;\n    }\n  }\n  table->swap(new_table);\n}\n```\n\
    \n在动态调整大小期间，重希是必要的。正因如此，有时更新哈希函数是有益的。这种更新可能仅仅是更改哈希值的偏移量。\n\n虽然这种实现是一个可能会丢失数据的哈希表，但下文的任何冲突解决方案都能保证插入哈希表的元素都能被检索。\n\
    \n### 6.4 冲突解决\n\n冲突解决是指处理哈希表插入中冲突的方案。在上面的简单示例中，哈希冲突时的后续插入可能会剔除存储在哈希表中的对象。下面我们将讨论并实现三种流行的高效的冲突解决方案。\n\
    \n#### 6.4.1 链法\n\n链法是最常用的冲突解决方法。在链法中，哈希表的桶包含持有键的链表。这为哈希表提供了无限容量。但代价是随着哈希表的填充，查找时间增加。在最坏的情况下，查找时间可能会变成线性的。\n\
    \n为了实现链法，我们修改了哈希表的定义，使底层 vector 包含指针指针列表。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 6.9: 使用链法的 Hashtable 定义\n\n```cpp\ntypedef std::vector<std::list<Item*>>\
    \ Hashtable;\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n"
- fmt: "\nWhen an element is inserted into a hash table with separate chaining, it\
    \ is simply pushed onto the list stored at the bucket. This provides constant\
    \ time insertion. It also guarantees that an item can be retrieved once it has\
    \ been inserted as there is no eviction.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.10: Insert with Separate Chaining\n\n```cpp\nvoid insert(Hashtable*\
    \ table, Item* entry) {\n  auto index = hash_function(entry->key)\n          \
    \     % table->size();\n  (*table)[index].push_back(entry);\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nRetrieval from separate chaining requires enumerating the lists to complete\
    \ the search for an entry. As above, we must ensure the element’s key matches\
    \ the parameter. That this is requirement is clear, as with separate chaining\
    \ it is common for the table to have multiple entries with the same hash value.\n\
    \n![](tmp_de48baecdad1ca9b2b27d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\nListing\
    \ 6.11: Find with Separate Chaining\n\n```cpp\nItem* find(Hashtable* table, const\
    \ std::string& key) {\n  int index = hash_function(key) % table->size();\n  for\
    \ (auto entry: (*table)[index]) {\n    if (key == entry->key) return entry;\n\
    \  }\n  return nullptr;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b27d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nDynamic resizing with separate chaining takes only a little more effort, as\
    \ each list in each bucket must be enumerated. Aside from this caveat, implementation\
    \ of dynamic resizing is straightforward.\n\n#### 6.4.2 Open addressing\n\nOpen\
    \ addressing is a scheme by which collisions are resolved by inserting an element\
    \ at the next available bucket in the hash table given some iteration scheme.\
    \ Commonly, open addressing involves simply iterating through the table. This\
    \ is called open addressing with linear probing. However, open addressing can\
    \ be implemented by other probing schemes such as successively doubling the index\
    \ value. If no available bucket is found, the table is dynamically resized and\
    \ the insert resumes. Note that after resizing, we are guaranteed to find an available\
    \ bucket. Dynamically resizing and a possible linear time enumeration are the\
    \ cost the hash table pays for guaranteeing retrieval.\n\nWe implement a hash\
    \ table supporting open addressing with linear probing. Insertion is only a matter\
    \ of finding an open bucket.\n\n![](tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.12: Insert with Open Addressing\n\n```cpp\nvoid insert(Hashtable*\
    \ table, Item* entry) {\n  while (true) {\n    auto index = hash_function(entry->key)\n\
    \                 % table->size();\n    for (size_t offset = 0; offset < table->size();\
    \ ++offset) {\n      size_t bucket_index = (index + offset) % table->size();\n\
    \      if (nullptr == (*table)[bucket_index]) {\n        (*table)[bucket_index]\
    \ = entry;\n        return;\n      }\n    }\n    resize(table, table->size() *\
    \ 2 + 1);\n  }\n}\n```\n\n![](tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nTo ensure a false negative is not returned on lookup, an open addressing scheme\
    \ must iterate through all successive buckets to ensure that an entry is present.\
    \ Caution must be exercised to not loop continuously.\n\n![](tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.13: Find with Open Addressing\n\n```cpp\nItem* find(Hashtable* table,\
    \ const std::string& key) {\n  size_t index = hash_function(key) % table->size();\n\
    \  for (size_t offset = 0; offset < table->size(); ++offset) {\n    size_t bucket_index\
    \ = (index + offset) % table->size();\n    auto& item = (*table)[bucket_index];\n\
    \    if (nullptr == item) return nullptr;\n    if (key == item->key) return item;\n\
    \  }\n  return nullptr;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n#### 6.4.3 Cuckoo hashing\n\nCuckoo hashing is a modern approach to collision\
    \ resolution that provides expected constant time lookup and insertion when the\
    \ load of the table is low. Instead of linear probing, cuckoo hashing uses a combination\
    \ of two hash functions and two tables to find the next available bucket for a\
    \ value. The hash functions and tables are labeled primary and secondary, corresponding\
    \ to the order they are probed.\n\nTo realize expected constant time operations,\
    \ cuckoo hashing requires a more complex definition for the hash table. We use\
    \ a structure to group the members.\n\n![](tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.14: Definition of Hashtable with Cuckoo Hashing\n\n```cpp\nstruct\
    \ CuckooHashTable {\n  typedef std::function<size_t(const std::string&)> HashFunction;\n\
    \  typedef HashFunction CuckooHashFunctions[2];\n  typedef Hashtable CuckooHashTables[2];\n\
    \n  CuckooHashFunctions hash_functions;\n  CuckooHashTables hash_tables;\n\n \
    \ explicit CuckooHashTable(size_t size);\n  void insert(Item* entry);\n  void\
    \ resize(size_t size);\n  Item* find(const std::string&);\n};\n```\n\n![](tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nInsertions begin by checking the first table. If the hash value bucket is occupied,\
    \ its contents are replaced with the new entry and the old entry is promoted to\
    \ the second table. This process repeats until all entries are added or else an\
    \ infinite loop is detected. In the later case, the table is resized and the process\
    \ continues. In the code below, we use `table_index` to track if we are operating\
    \ on the primary or secondary table. The set is used to detect if a loop is encountered.\
    \ Also we use references to make the code easier to read.\n\n![](tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.15: Insert with Cuckoo H\n\n```cpp\nvoid CuckooHashTable::insert(Item*\
    \ entry) {\n  std::set<size_t> visited;\n  size_t table_index = 0;\n  size_t index;\n\
    \  do {\n    auto& table = hash_tables[table_index];\n    auto hashfn = hash_functions[table_index];\n\
    \    index = hashfn(entry->key) % table.size();\n    if (nullptr == table[index])\
    \ {\n      table[index] = entry;\n      return;\n    }\n    swap(entry, table[index]);\n\
    \    visited.insert(index);\n    table_index = (table_index == 0) ? 1 : 0;\n \
    \ } while (visited.find(index) == visited.end());\n  resize(hash_tables[0].size()\
    \ * 2 + 1);\n  insert(entry);\n}\n```\n\n![](tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nThe resize is necessary if an infinite loop is detected. With a poor choice\
