  raw: 'The listing above compares two lists, but can easily be generalized to compare
    an arbitrary number simultaneously.


    The other common operation on multiple linked-lists is merging, in which two or
    more lists becomes one. Since linked-lists are dynamically bound, merging two
    linked-lists can be done without the allocation of any new memory. A naive method
    to merge is to append one list to another by iteratively walking one list and
    inserting each node into the other. This method requires as many writes as there
    are elements in the list.


    We can do better. We need only append one list to another, as in the listing below.
    Appending in this manner is a single write operation, although one list must be
    read to the end.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.20: Merge Two Linked-Lists


       node⋆ merge(node⋆ h1, node⋆ h2) {     if (nullptr == h1 || nullptr == h2) {       return h1 ? h1 : h2;     }     auto head = h1;     while (nullptr != h1->next) {       h1 = h1->next;     }     h1->next = h2;     return head;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 2.8 Identification


    The final set of problems for linked-lists involves the identification of list
    properties. Below we consider two problems: determining whether or not a list
    is a palindrome, and determining if it has self-loops.


    A palindrome is a sequence that is the same both forward and backward. Deciding
    if a linked-list is a palindrome is an exercise in combining state information
    and selection. At first glance, one can be perplexed how to efficiently compare
    the first and last nodes, the second and second from last nodes, et cetera until
    the mid point. Let’s first consider this question with a doubly linked-list. In
    this case we have forward and backward enumeration, and a solution is easily found.
    We iterate forward and backward until the two iterators cross.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.21: Identify a Doubly Linked-List as a Palindrome


       bool is_palindrome(dll_node⋆ head) {     if (nullptr == head) return true;     if (head == head->next) return true;     auto tail = head->prev;     do {       if (head->data != tail->data) {         return false;       }       head = head->next;       tail = tail->prev;     } while (head != tail && head != tail->next);     return true;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Returning to a simple linked-list, we found ourselves without a reverse iterator.
    But a single scan with extra memory makes this simpler. We can put the nodes in
    a stack, and then inspect the list back to front. This allows us to iterate in
    reverse as we unroll the stack.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.22: Identify a Linked-List as a Palindrome


       bool is_palindrome(node⋆ head) {     auto temp = head;     std::stack<node⋆> s;     while (nullptr != temp) {       s.push(temp);       temp = temp->next;     }     while (!s.empty()) {       if (head->data != s.top()->data) {         return false;       }       s.pop();       head = head->next;     }     return true;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    The most famous interview question regarding lists is the identification of self-loops
    in a list. On first thought, the idea is simply to collect the node *addresses*
    until we find two that are identical. Often a candidate will jump on the hash
    table solution. The reason is hash tables have constant time access, and collision
    detection is a basic problem in that data type. If any collisions are found, the
    first one is guaranteed to be the head of the loop. However, the question was
    posed as a decision problem and so we are doing too much work. After all this
    solution requires the allocation of new memory at least as large as the number
    of nodes in the list. A better selection is a modification of our solution to
    the selection problem.


    Consider what happens when we try to find the mid point of a circularly linked-list.
    Instead of terminating, eventually the lead pointer will catch up to the tail
    pointer. So if ever the lead and trailing pointers coincide, we know there is
    a loop. But if the lead pointer finds the terminating nullptr, then we know there
    is no loop. We can turn this insight into a solution to the problem of identifying
    self-loops in a linked-list.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 2.23: Find Loops in a Linked-List


       bool detect_loop(node⋆ head) {     if (nullptr == head) {       return false;     }     auto trailing = head;     auto leading = head;     while(nullptr != leading) {       leading = leading->next;       if (trailing == leading) {         return true;       }       trailing = trailing->next;       if (nullptr != leading) {         leading = leading->next;       }     }     return false;   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Consider the efficiency of such a solution. It solves the problem without needing
    to allocate extra memory and with the added cost savings of not having to compute
    a hash value, resolve hash collisions, or dynamically resize a hash table. The
    elegance of this solution is the reason it has been asked as a Microsoft interview
    question for nearly 30 years.


    ## Chapter 3


    Trees


    We continue our review of data-types with a discussion on binary search trees.


    As a data structure, the binary tree overcomes the inefficiencies of retrieval
    in a linked-list. However, the logarithmic running time for retrieval comes at
    the cost of increasing the time for insertion and deletion from constant to logarithmic
    time. Algorithms for binary tree operations are also more complex to write than
    the analogous algorithms for linked-lists. For instance, for operations where
    a linked-list used iteration, the operation on a binary tree may rely upon recursion.
    In this section, we will review the basic operations on binary search trees, and
    begin to solve more complex interview questions.


    ### 3.1 Definition


    A binary tree is composed of tree nodes. Tree nodes consist of a data member variable
    and the address of two other nodes. These other nodes are called children, and
    are distinguished as *left* and *right*.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 3.1: Binary Tree node


       struct node {     int value;     node⋆ left = nullptr;     node⋆ right = nullptr;        explicit node(int value) : value(value) {};   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    As was the case with a linked-list, a binary tree is a referred to by a pointer
    to a designated node. This node is called the *root*. Empty trees are those whose
    root is nullptr.


    A binary search tree is a binary tree that maintains a sort order between the
    parent and children nodes. The order invariant is whenever a node has a left or
    right child, node->value > left->value and node->value <= right->value. A binary
    search tree is balanced when for every node, the depth of the sub-trees from the
    left child and right child differ by at most one. Most of the complexity bounds
    discussed below hold only for balanced binary search trees


    In this section, we will focus our attention on operations and algorithms concerning
    a binary search trees. We further assume that the binary search trees are balanced.
    Finally, as before we assume that the tree operations below are responsible for
    memory management but the caller is responsible for updating the root.


    ### 3.2 Operations


    The basic operations of a binary search tree are insert, find, and remove. In
    the following we will also look at the operations of find-parent and find-successor,
    as we will see that they are necessary precursors for node removal.


    #### 3.2.1 Insertion'
