    \n上面使用的遍历被称为深度优先遍历。我们将在更通用的设置下检查它。\n\n### 3.3.3 平衡\n\n如果对于每个节点，其左右子树之差最多为一，则该二叉树是平衡的。为了确定一个二叉树是否平衡，我们必须评估子树是否平衡。天素地这么做会需要多次计算深度。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 3.11：判断二叉树是否平衡（朴素法）\n\n```cpp\nbool balanced(node* root) {\n  if (nullptr ==\
    \ root) return true;\n  if (!balanced(root->left) || !balanced(root->right)) {\n\
    \    return false;\n  }\n  size_t left_depth = depth(root->left);\n  size_t right_depth\
    \ = depth(root->right);\n  return std::abs<int>(right_depth - left_depth) <= 1;\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n然而，这个解决方案是浪费的。我们反复重新计算深度，在不平衡的树中，这是一个二次级解。线性解将需要修改递归，以返回子树深度的同时也返回其是否平衡。通过重用判断左右子树是否平衡时所做的部分计算，可以获得运行时间的收益。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 3.12：判断二叉树是否平衡\n\n```cpp\nbool balanced(node* root) {\n  if (nullptr == root)\
    \ return true;\n  if (!balanced(root->left) || !balanced(root->right)) {\n   \
    \ return false;\n  }\n  size_t left_depth = depth(root->left);\n  size_t right_depth\
    \ = depth(root->right);\n  return std::abs<int>(right_depth - left_depth) <= 1;\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 3.3.4 祖先\n\n二叉树的祖先是从根节点到节点的路径上的任意简单路径。在二叉搜索树中，祖先的性质是唯一的简单路径。我们需要二叉搜索树中的路径。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 3.13：从根到节点的路径\n\n```cpp\nbool find_path(node* root, node* target, std::vector<node*>\
    \ path) {\n  while (nullptr != root && path.back() != target) {\n    path.push_back(root);\n\
    \    if (target->value < root->value) {\n      root = root->left;\n    } else\
    \ {\n      root = root->right;\n    }\n  }\n  return path.back() == target;\n\
    }\n```\n\n### 3.3.5 共同祖先\n\n二叉树中两个节点的公共祖先是它们到根节点路径的最后一个公共节点。这个节点可以通过我们之前的 `find_path`\
    \ 实现找到。当我们计算了根到每个节点的路径后，可以比较这些路径。\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
