    \    if (nullptr != leading) {\n      leading = leading->next;\n    }\n  }\n \
    \ return false;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nConsider the efficiency of such a solution. It solves the problem without needing\
