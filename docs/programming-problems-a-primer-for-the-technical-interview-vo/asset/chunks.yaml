  raw: 'A queue is an abstract data structure that preserves first-in first-out order
    of its data. The queue data structure has only two basic operations,, enqueue
    and dequeue. Enqueue pushes data to the back of the queue, and dequeue removes
    data from the front of the queue. In an efficient implementation, these operations
    complete in constant time.


    A queue is easily implemented from a doubly linked-list. Enqueue appends an item
    to the tail of a list, and dequeue removes the current head node, replacing it
    with the next node in the list.


    The following is a sample implementation of a queue using the doubly linked-list
    data structure provided by std::list. The enqueue operation is called push, and
    the dequeue operations is called pop. To access the data in the queue, we provide
    a method called front which exposes the value of the node at the front of the
    queue.


    Due to its simplicity, it is clearer to present a queue as a class than a set
    of related methods.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 4.1: Queue Class


       class queue {    public:     void push(int data) {       list.push_back(data);     }     int front() {       return list.front();     }     void pop() {       list.pop_front();     }    private:      std::list<int> list;   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Note that the stl provides a template implementation of a queue as std::queue.


    ### 4.2 Stack


    A stack is an abstract data type that provides last-in first-out access to underlying
    data. Compared with a queue, it provides a kind of reverse access. As with a queue,
    a stack exposes two operations. These are push and pop. Push stores data onto
    the top of a stack, and pop removes data from the top of the stack. These operations
    run in constant time in an efficient implementation.


    A stack is easily implemented from a simple linked-list. The list need not be
    circular or doubly linked as a stack only accesses the head. A push operation
    inserts a node at the head, and a pop operation removes the head.


    The following is a sample implementation of a stack using the linked-list data
    structure provided by std::list. To access the data in the stack, we provide a
    method called top which exposes the value of the node at the top of the stack.


    Due to its simplicity, it is clearer to present a stack as a class than a set
    of related methods.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 4.2: Stack Class


       class stack {    public:     void push(int data) {       list.push_front(data);     }     int top() {       return list.front();     }     void pop() {       list.pop_front();     }    private:     std::list<int> list;   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Note that the stl provides a template implementation of a stack as std::stack.
    We will use this often in the sequel.


    ### 4.3 Implement a queue using a stack


    A common programming question is to implement a queue using a stack. The goal
    is to show equivalence the power of the two elementary data types.


    The key to solving this problem is to understand that stacks and queues are opposite
    in terms of their access, and that there is no mechanism by which a single stack
    alone can implement a queue. The solution is to use two stacks to affect a reverse
    of the data.


    In the solution below we have two stacks called in-stack and out-stack. The in-stack
    allows for enqueue in constant time. Each queue push operation is translated into
    a stack push operation.


    To support first-in first-out, when the dequeue operation is taken we must be
    able to reach to the bottom of the in-stack. To do this, we need only empty the
    in-stack to the out-stack. Notice the element last in starts on top of in-stack,
    and after the transfer it is on the bottom of out-stack. The top of out-stack
    was the first in, so popping this element provides us with a queue. The private
    method transfer consolidates the logic for the data transfer between the two stacks.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 4.3: Implement Queue from a Stack


       class queue {    public:     void push(int data) {       instack_.push(data);     }     int front() const {       transfer();       return outstack_.top();     }     void pop() {       transfer();       return outstack_.pop();     }    private:     void transfer() const {       if (outstack_.empty()) {         while (!instack_.empty()) {           outstack_.push(instack_.top());           instack_.pop();         }       }     }     mutable std::stack<int> instack_;     mutable std::stack<int> outstack_;   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Notice that the out-stack is only updated when it is found to be empty during
    an access or dequeue operation. A commonly made error is to make out-stack a temporary
    variable. After creation and popping it once, the contents are transferred back
    into in-stack. It is obvious that this is wasteful.


    ### 4.4 Implement a stack using a queue


    A follow-up is to reverse the question, and ask a candidate to implement a stack
    using a queue. This question has a number of answers. Similar to above, we provide
    a solution that uses two queues.


    In this solution, we maintain the invariant that the queue that is not empty has
    its elements in reverse order. In that way, a pop operation need only dequeue
    from the non-empty queue.


    For a single element, this is always the case. Now we suppose a second element
    is pushed. Instead of pushing it onto the non-empty queue, add it to a secondary
    and empty queue. This will be the first element removed from the secondary queue.
    We then transfer the first queue to the secondary queue. This leaves us with a
    single non-empty queue, whose elements are in last-in first-out order. This logic
    is the core of the push method below.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 4.4: Implement Stack from a Queue


       class stack {    public:     void push(int data) {       std::queue<int>⋆ enqueue =         queue1_.empty() ? &queue1_ : &queue2_;       std::queue<int>⋆ dequeue =         queue1_.empty() ? &queue2_ : &queue1_;       enqueue->push(data);       while (!dequeue->empty()) {         enqueue->push(dequeue->front());         dequeue->pop();       }     }     int top() const {       if (!queue1_.empty()) return queue1_.front();       return queue2_.front();     }     void pop() {       if (!queue1_.empty()) {         queue1_.pop();         return;       }       queue2_.pop();     }    private:     std::queue<int> queue1_;     std::queue<int> queue2_;   };


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    ### 4.5 Level order traversal


    A classic interview question is to perform a level order traversal of a binary
    tree. That is, given a binary tree, visit the nodes from left to right in order
    of their depth.


    The key to solving this question is to use queue to manage the frontier of exploration.
    We initialize the queue with the root node. This is the first level. Then each
    node is visited in turn and its children are enqueued. Every level is contiguous,
    and levels are visited in turn.


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Listing 4.5: Level Order Traversal


       void level_traversal(node⋆ root,                        std::ostream& out) {     std::queue<const node⋆> queue;     queue.push(root);     while(!queue.empty()) {       const node⋆ node = queue.front();       queue.pop();       if (nullptr != node->left) {         queue.push(node->left);       }       if (nullptr != node->right) {         queue.push(node->right);       }       out << node->value;     }   }


    ![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)


    Another name for this enumeration is breadth-first traversal. And we’ve shown
    that breadth-first on a binary tree is exactly level order.'
