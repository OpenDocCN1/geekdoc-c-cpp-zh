    \ Given the example above, we immediate see that the problem with our candidate\
    \ solution is only the update rules. Since we cannot guarantee that array is increasing\
    \ from `lower` to `mid` and from `mid` to `upper`, we are not updating properly.\
    \ What is needed is to consider the location of the pivot. By enumerating cases,\
    \ we can see that the pivot is either in between `lower` and `mid`, `mid` and\
    \ `upper` or no longer being considered in the sub-array that is being searched.\
