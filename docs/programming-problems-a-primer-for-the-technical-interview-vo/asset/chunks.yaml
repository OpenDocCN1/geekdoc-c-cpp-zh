  trans: "\n\n当一个元素插入到使用链链地址法的哈希表时，它被简单地推入存储在桶（bucket）中的列表中。这提供了常数时间的插入效率。它还保证了项在插入后可以被检索到，因为不存在驱逐策略。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 6.10：链链地址法插入\n\n```cpp\nvoid insert(Hashtable* table, Item* entry) {\n  auto\
    \ index = hash_function(entry->key)\n               % table->size();\n  (*table)[index].push_back(entry);\n\
    }\n```\n\n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n链链地址法的检索需要遍历列表以完成对某个条目的的搜索。如上所述，我们必须确保元素的键与参数匹配。这一需求是显而易见的，因为在链链地址法下，表中常见多个具有相同哈希值的条目。\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n列表\
    \ 6.11：链链地址法查找\n\n```cpp\nItem* find(Hashtable* table, const std::string& key)\
    \ {\n  int index = hash_function(key) % table->size();\n  for (auto entry: (*table)[index])\
    \ {\n    if (key == entry->key) return entry;\n  }\n  return nullptr;\n}\n```\n\
    \n![](img/tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\n链链地址法的动态调整大小只需要稍微多精力，因为每个桶中的每个列表都必须遍历。除了这个注意事项外，动态调整大小的实现非常直接。\n\
    \n#### 6.4.2 开放寻址\n\n开放寻址是一种通过在给定迭代方案的情况下，在哈希表的下一个可用桶中插入元素来解决冲突的方案。通常情况下，开放寻址涉及简单的遍历表。这被称为带有线性探测的开放寻址。然而，开放寻址也可以通过其他探测方案实现，例如连续倍倍索引值。如果没有找到可用的桶，则对表进行动态调整大小并恢复插入。注意，在调整大小后，我们保证能找到一个可用的桶。动态调整大小和可能的线性时间遍历是哈希表为保证检索而付出的代价。\n\
    \n我们实现了一个支持线性探测开放寻址的哈希表。插入只需要找到一个空闲的桶。\n\n![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 6.12：开放寻址插入\n\n```cpp\nvoid insert(Hashtable* table, Item* entry) {\n  while\
    \ (true) {\n    auto index = hash_function(entry->key)\n                 % table->size();\n\
    \    for (size_t offset = 0; offset < table->size(); ++offset) {\n      size_t\
    \ bucket_index = (index + offset) % table->size();\n      if (nullptr == (*table)[bucket_index])\
    \ {\n        (*table)[bucket_index] = entry;\n        return;\n      }\n    }\n\
    \    resize(table, table->size() * 2 + 1);\n  }\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n为了确保查找时不会返回假阴性，开放寻址方案必须遍历所有连续的桶以确保条目存在。必须小心避免无限循环。\n\n![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n列表 6.13：开放寻址查找\n\n```cpp\nItem* find(Hashtable* table, const std::string& key)\
    \ {\n  size_t index = hash_function(key) % table->size();\n  for (size_t offset\
    \ = 0; offset < table->size(); ++offset) {\n    size_t bucket_index = (index +\
    \ offset) % table->size();\n    auto& item = (*table)[bucket_index];\n    if (nullptr\
    \ == item) return nullptr;\n    if (key == item->key) return item;\n  }\n  return\
    \ nullptr;\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n#### 6.4.3 布谷哈希 (Cuckoo hashing)\n\n布谷哈希是一种现代的冲突解决方法，在表负载较低时提供预期的常数时间查找和插入。布谷哈希不是使用线性探测，而是使用两个哈希函数和两个表的组合来寻找值的下一个可用桶。哈希函数和表标记为主表和次表，对应它们探测的顺序。\n\
    \n为了实现预期的常数时间操作，布谷哈希要求哈希表有更复杂的定义。\n\n![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n为了实现预期的常数时间操作，布谷哈希需要更复杂的哈希表定义。![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\
    \ 列表 6.14：哈希表\n\n```cpp\nstruct CuckooHashTable {\n  typedef std::function<size_t(const\
    \ std::string&)> HashFunction;\n  typedef HashFunction CuckooFunctions[2];\n \
    \ typedef Item* CuckooTables[2];\n\n  CuckooFunctions hash_functions;\n  CuckooTables\
    \ hash_tables;\n\n  explicit CuckooHashTable(size_t size);\n  void insert(Item*\
    \ entry);\n  void resize(size_t size);\n  Item* find(const std::string& key);\n\
    };\n```\n\n![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\
    \ 插入从检查第一个表开始。如果哈希桶被占用，则将其内容替换并将旧条目推送到第二个表。这个过程持续到所有条目都添加或检测到无限循环。![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\
    \ 列表 6.15：布谷哈希插入\n\n```cpp\nvoid CuckooHashTable::insert(Item* entry) {\n  std::set<size_t>\
    \ visited;\n  size_t table_index = 0;\n  size_t index;\n  do {\n    auto& table\
    \ = hash_tables[table_index];\n    auto hashfn = hash_functions[table_index];\n\
    \    index = hashfn(entry->key) % table.size();\n    if (nullptr == table[index])\
    \ {\n      table[index] = entry;\n      return;\n    }\n    swap(entry, table[index]);\n\
    \    visited.insert(index);\n    table_index = (table_index == 0) ? 1 : 0;\n \
    \ } while (visited.find(index) == visited.end());\n  resize(hash_tables[0].size()\
    \ * 2 + 1);\n}\n```\n\n![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\
    \ 如果检测到无限循环，则需要调整大小。如果哈希函数选择不当，插入-调整过程也可能循环。为了防止这种情况，建议在调整大小时更新哈希函数。除此之外，调整大小的实现非常直接。在布谷哈希的哈希表中查找必须确定键是在第一个表还是第二个表中。只有当第一个表中的元素等于该值时，才需要后续检查。![](img/tmp_de48baecdad1ca9b2b2d05ec274fdb67_eJ4NNc_html_dffa115.gif)\
    \ 列表 6.16：布谷哈希查找\n\n```cpp\nItem* CuckooHashTable::find(const std::string& key)\
    \ {\n  for (size_t table_index = 0; table_index < 2; ++table_index) {\n    auto&\
    \ table = hash_tables[table_index];\n    auto hashfn = hash_functions[table_index];\n\
    \    index = hashfn(key) % table.size();\n    if (nullptr == table[index]) return\
    \ nullptr;\n    if (key == table[index]->key) {\n      return table[index];\n\
    \    }\n  }\n  return nullptr;\n}\n```\n\n这结束我们对哈希表基础知识的概述。STL 通过 `unordered_map`\
    \ 容器类提供了哈希表的模板化实现。在适当的情况下，我们将在后续中使用该类。\n\n### 6.5 查找流中最常见的元素\n\n"
- fmt: "\nConsider the problem of finding the most common element in large list with\
    \ many distinct elements.\n\nTo solve this problem, we want to build a histogram\
    \ of the count of each distinct element. To construct this histogram we will require\
    \ a container to store an entry that is a tuple of the element and a counter.\
    \ The element is the key of this entry, and the counter is the entry’s value.\n\
    \nWhen elements are first encountered, we add an entry with count 1. Otherwise\
    \ we increment the counter associated with that element. So clearly, for each\
    \ element in the list we need to support both insertion and lookup. In a binary\
    \ tree, each lookup can require order log *n* comparison, and each insert can\
    \ require order log *n* comparisons. An efficient hash table we can reduce each\
    \ lookup and insertion to expected constant time and solve the problem with a\
    \ linear scan.\n\nAfter scanning the input, the hash table has a count of the\
    \ frequency of each element in the list. We can keep track of the current most\
    \ common element during iteration. If the `k` most common elements are desired,\
    \ we can use a bounded size min heap as in the previous section.\n\nThe following\
    \ listing provides an implementation of finding the most common element in a list\
    \ of strings using a hash table.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.17: Find the Most Common Element\n\n```cpp\nstd::string find_most_common_element(std::istream&\
    \ stream, std::unordered_map<std::string, size_t>* hash_table) {\n  std::string\
    \ str;\n  while (!stream.eof() && stream >> str) {\n    (hash_table)[str] += 1;\n\
    \  }\n  std::string max_str;\n  size_t max_count = 0;\n  for (auto& entry : hash_table)\
    \ {\n    if (entry.second > max_count) {\n      max_str = entry.first;\n     \
    \ max_count = entry.second;\n    }\n  }\n  return max_str;\n}\n```\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \n### 6.6 Implement a most recently used cache\n\nA cache is a data structure\
    \ used to reduce retrieval time of data from a remote store. A subset of elements\
    \ is stored locally, and retrieval first looks locally before looking remotely.\
    \ Caches are bounded and store only a subset of the data available from the remote\
    \ store. For this reason they must implement an eviction policy. A most recently\
    \ used cache is one that evicts the least recently used element. In this subsection,\
    \ we solve the problem of implementing a MRU cache.\n\nThe MRU cache must efficiently\
    \ support both retrieval and priority updating. To implement this data type we\
    \ use a combination of two containers we have already visited. We use the `unordered_map`\
    \ implementation of a hash table for lookup, and a doubly linked-list to maintain\
    \ priority.\n\nTo facilitate retrieval in the linked-list, the hash table used\
    \ for retrieval stores the address of the nodes of the linked-list. The linked-list\
    \ stores the priority of each entry in the cache by the order of the nodes. The\
    \ head of the linked-list always contains the most recently accessed item, and\
    \ the tail will be the least recently accessed item. In order to maintain correctness,\
    \ the cache must be updated by the calling accessed whenever an element is used.\n\
    \nThe structures used in our cache are present in the definition below.\n\n![](tmp_de48baecdad1ca9b2b7d05ec274fdb67_eJ4NNc_html_dffa115.gif)\n\
    \nListing 6.18: Most Recently Used Cache\n\n```cpp\nstruct MruCache {\n  typedef\
