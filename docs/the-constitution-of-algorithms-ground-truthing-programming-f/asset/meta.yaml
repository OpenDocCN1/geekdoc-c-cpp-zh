  - III 制定
- - '##'
  - 5 数学作为科学
- - '##'
  - 数学在哪里
- - '###'
  - 但我们到底说的“数学”是什么？我们指的是数学 texts（Rotman 1995, 2006; Sha 2005）吗？我们指的是 famous mathematicians，如莱布尼茨（Antognazza
    2011）、高斯（Tent 2006）或康托（Dauben 1990）吗？我们指的是试图定义数学“是什么”philosoph of mathematics（Aspray
    and Kitcher 1988; Corfield 2006; Hacking 2014）吗？我们头晕眼胀，感到痛苦。但还没有结束！事实上，我们谈论的是
    arithmetic（Husserl 2012）、algebra（Everest 2007）、geometry（Netz 2003; Serres 1995,
    2002）还是 logic（Fisher 2007; Rosental 2003）？也许我们谈论的是从数字到逻辑（Kline 1990a）、从逻辑到几何（Kline
    1990b; Netz 2003）、从几何到代数（Kline 1990c; Netz 2004）的 evolution？甚至在算术、几何、代数或逻辑内部，我们谈论的是
    theorems（Villani 2016）、proofs（Lakatos 1976; MacKenzie 1999, 2004, 2006）还是 conjectures（O’Shea
    2008）？我们并不知道。我们迷失在这些表述让我们只想去做点别的事情的问题中。但我们不能；我们必须找到处理数学的方法，因为这对算法的构建似乎非常重要。我们该如何做到这一点？
