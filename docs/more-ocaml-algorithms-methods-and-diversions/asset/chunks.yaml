    \ write:\n\n    > ![](images/00168.jpg)\n\n    Use an optional argument to express\
    \ this as a single function.\n\nChapter 8\n\nFormatted Printing\n\nOCaml provides\
    \ facilities for what is called formatted printing. Consider the following function,\
    \ culled from Chapter [3](#index_split_009.html_filepos73521):\n\n> ![](images/00174.jpg)\n\
    \nUsing the function `sprintf` (“`f`ormatted `print`ing to a `s`tring”) from the\
    \ Standard Library module Printf we can build this string more easily:\n\n> ![](images/00179.jpg)\n\
    \nIn this example, the format string is `“%s = (%f, %f)”`. The conversion specifications\
    \ `%s` and `%f` denote places for a string and the decimal representation of a\
    \ floating-point number respectively to be substituted into the string. Other\
    \ characters are simply reproduced from the format string to the output string.\
    \ We have avoided the inefficient, repeated use of the `^` operator for string\
    \ concatenation, and our new example is both shorter and easier to read. Here\
    \ is a subset of the many conversion specifications available:\n\n![](images/00184.jpg)\n\
    \nThe `sprintf` function knows how to match up the conversion specification with\
    \ the arguments following the format specification at compile time, so run-time\
    \ errors are avoided:\n\n`        OCaml`\n\n`# Printf.sprintf \"%s = (%f, %f)\"\
