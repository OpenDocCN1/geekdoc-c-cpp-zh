  trans: "\n\n`Same` 情况包含一个 `(length, value)` 元组，而 `Diff` 只是一个字节列表。现在我们可以写一个函数 `get_same`，它接收第一个值、当前计数和列表，并返回一个包含相同字符最终计数的对以及剩余列表的元组：\n\
    \n> ![](img/00230.jpg)\n\n同样地，我们可以定义一个函数将不同的运行序列（run）读取到一个累加器中，并返回该运行序列和剩余列表。该函数仅在\
    \ `get_same` 返回一个长度为 1 的运行序列时才会被调用。\n\n> ![](img/00078.jpg)\n\n现在我们可以写一个函数，同时使用这两个函数来获取单个运行序列，创建我们新数据类型的实例：\n\
    \n> ![](img/00038.jpg)\n\n现在，我们使用定义的规则来构建一个从运行序列生成字节列表的函数：\n\n> ![](img/00143.jpg)\n\
    \n完成所有这些操作后，定义压缩函数本身就简单了，它会积累运行序列，并在处理所有数据后将它们拼接起来。我们必须在结尾添加 EOD 标记。\n\n> ![](img/00239.jpg)\n\
    \n解压缩要简单得多，利用了我们在第 xiii 页的 `Util` 模块中 `take` 和 `drop` 函数。我们读取每个运行序列并将其扩展为字节列表，不断积累直到数据结束。\n\
    \n> ![](img/00047.jpg)\n\n注意一个小技巧——我们使用了 `Array` 模块中的函数来扩展 `Same` 运行序列。\n\n##\
    \ 2\n\n树的分支不携带任何信息（因为没有任何代码可以是另一个代码的前缀）。叶子可以可以携带信息，取决于那里是否有代码。为了避免可选类型（option\
    \ types），我们可以直接分为三种情况：`Lf` 表示空叶子，`Code` 表示满节点，`Br` 表示分支，其中 0 向左，1 向右。\n\n```ocaml\n\
    type tree = Lf | Code of int | Br of tree * tree\n```\n\n现在，我们可以定义一个向现有树添加代码的函数。例如，`add_elt\
