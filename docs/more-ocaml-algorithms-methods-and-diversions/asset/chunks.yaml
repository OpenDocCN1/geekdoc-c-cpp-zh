    > ![](images/00172.jpg)


    If the conditions are not met, we fall back to the old `getval` function. This
    will be faster if we frequently read data aligned-byte-by-aligned-byte, but we
    still need the flexibility of a stream of bits when required.


    2


    We simply replace the int operators with those for Int32.t:


    > ![](images/00015.jpg)


    3


    Our precondition this time is that the number of bits to be written is 8 and the
    `obit` field is set to its initial value, 7\. Then we can use the `output_char`
    function of the underlying output.


    > ![](images/00156.jpg)


    Otherwise, we fall back to the old `putval` function.


    4


    The integer functions are replaced by ones from the Int32 module:


    > ![](images/00296.jpg)


    5


    We add a field `rewind` which will move the position in the output backwards one
    byte, if possible. This is the new type:


    `type output =`


    `     {output_char : char -> unit;`


    `      rewind : unit -> unit;`


    `      out_channel_length : unit -> int}`


    Now we can rewrite, for example, `output_of_string` for this new type:


    > ![](images/00102.jpg)


    We alter `putbit` appropriately:


    > ![](images/00098.jpg)


    6 (Compressing Data)


    1


    We will need to look through the input list of integers (bytes), finding same
    and different runs and building a new list. For clarity, we will produce the output
    runs using a new type, producing the actual bytes later:


    `type run = Same of int * int | Diff of int list`'
