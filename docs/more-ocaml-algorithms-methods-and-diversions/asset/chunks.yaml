  trans: "\n\n与直接生成 PDF 文件相比，使用这种数据结构的优势在于，可以使用模式匹配和其他标准的 OCaml 技术轻松地进行程序化操作。请注意页面本身的内容\
    \ `\"1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET\"` 仍然是一个普通字符串。我们很快将研究这种独立的语言。\n\
    \n在接下来的三个章节中，我们将学习如何将这种表示形式写入文件，并在页面上添加我们自己的文本和图形。\n\n## Questions\n\n1.  通过间接引用（如\
    \ `3 0 R`）画出对象 1, 2, 3, 4 和尾部字典（trailer dictionary）的关系图。\n2.  使用我们的数据类型表示以下 PDF\
    \ 对象：\n    *   `/Name`\n    *   `(Quartz Crystal)`\n    *   `<</Type /ObjStm /N\
    \ 100 /First 807 /Length 1836 /Filter /FlateDecode>>`\n    *   `[1 2 1.5 (black)]`\n\
    \    *   `[1 2 0 R]`\n3.  PDF 文件可以包含任意对象，如果 PDF 阅读器无法理解它们，它们将被忽略。设计一种使用一个或多个 PDF\
    \ 对象表示以下类型的方法：\n    `type tree = Lf | Br of tree * int * tree`\n4.  编写一个类型为 `pdfobject\
    \ → pdfobject` 的函数，给定一个对象，将任何键为 `/Rotate` 的字典项的值替换为 `90`。\n\n## 第 14 章：编写文档\n\n\
    我们已经构建了存储在内存中的 PDF 文档表示，并定义了一个示例文档。现在，我们必须构建将其写入文件的函数。回想上一章节的示例文件：\n\n```pdf\n\
    %PDF-1.1  \n1 0 obj  \n<</Type /Page  \n  /Parent 3 0 R  \n  /Resources  \n  \
    \  <</Font  \n      <</F0  \n          <</Type /Font /Subtype /Type1 /BaseFont\
    \ /Times-Italic>>>>>>  \n      /MediaBox [0 0 595.275590551 841.88976378]  \n\
    \      /Rotate 0 /Contents [4 0 R] >>  \nendobj  \n2 0 obj  \n<</Type /Catalog\
    \ /Pages 3 0 R>>  \nendobj  \n3 0 obj  \n<</Type /Pages /Kids [1 0 R] /Count 1>>\
    \  \nendobj  \n4 0 obj  \n<</Length 53>>  \nstream  \n1 0 0 1 50 770 cm BT /F0\
    \ 36 Tf (Hello, World!) Tj ET  \nendstream  \nendobj  \nxref  \n0 5  \n0000000000\
    \ 65535 f  \n0000000015 00000 n  \n0000000200 00000 n  \n0000000245 00000 n  \n\
    0000000296 00000 n  \ntrailer  \n<</Size 5 /Root 2 0 R>>  \nstartxref  \n397 \
    \ \n%%EOF\n```\n\n我们记得，它由一个头部、然后是一些对象（这里有四个）和一个尾部组成。我们需要四个函数：\n\n1.  `string_of_pdfobject`\
    \ 函数，用于从 `Pdf.pdfobject` 生成字符串，例如从 pdfobject 字典 `Dictionary` `[(\"/Type\", Name\
    \ \"/Pages\"); (\"/Kids\", Array [Indirect 1]); (\"/Count\", Integer 1)]` 生成字符串\
    \ `\"<</Type /Pages /Kids [1 0 R] /Count 1>>\"`。\n2.  `write_header` 函数，用于写入头部（即对象之前的所有内容）；\n\
    3.  `write_trailer` 函数，用于写入尾部（即对象之后的所有内容）；以及\n4.  主函数 `pdf_to_file`，它使用这三个函数将\
    \ `Pdf.t` 写入给定文件名的文件中。\n\n`string_of_pdfobject` 函数最佳的表达方式是使用 `let rec … and …`\
    \ 结构引入的一组互递归函数。将其写成一个单一函数是可能的，但会非常大，因此更难以阅读和编辑。让我们逐部分展示，然后一次性展示。\n\n首先是主体部分。给定一个我们想要生成字符串的对象，假设\
    \ `string_of_array`、`string_of_dictionary` 和 `string_of_stream` 存在：\n\n![](img/00185.jpg)\n\
    \n除了我们留待以后单独实现的那些外，所有情况都非常简单。字符串必须放在括号之间，间接引用打印为 `2 0 R` 等。\n\n要从 `Array` 构建字符串，我们需要从一个左中括号开始，为数组中的每个\
    \ `Pdf.pdfobject` 添加字符串（这些可能是任意复杂的），并在它们之间加上空格。然后用右中括号结束：\n\n![](img/00233.jpg)\n\
    \n使用标准库中的 `Buffer` 模块来收集这些字符串是自然而然的。它也比字符串拼接更高效。注意我们没有在开头添加空格，而是在闭合括号之前添加。`string_of_dictionary`\
    \ 与此类似：\n\n![](img/00237.jpg)\n\n现在是 `string_of_stream`。PDF 中的 stream 如下所示：\n\n\
    ```pdf\nstream\n```\n\n这使用 `Buffer` 模块也是类似的：\n\n![](img/00270.jpg)\n![](img/0060.jpg)\n\
    \n图 14.1：互递归函数从 `Pdf.pdf` 构建字符串。除了我们留待以后单独实现的那些外，所有情况都非常简单。字符串必须放在括号之间，间接引用打印为\
    \ `2 0 R` 等。\n\n要从 `Array` 构建字符串，我们需要从一个左中括号开始，为数组中的每个 `Pdf.pdfobject` 添加字符串（这些可能是任意复杂的），并在它们之间加上空格。然后用右中括号结束：\n\
    \n![](img/00233.jpg)\n\n`string_of_objects` 返回一个列表，按数字对字典 `[(\"/Type\", Name \"\
    /Pages\"); (\"/Kids\", Array [Indirect 1]); (\"/Count\", Integer 1)]` 进行排序，然后输出每个对象：\n\
    \n```pdf\n3 0 obj\n<< /Type /Pages /Kids [1 0 R ] /Count 1 >>\n```\n\n以这种格式写入文件：\n\
    \n```pdf\nxref\n0 5\n0000000000 65535 f\n0000000015 00000 n\n0000000200 00000\
    \ n\n0000000245 00000 n\n0000000296 00000 n\ntrailer\n<< /Size 5 /Root 2 0 R>>\n\
    startxref\n397\n%%EOF\n```\n\n这包含了文件中的字节偏移量（15, 230, 279, 338），尾部字典，等等。不需要详细理解它。这是由\
    \ PDF 阅读器读取的第一部分。\n\n![](img/0085.jpg)\n\n主函数是简单的。我们打开文件，写入头部、对象和尾部，然后关闭文件。发生异常时，我们关闭文件并重新抛出。\n\
    \n![](img/0114.jpg)\n\n这段代码进入 `pdfwrite.ml`。`pdfwrite.ml` 的接口非常简单。我们只暴露 `pdf_to_file`：\n\
    \n![](img/0141.jpg)\n\n这部分包含了我们需要的所有内容：\n\n```pdf\n%PDF-1.1  \n1 0 obj  \n<</Type\
    \ /Page  \n  /Parent 3 0 R  \n  /Resources  \n    <</Font  \n      <</F0  \n \
    \         <</Type /Font /Subtype /Type1 /BaseFont /Times-Italic>>>>>>  \n    \
    \  /MediaBox [0 0 595.275590551 841.88976378]  \n      /Rotate 0 /Contents [4\
    \ 0 R] >>  \nendobj  \n2 0 obj  \n<</Type /Catalog /Pages 3 0 R>>  \nendobj  \n\
    3 0 obj  \n<</Type /Pages /Kids [1 0 R] /Count 1>>  \nendobj  \n4 0 obj  \n<</Length\
    \ 53>>  \nstream  \n1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET  \nendstream\
    \  \nendobj  \nxref  \n0 5  \n0000000000 65535 f  \n0000000015 00000 n  \n0000000200\
    \ 00000 n  \n0000000245 00000 n  \n0000000296 00000 n  \ntrailer  \n<</Size 5\
    \ /Root 2 0 R>>  \nstartxref  \n397  \n%%EOF\n```\n\n这是我们的程序在示例 `Pdf.hello` 上的输出：\n\
    \n```pdf\n%PDF-1.1 \n1 0 obj \n<< /Type /Page /Parent 3 0 R /Resources << /Font\
    \ << /F0 << /Type /Font /Subtype /Type1 /BaseFont /Times-Italic >> >> >> /MediaBox\
    \ [ 0. 0. 595.275590551 841.88976378 ] /Rotate 0 /Contents [ 4 0 R ] >>\nendobj\
    \ \n2 0 obj \n<< /Type /Catalog /Pages 3 0 R >>\nendobj \n3 0 obj \n<< /Type /Pages\
    \ /Kids [1 0 R ] /Count 1 >>\nendobj \n4 0 obj \n<< /Length 53 >>\nstream \n1\
    \ 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET\nendstream \nendobj \nxref\
    \ \n0 5 \n0000000000 65535 f\n0000000015 00000 n\n0000000230 00000 n\n0000000279\
    \ 00000 n\n0000000338 00000 n\ntrailer \n<< /Size 5 /Root 2 0 R>>\nstartxref \n\
    440\n%%EOF\n```\n\n"
- fmt: "\n## 2. Build an example PDF with three pages\nThis will have three entries\
    \ in its `/Kids` array, and three page objects. The page contents may be shared\
    \ by the three pages if desired. You will need to number the additional objects\
    \ carefully.\n\n## 3. Modify the program to use our byte-by-byte compression algorithm\
    \ from Chapter 6 to compress the content stream in the “Hello, World” program.\
    \ You will need to fix the `/Length` and add `/Filter /RunLengthDecode` to the\
    \ stream dictionary. Now modify the program to use our bit-by-bit compression\
    \ algorithm from the same chapter with `/Filter /CCITTFaxDecode`. You will need\
    \ to add the following entry to the stream dictionary, in addition to altering\
    \ the `/Filter` entry:\n\n```\n(\"/DecodeParms\", \n    Pdf.Dictionary\n     \
    \ [(\"/Rows\", Pdf.Integer 1);\n      (\"/Columns\", Pdf.Integer (52 * 8));\n\
    \      (\"/BlackIs1\", Pdf.Boolean true);\n      (\"/EndOfBlock\", Pdf.Boolean\
    \ false)])\n```\n\nThe number 52 is the number of bytes of data in our example.\n\
    \n# Chapter 15: Pretty Pictures\n\nWe have not yet explained the structure of\
    \ the code which put “Hello, World!” on the page. Here it is again:\n\n```\n1\
    \ 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET\n```\n\nIt is a list of operator-operand\
    \ sequences. Each sequence consists of zero or more operands and one operator.\
    \ The sequences in our example are:\n\n![](images/00166.jpg)\n\nIn this chapter\
    \ we will introduce a few simple operators for drawing lines and filling shapes\
    \ (in the next chapter we discuss adding text and build a basic typesetter). Here\
    \ are the operators we will be using to start with:\n\n![](images/00194.jpg)\n\
    \nHere is a data type, which forms part of the new `Pdfpage` module, which encodes\
    \ these operators. We will extend it with new operators when required.\n\n```python\n\
    type t =\n    Move of float * float\n  | Line of float * float\n  | Close\n  |\
    \ Stroke\n  | Fill\n  | FillColour of float\n  | StrokeColour of float\n```\n\n\
    In order to put these into the PDF document, we will need to convert each set\
    \ of operands and operator to a string. This is simple:\n\n![](images/00284.jpg)\n\
    \nNow we can put them together into a single string by using functions from the\
    \ `Buffer` module, putting a space character after each.\n\n![](images/00248.jpg)\n\
    \nHere is a very simple example – we move to (100, 100), make three lines and\
    \ close the path. Then we use the `Fill` operator. Coordinates in PDF have the\
    \ origin at the bottom left of the page.\n\n![](images/00279.jpg)\n\nOur page\
    \ looks like this:\n\n![](images/00007.jpg)\n\nNot all sequences of operators\
    \ are valid, and our data type makes no checks to ensure our list is correct.\
    \ This could be solved by building a higher-level data type which would then be\
    \ flattened down to a list of `Pdfpage.t` elements. In our examples, and in the\
    \ questions at the end of the chapter, it is sufficient to stick to the pattern\
    \ above – one `Move`, one or more `Line`s, a `Close` (if filling), and a `Fill`\
    \ or `Stroke`.\n\nAs an example, we will build a function to make a single line,\
    \ and use it to build a function which, given the page dimensions, draws a page\
    \ of graph paper. First, a function to build a single line from (x,y) to (x1,y1):\n\
    \n![](images/00035.jpg)\n\nNow, a function to return a set of equally spaced floating-point\
    \ values from 0…n given a step:\n\n![](images/00067.jpg)\n\nNote that we have\
    \ been careful to avoid repeated addition of floating-point values – this can\
    \ accumulate errors. We can build all the lines:\n\n![](images/00080.jpg)\n\n\
    Here is the result of `graph_string 595.28 841.89 10.` on a page of A4 paper:\n\
    \n![](images/00072.jpg)\n\n## Questions\n\n1. Write a function which, given a\
    \ centre point and radius, returns a list of `Move`, `Line`, and `Close` elements\
    \ which represent a circle. Use a number of lines appropriate to the size of the\
    \ circle.\n2. Use the function from the previous question to write a program which\
    \ outputs a page covered in pseudo-random sized and filled grey circles.\n3. The\
    \ sequences `red green blue` `rg` and `red green blue` `RG` are the colour analogues\
    \ to the sequences `grey` `g` and `grey` `G`. Add them to our data type, and redo\
    \ the circles program to use colour.\n4. The sequence `width` `w` sets the line\
    \ width. Add this to our data type and use it to draw a single large unfilled\
    \ circle over the centre of the page.\n5. The operator `W` in place of a stroke\
    \ or paint operator is used to set up a clipping path. Add this to our data type.\
    \ Turn your big circle into a clipping path for the random circles pattern, so\
    \ you now have circles within a circle.\n\n# Chapter 16: Adding Text\n\nIn this\
    \ chapter, we will develop a very simple typesetter. Given a string representing\
    \ the page content, it will split it into words, break them across lines and place\
    \ them on the page. In the questions at the end of the chapter, the typesetter\
    \ will be extended to use full justification, to indent paragraphs, and to produce\
    \ multi-page documents.\n\nTo begin with, some of our numbers (lines per page,\
    \ margins etc.) will be hard coded – we will then factor them out as we generalize\
    \ the code. But let us define names for the page width and height for an A4 page\
    \ first, to prevent excessive duplication:\n\n![](images/149.jpg)\n\nWe first\
    \ need to split our text into words. For our purposes, a word is anything separated\
    \ from another by one or more spaces. To preserve the paragraph breaks, the line\
    \ character `\\n` will be considered a word. So, for example, the string `\"stopped.\\\
    n Around, he saw he\"` would be split into the list `[\"stopped.\", \"\\n\", \"\
    Around,\", \"he\", \"saw\", \"he\", \"in\"]`.\n\nThe function `consume_spaces`,\
    \ given an `input`, places the `input` at the first non-space character after\
    \ its position. If the end of the `input` is reached, exception is raised.\n\n\
    ![](images/176.jpg)\n\nNow we can write a function to read a word. First, we consume\
    \ any spaces. Then, we repeatedly read characters into a buffer until a space\
    \ occurs, or we reach the end of the `input`. If a space occurs, we have finished\
    \ the word. If we reach the end of the `input`, we return the buffer so far.\n\
    \n![](images/202.jpg)\n\nNow it is simple to collect all words in an `input` by\
    \ repeatedly calling `read_word`, and accumulating the result in a list.\n\n![](images/32.jpg)\n\
    \nWe shall consider the opening of Kafka’s “Metamorphosis”:\n\nOne morning, when\
    \ Gregor Samsa woke from troubled dreams, he found himself in his bed a horrible\
    \ vermin. He lay on his armour-like back, and if he lifted his head a little he\
    \ could see his belly, slightly domed and divided into stiff sections. The bedding\
    \ was hardly to cover it and seemed to slide off any moment. His many legs, pitifully\
    \ thin compared with the size of him, waved about helplessly as he looked. What\
    \ happened to me? It wasn't a dream. His room, a proper human room although a\
    \ little too small, lay peacefully between its familiar walls. A collection of\
    \ textile samples lay out on the table - Samsa was a travelling salesman - and\
