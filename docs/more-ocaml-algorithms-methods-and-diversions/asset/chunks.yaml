  trans: "\n\n# 4. 变式算法的排序阶段可以替换为简单的列表反转，因为项在每次交换后已经按反字典序排序了。请实现它。\n\n# 5. 命令式算法可以以函数式的方式通过列表来定义。请演示这一点。\n\
    \n# 第 11 章 集合\n\n在本章中，我们将介绍用于存储集合的各种简单和复杂的数据结构。我们将研究它们的理论性能特征，并在各种类型的数据上对它们进行对比计时测试，以了解它们在实际应用中的性能。在此过程中，我们将学习\
    \ OCaml 中一些高级的模块化抽象机制。对于每种集合表示，我们将提供以下五个函数：\n\n* `set_of_list`：从列表（可能包含重复项）构建集合。通过\
    \ `set_of_list []` 构建空集合；\n* `list_of_set`：返回一个包含集合中元素的列表，顺序不固定；\n* `insert`：如果给定的元素不在集合中，则将其插入集合；\n\
    * `size`：返回集合中元素的数量；以及\n* `member`：测试元素是否存在于集合中。\n\n## 简单列表\n\n图 11.1 使用内置列表类型表示集合，展示了这五个函数。它们大部分是非常简单易见的，`set_of_list`\
    \ 除外，它通过向现有集合重复插入来工作。\n\n> ![](img/00200.jpg)\n> 图 11.1:\n\n这些函数的效率并不高。`member`、`size`\
    \ 和 `insert` 函数所需的时间与集合的大小成正比。`set_of_list` 函数更糟：它所需的时间与集合大小的平方成正比，因为它对增长列表中的每个元素都使用了\
    \ `insert`。唯一的亮点是 `list_of_set`，它（当然）以常数时间运行。\n\n我们没有隐藏集合的类型——调用者可以像普通列表一样操作它们——因此这种抽象既安全也不完整。以下是一个\
    \ `.mli` 文件的接口，它将集合的实际类型抽象为简单的 `α t`。\n\n> ![](img/00222.jpg)\n\n这里是带有实现的相应 `.ml`\
    \ 文件：\n\n> ![](img/00253.jpg)\n\n记住，通过在接口后隐藏实现，我们可以随心所欲地切换实现，使其高效或修复错误。\n\n由于我们希望构建多个此类集合实现并对它们进行基准测试，现在是查看\
    \ OCaml 将多个模块放在单个源文件中的语法了。图 11.2 展示了一段 OCaml 代码，将我们的 `.ml` 和 `.mli` 文件全部放在一起：\n\
    \n> ![](img/00283.jpg)\n> 图 11.2:\n\n通用的语法形式是：\n\n```\nmodule module name :\n\
    \  sig\n    contents of .mli file\n  end\n=\n  struct\n    contents of .ml file\n\
    \  end\n```\n\n当这段代码粘贴到顶层或通过其他方式加载时，就可以可以使用新模块 `SetList`，并且可以通过给定的接口使用 `SetList.size`\
    \ 等函数。\n\n由于我们所有不同的集合实现将共享 `SetList` 相同的接口，我们将使用 `module type` 语法将此模块定义拆分以定义签名，并使用\
    \ `include` 关键字为我们的模块使用该签名：\n\n> ![](img/00012.jpg)\n\n因此，我们避免了接口的重复。每个新的集合表示只需要一个实现。\n\
    \n## 性能\n\n集合数据类型的每次使用情况都不同——有时有一个初始插入阶段，随后是数百万次没有插入的成员测试。有时插入和成员测试的概率相等。某些函数可能完全不需要。我们将考虑两种插入的基准测试：\n\
    \n* 按随机顺序插入整数 1…50000；以及\n* 按顺序插入 50000 个整数 1…50000。\n\n然后，对于这些“有序”和“无序”情况中的每一种，我们将：\n\
    \n* 在 1…100000 的数字范围内执行 50000 次成员测试，使得其中一半存在，另一半不存在；\n* 计算集合中的元素数量；\n* 计算集合的大小。\n\
    \n![](img/00042.jpg)\n\n正如预期的，巨大的区别在于成员测试的时间，这是由于树的平衡或缺乏平衡导致的。当我们引入更多存储集合的方法时，我们将进行相同的测试并比较结果。\n\
    \n## 二叉搜索树\n\n二叉搜索树是一种二叉树，其属性是：每个节点的左子树的所有元素都比它小，右子树的所有元素都比它大。如果树平衡得良好，我们可以在与集合元素数量对数成正比的时间内到达任何元素。\n\
    \n就像集合表示一样，集合有多种表示，取决于元素的插入顺序。以下是与插入顺序对应的树：\n\n![](img/00070.jpg)\n\n我们可以看到，当按数字顺序添加项时，这种数据结构并不比简单列表好。（等一下，修正文本流）这两条规则共同确保了树是合理平衡的——从根到叶的最长路径（黑、红、黑……黑）不超过最短路径（黑、黑、黑……黑）的两倍。因此，红黑树的最大深度与集合元素数量的对数成正比。\n\
    \n```\ntype 'a t = Lf | Br of 'a t * 'a * 'a t\n```\n\n`SetTree` 模块见 11.3。\n\n\
    > ![](img/0241.jpg)\n> 图 11.3:\n\n当树平衡平衡时，`insert` 和 `member` 以对数时间运行。`size` 函数以线性时间运行，因为它必须访问每个节点。`list_of_set`\
    \ 也是如此。当平衡时，`insert` 和 `member` 需要线性时间。\n\n![](img/00048.jpg)\n\n注意，在无序情况下，插入和成员测试的性能极大提升，大约提高了两倍。然而，如果按顺序插入元素，不平衡树的构建时间实际上比相应的列表长。\n\
    \n## 平衡树\n\n我们已经看到二叉搜索树只有在平衡的情况下才有用。在过去的几十年里，开发了多种数据结构试图保持二叉树“合理平衡”，以便操作保持高效。“红黑树”就是这样一种常用且有趣的数据结构。红黑树由\
    \ Rudolf Bayer 发明，这里介绍的函数式公式源于 Chris Okasaki 的里程碑著作《Purely Functional Data Structures》（Cambridge\
    \ University Press,1998）。\n\n红黑树是普通的二叉树，增加了一个属性：每个节点是红色或黑色。叶子节点被认为是黑色。平衡通过每个修改树的操作（在我们的用例中是\
    \ `insert`）来确保保持以下属性仍然：\n\n* 每个红色节点的子节点都是黑色的；以及\n* 从根到叶子的条路径包含相同数量的黑色节点。\n\n![](img/0182.jpg)\n\
    \n`list_of_set`、`size` 和 `member` 函数很容易修改：它们只需忽略颜色字段。然而，`insert` 函数必须修改以维护红黑树属性。\n\
    \n```\ntype colour = R | B\ntype 'a t = Lf | Br of colour * 'a t * 'a * 'a t\n\
    ```\n\n"
- fmt: "\nAs with ordinary binary search trees, the new node added by `insert` will\
    \ be in place of a leaf node. We colour it Red, to make sure that the invariant\
    \ that no path can have a differing number of black nodes in it is not broken.\
    \ However, this may break the other invariant (that no Red node has a Red parent).\
    \ It turns out that, by considering the parent and grandparent of the newly-inserted\
    \ node, performing a simple operation, and possibly continuing this process upward,\
    \ we can restore this invariant, and efficiently. The following diagrams, à la\
    \ Okasaki, illustrate the process:\n\n![](images/00022.jpg)\n\nIn each case, the\
    \ nodes `x`, `y`, `z` and the sub-trees `α`, `β`, `γ`, `δ` remain in the same\
    \ order, so the binary tree invariant is preserved. Pattern matching is particularly\
    \ elegant here, since all but one of our cases have the same result:\n\n> ![](images/00163.jpg)\n\
    \nNow, we can write the insertion function itself:\n\n> ![](images/00004.jpg)\n\
    \nNote that we wrap it in a function to set the root of the tree to Black – balancing\
    \ will not do this, since the root has no parent or grandparent to compare with,\
    \ and so we may otherwise end up with a red root with a red child. The full module\
    \ is shown in Figure [11.4](#index_split_017.html_filepos229499).\n\n* * *\n\n\
    > ![](images/00269.jpg)\n\n> Figure 11.4:\n\n* * *\n\nSince we have guaranteed\
    \ that the tree will be reasonably balanced, there is no need for tail recursive\
    \ functions, even for huge sets. The effect of balanced trees on performance is\
    \ clear, and there appears to be little or no slow-down from the more complex\
    \ Red-Black data structure:\n\n![](images/00285.jpg)\n\n Hash Tables\n\nA hash\
    \ table is a data structure designed to provide very fast insertion of and access\
    \ to data in sets and maps. It holds a set of buckets `0...n`. When we insert\
    \ a value into the set, it is processed via a hash function which allocates it\
    \ to a bucket, in such a manner that there should be a roughly uniform distribution\
    \ of values among the buckets. When we need to test membership for an item, the\
    \ same hash function is applied, and we need only search in one bucket. If the\
    \ hash function works well and the number of buckets is appropriate, lookup is\
    \ in constant time regardless of how many items are in the set.\n\nFor example,\
    \ if the hash function is `x-→x mod 23` and the data to be inserted is `34, 2,\
    \ 67, 3, 4, 84, 1467, 7432, 48, 1` then the buckets would be `11, 2, 21, 3, 4,\
    \ 15, 18, 3, 1, 1`. The membership test for `67` now consists of applying the\
    \ hash function, and then searching in bucket `21` to see if `67` is there.\n\n\
    The OCaml Standard Library provides a hash table implementation in the module\
    \ `Hashtbl`. To build a hash table for a set, we use a hash table which maps from\
    \ `α` to `unit`, of type `(α, unit) Hashtbl.t`. It is simple to build an implementation\
    \ matching our signature, using the functions `Hashtbl.mem`, `Hashtbl.add`, `Hashtbl.create`,\
    \ and `Hashtbl.iter`, as shown in Figure [11.5](#index_split_017.html_filepos233285).\n\
    \n* * *\n\n> ![](images/00175.jpg)\n\n> Figure 11.5:\n\n* * *\n\nThe disadvantage\
    \ is that hash tables are mutable data structures, and so operations like `insert`\
    \ mutate the structure. The result of `insert`, then, alters the set rather than\
    \ creating a new set. This means that whilst the `SetType` interface is technically\
    \ satisfied, our intended abstraction is actually broken. Such is mutability.\
    \ The performance on our benchmarks, however, is clear:\n\n![](images/00265.jpg)\n\
    \nThe benchmarking programs may be found in the online resources.\n\n ### Questions\n\
    \n1. Compare our set representations with regard to the amount of memory required\
    \ to create and store them. You can use the functions from the `Gc` module in\
    \ OCaml’s Standard Library to find out how many words of memory have been allocated\
    \ before and after allocating a large set in each set representation.\n\n2. Write\
    \ functions (naive if necessary) to perform the “union” operation on sets in each\
    \ representation. The union of two sets is the set of elements present in one\
    \ or the other or both of them. After the operation, both inputs should still\
    \ be available as sets.\n\n3. OCaml has a built-in `Set` module. It uses advanced\
    \ module syntax not discussed here, but you can build a module for manipulating\
    \ sets of integers like this:\n\n```\nmodule S = Set.Make (struct type t = int\
    \ let compare = compare end)\n```\n\nThis new module `S` provides, amongst others,\
    \ a type `t` for sets, and `add`, `elements`, `mem`, `empty`, and `cardinal` functions,\
    \ whose definitions you can find in the OCaml manual. Use these functions to build\
    \ a set module with a similar interface to ours. Comment on its speed for our\
    \ examples.\n\n4. We can save memory in the definition of Red-Black trees by having\
    \ two different `Br` nodes, one for Red and one for Black, instead of storing\
    \ the colour. Implement this. How much memory is saved? How much extra complexity\
    \ is there in the source code?\n\n # Chapter 12\n\n ### Playing Games\n\nThe childhood\
    \ game of Noughts and Crosses is a combinatorial problem of a large but manageable\
    \ size. Let us review the rules, and then see if we can build the game tree (that\
    \ is, a structure describing all possible games), and draw some statistics from\
    \ it.\n\nA 3-by-3 grid is constructed. Two players (O and X) take turns, beginning\
    \ with O, to place their piece in an empty space. The game is won if or when a\
    \ player forms three pieces in a row, column, or diagonally. The game is drawn\
    \ if the board is full and no such pattern has been formed. For example, in this\
    \ board, player O has won, building a diagonal:\n\n![](images/00112.jpg)\n\nLet\
    \ us consider the shape of the game tree. Clearly, at the top level, it will branch\
    \ nine ways, since O can be placed in any square. Then eight ways, seven ways\
    \ and so on. Once we reach the fifth level, some of the games have been won (since\
    \ three pieces from player O may form a line), and so the number of branches may\
    \ be reduced. The tree must end after nine levels, since the board must be full,\
    \ even if noone has won. A fragment of the game tree is shown in Figure 12.1.\
    \ Let us begin to construct the program. We will need a type to represent X, O\
    \ and the empty square:\n\n* * *\n\n![](images/00246.jpg)\n\n> Figure 12.1:\n\n\
    * * *\n\n```\ntype turn = O | X | E\n```\n\nIt would be natural to use a nine-tuple,\
    \ since the board is of a fixed size. Then, though, we lose the ability to use\
    \ the standard list-processing functions such as `List.map` over the boards. So,\
    \ at the cost of a little inelegance, we will use a list of length nine – in other\
    \ words a `turn list`.\n\nWe need to terminate the tree when X has won, O has\
    \ won, or the board is full. Thus we will need to check all the rows, columns,\
    \ and diagonals. We do not want to replicate the logic several times or build\
    \ a huge pattern match, so it is easiest to write a function which takes a list\
    \ of nine booleans and just checks for lines of `true`. We can then use `List.map`\
    \ on the board itself to build these intermediate lists of booleans.\n\n> ![](images/00093.jpg)\n\
    \nWe can number the positions in our board:\n\n![](images/00225.jpg)\n\nNow, we\
    \ can use functions from the List module to write a function to return the numbers\
    \ of the positions which are currently empty:\n\n> ![](images/00073.jpg)\n\nThis\
    \ works by building the list of tuples `[(X, 1); (E, 2); (E, 3)` …`(O, 9)]`, filtering\
    \ out any which are not empty, and extracting the list of empty positions `[2,\
    \ 3` ...]`. It is also simple to write a function which, given a board like `[E;\
    \ E; E; E; X; E; O; E; E]`, a turn like `O` and a number such as 8, will fill\
    \ in the correct slot in the board to produce `[E; E; E; E; X; E; O; X; E]`. The\
    \ `take` and `drop` functions from our Util module (described on page xiii) are\
    \ ideal:\n\n> ![](images/00210.jpg)\n\nOne more simple function is required before\
    \ we can write the main tree-building function, and that is to change whose turn\
    \ it is:\n\n> ![](images/00053.jpg)\n"
