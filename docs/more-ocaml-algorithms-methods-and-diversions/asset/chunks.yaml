- fmt: "\nWhat should the type of the game tree be? Each node needs a list of turn\
    \ elements representing the board, and a list of zero or more trees representing\
    \ the game resulting from each possible move. Since the list can have zero elements,\
    \ we need no separate leaf constructor:\n\n```\ntype tree = Move of turn list\
    \ * tree list\n```\n\nNow we may construct the main function. Our job is to build,\
    \ given a turn (X or O) and the current board, the tree starting at that board.\
    \ If the board has been won by either player, the list of next nodes is empty,\
    \ and the recursion stops. If not, we calculate the empty positions, build a new\
    \ board with each empty position filled in with the current turn, and then map\
    \ `next_moves` over each of those.\n\n> ![](images/00192.jpg)\n\nNote that the\
    \ recursion stops when a board is full (drawn) because `empty` returns the empty\
    \ list in this case. Now we can build the game tree itself, which might take a\
    \ second or so:\n\n> ![](images/00017.jpg)\n\nThis results in the tree shown below.\n\
    \n> ![](images/00045.jpg)\n\nYou can see the first ending position in this game\
    \ tree is `[O; X; O; X; O; X; O; E; E]`. You can also see several drawn games.\
    \ We can now use this game tree to calculate how many games are won by a given\
    \ player:\n\n> ![](images/00076.jpg)\n\nThis tells us, reasonably quickly, that\
    \ O wins 131184 games. The questions at the end of this chapter ask you to work\
    \ out more of these numbers. Here is the full code in one place:\n\n> ![](images/00105.jpg)\n\
    \nIn the questions, you will extract the rest of the statistics from the tree,\
    \ and build some alternative representations.\n\n### Questions\n\n1. In how many\
    \ cases does X win? How many possible different games are there? How many end\
    \ in a draw?\n2. Build a lazy version of our game tree, where nodes are only created\
    \ when explored. Now write a function to work out how many times O and X win or\
    \ the game is drawn if O goes first and picks the centre slot. What about if O\
    \ picks a corner? The middle of a side?\n3. Another way to check if someone has\
    \ won is to rearrange the board numbers into a so-called magic square, where each\
    \ row, column or diagonal sums to 15:\n\n   ![](images/00133.jpg)\n\n   Now, a\
    \ player has won if they have any three positions summing to 15. Re-implement\
    \ our game tree program using this alternative representation.\n\n> GENERATING\
    \ PDF DOCUMENTS\n> an extended example\n\n# Chapter 13: Representing Documents\n\
    \nIn this chapter we will define a data type for representing a PDF document.\
    \ PDF is a structured format for describing a wide variety of graphical and textual\
    \ data. The PDF file format itself is large and complex, but we will introduce\
    \ only the parts required for our examples. It is relatively easy to write PDF\
    \ files but rather harder to read them, so we will concentrate on creating PDF\
    \ data structures in memory, and then writing them to valid files. Here is an\
    \ example PDF, as it might be displayed in a PDF viewer:\n\n![](images/00158.jpg)\n\
    \nHere is the corresponding code, which you would see if you opened the PDF file\
    \ in a plain text editor:\n\n```\n%PDF-1.1  \n1 0 obj  \n<</Type /Page  \n  /Parent\
    \ 3 0 R  \n  /Resources  \n    <<</Font  \n      <<</F0  \n          <<</Type\
    \ /Font /Subtype /Type1 /BaseFont /Times-Italic>>>>>>  \n    /MediaBox [0 0 595.275590551\
    \ 841.88976378]  \n    /Rotate 0 /Contents [4 0 R] >>  \nendobj  \n2 0 obj  \n\
    <</Type /Catalog /Pages 3 0 R>>  \nendobj  \n3 0 obj  \n<</Type /Pages /Kids [1\
    \ 0 R] /Count 1>>  \nendobj  \n4 0 obj  \n<</Length 53>>  \nstream  \n1 0 0 1\
    \ 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET  \nendstream  \nendobj  \nxref\
    \  \n0 5  \n0000000000 65535 f  \n0000000015 00000 n  \n0000000200 00000 n  \n\
    0000000245 00000 n  \n0000000296 00000 n  \ntrailer  \n<</Size 5 /Root 2 0 R>>\
    \  \nstartxref  \n397  \n%%EOF\n```\n\nRather complicated, as we can see. Our\
    \ first job is to define a pleasant OCaml data type for PDF documents, which can\
    \ then be flattened to the format above when written to a file.\n\nThe main body\
    \ of a PDF file is a set of numbered objects – there are four in the example above,\
    \ from `1 0 obj` to `4 0 obj`. Each one contains some structured data, such as\
    \ the dictionary `</Type /Pages [1 0 R] /Count 1>>` which associates `/Type`,\
    \ `/Kids` to the name `/Pages`, the array `[1 0 R]`, and the integer `1` respectively.\
    \ Before and after the main body is some data most of which we do not need to\
    \ hold in our structure – it is generated upon writing. Here are all the kinds\
    \ of data we will be using:\n\n- Booleans, like `true` and `false`\n- Integers,\
    \ such as `256`, `-1`\n- Floating-point numbers such as `1.5`\n- Strings, like\
    \ `(a string)` which are characters within parentheses\n- Names, like `/Name`\n\
    - Ordered arrays such as `[1 2]`\n- Dictionaries, which are unordered collections\
    \ of key-value pairs, where the keys are names. For example, `<<One /Two /3>>`.\n\
    - Streams, like object 4 in the example above, which are arbitrary bytes.\n- References,\
    \ like `4 0 R` which point to another object (here, `4`).\n\nHere is an OCaml\
    \ data type to hold such data:\n\n```\ntype pdfobject =\n  Boolean bool\n  | Integer\
    \ int\n  | Float float\n  | String string\n  | Array pdfobject list\n  | Dictionary\
    \ (string * pdfobject) list\n  | Stream pdfobject * string\n  | Indirect int\n\
    ```\n\nNote that it is recursive, mirroring the structure of the data. For example,\
    \ object 3 in the example, that is `</Type /Pages [1 0 R] /Count 1>>`, will be\
    \ represented as:\n\n```\nDictionary [(\"/Type\", Name \"/Pages\"), Integer 1]\n\
    ```\n\nNow we need a type to represent the whole document, which contains a list\
    \ of these objects, the PDF version (1.1 in the example), and the trailer (`<<Size\
    \ 5 /Root 2 0 R>>`). Else is generated upon writing. It is traditional to name\
    \ the main type `t`:\n\n```ocaml\ntype t = {\n  version : int;\n  objects : (int\
    \ * pdfobject) list;\n  trailer : pdfobject\n}\n```\n\nWe put these two types\
    \ into `pdf.ml` and `pdf.i`. Here is how we might build an instance of this data\
    \ representing our example:\n\n```ocaml\nlet objects = [\n  (1,\n    Dictionary\
    \ [\n      (\"/Type\", Name \"/Page\");\n      (\"/Parent\", Indirect 3);\n  \
    \    (\"/Resources\",\n        Dictionary [\n          (\"/Font\",\n         \
    \   Dictionary [\n              (\"/F0\",\n                Dictionary [\n    \
    \              (\"/Type\", Name \"/Font\");\n                  (\"/Subtype\",\
    \ Name \"/Type1\");\n                  (\"/BaseFont\", Name \"/Times-Italic\"\
    )\n                ])\n            ])\n          )\n      );\n      (\"/MediaBox\"\
    ,\n        Array [Float 0.; Float 0.; Float 595.275590551; Float 841.88976378]);\n\
    \      (\"/Rotate\", Integer 0);\n      (\"/Contents\", Array [Indirect 4])\n\
    \    ])\n  );\n  (2,\n    Dictionary [\n      (\"/Type\", Name \"/Catalog\");\n\
    \      (\"/Pages\", Indirect 3)])\n  );\n  (3,\n    Dictionary [\n      (\"/Type\"\
    , Name \"/Pages\");\n      (\"/Kids\", Array [Indirect 1]);\n      (\"/Count\"\
    , Integer 1)])\n  );\n  (4,\n    Stream (\n      Dictionary [(\"/Length\", Integer\
    \ 53)],\n      \"1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET\"))\n]\n\
    \nlet hello =\n  {version = (1, 1);\n  objects = objects;\n  trailer = Dictionary\
    \ [(\"/Size\", Integer 5); (\"/Root\", Indirect 2)]}\n```\n"
