    ### Exception: …


    This is printed if an un-handled exception reaches OCaml.


    ```ocaml

    # exception Exp of string;;

    exception Exp of string

    # raise (Exp "Failed");;

    Exception: Exp "Failed".

    ```


    This can occur for built-in exceptions like `Division_by_Zero` or `Not_found`
    or ones the user has defined like `Exp` above.


    ### WARNINGS


    Warnings do not stop an expression being accepted or evaluated. They are printed
    after an expression is accepted but before the expression is evaluated. Warnings
    are for occasions where OCaml is concerned you may have made a mistake, even though
    the expression is not actually malformed. You should check each new warning in
    a program carefully.


    #### This pattern-matching is not exhaustive


    This warning is printed when OCaml has determined that you have missed out one
    or more cases in a pattern match. This could result in a `Match_failure` exception
    being raised at run-time.


    ```ocaml

    # let f x = match x with 0 -> 1;;

    Warning 8: this pattern-matching is not exhaustive.

    Here is an example of a value that is not matched:

    1

    val f : int -> int = <fun>

    ```


    Helpfully, it is able to generate an example of something the pattern match does
    not cover, so this should give you a hint about what has been missed out. You
    may ignore the warning if you are sure that, for other reasons, this case can
    never occur.


    #### This match case is unused


    This occurs when two parts of the pattern match cover the same case. In this situation,
    the second one could never be reached, so it is almost certain the programmer
    has made a mistake.


    ```ocaml

    # let f x = match x with _ -> 1 | 0 -> 0;;

    Warning 11: this match case is unused.

    val f : int -> int = <fun>

    ```


    In this case, the first case matches everything, so the second cannot ever match.


    #### This expression should have type unit


    Sometimes when writing imperative programs, we ignore the result of some side-effect-producing
    function. However, this can indicate a mistake.


    ```ocaml

    # f 1; 2;;

    Warning 10: this expression should have type unit.

    - : int = 2

    ```


    It is better to use the built-in `ignore` function in these cases, to avoid this
    warning:


    ```ocaml

    # ignore (f 1); 2;;

    - : int = 2

    ```


    The `ignore` function has type `α → unit`. It has no side-effect.

