    1


    We already know that O wins 131184 times. By a similar use of `num_wins` we find
    that X wins 77904 times. So, as expected, going first is an advantage. We must
    write another function to find how many draws there are. A board is drawn if it
    is full but does not contain a winning configuration of either X or O:


    > ![](images/00195.jpg)


    This tells us that there are 46080 drawn games. Since each game must be either
    won or drawn, the total number of possible games is 131184 + 77904 + 46080 = 255168\.
    We can check this by writing a function to find the terminal nodes directly:


    > ![](images/00201.jpg)


    This gives 255168 too.


