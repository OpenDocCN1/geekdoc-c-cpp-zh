    \ trees\n\nWe have seen that binary search trees are only useful if they are close\
    \ to balanced. In recent decades, several data structures have been developed\
    \ which try to keep a binary tree “reasonably balanced”, such that operations\
    \ remain efficient. “Red-Black trees” are one such commonly used and interesting\
    \ data structure. Red-Black trees were invented by Rudolf Bayer, and the functional\
    \ formulation presented here is due to Chris Okasaki in his landmark book “Purely\
    \ Functional Data Structures” (Cambridge University Press,1998).\n\nA Red-Black\
    \ tree is an ordinary binary tree with one addition: each node is either Red or\
    \ Black. Leaf nodes are considered Black. The balance is ensured by every operation\
