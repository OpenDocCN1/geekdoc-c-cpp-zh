    \ AND operator `land`, and then halved:\n\nNote: The following contains duplicates\
    \ from the source text.\n\n## Chapter 6\n\n## Compressing Data\n\nOften we need\
    \ to attempt to reduce the amount of space taken by some data, for storage or\
    \ transmission. If data were arbitrary, it could not be compressed – to compress\
