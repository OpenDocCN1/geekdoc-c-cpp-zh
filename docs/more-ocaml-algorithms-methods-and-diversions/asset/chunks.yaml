    标签参数的另一个常见用途是在使用部分应用（partial application）时提供灵活性。考虑以下函数：


    ```ocaml

    let divide x y = x / y

    ```


    我们可以使用部分应用来编写一个函数，该函数将一万除以列表中的每个数字：


    ```ocaml

    let f = divide 10000 in [f 100; f 50; f 20]

    ```


    这产生了 `[100; 200; 500]`。但我们不能重用 `divide` 来编写一个将列表中的每个数字除以十的函数——这需要先部分应用第二个参数 `y`。`divide`
    函数的设计已经固定了哪些参数可以被部分应用（OCaml 允许我们对参数的任何前缀进行部分应用——第一个、第一个和第二个、第一个、第二个和第三个等）。例如，我们可以使用部分应用的
    `List.map` 将同一个函数应用到许多列表上，但我们无法通过将列表传递给 `List.map` 来将多个函数应用到单个列表。在我们的示例中，我们可以为
    `divide` 函数的参数标记标签：


    ```ocaml

    let divide ~x ~y = x / y

    ```


    该函数的类型反映了这一点：


    ```ocaml

    OCaml

    # let divide ~x ~y = x / y;;

    val divide : x:int -> y:int -> int = <fun>

    ```


    现在，我们可以按任何顺序应用参数：


    ```ocaml

    OCaml

    # let f = divide ~x:10000 in [f 100; f 50; f 20];

    - : int list = [100; 200; 500]

    # let f = divide ~y:10000 in [f 100000; f 10000; f 1000];

    - : int list = [10; 1; 0]

    ```


    事实上，如果我们按顺序应用参数，可以省略标签：


    ```ocaml

    OCaml

    # let f = divide 10000 in [f 100; f 50; f 20];

    - : int list = [100; 200; 500]

    ```


    ### 可选参数


    OCaml 还允许我们将标签参数设为可选——也就是说，我们不需要提供它。在未提供一个或多个参数的情况下调用的函数可以决定做什么。考虑这个简单的函数 `split`，它从输入列表返回一个单元素列表列表，例如对于输入列表
    `[1; 2; 3]` 返回 `[[1]; [2]; [3]]`：


    > ![](img/00152.jpg)


    我们希望扩展该函数以生成指定大小的子列表，而不是默认的 1。我们可以添加一个标签参数并适配该函数，使用在第 xiii 页中描述的 `Util` 模块中的 `take`（从列表开始获取指定数量的项）和
    `drop`（从列表开始丢弃指定数量的项）：


    > ![](img/00157.jpg)


    不过，这里存在两个问题。使用该函数的现有代码将无法编译，而且我们必须始终指定 `chunksize` 参数，即使它为 1。这可以通过可选标签参数来解决，该参数用问号
    `?` 代替波浪号 `~` 引入，并赋予一个默认值：


    > ![](img/00160.jpg)


    注意问号也出现在类型中。同样注意，在 `split` 的递归调用中，我们可以像通常一样写 `~chunksize` 而不是 `~chunksize:chunksize`。现在，我们的
    `split` 函数可以带或不带这个可选参数调用：


    ```ocaml

    OCaml

    # split [1; 2; 3];

    - : int list list = [[1]; [2]; [3]]

    # split ~chunksize:3 [1; 2; 3; 4; 5; 6; 7];

    - : int list list = [[1; 2; 3]; [4; 5; 6]; [7]]

    ```


    事实上，如果在 `split` 的定义没有为可选参数提供默认值，我们就可以访问它的实现——作为 `option` 类型的值（`None` 或 `Some`），并且我们可以对其进行模式匹配：


    > ![](img/00165.jpg)


    这在存在可选参数时特别有用。


    ### 标准库中的标签


    标准库包含了其他模块的三个标签版本：`ListLabels`、`ArrayLabels` 和 `StringLabels`。例如，我们可以写：


    ```ocaml

    ListLabels.map ~f:(fun x -> x*2) [1; 2; 3];

    - : int list = [2; 4; 6]

    ```


    如果我们希望默认使用标签模块，`StdLabels` 模块以原始名称包含了这些模块，因此通过编写 `open StdLabels`，`List.map` 和
    `Array.blit` 现在将带有标签：


    ```ocaml

    open StdLabels;;

    # List.map ~f:(fun x -> x*2) [1; 2; 3];

    - : int list = [2; 4; 6]

    ```


    这些模块并没有标记所有参数。通常，它们会对作为函数的参数进行标记，当存在多个可能混淆的同类型参数时进行标记。例如，`ArrayLabels` 中的 `pos`
    和 `len` 可能会混淆。`ArrayLabels.make` 的类型为 `pos:int -> len:int -> α`。


    #### 问题


    1. 在按顺序应用参数时，我们可以省略标签吗？

    2. 如果我们默认使用标签模块，应该怎么做？

    3. 当存在可选参数时，这主要有什么用？

    4. 如果我们在 `split` 的定义中不给可选参数提供默认值，我们可以访问它的实际实现吗？

