  trans: "\n现在，我们可以仔细地编写一个函数 `select_case`，它接收一个起始棋盘（例如 `[E; E; E; E; O; E; E; E;\
    \ E]`）和游戏树，返回与该棋盘匹配的游戏树部分。由于懒加载，树的其余部分现在没有被探索。\n\n我们现在可以轻松地为延迟情况修改 `num_wins`，并编写一个函数\
    \ `pos_wins`，它返回从类似 `[E; E; E; E; O; E; E; E; E]` 的位置开始的胜利次数。\n\n> ![](img/00240.jpg)\n\
    \n同样，我们可以修改 `drawn` 函数以适应新的懒性结构，并编写一个新函数 `draws` 来从给定的起始棋盘（如 `[E; E; E; E; O;\
    \ E; E; E; E]`）计算平局位置：\n\n> ![](img/00213.jpg)\n\n现在我们可以为中心点、侧边中间和角点定义起始棋盘。现在我们可以考虑对称性来枚举所有情况，并使用\
    \ `pos_wins` 和 `draws`：\n\n> ![](img/00216.jpg)\n\n得到如下结果：\n\n```\nval centre_x_wins\
    \ : int = 5616\nval centre_o_wins : int = 15648\nval centre_drawn : int = 4608\n\
    val side_x_wins : int = 40704\nval side_o_wins : int = 56928\nval side_drawn :\
    \ int = 20736\nval corner_x_wins : int = 31584\nval corner_o_wins : int = 58608\n\
    val corner_drawn : int = 20736\n```\n\n当然，总数是 255168。\n\n### 3\n\n使用魔方表示法的策略是构建一个与原始问题同构（具有相同的本质特征——即完全相同的形状）但更容易处理的问题。在构建树之前，我们需要五个小函数：\n\
    \n- `sum`：检查列表之和是否为 15；\n- `threes`：在数字列表中找到所有长度为三的数字组合（`combinations` 函数来自第 10\
    \ 章）；\n- `won`：使用 `threes` 检查整数列表是否包含和为 15 的三个数字组合；\n- `drawn`：给定 X 和 O 的整数列表，计算游戏是否为平局；\n\
    - `possibles`：给定所有非空单元格，列出所有空单元格。\n\n> ![](img/00086.jpg)\n\n现在，该类型包含一个 X 位置列表、一个\
    \ O 位置列表以及子节点列表：\n\n```\ntype tree = Move of int list * int list * tree list\n\
    ```\n\n这次我们不需要为回合定义类型——只需使用布尔值即可。`next_moves` 函数遵循通常模式——如果游戏结束（胜利或平局），则子节点列表为空。否则，我们为下位玩家可以放置棋子的每个可能位置构建子节点。\n\
    \n> ![](img/00219.jpg)\n\n* * *\n\n> ![](img/00229.jpg)\n> 图 A.3:\n\n* * *\n\n\
    游戏树如图 A.3 所示。我们可以写一个简单的 `xwins` 函数来测试新函数返回的结果是否与原始函数相同。\n\n> ![](img/00088.jpg)\n\
    \n### 13 表示文档 \n\n#### 1\n\n为尾部字典写入 `T`，我们得到了图 `T` → `2` → `3` ←→ `1` → `4`。\n\
    \n#### 2\n\n这些可以通过引用数据结构写出来：\n\n- `Name \"/Name\"`\n- `String \"Quartz Crystal\"\
    `\n- `Dictionary [(\"/Type\", Name \"/ObjStm\"); (\"/N\", Integer 100); (\"/First\"\
    , Integer 807); (\"/Last\", Integer 1836); (\"/Filter\", Name \"/FlateDecode\"\
    )]`\n- `Array [Integer 1; Integer 2; Float 1.5; String \"black\"]`\n- `Array [Integer\
    \ 1; Indirect 2]`\n\n在最后两个示例中，我们在适当的地方使用了整数。注意在最后一个示例中，解析具有某种歧义——我们需要一直读到 `R`\
    \ 才能确定它不是几个整数的数组。\n\n#### 3\n\n考虑树 `Br (Br (Lf, 1, Lf), 2, Br (Lf, 3, Lf))`。我们将使用嵌套字典来表示它。分支将具有键为\
    \ `/Type` 值为 `/Br`。它将包含子树的 `/Left` 和 `/Right` 项。叶子简单由 `/Lf` 表示。在 PDF 文件中我们这样写：\n\
    \n```pdf\n</Type /Br /Value 2 /Left <<</Type /Br /Value 1 /Lf /Right /Lf>> /Right\
    \ <<</Type /Br /Value 3 /Left /Lf /Right /Lf>>>>\n```\n\n从我们的 OCaml 数据类型构建它：\n\
    \n```ocaml\nlet tree =\n  Pdf.Dictionary\n  [(\"/Type\", Name \"/Br\");(\"/Value\"\
    , Integer 2); (\"/Left\", <<(\"/Type\", Name \"/Br\");(\"/Value\", Integer 1);\
    \ Name \"/Lf\";(\"/Right\", Name \"/Lf\")>>);(\"/Right\", <<(\"/Type\", Name \"\
    /Br\");(\"/Value\", Integer 3);(\"/Left\", Name \"/Lf\");(\"/Right\", Name \"\
    /Lf\")>>)]\n```\n\n#### 4\n\n给定所有非空单元格，列出空单元格。\n\n> ![](img/00086.jpg)\n\n现在，该类型包含一个\
    \ X 位置列表、一个 O 位置列表以及子节点列表：\n\n```\ntype tree = Move of int list * int list * tree\
    \ list\n```\n\n这次我们不需要为回合定义类型——只需使用布尔值即可。`next_moves` 函数遵循通常模式——如果游戏结束（胜利或平局），则子节点列表为空。否则，我们为下位玩家可以放置棋子的每个可能位置构建子节点。\n\
    \n> ![](img/00219.jpg)\n\n*(注：此处由于原文存在重复段落且与后文逻辑有重叠，已按翻译要求保持逻辑一致)*\n\n"
