    \ this can be used to retrieve a final string after output is finished.\n\n# Chapter\
    \ 5\n\n## Streams of Bits\n\nWe have dealt with byte-by-byte streams of information.\
    \ Often, though, we need to consider data as a stream of bits. Can we build a\
