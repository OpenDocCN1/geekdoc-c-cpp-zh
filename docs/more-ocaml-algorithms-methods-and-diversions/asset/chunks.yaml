    \ the sequences `grey` `g` and `grey` `G`. Add them to our data type, and redo\
    \ the circles program to use colour.\n\n4.  The sequence `width` `w` sets the\
    \ line width. Add this to our data type and use it to draw a single large unfilled\
    \ circle over the centre of the page.\n\n5.  The operator `W` in place of a stroke\
    \ or paint operator is used to set up a clipping path. Add this to our data type.\
    \ Turn your big circle into a clipping path for the random circles pattern, so\
    \ you now have circles within a circle.\n\nChapter 16\n\nAdding Text\n\nIn this\
    \ chapter, we will develop a very simple typesetter. Given a string representing\
    \ the page content, it will split it into words, break them across lines and place\
    \ them on the page. In the questions at the end of the chapter, the typesetter\
    \ will be extended to use full justification, to indent paragraphs, and to produce\
    \ multi-page documents.\n\nTo begin with, some of our numbers (lines per page,\
    \ margins etc.) will be hard coded – we will then factor them out as we generalize\
    \ the code. But let us define names for the page width and height for an A4 page\
    \ first, to prevent excessive duplication:\n\n> ![](images/00149.jpg)\n\nWe first\
    \ need to split our text into words. For our purposes, a word is anything separated\
    \ from another word by one or more spaces. To preserve the paragraph breaks, the\
    \ new line character `\\n` will be considered a word also. So, for example, the\
    \ string `\"He stopped.\\n Looking around, he saw he was enveloped in smoke.\"\
    ` would be split into the list of words `[\"He\"; \"stopped.\"; \"\\n\"; \"Looking\"\
    ; \"around,\"; \"he\"; \"saw\";` `\"he\"; \"was\"; \"enveloped\"; \"in\"; \"smoke.\"\
    ]`.\n\nThe function `consume_spaces`, given an input, places the input position\
    \ at the first non-space character at or after its current position. If the end\
    \ of the input is reached, no exception is raised.\n\n> ![](images/00176.jpg)\n\
    \nNow we can write a function to read a word. First, we consume any spaces present.\
    \ Then, we repeatedly read characters into a buffer until either a space occurs,\
    \ a newline occurs, or we reach the end of a file. If a space occurs, we have\
    \ finished reading the word. If a newline occurs, we have finished also, but we\
    \ rewind so the newline will be picked up as its own word next time. If we reach\
    \ the end of the input, we return the contents of the buffer so far.\n\n> ![](images/00202.jpg)\n\
    \nNow it is simple to collect all the words in an input by repeatedly calling\
    \ `read_word`, and accumulating the result is a list.\n\n> ![](images/00032.jpg)\n\
    \nWe shall consider the opening paragraphs of Kafka’s “Metamorphosis”:\n\n`One morning, when Gregor Samsa woke from troubled dreams, he found\
