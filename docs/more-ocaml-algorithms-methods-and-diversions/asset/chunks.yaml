    \ file directly is that it may be programmatically manipulated with ease, using\
    \ pattern matching and other standard OCaml techniques. Note that the content\
    \ of the page itself `\"1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET\"\
    ` remains a plain string. We shall look at this separate language soon.\n\nIn\
    \ the next three chapters, we will learn how to write this representation to a\
    \ file, and add our own text and graphics to the page.\n\nQuestions\n\n1.  Draw\
    \ the graph of the relationships, via indirect references such as `3 0 R`, of\
    \ the objects 1, 2, 3, 4 and the trailer dictionary.\n\n2.  Represent the following\
    \ PDF objects using our data type:\n\n    *   `/Name`\n\n    *   `(Quartz Crystal)`\n\
    \n    *   `<</Type /ObjStm /N 100 /First 807 /Length 1836 /Filter /FlateDecode>>`\n\
    \n    *   `[1 2 1.5 (black)]`\n\n    *   `[1 2 0 R]`\n\n3.  PDF files can contain\
    \ arbitrary objects, which will be ignored by a PDF reader if they are not understood.\
    \ Design a way of representing items of the following type using one or more PDF\
    \ objects:\n\n     `type tree = Lf | Br of tree * int * tree`\n\n4.  Write a function\
    \ of type pdfobject → pdfobject which, given an object, replaces the value of\
    \ any dictionary entry with key `/Rotate` to `90`.\n\nChapter 14\n\nWriting Documents\n\
    \nWe have built a representation for PDF documents to be held in memory, and defined\
    \ an example document. Now, we must build functions to write this to file. Recall\
    \ our example file from the last chapter:\n\n`%PDF-1.1  `\n\n`1 0 obj  `\n\n`<</Type /Page\
    \  `\n\n`  /Parent 3 0 R  `\n\n`  /Resources  `\n\n`    <</Font  `\n\n`       <</F0\
    \  `\n\n`          <</Type /Font /Subtype /Type1 /BaseFont /Times-Italic>>>>>>\
    \  `\n\n`       /MediaBox [0 0 595.275590551 841.88976378]  `\n\n`       /Rotate 0 /Contents [4 0 R] >>\
    \  `\n\n`endobj  `\n\n`2 0 obj  `\n\n`<</Type /Catalog /Pages 3 0 R>>  `\n\n`endobj\
    \  `\n\n`3 0 obj  `\n\n`<</Type /Pages /Kids [1 0 R] /Count 1>>  `\n\n`endobj\
    \  `\n\n`4 0 obj  `\n\n`<</Length 53>>  `\n\n`stream  `\n\n`1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET\
    \  `\n\n`endstream  `\n\n`endobj  `\n\n`xref  `\n\n`0 5  `\n\n`0000000000 65535 f\
    \  `\n\n`0000000015 00000 n  `\n\n`0000000200 00000 n  `\n\n`0000000245 00000 n\
    \  `\n\n`0000000296 00000 n  `\n\n`trailer  `\n\n`<</Size 5 /Root 2 0 R>>  `\n\
    \n`startxref  `\n\n`397  `\n\n`%%EOF`\n\nIt consists, we remember, of a header,\
    \ then some objects (here, four), and a trailer. We will need four functions:\n\
    \n1.  The function `string_of_pdfobject` to make a string from a Pdf.pdfobject,\
    \ for example making the string `\"<</Type /Pages /Kids [1 0 R] /Count 1>>\"`\
    \ from the pdfobject `Dictionary` `[(\"/Type\", Name \"/Pages\"); (\"/Kids\",\
    \ Array [Indirect 1]); (\"/Count\", Integer 1)]`;\n\n2.  The function `write_header`\
    \ to write the header (i.e. everything before the objects);\n\n3.  The function\
    \ `write_trailer` to write the trailer (i.e. everything after the objects); and\n\
    \n4.  The main function `pdf_to_file` which uses these three functions to write\
    \ a Pdf.t to a file under the given file name.\n\nThe function `string_of_pdfobject`\
    \ is best expressed as a set of mutually-recursive functions introduced with the\
    \ `let rec … and …` construct. To give it as a single function is possible, but\
    \ would be rather large, and so harder to read and edit. Let us present it piece-by-piece\
    \ and then all at once.\n\nFirst, the main part. Given an object we wish to produce\
    \ its string, assuming that `string_of_array`, `string_of_dictionary`, and `string_of_stream`\
    \ exist:\n\n> ![](images/00185.jpg)\n\nThe cases are all simple, except for the\
    \ ones we have put aside to be implemented separately. Strings must be put between\
    \ parentheses, indirect references are printed as `2 0 R` etc.\n\nTo build a string\
    \ from an `Array`, we need to start with an open square bracket, add the string\
    \ for each Pdf.pdfobject in the array (which may be arbitrarily complex, of course),\
    \ and put spaces between them. Then we end with a close square bracket:\n\n> ![](images/00233.jpg)\n\
    \nIt is natural to use the Buffer module from the Standard Library to collect\
    \ these strings together. It is also more efficient than using string concatenation.\
    \ Notice we do not add an initial space after the square bracket, but do before\
    \ the closing square bracket, for symmetry. The `string_of_dictionary` function\
    \ is somewhat similar:\n\n> ![](images/00237.jpg)\n\nNow for `string_of_stream`.\
    \ A stream in PDF is written like this:\n\nstream dictionary\n\n`stream`\n\nstream\
    \ data\n\n`endstream`\n\nThis is simple with the Buffer module too:\n\n> ![](images/00270.jpg)\n\
    \n* * *\n\n> ![](images/00060.jpg)\n\n> Figure 14.1: Our mutually recursive functions\
    \ to build a string from a Pdf.pdfobject\n\n* * *\n\nThe code for these four functions\
    \ is collected together in Figure [14.1](#index_split_021.html_filepos271214).\
    \ Now that we can build a string from any Pdf.pdfobject, we can proceed to build\
    \ the `write_header`, `write_trailer`, and `write_objects` functions, so that\
    \ we have everything we need for the final `pdf_to_file` function.\n\nThe PDF\
    \ header consists of `%%PDF-`m`.`n where m and n are the major and minor version\
    \ numbers. This is easy to build with `Printf.sprintf`:\n\n> ![](images/00199.jpg)\n\
    \nThe `write_objects` function, which is given a list of (int × Pdf.pdfobject)\
    \ pairs, sorts the objects by their number, and then outputs each object using\
    \ `string_of_pdfobject`. For example, the pair\n\n`(3,  `\n\n`  Dictionary  `\n\
    \n`    [(\"/Type\", Name \"/Pages\"); (\"/Kids\", Array [Indirect 1]); (\"/Count\"\
    , Integer 1)])`\n\nwill be written to file like this:\n\n`3 0 obj  `\n\n`<< /Type /Pages /Kids [1 0 R] /Count 1 >>\
    \  `\n\n`endobj`\n\nThe function collects and returns a list of the byte offsets\
    \ of the objects written, since this will be needed to write the trailer section,\
    \ which we shall describe in a moment.\n\n> ![](images/00147.jpg)\n\nNow, we can\
    \ write the trailer. That is to say, this section:\n\n`xref  `\n\n`0 5  `\n\n\
    `0000000000 65535 f  `\n\n`0000000015 00000 n  `\n\n`0000000230 00000 n  `\n\n\
    `0000000279 00000 n  `\n\n`0000000338 00000 n  `\n\n`trailer  `\n\n`<< /Size 5 /Root 2 0 R >>\
    \  `\n\n`startxref  `\n\n`440  `\n\n`%%EOF`\n\nThis consists largely of a list\
    \ of the byte offsets of the four objects in the file (15, 230, 279, 338), the\
    \ trailer dictionary, and so on. It is not necessary to understand it in detail.\
    \ This is the first section which would be read by a PDF reader, to find the actual\
    \ objects in the file.\n\n> ![](images/00085.jpg)\n\nNow the main function is\
    \ simple. We open the file, write the header, objects, and trailer, and close\
    \ the file. In the event of an exception, we close the file to clean up, and re-raise\
    \ it.\n\n> ![](images/00114.jpg)\n\nThis code goes into `pdfwrite.ml`. The interface\
    \ `pdfwrite.mli` is very simple. We expose only\n\n`pdf_to_file`:\n\n> ![](images/00141.jpg)\n\
    \nHere is the output of our program on the example Pdfhello.hello:\n\n`%PDF-1.1 `\n\
    \n`1 0 obj `\n\n`<< /Type /Page /Parent 3 0 R /Resources << /Font << /F0 << /Type /Font /Subtype /Type1 /BaseFont /Times-Italic >> >> >> /MediaBox [ 0. 0. 595.275590551 841.88976378 ] /Rotate 0 /Contents [ 4 0 R ] >> `\n\
    \n`endobj `\n\n`2 0 obj `\n\n`<< /Type /Catalog /Pages 3 0 R >> `\n\n`endobj `\n\
    \n`3 0 obj `\n\n`<< /Type /Pages /Kids [ 1 0 R ] /Count 1 >> `\n\n`endobj `\n\n\
    `4 0 obj `\n\n`<< /Length 53 >> `\n\n`stream `\n\n`1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET `\n\
    \n`endstream `\n\n`endobj `\n\n`xref `\n\n`0 5 `\n\n`0000000000 65535 f `\n\n\
    `0000000015 00000 n `\n\n`0000000230 00000 n `\n\n`0000000279 00000 n `\n\n`0000000338 00000 n `\n\
    \n`trailer `\n\n`<< /Size 5 /Root 2 0 R >> `\n\n`startxref `\n\n`440 `\n\n`%%EOF`\n\
    \nThis loads correctly into a PDF viewer. Notice that some of the spacing is different\
    \ from the specimen PDF we had at the top of the chapter – this does not matter.\
    \ Now we can move on to putting more interesting content on the page of our PDF\
    \ documents.\n\nQuestions\n\n1.  Modify the code so that arrays and dictionaries\
    \ do not have spaces at either end of them (these spaces are not required). For\
    \ example, we should see `[2 0 R]` rather than `[ 2 0 R ]`."
