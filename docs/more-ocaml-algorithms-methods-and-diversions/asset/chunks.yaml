  trans: "\n\n# 函数\n通过 `let name argument1 argument2 … = expression` 引入函数。对于某些类型 `α`、`β`、`γ`\
    \ 等，它们的类型为 `α → β`、`α → β → γ` 等。例如，`let f a b = a > b` 是一个类型为 `α → α → bool`\
    \ 的函数。\n\n递归函数的引入方式相同，但使用 `let rec` 代替 `let`。例如，这里有一个函数 `g`，它使用递归函数 `f` 计算大于或等于给定正整数的最小\
    \ 2 的幂：\n\n```ocaml\nlet rec f x y =\n  if y < x then f x (2 * y) else y\nlet\
    \ g z = f z 1\n```\n\n相互递归函数，通过编写 `let rec f x = …` 和 `g y = …` 以及 `…` 引入。\n\n\
    # 模式匹配\n使用 `match expression1 with pattern1 | … -> expression2 | pattern2 | …\
    \ -> expression3 | …` 进行模式匹配。表达式 `expression2`、`expression3` 等必须具有相同的类型，而这整个 `match\
    \ … with` 表达式的类型。特殊模式 `_` 可匹配任何内容。\n\n```ocaml\nmatch x with\n  0 -> 1\n| 1 |\
    \ 2 -> 3\n| _ -> 4\n```\n\n使用逗号分隔来同时匹配两个或多个对象，如 `match a, b with 0, 0 -> expression1\
    \ | x, y -> expression2 | …`：\n\n```ocaml\nmatch x, y, z with\n  0, 0, 0 -> true\n\
    | _, _, _ -> false\n```\n\n# 列表\n列表是同类型元素零个或多个元素的有序集合。它们被书写在方括号之间，元素之间用分号分隔，例如\
    \ `[1; 2; 3; 4; 5]`。如果列表不为空，它有一个头（head），即第一个元素，和一个尾（tail），即由其余元素组成的列表。\n\n`::`\
    \ “cons”操作符用于将元素添加到列表头部。`@` “append”操作符用于将两个列表连接在一起。\n\n```ocaml\n1 :: [2; 3]\n\
    [1; 2] @ [3]\n```\n\n列表和 `::` “cons”符号可以用于模式匹配，以区分长度为零、一等的具有特定内容的列表。例如，我们可以计算列表的长度：\n\
    \n```ocaml\nlet rec length l =\n  match l with\n    [] -> 0\n    | _::t -> 1 +\
    \ length t\n```\n\n# 异常\n使用 `exception name` 定义异常。可以通过添加 `of` 类型来携带额外信息。使用 `raise`\
    \ 抛出异常。使用 `try … with …` 处理异常：\n\n```ocaml\nexception Problem of int\n\nlet f\
    \ x y =\n  if y = 0\n    then raise (Problem x)\n    else x / y\nlet g x y =\n\
    \  try f x y with Problem p -> p\n```\n\n# 部分应用\n通过提供少于完整数量的参数对函数进行部分应用。对由操作符构建的函数进行部分应用。\n\
    \n```ocaml\nlet add x y = x + y\nList.map (add 3) [1; 2; 3]\nList.map (( + ) 3)\
    \ [1; 2; 3]\n```\n\n# 新数据类型\n使用 `type name = constructor1 of type1 | constructor2\
    \ of type2 | …` 定义新类型。像内置类型一样对它们进行模式匹配。多态类型。\n\n```ocaml\ntype colour =\n  Red\
    \ | Blue | Green | Grey of int\n[Red; Blue; Grey 16] (* 这类型为 colour list\n\ntype\
    \ 'a tree =\n  Lf\n| Br of 'a tree * 'a * 'a tree\n```\n\n例如，`Br (Lf, 'X', Br\
    \ (Lf, 'Y', Lf))` 的类型为 `char tree`。非常有用的内置数据类型是 option 类型，定义为 `type 'a option\
    \ = None | Some of 'a`。类型可以在多个类型参数上是多态，例如标准库中的 `('a, 'b) Hashtbl.t`。\n\n# 基本输入/输出\n\
    值 `()` 及其类型 `unit`。`in_channel` 类型输入通道和 `out_channel` 类型输出通道。内置函数如 `open_in`、`close_in`、`open_out`、`close_out`、`input_char`、`output_char`\
    \ 等，分别用于从中读取和写入。\n\n# 可变状态\n类型为 `α ref` 的引用。使用 `ref` 构建它们，使用 `!` 访问其内容并使用 `:=`\
    \ 操作符更新它们。\n\n```ocaml\nlet p = ref 0\n# p := 5\n# !p\n```\n\n类型为 `α array` 的数组书写形式类似\
    \ `[1; 2; 3]`。使用 `Array.make` 创建数组，使用 `Array.length` 查找长度，使用 `a.(index)` 访问元素。使用\
    \ `a.(index) <-` 更新：\n\n```ocaml\nlet swap x y =\n  let t = a.(x) in\n  a.(x)\
    \ <- a.(y)\n```\n\n使用 `begin` 和 `end` 代替括号将表达式分组：\n\n```ocaml\nif x = y then\n\
    \  begin\n    a := b;\n    c := d\n  end\nelse\n  e := f\n```\n\n根据布尔值多次执行某项操作，使用\
    \ `while` 结构：\n\n```ocaml\nwhile x < y\n```\n\n使用 `for` 结构根据固定次数执行操作：\n\n```ocaml\n\
    for x = 1 to 10 do print_int x\n```\n\n# 浮点数\n浮点数类型 `float`。浮点运算符 `+.`、`*.`、`/.`\
    \ 以及内置函数 `min_float` `max_float`。\n\n```ocaml\n2.0\n```\n\n# OCaml 标准库\n来自标准库的函数。例如\
    \ `List.map`、`String.length`、`Array.copy`。`Buffer` 模块允许高效合并字符串。\n\n# 简单模块\n在 `.ml`\
    \ 文件中编写模块。在 `.mli` 文件中构建接口。使用 `val` 关键字。例如，内容 `let f = x + 1`。\n\n# 编译程序\n`ocamlc`\
    \ 和 `ocamlopt` 编译器。例如：\n`ocamlc -o x x.ml` 使用字节码编译器将 `x.ml` 编译为 `x`。\n`ocamlopt\
    \ -o x x.ml` 使用原生代码编译器将 `x.ml` 编译为 `x`。\n\n# 我们的工作环境\n示例代码以及章节末问题的答案都可以从书的网站 [`http://www.ocaml-book.com/](http://www.ocaml-book.com/)\
    \ 下载，并在 Unix（包括 Linux）、Mac OS 和 Microsoft Windows 上构建。\n\n由于我们的程序需要尾递归列表函数，我们为标准库\
    \ `List` 模块提供了一个封装。此外，三个小型工具函数（`take`、`drop` 和 `from`）位于 `Util` 模块中。这些模块包含在 `More`\
    \ 中。因此，通过编写 `open More`，可以使用 `Util` 模块，且 `List` 中的所有函数都是尾递归的。\n\n如果使用 OPAM（OCaml\
    \ 包管理器），可以通过 `opam install more-ocaml` 安装包。然后（或其他其他方式安装——参见在线资源），我们的模块在交互式环境中是用的：\n\
    \n```ocaml\nOCaml\n# \"topfind\";\n- unit = ()\nFindlib 已加载。附加指令：\n  #require\
    \ \"package\";; 加载包\n  #list;; 列出可用包\n  #camlp4o;; 加载 camlp4（标准语法）\n  #camlp4r;;\
    \ 加载 camlp4（修订语法）\n  #predicates \"p,q,...\"; 设置这些谓词\n  #Topfind.reset(); 强制重新加载包\n\
    \  #thread;; 启用线程\n```\n\n"
- fmt: "\nSometimes we will wish to see how much time a piece of code takes. This\
    \ can be achieved using the function `gettimeofday` from the `Unix` module (contrary\
    \ to its name, this module also works on Windows). This function returns a floating-point\
    \ number representing the time since 00:00:00 GMT, Jan. 1, 1970, in seconds:\n\
    \n```ocaml\n# #use \"topfind\";;\n- : unit = ()\nFindlib has been successfully\
    \ loaded. Additional directives:\n  #require \"package\";;      to load a package\n\
    \  #list;;                 to list the available packages\n  #camlp4o;;      \
    \        to load camlp4 (standard syntax)\n  #camlp4r;;              to load camlp4\
    \ (revised syntax)\n  #predicates \"p,q,...\";;   to set these predicates\n  Topfind.reset();;\
    \       to force that packages will be reloaded\n  #thread;;               to\
    \ enable threads\n- : unit = ()\n# #require \"unix\";;\n/Users/john/.opam/4.01.0/lib/ocaml/unix.cma:\
    \ loaded\n# Unix.gettimeofday ();;\n- : float = 1407679005.43897\n# Unix.gettimeofday\
    \ ();;\n- : float = 1407679011.08860302\n```\n\nNow, by evaluating `Unix.gettimeofday\
    \ ()`, running a piece of code, and evaluating `Unix.gettimeofday ()` once more,\
    \ we can calculate the elapsed time. To use the `Unix` module when compiling stand-alone\
    \ programs:\n\n```\nocamlfind ocamlc -package more,unix program.ml -linkpkg -o\
    \ program\nocamlfind ocamopt -package more,unix program.ml -linkpkg -o program\n\
    ```\n\n# Chapter 1\n\n## Unravelling “Fold”\n\nThe `List` module in OCaml’s Standard\
    \ Library defines two intriguingly-named functions over lists:\n\n![](images/00056.jpg)\n\
    \nWhat do they do? And why are they considered important enough to include in\
    \ the Standard Library? As we shall see, they abstract the idea of recursion over\
    \ lists with an accumulator in a most delightfully generic way.\n\nLet us first\
    \ examine `fold_left` and its rather complicated type. The first argument is itself\
    \ a function, which takes the existing accumulator and an element from the input\
    \ list, combines them in some fashion, and returns a new accumulator, ready for\
    \ the next element. So, in general, the first argument has type `α → β → α`. Then\
    \ we have an initial value for the accumulator, which must have type `α`, and\
    \ an input list of type `β list`. The return value is the final accumulator, so\
    \ that must have type `α`. We can annotate the function as follows:\n\n![](images/00101.jpg)\n\
    \nWe can find the sum of a list of numbers:\n\n![](images/00129.jpg)\n\nHere,\
    \ `α` and `β` are both `int`. The function `(+)` has the right type, and we use\
    \ for the initial accumulator the identity element for `(+)` which is `0` since\
    \ for all `x`, `x + 0 = x` (we cannot take the initial accumulator from the list\
    \ itself since our function must have a result for the sum of all the integers\
    \ in an empty list.)\n\nIt might appear to the reader that this is more complicated\
