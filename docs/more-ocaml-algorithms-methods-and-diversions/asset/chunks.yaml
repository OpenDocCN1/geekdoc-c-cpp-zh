    \ ss - 1 &&\n      ss.[ssp + 1] = s.[sp]\n    then\n      Some (2, 1)\n    else\n\
    \      None\n```\n\n### 5\n\n可以使用标准库函数 `String.uppercase` 以及可选的布尔参数：\n\n> ![](img/00014.jpg)\n\
    \n当然，模式和字符串都必须大写。\n\n## 10 (寻找排列)\n\n### 1\n\n列表的组合可以通过计算尾部的组合来生成。然后考虑两种可能性——头部包含在这一组合中，或者不包含：\n\
    \n> ![](img/00155.jpg)\n\n注意基础情况是包含空列表的列表，而不仅仅是空列表。\n\n### 2\n\n我们通过 `perms` 和刚刚编写的\
    \ `combinations` 函数来构建它：\n\n> ![](img/00197.jpg)\n\n当然，我们使用了 `perms` 的尾递归版本。\n\
    \n### 3\n\n它的形状与 `combinations` 相似，但有两个不同：我们保留了一个计数器以确保计算结束，并且我们总是向列表中添加内容——要么是\
    \ `true`，要么是 `false`。\n\n> ![](img/00139.jpg)\n\n### 4\n\n给定一个数组、偏移量和长度，反复交换子数组两端的元素：\n\
    \n> ![](img/00276.jpg)\n\n确保它适用于空范围、偶数长度子数组和奇数长度子数组是很重要的的。你可以向此函数添加对无效参数的检测。\n\
    \n### 5\n\n`first` 和 `last` 两个函数证明比它们的命令式对应版本还要笨拙。`first` 函数给定一个列表，返回一个包含三个元素的元组：“第一个”项目之前的元素、该项目本身以及紧随其后的元素。这是通过反转输入列表并寻找第一个合适的项目来实现的，因为比在原始输入中寻找最后一个合适的项目要简单：\n\
    \n> ![](img/00122.jpg)\n\n`last` 函数仍然更冗长：我们通过排序并找到大于 `f` 的最小项目来确定正确的项目。然后我们可以调用\
    \ `split_at` 返回 `f` 实例之前之后的项目。\n\n"
- fmt: "\nNow, we can carefully write a function `select_case` which, given a starting\
    \ board such as `[E; E; E; E; O; E; E; E; E]` and the game tree, returns the portion\
    \ of the game tree matching that board. Due to laziness, the rest of the tree\
    \ is now not explored.\n\nWe can now alter `num_wins` easily for the delayed case,\
    \ and write a function `pos_wins` which returns the number of wins starting from\
    \ a position like `[E; E; E; E; O; E; E; E; E]`.\n\n> ![](images/00240.jpg)\n\n\
    Similarly, we can modify the `drawn` function to work with the new lazy structure,\
    \ and write a new function `draws` to count the drawn positions from a given starting\
    \ board such as `[E; E; E; E; O; E; E; E; E]`:\n\n> ![](images/00213.jpg)\n\n\
    Now we can define starting boards for the centre spot, the middle of a side, and\
    \ a corner. We can now use `pos_wins` and `draws`, taking account of symmetry\
    \ to enumerate all the cases:\n\n> ![](images/00216.jpg)\n\nThis gives the following:\n\
    \n```\nval centre_x_wins : int = 5616\nval centre_o_wins : int = 15648\nval centre_drawn\
    \ : int = 4608\nval side_x_wins : int = 40704\nval side_o_wins : int = 56928\n\
    val side_drawn : int = 20736\nval corner_x_wins : int = 31584\nval corner_o_wins\
    \ : int = 58608\nval corner_drawn : int = 20736\n```\n\nThe total is 255168, of\
    \ course.\n\n### 3\n\nThe strategy of using the magic square representation is\
    \ to build a problem which is isomorphic (has the same essential characteristics\
    \ – literally the same shape) to the original one, but is easier to work with.\
    \ Before building the tree tree, we will need five little functions:\n\n- `sum`,\
    \ which checks if a list sums to 15;\n- `threes`, which finds all combinations\
    \ of numbers from a list of numbers which are of length three (the `combinations`\
    \ function is from Chapter [10](#index_split_016.html_filepos191331));\n- `won`,\
    \ which uses `threes` to check if a list of integers contains a combination of\
    \ three numbers which sum to 15;\n- `drawn` which, given the integer lists for\
    \ X and O, works out if the game has been drawn;\n- `possibles` which, given all\
    \ the non-empty squares, lists the empty ones.\n\n> ![](images/00086.jpg)\n\n\
    Now, the type contains a list of X positions, a list of O positions, and the list\
    \ of child nodes:\n\n```\ntype tree = Move of int list * int list * tree list\n\
    ```\n\nWe do not need a type for the turn this time – we can just use a boolean.\
    \ The function `next_moves` follows the usual pattern – if the game is won or\
    \ drawn, the list of child nodes is empty. Otherwise, we build child nodes for\
    \ each possible position the next player could place his piece.\n\n> ![](images/00219.jpg)\n\
    \n* * *\n\n> ![](images/00229.jpg)\n> Figure A.3:\n\n* * *\n\nThe game tree is\
    \ shown in Figure [A.3](#index_split_024.html_filepos388565). We can write a simple\
    \ `xwins` function to test our new function returns the same result as the original.\n\
    \n> ![](images/00088.jpg)\n\n### 13 Representing Documents \n\n#### 1\n\nWriting\
    \ `T` for the trailer dictionary, we have the graph `T` → `2` → `3` ←→ `1` → `4`.\n\
    \n#### 2\n\nThese can be written out by reference to the data structure:\n\n-\
    \ `Name \"/Name\"`\n- `String \"Quartz Crystal\"`\n- `Dictionary [(\"/Type\",\
    \ Name \"/ObjStm\"); (\"/N\", Integer 100); (\"/First\", Integer 807); (\"/Last\"\
    , Integer 1836); (\"/Filter\", Name \"/FlateDecode\")]`\n- `Array [Integer 1;\
    \ Integer 2; Float 1.5; String \"black\"]`\n- `Array [Integer 1; Indirect 2]`\n\
    \nIn the last two examples, we assumed integer where appropriate. Notice that\
    \ in the last example, the parsing is somewhat ambiguous – we would need to read\
    \ all the way to the `R` to be sure it was not an array of several integers.\n\
    \n#### 3\n\nConsider the tree `Br (Br (Lf, 1, Lf), 2, Br (Lf, 3, Lf))`. We will\
    \ represent it using nested dictionaries. A branch will have a `/Type` key with\
    \ value `/Br`. It will have `/Left` and `/Right` entries for sub-trees. A leaf\
    \ is indicated simply by `/Lf`. In the PDF file we would write it like this:\n\
    \n```pdf\n</Type /Br /Value 2 /Left <<</Type /Br /Value 1 /Lf /Right /Lf>> /Right\
    \ <<</Type /Br /Value 3 /Left /Lf /Right /Lf>>>>\n```\n\nTo construct it from\
    \ our data type in OCaml:\n\n```ocaml\nlet tree =\n  Pdf.Dictionary\n  [(\"/Type\"\
    , Name \"/Br\");\n    (\"/Value\", Integer 2);\n    (\"/Left\",\n      Pdf.Dictionary\n\
    \      [(\"/Type\", Name \"/Br\");\n        (\"/Value\", Integer 1);\n       \
    \ (\"/Left\", Name \"/Lf\");\n        (\"/Right\", Name \"/Lf\")]);\n    (\"/Right\"\
    ,\n      Pdf.Dictionary\n      [(\"/Type\", Name \"/Br\");\n        (\"/Value\"\
    , Integer 3);\n        (\"/Left\", Name \"/Lf\");\n        (\"/Right\", Name \"\
    /Lf\")])]\n```\n\n#### 4\n\nWe must search for dictionary entries inside `Pdf.Dictionary`,\
    \ of course, but also inside `Pdf.Stream`, which contains a dictionary, and `Pdf.Array`\
    \ which may do so. Two mutually-recursive functions will do:\n\n> ![](images/0238.jpg)\n\
    \n### 14 Writing Documents\n\n#### 1\n\nWe can alter `string_of_array` and `string_of_dictionary`\
    \ to simply not output the space. To remove the initial space requires a little\
    \ trick. We inspect the length of the buffer to determine if we are about output\
    \ the first item. This is shown in Figure [A.4](#index_split_024.html_filepos395818).\n\
    \n* * *\n\n> ![](images/0123.jpg)\n> Figure A.4:\n\n* * *\n\n#### 2\n\nThe full\
    \ code can be found in the online resources. We make the following changes:\n\n\
    - Change `/Count` from `1` to `3`.\n- Move `/Resources` to its own object, number\
    \ `5`.\n- Write two new pages, objects `6` and `7`.\n- Write two page content\
    \ streams, `8` and `9`.\n- Change `/Size` from `5` to `10` to account for the\
    \ new objects.\n\n#### 3\n\nThe full code can be found in the online resources.\
    \ See the hint for a little more help.\n\n### 15 Pretty Pictures\n\n#### 1\n\n\
    Since we are working with circles, let us define π:\n\n> ![](images/00249.jpg)\n\
    \nWe can write a simple function to return the point at a given angle, distance\
    \ `r` from point (`x`, `y`):\n\n> ![](images/00255.jpg)\n\nNow, we can build a\
    \ list of all these points, remembering to stop before we have around the whole\
    \ circle. The argument `step` is the angle between successive points.\n\n> ![](images/00259.jpg)\n\
    \nFinally, we generate a `Move` to the first points, `Line`s to the rest, and\
    \ a final `Close`.\n\n> ![](images/00150.jpg)\n\nFor our example, we made a filled\
    \ circle of radius 100 centred at (300, 300) with `Pdfpage.Fill`:\n\n![](images/00271.jpg)\n\
    \n#### 2\n\nFirst, a function to build a pseudo-random circle somewhere on our\
    \ page, making sure to overlap the edges:\n\n> ![](images/00275.jpg)\n\nNow, a\
    \ little utility function to build a list of n things when given a function which\
    \ generates them, such as `random_circle`:\n\n> ![](images/0280.jpg)\n\nNow it\
    \ is simple to build a hundred random grey filled circles and append them all\
    \ together with `List.concat`:\n\n> ![](images/00117.jpg)\n\n![](images/00289.jpg)\n\
    \n#### 3\n\nWe can add `FillColourRGB of float * float * float` and `StrokeColourRGB\
    \ of float * float * float` to the data type and associated functions, and then\
    \ modify our previous example:\n\n> ![](images/00295.jpg)\n\nIf you are reading\
    \ the PDF ebook version of this book, the following image is in colour:\n\n![](images/00058.jpg)\n\
    \n#### 4\n\nWe add `LineWidth of float` to the data type and associated functions.\
    \ Now we set the line width and stroke colour and draw the large circle:\n\n>\
    \ ![](images/00055.jpg)\n\n![](images/00039.jpg)\n\n#### 5\n\nWe add `SetClip`\
    \ to the data type and associated functions. Then we set the clip before stroking.\n\
    \nThe single path is used both for clipping and for the stroke:\n\n> ![](images/00178.jpg)\n\
    \n![](images/00254.jpg)\n\n### 16 Adding Text\n\n#### 1\n\nWe can pull out font\
    \ size, line spacing and margin easily, defining them at the top of the page.\
    \ The text width is derived from the page width and margin. The maximum number\
    \ of characters in a line can be calculated using the formula given in the question:\n\
    \n```ocaml\nlet font_size = 10.0\nlet line_spacing = 1.1\nlet margin = 40.0\n\
    ```\n"
