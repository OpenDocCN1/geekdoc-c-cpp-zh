  trans: "\n\n## 2. 构建一个三页的 PDF 示例\n其 `/Kids` 数组将包含三个条目和三个页面对象。如果需要，这三个页面可以共享页面内容。你需要仔细地对额外的对象进行编号。\n\
    \n## 3. 修改程序，使用我们在第 6 章中的字节级压缩算法来压缩“Hello, World”程序中的内容流。你需要修复 `/Length` 并在流字典中添加\
    \ `/Filter /RunLengthDecode`。现在修改程序，使用相同章节中的位级压缩算法，并带有 `/Filter /CCITTFaxDecode`。除了更改\
    \ `/Filter` 条目外，你还需要向流字典中添加以下条目：\n\n```\n(\"/DecodeParms\", \n    Pdf.Dictionary\n\
    \      [(\"/Rows\", Pdf.Integer 1);\n      (\"/Columns\", Pdf.Integer (52 * 8));\n\
    \      (\"/BlackIs1\", Pdf.Boolean true);\n      (\"/EndOfBlock\", Pdf.Boolean\
    \ false)])\n```\n\n数字 52 是我们示例中数据的字节数。\n\n# 第 15 章：漂亮的图片\n\n我们还没有解释在页面上显示“Hello,\
    \ World!”的代码结构。这里再次给出：\n\n```\n1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!)\
    \ Tj ET\n```\n\n这是一个操作符-操作数的序列列表。每个序列由零或多个操作数和一个操作符组成。我们示例中的序列如下：\n\n![](img/00166.jpg)\n\
    \n在本章中，我们将引入几个用于绘制线条和填充形状的简单操作符（在下一章中我们将讨论添加文本并构建基础排版器）。这里是起初将使用的操作符：\n\n![](img/00194.jpg)\n\
    \n这里有一个数据类型，它是新的 `Pdfpage` 模块的一部分，用于编码这些操作符。需要时，我们将用新的操作符对其进行扩展。\n\n```python\n\
    type t =\n    Move of float * float\n  | Line of float * float\n  | Close\n  |\
    \ Stroke\n  | Fill\n  | FillColour of float\n  | StrokeColour of float\n```\n\n\
    为了将这些内容放入 PDF 文档，我们需要将每组操作数和操作符转换为字符串。这很简单：\n\n![](img/00284.jpg)\n\n现在我们可以使用\
    \ `Buffer` 模块中的函数将它们组合成单个字符串，并在每个后面加上一个空格字符。\n\n![](img/00248.jpg)\n\n这是一个非常简单的示例——我们移动到\
    \ (100, 100)，画三条线并关闭路径。然后我们使用 `Fill` 操作符。PDF 中的坐标原点位于页面左下方。\n\n![](img/00279.jpg)\n\
    \n我们的页面看起来如下：\n\n![](img/00007.jpg)\n\n并不是所有的操作序列都是有效的，而且我们的数据类型没有进行确保列表正确的检查。这可以通过构建一个高级数据类型来解决，然后将其展平为\
    \ `Pdfpage.t` 元素的列表。在我们的示例以及章节末尾的问题中，坚持上述模式就足够了——一个 `Move`、一个或多个 `Line`、一个 `Close`（如果填充的话）以及一个\
    \ `Fill` 或 `Stroke`。\n\n例如，我们将创建一个创建单线的函数，并用它来构建一个函数，该函数根据页面尺寸绘制一页网格纸。首先，一个从 (x,y)\
    \ 到 (x1,y1) 构建单线的函数：\n\n![](img/00035.jpg)\n\n现在，一个给定步长并从 0…n 返回一组等间距浮点值的函数：\n\
    \n![](img/00067.jpg)\n\n注意，我们非常小心地避免了浮点值的重复相加——这会累积误差。我们可以构建所有的线条：\n\n![](img/00080.jpg)\n\
    \n这是在 A4 纸上执行 `graph_string 595.28 841.89 10.` 的结果：\n\n![](img/00072.jpg)\n\n\
    ## 练习\n\n1. 编写一个函数，给定中心点和半径，返回一个表示圆的 `Move`、`Line` 和 `Close` 元素列表。使用数量圆大小合适的线条。\n\
    2. 使用上一个问题中的函数编写一个程序，输出一个布满随机大小和填充灰色圆的页面。\n3. 序列 `red green blue` `rg` 和 `red\
    \ green blue` `RG` 是序列 `grey` `g` 和 `grey` `G` 的颜色对应物。将它们添加到我们的数据类型中，并重做圆程序以使用颜色。\n\
    4. 序列 `width` `w` 设置线宽。将其添加到我们的数据类型中，并用它在页面中心画一个大空心圆。\n5. 操作符 `W` 代替描边（stroke）或填充操作符，用于设置裁剪路径。将其添加到我们的数据类型中。将你的大圆变成随机圆图案的裁剪路径，这样你现在就有圆中圆的效果了。\n\
    \n# 第 16 章：添加文本\n\n在本章中，我们将开发一个非常简单的排版器。给定一个表示页面内容的字符串，它将其拆分为单词，跨行断开并放在页面上。在章节末尾的问题中，排版器将实现对对齐、缩进并生成多页文档。起初，某些内容（如页码、页边距）是硬编码的——我们将定义页面的宽度和高度。\n\
    \n![](img/149.jpg)\n\n我们首先将文本拆分为单词。为了我们的目的，由一个或多个空格分隔的任何都是单词。为了保留换行符，`\\n` 被视为\n\
    \n![](img/176.jpg)\n\n现在我们可以写一个读取单词的函数。首先，将字符读入缓冲区，直到遇到空格或输入结尾。如果遇到结尾，我们就返回缓冲区\n\
    \n![](img/202.jpg)\n\n通过重复调用 `read_word` 来收集所有单词是简单的\n\n![](img/32.jpg)\n\n我们将考虑卡夫卡的《变形》：\n\
    \n一个早晨，格戈尔从不安中醒来，发现自己变成了一只甲虫。他躺在床上，背部隆起像坚硬的甲壳。他抬起头，看到自己变成了一只巨大的害虫。他的腿细长而无力，完全无法动弹。他焦虑地闭上眼睛，仿佛这一切只是个梦。\n\
    \n"
- fmt: "\n`\"back,\"; \"and\"; \"if\"; \"he\"; \"lifted\"; \"his\"; \"head\"; \"a\"\
    ; \"little\"; \"he\";`\n`\"could\"; \"see\"; \"his\"; \"brown\"; \"belly,\"; \"\
    slightly\"; \"domed\"; \"and\";`\n`\"divided\"; \"by\"; \"arches\"; \"into\";\
    \ \"stiff\"; \"sections.\"; \"The\"; \"bedding\";`\n`\"was\"; \"hardly\"; \"able\"\
    ; \"to\"; \"cover\"; \"it\"; \"and\"; \"seemed\"; \"ready\";`\n`\"to\"; \"slide\"\
    ; \"off\"; \"any\"; \"moment.\"; \"His\"; \"many\"; \"legs,\"; \"pitifully\";`\n\
    `\"thin\"; \"compared\"; \"with\"; \"the\"; \"size\"; \"of\"; \"the\"; \"rest\"\
    ; \"of\";`\n`\"him,\"; \"waved\"; \"about\"; \"helplessly\"; \"as\"; \"he\"; \"\
    looked.\"; \"\\n\";`\n`\"\\\"What's\"; \"happened\"; \"to\"; \"me?\"; \"he\";\
    \ \"thought.\"; \"It\"; ...]`\n\nNotice the newline as a word on its own. Our\
    \ next task is to break this sequence of words into lines of a given width. We\
    \ will have two kinds of line. A `Full` line is one we had to break at the end\
    \ of. A `Partial` line is one which ended because of a newline or end-of-input.\
    \ In our first example, we will not need to distinguish these two, but when it\
    \ comes to justification and more advanced examples, it will be invaluable. The\
    \ type is trivial:\n\n```ml\ntype line =\n    Full of string\n    | Partial of\
    \ string\n```\n\n### The line breaking function\n\nThe function `lines` takes\
    \ a maximum width in characters, and a list of words, and returns a line list.\
    \ There are three cases in the `lines_inner` function:\n\n1. If we have reached\
    \ the end of the list of words, return the list of collected `line`s, adding one\
    \ for anything in the current line buffer, if it is non-empty.\n2. If we have\
    \ a newline word, create a `Partial` line from the current buffer (even if it\
    \ is empty – this allows blank lines to be inserted using multiple newlines),\
    \ and carry on.\n3. If we have any other word, see how long it and the buffer\
    \ are. If the word is longer than the whole line and we are at the beginning of\
    \ that line, we output an over-sized line (an alternative would be to wrap or\
    \ hyphenate the word in some way). Otherwise, we see if the current word will\
    \ fit. If it will, we add it and a space to the buffer and carry on. It not, we\
    \ output a `Full` line, and start with the word on the next line.\n\n![](images/00258.jpg)\n\
    \nFor example, here is our text split into lines of no more than twenty characters\
    \ each:\n\n```ml\n[Text.Full \"One morning, when \"; Text.Full \"Samsa woke from\
    \ \";\nText.Full \"dreams, he found \"; Text.Full \"transformed in his \";\nText.Full\
    \ \"into a horrible \"; Text.Full \"He lay on his \";\nText.Full \"back, and if\
    \ he \"; Text.Full \"his head a little \";\nText.Full \"could see his brown \"\
    ; Text.Full \"slightly domed and \";\nText.Full \"by arches into \"; Text.Full\
    \ \"sections. The \";\nText.Full \"was hardly able to \"; Text.Full \"it and seemed\
    \ ready \";\nText.Full \"slide off any \"; Text.Full \"His many legs, \";\nText.Full\
    \ \"thin compared with \"; Text.Full \"size of the rest of \";\nText.Full \"waved\
    \ about \"; Text.Partial \"as he looked.\";\nText.Full \"\\\"What's happened to\
    \ \"; Text.Full \"he thought. It \";\nText.Full \"a dream. His room, \"; Text.Full\
    \ \"proper room, \";\nText.Full \"a little too small, \"; Text.Full \"peacefully\
    \ between \";]\n```\n\n### PDF operators\n\nNow we need to add appropriate text-showing\
    \ operators to our `page` module, and then produce a list of operators for showing\
    \ a line, using it repeatedly to show the whole page. A text section in a PDF\
    \ operator looks like this:\n\n```pdf\nBT 1 0 0 1 40 50 Tm /F0 12 Tf (text) Tj\n\
    ```\n\n![](images/287.jpg)\n\nHere are the fragments added to the `page.t` type:\n\
    \n```\n| BeginText\n| EndText\n| SetTextPosition float float\n| SetFontAndSize\
    \ string float\n| ShowText string\n```\n\nand the `string_of_op` function:\n\n\
    ```\n| BeginText -> \"BT\"\n| EndText -> \"ET\"\n| SetTextPosition (x, y) -> Printf.sprintf\
    \ \"1 0 0 1 %f % Tm\" x y\n| SetFontAndSize (font, size) -> Printf.sprintf \"\
    %s %f Tf\" font size\n| ShowText t -> Printf.sprintf \"(%s) Tj\" t\n```\n\nConsider\
    \ Figure 16.1. The function `typeset_line_at` builds a single line at `x` position\
    \ 20 and a given `y` coordinate. The function `downfrom` builds a list of `y`\
    \ positions for a number of lines. The utility function `clean_lines` makes plain\
    \ strings from a list of `line`s, and the function `typeset_page` puts it all\
    \ together, generating a big list of `page.t` operations. The resulting PDF is\
    \ shown in Figure 16.2. The full code for this chapter is included in the online\
