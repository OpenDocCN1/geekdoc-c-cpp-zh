  trans: "\n\n`\"back,\"; \"and\"; \"if\"; \"he\"; \"lifted\"; \"his\"; \"head\";\
    \ \"a\"; \"little\"; \"he\";`\n`\"could\"; \"see\"; \"his\"; \"brown\"; \"belly,\"\
    ; \"slightly\"; \"domed\"; \"and\";`\n`\"divided\"; \"by\"; \"arches\"; \"into\"\
    ; \"stiff\"; \"sections.\"; \"The\"; \"bedding\";`\n`\"was\"; \"hardly\"; \"able\"\
    ; \"to\"; \"cover\"; \"it\"; \"and\"; \"seemed\"; \"ready\";`\n`\"to\"; \"slide\"\
    ; \"off\"; \"any\"; \"moment.\"; \"His\"; \"many\"; \"legs,\"; \"pitifully\";`\n\
    `\"thin\"; \"compared\"; \"with\"; \"the\"; \"size\"; \"of\"; \"the\"; \"rest\"\
    ; \"of\";`\n`him,\"; \"waved\"; \"about\"; \"helplessly\"; \"as\"; \"he\"; \"\
    looked.\"; \"\\n\";`\n`\"\\\"What's\"; \"happened\"; \"to\"; \"me?\"; \"he\";\
    \ \"thought.\"; \"It\"; ...]`\n\n注意换行符作为一个独立的单词。我们的下一个任务是将这一系列单词拆分为给定宽度的行。我们将会有两种类型的行：`Full`（完整行）是指我们在末尾必须进行断句的行；`Partial`（部分行）是指由于换行符或输入结束而结束的行。在第一个示例中，我们不需要区分这两种，但当涉及到对齐（justification）和更高级示例时，它将是无价的。该类型非常简单：\n\
    \n```ml\ntype line =\n    Full of string\n    | Partial of string\n```\n\n###\
    \ 换行函数\n\n`lines` 函数接收一个字符字符宽度和一个单词列表，并返回一个行列表。在 `lines_inner` 函数中有三种情况：\n\n1.\
    \ 如果我们到达了单词列表的末尾，返回收集到的 `line` 列表，如果当前行缓冲区不为空，则为其中的内容添加一行。\n2. 如果我们遇到了换行符单词，则从当前缓冲区创建一个\
    \ `Partial` 行（即使它是空的——这允许使用多个换行符插入空行），然后继续执行。\n3. 如果我们遇到任何其他单词，查看该单词和缓冲区的长度。如果单词比整行还长且我们正处于该行的开头，我们输出一个超长行（另一种方案是以某种方式对单词进行折行或加连字符）。否则，我们查看当前单词是否能够放入。如果可以，我们将它和一个空格添加到缓冲区中并继续执行。如果不能，我们输出一个\
    \ `Full` 行，并在下一行开始处理该单词。\n\n![](img/00258.jpg)\n\n例如，这里是我们的文本被拆分为每行不超过二十个字符的行：\n\
    \n```ml\n[Text.Full \"One morning, when \"; Text.Full \"Samsa woke from \";\n\
    Text.Full \"dreams, he found \"; Text.Full \"transformed in his \";\nText.Full\
    \ \"into a horrible \"; Text.Full \"He lay on his \";\nText.Full \"back, and if\
    \ he \"; Text.Full \"his head a little \";\nText.Full \"could see his brown \"\
    ; Text.Full \"slightly domed and \";\nText.Full \"by arches into \"; Text.Full\
    \ \"sections. The \";\nText.Full \"was hardly able to \"; Text.Full \"it and seemed\
    \ ready \";\nText.Full \"slide off any \"; Text.Full \"His many legs, \";\nText.Full\
    \ \"thin compared with \"; Text.Full \"size of the rest of \";\nText.Full \"waved\
    \ about \"; Text.Partial \"as he looked.\";\nText.Full \"\\\"What's happened to\
    \ \"; Text.Full \"he thought. It \";\nText.Full \"a dream. His room, \"; Text.Full\
    \ \"proper room, \";\nText.Full \"a little too small, \"; Text.Full \"peacefully\
    \ between \";]\n```\n\n### PDF 运算符\n\n现在我们需要为我们的 `page` 模块添加适当的文本显示运算符，然后生成一个用于显示行的运算符列表，重复使用它来显示整个页面。PDF\
    \ 运算符中的文本部分看起来如下：\n\n```pdf\nBT 1 0 0 1 40 50 Tm /F0 12 Tf (text) Tj\n```\n\n\
    ![](img/287.jpg)\n\n以下是添加到 `page.t` 类型中的片段：\n\n```\n| BeginText\n| EndText\n|\
    \ SetTextPosition float float\n| SetFontAndSize string float\n| ShowText string\n\
    ```\n\n以及 `string_of_op` 函数：\n\n```\n| BeginText -> \"BT\"\n| EndText -> \"ET\"\
    \n| SetTextPosition (x, y) -> Printf.sprintf \"1 0 0 1 %f % Tm\" x y\n| SetFontAndSize\
    \ (font, size) -> Printf.sprintf \"%s %f Tf\" font size\n| ShowText t -> Printf.sprintf\
    \ \"(%s) Tj\" t\n```\n\n考虑图 16.1。`typeset_line_at` 函数在 `x` 坐标 20 和给定的 `y` 坐标处构建单行。`downfrom`\
    \ 函数为若干行构建一个 `y` 坐标列表。工具函数 `clean_lines` 从 `line` 列表创建纯字符串，而 `typeset_page` 函数将所有内容整合在一起，生成一个大的\
    \ `page.t` 操作列表。生成的 PDF 如图 16.2 所示。本章的完整代码包含在线资源中——在尝试题目之前应该查阅。\n\n![](img/272.jpg)\n\
    图 16.1:\n\n![](img/018.jpg)\n图 16.2:\n\n### \n\n1. 提取字体大小、行高、边距并自动计算行的字符数（可以通过公式\
    \ `w/f` 计算，其中 `w` 是宽度，`f` 是字体大小）。程序现在适用于任何页面大小。\n2. 每个段落的第一行（除外）应缩进八个字符。实现它。\n\
    3. 实现完全对齐。这将产生段落第一行的左边距和最后一行的右边距。这可以通过修改字符和单词之间的间距来实现。当然，`Partial` 行不应拉伸。\n4.\
    \ 如果长度需要，允许程序生成多个页面。这可以通过扩展 PDF 文件中的 `/Kids` 条目并生成多个页面对象来实现。\n\n### 题目答案\n\n提示可以在第\
    \ 309 页找到。\n\n**1 (拆解 “Fold”)**\n\n1\n这可以通过对扣除进行折叠来实现，并将初始累加器设置为预算：\n\n![](img/250.jpg)\n\
    可以使用部分应用，如第二个定义所示。\n\n2\n我们可以使用一个从零开始的累加器，每处理一个元素就递增一次：\n\n![](img/026.jpg)\n\
    由于我们忽略了元素本身，该函数是多态的。\n\n3\n如果列表为空，我们返回 `None`，否则我们使用左折叠，它会用列表中的后续元素替换累加器。我们必须初始化累加器，因此我们选择第一个元素进行初始化（我们已经消除了没有元素的情况，因此\
    \ `List.hd` 将成功）。\n\n![](img/134.jpg)\n不太符合习惯。\n\n4\n如果我们从左侧开始，将每个元素构造到累加器中（初始为空列表），列表将反转。\n\
    \n![](img/228.jpg)\n由于累加器是空列表（类型为 `α list`），函数保持多态，具有我们预期的类型。\n\n5\n累加器初始设置为 `false`。对于每个元素，我们计算经过测试的元素与累加器之间的逻辑或。如果至少出现一次\
    \ `true`，结果将是 `true`。\n\n![](img/036.jpg)\n"
- fmt: "\nWe can compare the speed of `List.mem` and `member` with the help of the\
    \ `Unix.gettimeofday` function, as shown in Figure [A.1](#index_split_024.html_filepos315703).\
    \ On the Author’s machine, this results in:\n\n> ![](images/00041.jpg)\n> Figure\
    \ A.1:\n\n`Our member took 2.513232 seconds`\n`List.mem took 1.162159 seconds`\n\
    \nThere is a significant speed penalty in our version of the member function,\
    \ at least for this scenario.\n\n## 2 (Being Lazy)\n\n### 1\nThis is similar to\
    \ the `lseq` function in the text, but we double every time instead of adding\
    \ one.\n\n> ![](images/00180.jpg)\n\nHaving written the function which, given\
    \ a number, doubles from that point, we then just code the list itself by starting\
    \ at 1.\n\n### 2\nIf we are asked to fetch the 0th element, we already have it\
    \ – as the head of the lazy list. If not, we force evaluation of the tail, and\
    \ recurse.\n\n> ![](images/00256.jpg)\n\nOf course, this does not terminate on\
    \ bad inputs (when n < 0). Error detection should be added.\n\n### 3\nBelow, the\
    \ function `lrepeating_inner` takes the current list `c` and the original list\
    \ `l`. Matching on `c`, we build the lazy list. If we reach the last element of\
    \ the input list, we start again, with the original list, which is always retained.\n\
    \n> ![](images/00064.jpg)\n\nNote that we cannot build from an empty list, since\
    \ there could be no head.\n\n### 4\nThe first two fibonacci numbers are defined\
    \ to be 0 and 1. Thereafter, we keep the current and previous number, and generate\
    \ the lazy list.\n\n> ![](images/00003.jpg)\n\n### 5\nThis is slightly delicate.\
    \ We must force the tail twice, to reveal new elements for the heads of the two\
    \ output lists, and the final tail for the next time each list is forced.\n\n\
    > ![](images/00266.jpg)\n\nNote that we cannot hoist the calculation of `unleave\
    \ t` into a `let` so as to do it once, since to do so would not delay evaluation.\n\
    \n### 6\nIf we write a function which, given a number, gives the correct string,\
    \ then the lazy list itself is easy to build with `lmap` and `lseq`.\n\n> ![](images/00260.jpg)\n\
    \n## 3 (Named Tuples with Records)\n\n### 1\nSince a reference is just a record\
    \ with a mutable field `contents`, we can use the `<-` construct:\n\n```ocaml\n\
    # let x = ref 0;;\nval x : int ref = {contents = 0}\n# x.contents <- 1;;\n- :\
    \ unit = ()\n# x;;\n- : int ref = {contents = 1}\n```\n\nThere is no reason to\
    \ use this rather than `:=` of course.\n\n### 2\nThe function `Unix.time` returns\
    \ the current time. The function `Unix.localtime` builds from this a record of\
    \ type `Unix.tm`. First we will need two ancillary functions:\n\n> ![](images/00130.jpg)\n\
    \nNow the main function, which both uses the shortened form of a record pattern,\
    \ and names only the fields we need:\n\n> ![](images/00264.jpg)\n\nNote that the\
    \ names bound by the pattern do not include the `Unix` prefix.\n\n### 3\nThe construct\
    \ `type t = {x : int ref}` is a record type containing a reference to an integer.\
    \ We can build it using an existing reference, and can extract the reference for\
    \ use elsewhere. We can share a single reference between two or more instances\
    \ of this data type. The construct `type t = {mutable x : int}` is a record with\
    \ a single, mutable field. We must use `<-` rather than `:=` to mutate it, and\
    \ it may not be shared.\n\n### 4\nWe can use multiple type parameters (which are\
    \ written with parentheses and commas) and then use these types for the fields\
    \ in the appropriate way:\n\n```ocaml\ntype ('a, 'b, 'c) t =\n  {a : 'a;\n   b\
    \ : 'a;\n   c : 'b;\n   d : 'b;\n   e : 'c;\n   f : 'c}\n```\n\n### 5\nFor the\
    \ first part, we can use the function `Gc.stat` to return a `Gc.stat` record.\
    \ Then we can write various components to the given file (here, we have chosen\
    \ just a few):\n\n> ![](images/00110.jpg)\n\nFor the second part, we define names\
    \ for the magic numbers given in the documentation. We can then write a function\
    \ `change_verbosity` which adds them up to make the new flags, and uses `Gc.get`\
    \ with the `with` syntax to build a new record to be passed to `Gc.set`:\n\n>\
    \ ![](images/0245.jpg)\n\n## 4 (Generalized Input/Output)\n\n### 1\nThis is a\
    \ simple modification of `input_of_string` from the text, replacing string operators\
    \ with array ones.\n\n> ![](images/0291.jpg)\n\nNote that an array of characters\
    \ requires this more space as a string.\n\n### 2\nWe create a `Buffer.t`, attempt\
    \ to read the specified number of characters, and then return the contents. If\
    \ one of the calls to `i.input_char` raises the `End_of_file` exception, we return\
    \ the buffer anyway – it will contain the characters read so far.\n\n> ![](images/0224.jpg)\n\
    \n### 3\nWe add a function of expected type to the input. The option `None` will\
    \ represent the end of the file.\n\n```ocaml\ntype input =\n  {pos_in : unit ->\
    \ int;\n   seek_in : int -> unit;\n   input_char : unit -> char;\n   input_char_opt\
    \ : unit -> char option;\n   in_channel_length : int}\n```\n\nNow for a new `input_of_channel`.\
    \ We try to build the `Some` option, returning `None` if the `End_of_file` exception\
    \ is raised.\n\n> ![](images/0198.jpg)\n\n`input_of_string` function is another\
    \ similar modification. This time, there is no need for exception handling.\n\n\
    > ![](images/0209.jpg)\n\n### 4\nWe add the function of type `unit → int`.\n\n\
    ```ocaml\ntype input =\n  {pos_in : unit -> int;\n   seek_in : int -> unit;\n\
    \   input_char : unit -> char;\n   input_byte : unit -> int;\n   in_channel_length\
    \ : int}\n```\n\nNow, having defined as a convenience, the name `no_more` for\
    \ -1, we can modify `input_of_channel` and `input_of_string` easily:\n\n> ![](images/0052.jpg)\n\
    \nThese functions have none of the advantages of exception-raising or option-returning,\
    \ but they are very fast.\n\n### 5\nWe alter `input_of_channel` to check for a\
    \ newline and raise `End_of_file` in that case.\n\n> ![](images/0191.jpg)\n\n\
    Now we can create one of these inputs from standard input, and use our `input_string`\
    \ function to build a string from the user’s input, ending when the return key\
    \ is pressed. For example:\n\n```ocaml\n# input_string(single_line_input_of_channel\
    \ stdin) max_int;;\nSome input\n- : string = \"Some input\"\n```\n\n### 6\nIdeal\
    \ functions to use when defining the new type already exist in the `Buffer` module.\
    \ Then, we can build an example, where we give a name to the buffer, build an\
    \ input from it and process it, retrieving its contents afterwards.\n\n> ![](images/0031.jpg)\n\
    \n## 5 (Streams of Bits)\n\n### 1\nWe can read quickly if the number of bits wanted\
    \ is 8 and we happen to be at the beginning of a byte. In this case we can call\
    \ the underlying output’s `input_char` function directly.\n\n> ![](images/0172.jpg)\n\
    \nIf the conditions are not met, we fall back to the old `getval` function. This\
    \ will be faster if we frequently read data aligned-byte-by-aligned-byte, but\
    \ we still need the flexibility of a stream of bits when required.\n\n### 2\n\
    We simply replace the `int` operators with those for `Int32.t`:\n\n> ![](images/0015.jpg)\n\
    \n### 3\nOur precondition this time is that the number of bits to be written is\
    \ 8 and the `obit` field is set to its initial value, 7. Then we can use the `output_char`\
    \ function of the underlying output.\n\n> ![](images/0156.jpg)\n\nOtherwise, we\
    \ fall back to the old `putval` function.\n\n### 4\nThe integer functions are\
    \ replaced by ones from the `Int32` module:\n\n> ![](images/0296.jpg)\n\n### 5\n\
    We add a field `rewind` which will move the position in the output backwards one\
    \ byte, if possible. This is the new type:\n\n```ocaml\ntype output =\n  {output_char\
    \ : char -> unit;\n   rewind : unit -> unit;\n   out_channel_length : unit ->\
    \ int}\n```\n\nNow we can rewrite, for example, `output_of_string` for this new\
    \ type:\n\n> ![](images/0102.jpg)\n\nWe alter `putbit` appropriately:\n\n> ![](images/0098.jpg)\n\
    \n## 6 (Compressing Data)\n\n### 1\nWe will need to look through the input list\
    \ of integers (bytes), finding same and different runs and building a new list.\
    \ For clarity, we will produce the output runs using a new type, producing the\
    \ actual bytes later:\n\n```ocaml\ntype run = Same of int * int | Diff of int\
    \ list\n```\n"
  raw: 'We can compare the speed of `List.mem` and `member` with the help of the `Unix.gettimeofday`
    function, as shown in Figure [A.1](#index_split_024.html_filepos315703). On the
    Author’s machine, this results in:


    * * *


    > ![](images/00041.jpg)


    > Figure A.1:


    * * *


    `Our member took 2.513232 seconds  `


    `List.mem took 1.162159 seconds`


    There is a significant speed penalty in our version of the member function, at
    least for this scenario.


    2 (Being Lazy)


    1


    This is similar to the `lseq` function in the text, but we double every time instead
    of adding one.


    > ![](images/00180.jpg)


    Having written the function which, given a number, doubles from that point, we
    then just code the list itself by starting at 1.


    2


    If we are asked to fetch the 0th element, we already have it – as the head of
    the lazy list. If not, we force evaluation of the tail, and recurse.


    > ![](images/00256.jpg)


    Of course, this does not terminate on bad inputs (when n < 0). Error detection
    should be added.


    3


    Below, the function `lrepeating_inner` takes the current list `c` and the original
    list `l`. Matching on `c`, we build the lazy list. If we reach the last element
    of the input list, we start again, with the original list, which is always retained.


    > ![](images/00064.jpg)


    Note that we cannot build from an empty list, since there could be no head.


    4


    The first two fibonacci numbers are defined to be 0 and 1\. Thereafter, we keep
    the current and previous number, and generate the lazy list.


    > ![](images/00003.jpg)


    5


    This is slightly delicate. We must force the tail twice, to reveal new elements
    for the heads of the two output lists, and the final tail for the next time each
    list is forced.


    > ![](images/00266.jpg)


    Note that we cannot hoist the calculation of `unleave t` into a `let` so as to
    do it once, since to do so would not delay evaluation.


    6


    If we write a function which, given a number, gives the correct string, then the
    lazy list itself is easy to build with `lmap` and `lseq`.


    > ![](images/00260.jpg)


    3 (Named Tuples with Records)


    1


    Since a reference is just a record with a mutable field `contents`, we can use
    the `<-` construct:


    `        OCaml`


    `# let x = ref 0;;`


    `val x : int ref = {contents = 0}`


    `# x.contents <- 1;;`


    `- : unit = ()`


    `# x;;`


    `- : int ref = {contents = 1}`


    There is no reason to use this rather than `:=` of course.


    2


    The function `Unix.time` returns the current time. The function `Unix.localtime`
    builds from this a record of type Unix.tm. First we will need two ancillary functions:


    > ![](images/00130.jpg)


    Now the main function, which both uses the shortened form of a record pattern,
    and names only the fields we need:


    > ![](images/00264.jpg)


    Note that the names bound by the pattern do not include the `Unix` prefix.


    3


    The construct `type t = {x : int ref}` is a record type containing a reference
    to an integer. We can build it using an existing reference, and can extract the
    reference for use elsewhere. We can share a single reference between two or more
    instances of this data type. The construct `type t = {mutable x : int}` is a record
    with a single, mutable field. We must use `<-` rather than `:=` to mutate it,
    and it may not be shared.


    4


    We can use multiple type parameters (which are written with parentheses and commas)
    and then use these types for the fields in the appropriate way:


    `type (''a, ''b, ''c) t =`


    `  {a : ''a;`


    `   b : ''a;`


    `   c : ''b;`


    `   d : ''b;`


    `   e : ''c;`


    `   f : ''c}`


    5


    For the first part, we can use the function `Gc.stat` to return a Gc.stat record.
    Then we can write various components to the given file (here, we have chosen just
    a few):


    > ![](images/00110.jpg)


    For the second part, we define names for the magic numbers given in the documentation.
    We can then write a function `change_verbosity` which adds them up to make the
    new flags field, and uses `Gc.get` together with the `with` syntax to build a
    new record to be passed to `Gc.set`:


    > ![](images/00245.jpg)


    4 (Generalized Input/Output)


    1


    This is a simple modification of `input_of_string` from the text, replacing string
    operators with array ones.


    > ![](images/00291.jpg)


    Note that an array of characters like this requires much more space as a string.


    2


    We create a Buffer.t, attempt to read the specified number of characters, and
    then return the contents. If one of the calls to `i.input_char ()` raises the
    `End_of_file` exception, we return the buffer contents anyway – it will contain
    the characters read so far.


    > ![](images/00224.jpg)


    3


    We add a function of the expected type to the input. The option `None` will represent
    the end of the file.


    `type input =`


    `  {pos_in : unit -> int;`


    `   seek_in : int -> unit;`


    `   input_char : unit -> char;`


    `   input_char_opt : unit -> char option;`


    `   in_channel_length : int}`


    Now for a new `input_of_channel`. We try to build the `Some` option, returning
    `None` if the `End_of_file` exception is raised.


    > ![](images/00198.jpg)


    The `input_of_string` function is another similar modification. This time, there
    is no need for exception handling.


    > ![](images/00209.jpg)


    4


    We add the function of type unit → int.


    `type input =`


    `  {pos_in : unit -> int;`


    `   seek_in : int -> unit;`


    `   input_char : unit -> char;`


    `   input_byte : unit -> int;`


    `   in_channel_length : int}`


    Now, having defined as a convenience, the name `no_more` for the -1, we can modify
    `input_of_channel` and `input_of_string` easily:


    > ![](images/00052.jpg)


    These functions have none of the advantages of the exception-raising or option-returning
    ones, but they are very fast indeed.


    5


    We alter `input_of_channel` to check for a newline and raise `End_of_file` in
    that case.


    > ![](images/00191.jpg)


    Now we can create one of these special inputs from standard input, and use our
    `input_string` function to build a string from the user’s input, ending when the
    return key is pressed. For example:


    `# input_string (single_line_input_of_channel stdin) max_int;;`


    `Some input`


    `- : string = "Some input"`


    6


    Ideal functions to use when defining the new type already exist in the Buffer
    module. Then, we can build an example, where we give a name to the buffer, build
    an input from it and process it, retrieving its contents afterwards.


    > ![](images/00031.jpg)


    5 (Streams of Bits)


    1


    We can read quickly if the number of bits wanted is 8 and we happen to be at the
    beginning of a byte. In this case we can call the underlying output’s `input_char`
