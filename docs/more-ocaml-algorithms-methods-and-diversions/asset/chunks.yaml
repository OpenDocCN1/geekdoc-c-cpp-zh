    \ first one:\n\n> ![](images/00214.jpg)\n\nNow, `List.length` is called only at\
    \ the beginning. We can also remove `Util.take` to avoid the construction of intermediate\
    \ lists, by writing an explicit function to test the pattern against the first\
    \ `len_p` items in the lists:\n\n> ![](images/00217.jpg)\n\nThis is now about\
    \ as efficient as our simple approach can get.\n\nSearching in strings\n\nFor\
    \ practical applications, we shall often need to search within strings, or other\
    \ such random-access structures. Our first list version generalizes easily:\n\n\
    > ![](images/00221.jpg)\n\nThis time, there is no problem with `String.length`\
    \ since, unlike `List.length`, it runs in constant time. We do have the overhead\
    \ of the first `String.sub`, analogous to the `Util.take` in the list version.\
    \ The second `String.sub` is also a problem since, unlike `List.tl`, it creates\
    \ a new string.\n\nTo solve this, we can define an auxiliary function `at` which,\
    \ given pattern `p`, string `s` and the length `l` to test, together with the\
    \ position in the pattern `pp` and in the main string `sp`, tests for equality.\
    \ This is similar to `equal` in our lists example.\n\n> ![](images/00226.jpg)\n\
    \nThe `search'` function itself has a counter for how far along the main string\
    \ it is. We initialize this to zero in `search`.\n\nMore flexible searches\n\n\
    We can make our searching function more interesting by allowing the use of some\
    \ special characters. We shall introduce only these simple constructs:\n\n*  \
    \ A `?` character matches zero or one instances of the following character. For\
    \ example, the pattern `?abc` matches `abc`, `bc`, and `dbc`;\n\n*   A `*` character\
    \ matches zero or more instances of the following character. So, the pattern `*abc`\
    \ matches `bc`, `abc`, and `aaabc`;\n\n*   A `+` character matches one or more\
    \ instances of the following character. For example, the pattern `+abc` matches\
    \ `abc` and `aaabc` but not `bc` or `dbc`.\n\nLet us add the `?` character to\
    \ begin with. First, we must alter our `search'` function’s terminating condition\
    \ – we can no longer just finish when the pattern is longer than the remaining\
    \ part of the string – the length of the pattern and the length of the characters\
    \ matching that pattern are no longer always equal. We now continue only when\
    \ the position `n` is less than the length of the string, or it is equal to the\
    \ length of the string and that length is zero (the latter case is required so\
    \ that the pattern `?a` matches the empty string).\n\n> ![](images/00231.jpg)\n\
    \nNow we can alter the `at` function itself. We have an initial terminating condition\
    \ – if the pattern has been used up entirely, we must have matched it. Otherwise,\
    \ we match on the next character in the pattern, to see if the next part of the\
    \ pattern matches and, if it does, calculate `jump_p` (the amount to move forward\
    \ in the pattern) and `jump_s` (the amount to move forward in the string).\n\n\
    > ![](images/00236.jpg)\n\nNote the behaviour of the `?` case carefully, with\
    \ regard to its specification – this kind of matching code can be rather subtle.\
    \ To deal with `*` we must have a way of matching zero or more instances of a\
    \ character, moving as far along the string as possible. The function `swallow_all`\
    \ below, given a character `ch`, a string `p` and a position `sp`, returns the\
    \ number of characters which match `ch` starting at `sp`. We can then add a match\
    \ case for the `*` specifier, as shown in Figure [9.1](#index_split_015.html_filepos188284).\n\
    \n* * *\n\n> ![](images/00242.jpg)\n\n> Figure 9.1:\n\n* * *\n\nThe `+` character\
    \ can be added with `swallow_all` too, but we must check that there is at least\
    \ one matching character. Figure [9.2](#index_split_015.html_filepos189225) shows\
    \ the whole program in one place.\n\n* * *\n\n> ![](images/00247.jpg)\n\n> Figure 9.2:\n\
    \n* * *\n\nQuestions\n\n1.  Write a function to return the number of matches of\
    \ one string in another a) when all matches are considered and b) when only non-overlapping\
    \ matches are considered.\n\n2.  Write functions which return the position and\
    \ length of the longest prefix of a string in another. That is to say, the longest\
    \ initial part of the pattern which matches anywhere in the string.\n\n3.  Compare\
    \ the speed of the first two versions of `search` given in this chapter."
