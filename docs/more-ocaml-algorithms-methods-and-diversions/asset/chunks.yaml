    \ Pull the list representing the old permutation apart, and rearrange it until\
    \ you have the next.\n\n# Making Sets\n\n### 1\nIn the documentation for the `Gc`\
    \ module, you will find the function `Gc.counters` and a description of how to\
    \ calculate the total amount of memory allocated since the program began.\n\n\
    ### 2\nAdd a `union` function to the signature, with the type `α t → α t → α t`\
    \ and then a `union` function to the struct for each set representation.\n\n###\
    \ 3\nYou can include the given code inside the structure of the new module. Now,\
    \ you can set the type `t` to be equal to `S.t`, the type of these new sets.\n\
    \n### 4\nAlter the type first. The changes to each function then follow relatively\
    \ easily.\n\n# Playing Games\n\n### 1\nWe already have code to find the number\
    \ of X wins. What are the conditions for a game being drawn?\n\n### 2\nIt is only\
    \ necessary to alter the type tree and the function `next_moves`, and only a little.\
    \ Now we need a function to extract the part of the tree which begins with O in\
    \ the centre slot. Once we have this, simple modifications of our functions for\
    \ counting wins and draws will do the job.\n\n### 3\nThere is no need to worry\
    \ about the order of the numbers in the square – the tree will have the same essential\
    \ characteristics regardless.\n\n# Representing Documents\n\n### 3\nA structure\
    \ built from nested dictionaries would be suitable.\n\n### 4\nConsider everywhere\
    \ a dictionary entry might appear. The function or functions will be recursive,\
    \ following the general pattern of the data structure.\n\n# Writing Documents\n\
    \n### 1\nRemoving the space at the end is simple. How can we detect if we are\
    \ about to output the first item, and thus do not want a space?\n\n### 2\nRemember\
    \ to alter the `/Size` entry, and to change `/Indirect` entries as required to\
    \ reflect the new structure.\n\n### 3\nFor the content stream in the “Hello, World!”\
    \ file, one long row is sufficient. However, when encoding other example content\
    \ streams, consult the PDF specification to ensure the file is still valid. To\
    \ test, open in your favourite PDF reader.\n\n# Pretty Pictures\n\n### 1\nWe need\
    \ to generate a set of points on the circle, and then they can be built into a\
    \ path with `Move`, `Line`, and `Close`. This path can then be used with `Fill`\
    \ to build the final page content.\n\n### 2\nFirst write a function to generate\
    \ a path for a pseudo-random circle using a function we have previously written.\
    \ Now `FillColour` and `Fill` can be added for each one, and the final list of\
    \ operators produced.\n\n### 3\nWe add `FillColourRGB` and `StrokeColourRGB` items\
    \ to the data type and its associated functions. Then we can substitute them into\
    \ the previous answer.\n\n# Adding Text\n\n### 1\nYou need to alter `typeset_line_at`,\
    \ `clean_lines`, and `downfrom` once you have defined the new values.\n\n### 2\n\
    Try just adding eight space characters after each new line in `lines_inner`.\n\
    \n### 3\nIf there are `n` characters, we must insert `n - 1` pieces of space between\
    \ them, each of equal size.\n\n### 4\nTo make the construction of the multipage\
    \ document simpler, consider choosing carefully the order (and hence numbering)\
    \ of the objects in the file.\n\n# Coping with Errors\n\nIt is very hard to write\
    \ even small programs correctly the first time. An unfortunate but inevitable\
    \ part of programming is the location and fixing of mistakes. OCaml has a range\
    \ of messages to help you with this process.\n\nHere are descriptions of the common\
    \ messages OCaml prints when a program cannot be accepted or when running it causes\
    \ a problem (a so-called “run-time error”). We also describe warnings OCaml prints\
    \ to alert the programmer to a program which, though it can be accepted for evaluation,\
    \ might contain mistakes.\n\n## ERRORS\n\nThese are messages printed when an expression\
    \ could not be accepted for evaluation, due to being malformed in some way. No\
    \ evaluation is attempted. You must fix the expression and try again.\n\n### Syntax\
    \ error\nThis error occurs when OCaml finds that the program text contains things\
    \ which are not valid words (such as `if`, `let` etc.) or other basic parts of\
    \ the language, or when they exist in invalid combinations – this is known as\
    \ syntax. Check carefully and try again.\n\n```ocaml\n         OCaml\n#1 +`;;;\n\
    Error: syntax error\n```\nOCaml has underlined where it thinks the error is. Since\
    \ this error occurs for a wide range of different mistakes and problems, the underlining\
    \ may not pinpoint the exact position of your mistake.\n\n### Unbound value …\n\
    This error occurs when you have mentioned a name which has not been defined (technically\
    \ “bound to a value”). This might happen if you have mistyped the name.\n\n```ocaml\n\
    \         OCaml\n# x + 1;;\nError: Unbound value x\n```\nIn our example `x` is\
    \ not defined, so it has been underlined.\n\n### This expression has type … but\
    \ an expression was expected of type …\nYou will see this error very frequently.\
    \ It occurs when the expression’s syntax is correct (i.e. it is made up of valid\
    \ words and constructs), and OCaml has moved on to type-checking the expression\
    \ prior to evaluation. If there is a problem with type-checking, OCaml shows you\
    \ where a mismatch between the expected and actual type occurred.\n\n```ocaml\n\
    \         OCaml\n# 1 + true;;\nError: This expression has type bool but an expression\
    \ was expected of type int\n```\nIn this example, OCaml is looking for an integer\
    \ on the right side of `+`, and finds something of `bool`. It is not as easy to\
    \ spot the real source of the problem, especially if the function is recursive.\
    \ Nevertheless, a careful look at the program will often shine light on the problem.\n\
    \n### This function is applied to many arguments\nExactly what it says. The function\
    \ name is underlined.\n\n```ocaml\n         OCaml\n# let rec f x = 1 + f (x +\
    \ 1);;\nval f : int -> int = <fun>\n# f y;;\nError: This function is applied to\
    \ many arguments; maybe you forgot ';'\n```\nThe phrase “maybe you forgot a ‘;\
    \ ” applies to imperative programs where accidently missing out ‘;’ between successive\
    \ applications might commonly lead to this error.\n\n### Unbound constructor …\n\
    This occurs when a constructor name is used which is not defined.\n\n```ocaml\n\
    \         OCaml\n# type t = Roof | Wall | Floor;;\ntype t = Roof | Wall | Floor\n\
    # Window;;\nError: Unbound constructor Window\n```\nOCaml knows it is a constructor\
    \ name because it has an initial letter.\n\n### The constructor … expects … argument(s),\
    \ but is applied here to … argument(s)\nThis error occurs when the wrong kind\
    \ of data is given to a constructor for a type. It is just another type error,\
    \ but we get a specialized message.\n\n```ocaml\n         OCaml\n# type p = A\
    \ of int | B of bool;;\ntype p = A of int | B of bool\n# A;;\nError: The constructor\
    \ A expects 1 argument(s), but is applied here to 0 argument(s)\n```\n\n## RUN-TIME\
    \ ERRORS\n\nIn any programming language powerful enough to be of use, some errors\
    \ cannot be detected before attempting evaluation of an expression (until “run-time”).\
    \ The exception mechanism is for handling and recovering from these kinds of problems.\n\
    \n### Stack overflow during evaluation (looping recursion?)\nThis occurs if the\
    \ function builds up a working expression which is too big. This might occur if\
    \ the function is never going to stop because of a programming error, or if the\
    \ argument is just too big.\n\n```ocaml\n         OCaml\n# let rec f x = 1 + f\
    \ (x + 1);;\nval f : int -> int = <fun>\n# f 0;;\nStack overflow during evaluation\
    \ (looping recursion?).\n```\nFind the cause of the unbounded recursion, and try\
    \ again. If it is really not a mistake, rewrite the function to use an accumulating\
    \ argument (and so, to be tail recursive).\n\n### Exception: Match_failure …\n\
    This occurs when a pattern match cannot find anything to match against. You would\
    \ have been warned about this possibility when the program was originally entered.\
    \ For example, if the following function `f` were defined as\n\n```ocaml\nlet\
    \ f x = match x with 0 -> 1\n```\n"
