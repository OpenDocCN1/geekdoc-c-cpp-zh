    \n`        OCaml`\n\n`# let x = ref 0;;`\n\n`- : int ref = { contents = 0 }`\n\
    \nHere, the type ref is defined by `type 'a ref = {mutable contents : 'a}` and\
    \ the constructor function `ref` is of type α → α ref. The value of a mutable\
    \ field can be updated using the `<-` symbol like this:\n\n`        OCaml`\n\n\
    `# type 'a point = {x : float; y : float; label : string; mutable content : 'a};;`\n\
    \n`type 'a point = {`\n\n`  x : float;`\n\n`  y : float;`\n\n`  label : string;`\n\
    \n`  mutable content : 'a;`\n\n`}`\n\n`# let p = {x = 4.5; y = 6.0; label = \"\
    P\"; content = [1; 3; 1]};;`\n\n`val p : int list point = {x = 4.5; y = 6.; label = \"\
    P\"; content = [1; 3; 1]}`\n\n`# p.content <- [1];;`\n\n`- : unit = ()`\n\n`# p;;`\n\
    \n`- : int list point = {x = 4.5; y = 6.; label = \"P\"; content = [1]}`\n\nSuch\
    \ records should be used with care, like any mutable feature, especially if they\
    \ are likely to be used as part of a larger data structure.\n\nQuestions\n\n1.\
    \  Show how to update a reference without using the `:=` operator.\n\n2.  Using\
    \ functions from the “Time Functions” section of the documentation to the Unix\
    \ module, write a program which, when run, returns a string containing the time\
    \ and date, for example `\"It` `is 2:45 on Wednesday 8 January 2014\"`.\n\n3.\
    \  What is the difference between `type t = {x : int ref}` and `type t = {mutable\
    \ x : int}`? What are the advantages and disadvantages of each?\n\n4.  Define\
    \ a record of six items a...f where a and b have the same type as one another,\
    \ c and d have the same type as one another and e and f have the same type as\
    \ one another.\n\n5.  Records are used in the module Gc which controls OCaml’s\
    \ garbage collector (a garbage collector is a system which automatically reclaims\
    \ space the program has finished with as the program is running). Use the data\
    \ structures and functions in the Gc module to write programs which:\n\n    1.\
    \  write a summary of the state of the garbage collector to a text file; and\n\
    \n    2.  alter the verbosity of the garbage collector as defined in the `control`\
    \ record.\n\nChapter 4\n\nGeneralized Input/Output\n\nIn Pervasives, OCaml’s default\
    \ always-opened module, a number of functions are defined over input and output\
    \ channels – representing both files in the file system and special ones such\
    \ as standard output. However, it is often useful to have a more general abstraction\
    \ of input and output over, for example, strings and arrays, as well as files\
    \ and channels.\n\nIn this chapter, we shall develop such an abstraction, giving\
    \ input and output types which work with OCaml channels and strings. It can be\
    \ extended to work over other data structures, and to have more complete functionality\
    \ – some of the questions at the end of the chapter involve such extensions.\n\
    \nA type for inputs\n\nThe fundamental operations on an input, once it has been\
    \ created, will be:\n\n*   finding the current position;\n\n*   setting the current\
    \ position;\n\n*   reading a character, at the same time advancing the position;\n\
    \n*   finding the length of an input.\n\nWe need a way to group them together,\
    \ and to refer to them easily. A record is ideal:\n\n`type input =`\n\n`     {pos_in\
    \ : unit -> int;`\n\n`      seek_in : int -> unit;`\n\n`      input_char : unit\
    \ -> char;`\n\n`      in_channel_length : int}`\n\nNow we can build an input from\
    \ an OCaml in_channel easily (we have re-used some of the standard OCaml names):\n\
    \n> ![](images/00104.jpg)\n\nNotice that the original channel is now hidden inside\
    \ the input – the functions `pos_in` and `input_char` instead simply take the\
    \ unit `()` as their input. Let us assure ourselves that this structure also works\
    \ for abstracting over strings:\n\n> ![](images/00107.jpg)\n\nWe allocate a local\
    \ reference, `pos`, to hold the current position. It cannot be accessed directly,\
    \ only manipulated through the exposed record of functions. The `pos_in` and `in_channel_length`\
    \ functions are simple. The `seek_in` function needs to check that the position\
    \ is positive, but we allow it to be beyond the end, for compatibility with OCaml\
    \ channels. The `input_char` function checks it is not trying to read beyond the\
    \ end of the string, then reads a character, advances the position, and returns\
    \ the character.\n\nNotice we use the same exception scheme as OCaml does in its\
    \ own channels – raising `End_of_file` if a read is attempted beyond the last\
    \ character.\n\nExample: reading words\n\nWe should like to write a program which\
    \ can extract the words from a given input, such as a string or a file. For example,\
    \ given the string\n\n`\"There were four of them; more than before.\"`\n\nwe wish\
    \ to produce\n\n`[\"there\"; \"were\"; \"four\"; \"of\"; \"them\"; \"more\"; \"\
    than\"; \"before\"]`\n\nremoving spaces, punctuation and making the words lower\
    \ case. First, let us define a function to rewind the input by one character (useful\
    \ when we have read a character and decided we do not wish to consume it), and\
