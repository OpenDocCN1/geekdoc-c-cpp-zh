    ## Preface


    When I wrote “OCaml from the Very Beginning”, the intention was to have a book
    with no prerequisites – a bright individual, new to programming, could follow
    it. Because of this, and for length concerns, plenty of interesting material had
    to be omitted. This text, not being constrained in the same way, contains a variety
    of topics which require some existing experience with a functional language. Those
    who have read the previous text should have no problem with this one. Equally,
    it should be comprehensible to a functional programmer familiar with another language
    such as Standard ML or Haskell. The reader may need to make occasional reference
    to the OCaml manual.


    There are, typically, two different activities when writing programs larger than
    a few dozen lines: firstly, dealing with the challenges of complexity inherent
    in the problem, by finding appropriate abstraction mechanisms and, secondly, finding
    and using the wide range of third-party libraries available for a given language.
    Most projects involve a combination of the two. In this text we concentrate wholly
    on the former. Some material.


    ## Acknowledgments


    I am grateful to many colleagues and friends: Mark Shinwell, Leo White, Daniel
