    For decompression, we will write two functions for reading white and black codes.
    It is easiest to directly encode the decision tree:


    > ![](images/00162.jpg)


    Now, decoding is relatively simple. We decode runs for each line, until the width
    is all used up, and do this for each line. We read white and black codes alternately
    – each line begins on white. We can use `process` again:


    > ![](images/00189.jpg)


    We can verify our code by evaluating `s = decompress_string_ccitt (compress_string_ccitt
    s)` for our example data.


    Questions


    1.  How much complexity did using the input and output types add to `compress`
    and `decompress` in our byte-by-byte example? Rewrite the functions so they just
    operate over lists of integers, in functional style, and compare the two.


    2.  Replace our manual tree of codes with a tree automatically generated from
    the lists of codes used for compression. The tree will have no data at its branches
    (since no code is a prefix of another), and will have data at only some of its
    leaves. Define a suitable data type first.


    3.  What happens if we compress our data as a single line of 1680 bits instead
    of 21 lines of 80? What happens if we try to compress already-compressed data?


    4.  Write a function which, given input data, will calculate a histogram of the
    frequencies of different runs of white and black. This could be used to build
    custom codes for each image, improving compression.


    Chapter 7


    Labelled and Optional Arguments


    OCaml allows us to label some or all of the arguments to a function, so as to
    provide a little documentation, to prevent us from accidently swapping two arguments
    which have the same type, and to allow partial application of arguments more flexibly.
    Consider a function to fill in part of an array with an element:


    > ![](images/00215.jpg)


    The `fill` function takes four arguments: the array itself, the start position,
    length of the fill and the element to use to fill. However, since the start and
    length are both integers, it is easy to get them the wrong way round. This can
    be remedied by giving those two arguments labels. A label is introduced by a tilde,
    followed by the label name, a colon and the argument name itself. Consider the
    functions `fill` and `filled` below. As you can see, we have defined `fill` with
    labels, which appear in the type as well. In the first `filled` function, we call
    the `fill` function, citing the labels and giving immediate integers. In the second,
    we show that it works with other names (as it does, indeed, for any expression).
    In the third, we show that the labelled arguments may be permuted and rearranged
    with regard to the other arguments (unlabelled arguments must remain in the correct
    order relative to one another).


    > ![](images/00234.jpg)


    Another change we can make is to use the label for the name of the argument inside
    the function too. This simplifies the syntax: we can just write `~label`.


    > ![](images/00083.jpg)


    You can see that in `filled`, this “punning” works equally well when calling the
    function, if we happen to have values with the same names. These two facilities
    need not be used together, of course.


