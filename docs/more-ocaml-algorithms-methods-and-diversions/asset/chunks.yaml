    \ list of bits from a byte, and use that for each byte in the stream, building\
    \ a final list. This has two disadvantages: it is inefficient in space and time\
    \ (there are eight times as many bits as bytes, of course), and itthis has two\
    \ disadvantages: it is inefficient in space and time (there are eight times as\
