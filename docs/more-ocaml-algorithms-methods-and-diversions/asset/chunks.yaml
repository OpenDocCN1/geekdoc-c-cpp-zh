    ## 前言


    当我写《OCaml from the Very Beginning》时，我的意图是写一本不需要先备知识的书——让一个对编程陌生的聪明个体也能读懂。由于这个原因，加上对长度的考虑，许多有趣的材料被省略了。而本书没有受到同样的限制，包含了若干需要一定函数式语言经验的话题。读过前一本书的人读这本书应该没有问题。同样，对于熟悉
    Standard ML 或 Haskell 等其他语言的函数式程序员来说，它也是理解的。读者可能需要偶尔查阅 OCaml 手册。


    在编写超过几十行的程序时，通常会有两种不同的活动：首先，通过寻找合适的抽象机制来应对问题固有的复杂性挑战；其次，寻找并使用特定语言提供的各种第三方库。大多数项目都涉及这两者的结合。在本书中，我们完全专注于前者。部分内容。


    ## 致谢


    我感谢许多同事和朋友：Mark Shinwell, Leo White, Daniel Madhav, Stefan Schmied, Manuel Cornes,
    Giannis Tsarai, Emmanuel Delorde, Jonas Bülow, Emmanuel Alvarez, Stefan Cornes,
    Chris Paulson, Peter Schumer, Andrew Shinwell, Emmanuel Bjärby 等。Stefan Cornes
    为早期草稿提供了帮助建议。第 3 章中 OCaml 的总结归于 University Press，2014。第 11 章归于 Chris Okasaki 的《Purely
    Data Structures》（Cambridge University Press, 1998）。第 12 章受到 David Miller 在《Mathematical
    Journeys》（John Wiley & Sons, 978-07166352）中的启发。


    ## 基础 OCaml 总结


    本章包含了书中使用的每个 OCaml 构造总结以及一些示例。本章未包含的现有 OCaml 语法将在出现时介绍。


    ### 简单数据类型


    整数 `min_int` ... of int。布尔值 `true` 和 `false` of bool。类型为 char 的字符如 `''X''`。


    数学运算符 `+ - * / mod` 接收两个整数并返回另一个。


    ```

    ![](img/0068.jpg)

    ```


    运算符 `= <= > >= <>` 比较两个值并评估为 `true` 或 `false`。


    ```

    ![](img/0125.jpg)

    ```


    条件表达式 `if expression1 `then` expression2 `else expression3`，其中 `expression1` 的类型为
    bool，且 `expression2` 和 `expression3` 的类型相同。


    ```

    ![](img/0146.jpg)

    ```


    布尔运算符 `&&`（逻辑与）和 `||`（逻辑或）允许我们构建复合布尔表达式。


    ```

    ![](img/0243.jpg)

    ```


    元组用于组合固定数量的元素 `(a, b)`, `(a, b, c)` 等，类型为 α × β, α × β × γ 等。例如，`(1, ''1'')` 是类型为
    int × char 的元组。在屏幕上，OCaml 使用 `''a` 表示 α 等。


    字符串是写在双引号之间的字符序列，类型为 string。例如，`"one"` 的类型为 string。


    ## 命名与函数


    使用 `let name = expression` 构造为表达式求值结果命名。


    ```ocaml

    let x = 5 > 2

    ```

    x 是新的，且值为 `false`


    使用 `let name1 = expression1 in let name2 = expression2 in ...` 构建复合表达式。


    ```ocaml

    let x = 4 in let y = 5 in x + y

    ```


    匿名（未命名）函数 `fun name -> expression`。


    ```

    ![](img/0095.jpg)

    ```


    将运算符转换为函数，如 `( < )` 和 `( + )`。


    ```ocaml

    ( + ) 1 2

    ```

    ![](img/00227.jpg)3


