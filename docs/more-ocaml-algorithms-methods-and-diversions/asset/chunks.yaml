    事实上，OCaml 的引用类型（reference type）只是一个带有单个可变字段的记录（record）：


    ```

    OCaml

    # let x = ref 0;;

    - : int ref = { contents = 0 }

    ```


    在这里，类型 `ref` 定义为 `type ''a ref = {mutable contents : ''a}`，构造函数 `ref` 的类型为 `α
    → α ref`。可变字段的值可以使用 `<-` 符号进行更新，如下：


    ```OCaml

    type ''a ref = {mutable contents : ''a}

    let ref (x : ''a) = {contents = x}

    let ! (r : ''a ref) : ''a = r.contents

    let := (r : ''a ref) (x : ''a) = r.contents := x


    # let x = ref 0;;

    - : int ref = { contents = 0 }

    # x := 1;;

    # !x

    - : int = 1

    ```

