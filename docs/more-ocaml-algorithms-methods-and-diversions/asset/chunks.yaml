  trans: "\n\n```ml\nlet text_width = page_width -. margin -. margin\nlet max_chars\
    \ = int_of_float (text_width /. font_size *. (5. /. 3))\n```\n\n我们现在可以将这些新名称插入到\
    \ `typeset_line_at` 中：\n\n```ml\nPdfpage.SetTextPosition (margin, y);\nPdfpage.SetFontAndSize\
    \ (\"/F0\", font_size);\n```\n\n我们将 `max_chars` 传递给 `clean_lines` 并修改对 `downfrom`\
    \ 的调用：\n\n```ml\nlet ls = clean_lines (lines max_chars words) in\ndownfrom\n \
    \ (font_size *. line_spacing)\n  (page_height -. margin -. line_spacing) (List.length\
    \ ls) 0\n```\n\n这是一个新程序的示例，文本在一个小得多的页面上进行排版（当然，它会溢出底部）：\n\n![](img/00062.jpg)\n\
    \n### 2\n\n我们可以通过在 `lines_inner` 的缓冲区中于每个换行符后手动插入空格字符来实现这一点（即在第二个及后续段落的开头）。这如图\
    \ A.5 所示。\n\n***\n\n> ![](img/00115.jpg)\n> 图 A.5:\n\n***\n\n注意 `lines` 中可选参数的使用。我们现在可以修改\
    \ `typeset_page` 中的某行：\n\n```ml\nlet ls = clean_lines (lines max_chars ~indent:8\
    \ words) in\n```\n\n结果如图 A.6 所示。\n\n***\n\n> ![](img/00288.jpg)\n> 图 A.6:\n\n\
    ***\n\n### 3\n\n页面高度可以很容易地计算：\n\n```ml\nlet text_height = page_height -. margin\
    \ -. margin\n```\n\n现在，我们可以在 `typeset_line_at` 中使用 `Pdfpage.SetCharacterSpacing`，添加一个额外的间距参数：\n\
    \n> ![](img/00282.jpg)\n\n间距是按规定计算的，但仅针对 `Full` 行：\n\n> ![](img/00128.jpg)\n\n\
    在修改后的 `typeset_page` 中，我们可以计算正确的间距，并将它们传递给 `typeset_line_at`：\n\n> ![](img/00262.jpg)\n\
    \n这是一个示例页面。你可以看到行是完全对齐的——紧贴左右页边距。\n\n![](img/00033.jpg)\n\n### 4\n\n这个问题的答案太长，无法包含在文中。请参考在线资源获取程序本身。多页输出示例如图\
    \ A.7 所示。\n\n***\n\n![](img/00187.jpg) ![](img/00290.jpg)\n\n![](img/00097.jpg)\
    \ ![](img/00196.jpg)\n\n![](img/00207.jpg)\n> 图 A.7:\n\n***\n\n## 问题提示\n\n###\
    \ 1. 解析“折 (Fold)”\n\n1. 累加器必须从什么开始？我们每次必须执行什么操作？考虑文中的 `sum` 函数作为起点。\n2. 我们需要忽略每个元素，在看到每个元素时仅累加器加\
    \ 1。累加器的最终值将是列表的长度。累加器的初始值是什么？\n3. 处理空列表没有最后一个元素的一个良好方法是返回一个可选类型（option type））。\n\
    4. 这类产生列表的折叠其累加器是一个列表类型——你可以从空列表开始。\n5. 类型将与 `List.mem` 相同。我们如何跟踪是否已经看到了匹配的元素？累加器的初始值是什么？\n\
    6. 这将涉及一个字符串累加器和字符串拼接运算符。如何确保句子前后没有多余的空格？\n7. 内置的 `max` 运算符返回两个值中较大的一个。\n8. 你可以使用标准库函数\
    \ `Unix.gettimeofday` 来帮助为函数计时。\n\n### 2. 懒性计算 (Being Lazy)\n\n1. 这与文中的 `lseq`\
    \ 非常相似。\n2. 类比普通列表上的相同函数来构造。记住需要强制求值（force evaluation）才能获取尾（tail）。\n3. 我们如何知道何时到达输入列表的末尾并必须重新开始？如果输入列表为空我们该怎么办？\n\
    4. 考虑斐波那契数列的定义。将其拆分为两个函数：一个根据给定的数字构建懒性列表，另一个是列表本身的构造。\n5. 函数的类型将是 `α lazylist\
    \ → α lazylist × α lazylist`。你需要两次强制输入列表尾部的求值以产生两个输出列表的头部，然后研究如何产生尾部。\n6. 写一个从数字构建字母字符串的函数。然后可以使用文中的一些通用懒性列表处理函数来构建懒性列表本身。\n\
    \n### 3. 带有记录的命名元组\n\n1. 引用（reference）到底是什么？\n2. 查看 `Unix.time` 和 `Unix.localtime`\
    \ 函数。你需要自己处理星期和月份从整数到字符串的转换，但这并不难。\n4. 记录可以被参数化，就像其他类型一样。\n5. 考虑 a) `Gc.stat`\
    \ 和 b) `Gc.get`。\n\n### 4. 通用输入输出\n\n1. `input_string` 的简单修改。\n2. 使用 `Buffer`\
    \ 累加部分。\n3. 新字段类型为 `unit`。\n\n### 5. 位流 (Streams of Bits)\n\n1. 读取整个字节的测试是什么？如果满足条件我们该怎么办？\n\
    2. 将整数函数替换为 Int32 模块中的函数。\n3. 写入整个字节的测试是什么？如果不满足怎么办？\n\n### 6. 数据压缩\n\n1. 对表示数据的整数列表进行列表处理。为了测试，重用\
    \ `int_list_of_string` 和 `string_of_list`。\n2. 定义一个合适的树类型——因为没有任何代码是另一个的前缀。写一个向树添加代码的函数。现在可以构建整个树。\n\
    4. 建立两个直方图——一个用于白色，一个用于黑色。\n\n### 7. 标签与可选参数\n\n1. 考虑 `α` 为 `int` 时会发生什么。\n3.\
    \ 考虑哪些函数具有多个类型相同的参数。我们可以只对这些添加标签并封装函数。\n4. 我们可以为累加器使用可选参数。\n\n### 8. 格式化打印\n\n\
    1. 考虑使用 `Printf.bprint` 作为累加部分的方法。最后一个元素有什么特殊之处？如果没有最后一个元素怎么办？\n2. 有一个用于十六进制的格式说明符。考虑小字符代码的情况。\n\
    \n### 9. 搜索内容\n\n1. 章中的 `at` 函数可以复用，用于问题的两个部分。\n2. 先写一个返回模式在列表开头的最长前缀长度的函数。将其封装在另一个遍历整个列表的函数中。\n\
    3. 表达式 `Unix.gettimeofday()` 给出一个浮点数。\n4. 在内部匹配中添加一个分支。它必须手动检查模式中的下一个字母是否匹配字符串中的下一个字母（如果存在）。\n\
    5. 这不需要修改搜索代码本身——只需对模式和字符串进行预处理。标准库中有 `String.uppercase` 函数。\n\n### 10. 寻找排列\n\
    \n1. 基础情况是什么？对于主情况，首先通过递归计算尾部的组合。现在你可以做什么？\n2. 你可以从已经写的函数开始构建它。\n3. 基础情况是什么？你需要一个计数器来确保只生成给定长度的列表。\n\
