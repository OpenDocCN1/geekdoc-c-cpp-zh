    # More OCaml 算法、方法与趣闻


    在《More OCaml》中，John Whitington 带领读者通过 OCaml 进行了一场函数式编程的漫游之旅，介绍了各种语言特性并描述了一些经典算法。本书以一个处理
    PDF 文件生成的庞型示例结束。每章都包含问题，并附有详细答案和提示。


    《More OCaml》既能吸引那些希望提高技能的现有 OCaml 程序员，也能吸引渴望探索 OCaml 等函数式语言的资深程序员。希望每位读者都能发现一些新东西，或者以全新的视角看待旧事物。对于更随性的读者或习惯了其他函数式语言的人来说，书的开头提供了基础
    OCaml 的总结。


    JOHN WHITINGTON 创立了一家广泛使用 OCaml 的软件公司。他在剑桥大学为计算机系的学生教授函数式编程。他的其他书籍包括《PDF Explained》（O’Reilly,
    2012）和《OCaml from the Very Beginning》（Coherent, 2013）。


