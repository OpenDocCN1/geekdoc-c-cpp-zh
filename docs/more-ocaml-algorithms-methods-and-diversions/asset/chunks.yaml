  trans: "\n不要使用索引来表示“第一个”和“最后一个”，而是使用值本身。将代表旧排列的列表拆开，并重新排列它，直到你得到下一个。\n\n# 创建集合\n\
    \n### 1\n在 `Gc` 模块的文档中，你会找到 `Gc.counters` 函数以及关于如何计算自程序启动以来分配的内存总量的描述。\n\n###\
    \ 2\n在签名中添加一个类型为 `α t → α t → α t` 的 `union` 函数，然后为每种集合表示在结构体中添加一个 `union` 函数。\n\
    \n### 3\n你可以将给的代码包含在新模块的结构中。现在，你可以将类型 `t` 设置为 `S.t`，即这些新集合的类型。\n\n### 4\n先修改类型。然后对每个函数的修改就会相对容易跟随。\n\
    \n# 玩游戏\n\n### 1\n我们已经有了查找 X 获胜次数的代码。游戏平局的条件是什么？\n\n### 2\n只需要修改类型树和 `next_moves`\
    \ 函数，而且只需要修改一点点。现在我们需要一个函数来提取树中以中间位置的 O 开头的部分。一旦我们有了这个，只需对计算获胜和和平局的函数进行简单修改即可完成。\n\
    \n### 3\n不需要担心格子中数字的顺序——无论如何，树都具有相同的本质特征。\n\n# 表示文档\n\n### 3\n一个由嵌套字典构建的结构将体。\n\
    \n### 4\n考虑字典项可能出现的地方。该函数或函数将是递归的，遵循数据结构的通用模式。\n\n# 编写文档\n\n### 1\n删除末尾的空格很简单。我们如何检测是否即将输出第一个项目，因此不需要空格？\n\
    \n### 2\n记得修改 `/Size` 条目，并根据需要更改 `/Indirect` 条目以反映新结构。\n\n### 3\n对于“Hello, World!”文件中的内容流，一行长文本即可。然而，在编码其他示例内容流时，请咨询\
    \ PDF 规范以确保文件仍然有效。要进行测试，请在你喜欢的 PDF 阅读器中打开。\n\n### 精美图片\n\n### 1\n我们需要在圆上生成一组点，然后可以使用\
    \ `Move`、`Line` 和 `Close` 将它们构建成路径。然后可以使用 `Fill` 使用此路径构建最终的页面内容。\n\n### 2\n首先编写一个函数，使用我们之前编写的函数为伪随机圆生成路径。现在可以为每个圆添加\
    \ `FillColour` 和 `Fill`，产生最终的运算符列表。\n\n### 3\n我们在数据类型及其关联函数中添加 `FillColourRGB`\
    \ 和 `StrokeColourRGB` 项。然后我们可以将它们替换到上一个答案中。\n\n# 添加文本\n\n### 1\n一旦定义了新值，你需要修改\
    \ `typeset_line_at`、`clean_lines` 和 `downfrom`。\n\n### 2\n尝试在 `lines_inner` 的每个新行之后添加八个空格字符。\n\
    \n### 3\n如果有 `n` 个字符，我们必须在它们之间插入 `n - 1` 个等大的空格。\n\n### 4\n为了使多页文档的构建更简单，考虑仔细选择文件中对象的顺序（以及相应的编号）。\n\
    \n# 处理错误\n\n第一次正确编写即使是很小的程序是非常困难的。编程中一个不幸但不可避免的部分是定位和修复错误。OCaml 有了一系列消息来帮助你完成这个过程。\n\
    \n以下是 OCaml 在程序无法被接受或运行时引起问题（所谓的“运行时错误”）时打印的常见消息描述。我们还描述了 OCaml 打印的警告，提醒程序员程序虽然可以接受评估，但可能包含错误。\n\
    \n## 错误 (ERRORS)\n\n这些是在表达式由于某种格式错误而无法被接受评估时打印的消息。不会尝试评估。你必须修复表达式并重试。\n\n### 语法错误\
    \ (Syntax error)\n当 OCaml 发现程序文本包含不是有效单词（如 `if`、`let` 等）或其他语言的其他基本部分，或者它们以无效组合存在时，就会发生此错误——这被称为语法。仔细检查并重试。\n\
    \n```ocaml\n         OCaml\n#1 +`;;;\nError: syntax error\n```\nOCaml 标记了它认为错误发生的地方。由于此错误由许多不同的错误和问题引起，下划线可能无法精确指示你错误的准确位置。\n\
    \n### 未绑定的值 … (Unbound value …)\n当你提到一个未定义（技术上“未绑定到值”）的名称时就会发生此错误。这可能是因为你拼错了名称。\n\
    \n```ocaml\n         OCaml\n# x + 1;;\nError: Unbound value x\n```\n在我们的示例中 `x`\
    \ 未定义，因此它被标记了。\n\n### 此表达式的类型为 … 但期望的类型为 … 的表达式 (This expression has type … but\
    \ an expression was expected of type …)\n你会频繁地看到此错误。它发生在表达式语法是正确的（即它由有效的单词和结构组成），并且\
    \ OCaml 在评估之前已对表达式进行了类型检查。如果类型检查出现问题，OCaml 向你显示预期类型和实际类型之间发生不匹配的地方。\n\n```ocaml\n\
    \         OCaml\n# 1 + true;;\nError: This expression has type bool but an expression\
    \ was expected of type int\n```\n在这个示例中，OCaml 在 `+` 的右侧寻找整数，但发现的是 `bool`。如果函数是递归的，发现问题的源头并不。如此，仔细查看程序通常会说明问题。\n\
    \n### 此函数应用于多个参数 (This function is applied to many arguments)\n如字所言。函数名被标记了。\n\
    \n```ocaml\n         OCaml\n# let rec f x = 1 + f (x + 1);;\nval f : int -> int\
    \ = <fun>\n# f y;;\nError: This function is applied to many arguments; maybe you\
    \ forgot ';'\n```\n“可能你忘了 ';' ” 这适用于连续调用中意外漏掉 ‘’ 导致此类错误。\n\n### 未绑定的构造函数 … (Unbound\
    \ constructor …)\n当使用了未定义的构造函数名称时发生此错误。\n\n```ocaml\n         OCaml\n# type t\
    \ = Roof | Wall | Floor;;\ntype t = Roof | Wall | Floor\n# Window;;\nError: Unbound\
    \ constructor Window\n```\nOCaml 知道这是一个构造函数名称因为它大写字母开头。\n\n### 构造函数 …期望 … 参数但在此处应用于\
    \ … 参数 (The constructor … expects … argument(s), but is applied here to … argument(s))\n\
    当构造函数提供了错误类型的数据时就会发生此错误。这只是另一个类型错误，但我们得到了特定的消息。\n\n```ocaml\n         OCaml\n\
    # type p = A of int | B of bool;;\ntype p = A of int | B of bool\n# A;;\nError:\
    \ The constructor A expects 1 argument(s), but is applied here to 0 argument(s)\n\
    ```\n\n## 运行时错误 (RUN-TIME ERRORS)\n\n在任何足够强大的编程语言中，某些错误在尝试评估表达式之前无法检测到（直到“运行时”）。异常机制用于处理和从这类问题中恢复。\n\
    \n### 评估期间栈溢出（循环递归？） (Stack overflow during evaluation)\n当函数构建了一个过大的表达式时就会发生这种情况。这可能是由于编程错误导致函数永远不会停止，或者参数太大。\n\
    \n```ocaml\n         OCaml\n# let rec f x = 1 + f (x + 1);;\nval f : int -> int\
    \ = <fun>\n# f 0;;\nStack overflow during evaluation (looping recursion?).\n```\n\
    找到无限递归的原因并重试。如果这真的不是错误，重写函数以使用累加参数（因此，变为尾递归）。\n\n### 异常：匹配失败 … (Exception: Match_failure\
    \ …)\n当模式匹配找不到任何可以匹配的对象时发生此错误。在最初输入程序时，你已经被警告过这种可能性。例如，如果定义了以下函数 `f`：\n\n```ocaml\n\
    let f x = match x with 0 -> 1\n```\n\n"
