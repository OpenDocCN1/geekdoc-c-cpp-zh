    Bülow, Emmanuel Alvarez, Stefan Cornes, Chris Paulson, Peter Schumer, Andrew Shinwell,
    Emmanuel Bjärby, and others. Helpful comments on an earlier draft were provided
    by Stefan Cornes. The summary of OCaml in chapter 3 is due to the University Press,2014.
    Chapter 11 is due to Chris Okasaki in “Purely Data Structures” (Cambridge University
    Press, 1998). Chapter 12 was inspired by David Miller in “Mathematical Journeys”
    (John Wiley & Sons, 978-07166352).


    ## Summary of Basic OCaml


    This chapter contains a summary of each OCaml construct used in the book, together
    with some examples. Existing OCaml syntax not contained in this chapter will be
    introduced as when they are.


    ### Simple Data Types


    Integers `min_int` ... of int. Booleans `true` and `false` of bool. Characters
    of type char like `''X''`.


    Mathematical operators `+ - * / mod` which take two integers and give another.


    ```

    ![](images/0068.jpg)

    ```


    Operators `= <= > >= <>` which compare two values and evaluate to either `true`
    or `false`.


    ```

    ![](images/0125.jpg)

    ```


    The conditional `if` expression1 `then` expression2 `else expression3, where expresssion1
    has type bool and expression2 and expression3 have the same type as one another.


    ```

    ![](images/0146.jpg)

    ```


    The boolean operators `&&` (logical AND) and `||` (logical OR) which allow us
    to build compound boolean expressions.


    ```

    ![](images/0243.jpg)

    ```


    Tuples to combine a fixed number of elements `(a, b)`, `(a, b, c)` etc. with types
    α × β, α × β × γ etc. For example, `(1, ''1'')` is a tuple of type int × char.
    On the screen, OCaml writes `''a` for α etc.


    Strings, which are sequences of characters written between double quotes and are
    of type string. For example, `"one"` has type string.


    ## Names and Functions


    Assigning a name to the result of evaluating an expression using the `let name
    = expression` construct.


    ```

    let x = 5 > 2

    ```

    x is new, and is `false`


    Building compound expressions using `let name1 = expression1 in let name2 = expression2
    in ...


    ```

    let x = 4 in let y = 5 in x + y

    ```


    Anonymous (un-named) functions `fun name -> expression`.


    ```

    ![](images/0095.jpg)

    ```


    Making operators into functions as in `( < )` and `( + )`.


    ```

    ( + ) 1 2

    ```

    ![](images/00227.jpg)3

