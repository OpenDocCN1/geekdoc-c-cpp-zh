    \nFinally, we can write `read_word` which finds the next word, if there is one.\
    \ Then `read_words` collects them all in a list, and turns them in to lower case\
    \ using the Standard Library function `String.lowercase`. These functions form\
    \ Figure [4.1](#index_split_010.html_filepos93769). For example:\n\n* * *\n\n\
