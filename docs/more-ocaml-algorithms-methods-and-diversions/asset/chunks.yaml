    \ we will use a list of length nine instead – in other words a `turn` `list`.\n\
    \nWe need to terminate the tree when X has won, O has won, or the board is full.\
    \ Thus we will need to check all the rows, columns, and diagonals. We do not want\
    \ to replicate the logic several times or build a huge pattern match, so it is\
    \ easiest to write a function which takes a list of nine booleans and just checks\
    \ for lines of `true`. We can then use `List.map` on the board itself to build\
    \ these intermediate lists of booleans.\n\n> ![](images/00093.jpg)\n\nWe can number\
    \ the positions in our board:\n\n![](images/00225.jpg)\n\nNow, we can use functions\
    \ from the List module to write a function to return the numbers of the positions\
    \ which are currently empty:\n\n> ![](images/00073.jpg)\n\nThis works by building\
    \ the list of tuples `[(X, 1); (E, 2); (E, 3)` …`(O, 9)]`, filtering out any which\
    \ are not empty, and extracting the list of empty positions `[2, 3` …`]`. It is\
    \ also simple to write a function which, given a board like `[E; E; E; E; X; E;\
    \ O; E; E]`, a turn like `O` and a number such as 8, will fill in the correct\
    \ slot in the board to produce `[E; E; E; E; X; E; O; X; E]`. The `take` and `drop`\
    \ functions from our Util module (described on page xiii) are ideal:\n\n> ![](images/00210.jpg)\n\
    \nOne more simple function is required before we can write the main tree-building\
    \ function, and that is to change whose turn it is:\n\n> ![](images/00053.jpg)"
