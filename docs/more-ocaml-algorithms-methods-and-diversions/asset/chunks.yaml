    Questions


    1.  Factor out the font size, line height, margin height and automatically calculate
    the number of characters in a line (the number of characters in a line can be
    calculated by the formula 5w∕3f where w is the width of a line and f is the font
    size). The program should now work for any page size.


    2.  The first line of each paragraph (save for the first) should be indented by
    eight characters. Implement this.


    3.  Implement full justification. This gives a clean left and right margin except
    for the left margin of the first line in a paragraph and the right margin of the
    last line of a paragraph. This can be done by altering the spacing between characters
    and words. Of course, `Partial` lines should not be stretched.


    4.  Allow the program to generate multiple pages, should the length of the text
    demand it. This can be done by extending the `/Kids` entry in the PDF file, and
    producing multiple page objects.


    Answers to Questions


    Hints may be found on page [309](#index_split_025.html_filepos412178).


    1 (Unravelling “Fold”)


    1


    This can be achieved by folding the subtraction operator over the deductions,
    with the starting accumulator set to the budget:


    > ![](images/00250.jpg)


    Partial application can be used, as in the second definition.


    2


    We can use an accumulator starting at zero, and increment it once for each element
    processed:


    > ![](images/00026.jpg)


    Since we ignore the element itself, the function is polymorphic.


    3


    If the list is empty, we return `None`, otherwise we use a left fold which simply
    replaces the accumulator with each successive element from the list. We must initialize
    the accumulator, so we pick the first element for that (we have already eliminated
    the case where there are no elements, so `List.hd` will succeed).


    > ![](images/00134.jpg)


    Not quite idiomatic.


    4


    If we start from the left, consing each element to the accumulator (which is initially
    the empty list), the list will be reversed.


    > ![](images/00228.jpg)


    Since the accumulator is the empty list (which has type α list), the function
    remains polymorphic, having the type we would expect.


    5


    The accumulator begins set to `false`. For each element, we calculate the logical
    OR of the element tested for equality and the accumulator. If at least one `true`
    occurs, the result will be `true`.


    > ![](images/00036.jpg)


    Note that this is less efficient than `List.mem` because there is no early exit
    – the whole list is processed in every case.


    6


    This is a classic problem. We either need to


    *   add a space after each word except for the last; or


    *   add a space before each word except for the first.


    With `fold_left` we can detect when we are at the first word, by inspecting the
    accumulator, and use the second method.


    > ![](images/00203.jpg)


    Note that the requirement that the words be non-empty is important here. The efficiency
    is poor, however, since each string concatenation builds a new string. The Standard
    Library Buffer module is a better approach here.


    7


    We can use the built-in `max` function to update the accumulator.


    > ![](images/00220.jpg)


    The current element is ignored.


