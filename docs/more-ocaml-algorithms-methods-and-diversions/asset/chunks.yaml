    ` "\"What''s"; "happened"; "to"; "me?\""; "he"; "thought."; "It"; ...]`


    Notice the newline as a word on its own. Our next task is to break this sequence
    of words into lines of a given width. We will have two kinds of line. A `Full`
    line is one we had to break at the end of. A `Partial` line is one which ended
    because of a newline or end-of-input. In our first example, we will not need to
    distinguish these two, but when it comes to justification and more advanced examples,
    it will be invaluable. The type is trivial:


    `type line =`


    `     Full of string`


    `   | Partial of string`


    Now the line breaking function. The function `lines` takes a maximum width in
    characters, and a list of words, and returns a line list. There are three cases
    in the `lines_inner` function:


    1.  If we have reached the end of the list of words, return the list of collected
    `line`s, adding one for anything in the current line buffer, if it is non-empty.


    2.  If we have a newline word, create a `Partial` line from the current buffer
    (even if it is empty – this allows blank lines to be inserted using multiple newlines),
    and carry on.


    3.  If we have any other word, see how long it and the buffer are. If the word
    is longer than the whole line and we are at the beginning of that line, we output
    an over-sized line (an alternative would be to wrap or hyphenate the word in some
    way). Otherwise, we see if the current word will fit. If it will, we add it and
    a space to the buffer and carry on. It not, we output a `Full` line, and start
    with the word on the next line.


    > ![](images/00258.jpg)


    For example, here is our text split into lines of no more than twenty characters
    each:


    `[Text.Full "One morning, when "; Text.Full "Samsa woke from ";  `


    ` Text.Full "dreams, he found "; Text.Full "transformed in his ";  `


    ` Text.Full "into a horrible "; Text.Full "He lay on his ";  `


    ` Text.Full "back, and if he "; Text.Full "his head a little ";  `


    ` Text.Full "could see his brown "; Text.Full "slightly domed and ";  `


    ` Text.Full "by arches into "; Text.Full "sections. The ";  `


    ` Text.Full "was hardly able to "; Text.Full "it and seemed ready ";  `


    ` Text.Full "slide off any "; Text.Full "His many legs, ";  `


    ` Text.Full "thin compared with "; Text.Full "size of the rest of ";  `


    ` Text.Full "waved about "; Text.Partial "as he looked. ";  `


    ` Text.Full "\"What''s happened to "; Text.Full "he thought. It ";  `


    ` Text.Full "a dream. His room, "; Text.Full "proper human room ";  `


    ` Text.Full "a little too small, "; Text.Full "peacefully between "; ...]`


    Now we need to add appropriate text-showing operators to our Pdfpage module, and
    then produce a list of operators for showing a line, using it repeatedly to show
    the whole page. A text section in a PDF operator stream looks something like this:


    `BT 1 0 0 1 40 50 Tm /F0 12 Tf (The text) Tj ET`


    This contains the following operators and operands:


    ![](images/00287.jpg)


    Here are the fragments added to the Pdfpage.t type…


    `  | BeginText`


    `  | EndText`


    `  | SetTextPosition of float * float`


    `  | SetFontAndSize of string * float`


    `  | ShowText of string`


    …and the `string_of_op` function:


    `  | BeginText -> "BT"`


    `  | EndText -> "ET"`


    `  | SetTextPosition (x, y) -> Printf.sprintf "1 0 0 1 %f %f Tm" x y`


    `  | SetFontAndSize (font, size) -> Printf.sprintf "%s %f Tf" font size`


    `  | ShowText t -> Printf.sprintf "(%s) Tj" t`


    Consider Figure [16.1](#index_split_023.html_filepos305915). The function `typeset_line_at`
    builds a single line at x position 20 and a given y coordinate. The function `downfrom`
    builds a list of y positions for a number of lines. The utility function `clean_lines`
    makes plain strings from a list of `line`s, and the function `typeset_page` puts
    it all together, generating a big list of Pdfpage.t operations. The resulting
    PDF is shown in Figure [16.2](#index_split_023.html_filepos306494). The full code
    for this chapter is included in the online resources – it should be consulted
    before attempting the questions.


