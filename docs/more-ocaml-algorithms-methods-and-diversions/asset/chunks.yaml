    following 20 byte TCP datagram header as an example: `00 26 bb 14 62 b7 cc 33
    58 55 1e ed 08 00 45 00 03 78 f7` `ac`.


    The code in Figure [5.1](#index_split_011.html_filepos108367), to print out pertinent
    information from the header, uses `getbit`, `getval`, and a yet-to-be-defined
    function `getval_32` to read the header of a TCP datagram and print a summary.
    The function `getval_32` returns up to 32 bits in an Int32.t (implementing `getval_32`
    is one of the questions at the end of the chapter). Here is the output for our
    example data:


    * * *


    > ![](images/00013.jpg)


    > Figure 5.1:


    * * *


    `Source port = 38  `


    `Destination = 47892  `


    `Sequence = 1656212531  `


    `Acknowledgement Number = 1481973485  `


    `Flags:  `


    ` Urgent = false  `


    ` Ack = false  `


    ` Push = false  `


    ` Reset = false  `


    ` Syn = false  `


    ` Fin = false  `


    `Receive window size = 17664  `


    `Checksum = 888  `


    `Urgent pointer = 63404`


    Note we must use `open_in_bin` for binary data files in case the program is executed
    on Microsoft Windows, where text and binary files are considered different and
    read differently.


    Output bit streams


    The type for output bit streams is rather similar to that for input bit streams,
    but it must be used rather differently.


    `type output_bits =`


    `     {output : output;`


    `      mutable obyte : int;`


    `      mutable obit : int}`


    Here, `output` is the underlying output. The current output byte which is being
    constructed bit-by-bit is `obyte`, and a number `obit` from 7 down to 0 to represent
    the current shift required to add a bit to the byte in the correct place. When
    it is time to move on to the next byte, `obit` is -1\. We can build a fresh output_bits
    from an output:


    > ![](images/00018.jpg)


    The whole byte cannot be written to the underlying `output` until it has been
    completed, so we must have a `flush` function to be used when output is finished:


    > ![](images/00023.jpg)


    This doubles as our alignment function. We can now write `putbit`. For reasons
    we shall explain, it considers any non-zero input to be a `1` bit.


    > ![](images/00027.jpg)


    To output a value of width up to 31, we can write a function `putval o v l` which,
    given an output_bits, value, and length in bits, calls `putbit` on each bit in
    turn:


    > ![](images/00030.jpg)


    Now we can see why we allowed any non-zero integer to be considered a `1` bit
    – it avoids a test in `putval`. Now we have everything we need.


    We can rebuild the datagram we took apart earlier using `putbit`, `putval`, and
    the yet-to-be-defined `putval_32` as shown in Figure [5.2](#index_split_011.html_filepos114203).
    In the questions, you are asked to implement various specializations of some of
    our input and output functions on bit streams.


