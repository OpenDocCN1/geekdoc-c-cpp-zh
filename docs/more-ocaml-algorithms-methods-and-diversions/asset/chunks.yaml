    ` "was"; "hardly"; "able"; "to"; "cover"; "it"; "and"; "seemed"; "ready";  `


    ` "to"; "slide"; "off"; "any"; "moment."; "His"; "many"; "legs,"; "pitifully";
     `


    ` "thin"; "compared"; "with"; "the"; "size"; "of"; "the"; "rest"; "of";  `


