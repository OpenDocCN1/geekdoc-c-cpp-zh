    *   Ordered arrays of objects such as `[1 2 4]`\n\n*   Dictionaries, which are\
    \ unordered collections of key-value pairs, where the keys are names. For example,\
    \ `<</One 1 /Two 2 /Three 3>>`.\n\n*   Streams, like object 4 in the example above,\
    \ which are arbitrary sequences of bytes.\n\n*   Indirect references, like `4\
    \ 0 R` which point to another object by its number (here, object 4).\n\nHere is\
    \ an OCaml data type to hold such data:\n\n`type pdfobject =`\n\n`  Boolean of\
    \ bool`\n\n`| Integer of int`\n\n`| Float of float`\n\n`| String of string`\n\n\
    `| Name of string`\n\n`| Array of pdfobject list`\n\n`| Dictionary of (string\
    \ * pdfobject) list`\n\n`| Stream of pdfobject * string`\n\n`| Indirect of int`\n\
    \nNote that it is recursive, mirroring the structure of the data. For example,\
    \ object 3 in the example above, that is `<</Type /Pages /Kids [1 0 R] /Count\
    \ 1>>`, will be represented as:\n\n`Dictionary`\n\n`  [(\"/Type\", Name \"/Pages\"\
    ); (\"/Kids\", Array [Indirect 1]); (\"/Count\", Integer 1)]`\n\nNow, we need\
    \ a type to represent the whole document, which contains a list of these objects,\
    \ the PDF version number (1.1 in the example above), and the trailer dictionary\
    \ (`<</Size 5 /Root 2 0 R>>` above). Everything else is generated upon writing.\
    \ It is traditional to name the main type of a module t:\n\n`type t =`\n\n`  {version\
    \ : int * int;`\n\n`   objects : (int * pdfobject) list;`\n\n`   trailer : pdfobject}`\n\
    \nWe put these two types into `pdf.ml` and `pdf.mli`. Here is how we might build\
    \ an instance of this data type representing our example PDF:\n\n`let objects\
    \ =`\n\n`  [(1,`\n\n`     Pdf.Dictionary`\n\n`       [(\"/Type\", Pdf.Name \"\
    /Page\");`\n\n`        (\"/Parent\", Pdf.Indirect 3);`\n\n`        (\"/Resources\"\
    ,`\n\n`           Pdf.Dictionary`\n\n`             [(\"/Font\",`\n\n`              Pdf.Dictionary`\n\
    \n`                [(\"/F0\",`\n\n`                  Pdf.Dictionary`\n\n`                    [(\"\
    /Type\", Pdf.Name \"/Font\");`\n\n`                     (\"/Subtype\", Pdf.Name\
    \ \"/Type1\");`\n\n`                     (\"/BaseFont\", Pdf.Name \"/Times-Italic\"\
    )])])]);`\n\n`        (\"/MediaBox\",`\n\n`          Pdf.Array`\n\n`            [Pdf.Float\
    \ 0.; Pdf.Float 0.;`\n\n`             Pdf.Float 595.275590551; Pdf.Float 841.88976378]);`\n\
    \n`        (\"/Rotate\", Pdf.Integer 0);`\n\n`        (\"/Contents\", Pdf.Array\
    \ [Pdf.Indirect 4])]);`\n\n`   (2,`\n\n`     Pdf.Dictionary`\n\n`       [(\"/Type\"\
    , Pdf.Name \"/Catalog\");`\n\n`        (\"/Pages\", Pdf.Indirect 3)]);`\n\n`   (3,`\n\
    \n`     Pdf.Dictionary`\n\n`       [(\"/Type\", Pdf.Name \"/Pages\");`\n\n`        (\"\
    /Kids\", Pdf.Array [Pdf.Indirect 1]);`\n\n`        (\"/Count\", Pdf.Integer 1)]);`\n\
    \n`   (4,`\n\n`     Pdf.Stream`\n\n`       (Pdf.Dictionary [(\"/Length\", Pdf.Integer\
    \ 53)],`\n\n`        \"1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET\"\
    ))]`\n\n`let hello =`\n\n`  {Pdf.version = (1, 1);`\n\n`   Pdf.objects = objects;`\n\
    \n`   Pdf.trailer =`\n\n`   Pdf.Dictionary`\n\n`    [(\"/Size\", Pdf.Integer 5);`\n\
    \n`     (\"/Root\", Pdf.Indirect 2)]}`"
