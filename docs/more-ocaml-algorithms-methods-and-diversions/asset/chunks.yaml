    与普通的二叉搜索树一样，通过 `insert` 添加的新节点将位于叶子节点的位置。我们将其标记为红色（Red），以确保“任何路径上的黑色节点数量均相同”这一不变性不被破坏。然而，这可能会破坏另一个不变性（即红色节点的父节点不能红色）。事实证明，通过考虑新插入节点的父节点和祖父节点，执行一个简单的操作，并可能向上继续此过程，我们可以高效地恢复这一不变性。接下来的
    Okasaki 风格图示说明了这一过程：


    ![](img/00022.jpg)


    在每种情况下，节点 `x`、`y`、`z` 以及子树 `α`、`β`、`γ`、`δ` 都保持相同的顺序，因此保持了二叉树不变性。模式匹配在这里为优雅，因为我们所有的情况中只有一种的结果是不相同的：


    > ![](img/00163.jpg)


    现在，我们可以编写插入函数本身了：


    > ![](img/00004.jpg)


    注意，我们将其封装在一个函数中，以将树的根设置为黑色（Black）——平衡操作不会这样做，因为根节点没有父节点或祖父节点可以比较，否则我们可能会导致一个红色根节点有一个红色子节点。完整模块见图
    11.4。


    * * *


    > ![](img/00269.jpg)


    > 图 11.4:


    * * *


    由于我们已经保证了树将保持合理的平衡，因此即使对于巨大的集合，也不需要尾递归函数了。平衡树对性能的影响是显而易见的，更复杂的红黑树数据结构似乎几乎或完全没有变慢：


    ![](img/00285.jpg)


    ### 哈希表


    哈希表（Hash Table）是一种旨在为集合和映射提供极快速数据插入和访问的数据结构。它包含一组 `0...n` 的桶（buckets）。当我们向集合中插入一个值时，它通过哈希函数进行处理并将其分配到一个桶中，使得值在各个桶之间的分布大致均匀。当我们需要测试某个项的成员性时，会应用相同的哈希函数，我们只需要在一个桶中进行搜索。如果哈希函数工作良好且桶的数量恰当，那么无论集合中有多少项，查找时间都是常数级的。


    例如，如果哈希函数是 `x-→x mod 23`，要插入的数据为 `34, 2, 67, 3, 4, 84, 1467, 7432, 48, 1`，那么桶将为
    `11, 2, 21, 3, 4, 15, 18, 3, 1, 1`。对 `67` 的成员测试现在由应用哈希函数，然后在桶 `21` 中搜索 `67` 是否存在。


    OCaml 标准库在 `Hashtbl` 模块中提供了哈希表实现。为了为集合构建哈希表，我们使用从 `α` 映射到 `unit` 的哈希表，类型为 `(α,
    unit) Hashtbl.t`。使用 `Hashtbl.mem`、`Hashtbl.add`、`Hashtbl.create` 和 `Hashtbl.iter`
    函数，可以很容易地构建一个与我们的签名匹配的实现，如图 11.5 所示。


    * * *


    > ![](img/00175.jpg)


    > 图 11.5:


    * * *


    缺点是哈希表是可变数据结构，因此像 `insert`这样的操作会改变结构。那么，`insert` 的结果改变了集合而不是创建一个新集合。这意味着虽然 `SetType`
    接口在技术上得到了满足，但我们预期的抽象实际上被破坏了。这就是可变性。然而，我们在基准测试中的性能是显而易见的：


    ![](img/00265.jpg)


    基准测试程序可以在资源中找到。


    #### 问题


    1. 比较我们的集合表示在创建和存储它们所需的内存量。你可以使用 OCaml 标准库中 `Gc` 模块的函数来找出在每种集合表示分配大集合之前之后分配了多少字的内存（words）。


    2. 编写函数（必要时采用简单的）对每种表示中的集合执行“并集”（union）操作。两个集合的并集是存在于其中一个、另一个或两者之中的元素集合。操作后，两个输入仍应作为集合可用。


    3. OCaml 有内置的 `Set` 模块。它使用了这里没有讨论过的高级模块语法，但你可以这样构建一个用于处理整数集合的模块：


    ```

    module S = Set.Make (struct type t = int let compare = compare end)

    ```


    这个新模块 `S` 提供了用于集合的类型 `t`，以及 `add`、`elements`、`mem`、`empty` 和 `cardinal` 函数，它们的定义可以在
    OCaml 手册中找到。使用这些函数构建一个与我们的接口相似的集合模块。对它在我们的示例中的速度进行评论。


    4. 我们可以在红黑树的定义中通过使用两个不同的 `Br` 节点（一个红色，一个黑色）而不是存储颜色来节省内存。实现这一点。节省了多少内存？


    ### 第 12 章


    ### 玩游戏


    井字棋游戏（Noughts and Crosses）是一个规模巨大但可控的问题。让我们回顾规则，然后看我们是否能构建游戏树（即一个描述所有可能游戏的结构），并从中得出一些统计数据。3x3
    网格被构建出来。两个玩家（O 和 X）交替回合，在空位放置棋子。当一个玩家在行、列或对角线上形成三个棋子时，游戏获胜。如果棋盘满且没有形成这种模式，则为平局。例如，在这个板上，O
    赢了：


    让我们考虑游戏树的形状。显然，在顶层它会有九种分支，因为 O 可以放置在任何格子。然后是八种、七种，依此类推。当我们到达第五层时，某些游戏已经结束了，因为分支数可能会减少。树在棋盘满时结束，即使没有人获胜。游戏树的一部分如图
    12.1 所示。让我们开始构建。我们需要一个类型来表示 X、O 和空位：


    * * *


    ![](img/00246.jpg)


    > 图 12.1:


    * * *


    ```

    type turn = O | X | E

    ```


    使用元组是自然的，因为板的大小是固定的。但这样失去了使用 `List.map` 等标准列表处理函数的能力。因此，以牺牲一点优雅性的代价，我们将使用长度为 9
    的列表——即 `turn list`。


    我们需要在 X 获胜、O 获胜或棋盘满时终止树。因此我们需要检查所有的行、列和对角线。我们不想重复编写逻辑或构建巨大的模式匹配，因此简单的方法是编写一个接受九个布尔值并只检查
    `true` 的函数。然后我们可以对板本身使用 `List.map` 来构建这些中间布尔列表。


    > ![](img/00093.jpg)


    我们可以为板上的位置编号：


    ![](img/00225.jpg)


    现在，我们可以使用 List 模块的函数编写一个返回当前空位置编号的函数：


    > ![](img/00073.jpg)


    这是通过构建元组列表 `[(X, 1); (E, 2); (E, 3)` …`(O, 9)]`，过滤掉任何非空的项，并提取空位置列表 `[2, 3` ...]。编写一个函数也是简单的，给定一个如
    `[E; E; E; E; X; E; O; E; E]` 的板、一个如 `O` 的回合和一个如 `8` 的数字，它将填充板中的正确槽位以产生 `[E; E;
    E; E; X; E; O; X; E]`。我们 Util 模块中的 `take` 和 `drop` 函数（在 xiii 页描述）是理想的：


    > ![](img/00210.jpg)


    在编写主树构建函数之前，还需要另一个简单的函数，即切换该谁的回回合：


    > ![](img/00053.jpg)

