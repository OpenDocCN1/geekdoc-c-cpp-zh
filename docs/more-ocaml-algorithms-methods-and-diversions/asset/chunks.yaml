    \ than as required. Instead, let us build a bit stream based on our input type:\n\
    \n```ocaml\ntype input_bits =\n    {input : input;\n     mutable byte : int;\n\
    \     mutable bit : int}\n```\n\nThe `input` field is the input this bit stream\
    \ is based upon. It will start from the most significant bit of the current byte\
    \ of that input. The `byte` field holds the byte just read from the input, or\
    \ an undefined value if no byte has yet been read. The `bit` field records the\
    \ current bit position, but instead of `0..7` we will use `128, 64, 32, 16, 8,\
    \ 4, 2, 1` so this field can be used directly to extract the bit using the built-in\
    \ logical AND operator `land`, and then halved:\n\n![](images/00136.jpg)\n\nThe\
    \ expression `x land y` where `x` and `y` are integers yields an integer whose\
    \ value has a bit pattern which is the bitwise logical AND of `x` and `y`. This\
    \ `input_bits` type can be wholly abstracted, defined in the `.mli` by just `type\
    \ input_bits`. Now, we can define a function to build an `input_bits` from an\
    \ input:\n\n> ![](images/00140.jpg)\n\nThe function to get the next bit is simple.\
    \ If `bit` is zero, we must load a new `byte` from the input and return the next\
    \ bit. If `bit` is non-zero, we extract the given bit, and halve `bit` ready for\
    \ next time.\n\n> ![](images/00144.jpg)\n\nThis function can raise `End_of_file`,\
    \ of course, if the underlying call to `input_char` raises it. Two other functions\
    \ are useful. We can align the bit stream on the next byte boundary trivially:\n\
    \n> ![](images/00148.jpg)\n\nWe can write a function `getval` to return a given\
    \ number of bits considered as an integer, allowing us to read a data field of\
    \ any width. We use the `lor` operator, which gives the bitwise logical OR of\
    \ two integers, and the `lsl` or logical shift left operator, which shifts the\
    \ bits in an integer left by the specified number of bits, filling zeros on the\
    \ right.\n\n> ![](images/00005.jpg)\n\nOCaml integers are at least 31 bits (depending\
    \ upon the computer), so we can read fields up to 31 bits wide with this function.\
    \ This number on a particular computer can be calculated by evaluating `Sys.word_size\
    \ - 1`.\n\n### Example: decoding a TCP datagram header\n\nHere is the layout of\
    \ the header of a datagram of the TCP (Transmission Control Protocol) used for\
    \ network communications:\n\n![](images/00061.jpg)\n\nIt contains fields as small\
    \ as 1 bit, and as large as 32 bits. We shall use the following 20 byte TCP datagram\
