    \ (compress_string_ccitt s)` 来验证我们的代码。\n\n## 思考\n\n1. 使用 `input` 和 `output` 类型为\
    \ `compress` 和 `decompress` 增加了多少复杂度？重写这些函数，让它们以函数式风格处理整数列表，并进行比较。\n2. 用从压缩列表自动生成的树替换我们手动的代码树。该树在分支处没有数据（因为没有代码是另一个代码的前缀），仅在某些叶子处有数据。首先定义一个合适的数据类型。\n\
    3. 如果我们将数据作为单行 1680 位而不是 21 行 80 位会怎样？尝试压缩已经压缩的数据会怎样？\n4. 写一个函数，给定输入数据，计算不同黑白连续段的频率直方图。这可以用于为每个图像构建自定义代码。\n\
    \n## 第 7 章：标签和可选参数\n\nOCaml 允许对函数的某些或全部参数进行标记，以便提供少量文档、防止交换相同类型的参数并允许灵活的部分应用。考虑一个向数组部分填充元素的函数：\n\
    \n> ![](img/00215.jpg)\n\n`fill` 函数接收四个参数：数组本身、起始位置、填充长度和用于填充的元素。然而，由于起始位置和长度都是整数，很容易弄反。可以通过给这两个参数加上标签来解决。标签由波浪号\
    \ `~` 引入，后面跟着标签名称、冒号和参数名称本身。考虑下面的 `fill` 和 `filled` 函数。如你所见，我们用标签定义了 `fill`，标签也出现在类型中。在第一个\
    \ `filled` 函数中，我们调用 `fill` 函数，引用标签并给出即时整数。在第二个中，我们展示了它与其他名称有效（事实上，它对任何表达式都有效）。在第三个，我们展示了标记参数可以与其他参数进行置换和重新排列（未标记参数必须彼此之间保持正确的顺序）。\n\
    \n> ![](img/00234.jpg)\n\n我们可以做的另一个变化是将标签也作为函数内部参数的名称。这简化了语法：我们只需要写 `~label`。\n\
    \n> ![](img/00003.jpg)\n\n你可以看到在 `filled` 中，这种“名称重用”（punning）在调用函数时如果碰同名值也同样有效。当然，这两种功能不需要一起使用。\n\
    \n### 带标签的部分应用\n\n"
- fmt: "\nAnother common use of labelled arguments is to give flexibility when using\
    \ partial application. Consider the following function:\n\n```ocaml\nlet divide\
    \ x y = x / y\n```\n\nWe can use partial application to write the function which\
    \ divides ten thousand by each number in a list:\n\n```ocaml\nlet f = divide 10000\
    \ in [f 100; f 50; f 20]\n```\n\nThis yields `[100; 200; 500]`. But we cannot\
    \ re-use `divide` to write the function which divides each number in a list by\
    \ ten – this would involve partially applying the second argument `y` first. The\
    \ design of the `divide` function has baked in which argument may be partially\
    \ applied (OCaml lets us partially apply any prefix of the arguments – the first,\
    \ first and second, first, second and third etc.) For example, we can apply the\
    \ same function to many lists, using a partially applied `List.map` but we cannot\
    \ apply many functions to a single list by providing the list to `List.map` instead.\
    \ In our example, we can label the arguments to our `divide` function:\n\n```ocaml\n\
    let divide ~x ~y = x / y\n```\n\nThe type of the function reflects this:\n\n```ocaml\n\
    OCaml\n# let divide ~x ~y = x / y;;\nval divide : x:int -> y:int -> int = <fun>\n\
    ```\n\nNow we may apply the arguments in either order:\n\n```ocaml\nOCaml\n# let\
    \ f = divide ~x:10000 in [f 100; f 50; f 20];\n- : int list = [100; 200; 500]\n\
    # let f = divide ~y:10000 in [f 100000; f 10000; f 1000];\n- : int list = [10;\
    \ 1; 0]\n```\n\nWe can in fact, omit the labels if we are applying arguments in\
    \ order:\n\n```ocaml\nOCaml\n# let f = divide 10000 in [f 100; f 50; f 20];\n\
    - : int list = [100; 200; 500]\n```\n\n### Optional arguments\n\nOCaml also allows\
    \ us to make a labelled argument optional – that is to say, we need not supply\
    \ it at all. The function which is called without one or more of its arguments\
    \ can decide what to do. Consider this simple function `split` which returns a\
    \ list of singleton lists from an input list, for example returning `[[1]; [2];\
    \ [3]]` for the input list `[1; 2; 3]`:\n\n> ![](images/00152.jpg)\n\nWe would\
    \ like to extend the function to produce sub-lists of a given size, other than\
    \ the default of 1. We can add a labelled argument and adapt the function, using\
    \ `take` (which takes a given number of items from the start of a list) and `drop`\
    \ (which drops a given number of items from the start of a list) from the `Util`\
    \ module described on page xiii:\n\n> ![](images/00157.jpg)\n\nThere are two problems,\
    \ though. Existing code using the function will not compile, and we must always\
    \ specify the `chunksize` argument, even when it will be 1. This can be remedied\
    \ by using an optional labelled argument, introduced with a question mark instead\
    \ of a tilde, and given a default value:\n\n> ![](images/00160.jpg)\n\nNotice\
    \ the question mark appears also in the type. Notice also that in the recursive\
    \ call to `split` we can write `~chunksize` instead of `~chunksize:chunksize`\
    \ as usual. Now our `split` function can be called with or without this optional\
    \ argument:\n\n```ocaml\nOCaml\n# split [1; 2; 3];\n- : int list list = [[1];\
    \ [2]; [3]]\n# split ~chunksize:3 [1; 2; 3; 4; 5; 6; 7];\n- : int list list =\
    \ [[1; 2; 3]; [4; 5; 6]; [7]]\n```\n\nIn fact, if we do not give a default value\
    \ to the optional argument in the definition of `split`, we have access to its\
    \ actual implementation – as a value of the `option` type, either `None` or `Some`,\
    \ and we can match on it:\n\n> ![](images/00165.jpg)\n\nThis is primarily useful\
    \ when there are optional arguments.\n\n### Labels in the Standard Library\n\n\
    The Standard Library contains three labelled versions of other modules: `ListLabels`,\
    \ `ArrayLabels` and `StringLabels`. For example, we can write:\n\n```ocaml\nListLabels.map\
    \ ~f:(fun x -> x*2) [1; 2; 3];\n- : int list = [2; 4; 6]\n```\n\nIf we wish to\
    \ use the labelled modules by default, the `StdLabels` module contains these modules\
    \ under their original names so, by writing `open StdLabels`, `List.map`, `Array.blit`\
    \ will now be labelled:\n\n```ocaml\nopen StdLabels;;\n# List.map ~f:(fun x ->\
    \ x*2) [1; 2; 3];\n- : int list = [2; 4; 6]\n```\n\nThese modules do not label\
    \ all arguments. Typically they do so for arguments which are functions, and when\
    \ there are multiple arguments of the same type which may be confused. For example,\
    \ `ArrayLabels.sub` of type `α -> pos:int -> len:int -> α array` introduces labels\
    \ to disambiguate the position and length, but does not label the input array.\n\
    \n#### Questions\n\n1. The function `ArrayLabels.make` is not labelled, having\
    \ type `int -> α array`. When might this cause confusion? Write a labelled version\
    \ to this.\n2. When we wrote our `fill` function with labelled arguments, we wanted\
    \ to prevent someone swapping the start and length values. Can you find a way\
    \ to do this without labelled or optional arguments?\n3. Build labelled versions\
    \ of functions from the `Buffer` module, choosing which functions and arguments\
    \ to label.\n4. Frequently we use an accumulator to make a function tail-recursive,\
    \ wrapping it up in another function to give the initial value of the accumulator.\
    \ For example, we might write:\n\n> ![](images/0168.jpg)\n\nUse an optional argument\
    \ to express this as a single function.\n\n### Chapter 8: Formatted Printing\n\
    \nOCaml provides facilities for what is called formatted printing. Consider the\
    \ following function, culled from Chapter [3](#index_split_009.html_filepos3521):\n\
    \n> ![](images/0174.jpg)\n\nUsing the function `sprintf` (“formatted printing\
    \ to a string”) from the Standard Library `Printf` we can build this string more\
    \ easily:\n\n> ![](images/0179.jpg)\n\nIn this example, the format string is `\"\
    %s = (%f)\"`. The conversion specifications `%s` and `%f` denote places for a\
    \ string and the decimal representation of a floating-point number respectively\
    \ to be substituted into the string. Other characters are simply reproduced from\
    \ the format string to the output string. We have avoided the inefficient, repeated\
    \ use of the `^` operator for string concatenation, and our new example is both\
    \ shorter and easier to read. Here is a subset of the many conversion specifications\
    \ available:\n\n![](images/0184.jpg)\n\nThe `sprintf` function knows how to match\
    \ up the conversion specification with the arguments following the format specification\
    \ at compile time, so run-time errors are avoided:\n\n```ocaml\nOCaml\n# Printf.sprintf\
    \ \"%s = (%f, %f)\" \"A\" 40 65.8\nError: This expression has type int but an\
    \ expression was expected of type float\n```\n\nIndeed, even if we use partial\
    \ application, the type of the resulting function will be calculated:\n\n```ocaml\n\
    OCaml\n# let f = Printf.sprintf \"%s = (%f, %f)\" \"A\" 2.45;\nval f : float ->\
    \ string = <fun>\n```\n\nYou might be able to guess that there is a little magic\
    \ going on here – we could not write `sprintf` ourselves, for example. We can\
    \ see the rather complicated type of the `sprintf` function, used for its internal\
    \ implementation:\n\n```ocaml\nOCaml\n# Printf.sprintf;;\n- : ('a, unit, string)\
    \ format -> 'a = <fun>\n```\n\nFor printing numbers, there are some additional\
    \ pieces of information which can be provided. The format of a conversion specifier\
    \ is in fact:\n\n`%⟨flags⟩⟨width⟩⟨.precision⟩type`\n\nFields enclosed in angle\
    \ brackets are optional. So far, we have only used the `%` character and the type\
    \ field. The width field defines the width of the representation of the number,\
    \ and can be used to line things up in columns, here of width six:\n\n> ![](images/0188.jpg)\n\
    \nThis will result in the following output from `print_nums data`:\n\n```\nA \
    \     | B      | C\n------+-------+-------\n      1 |      6 |      5\n      2\
    \ |     18 |      4\n      3 |     31 |     12\n      4 |     16 |      2\n```\n\
    \nHere are some possible values of the flags field:\n\n![](images/0193.jpg)\n\n\
    The optional precision field specifies the number of digits after the decimal\
    \ point. For example, let us print some integers and floating-point numbers in\
    \ columns with differing flags and precisions:\n"
