    11 (Making Sets)


    1


    It is not possible to measure directly the memory used by an OCaml data structure
    (though one could calculate it by reading the section in the OCaml manual about
    data representation), but we can use the Gc module to measure the number of words
    allocated whilst building the structure, by using the data in `Gc.counters` before
    and after building each structure, and the given formula “memory used since start
    of program = minor words + major words - promoted words”:


    ![](images/00170.jpg)


    Notice that a huge amount more is required for the tree structures, because every
    time a new element is inserted, part of the tree is rewritten. In the case of
    the Red-Black tree, rotations involve allocating new memory too.


    2


    We can add the type for the `union` function to our signature:


    > ![](images/00177.jpg)


    For lists, the `union` function is easy, we just insert each element of `b` into
    the list `a`. Duplicates will be removed correctly:


    `let union a b = List.fold_left (fun x y -> insert y x) a b`


    For trees and Red-Black trees, we must turn `b` into a list first, so `fold_left`
    can be used, but the solution is broadly the same.


    `let union a b = List.fold_left (fun x y -> insert y x) a (list_of_set b)`


    For hash tables, to preserve the previous tables, we must build lists from both
    sets, and then build a new set from the concatenation of those too lists:


    `let union a b = set_of_list (list_of_set a @ list_of_set b)`


    The built-in Set module, which is considered in Question 3, provides a particularly
    efficient union operation.


    3


    We write a version of our set signature which is specialized to integers. Then,
    we use the syntax given in the question to build the module S. This contains the
    type S.t, the value `S.empty` and the functions `S.elements`, `S.add`, `S.mem`,
    and `S.cardinal`, which we can use to write the functions to match our signature.


