    \n`1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET`\n\nIt is a list of operator-operand\
    \ sequences. Each sequence consists of zero or more operands and one operator.\
    \ The sequences in our example are:\n\n![](images/00166.jpg)\n\nIn this chapter\
    \ we will introduce a few simple operators for drawing lines and filling shapes\
    \ (in the next chapter we discuss adding text and build a basic typesetter). Here\
    \ are the operators we will be using to start with:\n\n![](images/00194.jpg)\n\
    \nHere is a data type, which forms part of the new Pdfpage module, which encodes\
    \ these operators. We will extend it with new operators when required.\n\n`type\
    \ t =`\n\n`    Move of float * float`\n\n`  | Line of float * float`\n\n`  | Close`\n\
    \n`  | Stroke`\n\n`  | Fill`\n\n`  | FillColour of float`\n\n`  | StrokeColour\
    \ of float`\n\nIn order to put these into the PDF document, we will need to convert\
    \ each set of operands and operator to a string. This is simple:\n\n> ![](images/00284.jpg)\n\
    \nNow we can put them together into a single string by using functions from the\
