    > ![](images/00037.jpg)


    > Figure 5.2:


    * * *


    Questions


    1.  Specialize the function `getval` so that writing 8 bits at a time when the
    input is aligned is optimized. Benchmark this function against the naive one.


    2.  Write the function `getval_32` which can get a value of type Int32.t in the
    same fashion as `getval`.


    3.  Specialize the function `putval` so that writing 8 bits at a time when the
    output is aligned is optimized. Benchmark this function against the naive one.


    4.  Write the function `putval_32` which can put a value of type Int32.t in the
    same fashion as `putval`.


    5.  We said that the output_bits type needed a `flush` operation. In fact, this
    is not always true – for outputs built with, for example, `output_of_string`,
    we could write the current byte every time a bit is written, seeking back one
    byte each time, only moving on when the byte is actually finished. Implement this.


    Chapter 6


    Compressing Data


    Often we need to attempt to reduce the amount of space taken by some data, for
    storage or transmission. If data were arbitrary, it could not be compressed –
    to compress data we need to recognise and exploit patterns. However, most data
    is not arbitrary at all, but structured and containing repeated patterns. No compression
    scheme can guarantee to reduce the size of all inputs, but we would like to achieve
    good compression on typical data.


    We will look at a simple byte-by-byte compression scheme, implementing it using
    our input and output data types so it can be applied to different kinds of inputs
    and outputs. Then, we will consider a more complex but efficient scheme for compressing
    data on a bit-by-bit basis.


    A byte-by-byte compression scheme


    The following extract from ISO-32000 (the PDF standard) defines a byte-by-byte
    compression scheme:'
