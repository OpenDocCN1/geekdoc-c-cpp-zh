  trans: "\n游戏树的类型应该是什么？每个节点都需要一个代表棋盘的回合元素列表，以及一个包含零或多个树的列表，代表每个可能的移动产生的游戏。由于列表可以包含零元素，我们不需要单独的叶子节点构造函数：\n\
    \n```\ntype tree = Move of turn list * tree list\n```\n\n现在我们可以构建主函数了。我们的任务是根据给定的回合（X\
    \ 或 O）和当前棋盘，构建从该棋盘开始的树。如果某位玩家已经获胜，则后续节点列表为空，递归停止。如果没有获胜，我们计算空位，通过在每个空位中填入当前回合来构建新棋盘，然后对这些每一个新棋盘映射\
    \ `next_moves`。\n\n> ![](img/00192.jpg)\n\n注意，当棋盘填满（平局）时递归会停止，因为在这种情况下 `empty`\
    \ 会返回空列表。现在我们可以构建游戏树本身了，这可能需要一秒左右的时间：\n\n> ![](img/00017.jpg)\n\n这产生了如下所示的树。\n\
    \n> ![](img/00045.jpg)\n\n你可以看到这个游戏树中的第一个结束位置是 `[O; X; O; X; O; X; O; E; E]`。你还可以看到几场平局。我们现在可以使用这个游戏树来计算特定玩家获胜了多少场：\n\
    \n> ![](img/00076.jpg)\n\n这很很快地告诉我们，O 赢了 131184 局。本章末尾的问题要求你算出更多这样的数字。这里是完整的代码：\n\
    \n> ![](img/00105.jpg)\n\n在问题中，你将从树中提取剩余的统计数据，并构建一些替代表示方法。\n\n### 习\n\n1. X 在多少情况下获胜？共有多少种可能的不同的游戏？有多少场以平局结束？\n\
    2. 构建我们游戏树的懒加载版本，节点仅在被探索时才创建。现在写一个函数，计算如果 O 先手并选择中心位置，O 和 X 分别获胜或平局的多少次。如果 O 选择角落呢？侧边的中间呢？\n\
    3. 检查有人获胜的另一种方法是将棋盘数字重新排列成所谓的魔幻方，其中每一行、每一列或对角线的和等于 15：\n\n   ![](img/00133.jpg)\n\
    \n   现在，如果玩家任何三个位置之和为 15，他们就获胜了。使用这种替代表示重新实现我们的游戏树程序。\n\n> 生成 PDF 文档\n> 扩展示例\n\
    \n# 第 13 章：表示文档\n\n在本章中，我们将定义一个表示 PDF 文档的数据类型。PDF 是一种用于描述各种图形和文本数据的结构化格式。PDF 文件格式本身既大又复杂，但我们只介绍示例所需的部分。编写\
    \ PDF 文件相对容易，但读取它们则要困难得多，因此我们将集中在内存中创建 PDF 数据结构，然后将它们写入有效的文件。这是一个示例 PDF，就像它在 PDF\
    \ 查看器中显示的那样：\n\n![](img/00158.jpg)\n\n这里是对应的代码，如果你在纯文本编辑器打开该 PDF 文件，将会看到它：\n\n\
    ```\n%PDF-1.1  \n1 0 obj  \n<</Type /Page  \n  /Parent 3 0 R  \n  /Resources \
    \ \n    <<</Font  \n      <<</F0  \n          <<</Type /Font /Subtype /Type1 /BaseFont\
    \ /Times-Italic>>>>>>  \n    /MediaBox [0 0 595.275590551 841.88976378]  \n  \
    \  /Rotate 0 /Contents [4 0 R] >>  \nendobj  \n2 0 obj  \n<</Type /Catalog /Pages\
    \ 3 0 R>>  \nendobj  \n3 0 obj  \n<</Type /Pages /Kids [1 0 R] /Count 1>>  \n\
    endobj  \n4 0 obj  \n<</Length 53>>  \nstream  \n1 0 0 1 50 770 cm BT /F0 36 Tf\
    \ (Hello, World!) Tj ET  \nendstream  \nendobj  \nxref  \n0 5  \n0000000000 65535\
    \ f  \n0000000015 00000 n  \n0000000200 00000 n  \n0000000245 00000 n  \n0000000296\
    \ 00000 n  \ntrailer  \n<</Size 5 /Root 2 0 R>>  \nstartxref  \n397  \n%%EOF\n\
    ```\n\n正如我们所见，相当复杂。我们的第一个工作是为 PDF 文档定义一个令人舒适的 OCaml 数据类型，在写入文件时可以将其平化为上述格式。\n\n\
    PDF 文件的正体是一组编号的对象——在上面的示例中有四个，从 `1 0 obj` 到 `4 0 obj`。每个对象都包含一些结构化数据，例如字典 `</Type\
    \ /Pages [1 0 R] /Count 1>>`，它分别将 `/Type`、`/Kids` 与名称 `/Pages`、数组 `[1 0 R]` 以及整数\
    \ `1` 关联。在正体之前之后是一些数据，我们大部分我们不需要保存在我们的结构中——它们是在写入时生成的。以下是我们将用到的所有类型的数据：\n\n- 布尔值，如\
    \ `true` 和 `false`\n- 整数，如 `256`，`-1`\n- 浮点数，如 `1.5`\n- 字符串，如 `(a string)`，即括号内的字符\n\
    - 名称，如 `/Name`\n- 有序数组，如 `[1 2]`\n- 字典，即键值对的无序集合，其中键是名称。例如，`<<One /Two /3>>`。\n\
    - 流，如上面示例中的对象 4，是任意字节。\n- 引用，如 `4 0 R`，它指向另一个对象（这里是 `4`）。\n\n这是一个用于存储此类数据的 OCaml\
    \ 数据类型：\n\n```\ntype pdfobject =\n  Boolean bool\n  | Integer int\n  | Float float\n\
    \  | String string\n  | Array pdfobject list\n  | Dictionary (string * pdfobject)\
    \ list\n  | Stream pdfobject\n  | Indirect int\n```\n\n注意它是递归的，镜像了数据的结构。例如，示例中的对象\
    \ 3，即 `</Type /Pages [1 0 R] /Count 1>>`，将被表示为：\n\n```\nDictionary [(\"/Type\"\
    , Name \"/Pages\"), Integer 1]\n```\n\n现在我们需要一个类型来表示整个文档，它包含这些对象的列表、PDF 版本（示例中为\
    \ 1.1）以及尾部（`<<Size 5 /Root 2 0 R>>`）。此外，传统上将主类型命名为 `t`：\n\n```ocaml\ntype t =\
    \ {\n  version : int;\n  objects : (int * pdfobject) list;\n  trailer : pdfobject\n\
    }\n```\n\n我们将这两个类型放入 `pdf.ml` 和 `pdf.i`。这里是我们如何构建一个示例数据的实例：\n\n```ocaml\nlet objects\
    \ = [\n  (1,\n    Dictionary [\n      (\"/Type\", Name \"/Page\");\n      (\"\
    /Parent\", Indirect 3);\n      (\"/Resources\",\n        Dictionary [\n      \
    \    (\"/Font\",\n            Dictionary [\n              (\"/F0\",\n        \
    \        Dictionary [\n                  (\"/Type\", Name \"/Font\");\n      \
    \            (\"/Subtype\", Name \"/Type1\");\n                  (\"/BaseFont\"\
    , Name \"/Times-Italic\")\n                ])\n            ])\n          )\n \
    \     );\n      (\"/MediaBox\",\n        Array [Float 0.; Float 0.; Float 595.275590551;\
    \ Float 841.88976378]);\n      (\"/Rotate\", Integer 0);\n      (\"/Contents\"\
    , Array [Indirect 4])\n    ])\n  );\n  (2,\n    Dictionary [\n      (\"/Type\"\
    , Name \"/Catalog\");\n      (\"/Pages\", Indirect 3)])\n  );\n  (3,\n    Dictionary\
    \ [\n      (\"/Type\", Name \"/Pages\");\n      (\"/Kids\", Array [Indirect 1]);\n\
    \      (\"/Count\", Integer 1)])\n  );\n  (4,\n    Stream (\n      Dictionary\
    \ [(\"/Length\", Integer 53)],\n      \"1 0 0 1 50 770 cm BT /F0 36 Tf (Hello,\
    \ World!) Tj ET\"))]\n\nlet hello =\n  {version = (1, 1);\n  objects = objects;\n\
    \  trailer = Dictionary [(\"/Size\", Integer 5); (\"/Root\", Indirect 2)]}\n```\n"
- fmt: "\nThe advantage of using this data structure as opposed to generating the\
    \ PDF file directly is that it may be programmatically manipulated with ease,\
    \ using pattern matching and other standard OCaml techniques. Note that the content\
    \ of the page itself `\"1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET\"\
    ` remains a plain string. We shall look at this separate language soon.\n\nIn\
    \ the next three chapters, we will learn how to write this representation to a\
    \ file, and add our own text and graphics to the page.\n\n## Questions\n\n1. \
    \ Draw the graph of the relationships, via indirect references such as `3 0 R`,\
    \ of the objects 1, 2, 3, 4 and the trailer dictionary.\n2.  Represent the following\
    \ PDF objects using our data type:\n    *   `/Name`\n    *   `(Quartz Crystal)`\n\
    \    *   `<</Type /ObjStm /N 100 /First 807 /Length 1836 /Filter /FlateDecode>>`\n\
    \    *   `[1 2 1.5 (black)]`\n    *   `[1 2 0 R]`\n3.  PDF files can contain arbitrary\
    \ objects, which will be ignored by a PDF reader if they are not understood. Design\
    \ a way of representing items of the following type using one or more PDF objects:\n\
    \    `type tree = Lf | Br of tree * int * tree`\n4.  Write a function of type\
    \ `pdfobject → pdfobject` which, given an object, replaces the value of any dictionary\
    \ entry with key `/Rotate` to `90`.\n\n## Chapter 14: Writing Documents\n\nWe\
    \ have built a representation for PDF documents to be held in memory, and defined\
    \ an example document. Now, we must build functions to write this to file. Recall\
    \ our example file from the last chapter:\n\n```pdf\n%PDF-1.1  \n1 0 obj  \n<</Type\
    \ /Page  \n  /Parent 3 0 R  \n  /Resources  \n    <</Font  \n      <</F0  \n \
    \         <</Type /Font /Subtype /Type1 /BaseFont /Times-Italic>>>>>>  \n    \
    \  /MediaBox [0 0 595.275590551 841.88976378]  \n      /Rotate 0 /Contents [4\
    \ 0 R] >>  \nendobj  \n2 0 obj  \n<</Type /Catalog /Pages 3 0 R>>  \nendobj  \n\
    3 0 obj  \n<</Type /Pages /Kids [1 0 R] /Count 1>>  \nendobj  \n4 0 obj  \n<</Length\
    \ 53>>  \nstream  \n1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj ET  \nendstream\
    \  \nendobj  \nxref  \n0 5  \n0000000000 65535 f  \n0000000015 00000 n  \n0000000200\
    \ 00000 n  \n0000000245 00000 n  \n0000000296 00000 n  \ntrailer  \n<</Size 5\
    \ /Root 2 0 R>>  \nstartxref  \n397  \n%%EOF\n```\n\nIt consists, we remember,\
    \ of a header, then some objects (here, four), and a trailer. We will need four\
    \ functions:\n\n1.  The function `string_of_pdfobject` to make a string from a\
    \ `Pdf.pdfobject`, for example making the string `\"<</Type /Pages /Kids [1 0\
    \ R] /Count 1>>\"` from the pdfobject `Dictionary` `[(\"/Type\", Name \"/Pages\"\
    ); (\"/Kids\", Array [Indirect 1]); (\"/Count\", Integer 1)]`.\n2.  The function\
    \ `write_header` to write the header (i.e. everything before the objects);\n3.\
    \  The function `write_trailer` to write the trailer (i.e. everything after the\
    \ objects); and\n4.  The main function `pdf_to_file` which uses these three functions\
    \ to write a `Pdf.t` to a file under the given file name.\n\nThe function `string_of_pdfobject`\
    \ is best expressed as a set of mutually-recursive functions introduced with the\
    \ `let rec … and …` construct. To give it as a single function is possible, but\
    \ would be rather large, and so harder to read and edit. Let us present it piece-by-piece\
    \ and then all at once.\n\nFirst, the main part. Given an object we wish to produce\
    \ its string, assuming that `string_of_array`, `string_of_dictionary`, and `string_of_stream`\
    \ exist:\n\n![](images/00185.jpg)\n\nThe cases are all simple, except for the\
    \ ones we have put aside to be implemented separately. Strings must be put between\
    \ parentheses, indirect references are printed as `2 0 R` etc.\n\nTo build a string\
    \ from an `Array`, we need to start with an open square bracket, add the string\
    \ for each `Pdf.pdfobject` in the array (which may be arbitrarily complex), and\
    \ put spaces between them. Then we end with a close bracket:\n\n![](images/00233.jpg)\n\
    \nIt is natural to use `Buffer` module from Standard Library to collect these\
    \ strings together. It is also more efficient than string concatenation. Notice\
    \ we do not add an initial space after the square bracket, but before the closing\
    \ bracket, for symmetry. The `string_of_dictionary` is somewhat similar:\n\n![](images/00237.jpg)\n\
    \nNow for `string_of_stream`. A stream in PDF is written like this:\n\n```pdf\n\
    stream\ndata\nendstream\n```\n\nThis is simple with `Buffer` module too:\n\n![](images/00270.jpg)\n\
    ![](images/0060.jpg)\n\nFigure 14.1: Our mutually recursive functions to build\
    \ a string from a `Pdf.pdfobject`. The code for these four functions is collected\
    \ together in Figure [14.1](#index_split_02.file2714). Now that we can build a\
    \ string from any `Pdf.pdfobject`, we can proceed to build the `write_header`,\
    \ `write_trailer`, and `write_objects` functions, so that we have everything we\
    \ need for `pdf_to_file`. The PDF header consists of `%%PDF-mn` where `m` and\
    \ `n` are the major and minor numbers. This is easy to build with `Printf.sprintf`:\n\
    \n![](images/00199.jpg)\n\nThe `write_objects` function, which is given a list\
    \ of `(int × Pdf.pdfobject)` pairs, sorts the objects by their number, and then\
    \ outputs each object using `string_of_pdfobject`. For example, the pair `(3,\
    \ Dictionary [(\"/Type\", Name \"/Pages\"); (\"/Kids\", Array [Indirect 1]); (\"\
    /Count\", Integer 1)])` will be written to file like this:\n\n```pdf\n3 0 obj\n\
    << /Type /Pages /Kids [1 0 R] /Count 1 >>\nendobj\n```\n\nThe function collects\
    \ and returns a list of the byte offsets of the objects written, since this will\
    \ be needed to write the trailer section, we shall describe in a moment.\n\n![](images/00147.jpg)\n\
    \nNow, we can write the trailer. That is to say, this section:\n\n```pdf\nxref\n\
    0 5\n0000000000 65535 f\n0000000015 00000 n\n0000000230 00000 n\n0000000279 00000\
    \ n\n0000000338 00000 n\ntrailer\n<< /Size 5 /Root 2 0 R>>\nstartxref\n440\n%%EOF\n\
    ```\n\nThis consists largely of a list of the byte offsets of the four objects\
    \ in the file (15, 230, 279, 338), the trailer dictionary, and so on. It is not\
    \ necessary to understand it in detail. This is the first section which would\
    \ be read by a PDF reader, to find the actual objects in the file.\n\n![](images/00085.jpg)\n\
    \nNow the main function is simple. We open the file, write the header, objects,\
    \ and trailer, and close the file. In the event of an exception, we close the\
    \ file to clean up, and re-raise it.\n\n![](images/00114.jpg)\n\nThis code goes\
    \ into `pdfwrite.ml`. The interface `pdfwrite.mli` is very simple. We expose only\
    \ `pdf_to_file`:\n\n![](images/00141.jpg)\n\nHere is the output of our program\
    \ on the example `Pdf.hello`:\n\n```pdf\n%PDF-1.1 \n1 0 obj \n<< /Type /Page /Parent\
    \ 3 0 R /Resources << /Font << /F0 << /Type /Font /Subtype /Type1 /BaseFont /Times-Italic\
    \ >> >> >> /MediaBox [ 0. 0. 595.275590551 841.88976378 ] /Rotate 0 /Contents\
    \ [ 4 0 R ] >> \nendobj \n2 0 obj \n<< /Type /Catalog /Pages 3 0 R >> \nendobj\
    \ \n3 0 obj \n<< /Type /Pages /Kids [1 0 R ] /Count 1 >> \nendobj \n4 0 obj \n\
    << /Length 53 >> \nstream \n1 0 0 1 50 770 cm BT /F0 36 Tf (Hello, World!) Tj\
    \ ET  \nendstream  \nendobj  \nxref  \n0 5  \n0000000000 65535 f  \n0000000015\
    \ 00000 n  \n0000000230 00000 n  \n0000000279 00000 n  \n0000000338 00000 n  \n\
    trailer  \n<< /Size 5 /Root 2 0 R>>  \nstartxref  \n440  \n%%EOF\n```\n"
