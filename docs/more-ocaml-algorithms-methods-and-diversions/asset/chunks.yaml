    \ or `Stroke`.\n\nAs an example, we will build a function to make a single line,\
    \ and use it to build a function which, given the page dimensions, draws a page\
    \ of graph paper. First, a function to build a single line from (x,y) to (x1,y1):\n\
    \n> ![](images/00035.jpg)\n\nNow, a function to return a set of equally spaced\
    \ floating-point values from 0…n given a step:\n\n> ![](images/00067.jpg)\n\n\
    Note that we have been careful to avoid repeated addition of floating-point values\
    \ – this can accumulate errors. We can build all the lines:\n\n> ![](images/00080.jpg)\n\
    \nHere is the result of `graph_string 595.28 841.89 10\\.` on a page of A4 paper:\n\
    \n![](images/00072.jpg)\n\nQuestions\n\n1.  Write a function which, given a centre\
    \ point and radius, returns a list of `Move`, `Line`, and `Close` elements which\
    \ represent a circle. Use a number of lines appropriate to the size of the circle.\n\
    \n2.  Use the function from the previous question to write a program which outputs\
