- fmt: "\n# Functions\nFunctions introduced by `let name argument1 argument2 … = expression`.\
    \ These have type `α → β`, `α → β → γ` etc. for some types `α`, `β`, `γ` etc.\
    \ For example, `let f a b = a > b` is a function of type `α → α → bool`.\n\nRecursive\
    \ functions, which are introduced in the same way, but using `let rec` instead\
    \ of `let`. For example, here is a function `g` which calculates the smallest\
    \ power of two greater than or equal to a given positive integer, using the recursive\
    \ function `f`:\n\n```ocaml\nlet rec f x y =\n  if y < x then f x (2 * y) else\
    \ y\nlet g z = f z 1\n```\n\nMutually recursive functions, introduced by writing\
    \ `let rec f x = …` and `g y = …` and `…`\n\n# Pattern Matching\nMatching patterns\
    \ using `match expression1 with pattern1 | … -> expression2 | pattern2 | … ->\
    \ expression3 | …`. The expressions `expression2`, `expression3` etc. must have\
    \ the same type as one another, and this is the type of the whole `match … with`\
    \ expression. The special pattern `_` which matches anything.\n\n```ocaml\nmatch\
    \ x with\n  0 -> 1\n| 1 | 2 -> 3\n| _ -> 4\n```\n\nMatching two or more things\
    \ at once, using commas to separate as in `match a, b with 0, 0 -> expression1\
    \ | x, y -> expression2 | …`：\n\n```ocaml\nmatch x, y, z with\n  0, 0, 0 -> true\n\
    | _, _, _ -> false\n```\n\n# Lists\nLists, which are ordered collections of zero\
    \ or more elements of like type. They are written between square brackets, with\
    \ elements separated by semicolons e.g. `[1; 2; 3; 4; 5]`. If a list is non-empty,\
    \ it has a head, which is its first element, and a tail, which is the list composed\
    \ of the rest of the elements.\n\nThe `::` “cons” operator, which adds an element\
    \ to the front of a list. The `@` “append” operator, which concatenates two lists\
    \ together.\n\n```ocaml\n1 :: [2; 3]\n[1; 2] @ [3]\n```\n\nLists and the `::`\
    \ “cons” symbol may be used for pattern matching to distinguish lists of length\
    \ zero, one, etc. and with particular contents. For example, we can calculate\
    \ the length of a list:\n\n```ocaml\nlet rec length l =\n  match l with\n    []\
    \ -> 0\n    | _::t -> 1 + length t\n```\n\n# Exceptions\nDefining exceptions with\
    \ `exception name`. They can carry extra information by adding `of` type. Raising\
    \ exceptions with `raise`. Handling exceptions with `try … with …`：\n\n```ocaml\n\
    exception Problem of int\n\nlet f x y =\n  if y = 0\n    then raise (Problem x)\n\
    \    else x / y\nlet g x y =\n  try f x y with Problem p -> p\n```\n\n# Partial\
    \ Application\nPartial application of functions by giving fewer than the full\
    \ number of arguments. Partial application with functions built from operators.\n\
    \n```ocaml\nlet add x y = x + y\nList.map (add 3) [1; 2; 3]\nList.map (( + ) 3)\
    \ [1; 2; 3]\n```\n\n# New Data Types\nNew types with `type name = constructor1\
    \ of type1 | constructor2 of type2 | …`. Pattern matching on them as with the\
    \ built-in types. Polymorphic types.\n\n```ocaml\ntype colour =\n  Red | Blue\
    \ | Green | Grey of int\n[Red; Blue; Grey 16] (* this has type colour list\n\n\
    type 'a tree =\n  Lf\n| Br of 'a tree * 'a * 'a tree\n```\n\nFor example, `Br\
    \ (Lf, 'X', Br (Lf, 'Y', Lf))` has type `char tree`. A useful built-in data type\
    \ is the option type, defined as `type 'a option = None | Some of 'a`. A type\
    \ can be polymorphic in more than one type parameter, for example `('a, 'b) Hashtbl.t`,\
    \ as in the Standard Library.\n\n# Basic Input / Output\nThe value `()` and its\
    \ type `unit`. Input channels of type `in_channel` and output channels of type\
    \ `out_channel`. Built-in functions such as `open_in`, `close_in`, `open_out`,\
    \ `close_out`, `input_char`, `output_char` etc. for reading from and writing to\
    \ them respectively.\n\n# Mutable State\nReferences of type `α ref`. Building\
    \ them using `ref`, accessing their contents using `!` and updating them using\
    \ `:=` operator.\n\n```ocaml\nlet p = ref 0\n# p := 5\n# !p\n```\n\nArrays of\
    \ type `α array` written like `[1; 2; 3]`. Creating an array with `Array.make`,\
    \ finding its length with `Array.length`, accessing an element with `a.(index)`.\
    \ Updating with `a.(index) <-`：\n\n```ocaml\nlet swap x y =\n  let t = a.(x) in\n\
    \  a.(x) <- a.(y)\n```\n\nBracketing expressions together with `begin` and `end`\
    \ instead of parentheses:\n\n```ocaml\nif x = y then\n  begin\n    a := b;\n \
    \   c := d\n  end\nelse\n  e := f\n```\n\nPerforming an action many times based\
    \ on a boolean condition with the `while expression done` construct:\n\n```ocaml\n\
    while x < y do !x * 2\n```\n\nPerforming an action fixed number of times with\
    \ a varying parameter using the `for name = start to end done` construct:\n\n\
    ```ocaml\nfor x = 1 to 10 do print_int x\n```\n\n# Floating-point Numbers\nFloating-point\
    \ numbers `min_float` … `max_float` of type `float`. Floating-point operators\
    \ `+.`, `*.`, `/.` and built-in functions `sqrt` etc.\n\n```ocaml\n2.0\n```\n\n\
    # OCam Standard Library\nUsing functions from OCam Standard Library with the form\
    \ `Module.function`. For example, `List.map`, `String.length`, `Array.copy` etc.\
    \ The `Buffer` module allows the efficient collation of strings into larger ones.\n\
    \n# Simple Modules\nWriting modules in `.ml` files. Building interfaces in `.mli`\
    \ files with the `val` keyword. For example, the `.ml` file with contents `let\
    \ f = x + 1` might have interface `val f : int`.\n\n# Compiling Programs\nThe\
    \ `ocamlc` and `ocamlopt` compilers. For example:\n`ocamlc -o x x.ml` builds `x`\
    \ (or `x.exe`) from `x.ml` with the bytecode compiler.\n`ocamlopt -o x x.ml` builds\
    \ `x` (or `x.exe`) from `x.ml` with the native code compiler.\n\n# Our Working\
    \ Environment\nEvery piece of code in an example, and every answer to an end-chapter\
    \ question can be downloaded from the book’s website at [`http://www.ocaml-book.com/](http://www.ocaml-book.com/)\
    \ and built on the reader’s machine. The programs should work on Unix (including\
    \ Linux), Mac OS X, and Microsoft Windows.\n\nSince several of our programs require\
    \ tail-recursive list functions, we provide a wrapper to the Standard Library\
    \ `List` module which provides them. In addition, three small utility functions\
    \ (`take`, `drop`, and `from`) are provided in a `Util` module. These modules\
    \ are contained in the module `More`. So, by writing `open More`, the `Util` module\
    \ is available, and all functions in the `List` module are tail-recursive.\n\n\
    If using OPAM, the OCaml Package Manager, this package may be installed by writing\
    \ `opam install more-ocaml`. Then (or by installing in another manner – see the\
    \ online resources for details) our modules are available in the top level:\n\n\
    ```ocaml\nOCaml\n# \"topfind\";\n- unit = ()\nFindlib has been successfully loaded.\
    \ Additional directives:\n  #require \"package\";; to load a package\n  #list;;\
    \ to list the available packages\n  #camlp4o;; to load camlp4 (standard syntax)\n\
    \  #camlp4r;; to load camlp4 (revised syntax)\n  #predicates \"p,q,...\"; to set\
    \ these predicates\n  #Topfind.reset(); to force that packages will be reloaded\n\
    \  #thread;; to enable threads\n```\n\nThey are also available when compiling\
    \ stand-alone programs with the bytecode compiler `ocamlc` or the native code\
    \ compiler `ocamlopt`:\n\n```bash\nocamlfind oamlc -package more program.ml -linkpkg\
    \ -o program\nocamlfind oamlopt -package more program.ml -linkpkg -o program\n\
    ```\n"
  raw: 'Functions, introduced by `let` name argument1 argument2 … `=` expression.
    These have type α → β, α → β → γ etc. for some types α, β, γ etc. For example,
    `let f a b = a > b` is a function of type α → α → bool.


    Recursive functions, which are introduced in the same way, but using `let rec`
    instead of `let`. For example, here is a function `g` which calculates the smallest
    power of two greater than or equal to a given positive integer, using the recursive
    function `f`:


    `let rec f x y =`


    `  if y < x then f x (2 * y) else y`


    `let g z = f z 1`


    Mutually recursive functions, introduced by writing `let rec f x = …  and g y
    = … and …`


    Pattern Matching


    Matching patterns using `match` expression1 `with` pattern1 `|` … `->` expression2
    `|` pattern2 `|` … `->` expression3 `|`…The expressions expression2, expression3
    etc. must have the same type as one another, and this is the type of the whole
    `match` … `with` expression. The special pattern `_` which matches anything.


    `match x with`


    `  0 -> 1`


    `| 1 | 2 -> 3`


    `| _ -> 4`


    Matching two or more things at once, using commas to separate as in `match a,
    b with 0, 0 ->` expression1 `| x, y ->`  expression2 `|` …


    `match x, y, z with`


    `  0, 0, 0 -> true`


    `| _, _, _ -> false`


    Lists


    Lists, which are ordered collections of zero or more elements of like type. They
    are written between square brackets, with elements separated by semicolons e.g.
    `[1; 2; 3; 4; 5]`. If a list is non-empty, it has a head, which is its first element,
    and a tail, which is the list composed of the rest of the elements.


    The `::`“cons” operator, which adds an element to the front of a list. The `@`
    “append” operator, which concatenates two lists together.


    `1 :: [2; 3]` ![](images/00218.jpg)`[1; 2; 3]`


    `[1; 2] @ [3]` ![](images/00034.jpg)`[1; 2; 3]`


    Lists and the `::` “cons” symbol may be used for pattern matching to distinguish
    lists of length zero, one, etc. and with particular contents. For example, we
    can calculate the length of a list:


    `let rec length l =`


    `  match l with`


    `    [] -> 0`


    `  | _::t -> 1 + length t`


    Exceptions


    Defining exceptions with `exception` name. They can carry extra information by
    adding `of` type. Raising exceptions with `raise`. Handling exceptions with `try`
    … `with` …


    `exception Problem of int`


    `let f x y =`


    `  if y = 0`


    `    then raise (Problem x)`


    `    else x / y`


    `let g x y =`


    `  try f x y with Problem p -> p`


    Partial Application


    Partial application of functions by giving fewer than the full number of arguments.
    Partial application with functions built from operators.


    `let add x y = x + y`


    `List.map (add 3) [1; 2; 3]`


    ![](images/00008.jpg)`[4; 5; 6]`


    `List.map (( + ) 3) [1; 2; 3]`


    ![](images/00054.jpg)`[4; 5; 6]`


    New Data Types


    New types with `type` name `=` constructor1 `of` type1 `|` constructor2 `of` type2
    `|` … Pattern matching on them as with the built-in types. Polymorphic types.


    `type colour =`


    `  Red | Blue | Green | Grey of int`


    `[Red; Blue; Grey 16]` this has type colour list


    `type ''a tree =`


    `   Lf`


    `| Br of ''a tree * ''a * ''a tree`


    For example, `Br (Lf, ''X'', Br (Lf, ''Y'', Lf))` has type char tree. A useful
    built-in data type is the option type, defined as `type ''a option = None | Some
    of ''a`. A type can be polymorphic in more than one type parameter, for example
    `(''a, ''b) Hashtbl.t`, as in the Standard Library.


    Basic Input / Output


    The value `()` and its type unit. Input channels of type in_channel and output
    channels of type out_channel. Built-in functions such as `open_in`, `close_in`,
    `open_out`, `close_out`, `input_char`, `output_char` etc. for reading from and
    writing to them respectively.


    Mutable State


    References of type α ref. Building them using `ref`, accessing their contents
    using `!` and updating them using the `:=` operator.


    `# let p = ref 0;;  `


    `val p : int ref = {contents = 0}  `


    `# p := 5;;  `


    `- : unit = ()  `


    `# !p;;  `


    `- : int = 5`


    Arrays of type α array written like `[|1; 2; 3|]`. Creating an array with the
    built-in function `Array.make`, finding its length with `Array.length`, accessing
    an element with `a.(`subscript`)`. Updating with `a.(`subscript`)` `<-` expression.


    `let swap a x y =`


    `  let t = a.(x) in`


    `    a.(x) <- a.(y); a.(y) <- t`


    Bracketing expressions together with `begin` and `end` instead of parentheses
    for readability.


    `if x = y then`


    `  begin`


    `    a := b;`


    `    c := d`


    `  end`


    `else`


    `  e := f`


    Performing an action many times based on a boolean condition with the `while`
    boolean expression `do` expression `done` construct.


    `while !x < y do x := !x * 2 done`


    Performing an action a fixed number of times with a varying parameter using the
    `for` name `=` start `to` end `do` expression `done` construct.


    `for x = 1 to 10 do print_int x done`


    Floating-point Numbers


    Floating-point numbers `min_float` … `max_float` of type float. Floating-point
    operators `+. *. -. /. **` and built-in functions `sqrt log` etc.


    `2. ** 0.2` ![](images/00299.jpg)`1.1486983549970351`


    The OCaml Standard Library


    Using functions from the OCaml Standard Library with the form Module`.`function.
    For example, `List.map`, `String.length`, `Array.copy` etc. The Buffer module
    allows the efficient collation of strings into larger ones.


    Simple Modules


    Writing modules in `.ml` files. Building interfaces in `.mli` files with types
    and the `val` keyword. For example, the `.ml` file with contents `let f x = x
    + 1` might have the interface `val f : int ->` `int`


    Compiling Programs


    The `ocamlc` and `ocamlopt` compilers. For example:


    `ocamlc -o x x.ml` builds `x` (or `x.exe`) from `x.ml` with the bytecode compiler.


    `ocamlopt -o x x.ml` builds `x` (or `x.exe`) from `x.ml` with the native code
    compiler.


    Our Working Environment


    Every piece of code in an example, and every answer to an end-of-chapter question
    can be downloaded from the book’s website at [`http://www.ocaml-book.com/`](http://www.ocaml-book.com/)
    and built on the reader’s machine. The programs should work on Unix (including
    Linux), Mac OS X, and Microsoft Windows.


    Since several of our programs require tail-recursive list functions, we provide
    a wrapper to the Standard Library List module which provides them. In addition,
    three small utility functions (`take`, `drop`, and `from`) are provided in a Util
    module. These modules are contained in the module More. So, by writing `open More`,
    the Util module is available, and all functions in the List module are tail-recursive.


    If using OPAM, the OCaml Package Manager, this package may be installed by writing
    `opam install` `more-ocaml`. Then (or by installing in another manner – see the
    online resources for details) our modules are available in the top level:


    `        OCaml  `


    `# #use "topfind";;  `


    `- : unit = ()  `


    `Findlib has been successfully loaded. Additional directives:  `


    `  #require "package";;      to load a package  `


    `  #list;;                   to list the available packages  `


    `  #camlp4o;;                to load camlp4 (standard syntax)  `


    `  #camlp4r;;                to load camlp4 (revised syntax)  `


    `  #predicates "p,q,...";;   to set these predicates  `


    `  Topfind.reset();;         to force that packages will be reloaded  `


    `  #thread;;                 to enable threads  `


    `- : unit = ()  `


    `# #require "more";;  `


    `/Users/john/.opam/4.02.0/lib/ocaml/more.cma: loaded  `


    `/Users/john/.opam/4.02.0/lib/more: added to search path  `


    `# open More;;  `


    `# Util.take;;  `


    `- : ''a list -> int -> ''a list = <fun>`


    They are also available when compiling stand-alone programs with the bytecode
    compiler `ocamlc` or the native code compiler `ocamlopt`:


    `ocamlfind ocamlc -package more program.ml -linkpkg -o program  `


    `ocamlfind ocamlopt -package more program.ml -linkpkg -o program`


    Further instructions, including for use on platforms where OPAM is not supported,
    are given in the online resources.


    Timing with the Unix module'
