    ![](img/image_rsrc376.jpg)


    # 初学者 C++：一步步学习，通过初学者实用示例学会使用 C++ 编程语言


    ## 描述

    `C++` 是一种计算机编程语言。它的开发是为了对当时的 `C` 编程语言进行改进。`C` 是一种结构化编程语言，而 `C++` 是一种面向对象的编程语言。这意味着
    `C++` 为 `C` 编程语言引入了面向对象的编程特性。面向对象编程涉及将项目视为对象，这正是 `C++` 的做法。它是一种大小敏感的编程语言，意味着它区分大写和小写字母。在
    `C++` 中命名和引用/调用对象时必须格外小心，以便根据定义使用正确的大小来调用它们。


    要使用 `C++` 进行编程，你只需要文本编辑器和一个 `C++` 编译器。文本编辑器将为你提供一个编写 `C++` 程序的环境。建议你的 `C++` 源文件使用
    `.cpp` 扩展名，以标记它们为 `C++` 文件。这是 `C++` 编译器默认使用的扩展名。`C++` 编译器的目的是处理你的 `C++` 源文件并给你结果。取决于你电脑上使用的操作系统类型，有许多方法可以将这些内容导入你的计算机。对于文本编辑器，你可以使用基础工具，如
    Windows 上的 `Notepad` 以及适用于 Windows 和 Linux/Unix 的 `vim`。一旦配置好这些工具，你就可以在电脑上编写、编译并执行
    `C++` 程序了。


    本指南将关注以下内容：

    * C++ 函数

    * 运算符

    * 存储类

    * 标识符

    * C++ 中的决策控制

    * 使用 Switch 语句

    * 文件的读写

    * 关于函数与数据类型的更多内容

    * 常量与字面量

    * 有符号与无符号数据类型

    * 类介绍

    * 更深层的类概念

    * 面向对象编程

    * 进阶技巧

    * C++ 中的多线程应用……以及更多！！！


    ## 引言

    `C++` 是一种通用语言，可以处理各种大型系统，也可以较小的系统。它在创建商业应用时是一种主流的语言。有大量使用 `C++` 编写的项目，包括：

    * 操作系统，如 `Linux` 和 `Mac OS X`

    * 游戏，如《魔兽世界》和《暗黑破坏》系列

    * 热门 `Wii`、`PlayStation` & `XBOX` 游戏

    * 编程语言的虚拟机（这些语言包括 `Python`、`Java`、`Rudy`、`PFP`、`Perl`）

    * 热门软件，如 `MS Office`、`Adobe Photoshop`、`Inventor` 和 `AutoCAD`

    * 浏览器（`Chrome`、`Internet Explorer` 和 `Firefox`）

    * 许多 Apple iOS 应用程序'
- fmt: "\nThis list proves that C++ is a general language that has the power to do\
    \ almost anything. If you’re wondering if C++ will still be relevant tomorrow\
    \ or in the next 10 years, the answer is YES! C++ in conjunction with its predecessor\
    \ C provide access to hardware and a high level of abstraction. It is the third\
    \ most used language after C, which falls behind Java as the number one. As of\
    \ now there is no rival in place to replace `C++`.\n\n# Chapter 1: C++ Functions\n\
    \nA function refers to a set of statements that perform related tasks. Every program\
    \ in C++ has at least one function, which is the `main()` function and it is possible\
    \ for more functions to be defined within the program. A C++ program can be subdivided\
    \ into a set of functions. The way you sub-divide the code lies up to you, but\
    \ it should be done in such a way that every function performs a certain task.\
    \ When such code is grouped together and given a name, it becomes easy for you\
    \ to reuse the code calling and calling it again through the function name. Again,\
    \ the code will become optimized since there will be no need for you to write\
    \ it again.\n\nSuppose your goal is to check three numbers, 150, 230 and 450 to\
    \ tell whether they are even or not. Without the use of a function, you will have\
    \ to write the logic for the even number each time. This will be a repetition\
    \ of code. However, by use of a function, you can write the logic only once and\
    \ keep on calling it.\n\n## Function Declaration\n\nThe work of a function declaration\
    \ is to tell the C++ compiler about the name of the function, its return type\
    \ and parameters. To define a function in C++, we use the following syntax:\n\n\
    ```cpp\nreturnType functionName( dataType parameter...)    \n{\n    //function\
    \ body code\n}\n```\n\nFrom the above syntax, you can tell that a function definition\
    \ is made up of a header and function body. A function can return any value. The\
    \ `returnType` denotes the data type of the value returned by the function. However,\
    \ there are functions that will perform their tasks without returning values.\
    \ In such a case, the return type should be `void`.\n\nThe `functionName` is the\
    \ name of the function. The `functionName` together with the parameter list form\
    \ the function signature. See a parameter as a placeholder. When you invoke a\
    \ function, you pass a value to the parameter. The value will be the actual parameter\
    \ or argument. Note that each parameter is associated with a data type. Also,\
    \ note that there are functions without parameters. The function body should have\
    \ statements defining what the function should when invoked.\n\nHere is an example\
    \ of a simple function:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    void myFunc() { \n    static int x = 0 ; //static variable\n    int y = 0 ; //local\
    \ variable\n    x++;\n    y++;\n    cout << \"x is: \" << x << \" and y is: \"\
    \ << y << endl ; \n}\nint main()\n{\n    myFunc();\n    myFunc();\n    myFunc();\n\
    }\n```\n\nThe code should print the following output when executed: We have defined\
    \ a function named `myFunc()`. The function takes no parameters and it is of `void`\
    \ type, meaning that it returns nothing. Within the body of the function, we have\
    \ defined one static variable `x` and one variable `y`. Their values have been\
    \ initialized to 0. We have then called the increment operator on each of these\
    \ two variables.\n\nWe have ended the body of the function `myFunc()`. Within\
    \ the `main()` method, we have invoked the function `myFunc()` three times. Note\
    \ that no parameter values have been passed during the invocation as our function\
    \ takes no parameter. Since `x` is a static variable, the statement `x++` will\
    \ increase the value of `x` by 1 per invocation, meaning we will get 1, 2 and\
    \ 3. This will be different for variable `y` as it has not been marked as static.\
    \ It will return 1, 1 and 1 for the three invocations. You now know why we have\
    \ the above output.\n\nLet us create an example of a function that takes in parameters:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n// declare the function maxNum()\n\
    int maxNum( int x, int y);\nint main () {\n// declare local variables\nint p;\n\
    int q;\nint max;\n// call the function to get the maximum value.\nmax = maxNum(\
    \ 5 , 12 );\ncout << \"The maximum value is : \" << max << endl ;\nreturn 0 ;\n\
    }\n// function returning the max between two numbers\nint maxNum( int x, int y)\
    \ {\n// local variable declaration\nint result;\nif ( x > y)\nresult = x;\nelse\n\
    result = y;\nreturn result; \n}\n```\n\nThe code should return the following as\
    \ the result: We began by declaring a function named `maxNum()` taking two integer\
    \ arguments, `x`, and `y`. The function is of integer data type, meaning that\
    \ its return value will be an integer. Within the `main()` method, we have invoked\
    \ this function in the following line: `max = maxNum( 5 , 12 );`. What happens\
    \ is that we have called the function and passed to it the value of the arguments.\
    \ In the above line, the value of parameter `x` is 5 while that of parameter `y`\
    \ is 12. Order is very important. The result will be assigned to the variable\
    \ named `max`.\n\nLastly, we have implemented the logic for our function. We want\
    \ our function to return the larger of the two integers that we pass to it. The\
    \ largest integer will be stored in the variable `result`. If the value of `x`\
    \ is greater than that of `y`, then `x` will become the `result`. If `y` is greater\
    \ than `x`, then `y` will become the `result`. That is what we have done in the\
    \ function body. In our above call, the function compared 5 and 12. 12 was found\
    \ to be the largest, hence, it became the result.\n\nFor any function that accepts\
    \ arguments, it must declare the variables that will be accepting the values of\
    \ the arguments. The variables are referred to as the formal parameters of the\
    \ function. The formal parameters exhibit similar behavior as other local variables\
    \ in the function and their creation happens after entry into the function and\
    \ they are destroyed upon exit.\n\nThere are various ways through which we can\
    \ pass the values of the arguments to the function.\n\n### Call by Value\n\nThis\
    \ mechanism involves copying of the actual values to the formal parameters of\
    \ the function. Any changes made to the parameters inside the function will have\
    \ no impact on the argument. This is the default parameter used in C++. This means\
    \ that the code in the function cannot change the arguments. Let us create a simple\
    \ example to demonstrate this:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nvoid substitute( int value);\nint main()\n{\n    int value = 2 ;\n   \
    \ substitute( value);\n    cout << \"The value is: \" << value<< endl;\n    return\
    \ 0 ;\n}\nvoid substitute( int value)\n{\n    value = 10 ;\n}\n```\n\nThe code\
    \ should return the following output: We have defined a function named `substitute()`\
    \ that takes one integer argument named `value`. In the implementation of the\
    \ function, we have set the value to 10. However, in the `main()` method, we changed\
    \ this to 2. That is why we have the above output. The pass by value was implemented\
    \ in the following lines: `int value = 2; substitute( value );`. We initialized\
    \ the value and passed to the function. That is how simple pass by value.\n\n\
    ### Call by Pointer\n\nThis mechanism involves copying the address of the argument\
    \ into the formal parameter. This address is then used to get the actual value\
    \ of the argument inside the function. This means that if a change is done to\
    \ the parameter, the argument will be affected. To pass a value by pointer, the\
    \ argument should be passed to the functions similarly to any other value. This\
    \ means that the function parameters should be defined as pointer types as demonstrated\
    \ in the following snippet:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    // declare a function\nvoid interchange( int * a, int * b);\nint main () {\n//\
    \ declare local variable\nint x = 5 ;\nint y = 12 ;\ncout << \"Before the interchange,\
    \ the value of x is :\" << x << endl ;\ncout << \"Before the interchange, the\
    \ value of y is :\" << y << endl ;\n/* call the function to interchange the values.\n\
    &x indicates pointer to x, is, address of variable x and\n&y indicates pointer\
    \ to y, is, address of variable y.*/\ninterchange(& x, & y);\ncout << \"After\
    \ the interchange, the value of x is :\" << x << endl ;\ncout << \"After the interchange,\
    \ the value of y is :\" << y << endl ;\nreturn 0 ;\n}\n// defining a function\
    \ to swap values.\nvoid interchange( int * a, int * b) {\n    int temp;\n    temp\
    \ = *a ; /* save value at address a */\n    *a = *b ; /* put b into a */\n   \
    \ *b = temp ; /* put a into b */\n}\n```\n\nThrough call by pointer, we were able\
    \ to interchange the values stored in the different addresses. The code returns\
    \ the following upon execution:\n\n### Call by Reference\n\nIn call by reference,\
    \ the reference of an argument is copied to the formal parameter. Inside the function,\
    \ we use the reference to access the actual argument that has been used in the\
    \ call. This is an indication that the changes that have been made to the parameter\
    \ will affect the argument. To pass a value by reference, the argument is passed\
    \ to the functions similarly as any other value. This means that the function\
    \ parameters have to be declared as reference types as demonstrated in the following\
    \ example:\n\n```cpp\n// define a function to interchange values\nvoid interchange(\
    \ int & a, int & b) {\n    int temp;\n    temp = a ; /* store the value at address\
    \ a */\n    a = b ; /* put b into a */\n    b = temp ; /* put a into b */\n}\n\
    ```\n\nAgain, we have the `interchange()` function that swaps the two values.\
    \ Let us now see: `int x = 5 ;\nint y = 12 ;\ncout << \"Before the interchange,\
    \ the value of x is :\" << x << endl ;\ncout << \"Before the interchange, the\
    \ value of y is :\" << y << endl ;\n/* call the interchange function to swap the\
    \ values through reference.*/\ninterchange( x, y);\ncout << \"After the interchange,\
    \ the value of x is :\" << x << endl ;\ncout << \"After the interchange, the value\
    \ of y is :\" << y << endl;\nreturn 0 ;\n```\n\nThe code should return the following\
    \ output upon execution: That is how pass by reference works in C++.\n\n### Default\
    \ Values for Parameters\n\nAfter defining a function, it is possible for you to\
    \ define the default values for the parameters. In such a case, the default value\
    \ will be used as the value of the parameter when you call the function without\
    \ passing the value of that parameter. To assign default values for parameters,\
    \ you use the assignment operator during the function definition. When no value\
    \ is specified, that default value will be used as the value of the parameter.\
    \ However, if you pass a value for the parameter, the default value will be ignored\
    \ and the passed value will be used instead.\n\nThe following example demonstrates\
    \ this:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint product( int\
    \ x, int y = 10 ) {\n    int result;\n    result = x * y ;\n    return ( result);}\n\
    }\nint main () {\n// declare a local variable\nint x = 12 ;\nint y = 5 ;\nint\
    \ result;\n// call the product function to multiply the values.\nresult = product(\
    \ x, y);\ncout << \"The product is :\" << result << endl;\n// call the product\
    \ function with one argument only\nresult = product( x);\ncout << \"The product\
    \ is :\" << result << endl;\nreturn 0 ;\n}\n```\n\nThe code should return the\
    \ following result when executed: \n\nConsider the following statement extracted\
    \ from the code: `int product( int x, int y = 10 )`. Above, we are defining a\
    \ function named `product()` that takes two integer arguments, `x`, and `y`. If\
    \ we don’t pass a value for the parameter `y` during the function call, then the\
    \ parameter `y` will be assigned a default value of 10.\n\nThe function has been\
    \ called for the first time in the following line: `result = product( x, y);`.\
    \ Above, the value of `x` is 12 while that of `y` is 5. When the two are multiplied,\
    \ we get a result of 60, hence the source of the first line in the above output.\
    \ The default value for parameter `y`, which is 10, has been ignored because we\
    \ have specified a value for the parameter during the call.\n\nWe have called\
    \ the same function for the second time in the following line: `result = product(\
    \ x);`. Above, we have called the `product()` function but we have only passed\
    \ one parameter to it, `x`. The value of `x` is still 12. Since we have not specified\
    \ the value for parameter `y`, its default value of 10 specified during the declaration\
    \ of the function will be used. The two are multiplied to return a result of 120.\
    \ The default value for the parameter has been used since we did not specify its\
    \ value during the call.\n\n# Chapter 2: Operators\n\nThere are various types\
    \ of operators available in C++. The operators help in carrying out various operations\
    \ on the defined variables in a C++ program. Let’s look at each of the operators\
    \ in more detail.\n\n## Arithmetic operators\n\nThese are operators that are used\
    \ to work with numbers. The most common operators are shown below.\nArithmetic\
    \ operators\n"
