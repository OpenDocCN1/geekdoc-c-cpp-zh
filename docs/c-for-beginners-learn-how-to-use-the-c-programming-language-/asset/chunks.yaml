  trans: "\n\n这里是 `C++14` 提供的主要库功能列表，此外还有许多较小的库新增。\n\n### 用户自定义字面量 (User Defined Literals)\n\
    `C++14` 添加了许多后缀，用于指定定义字面量的类型。这些后缀的示例包括 `'s'` 或 `'st'`。这用于字符和字符串类型。给定示例的最后一行将报错错误。这是因为\
    \ `str` 将被确定为 `'const char*'` 类型，而 `str1` 将被确定为 `string`。以下后缀——'h'`、`min'`、`s'`、`ms'`、`us'`、`ns'`\
    \ 用于表示不同的时间间隔类型。\n\n### 二进制字面量 (Binary Literals)\n在 `C++14` 二进制字面量出现之前，像 `11111101`\
    \ 这样的格式是不支持的。为了使用它们，需要将它们转换为支持的类型。下面的代码段展示了如何在编程中使用它们。二进制字面量以 `0b` 或 `0B` 开头，随后跟是一系列\
    \ 0 和 1。在许多其他编程语言中也可以找到类似的语法。这些编程语言包括 `Java`、`Perl` 和 `Python`，它们都提供了对二进制字面量的支持。二进制字面量的类型为\
    \ `int`。在所有接受常量字面量的地方都可以使用它。\n\n### 变量模板 (Variable Template)\n变量模板的设计目的是让编码更容易，并简化常量的定义和使用。变量模板本质上是一组变量的定义。变量模板是在声明变量的地方使用模板声明来创建的。这些只是\
    \ `C++14` 引入的特性。还引入了许多其他特性，但并不是重大的进展。`C++14` 包含的一些次要特性包括带尺寸的初始化（sized deal locations）和一些语法清理。尽管\
    \ `C++14` 的版本更新相比于 `C++11` 的重大更新，但它是必要的。\n\n# 第 18 章：游戏设计\n\n## 游戏设计简介\n到此时，你已经学会了如何在\
    \ `C++` 中完成很多事情，并且实际上已经学会了这本书所提供的所有内容。本单元专门用于制作一些你在互联网断开时可以玩玩的电脑游戏。你不会从这里学到很多，但这更多是一种获得经验的方式。这些游戏可以打时间，并在网络恢复之前玩起来很有趣。你将专注于易制作的游戏。每一次，代表性的游戏将更深入地关注复杂主题和用户关系。接下来的所有游戏都将是人机模式，所以你不需要担心带朋友一起玩。不过，你可以修改游戏以具有多人模式，但对于一个良好的基础草案来说，这不是一个大要求。\n\
    \n### 用户友好性 (User-Friendliness)\n用户友好性是评估你的程序易用程度时使用的术语。即使你做了一个非常复杂的程序，用户在使用时也应该有一个实际的体验。混乱的控制和有限的输入想法会让用户感到困惑，用户将不喜欢你的程序，你会感到难过，因为你的程序由于没人喜欢而失败了。这里只是让程序更具友好性的一个例子。假设你有一个程序来显示一些偶数，这里是程序运行时的样子。\n\
    \n假设有人看到了那个程序。我们不能假设用户自动知道这些是偶数。一个可行的方案是说明这些是偶数。\n\n现在看起来好一点了。这是让你的程序增色、使其看起来更酷炫的好方法。用户现在知道显示的是什么。记住保持这些信息简单简短。不要写长描述，但要清楚用户需要知道正在发生什么。\n\
    \n### 正反面 (Heads or Tails)\n这是你将制作的第一个游戏。它涉及一些你需要找回的基本技能。希望到这里你没有忘记任何东西。\n\n游戏基础：硬币有两个面。有一个正面和一个反面。稍后，硬币将被抛向空中并落在正面或反面。在投掷之前，你必须猜硬币会落在正面还是反面。硬币投出。如果落在你猜的一面，你就赢了游戏。否则你就输了。\n\
    \n你所有的实际代码都将在 `main` 方法中实现。不过，如果你真的想，可以将其将其放在 `function` 中。\n\n从你需要的逻辑开始。由于你需要东西来决定硬币落在正面还是反面，随机数生成器效果最好，因为它产生随机值，就像硬币会落在随机的一面一样。因此，在顶部包含\
    \ `Time` 和 `Stdlib` 库。现在让我们用问候欢迎用户，让他们知道正在玩游戏。`getch()` 是暂停程序直到用户按下“回车”的命令。在上方，你需要包含\
    \ `Conio` 库（`<conio.h>`），因为它持有 `getch()` 命令。否则，这是一个启动简单“基于文本”游戏的得当方法。\n\n现在是时候玩真正的游戏了。询问玩家他或她选择正面还是反面，让用户输入选择。现在，决定硬币落在正面还是反面。这是通过随机数生成器完成的。即使数字并不一定代表硬币的实际面。你可以自己分配。在这种情况下，数字\
    \ 1 是正面，2 是反面。所以制作一个在 1 和 2 之间的随机数生成器。抛掷硬币后，现在是决定胜者的时间了。这是通过告诉用户选了什么以及电脑选择了什么来完成的。注意你必须一直输入你的选择，但可以编辑程序以接受如‘Heads’、‘HEADS’甚至‘Heads’的结果。\n\
    \n### 石剪刀布 (Rock Paper Scissors)\n这与你刚刚制作的游戏非常相似，但有一些复杂性。游戏基础：两个玩家都有机会选择石头、纸或剪刀。同时，每个玩家用手势显示。玩家的选择决定了谁胜负。例如，如果玩家\
    \ 1 选择石头，玩家 2 选择剪刀，玩家 1 将赢，因为石头赢剪刀。如果两个玩家选择相同的物体，游戏平局结束。\n\n### 猜数字 (Guess the\
    \ Number)\n这是你从书中完成的最后一个项目。游戏基础：一个人想一个 1-100 之间的随机数，另一个人要在 10 次机会内猜中。每次如果不正确，都会告诉用户高还是低，如果玩家在\
    \ 10 次内猜失败，就输了。在这种情况下，你必须猜电脑选择的数字。从大纲开始。另一种方法是让用户输入。创建一个变量来告诉玩家猜了多少次。现在从 0 开始。在游戏中会有某种循环。重复命令让用户再次尝试，直到他们用完机会。判断数字是高、低还是等于隐藏数字涉及到条件语句。如果用户猜对了，就不需要使用循环，将使用\
    \ `break` 语句。回来看，循环是这样的。你需要检测玩家是通过猜数字赢了，还是用完机会输了。\n\n### 龙之对决 (Dragon Clash)\n\
    Dragon Clash 是作者制作的游戏。这是一个基于文本的战斗游戏，其中两条龙——光龙和暗龙交替攻击对方或自己，直到其中一个没有了力量。这在本地商店可能值\
    \ 60 美元，但玩起来应该很有趣。这个整个游戏花了他几天，想想创建这种东西花了多久。关于这个没有官方教程。你将得到一个完整的游戏。\n\n# 第 19 章：项目：通讯录\
    \ (Project: Agenda)\n对于这个项目，我们将模拟一个电话通讯录，就像你家里那种，并用它记录你需要的所有重要号码，但我们将使用 `C++`\
    \ 实现。对于每个联系人，将存储他们的名字和电话（你可以添加任意数量的字段）。此外，我们将使用 `C++` 标准模板库的新强大特性：`vector`。\n\n\
    使用 vector\n想象这个通讯录将有 100 个电话号码。你会为数字声明 100 个变量吗？再为名字声明 100 个？当然不。这里是 `vector`\
    \ 完美适用的地方。通过 `vector`，你可以插入任意数量的元素。在 `C++` 中使用 `vector` 必须在代码中添加 `<vector>` 库。我们还需要\
    \ `iostream` 和 `string`。\n\n```cpp\n#include <iostream>\n#include <string>\n#include\
    \ <vector>\nusing namespace std;\n```\n\n在 `namespace std` 之后，我们将声明我们的 `vector`。它们将位于\
    \ `main` 函数之外。在 `main`（或任何 `function`）之外声明变量意味着该变量是全局的。换句话说，任何人都可以对其进行读写。\n\n\
