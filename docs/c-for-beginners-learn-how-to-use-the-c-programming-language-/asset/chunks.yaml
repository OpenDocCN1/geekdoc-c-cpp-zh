    # Chapter 15: Multithreaded Applications in C++


    If you are a pro in C++ programming or you have been building software for the
    past five years, chances are that you know Win32 threads. One of the greatest
    challenges that you have experienced when you create cross-platform software using
    C++ has been about threading in the right way. Since a lot of systems have different
    methods of multithreading, your source code can get muddy with all different kinds
    of preprocessor conditions that define the behavior of each platform.


    C++ has something called `std::thread`. The good thing is that any C++ compiler
    can implement this thread. So if you are being pressured to use `Dev-C++`, then
    it is high time you should consider something else. Let’s assume now that you
    have a compiler that will help you instead of dragging you behind. The best way
    to write the threaded software in C++ language is by using API. It is not right
    to throw some lines of code at you and let you alone digest the rest.


    ### What are threads?

    There are a lot of resources online that talk about threads and it is good to
    read some of them. Let’s get back to the main issue. Threads support software
    so that it can run in different processors simultaneously and in parallel. Well,
    it sounds good, right? Although it is something good, still it comes with some
    problems. This makes it hard to think about performance when you don’t have a
    well-defined design. If you are still not okay with what threads are and why they
    are that useful, then you should take time and read some brief articles about
    threads.


    ### Consume, Produce

    One of the most popular examples of multithreading is the producer-consumer example.
    In other words, there is one thread which releases values for one to compute and
    the other thread receives the values to use it. This is a normal description that
    anyone can figure out.


    In this example, you will realize that there are three related thread constructs.
    The three threads are explained below:


    - `std::mutex`: This represents a single mutex. It is an object that gives access
    to a single thread in a given section.

    - `std::lock_guard`: This locks a mutex that is in the scope. Once it is out of
    scope it is removed.

    - `std::thread`: This displays a single thread executed.


    The producer in this program increases the shared data object to 5 while the main
    thread increases the data object until the 5 is defined by the producer thread.
    The most interesting thing is the way in which it is easy to create a thread,
    most specifically when you want to initialize a `std::thread`. What is done is
    to provide a function for the thread to implement plus its function arguments.
    In addition, the global mutex helps protect data from multiple modifications.
    Lastly, use `{...}` to define explicit scopes while `std::lock_guard` should control
    access.


    ### Two Tasks: One Process

    What if you are writing software that is parallel? The example used requires one
    to build a distinct function in parallel for two separate values. This is the
    best case to use a Future object to complete the asynchronous computation.


    A future is an object that ensures the right value exists depending on the type
    of computation. This object resembles a placeholder value. It helps a programmer
    to start a computation and confirm a result that has been produced. To be precise,
    asynchronous result develops future objects. The `std::promise`, `std::async`,
    and `std::packaged_task` represent the interfaces that allow the implementation
    of a `get_future()` method.


    - `std::async`: This is an advanced method which provides a value for the future
    and creates the least flexibility. Besides that, it is the easiest way to implement
    asynchronous computation. You need to remember that this method does not resemble
    other objects.

    - `std::promise`: It presents a value to the future.

    - `std::packaged_task`: It is among the best ways one can deliver a future value.


    # Chapter 16: War with bugs


    It is very frustrating to spend more time searching for and removing bugs than
    writing your C++ programs. Therefore, the following suggestions can help you reduce
    the errors and make programming a great experience.


    ### Develop a clear and consistent style of coding

    By choosing to write C++ programs in a way that is consistent and clear not only
    improves the ease of another programmer going through your program but it also
    reduces coding mistakes. Therefore, when you read a neat and clear code that follows
    a given style, you will spend a little amount of time to parse the syntax of the
    C++ statements. This leaves you with a lot of energy to decide what your program
    is going to do and how it is going to do it.


    A proper coding style should have the following characteristics:


    1. Understand how the function, class, and object are used depending on their
    name.

    2. Distinguish between object names, function names, and class names.

    3. Distinguish between preprocessor symbols from the C++ symbols.

    4. Search the same level for blocks of code.

