    \ animal::name is private”的错误。完美。这完全是应该发生的，因为现在我们必须修复它。这就是整个访问描述概念出现的地方。\n\n修改你的类，使其看起来像这样：\n\
    \n```cpp\nclass animal {\npublic:\n    string name;\n};\n```\n\n然后尝试编译。这次应该可以正常运行。这是因为我们将字符串“name”设为公共了，这意味着类本身之外的其他方法/函数可以访问它。尽管这通常被认为是坏习惯，所以我们将这样重写类：\n\
    \n```cpp\nclass animal {\nprivate:\n    string name;\n};\n```\n\n修改类内值的最佳实践是使用\
