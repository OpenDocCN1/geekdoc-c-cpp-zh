    \ Classes language?\n5. What is the header used in most functions?\n\n**Answers**\n\
    1. The blank spaces or comments that the compiler ignores\n2. `Cout <<x=y+1;>>`\n\
    3. A sequence of three characters that represent a single character\n4. Bjarne\
    \ Strousup\n5. `<iostream>`\n\n# Chapter 5: Decision Control in C++\n\nThe next\
    \ topic that we are going to discuss is how to work with the conditional statements\
    \ or the ‘decision control’ statements. There are times when you are working on\
    \ a program, and you want to make sure that it is capable of making some decisions\
    \ for you even when you’re not there. This could happen when you would like the\
    \ user or another programmer to put in some information, and then you want the\
    \ program to respond based on the conditions that you set.\n\nYou can get the\
    \ program to act a certain way based on the conditions that you add to the code.\
    \ The decision making capability is a great way to ensure that the program does\
    \ what you would like it to do even though it is a bit more complicated, there\
    \ is a ton of times when you might want to add this to your code so learning it\
    \ at this point can be a great idea.\n\nThere are a few different types of decision\
    \ control statements that you can work with. For example, you can choose to go\
    \ with one that only allows you to get one answer and call it right. There are\
    \ conditional statements that will give out an answer based on the various answers\
    \ that the user will put in. Or you could end up with one that gives out a list,\
    \ like a menu of items and you can let the user pick from there.\n\n### Switch\
    \ statements\nThe first type of conditional statements that you can work with\
    \ is the switch statements. These statements can help you out a lot because they\
    \ will allow you to check out whether your variable has an equal value against\
    \ the other values or the other cases that you outlined in your code. The variable\
    \ that you would be checking in here would be compared against a variety of cases\
    \ by the statement. A good example of the syntax that you can use to create one\
    \ of these switch statements is this:\n\n```cpp\nSwitch(expression){\n    case\
    \ constant-expression:statement(s);break; //optional\n    case constant-expression:statement(s);break;\
    \ //optional\n    //you can add in as many of these case statements as you would\
    \ like\n    Default: //Optional\n    statement(s);\n}\n```\n\nWhen you are working\
    \ with the switch statements, there are some rules that you have to follow to\
    \ make them work inside of your code. First, the expression that you use with\
    \ the switch statement should be either an enumerated or an integral class type.\
    \ In addition to this, it can also belong to a class that has a conversion function.\
    \ The good news is that when you are working with C++, there isn’t a limit to\
    \ how many of these case statements that you can add into this syntax so you can\
    \ either make it long or short depending on what your code wants. The important\
    \ thing to remember here is that you need to add in a colon as a value to each\
    \ one that you want to use as well.\n\nOnce the variable finds a value that it\
    \ is equal to, it will just keep on running until it finds a way to break the\
    \ statement that you wrote. When the system finally finds this break statement,\
    \ the switch will stop whatever it is that it’s currently doing. Then, the control\
    \ flow is going to pass on to the next part of the code. You do not need to add\
    \ in a break statement to the cases. If you do not have one of these break statements,\
    \ your control flow will just pass on to the next part automatically.\n\n### The\
    \ ‘if’ statements\nThe next type of conditional statements that you can work with\
    \ is known as the ‘if’ statement. One of the most basic things that you can create\
    \ when it comes to conditional statements, is the if statement. These are based\
    \ on a true or false statement. If the system decides that the input matches up\
    \ to the conditions that you set, it is true, and the program is going to run\
    \ the part that you added to it. For example, if you set it up so that the system\
    \ asks what 2 + 2 is and the user puts in the right answer of 4, then this would\
    \ be seen as true and the message that you pick, something like ‘That is correct!’\
    \ will show up on the screen.\n\nAny time that you have the user input some kind\
    \ of information and if the information they added meets up or complies with your\
    \ conditions, then it will proceed to show up the statement or other things that\
    \ you add into the code. But what is going to happen if the user puts in the wrong\
    \ answer? If the user puts in that 5 is the answer to the question, ‘What is 2\
    \ + 2?’ then it will fail to meet the conditions that you set and the program\
    \ will see this as false.\n\nSince the if statement is one of the most basic forms\
    \ of conditional statements, you will find that it is not capable of handling\
    \ false answer that well.\n\n### The ‘if’ else statements\nYou will have various\
    \ issues if the user ends up putting in the wrong answer and this is where the\
    \ if-else statement comes into play. The if-else statement can be put to work\
    \ in a variety of situations. Not only does it allow for the user to put in an\
    \ answer that may not meet your conditions, but there are also times when you\
    \ may want it to let the user pick from a few different options. To create an\
    \ if-else statement, the syntax is pretty simple:\n\n```cpp\nif(expression){\n\
