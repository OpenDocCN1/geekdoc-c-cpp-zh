  trans: "\n\n```cpp\n#include <iostream>\nint main() {\n    // 用于定义一个浮点常量值\n    const\
    \ float f=3.14;\n    // 用于定义一个整数常量值\n    const int i=3;\n    std::cout << \"The\
    \ value of the floating constant is \" << f << std::endl;\n    std::cout << \"\
    The value of the integer constant is \" << i << std::endl;\n    f=4.145;\n   \
    \ i=4;\n    return 0;\n}\n```\n\n通过此程序，输出如下：\nThe value of the floating constant\
    \ is 3.14\nThe value of the integer constant is 3\n\n现在，让我们来看另一个例子，它可以证实我们对常量的理解。以下程序用于展示使用常量时的错误情况。\n\
    \n```cpp\n#include <iostream>\nint main() {\n    // 用于定义一个浮点常量值\n    const float\
    \ f=3.14;\n    // 用于定义一个整数常量值\n    const int i=3;\n    std::cout << \"The value\
    \ of the floating constant is \" << f << std::endl;\n    std::cout << \"The value\
    \ of the integer constant is \" << i << std::endl;\n    f=4.145;\n    i=4;\n \
    \   return 0;\n}\n```\n\n通过此程序，输出如下：\nerror: assignment of read-only variable\
    \ 'f' f=4.145;\nerror: assignment of read-only variable 'i' i=4;\n\n我们理所当然得到了错误，因为我们正尝试更改常量的值，而根据定义常量是不能更改的。\n\
    \n现在让我们来看字面量（literals）的使用。我们有不同类型的字面量，让我们详细查看每一个。\n\n### 整数字面量\n以下程序用于展示整数字面量的用法。\n\
    \n```cpp\n#include <iostream>\nint main() {\n    // 用于定义一个无符号整数字面量\n    int i=100U\
    \ ;\n    // 用于定义一个长整数字面量\n    int i1=100L;\n    // 用于定义一个无符号长整数字面量\n    int i2=100UL;\n\
    \    std::cout << \"The value of the unsigned integer literal is \" << i << std::endl;\n\
    \    std::cout << \"The value of the long integer literal is \" << i1 << std::endl;\n\
    \    std::cout << \"The value of the unsigned long integer literal is \" << i2\
    \ << std::endl;\n    return 0;\n}\n```\n\n通过此程序，输出如下：\nThe value of the unsigned\
    \ integer literal is 100\nThe value of the long integer literal is 100\nThe value\
    \ of the unsigned long integer literal is 100\n\n以下程序用于展示如何使用十六进制和八进制字面量。\n\n\
    ```cpp\n#include <iostream>\nint main() {\n    // 用于定义一个八进制字面量\n    int i=0313;\n\
    \    // 用于定义一个十六进制字面量\n    int i1=0x3c;\n    std::cout << \"The value of the octal\
    \ literal is \" << i << std::endl;\n    std::cout << \"The value of the hexadecimal\
    \ literal is \" << i1 << std::endl;\n    return 0;\n}\n```\n\n通过此程序，输出如下：\nThe\
    \ value of the unsigned integer literal is 203\nThe value of the long integer\
    \ literal is 60\n\n### 浮点数字面量\n浮点字面量包含整数部分、小数点、小数部分和指数部分。浮点字面量可以用十进制形式或科学计数形式表示。以下程序用于展示浮点数字面量的用法。\n\
    \n```cpp\n#include <iostream>\nint main() {\n    // 用于定义一个带有小数点的浮点字面量\n    float\
    \ f=3.14;\n    // 用于定义一个带有指数点的浮点字面量\n    float f2=314567E2;\n    std::cout <<\
    \ \"The value of the floating point literal with a decimal point is \" << f <<\
    \ std::endl;\n    std::cout << \"The value of the floating point literal with\
    \ an exponential point is \" << f2 << std::endl;\n    return 0;\n}\n```\n\n通过此程序，输出如下：\n\
    The value of the floating point literal with a decimal point is 3.14\nThe value\
    \ of the floating point literal with an exponential point is 3.14567e+007\n\n\
    ### 字符字面量\n字符字面量包含在单引号内。此外，除了定义普通字符外，你还可以定义转义序列。例如，如果你想要一个换行符，可以将该字符定义为 `\\n`。\n\
    \n下面是各种转义序列的表格。\n\n#### 转义序列\n\n| 转义序列 | 含义 |\n| :--- | :--- |\n| `\\\\` | 定义为\
    \ `\\` 字符 |\n| `\\'` | 定义为 `'` 字符 |\n| `\\\"` | 定义为 `\"` 字符 |\n| `\\?` | 定义为 `?`\
    \ 字符 |\n| `\\a` | 定义为报警或铃声 |\n| `\\b` | 定义为退格字符 |\n| `\\f` | 定义为分页符 |\n| `\\n`\
    \ | 定义为换行符 |\n| `\\r` | 定义为回车符 |\n| `\\t` | 定义为水平制表符\n| `\\v` | 定义为垂直制表符 |\n\n\
    以下程序用于展示字符字面量。\n\n```cpp\n#include <iostream>\nint main() {\n    // 用于定义一个字符字面量\n\
    \    char c='B';\n    std::cout << \"The value of the floating constant is \"\
    \ << c << std::endl ;\n    std::cout << \"An example of the tab and new line escape\
    \ sequence\\tis\\nshown below\";\n    return 0;\n}\n```\n\n通过此程序，输出如下：\nThe value\
    \ of the floating constant is B\nAn example of the tab and new line escape sequence\
    \      is\nshown below\n\n### 字符串字面量\n字符串字面量无非是一系列字符。以下程序用于展示字符串字面量。\n\n```cpp\n\
    #include <iostream>\nint main() {\n    std::cout << \"An example of a string literal\
    \ \\tis\\nshown below\";\n    return 0;\n}\n```\n\n# 第 10 章：符号与无符号类型\n对于某些数据类型，例如\
    \ `char` 和 `int`，你有符号或无符号的选择。\n- `long` 整数的符号与无符号类型\n\n| 类型 | 范围 |\n| :--- | :---\
    \ |\n| char | -128 到 127 |\n| unsigned char | 0 到 255 |\n| int | -2147483648 到\
    \ 2147483647 |\n| unsigned int | 0 到 4294967295 |\n| short int | -32768 到 32767\
    \ |\n| unsigned short int | 0 到 65535 |\n| long int | -9223372036854775808 到 9223372036854775807\
    \ |\n| unsigned long int | 0 到 18446744073709551615 |\n| float | +/- 3.4e+/-38\
    \ |\n| double | +/- 1.7e+/-308 |\n\n以下程序用于展示我们在 C++ 中定义符号和无符号的方式。\n\n```cpp\n\
    #include <iostream>\nint main() {\n    unsigned char c1=244;\n    signed char\
    \ c2=-100;\n    unsigned int i1=1;\n    signed int i2=-11;\n    std::cout << \"\
    An example of an unsigned character value is \" << int(c1) << std::endl;\n   \
    \ std::cout << \"An example of a signed character value is \" << int(c2) << std::endl;\n\
    \    std::cout << \"An example of an unsigned integer value is \" << i1 << std::endl;\n\
    \    std::cout << \"An example of a signed integer value is \" << i2 << std::endl;\n\
    \    return 0;\n}\n```\n\n通过此程序，输出如下：\nAn example of an unsigned character value\
    \ is 244\nAn example of a signed character value is -100\nAn example of an unsigned\
    \ integer value is 1\nAn example of a signed integer value is -11\n\n以下程序用于展示在\
    \ C++ 程序中使用 `short` 和 `long` 整数。\n\n```cpp\n#include <iostream>\nint main() {\n\
    \    short int i1=1;\n    long int i2=110000000 ;\n    std::cout << \"An example\
    \ of a short integer value is \" << int(i1) << std::endl;\n    std::cout << \"\
    An example of a long integer value is \" << int(i2) << std::endl;\n    return\
    \ 0;\n}\n```\n\n"
- fmt: "\n# Chapter 11: Introduction to Classes\n\nAt the heart of all object-oriented\
    \ programming lies the notion of classes, objects that you create and utilize\
    \ all throughout your code. This helps with modularity, with ease of use, with\
    \ efficiency, and with higher-level programming that is far more logical and coherent.\n\
    \nIn the early iterations of C, there was a primitive sort of class called a `struct`.\
    \ Structs still exist in C++ but are mainly deprecated and shirked in favor of\
    \ using classes instead. Nevertheless, structs are important to cover. C++ structs\
    \ are also different from C structs. C structs didn’t have much of the functionality\
    \ which C++ structs do.\n\nBefore we jump into that, let’s talk briefly about\
    \ the notion of access modifiers. We’ve talked about things like `int`, `string`,\
    \ `bool`, and `float`, called types. We created what could be considered somewhat\
    \ of a type using enumerators. However, you can create an entire type that is\
    \ made up of smaller pieces of data and innate functions. This is called an object.\n\
    \nAccess modifiers describe what is able to change what within your code. There\
    \ are three different access modifiers:\n- **Public** access means that the object\
    \ and/or its internal data and functions can be accessed and modified by any other\
    \ code in the program.\n- **Protected** means that the object and/or its internal\
    \ data and functions can be access and modified by only its derivatives. (This\
    \ will make sense when we get into inheritance and polymorphism.)\n- **Private**\
    \ means that only the object itself can access and modify its data. This is important\
    \ for purposes of security, clarity, and code safety.\n\nStructs and classes are\
    \ both ways to create new objects. The primary difference between structs is that\
    \ structs are public by default and classes are private by default. Other than\
    \ that, the differences are very negligible.\n\nHowever, in the tech industry,\
    \ structs have a fair bit of a negative connotation. Developers tend to see them\
    \ as unprotected objects with little functionality, while they tend to see classes\
    \ as very functional objects with child classes that are well made and well structured.\
    \ As such, it’s generally better to create classes unless your object has very\
    \ little in the way of functionality and simply contains very little data and\
    \ innate function.\n\nLook at this struct and declaration:\n\n```cpp\nstruct animal\
    \ {\n    enum diet { herbivore, omnivore, carnivore };\n    int legs;\n    string\
    \ name;\n    diet naturalDiet;\n};\n\nint main() {\n    animal dog;\n    dog.legs\
    \ = 4;\n    dog.name = \"Dog\";\n    dog.naturalDiet = dog.carnivore;\n}\n```\n\
    \nThis is the absolutely most simple way to declare a new object. You should absolutely\
    \ not declare them within an existent function.\n\nLet’s go ahead and replace\
    \ that struct with a class, because we’re going to be using classes going forward\
    \ as they’re generally a safer and better option than structs are. Create a new\
    \ project in CodeBlocks called “AnimalSimulator”. Redact the contents of `main.cpp`\
    \ and import `iostream` and create your `main` method.\n\nAbove the main method,\
    \ let’s declare a class called `Animal`. You would do that very similarly to how\
    \ you’d declare a struct:\n\n```cpp\nclass animal { string name; };\n```\n\nThen\
    \ within your main method, declare an instance and set its instance of name to\
    \ the name of your favorite animal. Afterward, try to build. You should have gotten\
    \ an error that said “error: string animal::name is private”. Perfect. This is\
    \ absolutely supposed to happen, because now we have to fix this. This is where\
    \ that whole notion of access description comes in.\n\nModify your class so that\
    \ it looks like this:\n\n```cpp\nclass animal {\npublic:\n    string name;\n};\n\
    ```\n\nThen try to build. It should work fine this time. That’s because we made\
    \ the string “name” public, which means other methods/functions outside of the\
    \ class itself can access it. This is generally considered bad practice though,\
    \ so we’re going to rewrite the class like so:\n\n```cpp\nclass animal {\nprivate:\n\
    \    string name;\n};\n```\n\nThe best-practice way to modify values within a\
    \ class is to use get/set methods. Here’s the way the class would look if you\
    \ implemented get/set methods:\n\n```cpp\nclass animal {\nprivate:\n    string\
    \ name;\npublic:\n    string getName() {\n        return this->name;\n    }\n\
    \    void setName(string name) {\n        this->name = name;\n    }\n};\n```\n\
    \nNow, in your main method, after declaring whatever animal it is, instead of\
    \ directly modifying its name, you should instead use the get/set method like\
    \ so (assuming your instance animal is called “dog”):\n\n```cpp\ndog.setName(\"\
    dog\");\n```\n\nThen you can test this by printing out the name in your main method:\n\
    \n```cpp\ncout << \"The name of my favorite animal is: \" << dog.getName() <<\
    \ \"\\n\";\n```\n\nThe way these work is by returning or setting the value of\
    \ the variable via a method from within the class. `this->` is called the `this`\
    \ pointer, and it refers to the variable of a given instance of a class. Every\
    \ object has access to its own variables and can modify them directly via the\
    \ `this` pointer.\n\nAnyway, your code should work stunningly. But what if you\
    \ don’t want to go through get/set for every instance of every class? Well, you\
    \ use what’s called an initializer function. Modify your class so it looks like\
    \ this:\n\n```cpp\nclass animal {\nprivate:\n    string name;\npublic:\n    animal(string\
    \ name) {\n        this->name = name;\n    }\n    string getName() {\n       \
    \ return this->name;\n    }\n    void setName(string name) {\n        this->name\
    \ = name;\n    }\n};\n```\n\nNow, in your main function, take out the chunk of\
    \ code that says `animal x` followed by the `x.setName(\"name\")` function. When\
    \ you create an initializer function, you can set certain variables from the get-go.\
    \ For example, since your initializer function takes the argument of `name`, you\
    \ can declare that when you declare the variable and circumvent the whole setName\
    \ operation. Look at this code for an example:\n\n```cpp\nanimal dog(\"dog\");\n\
    animal elephant(\"elephant\");\nanimal bird(\"bird\");\n```\n\nThese are all separate\
    \ instances of the class `animal`, and their names have been set without the use\
    \ of a set function thanks to the function initializer. This makes it incredibly\
    \ easy to create new objects and pretty streamlined of a process too.\n\nNow that\
    \ we’ve spoken for a moment about declaring objects and things of that nature,\
    \ let’s talk more about the specifics of what you can do with them. The object\
    \ `animal` here represents, of course, animals. We can give the entire class a\
    \ set of methods that they can perform.\n\nLet’s think for a second about what\
    \ every animal does. Every animal sleeps, eats, and drinks, right? So it wouldn’t\
    \ be very outlandish to include these within our class so that every member object\
    \ of the class `animal` is able to perform these methods. Let’s say we had two\
    \ specific kinds of food: meat, and plants, both of which also represented by\
    \ their own respective objects. We could create two different functions for this:\n\
    \n```cpp\nvoid eat(plant p) { // code here }\nvoid eat(meat m) { // code here\
    \ }\n```\n\nEven though these share a name, you can call either depending upon\
    \ the type of object which you put include in the function call, and both will\
    \ perform their respective code in response to the argument which you included.\
    \ This is called function overloading. It’s an essential technique in object-oriented\
    \ programming that will help you to create functional and clear sets of code that\
    \ are easy for people to use and understand.\n\nBecause it’s unwieldy to create\
    \ a large number of types while we’re learning about classes in the first place,\
    \ let’s just leave “eat” as a void function which doesn’t take arguments. Your\
    \ code should look like this:\n\n```cpp\nclass animal {\nprivate:\n    string\
    \ name;\npublic:\n    animal(string name) {\n        this->name = name;\n    }\n\
    \    string getName() {\n        return this->name;\n    }\n    void setName(string\
    \ name) {\n        this->name = name;\n    }\n    void eat() { // eat food }\n\
    };\n```\n\n# Chapter 12: Deeper Class Concepts\n\nWhen C++ was being designed\
    \ by AT&T engineer Bjarne Stroustrup as a language which would extend C, it was\
    \ actually called C with Classes at first. Resultantly, one can make the not-so-bold\
    \ assumption that C has a wealth of things which you can do with classes. This\
    \ assumption would be 100% correct. Classes have several different functionalities\
    \ built in that make them a joy to work with.\n\nThe first we should consider\
    \ is called inheritance. This is a concept which allows a class to draw from a\
    \ parent class. Let’s go back to the animal class. Because all dogs are animals,\
    \ we can create a derivative of the animal class to represent dogs. In order to\
    \ inherit it, we’d have to do the following:\n\n```cpp\nclass dog : public animal\
    \ { // code goes here };\n```\n\nNow, let’s try to change some things around.\
    \ First, above your string constructor function in the animal class, create a\
    \ constructor which doesn’t take arguments and sets `this->name` to a blank string.\n\
    \n```cpp\nanimal() { this->name = \"\"; }\n```\n\nThen go back to the dog class\
    \ and create a mimic constructor, but here, set `this->name` equal to “dog”. Don’t\
    \ forget to make your constructor public.\n\n```cpp\ndog() { this->name = \"dog\"\
    ; }\n```\n\nPerfect. Technically, this is exactly what I’ve asked you to do. However,\
    \ if you try to compile that, it doesn’t work. You get the heads up that “string\
    \ animal::name” is private, and those can’t be modified. This means that back\
    \ in our animal class code, we need to make this essential change:\n\n```cpp\n\
    class animal {\nprotected:\n    string name;\n};\n```\n\nThe `protected` access\
    \ modifier is used to access this variable from child objects. Child classes can\
    \ access and modify this variable, but any given function in the program cannot.\
    \ Because all dogs are animals but not all animals are dogs, we can define specific\
    \ functions here that dogs will perform which other animals obviously won’t. Back\
    \ in your dog class, create a function under the public access modifier which\
    \ is called `bark`:\n\n```cpp\npublic:\n    void bark() { cout << \"Bark!\\n\"\
    ; }\n```\n\nNow go to your main method and declare an instance of dog. For the\
    \ sake of example, mine will be called `d`.\n\n```cpp\nint main() {\n    dog d;\n\
    \    animal a;\n    d.bark();\n}\n```\n\nIf you try to compile, you should get\
    \ the error that “‘class animal’ has no member named ‘bark’.” Great! This is exactly\
    \ what was supposed to happen. Because dog is a derived class from animal, you\
    \ can define functions in it that dog can use but something broadly defined as\
    \ animal cannot.\n\nThe key concepts of inheritance and polymorphism:\n1. **Inheritance**:\
    \ Allows a class to draw from a parent class.\n2. **Polymorphism**: Allows different\
    \ classes to be treated as instances of the same base class, often through function\
    \ overriding.\n3. **Abstraction**: The idea of hiding implementation details and\
    \ showing only necessary features.\n4. **Encapsulation**: The mechanism of wrapping\
    \ data and functions into a single unit (class) and controlling access to them.\n\
    \n# Chapter 13: Object Oriented Programming\n\n## Objects and Classes\n\nWhat\
    \ makes C++ different from C is the addition of object-oriented programming (OOP).\
    \ In OOP, programs are divided into objects, data structures that package the\
    \ data and the functions that work with that data together.\n\nIn top-down design,\
    \ your program is a set of functions, with the `main` function driving the whole\
    \ program. In contrast, in object-oriented design, you first think about the data\
    \ (the variables) in your problem, and then package up the data with the functions\
    \ that use that data into objects. To create an object, first you need to write\
    \ a class which is a data structure that holds both data and functions in it.\
    \ When you design a class, you create a new data type. For example, you may write\
    \ a class called `Student` that contains all the data about students like their\
    \ name, id, gpa, etc. and functions that let you input, output, and change this\
    \ data. Then, you declare object variables that are of this new data type. For\
    \ example, you can declare `student1`, `student2`, `student3`, or a whole array\
    \ of student objects that are all of type `Student`.\n\n## Operator Overloading\n\
    \nYou can actually overload the existent mathematical operators in C++ to give\
    \ them new functions for your classes. Here’s how we would do such in this case:\n\
    \n```cpp\nclass cube {\nprivate:\n    int length, width, height;\npublic:\n  \
    \  cube() {\n        length = 0;\n        width = 0;\n        height = 0;\n  \
    \  }\n    cube(int length, int width, int height) {\n        length = length;\n\
    \        width = width;\n        height = height;\n    }\n    cube operator+(const\
    \ cube& other) {\n        return cube(length + other.length, width + other.width,\
    \ height + other.height);\n    }\n```\n\nCreate a project called `operatorOverloading`\
    \ and delete the contents of `main.cpp`. Create your `main` method and then create\
    \ a `cube` class. It should have private variables `length`, `height`, and `width`,\
    \ and public methods which set those values and return the volume (`length * width\
    \ * height`), as well as a class constructor. Your code should end up looking\
    \ bit like this:\n\n```cpp\nclass cube {\nprivate:\n    int length, width, height;\n\
    public:\n    int getV() {\n        return length * width * height;\n    }\n  \
    \  void setL() {}\n    void setW() {}\n    void setH() {}\n    cube() {\n    \
    \    length = 0;\n        width = 0;\n        height = 0;\n    }\n    cube(int\
    \ length, int width, int height) {\n        length = length;\n        width =\
    \ width;\n        height = height;\n    }\n};\n```\n\nSo with that done, we now\
    \ need to look at how we could add two `cube` objects together. Fortunately, you\
    \ can actually overload the `+` operator. A very simple way to describe this is\
    \ think if you had two integers `a = 5` and `b = 3`. The equation `a + b` would\
    \ thus come out to 8. This is because they have explicit values. However, what\
    \ if we had two members of a class called `cube`, and this class had `length`,\
    \ `height`, and `width` as its properties? The compiler doesn’t know how or in\
    \ what way to add these two objects.\n\nThe answer is to make the base class's\
    \ `isEating()` function a `virtual` function, like so:\n\n```cpp\nvirtual void\
    \ isEating() {\n    cout << \"generic food\";\n}\n```\n\nTo override this function\
    \ in derived classes, you type the `override` keyword after the function name,\
    \ like this:\n\n```cpp\nvoid isEating() override {\n    cout << \"dog food\";\n\
    }\n```\n\nThis effectively solves the problem that existed in the first place.\
    \ The last major concept of classes to cover (at least for the book) is operator\
    \ overloading.\n\n```cpp\nclass smallDog : public dog {\npublic:\n    void bark()\
    \ override {\n        cout << \"Yip!\\n\";\n    }\n};\n```\n\nNow, in our `main`\
    \ function, we create an instance of `smallDog` called `sd`.\n\n```cpp\nint main()\
    \ {\n    smallDog sd;\n    sd.bark();\n}\n```\n"
  raw: 'Chapter 11    : Introduction to ClassesAt the heart of all object-oriented
    programming lies the notion of classes, objects that you create and utilize all
    throughout your code. This helps with modularity, with ease of use, with efficiency,
    and with higher-level programming that is far more logical and coherent.In the
    early iterations of C, there was a primitive sort of class called a struct. Structs
    still exist in C++ but are mainly deprecated and shirked in favor of using classes
    instead. Nevertheless, structs are important to cover. C++ structs are also different
    from C structs. C structs didn’t have much of the functionality which C++ structs
    do.Before we jump into that, let’s talk briefly about the notion of access modifiers.We’ve
    talked about things like int , string , bool , and float , called types. We created
    what could be considered somewhat of a type using enumerators. However, you can
    create an entire type that is made up of smaller pieces of data and innate functions.
    This is called an object.Access modifiers describe what is able to change what
    within your code. There are three different access modifiers.Public access means
    that the object and/or  its internal data and functions can be accessed and modified
    by any other code in the program.Protected means that the object and/or its internal
    data and functions can be access and modified by only its derivatives. (This will
    make sense when we get into inheritance and polymorphism.)Private means that only
    the object itself can access and modify its data.This is important for purposes
    of security, clarity, and code safety.Structs and classes are both ways to create
    new objects. The primary difference between structs is that structs are public
    by default and classes are private by default. Other than that, the differences
    are very negligible.However, in the tech industry, structs have a fair bit of
    a negative connotation. Developers tend to see them as unprotected objects with
    little functionality, while they tend to see classes as very functional objects
    with child classes that are well made and well structured.As such, it’s generally
    better to create classes unless your object has very little in the way of functionality
    and simply contains very little data and innate function.Look at this struct and
    declaration.struct animal {enum diet { herbivore, omnivore, carnivore };int legs;string
    name;diet naturalDiet;};int main() {animal dog;dog.legs = 4;dog.name = "Dog";dog.naturalDiet
    = dog.carnivore;This is the absolutely most simple way to declare a new object.
    You should absolutely not declare them within an existent function.Let’s go ahead
    and replace that struct with a class, because we’re going to be using classes
    going forward as they’re generally a safer and better option than structs are
    .Create a new project in CodeBlocks called “AnimalSimulator”. Not the most creative
    title, but it’ll absolutely work for what we’ve got to do. Redact the contents
    of main.cpp and import iostream and create your main method.Above the main method,
    let’s declare a class called Animal. You would do that very similarly to how you’d
    declare a struct. For the sake of illustration, make it look like this:class animal
    {string name;};Then within your main method, declare an instance and set its instance
    of name to the name of your favorite animal. Afterward, try to build.You should
    have gotten an error that said “error: string animal::name is private”.Perfect.
    This is absolutely supposed to happen, because now we have to fix this. This is
    where that whole notion of access description comes in.Modify your class so that
    it looks like this:class animal {public:string name;}Then try to build. It should
    work fine this time. That’s because we made the string “name” public, which means
    other methods/functions outside of the class itself can access it.This is generally
    considered bad practice though, so we’re going to rewrite the class like so:class
    animal {private:string name;}The best-practice way to modify values within a class
    is to use get/set methods. Here’s the way the class would look if you implemented
    get/set methods.class animal {private:string name;public:string getName() {return
    this->name;}void setName(string name) {this->name = name;}}Now, in your main method,
    after declaring whatever animal it is, instead of directly modifying its name,
    you should instead use the get/set method like so (assuming your instance animal
    is called “dog”):dog.setName(“dog”);Then you can test this by printing out the
    name in your main method:cout << “The name of my favorite animal is: “ << dog.getName()
    << “\n”;The way these work is by returning or setting the value of the variable
    via a method from within the class. “this->” is called the this pointer , and
    it refers to the variable of a given instance of a class. Every object has access
    to its own variables and can modify them directly via the ‘this pointer’.Anyway,
    your code should work stunningly. But what if you don’t want to go through get/set
    for every instance of every class? Well, you use what’s called an initializer
    function.Modify your class so it looks like this:class animal {private:string
    name;public:animal(string name) {this->name = name;}string getName() {return this->name;}void
    setName(string name) {this->name = name;}}Now, in your main function, take out
    the chunk of code that says animal x followed by the x.setName(“name”) function.
    When you create an initializer function, you can set certain variables from the
    get-go.For example, since your initializer function takes the argument of name
    , you can declare that when you declare the variable and circumvent the whole
    setName operation. Look at this code for an example:animal dog(“dog”);animal elephant(“elephant”);animal
    bird(“bird”);These are all separate instances of the class animal, and their names
    have been set without the use of a set function thanks to the function initializer.This
    can take as many arguments as you’d like it to. This makes it incredibly easy
    to create new objects and pretty streamlined of a process too.Now that we’ve spoken
    for a moment about declaring objects and things of that nature, let’s talk more
    about the specifics of what you can do with them. The object animal here, represents,
    of course, animals. We can give the entire class a set of methods that they can
    perform.Let’s think for a second about what every animal does. Every animal sleeps,
    eats, and drinks, right? So it wouldn’t be very outlandish to include these within
    our class so that every member object of the class animal is able to perform these
    methods.Let’s say we had two specific kinds of food: meat, and plants, both of
    which also represented by their own respective objects.We could create two different
    functions for this:void eat(plant p) {// code here}void eat(meat m) {// code here}Even
    though these share a name, you can call either depending upon the type of object
    which you put include in the function call, and both will perform their respective
    code in response to the argument which you included. This is called function overloading
    . It’s an essential technique in object-oriented programming that will help you
    to create functional and clear sets of code that are easy for people to use and
    understand.Because it’s unwieldy to create a large number of types while we’re
    learning about classes in the first place, let’s just leave “eat” as a void function
    which doesn’t take arguments. Your code should look like this:class animal {private:string
    name;public:animal(string name) {this->name = name;}string getName() {return this->name;}void
    setName(string name) {this->name = name;}void eat() {// eat food}}Chapter 12   
    : Deeper Class ConceptsWhen C++ was being designed by AT&T engineer Bjarne Stroustrup
    as a language which would extend C, it was actually called C with Classes at first.
    Resultantly, one can make the not-so-bold assumption that C has a wealth of things
    which you can do with classes. This assumption would be 100% correct. Classes
    have several different functionalities built in that make them a joy to work with.The
    first we should consider is called inheritance . This is a concept which allows
    a class to draw from a parent class. Let’s go back to the animal class.Because
    all dogs are animals, we can create a derivative of the animal class to represent
    dogs.In order to inherit it, we’d have to do the following:class dog : public
    animal {// code goes here};Now, let’s try to change some things around. First,
    above your string constructor function in the animal class, create a constructor
    which doesn’t take arguments and sets this->name to a blank string.animal() {this->name
    = “”;}Then go back to the dog class and create a mimic constructor, but here,
    set this->name equal to “dog”. Don’t forget to make your constructor public.dog()
    {this->name = “dog”;}Perfect. Technically, this is exactly what I’ve asked you
    to do. However, if you try to compile that, it doesn’t work. You get the heads
    up that “string animal::name” is private, and those can’t be modified.This means
    that back in our animal class code, we need to make this essential change:class
    animal {private:string name;[...]needs to becomeclass animal {protected:string
    name;[...]This is because in order to access this variable from child objects,
    we have to set the access modifiers in the ultimate parent function for this variable
    to protected . Now, child classes can access and modify this variable, but any
    given function in the program otherwise cannot.Because all dogs are animals but
    not all animals are dogs, we can define specific functions here that dogs will
    perform which other animals obviously won’t.Back in your dog class, create a function
    under the public access modifier which is called “bark”.public:void bark() {cout
    << “\nBark!\n ”}Now go to your main method and declare an instance of dog. For
    the sake of example, mine will be called “d”.  Afterward, create an instance of
    the animal class.Try to access bark() from both.int main() {dog d;animal a;dog.bark();animal.bark();}If
    you try to compile, you should get the error that “‘class animal’ has no member
    named ‘bark’.” Great! This is exactly what was supposed to happen. Because dog
    is a derived class from animal, you can define functions in it that a dog can
    use but something broadly defined as an animal cannot - for example, barking.Remove
    a.bark(), then compile and launch. It should work perfectly.But wait! I know what
    you’re thinking. “There are types of dog too. And furthermore, not every dog barks
    , small dogs yip , genius.” I’m well aware. Don’t worry - we can derive classes
    from derived classes, too!Below your dog class, add in a class called “smallDog”
    which is inherited from dog.class smallDog : public dog {public:smallDog() {this->name
    = "small dog" ;}};Now if, in our main function, we create an instance of smallDog
    called sd, and try to declare bark after dog d barks, we’ll have two barks on
    the screen. But you’re right - small dogs don’t bark. How do we go about fixing
    this?This is where something called function overriding comes into play.To override
    a function, you only need to rewrite it (unless it’s a virtual function, in which
    case it needs the override specifier.)In class smallDog :void bark() {cout <<
    “\nYip!\n”;Now, in your code, sd.bark() should produce “yip” while d.bark() produces
    “bark”. This is the essential nature of function overriding in C++.Function overriding
    is an integral part of the object-oriented concept known as “polymorphism”. What
    this means is that things can have different meanings depending upon the context.
    Inheritance and polymorphism are two key concepts of object-oriented programming.Another
    important concept is the notion of abstraction. Abstraction is the idea of keeping
    the user-level side of programming as error-free and easy to maintain as possible,
    often by providing functions for performing certain actions upon variables that
    are protected by the classes themselves from user-level access which could inadvertently
    cause harm to the overall program.One more important object-oriented concept is
    the idea of encapsulation, which is a mechanism of putting data and functions
    which use them together. Classes innately offer encapsulation. Encapsulation and
    abstraction go hand in hand by hiding data that could potentially cause an error,
    instead offering methods by which to access, utilize, and manipulate the data.Anyway,
    getting off of the broader concepts, it’s very important to cover the topic of
    virtual functions.It’s a little difficult to explain why virtual functions are
    important, but I’m going to try, because they very much are.The simplest way to
    explain it is this: let’s say you’ve got two classes, a base class and a derived
    class. We can go back to the example of animals/dogs. Animals would eat generic
    food, while dogs would eat - of course - dog food.If they both had a function
    called “isEating()” which would output what they were eating, the animal object
    would output “generic food” while the dog object would output “dog food”. This
    is fine and all for the purpose of a main function, but it falls apart if they
    have to go through an intermediate function.For example, if in the main function,
    there were a reference to another function called “makeAnimalsEat(animal &a)”,
    and the referenced animal a were to call .isEating(), then all objects derived
    from the animal class would use the animal version of the function isEating and
    not their own overridden versions.At first glance, a solution appears to overload
    the makeAnimalsEat(animal &a) function with another function that accepts specifically
    the derivative class dog , such as makeAnimalsEat(dog &d). But think about this
    a little further - there are a lot of animals in the world. A whole, whole lot.
    Are we really going to overload this same exact function repeatedly in order to
    make it work for every possible derivative of the animal class? Of course not,
    that’s absurd.The answer instead is to make the base class’s isEating() function
    a virtual function, like so:virtual void isEating() {cout << “generic food”;}To
    override this function in derived classes, you type the override keyword after
    the function name, like this:void isEating() override {cout << “dog food”;}which
    would effectively solve the problem that had existed in the first place.The last
    major concept of classes to cover (at least for the scope of this book) is the
    notion of operator overloading . There’s a very simple way to describe this.Think
    about if you had two integers a, 5, and b, 3\. The equation:a + bwould thus come
    out to 8\. Right? This is because they have explicit values.However, what if we
    had two members of a class called cube, and this class had length, height, and
    width as its properties.If you had two cube objects named a and b and then tried
    to add them, there’s no innate meaning to it. The compiler doesn’t know how or
    in what way to add these two objects.Create a new project called operatorOverloading
    and delete the contents of main.cpp. Create your main method and then create a
    cube class. It should have private variables length, height, and width, and public
    methods which set those values and return the volume (length * width * height),
    as well as a class constructor + an empty constructor.Your code should end up
    looking a bit like this:class cube {public:int getV() {return length * width *
    height;}void setL() {}void setW() {}void setH() {}cube() {this->length = 0;this->width
    = 0;this->height = 0;}cube(int length, int width, int height) {this->length =
    length;this->width = width;this->height = height;private:int length, width, height;So
    with that done, we now need to look at how we could add two cube objects together.Fortunately,
    you can actually overload the existent mathematical operators in C++ to give them
    new functions for your classes.Here’s how we would do such in this case.First,
    in the public section of your cube code, you would act like you were making a
    constructor by declaring the object itself.cubeThen you use the operator keyword
    and what specify which operator you want to override - in this case, the addition
    operator, followed by parameter parentheses and function brackets.cube operator+(cube
    &add) {Since we’re passing through another object, we need to actually pass in
    the secondary variable’s reference address. What’s happening in this line of code
    is that you’re overriding the addition operator, +, and specifying what happens
    when the object cube is combined with the operator and the object within the parameters.
    So basically, what happens when this instance of cube cube is added to another
    cube, here called add ? Within the brackets, we need to specify what’s going on.In
    the brackets, we need to declare cube c.Now, we need to say that cube c’s length
    is equal to the length of the first cube instance (this->) plus the second cube
    instance defined in the function parameters (add).c.length = this->length + add.length;Then
    we do the same for the width and height.By the end, your code should ideally look
    something along these lines:cube operator+(cube &add) {cube c;c.length = this->length
    + add.length;c.width = this->width + add.width;c.height = this->height + add.height;return
    c;If you wanted your code to be extra secure, you could actually make the variable
    within the parameters a constant.cube operator+(const cube &add) {Now we’re going
    to talk about splitting your code up to make it incredibly readable and easier
    to use.Chapter 13    : Object Oriented ProgrammingObjects and ClassesWhat makes
    C++ different from C is the addition of object-oriented programming (OOP ). In
    OOP, programs are divided into objects, data structures that package the data
    and the functions that work with that data together.In top-down design, your program
    is a set of functions, with the main function driving the whole program. In contrast,
    in object-oriented design, you first think about the data (the variables) in your
    problem, and then package up the data with the functions that use that data into
    objects.  To create an object, first you need to write a class which a data structure
    that holds both data and functions in it. When you design a class, you create
    a new data type. For example, you may write a class called Student that contains
    all the data about students like their name, id, gpa, etc. and then functions
    that let you input, output, and change this data. Then, you declare object variables
    that are of this new data type. For example, you can declare student1, student2,
    student3, or a whole array of student objects that are all of type Student.There
    are 3 steps to writing an object-oriented program:'
