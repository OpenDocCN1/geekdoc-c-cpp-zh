  trans: "\n1. 确定共享数据变量（也称为成员变量或实例变量），并在 `class` 中将这些变量声明为 `private`（它们不能在类外部访问）。\n\
    2. 在 `class` 内部编写处理共享变量的 `public` 函数。\n3. 编写一个 `main` 函数，创建该 `class` 的对象并测试这些函数。\n\
    \n以下是在 C++ 中编写一个名为 `Student` 的新类的方法：\n\n```cpp\nclass Student {\nprivate:  //\
    \ 数据（称为成员、实例或共享变量）\n    string name;\n    long int id;\n    double gpa;\npublic:\
    \ // 成员函数\n    void inputData() {\n        cout << “Please enter the student’s\
    \ name: “;\n        cin >> name;  // 有权访问上面的共享变量\n        cout << “Please enter\
    \ the student’s id: “;\n        cin >> id;\n    }\n    void calculateGPA(){ ….}\n\
    };  // 注意结尾类定义的分号 ;\n```\n\n然后，你可以编写一个 `main` 函数，通过创建 3 个 `Student` 对象 `s1`、`s2`、`s3`\
    \ 来测试这个新类，并使用 `.` 运算符调用它们的公共函数（该运算符可以读作 's，例如 `s1’s inputData()` 函数将填充 `s1’s`\
    \ 的数据）：\n\n```cpp\nint main() {\n    Student s1, s2, s3;\n    s1.inputData();\n\
    \    s2.inputData();\n    s1.calculateGPA();\n}\n```\n\n面向对象编程还遵循`数据封装`Data Encapsulation）和`信息隐藏`Information\
    \ Hiding）原则。它通过将数据设为 `private` 来保护数据，并提供 `public` 函数来安全地访问数据。`private` 符意味着成员变量只能在\
    \ `class` 内部访问——它们被该 `class` 内部函数共享并访问。`class` 中所有的共享变量都应该声明在 `private` 下。`public`\
    \ 符意味着任何人可以在任何地方（类内部和外部）访问。函数通常被设置为 `public`。\n\n大多数现代编程语言现在都是面向对象的，因为这种编程类型具有某些优势。以下是\
    \ OOP 的一些优势：\n\n- 它保护数据。除了类内部的函数外，没有人可以修改它们。\n- 函数往往更短且设计更好。因为它们共享私有数据变量，所以它们的参数更少。\n\
    - 程序员犯的错误更少，因为他们不需要将数据变量作为参数传递给函数。\n- 它更容易扩展类并创建新类，促进了`软件复用/继承`Software Reuse\
    \ / Inheritance。\n\n## 类内部的成员函数\n\n大多数类内部都写有一些标准函数：\n\n- `访问器/修改器 (get/set)` 函数：称为\
    \ `set` 和 `get` 的简单函数，用于为共享变量设置一个值并返回（`get`）一个共享变量。\n- `输入/输出`Input/Output 函数：向用户索要共享变量的值或将其打印出来。\n\
    - `构造函数`Constructor Functions：初始化共享变量。\n- 其他特殊函数（例如 `BankAccount` 类的 `deposit/withdraw`\
    \ 函数）。\n\n例如，这里再次是 `Student` 类，带有用于学生名称的 `get/set` 函数：\n\n```cpp\nclass Student\
    \ {\nprivate:\n    string name;\n    long int id;\npublic:\n    void setName(string\
    \ n) { name = n; }\n    string getName() { return name; }\n    void inputData()\
    \ {\n        cout << “Please enter the student’s name: “;\n        cin >> name;\n\
    \        cout << “Please enter the student’s id: “;\n        cin >> id;\n    }\n\
    \    void outputData() {\n        cout << name << endl;\n        cout << id <<\
    \ endl;\n    }\n}; // 类结束\n```\n\nOOP 中的一种特殊函数是`构造函数`constructor function，它将所有共享变量初始化为初始值。`构造函数`必须与\
    \ `class` 同名，且没有返回类型。当你创建 `class` 的对象时，它们会被自动调用。这是一个默认构造函数 `Student()`，当声明一个 `Student`\
    \ 类的对象时会被自动调用：例如 `Student s1;`\n\n```cpp\nStudent() {\n    name = \"\";  // 将所有共享变量初始化为默认值\n\
    \    id = 0;\n    gpa = 0;\n}\n```\n\n`构造函数`还可以接收参数并将它们复制到成员变量中：\n\n```cpp\npublic\
    \ Student(String n, long int i) {\n    name = n;\n    id = i;\n}\n```\n`//` 在\
    \ `main()` 中调用方式：`Student s1(“Chris”, 12345);`\n\n关键字 `this` 有时在成员函数内部用于引用调用对象，例如\
    \ `s1`。因此，当我们在上面的 `Student` 构造函数中使用 `name` 时，我们想要的是这个对象 `s1’s` 的名称，可以写成 `this.name`。\n\
    \n程序员经常将面向对象的程序划分为不同的文件。仅包含函数声明的 `class` 定义放在头文件中，例如 `Student.h`。成员函数被放在另一个文件中，例如\
    \ `student.cpp`，该文件在顶部包含头文件，例如 `#include \"Student.h\"`。`main` 函数也放在单独的文件中，例如\
    \ `driver.cpp`，它也包含头文件。这些文件都被放在编辑器的同一个项目（`New/Project`）中并一起编译。\n\n## 对象数组\n\n\
    对象通常被放入数组或更复杂的数据结构（如 `vectors`）。例如，我们通常在程序中需要的比几个学生对象更多。我们可能需要跟踪教室甚至整个学校的所有学生，需要数百或数千个学生。我们创建的新类类型可以用任何使用简单数据类型的地方。因此，我们可以像声明\
    \ `int` 数组一样声明 `Student` 对象数组：\n\n```cpp\nStudent studentArray[100]; // 包含 100\
    \ 个 Student 对象\n```\n\n或者我们可以声明一个动态学生数组：\n```cpp\nVector<Student> students;\n\
    ```\n\n我们可以使用循环来遍历数组并调用每个学生的函数：\n\n```cpp\nfor(int i=0; i < 100; i++)\n    studentArray[i].inputData();\
    \ // 调用学生 i 的 inputData() 函数\n```\n\n我们还可以将整个数组传递给函数。例如：\n\n```cpp\nvoid inputArray(Student\
    \ studentArray[]) {\n    for(int i=0; i < 100; i++)\n        studentArray[i].inputData();\n\
    }\n```\n\n幸运的是，在 `C++` 中数组名始终作为其地址，因此数组地址会自动传递给函数，而不是复制整个数组，并且会原始数组。\n\n## 项目\n\
    \n1. 创建一个 `Date` 类，包含 `month`、`day` 和 `year`，以及 `set/get` 和 `input/output` 函数，以及一个将日期设置为当前日期的默认构造函数。在\
    \ `main` 函数中测试它。\n2. 创建一个 `BankAccount` 类，包含银行账户信息（所有者、余额等）以及标准函数和 `withdraw()/deposit()`\
    \ 函数。\n3. 创建一个 `Student` 对象的 `Array` 并使用循环填充数据。然后，找到 `gpa` 最高的学生。\n\n# 第 14 章：改进技术\n\
    \n## 结构体\n\n`Structs` 起于 `C` 语言，源于类编程的世界。然而，它们仍然有用，并可以用在认为类大材小用的地方。使用结构体的一个很好的例子是用于记录保存，例如如果你需要跟踪球队中的足球运动员，你需要存储：\n\
    \n- 姓名\n- 球衣号码\n- 薪水\n- 最擅长的脚\n- 等等。\n"
- fmt: "\nIf there is no need to add functionality onto this information a structure\
    \ is perfect for this situation. A structure storing this information is defined\
    \ like this:\n\n```cpp\nstruct FootballPlayer{\n    string Name;\n    int KitNumber;\n\
    \    double Wage;\n    string StrongestFoot;\n};\n```\n\nThis structure contains\
    \ all the values that are relevant, this will provide a relevant container for\
    \ similar information. A new instance of the structure is defined like so:\n\n\
    ```cpp\nFootballPlayer player1;\nplayer1.Name = \"Messi\";\nplayer1.KitNumber\
    \ = 10;\nplayer1.Wage = 1000000;\nplayer1.StrongestFoot = \"Both\";\n```\n\nThis\
    \ code will create a `FootballPlayer` and assign values to all its member variables.\
    \ Real world usage of structures tend to be “simple” usage where they need to\
    \ just store trivial data like the example above, when there needs to be functionality\
    \ and encapsulation use a class. This is known a `POD` (Plain Old Data) encapsulation.\
    \ Note: the default access for structure variables is public while classes default\
    \ to private.\n\n### Enums\n\n`Enums` is short for Enumerated Type as has the\
    \ role of a boolean but with unlimited user defined types, this can be used a\
    \ flags for a situation like “HOME_SCREEN” or “SETTING_SCREEN”.\n\nAn enum is\
    \ defined like so:\n\n```cpp\nenum CurrentScreen{HOME, SETTINGS, CONTACTS, CALCULATOR};\n\
    ```\n\nWith each word in the brackets being a state the enum can be set as. A\
    \ enum instance is created like so:\n\n```cpp\nint main(){\n    CurrentScreen\
    \ phone1;\n    phone1 = HOME;\n}\n```\n\nThis code above makes a new enum and\
    \ assigns it as “HOME”. You can now use the enum to check what states it is, the\
    \ example below will use a switch-case:\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <iostream>\nusing namespace std;\nenum CurrentScreen{HOME, SETTINGS, CONTACTS,\
    \ CALCULATOR};\nint main(){\n    CurrentScreen phone1;\n    //Change me\n    phone1\
    \ = HOME;\n    switch (phone1){\n        case HOME:\n            cout << \"You're\
    \ on the home page\" << endl;\n            break;\n        case SETTINGS:\n  \
    \          cout << \"You're on the settings page\" << endl;\n            break;\n\
    \        case CONTACTS:\n            cout << \"You're on the contacts page\" <<\
    \ endl;\n            break;\n        case CALCULATOR:\n            cout << \"\
    You're on the calculator page\" << endl;\n            break;\n        default:\n\
    \            break;\n    }\n}\n```\n\n**Output**\nYou’re on the home page\n\n\
    This code shows you can use conditional structures along with an enum to easily\
    \ create a nice branched structure. Mess around with the commented “Change me”\
    \ enum definition and see how the output changes.\n\n### Unions\n\nUnions are\
    \ a data structures designed to provide efficient memory usages, they can contain\
    \ as many member variables as it needs however it can only store data for a single\
    \ variable at a time. So the entire structure only takes up memory for the biggest\
    \ member variable. \n\nThese have to be used with caution because setting value\
    \ of another member variable will remove data stored in another, so it is incredibly\
    \ easy to lose important data.\n\nA union is defined like so:\n\n```cpp\nunion\
    \ Example{\n    int i;\n    int x;\n    int y;\n};\n```\n\nAnd an instance and\
    \ value is created like so:\n\n```cpp\nExample e;\ne.i = 4;\n```\n\nTo show how\
    \ the size of the union works the program below works it through:\n\n```cpp\n\
    #include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nunion Example{\n\
    \    int i;\n    int x;\n    int y;\n};\nint main(){\n    Example e;\n    e.i\
    \ = 4;\n    cout << \"Your int size is: \" << sizeof (int ) << \" bytes\" << endl;\n\
    \    cout << \"The union has 3 variables that should be a total of: \" << sizeof\
    \ (int ) * 3 << \" bytes\" << endl;\n    cout << \"However, the union is \" <<\
    \ sizeof (e) << \" bytes\" << endl;\n}\n```\n\n**Output**\nYour int size is: 4\
    \ bytes\nThe union has 3 variables that should be a total of:  12 bytes\nHowever,\
    \ the union is 4 bytes\n\nAs you can tell the union is only the size of a single\
    \ integer, these structures can be used to efficiently use memory is there’re\
    \ situations where variables are idle and only one is needed. \n\nBelow is code\
    \ that shows what happens to all the values when one is changed:\n\n```cpp\n#include\
    \ \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nunion Example{\n  \
    \  int i;\n    int x;\n    int y;\n};\nvoid Print_Union(Example e ){\n    cout\
    \ << \"i: \" << e .i << endl;\n    cout << \"x: \" << e .x << endl;\n    cout\
    \ << \"y: \" << e .y << endl;\n}\nint main(){\n    Example e;\n    cout << \"\
    1\" << endl;\n    e.i = 4;\n    Print_Union(e);\n    cout << \"2\" << endl;\n\
    \    e.y = 3;\n    Print_Union(e);\n    cout << \"3\" << endl;\n    e.x = 1;\n\
    \    Print_Union(e);\n}\n```\n\n**Output**\n1\ni: 4\nx: 4\ny: 4\n2\ni: 3\nx: 3\n\
    y: 3\n3\ni: 1\nx: 1\ny: 1\n\nAs you can tell when you change one value, they all\
    \ equal the same value, this is because all values share the same memory location\
    \ and therefore when one changes they all change.\n\n### Variable argument lists\n\
    \nVariable argument lists allow for the possibly of endless parameters. Before\
    \ we have come across functions with a static set amount of parameters (variables\
    \ you can pass into a method) like:\n\n```cpp\nint Add(int i, int y){}\n```\n\n\
    Has two parameters integer `i` and integer `y`. This is known as a Variadic Function\
    \ or a function with unlimited arity (parameter number, so `Add` above has an\
    \ arity of 2).\n\nThe variables are stored in a variable known as the `va_list`\
    \ this works as any other variable but it just holds the list of variables passed.\
    \ A variadic function is defined like so:\n\n```cpp\nvoid Add(int numberOfVariables\
    \ , ...){}\n```\n\nWhere `numberOfVariables` is the number of extra parameters\
    \ passed, note this does not include this variable. This is required because the\
    \ `va_list` does not know the total number of variables and does not keep track\
    \ of where it is in the list. Using the va_ist requires the use of a few functions:\n\
    \n*   `va_start(va_list, numberOfVariables)`\n    *   Grabs the variables passed\
    \ in and assigns the number specified by the second parameter to the first parameter\n\
    *   `va_arg(va_list, type)`\n    *   Grabs the next variable from the specified\
    \ list in the first parameter and creates a variable specified by `type`\n*  \
    \ `va_end(va_list)`\n    *   Tidies up the list\n"
