    此外，你必须为模块头开发一种标准格式，并提供与类、函数、作者-日期以及关于修改历史的相关信息。


    **提示**：所有负责单兵项目的程序员都应该使用相同的编码风格。用不同编码风格编写的程序会令人困惑并显得不专业。


    ## 开启警告和错误消息

    C++ 语言的语法提供了检查错误的能力。当编译器遇到难以解析的结构时，它除了显示消息外别无事事做。它会尝试同步并备份源代码。有时这个过程是成功的，但它不会创建可执行文件。这将迫使程序员处理所有的错误消息。


    尽管如此，一旦 C++ 程序发现了一个一个它可以运行但看起来很可疑的结构，它只会简单发送一条警告消息。这是因为 C++ 语言非常清楚你想要什么，所以它会继续运行并构建一个可执行文件，帮助你忽略警告。然而，如果你不想被打扰，可以禁用警告。


    **提示**：禁用警告是一个非常糟糕的主意。这就像断开汽车的引擎检查灯一样。记住，忽略问题不是解决方案。


    ## 对代码进行注释

    在对代码进行注释时，可以防止错误的发生。养成在写代码时就注释的习惯，而不是等运行正常了再回来注释。注释是帮助你理解自己正在做什么的极佳方法。在修改程序时，简短的注释更好。


    ## 有限的可见性

    减少类内部成员对外部世界的可访问性是面向对象编程的关键部分。类必须对它的成员负责。如果类中出现任何问题，那就是程序员的责任。


    有限的可见性要求保护数据成员以超出类范围的访问性。简而言之，数据成员应该被保护。此外，应用程序软件不应该感知到的所有成员函数都必须被保护。


    ## 监控堆内存

    忘记监控堆内存是许多发布程序中致命错误的主要来源之一。这仍然是人们追踪的最困难的问题之一，因为这类特定错误难以定位和删除。大多数时候，它们存在于你购买的程序中。这你需要运行程序几个小时后问题才会开始显现。作为一般原则，程序员需要分配和释放堆内存。


    ## 使用异常修复错误

    为了处理 C++ 语言中的错误，内置了异常机制。通常情况下，发送错误指示比返回错误标志要好。


    **提示**：对真实的错误使用异常。对于一个发送“某些事情不起作用”指示的函数抛出异常是无关的。


    ## 在删除所指向的内容后移除指针

    确保在删除指针所指向的内容后，移除了这些指针。你通过为指针分配一个 `nullptr` 值来实现这一点。你很快就会学到这一点。你可能会很容易发现自己在不知情的情况下使用了一个已返回给堆的内存块。程序在
    99% 的时间里可能运行良好，但很难识别那 1% 内存块被分配且程序无法运行的实例。


    如果由于空了错误的指针并尝试使用它们来存储值，你的程序将立即崩溃。程序崩溃是一件坏事，但它也揭示了问题。问题确实存在，只是能否找到它的问题。


    ## 虚析构函数的声明

    当构造函数分配了在对象结束时应返回的资源时，请确保在类中定义了析构函数。一旦定义了析构函数，使其可见。


    ## 拷贝构造函数和重载赋值运算符

    如果你的类需要析构函数，那么它确实需要一个重载的赋值运算符加上拷贝构造函数。如果你的构造函数分配了如堆内存之类的资源，赋值运算符和默认拷贝构造函数将不会执行任何操作通过产生多个指针来产生问题。


    如果调用了这些对象的一个析构函数，它将返回资产。而当另一个拷贝的析构函数出现时，它就会搞乱一切。


    ## 在调试器中遵循每一步

    作为一个程序员，你的职责是理解你的程序在做什么。程序仅仅显示所需的值是不够的。你必须理解程序所做的一切。没有比逐步跟踪更能理解你的程序在做什么更好的方法了。获取一个好用的调试器并分步执行你的程序。


    再次，在你调试程序时，随身携带一些原始数据，以帮助你找出程序运行时可能出现的任何奇怪行为。没有比监控每个运行中的函数更彻底的方法来完成完整检查了。


    # 第 17 章：新版本：C++ 14

    C++ 14 于 2014 年 12 月发布。在发布之前，它经常被称为“C++1y”。C++14 为核心语言添加了大量的更新。在许多情况下，C++14 是在
    C++11 添加的功能的基础上构建的。总的来说，这是一个精细得多的，对用户的影响较小。


    ## 返回类型推导

    C++11 开启了 lambda 表达式，并允许它们根据表达式确定返回类型。这个新版本为所有函数赋予了这种能力。需要使用 `auto` 来确定返回类型。


    ## 放宽限制的 constexpr

    C++11 还引入了 `constexpr` 声明函数的概念。这本质上是一个可以在编译时执行的函数。在 C++11 中，`constexpr` 函数只能有一个表达式。C++14
    减少了版本 11 中存在的限制。这些函数现在能够包含以下内容：


    * 除了 `thread_local` 或 `static` 变量类型或任何未初始化的声明外的所有声明

    * 包括 `if` 语句和 `switch` 的条件

    * 任何循环语句，包括 `for` 或 `while`


    '
