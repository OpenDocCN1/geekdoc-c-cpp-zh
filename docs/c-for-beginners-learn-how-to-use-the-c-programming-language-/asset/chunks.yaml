    ![](image_rsrc376.jpg)


    # C++ for beginners: learn in a week step by step to use c++ programming language
    with practical examples for beginners


    ## Description

    `C++` is a computer programming language. It was developed to make number improvements
    to the then `C` programming language. `C` is a structured programming language
    whereas `C++` is an object-oriented programming language. This means that `C`
    introduced object-oriented programming features to the `C` programming language.
    Object oriented programming involves the treatment of items as objects. This is
    what `C++` does. It is a case sensitive programming language, meaning that it
    differentiates between uppercase from lowercase letters. You have to be keen when
    naming and referring/calling objects in `C++` so that you may call them using
    the right case according to their definition.


    To program in `C++`, you only a text editor and the `C++` compiler. The text editor
    will provide you with an environment where you will write your `C++` programs.
    It is recommended that you give your `C++` source files a `.cpp` extension to
    mark them `C++` files. It is the default extension used by the `C++` compiler.
    The purpose of the `C++` compiler is to process your `C++` source file to give
    you the result. There are many ways through which you can get this into your computer
    depending on the type of operating system you are using on your computer. For
    the case of the text editor, you can for the basic ones like `Notepad` on Windows
    and `vim` for Windows and Linux/Unix. Once you have assembled these, you can write,
    compile and execute `C++` programs on your computer.


    This guide will focus on the following:

    * C++ Functions

    * Operators

    * Storage classes

    * Identifiers

    * Decision Control in C++

    * Using Switch Statements

    * Writing and Reading Files

    * More on Functions & Data Types

    * Constants and Literals

    * Signed and Unsigned Data types

    * Introduction to Classes

    * Deeper Class Concepts

    * Object Oriented Programming

    * Improved Techniques

    * Multithreaded Applications in C++… AND MORE!!!


    ## Introduction

    `C++` is a general language that can work with a variety of huge systems, as well
    as smaller ones. It is a prominent language when creating commercial apps. There
    are large variety of items written in `C++`, these include:

    * Operating systems like `Linux` and `Mac OS X`

    * Games like `World of Warcraft` and the `Diablo` series

    * Popular `Wii`, `PlayStation` & `XBOX` games

    * Virtual Machines for programming languages (These languages include `Python`,
    `Java`, `Rudy`, `PFP`, `Perl`)

    * Popular software like `MS Office`, `Adobe Photoshop`, `Inventor` and `AutoCAD`)

    * Web Browsers (`Chrome`, `Internet Explorer` and `Firefox`)

    * Many Apple iOS applications

    '
