    \ 1\n\n# Chapter 3: Storage classes\n\nWithin a given C++ program, the scope and\
    \ the lifetime of the functions of variables defined by the storage class. The\
    \ specifiers placed in front of the type which they modify. In C++, the following\
    \ storage classes can be used.\n\n* `auto`\n* `static`\n* `register`\n* `mutable`\n\
    * `extern`\n\n## The auto Storage Class\n\nFor all of the local variables, the\
    \ default of storage class is the `auto` storage class.\nExample:\n```cpp\nint\
    \ mount;\nauto int month;\n```\nIn the examples given above there are two variables\
    \ defined in a storage class which is the same for both. The `auto` can only be\
    \ used with local variables.\n\n## The register Storage Class\n\nIf you wish to\
    \ define the local variables and store them in the RAM instead of the register,\
    \ you can use of the `register` storage class. This implies that the size of the\
    \ variable will be equal to the maximum size of the register. This cannot have\
    \ the `&` operator to it as there is no memory location for it.\nSyntax:\n```cpp\n\
    register int miles;\n```\nYou should only use these registers for the variables\
    \ which require a quick access, like counters. You should keep in mind that when\
    \ you define a `register`, it doesn't imply that the variable is stored in that\
    \ register. The variable might get stored in that register basing on the implementation\
    \ and hardware restrictions.\n\n## The Static Storage Class\n\nInstead of creating\
    \ and destroying local variable whenever it goes in and out of the scope, the\
    \ `static` storage class will tell the compiler to store the local variable during\
    \ its lifetime. So, if you want your local variables to keep their values during\
    \ function calls, you should make those are local variables static.\n\nThe `static`\
    \ modifier is not just limited to local variables, it can be applied to global\
    \ variables as well. After this, the scope of that variable will be restricted\
    \ to the file in which that variable is declared.\n\nWhen you use a `static` on\
    \ a data member of a class, only one copy of it will be shared by all the objects\
    \ of that class. Here is an example.\nExample:\n```cpp\n#include <iostream>\n\
    // Function declaration\nvoid func(void);\nstatic int count = 10; /* Global variable\
    \ */\nmain() {\n    while(count--) {\n        func();\n    }\n    return 0;\n\
    }\n// Function definition\nvoid func( void ) {\n    static int i = 5; // local\
    \ static variable\n    i++;\n    std::cout << \"i is \" << i ;\n    std::cout\
    \ << \" and count is \" << count << std::endl;\n}\n```\nWhen you compile and execute\
    \ the above code, it will produce the following output.\ni is 6 and count is 9\n\
    i is 7 and count is 8\ni is 8 and count is 7\ni is 9 and count is 6\ni is 10 and\
    \ count is 5\ni is 11 and count is 4\ni is 12 and count is 3\ni is 13 and count\
    \ is 2\ni is 14 and count is 1\ni is 15 and count is 0\n\n## The extern Storage\
    \ Class\n\nThere are some global variables which are visible to all of the program\
    \ files. The `extern` storage class can be used for giving the reference of these\
    \ global variables which are visible to the program files. You cannot initialise\
    \ the variable using the `extern` because it will only point debatable name to\
    \ a predefined storage location.\n\nIn cases where you have more than one files\
    \ and you define a function or a global variable which other files can use, the\
    \ `extern` where do you stay in a different file for giving the reference of The\
    \ function or variable. In simple words, we use the `extern` for declaring a function\
    \ or a global variables that is present in another file.\n\nIn cases where multiple\
    \ files share the same functions or global variables, the `extern` modifier is\
    \ used. Here is an example program.\nFirst File: `main.cpp`\n```cpp\n#include\
    \ <iostream>\nint count ;\nextern void write_extern();\nmain() {\n    count =\
    \ 5;\n    write_extern();\n}\n```\nSecond File: `support.cpp`\n```cpp\n#include\
    \ <iostream>\nextern int count;\nvoid write_extern(void) {\n    std::cout << \"\
    Count is \" << count << std::endl;\n}\n```\nHere, in this program the `count`\
    \ is declared in another file using the `extern` keyword. Now if you combine both\
    \ of these files as given below.\n`g++ main.cpp support.cpp -o writeA`\na right\
    \ executable program will be produced. Now try to execute it and check the result\
    \ as given below.\n`./write`\n\n# Chapter 4: Identifiers\n\nNow let us move on\
    \ to the identifiers in the program. These identifiers are used to identify multiple\
    \ things, such as classes, modules, functions and variables within a block. An\
    \ identifier is going to be a group of letters and numbers that you are able to\
    \ name your program or your files and they must start with a letter, but can have\
    \ any letter or number you want afterwards. There are no punctuation characters\
    \ other than what you might see in a sentence that are allowed as identifiers.\
    \ You will not see characters such as `@`, `&`, `%`, or `$` and the programming\
    \ is case sensitive. That means `YokoOno` is different than `Yokoono`, `yokoOno`,\
    \ and `yokoono`. Make sure that you are capitalizing only the letters that you\
    \ should be capitalizing in your programs. Though pretty much anything can be\
    \ an identifier, there are some things that are reserved for keywords in C++,\
    \ and can't be used as identifiers. These words are as follows.\n\n| asm | | |\n\
