    We can’t assume that the user automatically knows that these are even numbers.
    A viable solution would be to say that these are even numbers.![00151.jpeg](image_rsrc379.jpg)
    Now that looks a tad nicer. This is a great way to spice up your programs so they
    look even cooler. The user now knows what is being displayed.Remember to keep
    these messages simple and short. Don’t make a long description, but know that
    the user needs to know what is happening.Heads or TailsThis is the first game
    you will make. It will involve some basic skills that you will need to recover.
    Hopefully you haven’t forgotten anything at this point.Game Basis: A coin has
    two sides. It has a head and a tail. In a moment, the coin will be thrown in the
    air and will land on either heads or tails. Before it gets tossed, you have to
    guess whether the coin will land on either heads or tails. The coin gets tossed.
    If it lands on the side you guess, then you win the game. Otherwise you lose.All
    of your real code will be implemented in the main method. However, feel free to
    put some of it in a function if you really want to.Start with the logistics of
    what you need.Since you need something to decide whether the coin will land on
    heads or tails, a random number generator works best because it generates random
    values, just as a coin flip will land on a random side.Thus, include the Time
    and the Stdlib library at the top. ![00152.jpeg](image_rsrc37A.jpg) Now let’s
    welcome the user with a greeting to let them know they are playing the game. ![00153.jpeg](image_rsrc37B.jpg)
    “getch()” is a command to pause the program until the user presses ‘Enter’. Above,
    you will need to include the Conio library ( <conio.h> ) because it holds the
    “getch()” command.If otherwise, this is a decent way to start of a simple “text-based”
    game.Now it is time for the real game. Ask the player if he or she chooses heads
    or tails, and let the user input the choice.![00154.jpeg](image_rsrc37C.jpg)Now,
    decide whether the coin lands on either heads or tails. This is done with the
    random number generator. Even if numbers don’t necessarily mean the actual sides
    on a coin. You can assign them yourself. In this case, the number 1 will be heads,
    and 2 will be tails .So make a random number generator that will choose a number
    between 1 and 2\. Quite the small range eh? ![00155.jpeg](image_rsrc37D.jpg) After
    flipping the coin, it’s now time to decide the winner. This is done by telling
    different combinations of what the user picked and what the computer picked. ![00156.jpeg](image_rsrc37E.jpg)After
    that, you’ve sort of finished the whole game. Do note that you would have to enter
    your choice in lowercase the whole time, but feel free to edit the program to
    accept results with multiple cases like ‘Heads’, ‘HEADS’, or even ‘hEads’.Yes,
    cases like that can exist. You could even prepare for a event in which they spell
    the choice wrong.Test it out and see what happens.Full Program ![00157.jpeg](image_rsrc37F.jpg)
    Game RunthroughRock Paper ScissorsThis will be very similar to the game you just
    made previously, but there are a few more complexities to it.Game Basis: two players
    have one chance to choose among rock, paper, or scissors. At the same time, each
    player shows what he or she chooses using hand signals. The player’s selection
    determines whether he or she wins or loses. For example, if player 1 chooses rock,
    and player 2 chooses scissors, player 1 will lose because rock’s certain losing
    object is scissors, and scissors’ certain winning object is rock. If both players
    choose the same object, the game ends in a tie. Below is a chart that demonstrates
    what object beats another.![00158.jpeg](image_rsrc37G.jpg) As you see, you have
    an equal chance of winning, losing, or neither because you don’t know what the
    other player will choose.Start off with the basic outline you’ll use for every
    game in this book, if you haven''t realized. Now make your welcoming statement. ![00159.jpeg](image_rsrc37H.jpg)Now,
    ask the player to choose between rock, paper, and scissors. In this version, the
    player can choose each choice based on the number they’ve been placed by, so if
    someone wanted to choose rock, he or she would have to insert 1, and etc.![00160.jpeg](image_rsrc37J.jpg)Now
    let the computer choose its own choice. There is no actual way the player and
    the computer will choose the object at the same time, but even though the computer
    knows what you pick, it picks its object as though it has no idea of what you
    picked, and the choice will definitely not be based on what the player picked,
    just like in the heads or tails game.Do note that it is possible to make the player
    lose, win, or tie all the time. ![00161.jpeg](image_rsrc37K.jpg) Now it’s time
    to decide the winner of the game. The most simple algorithm to this strategy is
    to find the exact same combination of the two choices and printline the  results
    out.Once you start figuring it out, you’ll soon realize it gets pretty long.To
    make this as short as possible, first decide if there’s a tie, which removes out
    the requirement of having to insert more conditional statements.![00162.jpeg](image_rsrc37M.jpg)
    The last step is to decide the winner if it’s not a tie. Here is one of the most
    simplest ways you could do it, but it could take a while to get it all in. Oh
    well. ![00163.jpeg](image_rsrc37N.jpg) You’re sort of done at this point. Test
    it out, and see what happens.Full Program ![00164.jpeg](image_rsrc37P.jpg) Game
    Runthrough ![00165.jpeg](image_rsrc37R.jpg) If you thought that was hard, check
    the next one out.Guess the NumberThis is the final project you will do from this
    book.Game Basis: One person will think of a random number from 1 - 100, and another
    has to guess that number in 10 tries. Each time the number isn’t correct, they
    player will be told if it’s higher or lower, and if the player fails to guess
    the number in 10 tries, he or she loses.In this situation, you will have to guess
    a number the computer has chosen.Start with your outline. ![00166.jpeg](image_rsrc37S.jpg)
    Now have the computer create a number from 1 - 100. ![00167.jpeg](image_rsrc37T.jpg)
    Another way to start a good opening statement is with a plot, in which is used
    in this game. ![00168.jpeg](image_rsrc37U.jpg)Now let the user enter his or her
    first guess.![00169.jpeg](image_rsrc37V.jpg)Create the variable that will tell
    how many guesses the player has guessed. Right now, it starts at 0.![00170.jpeg](image_rsrc37W.jpg)In
    the game there will be some sort of loop. The loops will be repeating a set of
    commands to let the user try again until he or she runs out of tries. The commands
    will be detecting if the guess is higher, lower, or equal to the hidden number.![00171.jpeg](image_rsrc37X.jpg)
    Whenever the execution goes to the start of the loop, there has been a new previous
    guess, so add 1 to count. ![00172.jpeg](image_rsrc37Y.jpg) Detecting whether the
    guess is higher, lower, or equal to the hidden number involves one big conditional
    which will detect the relationship between both numbers.If the user guesses right,
    there is no need to use the loop, so the “break” statement will be used. ![00173.jpeg](image_rsrc37Z.jpg)
    If the user guesses higher or lower than the real number, tell the user to guess
    again, and whether it’s too high or too low.In review, this is what the loop looks
    like. ![00174.jpeg](image_rsrc380.jpg) Now you get the loop, but what happens
    after that? If you look back at it, you’ll see that the loop will only finish
    if the number is correct, or the player ran out of tries.So you need to detect
    why the computer left the loop in order to tell if the player won by guessing
    the number, or lost by running out of tries.Continue to make some more games and
    projects in C++. You are only limited by your imagination.Full Program ![00175.jpeg](image_rsrc381.jpg)
    Game RunthroughDragon ClashDragon Clash is a game made by the author. It’s a text
    based battle game where two dragons, the Light Dragon and the Dark Dragon, take
    turns attacking each other or healing themselves until one of them has no more
    strength anymore.It’s not some 60 dollar hit at your local game store, but it
    should be fun to play. If this whole game took him several days to do, think of
    how long it took to create something that ended up inside a game store. Think
    of how many people it took to create something like that.There is no official
    lesson on creating this. You will just be given the completed game.Full Program
    ![00176.jpeg](image_rsrc382.jpg) ![00177.jpeg](image_rsrc383.jpg) ![00178.jpeg](image_rsrc384.jpg)
    ![00179.jpeg](image_rsrc385.jpg) ![00180.jpeg](image_rsrc386.jpg) ![00181.jpeg](image_rsrc387.jpg)
    Game Runthrough ![00182.jpeg](image_rsrc388.jpg) ![00183.jpeg](image_rsrc389.jpg)
    ![00184.jpeg](image_rsrc38A.jpg) ![00185.jpeg](image_rsrc38B.jpg) ![00186.jpeg](image_rsrc38C.jpg)
    ![00187.jpeg](image_rsrc38D.jpg) This game is over 100 lines long. You’ll find
    many familiar subjects inside it. If you spend your time with it, you could find
    how your knowledge can be used to do such things.Below is a link to the game’s
    source in case you just want to copy and paste everything. You could understand
    how it works and even make it better. There are tons of ways to tweak it. This
    is just a small outline.https://pastebin.com/TS8ZhffmThere is something that could
    bother a few. If you look closely, you’ll see that there is a healing command.
    Your dragon can heal some of its health. However, there is no maximum amount of
    strength a dragon could have. It could run to an amount of hundreds of strength
    points. Try to fix that on your own and see if it works.From this point you now
    have the ability to create many projects. This book is the beginning of your new
    computer science journey, taught by someone who is still beginning his also, considering
    his very young age at the time.So this is the end of the book. Be sure to check
    out other tutorials to programming. There is way more to C++ than just what is
    in this book. Your journey to being a computer scientist has just begun.Other
    Projects You Can TryGame Link for Description Notes About the GameTic Tac Toe
    http://www.wikihow.com/Play-TicTac-ToeTry to also add a bigger board (4x4, 5x5,
    6x6, etc).Hangman http://www.wikihow.com/Play-Han gmanUse a lot of words or phrases
    to add more interest.Advance Nim https://www.seeker.com/youre-alwa ys-a-winner-with-advance-nim-179
    1396139.htmlTry to also make a different version where the computer is able to
    detect traps.Secret Maze Challenge https://en.wikipedia.org/wiki/Maze Use Random
    to generate the outcome if you don’t want to create an actual maze.Scientific
    Calculator https://en.wikipedia.org/wiki/Scient ific_calculatorIf you can, try
    to make a graphing calculator.Adventure game using Dialog Tree https://en.wikipedia.org/wiki/Dialog
    _treeWill need a lot of scenarios for best interestDictionary https://www.vocabulary.com/dictio
    nary/dictionaryHave the user enter a word and the computer will give a definition.
    You need to know what a hashmap is. After that, you’ll find the algorithm quite
    simple, but you’ll have to use a lot of words.RPG https://en.wikipedia.org/wiki/Role-p
    laying_video_gameWill need a lot of scenarios for best interest, and doesn’t have
    to be onlinePrime Number Sequence http://whatis.techtarget.com/definiti on/prime-numberPrints
    the nth prime number in which n is an inputted number.Fibonacci Sequence https://en.wikipedia.org/wiki/Fibon
    acci_numberPrints the nth fibonacci number in which n is an inputted number.Binary
    Converter https://www.mathsisfun.com/binary-number-system.htmlYou can also try
    ternary, quaternary, etc.Midpoint Test (Answer Key)Write the answer to each question
    clearly.1\. Name the mark used to end a statement.a. ;b. &c. @d. :2\. What is
    the difference between “cout” and “cin”?cout outputs values, and cin lets the
    user enter values.3\. What kind of slash lets strings to become manipulated a
    little such as adding a new line to the string, or bringing a certain type of
    quote to it?a. Forward Slashb. Back Slash4\. Write down the symbol of division
    and modulus and explain the difference between their abilities (assume your values
    are integers).Division displays the quotient and modulus displays the remainder.5\.
    What is the cause of a syntax error?a. The computer has found something that it
    can’t execute.b. The computer can’t read the script.c. The computer has crashed.d.
    The computer has a virus.6\. What is the difference between an float and a double?
    A float holds less bytes than a double7\. What is concatenation, and what symbol
    does it use? The process of combining two strings. <<8\. Write down the statement
    to include the time library. #include <time.h>9\. Assign 3 variables of 3 different
    types?10\. What is “include” used for? a. Erasing datab. Calling libraries c.
    Calling methods d. Displaying values11\. Name 3 kinds of mathematical operations
    that can be done with the Math class. Answers vary. May include any of the following
    in this linkhttp://www.cplusplus.com/reference/cmath/Chapter 19     Project: AgendaFor
    this project, we will simulate a phone agenda, like the one you have in your house
    and use them to keep record of all the important numbers you need, but we will
    do it using C++. For each contact, their name and their phone will be stored (although
    you can add as many fields as you want). Also, we will be using a new and very
    powerful feature of the Standard Template Library of C++: vector.Using vectorsImagine
    this phone agenda will have more than 100 phone numbers. Are you going to declare
    100 variables for the numbers? And another 100 for the names? Of course not. Here
    is where vector fits perfectly. With vector, you will be able to insert as many
    elements as you like. For using vector inside C++, we must add the library <vector>
    in our code. We will also need iostream and string.So, our libraries will be:#include
    <iostream>#include <string>#include <vector>using namespace std;After the namespace
    std, we are going to declare our vector. They will go outside the main function.
    By declaring any variable outside main (or any function) it means that this variable
    will be global. In other terms, anyone has access to them for reading and writing.
    Look closely at thesyntax:vector<string> Names;vector<string> Phones;The word
    vector obviously says that these variables will be vectors, but now, look inside
    the signs.There is the word string. With this, we tell C++ that our vectors will
    contain only strings. We can only have vectors of ints, of string, or any. You
    cannot mix data types in a single vector. Now, we will write our main function.
    Due to the nature of our program, we need to be able to navigate through its sections.
    The program will have three sections: add a contact, search for a contact using
    its ID and search for a contact using their name. For accomplish this, we will
    use a menu that will give us these three options and also an exit from the program.The
    main function would like the following code:int main(){int sel = 0;while(true){cout
    << "My Agenda++\n\n";cout << "Choose a number to execute an option\n\n";cout <<
    "[1] New Contact\n";cout << "[2] Search by ID\n";cout << "[3] Search by Name\n";cout
    << "[4] Exit\n";cout << "Your choice: ";cin >> sel;switch(sel){case 1:case 2:NewContact();break;SearchByID();break;SearchByName();break;case
    3:}if(sel==4){break;}}return 0;We only declared a single variable, named sel.
    Sel (for selection) will be used for the choice that the user selects at the menu.
    After the declaration, you can see how we declared an infinite loop using while(true).
    Why do we need an endless loop? Because the program will continue its execution
    until.. well, we don’t know. Inside our loop, there are the cout lines. In here,
    we show a little title to the user,  “Agenda++” followed by two line jumps. And
    the four following couts are used for telling the user that there are four different
    choices in the program. By selecting anyone of these, the program will know where
    to go. Next to this, we left the program to the user, where he will introduce
    its selections.That selection falls into the switch statement. If the user selects
    1, the program will go into the NewContact() function.Functions In C++ are a way
    of modeling the program. Not all the code is written inside the main function
    because it would be very difficult to follow and also to imagine how all of the
    piece of code connect themselves. Instead, we divide the program into small modules,
    where each one takes care of a single task.Important note: In the code, the main
    function must be the last function. Write all of the following functions in lines
    before main.In this example, the function NewContact() has the job to request
    the user to give a new name and a new phone, like this:void NewContact(){string
    name;string phone;cout << "\n\nEnter a name for the contact: ";cin >> name;cout
    << "Enter the phone for this contact: ";cin >> phone;cout << "The ID for this
    contact will be " << Names.size() <<"\n\n";Names.push_back(name);Phones.push_back(phone);Look
    how the function starts, it is very similar to the main function. The word void
    means that this function does not return anything (right now may sound confusing,
    but you’ll get it soon). After the brace is where the function code actually starts.
    The first thing we do is to declare a couple of string, one named name and the
    other one phone. These string will be used for the input from the user.We request
    the user to enter the name and the phone for the new contact. Now that we have
    it, we must assing this contact its ID number. Remember classes? The vector contains
    a property named size(), which tells us how many elements does the vector holds.
    In this case, we assign the ID as the current size.After that, we use another
    great tool from vector, actually the most basic one: push back. Imagine a vector
    like a deck of cards. The function push back will add a new element at the back
    of the actual deck.For this example, we add at the end of our name vector the
    value that the user entered. The same thing for the the phones. And now we have
    both values in our vectors.Now that we have our function for inserting values,
    we need to retrieve them from their storage.That is where the functions for search
    will be implemented.For the ID, our function will be like this:void SearchByID(){int
    value;cout << "\n\nEnter the ID of the contact to search: ";cin >> value;if(value
    >= Names.size()){cout << "This ID does not exist\n\n";return;}cout << "Information
    for contact " << value << "\n";cout << "Name: " << Names[value] << "\n";cout <<
    "Phone: " << Phones[value] << "\n";Again, first off everything, we write the function
    name, in this case will be SearchByID. After this, the variable value will contain
    the value that the user wants to search. Before making any search, we must assure
    that this variable is withing range from our vector. What does this means? Well,
    suppose we have a vector with 5 elements and the user inputs the number 8\. What
    should we do?We already know that our vector is 5 elements long, so, if the number
    that the user enters in the search is equal or greater than the size of our vector,
    then it will be of range.This is implemented using the if shown on the function.
    If this certain condition occurs, it will show a message on our program stating
    that “This ID does not exist” followed by the return keyword.The function of return
    is to terminate the function. In order to NOT execute any search, we must exit
    the function before it reaches the next code. Because of this, the return keyword
    is added and after the cout inside our condition, the function immediately ends
    and return to the main function.If the value entered by the user is a valid one,
    then, it will locate the information. Notice how in the last two couts we use
    the “[]” operator. This is called an index and it is used to differentiate values
    within the vector. It goes from 0 up to size() -1.Let’s suppose that the user
    enters for name the values: John, Michael, Sean. And for the phones:111111, 333333,
    555555\. Then, our vectors would be like this:Names = John, Michael, SeanPhones:
    111111,333333,555555If we want to retrieve the information, Names[0] would be
    John; Names[1] would be Michael andNames[2] would be Sean. The same occurs with
    the phones. So here, we use the ID given to retrieve these data and the show it
    to the screen.Finally, we’ll go to the search function but this time we will search
    by the name of the contact we want to find. The code for this function looks like
    this:void SearchByName(){bool found = false;string name;cout << "\n\nEnter the
    name to search: ";cin >> name;for(int i = 0; i != Names.size(); i++){if(Names[i]
    == name){cout << "Name: " << Names[i] << "\n";cout << "Phone: " << Phones[i] <<
    "\n";found = true;}}if(!found){Here we declared two variables, found and name.
    Name will be the string that we want to look for and found is a variable of data
    type BOOL (those that are only true or false) and will tell us if our search was
    either successful or failed.First, we request the user to enter the name to search
    for and after this, we will use a for loop tocycle through all of the elements.
    The accumulator is started, like usual, at zero. Now, notice how our condition
    has changed:I != Names.size()Thanks to this little function named size(), our
    for loop will be able to go through all the elements until it reaches the end
    of itself. With this size() function, we can be completely sure that we do not
    go out of bound of our vector. If you do not use size(), then you will have some
    kind of risk looping through the vector. If this error happens, it will be on
    runtime and the compiler wont warn you about this, so it’s safer to use the size
    function.Each lap that our loop has will compare the string at the I position
    in the vector with the string that the user entered. If both strings are equal,
    then it will show the user the name and the phone for that contact. Also, it will
    change the state of found to true.After exiting the loop, it will check if the
    variable found is false. The exclamation sign at the start of the variable means
    a negation (NOT) so, if found IS false, then the flow will fall on to the block
    of code of the if and show the user the message “No contact was found with this
    name”.After verifying the state, the function ends and the flow of the program
    returns to the main function.cout << "No contact was found with this name!\n\n";ConclusionThere
    is a lot that you have learned. C++ is an upgrade of C language. C++ has similar
    advantages just like the C language but it has more features. C++ boasts of a
    steep learning curve which might make it less appealing to a novice programmer.
    C++ programming is a great language for one who wants to write programs that require
    speed and scalability.You have seen that the C++ program supports object-oriented
    programming. Classes are used to define objects. Also, you learned that the general
    format of a C++ program begins with one or more header files that have a predefined
    function and class. By using the #Include keyword, you are able to use these files
    and permit your program to access classes and functions they define. After the
    header files, next is the class definitions plus their respective member functions.
    Next, you declare global variables for your program before the main() function
    is defined. Up to this point, you have read and understood important concepts
    in the C++ language. Although the book has tried to cover everything, there are
    at least some topics that are not covered. However, this should not be your last
    book to read in the C++ language. To become an expert in any language, you need
    to read a lot of books. Therefore, you have the challenge to look for advanced
    C++ books and further your knowledge of programming.'
