  trans: "\n\n我们现在可以使用这些函数来创建一个可工作的变长参数函数：\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <cstdarg>\n#include <iostream>\nusing namespace std;\n\nvoid Add(int numberOfVariables\
    \ , ...){\n    // 变量列表\n    va_list arg;\n    // 获取列表\n    va_start (arg, numberOfVariables\
    \ );\n    int total = 0;\n    for (int i = 0; i < numberOfVariables ; i++){\n\
    \        // 获取下一个变量\n        total += va_arg (arg, int);\n    }\n    // 清理\n \
    \   va_end (arg);\n    cout << \"Total is: \" << total << endl;\n}\n\nint main(){\n\
    \    // 4 个参数\n    Add(4,1, 2, 3, 4);\n    // 10 个参数\n    Add(10,6, 9, 5, 11,\
    \ 22, 1, 3, 56, 90, 63);\n}\n```\n\n输出：\nTotal is: 10\nTotal is: 266\n\n变量列表处理的每个部分都已标记，此函数会累加给到的所有参数。这提供了一种非常动态的方式，可以创建一个能够处理几乎无限参数列表的函数。\n\
    \n### 练习\n创建一个函数，将所有给定参数并返回一个值，然后打印该值。注意：需要此头文件：`#include <cstdarg>`\n\n### 答案\n\
    类似下面的代码：\n\n```cpp\n#include \"stdafx.h\"\n#include <cstdarg>\n#include <iostream>\n\
    using namespace std;\n\nint Multi(int numberOfVariables , ...){\n    va_list arg;\n\
    \    va_start (arg, numberOfVariables );\n    int total = 1;\n    for (int i =\
    \ 0; i < numberOfVariables ; i++){\n        // 获取下一个变量\n        total *= va_arg\
    \ (arg, int);\n    }\n    va_end (arg);\n    return total;\n}\n\nint main(){\n\
    \    cout << \"The total is: \" << Multi(3, 56, 90, 63) << endl;\n}\n```\n\n\n\
    ## 命名空间\nNamespaces（命名空间）用于防止同名的变量和函数混淆。例如，`Run()` 函数可能适用于许多情况，因此需要一种方法来区分不同的\
    \ `Run()` 函数，这就是可以使用命名空间的地方。\n\n它们的定义方式如下，大括号内的所有函数和变量都是该命名空间的一部分：\n\n```cpp\n\
    namespace NamespaceName{}\n```\n\n下面的示例展示了它们如何使用：\n\n定义了两个如下所示的命名空间，它们具有相同的函数名：\n\
    \n```cpp\nnamespace Proccesing{\n    void Run(){\n        cout << \"Processing!\"\
    \ << endl;\n    }\n}\n\nnamespace Initialisation{\n    void Run(){\n        cout\
    \ << \"Initialisation started!\" << endl;\n    }\n}\n```\n\n这为程序员提供了机会，通过只需指定命名空间来选择要执行哪一个\
    \ `Run()`：\n\n`Proccesing::Run();`\n和 `Initialisation::Run();`\n它们可以同时运行：\n\n\
    ```cpp\nint main(){\n    Initialisation::Run();\n    Proccesing::Run();\n}\n```\n\
    \n输出：\nInitialisation started!\nProcessing!\n\n因此，命名空间提供了一种整洁划分代码的方式，并通过提供一种几乎可以标记代码块的方法提高了可读性。\n\
    \n## 问题\n1. 建议使用 `struct` 的情况是什么？\n2. `enum` 是什么缩写？\n3. `union` 的大小是如何决定的？\n4.\
    \ 关于 `union` 的一个关键因素是什么？\n5. 什么是变长函数（Variadic function）？\n6 ` `va_list` 包含什么？\n\
    7. 为什么变长函数中需要指定参数数量？\n8. 为什么需要运行 `va_end()`？\n9. 命名空间的基本作用是什么？\n10. 调用命名空间内部的函数时使用什么语法？假设你在命名空间\
    \ `Math` 内部调用函数 `Add()`\n\n## 答案\n1. 用于普通旧数据 (POD)。\n2. 举举类型 (Enumerated type)。\n\
    3. 它是最大成员变量的大小。\n4. 所有成员变量共享相同的内存位置，因此一次只有一个变量可以持有值。\n5. 一个具有可能无限数量参数的函数。\n6.\
    \ 传递给函数的变量列表。\n7. 没有方法知道 `va_list` 的大小，因此你需要指定传递的参数数量。\n8. 它在变量列表使用后后执行清理工作。\n\
    9. 以有意义的方式划分和标记变量及函数。\n10. `Math::Add()`\n\n"
