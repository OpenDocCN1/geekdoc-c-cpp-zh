    Everything else is fair game when it comes to identifiers. Think of identifiers\
    \ as usernames and passwords. Mix it up, but make sure that they are functional.\n\
    \n### Trigraphs\nTrigraphs are going to be sequences of three characters that\
    \ will represent just one character. You will notice these because they are going\
    \ to start out with two questions marks at the beginning. Seems a little redundant\
    \ to use three characters when one will work, but the reason behind this is so\
    \ you do not confuse the program with the meaning of the character, as many are\
    \ similar. Here are some frequently used trigraphs to give you an example of what\
    \ we mean:\n\n- `??=` : #\n- `??/` : `\\`\n- `\\??'` : `^`\n- `??(` : `[`\n- `[??)`\
    \ : `]`\n- `]??!` : `|`\n- `??<` : `{`\n- `{??>` : `}`\n- `??-` : ~\n\nNot all\
    \ compilers support trigraphs due to their confusing nature, and most people try\
    \ to stay away from them, however it has been found that when you memorize trigraphs,\
    \ you are less likely to mess up by hitting the wrong symbol in your function.\n\
    \n### Whitespace\nMoving on to whitespace. This is the empty lines in a program.\
    \ Sometimes they contain comments, and these are known as blank lines. The compilers\
    \ completely ignore them. Whitespace describes blanks, new lines, tabs, characters\
    \ and comments. It is merely used to make your program look more organized and\
    \ readable. There should be at least one line of whitespace between the variable/identifier\
    \ and the statement.\n\n### QUIZ\nYou thought that you could just waltz through\
