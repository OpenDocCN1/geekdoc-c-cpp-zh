    \n\n\n\n\n\n\n\n\n\n\n\n\n最终的译译文：**\n\n[content]\n# 第 11 章：类类\n\n所有面向对象编程的核心在于“类”（classes）的概念，即你在整个代码中创建并使用的对象。这有助于模块化、易用性、效率，以及更具逻辑且更连贯的高级编程。\n\
    \n在 C 语言的早期版本中，有一种原始的类被称为 `struct`（结构体）。`struct` 在 C++ 中仍然存在，但主要已被废弃，转而使用类代替。尽管如此，`struct`\
