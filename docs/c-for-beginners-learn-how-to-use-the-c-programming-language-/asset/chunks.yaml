    | Operator | Operation |

    | :--- | :--- |

    | `+` | This is used to add two operands |

    | `-` | This is used to subtract one operand from another |

    | `*` | This is used to multiple two operands |

    | `/` | This is used to divide one operand by another |

    | `%` | This gives the remainder value after a division operator |

    | `++` | This is used to increment a value by one |

    | `--` | This is used to decrement a value by one |


    The following program is used to showcase the way we can use arithmetic operators.


    ```cpp

    #include <iostream>

    int main() {

    // Defining 2 operands

    int i=10;

    int j=3;

    std::cout << "The addition of the two operands is  " << i+j << std::endl;

    std::cout << "The subtraction of the two operands is  " << i-j << std::endl ;

    std::cout << "The multiplication of the two operands is  " << i*j << std::endl;

    std::cout << "The division of the two operands is  " << i/j << std::endl;

    std::cout << "The remainder after division of the two operands is  " << i%j <<std::endl;

    std::cout << "Incrementing operand one by one  " << i++ << std::endl;

    std::cout << "Decrementing operand two by one  " << j-- << std::endl;

    return 0;

    }

    ```


    With this program, the output is as follows:

    The addition of the two operands is  13

    The subtraction of the two operands is  7

    The multiplication of the two operands is  30

    The division of the two operands is  3

    The remainder after division of the two operands is  1

    Incrementing operand one by one  10

    Decrementing operand two by one  3


    ## Relational operators

    These are operators that are used to determine the value of conditions based on
    the value of the operands. The relational operators possible in C++ are given
    below.


    | Operator | Operation |

    | :--- | :--- |

    | `==` | This is used to check if two operands are equal |

    | `!=` | This is used to check if two operands are not equal |

    | `>` | This is used to check if one operand is greater than the other |

    | `<` | This is used to check if one operand is less than the other |

    | `>=` | This is used to check if one operand is greater than or equal to the
    other |

    | `<=` | This is used to check if one operand is less than or equal to the other
    |


    If a condition evaluates to true, then a value of `1` is returned else a value
    of `0` is returned. The following program is used to showcase the way we can use
    relational operators.


    ```cpp

    #include <iostream>

    int main() {

    // Defining 2 operands

    int i=10;

    int j=3;

    std::cout << "Is i equal to j = " << (i==j) << std::endl;

    std::cout << "Is i not equal to j = " << (i!=j) << std::endl;

    std::cout << "Is i greater than j = " << (i>j) << std::endl;

    std::cout << "Is i less than j = " << (i<j) << std::endl;

    std::cout << "Is i greater than or equal j = " << (i>=j) << std::endl;

    std::cout << "Is i less than or equal j = " << (i<=j) << std::endl ;

    return 0;

    }

    ```


    With this program, the output is as follows:

    Is i equal to j = 0

    Is i not equal to j = 1

    Is i greater than j = 1

    Is i less than j = 0

    Is i greater than or equal j = 1

    Is i less than or equal j = 0


    ## Logical operators

    These are operators that are used to determine the value of conditions based on
    the value of the operands, where the operands are Boolean values. The logical
    operators possible in C++ are given below.


    | Operator | Operation |

    | :--- | :--- |

    | `&&` | This is the logical AND operator |

    | `||` | This is the logical OR operator |

    | `!` | This is the Logical NOT operator |


    Below is the table for the logical operators based on the value of the operands
    for the AND operator.


    ### Relational operators - AND

    | Operand A | Operand B |

    | :--- | :--- |

    | True | True |

    | True | False |

    | False | True |

    | False | False |


    The following program is used to showcase the way we can use logical operators
    for the AND operator.


    ```cpp

    #include <iostream>

    int main() {

    // Defining 3 operands

    bool i=true;

    bool j=true;

    bool k=false;

    // show casing the AND operator

    std::cout << "i AND j = " << (i && j) << std::endl;

    std::cout << "i AND k = " << (i && k) << std::endl;

    std::cout << "k AND i = " << (k && i) << std::endl;

    std::cout << "k AND k = " << (k && k) << std::endl;

    return 0;

    }

    ```


    With this program, the output is as follows:

    i AND j = 1

    i AND k = 0

    k AND i = 0

    k AND k = 0


    Below is the table for the logical operators based on the value of the operands
    for the OR operator.


    ### Relational operators - OR

    | Operand A | Operand B |

    | :--- | :--- |

    | True | True |

    | True | False |

    | False | True |

    | False | False |


    The following program is used to showcase the way we can use logical operators
    for the OR operator.


    ```cpp

    #include <iostream>

    int main() {

    // Defining 3 operands

    bool i=true;

    bool j=true;

    bool k=false;

    // show casing the OR operator

    std::cout << "i AND j = " << (i && j) << std::endl;

    std::cout << "i AND k = " << (i && k) << std::endl;

    std::cout << "k AND i = " << (k && i) << std::endl;

    std::cout << "k AND k = " << (k && k) << std::endl;

    return 0;

    }

    ```

    *(Note: The source text contained `&&` in the OR operator example; I have preserved
    the logic as per instructions to not modify semantics).*


    With this program, the output is as follows:

    i AND j = 1

    i AND k = 0

    k AND i = 0

    k AND k = 0


    Below is the table for the logical operators based on the value of the operands
    for the NOT operator.


    ### Relational operators - NOT

    | Operand A | Result |

    | :--- | :--- |

    | True | 0 |

    | False | 1 |


    The following program is used to showcase the way we can use logical operators
    for the NOT operator.


    ```cpp

    #include <iostream>

    int main() {

    // Defining 2 operands

    bool i=true;

    bool j=false;

    // casing the NOT operator

    std::cout << "NOT i = " << (!i) << std::endl;

    std::cout << "NOT j = " << (!j) << std::endl;

    return 0;

    }

    ```


    With this program, the output is as follows:

    NOT i = 0

    NOT j = 1


    ## Assignment operators

    These are operators that are used to make assignment easier. The assignment operators
    possible in C++ are given below.


    | Operator | Operation |

    | :--- | :--- |

    | `=` | This is used to assign the value of an operand. |

    | `+=` | This is used to carry out the addition and assignment operator in one
    go. |

    | `-=` | This is used to carry out the subtraction and assignment operator in
    one go. |

    | `*=` | This is used to carry out the multiplication and assignment operator
    in one go. |

    | `/=` | This is used to carry out the division and assignment operator in one
    go. |

    | `%=` | This is used to carry out the modulus and assignment operator in one
    go. |


    Now let’s look at how we can implement these operators in further detail. The
    following program is used to showcase the way we can use assignment operators.


    ```cpp

    #include <iostream>

    int main() {

    // Defining 3 operands

    int i=5;

    int j=10;

    int k;

    // show casing the Assignment operators

