  trans: "\n\n# 第 11 章：类类\n\n所有面向对象编程的核心在于“类”（classes）的概念，即你在整个代码中创建并使用的对象。这有助于模块化、易用性、效率，以及更具逻辑且更连贯的高级编程。\n\
    \n在 C 语言的早期版本中，有一种原始的类被称为 `struct`（结构体）。`struct` 在 C++ 中仍然存在，但主要已被废弃，转而使用类。尽管如此，`struct`\
    \ 仍然是重要的内容。C++ 的 `struct` 也与 C 的 `struct` 不同。C 结构体并不具备 C++ 结构体的许多功能。\n\n在我们深入之前，让我们简要讨论访问修饰符（access\
    \ modifiers）的概念。我们讨论过像 `int`、`string`、`bool` 和 `float` 等被称为类型的内容。我们使用枚举器创建了可以看作是某种类型。然而，你可以创建一个由较小数据片段和固有函数组成的整个类型。这被称为对象。\n\
    \n访问修饰符描述了代码中哪些内容可以被修改。三种不同的访问修饰符：\n- **Public**（公共）访问意味着对象和/或其内部数据及函数可以被程序的任何其他代码访问和修改。\n\
    - **Protected**（受保护）意味着对象和/或其内部数据及函数只能被其派生类访问和修改。（当我们学习继承和多态时就会理解这一点了。）\n- **Private**（私有）意味着只有对象本身可以访问和修改其数据。这对于安全性、清晰性和代码安全至关重要。\n\
    \n结构体和类都是创建新对象的方法。`struct` 和类的主要区别在于 `struct` 默认是公共的，而类默认是私有的。除此之外，其他差异微乎其微。\n\
    \n然而，在技术行业中，`struct` 带有相当的负面含义。开发者倾向于将其视为功能较少的未受保护的对象，而倾向于将类视为功能强大且具有良好结构和子类的对象。因此，除非你的对象功能非常少，且仅包含极少量数据和固有函数，否则通常创建类更好。\n\
    \n看这个 `struct` 及其声明：\n\n```cpp\nstruct animal {\n    enum diet { herbivore, omnivore,\
    \ carnivore };\n    int legs;\n    string name;\n    diet naturalDiet;\n};\n\n\
    int main() {\n    animal dog;\n    dog.legs = 4;\n    dog.name = \"Dog\";\n  \
    \  dog.naturalDiet = dog.carnivore;\n}\n```\n\n这是声明新对象最简单的方法。你绝对不应该在现有函数内部声明它们。\n\
    \n让我们把那个 `struct` 替换为类，因为我们以后将使用类，因为它们通常是比 `struct` 更安全、更好的选择。在 CodeBlocks 中创建一个名为“AnimalSimulator”的新项目。删除\
    \ `main.cpp` 的内容并导入 `iostream` 并创建你的 `main` 方法。\n\n在 `main` 方法上方，让我们声明一个名为 `Animal`\
    \ 的类。你的做法与声明 `struct` 非常相似：\n\n```cpp\nclass animal { string name; };\n```\n\n\
    然后在你的 `main` 方法中，声明一个实例并将该实例的 `name` 设置为你最喜欢的动物的名字。之后，尝试编译。你应该会收到一个提示“error: string\
    \ animal::name is private”的错误。完美。这完全是应该发生的，因为现在我们必须修复它。这就是整个访问描述概念出现的地方。\n\n修改你的类，使其看起来像这样：\n\
    \n```cpp\nclass animal {\npublic:\n    string name;\n};\n```\n\n然后尝试编译。这次应该可以正常运行。这是因为我们将字符串“name”设为公共了，这意味着类本身之外的其他方法/函数可以访问它。尽管这通常被认为是坏习惯，所以我们将这样重写类：\n\
    \n```cpp\nclass animal {\nprivate:\n    string name;\n};\n```\n\n修改类内值的最佳实践是使用\
    \ get/set 方法。如果你实现了 get/set 方法，该类看起来会是这样：\n\n```cpp\nclass animal {\nprivate:\n\
    \    string name;\npublic:\n    string getName() {\n        return this->name;\n\
    \    }\n    void setName(string name) {\n        this->name = name;\n    }\n};\n\
    ```\n\n现在，在你的 `main` 方法中，在声明任何动物后，不要直接修改它的名字，而应该使用如下 get/set 方法（假设你的 `animal`\
    \ 名为“dog”）：\n\n```cpp\ndog.setName(\"dog\");\n```\n\n然后你可以通过在 `main` 方法中打印名字来测试这一点：\n\
    \n```cpp\ncout << \"The name of my favorite animal is: \" << dog.getName() <<\
    \ \"\\n\";\n```\n\n这些方法的工作原理是通过类内部的方法返回或设置变量的值。`this->` 被称为 `this` 指针，它指向类给定实例的变量。每个对象都可以访问自己的变量，并通过\
    \ `this` 指针直接修改它们。\n\n无论如何，你的代码应该运行得非常完美。但如果你不想为每个类的每个实例都通过 get/set 处理呢？那么你可以使用所谓的初始化函数（initializer\
    \ function）。修改你的类，使其看起来像这样：\n\n```cpp\nclass animal {\nprivate:\n    string name;\n\
    public:\n    animal(string name) {\n        this->name = name;\n    }\n    string\
    \ getName() {\n        return this->name;\n    }\n    void setName(string name)\
    \ {\n        this->name = name;\n    }\n};\n```\n\n现在，在你的 `main` 函数中，删掉显示 `animal\
    \ x` 以及后续 `x.setName(\"name\")` 函数的代码块。当你创建一个初始化函数时，你可以从一开始就设置某些变量。例如，由于你的初始化函数接受\
    \ `name` 参数，你可以在声明变量时声明它，从而绕过整个 `setName` 操作。看这个代码示例：\n\n```cpp\nanimal dog(\"\
    dog\");\nanimal elephant(\"elephant\");\nanimal bird(\"bird\");\n```\n\n这些都是 `animal`\
    \ 类的独立实例，得益于函数初始化，它们的名字在没有使用 set 函数的情况下就被设置了。这使得创建新对象变得极其简单，过程也非常精简。\n\n现在我们已经讨论了一会儿关于声明对象之类的内容，让我们更多地讨论一下对它们进行的具体操作。这里的\
    \ `animal` 对象当然代表动物。我们可以给整个类设置一组它们可以执行的方法。\n\n让我们思考一下每种动物都在做什么。每种动物都会睡觉、进食和喝水，对吧？所以将这些内容包含在我们的类中并不太奇奇，这样\
    \ `animal` 类的每个成员对象都能够执行这些方法。假设我们有两种特定类型的食物：肉类和植物，它们也都由各自相应的对象表示。我们可以为此创建两个不同的函数：\n\
    \n```cpp\nvoid eat(plant p) { // 此处写代码 }\nvoid eat(meat m) { // 此处写代码 }\n```\n\
    \n尽管它们共享同一个名称，但你可以根据放入函数调中的对象类型来调用其中一个，并且两者都会根据你包含的参数执行各自的代码。这被称为函数重载（function\
    \ overloading）。它是面向对象编程中一项至关重要的技术，将帮助你创建功能且清晰的代码集，便于人们使用和理解。\n\n因为在我们最初学习类时创建大量类型是很繁琐的，所以我们就把“eat”留为一个不接受参数的\
