    Besides this, you must develop a standard format for your module headers and supply
    information related to classes, functions, author-date, and something about the
    history of modification.


    **Tip**: All programmers working on a solo project should use the same coding
    style. Programs written in different coding styles confuse and sound unprofessional.


    ## Turn on Warning and Error Messages

    The syntax of C++ language provides the ability to check errors. Anytime a compiler
    comes across a construct that is difficult to decipher, it has nothing else to
    do but to display a message. It attempts to sync and back up the source code.
    There are times when this process is successful but it will not create an executable
    file. This will force the programmer to deal with all the error messages.


    Nonetheless, once a C++ program finds a structure which it can run but the structure
    looks fishy, it will simply send a warning message. And the reason for this is
    because C++ language knows exactly what you want, so it proceeds and builds an
    executable file that will help you ignore the warnings. However, if you don’t
    want to be disturbed, you can deactivate the warnings.


    **Tip**: Disabling warnings is a really bad idea. It is like disconnecting the
    check engine in the car. Remember. Ignoring a problem is not a solution.


    ## Comment on the Code

    Errors can be prevented when one comments on the code. Make it a habit to comment
    your code when you write instead of waiting until when things work then you can
    return to comment. Comments are a great way to help you understand what you are
    trying to do. Short comments are better when you revise your program.


    ## Limited Visibility

    Reducing the accessibility to the external world of the inner members of a class
    is a key part in object-oriented programming. The class has to be accounted for
    its members. If something goes wrong in the class, then it is the fault of the
    programmer.


    Limited visibility calls for data members to protect accessibility beyond the
    class. In short, the data members should be protected. Also, all member functions
    which the application software should not be aware of must be protected.


    ## Monitor the heap memory

    Forgetting to monitor the heap memory is one of the major sources of fatal errors
    in many released programs. This is again one of the hardest problems for one to
    track since this particular class of error is difficult to locate and remove.
    Most of the time, it exists in programs you buy. It will require you to run the
    program for many hours before problems start to show up. Programmers need to allocate
    and release a heap of memory as a general rule.


    ## Use Exceptions to fix errors

    To handle errors in the C++ language, the exception mechanism is built. Generally,
    it is good to send an error indicator instead of a return error flag.


    **Tip**: Use exceptions to errors that are true. It is irrelevant to throw an
    exception from a function which sends an indicator that something didn’t work.


    ## Remove pointers once you delete what they point to

    Ensure that you remove pointers once you delete what they were pointing to. You
    do this by allocating the pointers a `nullptr` value. You will come to learn about
    this in time. You may easily find yourself using a memory block returned to the
    heap when you don’t know. There is a chance for a program to run well 99 percent
    of the time, but it would be hard to identify the 1 percent of instances when
    the block is assigned and the program fails to work.


    In case you null out false pointers and try to use them to store a value, your
    program will immediately crash. A program crash is a bad thing, but it also reveals
    a problem. The problem exists, it is just a question of whether you can find it
    or not.


    ## Declaration of virtual destructors

    Make sure that you define a destructor in your class when a constructor allocates
    resources that should be returned when the object ends. Make the destructor visual
    once you have defined it.


    ## Copy constructor and overloaded assignment operator

    If your class will need a destructor, it really needs an overloaded assignment
    operator plus a copy constructor. If your constructor assigns resources such as
    the heap memory, the assignment operator and default copy constructor will not
    perform anything to create problems through producing multiple pointers.


    If one destructor for these objects is invoked, it will return the assets. And
    when the destructor for the other copy appears, it spoils up things.


    ## Follow every step in the debugger

    Being a programmer, it is your role to understand whatever your program is doing.
    It is not enough that the program displays the required value. You must understand
    everything that your program does. There is no better way to understand what your
    program is doing than following up step by step. Get a good debugger and execute
    your program stepwise.


    Again, while you debug your program, have with you some raw data to help you figure
    out any strange behavior that may arise when your program runs. There is no better
    way to do a complete check than monitoring each function as it runs.


    # Chapter 17: The New Versions: C++ 14

    C++ 14 was released in December of 2014. It was often coined “C++1y” up until
    it’s release. C++14 added a plethora of updates to the core language. In many
    instances C++14 builds upon functionality which was added within C++11. Overall
    it is a much daintier version with less impact on users.


    ## Return Type Deduction

    C++11 brought about the onset of lambda expressions and allowed them to determine
    the return type based on the expression. This newer version gave this ability
    to all functions. The use of `auto` is needed in order to determine the return
    type.


    ## Relaxed Restrictions constexpr

    C++11 also brought about the notion of `constexpr`-declared function. This is
    essentially a function which can be execute at the time of compile. In C++11 a
    `constexpr` function could only have one expression. C++14 decreased the amount
    of restrictions which were present in version 11. These functions are now able
    to include the following:


    * All declarations except `thread_local` or `static` variable types or any declarations
    without initialization

    * Conditions including `if` statements and `switches`

    * Any loop statements including `for` or `while`

