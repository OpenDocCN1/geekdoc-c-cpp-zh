  trans: "\n\n如果不需要为这些信息添加功能，那么结构体（structure）是这种情况的完美选择。存储此类信息的结构体定义如下：\n\n```cpp\n\
    struct FootballPlayer{\n    string Name;\n    int KitNumber;\n    double Wage;\n\
    \    string StrongestFoot;\n};\n```\n\n该结构包含了所有相关值，这将为相似信息提供一个相关的容器。结构体的新实例定义如下：\n\
    \n```cpp\nFootballPlayer player1;\nplayer1.Name = \"Messi\";\nplayer1.KitNumber\
    \ = 10;\nplayer1.Wage = 1000000;\nplayer1.StrongestFoot = \"Both\";\n```\n\n这段代码将创建一个\
    \ `FootballPlayer` 并为它的所有成员变量赋值。在现实世界中，结构体的用法倾向于“简单”使用，即仅需要存储像示例那样的微小数据；当需要功能和封装时，请使用类（class）。这被称为\
    \ `POD`（纯旧数据数据）封装。注意：结构体变量的默认访问权限是公有的（public），而类的默认权限是私有的（private）。\n\n### 枚举\
    \ (Enums)\n\n`Enums` 是枚举类型（Enumerated Type）的缩写，它的作用类似于布尔值，但具有无限的用户定义类型，它可以用于诸如“主屏幕”或“设置屏幕”等情况的标记。\n\
    \n枚举的定义如下：\n\n```cpp\nenum CurrentScreen{HOME, SETTINGS, CONTACTS, CALCULATOR};\n\
    ```\n\n括号中的每个单词都是枚举可以设置的状态。枚举实例的创建方式如下：\n\n```cpp\nint main(){\n    CurrentScreen\
    \ phone1;\n    phone1 = HOME;\n}\n```\n\n上述代码创建了一个新枚举并将其赋值为“HOME”。你现在可以使用该枚举来检查它处于什么状态，下面的示例将使用\
    \ `switch-case` 语句：\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing\
    \ namespace std;\nenum CurrentScreen{HOME, SETTINGS, CONTACTS, CALCULATOR};\n\
    int main(){\n    CurrentScreen phone1;\n    // 修改我\n    phone1 = HOME;\n    switch\
    \ (phone1){\n        case HOME:\n            cout << \"You're on the home page\"\
    \ << endl;\n            break;\n        case SETTINGS:\n            cout << \"\
    You're on the settings page\" << endl;\n            break;\n        case CONTACTS:\n\
    \            cout << \"You're on the contacts page\" << endl;\n            break;\n\
    \        case CALCULATOR:\n            cout << \"You're on the calculator page\"\
    \ << endl;\n            break;\n        default:\n            break;\n    }\n\
    }\n```\n\n**输出**\nYou’re on the home page\n\n这段代码展示了你可以将条件结构与枚举结合，轻松地创建一个良好的分支结构。尝试修改注释的“修改我”枚举定义，并观察输出如何变化。\n\
    \n### 联合体 (Unions)\n\n联合体（Unions）是为了提供高效内存利用而设计的数据结构，它可以包含任意数量的成员变量，但一次只能存储一个变量的数据。因此，整个结构只占用最大成员变量的内存。\n\
    \n使用联合体必须谨慎，因为设置另一个成员变量的值将移除存储在另一个变量中的数据，因此很容易丢失重要数据。\n\n联合体的定义如下：\n\n```cpp\n\
    union Example{\n    int i;\n    int x;\n    int y;\n};\n```\n\n创建实例并赋值的方式如下：\n\
    \n```cpp\nExample e;\ne.i = 4;\n```\n\n为了展示联合体的大小是如何工作的，下面的程序对其进行了演示：\n\n```cpp\n\
    #include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nunion Example{\n\
    \    int i;\n    int x;\n    int y;\n};\nint main(){\n    Example e;\n    e.i\
    \ = 4;\n    cout << \"Your int size is: \" << sizeof (int ) << \" bytes\" << endl;\n\
    \    cout << \"The union has 3 variables that should be a total of: \" << sizeof\
    \ (int ) * 3 << \" bytes\" << endl;\n    cout << \"However, the union is \" <<\
    \ sizeof (e) << \" bytes\" << endl;\n}\n```\n\n**输出**\nYour int size is: 4 bytes\n\
    The union has 3 variables that should be a total of:  12 bytes\nHowever, the union\
    \ is 4 bytes\n\n如所见，联合体的大小仅等于单个整数。在变量空闲且只需要一个变量的情况下，这些结构可以高效地利用内存。\n\n下面的代码展示了当改变一个值时，所有值会发生什么：\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nunion\
    \ Example{\n    int i;\n    int x;\n    int y;\n};\nvoid Print_Union(Example e\
    \ ){\n    cout << \"i: \" << e .i << endl;\n    cout << \"x: \" << e .x << endl;\n\
    \    cout << \"y: \" << e .y << endl;\n}\nint main(){\n    Example e;\n    cout\
    \ << \"1\" << endl;\n    e.i = 4;\n    Print_Union(e);\n    cout << \"2\" << endl;\n\
    \    e.y = 3;\n    Print_Union(e);\n    cout << \"3\" << endl;\n    e.x = 1;\n\
    \    Print_Union(e);\n}\n```\n\n**输出**\n1\ni: 4\nx: 4\ny: 4\n2\ni: 3\nx: 3\ny:\
    \ 3\n3\ni: 1\nx: 1\ny: 1\n\n如所见，当你改变其中一个值时，它们都变得相等，这是因为所有值都共享相同的内存位置，因此当其中一个改变时，所有的都会改变。\n\
    \n### 可变参数列表 (Variable argument lists)\n\n可变参数列表允许无限参数的可能性。之前我们遇到过具有固定数量参数（可以传递到方法的变量）的函数，例如：\n\
    \n```cpp\nint Add(int i, int y){}\n```\n\n有两个参数：整数 `i` 和整数 `y`。这被称为变变函数（Variadic\
    \ Function）或具有无限元数（参数数量，上述 `Add` 的元数为 2）的函数。\n\n变量存储在一个名为 `va_list` 的变量中，它的工作与其他任何变量一样，只是它持有了传递的变量列表。变变函数的定义如下：\n\
    \n```cpp\nvoid Add(int numberOfVariables , ...){}\n```\n\n其中 `numberOfVariables`\
    \ 是传递的额外参数数量，注意这不包括该变量本身。这是必要的，因为 `va_list` 并不知道变量的总数，也不会跟踪它在列表中的位置。使用 `va_list`\
    \ 需要使用几个函数：\n\n*   `va_start(va_list, numberOfVariables)`\n    *   获取传入的变量，并将第二个参数指定的数字赋值给第一个参数。\n\
    *   `va_arg(va_list, type)`\n    *   从第一个参数指定的列表中获取下一个变量，并创建一个由 `type` 指定类型的变量。\n\
    *   `va_end(va_list)`\n    *   清理列表。\n"
- fmt: "\nWe can now use these functions to create a working variadic function:\n\n\
    ```cpp\n#include \"stdafx.h\"\n#include <cstdarg>\n#include <iostream>\nusing\
    \ namespace std;\n\nvoid Add(int numberOfVariables , ...){\n    //The variable\
    \ list\n    va_list arg;\n    //Grabs the list\n    va_start (arg, numberOfVariables\
    \ );\n    int total = 0;\n    for (int i = 0; i < numberOfVariables ; i++){\n\
    \        //Grabs the next variable\n        total += va_arg (arg, int);\n    }\n\
    \    //Clean up\n    va_end (arg);\n    cout << \"Total is: \" << total << endl;\n\
    }\n\nint main(){\n    // 4 Arguments\n    Add(4,1, 2, 3, 4);\n    // 10 Arguments\n\
    \    Add(10,6, 9, 5, 11, 22, 1, 3, 56, 90, 63);\n}\n```\n\nOutput:\nTotal is:\
    \ 10\nTotal is: 266\n\nEach section of the variable list process is labelled,\
    \ this function adds all parameters it’s given. This gives a very dynamic way\
    \ to create one function that can handle an almost infinite list of parameters.\n\
    \n### Exercise\nCreate a function that multiplies all the parameters given and\
    \ returns a value, print out that value. Note: this #include is required: `#include\
    \ <cstdarg>`\n\n### Solution\nSomething like this:\n\n```cpp\n#include \"stdafx.h\"\
    \n#include <cstdarg>\n#include <iostream>\nusing namespace std;\n\nint Multi(int\
    \ numberOfVariables , ...){\n    va_list arg;\n    va_start (arg, numberOfVariables\
    \ );\n    int total = 1;\n    for (int i = 0; i < numberOfVariables ; i++){\n\
    \        //Grabs the next variable\n        total *= va_arg (arg, int);\n    }\n\
    \    va_end (arg);\n    return total;\n}\n\nint main(){\n    cout << \"The total\
    \ is: \" << Multi(3, 56, 90, 63) << endl;\n}\n```\n\n\n## Namespaces\nNamespaces\
    \ are used to prevent variables and functions with the same name getting mixed\
    \ up, for example the function `Run()` can be applicable in many situations so\
    \ there needs to be a way to distinguish between different `Run()` functions,\
    \ this is where namespaces can be used.\n\nThey are defined like so with all functions\
    \ and variables in the curly brackets being part of that namespace:\n\n```cpp\n\
    namespace NamespaceName{}\n```\n\nThe example below shows how they are used:\n\
    \nTwo namespaces are defined like so with the same function name:\n\n```cpp\n\
    namespace Proccesing{\n    void Run(){\n        cout << \"Processing!\" << endl;\n\
    \    }\n}\n\nnamespace Initialisation{\n    void Run(){\n        cout << \"Initialisation\
    \ started!\" << endl;\n    }\n}\n```\n\nThis gives the programmer the opportunity\
    \ to pick which `Run()` they can execute by just specifying the namespace like\
    \ so:\n\n`Proccesing::Run();`\nand `Initialisation::Run();`\nand with them both\
    \ run together:\n\n```cpp\nint main(){\n    Initialisation::Run();\n    Proccesing::Run();\n\
    }\n```\n\nOutput:\nInitialisation started!\nProcessing!\n\nNamespaces therefore\
    \ gives a way to neatly segment code, and improves readability by providing a\
    \ way to almost label blocks of code.\n\n## Questions\n1. What is the recommended\
    \ situation you should use a `struct`?\n2. What is `enum` short for?\n3. How the\
    \ size of a `union` dictated?\n4. What is a key factor about a `union`?\n5. What\
    \ is a Variadic function?\n6. What does a `va_list` hold?\n7. Why do you need\
    \ to specified the number of parameters in a variable function?\n8. Why does `va_end()`\
    \ need to be run?\n9. What is the base role of a namespace?\n10. What syntax is\
    \ used when calling a function inside a namespace, say you’re calling the function\
    \ `Add()` inside the namespace `Math`?\n\n## Answers\n1. For plain old data (POD).\n\
    2. Enumerated type.\n3. It’s the size of its largest member variable.\n4. All\
    \ the member variables share the same memory location so only on variable can\
    \ hold a value at once.\n5. A function with a possibly unlimited number of parameters.\n\
    6. A list of passed in variables to a function.\n7. There is no way to tell the\
    \ size of a `va_list`, so you need to specify the number of passed parameters.\n\
    8. It performs the clean-up of the variable list when it has been used.\n9. To\
    \ segment and label variables and functions in a meaningful way.\n10. `Math::Add()`\n"
