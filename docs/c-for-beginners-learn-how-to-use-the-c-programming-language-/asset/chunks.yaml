    ## 关系运算符

    这些是用于根据操作数的值来确定条件的值的运算符。C++ 中可能的关系运算符如下。


    | 运算符 | 操作 |

    | :--- | :--- |

    | `==` | 用于检查两个操作数是否相等 |

    | `!=` | 用于检查两个操作数是否不等 |

    | `>` | 用于检查一个操作数是否大于另一个操作数 |

    | `<` | 用于检查一个操作数是否小于另一个操作数 |

    | `>=` | 用于检查一个操作数是否大于或等于另一个操作数 |

    | `<=` | 用于检查一个操作数是否小于或等于另一个操作数 |


    如果条件求为真，则返回值 `1`，否则返回值 `0`。以下程序用于演示如何使用关系运算符。


    ```cpp

    #include <iostream>

    int main() {

    // Defining 2 operands

    int i=10;

    int j=3;

    std::cout << "Is i equal to j = " << (i==j) << std::endl;

    std::cout << "Is i not equal to j = " << (i!=j) << std::endl;

    std::cout << "Is i greater than j = " << (i>j) << std::endl;

    std::cout << "Is i less than j = " << (i<j) << std::endl;

    std::cout << "Is i greater than or equal j = " << (i>=j) << std::endl;

    std::cout << "Is i less than or equal j = " << (i<=j) << std::endl ;

    return 0;

    }

    ```


    使用此程序，输出如下：

    Is i equal to j = 0

    Is i not equal to j = 1

    Is i greater than j = 1

    Is i less than j = 0

    Is i greater than or equal j = 1

    Is i less than or equal j = 0


    ## 逻辑运算符

    这些是用于根据操作数的值（操作数值为布尔值）来确定条件的值的运算符。C++ 中可能的逻辑运算符如下。


    | 运算符 | 操作 |

    | :--- | :--- |

    | `&&` | 逻辑与（AND） |

    | `||` | 逻辑或（OR） |

    | `!` | 逻辑非（NOT） |


    下面是根据操作数值对应的 AND 运算符逻辑运算符表。


    ### 关系运算符 - AND

    | 操作数 A | 操作数 B |

    | :--- | :--- |

    | True | True |

    | True | False |

    | False | True |

    | False | False |


    以下程序用于演示如何将 AND 运算符逻辑运算符。


    ```cpp

    #include <iostream>

    int main() {

    // Defining 3 operands

    bool i=true;

    bool j=true;

    bool k=false;

    // show casing the AND operator

    std::cout << "i AND j = " << (i && j) << std::endl;

    std::cout << "i AND k = " << (i && k) << std::endl;

    std::cout << "k AND i = " << (k && i) << std::endl;

    std::cout << "k AND k = " << (k && k) << std::endl;

    return 0;

    }

    ```


    使用此程序，输出如下：

    i AND j = 1

    i AND k = 0

    k AND i = 0

    k AND k = 0


    下面是根据操作数值对应的 OR 运算符逻辑运算符表。


    ### 关系运算符 - OR

    | 操作数 A | 操作数 B |

    | :--- | :--- |

    | True | True |

    | True | False |

    | False | True |

    | False | False |


    以下程序用于演示如何将 OR 运算符逻辑运算符。


    ```cpp

    #include <iostream>

    int main() {

    // Defining 3 operands

    bool i=true;

    bool j=true;

    bool k=false;

    // show casing the OR operator

    std::cout << "i AND j = " << (i && j) << std::endl;

    std::cout << "i AND k = " << (i && k) << std::endl;

    std::cout << "k AND i = " << (k && i) << std::endl;

    std::cout << "k AND k = " << (k && k) << std::endl;

    return 0;

    }

    ```

    *(注：源文本在 OR 运算符示例中包含 `&&`；根据指令保留了该逻辑，未修改语义).*


    使用此程序，输出如下：

    i AND j = 1

    i AND k = 0

    k AND i = 0

    k AND k = 0


    下面是根据操作数值对应的 NOT 运算符逻辑运算符表。


    ### 关系运算符 - NOT

    | 操作数 A | 结果 |

    | :--- | :--- |

    | True | 0 |

    | False | 1 |


    以下程序用于演示如何将 NOT 运算符逻辑运算符。


    ```cpp

    #include <iostream>

    int main() {

    // Defining 2 operands

    bool i=true;

    bool j=false;

    // casing the NOT operator

    std::cout << "NOT i = " << (!i) << std::endl;

    std::cout << "NOT j = " << (!j) << std::endl;

    return 0;

    }

    ```


    使用此程序，输出如下：

    NOT i = 0

    NOT j = 1


    ## 赋值运算符

    这些是用于简化赋值操作的运算符。C++ 中可能的赋值运算符如下。


    | 运算符 | 操作 |

    | :--- | :--- |

    | `=` | 用于给操作数赋值。 |

    | `+=` | 一步完成加法和赋值操作。 |

    | `-=` | 一步完成减法和赋值操作。 |

    | `*=` | 一步完成乘法和赋值操作。 |

    | `/=` | 一步完成除法和赋值操作。 |

    | `%=` | 一步完成取模和赋值操作。 |


    现在让我们详细查看如何实现这些运算符。以下程序用于演示如何使用赋值运算符。


    ```cpp

    #include <iostream>

    int main() {

    // Defining 3 operands

    int i=5;

    int j=10;

    int k;

    // show casing the Assignment operators

    std::cout << "The value of i+j is " << (k=i+j) << std::endl;

    std::cout << "The value of i+=j is " << (i+=j) << std::endl;

    std::cout << "The value of i-=j is " << (i-=j) << std::endl;

    std::cout << "The value of i*=j is " << (i*=j) << std::endl;

    std::cout << "The value of i/=j is " << (i/=j) << std::endl;

    std::cout << "The value of i%=j is " << (i%=j) << std::endl;

    return 0;

    }

    ```


    使用此程序，输出如下：

    The value of i+j is 15

    The value of i+=j is 15

    The value of i-=j is 5

    The value of i*=j is 50

    The value of i/=j is 5

    The value of i%=j is 5


    ## 位运算运算符

    这些是用于对操作数进行位操作的运算符。C++ 中可能的位运算运算符如下。


    | 运算符 | 操作 |

    | :--- | :--- |

    | `&` | 如果两个操作数的对应位都为 1，则结果对应位为 1 |

    | `|` | 如果任意一个操作数的对应位为 1，则结果对应位即为 1 |

    | `^` | 如果仅有一个操作数的对应位为 1，则结果对应位为 1 |

    | `<<` | 将左操作数的值向左移动右操作数指定的位数 |

    | `>>` | 将左操作数的值向右移动右操作数指定的位数 |


