  trans: "\n此列表证明了 C++ 是一种通用语言，它几乎可以完成任何事情。如果你在好奇 C++ 在明天或未来 10 年后是否仍然适用，那么答案是肯定的！C++\
    \ 结合其前身 C 语言，可以访问硬件并实现高层次的抽象。它是仅次于 C 的第三种常用语言，在 Java 之后位居第二。目前，还没有竞争对手可以取代 `C++`。\n\
    \n# 第 1 章：C++ 函数\n\n函数指的是一组执行相关任务的语句。C++ 中的每个程序都至少有一个函数，即 `main()` 函数，并且在程序中可以定义更多函数。一个\
    \ C++ 程序可以被细分为一组函数。你如何细分代码取决于你个人，但应该以这种方式进行，使得每个函数都执行某个特定的任务。当这些代码分组在一起并命名后，你就可以很容易地通过函数名反复调用它来重用这些代码。同样，代码将得到优化，因为你不需要再次编写它。\n\
    \n假设你的目标是检查三个数字 150、230 和 450，以判断它们是偶数还是奇数。如果不使用函数，你每次都必须为偶数编写逻辑。这将导致代码的重复。然而，通过使用函数，你只需要编写一次逻辑并不断调用它。\n\
    \n## 函数声明\n\n函数声明的作用是告诉 C++ 编译器函数的名称、返回类型和参数。在 C++ 中定义一个函数，我们使用以下语法：\n\n```cpp\n\
    returnType functionName( dataType parameter...)    \n{\n    //function body code\n\
    }\n```\n\n从上述语法中，你可以看出函数定义由头部和函数体组成。函数可以返回任何值。`returnType` 表示函数返回的值的数据类型。然而，也有某些函数会在不返回任何值的情况下执行其任务。在这种情况下，返回类型应该是\
    \ `void`。\n\n`functionName` 是函数的名称。`functionName` 同参数列表构成了函数签名。将参数视为一个占位符。当你调用函数时，你向参数传递一个值。该值将是实际参数或实参。注意，每个参数都关联一个数据类型。此外，请注意有些函数是没有参数的。函数体应该包含定义函数在被调用时应该做什么的语句。\n\
    \n这是一个简单函数的示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\nvoid myFunc()\
    \ { \n    static int x = 0 ; //static variable\n    int y = 0 ; //local variable\n\
    \    x++;\n    y++;\n    cout << \"x is: \" << x << \" and y is: \" << y << endl\
    \ ; \n}\nint main()\n{\n    myFunc();\n    myFunc();\n    myFunc();\n}\n```\n\n\
    该代码执行时应打印以下输出：我们定义了一个名为 `myFunc()` 的函数。该函数没有参数，类型为 `void`，意味着它不返回任何内容。在函数体内，我们定义了一个静态变量\
    \ `x` 和一个变量 `y`。它们的值被初始化为 0。然后我们对这两个变量都使用了自增运算符。\n\n我们结束了函数 `myFunc()` 体。在 `main()`\
    \ 方法中，我们调用了三次函数 `myFunc()`。注意，调用期间没有传递参数值，因为我们的函数不接受参数。由于 `x` 是静态变量，语句 `x++` 每次调用都会让\
    \ `x` 的值加 1，这意味着我们将得到 1、2 和 3。对于变量 `y` 来说情况会有不同，因为它没有被标记为静态。它将返回 1、1 和 1。现在你已经知道为什么会有上述输出了。\n\
    \n让我们创建一个接受参数的函数示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ maxNum( int x, int y) {\n    int result;\n    if ( x > y)\n    result = x;\n\
    \    else\n    result = y;\n    return result;\n}\nint main () {\n    int max;\n\
    \    // call the function\n    max = maxNum( 5 , 12 );\n    cout << \"The maximum\
    \ value is : \" << max << endl;\n     0}\n```\n\n该代码应返回以下结果：我们声明了一个名为 `maxNum()`\
    \ 的函数，它接受两个整数参数 `x` 和 `y`。函数的返回类型是整数，意味着它的返回值将是一个整数。在 `main()` 方法中，我们通过以下行调用了函数并传递了值：`max\
    \ = maxNum( 5 , 12 );`。发生的情况是参数 `x` 的值为 5，`y` 的值为 12。顺序非常重要。`result` 将赋值给名为 `max`\
    \ 的变量。最后，我们为函数实现了逻辑。我们希望函数返回两个整数中较大的一个。如果 `x` 的值大于 `y`，则 `x` 将变为 `result`。如果 `y`\
    \ 大于 `x`，则 `y` 将变为 `result`。在上面的调用中，函数比较了 5 和 12。对于任何接受参数的函数，必须声明接收值的变量。这些变量被称为函数的形式参数。形式参数的行为与函数中的局部变量相似，它们在进入函数时创建，在退出时销毁。有多种传递方式。\n\
    \n### 按值传递\n\n这种机制涉及将实际值复制到函数的形式参数。函数内部对参数的任何更改对参数都没有影响。这是 C++ 中使用的默认。这意味着函数中的代码不能改变参数。让我们创建一个简单的示例来演示这一点：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nvoid substitute( int value);\n\
    int main()\n{\n    int value = 2 ;\n    substitute( value);\n    cout << \"The\
    \ value is: \" << value<< endl;\n    return 0 ;\n}\nvoid substitute( int value)\n\
    {\n    value = 10 ;\n}\n```\n\n该代码应返回以下输出：我们定义了一个名为 `substitute()` 的函数，接受一个名为\
    \ `value` 的整数参数。在函数的实现中，我们将值设置为 10。然而，在 `main()` 方法中，我们将其改为 2。这就是为什么会有上述输出。按值传递是在以下行实现的：`int\
    \ value = 2; substitute( value );`。我们初始化了值并传递给函数。这就是简单的按值传递。\n\n### 按指针传递\n\n\
    这种机制涉及将参数的地址复制到形式参数。然后使用该地址获取函数内部参数的实际值。这意味着如果对参数进行更改，参数将受到影响。按指针传递，应该像传递其他值一样将参数传递给函数。这意味着函数参数应该定义为指针类型，如下所示：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n// declare a function\nvoid\
    \ interchange( int * a, int * b);\nint main () {\n// declare local variable\n\
    int x = 5 ;\nint y = 12 ;\ncout << \"Before the interchange, the value of x is\
    \ :\" << x << endl ;\ncout << \"Before the interchange, the value of y is :\"\
    \ << y << endl ;\n/* call the function to interchange the values.\n&x indicates\
    \ pointer to x, is, address of variable x and\n&y indicates pointer to y, is,\
    \ address of variable y.*/\ninterchange(& x, & y);\ncout << \"After the interchange,\
    \ the value of x is :\" << x << endl ;\ncout << \"After the interchange, the value\
    \ of y is :\" << y << endl ;\nreturn 0 ;\n}\n// defining a function to swap values.\n\
    void interchange( int * a, int * b) {\n    int temp;\n    temp = *a ; /* save\
    \ value at address a */\n    *a = *b ; /* put b into a */\n    *b = temp ; /*\
    \ put a into b */\n}\n```\n\n通过指针传递，我们能够交换存储在不同地址上的值。代码执行后返回：\n\n### 按引用传递\n\n\
    在按引用传递中，参数的引用被复制到形式参数。在函数内部，我们使用引用来访问调用中实际参数。这表明对参数所做的更改将影响参数。按引用传递值，应该像传递其他值一样将参数传递给函数。形式参数的行为与函数中的局部变量相似，它们在进入函数后创建，在退出时销毁。\n\
    \n###  运算符\n\n## 算术运算符\n\n这些是用于处理数字的运算符。最常用的运算符所示如下。\n算术运算符\n"
