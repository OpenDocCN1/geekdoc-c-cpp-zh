- fmt: "\n1. Decide on the shared data variables (also called member or instance variables)\
    \ and declare these variables as `private` in the `class` (they cannot be accessed\
    \ outside of the class).\n2. Write the `public` functions that work with the shared\
    \ variables inside the `class`.\n3. Write a `main` function that creates object(s)\
    \ of that `class` and tests the functions.\n\nHere’s how to write a new class\
    \ called `Student` in C++:\n\n```cpp\nclass Student {\nprivate:  // the data (called\
    \ member or instance or shared variables )\n    string name;\n    long int id;\n\
    \    double gpa;\npublic: // the member functions\n    void inputData() {\n  \
    \      cout << “Please enter the student’s name: “;\n        cin >> name;  //\
    \ has access to the shared variables above\n        cout << “Please enter the\
    \ student’s id: “;\n        cin >> id;\n    }\n    void calculateGPA(){ ….}\n\
    };  // note the ; that ends the class definition\n```\n\nThen, you can write a\
    \ `main` function that tests the new class by creating 3 `Student` objects `s1`,\
    \ `s2`, `s3`, and call their public functions by using the `.` operator (which\
    \ can be pronounced as ’s, e.g. `s1’s inputData()` function which will fill in\
    \ `s1’s` data):\n\n```cpp\nint main() {\n    Student s1, s2, s3;\n    s1.inputData();\n\
    \    s2.inputData();\n    s1.calculateGPA();\n}\n```\n\nObject-Oriented Programming\
    \ also follows the principle of `Data Encapsulation` and `Information Hiding`.\
    \ It protects the data by making it `private` and provides `public` functions\
    \ to securely access the data. The `private` specifier means that member variables\
    \ are only accessible inside the `class` – they are shared and accessible by the\
    \ functions inside that `class`. All shared variables in the `class` should be\
    \ declared under `private`. The `public` specifier means that it is accessible\
    \ by anyone anywhere (inside and outside the class). Functions are usually made\
    \ `public`.\n\nMost modern programming languages are now object-oriented because\
    \ there are certain advantages to this type of programming. Here are some advantages\
    \ of OOP:\n\n- It protects the data. No one but your functions inside the class\
    \ can change them.\n- Functions tend to be shorter and better designed. Because\
    \ they all share the private data variables, they have fewer arguments.\n- Programmers\
    \ make less errors because they don’t have to pass around the data variables as\
    \ arguments to functions.\n- It’s easier to extend a class and create a new class\
    \ promoting `Software Reuse / Inheritance`.\n\n## Member Functions inside a Class\n\
    \nMost classes have some standard functions written inside them:\n\n- `Accessor/Mutator\
    \ (get/set)` functions: simple functions called `set` and `get` that set a shared\
    \ variable to a value and return (`get`) a shared variable.\n- `Input/Output`\
    \ functions: asks the user for the values for the shared variables or prints them\
    \ out.\n- `Constructor Functions`: initializes the shared variables.\n- Other\
    \ Special Functions (for example, `deposit/withdraw` for `BankAccount` class).\n\
    \nFor example, here is the `Student` class again with `get/set` functions for\
    \ the name of the student:\n\n```cpp\nclass Student {\nprivate:\n    string name;\n\
    \    long int id;\npublic:\n    void setName(string n) { name = n; }\n    string\
    \ getName() { return name; }\n    void inputData() {\n        cout << “Please\
    \ enter the student’s name: “;\n        cin >> name;\n        cout << “Please\
    \ enter the student’s id: “;\n        cin >> id;\n    }\n    void outputData()\
    \ {\n        cout << name << endl;\n        cout << id << endl;\n    }\n}; //\
    \ end of class\n```\n\nA special type of function in OOP is the `constructor function`\
    \ which initializes all the shared variables to initial values. `Constructor functions`\
    \ must have the same name as the `class` and no return type. They get called automatically\
    \ when you create objects of the `class`. Here is a default constructor function\
    \ `Student()` which gets called automatically when you declare an object of the\
    \ class `Student`: e.g. `Student s1;`\n\n```cpp\nStudent() {\n    name = \"\"\
    ;  // initializes all the shared variables to default values\n    id = 0;\n  \
    \  gpa = 0;\n}\n```\n\n`Constructors` can also take arguments that are copied\
    \ into the member variables:\n\n```cpp\npublic Student(String n, long int i) {\n\
    \    name = n;\n    id = i;\n}\n```\n`//` Called in `main()` as: `Student s1(“Chris”,\
    \ 12345);`\n\nThe keyword `this` is sometimes used inside the member functions\
    \ to refer to the calling object, e.g. `s1`. So when we use `name` in the `Student`\
    \ constructor above, we want this object, `s1’s`, name, and could write `this.name`.\n\
    \nProgrammers often divide up object-oriented programs into different files. The\
    \ `class` definition with just the prototypes of the function goes into a header\
    \ file, e.g. `Student.h`. The member functions are put in a different file, e.g.\
    \ `student.cpp`, which includes the header file at the top, e.g. `#include \"\
    Student.h\"`. The `main` function is put in a separate file too, e.g. `driver.cpp`,\
    \ and it includes the header file too. These files are all put into the same project\
    \ (`New/Project`) in the editor and compiled together.\n\n## Array of Objects\n\
    \nObjects are often put into arrays or more complex data structures such as `vectors`.\
    \ For example, we usually want more than a couple student objects in our programs.\
    \ We might want to keep track of all the students in a classroom or even a school\
    \ and need hundreds or thousands of students. The new class types we have created\
    \ can be used everywhere a simple data type is used. So we can declare an array\
    \ of `Student` objects as easily as declaring an array of `ints`:\n\n```cpp\n\
    Student studentArray[100]; // contains 100 Student objects\n```\n\nOr we can declare\
    \ a dynamic array of students:\n```cpp\nVector<Student> students;\n```\n\nWe can\
    \ use loops to go through our array and call each student’s functions:\n\n```cpp\n\
    for(int i=0; i < 100; i++)\n    studentArray[i].inputData(); // call student i’s\
    \ inputData() function\n```\n\nWe can also pass the whole array to a function.\
    \ For example:\n\n```cpp\nvoid inputArray(Student studentArray[]) {\n    for(int\
    \ i=0; i < 100; i++)\n        studentArray[i].inputData();\n}\n```\n\nLuckily,\
    \ the array name always serves as its address in `C++`, so the array’s address\
    \ will be passed in automatically to the function, instead of copying the whole\
    \ array, and will change the original array.\n\n## Projects\n\n1. Create a `Date`\
    \ class that contains `month`, `day`, and `year` and `set/get` and `input/output`\
    \ functions and a default constructor that sets the date to the current date.\
    \ Test it out in a `main` function.\n2. Create a `BankAccount` class that contains\
    \ information about a bank account (the owner, the balance, etc.) and the standard\
    \ functions as well as functions to `withdraw()` and `deposit()`.\n3. Create an\
    \ `Array` of Student` objects and use a loop to fill them with data. Then, find\
    \ the student with the highest `gpa`.\n\n# Chapter 14: Improved Techniques\n\n\
    ## Structures\n\n`Structs` originate from `C`, and come from the world of pre-class\
    \ programming. However, they’re still useful and can be use in places where classes\
    \ are deemed as overkill. A good example of using a structure being used can be\
    \ for record keeping, for example you needed to keep track of football players\
    \ in a team you would need to store:\n\n- Name\n- Kit Number\n- Wage\n- Strongest\
    \ foot\n- Etc.\n"
  raw: '1.  Decide on the shared data variables (also called member or instance variables
    ) and declare these variables as private in the class (they cannot be accessed
    outside of the class).


    2.  Write the public functions that work with the shared variables inside the
    class.


    3.  Write a main function that creates object(s) of that class and tests the functions.
    .


    Here’s how to write a new class called Student in C++:class Studentprivate:  //
    the data  (called member or instance or shared variables )string name;long int
    id;double gpa;public: // the member functionsvoid inputData()cout << “Please enter
    the student’s name: “;cin >> name;  // has access to the shared variables abovecout
    << “Please enter the student’s id: “;cin >> id;}   void calculateGPA(){ ….}    }; 
    // note the ; that ends the class definitionThen, you can write a main function
    that tests the new class by creating 3 Student objects s1, s2, s3, and call their
    public functions by using the . operator (which can be pronounced as ’s, e.g.
    s1’s inputData() function which will fill in s1’s data):int main()Student s1,
    s2, s3; s1.inputData();s2.inputData();s1.calculateGPA();Object-Oriented Programming
    also follows the principle of Data Encapsulation and Information Hiding. It protects
    the data by making it private and provides public functions to securely access
    the data. The private specifier means that member variables are only accessible
    inside the class – they are shared and accessible by the functions inside that
    class.  All shared variables in the class should be declared under private. The
    public specifier means that it is accessible by anyone anywhere (inside and outside
    the class). Functions are usually made public.Most modern programming languages
    are now object-oriented because there are certain advantages to this type of programming.
    Here are some advantages of OOP:


    *   It protects the data. No one but your functions inside the class can change
    them.


    *   Functions tend to be shorter and better designed. Because they all share the
    private data variables, they have fewer arguments.


    ·          Programmers make less errors because they don’t have to pass around
    the data variables as arguments to functions.  


    *   It’s easier to extend a class and create a new class promoting Software Reuse
    / Inheritance .


    Member Functions inside a ClassMost classes have some standard functions written
    inside them:


    *   Accessor/Mutator (get/set) functions : simple functions called set and get
    that set a shared variable to a value and return (get) a shared variable.


    *   Input/Output functions: asks the user for the values for the shared variables
    or prints them out.


    *   Constructor Functions: initializes the shared variables.


    *   Other Special Functions (for example, deposit/withdraw for BankAccount class).


    For example, here is the Student class again with get/set functions for the name
    of the student:class Student{private:string name;long int id;public:void setName(
    string n )name = n;string getName()return name;void inputData()cout << “Please
    enter the student’s name: “;cin >> name;cout << “Please enter the student’s id:
    “;cin >> id;void outputData()cout << name << endl;cout << id << endl;}; // end
    of classA special type of function in OOP is the constructor function which initializes
    all the shared variables to initial values. Constructor functions must have the
    same name as the class and no return type. They get called automatically when
    you create objects of the class. Here is a default constructor function Student()
    which gets called automatically when you declare an object of the class Student:
    e.g. Student s1;Student()name = “”;  // initializes all the shared variables to
    default valuesid = 0;gpa = 0;Constructors can also take arguments that are copied
    into the member variables:public Student(String n, long int i) {name = n;int =
    i;}  // Called in main() as:  Student s1(“Chris”, 12345);The keyword this is sometimes
    used inside the member functions to refer to the calling object, e.g. s1\. So
    when we use name in the Student constructor above, we want this object, s1’s,
    name, and could write this.name.Programmers often divide up object-oriented programs
    into different files. The class definition with just the prototypes of the function
    goes into a header file, e.g. Student.h. The member functions are put in a different
    file, e.g. student.cpp, which includes the header file at the top, e.g. #include
    “Student.h”. The main function is put in a separate file too, e.g. driver.cpp,
    and it includes the header file too. These files are all put into the same project
    (New/Project) in the editor and compiled together.Array of ObjectsObjects are
    often put into arrays or more complex data structures such as vectors. For example,
    we usually want more than a couple student objects in our programs. We might want
    to keep track of all the students in a classroom or even a school and need hundreds
    or thousands of students. The new class types we have created can be used everywhere
    a simple data type is used. So we can declare an array of Student objects as easily
    as declaring an array of ints:Student studentArray[100];  // contains 100 Student
    objectsOr we can declare a dynamic array of students:Vector students<Student>;We
    can use loops to go through our array and call each student’s functions:for(int
    i=0; i < 100; i++)studentArray[i].inputData(); // call student i’s inputData()
    functionWe can also pass the whole array to a function. For example,void inputArray(Student
    studentArrayarray[ ] ) {for(int i=0; i < 100; i++)studentArray[i].inputData();Luckily,
    the array name always serves as its address in C++, so the array’s address will
    be passed in automatically to the function, instead of copying the whole array,
    and will change the original array.Projects1.      Create a Date class that contains
    month, day, and year and set/get and input/output functions and a default constructor
    that sets the date to the current date. Test it out in a main function.2.     
    Create a BankAccount class that contains information about a bank account (the
    owner, the balance, etc.) and the standard functions as well as functions to withdraw()
    and deposit().3.      Create an Array of Student objects and use a loop to fill
    them with data. Then, find the student with the highest gpa.Chapter 14     : Improved
    TechniquesStructuresStructs originate from C, and come from the world of pre-class
    programming. However, they’re still useful and can be use in places where classes
    are deemed as overkill. A good example of using a structure being used can be
    for record keeping, for example you needed to keep track of football players in
    a team you would need to store:


    *   Name


    *   Kit Number


    *   Wage


    *   Strongest foot  


    *   Etc'
