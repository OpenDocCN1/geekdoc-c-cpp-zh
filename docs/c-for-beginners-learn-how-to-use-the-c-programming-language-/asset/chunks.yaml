    *   One is the breaking of an integer into a short and long integer.


    *   And next is the ability to add signs for a value to indicate whether it is
    a signed or unsigned value.


    Data types ranges for short, long, signed and unsigned


    | Type | Range |


    | char | -128 to 127 or 0 to 255 |


    | unsigned char | 0 to 255 |


    | signed char | -128 to 127 |


    | int | -2147483648 to 2147483647 |


    | unsigned int | 0 to 4294967295 |


    | signed int | -2147483648 to 2147483647 |


    | short int | -32768 to 32767 |


    | unsigned short int | 0 to 65,535 |


    | signed short int | -32768 to 32767 |


    | long int | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |


    | signed long int | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |


    | unsigned long int | 0 to 18,446,744,073,709,551,615 |


    | float | +/- 3.4e +/- 38 |


    | double | +/- 1.7e +/- 308 |


    The following program is used to showcase the way we can define unsigned and signed
    values in C++.


    | #include <iostream>int main() {unsigned char c1=244;signed char c2=-100;unsigned
    int i1=1;signed int i2=-11;std::cout << "An example of an unsigned character value
    is " << int(c1) << std::endl;std::cout << "An example of a signed character value
    is " << int(c2) << std::endl;std::cout << "An example of an unsigned integer value
    is " << i1 << std::endl;std::cout << "An example of a signed integer value is
    " << i2 << std::endl;return 0;} |


    With this program, the output is as follows:An example of an unsigned character
    value is 244An example of a signed character value is -100An example of an unsigned
    integer value is 1An example of a signed integer value is -11The following program
    is used to showcase the way we can use short and long integers in a C++ program.


    | #include <iostream>int main() {short int i1=1;long int i2=110000000 ;std::cout
    << "An example of a short integer value is " << int(i1) << std::endl;std::cout
    << "An example of a long integer value is " << int(i2) << std::endl;return 0;}
    |'
