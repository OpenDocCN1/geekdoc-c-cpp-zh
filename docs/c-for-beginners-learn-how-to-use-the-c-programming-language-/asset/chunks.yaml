- fmt: "\nThis is a listing of the main library features that `C++14` has to offer,\
    \ there are also a vast amount of smaller library addition.\n\n### User Defined\
    \ Literals\n`C++14` added a number of suffixes which are used to specify the type\
    \ of defined literal. Some examples of these suffixes include `'s'` or `'st'`.\
    \ This is for the character and string type. The last line of the given example\
    \ will throw an error. This is because `str` will be determined as `'const char*'`\
    \ type however `str1` will be determined to be a `string`. The following suffixes\
    \ – `'h'`, `'min'`, `'s'`, `'ms'`, `'us'`, `'ns'` are used to signify various\
    \ time duration interval types.\n\n### Binary Literals\nUp until the advent of\
    \ `C++14` binary literals like `11111101` were not supported. IN order to use\
    \ them they needed to be converted to a supported type. The following code snippet\
    \ shows how they are used in programming.Binary laterals begin with `0b` or `0B`.\
    \ This prefix is then followed by a series of zeros and ones. A similar syntax\
    \ can be found in a variety of other programming languages. The programming languages\
    \ include `Java`, `Perl` and `Python`, all of which already provide support for\
    \ binary literals. The binary literal has a type of `int`. It is accepted in all\
    \ places that a constant literal is accepted.\n\n### Variable Template\nThe intended\
    \ purpose of a variable template is to make coding easier and simplify definitions\
    \ and the use of constants. A variable template essentially is the definition\
    \ for a group of variables. A variable template is created by using a template\
    \ declaration at the place at which a variable is declared. These are simply a\
    \ few of the features which were introduced with `C++14`. A number of other features\
    \ were introduced but are not strong advancements. Some of the minor features\
    \ which were included with `C++14` include sized deal locations and some syntax\
    \ tidying. Although the `C++14` versioning does not compare to the major updates\
    \ in `C++11` it is necessary.\n\n# Chapter 18: Game Design\n\n## Introduction\
    \ to Game Design\nAt this point, you know how to do many things in `C++`, and\
    \ you’ve practically learned everything this book has to offer. This unit is dedicated\
    \ solely to making computer games you could mess with when your internet is down.\
    \ You won’t learn much from this, but it is more of a way to gain experience.\
    \ These games pass time and are fun to play until the internet comes back. You\
    \ will focus on games that are easy to make. Each time, the represented game will\
    \ focus deeper on complex subjects and user relationships. All of these upcoming\
    \ games will be one player against the computer, so you don’t have to worry about\
    \ bringing a friend to play along with you. However, you can modify the games\
    \ to have a multiplayer mode, but it won’t be a big requirement for a good basic\
    \ stencil.\n\n### User-Friendliness\nUser-friendliness is the term used when evaluating\
    \ how easy it is to use your program. Even if you make a really complex program,\
    \ the user should have a practical time using it. Confusing controls and limited\
    \ ideals of input can confuse the user, and the user will not like your program,\
    \ and you’ll be sad because your program failed to succeed because no one liked\
    \ it. Here’s just one example of making a program more user-friendly. Say you\
    \ have a program to display some even numbers, and here’s what the program looks\
    \ like when run.\n\nSuppose someone saw that program. We can’t assume that the\
    \ user automatically knows that these are even numbers. A viable solution would\
    \ be to say that these are even numbers.\n\nNow that looks a tad nicer. This is\
    \ a great way to spice up your programs so they look even cooler. The user now\
    \ knows what is being displayed. Remember to keep these messages simple and short.\
    \ Don’t make a long description, but know that the user needs to know what is\
    \ happening.\n\n### Heads or Tails\nThis is the first game you will make. It will\
    \ involve some basic skills that you will need to recover. Hopefully you haven’t\
    \ forgotten anything at this point.\n\nGame Basis: A coin has two sides. It has\
    \ a head and a tail. In a moment, the coin will be thrown in the air and will\
    \ land on either heads or tails. Before it gets tossed, you have to guess whether\
    \ the coin will land on either heads or tails. The coin gets tossed. If it lands\
    \ on the side you guess, then you win the game. Otherwise you lose.\n\nAll of\
    \ your real code will be implemented in the `main` method. However, feel free\
    \ to put some of it in a `function` if you really want to.\n\nStart with the logistics\
    \ of what you need. Since you need something to decide whether the coin will land\
    \ on heads or tails, a random number generator works best because it generates\
    \ random values, just as a coin flip will land on a random side. Thus, include\
    \ the `Time` and the `Stdlib` library at the top. Now let’s welcome the user with\
    \ a greeting to let them know they are playing the game. `getch()` is a command\
    \ to pause the program until the user presses ‘Enter’. Above, you will need to\
    \ include the `Conio` library (`<conio.h>`) because it holds the `getch()` command.\
    \ If otherwise, this is a decent way to start off a simple “text-based” game.\n\
    \nNow it is time for the real game. Ask the player if he or she chooses heads\
    \ or tails, and let the user input the choice. Now, decide whether the coin lands\
    \ on either heads or tails. This is done with the random number generator. Even\
    \ if numbers don’t necessarily mean the actual sides on a coin. You can assign\
    \ them yourself. In this case, the number 1 will be heads, and 2 will be tails.\
    \ So make a random number generator that will choose a number between 1 and 2.\
    \ Quite the small range eh? After flipping the coin, it’s now time to decide the\
    \ winner. This is done by telling different combinations of what the user picked\
    \ and what the computer picked. After that, you’ve sort of finished the whole\
    \ game. Do note that you would have to enter your choice in lowercase the whole\
    \ time, but feel free to edit the program to accept results with multiple cases\
    \ like ‘Heads’, ‘HEADS’, or even ‘Heads’.\n\n### Rock Paper Scissors\nThis will\
    \ be very similar to the game you just made, but there are a few complexities\
    \ to it. Game Basis: two players have one chance to choose among rock, paper,\
    \ or scissors. At the same time, each player shows what he or she chooses using\
    \ hand signals. The player’s selection determines whether he or she wins or loses.\
    \ For example, if player 1 chooses rock, and player 2 chooses scissors, player\
    \ 1 will lose because rock’s certain object is scissors, and scissors’ certain\
    \ winning object is rock. If both players choose the same object, the game ends\
    \ in a tie.\n\n### Guess the Number\nThis is the final project you will do from\
    \ this book. Game Basis: One person will think of a random number from 1--100,\
    \ and another has to guess that number in 10 tries. Each time the number isn’t\
    \ correct, they will be told if it’s higher or lower, and if the player fails\
    \ to guess the number in 10 tries, he or she loses. In this situation, you will\
    \ have to guess a number the computer has chosen. Start with your outline. Now\
    \ have the computer create a number from 1-100. Another way to start a good opening\
    \ statement is with a plot, which is used in this game. Now let the user enter\
    \ his her first guess. Create the variable that will tell how many guesses the\
    \ player has guessed. Right now, it starts at 0. In the game there will be some\
    \ sort of loop. The loops will be repeating a set of commands to let the user\
    \ try again until he or she out of tries. The commands will be detecting if the\
    \ guess is higher, lower, or equal to the hidden number. Whenever the execution\
    \ goes to the start of the loop, there has been a new previous guess, so add 1\
    \ to count. Detecting whether the guess is higher, lower, or equal to the hidden\
    \ number involves one big conditional which will detect the relationship between\
    \ both numbers. If the user guesses right, there is no need to use the loop, so\
    \ the `break` statement will be used. If the user guesses higher or lower than\
    \ the real number, tell the user to guess again, and whether it’s too high or\
    \ too low. In review, this is what the loop looks like. Now you get the loop,\
    \ but what happens after that? If you look back at it, you’ll see that the loop\
    \ will only finish if the number is correct, or the player ran out of tries. So\
    \ you need to detect why the computer left the loop in order to tell if the player\
    \ won by guessing the number, or lost by running out of tries.\n\n### Dragon Clash\n\
    Dragon Clash is a game made by the author. It’s a text based battle game where\
    \ two dragons, the Light Dragon and the Dark Dragon, take turns attacking each\
    \ other or healing themselves until one of them has no more strength anymore.\
    \ It’s not some 60 dollar hit at your local game store, but it should be fun to\
    \ play. If this whole game took him several days to do, think of how long it took\
    \ to create something that ended up inside a game store. Think of how many people\
    \ it took to create something like that. There is no official lesson on creating\
    \ this. You will just be given the completed game.\n\n# Chapter 19: Project: Agenda\n\
    For this project, we will simulate a phone agenda, like the one you have in your\
    \ house and use them to keep record of all the important numbers you need, but\
    \ we will do it using `C++`. For each contact, their name and their phone will\
    \ be stored (although you can add as many fields as you want). Also, we will be\
    \ using a new and very powerful feature of the Standard Template Library of `C++`:\
    \ `vector`.\n\nUsing vectors\nImagine this phone agenda will have more than 100\
    \ phone numbers. Are you going to declare 100 variables for the numbers? And another\
    \ 100 for the names? Of course not. Here is where `vector` fits perfectly. With\
    \ `vector`, you will be able to insert as many elements as you like. For using\
    \ `vector` inside `C++`, we must add the library `<vector>` in our code. We will\
    \ also need `iostream` and `string`.\n\n```cpp\n#include <iostream>\n#include\
    \ <string>\n#include <vector>\nusing namespace std;\n```\n\nAfter the `namespace\
    \ std`, we are going to declare our `vector`. They will go outside the `main`\
    \ function. By declaring any variable outside `main` (or any `function`) it means\
    \ that this variable will be global. In other terms, anyone has access to them\
    \ for reading and writing.\n\n```cpp\nvector<string> Names;\nvector<string> Phones;\n\
    \nint main(){\n    int sel = 0;\n    while(true){\n        cout << \"My Agenda\"\
    \ << endl << endl;\n        cout << \"Choose a number to execute\" << endl;\n\
    \        cout << \"[1] New Contact\" << endl;\n        cout << \"[2] Search by\
    \ ID\" << endl;\n        cout << \"[3] Search by Name\" << endl;\n        cout\
    \ << \"[4] Exit\" << endl;\n        cout << \"Your choice: \";\n        cin >>\
    \ sel;\n        switch(sel){\n            case 1:\n                NewContact();\n\
    \                break;\n            case 2:\n                SearchByID();\n\
    \                break;\n            case 3:\n                SearchByName();\n\
    \                break;\n            case 4:\n                return 0;\n    \
    \    }\n    }\n    return 0;\n}\n```\n\n```cpp\nvoid NewContact(){\n    string\
    \ name;\n    string phone;\n    cout << \"\\nEnter a name for the contact: \"\
    ;\n    cin >> name;\n    cout << \"Enter the phone for contact: \";\n    cin >>\
    \ phone;\n    cout << \"The ID for contact will be \" << Names.size() << endl;\n\
    \    Names.push_back(name);\n    Phones.push_back(phone);\n}\n```\n\n```cpp\n\
    void SearchByID(){\n    int value;\n    cout << \"\\nEnter the ID of the contact\
    \ to search: \";\n    cin >> value;\n    if(value >= Names.size()){\n        cout\
    \ << \"This ID does not exist\" << endl;\n        return;\n    }\n    cout <<\
    \ \"Information for contact \" << value << endl;\n    cout << \"Name: \" << Names[value]\
    \ << endl;\n    cout << \"Phone: \" << Phones[value] << endl;\n}\n```\n\n```cpp\n\
    void SearchByName(){\n    bool found = false;\n    string name;\n    for(int i\
    \ = 0; i != Names.size(); i++){\n        if(Names[i] == name){\n            cout\
    \ << \"Name: \" << Names[i] << endl;\n            cout << \"Phone: \" << Phones[i]\
    \ << endl;\n            found = true;\n            break;\n        }\n    }\n\
    \    if(!found){\n        cout << \"No contact found with this name\" << endl;\n\
    \    }\n}\n```\n"
