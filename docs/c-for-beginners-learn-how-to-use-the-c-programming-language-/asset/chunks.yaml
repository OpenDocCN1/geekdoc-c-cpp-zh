    max << endl ;return 0 ;}// function returning the max between two numbersint maxNum(
    int x, int y) {// local variable declarationint result;if ( x > y)result = x;elseresult
    = y;return result;   }The code should return the following as the result:We began
    by declaring a function named maxNum() taking two integer arguments, x, and y.
    The function is of integer data type, meaning that its return value will be an
    integer. Within the main()   method, we have invoked this function in the following
    line:max = maxNum( 5 , 12 );What happens is that we have called the function and
    passed to it the value of the arguments. In the above line, the value of parameter
    x is 5 while that of parameter y is 12\. Order is very important. The result will
    be assigned to the variable named max .  Lastly, we have implemented the logic
    for our function. We want our function to return the larger of the two integers
    that we pass to it. The largest integer will be stored in the variable result.
    If the value of x is greater than that of y, then x will become the result. If
    y is greater than x, then y will become the result. That is what we have done
    in the function body. In our above call, the function compared 5 and 12\. 12 was
    found to be the largest, hence, it became the result. For any function that accepts
    arguments, it must declare the variables that will be accepting the values of
    the arguments. The variables are referred to as the formal parameters of the function. The
    formal parameters exhibit similar behavior as other local variables in the function
    and their creation happens after entry into the function and they are destroyed
    upon exit. There are various ways through which we can pass the values of the
    arguments to the function. Let us discuss these:Call by ValueThis mechanism involves
    copying of the actual values of the parameters to the formal parameters of the
    function. Any changes made to the parameters inside the function will have no
    impact on the argument. This is the default parameter passing mechanism used in
    C++. This means that the code in the function cannot change the arguments used
    for calling the function. Let us create a simple example to demonstrate this:#include
    <iostream>     using namespace std;    void substitute( int value);    int main()
       {    int value = 2 ;    substitute( value);    cout << "The value is: " <<
    value<< endl;    return 0 ;    }    void substitute( int value)    {    value
    = 10 ;    }    The code should return the following output:We have defined a function
    named substitute() that takes in one integer argument named value . In the implementation
    of the function, we have set the value to 10\. However, in the main() method,
    we changed this to 2. That is why we have the above output. The pass by value
    was implemented in the following lines:int value = 2 ;    substitute ( value );We
    initialized the value and passed the name to the function. That is how simple
    pass by value is. Call by PointerThis mechanism involves copying the address of
    the argument into the formal parameter. This address is then used to get the actual
    value of the argument inside the function. This means that if a change is done
    to the parameter, the argument will be affected. To pass a value by pointer, the
    argument pointers should be passed to the functions similarly to any other value.
    This means that the function parameters should be defined as pointer types as
    demonstrated in the following snippet:// defining a function to swap values.void
    interchange( int * a, int * b) {int temp;temp = * a ; /* save value at address
    a */* a = * b ; /* put b into a */* b = temp ; /* put a into b */return ;}Remember
    that a pointer * points to a memory location. Let us create a complete code that
    demonstrates how this works:#include <iostream>using namespace std;// declare
    a functionvoid interchange( int * a, int * b);int main () {// declare a local
    variable:int x = 5 ;int y = 12 ;cout << "Before the interachange, the value of
    x is :" << x << endl ;cout << "Before the interachange, the value of y is :" <<
    y << endl ;/* call the function to interchange the values.* &x indicates pointer
    to x, that is, address of variable x and* &y indicates pointer to y, that is,
    address of variable y.*/interchange(& x, & y);cout << "After the interchange,
    the value of x is :" << x << endl ;cout << "After the interchange, the value of
    y is :" << y << endl ;return 0 ;}// defining a function to swap values.void interchange(
    int * a, int * b) {int temp;temp = * a ; /* save value at address a */* a = *
    b ; /* put b into a */* b = temp ; /* put a into b */return ;}Through call by
    pointer, we were able to interchange the values stored in the two different addresses.
    The code returns the following upon execution:Call by ReferenceIn call by reference,
    the reference of an argument is copied to the formal parameter. Inside the function,
    we use the reference to access the actual argument that has been used in the call.
    This is an indication that the changes that have been made to the parameter will
    affect the argument that is passed. To pass a value by reference, the argument
    reference is passed to the functions similarly as any other value. This means
    that the function parameters have to be declared as reference types as demonstrated
    in the following example:// define a function to interchange valuesvoid interchange(
    int & a, int & b) {int temp;temp = a ; /* store the value at address a */a = b
    ;      /* put b into a */b = temp ; /* put a into b */return ;}Again, we have
    the interchange() function that swaps the two values. Let us now see how we can
    call the function and pass the arguments by reference:#include <iostream>using
    namespace std;// declaration of a function:void interchange( int & a, int & b);int
    main () {// declaration of a local variable:int x = 5 ;int y = 12 ;cout << "Before
    the interchange, the value of x is :" << x << endl ;cout << "Before the interchange,
    the value of y is :" << y << endl ;/* call the interchange function to swap the
    values through reference.*/interchange( x, y);cout << "After the interchange,
    the value of x is :" << x << endl ;cout << "After the interchange, the value of
    y is :" << y << endl ;return 0 ;}// defining a function to interchange valuesvoid
    interchange( int & a, int & b) {int temp;temp = a ; /* store the value at address
    a */a = b ;      /* put b into a */b = temp ; /* put a into b */return ;}The code
    should return the following output upon execution:That is how pass by reference
    works in C++. Default Values for ParametersAfter defining a function, it is possible
    for you to define the default values for the parameters. In such a case, the default
    value will be used as the value of the parameter when you call the function without
    passing the value of that parameter. To assign default values for parameters,
    you use the assignment operator during the function definition. When no value
    is specified, that default value will be used as the value of the parameter. However,
    if you pass a value for the parameter, the default value will be ignored and the
    passed value will be used instead. The following example demonstrates this:#include
    <iostream>using namespace std;int product( int x, int y = 10 ) {int result;result
    = x * y ;return ( result);}int main () {// declare a local variable:int x = 12
    ;int y = 5 ;int result;// call the product function to multiply the values.result
    = product( x, y);cout << "The product is :" << result << endl;// call the product
    function with one argument onlyresult = product( x);cout << "The product is :"
    << result << endl;return 0 ;}The code should return the following result when
    executed:Consider the following statement extracted from the code:int product(
    int x, int y = 10 )Above, we are defining a function named product() that takes
    two integer arguments, x, and y. If we don’t pass a value for the parameter y
    during the function call, then the parameter y will be assigned a default value
    of 10. The function has been called for the first time in the following line:result
    = product( x, y);Above, the value of x is 12 while that of y is 5\. When the two
    are multiplied, we get a result of 60, hence the source of the first line in the
    above output. The default value for parameter y, which is 10, has been ignored
    because we have specified a value for the parameter during the call. We have called
    the same function for the second time in the following line:result = product(
    x);Above, we have called the product() function but we have only passed one parameter
    to it, x. The value of x is still 12\. Since we have not specified the value for
    the parameter y, its default value of 10 specified during the declaration of the
    function will be used. The two are multiplied to return a result of 120\. The
    default value for the parameter has been used since we did not specify its value
    during the function call.Chapter 2     : OperatorsThere are various types of operators
    available in C++. The operators help in carrying out various operations on the
    defined variables in a C++ program. Let’s look at each of the operators in more
    detail.Arithmetic operatorsThese are operators that are used to work with numbers.
    The most common operators are shown below.Arithmetic operators'
