    # 第 15 章：C++ 中的多线程应用


    如果你是 C++ 编程专家，或者在过去的五年里一直一直在编写软件，那么你很可能了解 Win32 线程。在使用 C++ 创建跨平台软件时，你遇到的最大挑战之一就是如何正确地处理线程。由于许多系统有不同的多线程处理方法，你的源代码可能会因为各种定义不同平台行为的预处理器条件而变得混乱。


    C++ 有一种名为 `std::thread` 的机制。好处是，任何 C++ 编译器都可以实现这种线程。所以，如果你正被迫使用 `Dev-C++`，那么现在是时候考虑其他东西了。让我们假设你现在拥有一个可以帮助你而不是拖你后腿的编译器。在
    C++ 语言中编写线程软件的最佳方法是使用 API。仅仅丢给你几行代码并让你自己去消化剩下的部分是不对的。


    ### 什么是线程？

    网络上有许多关于线程的资源，阅读其中一些是有好处的。让我们回到主问题。线程支持软件在不同的处理器上同时且并行运行。嗯，这听起来很不错，对吧？虽然这是一好事，但它带来了一些问题。这使得在没有良好设计的情况下，很难考虑性能问题。如果你仍然不理解线程是什么以及它们为什么那么有用，那么你应该花时间读一些关于线程的简短文章。


    ### 消费者，生产者

    多线程最流行的例子之一是生产者-消费者模型。换句话说，这里有一个线程释放值供他人计算，而另一个线程接收这些值并进行使用。这是一个任何人都能理解的常规描述。


    在这个示例中，你会发现有三个相关的线程构造结构。下面解释了这三个线程：


    - `std::mutex`：这代表单个互斥锁。它是一个对象，允许在给定区域内由单个线程访问。

    - `std::lock_guard`：它锁定作用范围内的互斥锁。一旦超出作用范围，它就会移除。

    - `std::thread`：显示执行的单个线程。


    该程序中的生产者将共享数据对象增加到 5，而主线程则增加数据对象，直到生产者线程定义了 5 为止。最有趣的是创建线程的方法，特别是当你想初始化一个 `std::thread`
    时。做法是提供一个线程要执行的函数以及其函数参数。此外，全局互斥锁有助于保护数据免受多次修改。最后，使用 `{...}` 定义显式作用域，而 `std::lock_guard`
    应该控制访问。


    ### 两个任务：一个进程

    如果你正在编写并行软件怎么办？该示例要求为两个独立的值并行构建一个不同的函数。这是使用 `Future` 对象来完成异步计算的最佳用例。


    `future` 是一个确保根据计算类型存在正确值的对象。这个对象类似于一个占位值。它帮助程序员开始计算并确认已产生的结果。准确地说，异步结果会产生 `future`
    对象。`std::promise`、`std::async` 和 `std::packaged_task` 代表了允许实现 `get_future()` 方法的接口。


    - `std::async`：这是一种高级方法，为未来提供值并产生最小的灵活性。此外，它是实现异步计算最简单的方法。你需要记住，这种方法与其他对象不同。

    - `std::promise`：它向未来呈现一个值。

    - `std::packaged_task`：它是人们交付未来 值的最佳方式之一。


    # 第 16 章：与 bug 的作战


    花费在搜索和删除 bug 的时间比编写 C++ 程序的时间还多，是非常令人沮丧的。因此，以下建议可以帮助你减少错误并让编程成为一种极佳的体验。


    ### 开发清晰且一致的编码风格

    选择以一致且清晰的方式编写 C++ 程序，不仅可以提高其他程序员阅读你程序的易用性，还可以减少编码错误。因此，当你阅读到遵循既定风格的整洁且清晰的代码时，你只需要花少量的时间来解析
    C++ 语句的语法。这让你留出大量的精力来决定你的程序要执行什么以及如何执行。


    适当的编码风格应该具有以下特征：


    1. 根据名称理解函数、类和对象是如何使用的。

    2. 区分对象名、函数名和类名。

    3. 区分预处理器符号和 C++ 符号。

    4. 在同一层级搜索代码块。


    '
