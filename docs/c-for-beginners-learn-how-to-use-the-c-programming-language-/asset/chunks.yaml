    \ bytes\" << endl;}Depending on your CPU architecture your output will be:Ouput>Your\
    \ int size is: 4 bytes>The union has 3 variables that should be a total of:  12\
    \ bytes>However, the union is 4 bytesAs you can tell the union is only the size\
    \ of a single integer, these structures can be used to efficiently use memory\
    \ is there’re situations where variables are idle and only one is needed.Below\
    \ is code that shows what happens to all the values when one is changed:#include\
    \ \"stdafx.h\"#include <iostream>using namespace std;union Example{int i;int x;int\
    \ y;};void Print_Union(Example e ){cout << \"i: \" << e .i << endl;cout << \"\
    x: \" << e .x << endl;cout << \"y: \" << e .y << endl;}int main(){Example e;cout\
    \ << \"1\" << endl;e.i = 4;Print_Union(e);cout << \"2\" << endl;e.y = 3;Print_Union(e);cout\
    \ << \"3\" << endl;e.x = 1;Print_Union(e);}Ouput> 1> i: 4> x: 4> y: 4> 2> i: 3>\
    \ x: 3> y: 3> 3> i: 1> x: 1> y: 1As you can tell when you change one value, they\
    \ all equal the same value, this is because all values share the same memory location\
    \ and therefore when one changes they all change.Variable argument listsVariable\
    \ argument lists allow for the possibly of endless parameters. Before we have\
    \ come across functions with a static set amount of parameters (variables you\
    \ can pass into a method) like:int Add(int i, int y){}Has two parameters integer\
    \ “i” and integer “y”.This is known as a Variadic Function or a function with\
    \ unlimited arity (parameter number, so “Add” above has an arity of 2)The variables\
    \ are stored in a variable known as the va_list this works as any other variable\
    \ but it just holds the list of variables passed. A variadic function is defined\
    \ like so:void Add(int numberOfVariables , ...){}Where “numberOfVariables” is\
    \ the number of extra parameters passed, note this does not include this variable.\
    \ This is required because the va_list does not know the total number of variables\
    \ and does not keep track of where it is in the list.Using the va_ist requires\
    \ the use of a few functions:\n\n*   va_start (va_list, numberOfVariables)  \n\
    \n    *   Grabs the variables passed in and assigns the number specified by the\
    \ second parameter to the first parameter\n\n*   va_arg (va_list, type)\n\n  \
    \  *   Grabs the next variable from the specified list in the first parameter\
    \ and creates a variable specified by “type”\n\n*   va_end (va_list)\n\n    *\
    \   Tidies up the list specified"
