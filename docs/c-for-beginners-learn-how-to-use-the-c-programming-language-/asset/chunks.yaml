    \nAt the heart of all object-oriented programming lies the notion of classes,\
    \ objects that you create and utilize all throughout your code. This helps with\
    \ modularity, with ease of use, with efficiency, and with higher-level programming\
    \ that is far more logical and coherent.\n\nIn the early iterations of C, there\
    \ was a primitive sort of class called a `struct`. Structs still exist in C++\
    \ but are mainly deprecated and shirked in favor of using classes instead. Nevertheless,\
    \ structs are important to cover. C++ structs are also different from C structs.\
    \ C structs didn’t have much of the functionality which C++ structs do.\n\nBefore\
    \ we jump into that, let’s talk briefly about the notion of access modifiers.\
    \ We’ve talked about things like `int`, `string`, `bool`, and `float`, called\
    \ types. We created what could be considered somewhat of a type using enumerators.\
    \ However, you can create an entire type that is made up of smaller pieces of\
    \ data and innate functions. This is called an object.\n\nAccess modifiers describe\
    \ what is able to change what within your code. There are three different access\
    \ modifiers:\n- **Public** access means that the object and/or its internal data\
    \ and functions can be accessed and modified by any other code in the program.\n\
    - **Protected** means that the object and/or its internal data and functions can\
    \ be access and modified by only its derivatives. (This will make sense when we\
    \ get into inheritance and polymorphism.)\n- **Private** means that only the object\
    \ itself can access and modify its data. This is important for purposes of security,\
    \ clarity, and code safety.\n\nStructs and classes are both ways to create new\
    \ objects. The primary difference between structs is that structs are public by\
    \ default and classes are private by default. Other than that, the differences\
    \ are very negligible.\n\nHowever, in the tech industry, structs have a fair bit\
    \ of a negative connotation. Developers tend to see them as unprotected objects\
    \ with little functionality, while they tend to see classes as very functional\
    \ objects with child classes that are well made and well structured. As such,\
    \ it’s generally better to create classes unless your object has very little in\
    \ the way of functionality and simply contains very little data and innate function.\n\
    \nLook at this struct and declaration:\n\n```cpp\nstruct animal {\n    enum diet\
    \ { herbivore, omnivore, carnivore };\n    int legs;\n    string name;\n    diet\
    \ naturalDiet;\n};\n\nint main() {\n    animal dog;\n    dog.legs = 4;\n    dog.name\
    \ = \"Dog\";\n    dog.naturalDiet = dog.carnivore;\n}\n```\n\nThis is the absolutely\
    \ most simple way to declare a new object. You should absolutely not declare them\
    \ within an existent function.\n\nLet’s go ahead and replace that struct with\
    \ a class, because we’re going to be using classes going forward as they’re generally\
    \ a safer and better option than structs are. Create a new project in CodeBlocks\
    \ called “AnimalSimulator”. Redact the contents of `main.cpp` and import `iostream`\
    \ and create your `main` method.\n\nAbove the main method, let’s declare a class\
    \ called `Animal`. You would do that very similarly to how you’d declare a struct:\n\
    \n```cpp\nclass animal { string name; };\n```\n\nThen within your main method,\
    \ declare an instance and set its instance of name to the name of your favorite\
    \ animal. Afterward, try to build. You should have gotten an error that said “error:\
    \ string animal::name is private”. Perfect. This is absolutely supposed to happen,\
    \ because now we have to fix this. This is where that whole notion of access description\
    \ comes in.\n\nModify your class so that it looks like this:\n\n```cpp\nclass\
    \ animal {\npublic:\n    string name;\n};\n```\n\nThen try to build. It should\
    \ work fine this time. That’s because we made the string “name” public, which\
    \ means other methods/functions outside of the class itself can access it. This\
    \ is generally considered bad practice though, so we’re going to rewrite the class\
    \ like so:\n\n```cpp\nclass animal {\nprivate:\n    string name;\n};\n```\n\n\
    The best-practice way to modify values within a class is to use get/set methods.\
    \ Here’s the way the class would look if you implemented get/set methods:\n\n\
    ```cpp\nclass animal {\nprivate:\n    string name;\npublic:\n    string getName()\
    \ {\n        return this->name;\n    }\n    void setName(string name) {\n    \
    \    this->name = name;\n    }\n};\n```\n\nNow, in your main method, after declaring\
    \ whatever animal it is, instead of directly modifying its name, you should instead\
