  ```cpp\ndog.setName(\"dog\");\n```\n\n然后你可以通过在 `main` 方法中打印名字来测试这一点：\n\n```cpp\n\
  cout << \"The name of my favorite animal is: \" << dog.getName() << \"\\n\";\n```\n\
