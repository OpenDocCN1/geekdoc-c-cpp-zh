  \ main() {\n    animal dog;\n    dog.legs = 4;\n    dog.name = \"Dog\";\n    dog.naturalDiet\
  \ = dog.carnivore;\n}\n```\n\n这是声明新对象最简单的方法。你绝对不应该在现有函数内部声明它们。\n\n让我们把那个结构体 替换为类，因为我们以后将使用类，因为它们通常是比\
  \ `struct` 更安全、更好的选择。在 CodeBlocks 中创建一个名为“AnimalSimulator”的新项目。删除 `main.cpp` 的内容并导入\
  \ `iostream` 并创建你的 `main` 方法。\n\n在 `main` 方法上方，让我们声明一个名为 `Animal` 的类。你的做法与声明结构体非常相似：\n\
  \n```cpp\nclass animal { string name; };\n```\n\n然后在你的 `main` 方法中，声明一个实例并将该实例的 `name`\
  \ 设置为你最喜欢的动物的名字。之后，尝试编译。你应该会收到一个提示“error: string animal::name is private”的错误。完美。这完全是应该发生的，因为现在我们必须修复它。这就是整个访问描述概念出现的地方。\n\
  \n修改你的类，使其看起来像这样：\n\n```cpp\nclass animal {\npublic:\n    string name;\n};\n```\n\
  \n然后尝试编译。这次应该可以正常运行。这是因为我们将字符串“name”设为公共了，这意味着类本身之外的其他方法/函数可以访问它。尽管这通常被认为是坏习惯，所以我们将这样重写类：\n\
  \n```cpp\nclass animal {\nprivate:\n    string name;\n};\n```\n\n修改类内值的最佳实践是使用 get/set\
  \ 方法。如果你实现了 get/set 方法，该类看起来会是这样：\n\n```cpp\nclass animal {\nprivate:\n    string\
  \ name;\npublic:\n    string getName() {\n        return this->name;\n    }\n  \
  \  void setName(string name) {\n        this->name = name;\n    }\n};\n```\n\n现在，在你的\
  \ `main` 方法中，在声明任何动物后，不要直接修改它的名字，而应该使用如下 get/set 方法（假设你的 `animal` 名为“dog”）：\n\n\
  ```cpp\ndog.setName(\"dog\");\n```\n\n然后你可以通过在 `main` 方法中打印名字来测试这一点：\n\n```cpp\n\
