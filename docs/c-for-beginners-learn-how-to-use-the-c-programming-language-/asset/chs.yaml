  \n[content]\n# Chapter 11: Introduction to Classes\n\nAt the heart of all object-oriented\
  \ programming lies the notion of classes, objects that you create and utilize all\
  \ throughout your code. This helps with modularity, with ease of use, with efficiency,\
  \ and with higher-level programming that is far more logical and coherent.\n\nIn\
  \ the early iterations of C, there was a primitive sort of class called a `struct`.\
  \ Structs still exist in C++ but are mainly deprecated and shirked in favor of using\
  \ classes instead. Nevertheless, structs are important to cover. C++ structs are\
  \ also different from C structs. C structs didn’t have much of the functionality\
  \ which C++ structs do.\n\nBefore we jump into that, let’s talk briefly about the\
  \ notion of access modifiers. We’ve talked about things like `int`, `string`, `bool`,\
  \ and `float`, called types. We created what could be considered somewhat of a type\
  \ using enumerators. However, you can create an entire type that is made up of smaller\
  \ pieces of data and innate functions. This is called an object.\n\nAccess modifiers\
  \ describe what is able to change what within your code. There are three different\
  \ access modifiers:\n- **Public** access means that the object and/or its internal\
  \ data and functions can be accessed and modified by any other code in the program.\n\
  - **Protected** means that the object and/or its internal data and functions can\
  \ be access and modified by only its derivatives. (This will make sense when we\
  \ get into inheritance and polymorphism.)\n- **Private** means that only the object\
  \ itself can access and modify its data. This is important for purposes of security,\
  \ clarity, and code safety.\n\nStructs and classes are both ways to create new objects.\
  \ The primary difference between structs is that structs are public by default and\
  \ classes are private by default. Other than that, the differences are very negligible.\n\
  \nHowever, in the tech industry, structs have a fair bit of a negative connotation.\
  \ Developers tend to see them as unprotected objects with little functionality,\
  \ while they tend to see classes as very functional objects with child classes that\
  \ are well made and well structured. As such, it’s generally better to create classes\
  \ unless your object has very little in the way of functionality and simply contains\
  \ very little data and innate function.\n\nLook at this struct and declaration:\n\
  \n```cpp\nstruct animal {\n    enum diet { herbivore, omnivore, carnivore };\n \
  \   int legs;\n    string name;\n    diet naturalDiet;\n};\n\nint main() {\n   \
  \ animal dog;\n    dog.legs = 4;\n    dog.name = \"Dog\";\n    dog.naturalDiet =\
  \ dog.carnivore;\n}\n```\n\nThis is the absolutely most simple way to declare a\
  \ new object. You should absolutely not declare them within an existent function.\n\
  \nLet’s go ahead and replace that struct with a class, because we’re going to be\
  \ using classes going forward as they’re generally a safer and better option than\
  \ structs are. Create a new project in CodeBlocks called “AnimalSimulator”. Redact\
  \ the contents of `main.cpp` and import `iostream` and create your `main` method.\n\
  \nAbove the main method, let’s declare a class called `Animal`. You would do that\
  \ very similarly to how you’d declare a struct:\n\n```cpp\nclass animal { string\
  \ name; };\n```\n\nThen within your main method, declare an instance and set its\
  \ instance of name to the name of your favorite animal. Afterward, try to build.\
  \ You should have gotten an error that said “error: string animal::name is private”.\
  \ Perfect. This is absolutely supposed to happen, because now we have to fix this.\
  \ This is where that whole notion of access description comes in.\n\nModify your\
  \ class so that it looks like this:\n\n```cpp\nclass animal {\npublic:\n    string\
  \ name;\n};\n```\n\nThen try to build. It should work fine this time. That’s because\
  \ we made the string “name” public, which means other methods/functions outside\
  \ of the class itself can access it. This is generally considered bad practice though,\
  \ so we’re going to rewrite the class like so:\n\n```cpp\nclass animal {\nprivate:\n\
  \    string name;\n};\n```\n\nThe best-practice way to modify values within a class\
  \ is to use get/set methods. Here’s the way the class would look if you implemented\
  \ get/set methods:\n\n```cpp\nclass animal {\nprivate:\n    string name;\npublic:\n\
  \    string getName() {\n        return this->name;\n    }\n    void setName(string\
  \ name) {\n        this->name = name;\n    }\n};\n```\n\nNow, in your main method,\
  \ after declaring whatever animal it is, instead of directly modifying its name,\
  \ you should instead use the get/set method like so (assuming your instance animal\
  \ is called “dog”):\n\n```cpp\ndog.setName(\"dog\");\n```\n\nThen you can test this\
  \ by printing out the name in your main method:\n\n```cpp\ncout << \"The name of\
  \ my favorite animal is: \" << dog.getName() << \"\\n\";\n```\n\nThe way these work\
  \ is by returning or setting the value of the variable via a method from within\
  \ the class. `this->` is called the `this` pointer, and it refers to the variable\
  \ of a given instance of a class. Every object has access to its own variables and\
  \ can modify them directly via the `this` pointer.\n\nAnyway, your code should work\
  \ stunningly. But what if you don’t want to go through get/set for every instance\
  \ of every class? Well, you use what’s called an initializer function. Modify your\
  \ class so it looks like this:\n\n```cpp\nclass animal {\nprivate:\n    string name;\n\
  public:\n    animal(string name) {\n        this->name = name;\n    }\n    string\
  \ getName() {\n        return this->name;\n    }\n    void setName(string name)\
  \ {\n        this->name = name;\n    }\n};\n```\n\nNow, in your main function, take\
  \ out the chunk of code that says `animal x` followed by the `x.setName(\"name\"\
  )` function. When you create an initializer function, you can set certain variables\
  \ from the get-go. For example, since your initializer function takes the argument\
  \ of `name`, you can declare that when you declare the variable and circumvent the\
  \ whole setName operation. Look at this code for an example:\n\n```cpp\nanimal dog(\"\
  dog\");\nanimal elephant(\"elephant\");\nanimal bird(\"bird\");\n```\n\nThese are\
  \ all separate instances of the class `animal`, and their names have been set without\
  \ the use of a set function thanks to the function initializer. This makes it incredibly\
  \ easy to create new objects and pretty streamlined of a process too.\n\nNow that\
  \ we’ve spoken for a moment about declaring objects and things of that nature, let’s\
  \ talk more about the specifics of what you can do with them. The object `animal`\
  \ here represents, of course, animals. We can give the entire class a set of methods\
  \ that they can perform.\n\nLet’s think for a second about what every animal does.\
  \ Every animal sleeps, eats, and drinks, right? So it wouldn’t be very outlandish\
  \ to include these within our class so that every member object of the class `animal`\
  \ is able to perform these methods. Let’s say we had two specific kinds of food:\
  \ meat, and plants, both of which also represented by their own respective objects.\
  \ We could create two different functions for this:\n\n```cpp\nvoid eat(plant p)\
  \ { // code here }\nvoid eat(meat m) { // code here }\n```\n\nEven though these\
  \ share a name, you can call either depending upon the type of object which you\
  \ put include in the function call, and both will perform their respective code\
  \ in response to the argument which you included. This is called function overloading.\
  \ It’s an essential technique in object-oriented programming that will help you\
  \ to create functional and clear sets of code that are easy for people to use and\
  \ understand.\n\nBecause it’s unwieldy to create a large number of types while we’re\
  \ learning about classes in the first place, let’s just leave “eat” as a void function\
  \ which doesn’t take arguments. Your code should look like this:\n\n```cpp\nclass\
  \ animal {\nprivate:\n    string name;\npublic:\n    animal(string name) {\n   \
  \     this->name = name;\n    }\n    string getName() {\n        return this->name;\n\
  \    }\n    void setName(string name) {\n        this->name = name;\n    }\n   \
  \ void eat() {}\n};\n\n## 第 12 章：类的具体细节\n\nC++ 语言中的类特性是由 Bjarne Stroustrup 设计的。访问修饰符描述了代码中哪些内容可以被修改。三种不同的访问修饰符：\n\
