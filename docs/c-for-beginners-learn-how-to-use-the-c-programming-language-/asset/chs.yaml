  \ void eat() {}\n};\n\n## 第 12 章：类的具体细节\n\nC++ 语言中的类特性是由 Bjarne Stroustrup 设计的。访问修饰符描述了代码中哪些内容可以被修改。三种不同的访问修饰符：\n\
  - **Public** 访问意味着对象和/或其内部数据及函数可以被程序的任何其他代码访问和修改。\n- **Protected** 意味着对象和/或其内部数据及函数只能被其派生类访问和修改。（当我们学习继承和多态时就会理解这一点了。）\n\
  - **Private** 意味着只有对象本身可以访问和修改其数据。这对于安全性、清晰性和代码安全至关重要。\n\n... (此处已根据指令去除了重复的示例部分)\n\
  \n\n\n1. 确定共享数据变量（也称为成员变量或实例变量），并在 `class` 中将这些变量声明为 `private`（它们不能在类外部访问）。\n2.\
  \ 在 `class` 内部编写处理共享变量的 `public` 函数。\n3. 编写一个 `main` 函数，创建该 `class` 的对象并测试这些函数。\n\
  \n以下是在 C++ 中编写一个名为 `Student` 的新类的方法：\n\n```cpp\nclass Student {\nprivate:  // 数据（称为成员、实例或共享变量）\n\
  \    string name;\n    long int id;\n    double gpa;\npublic: // 成员函数\n    void\
  \ inputData() {\n        cout << “Please enter the student’s name: “;\n        cin\
  \ >> name;  // 有权访问上面的共享变量\n        cout << “Please enter the student’s id: “;\n\
  \        cin >> id;\n    }\n    void calculateGPA(){ ….}\n};  // 注意结尾类定义的分号 ;\n\
  ```\n\n然后，你可以编写一个 `main` 函数，通过创建 3 个 `Student` 对象 `s1`、`s2`、`s3` 来测试这个新类，并使用 `.`\
  \ 运算符调用它们的公共函数（该运算符可以读作 's，例如 `s1’s inputData()` 函数将填充 `s1’s` 的数据）：\n\n```cpp\n\
  int main() {\n    Student s1, s2, s3;\n    s1.inputData();\n    s2.inputData();\n\
  \    s1.calculateGPA();\n}\n```\n\n面向对象编程还遵循`数据封装`Data Encapsulation）和`信息隐藏`Information\
  \ Hiding）原则。它通过将数据设为 `private` 来保护数据，并提供 `public` 函数来安全地访问数据。`private` 符意味着成员变量只能在\
  \ `class` 内部访问——它们被该 `class` 内部函数共享并访问。`class` 中所有的共享变量都应该声明在 `private` 下。`public`\
  \ 符意味着任何人可以在任何地方（类内部和外部）访问。函数通常被设置为 `public`。\n\n大多数现代编程语言现在都是面向对象的，因为这种编程类型具有某些优势。以下是\
  \ OOP 的一些优势：\n\n- 它保护数据。除了类内部的函数外，没有人可以修改它们。\n- 函数往往更短且设计更好。因为它们共享私有数据变量，所以它们的参数更少。\n\
  - 程序员犯的错误更少，因为他们不需要将数据变量作为参数传递给函数。\n- 它更容易扩展类并创建新类，促进了`软件复用/继承`Software Reuse /\
  \ Inheritance。\n\n### 类内部的成员函数\n\n大多数类内部都写有一些标准函数：\n\n- `访问器/修改器 (get/set)` 函数：称为\
  \ `set` 和 `get` 的简单函数，用于为共享变量设置一个值并返回（`get`）一个共享变量。\n- `输入/输出`Input/Output 函数：向用户索要共享变量的值或将其打印出来。\n\
  - `构造函数`Constructor Functions：初始化共享变量。\n- 其他特殊函数（例如 `BankAccount` 类的 `deposit/withdraw`\
  \ 函数）。\n\n例如，这里再次是 `Student` 类，带有用于学生名称的 `get/set` 函数：\n\n```cpp\nclass Student\
  \ {\nprivate:\n    string name;\n    long int id;\npublic:\n    void setName(string\
  \ n) { name = n; }\n    string getName() { return name; }\n    void inputData()\
  \ {\n        cout << “Please enter the student’s name: “;\n        cin >> name;\n\
  \        cout << “Please enter the student’s id: “;\n        cin >> id;\n    }\n\
  \    void outputData() {\n        cout << name << endl;\n        cout << id << endl;\n\
  \    }\n}; // 类结束\n```\n\nOOP 中的一种特殊函数是`构造函数`constructor function，它将所有共享变量初始化为初始值。`构造函数`必须与\
  \ `class` 同名，且没有返回类型。当你创建 `class` 的对象时，它们会被自动调用。这是一个默认构造函数 `Student()`，当声明一个 `Student`\
  \ 类的对象时会被自动调用：例如 `Student s1;`\n\n```cpp\nStudent() {\n    name = \"\";  // 将所有共享变量初始化为默认值\n\
  \    id = 0;\n    gpa = 0;\n}\n```\n\n`构造函数`还可以接收参数并将它们复制到成员变量中：\n\n```cpp\npublic\
  \ Student(String n, long int i) {\n    name = n;\n    id = i;\n}\n```\n`//` 在 `main()`\
  \ 中调用方式：`Student s1(“Chris”, 12345);`\n\n关键字 `this` 有时在成员函数内部用于引用调用对象，例如 `s1`。因此，当我们在上面的\
  \ `Student` 构造函数中使用 `name` 时，我们想要的是这个对象 `s1’s` 的名称，可以写成 `this.name`。\n\n程序员经常将面向对象的程序划分为不同的文件。仅包含函数声明的\
  \ `class` 定义放在头文件中，例如 `Student.h`。成员函数被放在另一个文件中，例如 `student.cpp`，该文件在顶部包含头文件，例如\
  \ `#include \"Student.h\"`。`main` 函数也放在单独的文件中，例如 `driver.cpp`，它也包含头文件。这些文件都被放在编辑器的同一个项目（`New/Project`）中并一起编译。\n\
  \n### 对象数组\n\n对象通常被放入数组或更复杂的数据结构（如 `vectors`）。例如，我们通常在程序中需要的比几个学生对象更多。我们可能需要跟踪教室甚至整个学校的所有学生，需要数百或数千个学生。我们创建的新类类型可以用任何使用简单数据类型的地方。因此，我们可以像声明\
  \ `int` 数组一样声明 `Student` 对象数组：\n\n```cpp\nStudent studentArray[100]; // 包含 100 个\
  \ Student 对象\n```\n\n或者我们可以声明一个动态学生数组：\n```cpp\nVector<Student> students;\n```\n\
  \n我们可以使用循环来遍历数组并调用每个学生的函数：\n\n```cpp\nfor(int i=0; i < 100; i++)\n    studentArray[i].inputData();\
  \ // 调用学生 i 的 inputData() 函数\n```\n\n我们还可以将整个数组传递给函数。例如：\n\n```cpp\nvoid inputArray(Student\
  \ studentArray[]) {\n    for(int i=0; i < 100; i++)\n        studentArray[i].inputData();\n\
  }\n```\n\n幸运的是，在 `C++` 中数组名始终作为其地址，因此数组地址会自动传递给函数，而不是复制整个数组，并且会原始数组。\n\n### 项目\n\
  \n1. 创建一个 `Date` 类，包含 `month`、`day` 和 `year`，以及 `set/get` 和 `input/output` 函数，以及一个将日期设置为当前日期的默认构造函数。在\
  \ `main` 函数中测试它。\n2. 创建一个 `BankAccount` 类，包含银行账户信息（所有者、余额等）以及标准函数和 `withdraw()/deposit()`\
  \ 函数。\n3. 创建一个 `Student` 对象的 `Array` 并使用循环填充数据。然后，找到 `gpa` 最高的学生。\n\n## 第 14 章：改进技术\n\
  \n### 结构体\n\n`Structs` 起于 `C` 语言，源于类编程的世界。然而，它们仍然有用，并可以用在认为类大材小用的地方。使用结构体的一个很好的例子是用于记录保存，例如如果你需要跟踪球队中的足球运动员，你需要存储：\n\
  \n- 姓名\n- 球衣号码\n- 薪水\n- 最擅长的脚\n- 等等。\n\n\n\n\n如果不需要为这些信息添加功能，那么结构体（structure）是这种情况的完美选择。存储此类信息的结构体定义如下：\n\
  \n```cpp\nstruct FootballPlayer{\n    string Name;\n    int KitNumber;\n    double\
  \ Wage;\n    string StrongestFoot;\n};\n```\n\n该结构包含了所有相关值，这将为相似信息提供一个相关的容器。结构体的新实例定义如下：\n\
  \n```cpp\nFootballPlayer player1;\nplayer1.Name = \"Messi\";\nplayer1.KitNumber\
  \ = 10;\nplayer1.Wage = 1000000;\nplayer1.StrongestFoot = \"Both\";\n```\n\n这段代码将创建一个\
  \ `FootballPlayer` 并为它的所有成员变量赋值。在现实世界中，结构体的用法倾向于“简单”使用，即仅需要存储像示例那样的微小数据；当需要功能和封装时，请使用类（class）。这被称为\
  \ `POD`（纯旧数据数据）封装。注意：结构体变量的默认访问权限是公有的（public），而类的默认权限是私有的（private）。\n\n### 枚举 (Enums)\n\
  \n`Enums` 是枚举类型（Enumerated Type）的缩写，它的作用类似于布尔值，但具有无限的用户定义类型，它可以用于诸如“主屏幕”或“设置屏幕”等情况的标记。\n\
  \n枚举的定义如下：\n\n```cpp\nenum CurrentScreen{HOME, SETTINGS, CONTACTS, CALCULATOR};\n\
  ```\n\n括号中的每个单词都是枚举可以设置的状态。枚举实例的创建方式如下：\n\n```cpp\nint main(){\n    CurrentScreen\
  \ phone1;\n    phone1 = HOME;\n}\n```\n\n上述代码创建了一个新枚举并将其赋值为“HOME”。你现在可以使用该枚举来检查它处于什么状态，下面的示例将使用\
  \ `switch-case` 语句：\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing\
  \ namespace std;\nenum CurrentScreen{HOME, SETTINGS, CONTACTS, CALCULATOR};\nint\
  \ main(){\n    CurrentScreen phone1;\n    // 修改我\n    phone1 = HOME;\n    switch\
  \ (phone1){\n        case HOME:\n            cout << \"You're on the home page\"\
  \ << endl;\n            break;\n        case SETTINGS:\n            cout << \"You're\
  \ on the settings page\" << endl;\n            break;\n        case CONTACTS:\n\
  \            cout << \"You're on the contacts page\" << endl;\n            break;\n\
  \        case CALCULATOR:\n            cout << \"You're on the calculator page\"\
  \ << endl;\n            break;\n        default:\n            break;\n    }\n}\n\
  ```\n\n**输出**\nYou’re on the home page\n\n这段代码展示了你可以将条件结构与枚举结合，轻松地创建一个良好的分支结构。尝试修改注释的“修改我”枚举定义，并观察输出如何变化。\n\
  \n### 联合体 (Unions)\n\n联合体（Unions）是为了提供高效内存利用而设计的数据结构，它可以包含任意数量的成员变量，但一次只能存储一个变量的数据。因此，整个结构只占用最大成员变量的内存。\n\
  \n使用联合体必须谨慎，因为设置另一个成员变量的值将移除存储在另一个变量中的数据，因此很容易丢失重要数据。\n\n联合体的定义如下：\n\n```cpp\nunion\
  \ Example{\n    int i;\n    int x;\n    int y;\n};\n```\n\n创建实例并赋值的方式如下：\n\n```cpp\n\
  Example e;\ne.i = 4;\n```\n\n为了展示联合体的大小是如何工作的，下面的程序对其进行了演示：\n\n```cpp\n#include\
  \ \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nunion Example{\n    int\
  \ i;\n    int x;\n    int y;\n};\nint main(){\n    Example e;\n    e.i = 4;\n  \
  \  cout << \"Your int size is: \" << sizeof (int ) << \" bytes\" << endl;\n    cout\
  \ << \"The union has 3 variables that should be a total of: \" << sizeof (int )\
  \ * 3 << \" bytes\" << endl;\n    cout << \"However, the union is \" << sizeof (e)\
  \ << \" bytes\" << endl;\n}\n```\n\n**输出**\nYour int size is: 4 bytes\nThe union\
  \ has 3 variables that should be a total of:  12 bytes\nHowever, the union is 4\
  \ bytes\n\n如所见，联合体的大小仅等于单个整数。在变量空闲且只需要一个变量的情况下，这些结构可以高效地利用内存。\n\n下面的代码展示了当改变一个值时，所有值会发生什么：\n\
  \n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nunion\
  \ Example{\n    int i;\n    int x;\n    int y;\n};\nvoid Print_Union(Example e ){\n\
  \    cout << \"i: \" << e .i << endl;\n    cout << \"x: \" << e .x << endl;\n  \
  \  cout << \"y: \" << e .y << endl;\n}\nint main(){\n    Example e;\n    cout <<\
  \ \"1\" << endl;\n    e.i = 4;\n    Print_Union(e);\n    cout << \"2\" << endl;\n\
  \    e.y = 3;\n    Print_Union(e);\n    cout << \"3\" << endl;\n    e.x = 1;\n \
  \   Print_Union(e);\n}\n```\n\n**输出**\n1\ni: 4\nx: 4\ny: 4\n2\ni: 3\nx: 3\ny: 3\n\
  3\ni: 1\nx: 1\ny: 1\n\n如所见，当你改变其中一个值时，它们都变得相等，这是因为所有值都共享相同的内存位置，因此当其中一个改变时，所有的都会改变。\n\
  \n### 可变参数列表 (Variable argument lists)\n\n可变参数列表允许无限参数的可能性。之前我们遇到过具有固定数量参数（可以传递到方法的变量）的函数，例如：\n\
  \n```cpp\nint Add(int i, int y){}\n```\n\n有两个参数：整数 `i` 和整数 `y`。这被称为变变函数（Variadic\
  \ Function）或具有无限元数（参数数量，上述 `Add` 的元数为 2）的函数。\n\n变量存储在一个名为 `va_list` 的变量中，它的工作与其他任何变量一样，只是它持有了传递的变量列表。变变函数的定义如下：\n\
  \n```cpp\nvoid Add(int numberOfVariables , ...){}\n```\n\n其中 `numberOfVariables`\
  \ 是传递的额外参数数量，注意这不包括该变量本身。这是必要的，因为 `va_list` 并不知道变量的总数，也不会跟踪它在列表中的位置。使用 `va_list`\
  \ 需要使用几个函数：\n\n*   `va_start(va_list, numberOfVariables)`\n    *   获取传入的变量，并将第二个参数指定的数字赋值给第一个参数。\n\
  *   `va_arg(va_list, type)`\n    *   从第一个参数指定的列表中获取下一个变量，并创建一个由 `type` 指定类型的变量。\n\
  *   `va_end(va_list)`\n    *   清理列表。\n\n\n\n\n我们现在可以使用这些函数来创建一个可工作的变长参数函数：\n\n```cpp\n\
  #include \"stdafx.h\"\n#include <cstdarg>\n#include <iostream>\nusing namespace\
  \ std;\n\nvoid Add(int numberOfVariables , ...){\n    // 变量列表\n    va_list arg;\n\
  \    // 获取列表\n    va_start (arg, numberOfVariables );\n    int total = 0;\n    for\
  \ (int i = 0; i < numberOfVariables ; i++){\n        // 获取下一个变量\n        total +=\
  \ va_arg (arg, int);\n    }\n    // 清理\n    va_end (arg);\n    cout << \"Total is:\
  \ \" << total << endl;\n}\n\nint main(){\n    // 4 个参数\n    Add(4,1, 2, 3, 4);\n\
  \    // 10 个参数\n    Add(10,6, 9, 5, 11, 22, 1, 3, 56, 90, 63);\n}\n```\n\n输出：\n\
  Total is: 10\nTotal is: 266\n\n变量列表处理的每个部分都已标记，此函数会累加给到的所有参数。这提供了一种非常动态的方式，可以创建一个能够处理几乎无限参数列表的函数。\n\
  \n### 练习\n创建一个函数，将所有给定参数并返回一个值，然后打印该值。注意：需要此头文件：`#include <cstdarg>`\n\n### 答案\n\
  类似下面的代码：\n\n```cpp\n#include \"stdafx.h\"\n#include <cstdarg>\n#include <iostream>\n\
  using namespace std;\n\nint Multi(int numberOfVariables , ...){\n    va_list arg;\n\
  \    va_start (arg, numberOfVariables );\n    int total = 1;\n    for (int i = 0;\
  \ i < numberOfVariables ; i++){\n        // 获取下一个变量\n        total *= va_arg (arg,\
  \ int);\n    }\n    va_end (arg);\n    return total;\n}\n\nint main(){\n    cout\
  \ << \"The total is: \" << Multi(3, 56, 90, 63) << endl;\n}\n```\n\n\n### 命名空间\n\
  Namespaces（命名空间）用于防止同名的变量和函数混淆。例如，`Run()` 函数可能适用于许多情况，因此需要一种方法来区分不同的 `Run()` 函数，这就是可以使用命名空间的地方。\n\
  \n它们的定义方式如下，大括号内的所有函数和变量都是该命名空间的一部分：\n\n```cpp\nnamespace NamespaceName{}\n```\n\
  \n下面的示例展示了它们如何使用：\n\n定义了两个如下所示的命名空间，它们具有相同的函数名：\n\n```cpp\nnamespace Proccesing{\n\
  \    void Run(){\n        cout << \"Processing!\" << endl;\n    }\n}\n\nnamespace\
  \ Initialisation{\n    void Run(){\n        cout << \"Initialisation started!\"\
  \ << endl;\n    }\n}\n```\n\n这为程序员提供了机会，通过只需指定命名空间来选择要执行哪一个 `Run()`：\n\n`Proccesing::Run();`\n\
  和 `Initialisation::Run();`\n它们可以同时运行：\n\n```cpp\nint main(){\n    Initialisation::Run();\n\
  \    Proccesing::Run();\n}\n```\n\n输出：\nInitialisation started!\nProcessing!\n\n\
  因此，命名空间提供了一种整洁划分代码的方式，并通过提供一种几乎可以标记代码块的方法提高了可读性。\n\n### 问题\n1. 建议使用 `struct` 的情况是什么？\n\
  2. `enum` 是什么缩写？\n3. `union` 的大小是如何决定的？\n4. 关于 `union` 的一个关键因素是什么？\n5. 什么是变长函数（Variadic\
  \ function）？\n6 ` `va_list` 包含什么？\n7. 为什么变长函数中需要指定参数数量？\n8. 为什么需要运行 `va_end()`？\n\
  9. 命名空间的基本作用是什么？\n10. 调用命名空间内部的函数时使用什么语法？假设你在命名空间 `Math` 内部调用函数 `Add()`\n\n### 答案\n\
  1. 用于普通旧数据 (POD)。\n2. 举举类型 (Enumerated type)。\n3. 它是最大成员变量的大小。\n4. 所有成员变量共享相同的内存位置，因此一次只有一个变量可以持有值。\n\
  5. 一个具有可能无限数量参数的函数。\n6. 传递给函数的变量列表。\n7. 没有方法知道 `va_list` 的大小，因此你需要指定传递的参数数量。\n8.\
  \ 它在变量列表使用后后执行清理工作。\n9. 以有意义的方式划分和标记变量及函数。\n10. `Math::Add()`\n\n\n\n\n\n## 第 15\
  \ 章：C++ 中的多线程应用\n\n如果你是 C++ 编程专家，或者在过去的五年里一直一直在编写软件，那么你很可能了解 Win32 线程。在使用 C++ 创建跨平台软件时，你遇到的最大挑战之一就是如何正确地处理线程。由于许多系统有不同的多线程处理方法，你的源代码可能会因为各种定义不同平台行为的预处理器条件而变得混乱。\n\
  \nC++ 有一种名为 `std::thread` 的机制。好处是，任何 C++ 编译器都可以实现这种线程。所以，如果你正被迫使用 `Dev-C++`，那么现在是时候考虑其他东西了。让我们假设你现在拥有一个可以帮助你而不是拖你后腿的编译器。在\
  \ C++ 语言中编写线程软件的最佳方法是使用 API。仅仅丢给你几行代码并让你自己去消化剩下的部分是不对的。\n\n### 什么是线程？\n网络上有许多关于线程的资源，阅读其中一些是有好处的。让我们回到主问题。线程支持软件在不同的处理器上同时且并行运行。嗯，这听起来很不错，对吧？虽然这是一好事，但它带来了一些问题。这使得在没有良好设计的情况下，很难考虑性能问题。如果你仍然不理解线程是什么以及它们为什么那么有用，那么你应该花时间读一些关于线程的简短文章。\n\
  \n### 消费者，生产者\n多线程最流行的例子之一是生产者-消费者模型。换句话说，这里有一个线程释放值供他人计算，而另一个线程接收这些值并进行使用。这是一个任何人都能理解的常规描述。\n\
  \n在这个示例中，你会发现有三个相关的线程构造结构。下面解释了这三个线程：\n\n- `std::mutex`：这代表单个互斥锁。它是一个对象，允许在给定区域内由单个线程访问。\n\
  - `std::lock_guard`：它锁定作用范围内的互斥锁。一旦超出作用范围，它就会移除。\n- `std::thread`：显示执行的单个线程。\n\n\
  该程序中的生产者将共享数据对象增加到 5，而主线程则增加数据对象，直到生产者线程定义了 5 为止。最有趣的是创建线程的方法，特别是当你想初始化一个 `std::thread`\
  \ 时。做法是提供一个线程要执行的函数以及其函数参数。此外，全局互斥锁有助于保护数据免受多次修改。最后，使用 `{...}` 定义显式作用域，而 `std::lock_guard`\
  \ 应该控制访问。\n\n### 两个任务：一个进程\n如果你正在编写并行软件怎么办？该示例要求为两个独立的值并行构建一个不同的函数。这是使用 `Future`\
  \ 对象来完成异步计算的最佳用例。\n\n`future` 是一个确保根据计算类型存在正确值的对象。这个对象类似于一个占位值。它帮助程序员开始计算并确认已产生的结果。准确地说，异步结果会产生\
  \ `future` 对象。`std::promise`、`std::async` 和 `std::packaged_task` 代表了允许实现 `get_future()`\
  \ 方法的接口。\n\n- `std::async`：这是一种高级方法，为未来提供值并产生最小的灵活性。此外，它是实现异步计算最简单的方法。你需要记住，这种方法与其他对象不同。\n\
  - `std::promise`：它向未来呈现一个值。\n- `std::packaged_task`：它是人们交付未来 值的最佳方式之一。\n\n## 第 16\
  \ 章：与 bug 的作战\n\n花费在搜索和删除 bug 的时间比编写 C++ 程序的时间还多，是非常令人沮丧的。因此，以下建议可以帮助你减少错误并让编程成为一种极佳的体验。\n\
  \n### 开发清晰且一致的编码风格\n选择以一致且清晰的方式编写 C++ 程序，不仅可以提高其他程序员阅读你程序的易用性，还可以减少编码错误。因此，当你阅读到遵循既定风格的整洁且清晰的代码时，你只需要花少量的时间来解析\
  \ C++ 语句的语法。这让你留出大量的精力来决定你的程序要执行什么以及如何执行。\n\n适当的编码风格应该具有以下特征：\n\n1. 根据名称理解函数、类和对象是如何使用的。\n\
  2. 区分对象名、函数名和类名。\n3. 区分预处理器符号和 C++ 符号。\n4. 在同一层级搜索代码块。\n\n\n\n\n\n此外，你必须为模块头开发一种标准格式，并提供与类、函数、作者-日期以及关于修改历史的相关信息。\n\
  \n**提示**：所有负责单兵项目的程序员都应该使用相同的编码风格。用不同编码风格编写的程序会令人困惑并显得不专业。\n\n### 开启警告和错误消息\nC++\
  \ 语言的语法提供了检查错误的能力。当编译器遇到难以解析的结构时，它除了显示消息外别无事事做。它会尝试同步并备份源代码。有时这个过程是成功的，但它不会创建可执行文件。这将迫使程序员处理所有的错误消息。\n\
  \n尽管如此，一旦 C++ 程序发现了一个一个它可以运行但看起来很可疑的结构，它只会简单发送一条警告消息。这是因为 C++ 语言非常清楚你想要什么，所以它会继续运行并构建一个可执行文件，帮助你忽略警告。然而，如果你不想被打扰，可以禁用警告。\n\
  \n**提示**：禁用警告是一个非常糟糕的主意。这就像断开汽车的引擎检查灯一样。记住，忽略问题不是解决方案。\n\n### 对代码进行注释\n在对代码进行注释时，可以防止错误的发生。养成在写代码时就注释的习惯，而不是等运行正常了再回来注释。注释是帮助你理解自己正在做什么的极佳方法。在修改程序时，简短的注释更好。\n\
  \n### 有限的可见性\n减少类内部成员对外部世界的可访问性是面向对象编程的关键部分。类必须对它的成员负责。如果类中出现任何问题，那就是程序员的责任。\n\n\
  有限的可见性要求保护数据成员以超出类范围的访问性。简而言之，数据成员应该被保护。此外，应用程序软件不应该感知到的所有成员函数都必须被保护。\n\n### 监控堆内存\n\
  忘记监控堆内存是许多发布程序中致命错误的主要来源之一。这仍然是人们追踪的最困难的问题之一，因为这类特定错误难以定位和删除。大多数时候，它们存在于你购买的程序中。这你需要运行程序几个小时后问题才会开始显现。作为一般原则，程序员需要分配和释放堆内存。\n\
  \n### 使用异常修复错误\n为了处理 C++ 语言中的错误，内置了异常机制。通常情况下，发送错误指示比返回错误标志要好。\n\n**提示**：对真实的错误使用异常。对于一个发送“某些事情不起作用”指示的函数抛出异常是无关的。\n\
  \n### 在删除所指向的内容后移除指针\n确保在删除指针所指向的内容后，移除了这些指针。你通过为指针分配一个 `nullptr` 值来实现这一点。你很快就会学到这一点。你可能会很容易发现自己在不知情的情况下使用了一个已返回给堆的内存块。程序在\
  \ 99% 的时间里可能运行良好，但很难识别那 1% 内存块被分配且程序无法运行的实例。\n\n如果由于空了错误的指针并尝试使用它们来存储值，你的程序将立即崩溃。程序崩溃是一件坏事，但它也揭示了问题。问题确实存在，只是能否找到它的问题。\n\
  \n### 虚析构函数的声明\n当构造函数分配了在对象结束时应返回的资源时，请确保在类中定义了析构函数。一旦定义了析构函数，使其可见。\n\n### 拷贝构造函数和重载赋值运算符\n\
  如果你的类需要析构函数，那么它确实需要一个重载的赋值运算符加上拷贝构造函数。如果你的构造函数分配了如堆内存之类的资源，赋值运算符和默认拷贝构造函数将不会执行任何操作通过产生多个指针来产生问题。\n\
  \n如果调用了这些对象的一个析构函数，它将返回资产。而当另一个拷贝的析构函数出现时，它就会搞乱一切。\n\n### 在调试器中遵循每一步\n作为一个程序员，你的职责是理解你的程序在做什么。程序仅仅显示所需的值是不够的。你必须理解程序所做的一切。没有比逐步跟踪更能理解你的程序在做什么更好的方法了。获取一个好用的调试器并分步执行你的程序。\n\
  \n再次，在你调试程序时，随身携带一些原始数据，以帮助你找出程序运行时可能出现的任何奇怪行为。没有比监控每个运行中的函数更彻底的方法来完成完整检查了。\n\n\
  ## 第 17 章：新版本：C++ 14\nC++ 14 于 2014 年 12 月发布。在发布之前，它经常被称为“C++1y”。C++14 为核心语言添加了大量的更新。在许多情况下，C++14\
  \ 是在 C++11 添加的功能的基础上构建的。总的来说，这是一个精细得多的，对用户的影响较小。\n\n### 返回类型推导\nC++11 开启了 lambda\
  \ 表达式，并允许它们根据表达式确定返回类型。这个新版本为所有函数赋予了这种能力。需要使用 `auto` 来确定返回类型。\n\n### 放宽限制的 constexpr\n\
  C++11 还引入了 `constexpr` 声明函数的概念。这本质上是一个可以在编译时执行的函数。在 C++11 中，`constexpr` 函数只能有一个表达式。C++14\
  \ 减少了版本 11 中存在的限制。这些函数现在能够包含以下内容：\n\n* 除了 `thread_local` 或 `static` 变量类型或任何未初始化的声明外的所有声明\n\
  * 包括 `if` 语句和 `switch` 的条件\n* 任何循环语句，包括 `for` 或 `while`\n\n\n\n\n在此版本的 C++ 中，禁止使用\
  \ `goto` 语句。\n\n### 数字分隔符\nC++14 现在为用户提供了使用数字分隔符的选项。这仅仅是在数值字面量中使用单个单引号。这包括整数和浮点数。尽管这项功能并非翻天覆地，但对于阅读数字非常有帮助。分隔符不会改变数字的求值，除了可读性外，没有特殊的编码优势。下面的示例展示了如何使用它。\n\
  \n### 关键字：auto\n`auto` 关键字是 C++14 中的一个新特性。尽管它在 C++3 中就已经引入，但现在它有了不同的含义。它的目的是让编码变得更简单、更整洁且不易出错。以下是\
  \ `auto` 的用法示例及其等价写法。上面的示例用于替代：\n\n使用 `auto` 也不对速度产生任何负面影响。这是因为 `auto`是在编译时推导的，而不是在运行时。与\
  \ C++11 不同，`auto` 现在可以与函数一起使用。你现在有了编写的能力：\n\n### 示例程序\n以下是 C++11 和 C++14 中使用 `auto`\
  \ 关键字的示例。\n\n1) 这是该程序的 C++11 版本。\nC++14 版本如下：\n\n## 泛型 Lambda\nLambda 函数在 C++11\
  \ 中引入，当时它们需要被声明为具体类型。C++14 在使用这一要求上更加宽松。它允许将 lambda 参数声明为 `auto` 类型。\n\n```\nauto\
  \ f = [](auto x){ return func(normalize(x)); };\n```\n\n上述定义等价于以下伪代码：闭包的函数调用运算符如上所示。为了正确编写\
  \ lambda，`x` 必须被完美地转发给 `normalize`。它必须通过 `std::forward` 传递给 `normalize`。下面是一个泛型\
  \ lambda 基本用法的完整程序示例。运行上述代码的结果如下：\n\n## 新标准库特性\n随着 C++14 的出现，新的标准库特性随之而来。这些特性包括：\n\
  \n- 锁和共享互斥锁\n- 关联容器中的异构查找\n- 用户定义的标准字面量\n- 元组寻址\n\n\n\n\n这里是 `C++14` 提供的主要库功能列表，此外还有许多较小的库新增。\n\
  \n### 用户自定义字面量 (User Defined Literals)\n`C++14` 添加了许多后缀，用于指定定义字面量的类型。这些后缀的示例包括 `'s'`\
  \ 或 `'st'`。这用于字符和字符串类型。给定示例的最后一行将报错错误。这是因为 `str` 将被确定为 `'const char*'` 类型，而 `str1`\
  \ 将被确定为 `string`。以下后缀——'h'`、`min'`、`s'`、`ms'`、`us'`、`ns'` 用于表示不同的时间间隔类型。\n\n###\
  \ 二进制字面量 (Binary Literals)\n在 `C++14` 二进制字面量出现之前，像 `11111101` 这样的格式是不支持的。为了使用它们，需要将它们转换为支持的类型。下面的代码段展示了如何在编程中使用它们。二进制字面量以\
  \ `0b` 或 `0B` 开头，随后跟是一系列 0 和 1。在许多其他编程语言中也可以找到类似的语法。这些编程语言包括 `Java`、`Perl` 和 `Python`，它们都提供了对二进制字面量的支持。二进制字面量的类型为\
  \ `int`。在所有接受常量字面量的地方都可以使用它。\n\n### 变量模板 (Variable Template)\n变量模板的设计目的是让编码更容易，并简化常量的定义和使用。变量模板本质上是一组变量的定义。变量模板是在声明变量的地方使用模板声明来创建的。这些只是\
  \ `C++14` 引入的特性。还引入了许多其他特性，但并不是重大的进展。`C++14` 包含的一些次要特性包括带尺寸的初始化（sized deal locations）和一些语法清理。尽管\
  \ `C++14` 的版本更新相比于 `C++11` 的重大更新，但它是必要的。\n\n## 第 18 章：游戏设计\n\n### 游戏设计简介\n到此时，你已经学会了如何在\
  \ `C++` 中完成很多事情，并且实际上已经学会了这本书所提供的所有内容。本单元专门用于制作一些你在互联网断开时可以玩玩的电脑游戏。你不会从这里学到很多，但这更多是一种获得经验的方式。这些游戏可以打时间，并在网络恢复之前玩起来很有趣。你将专注于易制作的游戏。每一次，代表性的游戏将更深入地关注复杂主题和用户关系。接下来的所有游戏都将是人机模式，所以你不需要担心带朋友一起玩。不过，你可以修改游戏以具有多人模式，但对于一个良好的基础草案来说，这不是一个大要求。\n\
  \n### 用户友好性 (User-Friendliness)\n用户友好性是评估你的程序易用程度时使用的术语。即使你做了一个非常复杂的程序，用户在使用时也应该有一个实际的体验。混乱的控制和有限的输入想法会让用户感到困惑，用户将不喜欢你的程序，你会感到难过，因为你的程序由于没人喜欢而失败了。这里只是让程序更具友好性的一个例子。假设你有一个程序来显示一些偶数，这里是程序运行时的样子。\n\
  \n假设有人看到了那个程序。我们不能假设用户自动知道这些是偶数。一个可行的方案是说明这些是偶数。\n\n现在看起来好一点了。这是让你的程序增色、使其看起来更酷炫的好方法。用户现在知道显示的是什么。记住保持这些信息简单简短。不要写长描述，但要清楚用户需要知道正在发生什么。\n\
  \n### 正反面 (Heads or Tails)\n这是你将制作的第一个游戏。它涉及一些你需要找回的基本技能。希望到这里你没有忘记任何东西。\n\n游戏基础：硬币有两个面。有一个正面和一个反面。稍后，硬币将被抛向空中并落在正面或反面。在投掷之前，你必须猜硬币会落在正面还是反面。硬币投出。如果落在你猜的一面，你就赢了游戏。否则你就输了。\n\
  \n你所有的实际代码都将在 `main` 方法中实现。不过，如果你真的想，可以将其将其放在 `function` 中。\n\n从你需要的逻辑开始。由于你需要东西来决定硬币落在正面还是反面，随机数生成器效果最好，因为它产生随机值，就像硬币会落在随机的一面一样。因此，在顶部包含\
  \ `Time` 和 `Stdlib` 库。现在让我们用问候欢迎用户，让他们知道正在玩游戏。`getch()` 是暂停程序直到用户按下“回车”的命令。在上方，你需要包含\
  \ `Conio` 库（`<conio.h>`），因为它持有 `getch()` 命令。否则，这是一个启动简单“基于文本”游戏的得当方法。\n\n现在是时候玩真正的游戏了。询问玩家他或她选择正面还是反面，让用户输入选择。现在，决定硬币落在正面还是反面。这是通过随机数生成器完成的。即使数字并不一定代表硬币的实际面。你可以自己分配。在这种情况下，数字\
  \ 1 是正面，2 是反面。所以制作一个在 1 和 2 之间的随机数生成器。抛掷硬币后，现在是决定胜者的时间了。这是通过告诉用户选了什么以及电脑选择了什么来完成的。注意你必须一直输入你的选择，但可以编辑程序以接受如‘Heads’、‘HEADS’甚至‘Heads’的结果。\n\
  \n### 石剪刀布 (Rock Paper Scissors)\n这与你刚刚制作的游戏非常相似，但有一些复杂性。游戏基础：两个玩家都有机会选择石头、纸或剪刀。同时，每个玩家用手势显示。玩家的选择决定了谁胜负。例如，如果玩家\
  \ 1 选择石头，玩家 2 选择剪刀，玩家 1 将赢，因为石头赢剪刀。如果两个玩家选择相同的物体，游戏平局结束。\n\n### 猜数字 (Guess the Number)\n\
  这是你从书中完成的最后一个项目。游戏基础：一个人想一个 1-100 之间的随机数，另一个人要在 10 次机会内猜中。每次如果不正确，都会告诉用户高还是低，如果玩家在\
  \ 10 次内猜失败，就输了。在这种情况下，你必须猜电脑选择的数字。从大纲开始。另一种方法是让用户输入。创建一个变量来告诉玩家猜了多少次。现在从 0 开始。在游戏中会有某种循环。重复命令让用户再次尝试，直到他们用完机会。判断数字是高、低还是等于隐藏数字涉及到条件语句。如果用户猜对了，就不需要使用循环，将使用\
  \ `break` 语句。回来看，循环是这样的。你需要检测玩家是通过猜数字赢了，还是用完机会输了。\n\n### 龙之对决 (Dragon Clash)\nDragon\
  \ Clash 是作者制作的游戏。这是一个基于文本的战斗游戏，其中两条龙——光龙和暗龙交替攻击对方或自己，直到其中一个没有了力量。这在本地商店可能值 60 美元，但玩起来应该很有趣。这个整个游戏花了他几天，想想创建这种东西花了多久。关于这个没有官方教程。你将得到一个完整的游戏。\n\
  \n## 第 19 章：项目：通讯录 (Project: Agenda)\n对于这个项目，我们将模拟一个电话通讯录，就像你家里那种，并用它记录你需要的所有重要号码，但我们将使用\
  \ `C++` 实现。对于每个联系人，将存储他们的名字和电话（你可以添加任意数量的字段）。此外，我们将使用 `C++` 标准模板库的新强大特性：`vector`。\n\
  \n使用 vector\n想象这个通讯录将有 100 个电话号码。你会为数字声明 100 个变量吗？再为名字声明 100 个？当然不。这里是 `vector`\
  \ 完美适用的地方。通过 `vector`，你可以插入任意数量的元素。在 `C++` 中使用 `vector` 必须在代码中添加 `<vector>` 库。我们还需要\
  \ `iostream` 和 `string`。\n\n```cpp\n#include <iostream>\n#include <string>\n#include\
  \ <vector>\nusing namespace std;\n```\n\n在 `namespace std` 之后，我们将声明我们的 `vector`。它们将位于\
  \ `main` 函数之外。在 `main`（或任何 `function`）之外声明变量意味着该变量是全局的。换句话说，任何人都可以对其进行读写。\n\n```cpp\n\
  vector<string> Names;\nvector<string> Phones;\n\nint main(){\n    int sel = 0;\n\
