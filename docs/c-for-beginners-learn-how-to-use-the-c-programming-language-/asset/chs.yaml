  \n这些方法的工作原理是通过类内部的方法返回或设置变量的值。`this->` 被称为 `this` 指针，它指向类给定实例的变量。每个对象都可以访问自己的变量，并通过\
  \ `this` 指针直接修改它们。\n\n无论如何，你的代码应该运行得非常完美。但如果你不想为每个类的每个实例都通过 get/set 处理呢？那么你可以使用所谓的初始化函数。修改你的类，使其看起来像这样：\n\
  \n```cpp\nclass animal {\nprivate:\n    string name;\npublic:\n    animal(string\
  \ name) {\n        this->name = name;\n    }\n    string getName() {\n        return\
  \ this->name;\n    }\n    void setName(string name) {\n        this->name = name;\n\
  \    }\n};\n```\n\n现在，在你的 `main` 函数中，删掉显示 `animal x` 以及后续 `x.setName(\"name\")`\
  \ 函数的代码块。当你创建一个初始化函数时，你可以从一开始就设置某些变量。例如，由于你的初始化函数接受 `name` 参数，你可以在声明变量时声明它，从而绕过整个\
  \ `setName` 操作。看这个代码示例：\n\n```cpp\nanimal dog(\"dog\");\nanimal elephant(\"elephant\"\
  );\nanimal bird(\"bird\");\n```\n\n这些都是 `animal` 类的独立实例，得益于函数初始化，它们的名字在没有使用 set\
  \ 函数的情况下就被设置了。这使得创建新对象变得极其简单，过程也非常精简。\n\n现在我们已经讨论了一会儿关于声明对象之类的内容，让我们更多地讨论一下对它们进行的具体操作。这里的\
  \ `animal` 对象当然代表动物。我们可以给整个类设置一组它们可以执行的方法。\n\n让我们思考一下每种动物都在做什么。每种动物都会睡觉、进食和喝水，对吧？所以将这些内容包含在我们的类中并不太奇奇，这样\
