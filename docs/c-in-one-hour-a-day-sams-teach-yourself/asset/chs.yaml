  \ \"Number of instances of '-1' in the multiset are: \";\n30:    cout << msetInts.count(-1)\
  \ << endl;\n31:\n32:    return 0;\n33: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\n\
  Contents of the set:\n-999 -1 151 202\nContents of the multiset:\n-999 -1 151 202\n\
  Number of instances of '-1' in the multiset are: 2\n```\n\n点击此处查看代码图像\n\n### 分析\
  \ ▼\n\n第 4 行到第 13 行包含了通用模板函数 `DisplayContents()`，你在第 17 节 STL 数组类以及第 18 节 STL `list`\
  \ 和 `forward_list` 中见过它。该函数将容器的内容写入控制台或屏幕。第 17 行和第 22 行如你所知，分别使用列表初始化实例化 `set` 和\
  \ `multiset`。第 18 行和第 24 行尝试在 `set` 和 `multiset` 中插入重复值。第 23 行演示了如何使用 `insert()`\
  \ 将一个 `set` 的内容插入 `multiset`（在本例中是将 `setInts` 的内容插入 `msetInts`）。输出显示 `multiset`\
  \ 能够持有多个值，而 `set` 不能。第 30 行演示了 `multiset::count()` 成员函数，它返回 `multiset` 中持有特定值的元素数量。\n\
  \n**提示**：使用 `multiset::count()` 查找 `multiset` 中与该参数具有相同元素的数量。\n\n### 在 STL `set`\
  \ 或 `multiset` 中查找元素\n\n关联容器如 `set`、`multiset` 或 `map` 和 `multimap` 具有 `find()`\
  \ 功能——这是一个成员函数，允许你根据键查找值：\n\n```cpp\nauto elementFound = setInts.find(-1);\n\n//\
  \ Check if found...\nif(elementFound != setInts.end())\n   cout << \"Element \"\
  \ << *elementFound << \"!\" << endl;\nelse\n   cout << \"Element not found in set!\"\
  \ << endl;\n```\n\n点击此处查看代码图像\n\n`find()` 的用法在列表 19.3 中演示。对于允许多个相同值的 `multiset`，该函数查找匹配提供键的第一个值。\n\
  \n### 输入 ▼\n\n列表 19.3 使用 `find` 成员函数\n\n```cpp\n 0: #include<set>\n 1: #include<iostream>\n\
