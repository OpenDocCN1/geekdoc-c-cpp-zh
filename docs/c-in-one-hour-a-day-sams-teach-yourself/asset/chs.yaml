  \  {\n         myFile << \"This is some text\" << endl;\n         myFile.close();\n\
  \  }\n```\n\n点击此处查看代码图片\n\n## 第 28 节\n\n## 异常处理\n\n本节教你如何处理中断程序流的异常情况。到目前为止的课程大多采取了极其积极的态度，假设内存分配会成功、文件会被找到等等。现实并不总是如此。\n\
  \n在本节中，你将学习到：\n\n* 什么是异常\n* 如何处理异常\n* 异常处理如何帮助你交付稳定的 C++ 应用程序\n\n### 什么是异常？\n\n\
  假设一个程序分配内存、读写数据、保存到文件——完成了所有工作。它在你那出色的开发环境中运行得完美无缺，你为应用程序没有泄漏任何字节感到自豪，尽管它管理了 级的数据！你发布了应用程序，客户在一个包含\
  \ 1000 台工作站的环境中部署了它。有些电脑有 10 年龄了。很快第一个投诉就到了你。有些用户抱怨“访问违规”，另一些说他们遇到了“未处理的异常”。\n\n\
  你的应用程序在你的环境中运行良好，为什么现在会出现这么多问题呢？\n\n事实是，外面的世界是非常异构的。即使两台计算机的硬件配置相同，也不一样。运行在每台计算机上的软件以及机器的状态决定了特定时刻可用资源量。在你的环境中运行完美的内存分配在另一个环境中可能会失败。此类失败导致了异常。\n\
  \n异常会中断应用程序的正常流。毕竟，如果没有可用内存，你的应用程序可能无法实现其目标。然而，你的应用程序可以处理异常并向用户显示友好的信息。处理异常有助于避免那些“未处理的异常”屏幕和错误消息。让我们看看\
  \ C++ 提供了哪些工具来处理异常。\n\n### 什么会导致异常？\n\n异常可能由外部因素引起，例如资源不足的系统，或由应用程序内部因素引起，例如尽管包含无效值仍使用的指针或除零错误。某些模块被设计为向调用者抛出异常来通信错误。\n\
  \n注意：为了保护你的代码免受异常影响，你需要“处理”异常，从而使代码是“异常安全的”。\n\n### 通过 `try` 和 `catch` 实现异常安全\n\n\
  在实现异常安全方面，`try` 和 `catch` 是 C++ 中最重要的关键字。要使语句具有异常安全性，你需要将其封装在 `try` 块中，并使用 `catch`\
  \ 块来处理从 `try` 块产生的异常：\n\n```cpp\nvoid SomeFunc()\n{\n   try\n   {\n      int* numPtr\
  \ = new int;\n      *numPtr = 999;\n      delete numPtr;\n   }\n   catch(...)  //\
  \ ... 捕获所有异常\n   {\n      cout << \"Exception in SomeFunc()\" << endl;\n   }\n}\n\
  ```\n\n点击此处查看代码图片\n\n#### 使用 `catch(...)` 处理所有异常\n\n在第 8 节 “指针与引用详解”中，我提到 `new`\
  \ 的默认形式在成功时返回内存位置的有效指针，但在失败时抛出异常。列表 28.1 演示了你如何通过使用 `new` 使内存分配具有异常安全性，并处理计算机无法分配你请求的内存的情况。\n\
  \n### 输入\n\n列表 28.1 使用 `try` 和 `catch` 确保内存分配的异常安全性\n\n\n\n\n\n```cpp\n 0: #include<iostream>\n\
  \  1: using namespace std;\n  2:\n  3: int main()\n  4: {\n  5:    cout << \"Enter\
  \ number of integers you wish to reserve: \";\n  6:    try\n  7:    {\n  8:    \
  \   int input = 0;\n  9:       cin >> input;\n 10:\n 11:       // Request memory\
  \ space and then return it\n 12:       int* numArray = new int[input];\n 13:   \
  \    delete[] numArray;\n 14:    }\n 15:    catch (...)\n 16:    {\n 17:       cout\
  \ << \"Exception occurred. Got to end, sorry!\" << endl;\n 18:    }\n 19:    return\
  \ 0;\n 20: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nEnter number of integers you\
  \ wish to reserve: -1\nException occurred. Got to end, sorry!\n```\n\n点击此处查看代码图片\n\
  \n### 分析\n\n在这个示例中，我使用 `-1` 作为要保留的整数数量。这个输入非常荒谬，但用户总是会做荒谬的事情。如果没有异常处理器，程序将以一种非常糟糕的方式结束。但多亏了异常处理器，你可以看到输出显示了一条得体的消息：`Got\
  \ to end, sorry!`\n\n列表 28.1 展示了 `try` 和 `catch` 块的使用。`catch()` 像函数一样接受参数，而 `...`\
  \ 表示该 `catch` 块接受各种类型的异常。然而，在这种情况下，你可能想专门分离出 `std::bad_alloc` 类型的异常，因为这些异常在 `new`\
  \ 失败时会被抛出。捕获特定类型将帮助你专门处理该类型的问题；例如，你可以向用户显示消息，告诉他们具体发生了什么错误。\n\n#### 捕获特定类型的异常\n\n\
  列表 28.1 中的异常是从 C++ 标准库抛出的。此类异常具有已知类型，捕获特定类型的异常对你是有益的，因为这意味着你可以确定位异常的原因，进行更好的清理，或者至少向用户显示一条精确的消息，就像列表\
  \ 28.2 所示。\n\n##### 输入 ▼\n\n列表 28.2 捕获类型为 `std::bad_alloc` 的异常\n\n```cpp\n 0: #include<iostream>\n\
  \  1: #include<exception>  // 用于捕获异常 bad_alloc\n  2: using namespace std;\n  3:\n\
  \  4: int main()\n  5: {\n  6:    cout << \"Enter number of integers you wish to\
  \ reserve: \";\n  7:    try\n  8:    {\n  9:       int input = 0;\n 10:       cin\
  \ >> input;\n 11:\n 12:       // Request memory space and then return it\n 13: \
  \      int* numArray = new int [input];\n 14:       delete[] numArray;\n 15:   \
  \ }\n 16:    catch (std::bad_alloc& exp)\n 17:    {\n 18:       cout << \"Exception\
  \ encountered: \" << exp.what() << endl;\n 19:       cout << \"Got to end, sorry!\"\
  \ << endl;\n 20:    }\n 21:    catch(...)\n 22:    {\n 23:       cout << \"Exception\
  \ encountered. Got to end, sorry!\" << endl;\n 24:    }\n 25:    return 0;\n 26:\
  \ }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nEnter number of integers you wish to\
  \ reserve: -1\nException encountered: bad array new length\nGot to end, sorry!\n\
  ```\n\n点击此处查看代码图片\n\n### 分析\n\n将列表 28.2 的输出与列表 28.1 的输出进行对比。列表 28.2 中的代码可以为应用程序的突然终止提供更精确的原因：`bad\
