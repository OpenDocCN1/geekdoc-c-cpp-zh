  \ 314\nOprah Winfrey: +1 7889 879 879\nBill Gates: +1 97 7897 8799 8\nAngi Merkel:\
  \ +49 23456 5466\nVlad Putin: +7 6645 4564 797\nJohn Travolta: 91 234 4564 789\n\
  \n从列表中删除 Putin 后:\nAngelina Jolie: +1 745 641 314\nOprah Winfrey: +1 7889 879 879\n\
  Bill Gates: +1 97 7897 8799 8\nAngi Merkel: +49 23456 5466\nVlad Putin: +7 6645\
  \ 4564 797\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n首先，关注第 54 到 80 行的 `main()` 函数。第 56\
  \ 行实例化了一个 `ContactItem` 类型的列表。第 57 到 62 行向该列表填充了姓名和（虚拟）电话号码；第 66 行显示了初始顺序。第 67 行在没有谓词的情况下使用了\
  \ `list::sort()`。在缺少谓词的情况下，该函数寻找 `ContactItem` 中的 `<`，它定义在第 36 到 39 行。`ContactItem::operator<`\
  \ 帮助 `list::sort()` 按字母顺序排序元素（而不是按电话号码）。要按电话号码对相同的列表，你在第 71 行使用 `list::sort()` 并提供二元谓词\
  \ `SortOnphoneNumber`。这个位于第 48 到 52 行的函数确保 `ContactItem` 类型输入根据电话号码相互比较。正如输出所示，它帮助\
  \ `list::sort()` 根据电话号码对名人进行排序。最后，第 76 行使用 `list::remove()` 从列表中删除一个名人。你提供了一个带有姓名的对象，`list::remove()`\
  \ 使用 `ContactItem::operator==`（定义在第 30 到 33 行）与列表中的元素进行比较。如果姓名匹配，该运算符返回 `true`，从而帮助\
  \ `list::remove()` 决定匹配的标准。示例了如何创建任意对象的模板列表，并展示了运算符和谓词的重要性。\n\n#### `std::forward_list`\n\
  \n与双链表 `list` 不同，`std::forward_list` 是单链表——这意味着它只允许单向迭代，如图 18.2 所示![插图显示了三个相互连接的元素，分别标记为\
  \ Node 1、Node 2 和 Node N。三个部分都标记了 Data 和 Link。箭头连接了 Node 1 与 Node 2，以及 Node 2 与\
  \ Node N](img/18fig02.jpg)。\n\n**图 18.2** 单链表的视觉表示。\n\n使用 `std::forward_list` 需要包含头文件\
  \ `<forward_list>`：\n\n```cpp\n#include<forward_list>\n```\n\n`forward_list` 的用法与\
  \ `list` 类似，区别在于只能向一个方向移动迭代器，并且有一个插入元素的 `push_front()` 函数但没有 `push_back()` 函数。当然，你可以使用\
  \ `insert()` 及其重载函数在指定位置插入元素。列表 18.8 展示了 `forward_list` 类的一些函数。\n\n### 输入 ▼\n\n\
  列表 18.8 使用 `forward_list` 的基本插入和删除\n\n```cpp\n 0: #include<forward_list>\n 1: #include<iostream>\n\
  \ 2: using namespace std;\n 3:\n 4: template <typename T>\n 5: void DisplayContents(const\
  \ T& container)\n 6: {\n 7:    for(auto element = container.cbegin();\n 8:     \
  \     element != container.cend();\n 9:          ++ element)\n10:       cout <<\
  \ *element << ' ';\n 11:\n 12:    cout << endl;\n 13: }\n 14:\n 15: int main()\n\
  \ 16: {\n 17:    forward_list<int> flistIntegers{ 3, 4, 2, 2, 0 };\n 18:    flistIntegers.push_front(1);\n\
  \ 19:\n 20:    cout << \"Contents of forward_list: \" << endl;\n 21:    DisplayContents(flistIntegers);\n\
  \ 22:\n 23:    flistIntegers.remove(2);\n 24:    flistIntegers.sort();\n 25:   \
  \ cout << \"Contents after removing 2 and sorting: \" << endl;\n 26:    DisplayContents(flistIntegers);\n\
  \ 27:\n 28:    return 0;\n 29: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nContents\
  \ of forward_list:\n1 3 4 2 2 0\nContents after removing 2 and sorting:\n0 1 3 4\n\
  ```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n如示例所示，`forward_list` 在功能上与 `list` 。由于 `forward_list`\
  \ 不支持双向迭代，可以在迭代器上使用 `operator++` 但不能使用 `operator--`。此示例演示了使用第 23 行的 `remove()` 函数删除所有值为\
  \ `2` 的元素。第 29 行演示了使用默认 `std::less<T>` 排序谓词的 `sort()`。\n\n`forward_list` 的优势在于由于它是单链表，其内存消耗略低于\
  \ `list` 低（因为元素只需要知道下一个元素而不需要上一个元素）。\n\n| 做 | 不要这样做 |\n\n| --- | --- |\n\n\n\n\n\
  \n| **应当** 如果你需要频繁插入或删除元素，特别是在中间，请选择 `std::list` 而非 `std::vector`；因为 `vector` 需要重新调整其内部缓冲区以允许数组语义，并会导致昂贵的拷贝操作，而\
  \ `list` 只需要连接或断开元素。**应当记住**，你可以分别通过 `push_front()` 成员方法或 `push_back()` 成员方法在列表的开头或结尾插入元素。**应当记住**，在将放入\
  \ `list` 等 STL 容器的类中，要重载运算符 `<` 和 `==`，以提供默认的排序或删除谓词。**应当记住**，像任何其他 STL 容器类一样，你始终可以使用\
  \ `list::size()` 方法确定列表中元素的数量。**应当记住**，像任何其他 STL 容器类一样，你可以使用 `list::clear()` 方法清空列表。\
  \ | **不要** 在仅在两端频繁插入或删除、且中间没有插入或删除操作的情况下使用列表；在这种情况下，`vector` 或 `deque` 的速度会快得多。**不要**忘记如果你想用非默认准则对列表使用\
  \ `sort()` 或 `remove()`，请提供一个谓词函数。**不要**混淆 `clear()` 方法与 `empty()` 方法；后者用于检查容器是否为空（在这种情况下它返回\
  \ `true`），且不产生任何更改。 |\n\n### 总结\n\n本节向你讲解了 `list` 和 `forward_list` 类函数的属性以及不同的列表操作。你现在已经了一些最实用的列表函数，并可以创建任何对象类型的列表。\n\
  \n### 问答\n\nQ 为什么 `list` 类提供了如 `sort()` 和 `remove()` 之类的成员函数？\n\n**A** STL `list`\
  \ 类要求指向 `list` 中元素的迭代器无论元素在 `list` 中的位置如何变化，都应该保持有效。尽管 STL 算法也可以作用于 `list`，但 `list`\
  \ 的成员函数确保了上述列表属性得以保证。\n\nQ 我正在使用一个类型为 `CAnimal` 的列表，它是一个类。`CAnimal` 应该定义哪些运算符才能让\
  \ `list` 成员函数准确地对其操作？\n\n**A** 对于任何可用于 STL 容器的类，你必须提供默认比较运算符 `==` 和默认运算符 `<`。\n\n\
  Q 如何在以下行将关键字 `auto` 替换为显式类型声明：\n\n```\n list<int> linkInts(10);  // 10 个整数的列表\n\
  \  auto firstElement = linkInts.begin();\n```\n\n点击此处查看代码图像\n\n**A** 你将 `auto` 替换为以下显式类型声明：\n\
  \n```\n list<int> linkInts(10);  // 10 个整数的列表\n  list<int>::iterator firstElement\
  \ = linkInts.begin();\n```\n\n点击此处查看代码图像\n\n### 工作坊\n\n工作坊练习题帮助你巩固对涵盖内容的理解，并提供了练习让你获得使用所学经验。在检查\
  \ 附录 E 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解了答案。\n\n### 测验\n\n1. **1.** 与在 STL `list`\
