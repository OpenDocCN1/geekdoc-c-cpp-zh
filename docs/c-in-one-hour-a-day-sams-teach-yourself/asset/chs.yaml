  \ 总结\n\n在本节中你学习了处理位序列和位标志的最有效工具：`std::bitset` 类。你还获得了关于 `vector<bool>` 的知识，它允许你存储布尔标志——标志的数量不需要在编译时确定。\n\
  \n### 问答\n\n**问 在已知要存储位数量的情况下，我应该使用 `bitset` 还是 `vector<bool>` 这哪一个类来存放我的二进制标志？**\n\
  \n**答 你应该使用 `std::bitset`，因为它最适合这种情况。**\n\n**问 我有一个名为 `bitset` 的 `bitset` 对象。我该如何切换位？**\n\
  \n**答 你可以使用 `flip()` 函数。**\n\n**问 我可以使用 `vector<bool>` 来扩展它的大小吗？**\n\n**答 可以，你可以使用\
  \ `push_back()` 方法。**\n\n**问 `std::bitset` 是一个容器吗？**\n\n**答 是的，但它是 `std::vector`\
  \ 的特化版本。**\n\n**问 我可以使用迭代器访问 `vector<bool>` 中的元素吗？**\n\n**答 是的，`vector<bool>` 提供迭代器支持。**\n\
  \n**问 我什么时候应该使用 `std::bitset` 而不是 `vector<bool>`？**\n\n**答 当位数量在编译时已知时，使用 `std::bitset`。**\n\
  \n（注：提供的原始问答文本存在严重混乱/重复；我已根据课程内容清理了逻辑，同时保留了技术意图。）\n\n\n\n\n\n- ■ 应由调用者释放\n- ■ 将由对象的析构函数自动销毁\n\
  \n尽管插入注释和强制良好的编码规范可以部分解决此类歧义性，但这些机制过于松散，无法有效防止所有与滥用动态分配的数据和指针指针相关的错误。\n\n## 智能指针是如何提供帮助的？\n\
  \n正如你在这在本节中已经看到的，使用传统的指针和内存管理技术存在问题。然而，作为一名 C++ 程序员，当你需要在堆/空存储器上管理数据时，你并不被迫强制使用那些指针和技术。你可以选择一种更智能的方式来分配和管理动态数据——通过在程序中使用智能指针：\n\
  \n```\nsmart_pointer<SomeClass> spData = anObject.GetData();\n\n// 像使用传统指针一样使用智能指针！\n\
  spData->Display();\n(*spData).Display();\n\n// 无需担心释放\n// （智能指针的析构函数会为你完成工作）\n```\n\
  \n点击此处查看代码图像\n\n智能指针的行为类似于传统指针（我们可以称之为*原始指针*），但智能指针通过其*重载运算符*和*析构函数*提供了有用的功能，以确保动态分配的数据被及时销毁。\n\
  \n## 智能指针是如何实现的？\n\n这个问题目前可以简化为具体提问前一节中的示例：“智能指针 `spData` 如何像传统指针一样工作？” 答案是：智能指针类重载了解引用运算符（`*`）和成员选择运算符（`->`），因此你可以像传统指针一样使用它们。（运算符重载在第\
  \ 12 节，“运算符类型与运算符重载”中已经讨论过。）\n\n此外，智能指针类通常是一个模板类，包含了其功能的泛型实现。作为模板类，这些类是多用途的，并且可以特化以管理任何类型的对象。\n\
  \n列表 26.1 显示了一个简单智能指针类的示例实现。\n\n### 输入 ▼\n\n列表 26.1 智能指针类的最精要必要组件\n\n```\n 0: template\
  \ <typename T>\n 1: class smart_pointer\n 2: {\n 3: private:\n 4:     T* rawPtr;\n\
  \ 5: public:\n 6:     smart_pointer(T* pData) : rawPtr(pData) {}  // 构造函数\n 7: \
  \    ~smart_pointer() {delete rawPtr;};           // 析构函数\n 8:\n 9:     // 拷贝构造函数\n\
  10:     smart_pointer(const smart_pointer & anotherSP);\n11:     // 拷贝赋值运算符\n12:\
  \     smart_pointer& operator=(const smart_pointer& anotherSP);\n13:\n 14:     T&\
  \ operator*() const   // 解引用运算符\n 15:     {\n 16:         return *(rawPtr);\n 17:\
  \     }\n 18:\n 19:     T* operator->() const   // 成员选择运算符\n 20:     {\n 21:   \
  \      return rawPtr;\n 22:     }\n 23: };\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n此代码段不产生输出。\n\
  \n### 分析 ▼\n\n此示例说明了在第 14 到 17 行以及第 19 到 22 行定义的两个运算符 `*` 和 `->` 的实现，它们有助于该类像传统意义上的指针一样工作。例如，要对\
  \ `Tuna` 类的对象使用智能指针，你可以这样实例化它：\n\n```\nsmart_pointer<Tuna> smartTuna(new Tuna);\n\
  smartTuna->Swim();\n// 或者：\n(*smartTuna).Swim();\n```\n\n点击此处查看代码图像\n\n该 `smart_pointer`\
  \ 类并没有显示或实现任何能使此指针类变得非常智能或让使用它比使用传统指针更有益的功能。构造函数（如第 6 行所示）接受指针，该指针被保存为 `smart_pointer`\
  \ 类中的内部指针对象。析构函数释放此指针，从而实现了自动内存释放。\n\n### 注意\n\n使智能指针真正变得“智能”的实现是拷贝构造函数、赋值运算符和析构函数的实现。它们决定了智能指针对象在跨函数传递、赋值或离开作用域（即被销毁）时的行为。因此，在查看完整的智能指针实现之前，你应该先了解一些智能指针类型。\n\
  \n## 智能指针的类型\n\n内存资源管理（即实现的所有权模型）是智能指针类的与众之处。智能指针决定了在被拷贝和赋值给资源时对该资源做什么。最简单的实现通常会导致性能问题，但最快的实现可能不适用于所有应用程序。因此，在使用智能指针之前，了解它们的工作原理是非常关重要的。\n\
  \n智能指针根据其内存资源管理策略分为以下几类：\n\n- ■ 深拷贝\n- ■ 写时复制 (COW)\n- ■ 引用计数\n- ■ 引用链接\n- ■ 破坏性拷贝\n\
  \n在学习 C++ 库提供的智能指针 `std::unique_ptr` 之前，让我们简单查看一下这些策略。\n\n### 深拷贝\n\n在实现深拷贝的智能指针中，每个智能指针实例都持有对象的完整拷贝。每当智能指针被拷贝时，指向的对象也会被拷贝。当智能指针离开作用域时，它会释放指向的内存（通过析构函数）。\n\
  \n虽然深拷贝智能指针在按值传递时看起来用，但在处理多态对象时，其优势变得显而易见，它可以避免切片，如下：\n\n```\n// 按值传递时切片的示例\n//\
  \ Fish 是 Tuna 和 Carp 的基类，Fish::Swim() 是虚函数\nvoid MakeFishSwim(Fish aFish)    //\
  \ 注意参数类型\n{\n    aFish.Swim(); // 虚函数\n}\n\n// ... 函数\nCarp freshWaterFish;\nMakeFishSwim(freshWaterFish);\
  \ // Carp 将被“切片”为 Fish\n```\n\n点击此处查看代码图像\n\n你可以通过选择深拷贝智能指针来解决切片问题，如列表 26.2 所示。\n\
  \n### 输入 ▼\n\n列表 26.2 使用深拷贝智能指针按类型传递多态对象\n\n```\n 0: template <typename T>\n 1:\
  \ class deepcopy_smart_pointer\n 2: {\n 3: private:\n 4:     T* object;\n 5: public:\n\
  \ 6:     //... 其他函数\n 7:\n 8:     // 深拷贝指针的拷贝构造函数\n 9:     deepcopy_smart_pointer(const\
  \ deepcopy_smart_pointer& source)\n 10:     {\n 11:         // Clone() 是虚函数：确保派生类对象的深拷贝\n\
  \ 12:         object = source->Clone();\n 13:     }\n 14:\n 15:     // 拷贝赋值运算符\n\
  \ 16:     deepcopy_smart_pointer& operator=(const deepcopy_smart_pointer& source)\n\
  \ 17:     {\n 18:       if(object)\n 19:          delete object;\n 20:\n 21:   \
  \    object = source->Clone();\n 22:     }\n 23: };\n```\n\n点击此处查看代码图像\n\n### 输出\
  \ ▼\n\n此代码段不产生输出。\n\n### 分析 ▼\n\n可见，`deepcopy_smart_pointer` 在第 9 到 13 行实现了一个拷贝构造函数，通过\
  \ `Clone()` 函数实现了对多态对象的深拷贝，该类需要实现该函数。同样，它在第 16 到 22 行实现了一个拷贝赋值运算符。为了简单起见，我们在这个示例中假设基类\
  \ `Fish` 实现的虚函数名为 `Clone()`。\n\n因此，智能指针按基类类型 `Fish` 传递的。\n\n\n\n\n\n```\ndeepcopy_smart_ptr<Carp>\
  \ freshWaterFish(new Carp);\nMakeFishSwim(freshWaterFish);  // Carp 不会被“切片”\n```\n\
  \n点击此处查看代码图像\n\n智能指针构造函数中实现的深拷贝会起作用，确保所传递的对象不会被切片，即使在语法上，目标函数 `MakeFishSwim()` 只需要该对象的基类部分。\n\
  \n深拷贝机制的缺点是性能。对于某些应用来说，这可能不是因素，但对于许多其他应用，它可能会阻碍程序员在程序中使用智能指针。相反，程序员可能会简单地将基类型指针（常规指针，`Fish*`）传递给\
  \ `MakeFishSwim()` 等函数。其他指针类型尝试通过各种方式来解决这个性能问题。\n\n### 写时复制 (Copy on Write)\n\n\
  `写时复制`（俗称为 `COW`）是一种机制，它通过在第一次尝试向对象写入之前共享指针，来尝试优化深拷贝智能指针的性能。在第一次尝试调用非 `const` 函数时，COW\
  \ 指针通常会为该非 `const` 函数调用的对象创建一个副本，而指针的其他实例则继续共享源对象。\n\nCOW 有许多拥护者。对于那些坚信 COW 的人来说，在它们的\
  \ `const` 和非 `const` 版本中实现 `*` 和 `->` 运算符是 COW 指针功能的关键。后者会创建一个副本。\n\n**提示**\n\n\
  当你选择遵循 COW 哲学的指针实现时，请务必在在使用该实现之前确保你已理解其实现细节。否则，你可能会陷入拷贝太少或拷贝过多的境地。\n\n### 引用计数智能指针\n\
  \n引用计数是一种记录对象用户数量的机制。当计数减到零时，对象会被释放。引用计数是一种用于共享对象而无需进行复制的极佳机制。\n\n此类智能指针在被复制时，需要增加涉及对象的引用计数。至少有两种流行的方法来维护这种计数：\n\
  \n-   在所指向的对象内部维护引用计数\n-   由指针类在共享对象控制块中维护引用计数\n\n第一种变体（将引用计数维护在对象中）被称为`侵入式引用计数`，因为该对象需要被修改。在这种情况下，对象负责维护、增加并向任何管理它的智能指针类提供引用计数。第二种变体（将引用计数维护在共享对象中）是一种机制，智能指针类可以将引用计数保留在自由存储上（例如一个动态分配的整数），并在复制时，拷贝构造函数会增加此值。\n\
  \n引用计数机制要求你仅使用智能指针，且不依赖于任何原始指针拷贝。指向由引用计数智能指针管理的对象的原始指针在智能指针释放对象时可能会导致问题。原始指针将继续指向不再有效的的内存部分。同样，引用计数也会导致其特定场景下的特殊问题：两个互相持有指针的对象永远不会被释放，因为它们的循环依赖关系将它们的引用计数保持在至少\
  \ 1。\n\n**提示**\n\n`std::shared_ptr` 是一种流行的引用计数智能指针，它保留了对指向对象（即被管理对象）的共享所有权。`std::weak_ptr`\
  \ 通常与 `shared_ptr` 配合使用。`weak_ptr` 持有对对象的弱引用——也就是说，它可以用于查看对象，但不能执行需要所有权的操作。因此，通过\
  \ `weak_ptr` 观察的对象可能会被其他人删除。要获得对象的临时所有权，必须先将 `weak_ptr` 转换为 `shared_ptr`。\n\n###\
  \ 引用链接智能指针\n\n`引用链接`（Reference-linked）智能指针是不主动计算使用对象的引用数量的智能指针；它们只需要知道数量何时变为零，以便释放对象。\n\
  \n这些智能指针被称为`引用链接`，是因为它们的实现基于双向链表。当你通过复制现有的智能指针来创建一个新的智能指针时，该拷贝会被添加到列表中。当智能指针超出作用范围或被销毁时，析构函数会将该智能指针从列表中取消索引。引用链接也会受到影响引用计数指针的循环依赖问题的影响。\n\
  \n### 破坏性拷贝 (Destructive Copy)\n\n`破坏性拷贝` 是一种机制，智能指针在复制时，会将处理的对象的完整所有权转移给目标，并重置自己：\n\
  \n```\ndestructive_copy_smartptr<SampleClass> smartPtr(new SampleClass());\n\nSomeFunc(smartPtr);\
  \    // 所有权已转移给 SomeFunc\n// 在调用者中不要再使用 smartPtr 了！\n```\n\n点击此处查看代码图像\n\n这种机制用起来显然并不直观。然而，破坏性拷贝智能指针提供的优势是，它们确保在任何时刻，只有一个活动指针指向对象。因此，破坏性拷贝是从函数返回指针的良好机制，你可以利用智能指针的“破坏性”属性来让自己有利。\n\
  \n破坏性拷贝指针的实现与其他指针的实现不同，如列表 26.3 所示。\n\n**注意**\n\n`std::auto_ptr` 是迄为止最流行的（取决于你怎么看，可能是最臭名昭著的）遵循这种原则的指针。它在传递给函数或拷贝到另一个指针后就失效了。`std::auto_ptr`\
  \ 在 C++11 中被弃用。请使用 `std::unique_ptr`。\n\n### 输入\n\n列表 26.3 破坏性拷贝智能指针\n\n```\n 0:\
  \ template <typename T>\n 1: class destructivecopy_ptr\n 2: {\n 3: private:\n 4:\
  \    T* object;\n 5: public:\n 6:    destructivecopy_ptr(T* input):object(input)\
  \ {}\n 7:    ~destructivecopy_ptr() { delete object; }\n 8:\n 9:    // 拷贝构造函数\n\
  \ 10:    destructivecopy_ptr(destructivecopy_ptr& source)\n 11:    {\n 12:     \
  \  // 拷贝时获取所有权\n 13:       object = source.object;\n 14:\n 15:       // 销毁源\n 16:\
  \       source.object = 0;\n 17:    }\n 18:\n 19:    // 拷贝赋值运算符\n 20:    destructivecopy_ptr&\
  \ operator=(destructivecopy_ptr& source)\n 21:    {\n 22:       if(object != source.object)\n\
  \ 23:       {\n 24:          delete object;\n 25:          object = source.object;\n\
  \ 26:          source.object = 0;\n 27:       }\n 28:    }\n 29: };\n 30:\n 31:\
  \ int main()\n 32: {\n 33:    destructivecopy_ptr<int> num(new int);\n 34:    destructivecopy_ptr<int>\
  \ copy = num;\n 35:\n 36:    // num 现在是无效的\n 37:    return 0;\n 38: }\n```\n\n点击此处查看代码图像\n\
  \n##### 输出 ▼\n\n此代码段没有输出。\n\n##### 分析 ▼\n\n列表 26.3 展示了破坏性拷贝智能指针的实现。\n\n\n\n\n如 Listing\
  \ 26.3 所示，对于实现破坏性拷贝（destructive-copy）智能指针至关重要的拷贝构造函数和拷贝赋值运算符也引起了许多批评。与大多数 C++ 类不同，该智能指针类不能让拷贝构造函数和赋值运算符接受\
  \ `const` 引用，因为它在拷贝后需要使源对象失效。这偏离了传统的拷贝构造函数和赋值运算符的语义，也使得该智能指针类的使用违背直觉。很少程序员期望在拷贝或赋值步骤后拷贝源或赋值源会被损坏。这种智能指针会销毁源的事实也使得它们不适用于\
  \ `std::vector` 等 STL 容器，或任何你可能使用的其他动态集合类。这些容器需要在内部拷贝你的内容，并最终导致指针失效。\n\n因此，出于多个原因，建议你在程序中避免使用破坏性拷贝智能指针。\n\
  \n### Tip\n\n使用 `std::unique_ptr` 代替已弃用的 `std::auto_ptr`。但请注意，由于 `std::unique_ptr`\
  \ 有私有的拷贝构造函数和拷贝赋值运算符，它不能通过值传递。它只能作为引用参数传递。\n\n### 使用 `std::unique_ptr`\n\n`std::unique_ptr`\
  \ 在 C++11 中引入，它与 `auto_ptr` 的不同之处在于它不允许拷贝或赋值。\n\n### Tip\n\n要使用类 `std::unique_ptr`，请包含此头文件：\n\
  \n```cpp\n#include<memory>\n```\n\n`unique_ptr` 是一个简单的智能指针，类似于 Listing 26.1 所示，但具有显式删除（即禁用）的拷贝构造函数和赋值运算符。因此，当通过值传递或赋值作为函数参数传递时，无法创建拷贝。Listing\
  \ 26.4 演示了 `unique_ptr` 的用法。\n\n#### Input ▼\n\nListing 26.4 使用 `std::unique_ptr`\n\
  \n```cpp\n 0: #include<iostream>\n 1: #include<memory>  // 此头文件以使用 std::unique_ptr\n\
  \ 2: using namespace std;\n 3:\n 4: class Fish\n 5: {\n 6: public:\n 7:     Fish()\
  \ {cout << \"Fish: Constructed!\" << endl;}\n 8:     ~Fish() {cout << \"Fish: Destructed!\"\
  \ << endl;}\n 9:\n10:     void Swim() const {cout << \"Fish swims in water\" <<\
  \ endl;}\n 11: };\n 12:\n 13: void MakeFishSwim(const unique_ptr<Fish>& inFish)\n\
  \ 14: {\n 15:    inFish->Swim();\n 16: }\n 17:\n 18: int main()\n 19: {\n 20:  \
  \  unique_ptr<Fish> smartFish(new Fish);\n 21:\n 22:    smartFish->Swim();\n 23:\
  \    MakeFishSwim(smartFish); // OK，因为 MakeFishSwim 接受引用\n 24:\n 25:    unique_ptr<Fish>\
  \ copySmartFish;\n 26:    // copySmartFish = smartFish; // 错误：operator= 已禁用\n 27:\n\
  \ 28:    return 0;\n 29: }\n```\n\n点击此处查看代码图像\n\n#### Output ▼\n\n```\nFish: Constructed!\n\
  Fish swims in watersw\nFish swims in water\nFish: Destructed!\n```\n\n点击此处查看代码图像\n\
  \n#### Analysis ▼\n\n遵循构造和析构序列，这在输出中是的。注意，尽管 `smartFish` 指向的对象在 `main()` 中被构造（正如预期的那样），即使你没有调用\
  \ `delete` 运算符，它也会被销毁（并自动完成）。这是 `unique_ptr` 的行为：超出作用域的指针通过析构函数自动释放对象。注意第 23 行，你如何将\
  \ `smartFish` 作为参数传递给 `MakeFishSwim()`。这不是一个拷贝步骤，因为如第 13 行所示，`MakeFishSwim()` 通过引用接受参数。如果你从第\
  \ 13 行删除引用符号 `&`，你将立即遇到由私有拷贝构造函数引起的编译错误。同样，如第 26 行所示，将一个 `unique_ptr` 对象赋值给另一个对象由于私有的拷贝赋值运算符是不被允许的。\n\
  \n简而言之，`unique_ptr` 使用比 `auto_ptr` 更安全，因为它在拷贝或赋值期间不会使源智能指针对象失效。然而，它通过在析构时释放对象来实现简单的内存管理。\n\
  \n### Tip\n\nListing 26.4 演示了 `unique_ptr` 不支持拷贝：\n\n```cpp\ncopySmartFish = smartFish;\
  \ // 错误：operator= 是 private\n```\n\n点击此处查看代码图像\n\n但是，它支持移动语义。因此，可行的方案是：\n\n```cpp\n\
  unique_ptr<Fish> sameFish(std::move(smartFish));\n// smartFish 现在是空的\n```\n\n\n\n\
  \n**A** 不，不是的。字符串类通常不实现 `*` 和 `->` 运算符，因此不能归类为智能指针。\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查附\
