  15: {\n16:    vector<int> numsInVec{232, 5, -98, -3, 5, 0, 987};\n17:\n18:    cout\
  \ << \"The initial contents of vector:\\n\";\n19:    DisplayContents(numsInVec);\n\
  20:\n21:    replace(numsInVec.begin(), numsInVec.end(), 5, 8);\n22:    cout << \"\
  After replacing value 5 by 8\\n\";\n23:    DisplayContents(numsInVec);\n24:\n25:\
  \    replace_if(numsInVec.begin(), numsInVec.end(),\n26:        [](int element)\
  \ {return((element % 2) == 0); }, -1);\n27:    cout << \"After replacing even values\
  \ by -1:\\n\";\n28:    DisplayContents(numsInVec);\n29:\n30:    return 0;\n31: }\n\
  ```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nThe initial contents of vector:\n232 5 -98\
  \ -3 5 0 987\nAfter replacing value 5 by 8\n232 8 -98 -3 8 0 987\nAfter replacing\
  \ even values by -1:\n-1 -1 -1 -3 -1 -1 987\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n此示例创建了一个带有初始值的\
  \ `vector<int>`容器。第 21 行演示了使用 `replace()` 将所有的 `5` 替换为 `8`。第 25 行演示了使用带有识别偶数的谓词\
  \ `replace_if()`。如输出所示，每个偶数都被替换为 `-1`。\n\n#### 在排序集合中排序和搜索以及删除重复项\n\n排序和搜索排序范围是实际应用中常见的需求。通常你有一组需要排序的信息数组，例如为了演示。你可以使用\
  \ STL 的 `sort()` 算法对容器进行排序：\n\n```cpp\nsort(numsInVec.begin(), numsInVec.end());\
  \ // 升序\n```\n\n点击此处查看代码图像\n\n此版本的 `sort()` 使用 `std::less<>` 作为默认二元谓词，它使用向量中类型实现的\
  \ `<` 运算符。你可以提供自己的谓词，使用重载版本更改排序顺序：\n\n```cpp\nsort(numsInVec.begin(), numsInVec.end(),\n\
  \    [](int lhs, int rhs) {return (lhs > rhs);} ); // 降序\n```\n\n点击此处查看代码图像\n\n\
  同样，在显示集合之前需要删除重复项。要移除相邻的重复值，你使用算法 `unique()`：\n\n\n\n\n\n```cpp\nauto newEnd = unique(numsInVec.begin(),\
  \ numsInVec.end());\nnumsInVec.erase(newEnd, numsInVec.end());  // 调整大小\n```\n\n\
  点击此处查看代码图像\n\n要在排序后的容器中进行搜索，你使用 `binary_search()`：\n\n```cpp\nbool elementFound\
  \ = binary_search(numsInVec.begin(), numsInVec.end(), 2021);\n\nif(elementFound)\n\
  \   cout << \"Element found in the vector!\" << endl;\n```\n\n点击此处查看代码图像\n\nListing\
  \ 23.10 展示了 STL 算法 `std::sort()`，它可以对范围进行排序；`std::binary_search()`，它可以搜索已排序的范围；以及\
  \ `std::unique()`，它可以消除相邻的重复元素（这些元素在执行 `sort()` 操作后变得相邻）。\n\n### Input ▼\n\nListing\
  \ 23.10 使用 `sort()`、`binary_search()` 和 `unique()`\n\n```cpp\n 0: #include<algorithm>\n\
  \ 1: #include<vector>\n 2: #include<string>\n 3: #include<iostream>\n 4: using namespace\
  \ std;\n 5:\n 6: template <typename T>\n 7: void DisplayContents(const T& container)\n\
  \ 8: {\n 9:    for_each(container.begin(), container.end(),\n10:       [](const\
  \ auto& element) {cout << element << ' '; });\n11: }\n12:\n13: int main()\n14: {\n\
  15:    vector<string> names{\"John\", \"jack\", \"sean\", \"Anna\"};\n16:\n17: \
  \   // 插入一个重复元素\n18:    names.push_back(\"jack\");\n19:\n20:    cout << \"The initial\
  \ contents of the vector are:\\n\";\n21:    DisplayContents(names);\n22:\n23:  \
  \  cout << \"\\nThe sorted vector contains names in the order:\\n\";\n24:    sort(names.begin(),\
  \ names.end());\n25:    DisplayContents(names);\n26:\n27:    cout << \"\\nSearching\
  \ for \\\"John\\\" using 'binary_search':\\n\";\n28:    bool found = binary_search(names.begin(),\
