  #### 使用 cout 对齐文本并设置字段宽\n\n你可以使用 `setw()` 等操纵符以字符设置字段宽度。然后对流的任何插入都是右对齐。同样，你可以使用\
  \ `setfill()` 确定在这种情况下填充空白区域的字符，如 Listing 27.3 所示。\n\n### 输入 ▼\n\nListing 27.3 通过\
  \ `setw()` 设置字段宽和使用 `setfill()` 操纵符填充字符\n\n```\n 0: #include<iostream>\n 1: #include<iomanip>\n\
  \ 2: using namespace std;\n 3:\n 4: int main()\n 5: {\n 6:    cout << \"Hey - default!\"\
  \ << endl;\n 7:\n 8:    cout << setw(35);  // 设置字段宽为 25 列\n 9:    cout << \"Hey\
  \ - right aligned!\" << endl;\n 10:\n 11:    cout << setw(35) << setfill('*');\n\
  \ 12:    cout << \"Hey - right aligned!\" << endl;\n 13:\n 14:    cout << \"Hey\
  \ - back to default!\" << endl;\n 15:\n 16:    return 0;\n 17: }\n```\n\n点击此处查看代码图像\n\
