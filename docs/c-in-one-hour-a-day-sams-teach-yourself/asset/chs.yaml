  \ \";\n 22:    DisplayContents(msetInts);\n 23:\n 24:    cout << \"Enter a number\
  \ to erase from the set: \";\n 25:    int input = 0;\n 26:    cin >> input;\n 27:\n\
  \ 28:    cout << \"Erasing \" << msetInts.count(input);\n 29:    cout << \" instances\
  \ of value \" << input << endl;\n 31:\n 32:    msetInts.erase(input);\n 33:\n 34:\
  \    cout << \"multiset now contains \" << msetInts.size() << \" elements: \";\n\
  \ 35:    DisplayContents(msetInts);\n 36:\n 37:    return 0;\n 38: }\n```\n\n点击此处查看代码图像\n\
  \n#### 输出 ▼\n```\nmultiset contains 5 elements: -1 43 78 78 124\nEnter a number\
  \ to erase from the set: 78\nErasing 2 instances of value 78\nmultiset now contains\
  \ 3 elements: -1 43 124\n```\n\n点击此处查看代码图像\n\n#### 分析 ▼\n注意第 15 行中 `typedef` 的用法。第\
  \ 28 行演示了使用 `count()` 来确定具有特定值的元素数量。实际的删除发生在第 31 行，它删除了所有匹配用户输入的特定数字的元素。\n\n###\
  \ 提示\n成员函数 `erase()` 是重载的。当使用值调用（如 列表 19.4 所示）时，它会删除所有等于该元素。当使用迭代器调用时（例如由 `find()`\
  \ 操作返回的迭代器），它会删除那一个元素，如下：\n\n```\nMSETINT::iterator elementFound = msetInts.\nfind(numberToErase);\n\
  \nif(elementFound != msetInts.end())\n   msetInts.erase(elementFound);\n\nelse\n\
  \   cout << “Element not found!” << endl;\n```\n\n点击此处查看代码图像\n\n你还可以使用 `erase()`\
