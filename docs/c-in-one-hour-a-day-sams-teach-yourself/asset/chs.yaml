  \ 9 9 9\nThe contents of the sample list are:\n-1 42 10101\nsearch() for the contents\
  \ of list in vector:\nSequence in list found in vector at position: 2\nSearching\
  \ {9, 9, 9} in vector using search_n():\nSequence {9, 9, 9} found in vector at position:\
  \ 5\n```\n\n点击此处查看代码图像\n\n### 分析\n\n此示例从两个容器——一个 `vector` 和一个 `list` 开始，它们最初被填充了示例值。`search()`\
  \ 用于在 `vector` 中查找列表的内容，如第 29 行所示。因为你想在整个 `vector` 中查找整个列表，所以你提供了一个范围，如第 30 到 32\
  \ 行所示。`search_n()` 在范围内查找连续 `n` 次指定值的首次出现。这两个函数都返回一个指向找到的模式第一个实例的迭代器，在使用该迭代器之前需要将其与\
  \ `end()` 进行比较。\n\n#### 初始化集合元素\n\n`fill()` 和 `fill_n()` 有助于设置范围。`fill()` 填充整个范围内的给定值。`fill_n()`\
  \ 则从起始位置重新赋值 `n` 个项。正如名称所示，`fill_n()` 需要起始位置、计数和值。代码列表 23.4 展示了这些算法如何轻松地初始化 `vector<int>`。\n\
  \n\n\n\n\n列表 23.4 使用 `fill()` 和 `fill_n()` 函数将容器的内容初始化为两组不同的值，如第 12 行和第 18 行所示。注意第\
  \ 15 行中 `resize()` 函数的使用。你用它为总共六个元素创建了空间。这三个新元素随后在第 18 行使用 `fill_n()` 填充值 `-9`。`fill()`\
  \ 算法作用于整个范围，而 `fill_n()` 也可以作用于部分范围。\n\n### 提示\n\n你可能已经注意到列表 23.1、23.2 和 23.3 中的代码使用了常量版本的迭代器；即在定义访问容器的元素的边界时使用了\
  \ `cbegin()` 和 `cend()`。然而，列表 23.4 通过使用 `begin()` 和 `end()` 偏离了这一点。这仅仅是因为算法 `fill()`\
  \ 的目的是修改容器中的元素，而这无法通过不允许更改其所指向元素变化的常量迭代器来实现。\n\n使用常量迭代器是一种良好的编程习惯，但当你需要修改它们所指向的元素时，可以偏离这一做法。\n\
  \n### 使用 `std::generate()` 将元素初始化为运行时生成的值\n\n正如 `fill()` 和 `fill_n()` 函数向集合中填充特定值一样，STL\
  \ 算法（如 `generate()` 和 `generate_n()`）被用于使用一元函数返回的值来初始化集合。\n\n你可以使用 `generate()`\
  \ 使用生成器函数的返回值来填充一个范围：\n\n```\ngenerate(numsInVec.begin(), numsInVec.end(),    //\
  \ range\n         rand);    // 生成器函数，返回随机值\n```\n\n点击此处查看代码图像\n\n`generate_n()`\
  \ 与 `generate()` 相似，不同在于你提供要赋值的元素数量，而不是范围的结束边界：\n\n```\ngenerate_n(numsInList.begin(),\
  \ 5, rand);\n```\n\n点击此处查看代码图像\n\n因此，你可以使用这两个算法将容器的内容初始化为文件内容（例如）或随机值，如列表 23.5 所示。\n\
  \n#### 输入 ▼\n\n列表 23.5 使用 `generate()` 和 `generate_n()` 将集合初始化为随机值\n\n```\n 0: #include<algorithm>\n\
  \ 1: #include<vector>\n 2: #include<list>\n 3: #include<iostream>\n 4: #include<ctime>\n\
  \ 5:\n 6: int main()\n 7: {\n 8:     using namespace std;\n 9:     srand(static_cast<int>(time(NULL)));\
  \ // 设置随机数生成器种子\n10:\n11:     vector<int> numsInVec(5);\n12:     generate(numsInVec.begin(),\
  \ numsInVec.end(),    // range\n13:                rand);    // 生成器函数\n14:\n15:\
  \     cout << \"Elements in the vector are: \";\n16:     for(size_t index = 0; index\
  \ < numsInVec.size(); ++ index)\n17:         cout << numsInVec [index] << \" \"\
  ;\n18:     cout << endl;\n19:\n20:     list<int> numsInList(5);\n21:     generate_n(numsInList.begin(),\
  \ 3, rand);\n22:\n23:     cout << \"Elements in the list are: \";\n24:     for(auto\
  \ element = numsInList.begin();\n25:         element != numsInList.end();\n26: \
  \        ++ element)\n27:         cout << *element << ' ';\n28:\n29:     return\
