  \n\n\n\n\n- `std::forward_list`: 与 `std::list` 类似，但它是一个单向链表，允许你只向一个方向进行迭代。\n\nSTL\
  \ `vector` 类类似于数组，允许对元素进行随机访问；也就是说，给定位置（索引），你可以使用下标运算符（`[]`）直接访问或操作 `vector` 中的元素。此外，`vector`\
  \ 是一个动态数组，因此它可以调整自身的大小以适应应用程序的运行时需求。为了保持在给定位置位置时能随机访问数组中元素的属性，大多数 `vector` 的实现都将所有元素存储在连续的内存中。因此，如果\
  \ `vector` 需要调整大小，取决于它所包含的对象类型，可能会降低应用程序的性能。第 4 节“管理数组和字符串”在列表 4.4 中简要地向你介绍了 `vector`。该容器在第\
  \ 17 节“STL 动态数组类”中得到了详细讨论。\n\n你可以将 STL `list` 视为 STL 对普通链表的实现。虽然 `list` 中的元素不能像\
  \ `vector` 那样进行随机访问，但 `list` 可以将元素组织在非连续的内存区域。因此，`std::list` 不会受到 `vector` 需要重新分配内部数组时可能出现的性能问题的影响。STL\
  \ `list` 类在第 18 节“STL `list` 和 `forward_list`”中得到了详细讨论。\n\n### 关联容器\n\n*关联容器*是按排序顺序存储元素的容器——类似于字典。这导致了较慢插入速度，但在搜索方面具有显著优势。\n\
  \nSTL 提供的关联容器有：\n\n- `std::set`: 在具有对数时间复杂度的容器中，在插入时对唯一值进行排序存储。\n- `std::unordered_set`:\
  \ 在具有接近常数时间复杂度的容器中，在插入时对唯一值进行存储。\n- `std::map`: 在具有对数时间复杂度的容器中，根据其唯一键对键/值对进行排序。\n\
  - `std::unordered_map`: 在具有接近常数时间复杂度的容器中，根据其唯一键对键/值对进行存储。\n- `std::multiset`: 类似于\
  \ `set`，并且支持存储多个具有相同值的项；也就是说值不需要唯一。\n- `std::unordered_multiset`: 类似于 `unordered_set`，并且支持存储多个具有相同值的项；也就是说值不需要唯一。具有常数时间复杂度。\n\
  - `std::multimap`: 类似于 `map`，并且支持存储键不需要唯一的键/值对。\n- `std::unordered_multimap`: 类似于\
  \ `unordered_map`，并且支持存储键不需要唯一的键/值对。具有常数时间复杂度。\n\n### 注意\n\n在这种情况下，*复杂度*是指容器相对于其所包含的元素数量的性能指标。因此，当我们谈论*常数时间复杂度*（如\
  \ `std::unordered_map`）时，我们的意思是容器的性能与它所包含的元素数量无关。这样的容器处理一千个元素所需的时间与处理百万个元素所需的时间是相同的。\n\
  \n*对数复杂度*（如 `std::map`）表示性能与容器中所包含元素数量的对数成正比。这样的容器处理百万个元素的时间将是处理一千个元素的两倍。\n\n*线性复杂度*意味着性能与元素数量成正比。这样的容器处理百万个元素的时间将是处理一千个元素的一千倍。\n\
  \n对于给定的容器，不同操作的复杂度可能是不同的。例如，元素的插入复杂度可能是常数级的，而搜索复杂度可能是线性的。因此，除了了解容器将用于什么功能外，了解它的表现也是选择正确容器的关键。\n\
  \nSTL 容器的排序标准可以通过编程谓词函数进行自定义。\n\n### 提示\n\n某些 STL 实现还提供了关联容器，如 `hash_set`、`hash_multiset`、`hash_map`\
  \ 和 `hash_multimap`。这些与 C++ 标准支持的 `unordered_*` 容器相似。在某些情况下，`hash_*` 和 `unordered_*`\
  \ 变体可能更擅搜索，因为它们提供了常数操作（独立于容器中的元素数量）。通常，这些容器还提供与对应的标准版本相同的公共方法，因此同样易于使用。\n\n使用符合标准的变体将使代码更容易在平台和编译器之间迁移，因此应优先考虑使用。此外，符合标准的容器的性能对数级下降可能不会显著影响应用程序。\n\
  \n### 容器适配器\n\n*容器适配器*是顺序容器和关联容器的变体，它们功能有限，旨在满足特定目的。主要的适配器类有：\n\n- `std::stack`:\
  \ 以 LIFO（后进先出）顺序存储元素，允许在顶部插入（push）和移除（pop）元素。\n- `std::queue`: 以 FIFO（先进先出）顺序存储元素，允许按照插入的顺序移除元素。\n\
  - `std::priority_queue`: 以排序顺序存储元素，使得值评估为最高的元素始终位于队列最前面。\n\n这些容器在第 24 节“自适应容器：栈和队列”中进行了详细讨论。\n\
  \n### STL 迭代器\n\n迭代器最简单的例子是指针。给定指向数组第一个元素的指针，你可以递增它以指向下一个元素，或者在很多情况下，操作该位置的元素。\n\
  \n迭代器也是模板类。将它们视为指针的泛化。这些模板类为程序员提供了一个句柄，通过它可以处理 STL 容器中的元素并对其执行操作。STL 以模板函数的形式提供了一些称为*算法*的操作。因此，迭代器构成了算法与其所操作的容器之间的连接桥梁。\n\
  \nSTL 提供的迭代器大致可分为以下几类：\n\n- `Input iterator`（输入迭代器）：这是一种可以解引用以引用对象的迭代器。例如，该对象可以是集合中的元素。最严格类型的输入迭代器保证只读访问。\n\
  - `Output iterator`（输出迭代器）：这是一种允许程序员更改集合内容的迭代器。最严格类型的输出迭代器保证只写访问。\n\n上述基础迭代器类型进一步细化为以下类别：\n\
  \n- `Forward iterator`（正向迭代器）：这种迭代器是输入和输出迭代器的细化，允许同时输入和输出。正向迭代器可以是常量，允许对迭代器指向的对象进行只读访问，否则允许进行读写操作，使其变为可变。正向迭代器通常用于单向链表。\n\
  - `Bidirectional iterator`（双向迭代器）：这种迭代器是正向迭代器的细化，它可以通过递减向后移动。双向迭代器通常用于双向链表。\n\n\n\
  \n\n\n-   **随机访问迭代器：** 通常而言，这种迭代器是双向迭代器的细化，允许对偏移量加减，或者允许一个迭代器减去另一个迭代器，以找到集合中两个对象之间的相对间隔或距离。随机迭代器通常用于数组。\n\
  \n### 备注\n在实现层面，`refinement`（细化）可以被视为 `inheritance`（继承）或 `specialization`（特化）。\n\
  \n### STL 算法\n\n查找、排序、反转等是标准的编程需求，不应该每个应用程序都重复编写。这正是为什么 STL 以 STL 算法的形式提供了这些函数，这些算法通过迭代器与容器良好配合，帮助程序员处理一些最常见的需求。\n\
  \n一些常用的 STL 算法包括：\n\n- `std::find:`: 帮助在集合中查找一个值。\n- `std::find_if:`: 帮助使用程序员提供的谓词在集合中查找一个值。\n\
  - `std::reverse:`: 反转集合。\n- `std::remove_if:`: 帮助使用程序员提供的谓词从集合中移除某个项。\n- `std::transform:`:\
  \ 帮助将程序员提供的转换函数应用于容器中的元素。\n\n这些算法是 `std` 命名空间中的模板函数，并且要求包含标准头文件 `<algorithm>`。\n\
  \n### 使用迭代器在容器与算法之间的交互\n\n让我们通过一个示例来看迭代器是如何无缝地连接容器和 STL 算法的。列表 15.1 所示的程序使用了 STL\
  \ 顺序容器 `std::vector`（类似于动态数组）来存储一些整数，然后使用 `std::find` 算法在集合中找到其中一个。注意，迭代器构成了连接容器与算法的桥梁。不必担心语法或功能的复杂性。`std::vector`\
  \ 等容器和 `std::find` 等算法分别在第 17 节“STL 动态数组类”和第 23 节“STL 算法”中讨论。如果你觉得这部分很复杂，可以暂时跳过本节，在阅读完那些节后再回来。\n\
  \n### 输入\n\n列表 15.1 在 Vector 中查找元素及其位置\n\n```\n 1: #include<iostream>\n 2: #include<vector>\n\
  \ 3: #include<algorithm>\n 4: using namespace std;\n 5:\n 6: int main ()\n 7: {\n\
  \ 8:    // 一个整数动态数组\n 9:    vector<int> intArray;\n10:\n11:    // 将示例整数插入数组\n12:\
  \    intArray.push_back(50);\n13:    intArray.push_back(2991);\n14:    intArray.push_back(23);\n\
  15:    intArray.push_back(9999);\n16:\n17:    cout < < \"The contents of the vector\
  \ are: \" < << endl;\n18:\n19:    // 使用迭代器遍历 vector 并读取值\n20:    vector<int>::iterator\
  \ arrIterator = intArray.begin();\n21:\n22:    while (arrIterator != intArray.end())\n\
  23:    {\n24:         // 将值写入屏幕\n25:        cout < < *arrIterator << < endl;\n26:\n\
  27:        // 增加迭代器以访问下一个元素\n28:        ++arrIterator;\n29:    }\n30:\n31:    //\
  \ 使用 'find' 算法查找元素（例如 2991）\n32:    vector<int>::iterator elFound = find(intArray.begin(),\n\
  33:                          intArray.end(), 2991);\n34:\n35:    // 检查是否找到了值\n36:\
  \    if (elFound != intArray.end())\n37:    {\n38:        // 使用 std::distance 确定元素的位置\n\
  39:        int elPos = distance(intArray.begin(), elFound);\n40:        cout < <<\
  \ \"Value \"< << *elFound;\n41:        cout < << \" found in the vector at position:\
  \ \" < << elPos << < endl;\n42:    }\n43:\n44:    return 0;\n45: }\n```\n\n点击此处查看代码图像\n\
  \n### 输出\n\n```\nThe contents of the vector are:\n50\n2991\n23\n9999\nValue 2991\
  \ found in the vector at position: 1\n```\n\n点击此处查看代码图像\n\n### 分析\n\n列表 15.1 阐了迭代器在遍历\
  \ `vector` 中的用法，并作为接口帮助将 `find()` 等算法与 `vector` 等包含算法本要操作数据的容器连接起来。迭代器对象 `arrIterator`\
  \ 在第 20 行声明，并通过解引用来访问值。`while` 循环一直持续到迭代器到达 `intArray.end()`。\n\n使用 `find` 算法来定位元素\
  \ `2991`。如果找到，则将 `elFound` 与 `intArray.end()` 进行比较。然后使用 `distance` 函数计算元素的位置。\n\n\
  #### 使用关键字 `auto` 允许编译器定义类型\n\n列表 15.1 显示了多个迭代器声明。它们看起来类似于：\n\n```cpp\n20:    vector<int>::iterator\
  \ arrIterator = intArray.begin();\n```\n\n点击此处查看代码图像\n\n这种迭代器类型定义看起来可能很吓，但你可以将此行简化为：\n\
  \n```cpp\n20:    auto arrIterator = intArray.begin(); // 编译器检测类型\n```\n\n点击此处查看代码图像\n\
  \n注意，定义为 `auto` 的变量需要初始化（取决于它所初始化值的类型）。\n\n### 选择合适的容器\n\n显然，一个应用程序可能有可以使用许多 STL\
  \ 容器实现的需求。需要进行选择，而且这种选择非常重要，因为选择不当可能会导致性能问题和扩展性瓶颈。因此，在选择容器之前，评估它们的优缺点是关重要的。详情请参阅表\
  \ 15.1。\n\n\n\n\n\n| 容器 | 特性 | 注意事项 |\n| :--- | :--- | :--- |\n| `std::list` | 在列表头部、中间或尾部插入为常数时间。从\
  \ `list` 中删除元素是常数时间操作，无论元素的位置如何。插入或删除元素不会使指向 `list` 中其他元素的迭代器失效。 | 无法像数组那样通过索引随机访问元素。\
  \ |\n| | | 访问元素的速度可能比 `vector` 慢，因为元素没有存储在相邻的内存位置。 |\n| | | 搜索时间与容器中元素的数量成正比。 |\n\
  | `std::forward_list` | 单链表类，仅允许单向迭代。 | 仅允许通过 `push_front()` 在列表头部插入。 |\n| **关联型容器**\
  \ | | |\n| `std::set` | 搜索速度与容器中元素的数量并非直接正比，而是与元素数量的对数成比，因此通常比顺序容器快得多。 | 插入元素的速度比对应的顺序容器慢，因为元素在插入时会排序。\
  \ |\n| `std::unordered_set` | 此类容器的搜索、插入和删除几乎与容器中元素的数量无关。 | 由于元素是弱序的，因此你不能依赖它们在容器中的相对位置。\
  \ |\n| `std::multiset` | 当集合需要包含非唯一值时，应使用它。 | 插入速度可能比顺序容器慢，因为元素（对）在插入时会排序。 |\n|\
  \ `std::unordered_multiset` | 当你也需要包含非唯一值时，应优先选择 `unordered_set`。性能与 `unordered_set`\
  \ 相似——即搜索、插入和删除元素的平均时间为常数级，与容器的大小无关。 | 元素是弱序的，因此你不能依赖它们在容器中的相对位置。 |\n| `std::map`\
  \ | 键值对容器，提供的搜索性能与容器中元素数量的对数成比，因此通常比顺序容器快得多。 | 元素（对）在插入时排序，因此插入速度会比对的顺序容器慢。 |\n\
  | `std::unordered_map` | 提供了近常数时间搜索、插入和删除元素的优势，与容器的大小无关。 | 元素是弱序的，因此不适用于对顺序很重要的情况。\
  \ |\n| `std::multimap` | 当需要一个持有非唯一键元素的键值对容器时，应选择 `std::map`。 | 元素的插入速度会比等效顺序容器慢，因为元素在插入时会排序。\
  \ |\n| `std::unordered_multimap` | 当你需要一个键可以非唯一的键值对容器时，应选择 `multimap`。 | 它是一类弱序容器，因此当你需要依赖元素的相对顺序时，无法使用它。\
  \ |\n| | 允许常数级平均时间插入、搜索和删除元素，与容器的大小无关。 | |\n\n**表 15.1** STL 容器类的属性\n\n### STL 字符串类\n\
  \nSTL 提供了一个专门为字符串操作设计的模板类。`std::basic_string<T>` 在两个模板特化版本中被广泛使用：\n\n* ■ `std::string`:\
  \ 基于 `char` 的 `std::basic_string` 特化版本，用于处理简单的字符字符串。\n* ■ `std::wstring`: 基于 `wchar_t`\
  \ 的 `std::basic_string` 特化版本，用于处理宽字符字符串，通常用于存储支持不同语言符号的 Unicode 字符。\n\n这个工具类在第 16\
  \ 节“STL 字符串类”中得到了详细讨论，你将看到它是如何让字符串的操作变得非常简单的。\n\n### 总结\n\n在本节中，你学习了 STL 容器、迭代器和算法的基础概念。你接触了\
  \ `basic_string<T>`，它将在后续课程中详细讨论。容器、迭代器和算法是 STL 中最重要的概念之一，彻底理解它们将帮助你在应用程序中高效地使用\
  \ STL。第 17 节 到 第 25 节 详细解释了这些概念的实现及其应用。\n\n### 问答\n\n**Q** 我需要使用数组。但我不知道需要包含多少元素。我应该使用哪种\
  \ STL 容器？\n\n**A** `std::vector` 或 `std::deque` 完美符合这一需求。它们都能管理内存并能够根据应用程序不断增加的需求动态调整大小。\n\
  \n**Q** 我的应用程序有频繁搜索的需求。我应该选择哪种容器？\n\n**A** 像 `std::map` 或 `std::set` 这样的关联容器或它们的无序变体适合涉及频繁搜索的需求。\n\
  \n**Q** 我需要存储键值对以便进行快速查找。然而，用例可能导致多个非唯一的键。我应该选择哪种容器？\n\n**A** 类型为 `std::multimap`\
  \ 的关联容器适合这一需求。`multimap` 可以持有非唯一的键值对，并能提供关联容器特有的快速查找功能。\n\n**Q** 一个应用程序需要在不同平台和编译器之间迁移。需要一种可以根据键进行快速查找的容器。我应该使用\
  \ `std::map` 还是 `hash_map`？\n\n**A** 可移植性是一个重要的限制，使用符合标准的容器是必要的。`hash_map` 不是 C++\
  \ 标准的一部分，因此可能在所有平台上都不受支持。请使用 `std::unordered_map`。\n\n### 工作坊\n\n工作坊包含练习题，有助于巩固你对材料的理解。在检查附录\
  \ E 中的答案之前，尝试回答这些题，并在进入下一节之前确保你已经理解了答案。\n\n### 测验\n\n1. 如果你需要一个可以在顶部和底部进行插入且包含数组的容器，你的选择是什么？\n\
  2. 你需要存储元素以进行快速查找。你会选择哪种容器？\n3. 你需要在 `std::set` 中存储元素，但仍需要根据不一定取决于元素值的条件来更改存储和查找标准。这可能吗？\n\
  4. STL 中的哪种特性被用于连接算法和容器？\n5. 在一个需要迁移到不同平台并使用不同 C++ 编译器构建的应用程序中，你会选择使用 `hash_set`\
  \ 容器吗？\n\n## 第 16 节\n\n## STL `string` 类\n\n标准模板库 (STL) 提供了一个辅助字符串操作和处理的容器类。`std::string`\
  \ 类不仅可以动态调整自身大小以满足应用程序的需求，还提供了实用的函数（即帮助处理字符串和使用字符串的方法）。因此，它能够帮助程序员在应用程序中使用标准、可移植且经过测试的功能，并专注于开发对应用程序至关重要的特性。\n\
  \n在本节中，你将学习\n\n\n\n* 为什么字符串处理类是必要的\n* 如何使用 STL `string` 类\n* STL 如何帮助你轻松地拼接、追加、查找和执行其他字符串操作\n\
  * 如何使用基于模板的 STL `string` 类\n* 自 C++14 起由 STL `string` 类支持的 `operator \"\"s`\n\n\n\
  \n\n\n### 字符串处理类的必要性\n\n在 C++ 中，字符串是一个字符数组。在第 4 节“管理数组和字符串”中，定义了一个简单的字符数组如下：\n\n\
  ```\nchar sayHello[] = {'H','e','l','l','o',' ','W','o','r','l','d','\\0'};\n```\n\
  \n点击此处查看代码图像\n\n`sayHello` 是一个固定长度（即静态长度）的字符数组（也称为字符串）的声明。如你所见，这个缓冲区可以存放有限长度的字符串；如果你尝试在其中存储更多的字符，它很快就会溢出。这种静态分配的数组是不可能调整大小。为了克服这一限制，C++\
  \ 提供了数据的动态分配。因此，字符串数组更具动态性的表示方式是：\n\n```\nchar* dynamicStr = new char[arrayLen];\n\
  ```\n\n点击此处查看代码图像\n\n`dynamicStr` 是一个动态分配的字符数组，它可以实例化为值 `arrayLen` 中存储的长度，该长度可以在运行时确定，因此它可以被分配来存储变长的数据。然而，如果你在运行时更改数组的长度，必须先释放已分配的内存，然后重新分配以存储所需的数据。\n\
  \n如果这些 `char*` 字符串被用作类的成员属性，情况就会变得复杂。将该类的对象赋值给另一个对象的情况，需要存在编写正确的赋值运算符和拷贝构造函数。如果缺少这些成员，那么该类的两个对象可能会包含指针的拷贝，本质上指向内存中的同一个\
  \ `char` 缓冲区。其中一个对象的析构会释放缓冲区，这会导致另一个对象中包含的指针失效。这将导致应用程序故障。\n\n字符串类为你解决了这些问题。STL\
  \ 字符串类——用于建模字符串的 `std::string` 和用于建模宽字符字符串的 `std::wstring` 通过以下方式帮助你：\n\n*   减少字符串创建和操作的额外工作\n\
  *   通过内部管理内存分配细节，增加所编写程序的稳定性\n*   具有拷贝构造函数和赋值运算符特性，能够自动确保成员字符串被正确复制\n*   提供实用的实用函数，帮助截断、查找和删除\n\
  *   提供有助于比较的运算符\n*   让你专注于应用程序的首要需求，而不是字符串处理的细节\n\n注意\n\n`std::string` 和 `std::wstring`\
  \ 实际上是同一个类的模板特化版本——分别是针对类型 `char` 和 `wchar_t` 的 `std::basic_string<T>`。当你学会了如何使用其中一个，就可以在另一个上使用相同的方法和运算符。\n\
  \n你很快就会学到 STL 字符串类提供的一些实用的辅助函数，以 `std::string` 为例。\n\n### 使用 STL `string` 类\n\n\
  最常用的字符串函数有：\n\n*   复制\n*   拼接\n*   查找字符和子串\n*   截断\n*   字符串反转和大小转换（通过标准库提供的算法实现）\n\
  \n提示\n\n要使用 `std::string` 类，请包含头文件：\n\n```cpp\n#include<string>\n```\n\n#### 实例化\
  \ STL `string` 类并进行拷贝\n\n`string` 类具有许多重载构造函数，因此可以用许多不同的方式进行实例化和初始化。例如，你可以简单地将常量字符字符串字面量初始化或赋值给普通的\
  \ STL `std::string` 对象：\n\n```cpp\nconst char* constCStyleString = \"Hello String!\"\
  ;\nstd::string strFromConst(constCStyleString);\n```\n\n点击此处查看代码图像\n\n或\n\n```cpp\n\
  std::string strFromConst = constCStyleString;\n```\n\n点击此处查看代码图像\n\n上述操作类似于：\n\n\
  ```cpp\nstd::string str2(\"Hello String!\");\n```\n\n点击此处查看代码图像\n\n很显然，实例化字符串对象并将其初始化为值不需要提供字符串的长度或内存分配细节；STL\
  \ 字符串类的构造函数会自动提供这些信息。\n\n同样，可以使用一个 `string` 对象初始化另一个：\n\n```cpp\nstd::string str2Copy(str2);\n\
  ```\n\n你还可以指示 `string` 构造函数只接受输入输入字符串的前 *n* 个字符：\n\n```cpp\n// 将字符串初始化为另一个字符串的前\
  \ 5 个字符\nstd::string strPartialCopy(constCStyleString, 5);\n```\n\n点击此处查看代码图像\n\n\
  你还可以初始化字符串以包含特定数量的特定字符：\n\n```cpp\n// 初始化字符串对象以包含 10 个 'a'\nstd::string strRepeatChars\
