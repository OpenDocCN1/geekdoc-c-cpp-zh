  \ `std::list` 排序；然而，在 `std::set` 的情况下，排序是在插入时发生的。正如此处输出所示，你不需要调用任何函数来确保集合中的元素是有序的，因为它们在插入时已经排序了，且该排序使用了第\
  \ 36 行到第 39 行实现的 `<` 运算符。你为用户删除条目的选项，第 63 行演示了调用 `find()` 来定位该条目，该条目在第 66 行使用 `erase()`\
  \ 被删除。\n\n### 提示\n此此电话目录的实现基于 STL 的 `set` 类，因此不允许包含多个具有相同值的条目。如果你需要的目录实现允许存储两个同名的人，则应该使用\
  \ STL 的 `multiset` 类。如果 `setContacts` 是一个 multiset，则 Listing 19.5 中的代码仍然可以正常工作。为了进一步利用\
  \ `multiset` 类存储多个相同值的能力，你可以使用 `count()` 成员函数来确定持有特定值的项数。\n\n### 使用 STL `set` 和\
  \ `multiset` 的优缺点\nSTL `set` 和 `multiset` 类在需要频繁查找的应用程序中具有显著优势，因为它们的内容是有序，因此在其中定位项更快。然而，为了提供这种优势，容器需要在插入时对元素进行排序。由于元素是有排序的，插入元素会有开销；如果你需要经常使用\
  \ `find()` 等功能和函数，这种开销可能是值得的折中。\n\n`find()` 利用了内部的二叉树结构。这种排序的二叉树结构导致了相对于 vector\
  \ 等顺序容器的另一个隐性劣势。在 vector 中，迭代器指向的元素（例如由 `std::find()` 操作返回的元素）可以被新值覆盖。但在 set 的情况下，元素由\
  \ `set` 类根据它们各自的值进行排序，因此永远不应该使用迭代器覆盖元素，即使这在程序逻辑上是可能的。\n\n### STL 哈希集合实现：`std::unordered_set`\
  \ 和 `std::unordered_multiset`\nSTL `std::set` 和 `std::multiset` 根据 `std::less<T>`\
  \ 或提供的谓词对元素（同时也是键）进行排序。在有序容器中搜索比在 vector 等未排序容器中搜索更快，且 `std::sort()` 提供了对数复杂度。这意味着在集合中查找元素所花费的时间与集合中元素数量并不直接正比；而是与元素数量的对数正比。因此，平均而言，在包含\
  \ 10,000 个元素的集合中搜索的时间是包含 100 个元素集合的两倍（因为 $100² = 10,000$，或者 $log(10000) = 2 \\times\
  \ log(100)$）。\n\n然而，相比未排序容器（搜索时间与元素数量直接正比），这种性能的剧剧提升有时是不够的。程序员和数学家都在寻求常数时间的插入和排序可能性，其中一种实现使用了基于哈希的实现，使用哈希函数来确定排序索引。插入哈希集合的元素首先由哈希函数评估，哈希函数生成一个唯一索引，该索引就是它们所处的*桶*（bucket）索引。\n\
  \nSTL 提供的哈希集合变体是容器类 `std::unordered_set`。\n\n### 提示\n要使用 STL `std::unordered_set`\
  \ 或 `std::unordered_multiset` 容器，请包含\n\n```cpp\n#include<unordered_set>\n```\n\n\
  该类的使用与使用 `std::set` 相比没有太大变化：\n\n```cpp\n// 实例化：\nunordered_set<int> usetInt;\n\n\
  // 插入一个元素\nusetInt.insert(1000);\n\n// find():\nauto elementFound = usetInt.find(1000);\n\
  \nif(elementFound != usetInt.end())\n   cout << *elementFound << endl;\n```\n\n\
  点击此处查看代码图像\n\n然而，`unordered_set` 的一个非常重要的特征是可以使用哈希函数，该函数负责决定排序顺序：\n\n```cpp\nunordered_set<int>::hasher\
  \ HFn = usetInt.hash_function();\n```\n\n点击此处查看代码图像\n\n使用 `std::unordered_set` 还是\
  \ `std::set` 的决定最好是在涉及与真实用法相似的操作和数据量的模拟中测量了相应容器的性能后做出的。Listing 19.6 演示了 `std::unordered_set`\
  \ 提供的一些常用方法。\n\n#### 输入 ▼\nListing 19.6 `std::unordered_set` 以及 `insert()`、`find()`、`size()`、`max_bucket_count()`、`load_factor()`\
