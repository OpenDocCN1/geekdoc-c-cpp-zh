  \ int>` 的模板实例化中被修改过，也会显示该值。仔细观察第 18 行到 34 行的特化代码可以发现，该版本在第 24 行声明了一个字符串成员——该成员在第\
  \ 3 行到 16 行 `HoldsPair<>` 的原始模板定义中是缺失的。事实上，原始模板定义是...\n\n\n\n```\ntemplate <typename\
  \ T1, typename T2, typename T3>\nvoid Sum(T1& result, T2 num1, T3 num2)\n{\n   result\
  \ = num1 + num2;\n   return;\n}\n```\n\n点击此处查看代码\n\n这个函数非常简单。然而，如果你需要编写一个能够加任意数量值（每个值都作为参数传递）的单一函数，你需要在定义此类函数时使用`变量模板`（variable\
  \ templates），也称为`变参模板`（variadic templates）。C++ 自 `C++14` 起已支持变参模板。列表 14.7 展示了如何在定义此类函数时使用变参模板。\n\
  \n### 输入 ▼\n\n列表 14.7 使用变参模板演示变参数的函数\n\n```\n 0: #include<iostream>\n 1: using namespace\
  \ std;\n 2:\n 3: template <typename Res, typename ValType>\n 4: void Sum(Res& result,\
  \ ValType& val)\n 5: {\n 6:    result = result + val;\n 7: }\n 8:\n 9: template\
  \ <typename Res, typename First, typename... Rest>\n10: void Sum(Res& result, First\
  \ val1, Rest... valN)\n 11: {\n 12:    result = result + val1;\n 13:    return Sum(result,\
  \ valN ...);\n 14: }\n 15:\n 16: int main()\n 17: {\n 18:    double dResult = 0;\n\
  \ 19:    Sum (dResult, 3.14, 4.56, 1.1111);\n 20:    cout << \"dResult = \" << dResult\
  \ << endl;\n 21:\n 22:    string strResult;\n 23:    Sum (strResult, \"Hello \"\
  , \"World\");\n 24:    cout << \"strResult = \" << strResult.c_str() << endl;\n\
  \ 25:\n 26:    return 0;\n 27: }\n```\n\n点击此处查看代码\n\n### 输出 ▼\n\n```\ndResult =\
  \ 8.8111\nstrResult = Hello World\n```\n\n点击此处查看代码\n\n### 分析 ▼\n\n此示例说明，你使用变参模板定义的函数\
  \ `Sum()` 不仅处理完全不同的参数类型（如第 19 行和第 23 行所示），还可以处理数量数量的参数。第 19 行调用的 `Sum()` 使用四个参数，而第\
  \ 23 行使用了三个参数，其中一个是 `std::string`，另外两个是 `const char*`。在编译期间，编译器实际上会创建合适的 `Sum()`\
  \ 代码以适应调用，并递归地执行此操作直到所有参数都被处理完毕。\n\n**注意**\n\n你可能注意到了列表 14.7 中使用了省略号 `...`。在模板中使用的省略号告诉编译器，该模板类或函数可以接受任意数量、任意类型的模板参数。\n\
  \n变参模板是 C++ 的一个强大扩展，可以应用于数学处理，也可以完成某些简单任务。使用变参模板的程序员可以避免实现多个重载版本函数的重复性工作；因此，它们使得创建更短、更易维护的代码成为可能。\n\
  \n**注意**\n\n你可以使用运算符 `sizeof...()` 来确定传递给变参模板调用的模板参数数量。在列表 14.7 中，你可以如下所示在 `Sum()`\
  \ 等函数内部使用该运算符：\n\n```\nint arrNums[sizeof...(Rest)];\n\n// 数组长度在编译时使用 sizeof...()\
  \ 进行评估\n```\n\n点击此处查看代码\n\n你不能将 `sizeof...()` 与 `sizeof(Type)` 混淆。后者返回类型的大小，而前者返回发送到变参模板的模板参数个数。\n\
  \n变参模板的支持也引入了对元组（tuples）的标准支持。`std::tuple` 是一个实现元组的类模板。它可以用不同数量的成员元素和类型进行实例化。这些元素可以使用标准库函数\
  \ `std::get` 分访问。列表 14.8 展示了 `std::tuple` 的实例化和使用。\n\n### 输入 ▼\n\n列表 14.8 实例化和使用\
  \ `std::tuple`\n\n```\n 0: #include<iostream>\n 1: #include<tuple>\n 2: #include<string>\n\
  \ 3: using namespace std;\n 4:\n 5: template <typename tupleType>\n 6: void DisplayTupleInfo(tupleType&\
  \ tup)\n 7: {\n 8:    const int numMembers = tuple_size<tupleType>::value;\n 9:\
  \    cout << \"Num elements in tuple: \" << numMembers << endl;\n10:    cout <<\
  \ \"Last element value: \" << get<numMembers - 1>(tup) << endl;\n11: }\n 12:\n 13:\
  \ int main()\n 14: {\n 15:    tuple<double, char, string> tup1(3.14, 'A', \"Hello\"\
  );\n 16:    DisplayTupleInfo(tup1);\n 17:\n 18:    tuple<int, bool> tup2(42, true);\n\
  \ 19:    DisplayTupleInfo(tup2);\n 20:\n 21:    tuple<double, char, int, bool, string>\
  \ tup3(1.1, 'B', 100, false, \"World\");\n 22:    DisplayTupleInfo(tup3);\n 23:\n\
  \ 24:    return 0;\n 25: }\n```\n\n\n\n\n```\n 0: #include<type_traits>\n 1:\n 2:\
  \ template <typename T>\n 3: class OnlyInt\n 4: {\n 5: public:\n 6:    OnlyInt()\n\
  \ 7:    {\n 8:       static_assert(std::is_integral<T>::value, \"Only integers please!\"\
  );\n 9:    }\n10: };\n11:\n12: int main()\n13: {\n14:    OnlyInt<int> test1; //\
  \ OK!\n15:    // OnlyInt<double> test2; // Error!\n16:\n17:    return 0;\n18: }\n\
  ```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n此代码没有产生输出。\n\n### 分析 ▼\n\n此示例演示了第 8 行编写的 `static_assert`\
  \ 如何确保当取消第 15 行的注释时，模板类 `OnlyInt<>` 不能为 `double` 实例化。第 15 行所示的模板实例化违反了该类的设计意图。因此编译失败，并提供了原因：\n\
  \n```\nOnly integers please!\n```\n\n提示\n\nC++20 引入了概念（concepts），你可以用它们定义规则，将模板的实例化限制在某些允许的类型。编译器会验证这些规则的遵守情况，并在模板使用不受允许的参数类型时提供更简单的错误信息。\n\
  \n概念将在第 29 节“C++20 概念、范围、视图和适配器”中进行解释。\n\n#### 在实际 C++ 编程中使用模板\n\n模板的一个重要且强大的应用是在\
  \ STL 中，STL 是一组模板类和函数的集合，包含了通用实用程序类和算法。这些 STL 模板类允许你实现动态数组、列表和键值对容器，而诸如 `std::sort`\
  \ 等算法则在这些容器上运行并处理它们所包含的数据。\n\n你之前获得的模板语法知识将极大地帮助你使用书中后续章节中详细介绍的 STL 容器和函数。更好地理解\
  \ STL 容器和算法反过来将帮助你编写高效的 C++ 程序，使用 STL 经过测试且可靠的实现，并帮助你避免在样板代码细节上花费时间。\n\n| 应该做 |\
  \ 不要做 |\n| --- | --- |\n| **应该**使用模板来实现通用概念。**应该**优先选择模板而不是宏。 | **不要**忘记在编写模板函数和类时使用\
  \ `const` 正确性原则。**不要**忘记，模板类中包含的静态成员对于该类的每个类型特化版本都是静态的。 |\n\n### 总结\n\n在本节中，你学习了更多关于使用预处理器的详细信息。每当你运行编译器时，预处理器都会首先运行并翻译诸如\
  \ `#define` 的指令。\n\n预处理器执行文本替换，尽管在使用宏时，替换可能会变得相当复杂。宏函数根据编译时传递给宏的参数提供复杂的文本替换。在宏的每个参数周围加上括号是必要的，确保替换替换。\n\
  \n模板帮助你编写可重用的代码，为开发者提供了一种可以用于各种数据类型的模式。它们还实现了对宏的类型安全替换。通过在本节获得的模板知识，你现在已经准备好学习使用\
  \ STL 了。\n\n### 问答\n\nQ 为什么我应该在头文件中使用包含保护（inclusion guards）？\n\n**A** 使用 `#ifndef`、`#define`\
  \ 和 `#endif` 的包含保护可以防止头文件被多次包含或递归包含错误，在某些情况下它们甚至可以加快编译。\n\nQ 如果涉及的功能可以用宏函数和模板实现，我什么时候时候优先使用宏函数而不是模板？\n\
  \n**A** 理想情况下，你应该始终优先选择模板，因为它们允许通用且类型安全的实现。宏不支持类型安全的实现，最好避免使用。\n\nQ 在调用模板函数时，我需要指定模板参数吗？\n\
  \n**A** 通常不需要，因为编译器可以根据函数调用中使用的参数为你推断出这一点。\n\nQ 对于给定的模板类，存在多少个静态变量的实例？\n\n**A**\
  \ 这完全取决于模板类被实例化的类型数量。因此，如果你的类已经为 `int`、`string` 和自定义类型 `X` 实例化，你可以预期会有三个静态变量实例——每个模板实例化对应一个。\n\
  \n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对涵盖材料的理解，并提供了练习题以让你获得使用所学知识的经验。在检查附录 E 中的答案之前，请尝试回答测验和练习题，并确保你理解了答案。\n\
