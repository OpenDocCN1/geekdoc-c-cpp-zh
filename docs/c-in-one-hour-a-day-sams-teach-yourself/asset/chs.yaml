  ## 使用流进行输入和输出\n\n实际上，你整本书中一直在使用流，从第 1 节](#ch01.xhtml_ch1)“入门”开始，在该节中通过 `std::cout`\
  \ 在屏幕上显示了“Hello World”。现在是时候关注 C++ 的这部分，并从实践的角度检查流了。\n\n在本节中，你将：\n* ■ 什么是流以及如何使用它们\n\
  * ■ 如何使用流对文件进行读写\n* ■ 有用的 C++ 流操作\n\n### 流的概念\n\n假设你正在开发一个程序，从磁盘读取数据、将数据写入显示器、从键盘读取用户输入并将数据保存到磁盘。无论数据来自或去往什么设备或位置，如果可以用类似的模式处理所有的读写活动，难道不很有用吗？这正是\
  \ C++ 流为你提供的！\n\n流提供了一种编程读写逻辑（换句话说，即输入和输出）一致的方法。你在从磁盘读取数据时使用的流语法与从键盘接受用户输入时使用的是相同的语法。同样，你在向显示器写入数据与向磁盘写入数据时使用的流语法相同。你需要使用正确的流类，而类内部的实现会处理特定于设备和系统的细节。\n\
  \n为了查看流是如何工作的，我们可以参考你第一个 C++ 程序中的相关行代码，见第 1 节](#ch01.xhtml_ch1）中的列表 1.1：\n\n```\n\
  std::cout << \"Hello World!\" << std::endl;\n```\n点击此处查看代码图片\n\n没错：`std::cout` 是\
  \ `ostream` 类的一个控制台输出流对象。要在列表 1.1 中使用 `std::cout`，你包含了 `<iostream>` 头文件，它提供了此功能以及其他功能，例如\
  \ `std::cin`，它允许你从流读取内容。\n\n那么，当我说流允许一致且特定于设备的访问时，什么意思？如果你向文本文件写入 `\"Hello World!\"\
  `，将在文件流对象 `fsHello` 上使用这种语法：\n\n```\nfsHello << \"Hello World!\" << endl;  // 将\
  \ \"Hello World!\" 写入文件流\n```\n点击此处查看代码图片\n\n如你所示，在 C++ 中选择了正确的流类后，向文件写入 `\"Hello\
  \ World!\"` 与向显示器写入并没有太大区别。\n\n**提示**\n\n当你向流写入内容时使用的运算符 `<<` 称为*流插入运算符*（stream\
  \ insertion operator）。你在向显示器、文件等写入内容时使用它。\n\n当你将流内容写入变量时使用的运算符 `>>` 称为*流提取运算符*（stream\
  \ extraction operator）。你在从键盘、文件等处读取输入时使用它。\n\n在本节中，你将从实践的角度学习流。\n\n### 重要的 C++ 流类和对象\n\
  \nC++ 提供了一系列标准类和头文件，可以帮助你执行一些重要的操作。表 27.1](#ch27.xhtml_list21) 列出了常用的 C++ 流类。\n\n\
  | 类/对象 | 描述 |\n| --- | --- |\n| `cout` | 标准输出流，通常重定向到控制台 |\n| `cin` | 标准输入流 |\n\
  | `cerr` | 标准输出流，用于错误 |\n| `fstream` | 输入输出类，用于文件操作 |\n| `ofstream` | 输出流类，用于文件操作\
  \ |\n| `ifstream` | 输入流类，用于文件操作 |\n| `stringstream` | 输入输出类，用于字符串 |\n\n**注意**\n\n\
  `cout`、`cin` 和 `cerr` 分别是 `ostream`、`istream` 和 `ostream` 的全局对象。作为全局对象，它们在 `main()`\
  \ 之前初始化。\n\n在使用流类时，你可以指定执行特定操作的操作符。`std::endl` 是你整本书一直在使用的一种操作符：\n\n```\nstd::cout\
  \  << \"This lines here\" << std::endl;\n```\n点击此处查看代码图片\n\n表 27.2 描述了一些其他操作符。\n\
  \n| 操作符 | 描述 |\n| --- | --- |\n| *输出操作符* | |\n| `endl` | 插入换行并刷新流缓冲区 |\n| `ends`\
  \ | 插入空字符 |\n| *进制操作符* | |\n| `dec` | 指示流以十进制格式输出 |\n| `hex` | 指示流以十六进制格式输出 |\n\
  | `oct` | 指示流以八进制格式输出 |\n| *表示法操作符* | |\n| `fixed` | 指示流以固定点计数法输出 |\n| `scientific`\
  \ | 指示流以科学计数法输出 |\n| *头文件 <iomanip> 提供的操作符* | |\n| `setprecision` | 设置小数点精度为参数 |\n\
  | `setw` | 设置字段宽度为参数 |\n| `setfill` | 设置填充字符为参数 |\n| `setbase` | 设置进制，类似于使用 `dec`、`hex`\
  \ 或 `oct` |\n| `setiosflag` | 通过掩码输入参数 `std::ios_base::fmtflags` 设置标志 |\n| `resetiosflag`\
  \ | 恢复由类型指定的特定标志的默认值 |\n\n**表 27.2** 处理流时常用的 `std` 命名空间操作符\n\n### 使用 `std::cout`\
  \ 向控制台写入格式化数据\n\n#### 使用 `std::cout` 改变数字格式显示\n\n\n\n\n\n可以要求 `cout` 以十六进制或八进制格式显示整数。Listing\
  \ 27.1 演示了如何使用 `cout` 以各种格式显示输入的数字。\n\n### 输入 ▼\n\nListing 27.1 使用 `cout` 和 `<iomanip>`\
  \ 标记将整数以十进制、八进制和十六进制格式显示\n\n```\n 0: #include<iostream>\n 1: #include<iomanip>\n\
  \ 2: using namespace std;\n 3:\n 4: int main()\n 5: {\n 6:    cout << \"Enter an\
  \ integer: \";\n 7:    int input = 0;\n 8:    cin >> input;\n 9:\n 10:    cout <<\
  \ \"Integer in octal: \" << oct << input << endl;\n 11:    cout << \"Integer in\
  \ hexadecimal: \" << hex << input << endl;\n 12:\n 13:    cout << \"Integer in hex\
  \ using base notation: \";\n 14:    cout <<setiosflags(ios_base::hex|ios_base::showbase|ios_base::uppercase);\n\
  \ 15:    cout << input << endl;\n 16:\n 17:    cout << \"Integer after resetting\
  \ I/O flags: \";\n 18:    cout <<resetiosflags(ios_base::hex|ios_base::showbase|ios_base::uppercase);\n\
  \ 19:    cout << input << endl;\n 20:\n 21:    return 0;\n 22: }\n```\n\n点击此处查看代码图像\n\
  \n### 输出 ▼\n\n```\nEnter an integer: 253\nInteger in octal: 375\nInteger in hexadecimal:\
  \ fd\nInteger in hex using base notation: 0XFD\nInteger after resetting I/O flags:\
  \ 253\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n此示例使用了 Table 27.2 中提供的操纵符来改变 `cout` 显示用户提供的相同整数对象\
  \ `input` 的方式。注意第 10 行和第 11 行中使用的操纵符 `oct` 和 `hex`。在第 14 行中，你告诉 `setiosflags()`\
  \ 使用十六进制和大大写字母显示数字，导致 `cout` 将输入的整数 `253` 显示为 `0XFD`。第 18 行使用的 `resetioflags()`\
  \ 效果通过 `cout` 再次使用十进制符号显示整数得到证明。\n\n另一种将显示整数的进制更改为十进制的方法如下：\n\n```\ncout << dec\
  \ << input << endl;  // 以十进制显示\n```\n\n点击此处查看代码图像\n\n还可以格式化 `cout` 显示如 pi 等数字的方式：你可以通过使用固定点法来指定精度，以指示显示小数点后的位数，或者你可以使用科学计数法显示数字。这种以及更多的用法在\
  \ Listing 27.2 中演示。\n\n### 输入 ▼\n\nListing 27.2 使用固定点法和科学计数法使用 `cout` 显示 Pi 和圆面积\n\
