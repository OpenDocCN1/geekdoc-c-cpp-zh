  \ 仅用于已排序的容器。 |\n\n### 总结\n\n在本节中，你学习了 STL 中最重要且强大的方面之一：算法。你对不同类型的算法有了深入的见解，得益于代码列表，你现在应该对算法的应用有更清晰的理解。\n\
  \n### 问答\n\n**Q** 我应该会在关联容器（如 `std::set`）上使用变异算法（如 `std::transform()`）吗？\n\n**A**\
  \ 即使可行，也不应该这样做。关联容器在插入元素时会对元素进行排序，元素的相对位置在 `find()` 等函数中起着重要作用，同时也影响容器的效率。出于这个原因，不应在\
  \ STL set 上使用如 `std::transform()` 这样的变异算法。\n\n**Q** 我需要将顺序容器中每个元素的内容设置为特定值。我会使用\
  \ `std::transform()` 来完成任务吗？\n\n**A** 虽然可以使用 `std::transform()` 来完成，但 `fill()` 和\
  \ `fill_n()` 更适合这项任务。\n\n**Q** `copy_backward()` 会反转目标容器中元素的内容吗？\n\n**A** 不会。STL\
  \ 算法 `copy_backward()` 反转的是元素复制的顺序，而不是元素存储的顺序；也就是说，它从范围的末尾开始到达顶部。要反转集合的内容，你应该使用\
  \ `std::reverse()`。\n\n**Q** 我应该在列表（list）上使用 `std::sort()` 吗？\n\n**A** `std::sort()`\
  \ 可以像在任何其他顺序容器上一样用于列表。然而，列表需要保持一种特有的属性，使得对列表的操作不会使现有的迭代器失效——而 `std::sort()` 无法保证维持这一属性。出于这个原因，STL\
  \ `list` 以成员函数 `list::sort()` 的形式提供了 `sort()` 算法，应该使用它，因为它保证即使元素在列表中的相对位置发生了变化，指向元素的迭代器也不会失效。\n\
  \n**Q** 为什么在排序范围中插入元素时，使用 `lower_bound()` 或 `upper_bound()` 等函数很重要？\n\n**A** 这些函数分别提供了可以在排序集合中插入元素而不破坏排序的第一个和最后一个位置。\n\
