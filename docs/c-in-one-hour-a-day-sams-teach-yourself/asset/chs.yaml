  \n#### 练习题\n\n1. 1. 展示一个实现测验题 1 中 `Circle` 和 `Triangle` 类的继承层次结构。\n\n2. **2. 漏洞终结者（BUG\
  \ BUSTERS）：** 下列代码中的问题是什么？\n\n```\n class Vehicle\n  {\n  public:\n         Vehicle()\
  \ {}\n         ~Vehicle(){}\n  };\n      class Car: public Vehicle\n  {\n  public:\n\
  \         Car() {}\n         ~Car() {}\n  };\n```\n\n点击此处查看代码图像\n\n3. 3. 在练习题 2\
  \ 的（未修正）代码中，如果这样创建并销毁 `car` 实例，构造函数和析构函数的执行顺序是：\n\n```\n Vehicle* myRacer = new\
  \ Car;\n  delete myRacer;\n```\n\n点击此处查看代码图像\n\n## 第 12 \n\n## 运算符类型与运算符重载\n\n除了封装数据和方法，类还可以封装运算符，使其易于对类实例进行操作。你可以使用这些运算符对类对象执行赋值或加法等操作。就像函数一样，运算符也可以被重载。在本节中，你将学习到：\n\
  \n* `operator` 关键字\n* 一元和二元运算符\n* 转换运算符\n* 移动运算符\n* 不能重定义的运算符\n\n### 什么是 C++ 中的运算符？\n\
  \n在语法层面上，运算符与函数之间的区别很小，在于使用了 `operator` 关键字。运算符的声明看起来非常像函数：\n\n```\nreturn_type\
  \ operator_symbol(...parameter list);\n```\n\n点击此处查看代码图像\n\n在这种情况下，`operator_symbol`\
  \ 可以程序员定义的任何运算符类型：`+`（加法）、`&&`逻辑与）等。操作数帮助编译器区分不同的运算符。那么，既然支持函数，为什么 C++ 还要提供运算符呢？考虑一个封装了日、月、年的实用类\
  \ `Date`：\n\n```\nDate holiday (12, 25, 2021); // 初始化为 2021 年 12 月 25 日\n```\n\n\
  点击此处查看代码图像\n\n如果你想增加一天并让实例包含第二天——12 月 26 日，这两种选项中哪一个更直观？\n\n* 选项 1：使用递增运算符：\n\n\
  ```\n++ holiday; // 2021 年 12 月 26 日\n```\n\n* 选项 2：使用成员函数 `Increment()`：\n\n```\n\
  holiday.Increment(); // 2021 年 12 月 26 日\n```\n\n点击此处查看代码图像\n\n显然，选项 1 优于 `Increment()`\
  \ 方法。运算符机制通过提供易用性和直观性促进了消费。在 `Date` 类中实现 `<` 运算符可以帮助你比较两个 `Date` 类实例：\n\n```\nif(date1\
  \ < date2)\n{\n   // 执行某些操作\n}\nelse\n{\n   // 执行其他操作\n}\n```\n\n点击此处查看代码图像\n\n\
  运算符不仅可以用于管理日期的情况。它们对于如 `std::string` 这样提供字符串拼接功能的类来说至关重要。智能指针类利用 `->` 和 `*` 运算符帮助程序员进行指针和内存管理。\n\
  \n注意\n\n实现相关运算符所付出的努力将通过类的易用性得到回报。\n\n\n\n\n从广义上讲，C++ 中的运算符可以分为两类：一元运算符和二元运算符。\n\
  \n### 一元运算符\n\n顾名，`一元运算符`是作用于单个操作数的运算符。在全局命名空间中或作为类的静态成员函数实现的一元运算符使用以下结构：\n\n```\n\
  return_type operator operator_type (parameter_type)\n{\n    // ... implementation\n\
  }\n```\n\n点击此处查看代码图像\n\n作为类（非静态）成员的一元运算符具有类似的结构，但缺少参数，因为它作用的唯一参数是类实例本身（`*this`）：\n\
  \n```\nreturn_type operator operator_type()\n{\n    // ... implementation\n}\n```\n\
  \n点击此处查看代码图像\n\n可以重载（或重定义）的一元运算符如表 12.1 所示。\n\n| 运算符符号 | 名称 |\n| --- | --- |\n|\
  \ ++ | 递增 |\n| -- | 递减 |\n| * | 指针解引用 |\n| -> | 成员选择 |\n| ! | 逻辑非 |\n| & | 取地址 |\n\
  | ~ | 取反码 |\n| + | 一元加 |\n| - | 一元负 |\n| 转换运算符 | 转换为其他类型 |\n\n**表 12.1** 可重载的一元运算符\n\
  \n提示\n\n`sizeof()` 是一个不能重载的一元运算符！\n\n### 一元递增 (`++`) 和递减 (`--`) 运算符\n\n一元前缀递增运算符（++`）可以在类声明中使用以下语法进行编程：\n\
  \n```\n// Unary increment operator (prefix)\nDate& operator ++ ()\n{\n    // operator\
  \ implementation code\n    return *this;\n}\n```\n\n点击此处查看代码图像\n\n另一方面，后置递增运算符（++`）具有不同的返回值和一个输入参数（该参数并不总是被使用）：\n\
  \n```\nDate operator ++ (int)\n{\n   // 在增加日期之前，存储对象当前状态的副本\n   Date copy (*this);\n\
  \n   // 对 'this' 执行的操作代码\n\n   // 返回递增之前的状态（因为是后置）\n   return copy;\n}\n```\n\n\
  点击此处查看代码图像\n\n前缀和后置递减运算符的语法与递增运算符相似；然而，递减运算符的声明包含 `--` 而不是 `++`。列表 12.1 显示了一个简单的类\
  \ `Date`，它允许你使用 `++` 运算符增加日期。\n\n##### 输入 ▼\n\n列表 12.1 一个处理日、月、年并允许递增和减少日的日历类\n\n\
  ```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: class Date\n 4:\
  \ {\n 5: private:\n 6:    int day, month, year;\n 7:\n 8: public:\n 9:    Date (int\
  \ inMonth, int inDay, int inYear)\n10:         : month (inMonth), day(inDay), year\
  \ (inYear) {};\n 11:\n 12:    Date& operator ++ () // 前缀递增\n 13:    {\n 14:    \
  \   ++day;\n 15:       return *this;\n 16:    }\n 17:\n 18:    Date& operator --\
  \ () // 前缀递减\n 19:    {\n 20:       --day;\n 21:       return *this;\n 22:    }\n\
  \ 23:\n 24:    void DisplayDate()\n 25:    {\n 26:       cout << month << \" / \"\
  \ << day << \" / \" << year << endl;\n 27:    }\n 28: };\n 29:\n 30: int main ()\n\
  \ 31: {\n 32:    Date holiday (12, 25, 2021); // 2021 年 12 月 25 日\n 33:\n 34:  \
  \  cout << \"The date object is initialized to: \";\n 35:    holiday.DisplayDate\
  \ ();\n 36:\n 37:    ++holiday; // 日期提前一天\n 38:    cout << \"Date after prefix-increment\
  \ is: \";\n 39:    holiday.DisplayDate ();\n 40:\n 41:    --holiday; // 日期向后一天\n\
  \ 42:    cout << \"Date after a prefix-decrement is: \";\n 43:    holiday.DisplayDate\
  \ ();\n 44:\n 45:    return 0;\n 46: }\n```\n\n点击此处查看代码图像\n\n##### 输出 ▼\n\n```\n\
  The date object is initialized to: 12 / 25 / 2021\nDate after prefix-increment is:\
  \ 12 / 26 / 2021\nDate after a prefix-decrement is: 12 / 25 / 2021\n```\n\n点击此处查看代码图像\n\
  \n### 分析\n\n在 `12` 到 `22` 中定义的前缀和后置递减运算符有助于如 `37` 和 `41` 所示的减少一天。\n\n注意\n\n正如后置运算符的实现所示，在递增之前创建了一个包含初始状态的副本。该副本返回给调用者。换句话说，如果你在使用\
  \ `++object;` 和 `object++;` 来增加之间进行选择，你应该选择前者。\n\n### 转换运算符\n\n假设你使用列表 12.1 并在 `main()`\
  \ 中插入以下行：\n\n```\ncout << holiday; // 没有转换运算符时报错\n```\n\n点击此处查看代码图像\n\n代码会导致会导致编译失败：`error:\
  \ binary '<<': no operator found which takes a right-hand operand of type 'Date'\
  \ (or there is no acceptable conversion)`。此错误意味着 `cout` 不知道如何解释 `Date` 实例，因为 `Date`\
  \ 类不支持将其内容转换为 `cout` 可以接受的类型\n\n`cout` 可以很好地处理 `const char*`：\n\n```\nstd::cout\
  \ << \"Hello world\"; // const char* 可以工作！\n```\n\n点击此处查看代码图像\n\n因此，让 `cout` 与 `Date`\
  \ 类型实例一起工作可能只需添加一个返回 `const char*` 版本的运算符：\n\n```\noperator const char*()\n{\n \
