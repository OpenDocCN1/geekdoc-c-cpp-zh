  \       ostringstream formattedDate; // assists string construction\n18:       formattedDate\
  \ << month << \" / \" << day << \" / \" << year;\n19:\n20:       dateInString =\
  \ formattedDate.str();\n21:       return dateInString.c_str();\n22:    }\n23: };\n\
  24:\n25: int main ()\n26:\n27:    Date holiday (12, 25, 2021);\n28:\n29:    cout\
  \ << \"Holiday is on: \" << holiday << endl;\n30:\n31:    // string strHoliday (holiday);\
  \ // OK!\n32:    // strHoliday = Date(11, 11, 2021); // also OK!\n33:\n34:    return\
