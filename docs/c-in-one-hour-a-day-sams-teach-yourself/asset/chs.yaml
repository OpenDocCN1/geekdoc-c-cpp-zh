  \n点击此处查看代码图像\n\n### 分析 ▼\n不同的编译器或不同的 STL 版本可能会产生略有输出。Listing 19.6 中的代码创建了一个整数的无序集合；在第\
  \ 23 行使用列表初始化插入值；然后显示内容，包括由 `max_bucket_count()`、`load_factor()` 和 `max_load_factor()`\
  \ 方法提供的统计数据，如第 15 行到 18 行所示。输出显示桶的数量初始为 8，容器中有 8 个元素，导致负载因子为 1，这与最大负载因子相同。当无序集合中插入第九个元素时，集合会重新组织，创建\
  \ 64 个桶并重建哈希表；负载因子随之降低。`main()` 中的其余代码演示了在无序集合中查找元素的语法与 set 相似。`find()` 返回一个迭代器，在使用之前，需要如第\
  \ 33 行所示检查 `find()` 是否执行成功。\n\n### 注意\n哈希通常用于在哈希表中根据键查找值。请参见第 20 节 “STL `map` 和\
  \ `multimap`”中的 `std::unordered_map` 部分，该节演示了 `std::unordered_map`——哈希表的 STL 实现。\n\
  \n| 做 | 不要做 |\n\n| --- | --- |\n\n\n\n\n\n- **务必记住** STL `set` 和 `multiset` 容器针对频繁查找的情况进行了优化。**务必记住**\
  \ `std::multiset` 允许存在多个相同值的元素（键），而 `std::set` 仅允许存储唯一值。**务必使用** `multiset::count(value)`\
  \ 来查找特定值的元素个数。**务必记住** `set::size()` 或 `multiset::size()` 用于获取容器中元素的总数。\n- **不要忘记**为可以存入\
  \ `set` 或 `multiset` 等容器的类重载运算符 `<` 和 `==`。前者作为排序谓词，后者则用于 `set::find()` 等函数。**不要**在频繁插入且不频繁查找的场景下使用\
  \ `std::set` 或 `std::multiset`。在这些情况下，`std::vector` 或 `std::list` 通常更合适。\n\n###\
  \ 总结\n\n在本节课程中，你学习了如何使用 STL `set` 和 `multiset` 类、它们重要的成员函数以及它们的特性。你还了解了它们在编写一个简单的基于菜单的电话录程序中的应用，该程序具有搜索和删除功能。\n\
  \n### 问答\n\nQ：如何声明一个整数集合，使其按大小降序排序并存储？\n\n**答** `set<int>` 是一个整数集合。它使用默认排序谓词 `std::less<T>`\
  \ 按大小升序对项排序，也可以表示为 `set<int, less <int>>`。若要按降序排序，请将集合定义为 `set <int, greater <int>>`。\n\
  \nQ：如果在字符串 `set` 中插入两次字符串 `\"Jack\"`，会发生什么？\n\n**答** `set` 的设计目的不是用于包含非唯一值，因此该字符串集合只会包含一个\
  \ `\"Jack\"` 实例。\n\nQ：在前面的示例中，如果我想拥有两个 `\"Jack\"` 实例，需要修改什么？\n\n**答** 根据设计，`set`\
  \ 只持有唯一值。你需要将所选的容器改为 `multiset`。\n\nQ：哪个 `multiset` 成员函数返回容器中特定值的计数？\n\n**答** `count(value)`\
  \ 是我们关注的函数。\n\nQ：我通过 `find()` 函数在集合中找到了一个元素，并获得了一个指向它的迭代器。我可以使用这个迭代器来更改所指向的值吗？\n\
  \n**答** 某些 STL 实现可能允许用户通过例如 `find()` 返回的迭代器更改 `set` 内部元素的值。然而，这不是正确的做法。指向集合中元素的迭代器应该作为\
  \ `const` 迭代器使用——即使 STL 实现没有强制要求这样做。\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对涵盖内容的理解，并提供了练习题让你获得使用所学知识经验。在检查\
