  为了允许用户输入包含空格的完整行，你需要使用 `getline()`：\n\n```cpp\nstring name;\ngetline(cin, name);\n\
  ```\n\n这种结合 `cin` 使用 `getline()` 的用法在 列表 27.7 中进行了演示。\n\n### 输入 ▼\n\n列表 27.7 使用\
