  \ operator: The two are on different days\" << endl;\n47:    else\n48:       cout\
  \ << \"Inequality operator: The two are on the same day\" << endl;\n49:\n50:   \
  \ return 0;\n51: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nholiday 1 is: 12 / 25\
