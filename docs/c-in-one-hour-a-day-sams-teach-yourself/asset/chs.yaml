  \ 因此，`Platypus` 的 C++ 表示如下：\n\n```\nclass Platypus : public Mammal, public Bird,\
  \ public Reptile\n```\n\n### Avoiding Inheritance Using `final`\n\n\n\n\n在某些情况下，你可能需要确保没有任何类可以继承自某个类；也就是说，你想要确保特定的类不能用作基类。C++11\
  \ 引入的 `final` 饰符可以帮助你恰好实现这一点。声明为 `final` 的类不能作为基类。例如，在 Listing 10.10 中，`Platypus`\
  \ 类代表了一个演化良好的物种。因此，你可能希望确保该类是 `final` 的，从而阻断所有继承它的可能性。一个从 Listing 10.10 中截取的 `Platypus`\
  \ 类版本并声明为 `final`，其写法如下所示：\n\n```\nclass Platypus final: public Mammal, public Bird,\
  \ public Reptile\n{\npublic:\n   void Swim()\n   {\n      cout << \"Platypus: Voila,\
  \ I can swim!\" << endl;\n   }\n};\n```\n\n点击此处查看代码图像\n\n除了用于类之外，`final` 还可以用于成员函数以控制多态行为。这在第\
  \ 11 “多态性”中会有讨论。\n\n### 注意\n\n虽然鸭嘴会游泳，但在 Listing 10.10 中，你仍然没有从 `Fish` 继承 `Platypus`。这是因为鸭嘴不是鱼！该列表并没有为了复用现有的\
  \ `Fish::Swim()` 函数而使用继承，因为那是一种糟糕的设计。公继承应该表示一种“是一个”（is-a）的关系。不应该为了实现与代码复用相关的目标而盲目使用它。这些目标可以通过不同的方式实现。\n\
  \n| 应该 (DO) | 不应该 (DON’T) |\n| --- | --- |\n| **应该**使用公继承层次结构来建立“是一个”的关系。**应该**使用私有或保护继承层次结构来建立“有一个”（has-a）的关系——但只有在评估了其他设计选项之后。**应该**记住，基类中的私有成员无法被任何派生类访问，无论继承的性质如何。**应该**记住，公继承意味着派自派生类的类可以访问基类的公共和保护成员。派生类的对象可以用于访问基类的公有成员。**应该**记住，私有继承意味着即使是派自派生类的类也没有访问基类的任何成员。**应该**记住，保护继承意味着派自派生类的类可以访问基类的公共和保护方法。然而，派生类的对象不能用于访问基类的公有成员。\
  \ | **不应该**仅仅为了复用一个简单的函数就创建一个继承层次结构。**不应该**盲目使用继承。这样做可能会导致架构瓶颈，限制应用程序的可扩展性。**不应该**在编写派生类函数时，通过具有相同名称但不同输入参数的函数来隐藏基类中的函数。**不应该**按值传递将类对象作为函数的参数；相反，请使用引用以避免切片错误（slicing\
  \ errors）。 |\n\n### 总结\n\n在本节中，你学习了 C++ 继承的基础知识。你学习了公继承是派生类与基类之间一种“是一个”的关系，而私有和保护继承则创建了“有一个”的关系。你看到了访问修饰符\
  \ `protected` 的应用，它仅将基类的属性暴露给派生类，而对继承层次结构之外的类隐藏它们。你学习了保护继承与私有继承的区别，即派生类类的派生类可以访问基类的公共和保护成员，而这在私有继承中是不可能的。你学习了重写方法和隐藏方法的基础知识，以及如何通过\
  \ `using` 关键字避免意外的方法隐藏。最后，但同样重要的是，你熟悉了 `final` 饰符，它确保了一个类不能被派生。\n\n现在，你已经准备好回答一些问题，然后继续学习面向对象编程的下一个大支柱：多态性。\n\
  \n### 问答\n\n**问** 我被要求为 `Mammal` 类以及几种哺乳动物的类（如 `Human`、`Lion` 和 `Whale`）建模。我应该使用继承层次结构吗？如果是的话，我应该使用哪种呢？\n\
  \n**答** 因为 `Human`、`Lion` 和 `Whale` 都是哺乳动物，并且本质上满足“是一个”（哺乳动物）的关系，你应该使用公继承，以 `Mammal`\
  \ 类为基类，让 `Human`、`Lion` 和 `Whale` 等类继承自它。\n\n**问** `derived class`（派生类）和 `subclass`（子类）这两个术语的区别是什么？\n\
  \n**答** 基本上没有区别。这两个术语都用于指派自（即专门化）基类的类。\n\n**问** 派生类在与其基类的关系中使用公继承。它可以访问基类的私有成员吗？\n\
  \n**答** 不。私有成员属性和函数无法在类之外访问——即使是派生类也不行。编译器始终确保适用访问修饰符中限制性最的一个。该规则的例外适用于声明为 `friend`（朋友）的类和函数。\n\
  \n### 工作坊\n\n工作坊提供了测验题帮助你巩固对涵盖材料的理解，并提供了练习让你获得使用所学内容的经验。在检查答案之前，尝试回答测验题和练习题。\n\n\
