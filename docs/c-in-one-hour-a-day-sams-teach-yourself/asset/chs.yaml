  \ 41 18467 6334 26500 19169\nElements in the list are: 15724 11478 29358 0 0\n```\n\
  \n点击此处查看代码图像\n\n#### 分析 ▼\n\n第 9 行中使用当前时间种子设置随机数生成器，意味着输出在每次运行应用程序时都可能不同。列表 23.5\
  \ 在第 12 行使用 `generate()` 填充 vector 中的所有元素，并在第 21 行使用 `generate_n()` 为列表的前三个元素填充由生成器函数\
  \ `rand()` 提供的随机值。注意 `generate()` 函数接受范围作为输入，然后调用指定的函数。相比之下，`generate_n()` 只接受起始位置。它根据\
  \ `offset` 参数指定的次数来覆盖容器的内容。\n\n### 处理范围内的元素\n\n`for_each()` 算法对范围内的每个元素应用指定的函数。`for_each()`\
  \ 的意义在于使用结构体或 lambda 可以帮助存储状态，你可以在 `for_each()` 完成后查询这些状态。这在列表 23.6 中演示，它使用了函数对象来显示元素。\n\
  \n#### 输入 ▼\n\n列表 23.6 使用 `for_each()` 显示序列\n\n```\n 0: #include<algorithm>\n 1:\
  \ #include<iostream>\n 2: #include<vector>\n 3: #include<string>\n 4: using namespace\
  \ std;\n 5:\n 6: template <typename elementType>\n 7: struct DisplayKeepcount\n\
  \ 8: {\n 9:    int count;\n10:   DisplayKeepcount(): count(0) {}\n11:\n12:   void\
  \ operator()(const elementType& element)\n13:   {\n14:      ++ count;\n15:     \
  \ cout << element << ' ';\n16:   }\n17: };\n18:\n19: int main()\n20: {\n21:    vector<int>\
  \ numsInVec{ 2017, 0, -1, 42, 10101, 25 };\n22:\n23:    cout << \"Elements in vector\
  \ are: \" << endl;\n24:    DisplayKeepcount<int> functor =\n25:       for_each(numsInVec.cbegin(),\
  \   // 范围起始\n26:                numsInVec.cend(),      // 范围结束\n27:            \
  \    DisplayKeepcount<int>());// functor\n28:    cout << endl;\n29:\n30:    // 使用\
  \ for_each 返回值中存储的状态\n31:    cout << \"'\" << functor.count << \"' elements displayed\"\
  \ << endl;\n32:\n33:    string str(\"for_each and strings!\");\n34:    cout << \"\
  Sample string: \" << str << endl;\n35:\n36:    cout << \"Characters displayed using\
  \ lambda:\" << endl;\n37:    int numElements = 0;\n38:    for_each(str.cbegin(),\n\
  39:             str.cend(),\n40:            &numElements { cout << c << ' '; ++numElements;\
  \ });\n41:\n42:    cout << endl;\n43:    cout << \"'\" << numElements << \"' characters\
  \ displayed\" << endl;\n44:\n45:    return 0;\n46: }\n```\n\n点击此处查看代码图像\n\n####\
  \ 输出 ▼\n\n```\nElements in vector are:\n2017 0 -1 42 10101 25 \n'6' elements displayed\n\
  Sample string: for_each and strings!\nCharacters displayed using lambda:\nf o r\
  \ _ e a c h   a n d   s t r i n g s ! \n'21' characters displayed\n```\n\n点击此处查看代码图像\n\
  \n#### 分析 ▼\n\n`for_each()` 算法对范围内的每个元素应用指定的函数对象。`for_each()` 的返回值是函数对象本身，可以用于存储有关操作的信息。\n\
  \n\n\n\n\n这段代码包含两个示例范围：一个包含在整数向量 `numsInVec` 中，另一个是一个 `std::string` 对象 `str`。第一次调用\
  \ `for_each()` 使用 `DisplayElementKeepCount` 作为一元谓词，第二次使用 lambda 表达式。`for_each()`\
  \ 会为所提供范围内的每个元素调用 `operator()`，该操作反过来会将元素打印到屏幕上并增加一个内部计数器。当 `for_each()` 完成时，会返回该函数对象，成员\
  \ `count` 决定了该对象被使用的次数。这种在算法返回的对象中存储信息（或状态）的功能在实际编程场景中非常有用。第 38 行的 `for_each()`\
  \ 作用与第 25 行针对 `std::string` 的对应操作完全相同，只是使用了 lambda 表达式而不是函数对象。请注意，第 38 行中用于类型 `char`\
  \ 使用的 lambda 等效项具有通用性，你也可以按当前形式将其用于第 25 行的 `int` 类型（只需对周围代码进行微调）。\n\n## 使用 `std::transform()`\
  \ 对范围进行转换\n\n`std::for_each()` 和 `std::transform()` 的相似之处在于，它们都会为源范围中的每个元素调用函数对象。然而，`std::transform()`\
  \ 有两个版本。第一个版本接受一个一元函数，常用于将字符串转换为大写或小写，使用 `toupper()` 或 `tolower()` 函数：\n\n```\n\
  string str(\"THIS is a TEst string!\");\ntransform(str.cbegin(), // start source\
  \ range\n          str.cend(), // end source range\n          strLowerCaseCopy.begin(),\
  \ // start destination range\n          ::tolower); // unary function\n```\n\n点击此处查看代码图像\n\
  \n第二个版本接受一个二元函数，允许 `transform()` 处理来自两个不同范围的一对元素：\n\n```cpp\n// 将两个向量的元素相加并将结果存储在\
  \ deque 中\ntransform(numsInVec1.cbegin(), // start of source range 1\n         \
  \   numsInVec1.cend(),   // end of source range 1\n            numsInVec2.cbegin(),\
  \ // start of source range 2\n            sumInDeque.begin(),  // store result in\
  \ a deque\n              plus<int>());      // binary function plus\n```\n\n点击此处查看代码图像\n\
  \n`transform()` 的两个版本始终将指定转换函数的赋值赋值给提供的目标范围，这与 `for_each()` 不同，后者仅作用于单一范围。`std::transform()`\
  \ 的用法在列表 23.7 中所示。\n\n### 输入\n\n列表 23.7 使用一元和二元函数调用 `std::transform()`\n\n```cpp\n\
  \ 0: #include<algorithm>\n 1: #include<string>\n 2: #include<vector>\n 3: #include<deque>\n\
  \ 4: #include<iostream>\n 5: #include<functional>\n 6:\n 7: int main()\n 8: {\n\
  \ 9:     using namespace std;\n10:\n11:     string str(\"THIS is a TEst string!\"\
  );\n12:     cout << \"The sample string is: \" << str << endl;\n13:\n14:     string\
  \ strLowerCaseCopy;\n15:     strLowerCaseCopy.resize(str.size());\n16:\n17:    \
  \ transform(str.cbegin(), // start source range\n18:               str.cend(), \
  \  // end source range\n19:               strLowerCaseCopy.begin(), // start destination\
  \ range\n20:               ::tolower);   // unary function\n21:\n22:     cout <<\
  \ \"Result of 'transform' on the string with 'tolower':\\n\";\n23:     cout << \"\
  \\\"\" << strLowerCaseCopy << \"\\\"\" << endl << endl;\n24:\n25:     // Two sample\
  \ vectors of integers...\n26:    vector<int> numsInVec1{ 2017, 0, -1, 42, 10101,\
  \ 25 };\n27:    vector<int> numsInVec2(numsInVec1.size(), -1);\n28:\n29:     //\
  \ A destination range for holding the result of addition\n30:     deque<int> sumInDeque(numsInVec1.size());\n\
  31:\n32:     transform(numsInVec1.cbegin(), // start of source range 1\n33:    \
  \           numsInVec1.cend(),   // end of source range 1\n34:               numsInVec2.cbegin(),\
  \ // start of source range 2\n35:               sumInDeque.begin(),  // start of\
  \ destination range\n36:               plus<int>());        // binary function\n\
  37:\n38:     cout << \"Result of 'transform' using binary function 'plus': \\n\"\
  ;\n39:     cout << \"Index   Vector1 + Vector2 = Result(in Deque)\\n\";\n40:   \
  \  for(size_t index = 0; index < numsInVec1.size(); ++ index)\n41:     {\n42:  \
  \       cout << index << \"    \\t \" << numsInVec1 [index]   << \"\\t+   \";\n\
  43:         cout << numsInVec2 [index]  << \" \\t  = \";\n44:         cout << sumInDeque[index]\
  \ << endl;\n45:     }\n```\n\n### 输出\n\n```\nThe sample string is: THIS is a TEst\
  \ string!\nResult of 'transform' on the string with 'tolower':\n\"this is a test\
  \ string!\"\n\nResult of 'transform' using binary function 'plus': \nIndex   Vector1\
  \ + Vector2 = Result(in Deque)\n0    2017    +   -1     = 2016\n1    0       + \
  \  -1     = -1\n2    -1      +   -1     = -2\n3    42      +   -1     = 41\n4  \
  \  10101   +   -1     = 10100\n5    25      +               = 24\n```\n\n### 分析\n\
  \n`std::for_each()` 和 `std::transform()` 的相似之处在于，它们都会为源范围中的每个元素调用函数对象。然而，`std::transform()`\
  \ 有两个版本。第一个版本接受一个一元函数，常用于将字符串转换为大写或小写，使用 `toupper()` 或 `tolower()` 函数。第二个版本接受一个二元函数，允许\
  \ `transform()` 处理来自两个不同范围的一对元素。\n\n`transform()` 的两个版本始终将指定转换函数的赋值赋值给提供的目标范围，这与\
  \ `for_each()` 不同，后者仅作用于单一范围。\n\n## 拷贝与删除操作\n\nSTL 提供了三个拷贝函数：`copy()`、`copy_if()`\
  \ 和 `copy_backward()`。`copy()` 按正向将源范围的内容赋值给目标范围。`copy_if()` 在你提供的一元谓词返回 `true`\
  \ 时拷贝元素。`copy_backward()` 按反向将内容赋值给目标范围。另一方面，`remove()` 会删除容器中匹配指定值的元素。\n\n\n\n\n\
  \n点击此处查看代码图像\n\n`remove_if()` 使用一元谓词并从容器中移除所有谓词求值为为 `true` 的元素：\n\n```cpp\n// Remove\
  \ all odd numbers from the vector using remove_if\nnewEnd = remove_if(numsInVec.begin(),\
  \ numsInVec.end(),\n          [](int num) {return ((num % 2) == 1);} ); //predicate\n\
  \nnumsInVec.erase(newEnd, numsInVec.end());  // resizing\n```\n\n点击此处查看代码图像\n\n\
  Listing 23.8 展示了 `copy` 和移除类函数的使用。\n\n### 输入 ▼\n\n列表 23.8 使用 `copy()`、`copy_if()`、`remove()`\
  \ 和 `remove_if()` 将列表复制到向量并移除 0 和偶数\n\n```cpp\n 0: #include<algorithm>\n 1: #include<vector>\n\
  \ 2: #include<list>\n 3: #include<iostream>\n 4: using namespace std;\n 5:\n 6:\
  \ template <typename T>\n 7: void DisplayContents(const T& container)\n 8: {\n 9:\
  \    for_each(container.begin(), container.end(),\n10:       [](const auto& element)\
  \ {cout << element << ' '; });\n11:\n12:    cout << \"| Number of elements: \" <<\
  \ container.size() << endl;\n13: }\n14:\n15: int main()\n16: {\n17:    list<int>\
  \ numsInList{ 2017, 0, -1, 42, 10101, 25 };\n18:\n19:    cout << \"Source(list)\
  \ contains:\" << endl;\n20:    DisplayContents(numsInList);\n21:\n22:    // 初始化\
  \ vector 以容纳列表 2 倍的元素\n23:    vector<int> numsInVec(numsInList.size() * 2);\n24:\n\
  25:    auto lastElement = copy(numsInList.cbegin(),   // 源范围开始\n26:            \
  \                numsInList.cend(),   // 源范围结束\n27:                            numsInVec.begin());\
  \  // 目标范围开始\n28:\n29:    // 将奇数从列表复制到向量\n30:    copy_if(numsInList.cbegin(), numsInList.cend(),\n\
  31:            lastElement,\n32:            [](int element){return((element % 2)\
  \ != 0);});\n33:\n34:    cout << \"Destination(vector) after copy and copy_if:\\\
  n\";\n35:    DisplayContents(numsInVec);\n36:\n37:    // 移除所有的 '0', 使用 erase() 调整\
  \ vector 大\n38:    auto newEnd = remove(numsInVec.begin(), numsInVec.end(), 0);\n\
  39:    numsInVec.erase(newEnd, numsInVec.end());\n40:\n41:    // 使用 remove_if 从\
  \ vector 中移除所有奇数\n42:    newEnd = remove_if(numsInVec.begin(), numsInVec.end(),\n\
  43:               [](int element) {return((element % 2) != 0);});\n44:    numsInVec.erase(newEnd\
  \ , numsInVec.end());  // 调整大小\n45:\n46:    cout << \"Destination(vector) after\
  \ remove, remove_if, erase:\\n\";\n47:    DisplayContents(numsInVec);\n48:\n49:\
  \    return 0;\n50: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nSource(list) contains:\n\
  2017 0 -1 42 10101 25 | Number of elements: 6\nDestination(vector) after copy and\
  \ copy_if:\n2017 0 -1 42 10101 25 2017 -1 10101 25 0 0 | Number of elements: 12\n\
  Destination (vector) after remove, remove_if, erase:\n42 | Number of elements: 1\n\
  ```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n第 25 行演示了 `copy()` 的，它将列表的内容复制到向量中。`copy_if()`\
  \ 用于第 30 行，它将源范围 `numsInList` 中的所有奇数复制到目标范围 `numsInVec`，从 `copy()` 返回的迭代器位置 `lastElement`\
  \ 开始。第 38 行的 `remove()` 掉了 `numsInVec` 中所有的 `0`。第 42 行的 `remove_if()` 移除了所有奇数。\n\
  \n**注意**\n\nListing 23.8 特了一个 `DisplayContainer<>` 函数的版本，这与 Listing 23.3 中的版本不同，因为它使用了\
  \ `for_each()`。\n\n**警告**\n\nListing 23.8 表明 `remove()` 和 `remove_if()` 都返回指向容器新结尾的迭代器。然而，容器\
  \ `numsInVec` 并没有调整大小。元素被删除并向前移动，但大小保持不变。为了调整容器（否则末尾会有无效值），需要在随后的 `erase()` 调用中使用\
  \ `remove()` 或 `remove_if()` 返回的迭代器，如第 39 和 44 行所示。\n\n#### 替换值与替换元素\n\n`replace()`\
  \ 和 `replace_if()` 是 STL 算法，可以分别替换集合中等于指定值或满足条件的元素。`replace()` 根据比较运算符 `==` 替换元素：\n\
  \n```cpp\ncout << \"Using 'replace' to replace value 5 by 8\" << endl;\nreplace(numsInVec.begin(),\
  \ numsInVec.end(), 5, 8);\n```\n\n点击此处查看代码图像\n\n`replace_if()` 期望一个用户指定的一元谓词，对于每个需要替换的值返回\
  \ `true`：\n\n```cpp\ncout << \"Using 'replace_if' to replace even values by -1\"\
  \ << endl;\nreplace_if(numsInVec.begin(), numsInVec.end(),\n   [](int element) {return\
  \ ((element % 2) == 0); }, -1);\n```\n\n点击此处查看代码图像\n\n这些函数的使用在 Listing 23.9 中均有演示。\n\
  \n### 输入 ▼\n\n列表 23.9 使用 `replace()` 和 `replace_if()`替换指定范围内的值\n\n```cpp\n 0: #include<iostream>\n\
  \ 1: #include<algorithm>\n 2: #include<vector>\n 3: using namespace std;\n 4:\n\
  \ 5: template <typename T>\n 6: void DisplayContents(const T& container)\n 7: {\n\
  \ 8:    for_each(container.begin(), container.end(),\n 9:       [](const auto& element)\
