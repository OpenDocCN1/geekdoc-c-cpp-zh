  \ `if constexpr...else` 语句内部不打算执行的代码部分将被编译器忽略，且不会生成到可执行文件中。这种优化在使用模板类时很有帮助。模板将在第\
  \ 14 节 “宏与模板简介”中进行更详细的介绍。\n\n## 在循环中执行代码\n\n到为止，你已经看到了当某些变量包含不同值时，如何让程序表现得不同；例如，在\
  \ Listing 6.1 中，当用户按下 `m` 时执行乘法，否则执行加法。然而，如果用户不希望程序直接结束呢？如果用户想要执行另一个加法或乘法操作——也许再执行五次？在这种情况下，你需要重复执行现有代码。\n\
  \n这就是你需要编写循环的时候。\n\n### 使用 `goto` 的初级循环\n\n正如名称所示，`goto` 指令执行从代码中特定的、带有标签的点继续。你可以使用它回溯并重新执行某些语句。\n\
  \n`goto` 语句的语法为\n\n```cpp\nSomeFunction()\n{\nStart: // 称为一个标签\n   CodeThatRepeats;\n\
  \n   goto Start;\n}\n```\n\n点击此处查看代码图像\n\n你声明了一个名为 `Start` 的标签，并使用 `goto` 从该点开始重复执行，如\
  \ Listing 6.7 所示。\n\n（注：此处原文存在大量重复，已按要求不重复输出）\n\n### 输入 ▼\n\nListing 6.7 询问用户是否重复计算\
  \ 使用 `goto`\n\n```cpp\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3:\
  \ int main()\n 4: {\n 5:    cout << \"Enter two numbers\" << endl;\n 6:    int num1\
  \ = 0, num2 = 0;\n 7:    cin >> num1;\n 8:    cin >> num2;\n 9:\n10:    // 使用三元运算符\
  \ ?:\n11:    int max = (num1 > num2)? num1 : num2;\n12:\n13:    cout << \"The greater\
  \ of \" << num1 << \" and \" \\\n14:        << num2 << \" is: \" << max << endl;\n\
  15:  \n16:    return 0;\n17: }\n```\n\n点击此处查看代码图像\n\n（注：此处原文存在大量重复，已按要求不重复输出）\n\n\
  ### 输出 ▼\n\n```\nEnter two numbers\n365\n-1\nThe greater of 365 and -1 is: 365\n\
  ```\n\n点击此处查看代码图像\n\n\n\n（注：此处原文存在大量重复，已按要求不重复输出）\n\n### 分析 ▼\n\n第 11 行包含感兴趣的语句。它是一个紧凑的语句，用于判断输入的两个数字中哪一个一个大。这行代码也可以使用\
  \ `if-else` 编写，如下：\n\n```cpp\nint max;\nif (num1 > num2)\n   max = num1;\nelse\n\
  \   max = num2;\n```\n\n点击此处查看代码图像\n\n（注：此处原文存在大量重复，已按要求不重复输出）\n\n注意：Listing 6.7\
  \ 和 Listing 6.1 的主要区别在于，Listing 6.1 需要两次运行（即两次执行）才能允许用户输入一组新数字并看到加法和乘法的结果。Listing\
  \ 6.7 在一次执行周期内通过询问用户是否执行另一个操作来实现这一点。启用此点的代码位于第 19 行，如果用户输入字符 `y` 则调用 `goto`。\n\n\
  警告 (Caution)\n\n使用 `goto` 不是循环的推荐方法，因为大量使用 `goto` 会导致代码流不可预测，执行可能会从一行跳转到另一行而没有特定的顺序或序列——在某些情况下还会让变量处于不可预测的状态。\n\
  \n使用 `goto` 编写糟糕的代码会导致所谓的“面条代码”。你可以通过后续页面介绍的 `while`、`do...while` 和 `for` 循环来避免\
  \ `goto`。\n\n你之所以学习 `goto` 的唯一理由是为了理解使用它的代码。\n\n### `while` 循环\n\nC++ 关键字 `while`\
  \ 可以帮助你完成 Listing 6.7 中 `goto` 所做的事情，但方式更加优雅。它的用法语法为\n\n```cpp\nwhile(condition)\n\
  {\n   // 表达式求值为真\n   StatementBlock;\n}\n```\n\n点击此处查看代码图像\n\n只要 `condition` 求值为\
  \ `true`，语句块就会重复执行。因此，以这种方式编写代码并确保在某些情况下表达式也会求值为 `false` 是非常重要的，否则 `while` 循环将永远不会。\n\
  \n\n\n\n\nListing 6.8 等同于 Listing 6.7，但在重复计算循环时使用了 `while` 代替了 `goto`。\n\n### 输入\
  \ ▼\n\nListing 6.8 使用 `while` 循环帮助用户重新计算\n\n```\n 0: #include<iostream>\n 1: using\
  \ namespace std;\n 2:\n 3: int main()\n 4: {\n 5:    char userSelection = 'm'; \
  \  // initial value\n 6:\n 7:    while (userSelection != 'x')\n 8:    {\n 9:   \
  \    cout << \"Enter the two integers: \" << endl;\n10:       int num1 = 0, num2\
  \ = 0;\n11:       cin >> num1;\n12:       cin >> num2;\n13:\n14:       cout << num1\
  \ << \" x \" << num2 << \" = \" << num1 * num2 << endl;\n15:       cout << num1\
  \ << \" + \" << num2 << \" = \" << num1 + num2 << endl;\n16:\n17:       cout <<\
  \ \"Press x to exit(x) or any other key to recalculate\" << endl;\n18:       cin\
  \ >> userSelection;\n19:    }\n20:\n21:    cout << \"Goodbye!\" << endl;\n22:\n\
  23:    return 0;\n24: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nEnter the two integers:\n\
  56\n25\n56 x 25 = 1400\n56 + 25 = 81\nPress x to exit(x) or any other key to recalculate\n\
  r\nEnter the two integers:\n365\n-5\n365 x -5 = -1825\n365 + -5 = 360\nPress x to\
  \ exit(x) or any other key to recalculate\nx\nGoodbye!\n```\n\n点击此处查看代码图像\n\n###\
  \ 分析 ▼\n\n第 7 行到 19 行的 `while` 循环包含了程序的大部分逻辑。注意 `while` 如何检查表达式 `(userSelection\
  \ != 'x')`，并且仅当该表达式求值为 `true` 时才继续。为了启用首次运行，你在第 5 行将 `char` 变量 `userSelection` 初始化为\
  \ `'m'`。这个值可以是任何非 `'x'` 的值（否则，条件在第一次循环时就会失败，应用程序将在未让用户进行任何建设性操作的情况下退出）。首次运行非常简单，但程序在第\
  \ 17 行询问用户是否希望执行另一组计算。第 18 行包含了用户的输入，并且也是你修改 `while` 所求值的表达式的地方，从而让程序有机会继续或终止。当第一次循环完成后，执行将返回到第\
  \ 7 行 `while` 语句中的表达式进行求值，如果用户没有按下 `x`，则重复。当用户在循环末尾按下 `x` 时，第 7 行对表达式的下一次求值结果为 `false`，执行将退出\
  \ `while` 循环，最终在显示告别语句后结束应用程序。\n\n注意\n\n循环也被称为*迭代*（iteration）。涉及 `while`、`do...while`\
  \ 和 `for` 的语句也被*迭代语句*（iterative statements）。\n\n#### `do...while` 循环\n\n在某些情况下（如\
  \ Listing 6.8 中的情况），你需要确保某段代码在循环中重复并且至少执行一次。这就是 `do...while` 循环大用场。\n\n`do...while`\
  \ 循环的语法为\n\n```\ndo\n{\n   StatementBlock; // 至少执行一次\n} while(condition); // 当条件求值为\
  \ false 时结束循环\n```\n\n点击此处查看代码图像\n\n注意包含 `while(condition)` 的那行以分号结尾。这与之前的 `while`\
  \ 循环不同，在之前的循环中，`while` 后的分号将实际上在这一行就终止循环，导致产生空语句。\n\nListing 6.9 展示了 `do...while`\
  \ 循环如何帮助至少执行一次语句。\n\n### 输入 ▼\n\nListing 6.9 使用 `do...while` 重复执行代码块\n\n```\n 0:\
  \ #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n 5:\
  \    char userSelection = 'x';   // initial value\n 6:    do\n 7:    {\n 8:    \
  \   cout << \"Enter the two integers: \" << endl;\n 9:       int num1 = 0, num2\
