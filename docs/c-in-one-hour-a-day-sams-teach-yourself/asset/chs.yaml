  \ 算法\n\n## 第 21 \n\n## 理解函数对象\n\n函数对象（functors）听起来可能很奇异或令人敬畏，但它们是 C++ 中的实体，你可能已经见过，甚至在使用时并没有意识到。在本节中，你将学习：\n\
  \n*   什么是函数对象\n*   如何将函数对象作为谓词\n*   如何使用函数对象实现一元和二元谓词\n\n在概念层，函数对象是像函数一样工作的对象。但在实现层，函数对象是实现了\
  \ `operator()` 的类对象。虽然函数和函数指针也可以被分类为函数对象，但正是实现 `operator()` 的类对象携带状态（即类成员属性的值）的能力，使其与标准模板库（STL）算法非常有用。\n\
  \n函数对象可以分类为以下类型：\n\n*   **一元函数：** 用一个参数调用的函数，例如 `f(x)`。当一元函数返回 `bool` 时，它被称为谓词（predicate）。\n\
  *   **二元函数：** 用两个参数调调用的函数，例如 `f(x, y)`。返回 `bool` 的二元函数被称为二元谓词。\n\n返回布尔类型的函数对象自然适合用于有助于决策的算法。`find()`\
  \ 和 `sort()` 是你之前在课程中学习过的两种算法。结合了两个函数对象的函数对象被称为自适应函数对象。\n\n提示\n\n函数对象也被称为仿函数（functor）。\n\
  \n\n\n\n可以用数页的理论解释来解释函数对象。也可以通过检查微小的示例程序来理解它们的外观和工作原理。让我们采取实践的方法，直接进入 C++ 函数对象编程的世界吧！\n\
  \n## 一元函数\n\n对单个参数的操作的操作称为一元函数。一元函数可以执行非常简单的操作——例如，在屏幕上显示一个元素。可以如下所示编程：\n\n```cpp\n\
  // A unary function\ntemplate <typename elementType>\nvoid FuncDisplayElement(const\
  \ elementType& element)\n{\n    cout << element << ' ';\n};\n```\n\n点击此处查看代码图像\n\
  \n函数 `FuncDisplayElement` 接受一个模板类型 `elementType` 的参数，并使用控制台输出语句 `std::cout` 显示它。以下是另一个版本，它在类或结构体的\
  \ `operator()` 中包含了该函数的实现：\n\n```cpp\n// Struct that can behave as a unary function\n\
  template <typename elementType>\nstruct DisplayElement\n{\n    void operator()(const\
  \ elementType& element) const\n    {\n        cout << element << ' ';\n    }\n};\n\
  ```\n\n点击此处查看代码图像\n\n### 提示\n\n注意 `DisplayElement` 是一个结构体。如果它是一个类，则 `operator()`\
  \ 需要被赋予 `public` 访问修饰符。结构体类似于类，成员默认是公共的。\n\n这两种实现都可以与 STL 算法 `for_each()` 使用，将集合的内容逐个打印到屏幕上，如\
  \ 列表 21.1 所示。\n\n### 输入 ▼\n\n列表 21.1 使用一元函数在屏幕上显示集合的内容\n\n```cpp\n 0: #include<algorithm>\n\
  \ 1: #include<iostream>\n 2: #include<vector>\n 3: #include<list>\n 4: using namespace\
  \ std;\n 5:\n 6: // struct that behaves as a unary function\n 7: template <typename\
  \ elementType>\n 8: struct DisplayElement\n 9: {\n10:     void operator()(const\
  \ elementType& element) const\n11:     {\n12:         cout << element << ' ';\n\
  13:     }\n 14: };\n 15:\n 16: int main()\n 17: {\n18:    vector<int> numsInVec{\
  \ 0, 1, 2, 3, -1, -9, 0, -999 };\n19:     cout << \"Vector of integers contains:\
  \ \" << endl;\n20:\n21:    for_each(numsInVec.begin(),    // Start of range\n22:\
  \             numsInVec.end(),        // End of range\n23:             DisplayElement<int>());\
  \ // Unary function object\n24:\n25:     // Display the list of characters\n26:\
  \    list <char> charsInList{ 'a', 'z', 'k', 'd' };\n27:    cout << endl << \"List\
  \ of characters contains: \" << endl;\n28:\n29:    for_each(charsInList.begin(),\n\
  30:             charsInList.end(),\n31:             DisplayElement<char>());\n32:\n\
  33:     return 0;\n34: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nVector of integers\
  \ contains:\n0 1 2 3 -1 -9 0 -999\nList of characters contains:\na z k d\n```\n\n\
  点击此处查看代码图像\n\n### 分析 ▼\n\n第 8 到 14 行包含了函数对象 `DisplayElement`，它实现了 `operator()`。该函数对象的使用在第\
  \ 21 到 23 行的 STL 算法 `std::for_each()` 中可见。`for_each()` 接受三个参数：第一个是范围的起始点，第二个是范围的终点，第三个参数是为指定范围内的每个元素调调用的函数。换句话说，该代码为\
  \ `vector numsInVec` 中的每个元素调用了 `DisplayElement::operator()`。第 29 到 31 行用字符列表演示了相同的功能。\n\
  \n### 注意\n\n在 列表 21.1 中，你可以可选地使用 `FuncDisplayElement` 代替结构体 `DisplayElement` 来达到相同的效果：\n\
  \n```cpp\nfor_each(charsInList.begin(),\n         charsInList.end(),\n         FuncDisplayElement<char>);\n\
  ```\n\n点击此处查看代码图像\n\n### 提示\n\nC++11 引入了 lambda 表达式，它是无名的函数对象。\n\n来自 列表 21.1 的 `struct\
  \ DisplayElement<T>` 的 lambda 表达式版本将整个代码（包括结构体的定义及其用法）压缩在 `main()` 中的三行内，将第 21 到\
  \ 23 行替换为如下内容：\n\n```cpp\n// Display elements using lambda expression\nfor_each(numsInVec.begin(),\n\
  numsInVec.end(),\n    DisplayElement<int>());\n```\n\n\n\n\n返回 `bool` 的一元函数是一个谓词。此类函数有助于\
  \ STL 算法做出决策。Listing 21.3 是一个示例谓词，用于判断输入元素是否是初始值的倍数。\n\n### 输入 ▼\n\nListing 21.3\
  \ 使用一元谓词判断数字是否为另一个数字的倍数\n\n```cpp\n 0: // 作为一元谓词的结构体\n 1: template <typename numberType>\n\
  \ 2: struct IsMultiple\n 3: {\n 4:    numberType Divisor;\n 5:\n 6:    IsMultiple(const\
  \ numberType& divisor)\n 7:    {\n 8:       Divisor = divisor;\n 9:    }\n10:\n\
  11:    bool operator()(const numberType& element) const\n12:    {\n13:       //\
  \ 检查元素是否能整除\n14:       return((element % Divisor) == 0);\n15:    }\n16: };\n```\n\
  \n点击此处查看代码图像\n\n### 输出 ▼\n\n此代码段没有产生输出\n\n### 分析 ▼\n\n在此示例中，`operator()` 返回 `bool`\
  \ 并可以作为一元谓词工作。该结构体有一个构造函数，并在第 8 行使用 `divisor` 初始化。存储在对象中的该值随后用于判断用于比较的元素是否能被整除，正如\
  \ `operator()` 的实现所示，在第 14 行使用了模运算（`%`），它返回除法操作的余数。谓词将该余数与零比较，以确定数字是否为倍数。\n\nListing\
  \ 21.4 利用 Listing 21.3 中的谓词来判断集合中的数字是否为用户输入的除数的倍数。\n\n### 输入 ▼\n\nListing 21.4 使用一元谓词\
  \ `IsMultiple` 配合 `std::find_if()` 在 Vector 中查找用户提供的除数的倍数元素\n\n```cpp\n 0: #include<algorithm>\n\
  \ 1: #include<vector>\n 2: #include<iostream>\n 3: using namespace std;\n 4: //在此处插入来自\
  \ Listing 21.3 的代码\n 5:\n 6: int main()\n 7: {\n 8:    vector<int> numsInVec{ 25,\
  \ 26, 27, 28, 29, 30, 31 };\n 9:    cout << \"The vector contains: 25, 26, 27, 28,\
  \ 29, 30, 31\" << endl;\n10:\n11:    cout << \"Enter divisor (> 0): \";\n12:   \
  \ int divisor = 2;\n13:    cin >> divisor;\n14:\n15:    // 找到第一个是除数倍数的元素\n16:  \
  \  auto element = find_if(numsInVec.begin(),\n17:                          numsInVec.end(),\n\
  18:                          IsMultiple<int>(divisor));\n19:\n20:    if(element\
  \ != numsInVec.end())\n21:    {\n22:       cout << \"First element in vector divisible\
  \ by \" << divisor;\n23:       cout << \": \" << *element << endl;\n24:     }\n\
  25:\n26:    return 0;\n27: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nThe vector contains:\
  \ 25, 26, 27, 28, 29, 30, 31\nEnter divisor (> 0): 4\nFirst element in vector divisible\
  \ by 4: 28\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n此示例从一个整数 vector 示例容器开始。一元谓词被用于 `find_if()`\
  \ 中，如第 16 行所示。函数对象 `IsMultiple()` 初始化为用户提供的除数值，并存储在变量 `Divisor` 中。`find_if()` 的工作原理是对指定范围内的每个元素调用一元谓词\
  \ `IsMultiple::operator()`。当 `operator()` 为某个元素返回 `true` 时（当该元素除以 4 且没有余数时），`find_if()`\
  \ 返回指向该元素的迭代器 `element`。`find_if()` 操作的结果与 `end()` 方法返回的容器末尾进行比较，以验证是否找到了元素，如第 20\
  \ 行所示，然后使用迭代器 `element` 显示值，如第 23 行所示。\n\n**提示**\n\n要查看使用 lambda 表达式如何压缩 Listing\
  \ 21.4 所示的程序，请查看 Lesson 22 中的 Listing 22.3。\n\n一元谓词应用于许多 STL 算法，例如 `std::partition()`\
  \ 以及保持元素相对顺序的 `stable_partition()`。\n\n\n\n\n第 4 到 13 行包含了类 `Multiply`。此示例使用了 `std::transform()`\
  \ 算法来将两个范围的内容相乘并将结果存储在第三个范围中。在这种情况下，相关的范围存储在 `std::vector` 中，分别为 `multiplicands`、`multipliers`\
  \ 和 `vecResult`。你在第 27 到 31 行中使用 `std::transform()` 将 `multiplicands` 中的每个元素与 `multipliers`\
  \ 中对应的元素相乘，并将乘法结果存储在 `vecResult` 中。乘法本身由二元函数 `Multiply::operator()` 完成，该函数会被构成源范围和目标范围的向量中的每个元素。`operator()`\
  \ 的返回值保存在 `vecResult` 中\n\n此示例演示了二元函数如何在 STL 容器元素上执行算术运算。下一个示例也使用了 `std::transform()`，但它使用该算法通过\
  \ `tolower()` 函数将字符串转换为小写。\n\n### 二元谓词 (Binary Predicates)\n\n接受两个参数并返回 `bool` 的函数是二元谓词。此类函数应用于\
  \ STL 函数，例如 `std::sort()`。列表 21.6 演示了二元谓词的使用，在将两个字符串都转换为小写后对其进行比较。例如，这种谓词可以用于对包含\
  \ `string` 类型元素的向量进行不区分大小写的排序。\n\n#### 输入 ▼\n\n 列表 21.6 使用二元谓词进行不区分大小写的字符串排序\n\n\
  ```\n 0: #include<algorithm>\n 1: #include<string>\n 2: using namespace std;\n 3:\n\
  4: class CompareStringNoCase\n 5: {\n 6: public:\n 7:    bool operator()(const string&\
  \ str1, const string& str2) const\n 8:    {\n 9:       string str1LowerCase;\n10:\n\
  11:       // 分配空间\n12:       str1LowerCase.resize(str1.size());\n13:\n14:      \
  \ // 将每个字符转换为小写\n15:       transform(str1.begin(), str1.end(), str1LowerCase.begin(),\n\
  16:                   ::tolower);\n17:\n18:       string str2LowerCase;\n19:   \
  \    str2LowerCase.resize(str2.size());\n20:       transform(str2.begin(), str2.end(),\
  \ str2LowerCase.begin(),\n21:                  ::tolower);\n22:\n23:       return\
  \ (str1LowerCase < str2LowerCase);\n24:    }\n25: };\n```\n\n点击此处查看代码图像\n\n####\
  \ 输出 ▼\n\n此代码段没有输出。\n\n#### 分析 ▼\n\n在 `operator()` 中实现的二元谓词首先通过 `std::transform()`\
  \ 算法（如第 15 和 20 行所示）将输入字符串转换为小写，然后使用字符串的比较运算符 `<` 返回比较结果。\n\n你可以将此二元谓词与 `std::sort()`\
  \ 算法一起使用，对 vector 中的动态字符串数组进行排序，如列表 21.7 所示。\n\n#### 输入 ▼\n\n 列表 21.7 使用函数对象类 `CompareStringNoCase`\
  \ 对 `vector<string>` 执行不区分大小写的排序\n\n```\n 0: //在此处插入来自列表 21.6 的 CompareStringNoCase\
  \ 类\n 1: #include<vector>\n 2: #include<iostream>\n 3:\n4: template <typename T>\n\
  \ 5: void DisplayContents(const T& container)\n 6: {\n 7:    for(auto element =\
  \ container.cbegin();\n 8:       element != container.cend();\n 9:       ++ element)\n\
  10:       cout << *element << endl;\n11: }\n12:\n13: int main()\n14: {\n15:    //\
  \ 定义一个存储名称的 string vector\n16:    vector <string> names;\n17:\n18:    // 向 vector\
  \ 中插入一些示例名称\n19:    names.push_back(\"jim\");\n20:    names.push_back(\"Jack\");\n\
  21:    names.push_back(\"Sam\");\n22:    names.push_back(\"Anna\");\n23:\n24:  \
  \  cout << \"vector 中按插入顺序排列的名称: \" << endl;\n25:    DisplayContents(names);\n26:\n\
  27:    cout << \"使用默认 std::less<> 排序后的名称: \" << endl;\n28:    sort(names.begin(),\
  \ names.end());\n29:    DisplayContents(names);\n30:\n31:    cout << \"使用忽略大小写的谓词进行排序:\"\
  \ << endl;\n32:    sort(names.begin(), names.end(), CompareStringNoCase());\n33:\
  \    DisplayContents(names);\n34:\n35:    return 0;\n36: }\n```\n\n点击此处查看代码图像\n\n\
  #### 输出 ▼\n\n```\nvector 中按插入顺序排列的名称:\njim\nJack\nSam\nAnna\n使用默认 std::less<> 排序后的名称:\n\
  Anna\nJack\nSam\njim\n使用忽略大小写的谓词进行排序:\nAnna\nJack\nSam\n```\n点击此处查看代码图像\n\n分析 ▼\n\
  \n在 `operator()` 中实现的二元谓词首先通过 `std::transform()` 算法（如第 15 和 20 行所示）将输入字符串转换为小写，然后使用字符串的比较运算符\
  \ `<` 返回比较结果。\n\n你可以将此二元谓词与 `std::sort()` 算法一起使用，对 vector 中的动态字符串数组进行排序。\n\n## 第\
  \ 22 节\n\n## Lambda 表达式\n\nLambda 表达式是在 C++11 中引入的，并在最近的 C++ 版本中得到了改进，它们定义函数对象时不需要命名的类或结构体。C++20\
  \ 的修订增加了对模板参数的支持。\n\n在本节中，你将了解到：\n\n*   ■ 如何编写 lambda 表达式\n*   ■ 如何将 lambda 表达式用谓词\n\
  *   ■ 什么是泛型 lambda 表达式\n*   ■ 如何编写可以持有和操作状态的 lambda 表达式\n\n### 什么是 Lambda 表达式？\n\
  \n\n\n\nLambda 表达式可以被可视化为无名结构体（或类）的紧凑版本，带有一个公共 `operator()` 函数。从这个意义上说，Lambda 表达式是一个函数对象。在我们开始编写\
  \ Lambda 函数之前，让我们回顾列表 21.1（来自第 21 ，“理解函数对象”）中的函数对象作为示例：\n\n```cpp\n// 行为类似于一元函数的\
  \ struct\ntemplate <typename elementType>\nstruct DisplayElement\n{\n    void operator()(const\
  \ elementType& element) const\n    {\n        cout << element << ' ';\n    }\n};\n\
  ```\n\n点击此处查看代码\n\n该函数对象通过 `cout` 在屏幕上显示对象 `element`。它会被用于 `std::for_each()` 等算法中，例所示：\n\
  \n```cpp\n// 显示 vector 中包含的每个整数\nfor_each(numsInVec.cbegin(),    // 范围开始\n     \
  \    numsInVec.cend(),      // 范围结束\n         DisplayElement<int>()); // 一元函数对象\n\
  ```\n\n点击此处查看代码\n\n`struct DisplayElement` 的 Lambda 等效写法只需要一行代码：\n\n```cpp\nauto\
  \ lambda = [](const int& element) {cout << element << ' '; };\n```\n\n点击此处查看代码\n\
  \n这是它在配合 `for_each()` 使用时的样子：\n\n```cpp\n// 使用 lambda 表达式显示 vector 中的元素\nfor_each(numsInVec.cbegin(),\
  \    // 范围开始\n         numsInVec.cend(),      // 范围结束\n         lambda);  // 显示元素\n\
  ```\n\n点击此处查看代码\n\n### 提示\n\nLambda 表达式也称为 lambda 函数。\n\n### 如何定义 Lambda 表达式\n\n\
  Lambda 表达式始终以方括号（`[]`开头。C++20 引入了新功能，例如支持 lambda lambda 表达式模板参数，使其更具通用性，因此也更强大。\n\
  \nLambda 表达式语法可以概括为：\n\n```cpp\n[可选捕获变量]<可选模板参数> 可选-lambda-饰符 (参数)\n{ // lambda\
  \ 表达式代码; }\n```\n\n点击此处查看代码\n\n### 捕获变量\n\n如果你想使用 Lambda 表达式体外部定义的变量，你需要捕获这些变量。捕获列表可以包含多个用逗号分隔的变量：\n\
  \n```cpp\n[var1, var2] <class Type> (Type& param) { // 此处为 lambda 代码; }\n```\n\n\
  点击此处查看代码\n\n如果你需要在 Lambda 表达式内部修改这些变量，需要添加饰符 `mutable`：\n\n```cpp\n[var1, var2]\
  \ <class Type> (Type& param) mutable\n{ // 此处为 lambda 代码; }\n```\n\n点击此处查看代码\n\n\
  ### 注意\n\n`mutable` Lambda 表达式允许在 lambda 表达式内部修改捕获的变量（`[...]`），但这些更改不会反映在表达式外部。\n\
  \n如果需要 lambda 表达式内部对捕获变量的修改也反映到外部，则你应该使用引用：\n\n```cpp\n[&var1, &var2] <class Type>\
  \ (Type& param) { // 此处为 lambda 代码; }\n```\n\n点击此处查看代码\n\n### 提示\n\n除了 `mutable`\
  \ 之外，两个可选增强 lambda 表达式的饰符是 `constexpr` 和 `consteval`。`constexpr` 表示意图尽可能将 lambda\
  \ 求值为常量表达式，而 `consteval` 则使 lambda 成为立即函数，由编译器求值。\n\n### 参数\n\nC++20 允许 Lambda 表达式变得极其通用——类似于使用模板类编写的函数对象。你可以选择性地指定模板参数列表，如下：\n\
  \n```cpp\n[var1, var2] <typename Type1, typename Type2> (Type1 param1, Type2 param2)\n\
  { // 此处为 lambda 代码; }\n```\n\n点击此处查看代码\n\n此外，Lambda 表达式允许多个输入参数，用逗号分隔：\n\n```cpp\n\
  [var1, var2] <class Type> (Type param1, Type param2)\n{ // 此处为 lambda 代码; }\n```\n\
  \n点击此处查看代码\n\n通过使用关键字 `auto` 进行自动类型推导，你可以编写如下所示的通用 Lambda 表达式：\n\n```cpp\n[var1,\
  \ var2] (auto param1, auto param2)\n{ // 此处为 lambda 代码; }\n```\n\n点击此处查看代码\n\n###\
  \ 返回类型\n\n包含单个 `return` 语句的 Lambda 表达式不需要显式指定返回值类型，因为该类型由编译器自动推导。要显式声明返回类型，你可以如下使用\
  \ `->`：\n\n```cpp\n[var1, var2] <class Type> (Type& param)\n```\n\n包含单个 `return`\
  \ 语句的 Lambda 表达式不需要显式指定返回值类型，因为该类型由编译器自动推导。要显式声明返回类型，你可以如下使用 `->`：\n\n```cpp\n[var1,\
  \ var2] <class Type> (Type& param) -> returnType\n```\n\n包含单个 `return` 语句的 Lambda\
  \ 表达式不需要显式指定返回值类型，因为该类型由编译器自动推导。要显式声明返回类型，你可以如下使用 `->`：\n\n```cpp\n[var1, var2]\
  \ <class Type> (Type& param) -> returnType\n```\n\n### 用于一元函数的 Lambda 表达式\n\n一个接受一个参数的简单\
  \ lambda 如下：\n\n```cpp\n[](Type) { // }\n```\n\n注意，如果你愿意，可以引用传递参数：\n\n```cpp\n[](Type&)\
  \ { // lambda 代码 }\n```\n\n### 列表 22.1 通过 Lambda 表达式调用 for_each 显示容器元素\n\n```cpp\n\
  #include <algorithm>\n#include <iostream>\n#include <vector>\n#include <list>\n\n\
  using namespace std;\n\nint main() {\n    vector<int> numsInVec{101, -4, 500, 21,\
  \ 42, -1};\n    cout << \"Display elements in a vector using a lambda: \" << endl;\n\
  \    // 显示整数数组\n    for_each(numsInVec.cbegin(),    // 范围开始\n             numsInVec.cend(),\
  \      // 范围结束\n             [](const int& element) {cout << element << ' '; });\
  \ // lambda\n    cout << endl;\n\n    list<char> charsInList{'a', 'h', 'z', 'k',\
  \ 'l'};\n    cout << \"Display elements in a list using a lambda: \" << endl;\n\
  \    // 显示字符列表\n    for_each(charsInList.cbegin(),     // 范围开始\n             charsInList.cend(),\
  \        // 范围结束\n             [](auto& element) {cout << element << ' '; }); //\
  \ lambda\n    return 0;\n}\n```\n\n### 输出\n\n```\nDisplay elements in a vector using\
  \ a lambda:\n101 -4 500 21 42 -1\nDisplay elements in a list using a lambda:\na\
  \ h z k l\n```\n\n### 分析\n\n有两个关注的 Lambda 表达式，分别位于第 14 行和第 24 行。它们的任务相似，除了输入参数的类型外完全相同。它们针对容器内元素的性质进行了定制。第一个表达式接受一个\
  \ `int` 类型的参数，因为它用于从整数向量中逐个打印元素；第二个表达式接受一个 `char`（由编译器自动推导），因为它用于显示存储在 `std::list`\
  \ 中的 `char` 类型元素。\n\n\n\n\n\n```cpp\nfor_each(charsInList.cbegin(),      // 范围开始\n\
  \          charsInList.cend(),        // 范围结束\n [](auto& element) {cout << element\
  \ << ' '; } );\n// lambda\n```\n\n点击此处查看代码图像\n\n此 lambda 表达式使用了编译器的自动类型推导能力，该能力通过关键字\
  \ `auto` 调用。编译器会将此 lambda 表达式解释为：\n\n```cpp\nfor_each(charsInList.cbegin(),    \
  \   // 范围开始\n          charsInList.cend(),         // 范围结束\n [](const char& element)\
  \ {cout << element << ' '; } );\n```\n\n点击此处查看代码图像\n\n### 注意\n\n列表 22.1 中的代码与列表\
  \ 21.1 中的代码相似，区别在于后者使用了函数对象。事实上，列表 22.1 是函数对象 `DisplayElement<T>` 的 lambda 版本。\n\
  \n如果你比较这两个列表，你会发现 lambda 函数使 C++ 代码变得简单且紧凑。\n\n## 一元谓词的 lambda 表达式\n\n谓词有助于决策。一元谓词是一个返回\
  \ `bool` 的一元表达式，传达 `true` 或 `false`。lambda 表达式也可以返回值。例如，以下代码是一个对偶数返回 `true` 的 lambda\
  \ 表达式：\n\n```cpp\n[](int& num) {return ((num % 2) == 0); }\n```\n\n点击此处查看代码图像\n\n\
  在这种情况下，返回值的性质告诉编译器该 lambda 表达式返回一个 `bool`。\n\n你可以在算法中使用作为一元谓词的 lambda 表达式，例如 `std::find_if()`，在集合中查找偶数。示例请参见列表\
  \ 22.2。\n\n### 输入 ▼\n\n列表 22.2 使用一元谓词的 lambda 表达式和算法 `std::find_if()` 在集合中查找偶数\n\
  \n```cpp\n 0: #include<algorithm>\n 1: #include<vector>\n 2: #include<iostream>\n\
  \ 3: using namespace std;\n 4:\n 5: int main()\n 6: {\n 7:    vector<int> numsInVec{\
  \ 25, 101, 2017, -50 };\n 8:\n 9:    auto evenNum = find_if(numsInVec.cbegin(),\n\
  10:                         numsInVec.cend(),  // 要查找的范围\n11:                  [](const\
  \ int& num){return ((num % 2) == 0); } );\n12:\n 13:    if (evenNum != numsInVec.cend())\n\
  14:       cout << \"Even number in collection is: \" << *evenNum << endl;\n15:\n\
  \ 16:    return 0;\n17: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nEven number in\
  \ collection is: -50\n```\n\n### 分析 ▼\n\n作为一元谓词的 lambda 函数显示在第 11 行。算法 `find_if()`\
  \ 为范围内的每个元素调用一元谓词。当谓词返回 `true` 时，`find_if()` 通过返回指向该元素的迭代器 `evenNum` 来报告找到项。在这种情况下，谓词是\
  \ lambda 表达式，当 `find_if()` 用偶数整数调用它时，它返回 `true`；即对 2 取模的结果为零。\n\n### 提示\n\n列表 22.1\
  \ 和 22.2 不仅演示了作为一元谓词的 lambda 表达式，还演示了在 lambda 表达式中使用 `const`。\n\n对输入参数使用 `const`，特别是当它们是引用时，以避免无意改变容器中元素的值。\n\
  \n## 通过捕获列表 (`[...]`) 带有状态的 lambda 表达式\n\n列表 22.2 显示了一个一元谓词，如果整数能被 2 整除则返回 `true`——即该整数为偶数。如果你需要一个更通用的函数，当数字能被用户选择的除数整除时返回\
  \ `true` 如何？你需要在表达式中维护该“状态”——即除数：\n\n```cpp\nint divisor = 2; // 初始值\n...\nauto\
  \ element = find_if(begin of a range,\n                      end of a range,\n \
  \      divisor{return (dividend % divisor) == 0; } );\n```\n\n点击此处查看代码图像\n\n作为状态变量传递的参数列表\
  \ (`[...]`) 也也被称为 lambda 的*捕获列表*（capture list）。\n\n### 注意\n\n上述的 lambda 表达式是列表 21.3\
  \ 中 16 行代码的单行等效写法。\n\n列表 22.3 展示了在给定状态的情况下，使用一元谓词在集合中查找用户提供的除数的倍数的应用。\n\n### 输入\
  \ ▼\n\n列表 22.3 使用持有状态的 lambda 表达式检查一个数字是否被另一个整除\n\n```cpp\n 0: #include<algorithm>\n\
  \ 1: #include<vector>\n 2: #include<iostream>\n 3: using namespace std;\n 4:\n 5:\
  \ int main()\n 6: {\n 7:    vector<int> numsInVec{ 25, 101, 2017, -50 };\n 8:  \
  \  cout << \"The vector contains: {25, 101, 2017, -50}\";\n 9:\n10:    cout << endl\
  \ << \"Enter divisor (> 0): \";\n11:    int divisor = 2;\n12:    cin >> divisor;\n\
  13:\n14:    // 查找第一个除数的倍数\n15:    vector<int>::iterator element;\n16:    element\
  \ = find_if(numsInVec.begin(),\n17:                      numsInVec.end(),\n18: \
  \          divisor{return (dividend % divisor) == 0; } );\n19:\n20:    if(element\
  \ != numsInVec.end())\n21:    {\n22:       cout << \"First element in vector divisible\
  \ by \" << divisor;\n23:       cout << \": \" << *element << endl;\n24:    }\n25:\n\
  26:    return 0;\n27: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nThe vector contains:\
  \ {25, 101, 2017, -50}\nEnter divisor (> 0): 4\nFirst element in vector divisible\
  \ by 4: 28\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n带有状态作为谓词工作的 lambda 表达式显示在第 18 行。`divisor`\
  \ 是状态变量，它类似于列表 21.3 中的 `IsMultiple::Divisor`。因此，状态变量类似于函数对象的成员属性。你现在可以将状态传递给你的 lambda\
  \ 函数并根据状态自定义其使用方法。\n\n### 注意\n\n列表 22.3 特是列表 21.4 的等效 lambda 表达式，不需要函数对象类 `IsMultiple`。这个\
  \ lambda 表达式消除了 16 行代码！\n\n## 二元函数的 lambda 表达式\n\n二元函数接受两个参数并可选地返回值。二元函数的等效 lambda\
  \ 表达式将是\n\n```cpp\n...\n{  // lambda 代码;  }\n```\n\n点击此处查看代码图像\n\n列表 22.4 展示了一个\
  \ lambda 表达式，它使用 `std::transform()` 逐元素地乘以两个大小相同的 vector，并将结果存储在第三个 vector 中。\n\n\
  ### 输入 ▼\n\n列表 22.4 使用作为二元函数的 lambda 表达式乘以两个容器的元素并将结果存储在第三个中\n\n\n\n\n\n```cpp\n\
  \ 0: #include<vector>\n 1: #include<iostream>\n 2: #include<algorithm>\n 3:\n 4:\
  \ int main()\n 5: {\n 6:    using namespace std;\n 7:\n 8:    vector<int> vecMultiplicand{\
  \ 0, 1, 2, 3, 4 };\n 9:    vector<int> vecMultiplier{ 100, 101, 102, 103, 104 };\n\
  10:\n11:    // Holds the result of multiplication\n12:    vector<int> vecResult;\n\
  13:\n14:    // Make space for the result of the multiplication\n15:    vecResult.resize(vecMultiplier.size());\n\
  16:\n17:    transform(vecMultiplicand.begin(), // 乘数范围\n18:              vecMultiplicand.end(),\
  \ // 范围结束\n19:              vecMultiplier.begin(),  // 乘数值\n20:               vecResult.begin(),\
  \ // 存储结果的范围\n21:               [](int a, int b) {return a * b; } );  // lambda\
  \ \n22:\n23:    cout << \"The contents of the first vector are: \" << endl;\n24:\
  \    for(size_t index = 0; index < vecMultiplicand.size(); ++index)\n25:    cout\
  \ << vecMultiplicand[index] << ' ';\n26:    cout << endl;\n27:\n28:    cout << \"\
  The contents of the second vector are: \" << endl;\n29:    for(size_t index = 0;\
  \ index < vecMultiplier.size(); ++index)\n30:    cout << vecMultiplier[index] <<\
  \ ' ';\n31:    cout << endl;\n32:\n33:    cout << \"The result of the multiplication\
  \ is: \" << endl;\n34:    for(size_t index = 0; index < vecResult.size(); ++index)\n\
  35:    cout << vecResult[index] << ' ';\n36:\n37:    return 0;\n38:  }\n```\n\n\
  点击此处查看代码图像\n\n##### 输出 ▼\n\n```\nThe contents of the first vector are:\n0 1 2 3\
  \ 4\nThe contents of the second vector are:\n100 101 102 103 104\nThe result of\
  \ the multiplication is:\n0 101 204 309 416\n```\n\n点击此处查看代码图像\n\n##### 分析 ▼\n\n\
  此示例中的 lambda 表达式在第 21 行显示，作为 `std::transform()` 的参数。该算法接受两个范围作为输入，并应用包含在二元函数（即感兴趣的\
  \ lambda 表达式）中的转换算法。二元函数的返回值存储在目标容器中。lambda 表达式接受两个整数作为输入，并通过返回值返回乘法结果。该返回值由 `std::transform()`\
  \ 存储在 `vecResult` 中。输出演示了两个容器的内容以及它们与元素相乘的结果。\n\n注意：`列表 22.4` 展示了 `列表 21.5` 中函数对象\
  \ `Multiply<>` 的 lambda 等效形式。\n\n### 用于二元谓词的 Lambda 表达式\n\n接受两个参数并返回 `true` 或 `false`\
  \ 以帮助决策的被称为二元谓词。二元谓词存在于排序算法（如 `std::sort()`）中，它对容器中的任何两个值调用二元谓词，以确定哪一个应该放在另一个后面。二元谓词的通用语法是：\n\
  \n```\n[](Type1& param1, Type2& param2) { return bool; }\n```\n\n点击此处查看代码图像\n\n\
  `列表 22.5` 展示了一个与模板参数配合 lambda 表达式，以及另一个带有显式返回类型并用二元谓词使用的。\n\n##### 输入 ▼\n\n列表 22.5\
  \ 在 `std::sort()` 中使用 Lambda 表达式作为二元谓词以实现忽略大小排序\n\n```cpp\n 0: #include<algorithm>\n\
  \ 1: #include<string>\n 2: #include<vector>\n 3: #include<iostream>\n 4: using namespace\
  \ std;\n 5:\n 6: int main()\n 7: {\n 8:    vector<string> namesVec{\"im\", \"ck\"\
  , \"am\", \"na\" };\n 9:\n10:    // 在屏幕上显示对象的模板 lambda\n 11:    auto displayElement\
  \ = []<typename T>(const T& element)\n 12:                           { cout << element\
  \ << ' ';};\n 13:\n 14:    cout << \"The names in vector in order of insertion:\
  \ \" << endl;\n 15:    for_each(namesVec.cbegin(), namesVec.cend(), displayElement);\n\
  \ 16:\n 17:    cout << \"\\nOrder after sensitive sort:\\n\";\n 18:    sort(namesVec.begin(),\
  \ namesVec.end());\n 19:    for_each(namesVec.cbegin(), namesVec.cend(), displayElement);\n\
  \ 20:\n 21:    cout << \"\\nOrder after sensitive sort:\\n\";\n 22:    sort(namesVec.begin(),\
  \ namesVec.end(),\n 23:        const string& str1, const string& str2) -> bool\n\
  \ 24:        {\n 25:           string str1LC, str2LC;\n 26:           str1LC.resize(str1.size());\n\
  \ 27:           str2LC.resize(str2.size());\n 28:           transform(str1LC.begin(),\
  \ str1LC.end(), str1LC.begin(), ::tolower);\n 29:           transform(str2LC.begin(),\
  \ str2LC.end(), str2LC.begin(), ::tolower);\n 30:           return str1LC < str2LC;\n\
  \ 31:        });\n 32:\n 33:    return 0;\n 34: }\n```\n\n\n\n\n\n```\n var1, var2,\
  \ ... varN { ...expression ;}\n```\n\n点击此处查看代码图像\n\n状态参数 `var1` 和 `var2` 被拷贝（即不是以引用形式提供）。如果你希望将它们作为引用参数，可以使用此语法：\n\
  \n```\n &Var1, &Var2, ... &varN { ...expression ;}\n```\n\n点击此处查看代码图像\n\n在这种情况下，你需要格外小心，因为捕获列表中提供的状态变量的修改会持续影响\
  \ lambda 表达式之外。\n\n### Q：我可以在 lambda 表达式中使用函数中的局部变量吗？\n\n**A**: 你可以在捕获列表中传递局部变量：\n\
  \n```\n var1, var2, ... varN { ...expression ;}\n```\n\n点击此处查看代码图像\n\n如果你需要捕获所有变量，使用此语法：\n\
  \n```\n = { ...expression ;}\n```\n\n点击此处查看代码图像\n\n### 工作坊\n\n工作坊提供了测题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的。在检查附录\
  \ E 中的答案之前，尝试回答测题和练习题，并确保在继续下一节之前理解了答案。\n\n#### 测题\n\n1. **1.** 编译器如何识别 lambda 表达式的开始？\n\
  2. **2.** 你如何将状态变量传递给 lambda 函数？\n3. **3.** 如果你需要在 lambda 表达式中提供返回值，应该如何做？\n\n####\
  \ 练习题\n\n1. **1.** 编写一个 lambda 二元谓词，帮助按降序排序容器中的元素。\n2. **2.** 编写一个 lambda 函数，当在\
  \ `for_each()` 中运行时，它可以向容器（如 vector）添加用户指定的值。\n\n## 第 23 \n\n## STL 算法\n\n标准模板库\
  \ (STL) 的重要部分是一组通用函数，由头文件 `<algorithm>` 提供，这些函数帮助处理或操作容器的内容。\n\n在本节中，你将学习：\n\n*\
  \ 帮助从容器中计数、搜索、查找、复制和删除元素的算法\n* 如何将元素范围内的值设置为生成器函数的返回值或预定义常量\n* 如何对范围内的元素进行排序或分区\n\
  * 如何在排序范围范围的正确位置插入元素\n* C++20 约束算法\n\n### 什么是 STL 算法？\n\n查找、搜索、删除和计数是一些在广泛程序中应用的通用算法活动。STL\
  \ 通过泛型模板函数解决了这些以及许多其他需求，这些函数使用迭代器在容器上工作。要使用 STL 算法，程序员首先必须包含头文件 `<algorithm>`。\n\
  \n### 注意事项\n\n尽管大多数算法通过容器上的迭代器进行工作，但并非所有算法都一定作用于容器，因此并不是所有算法都需要迭代器。例如，`swap()` 仅接受一对值并交换它们。同样，`min()`\
  \ 和 `max()` 也直接作用于值。\n\n### STL 算法的分类\n\nSTL 算法可以大致分为两类：非变异算法和变异算法。\n\n#### 非变异算法\n\
  \n不改变容器顺序或内容的算法被称为非变异算法。主要的非变异算法如 表 23.1 所示。\n\n| 算法 | 描述 |\n| --- | --- |\n| *计数算法*\
  \ | |\n| `count()` | 在范围内查找所有值与提供的值匹配的元素 |\n| `count_if()` | 在范围内查找所有值满足提供特定条件的元素\
  \ |\n| *搜索算法* | |\n| `search()` | 在目标范围内搜索给定序列的首次出现，可以是基于元素相等性（即使用运算符 `==`）或使用指定的二元谓词\
  \ |\n| `search_n()` | 在指定的范围内范围内搜索 `n` 个给定值的元素或满足给定谓词的元素的首次出现 |\n| `find()` | 在范围内搜索第一个匹配指定值的元素\
  \ |\n| `find_if()` | 在范围内搜索第一个满足指定条件的元素 |\n| `find_end()` | 在提供的范围内搜索特定子范围的最后一次出现\
  \ |\n| `find_first_of()` | 在目标范围内搜索一个范围内提供的任何元素的首次出现；或者，在重载版本中，搜索满足提供的查找标准的的元素的首次出现\
  \ |\n| `adjacent_find()` | 在集合中搜索两个相等或满足提供特定条件的相邻元素 |\n| *比较算法* | |\n| `equal()`\
  \ | 比较两个元素是否相等，或使用二元谓词 |\n| `mismatch()` | 使用二元谓词在两个范围内定位第一个差异位置 |\n| `lexicographical_compare()`\
  \ | 比较两个序列之间的元素以确定哪一个是两个 |\n\n**表 23.1 非变异算法快速参考**\n\n#### 变异算法\n\n变异算法是改变其操作序列的内容或顺序的算法。STL\
  \ 提供的一些实用的变异算法如 表 23.2 所示。\n\n| 算法 | 描述 |\n| --- | --- |\n| *初始化算法* | |\n| `fill()`\
  \ | 为范围内的每个元素分配指定的值 |\n| `fill_n()` | 为指定范围的前 `n` 个元素分配指定的值 |\n| `generate()` |\
  \ 将指定函数的返回值分配给范围内的每个元素 |\n| `generate_n()` | 为指定范围内的指定数量元素分配函数生成的值 |\n| *修改算法* |\
  \ |\n| `for_each()` | 对范围内的每个元素执行操作。当指定参数修改范围时，`for_each` 变为变异算法 |\n| `transform()`\
  \ | 对指定范围内的每个元素应用一元函数 |\n| *复制算法* | |\n| `copy()` | 将一个范围复制到另一个 |\n| `copy_backward()`\
  \ | 将一个范围复制到另一个，在目标范围中反向排列元素 |\n| *删除算法* | |\n| `remove()` | 从指定范围删除指定值 |\n| `remove_if()`\
  \ | 从指定范围删除满足指定一元谓词的元素 |\n| `remove_copy()` | 将源范围的所有元素复制到目标范围，排除指定值 |\n| `remove_copy_if()`\
  \ | 将源范围的所有元素复制到目标范围，排除满足指定一元谓词的元素 |\n| `unique()` | 比较范围内的相邻元素并删除随后的重复项。重载版本使用二元谓词工作\
  \ |\n| `unique_copy()` | 将指定源范围中除相邻重复以外的所有元素复制到指定目标范围 |\n| *替换算法* | |\n| `replace()`\
  \ 将范围内每个匹配指定值的元素替换为替换值 |\n| `replace_if()` | 将指定范围内根据谓词确定的匹配指定值的元素替换为替换值 |\n| *排序算法*\
  \ | |\n| `sort()` | 使用指定的排序准则（提供严格弱序的二元谓词）对范围内的元素进行排序。`sort` 可能会改变等价元素的相对位置 |\n\
  | `stable_sort()` | 工作方式与 `sort` 类似，但保留了顺序 |\n\n\n\n\n\n| `partial_sort()` | 对范围内指定数量的元素进行排序。\
  \ |\n| `partial_sort_copy()` | 将元素从源范围拷贝到目标范围，并在目标范围内按排序顺序存储它们。 |\n\n### *分区算法*\n\
  \n| `partition()` | 给定指定范围，将范围内的元素划分为两个集合：满足一元谓词的元素在前，其余元素在后。可能不会保持同一集合内元素的相对顺序。\
  \ |\n| `stable_partition()` | 将输入范围划分为两个集合——与 `partition` 相同，但会保持元素的相对顺序。 |\n\n\
  ### *适用于排序容器的算法*\n\n| `binary_search()` | 确定元素是否存在于排序集合中。 |\n| `lower_bound()` |\
  \ 返回一个迭代器，指向根据其值或或提供的二元谓词，该元素在排序集合中可能插入的首个位置。 |\n| `upper_bound()` | 返回一个迭代器，指向根据其值或或提供的二元谓词，该元素在排序集合中可能插入的最后一个位置。\
  \ |\n\n**表 23.2** 变动算法快速参考\n\n### STL 算法的使用\n\n学习表 23.1 和 23.2 中提到的 STL 算法的最佳方法是通过动手实践编程。接下来的代码示例将让你有机会练习并开始将\
  \ STL 算法应用到你的程序中。\n\n#### 根据给定值或条件查找元素\n\n给定一个如 `vector` 的容器，STL 算法 `find()` 和 `find_if()`\
  \ 分别帮助你找到匹配值或满足条件的元素。`find()` 的用法模式如下：\n\n```\nauto element = find(numsInVec.cbegin(),\
  \    // 范围开始\n                     numsInVec.cend(),    // 范围结束\n              \
  \        numToFind);         // 要查找的元素\n\n// 检查 find() 是否成功\nif(element != numsInVec.cend())\n\
  \    cout << \"Result: Value found!\" << endl;\n```\n\n点击此处查看代码图像\n\n`find_if()`\
  \ 类似，它要求你提供一个一元谓词（即返回 `true` 或 `false` 的一元函数）作为第三个参数：\n\n```\nauto evenNum = find_if(numsInVec.cbegin(),\
  \ // 范围开始\n                          numsInVec.cend(),    // 范围结束\n            \
  \        [](int element) { return (element % 2) == 0; } );\n\nif(evenNum != numsInVec.cend())\n\
  \   cout << \"Result: Value found!\" << endl;\n```\n\n因此，这两个查找函数都返回一个迭代器，你需要通过使用容器中的\
  \ `end()` 或 `cend()` 进行比较来验证查找操作是否成功。如果检查成功，你可以进一步使用该迭代器。代码列表 23.1 展示了如何使用 `find()`\
  \ 在 vector 中定位一个值，以及使用 `find_if()` 定位第一个偶数。\n\n##### 输入 ▼\n\n列表 23.1 使用 `find()`\
  \ 在 Vector 中定位整数值，并在 Lambda 表达式中的一元谓词使用 `find_if()` 定位第一个偶数\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<algorithm>\n 2: #include<vector>\n 3:\n 4: int main()\n 5: {\n 6:\
  \    using namespace std;\n 7:    vector<int> numsInVec{ 2017, 0, -1, 42, 10101,\
  \ 25 };\n 8:\n 9:    cout << \"Enter number to find in collection: \";\n10:    int\
  \ numToFind = 0;\n11:    cin >> numToFind;\n12:\n13:    auto element = find(numsInVec.cbegin(),\
  \      // 范围开始\n14:                              numsInVec.cend(),      // 范围结束\n\
  15:                              numToFind);         // 要查找的元素\n16:\n17:    // 检查\
  \ find 是否成功\n18:    if(element != numsInVec.cend())\n19:       cout << \"Value \"\
  \ << *element << \" found!\" << endl;\n20:    else\n21:       cout << \"No element\
  \ contains value \" << numToFind << endl;\n22:\n23:    cout << \"Finding the first\
  \ even number using find_if: \" << endl;\n24:\n25:    auto evenNum = find_if(numsInVec.cbegin(),\
  \ // 范围开始\n26:                             numsInVec.cend(),  // 范围结束\n27:     \
  \                  [](int element) { return (element % 2) == 0; } );\n28:\n29: \
  \   if(evenNum != numsInVec.cend())\n30:    {\n31:       cout << \"Number '\" <<\
  \ *evenNum << \"' found at position [\";\n32:       cout << distance(numsInVec.cbegin(),\
  \ evenNum) << \"]\" << endl;\n33:    }\n34:\n35:    return 0;\n36: }\n```\n\n点击此处查看代码图像\n\
  \n##### 输出 ▼\n\n首次运行：\n\n```\nEnter number to find in collection: 42\nResult: Value\
