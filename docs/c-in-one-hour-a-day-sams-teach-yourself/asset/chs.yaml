  \n为了确保深拷贝（就像拷贝构造函数一样），你需要指定相应的拷贝赋值运算符：\n\n```\nClassType& operator= (const ClassType&\
  \ copySource)\n{\n   if(this != &copySource) // 防止拷贝到自身\n   {\n      // 拷贝赋值运算符实现\n\
  \   }\n   return *this;\n}\n```\n\n点击此处查看代码图像\n\n如果一个类封装了原始指针，深拷贝是非常重要的，正如代码列表 9.9\
