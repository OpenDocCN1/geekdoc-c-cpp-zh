  \n（注：此处根据上下文翻译逻辑）\n\n### 在字符串中查找字符或子字符串\n\nSTL `string` 类提供了几个重载版本的 `find()` 成员函数，帮助在指定的\
  \ `string` 对象中查找字符或子字符串：\n\n```\n// 在 sampleStr 中查找 \"day\"，从位置 0 开始\nsize_t charPos\
  \ = sampleStr.find(\"day\", 0);\n\n// 如果是否找到了子字符串，与 string::npos 进行比较\nif(charPos\
  \ != string::npos)\n   cout << \"First instance \"day\" at pos. \" << charPos <<\
  \ endl;\nelse\n   cout << \"Substring not found.\" << endl;\n```\n\n点击此处查看代码图像 列表\
  \ 16.4 展示了 `std::string::find()` 的用法。\n\n### 输入 ▼\n\n```\n 0: #include<string>\n\
  \ 1: #include<iostream>\n 2:\n 3: int main()\n 4: {\n 5:    using namespace std;\n\
  \ 6:\n 7:    string sampleStr(\"Good day String! Today is beautiful!\");\n 8:  \
  \  cout << \"Sample string is:\" << endl << sampleStr << endl << endl;\n 9:\n10:\
  \    // 查找 \"day\" - find() 返回位置\n11:    size_t charPos = sampleStr.find(\"day\"\
  , 0);\n12:\n13:    // 检查是否找到了子字符串，对比 string::npos\n14:    if(charPos != string::npos)\n\
  15:       cout << \"First instance \"day\" at pos. \" << charPos << endl;\n16: \
  \   else\n17:       cout << \"Substring not found.\" << endl;\n18:\n19:    cout\
  \ << \"Locating all instances of substring \"day\"\" << endl;\n20:    size_t subStrPos\
  \ = sampleStr.find(\"day\", 0);\n21:\n22:    while(subStrPos != string::npos)\n\
  23:    {\n24:       cout << \"\\\"day\" found at position \" << subStrPos << endl;\n\
  25:\n26:       // 让 find() 从下一个字符开始向前搜索\n27:       size_t searchOffset = subStrPos\
  \ + 1;\n28:\n29:       subStrPos = sampleStr.find(\"day\", searchOffset);\n30: \
  \   }\n31:\n32:    return 0;\n33: }\n```\n\n### 输出 ▼\n\n```\nSample string is:\n\
  Good day String! Today is beautiful!\n\nFirst instance \"day\" at pos. 5\nLocating\
  \ all instances of substring \"day\"\n\"day\" found at position 5\n\"day\" found\
  \ at position 19\n```\n\n\n\n\n\n点击此处查看代码图像\n\n### 分析\n\n第 11 到 17 行展示了 `find()`\
  \ 函数最简单的用法，它用于确定字符串中是否包含特定的子串。这是通过将 `find()` 操作的结果与 `std::string::npos`（实际上是 `-1`）进行比较来实现的，如果相等，则表示未找到搜索的元素。当\
  \ `find()` 函数不返回 `npos` 时，它会返回指示子串或字符在字符串中位置的偏移量。随后的代码展示了如何在 `while` 循环中使用 `find()`\
  \ 来在 STL 字符串中定位子串的所有出现处。这里使用的 `find()` 函数重载版本接受两个参数：要查找的子串或字符，以及指示 `find()` 从何处开始搜索的搜索偏移量。你可以通过使用此偏移量来控制搜索，让\
  \ `find()` 查找子串的下一次出现，如第 29 行所示。\n\n**注意**\n\nSTL string 还具有其他查找函数，例如 `find_first_of()`、`find_first_not_of()`、`find_last_of()`\
  \ 和 `find_last_not_of()`，这些函数帮助程序员处理字符串。\n\n### 截断 STL 字符串\n\nSTL `string` 类具有一个名为\
  \ `erase()` 的函数，它可以删除：\n\n*   ■ 当给定偏移位置和计数时，删除若干字符：\n\n    ```\n     string sampleStr(\"\
