  \ 333);\n39:    pairIntInt.GetFirstValue();\n40:\n41:    return 0;\n42: }\n```\n\
  \n点击此处查看代码图像\n\n### 输出\n\n```\nReturning integer 222\n```\n\n### 分析\n\n当你将 列表 14.4\
