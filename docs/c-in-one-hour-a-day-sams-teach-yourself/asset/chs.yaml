  \ 22 行和第 25 行中，`DisplayArray()` 分别用 `myNums` 和 `myStatement` 被调用。第一个参数告诉函数输入的数据是一个数组，第二个参数提供数组的长度，这样你就可以在不越界的情况下使用该数组。\n\
  \n\n\n\n\n虽然确切知道函数调用在微处理器层面上是如何实现的并非极其重要，但你可能会觉得很有趣。理解这有助于你理解为什么 C++ 为你提供了内联函数（inline\
  \ functions）的选项，我们将在本节稍后进行解释。\n\n函数调用本质上意味着微处理器跳转到执行非连续内存位置上被调用函数的下一条指令。在执行完函数中的指令后，它会返回到之前离开的地方。为了实现这一逻辑，编译器会将你的函数调用转换为微处理器的\
  \ `CALL` 指令。该指令伴随着下一条指令需要跳转的内存地址；该地址属于你的函数例程。当微处理器遇到 `CALL` 时，它会将函数调用后要执行的指令位置保存在栈（stack）上，并跳转到\
  \ `CALL` 指令包含的内存位置。\n\n### 理解栈\n\n`stack`（栈）是一种后进先出的内存结构，非常像一叠盘子，你取最顶部的盘子，而它是最后被放在栈上的一个。将数据放入栈中称为\
  \ `push`（推入）操作。从栈中取出数据称为 `pop`（弹出）操作。随着栈向上增长，栈指针始终随着增长而递增，并指向栈顶。请参见图 7.3。\n\n![插图显示了一列按部分从上往下排列的\
  \ Integer 3、Integer 2 和 Integer 1。分隔每个部分的线标记为栈指针 Stack Pointer（始终指向可以插入下一个元素的顶部，即“pushed”（已推入））。](img/07fig03.jpg)\n\
  \n**图 7.3** 一个包含三个整数的栈的可视化表示。\n\n栈的特性使其非常适合处理函数调用。当函数被调用时，所有的局部变量都会在栈上实例化——即被推入栈中。当函数结束时，这些变量被直接从栈中弹出，栈指针返回到原始位置。\n\
  \n该内存位置包含属于函数的指令。微处理器执行这些指令，直到遇到 `RET` 语句（你编写的用于微处理器的 `return` 代码）。`RET` 语句会导致微处理器从执行\
  \ `CALL` 指令期间存储在栈上的从中弹出该地址。该地址包含了调用函数中需要继续执行的位置。因此，微处理器回到了调用者处并从之前离开的地方继续执行。\n\n\
  ### 内联函数\n\n普通的函数调用被翻译为 `CALL` 指令，这会导致栈操作以及微处理器执行流转移到函数等。这听起来在底层发生了很多操作，但在大多数情况下，它发生得非常快。然而，如果一个函数是非常简单的函数，比如下面这样呢？\n\
  \n```\ndouble GetPi()\n{\n   return 3.14159;\n}\n```\n\n在这种情况下，执行函数调用所涉及的开销对于实际执行\
  \ `GetPi()` 所花费的时间来说可能非常高。这就是为什么 C++ 编译器允许程序员将此类函数声明为内联的（inline）。程序员可以使用 `inline`\
  \ 关键字请求让这些函数在调用的地方进行内联展开：\n\n```\ninline double GetPi()\n{\n   return 3.14159;\n\
  }\n```\n\n点击此处查看代码图像\n\n执行诸如数字翻倍等简单操作的函数也是内联的良好候选者。列表 7.10 演示了其中这种情况。\n\n### 输入\n\
  \n列表 7.10 使用将整数翻倍的内联函数\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n\
  \ 2:\n 3: // 定义一个数字翻倍的内联函数\n 4: inline long DoubleNum (int inputNum)\n 5: {\n 6:\
  \    return inputNum * 2;\n 7: }\n 8:\n 9: int main()\n10: {\n11:    cout << \"\
  Enter an integer: \";\n12:    int inputNum = 0;\n13:    cin >> inputNum;\n14:\n\
  15:    // 调用内联函数\n16:    cout << \"Double is: \" << DoubleNum(inputNum) << endl;\n\
  17:\n18:    return 0;\n19: }\n```\n\n点击此处查看代码图像\n\n### 输出\n\n```\nEnter an integer:\
  \ 35\nDouble is: 70\n```\n\n### 分析\n\n第 4 行使用了 `inline` 关键字。编译器通常将此关键字视为一种请求，将函数\
  \ `DoubleNum()` 的内容直接放置在调用函数的地方——在本例中为第 16 行——这提高了代码的执行速度。\n\n将函数分类为内联会导致代码膨胀（code\
  \ bloat），特别是当被内联的函数包含许多指令时。`inline` 关键字应该少用；它应该预留给那些需要快速执行且开销最小的具有简单任务的函数，正如前面所示。\n\
  \n**注意**\n\n大多数现代 C++ 编译器提供了各种性能优化选项。某些编译器（例如 MSVC 编译器）可以针对大小或速度进行优化。针对大小优化有助于为内存可能昂贵的设备和外围设备开发软件。当你针对大小优化时，编译器可能会拒绝许多内联请求，这可能会导致代码膨胀。\n\
  \n当你针对速度优化时，编译器通常会发现并利用机会。\n\n### 自动返回类型\n\n你已经在 3 中学习了 `auto` 关键字。这个在 2014 年引入的关键字让你把变量类型交给编译器。同样的原理也适用于函数。与其指定返回类型，你可以使用\
  \ `auto` 并让编译器根据返回值进行推断。\n\n列表 7.11](#ch07.xhtml_ch7lev3sec31) 演示了计算圆面积的函数中使用 `auto`。\n\
  \n### 输入\n\n列表 7.11 使用 `auto` 作为 `Area()` 的返回类型\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: const double Pi = 3.1415925;\n 4:\n 5: auto\
  \ Area(double radius)\n 6: {\n 7:     return Pi * radius;\n 8: }\n 9:\n10: int main()\n\
  11: {\n12:     cout << \"Enter radius: \";\n13:     double radius = 0;\n14:    \
  \ cin >> radius;\n15:\n16:     // 调用函数 \"Area\"\n17:     cout << \"Area is: \" <<\
  \ Area(radius) << endl;\n18:\n19:     return 0;\n20: }\n```\n\n点击此处查看代码图像\n\n###\
  \ 输出\n\n```\nEnter radius: 2\nArea is: 12.5564\n```\n\n点击此处查看代码图像\n\n### 分析\n\n\
  感兴趣的行是第 5 行，它使用 `auto` 作为函数 `Area()` 的返回类型。编译器根据返回 `double` 的表达式进行推断。因此，尽管使用了 `auto`，列表\
  \ 7.11](#ch07.xhtml_ch7lev3sec31) 中的 `Area()` 与列表 7.1](#ch07.xhtml_ch7lev3sec1)\
  \ 中返回类型为 `double` 的 `Area()` 生成的代码相同。\n\n**注意**\n\n依赖自动返回类型推断的函数需要在调用之前定义（即实现）。这是因为编译器需要在调用点知道函数的返回类型。如果此类函数有多个返回语句，它们需要推断出相同的类型。递归调用需要至少遵循一个返回语句。\n\
  \n### Lambda 函数\n\nLambda 函数也称为 *lambda expressions*（ 表达式）。这一特性自 C++11 以来是一项重大升级，从根本上使良好的\
  \ C++ 应用程序现代化。\n\n\n\n本节介绍了一个对初学者来说并不完全易懂的概念。因此，请快速浏览一遍并尝试学习该概念，但如果你没有完全掌握，请不要失望。该主题将在第\
  \ 22 节“Lambda 表达式”中深入讨论。\n\nLambda 函数于 2011 年引入，经常用于标准模板库 (STL) 提供的算法中。例如，你可能会在\
  \ `sort` 函数中使用 lambda 函数，该函数要求你提供一个二元谓词（binary predicate）。二元谓词是一个比较两个参数的函数，如果一个小于另一个，它返回\
  \ `true`；否则返回 `false`，从而帮助决定排序操作中元素的顺序。Lambda 函数有助于定义更紧凑的谓词，如列表 7.12 所示。\n\n###\
  \ 输入\n\n列表 7.12 使用 Lambda 函数显示数组中的元素并对其排序\n\n```\n 0: #include<iostream>\n 1: #include<algorithm>\n\
  \ 2: #include<vector>\n 3: using namespace std;\n 4:\n 5: void DisplayNums(vector<int>&\
  \ dynArray)\n 6: {\n 7:    for_each (dynArray.begin(), dynArray.end(), \\\n 8: \
  \           [](int Element) {cout << Element << \" \";} );\n 9:\n10:    cout <<\
  \ endl;\n 11: }\n 12:\n 13: int main()\n 14: {\n 15:    vector<int> myNums;\n 16:\
  \    myNums.push_back(501);\n 17:    myNums.push_back(-1);\n 18:    myNums.push_back(25);\n\
  \ 19:    myNums.push_back(-35);\n 20:\n 21:    DisplayNums(myNums);\n 22:\n 23:\
  \    cout << \"Sorting them in descending order\" << endl;\n 24:\n 25:    sort (myNums.begin(),\
  \ myNums.end(),\n 26:         [](int Num1, int Num2) {return (Num2 < Num1); } );\n\
  \ 27:\n 28:    DisplayNums(myNums);\n 29:\n 30:    return 0;\n 31: }\n```\n\n点击此处查看代码图像\n\
  \n### 输出\n\n```\n501 -1 25 -35\nSorting them in descending order\n501 25 -1 -35\n\
  ```\n\n点击此处查看代码图像\n\n### 分析\n\n程序第 15 行至 19 行包含了向 C++ 标准库以 `std::vector` 形式提供的动态数组推入的整数。`DisplayNums()`\
  \ 函数使用 STL 算法 `for_each` 遍历数组中的元素并显示每个元素的值。在此过程中，它在第 8 行使用了一个 lambda 函数。第 25 行的\
  \ `std::sort` 也使用了 lambda 函数形式的二元谓词（第 26 行），如果第二个数字小于第一个数字，则返回 `true`，从而有效地将集合按升序排序。\n\
  \nLambda 函数的语法如下：\n\n```\n可选参数{语句; }\n```\n\n点击此处查看代码图像\n\n### 注意\n\n谓词及其在 `sort`\
  \ 等算法中的用法将在第 23 节“STL 算法”中详细讨论。特别是列表 23.6 是一个代码示例，它在算法中使用了 lambda 函数和非 lambda 变体，使你能够比较\
  \ lambda 函数引入的编程效率。\n\n### 总结\n\n在本节中，你学习了模块化编程的基础知识。你学习了函数如何帮助你更好地组织代码，以及它们如何帮助你重用编写的算法。你学习了函数可以接受参数并返回值，参数可以具有调用者可以覆盖的默认值，参数可以包含引用传递的参数。你学习了如何传递数组，还学习了如何编写具有相同名称和返回类型但参数列表不同的重载函数。\n\
  \n最后但同样重要的是，你初步了解了什么是 Lambda 函数。Lambda 函数改变了 C++ 程序的编写方式，特别是结合 STL。\n\n### 问答\n\n\
  问：如果我编写了一个不会结束的递归函数会怎样？\n\n答：程序执行不会结束。这本身可能并不是坏事，因为有 `while(true)` 和 `for(;;)` 循环也可以这样做；但是递归函数调用会消耗越来越多的栈空间，栈空间是有限的并会用尽，最终导致栈溢出引发应用程序崩溃。\n\
  \n问：为什么不对每个函数进行内联？这样做可以提高执行速度，对吧？\n\n答：函数内联的好处不能想当然。内联会将函数代码插入到调用点，导致代码膨胀。\n\n问：我可以为函数中的所有参数提供默认参数值吗？\n\
  \n答：是的，这完全可行，并且在这样做合理时建议这样做。\n\n问：我有两个函数，都叫 `Area`。一个接受半径，另一个接受高度。\n\n### 工作坊\n\n\
  工作坊提供了测验题帮助你理解材料，并提供了练习让你获得所学知识的实践经验。\n\n### 答案\n\n问：如果我编写了一个不会结束的递归函数会怎样？\n\n答：程序执行不会结束。这本身可能并不是坏事，因为有\
  \ `while(true)` 和 `for(;;)` 循环也可以这样做；但是递归函数调用会消耗越来越多的栈空间，栈空间是有限的并会用尽，最终导致栈溢出引发应用程序崩溃。\n\
  \n问：为什么不对每个函数进行内联？这样做可以提高执行速度，对吧？\n\n答：函数内联的好处不能想当然。内联会将函数代码插入到调用点，导致代码膨胀。\n\n问：我可以为函数中的所有参数提供默认参数值吗？\n\
  \n答：是的，这完全可行，并且在这样做合理时建议这样做。\n\n问：我有两个函数，都叫 `Area`。一个接受半径，另一个接受高度。\n\n### 测验\n\n\
  1. 函数中声明变量的作用域是什么？\n2. 传递给此值的性质是什么？\n3. 调用自身的函数是什么？\n4. 这些函数是什么？\n5. 栈指针指向栈顶部、中部还是底部？\n\
  \n### 练习\n\n1. 编写计算球和圆柱体积的重载函数。\n2. 编写一个接受 `double` 数组作为输入的函数。\n3. 下面代码有什么问题？\n\
  4. 下面函数声明有什么问题？\n5. 编写一个返回类型为 `void` 的函数，在提供半径时仍帮助调用者计算圆的面积和周长。\n\n## 第 8 节\n\n\
  ## 指针与引用详解\n\nC++ 的最大优势之一是它既允许你编写与硬件抽象的高层应用程序，也可以编写接近硬件的应用程序。事实上，C++ 允许你在字节和位级别调整应用程序的性能。理解指针和引用的原理是编写有效利用系统资源程序的一步。\n\
  \n\n\n\n在本节中，你将了解到：\n\n*   什么是指针\n*   什么是空闲（free store）\n*   如何使用 `new` 和 `delete`\
  \ 运算符来分配和释放内存\n*   如何使用指针和动态分配编写稳定的应用程序\n*   什么是引用\n*   指针与引用之间的区别\n*   何时使用指针，何时使用引用\n\
  \n### 什么是指针？\n\n`pointer`（指针）是一个存储内存地址的变量。正如 `int` 类型的变量用于存储整数值一样，指针变量被用于存储内存地址，如图图\
  \ 8.1 所示。\n\n![一张插图显示了三个由线条隔开的水平部分。](img/08fig01.jpg)\n\n**图 8.1** 指针的可视化。\n\n因此，指针是一个变量，和所有其他变量一样，指针在内存中占据空间（在图\
  \ 8.1 中，地址为 `0x101`）。指针的特殊之处在于，指针中所包含的值（在本例中为 `0x558`）被解释为一个内存地址。所以，指针是一个`指向`内存某个位置的特殊变量。\n\
  \n注意\n\n内存位置通常使用`hexadecimal`（十六进制）表示法。这是一种 16 进制数系统——即一个包含从 0 到 9 再到 A 到 F 的 16\
  \ 个不同符号的系统。按照习惯，十六进制数带有 `0x` 前缀。因此，`0xA` 是十进制十的十六进制，`0xF` 是十五的十六进制，而 `0x10` 是十六的十进制十六进制。有关更多信息，请参阅附录\
  \ A“处理数字：二进制与十六进制”。\n\n### 声明指针\n\n作为一个变量，指针需要被声明。你通常会声明一个指向特定值类型的指针，例如 `int`。这意味着指针中包含的地址指向内存中存储一个整数的位置。你也可以声明一个指向未指定类型内存块的指针（也称为\
  \ `void` 指针）。\n\n和所有其他变量一样，指针需要被声明。指针声明使用以下语法：\n\n```\nPointedType* PointerVariableName;\n\
  ```\n\n点击此处查看代码图像\n\n与大多数其他变量一样，除非初始化指针，否则它将包含一个随机值。你不希望访问一个随机内存地址，因此你将指针初始化为 `NULL`。`NULL`\
  \ 是一个可以进行检查的值，且它本身不是一个内存地址：\n\n```\nPointedType* PointerVariableName = NULL; //\
  \ 初始化值\n```\n\n点击此处查看代码图像\n\n因此，你可以这样声明一个指向整数的指针：\n\n```\nint* pointsToInt = NULL;\n\
  ```\n\n注意\n\n指针像你学过的所有其他数据类型一样，除非经过初始化，否则它包含一个垃圾值。这种垃圾值对于指针来说是特别危险的，因为指针预期包含一个地址。未初始化的指针可能导致程序访问无效的内存位置，导致崩溃。\n\
  \n### 使用引用运算符 (`&`) 确定变量的地址\n\n变量是 C++ 提供的用于处理内存中数据的工具。这一概念在第 3 “使用变量、声明常量”中进行了详细解释。如果\
  \ `varName` 是一个变量，`&varName` 给出其值所在位置的内存地址。\n\n所以，如果你声明了一个整数，使用你熟悉的语法，例如：\n\n```\n\
  int age = 30;\n```\n\n`&age` 就是存储该值（`30`）的内存地址。列表 8.1 演示了整数变量内存地址的概念，该地址用于存储它所包含的值。\n\
  \n### 输入\n\n列表 8.1 确定 `int` 和 `double` 的地址\n\n```\n0: #include<iostream>\n1: using\
  \ namespace std;\n2:\n3: int main()\n4: {\n5:    int age = 30;\n6:    const double\
  \ Pi = 3.1416;\n7:\n8:    // 使用 & 查找内存地址\n9:    cout << \"Integer age is located\
  \ at: 0x\" << &age << endl;\n10:    cout << \"Double Pi is located at: 0x\" << &Pi\
  \ << endl;\n11:\n12:    return 0;\n13: }\n```\n\n点击此处查看代码图像\n\n### 输出\n\n```\nInteger\
  \ age is at: 0x0045FE00\nDouble Pi is located at: 0x0045DF8\n```\n\n点击此处查看代码图像\n\
  \n### 分析\n\n注意第 9 行和第 10 行如何使用引用运算符 (`&`) 来揭示变量 `age` 和常量 `Pi` 的地址。文本 `0x` 的添加是显示十六进制数时的惯用做法。\n\
  \n注意\n\n你知道变量消耗的内存量取决于它的类型。列表 3 演示了整数变量内存地址的概念，该地址用于存储它所包含的值。\n\n#### 使用指针存储地址\n\
  \n你已经学习了指针是用于存储地址的变量。你已经知道如何使用引用运算符 (`&`) 获取变量的地址。假设你声明了一个变量，使用你已经熟悉的语法：\n\n```cpp\n\
  Type Variable = Value;\n```\n\n为了使用指针存储该地址，你需要声明一个指针并将其初始化为变量的地址：\n\n```\nType*\
  \ pointer = &Variable;\n```\n\n所以，如果你声明了一个整数，使用你熟悉的语法，例如：\n\n```\nint age = 30;\n\
  ```\n\n你可以像这样声明一个指向整数的指针：\n\n```\nint* pointsToInt = &age;\n```\n\n在列表 8.2 中，你可以看到如何使用引用运算符\
  \ (`&`) 获取地址。\n\n### 输入\n\n列表 8.2 演示指针的声明与初始化\n\n```\n0: #include<iostream>\n1:\
  \ using namespace std;\n2:\n3: int main()\n4: {\n5:    int age = 30;\n6:    int*\
  \ pointsToInt = &age;  // 初始化为 &age\n7:\n8:    // 显示指针的值\n9:    cout << \"Integer\
  \ age is at: 0x\" << hex << pointsToInt << endl;\n10:\n11:    return 0;\n12: }\n\
  ```\n\n点击此处查看代码图像\n\n### 输出\n\n```\nInteger age is at: 0x0045FE00\n```\n\n### 分析\n\
  \n本质上，这段代码段的输出与列表 8.1 代码的输出相同，因为这两个示例都在显示相同的内容——整数 `age` 存储的内存地址。这里的区别是地址首先在第 6\
  \ 行被赋值给指针，然后在第 9 行使用 `cout` 显示指针的值（现在是地址）。\n\n\n\n\n既然你已经知道了如何在指针变量中存储地址，那么很容易想象，同一个指针变量可以被赋予不同的内存地址，并使其指向不同的值，如列表\
  \ 8.3 所示。\n\n### 输入 ▼\n\n列表 8.3 将指针重新赋值给另一个变量\n\n```\n 0: #include<iostream>\n 1:\
  \ using namespace std;\n 2:\n 3: int main()\n 4: {\n 5:    int age = 30;\n 6:\n\
  \ 7:    int* pointsToInt = &age;\n 8:    cout << \"pointsToInt points to age now\"\
  \ << endl;\n 9:\n10:    // Display the value of pointer\n11:    cout << \"pointsToInt\
  \ = 0x\" << hex << pointsToInt << endl;\n12:\n13:    int dogsAge = 9;\n14:    pointsToInt\
  \ = &dogsAge;\n15:    cout << \"pointsToInt points to dogsAge now\" << endl;\n16:\n\
  17:    cout << \"pointsToInt = 0x\" << hex << pointsToInt << endl;\n18:\n19:   \
  \ return 0;\n20: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\npointsToInt points to\
  \ age now\npointsToInt = 0x002EFB34\npointsToInt points to dogsAge now\npointsToInt\
  \ = 0x002EFB1C\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n该程序演示了一个整型指针 `pointsToInt` 可以指向任何整数。在第\
  \ 7 行中，它被初始化为 `&age`，因此包含了变量 `age` 的地址。在第 14 行中，同一个指针被赋值为 `&dogsAge`，指向内存中包含 `dogsAge`\
  \ 的另一个位置。相应地，输出表明指针的值（即所指向的地址）发生了变化，因为两个整数 `age` 和 `dogsAge` 显然分别存储在不同的内存位置，分别为\
  \ `0x002EFB34` 和 `0x002EFB1C`。\n\n### 使用解引用运算符 (`*`) 访问指向的数据\n\n如果你有一个包含有效地址的指针，你如何访问该位置——即获取或设置该位置处的数据？答案在于使用解引用运算符（`*`）。本质上，如果你有一个有效指针\
  \ `pData`，你使用 `*pData` 来访问存储在指针所含地址处的值。解引用运算符（`*`）的使用在列表 8.4 中得到了。\n\n### 输入 ▼\n\
  \n列表 8.4 演示使用解引用运算符 (`*`) 访问整数值\n\n```\n 0: #include<iostream>\n 1: using namespace\
  \ std;\n 2:\n 3: int main()\n 4: {\n 5:    int age = 30;\n 6:    int dogsAge = 9;\n\
  \ 7:\n 8:    cout << \"Integer age = \" << age << endl;\n 9:    cout << \"Integer\
  \ dogsAge = \" << dogsAge << endl;\n10:\n 11:    int* pointsToInt = &age;\n 12:\
  \    cout << \"pointsToInt points to age\" << endl;\n 13:\n 14:    // Display the\
  \ value of pointer\n 15:    cout << \"pointsToInt = 0x\" << hex << pointsToInt <<\
  \ endl;\n 16:\n 17:    // Display the value at the pointed location\n 18:    cout\
  \ << \"*pointsToInt = \" << dec << *pointsToInt << endl;\n 19:\n 20:    pointsToInt\
  \ = &dogsAge;\n 21:    cout << \"pointsToInt points to dogsAge now\" << endl;\n\
  \ 22:\n 23:    cout << \"pointsToInt = 0x\" << hex << pointsToInt << endl;\n 24:\
  \    cout << \"*pointsToInt = \" << dec << *pointsToInt << endl;\n 25:\n 26:   \
  \ return 0;\n 27: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nInteger age = 30\nInteger\
  \ dogsAge = 9\npointsToInt points to age\npointsToInt = 0x0025F788\n*pointsToInt\
  \ = 30\npointsToInt points to dogsAge now\npointsToInt = 0x0025F77C\n*pointsToInt\
  \ = 9\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n除了更改指针中存储的地址（如列表 8.3 所示），列表 8.4 中的程序还对同一个指针变量\
  \ `pointsToInt` 使用解引用运算符（`*`）来显示这两个地址处的不同值。注意第 18 行和第 24 行。在这两行中，都访问了 `pointsToInt`\
  \ 指向的整数。\n\n\n\n\n```cpp\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n\
  \ 3: int main()\n 4: {\n 5:    cout << \"sizeof fundamental types -\" << endl;\n\
  \ 6:    cout << \"sizeof(char) = \" << sizeof(char) << endl;\n 7:    cout << \"\
  sizeof(int) = \" << sizeof(int) << endl;\n 8:    cout << \"sizeof(double) = \" <<\
  \ sizeof(double) << endl;\n 9:\n10:    cout << \"sizeof pointers to fundamental\
  \ types -\" << endl;\n11:    cout << \"sizeof(char*) = \" << sizeof(char*) << endl;\n\
  12:    cout << \"sizeof(int*) = \" << sizeof(int*) << endl;\n13:    cout << \"sizeof(double*)\
  \ = \" << sizeof(double*) << endl;\n14:\n15:    return 0;\n16: }\n```\n\n点击此处查看代码图片\n\
  \n### 输出 ▼\n\n```\nsizeof fundamental types -\nsizeof(char) = 1\nsizeof(int) = 4\n\
  sizeof(double) = 8\nsizeof pointers to fundamental types -\nsizeof(char*) = 4\n\
  sizeof(int*) = 4\nsizeof(double*) = 4\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n输出清楚地显示，尽管\
  \ `sizeof(char)` 是 1 字节而 `sizeof(double)` 是 8 字节，但 `sizeof(char*)` 和 `sizeof(double*)`\
  \ 均为 4 字节。这是因为存储地址的指针所消耗的内存是相同的，无论该地址内存存储的是 1 字节还是 8 字节的数据。\n\n### 注意\n\nListing\
  \ 8.6 显示指针大小为 4 字节的输出可能与你在系统上看到的有所不同。该输出是在使用 32 位编译器编译代码时生成的。如果你使用 64 位编译器并在 64\
  \ 位系统上运行程序，你可能会看到指针变量的大小为 64 位——即 8 字节。\n\n### 动态内存分配\n\n当你编写一个包含如下数组声明的程序时：\n\n\
  ```cpp\nint myNums[100]; // 一个包含 100 个整数的静态数组\n```\n\n点击此处查看代码图片\n\n你的程序存在两个问题：\n\
  \n* 你实际上限制了程序的容量，因为它无法存储超过 100 个数字。\n* 在只需要存储 1 个数字但预留了 100 个数字空间的情况下，你降低了系统的性能。\n\
  \n这些问题的存在是因为早些声明的数组中的内存分配是静态的，并由编译器固定的。\n\n为了编写能够根据用户需求优化消耗内存资源的应用程序，你需要使用动态内存分配。这允许你会在需要时分配更多内存，并释放多余的内存。C++\
  \ 提供了两个运算符 `new` 和 `delete` 来帮助你更好地管理应用程序的内存消耗。指针作为包含内存地址的变量，在高效的动态内存分配中起着至关重要的作用。\n\
  \n#### 使用运算符 `new` 和 `delete` 动态分配和释放内存\n\n你使用 `new` 分配新的内存块。`new` 最常用的形式在成功时返回一个指向请求内存的指针，否则将抛出异常。使用\
  \ `new` 时，你需要指定为哪个数据类型分配内存：\n\n```cpp\nType* pointer = new Type; // 为一个元素请求内存\n\
  ```\n\n点击此处查看代码图片\n\n你也可以指定想要为该内存分配的元素数量（当你需要为多个一个元素分配内存时）：\n\n```cpp\nType* pointer\
  \ = new Type[numElements]; // 为 numElements 个元素请求内存\n```\n\n点击此处查看代码图片\n\n因此，如果你需要分配整数，可以使用以下代码：\n\
  \n```cpp\nint* pointToAnInt = new int;  // 获取一个整数的指针\nint* pointToNums = new int[10];\
  \  // 指向 10 个整数块的指针\n```\n\n点击此处查看代码图片\n\n### 注意\n\n注意 `new` 表示对内存的请求。不能保证分配调用总是成功，因为它取决于系统状态和内存资源的可用性。\n\
  \n每个使用 `new` 的分配最终都需要通过 `delete` 进行等效反向的释放操作来释放：\n\n```cpp\nType* pointer = new\
  \ Type; // 分配内存\ndelete pointer;  // 释放上面分配的内存\n```\n\n点击此处查看代码图片\n\n该规则也适用于你为多个元素请求内存：\n\
  \n```cpp\nType* pointer = new Type[numElements]; // 分配一个块\ndelete[] pointer; //\
  \ 释放上面分配的块\n```\n\n点击此处查看代码图片\n\n### 注意\n\n注意 `new` 表示对内存的请求。不能保证分配调用总是成功，因为取决于系统状态和内存资源的可用性。\n\
  \n每个使用 `new` 的分配最终都需要通过 `delete` 进行等效反向的释放操作来释放：\n\n（注：此处原文中存在重复且逻辑混乱的部分，已按指令进行了最小化排版）\n\
  \nListing 8.6 显示指针大小为 4 字节的输出可能与你在系统上看到的有所不同。该输出是在使用 32 位编译器编译代码时生成的。如果你使用 64 位编译器并在\
  \ 64 位系统上运行程序，你可能会看到指针变量的大小为 64 位——即 8 字节。\n\n### 动态内存分配\n\n当你编写一个包含如下数组声明的程序时：\n\
  \n```cpp\nint myNums[100]; // 一个包含 100 个整数的静态数组\n```\n\n点击此处查看代码图片\n\n你的程序存在两个问题：\n\
  \n* 你实际上限制了程序的容量，因为它无法存储超过 100 个数字。\n* 在只需要存储 1 个数字但预留了 100 个数字空间的情况下，你降低了系统的性能。\n\
  \n这些问题的存在是因为早些声明的数组中的内存分配是静态的，并由编译器固定的。\n\n为了编写能够根据用户需求优化消耗内存资源的应用程序，你需要使用动态内存分配。这允许你会在需要时分配更多内存，并释放多余的内存。C++\
  \ 提供了两个运算符 `new` 和 `delete` 来帮助你更好地管理应用程序的内存消耗。指针作为包含内存地址的变量，在高效的动态内存分配中起着至关重要的作用。\n\
  \n#### 使用运算符 `new` 和 `delete` 动态分配和释放内存\n\n你使用 `new` 分配新的内存块。`new` 最常用的形式在成功时返回一个指向请求内存的指针，否则将抛出异常。使用\
  \ `new` 时，你需要指定为哪个数据类型分配内存：\n\n```cpp\nType* pointer = new Type; // 为一个元素请求内存\n\
  ```\n\n点击此处查看代码图片\n\n你也可以指定想要为该内存分配的元素数量（当你需要为多个一个元素分配内存时）：\n\n```cpp\nType* pointer\
  \ = new Type[numElements]; // 为 numElements 个元素请求内存\n```\n\n点击此处查看代码图片\n\n因此，如果你需要分配整数，可以使用以下代码：\n\
  \n```cpp\nint* pointToAnInt = new int;  // 获取一个整数的指针\nint* pointToNums = new int[10];\
  \  // 指向 10 个整数块的指针\n```\n\n点击此处查看代码图片\n\n### 注意\n\n注意 `new` 表示对内存的请求。不能保证分配调用总是成功，因为取决于系统状态和内存资源的可用性。\n\
  \n每个使用 `new` 的分配最终都需要通过 `delete` 进行等效反向的释放操作来释放：\n\n```cpp\nType* pointer = new\
  \ Type; // 分配内存\ndelete pointer;  // 释放上面分配的内存\n```\n\n点击此处查看代码图片\n\n该规则也适用于你为多个元素请求内存：\n\
  \n```cpp\nType* pointer = new Type[numElements]; // 分配一个块\ndelete[] pointer; //\
  \ 释放上面分配的块\n```\n\n点击此处查看代码图片\n\n\n\n\n此列表中最重要的行是第 10 行和第 15 行，它们分别使用了 `new[]` 和\
  \ `delete[]` 运算符。此示例与列表 8.7 的不同之处在于，它动态分配了一块内存，该内存可以容纳用户请求的任意整数。输出显示为 5001 个整数分配了空间。在另一个运行中，它可能是\
  \ 20 或 55000。该程序将根据用户输入在每次执行时分配不同数量的内存。此类元素数组的分配需要对应的释放，随后使用 `delete[]` 来释放内存。\n\
  \n### 注意\n\n`new` 和 `delete` 运算符从自由存储区（free store）分配内存。`自由存储区`是一种以内存池形式存在的内存抽象，应用程序可以从中分配（即预留）内存，并向其释放（即回收）内存。\n\
  \n### 递增（++）和递减（--）运算符对指针的影响\n\n指针包含包含一个内存地址。例如，列表 8.3 中指向整数的指针包含 `0x002EFB34`——该整数所在的地址。整数本身长度为\
  \ 4 字节，因此在内存中占用四个位置，从 `0x002EFB34` 到 `0x002EFB37`。使用运算符 `++` 增加此指针不会导致指针指向 `0x002EFB35`，因为指向整数的中间是没有意义的。\n\
  \n对指针的递增或递减操作被编译器解释为需要指向内存块中的下一个值（假设其类型相同），而不是指向下一个字节（除非该值类型的大小为 1 字节，例如 `char`）。\n\
  \n因此，对像列表 8.3 中的 `pointsToInt` 这样的指针进行递增会导致其增加 4 字节，即 `int` 的大小。通过对该指针使用 `++`，你告诉编译器你希望它指向下一个连续的整数。因此，递增后，指针指向了\
  \ `0x002EFB38`。同样，给此指针加 2 会导致其向前移动 2 个整数——即向前移动 8 字节。指针展示的这种行为与数组中使用的索引之间的相关性在本章稍后部分提供。\n\
  \n使用运算符 `--` 递减指针展示了相同的效果：指针中包含的地址值减少了它所指向的数据类型的大小。\n\n### 当你递增或递减指针时发生了什么？\n\n\
  当你递增或递减指针时，指针中包含的地址会根据所指向类型的 `sizeof()` 增加或递减（而不一定是一个字节）。通过这种方式，编译器确保指针永远不会指向内存中数据的中间或结尾；它只指向开头。\n\
  \n如果指针被声明为：\n\n```\nType* pType = Address;\n```\n\n`++pType` 意味着 `pType` 包含（并因此指向）`Address\
  \ + sizeof(Type)`。\n\n列表 8.9 说明了递增指针或对其添加偏移量的影响。\n\n#### 输入 ▼\n\n列表 8.9 使用偏移量值和运算符递增和递减指针\n\
  \n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n 4:\
  \ {\n 5:    cout << \"How many integers you wish to enter? \";\n 6:    int numEntries\
  \ = 0;\n 7:    cin >> numEntries;\n 8:\n 9:    int* pointsToInts = new int[numEntries];\n\
  10:\n11:    cout << \"Allocated for \"\" integers\" << endl;\n 12:    for(int counter\
  \ = 0; counter < numEntries; ++counter)\n 13:    {\n 14:       cout << \"Enter number\
  \ \" << counter << \": \";\n 15:       cin >> *(pointsToInts + counter);\n 16: \
  \   }\n 17:\n 18:    cout << \"Displaying all numbers entered: \" << endl;\n 19:\
  \    for(int counter = 0; counter < numEntries; ++counter)\n 20:       cout << *(pointsToInts++)\
  \ << \" \";\n 21:\n 22:    cout << endl;\n 23:\n 24:    // 返回指针到初始位置\n 25:    pointsToInts\
  \ -= numEntries;\n 26:\n 27:    // 内存用完毕？释放\n 28:    delete[] pointsToInts;\n 29:\n\
  \ 30:    return 0;\n 31: }\n```\n\n#### 输出 ▼\n\n第一次运行：\n\n```\nHow many integers\
  \ you wish to enter? 2\nAllocated for 2 integers\nEnter number 0: 8774\nEnter number\
  \ 1: -5\nDisplaying all numbers entered:\n8774 -5\n```\n\n下次运行：\n\n```\nHow many\
  \ integers you wish to enter? 2\nAllocated for 2 integers\nEnter number 0: 8774\n\
  Enter number 1: -5\nDisplaying all numbers entered:\n8774 -5\n```\n\n#### 分析 ▼\n\
  \n程序使用 `pointsToInts` 存储整数数组。`numEntries` 变量决定了分配的大小。第一个 `for` 循环使用 `*(pointsToInts\
  \ + counter)` 赋值。第二个 `for` 循环使用 `*(pointsToInts++)` 显示值，这递增了指针本身。最后，`pointsToInts\
  \ -= numEntries` 在 `delete[] pointsToInts` 释放内存之前重置了指针。\n\n### 在指针上使用 `const` 关键字\n\
  \n在第 33 节 中，你学习了将变量声明为 `const` 可以有效确保变量的值在其生命周期内是固定的。`const` 变量的值不能更改，因此不能作为左值。\n\
  \n指针也是变量，因此适用于变量的 `const` 关键字同样适用于指针。然而指针是一种特殊的变量，因为它包含一个内存地址并用于修改该地址的内存。因此，当涉及指针和常量时，有以下情况：\n\
  \n- 指针包含的地址是常量且不可更改，但该地址处的数据可以更改：\n\n```cpp\nint daysInMonth = 30;\nint* const pDaysInMonth\
  \ = &daysInMonth;\n*pDaysInMonth = 31; // 可以！所指向的数据可以更改\nint daysInLunarMonth =\
  \ 28;\npDaysInMonth = &daysLunarMonth; // 不可以！不能更改地址！\n```\n\n- 所指向的数据是常量且不可更改，但指针中包含的地址可以更改（也就是说，指针也可以指向其他处）：\n\
  \n```cpp\nint hoursInDay = 24;\nconst int* pointsToInt = &hoursInDay;\nint monthsInYear\
  \ = 12;\npointsToInt = &monthsInYear; // 可以！\n*pointsToInt = 13; // 不可以！不能更改所指向的数据\n\
  int* newPointer = pointsToInt; //错误：将 const 赋值给非 const\n```\n\n\n\n\n-   指针中所包含的地址和所指向的值都是常量，且无法更改（限制性最强的变体）：\n\
  \n```\n int hoursInDay = 24;\n   const int* const pHoursInDay = &hoursInDay;\n \
  \  *pHoursInDay = 25; // 错误！不能更改所指向的数据\n   int daysInMonth = 30;\n   pHoursInDay\
  \ = &daysInMonth; // 错误！不能更改地址\n```\n\n点击此处查看代码图像\n\n这些不同形式的 `const` 在向函数传递指针时特别有用用。建议在声明函数参数时支持尽可能可能的（限制性最强的）`const`\
  \ 级别。这可以保护你的应用程序免受使用函数参数时的意外修改。\n\n### 提示\n\n为了方便识别上述的三种 `const` 情况，请从右到左阅读它们。\n\
  \n第一种情况是指向整数的常量指针：\n\n```\nint* const pointerCannotChange = &value;\n```\n\n点击此处查看代码图像\n\
  \n第二种情况是指向常量整数的指针：\n\n```\nconst int* pointedDataCannotChange = &value;\n```\n\n\
  点击此处查看代码图像\n\n第三种情况是指向常量整数的常量指针：\n\n```\nconst int* const ptrAndDataCannotChange\
  \ = &value;\n```\n\n点击此处查看代码图像\n\n### 向函数传递指针\n\n使用指针是向函数传递包含相关数据的内存空间的有效方法。共享的内存空间也可以返回操作的结果。在与函数配合指针时，确保被调用的函数仅允许你想要它修改的参数——而不是其他参数。例如，一个通过指针发送半径来计算圆面积的函数不应该被允许修改半径。你可以使用\
  \ `const` 关键字来控制函数允许修改和不允许修改的内容，如列表 8.10 所示。\n\n#### 输入 ▼\n\n列表 8.10 计算圆面积时使用 `const`\
  \ 关键字\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: void CalcArea(const\
  \ double* const ptrPi, // 指向常量数据的常量指针\n 4:             const double* const ptrRadius,\
  \ // 即不允许任何更改\n 5:             double* const ptrArea)  // 可以更改所指向的数据\n 6: {\n 7:\
  \    // 使用前检查指针的有效性！\n 8:    if (ptrPi && ptrRadius && ptrArea)\n 9:       *ptrArea\
  \ = (*ptrPi) * (*ptrRadius) * (*ptrRadius);\n10: }\n11:\n12: int main()\n13: {\n\
  \ 14:    const double Pi = 3.1416;\n 15:\n 16:    cout << \"Enter radius of circle:\
  \ \";\n 17:    double radius = 0;\n 18:    cin >> radius;\n 19:\n 20:    double\
  \ area = 0;\n 21:    CalcArea (&Pi, &radius, &area);\n 22:\n 23:    cout << \"Area\
  \ is = \" << area << endl;\n 24:\n 25:    return 0;\n 26: }\n```\n\n点击此处查看代码图像\n\
  \n#### 输出 ▼\n\n```\nEnter radius of circle: 10.5\nArea is = 346.361\n```\n\n点击此处查看代码图像\n\
  \n#### 分析 ▼\n\n第 3 行和第 4 行展示了 `const` 的形式，`ptrRadius` 和 `ptrPi` 都作为“指向常量数据的常量指针”提供，因此指针地址和所指向的数据都无法修改。第\
  \ 5 行声明的 `ptrArea` 显然是用于存储输出的参数，因为指针包含的值（地址）不能修改，但所指向的数据可以。第 8 行展示了在使用函数的指针参数之前如何进行有效性检查。如果调用者无意中向三个参数中的任何一个发送\
  \ `NULL` 指针，你不希望函数计算面积，因为这会导致访问违规并引发应用程序崩溃。\n\n### 数组与指针之间的相似性\n\n你不认为列表 8.9 中的代码——使用从零开始的索引增加指针以访问下一个下一个整数——与数组索引的方式有太多的相似之处吗？当你这样定义一个整数数组时：\n\
  \n```\nint myNumbers[5];\n```\n\n你告诉编译器分配固定数量的内存来存储五个整数，并给你一个该数组中第一个元素的指针，该元素由你分配给数组变量的名称标识。换句话说，`myNumbers`\
  \ 是指向第一个元素 `myNumbers[0]` 的指针。列表 8.11\n\n#### 输入 ▼\n\n列表 8.11 证明数组变量是指针\n\n```\n\
  \ 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n\
  \ 5:    int myNumbers[5] = {10, 20, 30, 40, 50};\n 6:\n 7:    int* pointerToNums\
  \ = myNumbers;\n 8:\n 9:    std::cout << \"First element: \" << pointerToNums[0]\
  \ << std::endl;\n 10:   std::cout << \"Second element: \" << *(pointerToNums + 1)\
  \ << std::endl;\n 11:\n 12:    return 0;\n 13: }\n```\n\n#### 输出 ▼\n\n```\nFirst\
  \ element: 10\nSecond element: 20\n```\n\n#### 分析 ▼\n\n上述代码证明了数组名 `myNumbers` 充当指向第一个元素的指针。使用\
  \ `pointerToNums[0]` 或 `*(pointerToNums + 1)` 是使用指针运算遍历数组的等效方式。\n\n\n\n\n\n该应用程序包含一个拥有五个整数的静态数组，并在第\
  \ 8 行初始化了五个初始值。该程序使用两种替代方法显示此数组的内容：一种是在第 15 行使用数组变量 `myNumbers` 配合间接操作符（`*`），另一种是在第\
  \ 19 行使用指针变量配合数组操作符（`[]`）。\n\n因此，此程序演示了数组 `myNumbers` 和指针 `pointToNums` 都表现出指针行为。换句话说，数组声明类似于一个被创建用于在固定内存范围内操作的指针。请注意，你可以像第\
  \ 11 行那样将数组赋值给指针，但不能将指针赋值给数组。这是因为从本质上说，像 `myNumbers` 这样的数组是静态的，不能作为左值（l-value）；`myNumbers`\
  \ 无法被修改。\n\n### 注意事项\n\n务必记住，使用 `new` 运算符动态分配的指针，仍然需要使用 `delete` 运算符进行释放，即使你使用了通常用于静态数组的语法来访问数据。\n\
  \n如果你忘记了这一点，你的应用程序就会内存泄漏，这是糟糕的。\n\n### 使用指针时的常见编程错误\n\nC++ 允许你动态分配内存，以便你优化并控制应用程序的内存消耗。与使用运行时环境的语言（如\
  \ C# 和 Java）不同，C++ 并没有在内存资源不再需要时自动释放它们的垃圾回收机制。这种对指针管理内存资源的惊人控制力，也伴随着许多犯错的机会。\n\n\
  ### 内存泄漏\n\n这可能是编写不当的 C++ 应用程序中最常见的问题之一：程序运行时间越长，消耗的内存越多，系统运行越慢。内存泄漏通常发生在程序员没有确保应用程序在内存块不再需要后，通过匹配的\
  \ `delete` 调用来释放使用 `new` 动态分配的内存。\n\n确保所有分配的内存都被应用程序释放是你——程序员的责任。如下这种情况永远不应该发生：\n\
  \n```\nint* pointToNums = new int[5]; // 初始分配\n// 使用 pointToNums\n...\n// 忘记使用 delete[]\
  \ 释放 pointToNums\n...\n// 再次分配并覆盖\npointToNums = new int[10]; // 泄漏了之前分配的内存\n```\n\
  \n点击此处查看代码图像\n\n#### 指向无效内存位置的指针\n\n当你使用 `*` 运算符解引用指针以访问所指向的值时，你需要确保指针包含一个有效的内存位置，否则你的程序将崩溃或运行异常。尽管这在逻辑上可行，但无效指针是导致应用程序崩溃的相当常见的原因。指针失效的原因有很多，且主要是由于糟糕的编程和内存管理。指针可能无效的一个典型案例见列表\
  \ 8.13。\n\n##### 输入 ▼\n\n列表 8.13 使用指针存储布尔值程序中糟糕的指针卫生\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n 5:    // 未初始化的指针（坏的）\n 6:\
  \    bool* isSunny;\n 7:\n 8:    cout << \"Is it sunny (y/n)? \";\n 9:    char userInput\
  \ = 'y';\n 10:    cin >> userInput;\n 11:\n 12:    if (userInput == 'y')\n 13: \
  \   {\n 14:       isSunny = new bool;\n 15:       *isSunny = true;\n 16:    }\n\
  \ 17:\n 18:    // 如果用户输入 'n'，isSunny 包含无效值\n 19:    cout << \"Boolean flag sunny\
  \ says: \" << *isSunny << endl;\n 20:\n 21:    // 在 new 未调用时也调用了 delete\n 22:  \
  \  delete isSunny;\n 23:\n 24:    return 0;\n 25: }\n```\n\n点击此处查看代码图像\n\n#####\
  \ 输出 ▼\n\n首次运行：\n\n```\nIs it sunny (y/n)? y\nBoolean flag sunny says: 1\n```\n\n\
  点击此处查看代码图像\n\n第二次运行：\n\n```\nIs it sunny (y/n)? n\n<CRASH!>\n```\n\n点击此处查看代码图像\n\
  \n##### 分析 ▼\n\n此示例包含了刻意编写的问题，用于解释糟糕的指针卫生。如果你的编译器报错，请不要惊讶。注意第 14 行中内存是如何被分配并赋值给指针的，该行在用户按下\
  \ `y` 表示是时条件执行的。对于用户的其他所有输入，此 `if` 块都不会执行，指针 `isSunny` 保持为无效状态。因此，当用户在第二次运行中按下 `n`\
  \ 时，应用程序崩溃，因为 `isSunny` 包含一个无效的内存地址，而在第 19 行中解引用无效指针会导致问题。\n\n同样，如第 22 行所示，对这个没有通过\
  \ `new` 分配的指针调用 `delete` 同样是错误的。如果你有一个指针的副本，你只需要对其中一个调用 `delete`；你还需要避免拥有它们的副本。\n\
  \n### 悬空指针（也称为野指针）\n\n注意，任何指针在被删除后都是无效的。为了避免这个问题，一些程序员遵循在初始化指针时给其赋值 `NULL` 的习惯。他们还会在解引用指针之前检查其的有效性（通过与\
  \ `NULL` 比较）。\n\n##### 输入 ▼\n\n列表 8.14 更安全的指针编程：列表 8.13 的修正\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n 5:     cout << \"Is it sunny\
  \ (y/n)? \";\n 6:     char userInput = 'y';\n 7:     cin >> userInput;\n 8:\n 9:\
  \     // 声明指针并初始化\n 10:     bool* const isSunny = new bool;\n 11:     *isSunny =\
  \ true;\n 12:\n 13:     if (userInput == 'n')\n 14:        *isSunny = false;\n 15:\n\
  \ 16:     cout << \"Boolean flag sunny says: \" << *isSunny << endl;\n 17:\n 18:\
  \     // 释放有效内存\n 19:     delete isSunny;\n 20:\n 21:     return 0;\n 22: }\n```\n\
  \n点击此处查看代码图像\n\n##### 输出 ▼\n\n首次运行：\n\n```\nIs it sunny (y/n)? y\nBoolean flag sunny\
  \ says: 1\n```\n\n点击此处查看代码图像\n\n下次运行：\n\n```\nIs it sunny (y/n)? n\nBoolean flag\
  \ sunny says: 0\n```\n\n点击此处查看代码图像\n\n##### 分析 ▼\n\n这种重构使得代码在所有用户输入情况下都变得更安全。注意指针在声明时已初始化为有效的内存地址。在这里你使用\
  \ `const` 来确保虽然指向的数据可以被修改，但指针的值（即包含的地址）保持固定且不可更改。这种数据初始化增加的不是程序的稳定性，而是输出的可靠性。这些步骤确保了指针在程序的剩余部分是有效的，并且在每种输入组合下都在第\
  \ 19 行安全释放。\n\n（无论用户如何输入，都不会崩溃。）\n\n#### 检查使用 `new` 的分配请求是否成功\n\n\n\n\n\n到目前为止的代码，我们假设\
  \ `new` 会返回一个指向内存块的有效指针。事实上，`new` 通常会成功，除非应用程序请求了异常巨大的内存量，或者系统处于某种关键状态，导致没有多余的内存。某些应用程序需要请求大块内存（例如，数据库应用程序）。因此，C++\
  \ 为你提供了两种可能的方法来确保指针在你在使用之前是有效的。默认方法——即我们迄为止一直使用的方法——是使用`exceptions`（异常），其中分配失败会导致`thrown`（抛出）一个类型为\
  \ `std::bad_alloc` 的异常。异常会导致程序的执行被中断，除非你编写了`exception handler`（异常处理器），否则程序将以一种并不优雅的方式带有“unhandled\
  \ exception”（未处理的异常）错误消息结束。\n\n异常将在第 28 节“异常处理”中进行详细解释。列表 8.15 让你初步了解如何使用异常处理来检查失败的内存分配请求。如果你在这个阶段觉得异常处理复杂无从，不要太担心：在这里提到它只是为了内存分配这一主题的完整性。你可以在阅读第\
  \ 28 节后再次查看此示例。\n\n### 输入 ▼\n\n列表 8.15 当 `new` 失败时处理异常并优雅退出\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: // remove the try-catch block to see this application\
  \ crash\n 4: int main()\n 5: {\n 6:    try\n 7:    {\n 8:       // Request a LOT\
  \ of memory!\n 9:      int* pointsToManyNums = new int [0x1fffffff];\n10:      //\
  \ Use the allocated memory\n11:\n12:      delete[] pointsToManyNums;\n13:    }\n\
  14:    catch (bad_alloc)\n15:    {\n16:       cout << \"Memory allocation failed.\
  \ Ending program\" << endl;\n17:    }\n18:    return 0;\n19: }\n```\n\n点击此处查看代码图像\n\
  \n### 输出 ▼\n\n```\nMemory allocation failed. Ending program\n```\n\n点击此处查看代码图像\n\
  \n### 分析 ▼\n\n此程序在你的计算机上执行情况可能会不同。我的环境无法成功为 536,870,911 个整数分配请求空间！如果没有异常处理器（第 14\
  \ 到 17 行中的`catch`块），程序将无法优雅地退出。你可以通过注释第 6 行和第 14 行来实验在没有异常处理器的情况下程序的行为。当使用使用 Microsoft\
  \ Visual Studio 构建的调试模式二进制文件时，程序执行结果将输出如图 8.2 所示。\n\n![显示了一个标题为 Exception Unhandled\
  \ 的弹出框。](img/08fig02.jpg)\n\n**图 8.2** 在列表 8.15 中缺少异常处理时的程序崩溃（使用 MSVC 编译器的调试生成版本）。\n\
  \n异常处理的`try-catch`结构因此帮助应用程序在告知用户内存分配问题阻碍了正常执行后进行受控的退出。\n\n对于那些不想依赖异常的人，有一个`new`\
  \ 的变体称为 `new(nothrow)`。该变体在分配请求失败时不会抛出异常；而是让运算符 `new` 返回 `NULL`。因此，可以在被赋值的指针在使用之前相对于\
  \ `NULL` 检查其有效性。参见列表 8.16。\n\n### 输入 ▼\n\n列表 8.16 使用 `new(nothrow)`，在分配失败时返回 `NULL`\n\
  \n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n 4:\
  \ {\n 5:    // Request LOTS of memory space, use nothrow\n 6:    int* pointsToManyNums\
  \ = new(nothrow) int [0x1fffffff];\n 7:\n 8:    if (pointsToManyNums) // check pointsToManyNums\
  \ != NULL\n 9:    {\n10:       // Use the allocated memory\n11:       delete[] pointsToManyNums;\n\
  12:    }\n13:    else\n14:       cout << \"Memory allocation failed. Ending program\"\
  \ << endl;\n15:\n16:    return 0;\n17: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\n\
  Memory allocation failed. Ending program\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n列表 8.16\
