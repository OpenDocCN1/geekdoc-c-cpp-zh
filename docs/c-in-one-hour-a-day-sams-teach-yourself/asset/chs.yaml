  \ `std::sort` 还是 `std::stable_sort`？\n\n## 第 24 节：适配容器：栈与队列\n\n标准模板库（STL）提供了适配其他容器来模拟栈和队列行为的容器。内部使用其他容器的容器被称为*适配容器*。\n\
  \n在本节中，你将学习\n\n* 栈和队列的特性\n* 使用 STL `stack`\n* 使用 STL `queue`\n* 使用 STL `priority_queue`\n\
  \n### 栈和队列的特性\n\n栈和队列类似于数组或列表，但对元素的插入和删除有限制。它们的特性完全由插入时元素的位置决定。\n\n#### 栈\n\n栈是\
  \ LIFO（后进先出）系统，可以在容器的顶部插入或删除元素。栈可以想象为一叠盘子。最后放入栈的盘子将是第一个被取的。中间和底部的盘子无法检查。这种在顶部添加和删除元素的组织方式如图\
  \ 24.1（ch24.xhtml_ch24fig1）所示。![插图显示了从 Element 0 到 Element N 的五个部分，叠在一起。指向插入（在顶部）的箭头指向栈。同样，另一个指向删除（从顶部）的箭头从栈延伸出来。](img/24fig01.jpg)\n\
  \n**图 24.1** 栈的操作。\n\n这种叠栈的行为在通用 STL 容器 `std::stack` 中模拟。\n\n提示\n\n要使用 `std::stack`，包含头文件\n\
  \n```cpp\n#include<stack>\n```\n\n#### 队列\n\n队列是 FIFO（先入先出）系统，元素可以插入在前一个元素后面，而先插入的元素先被移除。队列可以想象为邮局等待盖章的人群，较早加入队列的人先离开。这种在尾部添加但从前端移除元素的组织方式如图\
  \ 24.2（ch24.xhtml_ch24fig2）所示。\n\n\n\n\n\n![插图显示了四个从 Element N 到 Element 0 的部分，由线隔开。](img/24fig02.jpg)\n\
  \n**图 24.2** 队列的操作。\n\n队列的行为在通用 STL 容器 `std::queue` 中得到了模拟。\n\n提示\n\n要使用 `std::queue`，请包含头文件\n\
  \n```\n#include<queue>\n```\n\n### 使用 STL `stack` 类\n\n`stack` 是一个 STL 类，需要包含头文件\
  \ `<stack>`。它是一个通用类，允许在顶部插入和删除元素，不允许对中间元素进行任何访问或检查。从这个意义上说，`std::stack` 的行为与盘栈非常相似。\n\
  \n#### 实例化栈\n\n`std::stack` 在某些 STL 实现中定义如下：\n\n```\ntemplate <\n   class elementType,\n\
  \   class Container=deque<Type>\n> class stack;\n```\n\n点击此处查看代码图像\n\n参数 `elementType`\
  \ 是栈收集的对象类型。第二个模板参数 `Container` 是栈的默认底层容器实现类。`std::deque` 是栈内部数据存储的默认值，可以被 `std::vector`\
  \ 或 `std::list` 替换。因此，整数栈的实例化如下：\n\n```\nstd::stack<int> numsInStack;\n```\n\n如果你想创建一个任意类型对象的栈（例如在\
  \ `Tuna` 中），将使用以下代码：\n\n```\nstd::stack <Tuna> tunasInStack;\n```\n\n要创建一个使用不同底层容器的栈，请使用\n\
  \n```\nstd.stack<double, vector <double> > doublesStackedInVec;\n```\n\n点击此处查看代码图像\n\
  \n列表 24.1 展示了不同的实例化技术。\n\n##### 输入 ▼\n\n列表 24.1 实例化 STL 栈\n\n```\n 0: #include<stack>\n\
  \ 1: #include<vector>\n 2:\n 3: int main()\n 4: {\n 5:    using namespace std;\n\
  \ 6:\n 7:    // 一个整数栈\n 8:    stack<int> numsInStack;\n 9:\n10:    // 一个双精度数栈\n\
  \ 11:    stack <double> dblsInStack;\n 12:\n 13:    // 一个包含在 vector 中的双精度数栈\n 14:\
  \    stack<double, vector<double>> doublesStackedInVec;\n 15:\n 16:    // 初始化一个栈作为栈的拷贝\n\
  \ 17:    stack<int> numsInStackCopy(numsInStack);\n 18:\n 19:    return 0;\n 20:\
  \ }\n```\n\n点击此处查看代码图像\n\n##### 输出 ▼\n\n此代码段没有输出\n\n##### 分析 ▼\n\n此示例没有输出，但演示了 STL\
  \ `stack` 容器的模板实例化。第 8 行和第 11 行实例化了两个 `stack` 对象，分别持有 `int` 和 `double` 类型的元素。第 14\
  \ 行也实例化了一个 `double` 栈，但指定了第二个模板参数——栈内部应该使用的集合类类型，即 `vector`。如果未提供第二个模板参数，栈将默认使用\
  \ `std::deque`。最后，第 17 行演示了一个 `stack` 对象可以作为另一个栈的拷贝来构造。\n\n#### 栈成员函数\n\n栈通过适配另一个容器（如\
  \ `deque`、`list` 或 `vector`），通过限制插入或删除元素的方式来实现功能，从而提供严格符合栈式机制的行为。表 24.1 描述了 `stack`\
  \ 类的公共成员函数，并演示了它们在整数栈中的用法。\n\n| 函数 | 说明 | 示例 |\n\n| --- | --- | --- |\n\n| `push()`\
  \ | 在栈顶插入一个元素 | `numsInStack.push(25);` |\n| `pop()` | 栈顶的元素 | `numsInStack.pop();`\
  \ |\n| `empty()` | 测试栈是否为空；返回 `bool` | `if (numsInStack.empty())DoSomething();`\
  \ |\n| `size()` | 返回栈中元素的数量 | `size_t numElements = numsInStack.size();` |\n| `top()`\
  \ | 获取栈中顶层元素的引用 | `cout << \"Element at the top = \" << numsInStack.top();` |\n\n\
  **表 24.1** `std::stack` 的常用成员函数\n\n如表所示，栈的公共成员函数仅暴露允许在符合栈行为的位置进行插入和删除。也就是说，尽管底层容器可能是\
  \ `deque`、`vector` 或 `list`，该容器的功能并未暴露，以强制执行栈的行为特征。\n\n#### 使用 `push()` 和 `pop()`\
  \ 在顶部进行插入和删除\n\n元素的插入通过使用成员方法 `stack<T>::push()` 完成：\n\n```\nnumsInStack.push(25);\
  \ // 25 是栈顶\n```\n\n栈适配另一个容器（如 `deque`、`list` 或 `vector`），通过限制插入或删除元素的方式来提供严格符合栈式机制的行为。表\
  \ 24.1 描述了 `stack` 类的公共成员函数，并演示了它们在整数栈中的用法。\n\n```\nnumsInStack.push(25); // 25\
  \ 是栈顶\n```\n\n如果你想移除顶部的元素，可以使用 `pop()`：\n\n```\nnumsInStack.pop(); // 移除顶部元素\n```\n\
  \n列表 24.2 演示了使用 `push()` 向栈插入元素并使用 `pop()` 移除。\n\n##### 输入 ▼\n\n列表 24.2 使用栈\n\n\
  ```\n 0: #include<stack>\n 1: #include<vector>\n 2:\n 3: int main()\n 4: {\n 5:\
  \    using namespace std;\n 6:\n 7:    // 一个整数栈\n 8:    stack<int> numsInStack;\n\
  \ 9:\n10:    // 一个双精度数栈\n 11:    stack <double> dblsInStack;\n 12:\n 13:    // 一个包含在\
  \ vector 中的双精度数栈\n 14:    stack<double, vector<double>> doublesStackedInVec;\n 15:\n\
  \ 16:    // 初始化一个栈作为栈的拷贝\n 17:    stack<int> numsInStackCopy(numsInStack);\n 18:\n\
  \ 19:    return 0;\n 20: }\n```\n\n\n\n\n在 STL 中，`queue` 是一个模板类，需要包含头文件 `<queue>`。它是一个通用类，仅允许在末尾插入元素，仅允许在头部移除元素。队列不允许对中间元素进行任何访问或检查；然而，可以访问开头和结尾的元素。从某种意义上说，`std::queue`\
  \ 的行为与超市银台的人排队非常相似。\n\n### 实例化队列\n\n`std::queue` 的定义如下：\n\n```cpp\ntemplate <\n\
  \   class elementType,\n   class Container = deque<Type>\n> class queue;\n```\n\n\
  点击此处查看代码图像\n\n在这里，`elementType` 是队列对象收集的元素类型。`Container` 是 `std::queue` 类用于维护其数据的容器类型。`std::list`、`vector`\
  \ 和 `deque` 都是该模板参数的可能候选类型，而 `deque` 是默认值。\n\n整数队列的最简单实例化方式如下：\n\n```cpp\nstd::queue<int>\
  \ numsInQ;\n```\n\n如果你想在 `std::list` 内部创建一个包含 `double` 类型元素的队列（而不是默认的 `deque`），请使用以下代码：\n\
  \n```cpp\nstd::queue<double, list <double>> dblsInQInList;\n```\n\n就像栈一样，队列也可以实例化为另一个队列的拷贝：\n\
  \n```cpp\nstd::queue<int> copyQ(numsInQ);\n```\n\n列表 24.3 展示了 `std::queue` 的各种实例化技术。\n\
  \n#### 输入 ▼\n\n列表 24.3 实例化一个 STL 队列\n\n```cpp\n 0: #include<queue>\n 1: #include<list>\n\
  \ 2:\n 3: int main()\n 4: {\n 5:    using namespace std;\n 6:\n 7:    // 一个整数队列\n\
  \ 8:    queue<int> numsInQ;\n 9:\n10:    // 一个双精度队列\n11:    queue <double> dblsInQ;\n\
  12:\n13:    // 内部存储在 list 中的双精度队列\n14:    queue <double, list<double>> dblsInQInList;\n\
  15:\n16:    // 作为另一个队列拷贝创建的队列\n17:    queue<int> copyQ(numsInQ);\n18:\n19:    return\
  \ 0;\n20: }\n```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n此代码段无输出\n\n#### 分析 ▼\n\n此示例演示了如何实例化通用\
  \ STL 类 `queue` 来创建一个整数队列（如第 8 行所示），或用于 `double` 类型对象的队列（如第 11 行所示）。第 14 行中实例化的\
  \ `dblsInQInList` 是一个队列，它在第二个模板参数中显式指定了要适配的底层容器应为 `std::list`。在缺少第二个模板参数的情况下（如前两个队列所示），使用\
  \ `std::deque` 作为队列内容的默认底层容器。\n\n### `queue` 类的成员函数\n\n`std::queue` 与 `std::stack`\
  \ 一样，其实现基于 vector、list 或 deque 等 STL 容器。`queue` 类仅暴露实现队列行为特征的成员函数。表 24.2 描述了使用 `numsInQ`\
  \ 的常用成员函数，而 列表 24.3 展示了这是一个整数队列。\n\n| 函数 | 描述 | 示例 |\n| --- | --- | --- |\n| `push()`\
  \ | 在队列末尾（即最后一个位置）插入元素 | `numsInQ.push(10);` |\n| `pop()` | 移除队列头部（即第一个位置）的元素 |\
  \ `numsInQ.pop();` |\n| `front()` | 返回队列头部元素的引用 | `cout << \"Element at front: \"\
  \ << numsInQ.front();` |\n| `back()` | 返回队列末尾元素（即最后一个插入的元素）的引用 | `cout << \"Element\
  \ at back: \" << numsInQ.back();` |\n| `empty()` | 测试队列是否为空；返回布尔值 | `if(numsInQ.empty())cout\
  \ << \"Queue is empty!\";` |\n| `size()` | 返回队列中的元素数量 | `size_t numElements = numsInQ.size();`\
  \ |\n\n**表 24.2** `std::queue` 中的常用成员函数\n\nSTL `queue` 类并不具备如 `begin()` 和 `end()`\
  \ 等函数，这些函数由大多数 STL 容器提供，包括 `queue` 类使用的底层 `deque`、`vector` 或 `list` 容器。这样做是为了确保队列上唯一允许的操作是符合队列行为特征的操作。\n\
  \n### 通过 `push()` 和 `pop()` 在队列的末尾插入和头部移除\n\n队列中元素的插入发生在末尾，并使用 `push()` 方法完成。相反，移除发生在头部，通过\
  \ `pop()` 方法完成。\n\n与 `stack` 不同，`queue` 允许对两端使用 `front()` 和 `back()` 进行检查。这些在 列表\
  \ 24.4 中演示。\n\n#### 输入 ▼\n\n列表 24.4 在队列中插入、移除和检查\n\n```cpp\n 0: #include<queue>\n\
  \ 1: #include<list>\n 2:\n 3: int main()\n 4: {\n 5:    using namespace std;\n 6:\n\
  \ 7:    // 一个整数队列\n 8:    queue<int> numsInQ;\n 9:\n10:    // 一个双精度队列\n11:    queue\
  \ <double> dblsInQ;\n12:\n13:    // 内部存储在 list 中的双精度队列\n14:    queue <double, list<double>>\
  \ dblsInQInList;\n15:\n16:    // 作为另一个队列拷贝创建的队列\n17:    queue<int> copyQ(numsInQ);\n\
  18:\n19:    // 向队列中添加元素\n20:    numsInQ.push(10);\n21:    numsInQ.push(20);\n22:\
  \    numsInQ.push(30);\n23:\n24:    // 检查头部和尾尾\n25:    cout << \"Element at front:\
  \ \" << numsInQ.front() << endl;\n26:    cout << \"Element at back: \" << numsInQ.back()\
  \ << endl;\n27:\n28:    // 从头部移除元素\n29:    numsInQ.pop();\n30:\n31:    // 再次检查\n\
  32:    cout << \"New front: \" << numsInQ.front() << endl;\n33:    cout << \"New\
  \ back: \" << numsInQ.back() << endl;\n34:\n35:    return 0;\n36: }\n```\n\n####\
  \ 输出 ▼\n\n```\nElement at front: 10\nElement at back: 30\nNew front: 20\nNew back:\
  \ 30\n```\n\n#### 分析 ▼\n\n此示例演示了如何使用 `queue` 类的 `push`、`pop`、`front` 和 `back` 方法。\n\
  \n### STL 优先级队列\n\n在 STL 中，`priority_queue` 是一个模板类，同样需要包含头文件 `<queue>`。`priority_queue`\
  \ 与 `queue` 不同之处在于，最高元素（或通过二元谓词认为最高的元素）位于队列头部，且队列操作限制在头部。\n\n#### 实例化 `priority_queue`\
  \ 类\n\n`std::priority_queue` 类的定义如下：\n\n```cpp\ntemplate <\n   class elementType,\n\
  \   class Container=vector<Type>,\n      class Compare=less<typename Container::value_type>\n\
  >\nclass priority_queue\n```\n\n点击此处查看代码图像\n\n\n\n\n在这里，`elementType` 是模板参数，用于传递要在优先级队列中收集的元素类型。第二个模板参数告诉\
  \ `priority_queue` 内部使用哪个类来存储数据，而第三个参数则允许程序员指定一个二元谓词，帮助队列确定位于顶部的元素。在没有指定二元谓词的情况下，`priority_queue`\
  \ 类使用 `std::less<>` 中的默认值，该值使用 `<` 运算符比较两个对象。\n\n整数优先级队列最简单的实例化方式是：\n\n```\nstd::priority_queue<int>\
  \ numsInPrioQ;\n```\n\n点击此处查看代码图片\n\n以下是您如何在 `std::deque` 内部创建一个包含 `double` 类型元素的优先级队列：\n\
  \n```\nstd::deque:\npriority_queue<int, deque<int>, greater<int>> numsInDescendingQ;\n\
  ```\n\n点击此处查看代码图片\n\n就像栈一样，优先级队列可以作为另一个队列的拷贝来实例化：\n\n```\nstd::priority_queue<int>\
  \ copyQ(numsInPrioQ);\n```\n\n点击此处查看代码图片\n\n`priority_queue` 对象的实例化在列表 24.5 中演示。\n\
  \n### 输入 ▼\n\n列表 24.5 实例化一个 STL `priority_queue` 对象\n\n```\n 0: #include<queue>\n\
  \ 1: #include<functional>\n 2:\n 3: int main()\n 4: {\n 5:    using namespace std;\n\
  \ 6:\n 7:    // 使用 std::less <> (默认) 排序的 int 优先级队列\n 8:    priority_queue<int> numsInPrioQ;\n\
  \ 9:\n10:    // double 优先级队列\n11:    priority_queue<double> dblsInPrioQ;\n12:\n\
  13:    // 使用 std::greater <> 排序的整数优先级队列\n14:    priority_queue<int, deque<int>,\
  \ greater<int>> numsInDescendingQ;\n15:\n16:    // 作为另一个拷贝创建的优先级队列\n17:    priority_queue<int>\
  \ copyQ(numsInPrioQ);\n18:\n19:    return 0;\n20: }\n```\n\n点击此处查看代码图片\n\n### 输出\
  \ ▼\n\n此代码段没有产生输出。\n\n### 分析 ▼\n\n第 8 行和第 11 行分别演示了 `int` 和 `double` 类型对象优先级队列的实例化。由于缺少任何其他模板参数，将使用\
  \ `std::vector` 作为数据的内部容器，并且默认比较准则由 `std::less<>` 提供。因此，这些队列具有这种优先级，使得值最大的整数位于优先级队列的前端。然而，`numsInDescendingQ`\
  \ 为第二个参数提供了一个 `deque` 作为内部容器，并使用 `std::greater` 作为谓词。该谓词导致队列中最小数字位于前端。\n\n使用谓词 `std::greater<T>`\
  \ 的效果将在本节稍后于列表 24.7 中进行说明。\n\n注意\n\n列表 24.5 包含了标准头文件 `<functional>` 以使用 `std::greater<>`。\n\
  \n### `priority_queue` 的成员函数\n\n`queue` 类中可成员函数 `front()` 和 `back()` 在 `priority_queue`\
  \ 类中不可用。表 24.3 引入了 `priority_queue` 类的成员函数。\n\n| 函数 | 描述 | 示例 |\n| --- | --- | ---\
  \ |\n| `push()` | 将元素插入优先级队列 | `numsInPrioQ.push(10);` |\n| `pop()` | 队列顶部的元素（即队列中最大的元素）\
  \ | `numsInPrioQ.pop();` |\n| `top()` | 返回队列中最大元素的引用（该元素也占据顶端位置） | `cout << \"The\
  \ largest element in the priority queue is: \" << numsInPrioQ.top();` |\n| `empty()`\
  \ | 测试优先级队列是否为空；返回一个 `boolean` 值 | `if(numsInPrioQ.empty())`cout << \"The queue\
  \ is empty!\";` |\n| `size()` | 返回优先级队列中的元素数量 | `size_t numElements = numsInPrioQ.size();`\
  \ |\n\n**表 24.3** `std::priority_queue` 中的常用成员函数\n\n如表所示，队列成员只能通过使用 `top()` 来访问，`top()`\
  \ 返回值最大的元素，并且可以使用用户定义的谓词或在没有用户定义谓词的情况下使用 `std::less` 来进行评估。\n\n### 通过 `push()` 和\
  \ `pop()` 在优先级队列的末尾插入和开头删除\n\n优先级队列中元素的插入是使用成员方法 `push()` 完成的：\n\n```\nnumsInPrioQ.push(5);\
  \  // 元素按顺序组织\n```\n\n点击此处查看代码图片\n\n另一方面，删除是通过 `pop()` 在开头进行的：\n\n```\nnumsInPrioQ.pop();\
  \  // 移除元素\n```\n\n点击此处查看代码图片\n\n优先级队列成员的使用在列表 24.6 中演示。\n\n### 输入 ▼\n\n使用 `push()`、`top()`\
  \ 和 `pop()` 操作优先级队列\n\n```\n 0: #include<queue>\n 1: #include<iostream>\n 2:\n 3:\
  \ int main()\n 4: {\n 5:    using namespace std;\n 6:\n 7:    priority_queue<int>\
  \ numsInPrioQ;\n 8:    cout << \"Inserting {10, 5, -1, 20} into the priority_queue\"\
  \ << endl;\n 9:    numsInPrioQ.push(10);\n 10:    numsInPrioQ.push(5);\n 11:   \
  \ numsInPrioQ.push(-1);\n 12:    numsInPrioQ.push(20);\n 13:\n 14:    cout << \"\
  Deleting \" << numsInPrioQ.size() << \" elements\" << endl;\n 15:    while(!numsInPrioQ.empty())\n\
  \ 16:    {\n 17:       cout << \"Deleting topmost element \" << numsInPrioQ.top()\
  \ << endl;\n 18:       numsInPrioQ.pop();\n 19:    }\n 20:\n 21:    return 0;\n\
  \ 22: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nInserting {10, 5, -1, 20} into the\
  \ priority_queue\nDeleting 4 elements\nDeleting topmost element: 20\nDeleting topmost\
  \ element: 10\nDeleting topmost element: 5\n```\n\n点击此处查看代码图片\n\n\n\n\n\n```\n将\
  \ {10, 5, -1, 20} 插入优先级队列\n删除 4 个元素\n删除顶部元素 -1\n删除顶部元素 5\n删除顶部元素 10\n删除顶部元素 20\n\
  ```\n\n点击此处查看代码图片\n\n### 分析\n\n在本示例中，大多数代码和提供给优先级队列的所有值都刻意地保持与列表 24.6 相同。然而，输出显示了两个队列是如何表现不同的。优先级队列中的元素是使用第\
  \ 8 行中的谓词 `greater<int>` 进行比较的。由于该谓词的作用，数值最小的整数被评估为比其他整数大，因此被放置在顶部位置。所以，第 19 行使用的\
  \ `top()` 函数显示优先级队列中最小的整数，并在第 20 行通过 `pop()` 操作在使用后立即被删除。\n\n因此，当元素被弹出时，该优先级队列会按照数值递增的顺序弹出整数。\n\
  \n### 总结\n\n本节解释了三个关键自适应容器的使用——STL `stack`、`queue` 和 `priority_queue` 容器。这些类为了其内部存储需求对顺序容器进行了自适应，但通过它们的成员函数，它们展示了使栈和队列变得如此独特的行为特征。\n\
  \n### 问答\n\n问：栈中间的元素可以修改吗？\n\n**答**：不可以，不能修改，因为修改会违背栈的用途，栈应该是一个后进先出的容器。\n\n问：我可以遍历队列中的所有元素吗？\n\
  \n**答**：队列不具备迭代器，队列中的元素只能通过成员方法 `front()` 和 `back()` 从末端访问。\n\n问：STL 算法可以与自适应容器配合工作吗？\n\
  \n**答**：STL 算法使用迭代器。由于 `stack` 类和 `queue` 类都没有提供标记范围末端的迭代器，因此无法在这些容器上使用 STL 算法。\n\
