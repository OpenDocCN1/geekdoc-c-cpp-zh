  22:\n23:    return 0;\n24: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nEnter the two\
  \ integers:\n56\n25\n56 x 25 = 1400\n56 + 25 = 81\nPress x to exit(x) or any other\
  \ key to recalculate\nr\nEnter the two integers:\n365\n-5\n365 x -5 = -1825\n365\
  \ + -5 = 360\nPress x to exit(x) or any other key to recalculate\nx\nGoodbye!\n\
  ```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n第 7 行到 19 行的 `while` 循环包含了程序的大部分逻辑。注意 `while` 如何检查表达式\
  \ `(userSelection != 'x')`，并且仅当该表达式求值为 `true` 时才继续。为了启用首次运行，你在第 5 行将 `char` 变量 `userSelection`\
  \ 初始化为 `'m'`。这个值可以是任何非 `'x'` 的值（否则，条件在第一次循环时就会失败，应用程序将在未让用户进行任何建设性操作的情况下退出）。首次运行非常简单，但程序在第\
  \ 17 行询问用户是否希望执行另一组计算。第 18 行包含了用户的输入，并且也是你修改 `while` 所求值的表达式的地方，从而让程序有机会继续或终止。当第一次循环完成后，执行将返回到第\
  \ 7 行 `while` 语句中的表达式进行求值，如果用户没有按下 `x`，则重复。当用户在循环末尾按下 `x` 时，第 7 行对表达式的下一次求值结果为 `false`，执行将退出\
  \ `while` 循环，最终在显示告别语句后结束应用程序。\n\n注意\n\n循环也被称为*迭代*（iteration）。涉及 `while`、`do...while`\
  \ 和 `for` 的语句也被*迭代语句*（iterative statements）。\n\n#### `do...while` 循环 \n\n在某些情况下（如\
  \ Listing 6.8 中的情况），你需要确保某段代码在循环中重复并且至少执行一次。这就是 `do...while` 循环大用场。\n\n`do...while`\
  \ 循环的语法为\n\n```\ndo\n{\n   StatementBlock; // 至少执行一次\n} while(condition); // 当条件求值为\
  \ false 时结束循环\n```\n\n点击此处查看代码图像\n\n注意包含 `while(condition)` 的那行以分号结尾。这与之前的 `while`\
  \ 循环不同，在之前的循环中，`while` 后的分号将实际上在这一行就终止循环，导致产生空语句。\n\nListing 6.9 展示了 `do...while`\
  \ 循环如何帮助至少执行一次语句。\n\n### 输入 ▼\n\nListing 6.9 使用 `do...while` 重复执行代码块\n\n```\n 0:\
  \ #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n 5:\
  \    char userSelection = 'x';   // initial value\n 6:    do\n 7:    {\n 8:    \
  \   cout << \"Enter the two integers: \" << endl;\n 9:       int num1 = 0, num2\
  \ = 0;\n10:       cin >> num1;\n11:       cin >> num2;\n12:\n13:       cout << num1\
  \ << \" x \" << num2 << \" = \" << num1 * num2 << endl;\n14:       cout << num1\
  \ << \" + \" << num2 << \" = \" << num1 + num2 << endl;\n15:\n16:       cout <<\
  \ \"Press x to exit(x) or any other key to recalculate\" << endl;\n17:       cin\
  \ >> userSelection;\n18:    } while (userSelection != 'x');\n19:\n20:    cout <<\
  \ \"Goodbye!\" << endl;\n21:\n22:    return 0;\n23: }\n```\n\n点击此处查看代码图像\n\n###\
  \ 输出 ▼\n\n```\nEnter the two integers:\n56\n25\n56 x 25 = 1400\n56 + 25 = 81\nPress\
  \ x to exit(x) or any other key to recalculate\nr\nEnter the two integers:\n365\n\
  -5\n365 x -5 = -1825\n365 + -5 = 360\nPress x to exit(x) or any other key to recalculate\n\
  x\nGoodbye!\n```\n\n点击此处查看代码图像\n\n\n\n在 Listing 6.10 中有两个 `for` 循环——分别位于第 10 行和第\
  \ 18 行。第一个循环用于将元素输入到整数数组中，另一个用于处理显示。这两个 `for` 循环在语法上是相同的。它们都声明了一个索引变量 `counter`\
  \ 来访问数组中的元素。该变量在每次循环结束时都会加 1；因此，它有助于在循环的下一次运行中访问下一个元素。`for` 循环中间的表达式是退出条件。它通过将 `counter`\
  \ 与 `ARRAY_LENGTH` 进行比较，检查在每次循环结束时加 1 的 `counter` 是否仍在数组范围内。这样，也确保了 `for` 循环永远不会超过数组的长度。\n\
  \n### 备注\n\n像 Listing 6.10 中像 `counter` 这样有助于访问数组等集合元素的变量也被称为 `iterator`（迭代器）。\n\
  \n在 `for` 结构内部声明的迭代器作用域限于该 `for` 循环。因此，在 Listing 6.10 的第二个 `for` 循环中，这个重新声明的变量从编译角度来看是一个新变量。\n\
  \n使用初始化、条件表达式以及每次循环结束评估的表达式是可选的。可以存在一个缺少部分或任何这些内容的 `for` 循环，如 Listing 6.11 所示。\n\
  \n### 输入\n\nListing 6.11 使用不带循环表达式根据用户请求重复计算的 `for` 循环\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n 5:    // 没有循环表达式（缺少第三个表达式）\n\
  \ 6:    for(char userSelection = 'm'; (userSelection != 'x');)\n 7:   {\n 8:   \
  \    cout << \"Enter the two integers: \" << endl;\n 9:       int num1 = 0, num2\
  \ = 0;\n10:       cin >> num1;\n 11:       cin >> num2;\n 12:\n 13:       cout <<\
  \ num1 << \" x \" << num2 << \" = \" << num1 * num2 << endl;\n 14:       cout <<\
  \ num1 << \" + \" << num2 << \" = \" << num1 + num2 << endl;\n 15:\n 16:       cout\
  \ << \"Press x to exit or any other key to recalculate\" << endl;\n 17:       cin\
  \ >> userSelection;\n 18:    }\n 19:\n 20:    cout << \"Goodbye!\" << endl;\n 21:\n\
  \ 22:    return 0;\n 23: }\n```\n\n### 输出\n\n```\nEnter the two integers:\n56\n\
  25\n56 x = 1400\n56 + 25 = 81\nPress x to exit or any other key to recalculate\n\
  m\nEnter the two integers:\n789\n-36\n789 x = -2840\n789 + -36 = 753\nPress x to\
  \ exit or any other key to recalculate\nx\nGoodbye!\n```\n\n### 分析\n\n此程序与 Listing\
  \ 6.8 相同（后者使用了 `while` 循环），不同在于第 6 行使用了 `for` 结构。这个 `for` 循环有趣的地方在于它只包含初始化表达式和条件表达式；它忽略了在每次循环结束更改变量的选项。\n\
  \n你可以在 `for` 循环的第一个初始化表达式中初始化多个变量。Listing 6.11 中具有多个初始化的 `for` 循环如下：\n\n```\nfor\
  \ (int counter1 = 0, counter2 = 5; counter1 < ARRAY_LENGTH\n```\n\n注意新添加的 `counter2`，它被初始化为\
  \ `5`。有趣的是，也可以在循环表达式中对其进行递减——每次循环一次。\n\n### 基于范围的 `for` 循环\n\nC++11 引入了 `for` 循环的一种新变体，使得对值范围（例如数组中包含的值）的操作代码编写更简单、更易读。基于范围的\
  \ `for` 循环语法也使用了相同的关键字 `for`：\n\n```\nfor (Type : sequence)\n{\n   // 使用包含 sequence\
  \ 中元素的 varName\n}\n```\n\n例如，假定有一个整数数组 `someNums`，你可以使用基于范围的 `for` 循环如下所示读取元素：\n\
  \n```\nint someNums[] = { 1, 101, -1, 40, 2040 };\n\nfor (int aNum : someNums) //\
  \ 基于范围\n   cout << \"The array elements are \" << aNum << endl;\n```\n\n提示：你可以通过使用关键字\
  \ `auto` 的自动类型推断来进一步简化此 `for` 语句，组合出一个通用的 `for` 循环，该循环适用于具有任何类型元素的数组：\n\n```\nfor\
  \ (auto anElement : elements) // 基于范围\n\n    cout << \"Array elements are \" <<\
  \ anElement << endl;\n```\n\nListing 6.12 展示了在不同类型上使用基于范围的 `for` 循环。\n\n### 输入\n\
  \nListing 6.12 在数组和 `string` 上使用基于范围的 `for` 循环\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<string>\n 2: using namespace std;\n 3: int main()\n 4: {\n 5:    int\
  \ someNums[] = { 1, 101, -1, 40, 2040 };\n 6:    for (int aNum : someNums)\n 7:\
  \        cout << \"Array elements are \" << aNum << endl;\n 8:\n 9:    char charArray[]\
  \ = { 'h', 'e', 'l', 'l', 'o' };\n10:   for (auto aChar : charArray)\n 11:     \
  \  cout << aChar << endl;\n 12:\n 13:   double moreNums[] = { 3.14, -1.3, 22 };\n\
  \ 14:   for (auto anElement : moreNums)\n 15:       cout << anElement << endl;\n\
  \ 16:\n 17:   string sayHello{\"Hello World!\"};\n 18:   for (auto anElement : sayHello)\n\
  \ 19:       cout << anElement << endl;\n 20:\n 21:   return 0;\n 22: }\n```\n\n\
  ### 输出\n\n```\nArray elements are 1\nArray elements are 101\nArray elements are\
  \ -1\nArray elements are 40\nArray elements are 2040\nh\ne\nl\nl\no\n3.14\n-1.3\n\
  22\nH\ne\nl\nl\no\nW\no\nr\nl\nd\n!\n```\n\n### 分析\n\n此列表包含了多个基于范围的 `for` 的实现，位于第\
  \ 8、12、17、22 和 27 行。这些实例都使用循环在屏幕上显示范围的内容，每次一个元素。有趣的是，虽然范围的性质从第 8 行的整数数组 `someNums`\
  \ 变为第 17 行的 `char` 数组 `charArray`，再到第 27 行的 `std::string`，但语法保持了一致。\n\n这种简单性使得基于范围的\
  \ `for` 成为过去十年引入的最受欢迎的功能之一。\n\n### 使用 `continue` 和 `break` 修改循环行为\n\n在少数情况下，特别是在处理许多参数和条件的复杂循环中，你无法高效地编写循环条件并需要修改程序行为。此时\
  \ `continue` 和 `break` 可以帮助你。\n\n`continue` 允许从循环顶部开始继续执行。块中 `continue` 之后的代码将被跳过。因此，`continue`\
  \ 在 `while`、`do...while` 或 `for` 循环中的效果是重新评估循环条件，如果条件为 `true`，则重新进入循环体。\n\n注意：在\
  \ `for` 循环中使用 `continue` 时，会在重新评估条件之前先评估循环表达式。\n\n相反，`break` 会退出循环块，从而在调用时结束循环。\n\
  \n\n\n记住 `while`、`do...while` 和 `for` 循环都有一个条件表达式，当条件求值为 `false` 时，循环将终止。如果你编写了一个始终求值为\
  \ `true` 的条件，则循环永远不会结束。\n\n一个无限的 `while` 循环如下：\n\n```\nwhile(true)   // while 表达式固定为\
  \ true\n{\n   DoSomethingRepeatedly;\n}\n```\n\n点击此处查看代码图像\n\n无限的 `do...while` 循环将是\n\
  \n```\ndo\n{\n   DoSomethingRepeatedly;\n} while(true);   // do...while 表达式永远不会为\
  \ false\n```\n\n点击此处查看代码图像\n\n无限的 `for` 循环可以通过以下方式编写：\n\n```\nfor (;;)   // 未提供条件\
  \ = 无尽的 for\n{\n   DoSomethingRepeatedly;\n}\n```\n\n点击此处查看代码图像\n\n尽管看起来可能很奇怪，但这种循环是有用途的。想象一个操作系统需要不断检查你是否将\
  \ USB 闪存等设备连接到 USB 端口。只要操作系统在运行，这项活动就不应该停止。这类情况需要使用永不结束的循环。这种循环也被称为无限循环，因为它们会永远执行，直到永恒。\n\
  \n### 控制无限循环\n\n如果你想结束一个`无限循环`（例如前面示例中的操作系统需要关机），可以通过插入一个 `break` 块（通常用于 `if(condition)`\
  \ 内部）来实现。\n\n以下是使用 `break` 退出无限 `while` 循环的示例：\n\n```\nwhile(true)   // while 条件固定为\
  \ true\n{\n   DoSomethingRepeatedly;\n   if(condition)\n      break;  // 当表达式求值为\
  \ true 时退出循环\n}\n```\n\n点击此处查看代码图像\n\n在无限的 `do...while` 中使用 `break`：\n\n```\ndo\n\
  {\n   DoSomethingRepeatedly;\n   if(condition)\n      break;  // 当表达式求值为 true 时退出循环\n\
  } while(true);\n```\n\n点击此处查看代码图像\n\n在无限的 `for` 循环中使用 `break`：\n\n```\nfor (;;)\
  \   // 未提供条件，即无尽的 for 循环\n{\n   DoSomethingRepeatedly;\n   if(condition)\n     \
  \ break;  // 当表达式求值为 true 时退出循环\n}\n```\n\n点击此处查看代码图像\n\n列表 6.13 显示了如何使用 `continue`\
  \ 和 `break` 控制退出标准来编写无限循环。\n\n#### 输入 ▼\n\n列表 6.13 使用 `continue` 重启并使用 `break` 退出无限\
  \ `for` 循环\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: int\
  \ main()\n 4: {\n 5:    for(;;)   // 一个无限循环\n 6:    {\n 7:        cout << \"Enter\
  \ two integers: \" << endl;\n 8:        int num1 = 0, num2 = 0;\n 9:        cin\
  \ >> num1;\n10:        cin >> num2;\n11:\n 12:        cout << \"Do you wish to correct\
  \ the numbers? (y/n): \";\n 13:        char changeNumbers = '\\0';\n 14:       \
  \ cin >> changeNumbers;\n 15:\n 16:        if (changeNumbers == 'y')\n 17:     \
  \      continue;  // 重启循环！\n 18:\n 19:        cout << num1 << \" x \" << num2 <<\
  \ \" = \" << num1 * num2 << endl;\n 20:        cout << num1 << \" + \" << num2 <<\
  \ \" = \" << num1 + num2 << endl;\n 21:\n 22:        cout << \"Press x to exit or\
  \ any other key to recalculate\" << endl;\n 23:        char userSelection = '\\\
  0';\n 24:        cin >> userSelection;\n 25:\n 26:        if (userSelection == 'x')\n\
  \ 27:           break;   // 退出无限循环\n 28:    }\n 29:\n 30:    cout << \"Goodbye!\"\
  \ << endl;\n 31:\n 32:    return 0;\n 33: }\n```\n\n点击此处查看代码图像\n\n##### 输出 ▼\n\n\
  ```\nEnter two integers:\n560\n25\nDo you wish to correct the numbers? (y/n): y\n\
  Enter two integers:\n56\n25\nDo you wish to correct the numbers? (y/n): n\n56 x\
  \ 25 = 1400\n56 + 25 = 81\nPress x to exit or any other key to recalculate\nr\n\
  Enter two integers:\n95\n-1\nDo you wish to correct the numbers? (y/n): n\n95 x\
  \ -1 = -95\n95 + -1 = 94\nPress x to exit or any other key to recalculate\nx\nGoodbye!\n\
  ```\n\n点击此处查看代码图像\n\n### 嵌套循环\n\n正如你在开头看到的嵌套 `if` 语句一样，通常你需要将一个循环嵌套在另一个循环中。假设有两个整数数组。如果你想计算\
  \ `array1` 中的每个数字乘以 `array2` 中的每个数字，你需要使用嵌套循环。第一个循环遍历 `array1`，第二个循环在第一个循环内部遍历 `array2`。\n\
  \n列表 6.14 展示了嵌套循环的使用。\n\n#### 输入 ▼\n\n列表 6.14 使用嵌套循环将数组中的每个元素乘以另一个数组中的每个元素\n\n```\n\
  \ 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n\
  \ 5:    const int ARRAY1_LEN = 3;\n 6:    const int ARRAY2_LEN = 2;\n 7:\n 8:  \
  \  int myNums1[ARRAY1_LEN] = {35, -3, 0};\n 9:    int myNums2[ARRAY2_LEN] = {20,\
  \ -1};\n 10:\n 11:    cout << \"Multiplying each int in myNums1 by each in myNums2:\"\
  \ << endl;\n 12:\n 13:    for(int index1 = 0; index1 < ARRAY1_LEN; ++index1)\n 14:\
  \       for(int index2 = 0; index2 < ARRAY2_LEN; ++index2)\n 15:          cout <<\
  \ myNums1[index1] << \" x \" << myNums2[index2] <<\n 16:               << \" = \"\
  \ << myNums1[index1] * myNums2[index2] << endl;\n 17:\n 18:    return 0;\n 19: }\n\
  ```\n\n##### 输出 ▼\n\n```\nMultiplying each int in myNums1 by each in myNums2:\n\
  35 x 20 = 700\n35 x -1 = -35\n-3 x 20 = -60\n-3 x -1 = 3\n0 x 20 = 0\n0 x -1 = 0\n\
  ```\n\n#### 分析 ▼\n\n\n\n\n问题中的嵌套 `for` 循环位于第 13 和第 14 行。第一个 `for` 循环遍历数组 `myNums1`，而第二个\
  \ `for` 循环遍历另一个数组 `myNums2`。第一个 `for` 循环在每次迭代中都会执行第二个 `for` 循环。第二个 `for` 循环遍历 `myNums2`\
  \ 中的所有元素，并在每次迭代中，将该元素与上方循环中通过 `index1` 索引的元素相乘。因此，对于 `myNums1` 中的每一个元素，第二个循环都会遍历\
  \ `myNums2` 中的所有元素，导致 `myNums1` 中偏移量为 0 的第一个元素与 `myNums2` 中的所有元素相乘。然后，`myNums1`\
  \ 中的第二个元素将与 `myNums2` 中的所有元素相乘。最后，`myNums1` 中的第三个元素将与 `myNums2` 中的所有元素相乘。\n\n##\
  \ 使用嵌套循环遍历多维数组\n\n在第 4 Lesson 中，你学习了多维数组。在列表 4.3 中，你访问了一个三行三列的二维数组中的元素。你当时所做的是逐个访问数组中的每个元素，每行一个元素。这并没有实现自动化，如果你想扩大数组，你就需要编写更多的代码——并且更改数组的维度以访问其元素。然而，使用循环可以改变这一切，如列表\
  \ 6.15 所示。\n\n### 输入 ▼\n\n列表 6.15 使用嵌套循环遍历整数二维数组中的元素\n\n```cpp\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n 5:    const int NUM_ROWS\
  \ = 3;\n 6:    const int NUM_COLUMNS = 4;\n 7:\n 8:    // 整数的二维数组\n 9:    int MyInts[NUM_ROWS][NUM_COLUMNS]\
  \ = { {34, -1, 879, 22},\n10:                                       {24, 365, -101,\
  \ -1},\n11:                                       {-20, 40, 90, 97} };\n12:\n13:\
  \    // 遍历行，即每个 int 数组\n14:    for (int row = 0; row < NUM_ROWS; ++row)\n15:   \
  \ {\n16:       // 遍历每行中的整数（列）\n17:       for (int column = 0; column < NUM_COLUMNS;\
  \ ++column)\n18:       {\n19:          cout << \"Integer[\" << row << \"][\" <<\
  \ column \\\n20:              << \"] = \" << MyInts[row][column] << endl;\n21: \
  \      }\n22:    }\n23:\n24:    return 0;\n25: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\
  \n```\nInteger[0][0] = 34\nInteger[0][1] = -1\nInteger[0][2] = 879\nInteger[0][3]\
  \ = 22\nInteger[1][0] = 24\nInteger[1][1] = 365\nInteger[1][2] = -101\nInteger[1][3]\
  \ = -1\nInteger[2][0] = -20\nInteger[2][1] = 40\nInteger[2][2] = 90\nInteger[2][3]\
  \ = 97\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n第 14 行到第 22 行包含两个 `for` 循环，你用它们来访问并遍历整数二维数组。二维数组本质上是一个整数数组的数组。注意第一个\
  \ `for` 循环是如何访问行的（每一行都是一个整数数组），而第二个循环是如何访问该数组中的每个元素——即访问其中的列。\n\n**注意**\n\n列表 6.15\
  \ 使用大括号包围嵌套的 `for` 仅仅是为了提高可读性。这个嵌套循环在不使用大括号的情况下也完全可以工作，因为循环语句只是要执行的单个语句（而不是必须使用大括号包围的复合语句）。\n\
  \n## 使用嵌套循环计算斐波那契数\n\n著名的斐波那契数列是一组从 0 和 1 开始的数字，序列中的每一个后续数字都是前两个数字之和。因此，斐波那契数列从如下序列开始：\n\
  \n0, 1, 1, 2, 3, 5, 8…… 等此类推\n\n列表 6.16 展示了如何创建一个包含任意数量数字的斐波那契数列（但取决于最后一个数字的整数的数据容量）。\n\
  \n### 输入 ▼\n\n列表 6.16 使用嵌套循环计算斐波那契数列\n\n```cpp\n 0: #include<iostream>\n 1: using\
  \ namespace std;\n 2:\n 3: int main()\n 4: {\n 5:    const int numsToCalculate =\
  \ 5;\n 6:    cout << \"This program will calculate \" << numsToCalculate \\\n 7:\
  \         << Fibonacci Numbers at a time\" << endl;\n 8:\n 9:    int num1 = 0, num2\
  \ = 1;\n10:    char wantMore = '\\0';\n11:    cout << num1 << \" \" << num2 << \"\
  \ \";\n12:\n13:    do\n14:    {\n15:       for (int counter = 0; counter < numsToCalculate;\
  \ ++counter)\n16:       {\n17:          cout << num1 + num2 << \" \";\n18:\n19:\
  \          int num2Temp = num2;\n20:          num2 = num1 + num2;\n21:         \
  \ num1 = num2Temp;\n22:       }\n23:\n24:       cout << endl << \"Do you want more\
  \ numbers (y/n)? \";\n25:       cin >> wantMore;\n26:    }while (wantMore == 'y');\n\
  27:\n28:    cout << \"Goodbye!\" << endl;\n29:    return 0;\n30: }\n```\n\n点击此处查看代码图片\n\
  \n### 输出 ▼\n\n```\nThis program will calculate 5 Fibonacci Numbers at a time\n0\
  \ 1 1 2 3 5 \nDo you want more numbers (y/n)? y\nGoodbye!\n```\n\n### 分析 ▼\n\n第\
  \ 13 行的外部 `do...while` 在用户想要更多数字时重复执行。第 15 行的内部 `for` 循环生成五个更多的数字。在第 19 行，你将 `num2`\
  \ 的值存储在临时变量 `num2Temp` 中。注意，如果你不在第 20 行存储该值，你将直接赋值 `num1`，这并不是你想要的。当用户按下 `y` 时，`do...while`\
  \ 循环将执行一次。\n\n\n\n\n\n是的，大写的！由于 `while` 后面紧跟着一个空语句（分号），`while(exp);` 已经是一个有效但空的\
  \ `while` 循环，即使它后面跟着的是一个语句块。涉及的语句块会执行一次——但在循环之外。在复制和粘贴代码时要小心。\n\n## 习习\n\n习习提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学内容的经验。在查看附录\
  \ E 中的答案之前，尝试回答测验题和练习题，并在继续下一节之前确保你理解了答案。\n\n### 测验\n\n1. 1. 即使在没有缩进的情况下也可以编译，为什么你还要费力对语句块、嵌套\
  \ `ifs` 和嵌套循环中的代码进行缩进呢？\n2. 2. 你可以使用 `goto` 实现快速修复。你为什么要避免使用它？\n3. 3. 是否可以写一个计数器递减的\
  \ `for` 循环？它看起来是什么样的？\n4. 4. 下面循环有什么问题？\n\n```\nfor (int counter=0; counter==10;\
  \ ++counter)\n   cout << counter << \" \";\n```\n\n点击此处查看代码图像\n\n### 练习\n\n1. 1.\
  \ 编写一个 `for` 循环来反向访问数组元素。\n2. 2. 编写一个等相当于列表 6.14 的嵌套循环，但反序加上两个数组中的元素。\n3. 3. 编写一个与列表\
  \ 6.16 类似的程序，显示斐波那契数列，但会询问用户想要计算多少个数字。\n4. 4. 编写一个 `switch-case` 结构来判断颜色是否在彩虹中。使用枚举常量。\n\
  5. 5. 漏洞排查：这段代码哪里错了？\n\n```\nfor (int counter=0; counter=10; ++counter)\n   cout\
  \ << counter << \" \";\n```\n\n点击此处查看代码图像\n6. 6. 漏洞排查：这段代码哪里错了？\n\n```cpp\nint loopCounter\
  \ = 0;\nwhile(loopCounter <5);\n{\n   cout << loopCounter << \" \";\n   loopCounter++;\n\
  }\n```\n\n点击此处查看代码图像\n7. 7. 漏洞排查：这段代码哪里错了？\n\n```cpp\ncout << \"Enter a number between\
  \ 0 and 4\" << endl;\nint input = 0;\ncin >> input;\nswitch (input)\ncase 0:\ncase\
  \ 1:\ncase 2:\ncase 3:\ncase 4:\ncout << \"Valid input\" << endl;\ndefault:\n  \
  \ cout << \"Invalid input\" << endl;\n}\n```\n\n点击此处查看代码图像\n\n## 第 7 own：用函数组织代码\n\
  \n到本书为止，你已经看到了一些简单的程序，所有的编程工作都包含在 `main()` 中。这对于小型程序和应用程序非常好。程序越大、越复杂，`main()` 的内容就越长——除非你选择使用函数来结构化你的程序。\n\
  \n函数为你提供了一种模块化和组织程序执行的方法。它们允许你将应用程序的内容拆分为顺序调用的逻辑块。`function` 是一个子程序，可以可选地接受参数并返回值，并且需要被调用来执行其任务。\n\
  \n在本节中，你将学习：\n* 函数的必要性\n* 函数声明和函数定义\n* 向函数传递参数并从函数返回值\n* 函数重载\n* 递归函数\n* Lambda\
  \ 函数\n\n### 函数的必要性\n\n想象一个应用程序，它要求用户输入圆的半径，然后计算圆的周长和面积。实现此点的方法是将所有代码放在 `main()`\
  \ 中。另一种方法是如列表 7.1 所示将此应用程序拆分为逻辑块：一个计算面积，另一个根据给定半径计算周长。\n\n### 输入\n列表 7.1 给定半径计算圆的面积和周长的两个函数\n\
  \n```cpp0: #include<iostream>\n1: using namespace std;\n2:\n3: const double Pi =\
  \ 3.1415265;\n4:\n5: // 函数声明（原型）\n6: double Area(double radius);\n7: double Circumference(double\
  \ radius);\n8:\n9: int main()\n10: {\n11:    cout << \"Enter radius: \";\n12:  \
  \  double radius = 0;\n13:    cin >> radius;\n14:    15:    cout << \"Area is: \"\
  \ << Area(radius) << endl;\n16:    cout << \"Circumference is: \" << Circumference(radius)\
  \ << endl;\n17:    return 0;\n18: }\n19:\n20: // 函数定义\n21: double Area(double radius)\n\
  22: {\n23:    return Pi * radius * radius;\n24: }\n25:\n26: double Circumference(double\
  \ radius)\n27: {\n28:    return 2 * Pi * radius;\n29: }\n```\n\n### 输出\n```\nEnter\
  \ radius: 6.5\nArea is: 132.663\nCircumference is: 40.8412\n```\n\n### 分析\n`main()`\
  \ 是一个函数，它将活动委托给 `Area()` 和 `Circumference()` 等函数。\n\n该程序展示了与使用函数编程相关的以下产物：\n* 函数原型声明在第\
  \ 6 和 7 行，以便编译器在 `main()` 中知道 `Area` 和 `Circumference` 的含义。\n* `Area()` 和 `Circumference()`\
  \ 函数在 `main()` 的第 16 行和 19 行被调用。\n* `Area()` 定义在第 25 到 28 行，而 `Circumference()`\
  \ 定义在第 30 到 33 行。\n\n将面积和周长的计算模块化为不同的函数可以潜在地实现复用，因为函数可以反复调用。\n\n#### 什么是函数原型？\n\n\
  让我们再次查看列表 7.1，特别是第 6 和 7 行：\n\n```cpp\ndouble Area(double radius);\ndouble Circumference(double\
  \ radius);\n```\n\n点击此处查看代码图像\n\n图 7.1 显示了函数原型由什么组成。\n\n![带有注释的文本](img/07fig01.jpg)\n\
  \n**图 7.1** 函数原型组成。\n\n函数原型基本上告诉函数名称（`Area`）、接受的参数列表（一个名为 `radius` 的参数）以及函数的返回类型（`double`）。\n\
  \n如果没有函数原型，在到达 `main()` 的第 16 行和 19 行时，编译器将不知道 `Area` 和 `Circumference` 是什么。函数原型告诉编译器\
  \ `Area` 和 `Circumference` 是函数；每个函数接受一个类型为 `double` 的参数并返回一个 `double` 类型的值。编译器随后识别这些语句是有效的。\n\
  \n注意\n函数可以有多个由逗号分隔的参数，但它只能有一个返回类型。\n\n在编写不需要返回任何值的函数时，将返回类型指定为 `void`。\n\n\n\n\n\
  函数定义始终由一个语句块组成。除非函数声明的类型为 `void`，否则返回语句是必须的。在这种情况下，`Area()` 需要返回一个值，因为该函数被声明为返回\
  \ `double` 类型的函数。语句块包含包含在大括号（`{...}`）之内的语句，这些语句在函数被调用时会执行。`Area()` 使用输入参数 `radius`，该参数包含了调用者发送的半径值，用于计算圆的面积。\n\
  \n## 什么是函数调用，什么是参数？\n\n调用函数与触发函数是同一回事。当函数声明中包含参数时，函数调用需要发送`arguments`（参数）。参数是函数在其参数列表中请求的值。让我们分析一下列表\
  \ 7.1 中对 `Area()` 的调用：\n\n```\ncout << \"Area is: \" << Area(radius) << endl;\n\
  ```\n\n点击此处查看代码图像\n\n在这里，`Area(radius)` 是函数调用，`radius` 是发送给函数 `Area()` 的参数。当被触发时，执行将跳转到函数\
  \ `Area()`，该函数使用发送的 `radius` 来计算圆的面积。\n\n## 带有多个参数的函数\n\n假设你正在编写一个计算圆柱表面积的程序，如图\
  \ 7.2 所示。\n\n![显示了一个圆柱体，标记了半径和高度。](img/07fig02.jpg)\n\n**图 7.2** 圆柱。\n\n你需要使用以下公式：\n\
  \n```\nArea of Cylinder = Area of top circle + Area of bottom circle + Area of Side\n\
  \           = Pi *  radius² + Pi * radius ² + 2 * Pi * radius * height\n       \
  \    = 2 * Pi * radius² + 2 * Pi * radius * height\n```\n\n点击此处查看代码图像\n\n因此，你需要处理两个变量——`radius`\
  \ 和 `height`来计算圆柱的面积。在编写计算圆柱表面积的函数时，你在函数声明的参数列表中指定至少两个参数。你通过用逗号分隔一对单独的参数来实现这一点，如列表\
  \ 7.2 所示。\n\n### 输入 ▼\n\n列表 7.2 接受两个参数计算圆柱表面积的函数\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: const double Pi = 3.14159265;\n 4:\n 5: // 包含两个参数\n\
  \ 6: double SurfaceArea(double radius, double height);\n 7:\n 8: int main()\n 9:\
  \ {\n10:    cout << \"Enter the radius of the cylinder: \";\n11:    double radius\
  \ = 0;\n12:    cin >> radius;\n13:    cout << \"Enter the height of the cylinder:\
  \ \";\n14:    double height = 0;\n15:    cin >> height;\n16:\n17:    cout << \"\
  Surface area: \" << SurfaceArea(radius, height) << endl;\n18:\n19:    return 0;\n\
  20: }\n21:\n22: double SurfaceArea(double radius, double height)\n23: {\n24:   \
  \ double area = 2 * Pi * radius * radius + 2 * Pi * radius * height;\n25:    return\
  \ area;\n26: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nEnter the radius of the cylinder:\
  \ 3\nEnter the height of the cylinder: 6.5\nSurface Area: 179.071\n```\n\n点击此处查看代码图像\n\
  \n### 分析 ▼\n\n第 6 行包含了函数 `SurfaceArea()` 的声明，带有两个参数 `radius` 和 `height`，类型均为 `double`，用逗号分隔。第\
  \ 22 行到 26 行显示了定义——即 `SurfaceArea()` 的实现。如你所示，输入参数 `radius` 和 `height` 用于计算存储在局部变量\
  \ `area` 中的值，然后该值返回给调用者。\n\n**注意**\n\n函数参数类似于局部变量：它们仅在函数的作用域内有效。因此，在列表 7.2 中，函数\
  \ `SurfaceArea()` 内的参数 `radius` 和 `height` 是 `main()` 中具有相似名称变量的副本。\n\n## 无无参数或无返回值的函数\n\
  \n如果你将说“Hello World”的任务委托给一个只做这一件事不做其他事的函数，你可以使用不需要任何参数的函数来完成（因为它除了说“Hello World”之外不需要做任何事情），你甚至可以使用一个不返回任何值的函数来完成（因为你不期望这种函数提供任何在其他地方有用的东西）。列表\
  \ 7.3 演示了这样一个函数。\n\n### 输入 ▼\n\n列表 7.3 无参数且无返回值的函数\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: void SayHello();\n 4:\n 5: int main()\n 6: {\n\
  \ 7:    SayHello();\n 8:    return 0;\n 9: }\n10:\n 1: void SayHello()\n12: {\n\
  13:    cout << \"Hello World\" << endl;\n14: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n\
  ```\nHello World\n```\n\n### 分析 ▼\n\n注意第 3 行的函数原型声明 `SayHello()` 为 `void` 类型；即 `SayHello()`\
  \ 不返回值。因此，在第 11 行到 14 行的函数定义中没有返回语句。某些程序员倾向于在结尾插入符号返回：\n\n```\nvoid SayHello()\n\
  {\n   cout << \"Hello World\" << endl;\n   return;\n```\n\n在之前的示例中，你将 `pi` 的值固定为常量，并且没有给用户更改的机会。然而，用户可能对更精确的感兴趣。如何编写一个使用默认值\
  \ `pi` 的函数？\n\n一种方法是在函数提供一个额外的参数并提供你选择的默认值。它看起来像这样：\n\n```\ndouble Area(double radius,\
  \ double pi = 3.14);\n```\n\n注意第二个参数 `pi` 被赋值为默认值 `3.14`。因此，对于调用者来说，第二个参数是可选的。可以在没有第二个参数的情况下调用：\n\
  \n```\nArea(radius);\n```\n\n在这种情况下，第二个参数默认为 `3.14`。然而，当需要时，可以使用两个参数调用同一个函数：\n\n\
  ```\nArea(radius, 3.14159);\n```\n\n列表 7.4 演示了如何编写带有默认值的函数，并在可用且需要时覆盖它们。\n\n###\
  \ 输入 ▼\n\n列表 7.4 使用默认值 3.14 作为第二个参数计算圆面积\n\n```\n 0: #include<iostream>\n 1: using\
  \ namespace std;\n 2:\n 3: // 带有默认参数的函数\n 4: double Area(double radius, double pi\
  \ = 3.14);\n 5:\n 6: int main()\n 7: {\n 8:    cout << \"Enter radius: \";\n 9:\
  \    double radius = 0;\n10:    cin >> radius;\n11:\n12:    cout << \"pi is 3.14,\
  \ do you wish to change this (y / n)? \";\n13:    char changePi = 'n';\n14:    cin\
  \ >> changePi;\n15:\n16:    double circleArea = 0;\n17:    if (changePi == 'y')\n\
  18:    {\n19:       cout << \"Enter new pi: \";\n20:       double newPi = 3.14;\n\
  21:       cin >> newPi;\n22:       circleArea = Area (radius, newPi);\n23:    }\n\
  24:    else\n25:       circleArea = Area(radius); // 忽略第二个参数，使用默认值\n26:\n27:   \
  \ // 调用函数 \"Area\"\n28:    cout << \"Area is: \" << circleArea << endl;\n29:\n30:\
  \    return 0;\n31: }\n32:\n33: // 函数定义（实现）\n34: double Area(double radius, double\
  \ pi)\n35: {\n36:    return pi * radius * radius;\n37: }\n```\n\n\n\n\n点击此处查看代码图片\n\
  \n### 输出 ▼\n\n第一次运行：\n\n```\nEnter radius: 1\nPi is 3.14, do you wish to change\
  \ this (y / n)? n\nArea is: 3.14\n```\n\n点击此处查看代码图片\n\n下次运行：\n\n```\nEnter radius:\
  \ 1\nPi is 3.14, do you wish to change this (y / n)? y\nEnter new Pi: 3.1416\nArea\
  \ is: 3.1416\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n在两次运行中，用户输入的半径是相同的：`1`。然而，在第二次运行中，用户选择更改\
  \ `pi` 的精度，因此计算出的面积积结果略有不同。请注意，在两种情况下，如第 22 行和第 25 行所示，你调用的是同一个函数。第 25 行在调用 `Area()`\
  \ 时没有传递第二个参数 `pi`。在这种情况下，`Area()` 中的参数 `pi` 包含了值 `3.14`，该值是在第 4 行的声明中作为默认值提供的。\n\
  \n注意\n\n你可以有多个带有默认值的参数；但它们应该都位于参数列表的末尾。\n\n#### 递归：调用自身的自身的函数\n\n在某些情况下，你实际上可以让一个函数调用自己。这种函数被称为`递归函数`。请注意，递归函数应该有一个定义非常清晰的退出条件，它在返回时不再再次调用自己。\n\
  \n警告\n\n在缺少退出条件的情况下或当退出条件出现 bug 时，你的程序执行将卡在不会停止调用自身的递归函数上。这最终会在栈溢出时停止，并导致应用程序崩溃。\n\
  \n递归函数在确定斐波那契数列中的某一个数字时非常有用，如列表 7.5 所示。该序列从两个数字 `0` 和 `1` 开始：\n\n```\nF(0) = 0\n\
  F(1) = 1\n```\n\n序列中后续数字的值是前两个数字之和。因此，第 `n` 个值（当 `n > 1` 时）由以下递归公式确定：\n\n```\nFibonacci(n)\
  \ = Fibonacci(n - 1) + Fibonacci(n - 2)\n```\n\n点击此处查看代码图片\n\n结果，斐波那契数列扩展为\n\n```\n\
  F(2) = 1\nF(3) = 2\nF(4) = 3\nF(5) = 5\nF(6) = 8, 依此类推。\n```\n\n点击此处查看代码图片\n\n###\
  \ 输入 ▼\n\n列表 7.5 使用递归函数计算斐波那契数列中的数字\n\n```\n 0: #include<iostream>\n 1: using namespace\
  \ std;\n 2:\n 3: int GetFibNumber(int fibIndex)\n 4: {\n 5:    if (fibIndex < 2)\n\
  \ 6:       return fibIndex;\n 7:    else // 如果 fibIndex >= 2 则进行递归\n 8:       return\
  \ GetFibNumber(fibIndex - 1) + GetFibNumber(fibIndex - 2);\n 9: }\n10:\n 11: int\
  \ main()\n 12: {\n 13:    cout << \"Enter 0-based index of desired Fibonacci Number:\
  \ \";\n 14:    int index = 0;\n 15:    cin >> index;\n 16:\n 17:    cout << \"Fibonacci\
