  #### 分析 ▼\n\n感兴趣的加法和减法赋值运算符位于第 12 到 20 行。它们允许你增加或减去整数天数，例如在 `main()` 中：\n\n```cpp\n\
  35:    holiday -= 19;\n39:    holiday += 25;\n```\n\n你的 `Date` 类现在允许用户通过使用接受 `int`\
  \ 为参数的加法或减法赋值运算符来增加或减少天数。你甚至可以为虚构类 `Days` 的实例提供重载的加法赋值版本：\n\n```cpp\n// 将 Days 加到现有\
  \ Date 的运算符\nvoid operator += (const Days& daysToAdd)\n{\n    day += daysToAdd.GetDays();\n\
  }\n```\n\n注意\n\n乘法赋值 `*=`、除法赋值 `/=`、取模赋值 `%=`、减法赋值 `-=`、左移赋值 `<<=`、右移赋值 `>>=`、异或赋值\
  \ `^=`、按位包含或赋值 `|=` 以及按位与赋值 `&=` 运算符的语法与列表 12.5 中所示的加法赋值运算符相似。\n\n\n\n\n\n虽然重载运算符的最终目标是使类的使用变得简单且直观，但在许多情况下，实现某个运算符可能并没有意义。例如，日历类\
  \ `Date` 完全不需要位按与与赋值运算符（`&=`）。该类的任何用户都不应该期望（甚至考虑过）通过像 `greatDay &= 20;` 这样的操作获得有用的结果。\n\
  \n### 等于 (`==`) 和不等于 (`!=`) 运算符\n\n当将 `Date` 类的一个实例与另一个实例进行比较时，你期望得到什么？\n\n```\n\
  if (date1 == date2)\n{\n    // Do something\n}\nelse\n{\n    // Do something else\n\
  }\n```\n\n点击此处查看代码图像\n\n在没有等号运算符（`==`）的情况下，编译器简单地对两个对象进行二进制比较，并在它们完全相同时返回 `true`。这种二进制比较对于包含简单数据类型的类实例（如目前的\
  \ `Date` 类）是有效的，但如果涉及的类具有非静态指针成员，例如 Listing 9.9 中 `MyBuffer` 类中名为 `myNums` 的 `int*`，则无法工作。当比较两个\
  \ `MyBuffer` 类的实例时，成员属性的二进制比较实际上 比较的是成员指针的值（`MyBuffer::myNums`）。被比较的两个指针永远不会相等。涉及两个\
  \ `MyBuffer` 实例的比较将一律返回 `false`，因为比较的是两个作为指针的成员，而不是它们所指向的内容。你通过定义比较运算符来解决这个问题。等于运算符的通用表达式形式如下：\n\
  \n```\nbool operator== (const ClassType& compareTo)\n{\n   // comparison code here,\
  \ return true if equal else false\n}\n```\n\n点击此处查看代码图像\n\n不等于运算符可以复用等于运算符：\n\n\
  ```\nbool operator!= (const ClassType& compareTo)\n{\n   // comparison code here,\
  \ return true if inequal else false\n}\n```\n\n点击此处查看代码图像\n\n不等于运算符可以是等于运算符结果的取反（逻辑非）。Listing\
  \ 12.6 展示了由日历类 `Date` 定义的比较运算符。\n\n### 输入 ▼\n\nListing 12.6 展示 `==` 和 `!=` 运算符\n\
  \n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: class Date\n 4:\
  \ {\n 5: private:\n 6:     int day, month, year;\n 7:\n 8: public:\n 9:     Date(int\
  \ inMonth, int inDay, int inYear)\n10:         : month(inMonth), day(inDay), year(inYear)\
  \ {}\n11:\n12:    bool operator== (const Date& compareTo) const\n13:    {\n14: \
  \      return ((day == compareTo.day)\n15:             && (month == compareTo.month)\n\
  16:             && (year == compareTo.year));\n17:    }\n18:\n19:    bool operator!=\
  \ (const Date& compareTo) const\n20:    {\n21:       return !(this->operator==(compareTo));\n\
  22:    }\n23:\n24:    void DisplayDate()\n25:    {\n26: \t   cout << month << \"\
  \ / \" << day << \" / \" << year << endl;\n27:    }\n28: };\n29:\n30: int main()\n\
  31: {\n32:    Date holiday1 (12, 25, 2021);\n33:    Date holiday2 (12, 31, 2021);\n\
