  \ << endl << \"Setting precision to 10: \" << endl;\n 16:    cout << setprecision(10);\n\
  \ 17:    cout << \"Pi = \" << Pi << endl;\n 18:    cout << fixed << \"Fixed Pi =\
  \ \" << Pi << endl;\n 19:    cout << scientific << \"Scientific Pi = \" << Pi <<\
  \ endl;\n 20:\n 21:    cout << endl << \"Enter a radius: \";\n 22:    double radius\
  \ = 0.0;\n 23:    cin >> radius;\n 24:    cout << \"Area of circle: \" << Pi*radius\
