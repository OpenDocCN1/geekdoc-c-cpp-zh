  \ `Shape` 类之间的关系。\n3. **3** 类 `D2` 继承自类 `D1`，`D1` 继承自类 `Base`。为了防止 `D2` 访问 `Base`\
  \ 的公共成员，你会使用哪种访问修饰符？在哪里使用？\n4. **4** 这段代码片段的继承性质是什么？如果 `Derived` 是一个 `struct` 而不是\
  \ `class`，你的答案会有变化吗？\n```cpp\nclass Derived: Base\n{\n   // ... Derived members\n\
  };\n```\n5. **5** 这段代码的问题是什么？\n```cpp\nclass Derived: public Base\n{\n   // ...\
  \ Derived members\n};\nvoid SomeFunc (Base value)\n{\n   // ...\n}\n```\n\n\n\n\n\
  在本节中，你将了解到：\n\n* 多态的真实含义\n* 虚函数函数的作用以及如何使用它们\n* 什么是抽象基类以及如何声明它们\n* 虚拟继承的含义以及在何情况下需要它\n\
  \n### 多态的基础\n\n“Poly”在希腊语中意为“多”，而“morph”意味着“形式”。多态是面向对象语言的一种特性，允许不同类型的对象以相似的方式被对待。本节重点关注通过\
  \ C++ 继承体系实现的多态行为，称为`子类型多态`。\n\n#### 多态行为的需求\n\n在第 10 节“实现继承”中，你了解了 `Tuna` 和 `Carp`\
  \ 如何从 `Fish` 继承公共方法 `Swim()`，如列表 10.1 所示。然而，`Tuna` 和 `Carp` 也有可能提供自己的 `Tuna::Swim()`\
  \ 和 `Carp::Swim()` 方法，以使它们成为不同的游泳者。但是，由于它们本身都是 `Fish`，如果一个拥有 `Tuna` 实例的用户使用基类类型来调用\
  \ `Fish::Swim()`，他最终只执行了通用的部分 `Fish::Swim()` 而不是 `Tuna::Swim()`，尽管该基类实例 `Fish` 是\
  \ `Tuna` 实例的一部分。这个问题在列表 11.1 中得到了演示。\n\n注意\n\n本节中的所有代码示例都已精简为解释相关主题所需的核心内容，并尽可能地减少了代码行数以提高可读性。\n\
  \n在编写程序时，你应该正确地编写类，并创建合理的继承体系，同时考虑到应用程序的设计和目的。\n\n##### 输入 ▼\n\n列表 11.1 使用属于 `Tuna`\
  \ 的基类 `Fish` 实例调用方法\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n\
  \ 3: class Fish\n 4: {\n 5: public:\n 6:    void Swim()\n 7:    {\n 8:       cout\
  \ << \"Fish swims! \" << endl;\n 9:    }\n10: };\n 11:\n 12: class Tuna:public Fish\n\
  \ 13: {\n 14: public:\n 15:    // override Fish::Swim\n 16:    void Swim()\n 17:\
  \    {\n 18:       cout << \"Tuna swims!\" << endl;\n 19:    }\n 20: };\n 21:\n\
  \ 22: void MakeFishSwim(Fish& inputFish)\n 23: {\n 24:    // calling Fish::Swim\n\
  \ 25:    inputFish.Swim();\n 26: }\n 27:\n 28: int main()\n 29: {\n 30:    Tuna\
  \ myDinner;\n 31:\n 32:    // calling Tuna::Swim\n 33:    myDinner.Swim();\n 34:\n\
  \ 35:    // sending Tuna as Fish\n 36:    MakeFishSwim(myDinner);\n 37:\n 38:  \
  \  return 0;\n 39: }\n```\n\n点击此处查看代码图片\n\n##### 输出 ▼\n\n```\nTuna swims!\nFish\
  \ swims!\n```\n\n##### 分析 ▼\n\n`Tuna` 类通过公共继承特化了 `Fish` 类，如第 12 行所示。它还重写了 `Fish::Swim()`。`main()`\
  \ 在第 33 行直接调用了 `Tuna::Swim()`，并将 `myDinner`（类型为 `Tuna`）作为参数传递给 `MakeFishSwim()`，如第\
  \ 22 行声明所示，它被解释为引用 `Fish&`。换句话说，`MakeFishSwim(Fish&)` 并不关心发送的对象是否是 `Tuna`，它将其作为\
  \ `Fish` 处理并调用 `Fish::Swim()`。因此，输出的第二行表示同一个对象 `Tuna` 产生了 `Fish` 的输出，而不是表明其有任何特化（而且也可以是\
  \ `Carp`）。\n\n用户理想上期望的是，即使调用的方法是 `Fish::Swim()`，类型为 `Tuna` 的对象也表现得像金鱼。换句话说，当第 25\
  \ 行调用 `inputFish.Swim()` 时，用户期望它执行 `Tuna::Swim()`。这种多态行为允许基类 `Fish` 的对象表现出其实际类型的行为；即，可以通过将\
  \ `Fish::Swim()` 实现为`虚函数`来实现。\n\n#### 使用虚函数实现的多态行为\n\n你可以通过指针 `Fish*` 或引用 `Fish&`\
  \ 访问类型为 `Fish` 的对象。该对象可能仅被实例化为 `Fish`，也可能是继承自 `Fish` 的 `Tuna` 或 `Carp` 的一部分。你不知道（也不在乎）。你使用此指针或引用调用\
  \ `Swim()` 方法，如下所示：\n\n```\npFish->Swim();\nmyFish.Swim();\n```\n\n你期望的是，如果对象 `Fish`\
  \ 是 `Tuna` 的一部分，它就像 `Tuna` 一样游泳；如果它是 `Carp` 的一部分，它就像 `Carp` 一样游泳；如果它是 `Fish`，它就像\
  \ `Fish` 一样游泳。在基类 `Fish` 中使用 `virtual` 关键字可以确保这一点可以实现。\n\n```\n\n##### 输入 ▼\n\n\
  列表 11.2 将 `Fish::Swim()` 声明为虚函数的效果\n\n```\n 0: #include<iostream>\n 1: using namespace\
  \ std;\n 2:\n 3: class Fish\n 4: {\n 5: public:\n 6:    virtual void Swim()\n 7:\
  \    {\n 8:       cout << \"Fish swims! \" << endl;\n 9:    }\n10: };\n 11:\n 12:\
  \ class Tuna:public Fish\n 13: {\n 14: public:\n 15:    // override Fish::Swim\n\
  \ 16:    void Swim()\n 17:    {\n 18:       cout << \"Tuna swims!\" << endl;\n 19:\
  \    }\n 20: };\n 21:\n 22: class Carp:public Fish\n 23: {\n 24: public:\n 25: \
  \   // override Fish::Swim\n 26:    void Swim()\n 27:    {\n 28:       cout << \"\
  Carp swims!\" << endl;\n 29:    }\n 30: };\n 31:\n 32: void MakeFishSwim(Fish& inputFish)\n\
  \ 33: {\n 34:    // calling Fish::Swim\n 35:    inputFish.Swim();\n 36: }\n 37:\n\
  \ 38: int main()\n 39: {\n 40:    Tuna myDinner;\n 41:    Carp myLunch;\n 42:\n\
  \ 43:    // sending Tuna as Fish\n 44:    MakeFishSwim(myDinner);\n 45:\n 46:  \
  \  // sending Carp as Fish\n 47:    MakeFishSwim(myLunch);\n 48:\n 49:    return\
  \ 0;\n 50: }\n```\n\n点击此处查看代码图片\n\n##### 输出 ▼\n\n```\nTuna swims!\nCarp swims!\n\
  ```\n\n##### 分析 ▼\n\n`MakeFishSwim(Fish&)` 函数的实现自列表 11.1 以来没有一点变化。然而，它产生的输出发生了巨大的变化。一方面，由于存在\
  \ `Tuna::Swim()` 和 `Carp::Swim()` 的重写变，`Fish::Swim()` 根本没有被调用，因为后者被声明为`虚函数`。这是一个非常重要的进展。这意味着即使不知道所处理的\
  \ `Fish` 的确切类型，仅通过基类实例，`MakeFishSwim()` 也可以导致执行派生类中定义的 `Swim()` 实现。\n\n这就是多态：将不同的鱼视为一种共同类型\
  \ `Fish`，但确保执行由派生类型提供的正确的 `Swim()` 实现。\n\n#### 虚析构函数的需求\n\n列表 11.1 中演示的特性有一个更阴险的一面：在可用特化的情况下，无意中调用派生类型实例的基类功能。当函数使用指向\
  \ `Derived` 类型实例的 `Base*` 指针调用 `delete` 运算符时会发生什么？\n\n哪个析构函数会被调用？参见列表 11.3。\n\n\
  ##### 输入 ▼\n\n列表 11.3 对 `Base*` 调用 `delete` 运算符的函数\n\n\n\n\n\n```cpp\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: class Fish\n 4: {\n 5: public:\n 6:    Fish()\n\
  \ 7:    {\n 8:       cout << \"Constructed Fish\" << endl;\n 9:    }\n10:    ~Fish()\n\
  11:    {\n12:       cout << \"Destroyed Fish\" << endl;\n13:    }\n14: };\n15:\n\
  16: class Tuna:public Fish\n17: {\n18: public:\n19:    Tuna()\n20:    {\n21:   \
  \    cout << \"Constructed Tuna\" << endl;\n22:    }\n23:    ~Tuna()\n24:    {\n\
  25:       cout << \"Destroyed Tuna\" << endl;\n26:    }\n27: };\n28:\n29: void DeleteFish(Fish*\
  \ pFish)\n30: {\n31:    delete pFish;\n32: }\n33:\n34: int main()\n35: {\n36:  \
  \  cout << \"Allocating a Tuna on the free store:\" << endl;\n37:    Tuna* pTuna\
  \ = new Tuna;\n38:    cout << \"Deleting the Tuna: \" << endl;\n39:    DeleteFish(pTuna);\n\
  40:\n41:    cout << \"Instantiating a Tuna on the stack:\" << endl;\n42:    Tuna\
  \ myDinner;\n43:    cout << \"Automatic destruction as it goes out of scope: \\\
  n\";\n44:\n45:    return 0;\n46: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nAllocating\
  \ a Tuna on the free store:\nConstructed Fish\nConstructed Tuna\nDeleting the Tuna:\n\
  Destroyed Fish\nInstantiating a Tuna on the stack:\nConstructed Fish\nConstructed\
  \ Tuna\nAutomatic destruction as it goes out of scope:\nDestroyed Tuna\nDestroyed\
  \ Fish\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n`main()` 在第 37 行使用 `new` 在自由堆上创建了一个 `Tuna`\
  \ 实例，并在第 39 行通过服务函数 `DeleteFish()` 释放了分配的内存。为了进行对比，另一个 `Tuna` 实例在第 42 行作为局部变量 `myDinner`\
  \ 创建在栈上，它在 `main()` 结束时超出作用域。输出是由 `Fish` 和 `Tuna` 类的构造函数和析构函数中的 `cout` 语句产生的。注意，虽然由于第\
  \ 37 行使用了 `new` 运算符，`Tuna` 及其 `Fish` 都在自由堆上被构造，但第 39 行通过 `DeleteFish()` 对分配内存的析构是不完全。在执行\
  \ `delete` 期间没有调用 `Tuna` 的析构函数；相反，只调用了 `Fish` 的析构函数。这与局部成员 `myDinner` 的构造和析构形成了鲜明对比，后者所有的构造函数和析构函数都会被调用。第\
  \ 10  在列表 10.7 中演示了继承体系中类构造和析构的正确顺序，显示所有析构函数都需要被调用，包括 `~Tuna()`。显然，这里有问题。\n\n这个缺陷意味着，如果使用\
  \ `new` 在自由堆上实例化派生类，但使用 `Base*` 指针调用 `delete`，类的析构函数将不会被调用。这可能导致资源未释放、内存泄漏等，是一个不容忽视的问题。\n\
  \n为了避免这个问题，你需要使用虚析构函数，如列表 11.4 所示。\n\n### 输入 ▼\n\n列表 11.4 使用虚析构函数以确保在删除 `Base*`\
  \ 类型指针时调用派生类中的析构函数\n\n```cpp\n 0: #include<iostream>\n 1: using namespace std;\n\
  \ 2:\n 3: class Fish\n 4: {\n 5: public:\n 6:    Fish()\n 7:    {\n 8:       cout\
  \ << \"Constructed Fish\" << endl;\n 9:    }\n10:    virtual ~Fish()   // 虚析构函数！\n\
  11:    {\n12:       cout << \"Destroyed Fish\" << endl;\n13:    }\n14: };\n15:\n\
  16: class Tuna:public Fish\n17: {\n18: public:\n19:    Tuna()\n20:    {\n21:   \
  \    cout << \"Constructed Tuna\" << endl;\n22:    }\n23:    ~Tuna()\n24:    {\n\
  25:       cout << \"Destroyed Tuna\" << endl;\n26:    }\n27: };\n28:\n29: void DeleteFish(Fish*\
  \ pFish)\n30: {\n31:    delete pFish;\n32: }\n33:\n34: int main()\n35: {\n36:  \
  \  cout << \"Allocating a Tuna on the free store:\" << endl;\n37:    Tuna* pTuna\
  \ = new Tuna;\n38:    cout << \"Deleting the Tuna: \" << endl;\n39:    DeleteFish(pTuna);\n\
  40:\n41:    cout << \"Instantiating a Tuna on the stack:\" << endl;\n42:    Tuna\
  \ myDinner;\n43:    cout << \"Automatic destruction as it goes out of scope: \\\
  n\";\n44:\n45:    return 0;\n46: }\n```\n\n\n\n\n因此，每个表都由函数指针组成，每个指针指向虚函数的可用实现。在\
  \ `Derived` 类的情况下，其 VFT（虚函数表）中除一个函数指针外，所有指针都指向 `Derived` 中该虚方法的本地实现。`Derived` 没有重写\
  \ `Base::Func2()`，因此该函数指针指向 `Base` 类中的实现。\n\n这意味着当 `Derived` 类的用户调用时：\n\n```\nDerived\
  \ objDerived;\nobjDerived.Func2();\n```\n\n点击此处查看代码图像\n\n编译器会确保在 `Derived` 类的 VFT\
  \ 中进行查找，并确保调用了 `Base::Func2()` 实现。这同样适用于使用已虚重写方法的调用：\n\n```\nvoid DoSomething(Base&\
  \ objBase)\n{\n   objBase.Func1();   // 调用 Derived::Func1\n}\nint main()\n{\n  \
  \ Derived objDerived;\n   DoSomething(objDerived);\n};\n```\n\n点击此处查看代码图像\n\n在这种情况下，尽管\
  \ `objDerived` 通过 `objBase` 被解释为 `Base` 类的实例，但该实例中的 VFT 指针仍然指向为 `Derived` 类创建的同一个表。因此，通过此\
  \ VFT 执行的 `Func1()` 无疑是 `Derived::Func1()`。\n\n你可以看到 VFT 如何帮助 C++ 中（子类型）多态的实现。\n\
  \n隐藏 VFT 指针存在的证明在列表 11.5 中给出，该列表比较了两个相同类的大小——一个有一个虚函数，另一个没有。\n\n#### 输入 ▼\n\n列表\
  \ 11.5 通过比较两个除声明为虚函数外完全相同的类，展示隐藏 VFT 指针的存在\n\n```\n 0: #include<iostream>\n 1: using\
  \ namespace std;\n 2:\n 3: class SimpleClass\n 4: {\n 5:    int a, b;\n 6:\n 7:\
  \ public:\n 8:    void DoSomething() {}\n 9: };\n10:\n 11: class Base\n 12: {\n\
  \ 13:    int a, b;\n 14:\n 15: public:\n 16:    virtual void DoSomething() {}\n\
  \ 17: };\n 18:\n 19: int main()\n 20: {\n 21:    cout << \"sizeof(SimpleClass) =\
  \ \" << sizeof(SimpleClass) << endl;\n 22:    cout << \"sizeof(Base) = \" << sizeof(Base)\
  \ << endl;\n 23:\n 24:    return 0;\n 25: }\n```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n\
  **32 位编译器输出：**\n\n```\nsizeof(SimpleClass) = 8\nsizeof(Base) = 12\n```\n\n点击此处查看代码图像\n\
  \n**64 位编译器输出：**\n\n```\nsizeof(SimpleClass) = 8\nsizeof(Base) = 16\n```\n\n点击此处查看代码图像\n\
  \n#### 分析 ▼\n\n此示例已精简到极致。你看到两个类，`SimpleClass` 和 `Base`，它们在成员类型和数量上是相同的。然而，`Base`\
  \ 的函数 `DoSomething()` 被声明为虚函数。添加此 `virtual` 关键字的区别在于，编译器为 `Base` 类生成了一个虚函数表，并留了一个指向\
  \ VFT 指针的位置作为隐藏成员。该指针在 32 位系统中额外消耗了 4 字节。输出证明了，对于至少包含一个虚函数的类，编译器会插入一个隐藏指针。\n\nC++\
  \ 还允许你使用强制转换操作符 `dynamic_cast` 来查询指针 `Base*` 是否为类型 `Derived*`，然后根据查询结果进行条件执行。这一过程称为运行时类型识别\
  \ (RTTI)，理想情况下应该避免使用，尽管大多数 C++ 编译器都支持它。需要知道基指针后派生类的类型通常被认为是糟糕的编程实践。RTTI 和 `dynamic_cast`\
  \ 在第 13 节“转换运算符”中进行了讨论。\n\n#### 抽象基类与纯虚函数\n\n不能实例化的基类称为抽象基类。这种基类只实现一个目的：供派生自它的类在继承层次中使用。C++\
  \ 允许你使用纯虚函数来创建抽象基类。当一个虚方法具有如下声明时，它被认为是纯虚的：\n\n```\nclass AbstractBase\n{\npublic:\n\
  \   virtual void DoSomething() = 0;\n};\n```\n\n点击此处查看代码图像\n\n此声明本质上告诉编译器，`DoSomething()`\
  \ 需要由派生自 `AbstractBase` 的类来实现：\n\n```\nclass Derived: public AbstractBase\n{\npublic:\n\
  \   void DoSomething()   // 必须实现纯虚函数\n   {\n      cout << \"Implemented virtual\
  \ function\" << endl;\n   }\n};\n```\n\n\n\n\n![插图显示一个组件指向三个独立的类。](img/11fig02.jpg)\n\
  \n**图 11.2** 鸭嘴兽的类图，展示了多重继承。\n\n那么，当实例化 `Platypus` 类时会发生什么？为了一个 `Platypus` 实例会实例化多少个\
  \ `Animal` 类实例？列表 11.7 帮助回答这个问题。\n\n### 输入 ▼\n\n列表 11.7 检查一个 `Platypus` 实例对应的基类\
  \ `Animal` 实例数量\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n\
  \ 3: class Animal\n 4: {\n 5: public:\n 6:    Animal()\n 7:    {\n 8:       cout\
  \ << \"Animal constructor\" << endl;\n 9:    }\n10:\n11:    int age;\n112: };\n\
  13:\n14: class Mammal:public Animal {};\n15: class Bird:public Animal {};\n16: class\
  \ Reptile:public Animal {};\n17:\n18: class Platypus :public Mammal, public Bird,\
  \ public Reptile\n19: {\n20: public:\n21:    Platypus()\n22:    {\n23:       cout\
  \ << \"Platypus constructor\" << endl;\n24:    }\n25: };\n26:\n27: int main()\n\
  28: {\n29:    Platypus duckBilledP;\n30:\n31:    // uncomment next line of code\
  \ to see compile failure because\n32:    // age is ambiguous: three instances of\
  \ base Animal per Platypus\n33:    // duckBilledP.age = 25;\n34:\n35:    return\
  \ 0;\n36: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nAnimal constructor\nAnimal constructor\n\
  Animal constructor\nPlatypus constructor\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n如输出所示，由于多重继承以及\
  \ `Platypus` 的三个基类都分别继承自 `Animal` 类，每创建一个 `Platypus` 实例，都会自动创建三个 `Animal` 实例，如第\
  \ 29 行所示。这是很荒的，因为 `Platypus` 仍然是一只继承了来自 `Mammal`、`Bird` 和 `Reptile` 特定属性的动物。基类 `Animal`\
  \ 实例数量的问题不仅限于内存消耗。`Animal` 有一个整数成员 `Animal::age`（为了解释说明已保持为公共）。当你想要通过 `Platypus`\
  \ 实例访问 `Animal::age` 时（如第 33 行所示），你会得到编译错误，仅因为编译器不知道你是想设置 `Mammal::Animal::age`\
  \ 还是 `Bird::Animal::age` 或 `Reptile::Animal::age`。情况甚至变得更荒谬。如果你愿意，可以设置所有这三个：\n\n\
  ```\nduckBilledP.Mammal::Animal::age = 25;\nduckBilledP.Bird::Animal::age = 2;\n\
  duckBilledP.Reptile::Animal::age = 5;\n```\n\n点击此处查看代码图片\n\n显然，一只鸭嘴兽应该只有一个 `age`。然而，你又希望\
  \ `Platypus` 类也是 `Mammal`、`Bird` 和 `Reptile`。解决方案是虚拟继承。如果你预计一个派生类会被用作基类，那么使用 `virtual`\
  \ 关键字来定义它与基类的关系可能是一个好主意：\n\n```\nclass Derived1: public virtual Base\n{\n   // ...\
  \ members and functions\n};\nclass Derived2: public virtual Base\n{\n   // ... members\
  \ and functions\n};\n```\n\n点击此处查看代码图片\n\n列表 11.8 展示了一个改进的 `Platypus` 类（实际上是更好的\
  \ `Mammal` 类、`Bird` 类和 `Reptile` 类）。\n\n### 输入 ▼\n\n列表 11.8 演示继承体系中的 `virtual` 关键字如何帮助将基类\
  \ `Animal` 的实例数量限制为一\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n\
  \ 2:\n 3: class Animal\n 4: {\n 5: public:\n 6:    Animal()\n 7:    {\n 8:     \
  \  cout << \"Animal constructor\" << endl;\n 9:    }\n10:\n11:    int age;\n12:\
  \ };\n13:\n14: class Mammal:public virtual Animal {};\n15: class Bird:public virtual\
  \ Animal {};\n16: class Reptile:public virtual Animal {};\n17:\n18: class Platypus\
  \ final:public Mammal, public Bird, public Reptile\n19: {\n20: public:\n21:    Platypus()\n\
  22:    {\n23:       cout << \"Platypus constructor\" << endl;\n24:    }\n25: };\n\
  26:\n27: int main()\n28: {\n29:    Platypus duckBilledP;\n30:\n31:    // uncomment\
  \ next line of code to see compile failure because\n32:    // age is ambiguous:\
  \ three instances of base Animal per Platypus\n33:    // duckBilledP.age = 25;\n\
  34:\n35:    return 0;\n36: }\n```\n\n\n\n\n因此，`override` 提供了一种强大的方式，用来显式表达重写基类虚函数的意图，从而让编译器检查：\n\
  \n*   基类函数是否为虚函数。\n*   基类虚函数的签名是否与声明要重写的派生类函数签名完全匹配。\n\n### 使用 `final` 防止函数重写\n\n\
  `final` 饰符最早在 第 10 节 中就向你介绍过。声明为 `final` 的类不能作为基类。同样，声明为 `final` 的虚函数不能在派生类中被重写。\n\
  \n因此，一个不允许对虚函数 `Swim()` 进行进一步特特化的 `Tuna` 类版本如下：\n\n```cpp\nclass Tuna:public Fish\n\
  {\npublic:\n   // 重写 Fish::Swim 并将其标记为 final\n   void Swim() override final\n  \
  \ {\n      cout << \"Tuna swims!\" << endl;\n   }\n};\n```\n\n点击此处查看代码图片\n\n此版本的\
  \ `Tuna` 可以被继承，但 `Swim()` 不能再被进一步重写：\n\n```cpp\nclass BluefinTuna final:public Tuna\n\
  {\npublic:\n   void Swim() // 错误：Swim() 在 Tuna 中是 final，无法重写\n   {\n   }\n};\n```\n\
  \n点击此处查看代码图片\n\n在 列表 11.9 中提供了 `override` 和 `final` 饰符的演示。\n\n### 注意\n\n\n\n我们在声明\
  \ `BluefinTuna` 类时也同样了 `final`。这确保了 `BluefinTuna` 类不能作为基类使用。因此，以下代码会导致错误：\n\n```cpp\n\
  class FailedDerivation:public BluefinTuna {};\n```\n\n### 虚拷贝构造函数？\n\n嗯，章节标题末尾的问号是有根据的。在\
  \ C++ 中，技术上是不存在虚拷贝构造函数的。然而，这种功能可以帮助你创建一个 `Base*` 类型的集合（例如，静态数组），其中每个元素都是该类型的特化版本：\n\
  \n```cpp\n// Tuna, Carp 和 Trout 是继承自基类 Fish 的类\nFish* pFishes[3];\nFishes[0] = new\
  \ Tuna();\nFishes[1] = new Carp();\nFishes[2] = new Trout();\n```\n\n点击此处查看代码图片\n\
  \n然后将其赋值到另一个相同类型的数组中，虚拷贝构造函数确保了派生类对象也被深拷贝，从而确保即使拷贝构造函数是对 `Fish*` 类型进行操作，`Tuna`、`Carp`\
  \ 和 `Trout` 被拷贝为 `Tuna`、`Carp` 和 `Trout`。\n\n好吧，这是一个美好的。\n\n虚拷贝构造函数是不可能的，因为 `virtual`\
  \ 关键字在基类方法被派生类实现重写的语境下，指的是运行时生成的多态行为。然而，构造函数本质上不是多态的，因为它们只能构造固定类型，因此 C++ 不允许使用虚拷贝构造函数。\n\
  \n尽管如此，有一种通过定义自己的 `clone` 函数实现的良好变通方法，它允许你实现这一功能：\n\n```cpp\nclass Fish\n{\npublic:\n\
  \   virtual Fish* Clone() const = 0; // 纯虚函数\n};\n\nclass Tuna:public Fish\n{\n\
  // ... 其他成员\npublic:\n   Fish* Clone() const  // 虚拷贝函数\n   {\n      return new Tuna(*this);\
  \  // 返回一个此对象的拷贝的新 Tuna\n   }\n};\n```\n\n点击此处查看代码图片\n\n因此，虚函数 `Clone()` 是模拟的虚拷贝构造函数，需要显式调用，如\
  \ 列表 11.9 所示。\n\n##### 输入 ▼\n\n列表 11.9 `Tuna` 和 `Carp` 类，支持 `Clone()` 函数作为模拟虚拷贝构造函数\n\
  \n```cpp\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: class Fish\n\
  \ 4: {\n 5: public:\n 6:    virtual Fish* Clone() = 0;\n 7:    virtual void Swim()\
  \ = 0;\n 8:    virtual ~Fish() {};\n 9: };\n10:\n 11: class Tuna: public Fish\n\
  \ 12: {\n 13: public:\n 14:    Fish* Clone() override\n 15:    {\n 16:       return\
  \ new Tuna (*this);\n 17:    }\n 18:\n 19:    void Swim() override final\n 20: \
  \   {\n 21:       cout << \"Tuna swims fast in the sea\" << endl;\n 22:    }\n 23:\
  \ };\n 24:\n 25: class BluefinTuna final:public Tuna\n 26: {\n 27: public:\n 28:\
  \    Fish* Clone() override\n 29:    {\n 30:       return new BluefinTuna(*this);\n\
  \ 31:    }\n 32:\n 33:    // 不能重写 Tuna::Swim\n 34: };\n 35:\n 36: class Carp: public\
  \ Fish\n 37: {\n 38: public:\n 39:    Fish* Clone() override\n 40:    {\n 41:  \
  \     return new Carp(*this);\n 42:    }\n 43:\n 44:    void Swim() override final\n\
  \ 45:    {\n 46:       cout << \"Carp swims slow in the lake\" << endl;\n 47:  \
  \  }\n 48: };\n 49:\n 50: int main()\n 51: {\n 52:    const int ARRAY_SIZE = 4;\n\
  \ 53:    Fish* pFishes[ARRAY_SIZE];\n 54:    pFishes[0] = new Tuna();\n 55:    pFishes[1]\
  \ = new Carp();\n 56:    pFishes[2] = new BluefinTuna();\n 57:    pFishes[3] = new\
  \ Carp();\n 58:\n 59:    Fish* myNewishes[ARRAY_SIZE];\n 60:    for (int i = 0;\
  \ i < ARRAY_SIZE; ++i)\n 61:       myNewishes[i] = pFishes[i]->Clone();\n 62:  \
  \  }\n 63:\n 64:    for (int i = 0; i < ARRAY_SIZE; ++i)\n 65:       myNewishes[i]->Swim();\n\
  \ 66:    }\n 67:\n 68:    for (int i = 0; i < ARRAY_SIZE; ++i)\n 69:    {\n 70:\
  \       delete pFishes[i];\n 71:       delete myNewishes[i];\n 72:    }\n 73:\n\
  \ 74:    return 0;\n 75: }\n```\n\n点击此处查看代码图片\n\n##### 输出 ▼\n\n```\nTuna swims fast\
  \ in the sea\nCarp swims slow in the lake\nTuna swims fast in the sea\nCarp swims\
  \ slow in the lake\n```\n\n##### 分析 ▼\n\n除了通过虚函数 `Clone()` 演示虚拷贝构造函数外，列表 11.9 还演示了\
  \ `override` 和 `final` 的用法——后者被应用于虚函数和类。\n\n\n\n\n\n| **DO** 记得将派生类需要重写的基类函数标记为\
  \ `virtual`。**DO** 记得纯虚函数会使你的类成为抽象基类，这些函数必须由派生类实现。**DO** 在派生类中使用 `override` 关键字标记那些旨在重写基类功能的函数。**DO**\
  \ 使用虚继承来解决菱形继承问题。 | **DON’T** 忘记为你的基类提供一个虚析构函数。**DON’T** 忘记编译器不允许你创建抽象基类的独立实例。**DON’T**\
  \ 忘记虚继承是为了确保在菱形层次结构中的公共基类只有一个实例。**DON’T** 混淆在创建继承层次结构时使用 `virtual` 关键字的作用与在声明基类函数时使用相同关键字的作用混为一谈。\
  \ |\n\n### 总结\n\n在本节中，你学习了如何通过多态在 C++ 代码中利用创建继承层次结构的强大能力。你学习了如何声明和编写虚函数——以及它们如何确保即使使用基类实例来调用虚方法，派生类的实现也能重写（覆盖）基类中的实现。你看到纯虚函数是虚函数的一种特殊类型，它们确保基类本身不能被实例化，使其成为定义派生类必须履行的接口的完美位置。最后，你看到了多重继承引起的菱形问题，以及虚继承如何帮助你解决它。\n\
  \n### 问答\n\nQ 为什么代码在不加关键字的情况下也能编译，却要在基类函数上使用 `virtual` 关键字？\n\n**A** 没有 `virtual`\
  \ 关键字，你无法确保调用 `objBase.Function()` 的操作会被重定向到 `Derived::Function()`。此外，代码的编译并不是衡量质量的唯一标准。\n\
  \nQ 为什么编译器会创建虚函数表（VFT）？\n\n**A** 编译器创建一个 VFT 来存储函数指针。该表确保在层次结构中支持的正确的虚函数被调用。\n\n\
  Q 基类应该始终有一个虚析构函数吗？\n\n**A** 理想情况下是应该。只有这样你才能确保当有人执行以下操作时：\n\n```\n Base* pBase =\
  \ new Derived();\n  delete pBase;\n```\n\n点击此处查看代码图像\n\n对类型为 `Base*` 的指针执行 `delete`\
  \ 会导致析构函数 `~Derived()` 被调用。这在析构函数 `~Base()` 被声明为 `virtual` 时发生。\n\nQ 当我甚至无法将其作为独立类实例化时，抽象基类（ABC）有什么用？\n\
  \n**A** ABC 的目的不是被实例化为独立对象；相反，它总是为了被派生。它包含了纯虚函数，定义了派生类需要实现的函数最小蓝图，从而充当接口的角色。\n\n\
  Q 给定一个继承层次结构，我需要在所有虚函数的声明处都使用 `virtual` 关键字，还是只需要在基类中使用？\n\n**A** 只需将函数声明一次 `virtual`\
  \ 就足够了，但该声明必须在基类中。\n\nQ 我可以在 ABC 中定义成员函数并拥有成员属性吗？\n\n**A** 当然可以。请记住，你仍然无法实例化 ABC，因为它至少有一个需要由派生类实现的纯虚函数。\n\
