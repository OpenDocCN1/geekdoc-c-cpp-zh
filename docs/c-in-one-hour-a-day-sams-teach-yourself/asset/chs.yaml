  \n### 输出 ▼\n\n```\n-1\n43\n78\n124\nElement -1 found!\nElement 12345 not found in\
  \ set!\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n\n\n\n第 15 到 21 行展示了 `find()` 成员函数的使用。`find()`\
  \ 返回一个迭代器，需要将其与 `end()` 进行比较（如第 18 行所示），以验证是否找到了某个元素。如果迭代器有效，你可以通过 `*elementFound`\
  \ 访问它所指向的值。\n\n### 注意事项\n列表 19.3 中的示例对于 `multiset`（多重集合）同样可以工作；也就是说，如果第 6 行是 `multiset`\
  \ 而不是 `set`，它不会改变应用程序的运行方式。`multiset` 可以在连续的位置存储多个具有相同值的元素，你可以通过使用 `find()` 返回的迭代器并将其移动\
  \ `count() – 1` 次来访问所有具有特定值的元素。成员方法 `count()` 已经在 列表 19.2 中进行了演示。\n\n### 在 STL `set`\
  \ 或 `multiset` 容器中删除元素\n像 `set`、`multiset` 或 `map` 和 `multimap` 这样的关联容器都具有 `erase()`\
  \ 方法——这是一个成员方法，允许你根据键删除一个值：\n\n```\nsetObject.erase(key);\n```\n\n`erase()` 函数的另一种形式允许根据指向特定元素的迭代器来删除该元素：\n\
  \n```\nsetObject.erase(element);\n```\n\n你可以使用提供边界的迭代器从 `set` 或 `multiset` 中删除范围内的元素：\n\
  \n```\nsetObject.erase(iLowerBound, iUpperBound);\n```\n\n点击此处查看代码图像\n\n列表 19.4\
  \ 展示了如何使用 `erase()` 从 `set` 或 `multiset` 中移除元素。\n\n#### 输入 ▼\n列表 19.4 在 Multiset\
  \ 上使用 `erase()` 成员函数\n\n```\n 0: #include<set>\n 1: #include<iostream>\n 2: using\
  \ namespace std;\n 3:\n 4: template <typename T>\n 5: void DisplayContents(const\
