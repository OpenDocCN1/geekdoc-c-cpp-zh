  \n2. 2. 编写一个程序，使用 `stack` 类反转用户的字符串输入。\n\n## 第 25 节\n\n## 使用 STL 处理位标志\n\n使用位是存储设置和标志的一种高效方法。标准模板库（STL）提供了帮助组织和操作位位信息的类。本节将向你介绍：\n\
  \n* `bitset` 类\n* `vector<bool>` 类\n\n### `bitset` 类\n\n`std::bitset` 是设计用于处理位信息和位标志的\
  \ STL 类。`std::bitset` 不是 STL 容器类，因为它不能调整自身的大小。它是一个实用类，专门针对处理长度在编译时已知的位序列进行了优化。\n\
  \n提示\n\n要使用 `std::bitset` 类，请包含头文件 `<bitset>`：\n\n```\n#include<bitset>\n```\n\n\
  #### 实例化 `std::bitset`\n\n`bitset` 模板类要求你提供一个模板参数，该参数包含类实例需要管理的位数数量：\n\n```\nbitset<4>\
  \ fourBits;  // 4 位初始化为 0000\n```\n\n点击此处查看代码图片\n\n你也可以用 `char*` 字符串字面量表示的位序列初始化\
  \ bitset：\n\n```\nbitset<5> fiveBits(\"10101\"); // 5 位 10101\n```\n\n点击此处查看代码图片\n\
  \n在实例化另一个 bitset 的同时从另一个一个拷贝非常简单：\n\n```\nbitset<5> fiveBits(fiveBits);\n```\n\n\
  点击此处查看代码图片\n\n`bitset` 的某些实例化技术在列表 25.1 中有所演示。\n\n### 输入\n\n列表 25.1 实例化 `std::bitset`\n\
  \n```\n#include<bitset>\n#include<iostream>\n#include<string>\n\nint main() {\n\
  \    using namespace std;\n\n    bitset<4> fourBits; // 4 位初始化为 0000\n    cout <<\
  \ \"Initial contents of fourBits: \" << fourBits << endl;\n\n    bitset<5> fiveBits(\"\
  10101\"); // 5 位 10101\n    cout << \"Initial contents of fiveBits: \" << fiveBits\
  \ << endl;\n\n    bitset<6> sixBits(0b100001); // 二进制字面量\n    cout << \"Initial\
  \ contents of sixBits: \" << sixBits << endl;\n\n    bitset<8> eightBits(255); //\
  \ 8 位初始化为 255\n    cout << \"Initial contents of eightBits: \" << eightBits << endl;\n\
  \n    // 作为另一个的拷贝实例化\n    bitset<8> eightBitsCopy(eightBits);\n\n    return 0;\n\
  }\n```\n\n点击此处查看代码图片\n\n### 输出\n\n```\nInitial contents of fourBits: 0000\nInitial\
  \ contents of fiveBits: 10101\nInitial contents of sixBits: 100001\nInitial contents\
  \ of eightBits: 11111111\n```\n\n点击此处查看代码图片\n\n### 分析\n\n此示例演示了构造 `bitset` 对象的四种方法。第\
  \ 8 行使用默认构造函数初始化位序列。第 11 行使用了包含所需位序列表示的字符串字面量。第 14 行和第 17 行演示了使用二进制字面量整数初始化 `bitset`，而第\
  \ 21 行演示了使用拷贝构造函数初始化。注意，在这些情况下，你必须作为模板参数提供 bitset 应包含的位数。这个数字在编译时是固定的，不是动态的。你不能向\
  \ bitset 插入超过指定的位数。\n\n提示\n\n注意第 14 行中二进制字面量 `0b100001` 使用。\n\n### 使用 `std::bitset`\
  \ 及其成员\n\n`bitset` 类提供了成员函数，帮助向 bitset 插入内容、设置或重置内容、读取位或将位写入流中。它还提供了运算符，帮助显示 bitset\
  \ 的内容并执行位逻辑操作等。\n\n#### `std::bitset` 中的常用运算符\n\n\n\n\n\n你已经在第 12 节“运算符类型与运算符重载”中学习了运算符，并且还了解到运算符最重要的作用是提高类的易用性。`std::bitset`\
  \ 提供了使使用该类变得非常简单的运算符。这些运算符列在表 25.1 中，并使用代码 25.1 中的示例 bitset `fourBits` 进行了解释。\n\n\
  | 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| `<<` | 将位序列的文本表示插入输出流 | `cout <<` `fourBits;`\
  \ |\n| `>>` | 将字符串插入 bitset 对象 | `\"0101\" >> fourBits;` |\n| `&` | 执行按位与操作 | `bitset<4>\
  \ result(fourBits1 & fourBits2);` |\n| `|` | 执行按位或操作 | `bitset<4> result(fourBits1\
  \ | fourBits2);` |\n| `^` | 执行按位异异操作 | `bitset<4> result(fourBits1 ^ fourBits2);`\
  \ |\n| `~` | 执行按位取反 | `bitset<4> result(~fourBits1);` |\n| `>>=` | 执行按位右移 | `fourBits\
  \ >>= (2); // 向右移动二位` |\n| `<<=` | 执行按位左移 | `fourBits <<= (2); // 位向左移动两位` |\n|\
  \ `[N]` | 返回序列中第 N 位的引用 | `fourBits[2] = 0; // 将第三位设置为 0` `bool flag = fourBits[2];\
  \ // 读取第三位` |\n\n**表 25.1** `std::bitset` 支持的运算符\n\n此外，`std::bitset` 还具有如 `|=`、`&=`、`^=`\
  \ 和 `~=` 等运算符，它们有助于对 `bitset` 对象执行按位操作。\n\n### `std::bitset` 成员方法\n\n位可以持有两种状态：置位（`1`）或重置（`0`）。为了帮助操作\
  \ bitset 的内容，你可以使用表 25.2 列出的成员函数，这些函数可以帮助你处理位或 bitset 中的所有位。\n\n| 函数 | 描述 | 示例 |\n\
  | --- | --- | --- |\n| `set()` | 将序列中的所有位设置为 `1` | `fourBits.set(); // 序列现在包含：'1111'`\
  \ |\n| `set(N, val=1)` | 将第 N 位设置为 `val` 指定的值（默认为 `1`） | `fourBits.set(2, 0); //\
  \ 将第三位设置为 0` |\n| `reset()` | 将序列中的所有位重置为 `0` | `fourBits.reset(); // 序列包含：'0000'`\
  \ |\n| `reset(N)` | 清除第 N 位 | `fourBits.reset(2); // 第三位现在是 0` |\n| `flip()` | 翻转序列中的所有位\
  \ | `fourBits.flip(); // 0101 变为 1010` |\n| `size()` | 返回序列中的位数 | `size_t numBits\
  \ = fourBits.size(); // 返回 4` |\n| `count()` | 返回持有 `true` 的位数 | `size_t numBitsSet\
  \ = fourBits.count();`size_t numBitsReset = fourBits.size() - fourBits.count();`\
  \ |\n| `to_ulong()` | 返回与 bitset 内容对应的 `unsigned long` 值 | `unsigned long value\
  \ = fourBits.to_ulong()` |\n| `to_ullong()` | 返回与 bitset 内容对应的 `unsigned long long`\
  \ 值 | `unsigned long long value = fourBits.to_ullong();` |\n| `all()` | 如果所有位都被设置为\
  \ `true` 则返回 `true`；否则返回 `false` | `if(fourBits.all()){{/* 执行操作*/}` |\n| `any()`\
  \ | 如果任意一个位被设置为 `true` 则返回 `true`；否则返回 `false` | `if(fourBits.any()){{/* 执行操作*/}`\
  \ |\n| `none()` | 如果没有位被设置为 `true` 则返回 `true`；否则返回 `false` | `if(fourBits.none()){{/*\
  \ 执行操作*/}` |\n\n**表 25.2** `std::bitset` 中的常用成员方法\n\n这些成员方法和运算符的使用在代码 25.2 中得到了演示。\n\
  \n##### 输入 ▼\n\n代码 25.2 使用 bitset 执行逻辑操作\n\n```\n 0: #include<bitset>\n 1: #include<string>\n\
