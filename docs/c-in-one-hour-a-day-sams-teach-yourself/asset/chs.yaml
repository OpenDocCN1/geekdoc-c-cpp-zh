  \n点击此处查看代码图像\n\n### 分析 ▼\n\n关于 Listing 27.4 最有趣的部分是你使用指数计数法输入了 pi 的值，这反映在输出中，并且\
  \ `cin` 将数据填充到 `double Pi` 中。注意第 15 行在一行内填充了三个变量。\n\n#### 使用 std::cin::get 输入到 char*\
  \ 缓冲区\n\n\n\n\n\n```\ncout << \"Enter a line: \" << endl;\nchar charBuf[10]; //\
  \ can contain max 10 chars\ncin >> charBuf;   // Danger: user may enter more than\
  \ 10 chars\n```\n\n点击此处查看代码图片\n\n在写入 C 风格字符串缓冲区时，不要超出缓冲区边界非常重要，以避免崩溃或产生安全漏洞。因此，读取到\
  \ C 风格 `char` 缓冲区的更好方法是这种：\n\n```cpp\ncout << \"Enter a line: \" << endl;\nchar\
  \ charBuf[10] = {0};\ncin.get(charBuf, 9);  // 在第 9 个字符处停止插入\n```\n\n点击此处查看代码图片\n\
  \n列表 27.5 展示了这种向 C 风格缓冲区中插入文本的更安全的方法。\n\n### 输入 ▼\n\n列表 27.5 向 `char` 缓冲区插入文本且不超出边界\n\
  \n```cpp\n 0: #include<iostream>\n 1: #include<string>\n 2: using namespace std;\n\
  \ 3:\n 4: int main()\n 5: {\n 6:    cout << \"Enter a line: \" << endl;\n 7:   \
  \ char charBuf[10];\n 8:    cin.get(charBuf, 10);\n 9:    cout << \"charBuf: \"\
  \ << charBuf << endl;\n10:\n11:    return 0;\n12: }\n```\n\n点击此处查看代码图片\n\n### 输出\
  \ ▼\n\n```\nEnter a line:\nTesting if I can cross the bounds of the buffer\ncharBuf:\
  \ Testing i\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n如输出所示，在这种情况下，由于在第 8 行使用了 `cin::get`，你仅将用户输入的前九字符读入\
  \ `char` 缓冲区。这是处理给定长度缓冲区最安全的方法。\n\n**提示**：如果可能，完全不要使用 `char` 数组！使用 `std::string`\
  \ 代替 `char*` 或 `char[]`。\n\n### 使用 `std::cin` 输入到 `std::string`\n\n`cin` 是一个多功能工具，你甚至可以用它直接将用户的字符串扫描到\
  \ `std::string` 中：\n\n```cpp\nstd::string input;\ncin >> input;  // 在第一个空格处停止插入\n\
  ```\n\n点击此处查看代码图片\n\n列表 27.6 展示了使用 `cin` 输入 `std::string`。\n\n### 输入 ▼\n\n列表 27.6\
  \ 使用 `cin` 向 `std::string` 输入文本\n\n```cpp\n 0: #include<iostream>\n 1: #include<string>\n\
  \ 2: using namespace std;\n 3:\n 4: int main()\n 5: {\n 6:    cout << \"Enter your\
  \ name: \";\n 7:    string name;\n 8:    cin >> name;\n 9:    cout << \"Hi \" <<\
