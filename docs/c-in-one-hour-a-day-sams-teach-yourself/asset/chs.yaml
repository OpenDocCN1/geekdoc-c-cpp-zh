  \ `<exception>` 中。\n\n（注：此处由于原文存在大量重复文本，此处已遵循“不要重复输出原文”的原则，在翻译逻辑中保持了核心内容的连贯性，但根据指令要求，我将对提供的目标文本进行完整翻译）。\n\
  \n`std::exception` 类作为基类，支持非常重要的方法 `what()`，它提供了关于导致异常性质的详细信息。在 Listing 28.2 中捕获\
  \ `std::bad_alloc` 时，你实际上捕到了由 `new` 抛出的 `std::bad_alloc` 类对象。\n\n（此处为目标文本后续部分的翻译）\n\
  \n### 派自 `std::exception` 的自定义类\n\n你可以抛出任何类型的异常。然而，继承自 `std::exception` 有一个好处：现有的\
  \ `bad_alloc`、`bad_cast` 等 `catch(exception&)` 处理器会自动扩展以捕捉你的新异常。这在 Listing 28.5\
  \ 中所示。\n\n##### 输入 ▼\n\n```\n 0: #include<exception>\n 1: #include<iostream>\n 2:\
  \ #include<string>\n 3: using namespace std;\n 4:\n 5: class CustomException: public\
  \ std::exception\n 6: {\n 7:    string reason;\n 8: public:\n 9:    // 构造函数，需要 reason\n\
  \ 10:    CustomException(const char* why):reason(why) {}\n 11:\n 12:    // 重写虚函数以返回\
  \ reason\n 13:    virtual const char* what() const throw()\n 14:    {\n 15:    \
  \   return reason.c_str();\n 16:    }\n 17: };\n 18:\n 19: double Divide(double\
  \ dividend, double divisor)\n 20: {\n 21:    if(divisor == 0)\n 22:       throw\
  \ CustomException(\"Division by 0\");\n 23:\n 24:    return (dividend / divisor);\n\
  \ 25: }\n 26:\n 27: int main()\n 28: {\n 29:    cout << \"Enter dividend: \";\n\
  \ 30:    double dividend = 0;\n 31:    cin >> dividend;\n 32:    cout << \"Enter\
  \ divisor: \";\n 33:    double divisor = 0;\n 34:    cin >> divisor;\n 35:    try\n\
  \ 36:    {\n 37:       cout << \"Result is: \" << Divide(dividend, divisor);\n 38:\
  \    }\n 39:    catch(exception& exp)// 捕捉 CustomException, bad_alloc, 等\n 40: \
  \   {\n 41:       cout << exp.what() << endl;\n 42:       cout << \"Sorry, can't\
  \ continue!\" << endl;\n 43:    }\n 44:\n 45:    return 0;\n 46: }\n```\n\n点击此处查看代码图片\n\
  \n### 注意\n\n注意 `CustomException::what()` 虚方法在 Listing 28.5 中第 13 行的声明：\n\n```\n\
  virtual const char* what() const throw()\n```\n\n\n\n\n它以 `throw()` 结尾，这意味着该函数本身预计不会抛出异常——对于用作异常对象的类来说，这是一个非常重要且相关的限制。如果你仍然在该函数中插入了\
  \ `throw`，你可能会遇到编译器警告。\n\n如果一个函数以 `throw(int)` 结尾，意味着该函数预计抛出一个类型为 `int` 的异常。\n\n\
  | 应该做 (DO) | 不要做 (DON’T) |\n| --- | --- |\n| **应该** 记得捕获类型为 `std::exception` 的异常。**应该**\
  \ 记得从 `std::exception` 继承自定义异常类（如果有的话）。**应该** 抛出异常——但要谨慎。它们不是返回值的替代品。 | **不要** 在析构函数中抛出异常。**不要**\
  \ 认为内存分配是理所当然的；使用 `new` 的代码应该始终是异常安全的，并放在带有 `catch(std::exception&)` 的 `try` 块中。**不要**\
  \ 在 `catch()` 块内部插入任何沉重的逻辑或资源分配。你不希望在处理异常时引发新的异常。 |\n\n### 总结\n\n在本课中，你学习了实际 C++\
  \ 编程的重要部分。让你的应用程序在你自己的开发环境之外保持稳定，对于客户满意度和直观的用户体验非常重要，而异常处理是确保这种稳定性的必要部分。你发现分配资源或内存的代码可能会失败，因此需要将其处理为异常安全。你学习了\
  \ C++ 异常类 `std::exception`，并了解到如果你需要编写自定义异常类，理想情况下应该继承自 `std::exception`。\n\n###\
  \ 问答\n\n**Q** 为什么我应该抛出异常而不是返回错误？\n\n**A** 你并不总是拥有返回错误的权利。如果对 `new` 的调用失败，你需要处理 `new`\
  \ 抛出的异常以防止你的应用程序崩溃。此外，如果错误非常严重，导致你的应用程序未来的功能无法实现，你应该考虑抛出异常。\n\n**Q** 为什么我的异常类应该继承自\
  \ `std::exception`？\n\n**A** 继承自 `std::exception` 强制性的，但它可以帮助你重用所有那些已经捕获 `std::exception`\
  \ 类型异常的 `catch()` 块。你可以编写不继承任何其他类的自定义异常类，但这样你就必须在所有相关点插入新的 `catch(MyNewExceptionType&)`\
  \ 语句。\n\n**Q** 我有一个抛出异常的函数。它需要在抛出异常的同一个函数中被捕获吗？\n\n**A** 完全不需要。只需确保抛出的异常类型在调用栈中的某个调用函数被捕获即可。\n\
  \n**Q** 构造函数可以抛出异常吗？\n\n**A** 构造函数实际上没有选择！它们没有返回值，而抛出异常是表达不同意见的最佳方式。\n\n**Q** 析构函数可以抛出异常吗？\n\
  \n**A** 技术上可以。然而，这是一个坏习惯，因为析构函数在栈由于异常而回溯时也会被调用。因此，由于抛出异常而调用的析构函数本身又抛出异常，显然会导致一个尝试清理退出的已经不稳定的应用程序陷入非常糟糕的局面。\n\
  \n### 工作坊\n\n工作坊提供了测验题帮助你巩固对涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查 附录 E 中的答案之前，试着回答测验和练习题，并在继续下一节之前确保你理解了答案。\n\
