  ## 宏与模板简介\n\n此时，你应该已经对基础 C++ 语法有了固定的理解。你准备好学习帮助你高效编写 C++ 程序的语言特性了。\n\n在本节，你将学习：\n\
  \n* 预处理器简介\n* `#define` 关键字和宏\n* 模板简介\n* 如何编写模板函数和类\n* 宏与模板之间的区别\n* 如何使用 `static_assert`\
  \ 进行编译时检查\n\n### 预处理器与编译器\n\n第 2 节，“C++ 程序的剖析”介绍了预处理器。正如其名，预处理器在编译器之前运行。换句话说，你使用预处理器指令来影响被编译的内容。这些指令以\
  \ `#` 符号开头。例如：\n\n```cpp\n// 指令预处理器在此处插入 iostream 内容\n#include<iostream>\n\n// 定义一个宏常量\n\
  #define ARRAY_LENGTH 25\nint numbers[ARRAY_LENGTH]; // 有 25 个整数的数组\n\n// 定义一个宏函数\n\
  #define SQUARE(x) ((x) * (x))\nconst int twentyFive = SQUARE(5);\n```\n\n点击此处查看代码图像\n\
  \n本节重点关注上述代码段中显示的两种类型的预处理器指令：一个使用 `#define` 定义常量，另一个使用 `#define` 定义宏函数。这些指令指示预处理器将宏的每一个实例（`ARRAY_LENGTH`\
  \ 或 `SQUARE`）替换为它所定义的值。\n\n### 注意事项\n宏执行的是文本替换。预处理器并不进行任何智能操作。它简单地将标识符替换为其他文本——而不验证替换的有效性。\n\
  \n### 使用宏 `#define` 定义常量\n\n你使用 `#define` 组合常量的语法非常简单：\n\n```cpp\n#define identifier\
  \ replacement-text\n```\n\n点击此处查看代码图像\n\n例如，你如下定义常量 `ARRAY_LENGTH` 替换为 `25`：\n\n\
  ```cpp\n#define ARRAY_LENGTH 25\n```\n\n现在，每当预处理器遇到文本 `ARRAY_LENGTH` 时，该标识符就会被替换为\
  \ `25`：\n\n```cpp\nint numbers[ARRAY_LENGTH];\ndouble radiuses[ARRAY_LENGTH];\n\
  std::string names[ARRAY_LENGTH];\n```\n\n点击此处查看代码图像\n\n在预处理器运行之后，上述代码对编译器可见的形式如下：\n\
  \n```cpp\nint numbers[25];      //一个包含 25 个整数的数组\ndouble radiuses[25];  //一个包含 25\
  \ 个 double 的数组\nstd::string names[25];//一个包含 25 个 std::string 的数组\n```\n\n点击此处查看代码图像\n\
  \n这种替换适用于代码的每一个部分，包括像这样的一个 `for 循环`：\n\n```cpp\nfor(int index = 0; index < ARRAY_LENGTH;\
  \ ++index)\n   numbers[index] = index;\n```\n\n点击此处查看代码图像\n\n这个 `for` 循环对编译器可见的形式为：\n\
  \n```cpp\nfor(int index = 0; index < 25; ++index)\n   numbers[index] = index;\n\
  ```\n\n点击此处查看代码图像\n\n要确看到此类宏是如何工作的，请复阅 列表 14.1。\n\n### 输入\n列表 14.1 声明和使用定义常量的宏\n\
  \n```cpp\n 0: #include<iostream>\n 1: #include<string>\n 2: using namespace std;\n\
  \ 3:\n 4: #define ARRAY_LENGTH 25\n 5: #define PI 3.1416\n 6: #define MY_DOUBLE\
  \ double\n 7: #define FAV_WHISKY \"Jack Daniels\"\n 8:\n 9: int main()\n10: {\n\
  \ 11:    int numbers [ARRAY_LENGTH] = {0};\n 12:    cout << \"Array's length: \"\
  \ << sizeof(numbers) / sizeof(int) << endl;\n 13:\n 14:    cout << \"Enter a radius:\
  \ \";\n 15:    MY_DOUBLE radius = 0;\n 16:    cin >> radius;\n 17:    cout << \"\
  Area is: \" << PI * radius * radius << endl;\n 18:\n 19:    cout << \"Favorite is:\
  \ \" << FAV_WHISKY << endl;\n 20:    return 0;\n 21: }\n```\n\n点击此处查看代码图像\n\n###\
  \ 输出\n```\nArray's length: 100\nEnter a radius: 5\nArea is: 78.5\nFavorite is: Jack\
  \ Daniels\n```\n\n### 分析\n`ARRAY_LENGTH`, `PI`, `MY_DOUBLE` 和 `FAV_WHISKY` 是宏。预处理器将它们替换为定义的值。例如，`ARRAY_LENGTH`\
  \ 被替换为 `25`，`PI` 被替换为 `3.1416`，`MY_DOUBLE` 被替换为关键字 `double`，而 `FAV_WHISKY` 被替换为字符串\
  \ `\"Jack Daniels\"`。\n\n这证明宏是简单的文本替换。预处理器不检查被替换代码的类型或有效性；它只是执行替换。这就是为什么在 C++ 中，对于常量，`const`\
  \ 和 `constexpr` 通常优于宏。\n\n\n\n\n\n点击此处查看代码图像\n\n### 注意\n\n`#ifndef` 可以读为“如果未定义”（if-not-defined）。它是一个条件处理命令，指示预处理器仅在标识符未定义时才继续执行。这种检查确保了预处理器对后续代码行只处理一次。\n\
  \n`#endif` 标记了预处理器该条件处理指令的结束。\n\n因此，当预处理器在第一次运行时进入 `header1.h` 并遇到 `#ifndef` 语句时，它注意到宏\
  \ `HEADER1_H_` 未被定义并继续执行。`#ifndef` 之后的第一行定义了宏 `HEADER1_H_`，确保了预处理器第二次运行该文件时，会在包含\
  \ `#ifndef` 的第一行处终止，因为该条件现在会被求为 `false`。`header2.h` 也是如此。这种简单的机制无疑是 C++ 编程世界中最频繁使用的基于宏的功能之一。\n\
  \n### 提示\n\nC++20 引入了 `modules`（模块）。模块提供了一种现代的方法来重用以前包含在头文件（`.H`）中的代码。模块不需要多个包含保护符，并且极大缩短了大型代码库的编译时间。它们在第\
  \ 311 节“C++20 模块与 C++23”中介绍。\n\n### 使用 #define 编写宏函数\n\n预处理器可以简单地替换由宏标识的文本元素，因此预处理器经常用于编写简单的函数，例如所示：\n\
  \n```cpp\n#define SQUARE(x) ((x) * (x))\n```\n\n这段代码确定了一个数字的平方。同样，一个计算圆面积的宏看起来如下：\n\
  \n```cpp\n#define PI 3.1416\n#define AREA_CIRCLE(r) (PI*(r)*(r))\n```\n\n点击此处查看代码图像\n\
  \n宏函数通常用于此类非常简单的计算。它们看起来像普通的函数调用，但在编译之前会进行内联展开。因此，它们在某些情况下可以帮助提高代码性能。列表 14.2 展示了这些宏函数的使用。\n\
  \n### 输入 ▼\n\n列表 14.2 使用计算数字平方、圆面积以及两个数字最大/最小值的宏函数\n\n```cpp\n 0: #include<iostream>\n\
  \ 1: #include<string>\n 2: using namespace std;\n 3:\n 4: #define SQUARE(x) ((x)\
  \ * (x))\n 5: #define PI 3.1416\n 6: #define AREA_CIRCLE(r) (PI*(r)*(r))\n 7: #define\
  \ MAX(a, b) (((a) > (b)) ? (a) : (b))\n 8: #define MIN(a, b) (((a) < (b)) ? (a)\
  \ : (b))\n 9:\n10: int main()\n11: {\n12:    cout << \"Enter an integer: \";\n13:\
  \    int num = 0;\n14:    cin >> num;\n15:\n16:    cout << \"SQUARE(\" << num <<\
  \ \") = \" << SQUARE(num) << endl;\n17:    cout << \"Area of a circle with radius\
  \ \" << num << \" is: \";\n18:    cout << AREA_CIRCLE(num) << endl;\n19:\n20:  \
  \  cout << \"Enter another integer: \";\n21:    int num2 = 0;\n22:    cin >> num2;\n\
  23:\n24:    cout << \"MIN(\" << num << \", \" << num2 << \") = \";\n25:    cout\
  \ << MIN (num, num2) << endl;\n26:\n27:    cout << \"MAX(\" << num << \", \" <<\
  \ num2 << \") = \";\n28:    cout << MAX (num, num2) << endl;\n29:\n30:    return\
  \ 0;\n31: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nEnter an integer: 36\nSQUARE(36)\
  \ = 1296\nArea of a circle with radius 36 is: 4071.51\nEnter another integer: -101\n\
  MIN(36, -101) = -101\nMAX(36, -101) = 36\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n第 4 到第\
  \ 8 行包含了几个工具宏函数，用于返回数字的平方、圆面积以及两个数字的最小和最大。注意第 6 行中的 `AREA_CIRCLE` 如何使用宏常量 `PI` 计算面积，这表明一个宏可以重用另一个宏。毕竟，这些只是给预处理器的纯文本替换命令。让我们分析第\
