  4. **4.** 写一个程序对字符串列表进行排序和反转。\n\n## 第 19 \n\n## STL `set` 和 `multiset`\n\n标准模板库\
  \ (STL) 提供了有助于频繁和快速搜索的容器类。`std::set` 和 `std::multiset` 类各包含一个有序的元素集合，并具有以对数复杂度查找元素的能力。它们的无序对应物则提供了常数时间的插入和搜索能力。\n\
  \n本节包括：\n\n* ■ 如何使用 STL `set`、`multiset`、`unordered_set` 和 `unordered_multiset`\
  \ 容器对你有帮助\n* ■ 插入、删除和搜索\n* ■ 使用这些容器的优缺点\n\n### Set 类简介\n\n`set` 和 `multiset` 是便于快速查找的容器；`set`\
  \ 和 `multiset` 的 STL 实现内部类似于二叉树。这意味着插入到 `set` 或 `multiset` 中的元素是有序的。这同时也意味着与 `vector`（可以替换位置元素）不同，`set`\
  \ 中给定位置的元素是不能替换的。这是因为 `set` 会根据值将新元素放在可能不同的位置。\n\n要使用 `std::set` 类或 `std::multiset`\
  \ 类，请包含头文件 `<set>`：\n\n```\n#include<set>\n```\n\n### STL `set` 和 `multiset` 操作\n\
  \nSTL `set` 和 `multiset` 是模板类，在使用它们的任何函数之前需要实例化。\n\n### 实例化 `std::set` 对象\n\n实例化某个类型的\
  \ `set` 或 `multiset` 需要对该类型进行模板类 `std::set` 或 `std::multiset` 的实例化：\n\n```\nstd::set<int>\
  \  setInts;\nstd::multiset<int> msetInts;\n```\n\n点击此处查看代码图像\n\n要定义包含 `Tuna` 类对象的\
  \ set 或 multiset，你需要编写以下代码：\n\n```\nstd::set<Tuna> tunaSet;\nstd::multiset<Tuna>\
  \ tunaMSet;\n```\n\n点击此处查看代码图像\n\n你可以像这样声明指向 `set` 或 `multiset` 中元素的迭代器：\n\n```\n\
  std::set<int>::const_iterator element;\nstd::multiset<int>::const_iterator element;\n\
  ```\n\n点击此处查看代码图像\n\n如果你需要一个用于修改值或调用非 const 函数的迭代器，请使用 `iterator` 代替 `const_iterator`。\n\
  \n\n\n\n你可以通过使用 `operator()` 定义一个类，该类接收集合中类型的两个值作为输入，并根据标准返回 `true`，从而创建一个二进制排序谓词。其中一个按降序排序的谓词如下：\n\
  \n```cpp\n// used as a template parameter in set / multiset instantiation\ntemplate\
  \ <typename T>\nstruct SortDescending\n{\n   bool operator()(const T& lhs, const\
  \ T& rhs) const\n   {\n      return (lhs > rhs);\n   }\n};\n```\n\n点击此处查看代码图像\n\n\
  然后按照如下方式在实例化 `set` 或 `multiset` 时提供此谓词：\n\n```cpp\n// a set and multiset of integers\
  \ (using sort predicate)\nset<int, SortDescending<int>> setInts;\nmultiset<int,\
  \ SortDescending<int>> msetInts;\n```\n\n点击此处查看代码图像\n\n除了这些变体外，你还可以创建一个从另一个 `set`\
  \ 或 `multiset` 拷贝的、或者通过提供的范围拷贝的 `set` 或 `multiset`，如 列表 19.1 所示。\n\n### 输入 ▼\n\n\
  列表 19.1 使用 `set` 和 `multiset` 的不同实例化技术\n\n```cpp\n 0: #include<set>\n 1:\n 2: //\
  \ used as a template parameter in set / multiset instantiation\n 3: template <typename\
  \ T>\n 4: struct SortDescending\n 5: {\n 6:    bool operator()(const T& lhs, const\
  \ T& rhs) const\n 7:    {\n 8:       return (lhs > rhs);\n 9:    }\n10: };\n11:\n\
  12: int main()\n13: {\n14:    using namespace std;\n15:\n16:    // a simple set\
  \ or multiset of integers (using default sort predicate)\n17:    set<int> setInts1;\n\
  18:    multiset<int> msetInts1;\n19:\n20:    // set and multiset instantiated given\
  \ a user-defined sort predicate\n21:    set<int, SortDescending<int>> setInts2;\n\
  22:    multiset<int, SortDescending<int>> msetInts2;\n23:\n24:    // creating one\
  \ set from another, or part of another container\n25:    set<int> setInts3(setInts1);\n\
  26:    multiset<int> msetInts3(setInts1.cbegin(), setInts1.cend());\n27:\n28:  \
  \  return 0;\n29: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n此代码段没有输出。\n\n### 分析 ▼\n\n\
  该程序没有输出，但演示了 `set` 和 `multiset` 的各种实例化技术，专门用于包含 `int` 类型。在第 17 行和第 18 行中，你看到了简单的形式，除了类型以外的模板参数被忽略了，导致使用了默认排序谓词，如\
  \ `struct`（或 `class`）`std::less<T>` 中的实现所示。如果你想覆盖默认排序，需要指定一个谓词，如第 3 行到第 10 行定义并在第\
  \ 21 行和第 22 行的 `main()` 中使用的那些。该谓词确保排序是降序的（因为默认是升序的）。最后，第 25 行和第 26 行显示了实例化技术：一个\
  \ `set` 是另一个的拷贝，而 `multiset` 从从 `set` 获取的值范围实例化（但也可以来自 `vector`、`list` 或任何返回通过 `cbegin()`\
  \ 和 `cend()` 边界迭代器的 STL 容器类）。\n\n### 在 `Set` 或 `Multiset` 中插入元素\n\n大多数 `set` 和 `multiset`\
  \ 函数的工作方式相似。它们接受相似的参数并返回相似的值类型。例如，你可以通过成员函数 `insert()` 在两类容器中插入元素，该函数接受要插入的值或从另一个容器获取的范围，如下：\n\
  \n```cpp\nsetInts.insert(-1);\nmsetInts.insert(setInts.begin(), setInts.end());\n\
  ```\n\n点击此处查看代码图像\n\n列表 19.2 演示了这些容器中元素的插入。\n\n### 输入 ▼\n\n列表 19.2 在 STL `set` 和\
