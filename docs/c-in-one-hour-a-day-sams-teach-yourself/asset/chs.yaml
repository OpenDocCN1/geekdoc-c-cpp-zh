  \ `true` 后，`MyBuffer` 的拷贝赋值运算符首先释放其内部缓冲区 `myNums`，然后为来自拷贝源的文本重新分配空间，最后使用 `std::copy()`\
  \ 进行复制，如第 26 行所示。输出的最后包含用户输入的数字，这些数字是通过用于存储它们的初始对象的副本生成的。\n\n### 提示\n\n`std::copy()`\
  \ 是标准模板库（STL）提供的许多有用算法之一。你需要包含 `<algorithm>` 头文件才能使用它。\n\n这些算法在第 23 “STL 算法”中进行了详细讨论。\n\
  \n### 注意事项\n\n在实现管理动态分配资源（如使用 `new` 分配的数组）的类时，务必确保除了构造函数和析构函数外，还实现了（或评估了）拷贝构造函数和拷贝赋值运算符。\n\
  \n除非在拷贝对象时处理资源所有权问题，否则你的类是不完整的，并且在使用时会危害应用程序的稳定性。\n\n### 提示\n\n要创建一个不可拷贝的类，可以将拷贝构造函数和拷贝赋值运算符声明为\
  \ `private`。声明为 `private` 而不提供实现足以让编译器在所有尝试通过按值传递给函数或将一个实例赋值给另一个实例来拷贝此类时抛出错误。\n\n\
  ### 下标运算符 (`[]`)\n\n允许对类进行数组样式（`[]`）访问的运算符被称为下标运算符。因此，创建一个如 `MyBuffer` 这样封装数组的类时，下标运算符可以方便地访问缓冲区中的字符。下标运算符的典型语法为：\n\
  \n```cpp\nint& operator [] (int index);\n```\n\n点击此处查看代码图像\n\n使用下标运算符 (`[]`) 有随机访问\
  \ `MyBuffer`。\n\n（此处省略重复的输入代码块，逻辑与上文一致）\n\n\n\n\n\n你可以通过实现下标运算符的 `const` 版本，来对列表\
  \ 12.10 中所示的版本进行改进：\n\n```\nconst int& operator[] (unsigned int index) const\n{\n\
  \   return myNums[index];\n}\n```\n\n点击此处查看代码图像\n\n此项修改是为了支持 `MyBuffer` 类的 `const`\
  \ 实例，例如下例所示：\n\n```\nconst MyBuffer constBuf(20);\ncout << constBuf[0];\n```\n\n\
  点击此处查看代码图像\n\n还有其他二元运算符（参见表 12.2）可以被重新定义或重载，但本节不再对其进行讨论。然而，它们的实现方式与已经讨论过的实现方式相似。\n\
  \n其他运算符，例如逻辑运算符和位运算符，如果认为拥有它们可以增强类的功能，则需要对它们进行编程。显然，像 `Date` 这样的日历类并不一定需要实现逻辑运算符，而执行数值函数的类可能需要它们。\n\
  \n在重载运算符或编写新运算符时，请始终考虑你的类的目标及其用途。\n\n### 函数运算符 (`()`)\n\n使对象行为得像函数一样的运算符 `()` 被称为\
  \ `function` `operator`（**函数运算符**）。此类运算符用于标准模板库（STL），特别是在 STL 算法中。它们可以用于做出决策；根据它们处理的操作数数量，此类函数对象通常被称为`一元`或`二元`谓词。列表\
  \ 12.11 展示了一个非常简单的函数对象，帮助你理解为什么这些对象会有如此迷人的名称。\n\n#### 输入 ▼\n\n列表 12.11 使用 `()` 运算符创建的函数对象\n\
  \n```\n 0: #include<iostream>\n 1: #include<string>\n 2: using namespace std;\n\
  \ 3:\n 4: class Display\n 5: {\n 6: public:\n 7:    void operator() (string input)\
  \ const\n 8:    {\n 9:       cout << input << endl;\n10:    }\n 11: };\n 12:\n 13:\
  \ int main()\n 14: {\n 15:    Display displayFuncObj;\n 16:\n 17:    // equivalent\
  \ to displayFuncObj.operator () (\"Display this string!\");\n 18:    displayFuncObj(\"\
  Display this string!\");\n 19:\n 20:    return 0;\n 21: }\n```\n\n点击此处查看代码图像\n\n\
  ### 输出\n\n```\nDisplay this string!\n```\n\n### 分析\n\n第 7 到 10 行实现了 `operator()`，它随后在第\
  \ 18 行的函数 `main()`中使用。注意，编译器允许在第 18 行将对象 `displayFuncObj` 作为函数使用，通过隐含将看似函数调用的内容转换为\
  \ `operator()` 的调用。\n\n因此，该运算符称为函数运算符 `()`，而 `Display` 对象也称为 `function object`（**函数对象**）或\
  \ `functor`（**仿函数**）。这一主题将在第 21 节“理解函数对象”中详细讨论。\n\n### 用于高性能编程的移动构造函数和移动赋值运算符\n\n\
  移动构造函数和移动赋值运算符是 C++11 标准中引入的性能优化特性。它们确保了临时值（即在语句结束后就不再存在的 `rvalues`）不会被浪费地拷贝。这在处理管理动态分配资源的类（例如动态数组类或字符串类）时特别有用。\n\
  \n#### 不必要的拷贝步骤问题\n\n看看列表 12.4 中实现的加法运算符（`+`）。注意，它实际上创建了一个副本并返回它。如果 `MyBuffer` 类如列表\
  \ 12.9 所示支持加法运算符，那么下面的代码行将是简单拼接的有效示例：\n\n```\nMyBuffer buf1(5);\nMyBuffer buf2(15);\n\
  MyBuffer buf3(buf1+buf2); // operator+, copy constructor\nMyBuffer bufSum (1);\n\
  bufSum = buf1 + buf2 + buf3; // operator+, copy constructor, copy assignment operator=\n\
  ```\n\n点击此处查看代码图像\n\n因此，有助于拼接和赋值的有用运算符导致了性能问题，因为它们需要多个内部拷贝步骤。例如，拷贝构造函数会对表达式执行后不再存在的临时值执行深拷贝。这个问题通过引入移动构造函数和移动赋值运算符得到了解决，这些运算符有助于避免多次内部资源拷贝/重新赋值步骤，从而增强了拷贝或赋值步骤的性能。\n\
  \n### 声明移动构造函数和移动赋值运算符\n\n你可以如下所示编写移动构造函数：\n\n```\nclass Sample\n{\nprivate:\n \
  \  Type* ptrResource;\n\npublic:\n   Sample(Sample&& moveSource) // 移动构造函数，注意 &&\n\
  \   {\n      ptrResource = moveSource.ptrResource; // 获取所有权，开始\n      moveSource.ptrResource\
  \ = NULL;\n   }\n\n   Sample& operator= (Sample&& moveSource)//移动赋值运算符，注意 &&\n \
  \  {\n      if(this != &moveSource)\n      {\n         delete [] ptrResource;  //\
  \ 释放资源\n         ptrResource = moveSource.ptrResource;  // 获取所有权，开始移动\n        \
  \ moveSource.ptrResource = NULL;  // 释放源的所有权\n      }\n   }\n\n   Sample(); // 默认构造函数\n\
  \   Sample(const Sample& copySource); // 拷贝构造函数\n   Sample& operator= (const Sample&\
  \ copySource); // 拷贝赋值\n};\n```\n\n点击此处查看代码图像\n\n因此，移动构造函数和赋值运算符的声明与普通拷贝构造函数和拷贝赋值运算符的区别在于输入参数的类型为\
  \ `Sample&&`。此外，由于输入参数是移动源，它不能是 `const` 参数。返回值保持不变；它们分别是构造函数和赋值运算符的重载版本。\n\n符合标准的编译器确保对于右值临时对象使用移动构造函数而不是拷贝构造函数，使用移动赋值运算符\
  \ own 拷贝赋值运算符。在实现这两个者时，你确保不是拷贝，而是将资源从源移动到目标。列表 12.12 演示了这两个新添加特性在优化 `MyBuffer` 类方面的有效性。\n\
  \n### 输入\n\n列表 12.12 除了拷贝构造函数和拷贝赋值运算符外，带有移动构造函数和移动赋值运算符的 `MyBuffer` 类\n\n\n\n\n\n\
  ```\n 0: #include<iostream>\n 1: #include<algorithm>\n 2: using namespace std;\n\
