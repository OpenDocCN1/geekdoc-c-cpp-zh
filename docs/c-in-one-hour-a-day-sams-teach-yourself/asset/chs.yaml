  \n### 分析\n\n如简短示例所示，给定一个指向基类对象的指针，程序员可以利用 `dynamic_cast` 在继续使用该指针之前，验证其所指向的目标对象的类型。请注意，在段代码段中，目标对象显而易见是一个派生类型。因此，该示例仅供演示。然而，并非并非如此——例如当将一个\
  \ `Derived*` 类型的指针传递给接受 `Base*` 类型的函数时。该函数可以使用指向基类指针的 `dynamic_cast` 来检测类型，然后执行特定于所检测类型的操作。因此，`dynamic_cast`\
  \ 有助于在运行时确定类型，并使得在安全时可以使用转换后的指针。\n\n\n\n\n\n`const_cast` 允许你关闭对象的 `const` 访问修饰符。你可能在想，为什么\
  \ C++ 起初需要这个功能。在程序员正确编写类的理想情况下，他们会记住经常地在正确的地方使用 `const` 关键字。但遗憾的是，现实世界大大不相同，像下面这样的代码随处可见：\n\
  \n```\nclass SomeClass\n{\npublic:\n    // ...\n    void DisplayMembers(); // 问题\
  \ - 显示函数不是 const\n};\n```\n\n点击此处查看代码图片\n\n因此，当你编写这样一个函数时：\n\n```\nvoid DisplayAllData\
  \ (const SomeClass& object)\n{\n    object.DisplayMembers ();  // 编译失败\n    // 原因：使用\
  \ const 引用调用非 const 成员\n}\n```\n\n点击此处查看代码图片\n\n你将 `object` 作为 `const` 引用传递是正确的。毕竟，显示函数应该是只读的，不应该允许调用非\
  \ `const` 成员函数；也就是说，它不应该允许调用可以改变对象状态的函数。然而，`SomeClass::DisplayMembers()` 应该应该是 `const`\
  \ 的，但遗憾的是它不是。现在，只要 `SomeClass` 属于你且源代码在你的控制之下，你就可以对 `DisplayMembers()` 进行修正更改。但在许多情况下，它可能属于第三方库，你无法进行更改。在这些情况下，`const_cast`\
  \ 就是你的救星。\n\n在这种场景下调用 `DisplayMembers()` 的代码如下：\n\n```\nvoid DisplayAllData (const\
  \ SomeClass& object)\n{\n    SomeClass& refData = const_cast<SomeClass&>(object);\n\
  \    refData.DisplayMembers();    // 允许！\n}\n```\n\n点击此处查看代码图片\n\n### 注意事项\n\n你只应该在万不得已使用\
  \ `const_cast` 调用非 `const` 函数。\n\n注意，`const_cast` 也可以用于指针：\n\n```\nvoid DisplayAllData\
  \ (const SomeClass* data)\n{\n    // data->DisplayMembers(); 错误：尝试调用非 const 函数！\n\
  \    SomeClass* pCastedData = const_cast<SomeClass*>(data);\n    pCastedData->DisplayMembers();\
  \    // 允许！\n}\n```\n\n点击此处查看代码图片\n\n### C++ 强制转换运算符的问题\n\n并不是所有人对 C++ 强制转换运算符感到满意——即使是那些信信\
  \ C++ 的人。他们的理由从语法繁琐且不直观，到这些操作是冗余的。例如：\n\n```\ndouble Pi = 3.14159265;\n\n// C++\
  \ 风格转换：static_cast\nint num = static_cast<int>(Pi);    // 结果：Num 为 3\n\n// C 风格转换\n\
  int num2 = (int)Pi;            // 结果：num2 为 3\n\n// 将转换交给编译器处理\nint num3 = Pi; \
  \           // 结果：num3 为 3\n```\n\n点击此处查看代码图片\n\n这三种情况都实现了相同的结果。编译器足够智能可以转换此类类型。这使得转换语法变得冗余。\n\
  \n同样，每个有效的 `static_cast` 用法都可以被 C 风格转换同样地处理：\n\n```\n// 使用 static_cast\nDerived*\
  \ objDer = static_cast <Derived*>(objBase);\n\n// 但，这样做的效果同样好...\nDerived* objSimple\
  \ = (Derived*)objBase;\n```\n\n点击此处查看代码图片 每一个有效的 `static_cast` 用法都可以被 C 风格转换同样地处理。\
  \  使得转换语法是冗余的。使得转换语法是冗余的。使得转换语法是冗余的。同样，每个有效的 `static_cast` 用法都可以被 C 风格转换同样地处理。**\
  \ 。然而，`SomeClass::DisplayMembers()`  ` `const`` 的，但遗憾的是它不是。现在，只要 `SomeClass` 属于你且源代码在你的控制之下，你就可以对\
  \ `DisplayMembers()` 进行修正更改。但在许多情况下，它可能属于第三方库，你无法进行更改。在这些情况下，`const_cast` 就是你的救星。\
  \ \n\n| 应该 | 不要 |\n| :--- | :--- |\n| 记住将 `Derived*` 转换为 `Base*` 是上转型，是安全的。 | 忘记在良好的应用程序中使用强制转换运算符。\
  \ |\n| 记住将 `Base*` 转换为 `Derived*` 是下转型，是不安全的。 | 在设计良好的程序中使用虚函数代替它们。 |\n\n### 总结\n\
  \n在本节中，你学习了 C++ 强制转换运算符，以及关于它们的正反观点。你还学习了通常情况下，你应该避免使用它们。\n\n### 问答\n\n**Q**: 使用\
  \ `const_cast` 来修改 `const` 对象的引用可以吗？\n\n**A**: 绝对不行。`reinterpret_cast` 只改变指针的解释，而不改变它所指向的对象。\n\
  \n**Q**: 我有一个 `Base*` 指针指向一个 `Derived` 对象，我真的需要使用 `dynamic_cast` 吗？\n\n**A**: 因为你确定指向的对象是\
  \ `Derived` 类型，可以通过 `static_cast` 提高运行时性能。\n\n**Q**: C++ 提供了强制转换运算符，但我被建议尽量避免它们。为什么？\n\
  \n**A**: 强制转换运算符在集成旧代码时是有用的，但在良好的现代 C++ 应用中不需要它们。\n\n### 工作坊\n\n工作坊包含测试题以巩固你对所涵盖内容的理解，并通过练习提供使用所学知识的经验。在查看附录\
