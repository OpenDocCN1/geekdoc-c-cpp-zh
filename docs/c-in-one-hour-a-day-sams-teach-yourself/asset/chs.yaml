  \n## 第 6 节\n\n## 控制程序流\n\n大多数应用程序在不同情况下和不同的用户输入会有不同的行为。为了让应用程序产生不同的响应，你需要编写条件语句，在不同情况下执行不同的代码段。\n\
  \n在本节中，你将了解到：\n\n* 如何让你的程序在某些条件下表现得不同\n* 如何在循环中重复执行一段代码\n* 如何更好地更好地控制循环中的执行流\n\n\
  ### 使用 `if...else` 进行条件执行\n\n大多数应用程序在不同情况下和不同的用户输入会有不同的行为。为了让应用程序产生不同的响应，你需要编写条件语句，在不同情况下执行不同的代码段。\n\
  \n假设你想要一个程序，在用户按下 `m` 时相乘两个数字，在输入其他任何内容时相加。这在 C++ 中通过 `if...else` 实现，如下所示：\n\n```\n\
  if (userSelection == 'm')\n   result = num1 * num2;\nelse\n   result = num1 + num2;\n\
  ```\n\n点击此处查看代码图像\n\n注意，表达式求值为 `true` 意味着表达式不为 `false`（false 为零）。因此，任何非零数字（正数或负）在用于条件语句时都会被认为求值为\
  \ `true`。\n\n让我们分析列表 6.1 中的结构，它允许用户决定相乘数字，并使用条件处理生成所需的输出。\n\n##### 列表 6.1 根据用户输入相乘或相加\n\
  \n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n 4:\
  \ {\n 5:    cout << \"Enter two integers: \" << endl;\n 6:    int num1 = 0, num2\
  \ = 0;\n 7:    cin >> num1;\n 8:    cin >> num2;\n 9:\n 10:    cout << \"Enter 'm'\
  \ to multiply, anything else to add: \";\n 11:    char userSelection = '\\0';\n\
  \ 12:    cin >> userSelection;\n 13:\n 14:    int result = 0;\n 15:    if (userSelection\
  \ == 'm')\n 16:       result = num1 * num2;\n 17:    else\n 18:       result = num1\
  \ + num2;\n 19:\n 20:    cout << \"result is: \" << result << endl;\n 21:\n 22:\
  \    return 0;\n 23: }\n```\n\n点击此处查看代码图像\n\n##### 输出 ▼\n\n第一次运行：\n\n```\nEnter\
  \ two integers:\n25\n56\nEnter 'm' to multiply, anything else to add: m\nresult\
  \ is: 1400\n```\n\n点击此处查看代码图像\n\n下次运行：\n\n```\nEnter two integers:\n25\n56\nEnter\
  \ 'm' to multiply, anything else to add: a\nresult is: 81\n```\n\n点击此处查看代码图像\n\n\
  ##### 分析 ▼\n\n\n\n\n\n注意第 15 行中的 `if` 和第 17 行中的 `else`。你正在指示编译器，当 `if` 之后的表达式 `(userSelection\
  \ == 'm')` 求值结果为 `true` 时，执行第 16 行的乘法；如果表达式结果为 `false`，则执行第 18 行的加法。`(userSelection\
  \ == 'm')` 是一个表达式，当用户输入字符 `m`（区分大小写）时，它的结果为 `true`；否则为 `false`。因此，这个简单的程序模拟了图 6.1\
  \ 中的流程图，并演示了应用程序在不同情况下如何产生不同的行为。\n\n### 注意\n`if...else` 结构的 `else` 部分是可选的，在失败发生时无须执行的操作的情况下，不需要使用。\n\
  \n### 警告\n在第 15 行中不小心加上分号：\n\n```\n15: if (userSelection == 'm');\n```\n\n这将导致 `if`\
  \ 结构毫无意义，因为它会被一个空语句（分号）终止。请务必避免这种情况，这在本质上使条件处理的尝试失效。\n\n一些优秀的编译器可能会在这种情况下警告你存在“空控制语句”。\n\
  \n字体 块内语句的条件执行\n如果你想根据一个条件的成功或失败来执行多个语句，你需要将它们封装在语句块中。这些块本质上是包含多个待执行语句的大括号 `{...}`，并作为一个块进行执行。例如：\n\
  \n```\nif (condition)\n{\n   // 条件成功块\n   Statement 1;\n   Statement 2;\n}\nelse\n\
  {\n   // 条件失败块\n   Statement 3;\n   Statement 4;\n}\n```\n\n点击此此处查看代码图片\n\n此类块也被称为复合语句。列表\
  \ 6.2 是第 4 “管理数组和字符串”中列表 4.6 的更安全版本。它使用了一个复合语句，如果用户输入的长度在数组范围内，则将用户输入复制到静态字符数组。\n\
  \n#### 输入 ▼\n列表 6.2 在复合语句中将字符串复制到 `char` 数组之前检查边界\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<string>\n 2: using namespace std;\n 3:\n4: int main()\n 5: {\n 6:\
  \    cout << \"Enter a line of text: \" << endl;\n 7:    string userInput;\n 8:\
  \    getline (cin, userInput);\n 9:\n10:    char copyInput[20] = {};\n11:    if\
  \ (userInput.length() < 20) // 检查边界\n12:    {\n13:       cout << \"Input within\
  \ bounds, creating copy\" << endl;\n14:       userInput.copy (copyInput, userInput.length());\n\
  15:       cout << \"copyInput contains: \" << copyInput << endl;\n16:    }\n17:\
  \    else\n18:       cout << \"Bounds exceeded: cannot copy!\" << endl;\n19:\n20:\
  \    return 0;\n21: }\n```\n\n点击此处查看代码图片\n\n#### 输出 ▼\n首次运行：\n\n```\nEnter a line\
  \ of text:\nInput within bounds\nInput within bounds, creating copy\ncopyInput contains:\
  \ Input within bounds\n```\n\n点击此处查看代码图片\n\n下次运行：\n\n```\nEnter a line of text:\n\
  Input is too long for the buffer\nBounds exceeded: cannot copy!\n```\n\n点击此处查看代码图片\n\
  \n#### 分析 ▼\n注意在第 11 行中，字符串长度之前之前与缓冲区长度（`20`）进行了比较。此 `if` 检查的特殊之处在于，第 12 到 16 行存在一个在结果为\
  \ `true` 时运行的语句块（也称为复合语句）。\n\n### 提示\nC++17 引入了在 `if` 语句中包含初始化。将其应用于列表 6.2 中的第 10\
  \ 行和第 11 行，你可以得到\n\n```\nif (char copyInput[20] = {}; userInput.length() < 20)\n\
  {\n   // 语句\n}\n```\n\n点击此处查看代码图片\n\n变量 `copyInput` 的作用范围现在限制在使用它的 `if` 语句中。本节稍后引入的\
  \ `switch` 结构也支持此功能。\n\n#### 嵌套 `if` 语句\n通常情况下，你需要验证许多不同的条件，其中许多条件依赖于上一个条件的求值。C++\
  \ 允许你嵌套 `if` 语句来处理此类需求。\n\n嵌套的 `if` 语句如下：\n\n```\nif (expression1)\n{\n   DoSomething1;\n\
  \   if(expression2)\n      DoSomething2;\n   else\n      DoSomethingElse;\n}\n```\n\
  \n#### 输入 ▼\n列表 6.3 数字乘法或除法的嵌套 `if` 语句\n\n```\n0: #include<iostream>\n 1: using\
  \ namespace std;\n 2:\n 3: int main()\n 4: {\n 5:    cout << \"Enter two numbers:\
  \ \" << endl;\n 6:    float num1 = 0, num2 = 0;\n 7:    char userSelection;\n 8:\
  \    cin >> num1 >> num2;\n 9:\n10:   cout << \"Enter 'd' to divide, anything else\
  \ to multiply: \";\n11:   cin >> userSelection;\n12:\n13:   if (userSelection ==\
  \ 'd')\n14:      cout << \"You wish to divide!\" << endl;\n15:      if (num2 !=\
  \ 0)\n16:          cout << num1 << \" / \" << num2 << \" = \" << num1 / num2 <<\
  \ endl;\n17:      else\n18:          cout << \"Division by zero is not allowed\"\
  \ << endl;\n19:   }\n20:   else\n21:   {\n22:       cout << \"You wish to multiply!\"\
  \ << endl;\n23:       cout << num1 << \" x \" << num2 << \" = \" << num1 * num2\
  \ << endl;\n24:   }\n25:\n26:   return 0;\n27: }\n```\n\n点击此处查看代码图片\n\n#### 输出 ▼\n\
  首次运行：\n\n```\nEnter two numbers:\n45 9\nEnter 'd' to divide, anything else to multiply:\
  \ m\nYou wish to multiply!\n45 x 9 = 405\n```\n\n下次运行：\n\n```\nEnter two numbers:\n\
  22 7\nEnter 'd' to divide, anything else to multiply: d\nYou wish to divide!\n22\
  \ / 7 = 3.14286\n```\n\n最后运行：\n\n```\nEnter two numbers:\n365 0\nEnter 'd' to divide,\
  \ anything else to multiply: d\nYou wish to divide!\nDivision by zero is not allowed\n\
  ```\n\n#### 分析 ▼\n输出是使用三组不同的输入运行程序的结果，如你所见，程序在每次运行中执行了不同的代码路径。与列表 6.1 相比，该程序有几处变化：\n\
  \n*   数字被接受为浮点变量，以便更好地处理小数，这在除法时很重要。\n*   `if` 条件与列表 6.1 不同。你不再检查用户是否按了 `m`；相反，第\
  \ 14 行包含一个表达式 `(userSelection == 'd')`，它在用户按下 `d` 时结果为 `true`。如果是，则继续。\n*   由于该程序除以两个数字，且除数是由用户输入的，因此检查除数是否为零是非常重要的。这是通过第\
  \ 17 行的嵌套 `if` 实现的。\n\n因此，这个程序演示了嵌套 `if` 结构在根据多个参数的求值执行不同任务时是很有用的。\n\n\n\n\n注意 `if...else`\
  \ 结构也可以组合在一起。Listing 6.4 是一个程序，它会询问用户是星期几，然后使用分组的 `if...else` 结构告诉用户该日期是用什么命名的。\n\
  \n### 输入 ▼\n\nListing 6.4 使用分组的 `if...else` 结构\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: int main()\n 4: {\n 5:    enum DaysOfWeek\n\
  \ 6:    {\n 7:       Sunday = 0,\n 8:       Monday,\n 9:       Tuesday,\n10:   \
  \    Wednesday,\n11:       Thursday,\n12:       Friday,\n13:       Saturday\n14:\
  \    };\n15:\n16:    cout << \"Find what days of the week are named after!\" <<\
  \ endl;\n 17:    cout << \"Enter a number for a day (Sunday = 0): \";\n18:\n19:\
  \    int dayInput = Sunday;   // Initialize to Sunday\n20:    cin >> dayInput;\n\
  21:\n22:    if (dayInput == Sunday)\n23:       cout << \"Sunday was named after\
  \ the Sun\" << endl;\n24:    else if (dayInput == Monday)\n25:       cout << \"\
  Monday was named after the Moon\" << endl;\n26:    else if (dayInput == Tuesday)\n\
  27:       cout << \"Tuesday was named after Mars\" << endl;\n28:    else if (dayInput\
  \ == Wednesday)\n29:       cout << \"Wednesday was named after Mercury\" << endl;\n\
  30:    else if (dayInput == Thursday)\n31:       cout << \"Thursday was named after\
  \ Jupiter\" << endl;\n32:    else if (dayInput == Friday)\n33:       cout << \"\
  Friday was named after Venus\" << endl;\n34:    else if (dayInput == Saturday)\n\
  35:       cout << \"Saturday was named after Saturn\" << endl;\n36:    else\n37:\
  \       cout << \"Wrong input, execute again\" << endl;\n38:\n39:    return 0;\n\
  40: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n首次运行：\n\n```\nFind what days of the week\
  \ are named after!\nEnter a number for a day (Sunday = 0): 5\nFriday was named after\
  \ Venus\n```\n\n点击此处查看代码图片\n\n下次运行：\n\n```\nFind what days of the week are named\
  \ after!\nEnter a number for a day (Sunday = 0): 9\nWrong input, execute again\n\
  ```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n注意第 22 到 37 行中使用的 `if-else-if` 结构，它用于检查用户输入并产生相应的输出。第二次运行的输出表明程序能够告诉用户她输入的数字出了预期范围\
  \ 0–6，因此不对应于任何星期几。这种结构的优点是它非常适合验证互斥的条件（例如，星期一永远不可能是星期二，且无效输入不可能是任何星期几）。该程序中另一个值得注意的点是使用了在第\
  \ 5 行定义的枚举 `DaysOfWeek` 并贯穿整个 `if` 语句。你也可以直接将用户输入与整数值（如星期日的 0）进行比较。然而，使用枚举常量 `Sunday`\
  \ 使代码更具可读性。\n\n#### 使用 `switch-case` 进行条件处理\n\n`switch-case` 结构允许你将特定表达式与一组常量对比，并可能对这些不同的值执行不同的操作。在这些结构中找到的新\
  \ C++ 关键字有 `switch`、`case`、`default` 和 `break`。\n\n以下是 `switch-case` 结构的语法：\n\n\
  ```\nswitch(expression)\n{\ncase LabelA:\n   DoSomething;\n   break;\n\ncase LabelB:\n\
  \   DoSomethingElse;\n   break;\n\n// 等此类推...\ndefault:\n   DoStuffWhenExpressionIsNotHandledAbove;\n\
  \   break;\n}\n```\n\n点击此处查看代码图片\n\n代码评估表达式，并检查其是否与随后的每个 case 标签相等。每个 case 标签都需要一个常量。然后程序执行该标签后的代码。当\
  \ `expression` 的求值不等于 `LabelA` 时，程序会检查 `LabelB`。如果该检查为 `true`，程序将执行 `DoSomethingElse`。这种检查会持续到程序遇到\
  \ `break` 为止。这是我们第一次使用 `break` 关键字。`break` 导致执行退出代码块。`break` 不是强制性的；但是，如果没有 `break`，执行将继续检查下一个标签，依此类推，而在这种情况下你希望避免避免这种情况。`default`\
  \ 也是可选的，当表达式不等于 `switch-case` 结构中的任何标签时，会执行它。\n\n提示\n\n`switch-case` 结构非常适合与枚举配合使用。`enum`\
  \ 关键字是在 ch06_images.xhtml_ppg123-1 中引入的。\n\n\n\n使用大括号 `{...}` 的 `use` 语句块来包含需要在\
  \ `case` 下执行的多个语句。\n\n## 使用 `?:` 运算符进行条件执行\n\nC++ 有一种有趣且强大的运算符，称为`条件运算符`（conditional\
  \ operator），它类似于紧凑的 `if-else` 结构。\n\n条件运算符也称为`三元运算符`（ternary operator），因为它接受三个操作数：\n\
  \n```\n(求值为 bool 的条件表达式) ? 如果为真执行表达式 1 : 为假执行表达式 2\n```\n\n点击此处查看代码图像\n\n这种运算符可以用于紧凑地计算两个给定数字中的较大值，如下：\n\
  \n```\nint max = (num1 > num2) ? num1 : num2; // max 包含 num1 和 num2 中的较大值\n```\n\
  \n点击此处查看代码图像\n\nListing 6.6 展示了使用 `?:` 运算符进行条件处理。\n\n### 输入 ▼\n\nListing 6.6 使用条件运算符\
  \ (`?:`) 寻找两个数字的最大值\n\n```cpp\n 0: #include<iostream>\n 1: using namespace std;\n\
  \ 2:\n 3: int main()\n 4: {\n 5:    cout << \"Enter two numbers\" << endl;\n 6:\
  \    int num1 = 0, num2 = 0;\n 7:    cin >> num1;\n 8:    cin >> num2;\n 9:\n10:\
  \    // 使用三元运算符 ?:\n11:    int max = (num1 > num2)? num1 : num2;\n12:\n13:    cout\
  \ << \"The greater of \" << num1 << \" and \" \\\n14:        << num2 << \" is: \"\
  \ << max << endl;\n15:  \n16:    return 0;\n17: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\
  \n```\nEnter two numbers\n365\n-1\nThe greater of 365 and -1 is: 365\n```\n\n点击此处查看代码图像\n\
  \n### 分析 ▼\n\n第 11 行包含感兴趣的语句。它是一个紧凑的语句，用于判断输入的两个数字中哪一个一个大。这行代码也可以使用 `if-else` 编写，如下：\n\
  \n```cpp\nint max;\nif (num1 > num2)\n   max = num1;\nelse\n   max = num2;\n```\n\
  \n点击此处查看代码图像\n\n你可以看到，在这种情况下，使用条件运算符节省了几行代码。然而，节省代码行不应该是首要任务。一些程序员倾向于使用条件运算符，而另一些则不然。以易于理解的方式编写条件运算符是非常重要的。\n\
  \n| 应该 (DO) | 不要 (DON’T) |\n| --- | --- |\n| **应该** 在 `switch` 表达式中使用枚举值使代码更具可读性。**应该**\
  \ 记得处理 `default`，除非这样做认为完全没有必要。**应该** 检查是否不小心忘记在每个 `case` 语句中插入 `break`。 | **不要**\
  \ 添加两个相同标签的 `case`，因为这没有意义且无法通过编译。**不要** 通过包含不带 `break` 的 `case` 并依赖顺序来使你的 `case`\
  \ 语句复杂化。这样做在你将来移动 `case` 语句而没有充分注意顺序时，会破坏功能。**不要** 在使用条件运算符 (`?:`) 时使用复杂的条件或表达式。\
  \ |\n\n**提示 (Tip)**\n\nC++17 引入了使用 `if constexpr` 的条件编译功能。这是一项高级功能，它能让编译器验证条件表达式。条件\
  \ `if constexpr...else` 语句内部不打算执行的代码部分将被编译器忽略，且不会生成到可执行文件中。这种优化在使用模板类时很有帮助。模板将在第\
  \ 14 节 “宏与模板简介”中进行更详细的介绍。\n\n## 在循环中执行代码\n\n到为止，你已经看到了当某些变量包含不同值时，如何让程序表现得不同；例如，在\
  \ Listing 6.1 中，当用户按下 `m` 时执行乘法，否则执行加法。然而，如果用户不希望程序直接结束呢？如果用户想要执行另一个加法或乘法操作——也许再执行五次？在这种情况下，你需要重复执行现有代码。\n\
  \n这就是你需要编写循环的时候。\n\n### 使用 `goto` 的初级循环\n\n正如名称所示，`goto` 指令执行从代码中特定的、带有标签的点继续。你可以使用它回溯并重新执行某些语句。\n\
  \n`goto` 语句的语法为\n\n```cpp\nSomeFunction()\n{\nStart: // 称为一个标签\n   CodeThatRepeats;\n\
  \n   goto Start;\n}\n```\n\n点击此处查看代码图像\n\n你声明了一个名为 `Start` 的标签，并使用 `goto` 从该点开始重复执行，如\
