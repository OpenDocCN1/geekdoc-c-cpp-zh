  \n### 从列表中删除元素\n\n`list` 函数 `erase()` 有两种形式：一种根据给定的迭代器删除元素，另一个接受一个范围并删除范围内的元素。你可以在\
  \ 列表 18.4 看到 `list::erase()` 函数的用法，它演示了如何删除元素元素一个范围。\n\n#### 输入 ▼\n\n列表 18.4 从列表中删除元素\n\
  \n```\n 0: #include<list>\n 1: #include<iostream>\n 2: using namespace std;\n 3:\n\
  \ 4: template <typename T>\n 5: void DisplayContents(const T& container)\n 6: {\n\
  \ 7:     for(auto element = container.cbegin();\n 8:        element != container.cend();\n\
  \ 9:          ++ element )\n10:      cout << *element << ' ';\n 11:\n 12:    cout\
  \ << endl;\n 13: }\n 14:\n 15: int main()\n 16: {\n 17:     std::list<int> linkInts{\
  \ 4, 3, 5, -1, 2017 };\n 18:\n 19:    // 存储在 insert 中获取的迭代器\n 20:    auto val2 =\
  \ linkInts.insert(linkInts.begin(), 2);\n 21:\n 22:    cout << \"Initial contents\
  \ of the list:\" << endl;\n 23:    DisplayContents(linkInts);\n 24:\n 25:    cout\
  \ << \"After erasing element '\"<< *val2 << \"':\" << endl;\n 26:    linkInts.erase(val2);\n\
  \ 27:    DisplayContents(linkInts);\n 28:\n 29:    linkInts.erase(linkInts.begin(),\
  \ linkInts.end());\n 30:    cout << \"Number of elements after erasing range: \"\
  ;\n 31:    cout << linkInts.size() << endl;\n 32:\n 33:    return 0;\n 34: }\n```\n\
  \n\n\n当使用 `insert()` 插入值时（如第 20 行所示），它会返回一个指向新插入元素的迭代器。该指向值为 `2` 的元素的迭代器被存储在变量 `val2`\
  \ 中，稍后在第 26 行的 `erase()` 调用中使用，以从列表中删除该元素。第 29 行演示了如何使用 `erase()` 删除一个元素范围。你清除了从\
  \ `begin()` 到 `end()` 的范围，这实际上等同于删除了整个列表。\n\n### 提示\n\n清空 STL 容器（如 `std::list`）最快且最简单的方法是调用成员函数\
  \ `clear()`。\n\n因此，Listing 18.4 中更简单的第 29 行可以为：\n\n```cpp\nlinkInts.clear();\n```\n\
  \n### 注意事项\n\nListing 18.4 的第 31 行演示了可以通过列表方法 `size()` 来确定 `std::list` 中的元素数量，这与\
  \ `vector` 类的相同方法非常相似。所有的 STL 容器类都支持 `size()`。\n\n#### 在列表中进行反转和排序元素\n\n`list` 有一个特殊属性：指向列表中元素的迭代器在元素发生重排或插入新元素等操作后仍然有效。为了保持这一重要属性完备，`list`\
  \ 类提供了 `sort()` 和 `reverse()` 作为成员方法，尽管 STL 提供了这些算法的算法，且这些算法确实也可以在 `list` 类上工作。这些算法的成员方法版本确保了当元素的相对位置被扰动时，指向列表中元素的迭代器不会失效。\n\
  \n#### 使用 `list::reverse()` 反转元素\n\n`list` 类具有成员函数 `reverse()`，它不接受任何参数，并能为你为你反转列表中内容的顺序：\n\
  \n```cpp\nlinkInts.reverse();  // 反转元素顺序\n```\n\n点击此处查看代码图片\n\n`reverse()` 的用法在\
  \ Listing 18.5 中得到了演示。\n\n##### 输入 ▼\n\nListing 18.5 反转列表中的元素\n\n```cpp\n 0: #include<list>\n\
  \ 1: #include<iostream>\n 2: using namespace std;\n 3:\n 4: template <typename T>\n\
  \ 5: void DisplayContents(const T& container)\n 6: {\n 7:     for(auto element =\
  \ container.cbegin();\n 8:          element != container.cend();\n 9:          ++\
  \ element )\n10:      cout << *element << ' ';\n11:\n12:    cout << endl;\n13: }\n\
  14:\n15: int main()\n16: {\n17:    std::list<int> linkInts{ 0, 1, 2, 3, 4, 5 };\n\
  18:\n19:    cout << \"Initial contents of list:\" << endl;\n20:    DisplayContents(linkInts);\n\
  21:\n22:    linkInts.reverse();\n23:\n24:    cout << \"Contents of list after using\
  \ reverse():\" << endl;\n25:    DisplayContents(linkInts);\n26:\n27:    return 0;\n\
  28: }\n```\n\n点击此处查看代码图片\n\n##### 输出 ▼\n\n```\nInitial contents of list:\n0 1 2\
  \ 3 4 5\nContents of list after using reverse():\n5 4 3 2 1 0\n```\n\n点击此处查看代码图片\n\
  \n##### 分析 ▼\n\n如第 22 行所示，`reverse()` 只是反转了列表中元素的顺序。这是一个不带参数的简单调用，确保了指向列表中元素的迭代器（如果你保留了它们）即使在反转后仍然有效。\n\
  \n#### 排序元素\n\n`list` 类成员函数 `sort()` 有一个不接受参数的版本：\n\n```cpp\nlinkInts.sort();  //\
  \ 按升序排序\n```\n\n点击此处查看代码图片\n\n另一个版本允许你通过二元谓词函数作为参数来定义你自己的排序优先级：\n\n```cpp\nbool\
  \ SortPredicate_Descending(const int& lhs, const int& rhs)\n{\n   // 定义 list::sort\
  \ 的标准：对于期望顺序返回 true\n   return(lhs > rhs);\n}\n// 使用谓词对列表排序：\nlinkInts.sort(SortPredicate_Descending);\n\
  ```\n\n点击此处查看代码图片\n\n这两种变体在 Listing 18.6 中得到了演示。\n\n##### 输入 ▼\n\nListing 18.6 使用\
  \ `list::sort()` 按升序和降序排序整数列表\n\n```cpp\n 0: #include<list>\n 1: #include<iostream>\n\
  \ 2: using namespace std;\n 3:\n 4: bool SortPredicate_Descending(const int& lhs,\
  \ const int& rhs)\n 5: {\n 6:    // 定义 list::sort 的标准：对于期望顺序返回 true\n 7:    return(lhs\
  \ > rhs);\n 8: }\n 9: template <typename T>\n 10: void DisplayContents(const T&\
  \ container)\n 11: {\n 12:    for(auto element = container.cbegin();\n 13:     \
  \     element != container.cend();\n 14:          ++ element )\n 15:      cout <<\
  \ *element << ' ';\n 16:\n 17:    cout << endl;\n 18: }\n 19:\n 20: int main()\n\
  \ 21: {\n 22:    std::list<int> linkInts{ 0, 1, 2, 3, 4, 5 };\n 23:\n 24:    cout\
  \ << \"Initial contents of list:\" << endl;\n 25:    DisplayContents(linkInts);\n\
  \ 26:\n 27:    linkInts.reverse();\n 28:\n 29:    cout << \"Contents of list after\
  \ using reverse():\" << endl;\n 30:    DisplayContents(linkInts);\n 31:\n 32:  \
  \  linkInts.sort(SortPredicate_Descending);\n 33:\n 34:    cout << \"Order after\
  \ sort() with a predicate:\" << endl;\n 35:    DisplayContents(linkInts);\n 36:\n\
  \ 37:    return 0;\n 38: }\n```\n\n点击此处查看代码图片\n\n##### 输出 ▼\n\n```\nInitial contents\
  \ of list:\n0 1 2 3 4 5\nContents of list after using reverse():\n5 4 3 2 1 0\n\
  Order after sort() with a predicate:\n2011 444 0 -1 -5\n```\n\n点击此处查看代码图片\n\n#####\
  \ 分析 ▼\n\n第 28 行演示了对整数列表使用 `sort()` 函数的用法，这是一个简单的不带参数的调用，它使用 `<` 对整数进行默认升序排序。然而，如果你想覆盖这种默认行为，就必须为\
  \ `sort()` 函数提供一个二元谓词。\n\n#### 在包含类实例的列表中进行排序和删除元素\n\n如果你有一个类类型的列表，而不是简单的内置类型如 `int`\
