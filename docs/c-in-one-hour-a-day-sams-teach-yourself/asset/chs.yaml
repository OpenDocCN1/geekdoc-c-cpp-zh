  \ \"Eight\"));\n50:    umapIntToStr.insert(make_pair(9000, \"Nine\"));\n51:    umapIntToStr.insert(make_pair(10000,\
  \ \"Ten\"));\n52:\n53:    DisplayUnorderedMap(umapIntToStr);\n54:\n55:    return\
  \ 0;\n56: }\n```\n\n点击此处查看代码图像\n\n##### 输出 ▼\n\n```\nUnordered Map contains:\n1000\
  \ : Thousand\nLoad factor: 0.125\nMax load factor = 1\nMax bucket count = 8\nUnordered\
  \ Map contains:\n1000 : Thousand\n2000 : Two\n3000 : Three\n4000 : Four\n5000 :\
  \ Five\n6000 : Six\n7000 : Seven\n8000 : Eight\n9000 : Nine\n10000 : Ten\nLoad factor:\
  \ 0.140625\nMax load factor = 1\nMax bucket count = 64\n```\n\n点击此处查看代码图像\n\n#####\
  \ 分析 ▼\n\n不同的编译器或版本的 STL 可能会产生略不同的输出。观察输出并注意 `unordered_map` 在初始桶数量为 8 且填充了 8 个对后，在插入第九个对时如何进行扩容。此时桶的数量增加到\
  \ 64。注意第 15 到 17 行中方法 `bucket_count()`、`load_factor()` 和 `max_load_factor()`。除了这些之外，注意代码的其余部分与\
  \ `std::map` 相似。一个相似之处是第 42 行使用了 `find()`，它返回一个迭代器。该迭代器需要与 `end()` 进行比较以确认操作是否成功。\n\
  \n警告\n\n不要依赖无序 map 中元素的顺序（顾名如此），无论键如何。map 中元素的顺序取决于许多因素，包括元素的键、插入顺序和桶的数量。\n\n\n\n\
  \n\n`unordered_map` 容器针对搜索性能进行了优化，当你遍历这些元素时，不应该依赖于元素的顺序。\n\n### 注意\n\n`std::unordered_map`\
  \ 提供的插入和查找（在没有冲突的情况下）几乎是常数时间完成的，无论其中包含多少个元素。然而，这并不意味着 `std::unordered_map` 优于 `std::map`，因为\
  \ `std::map` 在所有情况下都提供对数级复杂度。常数项可能大得多，导致在元素数量较少的情况下，无序映射反而变得很慢。\n\n基于模拟真实场景使用的基准测试结果来决定使用何种容器类型是非常重要的。\n\
  \n| 应该的 (DO) | 不应该的 (DON'T) |\n| --- | --- |\n| 当你需要键是唯一的键/值对时，**务必**使用 `map`。当需要键可以重复的键/值对（例如电话簿）时，**务必**使用\
  \ `multimap`。**请记住** `map` 和 `multimap` 与其他 STL 容器一样都具有成员方法 `size()`，该方法可以找到容器包含的键对数量。当常数时间的插入和查找绝对至关重要时（通常当元素数量非常大时），**务必**使用\
  \ `unordered_map` 或 `unordered_multimap`。 | **不要忘记** `multimap::count(key)` 可以确定容器中使用可用键索引的键对数量。**不要忘记**通过将结果与容器的末尾进行比较来检查\
  \ `find()` 操作的结果。 |\n\n### 总结\n\n在本节中，你学习了如何使用 STL `map` 和 `multimap` 容器、它们重要的成员函数以及它们的特性。你还学习了这些容器具有对数级复杂度，并且\
  \ STL 以 `unordered_map` 和 `unordered_multimap` 的形式提供了哈希表容器。容器的无序变体具有 `insert()`\
  \ 和 `find()` 操作，这些操作提供了独立于包含元素数量的常数时间性能。你还学习了使用谓词（predicate）自定义排序标准的重要性，这在列表 20.5\
  \ 中的目录应用程序中如所示的那样。\n\n### 问答\n\n**问** 我该如何声明一个整数 map，使其按数值降序顺序排序或存储？\n\n**答** `map<int>`\
  \ 定义了一个整数 map。它采用默认排序谓词 `std::less <T>` 按数值升序对项排序，也可以表示为 `map <int, less <int>>`。若要按数值降序排序，你需要将\
  \ map 定义为 `map <int, greater <int> >`。\n\n**问** 如果我在一个字符串 map 中插入两次字符串 `\"Jack\"\
  ` 会发生什么？\n\n**答** map 设计不用于持有非唯一值。因此，map 仍然只包含一个键为 `\"Jack\"` 的对。\n\n**问** 在上一个示例中，如果我想有两个\
  \ `\"Jack\"` 实例，我应该修改什么？\n\n**答** 根据设计，map 仅持有唯一值。你需要将选择的容器改为 `multimap`。\n\n**问**\
  \ 哪个 `multimap` 成员函数返回容器中特定值的项的计数？\n\n**答** `count(value)` 就是实现此功能的函数。\n\n**问**\
  \ 我通过 `find()` 函数在 map 中找到了一个元素，并获得了一个指向它的迭代器。我可以使用这个迭代器来更改所指向的值吗？\n\n**答** 不。某些\
  \ STL 实现可能允许用户通过 `find()` 返回的迭代器更改 map 内部元素的值。然而，这并不是正确的做法。map 中元素的迭代器应该被用作 `const`\
  \ 迭代器——即使你的 STL 实现没有强制执行这一点。\n\n**问** 我正在使用一个不支持 `auto` 关键字的旧版编译器。我该如何声明一个持有 `map::find()`\
  \ 返回值的变量？\n\n**答** 迭代器始终使用以下语法定义：\n\n```\ncontainer<Type>::iterator variableName;\n\
  ```\n\n点击此处查看代码图像\n\n**因此，整数 map 的迭代器声明如下：**\n\n```\n std::map<int>::iterator pairFound\
  \ = mapIntegers.find(1000);\n  if(pairFound != mapIntegers.end())\n  { // 执行某些操作\
  \ }\n```\n\n点击此处查看代码图像\n\n## 习习\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。尝试在检查附录\
