  \ 附录 A\n\n## 数字数字\n\n理解二进制和十六进制系统的工作原理对于编写更好的 C++ 并非关键，但它可以帮助你更好地理解底层。\n\n### 十进制系统\n\
  \n我们日常使用的数字范围是 0 到 9。这组数字被称为十进制系统。因为该系统由 10 个独特的数字组成，所以它是基数为 10 的系统。\n\n因此，由于基数为\
  \ 10，每个数字的零基位置表示了该数字乘以基 10 的幂。例如，在数字 957 中，7 的零基位置是 0，5 的位置是 1，9 的位置是 2。这些位置索引变成了基\
  \ 10 的幂，如下所示：\n\n```\n957 = 9 × 10² + 5 × 10¹ + 7 × 10⁰ = 9 × 100 + 5 × 10 + 7\n\
  ```\n\n点击此处查看代码图像\n\n记住任何数字的 0 次幂都是 1（所以 10⁰ 等于 1000⁰，因为它们的结果均为 1）。\n\n\n\n\n在十进制系统中，10\
  \ 的幂非常重要。数字中的各个数位通过乘以 10、100、1000 等来确定数字的大小。\n\n### 二进制系统\n\n基数为 2 的系统称为二进制系统。二进制系统只允许两种状态，由数字\
  \ `0` 和 `1` 表示。这些数字在 `C++` 中通常被求值为 `false` 和 `true`（`true` 为非零）。\n\n正如十进制系统中的数字被求值为基数\
  \ 10 的幂一样，二进制中的数字也被求值为其基 2 的幂：\n\n```\n101 (binary) = 1 × 22 + 0 × 21 + 1 × 20 =\
  \ 4 + 0 + 1 = 5 (decimal)\n```\n\n点击此处查看代码图像\n\n因此，二进制 `101` 的十进制等值是 `5`。\n\n###\
  \ 注意\n\n二进制数中的数位通过乘以 2 的幂——例如 4、8、16、32 等）来确定数字的大小。幂次由该数位在数字中从零开始计数的位置决定。\n\n为了更好地理解二进制系统，请查看表\
  \ A.1，该表列出了 2 的各种幂。\n\n| 幂 | 值 | 二进制表示 |\n| --- | --- | --- |\n| 0 | 2⁰ = 1 | 1\
  \ |\n| 1 | 2¹ = 2 | 10 |\n| 2 | 2² = 4 | 100 |\n| 3 | 2³ = 8 | 1000 |\n| 4 | 2⁴\
  \ = 16 | 10,000 |\n| 5 | 2⁵ = 32 | 100,000 |\n| 6 | 2⁶ = 64 | 1,000,000 |\n| 7 |\
  \ 2⁷ = 128 | 10,000,000 |\n\n**表 A.1** 2 的幂\n\n#### 为什么计算机使用二进制？\n\n二进制系统被广泛使用的时间相对短。电子学和计算机的发展加速了它的使用。电子学和电子元件的演变导致了一种系统，能够检测组件的状态为开启（ON，即处于显著的电差或电压下）或关闭（OFF，即无或低电差）。\n\
  \n这些开启和关闭状态被方便地解释为 `1` 和 `0`，完全代表二进制数字集，并使其执行算术运算的首选方法。第 5 节“处理表达式、语句和运算符”（位于表 5.2\
  \ 到 5.5）中涵盖的 NOT、AND、OR 和 XOR 等逻辑操作，通过电子门的发展得到了轻松支持，导致由于条件处理变得简单，二进制系统被全盘采用。\n\n\
  #### 什么是位（Bit）和字节（Byte）？\n\n位是计算系统中包含二进制状态的基本单位。因此，如果一个位包含状态 `1`，则称该位被“设置”(set)；如果包含状态\
  \ `0`，则被称为“重置”(reset)”。位的集合是一个字节。一个字节中的位数在理论上不是固定的，是一个取决于硬件的数字。然而，大多数计算系统假设一个字节为\
  \ 8 位——原因简单且方便：8 是 2 的幂。假设一个字节为 8 位也允许传输多达 2⁸ 个不同的值，允许 255 个不同值。这 255 个不同值足以显示或传输\
  \ ASCII 字符集中所有字符——更多。\n\n#### 多少个字节组成一个千字节？\n\n1024 字节（2¹⁰ 字节）组成一个千字节。同样，1024 千字节组成一个兆字节。1024\
  \ 兆字节组成一个吉字节。1024 吉字节组成一个太字节。\n\n### 十进制系统\n\n十六进制系统的基数为 16。十六进制系统中的数字可以是 0 到 9\
  \ 以及 A 到 F。例如，十进制的 10 等于十六进制的 A，十进制的 15 等于十六进制的 F。表 A.2 显示了十六进制数字如何转换为十进制。\n\n|\
  \ 十进制 | 十六进制 | 十进制（续） | 十六进制（续） |\n| --- | --- | --- | --- |\n| 0 | 0 | 8 | 8 |\n\
  | 1 | 1 | 9 | 9 |\n| 2 | 2 | 10 | A |\n| 3 | 3 | 11 | B |\n| 4 | 4 | 12 | C |\n\
  | 5 | 5 | 13 | D |\n| 6 | 6 | 14 | E |\n| 7 | 7 | 15 | F |\n\n**表 A.2** 十进制与十六进制等值\n\
  \n正如十进制系统中的数字被求值为基数 10 的幂，二进制中的数字被求值为其基 2 的幂一样，十六进制的数字被求值为基数 16 的幂。考虑这个例子：\n\n```\n\
  0x31F = 3 × 16² + 1 × 16¹ + F × 16⁰ = 3 × 256 + 1 × 16 + 15 = 799\n```\n\n（注：由于提供的文本后续部分存在大量重复，此处已按逻辑结构完成核心翻译。）\n\
