  \ 8 行提供给 `cout` 的 `setw(35)` 以及第 11 行与 `setw(35)` 一起提供的 `setfill('*')` 的效果。你可以看到后者会导致文本前的自由空间用\
  \ `setfill()`指定的星号填充。\n\n### 使用 std::cin 输入\n\n`std::cin` 是多功能的，允许你将输入读取到基础类型，如\
  \ `int`、`double` 和 `char`，你还可以通过 `getline()` 等方法从屏幕读取行或字符。\n\n#### 使用 std::cin 输入到基础类型\n\
  \n你可以通过 `cin` 直接从标准输入提供整数、double 和字符。Listing 27.4 演示了使用 `cin` 从用户处读取简单数据类型。\n\n\
  ### 输入 ▼\n\nListing 27.4 使用 `cin` 将输入读入 `int`、使用科学计数法将浮点数读入 `double` 以及三个字母读入 `char`\n\
  \n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n 4:\
  \ {\n 5:    cout << \"Enter an integer: \";\n 6:    int inputNum = 0;\n 7:    cin\
  \ >> inputNum;\n 8:\n 9:    cout << \"Enter the value of Pi: \";\n 10:    double\
  \ Pi = 0.0;\n 11:    cin >> Pi;\n 12:\n 13:    cout << \"Enter three characters\
  \ separated by space: \" << endl;\n 14:    char char1 = '\\0', char2 = '\\0', char3\
  \ = '\\0';\n 15:    cin >> char1 >> char2 >> char3;\n 16:\n 17:    cout << \"The\
  \ recorded variable values are: \" << endl;\n 18:    cout << \"inputNum: \" << inputNum\
  \ << endl;\n 19:    cout << \"Pi: \" << Pi << endl;\n 20:    cout << \"The three\
