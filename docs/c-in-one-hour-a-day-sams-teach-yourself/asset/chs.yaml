  \n### STL String 基于模板的实现\n\n正如你所学到的，`std::string` 类实际上是 STL 模板类 `std::basic_string<T>`\
  \ 的特化。容器类 `basic_string` 的模板声明如下：\n\n```cpp\ntemplate<class _Elem,\n    class _Traits,\n\
  \    class _Ax>\n    class basic_string\n```\n\n点击此处查看代码图片\n\n在此模板定义中，最重要的参数是第一个：`_Elem`。这是\
  \ `basic_string` 对象收集的类型。因此，`std::string` 是 `basic_string` 对于 `_Elem=char` 的特化，而\
  \ `wstring` 是 `basic_string` 对于 `_Elem=wchar_t` 的特化。\n\n换句话说，STL `string` 类定义为：\n\
  \n```cpp\ntypedef basic_string<char, char_traits<char>, allocator<char> >\n    string;\n\
  ```\n\n点击此处查看代码图片\n\n而 STL `wstring` 类定义为：\n\n```cpp\ntypedef basic_string<wchar_t,\
  \ char_traits<wchar_t>, allocator<wchar_t> >\n    string;\n```\n\n点击此处查看代码图片\n\n\
  因此，到为止研究的所有字符串特性和函数实际上由 `basic_string` 提供的，它们也适用于 STL `wstring` 类。\n\n提示\n\n当你编写需要更好地支持非拉丁字符（如日语或中文字符）的应用程序时，你会使用\
  \ `std::wstring`。\n\n### `std::string` 中的 `operator \"\"s`\n\n自 C++14 起，STL 支持了\
  \ `operator \"\"s`，它将引号内的字符串完整转换为 `std::basic_string<t>`。这使得字符串操作变得直观且简单，如列表 16.8\
  \ 所示。\n\n##### 输入 ▼\n\n列表 16.8 使用 `operator \"\"s`\n\n```cpp\n 0: #include<string>\n\
  \ 1: #include<iostream>\n 2: using namespace std;\n 3:\n 4: int main()\n 5: {\n\
  \ 6:    string str1(\"Conventional string \\0 initialization\");\n 7:    cout <<\
  \ \"Str1: \" << str1 << \" Length: \" << str1.length() << endl;\n 8:\n 9:    string\
  \ str2(\"Initialization \\0 using literals\"s);\n10:    cout << \"Str2: \" << str2\
  \ << \" Length: \" << str2.length() << endl;\n11:\n12:    return 0;\n 13: }\n```\n\
  \n点击此处查看代码图片\n\n##### 输出 ▼\n\n```\nStr1: Conventional string  Length: 20\nStr2:\
  \ Initialization  using literals Length: 31\n```\n\n点击此处查看代码图片\n\n##### 分析 ▼\n\n\
  第 6 行从普通的字符字符串字面量初始化 `std::string` 实例。注意字符串中间的空字符，这导致 `str1` 完全漏掉了 `\"initialization\"\
  ` 单词。第 9 行使用 `operator \"\"s` 演示了实例 `str2` 现在如何能够包含（因此也可以操作）包含空字符的字符缓冲区等。\n\n注意\n\
  \n不要将字面量 `operator \"\"s` 与这里的 `std::chrono` 混淆：\n\n```cpp\nstd::chrono::seconds(100)\n\
  ```\n（注：提示提供的文本在末尾有损坏/重复。我已格式化了可用的部分。）\n\n### C++17 中的 `string_view`\n\nC++17 引入的\
  \ `string_view` 类提供了字符序列的只读视图。与 `std::string` 不同，`string_view` 不拷贝字符串；它仅存储指向数据的指针和长度。这使得在无开销的情况下将字符串传递给函数非常高效。\n\
  \n```cpp\nstring s = \"Hello, World!\";\nstring_view sv = s;\ncout << sv << endl;\n\
  ```\n\n### `string_view` 的常用方法\n\n`string_view` 许多许多 `std::string` 方法的方法，如 `substr()`、`find()`、`length()`\
  \ 和 `operator[]`。但它没有提供修改底层字符串的方法。\n\n```cpp\nstring s = \"Hello, World!\";\nstring_view\
  \ sv = s;\nstring_view sub = sv.substr(0, 5); // \"Hello\"\nsize_t pos = sv.find(\"\
  World\"); // 6\nif (pos != string_view::npos) {\n    cout << \"Found World at \"\
  \ << pos << endl;\n}\n```\n\n### 性能优势\n\n`string_view` 的主要优势是避免内存分配。当你通过 `const\
  \ std::string&` 将 `std::string` 传递给函数时，如果传递的是字面量，可能会拷贝。使用 `string_view` 可以避免这种拷贝。\n\
  \n```cpp\nvoid printString(string_view sv) {\n    cout << sv << endl;\n}\n\nint\
  \ main() {\n    printString(\"This is a literal\"); // 没有创建拷贝\n    string s = \"\
  A string\";\n    printString(s); // 没有创建拷贝\n}\n```\n\n\n\n在本节中，你学习了 STL `string`\
  \ 类，它是标准模板库（STL）提供的一种容器，有助于处理许多字符串操作需求。使用该类的优势是显而易见的：由 STL 框架提供的这个容器类实现了内存管理、字符串比较和字符串处理函数，这样程序员就不需要自己实现这些了。\n\
  \n### 问答\n\nQ 我可以在 `std::string` 对象上使用基于范围的 `for` 循环吗？\n\n**A** 可以，你可以用它来一个接一个读取字符，这会让你的代码更加紧凑且易读！例如，在列表\
  \ 16.2 所示的代码中，第 24 行到 30 行`for` 循环的范围版本将：\n\n```\n for(const auto& charLocator :\
  \ stlString) // 基于范围的 for\n  {\n     cout << \"Character[\" << charOffset << <<\
  \ \"] is: \";\n     cout << charLocator << endl;\n  }\n```\n\n点击此处查看代码图像\n\nQ 我需要用\
  \ `std::reverse()` 反转字符串。为了使用这个函数，必须包含哪个头文件？\n\n**A** `<algorithm>` 是使用 `std::reverse()`\
  \ 时需要包含的头文件。\n\nQ 在使用 `tolower()` 函数将字符串转换为小写时，`std::transform()` 起了什么作用？\n\n**A**\
  \ `std::transform()` 会对 `string` 对象中位于 `transform` 函数提供的边界范围内的字符调用 `tolower()`。\n\
  \nQ 为什么 `std::string` 和 `std::wstring` 具有完全相同的行为和成员函数？\n\n**A** 它们之所以是这，是因为它们都是模板类\
  \ `std::basic_string<T>` 的模板特化版本——分别对应 `T=char` 和 `T=wchar_t`。\n\nQ STL `string`\
  \ 类的比较运算符 `<` 是区分大小写的，还是不区分大小写的？\n\n**A** 使用 `string` 类运算符 `<` 进行比较的结果是区分大小写的的。\n\
