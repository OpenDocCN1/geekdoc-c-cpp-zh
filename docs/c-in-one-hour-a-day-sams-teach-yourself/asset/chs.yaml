  \ int counter = 0; counter < bufAppend.bufLength\n```\n\n在这种情况下，定义 `+` 运算符使得使用 `MyBuffer`\
  \ 变得非常容易，因此是值得付出的：\n\n### 加法赋值 (`+=`) 和 减法赋值 (`-=`) 运算符\n\n类似于递增/递减运算符，二元加号和减号在定义后，可以允许你从一个实现了这些运算符的类对象中增加或减去受支持的数据类型的值。再次查看日历\
  \ `Date` 类。虽然你已经实现了递增 `Date` 的功能，使其让日历向前移动一天，但你仍然不支持让它（例如）向前移动五天。为了实现这一点，你需要实现二元运算符（`+`），如列表\
