  \ 21: \n 22:    ContactItem(const string& n, const string& p)\n 23:        : name(n),\
  \ phoneNum(p), displayAs(n + \": \" + p) {}\n 24:\n 25:\n 26:    bool operator<(const\
  \ ContactItem& other) const {\n 27:        return name < other.name;\n 28:    }\n\
  \ 29:\n 30:    bool operator==(const ContactItem& other) const {\n 31:        return\
  \ name == other.name && phoneNum == other.phoneNum;\n 32:    }\n 33: };\n 34: \n\
