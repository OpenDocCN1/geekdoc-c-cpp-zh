  ### 分析 ▼\n\n第 12 行使用 `count()` 来确定 `vector` 中 0 的出现次数。同样，第 15 行使用 `count_if()` 来确定\
  \ `vector` 中偶数元素的个数。它使用了在第 5 行中以 lambda 表达式实现的谓词 `IsEven`。注意第三个参数，它是于第 5 到 9 行中定义的一元谓词\
  \ `IsEven()`。`vector` 中奇数元素的个数是通过从 `size()` 返回的 `vector` 总元素数中减去 `count_if()` 的返回值计算出的。\n\
  \n#### 在集合中查找元素或范围\n\n代码列表 23.1 展示了如何在容器中查找元素。有时，你需要找到一个值范围或一个模式。在这种情况下，你应该使用 `search()`\
  \ 或 `search_n()`。`search()` 可用于检查一个范围是否包含在另一个范围内：\n\n```\nauto range = search(numsInVec.cbegin(),\
