  \ argument, and it will work just fine.\n\n### Inserting Elements in the Middle\
  \ of a List\n\n`std::list` can insert elements in the middle of the collection in\
  \ constant time. This is done using the member function `insert()`.\n\nThe `list::insert()`\
  \ member function is popularly used in the following three forms:\n\n*   **Form\
  \ 1:**\n\n    ```\n     iterator insert(const_iterator position, const T& value)\n\
  \    ```\n\n    Click here to view code image\n\n    Here the `insert` function\
  \ accepts the position of insertion as the first parameter and the value to insert\
  \ as the second. This function returns an iterator pointing to the recently inserted\
  \ element in the list.\n\n*   **Form 2:**\n\n    ```\n     void insert(const_iterator\
  \ position, size_type n, const T& value)\n    ```\n\n    Click here to view code\
  \ image\n\n    This function accepts the position of insertion as the first parameter,\
  \ the value to insert as the last parameter, and the number of elements in variable\
  \ `n`.\n\n*   **Form 3:**\n\n    ```\n     template <class InputIterator>\n    \
  \   void insert(const_iterator pos, InputIterator f, InputIterator l)\n    ```\n\
  \n    Click here to view code image\n\n    This overloaded variant is a template\
  \ function that accepts, in addition to the position, two input iterators that mark\
  \ the bounds of the collection to insert into the list. Note that the input type\
  \ `InputIterator` is a template-parameterized type and therefore can point to the\
  \ bounds of any collection—be it an array, a vector, or another list.\n\nListing\
  \ 18.3 demonstrates the use of these overloaded variants of the `list::insert()`\
  \ function.\n\n#### Input ▼\n\nListing 18.3 Various Methods of Inserting Elements\
