  \n\n\n\n\n类的声明告诉编译器关于该类及其属性的信息。仅仅声明类对程序的执行没有产生影响，因为类的使用方式与函数一样，需要被调用。\n\n一个模拟人类的类看起来如下（尽管你暂时可以忽略语法上的缺陷）：\n\
  \n```cpp\nclass Human\n{\n   // 成员属性：\n   string name;\n   string dateOfBirth;\n\
  \   string placeOfBirth;\n   string gender;\n\n   // 成员函数：\n   void Talk(string\
  \ textToTalk);\n   void IntroduceSelf();\n   ...\n};\n```\n\n点击此处查看代码图像\n\n不用说，`IntroduceSelf()`\
  \ 使用了 `Talk()` 以及封装在 `Human` 类内部的某些数据属性。因此，在 `class` 关键字中，C++ 提供了一种强大的方法来创建你自己的数据类型，使你能够`封装`\
  \ 属性以及使用这些属性的功能。类的所有属性——在此例中为 `name`、`dateOfBirth`、`placeOfBirth` 和 `gender`——以及在其中声明的所有函数——即\
  \ `Talk()` 和 `IntroduceSelf()`——都被称为类 `Human` 的成员。\n\n封装是将数据和使用该数据的功能逻辑上分组的能力，它是面向对象编程的一个重要特性。\n\
  \n### Note\n\n你可能会经常遇到 `method`（方法）这个术语。方法本质上是类的成员函数。\n\n### 作为类实例的对象\n\n类就像一个蓝图，仅仅声明类对程序的执行没有影响。在程序执行时，类的真实世界化身是一个\
  \ `object`（对象）。要使用类的特性，你通常会创建该类的实例，称为对象。你使用该对象来访问它的成员方法和属性。\n\n创建一个类型为 `class Human`\
  \ 的对象与创建另一个类型的实例（例如 `double`）类似：\n\n```cpp\ndouble pi= 3.1415; // 类型为 double 的变量\n\
  Human firstMan;    // firstMan: 一个 Human 类的对象\n```\n\n点击此处查看代码图像\n\n或者，你可以像对待另一种类型（例如\
  \ `int`）一样使用 `new` 来动态地创建 `Human` 类的实例：\n\n```cpp\nint* pointsToNum = new int; \
  \ // 动态分配的整数\ndelete pointsToNum;  // 使用完毕后释放内存\n\nHuman* firstWoman = new Human();\
  \ // 动态分配的 Human\ndelete firstWoman;  // 释放内存\n```\n\n点击此处查看代码图像\n\n### 使用点运算符 (.)\
  \ 访问成员\n\n人类的一个例子可以是 Adam——一个 1991 年出生于加利福尼亚的男性。你可以像下面所示创建一个名为 `firstMan` 的实例：\n\
  \n```cpp\nHuman firstMan; // Human 的实例，即 Human 对象\n```\n\n点击此处查看代码图像\n\n就像每一个 `Human`\
  \ 类的实例一样，`firstMan` 拥有如 `dateOfBirth` 之类的属性，可以使用点运算符（`.`)来访问：\n\n```cpp\nfirstMan.dateOfBirth\
  \ = \"1991\";\n```\n\n这是因为属性 `dateOfBirth` 属于类 `Human`；它是其蓝图的一部分，正如类声明所示。该属性只有在对象被实例化后才在现实中存在——即在运行时存在。点运算符（`.`）帮助你访问对象的属性。对于\
  \ `IntroduceSelf()` 等方法也是同样的：\n\n```cpp\nfirstMan.IntroduceSelf();\n```\n\n如果你有一个指向\
  \ `Human` 类实例的指针 `firstWoman`，可以使用指针运算符（`->`）来访问成员（如节所示），或者使用间接运算符（`*`）引用点运算符后的对象：\n\
  \n```cpp\nHuman* firstWoman = new Human();\nfirstWoman->IntroduceSelf(); // 等同于\
  \ (*firstWoman).IntroduceSelf();\n```\n\n点击此处查看代码图像\n\n### Note\n\n命名规范仍然适用。类名和成员函数使用帕斯卡命名法（Pascal\
  \ case）声明（例如 `IntroduceSelf()`）。类成员属性使用驼峰命名法（camel case）（例如 `dateOfBirth`）。\n\n\
  当你实例化一个类的对象时，你声明了一个类型为该类的变量。因此你使用了驼峰命名法，这也是你到为止一直用于变量名的命名（例如 `firstMan`）。\n\n###\
  \ 使用指针运算符 (->) 访问成员\n\n如果对象是使用 `new` 在自由存储上实例化的，或者你有一个指向对象的指针，那么你就使用指针运算符（`->`）来访问成员属性和函数：\n\
  \n```cpp\nHuman* firstWoman = new Human();\nfirstWoman->dateBirth = \"1993\";\n\
  firstWoman->IntroduceSelf();\ndelete firstWoman;\n```\n\n点击此处查看代码图像\n\nListing 9.1\
  \ 展示了一个可编译形式的类 `Human`，包含一个新关键字 `public`。\n\n#### Input ▼\n\nListing 9.1 一个可编译的类\
  \ `Human`\n\n```cpp\n 0: #include<iostream>\n1: #include<string>\n2: using namespace\
  \ std;\n3: \n4: class Human\n5: {\n6: public:\n7:     string name;\n8:     int age;\n\
  9: \n10:    void IntroduceSelf()\n11:    {\n12:        cout << \"I am \" << name\
  \ << \" and \";\n13:        cout << age << \" years old\" << endl;\n14:    }\n15:\
  \ };\n16: \n17: int main()\n18: {\n19:    // Human 的实例，即 Human 对象\n20:    Human\
  \ firstMan;\n21:    firstMan.name = \"Adam\";\n22:    firstMan.age = 30;\n23: \n\
  24:    // 一个 Human 类的对象\n25:    Human firstWoman;\n26:    firstWoman.name = \"Eve\"\
  ;\n27:    firstWoman.age = 28;\n28: \n29:    firstMan.IntroduceSelf();\n30:    firstWoman.IntroduceSelf();\n\
  31: }\n```\n\n点击此处查看代码图像\n\n#### Output ▼\n\n```\nI am Adam and 30 years old\nI\
  \ am Eve and 28 years old\n```\n\n点击此处查看代码图像\n\n#### Analysis ▼\n\n第 4 行到第 15 行展示了类\
  \ `Human` 的基本结构。注意类 `Human` 的结构以及它在 `main()` 中的用法。\n\n该类包含两个成员变量：第 7 行的 `string`\
  \ 类型 `name` 和第 8 行的 `int` 类型 `age`。它还包含了第 10-14 行的函数（也称为方法）`IntroduceSelf()`。`main()`\
  \ 中的第 20 行和第 25 行分别实例化了 `firstMan` 和 `firstWoman`。注意第 29 行和第 30 行调用同一个函数创建了两个不同的输出行。\n\
  \n### `public` 和 `private` 关键字\n\n信息可以至少分为两类：你不介意公众知道的数据和私有数据。性别是一个人们可能不介意分享的信息。然而，收入可能是一个隐私问题。\n\
  \nC++ 允许你将类属性和方法建模为 `public` 或 `private`。公共类成员可以被任何拥有该类对象的用户使用。私有类成员只能在类内部（或其“友元”）中使用。关键字\
  \ `public` 和 `private` 帮助你作为类设计者决定类的哪些部分可以从外部调用（例如从 `main()` 调用），哪些部分不能。\n\n当你将属性或方法标记为\
  \ `private` 时，这对你作为程序员带来了哪些优势？请特别考虑 `Human` 类的声明以及成员属性 `age`。\n\n\n\n\n\n```cpp\n\
  class Human\n{\nprivate:\n   // 私有成员数据：\n   int age;\n   string name;\n\npublic:\n\
  \   int GetAge()\n   {\n      return age;\n   }\n\n   void SetAge(int humansAge)\n\
  \   {\n      age = humansAge;\n   }\n\n// ...其他成员和声明\n};\n```\n\n点击此处查看代码图像\n\n\
  假设有一个名为 `eve` 的 `Human` 实例：\n\n```\nHuman eve;\n```\n\n当该实例的用户尝试访问成员 `age` 时：\n\n\
  ```\ncout << eve.age; // 编译错误\n```\n\n该用户会得到一个类似于“错误：`Human::age`——无法访问类 `Human`\
  \ 中声明的私有成员”的编译错误。获取 `age` 的唯一允许方法是通过类 `Human` 提供的公共方法 `GetAge()` 来请求，而该方法的实现方式是类程序员认为的共享\
  \ `age` 的合适方式：\n\n```\ncout << eve.GetAge(); // 正确\n```\n\n`GetAge()` 为类 `Human`\
  \ 的程序员提供了了解 `age` 何时被查询并以合适方式对其进行共享的机会。换句话说，C++ 允许类来控制它想要暴露的属性以及它如何暴露这些属性。如果类 `Human`\
  \ 没有实现 `GetAge()` 公共成员方法，该类将实际上确保用户完全无法查询 `age`。这一特性在在本节稍后解释的情况中可能会非常有用。\n\n注意，`Human::age`\
  \ 也无法直接赋值：\n\n```\neve.age = 22; // 编译错误\n```\n\n设置年龄的唯一允许方法是通过方法 `SetAge()`：\n\n\
  ```\neve.SetAge(22); // 正确\n```\n\n这有许多优势。`SetAge()` 的当前实现只是直接设置了成员变量 `Human::age`。然而，你可以使用\
  \ `SetAge()` 来验证设置的 `age` 是否非零且不为负数，从而验证外部输入：\n\n```cpp\nclass Human\n{\nprivate:\n\
  \   int age;\n\npublic:\n   void SetAge(int humansAge)\n   {\n      if (humansAge\
  \ > 0)\n          age = humansAge;\n   }\n};\n```\n\n点击此处查看代码图像\n\n因此，C++ 允许类的设计者控制类的数据属性如何被访问和操纵。\n\
  \n### 通过关键字 `private` 实现数据抽象\n\nC++ 允许你通过 `private` 关键字来决定哪些信息对外部世界是不可访问的（即在类外部不可用）。同时，它允许你通过你声明为\
  \ `public` 的方法来控制即使声明为 `private` 的信息的访问。因此，你对类的实现可以抽象该类外部类和函数不需要访问的成员信息。\n\n回到关于\
  \ `Human::age` 是私有成员的示例，你知道即使在现实中，许多人也不喜欢透露自己的真实年龄。如果要求 `Human` 类报告一个比当前年龄小两岁的年龄，它可以通过公共函数\
  \ `GetAge()` 轻松地实现这一点，该函数使用 `Human::age` 参数，将其减二，并提供结果，如列表 9.2 所示。\n\n#### 输入 ▼\n\
  \n列表 9.2 `Human` 类模型，其中真实的 `age` 对用户抽象，并报告一个较年轻的 `age`\n\n```cpp\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: class Human\n 4: {\n 5: private:\n 6:    //\
  \ 私有成员数据：\n 7:    int age;\n 8:\n 9: public:\n10:    void SetAge(int inputAge)\n\
  \ 11:    {\n 12:       age = inputAge;\n 13:    }\n 14:\n 15:    // Human 关于他的年龄撒谎（如果超过\
  \ 30 岁）\n 16:    int GetAge()\n 17:    {\n 18:       if (age > 30)\n 19:       \
  \   return (age - 2);\n 20:       else\n 21:          return age;\n 22:    }\n 23:\
