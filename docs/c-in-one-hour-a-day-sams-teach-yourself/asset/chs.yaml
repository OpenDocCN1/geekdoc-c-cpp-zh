  ```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n第 11 行包含感兴趣的语句。它是一个紧凑的语句，用于判断输入的两个数字中哪一个一个大。这行代码也可以使用\
  \ `if-else` 编写，如下：\n\n```cpp\nint max;\nif (num1 > num2)\n   max = num1;\nelse\n\
  \   max = num2;\n```\n\n点击此处查看代码图像\n\n你可以看到，在这种情况下，使用条件运算符节省了数行代码。然而，节省代码行不应该是首要任务。一些程序员倾向于使用条件运算符，而另一些则不然。以易于理解的方式编写条件运算符是非常重要的。\n\
