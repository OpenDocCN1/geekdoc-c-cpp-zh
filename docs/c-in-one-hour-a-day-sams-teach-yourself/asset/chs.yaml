  \ }\n};\n```\n\n### 构造顺序\n\n当你创建一个派自 `Fish` 类的 `Tuna` 对象时，`Tuna` 的构造函数是在 `Fish`\
  \ 类的构造函数之前还是之后调用的？此外，在类的实例化过程中，`Fish::isFreshWater` 等属性的实例化顺序是怎样的？幸运的是，实例化顺序是标准的。基类对象先实例化。因此，`Tuna`\
  \ 的 `Fish` 部分首先构造，这样在实例化 `Tuna` 类时，`Fish` 中的属性（尤其是保护和公有属性）已经就绪。在 `Fish` 和 `Tuna`\
  \ 类的实例化过程中，属性（如 `Fish::isFreshWater`）在构造函数 `Fish()` 之前之前实例化，确保构造函数可以使用它们。这也适用于 `Tuna::Tuna()`。\n\
