  \n\n\n\n![](img/MSFT_logo_1C.jpg)\n\n\n\n\n\n`ScoutAutomatedPrintCode`\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 导言\n\n### 问答\n### 工作坊\n### 测验\n### 练习\n\
  \n\n点击此处查看代码图片\n\n## 访问数组中存储的数据\n\n可以使用从零开始的索引访问数组中的元素。这些索引被称为`零基索引`索引，因为数组中的第一个元素位于索引\
  \ 0。因此，存储在数组 `myNumbers` 中的第一个整数值是 `myNumbers[0]`，第二个是 `myNumbers[1]`，依此类推。第五个是\
  \ `myNumbers[4]`。换句话说，数组最后一个元素的索引始终是（数组长度 – 1）。\n\n当要求访问索引为 `N` 的元素时，编译器使用第一个元素（位于索引\
  \ 0）的内存地址作为起始点，然后通过添加计算出的 `N*sizeof(element)` 偏移量来跳过 `N` 个元素，从而到达包含第 (N + 1) 个元素的地址。C++\
  \ 编译器不会检查索引是否在数组定义的边界内。你可以尝试在一个仅有 10 个元素的数组中获取索引为 1001 的元素，但这样做会使你的程序的安全性和稳定性面临风险。确保数组不越界访问的责任完全在于程序员。\n\
  \n### 注意事项\n\n访问超出数组边界的数组会导致不可预测的行为。在许多情况下，这会导致程序崩溃。应尽一切避免访问超出边界的数组。\n\n列表 4.1 展示了如何声明一个整数数组，将其元素初始化为整数值，并访问它们将它们显示在屏幕上。\n\
  \n#### 输入 ▼\n\n列表 4.1 声明整数数组并访问其元素\n\n```\n0: #include<iostream>\n1: using namespace\
  \ std;\n2: \n3: int main()\n4: {\n5:    int myNumbers[] = {34, 56, -21, 5002, 365};\n\
  6: \n7:    cout << \"First element at index 0: \" << myNumbers[0] << endl;\n8: \
  \   cout << \"Second element at index 1: \" << myNumbers[1] << endl;\n9:    cout\
  \ << \"Third element at index 2: \" << myNumbers[2] << endl;\n10:   cout << \"Fourth\
  \ element at index 3: \" << myNumbers[3] << endl;\n11:   cout << \"Fifth element\
  \ at index 4: \" << myNumbers[4] << endl;\n12: \n13:   return 0;\n14: }\n```\n\n\
  点击此处查看代码图片\n\n#### 输出 ▼\n\n```\nFirst element at index 0: 34\nSecond element at\
  \ index 1: 56\nThird element at index 2: -21\nFourth element at index 3: 5002\n\
  Fifth element at index 4: 365\n```\n\n点击此处查看代码图片\n\n#### 分析 ▼\n\n第 5 行声明了一个整数数组，将其元素初始化为整数值。随后的行使用\
  \ `cout` 和数组 `myNumbers` 显示这些索引。为了让你熟悉用于访问的零基索引概念，我们从列表 4.1](#ch04.xhtml_ch4lev3sec1\
  \ 的第 0 行开始。\n\n### 修改数组中存储的数据\n\n在列表 4.1 中，你没有向数组输入用户定义的数据。给元素赋值的语法与给整数赋值的语法非常相似。例如，你将\
  \ `2016` 赋值给整数：\n\n```\nint thisYear;\nthisYear = 2016;\n```\n\n给第四个元素赋值 `2016`\
  \ 看起来如下：\n\n```\nmyNumbers[3] = 2016;\n```\n\n列表 4.2 展示了声明数组长度时使用常量，并展示了程序执行期间如何为数组元素赋值。\n\
  \n#### 输入 ▼\n\n列表 4.2 给元素赋值\n\n```\n0: #include<iostream>\n1: using namespace std;\n\
  2: \n3: constexpr Square(int number) { return number*number; }\n4: \n5: int main()\n\
  6: {\n7:    const int ARRAY_LENGTH = 5;\n8: \n9:    // Array of 5 integers, initialized\
  \ to 5 values\n10:   int myNumbers[ARRAY_LENGTH] = {5, 10, 0, -101, 20};\n11: \n\
  12:   // Using a constexpr for array of 5*5=25 integers\n13:   int moreNumbers[Square(ARRAY_LENGTH)];\n\
  14: \n15:   cout << \"Enter index of the element to be changed: \";\n16:   int elementIndex\
  \ = 0;\n17:   cin >> elementIndex;\n18: \n19:   cout << \"Enter new value: \";\n\
  20:   int newValue = 0;\n21:   cin >> newValue;\n22: \n23:   myNumbers[elementIndex]\
  \ = newValue;\n24:   moreNumbers[elementIndex] = newValue;\n25: \n26:   cout <<\
  \ \"Element \" << elementIndex << \" in array myNumbers is: \";\n27:   cout << myNumbers[elementIndex]\
  \ << endl;\n28: \n29:   cout << \"Element \" << elementIndex << \" in array moreNumbers\
  \ is: \";\n30:   cout << moreNumbers[elementIndex] << endl;\n31: \n32:   return\
  \ 0;\n33: }\n```\n\n\n\n\n\n##### 输出 ▼\n\n```\nEnter index of the element to be\
  \ changed: 3\nEnter new value: 101\nElement 3 in array myNumbers is: 101\nElement\
  \ 3 in array moreNumbers is: 101\n```\n\n点击此处查看代码图像\n\n##### 分析 ▼\n\n数组的长度必须是一个常量整数。因此，该长度也可以通过第\
  \ 9 行使用的常量 `ARRAY_LENGTH`，或者第 12 行使用的常量表达式 `Square()` 来指定。因此，数组 `myNumbers` 被声明为\
  \ 5 个元素的长度 length，而数组 `moreNumbers` 被声明为 25 个。第 14–20 行要求用户输入要修改的数组元素索引以及存储在该索引处的新值。第\
  \ 22 和第 23 行演示了如何在给定索引的情况下修改数组中的特定元素。第 26–29 行演示了如何在给定索引的情况下访问数组元素。注意，修改索引为 3 的元素实际上修改的是数组中的第四个元素，因为索引是从\
  \ 0 开始的。你必须习惯这一点。\n\n### 注意\n\n许多初学者 C++ 程序员会在包含五个整数的数组中为索引 5 分配第五个值。这超出了数组的边界，因为编译后的代码尝试访问数组中的第六个元素，而这超出了数组定义的范围。\n\
  \n这种错误被称为“篱笆错误”（fence-post error）。之所以这样命名，是因为建造围栏所需的柱子数量比围栏间隔的数量总是多一个。\n\n### 警告\n\
  \n列表 4.2 中缺少了一些基础性的内容：它没有检查用户输入的索引是否在数组范围内。程序实际上应该验证 `elementIndex` 对于数组 `myNumbers`\
  \ 是否在 0 到 4 之间，对于数组 `moreNumbers` 是否在 0 到 24 之间，并拒绝所有其他输入。这种缺失的检查允许用户可能会分配并访问超出数组边界的值。此类输入可能会导致应用程序——在最坏的情况下导致系统——崩溃。\n\
  \n执行此类检查将在第 6 “控制程序流”中进行解释。\n\n### 使用循环访问数组元素\n\n当按顺序处理数组及其元素时，您应该使用循环来访问（换句话说，迭代）它们。请参见第\
  \ 6 ，特别是列表 6.10，快速学习如何使用 `for` 循环高效插入或访问数组中的元素。\n\n| 应该 | 不要 |\n| --- | --- |\n\
  | **应该** 记住数组中的第一个元素是通过索引 0 访问的。**应该** 始终确保您的数组在定义的边界内使用。 | **不要** 在包含 N 个元素的数组中使用索引\
  \ N 访问第 N 个元素元素。请使用索引 (N – 1)。 |\n\n#### 多维数组\n\n我们目前为止看到的数组类似于书架上的书。长书架可以放更多的书，短书架放的较少。书架的长度是定义书架容量的唯一维度，因此它是一维的。现在，如果我们使用数组来模拟太阳能板数组，如图\
  \ 4.3\n\n**图 4.3** 屋顶上的太阳能板数组。\n\n正如你在图 4.3 中所示，六块太阳能板被放置在一个由两行三列组成的二维布局中。从一个角度来看，你可以将这种布局视为包含两个元素的数组，每个元素本身又是一个包含三个面板的数组——换句话说，是数组的数组。你可以使用\
  \ C++ 来建模二维数组，但不仅限于二维维度。根据你的需求和应用程序的性质，你也可以在内存中建模多维数组。\n\n### 声明和初始化多维数组\n\nC++\
  \ 允许通过指定在每个维度上想要保留元素数量来声明多维数组。因此，表示图 4.3 中太阳能板的整数二维数组如下：\n\n```cpp\nint solarPanels[2][3];\n\
  ```\n\n注意在图 4.3 中，太阳能板数组中的六块面板每个都被分配了一个从 0 到 5 的 ID。如果你以相同的顺序初始化该整数数组，它看起来如下：\n\n\
  ```cpp\nint solarPanels[2][3] = {{0, 1, 2}, {3, 4, 5}};\n```\n\n点击此处查看代码图像\n\n如你所见，使用的初始化语法与初始化两个一维数组的方法相似。一个包含三行三列的数组看起来如下：\n\
  \n```cpp\nint threeRowsThreeColumns[3][3] = {{-501, 206, 2016}, {989, 101, 206}};\n\
  ```\n\n\n\n\n\n注意你是如何按行访问数组元素的，从`Row 0`（第一行，索引为 `0`）的数组开始，到为`Row 2`（第三行，索引为 `2`）的数组结束。由于每一行都是一个数组，因此访问第一行中第三个元素（行索引为\
  \ `0`，元素索引为 `2`）的代码位于`Line 10`。\n\n### 注意\n在显示列表 4.3 中，代码长度随着数组元素数量或维度的增加而剧增。这种代码在专业开发环境中实际上是不可持续的。\n\
  \n你可以在第 6 Lesson 的显示列表 6.14 中看到一种更高效的访问多维数组元素的编程方法，在其中你将使用嵌套的 `for` 循环来访问此类数组中的所有元素。\n\
  \n### 动态数组\n\n考虑一个存储医院医疗记录的应用程序。程序员没有好的方法知道该应用程序可能需要处理的记录数量上限。她可以做一个比小型医院合理限制要得多的假设以防万一。在这种情况下，程序员将无缘地预留大量内存并降低系统性能。\n\
  \n关键在于不要使用我们目前为止看到的静态数组，而是要选择动态数组，根据执行时对资源和内存的需求来优化内存消耗并进行扩展。C++ 以后 `std::vector`\
  \ 的形式为你提供了方便且易于使用的动态数组，如显示列表 4.4 所示。\n\n#### 输入 ▼\n\n显示列表 4.4 创建动态整数数组并动态插入值\n\n\
  ```\n 0: #include<iostream>\n 1: #include<vector>\n 2:\n 3: using namespace std;\n\
  \ 4:\n 5: int main()\n 6: {\n 7:    vector<int> dynArray(3); // int 型动态数组\n 8:\n\
  \ 9:    dynArray[0] = 365;\n10:    dynArray[1] = -421;\n11:    dynArray[2] = 789;\n\
  12:\n 13:    cout << \"Number of integers in array: \" << dynArray.size() << endl;\n\
  \ 14:\n 15:    cout << \"Enter another element to insert\" << endl;\n 16:    int\
  \ newValue = 0;\n 17:    cin >> newValue;\n 18:    dynArray.push_back(newValue);\n\
  \ 19:\n 20:    cout << \"Number of integers in array: \" << dynArray.size() << endl;\n\
  \ 21:    cout << \"Last element in array: \";\n 22:    cout << dynArray[dynArray.size()\
  \ - 1] << endl;\n 23:    return 0;\n 24:\n 25: }\n```\n\n点击此处查看代码图片\n\n#### 输出 ▼\n\
  \n```\nNumber of integers in array: 3\nEnter another element to insert\n2017\nNumber\
  \ of integers in array: 4\nLast element in array: 2017\n```\n\n点击此处查看代码图片\n\n####\
  \ 分析 ▼\n\n不要担心显示列表 4.4 中的语法，因为 `vector` 和模板尚未进行解释。只需观察输出并尝试将其与代码联系起来。根据输出，数组的初始大小为\
  \ 3，这与`Line 7`中数组声明（`std::vector`）一致。在这一点上，你仍然在`Line 15`要求用户输入第四个数字，有趣的是，你能够通过`Line\
  \ 18`中的 `push_back()` 将该数字插入到数组末尾。`vector` 动态地调整自身大小以容纳更多数据。这可以在数组的大小中看到，它增加到了 4。注意使用熟悉的静态数组语法来访问\
  \ vector 中的数据。`Line 22` 使用从 0 开始的索引访问最后一个元素（根据运行时计算的位置，无论它在何处），最后一个元素的索引为 `size()\
  \ – 1`，其中 `size()` 是返回 `vector` 中包含的元素（整数）总数的函数。\n\n### 注意\n要使用动态数组类 `std::vector`，你需要包含头文件\
  \ `<vector>`，如显示列表 4.4 中的`Line 1` 所示。\n\nVectors 在第 17 Lesson 中有更详细的解释。\n\n### C\
  \ 风格字符串\n\nC 风格字符串是字符数组的一种特例。你已经在代码中写过一些以字符串字面量形式存在的 C 风格字符串示例：\n\n```\nstd::cout\
  \ << \"Hello World\";\n```\n\n这等同于使用数组声明\n\n```\nchar sayHello[] = {'H','e','l','l','o','\
  \ ','W','o','r','l','d'};\n```\n\n注意 C 风格字符串的最后一个字符是一个空字符 `\\0`，它告诉编译器字符串已经结束。\n\
  \n```\nstd::cout << \"Hello World\";\n```等同于使用数组声明\n\n```\nchar sayHello[] = {'H','e','l','l','o','\
  \ ','W','o','r','l','d'};\n```\n\n当你嵌入一个字符串字面量时，编译器会自动在末尾添加一个空字符 `\\0`。\n\n如果你在字符串中间插入\
  \ `\\0`，它不会改变数组的大小，但会导致字符串处理在该处停止。这在显示列表 4.5 中展示了这一点。\n\n### 注意\n如果在显示列表 4.5 的`Line\
  \ 5`中声明和初始化字符数组时忘记添加`'\\0'`，那么预计输出在打印“Hello World”之后将包含乱码字符。这是因为 `std::cout` 在遇到空字符之前不会停止打印数组，即使这意味着超出了数组边界。\n\
  \n这种错误可能会导致你的程序崩溃，在某些情况下，会损害系统的稳定性。\n\nC 风格字符串充满了危险。显示列表 4.6 展示了使用此类字符串涉及的风险。\n\n\
  #### 输入 ▼\n\n显示列表 4.5 分析 C 风格字符串中的空终止符\n\n```\n 0: #include<iostream>\n 1: #include<string.h>\n\
  \ 2: using namespace std;\n 3: int main()\n 4: {\n 5:    cout << \"Enter a word\
  \ NOT longer than 20 characters:\" << endl;\n 6:\n 7:    char userInput [21];\n\
  \ 8:    cin >> userInput;\n 9:\n 10:    cout << \"Length of your input was: \" <<\
  \ strlen(userInput) << endl;\n 11:\n 12:    return 0;\n 13: }\n```\n\n\n\n\n\n```\n\
  输入一个长度不超过 20 个字符的单词：\nDon'tUseThisProgram\n输入长度为: 19\n```\n\n点击此处查看代码图像\n\n####\
  \ 分析 ▼\n\n危险在输出中是显而易见的。程序正在请求用户不要输入超过 20 个字符的数据。之所以这样做是因为第 7 行声明的用于存储用户输入的字符缓冲区具有固定的（静态）长度，即\
  \ 21 个字符。由于字符串的最后一个字符必须是空终止符（`'\\0'`），因此缓冲区存储文本的最大长度为 20 个字符。然而，`cin` 不验证所使用的字符数组\
  \ `userInput` 的长度，因此如果用户输入的单词达到 21 个字符或更多，它将超出边界。\n\n**提示**\n\n越数组边界的错误 被称为 `缓冲区溢出`（buffer\
  \ overflow）。除了会破坏你应用程序的稳定性外，缓冲区溢出被认为是一个使你的 C++ 应用程序不安全的漏洞。\n\n**注意** 注意第 10 行中使用\
  \ `strlen()` 来计算字符串的长度。`strlen()` 会遍历字符数组并计算跨过的字符数量，直到遇到指示字符串结束的空终止符。这个空终止符是由 `cin`\
  \ 在用户输入的末尾插入的。`strlen` 的这种行为使得它是危险的，因为如果用户提供的文本超过了上述限制，它很容易越过字符数组的边界。解决此问题的方法之一是实现检查，确保字符缓冲区的限制不被越越列表\
  \ 6.2](#ch06.xhtml_ch6lev3sec4) 在 第 6 节 中实现了此类检查。\n\n**警告**\n\n用 C 编写的程序（或具有深厚 C\
  \ 背景的程序员用 C++ 编写）通常使用 `strcpy()` 等字符串拷贝函数、`strcat()` 等拼接函数以及 `strlen()` 来确定字符串长度，以及其他此类函数。这些函数以\
  \ C 风格字符串作为输入，是危险的，因为它们寻找空终止符，如果程序员没有确保终止空字符的存在，它们可能会超出正在使用的字符数组的边界。\n\n然而，首选的方法是避免使用字符数组进行字符串操作。相反，使用\
  \ C++ 标准库类 `std::string`。\n\n### C++ 字符串：使用 `std::string`\n\nC++ 标准字符串是处理文本输入以及执行拼接等字符串操作的一种高效且更安全的方法。`std::string`\
  \ 的大小不像 C 风格字符串的 `char` 数组实现那样是静态的，当需要存储更多数据时它可以扩展。列表 4.7 显示了如何使用 `std::string`\
  \ 处理字符串数据。\n\n#### 输入 ▼\n\n列表 4.7 使用 `std::string` 初始化、存储用户输入、拷贝、拼接和确定字符串长度\n\n\
  ```\n 0: #include<iostream>\n 1: #include<string>\n 2:\n 3: using namespace std;\n\
  \ 4:\n 5: int main()\n 6: {\n 7:    string greetString (\"Hello std::string!\");\n\
  \ 8:    cout << greetString << endl;\n 9:\n10:    cout << \"Enter a line of text:\
  \ \" << endl;\n11:    string firstLine;\n 12:    getline(cin, firstLine);\n 13:\n\
  \ 14:    cout << \"Enter another: \" << endl;\n 15:    string secondLine;\n 16:\
  \    getline(cin, secondLine);\n 17:\n 18:    cout << \"Result of concatenation:\
  \ \" << endl;\n 19:    string concatString = firstLine + \" \" + secondLine;\n 20:\
  \    cout << concatString << endl;\n 21:\n 22:    cout << \"Copy of concatenated\
  \ string: \" << endl;\n 23:    string aCopy;\n 24:    aCopy = concatString;\n 25:\
  \    cout << aCopy << endl;\n 26:\n 27:    cout << \"Length of concat string: \"\
  \ << concatString.length() << endl;\n 28:\n 29:    return 0;\n 30: }\n```\n\n点击此处查看代码图像\n\
  \n#### 输出 ▼\n\n```\nHello std::string!\nEnter a line of text:\nI love\nEnter another:\n\
  C++ strings\nResult of concatenation:\nI love C++ strings\nCopy of concatenated\
  \ string:\nI love C++ strings\nLength of concat string: 18\n```\n\n点击此处查看代码图像\n\n\
  #### 分析 ▼\n\n尝试理解输出并将其与代码中的各种元素联系起来。在这个阶段不要让新的语法特性困扰你。程序开始显示一个在第 7 行初始化为 `\"Hello\
  \ std::string\"` 的字符串。然后要求用户输入两行文本，将其存储在第 12 行和第 16 行的变量 `firstLine` 和 `secondLine`\
  \ 中。实际的拼接很简单，看起来就像第 19 行的算术加法，其中第一行还添加了一个空格。拷贝的操作是一个简单的赋值，如第 24 行。确定长度是通过调用 `length()`\
  \ 完成的，如第 27 行。\n\n**注意** 要使用 C++ 字符串，你需要包含头文件：\n\n```\n#include<string>\n```\n\n\
  ### 总结\n\n本节介绍了数组的基础：它们是什么以及如何使用。你学习了如何声明数组、初始化数组、访问元素以及向元素写入值。你学习了避免越数组限制（也称为边界）以防止缓冲区溢出的重要性。你还学习了确保输入的重要性。动态数组是程序员不需要在编译时固定最大长度的数组。这些数组在小于小于的情况下提供了更好的内存管理。\n\
  \n你学习了 C 风格字符串是 `char` 数组的一种特殊情况，字符串的结尾由空终止符 `'\\0'` 标记。更重要的是你学习了 C++ 提供了一个更好的选项\
  \ `std::string`，它提供了确定长度、拼接以及类似操作的功能。\n\n### 问答\n\nQ 如果你有选择，你会使用需要空终止符的 C 风格字符串吗？\n\
  \n**答** 会，但除非有人拿枪指着你。C++ `std::string` 安全得多，提供的特性应该让任何优秀的程序员都远离 C 风格字符串。\n\nQ 字符串的长度是否包含末尾的空终止符？\n\
  \n**答** 不包含。`\"Hello World\"` 字符串的长度为 11，包含空格但不包含标记结尾的不可空字符。\n\nQ 那么，我仍然想在我定义的 char\
  \ 数组中使用 C 风格字符串。我使用的数组的大小应该是多少？\n\n**答** 这是使用 C 风格字符串的复杂性之一。数组的大小应该比它将包含的最大字符串大一。这对于容纳最大字符串末尾的空字符至关重要。如果\
  \ `\"Hello World\"` 是你的 `char` 数组将包含的最大字符串，那么数组的长度需要 11 + 1 = 12 个字符。显然，这种数组不太适合包含用户输入，因为用户很容易越过它的边界并导致缓冲区溢出。\n\
  \n### 练习\n\n练习提供了测试题帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的机会。在检查 附录 E 中的答案之前，尝试回答测试和练习题，并在继续下一节之前确保你理解了答案。\n\
  \n### 测验\n\n\n\n\n\n1. 查看 Listing 4.1 中的数组 `myNumbers`。该数组第一个元素和最后一个元素的索引分别？\n2.\
  \ 如果你需要允许用户输入字符串，你会使用 C 风格字符串吗？\n3. 编译器在 `'\\0'` 中看到了多少字符？\n4. 你忘记用空终止符结束你的 C 风格字符串了。当你使用它时会发生什么？\n\
  5. 查看 Listing 4.4 中 `vector` 的声明，并尝试编写一个包含 `char` 类型元素的动态数组。\n\n### 练习\n\n1. 声明一个表示棋盘上格子的数组；该数组应该是一个\
  \ `enum`，用于定义可能占据这些格子的棋子。\n   * *提示：* `enum` 将包含枚举常量（`Pawn`、`Rook`、`Bishop` 等），从而限制数组元素可以包含的可能值范围。不要忘记单元格也可能是空的！\n\
  \n2. **故障排除 (BUG BUSTERS)：** 这段代码片段哪里有问题？\n   ```\n   int myNumbers[5];\n   myNumbers[5]\
  \ = 450; // 将第 5 个元素设置为值 450\n   ```\n\n## 第 5 \n\n## 表达式、语句和运算符的操作\n\n程序的核心是一组按顺序执行的命令。这些命令被程序化为表达式和语句，并使用运算符来执行特定的计算或操作。\n\
  \n在本节中，你将学习到：\n* 什么是语句\n* 什么是块或复合语句\n* 什么是运算符\n* 如何执行简单的算术运算和逻辑运算\n\n### 语句\n\n\
  语言——无论是口语还是编程语言——都由一个一个执行的语句组成。让我们分析你学到的第一个重要语句：\n\n```cpp\ncout << \"Hello World\"\
  \ << endl;\n```\n\n使用 `cout` 的语句通过控制台在屏幕上显示文本。C++ 中的每个语句都以分号（`;`）结束，这定义了语句的边界。它类似于你在英语句子末尾添加的句号（`.`）。下一条语句可以紧接在分号之后开始。因此，这一行在\
  \ C++ 中包含两条语句：\n\n```cpp\ncout << \"Hello World\" << endl; cout << \"Another hello\"\
  \ << endl;\n```\n\n然而，为了方便和可读性，程序员通常每行编写语句。\n\n**注意**\n\n空白字符——包括空格、制表符、换行符、回车等——通常对编译器是不可见的。然而，字符串字面量内的空白字符会对输出产生影响。\n\
  \n以下内容是无效的：\n\n```cpp\ncout << \"Hello\n     World\" << endl; // 字符串字面量中不允许换行\n\
  ```\n\n此类代码通常会导致错误，指示编译器在第一行缺少闭合引号（`\"`）和用于结束语句的分号（`;`）。如果你由于某些原因需要将一条语句跨越两行，可以在第一行的末尾插入一个反斜杠（`\\\
  `）来实现：\n\n```cpp\ncout << \"Hello \\\n     World\" << endl; // 分成两行是允许的\n```\n\n\
  将上述语句分为两行的另一种方法是编写两个字符串字面量而不是一个：\n\n```cpp\ncout << \"Hello \"\n   \"World\" <<\
  \ endl; // 两个字符串字面量也是可以\n```\n\n在前面的示例中，编译器会注意到两个相邻的字符串字面量并为你将其连接起来。\n\n**注意**\n\
  \n当你有长文本元素或由许多变量组成的复杂表达式，导致语句长度远超大多数显示器允许的范围时，将语句分成多行是非常有用的。\n\n### 复合语句或块\n\n当你将语句组合在大括号\
  \ `{...}` 中时，你就创建了一个复合语句，或称为一个块：\n\n```cpp\n{\n   int daysInYear = 365;\n   cout\
  \ << \"Block contains an int and a cout statement\" << endl;\n}\n```\n\n块通常将许多语句组合在一起，表示它们属于整体。在编写条件\
  \ `if`语句或循环时，块特别有用，这些将在第 6 “控制程序流”中解释。\n\n### 使用运算符\n\n运算符是 C++ 提供的工具，让你能够处理数据、转换数据、处理数据并可能做出决策。\n\
  \n#### 赋值运算符 (`=`)\n\n赋值运算符用于将右侧的值赋予左侧的变量。\n\n```cpp\nint daysInYear = 365;\n```\n\
  \n赋值运算符用右侧的值替换变量的值。\n\n#### 加法 (`+`)、减法 (`-`)、乘法 (`*`)、除法 (`/`) 和取模 (`%`) 运算符\n\n\
  你可以使用 `+` 加法、`-` 减法、`*` 乘法、`/` 除法和 `%` 取模在两个操作数之间进行算术运算：\n\n```cpp\nint num1 = 20;\n\
  int num2 = 5;\nint addNums = num1 + num2; // 25\nint subtractNums = num1 - num2;\
  \ // 15\nint multiplyNums = num1 * num2; // 100\nint divideNums = num1 / num2; //\
  \ 4\nint moduloNums = num1 % num2; // 0\n```\n\n注意除法运算符 (`/`) 返回除法的结果。然而，对于整数，结果不能包含小数。取模运算符\
  \ (`%`）返回除法的余数。它只适用于整数值。Listing 5.1 是一个对用户输入的数字进行算术运算的简单程序。\n\n##### Listing 5.1\
  \ 对输入的整数进行算术运算的演示\n\n```cpp\n#include<iostream>\nusing namespace std;\n\nint main()\n\
  {\n   int num1 = 0, num2 = 0;\n   cout << \"Enter two integers:\" << endl;\n   cin\
  \ >> num1;\n   cin >> num2;\n\n   cout << num1 << \" + \" << num2 << \" = \" <<\
  \ num1 + num2 << endl;\n   cout << num1 << \" - \" << num2 << \" = \" << num1 -\
  \ num2 << endl;\n   cout << num1 << \" * \" << num2 << \" = \" << num1 * num2 <<\
  \ endl;\n   cout << num1 << \" / \" << num2 << \" = \" << num1 / num2 << endl;\n\
  \   cout << num1 << \" % \" << num2 << \" = \" << num1 % num2 << endl;\n\n   return\
  \ 0;\n}\n```\n\n**分析**\n\n程序大部分都是显而易见的。最感兴趣的行可能是第 14 行，它使用了 `%` 取模运算符。它返回 `num1`\
  \ (365) 除以 `num2` (25) 的余数。\n\n#### 自增运算符 (`++`) 和 自减运算符 (`--`)\n\n\n\n\n\n有时你需要以\
  \ 1 为增量进行计数。这有助于控制循环，在每次循环执行时，变量的值可能需要增加或减少。\n\nC++ 包含了 `++`（递增）和 `--`（递减）运算符来帮助你完成此任务。\n\
  \n你可以如下所示使用这些运算符：\n\n```cpp\nint num1 = 101;\nint num2 = num1++; // 后置增运算符\nint\
  \ num2 = ++num1; // 前置增运算符\nint num2 = num1--; // 后置减运算符\nint num2 = --num1; //\
  \ 前置减运算符\n```\n\n\n\n点击此处查看代码图像\n\n如此示例所示，使用增减运算符有两种方法：在操作数之前或之后。放在操作数之前的运算符称为`前置增`或`前置减`运算符，而放在操作数之后的称为`后置增`或`后置减`运算符。\n\
  \n### 是使用后置还是前置？\n\n理解前置和后置之间的区别并根据具体情况使用它们至关重要。后置运算符的执行结果是：右值（右侧的变量）首先赋值给左值，在赋值之后，右值才会增加（或减少）。这意味着在使用了后置运算符的情况下，`num2`\
  \ 的值是 `num1` 的旧值（执行增或减操作之前的值）。\n\n前置运算符的行为恰恰相反。右值先增加（减少，然后赋值给左值。在使用了前置运算符的情况下，`num2`\
  \ 和 `num1` 具有相同的值。列表 5.2 演示了前置和后置增减运算符对一个示例整数的影响。\n\n#### 输入 ▼\n\n列表 5.2 演示后置与前置运算符的区别\n\
  \n```cpp\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: int main()\n\
  \ 4: {\n 5:    int startValue = 101;\n 6:    cout << \"Start value of integer being\
  \ operated: \" << startValue << endl;\n 7:\n 8:    int postfixIncrement = startValue++;\n\
  \ 9:    cout << \"Result of Postfix Increment = \" << postfixIncrement << endl;\n\
  10:    cout << \"After Postfix Increment, startValue = \" << startValue << endl;\n\
  \ 11:\n 12:    startValue = 101; // Reset\n 13:    int prefixIncrement = ++startValue;\n\
  \ 14:    cout << \"Result of Prefix Increment = \" << prefixIncrement << endl;\n\
  \ 15:    cout << \"After Prefix Increment, startValue = \" << startValue << endl;\n\
  \ 16:\n 17:    startValue = 101; // Reset\n 18:    int postfixDecrement = startValue--;\n\
  \ 19:    cout << \"Result of Postfix Decrement = \" << postfixDecrement << endl;\n\
  \ 20:    cout << \"After Postfix Decrement, startValue = \" << startValue << endl;\n\
  \ 21:\n 22:    startValue = 101; // Reset\n 23:    int prefixDecrement = --startValue;\n\
  \ 24:    cout << \"Result of Prefix Decrement = \" << prefixDecrement << endl;\n\
  \ 25:    cout << \"After Prefix Decrement, startValue = \" << startValue << endl;\n\
  \ 26:\n 27:    return 0;\n 28: }\n```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n```\nStart value\
  \ of integer being operated: 101\nResult of Postfix Increment = 101\nAfter Postfix\
  \ Increment, startValue = 102\nResult of Prefix Increment = 102\nAfter Prefix Increment,\
  \ startValue = 102\nResult of Postfix Decrement = 101\nAfter Postfix Decrement,\
  \ startValue = 100\nResult of Prefix Decrement = 100\nAfter Prefix Decrement, startValue\
  \ = 100\n```\n\n点击此处查看代码图像\n\n#### 分析 ▼\n\n结果显示，后置运算符与前置运算符的不同在于：第 8 行和第 18 行中赋值的左值包含整数在执行增或减操作之前的原始值。相反，第\
  \ 13 行和第 23 行的前置操作导致左值被赋值为增加或减少后的值。这是在选择运算符类型时需要考虑的最重要区别。\n\n请注意，在以下语句中，前置或后置运算符对程序的输出没有影响：\n\
  \n```cpp\nstartValue++; // 等于…\n++startValue;\n```\n\n点击此处查看代码图像\n\n这是因为这里没有对初始值赋值，且两种情况的最终结果都只是整数\
  \ `startValue` 增加了。\n\n**注意**\n\n你经常会听到出于性能更好的考虑，前置增或前置减运算符优于其后置变体的情况。即，`++startValue`\
  \ 优于 `startValue++`。\n\n这在理论上是正确的，因为对于后置运算符，编译器需要存储初始值。\n\n### 等等运算符 (== 和 !=)\n\
  \n你经常需要检查一个条件是否满足。等等运算符 `==`（操作数相等）和 `!=`（操作数不等）可以帮助你完成这一点。相等检查的结果是一个 `bool`——即\
  \ `true` 或 `false`：\n\n```cpp\nint personAge = 20;\nbool checkEquality = (personAge\
  \ == 20); // true\nbool checkInequality = (personAge != 100); // true\n\nbool checkEqualityAgain\
  \ = (personAge == 200); // false\nbool checkInequalityAgain = (personAge != 20);\
  \ // false\n```\n\n#### 关系运算符\n\n除了相等检查，你可能还需要检查变量与值之间的不等性。为了帮助你完成这一点，C++ 包含了关系运算符（参见表\
  \ 5.1）。\n\n| 运算符名称 |  |\n| --- | --- |\n| 小于 (`<`) | 如果一个操作数小于另一个 (`op1 < op2`),则为\
  \ `true`，否则为 `false` |\n| 大于 (`>`) | 如果一个操作数大于另一个 (`op1 > op2`),则为 `true`，否则为 `false`\
  \ |\n| 小于等于 (`<=`) | 如果一个操作数小于等于另一个，则为 `true`，否则为 `false` |\n| 大于等于 (`>=`) | 如果一个操作数大于等于另一个，则为\
  \ `true`，否则为 `false` |\n\n**表 5.1** 关系运算符\n\n如表 5.1 所示，比较操作的结果始终是 `true` 或 `false`——换句话说，是一个\
  \ `bool`。以下示例代码演示了表 5.1 中引入的关系运算符如何使用：\n\n```cpp\nint personAge = 20;\nbool checkLessThan\
  \ = (personAge < 100);  // true\nbool checkGreaterThan = (personAge > 100); // false\n\
  bool checkLessThanEqualTo = (personAge <= 20); // true\nbool checkGreaterThanEqualTo\
  \ = (personAge >= 20); // true\nbool checkGreaterThanEqualToAgain = (personAge >=\
  \ 100); // false\n```\n\n点击此处查看代码图像\n\n[列表 5.3]是一个通过在屏幕上显示结果来演示使用这些运算符的程序。\n\n\n\
  \n\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:  \n 3: int main()\n\
  \ 4: {\n 5:    cout << \"Enter two integers:\" << endl;\n 6:    int num1 = 0, num2\
  \ = 0;\n 7:    cin >> num1;\n 8:    cin >> num2;\n 9:\n10:    bool isEqual = (num1\
  \ == num2);\n 11:    cout << \"equality test: \" << isEqual << endl;\n 12:\n13:\
  \    bool isUnequal = (num1 != num2);\n 14:    cout << \"inequality test: \" <<\
  \ isUnequal << endl;\n 15:\n16:    bool isGT = (num1 > num2); // greater than\n\
  \ 17:    cout << \"\" << num1 << \" > \" << num2 << \" test: \" << isGT << endl;\n\
  \ 18:\n19:    bool isLT = (num1 < num2); // lesser than\n 20:    cout << \"\" <<\
  \ num1 << \" < \" << num2 << \" test: \" << isLT << endl;\n 21:\n22:    bool isGTE\
  \ = (num1 >= num2); // greater than or equal to\n 23:    cout << \"\" << num1 <<\
  \ \" >= \" << num2 << \" test: \" << isGTE << endl;\n 24:\n25:    bool isLTE = (num1\
  \ <= num2); // lesser than or equal to\n 26:    cout << \"\" << num1 << \" <= \"\
  \ << num2 << \" test: \" << isLTE << endl;\n 27:\n28:    return 0;\n 29: }\n```\n\
  \n点击此处查看代码图像\n\n### 输出 ▼\n\n第一次运行：\n\n```\nEnter two integers:\n365\n-24\nequality\
  \ test: 0\ninequality test: 1\n365 > -24 test: 1\n365 < -24 test: 0\n365 >= -24\
  \ test: 1\n365 <= -24 test: 0\n```\n\n点击此处查看代码图像\n\n第二次运行：\n\n```\nEnter two integers:\n\
  101\n101\nequality test: 1\ninequality test: 0\n101 > 101 test: 0\n101 < 101 test:\
  \ 0\n101 >= 101 test: 1\n101 <= 101 test: 1\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n程序显示了各种操作的二进制结果，其中测试结果\
  \ `0` 表示 `false`，`1` 表示 `true`。请注意当提供的两个整数相同时输出：运算符 `==`、`>=` 和 `<=` 产生了相同的结果。\n\
  \n相等和关系运算符的输出是二进制这一事实，使得这些运算符非常适用于用于帮助决策的语句，以及作为循环条件表达式，确保循环仅在条件求值为 `true` 时才执行。你可以在\
  \ 第 6 课 中学习更多关于条件执行和循环的知识。\n\n注意\n\n列表 5.3 的输出显示包含 `false` 的布尔值为 `0`。包含 `true` 的显示为\
  \ `1`。从编译器的角度来看，当表达式求值为 `0` 时，它为 `false`。对 `false` 的检查就是对零的检查。求值为非值的表达式被求为 `true`。\n\
  \n### C++20 三路比较运算符 (`<=>`)\n\n三路比较运算符是 C++ 的一项现代新增。运算符 `<=>` 在 2020 年正式引入，用于比较两个操作数并揭示一个是否小于另一个、一个是否大于另一个，或者两者是否相等，如下所示：\n\
  \n```\nType var1 = value1, var2 = value2;\nauto resultOfComparison = var1 <=> var2;\n\
  ```\n\n点击此处查看代码图像\n\n在此示例中，\n\n* 如果 `resultOfComparison` 小于零，则 `var1` 小于 `var2`。\n\
  * 如果 `resultOfComparison` 大于零，则 `var1` 大于 `var2`。\n* 如果 `resultOfComparison` 为零，则\
