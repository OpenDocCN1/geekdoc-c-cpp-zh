  \ 16 行的公共方法 `Human::GetAge()`。\n\n`GetAge()` 为类 `Human` 的程序员提供了了解 `age` 何时被查询并以合适方式对其进行共享的机会。换句话说，C++\
  \ 允许类来控制它想要暴露的属性以及它如何暴露这些属性。如果类 `Human` 没有实现 `GetAge()` 公共成员方法，该类将实际上确保用户完全无法查询\
  \ `age`。这一特性在本节稍后解释的情况中可能会非常有用。\n\n注意，`Human::age` 也无法直接赋值：\n\n```\neve.age = 22;\
  \ // 编译错误\n```\n\n设置年龄的唯一允许方法是通过方法 `SetAge()`：\n\n```\neve.SetAge(22); // 正确\n```\n\
  \n这有许多优势。`SetAge()` 的当前实现只是直接设置了成员变量 `Human::age`。然而，你可以使用 `SetAge()` 来验证设置的 `age`\
  \ 是否非零且不为负数，从而验证外部输入：\n\n```cpp\nclass Human\n{\nprivate:\n   int age;\n\npublic:\n\
  \   void SetAge(int humansAge)\n   {\n      if (humansAge > 0)\n          age =\
  \ humansAge;\n   }\n};\n```\n\n点击此处查看代码图像\n\n因此，C++ 允许类的设计者控制类的数据属性如何被访问和操纵。\n\n\
  ### 构造函数\n\n*构造函数*是一种在对象创建时、类实例构造时调用的特殊函数（或方法）。就像函数一样，构造函数也可以重载。\n\n### 声明和实现构造函数\n\
  \n构造函数是一个取类名且没有返回值的特殊函数。因此，类 `Human` 将有一个如下声明的构造函数：\n\n```cpp\nclass Human\n{\n\
  public:\n   Human(); // 构造函数的声明\n```\n\n点击此处查看代码图像\n\n该构造函数可以在类内内联实现，也可以在类外部实现。类内部实现（也称为定义）如下：\n\
  \n```cpp\nclass Human\n{\npublic:\n   Human()\n   {\n      // 构造函数代码\n   }\n};\n\
  ```\n\n点击此处查看代码图像\n\n在类外部定义构造函数的变体如下：\n\n```cpp\nclass Human\n{\npublic:\n   Human();\
  \ // 构造函数声明\n};\n\n// 构造函数实现（定义）\nHuman::Human()\n{\n   // 构造函数代码\n}\n```\n\n###\
  \ 作用域解析\n\n注意 `::` 是作用域解析运算符。例如，`Human::dateOfBirth` 指的是 `Human` 类作用域内声明的变量 `dateOfBirth`。注意\
  \ `::dateOfBirth` 指的是全局作用域内同名变量 `dateOfBirth`。\n\n#### 何时以及如何使用构造函数\n\n构造函数总在对象创建时、类实例构造时被调用。这使得构造函数成为初始化类成员变量（如整数、指针等）为你选择的值完美位置。再次查看列表\
  \ 9.2。注意，如果你忘记使用 `SetAge()`，整数变量 `Human::age` 可能会包含一个未知值，因为该变量没有被初始化。（尝试注释掉第 28\
  \ 行和第 31 行。）列表 9.3 使用构造函数实现了一个更好的 `Human` 类，其中变量 `age` 已经初始化。\n\n\n\n\n\n```\n 0:\
  \ #include<iostream>\n 1: #include<string>\n 2: using namespace std;\n 3:\n 4: class\
  \ Human\n 5: {\n 6: private:\n 7:    string name;\n 8:    int age;\n 9:\n10: public:\n\
  11:    Human() // constructor\n12:    {\n13:       age = 1; // initialization\n\
  14:       cout << \"Constructed an instance of class Human\" << endl;\n15:    }\n\
  16:\n17:    void SetName (string humansName)\n18:    {\n19:       name = humansName;\n\
  20:    }\n21:\n22:    void SetAge(int humansAge)\n23:    {\n24:       age = humansAge;\n\
  25:    }\n26:\n27:    void IntroduceSelf()\n28:    {\n29:       cout << \"I am \"\
  \ + name << \" and am \";\n30:       cout << age << \" years old\" << endl;\n31:\
  \    }\n32: };\n33:\n34: int main()\n35:    {\n36:    Human firstWoman;\n37:   \
  \ firstWoman.SetName(\"Eve\");\n38:    firstWoman.SetAge (28);\n39:\n40:    firstWoman.IntroduceSelf();\n\
  41: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nConstructed an instance of class Human\n\
  I am Eve and am 28 years old\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n在输出中，你看到有一行表示对象的构造。现在，看一眼\
  \ `main()`，它定义在第 34 行到 41 行。你可以看到输出的第一行是由于第 36 行创建（构造）了对象 `firstWoman`。第 11 行到 15\
  \ 行的构造函数 `Human::Human()` 包含了 `cout` 语句，它构成了该输出。注意，构造函数将整数 `age` 初始化为 0。如果你忘记在新构造的对象上使用\
  \ `SetAge()`，你可以放心，构造函数会确保变量 `age` 中包含的值不是随机整数，而是一个确定的 `1`。\n\n### 笔记\n\n不带参数且被调用的构造函数被称为*默认构造函数*。编写默认构造函数是可选的。如果你没有编写任何构造函数，如列表\
  \ 9.1 所示，编译器会为你创建一个。（它会构造成员属性，但不会将如 `int` 这样的简单旧数据类型初始化为任何特定值。）\n\n### 构造函数重载\n\n\
  构造函数可以像函数一样进行重载。因此，你可以写一个要求在实例化 `Human` 时用名称作为参数的构造函数，例如：\n\n```cpp\nclass Human\n\
  {\npublic:\n   Human()\n   {\n       // 此处是默认构造函数的代码\n   }\n\n   Human(string humansName)\n\
  \   {\n       // 此处是重载构造函数的代码\n   }\n};\n```\n\n点击此处查看代码图片\n\n列表 9.4 展示了通过重载构造函数在构造时提供名称来创建\
  \ `Human` 类对象的应用。\n\n### 输入 ▼\n\n列表 9.4 具有多个构造函数的 `Human` 类\n\n```cpp\n 0: #include<iostream>\n\
  \ 1: #include<string>\n 2: using namespace std;\n 3:\n 4: class Human\n 5: {\n 6:\
  \ private:\n 7:    string name;\n 8:    int age;\n 9:\n10: public:\n11:    Human()\
  \ // 默认构造函数\n12:    {\n13:       age = 0; // 初始化确保没有垃圾值\n14:       cout << \"Default\
  \ constructor: name not set\" << endl;\n15:    }\n16:\n17:    Human(string humansName,\
  \ int humansAge) // 重载\n18:    {\n19:       name = humansName;\n20:       age =\
  \ humansAge;\n21:       cout << \"Overloaded constructor creates \";\n22:      \
  \ cout << name << \" of \" << age << \"years\" << endl;\n23:    }\n24: };\n25:\n\
  26: int main()\n27:    {\n28:    Human firstMan; // 使用默认构造函数\n29:    Human firstWoman\
  \ (\"Eve\", 20); // 使用重载构造函数\n30: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nDefault\
  \ constructor: name not set\nOverloaded constructor creates Eve of 20 years\n```\n\
  \n点击此处查看代码图片\n\n### 分析 ▼\n\n第 26 行到 30 行的 `main()` 创建了两个 `Human` 类实例。`firstMan`\
  \ 使用了默认构造函数，而 `firstWoman` 使用了重载构造函数，提供了名称和年龄。 (注：原文此处存在大量重复和混乱的结构，已根据高级文档工程师要求提取核心逻辑并规范化处理)。\n\
  \n\n\n\n\n此类类可以如下方式实例化：\n\n```\nHuman adam(\"Adam\"); // adam.age 被赋予了默认值 25\nHuman\
  \ eve(\"Eve\", 18); // eve.age 被赋予了指定的 18\n```\n\n点击此处查看代码图片\n\n### 注意\n\n注意，默认构造函数是一种可以在没有参数的情况下实例化的构造函数。因此，一个具有两个参数且两个参数都有默认值的构造函数（如下）也是默认构造函数：\n\
  \n```\nclass Human\n{\nprivate:\n   string name;\n   int age;\n\npublic:\n   //\
  \ 参数的默认值\n   Human(string humansName = “Adam”, int humansAge = 25)\n   {\n     \
  \  name = humansName;\n       age = humansAge;\n       cout << “Overloaded constructor\
  \ creates “;\n       cout << name << “ of age “ << age;\n   }\n};\n```\n\n点击此处查看代码图片\n\
  \n`Human` 类仍然可以在不带参数的情况下实例化：\n\n```\nHuman adam; // Human 采用默认名称 “Adam”，年龄 25\n\
  ```\n\n点击此处查看代码图片\n\n## 使用初始化列表的构造函数\n\n你已经看到构造函数在初始化成员变量时有多用。初始化成员的另一种方法是使用`初始化列表`。列表\
  \ 9.5 中使用初始化列表的构造函数变体如下：\n\n```\nclass Human\n{\nprivate:\n   string name;\n   int\
  \ age;\n\npublic:\n   // 初始化成员 age 和 name 的两个参数\n   Human(string humansName, int\
  \ humansAge)\n        :name(humansName), age(humansAge)\n   {\n      cout << \"\
  Constructed a human called \" << name;\n      cout << \", \" << age << \" years\
  \ old\" << endl;\n   }\n// ... 其他类成员\n};\n```\n\n点击此处查看代码图片\n\n因此，初始化列表的特征是在括号 `(...)`\
  \ 中包含的参数声明后跟一个冒号 (`:`)，随后是一个单独的成员变量及其被初始化的值。该初始化值可以是参数（如 `humansName`），也可以是一个固定值。初始化列表在调用带有特定参数的基类构造函数时也有用。这些将在第\
  \ 10 节“实现继承”中再次讨论。\n\n你可以在列表 9.6 中看到一个带有参数默认构造函数、默认值和初始化列表的 `Human` 类版本。\n\n###\
  \ 输入 ▼\n\n列表 9.6 一个接受带默认值的参数并使用初始化列表设置成员的默认构造函数\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<string>\n 2: using namespace std;\n 3:\n 4: class Human\n 5: {\n 6:\
  \ private:\n 7:    int age;\n 8:    string name;\n 9:\n10: public:\n 11:    Human(string\
  \ humansName = \"Adam\", int humansAge = 25)\n 12:         :name(humansName), age(humansAge)\n\
  \ 13:    {\n 14:       cout << \"Constructed a human called \" << name;\n 15:  \
  \     cout << \", \" << age << \" years old\" << endl;\n 16:    }\n 17: };\n 18:\n\
  \ 19: int main()\n 20: {\n 21:    Human adam;\n 22:    Human eve(\"Eve\", 18);\n\
  \ 23:\n 24:    return 0;\n 25: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nConstructed\
  \ a human called Adam, 25 years old\nConstructed a human called Eve, 18 years old\n\
  ```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n带有初始化列表的构造函数出现在第 11 行到 16 行，在这里你也可以看到参数为 `name`\
  \ 赋予了默认值 `Adam`，为 `age` 赋予了默认值 `25`。因此，当第 21 行创建一个名为 `adam` 的 `Human` 类实例且不带参数时，其成员会自动分配默认值。第\
  \ 22 行为 `eve` 提供了参数；这些参数在构造期间变为赋值给 `Human::name` 和 `Human::age` 的值。\n\n注意\n\n也可以通过使用\
  \ `constexpr` 关键字将构造函数定义为常量表达式。在从性能角度来看这种结构有用的特殊情况下，你可以在构造函数声明中使用它：\n\n```\nclass\
  \ Sample\n{\nconst char* someString;\npublic:\n   constexpr Sample(const char* input)\n\
  \                   :someString(input)\n   { // 构造函数代码 }\n};\n```\n\n点击此处查看代码图片\n\
  \n### 提示\n\n包含参数的构造函数也称为`转换构造函数`。它隐式地将参数列表转换为正在构造的类型。然而，在 C++11 之前，只有接受单个参数的构造函数被认为是转换的。为了避免隐式转换，请在构造函数声明的开头使用\
  \ `explicit` 关键字。\n\n## 析构函数\n\n析构函数和构造函数一样，是一种特殊的函数。\n\n### 声明和实现析构函数\n\n当对象超出范围或通过\
  \ `delete` 删除时，析构函数总是会被调用。因此，`Human` 类将有一个如下声明的析构函数：\n\n```\nclass Human\n{\n  \
  \ ~Human();\n};\n```\n\n点击此处查看代码图片\n\n此析构函数可以在类内内联实现，也可以在外部实现。类内实现所示：\n\n```\nclass\
  \ Human\n{\npublic:\n   ~Human()\n   {\n       // 析构函数代码\n   }\n};\n```\n\n点击此处查看代码图片\n\
  \n允许你在类外定义析构函数的变体如下：\n\n```\nclass Human\n{\npublic:\n   ~Human();\n};\n// 析构函数定义（实现）\n\
  Human::~Human()\n{\n   // 析构函数代码\n}\n```\n\n点击此处查看代码图片\n\n## 何时以及如何使用析构函数\n\n析构函数的作用与构造函数相反。这种属性使得析构函数成为重置变量以及释放动态内存和其他资源的理想位置。构造函数、析构函数以及良好的运算符被广泛应用于工具类（如\
  \ `std::string`，`char*` 的智能替代方案）以及标准模板库（STL）提供的容器类（如 `std::vector`）。\n\n注意\n\n将在第\
  \ 12 节“运算符类型和运算符重载”中解释。\n\n让我们分析列表 9.7 所示的示例类 `MyBuffer`，它在构造函数中使用 `new` 为整数数组分配内存并在析构函数释放释放。\n\
  \n### 输入 ▼\n\n列表 9.7 一个通过析构函数确保释放的简单类\n\n```\n 0: #include<iostream>\n 1: #include<string>\n\
  \ 2: using namespace std;\n 3:\n 4: class MyBuffer\n 5: {\n 6: private:\n 7:   \
  \ int* myNums;\n 8:\n 9: public:\n 10:    MyBuffer(unsigned int length)\n 11:  \
  \  {\n 12:       cout << \"Constructor allocates \" << length << \" integers\" <<\
  \ endl;\n 13:       myNums = new int[length]; // 分配内存\n 14:    }\n 15:\n 16:   \
  \ ~MyBuffer()\n 17:    {\n 18:       cout << \"Destructor releasing allocated memory\"\
  \ << endl;\n 19:       delete[] myNums; // 释放内存\n 20:    }\n 21:\n 22:    // 用于\
  \ myNums 的其他 set 和 get 函数\n 23: };\n 24:\n 25: int main()\n 26: {\n 27:    cout\
  \ << \"How many integers would you like to store?\" << endl;\n 28:    unsigned int\
  \ numsToStore = 0;\n 29:    cin >> numsToStore;\n 30:\n 31:    MyBuffer buf(numsToStore);\n\
  \ 32:\n 33:    return 0;\n 34: }\n```\n\n\n\n\n\n# 输出 ▼\n\n首次运行：\n\n```\nHow many\
  \ integers would you like to store? 200\nConstructor allocates 200 integers\nDestructor\
  \ releasing allocated memory\n```\n\n点击此处查看代码图片\n\n再次运行：\n\n```\nHow many integers\
  \ would you like to store? 200000\nConstructor allocates 200000 integers\nDestructor\
  \ releasing allocated memory\n```\n\n点击此处查看代码图片\n\n# 分析 ▼\n\n`MyBuffer` 类本质上封装了指针\
  \ `MyBuffer::myNums`，并让你免于分配内存以及及时释放内存的任务。在本例中，最感兴趣的行数是第 9 到第 13 行的构造函数 `(..)` 以及第\
  \ 15 到第 19 行的析构函数 `~MyBuffer()`。重载的构造函数强制通过一个强制性输入参数 `length` 来创建对象，该参数包含了动态分配的元素数量。析构函数代码负责确保在构造函数中分配的内存自动返回给系统。它配合了构造函数中的\
  \ `new` 并执行了 `delete[]`。注意，在 `main()` 中没有任何地方出现 `new` 或 `delete`。除了为用户抽象内存管理的实现外，`MyBuffer`\
  \ 类还确保了释放分配内存的逻辑正确性。析构函数 `~MyBuffer()` 在 `main` 结束时自动调用，这在执行析构函数中的 `cout` 语句的输出中得到了证明。\n\
  \n课程 26“理解智能指针”演示了析构函数以更智能的方式处理指针时起的关键作用。\n\n### 注意\n\n析构函数不能被重载。一个类只能有一个析构函数。如果你忘记实现析构函数，编译器将创建并调用一个虚拟析构函数——即一个空析构函数（它不对动态分配的内存进行清理）。\n\
  \n## 拷贝构造函数\n\n在课程 7“用函数组织代码”中，你学习了传递给类似 `Area()` 函数（如列表 7.1 所示）的参数是会被拷贝的：\n\n```\n\
  double Area(double radius);\n```\n\n因此，当调用 `Area()` 时，作为参数 `radius` 发送的内容会被拷贝。这一规则同样适用于对象——即类的实例。然而，*浅拷贝*是一个需要解决的问题。\n\
  \n## 浅拷贝及相关问题\n\n如列表 9.7 所示的 `MyBuffer` 等类包含一个指针成员 `myNums`，该指针指向在构造函数中使用 `new`\
  \ 动态分配、并在析构函数中使用 `delete[]` 释放的内存。当该类的类的对象被拷贝时，指针成员会被拷贝，但它所指向的内存不会被拷贝，这导致两个对象指向内存中同一个动态分配的缓冲区。当一个对象被销毁时，`delete[]`\
  \ 会释放内存，从而使另一个对象持有的指针拷贝失效。这种拷贝是*浅*的，对程序的稳定性构成了威胁，如列表 9.8 所示。\n\n### 输入 ▼\n\n列表 9.8\
  \ 按值传递类（如 `MyBuffer`）对象时的问题\n\n```\n 0: #include<iostream>\n 1: using namespace\
  \ std;\n 2:\n 3: class MyBuffer\n 4: {\n 5: private:\n 6:    int* myNums;\n 7:\n\
  \ 8: public:\n 9:    MyBuffer(unsigned int length)\n10:    {\n11:       cout <<\
  \ \"Constructor allocates \" << length << \" integers\" << endl;\n12:       myNums\
  \ = new int[length]; // allocate memory\n13:    }\n14:\n15:    ~MyBuffer()\n16:\
  \    {\n17:       cout << \"Destructor releasing allocated memory\" << endl;\n18:\
  \       delete[] myNums; // free allocated memory\n19:    }\n20:\n21:    // other\
  \ set and get functions to work with myNums\n22: };\n23:\n24: void UseMyBuf(MyBuffer\
  \ copyBuf)\n25: {\n26:    cout << \"Copy of buf will be destroyed when function\
  \ ends\" << endl;\n27: }\n28:\n29: int main()\n30: {\n31:    cout << \"How many\
  \ integers would you like to store? \";\n32:    unsigned int numsToStore = 0;\n\
  33:    cin >> numsToStore;\n34:\n35:    MyBuffer buf(numsToStore);\n36:    UseMyBuf(buf);\
  \ // send a copy\n37:\n38:    return 0; // crash, at destruction of buf\n39: }\n\
  ```\n\n点击此处查看代码图片\n\n# 输出 ▼\n\n```\nHow many integers would you like to store? 25\n\
  Constructor allocates 25 integers\nCopy of buf will be destroyed when function ends\n\
  Destructor releasing allocated memory\nDestructor releasing allocated memory\n```\n\
  \n点击此处查看代码图片\n\n![显示了一个标题为 Exception Thrown 的弹出框。](img/09fig02.jpg)\n\n**图 9.2**\
  \ 执行列表 9.8（在 Microsoft Visual Studio 调试模式下）引起的崩溃。\n\n# 分析 ▼\n\n使用 g++ 编译此代码时的错误信息稍微清晰。它显示：\n\
  \n```\nfree(): double free detected in tcache 2\nAborted (core dumped)\n```\n\n\
  点击此处查看代码图片\n\n显然，这表明内存被释放了两次。为什么在列表 9.7 中运行良好的 `MyBuffer` 类在列表 9.8 中却崩溃了？列表 9.7\
  \ 和 9.8 之间的唯一区别是将 `buf` 的拷贝被发送给了 `UseMyBuf()`。由于 `UseMyBuf()` 按值接收参数，编译器生成了 `buf`\
  \ 的拷贝。\n\n\n\n\n\n## 列表 9.9 定义拷贝构造函数以确保动态分配缓冲区的深拷贝\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<algorithm>\n 2: using namespace std;\n 3:\n 4: class MyBuffer\n 5:\
  \ {\n 6: private:\n 7:    int* myNums;\n 8:    unsigned int bufLength;\n 9:\n10:\
  \ public:\n11:    MyBuffer(unsigned int length)\n12:    {\n13:       bufLength =\
  \ length;\n14:       cout << \"Constructor allocates \" << length << \" integers\"\
  \ << endl;\n15:       myNums = new int[length]; // 分配内存\n16:    }\n17:\n18:    MyBuffer(const\
  \ MyBuffer& src) // 拷贝构造函数\n19:    {\n20:       cout << \"Copy constructor creating\
  \ deep copy\" << endl;\n21:       bufLength = src.bufLength;\n22:       myNums =\
  \ new int[bufLength];\n23:       copy(src.myNums, src.myNums + bufLength, myNums);\
  \ // 深拷贝\n24:    }\n25:\n26:    ~MyBuffer()\n27:    {\n28:       cout << \"Destructor\
  \ releasing allocated memory\" << endl;\n29:       delete[] myNums; // 释放分配的内存\n\
  30:    }\n31:\n32:    void SetValue(unsigned int index, int value)\n33:    {\n34:\
  \       if (index < bufLength) // 检查边界\n35:          *(myNums + index) = value;\n\
  36:    }\n37:\n38:    void DisplayBuf()\n39:    {\n40:       for (unsigned int counter\
  \ = 0; counter < bufLength; ++counter)\n41:          cout << *(myNums + counter)\
  \ << \" \";\n42:\n43:       cout << endl;\n44:    }\n45: };\n46:\n47: void UseMyBuf(MyBuffer\
  \ copyBuf)\n48: {\n49:    cout << \"Displaying copy of buf: \" << endl;\n50:   \
  \ copyBuf.DisplayBuf();\n51: }\n52:\n53: int main()\n54: {\n55:    cout << \"How\
  \ many integers would you like to store? \";\n56:    unsigned int numsToStore =\
  \ 0;\n57:    cin >> numsToStore;\n58:\n59:    MyBuffer buf(numsToStore);\n60:  \
  \  for (unsigned int counter = 0; counter < numsToStore; ++counter)\n61:    {\n\
  62:       cout << \"Enter value: \";\n63:       int valueEntered = 0;\n64:     \
  \  cin >> valueEntered;\n65:       buf.SetValue(counter, valueEntered);\n66:   \
  \ }\n67:\n68:    cout << \"Numbers in the buffer buf: \";\n69:    buf.DisplayBuf();\n\
  70:    UseMyBuf(buf); // 函数接收 buf 的深拷贝\n71:\n72:    return 0; // 在 buf 析构时不会崩溃\n\
  73: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nHow many integers would you like to\
  \ store? 3\nConstructor allocates 3 integers\nEnter value: 2020\nEnter value: -596\n\
  Enter value: 42\nNumbers in the buffer buf: 2020 -596 42\nCopy constructor creating\
  \ deep copy\nDisplaying copy of buf: 2020 -596 42\nDestructor releasing allocated\
  \ memory\nDestructor releasing allocated memory\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\
  \n列表 9.9 包含了 `MyBuffer` 类的完整功能版本，包括 `SetValue()` 和 `DisplayBuf()` 函数。其中最部分部分是第 18\
  \ 行到第 24 行的拷贝构造函数。当执行第 70 行并将 `buf` 的拷贝发送到函数 `UseMyBuf()` 时，该拷贝构造函数会被隐式调用。拷贝构造函数首先使用\
  \ `new` 在目标位置分配内存，然后使用 STL 算法 `std::copy` 执行深拷贝。这在图 9.4 中所示。\n\n![显示了一个连接图。](img/09fig04.jpg)\n\
  \n**图 9.4** 当调用函数 `UseMyBuf()` 时，将参数 `buf` 深拷贝到 `copyBuf` 的插示意图。\n\n列表 9.9 的输出表明，`buffer`\
  \ 所指向的内存地址在拷贝中是不同的；也就是说，两个对象并不指向同一个动态分配内存地址。因此，当函数 `UseMyBuf()` 返回且参数 `copyBuf`\
  \ 被析毁时，析构函数对拷贝构造函数中分配的属于该对象的内存地址执行了 `delete[]`。在执行过程中，它没有触碰它所指向的内存。\n\n## 使用移动构造函数提高性能\n\
  \n在某些情况下，由于 C++ 的性质和需求，对象会自动经历拷贝步骤。考虑以下内容：\n\n```\nclass MyBuffer\n{\n   // 取自列表\
  \ 9.9 的实现\n};\nMyBuffer Copy(MyBuffer& source) // 函数\n{\n   MyBuffer copyForReturn(source.\
  \ bufLength); // 创建拷贝\n   return copyForReturn;  // 返回值调用拷贝构造函数\n}\nint main()\n\
  {\n   MyBuffer buf1(5);\n   MyBuffer buf2(Copy(buf1)); // 调用两次拷贝构造函数\n\n   return\
  \ 0;\n}\n```\n\n正如注释所示，在实例化 `buf2` 时，拷贝构造函数被调用两次，因此因为调用函数 `Copy(buf1)` 返回值而执行了两次深拷贝。然而，这个返回的值是非常临时的，在表达式表达式外不可用。因此，C++\
  \ 编译器出于好调拷贝构造函数对性能是一种负担。如果类包含大型对象，这种影响将变得显著。\n\n为了避免这种性能瓶颈，C++ 在 C++11 在拷贝构造函数的基础上引入了移动构造函数。移动构造函数的语法为：\n\
  \n```\n// 移动构造函数\n\n   MyBuffer(MyBuffer&& moveSource)\n   {\n      if(moveSource.myNums\
  \ != NULL)\n      {\n         myNums = moveSource. myNums; // 获取所有权，即“移动”\n    \
  \     moveSource.myNums = NULL;   // 将移动源置为 NULL\n      }\n   }\n```\n\n\n\n\n\n\
  当编写了移动构造函数（move constructor）时，编译器会自动选择“移动”临时资源，从而避免深拷贝步骤。实现移动构造函数后，注释应适当更改为如下：\n\
  \n```\nMyBuffer buf2(Copy(buf1)); // 触发 1 次拷贝，1 次移动构造函数\n```\n\n点击此处查看代码图像\n\n移动构造函数通常用移动赋值运算符来实现，我们将在第\
  \ 12 节中详细讨论该内容。列表 12.12 展示了 `MyBuffer` 类的改进版本，它实现了移动构造函数和移动赋值运算符。\n\n### 构造函数与析构函数的不同用途\n\
  \n在本节中，你学习了一些重要且基础的概念，例如构造函数、析构函数以及通过 `public` 和 `private` 等关键字对数据和方法进行抽象。这些概念可以用于编写类，以控制实例如何被构造、拷贝或销毁，以及它们如何暴露数据。\n\
  \n让我们来看一些可以帮助你解决许多重要设计问题的有趣模式。\n\n### 不允许拷贝的类\n\n假设你被要求为你所在国家的宪法建模。你们国家的宪法允许一位总统。你的\
  \ `President` 类面临着以下风险：\n\n```\nPresident ourPresident;\nDoSomething(ourPresident);\
  \ // 按值传递时创建了副本\nPresident clone;\nclone = ourPresident; // 通过赋值创建了副本\n```\n\n点击此处查看代码图像\n\
  \n显然，你需要避免这种情况。除了建模特定的宪法外，你可能正在编写操作系统，并需要建模一个本地局域网、一个处理器等。在这种情况下，你需要确保某些资源不能被拷贝或复制。如果你不声明拷贝构造函数，C++\
  \ 编译器会为你插入一个默认的 `public` 拷贝构造函数。这破坏了你的设计并威胁到了你的实现。然而，C++ 语言为你提供了一种解决这种设计范式的方案。\n\
  \n你可以通过声明一个 `private` 拷贝构造函数来确保你的类无法被拷贝。这确保了函数调用 `DoSomething(ourPresident)` 将导致编译失败。为了避免赋值，你还需要声明一个\
  \ `private` 赋值运算符。\n\n因此，解决方案如下：\n\n```\nclass President\n{\nprivate:\n   President(const\
  \ President&); // 私有拷贝构造函数\n   President& operator= (const President&); // 私有拷贝赋值运算符\n\
  \n   // ... 其他属性和方法\n};\n```\n\n点击此处查看代码图像\n\n没有必要实现私有的拷贝构造函数或赋值运算符。只需将它们声明为 `private`\
  \ 就足以实现你“确保 `President` 类对象不可拷贝”的目标。\n\n### 允许单例的单例类\n\n上文讨论的 `President` 类很好，但它无法阻止通过实例化多个对象来创建多个总统：\n\
  \n```\nPresident One, Two, Three;\n```\n\n得益于 `private` 拷贝构造函数，这些对象在单独看来都是不可拷贝的，但你理想上需要的是一个拥有且仅有一个真实世界中体现的\
  \ `President` 类；也就是说，你只需要一个对象，并禁止创建额外的对象。欢迎来到单例类（singleton class）的概念，它使用私有构造函数、私有赋值运算符和一个静态实例成员来创建这种（具有争议的）强大的模式。\n\
  \n### 提示\n\n当在类的数据成员上使用 `static` 关键字时，它确保该成员在所有实例之间共享。当 `static` 用在方法上时，该方法在类的所有实例之间共享。\n\
  \n当 `static` 用于在函数作用范围内声明的局部变量时，它确保该变量在函数调用之间保留其值。\n\n`static` 关键字是创建单例类的关键要素，如列表\
  \ 9.10 所示。\n\n#### 输入 ▼\n\n列表 9.10 禁止拷贝、赋值和多次实例创建的单例类 `President`\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<string>\n 2: using namespace std;\n 3:\n 4: class President\n 5: {\n\
  \ 6: private:\n 7:    President() {}; // 私有默认构造函数\n 8:    President(const President&);\
  \ // 私有拷贝构造函数\n 9:    const President& operator=(const President&); // 赋值运算符\n10:\n\
  \ 11:    string name;\n 12:\n 13: public:\n 14:    static President& GetInstance()\n\
  \ 15:    {\n 16:       // 静态对象只构造一次\n 17:       static President onlyInstance;\n\
  \ 18:       return onlyInstance;\n 19:    }\n 20:\n 21:    string GetName()\n 22:\
  \    { return name; }\n 23:\n 24:    void SetName(string InputName)\n 25:    { name\
  \ = InputName; }\n 26: };\n 27:\n 28: int main()\n 29: {\n 30:    President& onlyPresident\
  \ = President::GetInstance();\n 31:    onlyPresident.SetName(\"Abraham Lincoln\"\
  );\n 32:\n 33:    // 取消注释行以查看如何阻止副本创建\n 34:    // President second; // 无法访问构造函数\n\
  \ 35:    // President* third= new President(); // 无法访问构造函数\n 36:    // President\
  \ fourth = onlyPresident; // 无法访问拷贝构造函数\n 37:    // onlyPresident = President::GetInstance();\
  \ // 无法访问=\n 38:    cout << \"The name of the President is: \";\n 39:    cout <<\
  \ President::GetInstance().GetName() << endl;\n 40:\n 41:    return 0;\n 42: }\n\
  ```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n```\nThe name of the President is: Abraham Lincoln\n\
  ```\n\n点击此处查看代码图像\n\n#### 分析 ▼\n\n查看第 28 到 43 行的 `main()` 函数。注释行显示了所有可能的创建 `President`\
  \ 实例或副本的组合。让我们逐一分析。第 34 行和 35 行分别尝试在栈和堆上创建对象并使用默认构造函数，但由于它是私有的（如第 7 行所示），因此是不可用的：\n\
  \n```\n34:    // President second; // 无法访问构造函数\n35:    // President* third= new\
  \ President(); // 无法访问构造函数\n```\n\n点击此处查看代码图像\n\n第 36 行尝试通过拷贝构造函数创建现有对象的副本（作为创建时的赋值），这在\
  \ `main()` 中不可用，因为它在第 8 行声明为私有：\n\n```\n36:    // President fourth = onlyPresident;\
  \ // 无法访问拷贝构造函数\n```\n\n点击此处查看代码图像\n\n第 37 行尝试通过赋值创建副本，这不可通，因为赋值运算符在第 9 行声明为私有：\n\
  \n```\n37:    // onlyPresident = President::GetInstance(); // 无法访问=\n```\n\n点击此处查看代码图像\n\
  \n因此，`main()` 永远无法创建 `President` 类的实例，唯一的选择是第 30 行尝试的方法，它使用静态函数 `GetInstance()`\
  \ 获取 `President` 类的实例。因为 `GetInstance()` 是一个静态成员，它就像一个不需要对象句柄即可调用的全局函数。在第 14 到 19\
  \ 行实现的 `GetInstance()` 使用静态变量 `onlyInstance` 来确保只有一个 `President` 类实例被创建。为了更好地理解这一点，想象第\
  \ 17 行只执行一次（静态初始化），因此无论调用多少次 `President::GetInstance()`，它都会返回唯一的 `President` 类实例。\n\
  \n\n\n\n仅在绝对必要时使用单例模式，并充分考虑应用程序及其功能的未来增长。请注意，其限制创建多个实例的特性本身，当出现需要该类的多个实例的用例场景时，可能会成为架构上的瓶颈。例如，如果你的项目从对一个国家进行建模变为对联合国建模（目前包括\
  \ 193 个成员国，每个国家都有自己的主席），如果你使用了只允许存在一个实例的单例类 `President`，显然你将会面临架构问题。\n\n### 一个禁止在栈上进行实例化的类\n\
  \n如第 7 节所解释的那样，栈（stack）是内存中一种后进先出（LIFO）的结构，用于存放函数的局部变量。栈空间通常是有限的。如果你正在编写一个内部结构可能包含数太字节（terabytes）数据的数据库，你可能希望确保该类的客户端无法在栈上实例化它；相反，你希望强制它只在自由存储器（free\
  \ store）上创建实例。确保此点的关键是将析构函数声明为 `private`（私有）：\n\n```\nclass MonsterDB\n{\nprivate:\n\
  \   ~MonsterDB();  // 私有析构函数\n\n   //... 消耗大量数据的成员\n};\n```\n\n点击此处查看代码图像\n\n声明私有析构函数可以确保你不会允许像这样创建实例：\n\
  \n```\nint main()\n{\n   MonsterDB myDatabase; // 编译错误\n   // ... 更多代码\n   return\
  \ 0;\n}\n```\n\n点击此处查看代码图像\n\n此实例如果成功构造，将将位于栈上。当栈被回回时，栈上的所有对象都会被弹出，因此编译器需要在 `main()`\
  \ 结束时编译并调用析构函数 `~MonsterDB()`。然而，由于该析构函数是私有的，因此无法访问，导致编译失败。\n\n私有析构函数不会阻止你使用 `new`\
  \ 在自由存储器上进行实例化，因为此类实例不会被自动销毁：\n\n```\nint main()\n{\n   MonsterDB* myDatabase =\
  \ new MonsterDB(); // 无错误\n   // ... 更多代码\n   return 0;\n}\n```\n\n点击此处查看代码图像\n\n\
  你看到这里的内存泄漏了吗？因为析构函数无法从 `main()` 访问，你无法执行 `delete`。`MonsterDB` 类需要支持一个 `public`（公有）`static`（静态）成员函数来销毁实例。（类成员可以访问私有析构函数）。参见列表\
  \ 9.11。\n\n### 输入\n\n列表 9.11 数据库类 `MonsterDB` 仅允许在自由存储器上创建对象（使用 `new`）\n\n```\n\
  \ 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: class MonsterDB\n 4:\
  \ {\n 5: private:\n 6:    ~MonsterDB() {}; // 私有析构函数防止栈上实例\n 7:\n 8: public:\n 9:\
  \    static void DestroyInstance(MonsterDB* pInstance)\n 10:    {\n 11:       delete\
  \ pInstance; // 成员可以调用私有析构函数\n 12:    }\n 13:\n 14:    void DoSomething() {} //\
  \ 示例空方法\n 15: };\n 16:\n 17: int main()\n 18: {\n 19:    MonsterDB* myDB = new MonsterDB();\
  \ // 在自由存储器上\n 20:    myDB->DoSomething();\n 21:\n 22:    // 取消下一注释以查看编译失败\n 23:\
  \    // delete myDB; // 无法调用私有析构函数\n 24:\n 25:    // 使用静态成员释放内存\n 26:    MonsterDB::DestroyInstance(myDB);\n\
  \ 27:\n 28:    return 0;\n 29: }\n```\n点击此处查看代码图像\n\n### 输出\n\n该代码段产生输出。\n\n###\
  \ 分析\n\n这段代码的目的仅是为了演示一个禁止在栈上创建实例的类。如第 6 行所示，`private` 析构函数是关键。第 9 到 12 行的静态函数 `DestroyInstance()`\
  \ 是内存分配所需的，因为 `main()` 无法对 `myDB` 执行 `delete`。你可以通过取消第 23 行的注释来测试。\n\n### 使用构造函数转换类型\n\
  \n在本节早之前，你学习了构造函数可以被重载——即接受一个或多个参数。重载通常用于将一种类型转换为另一种类型。让我们考虑 `Human` 类，它具有一个接受整数的重载构造函数：\n\
  \n```\nclass Human\n{\n   int age;\npublic:\n   Human(int humansAge): age(humansAge)\
  \ {}\n};\n\n// 接受 Human 作为参数的函数\nvoid DoSomething(Human person)\n{\n   cout << \"\
  Human did something\" << endl;\n   return;\n}\n```\n点击此处查看代码图像\n\n此构造函数允许一种转换：\n\
  \n```\n Human kid(10); // 将整数转换为 Human\n   DoSomething(kid);\n   DoSomething(5);\
  \ // 转换\n```\n点击此处查看代码图像\n\n为什么这行代码可以工作？编译器知道 `Human` 类有一个接受整数的构造函数，它会为你提供的整数创建一个\
  \ `Human` 对象。为了避免隐式转换，你应该在声明构造函数时使用 `explicit` 关键字：\n\n```\nclass Human\n{\n   int\
  \ age;\npublic:\n   explicit Human(int humansAge): age(humansAge) {}\n};\n```\n\
  点击此处查看代码图像\n\n使用 `explicit` 不是强制的，但在许多情况下它是良好的编程习惯。列表 9.12](#ch09.xhtml_ch9lev3sec4)\
  \ 展示了不允许隐式转换的 `Human` 类。\n\n### 输入\n\n列表 9.12 使用 `explicit` 关键字阻止无意识的隐式转换\n\n```\n\
  \ 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: class Human\n 4: {\n\
  \ 5:    int age;\n 6: public:\n 7:    // explicit 构造函数阻止隐式转换\n 8:    explicit Human(int\
  \ humansAge) : age(humansAge) {}\n 9: };\n 10:\n 11: void DoSomething(Human person)\n\
  \ 12:    {\n 13:    cout << \"Human did something\" << endl;\n 14:    return;\n\
  \ 15: }\n 16:\n 17: int main()\n 18: {\n 19:    Human kid(10);    // 显式转换 OK\n 20:\
  \    Human anotherKid = Human(11); // 显式，OK\n 21:    DoSomething(kid); // OK\n 22:\n\
  \ 23:    // Human another2 = 11; // 错误：隐式转换不允许\n 24:    // DoSomething(10); // 隐式转换，不允许\n\
  \ 25:\n 26:    return 0;\n 27: }\n```\n点击此处查看代码图像\n\n### 输出\n\n```\nHuman did something\n\
  ```\n\n### 分析\n\n不产生输出的代码行与产生输出的行同样重要。`main()` 第 17 到 27 行是 `Human` 类的实例实例化变体，该类在第\
  \ 8 行声明了 `explicit` 构造函数。通过的行是显式转换的尝试，使用整数来实例化 `Human`。第 23 和 24 行是隐式转换的变体。当你移除第\
  \ 8 行的 `explicit` 关键字时，这些行就可以编译。\n\n`this` 指针是一个适用于类作用内的保留关键字，它包含了对象的地址。换句话说，`this`\
  \ 的值就是 `&object`。这是 C++ 中的一个重要概念。在类成员方法内部，当你调用另一个成员方法时，编译器会将 `this` 指针作为一个隐式的、不可见的参数传递给函数：\n\
  \n```\nclass Human\n{\nprivate:\n    void Talk (string statement)\n   {\n      cout\
  \ << statement;\n   }\n\npublic:\n   void IntroduceSelf()\n   {\n      Talk(\"Bla\
  \ bla\"); // 等同于 Talk(this, \"Bla bla\")\n   }\n};\n```\n\n\n\n\n点击此处查看代码图片\n\n\
  你在这里看到的是方法 `IntroduceSelf()`，它使用私有成员 `Talk()` 在屏幕上打印一条语句。实际上，编译器在调用 `Talk` 时会嵌入\
  \ `this` 指针，其调用方式为 `Talk(this, \"Bla bla\")`。\n\n从编程的角度来看，`this` 并没有很多应用，除了在它通常是可选的地方之外。例如，在\
  \ `SetAge()` 中访问 `age` 的代码（如列表 9.2 所示）有变体：\n\n```cpp\nvoid SetAge(int humansAge)\n\
  {\n   this->age = humansAge;   // 等于：age = humansAge\n}\n```\n\n点击此处查看代码图片\n\n###\
  \ 注意\n\n注意 `this` 指针不会传递给声明为 `static` 的类方法，因为静态函数与类的实例没有连接。相反，它们被所有实例共享。\n\n要在静态函数中使用实例变量，你需要显式声明一个参数并将\
  \ `this` 指针作为参数传递。\n\n### 在类中使用 `sizeof()`\n\n你已经学习了使用 `class` 关键字定义自定义类型的基础知识，这使你能够封装数据属性和操作这些数据的方法。`sizeof()`\
  \ 运算符在第 3 “使用变量，声明常量”中介绍，用于确定特定类型的内存需求（字节字节）。该运算符也适用于类，基本上报告类声明中包含的每个数据属性所占字节的总和。取决于你使用的编译器，`sizeof()`\
  \ 可能包含或不包含某些在字边界上的属性的填充。注意，成员函数及其局部变量在定义类的 `sizeof()` 时不起作用。请参见列表 9.13。\n\n#####\
  \ 输入 ▼\n\n列表 9.13 对类及其实例使用 `sizeof()` 的结果\n\n```cpp\n 0: #include<iostream>\n 1:\
  \ using namespace std;\n 2: \n 3: class MyBuffer\n 4: {\n 5: private:\n 6:    int*\
  \ myNums;\n 7:\n 8: public:\n 9:    MyBuffer(unsigned int length)\n10:    {\n 11:\
  \       myNums = new int[length]; // 分配内存\n 12:    }\n 13:\n 14:    ~MyBuffer()\n\
  \ 15:    {\n 16:       delete[] myNums; // 释放分配的内存\n 17:    }\n 18:\n 19:    //\
  \ 其他用于处理 myNums 的 set 和 get 函数\n 20: };\n 21:\n 22: class Human\n 23: {\n 24: private:\n\
  \ 25:    int age;\n 26:    string gender;\n 27:    string name;\n 28:\n 29: public:\n\
  \ 30:    Human(const string& inputName, int inputAge, string inputGender)\n 31:\
  \       : name(inputName), age (inputAge), gender(inputGender) {}\n 32:\n 33:  \
  \  int GetAge ()\n 34:    { return age; }\n 35: };\n 36:\n 37: int main()\n 38:\
  \ {\n 39:    MyBuffer buf1(5); // buffer 初始化为 5 个整数\n 40:    MyBuffer buf2(20);//\
  \ buffer 初始化为 20 个整数\n 41:\n 42:    cout << \"sizeof(MyBuffer) = \" << sizeof(MyBuffer)\
  \ << endl;\n 43:    cout << \"sizeof(buf1) = \" << sizeof(buf1) << endl;\n 44: \
  \   cout << \"sizeof(buf2) = \" << sizeof(buf2) << endl;\n 45:\n 46:    Human firstMan(\"\
  Adam\", 25, \"man\");\n 47:    Human firstWoman(\"Eve\", 25, \"woman\");\n 48:\n\
  \ 49:    cout << \"sizeof(Human) = \" << sizeof(Human) << endl;\n 50:    cout <<\
  \ \"sizeof(firstMan) = \" << sizeof(firstMan) << endl;\n 51:    cout << \"sizeof(firstWoman)\
  \ = \" << sizeof(firstWoman) << endl;\n 52:\n 53:    return 0;\n 54: }\n```\n\n\
  点击此处查看代码图片\n\n##### 输出 ▼\n\n32 位编译器输出：\n\n```\nsizeof(MyBuffer) = 4\nsizeof(buf1)\
  \ = 4\nsizeof(buf2) = 4\nsizeof(Human) = 60\nsizeof(firstMan) = 60\nsizeof(firstWoman)\
  \ = 60\n```\n\n点击此处查看代码图片\n\n64 位编译器输出：\n\n```\nsizeof(MyBuffer) = 8\nsizeof(buf1)\
  \ = 8\nsizeof(buf2) = 8\nsizeof(Human) = 88\nsizeof(firstMan) = 88\nsizeof(firstWoman)\
  \ = 88\n```\n\n##### 分析 ▼\n\n在输出中，我们可以看到 `sizeof()` 既可以用于类类型也可以用于其实例。注意，由于 `string`\
  \ 对象的大小和填充，`Human` 类在 32 位和 64 位编译器之间的大小不同。\n\n\n\n\n\n```cpp\n 0: #include<iostream>\n\
  \ 1: #include<string>\n 2: using namespace std;\n 3:\n 4: class Human\n 5: {\n 6:\
  \ private:\n 7:    friend class Utility;\n 8:    string name;\n 9:    int age;\n\
  10:\n11: public:\n 12:    Human(string humansName, int humansAge)\n 13:    {\n 14:\
  \       name = humansName;\n 15:       age = humansAge;\n 16:    }\n 17: };\n18:\n\
  19: class Utility\n 20: {\n 21: public:\n 22:    static void DisplayAge(const Human&\
  \ person)\n 23:    {\n 24:       cout << person.age << endl;\n 25:    }\n 26: };\n\
  27:\n 28: int main()\n 29:    {\n 30:    Human firstMan(\"Adam\", 25);\n 31:   \
  \ cout << \"Accessing private member age via friend class: \";\n 32:    Utility::DisplayAge(firstMan);\n\
  \ 33:\n 34:    return 0;\n 35: }\n```\n\n点击此处查看代码图像\n\n##### 输出 ▼\n\n```\nAccessing\
  \ private member age via friend class: 25\n```\n\n点击此处查看代码图像\n\n##### 分析 ▼\n\n第\
  \ 7 行表示 `Utility` 类是 `Human` 类的友。该 `friend` 声明允许 `Utility` 类中的所有方法访问 `Human` 类中的私有数据成员和方法。\n\
  \n### 联合体（Union）：一种特殊的数据存储机制\n\n`union` 是一种特殊的类类型，其中非静态数据成员在同一时刻只有一个是激活的。因此，联合体可以像类一样容纳多个数据成员，区别在于实际上只有一个成员可以被实际使用。\n\
  \n### 声明联合体\n\n联合体使用 `union` 关键字声明，后紧跟联合体的名称及其数据成员，并包裹在大括号内：\n\n```cpp\nunion UnionName\n\
  {\n   Type1 member1;\n   Type2 member2;\n...\n   TypeN memberN;\n};\n```\n\n点击此处查看代码图像\n\
  \n你可以这样实例化并使用联合体：\n\n```cpp\nUnionName unionObject;\nunionObject.member2 = value;\
  \ // 选择 member2 作为激活成员\n```\n\n点击此处查看代码图像\n\n### 注意事项\n\n与 `struct` 类似，联合体的成员默认是公有的（publicpublic）。然而，与\
  \ `struct` 不同，联合体不能用于继承体系中。\n\n此外，联合体的大小始终固定为其中包含的最大成员的大小——即使该成员在联合体的实例中处于非激活状态。\n\
  \n#### 在什么情况下你会使用联合体？\n\n联合体通常被用作 `struct` 的成员来建模复杂数据类型。在某些实现中，联合体将固定内存空间解释为另一种类型的能力用于类型转换或内存重新解释——考虑到有替代方案，这种做法是有争议的且并非必要的。\n\
  \n列表 9.16 展示了联合体的声明和使用。\n\n##### 输入 ▼\n\n列表 9.16 联合体的声明、实例化和大小\n\n```cpp\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: union SimpleUnion\n 4: {\n 5:    int num;\n\
  \ 6:    char alphabet;\n 7: };\n 8:\n 9: struct ComplexType\n10: {\n 11:    enum\
  \ class DataType\n 12:    {\n 13:       Int,\n 14:       Char\n 15:    } Type;\n\
  \ 16:\n 17:    union Value\n 18:    {\n 19:       int num;\n 20:       char alphabet;\n\
  \ 21:\n 22:       Value() {}\n 23:       ~Value() {}\n 24:    }value;\n 25: };\n\
  \ 26:\n 27: void DisplayComplexType(const ComplexType& obj)\n 28:    {\n 29:   \
  \ switch (obj.Type)\n 30:    {\n 31:    case ComplexType::DataType::Int:\n 32: \
  \      cout << \"Union contains number: \" << obj.value.num << endl;\n 33:     \
  \  break;\n 34:\n 35:    case ComplexType::DataType::Char:\n 36:       cout << \"\
  Union contains character: \" << obj.value.alphabet << endl;\n 37:       break;\n\
  \ 38:    }\n 39: }\n 40:\n 41: int main()\n 42:    {\n 43:    SimpleUnion u1, u2;\n\
  \ 44:    u1.num = 2100;\n 45:    u2.alphabet = 'C';\n 46:    cout << \"Accessing\
  \ private member age via friend class: \";\n 47:    Utility::DisplayAge(firstMan);\n\
  \ 48:\n 49:    return 0;\n 50: }\n```\n\n### 在类和结构体上使用聚合初始化\n\n以下初始化语法被称为*聚合初始化*：\n\
  \n```cpp\nType objectName = {argument1, ..., argumentN};\n```\n\n或者，它也可以采用这种形式：\n\
  \n```cpp\nType objectName {argument1, ..., argumentN};\n```\n\n\n\n\n因此，以下 `struct`\
  \ 满足了聚合体的前提条件，因此，它可以作为聚合体进行初始化：\n\n```\nstruct Aggregate1\n{\n   int num;\n   double\
  \ pi;\n};\n```\n\n点击此处查看代码图像\n\n### 初始化：\n\n```\nAggregate1 a1{ 2017, 3.14 };\n\
  ```\n\n点击此处查看代码图像\n\n### 另一个示例：\n\n```\nstruct Aggregate2\n{\n   int num;\n   char\
  \ hello[6];\n   int impYears[5];\n};\n```\n\n点击此处查看代码图像\n\n### 初始化：\n\n```\nAggregate2\
  \ a2 {42, {'h', 'e', 'l', 'l', 'o'}, {1998, 2003, 2011, 2014, 2017}};\n```\n\n点击此处查看代码图像\n\
  \n列表 9.17 展示了应用于 `class` 和 `struct` 的聚合初始化。\n\n#### 输入 ▼\n\n列表 9.17 类类型上的聚合初始化\n\
  \n```\n 0: #include<iostream>\n 1: #include<string>\n 2: using namespace std;\n\
  \ 3:\n 4: class Aggregate1\n 5: {\n 6: public:\n 7:    int num;\n 8:    double pi;\n\
  \ 9: };\n10:\n11: struct Aggregate2\n12: {\n13:    char hello[6];\n14:    int impYears[3];\n\
  15:    string world;\n16: };\n17:\n18: int main()\n19: {\n20:    int myNums[] =\
  \ { 9, 5, -1 }; // myNums is int[3]\n 21:    Aggregate1 a1{ 2023, 3.14 };\n 22:\
  \    cout << \"Pi is approximately: \" << a1.pi << endl;\n 23:\n 24:    Aggregate2\
  \ a2{ {'h', 'e', 'l', 'l', 'o'}, {2017, 2020, 2023}, \"world\"};\n 25:\n 26:   \
  \ // Alternatively\n 27:    Aggregate2 a2_2{'h', 'e', 'l', 'l', 'o', '\\0', 2017,\
  \ 2020, 2023, \"world\"};\n 28:\n 29:    cout << a2.hello << ' ' << a2.world <<\
  \ endl;\n 30:    cout << \"C++ standard update scheduled in: \" << a2.impYears[2]\
  \ << endl;\n 31:\n 32:    return 0;\n 33: }\n```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n\
  ```\nPi is approximately: 3.14\nhello world\nC++ standard update scheduled in: 2023\n\
  ```\n\n点击此处查看代码图像\n\n#### 分析 ▼\n\n该示例演示了如何在实例化类（或 `struct`）时使用聚合初始化。`Aggregate1`\
  \ 定义在第 4 到 9 行，是一个具有公共数据成员的类，而 `Aggregate2` 定义在第 11 到 16 行，是一个 `struct`。第 21、24\
  \ 和 27 行分别演示了对 `class` 和 `struct` 的聚合初始化。注意某些成员是数组，以及 `Aggregate2` 中的一个 `std::string`\
  \ 成员在第 24 行是如何使用这种构造进行初始化的。\n\n**注意**\n\n聚合初始化仅初始化 `union` 的第一个非静态成员。列表 9.16 中声明的\
  \ `union` 的聚合初始化如下：\n\n```\n43: SimpleUnion u1{ 2100 }, u2{ 'C' };\n// 在 u2 中，成员\
  \ num (类型 int) 被初始化为\n\n'C' (ASCII 67)\n// 尽管你打算初始化成员\n\nalphabet (type char)\n\
  ```\n\n点击此处查看代码图像\n\n因此，为了清晰起见，避免在 `union` 上使用聚合初始化语法可能是一个好主意。\n\n### 类和对象的 `constexpr`\n\
  \n你在第 3 节 中接触了 `constexpr`，并了解到 `constexpr` 提供了一种提高 C++ 性能的强大方法。通过将操作常量或 `const`\
  \ 表达式的函数标记为 `constexpr`，你指示编译器计算这些函数并插入其结果，而不是在应用程序执行时插入计算结果的指令。该关键字也可以用于求值为常量的类和对象，如列表\
  \ 9.18 所示。注意，当函数或类与非常数实体一起使用时，编译器会忽略 `constexpr`。\n\n#### 输入 ▼\n\n列表 9.18 使用 `constexpr`\
  \ 类\n\n```\n0: #include<iostream>\n1: using namespace std;\n2:\n3: class Aggregate1\n\
  4: {\n5: public:\n6:    int num;\n7:    double pi;\n8:\n9:    constexpr Aggregate1(int\
  \ n, double p) : num(n), pi(p) {}\n10: };\n11:\n12: int main()\n13: {\n14:    constexpr\
  \ Aggregate1 a1{2017, 3.14};\n15:    std::cout << a1.num << \" \" << a1.pi << std::endl;\n\
  16:    return 0;\n17: }\n```\n\n#### 输出 ▼\n\n```\n2017 3.14\n```\n\n#### 分析 ▼\n\n\
  示例演示了如何在实例化类时使用聚合初始化。`Aggregate1` 定义在第 4 到 9 行，是一个具有公共数据成员。通过将构造函数标记为 `constexpr`，编译器可以在编译时求值对象。注意，当函数或类与非常量实体一起使用时，编译器会忽略\
  \ `constexpr`。\n\n### 总结\n\n本节向你介绍了 C++ 中最基本的概念之一：聚合初始化。你看到如 `public` 和 `private`\
  \ 等访问修饰符如何帮助封装数据。你学习了构造函数以及使用它们的重要性。你看到元素如何帮助你实现单例等模式。\n\n### 问答\n\n**类的实例和对象之间有什么区别？**\n\
  \n本质上没有区别。当你实例化类时，就会得到一个实例。\n\n**访问成员的更好方法是点运算符 (.) 还是指针运算符 (->)？**\n\n如果你有一个对象的指针，指针运算符是最佳选择。如果你有一个本地对象，点运算符是最佳选择。\n\
  \n**我应该总是编写构造函数吗？**\n\n如果你的类数据成员是编写良好的智能指针、字符串类或 STL 容器（如 `std::vector`），那么编译器插入的默认构造函数将确保相应的构造函数被调用。然而，如果你的类具有原始指针成员（例如使用\
  \ `int*` 而不是 `std::vector<int>`），则你需要提供一个编写良好的构造函数，以确保在按值传递类对象的函数调用期间进行深拷贝。\n\n\
  **我的类只有一个定义了默认参数的构造函数。这是默认构造函数吗？**\n\n是的。如果类的实例可以在不带参数的情况下创建，则该类认为有一个默认构造函数。一个类只能有一个默认构造函数。\n\
  \n**为什么本节中的某些代码示例使用 `SetAge()` 函数来设置整数 `Human::age`？为什么不将 `age` 设置为公共并根据需要赋值？**\n\
  \n从技术角度来看，将 `age` 设为公共同样可行。但从设计角度来看，保持成员数据为私有是一个好主意。使用 `GetAge()` 和 `SetAge()` 等访问函数是访问这些私有数据的一种精细且可扩展的方法，允许你在设置或重置\
  \ `Human::age` 的值之前执行错误检查（例如）。\n\n**为什么拷贝构造函数的参数按引用传递拷贝源？**\n\n首先，编译器期望拷贝构造函数是那样的。因为如果拷贝构造函数按值接受拷贝源，它将调用自己，从而导致无限拷贝循环。\n\
  \n\n\n\n# Q 类（class）和结构体（struct）相似吗？\n\n**A** 原则上，它们是相似的——有细微的区别。当你不指定成员的访问修符（`private`\
  \ 或 `public`）时，`class` 假设它们为 `private`，而 `struct` 假设它们为 `public`。对于 `public` 和 `private`\
  \ 继承也是如此。\n\n### 工作坊\n\n工作坊提供了测验题帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所知识的经验。在查看附录 E 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解了这些答案。\n\
