  \ 6 行中的 `AREA_CIRCLE` 如何使用宏常量 `PI` 计算面积，这表明一个宏可以重用另一个宏。毕竟，这些只是给预处理器的纯文本替换命令。让我们分析第\
  \ 25 行，它使用了宏 `MIN`：\n\n```cpp\ncout << MIN (num, num2) << endl;\n```\n\n这一行本质上以以下格式传递给编译器，其中宏在原地被展开：\n\
  \n```cpp\ncout << (((num) < (num2)) ? (num) : (num2))\n```\n\n## 为什么使用所有的括号？\n\n\
  注意宏对类型不敏感，因此可能会引起问题。考虑以下不加括号的情况：\n\n```cpp\n#define AREA_CIRCLE(r) PI*r*r\n```\n\
  \n编译器看到表达式的方式如下：\n\n```cpp\ncout << PI*r*r\n```\n\n括号会自动产生准确的面积，使你的代码不受运算符优先级的影响。\n\
  \n```cpp\n#define AREA_CIRCLE(r) (PI*(r)*(r))\n```\n\n那么为什么你要用这么多括号？考虑以下不加括号的情况：\n\
  \n```cpp\n#define AREA_CIRCLE(r) PI*r*r\n```\n\n编译器看到表达式的方式如下：\n\n```cpp\ncout <<\
  \ PI*r*r\n```\n\n括号会自动产生准确的面积，使你的代码不受运算符优先级的影响。\n\n```cpp\n#define AREA_CIRCLE(r)\
  \ (PI*(r)*(r))\n```\n\n\n\n\n因此 `assert()` 是一个实用的调试功能；例如，你可以使用 `assert()` 来验证函数的输入参数。这是被高度推荐的，并帮助你从长远来看提高代码的质量。\n\
  \n## 使用宏函数的优缺点\n\n宏允许你重用某些工具函数，无论你处理的是什么类型的变量。再次考虑来自列表 14.2 中的以下行代码：\n\n```\n#define\
  \ MIN(a, b) (((a) < (b)) ? (a) : (b))\n```\n\n点击此处查看代码图像\n\n你可以在整数上使用这个宏函数 `MIN`：\n\
  \n```\ncout << MIN(25, 101) << endl;\n```\n\n但你也可以在 `double` 上重用它：\n\n```\ncout\
  \ << MIN(0.1, 0.2) << endl;\n```\n\n请注意，如果 `MIN()` 是一个普通函数，你将编写它的两个变体：`MIN_INT()`（接受\
  \ `int` 参数并返回 `int`）以及 `MIN_DOUBLE()`（使用 `double` 类型执行相同的操作）。将 `MIN()` 定义为宏可以减少代码行数，并诱导一些程序员使用宏来定义简单的工具函数。这些宏函数在编译前会被内联展开，因此，简单宏的性能优于执行相同任务的普通函数调用。这是因为函数调用需要创建调用堆栈、传递参数等——这些管理开销消耗的\
  \ CPU 时间往往比 `MIN` 本身的计算时间还要多。\n\n然而，宏不支持任何形式的类型安全，这损害了程序的质量，是一个很大的缺点。此外，调试一个复杂的宏并不是容易的。\n\
  \n如果你需要编写编写与类型无关但又类型安全的泛型函数的能力，你应该编写模板函数而不是宏函数。这些函数将在下一节中介绍。如果你需要提高性能，可以调用内联函数。（你已经介绍过如何使用\
  \ `inline` 关键字编写内联函数。请参阅第 7 中的列表 7.10。）\n\n| 应该做 | 不要不要做 |\n| --- | --- |\n| **应该**\
  \ 尽可能少地使用宏。**应该** 尽可能使用 `const` 变量代替宏。**应该** 记住宏不是类型安全的，且预处理器不进行类型检查。 | **不要** 忘记在宏函数定义用圆括号\
  \ `(...)` 将变量括起来。**不要** 忘记在代码中遍布大量的 `assert()` 语句；它们不会进入发布版本，并且对于提高你的代码质量很有帮助。 |\n\
  \n现在是时候学习使用模板的泛型编程实践了！\n\n## 模板简介\n\n模板无疑是 C++ 最强大的特性之一。\n\nC++ 中的模板允许你定义一种可以应用于不同类型对象的行为。这听起来与宏允许你做的事情非常相似；想一下用于确定两个数中较大值的简单宏\
  \ `MAX`。然而，宏是不类型安全的，而模板是类型安全的。\n\n## 模板声明语法\n\n你通过使用 `template` 关键字后跟类型参数列表来开始声明模板。该声明的格式为：\n\
  \n```\ntemplate <parameter list>\nfunction or class declaration\n```\n\n点击此处查看代码图像\n\
  \n关键字 `template` 标记了模板声明的开始，模板参数列表包含关键字 `typename`，它定义了模板参数 `objType`，使其成为模板所实例化的对象\
  \ `type` 的占位符：\n\n```\ntemplate <typename T1, typename T2 = T1>\nbool TemplateFunction(const\
  \ T1& param1, const T2& param2);\n\n// 一个模板类\ntemplate <typename T1, typename T2\
  \ = T1>\nclass MyTemplate\n{\nprivate:\n   T1 member1;\n   T2 member2;\n\npublic:\n\
  \   T1 GetMember1() {return member1; }\n   // ... 其他方法\n};\n```\n\n点击此处查看代码图像\n\n\
  你在这里看到的是一个模板函数和一个模板类，它们都接受两个模板参数 `T1` 和 `T2`，其中 `T2` 被赋予了默认类型 `T1`。\n\n## 模板声明的不同类型\n\
  \n模板声明可以是：\n\n* ■ 函数的声明或定义\n* ■ 类的声明或定义\n* ■ 类模板中成员函数或成员嵌套类的定义\n* ■ 类模板中静态数据成员的定义\n\
  * ■ 类模板内部嵌套类的静态数据成员的定义\n* ■ 类或类模板中成员模板的定义\n\n### 模板函数\n\n想象有一个能够自动适应不同类型参数的函数，而不需要你为每种类型定义重载版本。使用模板语法可以实现这样的函数！让我们分析一个示例模板声明，它等同于之前讨论的宏\
  \ `MAX`，返回两个提供的参数中的较大值：\n\n```\ntemplate <typename objType>\nconst objType& GetMax(const\
  \ objType& value1, const objType& value2)\n{\n    if (value1 > value2)\n       \
  \ return value1;\n    else\n        return value2;\n}\n```\n\n点击此处查看代码图像 示例用法：\n\
  \n```\nint num1 = 25;\nint num2 = 101;\nint maxVal = GetMax<int>(num1, num2);\n\
  double double1 = 3.14;\ndouble double2 = 3.1416;\ndouble maxVal = GetMax<double>(double1,\
  \ double2);\n```\n\n注意调用 `GetMax` 时使用的 `<int>`。它有效地将模板参数 `objType` 定义为 `int`。根据前面的代码，编译器生成了两个版本的函数，可视化如下：\n\
  \n```\nconst int& GetMax(const int& value1, const int& value2)\n{\n}\nconst double&\
  \ GetMax(const double& value1, const double& value2)\n{\n}\n```\n\n然而，实际上，模板函数并不一定需要类型指定符。因此，以下调用完全可行：\n\
  \n```\nint maxVal = GetMax(num1, num2);\n```\n\n编译器足够智能可以理解该模板函数用于整数类型。对于模板类，你需要如列表\
  \ 14.3 所示显式指定。\n\n### 列表 14.3 帮助计算两个值的模板函数 `GetMax`\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<string>\n 2: using namespace std;\n 3:\n 4: template <typename Type>\n\
  \ 5: const Type& GetMax(const Type& value1, const Type& value2)\n 6: {\n 7:    \
  \ if (value1 > value2)\n 8:         return value1;\n 9:     else\n 10:         return\
  \ value2;\n 11: }\n 12:\n 13: template <typename Type>\n 14: void DisplayComparison(const\
  \ Type& value1, const Type& value2)\n 15: {\n 16:    cout << \"GetMax(\" << value1\
  \ << \", \" << value2 << \") = \";\n 17:    cout << GetMax(value1, value2) << endl;\n\
  \ 18: }\n 19:\n 20: int main()\n 21: {\n 22:    int num1 = -101, num2 = 2011;\n\
  \ 23:    DisplayComparison(num1, num2);\n 24:\n 25:    double d1 = 3.14, d2 = 3.1416;\n\
  \ 26:    DisplayComparison(d1, d2);\n 27:\n 28:    string name1(\"Jack\"), name2(\"\
  John\");\n 29:    DisplayComparison(name1, name2);\n 30:\n 31:    return 0;\n 32:\
  \ }\n```\n\n\n\n\n此示例包含两个模板函数：第 4 到 11 行中的 `GetMax()`，它被第 13 到 18 行中的 `DisplayComparison()`\
  \ 调用。`main()` 函数在第 23、26 和 29 行演示了如何将同一个模板函数重用用于非常完全不同的数据类型：`integer`、`double` 和\
  \ `std::string`。这些模板函数不仅是可重用的（就像它们的宏对应项一样），而且更易编程和维护，并且是类型安全的。\n\n注意，你也可以使用显式类型调用\
  \ `DisplayComparison`：\n\n```\n23:   DisplayComparison<int>(num1, num2);\n```\n\n\
  点击此处查看代码图片\n\n然而，在调用模板函数时，这样做是不必要的。你不需要指定模板参数类型，因为编译器能够自动推断。但是，在使用模板类时，你确实需要指定类型。\n\
  \n### 模板与类型安全\n\nListing 14.3 中的模板函数 `DisplayComparison()` 和 `GetMax()` 是类型安全的。这意味着它们不允许像下面这样的无意义的调用：\n\
  \n```\nDisplayComparison(num1, name1);\n```\n\n点击此处查看代码图片\n\n这样的调用会导致导致编译失败。\n\n\
  ### 模板类\n\nLesson 9 “类与对象”教过你，类是编程单元，封装了某些属性以及操作这些属性的方法。属性通常是私有成员，例如 `Human` 类中的\
  \ `int age`。类是设计蓝图，而类在现实世界中的表示是该类的一个对象。因此，`Tom` 可以被看作 `Human` 类的一个对象，其属性 `age` 包含值\
  \ `15`。看起来在这种情况下，年龄是以年为单位提供的。如果你由于应用程序特有的某些原因需要将年龄存储为自出生以来的秒数，那么 `int` 可能是不够的。为了安全起见，你可能想使用\
  \ `long long`。这正是模板类大显身手的地方。模板类是 C++ 类的模板化版本；它们是蓝图的蓝图。在使用模板类时，你可以选择你正在为哪个“类型”特化类。这使你能够创建某些模板参数\
  \ `Age` 为 `long long` 的人类，某些为 `int`，另一些 `Age` 为类型为 `short` 的整数。\n\n一个使用单个模板参数 `T`\
  \ 来持有类型为 `T` 的成员变量的简单模板类可以定义如下：\n\n```\ntemplate <typename T>\nclass HoldVarTypeT\n\
  {\nprivate:\n   T value;\n\npublic:\n   void SetValue  (const T& newValue) { value\
  \ = newValue; }\n   T& GetValue() {return value;}\n};\n```\n\n点击此处查看代码图片\n\n变量 `value`\
  \ 的类型是 `T`，而 `T` 在模板使用时被解析——即在模板被*实例化*时。所以，让我们来看这个模板类的示例用法：\n\n```\nHoldVarTypeT<int>\
  \ holdInt;  // 为 int 进行模板实例化\nholdInt.SetValue(5);\ncout << \"The value stored is:\
  \ \" << holdInt.GetValue() << endl;\n```\n\n点击此处查看代码图片\n\n此示例展示了如何使用此模板类持有并检索 `int`\
  \ 类型的对象；也就是说，`Template` 类为类型为 `int` 的模板参数进行了实例化。你可以使用相同的类以类似的方式处理字符串：\n\n```\nHoldVarTypeT<string>\
  \ holdStr;\nholdStr.SetValue(\"Sample string\");\ncout << \"The value stored is:\
  \ \" << holdStr.GetValue() << endl;\n```\n\n点击此处查看代码图片\n\n因此，模板类为类定义了一种模式，并帮助在模板可能实例化的不同数据类型上实现该模式。\n\
  \n**提示**\n\n模板类可以使用除 `int` 等简单类型或标准模板库提供的类来实例化。你可以使用你定义的类来实例化模板。例如，当你将定义模板类 `HoldVarTypeT`\
  \ 的代码添加到 Lesson 9 中的 Listing 9.1 中时，你可以通过在 `main()` 之后添加以下代码来为 `Human` 类实例化模板：\n\
  \n```\nHoldVarTypeT<Human> holdHuman;\n\nholdHuman.SetValue(firstMan);\n\nholdHuman.GetValue().IntroduceSelf();\n\
  ```\n\n点击此处查看代码图片\n\n### 使用多个参数声明模板\n\n你可以扩展模板参数列表以声明多个参数，用逗号隔开。因此，如果你想声明一个泛型类来持有一对可以可以是不同类型的对象，可以使用如下示例所示的结构来实现（该示例显示了一个带有两个模板参数的模板类）：\n\
  \n```\ntemplate <typename T1, typename T2>\nclass HoldPair\n{\nprivate:\n    T1\
  \ value1;\n    T2 value2;\npublic:\n    HoldPair(const T1& val1, const T2& val2)\n\
  \    {\n        value1 = val1;\n        value2 = val2;\n    }\n};\n```\n\n在此示例中，`HoldPair`\
  \ 使用两个模板参数 `T1` 和 `T2`。你可以使用该类来处理相同类型或不同类型的对象，如此处所示：\n\n```\nHoldPair<int, int>\
  \ pairInts(1, 2);\nHoldPair<int, string> pairStr(1, \"two\");\n```\n\n### 带有默认参数的模板\n\
  \n你可以修改之前的 `HoldPair` 版本，将 `int` 作为默认参数：\n\n```cpp\ntemplate <typename T1, typename\
  \ T2=int>\nclass HoldPair\n...\n```\n\n这与定义值的函数类似，不同在于在这种情况下，你定义的是*类型*。\n\n```\n\
  HoldPair<> pairInts(6, 10);\n```\n\n### 模板类：`HoldPair`\n\n是时候进一步开发到为止的 `HoldPair`\
  \ 模板版本了。查看 Listing 14.4。\n\n**输入**\n\nListing 14.4 带有成员属性的模板类\n\n```\n#include<iostream>\n\
  using namespace std;\n\n// 模板 int & double\ntemplate <typename T1, typename T2=double>\n\
  class HoldPair\n{\nprivate:\n    T1 value1;\n    T2 value2;\npublic:\n    HoldPair(const\
  \ T1& val1, const T2& val2) // 构造函数\n    {\n        value1 = val1;\n        value2\
  \ = val2;\n    }\n\n    // 访问器函数\n    const T1& GetFirstValue() const\n    {\n \
  \      return value1;\n    }\n\n    const T2& GetSecondValue() const\n    {\n  \
  \     return value2;\n    }\n};\n\nint main ()\n{\n    HoldPair<> pairIntDbl (300,\
  \ 10.09);\n    HoldPair<short,const char*>pairShortStr(25,\"Learn templates, love\
  \ C++\");\n\n    cout << \"The first object contains -\" << endl;\n    cout << \"\
  Value 1: \" << pairIntDbl.GetFirstValue() << endl;\n    cout << \"Value 2: \" <<\
  \ pairIntDbl.GetSecondValue() << endl;\n\n    cout << \"The second object contains\
  \ -\" << endl;\n    cout << \"Value 1: \" << pairShortStr.GetFirstValue() << endl;\n\
  \    cout << \"Value 2: \" << pairShortStr.GetSecondValue() << endl;\n\n    return\
  \ 0;\n}\n```\n\n**输出**\n\n```\nThe first object contains -\nValue 1: 300\nValue\
  \ 2: 10.09\nThe second object contains -\nValue 1: 25\nValue 2: Learn templates,\
  \ love C++\n```\n\n\n\n\n```\n第一个对象包含 -\nValue 1: 300\nValue 2: 10.09\n第二个对象包含 -\n\
  Value 1: 25\nValue 2: 学习模板，热爱 C++\n```\n\n点击此处查看代码图像\n\n### 分析\n\n这个简单的程序说明了如何声明模板类\
  \ `HoldsPair`，以存储一对依赖于模板参数列表的类型的值。第 4 行包含一个模板参数列表，定义了两个模板参数 `T1` 和 `T2`，默认类型分别为\
  \ `int` 和 `double`。访问器函数 `GetFirstValue()` 和 `GetSecondValue()` 可用于查询对象所持的值。注意 `GetFirstValue`\
  \ 和 `GetSecondValue` 如何根据模板实例化的语法进行调整，以返回适当的对象类型。你已经成功在 `HoldsPair` 中定义了一个模式，并可以重用该模式为不同的变量类型提供相同的逻辑。因此，模板增加了代码的可重用性。\n\
  \n### 模板实例化与特化\n\n模板类是类的蓝图，因此在以某种形式使用之前，它对编译器来说并不真实存在。也就是说，从编译器的角度来看，你定义但没有使用的模板类只是被被忽略的代码。然而，你可以通过像这样提供模板参数来*实例化*一个模板类，例如\
  \ `HoldsPair`：\n\n```\nHoldsPair<int, double> pairIntDbl;\n```\n\n在这里，你正在指示编译器使用模板为你创建一个类，并为指定为模板参数的类型（在本例中为\
  \ `int` 和 `double`）对其进行实例化。因此，在模板的情况下，*实例化*是指使用一个或多个模板参数创建特定类型的行为或过程。\n\n另一方面，可能会出现某些情况要求你在使用特定类型实例化时，显式地定义模板的（不同）行为。在这种情况下，你为该类型对模板（或其行为）进行特化。模板类\
  \ `HoldsPair` 在使用类型为 `int` 的模板参数实例化时的特化形式如下：\n\n```\ntemplate<> class HoldsPair<int,\
  \ int>\n{\n   //在此处编写实现代码\n};\n```\n\n点击此处查看代码图像\n\n不言说，特化模板的代码必须遵循模板定义。列表 14.5\
  \ 是模板特化的示例，展示了特化版本与它所特化的模板之间有多大的差异。\n\n### 输入\n\n列表 14.5 展示模板特化\n\n```\n 0: #include<iostream>\n\
  \ 1: using namespace std;\n 2:\n 3: template <typename T1 = int, typename T2 = double>\n\
  \ 4: class HoldsPair\n 5: {\n 6: private:\n 7:    T1 value1;\n 8:    T2 value2;\n\
  \ 9: public:\n10:    HoldsPair(const T1& val1, const T2& val2) // 构造函数\n11:    \
  \   : value1(val1), value2(val2) {}\n12:\n13:    // 访问函数\n14:    const T1& GetFirstValue()\
  \ const;\n15:    const T2& GetSecondValue() const;\n16: };\n17:\n18: // 在此处对类型 int\
  \ & int 对 HoldsPair 进行特化\n19: template<> class HoldsPair<int, int>\n20: {\n21: private:\n\
  22:    int value1;\n23:    int value2;\n24:    string strFun;\n25: public:\n26:\
  \    HoldsPair(const int& val1, const int& val2) // 构造函数\n27:       : value1(val1),\
  \ value2(val2) {}\n28:\n29:    const int & GetFirstValue() const\n30:    {\n31:\
