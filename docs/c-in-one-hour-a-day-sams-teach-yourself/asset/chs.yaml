  \n\n\n## 3. 为 `Date` 类定义移动构造函数和移动赋值运算符是否有意义？\n\n#### 练习题\n\n1. 为 `Date` 类编写一个转换运算符，将该类持有的日期转换为一个整数。\n\
  2. 为 `DynamicFloats` 类编写一个移动构造函数和移动赋值运算符，该类以私有成员 `float*` 的形式封装了一个动态分配的数组。\n\n##\
  \ 第 13 节\n\n### 转换运算符（Casting Operators）\n\n*转换（*Casting*）是一种机制，程序员可以通过它可以临时或永久地改变编译器解释对象的方式。（程序员并没有改变对象本身，只是简单地改变了对象的*解释*。）改变对象解释方式的运算符被称为*转换运算符*（casting\
  \ operators）。\n\n在本节中，你将学习到：\n\n* 转换运算符的必要性\n* 为什么 C 风格的转换不再流行\n* 四种 C++ 转换运算符\n\
  * 向上转换（upcasting）和向下转换（downcasting）的概念\n* 为什么不强烈建议使用 C++ 转换运算符\n\n### 转换的必要性\n\n\
  在由由良好的良好的 C++ 应用程序构成的完美类型安全且类型强大的世界中，是不需要转换或转换运算符的。然而我们我们在一个模块可能由使用不同环境的不同人员编写的世界里。新编写的代码需要与旧代码和库协同工作。为了使这种互操作性成为可能，需要指示编译器以使应用程序正确编译和运行的方式来解释数据。这种互操作性是通过转换运算符来实现的。\n\
  \n让我们来看一个真实世界的例子。C++ 编译器支持 `bool` 作为原生类型，但它们需要支持链接到多年前用 C 语言编写的库。这些旧代码和库通常使用整数类型来存储布尔数据，因为当时的编译器并不原生支持\
  \ `bool` 类型。那时的布尔类型类似于：\n\n```cpp\ntypedef unsigned short BOOL;\n```\n\n一个返回布尔数据的函数声明如下：\n\
  \n```cpp\nBOOL IsX ();\n```\n\n使用旧库的新型 C++ 应用程序程序员需要让其编译器原生支持的 `bool` 数据类型与库返回的\
  \ `BOOL` 数据类型匹配。使这种互操作性工作的方法是使用转换：\n\n```\nbool Result = (bool)IsX(); // C 风格转换将\
  \ BOOL 解释为 bool\n```\n\n点击此处查看代码图像\n\nC++ 的演变导致了 C++ 转换运算符的出现，并继续对旧的 C 风格转换运算符的支持。你需要理解这两种转换风格，因为今天的世界同时都在使用它们。\n\
  \n### 为什么 C 风格转换不受某些 C++ 程序员的欢迎\n\n类型安全是增加 C++ 编程质量的属性之一。大多数 C++ 编译器不会允许你这样做：\n\n\
  ```cpp\nchar* staticStr = \"Hello World!\";\nint* intArray = staticStr;  // 错误：无法将\
  \ char* 转换为 int*\n```\n\n点击此处查看代码图像\n\n—而且完全如此！\n\n尽管如此，编译器需要向后兼容以支持旧代码；因此，它们允许转换。通过这样做，它们允许了如下代码：\n\
  \n```cpp\nint* intArray = (int*)staticStr; // 解决了一个问题，却创建了另一个\n```\n\n点击此处查看代码图像\n\
  \n这种 C 风格转换*强制*编译器将目标解释为程序员想要赋值的类型。转换抑制了编译错误，即使类型之间完全不兼容。在这种情况下，程序员实际上封嘴了编译器并强制它服从。在将\
  \ `char*` 解释为 `int*` 时，编译器并没有执行任何转换。换句话说，在这个中，C 风格转换损害了类型安全并破坏了程序的质量。\n\n### C++\
  \ 转换运算符\n\n尽管转换有缺点，但转换的概念并不能被丢弃。在许多情况下，转换是必要的。C++ 提供了特定的新的转换运算符。\n\n四种 C++ 转换运算符为：\n\
  \n* `static_cast`\n* `dynamic_cast`\n* `reinterpret_cast`\n* `const_cast`\n\n转换运算符的使用语法是一致的：\n\
  \n```cpp\ndestination_type result = cast_operator<destination_type>(object);\n```\n\
  \n点击此处查看代码图像\n\n### 使用 `static_cast`\n\n`static_cast` 用于在相关类型之间转换指针，并执行原本会自动或隐式发生的类型转换。对于指针来说，`static_cast`\
  \ 执行基本检查以确保指针被转换为相关类型。相比 C 风格转换，这是一种改进，因为 `static_cast` 不允许转换为完全无关的类型。如下所示：\n\n\
  ```cpp\nBase* objBase = new Derived();\nDerived* objDer = static_cast<Derived*>(objBase);\
  \ // 正确！\n\n// Unrelated 与 Base 无\nUnrelated* notRelated = static_cast<Unrelated*>(objBase);\
  \ // 错误\n```\n\n点击此处查看代码图像\n\n注意\n\n将 `Derived*` 转换为 `Base*` 称为向上转换（upcasting），可以在不使用显式运算符的情况下完成：\n\
  \n```cpp\nDerived objDerived;\n\nBase* objBase = &objDerived; // 正确！\n```\n\n点击此处查看代码图像\n\
  \n将 `Base*` 转换为 `Derived*` 称为向下转换（downcasting），可以在不使用显式转换的情况下完成：\n\n```cpp\nDerived\
  \ objDerived;\n\nBase* objBase = &objDerived; // 向上转换，正确\n\nDerived* objDer = objBase;\
  \ // 错误：向下转换，需要显式转换\n```\n\n点击此处查看代码图像\n\n然而，请注意 `static_cast` 只验证指针类型是相关的。它*没有*执行任何运行时检查。因此，使用\
  \ `static_cast`，程序员仍然可以逃过这个错误：\n\n```cpp\nBase* objBase = new Base();\nDerived*\
  \ objDer = static_cast<Derived*>(objBase); // 仍然错误！\n```\n\n点击此处查看代码图像\n\n在这里，`objDer`\
  \ 指向 `Base` 类型而不是 `Derived` 类型。`static_cast` 通过验证涉及的类型是相关的来执行编译时检查——它们确实是——因此允许了转换。它没有执行运行时检查来确保所指向的对象是\
  \ `Derived` 类型。使用此指针 `objDer` 调用派生类方法 `objDer->DerivedFunction()` 将通过编译，但在执行时无疑产生意想不到的结果。\n\
  \n除了有助于向上转换或向下转换外，`static_cast` 在许多情况下还可以帮助将隐式转换显式化，并引起程序员或读者的注意：\n\n```cpp\ndouble\
  \ Pi = 3.14159265;\nint num = static_cast<int>(Pi); // 将原本隐式的转换显式化\n\n点击此处查看代码图像\n\
  \n\n\n\n\n在这段代码中，`num = Pi` 同样有效且产生相同的效果。然而，使用 `static_cast` 可以让读者注意到转换的本质，并告知（对于了解\
  \ `static_cast` 的人）编译器已经根据编译时可用的信息进行了必要的调整，以执行所需的类型转换。当你使用用 `explicit` 关键字声明的转换操作符或构造函数时，你也需要使用\
  \ `static_cast`。关于通过 `explicit` 关键字避免隐式转换，可以在第 9 节“类与对象”以及第 12 节“运算符类型与运算符重载”中讨论。\n\
  \n### 使用 `dynamic_cast` 和运行时类型识别\n\n动态转换（Dynamic casting）正如其名，是静态转换的相反面，它实际上是在运行时执行转换——即在应用程序执行时进行转换。可以通过检查\
  \ `dynamic_cast` 操作的结果来判断转换尝试是否成功。`dynamic_cast` 运算符的典型用法语法如下：\n\n```cpp\ndestination_type*\
  \ Dest = dynamic_cast<class_type*>(Source);\n\nif(Dest)    // 检查转换操作是否成功\n    Dest->CallFunc();\n\
  ```\n\n点击此处查看代码图像\n\n例如：\n\n```cpp\nBase* objBase = new Derived();\n\n// 执行下转型\n\
  Derived* objDer = dynamic_cast<Derived*>(objBase);\n\nif(objDer)    // 检查转换是否成功\n\
  \    objDer->CallDerivedMethod();\n```\n\n点击此处查看代码图像\n\n如简短示例所示，给定一个指向基类对象的指针，程序员可以利用\
  \ `dynamic_cast` 在继续使用该指针之前，验证其所指向的目标对象的类型。请注意，在段代码段中，目标对象显而易见是一个派生类型。因此，该示例仅供演示。然而，并非并非如此——例如当将一个\
  \ `Derived*` 类型的指针传递给接受 `Base*` 类型的函数时。该函数可以使用指向基类指针的 `dynamic_cast` 来检测类型，然后执行特定于所检测类型的操作。因此，`dynamic_cast`\
  \ 有助于在运行时确定类型，并使得在安全时可以使用转换后的指针。参见列表 13.1，该列表使用了与基类 `Fish` 相关的熟悉的类层次结构 `Tuna` 和\
  \ `Carp`，其中函数 `DetectFishType()` 动态检测一个 `Fish*` 是 `Tuna*` 还是 `Carp*`。\n\n### 注意\n\
  \n这种在运行时识别对象类型的机制被称为*运行时类型识别*（*RTTI*）。\n\n### 输入\n\n列表 13.1 使用动态转换判断 `Fish` 对象是\
  \ `Tuna` 还是 `Carp`\n\n```cpp\n 0: #include<iostream>\n 1: using namespace std;\n\
  \ 2:\n 3: class Fish\n 4: {\n 5: public:\n 6:    virtual void Swim()\n 7:    {\n\
  \ 8:       cout << \"Fish swims in water\" << endl;\n 9:    }\n10:\n11:    // 基类应该始终有虚析析构函数\n\
  \ 12:    virtual ~Fish() {}\n 13: };\n 14:\n 15: class Tuna: public Fish\n 16: {\n\
  \ 17: public:\n 18:    void Swim()\n 19:    {\n 20:       cout << \"Tuna swims real\
