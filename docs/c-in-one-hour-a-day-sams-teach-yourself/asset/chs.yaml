  \ << \" x \" << num2 << \" = \" << num1 * num2 << endl;\n14:       cout << num1\
  \ << \" + \" << num2 << \" = \" << num1 + num2 << endl;\n15:\n16:       cout <<\
  \ \"Press x to exit(x) or any other key to recalculate\" << endl;\n17:       cin\
  \ >> userSelection;\n18:    } while (userSelection != 'x');\n19:\n20:    cout <<\
  \ \"Goodbye!\" << endl;\n21:\n22:    return 0;\n23: }\n```\n\n点击此处查看代码图像\n\n###\
