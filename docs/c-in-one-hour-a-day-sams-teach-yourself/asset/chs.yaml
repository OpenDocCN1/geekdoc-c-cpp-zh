  \n列表 8.16 与列表 8.15 函数相同，区别在于在第 6 行使用了 `new(nothrow)`。\n\n### 什么使得引用有用？\n\n引用让你能够与它们初始化的内存位置进行工作。这使得引用在编写函数时特别有用。正如你在第\
  \ 7 节“使用函数组织代码”中所学习到的那样，一个典型的函数声明如下：\n\n```\nReturnType DoSomething(Type parameter);\n\
  ```\n\n\n\n\n\n点击此处查看代码图片\n\n函数 `DoSomething()` 的调用方式如下：\n\n```\nReturnType result\
  \ = DoSomething(argument); // 函数调用\n```\n\n点击此处查看代码图片\n\n这段代码会导致 `argument` 被拷贝到\
  \ `parameter` 中，然后由函数 `DoSomething()` 使用。如果所涉及的 `argument` 消耗大量内存，这个复制步骤可能会产生开销。如果能够避免或消除复制步骤，并让函数直接在调用者栈上的数据上运行，那将是理想的。引用允许你实现这一点。\n\
  \n不包含复制步骤的函数版本如下：\n\n```\nReturnType DoSomething(Type& parameter) // 注意引用符号 &\n\
  {\n   // ...code\n   return value;\n}\n```\n\n点击此处查看代码图片\n\n该函数的调用方式如下：\n\n```\n\
  ReturnType result = DoSomething(argument);\n```\n\n点击此处查看代码图片\n\n由于参数是通过引用传递的，`parameter`\
  \ 并不是 `argument` 的拷贝，而是它的别名，类似于列表 8.17 中的 `ref1`。此外，接受引用作为参数的函数可以可选地使用引用参数来返回结果。\n\
  \n### 注意\n\n从 C++17 开始，编译器已经保证了复制消除（Copy elision）。为了理解这意味着什么，让我们再次查看这段代码：\n\n```\n\
  ReturnType result = DoSomething(argument);\n```\n\n点击此处查看代码图片\n\n在正常情况下，函数 `DoSomething()`\
  \ 的返回值会被拷贝到 `result` 中。这是一个不必要的步骤，如果 `ReturnType` 是一个数据库表（例如），这可能是一个非常昂贵的步骤。从 C++17\
  \ 开始，这种不必要的复制步骤默认会被消除（即删除）。\n\n请参列表 8.18 以了解函数如何使用引用代替返回值。\n\n#### 输入 ▼\n\n列表 8.18\
  \ 通过引用参数返回平方结果的函数\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n\
  3: void Square(int& number)\n 4: {\n 5:    number *= number;\n 6: }\n 7:\n 8: int\
  \ main()\n 9: {\n10:    cout << \"Enter a number you wish to square: \";\n11:  \
  \  int number = 0;\n12:    cin >> number;\n13:\n14:    Square(number);\n15:    cout\
  \ << \"Square is: \" << number << endl;\n16:\n17:    return 0;\n18: }\n```\n\n点击此处查看代码图片\n\
  \n#### 输出 ▼\n\n```\nEnter a number you wish to square: 5\nSquare is: 25\n```\n\n\
  点击此处查看代码图片\n\n#### 分析 ▼\n\n执行平方操作的函数位于第 3 行到第 6 行。注意它是如何通过引用参数接收待平方的数字并返回结果的。如果你忘记将参数\
  \ `number` 标记为引用（`&`），则结果将无法到达调用函数 `main()`，因为 `Square()` 将在 `number` 的局部拷贝上执行操作，而该拷贝在函数退出时会被销毁。通过使用引用，你确保了\
  \ `Square()` 在 `main()` 中 `number` 定义所在的地址空间内操作。因此，即使在函数 `Square()` 退出后，操作结果依然依然可用。\n\
  \n在这个示例中，`Square()` 修改了调用者发送的数字。如果你同时需要两个值（原始值和平方值），可以让函数接受两个参数：一个包含输入，另一个提供平方值。\n\
  \n### 在引用上使用 `const` 关键字\n\n你可能需要某些不允许更改所别名原始变量值的引用。在声明此类引用时使用 `const` 是实现目标的方法：\n\
  \n```\nint original = 30;\nconst int& constRef = original;\nconstRef = 40; // 不允许：不能更改\
  \ original 中的值\nint& ref2 = constRef; // 不允许：ref2 不是 const\nconst int& constRef2\
  \ = constRef; // OK，类型相同\n```\n\n点击此处查看代码图片\n\n#### 通过引用向函数传递参数\n\n引用的主要优势之一是它们允许被调用函数直接在未从调用函数拷贝的参数上工作，从而显著提高性能。然而，由于被调用函数直接在调用者栈上的参数工作，因此确保被调用函数无法更改调用者端变量的值通常很重要。定义为\
  \ `const` 的引用可以帮助你这一点，正如列表 8.19 所示。`const` 引用参数不能作为左值，因此任何对其赋值的尝试都会导致编译失败。\n\n#####\
  \ 输入 ▼\n\n列表 8.19 使用 `const` 引用确保调用函数无法修改传递的值\n\n```\n 0: #include<iostream>\n 1:\
  \ using namespace std;\n 2:\n3: void Square(const int& number, int& result)\n 4:\
  \ {\n 5:    result = number*number;\n 6: }\n 7:\n 8: int main()\n 9: {\n10:    cout\
  \ << \"Enter a number you wish to square: \";\n11:    int number = 0;\n12:    cin\
  \ >> number;\n13:\n14:    int square = 0;\n15:    Square(number, square);\n16: \
  \   cout << \"Square of: \" << number << \" = \" << square << endl;\n17:\n18:  \
  \  return 0;\n19: }\n```\n\n点击此处查看代码图片\n\n##### 输出 ▼\n\n```\nEnter a number you\
  \ wish to square: 5\nSquare of: 5 = 25\n```\n\n点击此处查看代码图片\n\n#### 分析 ▼\n\n\n\n\n\
  \n```cpp\n int* pointToAnInt = new int;\n  int* pCopy = pointToAnInt;\n```\n\n点击此处查看代码图像\n\
  \n### 我不是应该对两者都调用 `delete` 来确保释放使用的内存，这样更好吗？\n\n**A** 这样做是错误的。你只允许对 `new` 返回的地址调用一次\
  \ `delete`。此外，理想情况下，你应该避免让两个指针指向同一个地址，因为对其中任何一个指针执行 `delete` 都会使另一个失效。你的程序编写方式也不应该让你对所用指针的有效性产生任何不确定性。\n\
  \n### Q 我什么时候应该使用 `new(nothrow)`？\n\n**A** 如果你不想处理 `std::bad_alloc` 异常，可以使用运算符 `new`\
  \ 的 `nothrow` 版本，它在请求分配失败时会返回 `NULL`。如果使用 `nothrow` 版本，请记住通过检查 `NULL` 来验证指针的有效性。\n\
  \n### Q 我可以使用以下两种方法调用函数来计算面积：\n\n```cpp\n void CalculateArea (const double* const\
  \ ptrRadius, double* const ptrArea);\n  void CalculateArea (const double& radius,\
  \ double& area);\n```\n\n点击此处查看代码图像\n\n### 我应该倾向于哪种变体？\n\n**A** 使用后一种使用引用的方法，因为引用不会失效，而指针可以。此外，它更简单。\n\
  \n### Q 我有一个指针：\n\n```cpp\n int number = 30;\n  const int* pointToAnInt = &number;\n\
  ```\n\n点击此处查看代码图像\n\n### 我理解由于 `const` 声明，我无法通过指针 `pointToAnInt` 改变 `number` 的值。可以将\
  \ `pointToAnInt` 赋值给一个非 const 指针，然后使用它来操作整数 `number` 包含的值吗？\n\n**A** 不，你不能改变指针的\
  \ `const` 属性：\n\n```cpp\n int* pAnother = pointToAnInt; // 错误\n```\n\n点击此处查看代码图像\n\
  \n### Q 为什么我要费劲通过引用向函数传递值？\n\n**A** 只要它不显著影响你的程序性能，就不需要这样做。然而，如果你的函数参数接收的是非常重的对象（也就是说，字节数很大），那么按值传递将是一个非常昂贵的操作。你的函数调用使用引用会变得高效得多。记住慷慨地使用\
  \ `const`，除非函数需要将结果存储在变量中。\n\n### Q 这两个声明之间有什么什么区别？\n\n```cpp\n int myNumbers[100];\n\
  \  int* myArrays[100];\n```\n\n点击此处查看代码图像\n\n**A** `myNumbers` 是一个整数数组——也就是说，`myNumbers`\
  \ 是一个指向内存位置的指针，该位置持有 100 个整数并指向索引为 0 的第一个。它是以下代码的静态替代方案：\n\n```cpp\n int* myNumbers\
  \ = new int [100]; // 动态分配数组\n  // 使用 myNumbers\n  delete[] myNumbers;\n```\n\n\
  点击此处查看代码图像\n\n另一方面，`myArrays` 是一个包含 100 个指针的数组，每个指针都可以指向一个整数或一个整数数组。\n\n### 工作坊\n\
  \n工作坊提供了测试题来帮助你巩固对所涵盖材料的理解，并提供了练习来提供使用学习知识的机会。在检查附录 E 中的答案之前，尝试回答测试题和练习题，并在继续下一节之前确保理解了答案。\n\
