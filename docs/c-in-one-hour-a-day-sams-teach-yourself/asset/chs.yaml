  \ 18:\n 19:    // 在开头插入元素...\n 20:    linkInts1.insert(linkInts1.begin(), 2);\n\
  \ 21:    linkInts1.insert(linkInts1.begin(), 1);\n 22:\n 23:    // 在结尾插入一个元素...\n\
