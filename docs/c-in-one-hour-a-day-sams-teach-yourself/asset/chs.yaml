  \n本节稍后出现的列表 12.9 也演示了与字符串类一起使用的转换操作符。\n\n#### 解引用操作符 (`*`) 和成员选择操作符 (`->`)\n\n解引用操作符\
  \ (`*`) 和成员选择操作符 (`->`) 在智能指针类的编程中被频繁使用。智能指针是封装普通指针并简化内存管理的工具类。\n\n\n\n\n\n表 12.2\
  \ 列出了在 C++ 应用程序中可以被重载或重新定义的二元运算符。\n\n| 运算符符号 | 名称 |\n| --- | --- |\n| , | 逗号 |\n\
  | != | 不等于 |\n| % | 取模 |\n| %= | 取模/赋值 |\n| & | 按位与 |\n| && | 逻辑与 |\n| &= | 按位与/赋值\
  \ |\n| * | 乘法 |\n| *= | 乘法/赋值 |\n| + | 加法 |\n| += | 加法/赋值 |\n| - | 减法 |\n| -= |\
  \ 减法/赋值 |\n| ->* | 成员指针指针选择 |\n| / | 除法 |\n| /= | 除法/赋值 |\n| < | 小于 |\n| << | 左移\
  \ |\n| <<= | 左移/赋值 |\n| <= | 小于或等于 |\n| = | 赋值、拷贝赋值和移动赋值 |\n| == | 等于 |\n| > | 大于\n\
  | >= | 大于或等于 |\n| >> | 右移 |\n| >>= | 右移/赋值 |\n| ^ | 异或 |\n| ^= | 异或/赋值 |\n| | |\
  \ 按位包含或 |\n| |= | 按位包含或/赋值 |\n| || | 逻辑或 |\n| [] | 下标运算符 |\n\n**表 12.2** 可重载的二元运算符\n\
  \n### 二元加法 (`a+b`) 和减法 (`a-b`) 运算符\n\n与递增/递减运算符类似，二元加号和减号在定义后，可以允许你从一个实现了这些运算符的类对象中增加或减去受支持的数据类型的值。再次查看日历\
  \ `Date` 类。虽然你已经实现了递增 `Date` 的功能，使其让日历向前移动一天，但你仍然不支持让它（例如）向前移动五天。为了实现这一点，你需要实现二元运算符（`+`），如列表\
  \ 12.4 中的代码所示。\n\n#### 输入 ▼\n\n列表 12.4 具有二元加法运算符的日历 `Date` 类\n\n```cpp\n 0: #include<iostream>\n\
