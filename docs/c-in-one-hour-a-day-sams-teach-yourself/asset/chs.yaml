  \n### `std::exception` 类\n\n在 Listing 28.2 中捕获 `std::bad_alloc` 时，你实际上捕到了由 `new`\
  \ 抛出的 `std::bad_alloc` 类对象。`std::bad_alloc` 是继承自 C++ 标准类 `std::exception`，该类声明在头文件\
  \ `<exception>` 中。\n\n`std::exception` 是以下重要异常的基类：\n\n*   `bad_alloc`: 当使用 `new`\
  \ 请求内存失败时抛出。\n*   `bad_cast`: 当你尝试转换错误的类型（即没有继承关系的类型）时，由 `dynamic_cast` 抛出。\n* \
  \  `ios_base::failure`: 由 `ostream` 库中的函数和方法抛出。\n\n`std::exception` 类作为基类，支持非常重要的方法\
  \ `what()`，它提供了关于导致异常性质的详细信息。在 Listing 28.2 中捕获 `std::bad_alloc` 时，你实际上捕到了由 `new`\
  \ 抛出的 `std::bad_alloc` 类对象。`std::bad_alloc` 是一个继承自 C++ 标准类 `std::exception`，该类声明在头文件\
  \ `<exception>` 中。\n\n`std::exception` 是以下重要异常的基类：\n\n*   `bad_alloc`: 当使用 `new`\
