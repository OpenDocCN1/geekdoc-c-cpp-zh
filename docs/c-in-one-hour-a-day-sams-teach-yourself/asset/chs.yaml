  3. **3** 你应该倾向私有继承还是组合？\n4. **4** `using` 关键字在继承层次结构中如何帮助你？\n5. **5** **找错：** 这段代码的问题是什么？\n\
  ```cpp\nvoid SomeFunc (Base value)\n{\n   // ...\n}\n```\n\n### 练习\n\n1. **1** 如\
