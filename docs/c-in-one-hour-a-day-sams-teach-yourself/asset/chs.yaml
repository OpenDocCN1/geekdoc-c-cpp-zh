  \ `446`，然后赋值回 `value`，依此类推。\n\n### 运算符优先级与结合性\n\n再看之前复杂的表达式：\n\n```\nint myNumber\
  \ = 10 + 20 - 5 << 2;\n```\n\n在评估此表达式的结果时，你需要使用表 5.7 所示的运算符优先级规则。因为乘法的优先级高于加法和减法，而这两者的优先级高于移位，你可以将前面的示例简化为：\n\
  \n```\nint myNumber = 300 + 20 - 25 << 2;\n```\n\n加法和减法的优先级高于移位，你可以进一步简化为：\n\n```\n\
  int myNumber = 295 << 2;\n```\n\n最后，你执行移位操作。知道左移 1 位会翻倍，因此左移 2 位会扩大四倍，你可以说该表达式的计算结果为\
  \ `295 * 4`，即 `1180`。\n\n**表 5.7** 运算符的优先级\n\n| 优先级 | 名称 | 结合性 |\n| :--- | :---\
  \ | :--- |\n| 1 | 作用域解析符 | 从右到左 |\n| 2 | 成员选择、下标、增/减、取反、非、一元负/加、取地址、`new`、`delete[]`、`delete`、类型转换、`sizeof`、`()`\
  \ | 从右到左 |\n| 3 | `*` | 从左到右 |\n| 4 | 乘、除、取模 | 从左到右 |\n| 5 | 加、减 | 从左到右 |\n| 6 |\
  \ 左移位、右移位 | 从左到右 |\n| 7 | C++20 三路比较 | 从左到右 |\n| 8 | 不等关系关系 | 从左到右 |\n| 9 | 等于关系\
  \ | 从左到右 |\n| 10 | 位与 | 从左到右 |\n| 11 | 位异或 | 从左到右 |\n| 12 | 位或 | 从左到右 |\n| 13 |\
  \ 逻辑与 | 从左到右 |\n| 14 | 逻辑或 | 从左到右 |\n| 15 | 三元条件运算符 | 从右到左 |\n| 16 | 赋值 | 从右到左 |\n\
  | 17 | 逗号 | 从左到右 |\n\n### 注意事项\n\n使用括号使代码易于阅读。\n\n之前的表达式是为了解释运算符优先级而故意写得很糟糕。它对编译器来说很容易理解，但你也应该编写人类也能读懂的代码。\n\
  \n之前的表达式这样写要好得多：\n\n\n\n\n\n```\nint myNumber = ((10 * 30) - (5 * 5) + 20) << 2;\
  \ // 1180\n```\n\n点击此处查看代码图像\n\n| 应该 (DO) | 避免 (DON’T) |\n| --- | --- |\n| **应该**使用括号来提高代码和表达式的可读性。**应该**使用正确的变量类型并确保你的代码永远不会发生溢出。**应该**理解所有的左值（例如变量）都可以作为右值，但并不是所有的右值（例如\
  \ `\"Hello World\"`）都可以作为左值。 | **不要**编写依赖于运算符优先级表的复杂表达式；你的代码也需要人类可读性。**不要**混淆 `++variable`\
  \ 和 `variable++`，或认为它们是相同的。在赋值语句中使用它们时，它们是不同的。 |\n\n### 总结\n\n在本节中，你学习了什么是 C++`语句`、表达式和运算符`。你学习了如何在\
  \ C++ 中执行加、减、乘、除等基本算术运算。你还概述了逻辑操作，如 `NOT`、`AND`、`OR` 和 `XOR`。你学习了 C++ 逻辑运算符 `!`、`&&`\
  \ 和 `||`，它们可以帮助你处理条件语句；以及位运算符，如 `~`、`&`、`|` 和 `^`，它们可以帮助你一次处理 1 位（bit）数据。\n\n你还学习了运算符优先级，以及使用括号编写人类也能理解的代码是有多么重要。你还查看了整数溢出以及为什么必须避免它。\n\
  \n### 问答\n\nQ 为什么在 `unsigned short` 占用内存更少且也能编译的情况下，某些程序仍使用 `unsigned int`？\n\n\
  **A** `unsigned short` 通常限制为 65,535，如果进行递增，它会溢出为 0。为了避免这种行为，良好的应用程序在不确定值是否会远低于此限制时，会选择\
  \ `unsigned int`。\n\nQ 我需要计算一个数字除以 3 后的两倍。你认为使用以下代码来实现此有什么问题吗？\n\n```\nint result\
  \ = Number / 3 << 1;\n```\n\n**A** 有！你为什么不简单地使用括号让这行代码对其他程序员更容易读呢？\n\nQ 我的应用程序将两个整数值\
  \ 5 和 2 相除：\n\n```\nint num1 = 5, num2 = 2;\nint result = num1 / num2;\n```\n\n\
  点击此处查看代码图像\n\n执行时，结果包含值 2。这不对吗？\n\n**A** 完全不对。整数并不是为了包含小数。因此，该操作的结果是 2 而不是 2.5。如果你期望的结果是\
  \ 2.5，请将所有数据类型改为 `float` 或 `double`，它们用于处理浮点（小数）运算。\n\n### 工作坊\n\n工作坊提供了测验题帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学内容的经验。在检查\
