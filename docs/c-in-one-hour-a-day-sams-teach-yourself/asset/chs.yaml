  \ = 9;\n     cout << \"The value at pointToAnInt: \" << *pointToAnInt;\n     delete\
  \ pointToAnInt;\n     return 0;\n  }\n```\n\n5. **5.** 这段代码有什么问题？\n\n```cpp\n #include<iostream>\n\
  \  using std;\n  int main()\n  {\n     int* pointToAnInt = new int;\n     int* pCopy\
  \ = pointToAnInt;\n     *pCopy = 30;\n     cout << *pCopy;\n     delete pCopy;\n\
