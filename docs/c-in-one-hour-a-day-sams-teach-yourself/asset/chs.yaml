  \ STL 动态数组类\n\n与静态数组不同，动态数组为程序员在存储数据方面提供了灵活性，不需要预先知道数据量。在本节中，你将学习：\n\n* `vector`\
  \ 的特性\n* 常见的 `vector` 操作\n* `vector` 的大小和容量\n* `vector` 类\n\n### `std::vector` 的特性\n\
  \n`vector` 是一个模板类，它提供了动态数组的灵活性，并具有以下特性：\n\n* 你可以在数组末尾添加元素，这取决于常数时间，这取决于数组的增长。\n\
  * 在数组末尾插入或删除元素所需的时间与元素数量成正比。\n* `vector` 内部是动态的，正如图 17.1 所示。\n\n**图 17.1** `vector`\
  \ 的内部。\n\n要使用 `std::vector` 类，请包含\n\n```cpp\n#include<vector>\n```\n\n### 常见的操作\n\
  \n`std::vector` 的行为和公共成员是由标准定义的。在第 14 节](#ch14.xhtml_ch14)中将学习的 `vector` 操作是标准支持的。\n\
  \n#### 实例化 `vector`\n\n`vector` 是一个模板类，需要根据模板实例化技术进行实例化。`vector` 的实例化需要指定要收集的元素类型：\n\
  \n```\nstd::vector<int> dynArray; // 整数数组\nstd::vector<float> dynFloatArray; //\
  \ 浮点数数组\nstd::vector<T> dynTArray; // T 数组\n```\n\n点击此处查看代码图像\n\n声明一个指向 vector 中元素的迭代器，你需要使用\n\
  \n```cpp\nstd::vector<int>::const_iterator elementInVec;\n```\n\n点击此处查看代码图像\n\n\
  如果你需要一个可以修改值或调用非 const 的迭代器，请使用 `iterator` 代替 `const_iterator`。\n\n`std::vector`\
  \ 提供的重载构造函数允许你指定实例化 vector 的元素数量及其初始值。你甚至可以使用部分 vector 来实例化另一个 vector。\n\n列表 17.1\
  \ 展示了几种实例化。\n\n##### 输入 ▼\n\n列表 17.1 实例化 `std::vector` 的方法：指定大小、指定初始值和复制值\n\n```\n\
  \ 0: #include<vector>\n 1:\n 2: int main()\n 3: {\n 4:    // 整数 vector\n 5:    std::vector<int>\
  \ integers;\n 6:\n 7:    // 使用列表初始化 vector\n 8:    std::vector<int> initVector{\
  \ 202, 2017, -1 };\n 9:\n10:   // 实例化一个包含 10 个元素的 vector（它仍然可以增长）\n11:    std::vector<int>\
  \ tenElements(10);\n12:\n13:   // 实例化一个包含 10 个元素、每个初始化为 90 的 vector\n14:    std::vector<int>\
  \ tenElemInit(10, 90);\n15:\n16:   // 将 vector 初始化为另一个的内容\n17:    std::vector<int>\
  \ copyVector(tenElemInit);\n18:\n19:   // 使用迭代器从另一个中取 5 个元素初始化 vector\n20:    std::vector<int>\
  \ partialCopy(tenElements.cbegin(),\n21:                     tenElements.cbegin()\
  \ + 5);\n22:\n23:    return 0;\n24: }\n```\n\n\n\n\n这段代码实现了类型 `int` 的 `vector` 类的模板特化；换句话说，它实例化了一个整数类型的\
  \ vector。这个名为 `integers` 的 vector 使用了第 5 行的默认构造函数，这在你不知道容器的最小尺寸需求时非常有用——也就是说即你不知道想在其中存储多少个整数。第二种实例化形式如第\
  \ 8 行所示，它使用了 C++11 引入的列表初始化（list initialization）概念，将 `initVector` 初始化三个元素，分别包含 `202`、`2017`\
  \ 和 `-1` 的值。\n\n第 11 行和第 14 行的 vector 实例化是在你知道你需要一个至少包含 10 个元素的 vector 时。请注意，这些实例化并没有限制容器可以增长到的尺寸，而是在初始化时设置了元素的数量。\n\
  \n最后，第 17 行和第 20 行演示了如何使用 vector 来实例化另一个 vector 的内容——也就是说，创建一个 `vector` 对象，使其成为另一个\
  \ vector 的拷贝或 vector 的一部分。这种构造也适用于所有的 STL 容器。最后一种形式是使用迭代器。`partialCopy` 包含了来自 `vecWithTenElements`\
  \ 的前五个元素。\n\n### 注意\n\n第四种构造方式仅适用于相同类型的对象。因此，你可以实例化 `vecArrayCopy`——使用另一个整数对象的 vector\
  \ 来实例化一个整数对象的 vector。如果其中一个是（例如）`float` 类型的 vector，代码将无法编译。\n\n### 使用 `push_back()`\
  \ 在 Vector 末尾插入元素\n\n在实例化一个整数 vector 后，显而易见的任务是向其中插入元素（整数）。vector 中的插入发生在数组的末尾，并使用成员函数\
  \ `push_back()` 将元素“推”到数组末尾：\n\n```\nvector<int> integers;  // 一个 int 类型的 vector\n\
  \n// 将示例整数插入 vector 中：\nintegers.push_back(50);\nintegers.push_back(1);\n```\n\n\
  点击此处查看代码图像\n\n列表 17.2 演示了使用 `push_back()` 向 `std::vector` 动态添加元素。\n\n#### 输入 ▼\n\
  \n列表 17.2 使用 `push_back()` 在 Vector 中插入元素\n\n```\n 0: #include<iostream>\n 1: #include<vector>\n\
  \ 2: using namespace std;\n 3:\n 4: int main()\n 5: {\n 6:    vector<int> integers;\n\
  \ 7:\n 8:    // 将示例整数插入 vector 中：\n 9:    integers.push_back(50);\n10:    integers.push_back(1);\n\
  11:    integers.push_back(987);\n12:    integers.push_back(1001);\n13:\n14:    cout\
  \ << \"The vector contains \";\n15:    cout << integers.size() << \" Elements\"\
  \ << endl;\n16:\n17:    return 0;\n18: }\n```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n```\n\
  The vector contains 4 Elements\n```\n\n#### 分析 ▼\n\n如第 9 行至第 12 行所示，`push_back()`\
  \ 是 `vector` 类的公共成员函数，用于在动态数组的末尾插入对象。注意函数 `size()`的使用，它返回 vector 中含有的元素数量。\n\n####\
  \ 列表初始化\n\nC++ 提供了 `std::initialize_list<>` 类，在支持该特性的情况下，它允许你像操作静态数组一样实例化并初始化容器中的元素。`std::vector`\
  \ 与大多数其他容器一样也支持列表初始化，允许你在一行内实例化一个带有元素的 vector（而不是像列表 17.2 那样需要很多行）：\n\n```\nvector<int>\
  \ integers = {50, 1, 987, 1001};\n// 或者使用：\nvector<int> vecMoreIntegers {50, 1,\
  \ 987, 1001};\n```\n\n点击此处查看代码图像\n\n#### 使用 `insert()` 在指定位置插入元素\n\n你使用 `push_back()`\
  \ 在 vector 的末尾插入元素。如果你需要在 vector 的中间插入元素怎么办？STL 容器（包括 `std::vector`）具有具有许多重载的 `insert()`\
  \ 函数。\n\n在其中重载中，你可以指定元素插入到序列中的位置：\n\n```\n// 在开头插入一个元素\nintegers.insert(integers.begin(),\
  \ 25);\n```\n\n点击此处查看代码图像\n\n在另一个重载中，你可以指定位置以及需要插入的具有特定元素的数量：\n\n```\n// 在末尾插入 2\
  \ 个值为 45 的元素\nintegers.insert(integers.end(), 2, 45);\n```\n\n点击此处查看代码图像\n\n你还可以在指定位置插入一个\
  \ vector 的内容到另一个 vector：\n\n```\n// 包含 2 个元素的 vector\nvector<int> another(2, 30);\n\
  \n// 在 [1] 处插入 another 的内容\nintegers.insert(integers.begin() + 1, another.begin(),\
  \ another.end());\n```\n\n你使用由 `begin()` 或 `end()` 返回的迭代器来告诉 `insert()` 函数要放置元素的位置。此外，也可以使用\
  \ `find()` 找到一个元素并在那里插入，这会将该元素向右移动。\n\n#### 输入 ▼\n\n列表 17.3 使用 `insert()` 函数在位置插入元素\n\
  \n```\n 0: #include<vector>\n 1: #include<iostream>\n 2: using namespace std;\n\
  \ 3:\n 4: void DisplayVector(const vector<int>& inVec)\n 5: {\n 6:    for(auto element\
  \ = inVec.cbegin();\n 7:         element != inVec.cend();\n 8:         ++element)\n\
  \ 9:       cout << *element << ' ';\n10:    cout << endl;\n 11: }\n 12:\n 13: int\
  \ main()\n 14: {\n 15:   // 实例化一个包含 4 个 90 的 vector\n 16:   vector<int> integers(4,\
  \ 90);\n 17:\n 18:   cout << \"The initial contents of the vector: \";\n 19:   DisplayVector(integers);\n\
  \ 20:\n 21:   // 在开头插入 25\n 22:   integers.insert(integers.begin(), 25);\n 23:\n\
  \ 24:   cout << \"Vector after inserting elements at beginning and end: \";\n 25:\
  \   DisplayVector(integers);\n 26:\n 27:   // 在末尾插入 2 个值为 45 的元素\n 28:   integers.insert(integers.end(),\
  \ 2, 45);\n 29:\n 30:   // 另一个包含 2 个元素的 vector\n 31:   vector<int> another(2, 30);\n\
  \ 32:\n 33:   // 在 [1] 处插入 another 的内容\n 34:   integers.insert(integers.begin()\
  \ + 1, another.begin(), another.end());\n 35:\n 36:   cout << \"Vector after inserting\
  \ contents from another vector: \";\n 37:   cout << \"in the middle:\" << endl;\n\
  \ 38:   DisplayVector(integers);\n 39:\n 40:   return 0;\n 41: }\n```\n\n\n\n\n\n\
  虽然 `vector::insert()` 是一个多功能函数，但使用 `push_back()` 应该是你向 `vector` 添加元素的首选方式。这是因为使用\
  \ `insert()` 是向 `vector` 添加元素的一种低效方法（当在不是序列末尾的位置添加元素时），因为在序列开头或中间添加元素会使 `vector`\
  \ 类将所有后续元素向后移动（在末尾为最后的元素留出空间）。因此，取决于序列中包含的对象的类型，这种移动操作的代价在调用的拷贝构造函数或拷贝赋值运算符方面可能是巨大的。Listing\
  \ 17.3 中的 vector 用于包含 `int` 类型的元素，这类元素的移动开销相对较小。不过对于 `vector` 类的许多其他用途，情况可能并非如此。\n\
  \n### 提示\n\n如果容器需要非常地在中间进行插入，你应该使用 `std::list`，这在第 18 节“STL `list` 和 `forward_list`”中进行了解释。\n\
  \n### 使用数组语义访问 Vector 中的元素\n\n可以通过以下方法访问 vector 中的元素：通过使用下标运算符（`[]`）使用数组语义、使用成员函数\
  \ `at()`或使用迭代器。\n\nListing 17.1 展示了如何创建并初始化一个包含 10 个元素的 `vector` 实例：\n\n```\nstd::vector<int>\
  \ tenElements(10);\n```\n\n你可以使用这种类似数组的语法访问并设置单个元素：\n\n```\ntenElements[3] = 2011;\
  \ // 为索引 3 处的元素赋值值 2011\n```\n\n点击此处查看代码图像\n\nListing 17.4 展示了如何使用下标运算符（`[]`）访问\
  \ vector 中的。\n\n#### 输入 ▼\n\nListing 17.4 使用数组语义访问 Vector 中的元素\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<vector>\n 2:\n 3: int main()\n 4: {\n 5:    using namespace std;\n\
  \ 6:    vector<int> integers{ 50, 1, 987, 1001 };\n 7:\n 8:    for(size_t index\
  \ = 0; index < integers.size(); ++index)\n 9:    {\n10:       cout << \"Element[\"\
  \ << index << \"] = \" ;\n11:       cout << integers[index] << endl;\n12:    }\n\
  \ 13:\n 14:    integers[2] = 2011; // 修改第 3 个元素的值\n 15:    cout << \"After replacement:\
  \ \" << endl;\n 16:    cout << \"Element[2] = \" << integers[2] << endl;\n 17:\n\
  \ 18:    return 0;\n19: }\n```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n```\nElement[0] = 50\n\
  Element[1] = 1\nElement[2] = 987\nElement[3] = 1001\nAfter replacement:\nElement[2]\
  \ = 2011\n```\n\n点击此处查看代码图像\n\n#### 分析 ▼\n\n在第 11、14 和 16 行中，使用 `vector` 访问和分配元素的方式与你使用\
  \ `vector` 的下标运算符（`[]`）使用静态数组相同。下标运算符接收从零开始的元素索引，就像静态数组中一样。注意第 8 行中的 `for` 循环是如何编写的，通过与\
  \ `vector::size()` 比较来确保索引不会越过 vector 的边界。\n\n### 注意事项\n\n使用下标运算符（`[]`）访问 vector\
  \ 中的元素存在着与访问数组中元素相同的危险；即，你不应该越过容器的边界。如果你使用 `[]` 访问超出 vector 边界位置的元素，该操作的结果将是未定义的（也就是说，可能会发生任何事情，甚至可能发生访问违规）。\n\
  \n更安全的替代方案是使用 `at()` 成员函数：\n\n```\n// 获取位置 2 处的元素\n\ncout << integers.at(2);\n\n\
  // 上述代码在\n// Listing 17.4 第 11 行的 vector::at() 版本为：\n\ncout << integers.at(index);\n\
  ```\n\n点击此处查看代码图像\n\n`at()` 对容器的大小进行运行时检查，并在越界边界时抛出异常（无论如何你都不应该这样做）。\n\n当你能够确保边界完整性时（如前面的示例所示），使用下标运算符（`[]`）是安全的。\n\
  \n### 使用指针语义访问 Vector 中的元素\n\n你可以通过迭代器使用指针的语义访问 vector 中的元素，如 Listing 17.5 所示。\n\
  \n#### 输入 ▼\n\nListing 17.5 使用指针语义访问 Vector 中的元素\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<vector>\n 2:\n 3: int main()\n 4: {\n 5:    using namespace std;\n\
  \ 6:    vector<int> integers{ 50, 1, 987, 1001 };\n 7:\n 8:    vector<int>::const_iterator\
  \ element = integers.cbegin();\n 9:    auto element = integers.cbegin(); // 自动类型推导\n\
  10:    while(element != integers.end())\n11:    {\n12:       size_t index = distance(integers.cbegin(),\
  \ element);\n13:\n14:       cout << \"Element at position \";\n15:       cout <<\
  \ index << \" is: \" << *element << endl;\n16:\n17:       // 移动到下一个元素\n18:     \
  \  ++element;\n19:    }\n20:\n21:    return 0;\n22: }\n```\n\n点击此处查看代码图像\n\n####\
  \ 输出 ▼\n\n```\nElement at position 0 is: 50\nElement at position 1 is: 1\nElement\
  \ at position 2 is: 987\nElement at position 3 is: 1001\n```\n\n点击此处查看代码图像\n\n####\
  \ 分析 ▼\n\n此示例中的迭代器行为类似于指针，如第 16 行所示，使用解引用运算符（`*`）访问存储在 vector 中的值，以及第 19 行通过增加运算符\
  \ `++` 移动到下一个元素。注意第 13 行使用 `distance()` 来计算元素在 vector 中的从零开始的偏移（相对于 `cbegin()` 和迭代器）。第\
  \ 9 行展示了第 3 节“变量、声明”中引入的自动类型推导的简单替代方案。\n\n### 从 Vector 中移除元素\n\n正如 vector 通过 `push_back()`\
  \ 函数在末尾插入，它也通过 `pop_back()` 函数在末尾删除元素。通过 `pop_back()` 从 vector 中删除元素需要常数时间；即，所需的时间与\
  \ vector 中的元素数量无关。Listing 17.6 展示了使用 `pop_back()` 函数删除 vector 末尾的元素。\n\n#### 输入\
  \ ▼\n\nListing 17.6 使用 `pop_back()` 删除 Vector 的最后一个元素\n\n```\n 0: #include<iostream>\n\
  \ 1: #include<vector>\n 2: using namespace std;\n 3:\n 4: template <typename T>\n\
  \ 5: void DisplayVector(const vector<T>& inVec)\n 6: {\n 7:    for(const auto& element\
  \ : inVec)\n 8:      cout << element << ' ';\n 9:\n10:    cout << endl;\n11: }\n\
  12:\n13: int main()\n14: {\n15:    vector<int> integers;\n16:\n17:    // 将示例整数插入\
  \ vector 中：\n18:    integers.push_back(50);\n19:    integers.push_back(1);\n20:\
  \    integers.push_back(987);\n21:    integers.push_back(1001);\n22:\n23:    cout\
  \ << \"Vector contains \" << integers.size() << \" elements: \";\n24:    DisplayVector(integers);\n\
  25:\n26:    // 擦除末尾的一个元素\n27:    integers.pop_back();\n28:\n29:    cout << \"After\
  \ a call to pop_back()\" << endl;\n30:    cout << \"Vector contains \" << integers.size()\
  \ << \" elements: \";\n31:    DisplayVector(integers);\n32:\n33:    return 0;\n\
  34: }\n```\n\n\n\n\n输出结果显示第 27 行使用的 `pop_back()` 函数通过删除插入的最后一个元素，减少了向量（vector）中的元素数量。第\
  \ 30 行再次调用 `size()` 以证明，如输出所示，向量中的元素数量已经减少了一个。\n\n### 注意事项\n\n第 4 行到第 11 行的 `DisplayVector()`\
  \ 函数在代码列表 17.6 中采用了模板形式，而在代码列表 17.3 中，它只接受整型向量。这种模板形式可以帮助你为任何类型的向量（例如浮点型 `float`）重用此函数：\n\
  \n```\nvector <float> vecFloats;\n\nDisplayVector(vecFloats);\n```\n\n点击此处查看代码图像\n\
  \n这种泛型形式的 `DisplayVector()` 还支持任何具有返回 `cout` 可理解之值的运算符的类向量。此外，请注意第 7 行中的范围 `for`\
  \ 循环是如何简化代码的。\n\n### 理解大小（Size）和容量（Capacity）\n\n向量的 `size` 是存储在向量中的元素数量。向量的 `capacity`\
  \ 是向量在重新分配内存以容纳更多元素之前，可能存储的元素总数。因此，向量的大小小于或等于它的容量。\n\n你可以通过调用 `size()` 来查询向量的元素数量：\n\
  \n```\ncout << \"Size: \" << integers.size();\n```\n\n点击此处查看代码图像\n\n你可以通过调用 `capacity()`\
  \ 来查询向量的容量：\n\n```\ncout << \"Capacity: \" <<  integers.capacity();\n```\n\n点击此处查看代码图像\n\
  \n一个需要频繁重新分配内部动态数组内存的向量很可能会导致性能问题。这个问题可以通过使用成员函数 `reserve(number)` 来解决。`reserve()`\
  \ 的本质是增加为向量内部数组分配的内存量，以便容纳指定数量的元素而无需重新分配。根据存储在向量中的对象类型，减少重新分配的次数也可以减少对象复制的次数并提高性能。代码列表\
  \ 17.7 展示了 `size()` 和 `capacity()` 区别。\n\n#### 输入 ▼\n\n代码列表 17.7 使用 `size()` 和 `capacity()`\n\
  \n```\n 0: #include<iostream>\n 1: #include<vector>\n 2:\n 3: int main()\n 4: {\n\
  \ 5:    using namespace std;\n 6:\n 7:    // 实例化包含 5 个默认值整数的向量对象\n 8:    vector<int>\
  \ integers(5);\n 9:\n10:    cout << \"Vector of integers was instantiated with \"\
  \ << endl;\n11:    cout << \"Size: \" << integers.size();\n12:    cout << \", Capacity:\
  \ \" <<  integers.capacity() << endl;\n13:\n14:    // 向向量中插入第 6 个元素\n15:    integers.push_back(666);\n\
  16:\n17:    cout << \"After inserting an additional element... \" << endl;\n18:\
  \    cout << \"Size: \" << integers.size();\n19:    cout << \", Capacity: \" <<\
  \  integers.capacity() << endl;\n20:\n21:    // 插入另一个元素\n22:    integers.push_back(777);\n\
  23:\n24:    cout << \"After inserting another element... \" << endl;\n25:    cout\
  \ << \"Size: \" << integers.size();\n26:    cout << \", Capacity: \" <<  integers.capacity()\
  \ << endl;\n27:    return 0;\n28: }\n```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n```\nVector\
  \ of integers was instantiated with\nSize: 5, Capacity: 5\nAfter inserting an additional\
  \ element...\nSize: 6, Capacity: 7\nAfter inserting another element...\nSize: 7,\
  \ Capacity: 7\n```\n\n点击此处查看代码图像\n\n#### 分析 ▼\n\n第 8 行显示在默认值时实例化了包含 5 个整数的向量。第 11\
  \ 行和第 12 行分别显示向量的大小和容量，显示在实例化时它们是相等的。第 15 行插入了第 6 个元素。由于向量之前的容量为 `5`，内部缓冲区没有足够的内存支持这个新的第\
  \ 6 个元素，因此它需要重新分配。这种重新分配逻辑是智能的：为了避免插入另一个元素时再次重新分配，它预先分配了大于要求的容量。输出显示当在容量为 5 的向量中插入元素时，容量增加到了\
  \ 7。\n\n### 注意事项\n\n当内部缓冲区重新分配时向量容量的预先增加在 C++ 标准中并没有规定。这种性能水平取决于 STL 的提供者，因此在执行代码列表\
  \ 17.7 时，你可能会看到不同的输出。\n\n### STL `deque` 类\n\n`deque`（读作“deck”）是一种 STL 动态数组类，其属性与\
  \ `vector` 非常相似，不同之处在于允许在数组的前部和尾插入删除元素。你可以这样实例化一个整数 deque：\n\n```\n// 定义一个整数 deque\n\
  std::deque<int> intDeque;\n```\n\n点击此处查看代码图像\n\n### 提示\n\n要使用 `std::deque`，请包含头文件\
  \ `<deque>`：\n\n```\n#include<deque>\n```\n\ndeque 的可视化如图 17.2（ch17.xhtml_fig2）所示。\n\
  \n![插图显示了三个由线分隔的水平区域。](img/17fig02.jpg)\n\n**图 17.2** deque 的内部结构。\n\ndeque 与 vector\
  \ 的相似之处在于它通过 `push_back()` 和 `pop_back()` 函数支持在尾部进行元素插入和删除。与 `vector` 类一样，你可以通过下标运算符\
  \ `[]` 使用数组语义访问 `deque` 类中的元素。然而，`deque` 与 `vector` 的不同在于，它还允许通过 `push_front()`\
  \ 在头部插入元素，并通过 `pop_front()` 从头部删除元素，如代码列表 17.8 所示。\n\n\n\n\n\n```cpp\n 0: #include<deque>\n\
  \ 1: #include<iostream>\n 2: #include<algorithm>\n 3:\n 4: int main()\n 5: {\n 6:\
  \    using namespace std;\n 7:\n 8:    // 定义一个整数队列\n 9:    deque<int> intDeque;\n\
  10:\n11:    // 在数组末尾插入整数\n12:    intDeque.push_back(3);\n13:    intDeque.push_back(4);\n\
  14:    intDeque.push_back(5);\n15:\n16:    // 在数组首部插入整数\n17:    intDeque.push_front(2);\n\
  18:    intDeque.push_front(1);\n19:    intDeque.push_front(0);\n20:\n21:    cout\
  \ << \"The contents of the deque after inserting elements \";\n22:    cout << \"\
  at the top and bottom are:\" << endl;\n23:\n24:    // 在屏幕上显示内容\n25:    for(size_t\
  \ count = 0;\n26:        count < intDeque.size();\n27:        ++ count)\n28:   \
  \ {\n29:       cout << \"Element [\" << count << \"] = \";\n30:       cout << intDeque\
  \ [count] << endl;\n31:    }\n32:\n33:    cout << endl;\n34:\n35:    // 删除首部的的元素\n\
  36:    intDeque.pop_front();\n37:\n38:    // 删除末尾的元素\n39:    intDeque.pop_back();\n\
  40:\n41:    cout << \"The contents of the deque after erasing an element \";\n42:\
  \    cout << \"from the top and bottom are:\" << endl;\n43:\n44:    // 再次显示内容：这次使用迭代器\n\
  45:    // 如果使用较旧的编译器，请移除 auto 并取消下行的注释\n46:    // deque<int>::iterator element;\n\
  47:    for(auto element = intDeque.begin();\n48:         element != intDeque.end();\n\
  49:         ++ element)\n50:    {\n51:       size_t Offset = distance(intDeque.begin(),\
  \ element);\n52:       cout << \"Element [\" << Offset << \"] = \" << *element <<\
  \ endl;\n53:    }\n54:\n55:    intDeque.clear();\n56:    if(intDeque.empty())\n\
  57:       cout << \"The container is now empty\" << endl;\n58:\n59:    return 0;\n\
  60: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\n在首部和末尾插入元素后的队列内容：\nElement [0] = 0\n\
  Element [1] = 1\nElement [2] = 2\nElement [3] = 3\nElement [4] = 4\nElement [5]\
  \ = 5\n从首部和末尾删除元素后的队列内容：\nElement [0] = 1\nElement [1] = 2\nElement [2] = 3\nElement[3]\
  \ = 4\n容器现在是空的\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n第 9 行实例化了一个整数 `deque`。注意这种语法与实例化整数\
  \ `vector` 是多么相似。第 12 行到 14 行展示了 `deque` 成员函数 `push_back()` 的用法，随后在第 17 到 19 行使用了\
  \ `push_front()`。后者将 `deque` 与 `vector` 区分来。如第 36 行所示，`pop_front()` 除了 `deque` 中的第一个元素。第\
  \ 25 到 31 行中显示 `deque` 内容机制使用了类似数组的语法，通过运算符 `[]` 访问元素，而第 47 到 53 行则演示了配合运算符 `*`\
  \ 使用迭代器。你也可以像列表 17.6 所示对 `std::deque` 使用基于范围的 `for` 循环。第 51 行使用了算法 `std::distance()`\
  \ 来评估元素在 `deque` 中的偏移位置，这与你之前在列表 17.5 中看到的对 `vector` 的处理方式相同。\n\n### 提示\n\n当你需要清空一个\
  \ STL 容器（如 `vector` 或 `deque`）——即删除其中包含的所有元素时，你使用成员函数 `clear()`。\n\n以下代码删除了 `vector`\
  \ 类型 `integers` 中的所有元素（参考列表 17.7）：\n\n```cpp\nintegers.clear();\n```\n\n要删除 `deque`\
  \ `intDeque` 中的所有元素，你使用以下代码（参考列表 17.8，第 55 行）：\n\n```cpp\nintDeque.clear();\n```\n\
  \n注意，`vector` 和 `deque` 也具有成员函数 `empty()`，它会返回 `true`。\n\n\n\n\n\n### 练习\n\n1. 编写一个交互式程序，接受用户的整数输入并将其保存在\
  \ `vector` 中。用户应该能够根据给定的索引查询存储在 `vector` 中的值。\n2. 扩展练习 1 中的程序，使其能够告诉用户其查询的值是否已经存在于\
  \ `vector` 中。\n3. Jack 在 eBay 上销售罐子。为了帮助他进行包装和运输，编写一个程序，让他可以在其中输入每件物品的尺寸，将它们存储在\
  \ `vector` 中，并在屏幕上打印出来。\n4. 编写一个应用程序，将 `deque` 初始化为以下三个字符串：`\"Hello\"`、`\"Containers\
  \ are cool!\"` 和 `\"C++ is evolving!\"`。你必须使用一个适用于任何类型 `deque` 的泛型函数来显示这些字符串。你的应用程序需要演示\
  \ C++11 引入列表初始化以及 C++14 引入的运算符 `<<`。\n\n# 第 18 节：STL `list` 和 `forward_list`\n\n\
  标准模板库（STL）提供了一种双向链表：模板类 `std::list`。链表的主要优势是插入和删除元素的速度快且是常数时间。C++ 还支持单向链表，即类 `std::forward_list`，它只能向一个方向遍历。\n\
  \n在本节中，你将学习：\n* 如何实例化 `list` 和 `forward_list`\n* 如何使用 STL list 类，包括插入和删除元素\n* 如何反转和排序元素\n\
  \n## `std::list` 的特性\n\n*链表* 是一个节点的集合，其中每个节点除了包含一个感兴趣的值或对象外，还指向下一个节点；也就是说，每个节点都连接到下一个节点和上一个节点，如图\
  \ 18.1 所示。\n\n![图中显示了两个相互连接的元素，标记为 Node N 和 Node N 加 1。两者都有三个标记为 Link Prev、Data\
  \ 和 Link Next 的部分。](img/18fig01.jpg)\n\n**图 18.1** 双向链表的视觉表示。\n\nSTL 对 `list` 类的实现允许在列表的开头、结尾或中间进行常数时间的插入。\n\
  \n提示\n要使用 `std::list` 类，请包含头文件 `<list>`：\n\n```\n#include<list>\n```\n\n##  `list`\
  \ 基本操作\n\n`std` 命名空间中的模板类 `list` 是一个通用实现，在使用它的任何实用成员函数之前，需要先对其进行模板实例化。\n\n### 实例化\
  \ `std::list` 对象\n\n`list` 的模板实例化需要指定你想要在列表中收集的对象类型。因此，列表的初始化看起来如下：\n\n```cpp\n\
  std::list<int> linkInts;  // 包含整数的列表\nstd::list<float> listFloats;  // 包含浮点数的列表\n\
  std::list<Tuna> listTunas;  // 包含 Tuna 类型对象的列表\n```\n\n要声明一个指向列表中元素的迭代器，你将使用：\n\n\
  ```cpp\nstd::list<int>::const_iterator elementInList;\n```\n\n如果你需要一个可以用于修改值或调用非\
  \ `const` 函数的迭代器，请使用 `iterator` 而不是 `const_iterator`。\n\n鉴于 `std::list` 的实现提供了一组重载构造函数，你甚至可以创建初始化为包含指定数量元素的列表，且每个元素都初始化为一个特定值，如列表\
  \ 18.1 所示。\n\n##### 输入 ▼\n\nListing 18.1 实例化 `std::list` 的不同形式，指定元素数量和初始值\n\n```cpp\n\
  \ 0: #include<list>\n 1: #include<vector>\n 2:\n 3: int main()\n 4: {\n 5:    using\
  \ namespace std;\n 6:\n 7:    // 实例化一个空列表\n 8:    list<int> linkInts;\n 9:\n10:\
  \    // 实例化一个包含 10 个整数的列表\n11:    list<int> listWith10Integers(10);\n12:\n13:  \
  \  // 实例化一个包含 4 个整数的列表，每个值为 99\n14:    list<int> listWith4IntegerEach99(4, 99);\n\
  15:\n16:    // 创建现有列表的精确拷贝\n17:    list<int> listCopyAnother(listWith4IntegerEach99);\n\
  18:\n19:    // 一个包含 10 个整数的 vector，每个为 2017\n20:    vector<int> vecIntegers(10,\
  \ 2017);\n21:\n22:    // 使用另一个容器的值来实例化列表\n23:    list<int> listContainsCopyOfAnother(vecIntegers.cbegin(),\n\
  24:                                     vecIntegers.cend());\n25:\n26:    return\
  \ 0;\n27: }\n```\n\n##### 输出 ▼\n\n该代码段没有产生输出。\n\n##### 分析 ▼\n\n该程序没有输出，并演示了使用各种重载构造函数创建整数列表的应用。第\
  \ 8 行创建了一个空列表，而第 11 行创建了一个包含 10 个整数的列表。第 14 行显示了一个名为 `listWith4IntegersEach99` 的列表，它包含\
  \ 4 个每个初始化为值 `99` 的整数。第 17 行创建了一个与另一个列表内容完全拷贝的列表。第 20 到第 24 行令人惊讶且好奇！它们实例化了一个包含\
  \ 10 个 `2017` 整数的 `vector`，然后使用 `vector::cbegin()` 和 `vector::cend()` 返回的 `const`\
  \ 迭代器实例化了一个列表。\n\n### 在列表的开头或结尾插入元素\n\n与 `deque` 类似，在列表中，你使用成员方法 `push_front()`\
  \ 在开头（取决于你的视角）插入元素。你使用成员方法 `push_back()` 在末尾插入元素。这两个方法都接受一个输入参数，即要插入的值：\n\n```cpp\n\
  linkInts.push_back(-1);\nlinkInts.push_front(2011);\n```\n\n##### 输入 ▼\n\nListing\
  \ 18.2 使用 `push_front()` 和 `push_back()` 在列表中插入元素演示了在整数列表上使用两种方法的效果。\n\n```cpp\n\
  \ 0: #include<list>\n 1: #include<iostream>\n 2: using namespace std;\n 3:\n 4:\
  \ template <typename T>\n 5: void DisplayContents(const T& container)\n 6: {\n 7:\
  \    for(auto element = container.cbegin();\n 8:         element != container.cend();\n\
  \ 9:         ++ element )\n10:        cout << *element << ' ';\n 11:\n 12:    cout\
  \ << endl;\n 13: }\n 14:\n 15: int main()\n 16: {\n 17:    std::list<int> linkInts{\
  \ -101, 42 };\n 18:\n 19:    linkInts.push_front(10);\n 20:    linkInts.push_front(2011);\n\
  \ 21:    linkInts.push_back(-1);\n 22:    linkInts.push_back(9999);\n 23:\n 24:\
  \    DisplayContents(linkInts);\n 25:\n 26:    return 0;\n 27: }\n```\n\n##### 输出\
  \ ▼\n\n```\n2011 10 -101 42 -1 9999\n```\n\n##### 分析 ▼\n\n\n\n\n第 17 行对 `int` 类型的列表进行了模板实例化，并使用列表初始化语法（`{...}`）确保\
  \ `linkInts` 在构造时包含了两个连接的整数（-101 和 42）。第 19 行至 22 行演示了 `push_front()` 和 `push_back()`\
  \ 的用法。作为 `push_front()` 参数提供的值占据列表的第一个位置，而通过 `push_back()` 发送的值则占据最后一个位置。输出通过泛型模板函数\
  \ `DisplayContents()` 显示列表的内容，展示了插入元素的顺序（并证明了它们并不是按照插入顺序存储的）。\n\n### 注意\n\n列表 18.2\
  \ 中的第 4 行至 13 行中的 `DisplayContents()` 是 列表 17.6 中 `DisplayVector()` 方法的更通用版本（注意参数列表发生了变化）。`DisplayVector()`\
  \ 仅适用于 `vector` 并泛化了 `vector` 中存储的元素类型，而 `DisplayContents()` 则是真正的泛型，支持多种容器类型。\n\
  \n你可以使用 `vector`、`list` 或 `deque` 作为参数来调用 列表 18.2 中的 `DisplayContents()` 版本，它会运行得很好。\n\
  \n### 在列表中间插入元素\n\n`std::list` 可以在常数时间内在集合的中间插入元素。这是通过成员函数 `insert()` 实现的。\n\n`list::insert()`\
  \ 成员函数以以下三种形式被广泛使用：\n\n*   **形式 1：**\n\n    ```\n     iterator insert(const_iterator\
  \ position, const T& value)\n    ```\n\n    点击此处查看代码图像\n\n    在这里，`insert` 函数接受插入位置作为第一个参数，接受要插入的值作为第二个参数。该函数返回一个指向列表中最近插入的元素的迭代器。\n\
  \n*   **形式 2：**\n\n    ```\n     void insert(const_iterator position, size_type\
  \ n, const T& value)\n    ```\n\n    点击此处查看代码图像\n\n    该函数接受插入位置作为第一个参数，接受要插入的值作为最后一个参数，以及变量\
  \ `n` 中的元素数量。\n\n*   **形式 3：**\n\n    ```\n     template <class InputIterator>\n\
  \       void insert(const_iterator pos, InputIterator f, InputIterator l)\n    ```\n\
  \n    点击此处查看代码图像\n\n    此重载变体是一个模板函数，除了位置外，还接受两个输入迭代器，这两个迭代器标记了要插入到列表中的集合的边界。注意，输入类型\
  \ `InputIterator` 是一个模板参数类型，因此它可以指向任何集合的边界——无论是数组、vector 还是另一个列表。\n\n列表 18.3 演示了这些\
  \ `list::insert()` 函数重载变体的用法。\n\n#### 输入 ▼\n\n列表 18.3 在列表中插入元素的各种方法\n\n```\n 0:\
  \ #include<list>\n 1: #include<iostream>\n 2: using namespace std;\n 3:\n 4: template\
  \ <typename T>\n 5: void DisplayContents(const T& container)\n 6: {\n 7:     for(auto\
  \ element = container.cbegin();\n 8:          element != container.cend();\n 9:\
  \          ++ element )\n10:        cout << *element << ' ';\n11:\n12:    cout <<\
  \ endl;\n13: }\n 14:\n15: int main()\n 16: {\n 17:    list<int> linkInts1;\n 18:\n\
  \ 19:    // 在开头插入元素...\n 20:    linkInts1.insert(linkInts1.begin(), 2);\n 21:  \
  \  linkInts1.insert(linkInts1.begin(), 1);\n 22:\n 23:    // 在结尾插入一个元素...\n 24:\
  \    linkInts1.insert(linkInts1.end(), 3);\n 25:\n 26:    cout << \"The contents\
  \ of list 1 after inserting elements:\" << endl;\n 27:    DisplayContents(linkInts1);\n\
  \ 28:\n 29:    list<int> linkInts2;\n 30:\n 31:    // 插入 4 个相同值 0 的元素...\n 32: \
  \   linkInts2.insert(linkInts2.begin(), 4, 0);\n 33:\n 34:    cout << \"The contents\
  \ of list 2 after inserting '\";\n 35:    cout << linkInts2.size() << \"' elements\
  \ of a value:\" << endl;\n 36:    DisplayContents(linkInts2);\n 37:\n 38:    list<int>\
  \ linkInts3;\n 39:\n 40:    // 在开头从另一个列表插入元素...\n 41:    linkInts3.insert(linkInts3.begin(),\n\
  \ 42:                    linkInts1.begin(), linkInts1.end());\n 43:\n 44:    cout\
  \ << \"The contents of list 3 after inserting elements:\" << endl; // 修正：原文此处应为\
  \ list 3，但逻辑上是 lists3，按原文翻译\n 45:    DisplayContents(linkInts3);\n 46:\n 47:   \
  \ // 在结尾从另一个列表插入元素...\n 48:    linkInts3.insert(linkInts3.end(),\n 49:         \
  \         linkInts2.begin(), linkInts2.end());\n 50:\n 51:    cout << \"The contents\
  \ of list 3 after inserting elements:\" << endl;\n 52:    DisplayContents(linkInts3);\n\
  \ 53:\n 54:    return 0;\n 55: }\n```\n\n######列表中删除删除元素\n\n`list` 函数 `erase()`\
  \ 有两种形式：一种根据给定的迭代器删除元素，另一个接受一个范围并删除范围内的元素。你可以在 列表 18.4 看到 `list::erase()` 函数的用法，它演示了如何删除元素元素一个范围。\n\
  \n#### 输入 ▼\n\n列表 18.4 从列表中删除元素\n\n```\n 0: #include<list>\n 1: #include<iostream>\n\
  \ 2: using namespace std;\n 3:\n 4: template <typename T>\n 5: void DisplayContents(const\
  \ T& container)\n 6: {\n 7:     for(auto element = container.cbegin();\n 8:    \
  \    element != container.cend();\n 9:          ++ element )\n10:      cout << *element\
  \ << ' ';\n 11:\n 12:    cout << endl;\n 13: }\n 14:\n 15: int main()\n 16: {\n\
  \ 17:     std::list<int> linkInts{ 4, 3, 5, -1, 2017 };\n 18:\n 19:    // 存储在 insert\
  \ 中获取的迭代器\n 20:    auto val2 = linkInts.insert(linkInts.begin(), 2);\n 21:\n 22:\
  \    cout << \"Initial contents of the list:\" << endl;\n 23:    DisplayContents(linkInts);\n\
  \ 24:\n 25:    cout << \"After erasing element '\"<< *val2 << \"':\" << endl;\n\
  \ 26:    linkInts.erase(val2);\n 27:    DisplayContents(linkInts);\n 28:\n 29: \
  \   linkInts.erase(linkInts.begin(), linkInts.end());\n 30:    cout << \"Number\
  \ of elements after erasing range: \";\n 31:    cout << linkInts.size() << endl;\n\
  \ 32:\n 33:    return 0;\n 34: }\n```\n\n#### 输出 ▼\n\n```\nInitial contents of the\
  \ list:\n2 4 3 5 -1 2017\nAfter erasing element '2':\n4 3 5 -1 2017\nNumber of elements\
