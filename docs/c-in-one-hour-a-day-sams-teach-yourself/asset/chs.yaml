  \n## 第 10 节\n\n## 实现继承\n\n面向对象编程基于四个重要概念：封装、抽象、继承和多态。继承是复用属性的一种强大方式，也是通向多态的基石。\n\
  \n在本节中，你将了解到：\n\n* ■ 编程背景下的继承\n* ■ C++ 的继承语法\n* ■ 公有、私有保护继承\n* ■ 多重继承\n* 隐藏基类方法和切片（slicing）引起的问题\n\
  \n### 继承的基础\n\nTom Smith 从祖先那里首先继承的是姓氏，这让他成为了一个 Smith。此外，他还继承了父母教给他的某些价值观，以及一种雕刻木头的技能，这种技能是\
  \ Smith 家族世世代代的职业。这些属性共同确定了 Tom 是 Smith 家族树的一员。\n\n在编程术语中，你经常面临这种情况：被管理的组件具有相似的属性，在细节或行为上细有不同。通过编程建模这种情况的一种方法是将每个组件都制为一个类，每个类实现所有属性并重新实现公共属性。另一个解决方案是使用继承，允许相似的类派生自包含公共属性并实现公共功能的基类。派生类通过重写此基类功能来实现使每个类独有的行为；这通常是首选方法。图\
  \ 10.1 展示了面向对象编程世界中的继承。\n\n![流程图显示了两个指向共同基类的组件。](img/10fig01.jpg)\n\n**图 10.1**\
  \ 类之间的继承。\n\n### 继承与派生\n\n图 10.1 展示了基类与其派生类之间的图解关系。现在可能很难视觉化基类或派生类可以是什么。尝试理解派生类继承自基类，从这个意义上说，它也是基类（就像\
  \ Tom 是一个 Smith 一样）。\n\n**注意**\n\n派生类与其基类之间的“is-a”关系仅适用于公有继承。本节从公有继承开始，帮助你通过最频繁的继承形式来继承的概念，然后再转向私有或保护继承。\n\
  \n为了便于理解这个概念，考虑一个基类 `Bird`（鸟）。从 `Bird` 派生的类包括 `Crow`（乌鸦）、`Parrot`（鹦鹉）和 `Kiwi`（奇异鸟）。`Bird`\
  \ 类定义鸟的基本属性，例如“有羽毛”、“有翅膀”、“产蛋”、“会飞”等。派生类如 `Crow`、`Parrot` 和 `Kiwi` 继承这些属性并对其进行定制。表\
  \ 10.1 演示了继承的几个示例。\n\n| 基类 | 派生类 |\n| :--- | :--- |\n| `Fish` | `Goldfish`、`Carp`、`Tuna`\
  \ |\n| `Mammal` | `Human`、`Elephant`、`Lion` |\n| `Bird` | `Crow`、`Parrot`、`Ostrich`、`Kiwi`\
  \ |\n| `Shape` | `Circle`、`Polygon`、`Octagon` |\n\n**表 10.1** 生活中的继承示例\n\n当你戴上面向对象的眼镜时，你会发现到处都是继承的例子。`Fish`\
  \ 是 `Tuna` 的基类，因为金枪鱼也是鱼。因此，`Tuna` 和 `Carp` 从共同基类 `Fish` 继承共同特征，但它们对属性进行了特化。这在图 10.2\
  \ 中所示。\n\n![流程图显示了两个指向共同基类的组件。](img/10fig02.jpg)\n\n**图 10.2** `Tuna`、`Carp` 和 `Fish`\
  \ 之间的层次关系。\n\n鸭兽会游泳，但它是具有哺乳特征（如哺乳）、鸟类特征（如产蛋）和爬行动特征（如有毒）的特殊动物。因此，你可以想象一个 `Platypus`\
  \ 类继承自两个基类 `Mammal` 和 `Bird`，以继承哺乳和鸟类的特征。这种继承形式被称为多重继承，将在本节后后讨论。\n\n### C++ 派生语法\n\
  \n你如何从 `Fish` 类继承 `Carp` 类，或者通义地说，从 `Base` 类继承 `Derived` 类？实现此点的 C++ 语法如下：\n\n```\n\
  class Base\n{\n   // ... 基类成员\n};\n\nclass Derived: access-specifier Base\n{\n \
  \  // ... 派生类成员\n};\n```\n\n点击此处查看代码图像\n\n`访问修符`可以是 `public`（最常用），对应“派生类是基类”的关系；`private`\
  \ 或 `protected`，对应“派生类拥有基类”的关系。\n\n派生自 `Fish` 类的 `Carp` 类的继承层次表示将是\n\n```\nclass\
  \ Fish // 基类\n{\n   // ... Fish 的成员\n};\n\nclass Carp:public Fish // 派生类\n{\n  \
  \ // ... Carp 的成员\n};\n```\n\n\n\n\n\n点击此处查看代码图片\n\n在列表 10.1 中提供了一个可编译的声明，其中包含 `Carp`\
  \ 类和 `Tuna` 类，它们都派生自 `Fish` 类。\n\n## 关于术语的说明\n\n在阅读关于继承的内容时，你会遇到如 `inherits from`（继承自）和\
  \ `derives from`（派生自）等术语，它们的本质含义相同。\n\n同样，基类（base class）也被称为父类（superclass）。派生自基类的类也称为派生类（derived\
  \ class），可以被称为子类（subclass）。\n\n### 输入 ▼\n\n列表 10.1 使用“鱼类世界”示例演示的简单继承层次\n\n```cpp\n\
  \ 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: class Fish\n 4: {\n\
  \ 5: public:\n 6:    bool isFreshWaterFish;\n 7:\n 8:    void Swim()\n 9:    {\n\
  10:       if (isFreshWaterFish)\n11:          cout << \"Swims in lake\" << endl;\n\
  12:       else\n13:          cout << \"Swims in sea\" << endl;\n14:    }\n 15: };\n\
  \ 16:\n 17: class Tuna: public Fish\n 18: {\n 19: public:\n 20:    Tuna()\n 21:\
  \    {\n 22:       isFreshWaterFish = false;\n 23:    }\n 24: };\n 25:\n 26: class\
  \ Carp: public Fish\n 27: {\n 28: public:\n 29:    Carp()\n 30:    {\n 31:     \
  \  isFreshWaterFish = true;\n 32:    }\n 33: };\n 34:\n 35: int main()\n 36: {\n\
  \ 37:    Carp myLunch;\n 38:    Tuna myDinner;\n 39:\n 40:    cout << \"About my\
  \ food:\" << endl;\n 41:\n 42:    cout << \"Lunch: \";\n 43:    myLunch.Swim();\n\
  \ 44:\n 45:    cout << \"Dinner: \";\n 46:    myDinner.Swim();\n 47:\n 48:    return\
  \ 0;\n 49: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nAbout my food:\nLunch: Swims\
  \ in lake\nDinner: Swims in sea\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n\n注意 `main()` 中的第\
  \ 37 行和 38 行，它们分别创建了 `Carp` 和 `Tuna` 类的实例，命名为 `myLunch` 和 `myDinner`。第 43 行和 46\
  \ 行是你通过调用 `Swim()` 方法让你的午餐和晚餐游泳。现在，查看第 17 行到 24 行中 `Tuna` 的类定义，以及第 26 行到 33 行中 `Carp`\
  \ 的类定义。你可以看到，这些类是紧凑的，它们的构造函数将基类 `Fish::isFreshWaterFish` 中的布尔标志设为适当的值。该标志稍后在函数 `Fish::Swim()`\
  \ 中使用。两个派生类中似乎都没有定义你在 `main()` 中成功调用的 `Swim()` 方法。这是因为 `Swim()` 是基类 `Fish` 的一个公共成员（正如第\
  \ 8 行到 14 行所示），其他类继承了它。第 17 行和第 26 行中的公共继承自动通过派生类 `Carp` 和 `Tuna` 的实例暴露了基类的公共成员，包括\
  \ `Swim()` 方法，你在 `main()` 中调用了这些方法。\n\n#### 访问修饰符关键字 `protected`（保护）\n\n在列表 10.1\
  \ 中，`Fish` 类有一个公共属性 `isFreshWaterFish`，它由派生类 `Tuna` 和 `Carp` 设置以自定义（或特化）`Fish` 的行为，并分别适应咸水和淡水。然而，列表\
  \ 10.1 显示了一个严重的缺陷：如果你愿意，甚至 `main()` 也可以篡改布尔标志 `Fish::isFreshWaterFish`，因为它是公共的，因此可以在\
  \ `Fish` 类外部进行操作：\n\n```cpp\nmyDinner.isFreshWaterFish = true; // 但 Tuna 并不是淡水鱼！\n\
  ```\n\n点击此处查看代码图片\n\n显然，你需要一种机制，允许派生类成员修改基类的选定属性，同时拒绝其他所有人访问这些属性。这意味着你希望 `Fish`\
  \ 类中的布尔标志 `isFreshWaterFish` 可以被 `Tuna` 和 `Carp` 类访问，但不能实例化 `Tuna` 或 `Carp` 类的 `main()`\
  \ 访问。这就是关键字 `protected` 派上用场。\n\n注意\n\n`protected` 与 `public`（公共）和 `private`（私有）一样也是一种访问修饰符。当你将类属性或函数声明为\
  \ `protected` 时，你实际上是使其对派生自它的类（以及友元）可访问，同时对该类之外的所有所有人不可访问。如果你希望基类中的某些属性对派生自它的类可见，那么你应该使用访问修饰符\
  \ `protected`，如列表 10.2 所示。\n\n### 输入 ▼\n\n列表 10.2 使用 `protected` 关键字向派生类暴露成员的 `Fish`\
  \ 类\n\n```cpp\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n 3: class\
  \ Fish\n 4: {\n 5: protected:\n 6:    bool isFreshWaterFish; // 对派生类可见\n 7:\n 8:\
  \ public:\n 9:    void Swim()\n10:    {\n11:       if (isFreshWaterFish)\n12:  \
  \        cout << \"Swims in lake\" << endl;\n13:       else\n14:          cout <<\
  \ \"Swims in sea\" << endl;\n15:    }\n 16: };\n 17:\n 18: class Tuna: public Fish\n\
  \ 19: {\n 20: public:\n 21:    Tuna()\n 22:    {\n 23:       isFreshWaterFish =\
  \ false;\n 24:    }\n 25: };\n 26:\n 27: class Carp: public Fish\n 28: {\n 29: public:\n\
  \ 30:    Carp()\n 31:    {\n 32:       isFreshWaterFish = true;\n 33:    }\n 34:\
  \ };\n 35:\n 36: int main()\n 37: {\n 38:    Carp myLunch;\n 39:    Tuna myDinner;\n\
  \ 40:\n 41:    cout << \"About my food:\" << endl;\n 42:\n 43:    cout << \"Lunch:\
  \ \";\n 44:    myLunch.Swim();\n 45:\n 46:    cout << \"Dinner: \";\n 47:    myDinner.Swim();\n\
  \ 48:\n 49:    return 0;\n 50: }\n```\n\n点击此处查看代码图片\n\n### 输出 ▼\n\n```\nAbout my\
  \ food:\nLunch: Swims in lake\nDinner: Swims in sea\n```\n\n点击此处查看代码图片\n\n### 分析\
  \ ▼\n\n尽管列表 10.2 的输出与列表 10.1 相同，但 `Fish` 类发生了许多根本性变化（如第 3 行到 16 行所示）。第一个且最重要的变化是布尔成员\
  \ `Fish::isFreshWaterFish` 现在是 `protected` 属性，因此无法通过 `main()` 访问，如第 51 行所示。（如果你取消注释，将得到编译错误）。尽管如此，这个具有访问修饰符\
  \ `protected` 的 `Fish` 成员对于派生类 `Tuna` 和 `Carp` 来说是可访问的，如第 23 行和第 32 行所示。\n\n####\
  \ 基类初始化：向基类传递参数\n\n如果基类包含一个在实例化时需要参数的重载构造函数呢？在构造派生类时，如何实例化这样的基类呢？答案在于使用初始化列表并在派生类构造函数调用相应的基类构造函数，如下代码所示：\n\
  \n```cpp\nclass Base\n{\npublic:\n   Base(int someNumber) // 重载构造函数\n   {\n    \
  \  // 使用 someNumber\n   }\n};\nclass Derived: public Base\n{\npublic:\n   Derived():\
  \ Base(25)  // 使用参数 25 实例化 Base\n   {\n      // 派生类构造函数代码\n   }\n};\n```\n\n点击此处查看代码图片\n\
  \n\n\n\n\n这种机制在 `Fish` 类中非常有用。通过向 `Fish` 的构造函数提供一个布尔值输入参数来初始化 `Fish::isFreshWaterFish`，该基类\
  \ `Fish` 可以确保强制每个派生类都说明该鱼是淡水鱼还是海水鱼，如 Listing 10.3 所示。\n\n### 输入 ▼\n\nListing 10.3\
  \ 带有初始化列表的派生类构造函数\n\n```\n 0: #include<iostream>\n 1: using namespace std;\n 2:\n\
  \ 3: class Fish\n 4: {\n 5: protected:\n 6:    bool isFreshWaterFish; // 仅对派生类可见\n\
  \ 7:\n 8: public:\n 9:    // Fish 构造函数\n10:    Fish(bool isFreshWater) : isFreshWaterFish(isFreshWater){}\n\
  11:\n12:    void Swim()\n13:    {\n14:       if (isFreshWaterFish)\n15:        \
  \  cout << \"Swims in lake\" << endl;\n16:       else\n17:          cout << \"Swims\
  \ in sea\" << endl;\n18:    }\n19: };\n20:\n21: class Tuna: public Fish\n22: {\n\
  23: public:\n24:    Tuna(): Fish(false) {} // 构造函数初始化基类\n25: };\n26:\n27: class\
  \ Carp: public Fish\n28: {\n29: public:\n30:    Carp(): Fish(true) {}\n31: };\n\
  32:\n33: int main()\n34: {\n35:    Carp myLunch;\n36:    Tuna myDinner;\n37:\n38:\
  \    cout << \"About my food\" << endl;\n39:\n40:    cout << \"Lunch: \";\n41: \
  \   myLunch.Swim();\n42:\n43:    cout << \"Dinner: \";\n44:    myDinner.Swim();\n\
  45:\n46:    return 0;\n47: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nAbout my food\n\
  Lunch: Swims in lake\nDinner: Swims in sea\n```\n\n点击此处查看代码图像\n\n### 分析 ▼\n\n`Fish`\
  \ 现在有了一个接受默认参数的构造函数，用于用于初始化 `Fish::isFreshWaterFish`。因此，创建 `Fish` 对象的唯一方法是提供一个初始化该保护成员的参数。通过这种方式，`Fish`\
  \ 类确保了保护成员不会包含随机值，特别是当派生类忘记设置它时。派生类 `Tuna` 和 `Carp` 现在被强制定义一个构造函数，用正确的参数（`true`\
  \ 或 `false`，表示淡水或其他水）来实例化基类 `Fish` 实例，分别如第 24 行和第 30 行所示。\n\n**注意**\n\n在 Listing\
  \ 10.3 中，你会看到尽管布尔成员变量 `Fish::isFreshWaterFish` 是保护成员，但它从未被派生类直接访问，因为该变量是通过 `Fish`\
  \ 的构造函数设置的。\n\n为了确保最大的安全性，如果派生类不需要访问基类属性，请记住将该属性标记为 `private`。因此，Listing 10.3 的一个更优版本会将\
  \ `Fish::isFreshWaterFish` 设计为 `private`，因为它仅供基类 `Fish` 使用。参见 Listing 10.4。\n\n\
  #### 派生类重写基类的方法\n\n如果 `Derived` 类实现了与它所自的 `Base` 类相同且具有相同返回值和签名的函数，那么它有效地重写了 `Base`\
  \ 类中的该方法，如下代码所示：\n\n```\nclass Base\n{\npublic:\n   void DoSomething()\n   {\n \
  \     // 实现代码... 执行某些事情\n   }\n};\nclass Derived:public Base\n{\npublic:\n   void\
  \ DoSomething()\n   {\n      // 实现代码... 执行其他事情\n   }\n};\n```\n\n点击此处查看代码图像\n\n\
  因此，如果使用 `Derived` 实例调用 `DoSomething()`，它将不会调用 `Base` 类中的功能。\n\n如果 `Tuna` 和 `Carp`\
  \ 类实现了它们自己的 `Swim()` 方法，而该方法在基类中作为 `Fish::Swim()` 也存在，那么对 `Swim` 的调用（如下面摘自 Listing\
  \ 10.3 节节中的 `main()` 所示）将导致调用 `Tuna::Swim()` 的本地实现，这在本质上重写了基类的 `Fish::Swim()` 方法：\n\
  \n```\n36:    Tuna myDinner;\n// ...其他行\n44:    myDinner.Swim();\n```\n\n点击此处查看代码图像\n\
  \n这通过 Listing 10.4 得到了证明。\n\n### 输入 ▼\n\nListing 10.4 派生类 `Tuna` 和 `Carp` 重写基类的\
