  \ `_C` 被定义（且要求）接收 `long double` 作为输入值，而 0 会被解释为整数。\n\n### 不可重载的运算符\n\nC++ 在自定义运算符行为和使类易于使用方面提供了很大的灵活性。然而，它不允许你更改或修改某些预期保持一致行为的运算符的行为。无法重定义的运算符如表\
  \ 12.3 | 应该避免 (DON’T) |\n| --- | --- |\n| | |\n| | |\n| 让你的类易于使用 | 依赖编译器来创建它们 |\n\
  | 在实例直接拷贝或按值传递给函数的场景下定义行为 | 依赖默认的赋值运算符 |\n| 根据需要编写许多运算符 | 标记为 `explicit` |\n| 清晰地定义拷贝或赋值如何工作\
  \ | |\n| 至少提供析构函数 | |\n\n### 总结\n\n在本节中，你学习了运算符如何显著提高类的易用性。最后，你学习了如 `.`、`.*`、`::`\
  \ 和 `sizeof` 等运算符不能重定义。\n\n### 问答\n\nQ 我的类封装了一个动态数组。我应该实现哪些函数和运算符？\n\n答 编写此类类时，你需要提供拷贝构造函数、拷贝赋值运算符和析构函数。如果你想在某些情况下优化性能，还可以实现移动构造函数和移动赋值运算符。\n\
  \nQ 我想创建一个智能指针类。我至少需要实现哪些函数和运算符？\n\n答 智能指针需要像普通指针一样使用，例如 `*pPtr` 或 `pPtr->Func()`。为了实现这一点，你需要实现运算符\
  \ `*` 和 `->`。\n\n### 练习\n\n练习包含测验，有助于巩固你对涵盖内容的理解，并提供使用所知识的经验。在检查附录 E 中的答案之前，尝试回答测验和练习题，并在进入下一节之前确保你理解了答案。\n\
