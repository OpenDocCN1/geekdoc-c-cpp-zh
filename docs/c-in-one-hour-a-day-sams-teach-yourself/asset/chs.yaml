  \ 的实现，它们允许使用简单的加法和减法，分别如 `main()` 中第 36 和第 40 行所示。\n\n二元加法运算符对于管理动态内存的类也很有用。在第 9\
  \ “类与对象”中，你分析了一个名为 `MyBuffer` 的简单整数缓冲区，它封装了内存管理、拷贝等功能，如下：\n\n```cpp\nMyBuffer buf1(3);\
