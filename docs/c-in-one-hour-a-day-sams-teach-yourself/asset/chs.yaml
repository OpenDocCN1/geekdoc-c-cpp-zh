  注意，此类赋值会导致隐式转换。也就是说，编译器使用可用的转换操作符（在这种情况下是 `const char*`），从而允许可以无错误编译的无意赋值。为了避免隐式转换，请在操作符声明开头使用\
  \ `explicit` 关键字，如下：\n\n```cpp\nexplicit operator const char*()\n{\n   // 此处编写转换代码\n\
  }\n```\n\n点击此处查看代码图片\n\n使用 `explicit` 将强制程序员使用类型转换来断言转换意图：\n\n```cpp\nstring strHoliday(static_cast<const\
  \ char*>\n(holiday));\n\nstrHoliday=static_cast<const char*>\n(Date(11,11,2021));\n\
  ```\n\n点击此处查看代码图片\n\n类型转换包括 `static_cast` 将在第 13  “转换操作符”中详细讨论。\n\n##### Note\n\n\
