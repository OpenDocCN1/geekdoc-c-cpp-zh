  \ multimap、set 或 multiset）中的插入操作也会变慢，因为这些容器在插入时会进行排序。因此，对更快速容器的搜索仍在持续，数学家和程序员都在寻找具有常时间插入和查找功能的容器的“圣杯”。哈希表就是一种承诺了在给定键的情况下，不取决于容器的大小，可以实现常时间插入和近常时间查找（在大多数情况下）的容器。\n\
  \n### STL 基于哈希表的键值对容器\n\nSTL 支持以 `std::unordered_map` 类形式提供的哈希映射。要使用此模板容器类，请包含：\n\
  \n```cpp\n#include<unordered_map>\n```\n\n`unordered_map` 保证了对容器中任意元素的插入、删除和查找在平均常时间（constant-time）内完成。\n\
  \n#### 哈希表的工作原理\n\n虽然详细讨论哈希表不是本书的范围，但本节描述了哈希表工作的基本原理。\n\n哈希表可以看作是键值对的集合，给定一个键，表就能找到对应的值。哈希表与简单\
  \ map 的区别在于，哈希表将键值对存储在桶（buckets）中，每个桶都有一个索引，定义了它在表中的相对位置（类似于数组）。该索引由一个使用键作为输入的哈希函数决定：\n\
  \n```cpp\nindex = HashFunction(key, tableSize);\n```\n\n点击此处查看代码图像\n\n在给定键执行 `find()`\
  \ 时，会再次使用 `HashFunction()` 来确定元素的位置，表返回该位置的值，就像数组返回其中存储的元素一样。在 `HashFunction()`\
  \ 编写得不够理想的情况下，多个元素可能会具有相同的索引并落入同一个桶中——这在内部是一个元素列表。在这样的情况下，被称为 `collisions`（冲突），搜索速度将会变慢，且不再是一项常时间操作了。\n\
  \n#### 使用 `unordered_map` 和 `unordered_multimap`\n\n实现哈希表的容器 `std::unordered_map`\
  \ 和 `std::unordered_multimap` 分别与 `std::map` 和 `std::multimap` 并不相似。实例化、插入和查找遵循相似的模式：\n\
  \n```cpp\n// 实例化从 int 到 string 的 unordered_map:\nunordered_map<int, string> umapIntToStr;\n\
  \n// insert()\numapIntToStr.insert(make_pair(1000, \"Thousand\"));\n\n// find():\n\
  auto pairFound = umapIntToStr.find(1000);\ncout << pairFound->first << \" - \" <<\
  \ pairFound->second << endl;\n\n// 使用数组语义查找值:\ncout << \"umapIntToStr[1000] = \"\
  \ << umapIntToStr[1000] << endl;\n```\n\n点击此处查看代码图像\n\n然而，无序 map 的一个重要特征是可以使用哈希函数，该函数负责决定排序顺序：\n\
  \n```cpp\nunordered_map<int, string>::hasher hFn =\n         umapIntToStr.hash_function();\n\
  ```\n\n点击此处查看代码图像\n\n你可以通过调用键的哈希函数来查看分配该键的优先级：\n\n```cpp\nsize_t hashingVal = hFn(1000);\n\
  ```\n\n点击此处查看代码图像\n\n无序 map 将键值对存储在桶中。当包含的键值对数量达到或接近可用桶的总数时，它增加桶的数量来自动管理负载：\n\n\
  ```cpp\ncout << \"Load factor: \" << umapIntToStr.load_factor() << endl;\ncout <<\
  \ \"Max load factor = \" << umapIntToStr.max_load_factor() << endl;\ncout << \"\
  Max bucket count = \" << umapIntToStr.max_bucket_count() << endl;\n```\n\n点击此处查看代码图像\n\
  \n`load_factor()` 表示无序 map 中桶的填充程度。当由于插入导致 `load_factor()` 超过 `max_load_factor()`\
  \ 时，map 会重新组织自身以增加可用桶的数量并重建哈希表，如 Listing 20.6 所示。\n\n提示\n\n`std::unordered_multimap`\
  \ 与 `unordered_map` 类似，但它支持具有相同键的多个对。\n\n##### 输入 ▼\n\nListing 20.6 实例化 STL 哈希表实现\
