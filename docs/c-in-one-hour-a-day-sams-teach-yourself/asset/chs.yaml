  \n### 分析 ▼\n\n`getline()` 允许你获取包含空格的整行。\n\n### 使用 `std::fstream` 进行文件处理\n\n`fstream`\
  \ 是一个提供读写能力的类。它继承自 `ofstream`（写）和 `ifstream`（读）。\n\n#### 使用 `open()` 打开和关闭文件\n\n\
  要使用 `fstream`，可以使用构造函数或 `open()` 方法。建议使用 `is_open()` 检查文件是否成功打开。\n\n```cpp\nfstream\
  \ myFile;\nmyFile.open(\"HelloFile.txt\", ios_base::out);\nif(myFile.is_open())\
  \ {\n   // 操作\n}\nmyFile.close();\n```\n\n#### 打开模式\n\n文件流可以用多种模式打开：\n- `ios_base::app`:\
  \ 追加到现有文件末。\n- `ios_base::ate`: 将光标放在文件末尾。\n- `ios_base::trunc`: 导致现有文件截断（输出默认）。\n\
  - `ios_base::binary`: 创建二进制文件。\n- `ios_base::in`: 用于读取操作打开文件。\n- `ios_base::out`:\
  \ 用于写入操作打开文件。\n\n### 使用 `open()` 和 `<<` 创建并写入文本文件\n\n打开文件流后，可以使用插入运算符 `<<` 向其写入，如\
  \ 列表 27.8 所示。\n\n```cpp\n#include<fstream>\n#include<iostream>\nusing namespace\
  \ std;\n\nint main() {\n    ofstream myFile;\n    myFile.open(\"HelloFile.txt\"\
  , ios_base::out);\n\n    if(myFile.is_open()) {\n       cout << \"File open successful\"\
  \ << endl;\n\n       myFile << \"My first text file!\" << endl;\n       myFile <<\
  \ \"Hello file!\";\n\n       cout << \"Finished writing to file, will close now\\\
  n\";\n       myFile.close();\n    }\n\n    return 0;\n}\n```\n\n\n\n\n\n第 7 行以 `ios_base::out`\
  \ 模式打开文件——即仅用于写入。在第 9 行中，你测试 `open()` 是否成功，然后使用插入运算符 `<<` 向文件流写入内容，如第 13 行和 14 行所示。最后，你在第\
  \ 17 行关闭文件并返回。\n\n### 注意事项\n\n列表 27.8 展示了你如何像使用 `cout` 向标准输出（控制台）写入一样，向文件流写入内容。\n\
  \n这表明 C++ 中的流允许以类似的方式处理不同的设备，通过 `cout` 向显示器写入文本，就像通过 `ofstream` 向文件写入文本一样。\n\n###\
  \ 使用 `open()` 和运算符 `>>` 读取文本文件\n\n你可以使用 `fstream` 读取文件，并使用标志位 `ios_base::in` 或直接使用\
  \ `ifstream` 来打开它。列表 27.9 展示了如何从在 列表 27.8 中创建的 `HelloFile.txt` 文件读取文本。\n\n#### 输入\
  \ ▼\n\n列表 27.9 从文件 `HelloFile.txt` 读取文本（创建于 列表 27.8）\n\n```\n 0: #include<fstream>\n\
  \ 1: #include<iostream>\n 2: #include<string>\n 3: using namespace std;\n 4:\n 5:\
  \ int main()\n 6: {\n 7:    ifstream myFile;\n 8:    myFile.open(\"HelloFile.txt\"\
  , ios_base::in);\n 9:\n10:    if(myFile.is_open())\n11:    {\n12:       cout <<\
  \ \"File open successful. It contains: \\n\";\n13:       string fileContents;\n\
  14:\n15:       while(myFile.good())\n16:       {\n17:          getline(myFile, fileContents);\n\
  18:          cout << fileContents << endl;\n19:       }\n20:\n21:       cout <<\
  \ \"Finished reading file, will close now\\n\";\n22:       myFile.close();\n23:\
  \    }\n24:    else\n25:       cout << \"open() failed: check if file is in right\
  \ folder\\n\";\n26:\n27:    return 0;\n28: }\n```\n\n点击此处查看代码图片\n\n#### 输出 ▼\n\n\
  ```\nFile open successful. It contains:\nMy first text file!\nHello file!\nFinished\
  \ reading file, will close now\n```\n\n点击此处查看代码图片\n\n### 注意\n\n由于 列表 27.9 读取了使用\
  \ 列表 27.8 创建的文本文件 `HelloFile.txt`，你需要将该文件移动到此项目的工作目录中。\n\n#### 分析 ▼\n\n一如既往，你使用\
  \ `is_open()` 来验证第 8 行中的 `open()` 调用是否成功。你逐行读取文件，只要第 15 行中的 `good()` 方法返回 `true`。注意在直接读取文件内容时使用了提取运算符（`>>`），该内容随后被读入一个字符串中，并在第\
  \ 18 行使用 `cout` 显示。在本例中，你使用 `getline()` 从文件流中读取输入，这与在 列表 27.7 中的用法完全相同，那里你用它从用户处读取输入，每次完整一行。\n\
  \n#### 向二进制文件写入和读取\n\n向二进制文件写入的过程与你到目前所学的内容并不相似。在打开文件时，使用 `ios_base::binary` 标志作为掩码是非常重要的。你通常使用\
  \ `ofstream::write` 或 `ifstream::read` 向二进制文件写入或从其读取，如 列表 27.10 所示。\n\n#### 输入 ▼\n\
  \n列表 27.10 向二进制文件写入 `struct` 并重构\n\n```\n 0: #include<fstream>\n 1: #include<iomanip>\n\
  \ 2: #include<string>\n 3: #include<iostream>\n 4: using namespace std;\n 5:\n 6:\
  \ struct Human\n 7: {\n 8:    char name[20] = \"John\";\n 9:    int age = 40;\n\
  10:    char DOB[20] = \"1981 Sep 1\";\n11: };\n12:\n13: int main()\n14: {\n15: \
  \   Human aPerson;\n16:\n17:    ofstream fsOut (\"MyBinary.bin\", ios_base::out\
  \ | ios_base::binary);\n18:    if (fsOut.is_open())\n19:    {\n20:       cout <<\
  \ \"Writing one Human to a binary file\";\n21:       fsOut.write((char*)&aPerson,\
  \ sizeof(aPerson));\n22:       fsOut.close();\n23:    }\n24:\n25:    ifstream fsIn\
  \ (\"MyBinary.bin\", ios_base::in | ios_base::binary);\n26:    if(fsIn.is_open())\n\
  27:    {\n28:       Human readHuman;\n29:       fsIn.read((char*)&readHuman, sizeof(readHuman));\n\
  30:\n31:       cout << \"Reading from file:\" << endl;\n32:       cout << \"Name:\
  \ \" << readHuman.name << endl;\n33:       cout << \"Age: \" << readHuman.age <<\
  \ endl;\n34:       cout << \"Date of Birth: \" << readHuman.DOB << endl;\n35:  \
  \  }\n36:\n37:    return 0;\n38: }\n```\n\n点击此处查看代码图片\n\n#### 输出 ▼\n\n```\nWriting\
  \ one Human to a binary file\nReading from file:\nName: John\nAge: 40\nDate of Birth:\
  \ 1981 Sep 1\n```\n\n### 使用 `stringstream` 进行字符串转换\n\n假设你有一个字符串，其中包含值 `45`。你如何将这个字符串转换为整数？你如何进行相反操作：将整数转换为字符串？C++\
  \ 提供的有用工具之一是 `stringstream`，它允许你执行各种转换活动。\n\n提示\n\n使用 `stringstream` 需要包含此头文件：`#include<sstream>`\n\
  \n列表 27.11 展示了一些简单的 `stringstream` 操作。\n\n#### 输入 ▼\n\n列表 27.11 将整数值转换为字符串表示及反之\n\
  \n```\n 0: #include<fstream>\n  1: #include<sstream>\n  2: #include<iostream>\n\
  \  3: using namespace std;\n  4:\n  5: int main()\n  6: {\n  7:    cout << \"Enter\
  \ an integer: \";\n  8:    int input = 0;\n  9:    cin >> input;\n 10:\n 11:   \
  \ stringstream converterStream;\n 12:    converterStream << input;\n 13:    string\
  \ inputAsStr;\n 14:    converterStream >> inputAsStr;\n 15:\n 16:    cout << \"\
  Integer Input = \" << input << endl;\n 17:    cout << \"String gained from integer\
  \ = \" << inputAsStr << endl;\n 18:\n 19:    stringstream anotherStream;\n 20: \
  \   anotherStream << inputAsStr;\n 21:    int copy = 0;\n 22:    anotherStream >>\
  \ copy;\n 23:\n 24:    cout << \"Integer gained from string, copy = \" << copy <<\
  \ endl;\n 25:\n 26:    return 0;\n 27: }\n```\n\n点击此处查看代码图片\n\n#### 输出 ▼\n\n```\n\
  Enter an integer: 45\nInteger Input = 45\nString gained from integer = 45\nInteger\
  \ gained from string, copy = 45\n```\n\n\n\n\n在这个示例中，你要求用户输入一个整数值。如第 12 行所示，你使用运算符\
  \ `<<` 将此整数插入到 `stringstream` 对象中。然后，你在第 14 行使用提取运算符（`>>`）将整数转换为字符串。之后，你使用该字符串作为起点，获取字符串\
  \ `inputAsStr` 中存储数值的整数表示副本。\n\n| 应该 (DO) | 避免 (DON’T) |\n| --- | --- |\n| 当你只想从文件中读取时，**务必**使用\
  \ `ifstream`。当你只想写入文件时，**务必**使用 `ofstream`。在向流中插入或从中提取之前，**记得**通过 `is_open()` 检查文件流是否成功打开。\
  \ | **不要**忘记在使用完文件流后使用 `close()` 方法将其关闭。**不要**忘记通过 `cin >> strData;` 从 `cin` 提取到\
  \ `string` 通常会导致 `strData` 仅包含到第一个空白符之前的文本，而不包含整行内容。**不要**忘记 `getline(cin, strData);`\
  \ 函数会从输入流中获取整行，包括空白符。 |\n\n### 总结\n\n本节从实用的角度教了你 C++ 流。你了解到从本书的第一开始，你一直在使用如 I/O\
  \ 流 `cout` 和 `cin` 等流。你现在知道如何创建简单的文本文件，以及如何从中读取或写入内容。你学习了 `stringstream` 如何帮助你将整数等简单类型转换为字符串，反之亦然。\n\
  \n### 问答\n\n**问** 我看到可以使用 `fstream` 同时用于向文件和读取文件，那么我什么时候应该使用 `ofstream` 和 `ifstream`\
  \ 呢？\n\n**答** 如果你的代码或模块只需要读取文件，你应该使用 `ifstream`。同样，如果它只需要写入文件，你应该使用 `ofstream`。`fstream`\
  \ 在两种情况下都可以工作，但为了确保数据和代码的完整性，最好采用类似于使用 `const` 的限制性策略（尽管这并不是强制要求的）。\n\n**问** 我什么时候应该使用\
  \ `cin.get()`，什么时候应该使用 `cin.getline()`？\n\n**答** `cin.getline()` 确保你捕获用户输入的整行内容，包括空白符。`cin.get()`\
  \ 则帮助你一次一个字符地捕获用户输入。\n\n**问** 我什么时候应该使用 `stringstream`？\n\n**答** 使用 `stringstream`\
  \ 将整数和其他简单类型转换为字符串并反之亦然，如列表 27.11 所示。\n\n### 工作坊\n\n工作坊提供了测验题来帮助巩固你对涵盖内容的理解，并提供了练习让你获得使用所学经验。在检查附录\
