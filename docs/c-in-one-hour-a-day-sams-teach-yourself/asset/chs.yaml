  \ `main()` 函数相对于其生成的输出量来说非常短。实例化 `Tuna` 类就足以生成这些行输出，这是因为在所有相关类的构造函数和析构函数中插入了 `cout`\
  \ 语句。为了理解成员变量是如何实例化和销毁的，你定义了两个哑类 `FishDummyMember` 和 `TunaDummyMember`，并在它们的构造函数和析构函数中使用了\
  \ `cout`。`Fish` 和 `Tuna` 类分别包含这两个哑类的各成员，如第 20 行和第 52 行所示。输出表明，当实例化 `Tuna` 类对象时，实例化实际上是从层次结构的顶端开始的。因此，类\
  \ `Tuna` 中的基类 `Fish` 部分首先实例化，在此过程中，类 `Fish` 的成员——即 `Fish::dummy`——首先实例化。接着执行 `Fish`\
  \ 类的构造函数，该函数在 `dummy` 等成员属性构造之后执行是正确的。基类构造完成后，`Tuna` 的实例化继续：首先实例化成员 `Tuna::dummy`，然后执行\
  \ `Tuna()` 中的构造函数。输出证明，析构的顺序恰恰相反。\n\n### 私有继承\n\n私有继承与公有继承（你目前为止看到的继承）的区别在于，在派生类声明其继承自基类的行中使用了\
  \ `private` 关键字：\n\n```\nclass Base\n{\n   // ... 基类成员和方法\n};\n\nclass Derived:\
  \ private Base // 私有继承\n{\n   // ... 派生类成员和方法\n};\n```\n\n点击此处查看代码图像\n\n基类的私有继承意味着基类的所有公共成员和属性对于任何拥有类实例的用户都是私有的（即不可访问的）。换句话说，即使是\
  \ `Base` 类的公共成员和方法只能由 `Derived` 类使用，而不能由其他拥有 `Derived` 实例的用户。\n\n这与你从 Listing 10.1\
  \ 以来一直跟的 `Tuna` 和基类 `Fish` 的示例形成鲜明对比。Listing 10.1 中的 `main()` 可以调用 `Tuna` 实例上的函数\
  \ `Fish::Swim()`，因为 `Fish::Swim()` 是公共方法，并且因为 `Tuna` 类是通过公有继承派自 `Fish` 类。\n\n因此，对于继承层次结构之外的世界，私有继承并不意味着“是一个”（is-a）关系。由于私有继承允许基类属性和方法仅供派生自基类的子类使用，这种关系被称为“包含一个”（has-a）关系。表\
  \ 10.2 列出了日常生活中你看到的几个私有继承示例。\n\n| 基类 | 派生类示例 |\n| --- | --- |\n| `Motor` (电机) |\
  \ `Car` (汽车) (`Car` 有一个 `Motor`) |\n| `Heart` (心脏) | `Mammal` (哺乳动物) (`Mammal` 有一个\
  \ `Heart`) |\n| `Bulb` (灯泡) | `Lamp` (灯具) (`Lamp` 有一个 `Bulb`) |\n\n**表 10.2** 取自日常生活的私有继承\n\
  \nListing 10.8 展示了汽车与其电机之间的私有继承关系。\n\n### 输入\n\nListing 10.8 一个通过私有继承与 `Motor` 类相关的\
  \ `Car` 类\n\n```\n0: #include<iostream>\n1: using namespace std;\n2: \n3: class\
  \ Motor\n4: {\n5: public:\n6:    void SwitchIgnition()\n7:    {\n8:       cout <<\
  \ \"Ignition ON\" << endl;\n9:    }\n10:    void PumpFuel()\n11:    {\n12:     \
  \  cout << \"Fuel in cylinders\" << endl;\n13:    }\n14:    void FireCylinders()\n\
  15:    {\n16:       cout << \"Vroooom\" << endl;\n17:    }\n18: };\n19: \n20: class\
  \ Car:private Motor // 私有继承\n21: {\n22: public:\n23:    void Move()\n24:    {\n\
  25:       SwitchIgnition();\n26:       PumpFuel();\n27:       FireCylinders();\n\
  28:    }\n29: };\n30: \n31: int main()\n32: {\n33:    Car myDreamCar;\n34:    myDreamCar.Move();\n\
  35: \n36:    return 0;\n37: }\n```\n\n点击此处查看代码图像\n\n### 输出\n\n```\nIgnition ON\n\
  Fuel in cylinders\nVroooom\n```\n\n点击此处查看代码图像\n\n### 分析\n\n第 3 到第 18 行定义的 `Motor`\
  \ 类非常简单；它有三个公共成员函数，用于切换点火、泵燃料和点火气缸。如第 20 行所示，`Car` 类使用 `private` 关键字继承自 `Motor`。因此，公共函数\
  \ `Car::Move()` 调用了来自基类 `Motor` 的成员。如果你尝试在 `main()` 中插入以下内容：\n\n```\nmyDreamCar.PumpFuel();\
  \ // 无法访问类的公共成员\n```\n\n点击此处查看代码图像\n\n它将编译失败，并产生类似于错误 `C2247: Motor::PumpFuel not\
  \ accessible because 'Car' uses 'private' to inherit from 'Motor'.` 的错误。\n\n**注意**\n\
  \n如果另一个类 `RaceCar` 必须继承自 `Car`，那么无论 `RaceCar` 和 `Car` 之间的继承性质如何，`RaceCar` 都无法访问基类\
  \ `Motor` 的任何公共成员或函数。这是因为 `Car` 和 `Motor` 之间的关系是私有继承。\n\n### 受保护继承\n\n受保护继承与公有继承的区别在于，派生类声明继承基类的行中使用了\
  \ `protected` 关键字：\n\n```\nclass Base\n{\n   // ... 基类成员和方法\n};\n\nclass Derived:\
  \ protected Base // 受保护继承\n{\n   // ... 派生类成员和方法\n};\n```\n\n点击此处查看代码图像\n\n受保护继承在以下方面与私有继承相似：\n\
  \n*   ■���它也表示一种“包含一个”（has-a）关系。\n*   ■���它也允许派生类访问 `Base` 的所有公共和受保护成员。\n*   ■���继承层次结构之外的\
  \ `Derived` 实例无法访问 `Base` 的公共成员。\n\n然而，在被继承的派生类方面，受保护继承有点不同：\n\n```\nclass Derived2:\
  \ protected Derived\n{\n   // 可以访问 Base 的公共和受保护成员\n};\n```\n\n点击此处查看代码图像\n\n受保护继承允许子类的子类（即\
  \ `Derived2`）访问基类 `Base` 的公共和受保护成员，如 [Listing 10.9](#ch10.xhtml_ch10lev3sec25）所示。如果\
  \ `Derived` 和 `Base` 之间的继承是私有的，这将是不可能的。\n\n### 输入\n\nListing 10.9 派生自 `Car` 类、再派生自\
  \ `Motor` 类的 `RaceCar` 类，使用受保护继承\n\n\n\n\n\n```\n 0: #include<iostream>\n 1: using\
  \ namespace std;\n 2:\n 3: class Motor\n 4: {\n 5: public:\n 6:    void SwitchIgnition()\n\
  \ 7:    {\n 8:       cout << \"Ignition ON\" << endl;\n 9:    }\n10:    void PumpFuel()\n\
  11:    {\n12:       cout << \"Fuel in cylinders\" << endl;\n13:    }\n14:    void\
  \ FireCylinders()\n15:    {\n16:       cout << \"Vroooom\" << endl;\n17:    }\n\
  18: };\n19:\n20: class Car:protected Motor\n21: {\n22: public:\n23:    void Move()\n\
  24:    {\n25:       SwitchIgnition();\n26:       PumpFuel();\n27:       FireCylinders();\n\
  28:    }\n29: };\n30:\n31: class RaceCar:protected Car\n32: {\n33: public:\n34:\
  \    void Move()\n35:    {\n36:       SwitchIgnition();  // RaceCar has access to\
  \ members of\n37:       PumpFuel();  // base Motor due to \"protected\" inheritance\n\
  38:       FireCylinders(); // between RaceCar & Car, Car & Motor\n39:       FireCylinders();\n\
  40:       FireCylinders();\n41:    }\n42: };\n43:\n44: int main()\n45: {\n46:  \
  \  RaceCar myDreamCar;\n47:    myDreamCar.Move();\n48:\n49:    return 0;\n50: }\n\
  ```\n\n点击此处查看代码\n\n##### 输出 ▼\n\n```\nIgnition ON\nFuel in cylinders\nVroooom\n\
  Vroooom\nVroooom\n```\n\n点击此处查看代码\n\n##### 分析 ▼\n\n`Car` 类通过 `protected` 继承自 `Motor`，如第\
  \ 20 行所示。`RaceCar` 类通过 `protected` 继承自 `Car` 类，如第 31 行所示。如你所见，`RaceCar::Move()`\
  \ 的实现使用了基类 `Motor` 中定义的公共方法。这种通过中间基类 `Car` 访问最终基类 `Motor` 的行为受 `Car` 和 `Motor` 之间关系的。如果这里是\
  \ `private` 而不是 `protected`，那么 `RaceCar` 将无法访问 `Motor` 的公共成员，因为编译器会选择相关访问说明符中限制性最大的一个。请注意，`Car`\
  \ 和 `RaceCar` 类之间的关系性质对访问基类 `Motor` 没有作用，而 `Car` 和 `Motor` 之间的关系有作用。因此，即使你将第 31\
  \ 行的 `protected` 改为 `public` 或 `private`，该程序的编译结果也将保持不变。\n\n注意\n\n仅在必须时才使用 `private`\
  \ 或 `protected` 继承。在大多数使用 `private` 继承的情况下（例如 `Car` 和 `Motor`），都存在更好的替代方案。在这种情况下，`Motor`\
  \ 可以作为 `Car` 类的成员属性，而不是超类。通过继承自 `Motor` 类，你本质上限制了 `Car` 只能有一个电机——这与将 `Motor` 类的实例作为私有成员相比，并没有显著的收益。\n\
  \n汽车已经进化了，例如混合动力汽车除了传统的发动机外还有一个电电机。当我们使用此类开发成果时，`Car` 类的继承层次将会成为一个瓶颈。\n\n注意\n\n\
  将 `Motor` 的实例作为私有成员而不是继承它，被称为*组合*（composition）或*聚合*（aggregation）。`Car` 类可能看起来所示：\n\
  \n```\nclass Car\n{\nprivate:\n   Motor heartOfCar; // 私有成员\n\npublic:\n   void\
  \ Move()\n   {\n      heartOfCar.SwitchIgnition();\n      heartOfCar.PumpFuel();\n\
  \      heartOfCar.FireCylinders();\n   }\n};\n```\n\n点击此处查看代码\n\n这是一个很好的设计，因为它允许你轻松地向现有的\
  \ `Car` 类添加更多电机作为成员属性，而无需改变其继承层次或设计。\n\n### 切片问题（Slicing）\n\n当程序员执行以下操作时会发生什么？\n\
