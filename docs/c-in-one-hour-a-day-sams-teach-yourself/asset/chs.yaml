  3. **3.** 通过简单的程序演示 `set` 不能接受重复条目，而 `multiset` 可以。\n\n## 第 20 节\n\n## STL `map`\
  \ 和 `multimap`\n\n标准模板库（STL）支持有助于需要频繁且快速查找应用程序的容器类。\n\n本节涵盖了：\n\n* STL `map`、`multimap`、`unordered_map`\
  \ 和 `unordered_multimap` 容器如何对你有帮助\n* 插入、删除和查找元素\n* 提供自定义排序谓词\n* 哈希表的工作原理基础\n\n\
  ### STL Map 类简介\n\n`map` 和 `multimap` 是键值对容器，允许基于键进行查找，如图 20.1 所示。\n\n![显示了一个标题为\
  \ Map（键值对容器，按键排序）的插图。](img/20fig01.jpg)\n\n**图 20.1** 对容器的视觉插图，每个对包含一个键和一个值。\n\n\
  `map` 和 `multimap` 的区别在于后者允许重复，而前者只能存储唯一的键。为了便于快速查找，`map` 和 `multimap` 的 STL 实现内部类似于二叉树。这意味着插入到\
  \ map 或 multimap 中的元素在插入时就已经经过排序了。这意味着与 `vector` 不同（在 vector 中位置处的元素可以被替换），map 中的元素不能被不同的值替换。这是因为\
  \ map 理想情况下希望根据其值相对于树中其他元素的大小，将其放置在可能不同的位置。\n\n提示：要使用 `std::map` 类或 `std::multimap`，请包含头文件：\n\
  \n```cpp\n#include<map>\n```\n\n### `std::map` 和 `multimap` 基本操作\n\nSTL `map` 和\
  \ `multimap` 是模板类，在使用任何成员函数之前需要实例化。\n\n#### 实例化 `std::map` 或 `std::multimap`\n\n\
  为整数作为键、字符串作为值实例化 map 或 multimap 需要对模板类 `std::map` 或 `std::multimap` 进行特化。`map` 的模板实例化需要程序员指定键类型、值类型，以及一个可选的帮助\
  \ `map` 类在插入时排序的谓词。因此，典型的 `map` 实例化语法如下：\n\n```cpp\n#include<map>\nusing namespace\
  \ std;\n...\nmap <keyType, valueType, Predicate=std::less <keyType>> mapObj;\nmultimap\
  \ <keyType, valueType, Predicate=std::less <keyType>> mmapObj;\n```\n\n点击查看代码\n\n\
  因此，第三个模板参数是可选的。当你提供键类型和值类型而忽略第三个模板参数时，`std::map` 和 `std::multimap` 默认使用 `class std::less<>`\
  \ 定义排序标准。因此，映射整数到字符串的 map 或 multimap 如下所示：\n\n```cpp\nstd::map<int, string> mapIntToStr;\n\
  std::multimap<int, string> mmapIntToStr;\n```\n\n点击查看代码\n\n列表 20.1 更详细地说明了实例化技术。\n\
  \n##### 输入 ▼\n\n列表 20.1 实例化将 `int` 键映射到 `string` 值的 map 和 multimap 对象\n\n\n\n\n\n\
  ```\n 0: #include<map>\n 1: #include<string>\n 2:\n 3: template<typename keyType>\n\
  \ 4: struct ReverseSort\n 5: {\n 6:   bool operator()(const keyType& key1, const\
  \ keyType& key2) const\n 7:    {\n 8:       return(key1 > key2);\n 9:    }\n10:\
  \ };\n11:\n12: int main()\n13: {\n14:    using namespace std;\n15:\n16:    // map\
  \ and multimap key of type int to value of type string\n17:    map<int, string>\
  \ mapIntToStr1;\n18:    multimap<int, string> mmapIntToStr1;\n19:\n20:    // map\
  \ and multimap constructed as a copy of another\n21:    map<int, string> mapIntToStr2(mapIntToStr1);\n\
  22:    multimap<int, string> mmapIntToStr2(mapIntToStr1);\n23:\n24:    // map and\
  \ multimap constructed given a part of another map or multimap\n25:    map<int,\
  \ string> mapIntToStr3(mapIntToStr1.cbegin(),\n26:                             \
  \     mapIntToStr1.cend());\n27:\n28:    multimap<int, string> mmapIntToStr3(mmapIntToStr1.cbegin(),\n\
  29:                                        mmapIntToStr1.cend());\n30:\n31:    //\
  \ map and multimap with a predicate that inverses sort order\n32:     map<int, string,\
  \ ReverseSort<int> > mapIntToStr4\n33:        (mapIntToStr1.cbegin(), mapIntToStr1.cend());\n\
  34:\n35:    multimap<int, string, ReverseSort<int> > mmapIntToStr4\n36:      (mapIntToStr1.cbegin(),\
  \ mapIntToStr1.cend());\n37:\n38:    return 0;\n39: }\n```\n\n点击此处查看代码图片\n\n#####\
  \ 输出 ▼\n\n此代码段没有产生输出。\n\n##### 分析 ▼\n\n此示例演示了实例化且没有产生输出。关注第 12 行到 39 行的 `main()`\
  \ 函数。第 17 行和 18 行展示了整数键到字符串值最简单的 `map` 和 `multimap`。第 25 行到 28 行演示了如何以另一个容器的范围范围作为输入来创建一个\
  \ `map` 或 `multimap`。第 31 行到 36 行演示了如何使用自定义的排序标准来实例化 `map` 或 `multimap`。注意，默认排序（在之前的实例化中）使用\
  \ `std::less<T>`，它按升序顺序排序元素。如果你想更改此行为，可以提供一个实现了 `operator()` 的 `class` 或 `struct`\
  \ 作为谓词。这样的谓词 `struct ReverseSort` 位于第 3 行到第 10 行，并已用于第 32 行 `map` 的实例化和第 35 行 `multimap`\
  \ 的实例化。\n\n#### 在 STL Map 或 Multimap 中插入元素\n\n大多数函数在 `multimap` 中的工作方式与在 `map` 中非常相似。它们接受相似的参数并返回相似的值类型。你可以通过使用\
  \ `insert` 成员函数在这两种容器中插入元素：\n\n```\nstd::map<int, std::string> mapIntToStr1;\n//\
  \ 使用 make_pair 函数插入键值值对\nmapIntToStr.insert(make_pair(-1, \"Minus One\"));\n```\n\
  \n点击此处查看代码图片\n\n由于这两个容器以键/值对的形式维护元素，你也可以直接提供一个初始化为要插入的键和值的 `std::pair`：\n\n```\n\
  mapIntToStr.insert(pair<int, string>(1000, \"One Thousand\"));\n```\n\n点击此处查看代码图片\n\
  \n或者，你可以使用类似数组的语法进行插入，这看起来非常用户友好，并且通过下标运算符（`[]`）支持：\n\n```\nmapIntToStr[1000000]\
  \ = \"One Million\";\n```\n\n点击此处查看代码图片\n\n你也可以将 `multimap` 实例化为 `map` 的拷贝：\n\n\
  ```\nstd::multimap<int, std::string> mmapIntToStr(mapIntToStr.cbegin(),\n      \
  \                                          mapIntToStr.cend());\n```\n\n点击此处查看代码图片\n\
  \n列表 20.2 展示了各种 `map` 和 `multimap` 实例化方法。\n\n##### 输入 ▼\n\n列表 20.2 使用 `insert()`\
  \ 的重载和通过 `[]` 运算符的数组语义在 `map` 和 `multimap` 容器中插入元素\n\n```\n 0: #include<map>\n 1:\
  \ #include<iostream>\n 2: #include<string>\n 3:\n 4: using namespace std;\n 5:\n\
  \ 6: 定义 map 和 multimap 类型以提高可读性\n 7: typedef map <int, string> MAP_INT\n 8: typedef\
  \ multimap <int, string> MMAP_INT\n 9:\n10: template <typename T>\n 11: void DisplayContents(const\
