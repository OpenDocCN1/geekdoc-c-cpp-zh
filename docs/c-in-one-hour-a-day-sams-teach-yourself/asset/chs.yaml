  \ exp)\n   {\n      int* anotherMillion = new int[1000000];\n      // 将 millionNums\
  \ 备份到磁盘\n   }\n}\n```\n\n点击此处查看代码图像\n\n## 第 29 节：C++20 概念、范围和适配器\n\n你已经学习了 C++ 编程的基础。事实上，你在理解使用标准模板库\
  \ (STL)、模板和标准库来帮助你编写高效代码方面已经超越了理论边界。现在是查看 C++20 的新增内容了。\n\n在本节中，你将学习\n\n* 概念（Concepts）的基础\n\
  * 定义自己的概念\n* 范围（Ranges）、视图（Views）和适配器（Adaptors）的基础\n* 使用适配器创建视图\n\n### 提示\n\n截至此时，流行的编译器尚未完全支持\
  \ C++20。`g++` 和 MSVC 目前对本节介绍的功能提供了最多的支持。编译器支持不断改进，使用本节描述的新 C++ 特性很重要。\n\n你还需要显式激活支持的\
  \ C++20 功能。当使用 `g++` 或 `clang++` 时，在命令行中添加 `-std=c++20`。MSVC 用户可以通过项目属性下的 C++ 语言标准启用\
  \ `/std:c++20`。\n\n### 概念 (Concepts)\n\n在 第 14 节 “宏和模板简介”中，你学习了使用模板进行泛型编程的基础。你学习了模板类可以支持不同类型的属性，模板函数可以根据实例化使用不同类型的参数，如下所示：\n\
  \n```cpp\ntemplate <typename T>\ndouble DivideNums(T dividend, T divisor)\n{\n \
  \  return (dividend / divisor);\n}\n```\n\n点击此处查看代码图像\n\n模板实例化方式如下：\n\n```cpp\n\
  double pi = DivideNums(22.0, 7.0); // 对于 float, float\n```\n\n点击此处查看代码图像\n\n显然 `DivideNums()`\
  \ 返回的是两个数字相除的结果。假设你尝试为两个 `string` 类型的元素实例化这个模板函数：\n\n```cpp\nstd::string str1, str2;\n\
  double crazyCompileErrror = DivideNums(str1, str2);\n```\n\n\n\n你最终得到了一个编译错误，指示\
  \ `string` 类型不支持运算符 `/`。然而，你理想情况下需要的是编译器在开始时就拒绝编译，并指出函数 `DivideNums()` 只能与数值类型一起使用。也就是说你希望将\
  \ `DivideNums()` 的模板实例化限制为数值类型（最好是浮点数），并且你希望编译器为你进行验证。C++20 引入了*概念（concepts）*，它们正可以帮助你恰好实现这一点。\n\
  \n你使用概念来定义控制模板类或函数可以实例化的类型的约束。编译器会为你验证这些概念并强制执行它们。此外，标准库提供了一些基础概念，如 `std::floating_point`，它可以帮助你在这种特定情况下限制模板实例化：\n\
  \n```cpp\ntemplate <std::floating_point T> // 约束 T 的概念\ndouble DivideNums(T dividend,\
  \ T divisor)\n{\n   return (dividend / divisor);\n}\n```\n\n点击此处查看代码图像\n\n如果你现在将\
  \ `DivideNums()` 函数用于非数值类型（如 `std::string`），编译器甚至不会开始在 `std::string` 类中寻找运算符 `/`。它会提供一个更简单的错误信息，在开始就告诉你为\
  \ `DivideNums()` 定义的约束尚未满足。尽管这个功能初看起来可能微不足道，但概念代表了巨大的改进，因为它们能够简单且安全地使用模板类。\n\n###\
  \ 提示\n\n要使用 C++20 概念，请包含此头文件：\n\n```cpp\n#include<concepts>\n```\n\n### 使用标准库提供的概念\n\
  \n列表 29.1 展示了一个完整的程序，该程序使用 `std::floating_point` 概念将 `DivideNums` 中使用的参数限制为浮点类型（即\
  \ `float` 和 `double`）。\n\n#### 输入 ▼\n\n列表 29.1 使用简单概念限制模板函数的参数类型为浮点数\n\n```cpp\n\
  \ 0: #include<concepts>\n 1: #include<iostream>\n 2: using namespace std;\n 3:\n\
  \ 4: template <std::floating_point T> // 强制要求浮点数\n 5: double DivideNums(T dividend,\
  \ T divisor)\n 6: {\n 7:    return (dividend / divisor);\n 8: }\n 9:\n10: int main()\n\
  \ 11: {\n 12:    cout << \"Pi = \" << DivideNums(22.0, 7.0); // OK\n 13:    // cout\
  \ << \"Pi = \" << DivideNums(22, 7); // err: 不是浮点数\n 14:\n 15:    return 0;\n 16:\
  \ }\n```\n\n点击此处查看代码图像\n\n#### 输出 ▼\n\n```\nPi = 3.14286\n```\n\n#### 分析 ▼\n\n列表\
  \ 29.1 显示了第 4 行使用的 `std::floating_point` 概念。它将 `T` 限制为浮点类型。编译器将对 `DivideNums()`\
  \ 的模板实例化进行浮点类型验证。如果你取消第 13 行的注释，你将面临编译失败，正如预期的那样，因为这一行使用非浮点数的参数调用了 `DivideNums()`。\n\
  \n表 29.1 描述了标准库提供的常用概念。\n\n| 概念 | 说明 |\n| --- | --- |\n| `integral` | 验证整数类型。示例包括\
  \ `int`、`long` 以及 `int` 和 `long` 的无符号和符号变体。 |\n| `signed_integral` | 验证符号整数类型。示例包括\
  \ `int`、`long` 和 `long long`。 |\n| `unsigned_integral` | 验证无符号整数类型。示例包括 `unsigned\
  \ int` 和 `unsigned long`。 |\n| `floating_point` | 验证浮点类型。示例包括 `float` 和 `double`。\
  \ |\n| `same_as` | 验证一个类型与另一个类型相同。 |\n| `derived_from` | 验证一个类型派生自另一个类型。 |\n| `convertible_to`\
  \ | 验证一个类型可以转换为另一个类型。 |\n\n**表 29.1** 标准库提供的关键概念\n\n### 使用关键字 `requires` 定义自定义概念\n\
  \n列表 29.1 中模板函数 `DivideNums()` 的缺点之一是它期望 `dividend` 和 `divisor` 都是相同浮点类型 `T`。也就是说，你不能用它来用\
  \ `22.0` 除以 `7` 或用 `22` 除以 `7.0`，尽管这两个操作显然都是可能的。你可以通过定义一个结合了 `floating_point` 和\
  \ `integral` 类型的概念来解决这个问题：\n\n```cpp\ntemplate <typename T>\nconcept AnyNumericType\
  \ = floating_point<T> || integral<T>;\n```\n\n点击此处查看代码图像\n\n此外，为了确保被除数和除数为不同类型，你可以在定义模板函数时使用\
  \ `requires` 关键字：\n\n```cpp\ntemplate <typename T1, typename T2>\n```\n\n使用 `requires`\
  \ 关键字在定义模板函数时，确保被除数和除数为不同类型。将这些思想整合到一个示例中，展示了你如何使用概念来限制一个或全部参数。\n\n#### 输入 ▼\n\n\
  29.2 结合多个概念为不同参数使用约束\n\n```cpp\n 0: #include<concepts>\n 1: #include<iostream>\n\
  \ 2: using namespace std;\n 3:\n 4: template <typename T>\n 5: concept AnyNumericType\
  \ = floating_point<T> || integral<T>;\n 6:\n 7: template <typename T1, typename\
  \ T2>\n 8: requires AnyNumericType<T1> && AnyNumericType<T2>\n 9: double DivideAnyNumType(T1\
  \ dividend, T2 divisor)\n10: {\n11:    return (dividend / divisor);\n12: }\n13:\n\
  14: template <same_as<T1, T2>>\n15: double IdenticalTypes(T1 dividend, T2 divisor)\n\
  16: {\n17:    return (dividend / divisor);\n18: }\n19:\n20: void DisplayNums() {\n\
  21:    cout << endl; }\n22:\n23: template <typename T, typename... Types>\n24: void\
  \ DisplayNums(T first, Types... rest) {\n25:    cout << first << \" \";\n26:   \
  \ (DisplayNums(rest), ...);\n27: }\n28:\n29: int main()\n30: {\n31:    double q1\
  \ = DivideOnlyFloat(22.0, 7.0); // OK\n32:    // double q2 = DivideOnlyFloat(22,\
  \ 7); // err: 必须是浮点数\n33:\n34:    double q3 = DivideAnyNumType(22.0, 7); // OK\n\
  35:    double q4 = DivideAnyNumType(22.0, 7.0); // OK\n36:    double q5 = DivideAnyNumType(22.0,\
  \ '7'); // OK: char 是数值\n37:    // double q6 = DivideAnyNumType(\"22.0\", 7); //\
  \ err: char* 不是数值\n38:\n39:    double q7 = IdenticalTypes(22.0, 7.0); // OK\n40:\
  \    double q8 = IdenticalTypes(22.0, 7.0); // OK\n41:    // double q9 = IdenticalTypes(22.0,\
  \ 7); // err: 类型不相同\n42:\n43:    DisplayNums(\"q1 =\", q1, \"q3 =\", q3, \"q4 =\"\
  , q4);\n44:    DisplayNums(\"q5 =\", q5, \"q7 =\", q7, \"q8 =\", q8);\n45:\n46:\
  \    return 0;\n47: }\n48: template <std::floating_point T>\n49: double DivideOnlyFloat(T\
  \ dividend, T divisor)\n50: {\n51:    return (dividend / divisor);\n52: }\n```\n\
  \n点击此处查看代码图像\n\n#### 输出 ▼\n\n```\nq1 = 3 q3 = 3.14286 q4 = 3.14286\nq5 = 3.14286\
  \ q7 = 3.14286 q8 = 3.14286\n```\n*(注：由于提供的文本片段在代码块和描述之间存在断层，译文根据上下文对代码逻辑进行了对齐和还原以确保逻辑通顺)*\n\
  \n\n\n\n\n此外，此示例在函数 `DivideIdenticalTypes()` 中演示了 `std::same_as` 概念，该函数定义在第 20 到\
  \ 25 行。第 48 行的代码演示了如何使用 `std::same_as` 来强制两个参数使用相同类型，如果其中一个是浮点类型而另一个是整数类型，则会产生编译错误。\n\
  \n### 提示\n\n注意函数 `DisplayNums()` 中变变模板的使用，该函数定义在第 27 到 34 行，并用于第 50 和 51 行。此函数用于显示字符串字面量和双精度类型。\n\
  \n编译器将省略号（`...`）识别为展开 `DisplayNums()` 的指令，并生成一个编译时的递归版本，在屏幕上打印所有参数。\n\n## 在类和对象中使用概念\n\
  \n到目前为止，你已经已经在模板函数中使用概念来学习概念的基础知识。在类上使用概念并没有太大区别。你可以在类中使用模板来泛型地编程类中包含的成员属性性质以及类中包含的方法行为。你可以使用概念来验证和约束这些模板类可以实例化的类型，如\
  \ 列表 29.3 所示。\n\n### 输入\n\n列表 29.3 使用概念约束和验证类参数\n\n```\n0: #include<concepts>\n\
  1: using namespace std;\n2:\n3: template <typename T>\n4: concept AnyNumericType\
  \ = floating_point<T> || integral<T>;\n5:\n6: template<AnyNumericType T1, AnyNumericType\
  \ T2>\n7: class Person\n8: {\n9: public:\n10:    T1 age;\n11:    T2 yearsEmployed;\n\
  12:\n13:    Person(T1 num1, T2 num2) : age(num1), yearsEmployed(num2) {}\n14: };\n\
  15:\n16: int main()\n17: {\n18:    Person<int, double> p1(2, 3.4); // OK\n19:  \
  \  Person<double, float> p2(2.6, 3.4); // OK\n20:    // Person<string, double> p3(\"\
  lara\", 3.4); // error: \"lara\" isn't numeric\n21:\n22:    return 0;\n23: }\n```\n\
  \n点击此处查看图像\n\n### 输出\n\n此代码段没有输出。\n\n### 分析\n\n第 6 行使用了熟悉的概念 `AnyNumericType<>`（最初在\
  \ 列表 29.2 中使用）来约束 `Person<>` 可以实例化的类型。基本上，你是在确保 `Person<>` 只用于数值类型，因为你不希望 `age`\
  \ 或 `yearsEmployed` 属性包含其他内容。在没有 `AnyNumericType<>` 概念约束的情况下，第 21 行也可以实例化为 `\"lara\"\
  `，这并不是你想要的。\n\n因此，概念为模板类的设计者提供了一个强大的工具，以确保类根据其用途和函数进行实例化。列表 29.4 演示了如何确保传递给函数的对象是与\
  \ `Base` 相关的类型。记住 第 10  “实现继承”中的，公有派提供了派生类和基类之间的“是一个”（is-a）关系。`derived_from<>` 验证了这种关系，对于私有继承以及无关类型，它的求值为为\
  \ `false`。\n\n### 输入\n\n列表 29.4 使用概念 `derived_from`\n\n```cpp\n0: #include<concepts>\n\
  1: #include<iostream>\n2: using namespace std;\n3:\n4: class Base {};\n5: class\
  \ PublicDerived : public Base {};\n6: class PrivateDerived : private Base {};\n\
  7: class Unrelated {};\n8:\n9: template<derived_from<Base> T>\n10: void ProcessBaseTypesOnly(T&\
  \ input)\n11: {\n12:    cout << \"Processing an instance of Base\" << endl;\n13:\
  \ }\n14:\n15: int main()\n16: {\n17:    static_assert(derived_from<PublicDerived,\
  \ Base> /* == true */);\n18:    static_assert(derived_from<PrivateDerived, Base>\
  \ == false);\n19:    static_assert(derived_from<Unrelated, Base> == false);\n20:\n\
  21:    PublicDerived d1;\n22:    PrivateDerived d2;\n23:    Unrelated u;\n24:  \
  \  ProcessBaseTypesOnly(d1); // OK, d1 is type Base\n25:    // ProcessBaseTypesOnly(d2);\
  \ // Error: d2 isn't a Base\n26:    // ProcessBaseTypesOnly(u); // Error: u is unrelated\
  \ to Base\n27:\n28:    return 0;\n29: }\n```\n\n点击此处查看图像\n\n### 输出\n\n```\nProcessing\
  \ an instance of Base\n```\n\n### 分析\n\n上面的示例使用 `derived_from<>` 来约束 `ProcessBaseTypesOnly`\
  \ 的输入参数。这确保了只有派自 `Base` 的类才能传递给函数。\n\n## Ranges 库、视图和适配器\n\n在 第 15 节 “标准库简介”中学习容器时，你看到\
  \ STL 容器一致地支持以下方法：\n\n*   `begin()`：该方法返回容器的开始。\n*   `end()`：该方法返回容器的末尾。\n\n一个*range*（范围）是集合的抽象。任何满足上述属性的集合都是范围。C++20\
  \ 引入了一个新库——ranges 库，它使用这种抽象以*views*（视图）和*adaptors*（适配器）的形式提供 STL 算法的替代方案。\n\n###\
  \ 提示\n\n要使用 ranges 库，请包含此头文件：\n\n```\n#include<ranges>\n```\n\nranges 库具有如 `ranges::range`\
  \ 等概念，你可以用它来验证集合。其中主要的 `input_range`、`output_range`、`forward_range`、`bidirectional_range`\
  \ 和 `random_access_range`，如 列表 29.5 所示。\n\n### 输入\n\n列表 29.5 使用 `std::ranges` 验证常用容器作为范围以及范围类型\n\
  \n```cpp\n0: #include<ranges>\n1: #include<vector>\n2: #include<list>\n3: #include<set>\n\
  4: #include<map>\n5: #include<stack>\n6: #include<forward_list>\n7: using namespace\
  \ std;\n8:\n9: int main()\n10: {\n11:    static_assert(ranges::range<int[5]>);\n\
  12:    static_assert(ranges::range<vector<int>>);\n13:    static_assert(ranges::range<list<int>>);\n\
  14:    static_assert(ranges::range<set<int>>);\n15:    static_assert(ranges::range<map<int,\
  \ int>>);\n16:\n17:    static_assert(ranges::forward_range<vector<int>>);\n18: \
  \   static_assert(ranges::random_access_range<vector<int>>);\n19:    static_assert(ranges::bidirectional_range<vector<int>>);\n\
  20:\n21:    //static_assert(ranges::range<stack<int>>);//err: stack isn't a range\n\
  22:    //static_assert(ranges::bidirectional_range<forward_list<int>>);//error\n\
  23:    //static_assert(ranges::random_access_range<set<int>>); // error\n24:\n25:\
  \    return 0;\n26: }\n```\n\n\n\n\n此示例使用 `static_assert` 让编译器验证概念 `std::ranges::range`、`std::ranges::forward_range`、`std::ranges::random_access_range`\
  \ 和 `std::ranges::bidirectional_range`。第 11 到 19 行演示了典型的 STL 容器如 `vector`、`list`、`set`\
  \ 和 `map` 如何符合范围（range）的标准。在第 21 行，你会发现 `stack` 并不符合。这是因为 `stack` 容器修改了底层容器（如 `vector`）的行为，以限制实现后进先出（LIFO）功能时的某些自由度。它不支持迭代，也不具备\
  \ `begin()` 和 `end()` 方法，因此它不能是一个范围。同样，第 22 行演示了 `forward_list` 不被接受为双向范围，第 23 行演示了\
  \ `std::set` 不允许对其内部元素进行随机访问。\n\n在了解了范围之后，现在让我们来看一下视图（views）和适配器（adaptors），并将它们与范围结合使用。\n\
  \n### 视图与适配器\n\n`Views` 是一种既是范围又保证常数时间拷贝、移动和赋值的范围。因此，视图是一种特殊的范围。每个视图都是范围，但并非所有范围都是视图。\n\
  \n在第 16 “STL 字符串类”中，你学习了 `std::string_view` 如何帮助查看字符串、子字符串或字符，而无需执行昂贵的复制任务。C++20\
  \ 视图在范围（或集合）上实现了类似的目标。你可以使用视图在范围上操作算法。此类算法被称为*适配器**adaptors*）。适配器返回一个由适配器执行结果产生的数据组成的视图。\n\
  \n假设你想构造一个包含输入集合中元素反序排列的视图。代码列表 29.6 演示了如何使用适配器 `std::views::reverse` 来反序查看集合——即以最后一个元素在前在前。\n\
  \n#### 输入 ▼\n\n代码列表 29.6 反序查看集合\n\n```\n 0: #include<ranges>\n 1: #include<vector>\n\
  \ 2: #include<iostream>\n 3: using namespace std;\n 4:\n 5: int main()\n 6: {\n\
  \ 7:    vector<int> nums{ 1, 5, 202, -99, 42, 50 };\n 8:\n 9:    // create a view\
  \ using adaptor reverse\n10:    auto viewReverse = nums | std::views::reverse;\n\
  11:\n12:    cout << \"View of collection in reverse: \";\n13:    // range-based\
  \ for: because, a view is also a range\n14:    for (int num : viewReverse)\n15:\
  \       cout << num << ' ';\n16:\n 17:    cout << endl << \"Original collection\
  \ (unchanged): \";\n18:    for (int num : nums)\n19:       cout << num << ' ';\n\
  20:\n 21:    return 0;\n 22: }\n```\n\n点击此处查看代码图片\n\n#### 输出 ▼\n\n```\nView of collection\
  \ in reverse: 50 42 -99 202 5 1\nOriginal collection (unchanged): 1 5 202 -99 42\
  \ 50\n```\n\n点击此处查看代码图片\n\n#### 分析 ▼\n\n此示例演示了使用适配器 `std::views::reverse` 创建一个名为\
  \ `viewReverse` 的视图。你首先在屏幕上打印该视图，然后打印原始 `vector` 容器的内容，证明了视图的创建不会以任何方式更改原始集合。如果你使用\
  \ `std::reverse()` 算法，则会更改集合。此外，第 14 行在 `viewReverse` 上使用了基于范围的 `for` 循环，正如之前解释的，视图是范围的一种特殊情况。记住，所有视图都是范围，但某些范围并不是视图。\n\
  \n### 范围库提供的适配器\n\n在代码列表 29.6 中，你看到了了如何使用适配器 `std::views::reverse` 生成一个按元素插入顺序反序的集合视图。表\
  \ 29.2 列出了 STL 提供的一些常用适配器。\n\n| 适配器 |or |\n| --- | --- |\n| `std::views::reverse`\
  \ | 以反序查看集合中的元素（即最后一个元素在前） |\n| `std::views::all` | 查看集合中的所有元素 |\n| `std::views::filter(p)`\
  \ | 仅查看满足所给谓词 `p` 的元素 |\n| `std::views::drop(n)` | 查看集合中的元素，忽略前 `n` 个元素 |\n| `std::views::take(n)`\
  \ | 查看集合中的前 `n` 个元素 |\n| `std::views::transform(f)` | 查看逐个应用于所给范围内元素的变换函数 `f` 的结果\
  \ |\n\n**表 29.2** 常用适配器\n\n代码列表 29.6 展示了如何使用这些适配器对集合生成不同的视图。\n\n\n\n\n假设你需要反转元素并识别其中的偶数。当你像如下所示地组合\
  \ `reverse` 和 `filter` 适配器时，生成这样的视图只需要一步即可完成：\n\n```cpp\nauto lambdaIsEven = [](auto\
  \ num) {return ((num % 2) == 0); };\nauto viewEvenInRev = nums | views::reverse\
  \ | views::filter(lambdaIsEven);\n```\n\n点击此处查看代码图像\n\n如果你现在打算将视图进一步限制为仅包含两个元素，你需要在链式调用中添加\
  \ `take` 适配器：\n\n```cpp\nauto viewEvenInReverseTopTwo = nums | views::reverse\n\
  \             | views::filter(lambdaIsEven) | views::take(2);\n```\n\n点击此处查看代码图像\n\
  \n代码列表 29.8 展示了这些适配器的用法。\n\n### 输入 ▼\n\n#### 代码列表 29.8 使用管道符号 (|) 组合适配器\n\n```\n\
  \ 0: #include<ranges>\n 1: #include<vector>\n 2: #include<iostream>\n 3: using namespace\
  \ std;\n 4:\n 5: concept ranges::view 将参数类型限制为 view\n 6: template<ranges::view T>\n\
  \ 7: void DisplayView(T& view)\n 8: {\n 9:    for (auto element : view)\n10:   \
  \    cout << element << ' ';\n11:\n12:    cout << endl;\n13: }\n14:\n15: int main()\n\
  16: {\n17:    vector<int> nums{ 1, 5, 202, -99, 42, 50 };\n18:    auto viewAllElements\
  \ = nums | std::views::all;\n19:    cout << \"View of all elements in the collection:\
  \ \";\n20:    DisplayView(viewAllElements);\n21:\n22:    auto lambdaIsEven = [](auto\
  \ num) {return ((num % 2) == 0); };\n23:    auto viewEvenInRev = nums | views::reverse\
  \ | views::filter(lambdaIsEven);\n24:    cout << \"View even numbers in reverse:\
  \ \";\n25:    DisplayView(viewEvenInRev);\n26:\n27:    auto viewEvenInReverseTopTwo\
  \ = nums | views::reverse\n28:               | views::filter(lambdaIsEven) | views::take(2);\n\
  29:    cout << \"View first two even numbers in reverse: \";\n30:    DisplayView(viewEvenInReverseTopTwo);\n\
  31:\n32:    return 0;\n33: }\n```\n\n点击此处查看代码图像\n\n### 输出 ▼\n\n```\nView of all\
  \ elements in the collection: 1 5 202 -99 42 50\nView even numbers in reverse: 50\
  \ 42 202\nView first two even numbers in reverse: 50 42\n```\n\n点击此处查看代码图像\n\n###\
  \ 分析 ▼\n\n第 18、23 和 27 行演示了如何组合适配器以提供你所需要的视图。使用适配器是 C++ 编程的一种新方式，起初可能看起来很陌生。然而，你很快会发现可以快速使用适配器来实现使用算法需要多个步骤才能完成的逻辑。使用算法将需要更多的代码行，而且可能较慢。视图（Views）和适配器让\
  \ C++ 代码更加直观，还能为你节省大量的代码行和处理步骤！\n\n### 总结\n\n本节让你熟悉了 C++20 引入的巨大变化，包括概念（concepts）、范围（ranges）、视图（views）和适配器（adaptors）。这些新特性并非编写良好的\
  \ C++ 程序所必须，但它们代表了语言的重大现代化。在未来几年里，你将看到越来越多的 C++ 代码采用这些变化，而你现在已经有了理解此类代码并进一步提升技能的准备。不要止于书中的示例；请在线探索\
  \ ranges 库以进一步提高你的技能。\n\n### 问答\n\n问：我无法编译本节中的示例。我从哪里做错了吗？\n\n答：在本文编写时，并不是每个编译器都能一致且完全支持\
  \ C++20 特性。此代码已使用 `g++` 版本 12.0 和 MSVC 版本 16.10 通过了成功测试。你需要在编译器中专门启用 C++20 语言特性，正如本节前面提到的。\n\
  \n问：当可以在不使用概念的情况下使用 `DisplayView()`（如代码列表 27.8 所示）时，为什么要使用概念？\n\n答：你可以编写 `DisplayView()`\
  \ 来接受一个 `auto` 参数，而不使用概念来限制参数类型，如下：\n\n```\n void DisplayView(auto& view)\n```\n\
  \n如果你使用该参数，代码列表 29.8 中的代码将可以通过编译。你甚至可以省掉一行。使用概念是可选的。\n\n\n\n\n\n# 引言\n在需要并行执行某些活动的场景下，多线程是非常用的。想象一下，某一时刻，你是\
  \ 100,000 名用户之一，正在使用一个流行的购物门户。显然，Web 服务器不能让数千名用户一直等待。Web 服务器创建多个线程来同时为多个用户。如果 Web\
  \ 服务器运行在多核处理器或多处理器云端，多线程架构就能充分利用可用基础设施的性能，并提供最佳的用户体验。\n\n多线程的另一个常见示例是应用程序在执行与用户交互（例如通过进度条）的同时，还执行一些工作。此类应用程序通常分为一个用户界面线程（负责显示和更新用户界面并接收用户输入）和一个工作线程（负责在后台执行工作）。磁盘碎片整理工具就是这样一个应用程序。当你点击开始按钮后，会创建一个工作线程，并开始扫描和碎片整理活动。同时，用户界面线程会显示进度，并提供取消碎片整理的选项。请注意，为了让用户界面线程显示进度，执行碎片整理的工作线程需要定期通信正在发生的情况。同样，为了让工作线程在您取消时停止工作，用户界面线程需要发送一个停止消息。\n\
  \n### 注意事项\n多线程应用程序通常需要线程之间相互“交谈”，以便应用程序能够作为一个整体运行。顺序也同样重要。在前面的示例中，你希望用户界面线程在碎片整理工作线程结束后再结束——而不是在此之前。在这种情况下，一个线程需要等待另一个线程。\n\
  \n这种让线程相互等待的行为被称为 `thread synchronization`（线程同步）。\n\n## 使用 C++20 线程库\nC++2020 通过辅助类\
  \ `std::jthread` 简化了多线程应用程序的编程。\n\n### 提示\n若要使用多线程功能，请包含此头文件：\n\n```cpp\n#include<thread>\n\
  ```\n\n列表 30.1 显示了一个由主线程和工作线程组成的简单应用程序。它每隔一秒在屏幕上显示一行内容。\n\n### 注意事项\n在编写本文时，流行的编译器尚未能一致地支持本节中解释的\
  \ C++20 特性。在尝试本节提供的代码示例时，请务必使用你喜欢的编译器的最新版本。不要让编译器错误让你沮丧。利用本节来理解这些特性，以便在编译器更好地支持它们时，你已经准备好使用。\n\
  \n### 提示\n记住显式激活支持的 C++20 特性。当使用 `g++` 或 `clang++` 时，在命令行中添加 `-std=c++20`。MSVC 用户可以通过项目属性下的“C++\
  \ 语言标准”选项启用 `/std:c++20`。\n\n### 输入 ▼ 列表 30.1 使用 `std::jthread` 的简单多线程应用程序\n\n```cpp\n\
  \ 0: #include<thread>\n 1: #include<stop_token>\n 2: #include<iostream>\n 3: using\
  \ namespace std;\n 4:\n 5: void ThreadFunction(std::stop_token stopSoon)\n 6: {\n\
  \ 7:    while (true)\n 8:    {\n 9:       cout << \"Worker thread: Hello!\\n\";\n\
  10:       std::this_thread::sleep_for(1s);\n11:\n 12:       if (stopSoon.stop_requested())\n\
  \ 13:       {\n 14:          cout << \"Worker thread: asked to end, bye\\n\";\n\
  \ 15:          break;\n 16:       }\n 17:    }\n 18: }\n 19:\n 20: int main()\n\
  \ 21: {\n 22:    cout << \"Main thread: Starting a worker thread\\n\";\n 23:\n 24:\
  \    // 构造线程对象（它也会开始执行）\n 25:    jthread thSayHello(ThreadFunction);\n 26:\n 27:\
  \    // 暂停主线程 5 秒\n 28:    this_thread::sleep_for(5s);\n 29:\n 30:    cout << \"\
  Main thread: Sending a stop request to worker\\n\";\n 31:    // 向子线程发送停止“请求”（不是杀死线程）\n\
  \ 32:    thSayHello.request_stop();\n 33:\n 34:    if (thSayHello.joinable())\n\
  \ 35:    {\n 36:       cout << \"Main thread: Waiting on worker to end\\n\";\n 37:\
  \       thSayHello.join(); // 等待线程结束\n 38:       cout << \"Main thread: wait has\
  \ ended. Exiting now\\n\";\n 39:    }\n 40:\n 41:    return 0;\n 42: }\n```\n\n\
  点击此处查看代码图片\n\n### 输出 ▼\n\n```\nMain thread: Starting a worker thread\nWorker thread:\
  \ Hello!\nWorker thread: Hello!\nWorker thread: Hello!\nWorker thread: Hello!\n\
  Worker thread: Hello!\nMain thread: Sending a stop request to worker\nMain thread:\
  \ Waiting on worker to end\nWorker thread: asked to end, bye\nMain thread: wait\
  \ has ended. Exiting now\n```\n\n点击此处查看代码图片\n\n### 分析 ▼\n示例中的程序包含一个主线程和一个工作线程。它每隔一秒在屏幕上显示一行。`ThreadFunction()`\
  \ 定义在第 5 到 18 行，除了输出 `Worker thread: Hello!` 外什么都没做。`main()` 在第 25 行实例化工作线程，并将 `ThreadFunction`\
  \ 传递作为参数。\n\n主线程在第 32 行发送请求工作结束的信号，`thSayHello.request_stop()`。如果第 12 行的 `stopSoon.stop_requested()`\
  \ 为真，该请求将被处理。主线程在第 37 行使用 `thSayHello.join()` 等待工作结束。第 34 行查询了 `joinable()` 方法以确保线程可以合并。\n\
  \n## 线程如何交互数据？\n线程是操作系统级的实体，用于同步它们的对象也由操作系统提供。大多数操作系统都提供*信号量*（semaphores）和*互斥锁*（mutexes）来执行线程同步活动。\n\
  \n\n\n\n你使用一个 `mutex`——即一个`互斥同步`对象——来确保一次只有一个线程访问某段代码。换句话说，mutex 用于界定一段代码，在该代码中线程必须等待，直到当前正在执行该代码的另一个线程完成并释放\
  \ mutex。下一个线程获取 mutex，完成它的工作，然后释放它。C++ 在 `std::mutex` 类中为你提供了一个 mutex 的实现，该类通过 `<mutex>`\
  \ 头文件可用。\n\n通过使用 `semaphores`（信号量），你可以控制执行某段代码的线程数量。一次只允许一个线程访问的信号量也称为`二进制信号量`。\n\
  \n## C++20 协程 (Coroutines)\n\nC++20 引入了协程作为一种帮助实现高效线程同步的替代方案。协程是可以暂停的函数；也就是说，它们的执行可以在适当的时候挂起和重启。它们与普通函数的另一个不同点是它们不使用栈。当协程被挂起时，它会将可靠地恢复执行所需的状态存储在栈之外（例如，堆或空闲存储器）。\n\
  \n### 总结\n\n多线程并不是所有场景下都是必需的，使用多线程的决定必须仔细考虑，并兼顾应用程序的目标。编写多线程应用程序需要耐心和严谨。本节让你熟悉了与多线程相关的关键术语，以便你能够在在线资源的帮助下，通过实践操作继续学习。\n\
  \n### 问答\n\n**问** 我对我的应用程序的性能非常满意。我应该仍然实现多线程功能吗？\n\n**答** 不需要，完全不需要。并不是每个应用程序都需要多线程。只有需要并发执行任务或并行为许多用户服务的应用程序才需要多线程。\n\
