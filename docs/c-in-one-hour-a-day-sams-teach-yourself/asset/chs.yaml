  \ 运算符。\n\n- 提供一个排序二元谓词——一个接受两个值作为输入并返回指示第一个值小于第二个值的布尔值的函数。\n\n大多数涉及 STL 容器的应用程序很少收集整数；相反，它们收集用户定义的类型，如\
  \ `class` 或 `struct`。[Listing 18.7] 演示了使用一个每个元素都是 `class` 类型的列表来创建联系录。\n\n\n\n\n\
  ```cpp\n 0: #include<list>\n 1: #include<string>\n 2: #include<iostream>\n 3: using\
  \ namespace std;\n 4:\n 5: template <typename T>\n 6: void displayAsContents(const\
  \ T& container)\n 7: {\n 8:    for(auto element = container.cbegin();\n 9:     \
