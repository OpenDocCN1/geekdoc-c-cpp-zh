  \ C++23\n\n你现在已经熟悉 C++ 编程。你学习了使语言现代化的最新新增：lambda 表达式、自动类型推导、范围（ranges）、视图（views）和适配器（adaptors）等。我们现在将介绍\
  \ C++20 标准引入的模块，但截至本文，这些模块尚未在流行的编译器中获得一致的支持。在结束本节之前，我们还将简要介绍 C++23 预计将带来的改进。\n\n\
  在本节中，你将学习到：\n\n*   有望取代头文件的 C++20 模块\n*   预计在 C++23 中的新功能\n*   本书之外提升你的 C++ 技能\n\
  \n### 模块\n\n模块是 C++ 最原始但最稳固的特性之一——头文件的演进。到目前，你无疑已经熟悉了诸这样的语法：\n\n```\n#include<header>\n\
  ```\n\n例如：\n\n```\n#include<iostream>\n```\n\n#### `#include<header>` 的问题\n\n`#include<header>`\
  \ 是继承自 C 的遗留。该指令由预处理器执行，并将 `<header>` 的全部内容插入到代码中声明包含的地方。当包含多个头文件时，预处理器会按照插入顺序逐行插入文本内容。头文件通常包含其他头文件，预处理器只是增加了编译器的负担。这种作为编译前驱的简单包含逻辑带来了一系列问题：\n\
  \n*   它是不智能的，多个头文件中常见的产物会被重复包含。\n*   它导致了代码爆炸，因为与正在编译的程序无关的代码也会被包含并由编译器评估。\n*  \
  \ 它显著减慢了编译时间。\n\n#### 模块\n\n模块是 C++ 最原始但最稳固的特性之一——头文件的演进。\n\n模块是模块化的代码段，每个模块都有唯一的名称。模块可以\
  \ `export` 函数、变量和类。\n\n**警告**\n\n截至本文，流行的编译器对模块的支持并不完整且存在 Bug。标准头文件如 `<iostream>`\
  \ 的模块化尚未完成。这种标准化工作预计在 C++23 完成。\n\n#### 模块模块\n\n模块有两个关键部分：\n\n*   **接口单元 (Interface\
  \ unit)**：这是声明模块外部可见内容的文件。其特征是使用声明：\n\n    ```\n    export ModuleName;\n    ```\n\
  \n    例如，在 `MyFirstModule.ixx` 中名为 `MyFirstModule` 的模块声明：：\n\n    ```\n    ////\
  \ FirstModule..xx (VCVC  名为 ixx)\n    export module MyFirstModule;\n    ```\n\n\
  \    模块选择暴露给消费者的函数和变量在接口单元中使用 `export` 关键字声明：\n\n    ```\n    export int AddIntegers(int\
  \ a, int b);\n    FuncNotVisibleOutsideModule(); // 未导出\n    ```\n\n    未导出的函数、类和变量在模块内部仍然可见且可用，但在外部不可用。\n\
  \n**提示**\n\n模块单元不能包含头文件。你可以取代之导入它们（别忘记分号！）：\n\n`import <header>;`\n\n*   **实现单元\
  \ (Implementation unit)**：这定义（即实现）接口单元中声明的函数和属性：\n\n    ```\n    // file MyFirstModule.cpp\n\
  \    module MyFirstModule;\n\n    int AddIntegers(int a, int b)\n    {\n       return\
  \ (a + b);\n    }\n    ```\n\n**提示**\n\n头文件可以包含在全局模块片段中。当模块接口单元开头为\n\n```\nexport\
  \ module; // 未提供模块名\n```\n\n随后的代码被认为是全局模块片段的一部分：\n\n\n\n\n\n```cpp\n// file MyFirstModule.ixx\n\
  export module;\n#include<header> // 在全局模块片段中\nexport module MyFirstModule;\nexport\
  \ int AddIntegers(int a, int b); // 在模块中\nMyFirstModule\n```\n\n点击此处查看代码图像\n\n你正在使用全局模块片段来包含可能需要的头文件。\n\
  \n### 使用模块\n\n在你创建模块 `MyFirstModule` 之后，你想要使用它暴露的函数。你需要在需要使用它的地方 `import` 模块：\n\n\
  ```cpp\n// main.cpp\nimport MyFirstModule;\nint main()\n{\n   int sum = AddIntegers(500,\
  \ 50); // 由 MyFirstModule 导出\n\n   // FuncNotVisibleOutsideModule(); // error：未导出，因此不可用\n\
  \n   return 0;\n}\n```\n\n点击此处查看代码图像\n\n### 提示\n\n在示例 31.1 以及你可以下载的代码文件中，有一个展示包含多个文件的模块，并演示了\
  \ `module` 定义、`export` 和 `import` 的示例。\n\n### 为什么 `import Module;` 优于预处理器 `#include<header>`\n\
  \n导入模块比使用预处理器包含头文件更高效，原因有几个：\n\n*   ■ 模块是独立编译的，这与头文件不同，头文件是由预处理器以文本的形式插入到 `.CPP`\
  \ 文件包含头文件的位置。\n*   ■ 模块之间没有依赖关系；因此，模块导入的顺序并不重要。（相比之下，在许多情况下，头文件的包含顺序是相关的。）\n*  \
  \ ■ 只有由模块导出的产物在外部才是相关的，其他产物则不是。这有助于加快编译速度。\n\n### C++23 预期特性\n\nC++ 的伟大之处之一是标准委员会非常活跃，并不断改进这种语言。在\
  \ C++20 引入的激进修订基础上，标准改进的下一波浪预计将在 C++23 中完成对这些特性的支持。\n\n>本节讨论的特性可能会进入 C++ 标准，但目前还不是其的一部分。C++23\
  \ 不一定支持此处引入的每一个特性。\n\n预计将进入 C++ 2023 修订版的关键特性包括：\n\n*   ■ 模块化标准库：在学习模块时，你可能注意到了与导入\
  \ `std.core` 相关的免声明。虽然已经引入了标准库的模块化版本，但编译器对于模块名称以及它们需要支持或导出的内容还没有明确的指导。预计 C++23 将为标准库的模块化提供清晰的说明，然后这些更改将在各个编译器和平台之间保持一致。\n\
  *   ■ 协程的库支持：在 C++20 中引入的协程有助于线程同步。然而，缺乏库的支持将阻碍其采用。这一障碍预计将在 C++23 中消除。\n\nC++23\
  \ 预计将完成 C++20 引入的特性，例如带有相关算法的完整 ranges 支持（包括来自 `<numeric>` 的算法）。C++23 还将增加对网络应用程序的支持。可能会增加对\
  \ `executors` 的支持，它们预计将管理代码（函数、方法等）的执行，包括调度和处理器细节。\n\n### 学习 C++ 并不止于此！\n\n在这些课程中，你在学习\
