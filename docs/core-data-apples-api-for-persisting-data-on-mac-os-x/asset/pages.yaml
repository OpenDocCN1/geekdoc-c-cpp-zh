  md: "In our application delegate, we need to add the method `-(BOOL)application:openFile:`\
    \ that will be called when the operating system attempts to open one of our metadata\
    \ files. In that method, we will load the metadata file into an NSDictionary and\
    \ retrieve the URIRepresentation of the NSManagedObjectID. With the NSManagedObjectID\
    \ in hand, we can load the represented Recipe entity and display it to the user.\
    \ Since we want to return from this method as quickly as possible (since the operating\
    \ system is waiting on an answer), we will display the recipe *after* we return\
    \ from this method. To do that, we wrap the call to display the recipe in a `-(void)performSelector:withObject:afterDelay`,\
    \ which will pass the recipe to the `-(void)selectRecipe:` method almost immediately\
    \ after this method returns.\n\nThe `-(void)selectRecipe:` method simply sets\
    \ the selectedObjects on the recipe’s NSArrayController to the passed-in Recipe,\
    \ which will then be reflected in the UI.\n\n```\n```objective-c\n- (void)selectRecipe:(NSManagedObject\
    \ *)recipe;\n{\n    [recipeArrayController setSelectedObjects:[NSArray arrayWithObject:recipe]];\n\
    }\n```\n```\n\nWith that code in place, we can select a recipe from Spotlight,\
    \ and our application will open with the correct recipe selected. The first part\
    \ of our OS integration is now in place.\n\n# 7.2 Integrating with Quick Look\n\
    \nThere are two different ways to implement Quick Look. The application can generate\
    \ images as part of the data bundle, or a generator can be written that will generate\
    \ the images on the fly. Storing images with the data is viable only if the data\
    \ is stored in a bundle similar to the way that Pages or Numbers does. When the\
    \ data is stored in a flat file, like our metadata files, then a generator is\
    \ the only way to integrate with Quick Look. Fortunately, writing a Quick Look\
    \ generator is only slightly more complicated than a Spotlight importer.\n\n#\
    \ Adding the Subproject\n\nJust like the Spotlight importer, the Quick Look generator\
    \ is created within its own subproject."
