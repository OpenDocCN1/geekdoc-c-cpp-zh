    \ __cmd, error);\n        return nil;\n    }\n\n    NSMutableArray *keys = [[[self\
    \ defaults] allKeys] mutableCopy];\n    for (NSManagedObject *param in params)\
    \ {\n        NSString *name = [param valueForKey:@\"name\"];\n        [keys addObject:name];\n\
    \    }\n    return keys;\n}\n```\n```\n\nLike -allParameters, -allParameterNames\
    \ is a convenience method that returns an NSArray of the keys currently set or\
    \ defaulted. Just like the -allParameters method, it retrieves all the parameter\
    \ NSManagedObject objects and loops over them. Within that loop, it adds the name\
    \ property to an NSMutableArray derived from the defaultsNSDictionary.\n\n# 12.3\
    \ Review\n\nWith this design, we can access our parameters within each document\
    \ without having to worry about the underlying structure. We also don’t need to\
    \ stop coding just to hop over and add a parameter to the object. We can work\
    \ with DocumentPreferences in the same manner that we work withNSUserDefaults.\n\
    \nThis same design can be used in a nondocument application by changing the DocumentPreferences\
    \ object into a singleton or by adding the -valueForUndefinedKey: and -setValue:forUndefinedKey:\
    \ methods directly to the NSApplication delegate along with the NSManagedObjectContext."
