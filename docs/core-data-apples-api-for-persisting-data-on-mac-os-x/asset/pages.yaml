    with Core Data. In our recipe application, we have one NSArrayController configured
    to manage RecipeIngredient objects. Based on our data model, these are child objects
    that are bound to a specific recipe. Because NSArrayController understands these
    relationships, we can configure it to pull and display only those RecipeIngredient
