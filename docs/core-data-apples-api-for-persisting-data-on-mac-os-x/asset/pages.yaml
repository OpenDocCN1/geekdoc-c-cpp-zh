- pgno: 181
  md: "the reference in our lookup dictionary. This makes sure we do not duplicate\
    \ the work and that we can refresh the object later as needed.\n\nThe other important\
    \ thing to note here is the recursion. If we create a new object, we call copyPropertiesFromObject:toObject:parent:\
    \ on that object even though that is the method that we just came from. However,\
    \ because of the parent reference, we guarantee that the copy loop never goes\
    \ back up the chain.\n\n# -objectOfType:withName:\n\nThe final method in this\
    \ copy routine is called from the -associateObject:parent: method. This method\
    \ determines whether an object already exists in the NSManagedObjectContext to\
    \ avoid duplication.\n\n```\nDownload: MultiThreading/IMPnonOperation\n\n- (id)objectOfType:(NSString*)entityName\
    \ withName:(NSString*)name\n{\n    NSFetchRequest *request = [[NSFetchRequest\
    \ alloc] init];\n    [request setEntity:[NSEntityDescription entityForName:entityName\n\
    \                                       inManagedObjectContext:[self mainContext]]];\n\
    \    [request setPredicate:[NSPredicate predicateWithFormat:@\"name == %@\", name]];\n\
    \n    NSError *error = nil;\n    id result = [[[self mainContext] executeFetchRequest:request\n\
    \                                                   error:&error] lastObject];\n\
    \n    return result;\n}\n```\n\nIn our data model, almost every object has a name\
