  md: "a method that is going to be accessed via distributed objects, we need to remember\
    \ that it is not being called locally and keep a few things in mind:\n\n+   -\
    \ The server configuration we have built in this example has one incoming socket.\
    \ That means it can process only one request at a time. If a request takes too\
    \ long (which we demonstrate in a moment), all the other clients wait in line;\
    \ this includes calls from the same client.\n+   \n+   - Although we can pass\
    \ objects by reference to the client, if those objects get passed back to the\
    \ server by reference, it can cause confusion. This is especially true when dealing\
    \ with NSManagedObject objects. Therefore, whenever we receive an NSManagedObject\
    \ back from the client, we resolve a local reference and perform any actions on\
    \ the local reference instead of trying to use the client reference a second time\
    \ on the server.\n\n# -ping Implementation\n\nThe first method I always implement\
    \ when building a distributed object application is -ping. I use this method to\
    \ test the connectivity between the client and the server. Since this method does\
    \ nothing other than print out a console message, I am guaranteed that no other\
    \ programming errors will be introduced while I test the connectivity.\n\n```\n\
    Download DistributedCDServer/AppDelegate.m\n\n```objc\n- (oneway void)ping\n{\n\
    \    NSLog(@\"%@:%s received\", [self class], _cmd);\n}\n```\n```\n\n# -allObjects\
