- pgno: 161
  md: '# Chapter 9


    # # Multithreading and Core Data


    Chances are your primary machine has at least two cores in it. I also would not
    be surprised if every machine you develop on has at least two cores or even more.
    Multithreading is soon going to be necessary for every moderately complex application
    that runs on Mac OS X. This is something that we as developers need to accept
    and plan for while developing our applications. Fortunately, there are new features
    in Mac OS X that make multithreading easier for us and less error prone.


    The problem, however, is that Core Data is not inherently thread safe. It still
    wants and expects to be run in a single thread. Therefore, when we start multithreading
    our applications, we must take care to work with Core Data properly to avoid threading
    issues.


    # ## 9.1 Why Isn’t Core Data Thread Safe?


    You may be surprised to learn that there are a lot of things in Cocoa and Objective-C
    that are not thread safe and that Core Data is only one of many. For instance,
    whenever you make a change to a GUI widget, it is recommended that you do so on
    the main thread because the UI is not thread safe.


    The biggest issue with dealing with Core Data in multiple threads is keeping the
    NSManagedObjectContext in sync. When a change is made to an NSManagedObject on
    a thread that is different from the one that created the NSManagedObjectContext,
    the context is not aware of it and can have potentially stale data. This is the
    part of Core Data that is not thread safe. The NSPersistentStore, NSPersistentStoreCoordinator,
    and NSManagedObjectModel are all perfectly thread safe, but the NSManagedObjectContext
    is not.'
  merge: -1
  img_proc: true
