    Fish & Meat, and its predicate will be as follows:


    ```

    `type == ''Fish'' || type == ''Meat''`

    ```


    The other difference between the Fish & Meat mapping and the RecipeToRecipe mapping
    is the type attribute. In the original RecipeToRecipe mapping, it was set to $source.type,
    which tells Core Data to copy over the value of the source object''s type attribute.
    In the Fish & Meat mapping, we will set it to Entrée directly. This will cause
    any Recipe entity with a Fish or Meat type to be changed to Entrée during the
    migration.


    Now when we run the application, nothing spectacular happens. The application
    opens, the data is displayed, and everything is happy without any noise. That
    is all there is to it for version 2!


    # ### What Did We Just Do?


    We have just completed a very simple data migration from version 1 to version
    2 of our data model. Now, when a user runs our application, no matter what version
    data model they have, they will automatically be upgraded to version 2 without
