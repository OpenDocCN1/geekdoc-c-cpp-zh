    ~~~objc

    PPRecipe *myRecipe = ...;

    NSString *recipeName = [myRecipe name];

    //Do something with the name

    [myRecipe setName:recipeName];

    ~~~

    ```


    # ### Primitive Access


    It should be noted that accessing the attribute via KVC or properties will trigger
    KVO notifications that the attribute has changed. There are situations where we
    do not want this to occur or where we prefer it to'
