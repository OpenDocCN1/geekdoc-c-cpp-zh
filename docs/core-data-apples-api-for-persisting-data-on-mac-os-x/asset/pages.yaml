    \ accessors exist or will exist for that ivar. In a 64-bit application, the ivar\
    \ itself is not required because the property definition handles that for us as\
    \ well. For example, if we had an object with the following header:\n\n```\n```objc\n\
    @interface MyObject : NSObject\n{\n    NSString *myString;\n}\n\n@property (retain)\
    \ NSString *myString;\n@end\n```\n```\n\nXcode would interpret it the same as\
    \ the following header:\n\n```\n```objc\n@interface MyObject : NSObject\n{\n \
    \   NSString *myString;\n}\n\n- (NSString*)myString;\n- (void)setMyString:(NSString*)string;\n\
    \n@end\n```\n```\n\nIn combination with the @property keyword, we have the @synthesize\
    \ and @dynamic keywords for use in our implementation files. @synthesize will\
    \ generate the actual accessors that the @property alludes to in the header. Therefore,\
    \ in our example MyObject.m file, we can declare the following:\n\n```\n```objc\n\
    #import \"MyObject.h\"\n\n@implementation MyObject\n\n@synthesize myString;\n\n\
    @end\n```\n```\n\nand have the same effective code as this:\n\n```\n```objc\n\
    #import \"MyObject.h\"\n\n@implementation MyObject\n\n- (NSString*)myString;\n\
    {\n    return myString;\n}\n```\n```"
