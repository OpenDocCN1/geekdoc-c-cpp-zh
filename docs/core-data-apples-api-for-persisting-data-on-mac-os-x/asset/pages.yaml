  md: "# Setting the Entity\n\nThe one thing that we must do as part of every NSFetchRequest\
    \ is define what entity we want returned from the fetch. We do this by passing\
    \ the appropriate NSEntityDescription to the NSFetchRequest. For example, if we\
    \ wanted to retrieve recipe entities, we would construct the NSFetchRequest as\
    \ follows:\n\n```\nNSManagedObjectContext *moc = [self managedObjectContext];\n\
    NSFetchRequest *request = [[NSFetchRequest alloc] init];\n[request setEntity:[NSEntityDescription\
    \ entityForName:@\"Recipe\"\n                  inManagedObjectContext:moc]];\n\
    ```\n\nIn this example code, we are constructing a new NSFetchRequest and calling\
    \ -setEntity: on it. We are using the class method -entityForName:inManagedObjectContext:\
    \ on the NSEntityDescription class to get the appropriate instance of NSEntityDescription\
    \ back for the setter.\n\n# Executing a Fetch Request\n\nOnce we have constructed\
    \ our NSFetchRequest, we need to execute it against the NSManagedObjectContext\
    \ to get back the results. Like a result set when accessing a database, an executed\
    \ NSFetchRequest will return an NSArray of entities that match our search criteria.\
    \ Since it is possible that a search will fail, the execution of an NSFetchRequest\
    \ accepts a pointer to an NSError to describe any problems that resulted from\
    \ the execution. For example, if we wanted to execute the fetch from the previous\
    \ example, we could use the following code:\n\n```\nNSManagedObjectContext *moc\
    \ = [self managedObjectContext];\nNSFetchRequest *request = [[NSFetchRequest alloc]\
    \ init];\n[request setEntity:[NSEntityDescription entityForName:@\"Recipe\"\n\
    \                  inManagedObjectContext:moc]];\n\nNSError *error = nil;\nNSArray\
    \ *results = [moc executeFetchRequest:request error:&error];\nif (error) {\n \
    \   [NSApp presentError:error];\n    return;\n}\n```\n\nIn this example, we are\
    \ calling -executeFetchRequest:error: on the NSManagedObjectContext, passing in\
    \ the NSFetchRequest and a pointer to a local NSError. If the fetch failed with\
    \ an error, then the pointer will be directed to an instance of NSError that describes\
    \ the problem, and the NSArray will be assigned to nil. In that situation, we\
    \ ask the NSApplication to present the error for us and return. If there is no\
    \ error, then we can"
  merge: -1
  img_proc: true
- pgno: 60
  md: "proceed with our code. Note that the NSArray is guaranteed to not be nil at\
    \ this point, but it could be empty if no results are returned.\n\n# # NSPredicate\n\
    \nWhen we don’t want every instance of an entity returned, we then use an NSPredicate\
