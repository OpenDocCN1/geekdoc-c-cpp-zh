  md: '# What Readers Are Saying About

    *Core Data*


    I was putting off learning Core Data—and then I saw Marcus''s book. Bought it,
    read it, learned Core Data. It even covers the hard things I really needed to
    know but weren''t well written elsewhere: things like Spotlight integration, version
    migration, syncing, and, most important for me, multithreading.


    +   ▸ **Brent Simmons**

    +     Developer, NetNewsWire


    If your application deals with data, you need Core Data. If you need Core Data,
    you need to know Marcus Zarra.


    +   ▸ **Mike Lee**

    +     Engineer, United Lemur


    At last we have a book to introduce people to this fantastic developer technology.
    Starting with a high-level overview and ending with advanced techniques, Marcus
    expertly guides developers on their journey from Core Data noob to expert.


    +   ▸ **Steve Scott (Scotty)**

    +     The Mac Developer Network


    This book does a wonderful job of leading you through Core Data''s steep learning
    curve. Even experienced Core Data developers will learn something new.


    +   ▸ **Jon Trainer**

    +     President, Outer Level


    I have been using Core Data since it was introduced, and there were still new
    techniques that I uncovered in this book.


    +   ▸ **Luis de la Rosa**

    +     Founder, Happy Apps LLC'
