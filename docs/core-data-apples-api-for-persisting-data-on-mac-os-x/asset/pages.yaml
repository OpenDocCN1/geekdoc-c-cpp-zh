    \ return NO;\n\n    NSLog(@\"Starting sync\");\n    NSPersistentStoreCoordinator\
    \ *store = [delegate persistentStoreCoordinator];\n    return [store syncWithClient:client\n\
    \                     inBackground:YES\n                           handler:self\n\
