- pgno: 33
  md: '# Chapter 3


    # # Core Data and Bindings


    Cocoa Bindings provides a lot of the magic behind Core Data. Cocoa Bindings consists
    of a number of APIs and concepts that together allow us to develop our applications
    using the Model View Controller paradigm without requiring a tight coupling of
    the three aspects.


    Cocoa Bindings allows us to design views, controllers, and models that all expect
    data in a specific format without requiring that we bind them to specific classes.
    This means we can use views in multiple places and swap out controllers and even
    models without extensive (if any) recoding.


    In this chapter, we’ll look at some of the key components of Cocoa Bindings and
    then delve into the specifics of how Core Data works with those bindings. The
    two primary APIs that we are looking into are Key Value Coding and Key Value Observing.
    Between these two APIs, we are given a tremendous amount of flexibility in our
    design. In addition, these APIs are part of the foundation that allows Interface
    Builder to function and allows us to focus on the business logic of our applications.
    Lastly, these APIs are used heavily by Core Data to allow us to focus on the business
    logic of our applications as opposed to the data layer.


    # ## 3.1 Key Value Coding


    One of the cornerstones of Cocoa Bindings is Key Value Coding (KVC). Key Value
    Coding is a way to access the attributes of an object without calling the accessors
    of that object directly. Key Value Coding is implemented through an informal protocol
    on NSObject itself and is used mainly through the getter/setter pair -valueForKey:
    and -setValue:forKey:.'
  merge: -1
