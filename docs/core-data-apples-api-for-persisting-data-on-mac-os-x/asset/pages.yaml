- pgno: 206
  md: '# Chapter 11


    # Recipe: Distributed Core Data


    Imagine if all the users in a family had our recipe application and wanted to
    be able to see everyone else’s recipes. You can probably come up with many such
    scenarios for sharing data across a local area network. If your application sits
    on a user’s desktop and laptop, then there is a fair chance that the user wants
    to keep that data in sync. Of course, this can be done with a form of cloud syncing,
    but imagine a small office environment or family of computers. Not every user
    has the same cloud account (whether it be MobileMe, Dropbox, or some other cloud
    storage), and you may not want to share the entire data set to every user. Being
    able to set up a local area sharing can solve the need to share partial or complete
    data in a local environment.


    Core Data is generally considered to be a single-user/single-application persistent
    store. However, as we explored in Chapter 10, *Core Data and iPhone*, on page
    184, Core Data can be used beyond the single-user/single-application design. In
    this chapter, we are going to explore using Core Data with distributed objects.
    Distributed objects enable a Cocoa application to call an object in a different
    Cocoa application (or a different thread in the same application). The applications
    can even be running on different computers on a network.


    To take this idea one step further, we are going to add Bonjour into the design.
    Bonjour, also known as *zero-configuration networking*, enables automatic discovery
    of computers, devices, and services on IP networks. With this combination, we
    can provide access to a Core Data repository to any client on the network “automatically”
    without user interaction.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_207_0.png)


    Figure 11.1: Distributed server UI


    Before we go into the details, I want to mention the cons for this design.


    +   - **Scalability:** This design does not scale very well at all. When we are
    working with a couple of clients on a network, then it will perform just fine.
    When we start scaling it to half a dozen or more clients, it starts to slow down
    very quickly. There are optimizations that we can do, but if you have more than
    a couple of clients, you should use a full database solution instead of Core Data.


    +   - **Threading:** Although all the calls to the server are performed on the
    main thread, calls within objects passed by reference are not by their very nature.
    Therefore, if we pass an NSManagedObject by reference to a client and that client
    makes a change to the NSManagedObject, we are in a worst-case situation with regard
    to threading.'
