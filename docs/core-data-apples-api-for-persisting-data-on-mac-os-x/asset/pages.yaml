  md: '# ## 2.6 Building the Controller Layer


    As you know from your experience developing Cocoa apps, Interface Builder is a
    very large part of any project. Now that we have built our data model and we have
    a template ready in Xcode, it is time to put together the user interface.


    I should mention two things before we get into the fun of Interface Builder:


    +   *   This is not going to be Delicious Library. We will be using standard widgets
    for our application to help keep the non-Core Data code to a minimum.

    +   *   There are a *lot* of features that we *could* add to this application
    but we won''t. Those features, although useful, will detract from our focus.


    # ### Adding Objects to the xib


    The first part of the user interface we will work on is the objects in the xib
    file. As with most applications, we need to add the AppDelegate to the xib so
    that it both will be instantiated on startup and will be properly linked into
    the application itself.


    # ### Add the AppDelegate


    Upon opening MainMenu.xib and depending on the whims of the templates within Xcode,
    the AppDelegate may already be in the xib file. If it is, great! Move on to the
    next section. If it is not, then we need to add it. 3


    To add the AppDelegate to the xib file, follow these steps:


    +   1.  Find the `NSObject` in the library palette, and drag it to the xib''s
    window.

    +   2.  Click the name of the `NSObject`, and when it is editable, change it to
    `AppDelegate`.

    +   3.  Go to the Identity tab on the Inspector palette, and change the class
    of the object from `NSObject` to `AppDelegate`.

    +   4.  Right-drag from the application to the `AppDelegate` object, and select
    `Delegate`.


    3. Please note that depending on the version of Xcode you are running, the application
    delegate could have the application name prepended to it. If it does, then please
    substitute that name for any reference to AppDelegate in this context.'
