- pgno: 19
  md: '# Joe Asks...


    # What Is One-to-Many?


    One-to-many is a database term that describes the relationship between two tables
    in the database. Normally, there are three kinds of relationships: one-to-one,
    one-to-many, and many-to-many. A one-to-one relationship means that for each record
    in the first table there can be no more than one record in the second table. In
    a one-to-many relationship, for each record in the first table, there can be more
    than one record in the second table. The last relationship type, many-to-many,
    means that for any record in the first table, there can be any number of records
    in the second table, and, likewise, for each record in the second table, there
    can be any number of records in the first table.


    # Completing the Relationship


    One rule that is often repeated by the developers of Core Data is that every relationship
    in your database should have an inverse. Although this may not make logical sense
    for the data, it is important for data integrity within Core Data. What this means
    from our programming perspective is that we need to be able to reference each
    object in the relationship from either side. Apple recommends this inverse relationship
    for many reasons, which will be discussed in greater detail throughout this book.


    To set up the inverse relationship, we select the RecipeIngredient entity and
    add a Relationship property to it just like we did in the Recipe entity earlier.
    This new Relationship property is named recipe with a destination of the Recipe
    entity. Next, we set the inverse relationship to be ingredients, which has the
    name of the relationship we set in the Recipe entity. As soon as we set the inverse
    relationship on the RecipeIngredient, the graphical view of the relationships
    will change. Instead of two lines connecting the objects, they are replaced with
    one line, making the graphical view quite useful for debugging relationship settings.
    In our current design, an ingredient can have only one recipe; therefore, we leave
    the to-many option unselected. Lastly, we set the Delete Rule setting to Nullify.
    This setting will not delete the Recipe entity when a RecipeIngredient object
    is deleted. Instead, it will just break the connection between the two.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_20_0.png)


    Figure 2.4: The managed object model (MOM)


    # Adding the Last Entity


    We have one more entity to add in this release of our recipe application. We will
    be categorizing the recipes that are added. For example, we will be separating
    desserts from appetizers, and so on. To keep these categories consistent, we store
    the actual category names in their own object. Therefore, add one more entity
    to our model called Type. This entity has only one attribute property, called
    name, which is a nonoptional string with no default value. Lastly, this entity
    has no relationships because it will be used only as a lookup to populate the
    type NSComboBox discussed in Section 2.7, Adding the Recipe Details, on page 27.


    And with that last entity, that concludes the construction of the data model for
    our application. The final result should look similar to Figure 2.4.


    # Build the Data Objects


    In other languages, or even in Cocoa applications that do not use Core Data, the
    next step would normally be to build the data objects that are associated with
    the “tables” in the “database.” Fortunately, we are working with Core Data, and
    there are no data objects to construct. As part of Core Data, defining the data
    model also defines the base data objects for us. If we need custom management
    of objects, we can extend from these, but at this point the base data objects
    (called NSManagedObject) are more than sufficient for our needs.'
  merge: -1
  img_proc: true
