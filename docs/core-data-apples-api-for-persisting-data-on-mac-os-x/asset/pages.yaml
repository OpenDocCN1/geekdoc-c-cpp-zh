  md: "# ## -createObject Implementation\n\nDownload DistributedCØServer/AppDelegate.m\n\
    \n```\n```objc\n- (byref NSManagedObject*)createObject;\n{\n    NSManagedObjectContext\
    \ *context = [self managedObjectContext];\n    NSManagedObject *object = nil;\n\
    \    object = [NSEntityDescription insertNewObjectForEntityForName:@\"Test\"\n\
    \                inManagedObjectContext:context];\n\n    return object;\n}\n```\n\
    ```\n\nThe -createObject method demonstrates a more performant distributed object\
    \ method. In this method, we again retrieve a reference to the NSManagedObjectContext\
    \ and then use that reference to create a new Test object. We create and delete\
    \ all objects on the server as opposed to pulling the NSManagedObjectContext over\
    \ to the client and trying to delete it remotely. This helps prevent any threading\
    \ issues while working with the NSManagedObjectContext.\n\n# ## -deleteObject\
    \ Implementation\n\nDownload DistributedCØServer/AppDelegate.m\n\n```\n```objc\n\
    - (oneway void)deleteObject:(byref NSManagedObject*)object;\n{\n    NSManagedObjectContext\
    \ *context = [self managedObjectContext];\n    NSManagedObject *local = [context\
    \ objectWithID:[object objectID]];\n    if (![local isDeleted]) {\n        return;\n\
    \    }\n    if (![local isInserted]) {\n        [self saveAction:self];\n    }\n\
    \    [context deleteObject:local];\n}\n```\n```\n\nThe -deleteObject is similar\
    \ to the -createObject discussed earlier. However, in this method, we need to\
    \ retrieve a local reference to a passed-in NSManagedObject. If we attempted to\
    \ delete the referenced NSManagedObject directly, the NSManagedObjectContext implodes\
    \ deep within the API. No doubt this is caused by the double proxy of looping\
    \ to the remote and then back again to the server. To solve this issue, we retrieve\
    \ the NSManagedObjectID from the referenced NSManagedObject and use it to retrieve\
    \ a local reference to the NSManagedObject via the -objectWithID: of the NSManagedObjectContext.\
    \ Once we have a local reference to the NSManagedObject, we check to see whether\
    \ it is freshly inserted or already deleted. If it is freshly inserted, we need\
    \ to persist"
