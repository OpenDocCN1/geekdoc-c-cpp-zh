  md: "data stored in a given file. It is recommended that UTIs identify the company\
    \ and application that created the data file, and like bundle identifiers, a reverse\
    \ domain name is ideal for this purpose.² Since our application uses com.progprog.grokkingrecipe\
    \ as its unique bundle identifier, we will use the same UTI as the value of the\
    \ LSItemContentTypes to identify the files.\n\n```\nDownload Spotlight/info.plist\n\
    \n```xml\n<key>CFBundleDocumentTypes</key>\n<array>\n    <dict>\n        <key>CFBundleTypeExtensions</key>\n\
    \        <array>\n            <string>grokkingrecipe</string>\n        </array>\n\
    \        <key>CFBundleTypeIconFile</key>\n        <string>icon.icns</string>\n\
    \        <key>CFBundleTypeName</key>\n        <string>Grokking Recipe</string>\n\
    \        <key>CFBundleTypeRole</key>\n        <string>Editor</string>\n      \
    \  <key>LSItemContentTypes</key>\n        <array>\n            <string>com.progprog.grokkingrecipe</string>\n\
    \        </array>\n        <key>NSPersistentStoreTypeKey</key>\n        <string>XML</string>\n\
    \    </dict>\n</array>\n```\n```\n\nThe UTExportedTypeDeclarations section is\
    \ probably very familiar. Xcode generates it to describe any file that is handled\
    \ by the application being built. The one difference is that, instead of defining\
    \ a file extension (like .txt), we are defining a UTI that is being handled by\
    \ our application. Since this UTI is unknown by the system, we need to describe\
    \ it, again in our Info.plist file.\n\n```\nDownload Spotlight/info.plist\n\n\
    ```xml\n<key>UTExportedTypeDeclarations</key>\n<array>\n    <dict>\n        <key>UTTypeConformsTo</key>\n\
    \        <array>\n            <string>public.data</string>\n            <string>public.content</string>\n\
    ```\n```\n\n2. It should be noted that bundle identifiers are in fact UTIs themselves."
