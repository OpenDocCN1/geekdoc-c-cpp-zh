- pgno: 54
  md: '# Accessing a To-One Relationship


    When we are accessing a to-one relationship, we can treat it the same as an attribute.
    For example, the relationship between Recipe and RecipeIngredient is a to-one
    relationship from the RecipeIngredient side. Therefore, if we were accessing this
    relationship from that point of view, the code would be as follows:


    ```

    NSManagedObject *ingredient = ...;

    NSManagedObject *recipe = [ingredient valueForKey:@"recipe"];

    ```


    In this example, we are using the -valueForKey: KVC method to access the relationship,
    and the NSManagedObject will return the object on the other side of the relationship,
    the Recipe entity. Likewise, to set the recipe for a RecipeIngredient, we would
    use the following code:


    ```

    NSManagedObject *ingredient = ...;

    NSManagedObject *recipe = ...;

    [ingredient setValue:recipe forKey:@"recipe"];

    ```


    # Accessing a To-Many Relationship


    The many side of a relationship is stored orderless. What this means is that each
    time we fetch the objects on the many side of a relationship, the order is not
    guaranteed, and it is probable that the order will change between fetches. However,
    we are guaranteed that each object will be included only once. In other words,
    when we access a to-many relationship using KVC, we will get an NSSet back. For
    example, if we want to access the ingredients of a recipe, we would use code similar
    to the following:


    ```

    NSManagedObject *recipe = ...;

    NSSet *ingredients = [recipe valueForKey:@"ingredients"];

    ```


    Likewise, setting the ingredients into a recipe is as follows:


    ```

    NSManagedObject *recipe = ...;

    NSSet *someIngredients = ...;

    [recipe setValue:someIngredients forKey:@"ingredients"];

    ```


    # Mutable Access of To-Many Relationships


    You might note that the NSSet we get back when accessing a to-many relationship
    is immutable. Adding an object to a to-many relationship with a mutable NSMutableSet
    would require creating a mutable copy of the NSSet, adding the new object to the
    NSMutableSet and then setting the NSMutableSet back onto the parent object. That’s
    painful and fortunately unnecessary. When we want to add an object to a to-many
    relationship,'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'we can use -mutableSetValueForKey: in the place of -valueForKey:. This will
    return an NSMutableSet for us that is already associated with the parent object
    and reduces our code to the following:


    ```

    ```objective-c

    NSManagedObject *newIngredient = ...;

    NSManagedObject *recipe = ...;

    NSMutableSet *ingredients = [recipe mutableSetValueForKey:@"ingredients"];

    [ingredients addObject:newIngredient];

    ```

    ```


    Note that we did not need to set the NSMutableSet back into the Recipe entity,
    and therefore the code to add an object to a to-many relationship is quite short.


    One important thing to notice in these relationship examples is that when we are
    updating the relationship, we are updating only one side of it. Because we defined
    these relationships as double-sided (that is, it includes an inverse relationship
    that we defined in Section 2.5, *Building the Data Model*, on page 16), Core Data
    handles keeping the integrity of the relationship intact. When we update one side
    of the relationship, Core Data automatically goes in and sets the other side for
    us.


    # ### Primitive Access


    Like accessing attributes discussed earlier, changes to a relationship will fire
    KVO notifications. Since there are situations where we would not want this to
    occur or where we would want a finer-grained control over the notifications, there
    are primitive accessors for relationships as well. However, there is no primitive
    method for retrieving an NSMutableSet for a to-many relationship. Therefore, if
    the code requires changes to a relationship with either delayed or no observations
    being fired, then we would need to use -primitiveValueForKey: to get back an NSSet,
    call -mutableCopy on the NSSet, add our new object to the NSMutableSet, and finally
    use -setPrimitiveValue:forKey: to apply the changes.


    # ### Property Accessors


    Relationships can use properties just like attributes discussed earlier. In the
    code in Section 4.1, *Mutable Access of To-Many Relationships*, on the preceding
    page, if we wanted to add a property to retrieve the RecipeIngredient relationship,
    we would declare the following property:


    ```

    ```objective-c

    @property (retain) NSSet *recipeIngredients;

    ```

    ```


    And then flag it as dynamic in the implementation file.'
  merge: -1
