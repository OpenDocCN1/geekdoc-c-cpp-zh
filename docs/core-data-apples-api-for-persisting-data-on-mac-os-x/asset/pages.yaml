  md: "# Joe Asks…\n\n# Can We Pass the NSManagedObjectContext by Reference?\n\nAlthough\
    \ this is feasible, it is not recommended. When we pass objects by reference,\
    \ a proxy object is created on the receiver that sends all messages back to the\
    \ server to be performed. This is fine for objects with low complexity, but when\
    \ dealing with highly complex objects, such as the NSManagedObjectContext, it\
    \ will perform rather poorly. During experimentation, I received some very unusual\
    \ errors deep within the Core Data API when the NSManagedObjectContext was passed\
    \ by reference. Therefore, I do not recommend this approach.\n\n```\nNSArray *objects\
    \ = [context executeFetchRequest:request error:&error];\n[request release]; request\
    \ = nil;\n\nif (error) {\n    NSLog(@\"%@%s error: %@\", [self class], _cmd, error);\n\
    \    return nil;\n}\nreturn objects;\n```\n\nIn this method, we retrieve a reference\
    \ to the NSManagedObjectContext and build an NSFetchRequest to retrieve all the\
    \ Test entities from the persistent store. If there are any errors, we log them\
    \ and return nil. Otherwise, we return the resulting NSArray.\n\nThis method,\
    \ although useful for demonstrating distributed objects and Core Data, is a very\
    \ poor performer. When we start working with tens of thousands of entities in\
    \ the persistent store, they take a long time to pass over the network. This will\
    \ hamper the performance of not just the client making the request but of every\
    \ client waiting in line to make a request on the server. If our requirements\
    \ involve data of this size, then we should consider other options. One that has\
    \ met great success is to keep a local copy of the entire repository on each machine\
    \ and when they sync to merely pass deltas back and forth instead of a true client-server\
    \ environment."
