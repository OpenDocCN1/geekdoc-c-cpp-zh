  md: "For the import, there is nothing we need to do before showing the NSOpenPanel\
    \ to the user. All of the work is done after our user has selected a file to import.\n\
    \n```\n```objective-c\n- (void)importSheetDidEnd:(NSOpenPanel*)openPanel\n   \
    \ returnCode:(NSInteger)returnCode\n    context:(void*)context\n{\n    if (returnCode\
    \ == NSCancelButton) return;\n\n    PPImportOperation *op = nil;\n    op = [[PPImportOperation\
    \ alloc] initWithDelegate:self\n                filePath:[openPanel filename]];\n\
    \n    if (!genericOperationQueue) {\n        genericOperationQueue = [[NSOperationQueue\
    \ alloc] init];\n    }\n\n    [genericOperationQueue addOperation:op];\n    [op\
    \ release], op = nil;\n}\n```\n```\n\nWhen the NSOpenPanel calls back to our AppDelegate,\
    \ we first check to see whether the user canceled the sheet. If they did not,\
    \ then we grab the filename from the NSOpenPanel and pass it into a new instance\
    \ of PPImportOperation along with a reference to the AppDelegate. After the PPImportOperation\
    \ has been initialized, we hand it off to the NSOperationQueue and return control\
    \ to the user. The rest of the import is performed within the PPImportOperation.\n\
    \n# Performing the Import Operation\n\nThe import is a fair bit more complicated\
    \ than the export. Although the concept is the same, we are copying NSManagedObject\
    \ objects from one NSManagedObjectContext to another. In this case, we need to\
    \ worry about certain objects being duplicated. We do not care if the Recipe and\
    \ RecipeIngredient objects are duplicated, but we don't want to duplicate UnitOfMeasure,\
    \ Author, or Ingredient entities. Therefore, as part of the import, whenever one\
    \ of these objects is run across, it is searched for in the primary NSManagedObjectContext\
    \ before being created.\n\nTo help keep the -main as clean as possible, a lot\
    \ of the initialization is going to be done in the -initWithDelegate:filePath:\
    \ instead."
