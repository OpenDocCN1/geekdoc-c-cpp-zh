  md: "# ## -applicationDidFinishLaunching: Implementation\n\nLike most application\
    \ delegate objects, our custom code will start in the `-applicationDidFinishLaunching:`.\
    \ The first thing that our client needs to do is find a server to connect to.\
    \ To accomplish this, we initialize an `NSNetServiceBrowser` and set our `AppDelegate`\
    \ as its delegate. We then configure it to search for our server using the `#define`\
    \ settings in the protocol that we imported. That browser will then run in the\
    \ background and start searching for servers on the local network. If it finds\
    \ a server, it will call `-netServiceBrowser:didFindService:moreComing:`.\n\n\
    ![](img/ffa5f756dbdb501d7886468ffb761ad4_219_0.png)\n\n```\n```objective-c\n-\
    \ (void)applicationDidFinishLaunching:(NSNotification*)notification\n{\n    NSNetServiceBrowser\
    \ *myBrowser = [[NSNetServiceBrowser alloc] init];\n    [myBrowser setDelegate:self];\n\
    \    [myBrowser searchForServicesOfType:kServiceName inDomain:kDomainName];\n\
    }\n```\n```\n\n# ## -netServiceBrowser:didFindService: Implementation\n\nEvery\
    \ time that the `NSNetServiceBrowser` finds a service, it will call this method.\
    \ If it finds more than one server in a single sweep of the network, then it will\
    \ call this method once per service, and the `didFindService:` will be set to\
    \ YES.\n\n![](img/ffa5f756dbdb501d7886468ffb761ad4_219_1.png)\n\n```\n```objective-c\n\
    - (void)netServiceBrowser:(NSNetServiceBrowser*)browser\n       didFindService:(NSNetService*)service\n\
    \           moreComing:(BOOL)more\n{\n    [service retain];\n    [service setDelegate:self];\n\
    \    [service resolveWithTimeout:5.0];\n    [service startMonitoring];\n\n   \
    \ [browser stop];\n    [browser release], browser = nil;\n}\n```\n```\n\nIn our\
    \ implementation, as soon as we find a server, we want to connect to it. We are\
    \ not worried about multiple servers on the network, so the first one that comes\
    \ in will do. Once we receive notice that a service matching our search criteria\
    \ is available, we start monitoring it. This will cause the `NSNetServiceBrowser`\
    \ to attempt to resolve the service. Once the service is resolved, the service's\
    \ delegate will receive notification. Therefore, we set the `AppDelegate` as the\
    \ delegate to the service. Since"
