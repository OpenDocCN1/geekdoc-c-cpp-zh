    # 8.8 Wrapping Up


    Since this book is focused on Core Data, we haven’t covered quite a few areas
    of Sync Services. For a true breadth of knowledge on this framework, you should
    research the following subjects in more depth.


    # Schema Versioning


    This subject is currently in flux and may change by the time you read this book.
    As it stands today, if your schema needs to change, then ideally all your clients
    of that data should get updated to the latest schema. If they don’t, then your
    users may get inconsistent results.


    In addition, schemas are tied to a particular version of the NSManaged-ObjectModel.
    Therefore, if the data model changes, then chances are a new schema will be needed,
    or at least it will need to reference the latest data model.'
