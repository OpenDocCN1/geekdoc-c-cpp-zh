    \ Ideally, we want to refresh the metadata files every time that the NSManagedObjectContext\
    \ is saved. To do this, we will add a new `-save:` method to our AppDelegate and\
    \ route all of our saves through it:\n\n```\n```objective-c\nDownload Spotlight/AppDelegate.m\n\
    - (BOOL)save:(NSError**)error;\n{\n    NSManagedObjectContext *moc = [self managedObjectContext];\n\
    \    if (!moc) return YES;\n\n    if (![moc hasChanges]) return YES;\n\n    //Grab\
    \ a reference to all of the objects we will need to work with\n    NSSet *deleted\
    \ = [moc deletedObjects];\n    NSMutableSet *deletedPaths = [NSMutableSet set];\n\
    \    for (NSManagedObject *object in deleted) {\n        if (![object isKindOfClass:[PPRecipe\
    \ class]]) continue;\n        [deletedPaths addObject:[object valueForKey:@\"\
    metadataFileName\"]];\n    }\n\n    NSMutableSet *updated = [NSMutableSet setWithSet:[moc\
    \ insertedObjects]];\n    [updated unionSet:[moc updatedObjects]];\n\n    //Save\
    \ the context\n    if (![moc save:error]) {\n        return NO;\n    }\n    return\
