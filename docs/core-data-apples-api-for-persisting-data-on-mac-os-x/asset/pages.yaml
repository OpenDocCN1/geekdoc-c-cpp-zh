    \ to wrapper and path to Contents/Library/Spotlight.\n\n3. For more information\
    \ on UTIs, I suggest reviewing http://developer.apple.com/documentation/Carbon/Conceptual/understanding_uti/understand_uti_intro/chapter_1_section_1.html#//apple_ref/doc/uid/TP40001122\n\
    \n4. It is actually possible to include the plug-in as part of the main application\
    \ project, but I have found that to be a complete mess and more hassle than it\
