  md: "Our DocumentPreferences object expects to receive a reference to its NSPersistentDocument\
    \ upon initialization. From the passed-in reference, our DocumentPreferences will\
    \ be able to access the underlying NSManagedObjectContext. We could also just\
    \ incorporate this design directly into a subclass of NSPersistentDocument; however,\
    \ that can cause the document object to become quite large and difficult to maintain.\
    \ Therefore, even though there is a one-to-one relationship between NSPersistentDocument\
    \ objects and DocumentPreferences objects, we keep them separate to reduce code\
    \ complexity.\n\nThe one thing that's missing from this header file is any way\
    \ to access the parameters themselves. There are no methods for this access because\
    \ we are going to take advantage of KVC. Whenever another piece of code requests\
    \ a parameter from our DocumentPreferences object, the `-valueForUndefinedKey:`\
    \ method will get called, and that is where we handle access to the parameters\
    \ table.\n\n# **-valueForUndefinedKey:**\n\n```\n    - (id)valueForUndefinedKey:(NSString*)key\n\
    \    {\n        id parameter = [self findParameter:key];\n        if (!parameter\
    \ && [[self defaults] objectForKey:key]) {\n            return [[self defaults]\
    \ objectForKey:key];\n        }\n        return [parameter valueForKey:@\"value\"\
    ];\n    }\n```\n\nIn this method, we receive the name of the value that the caller\
    \ is attempting to retrieve. We use this name to retrieve the NSManagedObject\
    \ via the `-findParameter:` method and return the NSManagedObject object's value\
    \ property. If there is no parameter with the passed-in name, then we check the\
    \ defaults NSDictionary to see whether there is a default for it. If there is\
    \ no default set, we let the `-valueForKey:` method return nil to the caller.\n\
    \n# **-findParameter:**\n\n```\n    - (NSManagedObject*)findParameter:(NSString*)name;\n\
    \    {\n        NSManagedObjectContext *moc;\n        NSManagedObject *param;\n\
    \        NSError *error = nil;\n        moc = [[self associatedDocument] managedObjectContext];\n\
    ```"
