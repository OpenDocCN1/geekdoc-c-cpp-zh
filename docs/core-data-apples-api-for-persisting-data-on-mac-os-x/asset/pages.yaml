    # ### NSTableView


    In our recipe application, we make heavy use of the *NSTableView*. In the main
    window of our application, we have two table views, one to list all of the recipes
    and another to list the ingredients for those recipes. Whenever an application
    needs to display a list of items or a grid of data, the *NSTableView* is the element
    to use.


    *NSTableView*, like *NSOutlineView* (as discussed in Section 3.4, *NSOutlineView*,
    on page 46), plays very nicely with Core Data. This is especially true when the
    *NSTableView* is backed by an *NSArrayController* that is feeding the data. However,
    it is possible to use *NSTableView* with a custom data source if that is appropriate
    for the problem at hand. However, when bound with an *NSArrayController*, then
    the *NSTableView* can be manipulated with other objects such as the *NSSearchView*
    discussed in a moment to produce interfaces that integrate smoothly and give a
    great user experience.


    In an *NSTableView*, like the *NSOutlineView*, we do not actually bind the table
    itself to the *NSArrayController*. Instead, we select each column individually
    and bind it to a property of the objects in the *NSArrayController* (see Figure
    3.1). As we did in Chapter 2, *Getting Started with Core Data*, on page 14, we
    bind the column to the *arrangedObjects* controller key and the model key path
    to the value we want displayed in that column, as shown in Figure 3.2, on the
    following page.'
