    Now that we have some metadata to work with, it is time to build the Spotlight\
    \ importer. To start off this part of the application, we need to first address\
    \ UTIs.\n\n# ## Uniform Type Identifiers (UTIs)\n\nBoth Spotlight and Quick Look\
    \ use UTIs rather than filename extensions to connect files on disk with (Spotlight)\
