- pgno: 147
  md: '# ManagedObjectModels Key


    The ManagedObjectModels key is an array of file references pointing to .mom files.
    Note that this key will not accept versioned managed object model bundles, and
    therefore we need to point to a specific version of our model. Since we are currently
    on version 3 of the model, we will point this to that model. This key can accept
    more than one model, so if we had split up our data model into multiple managed
    object model files, we would add all of them here.


    # Name Key


    This name attribute refers to the name of the *schema* as opposed to the name
    of the data. This name is used internally in Sync Services and is not exposed
    to the user at all. Since we have only one data class in our application, we can
    name the schema the same as the data class, com.pragprog.GrokkingRecipes.


    # Localizing Schema strings


    Although our application is not localized for any language other than English,
    we need to create a strings file for the sync schema. This localization file will
    translate the unique identifiers into human-readable names when Sync Services
    displays information about our data. Just like other localization files, this
    file is a list of name–value pairs with the unique names of our data class, entities,
    attributes, and relationships as the name half and the human-readable counterpart
    as the value.


    ```

    /* Localized strings for GrokkingRecipes */


    "com.pragprog.GrokkingRecipes" = "Grokking Recipes";


    "com.pragprog.GrokkingRecipes.Author" = "Author Entity";

    "com.pragprog.GrokkingRecipes.Author/name" = "Author Name";


    "com.pragprog.GrokkingRecipes.Ingredient" = "Ingredient Entity";

    "com.pragprog.GrokkingRecipes.Ingredient/cost" = "Cost";

    "com.pragprog.GrokkingRecipes.Ingredient/name" = "Ingredient Name";

    "com.pragprog.GrokkingRecipes.Ingredient/quantity" = "Quantity";


    "com.pragprog.GrokkingRecipes.Recipe" = "Recipe Entity";

    "com.pragprog.GrokkingRecipes.Recipe/type" = "Recipe Type";

    "com.pragprog.GrokkingRecipes.Recipe/desc" = "Description";

    "com.pragprog.GrokkingRecipes.Recipe/lastUsed" = "Last Used";

    "com.pragprog.GrokkingRecipes.Recipe/name" = "Recipe Name";

    "com.pragprog.GrokkingRecipes.Recipe/serves" = "Serves";


    "com.pragprog.GrokkingRecipes.RecipeIngredient" = "Quantity Entity";

    "com.pragprog.GrokkingRecipes.RecipeIngredient/quantity" = "Quantity";

    ```'
