    \ MyObject\n\n    @synthesize myString = _myString;\n\n    @end\n```\n\n# ## 3.2\
    \ Key Value Observing\n\nKey Value Observing (KVO) is the sister API to KVC. KVO\
    \ allows us to request notifications when an attribute has changed. By observing\
    \ attributes on an object, we can react when those attributes are changed. KVO\
    \ is also implemented via an informal protocol on the `NSObject`, and you register\
    \ and remove observers using `-addObserver:forKeyPath:options:context:` and `-removeObserver:forKeyPath:`.\
    \ Although, like KVC, there are other methods involved in the protocol, these\
    \ are the primary two used.\n\nIf we wanted to observe the name value on a recipe,\
    \ we would add ourselves (or another object) as an observer for that value like\
    \ this:\n\n```\n    static NSString *kPragProgObserver = @\"PragProgObserver\"\
    \n    id myRecipe = ...\n    [myRecipe addObserver:self\n            forKeyPath:@\"\
    name\"\n               options:(NSKeyValueObservingOptionNew|NSKeyValueObservingOptionOld)\n\
    \               context:kPragProgObserver];\n```\n\nWhat this snippet of code\
    \ is doing is adding self as an observer to the `myRecipe` object and asking that\
    \ when the name value changes to please notify self of that change and include\
    \ both the old value and the new value in that notification. We pass along a context\
    \ so that we can ensure we are acting on observations meant only for us and that\
