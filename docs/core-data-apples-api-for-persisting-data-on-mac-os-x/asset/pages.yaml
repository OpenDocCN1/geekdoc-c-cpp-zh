- pgno: 72
  md: '# # Versioning and Migration


    Just like a battle plan, no code base ever survives contact with users. As soon
    as users start to use an application, they want to change it. Even if the code
    is just for ourselves, we, also as users, will want to change things. For example,
    we may need to add an attribute, add a new object, or just restructure things
    to accommodate those changes. Those changes can be quite involved and invariably
    will require a change to how the data is stored. Although the data migration will
    work even if there is no data stored, it is more useful going forward to have
    some data to work with. Therefore, if you have not added any recipes yet, I recommend
    doing so before we proceed.


    Starting with Mac OS X 10.5 Leopard, Apple has made data migration nearly trivial
    for users of Core Data. When developing for Leopard, versioning is included in
    the Core Data API, and with a relatively small amount of effort on our part as
    the developer, we can easily migrate our data stores from one version to another.
    Depending on the complexity of the migration, the effort required of us, the developer,
    can be trivial to rather complex.


    Taking the project that we started with in Chapter 2, *Getting Started with Core
    Data*, on page 14, we will be adding some additional features to it in succeeding
    versions. In version 2, we will add the ability to tag an author to a recipe as
    well as tag a “last used” date. That way, we know who created the delicious dish
    as well as the last time we made it. We certainly wouldn’t want to accidentally
    make the same dish two days in a row! Lastly, we will remove the Meat and Fish
    entries from the `Type` attribute of the `Recipe` entity. Any recipe entries that
    are flagged with Meat or Fish will be updated to Entrée instead.'
