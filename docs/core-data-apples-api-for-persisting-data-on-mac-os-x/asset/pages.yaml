- pgno: 97
  md: '# Atomic Stores


    Atomic stores include XML, binary, and custom data stores. All of these stores
    are written to disk atomically; in other words, the entire data file is rewritten
    on every save. Although these store types have their advantages, they do not scale
    as well as the SQLite store. In addition, they are loaded fully into memory when
    they are accessed. This causes atomic stores to have a larger memory footprint
    than a SQLite store.


    However, because they reside completely in memory while the application is running,
    they can be very fast since the disk is hit only when the file is read into memory
    and when it is saved back out. SQLite, although still considered a fast store,
    is slower when dealing with smaller data sets because of its inherent disk access.
    That said, the differences are measured in fractions of a second, so we cannot
    expect a large speed increase by using an atomic store. But if fractions of a
    second matter, it may be something to consider.


    When deciding between a binary store and an XML store, the format on disk should
    be considered. When working with a binary format, the only way to review the data
    is via Core Data. XML, on the other hand, can be reviewed with any text editor,
    which makes it a superior choice during development.


    # SQLite Persistent Store


    The single biggest performance boost that we can make to our application is to
    switch its persistent store type from XML to SQLite. SQLite is a software library
    that implements a self-contained, serverless, zero-configuration, transactional
    SQL database engine. SQLite is the most widely deployed SQL database engine in
    the world. The source code for SQLite is in the public domain.


    # Better Scaling


    By utilizing a relational database as the persistent store, we no longer need
    to load the entire data set into memory to work with it. Because the data is being
    stored in a relational database, our application can scale to a very large size.
    SQLite itself has been tested with data sets measured in terabytes and can handle
    just about anything that we can realistically develop. Since we are loading only
    the data we want at a particular moment, SQLite keeps the memory footprint of
    our application quite low. Likewise, SQLite makes efficient use of its disk space
    and therefore has a small footprint on disk as well.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# ### More Performance-Tuning Options


    By working with a database instead of a flat file, we have access to many more
    performance-tuning options. For example, we can index the columns within our entities
    to enable faster predicates. We can also control exactly what gets loaded into
    memory. It is possible to get just a count of the objects, just the unique identifiers
    for objects, and more. This flexibility allows us to tune the performance of our
    application more than any other store type. Because the SQLite store is the only
    format that is not fully loaded into memory, we get to control the data flow.
    All of the other formats require that the entire data file be loaded into memory
    before they can be used. The details of how to utilize these features are discussed
    in Section 6.3, *Fetching*, on page 104.


    # ## 6.2 Optimizing Your Data Model


    When we are designing our data model, we need to consider several factors. Where
    we put our binary data can be extremely important because its size and storage
    location will play a key role in the performance of our application. Likewise,
    relationships must be carefully balanced and used appropriately. Also, entity
    inheritance, a powerful feature of *Core Data*, must be used with a delicate hand
    because the underlying structure may be surprising.


    Although it is easy to think of *Core Data* as a database API, we must remember
    that it is not and that structuring the data with data normalization may not yield
    the most efficient results. In many cases, denormalizing the data can yield greater
    performance gains.


    # ### Where to Put Binary Data


    One of the easiest ways to kill performance in a *Core Data* application is to
    stick large amounts of binary data into frequently accessed tables. For example,
    if we were to put the pictures of our recipes into the recipe table, we would
    start seeing performance degradation after only a couple hundred recipes had been
    added. Every time we accessed a `Recipe` entity, we would have to load its image
    data, even if we were not going to display the image. Since our application displays
    all the recipes in a list, this would mean that every image would reside in memory
    immediately upon launch and would remain there until the application quit. Imagine
    this situation with a few thousand recipes!'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# ### Joe Asks...


    # #### What Is a Fault?


    Core Data faults are similar to virtual memory page faults. Faulted objects are
    scoped objects that may or may not actually be in memory, or “realized,” until
    you actually use them. Although there is no guarantee for when a faulted NSManagedObject
    will be loaded into memory, it is guaranteed to be loaded when accessed. However,
    the object will be an instance of the appropriate class (either an NSManagedObject
    or the designated subclass), but its attributes are not initialized.


    But where do we draw the line? What is considered a small enough piece of binary
    data to fit into a table, and what should not be put into the repository at all?


    # ### Small Binary Data


    Anything smaller than 100 kilobytes is considered to be small binary data. Icons
    or small avatars are a couple examples of data of this size. When working with
    something this small, it is most efficient to store it directly as a property
    value in its corresponding table. The performance impact of binary data this size
    is negligible. The transformable attribute type is ideal for this use.


    # ### Medium Binary Data


    Medium binary data is anything that is larger than 100 kilobytes and smaller than
    1 megabyte in size. Average-sized images and small audio clips are a few examples
    of data in this size range. Data of this size can also be stored directly in the
    repository. However, the data should be stored in its own table on the other end
    of a relationship with the primary tables. This allows the binary data to remain
    a fault until it is actually needed. In the previous recipe example, even though
    the Recipe entity would be loaded into memory for display, the image would be
    loaded only when it is needed by the UI.


    SQLite has shown itself to be quite efficient at disk access. There are cases
    where loading data from the SQLite store can actually be faster than direct disk
    access. This is one of the reasons that medium binary data can be stored directly
    in the repository.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_100_0.png)


    # Large Binary Data


    Large binary data is anything greater than 1 megabyte in size. Large images, audio
    files, and video files are just some examples of data of this size. Any binary
    data of this size should be stored on disk as opposed to in the repository. When
    working with data of this size, it is best to store its path information directly
    in the primary entity (such as the Recipe entity) and store the binary data in
    a known location on disk (such as in the Application Support subdirectory for
    your application).


    # Entity Inheritance


    Entity inheritance is a very powerful feature within Core Data. It allows you
    to build an object-like inheritance tree in your data model. However, this feature
    comes at a rather large cost. For example, let’s look at an example model that
    makes moderate use of entity inheritance, as shown in Figure 6.1.


    The object model itself looks quite reasonable. We are sharing name, desc, and
    a one-to-many relationship to the ImageEntity. However, the underlying table structure
    actually looks like Figure 6.2, on the following page. The reason for this is
    how Core Data handles the object model to relational table mapping. Instead of
    creating one table for each child'
  merge: -1
  img_proc: true
