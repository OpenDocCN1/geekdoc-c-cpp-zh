- pgno: 56
  md: '# ## Subclassing NSManagedObject


    Although NSManagedObject provides a tremendous amount of flexibility and handles
    the majority of the work a data object normally does, it does not cover every
    possibility, and there are occasions where we would want to subclass it. Subclassing
    to gain @property access to attributes and relationships is one common situation,
    but we may also want to add other convenience methods or additional functionality
    to the object. When this arises, there are some general rules to remember.


    # ### Methods That Are Not Safe to Override


    In Apple’s documentation, the following methods should never be overridden:


    -primitiveValueForKey:, -setPrimitiveValue:forKey:, -isEqual:, -hash, -superclass,
    -class, -self, -zone, -isProxy:, -isKindOfClass:, -isMemberOfClass:, -conformsToProtocol:,
    -respondsToSelector:, -retain, -release, -autorelease, -retainCount, -managedObjectContext,
    -entity, -objectID, -isInserted, -isUpdated, -isDeleted, -isFault, -alloc, -allocWithZone:,
    -new, +instancesRespondToSelector:, +instanceMethodForSelector:, -methodForSelector:,
    -methodSignatureForSelector:, and -isSubclassOfClass:.


    That’s quite a list! Most, if not all, of these are common sense, and experience
    with Objective-C explains why these should not be overridden. Even though this
    is a fairly long list, I would add a few more.


    -initXXX. There is really no reason or benefit to overriding the -init methods
    of an NSManagedObject, and there are situations where doing so will have unpredictable
    results. Although it is not specifically against the documentation to override
    the -init methods, I recommend strongly against it. The -awakeFromInsert and -awakeFromFetch
    methods provide sufficient access that overriding -init is unnecessary. Both -awakeFromInsert
    and -awakeFromFetch are discussed in more depth later in this chapter.


    All the KVO methods. The documentation flags these methods as “discouraged,” but
    I would put them in the “do not subclass” list. Again, there is no reason to override
    these methods, and any logic that you would want to put into them can probably
    be put somewhere else with fewer issues.


    -description. The -description method is used in logging fairly often. It is a
    great way to dump the contents of an object out to the logs during debugging.
    However, when we are dealing with faults (discussed in'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Chapter 6, *Performance Tuning*, on page 97), we do not want to fire a fault
    in the `-description` method. Since the default implementation of `-description`
    does the right thing with regard to faults, it is best that we not try to override
    its behavior.


    `-dealloc` is normally the place that we release memory before the object is being
    freed. However, when we are dealing with `NSManagedObject` objects, it is possible
    that the object will not actually be released from memory when we think it will.
    In fact, the `-dealloc` method may never get called in the life cycle of our application!
    Instead of releasing objects in the `-dealloc` method, it is recommended that
    we use `-didTurnIntoFault` as our point of releasing transient resources. `-didTurnIntoFault`
    will be called whenever the `NSManagedObject` is “faulted,” which occurs far more
    often than the object actually being removed from memory.


    `-finalize` is on the list for the same reason as `-dealloc`. When dealing with
    `NSManagedObject` objects, `-finalize` is not the proper point to be releasing
    resources.


    # ## Methods to Override


    With the long list of methods that we should not override, what methods should
    we consider overriding? There are a few where it is common to override them.


    # ### `-didTurnIntoFault`


    This method is called after the `NSManagedObject` has been turned into a fault.
    It is a good place to release transient resources. One important thing to note
    is that when this method is called, all the stored values/relationships in the
    `NSManagedObject` are already out of memory. If you access any of them, it will
    fire the fault and pull them all back into memory again.


    # ### `-willTurnIntoFault`


    Similar to `-didTurnIntoFault`, this method is called just before the `NSManagedObject`
    is turned into a fault. If your code needs to access attributes or relationships
    on the `NSManagedObject` before it is turned into a fault, then this is the entry
    point to use. Transient resources that impact attributes and relationships should
    be released here.'
  merge: -1
  img_proc: true
