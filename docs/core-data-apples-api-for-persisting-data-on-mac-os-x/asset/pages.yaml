- pgno: 113
  md: '# Chapter 7


    # # Spotlight, Quick Look,

    and Core Data


    Developing for Mac OS X is about functionality meeting quality. When our applications
    have either without the other, we leave our users wanting more. They may not be
    able to define it, but “something” will be missing. Spotlight and Quick Look integration
    are two of those things that users don’t look for when trying a new application
    but are pleasantly surprised by them when they stumble upon them. Surprisingly,
    not a lot of developers handle this integration. Perhaps it is because Spotlight
    does not get along with Core Data very well. Perhaps the feature is too new. But
    one thing is for certain—integrating with Spotlight is the right move going forward.
    Spotlight is here to stay, and users will be using it more often and in more creative
    ways.


    Unfortunately, for technical reasons, Spotlight and Core Data are at odds with
    each other. Spotlight works on the metadata of individual files, and Core Data
    stores everything in a single file. Because Spotlight is designed to work with
    the metadata of a file to discover things about the file, it will not work very
    well with a single file design such as Core Data. When Tiger was first released,
    there were a number of applications (such as Entourage) that, because of their
    single file design, did not play nicely with Spotlight. In fact, Apple rearchitected
    Mail for that reason.


    The incompatibility between Spotlight and Core Data is corrected in Snow Leopard
    but unfortunately it’s Snow Leopard only and not backward compatible with plain
    old vanilla Leopard. How? It’s in a manner that is very similar to the solution
    described in this chapter.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Should I Just Use Separate Files?


    Throughout this book, the application we are designing uses a single Core Data
    file. This is done for the sake of clarity and focus on Core Data. Depending on
    the application that is being designed, it is highly likely that it will be document
    based, and therefore it would be appropriate to have one Core Data repository
    per document. In that situation, Spotlight and Quick Look can be a lot easier
    to integrate.


    However, for applications that are not document based, then it is preferable to
    use a single Core Data repository as opposed to individual files. Although individual
    files will make Spotlight easier to work with, it would be the tail wagging the
    dog. The main focus of object persistence (in other words, data files) is to quickly
    and easily access the data in a logical and reproducible manner. Core Data solves
    all those problems quite neatly with the unfortunately minor side effect of not
    being fully compatible with Spotlight.


    In this chapter, we will integrate Spotlight into our recipes application. Once
    we are done, our users will be able to search for *Pot Roast* and find it in our
    application. In addition, when they select that search result, our application
    will not only open but open to Pot Roast. While we are solving the Spotlight issue,
    we are also going to take a look at Quick Look. Although on the surface these
    two technologies appear to be completely different, they are handled in a very
    similar fashion by Mac OS X and the Finder. And although it is not 100 percent
    appropriate for our sample application (since we have only a single data file
    and that data file is hidden away in the Library/Application Support directory),
    it is very useful to understand how Quick Look works for document-based Core Data
    applications because it makes them easier to find in Finder, Spotlight, Time Machine,
    Mail, and many other applications. Lastly, Quick Look and Spotlight integrate
    rather well together. If our users activate Quick Look on a Spotlight result,
    we want them to see information about the recipe, not a picture of a generic file.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 7.1  Integrating with Spotlight


    The issue, as mentioned, is one of multiple files. Ideally, for our recipe application,
    we want one Spotlight “record” for each recipe in our Core Data repository. For
    Spotlight to work properly, we would need one file on the disk for each recipe
    along with its associated metadata. Therefore, to make Spotlight happy, we will
    do exactly that. However, since all our data is being stored in a Core Data repository,
    there is no reason to store any data in these files. These additional files exist
    purely for Spotlight (and Quick Look) to utilize. Since Spotlight does not need
    any data in the files to work (it just needs metadata), we will create very simple
    files and link them back to our Core Data repository.


    The other gotcha with Spotlight is that the importer needs to be as fast as possible.
    What might be acceptable for processing one file or ten files is not going to
    fly when Spotlight has to chug through thousands of files. Since the same importer
    that we are writing for use inside our application could potentially be used in
    a server situation, it needs to be as fast as we can make it. Therefore, we will
    cheat a bit. Instead of looking up the metadata in our Core Data repository upon
    request from Spotlight, we will instead store that metadata in the files we are
    creating for Spotlight. That way, our importer has to touch the metadata files
    only and does not need to initialize the entire Core Data “stack” (NSManagedObjectContext,
    NSPersistentStoreCoordinator, and NSManagedObjectModel).


    # Creating the Metadata Files


    We first need to produce and update the metadata files on the fly. To keep them
    as simple as possible, we will just use plist files as opposed to a binary representation
    or some other format. Since NSDictionary understands plist files, it will reduce
    the amount of overhead we have for loading and saving the files.


    To begin with, we will create our first NSManagedObject subclass. This subclass
    will handle producing the NSDictionary that will contain all the metadata. Since
    we are creating a subclass, we might as well implement some of the properties
    we will be using to reduce the code complexity and make it easier to maintain.'
  merge: -1
  img_proc: true
