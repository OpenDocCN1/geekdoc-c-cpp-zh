  md: 'not using Core Data, we would be describing every entity, attribute, and relationship
    inside of the sync schema. Fortunately, since we are using Core Data, that part
    is not necessary. What this leaves to be included in the schema is to define the
    data classes, the localization, and the icon to be used by Sync Services whenever
