    \ Spotlight importer, as shown in Figure 7.2, on the next page. We want to save\
    \ this project in a directory inside our primary recipe project. Don’t be too\
    \ clever. Give the subproject an obvious name like SpotlightPlugin, and include\
    \ it with the Spotlight example project. To make Xcode build this plug-in every\
