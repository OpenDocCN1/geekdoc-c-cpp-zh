    # ## 4.7 Fetched Properties


    In addition to NSFetchedRequest objects, we have the ability to define a lazy
    relationship between objects. Fetched properties are kind of a cross between relationships
    and the NSFetchedRequest. A fetched property is not a relationship in the strictest
    sense and is not realized until the property is requested. When the property is
    accessed, Core Data performs the underlying NSFetchedRequest and returns the result.
    Unlike a normal relationship, a fetched property is returned as an NSArray as
    opposed to an NSSet.


    In practice, I have found fetched properties to be less useful and less flexible
    than creating either a stored fetch request or building the fetch request in code.
    Usually when a situation calls for a fetched property, it tends to be easier to
    subclass the entity in question, perform an NSFetchedRequest in code, and return
    the results.'
