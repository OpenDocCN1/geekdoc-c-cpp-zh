    \                                 inManagedObjectContext:moc];\n[param setValue:value\
    \ forKey:@\"name\"];\nreturn param;\n}\n```\n```\n\nThe -createParameter: method\
    \ creates a new NSManagedObject and sets the name property with the passed-in\
    \ value. It does not set the value property, leaving that up to the caller. This\
    \ allows us to set a nil parameter if we really need one.\n\n# **-allParameters**\n\
    \nDownload CDReferences/DocumentPreferences.m\n\n```\n```\n- (NSDictionary*)allParameters;\n\
    {\n    NSManagedObjectContext *moc;\n    NSError *error = nil;\n    moc = [[self\
    \ associatedDocument] managedObjectContext];\n    NSFetchRequest *request = [[NSFetchRequest\
    \ alloc] init];\n    [request setEntity:[NSEntityDescription entityForName:@\"\
    Parameter\"\n                                   inManagedObjectContext:moc]];\n\
    \    NSArray *params = [moc executeFetchRequest:request error:&error];\n    if\
    \ (error) {\n        NSLog(@\"%@:%s Error fetching parameter: %@\", [self class],\
    \ _cmd, error);\n        return nil;\n    }\n    \n    NSMutableDictionary *dict\
    \ = [[self defaults] mutableCopy];\n    for (NSManagedObject *param in params)\
    \ {\n        NSString *name = [param valueForKey:@\"name\"];\n        NSString\
    \ *value = [param valueForKey:@\"value\"];\n        [dict setValue: value forKey:name];\n\
    \    }\n    return dict;\n}\n```\n```\n\nIn addition to the primary function of\
    \ this class, we have a couple of convenience methods that have proven useful.\
    \ The first one, -allParameters, returns an NSDictionary of all the parameters,\
    \ including the defaults. In this method, we create an NSFetchRequest for the\
    \ Parameter entity without an NSPredicate. We take the resulting NSArray from\
    \ the fetch and loop over it. Within that loop, we add each NSManagedObject to\
    \ an NSMutableDictionary derived from the default NSDictionary. This ensures that\
    \ we have both the default values and the Parameter entries included in the final\
    \ NSDictionary."
