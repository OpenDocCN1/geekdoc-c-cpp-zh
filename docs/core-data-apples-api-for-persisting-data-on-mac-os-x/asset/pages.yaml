  md: '# Linking the Type Entity to the Type NSComboBox


    Now that we have our Type entity populated on launch, we should bind our user
    interface to it so that changes to the Type table will be reflected in the user
    interface. To do this, we need to open the MainMenu.xib file in Interface Builder
    and select the NSComboBox. Then on the Bindings tab, open the Content Values section,
    and bind it to the Type''s NSArrayController with a controller key of arrangedObjects
    and a model key path of name, as shown in Figure 4.3, on the next page.


    Now any changes to the Type table will be reflected in the user interface automatically.


    The NSManagedObjectContext itself is fairly straightforward to initialize. However,
    I also like to load any objects that need to be prepopulated into the repository
    at this point as well. To review, we start off by grabbing a reference to the
    NSPersistentStoreCoordinator and initializing the NSManagedObjectContext. Once
    the NSManagedObjectContext is initialized, we pass in the NSPersistentStoreCoordinator.


    If we did not have any data that we needed to load into the NSManagedObjectContext,
    this would normally be the completion of the method. However, in our application,
    we want to prepopulate the Type entity before anyone gets a chance to create any
    recipes. Therefore, once the NSManagedObjectContext has been initialized, we immediately
    execute an NSFetchRequest against the Type table and see whether there are any
    results. If there are any, then we complete the method and exit the run loop.


    If there are no entities in the Type table, then we know that it needs to be populated.
    The next step is to grab the list of types from the Info.plist and loop over them.
    For each entry in the Info.plist, we create a new NSManagedObject and set its
    name to the value from the Info.plist. Once the loop is complete, the store has
    been prepopulated, and we can exit this cycle of the run loop.


    There are a few other ways to prepopulate the repository. Some are easier and
    some are more complicated than this method. One example I have used in the past
    is to simply store a prepared repository in the application bundle. When the user
    requests a new store, I copy the pre-'
