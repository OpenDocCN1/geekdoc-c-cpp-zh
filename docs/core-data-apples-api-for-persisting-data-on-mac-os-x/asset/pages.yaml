  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_142_0.png)


    Figure 8.1: MobileMe system preferences


    # 8.2 Updating Our Data Model


    The first step in making our application ready for Sync Services is to update
    the data model to reflect what we want synced, what is considered an identity
    item (similar in concept to a primary key in database terms), and what triggers
    a “data changed” notification. All of this is configured directly with the data
    model, and fortunately making these changes does not trigger a version difference
    in the data model itself, so we do not have to create new data and mapping models.


    # Setting the Data Class


    One of the confusing things about Sync Services is some of the terminology that
    is used. One example of that is the data class. Coming from Core Data, one would
    think this refers to an object class that describes the data. That, unfortunately,
    is not its meaning with Sync Services. Instead, it is a unique identifier that
    defines a logical grouping of data. For instance, the entire Address Book’s data
    model is called the com.apple.contact data class. For our application, our data
    class will be com.pragprog.GrokkingRecipes. This is the value that we will assign
    to every entity in the data model. You will note that when we enter this value,
    Xcode automatically appends the name of the entity itself to the end of the data
    class’s name. This creates a unique name for each entity.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Attribute and Relationship Names


    Each attribute and relationship within each entity also has its own unique name.
    The format for the attributes and relationships is DataClass.EntityName/AttributeName.
    For example, the name of the recipe entity would be referred to as com.pragprog.GrokkingRecipes.Recipe/name.


    ![](img/ffa5f756dbdb501d7886468ffb761ad4_143_0.png)


    Figure 8.2: Setting the data class


    # Setting the Identity Properties


    Once the data class has been set for each entity in the data model, the next step
    is to set which attributes and/or relationships are identity properties for the
    sake of Sync Services. The purpose of this setting is to tell Sync Services which
    attributes or relationships it should use to match up records between applications,
    servers, or peers. When Sync Services attempts to merge data from two different
    sources, it looks to these identity properties to find records that would be considered
    the same. For example, if we were merging recipe data from two computers via MobileMe
    and we were looking at the Author entities, we would compare the name attribute
    of each author. If the name is the same, then we would consider it to be the same
    record for syncing purposes.


    # Author Settings


    For the author, the settings are very simple since the object itself is very simple.
    We set the name attribute to be the identity property, and neither the name nor
    the recipes is excluded from the data change alerts.'
  merge: -1
  img_proc: true
