  md: "# Chapter 12\n\n# Recipe: Dynamic Parameters\n\nIf you have a document-style\
    \ application, you will need to work with document-specific parameters or settings.\
    \ For example, in a word processor, some settings are specific to one document,\
    \ and some settings apply to the entire application. When it comes to storing\
    \ application-level parameters, we have a great implementation: NSUserDefaults.\
    \ However, when it comes to document-level parameters, there is no reusable storage\
    \ system for them provided by the APIs. In this chapter, we'll build that reusable\
    \ storage system within Core Data.\n\nSystem-level and user-level preferences\
    \ are extremely useful and easy to access on OS X. One call to standardDefaults\
    \ on NSUserDefaults from anywhere in the application instantly gives you access\
    \ to the defaults for the currently logged in user. However, sometimes we don't\
    \ want to store preferences at the user level but would prefer to store them at\
    \ the file level.\n\nWhen we are working with a Core Data application, the first\
    \ thought is to just create a table for these parameters and access them from\
    \ within the Core Data API. However, the problem comes when we are accessing those\
    \ parameters. No longer is it a single call to standardDefaults on NSUserDefaults;\
    \ now it looks more like this:\n\n```\n```objective-c\n- (void)clunkyParameterAccess\n\
    {\n    NSManagedObjectContext *moc = [self managedObjectContext];\n    NSFetchRequest\
    \ *request = [[NSFetchRequest alloc] init];\n    [request setEntity:[NSEntityDescription\
    \ entityForName:@\"parameter\"\n                                      inManagedObjectContext:moc]];\n\
    }\n```\n```"
