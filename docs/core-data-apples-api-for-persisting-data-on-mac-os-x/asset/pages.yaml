- pgno: 111
  md: 'place or what happened earlier in the NSManagedObject object’s life span, it
    is quite possible that the data will be loaded from cache instead.


    Likewise, faulting an NSManagedObject does not guarantee that it will be written
    back out to disk nor does it guarantee that it will be removed from the cache.
    If the object has no changes, then there is nothing to write to disk, and it is
    quite possible that it will remain in the cache for an unknown period of time.


    Easily one of the best ways to check to see whether the firing of a fault is in
    fact causing disk access is to monitor our application with instruments. By using
    the Core Data template, we can use the “cache miss” instrument to check for disk
    hits. If we are getting far more calls to the disk than expected, then we need
    to consider refactoring the code.


    # 6.5 Access Patterns


    Improving performance within Core Data is not necessarily only about the repository
    and order of loading the data. There are a number of things that we can do within
    the user interface to help performance as well.


    # Searching


    Searching the repository can be absolute murder on performance. Whether we are
    searching at the request of the user or we are performing a search in the background,
    we need to be very careful to avoid impacting the performance of our application.


    # Order Is Important


    Just like any conditional, the order of the logic is important. Simple equality
    is faster than inclusions such as in, contains, and so on. When building the predicate,
    try to order the logic from left to right, simple to complex. This will allow
    Core Data to fail quickly and improve the search performance.


    # Unicode and Regular Expressions


    Unicode is very expensive to work with when we are searching. As suggested earlier
    in Section 6.2, Search Only Properties, on page 102, try to avoid searching against
    Unicode directly. It is cheaper to keep a derived value that strips off the Unicode
    than it is to do frequent searches against the Unicode text.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Likewise, regular expressions are expensive. If a situation calls for one,
    try to put it at the far right end of the NSPredicate, as discussed in Section
    6.5, *Order Is Important*, on the previous page.


    # Limit Queries Across Relationships


    Searching across objects that are joined by a relationship can be very expensive
    for searching. Although it is impressive to search against person.address.postalCode.city,
    it may not be the most efficient way to solve the problem. Consider reversing
    the query or breaking it down into several smaller queries to reduce the complexity
    of the underlying SQL. When we are working with a SQLite back end, all of our
    NSPredicate calls turn into SQL before hitting the database. The less complex
    that SQL is, the faster it will run. It may very well be faster to get an NSArray
    of all the Address objects within a specific city and then perform the rest of
    the query against that NSArray than it would be to traverse three relationships
    in one call.


    # Information Overload


    A busy user interface is more than just a poor user experience; it also impacts
    the performance of the application. When we display a large amount of data on
    the screen, we must keep that information in memory, which in turn means we must
    load a large amount of data from disk all in one go. It is far better to break
    an application user interface up into consumable chunks of information than it
    is to try to display every last bit on the screen at once.


    The careful use of tabs, sheets, and panels can improve the feel of a user interface,
    and that will in turn improve the performance. By splitting the user interface
    into smaller pieces, we have finer-grained control over what data gets loaded
    when, and we can reduce our disk access to manageable chunks.


    Keep it simple.'
  merge: -1
