    Without the use of Cocoa Bindings, we need to handle the updates ourselves. We
    can handle this in several ways, and we will review each of them in Section 10.3,
    Data Change Notifications.


    # ## 10.3 Data Change Notifications


    As we discovered in Section 10.2, Handling Data Changes, on page 190, without
    Cocoa Bindings, we need to consider and design for the situation where our data
    has changed in one location, and we need to notify another location of that change
    so that it may also update itself.


    However, there are a few catches we have to consider when looking at this problem.
    The first catch is the one of design elegance. For any application to be elegant
    on the outside, it must also be elegant on the inside. Therefore, we definitely
    want to avoid strong references between view controllers.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'The second catch has to again do with memory. The Cocoa Touch system has some
    great memory management features built right into it, and we need to be conscious
    of them. For example, if we have a UIViewController stack that is very deep and
    we start to hit the memory limits, it is quite possible that the operating system
    will decide to drop some of our views from memory. If each view is a self-contained
    island of data, this is generally not a problem. However, if we want to start
    broadcasting data change notifications back up the stack, this is something we
    need to be aware of and check for; otherwise, a data notification could cause
    the entire application to crash.


    # Using the Delegate Design Pattern


    One of the most common solutions to this problem is to use a delegate. In fact,
    Apple uses this pattern very frequently. Ideally, when using a delegate design,
    we want to keep a separation between the delegate and the calling object. This
    will avoid having a strong link between view controllers and allows for the flow
    of the view controllers to be changed if needed in some future release. With Cocoa
    Touch, Apple has started using protocols to define delegate methods. Prior to
    Cocoa Touch (and Objective-C 2.0), it was far more common to add a category to
    NSObject to define the methods that are called upon the delegate.


    With the addition of Objective-C 2.0, we can now have optional methods in a protocol,
    which makes it easier to use protocols instead of categories. We can now define
    which methods are required, testing at compile time, and which methods are optional.
    Previously with categories we had to define which were required and which were
    optional through runtime checks and documentation.


    Unfortunately, using a delegate design does have one fairly major issue. We can
    have just one delegate being notified when the data changes. If we have a deep
    stack of view controllers, then we would need to build up a cascade of change
    notifications up the stack. It’s certainly possible but not the most elegant solution
    in that situation.


    # Using the NSNotificationCenter


    When a delegate won’t do, then a notification usually will. The NSNotification
    API has the advantage of being able to handle multiple observers and notify each
    of them in turn. In an NSNotification design, each view would add itself as an
    observer to a specific key. When a notification'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'with that key is broadcast, then the view would receive a callback and be allowed
    to handle the notification as needed.


    The NSNotification API is quite elegant for a number of reasons. Each observer
    can decide on its own how to handle the notification that it receives. In addition,
    the object that posts the notification does not need to know anything about the
    consumers of that notification. It does not even need to know what method is being
    called on the consumer. The producer simply sends out the notification and carries
    on. This provides excellent separation of the view controllers.


    # ### Using the NSFetchedResultsController


    With the release of 3.0 for Cocoa Touch, Apple has provided us with a third solution
    to this problem. This third solution is provided via the NSFetchedResultsController
    and is recommended for most standard Cocoa Touch application designs.


    The NSFetchedResultsController is specifically designed to manage a result set
    of entities from an NSManagedObjectContext and provides methods to query the result
    set for the number of entities and to keep them in order.


    In addition, the NSFetchedResultsController also provides means for a UIViewController
    to be notified when any of the entities in the result set are modified including
    the addition or deletion of entities. The best way to look at the NSFetchedResultsController
    is as a layer between the NSManagedObjectContext and the UIViewController, as
    depicted in Figure 10.5, on the next page.


    To construct an NSFetchedResultsController, we need to first construct an NSFetchRequest
    and pass that request into the NSFetchedResultsController. Once that is accomplished,
    we can query the NSFetchedResultsController for the number of entities in the
    results and retrieve individual entities.


    In our example application, RecipesCT, we will be using the NSFetchedResultsController
    to manage the main table view as well as to receive events when the detail view
    changes one of the entities. This project is discussed in greater detail in Section
    10.4, Recipes for the iPhone, on the following page.'
