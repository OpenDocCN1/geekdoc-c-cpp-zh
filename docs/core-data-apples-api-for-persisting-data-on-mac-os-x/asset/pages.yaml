  md: "The resulting protocol is as follows:\n\nDownload DistributedCDServer/PPDistributedProtocol.h\n\
    \n```\n```objective-c\n#define kDomainName @\"local.\"\n#define kServiceName @\"\
    _pragProgExample._tcp\"\n\n@protocol PPDistributedProtocol\n\n- (oneway void)ping;\n\
    \n- (byref NSManagedObject*)createObject;\n- (byref NSManagedObject*)createChildForObject:(byref\
    \ NSManagedObject*)parent;\n- (oneway void)deleteObject:(byref NSManagedObject*)object;\n\
    - (byref NSArray*)allObjects;\n- (byref NSArray*)objectsOfName:(bycopy NSString*)name\n\
    \    withPredicate:(bycopy NSPredicate*)predicate;\n\n@end\n```\n```\n\nWhen we\
    \ are working with distributed objects, we need to define how nonscalar attributes\
    \ are handled.<sup>1</sup> In our protocol, we are passing most of the objects\
    \ byref, which means that an NSDistantObject is created on the receiver as a proxy\
    \ to the object that is residing on the server. This is different from bycopy,\
    \ which will make a copy of the object on the receiving end. One of the interesting\
    \ differences between these is that KVO works across a distributed object when\
    \ it is passed byref. This will be demonstrated as we build the application.\n\
    \n# ### Broadcasting the Service\n\nDistributed objects work by using good old\
    \ Unix sockets. Fortunately, these are wrapped with NSSocketPort for us so that\
    \ we do not need to use the raw C functions and all the complexity that entails.\
    \ To use sockets, we need to know the address and port of the socket to talk to.\
    \ This can be entered by the user, which is a suboptimal experience, or we can\
    \ discover it using Bonjour. To use Bonjour, we need to set up a broadcast on\
    \ the server for the client to discover.\n\nDownload DistributedCDServer/AppDelegate.m\n\
    \n```\n```objective-c\n- (void)startBroadcasting\n{\n    receiveSocket = [[NSSocketPort\
    \ alloc] init];\n    int receivePort = [self portFromSocket:receiveSocket];\n\n\
    \    myConnection = [[NSConnection alloc] initWithReceivePort:receiveSocket\n\
    \        sendPort:nil];\n}\n```\n```\n\n1. These are discussed in depth in Apple's\
    \ documentation."
