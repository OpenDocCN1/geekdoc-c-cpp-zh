  md: "![](img/ffa5f756dbdb501d7886468ffb761ad4_230_0.png)\n\nFigure 12.1: Parameter\
    \ table model\n\na dynamic number of accessors. However, we do not want to have\
    \ to write an accessor every time that we add a parameter: ideally, we want to\
    \ just call -valueForKey: and -setValue:forKey: and not worry about the persistence\
    \ of these values. Lastly, we want to be able to set up some default values.\n\
    \nAn important point about the defaults is that they are not persisted to disk.\
    \ If they get persisted, then later versions that change the default would require\
    \ additional code to check for persisted defaults and reset them. If, however,\
    \ we do not persist them, then users of newer versions of the application automatically\
    \ get the newer defaults for free and, more important, do not get their preferences\
    \ destroyed if they have changed the value from its default.\n\nThe DocumentPreferences\
    \ object will accomplish all of these goals:\n\nDownload CDPreferences/DocumentPreferences.h\n\
    \n```\n```objc\n@interface DocumentPreferences : NSObject\n{\n    NSDictionary\
    \ *_defaults;\n    NSPersistentDocument *_associatedDocument;\n}\n\n@property\
    \ (assign) NSPersistentDocument *associatedDocument;\n@property (assign) NSDictionary\
    \ *defaults;\n\n- (id)initWithDocument:(NSPersistentDocument*)associatedDocument;\n\
    - (NSArray*)allParameterNames;\n- (NSDictionary*)allParameters;\n\n@end\n```\n\
    ```"
