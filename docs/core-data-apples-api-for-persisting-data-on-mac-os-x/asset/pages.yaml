  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_163_0.png)


    # ### Joe Asks...


    # #### When Do I Need to Worry About Threading?


    The point at which threading is appropriate is a hard one to decide upon. As a
    rule, I will put an operation into another thread any time that it blocks the
    UI thread from drawing or causes the operating system to think that the application
    is nonresponsive. When an application starts "beach-balling," it is time to optimize
    the application and look at threading.


    As shown in the method -newContextToMainStore, we grab a reference to the existing
    NSPersistentStoreCoordinator and use that in the initialization of a new NSManagedObjectContext.


    Although the NSPersistentStoreCoordinator is not thread safe either, the NSManagedObjectContext
    knows how to lock it properly when in use. Therefore, we can attach as many NSManagedObjectContext
    objects to a single NSPersistentStoreCoordinator as we want without fear of collision.


    # ## Cross-Thread Communication


    There is one major catch when standing up multiple NSManagedObjectContext instances.
    Each instance is unaware of the existence and activity of the other instances.
    This means that when an NSManagedObject is created, edited, or deleted by one
    NSManagedObjectContext, the other instances aren''t aware of the change.


    Fortunately, Apple has given us a relatively easy way to keep all the NSManagedObjectContext
    instances in sync. Every time that an NSManagedObjectContext completes a save
    operation, it will broadcast an NSNotification with the key NSManagedObjectContextDidSaveNotification.
    In addition, the NSNotification instance will contain all the information about
    what is occurring in that save.


    To complement this NSNotification broadcast, the NSManagedObjectContext has a
    method that is designed to consume this NSNotification and update itself based
    on its contents. This method, -mergeChangesFromContextDidSaveNotification:, will
    update the NSManagedObjectContext with the changes and will also notify any observers
    of those changes. This means that our main NSManagedObjectContext can be updated'
