  md: "```\n```objective-c\n- (void)logError:(NSError*)error\n{\n    id sub = [[error\
    \ userInfo] valueForKey:@\"NSUnderlyingException\"];\n\n    if (!sub) {\n    \
    \    sub = [[error userInfo] valueForKey:NSUnderlyingErrorKey];\n    }\n\n   \
    \ if (!sub) {\n        NSLog(@\"%@:%s Error Received: %@\", [self class], _cmd,\n\
    \              [error localizedDescription]);\n        return;\n    }\n\n    if\
    \ ([sub isKindOfClass:[NSArray class]] ||\n        [sub isKindOfClass:[NSSet class]])\
    \ {\n        for (NSError *subError in sub) {\n            NSLog(@\"%@:%s SubError:\
    \ %@\", [self class], _cmd,\n                  [subError localizedDescription]);\n\
    \        }\n    } else {\n        NSLog(@\"%@:%s exception %@\", [self class],\
    \ _cmd, [sub description]);\n    }\n}\n```\n```\n\nThe -logError: attempts to\
    \ extract the NSUnderlyingException from the user-Info of the passed-in NSError.\
    \ If something goes wrong within Core Data that is not part of the normal failure\
    \ path, it is possible to get information about the failure via the NSUnderlyingException\
    \ stored. If there is no NSUnderlyingException, then we look for a value stored\
    \ under the key NSUnderlyingErrorKey. If we get something back from that key,\
    \ we check to see whether it is a collection, which would indicate multiple validation\
    \ errors and print the -localizedDescription to the console. If we cannot locate\
    \ either an NSUnderlyingException or an NSUnderlyingErrorKey, then we dump the\
    \ -localizedDescription for the NSError that is passed in.\n\nOnce the Bonjour\
    \ service has started and the save thread has started, the server waits for requests\
    \ from clients. In a distributed object application, the server does not get notified\
    \ when a client connects; it simply starts getting calls to the exposed methods.\n\
    \n# Receiving Requests from Clients\n\nWorking with distributed objects is deceptively\
    \ easy. Other than the minor changes to the method signatures, there are no other\
    \ changes to the methods and how they are handled. However, whenever we write"
