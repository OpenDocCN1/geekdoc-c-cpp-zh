  md: '# # Under the Hood of Core Data


    The more we understand the details of Core Data, the better equipped we are to
    understand when something goes wrong or how to accomplish a task that is off the
    beaten path.


    In my experience of working with and writing persistence layers for various languages,
    I am constantly amazed at how simple and elegant the Core Data API is. There is
    very little overlap in functionality between the individual pieces of Core Data—no
    wasted space or unnecessary redundancy. Because Core Data is built upon the infrastructure
    of Objective-C and Core Foundation, it does not seek to duplicate functionality
    that already exists in other parts of the overall API but instead uses it to its
    full extent.


    In this chapter, we will walk through the various pieces that make up Core Data
    and explore how they apply to the ways that we use Core Data and how they apply
    to the application we are developing in this book. By the end of this chapter,
    we will have a firmer grasp of what Core Data is, what we can do with it, and
    how to use it to its full capabilities.


    The Core Data API, or *stack* as it is commonly called, consists of three primary
    pieces: `NSPersistentStoreCoordinator`, `NSManagedObjectModel`, and `NSManagedObjectContext`.
    All of these work together to allow a program to retrieve and store `NSManagedObject`
    objects. In most situations, the program will access `NSManagedObjectContext`
    only once the stack has been created. It is possible to access the other components
    of the stack, but it is rarely necessary.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '> > **Joe Asks...**

    > >

    > > ### What Is a Stack?

    > >

    > > The term *stack* has a few different meanings depending on its context. In
    this context, it refers to a multilayered structure that passes data around in
    a vertical manner. Vertical here means coming in through the top layer and reaching
    down to the last, or bottom, layer. Data is never passed directly to the bottom
    layer or any of the middle layers; it always accessed from the top.


    # ## 4.1 NSManagedObject


    NSManagedObject is the object we work with the most in a Core Data application.
    Each instance of NSManagedObject represents one entity in our Core Data repository.
    By combining Core Data with KVC and KVO, this one object can dynamically represent
    any object that we need and that can be defined in our data model.


    All of the properties and relationships defined in our data model are available
    and are easy to access directly from the NSManagedObject. Without subclassing
    it, we can access values associated with an NSManagedObject in the following ways.


    # ### Accessing Attributes


    Attributes are the easiest to access. By utilizing KVC, we can get or set any
    attribute on the NSManagedObject directly. You may have noticed that we did not
    write a Recipe entity in the previous chapter. At this point in our application,
    NSManagedObject provides all the functionality that we require. For example, we
    could get the name as follows:


    ```

    ```objective-c

    NSManagedObject *recipe = ...;

    NSString *name = [recipe valueForKey:@"name"];

    ```

    ```


    Likewise, we can set the name in a similar fashion:


    ```

    ```objective-c

    NSManagedObject *recipe = ...;

    [recipe setValue:@"New Name" forKey:@"name"];

    ```

    ```


    When we want to subclass NSManagedObject, we can also define properties for the
    attributes (and relationships discussed in a moment) so'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'that we can access them directly. In the header of our subclass, we would define
    the properties normally:


    Download Spotlight/PPRecipe.h


    ```

    ~~~objc

    @interface PPRecipe : NSManagedObject {


    }


    @property (assign) NSString *desc;

    @property (assign) NSString *name;

    @property (assign) NSString *type;

    @property (assign) NSManagedObject *author;

    @property (assign) NSDate *lastUsed;

    ~~~

    ```


    As you can see, we are defining the property like normal, but there are no ivars
    associated with those properties. Since these properties are created dynamically
    at runtime, we do not need to declare them in the header. However, we do need
    to flag them as dynamic so that the compiler will not issue a warning. This is
    done in the implementation file:


    Download Spotlight/PPRecipe.m


    ```

    ~~~objc

    @implementation PPRecipe


    @dynamic desc;

    @dynamic name;

    @dynamic type;

    @dynamic author;

    @dynamic lastUsed;

    ~~~

    ```


    By declaring them as @dynamic, we are telling the compiler to ignore any warnings
    associated with these properties because we “promise” to generate them at runtime.
    Naturally, if they turn up missing at runtime, then our application is going to
    crash. However, when we are working with NSManagedObject objects, the attributes
    will be looked up for us, and we do not need to implement anything. By adding
    that code, we can access the attribute directly, as shown in the following example:


