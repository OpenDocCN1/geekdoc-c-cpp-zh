  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_110_0.png)


    Figure 6.4: Impacts of deleting a recipe


    Author entity, Ingredient entity, and UnitOfMeasure entity, as shown in Figure
    6.4.


    It is obvious that we need to touch the RecipeIngredient entity, but why do we
    need to access all the others? This is because of the relationships between the
    entities. For each relationship, we need to validate the relationship after the
    delete and confirm that there are no dangling references. If these objects are
    not currently in memory, then the NSManagedObjectContext must retrieve them from
    the disk to accomplish all of this.


    Therefore, when we are doing deletes, especially large deletes, it can be a performance
    improvement to fetch all the relationships prior to the delete.


    # Faulting and Disk Access


    Firing a fault does not always mean that the data is going to be read from disk.
    Depending on how we have requested the data in the first'
