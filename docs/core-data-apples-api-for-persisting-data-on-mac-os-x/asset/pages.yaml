  md: "```\n```objc\n- (void)setMyString:(NSString*)string;\n{\n    @synchronized(self)\
    \ {\n        if ([string isEqualToString:myString]) return;\n        [myString\
    \ release];\n        myString = [string retain];\n    }\n}\n\n@end\n```\n```\n\
    \nThe retain in the setter is added by the compiler because we specified it in\
    \ the property. If we had set it to assign instead, then no retain would have\
    \ occurred. Likewise, the locking code is a default option that we could have\
    \ turned off by adding the nonatomic option to the property definition.\n\nWhen\
    \ dealing with multiple properties on an object, this can be a great time-saver.\
    \ There have also been indications that the accessors generated by the compiler\
    \ are faster than the “normal” accessors that developers write. In addition to\
    \ generating accessors, the @synthesize keyword is smart about what it implements.\
    \ If we need to implement our own setter for a property, then it will not overwrite\
    \ that setter.\n\nAlongside the @synthesize property, we have the @dynamic property.\
    \ Unlike @synthesize, which generates the accessors for us, @dynamic tells the\
    \ compiler that while the accessors for the property are not there at compile\
    \ time, they will be there at run time and to not produce a warning for them.\
    \ @synthesize and @dynamic are similar keywords. For each property, we can use\
    \ one or the other but not both.³ If the accessor methods will be implemented\
    \ at runtime, we would use the @dynamic property instead of the @synthesize property\
    \ so that the compiler does not produce a warning. This is particularly useful\
    \ for Core Data subclasses, which we will discuss in Chapter 4, Under the Hood\
    \ of Core Data, on page 51.\n\nIt should be noted that it is possible to have\
    \ a @property definition that does not match the name of the ivar. For example,\
    \ it is fairly common to have ivars that start with an underscore, but the accessors\
    \ do not include the underscore. The @property can handle this as well as part\
    \ of the @synthesize and @dynamic calls.\n\n³ However, neither is required in\
    \ a situation where we are implementing the accessors ourselves."
