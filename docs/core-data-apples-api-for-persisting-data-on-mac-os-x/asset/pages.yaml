  md: 'locate the path for our model and use it to construct an NSURL. With that NSURL,
    we can then initialize the NSManagedObjectModel.


    Depending on the complexity of the application, it is common to not need access
    to the NSManagedObjectModel after the Core Data stack has been initialized. However,
    there is a wealth of information within this object that can be useful in edge
    cases.


    For example, since the descriptions of all the entities that exist in the model
    are contained in the NSManagedObjectModel, it is possible to use it to do dynamic
    discovery of the model for display purposes. By accessing the NSManagedObjectModel
    directory, we can interrogate the Core Data stack and discover all the relationships,
    entities, and properties that exist and display them to the user. Although this
    might not be useful in a consumer-facing application, it can be quite useful as
    a developer tool.


    Another situation when accessing the NSManagedObjectModel directly is useful is
    when handling versioning. When we are developing unusual version shifts or writing
    the versioning code ourselves, it can be very useful to interrogate the NSManagedObjectModel,
    both the source and the destination, to make logical decisions about the versioning
    process. Core Data versioning is discussed more in depth in Chapter 5, *Versioning
    and Migration*, on page 73.


    # 4.6  NSPersistentStoreCoordinator


    The NSPersistentStoreCoordinator is at the bottom of the Core Data stack. It is
    responsible for persisting the data to its repository. That repository is usually,
    but not always, on disk. So, in the case of an in-memory store, could be only
    in memory with no disk representation. However, in most cases, the NSPersistentStoreCoordinator
    handles disk access.


    The NSPersistentStoreCoordinator is also not thread safe. However, the NSManagedObjectContext
    knows how to properly lock the NSPersistentStoreCoordinator, so therefore it is
    possible to associate multiple NSManagedObjectContext instances to a single NSPersistentStoreCoordinator
    without concern. However, direct access to the NSPersistentStoreCoordinator from
    multiple threads (such as adding persistent store objects) can cause issues. In
    fact, when working in a multithreaded environment, this is how the single-threaded
    design of the NSManagedObjectContext is handled. We discuss this aspect of the
    NSPersistentStoreCoordinator in detail in Chapter 9, *Multithreading and Core
    Data*, on page 162.'
