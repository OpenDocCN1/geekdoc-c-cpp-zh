    ```\n\n# 8.4  Creating the Client Description File\n\nNow that we have our schema\
    \ put together, it is time to build the client description file. This file is\
    \ different from the sync schema we just built because it is coming at the sync\
    \ from the client’s point of view. The sync schema tells Sync Services what data\
    \ will be synced, and the client description tells Sync Services what data this\
    \ application will be syncing. It is quite possible to have a client that wants\
    \ only a subset of the data and does not care about certain parts. For example,\
    \ if we wanted to build a dashboard widget that displayed recipes, it may not\
    \ care about the author and therefore would not add it to its client description.\n\
    \nSince we are the primary application for this schema, we will sync all the data\
    \ available. This file is called ClientDescription.plist, and it is part of the\
    \ primary application bundle and will be included in the Resources subdirectory\
    \ of the application bundle. Inside of this plist are four keys: DisplayName,\
    \ ImagePath, Type, and Entities. DisplayName and ImagePath are both used when\
    \ Sync Services needs to display specific information about this client as opposed\
    \ to information about the schema itself. However, since our application is the\
    \ primary application for this schema (as opposed to calendar or contact data),\
    \ we can use the same name and image that we used for the schema. The Type key\
    \ defines what type of client we are, with options of app, device, server, or\
    \ peer. For our application, that answer is app.\n\nThis leaves the Entities key.\
    \ The Entities key tells Sync Services which entities our client cares about and\
    \ the attributes/relationships of those entities. Since we are the primary application,\
    \ we care about all the entities, their attributes, and the relationships.\n\n\
    ```\nDownload SyncServices/ClientDescription.plist\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\"\n  \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
    >\n<plist version=\"1.0\">\n<dict>\n    <key>DisplayName</key>\n```"
