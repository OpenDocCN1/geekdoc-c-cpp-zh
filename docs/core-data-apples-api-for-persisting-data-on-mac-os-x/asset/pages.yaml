    # Creating Our First Mapping Model


    We’re definitely getting closer but are not quite there yet. We are missing one
    more thing, and that is the mapping model. The mapping model describes how to
    transition the data from one object model to another. A mapping model is created
    by asking Xcode to create a new file and choosing Mapping Model from the selection.
    After naming the new file (I named it v1_to_v2), Xcode asks you to select the
    source and destination models. Selecting v1 and v2 appropriately will complete
    the file creation. Xcode does some basic building of the mapping model, and that
    is nearly sufficient for this migration.


    The initial mapping model generated by Xcode handles almost everything that we
    want to do. It handles the migration of the existing entities over to the new
    object model just fine. However, there are a couple of things we need to do to
    tweak it.


    First, we can remove the Author entity from the mapping model. Since there is
    no Author in the original object model and the relationship is not required, we
    do not need to deal with it during the migration. We can also remove the mapping
    for the author relationship in the Recipe entity as well as the lastUsed attribute.
    Again, since these can be nil and we are not populating them during the migration,
    they are not needed in the mapping model.'
