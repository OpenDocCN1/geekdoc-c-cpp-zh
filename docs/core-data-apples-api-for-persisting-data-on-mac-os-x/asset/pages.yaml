    | Entity Three |  |  |  |  |  |  |  |  |


    Figure 6.2: SQLite table layout


    object, Core Data creates one large table that includes all the properties for
    the parent entity as well as its children. The end result is an extremely wide
    and tall table in the database with a high percentage of empty values.


    Although the entity inheritance feature of Core Data is extremely useful, we should
    be aware of what is going on underneath the object model to avoid a performance
    penalty. We should not treat entity inheritance as an equal to object inheritance.
    There is certainly some overlap, but they are not equal, and treating them as
    such will have a negative impact on the performance of the repository.


    # Denormalizing Data to Improve Performance


    Although the most powerful persistent store available for Core Data is a database,
    we must always be conscious of the fact that Core Data is not just a database.
    Core Data is an object hierarchy that can be persisted to a database format. The
    difference is subtle but important. Core Data is first a collection of objects
    that we use to display data in a user interface of some form and allow the user
    to access that data. Therefore, although database normalization might be the first
    place to look for performance improvements, we should not take it too far. There
    are six levels of database normalization,¹ but a Core Data repository should rarely,
    if ever, be taken beyond the second level. There are several cases where we can
    gain a greater performance benefit by denormalizing the data.


    # Search Only Properties


    Searching within properties can be quite expensive. For properties that have a
    large amount of text or, worse, Unicode text, a single search field can cause
    a huge performance hit. One way to improve this situation is to create a derived
    attribute based on the text in an entity.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'For example, searching in our description property of the `Recipe` entity can
    potentially be very expensive if the user has verbose descriptions and/or uses
    Unicode characters in the description.


    To improve performance of searches in this field, we could create a second property
    on the `Recipe` entity that strips the Unicode characters from the description
    and also removes common words such as *a*, *the*, and *etc*. If we then perform
    the search on this derived property, we can drastically improve search performance.


    The downside to using search-only properties is that we need to maintain them.
    Every time the description field is edited, we need to update the derived property
    as well.


    # ### Expensive Calculations


    In a normalized database, calculated values are not stored. It is considered cheaper
    to recalculate the value as needed than to store it in the database. However,
    from a user experience point of view, the opposite can frequently be true. In
    cases where the calculation takes a human-noticeable amount of time, it may very
    well be better for the user to store that calculation in the entity and recalculate
    it only when one of its dependent values has changed. For example, if we store
    the first and last names of a user in our Core Data repository, then it might
    make sense to store the full name as well.


    # ### Intelligent Relationships


    Relationships in a Core Data Model are like salt in a cooking recipe. Too much
    and you ruin the recipe; too little and something is missing. Fortunately, there
    are some simple rules we can follow when it comes to relationships in a Core Data
    repository.


    # ### Follow the Object Model


    Core Data is first and foremost an object model. The entities in our model should
    represent the data as accurately as possible. Just because a value might be duplicated
    across several objects (or rows from the database point of view) does not mean
    it should be extruded into its own table. Many times it is more efficient for
    us to store that string several times over in the entity itself than to traverse
    a relationship to get it.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Traversing a relationship is generally more expensive than accessing an attribute
    on the entity. Therefore, if the value being stored is simple, then leave it in
    the entity it is associated with.


    # ### Separate Commonly Used from Rarely Used Data


    If the object design calls for a one-to-many relationship or a many-to-many relationship,
    then definitely create a relationship for it. This is usually the case where the
    data is more than a single property or contains binary data or would be difficult
    to properly model inside the parent object. For example, if we have a user entity,
    it is more efficient to store their address in its own object as opposed to having
    several attributes in the user object for address, city, state, postal code, and
    so on.


    Balance needs to be carefully maintained between what is stored on the other end
    of a relationship and what is stored in the primary entity. Crossing key paths
    is more expensive than accessing attributes, but creating objects that are very
    wide also slows down data access.


    # ## 6.3 Fetching


    *Fetching* is the term used to describe the resolving of NSManagedObject objects
    from the repository. When we retrieve an NSManagedObject, it is “fetched” into
    memory, and we can then access its properties. To help us utilize memory efficiently,
    fetching may not always happen all at once. Specifically, when we are using a
    SQLite store, it is quite possible that an object we think is in memory is actually
    only on disk and has yet to be read into memory. Likewise, objects that we think
    we are done with may actually still sit in a cache.


    To demonstrate the differences in the ways that we can load data into memory from
    our SQLite Store, I used Apple’s demonstration application from WWDC 2007 called
    GoFetch.² The entire goal of this application is to generate a large amount of
    random data and let us control how it is fetched back into memory. Each fetch
    is then timed to demonstrate the speed of various options. These tests were performed
    with 3,417 records in the SQLite repository.


    2. The source code for this application is available as part of the ADC Headstart
    package for Core Data.'
  merge: -1
  img_proc: true
