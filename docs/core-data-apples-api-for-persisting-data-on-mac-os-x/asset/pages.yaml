  md: "```\n```objective-c\n- (id)initWithDelegate:(AppDelegate*)delegate\n      \
    \    filePath:(NSString*)filePath\n{\n    if (![self = [super init]]) return nil;\n\
    \n    appDelegate = delegate;\n\n    [self setFilePath:filePath];\n    [self setImportContext:[self\
    \ managedObjectContext]];\n    NSManagedObjectContext *mainMOC = [self newContextToMainStore];\n\
    \    NSNotificationCenter *center = [NSNotificationCenter defaultCenter];\n  \
    \  [center addObserver:self\n             selector:@selector(contextDidSave:)\n\
    \                 name:NSManagedObjectContextDidSaveNotification\n           \
    \    object:mainMOC];\n    [self setMainContext:mainMOC];\n    [self setLookup:[NSMutableDictionary\
    \ dictionary]];\n    return self;\n}\n```\n```\n\nOnce the (super init) has returned,\
    \ we set the filePath to an ivar, construct an NSManagedObjectContext for it,\
    \ and set that to another ivar. Once we have the NSManagedObjectContext instantiated\
    \ for the file to be imported, we also want to start listening for NSNotification\
    \ broadcasts from that NSManagedObjectContext.\n\n```\n```objective-c\n- (void)main\n\
    {\n    NSFetchRequest *request = [[NSFetchRequest alloc] init];\n    [request\
