  md: "```\n```xml\n<string>ingredients</string>\n<string>recipeIngredients</string>\n\
    </array>\n</dict>\n</dict>\n</plist>\n```\n```\n\n# 8.5  Modifying the NSPersistentStoreCoordinator\n\
    \nOne thing that always has to be remembered about Sync Services is that we want\
    \ it to be fast—the faster, the better. If it gets slowed down, then all kinds\
    \ of bad things can happen. For instance, the computer can go to sleep in the\
    \ middle of the sync, the user can quit the application, network connections can\
    \ go down—the list goes on. Therefore, we want to make sure that when a sync actually\
    \ happens, it happens very quickly. Unfortunately, Core Data, although being a\
    \ fast process in its own environment, can be too slow for syncing purposes. To\
    \ address this, NSPersistentStoreCoordinator has an additional method included\
    \ in a category as part of the Sync Services framework. This method, setStoresFastSyncDetails:URL:forPersistentStore:,\
    \ defines an additional store to be used by Sync Services to store information\
    \ in preparation for the next sync operation. This additional store is not a copy\
    \ of the data but has similarities to notes about the various objects in our NSPersistentStore\
    \ that can be used during the sync process to speed things up.\n\nIt should be\
    \ noted that without this additional setting, syncing of a Core Data repository\
    \ will not work. If you run into an issue with another application and syncing\
    \ is not working, be sure to check that the fast sync store is being set and created.\n\
    \nAdding this store to our application requires a small change to our -persistentStoreCoordinator\
    \ method.\n\n```\n```objective-c\nNSPersistentStore *store;\nstore = [persistentStoreCoordinator\
    \ addPersistentStoreWithType:NSXMLStoreType\n                                \
    \                     configuration:nil\n                                    \
    \                              URL:nil\n                                     \
    \                          options:nil\n                                     \
    \                             error:&error];\n\nif (!store) {\n    NSLog(@\"%@:%s\
    \ presenting error no store\", [self class], __cmd);\n    [[NSApplication sharedApplication]\
    \ presentError:error];\n    return nil;\n}\n```\n```"
