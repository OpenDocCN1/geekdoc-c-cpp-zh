    In this last example method, we deal with a more complicated situation. During\
    \ the development of this method, I started with passing an NSFetchRequest around\
    \ between the server and clients. This resulted in some terminal errors within\
    \ the Core Data stack and led me to this solution instead. Based on these experiments,\
    \ it is clear to me that passing around the NSManagedObjectContext itself results\
    \ in some risky situations and should be avoided. However, NSPredicate objects\
    \ can be passed around without any issue. Therefore, in this method, we accept\
    \ the name of the entity and the NSPredicate to use in the NSFetchRequest. From\
    \ this we build the NSFetchRequest and execute it against the local NSManagedObjectContext.\
    \ If there is an error, we print it to the console and return nil. Otherwise,\
    \ we return the resulting array.\n\n# ## 11.2 Building the Client\n\nThe client\
    \ side of this application is both easier and more complicated than the server.\
    \ Configuring Bonjour and setting up the distributed objects is a bit more complicated\
    \ than it is on the server. However, once the distributed object is configured,\
    \ the rest is significantly easier.\n\nIn this example, we are going to build\
    \ a client that is designed to stress test the server as opposed to being truly\
    \ functional in a user perspective. Our client is going to connect to the first\
    \ server that it finds, and once the connection is complete, it will run NSInvocations\
    \ to fire against each of the methods on the server in quick succession. With\
    \ this type of client, we can stress test the server with multiple clients and\
    \ look for race conditions and threading/locking issues.\n\n# ### Configuring\
    \ the Xcode Project\n\nUnlike the server, the client is going to start with a\
    \ Cocoa non-Core Data application. Because the server is maintaining the Core\
    \ Data repository, the client does not need to be configured as a Core Data application.\
    \ However, like the server, our user interface is a single window with a single\
    \ table displaying the results of one of the method calls to the server. See Figure\
    \ 11.3, on the next page."
