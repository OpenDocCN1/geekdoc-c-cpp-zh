- pgno: 7
  md: '# Chapter 1


    # Introduction


    It is hard to believe that I have been working on this book for nine months and
    that it is now complete. I freely admit that I walked into this project with a
    lot of trepidation. There was simply no way that I was going to fill an entire
    book about Core Data! Now looking back on it, I realize how wrong I was. If you
    look at Core Data in a vacuum, then it can be a fairly small subject, and believe
    me, that is a good thing. But when we take it as part of the whole ecology of
    OS X, then it becomes so much more, which makes it possible to write several books
    on the subject.


    Back when Core Data was first introduced, I was in the process of designing a
    desktop application later to become known as Simple Elegant Sales. This point-of-sale
    software was originally written for my wife and her business as a photographer.
    I wanted her to be able to easily handle the accounting of her business from her
    laptop as she traveled from location to location. When I originally wrote the
    software, I had far more experience with Java than with Objective-C, but I knew
    that if the app was going to be taken seriously as an OS X application, the user
    interface had to be written in Objective-C and Cocoa. A Java UI simply would not
    do. However, I decided to write the back side of the application in Java so that
    I could take advantage of the powerful databases and relational mapping abilities
    of Hibernate.


    I was about halfway through this project when I met Tom Harrington of Atomic Bird
    (http://www.atomicbird.com). He suggested that I take a look at Core Data for
    the back end of my software and that it might suit my needs better than Java.
    At that time, Tiger had not yet been released, and Core Data was still available
    only to developers. After experimenting with it for just one day, I immediately
    went back to the'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Joe Asks…


    # Is This Book for You?


    If you plan on writing an application that saves data to disk, then you should
    be taking a very long look at Core Data. Whether you are focusing on the desktop
    or the iPhone, Core Data is the most efficient solution to data persistence.


    A good way to confirm that you know enough Cocoa to benefit from this book is
    to take a look at Chapter 2, *Getting Started with Core Data*, on page 14. You
    should find that chapter dense, but every step should be familiar to you.


    drawing board, scratched the entire project, and started over. It was that much
    of an improvement over what I was doing.


    Since that day, I have been enraptured by Core Data, and I quickly learned everything
    about it that I possibly could.


    # 1.1 What Is Core Data?


    In the simplest terms, Core Data is an object graph that can be persisted to disk.
    But just like describing a man as a “bag of mostly water,” that description hardly
    does Core Data justice. If you’ve worked with Interface Builder, you know that
    it effectively removes a third of the coding design known as MVC. With Interface
    Builder, a developer does not need to spend countless hours writing and rewriting
    their user interface to make sure that it is pixel perfect. Instead, they simply
    drag and drop the elements in the IDE, bind them together, and call it done.


    Of course, the problem with Interface Builder is that we still need to code the
    other two parts! Both the controller and the model need to be developed in code
    and made to work with the interface we just designed. That is where Core Data
    comes in. In a nutshell, Core Data removes another third from that MVC design.
    Core Data is the model.


    It is a common misconception that Core Data is a database API for Cocoa that allows
    a Cocoa application to store its data in a database. Although that is factually
    accurate, Core Data does a lot more for us. It serves as the entire model layer
    for us. It is not just the persistence on'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'disk, but it is also all the objects in memory that we normally consider to
    be data objects. If you have experience working with Java, C#, or some other object-oriented
    language, the data objects take a lot of time to write, and they are generally
    very repetitive in nature. Core Data eliminates most, if not all, of that boilerplate
    code for us and lets us focus on the business logic, or the controller layer,
    of our application. It does this with an interface that is as easy to use as Interface
    Builder.


    In addition to ease of use, Core Data is also highly flexible. If we need to step
    in and change the functionality of some portion of the data model, we can. From
    how a value is handled when it is being accessed to how data is migrated from
    one persistent store to another, we can choose how little or how much we want
    to code ourselves and how much we want Core Data to do for us.


    The original design and idea of Core Data came from Enterprise Objects, which
    is part of Web Objects, another Apple framework. You may be surprised to learn
    that Enterprise Objects and Web Objects, the ancestors of Core Data, still run
    a large portion of Apple''s public-facing websites. Both iTunes and http://www.apple.com
    run on a Web Objects server. Therefore, although Core Data is a relatively new
    technology for the OS X desktop, it has a long lineage.


    We are also not at the end of the story with Core Data. Although it is a stable
    and mature framework that is being used by thousands of applications on a daily
    basis, there are most certainly things coming in the future that will make it
    even greater. Just comparing its abilities to those of Enterprise Objects, we
    know that the best is yet to come. If you are starting an application now, you
    should be using Core Data.


    # ## 1.2 In This Book


    Within this book we''ll build a single application that utilizes Core Data. We''ll
    use that application as the foundation through our journey with Core Data. Once
    we have the application started, we''ll cover a few of the technologies that are
    not strictly speaking part of Core Data, but they nonetheless make Core Data work.
    We will then start exploring Core Data in depth and how it applies to and works
    with the other technologies of OS X.


    We will start off in Chapter 2, Getting Started with Core Data, on page 14, with
    building our demo application. In that chapter, we will go through all the steps
    to make our application functional, but we''ll step through'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'them very quickly. The goal of the chapter is to give us a frame upon which
    to build as we explore the depths of Core Data. By the end of the chapter, we
    will have a basic Core Data application running that we can then expand upon.


    In Chapter 3, *Core Data and Bindings*, on page 34, we will explore Key Value
    Observing (KVO) and Key Value Coding (KVC), which are at the heart of what makes
    Core Data such a powerful framework. Without an understanding of KVO and KVC,
    the rest of Core Data will seem like magic. Therefore, we will make sure we have
    a solid understanding of how these technologies work and how they apply to Core
    Data.


    Next in Chapter 4, *Under the Hood of Core Data*, on page 51, we will explore
    the big pieces of Core Data. We will take each component and grasp how it works
    with our application that we wrote and what it does in the overall Core Data framework.
    I strongly recommend bookmarking this chapter, because we will be utilizing its
    components through the rest of the book.


    In Chapter 5, *Versioning and Migration*, on page 73, we will explore how to change
    our underlying data model once our application has been released to the public.
    Mistakes happen, and more often than not, improvements to an application cause
    a need for the data to change. In this chapter we will explore how to handle the
    changes to data and how to migrate it from one version to another. At the end
    of this chapter, we will discuss a technique that makes versioning and migration
    easier and reduces the amount of maintenance we need to perform.


    In Chapter 6, *Performance Tuning*, on page 97, we take the components we learned
    from Chapter 4 and explore how to make them run as fast as possible. Although
    Core Data does a lot of work for us and is very performant, it is still possible
    to do the wrong thing and slow it down. In this chapter we will discuss some of
    the common mistakes made and how to avoid them. With that knowledge, we will be
    better armed going forward to avoid those mistakes so that we don''t have to go
    back and fix them later.


    In Chapter 7, *Spotlight, Quick Look, and Core Data*, on page 114, you''ll learn
    about integrating our Core Data application with the rest of the operating system.
    Nothing screams polish to me like an application that works well with both Spotlight
    and Quick Look. In this chapter we will learn how to make that happen in our application.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'In Chapter 8, *Sync Services and Core Data*, on page 140, we''ll discuss ways
    in which we can sync the data that is in our application across multiple instances.
    With more and more users having more than one computer, it is ever more important
    to be able to keep data “in the cloud” and sync it properly across machines. By
    the end of this chapter, we will be able to add that functionality to our application.


    In Chapter 9, *Multithreading and Core Data*, on page 162, you''ll see how to
    maximize the use of the computing power available to us. Modern desktops and laptops
    have more than one CPU available to use, and if the situation demands it, is expected
    that our applications will take advantage of all that processing power in a parallel
    manner. In this chapter, we explore the safe ways to make a Core Data application
    multithreaded.


    In Chapter 10, *Core Data and iPhone*, on page 184, we take a side step to discuss
    how we can use the power and flexibility of Core Data to make our iPhone development
    easier. In this chapter we will also be introduced to a new controller object
    that does not currently exist on the Desktop.


    In Chapter 11, *Recipe: Distributed Core Data*, on page 207, we explore one solution
    for using Core Data across a distributed environment. By combining Core Data,
    Bonjour, and distributed objects, we can access a Core Data repository from more
    than one client spread across a local network. Although I would not recommend
    developing the next great MMORPG with this solution, it certainly has its uses.


    In Chapter 12, *Recipe: Dynamic Parameters*, on page 228, the final chapter, I
    share one of my secrets that I used in Simply Elegant Sales and have used several
    times since its original design. In this recipe, we design a document-level properties
    storage system similar to NSUserDefaults.


    By the end of this book, we will have a superior grasp of all that Core Data can
    do along with many practical applications of this technology. From here we can
    take that knowledge to build the next generation of fantastic desktop applications.


    # 1.3  Acknowledgments


    When I first started working with Core Data, I enjoyed it so much that I wanted
    to share all the discoveries that I had made with it. I soon'
  merge: -1
  img_proc: true
