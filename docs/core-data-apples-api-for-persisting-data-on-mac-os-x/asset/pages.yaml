  md: '# More Mac OS X Titles...


    For more books and screencasts on Xcode, Cocoa, the iPhone, TextMate and other
    Mac topics, please visit [www.pragprog.com](http://www.pragprog.com).


    # Cocoa Programming


    Cocoa Programming shows you how to get productive with Cocoa-fast! You''ll learn
    to use the Apple developer tools to design your user interface, write the code,
    and create the data model. We''ll show you Objective-C concepts when you are ready
    to apply them throughout the book. By the end of the book, you''ll be a Cocoa
    programmer.


    +   - **Cocoa Programming: A Quick Start Guide for Developers**

    +     Daniel H Steinberg

    +     (280 pages) ISBN: 978-19343563-0-2. $32.95

    +     [http://pragprog.com/titles/dscpa](http://pragprog.com/titles/dscpa)


    ![](img/ffa5f756dbdb501d7886468ffb761ad4_247_0.png)


    # Core Animation for OS X/iPhone


    Have you seen Apple''s Front Row application and Cover Flow effects? Then you''ve
    seen Core Animation at work. It''s about making applications that give strong
    visual feedback through movement and morphing, rather than repainting panels.
    This comprehensive guide will get you up to speed quickly and take you into the
    depths of this new technology.


    +   - **Core Animation for Mac OS X and the iPhone: Creating Compelling Dynamic
    User Interfaces**

    +     Bill Dudney

    +     (220 pages) ISBN: 978-1-9343561-0-4. $34.95

    +     [http://pragprog.com/titles/bdcora](http://pragprog.com/titles/bdcora)


    ![](img/ffa5f756dbdb501d7886468ffb761ad4_247_1.png)'
