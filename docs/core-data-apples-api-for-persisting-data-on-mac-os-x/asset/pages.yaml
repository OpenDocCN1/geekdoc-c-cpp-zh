- pgno: 138
  md: '# 7.4  Taking It Further


    # Further Use of UTIs


    With UTIs it is possible to integrate even further with the operating system,
    Spotlight, and Quick Look. It is possible to publish a full description of the
    UTI—effectively injecting it into the tree and thus having the data type appear
    in Spotlight rules and more. However, this is beyond the scope of this book.


    ![](img/ffa5f756dbdb501d7886468ffb761ad4_138_0.png)


    # Decreasing the Size of the Metadata Files


    Depending on the application, it is possible to reduce the metadata files dramatically.
    Since the importer (and the generator) can stand up the entire Core Data stack,
    it is possible to just have the NSManagedObjectID (or even a unique identifier
    within the Recipe object) stored in the metadata file and have the importers and
    generators retrieve all the metadata information from the Core Data stack instead.
    This would also simplify the updating of the metadata since the only action required
    at that point would be to delete metadata files for records that no longer exist.
    However, care must be taken with this approach because performance may suffer
    greatly.


    # Improving the Quick Look Thumbnail Generator


    You may have noticed that we ignored the max size setting of the Quick Look thumbnail
    generator. That was done for the sake of clarity, and in a production system we
    should be sizing down the image to accommodate that setting. By doing so, we would
    be good citizens as well as be helping the performance of Quick Look whenever
    our files are involved.


    # Document-Based Applications


    When writing an application that uses a document model as opposed to a single
    repository, then integrating Spotlight and Quick Look is even easier. Instead
    of having separate metadata files, we can simply store the relevant information
    in the metadata of the actual documents. This allows the importers to read the
    metadata without having to initialize the entire Core Data stack and still allows
    for very quick access to the relevant information.


    ![](img/ffa5f756dbdb501d7886468ffb761ad4_138_1.png)


    This is probably very similar to how Core Data does it internally via Snow Leopard.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# # Sync Services and Core Data


    Cloud computing is in our future. Users do not want to have to worry about which
    computer they stored their data on. It brings great peace of mind to me knowing
    that when I enter a new contact on my laptop while I am out, it will get synced
    to my other computers and my phone. For every application where it makes sense
    to share data across computers, it is incumbent upon us as developers to make
    the option available to our users.


    Fortunately, Apple has made huge advances in Sync Services in Leopard. One of
    those improvements was to integrate Sync Services with Core Data. Although it
    is still nontrivial to utilize Sync Services, it is significantly simpler than
    it was in Tiger, and when combined with Core Data, it is even easier than it would
    be without that combination.


    When our data is stored in Core Data and we are writing an application that is
    at least Leopard targeted, Sync Services can use the Core Data model directly
    to get information about the data to be synced. In addition, since the data format
    of Core Data is known as far as the Sync Services APIs are concerned, the amount
    of code required to perform a sync is one line. For anyone who has written Sync
    Services code under a previous version of Mac OS X, this will be a welcome change.


    Although the sync operation itself is only one line of code, quite a bit of work
    is still required to get syncing working correctly. We will need to configure
    our data model properly for Sync Services, create a sync schema, and add the syncing
    logic to our application, and we will need to make a couple of changes to our
    persistent store coordinator.


    Overall, adding syncing to an application can be quite a challenge, but the end
    result is definitely worth it. When we are done, our users'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'will not have to worry about which Mac they added or updated their recipe on.
    Simply updating the recipe on their laptop will cause it to get updated on every
    other Mac they have.


    # ## 8.1 Sync Services Fundamentals


    Conceptually, Sync Services works on the principle of a single source of truth.
    That truth is stored at the operating system level and operates very much like
    a database. Each entity for each application is stored in the truth as a single
    record, and the truth keeps track of every change to every entity.


    # ### Sync Clients


    Every application, device, server, or peer¹ is considered a client to Sync Services
    and talks to the truth. Even if an application is the source of that data, like
    our recipes application is, it is still considered a client of the truth, and
    therefore it syncs to that truth.


    As a client, it is expected that our application will register with the truth
    and give it a description. That description will let the truth know our name,
    the image to use when talking about us, and what entities we care about. The entities
    part is what makes Sync Services very powerful. We can subscribe to more data
    than we produce. For instance, we could receive sync notifications for calendars,
    contacts, or bookmarks if we were interested. Although we will be paying attention
    to only our recipe objects at this time, it is definitely *possible* to listen
    for more.


    As part of the registration, each client defines a callback method that Sync Services
    will use to let the client know that a sync is about to happen. The client can
    choose not to participate in the sync at that time, but generally, it is a good
    idea to be part of the sync. Sync Services will not call a client unless data
    it cares about is being synced.


    When a sync is performed, there are three steps to the sync process: push, mingle,
    and pull. During the push phase, each client pushes all changes it has that have
    occurred since the last sync. Once the truth has received all the changes from
    all the clients, a mingle is performed. The mingle merges all the changes from
    all the clients into a single data set. This mingle happens entirely within the
    truth, and clients simply wait for this phase to be over. Once the mingle phase
    is complete, the


    1. Currently the only server available is MobileMe, and there are no provisions
    for peers.'
