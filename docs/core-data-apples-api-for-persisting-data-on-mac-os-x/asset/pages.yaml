    \ CFMutableDictionaryRef. Once we are done with the NSDictionary, we return TRUE\
    \ and are done. Since we are running inside a C function, we need to wrap the\
    \ entire procedure in an NSAutoreleasePool so that we are not leaking any memory.\n\
    \n# Testing the Spotlight Importer\n\nThere are a couple of ways to test the importer\
    \ to make sure that everything is working properly. The first thing we need to\
