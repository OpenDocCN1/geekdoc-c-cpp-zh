- pgno: 81
  md: 'Along the way, we learned how to create multiple versions of our data model
    and how to create mapping models to describe how to transition the data between
    versions.


    # ### 5.3 Fundamentals of Core Data Versioning


    So, what is the magic behind all of this? How does the data migration actually
    work? As we already explored in the previous chapters, Core Data works with MOM
    objects that describe the data entities, their attributes, and their relationships.
    Core Data versioning works with those same MOM objects but takes the design one
    step further. Each entity version in each data model has a unique hash. When Core
    Data loads a persistent store from disk, it resolves the matching hashes in the
    persistent store against the MOM objects included with the application. If the
    matching MOM is not flagged as the “current” MOM, then data migration kicks in.


    # #### How Data Migration Works


    Core Data handles data migration in a very straightforward manner. Whenever a
    persistent store needs to be migrated, there are three steps.


    # #### Copying of the Entities with Attributes


    In the first pass of the migration, Core Data creates new entities in the new
    persistent store for every entity in the old store. These entities have their
    attributes copied over but not their relationships. During this phase, Core Data
    also keeps a reference to the old unique ID for each entity to be used in phase
    2.


    # #### Creating Relationships Between the Entities


    In the second pass, Core Data builds all the relationships between the entities
    based on the previous relationships. This is where the reference in phase 1 is
    used.


    # #### Validation of the New Store


    During the migration, all validation rules are turned off, and Core Data ignores
    the child classes defined in the MOM. Therefore, it is possible that some data
    validation rules got broken during the migration. In the final phase of the migration,
    Core Data goes back through the store and checks all the validation rules to ensure
    that the data is in a valid state.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Model Versions and Hashes


    The word *versioning* has been used through this chapter as well as other material
    to describe data migration in Core Data. Unfortunately, it is an inaccurate term.
    Versioning implies that there is an order or precedence to the models. This is
    not accurate when it comes to data model versioning/migration in Core Data.


    # Entity Hashes


    Instead of keeping track of a version number, creation date, or some other potentially
    chronological identifier, Core Data generates a hash for each entity in a model.
    Those hashes are then stored within the persistent stores created with that model
    for later comparison. When a persistent store is loaded, the first thing that
    Core Data does is to retrieve the metadata from that store. Inside that metadata
    is a list of every entity type in the store along with the hash for that entity.
    Core Data then compares that list of hashes against the hashes of the “current”
    MOM. If they match, then everything is fine, and the store is loaded. If they
    do not match, then Core Data checks the options on the load persistent store call
    to see whether automatic data migration is requested. If it is not, then the error
    message from Section 5.1, *Some Maintenance Before We Migrate*, on page 74 is
    presented to the user.


    # Changing the Hash Values


    Surprisingly, not everything that changes inside a MOM causes the hash of the
    entities inside to change. There are actually quite a few things that we can do
    to a model that does not trigger data migration at all.


    # Changes That Alter the Entity Hash


    If any of the following are changed on an entity, the entity will report a different
    hash:


    +   - Name: The name of the entity

    +   - Inheritance: Changing who the parent entity is

    +   - Persistent properties: Adding or removing a property


    In addition, changing the following for properties will also trigger a change
    to the entity hash:


    +   - Name: The name of the property'
