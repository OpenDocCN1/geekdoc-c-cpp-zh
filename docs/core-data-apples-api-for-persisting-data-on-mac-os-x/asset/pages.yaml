    Cocoa and its related technologies. During that time, we continued to share what
    we were learning and teaching in the form of the blog “Cocoa Is My Girlfriend.”
    All of that led to this book. What started out with a simple altruistic gesture
    has turned into the text you are about to enjoy. Along the way I have been helped
