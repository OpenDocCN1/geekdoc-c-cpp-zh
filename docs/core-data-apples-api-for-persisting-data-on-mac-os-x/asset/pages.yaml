    \ set parameters. This is done in the counterpart method of -valueForUndefinedKey:\
    \ called -setValue:forUndefinedKey:. In this method, we first notify the system\
    \ that we are going to be changing the value associated with the passed-in key.\
    \ This is part of KVO and is required so that notifications work correctly. After\
    \ starting the KVO notification, we attempt to retrieve the NSManagedObject from\
    \ the parameters table. If there is no NSManagedObject for the passed-in key,\
    \ we then check the defaults NSDictionary to see whether there is a default. If\
    \ there is a default set and the passed-in value matches the default, we complete\
    \ the KVO notification and return. If the default value does not match the passed-in\
    \ value, we create a new NSManagedObject for the passed-in key.\n\nIf there is\
    \ an NSManagedObject and a default set for the key, we compare the default value\
    \ to the passed-in value. If they match, we then *delete* the NSManagedObject,\
    \ which effectively resets the parameter to the default. Once we pass the checks\
    \ against default and/or create the NSManagedObject, we test the value to see\
    \ whether it is an NSNumber or NSDate. If it is, then we pass in its -stringValue\
    \ or -description as the value for the NSManagedObject. Otherwise, we pass in\
    \ the value directly to the NSManagedObject. Once the value is set, we call -didChangeValueForKey:\
    \ to complete the KVO notification.\n\n# ### -createParameter:\n\nDownload CDReferences/DocumentPreferences.m\n\
    \n```\n```objective-c\n- (NSManagedObject*)createParameter:(NSString*)name\n{\n\
    \    NSManagedObject *param;\n    NSManagedObjectContext *moc;\n```\n```"
