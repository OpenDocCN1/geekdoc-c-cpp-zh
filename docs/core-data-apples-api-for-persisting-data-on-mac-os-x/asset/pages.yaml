  md: "# NSOperation and NSOperationQueue\n\nThroughout this chapter we will be using\
    \ NSOperation and NSOperationQueue quite heavily. These are classes that were\
    \ added to Cocoa as part of Mac OS X 10.5 Leopard specifically to make threading\
    \ easier. Although we will not be going into detail on how to use these classes,\
    \ it is of extreme value to fully learn these classes so that you can use them\
    \ properly in your own projects.\n\nOften one naming issue causes some confusion\
    \ while using NSOperation. The NSOperation uses a method named -main as the entry\
    \ point for the work that the NSOperation is to complete while running on a background\
    \ thread. The NSOperationQueue calls this method directly.\n\nAnother issue is\
    \ one of concurrency. If an NSManagedObject is updated on more than one thread,\
    \ then the results of one or more of those updates is undetermined and unpredictable.\
    \ Therefore, it is recommended that NSManagedObject instances do not cross thread\
    \ “boundaries.”\n\n# 9.2  Creating Multiple Contexts\n\nCurrently, there is one\
    \ approved method for using Core Data across multiple threads. This method involves\
    \ creating a separate NSManagedObjectContext for each thread that will be interacting\
    \ with Core Data. The creation of the separate context on a background thread\
    \ is quite straightforward and is nearly identical to the creation of the NSManagedObjectContext\
    \ on the main thread.\n\n```\n```objective-c\n- (NSManagedObjectContext*)newContextToMainStore\n\
    {\n    NSPersistentStoreCoordinator *coord = nil;\n    coord = [AppDelegate persistentStoreCoordinator];\n\
    \n    NSManagedObjectContext *moc = [[NSManagedObjectContext alloc] init];\n \
    \   [moc setPersistentStoreCoordinator:coord];\n    return [moc autorelease];\n\
    }\n```\n```"
