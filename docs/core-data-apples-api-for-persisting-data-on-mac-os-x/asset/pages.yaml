- pgno: 13
  md: '# # Getting Started with Core Data


    Instead of starting off discussing theory or reviewing the concepts behind Core
    Data, we will dive right into writing a Core Data application. The application
    we build in this chapter will be used throughout the rest of the book to explore
    the intricacies of Core Data.


    You will be learning through doing. We will build a basic application and, in
    the chapters following, look back through it to understand what the pieces actually
    do. In this book we are writing a food recipe application that uses Core Data.
    The concepts within a recipe application are well known, and we will avoid spending
    cycles on trying to figure out the concepts of the application while also trying
    to grok Core Data itself.


    # ## 2.1 Our Application


    Before we start building our application, we will do a quick overview of how the
    UI will look and work (see Figure 2.1, on the following page).


    In section 1, we will allow the user to edit information about individual recipes.
    Each recipe can be selected in the list and its details edited next to it.


    In section 2, we will allow the user to enter the ingredients of the selected
    recipe. Each recipe will have its own list of ingredients that can be added, viewed,
    and edited here.


    In section 3, we will allow the user to add a picture of the recipe for reference.
    This is a view-only element, and the addition of the image will be handled through
    the main menu.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_14_0.png)


    Figure 2.1: Our recipe application


    # ## 2.2 Our Application Design


    In this chapter, we will start at the very beginning. You will be launching Xcode
    and proceeding through all the steps to create the application and bring it to
    a usable state. At the end of this chapter, you may be surprised that the steps
    to create our application are so few. This is part of the allure and strength
    of Cocoa development. Coupled with Core Data, it is doubly so.


    In the first version of our recipe application, we will give our future users
    the following abilities:


    +   - The ability to add recipes with a description, type, name, image, and number
    of people it serves

    +   - The ability to add ingredients to those recipes that include a name, quantity,
    type, and unit of measure


    This first version of our application is intentionally simple. This is useful
    both so that we can add features to it later and thereby explore some of the abilities
    of Core Data and so that we can keep the distractions to a minimum while we explore
    Core Data.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# ## 2.3 Advanced Readers


    If you are already a bit familiar with Core Data and building a Core Data application,
    please feel free to move quickly through the rest of this chapter. In this chapter,
    we will walk through the construction of our project and how to build its data
    model. The end result will be a data model like the one shown in Figure 2.4, on
    page 21.


    ![](img/ffa5f756dbdb501d7886468ffb761ad4_15_0.png)


    # ## 2.4 Creating Our Xcode Project


    The first step is to create our Xcode project. With the recent versions of Xcode,
    quite a few project templates are available to us, and more than one of those
    is based on Core Data. If you are using Leopard, then you will want to use the
    Core Data Application template, and if you are using Snow Leopard, then you want
    to select the Cocoa Application template and ensure that the “Use Core Data for
    storage” checkbox is selected.


    Once we select which template, we will name the project Grokking Recipes, which
    will also be the name of our application.¹ In your Groups & Files listing in Xcode,
    you will see an additional folder named Models containing the data model file
    (see Figure 2.2, on the following page).


    The basic Core Data template gives us an application that works somewhat like
    Address Book. In Address Book, the user has only one data file and generally accesses
    that data file via one window. Our recipes application will be designed around
    that same pattern. We will have exactly one data file that all the user''s recipes
    will be stored in.


    Once the project is created in Xcode, it is time to start building the Core Data
    aspects of our application.


    # ## 2.5 Building the Data Model


    Core Data applications are like database-driven applications, and in that light,
    we will start with building the data structures first and then move to the user
    interface. The three components we are going to be working with at this point
    are entities, attributes, and relationships.


    In our design (see Section 2.2, Our Application Design, on the previous page),
    we already described at least two of the data objects that we


    1. Although it can be changed later.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_16_0.png)


    Figure 2.2: The data model in Xcode


    want to use and at least some of the attributes. Therefore, we will start with
    them. In our Xcode project, there is a group called Models, and within that group
    is a file called DataModel.xcdatamodeld.² This file is a representation of the
    data structure that Core Data will use. This file has a lot of similarities to
    an entity-relationship diagram (ERD) except that Xcode will compile it directly
    into our final data file structure.


    # Adding an Entity to the Model


    In Core Data, an entity has a lot of similarities to a table in a normal database
    design. Although this similarity is not exact, it is a good place to start.


    To add our first entity to our data model, first open the .xcdatamodeld file in
    the Models group, and then choose Design > Data Model > Add Entity from the menu
    bar (or use the + button in the entry area in the top left). This will add a blank
    entity to our data model. Next, double-click the name of the entity, and rename
    it to Recipe.


    2. It is possible this file will be named ${PROJECT_NAME}_DataModel.xcdatamodeld
    depending on the version of Xcode you are using.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/ffa5f756dbdb501d7886468ffb761ad4_17_0.png)


    # ## Adding an Attribute Property


    Just as an entity has a lot of similarities to a table, a property has quite a
    few similarities to a column in that table. This similarity breaks down very quickly
    when we start adding relationships, but it helps in the beginning to think of
    it this way. Properties are further broken down into several subtypes; the two
    most relevant are attributes and relationships. Relationship properties describe
    the relationships between two entities, and attribute properties are the values
    of an entity.


    To add our first attribute property to our Recipe entity, select the entity, and
    choose Design > Data Model > Add Attribute from the menu bar; you can also use
    the top + button or the keyboard shortcut. Like the entity creation, this will
    create a new attribute property within our entity. Double-click the name of this
    property, and rename it to name. After renaming the attribute, select it to see
    its details, as shown in Figure 2.3.


    These details allow us to control several aspects of the attribute including the
    default value, what type of attribute it is, and whether it is transient, indexed,
    optional, and so on. We will go through all of these settings in greater detail
    later, so for now set the type to String, set the default value to untitled, and
    make sure it is not optional.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Once the first attribute is finished, add the following attributes to the Recipe
    object:


    +   - Set imagePath to an optional String without a default value.

    +   - Set desc to an optional String without a default value.

    +   - Set serves to an Integer 16 with a minimum value of 1 and a default value
    of 1. Be sure to flag it as nonoptional.

    +   - Set type to an optional String with a default value of Meat.


    # Creating Our Second Entity


    With the Recipe entity nearly complete, it is time to create our second entity.
    This second entity will store the ingredients that go into a recipe, and we will
    call it RecipeIngredient. Following the same steps, we can add these attributes:


    +   - Set name to a nonoptional String with a default value of untitled.

    +   - Set quantity to a nonoptional Integer 16 with a minimum value of 0 and a
    default value of 1.

    +   - Set unitOfMeasure to a nonoptional String with a default value of untitled.


    # Adding a Relationship Property


    Relationship properties are created in the same way as attribute properties, although
    the specifics naturally differ. Add a relationship to the Recipe entity by selecting
    Design > Data Model > Add Relationship from the menu bar. For this first relationship,
    name it ingredients, and flag it as optional.


    Where a relationship is different from an attribute, however, is in the properties.
    Instead of defining an object type, default values, and so on, we are instead
    defining a destination entity, an inverse relationship, and whether this relationship
    is “to-many.” For this relationship, we will start by naming it ingredients, and
    then we set the destination entity to RecipeIngredient, but we are not going to
    set the inverse relationship yet. We are also going to flag it as to-many, since
    a recipe can definitely have more than one ingredient.


    The last option, the delete rule, instructs Core Data on how to handle the relationship
    when this, the Recipe entity, is deleted. In this relationship, we will delete
    the RecipeIngredient object to avoid any disconnected objects. Therefore, we will
    select the cascade option, which will remove any associated RecipeIngredient objects
    when the Recipe entity is deleted.'
