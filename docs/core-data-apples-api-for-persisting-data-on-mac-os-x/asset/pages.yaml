- pgno: 151
  md: "```\n```objective-c\nNSString *fss = @\"GrokkingRecipes.fastsyncstore\";\n\
    fss = [applicationSupportFolder stringByAppendingPathComponent:fss];\nNSURL *fsdURL\
    \ = [NSURL fileURLWithPath:fss];\n\n[persistentStoreCoordinator setStoresFastSyncDetailsAtURL:fsdURL\n\
    \                                      forPersistentStore:store];\n\nreturn persistentStoreCoordinator;\n\
    ```\n```\n\nIn this code snippet there are two important changes. First, instead\
    \ of checking to see whether the call to addPersistentStoreWithType:configuration:URL:options:error:\
    \ returned a nil or not, we assign its result to a local variable. We do this\
    \ so that we can pass it into the setStoresFastSyncDetailsAtURL:forPersistentStore:\
    \ method further down. Next we build a path for the fast sync store to be written\
    \ to. Since we are storing our data in the Application Support folder, it makes\
    \ sense to just store it alongside the primary persistent store. If we were using\
    \ a document application, then it might make sense to store it somewhere else\
    \ or with a unique filename. Once the path is built, we pass that path along with\
    \ our reference to the NSPersistentStore to the category method setStoresFastSyncDetailsAtURL:forPersistentStore:\
    \ on our NSPersistentStoreCoordinator. That is the only change we need to make\
    \ to our Core Data stack to enable Sync Services support.\n\n# 8.6 Creating the\
    \ Sync Helper\n\nNow it is time to put all the pieces together. Although this\
    \ piece can be put just about anywhere, I decided to separate all the sync code\
    \ into its own class for clarity. When I originally wrote this code, I had put\
    \ it into the AppDelegate.m but quickly decided that it was causing that object\
    \ to be too complex and hard to follow. Therefore, I decided to separate the syncing\
    \ code into a small helper class.\n\n# NSPersistentStoreCoordinatorSyncing\n\n\
    As I mentioned in the fundamentals (Section 8.1, *Sync Services Fundamentals*,\
    \ on page 141), Sync Services needs a callback to let our client know what is\
    \ going on. To be completely accurate, we need both a callback and a protocol.\
    \ The callback is used by Sync Services to let our application know that a sync\
    \ is about to happen. The protocol allows us to listen in to that sync and answer\
    \ questions as things go by. Our sync helper will implement that protocol named\
    \ NSPersistentStoreCoordinatorSyncing."
