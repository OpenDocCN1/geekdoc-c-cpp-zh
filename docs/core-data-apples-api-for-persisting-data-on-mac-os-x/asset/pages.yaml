  md: "# -associateObject:parent:\n\nThis method is called from the -copyPropertiesFromObject:toObject:parent:\
    \ method whenever it fails to find a destination object in the lookup dictionary.\n\
    \n```\n~~~objectivec\nDownload MultiThreading/PPImportOperation.m\n\n- (id)associateObject:(NSManagedObject*)object\
    \ parent:(NSString*)name\n{\n    NSManagedObjectContext *moc = [self mainContext];\n\
    \    NSString *entityName = [[object entity] name];\n    id temp = nil;\n\n  \
    \  if ([entityName isEqualToString:@\"RecipeIngredient\"]) {\n        temp = [NSEntityDescription\
    \ insertNewObjectForEntityForName:entityName\n                               \
    \     inManagedObjectContext:moc];\n        [[self lookup] setObject:temp forKey:[object\
    \ objectID]];\n        [self copyPropertiesFromObject:object toObject:temp parent:name];\n\
    \        return temp;\n    }\n\n    if (temp = [self objectOfType:entityName\n\
    \                withName:[object valueForKey:@\"name\"]]) {\n        [[self lookup]\
    \ setObject:temp forKey:[object objectID]];\n        return temp;\n    }\n\n \
    \   temp = [NSEntityDescription insertNewObjectForEntityForName:entityName\n \
    \                               inManagedObjectContext:moc];\n    [[self lookup]\
    \ setObject:temp forKey:[object objectID]];\n    [self copyPropertiesFromObject:object\
    \ toObject:temp parent:name];\n    return temp;\n}\n~~~\n```\n\nIn this method,\
    \ unlike the previous method discussed, we care what kind of entity we are working\
    \ with. If we are working with a RecipeIngredient, then we know to just blindly\
    \ create a new object. However, for any other object, we need to first check to\
    \ see whether it already exists in the NSManagedObjectContext. We do this by calling\
    \ -objectOfType:withName:, and if it returns a nil, then we need to create a new\
    \ object. If it returns an NSManagedObject, then we associate that returned object\
    \ with the original object passed in so that future calls against it will be found\
    \ in the lookup dictionary.\n\nThere are a couple of things to note. First, no\
    \ matter whether we are creating a new object or associating an existing object,\
    \ we always store"
