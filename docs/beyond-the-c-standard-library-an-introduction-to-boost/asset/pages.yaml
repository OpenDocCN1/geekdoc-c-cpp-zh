    # Boost.Call_traits


    This library provides automatic deduction of the best way of passing arguments
    to functions, based upon the argument type. For example, when passing builtint
    types such as int and double, it is most efficient to pass them by value. For
    user-defined types, passing them by reference to const is generally preferable.
    Call_traits automatically selects the right argument type for you. The library
    also helps in declaring arguments as references, without imposing restrictions
    or risk referring references to references (which are illegal in C++). Call_traits
    is typically used with generic functions that require the most efficient way of
    passing arguments without knowing much about the argument types, and avoid the
    reference-to-reference problem.


    The authors of Call_traits are Steve Cleary, Beman Dawes, Howard Hintant, and
    John Maddock.


    # Boost.Concept_check


    Concept_check supplies class templates that are used to test certain concepts
    (set of requirements). Generic (as in parameterized) code typically requires the
    types with which it model some abstraction, such as LessThanComparable. This library
    provides the means to explicitly state the requirements of the parameterizing
    types for templates. Clients of the code benefit because the requirements are
    documented and because the compiler can produce an error message explicitly states
    how a type failed to meet them. Boost.Concept_check provides more than 30 concepts
    that can be used for generic code, and several archetypes may be used to verify
    component implementations include all relevant concepts. It is used to assess
    and document the requirements for concepts in generic code.


    The author of Concept_check is Jeremy Siek, who was inspired by previous work
