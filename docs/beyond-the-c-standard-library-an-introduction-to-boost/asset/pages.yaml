  md: '# Usage


    any_cast gives you access to the value stored in any. The argument is the any
    whose value is to be retrieved. If the type ValueType does not correspond to the
    type of the stored value, any throws a bad_any_cast exception. Note that the syntax
    is like that of dynamic_cast.


    ```

    template<typename ValueType>

    const ValueType* any_cast(const any* operand);

    ```


    This overloaded any_cast takes a pointer to any, and returns a pointer to the
    stored value. If the type in the any isn''t ValueType, a null pointer is returned.
    Note, again, that the syntax is like that of dynamic_cast.


    ```

    template<typename ValueType>

    ValueType* any_cast(any* operand);

    ```


    This overloaded any_cast is similar to the preceding version, whereas the previous
    version used const-qualified pointers for return type and argument type, this
    version doesn''t.


    # Exceptions


    bad_any_cast


    This exception is thrown when trying to cast an any object to a type other than
    the type stored in the any. bad_any_cast is derived from std::bad_cast. Note that
    when calling any_cast with a pointer argument, no exception is thrown (similar
    to how dynamic_cast with pointer types return the null pointer)-where as dynamic_cast
    to reference types throws an exception on failure.


    # Usage


    The Any library resides in namespace boost. You use the class any to store values,
    the template function any_cast to subsequently retrieve the stored values. To
    use any, include the header "boost/any.hpp". The creation of an instance capable
    of storing any conceivable value is straightforward.


    ```

    boost::any a;

    ```'
