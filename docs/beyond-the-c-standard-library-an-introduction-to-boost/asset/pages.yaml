  md: '# Variant


    Destroys the variant, calls the destructor for the active value. Note that for
    pointer types, the destructor is not called (destroying the pointer is a no-op).
    This destructor never throws.


    ```

    template <typename T> variant& operator=(const T& rhs);

    ```


    This operator discards the current value and assigns the value rhs. The type T
    must be unambiguously convertible to one of the bound types in the variant. If
    T is the type of the current value in the variant, rhs is assigned to the current
    value; any exceptions thrown by T''s constructor operator, if any, will propagate.
    If the variant''s current value''s type is not T, the current value is replaced
    by one created by the (copy) constructor of the type, corresponding to T, selected
    from the set of bound types. Any exceptions thrown by that constructor will propagate.
    This function may also throw bad_alloc.


    ```

    int which() const;

    ```


    Returns the zero-based index, in the set of bounded types, of the current value''s
    type. This function never throws.


    ```

    bool empty() const;

    ```


    This function always returns false, because a variant is never empty. This function
    exists to allow generic code to treat variants and boost::anys uniformly.


    ```

    const std::type_info& type() const;

    ```


    Returns the type_info for the current value. This function never throws.


    ```

    bool operator===(const variant& rhs) const;

    ```


    Returns true if *this and rhs are equal, which means that which()==rhs.which()
    and the current value of *this and rhs are equal according to the equality operator
    of the current value''s type. This necessitates that all of the bounded types
    are EqualityComparable. Any exceptions thrown by operator== of the current value''s
    type are propagated.


    ```

    bool operator<(const variant& rhs) const;

    ```'
