  md: '# Bibliography


    [9] Exceptional C++ (Herb Sutter)

    This is a book that should be read by all intermediate to advanced C++ programmers.
    The approach is to challenge the reader with a puzzle, and then provide an answer
    that explains, in great detail, good and bad solutions. It’s a very challenging
    and rewarding read.


    [10] Generative Programming: Methods, Tools and Applications (Krzysztof Czarnecki/Ulrich
    Eisenenecker)

    This is another modern classic. Probably the first book to talk in detail about
    templates as a tool for metaprogramming. It describes methods and tools to use
    generative programming—that generates programs. It’s an extensive book, but reading
    it is worth the time.


    [11] Generic Programming and the STL: Using and Extending the C++ Standard Template
    Library (Matthew Austen)

    Matt Austen is an unquestionable authority when it comes to the STL. In the first
    part of this book, he teaches the reader about the design decisions that influence
    the STL, and how to build on design to properly extend the existing components
    of the STL. The other part of the book is a reference (for SGI STL). The first
    part is what makes this book so interesting; it’s the most concise and correct
    introduction to “the STL way” I’ve ever read.


    [12] Imperfect C++ (Matthew Wilson)

    With a glance in the eye, Matthew Wilson guides the reader through the trenches
    of real-world C++ language peculiarities, useful idioms, anti-idioms, and more.
    A book that teaches the inner workings of C++ and invites the reader to the occasional
    laugh is a rare treat. This book’s definitely worth reading.


    [13] International Standard ISO/IEC 14882

    The++ Standard is definitely not a textbook or tutorial, but having the actual
    definition of the language at hand is a must for serious programmers. If nothing
    else, you’ll be able to quote the Standard at meetings and parties. People love
    that.'
