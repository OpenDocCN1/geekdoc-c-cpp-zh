    However, the order of the last two lines is unspecified because slots belonging
    to the same group are invoked in an unspecified order. There is no way of telling
    which of our slots will be called first. Whenever the calling order of slots matters,
    you must put them into groups.


    # Grouping Slots


    It is sometimes important to know that some slots are called before others, as
    when the slots have side effects that other slots might depend upon. Groups is
    the name of the concept that supports such requirements. It is a signal template
    argument Group that is, by default, int. The ordering of Groups is std::less<Group>,
    which translates to operator for int. In other words, a slot belonging to group
    0 is called before a slot in group 1, and so on. Note, however, that slots in
    the same group are called in an unspecified order. The only way to exactly control
    the order by which all slots are is to put every slot into its own group.


    A slot is assigned to a group by passing a Group to signal::connect. The group
    to which a connected slot belongs cannot be changed; to change the group for a
    slot, it must be disconnected and reconnected to the signal in the new group.


    As an example, consider two slots taking one argument of type int; the first doubles
    the argument, and the second increases the current value by 3. Let''s say that
    the correct semantics are that the value first is doubled, and then increased
    by 3. Without a specified order, we have no way of ensuring these semantics. Here''s
    an approach that works on some systems, (typically when the moon is full and it''s
    Monday or Wednesday).'
