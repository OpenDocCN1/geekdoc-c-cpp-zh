    # How Does Smart_ptr Fit with the Standard Library?


    The Smart_ptr library has been proposed for inclusion in the Standard Library,
    and there are primarily three reasons for this:


    +   The Standard Library currently offers only auto_ptr, which is but one type
    of smart pointer, covering only one part of the smart pointer spectrum, shared_ptr
    offers different, arguably even more important, functionality.


    +   The Boost smart pointers are specifically designed to work with, and with
    a natural extension to, the Standard Library. For example, before shared_ptr,
    there were no standard smart pointers that could be used as elements in containers.


    +   Real-world programmers have proven these smart pointer classes through heavy
    use in their own programs for a long time.


    The preceding reasons make the Smart_ptr library a very useful addition to the
    C++ Standard Library. Boost.Smart_ptr''s shared_ptr (and the accompanying helper
    enable_shared_from_this) and weak_ptr have been accepted for the upcoming Library
    Technical Report.


    # scoped_ptr


    Header: "boost/scoped_ptr.hpp"


    boost::scoped_ptr is used to ensure the proper deletion of a dynamically allocated
    object. scoped_ptr has similar characteristics to std::auto_ptr, with the important
    difference that it doesn''t transfer ownership the way auto_ptr does. In fact,
    a scoped_ptr cannot be copied or assigned at all! A scoped_ptr assumes ownership
    of the resource to which it points, and never accidentally-renders ownership.
    This property of scoped_ptr improves expressiveness in our code, as we can select
    the smart pointer (scoped_ptr or auto_ptr) that best fits our needs.'
