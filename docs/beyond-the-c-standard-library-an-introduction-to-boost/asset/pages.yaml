  md: '# Composite Arithmetic Operators


    The concepts we''ve seen thus far represent primitive functionality. However,
    there are higher level, or composite, concepts that combine several primitive
    concepts or even add a primitive concept to another composite concept. For example,
    a class is totally_ordered if it is both less_than_comparable and equality_comparable.
    These groups are really useful both because they reduce the amount of code that
    needs to be written and that they explicitly name important, commonly used concepts.
    Because they merely represent the combination of concepts already covered, these
    concepts are most easily represented in a table showing the primitive concepts
    on which they are built. For example, if a class inherits from totally_ordered,
    it must implement the operators required for less_than_comparable(bool operator<
    (const T&, const T&)) and for equality_comparable(bool operator== (const T&, const
    T&)).


    | Composite Concept | Constituent Concepts |

    |---|---|n| totally_ordered | less_than_comparable equality_comparable |

    | additive | additive subtractable |

    | multiplicative | multiplicative dividable |

    | integer_multiplicative | multiplicative modable |

    | arithmetic | additive multiplicative |

    | integer_arithmetic | additive integer_multiplicative |

    | bitwise | andable orable xorable |

    | unit_steppable | incrementable decrementable |

    | shiftable | left_shiftable right_shiftable |

    | ring_operators | additive multiplicative |'
