  md: '# 374


    # Bibliography


    +   [4] C++ Templates—The Complete Guide (David Vandevorde/Nicolai Josutis)

    Don''t you love templates? Whether you do not, this book is one of only two in
    existence (the other is C++ Template Metaprogramming mentioned previously) that
    thoroughly discusses the ins and outs of templates; this is not a topic to be
    taken lightly, and the authors of the book don''t. This is indeed the complete
    guide. Get it.


    +   [5] Design Patterns—Elements of Reusable Object-Oriented Software (Erich Gamma,
    Richard Helm, Ralph Johnson, John Vlissides)

    This classic probably doesn''t need an introduction. If you haven''t read this
    book about one of the most important volumes in the software industry, do so now.
    Almost every programmer in the known universe should know the design patterns
    in this book. These four gentlemen, through this, changed the world.


    +   [6] Effective C++: 50 Specific Ways to Improve Your Programs and Design (Scott
    Meyers)

    This series is well known to professional C++ programmers. If you haven''t read
    it, you should. If you have, read it again. Scott Meyers teaches best practices
    and never forgets to explain why they are indeed best practices.


    +   [7] Effective STL (Scott Meyers)

    Here, Scott Meyers takes on effective and correct usage of the STL. A must-read
    for all are making extensive use of the Standard Library containers and algorithms.


    +   [8] Efficient C++: Performance Programming Techniques (Dov Bulka/David Mayhem)

    There are few books that cover optimization techniques for C++. In fact, I don''t
    think there is any other than this one. There is good coverage of the traditional
    means of speeding up those inner loops. Complement this with a book on template
    metaprogramming techniques and you''re all set for optimum performance.'
  merge: -1
