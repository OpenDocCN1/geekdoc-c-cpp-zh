  md: '# xii


    # Foreword


    to be integrated into the upcoming C++0x library, and more are under consideration.
    Where a library approach has been shown to be wanting, the wisdom gained from
    the cross-pollination of Boost and WG21 has suggested a few modest language enhancements,
    which are now being entertained.


    In the rare case that you haven''t heard of Boost, let ask...do you need to convert
    text and numbers or (better yet) between any streamable types? No problem—use
    Boost.lexical_cast. Oh, if you need more sophisticated text processing requirements?
    Then Boost.Tokenizer or Boost.Regex might be for you, or Boost.Spirit, if you
    need full-blown parsing. Boost.Bind will amaze you with its function projection
    and composition capabilities. For functional programming there is Boost.Lambda.
    Static assertions? Got ''em. If you''re mathematically inclined, get your pencil
    out: You have Boost.Math, Graph, Quaternion, Octonion, MultiArray, Random, and
    Rational. If you are fortunate enough to have discovered Boost.Python, And you
    can use it and C++ together with the help of Boost.Python. And you can practically
    pick your platform for all of the above.


    Björn Karlsson is a Boost enthusiast and a heartfelt supporter of the C++ community.
    He has published useful and well-written articles in the C/C++ Users Journal and,
    more recently, for The C++ Source, (see www.artima.com/cppource). In this volume,
    he motivates and illustrates key Boost components, and shows how they work and
    extend the C++ Standard Library. Consider this not only an in-depth tutorial on
    Boost, but also a foretaste of the future version of Standard C++. Enjoy!


    > —Chuck Allison, Editor, The C++ Source'
