- img_proc: true
  md: "```\nint main() {\n  boost::signal<bool>(double)> sig0;\n  boost::signal<bool>(double)>\
    \ sigl;\n\n  some_class sc;\n\n  sig0.connect(\n    boost::bind(&some_class::some_function,&sc,1));\n\
    \  sigl.connect(\n    boost::bind(&some_class::another_function,&sc,1));\n\n \
    \ sig0(3.1);\n  sigl(-12.78);\n}\n```\n\nBinding this way has an interesting side\
    \ effect: It avoids unnecessary copying of some_class instances. The binder holds\
    \ a pointer to the some_class instance and it's the binder that the signal copies.\
    \ Unfortunately, there's a potential life-time management issue with this approach:\
    \ If sc is destroyed and then one of the signals is invoked, undefined behavior\
    \ results. That's because the binder will have a dangling pointer to sc. By avoiding\
    \ the copies, we must also assume the responsibility of keeping the slots alive\
    \ so long as a connection exists that (indirectly) references them. Of course,\
    \ that's what reference-counting smart pointers are for, so the problem is easy\
    \ to solve.\n\nUsing binders like this is common when using Boost.Signals. Whether\
    \ you use lambda expressions to create your slots or binders to adapt existing\
    \ classes for use slot types, you'll soon value the synergy among Boost.Signals,\
    \ Boost.Lambda, and Boost.Bind. It will save you time and make your code elegant\
    \ and succinct."
