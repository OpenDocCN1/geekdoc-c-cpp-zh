  md: '# Preface


    Dear Reader,

    Welcome to Beyond the C++ Standard Library: An Introduction to Boost.


    If you are interested in generic programming, library design, and the C++ Standard
    Library, this book is for you. Because the intended audience for the book is intermediate
    to advanced C++ programmers, there is little coverage of basic C++ concepts. As
    the title suggests, the focus of this book is on the Boost libraries—general usage,
    best practices, implementation techniques, and design rationale.


    Almost from the day I discovered Boost, the people behind it, and the extraordinary
    libraries in it, I’ve wanted to write this book. It is amazing that a language
    as mature as C++ still offers room for exploration into higher-level abstractions
    as well as technical detail, all without requiring changes to the language. Of
    course, this is what makes C++ apart from many other programming languages: it
    is specifically and intentionally designed for extension, and the language’ facilities
    for generic constructs are extremely powerful. This exploration is at the core
    of the Boost libraries and the Boost community itself. Boost is about making programming
    in C++ more elegant, more robust, and more productive. As discoveries are made
    and best practices are shaped, a great challenge faces the C++ community; to share
    this knowledge with others. In isolation, there is limited value to these remarkable
    findings, but when exposed to a larger audience, a whole industry will evolve.


    This book shows how to use a selection of the wonderfully useful Boost libraries,
    teaches best practices for their use, and even goes behind the scenes to see how
    they actually work. The Boost libraries` grants permission'
