    # polymorphic_cast


    Header: "boost/cast.hpp"


    Polymorphic conversions in C++ are performed via dynamic_cast. A feature of dynamic_cast,
    which is sometimes the cause of erroneous code, is that behaves differently depending
    on the type with which it is used. dynamic_cast throws an exception-std::bad_cast—if
    the conversion is not possible when used on a reference. The reason for the exception
    is simple. There is no such as a null reference in C++, so either the conversion
    succeeds and the result is a valid reference or it fails and you get an exception
    instead. Of course, using dynamic_cast to convert a pointer type, failure is indicated
    by returning the null pointer.


    dynamic_cast’s different behavior depending on whether pointer or reference types
    used is a valuable property, because it allows the programmer to express intent.
    Typically, if a failed conversion doesn’t constitute a logical error, the pointer
    is used, and if it is an error, the reference version is used. Unfortunately,
    the difference is quite subtle—it boils down to an asterisk or ampersand—and it
    isn’t always a natural choice. What if a failed cast to a pointer is an error?
    To make clear by offering an exception automatically, and to make it consistent,
    Boost offers polymorphic_cast. It always throws a std::bad_cast exception if the
    conversion fails.


    In The C++ Programming Language 3rd Edition, Stroustrup has the following to say
    about dynamic_cast with pointer types, and the fact that it can return the null
    pointer:


    2. They can also be overloaded, which sometimes makes them superior to the C++
    cast operators.'
