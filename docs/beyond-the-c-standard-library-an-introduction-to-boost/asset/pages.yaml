- img_proc: true
  md: 'When designing frameworks, it isn’t possible to know in advance about the types
    that will be used together with the framework classes. A common approach is to
    require the clients of the framework to adapt a certain interface, or inherit
    from base classes provided by the framework. This is reasonable, because the framework
    properly needs to communicate with various higher-level classes in order to be
    useful. There are, however, situations where the framework stores or otherwise
    accepts types that it doesn’t need to (or can) know anything about. Rather than
    violating the type system and go with the void* approach, the framework can use
    any.


    # How Does Any Fit with the Standard Library?


    One important property of Any is that it provides the capability to store objects
    of heterogeneous types in Standard Library containers. It is also a sort of variant
    data type, which is something sorely needed, and currently missing, in the C++
    Standard Library.


    # Any


    Header: "boost/any.hpp"


    The class any allows typesafe storage and retrieval of arbitrary types. Unlike
    indiscriminate types, any preserves the type, and actually does not let you near
    the stored value without knowing the correct type. Of course, there are means
    for querying for the type, and testing alternatives for the contained value, but
    in the end, the caller must know the exact type of the value in an any object,
    or any denies access. Think of any as a locked safe. Without the proper key, you
    cannot get in. any requires the following of the types it stores:


    +   - CopyConstructible—It must be possible to copy the type.

    - Non-throwing destructor—As all destructors must be!


    +   - Assignable—For the strong exception guarantee (types that aren’t assignable
    can still be used with any, but without the strong guarantee).'
