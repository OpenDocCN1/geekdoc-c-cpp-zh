  md: '# # Library 4

    Operators


    # ## How Does the Operators Library Improve Your Programs?


    +   * Provides a complete set of comparison operators

    * Provides a complete set of arithmetic operators

    * Provides a complete set of operators for iterators


    Among the operators defined in C+, there are a number of related sets. When you
    encounter a class with one of these sets, you will typically expect to find the
    others. For instance, when a class provides `operator==`, you expect to find `operator!=`
    and probably `operator<=`, `operator>=`. Sometimes, a class only provides `operator<`
    in order to define an ordering so objects of associative containers, but that
    often leaves classes wanting more. Likewise, with value semantics that provides
    `operator+` but not `operator+=` or `operator=` is limiting its potential uses.
    When you define one operator from a set for your class, you would typically provide
    the remaining operators from that set to avoid surprises. Unfortunately, it is
    cumbersome and error prone to augment a class with the many operators needed to
    support comparisons or arithmetic, and iterator classes must provide certain sets
    of operators according to the iterator category they model to function correctly.


    Besides the tedious of defining the number of operators needed, these semantics
    must be correct to meet users’ expectations. Otherwise, the class is, for all
    practical purposes, unusable. We can relieve ourselves from doing it by all hand,
    though. As you know, some of the operators are typically implemented in terms'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'of others, such as implementing operator+ in terms of operator+=, and that
    suggests that some automation of this task is possible. In fact, that is the purpose
    of Boost.Operators. By allowing you to define only a subset of the required comparison
    or arithmetic operators, and then defining the rest for you upon those you provide,
    Boost.Operators enforces the correct operator semantics, and reduces your chance
    of making mistakes.


    An additional value of the Operators library is the explicit naming of concepts
    that apply for different operations, such as addable for classes supporting shiftable
    for classes operator<< and operator>>, and so on. This is important for two reasons:
    A consistent naming scheme allows understanding; and these concepts, and the classes
    named after them, can be part of class interfaces, clearly documenting important
    behaviors.


    # How Does Operators Fit with the Standard Library?


    When using the Standard Library containers and algorithms, one typically supplies
    some least relational operators (most commonly operator<) to enable sorting, and
    thus storage of the type in sorted, associative containers. A common practice
    is to define only the bare minimum of the required operators, which has the unfortunate
    side effect of making the class less complete and harder to understand. On the
    other hand, when defining a full set of operators, there is a risk of introducing
    defective semantics. In these cases, the Operators library helps to make sure
    that the classes behave correctly, and adhere to the requirements of both the
    Standard Library and the users of the type. Finally, for types that define arithmetic
    operators, there are a number of operators that are well suited to be implemented
    in terms of other operators, and Boost.Operators is of great use here, too.


