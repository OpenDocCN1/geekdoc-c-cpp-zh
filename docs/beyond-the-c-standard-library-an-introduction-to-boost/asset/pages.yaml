    # The Things That Remain


    We haven''t yet spoken about the remaining part of the Operators library, the
    iterator helpers. I won''t show example code for those, because you''ll mainly
    want to use them when defining iterator types, and that needs additional explanation
    that does not fit in this chapter or in this book. However, I mention them here
    if you are defining iterator types without the help of Boost.Iterators your dereference
    operators define the correct operators regardless of whether you are using a proxy
    class. They are also useful when defining smart pointers, which typically also
    require defining operator-> and operator*. The helpers group concepts that are
    required for the different types of iterators. For example, a random access iterator
    needs to be bidirectional_iterable, totally_ordered, additive, and indexable.
    When defining new iterator types, which should preferably be done with the help
    of Boost.Iterator library, the Operators library can help.


    # Operators Summary


    Providing the correct set of relational and arithmetic operators for user-defined
    classes is vital and provides significant challenges to get right. With the use
    of the Operators library, this task is greatly simplified, correctness and symmetry
    come almost for free. In addition to the help that the library offers in defining
    the full sets of operators, the naming and definitions of the classes that a class
    can support is explicit in the definition of the class (and by the Operators library!).
    In this chapter, we have seen several examples of how using this library improves
    programming with operators by simplification and ensured correctness. It is a
    fact that providing important relational and arithmetic operators for user-defined
    types is often overlooked, and part of the reason is that there is so much work
    involved to get it right. This is no longer the case, and Boost.Operators is the
    reason why.'
