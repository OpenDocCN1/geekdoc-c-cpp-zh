    # Using Boost.Lambda with Boost.Function


    Just as Boost.Function is compatible with the function objects that are created
    by Boost.Bind, it also supports Boost.Lambda, which also creates function objects.
    Any function object you create with the Lambda library is compatible with the
    corresponding boost::function. We have covered some ground on binding in the previous
    section, and the main difference is that it is possible to do more with Boost.Lambda.
    We can create these small, unnamed functions at ease, and store them in instances
    of boost::function for subsequent invocation. We have covered Lambda expressions
    in the previous chapter—any of the examples that were provided there function
    objects that could be stored in an instance of function. The combination of function
    and libraries that create function objects is extremely powerful.


    # Thinking About the Cost


    There''s no such thing as a free lunch, as the saying, and this certainly applies
    to Boost.Function, too. There are some disadvantages of using Boost.Function compared
    to using function pointers, most notably the increase in size. Boost.Function
    obviously occupies the space of one function pointer (duh!), whereas an instance
    of boost::function is three times as large. This can be an issue when there is
    a very large number of callbacks. Function pointers are also slightly more efficient
    when invoked, because where a function pointer is invoked directly, Boost.Function
    may require two calls through function pointers. Finally, there may be cases where
    the backward compatibility with C libraries makes function pointers the only choice.


    Although these are potential disadvantages of Boost.Function, it is not often
    that these are real-world issues. The extra size is still very small, and the
    overhead of the (potential) extra call through a function pointer usually comes
    at a very small cost compared to the time it takes to actually perform the computations
    of the target function. It should be the rare situation that mandates using function
    instead of Boost.Function. The great advantages and the flexibility that is gained
    through using the library easily outweigh these costs.


