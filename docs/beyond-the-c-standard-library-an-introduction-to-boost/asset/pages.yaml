  md: 'checked_delete is basically a static assertion that the class type is complete,

    which is accomplished like so:


    ```

    template< typename T > inline void checked_delete(T * x) {

    typef char type_must_be_complete[sizeof(T)];

    delete x;

    }

    ```


    The idea is to create an array of char, with the number of array elements equal
    to the size of T. If checked_delete is instantiated with a type T that is incomplete,
    the compilation fails, because sizeof(T) returns 0, and it''s illegal to create
    an (automatic) array with 0 elements. You could also have BOOST_STATIC_ASSERT
    for asserting this.


    ```

    BOOST_STATIC_ASSERT(sizeof(T));

    ```


    This utility is handy when writing templates that ensure that they are instantiated
    only with complex types. There is also a corresponding "checked deleter" for arrays,
    called checked_array_delete, which works just like checked_delete.


    ```

    to_be_deleted* p=new to_be_deleted[10];

    boost::checked_array_delete(p);

    ```


    # Summary


    When a dynamically allocated object is deleted, it is imperative that its destructor
    is called. If the type is incomplete—that is, it has been declared but not defined—the
    destructor will probably never be called. This is a potentially disastrous situation,
    so avoiding it is paramount. For templates and functions, the risk is greater
    than for other types, there''s no telling in advance which types will be used
    with. When using checked_delete and checked_array_delete, the problem of deleting
    incomplete types is removed. There is no runtime overhead compared to a direct
    call to delete, so the extra safety brought forth by checked_delete comes virtually
    without a price.


    Use checked_delete when you need to ensure that types are complete calling delete.'
