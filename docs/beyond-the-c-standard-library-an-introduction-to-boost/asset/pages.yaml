  md: '# Function


    The argument list is supplied inside the parentheses, separated by commas, just
    like a function declaration. Thus, declaring a function that returns nothing (void)
    and accepts two arguments, of type int and double, looks like this:


    ```

    boost::function<void (int,double)> f;

    ```


    # Declarations Using the Compatible Syntax


    The second way of declaring functions is to supply separate template type arguments
    for the return type and the argument types for the function call. Also, there''s
    a suffix for the name of the function class, which is an integer that corresponds
    to the number of arguments the function will accept. For example, the declaration
    of a function that returns bool and accepts an argument of type int looks like
    this:


    ```

    boost::function1<bool,int> f;

    ```


    The numbering is based on the number of arguments that the function accepts—in
    the previous example, there is one argument (int) and therefore function1 needed.
    More arguments means supplying more template parameters to the template and changing
    the numeric suffix. A function that returns void and accepts two arguments of
    type int and double looks like this:


    ```

    boost::function2<int,double> f;

    ```


    The library actually consists of a family of classes, each taking a different
    number of arguments. There is no need to take this into account when including
    the header "function.hpp", but if including the numbered versions, you must include
    the correct numbered header.


    The preferred syntax is easier to read and analogous to declaring a function,
    so you should use it if you can. Unfortunately, the preferred syntax is perfectly
    legal C++ and easier to read, not all compilers support it yet. If your compiler
    is among those that cannot handle the preferred syntax, you need to use the alternative
    form. If you need to write your code with maximum portability, you might also
    choose to use the alternative form. Let''s take a look at the most important parts
    of a function’s interface.'
