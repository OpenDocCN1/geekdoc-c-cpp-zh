    the pointer and then cast it, but we couldn''t store it in another shared_ptr;
    the new shared_ptr would think it was the first to manage the resource the pointer
    refers to. This is remedied by static_pointer_cast. Using this function ensures
    that the reference count for the pointee remains correct.

