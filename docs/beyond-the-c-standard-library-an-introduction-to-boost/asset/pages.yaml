  md: '# Library 12: Signals


    The Combiner parameter denotes a function object responsible for iterating through
    and calling all of the connected slots for the signal. It also determines how
    to combine the results of invoking the handlers. The default type, last_value,
    simply returns the result of invoking the last slot.


    The Groups parameter is the type to be used for grouping the slots that are connected
    to the signal. By connecting to different slot groups, it''s possible to predict
    the order of slot invocation, and disconnect groups of slots simultaneously.


    The GroupCompare parameter decides how the Groups are ordered, and the default
    is std::<Group>, which is almost always correct. If a custom type is used for
    Groups, some other ordering sometimes makes sense.


    Finally, the SlotFunction parameter denotes the type of slot functions, and the
    default is boost::function. I am not familiar with any scenarios where changing
    this default would be wise. This template parameter is used to define the slot
    type, available through the public typedef slot<SlotFunction> slot_type.


    # Members


    ```

    signal(const Combiner&=Combiner(),

    const GroupCompare&=GroupCompare());

    ```


    When constructing a signal, it''s possible to pass a Combiner, which is an object
    responsible for invoking the slots and handling the logic for the values returned
    when signaling to the slots.


    ```

    ~signal();

    ```


    The destructor disconnects all of the slots that are connected at the time of
    destruction.


    ```

    signals::connection connect(const slot_type& s);

    ```


    The connect function connects the slot to the signal. A function pointer, function
    object, a bind expression, can be used as slots. connect returns a signals::connection,
    which is a handle to the created connection. Using handle, the slot can be disconnected
    from the signal, or you can test whether the slot is still connected.'
