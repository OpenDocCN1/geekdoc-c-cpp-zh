  md: '# # Bibliography


    +   [1] Advanced C++ Programming Styles and Idioms (James O. Coplien)

    This book has been around for some time, but it''s still immensely valuable. It
    teaches important C++ idioms from the ground up, in a way that is to capture the
    reader''s interest and stimulate further research. Professor Coplien invites you
    to a journey that might just last a lifetime.


    +   [2] C++ FAQs 2nd Edition (Marshall Cline/Greg Lonow/Mike Girou)

    This great book includes short (a page or so) questions and answers that are often
    asked by C++ programmers. Topics vary wildly, from private inheritance to the
    intricacies of how to correctly use `typename` is seldom a good idea of how. If
    you''ve got a technical C++ question, chances are that the answer exists in this
    book.


    +   [3] Template Metaprogramming: Concepts, Tools, and Techniques from Boost and
    Beyond (David Abrahams/Alexey Gurtovoy)

    This is your definitive guide to template metaprogramming. C++ gurus David Abrahams
    and Alexei Gurtovoy (who are also the authors of Boost.Mpl) teach readers template
    metaprogramming in general, and applied template metaprogramming using the fabulous
    Boost.Mpl library. Mpl is similar to the STL, but for compile time programming!
    You cannot afford to miss this fantastic book on a topic that''s so hot you might
    burn your fingers.'
  merge: -1
