  md: "# Usage 369\n\nIf you aren’t yet familiar with lambda expressions in C++ (or\
    \ otherwise), don’t worry if the preceding seems a bit confusing—you may want\
    \ to read the chapters on Bind and Lambda first and return to these examples.\
    \ If you already have, I am sure that you appreciate the code that results from\
    \ using lambda expressions; and it avoids cluttering the code with small function\
    \ objects, too.\n\nNow let’s take a look at using to create slots. Slots must\
    \ implement function call operator, but not all classes that would otherwise be\
    \ suitable as slots do so. In those cases, it’s often possible to use existing\
    \ member functions of classes, repackaged for slots using binders. Binders can\
    \ also help readability by allowing the function (rather than function object)\
    \ that handles an event to have a meaningful name. Finally, there are situations\
    \ in which the same object must respond to different events, each with the same\
    \ slot signature, but different reactions. Thus, such objects need different member\
    \ functions to be called for different events. In each of these cases, there is\
    \ no function call operator for connecting to a signal. Thus, a configurable function\
    \ object is needed, and Boost.Bind provides (as the bind facility in Boost.Lambda)\
    \ the means to do.\n\nConsider a signal that expects a slot type that returns\
    \ bool and accepts an argument of double. Assuming a some_class with a member\
    \ function some_function that has the correct signature, how do you connect some_class::some_function\
    \ to the signal? One way would be to add a function call operator to some_class,\
    \ and have the function call operator forward the call to some_function. That\
    \ means changing the class interface unnecessarily and it doesn’t scale well.\
    \ A binder works much better.\n\n```\n#include <iostream>\n#include \"boost/signals.hpp\"\
    \n#include \"boost/bind.hpp\"\n\nclass some_class {\npublic:\n    bool some_function(double\
    \ d) {\n    return d>3.14;\n}\n\n    bool another_function(double d) {\n    return\
    \ d<0.0;\n}\n```"
  merge: -1
