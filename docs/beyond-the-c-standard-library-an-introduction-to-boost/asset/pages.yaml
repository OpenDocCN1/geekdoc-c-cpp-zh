  md: '# Operators


    synopses describe some of the most commonly used Operator classes, the concepts
    they represent, and the demands they place on classes derived from them. In some
    cases, the requirements for the actual concepts are not the same as the requirements
    for the base class when using Operators. For example, the concept addable requires
    that there be an operator T+(const T lhs, const T rhs) defined, but the Operators
    base class addable instead requires a member function, T operator+(const T other).
    Using this member, the base class addable augments the derived class with operator+.
    Throughout the synopses, the concepts are always stated first, followed by the
    type requirements for classes deriving from them. Rather than repeating all of
    the concepts in this library, I have selected a few important ones; you''ll find
    the full reference at www.boost.org, of course.


    # less_than_comparable


    The less_than_comparable concept requires the following semantics for a type T.


    ```

    bool operator<(const T&, const T&);

    bool operator>(const T&, const T&);

    bool operator<=(const T&, const T&);

    bool operator>=(const T&, const T&);

    ```


    When deriving from boost::less_than_comparable, the derived class (T) must provide
    the equivalent of


    ```

    bool operator<(const T&, const T&);

    ```


    Note that the return type need not be exactly bool, but it must be implicitly
    convertible to bool. For the concept LessThanComparable found in the C++ Standard,
    operator is required, so classes derived from less_than_comparable need to comply
    with that requirement. In return, less_than_comparable implements the three remaining
    operators in terms of operator<.


    # equality_comparable


    The equality_comparable concept requires the following semantics for a type T.


    ```

    bool operator==(const T&,const T&);

    bool operator!=(const T&, const T&);

    ```'
