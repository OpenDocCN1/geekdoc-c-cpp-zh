    # Signals with Arguments


    Often, there is additional data to be passed to a signal. For example, consider
    a temperature guard that reports drastic changes in the temperature. Just knowing
    that the guard detected a problem can be insufficient; a slot may need to know
    the current temperature. Although both the guard (the signal) and the slot could
    access the temperature from a common sensor, it may be simplest to have the guard
    pass the current temperature to the slot when invoking it. As another example,
    when slots are connected to various signals: The slots will most likely need to
    know which signal invoked it. There are myriad use cases requiring some information
    from signal to slot. The arguments that slots expect are part of a signal''s declaration.
    The first argument of the signal class template is the signature for invoking
    the signal, and this signature is also used for the connected slots when they
    calls them. If we want the argument to be modifiable, we make sure it is passed
    by non-const reference or pass a pointer, else we can pass it by value or reference
    to const. Note that besides the obvious difference that the original argument
    is either modifiable or not, this has implications for types of acceptable arguments
    to the signal itself and to the slot types—when the signal expects an argument
    by value or reference to const, types that are implicitly convertible to the argument''s
    type can be used to emit a signal. Likewise for slots—if the slot accepts its
    arguments by value or reference to const, this means that implicit conversion
    to that type from the actual argument type of the signal is allowed. We will see
    more of this soon, as we consider how to properly pass arguments when signaling.


    Consider an automatic parking lot guard, which receives notifications as soon
    as a car enters or leaves the parking lot. It needs to know something about the
    car—for example, the car registration—to track the coming and going of each. (That
