    # Usage


    A scoped_ptr is used like an ordinary pointer with a few important differences;
    the most important are that you don''t have to invoke delete on the pointer and
    that copying is disallowed. The typical operators for pointer operations (operator*
    and operator--) are overloaded to provide the syntactic access as for a raw pointer.
    Using scoped_ptrs is just as fast as using raw pointers, and there''s no size
    overhead, so use them extensively. To use boost::scoped_ptr, include the header
    "boost/scoped_ptr.hpp". When declaring a scoped_ptr, the type of the pointeee
    is the parameter to the class template. For example, here''s a scoped_ptr that
    wraps a pointer to std::string:


    ```

    boost::scoped_ptr<std::string> p(new std::string("Hello"));

