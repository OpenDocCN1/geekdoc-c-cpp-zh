  md: '# # Library 7

    Variant


    # ## How Does the Variant Library Improve Your Programs?


    +   - Typesafe storage and retrieval of a user-specified set of types

    - A means to store heterogeneous types in Standard Library containers

    - Compile-time checked visitation of variants

    - Efficient, stack-based storage for variants


    The Variant library focuses on typesafe storage and retrieval of a bounded set
    of types—that is, on discriminated unions. The Boost.Variant library has many
    features in common with Boost.Any, but there are different tradeoffs as well as
    differences in functionality. The need for discriminated unions (variant types)
    is very common in everyday programming. One typical solution while retaining type
    safety is to use abstract classes, but that''s not always possible; even when
    it is, the cost of heap allocation and virtual functions may be too high. One
    might also try using indiscriminate types such as void* (which leads to disaster),
    or typesafe but unbounded variant types, such as Boost.Any. The library we look
    at here—Boost.Variant—supports bounded variant types—that is, variants where the
    elements come from a set of supported types.'
