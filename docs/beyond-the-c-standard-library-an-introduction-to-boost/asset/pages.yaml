  md: '# Boost.Lambda


    Lambda provides lambda expressions—unnamed functions—for C++. Especially useful
    when using the Standard Library algorithms, Lambda allows functions to be created
    at the call site, which avoids the creation of many small function objects. Using
    lambdas means writing less code, and writing it in the location where it''s used,
    which is much clearer and maintainable than scattering function objects around
    the code base. “Library 10: Lambda” covers this library in detail.


    The authors of Lambda are Jaakko Järvi and Gary Powell.


    # Boost.Ref


    Many function templates, including a large number from the Standard C++ Library,
    take their arguments by value, which is sometimes problematic. It may be expensive
    or impossible to copy an object, or the state may be tied to a particular instance,
    so copying is unwanted. In these situations, one needs a way to pass by reference
    rather than value. Ref wraps a reference to an object and turns it into an object
    that may be copied. This permits calling functions taking their arguments by value
    with a reference. Ref has been accepted for the upcoming Library Technical Report.


    The authors of Ref are Jaakko Järvi, Peter Dimov, Douglas Gregor, and David Abhams.


