    cannot anticipate every situation that our implementations will face. That''s
    a strong reason to comply with the requirements of the Standard Library facilities,
    preferably in more than just the use cases that we are currently aware of. Nevertheless,
    I do have an example for you: The task is to remove all elements from a container
    vec that do not contain strings Of course, writing another predicate that does
    the exact opposite of contains is one, but that''s an alternative that can quickly
    lead to maintenance nightmares, because of proliferation of function objects with
    similar work descriptions. The Standard Library provides us with an adapter called
    notl, which negates the result of an invocation of a function and makes it trivial
    to clean out all elements from your vector vec.


    ```

    vec.erase(remove_if(vec.begin(),vec.end(),

    std::not(contains<std::string>())),vec.end());


    std::cout << "Now, there are only " << vec.size()\n << " elements in vec!\n";

    ```


    The examples in this section have demonstrated how to make effective use of any.
    Because the type of the stored value is not part of any''s type, any is an essential
    tool when providing storage without imposing requirements on the stored types,
    including inheriting from a base class. We have seen that there is a price for
    this type hiding. any disallows access to the stored value without knowledge of
    the value''s type, restricting opportunities to operate on the stored values.
    To a large extent, this can be amended by creating helper classes—predicates and
    function objects—that provide the necessary logic to access the values.


    # Any Summary


    Discriminated types can contain values of different types and are quite different
    from indiscriminate (read void*) types. We always depend heavily on type safety
    in C++, and there are few situations in which we are willing to do without it.'
