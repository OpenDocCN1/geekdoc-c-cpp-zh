- img_proc: true
  md: 'Variant types are available in many other programming languages, and they have
    proven their worth time and again. There is limited built-in support in C++ for
    variant types, only in the form of unions, that exist mainly for compatibility.
    Boost Variant remedies the situation through a class template variant, and accompanying
    tools for safely storing and retrieving values. A variant data exposes an interface
    independent of the current value''s type. If you''ve used some proprietary variant
    types, you may have been exposed to types that only support a fixed set of types.
    That is not the case with this library; you define the set of types that are allowed
    in a variant when you use it, and a program can contain any number of disparate
    variantantiations. To retrieve the value that is held in a variant, you either
    need to know the exact type of the current value, or use the provided types visitor
    mechanism. The visitor mechanism makes Variant quite different from most variant
    libraries, including Boost.Any (which on the other hand can hold a value of any
    conceptual type), and thereby enables a safe and robust environment for handling
    such types. C++ unions are only useful for built-in types and POD types, but this
    library offers discriminated union support for all types. Finally, efficiency
    aspects are covered, too, as the library stores its values in stack-based storage,
    thus avoiding more expensive heap allocations.


    # How Does Variant Fit with the Standard Library?


    Boost.Variant permits storing heterogeneous types in the Standard Library containers.
    As there is no real support for variant types in C++, or in the C++ Standard Library,
    this makes Variant an excellent and useful extension to the Standard Library.


    # Variant


    Header: "boost/variant.hpp"


    This contains all of the Variant library through a single header file.


    "boost/variant/variant_fwd.hpp"


    contains forward declarations of the variant class templates.'
