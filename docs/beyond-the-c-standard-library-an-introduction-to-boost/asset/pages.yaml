  md: "# Complying with the Requirements of Standard Library Adapters\n\nIf you found\
    \ the predicate contains useful, you may have noticed that it is not quite all\
    \ it can be. There is no way to use it together with the Standard Library adapters.\
    \ The following example is slightly outside the scope of this chapter, but because\
    \ any fits so well with the container classes, it would be a shame to leave a\
    \ somewhat flawed predicate of contains as is. The problem is that the Standard\
    \ Library adapters (bind1, bind2, not, not2) impose requirements on the predicates\
    \ they adapt. The type of the argument and the result type must be exposed through\
    \ typedefs, and that means that we need a function object rather than a function.\n\
    \nFirst comes the definition of our new function object, contains_t. It could\
    \ have inherited from the helper class std::unary_function (part of the C++ Standard\
    \ Library, and result types defined automatically, but to make things clear, the\
    \ required typedefs are explicitly provided). The argument type has changed from\
    \ const boost::any to boost::any, to avoid a potential reference-to-reference,\
    \ which is illegal. The implementation is just as before, only here it is placed\
    \ in the function call operator.\n\n```\ntemplate<typename T> struct contains_t\
    \ {\ntypedef boost::any argument_type;\nttypedef bool result_type;\nbool operator()(boost::any\
    \ a) const {\n  return typeid(T)==a.type();\n}\n}\n```\n\nTo save the name contains\
    \ for subsequent use in the helper function that's soon to come, the name of the\
    \ function object is contains_t. Here is a helper function that creates and returns\
    \ an instance of contains_t with the appropriate type set automatically. The reason\
    \ is that we want to overload contains so that we are still able to provide the\
    \ original predicate that we created.\n\n```\ntemplate<typename T> contains_t<T>\
    \ const() {\n  return contains_t<T>();\n}\n```\n\nFinally, the good old predicate\
    \ is changed to take advantage of the contains_t implementation. Now, if we need\
    \ to change the implementation of contains_t for some reason, contains will reflect\
    \ those changes without any further effort."
