    # ## How Does the Utility Library Improve Your Programs?


    +   - Compile time assertions with `BOOST_STATIC_ASSERT`

    - Safe destruction with `checked_delete` and `checked_array_delete`

    - Prohibition of copying with `noncopyable`

    - Retrieval of object addresses when `operator&` is overloaded through `addressof`

    - Controlled participation of overloads and specializations with `enable_if` and
    `disable_if`


    There are some utilities that just don''t constitute a library in their own right,
    and are therefore grouped together with other entities. This is what Boost.Utility
    is, a collection of useful tools with no better home. They are useful enough to
    warrant inclusion in Boost, yet they are too small to deserve their own library.
    This chapter covers some of Boost.Utility''s most fundamental and widely applicable
    tools.


