    # lexical_cast


    Header: "boost/lexical_cast.hpp"


    Lexical conversions are performed in virtually all applications. We convert strings
    to numeric values and vice versa. Many user-defined types can be converted to
    strings or created from strings. It is all too common to write the code for these
    conversions each time you need it, which suggests that it is very much suited
    for a reusable implementation. That''s lexical_cast''s purpose. Think of lexical_cast
    using a std::stringstream as an interpreter between the string and other representation
    of a value. That means that it will work for any source with an appropriate output
    operator<< and any target with an appropriate operator<<. That''s true for all
    of the built-in types and many user-defined types (UDTs).


    # Usage


    lexical_cast makes a conversion between types look like any other type-converting
    cast. Of course, there must be a conversion function somewhere to make it work,
    but conceptually, it can be thought of as a cast. Rather than calling one of a
    number of conversion routines, or even coding the conversion locally, lexical_cast
    does that job for any types that meet its requirements. The source type must be
    OutputStreamable and the destination type must be InputStreamable. In addition,
    both types need to be CopyConstructible, and the target also DefaultConstructible
    and Assignable. OutputStreamable means that there''s operator<< defined for the
    type, and Inputable mandates operator>>. This is true for many types, including
    the built-in types and the string classes from the Standard Library. To use lexical_cast,
    include "boost/lexical_cast.hpp".


    # Putting lexical_cast to Work


    I won''t bore you by producing conversion code manually to show how much code
    I''m sure you''ve written these conversions yourself, and quite probably do so
    more than once. Instead, the example just uses lexical_cast for a number of common
    (lexical) type conversions.'
