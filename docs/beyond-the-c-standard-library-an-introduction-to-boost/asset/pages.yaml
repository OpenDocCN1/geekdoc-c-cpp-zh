  md: '# Library 10: Lambda


    This problem isn''t new; it;s virtually the same that applies for function objects
    used by the Standard Library algorithms. There, the solution is to add typedefs
    that state the return type and argument type(s) of the function objects. The Standard
    Library even helper classes for accomplishing this, through the class templates
    unary_function and binary_function—our example class add_prev could become a compliant
    object by defining the required typedefs (argument_type and result_type for unary
    function objects, first_argument_type, second_argument_type, and result_type for
    binary function objects), or inheriting from unary_function/binary_function.


    template <typename T> class add_prev : public std::unary_function<T,T>

    is this enough for lambda expressions, too? Can we simply reuse this scheme, and
    with our existing function objects, too? Alas, the answer is no. There is a problem
    with this typedef approach: What happens when the return type or the argument
    type(s) is dependent on a template parameter to a parameterized function call
    operator? Or, when there are overloaded function call operators? Had been language
    support for template typedef, much of the problem would be solved, currently,
    that''s not the case. That''s Boost requires a different approach, through a nested
    parameterized class sig. To enable the return type deduction to work with add_prev,
    we must define a new type sig like this:


    ```

    template <typename T> class add_prev :

    public std::unary_function<T,T>{

    T prev_;

    public:

    template <typename Args> class sig {

    public:

    tntypef T type;

    };

    // Rest of definition

    ```


    The template parameter Args is actually a tuple containing the function object
    (first element) and the types of the arguments to the function call operator.
    In our case, we have no need for this information, as the return type and the
    argument type are always T. Using this improved version of add_prev, there''s
    no need to short-circuit the return type deduction in a lambda expression, so
    our original version of the code now compiles cleanly.


    ```

    std::transform(vec.begin(),vec.end(),vec.begin(),bind(var(ap),_1));

    ```'
