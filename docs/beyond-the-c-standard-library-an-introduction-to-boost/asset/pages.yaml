  md: "# Usage\n\nBoost.Bind offers a consistent syntax for both functions and function\
    \ objects, and even for value semantics and pointer semantics. We'll start with\
    \ some simple examples to get grips with the usage of vanilla bindings, and then\
    \ move on to functional composition through nested bindings. One of the keys to\
    \ how to use bind is the concept of placeholders. Placeholders denote the arguments\
    \ that are to be supplied to the resulting function object, and Boost.Bind supports\
    \ up to such arguments. The placeholders are called _1, _2, _3, _4, and so on\
    \ to _9, and you use them in the places where you would ordinarily add the argument.\
    \ For a first example, we shall define a function, nine_arguments, which is then\
    \ called using bind expression.\n\n```\n#include <iostream>\n#include \"boost/bind.hpp\"\
    \n\nvoid nine_arguments(\n    int i1, int i2, int i3, int i4,\n    int i5, int\
    \ i6, int i7, int i8, int i9) {\n    std::cout << i1 << i2 << i3 << i4 << i5\n\
    \    << i6 << i7 << i8 << i9 << '\\\\n');\n}\n\nint main() {\n    int i1=1,i2=2,i3=3,i4=4,i5=5,i6=6,i7=7,i8=8,i9=9;\n\
    \    (boost::bind(&nine_arguments, _9,_2,_1,_6,_3,_8,_4,_5,_7));\n    (i1,i2,i3,i4,i5,i6,i7,i8,i19);\n\
    }\n```\n\nIn this example, you create an unnamed temporary binder and immediately\
    \ invoke it by passing arguments to its function call operator. As you can see,\
    \ the order of the placeholders is scrambled—this illustrates the reordering of\
    \ arguments. Note also that placeholders can be used more than once in an expression.\
    \ The output of this program is as follows.\n\n```\n921638457\n```\n\nThis shows\
    \ that the placeholders correspond to the argument with the placeholder's number—that\
    \ is, _1 is substituted with the first argument, _2 with the second argument,\
    \ and so on. Next, you will see how to call member functions of a class."
