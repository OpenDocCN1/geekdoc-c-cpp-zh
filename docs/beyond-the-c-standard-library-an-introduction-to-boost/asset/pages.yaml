    # Header: "boost/function.hpp"


    The header "function.hpp" includes prototypes for functions with 0 to 10 arguments.
    (This is implementation defined, 10 is the default limit for the current implementation.)^1
    It is also possible to include only the header that corresponds to the number
    of arguments you need to use—the files are named "function/functionN.hpp", where
    N is in the range 0 to 10. There are two different interfaces for Boost.Function,
    one that is most appealing because it is syntactically close to a function declaration
    (and doesn''t require the signature to include the number of arguments), and the
    other is appealing because it works with more compilers. Which to choose depends,
    least in part, on the compiler that you are using. If you can, use what we refer
    to as the preferred syntax. Throughout this chapter, both forms will be used.


