  md: "# scoped_ptr and the Pimpl Idiom\n\nscoped_ptr is ideal to use in many situations\
    \ where one has previously used raw pointers or auto_ptrs, such as when implementing\
    \ the pimpl idiom. The idea behind the pimpl idiom is to insulate clients from\
    \ all knowledge about the private parts of a class. Because clients depend on\
    \ the header file of a class, any changes to the header will affect clients, even\
    \ if they are made to the private or protected sections. The pimpl idiom hides\
    \ these details by putting data and functions in a separate type defined in the\
    \ implementation file and then declaring the type in the header file and storing\
    \ a pointer to it. The constructor of the class allocates the pimpl type, and\
    \ the destructor deallocates it. This removes the implementation dependencies\
    \ from the header file. Let's construct a class that implements the pimpl idiom\
    \ and then apply smart pointers to make it safer.\n\n```\n// pimpl_sample.hpp\n\
    \n#if !defined (PIMPL_SAMPLE)\n#define PIMPL_SAMPLE\n\nstruct impl;\n\nclass pimpl_sample\
    \ {\n    impl* pimpl;\npublic:\n    pimpl_sample();\n    -pimpl_sample();\n  \
    \  void do_something();\n};\n\n#endif\n```\n\nThat's the interface for the class\
    \ pimpl_sample. The struct impl is declared, and it holds all private members\
    \ and functions in the implementation file. The effect is that clients are fully\
    \ insulated from the internal details of the pimpl_sample class.\n\n> 4. This\
    \ is also known as the Cheshire Cat idiom. See www.gotw.ca/gotw/024.htm and Exceptional\
    \ C++ for more on the pimpl idiom."
