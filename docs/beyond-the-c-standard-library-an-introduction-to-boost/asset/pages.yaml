  md: '# A Common User Misunderstanding


    One of the most common questions that I see related to Boost.Regex is related
    to the semantics of regex_match. It''s easy to forget that all of the input to
    regex_match must match the regular expression. Thus, users often think that code
    like the following would yield true.


    ```

    boost::regex reg("\\d*");

    bool b=boost::regex_match("17 is prime",reg)

    ```


    Rest assured that this call never results in a successful match. All of the input
    must be consumed for regex_match to return true! Almost all of the users ask why
    this doesn''t work use regex_search rather than regex_match.


    ```

    boost::regex reg("\\d*");

    bool b=boost::regex_search("17 is prime",reg)

    ```


    This definitely yields true. It is worth noting that it''s possible to make regex_search
    behave like regex_match, using special buffer operators. \A matches the start
    of a buffer, and \Z matches the end of a buffer, so if you put \A first in your
    regular expression, and \Z last, you''ll make regex_search behave exactly like
    regex_match—that is, it must consume all input for a successful match. The following
    regular expression always requires that the input be exhausted, regardless of
    whether you are using regex_match or regex_search.


    ```

    boost::regex reg("\\A\\d*\\Z");

    ```


    Please understand that this does not imply that regex_match should not be used;
    on the contrary, it should be a clear indication that the semantics we just talked
    about—all of the input must be consumed—are in effect.


    # About Repeats and Greed


    Another common source of confusion is the greediness of repeats. Some of the repeats—for
    example, + and *are greedy. This means that they will consume as much of the input
    as they possibly can. It''s not uncommon to see regular expressions as shown with
    the following, with the intent of capturing a digit after a greedy repeat.


    ```

    boost::regex reg(".*) (\\d{2})");

    ```'
