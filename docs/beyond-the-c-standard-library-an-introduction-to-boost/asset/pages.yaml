  md: '# # Part I

    # General Libraries


    It is not obvious what a suitable name for this part of the book should be. With
    a structure of the book that encompasses distinct domains (such as containers
    and higher-order programming), names are often palpable; except for what''s covered
    in this part—those little things that we use all of the time: smart pointers,
    utilities, and so on.


    You can''t really begin with a division called *Miscellaneous*, or *Ubiquitous*,
    or *Frequently Used Libraries*. It''s true—they are all of these things, but it
    just doesn''t convey their importance properly. Ergo, *General Libraries*, which
    I''m also hoping will focus on their omnipresence.


    One thing that makes me odd is the way that we often regard "simple" components—utilities,
    if you like—that are of so much use to us. They get a lot of attention in books
    and articles, but it is surprisingly common to underestimate their value when
    it comes to selecting them (or creating them) for production code. It is because
    we consider small components uncomplicated? Do we willingly sacrifice flexibility
    on the basis that it''s easy to create another small component just like it, manually
    adapted to the exact problem at hand? If are indeed the arguments, we are thoroughly
    deceiving ourselves. Two million instances of smart pointers in a program make
    the smart pointers critical, but in terms of efficiency and reliability. Twenty
    different implementations of common conversions in a program affects the time
    it takes to code them, but more importantly also impedes maintainability. Systems
    are built on layers of abstraction, and the lower levels are often referred to
    as being comprised of data structures, algorithms, and utilities. If you agree
    with that, consider the impact of a change,'
