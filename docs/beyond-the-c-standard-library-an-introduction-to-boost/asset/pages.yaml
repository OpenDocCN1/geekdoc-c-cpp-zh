  md: '# A Boost.Bind and Boost.Function Teaser


    Although the material that we have covered in this chapter shouldn''t leave you
    wanting for more, there is actually a very useful synergy between Boost.Bind and
    another library, Boost.Function, that provides still more functionality. We shall
    see more of the added value in "Library 11: Function," but I''d like to give you
    a hint of what''s to come. As we''ve seen, there is no apparent way of storing
    our binders for later use—we only know that they are compatible objects with some
    (unknown) signature. But when using Boost.Function, storing functions for later
    invocation is exactly what the library does, and thanks to the compatibility with
    Boost.Bind, it''s possible to assign binders to functions, saving them for later
    invocation. This is an enormously useful concept, which enables adaptation and
    promotes loose coupling.


    # Bind Summary


    Use Bind when


    +   * You need to bind a call to a free function, and some or all of its arguments

    * You need to bind a call to a member function, and some or all of its arguments

    * You need to compose nested function objects


    The existence of a generalized binder is a tremendously useful tool when it comes
    to writing terse, coherent code. It reduces the number of small function objects
    created for adapting functions/function objects, and combinations of functions.
    Although the Standard Library already offers a small part of the functionality
    in Boost.Bind, there are significant improvements that make Boost.Bind the better
    choice in most places. In addition to the simplification of existing features,
    Bind also offers powerful composition features, which provide the programmer with
    great power without negative effects on maintenance. If you''ve taken the time
    to learn bindist, bind2nd, ptr_fun, mem_fun_ref, and so forth, you''ll have little
    or no trouble transitioning to Boost.Bind. For the current binder offerings from
    the C++ Standard Library, I strongly suggest that you start by using Bind, because
    it is both easier to learn and more powerful.'
