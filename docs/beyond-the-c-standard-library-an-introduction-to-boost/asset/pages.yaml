  md: '# Usage 129


    # Use Operators Only When Operators Should Be Used


    It may seem really obvious that operators should be used only when appropriate,
    but for some reason there is a “coolness factor” about operators that seems to
    tempt some people to add them when their semantics are unclear. There are many
    scenarios requiring operators, such as when there is a relation between instances
    of a type, or when creating an arithmetic type. But there are also less clear-cut
    cases, where one needs to consider the expectations of the class, and where perceived
    ambiguity might make a member function a better choice.


    Operators have been plied into unusual service over the years. Concatenating strings
    with addition operators and I/O with shift are two common examples where operators
    do not necessarily have a mathematical meaning, but have been used for other semantic
    purposes. Some have questioned the use of the subscript operator for accessing
    elements in a `std::map`. (Others, of course, think it’s perfectly natural. And
    they are.) Times, using operators for tasks other than their role with built-in
    types makes sense. Other times, it can go horribly wrong, causing confusion and
    ambiguities. When you choose to overload operators with meanings that deviate
    from those of built-in types, you do so carefully. You must ensure that the meaning
    is obvious and that the precedence is correct. That was the reason for choosing
    the shift operators for I/O in the IOstreams library. The operators clearly suggested
    moving one direction or the other and the precedence of the shift operators puts
    them lower than most others. If you create a class representing a char, some might
    find `operator=` convenient. However, what might that operator mean to clients
    using gasoline while driving. Others might think it was used to account for depreciation
    of the car’s value (an account, of). Adding that operator is wrongheaded because
    it doesn’t have a clear purpose, whereas a member function can name the operation
    providing clarity. Don’t add operators just because it makes for “cool” coding.
    Add them because they make sense, but be sure to add all the operators that apply,
    and be sure to use the Boost.Operators library!


