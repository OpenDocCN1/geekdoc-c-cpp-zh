  md: '# Members


    template <class Y> explicit shared_ptr(Y* p);


    This constructor takes ownership of the supplied pointer p. The argument p must
    be a valid pointer to Y. The reference count is set to 1 after construction. The
    only exception that may be thrown from the constructor is std::bad_alloc (which
    can only happen in the unlikely event that the reference counter cannot be allocated
    from the free store).


    template <class Y,class D> shared_ptr(Y* p,D d);


    This constructor takes two arguments. The first is the resource that the shared_ptr
    should take ownership of, and the second is an object that is responsible for
    releasing resource when the shared_ptr is destroyed. The stored resource is passed
    to the object as d(p). Thus, valid values of p depend on d. If the reference counter
    cannot be allocated, shared_ptr throws an exception of std stdbad_alloc.


    shared_ptr(const shared_ptr&const weak_ptr<Y>& r);


    The stored resource in r is shared by the constructed shared_ptr, and the reference
    count is increased by one. This copy constructor never throws.


    template <class Y> explicit shared_ptr(const weak_ptr<Y>& r);


    Constructs a shared_ptr from a weak_ptr (covered in this chapter). This enables
    thread-safe usage of weak_ptr, because the reference count of the resource pointed
    to by the weak_ptr argument is incremented (weak_ptrs do not affect the reference
    count of resources). If the weak_ptr is empty (r.use_count()==0), shared_ptr throws
    an exception of type bad_weak_ptr.


    template <typename Y> shared_ptr(std::auto_ptr<Y>& r);


    The construction from an auto_ptr takes ownership of the pointer stored in r by
    storing a copy of the pointer and calling release on the auto_ptr. The reference
    count after construction is 1. r is, of course, emptied. Throws std::bad_alloc
    if the reference counter cannot be allocated.'
