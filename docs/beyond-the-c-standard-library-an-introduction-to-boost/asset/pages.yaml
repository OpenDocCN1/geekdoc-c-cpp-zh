    # BOOST_STATIC_ASSERT


    Header: "boost/static_assert.hpp"


    Performing assertions at runtime is something that you probably do regularly,

    and for good reasons. It is an excellent way of testing preconditions, postcondi-

    tions, and invariants. There are many variations for performing runtime assert-

    ons, but how do you do at compile time? Of course, the only way to do

    is to have the compiler generate an error, and while it is quite trivial (I inve-

    dently do it many thousand times), and it''s not obvious how to get meaningful

    information into the error message. Furthermore, even if you find a way on one

    compiler, it''s a lot harder to do it portably. This is the rationale for BOOST_

    STATIC_ASSERT. It can be used at different scopes, as we will see.


    # Usage


    To using static assertions, include the header "boost/static_assert.hpp".

    This header defines the macro² BOOST_STATIC_ASSERT. For the first demonstra-

    t of its usage, we''ll see how it is used at class scope. Consider a parameter-

    ized class that requires the types with which it is instantiated are of integral

    t. We''d not provide specializations for all of those types, so what we

    need is to assert, at compile time, that whatever type our class is parame-

    terized is an integral type. Now, we''re going to get a bit ahead of

    selves by using another Boost library for testing the type—Boost.traits.

    We''ll use a predicate called is_integral, which performs a compile evalu-

    ation of its argument and as you might guess from its name, indicates whether

    that type is an integral type.


