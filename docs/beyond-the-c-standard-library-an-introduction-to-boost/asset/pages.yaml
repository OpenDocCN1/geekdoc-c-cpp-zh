  md: "# Note that if an any stores a pointer type, that is reflected in the returned\
    \ std::type_info.\n\n# Storing Pointers in any\n\nOften, the test for empty is\
    \ enough to know whether the object really contains something valid. However,\
    \ if an any might hold a pointer, be extra careful to test the pointer before\
    \ trying to dereference it. Simply testing whether the any is empty is not enough,\
    \ because any is not considered to be empty when it holds a pointer, even if that\
    \ pointer is null.\n\n```\nboost::any a(static_cast<std::string*>( (0));\n\nif\
    \ (a.empty()) {\n  try {\n    std::string* p=boost::any_cast<std::string*>(a);\n\
    \    if (p) {\n      std::cout << *p;\n    } else {\n      std::cout << \"The\
    \ any contained a null pointer!\\n\";\n    }\n  } catch (boost::bad_cast&) {}\n\
    }\n```\n\n# A Better Way—Using shared_ptr\n\nAnother complication when storing\
    \ raw pointers in any is the destruction semantics. The any class accepts ownership\
    \ of the value it stores, because it keeps an internal copy of the value, which\
    \ is destroyed with the any. However, destroying a raw pointer does not invoke\
    \ delete or delete[] on it! It reclaims the memory occupied by the pointer. This\
    \ making storing a raw pointer in any is problematic, so it is a good idea to\
    \ use smart pointers instead. Using smart pointers (see “Library 1: Smart_ptr”)\
    \ is an ideal way to store data in any. This solves the problem of making sure\
    \ that the memory associated with a contained pointer is properly deleted. When\
    \ the smart pointer is destroyed, it takes appropriate action to ensure the memory\
    \ and data in it are properly destroyed. By contrast, note that std::auto_ptr\
    \ is not appropriate."
