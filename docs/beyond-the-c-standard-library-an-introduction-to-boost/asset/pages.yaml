  md: '# Data Structures, Containers, Iterators, and Algorithms


    # Boost.Tokenizer


    This library offers ways of separating character sequences into tokens. Common
    parsing tasks include finding data in delimited text streams. It is beneficial
    to be able to treat such sequence as a container of elements, where the elements
    are delimited according to user-defined criteria. Parsing is a separate task from
    operating on the elements, and it is exactly this abstraction is offered by Tokenizer.
    The user determines how the character sequence is delimited, and the library finds
    the tokens as the user requests new elements.


    The author of Tokenizer is John Bandela.


    # Data Structures, Containers, Iterators, and Algorithms


    # Boost.Any


    The Any library supports typesafe storage and retrieval of values of any type.
    When the need for a variant type arises, there are three possible solutions:


    +   * Indiscriminate types, such as void*. This solution can almost never be made
    typesafe; avoid it the plague.


    +   * Variant types—that is, types that support the storage and retrieval of a
    set of types.


    +   * Types that support conversions, such as between string types and integral
    types.


    Any implements the second solution—a value-based variant type, with an unbounded
    set of possible types. The library is often used for storing heterogeneous types
    in Standard Library containers. Read more in “Library 6: Any."


    The author of Any is Kelvin Henney.


    # Boost.Array


    This library is a wrapper around ordinary C-style arrays, augmenting them with
    the functions and typedefs from the Standard Library containers. In effect, this
    makes it possible to treat ordinary arrays as Standard Library containers. This
    is useful because it adds safety without impeding efficiency and it enables uniform
    syntax for Standard Library containers and ordinary arrays. The latter means that'
