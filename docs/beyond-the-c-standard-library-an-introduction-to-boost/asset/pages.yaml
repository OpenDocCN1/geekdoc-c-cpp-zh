  md: '# Bibliography


    [19] The C++ Programming Language 3rd Edition (Bjarne Stroustrup)


    Written by the Creator himself, this book discusses most parts of the C++ language,
    and the C++ Standard Library. You owe it to yourself to own a copy.


    [20] The C++ Standard Library (Nicolai Josuttis)


    This is my favorite book on the STL. Although the book covers more parts of the
    C++ Standard Library than the STL, it''s the parts on containers, iterators, and
    algorithms that really make this book stand out from the rest. It keeps a steady
    pace and never leaves the reader behind.


    [21] Thinking in C++, Volume 2 (Bruce Eckel/Chuck Allison)


    This is an 800-page tome that tries to teach most of the features in C++, and
    more importantly, how to use them correctly. The book’s a magnificent achievement,
    because it actually works. Reading this book helps you to think in C++. Best of
    all, it''s available both online¹ and in print, so you can check it out before
    buying it (it''s much more comfortable to hold a book than a monitor when reading
    in bed).


    +   1. Check out http://www.mindview.net.'
