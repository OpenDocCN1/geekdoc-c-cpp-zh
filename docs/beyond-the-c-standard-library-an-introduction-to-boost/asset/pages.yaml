  md: "# Tying Tuple Elements to Variables\n\nA handy feature of the Boost.Tuple library\
    \ is “tying” tuples to variables. Tiers are tuples created by the overloaded function\
    \ template boost::tie, such that all of the elements are non-const reference types.\
    \ As a result, ties must be initialized with Ivalues, and thus tie's arguments\
    \ are non-const reference types, too. Because the resulting tuples have non-const\
    \ reference elements, assignment to the elements of such a tuple are assignments\
    \ through non-const references to the Ivalues with tie was called. This ties existing\
    \ variables to a tuple, hence the name!\n\nThe following example shows the obvious\
    \ way of getting values out of a returned tuple. Then, it shows the same operation\
    \ using a tied tuple to assign values directly to variables. To make the example\
    \ more interesting, we'll begin by defining a function that returns the greatest\
    \ common divisor and, of course, grouped together as a tuple return type. The\
    \ values are, of you'll notice that the functions for calculating the greatest\
    \ common divisor and least common multiple come from another Boost library—Boost.Math.\n\
    \n```\n#include <iostream>\n#include \"boost/tuple/tuple.hpp\"\n#include \"boost/math/common_factor.hpp\"\
    \n\nboost::tuple<int, int> gcd_lcm(int val1, int val2) {\n    return boost::make_tuple(\n\
    \        boost::math::gcd(val1,val2),\n        boost::math::lcm(val1,val2));\n\
    \    );\n}\n\nint main() {\n    // The \"old\" way\n    boost::tuple<int,int>\
    \ tuple=gcd_lcm(12,18);\n    int gcd=tuple.get<0>(tuple);\n    int lcm=tuple.get<1>(tuple);\n\
    \n    std::cout << \"Greatest common divisor: \" << gcd << '\\\\n';\n    std::cout\
    \ << \"Least common multiple: \" << lcm << '\\\\n';\n\n    // The \"new\" way\n\
    \    boost::tie(gcd,lcm)=gcd_lcm(15,20);\n\n\\0}\n```"
