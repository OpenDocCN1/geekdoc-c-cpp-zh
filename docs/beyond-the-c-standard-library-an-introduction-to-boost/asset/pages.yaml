    expressions at compile time. We''ll see what happens when `delete` an object through
    a pointer to an incomplete type—that is, when the layout of the object being destroyed
    is unknown. `checked_delete` makes that more interesting. We''ll also see how
    `noncopyable` prevents a class from ever being copied, which is arguably the most
    important topic of this chapter. Then, we''ll'
