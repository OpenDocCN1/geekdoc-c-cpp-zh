    to a whole new level of abstraction. There are areas in C++ that are sometimes
    considered to be shortcomings when employing certain designs, such as the seemingly
    unavoidable proliferation of small function objects when using Standard Library
    algorithms. One must never forget that in C++, it''s best not to be (too) judgmental
    of the language itself, for it was designed to handle its own shortcomings through
    libraries; and that''s exactly what the libraries Boost.Bind and Boost.Lambda—enabling
    as addressed here—the problem. Callback functions are another problematic area
    that is addressed here; the root of the problem is accentuated by using libraries
    for higher-order programming, because storing and invoking delayed function-like
    objects becomes an important feature. That''s what Boost.Function does, and of
    course, it plays nicely with the other two libraries mentioned here (and others).
    The final chapter discusses Boost.Signals, a library that reifies the Observer
    pattern. There is fantastic power in these libraries—enabling programmers to write
    less code, more expressive statements, and really compact expressions that make
    code easier to read and maintain. With this power comes responsibility, because
    it''s also quite possible to write virtually unparseable expressions. For many
    programmers, the acquaintance with these libraries has been an epiphany—I hope
    that it will be for you.'
