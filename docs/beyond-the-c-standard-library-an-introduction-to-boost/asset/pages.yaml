  md: 'Usage


    # What About Input and Output Operators?


    A common question from users of any is “why aren’t input and output operators?”
    There are indeed good reasons for that. Let’s start with the input operator. What
    would be the semantics for input? Would it default to a string type? Would the
    current type held by the any be used for extraction from the stream? If so, would
    an any be used in the first place? These questions come without answers, and that’s
    why there’s no input operator for any. Answering the second question is not easy,
    but almost. Supplying a forwarding output operator for any would mean that any
    is no longer capable of storing arbitrary types as operator would make the same
    requirement on the types stored by any. It wouldn’t even matter if we never intended
    to use operator<<; an instantiation of any containing a type that doesn’t have
    an output operator is still illegal, and results in an error when compiling. Of
    course, we were to provide a template version of operator<<, we would be able
    to use any without requiring that the contained types support streaming, but as
    soon as that operator is instantiated, the requirement is on.


    There seems to be a cure for missing operators, right? What if we were to supply
    a valid output operator for any that matches anything, and introduce that operator<<
    in a scope that is only accessible from the implementation details of the any
    class? That way, we could elect to throw an exception or return an error code
    when outputting to a stream was performed (the function would only match for arguments
    without support for operator<<), and without affecting the legality of any other
    class. This idea struck me as so appealing that I gave it a try on a few of the
    compilers I have at hand. The results were not good. I won’t go into detail, but
    here, the solution requires techniques that many compilers can’t currently handle.
    However, we don’t necessarily need to change the any class—we could create a new
    class that takes advantage of any to store arbitrary types, and have that class
    support operator<<. Basically, we need to do whatever it any is to keep track
    of the contained type to know how to write the output, and then add the output
    streaming.


    # Adding Support for Output—any_out


    We will define a class that is capable of output through operator<<. This adds
    to the requirements of the types that are to be stored; to be a valid type for
    storage in the any_out, the type must support operator<<.'
