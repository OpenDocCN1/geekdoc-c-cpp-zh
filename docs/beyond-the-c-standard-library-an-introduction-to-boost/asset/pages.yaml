  md: 'to copy, use, and modify the software for any use (commercial and non-commercial),
    so all you need to do is visit www.boost.org and download the latest version.


    For all the C++ Standard Library aficionados out there, it is well known that
    a new revision of the Standard Library is in progress. From a standardization
    point of view, there are three primary areas where the C++ Standard Library is
    likely to change:


    +   - Fixing broken libraries

    - Augmenting missing features to existing libraries

    - Adding libraries that provide functionality that is missing in the Standard
    Library


    The Boost libraries address all of these areas in one way or another. Of the 12
    libraries covered in this book, six have already been accepted for inclusion in
    the upcoming Library Technical Report, which means that they will most likely
    be part of the next version of the Standard Library. Thus, learning about these
    libraries has excellent long-term value. I hope that you will find this book to
    be a valuable tool for using, understanding, and extending the Boost libraries.
    From that vantage, you''ll want to incorporate those libraries and the knowledge
    enshrined within them into your own designs and implementations. That''s what
    I call.


    Thank you for reading.

    Björn Karlsson'
