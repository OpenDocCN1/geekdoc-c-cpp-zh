  md: 'the signal and the handlers thereof, systems become more robust in terms of
    both physical and logical dependencies. It’s possible to let the signaling types
    be totally ignorant of the slot types, and vice versa. This is imperative to achieve
    a high-level of reusability, and it can help break cyclic dependencies. So, a
    signals and slots library isn’t only about object-oriented callbacks, it’s also
    about the robustness of the whole system to which it is applied.


    # How Does Signals Fit with the Standard Library?


    There is nothing in the C++ Standard Library that addresses callbacks, yet there
    is an obvious need for such facilities. Boost.Signals is designed in the same
    spirit as the Standard Library, and it is a great addition to the Standard Library
    toolbox.


    # Signals


    Header: "boost/signals.hpp"


    This includes all of the library through a single header.


    "boost/signals/signal.hpp"


    contains the definition of signals.


    "boost/signals/slot.hpp"


    contains the definition of the slot class.


    "boost/signals/connection.hpp"


    contains definitions of the classes connection and scoped_connection.

    to Use this library, either include the header "boost/signals.hpp", which ensures
    that the entire library is available, or include the separate headers containing
    the functionality that you need. The core of the Boost.Signals library exists
    in namespace boost, and advanced features reside in boost::signals.


    The following is a partial synopsis for signal, followed by a brief discussion
    of the most important members. For a full reference, see the online documentation
    for Signals.'
