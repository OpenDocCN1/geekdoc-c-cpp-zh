    The return types of the overloaded versions of the function bind are unspecified—that
    is, there is no guarantee for what the signature of a returned function object
    is. Sometimes, you need to store that object somewhere, rather than passing it
    directly to another function—when this arises, you want to use Boost.Function,
    which is covered in “Library 11: Function.” The key to understanding what the
    bind-functions return is to grok the transformation that is taking place. Using
    one of the overloaded bind functions—template<class R, class F> bind(...)—as an
    example, this would be (quoting from the online documentation), “A function object
    λ that the expression λ(v1, v2, ...) is equivalent to f(it), implicitly converted
    to R.” Thus, the function that is bound is stored inside the binder, and the result
    of subsequent invocations on that object yields the return value from the function
    (if any)—that is, the template parameter R. The implementation that we’re covering
    here up to nine function arguments.


    The implementation of Bind involves a number of functions and classes, but as
    users, we do not use anything other than the overloaded function bind. All binding
    takes place through the bind function and we can never depend on the type of the
    return value. When using bind, the placeholders for arguments (called _1, _2,
    and so on) do not need to be introduced with a using declaration or directive,
    because they reside in an unnamed namespace. Thus, there is rarely a reason for
    writing one of the following lines when using Boost.Bind.


    ```

    using boost::bind;

    using namespace boost;

    ```


