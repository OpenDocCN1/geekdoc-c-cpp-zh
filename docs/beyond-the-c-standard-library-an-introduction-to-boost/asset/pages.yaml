  md: '# Foreword


    Good things are happening in the C++ community. Although C++ remains the most
    widely used programming language in the world, it is becoming even more powerful
    and yet easier to use. Skeptical? Bear with me.


    The current version of standard C++, which was finalized in 1998, offers robust
    support for traditional procedural programming as well as object-oriented and
    generic programming. Just as old (pre-1998) C++ was single-object-handedly responsible
    for putting object-oriented within the reach of the workday developer, C++98 has
    done the same within the reach of generic programming. The integration of the
    Standard Template Library (STL) into standard C++ in the mid-1990s represented
    as much a paradigm shift did Bjarne Stroustrup’s adding classes to C in the early
    1980s. Now that the majority of C++ practitioners are proficient with concepts
    of STL, it’s once again time to rise the bar.


    Applications of the power of C++ are still being discovered. Many of today’s C++
    libraries, and mathematical libraries in particular, take advantage of template
    metaprogramming, a fortuitous but unforeseen result of the brilliant design of
    C++ templates. As higher-level tools and techniques come to light in the C++ community,
    developing increasingly complex applications is becoming more straightforward
    and enjoyable.


    It is difficult to overestimate the importance of Boost to the world of C++. Since
    the ratification of C++98, no entity outside of the ISO Committee for Standard
    C++ (called WG21) has done more to influence the direction of C++ than Boost (and
    many Boost subscribers are prominent members of WG21, including its founder, my
    friend Ben Dawes). The thousands of experienced Boost volunteers have, in selfless,
    peer-reviewed fashion, developed many useful library solutions not provided by
    C++98. Ten of its offerings have already been accepted'
