  md: 'It also works with function objects returned from binder libraries, such as
    Boost.Bind and Boost.Lambda. Our class is a lot more simplistic than the ones
    found in Boost.Function, but it should be sufficiently detailed to see the problems
    and the solutions involved when creating and using such a library. To know a little
    something about how a library is implemented is helpful for using it as effectively
    as possible.


    # Function Summary


    Use Function when


    +   * You need to store a callback function, or function object

    * You want to decouple function calls from the implementation, for example between
    the GUI

    * You want to store function objects created by binder libraries to be invoked
    at a later time, or multiple times


    Boost.Function is an important addition to the offerings of the Standard Library.
    The well-known technique of using function pointers as a callback mechanism is
    extended to include anything that behaves like a function, including function
    objects created by binder libraries. Through the use of Boost.Function, it is
    easy to add state to the callbacks, and to adapt existing classes and member functions
    to be used as callback functions.


    There are several advantages to using Boost.Function rather than function pointers:
    relaxed requirements on the signature through compatible function objects rather
    exact signatures; the possibility to use binders, such as Boost.Bind and Boost.Lambda;
    the ability to test whether functions are empty—that is, there is no target—before
    attempting to invoke them; and the notion of stateless objects rather than stateless
    functions. Each of these advantages favoring Boost.Function over the C-style callbacks
    that have been prevalent in solving this type of problem. Only when the small
    additional cost of Boost.Function compared to function pointers is prohibitive
    should the function pointer technique be considered.


    Boost.Function was created by Douglas Gregor. It is a library with many powerful
    features, and is expertly designed and implemented to provide exceptional user
    value.'
