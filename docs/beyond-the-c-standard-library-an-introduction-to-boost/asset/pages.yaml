  md: '# Library 6

    Any


    # How Does the Any Library Improve Your Programs?


    +   - Typesafe storage and safe retrieval of arbitrary types

    - A means to store heterogeneous types in Standard Library containers

    - Types are being passed through layers that need not know anything about the
    types


    The Any library provides a any, that allows for storage of any type for later
    retrieval without loss of type safety. It is like a variant type on steroids:
    It will hold any type, but you have to know the type to retrieve the value. There
    are times when you need to store unrelated types in the same container. There
    are times when certain code only cares about conveying data from one point to
    another without caring about the data''s type. At face value, it is easy to do
    those things. They can be done with an indiscriminate type such as void*. They
    can be done using a discriminated union. There are numerous variant types that
    rely on some type mechanism. Unfortunately, all of these suffer from a lack of
    type safety, and only in the most controlled situations should we ever purposely
    defeat the type system. The Standard Library containers are parameterized on the
    type they contain, which poses a seemingly impossible challenge for storing elements
    of heterogeneous types in them. Fortunately, the cure doesn''t have to be spelled
    void*, because the Any library allows you to store objects of different types
    for later retrieval. There is no way to get to the contained value without knowing
    its exact type, and thus, type safety is preserved.'
