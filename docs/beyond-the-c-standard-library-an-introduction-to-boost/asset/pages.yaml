  md: '# String and Text Processing


    # Boost.Regex


    Regular expressions are essential for solving a great number of pattern-matching
    problems. They are often used to process large strings, find inexact substractions,
    tokenize a string depending on some format, or modify a string based on certain
    criteria. The lack of regular expressions support in C++ has sometimes forced
    users to look at other languages known for their powerful regular expression support,
    such as Perl, awk, and sed. Regex provides efficient and powerful regular expression
    support, designed on the premises as the Standard Template Library (STL), which
    makes it intuitive to use. Regex has been accepted for the upcoming Library Technical
    Report. For more information, see “Library 5: Regex.”


    The author of Regex is Dr. John Maddock.


    # Boost.Spirit


    The Spirit library create a functional, recursive-descent parser generator framework.
    With it, you can create command-line parsers, even in a language preprocessor.¹
    It allows the programmer to specify the grammar rules directly in C++ code, using
    (an approximation of) EBNF syntax. Parsers are typically hard to write properly,
    and when targeted at a specific problem, they quickly become hard to maintain
    and understand. Spirit avoids these problems, while giving the same or nearly
    the same performance as a hand-tuned parser.


    The author of Spirit is Joel de Guzman, together with a team of skilled programmers.


    # Boost.String_algo


    This is a collection of string-related algorithms. There are a number of useful
    algorithms for converting case, trimming strings, splitting strings, finding/replacing,
    and so forth. This collection of algorithms is an extension to those in the C++
    Standard Library.


    The author of String_algo is Pavel Droba.


    > 1. The Wave library illustrates this point by using Spirit to implement a highly
    conformant C++ preprocessor.'
