    This implicit conversion to a type, unspecified-bool-type, makes it possible to
    store a smart pointer in Boolean contexts. The value is true if the shared_ptr
    is currently storing a valid pointer; otherwise, it is false. Note that the type
    conversion returns is not specified. Using bool as the return type allows for
    some nonsensical operations, so typically, the implementation uses the safe bool
    idiom, which is a nifty way of ensuring that only applicable Boolean tests can
    be used. The function never throws.


    ```

