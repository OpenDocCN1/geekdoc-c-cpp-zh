  md: "# Utility Summary 103\n\n# Summary\n\nThe C++ language feature known as SFINAE\
    \ is important. Without it, a lot of new code would break existing code, and some\
    \ types of function overloads (and template specializations) would simply not\
    \ be possible. To directly make use of SFINAE in a controlled way to enable or\
    \ disable certain functions or types for overload resolution is complicated. It\
    \ also makes for hard-to-read code. Using `boost::enable_if` is an elegant way\
    \ of simultaneously stating that an overload is only eligible when certain conditions\
    \ apply. The same argument holds for `disable_if`, which is used to state the\
    \ opposite—that an overload is not applicable if the condition true. There is\
    \ promise of more practical uses of SFINAE, and this library also serves as a\
    \ very nice introduction of the topic. This chapter has omitted the lazy versions\
    \ of `enable_if` and `disable_if` (named `lazy_enable_if` and `lazy_disable_if`),\
    \ but I'll give them brief mention here. The lazy versions are used to avoid instantiating\
    \ types that may not be available (depending on the value of the condition).\n\
    \n+   - `enable_if` when:\n  - You need to add or remove a function to the overload\
    \ depending on some condition\n  - You need to add or remove a class template\
    \ specialization from the set of specializations depending on some condition\n\
    \n# Utility Summary\n\nThis chapter has demonstrated some useful utility classes\
    \ that can greatly simplify our daily life. `BOOST_STATIC_ASSERT` asserts at compile\
    \ time, which is very helpful for testing preconditions and enforcing other requirements.\
