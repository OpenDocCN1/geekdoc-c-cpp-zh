    variant();


    This constructor default constructs the first type of types for the variant. This
    means that the first type used when declaring the `variant` type must be default
    constructible, or else the variant type type itself cannot be default constructed.
    This constructor propagates any exceptions thrown from the first type''s constructor.


    variant(const variant& other);


    The copy constructor copies the current value of other, propagating exceptions
    thrown from other''s current type''s copy constructor.


    ```

    template <typename T> variant(const T& operand);

    ```


    This constructor creates a new variant from operand. The operand, type T, must
    be unambiguously convertible to one of the set of bound types. Exceptions thrown
    when copying or converting the operand are propagated.


