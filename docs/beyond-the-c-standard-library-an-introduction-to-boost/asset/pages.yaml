  md: '# Organization of This Book


    This book is divided into three main parts, each containing libraries pertaining
    to a certain domain, but there is definitely overlap. These divisions exist to
    make it easier to find relevant information for your task at hand or to read the
    book and find related topics grouped together. Most of the chapters cover a single
    library, but a few consist of small collections.


    The typesetting and coding style is intentionally kept simple. There are a number
    of popular best practices in this area, I''ve picked one that I feel most people
    are accustomed to, and that will convey information easily. Furthermore, the coding
    style in this book purposely tries to save some vertical space by avoiding curly
    braces on separate lines.


    Although the examples in most books make heavy use of declarations and using directives,
    this is not the case here. I have done my best to qualify names in the interest
    of clarity. There is an additional benefit to doing so in this book, and is to
    show where the types and functions come from. If something is from the Standard
    Library, it will be prefixed with `std::`. If it''s from Boost, it will be prefixed
    with `boost::`.


    Some of the libraries covered by this book are very extensive, which makes it
    impossible to include detailed explanations of all aspects of the library. When
    this is the case, there''s typically a note stating that there is more to know,
    with references to the online documentation, related literature, or both. I have
    tried to focus on the things that are of the most immediate use, and that have
    a strong relation with the C++ Standard Library.'
  merge: -1
  pgno: 19
