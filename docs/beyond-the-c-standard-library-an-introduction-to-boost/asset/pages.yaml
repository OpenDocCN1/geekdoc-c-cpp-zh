  md: 'The first part of this book covers general libraries, which are libraries that
    are eminently useful, but have no other obvious affinity. The second discusses
    important data structures and containers. The third is about higher-order programming.
    There''s no requirement to read about the libraries in a specific order, but it
    certainly doesn''t hurt to follow tradition and start from the beginning.


    Before getting to the in-depth look at the covered Boost libraries, a survey of
    each of the currently available Boost libraries will introduce you to the Boost
    libraries and give context for those that I''ll address in the rest of the book.
    It gives an interesting overview of the versatility of this world-class collection
    of C++ libraries.'
