  md: '# Members


    ```

    function();

    ```


    The default constructor creates an empty function object. If an empty function
    is invoked, it throws an exception of type bad_function_call.


    ```

    template <typename F> function(F g);

    ```


    This parameterized constructor accepts a compatible function object—that is, a
    function or a function object that has a signature with a return type that is
    the same as, or implicitly convertible to, of the function being constructed,
    and arguments are the same as, or implicitly convertible to, of the function being
    constructed. Note that another instance of function can also be used for construction.
    If that is the case, and the function f is empty, the constructed function will
    also be empty. This also applies to null function pointers and null pointers to
    members—the resulting function is empty.


    ```

    template <typename F> function(reference_wrapper<F> g);

    ```


    This constructor is similar to the previous version, but takes its function object
    wrapped in a reference_wrapper, which is used to avoid passing by value, and thus
    creating a copy of the function or function object. The requirements on the function
    objects are that they are compatible with the signature of the function.


    ```

    function& operator=(const function& g);

    ```


    The copy assignment operator stores a copy of g''s stored function or function
    object; if g is empty, the function assigned to will also be empty.


    ```

    template<typename F> function& operator=(F g);

    ```


    The parameterized assignment operator accepts a compatible function pointer or
    function object. Note that another instance of function (with a different but
    compatible signature) can also be used for assignment. This also means that the
    function can be empty after assignment, which is the case if g is another instance
    of function and is empty. Assigning a null pointer or null pointer to member effectively
    empties the function.'
