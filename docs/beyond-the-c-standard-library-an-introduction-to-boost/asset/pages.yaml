    The problem with both of these solutions is that they''re really huge, we have

    made them a part of the public interface, and they only work in some scenarios.

    Boost offers a much cleaner solution, which is both syntactically nice and offers

    m much wider range of functionality than our earlier hoc solutions.


    # Usage


    Use enable_if and disable_if, include "boost/utility/enable_if.hpp"

    For the first example, we''ll disable the second version of some_func if the type

    of argument is integral. Type information whether a type is integral is

    available in another Boost library, Boost.Type_traits. The enable_if and

    disable_if templates both accept a predicate controlling whether to enable or

    disable the function, respectively.


    ```

    #include <iostream>

