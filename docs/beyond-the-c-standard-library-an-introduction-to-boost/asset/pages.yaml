    # Bind—When Operators Aren’t Enough


    What we have seen so far is great when there are operators available to support
    our expressions, but that’s not always the case. Sometimes, we need to call another
    function as part of the expression, and that’s often referred to as binding; the
    difference between the binding we’ve already seen when creating lambda expressions
    is that this type of binding requires a separate keyword, bind (hey, that’s a
    clever name!). A bind expression is a delayed function call, either to a free
    function or a member function. There can be zero or more arguments to the function,
    some of these can be set directly, supplied when the function is invoked. With
    the current version of Boost.Lambda, up to nine arguments are supported (three
    of which can be applied later through the use of placeholders). To use the binders,
    you need to include the header `boost/lambda/bind.hpp`.


    When binding to a function, the first argument is the address of the function,
    for a non-static class member function, there is always an implicit this argument;
    in a bind expression, this argument must be explicitly added. For convenience,
    the syntax is the same regardless of whether the object is passed by reference
    or by pointer. So, when binding to a member function, the second argument (that
    is, the first after the function pointer) is the actual object to which the function
    should be invoked. It’s even possible to bind data members, which is also demonstrated
    in the following:


    ```

    #include <iostream>

    #include <string>

    #include <map>

    #include <algorithm>

    #include "boost/lambda/lambda.hpp"

    #include "boost/lambda/bind.hpp"

