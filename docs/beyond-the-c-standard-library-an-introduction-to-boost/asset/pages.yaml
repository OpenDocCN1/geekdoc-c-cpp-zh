  md: '# 376


    # Bibliography


    [14] Modern C++ Design (Andrei Alexandrescu)


    The title says it. This book covers modern techniques (in particular using templates
    in mysterious ways) of C++ programming (and design). This book definitely has
    the potential of making the reader daft (at least that''s how I felt during my
    first read), but that''s not really important (read it again). What''s important
    is that it teaches techniques not elsewhere.


    [15] More Effective C++: 35 Ways to Improve Your Programs and Designs (Scott Meyers)


    The second volume in the Effective C++... picks up where Effective C++ left off—more
    advice from Scott, and his advice is known to be good. This is an excellent companion
    to its predecessor.


    [16] More Exceptional C++ (Herb Sutter)


    As the challenges brought forth by Herb Sutter in Exceptional C++ weren''t enough
    to humble us, here''s another set of intriguing puzzles. I think that this sequel
    is even better than the first book in the series, and if you''re just one of them,
    choose this. Better yet is to get.


    [17] STL Tutorial and Reference Guide, Second Edition (David Musser/Gilmer Derge/Atul
    Saini)


    The first part of this book is a tutorial-introduction to the STL. Written by
    STL experts, this book manages to convey to the reader how the different parts
    of the STL fit together. The second part is a reference section. For a good and
    solid introduction to using and understanding the STL, consider reading this book.
    You''ll want to read before Matthew Austen''s book ([11]).


    [18] The Boost Graph Library User Guide and Reference Manual (Jeremy Sie/Lee/Andrew
    Lumsdaine)


    This book covers the Boost.Graph library, and goes on to demonstrate how to use
    the library to build algorithms that operate on graphs. It demonstrates the large
    number of graph algorithms that are included in the library. If you find yourself
    in need of using graphs to solve your programming problems, look no further than
    Boost.Graph. When it comes to learning how to use the library, look no further
    than this book!'
