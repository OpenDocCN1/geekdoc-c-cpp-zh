  md: "Prefer auto in Many Cases.\n\nNo possible expensive conversion.\n\n```\n//\
    \ avoids conversion\nconst auto value = get_string_value();\n```\n\nFurthermore,\
    \ auto return types can actually significantly simplify generic code.\n\nC++ 98\
    \ template usage.\n\n```\n// our example from \"Don't Be Afraid of Templates\"\
    \ntemplate<typename> Arithmetic\ndivide(Arithmetic numerator, Arithmetic denominator)\
    \ {\n    return numerator / denominator;\n}\n```\n\nThis code forces us to use\
    \ the same type for both the numerator and denominator (play with this and see\
    \ the weird compile errors you get).\n\nC++ 98 template made more generic?\n\n\
    ```\ntemplate<typename Numerator, typename Denominator>\n/*what's the return type*/\n\
    ddivide(Numerator numerator, Denominator denominator) {\n    return numerator\
    \ / denominator;\n}\n```\n\nC++98 provides no solution to this problem, but C++11\
    \ does."
