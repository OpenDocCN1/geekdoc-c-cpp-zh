  md: '# #47. Fuzzing and Mutating


    Your imagination limits the tests that you can create. Do you try to be malicious
    when calling your APIs? Do you intentionally pass malformed data to your inputs?
    Do you process inputs from unknown or untrusted sources?


    Generating all possible inputs to all possible function calls in all possible
    combinations is impossible. Fortunately, tools exist to solve this problem.


    # Fuzzing


    Fuzz testers generate strings of random data of various lengths. The test harness
    you write consumes these strings of data and processes them in some way that is
    appropriate for your application. The fuzz tester analyzes coverage data generated
    from your test''s execution and uses information to remove redundant tests and
    generate new unique and tests.


    In theory, a fuzz test will eventually reach 100% code coverage of your tested
    code, if left to run long enough. Combined with AddressSanitizer, this makes a
    powerful tool for finding bugs in your code. One interesting article from 2015
    describes how the combination of a fuzzer and AddressSanitizer could have found
    the security flaw "heartbeat" in OpenSSL in less than 6 hours.


    > Fuzz testing primarily finds memory and security flaws.


    Many different fuzzing tools exist. For the sake of this section, I am going to
    cover only LLVM’s libFuzzer. All fuzzers operate under the same premise.


    ¹https://blog.hboeck.de/archives/868-How-Heartbleed-couldve-been-found.html

    ²https://www.llvm.org/docs/LibFuzzer.html'
  merge: -1
  img_proc: true
