  md: '# 14. Prefer auto in Many Cases.


    I''m not an Almost Always Auto (AAA) person, but let me ask you this: What is
    the result type of std::count?


    My answer is, “I don’t care.”


    ```

    const auto

    const auto result = std::count( /* stuff * / );

    ```


    or, if you prefer:


    auto const


    ```

    auto const result = std::count( /* stuff * / );

    ```


    Using auto avoids unnecessary conversions and data loss. Same as ranged-for loops.
    auto requires initialization, the same as const, the same reasoning for why that’s
    good.


    Example:


    Possible expensive conversion.


    ```

    const std::string value = get_string_value();

    ```


    What is the return type of get_string_value()? If it is std::string_view or const
    char *, we will get a potentiallyially costly conversion on all compilers with
    no diagnostic.'
