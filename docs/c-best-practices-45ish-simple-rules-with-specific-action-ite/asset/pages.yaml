  md: "# 18. Don’t Be Afraid of Templates\n\nTemplates are the ultimate DRY principle\
    \ in C++. Templates can be complicated, daunting, and Turing complete, but they\
    \ don't have to be. Fifteen years ago, it seemed the prevailing attitude was “templates\
    \ aren’t for normal people.”\n\nFortunately, this is less true today. And we have\
    \ more tools today, concepts, generic lambdas, etc.\n\nWe’re going to build up\
    \ an example over a few chapters. Let’s say we want to write a function that can\
    \ divide any two values.\n\nDivide doubles.\n\n```\ndouble divide(double numerator,\
    \ double denominator) {\n    return numerator / denominator;\n}\n```\n\nBut you\
    \ don’t want all of your divisions to be promoted to double.\n\nDivide floats.\n\
    \n```\nfloat divide(float numerator, float denominator) {\n    return numerator\
    \ / denominator;\n}\n```\n\nAnd of course, you want to handle some kind of integer\
    \ values."
  merge: -1
  img_proc: true
- pgno: 44
  md: "Don't Be Afraid of Templates\n\nDivide ints.\n\n```\nint divide(int numerator,\
    \ int denominator) {\n  return numerator / denominator;\n}\n```\n\nTemplates were\
    \ designed for just this scenario.\n\nBasic template usage.\n\n```\ntemplate<typename\
    \ T>\nT divide(T numerator, T denominator) {\n  return numerator / denominator;\n\
    }\n```\n\nMost examples on the internet use T, like I just did. Don't do that.\
    \ Give your type a meaningful name.\n\ntemplate parameters with actual names.\n\
    \n```\ntemplate<typename Arithmetic>\nArithmetic divide(Arithmetic numerator,\
    \ Arithmetic denominator) {\n  return numerator / denominator;\n}\n```\n\n# Exercise:\
    \ Keep this chapter in mind while moving on to the next chapter and looking at\
    \ its exercises."
