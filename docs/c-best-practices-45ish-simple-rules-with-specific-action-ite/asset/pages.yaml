- pgno: 125
  md: "# 50. Bonus: Understand The Lambda\n\nA surprising complexity hides behind\
    \ the simple lambda of C++. Initially added in C++11, it was initially constrained.\
    \ With each version of C++, the lambda becomes more flexible and powerful.\n\n\
    Lambdas reverse some of the defaults from the rest of C++. Default const and automatically\
    \ constexpr when possible; they give us some of what we wish the rest of the language\
    \ could have.\n\nLambda grammar:\n\n```\nlambda-expression:\nlambda-introducer\
    \ lambda-declarator(opt) compound-statement\nlambda-introducer < template-parameter-list\
    \ > requires-clause(opt)\nlambda-declarator(opt) compound-statement\n```\n\n```\n\
    lambda-introducer:\n  [ lambda-capture(opt) ]\nlambda-declarator:\n  ( parameter-declaration-clause\
    \ ) decl-specifier-seq(opt)\n  noexcept-specifier(opt) attribute-specifier-seq(opt)\n\
    \  trailing-reverse-type(opt) requires-clause(opt)\n```\n\nIf you can read standard-eze',\
    \ you can dig into all of the features of C++20's lambdas yourself."
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Bonus: Understand The Lambda


    Allowed lambdas as of C++20.


    ```

    // valid empty lambda, does nothing

    []{}


    // optional to have parameter list

    [](){}


    // C++17 explicit constexpr and return void

    []() constexpr -> void {};

    // immediately invoked lambda

    auto i = [](){{ return 42; }();

    // Not allowed before C++17, because constexpr

    constexpr auto j = [](){{ return 42; }();

    // generic lambda, C++14

    [](auto x){ return x + 42; };

    // variadic lambda, C++14

    [](auto... x){ return std::vector<int>(x...) }; };

    // capture by copy, C++11

    [i](){ return i + 42; };

    // generalized capture, C++14 (what''s the type of i)

    [i = 42]{ return i + 42; };

    // stateful lambda, C++11

    [i]() mutable { return ++i; };

    // explicit template, C++20

    <typename T>(T x){ return x + 42; };


    // generic lambda returning a C++20 lambda with variadic

    // capture expression which returns a fold expression summation

    // of the captured values.

    [](auto... val){ return [...= val]{{ return (val + ...); }; };; };

    ```


    If you understand every aspect of C++''s lambdas and how the implement them, you
    know everything about C++.


    This is why I put together my C++ class on YouTube about lambdas.


    > https://www.youtube.com/playlist?list=PLs3KjaCtOwSY_Awyliwm-frJEa-SRBs-'
  merge: -1
