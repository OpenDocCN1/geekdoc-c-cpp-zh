  md: "# # 30. Use Lippincott Functions\n\nSame arguments as de-template-izing your\
    \ code: This is a do-not-repeat-yourself principle for exception handling routines.\n\
    \nIf you have many different exception types to handle, you might have code that\
    \ looks like this:\n\nDuplicated exception handling.\n\n```\nvoid use_thing()\
    \ {\n  try {\n    do_thing();\n  } catch (const std::runtime_error &) {\n    //\
    \ handle it\n  } catch (const std::exception&) {\n    // handle it\n  }\n}\n```\n\
    \n```\nvoid use_other_thing() {\n  try {\n    do_other_thing();\n  } catch (const\
    \ std::runtime_error &) {\n    // handle it\n  } catch (const std::exception&)\
    \ {\n    // handle it\n  }\n}\n```\n\nA Lippincott function (named after Lisa\
    \ Lippincott) provides a centralized exception handling routine."
  merge: -1
  img_proc: true
- pgno: 77
  md: "# Use Lippincott Functions\n\nLippincott de-duplicated exception handling.\n\
    \n```\nvoid handle_exception() {\n  try {\n    throw; // re-throw exception already\
    \ in flight\n  } catch (const std::runtime_error&) {\n  } catch (const std::exception&)\
    \ { }\n}\n\nvoid use_thing() {\n  try {\n    do_thing();\n  } catch (...) {\n\
    \    handle_exception();\n  }\n}\n\nvoid use_other_thing() {\n  try {\n    do_other_thing();\n\
    \  } catch (...) {\n    handle_exception();\n  }\n}\n```\n\nThis technique is\
    \ not new - it has been available since the pre-C++98 days.\n\n# Exercise: Do\
    \ You Use Exceptions?\n\nIf your project uses exceptions, there's probably some\
    \ ground for simplifying and centralizing your error handling routines. If it\
    \ does not use exceptions, then you likely have other types of error handling\
    \ routines that are duplicated. Can these be simplified?"
