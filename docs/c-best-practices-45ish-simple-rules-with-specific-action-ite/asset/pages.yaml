  md: "# 28. Constrain Your Template Parameters With Concepts (C++20)\n\nConcepts\
    \ will result in better error messages (eventually) and better compile times than\
    \ SFINAE. Besides much more readable code than SFINAE.\n\nIf we continue to build\
    \ on our divide example, we can take this if constexpr version from the Prefer\
    \ if constexpr over SFINAE chapter.\n\nif constexpr version of divide function.\n\
    \n```\n#include <stdexcept>\n#include <type_traits>\n#include <utility>\n\ntemplate\
    \ <typename Numerator, typename Denominator>\nauto divide(Numerator numerator,\
    \ Denominator denominator) {\n    if constexpr (std::is_integral_v<Numerator>\
    \ &&\n                 std::is_integral_v<Denominator>) {\n        // is integral\
    \ division\n        if (denominator == 0) {\n            throw std::runtime_error(\"\
    divide by 0!\");\n        }\n    }\n    return numerator / denominator;\n}\n```\n\
    \nAnd we can split it back out as two different functions using concepts.\nConcepts\
    \ can be used in several different contexts. This version uses a simple requires\
    \ clause after the function declaration."
