  md: '# 36. Don’t return raw pointers


    Returning a raw pointer makes the reader of the code and user of the library think
    too hard about ownership semantics. Prefer a reference, smart pointer, non owning
    pointer wrapper, or consider an optional reference.


    Function returning a raw pointer.


    ```

    int *get_value();

    ```


    Who owns this return value? Do I? Is it my job to delete it when I’m done with
    it?

    Or even worse, what if the memory was allocated by malloc and I need to call free
    instead?


    Is it a single int or an array of int?


    This code has far too many questions, and not even [[nodiscard]] can help us.


    # Exercise: You know the drill


    By now, you’ve done enough of these API related exercises to know what to do.
    Go and look for these in your code! See if there’s a better way! Can you return
    a value, reference, or std::unique_ptr instead?'
