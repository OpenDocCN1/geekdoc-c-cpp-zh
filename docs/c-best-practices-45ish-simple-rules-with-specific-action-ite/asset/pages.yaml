  md: "# Use Stronger Types\n\nIn C++, an enum class gives you an easy way to add\
    \ stronger typing, avoid boolean parameters, and make your API harder to use wrong.\n\
    \nConsider:\n\n+   Non-obvious order of parameters.\n\n```\nstruct Widget {\n\
    \  // this constructor is easy to use wrong, we\n  // can easily transpose the\
    \ parameters\n  Widget(bool visible, bool resizable);\n}\n```\n\nCompared to:\n\
    \n+   Stronger typing with scoped enumerations.\n\n```\nstruct Widget {\n  enum\
    \ struct Visible { True, False };\n  enum struct Resizable { True, False };\n\n\
    ```\n\n```\n// still possible to use this wrong, but MUCH harder\nWidget(Visible\
    \ visible, Resizable resizable);\n```\n\n# Identify the problematic APIs in your\
    \ existing code.\n\nWhat function call do you regularly get out of order? How\
    \ can it be fixed?\n\n# Exercise: Research strong typedef libraries for C++.\n\
    \nThere are existing libraries that can simplify some of the boilerplate code\
