- pgno: 54
  md: "# 23. Never Test for this To Be nullptr, It’s UB\n\n*Invalid check for this\
    \ to be nullptr.*\n\n```\nint Class::member() {\n    if (this == nullptr) {\n\
    \        // removed by the compiler, it would be UB\n        // if this were ever\
    \ null\n        return 42;\n    } else {\n        return 0;\n    }\n}\n```\n\n\
    Technically it isn't the check that is Undefined Behavior (UB). But it’s impossible\
    \ for the check ever to fail. If the this were to be equal to nullptr, you would\
    \ be in a state of Undefined Behavior.\nPeople used to do this all the time, but\
    \ it’s always been UB. You cannot access an object outside its lifetime. Compilers\
    \ today will always remove this check.\nThe only way it’s theoretically possible\
    \ for this to be null is when you call a member directly on a null object."
  merge: -1
  img_proc: true
- pgno: 55
  md: "Never Test for this Be nullptr, It's UB\n\nBad examples lie ahead, do not repeat\
    \ them.\n\nBad call of member on nullptr.\n\n```\nType *obj = nullptr;\nobj->do_thing();\
    \ // never do this\n```\n\nEven in the (technically OK, but never do this) scenario\
    \ of calling delete this.\n\nBad example of delete this.\n\n```\nstruct S {\n\
    \    std::string data;\n}\n\nvoid delete_yourself() {\n    // do things\n    delete\
    \ this; // technically OK\n\n    if (this) {\n        // this block will always\
    \ be executed, nothing changed\n        // our view of 'this'\n    }\n\n    //\
    \ never do this\n    data.size(); // UB, data's lifetime has ended\n};\n```\n\n\
    There is no scenario in which a check for if (this) will return false on a modern\
    \ compiler."
