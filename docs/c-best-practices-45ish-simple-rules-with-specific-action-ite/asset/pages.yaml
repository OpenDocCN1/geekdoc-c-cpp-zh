  md: '# 4. Use the Tools: Continuous Builds


    Without automated tests, it is impossible to maintain project quality.


    In the C++ projects I have worked on throughout my career, I''ve had to support
    some combination of:


    +   * x86

    * x64

    * SPARC

    * ARM

    * MIPSEL


    On


    +   * Windows

    * Solaris

    * MacOS

    * Linux


    When you start to combine multiple compilers across multiple platforms and architectures,
    it becomes increasingly likely that a significant change on one platform will
    break one or more other platforms.


    To solve this problem, enable continuous builds with continuous tests for your
    projects.


    +   * Test all possible combinations of platforms that you support'
  merge: -1
