  md: "# 29. De-template-ize Your Generic Code\n\nMove things outside of your templates\
    \ when you can. Use other functions. Use base classes. The compiler is still to\
    \ inline them or leave them out of line.\n\nDe-template-ization will improve compile\
    \ times and reduce binary sizes. Both are helpful. IMO is still free to inline\
    \ or leave them out of line. It also eliminates the thing that people think of\
    \ as “template code bloat” (which IMO [doesn't exist'](https://articles.emptycrate.com/2008/05/06/nobody_understands_c_part_5_template_code_bloat.html))\
    \ (article formatting got broken at some point, sorry).\n\nA new lambda for each\
    \ function instantiation.\n\n```\ntemplate<typename T>\nvoid do_things()\n{\n\
    \    // this lambda must be generated for each\n    // template instantiation\n\
    \    auto lambda = [](){/* some lambda that doesn't capture */ };\n    auto value\
    \ = lambda();\n}\n```\n\nCompared to:\n\n> https://articles.emptycrate.com/2008/05/06/nobody_understands_c_part_5_template_code_bloat.html"
