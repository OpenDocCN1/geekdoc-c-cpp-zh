  md: "# #26. Prefer Scoped enums\n\nC++11 introduced scoped enumerations, intended\
    \ to solve many of the common problems with enum inherited from C.\n\n```\nC++98\
    \ enums\nenum Choices {\n    option1 // value in the global scope\n};\n\nenum\
    \ OtherChoices {\n    option2\n};\n\nint main() {\n    int val = option1;\n  \
    \  val = option2; // no warning\n}\n```\n\n+   - enum Choices;\n- enum OtherChoices;\n\
    \nThese two can easily get mixed up, and they each introduce identifiers in the\
    \ global namespace.\n\n+   - enum class Choices;\n- enum class OtherChoices;\n\
    \nThe values in these enumerations are scoped and more strongly typed."
