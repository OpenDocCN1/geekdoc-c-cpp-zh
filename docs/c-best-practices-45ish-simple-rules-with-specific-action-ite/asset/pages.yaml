- pgno: 49
  md: "# 21. If You Must Do Manual Resource Management, Follow the Rule of 5\n\nIf\
    \ you provide a destructor because std::unique_ptr doesn’t make sense for your\
    \ use case, you must must =delete, =default, or implement the other special member\
    \ functions.\n\nThis rule was initially known as the Rule of 3 and is known as\
    \ the Rule of 5 after C++11.\n\nThe special member functions.\n\n```\nstruct S\
    \ {\n    S(); // default constructor\n    // does not affect other special member\
    \ functions\n\n    // If you define any of the following, you must deal with\n\
    \    // all the others.\n    S(const S&); // copy constructor\n    S(S&&); //\
    \ move constructor\n    S&operator=(const S&); // copy assignment operator\n \
    \   S&operator=(S&&); // move assignment operator\n};\n```\n\n> =delete is a safe\
    \ way of dealing with the special member functions you don’t know what to do with\
    \ them!\n\nYou should also follow the Rule of 5 when declaring base classes with\
    \ virtual functions."
  merge: -1
  img_proc: true
- pgno: 50
  md: "If You Must Do Manual Resource Management, Follow the Rule of 5\n\nRule of\
    \ 5 with polymorphic types.\n\n```\nstruct Base {\n    virtual void do_stuff();\n\
    ```\n\n```\n// because of the virtual function we know this class\n// is intended\
    \ for polymorphic use, therefore our\n// tools will tell us to define a virtual\
    \ destructor\nvirtual ~Base(Base&) = default;\n```\n\n```\n// and now we need\
    \ to declare the other special members\n// a good safe bet is to delete them,\
    \ because properly and safely\n// copying or assigning an object via a reference\
    \ or pointer\n// to a base class is hard / impossible\n```\n\n```\nS(S&&) = delete;\n\
    S(const&) = delete;\nS &operator=(const S&) = delete;\nS &operator=(S &&) = delete;\n\
    ;\n```\n\n```\nstruct Derived : Base {\n// We don't need to define any of the\
    \ special members\n// here, they are all inherited from `Base`.\n;\n```\n\n> Instead\
    \ of = delete you can consider making these special members protected."
  merge: -1
