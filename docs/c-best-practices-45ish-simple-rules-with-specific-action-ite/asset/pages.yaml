  md: "# 37. Prefer Stack Over Heap\n\nStack objects (locally scoped objects that\
    \ are not dynamically allocated) are much more optimizer friendly, cache-friendly,\
    \ and may be entirely eliminated by the optimizer. As Björn Feller has said, “assume\
    \ any pointer redirection is a cache miss.\n\nIn the most simple terms:\n\nOK\
    \ idea, uses stack and can be optimized.\n\n```\nstd::string make_string() { return\
    \ \"Hello World\"; }\n```\n\nBad idea, uses the heap.\n\n```\nstd::unique_ptr<std::string>\
    \ make_string() {\n  return std::make_unique<std::string>(\"Hello World\");\n\
    }\n```\n\nOK idea.\n\n```\nvoid use_string() {\n  // This string lives on the\
    \ stack\n  std::string value(\"Hello World\");\n}\n```"
