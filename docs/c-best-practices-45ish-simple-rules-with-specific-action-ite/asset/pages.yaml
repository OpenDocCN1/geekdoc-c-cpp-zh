  md: '# 13. constexpr Everything Known at Compile Time


    Gone are the days of #define. constexpr should be your new default! Unfortunately,
    people over-complicate constexpr, so let''s break down the simplest thing.


    If you see something like (I''ve seen in real code):


    ```

    static const data known at compile time.

    static const std::vector<int> angles{-90,-45,0,45,90};

    ```


    This really needs to be:


    ```

    Moving static const static constexpr.

    static constexpr std::array<int, 5> angles{-90,-45,0,45,90};

    ```


    > static constexpr here is to make sure the object is not reinitialized each time
    the function / declaration is encountered. With static the variable lasts for
    the lifetime of the program, and we know it will be initialized exactly once.


    The difference is threefold.


    +   - The size of the array is now known at compile time

    - We''ve removed dynamic allocations

    - We no longer pay the cost of accessing a static'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The main gains come from the first two, but we need a constexpr mindset looking
    for this kind of opportunity. We also need constexpr knowledge to see how to apply
    it in the more complex cases.


    The difference can be significant.


