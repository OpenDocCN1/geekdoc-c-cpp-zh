  \ 角色。我了很多人。去那里真是个正确的决定。”\n\n正当我说话时，我的手机疯狂响了起来，是 `Lifestage` 的首席工程师发的一系列消息，他显然还在办公室，处理我今天早上从机场发给他的一份修改清单。“嗯，抱扰一下，”我对着家人说。当我翻看那连串消息时，服务员回到桌边，开始介绍菜单。\n\
  \n当服务员离开让我们做决定时，我妈妈低声说：“迈克尔，你不该选这个地方的。我们把钱都花在那些昂贵的阿尔卡特拉斯监狱门票上了。我们消费不起。”\n\n“妈妈，别担心，我请客。哪种鸡肉都比不上你做的，但我向你保证这是你吃过最美味的中餐。点吧。点任何你想吃的！”\n\
  \n这时，服务员端着盘螃蟹和奶酪球出现了。“这是店里送的，”她说，“我马上回来给你们点菜！”\n\n服务员一转过身，我妈妈就立刻凑了过来。\n\n“迈克尔，你觉得她漂亮吗？你在和谁交往吗，迈克尔？”\n\
