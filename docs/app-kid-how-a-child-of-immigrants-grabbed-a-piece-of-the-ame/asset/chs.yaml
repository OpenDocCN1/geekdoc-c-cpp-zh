  \n***\n\n晚饭后，我们去电影院看《小坏蛋 3》，这是放映时间合适的唯一一部没有字幕或海报上没有穿胸衣女性的电影。事实证明，布拉德比我高一点，但与我之前无知的担心这会让我显得“女性化”，我一点也不感到困扰。在电影院里，我特意买了爆米花作为避免牵手的策略，但布拉德还是拉了我的手几次。握着另一个男人的手感觉很奇怪。我是在玩弄一种仍然还不理解的东西。\n\
  \n\n\n“是的，我很高兴见到你，”他回答道。那个词又出现了：*高兴*（enjoyed）。谢天谢，我的车到了。他走到路边为我开门，我坐了进去，在车启动时转过头挥了挥手。但布拉德已经朝另一个方向走去，双手深地插在紧身牛仔裤的口袋里，双臂直得像栅栏一样，肩膀耸到了耳朵根。\n\
  \n在回红杉木城（Redwood City）的路上，我一直在内心进行自我对话。谢幸的是，那个刻薄的声音没有出现。通过和 `Facebook` 的朋友们谈论他们是如何应对挑战和失望的，我开始学习如何规避那些我生命中大部分时间沉溺其中的负面自我暗示。转移负面情绪循环最好的建议是什么？问自己一些问题！现在我脑子里的声音听起来是这样的：\n\
