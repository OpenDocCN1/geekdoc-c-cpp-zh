- "# App Kid：移民之子如何抓住美国梦\n\n\n\n![](img/9780525656203_cover.jpg)\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\n我当时只有六岁，在玻利维亚为一千五百欢呼的学生做演讲。活动组织者正试图为上舞台清出一条路。人们拉着我的衣服，站起来并为我的入场鼓掌，而我挤过人群走向舞台，心里却希望自己回到酒店房间写代码。在我的余光中，我可以看到来自当地和国际频段的记者正在拍摄。我试图屏蔽脑海中涌入的思绪，其中最强烈的是：我并不是为这种场合而生的。这些人正在寻找一个能够给他们见解和指导的人，而我不确定自己是否就是那个人。\n\
  \n当我十三岁时，我发布了我的第一个 iPhone App，并迅速通过下载每月赚取 10,000 美元——这足以在我们那个中产阶级的纸牌屋（由万事达和 Visa\
  \ 提供的塑料模型）在大经济衰退中崩塌时支撑我的家庭。因此，拉丁美洲媒体将我称为“苹果天才少年”。我经常出现在新闻中，并在社交媒体上拥有大量粉丝。但我担心新闻过早地赞美了我。我曾经一度成功的\
  \ App 销量已经在下降，而我不知道下一步该怎么办。\n\n在舞台上，我开始了一段漫长的演讲，讲述了在迈密达作为玻利维亚和秘鲁移民长大的经历。讲述我是开始编程的。我告诉他们如何通过\
  \ YouTube 视频自学，以及自从危机以来，我的 App 一直在帮助家里支付账单。我向他们保证，我之所以站在那里并不是因为我改变了世界。我之所以站在这里是因为尽管我充满了不安全感和缺点，但我从未让失败阻止我去创造改变*我*世界的东西。当我知识或能力的缺失导致我停滞时，我解释说，我不会让自己被困太久。我会深呼吸，然后通过\
  \ Google 摆脱自己挖的任何坑。“如果你想成为一名程序员，”我对房间里的人说，“互联网将成为你最好的朋友、你的指南和你的灵感来源。”\n\n我刚说完，学生们就开始向我抛来关于如何编程的问题。“搜索\
  \ Xcode 或 Eclipse，并观看关于 Java 或 Objective-C 的教学视频，”我一遍又地重复。这在今天同样适用。编程的变化太快了，没有任何静态资源能跟上。如果你想学习编程，让互联网成为你的指南。\n\
  \n最后，学校的一人结束了问答，我被带出了剧院。每隔几米，我就得停下来拍一张自拍。有人在大喊“排队！”，但没人听。人们推着、拉着、抓着我，我看了看陪我的妈妈，她正无能为力。回到我们租的车里，我们在堵车中缓慢移动，一些学生在车里后面跟着，降下车窗拍照。在酒店里，我和妈妈倒倒在床上。\n\
  \n\n\n\n第二天，我回到了在美国生活的现实中。没有人会在`迈阿密国际机场`多看我一眼。我不确定这一切是否仅仅是一场梦。每当我想到自己的血统、父母的祖籍，以及他们祖辈祖先时，在`玻利维亚`的最后几天似乎显得更加不可思议，甚至可以说是是不可能的。\n\
  \n## 家族传承与语言\n\n直到我出生多年后，我的父母才获得美国国籍。虽然这本书（包括我的家庭生活故事在内）是用英文写的，但我父母一直只用西班牙语与我交流。当我的父母移民到美国时，他们学到的英语仅够维持基础对话；直到今天，他们有时仍然难以进行有效的沟通。我仍然不知道那些在英语环境中长大的人常用的俗语中的大半，因为我从未在家里听过它们。某些词汇，比如“sequester”（隔离），直到最近我才知道如何用西班牙语说。每当我撞到脚趾时，口出的咒骂声也是西班牙语。\n\
  \n我的母亲`Maria Cristina Gálvez` 原本出生在`阿雷基帕`，那是`秘鲁`的一个大部分地区干燥且多山的地带，但我的祖母希望分娩时有母亲和家族的支持，于是她飞到了首都`利马`与家人团聚。我的外祖是秘鲁军队的一名将，在那期间，战争打得很激烈。作为一个女孩，我妈妈和她的四个哥哥经常从他们卧室的窗外听到炸弹声，有时由于输电塔被击，我妈妈不得不躲在桌子底下通过烛光学习。尽管经历了战争，我的母亲仍然记得她的童年是充满爱、受保护且安全的。\n\
  \n我父亲在一个不同的世界里长大。他出生在`玻利维亚`的首都`拉巴斯`的一个犹太家庭。他三岁时，父母带他离开了`利马`；后来他们分开了。他的哥哥在他二十一岁时去世，这场悲剧震惊了家族，并为他的人生奠定了基调。父亲的祖父母在`第二次世界大战`期间逃离了欧洲，他们都是犹太人，对孙子怀有巨大的梦想，将他送往`以色列`学习系统论和应用数学。但我父亲反抗了该项目要求的纪律。他的祖父母威胁说，如果他辍学就停止提供经济支持，但他还是这么做了，搬到`洛杉矶`追求视频编辑事业。他曾和几个室友合住公寓，并在一所技学校学习。几年后，他搬到了`迈阿密`，在`Telemundo`总部找到了一份制作工作。我的外公很少出现在他的生活中，他的外母仍住在`秘鲁`并饱受抑郁症困扰，因此被祖父母断了经济来源的父亲只能靠自己，靠着临时工作签证艰难度日。\n\
  \n`迈阿密`是访问美国的拉丁裔的枢纽，我妈妈二十岁时曾和一群闺蜜去了那里。在一次派对上，我父亲在房间另一头看到了她。那就是我们家庭的开始。\n\n我妈妈回了`秘鲁`，在接后的三年里和我父亲异地恋爱。她梦想成为一名职业心理学家，但她母亲建议她去学一个要求没那么高的职业或学位。我妈妈爱着我爸爸，所以她听从了祖母的建议，获得了一个秘书证书。但我的祖母并没有任由我二十三岁的母亲搬到我父亲那里。她告诉妈妈，如果想要住在一起并离开她在`秘鲁`的父母家，就必须结婚。于是，我妈妈和我爸爸结婚了。他们当然更希望先同居几年，但他们没有选择。我的父母举行了婚礼并定居在`迈阿密`。三年后，`1996\
  \ 年 8 月 24 日`，我出生了。我的姐姐`Mariana`在一年后到来。\n\n## 迈阿密的文化认同\n\n西班牙语不仅在我家里是主导语言。它是`迈阿密`绝大多数人使用的语言，那里有\
  \ 70%的人口是拉丁美裔。在`迈阿密`并没有出生于当地的主导多数群体。餐厅菜单和一些路标是用西班牙语写的；如果有人走过来问路，他们会立刻开始用西班牙语交流；在`迈阿密`的很多地区，看医生会自动以西班牙语提问开始。在`迈阿密`，70%的拉丁美裔意味着拉丁裔内部存在阶级和种族划分。任何人都能根据你的西班牙语口音判断出你来自哪里——`秘鲁`、`哥伦比亚`、`玻利维亚`、`智利`、`墨西哥`或`古巴`。`迈阿密`的大多数拉丁裔是古巴裔。在`菲德尔·卡斯特罗`在其国家上台后，他们于六十年代开始迁移到`迈阿密`并创业。`迈阿密`的古巴人往往比大多数非古巴家族更有关系，后者通常是较新的移民。如果你在`迈阿密`不是古巴人，融入将更加困难。\n\
  \n在我从三年级到五年级的小型天主教学校，所有的古巴家长都互相认识。我的父母在那群感到像局外人。从外表看，我妈妈可以被认为是古巴人，但当其他妈妈听到她说话时，就知道真相。因此，我的父母自然地倾向于来自`哥伦比亚`、`委内瑞拉`和其他南美国家的夫妇。我和姐姐在幼儿园就开始说流利的英语，但由于我们的南美背景，我们仍然面临着与父母相似的某些社交障碍。\n\
  \n## 身份的挣扎\n\n我的一生都感到自己处于多重身份认同的拉扯中。我是犹太人还是天主教徒？我的父亲是犹太人，我的母亲是天主教徒，但为了结婚她皈依了犹太教。我妈妈告诉我，多年来他们一直在争论应该遵循哪种宗教，最终决定兼顾：我爸爸决定了犹太幼儿园，我妈妈选择了小学。\n\
  \n我是秘鲁人还是玻利维亚人？当我开始出名时，这两个国家都试图声称我是他们，尽管我从未完全认同其中任何一个。我是真正的美国人吗？我的父母不是这里，我的老师是拉丁美裔，我的城市主要说西班牙语；我们与从小在电视上看到的美国人完全不同。我是孩子还是成人？当我十三岁开始养父母时，我的童年就基本消失了。但现在我二十多岁，我也无法说自己完全擅长所谓的“成年生活”。\n\
  \n\n\n\n当然，我并不是仅仅靠着努力和决心才走到这里的。在我人生的前十年里，我的家庭生活得很富足——如果说超出了我们的能力范围。我有安全感、时间和空间去玩耍并幻想未来。我的家人有能力帮我买第一台`iPhone`，那成了我通往那个未来的大门。世界上有很多孩子从未有过那种做梦的空间，更不用说获得那些帮助他们实现梦想的技术了。在今天的玻利维亚，每百人中只有四个人拥有家庭互联网订阅，只有大约\
  \ 40%的人口可以使用互联网。成年人喜欢问孩子：“你长大想做什么？”但如果这些孩子连基本的生存都得不到满足——如果他们感到饥饿，或者为晚上晚上睡在哪里而感到压力——那就是一个荒谬的问题。当人们仅仅为了生存时，谁有时间考虑长大想做什么呢？\n\
  \n这就是为什么我没有告诉那些玻利维亚的孩子要“大胆梦想”或“摘星辰”。我告诉他们，如果他们想学编程，互联网上有免费的教育等着他们。编程现在是一项需求巨大的技能，拥有着你能找到最有竞争力的薪水之一。但这些并不是成为程序员的充分理由。你必须热爱这项工作才能精通它。他们说精通一项事业需要一万小时的练习。从初中开始，我可能每周花四十小时来构建网站和制作应用——大约三万小时——我仍然不认为自己是专家，更不用说大师。我将一直学习，这也是我热爱我的工作的原因。我编程是因为我在做这件事时会忘记时间——我从不感到无聊。如果我会无聊，一辈子的努力也无法让我伟大。\n\
  \n如何开始？不开玩笑的，就像我告诉那些孩子的一样，你从`Goling`（搜索）你想知道的东西开始；关于构建应用或编程，你需要的一切知识在互联网上都是 100%免费的。虽然这听起来可能过于简单，但我发现这确实是最好的学习方法。你买的任何一本编程书，在你读完时就已经过时了。虽然编程训练营和课程绝对是快速提升技能的绝佳方式，但它们在这个瞬息万变的宇宙里，也只能教你最前沿的编程语言。我说这句话并不夸张：无论程序员学习编程的速度有多快，编程语言正在被重新发明。正如任何工程师都会告诉你的那样，我们已经到了必须时刻开着`Google`标签页才能跟上的地步。这就是为什么我认为从一开始就应该学会如何使用`Google`来教自己。\n\
  \n编程不是致富的捷径，但它可以成为你跳出大学到职场常规路径的起点——一条超越你最疯狂梦想的成功替代之路。\n\n# 第一章\n\n## 美国梦\n\n拥有一自己的餐厅一直是我父母的梦想，所以当我三岁时，他们付诸行动。`El\
  \ Pollon Grill`是迈阿密首批秘鲁式烤鸡店之一，我们称其为`pollo a la brasa`。从外面看它没什么特别的——只是购物中心带中间一栋有霓虹灯牌的小建筑——但人们对我妈妈做的鸡肉百吃不厌。\n\
  \n除了经常和妈妈争论我只想吃鸡肉和炸薯条这件事以外——她总是给我准备鸡肉饭、鸡肉馅饼、`ají de gallina`鸡肉酱、`pollo a la plancha`烤鸡、`arroz\
  \ con pollo`鸡肉饭——我没什么可抱怨的。我们住在迈阿密典型的郊区社区，那里有漂亮的房子和绿色的草坪——尽管我怀疑其中没有一栋是付清贷款的。现在餐厅经营起来了，我的父母正尝试进入房地产业务。在那些作为房东获得过小成功的邻居的建议下，我父亲拿了房地产经纪执照，我的父母申请了贷款并购买了几处房产出租。\n\
  \n我的父母有信用卡，而且他们经常使用：不仅用于杂货、校服和汽油等日常开销，还用于大额、有趣的事情，比如派对、一套新的客厅家具和去`迪士尼世界`的旅行。\n\n\
  说到我们的生日派，我妈妈总是挥霍得远超我们的能力。说的不仅仅是充气球和蛋糕。我说的是魔术师和充气床。当白天的派对结束，所有孩子都回家后，成人的派对就开始了，有足够让整个社区享用的烤鸡和加酒精果汁。当然，这一切都是通过信用卡支付的。\n\
  \n然后，一切都变了。在 2006 年中，我的父母看起来压力很大。他们在早晨喝咖啡时低声咕咕，说一切都在“崩塌”，他们在支付账单方面遇到了困难。\n\n我们停止了旅行和外出就。甚至去`迪士尼世界`的旅行也结束了。有时，我的父母会在餐厅工作到凌晨两点或三点。\n\
  \n一个晚上，在我十岁生日前的几周，我听到他们用忧虑、低沉的声音说话。玛丽亚和我我们下楼，我的父母邀请我们进入房间。“你长大了，”我妈妈开始说，“大孩子不过生日派对了；他们和朋友去看电影、聚会。今年，迈克尔，你快变成一个大孩子了。与其过生日派对，你要和你的朋友去看电影。”\n\
  \n\n\n\n那台戴尔电脑——以及它为我开启的通之门——让我从父母日益增长的压力中解脱出来。他们正努力在一个财务体系中挣扎，即便过了多年，我都能看出那个系统对他们来说仍然完全陌生。我知道他们为我们买了那台戴尔——我推测是贷款买的，就像其他所有东西一样——因为他们想给我们我们想要的一切。至少，我的父母是这么想的。我知道，当我们抱怨晚餐只吃豆子饭，或者当他们买不起我们的新校服，而去年的旧衣服快要撑破时，这对他们来说很痛苦。然而，那台戴尔通过满足我的好奇心和想象力弥补了这一切。我好奇的一切都触手可及，等待着发现。Google\
  \ 从我出生起就存在了，我从来不需要问过父母“为什么要这个？”或“为什么要那个？”我只需要 Google 一下 `it`。\n\n和大多数大多数兄弟姐妹一样，我和玛丽娜（Mariana）有时很亲近，有时又不是。无论如何，她都是我与现实世界的联系。当我满足于在下午沉浸在纸质恐龙世界里，或者通过戴尔电脑探索南极时，玛丽娜是外向且善社交的，而且在生活中总是领先我一步——尽管我比她大一岁，她在身高和常识上都早已超越了我。*她*是那个非要告诉*我*没有圣诞老人的人。没有人能像玛丽娜那样看穿大人们及其那些小花招。\n\
  \n当我们很小的时候，妈妈经常会双臂交叉，并用她那凶厉的声音数到三，以此让我们做任何她想做的事：“*Uno…dos…*（一……二……）”。在 *dos*（二）之后，通常会有一个很长的停顿，恰好让玛丽娜和我跳起来，最终执行指令。多年来，我一直确保我们绝不让妈妈（几乎总是她在教训我们）数到停顿后那个可怕的数字。这是一个不言自明的规矩：如果米妈妈（Mami）数到\
  \ *tres*（三），一切就结束了。\n\n直到那天晚上，五岁的玛丽娜拆穿了妈妈的底牌。那是睡觉时间，我们本该去刷牙却在楼梯上玩。妈妈站在楼梯平台，双臂交叉，戴着黄色的洗碗手套。“*Dos!*（二！）”她大喊道。\n\
  \n“玛丽娜！”我叫道，“我们得走了！”\n\n玛丽娜嗤以鼻：“迈克尔，没事的，她不会做任何事的。”玛丽娜抓住我的手腕，把我拉了回来。\n\n我试图甩开她。“走吧！”\n\
  \n“但是，迈克尔！她最能做些什么？”\n\n我完全不知道，而且我想保持这种无知。\n\n“你想想，”玛丽娜低声说，“她是我们妈妈！她不会伤害我们的。”\n\n\
  事实到*目前为止*被证明是正确的——但总会有第一次。\n\n“看，看着，我给你看！”玛丽娜说。她转过身直视妈妈。\n\n“*Tres!*（三！）”我们妈妈喊道。\n\
  \n“*Cuatro, cinco, seis!*（四、五、六！）”玛丽娜回击道，“*Siete, ocho, nueve, diez!*（七、八、九、十！）”\n\
  \n大家都愣住了。时间凝固了。\n\n最后，我们妈妈大笑了起来。“好吧，”她擦着眼泪说，“好景不长久了。”\n\n除了那个老旧的数数技巧，我们的父母对我们每个人采用不同的教养方式。差异之大，我们简直就像是在两个不同的家庭长大的。*我的*父母认为学业高于一切。*玛丽娜的*父母认为情商是终极特质。我因为擅长数学而受推崇，而玛丽娜因善良而受到赞誉。我倾向于技术——一种典型的男性化追求——而我姐姐对此几乎毫无兴趣。她绝对没有分享我对\
  \ Apple 任何及一切物的热爱。\n\n*** 我对 Apple 品牌的渴望在我十岁时达到了顶峰，那是 2007 年 1 月 9 日，史蒂夫·乔布斯发布第一代\
  \ iPhone 的那天。\n\n“看！发生了发生了！”我拉着妈妈的手，从沙发站走到旧的戴尔电脑前，在 YouTube 上观看这一重大的时刻。“iPhone 发布了！”\n\
  \n我妈妈咯笑了一下摇了摇头。我爸爸插话道：“Apple 产品太不切实际了——和什么都不兼容！你真的想要*那个*吗？”\n\n我用力点头。*是的，是的，是的！*我简直无法按制自己。\n\
  \n我爸爸困惑地看着我。“你十岁了——你甚至收到邮件了吗？”\n\n我妈妈的摩托罗拉 Razr 和我爸爸的诺基亚手机对我毫无吸引。我是铁骨的 Apple 粉。\n\
  \n“你今年夏天就要十一岁了，”妈妈说，“也许你的 *tíos*（舅舅/叔叔们）会在你的生日礼物上分一份力。”\n\n谢天谢地，有很多 *tíos*，我立刻给他们所有人打电话——Kike、Mario、Carlos\
  \ 和 Miguel——提前告诉他们我的生日愿望。\n\n我的舅叔们没有让人失望。iPhone 上市四天后，我从 Apple 商店飘着走出来，胳膊上挂着一个不透明的白色塑料袋。里面是我曾经拥有过的最昂贵的物品。\n\
  \n我的父母把手机加入了家庭套餐，所以我有了网络服务，但在那时，iPhone 非常基础——只是一个可以通过它访问网页浏览器、相机、电子邮件、音乐、日历和几个预装应用程序的触摸屏。你一次只能给一个人发信息，但我没有带手机的朋友可以短信，也没有人真的用电子邮件。尽管如此，这个小设备极具魔力，让人上瘾。\n\
  \n# 第 2 章\n\n## 企鹅低语者\n\n2007 年秋季，我在贝伦耶稣会学校（Belen Jesuit）开始读中学，那是一所妈妈一直梦想着让我入读的私立男校，涵盖\
  \ 6-12 年级。意识到这是一个走出外壳的机会，我决定（尽管结果不尽人意）尝试变得社交。\n\n不再是小学时那个被别人抄作业的同学，我变成了那个第一节迟到、并在别人对老师开玩笑时一起大笑的人。这并没有让我变得受欢迎，但我认为这比以前那个安静的自己要好得多。而且由于我发现了一款极度上瘾的名为\
  \ `Club Penguin` 的游戏，这足够了。`Club Penguin` 给了我更广阔的社交生活。游戏的世界是无限的，之外没有任何东西能提供同样的兴奋。我在网上有数不完的朋友，所以现实生活中只有几个朋友并不重要。没有新\
  \ iPhone，我从没法睡觉——好吧，我当时抱着一只毛毛企鹅睡觉。\n\n\n\n\n\n我最喜欢的去处之一是一个名为 `The Army of Club Penguin`\
  \ 的 WordPress 博客。`ACP` 是——做好准备迎接这种奇怪的事情吧——一个为虚拟企鹅账号设计的军事主题招募页面。一群穿着相同衣服的小企鹅头像会同时登录\
  \ `Club Penguin`，并排队行走，一遍又一遍地唱着：“企鹅军队！”就像在现实军队一样，这些头像被赋予了不同的军衔：士兵、中士、中尉和上尉。不同的企鹅军队之间会发生战争。成千上万的孩子参与其中，在不受监管的聊天空间里交流，那里是说脏话的。\n\
  \n但在当时，并没有所谓的“App”这种东西。\n\n* *\n\n2009 年我十三岁生日前的夏天，我妈妈送我去秘鲁和我的 `tío` Kike 住了三个月。那时，我正运营着自己的\
  \ WordPress 博客，分享关于 `Club Penguin` 的更新、指南和攻略。我非常痴迷于这款游戏。唯一的问题是没人访问它，所以我会坐在电脑前刷新页面好几个小时，试图增加浏览量。这并不起作用。我为自己的网站制作的\
  \ YouTube 广告——那些发到 YouTube 并链接回我 `Club Penguin` 博客的“广告”——也行不通。我知道我需要想另一个办法来让我的 `Club\
  \ Penguin` 博客成功。\n\n一年前，苹果公司宣布了 iPhone 的新功能——`App Store`。现在人们可以在 iPhone 上构建 App\
  \ 并通过商店发布它们。在推出 `App Store` 时，史蒂夫·乔布斯曾说过任何人都可以制作 App 并出售。我当时并没有怎么考虑这个公告。但现在，在叔叔家里有充足的时间思考，我意识到我可以制作一个移动\
  \ App 来推广我的 `Club Penguin` 博客！游戏本身还无法在手机上玩，我想这就是我抓住 `App Store` 中所有关于 `Club Penguin`\
  \ 搜索的机会。这将成为我在 `Club Penguin` 世界中立足的方式，分享那些在 `Club Penguin` 粉丝网站上流行的技巧，包括我自己推出的那些。我完全不知道如何制作\
  \ App，但如果史蒂夫·乔布斯说很简单，那么我就要设法学会。我开始 Google 搜索。\n\n到 1 月底底，我有了一个可以运行的 App，感觉它很有价值。在将其提交到\
  \ `App Store` 之前，我必须购买开发者许可证，费用是 `$100`。于是，我找了我的父母，尽管那时情况已经糟糕糟糕，他们已经没有能力帮我。我妈妈知道我一直在为我的创作努力，但我父母双方都无法真正理解我在做什么。在他们看来，我似乎整天都在玩耍。对我来说，感觉其实也是这样。但我妈妈能看出这个项目对我有多重要，当我向她解释我将对每次下载收取\
  \ `$1.99` 时，她让步了。“如果你把钱还给我，没关系，”她说，“但如果你还不起，你就得在餐厅洗碗子，因为我现在没钱花那笔钱。”她补充道：“No se lo\
  \ digas a tu papá”（“别告诉你你爸”）。\n\n我点点头。“我不会告诉他的，妈妈。”\n\n`Club Penguin` 很容易访问，而且它履行了所承诺的内容：一份详尽的游戏指南、关于\
  \ `Club Penguin` 最新变化的新闻更新，以及一个内置的聊天室，让用户随时随地交流。我自豪地交出了我的 `$100` 并提交到了 `App Store`。然后我开始了等待。几天后，我收到了苹果的一封邮件，说我被拒绝了。邮件说我为图标上传的两个图像——一张有一只小企鹅，另一张是\
  \ `Club Penguin` 的标志——不匹配；小图标和大图标必须显示相同的图像。我修改了图标，让它们都显示一只企鹅，然后重新发送了。2010 年 3 月\
  \ 2 日，我的第一个 App 在 `App Store` 上线了。我的父母为我感到高兴，尽管他们完全不知道这这意味着什么。\n\n我一直在自学 `iTunes\
  \ Connect`，这是一个查看销售额和跟踪 App 指标的在线门户。在 App 上线的线一天，我每小时检查一次，看是否有任何下载。我没有看到任何下载，但我不知道下载销售数据是第二天计算的，而不是实时的。我产生了一种预感，觉得我的\
  \ App 要完蛋了。\n\n但我不会不战而死。我向 `Club Penguin` 博客社区的朋友们提了一个建议：“如果你在你们的网站上为我的 App 广告，我会在我的\
  \ App 上为你们的网站放广告，”我写道。然后我发给他们供孩子们点击下载 App 的横幅。这确实引起了一些热度。\n\n这一切对我来说都是如此新奇。当我第二天查看\
  \ `iTunes Connect` 看到两列两行信息时，我以为有两个个人买了我的 App：我妈妈和我爸爸。事实证明，那两行代表两个国家，美国和加拿大，在每一列的末尾，列出了这些国家的下载数量。第一天，有\
  \ 52 次下载，每份 `$1.99`，这为我赚了超过 `$100`。在上线的第二天，我的 App 在工具类中排名第 7。我跑回父母那里，大喊道：“Papi,\
  \ mira! Mi aplicación! Está en el puesto siete! 我的 App 在工具类中排名第七！”\n\n我妈妈看着我说：“太棒了。”\n\
  \n每天我都会检查销售情况，看着我的 App 从 50 次下载增加到 80 次。到第一个周末，我的 App 每天获得一百次下载，每天赚入 `$200`。当我告诉我的科学老师时，他吹了口哨说：“那比我赚得多。”\n\
  \n\n\n\n\n“嗯，我开发了这个应用……”我局促地开口，给他们了一段乱七八糟的描述。当时我留着意外的贾斯汀·比伯式发型，这简直尴尬得要命，我蜷缩着身体，试图遮住我十三岁肉乎乎的身体。我并不觉得自己做了什么了不起的事。当主持人问出最后一个问题：“你还有什么想说的吗？”时，我思考了几个秒钟。“如果还有其他孩子想学习如何制作应用，”我说，“可以在\
  \ Facebook 或 Twitter 上给我发消息，我可以把链接发给你们。”\n\n我一离开 CNN 办公室大楼，我的手机就开始疯狂响动。我在 Twitter\
  \ 和 Facebook 上收到了四千条请求，我的父母也开始接到了来自世界各地的电话。人们想在澳大利亚、秘鲁和哥伦比亚采访我。在一个周内，我们家里到处都是摄像头，我妈妈在电话里接听各种采访请求。那以后，采访成了我们生活的常态。每隔一个月左右，就会有一个新闻小组把我们的客厅变成电视演播现场，或者我去一家电视台的制播室接受另一次采访。问题总是那几个，顺序也一样：“你多大了？是什么让你决定制作应用的？你是怎么学会这些的？你赚了多少钱？你用收入贴养家里人是真的吗？”\n\
  \n起初，我会直接告诉记者我每个月赚 10,000 美元，有时更多。过了一段时间后，我厌烦了这个问题，学会了用这句话来躲避：“比我想象的要多得多！”\n\n谈到贴养父母的问题时，我会点头，露出微笑。虽然我妈妈讨厌家乡的老人们不断听闻我在贴养这个家，但我清楚我无法回避这个问题。我作为家庭顶梁柱的角色，是让拉丁美观众对我的故事充满希望的原因之一。许多拉丁美洲的父母希望孩子将来有一天能够分担整个家庭的开销。在拉丁美文化中，家庭单位非常重要，我的父母确保将这种信念根植在我心中。这也是记者想和我交谈的主要原因之一。但这并没有让这种感觉变得不那么诡异或不舒服。在这么小的年纪就要养活父母简直令人晕眩，这极其深刻地重塑了我和父母的关系。在维持他们生活的同时，想要拥有正常的童年是不可能的。但最重要的是，我很兴奋自己有一个平台能让其他孩子知道我发现的惊人秘密：存在这样一个地方，孩子们可以凭空创造出他们喜欢的东西并赚到真正的钱。我想让所有同龄的人都知道，如果他们曾想过尝试编程，但觉得太难或自己不够聪明，他们应该重新考虑一下。\n\
  \n“准备好，玛丽娜，”我妈妈会说，“他们可能也想让你上电视！”但我姐姐并不能对我在电视镜头前表演的兴奋感产生共鸣。每当新闻小组来到家里，她就会和朋友一起把自己锁在房间里。小组出现得越频繁，玛丽娜似乎就离我越远。我并不是我有时间去担心这些。我主要的顾虑是，*我接下来需要做什么才能让这一切持续下去？*\
  \ 因为*这种可能性*似乎就在这里，而不是在学校。在学校里，唯一重要的是我能记住多少知识点（并不多，我的成绩单证明了这一点）。那里没有人在意我实际上*创造*了什么。但在贝伦学校的围墙之外，我觉得自己可以通过编程表达真实的自我。我投入应用中的能量会以最令人兴奋和最有成就感的方式回馈给我。\n\
  \n我决定开发另一个应用。这一次，它将是一个*真正的*游戏——当然，是基于企鹅岛的。\n\n一个真正的游戏需要比我目前学过的更高级的编程。我买了一台台式 Mac，开始钻研\
  \ YouTube 上关于如何创建一个跳跃游戏的教程，就是那种通过左右倾斜手机让角色跳跃的游戏。有一个很流行的叫 `Doodle Jump`。我想看看自己是否能构建出一个具有类似机制的游戏会是一个有趣的挑战，配有企鹅岛角色在小平台上跳上跳下的插画，让他们在企鹅岛的世界里越爬越高。在经历了数百小时的尝试和错误后，我完成了它。\n\
  \n这一次的申请过程快得多：我提交了应用，它通过了 `Apple` 的审核，并迅速在排行榜上攀升。第一天，它卖出了五百份，单次下载价格为 2.99 美元。而且销量并没有停过。\n\
  \n但我生活的其他部分并不那么顺利。我花午餐时间抄写同学的作业，所以我从没机会吃午饭，放学后总是饥肠辘辘。每天我都会要求妈妈带麦当劳回来，尽管我从未真正说出“你能帮我买麦当劳吗？”，因为我觉得很羞耻。我知道那些食物对身体不好。在潜意识里，我知道我们负担不起，我应该只吃餐馆里的食物。于是我和妈妈之间达成了一种仪式：我会说“我超级饿了”，她会回答“那你想吃点什么？”继续这种戏法，我会回答：“我不知道。你能给我带点什么？”然后，在她列出一堆菜单后，我会说：“不，我并不想要那个。”最后，我疲惫且工作过度的妈妈会摊开双手。“那吃麦当劳怎么样？”她说。“好吧，可以，麦当劳，”我嘟囔着。很快，我成了一个彻底的成瘾者，每天吃两次鸡肉卷饼和大份薯条。\n\
  \n至少在短期内，那些快餐里的化学物质帮助我遗忘了我不断下滑的成绩和不断攀升的体重。\n\n***\n\n***\n\n2010 年 5 月，银行正威胁要收回我们的房子，我的父母已经失去了所有的租赁房产，只剩下一间——那是位于我们家附近社区里的一间小联排别墅。此外，他们的信用卡几乎刷满了，无法应付还款。电话公司威胁要切断我们的服务。餐厅经营不善。最糟糕的是，我妈妈说话时眼睛不再闪烁了，我父亲已经几个月没开过他的那些冷笑话了；每天晚上他工作回家，直接直奔他的扶手椅，忧郁地盯着电视。这似乎并不公平。正当我获得意外之财时，我的父母却发现自己陷入了深层困境。\n\
  \n几个月后，我学校的一位行政人员把我叫到办公室，告知我欠了学费。我回到家里质问我的妈妈，她告诉我她从我在 `App Store` 获得的资金中提取了一笔应急资金。我从未见过那一分钱，因为所有的钱都直接进入了父母管理的账户。“支付餐厅员工工资是必要的，”她说，“上个月比任何时候都糟糕，但很快就会好起来的。”她语气中的忧虑并非如此。\n\
  \n不久，我绝望的妈妈开始每月用我的钱支付两次员工工资，只为了让店继续营业。服务员们一定知道这一点。在过去我来餐厅时他们大多无视我，现在他们会特意询问我的应用进展得如何——我想，他们是在试图弄清楚妈妈还能给他们工资多久。\n\
  \n\n\n我想当一个好儿子。而且，我并不需要那么多钱。十三岁的时候，我唯一想要的不过是一台新的 iPhone 或一台 Xbox，但也仅此而已了。我确实不需要每个月花\
  \ `$10,000`，不幸的是，我从未被教导过为未来储蓄的重要性。每当我妈妈向我要钱时，我都会说：“不用借，直接拿去吧。”\n\n这是一个大错错。我的父母显然对向我要钱感到不安，他们最终还是听了我的话，在需要的时候自己提取了他们需要的金额。\n\
  \n虽然起初我不介意分享我的钱，但让我心烦的是，我的父母想要兼得两者：我可能是家庭的经济支柱，但我仍然被当成孩子对待，被要求遵守他们的规则。现在，当我妈妈试图像任何一个典型的父母那样管教我时，我觉得这无法忍受。\n\
  \n“嘿，迈克尔，”一天晚上，我妈妈生生地推开我的卧室门说，“已经过了午夜了，你一整天都坐在电脑前。你还没刷牙，也没洗澡。作业写了吗？”\n\n我冒了一火，身体更低地伏在键盘上，眼睛没有离开屏幕，屏幕上我为\
  \ `Club Penguin Game` 编写一个新更新。“妈妈，你不懂。我在做我该做的事，好吗？一切都好。”\n\n但一切并不好。在经历了两个月并赚了 `$24,000`\
  \ 的利润后，我的 App 销量急剧下降。这部分是因为市场环境的变化：`App Store` 不再是一个随心所欲的乐场，像我这样的一少数流氓玩家可以通过以 `$2.99`\
  \ 到 `$4.99` 卖游戏来大赚一笔。现在，那里充斥着通过内购盈利的免费游戏，向玩家收取配件费用或购买新皮肤和虚拟货币令牌的费用。我开始意识到，大多数 App\
  \ 的寿命都很短；随着时间的推移，人们使用它们越来越少。\n\n“好吧，这样，”我妈妈说。我能感觉到她在试图放弃。但她总是做不到。“只是……如果你的成绩变差，你就上不上任何大学了。如果你的\
  \ App 永远无法运行怎么办？到时候我们该怎么办？”\n\n我转头盯着她。我已经没有精力去安抚我的妈妈了，而且我对成绩从 A、B 掉到 C、D 这一事实感到非常反叛。“谁在乎作业啊？”我咬牙切齿道，“你说过车还款逾期了，对吧？就让我做我的工作吧！”\n\
  \n开发 App 原本是种放松的享受。然而，无论生活压力有多大，当我构建某些东西时，我会忘记自己的问题，感到平静和专注。其他一切都消失了。但现在，由于我的 App\
  \ 是拯救房子免于被抵押的唯一手段，情况完全不同了。\n\n增加压力的还有我在 `Latin America`日益增长的名声。这主要归功于几十位采访过我的大人物，包括\
  \ `Jorge Ramos` 和 `Don Francisco`，他在迈阿密拍有一档名为 `Don Francisco Presenta` 的大型节目。`Don\
  \ Francisco` 基本上是拉丁美洲的奥普拉，他竟然采访过*我*。我怎么可能值得他的时间。我仍然无法相信，更不用说随之而来的所有关注了。拉丁美洲主流报上有我的专题报道，秘鲁周日晚新闻节目里有一个关于我的长小时故事，还有与晨间节目和深夜谈口节目主持人的一系列视频采访。\n\
  \n作为负责接所有媒体电话的人，我妈妈总是处于焦虑状态。也许她认为宣传对 App 销量有好处，想尽可能安排我参加节目——但她生活在对接听电话的恐惧中。“我永远不知道是想采访你的人还是讨债的！”她挥着双手喊道。\n\
  \n西班牙语电视节目的记者在学校里跟踪我观察我的生活这已已常常便饭。在拉丁美洲看到视频的孩子们给我的 `Facebook` 页面疯狂留言，告诉我我的成就给他们带来了多少启发。但在学校里，这种奇怪的名声把我孤立了。没有人甚至再叫我的名字了。“当我带着另一群人无精打采走在校园时，他们会喊：“那个\
  \ App 孩来了！”有些孩子试图通过和我一起跳镜头来获得那十五秒的成名时刻；其他人则避而远之，可能不想惹麻烦。\n\n在某种程度上，我和我的同学并没有什么区别。我们*都是*\
  \ App 孩。你知道在电影里，孩子们总是在学校走廊里聊天吗？还有午餐时在食堂里八卦、大声打招呼？当学校有了 `iPads` 后，这种情况就不会发生了。午餐时间，`Belen`\
  \ 的孩子们排在走廊里，坐在地板上，低头看着屏幕。朋友们聚在一起，每个人都在玩自己的游戏。\n\n在 `Belen`，学生们几乎不使用书包或储物柜，大部分只有\
  \ `iPads`。学生本应该用它们来考试、做作业和记笔记。但由于老师们不知道这些新玩意儿怎么用，学生们完全可以着他们转。\n\n\n\n\n最终，我在贝伦确实交了几个现实中的朋友。关系最好的是一个叫卢卡斯的古巴男孩，他和我一样痴迷科技和苹果，而且尽管我满脑子只有这些，他似乎很喜欢我。每当苹果发布发布会，卢卡斯就会来我家用我的\
  \ `iPhone` 一起看。每当有新手机上市，我们就会在商店门口守着，好我买它。拥有最新的 `iPhone` 是测试我的 `apps` 的关键。虽然我无法动用赚来的钱——而且完全不知道父母花掉了其中的多少——但我妈妈总能想办法凑齐资金。\n\
  \n卢卡斯非常有条理，成绩也非常优异。他一回到家就开始做作业，累了就睡觉。而我呢，在学校里简直是个彻底的灾难——因为每晚写 `apps` 写到凌晨三点，我总是压力巨大且睡眠不足。\n\
  \n我们来自类似的工人阶级家庭，在自己的方式上都是进取者，但有时卢卡斯和我因为为人出头的方法不同而发生冲突。我第一次问能不能抄抄他的作业时，卢卡斯果决地拒绝了。\n\
  \n“为什么不呢？”我恳求道。\n\n他回答得很有理：“因为我为这付出了努力，而你没有。所以我为什么要让你抄呢？”那以后，我再也没有要求过抄他的作业。\n\n\
  有时我能感觉到我们之间存在着一种更微妙的隔阂：对于卢卡斯的一生，他一直被告诉只要成绩好、在学校表现出色就能获得成功；然而，在他身边最好的朋友（我）却被从所有的荣誉班中退课，甚至还因为抄作业被停学过一次——却依然赚得盆满。\n\
  \n因为卢卡斯是我的好朋友，而我是“应用少年”，学校里的人就认为他是在坐我的便车。这完全不是事实，但尽管如此，他们开始叫他为我的“影子”或“迈克尔二号”。我没有像本该那样关注这些嘲弄。我本该为卢卡斯说公道的，但我只是把这一切都屏蔽掉了，太专注于我的下一个作品了。每当我们聚在一起时，我就会没完没了地抱怨让我的\
  \ `apps` 稳留在榜单顶部有多压力。或者我的父母是如何用我最后的一千美元来付账单的。卢卡斯也有自己的烦恼，这一点没有没有进入我的脑海。奇迹的是，他一直忍受着我。\n\
  \n有一次，我请卢卡斯接受一个电视节目的采访。他很害羞，但似乎真的很想做，而看到他兴奋我很激动。节目播放那个晚上，他和其他家人都围在电视机旁，期待着看到他的脸出现在屏幕上。但他们没多久就发现，制作人从节目中删掉了他的采访部分。第二天，他在学校里走向我说：“嘿，你看到那个片段了吗？”\n\
  \n我说：“没看，我讨厌在电视上看自己。”我从不看自己；我受不了我自己的样子。\n\n“嗯，他们把我剪掉了，”卢卡斯说。\n\n“哈，”我回答道，“不可能吧。太奇怪了。”\n\
  \n那天晚些我问了妈妈这件事，看看她是否能帮我分析原因。“也许他们剪掉他是因为他的西班牙语不太？”她建议道。回想起来，我希望我曾告诉卢卡斯，我对他被节目剪掉感到很抱歉。我希望我曾告诉他我很感激他的时间和友谊。有时我在想，如果我当时那样做了，我们今天是否还会是朋友。\n\
  \n***\n\n成为“应用少年”给了我一个掩护，让我避开许多普通青少年应该想要做的事情，比如派对和约会。作为年级里最小的孩子，在约会方面我确实落后了。此外，我告诉自己，我有其他更有趣的事情要做。我有我的\
  \ `apps`。尽管我妈妈试图为我做媒合，但我从未对女孩想过太多。多年来，她一直试图说服我，说我对幼儿园班里一个叫索菲亚（Sofia）的漂亮女孩怀有终生不渝的暗恋。每当我们看我小学时期生日派对的老视频，我妈妈都会说：“噢，那是`索菲亚`，那个你一直爱的女孩！她现在过得怎么样？你还在想她吗？”事实是，我从未想过索菲亚，但和妈妈在一起总比违抗她容易得多，所以我只是耸耸肩，咕哝一句：“当然，偶尔会，”然后转移话题。\n\
  \n我妈妈迫不及待地等我和妹妹长大给她生孙子。每当全家人去我们最喜欢的古巴餐厅 `La Carreta` 吃晚餐时，她就会提到她有多期待有一天能和我们以及她未来的孙辈们一起在那里用餐。她想念在秘鲁的家人，想在这里重现童年时期那种盛大、热闹的聚餐。我也很想要。\n\
  \n在那些 `La Carreta` 的夜晚之一，我妈妈随口道：“我无法想象如果生了一个同性恋的孩子还不给我生孙子会什么样！”她迅速补充道：“我对同性恋人没意见。人人有异。但是，米奇，你能想象吗如果有一天，迈克尔带人回家里见我们，结果说的不是‘妈妈，爸爸，这是珍妮’，而是‘妈妈，爸爸，这是詹姆斯’？”我爸爸假装犯了小心脏病，我们都大笑了起来。\n\
  \n“别担心，妈妈，爸爸，”我说，“我想让你们有孙子的。”\n\n\n\n我对八年级体能测试的失败感到特别难受，因为我开始非常在意同学的看法了。他们开始和女孩子约会，而我正被落在后面。于是我是怎么做的？我编造了一个女朋友。由于我读的是男校，这看起来似乎是可行的。但到了某个时刻，学校舞会临近了，每个人都一直问：“你会带她去吗？”我告诉他们我不带，而且我很伤心，因为我的女朋友要搬到俄克拉荷马州。（别问我为什么是俄克拉荷马州，那只是脱口而出。）\n\
  \n我在中学时期确实参加过一次舞会。那是八年级的毕业舞会，我和我姐姐的朋友 `Julia` 一起去的，她是个厄瓜多尔人，而且喜欢我。至少根据我姐姐这个红娘的说法是这样的。我妈妈对这次约会欣喜若狂，她甚至给我买了一朵胸花送给\
  \ `Julia`。我记得把花别在她的裙子上，心里想：*也许这就是我对女孩产生兴趣的开始。*\n\n我妈妈开车送我们去舞会，我姐姐坐在前座。`Mariana`\
  \ 靠在窗边，垂头丧气，因为她想去，但在我学校里找不到男生可以带她。我本很愿意和她交换位置，留家里写代码。但我还是做了我应该做的事，护着 `Julia` 进入了健身馆，那里装饰满了气球和灯串。老师们摆了水果果汁，并清空了看台为学生们腾出空间，他们三群成群地聚在一起。Soulja\
  \ Boy 的歌曲《Crank That》在扬声器里轰鸣着。云：“*Watch me lean then watch me rock / Superman dat\
  \ hoe / Yeah watch me crank dat Robocop.*” `Julia` 和我跳了那种只要听到这首歌就得跳的舞，然后我们来到健身馆的角，喝着水果果汁，又跳了一些尴尬的舞。这时，我姐姐的另一个朋友走过来开始和我们一起跳舞。她是一个超级高女孩，比\
  \ `Julia` 和我都高得多。突然，她用一只手抓住我的头，另一只手抓住 `Julia` 的头，说：“噢该死的，快亲吧，”然后把我们的脸撞在一起。那是我的第一个吻。\n\
  \n我后来发现是我姐姐指使那个高个女孩的。“迈克尔不计代价需要一个女朋友，”她说，“你一定要让他亲她。”这在某种程度上起作用了——至少对 `Julia` 来说是这样。之后她发了几次信息，邀请我去商场。我们去了几次。她总是想牵手，我就配合她。但我整个过程都觉得非常尴尬。也许我根本不是那种谈感情的类型。*去他的吧，*我想道，*我要回去搞我的\
  \ App 了。*\n\n# 第四章\n\n# 压力测试\n\n到我上九级时，我和妈妈每晚上都会为了钱争吵——她从我这里拿走的几万美元，她需要支付最新债权人的几千美元，还有我需要升级电脑但如果她和我爸拿走我的下一张苹果支票就买不到的钱……\n\
  \n“迈克尔，别再让你妈妈哭了！”我爸爸在一个晚上爆发了，闯进厨房里那场特别激烈的争吵中。\n\n“为什么*我*是坏人？”我反驳道，“我把一切都给了这个家！”\n\
  \n“哈！”我爸爸大声吼，“你——你只是个自私的混蛋！”\n\n这些话像拳头一样击中了我，但当我冲上楼时，我妈妈似乎几乎没有察觉。\n\n第二天是周六，我妈妈敲了我的房门。我想从她踮着脚走进去的样子来看，她是想缓和一下关系。“爸爸并没有他看起来那么生气，”她说，一边从我地板上捡起一件脏兮兮的\
  \ T 恤丢进脏衣篓里。\n\n我点了点头。“我知道。我只是讨厌他起我坏名。”几乎在所有时候，我爸爸都是一个安静又体贴的人。但他成长过程中受了很多苦。年轻时失去兄弟对他可能产生了极其深远的影响，但他从小受到的教育是，做男人意味着要克制自己的情绪。即使在今天，他也几乎不谈论过去，尤其是关于他几乎被家族断绝关系的过去。这一切都被他积压在心里，在里面不断堆积、堆积，直到他会直接爆发——就像压力锅上的泄压阀。\n\
  \n“嗯，”妈妈说，“你知道什么能帮到他，对吧？”\n\n“什么？”我问，心中升起了一丝希望。我从未认为过我能做*任何*事情。\n\n“问问他想不想去看电影。你知道他喜欢看电影的！”妈妈建议道。说完，她转转身离开了我的房间。\n\
  \n我盯着她的背影，再次陷入了困惑。这解决不了任何问题，也没有回答我脑海中的疑问。我只是不懂：没错，我是一个青少年。我经常发脾气。但我真的是那么一个坏儿子吗？\n\
  \n但爸爸的情绪很快就会转变。“看电影吗，Cocolocho？”周六对我发火一小时后，他探进我的房间提议道。\n\n他对我的绰号，一个从未解释过的毫无意义的爱称。*这*才是我\
  \ 90%时间遇到的爸爸，那个喜欢保持气氛轻松、甚至是肤浅的人。他站在我的窗外看着我们安静的郊区街道。从他肩膀耷，我知道他很痛苦。行吧；我会努力成为他需要的好儿子。\n\
  \n* *\n\n有一天，我打电话给秘鲁的 Tío Kike，请教关于如何处理我们的财务困扰。在财务方面，Tío Kike 和我父母处于两个极端。作为一个严谨的储蓄者，他每个月都能从微薄的薪水中攒下足够的钱，积累了一笔舒适的养老金。我爸爸总是开玩笑说舅舅有多吝啬，但我觉得他用那么少的钱过上如此美好的生活简直是个天才。“最好的办法就是不要再给他们钱了，”我舅舅在电话里建议我，“如果你给他们更多，他们只会把它花掉。尝试用其他方式帮助他们。没人教过他们如何用钱，所以你应该教教他们。”\n\
  \n\n\n\n我叔叔说得对。我父母在财务方面甚至比我还要不精明。他们完全不知道什么是储蓄，把信用卡看作是以后某个时候可以还掉的免费钱——最好是永远不用。尽管如此，我当时正值叛逆期，脑子里还想着成千上万别的事情，显然完全没有准备好去教我父母如何预算和储蓄。我必须用我自己的方式开始反抗我的父母了。\n\
  \n第一次尝试时，我妈妈刚从学校接我。她开车进家里的车道，熄了引擎，在那里呆坐了一会儿，紧紧抓着方向盘。最后，她转过我说：“当你拿到下一张 `Apple` 的支票时，我们就把那笔钱全部用来存买房子。”然后她放声大哭，抽泣道：“我不想失去这栋房子，迈克尔！”\n\
  \n我讨厌妈妈哭。这总让我也想跟着哭。通常情况下，我会为了让她停止哭泣而顺从。但这太疯了。据说是，我妈妈这一年来一直在用我的钱来付房贷，而且根本没有起作用。也许这栋房子对我们来说太贵了。必须发生一些改变。\n\
  \n我咬住舌头，让自己分散对眼眶里泛出的泪水的注意力。然后我抓住她的手，尽力坚定地说：“妈妈，你需要找别的办法来——”\n\n她甚至没让我说完。等我再次反应过来时，她已经冲进了屋，砰地一声关上了大门。\n\
  \n几天后当我再次提起这个问题时，我妈妈不敢看我的眼睛。“我会还给你的，我保证，”她只会说这句话。\n\n“我不在乎你是否还我，”我试着道，“我们可以忘记你花掉的所有钱。我只想确保从现在起你学会如何更好地管理金钱，这样我们再也不用陷入这种境地了。”\n\
  \n但教妈妈钓鱼是不可能的。尽管她从没有出面承认，但我知道她还是擅自用了我银行账户里的钱。这让我比我愿意对自己承认的更加愤怒。\n\n在接下来的几个月里，我一直试图帮助他们理清财务状况。我提议帮我妈妈，通过列出家里所有的支出和收入来让她理解自己可以花多少钱。她对我的要求感到非常不耐烦。最后，我几乎停止了和家人说话。放学后，我会从储藏室里拿一大把零食，直接回到房间里沉默地工作。有时我会听到父母在走廊尽头的房间里低语：“他吃得太多了。他变胖了。他变得越来越愤怒、越来越没礼了。”在高中的头两年里，我确实不是一个最让人好相处的人。但我从未听他们私下谈论过让我承担债务时把我置于了什么样的境地。这只会让我更加愤怒，也更加饥饿。\n\
  \n* * *\n\n我和妈妈的关系在 2012 年 6 月缓和了，那是我高二结束的时候。那时她陪我去了玻利维亚的圣塔克鲁斯，参加一个关于我 App 的媒体采访。这次行程由一个我称之为\
  \ `Maria Carmen` 的女性组织，她是玻利维亚一家主要电视网的名气口秀主持人。`Maria Carmen` 在我十二岁时曾在迈阿密采访过我，她认为玻利维亚人已经准备好接受后续报道了。“你还在通过你的\
  \ App 帮助养养家庭吗？”当她联系我时这样问道。我不情情愿地说是，`Maria Carmen` 立即安排了这次行程。她野心勃勃的计划是我对她网下的不同电视节目进行一系列采访，在会议上演讲，并最后在她节目中进行一次深度访谈作为旅行的结束，那个节目就像是玻利维亚版的\
  \ `E! News`。\n\n当我们迟了六小时到达那个小小的圣塔克鲁斯机场时，`Maria Carmen` 正在等我和我妈妈。她留着标志性的深红褐色波直长发，光滑的古铜色皮肤，穿着那件华丽闪烁的红色裙子，一眼就能认出来。\n\
  \n我感到头痛欲裂，感觉头骨像被老虎钳住了一样。但尽管如此，我还是强自己给 `Maria Carmen` 露出微笑。我精疲力竭的妈妈也神光溢溢。她是一个快速切换情绪的大师，这种技能显然是我遗传的。\n\
  \n“欢迎回到玻利维亚，迈克尔·赛伊曼！”`Maria Carmen` 用她那大胆而又和的主持声音说道，带着一抹洁白的、电视式的微笑向我们走来。她搬起自己的设备，在助理忙着麦克风时，熟练地布置好拍摄角度。\n\
  \n“*Gracias*，”我回答道。我从国内对拉丁美媒体的采访中了解到，玻利维亚人和秘鲁人会就我更像玻利维亚人还是秘鲁人发生很有趣的争论。在一次报纸采访中，一位记者甚至问我对于即将到来的两国足球赛是否“左右为难”。“我无法回答那个！”我喊道，“那就像是在问：‘你更爱你妈妈还是你爸爸？！’我真的没有偏爱哪个国家。尽管我在妈妈家里度过的时间长得多，而且对玻利维亚家人并不那么熟悉，但我从未选过边。被双方都爱着是一种荣幸。”\n\
  \n等我反应过来时，`Maria Carmen` 和她的摄像师正领着我走向一群好奇的围观者。`Maria Carmen` 把麦克风伸给中一个和我年纪相仿的女孩。`Maria\
  \ Carmen` 对那个女孩说：“你好！我在这里和迈克尔·赛伊曼在一起，苹果公司的天才少年。看到他出现在圣塔克鲁斯感到惊讶吗？”女孩和她的朋友脸红了，咯咯笑着。“是的，他太棒了，我印象非常深。这是一个很大的启发。”满意的\
  \ `Maria Carmen` 收起麦克风，肩上扛起几包设备，朝出口走去。“*Vámonos!* *Vámonos!*”（走吧！走吧！）她冲着不知所措的妈妈和我喊道。\n\
  \n我们跟着 `Maria Carmen` 和她的摄像师来到她的 SUV 旁，她抓起方向盘，轰响引擎，在一条满是坑洼的土路上飞驰而去。我确信她是超人。“因为你的航班，我们已经错过了一个采访，”她在后座对我和我妈妈说，“但只要我们快点，就能赶上下一个。在那之后，你将成为我们最受欢迎的深夜节目的嘉宾。”当她开车时，`Maria\
  \ Carmen` 口中念着为我准备的采访要点，化着妆，整理发型——只有两次驶入路肩，这看起来简直是奇迹。从我妈妈紧握车门把手的手指和紧绷的笑容，我知道她内心也在恐慌，和我一样。但我们有什么好抱怨的呢？`Maria\
  \ Carmen` 已经在下周日报纸上争取到了几个关于我的头条报道。看起来她让她“苹果公司的天才少年”成为玻利维亚明星的计划可能奏效了。\n\n这些都是好消息，对吧？这一切都是好事。那为什么我感觉如此糟糕呢？噢对了，因为我假装出的那个乐观、大方的孩子完全是个伪君，掩盖了内心那个感到痛苦、被家人怨恨、为跟上自己的创作而精疲力竭的自己。\n\
  \n\n\n\n\n到 2012 年夏天时，我的月收入大约有 12,000 美元。但那份收入并不稳固。我觉得自己就像公开市场上的一只股票，不可控的事件可能让我的价值直冲云霄——也可能同样容易让我再次跌入谷底。这种情况恰恰发生了。到了秋天，在\
  \ App Store 榜单顶端霸占了几个几个月份后，`Club Penguin Game` 跌到了美国和拉丁美洲榜单的底部。我的利润下降到每月不足 1,500\
  \ 美元。我在拉丁美洲做的采访对我的应用销量几乎没有产生任何影响，因为我的大部分收入都来自美国。\n\n现在又出现了一个新问题要处理了：`Disney`。他们在\
  \ 2007 年收购了 `Club Penguin`，起初他们并不在乎像我这样的人正在创建关于他们游戏的程序。现在，当这家巨头公司准备推出他们自己的应用时，情况变了。我收到了来自\
  \ `Apple` 的通知，告知我 `Disney` 之外的所有开发者都需要从商店中下架任何与 `Club Penguin` 相关的应用。我已经开始脑风一些我更感兴趣的、与\
  \ `Club Penguin` 无关的应用构思。于是，我一个接一个地把它们全部下架了。\n\n我妈妈几乎立刻发现了。“发生了什么？”她开始问，“为什么你的应用一直被下架？”\n\
  \n我随口告诉她是我自己把它们撤的。“我必须这样做，”我解释道，“`Apple` 发了通知，说 `Disney` 正在做他们自己的 `Club Penguin`\
  \ 应用。”\n\n她的脸瞬间变成了极度恐慌。“你怎么付钱生活？”她惊呼道，“大学费怎么办？”\n\n我感到一阵热流涌上脖子。“你什么意思，我该怎么付大学费？”\n\
  \n“迈克尔，我告诉过你，我把那些钱用在餐厅了，”她说，“我全花在工资上了！我们只需要坚持下去，直到经济好转，人们开始更多地外出吃饭！”\n\n所以，我距离高中毕业还有一年半，却没有钱付大学费。与此同时，应用市场崩盘了。人们不再愿意为应用付费；他们只把钱花在应用内购买上，那是一个我无所知的新世界。\n\
  \n尽管我妈妈的宣布令我很震惊，但我已经在私下考虑过不上大学的未来了。既然我作为程序员的自学似乎更能让世界印象深刻，我何必要在传统的教育中挣扎多达四年呢？现在我可能没有选择了。我必须适应，让编程变得更出色，提升表现。如果我能制作出一个可以独立存在的免费游戏，也许它会被某公司收购，并顺便把我雇佣。这是通常的运作方式，我从阅读科技行业博客中学到的。这对我来说似乎是一个稳固的备选计划：想出一个无法拒绝的应用，让我直接从高中跳到一份真正的工作。太棒了！但具体是什么呢？\n\
  \n# 第五章\n\n# 四声快门响起\n\n`Draw Something` 是一款无尽回合制游戏，你为朋友画出一个指定的单词让他们猜，然后交换回合。在 2012\
  \ 年，`Draw Something` 是世界上最流行的应用之一；在发布几个月后，它就以 1.83 亿美元的价格卖给了 `Zynga`，以及它的制作工作室 `OMGPOP`。当我产生并丢弃了一个又又一个点子时，我不断地回到\
  \ `Draw Something` 中寻找灵感。我想，*如果我能创造一种全新的猜词游戏，与我们这个年龄段的人喜欢的活动联系起来，比如……嗯。* 除了看电影和逛商场，我们还喜欢做什么呢？\n\
  \n为了有机地解锁一个大型应用开发者尽管经过了研究和市场测试也尚未想到的游戏创意，我开始观察并分析我妹妹和她的朋友是如何使用手机的。她们并不迷恋 `Draw Something`，但她们都喜欢玩一种名为\
  \ `Hay Day` 的游戏，那非常像 `FarmVille`——模拟农场的热门社交游戏。合起来，我妹妹和她的朋友每年在 `Hay Day` 的虚拟币上可能花费数百美元，仅仅为了点击随机按钮的乐趣。我注意到的他们所做的另一件事是互相发图片而不是写文字信息。成年人喜欢拍照来纪念特殊场合或保留记忆，但对于我们这种在设备带有相机和存储功能的环境中长大的孩子来说，照片并没有珍贵。拍照片就像说话或呼吸一样简单。一天，我看到妹妹给一个朋友发一系列她刚拍的照片。“猜猜我心里想的单词是什么？”她写道。正那时，我知道我有我的点子了。\n\
  \n我想做一个多人游戏，第一个玩家会给朋友发送四张照片，朋友必须猜出他们想的单词。例如，如果有人给你发法式薯、纳乔玉米、水牛翅和饼干的照片，你可能会猜单词是“munchies（零食）”。运气好的话，玩家会入迷并用新单词继续玩，互相发送更多照片。\n\
  \n每当我想起创建一个应用时，我都会花几周时间想名字、品牌和设计。品牌是公司想要向目标受众传达的个性和信息。它非常像你的个人风格：当你走向世界时选择穿戴的衣服、首饰和发型。设计更多关于产品的易用性和功能。和\
  \ 2000 年代初几乎所有其他科技设计师一样，我喜欢一种被称为“拟物化”（skeuomorphism）的设计风格。这是数字界面模仿现实世界物体，直到纹理、投影和反射效果。早期的\
  \ `Apple` 产品严重依赖这种风格；它们的开关像真实的旋钮，计算器按钮似乎有斜边，以此此类推。这就是我开始设计我的新想法时使用的风格。\n\n我还没有给它命名，但我知道我想让我的游戏的审美融合\
  \ `Apple` 产品的用心心和尼尔频道节目（如 `iCarly` 和 `Victorious`）的情感吸引力。我下载了那些配乐，戴上耳机，开始在 `PowerPoint`\
  \ 中草拟我游戏的初版本。\n\n在确定我的视觉感觉之前——我能清楚地想象孩子们看着手机屏幕大笑、享受我的游戏并向朋友提起它——我不会进入具体运作的细节。我必须先感受到那种自信的火花。\n\
  \n我达到这一点的方法是通过我在脑海中创建的测试角色来运行我的想法——一个在习惯、性格、年龄、社交群体、经济状况、设备和性别上都多样化的群体。\n\n当我构思我的照片游戏时，我的想象测试角色是一个喜欢看电影的十岁女孩，一个在排练后深夜在\
  \ `iPod Touch` 上玩游戏的剧院少年，以及一群在学校停车场聚会的酷孩子。\n\n\n\n\n接下来，我将我的测试角色放入了各种场景中。我想象了一个“十岁女孩”在电影中途偷看手机，因为她收到了来自游戏的通知。那个通知看起来是什么样子的？她是如何回应的？通知对她毫无兴趣，于是她把手机收了起来。我修改了通知中的文字并重演了那个场景。我想象她她一路冲向大堂去拍照，因为她太沉迷于游戏了，等不及电影结束。然后我问自己，这符合现实吗？她会那样做吗？是什么让她需要那样做呢？\n\
  \n接着，我转向了“戏剧少年”（`Theater Kid`），想象他坐在教室里，无聊无赖地决定在剩下的十五分钟空闲时间玩什么游戏。越过他的肩膀，我试图在脑海中可视化他的主屏幕。我看到首页安装了《部落冲突》（`Clash\
  \ of Clans`），那是一款在线战争游戏，用户在其中建立军队并攻击其他部落的基地。然后，我发现了一个文件夹，里面装有《糖果传奇》（`Candy Crush`）和《愤怒鸟》（`Angry\
  \ Birds`）之类的老游戏，这些游戏他没有删掉，但不再经常玩了。当他滑动应用主屏幕时，我发现了我的游戏。自从昨天安装以来，他还没有打开过。为什么不呢？我能做些什么来确保他打开它？他会觉得这个游戏只需要玩五分钟吗？他会更喜欢玩《部落冲突》吗？为什么或者为什么不？有时候，我的测试角色会非常挑剔，我觉得这非常有帮助。如果“戏剧少年”说他选择《部落冲突》是因为在空闲时间玩起来更容易，我会问：“但*为什么*你觉得它更容易呢？多跟我说一点。”\n\
  \n在经历了几天这种想象中的对话后，我决定是时候起个名字了。由于我的照片游戏是围绕朋友向朋友发送照片构建的，我的第一个名字想法是 `Pics and Friends`（照片与朋友)。我我很喜欢那个名字，以至于花几个小时从测试角色的角度去审视它，甚至让他们互相谈论这个名字。\n\
  \n然后，我必须向几个非虚构的朋友甚至一些我信任的大人征求他们的意见，比如我最喜欢的老师之一，Susan。Susan 负责我们的 `iPad` 项目，她比大多数成人要酷得多，对技术也了解得多。有一天，我看到她从教师休息室出来，我带着过头的精力冲向她，大声喊道：“嘿，Susan！我为正在开发的新游戏起好名字了！”\n\
  \nSusan 转过身，看起来就像我刚刚把她吓了一跳。“噢！你好。太棒了，Michael。你打算叫它什么名字？”\n\n我此时正和她并肩走着。“Pics and\
  \ Friends！”我脱口而出。\n\n在我们继续走动时，她思考了一分钟。我紧张地笑着，焦虑于她的反馈。“*嗯，”Susan 终于说道，“也许你应该再想一个。”心碎。\n\
  \n我进一步逼迫了自己，一周后，`4 Snaps` 这个名字浮现在我的脑海中。*这个感觉不错，*我想道。事实上，我非常喜欢它，以至于我设计了一个 Logo。然后我逼迫自己具体化：*好吧，游戏显然要使用四张照片，*我对自己说。*你要拍四张照片并发送给你的朋友。让我们这样做吧。*\n\
  \n现在我准备好构建我的第一款在线多人手机游戏了。\n\n在此之前，我所有与《企鹅广场》（`Club Penguin`）相关的应用都是为了让单玩家在本地设备上运行的。我意识到，为了协调两个不同用户之间的操作，并保存他们分享的照片，我需要将\
  \ `4 Snaps` 连接到互联网。我问我的好朋友 `Google` 我应该如何做，结果发现我需要将信息存储在手机之外的服务器上。这在今天听起来可能是显而易见的，但对当时的我来说，这是一个巨大的发现。\n\
  \n我能构建服务器吗？我想。我绝对没负担不起钱买一个。我甚至不知道它长什么样。我很快发现有一些小型初创公司创建的新托管服务，每月收取约 100 美元的费用来使用他们的服务器。我不需要亲自接触服务器。我唯一需要担心的就是编写代码。后端服务会为我处理数据：存储在哪里、如何加载、如何解析，以及搜索和排序。简而言之，除了构建我的游戏，它什么都做。我选择了一个名为\
  \ `Parse` 的服务，因为那个网站很漂亮。（嘿，我当时才十六岁。我的大脑就是这样。）\n\n我慢慢学会了如何构建我的第一款在线多人游戏。在花了四个月时间构思并构建出一个营造玩家间往返游戏幻觉的后端设计后，我开始和朋友们测试游戏。当我姐姐说她很喜欢时，我开始相信这个游戏可能会火。我我需要确保它也能赚钱，因此在准备提交到\
  \ `App Store` 之前，我在界面中添加了一些广告横幅。\n\n随着时间的推移，我妈妈变得越来越怀疑了。“你明年就要申请大学了，我们现在真的很困难，”她说，“你为什么要做一个免费游戏？万如果不灵通怎么办？”\n\
  \n我尽力安抚她，解释说一旦游戏流行起来，我会通过广告和应用内购买来赚钱，允许玩家解锁更多单词并获取提示。\n\n\n\n我尴尬地笑了笑。“并不是！”\n\n\
  故事就此一段落了。\n\n窗外是一个美丽而温暖的傍晚。我我想象另一种现实：我正在外面享受着美景，也许在和街区那头的邻居们一起打篮球。我想要那样吗？\n\n不了。我已经很久没有线下和其他孩子们聚会了，我寥寥几个朋友之一的\
  \ `Lucas` 因为厌倦了在我的`apps` 面前当第二，已经和我疏远了。虽然我很擅长分析其他孩子如何利用社交媒体进行社交，但我自己已经很久没有社交过了——额的，除了偶尔坐在姐姐和她的朋友旁边用笔记本电脑，仅仅是为了体验一下周围有人的感觉。此外，尽管我精疲力竭，但我感到几个月来第一次是如此轻松。朋友、学校——这一切都被高估了。所以，我挂了大部分期末考试又怎样？随着我的`apps`越做越成功，上一所好大学，甚至上大学，似乎都变得没那么重要了。尤其是现在，我跨越了一个从未想过能看到的里程碑：从零开始发明并创造了我自己的游戏。现在，我只需要等待\
  \ `Apple` 是否会接受它。\n\n# 第 6 章\n\n## 既然我已经做好了，他们会来吗？\n\n暑假快结束了，正当我准备开始高三生活时，`4 Snaps`\
  \ 终于在 `App Store` 上获得了许可。我没有完成任何暑假阅读作业，也没有买校服——但随便吧。我脑子里有更重要的事情。\n\n我以前从未怎么给我之前的`apps`\
  \ 做过营销——但我从未像现在这样渴望金钱。如果我要实现将 `4 Snaps` 卖给某个公司的目标，这个产品不仅需要优秀，还需要引起巨大的轰动。过去，我总是在\
  \ `Apple` 批准的一刻刻就将我的`apps` 发布到 `App Store`。这一次，我觉得在向公众发布之前，需要先为我的作品造造热度。于是，我设定了一个几周后的发布日期，并开始列出一份我通过对\
  \ `Apple` 和科技新闻的痴迷而关注的科技记者名单。\n\n我仍然在线观看所有的 `Apple` 活动，关注 `iPhone` 的发布和软件更新，那种兴趣就像体育迷对他们喜爱球队的狂热一样。我在学校的\
  \ `iPad` 上的书签页挤满了科技博客，这些博客每天报道硅谷的最新传闻和新闻，我每天早上第一件事就是查看它们。现在，我点击了我关注的每个科技博客的“关于”部分。从那里，我将能找到每一个邮箱地址都复制并粘贴到我的列表中。那些博主收到的都是同一封邮件，开头都是：“嘿！我\
  \ 16 岁，我创建了一个叫 `4 Snaps` 的应用……”我刻意放大了年龄，希望这能吸引他们的注意。第一天我发了大约一百封邮件。然后，我开始等待。\n\n\
  几个小时过去了，没有任何回复。坐在我的厨房台面兼书桌前，我试图忽略家里旧冰箱发出的沙哑嗡嗡声。它坏了，但我的开发 `app` 的钱快用光了，我们负担不起修理。我讨厌这样。我不想让这成为我们的未来。我该如何增加记者回复的机会呢？我看向电脑，开始写下我能想到的所有点，让我的推销更具吸引力。我决定发送第二轮邮件，附上\
  \ `4 Snaps` 的预发布版本和游戏截图。我花了几个小时准备好一切，并在当天第二次向我的联系人列表发了轰炸。\n\n当我准备迎接如如至而来的关注时，我转而去修复一些漏洞（即之前没时间处理的可能失败的代码段）。窗外夕阳西下，我的电脑屏幕是昏暗房间里唯一的光。我焦虑地每隔几分钟就刷新一次邮箱，但那天没有人回复。这没起作用。\n\
  \n凌晨一点，我的家人已经睡了，而我还在厨房里来回回踱步以帮助思考。我意识到，无论我做什么，我的那些简小邮件都不够“正规”，无法引起科技博主的注意。大多数大公司的\
  \ `app` 发布都会包含一个制作精良的预告片。那才是我需要的——一个 `4 Snaps` 的预告片！我完全不知道如何制作，但付钱让别人帮我做的念头从未出现过我的脑海，即便想过，我也根本负担不起专业的制作。\n\
  \n第二天，我让姐姐邀请她的朋友过来。我从当地的科技店租了一台相机，和女孩们在街区走动，拍下她们聊天和玩我游戏的视频。在电脑上用 `iMovie` 把这些剪辑在一起后，我将视频上传到了\
  \ `YouTube`，并将链接发给了另外五十个在网上找到的地址。这一次我很幸运。两个来自规模较小、相对不名的网站的记者回复了后续问题。比没有好，我对自己说。\n\
  \n距离公开发布还有三天，有两篇关于 `4 Snaps` 的报道正在进行中。这还。只要还有时间，我就有邮件可以发，有推文可以发，有记者可以联系。我不断提醒自己，*两周后就开学了，到时候你就没时间推广这个应用了。*\
  \ 成败在此，刻不此。\n\n我翻找了 `Parse` 网站，找到了他们设计师的邮箱地址，对方很快回了信。\n\n当我疯狂地给另一位科技记者发邮件时，我爸爸下楼了，看了我一眼，然后回了房间。\n\
  \n\n\n`4 Snaps` 的整个目的是从三个随机单词中选出一个，然后为其拍四张照片——而当时只有十个词！我已经把它上线发布了。已经没有回头路了；我必须在人们开始下载这个\
  \ App 之前迅速行动并手动输入更多的单词。\n\n到凌晨两点，我构思了一千个新单词，并把它们上传到了 `Parse`，这是我用来托管应用程序的后端服务。那时，我曾说服过写介绍这款游戏的科技博客之一发布了一篇正面的文章。我查看了\
  \ App Store 榜。我清晰地记得在 2010 年，我的第一款 App 曾在热门应用排行榜中进入第 7 名。现在，我滑过了前十名、百名、两百名……找不到\
  \ `4 Snaps`。我一直向下滚动，直到在“热门免费文字类游戏”类别中发现了第 1,078 名的 `4 Snaps`。\n\n凌晨三点，我离开了那个堆满了麦当劳薯条空容器和斑马仙饼包装纸的厨房，缓慢地上楼睡觉，在床上我最后一次在手机上刷新了\
  \ App Store 榜。`4 Snaps` 已进入“热门免费文字类游戏”的第 876 名。我终于睡着了。\n\n几小时后，我猛地醒来，抓起手机查看榜单。`4\
  \ Snaps` 仍然停留在八百多名。我早餐吃了一些斑马仙饼，并在第二篇关于 `4 Snaps` 的文章发布的瞬间就读了它。紧张地翻看文章，我意识到他们并没有提到我的名字或年龄，他们只是在谈论这款游戏。我一直认为人们关注我的东西是因为我年轻。我收到的媒体关注和去拉丁美洲的采访是因为我是个早熟的孩子。但这篇评论对待我的游戏就像对待其他游戏一样。这是一个好兆头。\n\
  \n我把那个上午剩下的时间都花在了 Twitter 上，试图说服那些之前忽视我的记者加入热潮。效果并没有我预想的那么好。有几个人把我拉了，说我是有以来最烦的人。\n\
  \n到下午一点，`4 Snaps` 成功进入了“热门免费文字类游戏”的第 157 名。我需要做更多来保持它的增长。我给妈妈发了短信：\n\n*   我：嘿，我还有多少钱？\n\
  *   妈妈：600 美元。\n*   我：就这些？\n*   妈妈：我的另一个账户欠了 20 美元。\n\n在过去的三年里，我通过之前的 App 赚了超过 15\
  \ 万美元，而现在我们落到了这种地步。我花了 150 美元在 Facebook 上投放广告推广这款游戏。如果有效，我就大放血，以后再去担心父母过期的账单。\n\n\
  但转化率并不理想。只有大约二十个人点击了广告。这不划算。我妈妈告诉我我的银行账户里只剩下 450 美元了。我现在完全清楚她会说什么：“我们该怎么办？你的 App\
  \ 失败了，我们无路可走了。我们将一无所有了！我们该怎么办？”这是一段典型的陈调，总是让我流冷汗。如果我们*真的*离无家可住只差一个 App Store 的支付款项该怎么办？如果那\
  \ 450 美元决定了我们未来几年是过苦日子还是拥有一份稳定的薪水呢？\n\n就在我妈妈回短信提醒我正牙医预约的时间时，我暂停了 Facebook 广告活动。我和妹妹都戴了多年矫畸器，随之而来的是每月一次的强制调整。我讨厌这些预约。我能理解我们的狗，每当它们发现妈妈要带它们去兽医那里时，就会尿自己。但我提交了预约，因为我等不及想看摘掉矫畸器后我会什么样了。我告诉自己，摘掉它们的那天，我会重新关注自己。我会减肥。我会为了自己努力，而不仅仅是为了我的\
  \ App。\n\n在车里，妹妹坐在我后座的旁边，刷着 Instagram。透过她的肩膀望去，我注意到广告在她的动态流中弹出。这很奇怪。Instagram（当时）还没有广告。我问玛丽亚（Mariana）她在看什么，她说：“我关注的一些账号总是发这些\
  \ App，太烦人了。”\n\n我凑近了一点。“能让我看一眼吗？”她关注的一个账号全是关于鞋子的。\n\n“那个账号有多少粉丝？”我问。\n\n“四百万。”\n\
  \n“哇，那真的很大。”\n\n“是啊，我关注了一堆。其中一个有很多粉色的东西。另一个是关于狗的。”\n\n“嘿，他们的简介里有电子邮箱地址吗？”我问。\n\n\
  她盯着手机。“有，有。你怎么知道的？”\n\n我忽略了她的问题，让妹妹点击那几个发布了烦人“广告”的账号。然后让她把她在简介里找到的电子邮箱地址转发给我。\n\n\
  当我们到达牙医诊所时，我已经摆脱了花光最后一点钱的顾虑。在候诊室里，我给那些账号的人发了邮件（当然，今天我们会称他们为网红）：“嘿，我有一个叫 `4 Snaps`\
  \ 的新 App。我想和你们合作广告。你们收费多少？”\n\n在整个诊疗过程中，当我的牙齿被各种刑具固定和扎刺时，我的手机在口袋里不停地震动。一旦回到家，我打开了邮件。\n\
  \n```\nHey, I have this new app called 4 Snaps. I’d love to advertise with you guys.\
  \ What are you charging?\n```\n\n\n\n我经常被问：广告能把一个 App 推上排行榜顶端吗？答案是肯定的——但只是暂时的。我不建议在大型广告活动上投入大量资金。相反，要先从吸引尽可能小的受众开始——一个目标非常明确且针对你所利基市场的群体。一旦你成功地与该受众建立联系，就可以开始考虑相邻市场。这些用户可能不是你的准确目标受众，但通过对\
  \ App 进行一些调整，增加几个新功能，也许你就能将他们纳入。一旦你占领了*那个*市场，就可以从那里继续向外扩张。通过不断扩大触达范围到越来越广泛受众，你最终的产品可能与最初开始时完全不同。但这没关系！只要你始终记得最初的粉丝是谁，并努力与他们交流、包容他们，你的产品将继续受到那些早期采用者的喜爱——希望还有成千上万的更多！\n\
  \n***\n\n随着一周一天一天过去，我的 App 持续攀升，从免费文字游戏类别的第 157 名升到了第 50 名。尽管此时这个 App 还没有盈利（因为它是免费的），但我我知道它正处于正确的道路上。\n\
  \n很快，`4 Snaps` 发生了一大变化。在我大三的第一周，它成为了 App Store 商店排名第一的文字游戏。但当时发生最大的事情似乎并不那么大。我收到一封来自\
  \ `Parse` 一位女性的邮件，询问我是否愿意录制一段两分钟的视频，描述我是如何构建这个 App 的，以及这项服务是如何影响我的生活的。\n\n“没问题！”我回道。\n\
  \n我从来不会错过任何介绍 `4 Snaps` 的机会，而这次机会格外令人兴奋，因为 `Parse` 最近被 `Facebook` 收购了。这让我的脊背感到一阵兴奋的战栗。`Facebook`\
  \ 可能在我这一代人中并不流行，但我喜欢它。作为一个怀旧的孩子，我特别喜欢在 `Timeline` 上记录我生活中最重要的事件。在 2011 年他们推出那个功能的那天，我进入我们的存储设备，挖出了父亲留下的那些旧\
  \ `SD cards`，里面存满了玛丽亚和我和整个童时期的老照片，并开始创建我的第一本数字回忆录。\n\n收到 `Parse` 请求的那个晚上，我录制了视频。我穿着蓝绿相间的格子睡衣，心想大概会有五个人看。但事实并非如此。\n\
  \n事实是，有人把我的视频放给马克·扎克伯格看。我后来得知，扎克伯格每周都会向员工进行演讲，有时在活动结束时，他会展示一段普通人对 `Facebook` 某个产品大赞誉的视频。`Parse`\
  \ 在几个月前就被 `Facebook` 收购了，轮到他们被介绍了——事实就在我的视频里。于是，扎克伯格把我穿睡衣的样子直播给了他的整个公司。在梅洛帕克、奥斯汀、达拉斯、西雅图、伦敦以及世界各地，每一个\
  \ `Facebook` 员工都看到了我谈论我的 App。我后来从 `Parse` 的执行官 `Ilya Sukhar` 那处得知，当视频播放时，扎克伯格转头对他：“嘿，我觉得我们应该雇用这个孩子。”\n\
  \n# 第 7 章\n\n## 在秘鲁大红\n\n在扎克伯格看到我的睡衣视频大约一周后，我正坐在预积分课上，没在听老师讲，这时一封来自 `Facebook` 的邮件进来了，邀请我申请实习。几分钟后又到了第二封邮件：“马克·扎克伯格想见你，所以我们希望你飞过来。”老师的声音变得越来越遥远。这不可能是真的。我用额头撞了一下桌子以确认自己确实是醒着的。是的，我是醒着的。\n\
  \n“发生什么事了？”坐在旁边的男生小声问，用铅笔戳戳我的肩膀。我无言，转过把 `iPad` 递给他。他扫描了邮件，站起来，对着全教室大喊：“马克·扎克伯格想雇迈克尔！”我的同学开始陷入疯狂。老师走过来夺走了\
  \ `iPad`。“别玩闹了！”他厉厉地道。\n\n我缩在椅子里。在剩下的课时间里，我坐在那里满头大汗，想着：*我得回复！我得告诉他们好的，否则他们会认为我在敷衍他们！*\
  \ 课程结束时，我紧张地要回了 `iPad` 并离开了教室。在大三那年，我的态度和成绩已经从坏变糟糕。并不是我不在乎我的未来；我只是比以往任何时候都更清楚地，好成绩和大学与此几乎毫无关系。\n\
  \n“好的，我很乐意！”我在教室外的走廊里给 `Facebook` 回信。玛丽亚的朋友总是告诉我，毕业后应该经营自己的创业公司，但我已经知道我想要的是稳定性。在和妈妈一起生活的多年里，听她不断拉警报说家里快要断电、没食物或失去餐厅了，我不再想要任何风险了。所以，我完全不在乎是否有创业公司。我想为一家给我发水的大公司工作。我想感到确信，无论发生什么，我都是没事的。\n\
  \n***\n\n10 月，我收到了两个好消息：首先，我获得了 `Facebook` 的实习机会！其次，我被邀请去秘鲁在一场技术会议上演讲。我从小就在那里和亲戚们一起度过夏天，但这次旅行将不同，是一次真正的出差。我请求不领取演讲稿酬，但他们会承担我和我妈妈的机票。\n\
  \n这次旅行是提升 `4 Snaps` 兴趣的绝佳机会。我决定利用这次访问让它在那里的成功程度像在美国一样。我们在总榜分类中进入了前 100 名，用户超过十万。尽管\
  \ `4 Snaps` 是一个免费 App 且没有带来收入，但我仍然抱有希望，让它变得如此受欢迎，以至于大公司花数百万买下它。\n\n我总是带着妈妈出差，帮我保持条理，并提醒我吃饭睡觉，因为这对我们来说一直是共处、增进关系的好机会。这次我真的需要她。我在那个国家三天的行程每天从早晨到晚上十点都排得满满当当，每半小时一个段。\n\
  \n虽然我还需要妈妈的支持，但她也需要我的支持。我几乎停止了试图在父母花我的钱这件事上发表立场——这带来的混乱不值当。然而，我更关注妈妈的开支。每周，当 `Apple`\
  \ 存入我从旧 App 中赚取的微薄资金时，我会尝试和妈妈坐在一起，决定先支付哪些逾期账单。她通常会告诉我太忙了，但我必须尝试。当然，回想起来，我现在我知道这是一种荒谬的处境：一个孩子和父母为了财务问题——以及我的钱争吵。但在当时，这似乎是一场正常的、虽然痛苦的对话。\n\
  \n当我们飞越利马的屋顶降落时，妈妈轻轻碰了我的手臂，用西班牙语对我说：“嘿，迈克尔，我们需要重新粉刷餐厅。这需要几千美元，但我爸爸和我妈妈认为值。你觉得呢？”\n\
  \n\n\n我叹了口气。即使在经济衰退期间我们家遭受了毁灭性的损失，我的父母仍然拒绝承认，他们作为年轻移民时迷恋的美国梦并非没有保障。我父亲一直坚信，只要足够努力，他成为电视领域成功的视频和音频剪辑师的梦想就能实现。事实上，他如此确定，以至于放弃了家人的支持来到美国做他热爱的工作——而不是家人希望他做的事。当机会出现时，他辞掉了职业去追随梦想：和我妈妈开自己的店。在好几年里，当餐厅生意火时，我的父母*确实*经历了他们在拉丁美洲长大时在美国电视节目里看过的美好生活。但那种生活，以及*他们*实现的方式，是不可持续的，而且永远不会持续。他们他们为什么看不出来呢？\n\
  \n“我不知道，”我说，努力保持我的坚决，“也许你和 Papi 应该直接关门，找其他工作做吧。”我觉得自己像个没懂事的大孩子。看着母亲的眼睛，告诉她关掉她和我父亲创业的生意，这种感觉太糟糕了。但餐厅亏损太严重了，我怀疑任何粉刷重装都无法挽救。\n\
  \n当飞机起轮擦过跑道时，我们坐回座位，陷入了沉默。我们得找时间再继续这个话题了。\n\n几个摄像小组，包括一个为我的纪录片拍摄素材的当地 `Univision`\
  \ 团队，在我们下飞机时拍摄了我们。拉丁美洲的新媒体自从我十三岁接受 `CNN` 采访后就一直在关注我，结果是我在那里不再是那种“假名气”了。当我与害羞的 *tío*\
  \ Kike 以及我八岁的表妹 Ariana 交换了尴尬的拥抱时，我注意到有一群好奇的围观者。\n\n在为我的应用 做了三年宣传后，我和妈妈都成为专家了，分工得刃有余：我是\
  \ `Apple` 的快乐男天才，而我妈妈是那个自豪、支持性的父母，如果我忘记微笑或感谢支持者来见见我，她就会推我一下。她总是担心别人会怎么看我们，尤其是涉及到维持我们是稳固中产阶级的形象时。在采访中，我们仍然坦诚地说明我是如何帮助家里的——这可能是媒体最喜欢我故事的部分。但我不应该透露情况变得有多糟糕。即使在我们失去房子时，我的父母也不想让人知道，他们总是小心地不在\
  \ `Univision` 的人面前争论我们的财务问题。那些争吵都留到了凌晨两点，或者当我们独自待在车里时。\n\n在机场送别后，我和妈妈被带进了一辆面包车。是时候给人们看他们想看到的东西：那个抓住了硅谷一席之地的南美孩子。一个成功的人。\n\
  \n***\n\n三十分钟后，我们站在一家小小的生醋鱼餐厅里，周围围着 `Univision` 的工作人员、一个来自 *Día D* 节目的摄像师以及两个负责安排我行程的人。那里没有其他人。他们是为我们把整个店都关掉了吗？\n\
  \n有人给我换上了厨师服。我完全不知道自己在做什么，不知道该说什么，不知道该和谁说话，也不知道会发生什么。我见了主厨。我的嘴角现在真的上扬了。六个服务员出现在并在厨师身后排成一排，厨师用西班牙语：“我们就让你准备一些生醋鱼！会非常棒的！”\n\
  \n“*Espera! Qué?*”我回答道（“等一下！什么？”——自从落地后我就没说过过一个英语单词。“*Yo prepararé un ceviche?*”（“*我要*准备一些生醋鱼吗？”）\n\
  \n“*Por supuesto!*”主厨大声说道。他拍了拍我的背。“*Te va a encantar!*”（“当然！你会喜欢的！”）\n\n他们从一个奇怪的角度拍摄我，那会让我看起来格外胖，但我能做什么呢？只能继续保持微笑。只要我脸上带着微笑，我就能应对过去。主厨递给我一碗切块的生鱼和西红柿，说：“*Mezcla\
  \ esto*”（把这些拌一下）。我拌了三秒钟，主厨就乐得合不拢嘴：“*Lo máximo! Felicitations!*”他笑着，“*Preparaste\
  \ un ceviche! Lo hiciste! Y te salió buenazo!*”（太棒了！祝贺！你做好了生醋鱼！你做到了！而且味道极了！”）\n\n\
  有人给了我一个奖，一枚真正的奖章，还有一本硬装菜谱。服务员们鼓了掌。我妈妈点头微笑。但我知道她心里并没有在笑。她累了，在担心她的餐厅，但她在这里，她支持着我。\n\
  \n现在主厨正在致辞。关于关于 `Apple` 男天才之类的。我不觉得自己是个天才。我觉得自己只是个做过应用的幸运孩子。而现在我在三秒钟内做出了生醋鱼。他们让我发言，于是我说：“非常感谢这些美味的食物。太好吃了！太不可思议了！我很自豪能和我的妈妈一起学习如何做生醋鱼。我们会在家里尝试。味道可能会很糟糕，但我们会尽力的！”\n\
  \n负责安排日程的人其中一人说：“好了，时间到了。下一个地方。”\n\n\n\n\n回到叔叔的家，我偶然上楼走访了已故祖父母的卧室。我和妈妈睡在那里，周围环满了祖母和祖父的照片，还有一个守护天使形状的床头板，这在秘鲁文化中是传统——几乎每个卧室的床头板上都会出一个天使，我以前在迈阿密的那间卧室也是如此。整个房间挤满了我们家族的照片，有黑白的，也有彩色的，有的已经褪成了米黄色。我和妹妹婴儿时的照片散落在房子的各处：它们在每个边几桌上，塞在每个抽屉里，贴满整个走廊的墙壁。仿佛这间房子就属于我们一样。我倒在床上，精疲力竭。我妈妈打开小电视，调换到新闻频道。我出现在三个不同的新闻频道上。“看，快看。你在这儿！看！看！他们在谈论你！迈克尔！迈克尔！快看！”\n\
  \n我用枕头盖住头，无法再承受哪怕一点点刺激。整天——实际上是多年来——我一直假装自己是个外向的人。但这些所有的关注，所有这些人，彻底耗尽了我的精力。我只想睡觉。\n\
  \n***\n\n直到我回到家查看 `Facebook`，才意识到我的秘鲁之行在多程度上改变了我的生活，以我从未预料到的方式推了我向前。来自西班牙语国家的孩子，以及来自印度、法国和世界各地的孩子，向我的账号发送了大量信息。大多数是拉丁美人。他们告诉我关于他们家庭的故事，告诉由于一个拥有共同背景的人能像我一样在科技领域取得成功，他们是多么自豪。他们佩慕我，无论我胖不胖。\n\
  \n当我浏览几百条新消息通知时，我挑选了一封看起来来自秘鲁一位中年女性的信息。信中写道：\n\n> 你好，“苹果天才少年”！\n>\n> 我昨晚在“Día D”节目里看到了你。我有两个女儿和我住在秘鲁利马的米拉弗洛斯（Miraflores）。我确保她们都在房间里看了你的片段。你真是个天才！……你激励了我更加努力。我的女儿也是。其中一个生病了；我们正在祈祷她能及早康复。她告诉我，她以后想像你一样开发应用程序。我祝你好运。不要忘记你的根和你的出生地，迈克尔。上帝保佑你。\n\
  \n面对这样的话该如何回复？我不能给她发那些我重复了无数遍的简短回复。我想表现得辞藻优雅；我想说些有意义的话。我能想出的最好的回复是：\n\n> 感谢你的美言。请把这段话转达给你的女儿们：\n\
  >\n> 世界需要更多的拉丁裔女性程序员！你不需要成为天才也能开发出成功的应用程序，或长大成为一名工程师。尽管我有一个愚蠢的绰号，但我绝对不是天才。但你必须具备这一点：比其他任何事情都必须坚韧。你必须相信自己，到了让别人觉得你在痴幻程度。对我来说，在迈阿密拥有快速的网络和良好的技术，这比你们要容易。但如果你下决心——*súper\
  \ determinada*（超级坚定）——你就会成功。我诚诚地相信这一点。我相信你！爱你的，迈克尔。\n\n# 第 8 章\n\n## 会见马克·曾肯伯格\n\
  \n在秘鲁之后，事情真的腾飞了。`4 Snaps` 在美国已经拥有了近百万用户，几家大公司似乎对收购它产生了兴趣。旅行两周后，我随妈妈飞往加州，应他的要求会见马克·曾肯伯格。我妈妈不知道他是谁，尽管她有一个\
  \ `Facebook` 账户用来和秘鲁的家人分享照片。在会面几几天，她在 Google 上快速搜索了曾肯伯格的名字；唯一让她印象深刻的细节是他是犹太人，和我父亲一样。\n\
  \n我们直接从机场乘 `Uber` 到达园区，一位名叫 `Emily` 的招聘人员和两名实习协调员接了我们。\n\n走入位于梅洛帕克（Menlo Park）的\
  \ `Facebook` 园区就像走进了迪士尼世界，我地球上最喜欢的地方：有色彩斑斓的建筑；篮球场；供应各种食物的餐厅；摆满了充电器、线缆、耳机和键盘的自动贩卖机——这一切对员工免费。有有私人教练的健身房；免费的舞蹈、瑜伽和有操课；提供高端发型的理发店和美发沙龙；校园随时可以看诊的医生和牙医；以及帮助你寻找平衡饮食的免费营养师。每栋建筑的每一层都配备了有多台咖啡机的微型厨房；塞满了牛奶、奶酪的冰箱。\n\
  \n整个房间挤满了我们家族的照片，有黑白的，也有彩色的，有的已经褪成了米黄色。我和妹妹婴儿时的照片散落在房子的各处：它们在每个边几桌上，塞在每个抽屉里，贴满整个走廊的墙壁。仿佛这间房子就属于我们一样。我倒在床上，精疲力竭。我妈妈打开小电视，调换到新闻频道。我出现在三个不同的新闻频道上。“看，快看。你在这儿！看！看！他们在谈论你！迈克尔！迈克尔！快看！”\n\
  \n\n\n\n\n“我——我——”这是世界上最简单的问题了，但我脑子里想的只有：*我真不敢相信万富翁竟然把脚架放在桌子上！*在很多拉丁裔家庭里，这是终极的忌讳，这完全让我措手无策。*专注，迈克尔，*我对自己说。*你现在就在现场，别搞砸了。回答问题就行。这个问题太显而易见了！*你经常会被问到这个。就像你常做的那样回答。保持冷静。他那么冷静。像他一样吧！*当我的大脑飞速运转时，扎克伯格在等待，期待地看着我。最后，我成功解释了\
  \ `4 Snaps` 的灵感是在我姐姐和她的朋友在短信群聊里来回地发送照片时产生的。“我喜欢观察人们如何交流和玩耍，然后为他们创造新的方式来完成他们已经喜欢的事情，”我补充道。接着，“我真的不相信有所谓的原创想法，只是对现有事物的新组合。”\n\
  \n马克把腿从会议桌上挪下来，在脚间颠着球。“酷酷，”他说。那是他在表达我觉得我是个白痴吗？还是他真的觉得我说了些有价值的话？从他面无表情的脸上，这无法判断。我咬了咬舌头，透过马克身后的落地窗看向外面，等待着他的下一个问题。外面是一片绿植如葱的庭院，被几根巨大的圆柱柱子隔开。*天哪，*我想。*那些柱子一定是为了防止有人试图开车撞进大楼吧！*\n\
  \n扎克伯格打断了我的内心独白：“你是如何决定把编程是你想要从事的工作的？”\n\n我本该说些明智的话。但我说的是：“我不喜欢工作。我只是喜欢玩耍。”扎克伯格微微挑了挑眉。\n\
  \n*噢不，噢不，噢不。我刚才为什么要说出那句？*那是我在无数次采访中重复过的台词。我脑子里有一份针对不同问题的不同答案的文件夹，而那句老掉的“我只是喜欢玩耍”的金句我已经重复了太多次，以至于直接脱口而出。现在扎克伯格会觉得我很懒了。这太糟糕了。真的很糟糕。\n\
  \n我试图澄清：“我的意思是，我喜欢写代码，写代码很有趣，所以就像我不用工作一样！”\n\n这似乎有所帮助。他点了点头，球在桌上弹了一下。“你喜欢玩视频游戏之类的吗？”\n\
  \n“不，我没时间玩游戏，我只是喜欢制作它们。”另一句备用台词。我紧张得像个自动一样吐出这些话。我正在错失做自我的机会，而这一切都过得太快了。会议剩下的时间都是一片模糊。在感觉像转瞬逝的十五分钟后，会议结束了。\n\
  \n扎克伯格带我走到我妈妈等的地方。我们又握了次手，然后马克去握我妈妈的手。“这是一个很聪明的孩子，”他说。\n\n就在那时，由于某种无法解释的原因，我妈妈说了：“你知道的，我儿子也是犹太人。”\n\
  \n我一生中，妈妈一直在为了我信什么宗教和我父亲争吵，坚持认为我是天主教徒，像她一样。但对于扎克伯格，她直接把自己的宗教抛之脑后。我用手捂住脸。如果地球裂开把我吞没，我会觉得很开心。\n\
  \n但马克在笑，给我一个眼神，仿佛在说：*妈妈嘛，对吧？*\n\n我妈妈还没完。“再问一个问题？”她问道，看起来超级尴尬。我们都站在那儿，等着她把话憋出来。我想那一刻比我生命中的任何时刻都要长。我妈妈向那位令人神醉的万富翁伸出手，但她似乎说不出话来。\n\
  \n“让我猜猜，”马克终于回答道。“你想拍张照片？”\n\n“是的，请！”我妈妈说。\n\n“噢天哪，我妈妈太害羞了，”我嘟囔道。我穿着一件黑色 T 恤，外面套着紫色的旧金山连帽衫，我觉得它能很好地遮住我的肉，但我妈妈却让我换上刚礼品店买的\
  \ Facebook 连帽衫。不可能。\n\n“笑！”她说。*求让这快结束吧，*我祈祷着，露出金属般的微笑，圆嘟嘟的脸泛起通红。\n\n尽管如此，我妈妈还没完。\n\
  \n“现在——”她紧张地笑着，“再来一个，也带上我？”马克对这一切非常有耐心，但我能看出招聘人员艾米莉正为浪费了他的时间而抓狂。“好，最后一个我们就结束了！”她欢快地说道。我妈妈把手机递给她，她拍了一张我们两个围着扎克伯格的照片。然后，在我还没反应过来发生了什么之前，我们被带到了大厅，艾米莉向我们挥手，她看起来需要喝口酒或洗个热水澡或者*什么*。但她比我更松庆这一天结束了。\n\
  \n# 第 9 章\n\n# 再见，贝伦\n\n尽管最近几个月我一直在自言自语，说从大局来看，我的应用比大学更重要，但我的一部分自己还是想去——去真正的计算机科学家那里学习计算机科学。我最终参加了贝伦提供的那个新课程，但教课的老师对移动应用开发的了解还不如我少。我从中获得的最好的东西是，很多我自己摸索出来的概念现在都有名字了。例如，我通过尝试错误得出的块状时间表被称为`甘特图`。\n\
  \n总之，现在是审判时刻：大学申请在 12 月第一周截止。很快我就会发现我的`平均成绩`是否杀死了我的机会——还是没有。我其实很乐观：我的 SAT 和 ACT\
  \ 考了不错的分数。\n\n* * *\n\n—\n\n\n\n\n在三月，我曾希望大学们能忽略我糟糕的成绩，看到我所做的现实世界工作并争相录取我，但这些希望都幻破灭了。坏消息接踵而至：拒绝、拒绝、再拒绝。只有学校旁边的社区学院和一所来自罗彻斯特的中流大学给我发了录取通知——我之所以能进罗彻斯特，是因为我见了一位招聘员，他对我对\
  \ `4 Snaps` 所做的成就留下了深刻印象。信中说我的成绩不达标，以后会过得很艰难，但由于他们喜欢我的“故事”，所以破了例。不过这并不是什么大特例：因为成绩的原因，我无法获得助学金。所以，如果我想上学，就得支付每年\
  \ `$50,000` 的学费。\n\n根据 Belen 的说法（那所学校的大学录取率为 100%），这正是我应该做的。在此时，其他孩子可能会向父母寻求指导，但对我来说这没可能。早些时候，当餐厅生意还不错、父母还没有在经济上依赖我时，他们是掌控者。但多年来，随着我承担了越来越多的财务责任，我已不再询问父母我该如何生活。我是自己养育自己。所以当做关于大学的决定时，我没有问他们认为我应该怎么做；我只是问了自己。我心里已经有了答案。我负担不起大学——我不想申请学生贷款并还二十年的债——这意味着我必须竭尽全力，在实习结束后被\
  \ `Facebook` 录用。\n\n尽管如此，我还没准备好告诉父母我不上大学了，所以我联系了罗彻斯特的招生办，告诉他们很快会给答复。\n\n与此同时，在高中毕业一周前，Belen\
  \ 给我父母寄了一封信。我妈妈递给我信时，手在抖。当我的视线扫过页面时，我感到脖子和脸颊发烫。那封信是一个威胁。如果我不“立即”支付欠下的七百美元逾期学费，我将无法和同学一起毕业。\n\
  \n泪水模糊了我的视线，我迅速转过头，眨着眼睛。我不想在妈妈面前哭。我感受到的任何悲伤瞬间转化为愤怒或伪装的冷漠。我在所有人面前戴着假面具：老师、同学和家人。我甚至在欺骗自己，认为自己永远不会脆弱。情感是小孩子的——不是家里的顶梁。我感到胸口有一股熟悉的紧绷感，接着是一股热流涌上耳根，仿佛脑子里点燃了一炉炉子。\n\
  \n我转身面对妈妈，我说：“你们为什么不交？你们甚至没告诉我！”\n\n“我们需要那笔钱来还更大的债！”她哭道。\n\n最近，他们终于关掉了 `El Pollon`。家族企业结束了，彻底结束了。\n\
  \n“噢，迈克尔，我很抱歉！”她坐在床边，双手掩着脸。\n\n我揉起来自 Belen 的通知单，把它扔进垃圾桶。“没关系，”我冷冷地说，“去他们妈的吧。反正我也不需要那个毕业证。”我知道自己很混蛋——我一直知道父母在用我的钱付他们的账单——但在那一刻，我不想安慰我的妈妈。\n\
  \n“我不需要。我也不想要，”我继续说道，“不从这所学校。”\n\n我妈妈看着我，仿佛我疯了一样。\n\n“你在说什么呢，迈克尔？你不需要？这是没可能的！你需要你的毕业证！”她的额头形成了一道深深的忧虑皱纹。\n\
  \n“别交学费了，”我开始走动，“如果他们看不出我们正处在困境……我恨他们！”等我能停下来时，泪水已经流到了脸上。我震惊得没顾及擦掉，我听到自己用小孩子的声音说：“但你说过会交的。”\n\
  \n“迈克尔，我说过我会试。但我们没钱！”我能看出她正处于边缘——决定我是那个坚强的人，还是让我来坚强。\n\n*她。又。来了。* 我妈妈哭了起来。她用指尖擦泪，以免弄坏妆容。我摇了摇头。其他家庭都是这样运作的吗？表面一切必须完美：妈妈的指甲无懈可击，我们的车打得得光发亮，镇屋前的草坪修剪得像\
  \ `Astroturf` 一样整齐——尽管当你剥开那层表面，只有尘土。我妈妈不停地念叨着她只想让我上大学接受良好的教育，但在她的话语下没有实质，没有付钱的计划。那是由我来解决的。\n\
  \n“我希望 Belen 对你能宽容一些，”我妈妈说，“他们知道你是特别的！”\n\n我摇了摇头。“我不特别，妈。你到底在说什么？”\n\n“他们知道为了得到\
  \ `Facebook` 的实习你付出了多努力！”我妈妈坚持道。她坐在椅子上，揉着太阳穴，仿佛头痛要发作。\n\n“是啊，”我现在的语气轻了一些，“问题就在于此。”\n\
  \n当我走出房间时，我补充道：“我会看看能做什么，但别寄抱太大希望。”\n\n\n\n索纳斯先生递给我一张从 Facebook 小组打印出来的页面，指着我写过的一条评论。我不确切自己具体说了什么——大概是在说我希望校长能更认真地对待我的申请。\n\
  \n当我把那张纸还给他时，我的手抖得就像我妈妈前一天读到来自贝伦（Belen）的信时一样。我试图平稳自己的声音：“索纳斯先生，求求了，我没有侮辱任何人！没没那么糟……对吧？”\n\
  \n索纳斯先生再次用激光般的目光将我钉在椅子上，尽管他保持着令人不安的冷静。“你不能参加毕业典礼，”他在长时间停顿后说道，“你要上暑读班来弥补大量的缺课。你需要交学费。*然后*，我们再谈毕业证的事。”\n\
  \n我当着他的面大流泪。在几阵尴尬的抽泣后，我用袖子擦了擦鼻子，眨了眨眼睛，用我鼓起最有勇气的声音说道：“我不能去暑读班。我收到了马克·扎克伯格的录取！要去 Facebook\
  \ 实习！”\n\n索纳斯先生推开椅子从办公桌后站了起来。“马克·扎克伯格可以等等等。”\n\n就这样。权威发话了。我直接回了家打了马克·扎克伯格的电话，告诉他我不能实习了——暑读班更重要。\n\
  \n哈。没门！显然是开玩笑的。\n\n最后我去找了校长，说服他让我参加毕业典礼——尽管我现在或永远都无法毕业。他在典礼仪式上让步了，但明确表示在我付清学费之前，我是拿不到毕业证的。对我来说没。我很快就不在乎那张纸以及它代表的意义了。在和索纳斯谈完话后，走出那扇沉重的校门——走出贝伦的围墙，进入刺眼的蓝色午后——一切都变得清晰了。所有重要的是实习，是那个改变现状的机会。当然，还有让我妈妈拍一张我穿学位服戴学士帽的照片。\n\
  \n***\n\n“迈克尔，醒醒！你得准备了！”随着“啪”的一声和刺眼的光亮，我妈妈开了我卧室窗的百叶帘。昨晚，当我蜷缩在床上的电脑前时，她仔细地熨好了我的深蓝色制服和学位袍，把它们铺在我的椅子上。\n\
  \n我迅速穿好衣服，还没上车汗水就浸透了合成面料。那是迈阿密一个典型的、热得令人作呕的夏日，我们家人站在一辆黑色的马田 SUV 外，内饰是全黑的，门开着，空调开着为了降温到足够安全。“呃！”我呻吟着，拉了拉睡袍的领口。“我只想脱了！”\n\
  \n我妹妹翻了个白眼。“快走吧。”她并不期待和父母单独生活。等我走了，我妈妈会有更多精力去担心她妹妹的成绩，那成绩也一直没好过。玛丽亚娜（Mariana）推开我，坐在后座，然后立刻叫了起来：“噢！安全带烫到我了！”\n\
  \n在去往毕业典礼的路上，我妈妈又教训我，说拍照时要合上毕业证文件夹，这样就没人看到它是空的。她很紧张，说话时在粉底镜里一遍又一遍涂着口红。我爸爸很安静，但当他从后视镜看向我时，我能从他眼角纹路的倾斜看出他在微笑。这让我松了口气。很久没看到那些笑纹了——至少自从我父母放弃那家餐厅之后。昨天有些男人来看桌椅。餐厅的新老板决定完全原样保留，这让我更沮郁了。很快，门面上的招牌就会宣传着另一个家庭的生意，再也无法改回去了。我想我父母以后打算做什么工作。他们是指望我把实习的工资给他们吗？因为如果我们不谈论这件事，就不是问题，对吧？\n\
  \n***\n\n在典礼上，我走过舞台，对我妈妈微笑。如他们所承诺的那样，贝伦扣了我的毕业证，在装饰性文件夹里换了一张白纸，上面用蓝笔歪歪扭扭写了一个巨大的电话号码。我认出那是学校办公室的电话。\n\
  \n之后，当我和同学合影拍照时，我尽力假装自己真的属于那里。这些年来，我与同龄人隔阂太深，以至于我不知道周围一半孩子的名字。如果那天晚上我真的*想*去参加毕业派对，我也不知道去哪儿找。在我的余光中，我看到卢卡斯（Lucas），我在贝伦结交的少数真朋友之一，正搂着一个深发的漂亮女孩。他交女朋友了吗？由于他不再懒得跟我说话，我并不知道，但我从妈妈那儿听说他拿了全额奖学金，计划学习计算机科学。\n\
  \n最后，合影结束了，其他孩子散开去和他们的真朋友合影。当我妈妈在那儿忙碌，向每个愿意听的人炫耀我的实习时，我很感激有些家长能走过来跟我聊天。“我们听说了 Facebook\
  \ 的事！”他们拍着我满是汗的背说。“多了不起成就，恭喜你！”我努力表现得酷一点——用一句简单的“是，谢谢”并耸肩来回答。但我忍不住对每一个走过来的父母绽脸微笑并口口溢金：“非常感谢！我太兴奋了！我不敢相信这真的发生了！”\n\
  \n我妈妈从其他家长身边抽身快快朝我走来，高跟鞋陷进了草地。我爸爸跟在后面，带着他那种在大人群中特有的、疏离的表情。\n\n“米奇，拍一张我和迈克尔的，”妈妈说，她搂住我并挤了挤。然后她看着我的眼睛甜甜地问：“这一张书是合上的？”\n\
  \n我举起合上的文件夹，我爸爸拍了照。\n\n“好了，妈妈（Mami），”我说，松开了。“你要的有了。我们可以走了吗？”\n\n她捏了我的手臂。“可以走了。谢谢你，迈克尔。这就是我想要的。”\n\
  \n我们在家里最特殊场合的餐厅庆祝了，那是一家铁板烧风格的日餐厅，他们会在食物上点火。\n\n\n\n“好的，妈米，这样很好，”我轻声说道。我完全不在乎成为百万富翁，我想要的只是稳定。\n\
  \n# 第 10 章\n\n## 倒计时从现在开始\n\n“再次向我保证吧，迈克尔。”\n\n“噢，我的天呐，妈米！”我鼓起脸子，翻了个白眼。“我保证我不会忘记你的！”\n\
  \n我的家人在迈阿密国际机场的安全检查口外向我告别，我们每个人的表现都百分之百符合人设：我妈妈在大作戏；我感到很尴尬；我爸爸在耐心等待说话的机会；而玛丽娜因为我的离开让她错过了了美甲预约而很不耐烦，正勉强忍着我们所有人。\n\
  \n“*No puede ser!*”我妈妈叹道，“我的宝宝才十七岁！”她开始微微流泪了。\n\n我爸爸叹了口气，拍拍她的背。“行了，妈米，别这样。他快成年了，几个月后就会回来的！”\n\
  \n“是的，妈米，他很快就会回来的，”我姐姐说。\n\n“我没事，”我妈妈抽了抽鼻子，“我很好……只是我想起了你很小时候，我把你抱在怀里的样子。”她开始眼神看向远方，做着摇婴儿的动作。\n\
  \n我把包斜在肩上，绕过她抱了抱爸爸。“再见，爸爸。”\n\n“再见，儿子。祝你好——”\n\n“你小时候最喜欢吃糖果了！”我妈妈打断道。“记得吗，我以前经常给你买那种长长的螺旋棒糖？它们比你的头还大！”现在她又笑又哭。“你还记得吗，迈克尔？”我得在玛丽娜因为尴尬而原地自燃之前赶上那架飞机。\n\
  \n“我当然记得。再见，妈米，我爱你，”我再次说道，抱住她。“我保证，我会经常给你发照片的，好吗？”\n\n在安检队伍中，我回头看了一眼。我姐姐和爸爸已经消失了，但我妈妈还站在那里。我最后向她挥了挥手，转过身，思绪已经飞到了三千英里之外。\n\
  \n***\n\n实习正式开始（附带免费公寓）还有一周才到，但我提前出发并订了酒店，以便参加`Apple Worldwide Developer Conference`。`WWDC`是一个年度性的夏季盛事，苹果会在会上发布新软件和产品，大牌工程师会举办关于如何使用新功能的演讲。想象一下几千程序员同时被接升到科技天堂，你就大概那种感觉了。我对`WWDC`的兴奋程度几乎不亚于在\
  \ Facebook 入职。\n\n来自美国讯视（Univision）的纪录片剧组单独飞过来，在活动现场拍摄我。他们我在旧金山的酒店预订了房间，我妈妈对此很高兴。她已经开始信任这个剧组了，我们都是如此。在过去的三年里，马尔塞洛、查琳和洛基为了美国讯视的节目偶尔来探望我，他们对我来说已经就像第二个家人一样。马尔塞洛四十多岁，年纪最大，通常由他为纪录片采访我的父母和我。有时我把他看作是我爸爸的一个更年轻、更酷的版本。洛基二十来出头，负责整个片子所有的摄像工作，以及在后期制作中剪辑所有片段。他一直是我可以信赖倾诉的人。他为我提供了一个观察作为一个独立年轻人的生活的窗口。查琳二十十多岁，她作为纪录片的执行制人的职责是协调后勤。我总是可以信任查琳，在拍摄前告诉我牙缝里有没有饭渣，或者在我和我妈妈吵架时安抚我。所以，尽管我很兴奋能出来独立，但我不得不承认，我很开心这三个人陪我来到这个陌生的新城市。旧金山和迈阿密完全是两个世界，对我来说完全不同，那里有疯狂的山丘、古板的维多利亚式房屋，还有冷刺骨的夏雾。\n\
  \n在一家挤满了二三十岁年轻人的市区餐馆里，马尔塞洛把他的`1080p`专业级相机放在桌上，和我击了个掌，微笑着问。\n\n“带睡袋了吗？”他问。\n\n“当然带了！”我指指我塞在脚桌底的地方。\n\
  \n查琳抿着嘴，看着窗外一个穿着破烂衣服在十字路口踉跄的男人。“你确定想这样做吗？万一被抢了怎么办？”\n\n“噢，别担心，到处都是保安，”我安慰她。我计划在开幕日的前一天，和其他在街区周围排着躺椅的硬核观众一起度夜。明天早上八点门开时，我们将是第一批进去的人，冲进主厅，抢占苹果首席执行官\
  \ `Tim Cook` 主题演讲的最前排座位。\n\n查琳设法获得了在活动现场拍摄我的许可——这可不是什么易事，因为苹果对进入会议的人员筛选非常严格。他们不允许携带大型相机，所以她当天额外派了一名第四名剧组成员用他的手机拍我。\n\
  \n“你确定不想和我们一起在外面待着？”我问马尔塞洛，舔掉手指上的番茄酱。\n\n马尔塞洛笑了。“听起来……很有趣，但我确定我们能拿到需要的素材。”\n\n在我吃完油腻食物补充能量后，我们四个人走向了莫斯科会议中心（Moscone\
  \ Center），那是一座巨大的建筑，两侧立着一排旗帜。\n\n“哥们儿，你没带椅子之类的吗？”瘦削二十岁的奥利弗问道。\n\n“没，就带了这个。”我从包袋里拽出包。\n\
  \n“你可以轮流坐我的椅子，”小组里的另一个孩子说，“路面很冷。”\n\n“酷，哥们，谢了，”马尔塞洛拍摄时我说道。\n\n早上八点，门开了，我疯狂大笑着冲入人潮。马尔塞洛和我一起进入会场听取主题演讲。\n\
  \n## 关键\n\n灯光暗下，`Tim Cook`出现在大屏幕中央显眼的 `Apple` 标志前的舞台上。他在主题演讲开始时强调了今年开发者大会参与者的多样性。国籍、年轻人在线参与者的数量创了记录。当\
  \ `Cook` 说话时，我已经在规划我的下一步了：与他合张影。\n\n主题演讲结束后，我冲向主走廊，那里看起来像飓风一样的人群环绕着 `Cook` 和他穿橙色衣服的保镖。`Tim`\
  \ 正朝出口移动，那群穿连帽衫的孩子也随之移动。“这边，Tim！！”他们大喊着，在头顶举起手机摄像头。“我们爱你，Tim！”\n\n\n\n我知道必须在他赶到门口之前找到他，但追逐那群人是徒劳的。相反，我从正面拦截了他们，然后开始在人群中挤向风暴中心。当我终于用手肘挤到库克（Cook）身边时，我越过他那粗壮的保镖，伸出手，激动地说：“噢天哪，你好！我是迈克尔！”\n\
  \n库克回握了手。“你从哪里来，迈克尔？”他的身上每一个细节都透着低调的成功。\n\n“我来自迈阿密！”\n\n“酷，”他露出了友好的微笑，“热火队（The Heat）表现得不错，不是吧！”\n\
  \n我完全不知道，压根不在乎篮球。万如果这是一个陷阱题呢？“热火加油！”我向空中举起拳头。“嗯，提姆，我可以和你合张照吗？”\n\n就在在他点头同意的第二秒，我就靠向他并举起手机，笑得不拢嘴。*咔嚓！*我向他表示感谢然后离开了。我的十五秒已经到了；是时候给别人一个机会了。\n\
  \n在停下来推特了提姆·库克的照片后，我直奔新闻发布室——马尔塞洛（Marcello）在旁边跑着录像。我想看看有没有记者对听 `4 Snaps` 感感兴趣。自从我停止推广它并转而专注于准备实习以来，这个\
  \ App 的排名一直在稳步下降。但现在，我对比 `4 Snaps` 重新焕发了活力——仿佛这位苹果公司首席执行官的某种魔力在我们握手时传染到了我身上。\n\n\
  在会议接剩下的时间里，我像一个旋转的陀螺。我和几位记者聊天，让 `4 Snaps` 回到了媒体视野，并使其在排行榜上又升了几位。我和一个之前在 Twitter\
  \ 上见过的家伙做了一期播客采访——他后来建立并售卖了一个产品评论网站，成了一个百万富翁。我很确定在整个活动期间我没有停止过微笑。但与我过去在各种媒体露面时贴出的虚假笑容不同，我的快乐是真实的。现在我离家数千英里，家人的财务忧虑也显得遥远了，我脑子里想的都是未来——*我的*未来——以及未来是多么不可思议、令人兴奋地广阔。\n\
  \n会议结束那天，我依然带着微笑，乘坐 `Uber` 往位于山景城（Mountain View）的新公寓，那里在硅谷的心地带，靠近 Facebook 园区。下车后，我沿着一条红色的赤土小径，穿过一个拥有茂盛草坪的西班牙风格建筑群，经过一个我显然永远不会使用的闪亮泳池，走上楼梯，进了那间我将与神秘室友共享的阳光两居室。在这个全新的、拥有新获得的完全独立生活的地方，我做的第一件事是什么？当然是点披萨。\n\
  \n当我刷着手机并吃掉第六块时，我的室友到了。他高高瘦瘦的，戴着圆眼镜，走路时略微驼背，仿佛在为自己的身高道歉。“你好，我叫约翰（John），”他用浓重的口音说道，放下一个巨大的、鼓囊囊的行李箱。我了解到\
  \ `John` 来自中国，读过名校的常春藤盟大学，将在 Facebook 负责基础设施工作——那些连我都觉得无聊的后端内容，因为唯一与之互动的人是其他程序员。我觉得在接下来的三个月里我很少见到\
  \ `John`，因为我们大部分清醒时间都会在 Facebook 园区度过。但晚上，我们都努力表现出最好的一面。`John` 听说有一家提供奶茶（boba）的地方。我当时并不知道，`boba`\
  \ 在硅谷几乎是种神圣的饮料。人们对哪家的奶茶最好的争论，几乎和他们争论写代码时该用 `tabs` 还是 `spaces` 作为缩进一样激烈。\n\n奶茶店挤满了\
  \ Facebook、Google 和苹果的实习生。它是一个只有我妈妈厨房那么大的小店，里面挤了近四十个人，另外两百人在排着队绕了整个街区。在人群的喧闹声中，我们几乎听不见彼此说话。当我终于拿到奶茶时，`John`\
  \ 兴奋地问我觉得怎么样。\n\n“我太喜欢了！”我说，对他露出最完美的假笑。\n\n`John` 扔掉空杯，看了一眼我满的杯子。“我们应该回去准备明天的事吗？”\n\
  \n“好，得准备！”我假装喝了最后一口，然后悄悄地倒掉了茶。\n\n回到家里，我们关上卧室的门。当 `John` 编译他的 `Internship Goals`\
  \ 表格或任何他高度组织的任务时，我熬了一整晚在电脑上看电视、发帖、推特并检查 `4 Snaps`。不过，我并不是对前前的挑战毫不在意。自从一周前登上往旧金山的飞机，一个像丝带一样的铭言在我脑海中循环：*倒计时现在开始。三个月获得全职\
  \ Offer。开始计划。倒计时现在开始……*但，与 `John` 不同，我不知道如何准备我生命中最重要的一天。至于睡眠？谁能*睡着*？\n\n早上六点，我终于让手机落在垫子上。早上七点半，我模糊听到大门关上的声音和\
  \ `John` 的脚步声在小路上远去。Facebook 的班车每半小时一班，九点之后才每小时一班。我本应该在九点向实习协调员报到，这意味着我可以挤出四十五分钟赶上八点半的车，没问题。在再次入睡前，我的最后一个念头是我可能应该设个闹钟。\n\
  \n# 第十一章章\n\n## 准备好了吗？\n\n我确实没有设那个闹钟。现在是十点，我上班第一天迟了一个小时。汗水浸湿了我的 T 恤，我冲过 Facebook\
  \ 园区，穿过那些悠闲得令人恼的员工。为什么大家动作都像慢动作？就在十分钟前，我被猛地惊醒，看着 `phone` 上的时间，喊出了几句足以让我妈妈直接冲进圣托马斯主教教堂为我的灵魂点蜡烛的话。从地板上抓起一条脏牛仔裤后，我在最后几秒钟内赶上了早上的最后一班班车。\n\
  \n我滑行停在一个标有“实习生注册”字样的临时展台前。“嗨，嗨！对不起我迟到了！”我对着展台前的几个女人气喘吁吁地说，捂着嘴巴。我出门前甚至没照镜子。为什么我没有从校园随处可见的自动售卖机买一套牙刷？谁知道我的牙套里卡了什么？\n\
  \n“别担心，你没事的，”其中一个女人说。她留着长棕发，戴着墨镜，T 恤上写着“你在想些什么？”，就像 Facebook 新发布框里的占位符文字。我不确定她是对我嘲笑，还是她的嘴就长那样。\n\
  \n“你是迈克尔·赛曼（Michael Sayman）吗？”另一个女人看起来看起来三十多岁，留着非常卷曲且染染的发——更像詹妮弗·洛佩兹，而不是冲浪女孩。\n\n\
  “是！”我喘着气说。“你怎么知道的？”\n\n“我们听说有一个非常小的孩子上班，”戴墨镜的女人说道。\n\n我看起来真的那么年轻吗？真遗憾。\n\n“欢迎来到\
  \ Facebook，迈克尔！”卷发女人说，“我是塞莉娜（Selena），这是莎拉（Sarah）。你还可以赶上一些毕业演讲。快进去吧！”\n\n\n\n我溜进拥挤的会议室后排，此时，一个穿着平洁纽扣衫的男人正在解释如何利用未来三个月里我们能获得的数千项福利和优惠——从无尽的免费餐饮选择到顶尖的健康服务，再到健身房会员、日落时草坪上的瑜伽，等等。他指着一架塞满了\
  \ Facebook 背包的巨大架子。“等会儿记得拿一个。它对你们即将收到的新笔记本电脑大有用场！”会议室里，近四百名期待着拿到新科技的编程极客们爆发出一阵欢呼声。早些时候，我们向实习协调员提交了偏好：`PC`\
  \ 还是 `Mac`？`Android` 还是 `iPhone`？我当然是全选了 `Apple`。我等不及待要拿到我的新设备了。\n\n我真希望老朋友 Lucas\
  \ 能在那儿看到这一切。记得我们一起看直播 `Apple` 产品发布会已经像是万年前的事了。我们曾是彼此的忠实 `Apple` 粉丝，会对科技承诺带来的兴奋感产生共鸣。然后，额，我想我选择了科技而放弃了与\
  \ Lucas 的友谊。我很确定，至少在他眼里是这样看的。这并不是一个主动的选择，只是我纯粹的懒惰。因为过度专注于开发应用，我让我生中唯一一个真正的朋友溜失了。他现在在哪儿呢？可能在打暑假工攒大学费吧——那是一条我没有走的路。如果我们还联系的话，能知道那条路是什么样子的就太酷了。\n\
  \n我的注意力回到会议室前方的演讲者身上。他举起一只手，提醒我们走路要`缓慢`且`小心`，走向笔记本电脑和包包，不要互相踩到。“大家都明白了吗？”他问道。\n\n\
  “明白了！”四百名工程师齐声回答。\n\n“好，那么！去吧，——”\n\n还没等他来得说“拿走！”，我们已经起身冲着我们的免费科技冲了出去。那感觉就像是打了兴奋剂的圣诞节早晨。\n\
  \n当我手里拿着自己那台精美、闪亮、顶级、满配的 15 寸 `MacBook Pro` 时，我突然被恐惧攫住，觉得自己不属于这里，不属于这些来自名牌大学的二十多岁的孩子。我听到他们谈论编程的程度令我完全无法理解。这不无道理的，因为他们大多数都在世界上最顶尖的计算机科学教授那里培养了技能。与此同时，我只能依靠\
  \ `Quora` 和 `Stack Overflow` 这类问答网站来跟上进度。我的申请可能被错错进了“通过”堆。也许是某个工作过度的实习协调员搞砸了。任何时候，可能都有人——肯定`会`——拍我的肩膀，要求我交出东西并离开。这种可能性让我充满了恐惧，随之而来的是一种信念：我必须加倍努力，才能瞒过他们的眼睛，装得我很懂自己在干什么。\n\
  \n***\n\n我无法停下观察四周。`Facebook` 正在建造一个由 `Frank Gehry` 设计的新校区——但我无法想象有什么能比得上我们那条树影成荫的\
  \ `Main Street`（主街），我得知那里实际上是模仿 `Disneyland`（迪士尼）设计的。难怪我在这里感到如此如家。我喜欢这里多元民族的餐厅、老派的理发店、糖果店，以及需要休息时可以躺下的柔软绿色草坪。\n\
  \n室内也很漂亮，但遗憾的是没那么迪士尼味。我的办公桌是宽敞、具有工业感的空间里的数百张桌子之一。为了鼓励协作和平等主义，`Facebook` 对墙壁说了“不”。没有私人办公室，即使是\
  \ `Zuckerberg` 本人也没有——尽管他获得了一个指定的会议室。色彩丰富的壁画覆盖了几乎每条走廊，员工坐在玻璃墙会议室里的豆袋椅上，会议室的名字像像\
  \ `Tangled Earbuds; Like, Totally;` 和 `Not Found`。\n\n实习开始几天后，我放下我的新背包，向坐在我旁边的经理\
  \ `Jake` 打了招呼。他在 `Facebook` 内部的 `Parse` 团队，多亏我早期与该平台建立了联系，我也将在那里工作。\n\n“你过来了，”`Jake`\
  \ 说，他是一个高高瘦瘦的亚洲裔美国人，穿着蓝色牛仔裤和简单的黑色 V 领 T 恤制。\n\n“是的，抱歉！”我看了看手表。十点二。我又睡过头了，然后打 `Uber`\
  \ 来的公司。\n\n“嘿，这是你的实习，”`Jake` 说，“我们去 `Tangled Earbuds` 给你定个项目吧。”\n\n`Jake` 看过那段尴尬的睡衣视频（那是我进入\
  \ `Facebook` 的敲门砖），所以认为我是游戏控。在会议室里，他解释说他认为我的经验适合构建一个游戏模块——具体来说，是一个通用的回合制游戏模型，任何使用\
  \ `Parse` 的开发者都可以将其接入。这个主意是让人们不必在每次构建新游戏时都重新发明轮子。\n\n“你觉得呢？听起来合适吗？”他问我。我挠挠头。我听说在\
  \ `Facebook`，他们非常热衷于让人们追随热情，而这个模块的东西完全不是我的兴趣所在。这是基础设施，是我室友 `John` 赖以生存的。而我，我在为用户创造事物时才会兴奋。比起思考某个想象中的程序员想要和需要什么，我对某个想象中的玩家想要和需要什么感兴趣得多。\n\
  \n\n\n\n我很了解自己，所以我不会尝试强行写出那个模块的代码。就像任何写作一样，要写好代码，必须深挖并找到灵感，即使这种灵感埋藏得如此深，让你觉得自己是在用一把钝勺子挖钻石。问题是，我甚至连勺子都找不到。我太习惯于开发自己的\
  \ App，因此要在我热爱的编程方面与这个项目要求的编程方面之间找到平衡，非常困难。真的非常困难。\n\n我告诉自己，我会渡过关的。在此期间，我必须做些什么。我决定从另一条轨道向前推进，从另一个角度利用实习带提供的机会。在苹果全球开发者大会（WWDC）上，我曾找了一位随机的程序员，请教关于如何在硅谷获得工作的建议。\n\
  \n“我应该继续开发我的 App 吗？”我问他。\n\n“不用，”那哥们说，“你已经做了一大堆 App 了。你拥有几千万个十二岁的粉丝。但只有行业内部的人才会选择你加入团队，或向你推荐工作。你需要做的是像个大人物一样去社交。”然后，那哥们就走开去见一位重要人物了。\n\
  \n### 社交策略\n\n尽管这个建议很令人生畏，但它一直刻在我脑子里。我学习编程是因为我喜欢，而不是为了爬到顶端。但我经常在想，如果我当初没有给那个 Parse\
  \ 设计师发冷邮件推销 4 个 Snap，我就永远不会遇到那个邀请我制作视频并引起马克·扎克伯格注意的营销人员。谁知道如果我不去社交，我会在哪儿？可能在我父母家里吧——坐在厨房柜台前，为了下一个可能决定我命运的\
  \ App 汗流浃背。我再也不想感到那种脆弱和不安全感了。\n\n我向自己承诺，要把实习的剩余时间全部花在像大人物一样社交上。我从联系市场研究人员、数据科学家以及该层级的其他人开始，告诉他们我想了解他们的经验。很少有人拒绝和我见面。我发现，大多数人都会乐于把握这个当老师的机会。\n\
  \n我学到的秘诀是：不要谈论自己，除非说得足以让人们相信我有能力且值得他们投入时间。\n\n一个优秀的社交高手是自信的，别误会我的意思，但只要可能，我都会尝试将对话引向对方的成就。我会问：“你在这里是如何起步的？”然后我就闭嘴倾听。大多数人都喜欢谈论自己，所以通常他们会一直聊很久。\n\
  \n我最喜欢的窍门是在每段对话结束时问：“你愿意向我介绍三位你认为我应该认识的人吗？”我要求三个名字，是因为我觉得如果我只要求一个或两个，人们更容易说“现在脑子里一个没想到”。\n\
  \n### 建立联系\n\n我履行了自己像大人物一样社交的誓言，有时我一天会吃三次午饭或喝三杯奶茶。我遇到了能见到的每一个人。我和一位 Facebook 的厨师吃过卷饼，和\
  \ Instagram 的营销经理吃过冰淇淋，和一位公关管理员吃过披萨，以此类推。缓慢而确实，我认识了一个人，那个人介绍了另一个人，那个人又介绍了另一个，最后介绍了\
  \ Facebook 的首席营销官加里·布里格斯（Gary Briggs）。\n\nGary 是我在公司见到的第一个把衬衫塞进裤子的男人，一个面带微笑白发的成熟男性。当他在办公桌旁的会议室外与我握手的那一刻，我对与公司这样高层的人见面的紧张感就消失无了。\n\
  \n“所以，迈克尔，你觉得 Facebook 怎么样？”当我们坐在房间里的两个扶手椅上时他问道。\n\n“噢！”我说，“好吧，这是一个大问题！”\n\nGary\
  \ 笑了，“按你任何喜欢的方式回答都可以。”\n\n“嗯，你们拥有长期记忆和重大时刻发布的领地，”我开始说道，“那太棒了！我是这次重新设计的超级粉丝。在你们推出新设计的几个月里，我不断地刷新页面，而且，每天早上都会\
  \ Google 搜索如何获取最新的 Beta 版！噢，单列的时间线（Timeline）太赞了。我经常更新我的动态！”当我停下来呼吸时，我意识到自己听起来是多么不成熟且狂热。“抱歉，我只是对来到这里感到非常兴奋，”我说。\n\
  \n“嘿，不用道歉，”Gary 说，“这很棒！我有两个青少年。我希望我能让他们也对 Facebook 思考这么多！”\n\n“是的，我可能比大多数同龄的孩子更迷恋它，”我承认道。\n\
  \n### 对 Facebook 的洞察\n\n尽管我很迷恋 Facebook，但我清楚地看到公司未来面临着麻烦。“事实是，我这个年龄段的人对 Facebook\
  \ 产品的兴趣正在减退，因为发布的内容具有长期性。更不用说，我注意到每个用户的社交关系谱（friend graph）停滞不前，考虑到我们这个年龄段所处的人生阶段，这对我们来说很难接受的。在青少年生活的后期，社交关系谱变化非常快。Facebook\
  \ 没有为用户提供一种简单的方法让他们觉得产品反映了这种变化，”我解释道。\n\n“总之，我不想在这里表现得太书呆气，但我很想和你分享更多我的想法，关于我担心\
  \ Facebook 在不久将来必须解决的问题。和你聊天非常愉快，”我说，注意到时间快到了。\n\nGary 点了点头，若有所思。“和你聊天也很有趣。我们应该再聚聚。”\n\
  \n\n\n\n\n“哈哈，妈妈，他们不会开除我的。你不用担心那个。我知道你在担心——别担心。一切都好的。”（“Ha ha, Mami, they won’t\
  \ fire me. You don’t have to worry about that. I know you worry—don’t worry. Everything\
  \ is fine.”）\n\n然后，为了躲避她没完没了的教训，我采取了我唯一会的方法：转个话题。“记得你说过我听起来变轻盈了吗？嗯，你说得对。我确实感觉轻盈了。”\n\
  \n“轻盈”对我来说是个完美的词，尽管我又胖了几阿尔弗德多磅。自从我跳出自我开始关注他人，那种从初中学就开始一直跟着、如虎钳般的压力性头痛就停止了。这是我记忆中第一次毫不费力地直直腰板地站起来。\n\
  \n# 第 12 章：光芒或失败\n\n实习一个月后，我参加了我的第一次 Facebook 黑客马拉松（Hackathon）。在小时候，我从电影里形成这样一个印象：黑客总是坏坏的——就像邪恶天才入侵女主角的电脑来毁灭世界一样。那*确实*是黑客的一种。恶意黑客与我们计算机科学领域所说的黑客不同，后者是指那些乐于研究和发现新方法来构建和改进代码的人。所谓的“白帽黑客”是受过训练的专业人士，他们通过发现系统漏洞来帮助企业。在电影中，白帽派是恶意黑客的宿敌。\n\
  \n“黑客（Hacking）”在硅谷几乎是一个正面的词。它并不关乎破坏，而是关乎聚在一起解决问题并创造事物。当你进行黑客活动时，你不仅仅是在遵循指令和使用固定的配方工作。你是在使用自己的配料来组合某些东西，并让它属于你自己。\n\
  \n我在 Facebook 很快很快，公司的黑客马拉松（过去也是如此）是一项受推崇的传统——也是公司商业模式的关键。人们放下正式工作，连续三天编写他们想写的代码。无论你是工程师、律师还是人力资源专家，都可以参与，你可以单独作战也可以小组合作。三天结束后，你展示自己的项目，三个最好的项目将提交给马克·扎克伯格（Mark\
  \ Zuckerberg）审核。Facebook 的许多大功能——比如著名的点赞“like”按钮——都是从黑客马拉松中诞生的。\n\n6 月的一个周三，黑客马拉松协调员的一条公告出现在我的屏幕上，就在我的游戏控制台项目上方，那个项目还只有单行代码：“黑客马拉松时间到了。如果你参加，请告知你的经理你这几天不会露面。”\n\
  \n那天下午，我跟着大流涌向其中一间大组活动室参加迎会，迎接我们的是戴着墨镜、精力充沛得超自然的 Facebook 活动总监汉娜（Hannah）。\n\n“嘿，大家！”她用极度的热情对着房间大喊道，“你们准备好参加黑客马拉松训练营（Camp\
  \ Hackathona）了吗？”\n\n“好！”我跟着人群大声回应。私地里，我为整整三天无法安排任何咖啡或午餐约会感到遗憾。我很快意识到，我的实习并不意味着一定要写出什么惊人的代码；而是要确保尽可能多的人看到我通过那些代码所创造的价值。我仍然沉浸在那种新奇的人际连接中——当我把笔记本电脑留在桌上，坐在一个人的对面时，对方也在努力交谈而不看手机，当人们让他们谈论自己时，人们似乎会出奇地愿意这样做。我花了多年时间独自开发应用，以至于忘记了在学校和卢卡斯（Lucas）在一起——或者和玛丽娜（Mariana）和她的朋友在一起——与有血有肉的人大笑分享故事是什么感觉。在黑客马拉松上，我当然会被数百人包围，但那是另一回事。在全编程模式、眼神呆滞的程序员之间，不会发生什么深层对话。\n\
  \n但我恐惧黑客马拉松的更深层原因是，我害怕自己能力不够。我写代码真的只能每一步都求用 Google，我确定 Facebook 的其他程序员并非如此，他们看起来似乎都比我受过更好的教育。（后来事实证明我是错的：*所有*程序员在工作时都会查资料！而且我编程技能的某些方面是我所独有的。）\n\
  \n迎会结束后，汉娜开始向空中扔 T 恤，我加入了那场疯狂的抢夺大战，感觉自己就像像个在生日派对上长大的九岁小孩。T 恤上的图案包括“黑客马拉松训练营”字样，以及一幅喷射出黄色线条的营火画。我把它套在我的另一件\
  \ Facebook T 恤外面，等待指令。\n\n“好了，大家！”汉娜喊道，“找到你们的小组并想出想法！然后把项目发邮件告诉我们，就这样！大家都准备好了吗？”\n\
  \n“好！”我们再次齐喊。这位活动总监确实很胜任。我开始感到兴奋不已了。\n\n“好，去黑客吧！”她大喊道。\n\n我找到了三个来自 `Parse` 的同事，他们正蜷缩在休息室的沙发上，我问他们正在做什么。\n\
  \n“嘿，`Michael`，”`Parse` 的首席设计师 `Victor` 说，“我们正在考虑创建一个动态照片格式，来取代专辑的旧`grid-style`（网格化样式）。它会像拼贴一样，有尺寸和形状的变化，可能还有一些动作。”他解释道，通过人脸识别软件，网络中最重要的朋友的照片会被突出显示，而外圈的人在你的页面上获得的空间会更少。\n\
  \n公司的一位工程师补充道：“这将关乎讲述故事，而不仅仅摆上一堆照片，而是让它们互动。嘿，我们可以做一些动画！”也许他是在客气。我的一部分担心小组里的每个人都在想，我的加入意味着他们的工作增加了，而不是减少了。但我决定收起恐惧并加入其中。\n\
  \n一旦我们的导师 `Victor` 半不耐心地回答了我的几十个问题，我们四个人就趴在屏幕前，投入到代码编写中。这看起来完全不像电影里的样子——电影里 3D 图形和动画永远从程序员的屏幕上跳出来。到底，哪人怎么可能那样工作呢？`Objective-C`\
  \ 最初创建于 20 世纪 80 年代，是我学过的第一种“真正”的编程语言。在 2014 年，构建 iOS 设备产品仍需要它，所以我们都必须使用它。它非常老旧：大多数新新语言可以自动处理的内容，`Objective-C`\
  \ 都要求你使用大量笨拙的方括号手动输入。它也许是世界上字数最啰嗦的语言了。用 `Objective-C` 编写代码感觉就像在山上走了成千上万步小步，结果几小时后才发现你只是爬了一座小丘。我跟我团队正处于那种蠕虫式的进度中时，院子里的一阵活动吸引我们离开了屏幕。\n\
  \n\n\n\n显然，事后看来，Facebook 并不是在我们玩电脑时在无私私地向我们撒钱并提供免费食物。黑客松一直一直是公司商业模式的关键。当两百名工程师被释放出来去追求他们的热情项目时，极有可能产出某种改变游戏规则的功能。（我的一个团队项目——我完全没有功劳的那个后来被\
  \ Facebook 采纳并申请了专利。那是他们今天专辑的基础。）\n\n与此同时，黑客松让员工能够从日常琐碎工作中解脱出来，建立新的联系并为他们的创造力电池充电。归根结底，它们是巧妙且高效的生产力提取器。\n\
  \n如果你觉得我对 Facebook 的评价听起来有些过于理想化，请记住我是在 2014 年开始在那儿工作的。诚然，一些关于数据泄露的报告开始引起我们的关注，还有那些寻常的网络喷子，心理健康专家也开始向世界建议，也许每天花几个小时去“赞”我们那些更快乐、更富有朋友的朋友，对我们的自尊心并没有那么好处。但我想，我们大多数人从内部看出的观点是：嘿，当你拥有\
  \ 12.3 亿客户时（Facebook 当时的规模——现在已超过了 28 亿），并不是所有人都能成为快乐的客户。在那时，将 Facebook 的失误视为公司“快速行动，打破常规”（Move\
  \ Fast and Break Things）精神下不幸的副产品要容易得多。\n\n带着这个前提，我想花点谈谈为什么 Facebook 曾经、可能现在仍然是一个很好的工作场所。\n\
  \n如果你听过摩尔定律，你就知道计算机处理速度在过去的半个世纪里每两年就会翻一倍（尽管这可能很快结束）。自然地，这种加速导致了——并将继续导致就业格局的巨大变化。尽管问题日益增多，Facebook\
  \ 创造了一种文化，帮助员工不仅适应，而且在所有快速变化和发现中蓬勃发展。\n\n我希望有更多公司——所有的公司——都能学习 Facebook 投入和维持员工工作热情的创意方式。想象一下，如果商业世界的每个领域都培养员工的快乐和成长，而不是延续那种陈旧且完全过时的“只做我们雇佣你做的事”的模型，将会出现怎样的创新。\n\
  \n演讲结束。\n\n***\n\n—\n\n尽管我们在黑客松中取得了成功，但我对我分配的那个我不感兴趣的项目感到担心。“我的实习生确实不俗，”Jake 在黑客松结束几天后对一群\
  \ Facebook 员工说。我们当时在一家校园内的墨西哥餐厅，那里在五点后供应玛格丽酒，所有达到饮酒年龄的人都笑得格外大声。我也笑了，紧张地抿着我那杯空了的无玛格丽酒。\n\
  \n“我不是在开玩笑，”Jake 带着坏笑看着我，“快一个月了，我还是不知道 Michael 在做什么。”\n\n“迈克尔，除了出去吃午饭你最近在忙什么？”一个叫\
  \ Kevin 的高级开发人员问道，我上周刚邀请他吃过午饭。\n\n“呃——”我在椅子上挪了挪位置。“我一直在制作几个按钮，人们可以放在自己的页面上用来——”\n\
  \n“那些该死的按钮！”Jake 打断了我，拍着桌子强调。\n\n大家都笑了。我看着桌子。\n\n“嗯，我对实现自己的想法感到非常兴奋，我也对这些按钮的细微动画过渡效果感到非常自豪。但我还没有弄清楚如何对这个实习生项目感到兴奋。”\n\
  \nJake 摊开手。“这话可是十七岁实习生说的！”\n\nKevin 看起来更同情一些。“你是在说你不知道如何获得动力，还是你不想获得？”\n\n我思考了一会儿。“我只知道……如果我无法对脑海中看到的成品感到兴奋，我似乎就无法开始。”\n\
  \nKevin 响了响手指。“你应该和我的朋友 Andrew 聊聊。他刚升为工程经理，他是一个长引导别人解决问题的天才。”\n\n“那太棒了！”我说，感觉到 Jake\
  \ 正在翻白眼。我知道他觉得我像个被惯的婴儿，但我不在乎。起初我很感激他管理我的放手方式，但现在我需要一些严肃的指导。\n\n***\n\n—\n\nAndrew\
  \ 在我的视频聊天屏幕上，正在擦鼻子。他正在密歇根探望奶奶，感冒了，但多亏了 Kevin 的推荐，他还是接受了我的聊天邀请。\n\n“所以你的意思是你想被全职录取——但你不知道如何说服自己工作？”他皱着眉头说。\n\
  \n“基本上是，是的，”我承认道。我显然是个白痴。一个用愚蠢的非问题在浪费陌生人探望奶奶时间的白痴。我摇了摇头。“抱歉，你知道吗？我会解决的。我不是故意打扰你。”\n\
  \n“你没有打扰我，”Andrew 揉了揉他棕色的卷发说，“我现在是经理了，所以帮助别人是我的工作。”我舒了一口气。“而且我可以告诉你，如果你不尽快振作起来，你是不可能被录取的。”\n\
  \n“对，”我说，咽下喉咙里的一块酸。\n\n“如果你有灵感，编写那个模块项目你需要多久？”Andrew 问道。\n\n“噢，老兄，大约两周！”\n\n“而你还有一个月时间？”\n\
  \n我用力点头。他实际上在认真对待我的问题。\n\n“我想你应该这样做，”Andrew 坚定地说道，“你应该直接在两周内完成它，然后你可以去做你感兴趣的事，如果你想在\
  \ Facebook 做下去的话。”\n\n“所以你的意思是你想被全职录取——但你不知道如何说服自己工作？”他皱着眉头说。\n\n“基本上是，是的，”我承认道。我显然是个白痴。一个用愚蠢的非问题在浪费陌生人探望奶奶时间的白痴。我摇了摇头。“抱歉，你知道吗？我会解决的。我不是故意打扰你。”\n\
  \n“你没有打扰我，”Andrew 揉了揉他棕色的卷发说，“我现在是经理了，所以帮助别人是我的工作。”我舒了一口气。“而且我可以告诉你，如果你不尽快振作起来，你是不可能被录取的。”\n\
  \n\n\n\n我的老师每周都会给我们分一个新课题。每个学生都会轮流站在教室前面，在没有任何照片或笔记的情况下，针对该主题连续不断地演讲四十五分钟；在我们身后有一张幻灯片，我们必须不断翻页，而不能回头看一眼。之后，有十五分钟的问答环节，其他学生会竞相向我们提问尽可能刁钻的问题，试图扣掉我们的分数。我们变得非常擅长应对那些试图为难我们的人。最重要的是，我们学到了演讲不仅关乎言辞，更关乎情感。传达出你希望观众感受到的情感至关重要。\n\
  \n我的六年级老师教给我们的另一个关键点：始终要在事实中编织一个故事。于是，我讲述了构建 `4 Snaps` 时遇到的困难，以及我刚刚设计的那个简单、精简的 `Swift`\
  \ 模块正是我那时可能需要的工具。\n\n在我回答完一轮问题后，小组报起了掌。杰克脸上惊讶的表情格外让我倍感快慰。我决定利用这个机会，在大家陆续离开会议室时跟上了他。\n\
  \n“嗨！我希望你喜欢那场演讲！”\n\n“我很喜欢，做得好，”他说。\n\n“你觉得你可以向安娜斯塔莉亚（Anastasia）提一下情况吗？”我追问道，“因为我非常希望能被考虑这份全职工作。”安娜斯塔莉亚是一个高个、口音很重的东欧女性，是实习生项目的负责人。作为撰写我最终评价的人，她也掌握着我未来的钥匙。我已经给她发过三封邮件，告诉她我想留在\
  \ `Facebook` 继续留工作的意愿。她的回答总是模糊且简短。她暗示公司通常不会在人们上大学之前招用全职人员——`Facebook` 不想剥夺年轻人追求高等教育的机会。作为回应，我比她更多地暗示了我对上大学毫无兴趣，无论\
  \ `Facebook` 是否录用我——并指出在编程领域，技能比背景更重要。我只希望我对大学的不兴趣能带来一种清新的变化，也许公司已经听腻了什么“哈佛”这个、“斯坦福”那个了。我确实听腻了。\n\
  \n2014 年 8 月 25 日，在我十八岁生日后的第二天，安娜斯塔莉亚把我叫进会议室。由于太担心自己是否会被录用而紧张得失眠，我在我关上门的那一刻就进入了自动驾驶模式，我不记得接下来发生了什么了。完全的记忆空白。\n\
  \n当会议结束时，我处于极度震惊和宽慰的状态中，以至于无法告诉你我刚刚接受的这份工作的任何细节：我的头衔将是 `software engineer`；年薪将是\
  \ `$110,000` 加上奖金、大量的 `Facebook` 股票以及丰盛的福利；我将在六周后入职。当我走到室外进入明亮的院子时，我只知道对我来说最重要的：我做到了。我有了一份每月发两次工资的全职工作。因为我十八岁了，我可以存下钱，而且那些钱将是我的。我终于有了安全感。\n\
  \n# 第 13 章\n\n## 苦乐参半的独立\n\n被录用后，我做的第一件事就是冲出大楼，给爸爸妈妈打电话。我告诉过他们我今天要和实习生负责人见面，妈妈响了半声电话就接了。“迈克尔？”她的声音像往常紧张时一样颤抖。“得到工作了吗？”等我不我回答，我听到“咔哒”一声，我爸爸洪亮的男低音通过电话传进来：“`Hola`,\
  \ `hijo!` 有什么消息？”\n\n“是的，是的，我拿到了！”我一边蹦跳一边说。他们都流了泪。\n\n他们为我高兴，但可能也感到一丝内疚——以及宽慰。\n\
  \n被录用后我做的第二件事是在 `Instagram` 和 `Facebook` 上发布动态：\n\n> 在 Facebook 的这次实习太棒了，但还没有结束。Facebook\
  \ 给了我一份工程师的全职工作。冒险才开始！\n\n很快，来自新同事的祝贺开始点亮我的屏幕。连马克·扎克伯格（Mark Zuckerberg）也通过 `Messenger`\
  \ 给我写信说：“我们期待看到你的创造”，这出乎我的意料。到午夜，来自玻利维亚、秘鲁和哥伦比亚的记者已经写信要求采访。我并没有考虑到这可能与我那以保密闻称的新雇主产生问题，所以我对他们每一个人都回复：“没问题！”\n\
  \n被录用后我做的第三件事是去银行开了一个除我之外没人能访问的全新账户。因为直到现在我一直未成年，我实习期间赚的 `$21,000` 直接进入了由妈妈拥有完全控制权的账户。我一直没有动过那笔钱，因为\
  \ `Facebook` 支付了我的食物、交通以及所有的基本日常开销。\n\n在银行，我跟着一位和蔼的女士进入一个小小的隔间，把我印有 `Facebook` 标志的背包放在她的桌子上，递给了她那张从未用过的银行卡。“我们可以把我旧账户里的钱转到新账户吗？”我问道。我甚至没有检查过余额，但我认为既然妈妈最近没向我要钱，我应该有一大笔钱可以从旧账户转到新账户。这将为\
  \ `Tío Kike` 一直催促我开设的储蓄账户打下良好的基础。\n\n那位女士输入了一些字，然后透过眼镜上方看着我。“没问题。你的当前账户余额是七十七美元。”\n\
  \n“什么？”我惊叫道，猛地站了起来，“这不对！”\n\n银行员咯咯笑了，摇了摇头。“坐下，孩子，”她说，用一种幼儿园老师的语气向我解释办理流程。\n\n“那么，让我们决定你需要什么样的账户吧，孩子！你现在有工作了吗？”\n\
  \n当我告诉她我的年薪是 `$100,000` 时，那个女士睁大了眼睛。她打了一个电话，随后一个穿西装的男人出现了，带我进了一间更豪华的办公室。在那里，我被提供了气泡水以及一系列信用卡和证券账户选项。\n\
  \n“呃，”我说，“我只想要一个可以存钱进去且真的不取出的账户。”\n\n令那个西装男非常失望，我最终选择了这样一种账户：如果账户没有剩余资金，你的借记卡会被拒绝，而且每月取取超过两次现金就会被收取费用。由于我从未学会过存款，我需要尽可能多的激励。\n\
  \n那天晚上，我给妈妈打电话，假装随意地告诉我开了一个新的 `Chase` 账户，我的 `Facebook` 工资现在将存入那里。\n\n沉默了一会儿，然后妈妈用过分欢快的声音说：“真为你感到高兴！太棒了！”\n\
  \n“真的吗？”我说，感到如释重负。\n\n“是的，当然了！你十八岁了，就该这样。”\n\n“也许你可以把密码给我，以防万一？”\n\n我把头埋在手里，没说话。\n\
  \n“哈哈，我开玩笑的！”妈妈咯咯叫着。无论她是不是真的，我那一刻就知道，光靠一个新账户无法帮助我的父母重新建立自己的独立。但嘿，这是一个开始。\n\n\n\n\
  \n再过一周，我就得独立生活了。不再有实习，不再有免费的兼职。找房的前景让我充满了恐惧。由于不知道从何处开始，我把这事抛到了脑后。当实习结束时，我收拾行李箱；和室友约翰告别；飞回了迈阿密的的家。在接下来的一个月里，我睡觉、看电视，去了两次迪士尼乐园——当然，是我付了全家人的票钱——看了十来场电影，吃了很多东西，并努力不干涉父母持续不断的财务闹剧。他们已经不再向我透露他们的财务状况，但我能看出情况并没有任何好转。我父亲第三次尝试房地产事业仍然没有起色，我母亲正在考虑开办一家珠宝店。随着我\
  \ `Facebook` 的入职日期临近，而我的住房问题还没有奇迹般地解决，我在 `Facebook` 上发了一篇简单的“求租房”帖子。几小时后，一个我在网上认识一点、但从未见过面的男人给我发了消息，说他在旧金山的一栋“黑客小屋”里空出了房间。*哇，这太简单了，*我想着。“我有兴趣！”我回道，“有细节吗？”\n\
  \n大体情况是房子里的每个人（他没说有多少人，我不知为何没想起来问）都是二十出头的年轻人。他们就是所谓的硅谷黑客——那些讨厌全职工作、独立编码的独行侠，通过偶尔出售他们的\
  \ `apps` 来赚点钱。租金是 `$1,350`，我觉得听起来非常贵，但我急于敲定住处，所以在在返回加州的前的一周前，我向那个男人确认了我想住进那栋黑客小屋。\n\
  \n一周后，我飞回旧金山，并在晚上十点左右直接从机场 `Uber` 到了市里的新家。它位于卡斯特罗区（Castro District）的中心，在早高峰期间前往梅洛帕克的\
  \ `Facebook` 需要两个小时通勤。大多数硅谷的年轻员工都住在市内，每天乘坐免费的 `Facebook` 和 `Google` 班车往返于。我并不期待通勤，但我认为我这个年纪的人住在旧金山一定有理由，所以这是值得的。\n\
  \n刚下车的那一刻，后悔的情绪涌上心头。这是一个冷骨的周日晚上，醉醉醺的、半裸着身的男们从嘈闹的酒吧里踉跄而出，对着寒冷尖叫，撞在流浪汉身上，而流浪汉穿着肮兮兮的睡袋和简易避难所挤在人行道上。“该死，”我低声自道，试图假装一切如常。警报声大作，一排警车飞驰而过，闯了红灯。我紧紧握住行李箱的手，绕过一个趴在写着“任何帮助都行”的纸板牌下的、无名昏迷男人的腿走了过去。\n\
  \n在迈阿密，你很少看到人们住在街头。那里实在太热了。我听说加利福尼亚州的无无家可归者比任何其他州都多。由于过去二十年大科技崛起导致的住房短缺和财富泡沫，旧金山和整个硅谷的流浪汉人口特别多。这里的科技工程师将其薪水的\
  \ 40% 到 50% 用于租金，没有留下多少钱储蓄、买房或在校外用餐。一些硅谷的首席执行官，比如 `Salesforce` 的 `Marc Benioff`，已经开始投入数十亿美元来资助医院和避难所，但显然，这还不够。\n\
  \n我手机上的 `GPS` 告诉我我已到达目的地，但我没看到任何住宅，只有餐厅、夜店和纹身店。在街上来回走走了二分钟后，我终于拦下了一个至少穿得整齐且在直走的男人。\n\
  \n“嘿，”我说道，努力听起来很自然，“你知道这个地方在哪吗？”我向他展示手机上的地图，祈祷他不要抢过手机跑掉。\n\n“就在那儿，兄弟。”他指着一个夹在同性恋夜店和一家破旧咖啡馆之间的昏暗狭窄楼梯，底部的台阶被一个穿着破旧军服的男人和他那只同样看起来破不堪的狗挡住了。我绕过他们，在室友说好的留钥匙的垫子下找到了钥匙。真让人安心。当我笨手拨弄锁时，感到那个迷彩服男人冰冷的目光盯着我的后背。\n\
  \n进入室内，我走进了一个看起来就像直接从《海军刑事调查》（*NCIS*）里走出来的毒窟，除了那六个几个缩在破沙发上的、看起来邋遢的哥们正疯狂地敲击 `laptops`。那地方充斥着垃圾味，到处都是啤酒瓶和空披萨盒。一个投影仪在破裂的墙上播放着\
  \ `YouTube` 上的动画。在我在那儿站了一会儿，接受着这场噩梦后，几个哥们终于注意到了我。他们打了一句“哟？”然后又回去忙自己的了。黑暗中很难看清，但这些家伙看起来都不像我一直在交流的那个男人的头像，所以我给他发了信息：“我到了。”他立刻回道：“你的房间是右边第二个。”我环顾四周，没看到任何门。\n\
  \n“右边，哪儿？”我颤抖着手指回道。我只想关上一扇门，把自己和这破鬼地方隔离开，忘记现在正在发生的一切。\n\n当我等待回复时，大门被推开，又一群男人踉跄着走进房间，在开始上楼梯时将我推在墙上。\n\
  \n\n\n\n那里感觉是一个每个人都脑子里充满点子，没有人只是坐在那儿等好运降临的地方。人们说在洛杉矶，每个人都在写剧本；在 20 世纪 10 代中期的硅谷，每个人都在开发\
  \ App。问问任何不满三十岁的 Uber 司机、咖啡师或遛狗师关于他们的生活，他们都会告诉你他们正计划实现一个价值百万美元的 App 点子，只要他们负担得起抽出时间，就会让这个想法变成现实。问问任何软件工程师他们是否认为科技会拯救世界，他们会告诉你：“`废话，那是肯定的`。”\n\
  \n我不确定这是否真实，但尽管如此，硅谷依然发掘了我内心中乐观者的一面。\n\n***\n\n***\n\n### 营训练体验\n\n当你作为全职员工加入 Facebook\
  \ 时，你会直接进入营训练。在两个月的时间里，你的工作是学习 Facebook 如何运作，从基础设施开始层层学习。这里有关于多样性、广告与变现、心理健康以及如何利用公司数百万计福利的课程。你会被分配给一名营训练导师，他会带你完成入职流程，并成为你事实上的顾问。\n\
  \n在那两个月的窗口期，每一位“营训练工程师”（他们这样称呼新员工）都处于招聘状态。来自公司各处的经理会激烈竞争，将最优秀的程序员吸引到自己的团队中。这就像大学希腊字母系的入会周（pledge\
  \ week），只不过这些“入誓者”掌握着所有的权力，因为每个团队都需要尽可能多的新鲜血液。一旦营训练学员接受了某个团队的邀请，他们预计至少要坚持该选择几个月；之后，如果他们想，就可以自由切换团队。\n\
  \n在我入职的前几周，有几个团队邀请我加入，但我一直拖延没有接受提议，因为我对他们正在进行的项目并不感兴趣。得益于我的实习经历，我记忆犹新：当我的直觉说“不”时，我不应该答应。\n\
  \n### Snapchat 的威胁\n\n我的直觉告诉我，要坚持下去，直到找到一个正在解决我从实习期间就开始注意的问题团队：Snapchat 的威胁。2014\
  \ 年，Snapchat 刚刚变得非常流行，我认识的每个人都喜欢它。但当 Snapchat 俘获了美国所有的青少年时，Facebook 在大多数孩子的社交媒体生活中还是个局外人。当然，我们用它进行学校聚会和其他父母许可的活动，但它并不是我们去闲逛和做回自己的地方。Facebook\
  \ 的人一定对此感到恐慌了，不是吗？其实并没。一方面，Facebook 在 2012 年以 10 亿美元收购了 Instagram，最近又斥了 190 亿美元收购了消息软件\
  \ WhatsApp。但尽管有了这些收购，他们在试图捕捉并吸引年轻用户时，仍然面临着严峻的挑战。我从公司一些人身上观察到的普遍态度是：“`没什么好担心的。我们无不可敌的。Snapchat\
  \ 只是某些青少年使用的某个随机 App`。”\n\n### 向高管层汇报\n\n我推辞了我的营训练导师 Jack 的恳求，让他“随便选一个团队，哪个都行！”我把所有时间花在构思自己的项目上——一个\
  \ Facebook 可以用来与 Snapchat 庞大的青少年市场竞争的 App。Jack 非常喜欢这个概念。\n\n他帮我联系了他的经理，我也向那位经理做了同样的演示报告。那位经理说：“我想让\
  \ Chris Cox 看到这个。”\n\n首席产品官 Chris Cox 也喜欢这个概念，并迅速安排了一个时间让我向公司高管层汇报，包括扎克伯格本人。走进会议室时的我紧张成一团。当我到达时，扎克伯格和其他人坐在沙发上，他们齐地从手机上抬头看向我，像一个拥有八头的单一生物——掌握着八颗非常有价值的大脑。在他们冷静的专业表现之下，我从一些高管紧绷的下颚和挺直的姿态推断出，他们和我一样紧张。他们指望我能把主意卖给他们的老板，这样他们就可以归功于自己洞察了它的潜力，并培养了可能是\
  \ Facebook 理解青少年群体的关键。\n\n“嘿，迈克尔，坐吧，”Cox 指着旁边电视显示器旁沙发上的一个空位说道。\n\n我盯着了沙发上的那个位置，试图决定该怎么办。每当我一次演示我的概念时，我都是站在观众面前完成的。我的六年级老师，演讲界的“优达大师”，曾教过我们站立是关键，是传达你希望观众感受到的兴奋感和能量的最佳方式。六年级的方法以前从未让我失败过，我需要每一个可以获得的优势。但另一方面，工程经理\
  \ Andrew 曾在实习期间帮助我理清头绪，并且在我需要应对 Facebook 世界的帮助时一直是我的首选，他警告过我今天不要站着。“当你推销产品时，”他说，“你可能需要降低调调，在桌旁表现得像个成年人。”\n\
  \n“嘿，马克，”我说，“你记得我吗？我是迈克尔·赛曼。”\n\n“是的，我当然记得你，”扎克伯格回答道，尽管他的表情没有给我任何暗示。\n\n我太紧张了，根本无法坐着完成。“我站着可以吗？”我问了那位万富翁。\n\
  \n“嗯，当然可以，”他说。\n\n房间里的某些人笑了起来，其他人则看起来很困惑。但当我带着兴奋、激情和能量开始演示时，我从副总裁和总监们松了一口气的神情中看出他们很高兴。可能还觉得很有趣，但我不在乎。\n\
  \n当我结束时，所有的目光都转向了领袖，等他说话。扎克伯格并不急于。他看向窗外，又看了看天花板。\n\n“嗯，”他终于说道，“我觉得——我觉得这很有趣……”\n\
  \n总监和副总裁们点了点头，身体向前前倾。\n\n“但总的来说，”我们的领袖继续说道，“我不太看出它和 Instagram 有什么区别。我想，这个概念很酷，我个人非常喜欢其中的部分，但我还不确定整个计划。”\n\
  \n我在心里默默责备自己没有像个成年人一样坐在桌旁。我搞砸了。\n\n几天后，我收到消息，扎克伯格给了我绿灯，允许 Facebook 创建一个专注于青少年群体的新团队。于是，我开始了从营训练中招募工程师加入我的团队。\n\
  \n***\n\n***\n\n我知道我在公司取得的成功并不是因为我超级聪明。我拥有作为 Facebook 最年轻的人之一的优势，现在我想把这种优势转化为更多。Facebook\
  \ 是大学生——扎克伯格和朋友为了大学生创立的，这就是它几乎立即成功的秘密。为了了解他们的观众想要什么，创始人们不需要焦点小组和数据分析——他们只需要看看自己和他们的朋友即可。\n\
  \n\n\n\n意识到似乎没有人在关注这个极其可靠的威胁，我整理了一份关于青少年社交媒体习惯的演示文稿，并邀请了公司里我认识的所有人来听。在开始我口中的“青少年面对面会”（Teen\
  \ Talk）之前，我让我那群大多是三十多岁的观众做了一份关于青少年文化的小测验，问题诸如：“‘lit’这个词可以接受的使用场景有哪些？”以及“这位顶尖青少年网红创立了哪支乐队？”正如我所预料的那样，大家都考得一惨惨睹。满是不及格。我向观众保证，这完全可以理解。现在，他们至少意识到自己对青少年市场的了解是多么匮乏，以及这一关键群体对社交网络的需求是什么。随后，我逐一介绍了每个不同的社交网络，并解释了青少年是如何使用它们的。比如：我们每月在\
  \ `Instagram` 上发布一次动态，几乎不在 `Facebook` 上发布，偶尔使用 `Twitter`，而我们非常喜欢 `Snapchat` 且整天都在用它。\n\
  \n我们在成长期阶段使用的通信工具将塑造我们余生的交流方式和看待世界视角。在向观众解释了这个概念后，我提醒他们，我这一伴随 `iPhones` 长大的一代，其交流方式与那些习惯了仅用手机通话长大的的人不同。用\
  \ `Snapchat` 给站在我们同一个房间里的朋友打个招呼感觉很自然。在互联网上和从未在现实生活中见过的人聊一年也感觉很自然。对我们来说，把手机看作自己的延伸并没有什么忧伤的。\n\
  \n人们非常喜欢我的“青少年面对面会”，并请我做更多演讲，涵盖不同的主题和重点……演示变得变得越来越精良，在一个月内，我已经在面对数百名产品经理、设计主管和工程师的房间里演讲，同时还有许多人在在线观看。一点一点地，`Facebookers`\
  \ 开始开始承认：*没错，也许我们确实需要做得更多来应对我们的年轻观众。*\n\n顺着这种势头，我开始在公司全员 `Facebook` 页面上定期发布关于青少年参与度的“笔记”。每隔一两天，我就会发另一篇。\n\
  \n一天晚上，我正坐着班车回家，无意中听到两个显然刚大学毕业的男程序员——一个穿着斯坦福的连帽衫，另一个身上挂满了麻省理工的周边产品——在谈论我：\n\n“嘿，你读过那个青少年面对面会哥们发的新笔记了吗？”\n\
  \n“`Facebook` 有这么多用户。不太可能那么糟吧。”\n\n“是啊，就像是：‘谢谢你的业务开发建议，小子！’”\n\n“不是吗？等你在行业混了几年后再跟我谈吧。”\n\
  \n*笑声。*\n\n***\n\n—\n\n第二天，我取消关注了我所有的成年 `Facebook` 朋友，包括我的同事。在只剩下青少年朋友后，我刷新了动态流。那里什么都没有。好吧，当然跳出了几个广告，但没有动态。\n\
  \n我为我那单调的动态截了图，并对这次实验写了一篇笔记，标题为“对于像我这个年龄的人来说，`Facebook` 是这样的”。然后我重新关注了我的同事，并将这篇笔记发布到了公司内部页面。\n\
  \n另一次，我让 Mariana 的所有朋友给他们的手机屏幕截屏，以证明 `Facebook` 应用在他们设备上的位置比其他社交应用更难触及。（当然，`Snapchat`\
  \ 位于每个人的正前方。）在我发布了关于那个内容后，`Chris Cox` 请求使用我的截图用于他关于青少年参与度的演示。但如果你实际上不是一个青少年，就很难进入青少年的大脑。一位了解我在做什么的老同事建议我们，在\
  \ `Facebook` 上创建一个“青少年区”，让青少年可以在那里玩得开心！我听到这话时简直快气疯了。青少年区？呵呵。哪个青少年想被关进一个区域里。\n\n\
  ***\n\n—\n\n这是一个进退两难的局面。作为 `Facebook` 最年轻的员工是我最大的优势，也是我最大的劣势。无论像 `Chris Cox` 这样的领导有多看重我的观点并遵循我发布的每一份内部笔记和做的每一场演讲，仅仅为了被严肃对待依然是一场持久的战斗。\n\
  \n我在 `Facebook` 预料到的一件事是，房间里的“大人们”会自动假设我提出的任何想法都是我的一时兴起。“好主意，”他们会说，“你对它充满热情很棒。但我们需要数据支持支持。”结果，我变得更擅长在每次汇报中带上大量数据了。\n\
  \n***\n\n—\n\n当我还是个有点叛气的青少年时，我给我的内部帖子命名为 `TeenZone` 以示开玩笑（我很确定，我的同事们从未想过我是在用讽刺的语气说这个词），但我变得更擅长倾听了。我努力听取他人的意见并寻求反馈（这总是是反击那些试图让你吃挫头的人的好方法！）。我学会了强调我的年龄不是弱点，而是一种力量。\n\
  \n利用我所获得的新势头，我开始推动副总裁和高管们关注 `Snapchat` 的威胁。当时，许多人的文化和心态都是对 `Snapchat` 不屑一顾。但我直觉告诉我，轻视这个社交媒体巨头是个坏主意。\n\
  \n# 第 14 章\n\n## 多样化培训\n\n在 `Mark Zuckerberg` 给我绿灯让我组建一个由三名工程师和一个设计师组成的自己的团队几周后，我开始招聘工程师。`Andrew`\
  \ 从我的导师变成了我的朋友——我们不断发短信，每周至少吃一次晚餐——他向我介绍了一位被认为是公司最优秀的人之一。当他同意成为我的首席工程师时，我认为这是对我项目的认可。我也对这个男生感到有些压力，他以编写可以在多个产品之间重复使用的极高效代码而闻名。\n\
  \n我现在被要求像产品经理一样工作，而不是代码，但我没有管理团队的经验。\n\n我知道如何让人们认可我的想法，但我发现帮助他们执行这些想法具有挑战性。主要是因为我在调度和设定合理预期方面缺乏经验。\n\
  \n“嘿，Michael，”我的首席工程师语气带着一丝担忧，“那些原型进展得怎么样了？”原型是交互设计过程中的一个关键部分，我的工程师从一开始就应该拥有它。它是游戏或网站关键页面上存在的界面元素的插图，是团队每个成员遵循的地图。作为一个视觉化思考者，我在与设计师合作产出项目原型方面并没有任何困难。但每当我们刚画出一个东西，我就会把它丢掉并重新开始。没有人知道：我之所以花这么多时间完成这些关键的产品设计原型，是因为我开始对这个想法本身失去了信心。\n\
  \n如果 Zuckerberg 是对的呢？如果它和 `Instagram` 的区别不够大呢？我重画原型的次数越多，我就越理解我们试图解决的问题的根源，我内心的怀疑就越强烈，窒息了我的灵感。\n\
  \n\n\n我的犹豫不决和新手般的管理风格对我们所有人来说都是一种尝试。但当我的团队成员每天晚上都能顺利回家，通过啤酒、萨萨舞课或陪伴孩子来缓解一天的压力时，我却\
  \ 24 小时生活在怀疑中。这正让我变成一个神经质质的疯子。下午六点，我的团队就会撤离，而我会一直工作到深夜，我唯一的伙伴就是晚间的保洁人员。甚至在*他们*离开后，我发现自己坐在黑暗中，对着空气挥手以捕捉光感应器的信号，并吃蛋白棒当晚餐。我没有爱好。我不参加任何运动。工作在我累到无法睁开眼时结束，而在我再次睁开眼的那一刻便重新开始。\n\
  \n我不仅负责这个团队以及我们正在构建的产品，还花费了无数小时编写我每月的 `Teen Talks` 和 `TeenZone` 简报，公司成千上万的产品负责人和工程师都订阅了这些简报。此外，我还独立帮助\
  \ `Facebook` 的执行团队为 `Snapchat` 问题制定策略，参加了那些会议中除了我以外，每个人都是公司的总裁或首席官的会议。最糟糕的是，我还在周末通过反复互相发\
  \ Snapchat 来帮助 `Zuckerberg` 学习如何使用 `Snapchat`。我的电脑屏幕一片混乱：里面装满了我计划在演讲中使用的设计截图、我团队正在构建的产品模型，以及来自全公司产品负责人的各种未回复的会议邀请。我还花了几小时试图预测\
  \ `Snapchat` 的下一步行动。我在各种产品策略会议上提出的许多预测最终都证明是准确的，我在公司内部的信誉也随之增长。由于担心倦怠，我有时会选择在家里或校园咖啡馆工作，无视手机响不停的通知。但我无法忽视\
  \ `Facebook` 的传播团队。\n\n* * *\n\n——\n\n“所以，现在是 `Today` 节目，对吧？”\n\n传播副总裁正通过会议室墙上一个巨大的显示器向我说话，他的团队成员围坐在桌子旁，我的两侧。我想\
  \ `Facebook` 的首席技术官也在那里，也许是为了给我提供精神支持。他一直非常支持我，总是试图理解我。我很高兴他加入了。我被召集来讨论收到的一份参加 `Today`\
  \ 节目的邀请——房间里除我以外的每个人都认为我应该拒绝这份邀请。\n\n诚然，我收到了相当多的媒体询问。在我在社交媒体上发布我被聘入 `Facebook` 的消息后，大量南美记者要求采访我，关于我作为这家最知名社交媒体巨头之一最年轻入职者的身份。鉴于硅谷缺乏多样性，特别是在\
  \ `Facebook`（拉丁裔占员工总数的比例不足 4%），对于许多南美人来说，他们自己人之一爬得如此高、如此快，确实是一件大事件。\n\n从我十二岁起就开始报道我故事的记者们继续关注我那引人眼球的背景故事：我是如何帮助父母度过大衰退的。我的感觉，因为我的父母不再出现在我接受采访的房间里，这些记者觉得可以放松去挖掘他们多年来一直宣传的励志叙事之外的内容了。当他们问：“你是如何决定帮助你父母的？”时，我会给他们坚定的目光说：“我为什么不这样做呢？”然后把对话引向*我*想谈的话题：我是如何证明任何任何背景的人都可以编写代码的。\n\
  \n我经常会想起在玻利维亚旅行时遇到的一个十五岁女孩。我观察你很久了，”那个女孩说，她是从一个坐车四小时的小镇赶来的。她送给我一个她织制的串珠手链，上面写着一句西班牙语短语：`Ni\
  \ En Broma Digas Que Es Imposible`（“别开玩笑说不可能”）。这是我喜欢在拉丁美洲讲座结束时引用的名言。她记得，这对她来说意义重大。\n\
  \n对我来说，继续向其他梦想从未契合模式的孩子们分享我的故事是理所应当的。但副总裁说得对。“你现在在 `Facebook` 工作，”屏幕上的副总裁说，“你不能直接上电视随心所欲地说。”我能感觉到汗水顺着肋骨侧流下，从好的一面来说，这开始让我感觉到存在——我开始减肥了！\n\
  \n“迈克，”CTO 说，“我知道你的动机是真实的，但我认为他是对的。也许这次缺席更好。”\n\n我告诉传播团队，我想上 `Today` 是为了让 `Facebook`\
  \ 看起来对年轻、多样化的程序员更具吸引力。但他们对这个想法似乎并不兴奋。众所周知，即使是在镜头外分享在公司工作的故事的机会通常也是不予考虑的。我认为 `Facebook`\
  \ 和硅谷的大多数公司一样，可以利用这样的故事鼓励更多拉丁裔在他们的行业内追求职业。\n\n事实上，传播团队可能不想在一个说话有点张扬的新入职青少年身上冒险。他们谨慎的心态有其原因的。这是\
  \ `Mark Zuckerberg` 从哈佛时代起一直来的工作方式。这也是他们现在工作的方式，很少允许 `Zuckerberg` 和偶尔的首席运营官 `Sheryl\
  \ Sandberg` 之外的人与媒体交流。即使是*他们*也只在非常特定的情况下这样做。谢天我足够聪明，拒绝了 `Univision` 团队的请求。\n\n\n\
  \n\n\n据我所知，我和 Facebook 的其他所有人一样，非常推崇麦克辛·威廉姆斯（Maxine Williams）。我经常在校园看到她，她休闲而优雅，对每个人微笑挥手。她在公司担任着被认为最重要的职位之一，她将其描述为“扩大申请\
  \ Facebook 职位的人才漏斗”。她公开承认，数据是惨淡的：很少有拉丁裔和非洲裔人甚至愿意申请这家公司。结果，Facebook 的员工构成与美国的人口结构完全不同——这不仅是\
  \ Facebook 的问题，而是整个硅谷的问题。麦克辛试图正面解决这个问题，通过访问高中和低收入社区，鼓励这些背景的孩子投身计算机科学事业——并让他们忽视那些告诉他们这不可能的人。\n\
  \n谈到员工与麦克辛的个人关系时，她有一种仙女教母般的气质，能让我们每个人都觉得自己有归属感。我经常想起她在一次强制性的多样性研讨会上向我的训练营小组讲述的故事。她的故事开头是：“我来自加勒比地区，但我不会游泳。你们知道为什么吗？”\n\
  \n满屋大多是白人脸盯着她。麦克辛耐心地点了点头。这似乎是她习惯了的观众反应。\n\n“你怕水吗？”有人提问。麦克辛摇了摇头。不是那样。\n\n“你住得离海岸很远，所以没机会学？”另一位新入者问道。\n\
  \n“不，不，我就住在海边，”麦克辛说。\n\n最后，房间里一位非洲裔女性举起了手。“是因为你的头发吗？”\n\n“没错！”麦克辛笑了起来，“你是唯一一个懂的人！”她向我们其他人解释道，盐水对她的黑人头发构成了挑战。\n\
  \n我来自这样的家庭：在那里，无论用什么语言都不会提到“制度性种族主义”、“微侵犯”或“安全空间”等词；在那里，某人的秘鲁妈妈可能会说类似这样的话：“别担心，玛丽娜（Mariana），你总可以嫁个富翁！”；在那里的孩子们仍然用“同性恋（gay）”作为贬义词，所以多样性培训对我来说大开眼界。\n\
  \n虽然我知道麦克辛比 Facebook 的普通人、甚至可能比任何地方的人更有洞察力，但我对她愿意花这么多时间陪我这样一个低级菜鸟感到惊讶。据我理解，麦克辛的工作并不是做员工的人生导师。她有更大的事情要处理，比如把\
  \ Facebook 发展成一个包容且全球多样化的乌托邦。或者类似的事情。\n\n但她似乎很乐意提供帮助。于是我去见了麦克辛。我们像大多数人一样，在校园的庭院里散步时开会。（因为，当然，Facebook\
  \ 没有人有办公室。）我告诉她，我似乎无法与同事建立联系，而且似乎没有人想要认真对待我。我说话时，麦克辛若有所思地点头，她的金耳环摇动着，节奏几近于催眠。\n\n\
  “这真的很有趣，迈克尔（Michael）。我认为你最大的问题在于你在回避这种冲突。和你的同事们谈谈，和他们坐在一起。分享你的感受，让他们能直接从你那里听到你的想法。从受伤害的人口中听到，比从某个第三方那里听到要重要得多，对吧？”\n\
  \n当我们路过那个黄色的黑客松（Hackathon）吊车吉祥物时，麦克辛解释了学习如何与同事交流将如何让你受益，而不是将问题向上层管理层汇报。她认为，首先，我们需要学习如何相互交流。我思考了这件事，每当有人推我时，我的第一冲动都是反击。如果，*我*退后一步，尝试从他们的角度来看待问题呢？我花了这么多时间坐在电脑屏幕后，有时忘记了我并不总是在推开想法和产品；我是在推开真实的人。\n\
  \n“尽管如此，”麦克辛说，“你说的可能是有道理的。”\n\n\n\n\n\n但扎克伯格对我最近一次提案的反应让我们所有人大吃一惊。\n\n“这真的很棒，也非常聪明，”那位创始人一边合不拢嘴地笑着，一边研究那个原型——那个原型基本上是一排圆圈，标出了“视频高光”将显示的位置。“视频圆非常完美。做得好，迈克尔。”他依然笑着拍了拍我的背。我的经理和房间里的其他几位高管欢呼起来。这可不是我们经常从老板身上看到的反应——或者说实话，从来没有见过。\n\
  \n“真的吗？”我喜若狂地问道。\n\n“我很期待这会带我们走向何方，”扎克伯格说，“让我们考虑在我们所有的产品中实现它吧。”\n\n* * *\n\n—\n\n\
  然而，随着时间的推移，怀疑的杂草开始生长。我的那个被我重新命名为 `Lifestage`（生命阶段）的概念，真的足够强大到可以独立存在吗？我已经在与其他产品负责人讨论，将其中一些内容整合到现有的\
  \ `Facebook` 和 `Instagram` 应用中；或许作为一项功能比作为一个独立产品更有意义。我又一次怀疑了自己的直觉，让我的程序员每隔几个月就撤销并重做他们的工作。对他们来说并不容易，听从一个孩子的命令。尤其是一个完全没有工作生活平衡概念的孩子。我根本无法把自己置于一个有其他责任和兴趣的成年人的立场。一个下午，我来到我的首席工程师的办公桌旁，对他的工作提出了又一次调整。Sam\
  \ 是 `Facebook` 最顶级的工程师之一；没有人能写出像他那样的后端架构。他花了几周时间为 `Lifestage` 设计规划基础设施，以确保视频稳定。\n\
  \n“嘿，迈克尔，怎么了？”他从工作中抬起头问道。\n\n我笑了。“嘿，我在想你现在有没有空。”我停顿了一下，“我担心我们正在做的某些事情可能行不通。我们可能需要进行小小的转型。”当我急忙补充道时，他挤出了微笑，“这不会是什么疯狂的事——我保证保证！”\n\
  \n尽管他的挫败感显而易见，但他像个专业人士一样点头说：“没问题，我来办。”和我团队的其余成员一样，Sam 对我频繁的转型感到恼恼，但他放置了这些情绪，因为他相信我的直觉是特别的。当时我算是个\
  \ `Facebook` 的“名人”，虽然不是每个人都知道我在忙什么，但几乎一万名员工都听说过我对公司的青少年路线图有多么重要。Sam 知道我的创作过程不是线性的或结构化的，并相信我在产品方面的才华值得他花时间与我合作。\n\
  \n* * *\n\n—\n\n`Lifestage` 并不是我唯一负责的项目。终于，`Facebook` 决定认真与 `Snapchat` 竞争——特别是 `Snapchat\
  \ Stories`（快拍故事），那些只存在二十四小时的快照集合。因此，我现在正在帮助 `WhatsApp`、`Instagram`、`Facebook` 和\
  \ `Messenger` 实现我们自己的版本的 Stories。自从 2014 年做第一次 `Teen Talk`（青少年谈话）以来，我就一直在大喊 `Snapchat`\
  \ 的威胁，高管们终于开始听进了，包括让我参加会议，并在任何与 `Snapchat` 相关的备忘录中抄给我。我被请进来审查设计，并与工程师和执行领导会面，为公司对产品的整体目标制定战略。由于\
  \ `Instagram Stories` 出现在旧动态的顶部，因此没有必要在另一个应用中建立新的受众。作为 `Facebook` 所有青少年事务的非官方守门人，我被赋予了很大的权限来表达我的观点，我的想法也受到了认真对待。有时我会与其他产品经理（PM）发生冲突，比如那些认为人们应该能够从相册上传内容到\
  \ Stories，给他们先编辑照片的机会的人。作为未经编辑“原始内容”的坚定支持者，我非常反对那个想法，但最终我被否决了。不过，我找到了一种方法将扎克伯格喜爱的圆形视频高光整合到产品中。\n\
  \n* * *\n\n—\n\n在那年里，随着我把越来越多的注意力放在 Stories 上，我知道我的 `Lifestage` 团队对我这种心不在焉的领导感到很沮丧。我只是不知道如何解决这个问题。`Lifestage`\
  \ 从扎克伯格如此喜欢的原始概念，剧烈地转变成了一个分类过多的、过度设计的设计。\n\n显然，当我花了大量时间在 Stories、`TeenZone` 和每月讲座上时，对于我把这个独立的应用项目带向何方，并没有帮助。\n\
  \n在内心深处，我担心这个应用注定会失败。我脑海中的虚拟角色告诉我，这个应用根本并不存在；我只是不想相信他们。\n\n我正在校园楼顶花园里快走，大口大口地喘气，一个嘲讽的声音在脑海里咆哮：*你连一个\
  \ App 都做不出来，你只是个大骗子，扎克伯格会开掉你的，你的工程师讨厌死你了！* 当然，就在一个由 Facebook 员工带领的青少年团出现在楼梯顶端时，我流出了泪。我来这里是因为这里又热又风大，几乎总是空空如也。但现在有十个人见证了我的窘态。我躲在一盆大植物后面，泪水顺着脸流下，心脏狂跳。直到二分钟后，我的心跳终于慢了下来，胃里的结开始松动。然后我回到家里，沉浸在我的羞耻和自怜中。\n\
  \n* * *\n\n—\n\n我真的需要控制一下脑子里的那个声音。最近我听到它的声音越来越大了。\n\n在 Facebook 上，他们总是鼓励我们利用免费的心理咨询。显然，有一种被称为“冒充者综合征”的情况在公司内部非常普遍。如果你没听说过，冒充者综合征是一种持续的信念，认为自己不配拥有现在的位置，无论你付出了多少努力。它是一种无法摆脱的感觉，认为你之所以成功是因为某种疯狂的运气，而不是你的才华或成就。事实上，你认为这些成就完全不是应得的。你是一个可怜的骗子，而时钟正在滴答作响，你的同事和朋友会揭穿你并把你赶出去。\n\
  \n知道自己像个大骗子这种感觉并不好，但我并不想要专业的帮助。\n\n* * *\n\n—\n\n在进度报告会议后的第二天早晨，我从一场深度睡眠中醒来，发现刺眼的阳光洒进卧室，我的新室友\
  \ Selena 正在敲我的门。\n\n“迈克尔，起床了吗？我们要上班迟了。”\n\n\n\n\n\n“好，我十分钟后离开，”塞琳娜隔着门说道。我能听到她的约克梗爪子在硬木地板上跑过的声音，它正跟在塞琳娜身后绕着厨房。\n\
  \n过了一，电视安静了，大门砰一声关上了。也许我今天应该旷工吧。去了有什么意义？如果我自己都不相信我的愿景，我又怎么能说服我的团队相信它呢？*没人会想你的，你这个懒惰、无用、肥胖的废物，*那个充满恨意的声音说道，“你死了，也没人会注意到你离开了。*\n\
  \n我打了电话请病假。\n\n正当我快要再次入睡，希望那个声音找不我时，我的手机响了，是我姐姐发来的一连串短信：\n\n> 回电话给我\n> 你去哪儿了？\n\
  > 你是在无视我吗？\n\n我联系玛里亚娜已经才过了几天，但对我们来说，那已经是很长时间了。当我搬到加州时，我们的关系变得更亲密了，整天都在通过 `Snapchat`\
  \ 聊天，分享脑子里蹦出的每一个愚蠢念头。在最后一次交流中，她发来一个 `epic-fail` 视频的截图。通常情况下，我会回一个 `LOL` 的表情符号，但昨晚我一进门就关了手机倒在床上了。我想最好还是回一下，否则可能会让玛里亚娜的妈妈担心，于是坐起来回回道：\n\
  \n> 没事。等下回你。\n\n电话在我的手里响了起来。我叹了口气接了起来。\n\n“你为什么不接？”玛里亚娜厉地问道。\n\n“抱歉。我工作真的很忙。”\n\n\
  “你的声音听起来很奇怪。你是睡着了吗？你在哪儿？”\n\n我清了清嗓子。“正要出门上班，”我撒谎道。\n\n“*嗯。*”我能想象出玛里亚娜眯起眼睛的样子。“进展怎么样？”\n\
  \n突然，说服我姐姐一切都好变得至关重要。我最不希望家人为我担心。那只会导致我妈妈一贯的那些教说，说我不应该把 `Facebook` 对我的信任视所当然，说我最好好好表现，知足常乐，保持体面并展现出良好的态度。\n\
  \n“一切都很好！”我说，“几周后我要去阿纳海姆呆四天。有一个叫 `VidCon` 的巨型 YouTube 大会。我等不及了。”\n\n我滔滔了一会儿，关于我将在\
  \ `VidCon` 与所有大视频创作者和 YouTube 明星见面，收集他们对 `Instagram` 和 `Facebook` 路线图的反馈。我还打算向他们介绍\
  \ `Stories` 的早期原型。“你需要签名吗？”我问玛里亚娜。她很喜欢 `YouTube`。\n\n“你说过是什么时候？”\n\n“呃，下下周四开始。”我看了看手机日历。“7\
  \ 月 23 日。怎么了？”\n\n“迈克尔，你不能去。”\n\n我用空出的手揉着太阳穴。压力性头痛又复发了。我只想回到床上去。“为什么？”\n\n“这是个秘密。听我的，你真的不想去那趟旅行的，”玛里亚娜说。\n\
  \n最后，我从她口中打听出来，我妈妈决定家人要在同一个周末给我一个惊喜访客。他们已经买好了票，票是不退还的，而且可能花了我妈妈整一个月的收入。\n\n我呻了一声。“我不能取消。一切都计划好了。我代表\
  \ `Instagram`。我很抱歉，但妈妈不应该这么做的。我以前告诉过她，因为我的行程很疯狂，不要和我搞什么惊喜旅行。”\n\n“所以你打算抛下我们？浪费妈妈的钱？”\n\
  \n我没有精力继续这个对话了。我觉得自己像个老头，而不是一个正处于人生巅峰的十八岁少年。“我想办法的，”我告诉姐姐。“得去上班了。拜！”\n\n天哪，我的房间里亮得刺眼。自从搬到旧金山以后，我就一直在抱怨阳光不足，把它归咎于我糟糕的情绪。我在这里房间付了大价租金，因为它在一个罕见的阳光充足的地方，现在我等不及要买上遮光帘了。我眯着眼睛走进客厅，那里到处都是米色和柔和调，但我仍然感到不安。我特别害怕坐在沙发上弄乱塞琳娜的抱枕。这么多抱枕。就像我父母家里一样，只不过我妈妈选的是明亮鲜艳的颜色，而我家的沙发很旧很舒服，有一个磨损的皮革脚凳，宽度足够玛里亚娜我和伸直身体看电视。我不想承认，但我突然感到想家了。\n\
  \n塞琳娜的咖啡桌是玻璃的，上面堆着她最喜欢的运动服目录。有一次我把脚搁在桌边，她就像训斥一个坏孩子一样责备我。我甚至还没穿鞋！塞琳娜已经训练过我在进入公寓前脱掉鞋并放在门口。我没法习惯这一点。\n\
  \n在搬到旧金山之前，我从未见过有人在房子里脱鞋。在我的家里或很多其他家庭里，这样做被认为是不卫生且不尊重的。你宁愿直接把食物扔在地板上。这是不可思议的。我们甚至对室内脱鞋的人有一个贬义的称呼。我们称他们为\
  \ `patas sucias`，意思是“脏爪子”——就是那个意思。\n\n\n\n\n\n安德鲁接着说，我应该为自己的弱点显现出来感到兴奋。他说，有很多有潜力的人在职业生涯起步很顺利，但如果他们对自己的缺点视而不见，就会遇到瓶颈，失去优势。他说，世界上最优秀、最聪明、最有能力且最有潜力的人，是那些深知自己充满缺陷且如如的人。他们之所以卓越，是因为他们意识到了这些缺陷，然后拼命努力去克服它们，在这个过程中变得更强大、更聪明。\n\
  \n“简而言之……”安德鲁看着我没洗的头发、沾了污渍的 T 恤以及我整个人狼狈的样子，“没关系。这意味着你已经领先了。”\n\n我挤出一声微小而尴尬的笑。“感觉并不像那样，”我说。但在回家的整个车程中，我都在祈祷他是对的。\n\
  \n***\n\n—\n\n最终我还是去了 VidCon。我们的团队拥有全通通行证，并有后台安排，可以与 Vine、Musical.ly 和 Instagram\
  \ 的明星见面。我们测试了为 `Stories` 开发的原型功能，并就他们喜欢的特征征求了建议。我将此视为一个机会，去更多地了解他们的世界，以及他们如何看待自己的名声和传承。后来，其中一些明星来到\
  \ Facebook/Instagram 总总部了解我们的变现模式。我加入了他们他们的校园之旅。走在 YouTube 明星 Cameron Dallas 身边，我的妹妹在青少年时期时曾追着他跑遍了整个迈阿密，我心在想：*该死，等我告诉她时，她绝对不会相信的。*\n\
  \n# 第 16 章\n\n## 直觉\n\n我的体重从 190 磅骤降到 129 磅。我并不完全是在节，但多亏于那种占据了我内心所有空间的焦虑，我停止了午餐吃两份奶油培根面，开始在一天中吃较小的餐食。除了压力，我那个迷恋健康的室友是我减重的第二大因素。多亏了塞琳娜，我正在学习像健康人一样饮食意味着什么。大多数时候，在她开车送我上班后，我们会在校园一起吃早餐。以前我会在盘子里堆满土薯球、鸡蛋和培根，现在我模仿塞琳娜，将自己限制在蛋白白、菠菜和每隔一天一个土薯球。\n\
  \n除了吃得少得多，我还是一个秘密的健身房小子。我对此非常保密，因为我觉得自己不属于健身房，我不想别人看着我。仍然被童年引体向上失败的阴影所笼罩，我幻想同事们会嘲笑我竟然也尝试成为一个运动的人。每天下班后，我都会从后门溜进去，直奔一台与所有其他机器隔离开、面向健身房角落的\
  \ `StairMaster` 爬梯机。我会在那机器上爬直到几乎无法再迈出一步。然后我乘班车返回山景城（Mountain View），在离公寓几站路下车以多走路。\n\
  \n一天晚上，当我从健身房后门溜出来，正穿过校园赶班车时，我遇到了一个自实习以来没见过的超级直男哥们。尼克身上闻着尤加利香水味，他一边走向汽车，一边在手机上滑动着女性照片。\n\
  \n“嘿，尼克，”我说，跟上他的脚步走到他身边。\n\n他抬头，看了两次。“哇，哥们儿，我还以为是你呢！”他拍了拍我的背。“你看起来不一样了！”\n\n我耸了耸肩。“是啊。”尼克二十多岁，身高约六英尺五，而且——像硅谷大多数有钱请教练、吃得健康的科技工作者一样——健壮得惊人。我在想他是否在评判我新变瘦的身体，他是否能穿过我宽松的健身服看到我从肥胖时期留下的腰间肉。\n\
  \n当我们走过安静的校园时，他告诉我他正准备去参加一个 `Tinder` 约会。他从口袋里掏出手机，给我看一张看起来很有运动感的亚裔美国女性的照片，她站在狂风的大崖上，长发在风中拂过她微笑的脸。\n\
  \n“她看起来不错，”这是我能想到的唯一的话。她看起来确实不错。我想知道他们会聊什么。我试图回忆上一次除了塞琳娜或安德鲁之外在工作以外和其他聊天是什么时候，什么也想不起来。\n\
  \n“你用 `Tinder` 吗，迈克？”他问道，把手机塞回连帽衫的口袋。\n\n“我，啊，最近没有，”我说。我认识的人百分之九十完全通过 App 约会，但我还没有下载过\
  \ `Tinder`，或者任何其他的约会 App。我告诉自己，等我看起来好一点就会下载。等我减掉那些腰间肉，我就会下载那个 App，去约会，亲一个女孩。等我真正亲过一个女孩，我的性取才会真正觉醒，一切都会变得合理并各就各位，我最终会感到完整。但现在还没。我必须先减掉那些腰间肉。\n\
  \n尼克很奇怪地看着我，但我们已经到达停车场，谢天谢地班车快到了。“得赶那个了，”我转身道。“今晚玩得开心！”\n\n“等一下！”尼克说。“你喜欢健身吗？”\n\
  \n“噢，不，我完全不运动，”我撒谎道。“我引体向上都做不了。”\n\n他似乎没听见我的话。“我会通过 `Messenger` 把我的教练 Jack 的号码发给你，”他说，掏出手机。“给他打电话。你瘦了很多。”\n\
  \n***\n—\n\n\n\n我迅速忽略了内心那种异样的感觉，在 iPad 上草草签“签名”，并把它还给了杰克（Jack）。我表现得太蠢了。除了房租，得益于班车和餐饮计划，我几乎没有任何其他开销。这不会产生什么伤害。而且杰克比我大，还有一张证书证明他知道自己在做什么，所以说真的，我可能表现得很`聪明`。此外，我开始怀疑自己的直觉是否真的最靠谱。在\
  \ `Facebook`，将自己的直觉置于他人意见之上，曾在某些项目中帮助过我，在另一些项目中让我吃了苦头。\n\n抱歉跑题了，这里有一些我当时在写这段话时并不知道，但现在知道的事情：直觉和冲动之间是有区别的。直觉是一种极度冷静、清晰的引导，当你能够屏蔽生活中的噪音时它就会出现（对我来说，噪音往往是我脑海中那些刻薄的声音，是我恐慌或压力声音发出的喋喋或抱怨）。直觉不会下达命令。它在等待被询问：“这种感觉对吗？”然后它会回答——通常通过一种感觉。这是一种清晰的、全身的`感觉`，是“是的”、“等一下”或“不是这个”——而不是一个在你脑子里大叫的霸凌者：“快去做，胆小鬼！”\n\
  \n如果说直觉是我们的潜意识智慧，那么冲动就是我们的条件反射。冲动几乎总是由某种形式的恐惧驱动的。是我担心自己没有择偶市场的恐惧，促使我当场报名参加 `Jack`\
  \ 的训练，而不是花几分钟考虑是否有更适合我的教练。我曾两次反抗过 `Zuckerberg` 扎克伯格本人，因为我的直觉告诉我，我的方法比他的方法更好。我曾以为这是坚强的表现，但是，额，我的直觉在我最初的观念上是错的。\n\
  \n不用俗说，事情进展并不顺利。在接下来的七个月里，我还是跟着 `Jack`，听从他“增加热量摄入”的指示来建立肌肉。在没有关于应该吃什么食物的指导下，我开始吃高热量的垃圾食品。很快，尽管我们进行了极其艰苦的训练，我长回了在\
  \ `StairMaster` 时代掉的 60 磅中的 30 磅，尽管也增加了一些结实的肌肉。并不是说 `Jack` 或任何健身教练能改变这一点，但在花费了一万美元的私教课后，我依然讨厌自己——仍然无法面对镜子，仍然在某些日子里，无论我在\
  \ `Lifestage` 团队的工作中取得了多少进展，无论我多么频繁地提醒自己`失败就是成长`，我都得躲进厕厕隔间痛哭。\n\n然后 `Jack` 搬走了，`Jasmine`（雅斯敏）接过了我的训练。`Jasmine`\
  \ 是一位越南裔超级运动员，拥有一颗金子的心和比常坚硬得多的身体。如果说 `Jack` 是“训练营教官”，那么 `Jasmine` 则专注于快乐、兴奋和正能量。我立刻感到和她在一起很舒服，几天之内，我就告诉了她我小时候参加总统体能测试的奇辱经历，以及仅仅能做一个单引体对我来说意味着什么。尽管我已经长了这么多肌肉，我仍然没敢尝试过。\n\
  \n`Jasmine` 理解了。她没有催促我。她和我一起努力了几个月，通过关注小份但频繁的高蛋白低脂餐食来帮助我吃得更好，并将我的体重带到健康的 145 磅，然后才问我是否准备好尝试`它`。我准备好了，但我失败了，很多，很多次，甚至用了了辅助杠。到那时，我不再觉得害脸了。健身房里的每个人都知道我是“那个想做单体向上的孩子”，我甚至不在乎。在\
  \ `Jasmine` 的支持下，健身房不再是一个让我感到被评判和监视的地方。我意识到那里没有人对自己的身体感到满意；每个人都想让自己看起来更好——这正是他们去健身房的原因。所以我们只是每天回到单杠上，日复一日地尝试，再尝试，再尝试，直到有一天……\n\
  \n“迈克尔，你做到了！”`Jasmine` 叫了起来。她以超快的速度跳动着，拍着手，就像一个孩子刚刚击出职业生涯第一个全垒一样。\n\n我的手臂抖得得我以为它们要完全垮掉了，但在倒地上之前，我设法碰了一下下巴。当我环顾四周，疲惫地颤抖时，我希望没人看我。\n\
  \n做一个单体向上并没有解决我所有的问题，但它是一个转折点。在那之后，我走路的样子变了。我更有精力了。我相信自己了。\n\n我下载了 `Tinder`。\n\n\
  # 第 17 章\n\n# 婴儿代码怪兽\n\n社区中心闻起来有食堂食物和孩子的汗味。它宽大而空旷，除了我、两个拉丁裔的 `Facebook` 实习生，以及十五位来的拉丁裔妈妈——她们推着婴儿车，带着坐躁不安的孩子——来听我的西班牙语版技术预备（Tech\
  \ Prep）演讲。我已经做了几个月的演讲了，这部分归功于 `Maxine`（麦克琳），她奇迹般地说服了宣传团队让我去做。我热爱它。我喜欢和这些坚定的、紧握笔记本的妈妈说西班牙语。我喜欢那些无心关注、不知道自己为什么在那里的小孩，但他们从妈妈严肃的表情中明白这是一件大事。因为这关乎他们的未来，就像一切事都一样。\n\
  \n女性们坐在折叠椅上，满溢的包包放在脚边，当我谈到为他们的家庭提供的免费计算机编程课程和资源时，她们在记录笔记。孩子们——我猜都不到十岁——在房间后面追逐，或者玩妈妈的手机，或者如果真的很小，就在膝盖上跳动。每隔几分钟，一个孩子会对妈妈低声说`Cuánto\
  \ tiempo más?`，妈妈会示意他们安静并挥手赶走。几个孩子之间用英语交流，但我感觉到像常一样，实习生和我是这里唯一的双语成年人。\n\n\n\n\n\
  那些妇女回头看着我，皱着眉头。她们的孩子还很小，离进入社会还有好几年之遥，而世界正在发生快速变化。她们可能在想，为什么要把自己的梦想寄托在某个网站上。\n\n\
  这甚至根本不是我的意思。我继续强力推销道：“我谈论的不仅仅是我公司未来的机会，甚至甚至是整个科技行业。重要的是，你们要明白，程序员的职业选择几乎是无限的！通过尽早学习编码，你的孩子将掌握技能，帮助他们长大后成为任何他们想成为的人。程序员可以在医疗保健、社会服务、农业、教育、建筑等行业找到工作……”\n\
  \n我推销得越努力，这群人似乎就越发怀疑。有些人现在眯着眼睛听着，眼神仿佛在说：*听起来太好了，以至于真实。* 一位观众已经准备离开，正把她幼儿的胳膊塞进那件粉色蓬松外套的小袖子里。另一个人则侧过身在她朋友耳边低语了什么；听者咯咯笑起来，翻了个白眼，那就像玛丽安娜在我向她推销编程时总是做的那样。“那不是我的菜，”我姐姐总是这么说。我太讨厌那句话了。她在完全从未试过一次的情况下，到底怎么可能知道这些呢？\n\
  \n为了保持乐观，我让 Raul 点开了一份非营利组织列表。“所有这些，”我指着显示屏说，“都是可以帮助你的孩子学习基础知识的团体。他们的网站提供`free`\
  \ 在线教程、`free` 导师小组以及各种——”\n\n一位穿着森林绿缎面衬衫、身材丰满的年长女性正举起手，脸上带着礼貌但坚定的微笑。她的小女孩穿着粉色的芭蕾舞裙，扎着高高的粉色发圈马尾，在她的椅子旁转着圈。\n\
  \n我向那位妈妈点点头示意。“好的？”我问道，松了一口气，终于有人足够投入并提问。\n\n“这到底要多少钱？”她用西班牙语问道。\n\n我叹了口气。去他的网站演示去吧。我不打算通过一系列奇妙的主张来获得这些女性的认同。毫无疑问，房间里的每一个女性都比我这辈子工作过的都要努力，而且她们现在可能仍在挣扎。她们过去很可能被骗子利用过，被诱导进入承诺通往成功和财富的“免费机会”，但最终只让家庭付出了代价。\n\
  \n“简单的回答是，我今天在这里和你们谈到的课程和材料是百分之百免费的，零成本，零，”我说。“我会再回到这个问题上的，好吗？”\n\n那位女性点了点头。我向她比了一个笨拙的大拇指，关上了我的笔记本电脑。\n\
  \n“*Ahora, les quiero contar un poco de mi historia y cómo llegué aquí,*”我说。（“现在，我想和大家分享一下关于我如何来到这里的小故事。”）\n\
  \n妇女们看起来如释重负，放下了笔，热切地注着。\n\n“我在迈阿密长大的。在我出生之前，我父母从秘鲁和玻利维亚移民到美国。他们努力工作，建立了了自己的小————一家炸鸡肉店。我父母来到美国是因为他们希望我和姐姐在人生中拥有每一个机会，接受最好的教育。他们工作非常努力，就像你们所有人一样，最终他们的餐店走向了成功。有一段时间，当生意非常红火时，我妈妈有时会谈论要卖掉店搬回秘鲁。我妈妈会开玩笑说，我们这个寒微的家庭在秘鲁可以像国王一样生活。‘我可以拥有一辆奔驰了！’她说，“我可以有完美的医疗保险！然后我还可以美白牙！’”\n\
  \n妇女们听后大笑起来。连实习生现在都在听。大家都听懂了。既然我已经找到了正确的切入点，我开始放松。*感谢天谢我的六年级老师和她对演讲技巧的痴迷，*我心想，在这些情况下我经常这样想。她的课就像是我对抗恐恐症的接种疫苗，让我能够在过去的十年里抬头向成千上万的人传达我“人人都能编程（Anyone\
  \ Can Code）”的信息。希望，如果我能多和这些女性保持一段时间的联系，我的演讲技巧将让我有可能说服她们。\n\n“所以我们留在了迈阿密，”我说。“尽管我们在那里*不能*像国王一样生活。即使当我的父母失去了餐店，后来又失去了房子，我们依然留了下来。”\n\
  \n听到我们的不幸，充满同情的房间里发出一阵集体的吸气声。“我们留下来，”我说，“因为我的父母希望我们能在人生中获得成功的机会。”\n\n妇女们随着我说的每一句话都在点头。其中几个人看起来几乎要哭了。我考虑过那么一秒钟，补充说明我们付得起留下的代价是因为作为`App\
  \ Kid`，我已经赚了足够支撑我们好几年的钱。但我决定不这样做。我不想给任何人虚假的希望。这不是重点。\n\n“我妈妈认为我应该成为一名医生或律师，”我继续道。“她送我去了一所私立天主教学校，因为她认为这是通往成功的唯一可靠途径：好的高中、优异的成绩、好的大学、好工作。她会说我欠她和我爸爸的，在学校里学得要像他们工作时那样努力。但我没有做到。我是个坏学生。事实上，我甚至没有拿到我的高中毕业证。”\n\
  \n我让她们震惊了。一位女士交叉双臂，抿着嘴唇：典型的“失望妈妈”姿态。那个穿绿色衬衫的提问女性双手捂着嘴，眼睛睁得很大，仿佛我刚刚供认了谋杀案。她的女儿第一次停止了旋转，突然产生了兴趣。为什么她那个痴迷教育的妈妈竟然在听一个没上过书的人教训？我可能只有三十秒钟的时间，我的观众就会带着孩子冲出房间，离我越远越好。\n\
  \n“没事的，我保证！”向他们保证道，举双手。“我是个糟糕的学生，因为我把时间都花在了开发 App 上。我的小学不教计算机科学，所以我通过 Google 自学`how\
  \ to code`。我需要的任何知识都能在网上找到。那一切都在那里，免费的。就像你们的孩子一样。只是我们在这里是为了引导他们。”\n\n现在大家真的在听了，即使其中几个人看起来还有些怀疑。我需要把故事转回到我妈妈身上，一个能产生共鸣的英雄。“我小的时候，我们家里有一台电脑。我们本应该共享它，但我父母永远无法用它做会计，因为我妈妈从餐店累了回家，看到我坐在客厅的电脑桌前学习和练习，她就会喊道：‘迈克尔，别玩了！如果你不停止玩，你这辈子成不了大事！’”笑声充满了房间。她们真的对我妈妈的故事听不够。想象一下，如果我带她来参加这些活动，能改变多少思想！\n\
  \n“但慢慢地，我妈妈开始看到我所做的事情的潜力。你们知道什么真正说服了她吗？”我忍不住说道。“当我十三岁时，从`Apple`拿到了我的第一张支票。那是成千上万的人下载我的游戏所支付的钱。”\n\
  \n“那张支票是多少钱？”有人大声问道，引发了更多的笑声。\n\n我想起了我妈妈拿着那第一张 `5,000` 美元的支票递给我父亲时震惊的表情，以及他严厉的‘你都干了什么？’，她笑了。\n\
  \n\n\n\n\n“对我们来说，这很多，”我回答道，“多到足以让我妈妈的世界发生了翻天覆地的变化。她一直被教导成功只有一条路：一条充满痛苦和苦难的道路。‘不付出就无收获，’她常这么说。但对我来说，编程离痛苦和苦难最远。我努力学习编程是因为我热爱它。我今天之所以站在这里和你们交流，是因为我妈妈终于明白，我不仅仅是在玩耍，我是在构建一套可以帮助我获得终身成功的工具箱。我想把这套工具箱分享给你们的孩子。我希望他们也能拥有`你们`曾被许诺的美国梦。”\n\
  \n我停顿了。我感到有些哽咽了，尽管我不想有意识地向自己承认这一点。看着他们那再次充满希望的脸庞，我想保持积极的态度，尽管我内心很矛盾。尽管我正向他们伸出如此——也许是太多了？的承诺，但对他们的孩子来说这并不容易。他们肤色较深，而且贫穷，这意味着事实上，我妈妈说的话部分是正确的。即便这些孩子从明天就开始学习编程，成功也不会来得容易。对他们来说，依然会有痛苦和苦难。尤其是那些“追梦者”——我猜测房间里至少有一两个——他们在这个唯一有过的国家生活的权利甚至已无法得到保障。在缺乏安全感、更少金钱、更少保险，且往往更缺乏安全的环境下长大，他们在生活中做的每件事上都必须比别人努力十倍，仅仅才能被人们看到，更不用说成功了。但如果不向这些妈妈分享我的故事，如果不为她们指明我所知的唯一能帮助她们突破针对他们的系统的工具，我还能做什么呢？\n\
  \n***\n\n事后，当实习生们分发打印出来的清单时，上面列出了妇女们在笔记本上仔细记录的所有相同 URL 地址，我站在出口处，偷看我那 Facebook 经理在我说话期间一直发来的如潮水般的信息。他对我开始为\
  \ `Instagram Stories` 和 `WhatsApp Status` 准备的幻灯片有疑问，并且对此非常兴奋。我等会儿会处理。现在，我想留出时间回答任何最后的问题。大多数女性都急着回家做晚饭。她们裹好外套，带着大大的微笑和感谢从我身边匆匆经过，催着她们睡眼惺忪的孩子抬头道别。\n\
  \n那个提问题的女士和她穿着芭舞裙的女儿是最后一个离开的。妈妈伸出手让女儿当成练习杆，女儿旋转着做着优雅的舞者式跳跃和跨越。\n\n“我们很兴奋！”妈妈举着打印件说道，“感谢你提供的信息！这是凯莉。她喜欢技术。她会喜欢这个的。”\n\
  \n“真的，你们客气了，”我说，“凯莉，你喜欢代码就像你喜欢跳舞吗？”\n\n“不喜欢！”凯莉在跳跃时喊道。\n\n“凯莉，你喜欢的！”她妈妈说，脸微微红了，“她喜欢的！她总是盯着那个平板电脑设备！她现在就想玩，但我们得把电脑留在她哥那儿。”\n\
  \n“我在上面画画，”凯莉说，“我还给我的动物拍了六部电影。”\n\n“是她的毛绒动物，”妈妈补充道。\n\n“六部电影！”我感到很佩服说道。\n\n妈妈点了点头。“我觉得这对她来说会很容易。我一定会让她练习的。哪一个最适合练习？”她把打印件递给我，我快速扫了一下。\n\
  \n“她多大了？”\n\n“我六岁了，”凯莉说。\n\n“好的，在你妈妈的帮助下，你可能准备好玩 `Code Monster` 了，”我说。\n\n“怪物！”凯莉咯咯笑着，“我爸爸说我是个怪物！”\n\
  \n“他只是开玩笑的，”妈妈说，有些紧张地笑了笑，“她是个天使。”\n\n“我不是，”凯莉说，“我更像个怪物。”\n\n“那对你很好，”我说，我很喜欢这个女孩，“凯莉，如果你像怪物一样厉害，你编程会很棒的！”\n\
  \n“好的，”凯莉踮着脚蹦跳着，瞥了一眼门口，“妈妈，我饿了。”\n\n当凯莉拉着她的手臂时，妈妈睁大眼睛看着我。“你真的这么想吗？”\n\n“噢真的，”我说，“如果她喜欢，她学会很快的。如果她尝试几次还不行，就放放她，一年后再试。”\n\
  \n妈妈拿出笔记本，快速记录下了我刚刚说的话。\n\n她们离开几秒钟后，我跟在他们后面出去，凯莉正在用妈妈的手机打电话，用英语转达她她妈妈的信息。\n\n妈妈转向我，微笑着。\n\
  \n我把手插进外套口袋里，试图找到合适的方式来表达我的所想。我能做的最好的就是：“如果编程不是她的擅长，那也没关系。她有你，所以……我完全不担心她。”\n\n\
  # 第 18 章\n\n# 一次“惊喜”家庭拜访\n\n“等的时候你们不需要再来点什么吗？”服务员在`Chef Chu’s` 的桌旁徘徊。那是南湾的一家家族经营的中餐馆，我经常在那里吃。我听说\
  \ `Mark Zuckerberg` 经常虔诚地去那里，所以我选择在这里和父母、姐姐一起吃晚餐，希望能重新赢得她们的好感。\n\n“没关系，”我抬头看着手机上姐姐发来的短信，信息上写着“6\
  \ 分钟到！”“她们很快就到了。”\n\n“没事，”服务员说。她看起来和我年龄差不多，黑头发盘成一个圆髻在头顶。她表现得特别友好，考虑到我已经占了位子十五分钟还没点餐。\n\
  \n现在她看了我椅子旁的硬壳拉箱。“看起来你像是直接从机场过来的。”\n\n“是的。”我再次笑着，拿起手机。\n\n“让我猜猜，”服务员歪着头，“你在 `Microsoft`\
  \ 工作。不，`Google`！”\n\n“差一点，”我告诉服务员，“Facebook。”\n\n“啊哈，”她说，“我有些朋友在那儿工作。可惜我不在那里。”\n\
  \n我紧张地笑了，然后又低头看手机。服务员走了。如果我妈妈在那儿，她可能会催我去和她搭讪。\n\n由于一直以来在 99%的异性面前视而不见，我完全不知道如何搭讪——即使是和\
  \ `Tinder` 上匹配到的女孩。到目前为止我参加了四次约会：两次早午，两次午餐。每次我们都聊了几个小时，但在某个时刻我意识到无聊，没有火花，于是我们就散了。我开始认为，也许我不是感情的料。也许我天生就是独行狼。我不想让感情关系干扰我的工作。这解释了为什么当玛丽亚的朋友们试图跟我搭讪时，我总是那么讨厌。\n\
  \n妈妈在房间另一头的打破打破我的精神循环，她领着家人来到桌边。\n\n我跳起身，把所有人拥入怀里。他们都穿着防风衣，尽管早些时候走了金门大桥，妈妈和姐姐的发型依然很整齐。妈妈紧紧搂住我的手臂，用长指甲掐着我。\n\
  \n“噢我的天，迈克尔，”她赞叹道，松开手戳了我的三头肌，“哇，你居然长了肌肉！”\n\n“是的。”我掰开她的手指，既尴尬又有些自豪，“我离目标还很远呢。”\n\
  \n“你太瘦了！”我姐姐尖叫道。\n\n\n\n\n\n“你看起来真棒，Cocolocho；你看起来极了，儿子！”我父亲大声说道，不可置信地摇着摇头，伸手搂住我的肩膀。“你是怎么做到的？”\n\
  \n当我们围坐在桌旁时，我开始向他们讲述我的健身经历，讲述我是如何达到如此厌恶自己的地步，以至于某天走进健身房后，每天都坚持去那里。正当我讲到完成第一次引体向上时，我妹妹打断了我。\n\
  \n“如果我有免费的健身房会员和免费的自助餐食，我也会减肥的！”\n\n“你知道的，玛丽娜，如果你再努力一点，你也可以减肥的，”我妈妈补充道，*啧*着摇了摇头。\n\
