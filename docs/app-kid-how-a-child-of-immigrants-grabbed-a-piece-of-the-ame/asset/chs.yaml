  \n“什么？”我惊呼道，“你为什么要那样做？”\n\n“迈克尔，听我说……为什么你这么这么心烦？这没什么大不了的。大家很好奇，所以我告诉他们你正在和她约会，如果你不喜欢，我可以告诉他们我错了。”\n\
  \n我震惊地看了我妹妹一眼。我想知道桌上的其他人是否也觉得我妈妈的话简直是疯了。\n\n我妈妈一旦变成那种状态，谁也停不住她，我们最后在晚餐剩下的时间里都在划着我在\
  \ `Tinder` 上匹配到的女孩照片。\n\n“迈克尔，你对这些女孩一个一个信息都没发！”玛丽娜看着我手中的手机皱眉道。\n\n事实确实如此。我最近没有给任何匹配上的女孩发过信息。我只会在看到那些简介有趣的女孩时向右滑一下。（比起她们的照片，我更感兴趣的是她们做什么工作，以及她们听起来是否聪明。）目前来说，我觉得到这一步就可以了。\n\
  \n“迈克尔，如果你想让她们理你说话，你就得给她们发信息！”玛丽娜指着我的键盘说。\n\n“现在不想。”我脸红地收起手机。\n\n当我把家人送上车，并答应明天早上在\
  \ `Facebook` 总部和他们集合时，我的头痛欲裂。在 `Uber` 的后座上，我打开窗吸了一口冷空气，双手按住太阳穴防止大脑爆炸。我那八十多岁的司机放的韩国行进行曲毫无帮助。在其他任何一个晚上，我都会问问他关于音乐的事，关于他的背景和生活，可能还会问问他晚餐吃了什么。但今晚不行。现在不行。\n\
  \n手机在我的口袋里震动着，这是今晚我第一次忽略了它。*现在不行。现在不行。*无论是谁——我的家人还是别的——我不想和任何人说话。\n我撤回了几天前发给他的 `Lifestage`\
  \ 策略文档，但我觉得现在最好不要打开它。\n\n\n\n\n\n扎克伯格的耐心（就像我的自信一样）快耗尽了，我们都急于发布。Facebook 的高管们认为，发布时间与开学季接轨非常重要。对我来说，滴答作响的时钟正在倒计时我的二十岁生日，那就在一个月后。我坚信，Lifestage\
  \ 的吸引力取决于它是由一个青少年为青少年打造的。如果我在二十岁时发布它，那种视觉效果会非常糟糕，会让这个 App 看起来像是一个还在继续参加高中派对的大学生。我们讨论了许多关于如何防止成人进入该\
  \ App 的话题，以及最终由谁有权访问已发布的内容。当我的团队在处理这些问题时，我的重心已从“我如何让 Lifestage 变得完美？”转向了“我如何在我还是十九岁时，在开学前让它好到足以发布？”\n\
  \n在我生日一个月前的 7 月一个傍晚，我带着满眼血丝的团队坐在一间墙壁光光的小房间里，透过单向玻璃观察一个由七个青少年组成的焦点小组如何操作我那仍满 Bug\
  \ 的 App。我在想，这块玻璃根本是没必要的，因为我们这些在另一边的苦力们完全处于他们的感知泡之外。我知道对他们来说并不是真实的。而且由于他们都是陌生人，他们彼此之间也并不真实。当你是一个青少年时，最重要的人是那些以直接且有意义的方式影响你生活的人。\n\
  \n总之，我召集焦点小组是因为我的想象力枯竭了。在 Facebook，我已不再仅仅依靠自己凭空构思那些我一直用来引导 App 创作的虚拟测试角色。所以，尽管我知道要在一个不自然的环境让拿了钱做出反应的青少年给出诚实的反馈基本上是不可能的，但我仍抱着一丝微小的希望，也许这些孩子中的某一个会开口，提供那个能将所有零散线索连接起来的黄金见解。当他们吃着我们提供的如山般的零食，在载有\
  \ Lifestage 的手机和 iPad 上滑动着时，我屏住呼吸，像科学家研究实验室动物一样观察他们。一个戴着巨大黑眼镜的红女孩眯眼睛盯着屏幕，皱了皱鼻子。“那是一堆大便吗？”她问研究员。\n\
  \n研究员笑了。“正确！你觉得呢？”\n\n“有点差劲？”一个戴着 Chance the Rapper“3”字球帽的红发男孩说道。\n\n“有点不成熟，”小组里最小的男孩说，那是个胖乎乎的戴着牙套男生，让我想起了自己在企鹅岛游世界时期的样子。\n\
  \n我闭上眼睛。现在更改图标意味着要将发布推迟到开学之后。\n\n***\n\n***\n\n我站了起来。“够了，”我说，“我不想再听了。我们要发布。不再做任何改。”\n\
  \n***\n\n***\n\n两周后，距离我的生日还有七天，我坐在一辆 Uber 里，手里拿着三袋从帕洛奥托 Fuki Sushi 买的外卖寿司——那是硅谷最奢华的地方——这是为了让哥计们陪我走到最后时刻而做的孤死一掷。我对着我的寿司塔拍了张自拍发给他们，打字道：“在路上了！”然后瘫坐在椅子上。还有几个\
  \ Bug 需要解决，而且哥计们都很郁闷、很饿，几乎不再说话了。\n\n当我晚上 11 点带着我的供品冲进办公室时，我的团队的一名成员已经回家了，我的首席工程师正准备上外套。“抱歉，迈克尔，我不干了。我眼睛已经直不了了。”他从我怀里抓过一盒天妇罗走出去。离开的两个工程师一话不发地走了食物并继续写代码，而我疯狂地在房间里来回去，寻找能让我们更快到达终点的方法。\n\
  \n***\n\n***\n\n凌晨 2 点，只有我和一个一直在打盹的家伙，他的头在键盘上方晃动。\n\n“嘿，哥们儿。”我拍了拍工程师的肩膀，他猛地惊醒，鼠标掉到了地板上。\n\
  \n“操，”他沙哑着嗓，擦掉嘴角的唾液。\n\n“听着，”我说，伸手去捡他的鼠标，“你可以走了。我可以搞定。你能提醒我一下如何通过 Facebook 内部工具向\
  \ Apple 提交最终版本吗？”\n\n我已经好久没有自己写代码了，以至于忘记了 Facebook 内部流程是如何运作的。我的工程师给我快速演示了一下，然后一话不发地走出了门。该死。我真的是个糟糕的产品经理。但现在不是纠结这个问题的时候。现在凌晨\
  \ 2:30。我是总部唯一留下的人，也是唯一能及时把 App 交到 Apple 手里的人。哥计们在我还没吃上口之前就把寿司扫光了。现在我饿得无法清醒思考。我的工程师说过，在提交之前的关键倒数第二步是什么？我完全忘记了。在\
  \ Facebook 内部工程支持页面上无力地点击了 20 分钟后，我才意识到，*啊，伦敦的 Facebook 办公室刚上线！*\n\n我打开 Messenger，给伦敦办公室目录中我能找到的每一个工程师发了信息：\n\
  \n有人在吗？\n\n我正尝试提交我的 App，但我完全不知道自己在点什么。\n\n需要演示一下！\n\n凌晨 4:35，在一位来自另一个小组的随机伦敦工程师的大力“手把手”聊天指导下，我准备好提交了。但有些不对劲。Lifestage\
  \ 还是处于未提交状态。我给伦敦发了信息：\n\n没过去！\n\n在漫长的等待后，他回复道：\n\n等等。服务器可能挂了。\n\n等会儿再试。\n\n谢了，哥们儿。\n\
  \n我眼皮颤抖，掐着手臂保持清醒。“你别怕！”\n\n\n\n\n市场经理带着微笑，这只能意味着他们心里正在嘲笑我。难道一眼就能看出我熬了一整夜，在一张小长凳上睡了一整天，而且从……自从上次洗澡以来……我*上次*洗澡是什么时候了？我努力让自己看起来正常且冷静。我真的希望这次一切顺顺。\n\
  \n“你还好吗，迈克尔？你看起来有点累，”市场经理说道。\n\n“没事，我很好！”我试着说话时不要露出牙齿，以防我的牙套上有残渣。“我从昨天起一直在这儿，呃，昨天是周几？”\n\
  \n一位新入职的营销助理——一名初级营销经理——掏出手机。“我需要重新安排我们的时间吗？”\n\n“是的，”市场经理说，“这儿不急。等 App 获得批准，我们会花一周时间进行测试，然后推出。”\n\
  \n“不不不！”我说。听起来更像是一声犬叫，我的嗓子干得厉害。有人递给我一瓶水，房间里的每一双眼睛都盯着我大口吞咽。然后我放下水瓶，切换到“自动驾驶”模式——这是我在高中去秘鲁和玻利维亚旅行时学到的技巧。每当我因为时差、刚下飞机就要面对满数百人的房间发言时，这招一直对我非常有效。“自动驾驶迈克尔”不会让睡眠不足或脏牙套阻碍他的发挥。他微笑并笔直站起来，肩膀后挺。“自动驾驶迈克尔”向市场经理和全屋的人解释了为什么在\
  \ Apple 批准 App 之前在 Lifestage 上发布新闻稿至关重要。因为它 100% 绝对会被通过的。而且一旦通过，就只剩下最后一天了——让我作为一个十九岁的少年向记者们发表。\n\
  \n当“自动驾驶迈克尔”解释完这一切后，他感谢通讯团队配合这个时间表（尽管他们并没有表现出任何配合的意思），然后离开了房间。\n\n十五分钟后，我从公寓外的穿梭车上跌撞着下来，回到我那间高天花板、美丽的卧室，窗外可以看到硅谷的红木城郊区和退伍军大道对街的\
  \ In-N-Out 餐厅，然后衣不不整地倒在床上，如意感流遍全身。我做到了。我提交了 App。\n\n# 第 20 章\n\n## 缘分\n\n六个月后，我正坐在穿梭车上上班，陷在柔软的座椅里，大罩耳机里听着古巴歌手塞莉亚·克鲁斯（Celia\
  \ Cruz），那是我想要隔绝世界时会戴的耳机。我正在给扎克伯格写备忘录。\n\n他又证明是对的，他的直觉比我更敏锐。Lifestage 实验自最初发布已过去七个月，并没有变成下一个\
  \ Facebook。通讯团队和我同意对实验性 App 的发布采取“观望”的方法，让它自然地获得成功（或失败），以便我们从它的发布和使用中收集最有用的数据。因此，我们在发布时仅进行了少数采访——远远不足以反驳一些负面文章。来自《商业内幕》的那篇报道还刻在我的脑子里：“在尝试了该\
  \ App 后，我很困惑为什么会有人想用它。其他社交网络（特别是 Snapchat）已经做了 Lifestage 做的事，而且功能得多。”\n\n好的一方面，我们都知道\
  \ Lifestage 成为下一个 Facebook 的概率微乎其微。科技世界就是这样运作的。你必须承担风险。\n\n我们一起决定在六个月内撤回该产品。与此同时，我的经理明确表示：我们应该把从\
  \ Lifestage 中学到的东西应用到公司内的其他项目和产品上。我必须接受这样一个想法：我偶尔会失败。并不是我参与的每一个项目都会改变世界，但这并没有阻止我觉得自己像个失败者。幸运的是，Stories\
  \ 最终的成功甚至超出了我自己的预期。在八个月内，我们推出的 Instagram Stories 用户数超过了 Snapchat。到 2018 年，Instagram\
  \ Stories 的用户数是 Snapchat 的两倍以上。今天，每天有超过*十亿*人使用 Instagram Stories。\n\nIG Stories\
  \ 在 Snapchat 上市之前发布，但等它上市时（2017 年 3 月），Snapchat 已经缩水了 56% 的价值。科技媒体广泛报道，这是 Instagram\
  \ Stories 的直接结果。很多 Facebook 的人对此感到相当自大。但我认为我们应该感激 Snapchat 教给我们的东西——那就是我们并不是所有创意和创新的源泉，也不必如此。我记得自己没有让自尊心蒙蔽视野，而是提醒自己：要尊重\
  \ Snapchat 所成就的以及他们带给我们的教训。我从中中学到的教训是：带着“别人可能知道你不知道的东西”这种预期进入一个新项目永远无害，而目标就是弄清楚那到底是什么。\n\
  \n***\n\n—\n\n我现在继续开发 WhatsApp Status 和 Instagram Stories，并开始帮助 Facebook 主 App 的导航用户界面工作。我开始苦干，每天从上午\
  \ 10 点到下午 6 点，然后每天晚上回家开发我仍在业余构建的自己的 App。到那时，我已经构建了 34 个 App，发布了 31 个，其中很多和 4 Snaps\
  \ 类似。其中一个叫 Show & Tell，是一个视频格式、回合制的游戏。另一个 Gameshow 的运行方式与 Instagram 类似，只是它的用户发布照片来暗示一个特定的词。\n\
  \n总之，我一直很想念迈阿密，这就是为什么我那天在听塞莉亚·克鲁斯的歌。她的音乐总让我想起家。凯文（Kevin），那位从我实习期间就支持我、偶尔和我练习普通话的高级开发人员冲进了我的公交车。每当我们相遇，凯文都会特意问候我，我通常对此很感激。但此刻我完全没有心情社交，我在座椅上坐得更低了，把连帽衫拉过眼睛，希望他直接走过我和这股负能量。\n\
  \n这计划泡汤了。“嘿，迈克尔！”凯文坐在过道的座位上，给了我一个微妙的击掌。“怎么样，小天才？”\n\n我拉下一只耳机，困惑地看着他。他在嘲笑我吗？难道公司里所有人都在关注\
  \ Lifestage 那场史诗级的预热吗？\n\n“哈哈，”我紧张地说。\n\n凯文看起来很困惑。“出什么事了吗？”\n\n我摇摇头，把耳机向耳朵靠了靠。“只是在想。”\n\
  \n凯文点头，但保持眼神交流——好像他听懂了弦意，但决定不拆穿。“我真高兴能看到你。我一直想祝贺你！”\n\n“关于……？”\n\n“你做的 Teen Talks（青少年演讲会）真的太棒了。大家一直在问下一次什么时候举行。我听说现在有五百多人和你一起投入到青少年参与工作中。当你开始时，有多少人？三个？太不可思议了！”\n\
  \n当公交车穿过校园入口处巨大的蓝色大拇指标志并转入黑客路（Hacker Way）时，凯文跳了起来——他比我更想离开这辆密封的公交车去开始新的一天。他把健身包甩在肩上，补充道：“认真的，迈克尔。你的观点在这里*非常有价值*。你帮助我们理解了*每个人*想要什么。你重新定义了\
  \ Facebook 的工作流。我希望你知道这一点。”\n\n\n\n当我走在下着雨的大街上，路过那个正显示着“周二塔可快乐！”时代广场规模巨大的数字广告牌时，我的脑海中浮现出一个念头。Lifestage\
  \ 没有能掀起波澜，我的沟通风格仍然让很多人感到反感，但没有人能说我没有改变过公司的路线图。我的任务在这里完成了吗？也许我需要的不是另一个项目，而是一个不同的地方，在那里我可以更多地挑战自己的视角，在那里我观察世界二十年的方式是被人需要的。但，那在哪里呢？\n\
  \n我的手表震动起来，提醒我有一个十点的会议。我躲进一个装饰着原木小屋风格墙壁和摇头娃娃人像的休息区，坐在一把橙色的蝴蝶椅上，向后翻阅信息寻找议程。*没有，没有，没有，该死，还是没有。*正当我打算放弃硬着头进去时，另一条几周前的未读消息突然跳入我的视线。\n\
  \n> 发件人：Jacob\n\n> Michael，我在 Google 有一个团队负责虚拟现实。我们需要你的观点。有兴趣加入吗？如果感兴趣，请联系我！\n\n\
  我盯着那个蓝色的气泡框。*我们需要你的观点。*嗯。\n\n我只见过 Jacob 一次，大约在一年年前，当时他正在 Facebook 面试总监职位；那个招聘经理显然想听听这个“标签少年”对\
  \ Jacob 的看法，并让我和他进行一次简短会面。我们聊得非常投机，最后聊了那么久，以至于他下一次面试时迟到了半小时。我因为留住他而被训了一顿，但我想他获得了那份工作。显然，他最后去了\
  \ Google。\n\n直到这一刻我才看到 Jacob 的消息。这很奇怪，因为我一直都在用 `Messenger`。我是刻意忽略了它吗？即使在我在 Facebook\
  \ 最低谷的时刻，我也从未认真考虑过离开。至少不是自愿离开。Facebook 是我**所有**的认知。\n\n*我们需要你的观点。*最奇怪的是，在 Kevin\
  \ 提到完我那“有价值”的观点后几分钟，我就偶然发现了这条便条。太奇怪了，无法忽视，对吧？有些人会说这似乎是个征兆，但我再怎么试也不可能那么迷信。\n\n没有人比我妈更迷信了。在我成过程中，每个跨年夜我们都必须：穿黄衣服；提着空行李箱在街区跑一圈；以及在\
  \ 11:59，尽可能快地连续咬掉十二颗葡萄子。我妈说，没能做到所有这些点就会导致一个灾难性的新年。我听从她的指令，但我从不信这一套。我没有继承我妈一丁点迷信的性格。\n\
  \n另一方面，我是“邂逅”的拥趸。没有什么比在生命恰恰的时刻发现你所需要的——也许是更好的东西——更棒的事情了。有些人认为邂逅等同于运气或巧合，但它更好，因为你实际上可以主动地去获得它。如果你在生活中尽可能多地结新人，听尽可能多的想法，探索尽可能多的新机会，邂逅就会找到你。\n\
  \n当我冲向会议现场时，我快速地给 Jacob 回了信息：“对那个职位仍然感兴趣吗？”\n\n***\n\n事情进展得很快。三天后，我坐在 Facebook 附近的\
  \ `Starbucks` 外，调整着耳机准备接听 Google 招聘人员的电话。这是一次“筛选”面试。如果这四十五分钟的通话进展顺利，一周后还有七场面试——*而且在同一天。*如果我在筛选中搞砸了，我想，我就出局了。*真遗憾你电话里表现这么烂，*脑海里那个刻薄的声音说道，这时电话亮起了我的屏幕。\n\
  \n招聘人员直接切入主题，问我关于假设性的产品和问题，以及我将如何提高某些 App 的指标。我尽可能用权威的语气回答，并指出我的 App 开发经验将如何转化为对\
  \ Google 的益处。我向面试官介绍了我在 Facebook 青少年参与策略中扮演的角色。我描述了在十二岁时，我是如何规划我的 App 一直冲上 `App\
  \ Store` 榜单的顶端的。我为提升 Google 的社交媒体影响力提供了一些原创（*我认为*是）的建议。\n\n我信自己正在证明那个刻薄的声音是错的，表现非常出色，直到招聘人员突然向我表示感谢并说她会联系我。我挂了电话，有些愣，收起东西。电话怎么可能持续了四十五分钟；感觉时间太短了！我还有这么多话想说。\n\
  \n尽管招聘人员很快结束了对话，我还是无法抑制对加入 Google 的期待。我怎么能不期待呢？Google 是我能有今天的原因。如果我想要这份工作，我就需要主动，跳出常规渠道，不断播种种子。\n\
  \n在等待招聘人员回复期间，我联系了 Jacob，问他是否能帮我介绍 Google `VR` 团队的三名成员。在接接下来的一周里，我约了其中两个人出去吃午饭，然后——尽管我仍然没有收到任何消息——我直接约了*他们*的人脉去吃午饭。\n\
  \n接下来，我需要证明我为什么成为我申请的那个 `VR` 团队的财富。我对于虚拟现实（人们使用特殊设备“进入”并与其相互作用的计算机生成的 3D 仿真）或增强现实（将计算机生成的图像叠加在用户视线上的技术）几乎了解得非常少。\n\
  \n当我把能想到的话说完后，我将文章发给了通过社交活动认识的所有 Google 联系人。现在我可以安心入睡了，因为我知道为了得到那份工作，我已经竭尽全力。\n\n\
  文章得到了 Google `VR` 哥们们的立即回复，他们似乎觉得很有趣，尽管有些令人惊讶。这很好。尽管我不再是青少年了，但我比 Google `VR` 团队中最年轻的人还要小八岁，希望我刚刚为这可能成为的优势做了有力的论证。我当时感觉很乐观。\n\
  \n接着邮件出现了：一封来自另一个 Google 招聘人员的邮件。我心提到嗓子，点开……等等，什么？那是一封拒绝信。它说公司“目前没有适合我的职位”。我是“非常契合文化的人”，但他们“希望在产品和战略见解方面看到更多表现”。\n\
  \n不，不，不。这。不可能。\n\n。\n\n觉得已经没什么可失去，我回了一封礼貌但带刺的回复：\n\n\n\n\n\n> 这真的挺有意思的。没没想到一个 30\
  \ 分钟的电话就能被 Google 拒了，尤其是考虑到我所申请的职位和团队。\n>\n> 好的，我期待很快能再次与你聊天。\n>\n> 再次感谢！\n>\n>\
  \ Michael\n\n几天过去了。我放弃了希望。一切都结束了，至少目前是这样。然后，当我正登上飞往哥伦比亚波哥大的飞机时（我用了一些带薪假去演讲，以此缓解我的失落之情），Google\
  \ 招聘人员发的消息跳到了我的屏幕上。她非常抱歉。她没有意识到我的面试比预定的 45 分钟短。她想纠正这一程序上的错误。她问我是否想重新安排一次面试？\n\n\
  在我还没得及系好安全带之前，我们就约好了一次新的筛选；我不想等，就选了他们最早的日期，那是我行程的最后一天。时间刚好足够我在起飞前，在酒店房间里完成面试。\n\n\
  # 第 21 章\n\n## 金发大野心\n\n从哥伦比亚回来的第二天早上，我正在准备上班。我正翻开包找我最喜欢的衬衫，这时我猛然一醒：我忘了重新安排的 Google\
  \ 面试了。\n\n*笨蛋*，那个刻薄的声音说。*你的最后机会就这么没了。* 但这不可能。没有人给我打电话。我拿起手机，检查面试官是否打过电话。看来他们没打。我说过会回电他们吗？我不记得。该死。我套上衬衫冲出门门。我会写一封道歉信。我要写什么呢？一小时后，当我还在苦思合适的措辞时，招聘人员竟然给*我*发了道歉。是面试官忘记打电话了！我点击回复并打道：“没关系，其实我也忘了！”\n\
  \n我的拇指悬停在发送图标上，盯着我写的内容，皱着眉头。我在硅谷遇到过的绝大多数成功人士话得都比我少，而且底牌藏得很深。我重新写了一遍：“请告诉我我们可以如何处理，谢谢。”\n\
  \n***\n\n亚当·莱文（Adam Levine）把他的头发染成了白金金色。我正在点播看《好声音中国》（*The Voice*），努力不去检查手机招聘人员的回复。\n\
  \n“这真奇怪，”我对我的室友艾米（Amy）说。\n\n“什么奇怪？”她回答道。\n\n“亚当的头发。对他来说太显年轻了，”我说，“他不是……快四十岁左右了吗？”\n\
  \n艾米从笔记本电脑屏幕看了看电视屏幕，屏幕上莱文正跪在地上，恳求一位年轻的乡村流行歌手加入他的团队。“这在他身上没那么难看，”艾米说，“但染在你身上效果会更好。”\n\
  \n***\n\n周六到了，依然没有回复。我去了 CVS 商店，挑了两盒染发剂，盒子上是一个正忧眉苦脸的白金发男模特。我开始变得自知自明了，意识到自己做这种冲动的事情只是为了分散对这份工作的那份不安和紧张感的注意力。但这并没有阻止我。在还没改变主意之前，我冲回公寓，把自己关在浴室里，开始大干一场。如果我搞砸了，会有多糟糕？我会看起来既年轻又蠢；那又怎样？这很棒！在年轻的时候做比在四十多岁的时候，像亚当·莱文那样要好得多。\n\
  \n我把第一盒染发剂抹在头发上，期待地盯着镜子。起初很慢，然后变快了，白色膏体下的头发褪成了浅棕色，然后变成橙黄色。起作用了！下一站，白金色！但没有下一站了。颜色没有变浅。我打开第二盒，又抹上了一些，然后等待。尽管如此，我的头发并没有变浅一点——只是变得越发橘、越发橘。我惊了失措，跳进淋浴间。艾米留下了半瓶紫色洗发水，声称能让挑染显得“很有灵气，而不是发黄”。我把那些水倒在头上，冲洗，重复，直到瓶子空了。\n\
  \n当我用毛巾擦干身体看向镜子时，我看起来完全不像盒子上的那个人。相反，一个疯狂的、霓虹脑袋的小丑正回视我。\n\n我需要专业的帮助。\n\n我：[*进入一家美发店，戴着针织滑帽*]\
  \ 你好，我有预约。\n\n美发店前台：你是那个把头发染成橙色的孩子？\n\n我：恐怕是。\n\n美发店前台：从帽子就能看出来。请这边来[*带我坐到椅子旁*]\
  \ 这是贝尼（Bethany），你的造型师。她会帮你搞定的。\n\n贝尼：嘿，Michael，能把帽子摘了吗？\n\n我：[*恐惧地僵住*] 我不行。\n\n\
  贝尼：没关系的，亲爱的，我什么没见过[*摘掉我的帽子，吸了一口气*]\n\n我：[*在用手防御性遮住头部时接到 Google 的电话*] 喂？\n\nGoogle\
  \ 招聘人员：Michael Sayman？\n\n贝尼：哇。好的。哇。这需要一些时间。\n\n我：[*盖过吹风机的噪音喊*] 就是他……他……我！\n\nGoogle\
  \ 招聘人员：你好，Michael。现在方便吗？\n\n我：[*在椅子上缩着身体，躲避镜子里贝尼不耐烦的目光*] 现在非常方便！\n\nGoogle 招聘人员：我打了电话，我们可以跳过电话筛选，直接面谈。如果你还有兴趣，\n\
  \n***\n\n我的头发是白色的。不是金色的。\n\n***\n\n第二天早上我醒来，脑子里冒出一个奇怪的念头。*如果我真的是呢？*我把它抛在脑后去上班了。\n\
  \n几天后，在和艾米吃完外卖后，我回到房间，把自己扔在凌乱的床上，打开了 Tinder。为了好玩，我进入设置开启了 `Searching For: Males`。我也留着\
  \ `Searching For: Females`，因为我当然会那样。我只是想看看其他男人的资料是什么样子的。作为对比。研究竞争对手总是好的，对吧？\n\n\n\
  \n\n\n在接下来的几天里，我继续和越来越多的男生配对，最终，我发现自己正在和其中一些人聊天。在某个时刻，我意识到自己其实在调情。“嘿，我也喜欢你的头发。你今天过得怎么样？”但每当有男生建议见面时，我就会恐慌并玩消失（ghost）。*我不应该这么做的，*我心里想道。接着，*但又是为什么呢？*接着，*去约会真的会那么糟糕吗？*接着，*迈克尔，你疯了吗？*我的脑海中闪过那些陈旧的家庭晚餐桌上的对话——我妈妈对她未来的孙辈赞赞绝口，或者讲述她父亲宁愿死也不愿要一个同性恋儿子……\n\
  \n我不可能是同性恋。\n\n尽管如此，我开始对我自己可能是同性恋这种可能性感到极度恐慌。这种恐惧像幽灵一样笼罩在我身上。*冷静点，*我对自己说。*如果是的话，也没什么大不了。这不是致命疾病。*但在我看来，成为同性恋意味着一种巨大的不便。我以后怎么能拥有家庭呢？\n\
  \n但另一方面，有一个叫“布拉德，24 岁”的男生一直在给我发信息，想见。他在照片里看起来挺可爱的。我无法停下打开他的个人主页盯着看。我是不是应该对自己负责，去稍微了解一下同性恋这件事呢？\n\
  \n我说的“了解一下”，首先是指去 Google 搜搜。当然，Google 从没有让我失望过。于是我搜索了：“同性恋可以合法收养孩子吗？”“哪些州允许同性婚姻？”以及“卵子捐赠是做什么的？”这些并不是天主教学校里教给你的东西，所以我发现自从我妈妈获取那些信息以来，显然已经取得了进展，这真是一个意外的惊喜。\n\
  \n# 第 22 章\n\n## 七场面试之日\n\n当我 Google 的大面试日期到来时，我先是在 Facebook 露了个面，然后打 Uber 向南十英里来到山景（Mountain\
  \ View）的 Google 总部（Googleplex），因为我为了面试请了一天假。\n\n该死，我真得紧张。但至少，多亏我已经和 Google 的 `VR`\
  \ 团队成员进行过多次咖啡约会，我没有那种感觉自己正降落在一个异国的额外压力。那四五次会议中有几场是在 Google 进行的，所以我已经对那个色彩丰富、复古未来感的校园很熟悉，并且清楚地当我从\
  \ `Uber` 落在 Google 之城门口时该去哪里。\n\n在安检检查处签到并拿到胸挂访客证后，我穿过一片 Google 自行车和 Google 巴士的海，在一个明亮的工业风候候室等待，那里装饰着像儿童绘本风格的机器人和飞船壁画。坐在一把亮粉色的扶手椅上，我回顾了\
  \ Andrew 的建议：最有价值的资产是自我认知。“没有人完美，”他那天早上电话里告诉我，“没有人是全才；我们在很多方面都很愚蠢，这没关系。你只需要接纳你所知的，也纳纳你不知的。”\n\
  \n很快，一个穿着格子伐木衫和烫过的休闲裤的三十多岁的男人带我穿过迷宫般的走廊，解释了我将面对的情况：“流程是这样的，你会与不同的 Google 员工小组进行七轮面试——不过这些人未必是你共事的人。我们喜欢获得广泛的反馈。我们所有的员工都会参与面试。”\n\
  \n我跟着他，点头微笑，走进了一间挂着鲜艳艺术打印画的微型厨房。“来，喝点水，”我的接待人说，“这这是一场持久战，你需要这些。”\n\n那个“地铁伐木工”带我来到一间小会议室，房间里有一台大电视，显示着\
  \ `Google Hangouts` 的标志，他说：“他们一会儿会出现在聊天窗口里的。”接着就只有我和一个对着我脸的摄像头在等待。他们已经在看我了吗？我假装若有所思地看向窗外。电视屏幕亮了，我面对的是一个坐在另一个房间的年轻亚洲裔美国男。他的突然出现让我咯笑了起来，这很尴尬。尤其是因为显而易见这家哥没心思开玩笑。他直奔主题，告诉我他作为\
  \ `Gmail` 和 `YouTube` 工程师的工作情况，当然，这两者都是 Google 旗下的。然后他问我自己在 Facebook 学到的最重要的事情是什么，我遵循了\
  \ Andrew 的建议，说了实话：“我学到了我是一个糟糕的经理，”我说。\n\n工程师挑了挑眉毛。他看起来很惊讶，但并不不悦。“噢？你为什么觉得是那样？”\n\
  \n“我可能太年轻了，”我说。他的眼睛瞟到我的简历上，可能在找我的大学学历。我正准备纠正说法并解释虽然我显然仍然年轻，但我已经成熟了，现在更有经验，但 Andrew\
  \ 的话——*接纳你所知的，也接纳你不知的*——在我脑海中回响。我选择了另一条路线。“其实有很多原因，”我说。在接下来的十五分钟里，我列举了这些原因。我知道这不在面试守则中。花整个面试的时间谈论自己的弱点可能是不明智的。但最后，这似乎对我有利。工程师分享说，他在管理上也失败过，而且在\
  \ Google 找到合适的职位后现在感到加倍的快乐。然后他结束了通话，屏幕变黑，有人敲了我的身后的门。\n\n接下来的半小时里，我与有着四年经验的活泼产品经理在校园散步，讨论了团队经常面临的各种设计和工程问题。“你在\
  \ Facebook 面临的产品相关的挑战是什么？”经理 问。*噢不，*我想，我对此这有一个完美的故事，但这意味着又要花一次面试来谈论我的失败。犹豫片刻后，我告诉她\
  \ Facebook 是一家试图装年轻的老公司，所以我发起了 `Teen Talks`，以解决我们如何更深层次地思考和接触青少年市场。\n\n“嗯，”当我们结束这半小时时，那位活泼的产品经理说，“那很有胆量。”我从未那样想过，但也许指责\
  \ Facebook 脱节确实很有胆量。\n\n散步面试之后，我和一个设计师一起吃塔可，她想了解我在 Facebook 之前的经历。到那时，我已经克服了大部分紧张，并进行了一场长达二分钟的独白，讲述我从未是最好的学生，所以我学会了将所有的精力集中在那些我确实最擅长的独特事情上。我说国家有数百万学生在竞争同一件事项的优秀——从总统体能测试到\
  \ SAT 考试——而很久以前我就决定要在自己的事情上做到最好。\n\n在喝完第五瓶水的间隙，在一个摆着亮紫色椅子的会议室里，一个五十岁的男人——一个留着乱发的伯尼·桑德斯式的男人问了一个最奇怪的问题：“二十年后\
  \ `VR` 问题的解决方案是什么？”\n\n“那是哪个问题？”我坐在椅子上向前倾问道。\n\n“显然，”那个男人说，“问题将是世界本身。你会如何把它设计得更好？”\n\
  \n\n\n\n我靠在椅背上，又喝了一口水，想起了几周前我在 Facebook 上发布的那篇文章，关于我所说的“怀旧偏见”。现在，我已经进入了状态。“有些人可能不会认同我的观点，”我说，“但我相信，2040\
  \ 年虚拟世界界面的问题在于，今天构思这个世界的中年设计师们创造了一个破碎的、稀释版的现实。也许最终它会变得和现实世界一样好，但目前，现实世界要好得多。这些设计师怀念他们成长的那个世界，在那里，我们所有的设备都不存在。但你无法倒转时钟。对于那些通过在屏幕切换来与他人联系的\
  \ iPhone 时代，他们对可以全方位环顾的虚拟世界想要什么？”\n\n伯尼在椅子上向前倾了倾身体。\n\n“他们想要的不是可以玩耍的后院，而是三百六度的 iPhone\
  \ 屏幕，视频到处都在播放。”我现在兴奋地挥舞着双臂，“更多的屏幕、更多的标签、更多碎片化的数据、更多的异步通信！”\n\n“老天爷，”伯尼说着，跌回椅子里，“我从没听过这样的回答。那听起来像是……地狱。”几分钟后他离开了，肩膀耷拉着。从他的肢体语言来看，我确信自己这次彻底搞砸了。我一路走到了第五轮面试，结果却让面试官陷入了存在主义的抑郁。结束了；我彻底完蛋了。我等别人来送我出去，但并没有发生。\n\
  \n相反，一位女工程师坐在了伯尼的位置，并开启了一个关于视频压缩算法的话题（对此我一无所知）。几分钟内，我开始有些支吾肘。我试图跟上节奏，使用借来的我并不真正理解的工程师术语，但那位视频工程师的眉头锁在起，试图跟上我那不合理的逻辑。该死。我本离成功了。而现在，我的骗子身份被揭穿了。我缺乏真正的计算机科学教育确实在反噬我。但这时……接受你所知道的和不知道的，”安德鲁的幽灵在我耳边低声说道。\n\
  \n我清了清嗓子对视频工程师说：“如果可以的话，我想做一些研究，然后给你们提供更好的想法吗？”\n\n显然是可以的。\n\n等我再次反应过来时，我正坐在一个亮黄色长椅的树影下，坐在一个穿蓝裙的营销经理旁边，这已经是我的……第七场\
  \ Google 面试！\n\n是关于什么的？到这种程度我已经相当神志不清了。可能我在做梦吗？我模糊地记得自己沙哑地提出了一些心不从意的想法，关于我将如何解决工作伦理冲突的团队成员之间的争议。或者可能是关于博弈论，我怎么知道呢。\n\
  \n虽然一天结束时我并没有获得录取通知，但我觉得自己已经尽全力展现了最好的一面。我精疲力竭、恍神且饥肠如辘，但我感到自己忠于自我，并对此感到自豪。\n\n# 第\
  \ 23 章\n\n## 一生难得的机会\n\n在 Google 经历了“七面之”后不久，招聘人员打来电话给出了非正式的录用邀请。很长一段时间，我一直担心被 Facebook\
  \ 录取仅仅是因为我年轻，人们觉得这听起来是个不错的故事，或者，也许他们喜欢我的应用——但我并不真正胜任这份工作。Google 的信赖让我相信，也许我是有价值的。我爬了又爬，精疲力竭，感觉自己要掉下来了，就在我即将坠落的前一，我冒险迈出了最后那一大跨跃，跳到了另一艘火箭上。当我睁开眼时，我发现自己降落了一个新顶峰，比我以前任何时候都要高。如果我是在玩电子游戏，我已经到达了一个全新的等级。\n\
  \n需要几个月的往来电话才能敲定我在公司的具体工作内容以及他们将付我多少钱。期间，我仍然必须每天出现在 Facebook 并尽力而。我也继续在公司全体 Facebook\
  \ 页面发布每日笔记。我仍然痴迷于我们应该如何做更多事情来吸引青少年。\n\n某天，在我发布了一篇关于 Facebook 的视频功能可以从 YouTube 的创作循环中学到什么的笔记后，桌上的手机亮了。是\
  \ Google 的招聘人员。\n\n为了为了薪水打来的。这是我又陷入的另一个混乱局面。当她最初提供 Google 的非正式邀请时，招聘人员要求我回复我想要的薪水。安德鲁警告我不要回答——让他们给我一个数字，然后往上还价。这样我就不会冒着低估自己的风险，要求的远低于他们可能愿意支付的金额。我尝试采纳这个建议，但招聘人员回电时，我正特别分心——正骑着自行车全速穿过拥挤的\
  \ Facebook 校园赶约。于是我妥协了，脱出一个比我在 Facebook 薪水仅高出一点点点的数字。\n\n几乎立刻，我感到一阵恶心，是的，我把自己低估得太可怕了。（我什么时候才能吸取教训，忽视安德鲁的建议永远是没有好处的？）\n\
  \n“你收到我前几天发邮件给你的薪水细节了吗？”招聘人员现在问道，“一切还好吗？”\n\n我用一种我自己从未听过的权威回答道：“我重新考虑过了，”我说。\n\n\
  几秒钟的。纸张的沙沙声。又是沉默。\n\n“但我是根据你给我的数字来做的，”招聘人员终于说道，显然很慌乱。\n\n“只是我做了一些尽职调查，现在认为报价太低了，”我想道。“尽职调查”？这个词是从哪儿冒出来的的？\n\
  \n“我明白了，”她说，“好吧，只要你能——我想让你对加入 Google 感到兴奋，我们真的想要你在这里。所以，什么样的数字能让你动心？”\n\n“我会让你知道，”我说。酷酷迈克正要挂电话时，讨好型迈克插了进来欢快地说：“非常感谢！回头联系！拜拜！”好吧，这算是个好的开始。\n\
  \n\n\n\n我停下脚步，依然紧握着 Prowler，低着头，汗水从鼻尖滴落在运动鞋尖上，心里思考着这一切。我转头看向杰斯明（Jasmine）。“你知道吗？你是对的！等等，不，为什么要停在这里呢？如果我要求的比我现在的薪水*多出一倍以上*呢？”我是那少数既有活力又有多年\
  \ App 开发经验的人之一。毕竟，在过去的八年里，我已经开发了三十四个应用。有些表现很出色，有些则一开场就失败了。但重要的是，我从未停止过创作，而且在掘金之前不会停止——事实上，即便在那之后也不会。我永远不会停止制作。对于任何跟我聊天超过五分钟的人来说，这一点表现得显而易见。但最重要的是，我知道成为硅谷那个炙手可热的年轻人的价值。“我要要五十万万美元！”我脱口而出。\n\
  \n杰斯明停止了跳动。“噢，迈基，我刚才只是在开个玩笑。我不知道那是否真的行得通！也许你应该要求稍微涨一点？”\n\n我总是不擅长听讽刺性的玩笑。我直起身子。“不，我要做了。”\n\
  \n杰斯明的脸亮了起来。“好吧，行吧！”\n\n两分钟后，我们在球场中间抛弃了 Prowler，我大步向我的健身包走去。我拉开拉链，在里面找手机。\n\n“嗯，迈克尔，你觉得你也许应该花点时间，计划一下你要——”\n\
  \n我挥挥手让杰斯明离开，手机已经贴在耳朵。电话通了。\n\n“迈克尔！”招聘人员说，“比我预想的要快！你想好具体的数字了吗？”\n\n我深吸了一口气说：“我考虑了很久，我认为一个合理的薪水应该是——”我开始要求\
  \ Google 支付给我在四年归属期内总额达两百万美元的。\n\n招聘人员发出了小小的抽气声，然后沉默了。我咬着唇等待着。\n\n“关于这一点我得回复你，”她说。\n\
  \n* * *\n\n—\n\n现在回想起写话时，我的一半内心仍然无法相信我竟然有胆量在那天进行如此激烈的谈判。但另一半的我却完全深信不疑。当时可能并没有意识到，但从小被新闻记者围着生活的经历让我学了一项非常有价值的技能：当你没有信心时，展现自信的关键在于抛弃负面想法——直接把它们扔掉。*现在*你坐在驾驶位上，进入了谈判模式。关键在于表现得积极，专注于你的长处和成就。无论你感到多么压力或焦虑，只要记住你可以把那些压力和焦虑丢掉，等面试或谈判结束后捡回来。\n\
  \n今天，我告诉每一个向我寻求建议的人：不要为争取任何你能得到而感到害羞。争取高薪最大的机会就是第一次被录用时。有时雇主会做出随着时间推移会给你更多的模糊承诺，但不要寄于此。清楚你*今天*的价值，并为之战斗。\n\
  \n* * *\n\n—\n\n在接下来的两周里，我一直在等待，准备迎接招聘人员带回理由列表，解释为什么 Google 绝不可能为我提出的那个疯狂数字提供理由。我想，在最好的情况下，他们会在原始报价的基础上给出一个高一点的还价。最坏的情况：我得罪了他们，他们会撤回录取通知。\n\
  \n也许这并不是什么坏事，我对自己说。这份工作有时还是很有趣的。例如，和马克·扎克伯格（Mark Zuckerberg）发 Snapchat。有多少人能说他们做过那个？扎克伯格发的动态总是让我大笑，我很享受向他解释典型的青少年如何使用这个产品，而他的用法又是怎样的。没有什么给世界上最有权的人之一发\
  \ Snapchat 以及对这家价值数十亿美元的公司提供产品策略反馈要比这更酷的事了。\n\n对改变极度恐惧，我试图抓住任何理由留在 Facebook，那是我经历过的唯一工作。我甚至开始怀疑，自己是否在潜意识里通过要求高得离谱薪水来破坏\
  \ Google 的机会。那可太糟糕了。留在舒适区内难道不是某种便利性可言吗？\n\n当几天后 Google 的招聘人员给我回电话时，我 97% 确定自己会拒绝还价并留在此处。\n\
  \n“迈克尔，”电话那头的招聘人员说，“我有一个非常好的消息。我获得了批准，可以给你*几乎*完全你要求的金额。”接着她报出了一串令人目口呆的数字。\n\n她停顿了一下，等我回应。但这一次我的沉默并不是一种权力博弈；我是太震惊了，发不出声音。当我终于找回声音时，它说出了最不可思议的话：“谢谢。我可以再考虑一下吗？”\n\
  \n“*考虑一下*是多久？”招聘人员用一种我从未听她过的坚硬语气说道。这可以理解。在两个月的反复拉锯后，这个女人为我争取了很久，将我最初要求的薪水翻了一倍多。我在想，她是如何向她的上级解释合理性的？我真的值这么多钱吗？我从未梦想过过。我是根据别人告诉我的价值来定价的，但那种感觉很难捕捉。\n\
  \n\n\n这家餐厅其实是一家老派的意大利餐厅，到处是红格纹桌布、金斑镜子、深色木家具和黄铜扶手。我一眼就看到了布拉德，他正坐在窗边的桌旁，低头盯着手机。我心里一阵发凉。在他抬头之前的那几秒钟里，我脑海中闪过一个转身推门出去的冲动。但太晚了。布拉德看到我了。他正笑着，看起来挺不错的。我强挤出一个微笑，坐在他的对面。我们交换了一些客套的闲谈，就像异性约会时那样——我们各自为了来这里旅行了多久，对终于放晴了有多开心，菜单上什么菜看起来不错等等。不过，布拉德的琥珀色眼睛确实很特别；每当他用那种调情的方式微笑时，眼睛就会闪烁光芒。我试图把注意力在他琥珀色的眼睛上，而不是关注这个人的其他地方与我的预想有多不同。我还是看不出他有多高，但他看起来不像\
  \ Tinder 照片上的样子；他没那么可爱。在 Tinder 上互回消息的这一周里，我一直幻想的是一个更刺激、带点神秘的人。但布拉德本人看起来更诚实，而不是更刺激。\n\
  \n在我们聊天时，我所有的精神精力都用来分析布拉德的每一个动作和每一句话。当我说我没上过大学时，他为什么要放下叉子并那样歪着头？他是同情我还是怎么？当他说他“喜欢”他的营销工作时，是意味着他觉得有趣且有挑战性，还是意味着他讨厌它但不想抱怨？他似乎并不急于在世界上闯出一番名堂。这让我有点沮丧。我希望这个家伙内心还有某种动力，但又有些怀疑。\n\
  \n随着我们的交谈，我投入了全部精力去分析布拉德的每一个手势和话语。当我说我没上过大学时，他为什么要放下叉子并那样歪着头？他是同情我还是怎么？当他说他“喜欢”他的营销工作时，是意味着他觉得有趣且有挑战性，还是意味着他讨厌它但不想抱怨？他似乎并不急于在世界上闯出一番名堂。这让我有点沮丧。我希望这个家伙内心还有某种动力，但又有些怀疑。\n\
