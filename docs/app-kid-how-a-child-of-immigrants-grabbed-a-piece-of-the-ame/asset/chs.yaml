  “别碰它，谁也不准碰！”我说。\n\n接下来的十分钟里，我们推测我们看到的是哪种损害大脑的物质，以及它的价值是否足以让它的主人特意回来。幸运的是，似乎没有人想过要尝试它。正当我正在谷歌“海洛因的质地是什么”时，我姐姐像对着生日蛋糕一样俯身那堆粉末，把白色粉末吹得满屋都是。\n\
  \n现场是一阵震惊的沉默，我们四个人看着她所做的一切：那小撮白色粉末消失在地毯里、灯罩上、窗帘上，还有香蕉植物闪亮的叶子上。“玛丽娜，”我终于开口了，“为什么要那样？”\n\
  \n我姐姐只是拨了拨她的长黑发，用她那种非常玛丽娜、非常十八岁的语气耸了耸肩。那是整个晚上最最棒的时刻。\n\n***\n\n—\n\n第二天晚上，我们重演了一遍，只不过我没哭。酒店要求至少住三晚，所以在玛丽娜和她朋友的坚持下，我们举办了第二场派对，同样喧闹。我太精疲力竭，被似曾相识的感觉淹得无法感受自己的情绪。感觉我已经处于未来，而那个镶着钻石牙齿在酒店房间走廊香蕉树上撒尿的家伙已经成了过去。还有那些戴着纸板皇冠的送嫁会女孩们，她们把粉色的饮料泼洒在我负责维护的白色沙发上。我对于那些无礼的派对闯入者没说出口。奇怪的是，我几乎很感激他们。他们向我证明，这些破事都不是我孤独的答案，而且永远不会。\n\
  \n***\n\n—\n\n那是第二天，已经过了退房时间一小时。玛丽娜和她的朋友已经走了。我正在前台签那张 26000 美元的酒店账单，我妈妈戴着遮阳帽、穿着佩斯花纹长裙出现在我身边。她和我爸爸正在用我的预订使用泳池——枫丹纳酒店（Fontainebleau）有十一个泳池；我一个都没见过。“别*走啊*！来跟我还有爸爸一起玩儿吧！”妈妈恳求道，抱住我。“那里有音乐，还有早餐！他们说总统套房的客人可以免费享用！”\n\
  \n起初，我担心父母会对我这种浮夸的庆祝怎么想。我想这有两种可能：要么我爸爸妈妈会感到不舒服和恼火，觉得我在向他们炫耀金钱，要么他们会欣喜若狂，把我的挥霍看作证明我有足够的钱从今天起供养他们。\n\
  \n无疑是后者。我决定对此不那么愤世嫉俗。我的父母一直乐于享受良好的生活，即使那超出了他们的经济能力。\n\n我真正想做的是回到公寓睡觉，睡掉在`Google`\
  \ 入职前的这十天。我担心如果我和父母待得太久，他们就会开始要钱来买更好房子的首付，或者是一笔急需的房屋装修费，而我会感到进退两难却又太累而无法离开。但我妈妈正用小狗眼看着我。我跟着她来到亭，换上泳衣，加入了她和爸爸当天占领的温泉池。\n\
  \n“*儿子（Hijo）*！派对怎么样？”我爸爸对着开到最大的喷水嘴大喊道。在起伏的水中，他手里拿着一杯血玛丽，另一只手拿着一根被咬过的芹芹茎。\n\n“嘿，迈克尔！”妈妈说。\n\
  \n“怎么了，妈？”\n\n“别思考了！”她向我泼水，我也回过去。我意识到这正是我整个周末真正想要的。我只想大笑。\n\n# 第 26 章\n\n## 新谷歌人\
  \ (Noogler)\n\n“去吧，”我们的领队鼓励地说道，“展现谷歌范儿（get Googley）！”我和几个其他新员工聚集在色彩鲜艳的房间里，我坐在一低矮的幼儿园风格桌子上，膝盖顶着耳朵，用小剪刀剪着彩色纸形状。这是我们入职的第一天，我们都戴着“你好，我叫……”的胸牌。我剪星星和彗星剪得正开心，但我桌旁边的其他人——他们看起来都比我大一倍年纪，穿着职业范的西装外套、裙和衬衫——似乎并不分享我的热情。\n\
  \n“*噢*”坐在我左边的女人嘟囔道。她脱掉高跟鞋好让腿伸进桌下，但穿着那身灰色羊毛套装看起来依然局促且不舒服。\n\n\n\n从技术上来说，并不是我们所有人都是所谓的“Noogler”（谷歌对入职第一周员工的称呼）。Google\
  \ 是母公司 Alphabet 拥有的几家公司之一。2015 年，Google 正在追求许多项目——自动驾驶汽车、长寿研究、城市创新等等——使得创始人谢尔盖·布林（Sergey\
  \ Brin）和拉里·佩（Larry Page）决定将每个非互联网部门拆分成独立的公司。他们创建了 Alphabet 来持有所有这些公司，其中包括最大的 Google。我简直无法相信自己现在在\
  \ Google 工作！我所学过的一切——编码、编程、设计——都是通过 Google 自学的。这感觉就像多萝丝到达了奥兹国，魔法师给了她一份工作一样。我半辈子生都在沿着这条黄砖路走向这一刻。而最棒的部分是，我可以再次说出“搜一下（Google\
  \ it）”了。Facebook 的传播团队不喜欢在接受采访时将“Google”当作动词，他们更倾向于使用“搜索网络”。\n\n当入职导师满意于她的新兵们通过剪刀充分表达了自我后，她拍了拍手，用一种像老师唱歌一样的语调说道（我希望这只是她在进入角色）：“现在是进行批判性思维和小组合作练习了！”\n\
  \n`Uh-oh`，我心里想着放下剪刀。小组合作：不是我的强项。\n\n“每桌人，”老师继续说道，“都要概念化一个游戏，并用我们为你们提供的材料来构建它。制定你们自己的规则，写下来，然后我们分享。创造出最清晰、最有效用户体验的团队获胜！”\n\
  \n桌对面一个留着胡子的爸爸型男人开始仔细地卷起他的格纹衫袖子。桌上的每个人（除我之外）都戴着婚戒指。“让我们开始吧，团队！”他说，“有什么想法吗？”\n\n\
  我告诉过安德鲁（Andrew），我会尽力在 Google 成为一名团队合作者，现在没有比现在更好的时候了。我拿起一叠纸质纸杯。“投掷游戏？”我提议道。\n\n\
  “好啊，”另一个团队成员说，“为什么不呢？”\n\n我们想出了一个游戏，人们轮流将纸球投进杯子里。如果投中了，他们就可以问另一个玩家一个关于自己的问题。如果没中，他们就要分享一件事。听起来对我们来说很简单。但别人并不这么想。当我们准备“发布”我们的作品时，其他几桌的人看不懂我们用蜡笔乱画的说明，似乎对我们命名为“纸球投掷游戏”（Paper\
  \ Toss, the Game）的游戏感到普遍困惑。当竞争对手列出他们的抱怨时，我有趣地注意到我的同桌同事在摇头和叹气，他们似乎对我们的失败感到非常介意。`Pffft`，穿紧身灰色西装的人（Pinched\
  \ Gray Suit）哼了一声。“我那四岁的孩子都能遵循那些说明。”\n\n我打算从今天中学到一些东西，哪怕只是入职导师的一句提醒：“如果你不喜欢测试你的产品，你的客户很可能也不喜欢测试它。”新迈克尔（The\
  \ New Michael）完全专注于成长，如果这意味着要接受成人幼儿园的教训，我乐意。我会接受这一切，甚至戴上入职导师在课程结束时发给每个 Noogler 的那种顶上带有小螺旋的彩色针织帽。这些帽子要在整个入职第一周都戴着。与我那些志向高远的同桌同伴不同，当我们被带到\
  \ Noogler 雕像前合影时，我自豪地戴着我的帽子，那是一个巨大的绿色安卓机器人，它也戴着它自己的帽子。当更资深的 Google 员工骑着彩色自行车飞驰而过并喊着“欢迎！”时，我挥手回应，脸上带着微笑。\n\
  \n下午四点，我们的导师再次拍手，用像小学的声音宣布：“大家，等一下，你们的经理就会来接你们，带你们去你们办公楼，并向你们介绍你们的团队！”\n\n在 VR 开场活动落空后，招聘人员和我决定我非常适合\
  \ Google Assistant 团队。Assistant 是 Google 在一年前（即 2016 年 5 月）推出的人工智能助手。它就像 Siri 一样，你可以要求\
  \ Assistant 为你做些事情——找歌词、查航班信息、给妈妈打电话等——有时，有时有时并不，你能得到你想要的。目标是不断改进它，直到它成为人类搜索互联网、写电子邮件以及执行其他维持我们生活的日常工作的首选方法。\n\
  \n我的新经理——我会叫她紫罗兰（Violet）——是 Google Assistant 的产品总监之一。我以前从未见过她，但现在我假设她就是那个浅棕色皮肤、留着长黑发、正快步向我走来并伸手的女性。\n\
  \n“迈克尔，见到你很高！跟我来！”快速握手后，她继续向前走。我努力跟上而没有跑起来。现在我和其他 Noogler 被分开了，我觉得自己戴着那顶螺旋帽像个白痴，又像个头上顶着内裤的兄弟会入会者；我恨不得立刻把它摘掉，但不想表现得不忠爱国之类。我开始感受到\
  \ Google 的规模。Alphabet 全球七万五千员工中，约有一半在 Googleplex 工作。这个地方让 Facebook 一万四千人的梅洛帕克（Menlo\
  \ Park）园区显得很古朴。\n\n“很高兴你在这里，”紫罗兰说，她大概三十多岁。“我们真的需要千禧代的视角。”\n\n“事实上——”我开始说，然后又止止了。\n\
  \n老迈克尔几乎要解释说清楚，虽然我出生在千禧一代的末尾，但我与 Z 世代（1997 年以后）更有共鸣。但我是新迈克尔。\n\n“很高兴你在这里，”我结束道。当我们交谈时，我看到很多拉丁裔。我立刻注意到关于她的一点——她看起来干练且强势。每个路过的人都对她微笑并点头。她非常有威严——我知道她会期望我非常、非常快地上手。\n\
  \n\n\n\n***\n\n在我上班的第四天，我开始后悔那份信任了。我一直在反复修改我的项目范围，以准备向 `Violet` 汇报，由于过度的紧张和自我怀疑，我头晕欲痛。\n\
  \n当真到了最后时刻时，我感到非常恐惧，觉得自己像个孩子一样。办公桌旁边的滑梯（我一有机会就用一次）以及每个休息区里的乐高积木（我一直在克制自己不去碰）并没有带来什么帮助。办公室里到处散落的拼图和玩具，甚至是其中一栋楼里那个巨大的球池也无济于事。这种“回归童年与成年人生活”的交织感让我非常困惑。\n\
  \n尽管内心充满恐惧和不安全，但我没有陷入那种黑暗、自我厌恶的情绪。我会保持开放。我是“新的迈克尔”。\n\n在和同事聊了几天并做了些笔记后，我清楚了我想做什么。我觉得如果教\
  \ `Assistant` 读懂用户语言中的言外之意会很酷。由于大多数人并不习惯对现实生活中的助手下达命令，我想如果 `Google Assistant` 能够察言观色，甚至在用户意识到需求之前就判断出需求，他们可能会用得更舒服。例如，`Assistant`\
  \ 擅长执行这类命令，比如：“提醒我明天下午两点去剪发。”但那是人对电脑说话的方式，而不是对人说话。如果你是在和一个有血有肉的助手对话，你可能会抱怨自己的头发看起来多糟，而他们会理解你实际上是在寻求帮助。简而言之，我想教导\
  \ `Assistant`，如果用户说“我该如何漂自己的头发？”，它应该回答：“也许我应该为你预约一个沙龙位子？”\n\n`Violet` 给了我绿灯，于是我组建了一个团队，组建包括联系了几位工程师，询问他们正在忙什么项目，以及他们是否愿意帮助我们构建\
  \ `Assistant`。（可以肯定的是，任何在 `Google` 工作的工程师都很优秀。）我们的团队只是两百多个致力于 `Assistant` 的团队之一。所谓的\
  \ `Google Way` 显然是让许多团队独立工作，让最优秀的项目脱颖而出。\n\n几乎立刻，我发现自己完全不知道在这个系统中如何运作。我不知道该问什么问题，也不知道为了完成任务必须和谁交谈。我不知道如何与人进行最佳沟通，如何在内部查找他们、设置日历邀请或预订会议室。`Google`\
  \ 的内部工具对我来说非常陌生。我习惯了 `Facebook` 使用的那套工具。我不知道我应该参加哪些会议，或者应该在哪个日历上安排自己的会议。以我过去的失败为教训，也许我有能力带领一个团队完成一个项目，但没有什么准备能让我应对在由两百个团队组成的网络中进行和融合的挑战。\n\
  \n这份工作适合那种在高中时就有一个带分类标签的大三环活页夹的人，而不是那种直接把纸张塞进书包就忘掉它们的人。我才刚刚开始，就已经开始担心自己可能无法胜任这份工作。\n\
  \n# 第 27 章\n\n# 那种圣诞节的感觉\n\n那是感恩节后的那个周日，我的 `Target` 购物车已经满了四之三的圣诞垃圾。我扔进了一个木质的“圣诞老人在此处停车”的牌子，盯着我的战利品看：两盒闪烁的花串灯、一个雪人饼干罐、印有“Feliz\
  \ Navidad”字的手巾、一个雪人毛绒玩具、一个圣诞树雪球，还有一包限量版的苹果肉桂节日空气香薰，好让公寓闻起来像家。通常情况下，看到这些东西会让我感到无比的快乐。但由于某种原因，它们并没有驱散我持续了一整个周末的忧郁情绪。\n\
  \n我曾以为这只是因为在 `Google` 工作了一整天，然后熬通通宵改进我的新应用 `Lies` 导致的倦怠，这个 App 虽然赢得了媒体的关注，但并留不住用户。工作压力通常可以通过适当的休息得到很好地缓解，而这个周末我已经得到了充分的休息。我没有像往一样和家人一起过节，而是留在加利福尼亚和三位同事一起过了“朋友感恩节”，剩下的周末都在玩视频游戏和看电视度过。现在，我正在做我最喜欢的事情：逛那些丑的节日装饰品。\n\
  \n那么，我的问题在哪里呢？我对于错过感恩节（以及随之而来的不可避免的家庭剧）没有任何遗憾。但也许，我确实想我的家人。\n\n我一直在思考生日派对结束后，和父母在\
  \ `Fontainebleau` 池边度过的那个下午。那是几年来我们相处最快乐的时光。我想让时光再次回到那时。也许我可以在圣诞节带我们四个人去 `迪士尼 World`，那是我们的快乐乐园。或者……我拿起雪球摇了摇。噢，那当然当然了！纽约的圣诞节！一个寒冷的圣诞节，有滑冰、有真树，也许还有——作为所有幻想的顶点——几场雪。那是我们需要的。尤其是我妈妈。\n\
  \n我妈妈太喜欢圣诞节了。我是从那里遗传的。那是她最喜欢的节日，或者至少在经济危机之前是这样，那时餐厅生意很好，她可以送我们很多礼物，每个人都能穿上配套的睡衣。她仍然提起\
  \ 2004 年的圣诞节，那时我爸爸刚用信用卡买了一辆全新的深红色 `Ford Excursion`，我们从佛罗里达一直开车到了那里。\n\n\n\n\n我确实热爱我的工作。但它并不总是与我的经营风格相符。我倾向于发散性思维：要么全力投入`Google`，要么全心贯注到我自己的应用中。这两个世界曾有过交汇的时刻，但大多数时候，我觉得自己像一个园艺爱好者，迫不及待地离开工作，好让自己能接触土壤。\n\
  \n“只要那间房就行，”我说。\n\n前台点点头。“我们现在为您安排的是间朝朝的房间，但您也可以选择升级到时报广场房。”她转过屏幕面对我，指着一张奢华房间的照片，窗外是高耸入云的摩天大楼、闪烁的广告牌以及在布莱华大道上流动的数千辆汽车。那间房要贵出近\
  \ 700 美元。\n\n我看向我的父母，他们正在休息室欣赏同样的景色。我妈妈正兴奋地指着，回忆着我们在 2004 年旅行时记得的所有地标。看到她重新找回圣诞精神，感觉真好。“行，我要那间房，”我说。\n\
  \n玛丽亚娜吸了一口气。“爸爸！”她穿过大厅大大道道，“你知道迈克尔刚才做了什么吗？”\n\n“玛丽亚娜，闭嘴！”我低声说，拿上房卡，朝房间中央巨大的圆形电梯间走去。\n\
  \n“他刚才做了？”我爸爸问。\n\n“迈克尔，告诉他们！”玛丽亚娜的眼里闪烁着秘密的光芒。\n\n我耸了耸肩，像没事一样，比起我在`Fontaine`上花掉钱，这确实没什么。“我为我们订了时报广场的景观。”\n\
  \n“不，不！”我爸爸叫道，捂着胸口。我们已经在电梯里了，正冲向三十层。\n\n“迈克尔，你不必这样的！”我妈妈说，拍了拍我的手臂。\n\n但当我们打开房门时，所有人同时吸了一口气，冲了进来。从这里看景色更漂亮。外面开始变暗，天空呈现出棉花糖粉色。广告牌现在看起来充满了未来感；其中几个看起来像带有\
  \ 3D 效果的全息投影。\n\n我妈妈低声呢喃着，像是在祈祷。\n\n“啊，我爱这里！我们在时报广场！”玛丽亚娜说道。她拿出手机打开`Snapchat`，然后拍了一堆自拍准备发布。“你能想象如果下雪会怎样吗？白色圣诞节？我的天呐。”她再次拿出手机查看天气。我们\
  \ 2004 年来过圣诞节时，唯一缺的就是雪。我从三岁起就没见过雪了。\n\n我爸爸坐在床上，眼里含着泪，看着这一切。\n\n“一切还好吗，爸爸？”我坐在他身边，望向窗外。\n\
  \n“我以为我没机会再做一次就要死掉了，”他擦了眼睛说。然后他笑了，拍了拍我的背。“谢谢，Cocolocho。”\n\n我同时感到自豪、为爸爸感到心，并觉得自己很糟糕。让我的父母开心是那么容易。而且我——至少目前——有能力做到这一点。可我为什么不经常这样做呢？我为什么总是对自己的每一个慷慨冲动产生疑虑？我曾担心带他们来这次旅行，会让他们产生一种预期，让我再次支付他们一辈子的费用。当他们看到我花了多少钱时，总会有人提到我现在有多少钱，这会让我产生防备心理，然后玛丽亚娜就会指责我自私、做得不够，而我会后悔做过任何事——或者感到如此愧疚，以至于最后向他们开放我的银行账户。我瑟了抖抖。我和我的家人，我们必须学会更好地沟通。不仅是关于财务方面，还有关于我“可能可能是同性恋”的事，自从几个月前我尝试向他们分享这件事以来，它一直没有得到解决。父母对我宣布曾约过一个男人的事毫无反应，这一直压在我的心头。我的计划是在一家温馨的餐厅晚饭时提起这件事——轻描地告诉他们，自从我提过的那个`Tinder`约会之后，我也约过另一个男生一段时间。我会说那并不认真，但尽管如此，得出的结论是我对男性的兴趣并非一瞬即逝。\n\
  \n那天晚上在酒店餐厅吃晚餐时，我并没有说这些。我们玩得太开心了，我不想看到爸爸的笑容消失。\n\n第二天，我也没有找到合适的时机。当我们漫步在城市里时，裹着外套，戴着装饰有雪花和毛绒球的针织帽，自豪地享受着我们的游客身份。我知道我的家人并不兴趣于看“正宗”的纽约。他们想要百莱华剧场的《阿拉丁》、第五大大道的蒂芙芬，以及“我爱纽约”的纪念品——所有我们在\
  \ 2004 年旅行时见过、做过的一切——而我想满足每一个愿望。\n\n圣诞前夜，我们在中央公园的`Boathouse`拍了自拍；手挽手走在`High Line`上，挡住了所有人的路；进了一家只卖饼干面团的店；最后来到了`9/11\
  \ 纪念广场`，那里的树在冬日光秃秃的，双纪念池的青铜墙冷刺骨，即使隔着我妈妈让每个人穿的三层衣服也依然如此。我们排成一排，撑着前臂向下俯，尽管这本是不该这么做的，听着我爸爸讲述详尽的历史。\n\
  \n\n\n那天晚上，我们做了所能想到的最有圣诞氛围的事，直奔罗克菲勒中心去看那棵巨大的圣诞树。在迈阿密，真正的圣诞树极其罕见，是一种巨大的奢侈，而我妈妈对此百看不厌。即使在经济衰退之后，她总是会尽全力为我们弄来一棵真正的、活过的树。所以，顶着人群去看罗克菲勒的圣诞树是值得的，那是圣诞旅游的巅峰。玛丽亚娜和我甚至忍受了一小时的排队，只在那个小小的冰场上滑了大约五分钟，这时间足够我妈妈拍下几千张照片，记录下我们踉跄着、脸上带着疯狂笑容的样子。\n\
  \n午夜时分，我们既寒冷又饥饿，正前往另一个旅游胜地硬岩石咖啡馆，天突然下起了雨。“就像 2004 年一样！”我爸爸这周已经说了第百遍了。\n\n接着，我注意到雨下得比在迈阿密时慢了。\n\
  \n“是雨下得慢了吗？”我对大家说，“还是我真的太累了？”\n\n我们停在人行道中间，抬头看着落下的水滴。\n\n“不，你说得对。它们下得慢了，”玛丽亚娜说。\n\
  \n接着，我们四个人同时爆发出一阵巨大的欢呼。“下雪了！”我们一遍又一遍地叫着，跳来跳去。“下雪了！”\n\n别管那是多么作狗的雪，更像是一种一碰到人行道上立刻就会融化的冰雨。但对我们来说，那就是雪。\n\
  \n# 第 28 章\n\n## 解除锁定（Unblocked）\n\n“有什么好笑的？”\n\n我从屏幕前抬起头，看到雅各布——就是那个帮我拿到 Google\
  \ 第一次面试机会的 VR 总监——正站在我的豆袋椅旁。\n\n“噢，嘿，哥们儿——没什么！”我跳了起来，关上笔记本电脑，那是一个来自 Facebook 的设计师朋友发来的电子贺卡。她取了爱德华·蒙奇克那幅著名的画作《尖叫》（`The\
  \ Scream`），并在上面用节日的金色字体写道：“2018 年快乐！我们都要死了！”\n\n距离我上次和雅各布说话已经三个月了——几乎是从我入职公司开始算起。几天前，我通过聊天工具给他发了信息，告诉他我对这份工作并不很兴奋，正考虑离开。他告诉我我也打算转型——离开\
  \ VR 团队，去 Google 的一个名为 `Area 120` 的新部门，那里可能也有我的一席。\n\n我给了雅各布一个哥们儿拥抱。\n\n“有时间去喝杯咖啡吗？”他问。我得笑了——每个人*总是*会提议喝咖啡。我讨厌那玩意儿。通常我只是答应，然后点水。这一次我提议道：“吃点东西怎么样？”\n\
  \n一小时后，在 Heritage（这是我在 Google 最喜欢的餐厅之一），雅各布握了我的手就离开了，留我一个人坐在面前空盘子前。我感到有点震惊。我们刚刚讨论的内容——几乎太巨大而让人无法处理。我用了一个从初中起就一直使用的小技巧：快速地抖动膝盖，用鼻子深吸一口长长的、缓慢的“闻茶香”气，然后用嘴呼出一口“吹汤”气。好受多了。现在我需要整理思路。我闭上眼睛，开始在大脑中画一个类似气泡图的东西，将与雅各布谈话中的关键数据点分成独立的圆圈，防止所有事情混在一起让我压力过大。我脑海中每个气泡的颜色分别是黄色（积极数据）或灰色（负面数据）。\n\
  \n第一个圆圈：`Area 120`；亮黄色。显然，`Area 120` 是一个孵化器，人们在那里可以整天忙自己的事情。这多酷啊？它的灵感来自 Google 的“20%\
  \ 时间”传统，即允许员工将工作时间的五分之一花在可能从长期来看有助于公司的个人项目上。在 `Area 120`，Google 员工将 100% 的时间花在那些\
  \ 20% 的项目上。因此得名 `Area 120`。\n\n第二个圆圈：`Jacob`；黄色。他正准备从 VR 转到 `Area 120`，从事一项非常前卫且高度机密的工作。\n\
  \n第三个圆圈：雅各布知道的/传闻；浑浊的灰色。他到底说了什么？类似于：“有传闻你正在和投资者谈，离开这里去创办自己的 App 公司。”是的，他肯定说了“传闻”，这意味着其他人也听说了。紫尔莱特（Violet）听过吗？这不会让我感到意外。她似乎有种可怕的全知全能。我告诉过她我想留在\
  \ `Assistant` 部门。我答应过会试。这部分感觉确实很浑浊。\n\n第四个圆圈：离开 Google 创办自己公司的可能性；琥珀黄。传闻是真的。就在我的家人去纽约旅行之前，我联系到了几位风险投资人——他们自己机构的合伙人。他们知道我的很多\
  \ App，并对 `Lies` 特别印象深刻。他们不在乎它表现一不忍睹，我也不在。我只花了几个周末构建了它，而且从未更新过它。事实上，这正是投资者们如此喜欢我的原因：我速度快且多产。`Jacob`\
  \ 曾提到过我是他合作过的最快的移动 App 工程师。如果说我的个人记录证明了什么，那就是我不会让失败停下脚步，甚至放慢我的速度。我只是不断实验、构建，然后再次失败。总有一天，运气一定会站在我这边。\n\
  \n第五个圆圈：VC 哥们儿；深灰色。他们非常积极地想要支持我离开 Google 自谋出路。如果我构思了下一个 `Snapchat`，`Area 120` 将拥有它，但我至少可以分到估值中的一份股份。第六个圆圈：Google；水泥灰。\n\
  \n第七个圆圈：雅各布刚刚提出的建议；电黄色。好吧，那不算一个录取机会。从技术上讲不是。但听起来就像雅各布说过的：“你被视为他们想要支持的人。”\n\n等等，加上我心中的“成功奖金”，如果那个\
  \ App 真的运行得很好。`Area 120` 将拥有我在为他们工作期间创造的任何东西对我来说没问题！反正，游戏不会永远持续。我会有薪水、福利、保障和自由。\n\
  \n我清楚地理解了一切。我站起来走到外面，感到奇奇地轻盈。\n\n* * *\n\n在与 `Jacob` 谈话三周后，还有一些性工作需要完成，但基本上已经搞定了：我向\
  \ `Assistant` 部门和松了气的 `Violet` 告了别，搬到了 `Area 120`，在那里，我的全部工作就是做我热爱的事：发明和构建游戏。我在\
  \ `Area 120` 很快就找到了节奏。我立刻开始构思一个我考虑已久的社交媒体 App 方案。\n\n\n\nArea 120 的办公室看起来比 Noogler（谷歌新员工）培训室更像一个托儿中心。每一面墙都挤满了色彩斑的艺术品，到处都是乐高。虽然\
  \ Assistant 大楼也散落着乐高，但那并不是一种特定的*主题*。在 Area 120，我们对乐高的喜爱程度完全是另一个境界。桌子上、乒乓球桌和 VR 房间里放着大盆的\
  \ Duplo 积木和经典款积木，还有小玩具车、叠乐套装和拼图——尽管我从未见过有人在玩这些东西。\n\n这个地方到处是玩具，以至于在我第一天的参观中，我曾问过人们是否带孩子来公司上班。\n\
  \n“嗯，这些不是给孩子玩的。我们喜欢鼓励大家休息一下，留出一点‘自我时间’来探索他们的创造力，”我的导游告诉我，“我们希望我们的创始人能够放松下来，做回自己。把它们看作释放创造力的工具。”很有意思。\n\
  \n***\n\n我的创造力已经得到释放了。我的创造力正从许多喷泉中喷涌而出，就像拉斯维加斯的百利时喷泉一样。但这并不是因为那些玩具。而是因为过去的几个月里，我一直在仔细地倾听自己的直觉。它告诉我不要放弃我的\
  \ App，要把它们置于首要位置。然后，当风险投资人找来并不断提高资助我游戏 App 初创公司的出价时，我必须格外仔细地倾听。拒绝那个机会是一个艰难的决定。但我并没有像往常那样闭着眼睛就立刻扑上去，而是坐下来思考了一会儿，感受自己每次与\
  \ VC 谈话以及想象与他们合作时的感受。尽管我对开发社交游戏 App 感到兴奋，但对 VC 这种情况的直觉一直是灰暗的。当 Area 120 的机会出现时，我计算了数据，比较了在孵化器保护伞下创业与与一起创立自己的初创公司相比的潜在财务收益。从财务角度来看，两个选项都非常优人，但单干选项提供了更大的增长潜力——我的朋友不断提醒我，我可以成为亿万富翁。但我不在乎成为亿万富翁。另一方面，Area\
  \ 120 会给我提供稳定性，以及一个由我真正钦佩的人指导的机会。当我权衡这些选择时，我一直在查看我的心理气泡图，感受每个气泡中看到的颜色。毫无疑问，Area\
  \ 120 闪得最明亮。\n\n于是，我坐在我亮红色的沙发上，为我的新社交媒体 App 设计小草稿，而其他 Area 120 的创始人则像安静的蜜蜂一样忙碌着。在附近的一个会议桌旁，一款名为\
  \ Grasshopper 的手机 App 的创始人 Laura Holmes 正在与她的团队会合。Holmes 创建这款应用是为了通过游戏和测验来教好奇的初学者编程。像可汗学院（Khan\
  \ Academy）和（现在的）Mimo 这样的学习平台，这正是我们世界所需的东西。听到 Holmes 谈论“扩展数字生态系统”和“帮助代表性不足的群体进入技术领域”，我感到非常高兴。\n\
  \n她显然是一个出色的经理，在带领他们过长长的任务清单时，会停下来用建设性的反馈鼓励她的团队成员。听着他们生动的讨论，我感到了一丝熟悉的“格格不入”的感觉，这种感觉在我生命的大部分时间里都有——特别是在\
  \ Facebook 时，尽管我被自己的团队成员包围，仍然感到完全孤独。至少我还有我的测试角色，那些高中时期经常帮我开发 App 的虚拟孩子。在 Facebook\
  \ 时，我压力太大，以至于失去了召唤他们的动力，这可能就是为什么 Lifestage 的结果变得那么完全不符合直觉且错误的原因。但当我再次开始为了趣味编写自己的游戏时，它们开始回到我的脑海。现在，当我等待我虚拟的戏剧社社挑选她最喜欢的按钮时，我没有注意到有人正站在我面前。\n\
  \n“抱歉打扰一下，迈克尔……”是 Area 120 那位说话很轻的董事总经理 Jon，后面跟着几名工程师，他们都在看手机。“你有时间聊聊你的团队吗？” Jon\
  \ 问道。\n\n“我的团队？”我说，“非常乐意！”我知道他们预期的我会雇佣一个人。要构建出东西来，你需要支持。事情就是这样运作的。当我一直心满意足地独自工作时，我的经理一直希望我能像个经理一样行动，并组建我的梦想团队。但我有别的想法。\n\
  \n“你打算雇佣多少设计师和工程师？”\n\n*一个都没有！*我想道。但在 Area 120 从未有人做过那样。事实上，这与 Area 120 其他所有人的工作方式恰恰相反。但人越多，政治过程就越多，流程越多导致执行时间越慢，执行时间越慢导致产品发布越少，而产品发布越少意味着推出爆款的机会减少。我在\
  \ Facebook 的错误中中学到了这一点。\n\n我对 Jon 有了答案。我们一起走进走廊，其他人站在旁边，对比着日历上的空档——这是我最讨厌的活动。\n\n\
  我正打算说出来。“我不想雇佣任何人。我想独自开始。”\n\nJon 停下脚步，关掉手机，把它放进后口袋。我们站在一个微型厨房附近，Google 的咖啡师今天驻守在这里，为一排员工制作定制冲泡咖啡。闪亮的意大利咖啡机发出轰鸣声。“我知道这不寻常，”我盖过噪音喊道，“但在理想情况下，我认为在我们开发出有前景的原型之前，我更愿意独立完成。之后，我们可以聘请团队来扩展产品。”\n\
  \n日历的人和我看着 Jon，他们都张着嘴。Jon 眯起眼睛，仿佛在想象我单干完成预期目标。这根本不符合常理。\n\n\n\nMariana 认为问题出在我的\
  \ Tinder 个人简介上。我试图表现得幽默却失败得惨不忍睹，因为别人告诉我，你必须得了解我几个月才能理解我的幽默感。简介里没有提到任何关于我职业的内容。我希望别人是因为我本身而喜欢我，而不是因为我有一份好工作或因为我有钱。但\
  \ Mariana 告诉我，她只会匹配那些看起来稳定且成功、用她的话说是“生活质量高”的男生。她认为我的个人资料可能吓跑了那些想要一个除了玩乐之外、有抱心的伴侣的严肃男生。我听从了她的建议，更新了简介，说我在\
  \ `Google` 担任软件开发人员。但我拒绝写出我最喜欢的三件事是：迪士尼世界、坐邮轮和熊猫快餐（Panda Express）。\n\n***\n\n由于\
  \ `Area 120` 并不在意我在哪里工作，我经常去迈阿密看我妹妹（尽管不总是看父母），同时也为了关注美国普通青少年在手机上做什么。我最大的恐惧是，如果我永远离开\
  \ `Silicon Valley` 的圈子，我可能会无意中开发出只吸引千禧一代、甚至老天吸引 X X 世代的应用程序。虽然我妹妹的朋友们基本上和我同大——Mariana\
  \ 和我相差 14 个月——但他们都有弟妹妹或朋友，我喜欢和他们聊聊我的游戏，并听取他们那极其坦诚的反馈。此外，我在迈阿密笑得更开心。\n\n在其中一次访问期间，我感到很无聊，决定在\
  \ `Tinder` 上滑一滑。我不想在迈阿密约会，我只是想在旧金山建立一些新人脉，于是我把定位定在 `San Francisco` 并开始寻找。立刻，“William”就给了我超级赞（super-liked）。我刚向右滑，一条消息就弹了出来：\n\
  \n`William`: 嘿，你的简介非常令人印象深刻——除了关于熊猫快餐的部分。\n\n`Me`: 别担心，我最近刚把它从我的食谱里禁了，留在那儿只是为了怀旧。\n\
  \n`William`: 你在哪儿？\n\n`Me`: 我住在 `California`，但我现在在迈阿密看我妹妹。也许我回来后我们可以见个面？\n\n这个男生真的很帅，简介里听起来也很聪明（一个研究生），而且他没有穿内衣的照片——这是一个好迹象，说明他不是那种完完就走的类型。恰恰相反：他有在花园里的照片，还和他的妹妹们在一起！William\
  \ 看起来很阳光，是那种你可以在父母准备好绪时带去介绍给他们认识的人。我正变得兴奋起来，直到：\n\n `William`: 噢不，我不住在 `CA`！我只是来这儿陪我小妹妹参加学校的工程竞赛。\n\
  \n我们都离开了了家来看小妹妹。现在我更喜欢他了——而且他竟然还不是一个可能？\n\n`Me`: 你住在哪里？\n\n `William`: 佛罗里达州。这太好笑了。\n\
  \n这确实很好笑。但我有点难过。我终于匹配到了这个超棒的男生，现在我快飞回 `California` 了，而他要飞回 `Florida`，我们没机会见面了。但至少我们可以聊天。在接下来的几天里，我们\
  \ `FaceTimed` 聊到停。我发现 William 也不是那种第一次约会就睡觉的男生。他正在学习生物学，非常迷植物。我可以欣赏美丽的玫瑰花丛，但我从未理解园艺的魅力，而且我继承了妈妈对假植物的热爱。我公寓里到处都是。我喜欢它们，因为无论它们变得多干燥多灰尘，它们永远不会死。尽管如此，我喜欢听\
  \ William 谈论植物，他经常这样做。他谈论浇水、把它们放在温室、改变光照、给它们特殊的营养……William 对植物的热爱程度就像我对我的游戏一样。我从未约过一个对自己做的事情如此热心的男生。\n\
  \n我受不了了。我必须试一把。“你飞往哪个机场？”我问。\n\n***\n\n下周我飞回了 `Florida`，这次降落在 `Orlando airport`，William\
  \ 在那里把车停在长期停车场，并从那里飞走，因为这比从他当地机场出发便宜。我提醒自己，他是一个在实验室工作的的研究生，所以他开车两个小时去一个便宜的机场完全合逻辑。我们计划在那里见面，然后我带他去\
  \ `Disney World` 的 `Epcot` 第一次约会。他以前从未去过 `Epcot`，现在是完美的时机，因为那里正值盛大的春季花节，而我通常会特意避开那个活动。我太喜欢这个男生了，以至于等不及去看植物展了。我从未对任何人如此兴奋过。\n\
  \nWilliam 在接机处开着一辆银色的 `2008 Ford Focus` 等着我。当我靠近时，一位机场安保人员正透过他打开的车窗对他大吼，因为我迟到了，她想清理他霸占了十五分钟的路边停车位。那个女人直接走到他的窗前，挥舞着手，声音越来越大，而\
  \ William，我带着一丝兴奋注意到，他保持着冷静的淡定。“再一分钟就好，抱歉，”他一直说着。我跑了过去。“我在这儿！”我喊道，背着我的 `Facebook`\
  \ 品牌背包跳进了副驾驶。\n\n“嗨！”我笑着，满脸的金属器械对着他笑。在短短两周后，我就要摘掉牙套了，这已经持续了十多年。感觉我的自信也即将解脱。但现在还没。\n\
  \n“嗨！”William 笑着回应。他那双明蓝色的眼睛让我的心扑通一下——\n\n\n\n当威廉认出公园里的每一株百梨科和盆栽后，我带他去了我最喜欢的项目之一——“翱翔全球”（Soarin'\
  \ Around the World）。那是一个模拟飞行器，你像滑翔伞一样穿过瑞士阿尔卑斯山，俯冲悉尼港，并在基力马拉雅山的大象群中穿梭。我这辈子坐过上百次“翱翔”了，我从未想过它或任何其他项目是浪漫的。但与威廉一起飞翔在世界上方是我一生做过最浪漫的事。在结束时，模拟烟花表演结束后，有一瞬间漆黑一片，突然我们就接吻了。接着同样突然，灯亮了，一个穿着\
  \ Epcot 背心的青少年正敲着我们那辆小汽车的侧面。“好了，大家，往前走！”当我们脸通红、手忙脚乱地扣安全带时，他说道。\n\n为了缓解那种尴尬，我们冲向世界世览区的“意大利”馆喝了一些柠檬酒，然后去“日本”馆喝了点清酒，接着去“法国”馆喝了一杯波尔多酒。我头晕脑胀又被太阳晒得厉害，想起以前和家人一起来迪士尼时，我们会找一片草地，躺在妈妈带来的毯子上睡午觉，直到排队的人变少。有时需要一小时左右，但我们从不匆忙。现在，我抓住威廉的袖子，拉着他来到一小块绿丘，仰面躺下。“我们睡个午觉吧，”我说，闭上了眼睛。\n\
  \n“噢，好的。”威廉听起来很困惑。但我没时间解释了，我已经睡死过去了。\n\n当我猛地醒来时，太阳已经落落在修剪成普鲁造型后面，将我们笼在阴影中，威廉坐在我身边，看着一个父亲在草地上追着他的孩子跑。\n\
  \n“噢，该死！我睡着了吗？”我坐起来，环顾四周。\n\n“是的，是的，”威廉看起来很有趣。\n\n“噢不。我打呼噜了吗？”我用手捂住脸。\n\n“打了。看，我拍了你的照片。”他拿出手机给我看我见过最丑的一张照片。我的头歪向一侧，嘴巴大张着，手臂以疯狂的角度张开着。我的鼻子因为日晒和酒精变得通红。我看起来就像刚从滑翔伞上掉下来摔死一样。\n\
  \n“噢天天，太糟糕了！”我把头埋回手里，想找个地缝进去。“对不起！我太害脸了。我毁了我们的约会！”\n\n“哈哈，什么？你没有！”威廉说道。他揉着我的背，画着小小的安慰圆圈。“我不是故意让你尴尬的。我拍那张是因为我觉得你看起来很……可爱。”\n\
  \n我慢慢抬起头。他是在逗我吗？他一定是。但从他严肃的表情来看，也许不是。他站起来，伸出手。\n\n# 第 30 章\n\n# 盲目潜入\n\n在 Epcot\
  \ 之后，威廉开车送我回他那温馨的小公寓，他是两年前从东北部搬到这里读研究的。我冒了小险，预订了约会第二天返回旧金山的机票。如果那天进展得极其糟糕，我可以住在机场酒店。但尽管我在草地上发了昏睡症发作，情况却完全不糟。所以我在威廉那里住了一晚。并没有什么亲密的事。既然我们已经讨论过双方都不想在性方面进展太快，那种压力消失了，我们只是躺在床上聊天、看\
  \ Netflix，然后早早睡了。第二天当我穿好衣服离开时，威廉说：“你知道的，我有几个空抽屉，如果你想留些东西在那的话。”整个回程的飞行途中，我无法停止想这件事。我无法停止想他那双蓝色的眼睛。所以当他打电话我说：“你应该回来多呆一会，然后我们再商量以后怎么办，”我在想，“如果他想让我陪在他身边，为什么不来呢？”\n\
  \n三周后，我的新室友马修正在帮我打包。艾米已经搬到了市里。当我把客厅的东西——两个我舍不得丢的表情包枕头、一个快乐的光光节装饰灯串、几件旧的伯尼竞选 T 恤，还有那棵直到四月还挂着的折叠假圣诞树——扔进最近的一个空纸箱时，马修接手处理了厨房。他穿着一件多伦多马尔波罗连帽衫，盘腿坐在大理石台面上，窥视着一个几乎空荡荡的柜。\n\
  \n“你的盘子在哪？”\n\n“没有，”我说。我从来没抽空买餐具；如果我在家，直接从外卖盒里吃就行。\n\n“不是吧，”马修说。他从椅子上爬下来，带着箱子进了客厅。“我觉得全了。我要用胶带封上吗？”\n\
  \n我看向箱子。里面有两包未拆封的擦巾和一台搅拌机。还有空间放下我的 `Nintendo Switch`。“不用，就把它放在那儿吧，”我说。“谢了，哥们。你确定不介意留着沙发吗？”\n\
  \n我们的沙发是一个黑色的宜家模块化沙发，中间有一道大裂口，露出了白色的填充物。我们在那里玩过很多次《超级马里奥奥德赛》，除此之外，我在家里大部分时间都在房间里，躺在床上写代码。马修说他会留下沙发。“如果我的新室友想换，我会让他们换的，”他说。由于我走得如此突然，我们还没找到接替的人，但我向他保证，在那之前我会支付租金。在硅谷，像我住过的这种高级公寓需求非常大，所以我并不太担心。\n\
  \n我正经历着那种闭着眼跳入泳池的人生时刻，但我觉得自己的胜算很大。也许这甚至并不那么疯狂——我只是把东西搬到我朋友雷德在圣马特奥的公寓里的一个房间里，同时在佛罗里达和威廉在一起试水。目前，我每隔几周就会飞往在加州和佛罗里达之间往返飞行一次。反正，我也很少进\
  \ `Area 120` 的办公室——我在床上工作效率更高——所以从他们的角度来看，其实什么都不会真正改变。\n\n在遇到威廉之前，我就考虑过搬回佛罗里达。事实是，我怀念周围有其他拉丁裔的感觉——那些西班牙语、拉丁式笑话和那种喧闹劲。但我也怀念佛罗里达的主题公园和那里多样化的生活、职业路径、观点。我甚至怀念与特朗普支持者交流的对比感，因为我迈密的朋友有一半都是这样。在硅谷的大多数圈子里，投过特朗普的人简直是不受欢迎的。所以大家只是口口同声地谈论自己有多开心或难过。我认识的几乎每个人都在\
  \ `Facebook`、`Google`、`Apple`、`Yahoo!` 或 `Microsoft` 从编程、广告或市场营销工作。\n\n如果我有经济自由可以在佛罗里达兼职生活，为什么不呢？如果和威廉的事没成，我不会流落街头，我只会留在加州。这只有好处没有坏处。\n\
  \n* * *\n\n—\n\n现在我站在联邦快递外，旁边堆着四个箱子，里面装着我大部分没有捐给慈善善会的暖和衣物。我刚刚意识到我没有威廉的地址，于是掏出手机拍了拍那叠箱子的照片，并附在消息里。\n\
  \n我：我要把这些寄到哪里？\n\n威廉：？\n\n我：你的地址是什么？\n\n威廉：……\n\n威廉：……\n威廉：……\n\n真奇怪。他得查查自己的邮政编码之类的吗？\n\
  \n我绕着箱子走了几圈。我跟 `Area 120` 的总经理乔约了开会。我请求向他汇报我正在做的最新社交媒体游戏项目的进展，但更多的是我想确保在离开去佛罗里达之前，他还能记得我的样子。我想对他来说，我是一个真实的人。\n\
  \n现在打字点甚至都不在那了。该死！我拨通了威廉的电话。\n\n\n\n就在电话要转入语音信箱时，一条短信弹了出来，他的地址。没有“等不及要见你”，没有给我的照片点赞。没关系。他可能在上课或其他忙。我寄出了箱子，然后跳上\
  \ Google 的班车去公司露个脸，努力不去想威廉没有点赞那张箱子的照片这件事。我应该应该给他打个电话确认一切都好吗？我不想让自己听起来很卑微。我的策略是保持轻松自然——就好像我只是来这里进行一次不限期的访问一样，从技术上来说，我确实是这样。他不需要知道我已经搬出了公寓。现在就进行关于“人生大事”的话题似乎太早了。我并不是在担心他是怎么想我的。这整件事都是他的主意，不是吗？所以他那边没什么好担心的。我只是不想让他感到任何不必要的压力。毕竟，我们面对面在一起的时间只有三天。\n\
  \n# 第 31 章\n\n## 成人生活\n\n感谢天谢地，我只是在胡闹。从来没有什么事好担心的。几周后，我和威廉的关系非常甜蜜。住在一起太有趣了。我喜欢他不像我那样无无地乐观；我喜欢和他一起开车去奥兰多，在迪士尼世界和环球影城走走，手里拿着饮料，玩完完没了的游乐项目；我喜欢我们对衣服的审美相同。即使我抽屉里有一叠干净的\
  \ T 恤，我也会去拿他的一件，因为那是他的。写这些让我觉得很肉麻，但我简直迷了威廉。\n\n我在佛罗里达州待了两个周，我们的关系仍然保持得相当轻松，还没有进入“以后怎么办”的话题。我们还没有发生过任何一次严肃的争吵。这主要是因为威廉只能看到事物的好的面。如果我们是一个杯子，威廉看到的应该是满的一半。无论我对一行重写了五十遍的笨拙代码感到多么悲观，还是对我无能为力的气候变化恐怖现状感到焦虑，或者对我自己感到如何，威廉总能为我提供一个更明亮的视角。他似乎唯一无法积极对待的，就是和我妈妈之间的关系。我和妈妈每周至少聊一次，但即使在纽约一起度过了那么有趣的时光，我们的对话仍然经常演变成大吵。与此同时，威廉和他妈妈并不觉得需要像我们这样干涉彼此的生活。当他们聊天时，是友好且切中要点的。\n\
  \n***\n\n我暗自希望威廉的朋友们能展现出他狂野的一面。我曾想象他们不像我在硅谷的朋友们，而更像我在迈阿密的那群人，他们总是大大大、开玩笑并不断打断话。我简直渴望再次被反驳，甚至偶尔被某个观点震惊一下。无论我遇到什么问题，无论我在处理什么创意挑战，最好的办法总是和姐姐和她的朋友待在一起——那些与我一起长大的人，无论我压力有多大，他们都能让我笑出来。\n\
  \nAngela 和 `Liam`，这对坐在坐满大学生的墨西哥餐厅里、坐在我和威廉对面的夫妇，并没有在这方面满足我的预期。我刚见到他们五分钟，但很快发现我们毫无共同语言——以一种非常不趣的方式。\n\
  \n“Cardi B 今天发了新歌，”我说，心想自己刚刚使出了终极的破冰技巧。“你们听了吗？”\n\n他们三个人，威廉、`Angela` 和 `Liam`，隔着手中\
  \ 4 美元的玛格丽，茫然地看着我。噢，对，我想起来，我们不在迈阿密。Cardi B 在这里并不是神。“所以，你们听什么类型的音乐？”我问。\n\n“我怎么怎么听音乐，”`Liam`\
  \ 说，重新折好他的纸巾。“我更喜欢听播客。”\n\n“我想我喜欢乡村音乐吧？”`Angela` 说。\n\n威廉同样不认同我对说哈的欣赏，他给了我一个抱歉的耸肩。\n\
  \n“所以你是个软件工程师？”`Liam` 问。\n\n“对，算是吧！”我说。“我做游戏。”\n\n“像《使命召唤》那类游戏吗？”`Angela` 歪着头问。\n\
  \n“噢，不是，我为 `iOS` 开发 App。就是 `iPhone`，”我说，脉跳加速了一点。我一直试图克制在威廉面前谈论技术，他对我对 Google 文化的故事感兴趣，但每当我试图解释我在工作中*实际*在做些什么时，他的眼神就会变得空远。“现在，我有一个关于修复社交媒体的巨大想法。我想建立一个没有\
  \ AI 内容分发算法的社交网络。AI 将*仅*用于帮助你决定想把帖子发给谁。”我喝了一口水，正准备告诉他们最棒的部分——我的网络是去中心化的；没有人拥有它。\n\
  \n但我突然意识到 `Liam` 和 `Angela` 看我时的眼神不是感兴趣，而更像是困惑——或者只是纯粹的无聊？对他们来说，我描述我发明的一种新牙膏配方也没区别。实际上，由于他们科学思维，他们可能对那个*更*感兴趣。在几秒尴尬的沉默后，`Angela`\
  \ 说：“很酷，”然后他们三个人就开始了一场关于杀除草除草剂的激烈辩论。我向服务生示意再来一轮玛格丽，并用“我请客！”预先拒绝了组员可能提出的反对意见。\n\n\
  \n\n\n我们停在威廉那间漂亮的公寓前，前院里有一片由花朵和微型棕榈树构成的小绿洲。威廉熄了火打开车门，但我没有动。我并不是在耍帅；在某些事情——无论什么事——再次变得合理之前，我\
  \ `couldn’t` 动弹。我开始想起小时候，我和妈妈在因金钱争吵后，我们会一起坐在车里，谁也无法从那种沮丧、满含泪水的沉默中挣脱出来。我觉得自己并不比那个十四岁的自己少一份迷茫、困惑和失望。\n\
  \n“迈克尔，求你了，求求你，说点什么。”威廉看起来非常担心。尽管我很生气，但我欠他一个尝试去解释的理由。\n\n“你把我描述得像个跟踪狂一样，”我说，“听起来好像我只是搬着箱子就出现了。是你说我应该来来的。你说：‘过来吧，剩下的我们以后再说。’”\n\
  \n威廉用手理了头发，叹了口气。“我的意思是来做客，”他说，“然后你发了那张你要寄出的所有东西的照片，我意识到我之前的……表达得不明。”\n\n“我猜现在全说清楚了，”我苦涩地说。\n\
  \n“但后来我又想了这件事，”威廉继续道，“我意识到，最坏的情况会怎样？你有行动能力，如果不行通，你可以离开的。”\n\n一只巨大的蛾子卡在门廊的灯上，疯狂地在玻璃上拍打着阴影般的翅膀。它进来了，却出不去。我告诉自己，那不是我。威廉是对的。我可以随时离开。尽管如此，我仍然觉得自己像那只蛾子：感到幽闭。如果回到餐厅，我宁愿交出我的\
  \ `iPhone`，只要打个响指就能回到梅洛公园，沉浸在电子游戏中麻痹自己，直到刚刚获知的消息带来的痛苦不再那么剧——至少我拥有一个永远无视威廉的 `option`。但我所有最喜欢的衣服都在他的最后两个抽屉里，而我把\
  \ `laptop` 开着留在了他的厨房桌子上。所以我在这儿——依然在这儿。\n\n“快进来吧，”威廉说。他已经下了车，正像个绅士般的舞会舞伴一样为我开着门。\n\
  \n也许暂时陷入这种状态也没关系。也许我的“被困住”是给予我们唯一的机会。在我的游戏中，我意识到如果我给人们做任何想做事的自由，没有任何规则，他们会感到无聊。他们会离开。但如果我给他们限制，他们似乎能在限制中找到乐趣。我设置的挑战越多，游戏就变得越好。\n\
  \n# 第 32 章：“我是同性恋”\n\n## 谷歌成功的西西班牙裔工程师迈克尔·萨尔曼讲述了他的真实：“我是同性恋”\n\n#### 作者：Lena Hansen，2018\
  \ 年 8 月 24 日\n\n拥有秘鲁和玻利维亚血统的成功 `Google` 工程师迈克尔·萨尔曼今天满 22 岁了。为了庆祝这个特殊的日子，萨尔曼联系了 `People\
  \ en Español` 向世界宣布了他的真实：这个通过创建应用软件成为百万富翁、并在 `Facebook` 工作过的年轻人是同性恋——而且他不想隐藏。\n\n\
  “我真的相信这能够帮助其他处境境相似的拉丁裔人士，”年轻人透露道，“我担心，尽管我取得了成就——17 岁就成为 `Facebook` 签约的最年轻工程师，21\
  \ 岁就成为 `Google` 最年轻的产品经理——但我脑海中仍有一个声音告诉我：‘如果你是同性恋，将不会再有人认真对待你。’我觉得是时候向别人证明，这没关系，你可以在不害怕真实身份的情况下获得成功。”\n\
  \n尽管他从青少年时期起就开始支持家庭——在父母失去工作和家园时帮助他们度过经济危机——但萨尔曼承认，他担心心爱的人会对他的性取向有何反应。\n\n这个他因为害怕被拒绝而隐藏了多年的秘密，是他不再想保持沉默的。“我是同性恋，考虑到我的西班牙裔背景，我决定躲在柜子里[多年来]，因为我总是害怕分享自己的这一点，特别是因为拉丁美洲成千上万的年轻人给我留言，说我是他们的榜样。”\n\
  \n在今天生日，萨尔曼将不再接受礼物，而是要求他的朋友家人向非营利组织 `the Trevor Project` 捐款，该机构帮助 LGBT 社区中处于危机和有自杀风险的人。\n\
  \n我今年的表现超出了自我。说服 `People en Español` 在我真实的二十二岁生日当天发表我的出柜文章，绝对是我迄今为止最棒的生日里程碑。这比在十四岁生日前登上\
  \ `CNN International` 要好；比在十六岁生日前前往南美洲，在各大学面对成千上万的人演讲要好；比在十七岁生日后立即获得 `Facebook`\
  \ 的实习录取通知，或在十八岁生日后一天被 `Facebook` 聘用要好；绝对比在二十岁生日前一天发布 `Lifestage` 要好；甚至比在二十一岁时在福丰堡酒店签署\
  \ `Google` 合同要好。它比那些里程碑都要好，因为这是我做过最诚实的事。\n\n我的出柜经历了几个月的策略和规划。这不仅仅关乎发布和分享文章；它关乎对整个操作进行细节管理，以最大限度地减少潜在的影响。每一块多骨牌都必须完美对齐，顺序如下：\n\
  \n*   **生日前两个月**：和威廉、Angela 和 Liam 预订生日游轮，他们是我社交圈中最喜欢的；我很爱他们。\n*   **一个月前**：联系 `People\
  \ en Español`，探测他们对报道我出柜的兴趣。\n*   **三周前**：让威廉给我拍一百张照片。\n*   **两周前**：与《人民》杂志作家 Lena\
  \ Hansen 进行采访。向 Lena 提供修过的照片。\n*   **一周前**：陷入阴暗的情绪中，担心拉丁美洲所有认识我的人——特别是我的那三万 Facebook\
  \ 粉丝——会对我感到失望。\n*   **生日当天**：将状态改为“恋爱中”。\n*   **等待结果。**\n\n\n\n\n\n“我的天呐，”我说，“如果我早早知道他们会接受得这么好，我早在高中就出柜了。”\n\
  \n大家对我出柜的反应一律是接纳和友善的。加州的人如果他们懒得反应的话，都会竖起大拇指。对他们来说，这没什么特别。但在秘鲁，我几乎所有的舅舅都给我发了支持的私信，或者在我的帖子下留下了友好的评论。我妈妈四个兄弟中最年轻的，我的\
  \ `tío` 米格尔，用西英语混合的语言写道：“Michael, feliz cumpleaños! 我让你知道，我佩服你的力量，祝贺你巨大的勇气。”来自迈阿密的朋友们，那里有很多心形、X\
  \ 符号和快乐的表情，还有几条信息说：“我有点猜到了，但不太确定，现在知道了太好了！”我姐姐的小学同学安娜，她以前总是开大玩笑说暗恋我，写道：“那太棒了，我为你感到高兴，但你知道我还是会嫁给你，对吧？”\n\
  \n无论他们是否有人在私下里想：*噢天，那太糟糕了*，我并不在乎。我关乎的是不需要隐藏真实的自我，并向其他拉丁美洲年轻人证明，他们也不需要。自 21 世纪 00\
  \ 年代中期以来时代已经了。我在想，如果我读高中时的文化主要是开放和接纳的，像现在这样——即不再自动假设每个人都是异性恋，你可以自己出去弄清楚自己是谁——我是否会更早地理解自己。我在高中绝对会玩得更开心。也许我今天会更喜欢自己一点点。\n\
  \n这就是邮轮的意义——弥补生活中所有不快乐的时光。能带威廉去第一次邮轮，我感到非常兴奋。我们住在皇家邮轮的一艘巨型轮只上，那里更像是一座城市。它有多个楼层；几十家餐厅、酒吧和夜店；各种游泳池；一个滑冰场；一个高尔夫场；一条带有旋转木马和其他设施的滨板道；一个购物中心；以及它自己的“中央公园”花园。它大到你完全感觉不到它在移动。基本上，这就像住进拉斯维加斯的酒店里——直到你站在边缘向外望去，放眼之处只有数英里的清澈蓝海。\n\
  \n***\n\n—\n\n现在我已正式向世界上所有认识我的人“出柜”了，我原以为在邮轮上对威廉公开表达亲昵会让我感觉更自然。然而，在前两天，我感到一种异常的紧张，特别是在拉丁裔人面前，因为那整套大男子主义（machismo）的问题。\n\
  \n“我觉得我们是这艘船上唯一的同性恋，”在我们第二个晚上，当我们跟着利亚姆和安吉拉进入一家拉丁主题夜店时，我告诉威廉。\n\n“别胡闹了，”他说，“这艘船上有五千号人。从统计学上来说，至少还有几百人。”\n\
  \n现场乐队在舞台上，一个发光的马赛克舞池前表演，几对伴侣正尝试跳萨萨舞。\n\n“你得向我们展示你的动作了，迈克尔，”利亚姆说。为了这个场合，他脱掉了标准的\
  \ T 恤和运动短裤制服，换上了一件黑色纽扣衫和黑色牛仔裤。我真希望自己也穿全黑，而不是这件白衬衫和浅色牛仔裤，让我在昏暗的房间里像萤火虫一样发光。\n\n“首先，”我说，“我需要喝到视线清这里为止。”我伸出手，示意我的视觉必须模糊到什么种程度我才能开始跳舞。\n\
  \n半小时后，喝了三杯长岛冰茶（Long Island iced teas）之后，我们四个人在发光的地板上围成一个圈，我尝试展示我的萨萨舞技巧。我从未真正学过跳萨萨舞，但似乎没人注意到。我们聚在一起玩得很开心，每个人都在笑着并试着比对方的动作更精彩，所以我不知道威廉为什么那么想把我拉开并单独和我跳舞。我尽力避免与他眼神交流，继续朝着人群跳舞。我需要保持这个圆圈的完整！现在威廉在做某种野舞（dirty-dancing）动作，我开始感觉到有眼睛盯着我们身上。他难道不明白我只是想像俱乐部里的其他人一样吗？他难道不记得我二十二岁而他二十五岁，而且尽管我内心多么*想要*变成那样，却依然在痛苦地察觉着别人的想法吗？\n\
  \n“你为什么不跟我跳？”他在嘈杂的音乐声中我耳边喊道。\n\n现在我感到如此局促，完全无法跳舞。“不，不，”我回喊道，“我们大家一起一起跳吧！”\n\n“行！”威廉说。大约半小时后，我们决定离开。他抓住我的手，开始拉着我穿过人群走向出口。我顺从地跟着他，不敢抽回手，即使有一群拉丁裔伴侣转头看我们走过。\n\
  \n当我们呈“之”字形穿过鸡尾酒廊时，一只手从空处伸出来，拍了拍威廉的肩膀。是一个三十多岁的男人，留着像男模那样的胡渣，穿着一套昂贵的西装，胸前口袋里露出一块金色的口袋巾。\n\
  \n“我想邀请你参加我的派对，”他陈述道。\n\n威廉和我我互相看着。我在想，这就是当同性恋在公共场合牵手会发生的情况。他们吸引了可能带有杀意之陌生人的随机邀请。\n\
  \n“这是一场订婚宴，”那男人说，“皇家套房，明天晚上十点。”\n\n在我们回答之前，那个家伙已经消失了，利亚姆和安吉拉出现在了他的位置。\n\n“那个人*到底*是谁啊？”安吉拉踮起脚尖，环顾四周问道。\n\
  \n“那太棒了！”威廉说，“他邀请了我们参加他的订婚宴。”\n\n“你觉得那是个同性恋的订婚宴吗？”我说。\n\n“当然是！”威廉说。\n\n“你们去吗？”利亚姆问。\n\
  \n威廉和我互相看着。他那样空空出现真的很奇怪，那样有自信地拍着威廉的肩膀，仿佛在说：*我选择了你*。如果“订婚宴”真的是“同性恋派对”的代号呢？我脑海中闪过威廉和我戴着皮带链在床上的画面。\n\
  \n“我觉得我们应该去，”威廉说，“我们会玩得很开心的！”\n\n***\n\n—\n\n第二天晚上，因为在港口游了洞穴、逛了市场并尝了舌酒而精疲力竭，威廉和我站在那个口袋巾男人的阳台上，正如威廉所指出的，阳台环绕着船头。透过落地窗墙，室内有大约二十位客人，大多是异性情侣和几个家庭，正和我们的主人——口袋巾男人和他那个更矮一点、更有肌肉的未婚夫聊天说笑。一位年轻女性在三角钢琴上弹着士乐，穿白制服的服务员端着银盘盛着虾。我为自己之前担心那是性爱派对的焦虑感到很愚蠢。我真的需要摆脱身上携带的某些猥俗刻板印象。我需要变得像威廉一样，他自己只是几个月前才出柜，但似乎已经是一个完全成熟且充满力量的同性恋男性。并不是说他没有不安全感的时刻，但在性取问题上，发现任何人能如此坦然地面对自己简直是个奇迹。\n\
  \n\n\n\n\n这真是一间不可思议的套房——虽然比不上枫丹堡的 Le Sable 总统套房，但考虑到它是在邮轮上，已经很不错了。嘿，我父母的二十五周年纪念快到了。如果送他们这个礼物，该有多酷啊？我有钱。每当我看到我的\
  \ `Charles Schwab` 报告时，我都不知道该高兴得跳起来，还是应该愧地低下头。每个人都说美国是机会之岸，只要你足够努力、足够持久，就能获得足够的金和特权，从而坐下来享受生活。但对我父母来说，那种奖励永远不会到来。即使他们是储蓄型的人，扣完税后现在也没什么钱可以存了。他们永远无法跨越我在职业生涯初期就跨越的那道门槛——在那里赚的钱越多，获得的税收减免就越多，我的钱不费手指就能在股市里增长。鉴于我父母对美国梦的体验与我自己的这种不平等，给他们买好东西，让他们也感受到其中的一部分，难道不是合理的吗？\n\
  \n等一下，我需要克制一下。事情已经不再是那样发展的了。如果把这四万美元或者这个地方的任何费用存入银行，供他们晚年生活（我肯定会负责），那才是帮他们大忙。而且我也需要开始为自己的未来储蓄了。威廉和我有一天会订婚吗？我可以很容易地陷入幻想，想象接下来的四十年里与他一起环游世界。我可以在任何地方开发我的\
  \ App，所以为什么不能呢？\n\n但话又回来，我同样可以想象自己逃离他。事实证明，爱一个人是容易的，信任才是困难的部分。我知道我过度敏感了，但我花了整整三个月才从“威廉没有意识到我计划搬进来”这一发现中缓过神。具体来说，我担心我喜欢威廉超过了切喜欢我的程度——这种恐惧持续了好几个月。信任对我来说太重要了，我我在笔记本电脑上做了一张图，记录随时间变化的对威廉的信任程度。`x-axis`\
  \ 上方约 20% 的地方有一条微弱的水平线，那是我维持这段关系的基准。如果图表至少有 90% 的时间保持在那条线以上，这段关系就是不可持续的。我在关于搬家争吵的那处标记了一个下凹，在我们在一起的半年里还有两个下凹，包括在我们出发去邮轮之前。起初我没打算告诉他这张图表。以我那偏执的方式，我想如果他知道了，他可能会开始尝试扭曲结果。然后我决定，去他的妈，在做完图的第二天就展示给他看。我们还为他新男朋友有多怪大了一场。\n\
  \n“迈克尔！这边！”\n\n我从思绪旋涡中挣脱，看到威廉在船阳台的尖端向我挥手。我小心翼翼向他走过去，担心离护栏太近。我们现在已经远航大海，船速快了很多，尽管你感觉不到水流的起伏，只能感觉到风。水面如此平滑，感觉像违反了物理定律。看着下方深色且翻滚的波浪，我突然幻想到自己掉入海中，消失在黑色的水中。我死死地贴在背后的墙上，尽可能远离护栏。绝不。我不会靠近那个边缘的。\n\
  \n“迈克尔，过来！你为什么离得那么远？”威廉越过肩膀好奇地看着我。\n\n他走过来，伸出手臂让我抓住他的手。“过来。你一定会喜欢你所看到的。”\n\n我缓慢地走向护栏边，强迫自己向下看。在惊恐地盯着海洋几分钟后，我抬头对威廉露出一个*我准备好回屋里了*的微笑。\n\
  \n“你在害怕什么？”他问。\n\n觉得自己很傻，我告诉他我掉入海中的幻象，补充道：“那里什么网也没有。等你来得救时，我已经死了。”\n\n“别胡闹了。”威廉指向挂在阳台墙上、应急报警器旁边的橙色救生圈。“我会抓住它，拉响警报，立即找到一名船员。”\n\
  \n当然威廉会这么建议的。我有足够的头脑做出本能反应吗？还是我会呆在原地不动，或者更糟，直接晕过去？我讨厌自己不知道。在我们两人中，我确实没那么勇敢，能力也不够。我不配拥有他。\n\
  \n# 第 33 章\n\n## Area 120\n\n2018 年秋季，我每隔一个月就会飞一次加州去 `Area 120` 工作。威廉和我仍然是“非正式”地住在一起，但情况进展得非常好，我正考虑考虑永久搬到佛罗里达州。每当我在佛罗里达时，我很开心，但我并不喜欢我新生活的后勤。每个月有二十四个小时悬在飞行的金属管子里，这并不是我理想中的乐子，而且似乎无论我在何处，我都错过了另一端的朋友。\n\
  \n但谈到工作，我很喜欢 `Area 120`。我不介意它独立于 `Google` 及其所有的福利。从 `Facebook` 搬到主园区在很多方面都是无缝衔接的，但我经常忘记自己搬过家。但\
  \ `Area 120` 更低调。在校园的这部分，没有餐厅或健身房。你必须自己开车上班，或者从主园区乘坐较小的 `Google` 班车。我想这也许都是故意的——他们建立\
  \ `Area 120` 是希望我们在 `Google` 之外更具创造力。这可能有一点帮助。但无法回避的事实是，生活和工作在硅谷这个更大的泡泡里，那是可能存在的最大的观点和想法回声室。我察觉到这就是为什么我的经理如此乐意让我花加州以外花大量时间。而且为什么即使我在本地工作时，他似乎对我很少来办公室也毫无异议。与我在佛罗里达的“全神贯注”时间不同——那里我的日历安排很空，我在卧室工作一整天——在测试、构建、测试、构建的无限循环中——我在\
  \ `Area 120` 花过的大部分时间都在从一个会议奔向另一个会议。到那时，我所有的同事都知道我是谁，以及我在 `Instagram Stories` 和\
  \ `Facebook` 取得了什么成就。一整天，人们都会过来问我：“迈克尔，我们接下来要开发什么？”由于我不再需要编写代码，我能够投入更多精力在关键决策上，例如是否增加我们正在开发的\
  \ App 的预算，或者如何促进我们投资的公司的增长。只要我能达成目标，没人会在意我在电脑前坐上一整星期。\n\n\n\n\n\n与此同时，我仍在不断地开发自己的应用。这是我真正的热情。\n\
  \n那年的 10 月，我正潜心开发一款名为 `BFF` 的游戏，它的核心是朋友之间互相提问，然后尝试猜谁在撒谎。这是我对 `Lies` 的一个更友好的改进——`Lies`\
  \ 是我六个月前独立发布的应用，但当我意识到人们对那种尖刻的氛围并不感共鸣时，我立刻放弃了它。（那句“让友谊终结的游戏”的口号显然是个错误。）尽管失败了，我仍然喜欢\
  \ `Lies` 的概念，现在正提取它最优秀的功能，并结合我在开发它过程中获得的所有智慧，试图将整个项目转变为某种具有积极意义的东西。\n\n几个月来，我一直在完善\
  \ `BFF`。我把它装在手机里，每当处于社交场合，就会利用机会向大家展示，并留意人们的反应和反馈。我正计划在一个月后发布。\n\n与此同时，数字领域的变化非常快，自从我开始编程以来，那里已经发生了巨大的变化，以至于我开始怀疑\
  \ `BFF` 在这个世界上是否还有它的席之地。应用市场已经变得没那么竞争激烈了。人们不再像以前那样下载无数的应用了。因此，我一直在考虑是否要无限期推迟 `BFF`。\n\
  \n秋天的一个下午，在 `Google` 园区开了一整天的会议后，我决定在我的老住区红木城（Redwood City）犒劳自己吃顿晚餐并看电影。在法院广场电影院对面，一场亡灵节庆祝活动进行得热如荼。我走进节日的核心区域，穿过餐车和滋滋作的猪肉玉米饼味，穿过戴着彩色骷面具在人群中穿梭的孩子，以及数百个人们为了纪念去世亲而制作的精美祭坛。尽管这是纪念逝者，但空气中并没有悲伤，只有许多开朗快乐的笑容。\n\
  \n我继续往前走，路过一个白发老人，他正跪在地上用霓虹粉笔对人行道的壁画进行最后的润色。画得很好：一个年轻女性微笑的脸，被红玫瑰和 1957–2012 的日期所围着。她是谁？我心想。在迈阿密，我会停下来和那个男人聊天，但在这里我不擅于接近他；我没有那种勇气。这个节日里的大多数人是拉丁裔，早在像我这样的人涌入之前很久就住在红木城了——而我们富裕的工程师将硅谷的生活成本推向了顶峰，并迫使这里的大多数居民离开。\n\
  \n事实是无法回避的：无论我学会多少西班牙语，无论我在秘鲁待过过多久，无论我在迈阿密面对过多少种困境，我都是不同的。带着我时尚的 `iPhone` 和 `AirPods`，我是一个特权局外人。是的，我是拉丁裔。但多亏于我浅色的皮肤以及从小获得的机会——最重要的是，在八九岁时学习英语并培养美国口音的机会——我仍然是问题的一部分。\n\
  \n这种认知刻在我的皮肤下，不断折扰着我。我想在科技领域产生影响，但更重要的是，我想为我的社区带来改变。\n\n### 与 Jon 的对话\n\n第二天，我找到了我的经理\
  \ Jon，请求他抽点时间。我们躲进一间会议室，对面是一面巨大的、不断演变的乐高积木墙。“在 `Facebook`，我曾在会议和学校活动上对拉丁裔社区做过很多演讲，”我说，“帮助他们了解科技以及如何在硅谷找工作。我想继续做这件事。”\n\
  \nJon 点了点头。“这听起来很合理。”\n\n我感到很惊讶。总的来说，科技行业在公关方面非常保守。我很早就被教导，对于我 `tweet` 的或所说的任何可能被误解为代表公司发言的话都要谨慎。而且我在\
  \ `Facebook` 公关部门的那些倒霉经历仍给我留下了不愉快的回忆。\n\n“所以，我参加这些活动，甚至作为 `Area 120` 的代表接受媒体采访也是可以的？”我观察他的脸寻找一丝恼怒，但一无没有。\n\
  \n“我不觉得这有什么问题。”\n\n“哇，谢谢，”我说。“太棒了。”\n\n我离开会议室时心情好得想吹哨。对我来说，这是一次决定性的胜利。科技行业拉丁裔之所以如此少是有原因的，尽管我们占美国所有劳动者的约\
  \ 17%，但在 `Facebook`、`Google` 和 `Amazon` 的劳动力中，我们的占比远低于 10%。\n\n### 入门障碍\n\n我只需要回顾自己的成长经历，就能理解为什么我社区的人不进入科技领域。在我的家里，有两种职业是可以向往的：医生或律师。90\
  \ 年代后期，当 PC 革命发生时，大多数美国家庭都拥有了电脑。但这在拉丁美洲并没有发生，那里的电脑贵得令人望畏。直到 `Smartphone` 发明——电脑和手机变得便宜到负担得起时——科技开始进入千家万户。所以，当美国家庭在几十年里慢慢接触到计算机科学时，拉丁美洲的许多拉丁裔并没有获得过那些资源。一旦他们拥有了，又面临着宽带接入不足的问题——这是活动人士多年来一直试图向国会强调的持续问题。此外还有无意识偏见。人们倾向于雇用外表像自己的人。\n\
  \n由于所有这些原因，通过教育和拓展来为科技领域带来更多多样性是迫切需要的——而这正是我可以帮助的地方。\n\n### 拓展与影响\n\n在与 Jon 对话后的几个月里，我通过视频会议在拉丁美洲举办了一些活动，并接受了\
  \ `Telemundo` 和 `Univision` 关于我加入 `Google` 的电视采访。在这些演讲中，我总是确保分享我曾成绩很差且来自贫困家庭的事实。在每场演讲后，`Facebook`\
  \ 和 `Twitter` 上都会收到许多孩子的信息，他们看了采访并感谢我激励了他们。他们喜欢我没有装成什么天才——我和他们一样。\n\n即使在采访多年后，我仍然收到世界各地人们的消息，告诉我被我的故事启发，并成功了自己的的产品和应用。“六年前我还是个孩子时联系了，现在我的职业围绕着计算机科学，”一位来自印度的毕业生写道。或者我收到秘鲁一位年轻女性的消息，“我做得非常好并赚了很多钱——而你是我的导师！”\n\
  \n在 `Area 120` 入职六个月后，我访问了佛罗里达州的一所小学院，向学习计算机科学和商务的学生演讲。房间里充满了快乐、活跃的能量。我喜欢与小组交流，我可以听取他们的问题并花时间给出深思的回答，而不仅仅是讲座。当我结束演讲，立刻举起了手。我叫了前面一个看起来和我相仿的孩子。他站起来，主持人递给了他麦克风。“我和你一样来自秘鲁背景，我想成为一名产品经理，”他热切地说。察觉到他甚至不知道那是什么，我花了大量时间解释产品经理到底做什么的，以便他做出明智的决定。另一个学生问如何建立人脉。“确保与你新公司的每一个人都会面，并让他们给你你应该会面的人的名单，”我说，“成为每个人都认识的人。”第三个人站起来询问通往经理的路径。“仅仅因为职位头衔里有‘经理’字，并不意味着那是你想要的工作，”我提醒道。“要非常小心，因为成为一名优秀的经理，你必须真正喜欢经理的工作。”\n\
  \n\n\n\n\n我对对自己提供的建议感到很满意；这些都是具体的、真实的技巧，学生们可以真正采用。\n\n这时，后排一个学生站了起来。他留着深色头发，身材中等，穿着一件连帽衫；如果在\
  \ Google，他会格格不入。有人递给他一个麦克风，他问了一个我最没准备好回答的问题：“如此公开自己的同性恋身份是什么感觉？”\n\n自从我的《西班牙语人民》（*People\
  \ en Español*）故事登上新闻杂志以来，互联网上到处都是关于我性取向的文章。这个问题让我措措失措，因为我内心一直很矛盾。一方面，我不希望被称为“那个同性恋工程师”；我希望通过自己的成功、能力和技能来定义自己。我也想融入其中，被视为一个“正常”的人。但在美国，只有\
  \ 5%%的人口是公开出柜的；在其他国家，这个比例要低得多。我决定写这篇文章是为了面对内心的恐惧——担心出柜会毁掉我的职业生涯，或者导致我的书约被取消，或者破坏我与家人的关系。谢天，这些情况都没有发生。当然，我很幸运；这类事情（甚至更糟）*确实*会发生在某些说出真话的人身上——那是悲剧性的。所以，在回答这个问题时，我不确定应该谈论出柜如何影响了我的生活，还是仅仅强调我认为这应该并不重要。\n\
  \n我结结了一分钟，说道：“那种感觉就像潜入一个深邃、黑暗的水池并憋了多年气——然后到达底部，发现那里*确实*有空气可以呼吸。这从我肩上卸下了巨大的负担。出柜后我感到如此冷静和放松，让我感到意外。因为我父母在我心中的那些恐惧其实都没有发生。尤其是我妈妈，她担心家里再也没有人想跟我说话，或者担心他们会变得面里心一套，当面说一套，背地里又说另一套。她把这些恐惧传给我，不是因为她想让我害怕，而是因为她想让我安全。但谢天，出柜并没有像我担心的那样对我的生活产生负面影响，也没有导致我的职业生涯崩溃。我爸爸妈妈终于看到了这一点，并开始支持我。”\n\
  \n那个学生笑了，松了一口气。“谢谢你，”他说。我那时就向自己发誓，无论我感到多么忙碌或疲惫，我都会永远留出空间来完整地分享我的故事。无论面对面的交流是通过屏幕、在礼堂里，还是在小学食堂黏糊糊的地板上，这并不重要。\n\
  \n# 第 34 章：感恩\n\n“我们不应该去厨房帮帮你妈妈吗？”威廉说，“没人在干活。”\n\n“妈！”我喊道。“因为`我`是那个做饭的人！”我妈妈笑着回道。\n\
  \n威廉看起来很困惑，但我不知道该如何在不让自己尴尬的情况下解释，妈妈不想让我们进厨房。我妈妈忙得顾不上我们：一边给火鸡淋油，一边翻炒蔬菜，一边制作布丁，一边查看手机上的\
  \ Facebook 更新。一分钟后，我妈妈从厨房冲出来，手里拿着一个装有录像带的白色篮子。“电影时间，大家！”她用英语说道。时机恰好。\n\n她有一群听众，所有客人都聚集在客厅里聊天和看电视。我姐姐带着她的新男友瑞克正在关灯，帮我爸爸把摄像像机连接到接收器上；威廉正在抚摸我过敏的那些小狗；而从秘鲁来访的凯克舅舅正试图在我的翻译下与威廉聊天。\n\
  \n“威廉，瑞克，你们会喜欢这些小迈克和玛丽娜的老电影的！”妈妈说。通常她让我为不会西班牙语的朋友翻译，但她一直在努力为威廉和瑞克说英语。\n\n“噢，太棒了，”威廉说。从我们来到这里开始，他就表现得几乎难以忍的好、安静和礼貌，试图在妈妈面前展现最好的一面，妈妈似乎也在努力留给他好印象。她穿着一件亮蓝色衬衫和白色牛仔裤。当她挥动遥控器时，手臂上的手镯叮当作作响。“坐，坐！”她说，把威廉推到电视机前的黄金位置，那里通常是小狗坐的地方。\n\
  \n一旦大家都坐好——我和我妈妈坐在厨房椅子上；我爸爸坐在躺椅上，膝盖上抱着他那只小茶杯约克梗犬`Sophia`；威廉、瑞克、玛丽娜和凯克舅舅挤在沙发上——节目开始了。第一个跳出来的是一段画面模糊的、从教室后方拍摄的小学圣诞节表演。如果你仔细看，可以看到玛丽娜和我站在舞台侧面，穿着普通的便服，看着其他人。\n\
  \n“带子放错了，”妈妈说。“迈奇，放另一张贴着`dos mil cumpleaños`（两千生日）贴纸的，”她拍响了三次指。\n\n专业的录像带是我六岁的生日派对，我对那没有任何真正的记忆。我妈妈当时是想搞一个《了不起盖盖比主题吗？还是奥斯卡颁奖后派对主题？那是我们的老房子，后院有一个布满气球的大帐篷，里面有几十张铺着白色桌布和彩色盘子的圆桌。有穿着管家服的服务员在穿梭，一名魔术师在表演魔术，而我，还是一个健康的瘦小孩子，和幼儿园的小伙伴一起张大嘴巴看着。噢，还有一个全套酒吧和一个现场乐队演奏着老式的拉丁音乐、库姆比亚、梅伦格舞和萨萨歌曲。最奇怪的是看到我的父母和他们的朋友年轻了十五岁——我妈妈三十三岁，我爸爸四十二岁。我妈妈看起来比任何时候都要漂亮，在客人之间穿梭，似乎无忧无虑。（当时我们没有人担心国家的状况。）\n\
  \n“看到没，威廉？”妈妈说。“我打赌迈奇只说他对我们做了什么。我打赌他从没说过我们对他做了多了不起的事对吧？”\n\n“呃，”威廉看着我。我摇头表示*别回答那个*，但威廉太好面了，不会让妈妈尴尬。“我绝对没有举办过这样的派对，”他说。\n\
  \n“有人举办过这样的派对吗？”我在父母之间来看来看去。“我们认识的人吗？邻居里吗？”\n\n“只有我们！”我爸爸自豪地大声说道。“没错，”妈妈补充道，“我们总是有最好的派对。”\n\
  \n“但你们是怎么付钱的？”我说。\n\n“我们今年过得很好，”妈妈说。\n\n我知道妈妈大部分用现在时说英语是因为她从未精通过去时，但这个习惯现在似乎具有象征意义，仿佛她正让过去变成她的新现在。\n\
  \n“餐厅今年赚了超过一百美元，”妈妈自豪地补充道。\n\n“*什么？*”我大叫起来，彻底震惊。我坚持让她重复一遍，以防我听错了。\n\n“是的，”妈妈确认道，“我说的是一百美元！这是一个非常——”\n\
  \n“*看这个，这就是你现在处于这种境地的原因！*”凯克舅舅打断了，我姐姐现在正在为他翻译。\n\n\n\n\n我妈妈无视了她的哥哥，而哥哥当然是对的。这正是他们失去房子、失去自给自足能力以及一切的原因。他们现在的处境确实非常糟糕。我父母没有真正的医疗保险，而且快要失去他们的车了。但我的妈妈并没有用最近收到的退税款结清逾期付款，而是把那笔钱买了一张飞往`Peru`的机票，去追求一个全新的珠宝制作想法。我爸爸则很凄惨地试图推销那些补贴公寓，但这些公寓对最需要它们的人来说还是太贵了——那些因为经济衰退、一分钱储蓄都没有，而被击垮的人，就像我和我妈妈一样。\n\
  \n“太棒了，营地！”`Rick`说道。\n\n我看向屏幕，屏幕上显示着我们一家人乘坐`RV`进行跨国家庭旅行的证据。我不记得那次旅行的规模和范围了。我记得租了一辆小卡车，沿着蜿蜒的道路开了好几个小时，吃着自制的饭，并在小镇里停了几次——但和这完全不一样！\n\
  \n“噢天呐，我一直想去体验一次这种！”`William`说道。我瞪了他一个白眼。\n\n`Sayman Family Pre-Recession Greatest\
  \ Hits`的影像胶带继续播放。画面中，我们在`Louvre`门外。这又是我们又一次精心举办的派对，有几十盏提基火炬，还有一个戴着大白帽的厨师，还有……\n\n\
  我猛地跳了起来。“那些是是我们`backyard`里的`ponies`吗？”我再也受不下了。除了我和`Tío Kike`，难道没有人能看出这一切有多悲哀吗？为什么大家看`me`的样子就像我疯了一样？“我不是这里那个疯子！”我气愤地在电视前踱步，“你为了……把我们的大学基金和你的退休金全毁了？”我停下来，指向屏幕，屏幕现在显示着我们旧后院变成了一个互动动物园——旁边那是我在主题公园之外见过的最大的充气城堡。我无话可说。“Arrgghhhhh­hhhhh­hh！”我大叫道。\n\
  \n“Ay ya…Ay ya…con lo mismo！”我`mom`说道。（又来了……又来了……又是这套词！）\n\n“随你怎么吧，`Michael`！”我姐姐厉地说道。\n\
  \n“`Michael`！”我`dad`补上了一句，“No seas tan egoísta！”（别那么自私！）\n\n“别这么说了！”我回吼道，冲回我的旧卧室。“别再叫我自私了！”\n\
  \n***\n\n我坐在旧床的角上，那里还是那条灰色的床单，抽泣着。\n\n很快，我`mom`走了进来坐在我身边，她一坐下就开始抽了抽鼻子，并用指背擦着眼泪。她现在只用`Spanish`说话了。\n\
  \n“`Michael`，你为什么不觉得我们是好父母呢？这一切都是为了你做的！”\n\n“是啊，看看这让你变成什么样了！”我反驳道。\n\n她看起来很吃惊。“别管我。你很成功！我不明白你为什么不能知开心心。”她停了顿。“没关系。你不需要帮我们。做你自己的吧。”\n\
  \n“妈妈，我是在帮你们啊！”\n\n*(注：由于所提供文本后半部分具有重复且无意义的性质，我在处理核心叙事流的同时，对识别出的实体和术语应用了格式规则。)*\n\
  \n\n\n\n是祖父母的慷慨资助了我妈妈第一次前往迈阿密，这开启了她下半生以及我人生的轨迹。当然，我妈妈来到北美时，带来的不仅有她的快乐和对美好生活的喜爱。她还带去了家族刻勤工作和创业精神的传统。我当时还在消化这个消息：`El\
  \ Pollon` 在我六岁那年赚了超过 100 万美元。直到小时前，我一直以为我是我们家第一个百万富翁呢！也许我不应该感到如此惊讶。那个举办过奢华的《大盖茨比》派对、入不敷出的妈妈，曾亲身向我展示了如何挖掘创造力并转化为`work`。虽然我不记得那场\
  \ `Gatsby` 派对，或者那次房车公路旅行，但谁知道呢？也许正是那些早期的经历在我心中种下了这样的种子：在生活中渴望更大、更好的事物是可以的，要相信美国梦对我就像对其他人一样适用。\n\
  \n所有这些历史——所有来自我秘鲁和玻利维亚祖先的传统、迷信、记忆、特征和文化图腾——都深深地织入了我的体内，无论我是否想做，永远无法拆掉这幅织锦。“我不是因为移民才成为自己；我是因为移民才成为现在的自己，”我内心的一个声音说道。\n\
  \n我的性格，也就是每一个移民后代孩子的性格，是由遗传成分和新成分的独特混合而成的。当然，新成分是美国人的思维和做事方式，我必须自己去发现。也许我当时并不知道，但正是美国人创新的冲动驱动着我去开发应用，无论是成功的还是失败的。正是硅谷那种“工作应该是快乐的”的信条，让我有勇气拒绝我父母那种“不付出痛苦就无收获”的心态，去寻找每一步都能触动我灵魂的工作。我是多么幸运，竟然沉浸在美国式的信念——或者取决于你如何看，那是童话——中长大：任何人都可以任何时候重新定义自我。正是这种精神驱使我清醒过来发现了真实的自我。\n\
  \n# 结语\n\n距离我开发第一个 App 已经十多年了，在二十多头的我，已不再是字面意义上的“App 少年”。不久前，我发现自己再次回到舞台，在硅谷心脏地带的梅洛学院（Menlo\
  \ College）的一场会议上发表演讲。主题是“这就是美国”，而我选择了谈论成功的意义。说我很紧张那实在太轻描淡写了。虽然在 `Teen Talks` 时代我在\
  \ `Facebook` 做过几十次演讲，在职业生涯中在拉丁美洲也做过很多，但这次不同。那些演讲是关于社交媒体、游戏和编程的——这些是我热爱、甚至以此为生去思考和讨论的话题。我当时几乎不需要准备。但今天的主题，即成功对我意味着什么，要沉重得多。我一直在思考我在\
  \ `Google` 以及在世界上的位置。我的道路正确吗？我曾以为这些活动是为那些已经想通一切的人准备的。我写这篇演讲稿是为了寻找那个问题的答案。\n\nWilliam\
  \ 和我最终分手了。他是我的第一个真爱，他向我展示了无条件的接纳，以及“工作与生活平衡”中“生活”部分应该是什么样子。他还启发我去更深地挖掘我的家庭问题。在分手之前，我就开始定期看心理治疗师，并对我的生活、工作和家庭进入了深度的自我探索模式。对于任何读这本书的人来说，可能显而易见：当我的父母花光我小时候赚的那些钱时，他们完全是错了。但确实花了很多年，才让我意识到一个事实：我的父母——往好了说——是极其不完美的。所有的批评、辱骂、操纵和谎言对我来说似乎都是常态——这是一种我必须努力消除的心态。从那以后，我接受了我和父母可能永远会有不同的看待问题的方式。他们可能永远无法完全理解我，我也可能永远无法完全理解他们，但我深爱他们。他们可能永远不是完美的父母，但谁的父母都不是完美的。我可能永远无法理解他们的观点，也许某一天我会理解。我学会了尽一切努力保留对他人的判断。这不是因为我不想形成自己的观点，而是因为我想为未来的一种可能性留一扇门，即我可能是错的。我不知道我父母的真实经历是怎样的。有一天，我希望能更好地理解他们，目标是给我未来的孩子提供一个比传给我的更宽广的视角。我永远无法一次性理解一切。我不能指望用自己的视角完全理解他人的观点。有些事情我需要时间才能真正掌握——因此我根据这一前提调整了我的想法。我还在学习说：“*Es\
  \ importante querer cuidarse,*”，或者说，“想要照顾自己是很重要的。”事实上，这不仅仅是重要——它是必要的、好的。\n\n## 领悟\n\
  \n透过舞台灯光，我眯起眼睛，向第一排两个来自硅谷的朋友点头示意，他们手里拿着小小的 `go, michael!` 牌子。他们身后是几百名年轻观众，大多是美国大学生——这和第一次第一次大演讲时的氛围完全不同。\n\
  \n这些感悟给了我空间让我开始思考我*真正*想要什么以及我是否正朝着正确的方向前进。\n\n在演讲中分享了以上所有内容情感最充沛的版本后，我想起观众正等着我进入正题。我大声说出了房间里所有人都在想的想法：“那么，结论是什么？”\n\
  \n\n\n\n\n## 成功的智慧\n\n我为自己以及观众总结出的智慧包含两个部分。首先，如果你让别人来定义成功对你的意义，你永远不会感到自己是成功的。其次，在每一个成功故事中，都留下了怀疑、恐惧和困惑的空间。事实上，也许成功并非由于避开了这些东西，而是正因为有了它们。也许如果我们把恐惧和怀疑视为基石而非绊脚石，我们的生活将会变得轻松得多。\n\
  \n## 重新定义个人成功\n\n自从完成那场演讲以来，我一直尝试遵循自己的建议。我正越来越接近按照自己的标准来定义成功，事实证明，这并不是关于制造下一个大型科技产品，而是关于工作、学习以及过上舒适、快乐的生活。我也在学会不再因为自己有一半时间仍然感觉像个害怕、困惑、充满怀疑的十岁孩子而自责自备。那个缺乏安全感的十岁孩子成就了今天的我。\n\
  \n噢，我还在尝试接受变老。我曾认为，在任何团队中成为最年轻的程序员是我的超能力。尽管我的同事们怎么说，我依然说服自己与青少年群体建立直接联系是我在 Facebook\
  \ 提供的最有价值的东西，随后在 Google 和 Area 120 也是如此。自然地，我恐惧这种超能力的过期日期。这就是为什么我会在每个生日都给自己施加压力，去达到一个新的职业里程碑。但随着时间的推移，在比我更有智慧、更有经验的人的帮助下，我明白我不仅仅能迎合青少年的需求。事实上，事实我在理解人们需求方面有着很不错的天赋。我不再只想为某一个特定群体创造东西。我想为所有人创造东西，并抱着这样的心态：全人类都需要相同的基本需求——被看见、被知晓和被理解。\n\
  \n## 团队合作的价值\n\n吸收这一事实对我来说极具价值，让我成为了一个更好的程序员，甚至——你可能不相信——成为了一个合格的经理。在 Google 的日子里，我大部分时间都在远程工作，但独处的时间减少了，花更多时间和我由十名设计师和工程师组成的团队在一起，为\
  \ `Google Chrome` 开发新功能。我花了很长时间才明白这一点，但如果你天生是个“独行侠”，那么与团队合作的一个极佳益处是，你无法在自己的世界里虚度不健康的时间。有了更多的反馈，你不是在真空中工作，因此你可能会产出一个与更多人产生共鸣的产品——一个更好的产品。\n\
  \n我也花大量时间帮助其他团队实现项目目标。每周，我都会与 `Android`、`YouTube`、`Chrome` 等多个团队重新建立联系，就工作流、调度、设计到如何克服阻碍他们进展的心理障碍等一切问题制定策略。能够帮助他人克服那些曾每天让我跌倒的相同障碍，这种感觉非常好。当然，我有时也需要帮助。尽早且频繁地大声承认这一点——并且不仅向更有经验的人，也向我所有的同事寻求指导和反馈——这对我来说是革命性的。我学了与团队合作的一件事是，在每次会议后，至少拉一个人到跟前问一句：“嘿，你是否觉得我哪方面做得非常糟糕，或者……”\n\
  \n## 数字时代的挑战\n\n## 互联网的阴暗面\n近年来，互联网显然向我们展示了极其阴暗的一面——从 2016 年影响选举的 `Facebook` `剑桥分析数据公司`\
  \ 丑闻，到经常泄露个人隐私信息的安全违规事件，再到在网上传播恶毒信息的仇恨团体的兴起。最让我担心互联网的可能是，它如何改变了我们阅读的新闻。在如今大多数美国人获取新闻的\
  \ `Facebook` 上，我们可以选择想要订阅的哪种新闻“现实”。在微观层面，人们想要这些功能，并在看到他们喜欢和认可的东西时感到快乐。在宏观层面，这些功能让本就分化的社会变得更加疏远。\n\
  \n我认为硅谷的一些人正在问：我们能通过回头来解决我们创造的问题吗？我们可以消除这些损害吗？但我的相信，我们已经越过了这个山谷太远了，无法回头。更好的问题是：山谷的另一边是什么？我相信可以出现一个向上的趋势，一个我们利用技术来结束世界上所有无意义痛苦的未来。如果说有人能带领我们走向那个更高的境界，那将是年轻人。\n\
  \n## “人人都能”世代的兴起\n\n现在的小孩子通常被称为 Alpha 世代；青少年和二十岁出头的人被称为 Z 世代。但我划分的方式略有不同。我喜欢把今天所有\
  \ 25 岁以下的人称为“人人都能”世代（Anyone Can Generation），因为他们成长过程中一直知道创造力没有限制。在他们以互联网为中心的世界模型中，任何人都可以具有影响力或变得有名。任何人都可以做任何事情。\n\
  \n那些认为这些爱自拍的孩子虚荣或过度关注自我的老年人，绝对是低估了他们。我相信，“人人都能”世代的成员之所以能让世界变得更好，正是因为他们整个的一生都生活在网上。这就是为什么我对未来感到乐观：在未来几年，随着编程成为一种更常见的技能，“人人都能”世代将开始为我们构建一个更加公平、公正的互联网。我相信他们会以某种非常有创意的方式做到这一点。\n\
  \n\n\n\n\n想想。这些孩子正以前所未有的方式自信地向世界表达自我——通过 Vlog、TikTok 挑战赛、Instagram 直播故事以及数百万种其他方式展现自己。我非常喜欢这样一个事实：现在迪士尼、ABC\
  \ 和 CNN 必须与那些在自拍中长大的 18 岁 LGBT YouTube 主播竞争。我很喜欢这样一个事实：拉丁裔青少年——即便每天遭受我们政府及其政策的攻击——依然能从学校回家，并创造出一个安全空间来分享他们的才华和故事。我喜欢许多有色人种拥有数百万的订阅者，并拥有产生巨大影响的力量。在\
  \ 60、70、80 8 年代或 90 年代，非白人种是不可能获得那种媒体关注灯的，因为当他们从外部向内部探索时，有太多根深固的墙需要逾越。\n\n我最大的愿望之一是，通过分享我的故事，让一些人意识到编程是一条任何人都可以选择的道路。对于我关于“人人都可以一代”的种种漫谈，我指的不只是年轻人。无论你的年龄、教育程度或背景如何，只要你有好奇心和决心，你就可以学习编程。如果这让你产生了共鸣，就自学吧！什么在阻碍你？一旦你拥有了基础能力，是创造自己的产品还是在公司里找份工作将取决于你的选择。这两条路都能通向无限可能。如果创业的想法让你心跳愉快地加速，那么请相信那种感觉。从构建一个你希望世界上已经存在的东西开始吧。如果这个东西会让你的世界变得更好，我打赌其他人也会有同样的感觉。另一方面，如果你像我一样渴望安全和稳定，我会建议你走职业路线——然后从内部努力改变科技世界。一旦你站稳了脚跟，你就有奢侈去思考如何产生最大的影响。\n\
  \n然后，缓慢而坚定地，你可以构建恰恰实现这一点的工具。\n\n最后，无论你正处于生活的哪条道路，无论你爱谁，愿你找到属于自己的成功定义——并有勇气去实现它。\n\
  \n# 致谢\n\n感谢我的经纪人、 ICM 的 Amanda Urban，她从一开始就信任我，并帮助我应对图书出版界陌生的领域。我想向 Anne Messitte\
  \ 表达深切的谢意，感谢她最初信任我的稿件；特别感谢 Alfred A. Knopf 出色的团队，特别是我才华横溢的编辑 Tom Pold 和 Cristóbal\
  \ Pera，以及 Vintage Español 的 Alexandra Torrealba。我还要感谢 Laurie Sandell 卓越的编辑指导；没有她，这本书就不会诞生。\n\
  \n感谢 Michelle Castillo-Flores 鼓励我分享自己的故事，感谢 Mark Zuckerberg 在我的前额叶皮层尚未完全发育成熟之前就给了我机会。非常感谢\
  \ Facebook 和 Google 的同事们，他们可能有时在想自己为什么会和一名青少年一起工作，但他们愿意看到我所创造事物的价值。Ari Grant 将我的职业生涯推向了更高高度，在挑战我的方法的同时也支持我那奇特的思维方式。Ryan\
  \ Hoover 在我相信自己很久以前就一直相信了我。\n\n我还要感谢成千上万随我走过这段旅程的孩子和父母，他们通过社交媒体、讲座和会议与我联系，分享他们的故事。他们中的许多人成为了自己社区的典范，展示了互联网可以提供的机会。\n\
  \n## 我的 Tío Kike\nLuis Enrique Galvez 在我一生中都提供了一个建议平台，随着我的成长，这被证明是无价的。非常感谢迈阿密的所有朋友，从未让我忘记自己的出身。我永远感谢我的父母，尽管我们家庭面临挑战，他们始终爱着我。*我非常爱他们（Los\
  \ quiero muchísimo）。*感谢我的姐姐兼好朋友 Mariana，感谢她一直守在我身边。\n\n# 关于作者\n\nMichael Sayman\
  \ 是一位拉丁美裔应用创业者、产品设计师和软件工程师，因在青少年时期创作了热门排行榜的应用而闻名。随着回合制照片游戏 `4 Snaps` 的发布，Sayman\
  \ 吸引了 Mark Zuckerberg 的注意，成为 Facebook 的“驻场少年”，并在 Instagram Stories 的创建中发挥了关键作用。18\
  \ 岁时，他被 CNET Español 描述为“科技领域最具影响力的 20 位拉丁美裔之一”。21 岁时，Sayman 被招入 Google，在那里成为一名产品经理和驻场创始人，负责一个社交游戏初创项目。如今，他在佛罗里达州的迈阿密和硅谷之间往返，继续在社交媒体领域进行创新。\n\
