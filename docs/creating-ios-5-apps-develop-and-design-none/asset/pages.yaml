- pgno: 307
  md: "There’s just one catch: All the objects in our array must also adopt the NSCoding\
    \ protocol. Unfortunately, our WeightEntry class does not. Fortunately, this is\
    \ easy to fix. Let’s start by adding the protocol to WeightEntry’s interface:\n\
    \n```\n```objective-c\n@interface WeightEntry : NSObject <NSCoding>\n```\n```\n\
    \nThen open the implementation file and define the keys that we will need. Place\
    \ these before the @implementation block.\n\n```\n```objective-c\nstatic NSString*\
    \ const WeightKey = @\"WeightHistoryWeightInLbs\";\nstatic NSString* const DateKey\
    \ = @\"WeightHistoryDate\";\n```\n```\n\nNow we need to implement NSCoding’s required\
    \ methods. First, let’s implement the encodeWithCoder: method.\n\n```\n```objective-c\n\
    #pragma mark - NSCoding Methods\n- (void)encodeWithCoder:(NSCoder *)encoder {\n\
    \    [encoder encodeFloat:self.weightInLbs forKey:WeightInLbsKey];\n    [encoder\
    \ encodeObject:self.date forKey:DateKey];\n}\n```\n```\n\nThis is relatively straightforward.\
    \ When saving an object hierarchy, each object’s encodeWithCoder: method is called\
    \ in turn. The object is responsible for saving all of its non-transient internal\
    \ data. In our case, we simply save our data using our WeightInLbsKey and DateKey.\n\
    \nNext, implement the initWithCoder: method.\n\n```\n```objective-c\n- (id)initWithCoder:(NSCoder\
    \ *)decoder {\n    self = [super init];\n    if (self) {\n        _weightInLbs\
    \ = [decoder decodeFloatForKey:WeightInLbsKey];\n        _date = [[decoder decodeObjectForKey:DateKey]\
    \ retain];\n    }\n    return self;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 308
  md: "We actually saw initWithCoder: in “Building a Custom View” in Chapter 5. GraphView\
    \ used it when loading from a nib file. As it turns out, the system uses NSCoding\
    \ to store and load nibs.\n\nIn many ways, initWithCoder: mirrors our designated\
    \ initializer. If the superclass adopts the NSCoding, we should call the superclass’s\
    \ initWithCoder: method. Just like our designated initializer, we assign the return\
    \ value from the superclass’s initWithCoder: method to self. As long as self is\
    \ a valid object (not equal to nil), we decode the rest of our data using our\
    \ keys and assign those values to our instance variables. Then we return self.\n\
    \nIn WeightEntry, our superclass (NSObject) does not adopt NSCoding. As a result,\
    \ we cannot call [super initWithCoder: decoder]. Instead, we call the superclass’s\
    \ designated initializer.\n\nIn both cases, this bypasses our class’s designated\
    \ initializer. Therefore, we need to make sure our initWithCoder: class duplicates\
    \ any of the setup and configuration steps performed in the designated initializer.\
    \ initWithWeight:units:forDate: sets both the _weightInLbs and _date instance\
    \ variables, so we do the same thing here. In fact, initWithCoder: is a bit simpler.\
    \ We know that the weights are always saved in pounds, so we don’t need the extra\
    \ logic to convert from kilograms.\n\nIf you look at our GraphView class, you\
    \ will see a similar relationship. Both initWithFrame: and initWithCoder: call\
    \ [self setDefaults]. Again, initWithCoder: duplicates our designated initializer’s\
    \ configuration steps.\n\nWith that out of the way, we can now override UIDocument’s\
    \ contentsForType: error: and loadFromContents:ofType:error: methods.\n\n```\n\
    ```\n#pragma mark - iCloud Methods\n- (id)contentsForType:(NSString *)typeName\n\
    \    error:(NSError **)outError {\n    return [NSKeyedArchiver archivedDataWithRootObject:\n\
    \        self.weightHistory];\n}\n```\n```"
