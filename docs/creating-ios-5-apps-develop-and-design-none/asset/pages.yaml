- pgno: 543
  md: '+   - genstrings


    This command-line utility can parse C and Objective-C files and can find all the
    keys declared using one of the NSLocalizedString() methods. It will then build
    the .strings files containing all the unique values it found. This file can then
    be sent to translators, and the translated versions can be placed in the appropriate
    language bundles.


    Additionally, we don’t need to translate every single string in our application.
    We only need to localize the strings that the user actually sees. Strings used
    as internal keys or as the names of notifications should be left alone.


    For more information, see the Internationalization Programming Topics.


    # # ACCESSIBILITY


    Recently, iOS has received a lot of praise and press for its excellent accessibility
    features. Out of the box, iOS provides a wide range of alternate input and output
    settings to assist people with low vision or blindness, hearing disabilities,
    and motor or physical disabilities. For the most part, these features are available
    to our application for free. We may need to be a little careful when creating
    custom gestures, since assistive touch won’t support them, but other than that,
    we can focus all our attention on supporting VoiceOver.


    For most standard controls, we just need to set the Accessibility settings in
    Interface Builder. These can be found in the Identity inspector. The label is
    a string that succinctly identifies the control. For example, “Units” or “Enter
    Weight.”


    The hint is a brief string that describes the effect of performing an action on
    the control. This should avoid mentioning either the control or the action. For
    example, “enter a new weight” not “select this text field to enter a new weight.”


    This, however, is just the beginning. iOS accessibility support provides a number
    of methods to help truly customize and refine the interface. I highly recommend
    reading through the Accessibility Programming Guide for iOS for more information.'
  merge: -1
  img_proc: true
- pgno: 544
  md: "# # FILE SHARING\n\nAs we have seen, iOS 5 added document sharing using iCloud.\
    \ However there are some older file sharing techniques we can still use. Even\
    \ in the age of iCloud, these techniques have important roles to play.\n\nFor\
    \ example, adding the UIFileSharingEnabled key to our application’s Info.plist\
    \ and setting its value to YES shares our application’s Document directory with\
    \ iTunes. From within iTunes, the user can see all the files in the Document directory.\
    \ They can add new files and delete existing files.\n\nThis is still particularly\
    \ useful if your users are likely to load a number of large files. Over-the-wire\
    \ transfers from iTunes are still the fastest way to get large amounts of data\
    \ onto our device. Furthermore, documents shared this way do not take up space\
    \ in iCloud storage (though they may take up space in iCloud backup, depending\
    \ on how the device is configured).\n\nApplications can also transfer documents\
    \ among themselves. To transfer a document to other applications, simply create\
    \ an instance of UIDocumentInteractionController. Then call either presentOpenInMenuFromBarButtonItem:animated:\
    \ or presentOpenInMenuFromRect:inView:animated:, depending on whether you want\
    \ to anchor the menu to an arbitrary rectangle or to a bar button.\n\n```\n~~~objc\n\
    - (IBAction) exportButtonPressed:(id)sender {\n    // Open file in other apps.\n\
    \    UIDocumentInteractionController* controller =\n        [UIDocumentInteractionController\
    \ interactionControllerWithURL:\n            fileURL];\n    [controller presentOpenInMenuFromBarButtonItem:sender\n\
    \                                        animated:YES];\n}\n~~~\n```\n\nThe system\
    \ will dynamically create a menu, listing all the applications that have registered\
    \ support for the given document type.\n\nThe complement to this is, of course,\
    \ that our applications can also register all the documents that they support.\
    \ This requires two steps. First, add an appropriate document type to the target’s\
    \ Document Types list. We already did this in the “Preparing the Application”\
    \ section of Chapter 6, when we registered our Health"
