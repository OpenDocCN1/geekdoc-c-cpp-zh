    Simply profile your application. Select Product > Profile from the main menu.
    Select the Leaks template in Instrument''s pop-up window and click Profile (Figure
    2.3). This will launch both Instruments and your app.


    Instruments will start up with two diagnostic tools. Allocations tracks memory
    allocations and deallocations, while Leaks looks for leaked memory. Leaks will
    appear as red bars in the Leaks instrument. Select the Leaks instrument row, and
    the details will appear below. In the jump bar, change the detail view from Leaks
    to Cycles, and Instruments will display your retain cycles (Figure 2.4). You can
    now double-click the offending reference, and Xcode will automatically navigate
    to it. Fix it (either by changing it to a zeroing weak reference, or by restructuring
    the flow of our application), and test again. We will discuss Instruments in more
    detail in Bonus Chapter B (www.freelancemadscience.com/book).


    # RULES OF THE ROAD


    It''s incredibly easy to use ARC. Most of the time, we don''t need to do anything.
    All of Xcode 4.2''s project templates use ARC by default—though we can enable
    manual memory management on a per-file basis, if necessary. This lets us freely
    mix ARC and non-ARC code. ARC can be used on any projects targeting iOS 4.0 and
    above (with some limitations). And Xcode even has tools for converting non-ARC
    applications (choose Edit > Refactor > Convert to Objective-C ARC).


    For ARC to work properly, the compiler must be able to correctly interpret our
    intent. This requires a few additional rules to help remove any ambiguity. Don''t'
