  md: "Imagine I have a person object defined as shown here:\n\n```\n```objective-c\n\
    @interface Person : NSObject\n@property (nonatomic, strong) Person* parent;\n\
    @property (nonatomic, strong) Person* child;\n+ (void)myMethod;\n@end\n```\n```\n\
    \nAnd myMethod is implemented as shown:\n\n```\n```objective-c\n+ (void)myMethod\
    \ {\n    Person* parent = [[Person alloc] init];\n    Person* child = [[Person\
    \ alloc] init];\n    parent.child = child;\n    // Do something useful with the\
    \ parent and child.\n}\n```\n```\n\nIn this example, when we call myMethod, two\
    \ Person objects are created. Each of them starts with a retain count of 1. We\
    \ then assign the child object to the parent's child property. This increases\
    \ the child's retain count to 2.\n\nARC automatically inserts release calls at\
    \ the end of our method. These drop the parent's retain count to 0 and the child's\
    \ retain count to 1. Since the parent's retain count now equals 0, it is deallocated.\
    \ Again, ARC automatically releases all of parent's properties. So, the child\
    \ object's retain count also drops to 0 and it is deallocated as well. By the\
    \ end of the method, all our memory is released, just as we expected.\n\nNow,\
    \ let's add a retain cycle. Change myMethod as shown here:\n\n```\n```objective-c\n\
    + (void)myMethod {\n    Person* parent = [[Person alloc] init];\n    Person* child\
    \ = [[Person alloc] init];\n    parent.child = child;\n    child.parent = parent;\n\
    \    // Do something useful with the parent and child.\n}\n```\n```"
