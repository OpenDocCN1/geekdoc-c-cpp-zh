  md: '# WRAPPING UP


    We’ve covered a lot of important ground in this chapter. iCloud is, without a
    doubt, one of the most important new features in iOS 5. As you’ve seen, it is
    also somewhat complicated to implement correctly. In this chapter, we covered
    the steps needed to implement a UIDocument subclass. We looked at techniques for
    creating new documents and opening existing documents. We also modified our application
    to respond to notifications from our document and to merge any conflicts as they
    arise. We added undo support and autosaving. And we synced our user preferences
    using iCloud key-value storage.


    Our Health Beat application is now functionally complete. We can add and remove
    weight entries. These entries are saved and synced to all our devices. We can
    view our history and graph our progress. While the application can undoubtedly
    be improved, there are no major pieces left to implement.


    Next chapter, we will take a step back and replace our application’s model with
    Core Data. As you will see, UIManagedDocument and the Core Data model automatically
    handle many tedious document management tasks for us.'
