- pgno: 270
  md: "Once we have the start and end x-coordinates, we create an empty UIBezierPath.\
    \ This will hold our trend line. We set the width based on our trendLineWidth\
    \ property and then give it rounded caps and joins. We discussed the caps earlier.\
    \ Joins define the shape of the corners where two line segments connect.\n\nAs\
    \ the last step in this snippet, we create a rectangle based on our startX, endX,\
    \ topY, and bottomY values.\n\n```\n```objective-c\n// Process all the entries.\n\
    \n[self.graphStats processWeightEntryUsingBlock:\n    ^(WeightEntry* entry) {\n\
    \        CGPoint point =\n            [self coordinatesForEntry:entry inBounds:graphBounds];\n\
    \        if (trendLine.empty) {\n            // If we don't have any points,\n\
    \            // move to the starting point.\n            [trendLine moveToPoint:point];\n\
    \        }\n        else {\n            // Otherwise, draw a line to the next\
    \ point.\n            [trendLine addLineToPoint:point];\n        }\n    }];\n\
    \    [self.trendLineColor setStroke];\n    [trendLine stroke];\n}\n```\n```\n\n\
    Finally, we use our processWeightEntryUsingBlock: method to process all the WeightEntries\
    \ in our GraphStats object (see “Building GraphStats” at the beginning of this\
    \ chapter)."
