- pgno: 16
  md: 'Finally, Apple has given us a set of high-quality development tools. Xcode
    4 represents a significant improvement over previous versions. It is a full-featured
    integrated development environment with a wide range of utilities for testing,
    analyzing, and debugging your code. In particular, the Instruments utility can
    monitor and analyze CPU usage, memory allocation, network and file access, and
    much more.


    Apple also provides a top-notch programming language with an excellent set of
    frameworks. I know, I know...a lot of new iOS programmers balk at learning Objective-C,
    and I admit that the learning curve can feel quite steep, especially when you''re
    struggling to get started. Still, once you begin to get comfortable with the language,
    you will quickly grow to love it. Besides, it''s always good to learn a new programming
    language. It will make you a better developer, even if you never use it for production
    code.


    Objective-C is a dynamic, incredibly flexible programming language. It provides
    a number of features that will (if used properly) help you overcome many difficult
    programming challenges. Likewise, the iOS software development kit (SDK) provides
    a wide range of excellent frameworks to help us build our apps.


    Frameworks are one of the most difficult pieces of software to design. Ideally,
    they should make it simple for developers to perform common tasks while still
    giving us enough freedom to strike out into uncharted territory. By those metrics,
    the Cocoa Touch frameworks are some of the best that I''ve ever worked with. Indeed,
    if you feel like you have to write a lot of code just to do a common task, you
    are almost certainly doing something wrong.


    I hope that this book will provide a gentle introduction to the world of iOS development.
    While it''s not possible to cover every aspect or explore every framework, this
    book should give you a strong foundation to build on, and the tools and skills
    to continue on your own.


    Additionally, while most of the book focuses on developing for the iPhone, the
    concepts and techniques generally apply to any iOS device: iPod touch, iPad, and
    iWhateverMayCome. Specific differences will be noted as they occur. The iPad,
    in particular, has a few unique user interface elements, and iPad-specific development
    issues will be covered in depth in Bonus Chapter A at the book''s website (www.freelancemadscience.com/book).


    For now, let''s jump right in to our first project. Let''s begin by building an
    iPhone utility application that will display a simple, one-line message. Don''t
    worry if you don''t understand the code the first time through. We will cover
    the Objective-C programming language in more depth in Chapter 2, "Objective-C."
    For now, use this as an opportunity to familiarize yourself with the development
    environment.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# GETTING STARTED


    Ask any craftsman—if you want to succeed, you must have the right tools for the
    job. For iOS development, this means having a Macintosh running OS X 10.7 or later
    and a copy of Xcode 4.2. If you want to run your programs on an actual iOS device,
    you will also need a compatible device (iPhone, iPod touch, or iPad) and the appropriate
    developer/provisioning profiles. We''ll talk more about provisioning profiles
    in Chapter 3, "Productivity Application Architecture." For now, begin by downloading
    the latest version of Xcode from the Mac App Store. This is a free download for
    anyone running OS X Lion and is by far the easiest way to keep all your development
    tools up to date.


    You will eventually need to join the iOS Developer Program to test your application
    on iOS devices or submit them to the iTunes App Store. For now, we can use Xcode
    to build and test our applications in the simulator. This is a great way to get
    started.


    Xcode is an integrated development environment (IDE) specifically designed for
    programming both Mac OS X and iOS. As the name suggests, an IDE is more than just
    a text editor. It is an interconnected suite of tools that helps you organize,
    edit, debug, and otherwise manage all the resources that will go into your final
    program. Through Xcode you can visually lay out the user interface, test run your
    program in an iOS simulator, step through your code one command at a time, analyze
    your application''s performance, and more.


    > NOTE: The projects in this book were developed using Xcode 4.2 and iOS SDK 5.0.
    Later versions will undoubtedly vary somewhat from what is shown. Menu options
    and project templates may change. More rarely, updates to the SDK can affect how
    your projects compile and run. If you are using a newer version of either Xcode
    or the SDK, everything should still work, but be prepared to do a little digging
    and exploration on your own.


    Once you have downloaded and installed Xcode (at almost 4 GB, this will require
    a bit of patience), launch it and let''s get started.'
