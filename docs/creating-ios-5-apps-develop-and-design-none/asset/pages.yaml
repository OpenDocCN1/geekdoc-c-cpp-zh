- pgno: 548
  md: 'Finally, we modify the scheme to use the correct build configuration. In most
    cases, I actually prefer to create a new scheme specifically for distribution
    builds. Archive the app. Then from the Organizer''s Archives tab, we can validate
    and submit our app.


    Remember that all applications submitted to the iTunes App Store must follow both
    the App Store Review Guidelines and the Human Interface Guidelines. Reviews are
    typically performed within seven days, and you can monitor the status from iTunes
    Connect. Good luck.


    # ## WRAPPING UP


    This chapter covered a broad range of topics. If it didn''t answer all your questions,
    I hope it at least pointed you in the right direction and helped you find the
    solutions you need.


    And that''s all for the book. I hope the information has proven useful. However,
    the fun doesn''t end here. Check out the book''s website at freelancemadscience.com/book/
    for two bonus chapters—additional material that we just couldn''t squeeze in between
    this book''s covers.


    Bonus Chapter A, “From iPhone to iPad,” covers the differences in developing for
    the iPad. We also convert Health Beat into a Universal application, capable of
    running on both platforms. Bonus Chapter B, “Other Tools of the Trade,” discusses
    the tools, tips, and techniques behind source control, unit testing, performance
    testing, and debugging.


    The website also hosts the book''s FAQs and errata, as well as a forum for discussion.
    Please stop by and leave your questions or comments. I look forward to continuing
    the conversation with you online.'
  merge: -1
  img_proc: true
