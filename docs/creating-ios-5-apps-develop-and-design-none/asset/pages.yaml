- pgno: 451
  md: '# INTRODUCING GRAVITYSCRIBBLER


    ![](img/fe9fea534a8e7868f811f7cd33da015f_451_0.png)


    **FIGURE 8.1** GravityScribbler in action


    This chapter is going to be somewhat different from the rest of the book. We’re
    going to take a break from our Health Beat application to examine a number of
    advanced topics: from custom view hierarchies and animation to motion detection
    and geotagging. Since most of these topics cannot be easily shoehorned into our
    existing application, we will look at a new, immersive application: GravityScribbler.


    GravityScribbler is a simple drawing application (**Figure 8.1**). It begins with
    a cursor in the center of the screen, and the user can direct the cursor by tipping
    and tilting their phone. The cursor will roll downhill, drawing a line behind
    it. The user can also utilize an assortment of gestures to control the application.
    A single-finger horizontal pan will control the cursor’s speed. A two-finger touch
    will pause and restart the application, while a three-finger swipe will drag out
    the export menu. Finally, shaking the phone clears the current drawing, letting
    the user start over.


    Unlike what we’ve done thus far, we won’t go through a step-by-step walk-through
    and build the entire application from scratch. There is just too much ground to
    cover. Instead, we will focus more tightly on the individual topics. If you want
    to see how these topics integrate into a completed application, check out the
    complete source code from http://freelancemadscience.com/source.


    Additionally, since GravityScribbler depends so strongly on touch gestures and
    device motion, we cannot effectively test it in the simulator. You must run it
    on the device itself. This means you must have a valid iOS Developer Program membership,
    as well as the proper provisioning profiles for your device. We examined this
    in detail in the section “Running and Testing on iOS Devices” in Chapter 3.


    Let’s start by looking at techniques for creating a truly custom dynamic user
    interface.'
