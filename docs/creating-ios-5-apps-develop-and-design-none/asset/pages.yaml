- pgno: 265
  md: 'default, the macro evaluates the expression. If the result is false, NSAssert
    throws an NSInternalInconsistencyException, using the string in the error message.


    NSAsserts can help when debugging, testing, and hardening our code. However, we
    may not want to include these checks in our final release builds. Fortunately,
    we can easily disable these checks. Simply define an NS_BLOCK_ASSERTIONS preprocessor
    macro, and the compiler won’t include the NSAsserts.


    By default, Xcode 4.0 automatically disables NSAsserts when you are making release
    builds. This means we can use as many NSAsserts as we want when developing and
    testing. We don’t need to worry about them adversely affecting our final product.


    Generously sprinkling asserts through your code can greatly help improve your
    application’s reliability. If a method should take only positive numbers, use
    an assert to verify that fact. It’s better to crash the application with a reasonable
    error message than to let it lumber forward in an undefined state.


    Of course, there is some debate about whether it’s better to use Cocoa’s NSAssert
    macro or C’s assert() function. While they largely do the same thing, they have
    two main differences. The assert() method does not take an error string as an
    argument. Using NSAssert with well-defined error messages can make it a lot easier
    to debug your code. On the other hand, assert() is guaranteed to halt your application—NSAssert
    might not.


    NSAssert typically throws an exception, but you can change this behavior by creating
    a custom NSAssertionHandler subclass. In practice, however, this is almost never
    done. More commonly, problems might occur when a third-party library accidentally
    catches and then silently discards your NSInternalInconsistencyException, masking
    the error from you. This means you might have an assert fail but never actually
    see it.


    Personally, I prefer the richer messages afforded by NSAssert. After all, you
    can always set a breakpoint to catch exceptions, so they can’t really hide from
    you—at least, not during development. And, if it becomes a real concern, you can
    always implement a custom NSAssertionHandler to work around the problem.


    Another great source of Internet arguments is the debate over stripping your asserts
    from your release code. Unless they are actively hurting your performance, there
    are good arguments both for taking them out and for leaving them in. I must admit,
    I usually take the path of least resistance. Previous versions of Xcode did not
    automatically strip the NSAsserts; Xcode 4 does. Most of the time, I’m just not
    sufficiently motivated to actually go out and modify the behavior either way.'
  merge: -1
  img_proc: true
