  md: "Once we determine the direction of the swipe, we use that information to set\
    \ the animation type. Specifically, we select an animation sequence that will\
    \ slide our view in from the side, making sure its motion follows the direction\
    \ of our swipe.\n\nNext, we check to see if our canvas view is currently paused.\
    \ If it is, we simply return. We don't want to display any other pop-up views\
    \ while our application is paused. Once this check is passed, we pause our canvas,\
    \ grab a snapshot of our current drawing, and pass both the snapshot and our current\
    \ best orientation to the export view. Finally, we display the pop-up view, using\
    \ the showPopupController: animationType:withCompletionHandler: method we developed\
    \ in the first part of this chapter.\n\nUnlike what we did with the pause menu,\
    \ we do not provide any code for dismissing the pop-up view and restarting the\
    \ canvas here. Our export menu must handle those tasks when an export item is\
    \ selected.\n\nNow let's add the one-finger pan gesture for our acceleration control.\
    \ Add the following code to our viewDidLoad method, after the code that creates\
    \ our swipe gestures.\n\n```\n```objective-c\n// Add 1-finger pan for acceleration.\n\
    UIPanGestureRecognizer* accelerationGesture =\n    [[UIPanGestureRecognizer alloc]\n\
    \        initWithTarget:self\n        action:@selector(accelerationGesture:)];\n\
    accelerationGesture.maximumNumberOfTouches = 1;\n// This can only succeed if we\
    \ definitely don't have a swipe.\n[accelerationGesture requireGestureRecognizerToFail:\n\
    \    swipeToExportDown];\n[accelerationGesture requireGestureRecognizerToFail:\n\
    \    swipeToExportUp];\n[self.view addGestureRecognizer:accelerationGesture];\n\
    ```\n```\n\nHere, we create a pan gesture recognizer and then set it for a single\
    \ touch. Next, we create a dependency between our pan recognizer and our swipe\
    \ recognizers. Both swipe recognizers must fail before a pan gesture can be recognized."
