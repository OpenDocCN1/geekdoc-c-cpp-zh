    # FETCH REQUESTS


    We access our managed objects using NSFetchRequest. At a minimum, our fetch request
    needs an entity description. Traditionally, this involved accessing the entity
    descriptions from our modeled object contexts using the entityForName:inManagedObjectContext:
    and then instantiating our NSFetchRequest object. With iOS 5, we can use the fetchRequestWithEntityName:
    convenience method to create a new fetch request with a single method call. Once
    we have our fetch request, we call the executeFetchRequest:error:, which returns
    an array containing all instances of the named entity, including any sub-entities.


    The fetch will return objects based on their state in the managed object context—even
    if these changes have not yet been saved. This means a fetch will return new objects
    added to the context and will not return any objects deleted from the context.
    Likewise, the system will evaluate predicates based on the object’s in-memory
    state—not its saved state. Of course, if we haven’t yet loaded the objects into
    managed object context, then the fetch request loads them from their persistent
    store (or from the parent context, if it has one).


    We have a lot of control over which objects are returned and how they are organized.
    By adding an NSPredicate to our fetch request, we can set constraints on our request.
    Our fetch request will return only those entities that match our predicate. An
    array of NSSortDescriptors defines the order in which our objects are returned.


    Predicates are a rich and complex topic. Previous versions of Xcode included a
    robust predicate editor to help visually design complex predicates. Unfortunately,
    the predicate builder in Xcode 4 is severely limited by comparison. We can only
    use it for fetch requests, not fetched properties, and we can only use it to create
    a small subset of relatively simple predicates. This means that (at least for
    the time being) if you want to make any moderately complex fetch requests, you
    need to learn how to write your own predicate expressions.


    Basically, a predicate is a logical operator. When the predicate is evaluated
    on an object, it performs the specified comparison and then returns YES or NO.


    We can build our NSPredicate object using a combination of NSComparisonPredicate,
    NSCompoundPredicate, and NSExpression objects; however, it’s usually'
  merge: -1
