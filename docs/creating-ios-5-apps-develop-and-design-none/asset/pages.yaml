- pgno: 165
  md: "Next, we have a method named keyPathsForValuesAffectingWeights. Whenever KVO\
    \ is used to observe a value, the runtime looks for a method named keyPathsForValuesAffecting<key>,\
    \ where <key> is the name of the value being observed. This method, if it exists,\
    \ should return an NSSet containing all the keys that the observed value depends\
    \ upon. Anyone observing <key> will be notified whenever any of the listed values\
    \ are changed. In our case, anyone using KVO to monitor the weights property should\
    \ receive notifications whenever weightHistory changes.\n\nThen we have the accessor\
    \ itself. Here we just return a reference to our weightHistory object. This isn't\
    \ the most bulletproof approach. We could create an immutable copy and return\
    \ that, or we could remove the weights property entirely, creating additional\
    \ indexed accessors as needed. However, this approach is fast, and it does communicate\
    \ our intent. The weightHistory array should never be modified outside the WeightHistory\
    \ class. Given Objective-C's dynamic nature, a determined developer can always\
    \ find ways to break encapsulation and monkey with our internal data, so this\
    \ is probably good enough.\n\nWe still need to initialize our object. Simply override\
    \ the init method, as shown:\n\n```\n```objective-c\n#pragma mark - initialization\n\
    \n- (id)init\n{\n    self = [super init];\n    if (self) {\n        // Set initial\
    \ defaults.\n        _defaultUnits = LBS;\n        _weightHistory = [[NSMutableArray\
    \ alloc] init];\n    }\n    return self;\n}\n```\n```\n\nHere we simply set up\
    \ reasonable initial defaults—creating an empty history list and setting the default\
    \ units to pounds."
  merge: -1
  img_proc: true
- pgno: 166
  md: "OK, let's look at our accessor methods. The @synthesize directive automatically\
    \ creates a default implementation for setDefaultUnits:, but we want to do some\
    \ additional custom processing. Let's implement our own version.\n\n```\n```objective-c\n\
    #pragma mark - accessor methods\n- (void)setDefaultUnits:(WeightUnit)units {\n\
    \    // If we are setting the current value, do nothing.\n    if (_defaultUnits\
    \ == units) return;\n    _defaultUnits = units;\n    // Send a notification.\n\
    \    [[NSNotificationCenter defaultCenter]\n        postNotificationName:\n  \
    \          WeightHistoryChangedDefaultUnitsNotification\n        object:self];\n\
    }\n```\n```\n\nThe setDefaultUnits: method is straightforward. First, we check\
    \ to see if the unit argument is the same as our current default units. If they\
    \ are different, we set the default units and post a notification to the notification\
    \ center.\n\nThis raises an interesting question. Why would we use notifications\
    \ instead of key-value observing? Well, the simplest answer is that I wanted to\
    \ show you both approaches. However, KVO and notifications both have unique strengths\
    \ and weaknesses.\n\nAs long as we are observing KVO-compliant values, KVO doesn’t\
    \ require any actions on the part of the observed object. All the notifications\
    \ are posted automatically. However, on the receiving side, everything is routed\
    \ through the observeValueForKeyPath:ofObject:change:context: method. As you can\
    \ imagine, if you start observing a large number of values, this method can quickly\
    \ become long and hard to read.\n\nThe notification framework, on the other hand,\
    \ gives us more flexibility. Any object registering to receive notifications can\
    \ specify a selector that is called whenever the notification is received. Yes,\
    \ we have to manually post our notifications, but that also gives us the freedom\
    \ to design exactly when and why our notifications are posted."
  merge: -1
  img_proc: true
- pgno: 167
  md: "Next, look at our implementation of `addWeight:` and `removeWeightAtIndex:`.\n\
    \n```\n - (void)addWeight:(WeightEntry*)weight {\n\n     // Manually send KVO\
    \ messages.\n     [self willChange:NSKeyValueChangeInsertion\n     valuesAtIndexes:[NSIndexSet\
    \ indexSetWithIndex:0]\n                    forKey:KVOWeightChangeKey];\n    \
    \ // Add to the front of the list.\n     [self.weightHistory insertObject:weight\
    \ atIndex:0];\n     // Manually send KVO messages.\n     [self didChange:NSKeyValueChangeInsertion\n\
    \     valuesAtIndexes:[NSIndexSet indexSetWithIndex:0]\n                    forKey:KVOWeightChangeKey];\n\
    \ }\n // This will be auto KVO'ed.\n - (void)removeWeightAtIndex:(NSUInteger)weightIndex;{\n\
    \n     // Manually send KVO messages.\n     [self willChange:NSKeyValueChangeRemoval\n\
    \     valuesAtIndexes:[NSIndexSet indexSetWithIndex:weightIndex]\n           \
    \         forKey:KVOWeightChangeKey];\n     // Add to the front of the list.\n\
    \     [self.weightHistory removeObjectAtIndex:weightIndex];\n     // Manually\
    \ send KVO messages.\n     [self didChange:NSKeyValueChangeRemoval\n     valuesAtIndexes:[NSIndexSet\
    \ indexSetWithIndex:weightIndex]\n                    forKey:KVOWeightChangeKey];\n\
    \ }\n```"
