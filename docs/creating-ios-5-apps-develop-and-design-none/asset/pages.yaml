  md: "Now, let's implement the processWeightEntryUsingBlock: method.\n\n```\n```objective-c\n\
    - (void)processWeightEntryUsingBlock:\n(void (^)(WeightEntry*)) block {\n    for\
    \ (WeightEntry* entry in self.entries) {\n        block(entry);\n    }\n}\n```\n\
    ```\n\nAs you can see, we iterate over the array, passing each WeightEntry object\
    \ to the provided block. This is a convenient technique for exposing some access\
    \ to an internal collection. Anyone using our class can iterate over the entire\
    \ array—but they are never given access to the array itself.\n\nFinally, we need\
    \ to add our private helper method, processArray:. This gets a bit long, so let's\
    \ take it in small steps.\n\n```\n```objective-c\n#pragma mark - private methods\n\
    - (void)processArray:(NSArray*)weightEntries {\n    self.entries = weightEntries;\n\
    \    // Handle the edge case where we have no\n    // dates in our array.\n  \
    \  if ([weightEntries count] == 0) {\n        NSDate* date = [NSDate date];\n\
    \        self.startingDate = date;\n        self.endingDate = date;\n        self.duration\
    \ = 0.0f;\n        self.minWeight = 0.0f;\n        self.maxWeight = 0.0f;\n  \
