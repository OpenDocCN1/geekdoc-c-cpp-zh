- pgno: 175
  md: "# THE SECRET LIFE OF NIBS\n\nNibs are the underlying technology behind storyboards.\
    \ The compiler will break the storyboard into a number of nib files, loading them\
    \ as necessary. Therefore, to understand what happens when a storyboard loads\
    \ a scene, we really need to understand the lifecycle of the underlying nibs.\
    \ I give a brief summary here, but for the full blow-by-blow details, check out\
    \ Apple’s Resource Programming Guide: Nib Files.\n\nWhen a nib loads, memory is\
    \ set aside for all the objects and resources inside the nib, and then the entire\
    \ object graph is instantiated. Objects that conform to the NSCoder protocol will\
    \ be instantiated by calling initWithCoder:. All other objects are instantiated\
    \ by calling init.\n\nAll outlets are then connected using the setValue:forKey:\
    \ method. All actions are connected using addTarget:action:forControlEvents:.\
    \ Once the entire object graph is created, UIKit calls awakeFromNib on each of\
    \ the objects created by the nib. You can implement an object’s awakeFromNib method\
    \ to perform any additional configuration steps after all the outlets and actions\
    \ are properly configured.\n\nNote: UIViewController subclasses should do their\
    \ additional configuration in viewDidLoad instead. The controllers may be created\
    \ in a different nib than their views. As a result, the awakenFromNib method may\
    \ be called before the view has loaded, and any outlets connecting to user interface\
    \ elements in the view’s nib may not be properly set up yet.\n\nAfter the nib\
    \ has finished loading, any objects that are not stored in a strong reference\
    \ somewhere will be deallocated. Most of the time, we won’t need to worry about\
    \ this. Unless we’re programmatically loading the scene ourselves, the system\
    \ will automatically store the view controller in our view controller hierarchy\
    \ (e.g., in the navigation stack or as a modal view controller). The main view\
    \ is stored in the view controller, and any other user interface elements and\
    \ gesture recognizers are automatically stored in their containing view.\n\nHowever,\
    \ if we add any new top-level objects (data objects or views not yet placed into\
    \ the view hierarchy), we will need to store a reference to them somewhere. Typically,\
    \ this means creating an outlet in our view controller and connecting the object\
    \ to that outlet.\n\nThere are a few key points here that are worth emphasizing:\n\
    \n+   1. Many of the details of how nibs are loaded are different on Mac OS X\
    \ and iOS. If you are moving back and forth between desktop and mobile development,\
    \ be sure to double-check the documentation.\n+   \n+   2. Any object that conforms\
    \ to NSCoder will be loaded using initWithCoder:. Unlike other init methods, this\
    \ does not end up calling your designated initializer. If you are loading custom\
    \ objects (including UIViewController subclasses) in your nibs, be sure to perform\
    \ all additional initialization steps in the awakeFromNib method (or viewDidLoad\
    \ for UIViewController subclasses).\n+   \n+   3. If you add a top-level object,\
    \ be sure to add an outlet for it in your view controller. We need a strong reference\
    \ to the top-level object, otherwise it will disappear after the nib loads."
  merge: -1
  img_proc: true
- pgno: 176
  md: '# THE SECRET LIFE OF NIBS (continued)


    +   4. UIViewController subclasses will automatically unload and reload their
    nibs as part of regular memory management. You cannot assume that a nib will only
    be loaded once. Similarly, you cannot assume that the controller’s viewDidLoad
    method will only be called once.


    +   5. Any outlets set by the nib should be cleared in viewDidUnload. Similarly,
    anything you do in viewDidLoad should be undone in viewDidUnload. For example,
    if you assign an object to a property in viewDidLoad, be sure to set the property
    to nil in viewDidUnload. If the view loads again, we’ll reset the property anyway.
    There’s no sense in holding onto memory that we’re not currently using.


    # WRAPPING UP


    Our app builds and launches. We can switch between the three tabs. Yes, it’s just
    a skeleton—but the next few chapters will put some meat on these bones. In Chapter
    4, we will flesh out the EnterWeightView and HistoryView. In Chapter 5, we will
    look at drawing custom views with the GraphView, and in Chapter 6, we will save
    both the application data and the user defaults. Finally, in Chapter 7, we will
    replace Health Beat’s current model using Core Data.


    One last step before we go. Let’s commit our changes to the git repository. It’s
    best to get into the habit of committing changes early and often. That way we
    can compare our current files with any of the previously committed versions, and
    if we have to roll back our changes, we can minimize the amount of work we’re
    undoing. It’s always better to have a large number of small, incremental steps
    than to have a few giant strides. Besides, the more commits you have, the more
    useful version control becomes.


    To commit all our changes, go to File > Source Control > Commit. Enter Chapter
    3 as the commit message, and click Commit. That’s it. Xcode should take care of
    the rest.'
