- pgno: 12
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_12_0.png)


    # XCODE


    Xcode provides an integrated development environment, giving us a wide range of
    tools to both create and manage our projects. It handles everything from running
    and debugging our code to designing our UI and data models. As iOS developers,
    we will spend most of our time in Xcode. Having a well-grounded understanding
    of its features is essential to our success.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_12_1.png)


    # iOS SIMULATOR


    The iOS Simulator application lets us run, debug, test, and profile our code directly
    on a Mac. While the simulator will never replace testing on an actual device,
    it has a number of advantages. For example, developers can begin using the simulator
    before they join the iOS Developer Program. It’s also easier and faster to run
    quick tests in the simulator, letting us perform rapid develop/test/iterate cycles
    as we add new features to our applications.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_12_2.png)


    # INSTRUMENTS


    Apple’s premier profiling tool, Instruments lets us dynamically trace and analyze
    code running either in the simulator or directly on an iOS device. It lets us
    track and record everything from object allocations and timer-based samples to
    file access and energy use. It also provides the tools necessary for sifting through
    and analyzing the data that it generates. In experienced hands, Instruments can
    help us to fix bugs and polish our code.'
  merge: -1
  img_proc: true
