- pgno: 514
  md: "Finally, we need to set the location manager's purpose property. This is our\
    \ chance to explain to the user why our application needs access to location services.\
    \ It will be displayed when the system asks the user for permission to use location\
    \ services.\n\n**NOTE:** When using location services, the initial update may\
    \ not have the desired accuracy. This is particularly true when requesting high-accuracy\
    \ data. Core Location will calculate an initial estimate as quickly as possible\
    \ and then refine the estimate as additional information comes in.\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_514_0.png)\n\
    \nOnce everything is configured properly, we start generating location updates.\n\
    \n```\n```objective-c\n- (void)cancelSearch {\n    [self.manager stopUpdatingLocation];\n\
    \    self.done = YES;\n}\n```\n```\n\nBy comparison, our cancel method is dead\
    \ simple. We turn off location updates, and then we set our done property to YES.\n\
    \n```\n```objective-c\n- (void)getLocationWithCompletionHandler:\n    (void (^)(CLLocation*\
    \ location))completionHandler {\n    self.callbackBlock = completionHandler;\n\
    \    // If we've already found a location (or an error).\n    if (self.done) {\n\
    \        [self dispatchCallbackAndStopSearching];\n    }\n}\n```\n```\n\nThis\
    \ should also be relatively straightforward. If we already have a location update,\
    \ we'll call our callback immediately. To do this, we start by saving a reference\
    \ to our callback block. If we're done, we go ahead and call dispatchCallbackAndStopSearching.\
    \ If not, we keep waiting."
