  md: "# FINISHING THE CONTROLLER\n\nOpen GraphViewController.m. Let’s start by importing\
    \ our GraphView class. We also need to add string constants for observing our\
    \ weight list and units.\n\n```\n#import \"GraphViewController.h\"\n#import \"\
    GraphView.h\"\n#import \"WeightHistory.h\"\nstatic NSString* const WeightKey =\
    \ @\"weights\";\nstatic NSString* const UnitsKey = @\"defaultUnits\";\n```\n\n\
    Next, uncomment the viewDidLoad method and make the following changes:\n\n```\n\
    - (void)viewDidLoad\n{\n    [super viewDidLoad];\n    id graphView = self.view;\n\
    \    [graphView setWeightEntries:self.weightHistory.weights\n                \
    \       andUnits:self.weightHistory.defaultUnits];\n    // Watch weight history\
    \ for changes.\n    [self.weightHistory addObserver:self\n                   \
    \      forKeyPath:WeightKey\n                            options:NSKeyValueObservingOptionNew\n\
    \                            context:nil];\n    [self. weightHistory addObserver:self\n\
    \                          forKeyPath:UnitsKey\n                             options:NSKeyValueObservingOptionNew\n\
    \                             context:nil];\n}\n```\n\nFirst, we grab a reference\
    \ to our custom view and set the view’s weight entries and default units."
