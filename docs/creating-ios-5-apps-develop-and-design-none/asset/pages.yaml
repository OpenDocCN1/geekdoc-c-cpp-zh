  md: "Finally, in the @implementation block, implement the following methods:\n\n\
    ```\n```objectivec\n+ (SampleSingleton*)sharedSampleSingleton {\n    static SampleSingleton*\
    \ sharedSingleton;\n    static dispatch_once_t onceToken;\n    dispatch_once(&onceToken,\
    \ ^{\n        sharedSingleton = [[SampleSingleton alloc]\n                   \
    \         initSharedInstance];\n    });\n    return sharedSingleton;\n}\n\n//\
    \ Private Designated Initializer.\n- (id)initSharedInstance {\n    self = [super\
    \ init];\n    if (self) {\n        // Do initialization here.\n    }\n    return\
    \ self;\n}\n\n// Override the superclass's designated initializer to prevent\n\
    // its use.\n// Calling this method will throw an exception.\n- (id)init {\n \
    \   [self doesNotRecognizeSelector:_cmd];\n    return nil;\n}\n```\n```"
