  md: "# USING NSAssert\n\n> NSAssert has a number of variants that can take a format\
    \ string, similar to NSLog(). Here, we simply append a number to the end of the\
    \ macro's name, indicating the number of arguments passed into our string. For\
    \ example, in the drawSingleEntryTrendLine method, we use NSAssert2 and then pass\
    \ in two arguments.\n> \n> However, as long as asserts are enabled, you can use\
    \ the standard NSAssert macro with a format string and a variable-length list\
    \ of arguments. Unfortunately, once you disable asserts, the variable-length arguments\
    \ cause compilation errors (at least in Xcode 4.0). It's therefore easier and\
    \ safer to use the numbered variants.\n\n```\n// Find the center of the screen.\n\
    CGFloat x = self.bounds.size.width / 2.0f;\nCGFloat y = self.bounds.size.height\
    \ / 2.0f;\nCGFloat weight = self.graphStats.minWeight;\n```\n\nAfter passing the\
    \ sanity check, we generate some useful values. We calculate the x- and y-coordinates\
    \ for the center of the graph view. Then we grab the weight value. Since we only\
    \ have one value, we can just use the GraphStats minimum weight—there's no need\
    \ to access the individual WeightEntry objects.\n\n```\nNSString* label =\n  \
    \  [WeightEntry stringForWeightInLbs:weight inUnit:self.units];\nUIFont* font\
    \ = [UIFont boldSystemFontOfSize:self.fontSize];\nCGSize textSize = [label sizeWithFont:font];\n\
    [self drawReferenceLineWithLabel:label\n                           font:font\n\
    \                            atY:y\n              withTextWidthOffset:textSize.width];\n\
    ```"
