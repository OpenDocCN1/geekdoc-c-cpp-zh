- pgno: 263
  md: '# DRAWING FOR THE RETINA DISPLAY


    As you probably know, the iPhone 4’s Retina display has a 960 x 640 display. This
    is four times the number of pixels as the earlier models. This could result in
    a lot of complexity for developers—where we have to constantly test for the screen
    size and alter our drawing code to match. Fortunately, Apple has hidden much of
    this complexity from us.


    All the native drawing functions (Core Graphics, UIKit, and Core Animation) use
    a logical coordinate system measured in points. A point is approximately 1/160
    of an inch. It’s important to note that these points may or may not be the same
    as the screen’s pixels. Draw a 1-point-wide line on an iPhone 3GS, and you get
    a 1-pixel-wide line. Draw the same line on an iPhone 4, and it is now 2 pixels
    wide. This also means a full-screen frame is the same size on the iPhone 3GS and
    the iPhone 4: 320 points by 480 points.


    A device’s scale factor gives us the conversion between points and pixels. You
    can access the scale property from the UIScreen, UIView, UIImage, or CALayer classes.
    This allows us to perform any resolution-dependent processing. However, we actually
    get a lot of support for free.


    +   - All standard UIKit views are automatically drawn at the correct resolution.

    +   - Vector-based drawings (e.g., UIBezierPath, CGPathRef, and PDFs) automatically
    take advantage of the higher resolution to produce smoother lines.

    +   - All text is automatically rendered at the higher resolution.


    There are, however, some steps we still need to take to fully support multiple
    screen resolutions. One obvious example occurs when loading and displaying images
    and other bitmapped art. We need to create higher-resolution copies of these files
    for the Retina display. Fortunately, UIKit supports automatically loading the
    correct resolution, based on the image name.


    Let’s say you have a 20-pixel by 30-pixel image named stamp.png. You need to create
    a higher-resolution version of this image (40 pixels by 60 pixels), and save it
    as stamp@2x.png. Add both images to your project. Now, just load the image using
    the following code:


    ```

    ```objc

    UIImage* stampImage = [UIImage imageNamed:@"stamp"];

    ```

    ```


    UIKit will automatically load the correct version for your device.


    Similarly, if we are creating bitmaps programmatically, we will want to make sure
    we give them the correct scale factor. The UIGraphicsBeginImageContext function
    creates a bitmap-based graphics context with a 1.0 scale factor. Instead, use
    the UIGraphicsBeginImageContextWithOptions function, and pass in the correct scale
    (which you can access by calling [[UIScreen mainScreen] scale]).'
  merge: -1
  img_proc: true
- pgno: 264
  md: "Core Animation layers may also need explicit support. Whenever you create a\
    \ new CALayer (one that is not already associated with a view), it comes with\
    \ a default scale value of 1.0. If you then draw this layer onto a Retina display,\
    \ it will automatically scale up to match the screen. You can prevent this by\
    \ manually changing the layer’s scale factor and then providing resolution-appropriate\
    \ content.\n\nFinally, OpenGL ES also uses a 1.0 scale by default. Everything\
    \ will still draw on the Retina display, but it will be scaled up and may appear\
    \ blocky (especially when compared to properly scaled drawings). To get full-scale\
    \ rendering, we must increase the size of our renderbuffers. This, however, can\
    \ have severe performance implications. Therefore, we must make these changes\
    \ manually. Changing a view’s contentScaleFactor will automatically alter the\
    \ underlying CAEAGLLayer, increasing the size of the renderbuffers by the scale\
    \ factor.\n\nIt is also important to test your drawing code on all the devices\
    \ you intend to support. Drawing a 0.5-point-wide line may look fine on an iPhone\
    \ 3GS but appear too thin on an iPhone 4. Similarly, higher-resolution resources\
    \ use more memory and may take longer to load and process. Still, using a logical\
    \ coordinate system greatly simplifies creating custom drawing code that works\
    \ across multiple resolutions.\n\n# ## DRAWING A SINGLE-ENTRY TREND LINE\n\nNow\
    \ we need to implement our helper methods. Let’s start by drawing a dot when we\
    \ only have a single entry. This also works when we don’t have any entries at\
    \ all, since the GraphStats will return a duration of 0.0 and a weight of 0.0f.\n\
    \n```\n~~~objc\n- (void)drawSingleEntryTrendLine {\n    NSAssert2(self.graphStats.minWeight\
    \ ==\n    self.graphStats.maxWeight,\n              @\"If there's only one entry\
    \ the minimum weight \"\n              @\"(%1.2f) should equal the maximum (%1.2f)\"\
    ,\n              self.graphStats.minWeight, self.graphStats.maxWeight);\n~~~\n\
    ```\n\nWe start with a quick sanity check. We should only call the drawSingleEntryTrendLine\
    \ method when the GraphStats object has zero or one WeightEntries. In either case,\
    \ the minimum and maximum weights should have the same value.\n\nWe can use NSAssert\
    \ (and its variants) to verify this assumption. NSAssert takes two arguments:\
    \ the first is an expression, the second is an NSString. By"
