- pgno: 65
  md: "# # ENUMERATIONS\n\nLet’s say we want to represent the days of the week in\
    \ our code. We could use strings and spell out the words. While this approach\
    \ works, it has several problems. First, it requires extra memory and computational\
    \ effort just to store and compare days. Furthermore, string comparison is tricky.\
    \ Do Saturday, saturday, and SATURDAY all represent the same day? What if you\
    \ misspell the name of a day? What if you enter a string that doesn’t correspond\
    \ to any valid day? One alternative is to manually assign an unsigned char value\
    \ for each day. In this example, the const keyword tells the compiler that these\
    \ values cannot be changed after they have been initialized.\n\n```\n    const\
    \ unsigned char SUNDAY = 0;\n    const unsigned char MONDAY = 1;\n    const unsigned\
    \ char TUESDAY = 2;\n    const unsigned char WEDNESDAY = 3;\n    const unsigned\
    \ char THURSDAY = 4;\n    const unsigned char FRIDAY = 5;\n    const unsigned\
    \ char SATURDAY = 6;\n    const unsigned char HUMPDAY = WEDNESDAY;\n```\n\nThis\
    \ works, but there’s no way to refer to the set of days as a group. For example,\
    \ you cannot specify that a function’s argument needs to be a day of the week.\
    \ That brings us to enumerations. Enumerations provide a concise, elegant method\
    \ for defining a discrete set of values. For example, our days of the week could\
    \ be:\n\n```\n    typedef enum {\n        SUNDAY,\n        MONDAY,\n        TUESDAY,\n\
    \        WEDNESDAY,\n        THURSDAY,\n        FRIDAY,\n        SATURDAY\n```"
  merge: -1
  img_proc: true
