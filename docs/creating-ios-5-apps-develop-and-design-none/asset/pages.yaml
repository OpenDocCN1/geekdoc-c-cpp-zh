- pgno: 464
  md: 'While this more or less works, it creates a few problems. First and foremost,
    iOS expects both the views and the view controllers to be in well-formed hierarchies.
    The system uses the view controller hierarchy to pass along a number of appearance
    and rotation messages, including viewWillAppear:, viewDidAppear:, viewWillDisappear:,
    viewDidDisappear:, willRotateToInterfaceOrientation:duration:, willAnimateRotationToInterfaceOrientation:duration:,
    and didRotateFromInterfaceOrientation:.


    Having an invalid controller hierarchy usually doesn''t create an immediately
    obvious problem. Rather, issues begin to crop up much later in the development
    cycle. At that point, the bugs can be very difficult to resolve.


    In iOS 5, Apple deals with this issue by providing an enhanced UIViewController
    class, letting us subclass it to make our own view controller containers. They
    have also formalized the timing of method calls when views appear and disappear,
    as well as explicitly defining their expectations for view and view controller
    hierarchies.


    When creating a view controller container, we must perform all of the following
    steps to add a new child view controller.


    +   1. Add the subview controller to the container by calling addChildViewController:.
    This will automatically trigger a call to the child view controller''s willMoveToParentController:
    method.

    +   2. In general, the container view should set the subview''s frame to define
    where it should appear, how large it should be, and so on.

    +   3. Add the subview to the container''s view by calling addSubview:. This will
    automatically trigger the calls to viewWillAppear: (before adding the view) and
    viewDidAppear: (after adding).

    +   4. Perform any animation accompanying the view''s appearance.

    +   5. When done, call the subview controller''s didMoveToParentViewController:
    method. The subview controller is now properly attached to the container.


    Removing the child controller follows a similar series of steps:


    +   1. Call the subview controller''s willMoveToParentViewController: method,
    passing in nil as an argument.

    +   2. Perform any animation accompanying the view''s disappearance.'
  merge: -1
  img_proc: true
- pgno: 465
  md: '+   3. Remove the subview from the container’s view by calling the subview’s
    `removeFromSuperview` method. This will trigger `viewWillDisappear:` and `viewDidDisappear:`
    before and after the view is actually removed from the view hierarchy.


    +   4. Remove the subview controller from the container by calling the subview
    controller’s `removeFromParentViewController:` method. This will automatically
    call the subview controller’s `didMoveToParentViewController:` method, passing
    in nil as an argument.


    As we will see, UIView’s transition... methods can be used to combine some of
    these steps (particularly adding a new view, removing an old view, and any state
    change animations). However, in general, you must follow all of the above steps
    to create a valid view controller hierarchy.


    **NOTE:** Some of these methods should only be called within our container controller
    subclass. In particular, `addChildViewController:` and `removeFromSuperview` should
    only be called internally within our container. We must provide our own wrapper
    methods to add and remove the subview controller as necessary. As a corollary,
    we should never call `addChildViewController:` on another view controller—as it
    is undoubtedly not prepared to handle the new view controller appropriately.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_465_0.png)


    Apple still recommends using their pre-built container view controllers whenever
    possible. However, custom containers provide an excellent method for customizing
    an application’s flow. In GravityScribbler, we will use a custom container to
    display pop-up messages in response to different gestures from the user.


    We will start by creating a UIViewController subclass, GSRootViewController. As
    the name suggests, this will act as the root view for our application. It will
    contain both our canvas and our pop-ups as child view controllers.'
  merge: -1
  img_proc: true
- pgno: 466
  md: "# # MANAGING THE CANVASVIEWCONTROLLER\n\nLet’s start by creating a property\
    \ to hold our CanvasViewController. We’ll then write a custom setter to properly\
    \ set up our canvas.\n\n```\n```objc\n#pragma mark - Background View Controller\n\
    - (void)setCanvasViewController:(CanvasViewController *)\ncanvasViewController\
    \ {\n    // If we are passing in the same background view, do nothing.\n    if\
    \ ([canvasViewController isEqual:_canvasViewController])\n        return;\n  \
    \  // Make it the same size as our current view.\n    canvasViewController.view.frame\
    \ = self.view.bounds;\n    // Then swap views.\n    [self addChildViewController:canvasViewController];\n\
    \    [self.canvasViewController willMoveToParentViewController:nil];\n    [self\n\
    \    transitionFromViewController:_canvasViewController\n    toViewController:canvasViewController\n\
    \    duration:1.0f\n    options:UIViewAnimationOptionTransitionCurlUp\n    animations:^()\
    \ {/* Do nothing */}\n    completion:^(BOOL finished)\n    {\n        [canvasViewController\
    \ didMoveToParentViewController:self];\n        [_canvasViewController removeFromParentViewController];\n\
    \        _canvasViewController = canvasViewController;\n    }];\n}\n```\n```"
