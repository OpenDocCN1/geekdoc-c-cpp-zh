- pgno: 14
  md: 'Before you can master any skill, you must first become comfortable with the
    tools. In this chapter, we will learn how to use Xcode, the primary development
    tool for iOS applications. We will start by using Xcode to create a new project
    from the Utility Application project template. We will then examine the files
    produced by this template, studying how the different pieces of a typical iOS
    application fit together. Once we are familiar with the template, we will expand
    it, using Xcode’s graphical interface editor to add controls and to draw connections
    between these controls and their actions. This exercise will provide a solid foundation
    for working on the more complex projects in later chapters.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_14_0.png)'
