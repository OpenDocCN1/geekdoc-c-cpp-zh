  md: 'worry if you don’t understand what many of these rules refer to—most rarely
    occur during day-to-day coding. The important thing is that the compiler will
    enforce all of these rules, and breaking them will generate errors. This makes
    the problems easy to find and fix.


    All the rules are listed here


    +   - Don’t use object pointers in C structs. Instead, create an Objective-C class
    to hold the data.

    +   - Don’t create a property with a name that begins with “new.”

    +   - Don’t call the dealloc, retain, release, retainCount, or autorelease methods.

    +   - Don’t implement your own retain, release, retainCount, or autorelease methods.
    You can implement dealloc, but it’s usually not necessary.

    +   - When implementing dealloc in ARC, don’t call [super dealloc]. The compiler
    handles this automatically.

    +   - Don’t use NSAutoreleasePool objects. Use the new @autoreleasepool{} blocks
    instead.

    +   - In general, don’t cast between id and void*. You must use augmented casts
    or macros when moving data between Objective-C objects and Core Foundation types
    (see the next section).

    +   - Don’t use NSAllocateObject or NSDeallocateObject.

    +   - Don’t use memory zones or NSZone.


    # ARC AND TOLL-FREE BRIDGING


    First, it’s important to realize that ARC applies only to Objective-C objects.
    If you are allocating memory for any C data structures on the heap, you must still
    manage that memory yourself.


    Real problems start to crop up when using Core Foundation data types. Core Foundation
    is a low-level C API that provides a number of basic data management and OS services.
    There is also a similar Objective-C framework named Foundation (are you confused
    yet?). Not surprisingly, Foundation and Core Foundation'
