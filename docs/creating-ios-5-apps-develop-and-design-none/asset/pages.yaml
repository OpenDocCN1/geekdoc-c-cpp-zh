    Developer Guide. For now, let’s move on and create our UIDocument subclass.


    # CREATING A UIDOCUMENT SUBCLASS


    In our case, saving our model really means saving our WeightHistory object. Obviously,
    we want to take advantage of iCloud storage—and the easiest way to do that is
    to use a UIDocument. Fortunately, we can make WeightHistory a subclass of UIDocument
    with a minimum of fuss.


    Open WeightHistory.h and modify our interface declaration as shown:


    ```

    @interface WeightHistory : UIDocument

    ```


    Here, we just change our WeightHistory’s subclass from NSObject to UIDocument.
    While we’re at it, go ahead and remove the defaultUnits property. After all, we’re
    going to move that to NSUserDefaults eventually. That’s it. Of course, the implementation
    file will take a bit more work.


    Open WeightHistory.m and clean things up a bit. We need to remove all traces of
    our defaultUnits property. Delete the line to @synthesize defaultUnits as well
    as deleting the entire setDefaultUnits: method.'
