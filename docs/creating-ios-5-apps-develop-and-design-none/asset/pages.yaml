  md: "There’s one last step. Modify shouldAutorotateToInterfaceOrientation: so that\
    \ it returns YES, allowing us to rotate into any orientation.\n\n```\n```objc\n\
    - (BOOL)shouldAutorotateToInterfaceOrientation:\n    (UIInterfaceOrientation)interfaceOrientation\n\
    {\n    return YES;\n}\n```\n```\n\n# ## DISPLAYING TEXTUAL OUTPUT\n\nThere are\
    \ a number of different ways we could display textual output in iOS. We have already\
    \ seen two: UILabels and UITextFields. These are useful when you’re displaying\
    \ relatively short pieces of text in a more-or-less static layout. The UITextView\
    \ gives us a little more flexibility, letting us enter multi-line blocks of text.\
    \ Like the others, we can set the font type, size, and text color. However, we\
    \ must use the same settings for the entire text view.\n\nWhat if we want more-complex\
    \ text? Something with headers and body text? Something that uses bolds, italics,\
    \ and different colors to draw and focus attention? After all, the Mac has historically\
    \ had great text-layout capabilities. In the ’90s, the Mac was at the forefront\
    \ of the desktop publishing revolution. Therefore, you would expect iOS would\
    \ have inherited some of this tradition. Unfortunately, there seems to be an odd\
    \ gap in the technology here.\n\nThere are a number of different technologies,\
    \ each with their own strengths and weaknesses. Some, like NSString’s UIStringDrawing\
    \ category, provide useful methods for drawing strings onto the screen—but like\
    \ the UILabels and UITextFields, these are really only suited for short labels.\
    \ The Core Animation CATextLayer and Core Graphics text support also fall into\
    \ this category—useful for some corner cases, but not a general solution.\n\n\
    To do real formatted text, we have two main options: use a UIWebView or build\
    \ it ourselves using the Core Text framework.\n\n*continues on next page*"
