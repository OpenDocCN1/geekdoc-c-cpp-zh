- pgno: 269
  md: "```\n```objc\ntopTextSize.width: bottomTextSize.width;\n\n[self drawReferenceLineWithLabel:topLabel\n\
    \                           font:font\n                           atY:topY\n \
    \                          withTextWidthOffset:textOffset];\n[self drawReferenceLineWithLabel:bottomLabel\n\
    \                           font:font\n                           atY:bottomY\n\
    \                           withTextWidthOffset:textOffset];\n```\n```\n\nNext,\
    \ we create our weight labels for the top and bottom reference lines. As stated\
    \ earlier, the top line will be our maximum weight, while the bottom will be our\
    \ minimum weight. We then calculate the size of each of these.\n\nHere we use\
    \ C’s ternary conditional operator to determine the maximum width (see “Operators”\
    \ in Chapter 2). This expression says that if the top width is greater than the\
    \ bottom width, we use the top width. Otherwise we use the bottom.\n\nFinally,\
    \ we call our helper method to draw the two reference lines. Notice that we use\
    \ the same textOffset for both of them.\n\n```\n```objc\nCGFloat startX = self.margin\
    \ * 4 + textOffset;\nCGFloat endX = self.bounds.size.width - (self.margin * 3);\n\
    UIBezierPath* trendLine = [UIBezierPath bezierPath];\ntrendLine.lineWidth = self.trendLineWidth;\n\
    trendLine.lineCapStyle = kCGLineCapRound;\ntrendLine.lineJoinStyle = kCGLineJoinRound;\n\
    // Get starting point.\nCGRect graphBounds =\n    CGRectMake(startX, topY, endX\
    \ - startX, bottomY - topY);\n```\n```\n\nHere, we want to make sure the graph\
    \ starts well to the right of our labels. So, we utilize our textOffset variable\
    \ and our margin property to calculate the starting and ending x-coordinates."
