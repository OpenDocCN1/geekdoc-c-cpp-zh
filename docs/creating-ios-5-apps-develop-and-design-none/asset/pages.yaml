    Here, we use our WeightEntry’s stringForWeightInUnit: method to set the weightLabel
    outlet with a correctly formatted weight string. Next, we use NSDateFormatter
    to create a properly localized date string using the short date and short time
    formats. We then assign this to our dateLabel outlet.


    Now, let’s open the storyboard and zoom in on our history view. Select the prototype
    cell and switch to the Identity inspector. Set the cell’s class to HistoryCell.
    Then switch back to the Attributes inspector. Make sure the Accessory attribute
    is set to Disclosure Indicator. This will add a gray chevron on the right side
    of our cell.


    Xcode provides two built-in accessories with very similar functions. Both the
    Disclosure Indicator and the Detail Disclosure indicate that the application has
    additional information related to this row. However, there are slight differences,
    both in the way they operate and in their intended use.


    Detail Disclosure creates a round blue button with a white chevron. When the user
    taps the button, it should navigate to a detail view for the selected item. The
    Disclosure Indicator, on the other hand, just provides the gray chevron image.
    Here, the user must select the row itself, and they are then navigated to a sublist
    (usually containing additional options).


    Arguably, Health Beat should use Detail Disclosure accessories—but I feel that
    having users select the row, not the disclosure button, works better. Besides,
    our detail view is a list (of sorts), so it’s not wholly inappropriate, and even
    Apple isn’t 100 percent consistent with their accessories.


    Now, drag out two labels. Set the first label’s title to Weight. Make it 100 points
    wide, and set the font to 18-pt System Bold. Then drag it until it is vertically
    centered along the cell’s left margin. In the Size inspector, lock its Autosizing
    position to the top and the left side.'
