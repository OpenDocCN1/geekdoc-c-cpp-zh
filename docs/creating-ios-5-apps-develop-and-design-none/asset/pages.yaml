    \ a recognized \"\n                            @\"GSPopupAnimationType\", type];\n\
    \                break;\n        }\n    } completion:^(BOOL finished)\n    {\n\
    \        [controller.view removeFromSuperview];\n        [controller removeFromParentViewController];\n\
    \    }];\n}\n```\n\nHere, we call willMoveToParentViewController: before we start\
    \ the animations. This lets our controller know that it's about to be removed.\
    \ Inside the animation block, we call the appropriate animateDisappear... method\
    \ to change our animatable properties. animateDisappearFade: just sets the view's\
    \ alpha to 0.0f, while the others change the frame, moving the view off the screen.\
    \ Finally, when the animation is complete, we remove the view from its superview\
    \ and call removeFromParentViewController to complete our child view controller's\
    \ removal.\n\n# CUSTOMIZING UIKIT CONTROLS\n\nThe default appearance for iOS's\
    \ controls looks pretty sharp, but sometimes we need something a little different.\
    \ Maybe we want to use a default color scheme for our app. We don't need to go\
    \ full bore and build our own custom controls—we just want to tweak the appearance\
    \ a bit.\n\nFortunately, with iOS 5, UIKit lets us easily customize the appearance\
    \ of many of the built-in controls. In this section, we'll look at using the new\
    \ UIAppearance protocol, as well as using resizable and tiled images for buttons\
    \ and view backgrounds."
