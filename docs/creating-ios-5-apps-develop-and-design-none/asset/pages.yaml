- pgno: 309
  md: '# USING KEYED ARCHIVES


    When using NSKeyedArchiver or NSKeyedUnarchiver, all the objects and values are
    given a key to identify them. These keys must be unique within the scope of the
    current object being saved or loaded. Therefore, if you are creating a public
    class that might be subclassed in the future, you should add a prefix to your
    keys to prevent collisions with any possible future subclasses. Additionally,
    you should avoid starting your keys with $, NS, or UI, since these are used by
    the system. Apple’s documentation recommends appending the full class name to
    the front of the key.


    While the keys add a little complexity, they give us considerable flexibility
    when loading our data. We can load the data in any order and even selectively
    choose which data to load. This gives us better support for forward and backward
    compatibility should our data structure change, letting us easily add or remove
    keyed values from our archives.


    Keyed archives are easy to use. You can store an object hierarchy into an NSData
    object by calling the NSKeyedArchiver''s `archivedDataWithRootObject:` class method.
    You save it to disk by calling `archiveRootObject:toFile:` instead.


    The system will take your root object and call its `encodeWithCoder:` method,
    passing in a properly formatted NSKeyedArchiver object. The keyed archive contains
    a number of methods that you can use to store raw C values (e.g., `encodeBool:forKey:`,
    `encodeInt:forKey:`, and `encodeFloat:forKey:`). It also includes a method for
    encoding other objects, unsurprisingly named `encodeObject:forKey:`. These children
    objects must also adopt the NSCoding protocol. The system then calls their `encodeWithCoder:`
    method, passing along the keyed archive, until the entire object hierarchy is
    saved.


    Unarchiving works the same way. Simply call NSKeyedUnarchiver’s `unarchiveObjectWithData:`
    or `unarchiveObjectWithFile:` method. This will build the object hierarchy, calling
    `initWithCoder:` on each object, and then return the root object.


    The archivers are smart enough to notice when your object graph has multiple references
    to the same object, and they will correctly save or load just one version of the
    object with all the references properly linking to that object. This means we
    can make our object graph as complex as we like. We don’t need to worry about
    loops or circular references.


    However, for the sake of performance, we want to minimize the number of objects
    we save and load. Unless the operations are computationally intense, you should
    manually set, calculate, or create any values that you can, and save and load
    only those values that you absolutely must. If your object graph has multiple
    references to the same object, there is a good chance that you could save and
    load the object once, and assign all the other references manually.'
  merge: -1
  img_proc: true
- pgno: 310
  md: "Here, we simply call the NSKeyedArchiver’s archivedDataWithRootObject: method\
    \ to create our NSData object. The keyed archiver does all the hard work for us.\n\
    \n```\n```objective-c\n- (BOOL)loadFromContents:(id)contents\n              ofType:(NSString\
    \ *)typeName\n               error:(NSError **)outError {\n    self.weightHistory\
    \ =\n    [NSKeyedUnarchiver unarchiveObjectWithData:contents];\n    // Clear the\
    \ undo stack.\n    [self.undoManager removeAllActions];\n    return YES;\n}\n\
    ```\n```\n\nThis is almost as simple. We call NSKeyedUnarchiver’s unarchiveObjectWithData:\
    \ method to convert the NSData object back into our history array. In addition,\
    \ we clear all the undo actions from our undo stack (we will look at undo support\
    \ in the “Enabling Undo Support” section), and we return YES to indicate that\
    \ we have successfully loaded our data.\n\n> **NOTE:** While we use NSKeyedArchiver\
    \ and NSKeyedUnarchiver in this example, NSCoder also has an older set of concrete\
    \ subclasses: NSArchiver and NSUnarchiver. These archives do not use keys to save\
    \ and load their objects and values. Instead, they must load the data in the same\
    \ order they saved it. In general, you should avoid using these whenever possible.\
    \ They have been replaced by the keyed archives for iOS and all versions of Mac\
    \ OS X 10.2 and later.\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_310_0.png)\n\
    \nWe could add additional error checking to these methods (e.g., catching the\
    \ NSKeyedUnarchiver’s NSInvalidArchiveOperationException), but to be honest, all\
    \ the error-prone operations are already managed by the UIDocument class. If we\
    \ have any problems in these methods, it’s undoubtedly due to an error on our\
    \ part—and that’s something we should detect and fix during development. Next\
    \ up, we need to alert our UIDocument superclass whenever our model changes."
