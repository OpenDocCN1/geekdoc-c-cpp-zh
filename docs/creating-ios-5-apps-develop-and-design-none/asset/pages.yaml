- pgno: 503
  md: "Once this is in place, we check to see if our device supports device motion.\
    \ If it does, we set the device motion update interval to 60 updates per second.\
    \ If not, we will just have to use the accelerometer alone, so we set its update\
    \ interval instead.\n\nFinally, we ensure that our operation queue will only execute\
    \ one operation at a time—essentially making it a serial operation queue.\n\n\
    Next, let's add a method to start motion updates. We'll take this method in steps.\n\
    \n```\n```\n#pragma mark - Gravity Updates\n\n- (void) startGravityUpdates {\n\
    \    if (self.motionManager.deviceMotionAvailable) {\n        [self.motionManager\n\
    \         startDeviceMotionUpdatesToQueue:self.updateQueue\n         withHandler:^(CMDeviceMotion\
    \ *motion, NSError *error) {\n             CGPoint location =\n             [self\
    \ addAcceleration:motion.gravity];\n             [self.canvas addLineToPoint:location];\n\
    \             dispatch_async(dispatch_get_main_queue(), ^{\n                 [self.canvas\
    \ updateCanvasUI];\n             });\n         }];\n         }\n     }\n```\n\
    ```\n\nHere we check to see if the device supports device motion. If it does,\
    \ we start the motion updates.\n\nHere we're primarily interested in the acceleration\
    \ data. Typically, accelerometers register both the pull of gravity as well as\
    \ the actual acceleration of the device. Often, we need to separate these two\
    \ signals, using a low-pass filter to focus on the pull of gravity, and a high-pass\
    \ filter for device motion. Fortunately, the device motion sensor fusion algorithm\
    \ uses additional information from the gyros and (if present) the magnetometer\
    \ to automatically separate the device's total acceleration into its gravity and\
    \ user acceleration components.\n\nHere, we simply grab the gravity vector (the\
    \ direction of gravity given the phone's reference frame) and pass it to our addAcceleration:\
    \ method. Then we update the"
  merge: -1
  img_proc: true
- pgno: 504
  md: "canvas UI. Note that the motion update block runs in our operation queue’s\
    \ thread. Therefore, we need to dispatch the UI updates back to the main thread.\n\
    \nAs you can see, using device motion is simple, short, and sweet. Unfortunately,\
    \ if we’re running the app on an iPhone 3GS, an original iPad, or a 3rd generation\
    \ iPod touch, we only have access to the raw accelerometer data. This means we\
    \ have to pull out the gravity signal ourselves.\n\n```\n```objective-c\n} else\
    \ {\n    CGFloat filterFactor = 0.1f;\n    __block CGFloat xAccel = 0.0f;\n  \
    \  __block CGFloat yAccel = 0.0f;\n    [self.motionManager\n        startAccelerometerUpdatesToQueue:self.updateQueue\n\
    \        withHandler:^(CMAccelerometerData* motion, NSError *error) {\n      \
    \      xAccel = (xAccel * (1.0f - filterFactor)) +\n                ((CGFloat)motion.acceleration.x\
    \ * filterFactor);\n            yAccel = (yAccel * (1.0f - filterFactor)) +\n\
    \                ((CGFloat)motion.acceleration.y * filterFactor);\n          \
    \  CMAcceleration gravity;\n            gravity.x = xAccel;\n            gravity.y\
    \ = yAccel;\n            gravity.z = 0.0f;\n            CGPoint location = [self\
    \ addAcceleration:gravity];\n            [self.canvas addLineToPoint:location];\n\
    \            dispatch_async(dispatch_get_main_queue(), ^{\n                [self.canvas\
    \ updateCanvasUI];\n            });\n        }];\n}\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 505
  md: "This code uses a simple low-pass filter to pull out the gravity signal. Each\
    \ update step, we nudge the current gravity value slightly based on our current\
    \ acceleration information. High-frequency changes (like shaking the phone) tend\
    \ to cancel themselves out before they can accumulate enough to have much of an\
    \ effect. Gravity, on the other hand, provides a constant pull that changes relatively\
    \ slowly compared to user-imparted motion. This lets the pull of gravity accumulate\
    \ rapidly, producing a relatively accurate gravity vector.\n\nNote that we only\
    \ need the x- and y-components of our gravity vector. Therefore, we don’t even\
    \ bother to calculate the z-component. Instead, we simply set it to 0.0f. This\
    \ saves us a little computation time on each update.\n\nOnce we have calculated\
    \ our gravity vector, the steps are the same as before. We pass it to addAcceleration:\
    \ and update our UI.\n\nNext, let’s look at the addAcceleration: method.\n\n```\n\
    ```objective-c\n- (CGPoint)addAcceleration:(CMAcceleration)acceleration {\n\n\
    \    // Update velocity.\n\n    CGPoint velocity = self.velocity;\n    velocity.x\
    \ += (CGFloat)acceleration.x * self.accelerationRate;\n    velocity.y -= (CGFloat)acceleration.y\
    \ * self.accelerationRate;\n\n    // Update location.\n\n    CGPoint location\
    \ = self.canvas.currentDrawPoint;\n    location.x += velocity.x;\n    location.y\
    \ += velocity.y;\n    self.velocity = velocity;\n```\n```\n\nWe start by updating\
    \ our cursor’s velocity based on the x- and y-components of the gravity vector.\
    \ We multiply this by our accelerationRate parameter, letting us scale the device’s\
    \ responsiveness.\n\nIt’s worth noting that Core Motion can use a number of different\
    \ reference frames. Here, our gravity vector is given in the device’s reference\
    \ frame. If you’re holding the phone in front of you in portrait orientation,\
    \ x points to the right, y points up, and z points straight ahead through the\
    \ phone’s screen.\n\nThe CMDeviceMotion’s attitude works somewhat differently.\
    \ It gives the device’s orientation in a fixed reference frame. We can select\
    \ the desired reference frame"
  merge: -1
  img_proc: true
- pgno: 506
  md: "when starting motion updates. This is particularly useful for augmented reality\
    \ applications. For example, CMAttitudeReferenceFrameXmagneticNorthZVertical defines\
    \ a reference frame where the z-axis is vertical and the x-axis points toward\
    \ magnetic north. This lets you determine the device's orientation in the real\
    \ world (assuming, of course, your device has a magnetometer).\n\nHowever, for\
    \ our motion updates, we just need to realize that our gravity's reference frame\
    \ is different from our view coordinates. In our view, the y-axis points down\
    \ the screen. In gravity, it points up. We therefore reverse the gravity's y-component\
    \ when calculating our velocity.\n\nOnce we have the current velocity, we simply\
    \ calculate our cursor's next location.\n\n```\n```\n// Get the max bounds.\n\
    CGRect bounds = self.view.bounds;\n// Make sure the cursor cannot leave the screen.\n\
    if (location.x < 0) {\n    location.x = 0;\n    velocity.x *= -0.5f;\n}\nif (location.y\
    \ < 0) {\n    location.y = 0;\n    velocity.y *= -0.5f;\n}\nif (location.x >=\
    \ bounds.size.width) {\n    location.x = bounds.size.width;\n    velocity.x *=\
    \ -0.5f;    }\nif (location.y >= bounds.size.height) {\n    location.y = bounds.size.height;\n\
    \    velocity.y *= -0.5f;\n}\nself.velocity = velocity;\nreturn location;\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 507
  md: "In the second part of the addAcceleration: method, we check to make sure our\
    \ cursor remains within the screen's bounds. If either the x- or y-component is\
    \ out of bounds, we set it to the screen's edge and reverse the velocity along\
    \ that axis. We also reduce the velocity by half. This gives our cursor a nice\
    \ little bounce when it hits the edge of the screen.\n\nFinally, we assign our\
    \ new velocity and return the updated cursor location. Now we just need a method\
    \ to turn off motion updates.\n\n```\n```objc\n- (void)stopGravityUpdates {\n\
    \    // Turn off gravity updates.\n    if (self.motionManager.deviceMotionAvailable)\
    \ {\n        [self.motionManager stopDeviceMotionUpdates];\n    }\n    else {\n\
    \        [self.motionManager stopAccelerometerUpdates];\n    }\n}\n```\n```\n\n\
    Here, we just check to see which type of motion updates we're using and then stop\
    \ the appropriate one.\n\n# ## DEVICE ORIENTATION\n\nAs mentioned earlier, we\
    \ keep our canvas view locked in portrait orientation. There are a couple of reasons\
    \ for this. First, it's easier. As we just saw, our gravity vector comes in the\
    \ device's reference frame. Keeping the view orientation constant makes it easy\
    \ to translate our gravity coordinates to the view coordinates; we just need to\
    \ invert our y-coordinate. However, if we allowed the view to rotate to different\
    \ orientations, we would have to convert the gravity coordinates separately for\
    \ each orientation.\n\nThe biggest problem, however, is simply usability. The\
    \ user will be tilting and tipping their phone as they steer the cursor about\
    \ the screen. We don't want to accidentally rotate the view just because they\
    \ tilted the phone too far in one direction or another."
  merge: -1
  img_proc: true
- pgno: 508
  md: 'However, this gives us a problem. How do we orient our pop-up views when we
    display them? There are two main approaches. The easiest is to simply pick an
    orientation and stick with it. We could, for example, decide that the interface
    will always be used in landscape mode with the home button to the right, and display
    all our pop-ups appropriately.


    This has a few advantages. It''s easy. It''s consistent. And it works particularly
    well when the UI gives the user some indication of the correct orientation from
    the beginning, so they aren''t surprised when a pop-up view appears. However,
    it can cause problems. It''s always a little annoying to launch an app and find
    out that it thinks you''re holding your phone wrong. I don''t mind changing from
    portrait to landscape or from landscape to portrait—but having to change from
    landscape right to landscape left always bothers me.


    This is even worse with the iPad. I find that many iPad cases make it easier to
    hold the device in one particular orientation. What''s worse, the natural orientation
    can vary from case to case (or even from person to person). Running an app that
    forces the user to hold their device in an uncomfortable position won''t win you
    any friends.


    If you''re developing an app that is likely to run while the phone is mounted—for
    example, running music or GPS apps while the phone is placed in a car mount—then
    we probably need to let our app support all possible orientations. After all,
    some mounts may hold the phone in landscape mode. Some will hold it in portrait
    mode. We can''t expect the user to pop the phone out of its mount and rotate it
    around just to use our app.


    So, we probably want to support both landscape orientations. This means that we
    need to try to predict the device''s correct orientation and then use that. In
    our case, we will track orientation changes and record the last landscape orientation.
    This will be our best guess for the current user orientation. We won''t get it
    right 100 percent of the time, but since users typically tilt the phone more vertically
    before using the gesture controls, it works most of the time.


    Now, we could use our current motion updates and the gravity vector to determine
    our interface''s current orientation—but there''s a better way. Let''s step out
    of Core Motion and use a higher-level interface. The UIDevice class can generate
    orientation notifications for us. Here, UIDevice will monitor the device''s motion
    and determine the most likely orientation. These calculations already filter the
    motion data and apply a hysteresis to avoid unexpected changes and rapid flip-flopping
    between'
  merge: -1
  img_proc: true
- pgno: 509
  md: "orientations. We simply need to register to receive the notifications and then\
    \ turn the notifications on. This is done in GSRootViewController's viewDidLoad\
    \ method.\n\n```\n```\n// Catch device orientation changes.\n[[NSNotificationCenter\
    \ defaultCenter]\n addObserverForName:UIDeviceOrientationDidChangeNotification\n\
    \ object:[UIDevice currentDevice]\n queue:nil\n usingBlock:^(NSNotification *note)\
    \ {\n     UIDeviceOrientation orientation =\n     [[UIDevice currentDevice] orientation];\n\
    \     switch (orientation) {\n         case UIDeviceOrientationLandscapeLeft:\n\
    \         case UIDeviceOrientationLandscapeRight:\n             self.bestSubviewOrientation\
    \ = orientation;\n             break;\n         default:\n             // Ignore\
    \ anything else.\n             break;\n     }\n }];\n[[UIDevice currentDevice]\n\
    \    beginGeneratingDeviceOrientationNotifications];\n```\n```\n\nHere, when we\
    \ receive the orientation did change notification, we simply check to see if the\
    \ current orientation is one of the two landscape modes. If it is, we assign it\
    \ to our bestSubviewOrientation property. Otherwise, we ignore it. We can then\
    \ use the bestSubviewOrientation to manually rotate our pop-up views as needed."
  merge: -1
  img_proc: true
- pgno: 510
  md: 'There’s one last set of features we should explore before leaving GravityScribbler.
    We want to let the user export and share their drawings. Now, we’ve already seen
    the first half of this. We know how to create an image from a graphics context.
    So how do we get that image off our device?


    We’ll look at four different options. These are hardly exclusive. There are dozens
    of online photo sharing services, and many of them already produce Objective-C
    frameworks that can be easily added to your applications. However, our list of
    export options will focus on methods that are included in the iOS SDK. These include
    saving the image to your phone’s photo library, sending it as an MMS message,
    attaching it to an email message, or sending it in a tweet.


    # ## SAVING TO THE PHOTO LIBRARY


    There’s an easy way to save images to the photo library. Simply call UIImageWriteToSavedPhotosAlbum().
    That’s it. We’re done here. Move along.


    OK, so there’s a bit more to it than that. UIImageWriteToSavedPhotosAlbum() is
    fine, but it doesn’t give us a lot of control. In our case, it has two problems.
    First, we cannot set the image’s orientation. If we just create an image from
    our graphics context, the resulting UIImage will be a portrait snapshot of the
    screen. We want it to be landscape.


    While we’re at it, it would be nice if we could geotag the image. The phone has
    a GPS unit, after all. Why not add a rough location to the image while saving
    it?


    Fortunately, the Assets Library framework gives us low-level access to all the
    videos and photos managed by our photo library. In our case, it lets us add metadata
    to an image, letting us both change its orientation and add geotagging.


    However, before we can do this, we need to learn how to use Core Location.


    # ## USING CORE LOCATION


    Core Location lets us determine the location and heading of the iOS device. In
    some ways, it is the complement to Core Motion. Core Location tells us about large
    motions—the location of the phone on a map. Core Motion tells us about the phone’s
    orientation and the small-scale motions.


    At its base, Core Location provides us with the latitude, longitude, altitude,
    and heading of our iOS device, along with the accuracy estimates. However, it
