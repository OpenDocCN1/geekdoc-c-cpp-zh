    **FIGURE 7.8** The entity’s Class setting


    # # GENERATING A CUSTOM WEIGHTENTRY CLASS


    We could use the model exactly as it is, but I like creating custom NSManagedObject
    Model subclasses for my entities. Fortunately, Xcode 4 makes this as simple as
    possible. Right-click the Model group, select New File > iOS > Core Data > NSManagedObject
    subclass, and click Next.


    When generating multiple NSManagedObject subclasses, Xcode may try to infer the
    model and entity we wish to implement. Other times it will ask us to specify one
    or both—especially the first time we generate a subclass. In our case, we only
    have one model, so just select WeightEntry. We also only have one entity—but Xcode
    should automatically detect that. In the next page, it will ask us where we want
    to save our files. We aren’t given the chance to name our class, but that’s OK.
    Xcode will use our entity’s name.


    We can just accept the default location; however, let’s select the “Use scalar
    properties for primitive data types” checkbox. This will force Xcode to generate
    scalar properties for our attributes. Click the Create button to continue.


    Xcode now adds a new WeightEntry object to our project. If you select WeightEntry.h,
    you will see that it automatically created properties for all our attributes.
    Now select the Core Data model again. Make sure the WeightEntry entity is selected,
    and open the Data Model inspector (Figure 7.8). Xcode has automatically set our
    entity’s class to our new WeightEntry class.


    Unfortunately, there are two problems with the auto-generated properties. First,
    our original WeightEntry class was immutable; the new version is not. Second,
    Xcode generated a scalar property for our date attribute—we really want it to
    return NSDate. Fortunately, both of these are easy to fix. Open WeightEntry.h,
    and modify the property declarations as shown:


    ```

    ~~~objc

    @property (nonatomic, readonly, retain) NSDate* date;

    @property (nonatomic, readonly) float weightInLbs;

    ~~~

    ```


    Now open the implementation file, and add the following extension:


    ```

    ~~~objc

    @interface WeightEntry()

    @property (nonatomic, readwrite, retain) NSDate* date;

    @property (nonatomic, readwrite) float weightInLbs;

    @end

    ~~~

    ```'
