- pgno: 324
  md: 'Here, we start by creating a coordinated block for both reading and writing
    from the current URL. All the coordinated block methods work similarly. We pass
    in a URL and set some options that define the type of read or write operation
    we’re going to perform, and then we pass it a block. The coordinator makes sure
    the system is in a good state. This may involve asking file presenters in other
    processes to perform their own read or write operations. For example, the NSFileCoordinatorWritingForMerging
    option forces all relevant file presenters to save their changes before the coordinated
    write operation can begin. This helps ensure we have the most recent version of
    our file before we begin making changes.


    Next, the coordinator tries to get a lock on the file. The system usually allows
    multiple concurrent read operations, while write operations require exclusive
    access to the file. This means a write operation will block until all the currently
    executing read or write operations are finished. Then, once the write block starts
    running, no other read or write operation can begin until it’s done.


    Unlike many block-based APIs, the system executes all the coordinated block operations
    synchronously. This means it will execute our block argument before the method
    returns. This makes it much easier to chain together a series of read and write
    operations. Also note that we provide a URL when creating our coordinated block.
    The system then passes a URL argument to our block. We should always use the block’s
    URL argument when accessing our files. After all, the file may move as part of
    another file presenter’s write operation. So, our original URL may no longer be
    valid by the time our block runs.


    > **NOTE:** We only need to coordinate our reads and writes with the other processes
    on our device. We’re not coordinating between devices. Typically, for iOS devices
    we just need to coordinate with our local iCloud sync service. Therefore, creating
    a coordinated block on my iPhone may force the phone’s iCloud service to write
    its changes to disk (possibly forcing it to download an updated copy of the file),
    but it won’t affect any of the processes running on my iPad.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_324_0.png)


    Even among the coordinated blocks, `coordinateReadingItemAtURL:options:writingItemAtURL:options:error:byAccessor:`
    is somewhat odd. This requests a read operation that needs to coordinate with
    a write operation. In our case, we want to read the current document, update it,
    and then write it again. Despite the name, it is really just an intelligent read
    block. We cannot perform write operations'
