- pgno: 60
  md: "# # C DATA STRUCTURES\n\nSimple data types are all fine and good, but we often\
    \ need to organize our data into more complex structures. These structures fall\
    \ into three main categories: pointers, arrays, and structs.\n\n# ## POINTERS\n\
    \nThe pointer is the simplest structure—at least in concept. Basically, it is\
    \ a variable that points to the memory address of another value. This allows indirect\
    \ access and modification of those values.\n\nYou declare a pointer by placing\
    \ an asterisk between the type declaration and the variable name. You also use\
    \ the asterisk before the variable name to dereference the pointer (to set or\
    \ read the value at that address space). Likewise, placing an ampersand before\
    \ a normal variable will give you that variable's address. You can even do crazy\
    \ things like creating pointers to pointers, for an additional layer of indirection.\n\
    \n```\n```c\nint a = 10;      // Creates the variable a.\nint* b = &a;     //\
    \ Creates the pointer, b, that points to the\n                 // address of a.\n\
    *b = 15;         // Changes the value of variable a to 15.\nint** c;         //\
    \ Creates a pointer to a pointer to an int.\n```\n```\n\n> > **NOTE:** When you\
    \ declare a pointer, the compiler does not request memory space for the underlying\
    \ values. It requests only enough space to store the memory address. You must\
    \ either use the pointer to refer to an existing variable (as we did in the example\
    \ above) or manually manage its memory on the heap. We will explore this issue\
    \ in more depth when we discuss memory management later in this chapter.\n\nBy\
    \ themselves, pointers are not very interesting; however, they form the backbone\
    \ of many more-complex data structures. Additionally, while pointers are conceptually\
    \ quite simple, they are difficult to master. Pointers remain a common source\
    \ of bugs in programs, and these bugs are often very hard to find and fix. A full\
    \ description of pointers is beyond the scope of this chapter. Fortunately, we\
    \ will normally use pointers only when referencing Objective-C objects, and these\
    \ objects largely have their own syntax.\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_60_0.png)"
  merge: -1
  img_proc: true
- pgno: 61
  md: "# ARRAYS\n\nArrays allow us to define a fixed-length series of values. All\
    \ of these values must be of the same type. For example, if we want a list of\
    \ ten integers, we would simply define it as shown here:\n\n```\nint integerList[10];\
    \    // Declares an array to hold ten integers.\n```\n\nWe can then access the\
    \ individual members of the list by placing the desired index in the brackets.\
    \ Note, however, that arrays are zero-indexed. The first item is 0, not 1.\n\n\
    ```\nintegerList[0] = 150;     // Sets the first item in the array.\nintegerList[9]\
    \ = -23;     // Sets the last item in the array.\nint a = integerList[0];    //\
    \ Sets a to 150.\n```\n\nWe can also use the C literal array syntax to declare\
    \ short arrays with a static set of initial values. We write literal arrays as\
    \ a pair of curly braces surrounding a comma-separated list of values.\n\n```\n\
    int intList2[] = {15, 42, 9};    // Implicitly declares an array\n           \
    \                        // to hold three integers,\n                        \
    \           // then sets their values\n                                   // using\
    \ the literal array.\n```\n\nAs this example shows, we do not even need to define\
    \ the length of intList2. Instead, its size is automatically set equal to the\
    \ literal array. Alternatively, you could explicitly set intList2’s size, but\
    \ it must be equal to or longer than the literal array.\n\nArrays are also used\
    \ to represent C-style strings. For example, if you want to store someone’s name\
    \ in C, you usually store it as an array of chars.\n\n```\nchar firstName[255];\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Since they are based on arrays, C-style strings have a fixed size. This leads
    to a very common source of bugs. Yes, 254 characters should be enough to store
    most people’s first name, but eventually you will run into a client that needs
    255 characters (not to mention international character sets).


    As this example implies, the string does not need to use up the entire array,
    but it must fit within the allocated memory space. Actually, the array’s size
    must equal or exceed the number of characters in the string + 1. C-style strings
    always end with a null character.


    String values can be assigned using literal strings—anything within double quotes.
    C will append the null value automatically. In this example, s1 and s2 are identical.


    ```

    ```c

    char s1[5] = "test";

    char s2[5] = {''t'', ''e'', ''s'', ''t'', ''\0''};

    ```

    ```


    > > **NOTE:** ‘A’ and “A” are completely different data types. In C, single quotes
    are used to represent char values. Therefore, ‘A’ is a char with the value of
    65 (the ASCII value for the uppercase letter A). On the other hand, “A” is an
    array of chars with the values {‘A’, ‘\0’}.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_62_0.png)


    Like pointers, arrays can become quite complex—particularly when passing them
    into or returning them from functions, and we haven’t even begun talking about
    advanced topics like multidimensional arrays and dynamic arrays. Fortunately,
    unless you are calling a C library, we will almost never use arrays in Objective-C.
    Instead, we will use one of Objective-C’s collection classes (NSArray, NSSet,
    or NSDictionary). For strings, we will use NSString.


    # ## STRUCTS


    Structures are the most flexible C data type. While arrays allow us to declare
    an indexed list of identical types, the struct lets us combine different types
    of data and lets us access that data using named fields. Also, unlike C-style
    arrays, Cocoa Touch makes heavy use of C structures. In particular, many of the
    core frameworks are written in pure C, allowing them to be used in both Cocoa
    (Objective-C) and Carbon (pure C) projects (Carbon is an older technology that
    is sometimes still used for applications on the Mac OS X desktop).'
  merge: -1
  img_proc: true
- pgno: 63
  md: "To see a typical struct, look up CGPoint in Xcode’s documentation. You will\
    \ see that it is declared as shown here:\n\n```\nstruct CGPoint {\n    CGFloat\
    \ x;\n    CGFloat y;\n};\n\ntypedef struct CGPoint CGPoint;\n```\n\nFirst, the\
    \ framework creates a structure called CGPoint. This structure has two fields,\
    \ x and y. In this case, both fields happen to be the same data type (CGFloat).\n\
    \nNext, we use typedef to define a type named CGPoint. This is an alias for the\
    \ CGPoint struct. That may seem odd, but it is actually quite helpful. If we didn’t\
    \ have the typedef, we would constantly have to refer to this entity as “struct\
    \ CGPoint” in our code. Now, however, we can drop the struct keyword and treat\
    \ it like any other data type.\n\nYou access the fields as shown:\n\n```\nCGPoint\
    \ pixelA;       // Creates the CGPoint variable.\npixelA.x = 23.5;     // Sets\
    \ the x field.\npixelA.y = 32.6;     // Sets the y field.\nint x = pixelA.x; \
    \   // Reads the value from the x field.\n```\n\nApple’s frameworks often provide\
    \ both the data structures and a number of functions to manipulate them. The documentation\
    \ tries to group related structures and methods together wherever possible. For\
    \ any struct type, Apple provides a convenience method for creating the struct,\
    \ a method for comparing structs, and methods to perform common operations with\
    \ the struct. For CGPoint, these include CGPointMake(), CGPointEqualToPoint(),\
    \ and CGRectContainsPoint().\n\nThese methods become more important as the structures\
    \ grow increasingly complex. Take, for example, the CGRect struct. This also has\
    \ just two fields: origin and size; however, these fields are each structs in\
    \ their own right. Origin is a CGPoint, while size is a CGSize."
  merge: -1
  img_proc: true
- pgno: 64
  md: 'The following code shows three different approaches to creating a CGRect.

    All three approaches are equivalent.


    ```

    ```

    CGRect r1;

    r1.origin.x = 5;

    r1.origin.y = 10;

    r1.size.width = 10;

    r1.size.height = 20;

    CGRect r2 = CGRectMake(5, 10, 10, 20);

    CGRect r3 = {{5, 10}, {10, 20}};

    ```

    ```


    In particular, notice how we created r3 using a struct literal. Conceptually,

    these are simple. Each pair of curly braces represents a struct (just like the
    curly

    braces that represented literal arrays earlier). The enclosed comma-separated
    list

    represents the fields in the order they were declared.


    So, the outer braces represent the CGRect structure. The first inner pair of braces

    is the origin and the second is the size. Finally we have the actual fields inside

    the two inner structures. A CGRect still isn''t too complicated, but as our structures

    get more complex, the literal struct construction becomes harder and harder to

    understand. In general, I only use literal structs for simple data structures
    and arrays.

    Instead, I use the helper function (as shown for r2) to quickly make structures,
    and

    I use direct assignment (as shown for r1) when I need additional flexibility.
    Still,

    you will undoubtedly run into third-party code that uses struct literals, so you

    should be able to recognize them.


    **NOTE:** If you are compiling an application with Automated Reference

    Counting (ARC)—and we will use ARC for all applications in this book—

    you cannot store Objective-C objects inside a struct. Instead, you need

    to use an Objective-C class to manage the data. This is one of the few

    rules we must follow to enable automatic memory management.

    We will discuss this in more detail in the “Memory Management” sec-

    tion later this chapter.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_64_0.png)'
