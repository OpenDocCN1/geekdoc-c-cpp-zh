    \ to update the UI manually once we’re done.\n\nFinally, we call the resolveConflictsWithCurrentURL:coordinator:\
    \ method on a background queue. It’s very important to use a background thread\
    \ here. Obviously, from a performance standpoint, we never want to do any file\
    \ input/output operations in the main thread—that could dramatically hurt our\
    \ user interface’s performance. Instead, we should always read and write data\
