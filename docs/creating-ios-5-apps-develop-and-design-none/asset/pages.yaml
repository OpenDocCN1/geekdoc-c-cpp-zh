- pgno: 517
  md: "Finally, we have to respond to any errors. There are two basic types of errors.\
    \ First, we have transient errors. These occur when Core Location cannot correctly\
    \ determine your location. For example, you might be trying to use location services\
    \ from the basement of a parking garage. In that case, the system will continue\
    \ to work, and you may start receiving updates once you have a clear signal. The\
    \ second type of error is terminal errors—these won’t go away. Most commonly,\
    \ terminal errors come from having the user decline when prompted for permission\
    \ to use location services.\n\nThis implementation will work for either case.\
    \ Just like a successful update, set the done property to YES. Then we check to\
    \ see if we have a callback block yet. If we do, we dispatch it immediately. If\
    \ we don’t, we wait for a call to getLocationWithCompletionHandler:. If we haven’t\
    \ already received a successful update, the location property will be set to nil.\
    \ The dispatch method will then pass that value back to the completion block.\
    \ However, we can still receive additional updates, so if we get a clear signal\
    \ we may still get a valid location before the callback is dispatched.\n\n# USING\
    \ THE ASSETS LIBRARY FRAMEWORK\n\nThe ExportViewController receives a snapshot\
    \ of the screen when the pop-up is displayed. We simply need to create an instance\
    \ of the assets library and save it.\n\n```\n```objective-c\n- (void)saveToPhotoAlbum\
    \ {\n    [self.currentLocationManager\n        getLocationWithCompletionHandler:^(CLLocation\
    \ *location) {\n            ALAssetsLibrary* library = [[ALAssetsLibrary alloc]\
    \ init];\n            NSDictionary* metadata =\n                [self generateMetadataForLocation:location];\n\
    \            [library\n                writeImageToSavedPhotosAlbum:[self.imageToExport\
    \ CGImage]\n                metadata:metadata\n                completionBlock:\n\
    \                ^(NSURL *assetURL, NSError *error) {\n```\n```"
