    # ROUNDING CORNERS WITH CORE ANIMATION


    > **NOTE:** Manipulating views with Core Animation is an advanced topic. While
    this represents a useful technique for modifying the appearance of controls without
    having to subclass them, it can get a bit complicated. However, since it doesn''t
    add any critical features to the application, you can safely skip this section.
    Your application will still function normally.


    Most of the time when you talk about Core Animation, you''re talking about smoothly
    moving user interface elements around the screen, having them fade in and out,
    or flipping them over. Here, however, we will hijack some of the more obscure
    features of Core Animation to round off our button''s corners, add a border, and
    layer over a glossy sheen.


    As you might guess, Core Animation is a deep and complex subject. We will look
    at techniques for animating view properties in “Managing Pop-Up Views” in Chapter
    8. However, even that only scratches the surface. If you want to get all the gory
    details, I recommend reading the Core Animation Programming Guide in Apple''s
    documentation.


    First things first, we need to add the QuartzCore framework to our project. Click
    the blue Health Beat icon to bring up the project settings. Make sure the Health
    Beat target is selected, and click the Build Phases tab. Next, expand the Link
    Binary With Libraries build phase, and click the plus button to add another framework.
    Scroll through the list and add QuartzCore.framework (**Figure 4.17**).


    Next, open UnitSelectorViewController.m. We need to import the Quartz-Core header.


    ```

    #import <QuartzCore/QuartzCore.h>

    ```


    Then navigate to the viewDidLoad method. Modify it as shown:


    ```

    - (void)viewDidLoad

    {

    ```'
