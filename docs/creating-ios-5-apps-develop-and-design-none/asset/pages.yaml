- pgno: 141
  md: '# # TASKS EVERY APPLICATION SHOULD PERFORM


    The iOS SDK has a handful of methods that are commonly used to perform vital application
    tasks. You don''t necessarily need to implement each of these in every application;
    however, you should give them some thought. In addition, most of these methods
    have a corresponding notification that could be used to monitor these events in
    other parts of your code.


    # ## App Opening


    These methods are called when the application first launches or when it returns
    from the background state (for iOS 4.0 or later). You will often use these methods
    to load the application''s state and to perform other one-time configuration activities.


    # ### application:didFinishLaunchingWithOptions:


    UIKit calls this UIApplicationDelegate method when the application first launches.
    We will often use it to perform one-time configuration tasks. Note, however, that
    the application will not appear onscreen until after this method returns. Therefore,
    we should avoid doing any potentially time-consuming activities during this method.


    In particular, try to avoid tasks like accessing remote servers. These may work
    fine in testing but fail when deployed to actual users (especially when using
    the phone in areas with poor reception). This could cause the application to freeze
    until the network connection times out, creating an unacceptably long delay when
    launching.


    While this may seem like a rare corner case, many third-party frameworks (e.g.,
    analytic toolkits, social gaming frameworks, or ad networks) will perform network
    calls when initialized.


    # ### applicationWillEnterForeground:


    UIKit calls this UIApplicationDelegate method in iOS 4.0 and later when the application
    returns from the background state. This may be called multiple times as the user
    closes and opens the app.


    # ### applicationDidBecomeActive:


    This UIApplicationDelegate method is called both when the application launches
    and whenever it returns from the background state.


    # ### viewDidLoad


    UIKit calls this UIViewController method once the controller''s view has fully
    loaded. This method is called regardless of how the view was created—it could
    be loaded from a nib or programmatically built using the loadView method.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'We will implement this method to perform additional setup or configuration.
    Since views can be loaded and unloaded automatically as part of regular memory
    management, this method may be called more than once. Additionally, any resources
    created during the viewDidLoad method should be released in the viewDidUnload
    method.


    # ### App Closing


    These methods are called when the application is closing or when it is moving
    to the background (for iOS 4.0 and later). You will often use these methods to
    save the application’s state or to perform any cleanup activities before the application
    closes. In general, applicationWillTerminate: is used only by pre-iOS 4.0 devices,
    while applicationDidEnterBackground: is used by everything from iOS 4.0 and on.
    If you are supporting both devices, the methods are often duplicates of each other.


    # ### applicationWillTerminate:


    UIKit calls this UIApplicationDelegate method just before an application terminates
    on devices before iOS 4.0. It may be called on iOS 4.0 and later, but that is
    somewhat rare. The application must be executing in the background when it needs
    to terminate suddenly (e.g., in response to a low memory warning). More typically,
    when the user taps the home button, your application will move first to the background
    and will then become suspended. Then when suspended applications are terminated,
    they die silently without any additional notifications.


    This method has approximately 5 seconds to perform any cleanup activities and
    return. If it takes longer than 5 seconds, the application will be killed.


    # ### applicationDidEnterBackground:


    In iOS 4.0 and later, this UIApplicationDelegate method is called before the application
    is sent to the background. You should perform any cleanup activities here, since
    your application may be terminated while in the background. As mentioned earlier,
    applicationWillTerminate: is not called when your application is suspended, so
    you may not receive any additional notifications.


    Like applicationWillTerminate:, you have approximately 5 seconds to complete any
    actions. However, you can request additional time by calling beginBackgroundTaskWithExpirationHandler:.'
