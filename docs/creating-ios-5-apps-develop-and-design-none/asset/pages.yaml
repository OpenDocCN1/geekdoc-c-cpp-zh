- pgno: 448
  md: 'Of course, there''s a lot of room for improvements. We could share a single
    fetch request between both the HistoryViewController and the GraphViewController.
    Better yet, we could use an NSFetchedResultsController here as well, sharing the
    same cache as the HistoryViewController. Having the caching and the built-in support
    for change detection would be nice. We don''t need the section or index path support,
    and it would be a little harder to get our array of WeightEvents, but it might
    be worth the effort.


    Still, users often only enter a single weight per use. This means we only call
    the fetch request once. So, go easy with the changes. Unless we find a compelling
    reason to make changes (after profiling and stress testing, that is), it''s probably
    best to just leave things alone.


    # WRAPPING UP


    That''s it. Run the application. Try adding and deleting weights. Navigate to
    the history view, and shake to undo. Everything should work as expected. Launch
    it on a second device; all the weights should transfer over. Put the first device
    on the graph view. Then enter a new weight on the second device, and put that
    app into the background. Within a minute or so, the first device''s screen should
    change. If everything looks good, commit your changes.


    Of course, there is one big difference between this version and the last. Shake
    to undo no longer asks for permission before making a change. It immediately undoes
    the last action. It turns out that we threw out most of our undo support code
    when we deleted the old WeightHistory class. That means we didn''t even register
    any actions for undo, or create the inverse undo methods. Core Data handled everything
    for us automatically.


    I''ll leave the alerts as homework. It shouldn''t be hard to move the relevant
    WeightHistory code over to the HistoryViewController. Just be sure to set the
    undo action name every time you save the context. Then add the alert methods.


    Next chapter, we will take a break from the Health Beat application to look at
    custom controls. In particular, we will focus on using Core Motion and custom
    gestures. Finally, in Chapter 9, we will look at all the little details that need
    to be completed before submitting your app to the App Store.'
