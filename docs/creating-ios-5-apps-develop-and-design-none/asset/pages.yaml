- pgno: 535
  md: 'This is a grab bag of additional features and settings. Some are required before
    we can submit our application, others are strongly recommended, and a few merely
    add a touch of convenience to our apps.


    # ## APPLICATION ARTWORK


    Our application expects a number of icons and other images. These are not functional
    parts of the application itself. Rather, they are used by the system to represent
    our application in a variety of circumstances.


    # ### ICONS


    The system will use both application icons and search icons to represent our application.
    The application icon appears on the phone’s home screen. The search icon appears
    in search results. Different devices require images of different sizes. We can
    use whatever names we wish, but the images must be PNG files. See Table 9.1 for
    the details.


    **TABLE 9.1** Icon Sizes


    | DEVICE | ICON | SIZE |

    | --- | --- | --- |

    | iPhone (regular) | Application | 57 x 57 |

    | iPhone (Retina) | Application | 114 x 114 |

    | iPad | Application | 72 x 72 |

    | iPhone (regular) | Search | 29 x 29 |

    | iPhone (Retina) | Search | 58 x 58 |

    | iPad | Search | 50 x 50 |


    There’s an easy way and a hard way to add these icons. The easy way is to simply
    open the target’s summary settings. Scroll down until you find the icon settings,
    and drag the icons into place. Unfortunately, this only lets us set the application
    icons.


    The search icons are optional. They will be generated automatically using our
    application icon. However, for the best appearance, we really should create custom
    icons at the correct resolution. To add these, we need to modify the Info.plist
    file directly.'
  merge: -1
  img_proc: true
- pgno: 536
  md: '| Key | Type | Value |

    |---|---|---|

    | Icon files (iOS 5) | Diction... | (2 items) |

    | &nbsp;&nbsp;Primary Icon | Diction... | (2 items) |

    | &nbsp;&nbsp;&nbsp;&nbsp;Icon files | Array | (4 items) |

    | &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Item 0 | String | HBAppIcon |

    | &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Item 1 | String | HBIPadAppIcon |

    | &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Item 2 | String | HBISearchIcon |

    | &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Item 3 | String | HBIPadSearchIcon |

    | &nbsp;&nbsp;&nbsp;&nbsp;Icon already includes gloss effect | Boolean | NO |

    | &nbsp;&nbsp;Newsstand Icon | Diction... | (3 items) |


    **FIGURE 9.1** Icon settings


    Let’s add icons to Health Beat. You can create your own icons or copy them from
    the source code at www.freelancemadscience.com/source. Start by adding all the
    icons to our project. Then, open `Health Beat-Info.plist` and add a new key. Select
    Icon files (iOS 5) from the drop-down list. This will automatically generate a
    dictionary with Primary Icon and Newsstand Icon entries.


    The Primary Icon entry is also a dictionary. Expand it. It should contain two
    elements: an ''Icon files'' array and an ''Icon already includes gloss effect''
    Boolean value. Expand the array and add new items to it. We will need four items.


    Set the string values of these items to the names of our icon files without the
    extensions. If our Retina display icons follow the `@2x` naming convention, we
    don’t need to add them to this list. Simply add the name of the lower-resolution
    file, and the system will choose the Retina display version when appropriate.


    If you’re using the Health Beat icons, the final settings should match **Figure
    9.1**.


    # ## LAUNCH IMAGES


    The system displays our application’s launch image as the application is initialized.
    Many developers use this as an opportunity to display a splash screen or advertisement,
    but this is actually discouraged.


    Apple strongly recommends that we use a streamlined version of the application’s
    main interface as the launch image. We want to strip out anything that might change.
    Obviously, this includes date fields and table view contents, but it also includes
    button titles and other labels that need to be localized.


    Displaying only a partial user interface has a psychological advantage. The user
    won’t accidentally try to use it until all the details are filled in. Furthermore,
    displaying a partial user interface creates the illusion that our application
    is launching faster. Our app seems snappier, and the users appreciate being able
    to get to work immediately.'
  merge: -1
  img_proc: true
- pgno: 537
  md: '# SUPPORTING EARLIER VERSIONS


    The settings shown in this chapter only work for iOS 5 and later. For earlier
    versions, use the Icon files setting (not to be confused with the Icon file setting).
    This is exactly the same as the iOS 5 version’s inner Icon files key. And like
    the inner key, it should hold an array of filenames.


    Devices running iOS 3.1.3 or earlier do not even recognize the Icon files key.
    Instead, they search through the app’s main bundle, looking for files with specific
    filenames. To support these devices, your icons must use the following names:


    +   - **iPhone Application** — `Icon.png`

    +   - **iPhone Search** — `Icon-Small.png`

    +   - **iPad Application** — `Icon-72.png`

    +   - **iPad Search** — `Icon-Small-50.png`


    To support the broadest range of devices, you should use the fixed name convention,
    and add both the Icon files and the Icon files (iOS 5) keys. This will give us
    the best performance and the broadest range of features, while still supporting
    all our devices.


    iOS uses filename conventions to distinguish the different launch screens. However,
    we usually don’t need to worry about these details, unlike with the icons. Most
    of the time, we can simply drag our launch screens into the proper locations on
    the target summary settings screen.


    The iPhone only supports portrait launch screens. We must include a 320 x 480
    PNG file for normal display, and a 640 x 960 PNG for Retina display.


    The iPad supports both portrait and landscape. These must be a 768 x 1004 PNG
    file and a 1024 x 748 PNG file, respectively.


    > > **NOTE:** The iPad also allows us to specify different images for landscape
    left, landscape right, and portrait upside down. We can also specify a separate
    launch image for all devices if the app is launched using a custom URL scheme.
    For more information on these cases, check out the “App-Related Resources” section
    of the iOS App Programming Guide.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_537_0.png)'
