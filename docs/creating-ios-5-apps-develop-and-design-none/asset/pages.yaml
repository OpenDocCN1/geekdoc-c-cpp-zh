- pgno: 294
  md: '# MANAGING USER PREFERENCES


    Preferences are a special type of data. They define how an application operates.
    How large are the fonts? How responsive is the gyroscope? How loud is the background
    music? While the users often change these values, the application needs some sort
    of default to start out with. As a result, we often refer to preferences as defaults
    (or user defaults).


    Typically, applications save their preferences separately from the rest of their
    data. You can change the background music volume without affecting your saved
    games—and when you switch from one saved game to another, the background music
    volume probably shouldn’t change.


    Furthermore, preferences may represent both the explicit and the implicit settings
    for our application. Explicit preferences are exposed to the user, either in the
    Settings app or within the application itself. We display a set of options and
    let the user make their own selections. If the user wants to change the background
    music volume, we present a slider and let them adjust it.


    Implicit preferences, on the other hand, are inferred from the user’s actions.
    In most cases, we simply watch what the user is doing and record it. This could
    include recording the last site visited in a Web view or the last page read in
    an e-book reader. Implicit preferences could even include the state of the user
    interface: What tab did the user have open? What views are currently stored in
    their navigation controller’s stack? (See “Saving Health Beat’s State” for more
    information about the interface’s state.)


    Like any other data, iOS has a specific directory for saving user preferences.
    In this case, it’s the Library/Preferences directory. However, we should never
    need to touch this path directly. Instead, we should use the NSUserDefaults class
    (or, alternatively, Core Foundation’s CFPreferences API).


    NSUserDefaults gives us programmatic access to the user’s defaults database. This
    stores information in key-value pairs. To use this class, simply access the shared
    object using the standardUserDefaults class method. Then you can call a variety
    of methods to set and retrieve values for the specified keys. All of the changes
    are cached locally to improve performance.


    You can call the synchronize method to force updates. This both writes local changes
    to disk and updates the local values from disk. However, the system will automatically
    synchronize itself periodically, so you only need to call synchronize when you
    want to programmatically force an update.'
  merge: -1
  img_proc: true
