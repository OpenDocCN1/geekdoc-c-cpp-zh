  md: "**NOTE:** Most of our views are relatively simple, especially our pause indicator\
    \ and our acceleration control. In many ways, they could be more easily managed\
    \ by the CanvasViewController directly, without requiring either a container or\
    \ their own view controllers. Creating child view controllers really starts to\
    \ make sense when we begin adding more complex views. For example, the export\
    \ menu controller not only dynamically sets the content for its views based on\
    \ your device’s capabilities, it also coordinates the actual creation and export\
    \ of our images. We really don’t want to add these features directly to our CanvasViewController\
    \ class.\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_471_0.png)\n\n# ## MANAGING\
    \ POP-UP VIEWS\n\nWe need to build support for adding our pop-up views to our\
    \ container class. To start with, let’s create an enum for our different animation\
    \ sequences.\n\n```\n    typedef enum {\n        GSPopupFade,\n        GSPopupDropDown,\n\
    \        GSPopupSlideFromHomeButton,\n        GSPopupSlideTowardsHomeButton,\n\
    \    } GSPopupAnimationType;\n```\n\nNow we can define a method to show a pop-up.\
    \ This is a bit long, so let’s look at it in chunks.\n\n```\n    #pragma mark\
    \ - Popup View Animation Methods\n    - (void)showPopupController:(UIViewController*)controller\n\
    \                    animationType:(GSPopupAnimationType)type\n            withCompletionHandler:(void\
    \ (^)(BOOL finished))completion {\n        NSAssert(controller != nil, @\"Trying\
    \ to show a nil controller\");\n        // Add to the controller hierarchy.\n\
    \        [self addChildViewController:controller];\n```\n\nThis starts simply\
    \ enough. We perform a quick sanity check, just to make sure we’re not trying\
    \ to add a nil pop-up view controller. Then we add the controller to our container\
    \ class."
