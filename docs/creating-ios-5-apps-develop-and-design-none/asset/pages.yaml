  md: '# SHOWING DETAIL VIEWS


    ![](img/fe9fea534a8e7868f811f7cd33da015f_232_0.png)


    **FIGURE 4.24** After converting to a grouped static table


    There is still one piece left to implement. When the user selects one of the weights,
    we want to display detailed information about our weight entry. Unfortunately,
    once you''ve listed the weight and the date, there''s really not much more you
    can say about a single WeightEntry, so we will fill out our detail view by comparing
    the selected weight entry with the minimum, maximum, and current monthly average
    from our WeightHistory.


    We will also look at using static tables to organize and display our data. Static
    tables are a very convenient way to display a fixed set of information. We lose
    a little bit of flexibility in that we cannot change the number, order, or types
    of rows in our table. However, we can build our entire interface directly in the
    storyboard. We don''t even need to implement a data source for our table.


    # DESIGNING THE STATIC TABLE VIEW


    Open the storyboard and zoom in on the detail view scene. First things first,
    let''s turn it into a static table. Select the table view, then set its Content
    attribute to Static Cells. We also want to change the Style attribute to Grouped.
    This should give us a rounded bubble of three blank cells against a striped gray
    background (**Figure 4.24**).'
