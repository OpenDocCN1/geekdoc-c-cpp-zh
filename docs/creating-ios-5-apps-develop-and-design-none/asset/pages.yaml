  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_400_0.png)


    **FIGURE 7.2** The persistent store coordinator''s role in the Core Data stack


    # ## PERSISTENT STORE COORDINATOR


    Each managed object context has a single persistent store coordinator. This coordinator
    sits between the context and the stores. Each managed object context can have
    one and only one persistent store coordinator. The coordinator, however, can support
    more than one context. It can also connect to any number of persistent stores
    (**Figure 7.2**).


    The persistent store coordinator primarily acts as a façade for a number of stores.
    We could have just a single persistent store, or we could have a hundred. As far
    as the managed object context is concerned, it doesn''t matter. The persistent
    store coordinator provides a single, unified interface, presenting the union of
    all the data in all the provided stores.


    The persistent store coordinator also plays an important role in concurrent application,
    by serializing access to the underlying data. By default, if you want to access
    data in multiple threads, then each thread should have its own persistent store
    coordinator (and by extension, its own managed object context).


    This is also referred to as thread confinement concurrency. With iOS 5, we have
    two additional concurrency options: private queue concurrency and main queue concurrency.
    These options often remove the need to create multiple managed object contexts—greatly
    simplifying our code.'
