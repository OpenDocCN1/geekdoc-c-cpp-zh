- pgno: 418
  md: '# DOCUMENT HANDLING AND ERROR CHECKING


    Both in this chapter and in Chapter 6, I have been a bit cavalier about checking
    for errors. This isn''t inherently a problem—however, it does assume that we will
    never try to load corrupted documents.


    In general, this is a safe assumption, since both UIDocument and UIManaged Document
    use atomic saves. However, if we update our application and change the document''s
    format, we may run into problems. After all, the users may not update all their
    devices at the same time.


    Let''s say I update my iPhone but not my iPad. Then I open a document in my iPhone.
    The application migrates my data to the new format and saves it again. Then I
    open it on my iPad. Now, the iPad tries to open a file format that it doesn''t
    understand. This can lead to a number of problems, possibly crashing the application
    or even uploading the corrupted data back to the cloud.


    Robust error checking can help prevent problems, but it isn''t sufficient. Be
    sure to test your project thoroughly before submitting an update. This includes
    testing the interactions between the old version and new version. Try opening
    both new and old documents in both versions. Try triggering conflicts, and have
    each version merge the documents. Make sure nothing bad is going to happen.


    This may require building metadata into the file format from the beginning. For
    example, adding a version number to our document''s data. We can then check the
    version number each time we load the file. If the version number is greater than
    what our current application supports, we fail gracefully. Unfortunately, we need
    to build this support into our original application—which means we need to anticipate
    possible future changes and plan for them.


    Alternatively, we could change the document''s UTI. This acts as a one-way gate.
    The old application won''t even see the new file, preventing any possible problems.'
  merge: -1
