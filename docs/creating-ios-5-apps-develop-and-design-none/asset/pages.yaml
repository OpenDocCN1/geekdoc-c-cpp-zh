- pgno: 399
  md: 'These formatting strings allow us to specify a wide range of predicates in
    a relatively compact format. Unfortunately, it''s very easy to accidentally misspell
    a key path or inadvertently pass in the wrong type of object. These mistakes will
    only show up as runtime errors. It is, therefore, very important to test all your
    predicates.


    Additionally, not all data sources support all of NSPredicate''s features. This
    is particularly important for Core Data, since the predicate''s behavior can change
    when we switch from one type of persistent store to another. The behavior can
    also vary depending on whether we use it in a fetch request or to filter the returned
    NSArray. We''ll talk about these differences more in the "Persistent Stores" section,
    later in this chapter.


    OK, this should be enough to get you started. For more information, check out
    Apple''s Predicate Programming Guide. It covers a number of advanced topics, like
    programmatically creating predicates, creating predicate templates with variables,
    and dynamically setting key paths. It also includes a full description of the
    syntax for predicate format strings.


    > NOTE: Each fetch request requires a round trip to the persistent store. Therefore,
    if you need to get a subset of objects, it is faster to filter an existing array
    than to perform a new fetch request. Additionally, you cannot perform fetch requests
    using predicates based on transient attributes, since these attributes are ignored
    by the persistent store. You can, however, use these attributes when filtering
    arrays of objects in memory.


    Finally, iOS provides additional support for Core Data-driven table views using
    the NSFetchedResultsController class. This class analyzes the results of a fetch
    request (including any predicate or sorting descriptors) and automatically maps
    the returned objects to their corresponding index paths. You can even specify
    a key path that will be used to partition the results into sections.


    In addition, the NSFetchedResultsController monitors changes to the objects in
    its managed object context and reports these changes to its delegate. The controller
    also caches its results, improving performance if the table is re-displayed.


    We will get a chance to use an NSFetchedResultsController when we revise Health
    Beat''s history view (see "Updating the View Controllers," later in this chapter).'
