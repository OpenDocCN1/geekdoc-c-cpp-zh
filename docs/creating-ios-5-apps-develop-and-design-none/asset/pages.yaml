- pgno: 316
  md: 'Again, we simply insert the object back at its previous index, bracketing the
    change with KVO notifications.


    So far, we’ve just added actions to our undo queue. We haven’t actually triggered
    any of these undo actions. That will have to wait until the “Enabling Undo Support”
    section. For now, this is sufficient. Adding these actions to the undo queue will
    alert our document to the changes. Our document will then save itself at the next
    opportunity moment.


    # # MERGING CONFLICTING VERSIONS


    There’s a simple rule. If you’re using iCloud storage, then you must be prepared
    to handle conflicts. Conflicts occur when the cloud storage receives contradicting
    updates. This typically happens when one device saves a change, and then a second
    device saves a different change before receiving the first update.


    In most cases, this should rarely occur. Sure, I want to have the same data on
    my iPhone, my iPad, and my Mac—however, I’m probably not going to run the same
    application on two different devices at the same time. If I make a change on my
    phone, there should be plenty of time for the update to reach my Mac before I
    open the file there.


    However, remember how iCloud works. Each application saves and reads to a local
    file. The system then syncs this file with the cloud. There may be times when
    the system is unable to sync these changes—for example, if the device is in Airplane
    mode or if it’s located in the Wi-Fi–less sub-basement of an office building.
    In both cases, the user can still access and edit any documents on their device.
    Any changes they make will be saved locally but won’t be synced to the cloud.
    Furthermore, devices can be shut off. They can run out of power. There are any
    number of reasons why an update may be delayed, creating potential for conflicts.


    Most importantly, if it can happen, it will happen—guaranteed. We have to be prepared
    to handle it.


    There are three basic approaches to managing conflicts. The simplest is to let
    the last change win. From a developer’s standpoint, this is by far the easiest
    solution to implement. We just mark all the conflicting versions as resolved and
    then delete them. Done and done. However, it has a rather large downside. While
    this may work fine in many cases, we risk accidentally deleting some of our user’s
    data. And that would be a bad thing.'
