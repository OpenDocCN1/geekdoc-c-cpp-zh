    \ // declare the bounce down animation block.\n    void (^bounceDown)(BOOL) =\
    \ ^(BOOL notUsed) {\n      [UIView\n       animateWithDuration:0.15f\n       delay:0.0f\n\
    \       options:UIViewAnimationCurveEaseIn\n```"
