- pgno: 272
  md: 'We start by creating an x-coordinate that is inset by twice the margin property—once
    to bring us to the edge of the rounded rectangle, then once more to give us a
    nice margin inside it. Notice that we are using the same margin value for all
    the margins: the distance between the view''s bounds and the round rectangle,
    the distance between the left side of the round rectangle and our reference label,
    and the distance between the reference label and the reference line. We could
    have used different margin parameters, but this simplifies the code and provides
    a clean, uniform appearance.


    We then set the fill color to our textColor property, and draw our text using
    the UIStringDrawing drawAtPoint:withFont: method. This draws a single line of
    text whose upper-left corner is the given point. Notice that this method uses
    the text drawing mode and colors from the current context; however, you do not
    need to set the context''s font. The drawAtPoint:withFont: method manages the
    font for you automatically.


    By default, text is drawn using only the fill color. You can change this if you
    want by calling the Core Graphics CGContextSetTextDrawingMode() method to add
    outlines (as well as other drawing effects).


    Additionally, we want our text to be vertically centered on the y-coordinate.
    Notice how we offset the drawing point by subtracting half the font''s line height
    from our y-coordinate. This moves the label up, centering its bounding box appropriately.


    Next, we move the x-coordinate in by using our text width offset and margin. We
    create our path, a single horizontal line segment that runs from the x- and y-coordinates
    to the right margin. We set the line width and color, and then we draw the line.


    This approach is somewhat different from the one we used to draw the grid lines.
    Here, we are using UIKit''s UIBezierPath. There, we used Core Graphics'' CGContextStrokeLineSegments()
    function. As we said earlier, there are a number of duplicate (or near-duplicate)
    methods between the two frameworks. This often gives us several different ways
    to accomplish the same basic task. You can pick whichever approach works best
    in your particular application.'
