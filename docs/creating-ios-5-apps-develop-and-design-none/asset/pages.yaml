- pgno: 215
  md: '# CORE ANIMATION AND PERFORMANCE


    While we used the CALayer to give our button rounded corners, you could use the
    same technique for any UIView. One obvious example would be to create UIImageView
    objects with rounded corners and possibly even a glassy sheen. However, you may
    find it useful for any number of UIView objects: text views, Web views, scroll
    views, map views, or any of the custom views you may build.


    While this approach is convenient, it can become computationally expensive. Performing
    these types of Core Animation manipulations require our views to be drawn to an
    offscreen buffer before being drawn onto the main view. This occurs on each and
    every frame both for our altered view and for any of its subviews.


    This is particularly important in any view that expects smooth animation (for
    example, scroll views or table views). Having a number of objects performing offscreen
    rendering will quickly turn a smoothly scrolling interface into a jerking, stuttery
    mess.


    We can use Instruments to detect views that are using offscreen rendering (see
    Bonus Chapter B for more information on Instruments). Connect your test iOS device,
    and set the scheme to run on it. Then select Product > Profile from the main menu.
    This will launch Instruments. When prompted, start the Core Animation template.
    Select the Core Animation track, and make sure the Color Offscreen-Rendered Yellow
    option is selected (Figure 4.19). This will highlight any views that are rendered
    offscreen in yellow, making them easy to spot.


    As you can see, when you touch the units button, the entire screen is rendered
    offscreen as it flips. However, once the transition animation finishes, the rest
    can be rendered directly. Only our custom button continues to render offscreen
    (Figure 4.20).


    If Core Animation becomes a performance issue, the easiest fix is to set the CALayer''s
    shouldRasterize property to YES. This tells Core Animation that the layer will
    require offscreen rendering and will force it to cache the offscreen image and
    reuse it whenever possible. In some cases, this can dramatically improve Core
    Animation''s performance.


    However, shouldRasterize isn''t a magic "run faster" flag. It should only be used
    under very specific circumstances. Obviously, if our view''s appearance is changing,
    then caching doesn''t make sense. Core Animation will need to throw out the cache
    and re-render the view for each new frame. Worse yet, if the view wouldn''t have
    required an offscreen pass, setting shouldRasterize will force it to be rendered
    offscreen. This will actually reduce the app''s performance.


    In Health Beat, shouldRasterize doesn''t help us at all. Our button''s final image
    is only rendered once, so we would never reuse the cache. Creating it only wastes
    memory. However, if we had placed our button in a scroll view, setting shouldRasterize
    might make a big difference.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# # CORE ANIMATION AND PERFORMANCE (continued)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_216_0.png)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_216_1.png)


    **FIGURE 4.19** Highlighting offscreen-rendered views using Instruments


    **FIGURE 4.20** All offscreen-rendered views are highlighted in yellow


    If we cannot use shouldRasterize to solve our performance problems, we may need
    to revert back to custom drawing. In our case, we could create a subclass of UIView
    and override the drawRect: method, manually drawing our curved rectangle and gradient
    fills. Typically, the drawing code is only called once, when the object is first
    placed onscreen. It is then cached in the view''s CALayer and can be scrolled,
    resized, or otherwise animated without requiring additional drawing. Of course,
    the initial drawing may be slightly slower than the Core Animation method calls,
    but we''re converting a per-frame cost into a one-time cost. In many cases, this
    produces significant performance improvements.


    We''ll cover custom drawing in more depth in Chapter 5, “Drawing Custom Views.”'
