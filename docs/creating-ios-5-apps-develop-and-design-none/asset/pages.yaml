- pgno: 161
  md: "The stringForWeightInUnit: method simply gets the object’s current weight value\
    \ in the specified unit and calls the stringForWeight:ofUnit: class method to\
    \ generate the properly formatted string.\n\n# THE WEIGHTHISTORY CLASS\n\nNow\
    \ we need a class to manage all of our WeightEntries. Internally we will use an\
    \ NSMutableArray to manage the list of entries; however, we don’t want anything\
    \ outside the model to modify it. Instead, let’s wrap it up a bit, giving us more\
    \ control over its use.\n\nCreate a new class inside the Model group. This should\
    \ be a subclass of NSObject. Name the class WeightHistory. Now open WeightHistory.h.\
    \ The first thing we want to do is import our WeightEntry class. While we’re at\
    \ it, let’s add a few string constant keys. Our controllers will use these later\
    \ to observe changes within the WeightHistory class. Add the highlighted code\
    \ as shown:\n\n```\n```objective-c\n#import <Foundation/Foundation.h>\n\n#import\
    \ \"WeightEntry.h\"\nstatic NSString* const WeightHistoryChangedDefaultUnitsNotification\
    \ =\n    @\"WeightHistory changed the default units\";\nstatic NSString* const\
    \ KVOWeightChangeKey = @\"weightHistory\";\n@interface WeightHistory : NSObject\
    \ {\n}\n```\n```\n\nNormally, I prefer to avoid putting #import directives in\
    \ my header files. You can often use forward declarations for any unknown object\
    \ pointers and then import the actual header file in your implementation files.\
    \ This reduces the number of dependencies between headers and can greatly reduce\
    \ the amount of time it takes to compile large projects.\n\nHere, however, we\
    \ will need access to the WeightUnit type in our WeightHistory.h header. Remember,\
    \ WeightUnit is an enum, not an object, so we cannot use forward declarations.\
    \ If we wanted to be really anal, we could move WeightUnit to its own header file\
    \ and just import that, but importing WeightEntry.h works well enough."
