  md: "Next, implement the setWeightEntries:andUnits: method as shown here:\n\n```\n\
    #pragma mark - Setting the weight data\n- (void)setWeightEntries:(NSArray*)weightEntries\n\
    \                  andUnits:(WeightUnit)units {\n    self.graphStats =\n     \
    \ [[GraphStats alloc] initWithWeightEntryArray:weightEntries];\n    self.units\
    \ = units;\n    [self setNeedsDisplay];\n}\n```\n\nHere, we start by instantiating\
    \ a new GraphStats object using the weightEntries argument. We then assign that\
    \ object to our graphStats property. We also set the units property and call setNeedsDisplay.\n\
    \nThe setNeedsDisplay method tells the system that the view's content has changed\
    \ and needs to be redrawn. Notice that setNeedsDisplay does not trigger an immediate\
    \ redrawing. Instead, the system just records the request and allows setNeedsDisplay\
    \ to return. Then, during the next draw cycle, the view redraws itself.\n\n# PERFORMING\
    \ CUSTOM DRAWING\n\nNow we get to the heart of this chapter: drawing our user\
    \ interface.\n\nWhen UIKit needs to draw a view (either entirely or just in part),\
    \ it creates a graphics context whose origin matches the view's bounds (e.g.,\
    \ {0.0, 0.0} is located at the top left corner of the view). It also applies any\
    \ transforms necessary to make the context match the view (rotation, scaling,\
    \ etc.). Then, it calls the view's drawRect: method.\n\nOf course, the default\
    \ UIView's drawRect: method doesn't do anything at all, but we can override it\
    \ to customize our view's appearance.\n\nPlease note, this is not the only way\
    \ to draw a view. If you just want to change the background color, you do not\
    \ need to implement drawRect:. Just change the view's backgroundColor property.\
    \ The rest is automatic.\n\nAt the other extreme, if you are drawing the content\
    \ directly in the view's layer, or if you plan to use OpenGL ES for your drawing,\
    \ you do not need to override the drawRect: method. These approaches have their\
    \ own drawing techniques."
