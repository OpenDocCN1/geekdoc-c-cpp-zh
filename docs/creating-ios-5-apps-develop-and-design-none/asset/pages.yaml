- pgno: 152
  md: 'As we discussed in Chapter 2, most iOS applications can be divided into three
    main sections: the model, the view, and the controller. So far, we’ve been laying
    out and linking our controllers and views. However, we still need the model—the
    repository that will manage and store our data.


    For this project, our model will consist of two separate classes. A WeightEntry
    object will represent a single entry, while the WeightHistory class will manage
    the entire set of entries.


    # ## WEIGHTENTRY CLASS


    The data for Health Beat is relatively simple. We will have a number of entries.
    Each entry will have a date and a weight. Let’s start by building an object to
    represent a single entry. Right-click the Model group, and select New File. Select
    an iOS > Cocoa Touch > Objective-C class, and make it a subclass of NSObject.
    Name the class WeightEntry, and save it.


    We need to add two properties to this class, one for the weight and one for the
    date. For simple data-storage classes like these, I like to make my classes immutable—once
    you set the value, you cannot change it. This helps keep the code simple and clean.


    Open WeightEntry.h, and declare our properties as shown here:


    ```

    ```objective-c

    @interface WeightEntry : NSObject

    @property (nonatomic, assign, readonly) CGFloat weightInLbs;

    @property (nonatomic, strong, readonly) NSDate* date;

    @end

    ```

    ```


    Here, I’ve chosen to store the weight as a simple float value, and the date (and
    time) using the NSDate object. As the property name suggests, we will store the
    weight in pounds. Also, even though these are readonly properties, we still need
    to give an ownership attribute to the date property. I’ve also added the assign
    attribute to the weightInLbs property. It’s not strictly necessary, since properties
    use assign ownership by default, but I like to make it clear.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "Switch to the WeightEntry.m implementation file and add the lines to synthesize\
    \ these properties inside the @implementation block:\n\n```\n```\n@implementation\
    \ WeightEntry\n\n@synthesize weightInLbs = _weightInLbs;\n@synthesize date = _date;\n\
    ```\n```\n\nWeights, currency, date formats—all these simple-seeming concepts\
    \ tend to get overly complicated whenever you want to support multiple countries\
    \ or cultures. For the purpose of this project, we will want to support both pounds\
    \ and kilograms. To keep the code as streamlined as possible, we will use pounds\
    \ as the canonical weight internally. We will then add helper functions to convert\
    \ from pounds to kilograms and from kilograms to pounds as needed.\n\nLet’s start\
    \ by defining an enumeration of our weight units. Switch back to the header file\
    \ and add the following code right before the @interface declaration:\n\n```\n\
    ```\n#import <Foundation/Foundation.h>\n\ntypedef enum {\n    LBS,\n    KG\n}\
    \ WeightUnit;\n\n@interface WeightEntry : NSObject {\n```\n```\n\nNow, declare\
    \ our designated initializer right after the @property declarations:\n\n```\n\
    ```\n@property (nonatomic, assign, readonly) CGFloat weightInLbs;\n@property (nonatomic,\
    \ strong, readonly) NSDate* date;\n- (id) initWithWeight:(CGFloat)weight\n   \
    \        usingUnits:(WeightUnit)unit\n              forDate:(NSDate*)date;\n@end\n\
    ```\n```\n\nThis will take a weight, the unit type for our weight, and a date\
    \ and initialize our WeightEntry object. Switch back to the implementation file.\
    \ We need to implement both our designated initializer and our superclass’s designated\
    \ initializer."
