- pgno: 379
  md: '# INTRODUCING CORE DATA


    The Core Data framework provides support for automatically managing many common
    model layer tasks. We have already seen how Xcode simplifies our application’s
    view layer. With Interface Builder, we can draw our application’s scenes. The
    built-in guidelines ensure that our application follows Apple’s Human Interface
    Guidelines, but it goes beyond that. We can draw connections between our view
    and controllers, linking objects to outlets and events to actions. With storyboards,
    we can link scenes with segues, letting us rapidly sketch out the entire application’s
    workflow. With a few clicks of the mouse, Xcode helps us build complex structures
    that would normally require a considerable amount of boilerplate code.


    Core Data brings a similar magic to our model. For most applications, the models
    share a number of features. This includes one or more object graphs. These graphs
    define both the content and the relationships in our application’s data. Applications
    need to manage the life cycles of these object graphs, adding, modifying, and
    deleting objects in the graphs. They also need to validate the graphs, and save
    and load them to disk. Undo and redo support would also be nice. Furthermore,
    if the format of our data changes, we need to migrate our saved data from one
    schema to the next.


    Core Data provides all of these features and more. In many cases, it can perform
    these tasks automatically. In others, it presents a rich API for expanding and
    customizing its behavior. It is also tightly integrated with Xcode’s tool chain.
    Core Data is mature, well tested, and highly optimized. It is used by millions
    of customers across thousands of applications. While we could try to build a custom
    solution to better fit our specific needs, it would require a considerable amount
    of effort to match the performance and stability already provided by Core Data.
    In most cases, it’s more cost effective to just use Core Data and to focus the
    developer effort on other areas.


    And, yes, we can even graphically lay out our object graphs.


    This chapter will start with a quick overview of Core Data’s architecture, to
    give you an idea of how it works and how you might use it for other projects.
    Then we will convert our Health Beat application over from a custom model to Core
    Data. Along the way, we will look at many of the tricks and tips (and possible
    traps) involved in using Core Data.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# CORE DATA IS NOT A DATABASE


    Always remember that Core Data is not a relational database. Yes, we can save
    and load our data. We can search through our data using SQL-like fetch requests.
    We can even use SQLite to persist this data. However, Core Data isn''t simply
    a front end to SQLite. We cannot open arbitrary SQLite databases using Core Data—it
    only works with its own files.


    More importantly, Core Data represents a much broader set of technologies. It
    really is a replacement for much (if not all) of our model layer. After all, Core
    Data has a number of features that have nothing to do with persisting data to
    disk. For example, we can create an in-memory store and simply use Core Data to
    manage the life cycles of our objects, including tracking, managing, and validating
    any changes to those objects at runtime.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Our Core Data model can be divided into two parts. The managed object model
    defines our data’s schema, describing how our data is organized. We also have
    the Core Data stack. This combines both the managed object context (our application’s
    live data) and the persistence stack (for saving and loading our entities to disk).


    # MANAGED OBJECT MODEL


    The NSManagedObjectModel object defines the structure of our data. It describes
    what type of data we can store, and how the individual pieces of data relate.
    We do this by creating one or more entity descriptions. The managed object model
    then maintains the mapping between these descriptions and the corresponding NSManagedObject
    objects in our Core Data stack.


    You can create managed object models programmatically at runtime, but we generally
    use Xcode’s Data Model Design tool to graphically lay out our schema.


    # USING MULTIPLE MODELS


    Each persistent store coordinator must have one and only one data model. For this
    reason, it’s generally best to create a single model for each Core Data stack.


    Of course, there are valid reasons to split up our model. We might want to divide
    a large, complex model across several sub-models to make them easier to work with.
    We may want to combine our application’s model with one defined by a third-party
    library. Or, we may want to create multiple versions of some subsection of our
    model and dynamically load the correct version at runtime. Fortunately, NSManagedObjectModel
    has a number of methods for merging models, allowing us to unify our models before
    passing the combined version to the persistent store.


    # ENTITY DESCRIPTIONS


    Core Data uses the NSEntityDescription class to define our model’s entities. At
    a minimum, this description includes a unique name for the entity and the name
    of the managed object class that will be instantiated in the Core Data stack (either
    NSManagedObject or a custom subclass). Most entities also have one or more properties.


    Properties represent the type of data stored in our entity. They become our instance
    variables when we instantiate objects for our entities. All Core Data'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'properties are completely key-value compliant; Core Data automatically defines
    equivalent Objective-C properties for us. Finally, Core Data supports three types
    of properties: attributes, relationships, and fetched properties. Each specifies
    a different relationship between the entity and its data.


    Attributes are the simplest Core Data property type. They represent values stored
    within the entity itself. Unfortunately, we are somewhat limited in the type of
    attributes that we can use. **Table 7.1** shows the complete list of Core Data
    attribute types and their corresponding Objective-C data types.


    TABLE 7.1 Core Data Attribute Types


    | ATTRIBUTE TYPE | OBJECTIVE-C TYPE |

    |---|---|

    | Undefined | id |

    | Integer 16 | NSNumber |

    | Integer 32 | NSNumber |

    | Integer 64 | NSNumber |

    | Decimal | NSDecimalNumber |

    | Double | NSNumber |

    | Float | NSNumber |

    | String | NSString |

    | Boolean | NSNumber |

    | Date | NSDate |

    | Binary Data | NSData |

    | Transformable | Special |


    Some of these deserve a little special attention. Let’s take the easiest one first.
    Internally, Core Data saves date attributes as the number of seconds since the
    reference date (January 1, 2001 GMT). It doesn’t store the time zone. Internally,
    NSDate operates the same way—however, NSDate will implicitly use the device’s
    default time zone. This means your date values will appear in PST when saved in
    Los Angeles, and in EST when read in New York. If you need to save the time zone
    information, you must explicitly create a separate attribute to store it.'
  merge: -1
  img_proc: true
