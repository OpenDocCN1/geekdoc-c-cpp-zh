- pgno: 518
  md: "```\n```objc\n[self.delegate exportController:self\n               sendMessage:@\"\
    Image Saved\"];\n        }]; // write image block ends\n    }]; // location completion\
    \ handler ends\n    [self.delegate exportControllerFinished:self];\n}\n```\n```\n\
    \nThe first thing we do is call `getLocationWithCompletionHandler:`. Then, inside\
    \ the completion handler block, we instantiate our assets library and call the\
    \ generate `MetadataForLocation:` helper function to generate the required metadata.\
    \ Then we write the image to the photo library.\n\n`writeImageToSavedPhotosAlbum:metadata:completionBlock:`\
    \ takes a CGImage, not a UIImage, but other than that, we simply pass in our image\
    \ and metadata. In the completion block, we display a quick pop-up message to\
    \ let the user know that the file has saved successfully.\n\nThe message pop-ups\
    \ are just like the pop-ups we've seen previously. The only difference is that\
    \ they fade in and then automatically fade out again after a few seconds. Still,\
    \ I'll leave exploring their implementation as an optional homework assignment.\n\
    \nFinally, the last line of code dismisses our export menu. Even though this is\
    \ the last line in the method, it will be called before any of the blocks. This\
    \ means that the export menu will disappear immediately once the button is pressed.\
    \ Then, after the image saves (which could take a while, depending on Core Location),\
    \ a brief notification is flashed on the screen.\n\nThis has two key effects.\
    \ First, the app seems very responsive, since something happens the second they\
    \ tap the button. Next, the user is informed when the image saves, so they aren't\
    \ left worried and unsure.\n\nThere's also another key design point at play here.\
    \ We use a temporary pop-up to alert the user—not an alert view. Alert views are\
    \ great if you have a question that needs to be answered. The problem is they\
    \ bring the app to a complete halt. If you're displaying an alert view with a\
    \ single OK button, then you're probably using it wrong. Instead, try to find\
    \ another way to alert the user without interrupting the application's flow."
