- pgno: 96
  md: "You must also implement any required methods that have not already been implemented.\
    \ Notice that you do not need to declare these methods in the @interface block.\
    \ The protocol takes care of that for you.\n\n# DECLARING PROTOCOLS\n\nProtocol\
    \ declarations look a lot like class declarations, only without the block for\
    \ instance variables. Like the class’s @interface block, protocol declarations\
    \ are normally placed in a header file—either their own header file or the header\
    \ file of a closely related class (e.g., delegate protocols are often declared\
    \ in the delegating class’s header).\n\n```\n```objc\n@protocol ProtocolName\n\
    \n    // Declare required methods here.\n    // Protocol methods are required\
    \ by default.\n    @optional\n    // Declare optional methods here.\n    // All\
    \ methods declared after the @optional keyword are\n    // optional.\n    @required\n\
    \    // Declare additional required methods here.\n    // All methods declared\
    \ after the @required keyword are required\n    // again.\n@end\n```\n```\n\n\
    As you can see, you can use the @optional and @required keywords to partition\
    \ your methods as you see fit. All methods after an @optional keyword (until the\
    \ next @required keyword) are optional. All methods after a @required keyword\
    \ (until the next @optional keyword) are required. Methods are required by default.\n\
    \nOne protocol can also incorporate other protocols. You simply list these in\
    \ angled brackets after the protocol name. Any class that adopts a protocol also\
    \ adopts all the protocols it incorporates.\n\n```\n```objc\n@protocol ProtocolName\
    \ <additional, protocols, to, incorporate>\n...\n@end\n```\n```"
