- pgno: 276
  md: 'There are three common idioms for letting a view controller access a custom
    view’s properties and instance methods. One is to just cast the view pointer whenever
    you need it.


    ```

    [(MyView*) self.view setMyProperty:myValue];

    ```


    This works, but casting is ugly and I try to avoid it wherever possible.


    A second approach involves creating a readonly property to access the custom view,
    encapsulating the cast in the property’s getter. For example, look at the UITableViewController.
    This has both a view and a tableView property. The tableView just calls view and
    casts the result before returning it. This approach requires a bit more code to
    set up, but it produces very clean results.


    ```

    self.myView.myProperty = myValue;

    ```


    The third option is the one we use here. We leverage Objective-C’s dynamic nature
    to avoid explicitly casting our results. Instead, we assign the self.view property
    to an id variable. We can then call any methods we want without getting any compiler
    warnings. It’s not as nice as the readonly property, but it’s a lot quicker for
    a one-off solution.


    The only downside is that we cannot use the property’s dot notation on ids. We
    must call the accessor methods instead.


    We’ve passed our original data to our view, but we still need to detect updates.
    To do this, we register our controller for KVO notifications. We’ve seen this
    before, so there shouldn’t be any big surprises (see “Responding to Changes in
    the Model” in Chapter 4). There are, however, two small surprises. First, we are
    observing our model’s weights virtual property—not the weightHistory property.
    Unlike our history view, we don’t need to know the details of the change. If we
    see any change at all, we simply redraw the whole view. So, observing the weights
    property works perfectly well.


    Additionally, we are using KVO to observe our defaultUnits property directly,
    instead of going through the notification center like we did in Chapter 4. We
    will see why in a second.


    As always, anything we set up in viewDidLoad needs to be torn down in viewDidUnload.
    We added our controller as an observer, so now we must remove it.'
  merge: -1
  img_proc: true
- pgno: 277
  md: "```\n```objc\n- (void)viewDidUnload\n{\n    [super viewDidUnload];\n    [self.weightHistory\
    \ removeObserver:self forKeyPath:WeightKey];\n    [self.weightHistory removeObserver:self\
    \ forKeyPath:UnitsKey];\n}\n```\n```\n\nAnd we still need to catch these notifications.\
    \ Remember, all KVO notifications go through the observeValueForKeyPath:ofObject:change:context:\
    \ method. Let's implement that now.\n\n```\n```objc\n- (void)observeValueForKeyPath:(NSString\
    \ *)keyPath\n                      ofObject:(id)object\n                     \
    \   change:(NSDictionary *)change\n                       context:(void *)context\
    \ {\n    if ([keyPath isEqualToString:WeightKey]||\n        [keyPath isEqualToString:UnitsKey])\
    \ {\n        id graphView = self.view;\n        [graphView\n            setWeightEntries:self.weightHistory.weights\n\
    \            andUnits:self.weightHistory.defaultUnits];\n    }\n}\n```\n```\n\n\
    Having all KVO notifications route through the same method is usually a disadvantage,\
    \ but this time it actually helps simplify things. If we receive a change notification,\
    \ we just verify that it matches one of our two keys. If there is a match—we don't\
    \ even care which one—we call setWeightEntries:andUnits:, resetting both of them.\
    \ Also, remember that setWeightEntries:andUnits: automatically calls setNeedsDisplay,\
    \ causing our view to redraw itself."
  merge: -1
  img_proc: true
