- pgno: 30
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_30_0.png)


    **FIGURE 1.12** Inspecting the main view controller''s class


    Next, segues and relationships define the connections between scenes. Segues act
    as transitions. When the application triggers a segue, it transitions to the next
    scene using the specified animation. Relationships look a lot like segues, but
    they are used to show ownership. Container controllers (like tab view controllers)
    will use relationships to connect to the views they manage.


    If we look at the main view controller, we can see that it has a view outlet pointing
    to the contained view object. This means we can refer to this view object in our
    controller’s code. We also have a referencing outlet from the flipside view controller.
    This simply means that the flipside view controller has an outlet pointing back
    to our main view controller—we will see this in a second (Figure 1.13). There’s
    only one other connection in this scene. Click the info button; as you can see,
    it has a modal storyboard segue connecting its `performSegueWithIdentifier:sender:`
    method to the flipside view controller. The system will call this method automatically
    whenever our info button is pressed, triggering the segue to our flipside view.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_31_0.png)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_31_1.png)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_31_2.png)


    **FIGURE 1.13** The main view controller’s connections


    **FIGURE 1.14** The flipside view controller’s connections


    **FIGURE 1.15** Inspecting the segue’s attributes


    Now let’s look at the flipside view controller (**Figure 1.14**). As we saw earlier,
    we have a delegate outlet that points back to our main view controller. This allows
    our flipside view controller to call methods on the main view controller. Specifically,
    since the main view controller is the flipside view controller’s delegate, the
    flipside view will expect the main view to implement specific methods to modify
    or control the flipside view’s behavior. The flipside view controller also has
    a second outlet connecting it to its view. As you can probably guess, this is
    a general pattern. All view controllers have an outlet connecting to their view.


    The flipside view controller also has two incoming connections. One is the info
    button’s segue that we saw previously. Another represents an incoming action from
    the Done button. We will see this in a second.


    There are only two other connections in this scene. The navigator item refers
    to the Done button in its leftBarButtonItem outlet. This positions the bar button
    correctly in the navigation bar. Additionally, we see the action connection from
    our Done button to the flipside view controller’s done: method. This method will
    be called when the Done button is pressed.


    Finally, select the Attributes inspector (third icon from the right), and select
    the segue. This shows our segue’s details (**Figure 1.15**). The Identifier field
    lets us identify this segue in our code. The Style pop-up menu allows us to define
    how the new view will be displayed, while the Transition pop-up menu allows us
    to define the animation sequence used to move from one view to the next. In our
    case, the segue is named showAlternate. We will present our new scene as a modal
    view, flipping our old view over horizontally to reveal the new view on its back.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'In most graphical user interfaces, a modal view is a view that must be dismissed
    (usually by clicking an OK or Cancel button) before the user can perform any other
    actions in the application. This forces the user to focus on whatever is inside
    the modal view—they must finish dealing with it before they can move on. On desktop
    applications, we generally use modal view to display things like Save or Print
    dialogs. On the iPhone, modal views cover the entire screen (though the iPad has
    a few additional options).


    So, what does this all mean? Well, we’re tracing through how the objects in our
    application get created. The UIApplicationMain() method creates an instance of
    the UIApplication and of our HWAppDelegate class.


    Next, UIApplicationMain() looks up the main storyboard in our application’s info.plist
    file. It then loads the storyboard’s initial scene, displaying our main view controller’s
    view in our application’s window. Our application is then ready for user input.


    If the user touches the info button, our segue launches. This loads the flipside
    view controller and displays it as a modal view. When the user presses the Done
    button, it calls flipside view controller’s done: action. We know this dismisses
    the flipside view, but we don’t yet know how this works. To see that, we have
    to examine the application’s code.


    # EXAMINING THE CODE


    While the storyboard gives us a good overview of our application, to really understand
    it we will need to dig into the code. Don’t worry if it doesn’t all make sense
    yet, we will go over Objective-C in more detail in Chapter 2. For now, we just
    want to get a feel for the things are and what they do.


    Let’s start with HWAppDelegate.h. This declares the interface for the HWAppDelegate
    class. You won’t find anything terribly surprising here. HWAppDelegate implements
    the UIApplicationDelegate protocol—which allows it to act as an application delegate.


    A delegate is an object that acts on behalf of, or in coordination with, another
    object. The delegate typically acts as an assistant to the main, delegating object.
    The main object will call predefined methods on the delegate in response to specified
    events. The delegate then uses those methods to monitor and control the delegating
    object. This allows us to alter the delegating object’s behavior without changing
    the object itself.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "We also declare the window property. As our application loads our storyboard,\
    \ it instantiates a window object and assigns it to this property. Usually, iOS\
    \ applications have a single window that fills the entire screen. This window\
    \ acts as the root for our view hierarchy. It both creates a space where other\
    \ views can be displayed and distributes events to the proper views or subviews.\n\
    \n```\n```objective-c\n#import <UIKit/UIKit.h>\n\n@interface HWAppDelegate : UIResponder\
    \ <UIApplicationDelegate>\n\n@property (strong, nonatomic) UIWindow *window;\n\
    \n@end\n```\n```\n\nThe UIApplicationDelegate protocol defines a wide range of\
    \ optional methods that we can implement to modify our application’s behavior.\
    \ These include methods that respond to changes to the application’s state, as\
    \ well as local, remote, and system notifications. You can find a complete list\
    \ of these methods in the developer documentation.\n\nClicking the word UIApplicationDelegate\
    \ in the editor will bring up a brief description of the protocol in the Quick\
    \ Help inspector (the top half of the Utilities area). This technique lets us\
    \ get a quick description of any classes, methods, or functions. Additionally,\
    \ the Quick Help inspector contains hyperlinks to additional resources. Click\
    \ the hyperlink version of the protocol’s name, and Xcode will open a full description\
    \ from the developer’s documentation. Scroll down to the Tasks section to see\
    \ a full list of methods.\n\nIf you open the HWAppDelegate.m file, you can see\
    \ that we defined several of these methods—but none of them do anything. Right\
    \ now, they are simply method stubs—holding spaces, waiting for us to fill in\
    \ the details.\n\n```\n```objective-c\n#import \"HWAppDelegate.h\"\n\n@implementation\
    \ HWAppDelegate\n\n@synthesize window = _window;\n\n- (BOOL)application:(UIApplication\
    \ *)application\ndidFinishLaunchingWithOptions:(NSDictionary *)launchOptions\n\
    {\n    // Override point for customization after application launch.\n```\n```"
