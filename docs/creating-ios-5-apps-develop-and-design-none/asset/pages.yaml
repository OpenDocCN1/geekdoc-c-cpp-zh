- pgno: 452
  md: '# CUSTOMIZING THE INTERFACE''S APPEARANCE


    Often the standard user interface elements work just fine. They''re reasonably
    attractive. Users recognize them and understand them. They know exactly what they
    do and how to use them. But let''s face it: If you just use Apple''s default controls,
    your application may begin to look somewhat bland. Sometimes it''s important to
    color outside the lines.


    How radical should your interface be? The answer depends on a number of things.
    What kind of application are you building? How comfortable are your users with
    new interfaces? How clearly can you communicate its intended use? While I can''t
    answer these questions for you, I can show you some techniques to help you when
    you start striking out on your own.


    Right off the bat, our GravityScribbler app needs to make two important changes
    to the default application behavior. As an immersive app, we want to seize control
    of the entire screen, hiding the device''s status bar. This isn''t something we
    should do lightly. The status bar contains vital information, including the time
    and the battery status. Hiding the status bar means your users won''t have access
    to that information while using your app. Still, in many cases it''s necessary
    to hide the status bar. If you''re trying to build an immersive application, it
    can be a real distraction. Nobody wants to see the status bar while watching movies.
    Similarly, we don''t want it to appear in GravityScribbler.


    We also want to disable the system''s idle timer. Again, the idle timer usually
    performs a vital role. If the application doesn''t detect any user touches for
    a short period, it will dim the screen and then put the device to sleep. This
    helps save battery power when the device is not in use. Unfortunately, in our
    case, the user may use the device for long periods without ever touching the screen.
    Instead, they control the cursor using the accelerometer, and we don''t want our
    application to go to sleep while someone is using it.


    Both of these changes are incredibly easy to make. Add the following lines of
    code to the application delegate''s application:didFinishLaunchingWithOptions:
    method.


    ```

    UIApplication* app = [UIApplication sharedApplication];

    [app setStatusBarHidden:YES];

    [app setIdleTimerDisabled:YES];

    ```'
