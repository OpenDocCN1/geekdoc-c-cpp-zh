- pgno: 29
  md: 'The initial scene appears in the Interface Builder area with an incoming arrow
    pointing at it. Unlike segues and other relationships, this arrow doesn''t have
    a scene on the other end. By default, the incoming arrow starts at the left edge
    of Interface Builder. The initial scene is the first scene, with additional scenes
    branching out as we move to the right.


    We can change the initial scene by selecting a different view controller and selecting
    its “is Initial View Controller” attribute. Only one view controller at a time
    can have this attribute enabled. If you enable it in a new view controller, Interface
    Builder will automatically disable it for the old controller.


    In our case, the main view controller scene is our initial scene. This is exactly
    what we want. Make sure we are zoomed in on the main scene. Double-clicking the
    background will toggle the zoom between an overview of the entire storyboard and
    the actual-size view.


    Let’s start by clicking each object in the main scene and examining its class.
    In the inspector selector bar, make sure the Identity inspector is selected (third
    icon from the left at the top of the Utilities area). Then click on the main view
    controller. Not surprisingly, it is an instance of the HWMainViewController class
    (Figure 1.12).


    As we check the rest of the objects, you should see that our view is a generic
    UIView. Inside that, we have a UIButton (the info button at the lower-right corner).
    Finally, the segue doesn''t display any information in the Identity inspector.


    Moving on to the flipside view controller scene, we have a HWFlipsideViewController.
    Inside this, we have another UIView; however, at the top of this view we have
    a UINavigation bar, with a UINavigationItem. Inside that, we have our Done button—a
    UIBarButtonItem.


    Now switch to the Connection inspector (far right icon at the top of the Utilities
    area). This lets us view and edit the connections between objects. While it can
    appear somewhat complex, this inspector only shows five connection types: outlets,
    actions, events, segues, and relationships.


    The first three are used to define connections within a single scene. Outlets
    are variables that can store a pointer to an object. They define the relationships
    between objects in our graph. Actions, on the other hand, are methods that we
    can connect to events. When an event occurs, the system automatically calls its
    corresponding action. Controls define a set of common events that occur when the
    user interacts with the control.'
  merge: -1
