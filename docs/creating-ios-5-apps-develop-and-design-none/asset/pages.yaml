  md: 'NSManagedObject also creates primitive accessors. These take the form primitive<Key>
    and setPrimitive<Key>:. Unlike the public accessors, these do not trigger KVO
    notifications. We will typically use these primitive accessors when writing our
    own custom accessors. We will see some examples later.


    While these auto-generated accessors are cool, they have a downside. Unfortunately,
    the compiler does not know about these methods, so they may generate warnings
    (and if you''re following my advice, these warnings will be treated like errors,
    preventing your app from building successfully). There are a couple of ways around
    this. First, we can always use key-value coding to access data from raw managed
    objects. Alternatively, we could create a category on NSManagedObject that declares
    the properties. Finally, we could create a custom subclass for our entity.


    Xcode 4 makes creating custom subclasses easy. Just select File > New > New File
    and select the iOS > Core Data > NSManagedObject subclass template. Xcode will
    automatically generate the properties for you and link your subclass to its entity
    in the managed object model.


    Custom subclasses are particularly important when you need to implement custom
    accessors or validation methods, implement non-standard attributes, specify dependent
    keys, calculate derived values, or implement other custom logic. However, there
    are a few points you should keep in mind when subclassing NSManagedObject:


    +   - Core Data relies on NSManagedObject''s implementation of these methods to
    function properly: primitiveValueForKey:, setPrimitiveValue:forKey:, isEqual:,
    hash, superclass, class, self, zone, isProxy, isKindOfClass:, isMemberOfClass:,
    conformsToProtocol:, respondsToSelector:, managedObjectContext, entity, objectID,
    isInserted, isUpdated, isDeleted, and isFault. You should never override any of
    these methods.

    +   - You are discouraged from overriding the following methods: description,
    initWithEntity:insertIntoManagedObjectContext:, valueForKey:, and setValue:forKeyPath:.
    If they are not handled properly, they can cause unexpected results.

    +   - You should invoke the superclass''s implementation before executing your
    own code for the following methods: awakeFromInsert, awakeFromFetch, and validation
    methods like validateForUpdate:.'
