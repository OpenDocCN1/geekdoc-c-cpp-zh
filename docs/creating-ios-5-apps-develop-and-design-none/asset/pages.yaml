- pgno: 302
  md: 'In Health Beat, the user will generally open the application and enter a new
    weight. We want to make this as quick and easy as possible. Therefore, instead
    of saving and restoring the user''s last position, we should always open to the
    enter weight view. Fortunately, this means we don''t need to save our interface''s
    state; we can focus on our model.


    Unfortunately, before we can do that, we have to prepare our application to support
    iCloud.


    # ## PREPARING THE APPLICATION


    Before we begin using iCloud storage, we have to make sure our provisioning profile
    has iCloud support enabled. In most cases, Xcode will handle this automatically.
    Since the iOS 5 release, the generic app id (and therefore the default provisioning
    profile created by Xcode) will have iCloud enabled. However, if you set up your
    development tools prior to the iOS 5 release, you may need to refresh your provisioning
    profile.


    Next, we need to set the entitlements for our application. As mentioned previously,
    we need an entitlements file with two iCloud identifiers. The first is for document
    storage, the second for key-value storage. The entitlements provide a measure
    of security for your application, ensuring that your documents are only accessible
    by your own apps. Additionally, the system uses the entitlements to identify your
    application''s documents and distinguish them from other documents within iCloud
    storage.


    The entitlements file contains a number of key-value pairs. For document storage,
    the com.apple.developer.ubiquity-container-identifiers key should contain an array
    of strings representing bundle identifiers for applications created by our team.
    All bundle identifiers use the following format: <DEVELOPER_ID>.<BUNDLE_IDENTIFIER>.
    Here <DEVELOPER_ID> is the unique ten-character identifier associated with your
    individual or team account. You can find this by viewing your account information
    at Apple''s Developer Member Center (http://developer.apple.com/membercenter).
    <BUNDLE_IDENTIFIER> is the target application''s identifier.


    We do not have to use the bundle identifier for our current application. For example,
    a lite app may use the pro app''s bundle identifier, guaranteeing continued access
    to the files after the user upgrades. We can also use multiple identifiers, giving
    us access to a number of different containers. While the first bundle identifier
    must be explicitly defined, any secondary identifiers can use wildcards. This
    lets us implicitly refer to a number of applications without having to list them
    individually.'
