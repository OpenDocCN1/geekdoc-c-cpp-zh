    ~~~

    ```


    Next, we register for notifications from our query object. Queries typically operate
    over two distinct phases. During the initial search phase, they will gather all
    the information on documents currently in the iCloud container. Remember, our
    device will have metadata on all the files in the container; however, the actual
    files may not be on the device yet.


    These results may be returned in batches. The query will post an NSMetadataQueryGatheringProgressNotification
    with each batch. Once the entire search is completed, it posts NSMetadataQueryDidFinishGatheringNotification
    and the query enters its live-update phase. In this phase, the query will continue
    to monitor our iCloud storage container and will post NSMetadataQueryDidUpdateNotification
    notifications whenever it detects a change.


    In our case, we know there''s only a single file, so we simply wait for the initial
    search to complete. However, if an application may have a large number of files,
    it will be better to process each batch as it arrives.


    Once we receive the notification, our system will run our block. Here, we disable
    updates. Then we remove ourselves as an observer. We call processQuery:thenCall:
    to actually process the query results, and then we shut down our query. Always
    remember to shut down your queries. You don''t want to leave them running any
    longer than necessary.


    Finally, after we''re finished registering for notifications, we start our query.
    Remember, the code is not executed in the order it appears on the screen. This
    often happens with block-based API. The startQuery method is executed well before
    the notification block. This can be confusing. Just remember that blocks are often
    called asynchronously—which means the code inside them may be called at some undefined
    point in the future.'
