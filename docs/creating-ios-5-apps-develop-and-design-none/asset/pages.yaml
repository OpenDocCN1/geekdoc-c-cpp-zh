  md: '# OTHER DOCUMENT STATE CHANGES


    UIDocument has four unique state flags, UIDocumentStateClosed, UIDocumentStateInConflict,
    UIDocumentStateSavingError, and UIDocumentStateEditingDisabled, plus UIDocumentStateNormal—which
    simply means none of the other flags are set.


    We''ve already added support for the UIDocumentStateInConflict to our WeightHistory
    class—but this is really just the bare minimum we need to make sure our app functions
    properly. Ideally, we should also alert users whenever we have trouble saving
    their changes or whenever the document editing is disabled. Document editing,
    in particular, will be disabled temporarily whenever the application receives
    an update from iCloud.


    In our case, we want to inform the user of these state changes whenever they have
    the EnterWeightViewController view open. The EnterWeightViewController is our
    primary interface for modifying our weight history. Ideally, the other views should
    respond to these notifications as well (e.g., disabling the edit button in the
    history view whenever document editing is disabled would be nice), but I will
    leave that as homework.


    Let''s start by adding a new label to our enter weight scene. Open MainStoryboard.storyboard
    and zoom in on our enter weight view controller. Drag a label out and position
    it below the text field. Stretch it until it fills the view from margin to margin,
    and then set the text attributes to center-aligned, 15-point System Bold font
    with red text color. Next, change the autosizing settings so that it''s locked
    to the left, right, and top and stretches horizontally. Finally, change the text
    to **Unable to Save Changes**. It should now match Figure 6.5.


    Most of the time, we will hide this label, only displaying it when the document
    enters a UIDocumentStateSavingError state. However, before we can make it appear
    and disappear, we need access to it in our code. This means we have to link it
    to an outlet.


    Switch to the Assistant editor and make sure the right editor shows EnterWeightViewController.h.
    Right-click and drag from the label to a space just below the properties. In the
    pop-up window, make sure it''s a strong UILabel outlet, and then set the name
    to saveWarningLabel.'
