  md: "To check if a class is available, we simply call [<class name> class]. If this\
    \ returns nil, the class is not available. To see if a method is available, we\
    \ simply call the object's respondsToSelector: method. To see if a function is\
    \ available, check to see if the function's name evaluates to NULL.\n\n```\n \
    \   if ([UIDocument class]) {\n        // We can use UIDocument.\n    } else {\n\
    \        // We must use old-school file I/O.\n    }\n\n    if ([self respondsToSelector:\n\
    \        @selector(childViewControllers)]) {\n        // We can create a custom\
    \ UIViewController container.\n    }\n\n    if (UIAccessibilityIsClosedCaptioningEnabled\
    \ != NULL) {\n        // The function is safe to use.\n    }\n```\n\nUnfortunately,\
    \ the [<class name> class] test is only available if the base SDK is 4.2 or greater,\
    \ and if the deployment target is 3.1 or greater. So if you're supporting iOS\
    \ 3.0, you need to use a more verbose test.\n\n```\nClass cls = NSClassFromString(@\"\
    UIDocument\");\nIf (cls) {\n    // We can use the document.\n} else {\n    //\
    \ We still have to use old-school file I/O.\n}\n```\n\nAdditionally, if you're\
    \ going to be developing for earlier devices, you will need to download the debugging\
    \ support. Select Xcode > Preferences from the main menu. Switch to the Downloads\
    \ tab and download the required components.\n\nOn the surface, this is amazing.\
    \ It means we can have our cake and eat it too. We can support old iOS 3.0 phones\
    \ while also on newer devices enabling the newest"
