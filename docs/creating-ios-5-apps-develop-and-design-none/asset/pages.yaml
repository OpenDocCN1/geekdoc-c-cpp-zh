- pgno: 211
  md: "```\n```objective-c\nbottomGradient.colors = [NSArray arrayWithObjects:\n \
    \                        (__bridge id)topColor.CGColor,\n                    \
    \     (__bridge id)bottomColor.CGColor, nil];\n\n// Round the corners.\n[self.doneButton.layer\
    \ setCornerRadius:8.0f];\n\n// Clip sublayers.\n[self.doneButton.layer setMasksToBounds:YES];\n\
    \n// Add a border.\n[self.doneButton.layer setBorderWidth:2.0f];\n[self.doneButton.layer\n\
    \    setBorderColor:[[UIColor lightTextColor] CGColor]];\n\n// Add the gradient\
    \ layers.\n[self.doneButton.layer addSublayer:topGradient];\n[self.doneButton.layer\
    \ addSublayer:bottomGradient];\n}\n```\n```\n\nThere’s a lot going on here, so\
    \ let’s step through it slowly. This code modifies our button’s Core Animation\
    \ layer. The CALayer is a lightweight object that encapsulates the timing, geometry,\
    \ and visual properties of a view. In UIKit, a CALayer backs each UIView (and\
    \ therefore, anything that inherits from UIView). Because of the tight coupling\
    \ between layers and views, we can easily access and change the visual properties\
    \ contained in our button’s layer.\n\nWe start by creating a CAGradientLayer and\
    \ giving the layer a name. We will use this name to identify our gradient layer\
    \ in later methods. Next, we calculate the frame for this layer. We start with\
    \ the button layer’s bounds, but we divide the height in half. Remember, the frame\
    \ is the object’s coordinates and size in the containing view or layer’s coordinate\
    \ system. The bounds represent the object’s coordinates and size in its own coordinate\
    \ system. In other words, the origin is almost always set to {0.0f, 0.0f} (there\
    \ are situations where you might use a non-zero origin as an offset, for example\
    \ when clipping part of an image, but these cases are rare). Using the superlayer’s\
    \ bounds for the sublayer’s frame means the sublayer will fill the superlayer\
    \ completely. By dividing the height in half, we end up with a sublayer that will\
    \ cover just the top half of the main layer."
