- pgno: 105
  md: 'As before, we create our parent and child objects, each with a reference count
    of 1. This time, the parent gets a reference to the child, and the child gets
    a reference to the parent, increasing both reference counts to 2. At the end of
    our method, ARC automatically releases our objects, dropping both reference counts
    back to 1. Since neither reference count has been reduced to 0, neither object
    gets deallocated, and our retain cycle creates a memory leak.


    Fortunately, ARC has a solution for us. We simply need to redefine the parent
    property so that it uses a zeroing weak reference. Basically, this means changing
    the property attribute from strong to weak.


    ```

    ~~~objective-c

    @interface Person : NSObject


    @property (nonatomic, weak) Person* parent;


    @property (nonatomic, strong) Person* child;


    + (void)myMethod;


    @end

    ~~~

    ```


    Zeroing weak references provide two key advantages. First, they do not increment
    the object’s retain count—therefore they do not extend the lifetime of the object.
    Second, the system automatically sets them back to nil whenever the objects they
    point to are deallocated. This prevents dangling pointers.


    Applications typically have object graphs that branch out from a single root object.
    We will usually use zeroing weak references when referring to objects back up
    the graph (anything closer to the graph’s root). Additionally, we should use zeroing
    weak references for all our delegates and data sources (see the “Delegates” section
    later in this chapter). This is a standard convention in Objective-C, since it
    helps prevent inadvertent retain cycles.


    So far, the cycles we have seen have all been somewhat obvious, but this is not
    always the case. A retain cycle can include any number of objects—as long as it
    eventually loops back on itself. Once you get beyond three or four levels of references,
    tracking possible cycles becomes nearly impossible. Fortunately, our developer
    tools come to the rescue again.


    With Xcode 4.2, Instruments now has the ability to search for retain cycles, and
    it will even display the retain cycle graphically.'
  merge: -1
