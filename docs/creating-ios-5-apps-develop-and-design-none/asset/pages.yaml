- pgno: 143
  md: '# **TASKS EVERY APPLICATION SHOULD PERFORM (continued)**


    # **Low Memory Warnings**


    These methods are called whenever your application receives a low memory warning.
    You should implement these methods to free up any unneeded memory. If the low
    memory condition persists, your app may crash, and memory shortages are the most
    common source of iOS application crashes.


    `applicationDidReceiveMemoryWarning:`


    This UIApplicationDelegate method is called when the application receives a low
    memory warning. You can use it to free up any unneeded memory (for example, any
    cache memory your app may be holding onto).


    `didReceiveMemoryWarning`


    This UIViewController method is called when the application receives a low memory
    warning. By default, if the controller''s view does not have a superview (so it
    is not currently being displayed), and if it can be rebuilt either by calling
    loadView or by loading it from a nib, then the view is unloaded.


    Most of the time, the default implementation is sufficient. You can override this
    method and perform any additional actions to free up memory here, but be sure
    to call the super method when you are done.


    `viewDidUnload`


    This UIViewController method is called whenever the view is unloaded as part of
    a low memory warning. The viewDidUnload method is often the inverse of viewDidLoad.
    Anything you created in viewDidLoad should be released in viewDidUnload.


    In addition, if you have any outlets or instance variables that contain references
    to user interface elements (such as buttons, text fields, or subviews), you should
    release them here. These will be rebuilt when the view is reloaded.


    Additionally, you should not refer to self.view (or similar variants, such as
    self.tableView) in this method. This will force the view to reload, and since
    you are experiencing a memory shortage, it could cause the app to crash.'
