- pgno: 58
  md: 'to represent ASCII characters). The integer types include BOOL, char, short,
    int, long, and long long data types. The main difference between them is the number
    of bits used to represent each value. The more bits, the wider the range of possible
    values—however, the data also takes up more space. Discrete values also come in
    signed and unsigned variants. This determines how the numbers are interpreted.
    Signed data types can be both positive and negative numbers, while unsigned data
    types are always zero or greater.


    > > **NOTE:** The exact size of the data type can vary depending on both the compiler
    that you are using and the target platform. For example, int values could be either
    32 or 64 bits long. As a result, your program shouldn''t make assumptions about
    either the number of bits or the minimum and maximum values of each data type.
    Instead, use the sizeof() function and the macros defined in limits.h and float.h
    to determine these values at runtime.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_58_0.png)


    Floating-point values (float and double) are used to approximate continuous numbers—basically,
    any number with a decimal point. I won’t go too deep into the theory and practice
    of floating-point numbers here—you can find all the eye-bleeding detail in any
    introductory computer science book. Suffice it to say, floating-point numbers
    are only approximations. Two mathematical formulas that are identical on paper
    may produce very different results. However, unless you are doing scientific calculations,
    you will probably only run into problems when comparing values. For example, you
    may be expecting 3.274 but your expression returns 3.273999999999999. While the
    values aren’t equal, they are usually close enough. Any difference you see is
    probably the result of rounding errors. Because of this, you will often want to
    check to see if your value falls within a given range (3.2739 < x < 3.2741) rather
    than looking for strict equality.


    C has two types of floating-point values: float and double. As the name suggests,
    a double is twice as big as a float. The additional size improves both the range
    and the precision of its values. For this reason, it is tempting to always use
    doubles instead of floats. In some programming languages, this is idiomatically
    correct. I could probably count the number of times I used floats in Java on one
    hand. In Objective-C, however, floats are much more common.


    In fact, despite the wide range of available C data types, we will typically only
    use BOOL, int, and floats. However, it often feels like we are using a much broader
    range of data types, since the core framework frequently uses typedef to create'
