  md: '**FIGURE 6.1** Setting the entitlements


    ![](img/fe9fea534a8e7868f811f7cd33da015f_303_0.png)


    For key-value storage, we need to define the com.apple.developer.ubiquity-kvstore-identifier
    key. This takes a single bundle identifier—we cannot use multiple containers.
    Most of the time this should match our primary document storage key.


    As you can see, finding and setting the bundle identifiers can require a bit of
    work. Fortunately, there’s a very easy way to automatically generate your Entitlements
    file and set up both document and key-value storage. In the Project navigator,
    select the Health Beat application icon. Then, in the Editor area, make sure that
    both the Health Beat target and the Summary tab are selected. Scroll down until
    you find the Entitlements settings, and select the Enable Entitlements checkbox.
    This will automatically fill in the iCloud Key-Value Store and iCloud Containers
    settings with the bundle identifier for the current target (Figure 6.1).


    Next, we want to set up the document types and exported Uniform Type Identifiers
    (UTIs). This lets us to define a unique UTI for our application. Unfortunately,
    this won’t do much for us right now. However, it will let us properly label our
    application’s iCloud data when we submit the application using iTunes Connect.'
