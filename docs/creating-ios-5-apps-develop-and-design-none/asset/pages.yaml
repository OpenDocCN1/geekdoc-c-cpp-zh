- pgno: 19
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_19_0.png)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_19_1.png)


    **FIGURE 1.2** Selecting the iOS Utility Application template


    **FIGURE 1.3** Selecting the project options


    # CREATING THE PROJECT


    With the workspace open, create a new project. In Xcode, select File > New > New
    Project. This will open the project template sheet (Figure 1.2). Xcode provides
    a wide range of templates for new projects. In the left-hand column, select iOS
    > Application. Then, select the icon for Utility Application and click Next.


    We’re now ready to choose the options for our project (Figure 1.3). Enter **Hello
    World** in the Product Name field. The company identifier should be a unique string
    that identifies your company. In most cases, we will use the company’s domain
    name, with the levels reversed. Start with the top-level domain and work toward
    the second- and third-level domains. For example, I would use the reversed domain
    name from my blog: com.freelancemadscience.


    Next, we have the class prefix. This prefix is automatically added to all the
    class names generated by the template. You can use any prefix you like. Just try
    to make it unique (e.g., avoid NS or UI since they are already used by Apple’s
    frameworks). Typically, I select an abbreviation based on the project’s name.
    In this case, enter **HW**.


    **NOTE:** If you are writing a framework or library, you should prefix all your
    classes. This lets other developers use your code without worrying about possible
    naming conflicts. It also makes it easier to identify where a class comes from.
    For example, all classes starting with “RGS” come from my ReallyGreatStuff framework.
    If, however, you are simply writing an application, prefixes are not necessary,
    and I find that they often make the code harder to read. Still, I often let Xcode
    prefix the auto-generated files, just to make them easy to distinguish from our
    hand-crafted classes.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_19_2.png)'
  merge: -1
