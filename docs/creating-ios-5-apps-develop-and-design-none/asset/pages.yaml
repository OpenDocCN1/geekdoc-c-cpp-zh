- pgno: 181
  md: "# SECRET **KEYBOARD OPTIONS**\n\n> As of iOS 4.1 there is a new keyboard type,\
    \ the UIKeyboardTypeDecimalPad. This keyboard has only numbers, a decimal point,\
    \ and a backspace. At first glance, this appears perfect for this project. However,\
    \ it does not have a Return key—and we really want to allow the user to submit\
    \ the weight value directly from the keyboard.\n> \n> We could add a Return key\
    \ (possibly in a custom input accessory view; see the Text, Web, and Editing Programming\
    \ Guide for iOS), but that creates a more complex user interface.\n> \n> iOS 5.0\
    \ adds another keyboard type, the UIKeyboardTypeTwitter. While not particularly\
    \ useful for this project, the Twitter keyboard is optimized for writing tweets.\
    \ It displays all the letters plus the @ and # keys.\n> \n> Unfortunately, neither\
    \ of these options appears in Interface Builder—at least, not in the current version\
    \ of Xcode. Instead, you must set the text field's keyboardType property in code.\
    \ This isn't hard. In the viewDidLoad method, just add self.weightTextField.keyboardType\
    \ = UIKeyboardTypeDecimalPad; or self.weightTextField.keyboardType = UIKeyboardTypeTwitter;.\n\
    \n# SET AUTOROTATING AND AUTOSIZING\n\nWe will want our view to rotate into any\
    \ orientation. There are two steps to this. First, we must modify the controller\
    \ to allow autorotation.\n\nOpen EnterWeightViewController.m and navigate to the\
    \ shouldAutorotateToInterfaceOrientation: method. This method should return YES\
    \ if the controller's view can rotate to the given interfaceOrientation. In the\
    \ default implementation, it allows rotation only into the right-side-up portrait\
    \ orientation.\n\nTo allow the app to rotate into any orientation, simply have\
    \ the method return YES, as shown here:\n\n```\n- (BOOL)shouldAutorotateToInterfaceOrientation:\n\
    \    (UIInterfaceOrientation)interfaceOrientation {\n    return YES;\n}\n```"
