- pgno: 191
  md: "In the last chapter, we used number formatters to create number strings that\
    \ would format properly regardless of the device's language and country settings.\
    \ In this chapter, we will see the other side. We will use the NSNumberFormatter\
    \ to verify and filter the user's input. Here, we set it to accept only positive\
    \ decimal numbers. We will also use the formatter to parse the user input, converting\
    \ it from a string into a float value.\n\nAgain, anything we set up in viewDidLoad\
    \ needs to be torn down in viewDidUnload. Add the following line:\n\n```\n```objective-c\n\
    - (void)viewDidUnload\n{\n    [self setWeightTextField:nil];\n    [self setDateLabel:nil];\n\
    \    self.unitsButton = nil;\n    self.numberFormatter = nil;\n    [super viewDidUnload];\n\
    }\n```\n```\n\nWe still need to reset the screen each time it appears. Remember,\
    \ a view might be created only once but appear many times. Actually, it's even\
    \ more complicated than this. A view may be loaded and unloaded multiple times\
    \ (usually due to memory shortages). Each time it is loaded, it may appear onscreen\
    \ more than once. Therefore, it's important to think things through. Which configuration\
    \ items need to be performed once and only once? These are typically performed\
    \ in the application delegate's application:didFinishLaunchingWithOptions: method.\
    \ Which configuration items should be performed each time a view loads? These\
    \ should be performed in the view controller's viewDidLoad method. Finally, which\
    \ ones should be performed every time the view appears onscreen? These are done\
    \ in the viewWillAppear: or viewDidAppear: method."
  merge: -1
  img_proc: true
- pgno: 192
  md: '# ### viewWillAppear: AND viewDidAppear:


    The viewWillAppear: and viewDidAppear: methods can be somewhat confusing. For
    the most part, the system calls these methods whenever a view controller is used
    to display another view controller. This includes displaying modal views, adding
    new views to a navigation controller, or switching between views on a tab bar.
    The system will even call these notification methods when a view reappears. For
    example, when returning from a modal view or when a covering view is popped off
    the navigation stack.


    However, manually adding a view using the addSubview: method does not trigger
    these notifications. Nor does changing a view''s hidden or alpha properties to
    hide or show a view. And, just to make things even more confusing, adding a view
    to the application''s window using addSubview: will trigger the notifications
    (though in iOS 4.0 and later, you should assign the view controller to the window''s
    rootViewController property instead).


    While these rules and exceptions may seem confusing, they do point to a common
    design problem. If your view appears onscreen but your view controller''s viewWillAppear:
    and viewDidAppear: methods are not called, you may have an inconsistent view hierarchy.
    This occurs when you add a view to the view hierarchy without properly adding
    its view controller to the view controller hierarchy.


    There are a number of ways to fix this. Most simply, you could get rid of the
    view controller and add the view directly to its superview''s controller. After
    all, view controllers often manage more than one view at a time. We''re doing
    this anytime we create an outlet for one of our controls.


    Alternatively, in iOS 5.0 we could create a custom container view controller and
    use it to present our subview''s controller. As the name suggests, a container
    view controller manages one or more other view controllers. Examples in UIKit
    include UINavigationController, UITabViewController, and UIPageViewController.
    iOS 5 has extended the UIViewController class, giving us methods to add (addChildViewController:)
    or remove (removeFromParentViewController) controllers from the controller hierarchy.
    This allows us to create a controller hierarchy that mirrors our views. As a result,
    the system can correctly forward important messages along both hierarchies.


    For more information, check out the UIViewController documentation. In particular,
    look at the automaticallyForwardAppearanceAndRotationMethodsToChildViewControllers
    property. This contains a list of all the messages that need to be forwarded along
    the view controller hierarchy. We will also create our own custom container view
    controller in the “Creating a UIViewController Container” section of Chapter 8.'
  merge: -1
  img_proc: true
- pgno: 193
  md: "In our case, we want to update the current date and make sure our text field\
    \ is ready to receive new information. Implement the viewWillAppear: method as\
    \ shown:\n\n```\n```objective-c\n- (void)viewWillAppear:(BOOL)animated {\n   \
    \ // Sets the current time and date.\n    self.currentDate = [NSDate date];\n\
    \    self.dateLabel.text =\n        [NSDateFormatter localizedStringFromDate:self.currentDate\n\
    \            dateStyle:NSDateFormatterLongStyle\n            timeStyle:NSDateFormatterShortStyle];\n\
    \    // Clear the text field.\n    self.weightTextField.text = @\"\";\n    [self.weightTextField\
    \ becomeFirstResponder];\n    [super viewWillAppear:animated];\n}\n```\n```\n\n\
    Here we create a new NSDate object set to the current date and time. We then use\
    \ the NSDateFormatter class method localizedStringFromDate:dateStyle:timeStyle:\
    \ to produce a properly localized string representation. As you might expect,\
    \ the formatting of dates and times also varies greatly from country to country\
    \ and language to language. The NSDateFormatter lets us easily create date strings\
    \ based on the device’s language and region settings.\n\n> **NOTE:** Both NSNumberFormatter\
    \ and NSDateFormatter are subclasses of the NSFormatter abstract class. NSFormatter\
    \ is designed to act as a base class for objects that format, validate, or parse\
    \ strings. For more information on using formatters or even creating your own,\
    \ see the Data Formatting Guide in Apple’s documentation.\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_193_0.png)\n\
    \nNext, we clear the text field and make it the first responder. Making a text\
    \ field the first responder will automatically display the keyboard. Now, we’ve\
    \ already linked the text field’s Did End On Exit event to the saveWeight: method.\
    \ This method will be called whenever the keyboard’s Done button is pressed."
  merge: -1
  img_proc: true
- pgno: 194
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_194_0.png)


    **FIGURE 4.12** Adding a swipe gesture recognizer


    As we described earlier, this provides a very streamlined system for entering
    the weights. When the user opens this view, the text field is automatically selected
    and the keyboard is ready and waiting. The user just types in the weight value
    and presses Done. They don''t need to select the text box or press a Save button.
    Everything is simple, automatic, and clean.


    However, it does create one small problem. The keyboard covers our tab bar. This
    prevents our users from navigating away from this screen without entering a new
    weight.


    Obviously, this is not ideal. We need to provide a way (preferably something intuitive
    and non-intrusive) to dismiss the keyboard, giving us access to the tab bar again.
    Let''s add a gesture recognizer that responds to a simple down swipe.


    Open `MainStoryboard.storyboard` again. Drag a swipe gesture recognizer from the
    library and drop it onto the enter weight view controller scene''s main view (**Figure
    4.12**).


    The gesture recognizer will appear in the scene''s dock. Select it and open the
    Attributes inspector. Set the Swipe attribute to Down. Leave the Touches attribute
    at 1. This will now trigger on a single-finger, downward swipe.'
  merge: -1
  img_proc: true
