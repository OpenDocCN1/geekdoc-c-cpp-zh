- pgno: 108
  md: 'are closely related. In fact, Foundation provides Objective-C interfaces for
    many Core Foundation services and data types.


    Now here’s the cool part. Many Foundation and Core Foundation data types are actually
    interchangeable. Under the skin, NSString and CFString are identical. We can freely
    pass a CFString reference to an Objective-C method expecting an NSString—or pass
    an NSString to a Core Foundation function expecting a CFString. This interoperability
    is referred to as toll-free bridging (see Apple’s Cocoa Fundamentals Guide > Cocoa
    Objects > Toll-Free Bridging for more information).


    Unfortunately, when casting back and forth, memory management quickly becomes
    confusing. Who is responsible for managing which data? Will we manually manage
    the memory using CFRetain() and CFRelease(), or will we let ARC take care of it?


    There are three basic scenarios we need to be aware of: Core Foundation data returned
    by Objective-C methods, code that uses Core Foundation memory management functions,
    and code that transfers data to and from Core Foundation without using any memory
    management functions.


    The first case is easy. If we get access to a Core Foundation object by calling
    an Objective-C method, we don’t need to do anything at all. We can freely cast
    the data, and the compiler won’t generate any errors.


    This works because Objective-C methods all follow Objective-C memory management
    conventions (see Apple’s Memory Management Programming Guide for more information).
    ARC understands these conventions, correctly interprets the data’s ownership,
    and does the right thing.


    ```

    ```

    UIImage* myImage = [UIImage imageNamed:@"myPhoto"];

    id myCGImage = (id)[myImage CGImage];

    [photoArray addObject:myCGImage];

    ```

    ```


    In this sample, we call UIImage’s CGImage property. This returns a CGImageRef.
    Then we cast the C data to an Objective-C id and place it in an array. Because
    we used an Objective-C method to access the C data, the compiler allows the simple
    cast, and ARC handles the rest.


    Next, if we call any Core Foundation memory management functions, we need to let
    ARC know about it. These functions include CFRetain(), CFRelease(), and any function
    that has the words Create or Copy embedded in its name (see Apple’s Memory Management
    Programming Guide for Core Foundation for more information).'
