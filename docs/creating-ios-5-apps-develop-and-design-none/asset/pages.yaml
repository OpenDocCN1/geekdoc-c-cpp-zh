    This adds the Settings.bundle file to your application. If you expand this bundle,
    you will see that it contains an empty English-language localization folder (en.lproj)
    and a file named Root.plist (Figure 6.8).


    We’ve brushed up against property lists (or plists) a few times now. Basically,
    these files store key-value pairs. However, since the values can include arrays
    and dictionaries, we can create rather complex data structures. Property list
