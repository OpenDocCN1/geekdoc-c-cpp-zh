- pgno: 54
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_54_0.png)


    If you want to develop native iOS applications, you must learn Objective-C. For
    many, this is an intimidating task with a steep learning curve. Objective-C mixes
    a wide range of C-language constructs with a layer of object-oriented design.
    In addition, iOS applications leverage a wide range of design patterns. While
    these patterns provide both flexibility and power, they can often confuse beginners.


    This chapter presents a thorough overview of the Objective-C features needed to
    successfully develop iOS applications, as well as an explanation of new technologies
    that tame Objective-C’s more complex aspects. This will help reduce the learning
    curve to a gentle speed bump.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Objective-C is a small, elegant, object-oriented extension to the C language.
    Strictly speaking, it is a superset of C. You can use any valid C code in an Objective-C
    project. This gives us access to numerous third-party libraries, in addition to
    the Objective-C and C frameworks. Objective-C borrows much of its object syntax
    from Smalltalk. Smalltalk, one of the earliest object-oriented languages, was
    designed to be simple—both easy to implement and easy to learn. Despite its age,
    Smalltalk remains one of the most innovative program languages on the market.
    Many modern languages are just now rediscovering techniques originally developed
    in Smalltalk. And Objective-C gains a lot from this heritage: a highly dynamic,
    very expressive foundation upon which everything else is built.


    As a dynamic language, Objective-C binds methods and arguments at runtime instead
    of compile time. You don''t need to know the object''s class. You can send any
    object any message. This often greatly simplifies your code; however, if you send
    an object a message that it doesn''t understand, you will crash your program at
    runtime.


    Fortunately, Xcode warns you about undeclared messages. Furthermore, you can declare
    static types for your objects, which increases the compiler''s ability to analyze
    the code and produce warnings. Objective-C is also a highly reflective language—it
    can observe and modify itself. We can examine any class at runtime, getting access
    to its methods, instance variables, and more. We can modify classes, adding our
    own methods using categories or extension, or even dynamically redefining methods
    at runtime.


    Finally, Objective-C—and in particular the Cocoa and Cocoa Touch frameworks—utilize
    a number of design patterns to reduce the binding between the different sections
    of our code. Loosely bound code is easier to modify and maintain. Changes to one
    part of the program do not affect any other parts of your code. However, if you
    are not familiar with these patterns, they can make the code hard to follow.


    These patterns include using a Model-View-Controller (MVC) framework for our programs,
    using delegates instead of subclassing, enabling key-value coding (KVC) for highly
    dynamic access to an object''s instance variables, using key-value observing (KVO)
    to monitor any changes to those variables, and providing our applications with
    an extensive notifications framework.


    As you master Objective-C, you will find that you can often solve complex problems
    with considerably less code than you would need in more traditional programming
    languages, like C++ or Java. We can more carefully tailor our solution to fit
    the problem, rather than trying to hammer a square peg into a round hole.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "Apple has made good use of this flexibility when designing both the Cocoa Touch\
    \ frameworks and Xcode’s developer tools. These tools make common tasks easy to\
    \ accomplish without a lot of repetitive boilerplate, while still making it possible\
    \ to work outside the box when necessary.\n\nThe rest of this chapter describes\
    \ the Objective-C programming language. It is not meant to be all-inclusive; you\
    \ could easily write an entire book on Objective-C. In fact, several people have.\
    \ You might want to check them out. Or read The Objective-C Programming Language\
    \ in Apple’s documentation. The guide provides all the details you will ever need.\
    \ Instead, this chapter is the “vital parts” version. It provides enough information\
    \ to get started, while pointing out many of the key features and common mistakes.\n\
    \nWhile previous experience with objective-oriented programming is not necessary,\
    \ I assume you have a basic understanding of other C-like programming languages\
    \ (e.g., C, C++, or Java). If the following example leaves you completely baffled,\
    \ you may want to brush up your C skills before proceeding. If you can correctly\
    \ predict the output¹, you should be fine.\n\n```\n```c\n#include <stdio.h>\n\n\
    int main (int argc, const char * argv[]) {\n\n    int total = 0;\n    int count\
    \ = 0;\n    for (int y = 0; y < 10; y++) {\n        count++;\n        total +=\
    \ y;\n    }\n    printf(\"Total = %d, Count = %d, Average = %1.1f\",\n       \
    \    total,\n           count,\n           (float)total / (float)count);\n\n \
    \   return 0;\n}\n```\n```\n\n1 The correct answer is “Total = 45, Count = 10,\
    \ Average = 4.5.” Bonus points if you can actually compile and run the program."
