- pgno: 489
  md: '# RESPONDING TO USER INPUT


    Customizing the appearance is nice, but it’s not much of a control if we cannot
    respond to user input. Again, UIKit’s controls cover most of the common interactions,
    but sometimes we need to respond to taps, swipes, pinches, tilts, or shakes in
    ways that the built-in controls simply don’t allow.


    Please note that when I’m talking about controls, I don’t necessarily mean literal
    subclasses of UIControl. Rather, I am referring to any objects that respond to
    user input. Many of these will be simple subclasses of UIView, or, in the more
    complex situations, UIView and delegate pairs.


    This often becomes a real stumbling block for many new iOS developers. When we
    start thinking about creating custom controls, we often assume that we must shoehorn
    our idea into the target/action pattern used by the more common UIKit controls.
    Unfortunately, when we try to subclass UIControl ourselves, we quickly find a
    lack of guidance in the documentation. It’s easy to feel overwhelmed and frustrated.
    Fortunately, it is also unnecessary.


    The harsh truth is that the narrow range of UIControlEvents heavily constrains
    the target/action pattern’s usefulness. UIControl subclasses work well when they
    closely match these events—largely limiting us to monitoring touches and drags.
    Some of the more general events (e.g., the value changed and editing events) can
    be used to model a broader range of interactions, but they give us a relatively
    weak interface between the control and its view controller. For more complex controls,
    we typically need to create a delegate. This delegate may work in tandem with
    UIControlEvents (e.g., UITextField), or it may stand on its own (e.g., UITextView).


    Bottom line, we should not feel like we need to use UIControls. Even in UIKit
    itself, most of the more complex controls don’t bother subclassing UIControl.
    Instead, classes like UITextView, UITableView, and UIPickerView prefer to use
    delegates and data sources over target/action pairs. This allows them to define
    a much richer interface between the control and its view controller.


    For this reason, we won’t spend much time on the relatively narrow topic of subclassing
    UIControl. Instead, we’re going to focus on the broader task of responding to
    user input. In particular, we will look at using gesture recognizers to easily
    detect a wide range of multi-touch commands. We will also look at using the Core
    Motion framework to monitor changes to the device’s orientation—in our case, letting
    the user control the cursor by tilting their phone.'
  merge: -1
  img_proc: true
- pgno: 490
  md: '# ## SUBCLASSING UIControl


    In my opinion, there are two key questions that we must answer when we''re considering
    subclassing UIControl. First, do we plan to reuse this control, either in this
    project or in other projects? If this is strictly a one-off custom control, then
    it''s probably not worth the effort. Simply create a solid delegate protocol for
    your control and use that instead.


    Second, do we want to wire the control''s events to actions in Interface Builder?
    Again, if the answer is no, there''s really no reason to consider UIControl. A
    delegate will still be simpler both to implement and to use.


    However, if we''ve thought through our design and answered yes to both questions,
    how do we go about building a UIControl subclass? Well, all controls have two
    parts. The first is their appearance. Just like any custom view, we will have
    to provide custom drawing code. However, unlike static images, we probably want
    our control to visually respond to user input. The Core Animation techniques we
    used earlier in this chapter are often key to making that happen. Additionally,
    just like any custom view, our control does not need to be drawn as a single view.
    We can decompose the view into a multi-layer view hierarchy. This is particularly
    useful when using images. The UIImageView class is highly optimized, and we should
    generally try to add it to our view hierarchy, instead of using UIKit to draw
    the images ourselves.


    The second part is the actual user interaction. UIControl already responds to
    a number of touch-based commands, and it will automatically trigger any assigned
    actions for the touch events (any event starting with UIControlEventTouch...).


    We can modify this behavior in two ways. First, we can override sendAction:to:forEvent:
    to monitor and change how events are dispatched. Note that sendAction:to:forEvent:
    is only called if there is a target and action assigned to the given event. So
    we must first assign a default target/action pair. Then we can use this method
    to cancel or change the target or action based on the control''s state. Next,
    we can track touch events by overriding beginTrackingWithTouch:withEvent:, continueTrackingWithTouch:withEvent:,
    and endTrackingWithTouch:withEvent:, though—as we will soon see—it''s often a
    lot easier to manage complex touch events using gesture recognizers. In fact,
    there''s no reason we can''t add gesture recognizers directly to our UIControl
    subclass.


    *continues on next page*'
  merge: -1
  img_proc: true
- pgno: 491
  md: '# SUBCLASSING UIControl (continued)


    Finally, we can call `sendActionsForControlEvents:` to programmatically trigger
    our own events. Typically, we would use this to trigger `UIControlEventValueChanged`
    or one of the `UIControlEventEditing...` events. Simply call `sendActionsForControlEvents:`
    and pass in a bitmask with a flag set for each of the events we wish to trigger.
    Our UIControl subclass will then automatically call `sendAction:to:forEvent:`
    once for each target/action pair assigned to those events.


    As a quick example, let’s say we wanted to create a 2D slider. We basically want
    a simple grid with a cursor that can be moved both horizontally and vertically.
    Our design might look something like the following:


    First, we decompose our view into two layers: the grid and the cursor. This allows
    us to move the cursor without affecting the underlying grid.


    Second, we add three state variables. One contains the relative x-coordinate of
    the cursor (from 0.0 on the left edge to 1.0 on the right). The other contains
    the relative y-coordinate (again, ranging from 0.0 at the top to 1.0 at the bottom).
    Finally, the third variable contains a BOOL to monitor our editing state (YES
    if we are currently modifying the control’s values, NO otherwise).


    Next, we’re not doing anything terribly complex here, so the existing touch methods
    are probably sufficient. Simply override `beginTracking:withTouch:withEvent:`,
    `continueTracking:withTouch:withEvent:`, and `endTracking:withTouch:withEvent:`.


    In `beginTracking...`, we check to see if our touch is close enough to our cursor.
    If it is, we start editing our control. At a minimum, this involves setting `self.editing
    = YES` and calling `[self sendActionsForControlEvents:UIControlEventEditingDidBegin]`
    to trigger the editing did begin event. We may also want to change the cursor’s
    appearance (e.g., by highlighting it).


    In `continueTracking...`, if `self.editing == YES`, we update our x- and y-coordinates
    based on the touch’s location in the view. We then update the cursor’s position.
    Finally, we call `[self sendActionsForControlEvents:UIControlEventEditingChanged
    | UIControlEventValueChanged]` to trigger actions for both the editing changed
    and value changed events.


    Then, in `endTracking...`, if `self.editing == YES`, we set `self.editing = NO`
    and call `[sendActionsForControlEvents:UIControlEventEditingDidEnd]`.


    That’s it. We can probably enhance and improve it, but that’s all our control
    really needs. Next time we’re in Interface Builder, we can drag a UIView out from
    the library, position it wherever we would like, and change its class to our custom
    UIControl subclass. Now we’ll be able to draw connections to its events, just
    like any of UIKit’s controls.'
  merge: -1
  img_proc: true
- pgno: 492
  md: '# # GESTURE RECOGNIZERS


    Gesture recognizers were added with iOS 3.2. They greatly simplify the detection
    of common touch-based commands, like taps, swipes, drags, pinches, rotations,
    and long presses. In many ways, the gesture recognizers allow us to abstract away
    the ugly details involved in tracking and analyzing individual touches, letting
    us define our interactions at a high level. Say we want to detect a two-finger
    triple tap. No problem. We simply create an instance of UITapGestureRecognizer
    and set the desired number of taps and touches. That’s it. We don’t need to worry
    about monitoring the individual touch locations, the number of touches detected,
    how long each one lasted, or even the duration between the different sets of touches.
    The gesture recognizer handles all of those details for us, and it handles them
    in a way that will be consistent across all applications.


    **NOTE:** While the existing `UIGestureRecognizer` subclasses cover all the common
    multi-touch gestures, we can create our own subclass to recognize custom gestures.
    For more information, check out “Creating Custom Gesture Recognizers” in Apple’s
    Event Handling Guide for iOS.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_492_0.png)


    Gesture recognizers come in two basic flavors: discrete and continuous. This determines
    the type of action messages that the recognizer sends. A discrete gesture recognizer
    will send a single action message once the gesture is complete. These are used
    for quick gestures that mark a single point in time: taps and swipes.


    Continuous gesture recognizers, on the other hand, track the gesture over time.
    They will continue to send multiple action messages until the gesture ends. Pinches,
    pans, rotations, and long presses are all modeled using continuous gesture recognizers.


    In particular, look at the difference between a swipe and a pan gesture. Superficially,
    they appear quite similar. Both involve dragging a finger across the screen. However,
    for a swipe, we’re just interested in triggering a single action. Once the swipe
    is detected, we call our action and we’re done. It’s a discrete, single event.
    For the pan, we actually want to track the user’s finger as it moves. The location
    of the finger, how far it has moved, which direction it has moved—all of these
    details may be important. As a result, we might use a swipe gesture to trigger
    a move from one page to another, while we’d use a pan gesture to fast forward
    through a video or change the app’s volume.'
  merge: -1
  img_proc: true
- pgno: 493
  md: "We use a number of different gestures in GravityScribbler. A single-finger\
    \ pan adjusts the app’s acceleration rate (basically, the responsiveness of the\
    \ gravity cursor). A two-finger tap pauses the app. Finally, a three-finger horizontal\
    \ swipe will bring up our export menu.\n\n**NOTE:** Instead of attaching the gesture\
    \ recognizers to individual control elements (e.g., a pause button), we’re attaching\
    \ them directly to the root view. This means we can perform the gestures anywhere\
    \ on the screen. In effect, the entire view is our control, and the pop-up views\
    \ are simply our way of visualizing the user interaction.\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_493_0.png)\n\
