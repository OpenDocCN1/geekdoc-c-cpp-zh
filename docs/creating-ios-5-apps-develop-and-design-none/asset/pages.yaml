- pgno: 111
  md: 'We''ve covered most of the basic features of Objective-C, but there are a number
    of common design patterns that are often used throughout the iOS SDK. It''s worth
    taking a little bit of time to go over these patterns so you will understand them
    when you see them.


    # ## MODEL-VIEW-CONTROLLER


    Model-View-Controller (MVC) is a common architectural pattern for building applications
    with a graphical user interface (GUI). This pattern divides the application into
    three sections. The model maintains the application''s state. This typically includes
    both managing the state during runtime and saving and loading the state (archiving
    objects to file, persisting the data to an SQL database, or using frameworks like
    Core Data).


    As the name suggests, the view is responsible for displaying application information,
    possibly in an interactive manner. Most of the time this means displaying the
    information using a GUI. However, it could include printing documents and generating
    other logs and reports.


    The controller sits between the two. It responds to events (usually from the view)
    and then sends commands to the model (to change its state). It must also update
    the view whenever the model changes. An application''s business logic may be implemented
    in either the controller or the model, depending on the needs of the application.
    However, you should really pick one approach and stick with it throughout the
    entire application.


    The ideal MVC components should be very loosely bound. For example, any number
    of views could observe the controller, triggering controller events and responding
    to any change notifications. One might display information in the GUI. One might
    save data to a log file. The controller doesn''t know or care about the details.
    On the other end, the model and the controller should be similarly loosely bound.


    In practice, the different layers are often more tightly bound than this, sacrificing
    a bit of idealism for pragmatics. Cocoa Touch is no exception. Typically, the
    views are more tightly bound to their controllers. Each scene has a custom controller
    tailored toward managing that scene (see the “Examining the Storyboard” section
    in Chapter 1 for more information on the relationship between scenes and view
    controllers). On the model side, there''s a lot more wiggle room. In the simplest'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'applications, the model might be implemented directly in the controllers. For
    the most part, though, we want to keep these areas as cleanly separated as possible.


    Cocoa Touch uses UIView subclasses for the view, and UIViewController subclasses
    for the controller. Communication between the model and the view generally uses
    target/action connections.


    On the model side, we can implement our models using a number of different techniques:
    custom classes, SQLite, or Core Data. In many cases, models and controllers communicate
    directly with each other—though we can create more loosely bound connections using
    notifications and delegates (see the data sources discussion in the next section
    for more information).


    # ## DELEGATES


    Delegates allow you to extend or modify an object’s behavior without having to
    subclass the object. You can even change the object’s behavior at runtime by swapping
    delegates—though in practice, this is somewhat rare.


    We have already seen delegates in action. For example, instead of subclassing
    the UIApplication class within each project, we use a generic UIApplication and
    implement a custom UIApplicationDelegate. The application delegate protocol defines
    more than 20 optional methods that we can override to both monitor and alter the
    application’s behavior.


    Any class that uses a delegate usually has a property named (not surprisingly)
    delegate. By convention, delegate properties should always use weak references.
    This helps avoid retain loops. However, we need to make sure we have a strong
    reference to our delegate object somewhere else in our application—otherwise ARC
    will deallocate it.


    ```

    `@property (nonatomic, weak) IBOutlet id<DelegateProtocol> delegate;`

    ```


    As this example shows, we typically declare a protocol that our delegate must
    implement. This defines the interface between the delegating class and our delegate.
    Note that the delegating class is the active partner in this relationship. It
    calls these methods on the delegate. Some of them pass information to the delegate;
    others query the delegate. In this way, we pass information back and forth between
    the two objects.'
  merge: -1
  img_proc: true
