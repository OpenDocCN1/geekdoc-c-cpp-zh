- pgno: 110
  md: '# GETTING TO KNOW THE DOCUMENTATION


    It’s worth spending a little time to get familiar with Xcode’s documentation.
    It’s an excellent resource when first learning Objective-C, and it will continue
    to function as an indispensable reference manual throughout your iOS developing
    career.


    Let’s get a little practice. Open the documentation and search for UIWindow, and
    then select UIWindow Class Reference from the results. The class reference is
    divided into several sections. It starts with a brief description of the class,
    including the class hierarchy it inherits from, the protocols it implements, and
    any sample code that uses the class.


    Below this, we have an overview of the class. This section describes its basic
    usage, including any important implementation or usage details.


    Next we have a list of tasks. This groups the class’s properties and methods by
    their intended use (for UIWindow, these are Configuring Windows, Making Windows
    Key, Converting Coordinates, and Sending Events). Each item on the list has a
    hyperlink to a more detailed description later in the documentation.


    Then we have sections describing the class’s properties, class methods, instance
    methods, constants, and notifications. (Not all classes have all of these categories.
    UIWindow, for example, does not have any class methods.) Each section includes
    all the relevant public items defined for the class. For items declared in the
    superclass (or farther up the class hierarchy), you will need to search for the
    relevant class’s reference.


    The detailed entry for each item shows how the item is declared, describes its
    use, and provides information about its availability. For example, the UIWindow’s
    rootViewController property provides access to the UIViewController that manages
    the window’s contents. Its default value is nil, and it is only available in iOS
    4.0 and later.


    By comparison, search for CGPoint. Unlike the UIWindow class, CGPoint does not
    have its own reference. It is described in the CGGeometry reference. Like the
    class reference, this starts with a short header and an overview. Then it lists
    the geometry functions, grouped by task. Finally the reference lists all relevant
    data types and constants.


    The CGPoint entry includes the struct’s declaration and a description of all its
    fields and its availability.


    As we work our way through the book, periodically take some time to look up any
    new classes or structures in the documentation. I will try to show good examples
    of the class’s typical usage, but most classes contain too many methods and features
    to describe in detail. Besides, looking through the documentation may give you
    ideas for alternative usages that would work better in your own applications.'
