- pgno: 169
  md: '# CONNECTING THE MODEL


    Now we need to connect our model objects to our controllers. This often causes
    some confusion—after all, the controllers are created by our storyboard. How do
    we get our data objects into them?


    In theory, we could add our model objects to the storyboard and let it create
    them as well. This isn''t a bad approach; however, we lose some control over our
    objects. Any objects in the storyboard will be created when the scene is loaded.
    If our data object is loaded as part of our initial scene, it could cause a delay
    when launching our application—especially when loading a particularly large file
    or loading resources from the network.


    More importantly, we cannot connect the outlets in one scene to objects in another.
    If we could add our model to our initial scene and then connect it to outlets
    in all our other scenes, I would be strongly tempted to add objects to storyboards.
    As it is, there are probably better solutions.


    Another common approach involves creating a singleton class for our model or storing
    our model in the app delegate (which effectively does the same thing). Personally,
    I find the app delegate approach a little sloppy, and I try to avoid the dark
    temptation of singleton classes whenever possible.


    Instead, let''s use lazy initialization to create our model in our initial scene''s
    controller, and then pass the data to our new scenes when they are loaded.


    Let''s start by creating a custom UITabBarController subclass. Right-click the
    Controllers group and select New File > UIViewControler subclass. In the options
    panel, UITabBarController is not one of the options in the "Subclass of" dropdown
    menu. Instead, we have to type it directly into the field. Then name the controller
    TabBarController and create it.


    Now open TabBarController.h. We also need to add a property to hold our WeightHistory
    object. Modify the header as shown here:


    ```

    ```objectivec

    @class WeightHistory;


    @interface TabBarController : UITabBarController


    @property (nonatomic, strong) WeightHistory* weightHistory;


    @end

    ```

    ```'
