- pgno: 189
  md: "Both setTitle:forState: and setTitleColor:forState: refer to the button's state.\
    \ Every control has a state: normal, highlighted, selected, or disabled. Different\
    \ actions can change the control's state (see Table 4.2). Our button uses only\
    \ two. It is highlighted when touched; otherwise, it is normal.\n\nWhen setting\
    \ per-state attributes, if you don't explicitly assign a value to a given state,\
    \ that state will default back to the UIControlStateNormal setting. For example,\
    \ in our code we only had to set the title once. Unless we say otherwise, every\
    \ other state will use this value as well.\n\nThis brings up a point that is often\
    \ confused. If you look up UIControlState in the developer documentation, the\
    \ enum is designed as a bitmask. This means we should be able to combine multiple\
    \ states using the bitwise OR operator (|). As a result, you might be tempted\
    \ to explicitly set the title for all the states using code like this:\n\n```\n\
    ```\nUIControlState all = UIControlStateNormal |\n                     UIControlStateSelected\
    \ |\n                     UIControlStateHighlighted |\n                     UIControlStateDisabled;\n\
    [self.button setText:@\"default text\" forState:all]\n```\n```\n\nUnfortunately,\
    \ this does not work. Instead of setting the title for all states, you are actually\
    \ setting the title for a single state: specifically, the state in which the control\
    \ is selected, highlighted, and disabled—all at the same time (in this case, UIControlStateNormal\
    \ is ignored).\n\nThis can be handy when creating things like custom two-state\
    \ buttons. These buttons have an ON and an OFF state, and each of these states\
    \ can be displayed either normally or highlighted. This means we need to define\
    \ four different appearances for these four different states.\n\nWe can use the\
    \ button's selected property to indicate its ON/OFF state. Our appearances are\
    \ then defined as follows: UIControlStateNormal means the button is OFF; UIControlStateHighlighted\
    \ means the button is OFF and touched; UIControlStateSelected means the button\
    \ is ON; and UIControlStateHighlighted | UIControlStateSelected means the button\
    \ is both ON and touched (Figure 4.11). Note that UIControlStateDisabled is not\
    \ used here."
  merge: -1
  img_proc: true
- pgno: 190
  md: '# UICONTROLS AND STATE (continued)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_190_0.png)


    However, if you''re simply trying to set a default appearance across all the states,
    just use UIControlStateNormal and let the others default back to it.


    TABLE 4.2 Control States


    | STATE | TRIGGER |

    | --- | --- |

    | UIControlStateNormal | Default control state. |

    | UIControlStateHighlighted | The highlighted state is often used to alter the
    control''s appearance when it is touched. This state is automatically set and
    cleared as touches enter and leave the control. Our application can also access
    this state through the highlighted property. |

    | UIControlStateSelected | Often, this state has no effect on the control''s appearance;
    however, controls like the UISwitchControl will use it when toggling between the
    ON and OFF states. This state can also be accessed through the control''s selected
    property. |

    | UIControlStateDisabled | This state is typically set using the control''s enabled
    property. When disabled, the control does not respond to touch events. Many controls
    also change their appearance when disabled. |'
  merge: -1
