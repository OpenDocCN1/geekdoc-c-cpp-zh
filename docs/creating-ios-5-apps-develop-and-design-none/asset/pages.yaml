- pgno: 78
  md: '# ABSTRACT CLASSES


    In our sample class hierarchy, Vehicle, Boat, Airplane, and Car may be implemented
    as abstract classes. An abstract class is a class that cannot be instantiated
    into an object (or, at least, one that is not typically instantiated). Often it
    leaves one or more methods undefined. To use the abstract class, you first create
    a subclass that fully defines all the required methods. You can then create instances
    of that subclass.


    Objective-C does not provide explicit support for abstract classes. However, we
    can create informal abstract classes by throwing exceptions in the undefined methods.
    Check out the documentation for NSCoder to see an abstract class in action.


    Let’s look at a concrete example. UIView has a method called addSubview:. This
    lets you add another UIView to be displayed inside the current view. Since UILabel,
    UIButton, and UITextField all inherit from UIView (either directly or indirectly),
    they can all be added using the addSubview: method. In addition, they also inherit
    addSubview:. In theory, you could add a subview to your button or text field (though
    it’s hard to imagine a situation where this would be useful). More practically,
    the subclasses also inherit the UIView’s frame property. This allows you to set
    its size and position within the superview’s coordinate system. Everything that
    inherits from UIView (either directly or indirectly) has a frame.


    # BROWSING THE SUPERCLASS’S METHODS


    If you look at UIButton’s class reference, you will not find any information about
    a frame property. That’s because the class reference only shows the new methods
    declared for that particular class. So, how do you find all the inherited methods?


    At the very top of the class reference, you see a line labeled “Inherits from.”
    This lists the complete chain of superclasses going all the way back to NSObject.
    By slowly walking back along the inheritance chain, you can look through all available
    methods and properties.'
  merge: -1
  img_proc: true
- pgno: 79
  md: "# # INSTANTIATING AN OBJECT\n\nObjective-C uses two-step creation of objects.\
    \ First you allocate memory on the heap. Next, you initialize that memory region\
    \ with the object's initial values. The first step is done with the alloc class\
    \ method. The second is done with init or one of its siblings.\n\nFor example,\
    \ the following line will create an empty NSString object:\n\n```\n```\nNSString*\
    \ myString = [[NSString alloc] init];\n```\n```\n\nThere are a few key points\
    \ worth noting here. First, we declare our NSString variable as a pointer. It\
    \ will point to the memory address where the object's data is stored on the heap.\n\
    \nAs we will see shortly, Objective-C methods are called using square brackets.\
    \ Here, we are nesting the alloc method inside the init method. This is important,\
    \ since many classes are implemented using class clusters. Here the API describes\
    \ a single class, but the actual implementation uses two or more variations on\
    \ the class. Different versions are created and used under different circumstances,\
    \ often to improve performance. However, all that complexity is hidden from the\
    \ developer.\n\nSince init (and friends) may return a new object, it is vitally\
    \ important that you save the value returned by init, not the value returned by\
    \ alloc. Nesting the init and alloc methods ensures that you will save the proper\
    \ object.\n\nIt turns out that NSString is actually a class cluster. We can see\
    \ this by breaking up the steps as shown:\n\n```\n```\n// Create an empty string\n\
    NSString* allocString = [NSString alloc];\nNSLog(@\"allocString: pointer = %p,\
    \ class = %@\",\n      allocString, allocString.class);\nNSString* initString\
    \ = [allocString init];\nNSLog(@\"initString: pointer = %p, class = %@\",\n  \
    \    initString, initString.class);\n```\n```\n\nNSLog() works very similarly\
    \ to printf(). The first argument is a literal NSString. As we saw earlier, double\
    \ quotes create C-style strings. By adding the @ before the first double quote,\
    \ we tell the compiler to generate an NSString instead."
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Next, NSLog scans through that string looking for placeholders. For the most
    part, these placeholders are identical to those used by `printf()`. There are
    some small changes, however. For example, `%@` is used to display objects.


    Basically, this code prints the value of the class’s pointer and the class name
    to the console after both `alloc` and `init`. If you run this code, it will produce
    the following output (note that the actual pointer values will undoubtedly change):


    ```

    allocString: pointer = 0x4e032a0, class = NSPlaceholderString

    initString: pointer = 0x1cb334, class = NSCFString

    ```


    As you can see, both the pointer and the class change after `init` is called.
    Furthermore, our NSString is actually a member of the NSCFString subclass.


    # MULTIPLE INITIALIZATION METHODS


    An object may have more than one initialization method. NSString has several:
    `init`, `initWithString:`, `initWithFormat:`, `initWithContentsOfFile:encoding:error:`,
    and more. Each of these provides alternate ways for setting the string’s initial
    value. The complete list can be found in the NSString class reference.


    In addition, NSString has a number of convenience methods—class methods that typically
    start with the word `string`: `string`, `stringWithString:`, `stringWithFormat:`,
    `stringWithContentsOfFile:encoding:error:`, and others. They combine the allocation
    and initialization steps into a single method.


    While `[NSString string]` and `[[NSString alloc] init]` may seem similar, there
    is a subtle but significant difference in how the system manages the resulting
    object’s memory. In the past, we had to carefully use each method correctly. Fortunately,
    if you are compiling your applications with ARC, these differences disappear and
    you can freely use whichever method best fits your application and programming
    style.


    # DEFINING A CLASS


    We define a class in two steps: the interface and the implementation. The interface
    is ordinarily declared in the class’s header file (filename ending in .h). This
    allows us to easily import our class declaration into any other part of our project.
    The interface should define all the information needed to effectively use the
    class—this includes the public methods (methods that can be called from outside
    the class) as well as the class’s superclass and possibly its instance variables.'
