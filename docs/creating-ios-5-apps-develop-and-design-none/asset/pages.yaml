- pgno: 532
  md: '# WRAPPING UP


    This chapter has covered a grab bag of topics. The first two-thirds largely focused
    on creating custom controls. In this context, a control is any UI element that
    responds to user input. This task can be split into two parts: displaying the
    control and capturing the user''s input.


    We handled the first part by creating a custom UIViewController container and
    a series of pop-up views and then using Core Animation to animate our pop-ups''
    appearances and disappearances. We also looked at techniques for customizing UIKit
    controls. For user input, we explored techniques for detecting touches using gesture
    recognizers, as well as techniques for tracking the device''s motion using Core
    Motion.


    The last third of the chapter rounded out our discussion, as we exported the drawings
    we created with our custom controls. This let us explore some advanced image handling
    techniques, including the Asset Library framework, image destinations, and Core
    Image. We also got a chance to get our hands dirty with Core Location and iOS''s
    built-in support for both email and Twitter.


    Most of these topics are quite deep, and we''ve barely scratched their surfaces.
    Please use this chapter as a starting point for exploring these topics in more
    detail. All of these topics are covered extensively in Apple''s documentation.


    Our last chapter will discuss the last mile. Here we will polish our app before
    submitting it to the App Store. This includes everything from setting the startup
    image and icons, to localization and accessibility.'
  merge: -1
  img_proc: true
