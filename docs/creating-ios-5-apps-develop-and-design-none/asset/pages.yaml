- pgno: 23
  md: 'The Supporting Files subgroup contains a variety of secondary files. Initially,
    this group contains the application''s Hello World-Info.plist, InfoPlist.strings,
    main.m, and Prefix.pch files.


    The Hello World-Info.plist file contains a number of key-value pairs used to configure
    our application. The InfoPlist.strings file contains localized versions of the
    Hello World-Info.plist file''s keys. This can be useful when localizing your application,
    though the file is initially empty. The main.m file contains the main() function,
    the initial function that is executed when your application launches. The Prefix.pch
    file is the application''s precompiled header.


    To help large projects compile faster, Xcode allows us to create a precompiled
    prefix header file containing a number of #import, #include, and #define directives
    common across much of our code. For example, in a typical iOS project, most classes
    need to access the UIKit and Foundation frameworks. By including the #import statements
    for these frameworks in our prefix header, Xcode knows to preprocess those files
    and include the results in all of our source files. This prevents the compiler
    from processing common files multiple times during each build.


    This may not make a lot of sense right now, and that''s OK. We will not be touching
    the Prefix.pch file in this project. For more information, check out Apple''s
    documentation: Xcode Build System Guidelines; Reducing Build Times; and Using
    a Precompiled Prefix Header.


    Finally, the Frameworks group contains any iOS frameworks used by this project,
    while the Products group contains the end results—in this case, our compiled application.
    Again, we won''t be touching any of these in this project.


    **NOTE:** Much like Xcode''s workspaces, the navigator''s groups represent a virtual
    organization—they exist only within Xcode. These groups do not necessarily have
    any relationship with how or where the actual resources are stored, or even with
    what type of files they contain. You are free to place any resource in any group
    and to add or remove groups or subgroups as needed.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_23_0.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# # WALKING THROUGH THE PROJECT\n\nWhen I first started writing Cocoa applications,\
    \ I did not really understand how all the pieces of my applications fit together.\
    \ Sure, I understood the individual parts. I had a view and a view controller.\
    \ They worked together to manage the user interface. Still, many of these objects\
    \ seemed to magically appear at runtime. I had no idea where they came from.\n\
    \nLet me reassure you that there is nothing supernatural going on here. I’ve checked.\
    \ Still, it’s worth taking a few minutes to walk through all the connections,\
    \ just to see what is happening. Don’t worry about memorizing all the details.\
    \ Instead, focus on how we trace the connections from one object to the next.\
    \ That way, you will be able to trace through your own applications later on.\n\
    \nLet’s start exactly where our application starts. Click main.m in the navigator\
    \ (you may need to expand the Supporting Files group if the file isn’t already\
    \ visible). This file is actually very short. It imports the UIKit and our application\
    \ delegate, and it then defines the main() function.\n\n```\n```objective-c\n\
    #import <UIKit/UIKit.h>\n\n#import \"HWAppDelegate.h\"\n\nint main(int argc, char\
    \ *argv[])\n{\n    @autoreleasepool {\n        return UIApplicationMain(argc,\
    \ argv, nil,\n            NSStringFromClass([HWAppDelegate class]));\n    }\n\
    }\n```\n```\n\nBasically, this creates an autorelease block. Inside the block,\
    \ we launch our Objective-C application. We will discuss autorelease blocks in\
    \ the “Memory Management” section of Chapter 2.\n\nThe real work happens in the\
    \ UIApplicationMain() function. This function takes four arguments. The first\
    \ two handle our application’s command line arguments: argc gives the number of\
    \ arguments, while argv contains the actual arguments themselves as an array of\
    \ C-style strings. These arguments are largely a holdover from Unix command-line\
    \ applications. In iOS, our apps typically have"
  merge: -1
  img_proc: true
