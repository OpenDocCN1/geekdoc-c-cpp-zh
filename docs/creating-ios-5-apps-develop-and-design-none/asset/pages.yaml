  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_46_0.png)


    **FIGURE 1.28** The jump bar


    **FIGURE 1.29** Selecting a method


    # # ADDING THE TEXT FIELD


    The first few steps almost exactly repeat what we did for the main view, only
    we use a Text Field control, not a Label object. Make sure `MainStoryboard.storyboard`
    is open and zoom in on the flipside view controller. Now, drag a Text Field control
    from the Library pane. Resize it so that it fills the view from margin to margin.


    This time we don’t need to change the height or the attributes. Just create an
    outlet for the text field by Control-dragging it to a point just above the delegate
    property. Name the outlet `labelText`. Finally, position it in the top half of
    the flipside view; otherwise, it may be covered by the keyboard.


    Whenever we want to change the label’s text, we just need to get the text value
    from our `labelText` outlet and copy it into our label outlet. The simplest solution
    is to change the label only when the user dismisses the flipside view. Open `HWMainViewController.m`
    and find the `flipsideViewControllerDidFinish:` method.


    Currently our files are not very long. You can probably find the method by just
    scanning through the file. Still, it is often easier to use the editor’s jump
    bar (**Figure 1.28**).


    The bar across the top of the Editor area shows you the item that you are editing.
    Click the rightmost item and select the `flipsideViewControllerDidFinish:` method
    (**Figure 1.29**). The editor will select the method and scroll so it is visible.'
