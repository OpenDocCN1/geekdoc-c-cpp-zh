  md: "Next, we need to implement the method for our selector. This method should\
    \ accept a single NSNotification object as an argument.\n\n```\n```objective-c\n\
    - (void)receiveNotification:(NSNotification*)notification {\n    NSLog(@\"Notification\
    \ Received\");\n    // Now do something useful in response.\n}\n```\n```\n\nFinally,\
    \ it’s important to remove the observer before it (or any object mentioned in\
    \ addObserver:selector:name:object:) is deallocated. Otherwise, the notification\
    \ center will contain dangling pointers. Often this should be done in the observing\
    \ object’s dealloc method.\n\n```\n```objective-c\n- (void)dealloc {\n    NSNotificationCenter*\
    \ center =\n    [NSNotificationCenter defaultCenter];\n    // Remove all entries\
    \ for the given observer.\n    [center removeObserver:self];\n}\n```\n```\n\n\
    Sending a notification is even simpler. Our sending object just needs to get a\
    \ pointer to the default notification center and then post the desired method.\n\
    \n```\n```objective-c\nNSNotificationCenter* center = [NSNotificationCenter defaultCenter];\n\
    [center postNotificationName:MyNotification object:self];\n```\n```\n\nNotifications\
    \ are posted synchronously. This means that the call to postNotificationName will\
    \ not return until after the notification center has finished calling all the\
    \ specified selectors for all matching observers. This could take a considerable\
    \ amount of time, especially if there are a large number of observers or the responding\
    \ methods are slow.\n\nAlternatively, we can send asynchronous notifications using\
    \ NSNotificationQueue. Notification queues basically delay a notification until\
    \ the current event loop ends (or possibly until the event loop is completely\
    \ idle). The queue can also coalesce duplicate messages into a single notification."
