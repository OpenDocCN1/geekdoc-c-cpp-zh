- pgno: 498
  md: "Unlike the others, pans are continuous gestures. There is no difference when\
    \ the recognizer is created, but we have to design our accelerationGesture: method\
    \ to handle multiple calls. Not surprisingly, the method is more complicated than\
    \ our previous examples. Let’s step through it.\n\n```\n```objective-c\n- (void)accelerationGesture:(UIGestureRecognizer\
    \ *)gestureRecognizer {\n    // Don't process acceleration gestures if paused.\n\
    \    if (!self.canvasViewController.running) return;\n    CGPoint motion =\n \
    \       [(UIPanGestureRecognizer*)gestureRecognizer\n            translationInView:self.view];\n\
    \    [(UIPanGestureRecognizer*)gestureRecognizer\n        setTranslation:CGPointZero\
    \ inView:self.view];\n}\n```\n```\n\nJust like before, we check to see if the\
    \ canvas view is running before we proceed. We don’t show the acceleration control\
    \ if the canvas is paused.\n\nThen we calculate the distance that the user’s finger\
    \ has moved since the last update. UIPanGestureRecognizer has three methods to\
    \ help track the pan gesture: translationInView:, velocityInView:, and setTranslation:inView:.\
    \ translationInView: tracks the touch’s change in position in the given view’s\
    \ coordinates. This is the cumulative distance moved—by default, it gives the\
    \ offset from the gesture’s starting position. Similarly, velocityInView: gives\
    \ the gesture’s current velocity using the given view’s coordinate system. The\
    \ velocity is broken into both vertical and horizontal components. Finally, setTranslation:inView:\
    \ lets us reset the reference point for translationInView: and resets the velocity.\n\
    \nSince we’re only concerned with the position, not the velocity, we only need\
    \ to use translationInView:. However, we want the change in position for each\
    \ update. To calculate this, we simply reset the translation by calling setTranslation:inView:\
    \ and passing in CGPointZero—effectively assigning a new starting point for the\
    \ next iteration.\n\n```\n```objective-c\n// Update the value in the gesture recognizer\
    \ screen.\nCGFloat min = logf(0.05f);\nCGFloat max = logf(10.0f);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 499
  md: "```\n```objective-c\nCGFloat range = max - min;\nCGFloat current =\n    logf(self.canvasViewController.accelerationRate);\n\
    CGFloat change = motion.y;\n// If we're landscape left, reverse the acceleration\
    \ changes.\nif (self.bestSubviewOrientation ==\n    UIDeviceOrientationLandscapeRight)\
    \ {\n    change *= -1;\n}\ncurrent += range / self.view.bounds.size.height * 4.0f\
    \ / 3.0f *\n           change;\nif (current < min) current = min;\nif (current\
    \ > max) current = max;\nself.canvasViewController.accelerationRate = expf(current);\n\
    [self.accelerationController.progressBar\n    setProgress:(current - min) / range\n\
    \    animated:YES];\n```\n```\n\nNext, we calculate the acceleration value. We\
    \ will use this value to scale the results from Core Motion in the next section.\
    \ The larger the value, the more quickly the cursor responds when tilting the\
    \ phone. Here, we’re going to scale the value from 0.05 to 10.0. The exact math\
    \ isn’t too important. However, there are two points worth noting. First, a linear\
    \ change in the gesture’s location results in an exponential change in the cursor’s\
    \ responsiveness. Second, we’ve set the scale so that you only need to pan three-quarters\
    \ of the way across the screen to go from the lowest setting to the highest.\n\
    \nOnce the acceleration value is calculated, we assign it. We set the canvas’s\
    \ accelerationRate property to the exponential value. However, we use the linear\
    \ value to set our acceleration control’s progress bar. This means that the minimum\
    \ value will correspond to 0.0f on the progress bar (a completely empty bar),\
    \ while the maximum value will correspond to 1.0f (a completely filled bar)."
