  md: "This is even simpler. We just center our pop-up view and then set its alpha\
    \ property to 0.0f. This will make the view completely transparent.\n\nNow we\
    \ just need to animate our views' appearance. We'll use Core Animation to do this.\
    \ I won't lie to you: Core Animation is a rich, complex framework. Entire books\
    \ have been written on this topic. There are lots of little knobs to tweak. However,\
    \ for most common use cases it is easy to use.\n\nTo give you the most basic explanation,\
    \ all UIViews have a number of animatable properties. These include frame, bounds,\
    \ center, transform, alpha, backgroundColor, and contentStretch. To animate our\
    \ view, we create an animation block. Inside the block, we change one of these\
    \ properties. Core Animation will then calculate the interpolated values for that\
    \ property for each frame over the block's duration—and will smoothly animate\
    \ the view's transition.\n\nIf I want to move the view, I just change the frame.\
    \ If I want to scale or rotate the view, I change the transform. If I want it\
    \ to fade in or fade out, I change the alpha. Everything else is just bells and\
    \ whistles.\n\nLet's look at our fade animation, since it is the simplest.\n\n\
    ```\n```objc\n- (void)animateAppearFade:(UIViewController*)controller\n    withCompletionHandler:(void\
    \ (^)(BOOL finished))completion {\n    [UIView animateWithDuration:0.25f\n   \
    \                     animations:^()\n    {\n        controller.view.alpha = 1.0f;\n\
    \    } completion:^(BOOL finished)\n    {\n        [controller didMoveToParentViewController:self];\n\
    \        if (completion != nil) {\n            completion(finished);\n       \
    \ }\n    }];\n}\n```\n```"
