- pgno: 488
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_488_0.png)


    **FIGURE 8.11** Resizable images in action


    Both tiled images and resizable images allow us to create visually interesting
    backgrounds while minimizing the memory requirements and size of our final application.
    Of course, you have to design your images carefully so they will work well as
    either tiled or stretched images. You cannot simply stretch any image and expect
    it to look good.


    **NOTE:** In this example, the interiors of our resizable images are filled with
    a solid color, since we are tiling a single pixel (or, in the case of a Retina
    display, two pixels with identical colors). However, by increasing the size of
    the area between the inset regions, we can create patterns that will then be tiled
    to fill the entire area covered by the image. It takes additional effort to make
    sure the tiled areas match well with the inset designs, but when done properly
    it can produce resizable images based on tessellated patterns.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_488_1.png)'
