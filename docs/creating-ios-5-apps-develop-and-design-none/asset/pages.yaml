  md: "```\n```\n    }\n    // This will never be executed.\n    return 0.0f;\n}\n\
    - (NSString*)stringForWeightInUnit:(WeightUnit)unit {\n    return [WeightEntry\
    \ stringForWeight:[self weightInUnit:unit]\n                                 ofUnit:unit];\n\
    }\n```\n```\n\nThe weightInUnit: method simply uses a switch statement to evaluate\
    \ the unit argument, just as we saw before. If the unit is LBS, it returns the\
    \ object's weight in pounds. For KG units, it converts the object's weight before\
    \ returning it. For anything else, it throws an exception.\n\n# REFACTORING\n\n\
    We have seen the switch statement used in almost identical ways three different\
    \ times. In general, this is a sign that the code may need to be refactored to\
    \ remove these repetitive structures. Imagine if we wanted to add another weight\
    \ unit—for example, stones. We would need to go through our code and change all\
    \ the switch statements individually.\n\nOne approach to refactoring this code\
    \ would be to convert WeightEntry to an abstract class and then implement a subclass\
    \ for each unit type. We can then have each subclass's weight and description\
    \ methods just return the appropriate values in the proper units. We would probably\
    \ need additional methods to convert from one subclass to the other, but it wouldn't\
    \ be hard to get rid of all the switch statements. And, if we ever needed to add\
    \ another unit type, we could just create a new WeightEntry subclass.\n\nHowever,\
    \ in this case, the repeated code is short enough and the class is small enough\
    \ that it's probably not worth the effort. Still, you should always keep an eye\
    \ out for places where you can remove repetitive code."
