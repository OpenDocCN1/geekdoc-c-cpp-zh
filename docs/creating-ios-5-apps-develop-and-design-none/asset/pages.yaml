- pgno: 179
  md: '# ENTERING WEIGHT DATA


    ![](img/fe9fea534a8e7868f811f7cd33da015f_179_0.png)


    **FIGURE 4.1** Centering the label


    ![](img/fe9fea534a8e7868f811f7cd33da015f_179_1.png)


    **FIGURE 4.2** Stretching a label to fill the view


    Let’s start by modifying our enter weight view. Open the MainStoryboard.storyboard
    file, and zoom in on the center weight scene.


    Drag a label from the library and drop it anywhere in the view. Double-click the
    label, and change the text to **Enter Today’s Weight**. In the Attributes inspector,
    change the font to System Bold 24.0. You can tap the Fonts icon to bring up the
    Fonts window. Next, choose Editor > Size to Fit Content from the menu bar. Finally,
    center the label along the top of the view using the guidelines (**Figure 4.1**).


    Drag out a second label and position it below the first. Change its text to **Current
    Date and Time**. Don’t worry, that’s just a placeholder. We will replace this
    text at runtime. Of course, we don’t know exactly how long the date and time string
    will be, but we still want it centered under our title. The easiest way to do
    this is to set the label’s Alignment attribute to Centered, and then stretch the
    label so that it fills the view from margin to margin (**Figure 4.2**).


    Next, place a text field under the Current Date label. Stretch it so that it also
    fills the view from margin to margin. Set the attributes as shown in **Table 4.1**.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'TABLE 4.1 Text Field Attributes


    | ATTRIBUTE NAME | VALUE |

    |---|---|

    | Alignment | Centered |

    | Capitalization | None |

    | Correction | No |

    | Keyboard | Numbers and Punctuation |

    | Return Key | Done |

    | Auto-enable Return Key | On |


    ![](img/fe9fea534a8e7868f811f7cd33da015f_180_0.png)


    **FIGURE 4.3** Completed enter weight view controller scene


    Whew, that’s a lot of settings. Let’s step through them one at a time. We want
    to restrict the input to valid decimal numbers. Also, since we’re only allowing
    numbers, it doesn’t make sense to enable autocorrection and capitalization. We
    may as well turn them off. The Numbers and Punctuation keyboard gives us all the
    keys we need (all the numbers, a Return key, and—for US English—a period). It
    actually allows too many characters, so we’ll need to filter our input. We’ll
    cover that in a bit.


    The last two settings will help us create a more streamlined user interface. Essentially,
    we want to automatically create a new WeightEntry object and switch to the graph
    view as soon as the user presses the Return key. This reduces the total number
    of taps needed to enter a new weight. To help support this, we change the Return
    key’s label to Done to better communicate our intent. More importantly, auto-enabling
    the Return key means it will be disabled as long as the text field is empty. The
    system automatically enables the Return key once the user has entered some text.
    This—when paired with our input filtering—will guarantee that we have a valid
    weight entry whenever the Return key is pressed.


    The interface should now match **Figure 4.3**. The basics are in place, but we’re
    going to spice it up a bit.'
