- pgno: 280
  md: '# # WRAPPING UP


    In this chapter, we examined different techniques for drawing custom user interface
    elements. This included a discussion of how UIKit manages the drawing of views,
    a look at the differences between UIKit and Core Graphics, and some sample code
    demonstrating drawing techniques from both libraries. However, all the examples
    in this chapter focused on drawing a static view—a view whose contents rarely
    changed.


    We will take this one step further in Chapter 8, where we will look at custom-drawing
    a dynamic interface—an interface that is constantly changing. We will also look
    at incorporating Core Animation to move otherwise static UI elements onto and
    off of our screen. Finally, we will combine our custom drawing with custom event
    handling to create our own controls.


    In the meantime, Chapters 6 and 7 will focus on saving our user information. Chapter
    6 will look at techniques for saving our data model both to disk and to our iCloud
    storage. Then, in Chapter 7, we will replace our current model with a Core Data-based
    model.'
