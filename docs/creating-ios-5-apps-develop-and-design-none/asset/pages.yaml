  md: "This may seem a bit odd. After all, one of the main uses of objects is encapsulation.\
    \ Shouldn’t the instance variables be hidden inside the implementation? Well,\
    \ yes. In an ideal world they would be. However, earlier versions of the compiler\
    \ needed this information to lay out the memory of any subclasses. With Objective-C\
    \ 2.0, we can use properties to help get around this limitation. When you’re developing\
    \ for iOS or 64-bit applications for Mac OS X 10.5 and later, you can automatically\
    \ synthesize the instance variables for your properties. We will discuss properties\
    \ in more depth in the next section. Just be aware that the instance variables\
    \ declared in the interface may not tell the whole story.\n\nThe interface starts\
    \ with an `@interface` keyword and ends with `@end`. The format is shown here:\n\
    \n```\n```objective-c\n@interface ClassName : SuperClassName {\n\n    // Declare\
    \ instance variables here.\n\n    // These are optional in iOS if properties are\
    \ used.\n\n}\n\n// Declare public methods and properties here.\n@end\n```\n```\n\
    \nEvery class in your application needs a unique class name. If you’re building\
    \ a library that will be used in other projects, you will want to prefix your\
    \ class names to ensure that they won’t conflict with other libraries and frameworks.\
    \ Apple’s frameworks follow this advice, typically beginning their class names\
    \ with either NS or UI.\n\nEach class also has one and only one superclass. You\
    \ will usually use NSObject, unless you are explicitly subclassing another class.\
    \ The instance variables are defined within the curly brackets, and the instance\
    \ methods are defined after the brackets.\n\nThe actual code is stored in the\
    \ implementation file (filename ending in .m). Like the interface, the implementation\
    \ begins with an `@implementation` keyword and ends with `@end`. It will contain\
    \ only the method and property definitions.\n\n```\n```objective-c\n@implementation\
    \ ClassName\n\n// Define methods and properties here.\n\n@end\n```\n```\n\nWe\
    \ will discuss methods and properties in more detail in the next section."
