- pgno: 484
  md: "# CLASSES SUPPORTING THE APPLICATION PROXY\n\nTwo things must happen before\
    \ a class can support setting its appearance through an application proxy. First,\
    \ the class must adopt the UIAppearanceContainer protocol. Next, it must flag\
    \ the relevant accessors with the UI_APPEARANCE_SELECTOR tag.\n\nA quick search\
    \ shows that only the following classes currently support the appearance proxy:\n\
    \n+   - UIActivityIndicatorView\n+   - UIBarButtonItem\n+   - UIBarItem\n+   -\
    \ UINavigationBar\n+   - UIProgressView\n+   - UISearchBar\n+   - UISlider\n+\
    \   - UISwitch\n+   - UISegmentedControl\n+   - UITabBar\n+   - UITabBarItem\n\
    +   - UIToolbar\n\nUnfortunately, the documentation does not clearly label the\
    \ flagged accessors. However, if you have any questions, you can always open the\
    \ class's header file. For example, opening UIActivityIndicatorView.h shows that\
    \ only the color property is properly flagged (OK, you probably could have guessed\
    \ that from the docs, but still...).\n\nMost notably, UIButton is missing from\
    \ this list. So, even though iOS 5.0 adds a tintColor property, this property\
    \ may not do what you want. It won't actually change the color of a rounded rectangle\
    \ (though, see our custom buttons in the \"Rounding Corners with Core Animation\"\
    \ section of Chapter 4). And we cannot simply modify the proxy; we must modify\
    \ the appearance of each button individually. We'll see this when we create custom\
    \ buttons using resizable images, coming up next.\n\n```\nUIProgressView* proxy\
    \ =\n[UIProgressView appearanceWhenContainedIn:[PopupView class], nil];\n\nproxy.progressTintColor\
    \ = [UIColor colorWithRed:0.5\n                                           green:0.0\n\
    \                                            blue:0.0\n                      \
    \                     alpha:1.0];\n\nproxy.trackTintColor = [UIColor colorWithRed:0.5\n\
    \                                       green:0.3\n                          \
    \              blue:0.3\n                                       alpha:1.0];\n\
    ```"
  merge: -1
