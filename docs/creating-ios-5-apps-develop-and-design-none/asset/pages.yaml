  md: '# SINGLETONS


    In its most basic concept, a singleton is a class that will only ever have a single

    object instantiated from it. Whenever you request a new object of that class,
    you

    gain a pointer back to the original.


    Singletons are typically used to represent objects where only a single version

    exists. The UIApplication class is a good example. Each application has one and

    only one application object. Furthermore, you can access that application anywhere

    through the [UIApplication sharedApplication] method.


    Of course, singletons are a constant source of Internet debates. Some argue

    that they are the spawn of all that is evil and that they should be avoided like
    the

    plague. If you use singletons, the terrorists win. Or, somewhat more rationally,
    a

    singleton is nothing more than an over-engineered global variable with good PR.


    There is some truth to these complaints. When developers first encounter the

    singleton pattern, they often overdo it. Too many singletons can make your code

    very hard to follow. Singletons are also deceptively hard to write correctly (and

    there are different ideas about what “correctly” means). However, they can be

    incredibly useful when used appropriately. Most importantly, Cocoa Touch uses

    a number of singleton classes—so you should at least understand the basics, even

    if you never write your own.


    The following is a typical, relatively safe implementation. In the class’s header

    file, declare a class method to access your shared instance:


    ```

    + (SampleSingleton*)sharedSampleSingleton;

    ```


    Then open the implementation file and add an extension to your class. This

    extension will declare a private designated initializer.


    ```

    @interface SampleSingleton()

    - (id)initSharedInstance;

    @end

    ```


    Remember, we can call any method on any object—declaring the initializer as

    private only communicates our intent. Developers should only call methods that

    are declared in the header file—in this case, the developers should only access
    the

    shared object through the sharedSampleSingleton method.'
