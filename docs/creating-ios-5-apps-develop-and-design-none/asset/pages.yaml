- pgno: 247
  md: 'Here, we assign the weightEntries argument to our entries property. As we discussed
    earlier, this is a copy property, so it will make a new copy of the entire array.
    This prevents others from accidentally changing the array out from under us. Next,
    we handle the corner case where the weightEntries argument is empty. Here, we
    create a new NSDate object set to the current date and time. We assign this date
    object to both the starting date and the ending date (ensuring that these values
    are the same). Then we set everything else to zero. Finally, we just return without
    doing any additional calculations.


    ```

    // The weight entries are in order from newest to oldest.

    // Ending date is stored in the first entry.

    id myEntry = [weightEntries objectAtIndex:0];

    self.endingDate = [myEntry date];

    // Starting date is stored in the last entry.

    myEntry = [weightEntries lastObject];

    self.startingDate = [myEntry date];

    self.duration =

    [self.endingDate timeIntervalSinceDate:self.startingDate];

    ```


    From here on, we know that we have at least one WeightEntry in our array, so we
    start calculating the start and end dates. While we could scan over the entire
    array looking for the entries with the earliest and latest dates, this is not
    necessary. If you remember, our code in Chapter 4 kept our weights in strict date
    order. The newest entry is always at the front of the array, the oldest at the
    end. Knowing this, we can just grab those values directly. We calculate the array''s
    duration by calling timeIntervalSinceDate:. This gives us an NSTimeInterval containing
    the number of seconds between the two dates. The duration is a positive number
    if the calling date occurs later than the argument date. If it''s earlier, timeIntervalSinceDate:
    returns a negative number.'
