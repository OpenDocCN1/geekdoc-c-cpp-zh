  md: "# # SEPARATING DYNAMIC AND STATIC VIEWS\n\nWe looked at drawing custom views\
    \ in Chapter 5. However, that chapter focused on drawing a single, static view.\
    \ Now we need to create a dynamic view. Our view needs to change over time—ideally,\
    \ we would like to update it at 60 frames per second. That means we need to update\
    \ it frequently, and each time we update it, we need to redraw it quickly.\n\n\
    Fortunately, not everything changes. At any given time, most of our view remains\
    \ static, and only a small section changes. We need to update our cursor's position,\
    \ and we need to draw a line from our old position to our new one. Other than\
    \ that, everything else remains untouched.\n\nWe will create a new UIView subclass,\
    \ Canvas, to handle our custom drawing. However, we will actually split the drawing\
    \ into three sections: the background, the line, and the cursor. The background\
    \ will remain static. It won't change at all. Our line will change. We continue\
    \ to add new segments to it, but the existing portions remain untouched. We simply\
    \ accumulate new line segments as time passes. Finally, the cursor will change\
    \ its location but not its appearance as it moves about the screen.\n\nLet's start\
    \ by looking at the Canvas class and its companion CanvasViewController. View\
    \ and view controller pairs are typically created in one of two ways. They are\
    \ either loaded from a nib (possibly as part of a storyboard) or created in code.\
    \ In this case, we will do everything in code.\n\nWe instantiate our view controller\
    \ by calling its designated initializer, initWithNibName:bundle:. Now, when we\
    \ pass a nil-valued nib name, the system expects that we will either provide a\
    \ nib file whose name matches our view controller (in this case, CanvasViewController.nib)\
    \ or override the controller's loadView method. In our case, we simply use loadView\
    \ to instantiate our Canvas view and set its background color.\n\n```\n```objc\n\
    // Implement loadView to create a view hierarchy programmatically,\n// without\
    \ using a nib.\n- (void)loadView\n{\n    self.view = [[Canvas alloc] init];\n\
    \    self.view.backgroundColor = [UIColor lightGrayColor];\n}\n```\n```"
