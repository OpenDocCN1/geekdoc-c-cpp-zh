- pgno: 456
  md: "Traditionally, we would do this using a mutex to block access to critical sections.\n\
    In Objective-C, we could do this by adding the `@synchronized` directive. However,\n\
    starting with iOS 4.0, we have a better way.\n\niOS 4.0 brought Grand Central\
    \ Dispatch (GCD) to iOS. GCD is a block-based\ntechnology that lets us manage\
    \ concurrency without explicitly using threads. It is\nhighly optimized, and it\
    \ can automatically balance access to system resources based\non your system’s\
    \ capabilities. For example, it will automatically split a concurrent\ntask among\
    \ more threads when running on a 12-core Mac Pro than it does when\nrunning on\
    \ an iPhone 4.\n\nFor more information, check out the Grand Central Dispatch Reference\
    \ and\nthe Concurrency Programming Guide in Apple’s documentation. In this chapter,\n\
    we simply use GCD to place tasks on a background queue or to move tasks back to\n\
    the main thread. We will also use it here, to protect critical sections.\n\nWe\
    \ start by creating a dispatch queue in Canvas’s `initWithFrame:` method.\n\n\
    ```\n```objective-c\n_serialQueue = dispatch_queue_create(\n    \"com.freelancemadscience.GravityScribbler.canvas\"\
    ,\n    DISPATCH_QUEUE_SERIAL);\n```\n```\n\nThe `dispatch_queue_create()` function\
    \ takes two arguments. The label can\nbe used to identify our queue in the debugger\
    \ and in crash reports. We use reverse\nDNS-style naming to guarantee that we\
    \ have a unique label for our queue. Next,\nthe `DISPATCH_QUEUE_SERIAL` attribute\
    \ defines our queue as a serial queue.\n\n> **NOTE:** While GCD greatly simplifies\
    \ concurrent programming,\n> it doesn’t protect us from all the ugly, underlying\
    \ details. For example,\n> we can still create deadlocks by nesting `dispatch_sync()`\
    \ calls (e.g.,\n> `dispatch_sync(queue, ^{dispatch_sync(queue, ^{[self myMethod]});});`).\n\
    > The primary advantage of using `dispatch_sync()` over block-based\n> threading\
    \ is simply performance. GCD code will run significantly faster\n> than its block-based\
    \ equivalent.\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_456_0.png)"
