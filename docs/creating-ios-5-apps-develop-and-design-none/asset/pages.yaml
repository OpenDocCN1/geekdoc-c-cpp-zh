  md: 'with the old software. Fortunately, the fix is easy. They just need to update
    the software on all their devices.


    Alternatively, their device might be running out of memory, and there simply isn’t
    space to save the iCloud document locally. This can be more complicated. The user
    will need to delete some of the content off their device, freeing up more space.


    In both cases, the best we can do is to try to detect the problem, alert the user,
    and provide some reasonable suggestions for how they can fix it. We cannot do
