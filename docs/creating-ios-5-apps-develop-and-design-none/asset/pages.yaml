    \ with the argument type in parentheses and the argument's name.\n\n```\n    -\
    \ (void)simple;                       // No arguments, no return\n           \
    \                              // value.\n    - (int)count;                  \
    \      // No arguments, returns an\n                                         //\
    \ integer.\n    - (NSString*) nameForID:(int)id;     // Takes an integer argument.\n\
