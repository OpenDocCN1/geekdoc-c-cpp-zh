- pgno: 485
  md: "![](img/fe9fea534a8e7868f811f7cd33da015f_485_0.png)\n\nHowever, since we only\
    \ have a single UIProgressView instance in this application, setting the tint\
    \ colors in the nib is probably the path of least resistance.\n\n# RESIZABLE AND\
    \ TILED IMAGES\n\nOften, we want to modify a view or control by adding a custom\
    \ background image. The naïve approach is to simply create an image that is the\
    \ exact size needed by our interface. This, however, has two problems. First,\
    \ it wastes a lot of memory, since we need to load all these full-size images\
    \ into memory. Second, it limits our flexibility. If we want to resize the control,\
    \ we need to redesign our background image as well.\n\nFortunately, iOS offers\
    \ a solution: We can use resizable or tiled images. Admittedly, iOS has supported\
    \ stretchable and tiled images since iOS 2.0; however, the old stretchableImageWithLeftCapWidth:topCapHeight:\
    \ method has been deprecated and replaced with the new resizableImageWithCapInsets:\
    \ method. Resizable images give us a greater range of options than their older,\
    \ stretchable cousins.\n\nLet’s start with tiled images. We’ll create two different\
    \ versions of our background image. The first will be a 24 x 24 pixel image named\
    \ tile.png. The system will use this for lower-resolution screens. The second\
    \ will be a 48 x 48 pixel version named tile@2x.png for devices with Retina displays\
    \ (Figure 8.8).\n\nNow we load the tile image using UIImage’s imageNamed: convenience\
    \ method. This will automatically load the correct tile image, based on the current\
    \ device’s screen scale.\n\n```\n```\nself.tileImage = [UIImage imageNamed:TileImageName];\n\
    ```\n```\n\nTo draw our tiled background, we simply create a UIColor using the\
    \ image as a pattern. We can then set this as our fill color, and fill in any\
    \ closed path. In this application, we use it in PopupView’s drawRect: method\
    \ to draw the view’s background.\n\n```\n```\n- (void)drawRect:(CGRect)rect\n\
    {\n    // Draw the background with rounded corners and a tiled body.\n    UIColor*\
    \ border = [[UIColor blackColor]\n                        colorWithAlphaComponent:0.75f];\n\
    \    [border setStroke];\n```\n```"
  merge: -1
