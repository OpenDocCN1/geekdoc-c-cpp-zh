- pgno: 486
  md: "```\n```objective-c\nUIColor* fill = [UIColor colorWithPatternImage:self.tileImage];\n\
    [fill setFill];\nUIBezierPath* path =\n[UIBezierPath\n    bezierPathWithRoundedRect:\n\
    \    CGRectInset(self.bounds, 1.0f, 1.0f)\n    byRoundingCorners:UIRectCornerAllCorners\n\
    \    cornerRadii:CGSizeMake(20.0f, 20.0f)];\npath.lineWidth = 2.0f;\n[path fill];\n\
    [path stroke];\n// Not strictly necessary since we're subclassing\n// UIView directly\n\
    [super drawRect:rect];\n}\n```\n```\n\nUIKit will draw repeated copies of our\
    \ image pattern both vertically and horizontally to fill the entire path. In this\
    \ case, we’re filling in the rounded rectangle and then drawing a 2-point-wide\
    \ border around it. Notice that we inset our rounded rectangle by half our line\
    \ width. This gives us enough space to draw our entire line, while still filling\
    \ the view. This is then used as the background for our pop-ups, like our acceleration\
    \ control, giving us a nice tessellated background (Figure 8.9).\n\nNext, let’s\
    \ look at creating resizable images. We will use these for the buttons in our\
    \ export menu. Just like the tile image, we need to create two versions, one for\
    \ low-resolution screens, the other for Retina displays (Figure 8.10). This time\
    \ they will be 20 x 20 pixels and 40 x 40 pixels.\n\nTo make a resizable image,\
    \ we take a normal UIImage and call its resizableImageWithCapInsets: method. This\
    \ takes a single argument, a UIEdgeInsets structure holding the value of the cap\
    \ insets on the top, left, bottom, and right.\n\nWhen this image is resized, the\
    \ areas covered by the cap insets are drawn normally. Areas between the cap insets\
    \ are tiled to fill in the remaining space both horizontally and vertically. In\
    \ our application, we create resizable images for our buttons during the ExportViewController’s\
    \ tableView:cellForRowAtIndexPath: method."
  merge: -1
  img_proc: true
- pgno: 487
  md: "**FIGURE 8.9** Our tiled background in action\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_487_0.png)\n\
    \n![](img/fe9fea534a8e7868f811f7cd33da015f_487_1.png)\n\n**FIGURE 8.10** Low-\
    \ and high-resolution resizable images\n\n```\n```objectivec\nUIImage* button\
    \ = [UIImage imageNamed:@\"Button\"];\n\nUIEdgeInsets insets =\nUIEdgeInsetsMake(10.0f,\
    \ 10.0f, 9.0f, 9.0f);\n\nUIImage* resizableButton =\n[button resizableImageWithCapInsets:insets];\n\
    \n[cell.button setBackgroundImage:resizableButton\n                forState:UIControlStateNormal];\n\
    ```\n```\n\nAgain, we load the correct image by calling imageNamed:. We then define\
    \ our insets. In our case, we are leaving only a single point both vertically\
    \ and horizontally. When the image is stretched horizontally, the column of pixels\
    \ at x = 10 will be used to fill in the extra width. Similarly, when stretched\
    \ vertically, the row at y = 10 will be used. On a regular display, both of these\
    \ are a single pixel wide, so that pixel will be used for the entire width (or\
    \ height). On a Retina display, these regions are actually two pixels wide, so\
    \ the rows (or columns) will be tiled to fill the extra space. We can see the\
    \ resizable images in action by opening our application's export menu using a\
    \ horizontal three-finger swipe (**Figure 8.11**)."
  merge: -1
