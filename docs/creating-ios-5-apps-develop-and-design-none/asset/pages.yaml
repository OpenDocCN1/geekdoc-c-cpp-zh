  md: 'We can subclass UIManagedDocument to modify its default behaviors. For example,
    we can change the name of the persistent store in our document package. We can
    change the type of persistent store or modify how the document models or stores
    are created. We can even enable support for saving and loading data from outside
    Core Data. For more information, check out the UIManagedDocument Class Reference.


    # ### iCLOUD LIMITATIONS


    Now for the bad news. Currently, using Core Data on iCloud imposes the following
    restrictions:


    +   - No support for ordered relationships.


    +   - We cannot use mapping models to migrate our schema. Lightweight migration
    is still OK.


    +   - When creating a new store, we should not populate it with a pre-existing
    database file. If we need to set up some initial data, we should either programmatically
    create the data in code or use `NSPersistentStoreCoordinator''s migratePersistentStore:toURL:options:withType:error:`
    to load the data from an existing file.


    For more information, be sure to look over the latest release notes.


    # ### CORE DATA PERFORMANCE


    Core Data is a mature, efficient object graph management framework. Its classes
    have been highly optimized. For example, NSManagedObject instances use reflection
    to examine their internal data. The managed object then leverages this information
    to optimize access to this data. Therefore, accessing values from an NSManagedObject
    is often faster than comparable accessors on generic Objective-C objects.


    SQLite-based persistent stores help us minimize the number of objects held in
    active memory, letting us fetch and hold only the objects we need. This is especially
    important for iOS applications, since memory management remains one of our key
    concerns.


    Still, there are some key points to remember to avoid poor performance.'
